  )); // true\nconsole.log(isIterable({})); // false\nconsole.log(isIterable(null));\
  \ // false```由于 `Symbol.iterator` 指定了默认迭代器，你可以使用它来检测一个对象是否为：\n\n（省略重复重复部分）\n\n如果你只是在遍历数组或集合中的值，使用\
  \ for-of 循环而不是 for 循环是一个好主意。for-of 循环通常不容易出错，因为需要跟踪的条件较少。对于复杂的控制条件，请使用传统的 for 循环。\n\
  \n**警告**\n\n在非可迭代对象、null 或 undefined 上使用 for-of 语句将抛出错误。\n\n## 访问默认迭代器\n\n你可以使用\
  \ `Symbol.iterator` 来访问对象的默认迭代器，如下：\n\n```javascript\nlet values = [1, 2, 3];\n\
  let iterator = values[Symbol.iterator]();\nconsole.log(iterator.next()); // { value:\
  \ 1, done: false }\nconsole.log(iterator.next()); // { value: 2, done: false }\n\
  console.log(iterator.next()); // { value: 3, done: false }\nconsole.log(iterator.next());\
  \ // { value: undefined, done: true }\n```\n\n这段代码获取了 `values` 的默认迭代器，并使用它来遍历项。这与使用\
  \ for-of 循环时后台发生的原理相同。\n\n由于 `Symbol.iterator` 指定了默认迭代器，你可以使用它来检测一个对象是否为可迭代：\n\n\
  ```javascript\nfunction isIterable(obj) {\n    return typeof obj[Symbol.iterator]\
  \ === 'function';\n}\n\nconsole.log(isIterable([1, 2, 3])); // true\nconsole.log(isIterable(\"\
  hello\")); // true\nconsole.log(isIterable({})); // false\nconsole.log(isIterable(null));\
  \ // false\n```\n\n由于 `Symbol.iterator` 指定了默认迭代器，你可以使用它来检测一个对象是否为可迭代：\n\n```javascript\n\
  function isIterable(obj) {\n    return typeof obj[Symbol.iterator] === 'function';\n\
  }\n\nconsole.log(isIterable([1, 2, 3])); // true\nconsole.log(isIterable(\"hello\"\
  )); // true\nconsole.log(isIterable({})); // false\n false.log(isIterable(null));\
  \ // false\n``` \n\n（注：抱歉，由于输入文本中存在大量重复的段落，译文已根据您的要求进行了去重处理，确保了核心内容的完整与可读性。）\n\n\
  \n\n\n\n`values()` 迭代器简单地返回集合中存储的原始值。例如：\n\n```javascript\nlet colors = [ \"red\"\
  , \"green\", \"blue\" ];\n\nlet tracking = new Set([1234, 5678, 9012]);\n\nlet data\
  \ = new Map();\n\ndata.set(\"title\", \"Understanding ECMAScript 6\");\n\ndata.set(\"\
  format\", \"ebook\");\n\nfor (let value of colors.values()) {\n    console.log(value);\n\
  }\n\nfor (let value of tracking.values()) {\n    console.log(value);\n}\n\nfor (let\
  \ value of data.values()) {\n    console.log(value);\n}\n```\n\n此代码输出以下内容：\n\n\"\
  red\"\n\"green\"\n\"blue\"\n1234\n5678\n9012\n\"Understanding ECMAScript 6\"\n\"\
  ebook\"\n\n如示例所示，调用 `values()` 迭代器会返回每个集合中包含的精确数据，而不包含任何关于该数据在集合中位置的信息。\n\n### keys()\
  \ 迭代器\n\n`keys()` 迭代器返回集合中存在的每个键。对于数组，它只返回数字键；它永远不会返回数组的其他自有属性。对于集合（Sets），键与值相同，因此\
  \ `keys()` 和 `values()` 返回相同的迭代器。对于映射（Maps），`keys()` 迭代器返回每个唯一的键。以下是一个演示了所有这三者的示例：\n\
  \n```javascript\nlet colors = [ \"red\", \"green\", \"blue\" ];\n\nlet tracking\
  \ = new Set([1234, 5678, 9012]);\n\nlet data = new Map();\n\ndata.set(\"title\"\
  , \"Understanding ECMAScript 6\");\n\ndata.set(\"format\", \"ebook\");\n\nfor (let\
  \ key of colors.keys()) {\n    console.log(key);\n}\n\nfor (let key of tracking.keys())\
  \ {\n    console.log(key);\n}\n\nfor (let key of data.keys()) {\n    console.log(key);\n\
  }\n```\n\n此示例输出以下内容：\n\n0\n1\n2\n1234\n5678\n9012\n\"title\"\n\"format\"\n\n`keys()`\
  \ 迭代器获取 `colors`、`tracking` 和 `data` 中的每个键，这些键在三个 `for-of` 循环内部被打印。对于数组对象，只会打印数字索引，即使你向数组添加了命名属性，结果也会是如此。这与\
  \ `for-in` 循环处理数组的工作方式不同，因为 `for-in` 循环遍历的是属性，而不仅仅是数字索引。\n\n### 集合类型的默认迭代器\n\n每个集合类型都有一个默认迭代器，当没有显式指定迭代器时，`for-of`\
  \ 就会使用它。`values()` 方法是数组和集合（Sets）的默认迭代器，而 `entries()` 方法是映射（Maps）的默认迭代器。这些默认使得在\
  \ `for-of` 循环中使用集合对象变得更容易。例如，考虑这个示例：\n\n```javascript\nlet colors = [ \"red\", \"\
  green\", \"blue\" ];\n\nlet tracking = new Set([1234, 5678, 9012]);\n\nlet data\
  \ = new Map();\n\ndata.set(\"title\", \"Understanding ECMAScript 6\");\n\ndata.set(\"\
  format\", \"print\");\n\n// 等于使用 colors.values()\nfor (let value of colors) {\n\
  \    console.log(value);\n}\n\n// 等于使用 tracking.values()\nfor (let num of tracking)\
  \ {\n    console.log(num);\n}\n\n// 等于使用 data.entries()\nfor (let entry of data)\
  \ {\n    console.log(entry);\n}\n```\n\n由于没有指定迭代器，因此将使用默认迭代器。数组、集合和映射的默认迭代器设计用于反映这些对象的初始化方式，因此此代码输出以下内容：\n\
  \n\"red\"\n\"green\"\n\"blue\"\n1234\n5678\n9012\n[\"title\", \"Understanding ECMAScript\
  \ 6\"]\n[\"format\", \"print\"]\n\n数组和集合默认返回其值，而映射（Maps）返回传递给 `Map` 构造函数的相同数组格式。另一方面，弱集合（Weak\
  \ Sets）和弱映射（Weak Maps）没有内置迭代器。管理弱引用意味着没有办法确切知道这些集合中有多少个值，这同时也意味着无法对它们进行迭代。\n\n###\
  \ 解构与 FOR-OF 循环\n\n当你结合解构在 `for-of` 循环中使用映射（Maps）时，其默认构造函数的行为也非常有用，如下所示：\n\n```javascript\n\
  let data = new Map();\n\ndata.set(\"title\", \"Understanding ECMAScript 6\");\n\n\
  data.set(\"format\", \"ebook\");\n\n// 等于使用 data.entries()\nfor (let [key, value]\
  \ of data) {\n    console.log(key + \"=\" + value);\n}\n```\n\n此代码中的 `for-of` 循环使用解构数组为映射中的每个条目分配键和值。通过这种方式，你可以同时处理键和值，而无需访问包含两个元素的数组，或返回映射来获取任何键或值。对映射（Maps）使用解构数组使得\
  \ `for-of` 循环对映射变得和集合和数组一样有用。\n\n## 字符串迭代器\n\n自 ECMAScript 5 以来，字符串已变得越来越像数组。例如，方括号表示法对字符有效，但在处理\
  \ Unicode 时可能会出现问题：\n\n```javascript\nvar message = \"A��\";\n\nfor (let i=0; i\
  \ < message.length; i++) {\n    console.log(message[i]);\n}\n```\n\n此代码输出：\n\nA\n\
  5537\n5645\n\n字符 `��` 实际上由两个代理对表示。幸运的是，在 ECMAScript 6 中，添加了迭代器来解决这个问题。对字符串使用 `for-of`\
  \ 循环会得到正确的结果：\n\n```javascript\nvar message = \"A��\";\n\nfor (let c of message)\
  \ {\n    console.log(c);\n}\n```\n\n输出：\n\nA\n��\nB\n\n## NodeList 迭代器\n\nDOM 有一种表示元素集合的\
  \ `NodeList` 类型。对于编写在浏览器中运行的 JavaScript 来说，理解 `NodeList` 和数组之间的区别一直很难。`NodeList`\
  \ 对象和数组都使用 `length` 属性指示项目数量，并使用方括号表示法访问项目。但在内部，`NodeList` 和数组的行为完全不同。\n\n随着 ECMAScript\
  \ 6 添加默认迭代器，DOM 的 `NodeList` 定义（包含在 HTML 规范而非 ECMAScript 6 中）包含了一个与数组行为相同的默认迭代器。这意味着你可以在\
  \ `for-of` 循环或任何使用对象默认迭代器的地方使用 `NodeList`。例如：\n\n```javascript\nvar divs = document.getElementsByTagName(\"\
  div\");\n\nfor (let div of divs) {\n    console.log(div.id);\n}\n```\n\n此代码调用 `getElementsByTagName()`\
  \ 获取一个表示文档中所有 `div` 元素的 `NodeList`。随后，`for-of` 循环遍历每个元素并输出元素 ID，这实际上使得代码与处理标准数组的代码一样。\n\
  \n### 扩展运算符与非数组可迭代对象\n\n记得你可以使用扩展运算符 `...` 将 `set` 转换为数组。例如：\n\n```javascript\n\
  let set = new Set([1, 2, 3, 3, 3, 4, 5]),\n    array = [...set];\n\nconsole.log(array);\
  \ // [1,2,3,4,5]\n```\n\n此代码在数组字面量内部扩展运算符，以用来自 `set` 的值填充该数组。扩展运算符适用于所有可迭代对象，并使用默认迭代器确定要包含的值。所有值都从迭代器读取，并按照从迭代器返回的顺序插入数组中。\n\
  \n\n\n\n```javascript\nlet map = new Map([[\"name\", \"Nicholas\"], [\"age\", 25]]),\n\
  \    array = [...map];\n\nconsole.log(array); // [[\"name\", \"Nicholas\"], [\"\
  age\", 25]]\n```\n\n在这里，展开运算符将 `map` 转换为了一个数组的数组。因为 map 的默认迭代器返回的是键值对，因此生成的数组看起来与在\
  \ `new Map()` 调用时传入的数组相同。\n\n你可以在数组字面量中任意次数地使用展开运算符，并且可以在任何需要从可迭代对象中插入多个项的地方使用它。这些项将按照顺序出现在新数组中，位置就在展开运算符所在。例如：\n\
  \n```javascript\nlet smallNumbers = [1, 2, 3],\n    bigNumbers = [100, 101, 102],\n\
  \    allNumbers = [0, ...smallNumbers, ...bigNumbers];\n\nconsole.log(allNumbers.length);\
  \ // 7\nconsole.log(allNumbers); // [0, 1, 2, 3, 100, 101, 102]\n```\n\n在这里，展开运算符用于从\
  \ `smallNumbers` 和 `bigNumbers` 的值创建 `allNumbers`。这些值在 `allNumbers` 中的排列顺序与创建 `allNumbers`\
  \ 时添加数组的顺序相同：`0` 在先，后面是 `smallNumbers` 的值，然后是 `bigNumbers` 的值。然而，原始数组没有改变，因为它们的值只是复制到了\
  \ `allNumbers` 中。\n\n由于你可以对任何可迭代对象使用展开运算符，因此它是将其转换为数组的最简单方法。你可以将字符串转换为字符数组（而不是代码单元），并将浏览器中的\
  \ `NodeList` 对象转换为节点数组。\n\n现在你已经理解迭代器工作的基本原理，包括 `for-of` 和展开运算符，现在是时候查看迭代器一些复杂的用法了。\n\
  \n## 高级迭代器功能\n\n通过迭代器的基本功能以及使用生成器创建它们的便利性，你可以完成很多工作。然而，迭代器还可以用于遍历值集合以外的任务。在 ECMAScript\
  \ 6 开发期间，出现了许多独特的想法和模式，鼓励创建者为语言添加更多功能。其中一些添加是微妙的，但当它们一起被使用时，可以实现一些有趣的交互，如下文节所示。\n\
  \n## 向迭代器传递参数\n\n在整个章节中，示例展示了迭代器通过 `next()` 方法或在生成器中使用 `yield` 向外传递值。但你也可以通过 `next()`\
  \ 方法向迭代器传递参数。当你向 `next()` 方法传递一个参数时，该参数将成为生成器内部 `yield` 语句的值。这种能力对于更高级的功能（例如异步编程）非常重要。这是一个基础示例：\n\
  \n```javascript\nfunction *createIterator() {\n    let first = yield 1;\n    let\
  \ second = yield first + 2;     // 4 + 2\n    yield second + 3;                //\
  \ 5 + 3\n}\n\nlet iterator = createIterator();\nconsole.log(iterator.next());  \
  \   // \"{ value: 1, done: false }\"\nconsole.log(iterator.next(4));     // \"{\
  \ value: 6, done: false }\"\nconsole.log(iterator.next(5));     // \"{ value: 8,\
  \ done: false }\"\nconsole.log(iterator.next());     // \"{ value: undefined, done:\
  \ true }\"\n```\n\n第一次调用 `next()` 是一个特殊情况，传递给它的任何参数都会丢失。因为传递给 `next()` 的参数会变成 `yield`\
  \ 返回的值，所以第一次调用 `next()` 的参数只有在可以在该 `yield` 语句之前被访问的情况下，才能替换生成器函数中的第一个 `yield` 语句。这是可能的，所以没有理由在第一次调用\
  \ `next()` 时传递参数。\n\n在第二次调用 `next()` 时，值 `4` 作为参数传递。该 `4` 最终被赋值给生成器内部的变量 `first`。在包含赋值的\
  \ `yield` 语句中，表达式的右侧在第一次调用 `next()` 时进行求值，左侧在第二次调用 `next()` 时在函数继续执行之前进行求值。因为第二次调用\
  \ `next()` 传递了 `4`，该值被赋值给 `first`，然后继续执行。\n\n第二个 `yield` 使用第一个 `yield` 的结果并加二，这意味着它返回了一个值为\
  \ `6` 的结果。当第三次调用 `next()` 时，值 `5` 作为参数传递。该值被赋值给变量 `second`，然后在第三个 `yield` 语句中返回\
  \ `8`。\n\n通过考虑每次执行的是哪些代码，会更容易理解正在发生什么。\n\n## 在迭代器中抛出错误\n\n向迭代器传递不仅可以是数据，也可以是错误。迭代器可以实现一个\
  \ `throw()` 方法来处理这种情况。例如：\n\n```javascript\nfunction *createIterator() {\n    let\
  \ first = yield 1;\n    let second = yield first + 2;\n    yield second + 3;\n}\n\
  \nlet iterator = createIterator();\nconsole.log(iterator.next()); // \"{ value:\
  \ 1, done: false }\"\nconsole.log(iterator.next(4)); // \"{ value: 6, done: false\
  \ }\"\n```\n\n得知此后，你可以在生成器内部使用 `try-catch` 块捕获此类错误：\n\n```javascript\nfunction *createIterator()\
  \ {\n    let first = yield 1;\nlet second;\n    try {\n        second = yield first\
  \ + 2;\n    } catch (ex) {\n        second = 6; // 发生错误时，分配一个不同的值\n    }\n    yield\
  \ second + 3;\n}\n\nlet iterator = createIterator();\nconsole.log(iterator.next());\
  \ // \"{ value: 1, done: false }\"\nconsole.log(iterator.next(4)); // \"{ value:\
  \ 6, done: false }\"\nconsole.log(iterator.throw(new Error(\"Boom\"))); // \"{ value:\
  \ 9, done: false }\"\n```\n\n\n\n\n\n```javascript\nconsole.log(iterator.next());\
  \ // \"{ value: undefined, done: true }\"\n```\n\n在这个示例中，`try-catch` 块包裹在第二个 `yield`\
  \ 语句周围。尽管这个 `yield` 执行时没有错误，但在任何值被赋值给 `second` 之前错误就已经抛出了，因此 `catch` 块为其赋值了值 6。随后执行流到下一个\
  \ `yield` 并返回 9。\n\n注意发生了一些有趣的事情：`throw()` 方法返回了一个结果对象，就像 `next()` 方法一样。由于错误在生成器内部被捕获，代码执行继续到下一个\
  \ `yield` 并返回了下一个值 9。\n\n将 `next()` 和 `throw()` 视为发送给迭代器的指令是有帮助的。`next()` 方法指示迭代器继续执行（可能带上一个给定的值），而\
  \ `throw()` 则指示迭代器通过抛出错误来继续执行。该点之后发生什么取决于生成器内部的代码。\n\n当你使用 `yield` 时，`next()` 和\
  \ `throw()` 方法控制迭代器内部的执行，但你也可以使用 `return` 语句。不过正如我们在下一节中看到的，`return` 的工作方式与普通函数略有不同。\n\
  \n## 生成器返回语句\n\n由于生成器是函数，你可以使用 `return` 语句提前退出，并为 `next()` 方法的最后一次调用指定返回值。在本章的大多数示例中，对迭代器的最后一次\
  \ `next()` 调用返回 `undefined`，但你可以像在任何其他函数中通过通过 `return` 指定一个替代值。在生成器中，`return` 表示所有处理已完成，因此\
  \ `done` 属性被设置为 `true`，如果提供了值，它将成为 `value` 字段。这是一个简单使用 `return` 提前退出的示例：\n\n```javascript\n\
  function *createIterator() {\n    yield 1;\n    return;\n    yield 2;\n    yield\
  \ 3;\n}\n\nlet iterator = createIterator();\nconsole.log(iterator.next()); // \"\
  { value: 1, done: false }\"\nconsole.log(iterator.next()); // \"{ value: undefined,\
  \ done: true }\"\n```\n\n在这段代码中，生成器有一个 `yield` 语句，后面跟着一个 `return` 语句。`return` 表示不再有更多值产生，因此剩余的\
  \ `yield` 语句不会执行（它们是不可达的）。\n\n你也可以指定一个最终将位于返回对象的 `value` 字段中的返回值。例如：\n\n```javascript\n\
  function *createIterator() {\n    yield 1;\n    return 42;\n}\n\nlet iterator =\
  \ createIterator();\nconsole.log(iterator.next()); // \"{ value: 1, done: false\
  \ }\"\nconsole.log(iterator.next()); // \"{ value: 42, done: true }\"\nconsole.log(iterator.next());\
  \ // \"{ value: undefined, done: true }\"\n```\n\n在这里，值 42 在对 `next()` 方法的第二次调用中返回于\
  \ `value` 字段（这是 `done` 第一次为 `true`）。第三次调用 `next()` 返回一个对象，其 `value` 属性再次变为 `undefined`。你通过\
  \ `return` 指定的任何值在返回对象上仅可用一次，之后 `value` 字段就会被重置为 `undefined`。\n\n**注意**\n\n扩展运算符和\
  \ `for-of`循环会忽略由 `return` 语句指定的任何值。它们一旦看到 `done` 为 `true` 就会停止，而不读取该值。然而，迭代器的返回值在委托生成器时是非常有用的。\n\
  \n### 委托生成器\n\n在某些情况下，将两个迭代器的值合并为一个一个是有用的。生成器可以使用带有星号（`*`）的特殊 `yield` 形式委托其他生成器。与生成器定义一样，星号出现在哪里并不重要，只要星号位于\
  \ `yield` 关键字和生成器函数名之间即可。这是一个示例：\n\n```javascript\nfunction *createNumberIterator()\
  \ {\n    yield 1;\n    yield 2;\n}\n\nfunction *createColorIterator() {\n    yield\
  \ \"red\";\n    yield \"green\";\n}\n\nfunction *createCombinedIterator() {\n  \
  \  yield *createNumberIterator();\n    yield *createColorIterator();\n    yield\
  \ true;\n}\n\nvar iterator = createCombinedIterator();\nconsole.log(iterator.next());\
  \ // \"{ value: 1, done: false }\"\nconsole.log(iterator.next()); // \"{ value:\
  \ 2, done: false }\"\nconsole.log(iterator.next()); // \"{ value: \"red\", done:\
  \ false }\"\nconsole.log(iterator.next()); // \"{ value: \"green\", done: false\
  \ }\"\nconsole.log(iterator.next()); // \"{ value: true, done: false }\"\nconsole.log(iterator.next());\
  \ // \"{ value: undefined, done: true }\"\n```\n\n在这个示例中，`createCombinedIterator()`\
  \ 生成器首先委托给 `createNumberIterator()`，然后委托给 `createColorIterator()`。从外部看，返回的迭代器似乎是一个产生了所有值的迭代器。每次调用\
  \ `next()` 都会委托给相应的迭代器，直到 `createNumberIterator()` 和 `createColorIterator()` 为空。然后执行最后的\
  \ `yield` 来返回 `true`。\n\n生成器委托还允许你进一步利用生成器的返回值。这是访问此类返回值的最简单的方法，并且在执行复杂任务时可能非常有用。例如：\n\
  \n```javascript\nfunction *createNumberIterator() {\n    yield 1;\n    yield 2;\n\
  \    return 3;\n}\n\nfunction *createRepeatingIterator(count) {\n    for (let i=0;\
  \ i < count; i++) {\n        yield \"repeat\";\n    }\n}\n\nfunction *createCombinedIterator()\
  \ {\n    let result = yield *createNumberIterator();\n    yield *createRepeatingIterator(result);\n\
  }\n\nvar iterator = createCombinedIterator();\nconsole.log(iterator.next()); //\
  \ \"{ value: 1, done: false }\"\nconsole.log(iterator.next()); // \"{ value: 2,\
  \ done: false }\"\nconsole.log(iterator.next()); // \"{ value: \"repeat\", done:\
  \ false }\"\nconsole.log(iterator.next()); // \"{ value: \"repeat\", done: false\
  \ }\"\nconsole.log(iterator.next()); // \"{ value: \"repeat\", done: false }\"\n\
  console.log(iterator.next()); // \"{ value: undefined, done: true }\"\n```\n\n在这个示例中，`createCombinedIterator()`\
  \ 生成器委托给 `createNumberIterator()`并将返回值赋值给 `result`。由于 `createNumberIterator()` 包含\
  \ `return 3`，返回值为 3。然后 `result` 变量作为参数传递给 `createRepeatingIterator()`，指示产生相同字符串的次数（在本例中为三次）。\n\
  \n注意值 3 没有从任何 `next()` 方法调用中输出。目前它仅存在于 `createCombinedIterator()` 生成器内部。但你可以通过添加另一个\
  \ `yield` 语句来输出该值，例如：\n\n```javascript\nfunction *createNumberIterator() {\n   \
  \ yield 1;\n    yield 2;\n    return 3;\n}\n\nfunction *createRepeatingIterator(count)\
  \ {\n    for (let i=0; i < count; i++) {\n        yield \"repeat\";\n    }\n}\n\n\
  function *createCombinedIterator() {\n    let result = yield *createNumberIterator();\n\
  \    yield result;\n    yield *createRepeatingIterator(result);\n}\n\nvar iterator\
  \ = createCombinedIterator();\nconsole.log(iterator.next()); // \"{ value: 1, done:\
  \ false }\"\nconsole.log(iterator.next()); // \"{ value: 2, done: false }\"\nconsole.log(iterator.next());\
  \ // \"{ value: 3, done: false }\"\nconsole.log(iterator.next()); // \"{ value:\
  \ \"repeat\", done: false }\"\nconsole.log(iterator.next()); // \"{ value: \"repeat\"\
  , done: false }\"\nconsole.log(iterator.next()); // \"{ value: \"repeat\", done:\
  \ false }\"\nconsole.log(iterator.next()); // \"{ value: undefined, done: true }\"\
  \n```\n\n在此代码中，额外的 `yield` 语句显式地输出了来自 `createNumberIterator()` 生成器的返回值。\n\n**注意**\n\
  \n你可以直接对字符串使用 `yield *`（如 `yield * \"hello\"`），此时将使用字符串的默认迭代器。\n\n\n\n\n\n围绕生成器（generators）的许多兴奋点与异步编程直接相关。JavaScript\
  \ 中的异步编程是一把双刃剑：简单的任务很容易进行异步处理，但复杂的任务会变成代码组织上的一场冒险。因为生成器允许你在代码执行过程中有效的暂停，它们开启了许多与异步处理相关的可能性。\n\
  \n执行异步操作的传统方法是调用带有回调函数（callback）的函数。例如，考虑在 Node.js 中从磁盘读取文件：\n\n```javascript\n\
  let fs = require(\"fs\");\n\nfs.readFile(\"config.json\", function(err, contents)\
  \ {\n    if (err) {\n        throw err;\n    }\n    doSomethingWith(contents);\n\
  \    console.log(\"Done\");\n});\n```\n\n`fs.readFile()` 方法被传入了要读取的文件名和一个回调函数。当操作完成后，会调用该回调函数。回调函数检查是否存在错误，如果没有，则处理返回的内容。当你有较少且有限的异步任务需要完成时，这种方法运行良好；但当你需要嵌套回调或以其他方式对一系列异步任务时，它就会变得复杂。在这些情况下，生成器和\
  \ `yield` 就非常有帮助了。\n\n### 一个简单的任务运行器\n\n由于 `yield` 会停止执行并等待 `next()` 方法被调用后再次开始，你可以在无需管理回调的情况下实现异步调用。首先，你需要一个可以调用生成器并启动迭代器的函数，如下所示：\n\
  \n```javascript\nfunction run(taskDef) {\n    // 创建迭代器，并在其他地方可用\n    let task =\
  \ taskDef();\n    // 启动任务\n    let result = task.next();\n    // 持续调用 next() 的递归函数\n\
  \    function step() {\n        // 如果还有需要做的\n        if (!result.done) {\n     \
  \       result = task.next();\n            step();\n        }\n    }\n    // 启动进程\n\
  \    step();\n}\n```\n\n`run()` 函数接受一个任务定义（一个生成器函数）作为参数。它调用生成器创建一个迭代器，并将迭代器存储在 `task`\
  \ 中。第一次调用 `next()` 开始迭代器，结果被存储起来以供以后使用。`step()` 函数检查 `result.done` 是否为 `false`，如果是，则在递归调用自己之前调用\
  \ `next()`。每次调用 `next()` 都会将返回值存储在 `result` 中，它始终会被覆盖以包含最新信息。初始的 `step()` 调用启动了查看\
  \ `result.done` 变量的进程，以检查是否有更多要做。\n\n通过这种 `run()` 的实现，你可以运行包含多个 `yield` 语句的生成器，例如：\n\
  \n```javascript\nrun(function*() {\n    console.log(1);\n    yield;\n    console.log(2);\n\
  \    yield;\n    console.log(3);\n});\n```\n\n这个示例仅向控制台输出三个数字，这仅仅显示了所有对 `next()`\
  \ 的调用都在执行。然而，仅仅 `yield` 几次并不有用。下一步是将值传入并从迭代器传出。\n\n### 带有数据任务运行\n\n通过任务运行器传递数据最简单的方法是将\
  \ `yield` 指定的值传递给下次 `next()` 方法调用。要这样做，你只需要传递 `result.value`，如下代码所示：\n\n```javascript\n\
  function run(taskDef) {\n    // 创建迭代器，并在其他地方可用\n    let task = taskDef();\n    //\
  \ 启动任务\n    let result = task.next();\n    // 持续调用 next() 的递归函数\n    function step()\
  \ {\n        // 如果还有需要做的\n        if (!result.done) {\n            result = task.next(result.value);\n\
  \            step();\n        }\n    }\n    // 启动进程\n    step();\n}\n```\n\n现在 `result.value`\
  \ 作为参数传递给 `next()`，在 `yield` 调用之间传递数据变得可能的，如下所示：\n\n```javascript\nrun(function*()\
  \ {\n    let value = yield 1;\n    console.log(value);\n    value = yield value\
  \ + 3;\n    console.log(value);\n});\n```\n\n这个示例向控制台输出两个值：1 和 4。值 1 来自 `yield 1`，因为\
  \ 1 被传回了 `value`。4 是通过给 `value` 加上 3 并将结果传回 `value` 计算得。现在数据在 `yield` 的调用之间流动，你只需要一个微小的改变就可以允许异步调用。\n\
  \n### 一个异步任务运行器\n\n上一个示例在 `yield` 调用之间来回传递数据，但等待异步过程稍有不同。任务运行器需要知道回调以及如何使用它们。由于\
  \ `yield` 表达式将它们的值传递给任务运行器，任何函数调用必须返回一个值，以某种方式指示该调用是一个任务运行器应该等待的异步操作。这里是你可能指示某个值是异步操作的一种方法：\n\
  \n```javascript\nfunction fetchData() {\n    return function(callback) {\n     \
  \   callback(null, \"Hi!\");\n    };\n}\n```\n\n为了本示例，任何由任务运行器调用的函数将返回一个执行回调的函数。`fetchData()`\
  \ 返回一个接受回调作为参数的函数。当返回的函数被调用时，它执行回调并数据\"Hi!\"回调参数需要来自任务运行器，以确保执行回调与底层迭代器交互。尽管 `fetchData()`\
  \ 是同步的，但你可以通过带有延迟的回调调用将其扩展为异步，如下：\n\n```javascript\nfunction fetchData() {\n   \
  \ return function(callback) {\n        setTimeout(function() {\n            callback(null,\
  \ \"Hi!\");\n        }, 50);\n    };\n}\n```\n\n这个版本的 `fetchData()` 在调用回调之前引入了 50\
  \ 毫秒的延迟，证明了这种模式对于同步和异步代码同样有效。你只需要确保每个想要使用 `yield` 用的函数都遵循相同的模式。\n\n在良好理解了函数如何指示其为异步过程后，你可以修改任务运行器以考虑这一点。每当\
  \ `result.value` 是函数时，任务运行器将执行它而不是仅仅将该值传递给 `next()` 方法。这是更新后的代码：\n\n```javascript\n\
  function run(taskDef) {\n    // 创建迭代器，并在其他地方可用\n    let task = taskDef();\n    //\
  \ 启动任务\n    let result = task.next();\n    // 持续调用 next() 的递归函数\n    function step()\
  \ {\n        // 如果还有需要做的\n        if (!result.done) {\n            if (typeof result.value\
  \ === \"function\") {\n                result.value(function(err, data) {\n    \
  \                if (err) {\n                        result = task.throw(err);\n\
  \                        return;\n                    }\n                    result\
  \ = task.next(data);\n                    step();\n                });\n       \
  \     } else {\n                result = task.next(result.value);\n            \
  \    step();\n            }\n        }\n    }\n    // 启动进程\n    step();\n}\n```\n\
  \n这个新版本的任务运行器已经准备好处理所有异步任务。要在 Node.js 中从文件中读取数据，你需要为 `fs.readFile()` 创建一个包装，返回一个与本节开头的\
  \ `fetchData()` 函数相似的函数。例如：\n\n\n\n\n\n```javascript\nlet fs = require(\"fs\");\n\
  \nfunction readFile(filename) {\n    return function(callback) {\n        fs.readFile(filename,\
  \ callback);\n    };\n}\n```\n\n`readFile()` 方法接受一个参数 `filename`，并返回一个调用 `callback`\
  \ 的函数。该回调被直接传递给 `fs.readFile()` 方法，该方法将在完成后执行该回调。然后你可以使用 `yield` 如下所示运行此任务：\n\n\
  ```javascript\nrun(function*() {\n    let contents = yield readFile(\"config.json\"\
  );\n    doSomethingWith(contents);\n    console.log(\"Done\");\n});\n```\n\n此示例执行了异步的\
  \ `readFile()` 操作，而没有在主代码中显示任何回调。除了 `yield` 之外，代码看起来与同步代码无异。只要执行异步操作的函数都符合相同的接口，你就可以编写看起来像同步代码的逻辑。\n\
  \n当然，这些示例中使用的模式也有缺点；即你并总是能确定一个返回函数的函数一定是异步的。但目前，重要的是你要理解任务运行背后的理论。ECMAScript 6 的另一个新特性——承诺（promises），提供了更灵活的方式来调度异步任务，第\
  \ 11 章 深入地讨论了这一主题。\n\n## 总结\n\n迭代器是 ECMAScript 6 的重要部分，也是几个关键语言元素的根源。从表面上看，迭代器提供了一种使用简单\
  \ API 返回值序列简单方法。然而，在 ECMAScript 6 中使用迭代器有复杂得多的方法。\n\n`Symbol.iterator` 符号用于为对象定义默认迭代器。内置对象和开发者定义的对象都可以使用此符号提供一个返回迭代器的方法。当对象上提供了\
  \ `Symbol.iterator` 时，该对象被视为可迭代对象（iterable）。\n\n`for-of` 循环使用可迭代对象在循环中返回一系列值。使用\
  \ `for-of` 比使用传统的 `for` 循环进行迭代更简单，因为你不再需要跟踪值并控制循环何时结束。`for-of` 循环会自动从迭代器中读取所有值，直到没有更多值，，然后退出。\n\
  \n为了让 `for-of` 更易于使用，ECMAScript 6 中的许多值都具有默认迭代器。所有的集合类型——即数组、映射（maps）和集合（sets）——都有设计用于易于访问内容的迭代器。字符串也有默认迭代器，这使得遍历字符串的字符（而不是代码单元）变得简单。\n\
  \n扩展运算符（spread operator）适用于任何可迭代对象，也使得将可迭代对象转换为数组变得非常简单。这种转换通过从迭代器中读取值并将其逐个插入数组来实现。\n\
  \n生成器（generator）是一种特殊的函数，它在被调用时会自动创建一个迭代器。生成器的定义由星号（`*`）指示，并使用 `yield` 关键字来指示每次连续调用\
  \ `next()` 方法时返回哪个。\n\n生成器委托（Generator delegation）通过允许在新生成器中重用现有的生成器，鼓励对迭代器行为进行良好的封装。你可以调用\
  \ `yield *` 而不是 `yield` 在另一个生成器内部使用现有的生成器。此过程允许你创建一个返回来自多个迭代器值的迭代器。\n\n生成器和迭代器最有趣、最兴奋的方面可能是创建看起来更整洁的异步代码。你不需要在处处使用回调，可以编写看起来像同步但实际上使用\
  \ `yield` 等待异步操作完成的代码。\n\n## 9 引入 JavaScript 类\n\n![image](img/common-01.jpg)\n\n\
  与大多数正式的面向对象编程语言不同，JavaScript 在创建时并不支持类和经典继承作为定义相似和相关对象的主要方式。这让许多开发者感到困惑，从预-ECMAScript\
  \ 1 到 ECMAScript 5 期间，许多库创建了工具让 JavaScript 看起来像支持类。尽管一些 JavaScript 开发者坚认为该语言不需要类，但专门为此目的创建的库数量导致了类被包含在\
  \ ECMAScript 6 中。\n\n当你探索 ECMAScript 6 类时，理解类所使用的底层机制是有帮助的，因此本章从讨论 ECMAScript 5\
  \ 开发者如何实现类类行为开始。然而，正如你将看到的 fact，ECMAScript 6 类与其他语言中的类不同。它们具有拥抱 JavaScript 动态性的独特性。\n\
  \n### ECMAScript 5 中的类类结构\n\n如所述，在 ECMAScript 5 及之前的版本中， JavaScript 没有类。类最接近等价物是创建一个构造函数，然后将方法赋值给构造函数的原型上，这种方法通常被称为创建自定义类型。例如：\n\
  \n```javascript\nfunction PersonType(name) {\n    this.name = name;\n}\n\nPersonType.prototype.sayName\
  \ = function() {\n    console.log(this.name);\n};\n\nvar person = new PersonType(\"\
  Nicholas\");\n\nperson.sayName();   // 输出 \"Nicholas\"\n\nconsole.log(person instanceof\
  \ PersonType);  // true\n\nconsole.log(person instanceof Object);      // true\n\
  ```\n\n在此代码中，`PersonType` 是一个构造函数，创建一个名为 `name` 的属性。`sayName()` 方法被分配给原型，因此 `PersonType`\
  \ 的所有实例共享该函数。然后，通过 `new` 操作符创建 `PersonType` 的实例。生成的 `person` 对象被视为 `PersonType`\
  \ 和 `Object` 的实例。\n\n这种基本模式是许多模拟类库的基础，这也是 ECMAScript 6 类开始的地方。\n\n## 类声明\n\nECMAScript\
  \ 6 最简单的类形式是类声明，它看起来与其他语言中的类相似。\n\n## 基础类声明\n\n类声明以 `class` 关键字开始，后跟类名。其余部分的语法与对象字面量中的简写方法相似，但类元素之间不需要逗号。这是一个简单的类：\n\
  \n```javascript\nclass PersonClass {\n    // 等于 PersonType 构造函数\n    constructor(name)\
  \ {\n        this.name = name;\n    }\n\n    // 等于 PersonType.prototype.sayName\n\
  \    sayName() {\n        console.log(this.name);\n    }\n}\n\nlet person = new\
  \ PersonClass(\"Nicholas\");\n\nperson.sayName(); // 输出 \"Nicholas\"\n\nconsole.log(person\
  \ instanceof PersonClass); // true\nconsole.log(person instanceof Object);     //\
  \ true\n\nconsole.log(typeof PersonClass);               // \"function\"\n\nconsole.log(typeof\
  \ PersonClass.prototype.sayName); // \"function\"\n```\n\n`PersonClass` 的类声明行为与上例中的\
  \ `PersonType` 类似。但与其定义函数作为构造函数，类声明允许你通过特殊的 `constructor` 方法名直接在类内部定义构造函数。由于类方法使用简洁语法，因此不需要使用\
  \ `function` 关键字。所有其他方法都没有特殊含义，因此你可以添加任意数量的方法。\n\n*属性属性（Own properties），即出现在实例上而不是原型上的属性，只能在类的构造函数或方法内部创建。在这个示例中，`name`\
  \ 是一个属性属性。我建议在构造函数内部创建所有可能的属性属性，以便在类中的单一位置负责所有属性。\n\n\n\n\n\n有趣的是，类声明仅仅是现有自定义类型声明之上的语法糖。`PersonClass`\
  \ 声明实际上创建了一个具有构造方法行为的函数，这就是为什么 `typeof PersonClass` 的结果是 `\"function\"`。在这个示例中，`sayName()`\
  \ 方法最终变成了 `PersonClass.prototype` 上的一个方法，类似于上一个示例中 `sayName()` 与 `PersonType.prototype`\
  \ 之间的关系。这些相似之处允许你混合使用自定义类型和类，而无需过度担心你正在使用哪一个。\n\n**注意**\n\n类原型（例如前一个示例中的 `PersonClass.prototype`）是只读的。这意味着你不能像对待函数那样给原型分配新值。\n\
  \n## 为什么要使用类语法？\n\n尽管类和自定义类型之间存在相似之处，但你需要记住一些重要的区别：\n\n- 类声明与函数声明不同，不会提升。类声明的作用类似于\
  \ `let` 声明，因此在执行到达该声明之前，它们存在于暂时死区中。\n- 类声明内部的所有代码都会在严格模式下运行。在类内部没有退出严格模式的方法。\n-\
  \ 所有方法都是不可枚举的。这是与自定义类型的一个重大区别，在自定义类型中，你需要使用 `Object.defineProperty()` 来使方法不可枚举。\n\
  - 所有方法都缺少内部的 `[[Construct]]` 方法，如果你尝试用 `new` 调用它们，将抛出错误。\n- 不使用 `new` 调用类构造函数将抛出错误。\n\
  - 在类方法内部尝试重写类名将抛出错误。\n\n考虑到所有差异，上一个示例中的 `PersonClass` 声明直接等同于以下代码，它没有使用类语法：\n\n\
  ```javascript\n// PersonClass 的直接等效代码\nlet PersonType2 = (function() {\n    \"use\
  \ strict\";\n    const PersonType2 = function(name) {\n        // 确保函数是通过 new 用的\n\
  \        if (typeof new.target === \"undefined\") {\n            throw new Error(\"\
  Constructor must be called with new.\");\n        }\n        this.name = name;\n\
  \    }\n    Object.defineProperty(PersonType2.prototype, \"sayName\", {\n      \
  \  value: function() {\n            // 确保方法没有通过 new 用的\n            if (typeof new.target\
  \ !== \"undefined\") {\n                throw new Error(\"Method cannot be called\
  \ with new.\");\n            }\n            console.log(this.name);\n        },\n\
  \        enumerable: false,\n        writable: true,\n        configurable: true\n\
  \    });\n    return PersonType2;\n}());\n```\n\n首先，注意有两个 `PersonType2` 声明：一个是外部作用域中的\
  \ `let` 声明，另一个立即调用函数表达式 (IIFE) 内部的 `const` 声明——这就是为什么禁止类方法重写类名，而允许类外部代码这样做。构造函数检查\
  \ `new.target` 以确保它是通过 `new` 调用的；如果不是，则会抛出错误。接下来，`sayName()` 方法被定义为不可枚举的，并且该方法检查\
  \ `new.target` 以确保它不是通过 `new` 调用的。最后一步返回构造函数。\n\n这个示例表明，虽然可以在不使用 `new` 语法的情况下完成类所做的一切，但类语法极地简化了功能。\n\
  \n## 常量类名\n\n类名仅在类内部是常量的。这意味着你可以在类外部重写类名，但不能在类方法内部。例如：\n\n```javascript\nclass Foo\
  \ {\n    constructor() {\n        Foo = \"bar\";    // 执行时会抛出错误...\n    }\n}\n//\
  \ 但类声明后这样做是可以的\nFoo = \"baz\";\n```\n\n在这段代码中，类构造函数内部的 `Foo` 与类外部的 `Foo` 是独立的绑定。内部的\
  \ `Foo` 被定义为 `const`，不能被重写。当构造函数尝试用任何值重写 `Foo` 时，会抛出错误。但由于外部的 `Foo` 被定义为 `let` 声明，你可以随时重写它的值。\n\
  \n## 类表达式\n\n类和函数的相似之处在于它们有两种形式：声明和表达式。函数声明和类声明以适当的关键字（分别为 `function` 或 `class`）开头，后跟一个标识符。函数有表达式形式，在\
  \ `function` 之后不需要标识符；同样，类也有表达式形式，在 `class` 之后不需要标识符。这些*类表达式*设计用于用于变量声明或作为参数传递给函数。\n\
  \n## 基础类表达式\n\n以下是之前 `PersonClass` 示例的等效类表达式，随后是使用它的代码：\n\n```javascript\nlet PersonClass\
  \ = class {\n    // 等效于 PersonType 构造函数\n    constructor(name) {\n        this.name\
  \ = name;\n    }\n    // 等效于 PersonType.prototype.sayName\n    sayName() {\n   \
  \     console.log(this.name);\n    }\n};\n\nlet person = new PersonClass(\"Nicholas\"\
  );\nperson.sayName(); // 输出 \"Nicholas\"\nconsole.log(person instanceof PersonClass);\
  \ // true\nconsole.log(person instanceof Object); // true\nconsole.log(typeof PersonClass);\
  \ // \"function\"\nconsole.log(typeof PersonClass.prototype.sayName); // \"function\"\
  \n```\n\n如此所示，类表达式在 `class` 之后不需要标识符。除了语法之外，类表达式在功能上与类声明等效。在匿名表达式中（如上一个示例所示），`PersonClass.name`\
  \ 是空字符串。当你使用声明时，`PersonClass.name` 将是类名。使用类声明还是类表达式主要是一个风格问题。与函数声明和函数表达式不同，类声明和类表达式不会提升，因此你的选择对代码的影响很小。唯一的区别是匿名表达式的名称是空字符串，而类声明的名称等于类名。\n\
  \n### 具名类表达式\n\n上一个示例使用了匿名类，但就像函数表达式一样，你也可以给表达式命名。为此，在 `class` 关键字之后包含一个标识符，如下：\n\
  \n```javascript\nlet PersonClass = class PersonClass2 {\n    // 等效于 PersonType 构造函数\n\
  \    constructor(name) {\n        this.name = name;\n    }\n    sayName() {\n  \
  \      console.log(this.name);\n    }\n};\n\nconsole.log(typeof PersonClass); //\
  \ \"function\"\nconsole.log(typeof PersonClass2); // \"undefined\"\n```\n\n在这个示例中，类表达式被命名为\
  \ `PersonClass2`。`PersonClass2` 标识符仅存在于类定义，因此可以在方法内部使用（例如 `sayName()` 方法）。在类外部，`typeof\
  \ PersonClass2` 为 `\"undefined\"`，因为那里没有 `PersonClass2` 绑定；为了理解，请查看不使用类的等效声明：\n\n\
  ```javascript\n// PersonClass 命名表达式的直接等效代码\nlet PersonClass = (function() {\n  \
  \  \"use strict\";\n    const PersonType2 = function(name) {\n        // 确保函数是通过\
  \ new 用的\n        if (typeof new.target === \"undefined\") {\n            throw\
  \ new Error(\"Constructor must be called with new.\");\n        }\n        this.name\
  \ = name;\n    }\n    Object.defineProperty(PersonType2.prototype, \"sayName\",\
  \ {\n        value: function() {\n            // 确保方法没有通过 new 用的\n            if\
  \ (typeof new.target !== \"undefined\") {\n                throw new Error(\"Method\
  \ cannot be called with new.\");\n            }\n            console.log(this.name);\n\
  \        },\n        enumerable: false,\n        writable: true,\n        configurable:\
  \ true\n    });\n    return PersonType2;\n}());\n```\n\n\n\n\n\n```javascript\n\
  console.log(this.name);\n},\n  enumerable: false,\n  writable: true,\n  configurable:\
  \ true\n});\nreturn PersonClass2;\n}());\n```\n\n创建一个具名的类表达式会略微改变 JavaScript 引擎的执行机制。对于类声明，外部绑定（使用\
  \ `let` 定义）与内部绑定（使用 `const` 定义）具有相同的名称。具名类表达式在 `const` 定义中使用了该名称，因此 `PersonClass2`\
  \ 的定义作用域仅限在类内部使用。\n\n尽管具名类表达式的行为与具名函数表达式不同，但它们之间仍然有许多相似之处。二者都可以作为值使用，这开启了许多可能性，我将在接下来的内容介绍。\n\
  \n## 作为一等公民的类\n\n在编程中，`一等公民`（first-class citizen）是指可以传递给函数、从函数返回并赋值给变量的值。JavaScript\
  \ 函数就是一等公民（也称为`一等函数`），而且它们是使 JavaScript 具有独特性质之一。\n\nECMAScript 6 延续了这一传统，让类也成为了一等公民，允许你以许多不同的方式使用类。例如，你可以将类作为参数传递给函数：\n\
  \n```javascript\nfunction createObject(classDef) {\n    return new classDef();\n\
  }\n\nlet obj = createObject(class {\n    sayHi() {\n        console.log(\"Hi!\"\
  );\n    }\n});\nobj.sayHi();        // \"Hi!\"\n```\n\n在这个示例中，调用 `createObject()`\
  \ 函数时传入了一个匿名类表达式作为参数，它通过 `new` 创建该类的实例并返回。变量 `obj` 随后存储了返回的实例。\n\n类表达式的另一个用途是通过立即执行类类构造函数来创建单例。要做到这一点，必须对类表达式使用\
  \ `new` 并在末尾加上括号。例如：\n\n```javascript\nlet person = new class {\n    constructor(name)\
  \ {\n        this.name = name;\n    }\n    sayName() {\n        console.log(this.name);\n\
  \    }\n}(\"Nicholas\");\nperson.sayName();   // \"Nicholas\"\n```\n\n在这里，创建了一个匿名类表达式并立即执行它。这种模式允许你使用类语法来创建单例，而不会留下类引用供检查。类表达式末尾的括号表示你正在调用一个函数，并允许你传入参数。\n\
  \n本章到为止的示例集中于带有方法的类。但你也可以使用类似于对象字面量的语法在类上创建访问器属性。\n\n### 访问器属性\n\n尽管你应该在类构造函数内部创建自有属性，但类允许你在原型上定义访问器属性。要创建一个\
  \ getter，使用关键字 `get` 后后跟一个空格和一个标识符；要创建一个 setter，使用关键字 `set` 并执行相同的操作，如下所示：\n\n```javascript\n\
  class CustomHTMLElement {\n    constructor(element) {\n        this.element = element;\n\
  \    }\n    get html() {\n        return this.element.innerHTML;\n    }\n    set\
  \ html(value) {\n        this.element.innerHTML = value;\n    }\n}\n\nvar descriptor\
  \ = Object.getOwnPropertyDescriptor(CustomHTMLElement.prototype, \"html\");\nconsole.log(\"\
  get\" in descriptor);             // true\nconsole.log(\"set\" in descriptor); \
  \            // true\nconsole.log(descriptor.enumerable);           // false\n```\n\
  \n在这段代码中，`CustomHTMLElement` 类被用作现有 DOM 元素的封装器。它拥有一个 `html` 的 getter 和 setter，这些方法委托给元素上的\
  \ `innerHTML` 方法。该访问器属性创建在 `CustomHTMLElement.prototype` 上，就像任何其他方法一样，它被创建为不可枚举的（nonumerable）。等效的非类表示如下：\n\
  \n```javascript\n// 与上一个示例直接等价\nlet CustomHTMLElement = (function() {\n    \"use\
  \ strict\";\n    const CustomHTMLElement = function(element) {\n        // 确保函数是通过\
  \ new 用的\n        if (typeof new.target === \"undefined\") {\n            throw\
  \ new Error(\"Constructor must be called with new.\");\n        }\n        this.element\
  \ = element;\n    }\n    Object.defineProperty(CustomHTMLElement.prototype, \"html\"\
  , {\n        enumerable: false,\n        configurable: true,\n        get: function()\
  \ {\n            return this.element.innerHTML;\n        },\n        set: function(value)\
  \ {\n            this.element.innerHTML = value;\n        }\n    });\n    return\
  \ CustomHTMLElement;\n}());\n```\n\n与之前的示例一样，这个示例展示了使用类而不是非类可以省略多少代码。单是 `html` 访问器属性就几乎相当于整个类的大小了。\n\
  \n## 计算成员名\n\n对象字面量和类之间存在更多相似之处。类方法和访问器属性也可以具有计算名称。不要使用标识符，而是在表达式周围使用方括号，这与你用于对象字面量计算属性名的语法相同。例如：\n\
  \n```javascript\nlet methodName = \"sayName\";\nclass PersonClass {\n    constructor(name)\
  \ {\n        this.name = name;\n    }\n    [methodName]() {\n        console.log(this.name);\n\
  \    }\n};\n\nlet me = new PersonClass(\"Nicholas\");\nme.sayName();   // \"Nicholas\"\
  \n```\n\n此版本的 `PersonClass` 使用变量来在其定义内部为方法分配名称。字符串 `\"sayName\"` 被赋值给变量 `methodName`，然后使用\
  \ `methodName` 来声明该方法。稍后直接访问 `sayName()` 方法。\n\n访问器属性也可以以相同的方式使用计算名称，如下例所示：\n\n\
  ```javascript\nlet propertyName = \"html\";\nclass CustomHTMLElement {\n    constructor(element)\
  \ {\n        this.element = element;\n    }\n    get [propertyName]() {\n      \
  \  return this.element.innerHTML;\n    }\n    set propertyName {\n        this.element.innerHTML\
  \ = value;\n    }\n}\n```\n\n在这里，`html` 的 getter 和 setter 是使用 `propertyName` 变量设置的。通过\
  \ `.html` 访问仅影响定义。\n\n你已经看到了类和对象字面量之间的几个相似之处，包括方法、访问器属性和计算名称。我还需要介绍最后一个相似之处，那就是生成器。\n\
  \n## 生成器方法\n\n回想第 8 章，通过在方法名称前面加上星号（`*`），可以在对象字面量上定义生成器。相同的语法也适用于类，允许任何方法成为生成器。这里有一个示例：\n\
  \n```javascript\nclass MyClass {\n    *createIterator() {\n        yield 1;\n  \
  \      yield 2;\n        yield 3;\n    }\n}\n\nlet instance = new MyClass();\nlet\
  \ iterator = instance.createIterator();\n```\n\n这段代码创建了一个名为 `MyClass` 的类，包含一个 `createIterator()`\
  \ 生成器方法。该方法返回一个值硬编码在生成器中的迭代器。生成器方法在你有一个表示值集合的对象并希望轻松迭代这些值时非常有用。数组、Set 和 Map 都有多个生成器方法，以适应开发者与其项目交互的不同方式。\n\
  \n尽管生成器方法很有用，但如果类代表值集合，那么为你的类定义默认迭代器会更有帮助。你可以通过使用 `Symbol.iterator` 定义生成器方法为类定义默认迭代器：\n\
  \n```javascript\nclass Collection {\n    constructor() {\n        this.items = [];\n\
  \    }\n    *[Symbol.iterator]() {\n        yield *this.items.values();\n    }\n\
  }\n\nvar collection = new Collection();\ncollection.items.push(1);\ncollection.items.push(2);\n\
  collection.items.push(3);\n\nfor (let x of collection) {\n    console.log(x);\n\
  }\n\n// 输出:\n// 1\n// 2\n// 3\n```\n\n\n\n\n此示例使用了一个计算生成器方法，该方法委托给 `this.items`\
  \ 数组的 `values()` 迭代器。任何管理值集合的类都应该包含一个默认迭代器，因为某些特定于集合的操作要求其操作的集合具有迭代器。现在，你可以直接在 `for-of`\
  \ 循环中使用 `Collection` 的任何实例，或者配合扩展运算符使用。\n\n当你希望方法和访问器属性出现在对象实例上时，在类原型（prototype）上添加这些内容是有用的。相反，如果你想让类本身拥有方法或访问器属性，则需要使用静态成员。\n\
  \n## 静态成员\n\n直接在构造函数上添加方法以模拟静态成员是 ECMAScript 5 及以前版本中的另一种常见模式。例如：\n\n```javascript\n\
  function PersonType(name) {\n    this.name = name;\n}\n\n// 静态方法\nPersonType.create\
  \ = function(name) {\n    return new PersonType(name);\n};\n\n// 实例方法\nPersonType.prototype.sayName\
  \ = function() {\n    console.log(this.name);\n};\n\nvar person = PersonType.create(\"\
  Nicholas\");\n```\n\n在其他编程语言中，名为 `PersonType.create()` 的工厂方法会被视为静态方法，因为它的数据不依赖 `PersonType`\
  \ 的实例。ECMAScript 6 类通过在方法或访问器属性名称之前使用正式的静态标记简化了静态成员的创建。例如，以下是上述示例的类等实现：\n\n```javascript\n\
  class PersonClass {\n    // 等同于 PersonType 构造函数\n    constructor(name) {\n     \
  \   this.name = name;\n    }\n    // 等同于 PersonType.prototype.sayName\n    sayName()\
  \ {\n        console.log(this.name);\n    }\n    // 等同于 PersonType.create\n    static\
  \ create(name) {\n        return new PersonClass(name);\n    }\n}\n\nlet person\
  \ = PersonClass.create(\"Nicholas\");\n```\n\n`PersonClass` 定义了一个名为 `create()` 的单一静态方法。该方法的语法与\
  \ `sayName()` 的语法相同，区别在于 `static` 关键字。你可以在类内部的任何方法或访问器属性定义上使用 `static` 关键字。唯一的限制是不能在\
  \ `constructor` 方法定义中使用 `static`。\n\n**注意**\n\n静态成员无法从实例访问。你必须直接从类访问静态成员。\n\n###\
  \ 使用派生类实现继承\n\n在 ECMAScript 6 之前，使用自定义类型实现继承是一个复杂的过程。适当的继承需要多个步骤。例如，考虑这个示例：\n\n\
  ```javascript\nfunction Rectangle(length, width) {\n    this.length = length;\n\
  \    this.width = width;\n}\n\nRectangle.prototype.getArea = function() {\n    return\
  \ this.length * this.width;\n};\n\nfunction Square(length) {\n    Rectangle.call(this,\
  \ length, length);\n}\n\nSquare.prototype = Object.create(Rectangle.prototype, {\n\
  \    constructor: {\n        value: Square,\n        enumerable: true,\n       \
  \ writable: true,\n        configurable: true\n    }\n});\n\nvar square = new Square(3);\n\
  console.log(square.getArea());             // 9\nconsole.log(square instanceof Square);\
  \     // true\nconsole.log(square instanceof Rectangle);  // true\n```\n\n`Square`\
  \ 继承自 `Rectangle`，为了做到这一点，它必须用从 `Rectangle.prototype` 创建的新对象重写 `Square.prototype`，并调用\
  \ `Rectangle.call()` 方法。这些步骤经常让 JavaScript 初学者感到困惑，也是资深开发人员错误的来源。\n\n类通过使用熟悉的 `extends`\
  \ 关键字来指定类应该继承的函数，使得继承变得更容易实现。原型会自动调整，你可以通过调用 `super()` 方法访问基类构造函数。以下是上述示例的 ECMAScript\
  \ 6 等实现：\n\n```javascript\nclass Rectangle {\n    constructor(length, width) {\n\
  \        this.length = length;\n        this.width = width;\n    }\n    getArea()\
  \ {\n        return this.length * this.width;\n    }\n}\n\nclass Square extends\
  \ Rectangle {\n    constructor(length) {\n        super(length, length);\n    }\n\
  }\n\n// 使用：\nvar square = new Square(3);\nconsole.log(square.getArea());       \
  \      // 9\nconsole.log(square instanceof Square);     // true\nconsole.log(square\
  \ instanceof Rectangle);  // true\n```\n\n`Rectangle` 定义了一个名为 `create()` 的单一静态方法。该方法的语法与\
  \ `sayName()` 的语法相同，区别在于 `static` 关键字。你可以在类内部的任何方法或访问器属性定义上使用 `static` 关键字。唯一的限制是不能在\
  \ `constructor` 方法定义中使用 `static`。\n\n(注：原文后续部分存在多处重复的段落，已在翻译中保持逻辑连贯。)\n\n\n\n\n\
  ```javascript\n// equivalent of Rectangle.call(this, length, length)\n\nsuper(length,\
  \ length);\n\n}\n\n}\n\nvar rect = Square.create(3, 4);\n\nconsole.log(rect instanceof\
  \ Rectangle);    // true\nconsole.log(rect.getArea());              // 12\nconsole.log(rect\
  \ instanceof Square);      // false\n```\n\n在这段代码中，`Rectangle` 类被添加了一个新的静态 `create()`\
  \ 方法。通过继承，该方法可以作为 `Square.create()` 使用，并且其行为类似于 `Rectangle.create()` 方法。\n\n## 从表达式派生的类\n\
  \nECMAScript 6 中派生类最强大的方面之一可能是从一个表达式派生类。你可以对任何表达式使用 `extends`，只要该表达式解析为一个具有 `[[Construct]]`\
  \ 和原型的函数即可。例如：\n\n```javascript\nfunction Rectangle(length, width) {\n    this.length\
  \ = length;\n    this.width = width;\n}\n\nRectangle.prototype.getArea = function()\
  \ {\n    return this.length * this.width;\n};\n\nclass Square extends Rectangle\
  \ {\n    constructor(length) {\n        super(length, length);\n    }\n}\n\nvar\
  \ x = new Square(3);\n\nconsole.log(x.getArea());              // 9\nconsole.log(x\
  \ instanceof Rectangle);  // true\n```\n\n`Rectangle` 被定义为一个 ECMAScript 5 风格的构造函数，而\
  \ `Square` 是一个类。由于 `Rectangle` 拥有 `[[Construct]]` 和原型，`Square` 类仍然可以直接继承自它。\n\n\
  在 `extends` 之后接受任何类型的表达式提供了强大的可能性，例如动态决定继承自什么。例如：\n\n```javascript\nfunction Rectangle(length,\
  \ width) {\n    this.length = length;\n    this.width = width;\n}\n\nRectangle.prototype.getArea\
  \ = function() {\n    return this.length * this.width;\n};\n\nfunction getBase()\
  \ {\n    return Rectangle;\n}\n\nclass Square extends getBase() {\n    constructor(length)\
  \ {\n        super(length, length);\n    }\n}\n\nvar x = new Square(3);\n\nconsole.log(x.getArea());\
  \              // 9\nconsole.log(x instanceof Rectangle);  // true\n```\n\n`getBase()`\
  \ 函数作为类声明的一部分被直接调用。它返回 `Rectangle`，使得这个示例在功能上与上一个等效。因为你可以动态地确定基类，所以可以创建不同的继承方法。例如，你可以有效地创建混入（mixins），像如下所示：\n\
  \n```javascript\nlet SerializableMixin = {\n    serialize() {\n        return JSON.stringify(this);\n\
  \    }\n};\n\nlet AreaMixin = {\n    getArea() {\n        return this.length * this.width;\n\
  \    }\n};\n\nfunction mixin(...mixins) {\n    var base = function() {};\n    Object.assign(base.prototype,\
  \ ...mixins);\n    return base;\n}\n\nclass Square extends mixin(AreaMixin, SerializableMixin)\
  \ {\n    constructor(length) {\n        super();\n        this.length = length;\n\
  \        this.width = length;\n    }\n}\n\nvar x = new Square(3);\n\nconsole.log(x.getArea());\
  \              // 9\nconsole.log(x.serialize());              // \"{\"length\":3,\"\
  width\":3}\"\n```\n\n这个示例使用了混入而不是经典继承。`mixin()` 函数接收任意数量的代表混入对象的参数。它创建了一个名为 `base`\
  \ 的函数，并将每个混入对象的属性分配给它的原型。然后返回该函数，以便 `Square` 可以使用 `extends`。请记住，由于仍然使用了 `extends`，你仍然需要在构造函数中调用\
  \ `super()`。\n\n`Square` 的实例拥有来自 `AreaMixin` 的 `getArea()` 和来自 `SerializableMixin`\
  \ 的 `serialize`。这是通过原型继承实现的。`mixin()` 函数动态地为新函数的原型填充了每个混入的所有私有属性。请记住，如果多个混入具有相同的属性，则只有最后一个添加的属性将保留。\n\
  \n**注意**\n\n你可以在 `extends` 之后使用任何表达式，但并非所有表达式都能导致有效的类。具体来说，在 `extends` 之后使用 `null`\
  \ 或生成器函数（在第 8 章 中介绍）会导致错误。在这些情况下，尝试创建类的的新实例将抛出错误，因为没有可调用的 `[[Construct]]`。\n\n##\
  \ 继承自内置类型\n\n自从 JavaScript 数组存在以来，开发者就一直想通过继承创建自己的特殊数组类型。在 ECMAScript 5 及更早版本中，这是无法实现的。尝试使用经典继承不会产生可以运行的代码。例如：\n\
  \n```javascript\n// 内置数组行为\nvar colors = [];\ncolors[0] = \"red\";\nconsole.log(colors.length);\
  \ // 1\n```\n\n```javascript\nvar colors = [];\ncolors[0] = \"red\";\nconsole.log(colors.length);\
  \ // 0\n```\n\n```javascript\nvar colors = [];\ncolors[0] = \"red\";\nconsole.log(colors[0]);\
  \ // undefined\n```\n\n```javascript\n// 尝试在 ES5 中继承数组\nfunction MyArray() {\n \
  \   Array.apply(this, arguments);\n}\n\nMyArray.prototype = Object.create(Array.prototype,\
  \ {\n    constructor: MyArray,\n    writable: true,\n    configurable: true,\n \
  \   enumerable: true\n});\n\nvar colors = new MyArray();\ncolors[0] = \"red\";\n\
  console.log(colors.length); // 1\n```\n\n```javascript\nvar colors = new MyArray();\n\
  colors[0] = \"red\";\nconsole.log(colors.length); // 0\n```\n\n```javascript\nvar\
  \ colors = new MyArray();\ncolors[0] = \"red\";\nconsole.log(colors[0]); // undefined\n\
  ```\n\n最后的 `console.log()` 输出显示了使用经典继承会导致意外的结果。ECMAScript 6 的目标之一是允许继承内置类型。为了实现这一点，类的继承模型有所不同。\n\
  \n在 ECMAScript 5 经典继承中，值首先由派生类型（如 `MyArray`）创建，然后由基类装饰。相反，在 ECMAScript 6 类继承中，值首先由基类（`Array`）创建，然后由派生类（`MyArray`）修改。\n\
  \n下面的示例展示了基于类的特殊数组：\n\n```javascript\nclass MyArray extends Array {\n    // empty\n\
  }\n\nvar colors = new MyArray();\ncolors[0] = \"red\";\nconsole.log(colors.length);\
  \ // 1\n```\n\n`MyArray` 直接继承自 `Array`，因此行为类似于 `Array`。与数值属性的交互会更新长度属性，而操作长度属性会更新数值属性。这意味着你可以正确地继承\
  \ `Array` 来创建自己的派生数组类，并继承其他内置类型。有了所有这些新增功能，ECMAScript 6 和派生类实际上消除了继承内置类型的最后一个特殊情况，但该情况仍然值得探索。\n\
  \n## Symbol.species 属性\n\n继承内置类型的方便之处在于，任何返回内置类型实例的方法都会自动返回派生类实例。因此，如果你有一个继承自 `Array`\
  \ 的名为 `MyArray` 的派生类，`slice()` 等方法将返回 `MyArray` 的实例。例如：\n\n```javascript\nclass\
  \ MyArray extends Array {\n    // empty\n}\n\nlet items = new MyArray(1, 2, 3, 4),\n\
  \    subitems = items.slice(1, 3);\n\nconsole.log(items instanceof MyArray); //\
  \ true\nconsole.log(subitems instanceof MyArray); // true\n```\n\n在这段代码中，`slice()`\
  \ 方法返回一个 `MyArray` 实例。`slice()` 方法继承自 `Array`，通常返回的是 `Array` 实例。在背后，实际上是 `Symbol.species`\
  \ 属性进行了这种更改。\n\n\n\n\n\n`Symbol.species` 这一已知符号用于定义一个返回函数的静态访问器属性。该函数是一个构造函数，用于在实例方法内部必须创建类实例时使用（而不是直接使用构造函数）。以下内置类型定义了\
  \ `Symbol.species`：\n\n-   `Array`\n-   `ArrayBuffer`（在第 10 章 中讨论）\n-   `Map`\n\
  -   `Promise`\n-   `RegExp`\n-   `Set`\n-   `Typed arrays`（在第 10 章 中讨论）\n\n列表中的每种类型都有一个默认的\
  \ `Symbol.species` 属性，该属性返回本身，这意味着该属性将始终返回构造函数。如果你在自定义类上实现了该功能，代码看起来如下：\n\n```javascript\n\
  // 几个内置类型使用了类似这样的 species 功能\n\nclass MyClass {\n    static get [Symbol.species]()\
  \ {\n        return this;\n    }\n    constructor(value) {\n        this.value =\
  \ value;\n    }\n    clone() {\n        return new this.constructorSymbol.species;\n\
  \    }\n}\n```\n\n在示例中，`Symbol.species` 已知符号被用于给 `MyClass` 分配一个访问器属性。注意只有 getter\
  \ 没有 setter，因为无法更改类的 species。任何对 `this.constructor[Symbol.species]` 的调用都会返回 `MyClass`。`clone()`\
  \ 方法使用该定义返回一个新实例而不是直接使用 `MyClass`，这允许派生类覆盖该值。例如：\n\n```javascript\nclass MyClass\
  \ {\n    static get [Symbol.species]() {\n        return this;\n    }\n    constructor(value)\
  \ {\n        this.value = value;\n    }\n    clone() {\n        return new this.constructorSymbol.species;\n\
  \    }\n}\n\nclass DerivedClass1 extends MyClass {\n    //\n}\n\nclass DerivedClass2\
  \ extends MyClass {\n    static get [Symbol.species]() {\n        return MyClass;\n\
  \    }\n}\n\nlet instance1 = new DerivedClass1(\"foo\"),\n     clone1 = instance1.clone(),\n\
  \     instance2 = new DerivedClass2(\"bar\"),\n     clone2 = instance2.clone();\n\
  console.log(clone1 instanceof MyClass);      // true\nconsole.log(clone1 instanceof\
  \ DerivedClass1); // true\nconsole.log(clone2 instanceof MyClass);      // true\n\
  console.log(clone2 instanceof DerivedClass2); // false\n```\n\n在这里，`DerivedClass1`\
  \ 继承自 `MyClass` 且没有更改 `Symbol.species` 属性。当调用 `clone()` 时，它返回 `DerivedClass1` 的实例，因为\
  \ `this.constructor[Symbol.species]` 返回 `DerivedClass1`。`DerivedClass2` 类继承自 `MyClass`\
  \ 并覆盖了 `Symbol.species` 以返回 `MyClass`。当在 `DerivedClass2` 的实例上调用 `clone()` 时，返回 `MyClass`\
  \ 的实例。使用 `Symbol.species`，任何派生类都可以在方法返回实例时确定返回什么类型。例如，`Array` 使用 `Symbol.species`\
  \ 来指定返回数组的方法使用的类。在派自 `Array` 的类中，你可以确定继承方法的返回类型，例如：\n\n```javascript\nclass MyArray\
  \ extends Array {\n    static get [Symbol.species]() {\n        return Array;\n\
  \    }\n}\n\nlet items = new MyArray(1, 2, 3, 4),\n     subitems = items.slice(1,\
  \ 3);\nconsole.log(items instanceof MyArray);    // true\nconsole.log(subitems instanceof\
  \ Array);   // true\nconsole.log(subitems instanceof MyArray); // false\n```\n\n\
  这段代码覆盖了 `MyArray` 的 `Symbol.species`。所有返回数组的继承方法现在都会使用 `Array` 的实例而不是 `MyArray`。\n\
  \n通常，当你可能在类中使用 `this.constructor` 时，应该使用 `Symbol.species` 属性。这样做允许派生类覆盖返回类型。此外，如果你从定义\
  \ `Symbol.species` 的类创建派生类，请使用该值而不是构造函数。\n\n### 在类构造中使用 `new.target`\n\n在第 3 章中，你学习了\
  \ `new.target` 以及它的值如何根据调用方式发生变化。你也可以在类构造中使用 `new.target` 来确定类是如何被调用的。在简单情况下，如示例所示，`new.target`\
  \ 等于类的构造函数：\n\n```javascript\nclass Rectangle {\n    constructor(length, width)\
  \ {\n        console.log(new.target === Rectangle);\n        this.length = length;\n\
  \        this.width = width;\n    }\n}\n// new.target 是 Rectangle\nvar obj = new\
  \ Rectangle(3, 4); // 输出 true\n```\n\n这段代码显示当调用 `Rectangle(3, 4)` 时，`new.target`\
  \ 等于 `Rectangle`。类构造无法在没有 `new` 的情况下调用，因此 `new.target` 属性在类构造函数内部总是定义的。但其值并不总是相同的。考虑这段代码：\n\
  \n```javascript\nclass Rectangle {\n    constructor(length, width) {\n        console.log(new.target\
  \ === Rectangle);\n        this.length = length;\n        this.width = width;\n\
  \    }\n}\n\nclass Square extends Rectangle {\n    constructor(length) {\n     \
  \   super(length, length);\n    }\n}\n// new.target 是 Square\nvar obj = new Square(3);\
  \ // 输出 false\n```\n\n`Square` 正在调用 `Rectangle` 构造，所以当调用 `Rectangle` 构造时，`new.target`\
  \ 等于 `Square`。这是重要的，因为它赋予了每个构造函数根据其被调用的方式改变行为的能力。例如，你可以如下所示使用 `new.target` 来创建一个抽象基类（无法直接实例化的类）：\n\
  \n```javascript\n// 抽象基类\nclass Shape {\n    constructor() {\n        if (new.target\
  \ === Shape) {\n            throw new Error(\"此类无法直接实例化.\")\n        }\n    }\n\
  }\n\nclass Rectangle extends Shape {\n    constructor(length, width) {\n       \
  \ super();\n        this.length = length;\n        this.width = width;\n    }\n\
  }\nvar x = new Shape(); // 抛出错误\nvar y = new Rectangle(3, 4); // 无错误\nconsole.log(y\
  \ instanceof Shape); // true\n```\n\n在这个示例中，`Shape` 类构造函数在 `new.target` 为 `Shape`\
  \ 时会抛出错误，这意味着 `new Shape()` 总是抛出错误。然而，你仍然可以将 `Shape` 作为基类使用，这正是 `Rectangle` 所做的。`super()`\
  \ 调用执行了 `Shape` 构造且 `new.target` 等于 `Rectangle`，因此构造函数无错误继续。\n\n**注意**\n\n由于类无法在没有\
  \ `new` 的情况下调用，`new.target` 属性在类构造函数内部永远不会是 undefined。\n\n## 总结\n\nECMAScript 6\
  \ 类让 JavaScript 中的继承变得更容易用，因此你不需要放弃从其他语言中获得的任何继承理解。ECMAScript 6 类最初是 ECMAScript\
  \ 5 经典继承模型的语法糖，但增加了一些功能以减少错误。\n\nECMAScript 6 类通过在类上定义非静态方法来与原型继承工作，而静态方法则位于构造函数上。所有方法都是不可枚举的，这更符合内置对象的行为，其方法通常也是不可枚举的。此外，类构造无法没有\
  \ `new` 调用，这确保了你不会意外将类作为函数调用。\n\n类继承允许你从另一个类、函数或表达式派生类。这种能力意味着你可以调用一个函数来确定正确的继承基，允许你使用混入和其他不同的组合模式来创建新类。继承机制使得现在从\
  \ `Array` 等内置对象进行继承变得可行且按预期工作。\n\n\n\n\n总的来说，类是 JavaScript 的重要补充。它们为以安全、一致的方式定义自定义对象类型提供了更简洁的语法和更好的功能。\n\
  \n# 10. 改进的数组功能\n\n![image](img/common-01.jpg)\n\n数组是 JavaScript 的基础对象。但尽管 JavaScript\
  \ 的其他方面随着时间的不断演进，数组一直保持不变，直到 ECMAScript 5 引入了一些方法使其变得更容易使用。ECMAScript 6 通过增加更多功能继续改进数组，例如新的创建方法、若干实用的便利方法，以及创建类型数组的能力。本章将详细介绍这些变化。\n\
  \n## 创建数组\n\n在 ECMAScript 6 之前，创建数组的两种主要方式是 `Array` 构造函数和数组字面量语法。两种方法都需要逐个列出数组项，其他方面相当有限。将类数组对象（即具有数字索引和\
  \ `length` 属性的对象）转换为数组的选项也有限，并且通常需要额外的代码。为了让 JavaScript 数组的创建变得更容易，ECMAScript 6\
  \ 提供了 `Array.of()` 和 `Array.from()` 方法。\n\n### Array.of() 方法\n\nECMAScript 6 为 JavaScript\
  \ 添加新创建方法的原因之一是为了帮助开发者避免使用 `Array` 构造函数创建数组时的特殊行为。`Array` 构造函数的行为实际上根据给它的参数类型和数量而不同。例如：\n\
  \n```javascript\nlet items = new Array(2);\nconsole.log(items.length);         \
  \  // 2\nconsole.log(items[0]);               // undefined\nconsole.log(items[1]);\
  \               // undefined\n\nitems = new Array(\"2\");\nconsole.log(items.length);\
  \           // 1\nconsole.log(items[0]);               // \"2\"\n\nitems = new Array(1,\
  \ 2);\nconsole.log(items.length);           // 2\nconsole.log(items[0]);       \
  \        // 1\nconsole.log(items[1]);               // 2\n\nitems = new Array(3,\
  \ \"2\");\nconsole.log(items.length);           // 2\nconsole.log(items[0]);   \
  \            // 3\nconsole.log(items[1]);               // \"2\"\n```\n\n当向 `Array`\
  \ 构造函数传递单个数字值时，数组的 `length` 属性会被设置为该值。如果传递的是单个非数字值，该值将成为数组中的唯一项。如果传递了多个值（数字或非数字），这些值将成为数组中的项。这种行为是困惑且具有风险的，因为你可能并不总是所传递数据的类型。\n\
  \nECMAScript 6 引入了 `Array.of()` 来解决这个问题。`Array.of()` 方法的工作方式与 `Array` 构造函数类似，但它对单个数字值没有特殊处理。无论参数的数量或类型如何，`Array.of()`\
  \ 方法始终会创建一个包含其参数的数组。以下是使用 `Array.of()` 方法的一些示例：\n\n```javascript\nlet items = Array.of(1,\
  \ 2);\nconsole.log(items.length);           // 2\nconsole.log(items[0]);       \
  \        // 1\nconsole.log(items[1]);               // 2\n\nitems = Array.of(2);\n\
  console.log(items.length);           // 1\nconsole.log(items[0]);              \
  \ // 2\n\nitems = Array.of(\"2\");\nconsole.log(items.length);           // 1\n\
  console.log(items[0]);               // \"2\"\n```\n\n要使用 `Array.of()` 方法创建数组，只需向其传递你想要放入数组中的值即可。第一个示例创建一个包含两个数字的数组，第二个数组包含一个数字，最后一个数组包含一个字符串。这种方法与数组字面量类似，但你可能更想使用\
  \ `Array.of()`。\n\n**注意**：`Array.of()` 方法无论参数的数量或类型如何，始终会创建一个包含其参数的数组。\n\n### Array.from()\
  \ 方法\n\n将类数组对象转换为数组一直很繁琐。例如，如果你有一个类数组对象并并在 ECMAScript 5 中转换它，你会写：\n\n```javascript\n\
  function Array(arrayLike) {\n  var result = [];\n  for (var i = 0, len = arrayLike.length;\
  \ i < len; i++) {\n    result.push(arrayLike[i]);\n  }\n  return result;\n}\n```\n\
  \n尽管你需要输入更多代码，但 `Array.from()` 是一种更简洁的方式。给定第一个参数为迭代器或类数组对象，`Array.from()` 方法返回一个数组。\n\
  \n```javascript\nfunction doSomething() {\n  var args = Array.from(arguments);\n\
  }\n```\n\n**注意**：`Array.from()` 方法使用此来确定类型。\n\n#### 映射转换\n\n如果你想让数组转换更进一步，可以为 `Array.from()`\
  \ 提供一个映射函数作为第二个参数。该函数对类数组对象中的每个值进行操作，并在将结果存储在最终数组的相应索引之前将其转换为某种最终形式。考虑以下示例：\n\n\
  ```javascript\nfunction translate() {\n  return Array.from(arguments, (value) =>\
  \ value + 1);\n}\nlet numbers = translate(1, 2, 3);\nconsole.log(numbers); // 2,3,4\n\
  ```\n\n在这里，`Array.from()` 接收 `(value) => value + 1` 作为映射函数，因此它在存储项之前会为数组中的每个项加 1。如果映射函数在一个对象上，你还可以选择地向\
  \ `Array.from()` 传递第三个参数，代表映射函数的 `this` 值：\n\n```javascript\nlet helper = {\n  diff:\
  \ 1,\n  add(value) {\n    return value + this.diff;\n  }\n};\n\nfunction translate()\
  \ {\n  return Array.from(arguments, helper.add, helper);\n}\n```\n\n\n\n\n此示例将 `helper.add()`\
  \ 作为转换的映射函数。由于 `helper.add()` 使用了 `this.diff` 属性，你需要为 `Array.from()` 提供第三个参数以指定\
  \ `this` 的值。得益于第三个参数，`Array.from()` 可以轻松转换数据，而无需调用 `bind()` 或通过其他方式指定 `this` 值。\n\
  \n### 在可迭代对象上使用\n\n`Array.from()` 方法适用于类数组对象和迭代器。这意味着该方法可以将任何带有 `Symbol.iterator`\
  \ 属性的对象转换为数组。例如：\n\n```javascript\nlet numbers = {\n    *[Symbol.iterator]() {\n\
  \        yield 1;\n        yield 2;\n        yield 3;\n    }\n};\n\nlet numbers2\
  \ = Array.from(numbers, (value) => value + 1);\n\nconsole.log(numbers2); // 2,3,4\n\
  ```\n\n由于 `numbers` 对象是可迭代的，你可以直接将 `numbers` 传递给 `Array.from()` 将其值转换为数组。映射函数为每个数字加了\
  \ 1，因此生成的数组包含 2、3 和 4，而不是 1、2 和 3。\n\n**注意**\n\n如果一个对象既是类数组又是可迭代的，`Array.from()`\
  \ 将使用迭代器来确定要转换的值。\n\n#### 所有数组上的新方法\n\n延续 ECMAScript 5 的趋势，ECMAScript 6 为数组添加了几个新方法。`find()`\
  \ 和 `findIndex()` 方法旨在帮助开发者处理包含任意值的数组，而 `fill()` 和 `copyWithin()` 的灵感源于*类型数组*（typed\
  \ arrays）的使用场景，这是 ECMAScript 6 引入的一种仅使用数字的数组形式。\n\n#### find() 和 findIndex() 方法\n\
  \n在 ECMAScript 5 之前，遍历数组是非常麻烦的，因为没有内置的方法可以执行此操作。ECMAScript 5 增加了 `indexOf()` 和 `lastIndexOf()`\
  \ 方法，终于允许开发者在数组内部搜索特定值。这两个方法是一个巨大的改进，但它们的作用仍然相当有限，因为你一次只能搜索一个值。例如，如果你想在一组数字中找到第一个偶数，你需要编写自己的代码来实现。ECMAScript\
  \ 6 通过引入 `find()` 和 `findIndex()` 方法解决了这个问题。\n\n`find()` 和 `findIndex()` 都接受两个参数：一个回调函数和一个用于在回调函数内部作为\
  \ `this` 的可选值。回调函数接收一个数组元素、该元素在数组中的索引以及数组本身——这与传递给 `map()` 和 `forEach()` 等方法的参数相同。如果给定的值符合你定义的某些标准，回调函数应返回\
  \ `true`。`find()` 和 `findIndex()`也会在回调函数第一次返回 `true` 时就会停止搜索数组。\n\n这两个方法唯一的区别是 `find()`\
  \ 返回值，而 `findIndex()` 返回找到该值的索引。这里有一个演示示例：\n\n```javascript\nlet numbers = [25,\
  \ 30, 35, 40, 45];\n\nconsole.log(numbers.find(n => n > 33)); // 35\nconsole.log(numbers.findIndex(n\
  \ => n > 33)); // 2\n```\n\n这段代码调用 `find()` 和 `findIndex()` 来定位 `numbers` 数组中第一个大于\
  \ 33 的值。`find()` 的调用返回 35，`findIndex()` 返回 2，即 35 在 `numbers` 数组中的位置。\n\n`find()`\
  \ 和 `findIndex()` 都用于查找符合条件的数组元素而非特定值。如果你只想找到一个值，`indexOf()` 和 `lastIndexOf()` 是更好的选择。\n\
  \n#### fill() 方法\n\n`fill()` 方法用特定值填充一个或多个数组元素。当传递一个值时，`fill()` 会用该值覆盖数组中的所有值。例如：\n\
  \n```javascript\nlet numbers = [1, 2, 3, 4];\n\nnumbers.fill(1);\n\nconsole.log(numbers.toString());\
  \ // 1,1,1,1\n```\n\n在这里，调用 `numbers.fill(1)` 将 `numbers` 中的所有元素改为 1。如果你只想更改某些元素而不是所有元素，可以选择地包含一个起始索引和一个排他的结束索引，如下：\n\
  \n```javascript\nlet numbers = [1, 2, 3, 4];\n\nnumbers.fill(1, 2);\n\nconsole.log(numbers.toString());\
  \ // 1,2,1,1\n\nnumbers.fill(0, 1, 3);\n\nconsole.log(numbers.toString()); // 1,0,0,1\n\
  ```\n\n在 `numbers.fill(1, 2)` 调用中，参数 2 从索引 2 开始填充元素。由于没有通过第三个参数指定排他的结束索引，因此使用 `numbers.length`\
  \ 作为结束索引，这意味着 `numbers` 中的最后两个元素被填充为 1。`numbers.fill(0, 1, 3)` 操作将索引 1 和 2 数组元素填充为\
  \ 0。\n\n#### copyWithin() 方法\n\n`copyWithin()` 方法与 `fill()` 类似，因为它会改变多个元素。然而，`copyWithin()`\
  \ 并不是指定一个值赋给数组，而是允许你从数组中复制值。要实现这一点，你需要向 `copyWithin()` 传递两个参数：方法应该开始的索引以及要复制值的起始索引。\n\
  \n例如，为了将数组的前两个元素复制到最后两个位置，你可以这样做：\n\n```javascript\nlet numbers = [1, 2, 3, 4];\n\
  \n// 从索引 2 开始向数组粘贴值\n// 从索引 0 开始复制值\nnumbers.copyWithin(2);\n\nconsole.log(numbers.toString());\
  \ // 1,2,1,2\n```\n\n这段代码从索引 2 开始向 `numbers` 粘贴值，因此索引 2 和 3 被覆盖。将 0 作为 `copyWithin()`\
  \ 的第二个参数表示从 0 开始复制，直到没有更多元素可复制为止。\n\n默认情况下，`copyWithin()` 总是复制到数组的末尾，但你可以提供一个可选的第三参数来限制被覆盖的元素数量。代码示如下：\n\
  \n```javascript\nlet numbers = [1, 2, 3, 4];\n\n// 从索引 2 开始向数组粘贴值\n// 从索引 0 开始复制值\n\
  // 在遇到索引 1 时停止复制\nnumbers.copyWithin(2, 0, 1);\n\nconsole.log(numbers.toString());\
  \ // 1,2,1,4\n```\n\n在这个示例中，只有索引 0 的值被复制了，因为结束索引被设置为 1。数组的最后一个元素保持不变。\n\n**注意**\n\
  \n与 `fill()` 方法一样，如果你向 `copyWithin()` 方法的任何参数传递负数，则会将数组长度加上该值以确定要使用的索引。\n\n`fill()`\
  \ 和 `copyWithin()` 的用场景对你现在可能并不明显。这是因为这些方法源于类型数组，并为了保持一致而被添加到普通数组中。然而，正如你在下一节中学到的，如果你使用类型数组来操作数字的位，这些方法将变得有用得多。\n\
  \n### 类型数组\n\n类型数组是专门为处理数值类型设计的特殊数组（并非名称所暗示的所有类型）。类型数组的起源可以追溯到 WebGL，它是 OpenGL ES\
  \ 2.0 的移植，设计用于带有 `<canvas>` 元素的网页。类型数组是作为该移植的一部分引入的，旨在为 JavaScript 提供快速的位运算算术。\n\
  \n\n\n\n\nECMAScript 6 将类型数组（typed arrays）作为语言正式的一部分，以确保跨 JavaScript 引擎更好的兼容性以及与\
  \ JavaScript 数组的可操作性。尽管 ECMAScript 6 版本的类型数组与 WebGL 版本不同，但它们存在足够的相似之处，使得 ECMAScript\
  \ 6 版本是 WebGL 版本的演进，而不是不同的方法。\n\n## 数字类型\n\nJavaScript 数字存储为 IEEE 754 格式，使用 64 位存储数字的浮点表示。这种格式表示\
  \ JavaScript 中的整数和浮点数，随着数字的变化，这两种格式之间的转换频繁发生。类型数组允许存储和操作八种不同的数字类型：\n\n• 有符号 8 位整数\
  \ (`int8`)\n• 无符号 8 位整数 (`uint8`)\n• 有符号 16 位整数 (`int16`)\n• 无符号 16 位整数 (`uint16`)\n\
  • 有符号 32 位整数 (`int32`)\n• 无符号 32 位整数 (`uint32`)\n• 32 位浮点数 (`float32`)\n• 64 位浮点数\
  \ (`float64`)\n\n如果你将一个适合放入 `int8` 的数字表示为普通的 JavaScript 数字，你将浪费 56 位。这些位可能更好地用于存储额外的\
  \ `int8` 值或任何少于 56 位的数字。更高效地使用位是类型数组解决的用例之一。\n\n所有与类型数组相关的操作和对象都围绕这八种数据类型展开。但要使用它们，你需要创建一个数组缓冲区（array\
  \ buffer）来存储数据。\n\n**注意**\n\n在本书中我使用括号中显示的缩写来引用这八种数据类型。这些缩写不会出现在实际 JavaScript 代码中；它们只是很长的描述的简写。\n\
  \n## 数组缓冲区\n\n所有类型数组的基础是 `array buffer`（数组缓冲区），它可以包含指定数量字节的内存位置。创建数组缓冲区类似于在 C 语言中调用\
  \ `malloc()` 来分配内存，而不指定内存块包含的内容。你可以如下所示使用 `ArrayBuffer` 构造函数创建一个数组缓冲区：\n\n```javascriptlet\
  \ buffer = new ArrayBuffer(10);  // 分配 10 字节\n```\n\n调用构造函数时，只需传递数组缓冲区应该包含的字节数即可。这个\
  \ `let` 语句创建了一个长度为 10 字节的数组缓冲区。创建数组缓冲区后，你可以通过检查 `byteLength` 属性来获取其中的字节数：\n\n```javascriptlet\
  \ buffer = new ArrayBuffer(10);  // 分配 10 字节\nconsole.log(buffer.byteLength);  \
  \   // 10\n```\n\n你还可以使用 `slice()` 方法创建一个包含现有数组缓冲区部分的新数组缓冲区。`slice()` 方法的工作方式与数组上的\
  \ `slice()` 方法类似：你传递起始索引和结束索引作为参数，它返回一个由原始缓冲区这些元素组成新 `ArrayBuffer` 实例。例如：\n\n```javascriptlet\
  \ buffer = new ArrayBuffer(10);  // 分配 10 字节\nlet buffer2 = buffer.slice(4, 6);\n\
  console.log(buffer2.byteLength);  // 2\n```\n\n在这段代码中，`buffer2` 是通过提取索引 4 和 5 处的字节创建的。与调用此方法的数组版本类似，`slice()`\
  \ 的第二个参数是不包含在内的（exclusive）。\n\n当然，如果不能向该位置写入数据，创建一个存储位置并没有什么帮助。要做到这一点，你需要创建一个视图（view）。\n\
  \n**注意**\n\n数组缓冲区始终表示创建时指定的确切字节数。你可以更改数组缓冲区中包含的数据，但永远无法更改数组缓冲区的大小。\n\n## 使用视图操作数组缓冲区\n\
  \n数组缓冲区表示内存位置，而 `views`（视图）是你操作该内存的接口。视图作用于数组缓冲区或缓冲区字节的子集，以数字数据类型之一读取和写入数据。`DataView`\
  \ 类型是数组上的通用视图，允许你对所有八种数字类型进行操作。\n\n要使用 `DataView`，你首先创建一个 `ArrayBuffer` 实例并使用它创建一个新的\
  \ `DataView`。这是一个示例：\n\n```javascriptlet buffer = new ArrayBuffer(10),\n    view\
  \ = new DataView(buffer);\n```\n\n示例中的视图对象可以访问 `buffer` 中的所有 10 个字节。你也可以对缓冲区的一部分创建视图。只需提供字节偏移量，并可选地提供从该偏移量开始包含的字节数。如果不包含字节数，`DataView`\
  \ 默认从偏移量一直到缓冲区的结束。例如：\n\n```javascriptlet buffer = new ArrayBuffer(10),\n    view\
  \ = new DataView(buffer, 5, 2);    // 覆盖字节 5 和 6\n```\n\n在这里，`view` 仅作用于索引 5 和 6\
  \ 处的字节。这种方法允许你对同一个数组缓冲区创建多个视图，如果你想为整个应用程序使用单个内存位置，而不是根据需要动态分配空间，这会非常有用。\n\n### 获取视图信息\n\
  \n你可以通过获取以下只读属性来获取有关视图的信息：\n\n- `buffer`: 视图所绑定的数组缓冲区\n- `byteOffset`: `DataView`\
  \ 构造函数的第二个参数（如果提供了，则默认为 0）\n- `byteLength`: `DataView` 构造函数的第三个参数（如果提供了，则默认为缓冲区的\
  \ `byteLength`）\n\n使用这些属性，你可以像这样检查视图的操作位置：\n\n```javascriptlet buffer = new ArrayBuffer(10),\n\
  \    view = new DataView(buffer, 5, 2);    // 覆盖字节 5 和 6\n```\n\n### 读取和写入数据\n\n\
  对于 JavaScript 的八种数字类型中的每一种，`DataView` 原型都有一个向数组缓冲区写入数据的方法和一个从中读取数据的方法。方法名都以 `set`\
  \ 或 `get` 开头，后面紧跟数据类型。例如，这里是可以操作 `int8` 和 `uint8` 的读写方法列表：\n\n`getInt8(byteOffset,\
  \ littleEndian)`: 从 byteOffset 开始读取 int8\n`setInt8(byteOffset, value, littleEndian)`:\
  \ 从 byteOffset 开始写入 int8\n`getUint8(byteOffset, littleEndian)`: 从 byteOffset 开始读取\
  \ uint8\n`setUint8(byteOffset, value, littleEndian)`: 从 byteOffset 开始写入 uint8\n\n\
  `get` 方法接受两个参数：要读取的字节偏移量和一个可选的布尔值，指示值是否应以小端（little-endian）格式读取。（*小端*意味着最低位位于字节 0\
  \ 处，而不是最后一个字节。）`set` 方法接受三个参数：要写入的字节偏移量、要写入的值以及一个可选的布尔值，指示值是否应以小端格式存储。\n\n尽管我只展示了可以用于\
  \ 8 位值的方法，但同样存在用于操作 16 位和 32 位运行的相同方法。只需将每个名称中的 8 替换为 16 或 32 即可。\n\n除了所有这些整数方法外，`DataView`\
  \ 还有针对浮点数的以下读写方法：\n\n`getFloat32(byteOffset, littleEndian)`: 从 byteOffset 开始读取 float32\n\
  `setFloat32(byteOffset, value, littleEndian)`: 从 byteOffset 开始写入 float32\n`getFloat64(byteOffset,\
  \ littleEndian)`: 从 byteOffset 开始读取 float64\n\n\n\n\n\n`setFloat64(byteOffset, value,\
  \ littleEndian)` 从 `byteOffset` 开始处写入一个 float64 浮点数\n\n以下示例展示了 set 和 get 方法的用法：\n\
  \n```javascript\nlet buffer = new ArrayBuffer(2),\n    view = new DataView(buffer);\n\
  \nview.setInt8(0, 5);\nview.setInt8(1, -1);\n\nconsole.log(view.getInt8(0));   \
  \   // 5\nconsole.log(view.getInt8(1));      // -1\n```\n\n这段代码使用一个双字节的数组缓冲区（array\
  \ buffer）来存储两个 `int8` 值。第一个值设置在偏移量 0，第二个设置在偏移量 1，这反映了每个值跨越了一个字节（8 位）。随后，通过 `getInt8()`\
  \ 方法从相应的位置检索这些值。尽管此示例使用了 `int8` 值，但你也可以使用任何八种数值类型及其对应的方法。\n\n视图（Views）的独特之处在于，它们允许你在任何时间以任何格式读取和写入，无论数据之前是如何存储的。例如，写入两个\
  \ `int8` 值并使用 `int16` 方法读取缓冲区是可以完全行的，正如本例所示：\n\n```javascript\nlet buffer = new\
  \ ArrayBuffer(2),\n    view = new DataView(buffer);\n\nview.setInt8(0, 5);\nview.setInt8(1,\
  \ -1);\n\nconsole.log(view.getInt16(0));      // 1535\nconsole.log(view.getInt8(0));\
  \      // 5\nconsole.log(view.getInt8(1));      // -1\n```\n\n对 `view.getInt16(0)`\
  \ 的调用会读取视图中的所有字节并将这些字节解释为数字 1535。为了理解为什么会发生这种情况，请查看图 10-1，它展示了每行 `setInt8()` 对数组缓冲区做了什么。\n\
  \n![image](img/f10-01.jpg)\n\n*图 10-1: 两次方法调用后的数组缓冲区*\n\n数组缓冲区起始包含 16 个全 0 的位。使用\
  \ `setInt8()` 向第一个字节写入 5 会引入几个 1（在 8 位表示中，5 是 00000101）。向第二个字节写入 –1 会将该字节中的所有位都设置为\
  \ 1，这是 –1 的补码表示。在第二次调用 `setInt8()` 之后，数组缓冲区包含 16 位，`getInt16()` 将这些位读取为单个 16 位整数，在十进制中为\
  \ 1535。\n\n`DataView` 对象非常适合这种以此方式混合不同数据类型的用例。然而，如果你只使用一种特定的数据类型，那么特定类型的视图（type-specific\
  \ views）将是更好的选择。\n\n### 类型数组即是视图\n\nECMAScript 6 的类型数组（typed arrays）实际上是针对数组缓冲区的特定类型视图。与其使用通用的\
  \ `DataView` 对象来操作数组缓冲区，你可以使用强制执行特定数据类型的对象。八种特定类型视图对应八种数值数据类型，外还有一个针对 `uint8` 值的选项。表\
  \ 10-1 显示了 ECMAScript 6 规范第 22.2 节中完整特定类型视图列表的简略版本。\n\n**表 10-1：** ECMAScript 6\
  \ 中的某些特定类型视图\n\n| 构造函数名称 | 元素大小（字节） | 描述 | 等于 C 类型 |\n| --- | --- | --- | --- |\n\
  | `Int8Array` | 1 | 8 位补码有符号整数 | signed char |\n| `Uint8Array` | 1 | 8 位无符号整数 |\
  \ unsigned char |\n| `Uint8ClampedArray` | 1 | 8 位无符号整数（限制限幅转换） | unsigned char\
  \ |\n| `Int16Array` | 2 | 16 位补码有符号整数 | short |\n| `Uint16Array` | 2 | 16 位无符号整数\
  \ | unsigned short |\n| `Int32Array` | 4 | 32 位补码有符号整数 | int |\n| `Uint32Array`\
  \ | 4 | 32 位无符号整数 | int |\n| `Float32Array` | 4 | 32 位 IEEE 浮点数 | float |\n| `Float64Array`\
  \ | 8 | 64 位 IEEE 浮点数 | double |\n\n`Constructor` 名称列列出了类型数组的构造函数，其他列描述了每个类型数组可以包含的数据。`Uint8ClampedArray`\
  \ 与 `Uint8Array` 相同，除非数组缓冲区中的值小于 0 或大于 255。`Uint8ClampedArray` 将小于 0 的值转换为 0（例如，–1\
  \ 变为 0），并将大于 255 的值转换为 255（因此 300 变为 255）。\n\n类型数组操作仅对特定类型的数据有效。例如，所有对 `Int8Array`\
  \ 的操作都使用 `int8` 值。类型数组中元素的大小也取决于数组的类型。尽管 `Int8Array` 中的元素长度为单字节，但 `Float64Array`\
  \ 每个元素使用八个字节。幸运的是，像普通数组一样使用数值索引来访问元素，这允许你避免频繁调用 `DataView` 的 `set` 和 `get` 方法。\n\
  \n### 创建特定类型视图\n\n类型数组构造函数接受多种参数，可以通过多种方式创建类型数组。首先，通过传递 `DataView` 接受的参数（一个缓冲区、一个偏移量和一个可选长度）创建一个类型数组，例如：\n\
  \n```javascript\nlet buffer = new ArrayBuffer(2),\n    view = new DataView(buffer);\n\
  \nview.setInt8(0, 5);\nview.setInt8(1, -1);\n\nconsole.log(view.getInt16(0));  \
  \    // 1535\nconsole.log(view.getInt8(0));      // 5\nconsole.log(view.getInt8(1));\
  \      // -1\n```\n\n第二种创建类型数组的方法是向构造函数传递一个数字。该数字代表元素的数量而不是字节。例如：\n\n```javascript\n\
  let buffer = new ArrayBuffer(10),\n    view1 = new Int8((),\n\nview2 = = Int Int(buffer,\
  \ 5);\n\nconsole.log(view1.buffer === buffer); // true\nconsole.log(view2.buffer\
  \ === buffer); // true\nconsole.log(view1.byteOffset);      // 0\nconsole.log(view2.byteOffset);\
  \      // 5\nconsole.log(view1.byteLength);      // 10\nconsole.log(view2.byteLength);\
  \      // 5\n```\n*(注：此处原文文本似乎存在部分错乱/重复错误，如 `Int8((` 应为 `Int8Array(buffer)`，翻译已根据语境进行了逻辑对齐)*\n\
  \n第三种创建类型数组的方法是传递一个数字作为构造函数的唯一参数。该数字表示要分配给缓冲区的字节数。该数字代表元素的数量。例如：\n\n```javascript\n\
  let ints = new Int16Array(2),\n    floats = new Float32Array(5);\n\nconsole.log(ints.byteLength);\
  \  // 4\nconsole.log(ints.length);       // 2\nconsole.log(floats.byteLength); //\
  \ 20\nconsole.log(floats.length);     // 5\n```\n\n`ints` 数组创建了两个元素的空间。每个 16 位整数需要两个字节，因此分配了\
  \ 4 个字节。`floats` 数组是为了五个元素创建的，因此所需的字节数为 20（每个元素四个字节）。在两种情况下，都创建了新的缓冲区，可以通过 `buffer`\
  \ 属性访问。\n\n注意：如果向类型数组构造函数未传递参数，构造函数将就像传递了 0 一样。这会创建一个无法存储数据的类型缓冲区。\n\n创建特定类型视图还可以传递一个对象作为构造函数的参数。该对象可以是以下任何一种：\n\
  \n- **类型数组**：每个元素都被复制到新类型数组的元素中。例如，如果你将 `int8` 传递给 `Int16Array` 构造函数，`int8` 值将被复制到\
  \ `int16` 数组中。新类型数组与传入的 `buffer` 不同。\n- **可迭代对象**：调用对象的 `iterator` 以获取插入到类型数组中的项。如果任何元素对视图类型无效，构造函数将抛出错误。\n\
  - **数组**：数组的元素被复制到新的类型数组中。如果任何元素对该类型无效，构造函数将抛出错误。\n- **类数组对象**：该对象的行为与数组相同。\n\n\
  在这些情况下，都会根据源对象创建一个新的类型数组。当你想要用某些值初始化类型数组时，这种方法特别有用，例如：\n\n```javascript\nlet ints1\
  \ = new Int16Array([25, 50]),\n    ints2 = new Int32Array(ints1);\n\nconsole.log(ints1.buffer\
  \ === ints2.buffer); // false\nconsole.log(ints1.byteLength);             // 4\n\
  console.log(ints1.length);                 // 2\nconsole.log(ints1[0]);        \
  \              // 25\nconsole.log(ints1[1]);                      // 50\nconsole.log(ints2.byteLength);\
  \             // 8\nconsole.log(ints2.length);                 // 2\n```\n\n\n\n\
  \n```javascript\nconsole.log(ints2[0]);             // 25\nconsole.log(ints2[1]);\
  \             // 50\n```\n\n此示例创建了一个 `Int16Array` 并用一个包含两个值的数组对其初始化。然后，创建了一个 `Int32Array`\
  \ 并将其传递给 `Int16Array`。值 `25` 和 `50` 从 `ints1` 拷贝到 `ints2`，因为这两个类型数组拥有完全独立的缓冲区。这两个数字在两个类型数组中的表示方式相同，但\
  \ `ints2` 有八个字节来表示数据，而 `ints1` 只有四个字节。\n\n## 元素大小 (ELEMENT SIZE)\n\n每个类型数组由多个元素组成，元素的大小是每个元素所占的字节数。该值存储在每个构造函数和每个实例的\
  \ `BYTES_PER_ELEMENT` 属性上，因此你可以轻松查询元素大小：\n\n```javascript\nconsole.log(UInt8Array.BYTES_PER_ELEMENT);\
  \  // 1\nconsole.log(UInt16Array.BYTES_PER_ELEMENT);  // 2\n\nlet ints = new Int8Array(5);\n\
  \nconsole.log(ints.BYTES_PER_ELEMENT);        // 1\n```\n\n如此代码所示，你可以在不同的类型数组类上检查\
  \ `BYTES_PER_ELEMENT`，也可以在类的实例上检查它。\n\n## 类型数组与普通数组的相似性\n\n类型数组和普通数组在许多方面都是相似的，正如你在本章中看到的，在很多情况下你可以像普通数组一样使用类型数组。例如，你可以使用\
  \ `length` 属性检查类型数组中有多少个元素，并可以使用数字索引直接访问类型数组的元素。例如：\n\n```javascript\nlet ints =\
  \ new Int16Array([25, 50]);\n\nconsole.log(ints.length);  // 2\nconsole.log(ints[0]);\
  \      // 25\nconsole.log(ints[1]);      // 50\n\nints[0] = 1;\nints[1] = 2;\nconsole.log(ints[0]);\
  \      // 1\nconsole.log(ints[1]);      // 2\n```\n\n在此代码中，创建了一个包含两个项的新的 `Int16Array`。使用数字索引对项进行读取和写入，这些值在操作过程中会被自动存储并转换为\
  \ `int16` 值。但相似性并不仅于此。\n\n### 注意 (NOTE)\n与普通数组不同，你不能通过 `length` 改变类型数组的大小。`length`\
  \ 属性是不可写的，因此在非严格模式下，任何修改尝试都会被忽略，而在严格模式下会抛出错误。\n\n### 常用方法 (Common Methods)\n类型数组还包含了功能上与普通数组方法等的方法。你可以在类型数组上使用以下方法：`copyWithin()`，`findIndex()`，`lastIndexOf()`，`slice()`，`entries()`，`forEach()`，`map()`，`some()`，`fill()`，`indexOf()`，`reduce()`，`sort()`，`filter()`，`join()`，`reduceRight()`，`find()`，`values()`，`keys()`，`reverse()`。\n\
  \n请记住，虽然这些方法的作用类似于 `Array.prototype` 上的对应方法，但它们并不完全相同。类型数组方法对数值安全有额外的检查，并且当返回数组时，返回的是类型数组而不是普通数组（由于\
  \ `Symbol.species`）。这里有一个简单的示例：\n\n```javascript\nlet ints = new Int16Array([25,\
  \ 50]),\nmapped = ints.map(v => v * 2);\n\nconsole.log(mapped.length); // 2\nconsole.log(mapped[0]);\
  \      // 50\nconsole.log(mapped[1]);      // 100\nconsole.log(mapped instanceof\
  \ Int16Array); // true\n```\n\n此代码使用 `map()` 方法根据 `ints` 中的值创建一个新数组。映射函数将数组中的每个值翻倍，并返回一个新的\
  \ `Int16Array`。\n\n### 相同的迭代器 (The Same Iterators)\n类型数组也拥有与普通数组相同的迭代器。这些是 `entries()`\
  \ 方法、`keys()` 方法和 `values()` 方法。这意味着你可以像对待普通数组一样对类型数组使用展开运算符和 `for-of` 循环。例如：\n\n\
  ```javascript\nlet ints = new Int16Array([25, 50]),\nintsArray = [...ints];\n\n\
  console.log(intsArray instanceof Array); // true\nconsole.log(intsArray[0]);   \
  \            // 25\nconsole.log(intsArray[1]);               // 50\n```\n\n此代码创建了一个新数组\
  \ `intsArray`，其中包含与类型数组 `ints` 相同的数据。与其他可迭代对象一样，展开运算符使类型数组转换为普通数组变得简单。\n\n### of()\
  \ 和 from() 方法\n此外，所有类型数组都有静态的 `of()` 和 `from()` 方法，其工作方式类似于 `Array.of()` 和 `Array.from()`。区别在于类型数组上的方法返回的是类型数组而不是普通数组。以下是使用这些方法创建类型数组的示例：\n\
  \n```javascript\nlet ints = Int16Array.of(25, 50),\nfloats = Float32Array.from([1.5,\
  \ 2.5]);\n\nconsole.log(ints instanceof Int16Array);   // true\nconsole.log(floats\
  \ instanceof Float32Array); // true\nconsole.log(ints.length);                 \
  \  // 2\nconsole.log(ints[0]);                        // 25\nconsole.log(ints[1]);\
  \                        // 50\nconsole.log(floats.length);                 // 2\n\
  console.log(floats[0]);                      // 1.5\nconsole.log(floats[1]);   \
  \                   // 2.5\n```\n\n示例中的 `of()` 和 `from()` 方法创建了一个 `Int16Array` 和一个\
  \ `Float32Array`。\n\n## 类型数组与普通数组的差异\n\n类型数组与普通数组之间最重要的区别是类型数组没有继承自 `Array`。例如：\n\
  \n```javascript\nlet ints = Int16Array([25, 50]);\nconsole.log(Array.isArray(ints));\
  \ // false\n```\n\n`Array.isArray()` 方法返回 false。\n\n### 行为差异 (Behavioral Differences)\n\
  普通数组在交互时可以增长或缩小，但类型数组的大小不变。你不能像操作普通数组那样给类型数组中不存在的索引赋值。这里有一个示例：\n\n```javascript\n\
  let ints = Int16Array([25, 50]);\n\nconsole.log(ints.length); // 2\nconsole.log(ints[0]);\
  \      // 25\nconsole.log(ints[1]);      // 50\n\nints[2] = 5;\n\nconsole.log(ints.length);\
  \ // 2\nconsole.log(ints[2]);      // undefined\n```\n\n在此示例中，尽管给数字索引 `2` 赋值了 `5`，`ints`\
  \ 数组并没有增长。\n\n类型数组还会检查以确保使用有效的数据类型。任何无效值都会使用 0。例如：\n\n```javascript\nlet ints =\
  \ Int16Array([\"hi\"]);\n\nconsole.log(ints.length); // 1\nconsole.log(ints[0]);\
  \      // 0\n```\n\n此代码尝试在 `Int16Array` 中使用字符串 `\"hi\"`。当然，字符串是类型数组的无效数据类型，因此对应的的是\
  \ `0`。数组的长度仍然为 1。\n\n所有修改类型数组的值都会执行相同的限制。例如，如果传递给 `map()` 的函数返回了类型数组无效的值，则会改用 `0`：\n\
  \n```javascript\nlet ints = new Int16Array([25, 50]),\nmapped = ints.map(v => \"\
  hi\");\n\nconsole.log(mapped.length); // 2\nconsole.log(mapped[0]);      // 0\n\
  console.log(mapped[1]);      // 0\nconsole.log(mapped instanceof Int16Array); //\
  \ true\nconsole.log(mapped instanceof Array); // false\n```\n\n\n\n\n虽然类型化数组（typed\
  \ arrays）拥有许多与普通数组相同的方法，但也缺少几个数组方法。以下方法在类型化数组上不可用：\n\n`concat()`, `shift()`\n`pop()`,\
  \ `splice()`\n`push()`, `unshift()`\n\n除了 `concat()` 方法外，列表中的方法都可以改变数组的大小。类型化数组无法改变大小，这就是为什么这些方法在类型化数组中不可用。`concat()`\
  \ 方法不可用是因为两个类型化数组拼接后的结果（特别是当它们处理不同的数据类型时）是不确定的，而这与最初使用类型化数组的初衷相悖。\n\n### 附加方法\n\n\
  最后，类型化数组方法包含两个普通数组中没有的方法：`set()` 和 `subarray()` 方法。这两个方法是相反的：`set()` 将另一个数组复制到现有的类型化数组中，而\
  \ `subarray()` 则从现有的类型化数组中提取部分创建一个新的类型化数组。\n\n`set()` 方法接受一个数组（类型化的或普通的数组）以及一个用于插入数据的可选偏移量（offset）；如果你不传递任何参数，则偏移量默认为零。数组参数中的数据会被复制到目标类型化数组中，同时确保只使用有效的数据类型。例如所示：\n\
  \n```\nlet ints = new Int16Array(4);\nints.set([25, 50]);\nints.set([75, 100], 2);\n\
  console.log(ints.toString());  // 25,50,75,100\n```\n\n这段代码创建了一个具有四个元素的 `Int16Array`。第一次调用\
  \ `set()` 将两个值复制到数组的第一个和第二个元素。第二次调用 `set()` 使用偏移量 2，表示这些值应该从数组的第三个元素开始放置。\n\n`subarray()`\
  \ 方法接受一个可选的起始索引和结束索引（结束索引是不包含在内侧的，类似于 `slice()` 方法），并返回一个新的类型化数组。你也可以省略两个参数来创建类型化数组的克隆。例如：\n\
  \n```javascript\nlet ints = new Int16Array([25, 50, 75, 100]),\n    subints1 = ints.subarray(),\n\
  \    subints2 = ints.subarray(2),\n    subints3 = ints.subarray(1, 3);\n\nconsole.log(subints1.toString());\
  \  // 25,50,75,100\nconsole.log(subints2.toString());  // 75,100\nconsole.log(subints3.toString());\
  \  // 50,75\n```\n\n在此示例中，从原始 `ints` 数组创建了三个类型化数组。`subints1` 数组是 `ints` 的克隆，包含相同的信息。由于\
  \ `subints2` 数组从索引 2 开始复制数据，它只包含 `ints` 数组的最后两个元素（75 和 100）。`subints3` 数组仅包含 `ints`\
  \ 数组中间的两个元素，因为调用 `subarray()` 时指定了起始和结束索引。\n\n## 总结\n\nECMAScript 6 通过让数组变得更加实用继续了\
  \ ECMAScript 5 的工作。新功能包括创建数组的另外两种方法：`Array.of()` 和 `Array.from()` 方法。`Array.from()`\
  \ 方法还可以将迭代器（iterables）和类数组转换为数组。这两个方法都由派生数组类继承，并使用 `Symbol.species` 属性来确定应该返回什么类型的值（其他继承的方法在返回数组时也使用\
  \ `Symbol.species`）。\n\n此外，数组还引入了几个新方法。`fill()` 和 `copyWithin()` 方法允许你原地修改数组元素。`find()`\
  \ 和 `findIndex()` 方法用于查找数组中符合某些标准的第一个元素。前者返回符合标准的第一个元素，后者返回该元素的索引。\n\n类型化数组在技术上并不是数组，因为它们没有继承自\
  \ `Array`，但它们看起来和行为上都非常像数组。类型化数组包含八种不同的数值数据类型之一，并构建在 `ArrayBuffer` 对象之上，`ArrayBuffer`\
  \ 代表数字或系列数字的底层比特位（bits）。类型化数组是执行位运算的一种更高效的方法，因为值不会像 JavaScript 数字类型那样在不同格式之间来回转换。\n\
  \n# 11: Promise（承诺）与异步编程\n\n![image](img/common-01.jpg)\n\nJavaScript 最强大的方面之一是它能够轻松地处理异步编程。作为一种为\
  \ Web 创建的语言，JavaScript 从初就需要能够响应异步的用户交互，例如点击和按键。Node.js 通过使用回调（callbacks）作为事件的替代方案，使\
  \ JavaScript 中的异步编程更加流行。但随着越来越多的程序开始使用异步编程，事件和回调不足以支持开发者想要做的一切事情。`Promises` 就是这个问题的解决方案。\n\
  \nPromises 是异步编程的另一种选择，它们的工作方式类似于其他语言中的未来（futures）和延迟执行（deferreds）。与事件和回调一样，Promise\
  \ 指定了一些稍后执行的代码，但 Promise 还会显式地指示代码是成功还是失败。你可以根据成功或失败将 Promise 链起来，使得你的代码更容易于理解和调试。\n\
  \n本章将向你展示 Promise 是如何工作的。然而，为了完全理解，了解构建 Promise 的一些基础概念至关重要。\n\n## 异步编程背景\n\nJavaScript\
  \ 引擎构建在单线程事件循环（single-threaded event loop）的概念之上。`Single-threaded`（单线程）意味着一次只能执行一段代码。这与\
  \ Java 或 C++ 等语言相比，在这些语言中，线程允许同时执行多个代码片段。当多个代码片段访问并更改状态时，维护状态是一个棘手的问题。\n\nJavaScript\
  \ 引擎一次只能执行一段代码，因此它们需要跟踪待运行的代码。这些代码被放在任务队列（job queue）中。每当代码准备好执行时，就会被添加到任务队列。当 JavaScript\
  \ 引擎完成代码执行后，事件循环会执行队列中的下一个任务。`event loop` 是 JavaScript 引擎内部的一个监控代码执行并管理任务队列的过程。请记住，作为一个队列，任务执行从第一个任务运行到最后一个。\n\
  \n## 事件模型\n\n当用户点击按钮或在键盘上按键时，像 `onclick` 这样的事件会被触发。该事件通过向任务队列的末尾添加新任务来响应交互。这是 JavaScript\
  \ 最基础的异步编程形式。事件处理代码在事件触发之前不会执行，而当它执行时，它拥有正确的上下文。例如：\n\n```javascript\nlet button\
  \ = document.getElementById(\"my-btn\");\nbutton.onclick = function(event) {\n \
  \   console.log(\"Clicked\");\n};\n```\n\n在这段代码中，在点击按钮之前 `console.log(\"Clicked\"\
  )` 不执行。点击按钮时，赋值给 `onclick` 的函数会被添加到任务队列的末尾，并在它之前的所有任务完成后执行。\n\n事件对于简单的交互效果良好，但将多个独立的异步调用链在一起会变得复杂，因为你必须为每个事件跟踪事件目标（在此示例中为按钮）。此外，你需要确保在事件首次发生之前添加所有适当的事件处理程序。例如，如果在赋值\
  \ `onclick` 之前点击了按钮，则什么都不会发生。因此，虽然事件对于响应用户交互和低频率的功能很有用，但对于更复杂的需求，它们并不灵活。\n\n## 回调模式\n\
  \nNode.js 通过普及回调推进了异步编程模型。回调模式与事件模型相似，因为异步代码在稍后的时间点才会执行。它的不同之处在于要调用的函数作为参数传递的，所示：\n\
  \n```javascript\nreadFile(\"example.txt\", function(err, contents) {\n```\n\n\n\n\
  \n```javascript\nif (err) {\n    throw err;\n}\nconsole.log(contents);\n});\n\n\
  console.log(\"Hi!\");\n```\n\n此示例使用了传统的 Node.js `error-first` 回调样式。`readFile()`\
  \ 函数旨在从磁盘上的文件（作为第一个指定）读取内容，并在完成后执行回调（第二个参数）。如果发生错误，回调的 `err` 参数将是一个错误对象；否则，`contents`\
  \ 参数将包含作为字符串形式的文件内容。\n\n使用回调模式，`readFile()` 会立即开始执行，并在开始从磁盘读取时暂停。这意味着 `console.log(\"\
  Hi!\")` 会在 `readFile()` 被调用后立即输出，在 `console.log(contents)` 打印任何内容之前。当 `readFile()`\
  \ 完成时，它会将回调函数及其参数作为一个新任务添加到作业任务队列的末尾。该任务将在排在它前面的所有其他任务完成后执行执行。\n\n回调模式比事件更灵活，因为使用回调更容易将多个调用链链在一起。这里有一个示例：\n\
  \n```javascript\nreadFile(\"example.txt\", function(err, contents) {\n    if (err)\
  \ {\n        throw err;\n    }\n    writeFile(\"example.txt\", function(err) {\n\
  \        if (err) {\n            throw err;\n        }\n        console.log(\"File\
  \ was written!\");\n    });\n});\n```\n\n在这段代码中，成功调用 `readFile()` 会导致另一个异步调用，这次是调用\
  \ `writeFile()` 函数。注意，两个函数中都存在检查 `err` 的相同基本模式。当 `readFile()` 完成时，它向作业任务队列添加一个任务，如果没有错误，则调用\
  \ `writeFile()` 函数。然后，`writeFile()` 在完成后也会向作业任务队列添加一个任务。\n\n这种模式工作工作得相当不错，但你会很快发现自己陷入了\
  \ `回调地狱`（callback hell）。回调地狱发生在你嵌套了太多的回调时，如下所示：\n\n```javascript\nmethod1(function(err,\
  \ result) {\n    if (err) {\n        throw err;\n    }\n    method2(function(err,\
  \ result) {\n        if (err) {\n            throw err;\n        }\n        method3(function(err,\
  \ result) {\n            if (err) {\n                throw err;\n            }\n\
  \            method4(function(err, result) {\n                if (err) {\n     \
  \               throw err;\n                }\n                method5(result);\n\
  \            });\n        });\n    });\n});\n```\n\n嵌套多个方法调用（如此示例所示）会创建一个错综复杂的代码网，难以理解和调试。当你想要实现更复杂的功能时，回调也会带来问题。如果你想让两个异步操作并行运行，并在它们都完成后通知你该怎么办？如果你想同时启动两个异步操作，但只取第一个完成的结果该怎么办？在这些情况下，你需要跟踪多个回调和清理操作，而\
  \ promise（承诺）极大地改善了这些情况。\n\n## Promise 基础\n\nPromise 是异步操作结果的占位符。函数不再需要订阅事件或向函数传递回调，而是可以返回一个\
  \ promise，如下所示：\n\n```javascript\n// readFile 承诺在未来的某个点完成\nlet promise = readFile(\"\
  example.txt\");\n```\n\n在在这段代码中，`readFile()` 不会立即开始读取文件：那将在以后发生。相反，函数返回一个代表异步读取操作的\
  \ promise 对象，以便你将来对其进行处理。你究竟何时能够处理该结果完全取决于 promise 的生命周期如何结束。\n\n## Promise 的生命周期\n\
  \n每个 promise 都会经历一个简短的生命周期，从 `pending`（等待中）状态开始，这表示异步操作尚未完成。pending promise 被视为\
  \ `unsettled`（未稳定）。上一个示例中的 promise 在 `readFile()` 函数返回它时就处于 `pending` 状态。一旦异步操作完成，promise\
  \ 被视为 `settled`（已稳定）并进入两种可能状态之一：\n\n- **Fulfilled**（已完成）：promise 的异步操作成功完成。\n- **Rejected**（已拒绝）：promise\
  \ 的异步操作由于错误或其他原因未成功完成。\n\n一个内部的 `PromiseState` 属性被设置为 \"pending\"、fulfilled\" 或\
  \ \"rejected\"，以反映 promise 的状态。此属性不会暴露在 promise 对象上，因此你无法通过程序手段确定 promise 处于哪种状态。但你可以通过\
  \ `then()` 方法在 promise 状态改变时采取特定操作。\n\n`then()` 方法存在于所有 promise 上，并接受两个参数。第一个参数是\
  \ promise 成功时调用的函数。第二个参数是 promise 被拒绝时调用的函数。\n\n**注意**\n\n任何实现了上段描述的 `then()` 方法的对象被称为\
  \ thenable（通）。所有的 promise 都是 thenable。\n\n`then()` 的两个参数都是可选的，因此你可以监听成功和拒绝的任何组合。例如，考虑这组\
  \ `then()` 调用：\n\n```javascript\nlet promise = readFile(\"example.txt\");\n\npromise.then(function(contents)\
  \ {\n    console.log(contents);\n}, function(err) {\n    console.error(err);\n});\n\
  \npromise.then(function(contents) {\n    console.log(contents);\n});\n\npromise.then(null,\
  \ function(err) {\n    console.error(err);\n});\n```\n\n所有三个 `then()` 调用都作用于同一个\
  \ promise。第一个调用监听成功和拒绝。第二个只监听成功；错误将不会被报告。第三个只监听拒绝。\n\nPromises 还有一个 `catch()` 方法，当只传递拒绝处理程序时，它的行为与\
  \ `then()` 相同。例如，以下 `catch()` 和 `then()` 调用在功能上等效的：\n\n```javascript\npromise.catch(function(err)\
  \ {\n    console.error(err);\n});\n\n// 等同于：\n\npromise.then(null, function(err)\
  \ {\n    console.error(err);\n});\n```\n\n`then()` 和 `catch()` 方法旨在结合使用，以正确处理异步操作的结果。这种系统比使用事件和回调更好，因为它清楚地指示了操作是成功还是失败。（当错误时，事件通常不会触发，而在回调中你必须始终检查错误参数。）只需记住，如果你不为\
  \ promise 附加拒绝处理程序，所有的失败都将静默发生。始终附加一个拒绝处理程序，即使该处理程序只是记录失败。\n\n如果成功或拒绝处理程序在 promise\
  \ 已经稳定后被添加到作业任务队列，它仍然会被执行。这允许你在任何时候添加新的成功和拒绝处理程序，并保证它们会被调用。例如：\n\n```javascript\n\
  let promise = readFile(\"example.txt\");\n\n// 原始的成功处理程序\npromise.then(function(contents)\
  \ {\n    console.log(contents);\n\n    // 现在添加另一个\n    promise.then(function(contents)\
  \ {\n        console.log(contents);\n    });\n});\n```\n\n\n\n\n每次对 `then()` 或 `catch()`\
  \ 的调用都会创建一个新的任务，并在 promise 决时执行。但这些任务最终会进入一个专门为 promise 预留的独立任务队列。只要你理解任务队列的基本工作原理，这个第二个任务队列的具体细节对于理解如何使用\
  \ promise 并不重要。\n\n### 创建待决状态（Unsettled Promises）\n\n新的 promise 使用 `Promise` 构造函数来创建。该构造函数接受一个参数：一个称为\
  \ `executor` 的函数，它包含了初始化 promise 代码。`executor` 接收两个名为 `resolve()` 和 `reject()` 的函数作为参数。当\
  \ `executor` 成功完成时，调用 `resolve()` 函数来信号 promise 已准备就绪，而 `reject()` 函数则表示 `executor`\
  \ 执行失败。\n\n这里有一个在 Node.js 中使用 promise 来实现你在在本章之前看到的 `readFile()` 函数的示例：\n\n```javascript\n\
  // Node.js example\n\nlet fs = require(\"fs\");\n\nfunction readFile(filename) {\n\
  \    return new Promise(function(resolve, reject) {\n        // 触发异步操作\n       \
  \ fs.readFile(filename, { encoding: \"utf8\" }, function(err, contents) {\n    \
  \        // 检查错误\n            if (err) {\n                reject(err);\n       \
  \         return;\n            }\n            // 读取成功\n            resolve(contents);\n\
  \        });\n    });\n}\n\nlet promise = readFile(\"example.txt\");\n\n// 监听完成和拒绝\n\
  promise.then(function(contents) {\n    // 完成\n    console.log(contents);\n}, function(err)\
  \ {\n    // 拒绝\n    console.error(err.message);\n});\n```\n\n在这个示例中，原生的 Node.js\
  \ `fs.readFile()` 异步调用被封装在了一个 promise 中。`executor` 要将错误对象传递给 `reject()` 函数，要么将文件内容传递给\
  \ `resolve()` 函数。\n\n请记住，`executor` 在 `readFile()` 被调用时会立即执行。当在 `executor` 内部调用\
  \ `resolve()` 或 `reject()` 时，一个任务会被添加到任务队列中以解析该 promise。这被称为`任务调度`（job scheduling），如果你曾经用过\
  \ `setTimeout()` 或 `setInterval()` 函数，那么你已经熟悉它了。在`任务调度`中，你向任务队列添加一个新任务，表示“现在不要执行这个，稍后再执行”。例如，`setTimeout()`\
  \ 函数允许你指定在任务被添加到队列之前的延迟：\n\n```javascript\n// 在 500 ms 后将此函数添加到任务队列\n\nsetTimeout(function()\
  \ {\n    console.log(\"Timeout\");\n}, 500)\nconsole.log(\"Hi!\");\n```\n\n这段代码调度了一个任务，使其在\
  \ 500 ms 后被添加到任务队列。两个 `console.log()` 调用产生了以下输出：\n\nHi!\nTimeout\n\n得益于 500 ms 的延迟，传递给\
  \ `setTimeout()` 的函数的输出在 `console.log(\"Hi!\")` 用的输出之后显示。\n\npromise 的工作原理类似。promise\
  \ 的 `executor` 会立即执行，在源代码中出现在它之后的任何内容之前。例如：\n\n```javascript\nlet promise = new\
  \ Promise(function(resolve, reject) {\n    console.log(\"Promise\");\n    resolve();\n\
  });\n\nconsole.log(\"Hi!\");\n```\n\n这段代码的输出是：\n\nPromise\nHi!\n\n调用 `resolve()`\
  \ 会触发异步操作。传递给 `then()` 和 `catch()` 的函数是异步执行的，因为它们也被添加到了任务队列中。这里有一个示例：\n\n```javascript\n\
  let promise = new Promise(function(resolve, reject) {\n    console.log(\"Promise\"\
  );\n    resolve();\n});\n\npromise.then(function() {\n    console.log(\"Resolved.\"\
  );\n});\n\nconsole.log(\"Hi!\");\n```\n\n这个示例的输出是：\n\nPromise\nHi!\nResolved\n\n\
  注意，尽管对 `then()` 的调用出现在 `console.log(\"Hi!\")` 这一行之前，但它实际上直到之后才执行（与 `executor` 不同）。原因是完成和拒绝处理程序始终会在\
  \ `executor` 完成后添加到任务队列的末尾。\n\n### 创建已决状态（Settled Promises）\n\n由于 promise `executor`\
  \ 执行的动态性质，`Promise` 构造函数是创建待决 promise 的最佳方式。但如果你想让 promise 只代表一个已知的值，那么调度一个仅仅将值传递给\
  \ `resolve()` 的任务就没有意义了。\n\n#### 使用 resolve()\n\n由于 promise `executor` 执行的动态性质，`Promise`\
  \ 构造函数是创建待决 promise 的最佳方式。但如果你想让 promise 只代表一个已知的值，那么调度一个仅仅将值传递给 `resolve()` 的任务就没有意义了。在这个示例中，`Promise.resolve()`\
  \ 创建了一个已完成 promise：\n\n```javascript\nlet promise = Promise.resolve(42);\npromise.then(function(value)\
  \ {\n    console.log(value);\n});\n```\n\n#### 使用 reject()\n\n由于 promise `executor`\
  \ 执行的动态性质，`Promise` 构造函数是创建待决 promise 的最佳方式。但如果你想让 promise 只代表一个已知的值，那么调度一个仅仅将值传递给\
  \ `resolve()` 的任务就没有意义了。你也可以使用 `Promise.reject()` 创建被拒绝的 promise：\n\n```javascript\n\
  let promise = Promise.reject(42);\npromise.catch(function(value) {\n    console.log(value);\n\
  });\n```\n\n#### 非 Promise 的 Then 对象 (Thenables)\n\n`Promise.resolve()` 和 `Promise.reject()`\
  \ 都像这样工作，以便你轻松地处理非 promise 的 thenables。在 ECMAScript 6 引入 promise 之前，许多库都使用了 thenables，因此将\
  \ thenables 转换为正式 promise 对于与以前存在的库进行向后兼容非常重要。\n\n### 执行器错误 (Executor Errors)\n\n\
  如果在 `executor` 内部抛出异常，则会调用 promise 的拒绝处理程序。例如：\n\n\n\n\n\n```javascript\nlet promise\
  \ = new Promise(function(resolve, reject) {\n    throw new Error(\"Explosion!\"\
  );\n});\n\npromise.catch(function(error) {\n    console.log(error.message);    \
  \ // \"Explosion!\"\n});\n```\n\n在这段代码中，执行器（executor）故意抛出了一个错误。每个执行器内部都有一个隐式的 `try-catch`，以便错误被捕获并传递给拒绝处理器（rejection\
  \ handler）。之前的示例等同于以下代码：\n\n```javascript\nlet promise = new Promise(function(resolve,\
  \ reject) {\n    try {\n        throw new Error(\"Explosion!\");\n    } catch (ex)\
  \ {\n        reject(ex);\n    }\n});\n\npromise.catch(function(error) {\n    console.log(error.message);\
  \     // \"Explosion!\"\n});\n```\n\n执行器捕捉任何抛出的错误以简化这种常见的用例，但执行器中抛出的错误只有在存在拒绝处理器时才会被报告。否则，错误会被抑制。这在开发者早期使用\
  \ promises 时是一个问题，JavaScript 环境通过提供提供捕获被拒绝 promise 的钩子（hooks）来解决这个问题。\n\n## 全局 拒绝处理\
  \ (Global Promise Rejection Handling)\n\nPromise 最具争议的方面之一是 promise 在没有拒绝处理器的情况下拒绝时的静默失败。一些人认为这是规范中最大的缺陷，因为它是\
  \ JavaScript 语言中唯一不让错误显现的部分。\n\n由于 promise 的特性，判断一个 promise 拒绝是否被处理并不是易事的。例如，考虑这个示例：\n\
  \n```javascript\nlet rejected = Promise.reject(42);\n// 此时，rejected 是未被处理的\n\n//\
  \ 一段时间之后...\n\nrejected.catch(function(value) {\n    // 现在 rejected 已被处理了\n    console.log(value);\n\
  });\n```\n\n你可以在任何点调用 `then()` 或 `catch()`，无论 promise 是否已就绪（settled），它们正常工作，这使得很难准确知道\
  \ promise 何时会被处理。在这种情况下，promise 立即被拒绝了，但直到之后才被处理。\n\n虽然 ECMAScript 的未来版本可能会解决这个问题，但\
  \ Node.js 和浏览器都实现了相应的更改来解决这一开发者的痛点。它们并不是 ECMAScript 6 规范的一部分，但在使用 promises 时是非常用的工具。\n\
  \n### Node.js 拒绝处理 (Node.js Rejection Handling)\n\nNode.js 在 `process` 对象上触发两个与\
  \ promise 拒绝处理相关的事件：\n\n- `unhandledRejection`: 当 promise 被拒绝且在事件循环的一个循环内没有调用拒绝处理器时，触发。\n\
  - `rejectionHandled`: 当 promise 被拒绝且在事件循环的一个循环后调用了拒绝处理器时，触发。\n\n这些事件旨在协同工作，帮助识别被拒绝且未被处理的\
  \ promise。\n\n`unhandledRejection` 事件处理器接收拒绝原因（通常是一个错误对象）和被拒绝的 promise 作为参数。以下代码显示了\
  \ `unhandledRejection` 的用法：\n\n```javascript\nlet rejected;\n\nprocess.on(\"unhandledRejection\"\
  , function(reason, promise) {\n    console.log(reason.message);             // \"\
  Explosion!\"\n    console.log(rejected === promise);      // true\n});\n\nrejected\
  \ = Promise.reject(new Error(\"Explosion!\"));\n```\n\n这个示例创建了一个带有错误对象的被拒绝 promise，并监听\
  \ `unhandledRejection` 事件。事件处理器接收错误对象作为第一个参数，接收 promise 作为第二个参数。\n\n`rejectionHandled`\
  \ 事件处理器只有一个参数，即被拒绝的 promise。例如：\n\n```javascript\nlet rejected;\n\nprocess.on(\"\
  rejectionHandled\", function(promise) {\n    console.log(rejected === promise);\
  \      // true\n});\n\nrejected = Promise.reject(new Error(\"Explosion!\"));\n\n\
  // 等待添加拒绝处理器\nsetTimeout(function() {\n    rejected.catch(function(value) {\n  \
  \      console.log(value.message);      // \"Explosion!\"\n    });\n}, 1000);\n\
  ```\n\n在这里，当拒绝处理器最终被调用时，会触发 `rejectionHandled` 事件。如果在 `rejected` 创建后直接将其附加到 `rejected`，该事件将不会触发。相反，拒绝处理器将在创建\
  \ `rejected` 的同一个事件循环中被调用，这是没有没用的。\n\n为了正确跟踪可能未处理的拒绝，请使用 `rejectionHandled` 和 `unhandledRejection`\
  \ 事件来存储一个可能未处理的拒绝列表。然后等待一段时间检查该列表。例如，查看这个简单的未处理拒绝跟踪器：\n\n```javascript\nlet possiblyUnhandledRejections\
  \ = new Map();\n\n// 当拒绝未处理时，将其添加到 map 中\nprocess.on(\"unhandledRejection\", function(reason,\
  \ promise) {\n    possiblyUnhandledRejections.set(promise, reason);\n});\n\nprocess.on(\"\
  rejectionHandled\", function(promise) {\n    possiblyUnhandledRejections.delete(promise);\n\
  });\n\nsetInterval(function() {\n    possiblyUnhandledRejections.forEach(function(reason,\
  \ promise) {\n        console.log(reason ? reason.message : reason);\n    });\n\
  }, 60000);\n```\n\n这段代码使用 `Map` 来存储 promise 及其原因。每个 promise 都是一个键，原因是值。每次触发 `unhandledRejection`，promise\
  \ 就会被添加到 map 中。每次触发 `rejectionHandled`，promise 就会从 map 中移除。`setInterval` 调用定期检查列表并输出任何剩余的未处理拒绝。\n\
  \n虽然这个示例特定于 Node.js，但浏览器也实现了类似的机制来通知开发者未处理的拒绝。\n\n### 浏览器拒绝处理 (Browser Rejection\
  \ Handling)\n\n浏览器也触发了两个事件来识别未处理的拒绝。这些事件由 `window` 对象触发，并与 Node.js 的对应物相同：\n\n-\
  \ `unhandledRejection`: 当 promise 被拒绝且在事件循环的一个循环内没有调用拒绝处理器时触发。\n- `rejectionHandled`:\
  \ 当 promise 被拒绝且在事件循环的一个循环后调用了拒绝处理器时触发。\n\n尽管 Node.js 实现向事件处理器传递单独参数，但这些浏览器事件处理器接收一个包含以下属性的事件对象：\n\
  \n- `type`: 事件名称（\"unhandledrejection\" 或 \"rejectionhandled\"）\n- `promise`: 被拒绝的\
  \ promise\n- `reason`: promise 的拒绝值\n\n浏览器实现的另一个区别是拒绝值（`reason`）对两个事件都可用。例如：\n\n\
  ```javascript\nlet rejected;\n\nwindow.onunhandledrejection = function(event) {\n\
  \    console.log(event.type);                 // \"unhandledrejection\"\n    console.log(event.reason.message);\
  \       // \"Explosion!\"\n    console.log(rejected === event.promise); // true\n\
  };\n\nwindow.onrejectionhandled = function(event) {\n    console.log(event.type);\
  \                 // \"rejectionhandled\"\n    console.log(event.reason.message);\
  \       // \"Explosion!\"\n    console.log(rejected === event.promise); // true\n\
  };\n\nrejected = Promise.reject(new Error(\"Explosion!\"));\n```\n\n这段代码使用 DOM Level\
  \ 0 语法 `onunhandledrejection` 和 `onrejectionhandled` 分配了两个事件处理器。（如果你喜欢，也可以使用 `addEventListener(\"\
  unhandledrejection\")` 和 `addEventListener(\"rejectionhandled\")`）。每个事件处理器都接收一个包含被拒绝\
  \ promise 信息的事件对象。\n\n\n\n\n\n在浏览器中跟踪未处理拒绝（unhandled rejections）的代码与 Node.js 的代码也非常相似：\n\
  \n```javascript\nlet possiblyUnhandledRejections = new Map();\n\n// 当拒绝未被处理时，将其添加到\
  \ map 中\nwindow.onunhandledrejection = function(event) {\n    possiblyUnhandledRejections.set(event.promise,\
  \ event.reason);\n};\n\nwindow.onrejectionhandled = function(event) {\n    possiblyUnhandledRejections.delete(event.promise);\n\
  };\n\nsetInterval(function() {\n    possiblyUnhandledRejections.forEach(function(reason,\
  \ promise) {\n        console.log(reason.message ? reason.message : reason);\n \
  \       // 执行某些操作来处理这些拒绝\n        handleRejection(promise, reason);\n    });\n \
  \   possiblyUnhandledRejections.clear();\n}, 60000);\n```\n\n这种实现方式与 Node.js 的实现几乎完全相同。它使用了相同的方法：在\
  \ map 中存储 promise 及其拒绝值，然后在稍后对其进行检查。唯一的区别在于从事件处理程序的哪里获取信息。\n\n处理 promise 拒绝可能会很复杂，但你刚刚开始看到\
  \ promise 到底有多强大。现在是时候采取下一步了，将多个 promise 链式连接在一起。\n\n### Promise 链式调用\n\n在此时，promise\
  \ 似乎仅仅是相对于使用回调函数和 `setTimeout()` 函数组合的微小改进，但 promise 的奥远比表面看到的要得多。具体来说，有多种方法可以将\
  \ promise 链式连接起来以完成更复杂的异步行为。\n\n每次调用 `then()` 或 `catch()` 实际上都会创建并返回另一个 promise。只有当第一个\
  \ promise 被完成（fulfilled）或拒绝（rejected）时，第二个 promise 才会解析（resolved）。考虑这个示例：\n\n```javascript\n\
  let p1 = new Promise(function(resolve, reject) {\n    resolve(42);\n});\n\np1.then(function(value)\
  \ {\n    console.log(value);\n}).then(function() {\n    console.log(\"Finished\"\
  );\n});\n```\n\n这段代码输出如下：\n\n```\n42\nFinished\n```\n\n`p1.then()` 的调用返回了第二个 promise，并在上面调用了\
  \ `then()`。第二个 `then()` 完成处理程序只有在第一个 promise 被解析后才会被调用。如果你解开这个示例的链，它看起来像这样：\n\n\
  ```javascript\nlet p1 = new Promise(function(resolve, reject) {\n    resolve(42);\n\
  });\n\nlet p2 = p1.then(function(value) {\n    console.log(value);\n})\n\np2.then(function()\
  \ {\n    console.log(\"Finished\");\n});\n```\n\n在这个解链的版本中，`p1.then()` 的结果被存储在 `p2`\
  \ 中，然后调用 `p2.then()` 来添加最后的完成处理程序。正如你可能猜到的，`p2.then()` 的调用也会返回一个 promise，但这个示例并没有使用那个\
  \ promise。\n\n## 捕获错误\n\nPromise 链式调用允许你捕获在上一个 promise 的完成或拒绝处理程序中可能错误。例如：\n\n```javascript\n\
  let p1 = new Promise(function(resolve, reject) {\n    resolve(42);\n});\n\np1.then(function(value)\
  \ {\n    throw new Error(\"Boom!\");\n}).catch(function(error) {\n    console.log(error.message);\
  \     // \"Boom!\"\n});\n```\n\n在这段代码中，`p1` 的完成处理程序抛出了错误。链式调用 `catch()` 方法（它位于第二个\
  \ promise 上）能够通过其拒绝处理程序接收该错误。如果拒绝处理程序抛出错误，情况也是如此：\n\n```javascript\nlet p1 = new\
  \ Promise(function(resolve, reject) {\n    throw new Error(\"Explosion!\");\n});\n\
  \np1.catch(function(error) {\n    console.log(error.message);     // \"Explosion!\"\
  \n    throw new Error(\"Boom!\");\n}).catch(function(error) {\n    console.log(error.message);\
  \     // \"Boom!\"\n});\n```\n\n在这里，执行器抛出了一个错误并触发了 `p1` promise 的拒绝处理程序。该处理程序随后抛出另一个错误，该错误被第二个\
  \ promise 的拒绝处理程序捕获。链式 promise 调用感知链中其他 promise 的错误。\n\n**注意**\n\n*始终在 promise 链的末尾保留一个拒绝处理程序，以确保你可以妥善处理可能发生的任何错误。*\n\
  \n### 在 Promise 链中返回数值\n\nPromise 链的另一个重要方面是将数据从一个 promise 传递到下一个 promise 的。我已经展示了传递给执行器内部\
  \ `resolve()` 处理程序的值是如何传递给该 promise 的完成处理程序的，但你可以通过在完成处理程序中指定返回值来继续沿链传递数据。例如：\n\n\
  ```javascript\nlet p1 = new Promise(function(resolve, reject) {\n    resolve(42);\n\
  });\n\np1.then(function(value) {\n    console.log(value);\n});\n```\n\n*（注：原文后半部分包含大量重复/乱码字符，已根据文档上下文清理逻辑并保持核心含义。）*\n\
  \n### 在 Promise 链中返回数值 \n\nPromise 链的另一个重要方面是将数据从一个 promise 传递到下一个 promise 的。我已经展示了传递给执行器内部\
  \ `resolve()` 处理程序的值是如何传递给该 promise 的完成处理程序的，但你可以通过在完成处理程序中指定返回值来继续沿链传递数据。例如：\n\n\
  ```javascript\nlet p1 = new Promise(function(resolve, reject) {\n    resolve(42);\n\
  });\n\np1.then(function(value) {\n    console.log(value);\n});\n```\n\n## 在 Promise\
  \ 链中返回 Promise\n\n从完成和拒绝处理程序返回原始值允许传递数据，但如果你返回一个对象呢？如果该对象是一个 promise，请考虑以下情况：\n\n\
  ```javascript\nlet p1 = new Promise(function(resolve, reject) {\n    resolve(42);\n\
  });\n\nlet p2 = new Promise(function(resolve, reject) {\n    resolve(43);\n});\n\
  \np1.then(function(value) {\n    console.log(value);\n    return p2;\n}).then(function(value)\
  \ {\n    console.log(value);\n});\n```\n\n这种模式的重要一点是，第二个完成处理程序没有被添加到 `p2`，而是添加到第三个\
  \ promise。这使得示例等同于：\n\n```javascript\nlet p1 = new Promise(function(resolve, reject)\
  \ {\n    resolve(42);\n});\n\nlet p2 = new Promise(function(resolve, reject) {\n\
  \    resolve(43);\n});\n\nlet p3 = p1.then(function(value) {\n    console.log(value);\n\
  \    return p2;\n});\n\np3.then(function(value) {\n    console.log(value);\n});\n\
  ```\n\n在这里，很明显第二个完成处理程序是挂载在 `p3` 而不是 `p2`。这是一个微妙但重要的区别，因为如果 `p2` 被拒绝，第二个完成处理程序将不会被调用。例如：\n\
  \n```javascript\nlet p1 = new Promise(function(resolve, reject) {\n    resolve(42);\n\
  });\n\nlet p2 = new Promise(function(resolve, reject) {\n    reject(43);\n});\n\n\
  p1.then(function(value) {\n    console.log(value);\n    return p2;\n}).then(function(value)\
  \ {\n    console.log(value);\n});\n```\n\n\n\n\n\n在这个示例中，第二个成功处理函数永远不会调用，因为 `p2`\
  \ 被拒绝了。然而，你可以挂载一个拒绝处理器：\n\n```javascript\nlet p1 = new Promise(function(resolve,\
  \ reject) {\n    resolve(42);\n});\n\nlet p2 = new Promise(function(resolve, reject)\
  \ {\n    reject(43);\n});\n\np1.then(function(value) {\n    // 第一个成功处理函数\n    console.log(value);\
  \      // 42\n    return p2;\n}).catch(function(value) {\n    // 拒绝处理器\n    console.log(value);\
  \      // 43\n});\n```\n\n现在，由于 `p2` 被拒绝，拒绝处理器被调用。来自 `p2` 的拒绝值 `43` 被传递给该拒绝处理器。\n\
  \n从成功或拒绝处理函数中返回 thenables（类似方法的对象）不会改变 promise 执行器执行的顺序。第一个定义的 promise 将先运行它的执行器，然后是第二个\
  \ promise 执行器将运行，依此类推。返回 thenables 仅仅允许你对 promise 的结果定义额外的响应。你通过在成功处理函数内部创建一个新的\
  \ promise 来推迟成功处理函数的执行。例如：\n\n```javascript\nlet p1 = new Promise(function(resolve,\
  \ reject) {\n    resolve(42);\n});\n\np1.then(function(value) {\n    console.log(value);\
  \      // 42\n    // 创建一个新的 promise\n    let p2 = new Promise(function(resolve,\
  \ reject) {\n        resolve(43);\n    });\n    return p2\n}).then(function(value)\
  \ {\n    console.log(value);      // 43\n});\n```\n\n在这个示例中，在 `p1` 的成功处理函数内部创建了一个新的\
  \ promise。这意味着第二个成功处理函数直到 `p2` 成功之后才会执行。这种模式在你想要触发另一个 promise 之前等待上一个 promise 状态确定（settled）时非常有用。\n\
  \n## 响应多个 promise\n\n到目前为止，本章中的每个示例都是一次处理一个 promise。但有时你可能想要监控多个 promise 的进度以决定下一步操作。ECMAScript\
  \ 6 提供了两种监控多个 promise 方法：`Promise.all()` 和 `Promise.race()`。\n\n## Promise.all()\
  \ 方法\n\n`Promise.all()` 方法接受单个参数，它是一个需要监控的 promise 可迭代对象（例如数组），并返回一个 promise，只有当迭代对象中的每一个\
  \ promise 都成功解析时，该 promise 才会被解析。当迭代对象中的每个 promise 都成功时，返回的 promise 变为成功，如示例所示：\n\
  \n```javascript\nlet p1 = new Promise(function(resolve, reject) {\n    resolve(42);\n\
  });\n\nlet p2 = new Promise(function(resolve, reject) {\n    resolve(43);\n});\n\
  \nlet p3 = new Promise(function(resolve, reject) {\n    resolve(44);\n});\n\nlet\
  \ p4 = Promise.all([p1, p2, p3]);\n\np4.then(function(value) {\n    console.log(Array.isArray(value));\
  \  // true\n    console.log(value[0]);              // 42\n    console.log(value[1]);\
  \              // 43\n    console.log(value[2]);              // 44\n});\n```\n\n\
  这里的每个 promise 都用数字解析。对 `Promise.all()` 的调用创建了 promise `p4`，它在 `p1`、`p2` 和 `p3` 都成功后最终变为成功状态。传递给\
  \ `p4` 成功处理器的结果是一个包含每个解析值的数组：`42`、`43` 和 `44`。这些值按照 promise 解析的顺序存储，因此你可以将 promise\
  \ 结果与解析出结果 promise 相匹配。\n\n如果传递给 `Promise.all()` 的任何 promise 被拒绝，返回的 promise 将立即被拒绝，而无需等待其他\
  \ promise 完成：\n\n```javascript\nlet p1 = new Promise(function(resolve, reject) {\n\
  \    resolve(42);\n});\n\nlet p2 = new Promise(function(resolve, reject) {\n   \
  \ reject(43);\n});\n\nlet p3 = new Promise(function(resolve, reject) {\n    resolve(44);\n\
  });\n\nlet p4 = Promise.all([p1, p2, p3]);\n\np4.catch(function(value) {\n    console.log(Array.isArray(value))\
  \ // false\n    console.log(value);              // 43\n});\n```\n\n在这个示例中，`p2`\
  \ 被拒绝，值为 `43`。`p4` 的拒绝处理器被立即调用，无需等待 `p1` 或 `p3` 完成。（它们会完成执行；只是 `p4` 并没有等待。）拒绝处理器始终接收一个值而不是数组，该值是被拒绝的\
  \ promise 的拒绝值。在这种情况下，拒绝处理器接收了 `43` 以反映来自 `p2` 的拒绝。\n\n## Promise.race() 方法\n\n\
  `Promise.race()` 方法为监控多个 promise 提供了一个略有不同的视角。该方法也接受一个需要监控的 promise 可迭代对象并返回一个 promise，但一旦第一个\
  \ promise 状态确定（settled），返回的 promise 就会状态确定。不像 `Promise.all()` 方法那样等待所有 promise 都变为成功，`Promise.race()`\
  \ 方法在数组中任何 promise 成功时就会返回一个合适的 promise。例如：\n\n```javascript\nlet p1 = Promise.resolve(42);\n\
  let p2 = new Promise(function(resolve, reject) {\n    resolve(43);\n});\nlet p3\
  \ = new Promise(function(resolve, reject) {\n    resolve(44);\n});\nlet p4 = Promise.race([p1,\
  \ p2, p3]);\n\np4.then(function(value) {\n    console.log(value);      // 42\n});\n\
  ```\n\n\n\n\n\n```javascript\nlet p2 = MyPromise.resolve(p1);\n\np2.success(function(value)\
  \ {\n    console.log(value);             // 42\n});\n\nconsole.log(p2 instanceof\
  \ MyPromise);   // true\n```\n\n在这里，`p1` 是一个内置的 promise，被传递给 `MyPromise.resolve()`\
  \ 方法。结果 `p2` 是 `MyPromise` 的实例，其中来自 `p1` 的解析值被传递给了成功处理器（fulfillment handler）。\n\n\
  如果将 `MyPromise` 的实例传递给 `MyPromise.resolve()` 或 `MyPromise.reject()` 方法，它将会被直接返回，而不会被解析。在所有其他情况下，这两个方法的行为与\
  \ `Promise.resolve()` 和 `Promise.reject()` 一。\n\n## 基于 Promise 的异步任务运行\n\n在第八章中，我介绍了生成器（generators），并向你展示了如何使用它们来运行异步任务，如下：\n\
  \n```javascript\nlet fs = require(\"fs\");\n\nfunction run(taskDef) {\n    // 创建迭代器，供其他地方使用\n\
  \    let task = taskDef();\n    // 启动任务\n    let result = task.next();\n    // 持续调用\
  \ next() 的递归函数\n    function step() {\n        // 如果还有需要要做\n        if (!result.done)\
  \ {\n            if (typeof result.value === \"function\") {\n                result.value(function(err,\
  \ data) {\n                    if (err) {\n                        result = task.throw(err);\n\
  \                        return;\n                    }\n                    result\
  \ = task.next(data);\n                    step();\n                });\n       \
  \     } else {\n                result = task.next(result.value);\n            \
  \    step();\n            }\n        }\n    }\n    // 启动进程\n    step();\n}\n\n//\
  \ 定义一个供任务运行器使用的函数\nfunction readFile(filename) {\n    return function(callback)\
  \ {\n        fs.readFile(filename, callback);\n    };\n}\n\n// 运行一个任务\nrun(function*()\
  \ {\n    let contents = yield readFile(\"config.json\");\n    doSomethingWith(contents);\n\
  \    console.log(\"Done\");\n});\n```\n\n这种实现带来了一些痛点。首先，将每个函数包装在一个返回返回函数的函数中有点让人困惑（即使这句话本身也让人困惑）。其次，没有办法区分一个作为任务运行器回调的函数返回值，与一个不是回调的返回值。\n\
  \n你可以通过确保每个异步操作都返回一个 promise 来极极地简化并泛化这一过程。这里是使用 promise 作为所有异步代码的通用接口来简化任务运行器的一种方法：\n\
  \n```javascript\nlet fs = require(\"fs\");\n\nfunction run(taskDef) {\n    // 创建迭代器\n\
  \    let task = taskDef();\n    // 启动任务\n    let result = task.next();\n    // 用于迭代的递归函数\n\
  \    (function step() {\n        // 如果还有需要要做\n        if (!result.done) {\n    \
  \        // 解析为 promise 以于处理\n            let promise = Promise.resolve(result.value);\n\
  \            promise.then(function(value) {\n                result = task.next(value);\n\
  \                step();\n            }).catch(function(error) {\n             \
  \   result = task.throw(error);\n                step();\n            });\n    \
  \    }\n    }());\n}\n\n// 定义一个供任务运行器使用的函数\nfunction readFile(filename) {\n    return\
  \ new Promise(function(resolve, reject) {\n        fs.readFile(filename, function(err,\
  \ contents) {\n            if (err) {\n                reject(err);\n          \
  \  } else {\n                resolve(contents);\n            }\n        });\n  \
  \  });\n}\n\n// 运行一个任务\nrun(function*() {\n    let contents = yield readFile(\"\
  config.json\");\n    doSomethingWith(contents);\n    console.log(\"Done\");\n});\n\
  ```\n\n在这一版本的代码中，通用的 `run()` 函数执行一个生成器创建一个迭代器。它调用 `task.next()` 来启动任务，并递归地调用 `step()`\
  \ 直到迭代器完成。\n\n在 `step()` 函数内部，如果还有更多工作要做，则 `result.done` 为 `false`。此时，`result.value`\
  \ 应该是一个 promise，但为了保险调用了 `Promise.resolve()` 以防该函数没有返回 promise。（记住，`Promise.resolve()`\
  \ 只是直接透传任何 promise，并将任何非 promise 包装在 promise 中）。接下来，添加了一个成功处理器，获取 promise 值并将该值传回迭代器。然后，在\
  \ `step()` 函数调用自身之前，`result` 被赋值为下一个 yield 结果。\n\n拒绝处理器会将任何拒绝结果存储在错误对象中。`task.throw()`\
  \ 方法将该错误对象传回迭代器，如果任务中捕获到错误，`result` 被赋值为下一个 yield 结果。最后，在 `catch()` 内部调用 `step()`\
  \ 以继续。\n\n这个 `run()` 函数可以运行任何使用 `yield` 实现异步代码的生成器，而无需向开发者暴露 promise（或回调）。事实上，由于函数调用的返回值总是被转换为\
  \ promise，因此函数甚至可以返回 promise 以外的内容。这意味着当使用 `yield` 调用时，同步和异步方法都能正常工作，你永远不需要检查返回值是否为\
  \ promise。\n\n唯一担心的是确保像 `readFile()` 这样的异步函数返回的是一个能正确识别其状态的 promise。对于 Node.js 内置方法，这意味着你必须将这些方法转换为返回\
  \ promise 而不是使用回调。\n\n## 未来的异步任务运行\n\n为 JavaScript 中的异步任务运行引入更简单的语法正在进行中。例如，一种 `await`\
  \ 语法正在开发中，它将紧密镜像上一节中基于 promise 的示例。基本思想是使用带有 `async` 标记的函数代替生成器，并在调用函数时使用 `await`\
  \ 代替 `yield`，例如：\n\n```javascript\n(async function() {\n    let contents = await\
  \ readFile(\"config.json\");\n    doSomethingWith(contents);\n    console.log(\"\
  Done\");\n});\n```\n\n函数前的 `async` 关键字表示该函数旨在异步方式运行。`await` 关键字信号对 `readFile(\"\
  config.json\")` 的调用应该返回一个 promise，如果没有，则响应应该被包装在 promise 中。与上一节中 `run()` 的实现一样，如果\
  \ promise 被拒绝，`await` 将抛出一个错误，否则返回 promise 的值。`await` 语法预计将在 ECMAScript 2017 (ECMAScript\
  \ 8) 中确定。\n\n## 总结\n\nPromise 的设计旨在改进 JavaScript 的异步编程，通过比事件和回调对异步操作提供更多的控制和组合能力。Promise\
  \ 调度任务并添加到 JavaScript 引擎的任务队列中供未来执行，另一个任务队列则跟踪 promise 的成功和拒绝处理器以确保正确执行。\n\nPromise\
  \ 有三种状态：等待中（pending）、已完成（fulfilled）和已拒绝（rejected）。promise 开始处于等待中状态，并在成功时变为已完成，在失败时变为已拒绝。在任何情况下，你都可以添加处理器来指示\
  \ promise 的结算。`then()` 方法允许你分配成功和拒绝处理器，而 `catch()` 方法允许你只分配一个拒绝处理器。\n\n你可以以多种方式链联\
  \ promise 并在它们之间传递信息。每次调用 `then()` 都会创建并返回一个新的 promise，该 promise 在之前的 promise 解析时被解析。这种链可以用于触发一系列异步事件的响应。你还可以使用\
  \ `Promise.race()` 和 `Promise.all()` 来监控多个 promise 的进度并做出相应响应。\n\n\n\n\n当将生成器（generators）和承诺（promises）结合时，异步任务的运行会变得更容易，因为承诺为异步操作返回提供了一个通用接口。你可以使用生成器和\
  \ `yield` 运算符来等待异步响应并做出相应的响应。\n\n大多数新的 Web API 都是在承诺之上构建的，你可以预计未来会有更多 API 效仿此。\n\
  \n# 12 代理（PROXIES）与反射 API（REFLECTION API）\n\n![image](img/common-01.jpg)\n\nECMAScript\
  \ 5 和 ECMAScript 6 在开发时都考虑了揭示 JavaScript 功能的设计。例如，在 ECMAScript 5 之前，JavaScript 环境虽然包含了不可枚举（nonenumerable）和不可写（nonwritable）的对象属性，但开发者无法定义自己的不可枚举或不可写属性。ECMAScript\
  \ 5 引入了 `Object.defineProperty()` 方法，这让开发者能够执行原本只有 JavaScript 引擎已经能够实现的操作。\n\nECMAScript\
  \ 6 通过添加内置对象让开发者能够进一步访问 JavaScript 引擎的能力。为了允许开发者创建内置对象，该语言通过 `proxies`（代理）暴露对象的内部工作机制，代理是可以拦截并修改底层\
  \ JavaScript 引擎操作的包装器。本章将从详细描述代理旨在解决的问题开始，然后讨论如何有效地创建和使用代理。\n\n## 数组问题\n\nJavaScript\
  \ 数组对象的行为方式在 ECMAScript 6 之前是开发者无法在自己的对象中模拟的。当你给特定的数组项赋值时，数组的 `length` 属性会受到影响，而且你可以通过修改\
  \ `length` 属性来修改数组项。例如：\n\n```javascript\nlet colors = [\"red\", \"green\", \"blue\"\
  ];\n\nconsole.log(colors.length);           // 3\n\ncolors[3] = \"black\";\n\nconsole.log(colors.length);\
  \           // 4\n\nconsole.log(colors[3]);               // \"black\"\n\ncolors.length\
  \ = 2;\n\nconsole.log(colors.length);           // 2\n\nconsole.log(colors[3]);\
  \               // undefined\n\nconsole.log(colors[2]);               // undefined\n\
  \nconsole.log(colors[1]);               // \"green\"\n```\n\n`colors` 数组初始有三个项。给\
  \ `colors[3]` 赋值 \"black\" 会将 `length` 属性自动增加到 4。将 `length` 属性设置为 2 会移除数组中的最后两个项，只留下前两个项。ECMAScript\
  \ 5 中没有任何机制允许开发者实现这种行为，但代理改变了这一点。\n\n**注意**\n\n这种数值属性和 `length` 属性的非标准行为，就是数组在 ECMAScript\
  \ 6 中被视为奇异对象（exotic objects）的原因。\n\n## 介绍代理与反射\n\n调用 `Proxy()` 会创建一个代理来替代另一个对象（称为*target*，目标）。代理对目标进行*虚拟化*，使得代理和目标在功能上看起来是相同的。\n\
  \n代理允许你拦截目标上的底层对象操作，而这些操作通常在 JavaScript 引擎中是内部的。这些底层操作通过*trap*（陷阱）进行拦截，陷阱是一个响应特定操作的函数。\n\
  \n由 `Reflect` 对象表示的反射 API 是一系列方法，它们为代理可以覆盖的相同底层操作提供了默认行为。每个代理陷阱都有一个对应的 `Reflect`\
  \ 方法。这些方法的名称与其对应的代理陷阱相同，并接收相同的参数。表 12-1 总结了代理陷阱的行为。\n\n**表 12-1：JavaScript 中的代理陷阱**\n\
  \n| **代理陷阱 (Proxy trap)** | **覆盖的操作的行为** | **默认行为** |\n| --- | --- | --- |\n| get\
  \ | 读取属性值 | `Reflect.get()` |\n| set | 写入属性 | `Reflect.set()` |\n| has | `in` 运算符\
  \ | `Reflect.has()` |\n| deleteProperty | `delete` 运算符 | `Reflect.deleteProperty()`\
  \ |\n| getPrototypeOf | `Object.getPrototypeOf()` | `Reflect.getPrototypeOf()` |\n\
  | setPrototypeOf | `Object.setPrototypeOf()` | `Reflect.setPrototypeOf()` |\n| isExtensible\
  \ | `Object.isExtensible()` | `Reflect.isExtensible()` |\n| preventExtensions |\
  \ `Object.preventExtensions()` | `Reflect.preventExtensions()` |\n| getOwnPropertyDescriptor\
  \ | `Object.getOwnPropertyDescriptor()` | `Reflect.getOwnPropertyDescriptor()` |\n\
  | defineProperty | `Object.defineProperty()` | `Reflect.defineProperty` |\n| ownKeys\
  \ | `Object.keys()`, `Object.getOwnPropertyNames()`, and `Object.getOwnPropertySymbols()`\
  \ | `Reflect.ownKeys()` |\n| apply | 调用函数 | `Reflect.apply()` |\n| construct | 使用\
  \ `new` 调用函数 | `Reflect.construct()` |\n\n每个陷阱都覆盖了 JavaScript 对象的某些内置行为，允许你拦截并修改这些行为。如果你仍然需要使用内置行为，可以使用相应的反射\
  \ API 方法。当你开始创建代理时，代理与反射 API 之间的关系就会变得清晰，因此最好深入并查看一些示例。\n\n**注意**\n\n原始的 ECMAScript\
  \ 6 规范还有一个额外的名为 `enumerate` 的陷阱，旨在更改 `for-in` 和 `Object.keys()` 枚举对象上属性的方式。然而，`enumerate`\
  \ 陷阱在 ECMAScript 7（也称为 ECMAScript 2016）中被移除，因为在实现过程中发现了困难。`enumerate` 陷阱在任何 JavaScript\
  \ 环境中不再存在，因此本章不再包含该内容。\n\n## 创建简单的代理\n\n当你使用 `Proxy` 构造函数创建代理时，你会向它传递两个参数：目标（target）和处理器（handler）。*处理器*是一个定义了一个或多个陷阱的对象。代理在没有定义陷阱的操作时使用默认行为。要创建一个转发代理，你可以使用不带陷阱的处理器，如下：\n\
  \n```javascript\nlet target = {};\n\nlet proxy = new Proxy(target, {});\n\nproxy.name\
  \ = \"proxy\";\n\nconsole.log(proxy.name);      // \"proxy\"\n\nconsole.log(target.name);\
  \      // \"proxy\"\n\ntarget.name = \"target\";\n\nconsole.log(proxy.name);   \
  \   // \"target\"\nconsole.log(target.name);      // \"target\"\n```\n\n在这个示例中，代理将所有操作转发给目标。当赋值\
  \ \"proxy\" 给 `proxy.name` 时，target 上创建了 name。代理并没有存储该属性；它将操作转发给了 target。同样，`proxy.name`\
  \ 和 `target.name` 的值是相同的，因为它们引用的是 `target`。这意味着设置 `target.name` 会改变 `proxy.name`。当然，没有陷阱的代理并不有趣，那么当你定义陷阱时会发生什么？\n\
  \n### 使用 set 陷阱验证属性\n\n假设你想创建一个属性值必须为数字的对象。这意味着添加到对象的每个新属性都必须验证，如果值不是数字则必须抛出错误。为了完成此任务，你可以定义一个覆盖设置值行为的\
  \ `set` 陷阱。`set` 陷阱接收四个参数：\n\ntrapTarget: 将接收属性的对象（代理的目标）\n\nkey: 要写入的属性键（字符串或符号）\n\
  \nvalue: 写入属性的值\n\nreceiver: 发生发生的对象（通常是代理）\n\n`Reflect.set()` 是 `set` 陷阱对应的反射方法，它是该操作的默认行为。`Reflect.set()`\
  \ 方法接收与 `set` 代理陷阱相同的四个参数，使得该方法在陷阱内部易于使用。陷阱应该在设置成功时返回 `true`，否则返回 `false`。（`Reflect.set()`\
  \ 方法根据操作是否成功返回正确的值。）\n\n为了验证属性值，你会使用 `set` 陷阱并检查传入的值。这是一个示例：\n\n```javascript\n\
  let target = {\n  name: \"target\"\n};\n\nlet proxy = new Proxy(target, {\n  set(trapTarget,\
  \ key, value, receiver) {\n    // 忽略现有属性以免影响它们\n    if (!trapTarget.hasOwnProperty(key))\
  \ {\n      if (isNaN(value)) {\n```\n\n\n\n\n```javascript\nthrow new TypeError(\"\
  Property must be a number.\");\n\n}\n\n}\n\n// 添加属性\n\nreturn Reflect.set(trapTarget,\
  \ key, value, receiver);\n\n}\n\n});\n\n// 添加新属性\n\nproxy.count = 1;\n\nconsole.log(proxy.count);\
  \      // 1\n\nconsole.log(target.count);      // 1\n\n// 你可以给 name 赋值，因为它已经在 target\
  \ 上存在\n\nproxy.name = \"proxy\";\n\nconsole.log(proxy.name);        // \"proxy\"\
  \nconsole.log(target.name);        // \"proxy\"\n\n// 抛出错误\n\nproxy.anotherName\
  \ = \"proxy\";\n```\n\n这段代码定义了一个代理拦截器（trap），用于验证添加到 `target` 的任何新属性的值。当执行 `proxy.count\
  \ = 1` 时，会调用 `set` 拦截器。`trapTarget` 的值等于 `target`，`key` 为 `\"count\"`，`value` 为\
  \ `1`，而 `receiver`（在此示例中未使用）为 `proxy`。`target` 中不存在名为 `count` 的现有属性，因此 `proxy` 通过将其传递给\
  \ `isNaN()` 来验证值。如果结果为 `NaN`，说明属性值不是数字，并将抛出错误。由于这段代码将 `count` 设置为 `1`，`proxy` 调用\
  \ `Reflect.set()` 并使用传递给拦截器的相同四个参数来添加新属性。\n\n当给 `proxy.name` 赋值字符串时，操作成功完成。由于 `target`\
  \ 已经有一个 `name` 属性，通过调用 `trapTarget.hasOwnProperty()` 方法，该属性会被验证之外。这确保了之前存在的非数字属性值仍然受到支持。\n\
  \n然而，当给 `proxy.anotherName` 赋值字符串时，会抛出错误。`target` 上不存在 `anotherName` 属性，因此需要对其值进行验证。在验证过程中，抛出了错误，因为\
  \ `\"proxy\"` 不是数值。\n\n`set` 代理拦截器允许你拦截属性的写入操作，而 `get` 代理拦截器允许你拦截属性的读取操作。\n\n###\
  \ 使用 get 拦截器进行对象形状（Object Shape）验证\n\nJavaScript 的特殊且有时令人困惑的方面之一，读取不存在的属性不会抛出错误。相反，使用\
  \ `undefined` 作为属性值，如例所示：\n\n```javascript\nlet target = {};\n\nconsole.log(target.name);\
  \     // undefined\n```\n\n在大多数其他语言中，尝试读取 `target.name` 会因为属性不存在而抛出错误。但 JavaScript\
  \ 仅为 `target.name` 属性的值使用 `undefined`。如果你处理过大型代码库，可能已经见过这种行为如何导致严重问题，特别是当属性名出现拼写错误时。代理通过对象形状验证来帮助你避免这个问题。\n\
  \n*对象形状*（object shape）是对象上可用的属性和方法的集合。JavaScript 引擎使用对象形状来优化代码，通常会创建类来表示对象。如果你能安全地假设对象将始终与其初始具有相同的属性和方法（这种行为可以通过\
  \ `Object.preventExtensions()` 方法、`Object.seal()` 方法或 `Object.freeze()` 方法强制执行），那么在尝试访问不存在的属性时抛出错误将会很有。代理使得对象形状验证变得简单。\n\
  \n由于属性验证只需要在读取属性时发生，因此你会使用 `get` 拦截器。当读取属性时，会调用 `get` 拦截器（即使该属性在对象上不存在），它接收三个参数：\n\
  \n- `trapTarget`：从从中读取属性的对象（`proxy` 的目标）\n- `key`：要读取的属性键（字符串或符号）\n- `receiver`：发生操作的对象（通常是\
  \ `proxy`）\n\n这些参数镜像了 `set` 拦截器的参数，但有一个明显的区别。它没有 `value` 参数，因为 `get` 拦截器不写入值。`Reflect.get()`\
  \ 方法接收与 `get` 拦截器相同的三个参数，并返回属性的默认值。\n\n你可以使用 `get` 拦截器和 `Reflect.get()` 在属性在 `target`\
  \ 上不存在时抛出错误，如下所示：\n\n```javascript\nlet proxy = new Proxy({}, {\n\n  get(trapTarget,\
  \ key, receiver) {\n    if (!(key in receiver)) {\n      throw new TypeError(\"\
  Property \" + key + \" doesn't exist.\");\n    }\n    return Reflect.get(trapTarget,\
  \ key, receiver);\n  }\n\n});\n\n// 添加属性仍然有效\n\nproxy.name = \"proxy\";\n\nconsole.log(proxy.name);\
  \            // \"proxy\"\n\n// 不 set 的属性会抛出错误\n\nconsole.log(proxy.nme);      \
  \      // 抛出错误\n```\n\n在此示例中，`get` 拦截器拦截了属性读取操作。`in` 运算符确定属性是否已存在于 `receiver` 上。使用\
  \ `receiver` 配合 `in` 而不是 `trapTarget`，是为了防 `receiver` 是具有 `has` 拦截器的代理（我将在下一节中介绍这种类型）。在这种情况下使用\
  \ `trapTarget` 将绕过 `has` 拦截器，并可能给你错误的结果。如果属性不存在，则抛出错误；否则，使用默认行为。\n\n这段代码允许无问题地添加、写入和读取\
  \ `proxy.name` 等新属性。最后一行包含一个拼写错误：`proxy.nme` 应该是 `proxy.name`。这会抛出一个错误，因为 `nme`\
  \ 不作为属性存在。\n\n### 使用 has 拦截器隐藏属性是否存在\n\n`in` 运算符确定属性是否存在于给定对象，如果是自有属性或原型属性，则返回 true。例如：\n\
  \n```javascript\nlet target = {\n  value: 42;\n}\n\nconsole.log(\"value\" in target);\
  \ // true\n```\n\n`value` 和 `toString` 于对象上，而 `toString` 是原型属性。每当使用 `in` 运算符时，都会调用\
  \ `has` 拦截器。调用时，有两个参数传递给 `has` 拦截器：\n\n- `trapTarget`：读取属性的对象（`proxy` 的目标）\n- `key`：要检查的属性键（字符串或符号）\n\
  \n`Reflect.has()` 方法接收相同的参数并返回 `in` 运算符的默认响应。使用 `has` 拦截器允许你更改某些属性的 `in` 行为。例如，你可以这样隐藏上例中的\
  \ `value` 属性：\n\n```javascript\nlet target = {\n  name: \"target\",\n  value: 42\n\
  };\n\nObject.defineProperty(target, \"name\", { configurable: false });\n\nlet proxy\
  \ = new Proxy(target, {\n  has(trapTarget, key) {\n    if (key === \"value\") {\n\
  \      return false;\n    } else {\n      return Reflect.has(trapTarget, key);\n\
  \    }\n  }\n});\n\nconsole.log(\"value\" in proxy); // false\nconsole.log(\"name\"\
  \ in proxy);  // true\nconsole.log(\"toString\" in proxy); // true\n```\n\n`proxy`\
  \ 的 `has` 拦截器检查 `key` 是否为 `\"value\"`，如果是则返回 `false`。否则，通过调用 `Reflect.has()` 使用默认行为。结果\
  \ `in` 运算符对 `value` 属性返回 `false`，尽管 `value` 实际上存在于 `target` 上。其他属性 `name` 和 `toString`\
  \ 在配合 `in` 运算符使用时正确返回 true。\n\n### 使用 delete 拦截器防止删除删除\n\n`delete` 运算符从对象中删除属性，成功返回\
  \ true，失败返回 false。在严格模式下，尝试删除不可配置属性会抛出错误；在非严格模式下，`delete` 仅返回 `false`。用例如下：\n\n\
  ```javascript\nlet target = {\n  name: \"target\",\n  value: 42\n};\n\nObject.defineProperty(target,\
  \ \"name\", { configurable: false });\n\nconsole.log(\"value\" in target); // true\n\
  \nlet result1 = delete target.value;\n\nconsole.log(result1);             // true\n\
  console.log(\"value\" in target); // false\n\n// 注意：此行在严格模式下会抛出错误\nlet result2 =\
  \ delete target.name;\n\nconsole.log(result2);           // false\nconsole.log(\"\
  name\" in target);  // true\n```\n\n\n\n\n\n`value` 属性通过 `delete` 操作符被删除，因此在第三次\
  \ `console.log()` 调用中，`in` 操作符返回 `false`。不可配置的 `name` 属性无法被删除，因此 `delete` 操作符简单地返回\
  \ `false`（如果你在严格模式下运行此代码，则会抛出错误）。你可以通过在 `proxy` 中 `deleteProperty` 拦截器来改变这种行为。\n\
  \n每当对对象属性使用 `delete` 操作符时，`deleteProperty` 拦截器就会调用。该拦截器接收两个参数：\n\n- `trapTarget`:\
  \ 应该删除该属性的对象（代理的目标对象）\n- `key`: 要删除的属性键（字符串或符号）\n\n`Reflect.deleteProperty()` 方法提供了\
  \ `deleteProperty` 拦截器的默认实现，并接受相同的两个参数。你可以结合 `Reflect.deleteProperty()` 和 `deleteProperty`\
  \ 拦截器来改变 `delete` 操作符的行为。例如，你可以确保 `value` 属性无法被删除，如下所示：\n\n```javascript\nlet target\
  \ = {\n    name: \"target\",\n    value: 42\n};\n\nlet proxy = new Proxy(target,\
  \ {\n    deleteProperty(trapTarget, key) {\n        if (key === \"value\") {\n \
  \           return false;\n        } else {\n            return Reflect.deleteProperty(trapTarget,\
  \ key);\n        }\n    }\n});\n\n// 尝试删除 proxy.value\nconsole.log(\"value\" in\
  \ proxy);      // true\nlet result1 = delete proxy.value;\nconsole.log(result1);\
  \              // false\nconsole.log(\"value\" in proxy);      // true\n\n// 尝试删除\
  \ proxy.name\nconsole.log(\"name\" in proxy);      // true\nlet result2 = delete\
  \ proxy.name;\nconsole.log(result2);              // true\nconsole.log(\"name\"\
  \ in proxy);      // false\n```\n\n这段代码与 `has` 拦截器的示例非常相似，`deleteProperty` 拦截器检查\
  \ `key` 是否为 `\"value\"`，如果是，则返回 `false`。否则，将通过调用 `Reflect.deleteProperty()` 方法来使用默认行为。由于操作被拦截，因此无法通过代理删除\
  \ `value` 属性，但 `name` 属性如预期地被删除了。当你想要保护属性不被删除且不想在严格模式下抛出错误时，这种方法特别有用。\n\n## 原型代理拦截器\n\
  \n第 4 章 介绍了 ECMAScript 6 添加的 `Object.setPrototypeOf()` 方法，以补充 ECMAScript 5 的 `Object.getPrototypeOf()`\
  \ 方法。代理允许你通过 `setPrototypeOf` 和 `getPrototypeOf` 拦截器拦截这两个方法的执行。在两种情况下，`Object` 上的方法都会调用代理上相应名的拦截器，允许你更改方法的行为。\n\
  \n由于原型代理与两个拦截器相关，每种拦截器都关联一组方法。`setPrototypeOf` 拦截器接收这些参数：\n\n- `trapTarget`: 应该设置原型的对象（代理的目标对象）\n\
  - `proto`: 用作原型的对象\n\n这些与传递给 `Object.setPrototypeOf()` 和 `Reflect.setPrototypeOf()`\
  \ 方法的参数相同。另一方面，`getPrototypeOf` 拦截器只接收 `trapTarget` 参数，即传递给 `Object.getPrototypeOf()`\
  \ 和 `Reflect.getPrototypeOf()` 方法的参数。\n\n### 原型代理拦截器如何工作\n\n原型代理拦截器具有一些限制。首先，`getPrototypeOf`\
  \ 拦截器必须返回对象或 `null`，任何其他返回值都会导致运行时错误。返回值检查确保了 `Object.getPrototypeOf()` 将始终返回预期的值。其次，如果操作未成功，`setPrototypeOf`\
  \ 拦截器的返回值必须为 `false`。当 `setPrototypeOf` 返回 `false` 时，`Object.setPrototypeOf()` 会抛出错误。如果\
  \ `setPrototypeOf` 返回 `false` 以外的任何值，`Object.setPrototypeOf()` 则认为操作成功。\n\n下面的示例通过始终返回\
  \ `null` 隐藏了代理的原型，并且不允许更改原型：\n\n```javascript\nlet target = {};\n\nlet proxy = new\
  \ Proxy(target, {\n    getPrototypeOf(trapTarget) {\n        return null;\n    },\n\
  \    setPrototypeOf(trapTarget, proto) {\n        return false;\n    }\n});\n\n\
  let targetProto = Object.getPrototypeOf(target);\nlet proxyProto = Object.getPrototypeOf(proxy);\n\
  \nconsole.log(targetProto === Object.prototype);    // true\nconsole.log(proxyProto\
  \ === Object.prototype);      // false\nconsole.log(proxyProto);               \
  \            // null\n\n// 成功\nObject.setPrototypeOf(target, {});\n\n// 抛出错误\nObject.setPrototypeOf(proxy,\
  \ {});\n```\n\n这段代码强调了 `target` 和 `proxy` 行为之间的差异。尽管 `Object.getPrototypeOf()` 为\
  \ `target` 返回了一个值，但它对 `proxy` 返回 `null`，因为调用了 `getPrototypeOf` 拦截器。同样，`Object.setPrototypeOf()`\
  \ 在 `target` 上使用时成功，但在 `proxy` 上使用时由于 `setPrototypeOf` 拦截器的报错。\n\n如果你想对这两个拦截器使用默认行为，可以使用\
  \ `Reflect` 上的对应方法。例如，以下代码实现了 `getPrototypeOf` 和 `setPrototypeOf` 拦截器的默认行为：\n\n\
  ```javascript\nlet target = {};\n\nlet proxy = new Proxy(target, {\n    getPrototypeOf(trapTarget)\
  \ {\n        return Reflect.getPrototypeOf(trapTarget);\n    },\n    setPrototypeOf(trapTarget,\
  \ proto) {\n        return Reflect.setPrototypeOf(trapTarget, proto);\n    }\n});\n\
  \nlet targetProto = Object.getPrototypeOf(target);\nlet proxyProto = Object.getPrototypeOf(proxy);\n\
  \nconsole.log(targetProto === Object.prototype);    // true\nconsole.log(proxyProto\
  \ === Object.prototype);      // true\n\n// 成功\nObject.setPrototypeOf(target, {});\n\
  \n// 也成功\nObject.setPrototypeOf(proxy, {});\n```\n\n在这个示例中，你可以互换使用 `target` 和 `proxy`\
  \ 并获得相同的结果，因为 `getPrototypeOf` 和 `setPrototypeOf` 拦截器只是透传给默认实现。\n\n### 为什么有两组方法？\n\
  \n`Reflect.getPrototypeOf()` 和 `Reflect.setPrototypeOf()` 令人困惑的地方在于它们看起来与 `Object.getPrototypeOf()`\
  \ 和 `Object.setPrototypeOf()` 方法非常相似。虽然两组方法执行的操作相似，但它们之间存在一些明显的区别。\n\n`Object.getPrototypeOf()`\
  \ 和 `Object.setPrototypeOf()` 是从一开始就为开发者使用创建的高级操作。`Reflect.getPrototypeOf()` 和 `Reflect.setPrototypeOf()`\
  \ 是低级操作，允许开发者访问以前仅限内部使用的 `[[GetPrototypeOf]]` 和 `[[SetPrototypeOf]]` 操作。`Reflect.getPrototypeOf()`\
  \ 方法是内部 `[[GetPrototypeOf]]` 操作的封装。`Reflect.setPrototypeOf()` 方法与 `[[SetPrototypeOf]]`\
  \ 具有相同的关系。\n\n如果参数不是对象，`Reflect.getPrototypeOf()` 方法会抛出错误，而 `Object.getPrototypeOf()`\
  \ 在执行操作之前会先将值转换为对象。如果你将数字传递给每个方法，将得到不同的结果：\n\n```javascript\nlet result1 = Object.getPrototypeOf(1);\n\
  console.log(result1 === Number.prototype); // true\n\n// 抛出错误\nReflect.getPrototypeOf(1);\n\
  ```\n\n`Object.getPrototypeOf()` 方法允许你获取数字 1 的原型，因为它首先将值转换为 `Number` 对象，然后返回 `Number.prototype`。`Reflect.getPrototypeOf()`\
  \ 方法没有转换值，由于 1 不是对象，所以它会抛出错误。\n\n\n\n\n\n`Reflect.setPrototypeOf()` 方法与 `Object.setPrototypeOf()`\
  \ 方法不同。具体来说，`Reflect.setPrototypeOf()` 返回一个布尔值，表示操作是否成功。成功返回 `true`，失败返回 `false`。如果\
  \ `Object.setPrototypeOf()` 失败，它会抛出一个错误。\n\n正如 第 252 页 上的“原型 代理拦截器是如何工作的”一文章中的第一个示例所示，当\
  \ `setPrototypeOf` 代理拦截器返回 `false` 时，它会导致 `Object.setPrototypeOf()` 抛出一个错误。`Object.setPrototypeOf()`\
  \ 方法将第一个参数作为其返回值，因此不适合实现 `setPrototypeOf` 代理拦截器的默认行为。以下代码演示了这些差异：\n\n```javascript\n\
  let target1 = {};\n\nlet result1 = Object.setPrototypeOf(target1, {});\n\nconsole.log(result1\
  \ === target1);              // true\n\nlet target2 = {};\n\nlet result2 = Reflect.setPrototypeOf(target2,\
  \ {});\n\nconsole.log(result2 === target2);               // false\n\nconsole.log(result2);\
  \                                    // true\n```\n\n在这个示例中，`Object.setPrototypeOf()`\
  \ 返回 `target1` 作为其值，而 `Reflect.setPrototypeOf()` 返回 `true`。这种细微的差异非常重要。你会在 `Object`\
  \ 和 `Reflect` 上看到更多看似重复的方法，但在任何代理拦截器内部，请务必使用 `Reflect` 上的方法。\n\n**注意**\n\n`Reflect.getPrototypeOf()`/*`Object.getPrototypeOf()`\
  \ 和 `Reflect.setPrototypeOf()`/`Object.setPrototypeOf()` 在用在代理上时，会分别调用 `getPrototypeOf`\
  \ 和 `setPrototypeOf` 代理拦截器。\n\n### 对象可扩展性拦截器\n\nECMAScript 5 通过 `Object.preventExtensions()`\
  \ 和 `Object.isExtensible()` 方法添加了对象扩展性的修改，而 ECMAScript 6 允许代理通过 `preventExtensions`\
  \ 和 `isExtensible` 拦截器来拦截对底层对象的这些调用。两个拦截器都接收一个名为 `trapTarget` 的参数，该参数是调用方法的对象。`isExtensible`\
  \ 拦截器必须返回一个布尔值，表示该对象是否可扩展，而 `preventExtensions` 拦截器必须返回一个布尔值，表示操作是否成功。\n\n`Reflect.preventExtensions()`\
  \ 和 `Reflect.isExtensible()` 方法实现了默认行为。两者都返回布尔值，因此你可以直接在相应的拦截器中使用它们。\n\n### 两个基础示例\n\
  \n为了看到对象可扩展性拦截器的作用，请考虑以下代码，它实现了 `isExtensible` 和 `preventExtensions` 拦截器的默认行为：\n\
  \n```javascript\nlet target = {};\n\nlet proxy = new Proxy(target, {\n\n    isExtensible(trapTarget)\
  \ {\n        return Reflect.isExtensible(trapTarget);\n    },\n    preventExtensions(trapTarget)\
  \ {\n        return Reflect.preventExtensions(trapTarget);\n    }\n});\n\nconsole.log(Object.isExtensible(target));\
  \      // true\nconsole.log(Object.isExtensible(proxy));      // true\n\nObject.preventExtensions(proxy);\n\
  \nconsole.log(Object.isExtensible(target));      // false\nconsole.log(Object.isExtensible(proxy));\
  \      // false\n```\n\n这个示例显示了 `Object.preventExtensions()` 和 `Object.isExtensible()`\
  \ 方法正确地从代理传递到了目标。当然，你可以更改行为。例如，如果你不想允许 `Object.preventExtensions()` 在你的代理上成功，你可以从\
  \ `preventExtensions` 拦截器中返回 `false`：\n\n```javascript\nlet target = {};\n\nlet\
  \ proxy = new Proxy(target, {\n\n    isExtensible(trapTarget) {\n        return\
  \ Reflect.isExtensible(trapTarget);\n    },\n    preventExtensions(trapTarget) {\n\
  \        return false\n    }\n});\n\nconsole.log(Object.isExtensible(target)); \
  \     // true\nconsole.log(Object.isExtensible(proxy));      // true\n\nObject.preventExtensions(proxy);\n\
  \nconsole.log(Object.isExtensible(target));      // true\nconsole.log(Object.isExtensible(proxy));\
  \      // true\n```\n\n在这里，对 `Object.preventExtensions(proxy)` 的调用被忽略了，因为 `preventExtensions`\
  \ 拦截器返回了 `false`。目标仍然保持可扩展。\n\n#### 重复的扩展性\n\n你可能注意到，`Object` 和 `Reflect` 上再次存在重复的方法。在这种情况下，`Object.isExtensible()`\
  \ 和 `Reflect.isExtensible()` 是相似的。`Object.preventExtensions()` 和 `Reflect.preventExtensions()`\
  \ 也是相似的。\n\n### 属性描述符拦截器\n\nECMAScript 5 的功能之一是使用 `Object.defineProperty()` 方法定义属性属性。在\
  \ JavaScript 的早期版本中，没有方法可以定义访问器属性、将属性设为只读或使属性不可枚举。所有这些功能都可以通过 `Object.defineProperty()`\
  \ 方法实现，并且你可以通过 `Object.getOwnPropertyDescriptor()` 方法获取这些属性。\n\n代理允许你使用 `defineProperty`\
  \ 和 `getOwnPropertyDescriptor` 拦截器分别拦截对 `Object.defineProperty()` 方法和 `Object.getOwnPropertyDescriptor()`\
  \ 方法的调用。`defineProperty` 拦截器接收以下参数：\n- `trapTarget`: 应该定义属性的对象（代理的目标）\n- `key`:\
  \ 属性的字符串或符号\n- `descriptor`: 属性的描述符对象\n\n`defineProperty` 拦截器要求在操作成功时返回 `true`，失败时返回\
  \ `false`。`getOwnPropertyDescriptor` 拦截器仅接收 `trapTarget` 和 `key`，你预期返回描述符。相应的 `Reflect.defineProperty()`\
  \ 和 `Reflect.getOwnPropertyDescriptor()` 方法接受与其代理对应的方法相同的参数。下面是一个实现每个拦截器默认行为的示例：\n\
  \n```javascript\nlet proxy = new Proxy({}, {\n\n    defineProperty(trapTarget, key,\
  \ descriptor) {\n        return Reflect.defineProperty(trapTarget, key, descriptor);\n\
  \    },\n    getOwnPropertyDescriptor(trapTarget, key) {\n        return Reflect.getOwnPropertyDescriptor(trapTarget,\
  \ key);\n    }\n});\n\nObject.defineProperty(proxy, \"name\", {\n    value: \"proxy\"\
  \n});\n\nconsole.log(proxy.name);              // \"proxy\"\n\nlet descriptor =\
  \ Object.getOwnPropertyDescriptor(proxy, \"name\");\nconsole.log(descriptor.value);\
  \      // \"proxy\"\n```\n\n\n\n\n这段代码使用 `Object.defineProperty()` 方法在代理上定义了一个名为\
  \ \"name\" 的属性。然后，通过 `Object.getOwnPropertyDescriptor()` 方法获取该属性的属性描述符。\n\n### 阻塞\
  \ Object.defineProperty()\n\n`defineProperty` 拦截器（trap）要求你返回一个布尔值，以指示操作是否成功。当返回\
  \ `true` 时，`Object.defineProperty()` 方法像往常一样成功；当返回 `false` 时，`Object.defineProperty()`\
  \ 方法会抛出错误。你可以利用此功能限制 `Object.defineProperty()` 方法定义的属性类型。例如，如果你想防止定义符号属性（symbol），可以检查键是否为字符串，如果不是则返回\
  \ `false`，如下所示：\n\n```javascript\nlet proxy = new Proxy({}, {\n    defineProperty(trapTarget,\
  \ key, descriptor) {\n        if (typeof key === \"symbol\") {\n            return\
  \ false;\n        }\n        return Reflect.defineProperty(trapTarget, key, descriptor);\n\
  \    }\n});\n\nObject.defineProperty(proxy, \"name\", {\n    value: \"proxy\"\n\
  });\nconsole.log(proxy.name);             // \"proxy\"\n\nlet nameSymbol = Symbol(\"\
  name\");\n// 抛出错误\nObject.defineProperty(proxy, nameSymbol, {\n    value: \"proxy\"\
  \n});\n```\n\n当 `key` 为符号时，`defineProperty` 代理拦截器返回 `false`，否则按照默认行为继续。当使用 \"name\"\
  \ 作为键调用 `Object.defineProperty()` 时，该方法成功，因为键是字符串。当使用 `nameSymbol` 渲染 `Object.defineProperty()`\
  \ 时，它会抛出错误，因为 `defineProperty` 拦截器返回了 `false`。\n\n**注意**\n\n你也可以通过返回 `true` 且不调用\
  \ `Reflect.defineProperty()` 方法让 `Object.defineProperty()` 静默失败。这将抑制错误，但实际上并没有定义该属性。\n\
  \n### 描述符对象的限制\n\n为了确保在使用 `Object.defineProperty()` 和 `Object.getOwnPropertyDescriptor()`\
  \ 方法时行为一致，传递给 `defineProperty` 拦截器的描述符对象会经过归一化处理。从 `getOwnPropertyDescriptor` 拦截器返回的对象也因为相同的原因通过了验证。\n\
  \n无论传递什么对象作为 `Object.defineProperty()` 方法的第三个参数，传递给 `defineProperty` 拦截器的描述符对象上只会包含可枚举的、可配置的、value、writable、get\
  \ 和 set 这几个属性。例如：\n\n```javascript\nlet proxy = new Proxy({}, {\n    defineProperty(trapTarget,\
  \ key, descriptor) {\n        console.log(descriptor.value);             // \"proxy\"\
  \n        console.log(descriptor.name);             // undefined\n        return\
  \ Reflect.defineProperty(trapTarget, key, descriptor);\n    }\n});\n\nObject.defineProperty(proxy,\
  \ \"name\", {\n    value: \"proxy\",\n    name: \"custom\"\n});\n```\n\n在这里，调用 `Object.defineProperty()`\
  \ 时在第三个参数中带有一个非标准的 `name` 属性。当调用 `defineProperty` 拦截器时，描述符对象没有 `name` 属性，但有一个 `value`\
  \ 属性。这是因为 `descriptor` 并不是传递给 `Object.defineProperty()` 方法的实际第三参数的引用，而是一个只包含允许属性的新对象。`Reflect.defineProperty()`\
  \ 方法也会忽略描述符上的任何非标准属性。\n\n`getOwnPropertyDescriptor` 拦截器有一个略有不同的限制，要求返回值必须是 `null`、`undefined`\
  \ 或一个对象。如果返回一个对象，则只允许可枚举的、可配置的、value、writable、get 和 set 作为该对象的属性。如果你返回了一个包含不允许的属性的对象，将抛出错误，如代码所示：\n\
  \n```javascript\nlet proxy = new Proxy({}, {\n    getOwnPropertyDescriptor(trapTarget,\
  \ key) {\n        return {\n            name: \"proxy\";\n        };\n    }\n});\n\
  // 抛出错误\nlet descriptor = Object.getOwnPropertyDescriptor(proxy, \"name\");\n```\n\
  \n属性 `name` 在属性描述符上是不允许的，因此当调用 `Object.getOwnPropertyDescriptor()` 时，`getOwnPropertyDescriptor`\
  \ 的返回值会触发错误。这一限制确保了无论在代理上如何使用该方法，`Object.getOwnPropertyDescriptor()` 返回的值始终具有可靠的结构。\n\
  \n### 重复的描述符方法\n\n再次，ECMAScript 6 有了一些相似得令人混乱的方法：`Object.defineProperty()` 和 `Object.getOwnPropertyDescriptor()`\
  \ 方法看起来分别与 `Reflect.defineProperty()` 和 `Reflect.getOwnPropertyDescriptor()` 方法的作用相同。与本章前面的其他方法对对一样，这四个方法之间存在细微但重要的区别。\n\
  \n#### defineProperty() 方法\n\n`Object.defineProperty()` 和 `Reflect.defineProperty()`\
  \ 方法相同之处仅在于它们的返回值。`Object.defineProperty()` 方法返回第一个参数，而 `Reflect.defineProperty()`\
  \ 在操作成功时返回 `true`。例如：\n\n```javascript\nlet target = {};\nlet result1 = Object.defineProperty(target,\
  \ \"name\", { value: \"target\" });\nconsole.log(target === result1);          \
  \   // false\n\nlet result2 = Reflect.defineProperty(target, \"name\", { value:\
  \ \"reflect\" });\nconsole.log(result2);                        // true\n```\n\n\
  当在 `target` 上调用 `Object.defineProperty()` 时，返回值是 `target`。当在 `target` 上调用 `Reflect.defineProperty()`\
  \ 时，返回值是 `true`，表示操作成功。由于 `defineProperty` 拦截器要求返回布尔值，因此在必要时最好使用 `Reflect.defineProperty()`\
  \ 来实现默认行为。\n\n#### getOwnPropertyDescriptor() 方法\n\n`Object.getOwnPropertyDescriptor()`\
  \ 方法在传递原始值时会将第一个参数强制转换为对象，然后继续操作。另一方面，`Reflect.getOwnPropertyDescriptor()` 方法如果第一个参数是原始值，则会抛出错误。下面是一个显示两者的示例：\n\
  \n```javascript\nlet descriptor1 = Object.getOwnPropertyDescriptor(2, \"name\");\n\
  console.log(descriptor1);                     // undefined\n\n// 抛出错误\nlet descriptor2\
  \ = Reflect.getOwnPropertyDescriptor(2, \"name\");\n```\n\n### ownKeys 拦截器\n\n`ownKeys`\
  \ 代理拦截器拦截内部方法 `[[OwnProperty]]` 并允许你通过返回一个数组来覆盖该行为。该数组被四个方法使用：`Object.keys()` 方法、`Object.getOwnPropertyNames()`\
  \ 方法、`Object.getOwnPropertySymbols()` 方法以及 `Object.assign()` 方法。（`Object.assign()`\
  \ 方法使用数组确定要复制的属性。）\n\n`ownKeys` 拦截器的默认行为由 `Reflect.ownKeys()` 方法实现，它返回所有属性键的数组，包括字符串和符号。`Object.getOwnPropertyNames()`\
  \ 方法和 `Object.keys()` 方法从数组中过滤掉符号并返回结果，而 `Object.getOwnPropertySymbols()` 则从数组中过滤掉字符串并返回结果。`Object.assign()`\
  \ 方法使用包含字符串和符号的数组。\n\n\n\n\n`ownKeys` 拦截器接收一个参数 `target`，并且必须始终返回一个数组或类数组对象；否则将抛出错误。你可以使用\
  \ `ownKeys` 拦截器来（例如）在使用 `Object.keys()` 方法、`Object.getOwnPropertyNames()` 方法、`Object.getOwnPropertySymbols()`\
  \ 方法或 `Object.assign()` 方法时，过滤掉某些你不希望使用的属性键。假设你不想包含任何以下划线字符 `_` 开头的属性名——这是 JavaScript\
  \ 中表示字段为私有的常用符号。你可以使用 `ownKeys` 拦截器如下过滤掉这些键：\n\n```javascript\nlet proxy = new Proxy({},\
  \ {\n    ownKeys(trapTarget) {\n        return Reflect.ownKeys(trapTarget).filter(key\
  \ => {\n            return typeof key !== \"string\" || key[0] !== \"_\";\n    \
  \    });\n    }\n});\n\nlet nameSymbol = Symbol(\"name\");\n\nproxy.name = \"proxy\"\
  ;\nproxy._name = \"private\";\nproxy[nameSymbol] = \"symbol\";\n\nlet names = Object.getOwnPropertyNames(proxy),\n\
  \    keys = Object.keys(proxy),\n    symbols = Object.getOwnPropertySymbols(proxy);\n\
  \nconsole.log(names.length);      // 1\nconsole.log(names[0]);          // \"proxy\"\
  \nconsole.log(keys.length);      // 1\nconsole.log(keys[0]);          // \"proxy\"\
  \nconsole.log(symbols.length);    // 1\nconsole.log(symbols[0]);        // \"Symbol(name)\"\
  \n```\n\n这个示例使用了 `ownKeys` 拦截器，它首先调用 `Reflect.ownKeys()` 获取 `target` 的默认键列表。接下来，使用\
  \ `filter()` 方法过滤掉字符串类型且以下划线开头的键。然后，向 `proxy` 对象添加了三个属性：`name`、`_name` 和 `nameSymbol`。当在\
  \ `proxy` 上调用 `Object.getOwnPropertyNames()` 和 `Object.keys()` 时，只返回 `name` 属性。同样，当在\
  \ `proxy` 上调用 `Object.getOwnPropertySymbols()` 时，只返回 `nameSymbol`。`_name` 属性在两个结果中都没有出现，因为它被过滤掉了。\n\
  \n尽管 `ownKeys` 代理拦截器允许你更改少数操作中返回的键，但它不会影响更常用的操作，例如 `for-of` 循环和 `Object.keys()`\
  \ 方法。这些操作无法通过代理进行更改。`ownKeys` 拦截器还会影响 `for-in` 循环，该循环会调用拦截器来确定循环内部使用哪些键。\n\n###\
  \ 带有 apply 和 construct 拦截器的函数代理\n\n在所有代理拦截器中，只有 `apply` 和 `construct` 要求代理目标必须是函数。回想\
  \ 第 3 章，函数有两个内部方法，分别称为 `[[Call]]` 和 `[[Construct]]`，它们分别在函数不使用 `new` 操作符和使用 `new`\
  \ 操作符调用时执行。`apply` 和 `construct` 拦截器对应于并允许你重写这些内部方法。当不使用 `new` 直接调用函数时，`apply` 拦截器接收且\
  \ `Reflect.apply()` 预期的参数如下：\n\n- `trapTarget`: 正在执行的函数（代理的目标对象）\n- `thisArg`: 调用期间函数内部\
  \ `this` 的值\n- `argumentsList`: 传递给函数的参数数组\n\n当使用 `new` 执行函数时，调用 `construct` 拦截器接收以下参数：\n\
  \n- `trapTarget`: 正在执行的函数（代理的目标对象）\n- `argumentsList`: 传递给函数的参数数组\n\n`Reflect.construct()`\
  \ 方法也接受这两个参数，并有一个可选的第三个参数 `newTarget`。当提供时，`newTarget` 参数指定函数内部 `new.target` 的值。\n\
  \n`apply` 和 `construct` 拦截器共同控制了任何代理目标函数的行为。为了模拟函数的默认行为，你可以这样做：\n\n```javascript\n\
  let target = function() { return 42 },\n    proxy = new Proxy(target, {\n      \
  \  apply: function(trapTarget, thisArg, argumentList) {\n            return Reflect.apply(trapTarget,\
  \ thisArg, argumentList);\n        },\n        construct: function(trapTarget, argumentList)\
  \ {\n            return Reflect.construct(trapTarget, argumentList);\n        }\n\
  \    });\n\n// 以函数为目标的代理看起来像一个函数\nconsole.log(typeof proxy);                   \
  \   // \"function\"\nconsole.log(proxy());                           // 42\nvar\
  \ instance = new proxy();\nconsole.log(instance instanceof proxy);      // true\n\
  console.log(instance instanceof target);      // true\n```\n\n在这里，你有一个返回数字 42 的函数。该函数的代理使用\
  \ `apply` 和 `construct` 拦截器将这些行为分别委托给 `Reflect.apply()` 和 `Reflect.construct()`\
  \ 方法。最终结果是代理函数的工作与目标函数完全相同，包括在使用 `typeof` 时识别自己为函数。代理在不带 `new` 时被调用以返回 42，然后带 `new`\
  \ 调用以创建一个名为 `instance` 的对象。`instance` 对象被视为 `proxy` 和 `target` 的实例，因为 `instanceof`\
  \ 使用原型链来确定这一信息。原型链的查找不受此代理的影响，这就是为什么 `proxy` 保持不变的原因。\n\n#### 验证参数\n\n`apply` 和\
  \ `construct` 拦截器为更改函数的执行方式提供了多种可能性。例如，你想验证所有参数是否都是特定类型。你可以在可以在 `apply` 拦截器中检查参数：\n\
  \n```javascript\n// 将参数相加\nfunction sum(...values) {\n    return values.reduce((previous,\
  \ current) => previous + current, 0);\n}\nlet sumProxy = new Proxy(sum, {\n    apply:\
  \ function(trapTarget, thisArg, argumentList) {\n        argumentList.forEach((arg)\
  \ => {\n            if (typeof arg !== \"number\") {\n                throw new\
  \ TypeError(\"All arguments must be numbers.\");\n            }\n        });\n \
  \       return Reflect.apply(trapTarget, thisArg, argumentList);\n    },\n    construct:\
  \ function(trapTarget, argumentList) {\n        throw new TypeError(\"This function\
  \ can't be called with new.\");\n    }\n});\n\nconsole.log(sumProxy(1, 2, 3, 4));\
  \ // 10\n// 如果传递非数字值，函数仍会尝试操作\n// sumProxy(1, \"2\", 3, 4)); // 抛出错误\n```\n\n通过在\
  \ `sumProxy` 中包装 `sum()`，这段代码拦截了函数调用并确保每个参数都是数字。为了安全，代码还使用了 `construct` 拦截器来确保函数不能通过\
  \ `new` 调用。\n\n你也可以采取相反的操作，确保函数必须通过 `new` 调用并验证其参数为数字：\n\n```javascript\nfunction\
  \ Numbers(...values) {\n    this.values = values;\n}\nlet NumbersProxy = new Proxy(Numbers,\
  \ {\n    apply: function(trapTarget, thisArg, argumentList) {\n        throw new\
  \ TypeError(\"This function must be called with new.\");\n    },\n    construct:\
  \ function(trapTarget, argumentList) {\n        argumentList.forEach((arg) => {\n\
  \            if (typeof arg !== \"number\") {\n                throw new TypeError(\"\
  All arguments must be numbers.\");\n            }\n        });\n        return Reflect.construct(trapTarget,\
  \ argumentList);\n    }\n});\n\nlet instance = new NumbersProxy(1, 2, 3, 4);\nconsole.log(instance.values);\
  \ // [1,2,3,4]\n// 抛出错误\nNumbersProxy(1, 2, 3, 4);\n```\n\n在这里，`apply` 拦截器抛出错误，而\
  \ `construct` 拦截器使用 `Reflect.construct()` 方法验证输入并返回新实例。当然，你可以在不使用代理的情况下通过 `new.target`\
  \ 来实现同样的功能。\n\n#### ***不使用 new 调用构造函数***\n\n\n\n\n\n第 3 章 引入了新的 `new.target` 元属性。回顾一下，`new.target`\
  \ 是对调用 `new` 目标函数的引用，这意味着你可以通过检查 `new.target` 的值来判断函数是否是使用 `new` 用的，如下：\n\n```javascript\n\
  function Numbers(...values) {\n    if (typeof new.target === \"undefined\") {\n\
  \        throw new TypeError(\"This function must be called with new.\");\n    }\n\
  \    this.values = values;\n}\n\nlet instance = new Numbers(1, 2, 3, 4);\nconsole.log(instance.values);\
  \               // [1,2,3,4]\n\n// 抛出错误\nNumbers(1, 2, 3, 4);\n```\n\n当在未使用 `new`\
  \ 的情况下调用 `Numbers()` 时，这段代码会抛出错误。这与 第 264 页 上“验证函数参数”中的第二个示例类似，但它没有使用代理。编写这样的代码比使用代理要简单得多，如果你的目标只是防止在不使用\
  \ `new` 的情况下调用函数，这种方法更优。但有时你无法控制需要修改行为的函数。在这种情况下，使用代理就有意义了。\n\n假设 `Numbers()` 函数定义在你无法修改的代码中。你知道该代码依赖\
  \ `new.target`，并且你想在调用函数的同时跳过该检查。由于使用 `new` 时的行为已经设定，你可以直接使用 `apply` 陷阱：\n\n```javascript\n\
  function Numbers(...values) {\n    if (typeof new.target === \"undefined\") {\n\
  \        throw new TypeError(\"This function must be called with new.\");\n    }\n\
  \    this.values = values;\n}\n\nlet NumbersProxy = new Proxy(Numbers, {\n    apply:\
  \ function(trapTarget, thisArg, argumentsList) {\n        return Reflect.construct(trapTarget,\
  \ argumentsList);\n    }\n});\n\nlet instance = NumbersProxy(1, 2, 3, 4);\nconsole.log(instance.values);\
  \               // [1,2,3,4]\n```\n\n`NumbersProxy()` 函数允许你在不使用 `new` 的情况下调用 `Numbers()`，并使其行为就像使用了\
  \ `new` 一样。为了实现这一点，`apply` 陷阱使用传入 `apply` 的参数调用 `Reflect.construct()`。`Numbers()`\
  \ 内部的 `new.target` 等于 `Numbers()`，因此不会抛出错误。虽然这是一个修改 `new.target` 的简单示例，你也可以更直接地这样做。\n\
  \n### 覆盖抽象基类构造函数\n\n你可以通过将 `Reflect.construct()` 的第三个参数指定为分配给 `new.target` 的特定值，来进一步修改\
  \ `new.target`。当函数在检查 `new.target` 是否等于已知值时，这种技术非常有用，例如当你正在创建一个抽象基类构造函数时（在第 9 章\
  \ 中讨论）。在抽象基类构造函数中，`new.target` 预期为类构造函数以外的值，如下例所示：\n\n```javascript\nclass AbstractNumbers\
  \ {\n    constructor(...values) {\n        if (new.target === AbstractNumbers) {\n\
  \            throw new TypeError(\"This function must be inherited from.\");\n \
  \       }\n        this.values = values;\n    }\n}\n\nclass Numbers extends AbstractNumbers\
  \ {}\n\nlet instance = new Numbers(1, 2, 3, 4);\nconsole.log(instance.values); \
  \              // [1,2,3,4]\n\n// 抛出错误\nnew AbstractNumbers(1, 2, 3, 4);\n```\n\n\
  当调用 `new AbstractNumbers()` 时，`new.target` 等于 `AbstractNumbers` 并抛出错误。调用 `new Numbers()`\
  \ 仍然有效，因为 `new.target` 等于 `Numbers`。你可以通过代理手动分配 `new.target` 来绕过构造函数的限制：\n\n```javascript\n\
  class AbstractNumbers {\n    constructor(...values) {\n        if (new.target ===\
  \ AbstractNumbers) {\n            throw new TypeError(\"This function must be inherited\
  \ from.\");\n        }\n        this.values = values;\n    }\n}\n\nlet AbstractNumbersProxy\
  \ = new Proxy(AbstractNumbers, {\n    construct: function(trapTarget, argumentList)\
  \ {\n        return Reflect.construct(trapTarget, argumentList, function() {});\n\
  \    }\n});\n\nlet instance = new AbstractNumbersProxy(1, 2, 3, 4);\nconsole.log(instance.values);\
  \               // [1,2,3,4]\n```\n\n`AbstractNumbersProxy` 使用 `construct` 陷阱来拦截对\
  \ `new AbstractNumbersProxy()` 方法的调用。然后，使用来自陷阱的参数调用 `Reflect.construct()`，并将空函数作为第三个参数。该空函数被用作构造函数内部\
  \ `new.target` 的值。由于 `new.target` 不等于 `AbstractNumbers`，因此不会抛出错误，构造函数完整执行。\n\n###\
  \ 可调用类构造函数\n\n第 9 章 解释过，类构造函数必须始终使用 `new` 调用，因为类构造函数的内部 `[[Call]]` 方法被规定为抛出错误。但代理可以拦截对\
  \ `[[Call]]` 方法的调用，这意味着你可以通过代理创建可调用的类构造函数。例如，如果你想让类构造函数在不使用 `new` 的情况下工作，可以使用 `apply`\
  \ 陷阱来创建一个新实例。这里是一些示例代码：\n\n```javascript\nclass Person {\n    constructor(name)\
  \ {\n        this.name = name;\n    }\n}\n\nlet PersonProxy = new Proxy(Person,\
  \ {\n    apply: function(trapTarget, thisArg, argumentList) {\n        return new\
  \ trapTarget(...argumentList);\n    }\n});\n\nlet me = PersonProxy(\"Nicholas\"\
  );\nconsole.log(me.name);                       // \"Nicholas\"\nconsole.log(me\
  \ instanceof Person);          // true\nconsole.log(me instanceof PersonProxy);\
  \     // true\n```\n\n`PersonProxy` 对象是 `Person` 的代理。类构造函数只是函数，所以它们在使用时表现得像函数一样。`apply`\
  \ 陷阱覆盖了默认行为，并使用扩展运算符单独传递每个参数，返回 `trapTarget` 的新实例。如果不使用 `new` 调用 `Person()`，构造函数仍然会抛出错误。创建可调用的类构造函数只有使用代理才能实现。\n\
  \n### 可撤销代理 (Revocable Proxies)\n\n通常，代理一旦创建就无法从其目标解除。到本章为止的所有示例使用的都是不可撤销代理。但在某些情况下，你可能希望撤销代理使其不再可用。当你出于安全目的通过\
  \ API 提供对象，并保留在任何时候切断访问的能力时，撤销代理非常有帮助。\n\n你可以使用 `Proxy.revocable()` 方法创建可撤销代理，该方法接收与\
  \ `Proxy` 构造函数相同的参数——目标对象和代理处理器。其返回值是一个包含以下属性的对象：\n\n`proxy`: 可撤销的代理对象\n\n`revoke`:\
  \ 用于撤销代理的函数\n\n当调用 `revoke()` 函数时，无法通过代理执行任何操作。任何尝试以触发代理陷阱的方式进行交互都会抛出错误。例如：\n\n\
  ```javascript\nlet target = {\n    name: \"target\"\n};\n\nlet { proxy, revoke }\
  \ = Proxy.revocable(target, {});\n\nconsole.log(proxy.name); // \"target\"\n\nrevoke();\n\
  \n// 抛出错误\nconsole.log(proxy.name);\n```\n\n\n\n\n在本章的开始，我解释了在 ECMAScript 6 之前，开发者无法准确地模拟数组的行为。`Proxies`\
  \ 和反射 API（reflection API）允许你创建一个在添加或删除属性时，行为与内置 `Array` 类型完全相同的对象。为了唤起你的记忆，这里有一个示例展示了代理所帮助模拟的行为：\n\
  \n```javascript\nlet colors = [\"red\", \"green\", \"blue\"];\n\nconsole.log(colors.length);\
  \           // 3\n\ncolors[3] = \"black\";\n\nconsole.log(colors.length);      \
  \     // 4\n\nconsole.log(colors[3]);              // \"black\"\n\ncolors.length\
  \ = 2;\n\nconsole.log(colors.length);           // 2\n\nconsole.log(colors[3]);\
  \              // undefined\n\nconsole.log(colors[2]);              // undefined\n\
  \nconsole.log(colors[1]);              // \"green\"\n```\n\n注意此示例中两个特别重要的行为：\n\n\
  * 当给 `colors[3]` 赋值时，`length` 属性会增加到 4。\n* 当将 `length` 属性设置为 2 时，数组中的最后两个项目会被删除。\n\
  \n这两个行为是准确重建内置数组工作方式时唯一需要模拟的行为。接下来的几个章节将描述如何创建一个正确模拟这些行为的对象。\n\n### 检测数组索引\n\n请记住，为整数属性键赋值是数组的一个特例情况，因为它们的处理方式与非整数键不同。ECMAScript\
  \ 6 规范对如何判断属性键是否为数组索引提供了以下指示：\n\n一个字符串属性名 `P` 是数组索引，当且仅当 `ToString(ToUint32(P))`\
  \ 等于 `P` 且 `ToUint32(P)` 不等于 `2³²-1`。\n\n该操作在 JavaScript 中可以这样实现：\n\n```javascript\n\
  function toUint32(value) {\n    return Math.floor(Math.abs(Number(value))) % Math.pow(2,\
  \ 32);\n}\n\nfunction isArrayIndex(key) {\n    let numericKey = toUint32(key);\n\
  \    return String(numericKey) == key && numericKey < (Math.pow(2, 32) - 1);\n}\n\
  ```\n\n`toUint32()` 函数使用规范中描述的算法将给定值转换为无符号 32 位整数。`isIndex()` 函数首先将键转换为 `uint32`，然后进行比较以确定该键是否为数组索引。有了这两个工具函数，你就可以开始实现一个模拟内置数组的对象了。\n\
  \n### 在添加新元素时增加长度\n\n注意，我之前描述的两个数组行为都依赖于属性的赋值。这意味着你只需要使用 `set` 代理拦截（trap）就能完成这两个行为。开始之前，看这个示例，它通过在使用大于\
  \ `length - 1` 的数组索引时增加 `length` 属性来实现两个行为中的第一种：\n\n```javascript\nfunction toUint32(value)\
  \ {\n    return Math.floor(Math.abs(Number(value))) % Math.pow(2, 32);\n}\n\nfunction\
  \ isArrayIndex(key) {\n    let numericKey = toUint32(key);\n    return String(numericKey)\
  \ == key && numericKey < (Math.pow(2, 32) - 1);\n}\n\nfunction createMyArray(length=0)\
  \ {\n    return new Proxy({ length }, {\n        set(trapTarget, key, value) {\n\
  \            let currentLength = Reflect.get(trapTarget, \"length\");\n        \
  \    // 特殊情况\n            if (isArrayIndex(key)) {\n                let numericKey\
  \ = Number(key);\n                if (numericKey >= currentLength) {\n         \
  \           Reflect.set(trapTarget, \"length\", numericKey + 1);\n             \
  \   }\n            }\n            // 无论键是什么始终执行操作\n            return Reflect.set(trapTarget,\
  \ key, value);\n        }\n    });\n}\nlet colors = createMyArray(3);\nconsole.log(colors.length);\
  \  // 3\ncolors[0] = \"red\";\ncolors[1] = \"green\";\ncolors[2] = \"blue\";\ncolors[3]\
  \ = \"black\";\nconsole.log(colors.length);  // 4\nconsole.log(colors[3]);     \
  \         // \"black\"\n```\n\n这段代码使用 `set` 代理拦截来拦截数组索引的设置。如果 `key` 是数组索引，它会被转换为数字。接下来，如果该数值大于或等于\
  \ `length` 属性，则 `length` 属性将更新为该数值加 1（在位置 3 设置一个项目意味着长度必须为 4）。然后，通过 `Reflect.set()`\
  \ 使用设置属性的默认行为，因为你希望属性按照指定接收该值。初始数组是通过调用 `length` 为 3 的 `createMyArray()` 创建的，随后添加了这些项目的值。`length`\
  \ 属性正确地保持为 3，直到将值 \"black\" 赋值给位置 3。此时，长度被设置为 4。在第一个数组行为正常后，是时候处理第二种了。\n\n### 在缩短长度时删除元素\n\
  \n要模拟的第一个数组行为仅在数组索引大于或等于 `length` 属性时使用。第二种行为相反，当 `length` 属性被设置为比之前更小的值时，会移除数组项目。这不仅涉及更改\
  \ `length` 属性，还需要删除可能存在的项目。例如，如果一个长度为 4 的数组 `length` 被设置为 2，则位置 2 和 3 的项目将被删除。你可以在\
  \ `set` 代理拦截中与第一个行为一起完成这一点。这里是之前的示例，使用了更新后的 `createMyArray` 方法：\n\n```javascript\n\
  function toUint32(value) {\n    return Math.floor(Math.abs(Number(value))) % Math.pow(2,\
  \ 32);\n}\n\nfunction isArrayIndex(key) {\n    let numericKey = toUint32(key);\n\
  \    return String(numericKey) == key && numericKey < (Math.pow(2, 32) - 1);\n}\n\
  \nfunction createMyArray(length=0) {\n    return new Proxy({ length }, {\n     \
  \   set(trapTarget, key, value) {\n            let currentLength = Reflect.get(trapTarget,\
  \ \"length\");\n            // 特殊情况\n            if (isArrayIndex(key)) {\n    \
  \            let numericKey = Number(key);\n                if (numericKey >= currentLength)\
  \ {\n                    Reflect.set(trapTarget, \"length\", numericKey + 1);\n\
  \                }\n            } else if (key === \"length\") {\n             \
  \   if (value < currentLength) {\n                    for (let index = currentLength\
  \ - 1; index >= value; index--) {\n                        Reflect.deleteProperty(trapTarget,\
  \ index);\n                    }\n                }\n            }\n           \
  \ // 无论键是什么始终执行操作\n            return Reflect.set(trapTarget, key, value);\n   \
  \     }\n    });\n}\n```\n\n这段代码中的 `set` 代理拦截检查 `key` 是否为 `\"length\"`，以便正确调整对象的其他部分。当该检查发生时，首先使用\
  \ `Reflect.get()` 获取当前长度并与新值进行比较。如果新值小于当前长度，则 `for` 循环将删除目标上所有不再可用的属性。`for` 循环从当前数组长度（`currentLength`）向后删除属性，直到达到新的数组长度（`value`）。\n\
  \n这个示例向 `colors` 添加了四种颜色，然后将 `length` 属性设置为 2。这有效地移除了位置 2 和 3 的项目，因此当你尝试访问它们时，现在会返回\
  \ `undefined`。`length` 属性被正确设置为 2，且位置 0 和 1 的项目仍然可以访问。\n\n\n\n\n在实现了这两种行为后，你可以轻松创建一个模拟内置数组行为的对象。但使用函数来这样做并不如创建一个类来封装这种行为那样理想，因此，下一步是将此功能实现为一个类。\n\
  \n## 实现 MyArray 类\n\n创建一个使用代理（proxy）的类的最简单方法是像往常一样定义该类，然后从构造函数中返回一个代理。这样，当实例化类时，返回的对象将是代理而不是实例（实例是构造函数内部\
  \ `this` 的值）。实例成为代理的目标对象（target），而代理则像实例一样被返回。实例将变成完全私有的，你将无法直接访问它，尽管你可以通过代理间接地访问它。\n\
  \n这里有一个从类构造函数返回代理的简单示例：\n\n```javascript\nclass Thing {\n    constructor() {\n \
  \       return new Proxy(this, {});\n    }\n}\n\nlet myThing = new Thing();\nconsole.log(myThing\
  \ instanceof Thing);    // true\n```\n\n在这个示例中，`Thing` 类从它的构造函数中返回了一个代理。代理的目标是 `this`，并且代理从构造函数返回。这意味着\
  \ `myThing` 实际上是一个代理，尽管它是通过调用 `Thing` 构造函数创建的。因为代理会将行为传递给其目标对象，`myThing` 仍然被视为 `Thing`\
  \ 的实例，使得代理对于任何使用 `Thing` 类的人来说都是完全透明的。\n\n在理解了可以从构造函数返回代理的前提下，使用代理创建自定义数组类是非常直接的。代码大部分与[第\
  \ 272 页]的“在缩减长度时删除元素”中的代码相同。你可以使用相同的代理代码，但这次你需要将其放置在类构造函数内部。以下是完整示例：\n\n```javascript\n\
  function toUint32(value) {\n    return Math.floor(Math.abs(Number(value))) % Math.pow(2,\
  \ 32);\n}\n\nfunction isArrayIndex(key) {\n    let numericKey = toUint32(key);\n\
  \    return String(numericKey) == key && numericKey < (Math.pow(2, 32) - 1);\n}\n\
  \nclass MyArray {\n    constructor(length=0) {\n        this.length = length;\n\
  \        return new Proxy(this, {\n            set(trapTarget, key, value) {\n \
  \               let currentLength = Reflect.get(trapTarget, \"length\");\n     \
  \           // 特殊情况\n                if (isArrayIndex(key)) {\n                \
  \    let numericKey = Number(key);\n                    if (numericKey >= currentLength)\
  \ {\n                        Reflect.set(trapTarget, \"length\", numericKey + 1);\n\
  \                    }\n                } else if (key === \"length\") {\n     \
  \               if (value < currentLength) {\n                        for (let index\
  \ = currentLength - 1; index >= value; index--) {\n                            Reflect.deleteProperty(trapTarget,\
  \ index);\n                        }\n                    }\n                }\n\
  \                // 无论 key 是什么始终执行此操作\n                return Reflect.set(trapTarget,\
  \ key, value);\n            }\n        });\n    }\n}\n\nlet colors = new MyArray(3);\n\
  console.log(colors instanceof MyArray);  // true\nconsole.log(colors.length);  \
  \             // 3\ncolors[0] = \"red\";\ncolors[1] = \"green\";\ncolors[2] = \"\
  blue\";\ncolors[3] = \"black\";\nconsole.log(colors.length);               // 4\n\
  colors.length = 2;\nconsole.log(colors.length);               // 2\nconsole.log(colors[3]);\
  \                   // undefined\nconsole.log(colors[2]);                   // undefined\n\
  console.log(colors[1]);                   // \"green\"\nconsole.log(colors[0]);\
  \                   // \"red\"\n```\n\n这段代码创建了一个 `MyArray` 类，它从构造函数中返回一个代理。`length`\
  \ 属性在构造函数被添加（初始化为传入的值或默认值 0），然后创建并返回代理。这使得 `colors` 变量看起来就像是 `MyArray` 的一个实例，并实现了两种键行为。\n\
  \n虽然从类构造函数返回代理是很容易的，但也意味着每个实例都会创建一个新的代理。然而，有一种方法可以让所有实例共享一个代理：你可以将代理用原型（prototype）。\n\
  \n## 将代理作为原型\n\n虽然你可以将代理用原型，但这样做比本章之前的示例要稍微复杂一些。当代理作为原型时，只有当默认操作通常会在原型上继续执行时，代理的拦截器（traps）才会被调用，这限制了代理作为原型的能力。考虑以下示例。\n\
  \n```javascript\nlet target = {};\nlet newTarget = Object.create(new Proxy(target,\
  \ {\n    // 永远不会调用\n    defineProperty(trapTarget, name, descriptor) {\n       \
  \ // 如果调用会导致错误\n        return false;\n    }\n}));\n\nObject.defineProperty(newTarget,\
  \ \"name\", {\n    value: \"newTarget\"\n});\n\nconsole.log(newTarget.name);   \
  \          // \"newTarget\"\nconsole.log(newTarget.hasOwnProperty(\"name\")); //\
  \ true\n```\n\n`newTarget` 对象是用代理作为原型创建的。将 `target` 设置为代理的目标，实际上使得 `target` 成为 `newTarget`\
  \ 的原型，因为代理是透明的。只有当 `newTarget` 上的操作传递到 `target` 时，代理拦截器才会被调用。`Object.defineProperty()`\
  \ 方法在 `newTarget` 上调用以创建一个名为 `name` 的属性。在对象上定义属性并不是通常会继续到原型的操作，因此代理的 `defineProperty`\
  \ 拦截器不会被调用，`name` 属性作为自有属性被添加到了 `newTarget`。\n\n尽管代理作为原型时受到严重限制，但仍有一些拦截器是有用的。我将在接下来的章节中介绍它们。\n\
  \n## 在原型上使用 get 拦截器\n\n当调用内部 `[[Get]]` 方法读取属性时，操作会首先查找属性。如果没有找到具有指定名称的自有属性，操作将继续到原型并在那里查找。该过程会一直持续直到没有更多的原型可以检查。\n\
  \n由于这个过程，如果你设置了 `get` 代理拦截器，每当不存在指定的名称属性时，拦截器将在原型上调用。你可以使用 `get` 拦截器来防止访问无法确定存在的属性时出现意外行为。只需创建一个在尝试访问不存在属性时抛出错误的对象即可：\n\
  \n```javascript\nlet target = {};\nlet thing = Object.create(new Proxy(target, {\n\
  \    get(trapTarget, key, receiver) {\n        throw new ReferenceError(`${key}\
  \ doesn't exist`);\n    }\n}));\n\nthing.name = \"thing\";\nconsole.log(thing.name);\
  \ // \"thing\"\n\n// 抛出错误\nlet unknown = thing.unknown;\n```\n\n这段代码中，`thing` 对象是用代理作为其原型创建的。`get`\
  \ 拦截器在调用时抛出错误，以指示指定的键在 `thing` 对象上不存在。当读取 `thing.name` 时，操作从未调用原型上的 `get` 拦截器，因为该属性存在于\
  \ `thing`。只有当访问不存在的 `thing.unknown` 属性时，`get` 拦截器才会调用。这种行为在 JavaScript 中非常有用，因为在\
  \ JavaScript 中未知属性会返回 `undefined` 而不是抛出错误（这在其他语言中会发生）。\n\n\n\n\n\n重要的是理解，在这个例子中，`trapTarget`\
  \ 和 `receiver` 是不同的对象。当代理被用作原型时，`trapTarget` 是原型对象，而 `receiver` 是实例对象。在这种情况下，这意味着\
  \ `trapTarget` 等于 `target`，而 `receiver` 等于 `thing`。这允许你访问代理的原始 `target` 以及旨在执行操作的对象。\n\
  \n### 在原型上使用 set 陷阱\n\n内部的 `Set]]` 方法也会检查自有属性（own properties），并在需要时继续查找原型。当你给对象的属性赋值时，如果存在一个同名的自有属性，则该值将赋值给该自有属性。如果不存在给定命名的自有属性，操作将继续在原型上。棘之处在于，尽管赋值操作继续在原型上，但默认情况下，给该属性赋值会在实例上（而不是原型上）创建一个属性，无论原型上是否存在该命名的属性。\n\
  \n为了更清楚地了解 `set` 陷器陷阱何时会在原型上被调用，以及何时不会被调用，请考虑以下示例，它展示了默认行为：\n\n```javascript\nlet\
  \ target = {};\n\nlet thing = Object.create(new Proxy(target, {\n    set(trapTarget,\
  \ key, value, receiver) {\n        return Reflect.set(trapTarget, key, value, receiver);\n\
  \    }\n}));\n\nconsole.log(thing.hasOwnProperty(\"name\"));      // false\n\n//\
  \ 触发 `set` 代理陷阱\nthing.name = \"thing\";\nconsole.log(thing.name);             \
  \         // \"thing\"\nconsole.log(thing.hasOwnProperty(\"name\"));      // true\n\
  \n// 不触发 `set` 代理陷阱\nthing.name = \"boo\";\nconsole.log(thing.name);           \
  \           // \"boo\"\n```\n\n在这个例子中，`target` 初始没有自有属性。`thing` 对象有一个代理作为其原型，该原型定义了一个\
  \ `set` 陷阱来捕获任何新属性的创建。当给 `thing.name` 赋值为 \"thing\" 时，set 代理陷阱被调用，因为 `thing` 没有名为\
  \ `name` 的自有属性。在 `set` 陷阱内部，`trapTarget` 等于 `target`，而 `receiver` 等于 `thing`。操作最终应该会在\
  \ `thing` 上创建一个新属性，幸运的是，如果你传递 `receiver` 作为第四个参数，`Reflect.set()` 会为你实现这种默认行为。\n\n\
  一旦在 `thing` 上创建了 `name` 属性，将 `thing.name` 设置为不同的值将不再调用 set 代理陷阱。此时，`name` 是一个自有属性，因此\
  \ `Set` 操作永远不会继续到原型上。\n\n### 在原型上使用 has 陷阱\n\n回想 `has` 陷阱拦截了对象上 `in` 运算符的使用。`in`\
  \ 运算符首先搜索对象上具有给定命名的自有属性。如果不存在该命名的自有属性，操作将继续在原型上进行。如果原型上没有自有属性，搜索将通过原型链继续进行，直到找到自有属性或没有更多原型可以搜索为止。\n\
  \n因此，`has` 陷阱仅在搜索到达原型链中的代理对象时才被调用。当你将代理用作原型时，只有在没有给定命名的自有属性时，`has` 陷阱才被调用。例如：\n\n\
  ```javascript\nlet target = {};\n\nlet thing = Object.create(new Proxy(target, {\n\
  \    has(trapTarget, key) {\n        return Reflect.has(trapTarget, key);\n    }\n\
  }));\n\n// 触发 `has` 代理陷阱\nconsole.log(\"name\" in thing);                  // false\n\
  thing.name = \"thing\";\n// 不触发 `has` 代理陷阱\nconsole.log(\"name\" in thing);    \
  \              // true\n```\n\n这段代码在 `thing` 的原型上创建了一个 `has` 代理陷阱。`has` 陷阱不像 `get`\
  \ 和 `set` 陷阱那样传递一个 `receiver` 对象，因为在使用 `in` 运算符时，搜索原型是自动进行的。相反，`has` 陷阱必须仅对 `trapTarget`\
  \ 进行操作，它等于 `target`。在这个例子中，第一次使用 `in` 运算符时，调用了 `has` 陷阱，因为该属性名没有作为 `thing` 的自有属性存在。当给\
  \ `thing.name` 赋值并再次使用 `in` 运算符时，`has` 陷阱不会被调用，因为操作在在 `thing` 上找到自有属性后就停止了。\n\n\
  ### 作为类原型的代理\n\n到目前为止的原型示例都集中在使用 `Object.create()` 方法创建的对象上。但如果你想创建一个带有代理作为原型的类，这个过程会复杂一些。类不能被直接修改以使用代理作为原型，因为它们的\
  \ `prototype` 属性是不可写的。然而，你可以通过继承使用一点“障眼法”，创建一个带有代理作为其原型的类。首先，你需要使用构造器函数创建一个 ECMAScript\
  \ 5 类型的类型定义。然后你可以覆盖原型以使其成为代理。这里有一个示例：\n\n```javascript\nfunction NoSuchProperty()\
  \ {\n    // 空\n}\nNoSuchProperty.prototype = new Proxy({}, {\n    get(trapTarget,\
  \ key, receiver) {\n        throw new ReferenceError(`${key} doesn't exist`);\n\
  \    }\n});\n\nlet thing = new NoSuchProperty();\n// 由于 `get` 代理陷阱抛出错误\nlet result\
  \ = thing.name;\n```\n\n`NoSuchProperty` 函数代表了类将继承的基。由于函数的 `prototype` 属性没有限制，所以你可以用代理覆盖它。`get`\
  \ 陷阱在访问不存在的属性时抛出错误。`thing` 对象被创建为 `NoSuchProperty` 的实例。\n\n下一步是创建一个继承自 `NoSuchProperty`\
  \ 的类。你可以简单地通过 `extends` 语法将代理引入类的原型，如下：\n\n```javascript\nfunction NoSuchProperty()\
  \ {\n    // 空\n}\nNoSuchProperty.prototype = new Proxy({}, {\n    get(trapTarget,\
  \ key, receiver) {\n        throw new ReferenceError(`${key} doesn't exist`);\n\
  \    }\n});\n\nclass Square extends NoSuchProperty {\n    constructor(length, width)\
  \ {\n        super();\n        this.length = length;\n        this.width = width;\n\
  \    }\n}\n\nlet shape = new Square(2, 6);\nlet area1 = shape.length * shape.width;\n\
  console.log(area1); // 12\n// 因为 \"wdth\" 不存在而抛出错误\nlet area2 = shape.length * shape.wdth;\n\
  ```\n\n`Square` 类继承自 `NoSuchProperty`，因此代理位于 `Square` 类原型中。随后创建的 `shape` 对象拥有自有属性\
  \ `length` 和 `width`。读取这些属性的值是成功的，因为 `get` 陷阱从未被调用。只有当访问 `shape` 上不存在的属性时（`shape.wdth`，一个明显的拼写错误），`get`\
  \ 陷阱才会触发并抛出错误，证明了代理在 `shape` 的原型链中。但可能并不明显代理不是 `shape` 的直接原型。事实上，代理在 `shape` 的原型链上向上了几层。通过稍微修改前面的示例可以更清楚地看到这一点：\n\
  \n```javascript\nfunction NoSuchProperty() {\n    // 空\n}\n// 存储将原型的代理引用\nlet proxy\
  \ = new Proxy({}, {\n    get(trapTarget, key, receiver) {\n        throw new ReferenceError(`${key}\
  \ doesn't exist`);\n    }\n});\nNoSuchProperty.prototype = proxy;\n\nclass Square\
  \ extends NoSuchProperty {\n    constructor(length, width) {\n        super();\n\
  \        this.length = length;\n        this.width = width;\n    }\n}\n\nlet shape\
  \ = new Square(2, 6);\nlet shapeProto = Object.getPrototypeOf(shape);\nconsole.log(shapeProto\
  \ === proxy); // false\n\nlet secondLevelProto = Object.getPrototypeOf(shapeProto);\n\
  console.log(secondLevelProto === proxy); // true\n```\n\n\n\n\n此版本的代码将代理存储在名为 `proxy`\
  \ 的变量中，便于后续识别。`shape` 的原型是 `Shape.prototype`，它不是一个代理。但 `Shape.prototype` 的原型是从 `NoSuchProperty`\
  \ 继承来的代理。\n\n继承在原型链中又增加了一个步骤，这很重要，因为任何可能导致对 `proxy` 调用 `get` 陷阱的操作，在执行之前都需要额外多经过一步。如果\
  \ `Shape.prototype` 上有某个属性，它将阻止 `get` 代理陷阱的调用，如例所示：\n\n```javascript\nfunction NoSuchProperty()\
  \ {\n    // empty\n}\n\nNoSuchProperty.prototype = new Proxy({}, {\n    get(trapTarget,\
  \ key, receiver) {\n        throw new ReferenceError(`${key} doesn't exist`);\n\
  \    }\n});\n\nclass Square extends NoSuchProperty {\n    constructor(length, width)\
  \ {\n        super();\n        this.length = length;\n        this.width = width;\n\
  \    }\n    getArea() {\n        return this.length * this.width;\n    }\n}\n\n\
  let shape = new Square(2, 6);\nlet area1 = shape.length * shape.width;\nconsole.log(area1);\
  \                 // 12\n\nlet area2 = shape.getArea();\nconsole.log(area2);   \
  \              // 12\n\n// throws an error because \"wdth\" doesn't exist\nlet area3\
  \ = shape.length * shape.wdth;\n```\n\n在这里，`Square` 类拥有一个 `getArea()` 方法。`getArea()`\
  \ 方法会被自动添加到 `Square.prototype` 中，因此当调用 `shape.getArea()` 时，对方法 `getArea()` 的搜索从\
  \ `shape` 实例开始，然后进行到原型。由于在原型上找到了 `getArea()`，搜索就会停止，代理永远不会被调用。这实际上是你在这种情况下所想要的行为，因为你不希望在调用\
  \ `getArea()` 时错误地抛出异常。\n\n尽管创建一个在原型链中带有代理的类需要一些额外的代码，但如果你需要这种功能，那么这种努力是值得的。\n\n\
  ## 总结\n\n在 ECMAScript 6 之前，某些对象（如数组）表现出开发者无法的非标准行为。代理（Proxies）改变了这一点。它们允许你为几种低级\
  \ JavaScript 操作定义自己的非标准行为，因此你可以通过代理陷阱（proxy traps）复制所有内置 JavaScript 对象的所有行为。当发生各种操作时（例如使用\
  \ `in` 运算符），这些陷阱会在后台被调用。\n\nECMAScript 6 还引入了反射 API（reflection API），允许开发者为每个代理陷阱实现默认行为。每个代理陷阱在\
  \ `Reflect` 对象上都有一个同名的对应方法，这是 ECMAScript 6 的另一个新增特性。通过结合代理陷阱和反射 API 方法，可以过滤某些操作，使其仅在特定条件下表现得不同，同时默认使用内置行为。\n\
  \n可撤销的代理（Revocable proxies）是特殊的代理，可以通过 `revoke()` 函数被有效禁用。`revoke()` 函数会终止代理上的所有功能，因此在调用\
  \ `revoke()` 之后，任何与代理属性的尝试都会抛出错误。对于应用安全来说，可撤销的代理是重要的，因为第三方开发者可能需要在特定时间内访问某些对象。\n\
  \n虽然直接使用代理是最强大的用用例，但你也可以将代理作为另一个对象的原型。在这种情况下，你能够有效使用的代理陷阱数量受到严格限制。当代理被作原型时，只有 `get`、`set`\
  \ 和 `has` 代理陷阱会被调用，这导致用例较少。\n\n## 13 使用模块封装代码\n\n![image](img/common-01.jpg)\n\n\
  JavaScript 加载代码的“共享一切”方法是该语言中最出错且令人困惑的之一。其他语言使用包（packages）等概念来定义代码作用域，但在 ECMAScript\
  \ 6 之前，应用程序中每个 JavaScript 文件定义的任何内容都共享一个全局作用域。随着 Web 应用变得越来越复杂并开始使用更多的 JavaScript\
  \ 代码，这种方法导致了问题，例如命名冲突和安全隐患。ECMAScript 6 的目标之一就是解决作用域问题并为 JavaScript 应用带来秩序。这就是模块（modules）登场的地方。\n\
  \n## 什么是模块？\n\n`module` 是自动在严格模式下运行的 JavaScript 代码，且没有方法退出。与“共享一切”的架构相反，在模块顶层创建的变量不会自动添加到共享的全局作用域中。变量只存在于模块的顶层作用域内，模块必须导出任何应该供模块之外代码使用的元素（例如变量或函数）。\n\
  \n### 有两个模块特性与作用域关系较小，但非常重要。第一，模块顶层 `this` 的值是 `undefined`。第二，模块不允许 HTML 风格的注释，这是\
  \ JavaScript 早期的一个遗留特性。包含任何 JavaScript 代码的脚本（Scripts）缺乏这些特性。模块与其他代码之间的差异初看起来可能微不足道，但它们代表了\
  \ JavaScript 代码加载和评估方式的重大变化，我将在文中对此进行讨论。\n\n## 基础导出\n\n你可以使用 `export` 关键字将代码部分暴露给其他模块。在最简单的情况下，你可以将\
  \ `export` 放在任何变量、函数或类之前以将其从模块导出，如下：\n\n```javascript\n// export data\nexport var\
  \ color = \"red\";\nexport let name = \"Nicholas\";\nexport const magicNumber =\
  \ 7;\n\n// export function\nexport function sum(num1, num2) {\n    return num1 +\
  \ num2;\n}\n\n// export class\nexport class Rectangle {\n    constructor(length,\
  \ width) {\n        this.length = length;\n        this.width = width;\n    }\n\
  }\n\n// this function is private to the module\nfunction subtract(num1, num2) {\n\
  \    return num1 - num2;\n}\n\n// define a function...\nfunction multiply(num1,\
  \ num2) {\n    return num1 * num2;\n}\n\n// ...and then export it\nexport multiply;\n\
  ```\n\n在这个示例中有几处细节需要注意。除了 `export` 关键字外，每个声明都与在脚本中的写法相同。每个导出的函数或类都有一个名称，因为导出的函数和类声明需要一个名称。你不能使用这种语法导出匿名函数或类，除非你使用\
  \ `default` 关键字。\n\n此外，考虑 `multiply()` 函数，它在定义时并没有被导出。这之所以能行得通，是因为你并不总是需要导出声明：你也可以导出引用。此外，注意此示例没有导出\
  \ `subtract()` 函数。该函数将无法从模块外部访问，因为任何未显式导出的变量、函数或类对于该模块来说都是私有的。\n\n## 基础导入\n\n当你拥有一个带有导出的模块时，你可以通过\
  \ `import` 关键字在另一个模块中访问这些功能。导入语句的两个部分是你正在导入的标识符以及应该从其导入这些标识符的模块。\n\n这是该语句的基本形式：\n\
  \n```javascript\nimport { identifier1, identifier2} from \"./example.js\";\n```\n\
  \n\n\n\n\n`import` 之后的大括号 `{} ` 表示从给定模块导入的绑定（bindings）。`from` 关键字表示要从哪个模块导入指定的绑定。模块由一个表示模块路径的字符串指定（称为*模块规范符*/module\
  \ specifier）。浏览器使用你可能传递给 `<script>` 元素的相同路径格式，这意味着你必须包含文件扩展名。相反，Node.js 遵循其惯例，根据文件系统前缀来区分本地文件和包。例如，`example`\
  \ 将是一个包，而 `./example.js` 将是一个本地文件。\n\n**注意**\n\n*要导入的绑定列表看起来类似于解构赋值的对象，但它并不是解构赋值。*\n\
  \n当你从模块导入一个绑定时，该绑定的行为就像是使用 `const` 定义的一样。因此，你不能定义另一个同名的变量（包括导入另一个同名的绑定），在 `import`\
  \ 语句之前使用该标识符，也无法更改绑定的值。\n\n### 导入单个绑定\n\n假设 第 284 页 上的“基础导出”中的示例位于文件名为 `example.js`\
  \ 的模块中。你可以通过多种方式导入并使用该模块中的绑定。例如，你只需要导入一个标识符：\n\n```javascript\n// 仅导入一个\n\nimport\
  \ { sum } from \"./example.js\";\n\nconsole.log(sum(1, 2));     // 3\n\nsum = 1;\
  \                   // 抛错误\n```\n\n即使 `example.js` 导出的不仅仅是这一个函数，此示例只导入了 `sum()`\
  \ 函数。如果你尝试给 `sum` 分配新值，结果将是错误，因为你不能重新赋值导入的绑定。\n\n**注意**\n\n确保在表示要导入文件的字符串开头包含 `/`、`./`\
  \ 或 `../`，以获得跨浏览器和 Node.js 的最佳兼容性。\n\n### 导入多个绑定\n\n如果你想从示例模块导入多个绑定，可以如下显式地列出它们：\n\
  \n```javascript\n// 导入多个\n\nimport { sum, multiply, magicNumber } from \"./example.js\"\
  ;\n\nconsole.log(sum(1, magicNumber));      // 8\n\nconsole.log(multiply(1, 2));\
  \           // 2\n```\n\n在这里，从示例模块导入了三个绑定：`sum`、`multiply` 和 `magicNumber`。它们的使用方式就像是在本地定义的一样。\n\
  \n### 导入整个模块\n\n特殊情况允许你将整个模块作为一个单个对象导入。所有导出内容都将作为属性在该对象上可用。例如：\n\n```javascript\n\
  // 导入所有\n\nimport * as example from \"./example.js\";\n\nconsole.log(example.sum(1,\
  \ example.magicNumber));           // 8\n\nconsole.log(example.multiply(1, 2));\
  \  // 2\n```\n\n在这段代码中，`example.js` 中所有导出的绑定都被加载到名为 `example` 的对象中。命名导出（`sum()`\
  \ 函数、`multiply()` 函数和 `magicNumber`）随后作为 `example` 的属性可以访问。这种导入格式被称为*命名空间导入*（namespace\
  \ import），因为 `example` 对象并不存在于 `example.js` 文件内部，而是被创建用来作为 `example.js` 所有导出成员的命名空间对象。\n\
  \n然而，请记住，无论你在 `import` 语句中使用模块多少次，该模块都只会执行一次。在导入模块的代码执行后，实例化的模块被保留在内存中，每当另一个 `import`\
  \ 语句引用它时就会重用。考虑以下：\n\n```javascript\nimport { sum } from \"./example.js\";\n\nimport\
  \ { multiply } from \"./example.js\";\n\nimport { magicNumber } from \"./example.js\"\
  ;\n```\n\n尽管此模块中有三个 `import` 语句，`example.js` 也只会执行一次。如果同一应用程序中的其他模块导入了 `example.js`\
  \ 的绑定，这些模块将使用此代码所使用的模块实例。\n\n#### 语法限制\n\n导出和导入的一个重要限制是它们必须在其他语句和函数之外使用。例如，这段代码将产生语法错误：\n\
  \n```javascript\nif (flag) {\n    export flag;     // 语法错误\n}\n```\n\n`export` 语句位于\
  \ `if` 语句内部，这是不允许的。导出不能以任何方式条件化或动态进行。模块语法存在的原因之一是让 JavaScript 引擎静态地确定什么将被导出。因此，你只能在模块的顶层使用\
  \ `export`。\n\n同样，你不能在语句内部使用 `import`；你只能在顶层使用它。这意味着这段代码也会产生语法错误：\n\n```javascript\n\
  function tryImport() {\n    import flag from \"./example.js\";  // 语法错误\n}\n```\n\
  \n你不能动态导入绑定，原因与你不能动态导出绑定相同。`export` 和 `import` 关键字被设计为静态的，以便文本编辑器等工具可以轻松识别从模块中提供的可用信息。\n\
  \n#### 导入绑定的微妙特性\n\nECMAScript 6 的 `import` 语句创建的是对变量、函数和类的只读绑定，而不是简单地引用它们。即使导出它的模块可以更改该值。例如，假设你想使用以下代码：\n\
  \n```javascript\nexport var name = \"Nicholas\";\n\nexport function setName(newName)\
  \ {\n    name = newName;\n}\n```\n\n当你导入这些绑定时，模块无法更改该值：\n\n```javascript\nimport\
  \ { name, setName } from \"./example.js\";\n\nconsole.log(typeof name); // \"undefined\"\
  \n\nsetName(\"Greg\");\n\nconsole.log(name); // \"Nicholas\"\n```\n（注：此处原文逻辑略有混乱，但根据指令保留核心内容：ECMAScript\
  \ 6 的 `import` 语句创建的是只读绑定。）\n\n### 重命名导出和导入\n\n有时，你可能不想使用从模块导入的变量、函数或类的原始名称。幸运的是，你可以在导出和导入时更改它们的名称。\n\
  \n在第一种情况下，假设你有一个想要以不同名称导出的函数。你可以使用 `as` 关键字指定该函数在模块外部的名称：\n\n```javascript\nfunction\
  \ sum(num1, num2) {\n    return num1 + num2;\n}\n\nexport { sum as add };\n```\n\
  \n在这里，本地名称为 `sum()` 的函数以 `add` 作为其导出名称导出这意味着当另一个模块想要导入此函数时，它必须使用名称 `add`：\n\n```javascript\n\
  import { add } from \"./example.js\";\n```\n\n如果导入函数的模块想要使用不同的名称，它也可以使用 `as`：\n\n\
  ```javascript\nimport { add as sum } from \"./example.js\";\n\nconsole.log(typeof\
  \ add); // \"undefined\"\n\nconsole.log(sum(1, 2)); // 3\n```\n\n这段代码使用*导入名称*（import\
  \ name）导入了 `add()` 函数（在此语境下的本地名称为 `sum`）。\n\n### 模块中的默认值\n\n模块语法针对导出和导入模块中的默认值进行了优化，因为这种模式在其他模块系统（如\
  \ CommonJS）中非常常见。模块的*默认值*是由 `default` 关键字指定的单个变量、函数或类，且每个模块只能设置一个默认导出。在多个导出语句中使用\
  \ `default` 关键字将产生语法错误。\n\n### 导出默认值\n\n这是一个使用 `default` 关键字的简单示例：\n\n```javascript\n\
  export default function(num1, num2) {\n    return num1 + num2;\n}\n```\n\n\n\n\n\
  此模块导出一个函数作为其默认值。`default` 关键字表示这是一个默认导出。函数不需要名称，因为该模块代表了该函数。\n\n你也可以通过在 `export\
  \ default` 之后指定一个标识符作为默认导出，如下：\n\n```javascript\nfunction sum(num1, num2) {\n  \
  \  return num1 + num2;\n}\n\nexport default sum;\n```\n\n`sum()` 函数首先被定义，随后作为模块的默认值导出。如果默认值需要经过计算，你可能希望使用这种方法。\n\
  \n指定标识符作为默认导出的第三种方法是使用如下重命名语法：\n\n```javascript\nfunction sum(num1, num2) {\n  \
  \  return num1 + num2;\n}\n\nexport { sum as default };\n```\n\n标识符 `default` 在重命名导出中具有特殊含义，表示某个值应作为模块的默认值。由于\
  \ `default` 是 JavaScript 中的一个关键字，你不能将它用作变量、函数或类名；但你可以将其用作属性名。因此，使用 `default` 重命名导出是一个特殊情况，用于保持与非默认导出定义方式的一致性。如果你想使用单个导出语句同时指定多个导出（包括默认导出），这种语法就会非常有用。\n\
  \n## 导入默认值\n\n你可以使用以下语法从模块导入默认值：\n\n```javascript\n// 导入默认值\nimport sum from \"\
  ./example.js\";\n\nconsole.log(sum(1, 2));     // 3\n```\n\n此导入语句从 `example.js`\
  \ 模块导入了默认值。注意，这里没有使用大括号，这与你在非默认导入中看到的情况不同。本地名称 `sum` 用于表示模块导出的任何默认函数。这种语法是最简洁的，ECMAScript\
  \ 6 的创建者期望它成为 Web 上最主要的导入形式，允许你使用已经存在的对象。\n\n对于导出了默认值和一个或多个非默认绑定的模块，你可以使用一条语句导入所有导出的绑定。例如，假设你有这样一个模块：\n\
  \n```javascript\nexport let color = \"red\";\n\nexport default function(num1, num2)\
  \ {\n    return num1 + num2;\n}\n```\n\n你可以使用以下导入语句导入 `color` 和默认函数：\n\n```javascript\n\
  import sum, { color } from \"./example.js\";\n\nconsole.log(sum(1, 2));     // 3\n\
  console.log(color);         // \"red\"\n```\n\n逗号将默认本地名称与非默认隔离开，后者也包裹在大括号中。请记住，在导入语句中，默认值必须位于非值之前。\n\
  \n与导出默认值一样，你也可以使用重命名语法导入默认值：\n\n```javascript\nimport { default as sum, color }\
  \ from \"./example.js\";\n\nconsole.log(sum(1, 2));     // 3\nconsole.log(color);\
  \         // \"red\"\n```\n\n在此代码中，默认导出（`default`）被重命名为 `sum`，并且导入了额外的 `color`。此示例与之前的示例相同。\n\
  \n## 重新导出绑定\n\n最终，你可能想要重新导出你的模块已经导入的内容。例如，你可能正在从几个小模块创建一个库。你可以使用本章讨论过的模式重新导出导入的值，如下：\n\
  \n```javascript\nimport { sum } from \"./example.js\";\n\nexport { sum }\n```\n\n\
  虽然这种方法可行，但一条语句也可以完成同样的任务：\n\n```javascript\nexport { sum } from \"./example.js\"\
  ;\n```\n\n这种导出形式会从指定的模块中查找 `sum` 的声明并将其导出。当然，你也可以为同一个值导出一个不同的名称：\n\n```javascript\n\
  export { sum as add } from \"./example.js\";\n```\n\n在这里，`sum` 从 `example.js` 导入，然后导出为\
  \ `add`。\n\n如果你想从另一个模块导出所有内容，可以使用 `*` 模式：\n\n```javascript\nexport * from \"./example.js\"\
  ;\n```\n\n通过导出所有内容，你包含了默认导出以及任何命名导出，这可能会影响你从自己的模块中导出的内容。例如，如果 `example.js` 有默认导出，当你使用这种语法时将无法定义新的默认导出。\n\
  \n## 无绑导入\n\n某些模块可能不导出任何内容；它们可能只修改全局作用域中的对象。尽管模块内部的变量、函数和类不会自动进入全局作用域，但这并不意味着模块无法访问全局作用域。内置对象（如\
  \ `Array` 和 `Object`）的共享定义可以在模块内部访问，对这些对象的更改将反映在其他模块中。\n\n例如，如果你想为所有数组添加一个 `pushAll()`\
  \ 方法，你可以定义这样一个模块：\n\n```javascript\n// 没有导出或导入的模块代码\nArray.prototype.pushAll = function(items)\
  \ {\n    // items 必须是一个数组\n    if (!Array.isArray(items)) {\n        throw new TypeError(\"\
  Argument must be an array.\");\n    }\n    // 使用内置的 push() 和展开运算符\n    return this.push(...items);\n\
  };\n```\n\n这是一个有效的模块，尽管没有导出或导入。这段代码可以作为模块使用，因此 `pushAll()` 现在可以在数组上使用了。\n\n**注意**\n\
  *无绑定导入最可能用于创建填充程序（polyfills）和垫片（shims）。*\n\n## 加载模块\n\n尽管 ECMAScript 6 定义了模块的语法，但它并没有定义如何加载它们。这是一个旨在与实现环境无关的规范复杂度。与其试图创建一个适用于所有\
  \ JavaScript 环境的单一规范，ECMAScript 6 仅指定了语法，并将加载机制抽象为未定义的内部操作 `HostImportedModule`。浏览器和\
  \ Node.js 开发者被留以以适合各自环境的方式来实现 `HostImportedModule`。\n\n### 在 浏览器中使用模块\n\n在 ECMAScript\
  \ 6 之前，Web 浏览器已经有多种方式在 Web 应用中包含 JavaScript。那些脚本加载选项有：\n\n- 使用带有 `src` 属性的 `<script>`\
  \ 元素从指定位置加载 JavaScript 文件\n- 使用不带 `src` 属性的 `<script>` 元素嵌入 JavaScript 代码\n- 加载\
  \ JavaScript 文件以作为 Worker（如 Web Worker 或 Service Worker）\n\n为了完全支持模块，Web 浏览器必须更新这些每一个机制。这些细节在\
  \ HTML 规范中有完整定义，我将在后续章节中进行总结。\n\n#### 使用 <script> 使用模块\n\n`<script>` 元素的默认行为是将 JavaScript\
  \ 文件加载为脚本而非模块。这发生在 `type` 属性缺失或 `type` 属性包含 JavaScript 内容类型（如 \"text/javascript\"\
  ）时。此时 `<script>` 元素可以执行内联代码或加载 `src` 指定的文件。为了支持模块，增加了 `\"module\"` 值作为一种类型选项。将 `type`\
  \ 设置为 `\"module\"` 会告诉浏览器将任何内联代码或 `src` 指定文件中的代码作为模块而非脚本。这里有一个简单的示例：\n\n```html\n\
  <!-- 加载模块 JavaScript 文件 -->\n<script type=\"module\" src=\"module.js\"></script>\n\
  \n<!-- 内联包含模块 -->\n<script type=\"module\">\n    import { sum } from \"./example.js\"\
  ;\n    let result = sum(1, 2);\n</script>\n```\n\n\n\n此示例中的第一个 `<script>` 元素使用 `src`\
  \ 属性加载外部模块文件。它与加载脚本的唯一区别在于类型（type）被设置为 \"module\"。第二个 `<script>` 元素包含一个直接嵌入在网页中的模块。变量\
  \ `result` 不会暴露在全局范围内，因为它只存在于模块内部（由 `<script>` 元素定义），因此不会作为属性添加到 `window` 中。\n\n\
  如你所见，在网页中引入模块非常简单，与引入脚本相似。然而，在模块的实际加载方式上存在一些差异。\n\n**注意**\n\n你可能已经注意到，“module\"\
  \ 并不是像 \"text/javascript\" 那样的内容类型（content type）。模块 JavaScript 文件的内容类型与脚本 JavaScript\
  \ 文件的相同，因此无法仅根据内容类型来区分它们。此外，当 `type` 无法识别时，浏览器会忽略 `<script>` 元素，因此不支持模块的浏览器会自动忽略\
  \ `<script type=\"module\">` 行，提供了良好的向后兼容性。\n\n## 浏览器中的模块加载顺序\n\n模块的独特之处在于，与脚本不同，它们可以使用\
  \ `import` 来指定为了正确执行必须加载其他文件。为了支持这一功能，`<script type=\"module\">` 始终表现就像应用了 `defer`\
  \ 属性一样。\n\n`defer` 属性加载脚本文件是可选的，但加载模块文件时始终会被应用。一旦 HTML 解析器遇到带有 `src` 属性的 `<script\
  \ type=\"module\">`，模块文件就开始下载，但直到文档完全解析完成后才会执行。模块还按照它们在 HTML 文件中出现的顺序进行执行。这意味着第一个\
  \ `<script type=\"module\">` 保证在第二个之前执行，即使其中一个模块包含内联代码而不是指定 `src`。例如：\n\n```html\n\
  <!-- 这将首先执行 -->\n<script type=\"module\" src=\"module1.js\"></script>\n\n<!-- 这将第二个执行\
  \ -->\n<script type=\"module\">\nimport { sum } from \"./example.js\";\nlet result\
  \ = sum(1, 2);\n</script>\n\n<!-- 这将第三个执行 -->\n<script type=\"module\" src=\"module2.js\"\
  ></script>\n```\n\n这三个 `<script>` 元素按照它们指定的顺序执行，因此 `module1.js` 模块保证在内联模块之前执行，而内联模块保证在\
  \ `module2.js` 模块之前执行。\n\n每个模块都可以从一个或多个其他模块导入这使得情况变得复杂。因此，模块会先完全解析以识别所有的 `import`\
  \ 语句。然后每个 `import` 语句都会触发一次获取（来自网络或缓存），在所有导入资源加载并执行之前，没有任何模块会被执行。\n\n所有模块（无论是使用\
  \ `<script type=\"module\">` 显式包含还是使用 `import` 隐式包含的）都会按顺序加载和执行。在本示例中，完整的加载顺序如下：\n\
  \n1. 下载并解析 `module1.js`。\n2. 递归下载并解析 `module1.js` 中的导入资源。\n3. 解析内联模块。\n4. 递归下载并解析内联模块中的导入资源。\n\
  5. 下载并解析 `module2.js`。\n6. 递归下载并解析 `module2.js` 中的导入资源。\n\n加载完成后，在文档完全解析之前，没有任何内容会被执行。在文档解析完成后，会发生以下操作：\n\
  \n1. 递归执行 `module1.js` 的导入资源。\n2. 执行 `module1.js`。\n3. 递归执行内联模块的导入资源。\n4. 执行内联模块。\n\
  5. 递归执行 `module2.js` 的导入资源。\n6. 执行 `module2.js`。\n\n注意，内联模块的行为与其他两个模块相似，不同之处代码不需要先下载。否则，加载导入资源和执行模块的顺序是相同的。\n\
  \n**注意**\n\n`<script type=\"module\">` 上的 `defer` 属性会被忽略，因为它的行为已经像应用了 defer 一样。\n\
  \n## 浏览器中的异步模块加载\n\n你可能已经熟悉 `<script>` 元素上的 `async` 属性。当与脚本配合使用时，`async` 会导致脚本文件在完全下载并解析后立即执行。然而，文档中异步脚本的顺序不会影响脚本执行的顺序。脚本总是在下载完成后立即执行，而无需等待所在文档完成解析。\n\
  \n`async` 属性也可以应用于模块。在 `<script type=\"module\">` 上使用 `async` 会导致模块以类似于脚本的方式执行。唯一的区别是，模块的所有导入资源会在模块执行之前完成下载。这保证了模块运行所需的所有资源都会模块执行前下载完毕；你只是无法保证模块*何时*执行。考虑以下代码：\n\
  \n```html\n<!-- 无法保证其中哪一个先执行 -->\n<script type=\"module\" async src=\"module1.js\"\
  ></script>\n<script type=\"module\" async src=\"module2.js\"></script>\n```\n\n\
  在此示例中，两个模块文件被异步加载。仅通过此代码无法确定哪个模块将先执行。如果 `module1.js` 先完成下载（包括其所有导入资源），它将先执行。如果 `module2.js`\
  \ 先完成下载，它将先执行。\n\n## 作为 Workers 加载模块\n\nWorkers（如 web workers 和 service workers）在网页上下文之外执行\
  \ JavaScript 代码。创建一个新的 worker 涉及创建一个实例 `Worker`（或其他类）并传入 JavaScript 文件的位置。默认加载机制是将文件作为脚本加载，例如：\n\
  \n```javascript\n// 作为脚本加载 script.js \nlet worker = new Worker(\"script.js\");\n\
  ```\n\n为了支持加载模块，HTML 标准的开发者为这些构造函数添加了第二个参数。第二个参数是一个带有 `type` 属性的对象，默认值为 `\"script\"\
  `。你可以将 `type` 设置为 `\"module\"` 来加载模块文件：\n\n```javascript\n// 作为模块加载 module.js\n\
  let worker = new Worker(\"module.js\", { type: \"module\" });\n```\n\n此示例通过传递一个将\
  \ `\"module\"` 作为 `type` 属性值的第二个参数，将 `module.js` 作为模块而非脚本加载。（`type` 属性旨在模拟 `<script>`\
  \ 的 `type` 属性区分模块和脚本的方式。）浏览器中的所有 worker 类型都支持第二个参数。\n\nWorker 模块通常与 worker 脚本相同，但有两个例外。首先，worker\
  \ 脚本只能从引用它们的网页同源加载，但 worker 模块并没有那么限制。尽管 worker 模块具有相同的默认限制，它们也可以加载具有适当跨源资源共享（CORS）头部的文件。其次，虽然\
  \ worker 脚本可以使用 `self.importScripts()` 方法将额外的脚本加载到 worker 中，`self.importScripts()`\
  \ 在 worker 模块上总是失败，因为你应该使用 `import`。\n\n### 浏览器模块规范符解析\n\n本章到此为止的所有示例都使用相对路径（如字符串\
  \ `\"./example.js\"`）作为模块规范符。浏览器要求模块规范符符合以下格式之一：\n\n- 以 `/` 开头，从根目录解析\n- 以 `./`\
  \ 开头，从当前目录解析\n- 以 `../` 开头，从父目录解析\n- URL 格式\n\n例如，假设位于 [`www.example.com/modules/module.js`](https://www.example.com/modules/module.js)\
  \ 的模块文件包含以下代码：\n\n```javascript\n// 从 https://www.example.com/modules/example1.js\
  \ 导入\nimport { first } from \"./example1.js\";\n```\n\n\n\n\n```javascript\n// imports\
  \ from https://www.example.com/example2.js\n\nimport { second } from \"../example2.js\"\
  ;\n\n// imports from https://www.example.com/example3.js\n\nimport { third } from\
  \ \"/example3.js\";\n\n// imports from https://www2.example.com/example4.js\n\n\
  import { fourth } from \"https://www2.example.com/example4.js\";\n```\n\n此示例中的每个模块标识符（module\
  \ specifier）在浏览器中都是有效的，包括最后一行行的完整 URL。（你只需要确保 `www2.example.com` 已正确配置了 CORS 头部以允许跨域加载。）这些是浏览器默认可以解析的唯一模块标识符格式，尽管尚未完成的模块加载规范将提供解析其他格式的方法。\n\
  \n在此之前，某些看起来正常的模块标识符在浏览器中实际上是无效的，并会导致错误，例如：\n\n```javascript\n// invalid - doesn't\
  \ begin with /, ./, or ../\n\nimport { first } from \"example.js\";\n\n// invalid\
  \ - doesn't begin with /, ./, or ../\n\nimport { second } from \"example/index.js\"\
  ;\n```\n\n这些模块标识符中的每一个无法被浏览器加载。这两个模块标识符的格式无效（缺少正确的起始字符），尽管它们在作为 `<script>` 标签的 `src`\
  \ 属性值使用时都能正常工作。这是 `<script>` 和 `import` 之间刻意的行为差异。\n\n## 总结\n\nECMAScript 6 将模块引入语言中，作为一种打包和封装功能的方式。模块的行为与脚本不同，不同之处在于，它们不会通过其顶层变量、函数和类来修改全局作用域，而这种行为是未定义的。为了实现这种行为，模块使用不同的模式进行加载。\n\
  \n你必须导出任何想要让模块调用者可用的功能。变量、函数和类都可以导出，并且每个模块允许一个默认导出（default export）。导出后，另一个模块可以导入所有或部分导出的名称。这些名称的作用就像是由\
  \ `let` 定义的一样，并作为块绑定（block bindings）运行，不能在同一个模块中重新声明。\n\n如果模块正在操作全局作用域中的内容，则不需要导出任何内容。实际上，你可以从这样的模块导入内容，而不会在模块作用域中引入任何绑定。\n\
  \n由于模块必须在不同的模式下运行，浏览器引入了 `<script type=\"module\">` 来指示源文件或内联代码应作为模块执行。使用 `<script\
  \ type=\"module\">` 加载的模块就像应用了 `defer` 属性一样加载。模块在文档完全解析后，按照它们在包含文档中出现的顺序进行执行。\n\n\
  ## A: ECMASCRIPT 6 的微改\n\n![image](img/common-01.jpg)\n\n除了本书涵盖的重大变更外，ECMAScript\
  \ 6 还整合了其他一些较小的更改，这些更改有助于改进 JavaScript。这些更改包括让整数更易用、为计算添加新方法、调整 Unicode 标识符以及正式化\
  \ `__proto__` 属性，我均将在本附录中描述这些内容。\n\n### 处理整数\n\nJavaScript 使用 IEEE 754 编码系统来表示整数和浮点数，这在多年来引起了许多困惑。语言付出了努力确保开发者不需要担心数字编码的细节，但问题仍时时发生。ECMAScript\
  \ 6 通过让整数更易于识别和处理来解决这些问题。\n\n### 识别整数\n\nECMAScript 6 增加了 `Number.isInteger()` 方法，它可以判断一个值是否代表\
  \ JavaScript 中的一个整数。尽管 JavaScript 使用 IEEE 754 来表示两种类型的数字，但浮点数和整数的存储方式不同。`Number.isInteger()`\
  \ 方法利用了这种存储差异，当对一个值调用该方法时，JavaScript 引擎会查看该值的底层表示以判断该值是否为整数。因此，看起来像浮点数的数字实际上可能被存储为整数并导致\
  \ `Number.isInteger()` 返回 true。例如：\n\n```javascript\nconsole.log(Number.isInteger(25));\
  \      // true\nconsole.log(Number.isInteger(25.0));    // true\nconsole.log(Number.isInteger(25.1));\
  \    // false\n```\n\n段代码中，`Number.isInteger()` 对 `25` 和 `25.0` 都返回 true，尽管后者看起来像浮点数。在\
  \ JavaScript 中，仅仅给数字添加小数点并不会将其变成浮点数。因为 `25.0` 实际上就是 `25`，所以被存储为整数。然而，数字 `25.1` 被存储为浮点数，因为它有一个小数值。\n\
  \n### 安全整数\n\nIEEE 754 只能准确表示于 `-2⁵³` 和 `2⁵³` 之间的整数，在这个“安全”范围之外，二进制表示会被复用于多个数值。这意味着在问题出现之前，JavaScript\
  \ 只能在 IEEE 754 范围内安全地表示整数。例如，考虑这段代码：\n\n```javascript\nconsole.log(Math.pow(2, 53));\
  \      // 9007199254740992\nconsole.log(Math.pow(2, 53) + 1);  // 9007199254740992\n\
  ```\n\n这个示例并不包含拼写错误，但两个不同的数字由同一个整数表示。值越超出安全范围，这种影响就越明显。\n\nECMAScript 6 引入了 `Number.isInteger()`\
  \ 方法来更好地识别整数。它还增加了 `Number.MAX_SAFE_INTEGER` 和 `Number.MIN_SAFE_INTEGER` 属性，分别表示整数范围的上下下界。`Number.isSafeInteger()`\
  \ 方法确保一个值是整数且处于安全范围内，如下所示：\n\n```javascript\nvar inside = Number.MAX_SAFE_INTEGER,\n\
  outside = inside + 1;\n\nconsole.log(Number.isInteger(inside));    // true\nconsole.log(Number.isSafeInteger(inside));\
  \ // true\nconsole.log(Number.isInteger(outside));   // true\nconsole.log(Number.isSafeInteger(outside));\
  \ // false\n```\n\n数字 `inside` 是最大的安全整数，因此它让 `isInteger()` 和 `isSafeInteger()` 方法返回\
  \ true。数字 `outside` 是第一个有问题的整数值，它不被认为是安全的，尽管它仍然是整数。在大多数情况下，当你在 JavaScript 中进行整数运算或比较时，只想处理安全整数；因此，将\
  \ `Number.isSafeInteger()` 作为输入验证的一部分是一个好主意。\n\n## 新方法\n\n对游戏和图形的新关注导致 ECMAScript\
  \ 6 在 JavaScript 中引入了类型数组（typed arrays），这也让人们意识到 JavaScript 引擎可以更高效地执行许多数学计算。但像\
  \ asm.js 这种通过 JavaScript 子集来提高性能的优化策略需要更多信息以便最快速度进行计算。例如，知道数字应该被视为 32 位整数还是 64 位浮点数对于硬件操作至关重要，因为硬件操作比软件操作快得多。\n\
  \n因此，ECMAScript 6 在 `Math` 对象中添加了几种方法以提高常用计算速度。提高常用计算的速度也提高了执行大量计算的应用程序的整体速度，例如图形程序中的。\n\
  \n表 A-1：ECMAScript 6 中的 Math 对象方法\n\n| 方法 | 返回 |\n| --- | --- |\n| `Math.acosh(x)`\
  \ | x 的反双曲余弦 |\n| `Math.asinh(x)` | x 的反双曲正弦 |\n| `Math.atanh(x)` | x 的反双曲正切 |\n\
  | `Math.cbrt(x)` | x 的立方根 |\n| `Math.clz32(x)` | x 的 32 位整数表示中导零比特的个数 |\n| `Math.cosh(x)`\
  \ | 双曲余弦 |\n\n\n\n\n\n| `Math.expm1(x)` | x 的指数函数减去 1 的结果 |\n| `Math.fround(x)`\
  \ | x 最接近的单精度浮点数 |\n| `Math.hypot(...values)` | 每个参数平方之和的平方根 |\n| `Math.imul(x,\
  \ y)` | 对两个参数执行真 32 位乘法的结果 |\n| `Math.log1p(x)` | 1 + x 的自然对数 |\n| `Math.log2(x)`\
  \ | x 以 2 为底的对数 |\n| `Math.log10(x)` | x 以 10 为底的对数 |\n| `Math.sign(x)` | 如果 x 为负则返回\
  \ -1，如果 x 为 +0 或 -0 则返回 0，如果 x 为正则返回 1 |\n| `Math.sinh(x)` | x 的双曲正弦 |\n| `Math.tanh(x)`\
  \ | x 的双曲正切 |\n| `Math.trunc(x)` | 整数（移除浮点数的小数部分） |\n\n详细解释每个新方法及其功能超出了本书的范围。但如果你的应用程序需要执行某种相当常见的计算，请务必在自己实现之前检查这些新的\
  \ `Math` 方法。\n\n## Unicode 标识符\n\nECMAScript 6 比之前的 JavaScript 版本 了更好的 Unicode 支持，它还改变了你可以作为标识符使用的字符。在\
  \ ECMAScript 5 中，可以使用 Unicode 转义序列作为标识符。例如：\n\n```javascript\n// 在 ECMAScript 5\
  \ 和 6 中均有效\nvar \\u0061 = \"abc\";\nconsole.log(\\u0061);      // \"abc\"\n\n//\
  \ 等同于：\nconsole.log(a);          // \"abc\"\n```\n\n在此示例的 `var` 语句之后，你可以使用 `\\u0061`\
  \ 或 `a` 来访问该变量。在 ECMAScript 6 中，你还可以使用 Unicode 代码点转义序列作为标识符，如下：\n\n```javascript\n\
  // 在 ECMAScript 5 和 6 中均有效\nvar \\u{61} = \"abc\";\nconsole.log(\\u{61});      //\
  \ \"abc\"\n\n// 等同于：\nconsole.log(a);          // \"abc\"\n```\n\n此示例只是将 `\\u0061`\
  \ 替换为其等效的代码点。否则，代码的功能与之前的示例相同。\n\n此外，ECMAScript 6 根据 Unicode 标准附录 #31“Unicode 标识符和模式语法”([http://unicode.org/reports/tr31/])\
  \ 正式规定了有效标识符，包含以下规则：\n\n- 第一个字符必须是 `$`、`_` 或任何派生核心属性 `ID_Start` 的 Unicode 符号。\n\
  - 后的每个字符必须是 `$`、`_`、`\\u200c`（零宽不连接符）、`\\u200d`（零宽连接符）或任何派生核心属性 `ID_Continue` 的\
  \ Unicode 符号。\n\n`ID_Start` 和 `ID_Continue` 派生核心属性在“Unicode 标识符和模式语法”中定义，用于识别适用于标识符（如变量和域名）的符号。该规范并不特指于\
  \ JavaScript。\n\n### 正式化 `__proto__` 属性\n\n在 ECMAScript 5 完成之前，几个 JavaScript 引擎已经实现了一个名为\
  \ `__proto__` 的自定义属性，可用于获取和设置 `Prototype` 属性。实际上，`__proto__` 是 `Object.getPrototypeOf()`\
  \ 和 `Object.setPrototypeOf()` 方法的早期先驱。期望所有 JavaScript 引擎都移除此属性是不切实际的（多个流行的 JavaScript\
  \ 库都使用了 `__proto__`），因此 ECMAScript 6 也正式化了 `__proto__` 的行为。但这种正式化出现在 ECMA-262 的附录\
  \ B 中，并附带有以下警告：\n\n> [!IMPORTANT]\n> 这些特性不被视为 ECMAScript 核心语言的组成。程序员在编写新的 ECMAScript\
  \ 代码时，不应使用或假设这些特性和行为的存在。不建议 ECMAScript 实现实现这些特性，除非该实现是 Web 浏览器的一部分，或者为了运行 Web 浏览器会遇到的相同遗留\
  \ ECMAScript 代码。\n\nECMAScript 规范建议使用 `Object.getPrototypeOf()` 和 `Object.setPrototypeOf()`\
  \ 代替 `__proto__`，因为 `__proto__` 具有以下特性：\n\n- 你在对象字面量中只能指定一次 `__proto__`。如果你指定了两个\
  \ `__proto__` 属性，将抛出错误。这是唯一具有该限制的对象字面量属性。\n- 计算形式 `[\"__proto__\"]` 表现类似于普通属性，不会设置或返回当前对象的原型。所有与对象字面量属性相关的规则在此形式下均适用，而具有异常的非计算形式则不同。\n\
  \n尽管你应该避免使用 `__proto__` 属性，但规范定义该属性的方式值得注意。在 ECMAScript 6 引擎中，`Object.prototype.__proto__`\
  \ 被定义为一个访问器属性，其 `get` 方法调用 `Object.getPrototypeOf()`，而其 `set` 方法调用 `Object.setPrototypeOf()`\
  \ 方法。因此，使用 `__proto__` 与 `Object.getPrototypeOf()` 或 `Object.setPrototypeOf()` 方法之间的唯一区别是，`__proto__`\
  \ 允许你直接设置对象字面量的原型。其工作原理如下：\n\n```javascript\nlet person = {\n    getGreeting() {\n\
  \        return \"Hello\";\n    }\n};\n\nlet dog = {\n    getGreeting() {\n    \
  \    return \"Woof\";\n    }\n};\n\nlet friend = {\n    __proto__: dog\n};\n\nconsole.log(person.getGreeting());\
  \ // \"Hello\"\nconsole.log(dog.getGreeting());    // \"Woof\"\nconsole.log(friend.getGreeting());\
  \ // \"Woof\"\n```\n\n### 理解 ECMASCRIPT 7 (2016)\n\n**B** (附录)\n\nECMAScript 6 的开发花费了四年的时间，之后\
  \ TC-39 决定这种开发模式是持续的。相反，它改为年度发布，以确保新功能能更快进入开发。\n\n更频繁的发布意味着每个 ECMAScript 版本的功能比版本\
  \ 6 要少。为了指示这一变化，新版本不再突出版本号，而是以年份命名。因此，ECMAScript 6 也称为 ECMAScript 2015，而 ECMAScript\
  \ 7 正式称为 ECMAScript 2016。TC-39 预计对未来的 ECMAScript 版本都使用年份命名法。\n\nECMAScript 2016\
  \ 于 2016 年 3 月定稿，对语言增加了三个内容：一个新的数学运算符、一个新的数组方法和一个语法错误。这三者在本附录中均有涵盖。\n\n### 幂运算符\n\
  \nECMAScript 2016 引入 JavaScript 语法的唯一变化是*幂运算符*，它是一种应用于基数的数学运算。JavaScript 已经有了 `Math.pow()`\
  \ 方法来执行幂运算，但 JavaScript 也是唯一需要方法而非正式运算符的语言。此外，一些开发者认为运算符更容易阅读和理解。\n\n幂运算符是两个星号（`**`）：左操作数是基数，右操作数是指数。例如：\n\
  \n```javascript\nlet result = 5 ** 2;\nconsole.log(result); // 25\nconsole.log(result\
  \ === Math.pow(5, 2)); // true\n```\n\n### 运算顺序\n\n幂运算符是 JavaScript 中所有二元运算符中优先级最高的（一元运算符的优先级高于\
  \ `**`）。这意味着它优先应用于复合操作，如下所示：\n\n```javascript\nlet result = 2 * 5 ** 2;\nconsole.log(result);\
  \ // 50\n```\n\n\n\n\n首先计算 `5²`。然后将结果与 `2` 相乘，得到最终结果 `50`。\n\n## 操作数限制\n\n幂运算符确实具有一种其他运算符不具备的相当特殊的限制。幂运算的左侧不能是除\
  \ `++` 或 `--` 以外的一元表达式。例如，以下代码使用了无效的语法：\n\n```javascript\n// syntax error\nlet result\
  \ = -5 ** 2;\n```\n\n在这个示例中，`-5` 是语法错误，因为操作顺序存在歧义。`-` 是仅作用于 `5`，还是作用于 `5 ** 2` 表达式的结果？禁止在幂运算符的左侧使用一元表达式消除了这种歧义。为了明确指定意图，你需要在\
  \ `-5` 周或 `5 ** 2` 周加上括号，如下所示：\n\n```javascript\n// okay\nlet result1 = -(5 ** 2);\
  \    // 等于 -25\n\n// 也是 okay\nlet result2 = (-5) ** 2;   // 等于 25\n```\n\n如果你将括号放在表达式周围，`-`\
  \ 将应用于整个表达式。将 `-5` 包围在括号内，可以清楚地表示你想计算 `-5` 的二次方。\n\n在幂运算符的左侧使用 `++` 和 `--` 时不需要括号，因为这两个操作符对其操作数都有明确定义的行为。前缀\
  \ `++` 或 `--` 在任何其他操作发生之前更改操作数，而后缀版本则在整个表达式求值之后不会进行任何更改。这两种用例在以下代码的运算符左侧上都是安全的：\n\
  \n```javascript\nlet num1 = 2, num2 = 2;\nconsole.log(++num1 ** 2);      // 9\n\
  console.log(num1);             // 3\nconsole.log(num2-- ** 2);      // 4\nconsole.log(num2);\
  \             // 1\n```\n\n在这个示例中，`num1` 在应用幂运算符之前递增，因此 `num1` 变为 `3`，操作结果为 `9`。对于\
  \ `num2`，该值在幂运算期间保持为 `2`，然后递减到 `1`。\n\n## Array.prototype.includes() 方法\n\n你可能记得\
  \ ECMAScript 6 增加了 `String.prototype.includes()` 来检查某些子字符串是否存在于给定字符串中。最初，ECMAScript\
  \ 6 还打算引入 `Array.prototype.includes()` 方法，以继续将字符串和数组类似类似的趋势。但在 ECMAScript 6 截止日期之前，`Array.prototype.includes()`\
  \ 的规范尚完整，因此 `Array.prototype.includes()` 最终出现在 ECMAScript 2016 中。\n\n### 如何使用 Array.prototype.includes()\n\
  \n`Array.prototype.includes()` 方法接受两个参数：要搜索的值和一个可选的起始搜索索引。当提供第二个参数时，`includes()`\
  \ 将从该索引开始匹配。（默认起始索引为 0。）如果在数组内部找到该值，则返回 `true`，否则返回 `false`。例如：\n\n```javascript\n\
  let values = [1, 2, 3];\nconsole.log(values.includes(1));      // true\nconsole.log(values.includes(0));\
  \      // false\n// 从索引 2 开始搜索\nconsole.log(values.includes(1, 2));   // false\n\
  ```\n\n在这里，`values.includes()` 对于值 `1` 返回 `true`，对于值 `0` 返回 `false`，因为 `0` 不在数组中。当使用第二个参数从索引\
  \ `2`（包含值 `3`）开始搜索时，`values.includes()` 方法返回 `false`，因为 `1` 不在索引 `2` 到数组末尾之间。\n\n\
  ### 值比较\n\n`includes()` 方法执行的值比较使用 `===` 运算符，但有一个例外：`NaN` 被认为等于 `NaN`，即使 `NaN ===\
  \ NaN` 求值结果为 `false`。这与 `indexOf()` 方法的行为不同，后者严格使用 `===` 进行比较。要查看差异，请考虑这段代码：\n\n\
  ```javascript\nlet values = [1, NaN, 2];\nconsole.log(values.indexOf(NaN));    \
  \  // -1\nconsole.log(values.includes(NaN));     // true\n```\n\n`values.indexOf()`\
  \ 方法对于 `NaN` 返回 `-1`，尽管 `NaN` 包含在 `values` 数组中。相反，`values.includes()` 对于 `NaN` 返回\
  \ `true`，因为它使用了不同的值比较运算符。\n\n当你只想检查数组中是否存在某个值而不需要知道其索引时，我建议使用 `includes()`，因为 `includes()`\
  \ 和 `indexOf()` 方法对 `NaN` 的处理方式不同。如果你确实需要知道值在数组中的位置，则必须使用 `indexOf()` 方法。\n\n该实现的另一个特殊之处是\
  \ `+0` 和 `-0` 被认为是相等。在这种情况下，`indexOf()` 和 `includes()` 的行为是相同的：\n\n```javascript\n\
  let values = [1, +0, 2];\nconsole.log(values.indexOf(-0)); \n```\n\n## 函数作用域严格模式的变更\n\
  \n在 ECMAScript 5 引入严格模式时，`\"use strict\"` 指令只能在函数内部使用。ECMAScript 6 允许在脚本的顶层使用它。然而，这产生了一个问题：如果脚本使用了\
  \ `\"use strict\"`，整个脚本都将处于严格模式。为了解决这个问题，ECMAScript 2015 引入了通过模块（modules）在特定作用范围内使用\
  \ `\"use strict\"` 的方法。现在，如果你在模块中使用 `\"use strict\"`，则只有该模块处于严格模式。如果你在函数中使用，则只有该函数处于严格模式。这就是为什么你经常在文件顶部或函数内部看到\
  \ `\"use strict\"`。\n\n\n\n\n\n... (剩余项目), 92–93\n\n... (剩余参数), 44–46\n\n... (展开运算符),\
