  \ 的作用与 `===` 运算符相同。唯一的区别是 `+0` 和 `-0` 被认为不等等，且 `NaN` 被认为等于 `NaN`。但不需要停止使用相等运算符。根据特殊情况对代码的影响，选择使用\
  \ `is()` 代替 `==` 或 `===`。\n\n```javascript\nObject.is(+0, -0);      // false\nObject.is(0,\
  \ 0);       // true\nObject.is(NaN, NaN);   // true\nObject.is(5, 5);        //\
  \ true\nObject.is(5, \"5\");      // false\n```\n\n## Object.assign() 方法\n\n*Mixin*\
  \ 是 JavaScript 对象组合中最流行的模式之一。在混入中，一个对象从另一个对象接收属性和方法。许多 JavaScript 库都有类似的 mixin 方法：\n\
  \n```javascript\nfunction mixin(receiver, supplier) {\n    Object.keys(supplier).forEach(function(key)\
  \ {\n        receiver[key] = supplier[key];\n    });\n    return receiver;\n}\n\
  ```\n\n`mixin()` 函数遍历 `supplier` 的自有属性，并将它们复制到 `receiver` 上（浅拷贝，当属性值为对象时，会共享对象引用）。这允许接收者在不继承的情况下获得新属性，如下代码所示：\n\
  \n```javascript\nfunction EventTarget() { /*...*/ }\nEventTarget.prototype = {\n\
  \    constructor: EventTarget,\n    emit: function() { /*...*/ },\n    on: function()\
  \ { /*...*/ }\n};\n\nvar myObject = {};\nmixin(myObject, EventTarget.prototype);\n\
  \nmyObject.emit(\"somethingChanged\");\n```\n\n在这里，`myObject` 从 `EventTarget.prototype`\
  \ 对象接收行为。这使得 `myObject` 能够通过 `emit()` 和 `on()` 方法分别发布事件和订阅事件。\n\n\n\n\n这种混入（mixin）模式变得非常流行，以至于\
  \ ECMAScript 6 增加了 `Object.assign()` 方法，它的行为相同：接受接收者（receiver）和任意数量的供应者（suppliers），然后返回接收者。从\
  \ `mixin()` 到 `assign()` 的命名反映了实际的操作。由于 `mixin()` 函数使用了赋值运算符（`=`），它无法将访问器属性（accessor\
  \ properties）作为访问器属性拷贝到接收者。选择 `Object.assign()` 这个名字是为了反映这种区别。\n\n### 注意\n\n各种库中的类似方法对相同的基本功能可能有其他名称；流行的替代方案包括\
  \ `extend()` 和 `mix()` 方法。除了 `Object.assign()` 方法外，ECMAScript 6 曾短暂添加过 `Object.mixin()`\
  \ 方法。主要的区别在于 `Object.mixin()` 也会复制访问器属性，但该方法由于对 `super` 使用的担忧而被移除（在“带有 Super 引用的轻松原型访问”，见\
  \ 第 77 页 中进行了讨论）。\n\n你可以在任何使用 `mixin()` 函数的地方使用 `Object.assign()`。这里有一个示例：\n\n```javascript\n\
  function EventTarget() { /*...*/ }\n\nEventTarget.prototype = {\n    constructor:\
  \ EventTarget,\n    emit: function() { /*...*/ },\n    on: function() { /*...*/\
  \ }\n}\n\nvar myObject = {}\n\nObject.assign(myObject, EventTarget.prototype);\n\
  \nmyObject.emit(\"somethingChanged\");\n```\n\n`Object.assign()` 方法接受任意数量的供应者，接收者按照供应者指定的顺序接收属性。这意味着第二个供应者可能会覆盖接收者上第一个供应者的值，这在下面的代码片段中发生了：\n\
  \n```javascript\nvar receiver = {};\n\nObject.assign(receiver,\n    {\n        type:\
  \ \"js\",\n        name: \"file.js\"\n    },\n    {\n        type: \"css\"\n   \
  \ }\n);\n\nconsole.log(receiver.type);    // \"css\"\nconsole.log(receiver.name);\
  \    // \"file.js\"\n```\n\n`receiver.type` 的值为 `\"css\"`，是因为第二个供应者覆盖了第一个供应者的值。\n\
  \n`Object.assign()` 方法并不是 ECMAScript 6 的重大新增，但它确实将许多 JavaScript 库中常见的函数形式化了。\n\n\
  ### 处理访问器属性\n\n记住，当供应者具有访问器属性时，`Object.assign()` 不会在接收者上创建访问器属性。由于 `Object.assign()`\
  \ 使用赋值运算符，供应者上的访问器属性将变成接收者上的数据属性。例如：\n\n```javascript\nvar receiver = {},\n    supplier\
  \ = {\n        get name() {\n            return \"file.js\"\n        }\n    };\n\
  \nObject.assign(receiver, supplier);\n\nvar descriptor = Object.getOwnPropertyDescriptor(receiver,\
  \ \"name\");\n\nconsole.log(descriptor.value);      // \"file.js\"\nconsole.log(descriptor.get);\
  \        // undefined\n```\n\n在此代码中，供应者有一个名为 `name` 的访问器属性。在使用 `Object.assign()`\
  \ 方法之后，`receiver.name` 以值为 `\"file.js\"` 的数据属性的形式存在，因为在调用 `Object.assign()` 时，`supplier.name`\
  \ 返回了 `\"file.js\"`。\n\n## 重复的对象字面量属性\n\nECMAScript 5 严格模式引入了对重复对象字面量属性的检查，如果发现重复将抛出错误。例如，这段代码是有问题的：\n\
  \n```javascript\n\"use strict\";\n\nvar person = {\n    name: \"Nicholas\",\n  \
  \  name: \"Greg\"         // ES5 严格模式下的语法错误\n};\n```\n\n在 ECMAScript 5 严格模式运行时，第二个\
  \ `name` 属性会导致语法错误。但在 ECMAScript 6 中，重复属性检查被移除了。严格和非严格模式的代码都不再检查重复属性。相反，给定名称的最后一个属性成为该属性的实际值，如下：\n\
  \n```javascript\n\"use strict\";\n\nvar person = {\n    name: \"Nicholas\",\n  \
  \  name: \"Greg\"         // ES6 严格模式下无错误\n};\n\nconsole.log(person.name);     \
  \ // \"Greg\"\n```\n\n示例中，`person.name` 的值为 `\"Greg\"`，因为这是赋值给该属性的最后一个值。\n\n###\
  \ 自有属性枚举顺序\n\nECMAScript 5 没有定义对象属性的枚举顺序；由 JavaScript 引擎厂商定义。然而，ECMAScript 6 定义了自有属性返回的顺序：\n\
  \n1. 所有数字键按升序排列\n2. 所有字符串键按添加顺序排列\n3. 所有符号键（在第 6 章中介绍）\n\n这里有一个示例：\n\n```javascript\n\
  var obj = {\n    a: 1,\n    0: 1,\n    c: 1,\n    2: 1,\n    b: 1\n};\n\nobj.d =\
  \ 1;\n\nconsole.log(Object.OwnPropertyNames(obj).join(\"\")); // \"02abcd\"\n```\n\
  \n`for-in` 循环仍然有一个枚举顺序，因为并不是所有引擎的实现都相同。`Object.keys()` 和 `JSON.stringify()` 都规定使用相同的顺序。虽然枚举顺序是\
  \ JavaScript 工作机制的一个细微变化，但并不难以找到那些依赖顺序的程序。ECMAScript 6 通过定义枚举顺序，确保了 JavaScript 代码无论如何都能执行。\n\
  \n原型是继承的基础，ECMAScript 6 改进了 JavaScript 原原型的限制。然而，随着语言的成熟和开发者熟悉原型，显然他们希望对原型有更多的控制权以及更方便的操作方法。因此，ECMAScript\
  \ 6 对原型引入了一些改进。\n\n#### 修改对象的原型\n\n通常，对象的原型是在创建对象时指定的，通过构造函数或 `Object.create()`\
  \ 方法。对象原型在实例化后保持不变的观点是 ECMAScript 5 时代 JavaScript 编程的主要假设之一。ECMAScript 5 确实增加了 `Object.getPrototypeOf()`\
  \ 方法来获取任何对象的原型，但仍然缺乏在实例化后更改对象原型的标准方法。\n\nECMAScript 6 通过引入 `Object.setPrototypeOf()`\
  \ 方法改变了这一假设，该方法允许你更改任何给定对象的原型。`Object.setPrototypeOf()` 方法接受两个参数：要更改原型的对象以及作为第一个参数原型的对象。例如：\n\
  \n```javascript\nlet person = {\n    getGreeting() {\n        return \"Hello\";\n\
  \    }\n};\n\nlet dog = {\n    getGreeting() {\n        return \"Woof\";\n    }\n\
  };\n\n// 原型为 person\nlet friend = Object.create(person);\nconsole.log(friend.getGreeting());\
  \    // \"Hello\"\nconsole.log(Object.getPrototypeOf(friend) === person); // true\n\
  \n// 将原型设置为 dog\nObject.setPrototypeOf(friend, dog);\nconsole.log(friend.getGreeting());\
  \    // \"Woof\"\nconsole.log(Object.getPrototypeOf(friend) === dog);   // true\n\
  ```\n\n\n\n\n这段代码定义两个基础对象：`person` 和 `dog`。这两个对象都拥有一个返回字符串的 `getGreeting()` 方法。对象\
  \ `friend` 首先继承自 `person` 对象，这意味着 `getGreeting()` 输出为 \"Hello\"。当原型变为 `dog` 对象时，`person.getGreeting()`\
  \ 输出为 \"Woof\"，因为与 `person` 的原始关系已经断打破了。\n\n对象原型的实际值存储在一个仅限内部使用的属性中，标记为 `[[Prototype]]`。`Object.getPrototypeOf()`\
  \ 方法返回存储在 `[[Prototype]]` 中的值，而 `Object.setPrototypeOf()` 则更改存储在 `[[Prototype]]`\
  \ 中的值。然而，这些并不是处理 `[[Prototype]]` 值的唯一方法。\n\n## 使用 super 引用轻松访问原型\n\n如前所述，原型在 JavaScript\
  \ 中非常重要，ECMAScript 6 在让原型变得更易于使用的方面付出了大量努力。另一个改进是引入了 `super` 引用，它使得访问对象原型上的功能变得更加简单。例如，若要重写对象实例上的方法并使其同时也调用同名的原型方法，在\
  \ ECMAScript 5 中你需要这样操作：\n\n```javascript\nlet person = {\n    getGreeting() {\n\
  \        return \"Hello\";\n    }\n};\n\nlet dog = {\n    getGreeting() {\n    \
  \    return \"Woof\";\n    }\n};\n\nlet friend = {\n    getGreeting() {\n      \
  \  return Object.getPrototypeOf(this).getGreeting.call(this) + \", hi!\";\n    }\n\
  };\n\n// 将原型设置为 person\nObject.setPrototypeOf(friend, person);\nconsole.log(friend.getGreeting());\
  \                   // \"Hello, hi!\"\nconsole.log(Object.getPrototypeOf(friend)\
  \ === person);  // true\n\n// 将原型设置为 dog\nObject.setPrototypeOf(friend, dog);\n\
  console.log(friend.getGreeting());                   // \"Woof, hi!\"\nconsole.log(Object.getPrototypeOf(friend)\
  \ === dog);  // true\n```\n\n在这个示例中，`friend` 上的 `getGreeting()` 调用了同名的原型方法。`Object.getPrototypeOf()`\
  \ 方法确保了调用了正确的原型，然后在输出中添加了一个额外的字符串。额外的 `.call(this)` 确保原型方法内部的 `this` 值被正确设置。\n\n\
  记住使用 `Object.getPrototypeOf()` 和 `.call(this)` 来调用原型上的方法有点繁琐，因此 ECMAScript 6 引入了\
  \ `super`。简单来说，`super` 是一个指向当前对象原型的指针，实际上等同于 `Object.getPrototypeOf(this)` 的值。了解这一点后，你可以如下简化\
  \ `getGreeting()` 方法：\n\n```javascript\nlet friend = {\n    getGreeting() {\n  \
  \      // 在上一个示例中，这等同于：\n        // Object.getPrototypeOf(this).getGreeting.call(this)\n\
  \        return super.getGreeting() + \", hi!\";\n    }\n};\n```\n\n在此语境下，对 `super.getGreeting()`\
  \ 的调用与 `Object.getPrototypeOf(this).getGreeting.call(this)` 相同的。同样，你可以通过 `super`\
  \ 引用调用对象原型上的任何方法，只要是它位于简洁方法（concise method）内部。在简洁方法外部尝试使用 `super` 会导致语法错误，如下例所示：\n\
  \n```javascript\nlet friend = {\n    getGreeting: function() {\n        // 语法错误\n\
  \        return super.getGreeting() + \", hi!\";\n    }\n};\n```\n\n这个示例使用了带有函数的具名属性，对\
  \ `super.getGreeting()` 的调用会导致语法错误，因为 `super` 在此语境下是无效的。\n\n当你有多级继承时，`super` 引用非常有帮助，因为在这种情况下，`Object.getPrototypeOf()`\
  \ 在所有情况下都不再有效。例如：\n\n```javascript\nlet person = {\n    getGreeting() {\n      \
  \  return \"Hello\";\n    }\n};\n\n// 原形是 person\nlet friend = {\n    getGreeting()\
  \ {\n        return Object.getPrototypeOf(this).getGreeting.call(this) + \", hi!\"\
  ;\n    }\n};\nObject.setPrototypeOf(friend, person);\n\n// 原形是 friend\nlet relative\
  \ = Object.create(friend);\nconsole.log(person.getGreeting());  // \"Hello\"\nconsole.log(friend.getGreeting());\
  \   // \"Hello, hi!\"\nconsole.log(relative.getGreeting()); // \"Hello, hi!\"\n\
  ```\n*(等等，让我们重新审视原文关于 relative 方法的逻辑：原文说 `console.log(person.getGreeting())` 是 \"\
  Hello\"，`console.log(friend.getGreeting())` 是 \"Hello, hi!\"，而在提供的代码片段逻辑中，`console.log(relative.getGreeting())`\
  \ 会导致堆栈溢出/错误)。\n\n## 正式方法定义\n\n在 ECMAScript 6 之前，“方法”的概念并没有被正式定义。方法只是包含函数的属性。ECMAScript\
  \ 6 正式地将方法定义为具有 `[[Prototype]]` 的函数。请考虑以下内容：\n\n```javascript\nlet person = {\n\
  \    // 方法\n    getGreeting() {\n        return \"Hello\";\n    }\n};\n\n// 不是方法\n\
  function shareGreeting() {\n    return \"Hi!\";\n}\n```\n\n这个代码示例定义的 `person` 拥有一个单一方法\
  \ `getGreeting()`。`getGreeting()` 的 `[[Prototype]]` 是 `person`。然而，`shareGreeting()`\
  \ 函数没有指定 `[[Prototype]]`，因为它没有被赋值给对象。在大多数情况下，这种差异并不重要，但在使用 `super` 引用时，它变得非常重要。\n\
  \n任何对 `super` 的引用都会使用 `[[Prototype]]` 来确定执行的操作。该过程的第一步是在 `[[Prototype]]` 上调用 `Object.getPrototypeOf()`\
  \ 以获取原型的引用。接下来，在原型中搜索同名的函数。然后，设置 `this` 绑定并调用该方法。看下面的示例：\n\n```javascript\nlet person\
  \ = {\n    getGreeting() {\n        return \"Hello\";\n    }\n};\n\n// 原形是 person\n\
  let friend = {\n    getGreeting() {\n        return super.getGreeting() + \", hi!\"\
  ;\n    }\n};\n```\n\n## 总结\n\n对象是 JavaScript 编程的核心，ECMAScript 6 对对象做了一些非常有用的改进，使得它们更易处理且更加灵活。\n\
  \nECMAScript 6 对对象字面量做了多项更改。简写属性定义使得赋值与作用域内变量同名的属性变得简单。计算属性名允许你使用非字面量值作为属性名，而你已经在语言的其他领域可以这样做了。简写方法允许通过完全省略冒号和\
  \ `function` 关键字，在对象字面量上定义方法时输入更少。ECMAScript 6 也放宽了严格模式对对象字面量重复属性名的检查，这意味着单个对象字面量中可以包含两个同名的属性而不会报错。\n\
  \n\n\n\n\n`Object.assign()` 方法让你更更容易一次性更改单个对象上的多个属性，在使用混入（mixin）模式时非常有用。`Object.is()`\
  \ 方法对任何值执行严格相等比较，当你在处理特殊的 JavaScript 值时，它实际上变成了一个比 `===` 更安全的版本。\n\nECMAScript 6\
  \ 明确定义了自有属性的枚举顺序。数字键始终按升序排列在前，随后是按插入顺序排列的字符串键和按插入顺序排列的符号键（symbol）。\n\n得益于 ECMAScript\
  \ 6 的 `Object.setPrototypeOf()` 方法，现在可以在对象创建后修改它的原型。\n\n此外，你可以使用 `super` 关键字来调用对象原型上的方法。使用\
  \ `super` 用的方法内部的 `this` 绑定被设置为自动与 `this` 的当前值工作。\n\n# 5 解构：更方便的数据访问\n\n![image](img/common-01.jpg)\n\
  \n对象字面量和数组字面量是 JavaScript 中最常用的两种表示法，得益于流行的 JSON 数据格式，它们已成为该语言中特别重要的一部分。定义对象和数组，然后从这些结构中系统地提取相关信息是非常常见的操作。ECMAScript\
  \ 6 通过引入*解构*（destructuring）简化了这项任务，解构是将数据结构分解为更小部分的过程。本章将向你展示如何利用对象构解构。\n\n## 为什么解构很有用？\n\
  \n在 ECMAScript 5 及更早版本中，从对象和数组获取信息可能导致大量的重复代码，以便将某些数据放入局部变量。\n\n例如：\n\n```javascript\n\
  let options = {\n    repeat: true,\n    save: false\n};\n// 从对象中提取数据\nlet repeat\
  \ = options.repeat,\n    save = options.save;\n```\n\n这段代码从 `options` 对象中提取 `repeat`\
  \ 和 `save` 的值，并将这些数据存储在同名的局部变量中。虽然这段代码看起来很简单，但想象一下如果你有大量的变量需要赋值：你必须一个一个地为它们赋值。如果你必须遍历嵌套的数据结构来查找信息，你可能需要掘遍整个结构才能找到某条数据。\n\
  \n这就是为什么 ECMAScript 6 为对象*和*数组添加了解构的原因。当你将一个数据结构分解为更小的部分时，从从中获取所需信息就会变得简单得多。许多语言使用极少的语法来实现解构，以使该过程更易用。ECMAScript\
  \ 6 的实现实际上使用了你已经熟悉的语法：即对象和数组字面量的语法。\n\n## 对象解构\n\n对象解构语法在赋值操作的左侧使用一个对象字面量。例如：\n\n\
  ```javascript\nlet node = {\n    type: \"Identifier\",\n    name: \"foo\"\n};\n\
  let { type, name } = node;\nconsole.log(type);      // \"Identifier\"\nconsole.log(name);\
  \      // \"foo\"\n```\n\n在这段代码中，`node.type` 的值被存储在名为 `type` 的变量中，`node.name` 的值存储在名为\
  \ `name` 的变量中。这种语法与第 4 章中引入的对象字面量属性初始化器简写相同。标识符 `type` 和 `name` 都是局部变量的声明，也是从 `node`\
  \ 对象上读取值的属性。\n\n### 别忘记初始化器\n\n当你解使用 `var`、`let` 或 `const` 使用解构声明变量时，你必须提供一个初始化器（等号后面的值）。以下代码将由于缺少初始化器而抛出语法错误：\n\
  \n```javascript\n// 语法错误！\nvar { type, name };\n\n// 语法错误！\nlet { type, name };\n\
  \n// 语法错误！\nconst { type, name };\n```\n\n虽然 `const` 始终需要初始化器，即使在你使用非解构变量时，`var`\
  \ 和 `let` 仅在你在使用解构时需要初始化器。\n\n## 解构赋值\n\n你目前为止看到的对象解构示例使用了变量声明。然而，在赋值中使用解构也是可能的。例如，你可能决定在定义后更改变量的值，如下：\n\
  \n```javascript\nlet node = {\n    type: \"Identifier\",\n    name: \"foo\"\n},\n\
  type = \"Literal\",\nname = 5;\n// 使用解构分配不同的值\n({ type, name } = node);\nconsole.log(type);\
  \      // \"Identifier\"\nconsole.log(name);      // \"foo\"\n```\n\n在这个示例中，`type`\
  \ 和 `name` 在声明时初始化了值，然后两个同名的变量被初始化了不同的值。下一行使用解构赋值通过从 `node` 对象读取来更改这些值。注意，你必须在解构赋值语句周围加上括号。这是因为左大括号被预期为块语句，而块语句不能出现在赋值的左侧。括号表示下一个大括号不是块语句，而应该被解释为表达式，从而允许赋值完成。\n\
  \n解构赋值表达式的值为表达式的右侧（`=` 之后）。这意味着你可以在任何需要值的地方使用解构赋值表达式。例如，考虑下面这个示例，它向函数传递了一个值：\n\n\
  ```javascript\nlet node = {\n    type: \"Identifier\",\n    name: \"foo\"\n},\n\
  type = \"Literal\",\nname = 5;\nfunction outputInfo(value) {\n    console.log(value);\n\
  }\noutputInfo({ type, name } = node);\nconsole.log(type);      // \"Identifier\"\
  \nconsole.log(name);      // \"foo\"\n```\n\n`outputInfo` 函数调用的是一个解构赋值表达式。表达式的值为\
  \ `node`，因为那是表达式右侧的值。对 `type` 和 `name` 的赋值表现正常。\n\n**注意**\n\n当解构赋值表达式的右侧（`=`）求值为\
  \ `null` 或 `undefined` 时会报错。这是因为尝试读取 `null` 或 `undefined` 的属性会导致运行时错误。\n\n## 默认值\n\
  \n当你使用解构赋值语句并指定一个对象上不存在的属性局部变量时，该局部变量将被赋值为 `undefined`。例如：\n\n```javascript\nlet\
  \ node = {\n    type: \"Identifier\",\n    name: \"foo\"\n};\nlet { type, name,\
  \ value } = node;\nconsole.log(type);      // \"Identifier\"\nconsole.log(name);\
  \      // \"foo\"\nconsole.log(value);     // undefined\n```\n\n这段代码定义了一个名为 `value`\
  \ 的额外局部变量并尝试给它赋值。然而，`node` 对象上没有对应的 `value` 属性，因此变量被赋值为 `undefined`，正如预期。你可以你可以定义一个在属性不存在时使用的默认值。只需在属性名后插入等号（`=`）并指定默认值，如下：\n\
  \n```javascript\nlet node = {\n    type: \"Identifier\",\n    name: \"foo\"\n};\n\
  let { type, name, value = true } = node;\nconsole.log(type);      // \"Identifier\"\
  \nconsole.log(name);      // \"foo\"\nconsole.log(value);     // true\n```\n\n在这个示例中，变量\
  \ `value` 被赋予了 `true` 作为默认值。只有当该属性在 `node` 上缺失或值为 `undefined` 时，才会使用默认值。由于不存在 `node.value`\
  \ 属性，变量 `value` 使用了默认值。这与第 3 章中讨论的函数默认参数值相似。\n\n#### 赋值给不同的局部变量名\n\n\n\n\n\n到此为止，每个解构赋值示例都使用对象的属性名作为局部变量名；例如，`node.type`\
  \ 的值被存储在 `type` 变量中。当你想要使用相同的名称时，这种方法非常好用，但如果你不想这样做呢？ECMAScript 6 有了一种扩展语法，允许你将值赋给不同名称局部变量，这种语法看起来像对象字面量的非简写属性初始化器语法。这里有一个示例：\n\
  \n```javascript\nlet node = {\n    type: \"Identifier\",\n    name: \"foo\"\n};\n\
  \nlet { type: localType, name: localName } = node;\nconsole.log(localType);    \
  \  // \"Identifier\"\nconsole.log(localName);      // \"foo\"\n```\n\n这段代码使用解构赋值来声明\
  \ `localType` 和 `localName` 变量，这两个变量分别包含了来自 `node.type` 和 `node.name` 属性的值。`type:\
  \ localType` 语法读取名为 `type` 的属性，并将其值存储在 `localType` 变量中。这种语法实际上与传统的对象字面量语法相反，在传统语法中，名称在冒号左侧，值在右侧。而在这种情况下，名称在冒号右侧，而要读取的值的位置在左侧。\n\
  \n当你使用不同的变量名时，也可以添加默认值。等号和默认值仍然放在局部变量名之后。例如：\n\n```javascript\nlet node = {\n  \
  \  type: \"Identifier\"\n};\n\nlet { type: localType, name: localName = \"bar\"\
  \ } = node;\nconsole.log(localType);      // \"Identifier\"\nconsole.log(localName);\
  \      // \"bar\"\n```\n\n在这里，`localName` 变量有一个默认值 `\"bar\"`。由于不存在 `node.name` 属性，该变量被赋予了它的默认值。\n\
  \n到目前为止，你已经学习了如何对属性为原始值的对象使用对象解构。你也可以使用对象解构来获取嵌套对象结构中的值。\n\n## 嵌套对象解构\n\n通过使用与对象字面量类似的语法，你可以进入嵌套对象结构以只检索你想要的信息。这里有一个示例：\n\
  \n```javascript\nlet node = {\n    type: \"Identifier\",\n    name: \"foo\",\n \
  \   loc: {\n        start: {\n            line: 1,\n            column: 1\n    \
  \    },\n        end: {\n            line: 1,\n            column: 4\n        }\n\
  \    }\n};\n\nlet { loc: { start } } = node;\nconsole.log(start.line);   // 1\n\
  console.log(start.column); // 1\n```\n\n此示例中的解构模式使用大括号来指示该模式应该进入名为 `loc` 的属性并寻找\
  \ `start` 属性。回想上一节，解构模式中的冒号意味着冒号之前的标识符是待检查的位置，而右侧进行赋值。冒号后面的大括号表示目标是另一个层级。\n\n你可以更进一步，也为局部变量使用不同的名称：\n\
  \n```javascript\nlet node = {\n    type: \"Identifier\",\n    name: \"foo\",\n \
  \   loc: {\n        start: {\n            line: 1,\n            column: 1\n    \
  \    },\n        end: {\n            line: 1,\n            column: 4\n        }\n\
  \    }\n};\n\nlet { loc: { start: localStart } } = node;\nconsole.log(localStart.line);\
  \   // 1\nconsole.log(localStart.column); // 1\n```\n\n在这个版本的代码中，`node.loc.start`\
  \ 被存储在一个名为 `localStart` 的新变量中。解构模式可以嵌套到任意深度，并且每个层级都可以使用所有功能。\n\n对象解构非常强大，因为它提供了很多选项，但数组解构提供了一些独特的能力，允许你从数组中提取信息。\n\
  \n### 语法陷阱 (Gotcha)\n\n在使用嵌套解构时要小心，因为你可能会无意创建一个没有任何作用的语句。在对象解构中，空大括号是合法的；但它们不起作用。例如：\n\
  \n```javascript\n// 没有声明任何变量！\nlet { loc: {} } = node;\n```\n\n该语句中没有声明任何绑定。由于右侧的大括号，`loc`\
  \ 被用作检查的位置，而不是要创建的绑定。在这种情况下，意图可能是使用 `=` 来定义默认值而不是使用 `:` 来定义位置。这种语法在未来可能会被变为非法的，但目前这是一个需要注意的陷阱。\n\
  \n## 数组解构\n\n数组解构语法与对象解构非常相似：它只是使用了数组字面量语法而不是对象字面量语法。解构作用于数组内的位置，而不是对象中可用的命名属性。例如：\n\
  \n```javascript\nlet colors = [\"red\", \"green\", \"blue\"];\nlet [ firstColor,\
  \ secondColor ] = colors;\nconsole.log(firstColor);  // \"red\"\nconsole.log(secondColor);\
  \ // \"green\"\n```\n\n在这里，数组解构从 `colors` 数组中提取值 `\"red\"` 和 `\"green\"`，并将它们存储在\
  \ `firstColor` 和 `secondColor` 变量中。选择这些值是因为它们在数组中的位置；实际的变量名可以是任何值。任何在解构模式中显式提到的项都会被忽略。\n\
  \n你也可以省略解构模式中的项，只为你感兴趣的项提供变量名。例如，如果你只需要数组的第三个值，不需要为前两个项提供变量名。这种方法如下：\n\n```javascript\n\
  let colors = [\"red\", \"green\", \"blue\"];\nlet [ , , thirdColor ] = colors;\n\
  console.log(thirdColor); // \"blue\"\n```\n\n这段代码使用解构赋值来获取 `colors` 中的第三项。`thirdColor`\
  \ 之前的逗号是数组项的占位符。通过这种方法，你可以轻松从数组的任何位置提取值，而无需提供变量名。\n\n**注意**：类似于对象解构，在使用 `var`、`let`\
  \ 或 `const` 使用数组解构时必须始终提供初始化。\n\n## 解构赋值\n\n你可以在赋值上下文中使用数组解构，但与对象解构不同，不需要将表达式括在括号中。考虑以下示例：\n\
  \n```javascript\nlet colors = [\"red\", \"green\", \"blue\"],\n    firstColor =\
  \ \"black\",\n    secondColor = \"purple\";\n\n[ firstColor, secondColor ] = colors;\n\
  console.log(firstColor); // \"red\"\nconsole.log(secondColor); // \"green\"\n```\n\
  \n这段代码中的解构赋值工作方式与之前的数组解构示例类似。唯一的区别是变量已经定义过。大多数情况下，你现在对解构赋值的了解已经足够了，但还有一些你可能会发现非常有用的信息。数组解构赋值有一个非常独特的用例，可以更容易地交换两个变量的值。值交换是排序算法中的常见操作，而\
  \ ECMAScript 5 交换变量的方法涉及第三个临时变量，如下所示：\n\n```javascript\n// ECMAScript 5 交换变量\nlet\
  \ a = 1,\n    b = 2,\n    tmp;\ntmp = a;\na = b;\nb = tmp;\nconsole.log(a); // 2\n\
  console.log(b); // 1\n```\n\n中间变量 `tmp` 对于交换 `a` 和 `b` 的值是必要的。然而，使用数组解构赋值不需要那个额外的变量。以下是在\
  \ ECMAScript 6 中交换变量的方法：\n\n```javascript\n// ECMAScript 6 交换变量\nlet a = 1,\n  \
  \  b = 2;\n[ a, b ] = [ b, a ];\nconsole.log(a); // 2\nconsole.log(b); // 1\n```\n\
  \n\n\n\n此示例中的数组解构赋值看起来像是一个镜像。赋值语句的左侧（等号之前）是一个解构模式，就像与其他数组解构示例中的模式一样。右侧是一个为了进行交换而临时创建的数组字面量。解构发生在临时数组上，`b`\
  \ 和 `a` 的值被复制到该数组的第一个和第二个位置。其结果是变量交换了值。\n\n**注意**\n\n与对象解构赋值一样，当数组解构赋值表达式的右侧求值结果\
  \ `null` 或 `undefined` 时，会抛出错误。\n\n## 默认值\n\n数组解构赋值也允许你为数组中的任何位置指定默认值。当给定位置的属性不存在或值为\
  \ `undefined` 时，将使用该默认值。例如：\n\n```javascript\nlet colors = [ \"red\" ];\n\nlet [\
  \ firstColor, secondColor = \"green\" ] = colors;\n\nconsole.log(firstColor);  \
  \    // \"red\"\nconsole.log(secondColor);     // \"green\"\n```\n\n在这段代码中，`colors`\
  \ 数组只有一个项，因此 `secondColor` 没有内容可以匹配。由于设置了默认值，`secondColor` 被设为 `\"green\"` 而不是 `undefined`。\n\
  \n## 嵌套数组解构\n\n你可以以解构嵌套对象的方式解构嵌套数组。通过在整体模式中插入另一个数组模式，解构将进入嵌套数组，如下所示：\n\n```javascript\n\
  let colors = [ \"red\", [ \"green\", \"lightgreen\" ], \"blue\" ];\n\n// 随后\n\n\
  let [ firstColor, [ secondColor ] ] = colors;\n\nconsole.log(firstColor);      //\
  \ \"red\"\nconsole.log(secondColor);     // \"green\"\n```\n\n在这里，`secondColor`\
  \ 变量引用 `colors` 数组内部的 `\"green\"` 值。该项包含在第二个数组中，因此在解构模式中 `secondColor` 周围额外的方括号是必要的。与对象一样，你可以任意深度地嵌套数组。\n\
  \n### 剩余项 (Rest Items)\n\n第 3 章 介绍了函数的剩余参数，而数组解构有一个相似的概念，称为剩余项。剩余项使用 `...` 语法将数组中的剩余项赋值给特定的变量。请看下面的示例。\n\
  \n```javascript\nlet colors = [ \"red\", \"green\", \"blue\" ];\n\nlet [ firstColor,\
  \ ...restColors ] = colors;\n\nconsole.log(firstColor);        // \"red\"\nconsole.log(restColors.length);\
  \ // 2\nconsole.log(restColors[0]);      // \"green\"\nconsole.log(restColors[1]);\
  \      // \"blue\"\n```\n\n`colors` 中的第一项被赋值给 `firstColor`，其余项被赋值到一个新的 `restColors`\
  \ 数组。因此，`restColors` 数组有两个项：`\"green\"` 和 `\"blue\"`。剩余项对于从数组中提取某些项并保留其余部分有用，但还有另一个很有用途。\n\
  \nJavaScript 数组一个明显缺失的功能是可以轻松创建克隆。在 ECMAScript 5 中，开发者经常使用 `concat()` 方法作为克隆数组的简单方法。例如：\n\
  \n```javascript\n// 在 ECMAScript 5 中克隆数组\n\nvar colors = [ \"red\", \"green\", \"\
  blue\" ];\n\nvar clonedColors = colors.concat();\n\nconsole.log(clonedColors); \
  \     // \"[red,green,blue]\"\n```\n\n尽管 `concat()` 方法旨在连接两个数组，但在不带参数的情况下调用它会返回数组的克隆。在\
  \ ECMAScript 6 中，你可以使用剩余项通过旨在为此功能的语法来实现相同的任务。它的工作方式如下：\n\n```javascript\n// 在 ECMAScript\
  \ 6 中克隆数组\n\nlet colors = [ \"red\", \"green\", \"blue\" ];\n\nlet [ ...clonedColors\
  \ ] = colors;\n\nconsole.log(clonedColors);      // \"[red,green,blue]\"\n```\n\n\
  在这个示例中，剩余项被用于将值从 `colors` 数组复制到 `clonedColors` 数组中。虽然这种技术是否比使用 `concat()` 方法更能表达开发者的意图取决于主观感受，但它仍然是一个值得关注的方法。\n\
  \n**注意**\n\n剩余项必须是解构数组的最后一个条目，且后面不能紧跟逗号。在剩余项后包含逗号会导致语法错误。\n\n## 混合解构\n\n你可以结合对象解构和数组解构来创建更复杂的表达式。通过这种方式，你能够从任何对象和数组的混合中提取你想要的信息。考虑以下示例。\n\
  \n```javascript\nlet node = {\n    type: \"Identifier\",\n    name: \"foo\",\n \
  \   loc: {\n        start: {\n            line: 1,\n            column: 1\n    \
  \    }\n    }\n};\n\nlet {\n    type,\n    name,\n    loc: {\n        start: { line,\
  \ column }\n    }\n} = node;\n```\n\n## 解构参数\n\n解构还有一个特别的用例是传递函数参数。当一个函数接收大量的可选参数时，一种常见的模式是创建一个选项\
  \ 对象。因为其他数据之间没有优先级顺序，所以使用带有命名属性的 options 是高效的，如下：\n\n```javascript\n// options 上的属性\n\
  \nfunction setCookie(name, value, options) {\n    options = options || {};\n   \
  \ let secure = options.secure,\n    let path = options.path;\n    let domain = options.domain;\n\
  \    let expires = options.expires;\n    // 设置 cookie 的代码\n}\n\n// 第三参数映射到 options\n\
  setCookie(\"type\", \"js\", {\n    secure: true,\n    expires: 60000\n});\n```\n\
  \n解构参数提供了一种替代方案，使函数期望的参数变得更加清晰。解构参数使用对象或数组解构模式来代替命名参数。要看到其实效果，请看上一个示例中 `setCookie()`\
  \ 函数的重写版本：\n\n```javascript\nfunction setCookie(name, value, { secure, path, domain,\
  \ expires }) {\n    // 设置 cookie 的代码\n}\n\nsetCookie(\"type\", \"js\", {\n    secure:\
  \ true,\n    expires: 60000\n});\n```\n\n此函数的行为与上一个示例类似，但第三个参数现在使用解构来提取所需数据。解构参数之外的参数是明确预期的，对于使用\
  \ `setCookie()` 的人来说，额外参数方面提供了哪些选项也是很清晰的。当然，如果第三个参数是必须的，那么它应该包含的值也是一目了然。解构参数也像普通参数一样，如果未传递，它们将被设置为\
  \ `undefined`。\n\n**注意**\n\n解构参数具有你到目前为止在本章中已经学到的所有解构功能。你可以使用默认值、混合对象和数组模式，并使用与你读取的属性不同的变量名。\n\
  \n\n\n\n\n使用解构参数的一个特性是，默认情况下，如果在函数调用时未提供它们，将抛出错误。例如，上一个示例中对 `setCookie()` 函数的以下调用就会报错：\n\
  \n```javascript\n// error!\n\nsetCookie(\"type\", \"js\");\n```\n\n缺失的第三个参数会如预期般求值为\
  \ `undefined`，这会导致错误，因为解构参数只是解构赋值的简写。当调用 `setCookie()` 函数时，JavaScript 引擎实际上执行了以下操作：\n\
  \n```javascript\nfunction setCookie(name, value, options) {\n    let { secure, path,\
  \ domain, expires } = options;\n    // 设置 cookie 的代码\n}\n```\n\n由于当右侧表达式求值为 `null`\
  \ 或 `undefined` 时，解构会抛出错误，因此当未向 `setCookie()` 函数传递第三个参数时也会抛出错误。\n\n如果你希望解构参数是必填的，这种行为并不算麻烦。但如果你希望解构参数是可选的，你可以通过为解构参数提供默认值来规避这种行为，如下所示：\n\
  \n```javascript\nfunction setCookie(name, value, { secure, path, domain, expires\
  \ } = {}) {\n    // 空\n}\n```\n\n此示例为第三个参数提供了一个新对象作为默认值。为解构参数提供默认值意味着如果没有提供 `setCookie()`\
  \ 的第三个参数，`secure`、`path`、`domain` 和 `expires` 都将为 `undefined`，且不会抛出错误。\n\n## 解构参数的默认值\n\
  \n你可以像在解构赋值一样为解构参数指定解构默认值。只需在参数后添加等号并指定默认值即可。例如：\n\n```javascript\nfunction setCookie(name,\
  \ value,\n    {\n        secure = false,\n        path = \"/\",\n        domain\
  \ = \"example.com\",\n        expires = new Date(Date.now() + 360000000)\n    }\
  \ = {}\n) {\n    // 空\n}\n```\n\n这段代码中，解构参数中的每个属性都有一个默认值，因此你可以避免通过检查给定属性是否已被包含来直接使用正确的值。此外，整个解构参数都有一个空对象作为默认值，使得该参数变为可选。这确实让函数声明看起来比通常复杂了一些，但为了确保每个参数都有可用的值，这个代价是值得。\n\
  \n## 总结\n\n解构让 JavaScript 中处理对象和数组变得更加简单。使用熟悉的对象字面量和数组字面量语法，你可以分析数据结构以获取你感兴趣的信息。对象模式允许你从对象中提取数据，数组模式允许你从数组中提取数据。\n\
  \n对象和数组解构都可以为任何求值为 `undefined` 的属性或项目指定默认值，并且当赋值的右侧求值为 `null` 或 `undefined` 时，它们都会抛出错误。你还可以通过对象和数组解构遍历深度嵌套的数据结构，深入到任何任意深度。\n\
  \n解构声明使用 `var`、`let` 或 `const` 来创建变量，并且必须始终有一个初始化器。解构赋值用于替代其他赋值，允许你解构到对象属性和已存在的变量中。\n\
  \n解构参数使用解构语法，使选项对象在用作函数参数时更加透明。你可以与其他命名参数一起列出所有你感兴趣的实际数据。解构参数可以是数组模式、对象模式或两者的混合，你可以使用解构的所有特性。\n\
  \n# 6 符号（符号）及其属性\n\n![image](img/common-01.jpg)\n\nECMAScript 6 引入了作为原始类型的符号（Symbols）。（该语言已经有了五种原始类型：字符串、数字、布尔、null\
  \ 和 undefined。）符号最初作为创建私有对象成员的一种，这是 JavaScript 开发者长期以来需要的。在符号之前，任何带有字符串名称的属性无论名称多晦涩都很容易访问，而私有命名功能是为了让开发者创建非字符串的属性名。这样，检测这些私有名的普通技术就会失效。\n\
  \n私有命名提案最终演变为 ECMAScript 6 符号，本章将教你如何有效地使用符号。虽然符号为属性名添加了非字符串值，但隐私目标已经放弃了。相反，符号属性与其他对象属性分开分类。\n\
  \n## 创建符号\n\n符号在 JavaScript 原始类型中是独特的，因为它们没有字面量形式，不像布尔值的 `true` 或数字的 `42`。你可以使用全局\
  \ `Symbol` 函数创建一个符号，如此示例所示：\n\n```javascript\nlet firstName = Symbol();\nlet person\
  \ = {};\nperson[firstName] = \"Nicholas\";\nconsole.log(person[firstName]);    //\
  \ \"Nicholas\"\n```\n\n在这里，符号 `firstName` 被创建并用于在 `person` 对象上分配一个新属性。当你使用符号分配属性时，每次想访问该属性都必须使用该符号。确保为符号变量适当命名，以便你可以轻松判断该符号代表什么。\n\
  \n**注意**\n\n由于符号是原始值，调用 `new Symbol()` 会抛出错误。你也可以通过 `new Object(yourSymbol)` 创建\
  \ `Symbol` 的实例，但还不清楚这种能力何时有用。`Symbol` 函数还接受一个符号的描述作为可选参数。你不能使用该描述来访问属性，但我建议始终提供描述以便于阅读和调试。例如：\n\
  \n```javascript\nlet firstName = Symbol(\"first name\");\nlet person = {};\nperson[firstName]\
  \ = \"Nicholas\";\n\nconsole.log(\"first name\" in person); // false\nconsole.log(person[firstName]);\
  \      // \"Nicholas\"\nconsole.log(firstName);             // \"Symbol(first name)\"\
  \n```\n\n符号的描述存储在内部的 `[[Description]]` 属性。每当显式或隐式调用符号的 `toString()` 方法时，就会读取该属性。在本示例中，`firstName`\
  \ 符号的 `toString()` 方法由 `console.log()` 隐式调用，因此描述被打印到日志中。否则无法从代码直接访问 `[[Description]]`。\n\
  \n### 识别符号\n\n由于符号是原始值，你可以使用 `typeof` 运算符确定变量是否包含符号。ECMAScript 6 扩展了 `typeof`，当用于符号时会返回\
  \ `\"symbol\"`。例如：\n\n```javascript\nlet symbol = Symbol(\"test symbol\");\nconsole.log(typeof\
  \ symbol); // \"symbol\"\n```\n\n虽然有其他间接方法判断变量是否为符号，但 `typeof` 运算符是最准确的方法。\n\n##\
  \ 使用符号\n\n你可以在任何使用计算属性的地方使用符号。在本章中你已经看到使用括号表示法配合符号，你可以在计算对象字面量属性名以及 `Object.defineProperty()`\
  \ 和 `Object.defineProperties()` 调用中使用符号：\n\n```javascript\nlet firstName = Symbol(\"\
  first name\");\n// 使用计算对象字面量属性\nlet person = {\n    [firstName]: \"Nicholas\"\n\
  };\n\n// 将属性设为只读\nObject.defineProperty(person, firstName, { writable: false });\n\
  \nlet lastName = Symbol(\"last name\");\nObject.defineProperties(person, {\n   \
  \ [lastName]: {\n        value: \"Zakas\",\n        writable: false\n    }\n});\n\
  \nconsole.log(person[firstName]); // \"Nicholas\"\nconsole.log(person[lastName]);\
  \  // \"Zakas\"\n```\n\n\n\n\n此示例首先使用计算对象字面量属性来创建 `firstName` 符号属性。该属性被创建为不可枚举的，这与使用非符号名称创建的计算属性不同。接下来的行将该属性设置为只读。随后，使用\
  \ `Object.defineProperties()` 方法创建了一个只读的 `lastName` 符号属性。再次使用了一次计算对象字面量属性，但这次它是\
  \ `Object.defineProperties()` 调用中第二个参数的一部分。\n\n尽管你可以在任何允许计算属性名的地方使用符号，但你将需要一套系统在不同的代码段之间共享这些符号，以便有效地使用它们。\n\
  \n## 共享符号\n\n有时，你可能希望代码的不同部分共享某些符号。例如，假设你的应用程序中有两种不同类型的对象，它们应该使用同一个符号属性来表示唯一的标识符。在跨文件或大型代码库中跟踪符号可能是困难且容易出错的。由于这些原因，ECMAScript\
  \ 6 提供了一个全局符号注册表，你可以随时访问它。\n\n当你想要创建一个用于共享的符号时，请使用 `Symbol.for()` 方法，而不是调用 `Symbol()`\
  \ 方法。`Symbol.for()` 方法接受一个参数，该参数是你想创建的符号的字符串标识符。该参数也被用作符号的描述，如示例所示：\n\n```javascript\n\
  let uid = Symbol.for(\"uid\");\n\nlet object = {};\n\nobject[uid] = \"12345\";\n\
  \nconsole.log(object[uid]);      // \"12345\"\n\nconsole.log(uid);             \
  \ // \"Symbol(uid)\"\n```\n\n`Symbol.for()` 方法首先搜索全局符号注册表，检查是否存在键为 `\"uid\"` 的符号。如果存在，该方法返回现有符号。如果不存在此类符号，则创建一个新符号并使用指定的键将其注册到全局符号注册表中。然后返回该新符号。\n\
  \n后续使用相同的键调用 `Symbol.for()` 将返回相同的符号，如下：\n\n```javascript\nlet uid = Symbol.for(\"\
  uid\");\n\nlet object = {\n    [uid]: \"12345\"\n};\n\nconsole.log(object[uid]);\
  \      // \"12345\"\nconsole.log(uid);              // \"Symbol(uid)\"\n\nlet uid2\
  \ = Symbol.for(\"uid\");\n\nconsole.log(uid === uid2);      // true\nconsole.log(object[uid2]);\
  \      // \"12345\"\nconsole.log(uid2);              // \"Symbol(uid)\"\n```\n\n\
  在此示例中，`uid` 和 `uid2` 包含相同的符号并可以互相替换。第一次调用 `Symbol.for()` 创建了符号，而第二次调用从全局符号注册表中检索了符号。\n\
  \n共享符号的另一个独特之处是，你可以通过调用 `Symbol.keyFor()` 方法获取全局符号注册表中符号关联的键。例如：\n\n```javascript\n\
  let uid = Symbol.for(\"uid\");\n\nconsole.log(Symbol.keyFor(uid));    // \"uid\"\
  \n\nlet uid2 = Symbol.for(\"uid\");\n\nconsole.log(Symbol.keyFor(uid2));  // \"\
  uid\"\n\nlet uid3 = Symbol(\"uid\");\n\nconsole.log(Symbol.keyFor(uid3));  // undefined\n\
  ```\n\n注意，`uid` 和 `uid2` 都返回键 `\"uid\"`。符号 `uid3` 不在全局符号注册表中存在，因此它没有关联的键，`Symbol.keyFor()`\
  \ 返回 `undefined`。\n\n**注意**\n\n全局符号注册表是一个共享环境，就像全局作用域一样。这意味着你不能对该环境中已经存在或不存在的内容做假设。在使用第三方组件时，请使用符号键的命名空间处理来减少命名冲突的概率。例如，jQuery\
  \ 代码可能会使用 \"jquery.\" 作为所有键（如 \"jquery.element\" 或类似键）的前缀。\n\n## 符号转换\n\n类型转换是 JavaScript\
  \ 的重要部分，语言在将一种数据类型转换为另一种类型的能力方面具有很大的灵活性。然而，符号在类型转换方面非常不灵活，因为其他类型缺乏符号的逻辑等效类型。具体而言，符号不能被转换为字符串或数字，以防止它们被意外用作本应按符号行为的属性。\n\
  \n本章中的示例使用了 `console.log()` 来指示符号的输出，这是可以的，因为 `console.log()` 对符号调用 `String()` 以创建有用的输出。你可以直接使用\
  \ `String()` 获取相同的结果。例如：\n\n```javascript\nlet uid = Symbol.for(\"uid\"),\n    desc\
  \ = String(uid);\n\nconsole.log(desc);              // \"Symbol(uid)\"\n```\n\n\
  `String()` 函数调用 `uid.toString()`，它返回符号的字符串描述。然而，如果你尝试将符号直接与字符串拼接，将抛出错误：\n\n```javascript\n\
  var uid = Symbol.for(\"uid\"),\n    desc = uid + \"\"; // Error\n```\n\n同样，你不能将符号转换为数字。数学操作符应用于符号时会产生错误。例如：\n\
  \n```javascript\nvar uid = Symbol.for(\"uid\"),\n    sum = uid / 1; // Error\n```\n\
  \n## 检索符号属性\n\n`Object.keys()` 和 `Object.getOwnPropertyNames()` 方法可以检索属性名。前者返回可枚举属性名，后者返回所有属性（无论是否可枚举）。然而，这两种方法都不返回符号属性。相反，ECMAScript\
  \ 6 增加了 `Object.getOwnPropertySymbols()` 方法以便你检索符号属性。\n\n`Object.getOwnPropertySymbols()`\
  \ 的返回值是自有符号的数组，如下：\n\n```javascript\nlet uid = Symbol.for(\"uid\");\n\nlet object\
  \ = {\n    [uid]: \"12345\"\n};\n\nlet symbols = Object.getOwnPropertySymbols(object);\n\
  \nconsole.log(symbols.length);      // 1\nconsole.log(symbols[0]);          // \"\
  Symbol(uid)\"\nconsole.log(object[symbols[0]]);  // \"12345\"\n```\n\n在此代码中，`object`\
  \ 有一个名为 `uid` 的符号属性。`Object.getOwnPropertySymbols()` 返回的就是该符号。所有对象初始都有零符号属性，但对象可以从其原型继承符号属性。ECMAScript\
  \ 6 预定义了几个此类属性，它们使用已知符号实现。\n\n## 使用已知符号暴露内部操作\n\n每个已知符号由 `Symbol` 对象上的一个属性表示。这些符号包括：\n\
  \n- `Symbol.hasInstance`: 被 `instanceof` 用于判断对象继承的方法。\n- `Symbol.isConcatSpreadable`:\
  \ 一个布尔值，指示当集合作为参数传递给 `Array.prototype.concat()` 时，是否应该平展开该集合的元素。\n- `Symbol.iterator`:\
  \ 一个返回迭代器的方法。\n- `Symbol.match`: 被 `String.prototype.match()` 用于比较字符串的方法。\n- `Symbol.replace`:\
  \ 被 `String.prototype.replace()` 用于替换字符串的方法。\n- `Symbol.search`: 被 `String.prototype.search()`\
  \ 用于查找字符串的方法。\n\n\n\n\n\n`Symbol.species` 用于创建派生类的构造函数（第 9 章 中介绍）\n\n`Symbol.split`\
  \ `String.prototype.split()` 用于拆分字符串的方法\n\n`Symbol.toPrimitive` 返回对象的原始值表示形式的方法\n\
  \n`Symbol.toStringTag` `Object.prototype.toString()` 用于创建对象描述的字符串\n\n`Symbol.unscopables`\
  \ 一个对象，其属性为不应包含在 `with` 语句中的对象属性名\n\n接下来的章节将讨论一些常用的已知符号（symbols）；其他符号将在书的其余部分中进行讨论，以确保它们出现在正确的语境中。\n\
  \n重写使用已知符号定义的方法会将普通对象转换为异类对象（exotic object），因为某些内部默认行为发生了变化。这并对你的代码产生实际影响；仅仅是规范描述该对象的方式发生了变化。\n\
  \n### Symbol.hasInstance 方法\n\n每个函数都有一个 `Symbol.hasInstance` 方法，它用于确定给定的对象是否是该函数的实例。该方法定义在\
  \ `Function.prototype` 上，因此所有函数都继承了 `instanceof` 属性的默认行为。`Symbol.hasInstance` 属性被定义为不可写（nonwritable）、不可配置（nonconfigurable）以及不可枚举（nonenumerable），以确保它不会被意外重写。\n\
  \n`Symbol.hasInstance` 方法接受一个参数：要检查的值。如果传递的值是该函数的实例，则返回 `true`。要理解 `Symbol.hasInstance`\
  \ 如何工作，请考虑以下内容：\n\n```javascript\nobj instanceof Array;\n```\n\n这段代码等同于以下代码：\n\n\
  ```javascript\nArraySymbol.hasInstance;\n```\n\nECMAScript 6 本质上将 `instanceof` 运算符重新定义为该方法调用的简写语法。现在由于涉及到方法调用，你实际上可以更改\
  \ `instanceof` 的工作方式。\n\n例如，假设你想定义一个声称没有任何对象是其实例的函数。可以通过将 `Symbol.hasInstance` 的返回值硬编码为\
  \ `false` 来实现，例如：\n\n```javascript\nfunction MyObject() {\n    // 空\n}\n\nObject.defineProperty(MyObject,\
  \ Symbol.hasInstance, {\n    value: function(v) {\n        return false;\n    }\n\
  });\n\nlet obj = new MyObject();\nconsole.log(obj instanceof MyObject); // false\n\
  ```\n\n你必须使用 `Object.defineProperty()` 来重写不可写属性，因此此示例使用该方法用新函数重写 `Symbol.hasInstance`\
  \ 方法。新函数始终返回 `false`，因此尽管 `obj` 实际上是 `MyObject` 类的实例，在调用 `Object.defineProperty()`\
  \ 之后，`instanceof` 运算符返回 `false`。\n\n当然，你也可以检查该值并根据任意条件决定它是否应该被视为实例。例如，可能值于 1 到 100\
  \ 之间的数字应该被视为特殊数字类型的实例。为了实现这种行为，你可能会编写如下代码：\n\n```javascript\nfunction SpecialNumber()\
  \ {\n    // 空\n}\n\nObject.defineProperty(SpecialNumber, Symbol.hasInstance, {\n\
  \    value: function(v) {\n        return (v instanceof Number) && (v >=1 && v <=\
  \ 100);\n    }\n});\n\nvar two = new Number(2),\n    zero = new Number(0);\nconsole.log(two\
  \ instanceof SpecialNumber); // true\nconsole.log(zero instanceof SpecialNumber);\
  \ // false\n```\n\n这段代码定义了一个 `Symbol.hasInstance` 方法，如果该值是 `Number` 的实例且值在 1 到 100\
  \ 之间，则返回 `true`。因此，`SpecialNumber` 将声称 `two` 为实例，尽管 `SpecialNumber` 函数与 `two` 变量之间没有直接定义的关系。注意，`instanceof`\
  \ 的左操作数必须是一个对象才能触发 `Symbol.hasInstance` 的调用，因为非对象会导致 `instanceof` 始终简单返回 `false`。\n\
  \n**注意**\n\n你也可以重写所有内置函数的默认 `Symbol.hasInstance` 属性，例如 `Date` 和 `Error` 函数。然而，不建议这样做，因为这对你代码的影响可能是意料之外且令人困惑的。最好仅在你自己的函数上并在必要时重写\
  \ `Symbol.hasInstance`。\n\n### Symbol.isConcatSpreadable 属性\n\nJavaScript 数组的 `concat()`\
  \ 方法旨在将两个数组合并。以下是使用该方法的方法：\n\n```javascript\nlet colors1 = [ \"red\", \"green\"\
  \ ],\n    colors2 = colors1.concat([ \"blue\", \"black\" ]);\nconsole.log(colors2.length);\
  \ // 4\nconsole.log(colors2); // [\"red\",\"green\",\"blue\",\"black\"]\n```\n\n\
  这段代码将一个新数组添加到 `colors1` 的末尾并创建 `colors2`，这是一个包含两个数组所有元素的单个数组。然而，`concat()` 方法也可以接受非数组参数；在这种情况下，这些参数会被简单地添加到数组的末尾。例如：\n\
  \n```javascript\nlet colors1 = [ \"red\", \"green\" ],\n    colors2 = colors1.concat([\
  \ \"blue\", \"black\" ], \"brown\");\n\nconsole.log(colors2.length); // 5\nconsole.log(colors2);\
  \ // [\"red\",\"green\",\"blue\",\"black\"]\n```\n\n在这里，额外的参数 `\"brown\"` 被传递给 `concat()`\
  \ 并成为 `colors2` 中的第五项。为什么数组参数的对待方式与字符串参数不同？JavaScript 规范规定数组会被自动拆分为单独的项目。在 ECMAScript\
  \ 6 之前，没有方法可以调整这种行为。\n\n`Symbol.isConcatSpreadable` 属性是一个布尔值，指示对象具有 `length` 属性和数字键，并且其属性值应被单独添加。你可以定义任何类型像数组一样工作，如下：\n\
  \n```javascript\nlet collection = {\n    0: \"Hello\",\n    1: \"world\",\n    length:\
  \ 2,\n    [Symbol.isConcatSpreadable]: true\n};\n\nlet messages = [ \"Hi\" ].concat(collection);\n\
  console.log(messages.length); // 3\nconsole.log(messages); // [\"hi\",\"Hello\"\
  ,\"world\"]\n```\n\n**注意**\n\n你也可以在派生数组类上将 `Symbol.isConcatSpreadable` 设置为 `false`，以防止项目被\
  \ `concat()` 调用分离。请参见第 178 页的“使用派生类的继承”。\n\n### Symbol.match, Symbol.replace, Symbol.search\
  \ 和 Symbol.split 属性\n\n字符串和正则表达式在 JavaScript 中一直保持着紧密的关系。特别是字符串类型，有几个方法接受正则表达式作为参数：\n\
  \n`match(regex)` 确定给定字符串是否匹配正则表达式\n\n`replace(regex, replacement)` 用替换内容替换正则表达式匹配项\n\
  \n`search(regex)` 在字符串内部查找正则表达式匹配项\n\n`split(regex)` 在正则表达式匹配处拆分字符串\n\n在 ECMAScript\
  \ 6 之前，这些方法与正则表达式的交互方式对开发者是隐藏的，导致无法使用用户定义的对象来模拟正则表达式。ECMAScript 6 定义了对应这四个方法的四个符号，从而将原生行为外包给内置的\
  \ `RegExp` 对象。\n\n\n\n\n\n`Symbol.match`, `Symbol.replace`, `Symbol.search` 和 `Symbol.split`\
  \ 符号分别代表正则表达式参数上的方法，这些方法本应分别在 `match()` 方法、`replace()` 方法、`search()` 方法和 `split()`\
  \ 方法的第一个参数上调用。这四个符号属性定义在 `RegExp.prototype` 上，作为字符串方法应该使用的默认实现。\n\n了解此点后，你可以创建一个对象，并以类似于正则表达式的方式在字符串方法中使用它。要做到这一点，你可以在代码中使用以下符号函数：\n\
  \n- `Symbol.match`: 接受一个字符串参数并返回一个匹配项数组；如果未找到匹配项，则返回 `null`。\n- `Symbol.replace`:\
  \ 接受一个字符串参数和一个替换字符串，并返回一个字符串。\n- `Symbol.search`: 接受一个字符串参数并返回匹配的数字索引；如果未找到匹配项，则返回\
  \ -1。\n- `Symbol.split`: 接受一个字符串参数并返回一个包含根据匹配项分割的字符串片段的数组。\n\n在对象上定义这些属性的能力允许你创建不使用正则表达式实现模式匹配的对象，并将这些对象用在期望正则表达式的方法中。这里有一个展示这些符号作用的示例：\n\
  \n```javascript\n// Effectively 等同于 /^.{10}$/\n\nlet hasLengthOf10 = {\n    [Symbol.match]:\
  \ function(value) {\n        return value.length === 10 ? [value.substring(0, 10)]\
  \ : null;\n    },\n    [Symbol.replace]: function(value, replacement) {\n      \
  \  return value.length === 10 ? replacement + value.substring(10) : value;\n   \
  \ },\n    [Symbol.search]: function(value) {\n        return value.length === 10\
  \ ? 0 : -1;\n    },\n    [Symbol.split]: function(value) {\n        return value.length\
  \ === 10 ? [\"\", \"\"] : [value];\n    }\n};\n\nlet message1 = \"Hello world\"\
  ,   // 11 字符\n    message2 = \"Hello John\";     // 10 字符\n\nlet match1 = message1.match(hasLengthOf10),\n\
  \    match2 = message2.match(hasLengthOf10);\n\nconsole.log(match1);           \
  \    // null\nconsole.log(match2);               // [\"Hello John\"]\n\nlet replace1\
  \ = message1.replace(hasLengthOf10),\n    replace2 = message2.replace(hasLengthOf10);\n\
  \nconsole.log(replace1);             // \"Hello world\"\nconsole.log(replace2);\
  \             // \"Hello John\"\n\nlet search1 = message1.search(hasLengthOf10),\n\
  \    search2 = message2.search(hasLengthOf10);\n\nconsole.log(search1);        \
  \       // -1\nconsole.log(search2);               // 0\n\nlet split1 = message1.split(hasLengthOf10),\n\
  \    split2 = message2.split(hasLengthOf10);\n\nconsole.log(split1);           \
  \    // [\"Hello world\"]\nconsole.log(split2);               // [\"\", \"\"]\n\
  ```\n\n`hasLengthOf10` 对象旨在像正则表达式一样工作，当字符串长度恰好为 10 时进行匹配。`hasLengthOf10` 上的四个方法每个都是使用相应的符号实现的，然后调用了两个字符串上的对应方法。第一个字符串\
  \ `message1` 具有 11 个字符，不会匹配；第二个字符串 `message2` 具有 10 个字符，将会匹配。尽管不是正则表达式，但由于额外的方法，`hasLengthOf10`\
  \ 被传递给每个字符串方法并被正确使用。\n\n尽管这是一个简单的示例，但执行比目前正则表达式能实现的更复杂匹配的能力，为自定义模式匹配器开启了许多可能性。\n\
  \n## `Symbol.toPrimitive` 方法\n\n当你应用某些操作时，JavaScript 经常尝试隐式将对象转换为原始值。例如，当你使用双等号\
  \ (`==`) 运算符比较字符串和对象时，该对象在比较之前会被转换为原始值。具体应该使用哪种原始值之前是一个内部操作，但 ECMAScript 6 通过 `Symbol.toPrimitive`\
  \ 暴露了该值（使其可以更改）。\n\n`Symbol.toPrimitive` 方法在你应用某些操作时使用，并规定了当对象转换为原始值时应该发生什么。\n\n\
  `Symbol.toPrimitive` 定义在 `prototype` 上，并规定了当它转换为原始值时应该发生什么。`hint` 参数是三个值之一：\"string\"\
  、number\" 或 \"default\"。\n\n对于大多数对象，`hint` 参数具有以下行为：\n1. 如果传递 \"string\"，则调用 `toString()`\
  \ 方法。\n2. 如果传递 \"number\"，则调用 `valueOf()` 方法。\n3. 如果传递 \"default\"，则调用 `valueOf()`\
  \ 方法。\n\n同样，对于某些对象，`hint` 参数具有以下优先级：\n1. 如果传递 \"string\"，则调用 `toString()` 方法。\n\
  2. 如果传递 \"number\"，则调用 `toString()` 方法。\n3. 如果传递 \"default\"，则调用 `toString()` 方法。\n\
  \n在许多情况下，默认模式等于数字模式（`Date` 除外，它将默认模式视为字符串）。要覆盖这些默认行为，请使用 `Symbol.toPrimitive` 并分配一个函数。将默认模式设置为与字符串或数字相同更为常见。\n\
  \n```javascript\nfunction Temperature(degrees) {\n    this.degrees = degrees;\n\
  }\n\nTemperature.prototype[Symbol.toPrimitive] = function(hint) {\n    switch (hint)\
  \ {\n        case \"string\":\n            return this.degrees + \"\\u00b0\";\n\
  \        case \"number\":\n            return this.degrees;\n        case \"default\"\
  :\n            return this.degrees + \" degrees\";\n    }\n};\n\nvar freezing =\
  \ new Temperature(32);\n\nconsole.log(freezing + \"!\"); // \"32 degrees!\"\nconsole.log(freezing\
  \ / 2); // 16\nconsole.log(String(freezing)); // \"32°\"\n```\n\n## `Symbol.toStringTag`\
  \ 属性\n\nJavaScript 中有趣的问题之一是多个全局执行环境的存在。这发生在 Web 浏览器中的页面包含 iframe 时，因为页面和 iframe\
  \ 都有自己的执行环境。在大多数情况下，这不是问题，因为数据可以在环境之间来回传递而无需担心。当你尝试在对象在不同对象传递之后识别你正在处理的对象类型时，问题就会出现。\n\
  \n\n\n\n\n该问题的典型示例是从 iframe 将数组传递到包含该 iframe 的页面，或者反之。在 ECMAScript 6 术语中，iframe\
  \ 和包含它的页面分别代表一个不同的 `realm`（领域），即 JavaScript 的执行环境。每个 realm 都有自己的全局作用域，并拥有一份全局对象的副本。无论数组在哪个\
  \ realm 中创建，它都一定是一个数组。然而，当它被传递到另一个 realm 时，`instanceof Array` 调用会返回 `false`，因为该数组是使用另一个\
  \ realm 的构造函数创建的，而 `Array` 代表的是当前 realm 中的构造函数。\n\n### 识别问题的临时解决方案\n\n面对识别数组的问题，开发者们很快发现了一个很好的方法。他们发现，通过调用对象的标准\
  \ `toString()` 方法，总是返回一个可预测的字符串。因此，许多 JavaScript 库开始包含类似这样的函数：\n\n```javascript\n\
  function isArray(value) {\n    return Object.prototype.toString.call(value) ===\
  \ \"[object Array]\";\n}\n\nconsole.log(isArray([]));   // true\n```\n\n虽然这个解决方案看起来有点迂回，但它在所有浏览器中识别数组方面都运行良好。在数组上使用\
  \ `toString()` 方法对于识别对象没有帮助，因为它返回的是对象所包含项的字符串表示。但在 `Object.prototype` 上使用 `toString()`\
  \ 方法有一个特殊之处：它在返回结果中包含了一个内部定义的名为 `[[Class]]` 的名称。开发者可以使用这种方法于对象，以获取 JavaScript 环境认为该对象的数据类型是什么。\n\
  \n开发者们很快意识到，由于没有办法改变这种行为，因此可以使用相同的方法来区分原生对象和开发者创建的对象。最重要的案例是 ECMAScript 5 的 JSON\
  \ 对象。\n\n在 ECMAScript 5 之前，许多开发者使用 Douglas Crockford 的 `json2.js`，它会创建一个全局 `JSON`\
  \ 对象。随着浏览器开始实现 `JSON` 全局对象，确定全局 `JSON` 是由 JavaScript 环境提供的还是通过其他库提供的就变得必要的。通过使用我向你们展示的\
  \ `isArray()` 函数时相同的技术，许多开发者创建了类似这样的函数：\n\n```javascript\nfunction supportsNativeJSON()\
  \ {\n    return typeof JSON !== \"undefined\" &&\n           Object.prototype.toString.call(JSON)\
  \ === \"[object JSON]\";\n}\n```\n\n`Object.prototype` 允许开发者跨 iframe 边界识别数组的相同特性，也提供判断\
  \ `JSON` 是否为原生 JSON 对象的方法。非原生 JSON 对象将返回 `[object Object]`，而原生版本返回 `[object JSON]`。这种方法变成了识别原生对象的默认标准。\n\
  \n### 在 ECMAScript 6 中定义对象字符串标签\n\nECMAScript 6 通过 `Symbol.toStringTag` 符号定义了原生对象通过\
  \ `Object.prototype.toString()` 揭示其身份的倾向。该符号代表每个对象上的一个属性，该属性定义了当对该对象调用 `Object.prototype.toString.call()`\
  \ 时应该产生什么值。对于数组，该函数返回的值通过在 `Symbol.toStringTag` 属性中存储 \"Array\" 来解释。\n\n同样，你也可以为自己的对象定义\
  \ `Symbol.toStringTag` 值：\n\n```javascript\nfunction Person(name) {\n    this.name\
  \ = name;\n}\n\nPerson.prototype[Symbol.toStringTag] = \"Person\";\n\nvar me = new\
  \ Person(\"Nicholas\");\n\nconsole.log(me.toString());                       //\
  \ \"[object Person]\"\nconsole.log(Object.prototype.toString.call(me));   // \"\
  [object Person]\"\n```\n\n在这里，在 `Person.prototype` 上定义了 `Symbol.toStringTag` 属性，为创建字符串表示提供默认行为。由于\
  \ `Person.prototype` 继承了 `Object.prototype.toString()` 方法，当调用 `me.toString()` 方法时，`Symbol.toStringTag`\
  \ 返回的值也会被使用。然而，你仍然可以定义自己的 `toString()` 方法来提供不同的行为，而不影响 `Object.prototype.toString.call()`\
  \ 方法的使用。它看起来可能如下：\n\n```javascript\nfunction Person(name) {\n    this.name = name;\n\
  }\n\nPerson.prototype[Symbol.toStringTag] = \"Person\";\n\nPerson.prototype.toString\
  \ = function() {\n    return this.name;\n};\n\nvar me = new Person(\"Nicholas\"\
  );\n\nconsole.log(me.toString());                       // \"Nicholas\"\nconsole.log(Object.prototype.toString.call(me));\
  \   // \"[object Person]\"\n```\n\n这段代码定义了 `Person.prototype.toString()` 返回 `name`\
  \ 属性的值。由于 `Person` 实例不再继承 `Object.prototype.toString()` 方法，调用 `me.toString()` 会表现出不同的行为。\n\
  \n**注意**\n\n除非另有指定，所有对象都从 `Object.prototype` 继承 `Symbol.toStringTag`。字符串 \"Object\"\
  \ 是默认的属性值。\n\n对于开发者定义的对象，在 `Symbol.toStringTag` 上可以使用哪些值没有限制。例如，没有任何事情阻止你使用 \"Array\"\
  \ 作为 `Symbol.toStringTag` 属性的值，如下：\n\n```javascript\nfunction Person(name) {\n \
  \   this.name = name;\n}\n\nPerson.prototype[Symbol.toStringTag] = \"Array\";\n\n\
  Person.prototype.toString = function() {\n    return this.name;\n};\n\nvar me =\
  \ new Person(\"Nicholas\");\n\nconsole.log(me.toString());                     \
  \  // \"Nicholas\"\nconsole.log(Object.prototype.toString.call(me));   // \"[object\
  \ Array]\"\n```\n\n调用 `Object.prototype.toString()` 的结果是 \"[object Array]\"。这突显了\
  \ `Object.prototype.toString()` 不再是完全可靠的对象识别方法。\n\n更改原生对象的字符串标签也是可能的。只需在对象的原型上为\
  \ `Symbol.toStringTag` 赋值：\n\n```javascript\nArray.prototype[Symbol.toStringTag]\
  \ = \"Magic\";\n\nvar values = [];\nconsole.log(Object.prototype.toString.call(values));\
  \ // \"[object Magic]\"\n```\n\n在这个示例中，数组的 `Symbol.toStringTag` 被重写了。尽管我建议不要这样修改内置对象，但语言中并没有禁止这样做。\n\
  \n#### unscopables 属性\n\n`with` 语句是 JavaScript 中最具争议的部分之一。`with` 语句最初是为了避免重复输入，但因为它使代码难以理解、影响性能且容易出错而受到广泛批评。因此，严格模式下不允许使用\
  \ `with` 语句；该限制也影响了类和模块，它们默认都是严格模式且没有退出条件。\n\n尽管未来的代码无疑不会使用 `with` 语句，但 ECMAScript\
  \ 6 为了后兼容在非严格模式下支持 `with`，因此必须找到让使用 `with` 的代码继续正常工作的方法。\n\n为了理解这项的复杂性，请考虑以下代码：\n\
  \n```javascript\nvar values = [1, 2, 3],\ncolors = [\"red\", \"green\", \"blue\"\
  ],\ncolor = \"black\";\n\nwith(colors) {\n    push(color);\n    push(...values);\n\
  }\n\nconsole.log(colors); // [\"red\", \"green\", \"blue\", \"black\", 1, 2, 3]\n\
  ```\n\n在这个示例中，`with` 语句内部的两次 `push()` 调用等同于 `colors.push()`，因为 `with` 语句将 `push`\
  \ 添加为本地绑定。`color` 引用指向在外部创建的变量，`values` 引用也是如此。\n\n但 ECMAScript 6 为数组添加了 `values`\
  \ 方法。（`values()` 方法将在第 8 章详细讨论）。因此，在 ECMAScript 6 环境中，`with` 语句内部的 `values` 引用将不再指向局部变量\
  \ `values`，而是数组的 `values` 方法，这将破坏代码。这就是为什么存在 `Symbol.unscopables` 符号。\n\n\n\n\n\n\
  `Symbol.unscopables` 符号用于 `Array.prototype` 上，用于指示哪些属性在 `with` 语句内部不创建绑定。当存在时，`Symbol.unscopables`\
  \ 是一个对象，其键是需要从 `with` 语句绑定中省略的标识符，其值为 `true` 以强制执行块级限制。以下是数组的默认 `Symbol.unscopables`\
  \ 属性：\n\n```javascript\n// built into ECMAScript 6 by default\nArray.prototype[Symbol.unscopables]\
  \ = Object.assign(Object.create(null), {\n    copyWithin: true,\n    entries: true,\n\
  \    fill: true,\n    find: true,\n    findIndex: true,\n    keys: true,\n    values:\
  \ true\n});\n```\n\n`Symbol.unscopables` 对象具有空原型（通过 `Object.create(null)` 调用创建），并包含了\
  \ ECMAScript 6 中的所有新数组方法。（这些方法已在 第 8 章 和 第 10 章 中详细介绍。）这些方法的绑定不会在 `with` 语句内部创建，从而允许旧代码在没有任何问题的情况下继续工作。\n\
  \n通常情况下，除非你使用了 `with` 语句并且正在对代码库中的现有对象进行更改，否则你不需要为对象定义 `Symbol.unscopables`。\n\n\
  ## 总结\n\n符号（Symbols）是 JavaScript 中一种新的原始类型，用于创建不可枚举属性，这些属性在不引用符号的情况下无法访问。虽然它们不是真正的私有，但这些属性更难被意外更改或覆盖，因此适用于需要对开发者提供某种程度保护的功能。\n\
  \n你可以为符号提供描述信息，以便更容易地识别符号值。全局符号注册表（global symbol registry）允许你通过相同的描述在代码的不同部分使用共享符号。因此，同一个符号可以在多个地方用于同一个原因。\n\
  \n诸如 `Object.keys()` 或 `Object.getOwnPropertyNames()` 等方法不会返回符号，因此 ECMAScript 6\
  \ 增加了一个名为 `Object.getOwnPropertySymbols()` 的新方法，允许你检索符号属性。你仍然可以通过调用 `Object.defineProperty()`\
  \ 和 `Object.defineProperties()` 方法来对符号属性进行更改。\n\n已知符号（Well-known symbols）为标准对象定义了之前仅内部的功能，并使用了全局符号符号常量，例如\
  \ `Symbol.hasInstance` 属性。这些符号在规范中使用 `Symbol.` 前缀，并允许开发者以多种方式修改标准对象的行为。\n\n## 7\
  \ 集合与映射（SETS AND MAPS）\n\n![image](img/common-01.jpg)\n\n在历史的大部分时间里，JavaScript 只有一种集合类型，由\
  \ `Array` 类型表示。（尽管某些开发者可能认为所有非数组对象都是键值对的集合，但它们最初的设计意图与数组非常不同。）JavaScript 中的数组用法与其他语言中的数组完全一样，但在\
  \ ECMAScript 6 之前，由于缺乏其他集合选项，意味着数组经常被用作队列和栈。由于数组只使用数字索引，每当需要非数字索引时，开发者会使用非数组对象。这种技术导致了使用非数组对象对集合（sets）和映射（maps）的自定义实现。\n\
  \n*集合（set）*是一个不包含重复值的列表。你通常不会像访问数组元素那样访问集合中的单个项目；相反，更常见的做法只是检查集合以查看某个值是否存在。*映射（map）*是一个对应于特定值的键集合。映射中的每个项目都存储两部分数据，并通过指定要读取的键来检索值。映射经常被用作缓存，存储稍后快速检索的数据。尽管\
  \ ECMAScript 5 没有正式的集合和映射，开发者也使用非数组对象绕过了这一局限性。\n\nECMAScript 6 为 JavaScript 增加了集合和映射，本章将讨论你关于这两种集合类型所需的所有知识。首先，我将讨论开发者在\
  \ ECMAScript 6 之前用于实现集合和映射的替代方案，以及为什么这些实现存在问题。然后我将介绍集合和映射在 ECMAScript 6 中是如何工作的。\n\
  \n### ECMAScript 5 中的集合与映射\n\n在 ECMAScript 5 中，开发者通过对象属性模拟集合和映射，如下：\n\n```javascript\n\
  var set = Object.create(null);\nset.foo = true;\n\n// 检查是否存在\nif (set.foo) {\n \
  \   // 执行代码\n}\n```\n\n示例中的 `set` 变量是一个具有空原型的对象，确保对象上没有继承属性。使用对象属性作为要检查的唯一值是 ECMAScript\
  \ 5 中的常用方法。当向 `set` 对象添加属性时，会将其设置为 `true`，这样条件语句（例如示例中的 `if` 语句）就可以轻松地检查该值是否存在。\n\
  \n作为集合的对象和作为映射的对象之间唯一的真实区别在于存储的值。例如，这个示例使用对象作为映射：\n\n```javascript\nvar map = Object.create(null);\n\
  map.foo = \"bar\";\n\n// 检索值\nvar value = map.foo;\nconsole.log(value); // \"bar\"\
  \n```\n\n这段代码在键 `foo` 下存储了一个字符串值 `\"bar\"`。与集合不同，映射主要用于检索信息，而不仅仅是检查键是否存在。\n\n###\
  \ 替代方案的问题\n\n在简单情况下，使用对象作为集合和映射还可以良好，但当你遇到对象属性的局限性时，这种方法可能会变得复杂。例如，由于所有对象属性必须是字符串，你必须确保两个键不是相同的。考虑以下情况：\n\
  \n```javascript\nvar map = Object.create(null);\nmap[5] = \"foo\";\nconsole.log(map[\"\
  5\"]); // \"foo\"\n```\n\n此示例将字符串值 `\"foo\"` 分配给数字键 `5`。内部，该数字值被转换为字符串，因此 `map[\"\
  5\"]` 和 `map[5]` 引用同一个属性。当你使用对象作为键时，会出现另一个问题，如下：\n\n```javascript\nvar map = Object.create(null),\n\
  key1 = {},\nkey2 = {};\n\nmap[key1] = \"foo\";\nconsole.log(map[key2]); // \"foo\"\
  \n```\n\n在这里，`map[key2]` 和 `map[key1]` 引用相同的值。因为对象属性必须是字符串，`key1` 和 `key2` 被转换。由于\
  \ `[object Object]` 是对象的默认字符串表示，`key1` 和 `key2` 都转换为该字符串。这会导致明显的错误，因为逻辑上假设不同的对象键应该是不同的。\n\
  \n转换为默认字符串表示使得将对象作为键变得困难。\n\n值为假（falsy）的键映射具有其特有的问题。在需要布尔值的情况下（例如在 `if` 语句的条件中），假值会自动转换为\
  \ `false`。只要你在使用值时足够小心，这种转换本身并不是问题。例如，看这段代码：\n\n```javascript\nvar map = Object.create(null);\n\
  map.count = 1;\n\n// 是检查 \"count\" 是否存在还是检查非零值？\nif (map.count) {\n    // 执行代码\n\
  }\n```\n\n这个示例关于如何使用 `map.count` 存在歧义。`if` 语句是为了检查 `map.count` 是否存在还是检查其值是否非零？在这种情况下，`if`\
  \ 语句内部的代码将执行，因为值 `1` 是真值。然而，如果 `map.count` 为 `0` 或 `map.count` 不存在，则 `if` 语句内部的代码将不会执行。\n\
  \n这些问题在大型应用程序中出现时很难识别和调试，这正是 ECMAScript 6 为该语言增加集合和映射的主要原因。\n\n**注意**\n\n\n\n\n\
  JavaScript 拥有 `in` 运算符，当属性存在于对象时，它返回 true，而无需读取对象的值。然而，`in` 运算符还会搜索对象的原型，这使得它只有在对象具有空原型时使用才是安全的。尽管如此，许多开发者仍然错误地使用像示例中的代码，而不是使用\
  \ `in`。\n\n# ECMAScript 6 中的 Sets\n\nECMAScript 6 增加了一个 `Set` 类型，它是一个没有重复值的有序列表。Sets\
  \ 允许快速访问其包含的数据，提供了一种更高效的跟踪离散值的方法。\n\n## 创建 Sets 和添加项\n\n使用 `new Set()` 创建集合，并通过调用\
  \ `add()` 方法向集合中添加项。你可以通过检查 `size` 属性来查看集合中有多少项：\n\n```javascript\nlet set = new\
  \ Set();\nset.add(5);\nset.add(\"5\");\nconsole.log(set.size);    // 2\n```\n\n\
  Sets 不会对值进行强制转换来判断它们是否相同。这意味着一个集合可以包含数字 `5` 和字符串 `\"5\"` 这两个独立项。（在内部，比较使用了第 4 章中讨论的\
  \ `Object.is()` 方法来确定两个值是否相同。）你也可以向集合添加多个对象，这些对象将保持独立性：\n\n```javascript\nlet set\
  \ = new Set(),\n    key1 = {},\n    key2 = {};\nset.add(key1);\nset.add(key2);\n\
  console.log(set.size);    // 2\n```\n\n由于 `key1` 和 `key2` 没有被转换为字符串，它们在集合中被视为两个唯一项。如果它们被转换为字符串，那么它们将都等于\
  \ `\"[object Object]\"`。\n\n如果多次使用相同的值调用 `add()` 方法，则第一次之后的所有调用都会实际上被忽略：\n\n```javascript\n\
  let set = new Set();\nset.add(5);\nset.add(\"5\");\nset.add(5);      // duplicate\
  \ - 此项被忽略\nconsole.log(set.size);    // 2\n```\n\n当 `console.log()` 输出 `set` 的大一时，它显示\
  \ 2，因为第二个 `5` 没有被添加。你也可以使用数组来初始化集合，`Set` 构造函数将确保只使用唯一值。例如：\n\n```javascript\nlet\
  \ set = new Set([1, 2, 3, 4, 5, 5, 5, 5]);\nconsole.log(set.size);    // 5\n```\n\
  \n在这个示例中，使用了一个带有重复值的数组来初始化集合。数字 `5` 在集合中只出现一次，尽管它在数组中出现了四次。此功能使得将现有代码或 JSON 结构转换为\
  \ sets 变得简单。\n\n**注意**\n\n`Set` 构造函数实际上接受任何迭代对象作为参数。数组之所以有效是因为它们默认是迭代的，sets 和 maps\
  \ 也是。`Set` 构造函数使用迭代器从参数中提取值。可迭代对象和迭代器在第 8 章中详细讨论。\n\n你可以使用 `has()` 方法来测试哪些值在集合中，如下：\n\
  \n```javascript\nlet set = new Set();\nset.add(5);\nset.add(\"5\");\nconsole.log(set.has(5));\
  \    // true\nconsole.log(set.has(6));    // false\n```\n\n这里，`set.has(6)` 返回 false\
  \ 是因为集合中没有该值。\n\n## 删除项\n\n从集合中删除项也是可能的。你可以使用 `delete()` 方法删除单个项，也可以通过调用 `clear()`\
  \ 方法从集合删除所有项。这段代码展示了两种操作：\n\n```javascript\nlet set = new Set();\nset.add(5);\n\
  set.add(\"5\");\nconsole.log(set.has(5));    // true\nset.delete(5);\nconsole.log(set.has(5));\
  \    // false\nconsole.log(set.size);      // 1\nset.clear();\nconsole.log(set.has(\"\
  5\"));  // false\nconsole.log(set.size);      // 0\n```\n\n调用 `delete()` 后，只有 5\
  \ 消失了；在执行 `clear()` 方法后，`set` 是空的。\n\nSets 是跟踪唯一有序值的非常简单的机制。然而，如果你想向集合添加项，然后对每个项执行某种操作呢？这就是\
  \ `forEach()` 方法大显用场的地方。\n\n## Sets 的 forEach() 方法\n\n如果你习惯处理数组，可能已经熟悉 `forEach()`\
  \ 方法。ECMAScript 5 为数组增加了 `forEach()`，以简化对数组中每个项进行的操作，而无需设置 `for` 循环。该方法在开发者中非常受欢迎，因此相同的方法在\
  \ sets 上也可用且工作方式相同。\n\n`forEach()` 方法传递一个接受三个参数的回调函数：\n\n-   集合中下一个位置的值\n-   与第一个参数相同的值\n\
  -   读取该值的集合\n\nsets 版本的 `forEach()` 与数组版本之间奇怪的之处在于，回调函数的第一个和第二个参数是相同的。\n\n\n\n\n\
  在这里，集合最初加载了一个包含重复项的数组。集合会移除这些重复项，然后使用扩展运算符将项放入一个新的数组中。该集合仍然包含它创建时接收到的相同项（1, 2, 3,\
  \ 4 和 5）。它们只是被复制到了新数组中。\n\n当你已经有一个数组并想要创建一个没有重复项的数组时，这种方法非常有用，如下：\n\n```javascript\n\
  function eliminateDuplicates(items) {\n    return [...new Set(items)];\n}\n\nlet\
  \ numbers = [1, 2, 3, 3, 3, 4, 5],\n    noDuplicates = eliminateDuplicates(numbers);\n\
  console.log(noDuplicates);      // [1,2,3,4,5]\n```\n\n在 `eliminateDuplicates()`\
  \ 函数中，`set` 只是一个临时中间变量，用于在创建没有重复项的新数组之前过滤掉重复值。\n\n### 弱集合 (Weak Sets)\n\n由于存储对象引用的方式，`Set`\
  \ 类型可以被称为“强引用集合”。在 `Set` 实例中存储对象实际上与将该对象存储在变量内部相同。只要该 `Set` 实例的引用存在，该对象就不会被垃圾回收以释放内存。例如：\n\
  \n```javascript\nlet set = new Set(),\n    key = {};\n\nset.add(key);\nconsole.log(set.size);\
  \      // 1\n\n// 移除原始引用\nkey = null;\nconsole.log(set.size);      // 1\n\n// 取回原始引用\n\
  key = [...set][0];\n```\n\n在这个示例中，将 `key` 设置为 `null` 清除了了 `key` 对象的一个引用，但另一个引用仍然留在\
  \ `set` 内部。你仍然可以通过使用扩展运算符将集合转换为数组并访问第一个项来检索 `key`。该结果对于大多数程序来说运行良好，但有时情况下，当所有其他引用都消失时，集合中的引用也随之消失是最好的。例如，如果你的\
  \ JavaScript 代码运行在网页中，并且需要跟踪可能被另一个脚本删除的 DOM 元素，你不希望你的代码持有对 DOM 元素的最后一个引用。（这种情况被称为\
  \ `memory leak`。）\n\n为了解决此类问题，ECMAScript 6 还包含了 `weak sets`（弱集合），它只存储弱对象的引用，且不能存储原始值。如果一个对象的`弱引用`是仅剩余引用，它不会阻止垃圾回收。\n\
  \n#### 创建弱集合\n\n弱集合使用 `WeakSet` 构造函数创建，并拥有 `add()` 方法、`has()` 方法和 `delete()` 方法。这里有一个使用了这三个方法的示例：\n\
  \n```javascript\nlet set = new WeakSet(),\n    key = {};\n\n// 将对象添加到集合中\nset.add(key);\n\
  console.log(set.has(key));      // true\n\nset.delete(key);\nconsole.log(set.has(key));\
  \      // false\n```\n\n使用弱集合与使用普通集合非常相似。你可以在弱集合中添加、删除和检查引用。你还可以通过向构造函数传递一个迭代器为弱集合初始化值：\n\
  \n```javascript\nlet key1 = {},\n    key2 = {},\n    set = new WeakSet([key1, key2]);\n\
  \nconsole.log(set.has(key1));      // true\nconsole.log(set.has(key2));      //\
  \ true\n```\n\n在这个示例中，一个数组被传递给 `WeakSet` 构造函数。因为该数组包含两个对象，这些对象被添加到弱集合中。请记住，如果数组包含任何非对象值，将抛出错误，因为\
  \ `WeakSet` 无法接受原始值。\n\n#### 集合类型之间的主要区别\n\n弱集合和普通集合最大的区别在于，弱引用持有的是对象值。这里有一个演示这种差异的示例：\n\
  \n```javascript\nlet set = new WeakSet(),\n    key = {};\n\n// 将对象添加到集合中\nset.add(key);\n\
  console.log(set.has(key));      // true\n\n// 移除对 key 的最后一个强引用（同时也从弱集合中移除）\nkey\
  \ = null;\n```\n\n在此代码执行后，弱集合中对 `key` 的引用将不再可访问。无法验证其是否已被移除，因为你需要该对象的引用才能传递给 `has()`\
  \ 方法。这可能会让测试弱集合变得有些困惑，但你可以信任 JavaScript 引擎已正确移除了该引用。\n\n前面的示例显示弱集合与普通集合共享一些特性，但仍存在一些关键区别：\n\
  \n- 在 `WeakSet` 实例中，`add()` 方法、`has()` 方法和 `delete()` 方法在传递非对象时都会抛出错误。\n- 弱集合不是可迭代的，因此不能在\
  \ `for-of` 循环中使用。\n- 弱集合不暴露任何迭代器（如 `keys()` 和 `values()` 方法），因此无法通过程序方法确定弱集合的内容。\n\
  - 弱集合没有 `forEach()` 方法。\n- 弱集合没有 `size` 属性。\n\n弱集合看似有限的功能是为了内存管理设计的。\n\n*(注：由于原文中后半部分存在大量重复且无意义的乱码字符，已根据指令保留了核心内容并进行了逻辑化排版)*\n\
  \n\n\n\n\n与集合一样，`size` 属性始终包含 map 中键值对的数量。示例中的 `Map` 实例从 `\"name\"` 和 `\"age\"`\
  \ 键开始，因此当传入任一键时，`has()` 返回 `true`。在通过 `delete()` 方法移除 `\"name\"` 键后，向 `has()` 方法传入\
  \ `\"name\"` 将返回 `false`，且 `size` 属性会减少一个项目。随后，`clear()` 方法移除剩余的键，如 `has()` 对两个键都返回\
  \ `false` 且 `size` 为 0 所示。\n\n`clear()` 方法是一种从 map 中移除大量数据的快速方法，但也有方法一次性向 map 中添加大量数据。\n\
  \n## Map 初始化\n\n与集合相似的是，你可以通过向 `Map` 构造函数传递一个数组来带数据初始化 map。数组中的每个项目本身必须是一个数组，其中第一个元素是键，第二个元素是该键对应的值。因此，整个\
  \ map 是一个由这些双元素数组组成的数组，例如：\n\n```\nlet map = new Map([[\"name\", \"Nicholas\"],\
  \ [\"age\", 25]]);\n\nconsole.log(map.has(\"name\"));   // true\nconsole.log(map.get(\"\
  name\"));   // \"Nicholas\"\nconsole.log(map.has(\"age\"));    // true\nconsole.log(map.get(\"\
  age\"));    // 25\nconsole.log(map.size);          // 2\n```\n\n键 `\"name\"` 和 `\"\
  age\"` 是通过构造函数中的初始化添加到 `map` 中的。虽然嵌套数组看起来可能有点奇怪，但为了准确表示键是必要的，因为键可以是任何数据类型。将键存储在数组中是确保它们在存储到\
  \ map 之前不被强制转换为其他数据类型的唯一方法。\n\n### Map 的 forEach() 方法\n\nmap 的 `forEach()` 方法与集合和数组的\
  \ `forEach()` 类似，它接受一个接收三个参数的调函数：\n\n- map 中下一个位置的值\n- 该值对应的键\n- 读取该值的 map\n\n这些回调参数更紧密地匹配数组中\
  \ `forEach()` 的行为，在数组中，第一个参数是值，第二个是键（对应于数组中的数字索引）。这是一个示例：\n\n```\nlet map = new\
  \ Map([[\"name\", \"Nicholas\"], [\"age\", 25]]);\n\nmap.forEach(function(value,\
  \ key, ownerMap) {\n    console.log(key + \" \" + value);\n    console.log(ownerMap\
  \ === map);\n});\n```\n\n`forEach()` 回调函数输出传递给它的信息。值和键直接输出，并将 `ownerMap` 与 `map`\
  \ 进行比较以显示值是等价的。代码输出如下：\n\n```\nname Nicholas\ntrue\nage 25\ntrue\n```\n\n传递给 `forEach()`\
  \ 的回调按照键值对插入到 map 的顺序接收每个键值对。这种行为与在数组上调用 `forEach()` 有不同，在数组中，回调按数字索引的顺序接收每个项目。\n\
  \n**注意**\n\n*你也可以为 `forEach()` 提供第二个参数来设置回调函数内部的 `this`。*\n\n### Weak Maps\n\nWeakMap\
  \ 是一种特殊的 map，其键必须是对象（或符号）。如果对对象键没有其他引用，它就可以被垃圾回收。与普通的 `Map` 不同，`WeakMap` 是可迭代的；你无法遍历它的键，不能使用\
  \ `forEach()`，而且它没有 `size` 属性。与 `WeakMap` 交互的唯一方式是通过 `set()`、`get()`、`has()` 和 `delete()`。\n\
  \n```\nlet weakMap = new WeakMap();\nlet obj = {};\n\nweakMap.set(obj, \"value\"\
  );\nconsole.log(weakMap.has(obj)); // true\nconsole.log(weakMap.get(obj)); // \"\
  value\"\n\nobj = null; // 现在该对象可以进行垃圾回收了\n```\n\n\n\n虽然大多数开发者认为 `weak map` 的主要用例是将数据与\
  \ DOM 元素关联，但还有许多其他可能的用途（无疑还有一些尚未被发现）。`weak map` 的一个实际用途是存储对象实例的私有数据。在 ECMAScript\
  \ 6 中，所有对象的属性都是公开的，因此你需要发挥一些创意，让数据对对象可见但对对所有内容不可见。考虑以下示例：\n\n```javascript\nfunction\
  \ Person(name) {\n    this._name = name;\n}\n\nPerson.prototype.getName = function()\
  \ {\n    return this._name;\n};\n```\n\n这段代码使用了开头下划线的常用约定，表示该属性被认为是私有的，且不应在对象实例之外进行修改。其意图是使用\
  \ `getName()` 来读取 `this._name` 而不允许 `_name` 的值改变。然而，没有任何可以阻止有人写入 `_name` 属性，因此它可能会被刻意或意外地覆盖。\n\
  \n在 ECMAScript 5 中，通过使用如下模式创建对象，可能实现真正的私有数据：\n\n```javascript\nvar Person = (function()\
  \ {\n    var privateData = {},\n        privateId = 0;\n\n    function Person(name)\
  \ {\n        Object.defineProperty(this, \"_id\", { value: privateId++ });\n   \
  \     privateData[this._id] = {\n            name: name\n        };\n    }\n   \
  \ Person.prototype.getName = function() {\n        return privateData[this._id].name;\n\
  \    };\n\n    return Person;\n}());\n```\n\n这个示例将 `Person` 的定义封装在一个立即调用函数表达式 (IIFE)\
  \ 中，其中包含两个私有变量 `privateData` 和 `privateId`。`privateData` 对象存储了每个实例的私有信息，而 `privateId`\
  \ 为每个实例生成一个唯一的 ID。当调用 `Person` 构造函数时，会添加一个不可枚举、不可配置且不可写的 `_id` 属性。\n\n然后，在 `privateData`\
  \ 对象中创建一个与对象实例 ID 对应的条目；名称就存储在这里。稍后在 `getName()` 函数中，可以使用 `this._id` 作为键进入 `privateData`\
  \ 从而检索名称。由于 `privateData` 在 IIFE 外部无法访问，因此实际数据是安全的，尽管 `this._id` 是公开暴露的。\n\n这种方法的大问题在于\
  \ `privateData` 中的数据永远不会消失，因为没有办法知道对象实例何时被销毁：`privateData` 对象将始终包含额外数据。这个问题可以通过使用\
  \ `weak map` 来解决，如下所示：\n\n```javascript\nlet Person = (function() {\n    let privateData\
  \ = new WeakMap();\n\n    function Person(name) {\n        privateData.set(this,\
  \ { name: name });\n    }\n    Person.prototype.getName = function() {\n       \
  \ return privateData.get(this).name;\n    };\n\n    return Person;\n}());\n```\n\
  \n这个版本的 `Person` 示例使用 `weak map` 代替对象存储私有数据。由于 `Person` 对象实例可以作为键，因此不需要跟踪单独的 ID。当调用\
  \ `Person` 构造函数时，会在 `weak map` 中创建一个新条目，其键为 `this`，值为一个包含私有信息的对象。在这种情况下，该值是一个仅包含\
  \ `name` 的对象。`getName()` 函数通过将 `this` 传递给 `privateData.get()` 方法来检索该私有信息，该方法获取值对象并访问\
  \ `name` 属性。这种技术保持了私有信息的私密性，并在与其关联的对象实例被销毁时随之销毁这些信息。\n\n### Weak Map 的用途与局限性\n\n\
  当你决定使用 `weak map` 还是普通的 `map` 时，要考虑的主要决策是你是否只想使用对象作为键。任何你只需要使用对象键的时候，`weak map`\
  \ 都是最佳选择。`weak map` 允许你优化内存使用并通过确保额外数据在不再可用后不再保留，从而避免内存泄漏。\n\n请记住，`weak maps` 对内容的可见性非常低，因此你无法使用\
  \ `forEach()` 方法、`size` 属性或 `clear()` 方法来管理项。如果你需要某些检查功能，普通的 `map` 是更好的选择。只需留意内存使用即可。\n\
  \n当然，如果你只想使用非对象作为键，普通的 `map` 是你唯一的选择。\n\n## 总结\n\nECMAScript 6 正式向 JavaScript 引入了\
  \ `sets` 和 `maps`。在此引入之前，开发者经常使用对象来模拟 `sets` 和 `maps`，通常会由于对象属性相关的限制而遇到问题。\n\n`sets`\
  \ 是无序的唯一值列表。如果值根据 `Object.is()` 方法是不等价的则被认为是唯一的。`sets` 会自动去重，因此你可以使用 `has()` 方法来判断值是否包含在。`maps`\
  \ 是无序的键值对，其中键可以是任何数据类型。`maps` 还有 `size` 属性和 `forEach()` 方法，允许更容易地访问项。\n\n`weak maps`\
  \ 是一种特殊的 `map` 类型，只能有对象键。与 `weak sets` 一样，对象键的引用是弱的，当它是唯一引用时，不会阻止垃圾回收。当键被垃圾回收时，与该键关联的值也会从\
  \ `weak map` 中移除。这种内存管理机制使得 `weak maps` 特别适用于生命周期在代码之外管理的对象关联额外信息。\n\n# 8 迭代器与生成器\n\
  \n![image](img/common-01.jpg)\n\n许多编程语言已经从通过 `for` 循环遍历数据（这需要初始化变量来跟踪集合中的位置）转变为使用程序化返回集合中下一个项的迭代器对象。迭代器处理数据集合变得更容易，ECMAScript\
  \ 6 为 JavaScript 增加了迭代器。当与数组方法和新集合类型（如 `sets` 和 `maps`）结合时，迭代器对于高效数据处理至关重要，你会在语言的许多部分发现它们。新的\
  \ `for-of` 循环适用于迭代器；展开运算符\n\n本章涵盖了迭代器的许多用途，但在讨论这些用途之前，理解为什么迭代器被添加到 JavaScript 中的历史是重要的。\n\
  \n## 循环问题\n\n如果你曾经用 JavaScript 编程，你可能写过类似这样的代码：\n\n```javascript\nvar colors = [\"\
  red\", \"green\", \"blue\"];\n\nfor (var i = 0, len = colors.length; i < len; i++)\
  \ {\n    console.log(colors[i]);\n}\n```\n\n\n\n虽然这个循环非常直观，但当你嵌套循环并需要跟踪多个变量时，循环的复杂性就会增加。额外的复杂性会导致错误，而\
  \ `for` 循环的模板性质使得更容易产生错误，因为相似的代码在多个地方被编写。迭代器的设计目的是为了消除循环的复杂性和易出错的本质。\n\n## 什么是迭代器？\n\
  \n`Iterators`（迭代器）是具有用于迭代特定接口的对象。所有迭代器对象都有一个 `next()` 方法，返回一个结果对象。该结果对象有两个属性：`value`，即下一个值；`done`，一个布尔值，当没有更多值可以返回时为\
  \ `true`。迭代器内部维护着一个指针，指向值集合中的某个位置，每次调用 `next()` 方法时，它都会返回下一个适当的值。\n\n如果你在返回最后一个值后调用\
  \ `next()`，该方法将返回 `done` 为 `true`，且 `value` 包含迭代器的 `return value`（返回值）。该返回值不是数据集的一部分；相反，它是最终相关的相关数据，或者在不存在此类数据时为\
  \ `undefined`。迭代器的返回值类似于函数的返回值，因为它们都是向调用者传递信息的最终方式。\n\n考虑到这些信息，可以使用 ECMAScript 5\
  \ 创建迭代器，如下所示：\n\n```javascript\nfunction createIterator(items) {\n    var i = 0;\n\
  \    return {\n        next: function() {\n            var done = (i >= items.length);\n\
  \            var value = !done ? items[i++] : undefined;\n            return {\n\
  \                done: done,\n                value: value\n            };\n   \
  \     }\n    };\n}\n\nvar iterator = createIterator([1, 2, 3]);\nconsole.log(iterator.next());\
  \              // \"{ value: 1, done: false }\"\nconsole.log(iterator.next()); \
  \             // \"{ value: 2, done: false }\"\nconsole.log(iterator.next());  \
  \            // \"{ value: 3, done: false }\"\nconsole.log(iterator.next());   \
  \           // \"{ value: undefined, done: true }\"\n// 所有后续调用\nconsole.log(iterator.next());\
  \              // \"{ value: undefined, done: true }\"\n```\n\n`createIterator()`\
  \ 函数返回一个带有 `next()` 方法的对象。每次调用该方法时，`items` 数组中的下一个值就会作为 `value` 返回。当 `i` 为 `3` 时，`done`\
  \ 变为 `true`，设置 `value` 的三元条件运算符求值为 `undefined`。这两个结果满足了 ECMAScript 6 中迭代器的特殊最后情况，即在使用了最后一段数据后，在迭代器上调用\
  \ `next()`。\n\n正如此示例所示，编写符合 ECMAScript 6 规定规则的迭代器相当复杂。幸运的是，ECMAScript 6 还提供了生成器（generators），它们使得创建迭代器对象变得简单得多。\n\
  \n## 什么是生成器？\n\n`generator`（生成器）是一个返回迭代器的函数。生成器函数通过函数关键字后面的星号（`*`）来指示，并使用新的 `yield`\
  \ 关键字。星号是紧挨着 `function` 还是与它之间有一些空格没有关系，如下例所示：\n\n```javascript\n// generator\n\
  function *createIterator() {\n    yield 1;\n    yield 2;\n    yield 3;\n}\n// 生成器的调用方式像普通函数，但返回的是迭代器\n\
  let iterator = createIterator();\nconsole.log(iterator.next().value); // 1\nconsole.log(iterator.next().value);\
  \ // 2\nconsole.log(iterator.next().value); // 3\n```\n\n`createIterator()` 之前的\
  \ `*` 使此函数成为生成器。`yield` 关键字也是 ECMAScript 6 的新特性，它指定了在调用 `next()` 时生成的迭代器应该返回的值以及它们返回的顺序。此示例中生成的迭代器在连续调用\
  \ `next()` 方法时有三个值返回：`1`，然后是 `2`，最后是 `3`。\n\n生成器函数最有趣的一点可能是它们在每个 `yield` 语句后都会停止。例如，在代码执行完\
  \ `yield 1` 后，在调用迭代器的 `next()` 方法之前，该函数不会执行任何操作。在那个时刻，`yield 2` 开始执行。这种在函数中间停止执行的能力导致了生成器函数的一些有趣的用法。\n\
  \n你可以将 `yield` 与任何值或表达式一起，因此你可以编写向迭代器添加项的生成器函数，而无需逐个列出这些项。例如，这里有一种在 `for` 循环中使用\
  \ `yield` 向迭代器添加项的方法：\n\n```javascript\nfunction *createIterator(items) {\n    for\
  \ (let i = 0; i < items.length; i++) {\n        yield items[i];\n    }\n}\n\nlet\
  \ iterator = createIterator([1, 2, 3]);\nconsole.log(iterator.next()); // \"{ value:\
  \ 1, done: false }\"\nconsole.log(iterator.next()); // \"{ value: 2, done: false\
  \ }\"\nconsole.log(iterator.next()); // \"{ value: 3, done: false }\"\nconsole.log(iterator.next());\
  \ // \"{ value: undefined, done: true }\"\n```\n\n此示例将 `items` 数组传递给 `createIterator()`\
  \ 生成器函数。随着 `for` 循环的进行，数组元素被 `yield` 到迭代器。每次遇到 `yield`，循环就会停止，每次调用迭代器的 `next()`，循环就会从下一个\
  \ `yield` 语句处继续。本节的其余部分关注编写生成器的其他方式。\n\n#### YIELD 会抛出错误\n\n你只能在生成器内部使用 `yield`\
  \ 关键字。在其他地方使用 `yield` 都是语法错误，包括在生成器内部的函数中，例如：\n\n```javascript\nfunction *createIterator(items)\
  \ {\n    items.forEach(function(item) {\n        // 语法错误\n        yield item + 1;\n\
  \    });\n}\n```\n\n即使 `yield` 技术位于 `createIterator()` 函数内部，由于无法跨越函数边界，这段代码也是语法错误。`yield`\
  \ 关键字类似于 `return`，因为嵌套函数无法返回包含函数的返回值。\n\n#### 生成器函数表达式\n\n你可以通过在函数关键字和左括号之间包含星号（`*`）来使用函数表达式创建生成器。例如：\n\
  \n```javascript\nlet createIterator = function *(items) {\n    for (let i = 0; i\
  \ < items.length; i++) {\n        yield items[i];\n    }\n};\n\nlet iterator = createIterator([1,\
  \ 2, 3]);\nconsole.log(iterator.next()); // \"{ value: 1, done: false }\"\nconsole.log(iterator.next());\
  \ // \"{ value: 2, done: false }\"\nconsole.log(iterator.next()); // \"{ value:\
  \ 3, done: false }\"\nconsole.log(iterator.next()); // \"{ value: undefined, done:\
  \ true }\"\n// 所有后续调用\nconsole.log(iterator.next()); // \"{ value: undefined, done:\
  \ true }\"\n```\n\n在此代码中，`createIterator()` 是一个生成器函数表达式而不是函数声明。星号位于函数关键字和左括号之间，是因为函数表达式是匿名的。此外，这个示例与之前的示例相同，它们都使用了\
  \ `for` 循环。\n\n**注意**\n\n无法创建也是生成器的箭头函数。\n\n## 生成器对象方法\n\n由于生成器只是函数，你也可以将它们添加到对象中。例如，你可以在\
  \ ECMAScript 5 风格的对象字面量中使用函数表达式创建一个生成器，如下所示：\n\n```javascript\nlet o = {\n    createIterator:\
  \ function *(items) {\n        for (let i = 0; i < items.length; i++) {\n      \
  \      yield items[i];\n        }\n    }\n};\n\nlet iterator = o.createIterator([1,\
  \ 2, 3]);\n```\n\n\n\n你也可以使用 ECMAScript 6 的方法简写形式，通过在方法名前加上一个星号（`*`），如下所示：\n\n```javascript\n\
  let o = {\n    *createIterator(items) {\n        for (let i = 0; i < items.length;\
  \ i++) {\n            yield items[i];\n        }\n    }\n};\n\nlet iterator = o.createIterator([1,\
  \ 2, 3]);\n```\n\n这些示例在功能上与上一节的示例等效；它们只是使用了不同的语法。在简写版本中，由于定义 `createIterator()`\
  \ 方法时没有使用 `function` 关键字，星号直接放置在方法名之前，尽管你可以在星号和方法名之间留空格。\n\n### 可迭代对象（Iterables）和\
  \ for-of 循环\n\n与迭代器（iterators）密切相关的是“可迭代对象”（iterable），它是具有 `Symbol.iterator` 属性的对象。众名的\
  \ `Symbol.iterator` 符号指定了一个函数，该函数返回给定对象的迭代器。所有集合对象（数组、set 和 map）以及字符串在 ECMAScript\
  \ 6 中都是可迭代对象，因此它们都有一个指定的默认迭代器。可迭代对象的设计是为了配合 ECMAScript 6 的一个新特性：for-of 循环。\n\n**注意**\n\
  \n由生成器（generators）创建的所有迭代器也是可迭代对象，因为生成器默认分配了 `Symbol.iterator` 属性。\n\n在本章开始时，我提到了在\
  \ for 循环内部跟踪索引的问题。迭代器是解决该问题的第一部分。for-of 循环是第二部分：它完全消除了跟踪集合中索引的需求，让你能够专注于处理集合的内容。\n\
  \nfor-of 循环在每次执行时都会对可迭代对象调用 `next()` 方法，并将结果对象中的值存储在变量中。循环会持续此过程，直到返回对象的 `done`\
  \ 属性为 `true` 为止。这里有一个示例：\n\n```javascript\nlet values = [1, 2, 3];\n\nfor (let num\
  \ of values) {\n    console.log(num);\n}\n```\n\n这段代码输出以下内容：\n\n1\n2\n3\n\n这个 for-of\
  \ 循环首先调用 `values` 数组上的 `Symbol.iterator` 方法来获取迭代器。（对 `Symbol.iterator` 的调用是在 JavaScript\
  \ 引擎后台完成的。）然后调用 `iterator.next()`，并将迭代器结果对象上的 `value` 属性读取到 `num` 中。变量 `num` 首先是\
  \ 1，然后是 2，最后是 3。当结果对象 `done` 为 `true` 时，循环退出，因此 `num` 永远不会被赋值为 `undefined`。\n\n\
  如果你只是在遍历数组或集合中的值，使用 for-of 循环而不是 for 循环是一个好主意。for-of 循环通常不容易出错，因为需要跟踪的条件较少。对于复杂的控制条件，请使用传统的\
  \ for 循环。\n\n**警告**\n\n在非可迭代对象、null 或 undefined 上使用 for-of 语句将抛出错误。\n\n## 访问默认迭代器\n\
  \n你可以使用 `Symbol.iterator` 来访问对象的默认迭代器，如下：\n\n```javascript\nlet values = [1, 2,\
  \ 3];\nlet iterator = values[Symbol.iterator]();\nconsole.log(iterator.next());\
  \ // { value: 1, done: false }\nconsole.log(iterator.next()); // { value: 2, done:\
  \ false }\nconsole.log(iterator.next()); // { value: 3, done: false }\nconsole.log(iterator.next());\
  \ // { value: undefined, done: true }\n```\n\n这段代码获取了 `values` 的默认迭代器，并使用它来遍历项。这与使用\
  \ for-of 循环时后台发生的原理相同。\n\n由于 `Symbol.iterator` 指定了默认迭代器，你可以使用它来检测一个对象是否为可迭代：\n\n\
  ```javascript\nfunction isIterable(obj) {\n    return typeof obj[Symbol.iterator]\
  \ === 'function';\n}\n\nconsole.log(isIterable([1, 2, 3])); // true\nconsole.log(isIterable(\"\
  hello\")); // true\nconsole.log(isIterable({})); // false\nconsole.log(isIterable(null));\
  \ // false\n```\n\n由于 `Symbol.iterator` 指定了默认迭代器，你可以使用它来检测一个对象是否为可迭代：\n\n```javascript\n\
  function isIterable(obj) {\n    return typeof obj[Symbol.iterator] === 'function';\n\
