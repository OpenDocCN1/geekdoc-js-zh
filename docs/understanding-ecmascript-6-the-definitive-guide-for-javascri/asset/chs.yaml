  \ 6 席卷了世界。它在人们停止等待它很久之后才出现，然后它的传播速度比大多数人学习的速度还要快。关于它，每个人都有不同的故事。这是我的。\n\n2013 年，我在一家从\
  \ iOS 转向 Web 的初创公司工作。那时我还没有共同创建 Redux，也没有参与 JavaScript 开源社区。当时，我正挣扎于学习 Web 开发，并感到恐惧。我的团队必须在短短几个月内从零开始为我们的产品构建\
  \ Web 版本。用的是 JavaScript。\n\n起初，我对用 JavaScript 编写大型程序的想法嗤之以鼻。但一位新团队成员说服了我，JavaScript\
  \ 并不是一种玩具语言。我同意尝试一下。我放下偏见，打开 MDN 和 StackOverflow，第一次深度学习了 JavaScript。我发现的这种简单性令我着迷。同事还教了我如何使用代码检查器（linter）和打包器（bundler）等工具。几周后，我醒来时发现我已经喜欢编写\
  \ JavaScript 了。\n\n但没有一种语言是完美的。我怀念在其他其他语言工作时已经习惯的频繁更新。十年来 JavaScript 唯一的一次重大更新 ECMAScript\
  \ 5 仅仅是一次清理，尽管如此，浏览器也花费了多年才完全支持它。当时，即将到来的 ECMAScript 6（ES6）规范（代号为 `Harmony`）远未完成，看起来像是一个遥远的未来。“也许\
  \ 10 年后我就能写一些 ES6 代码了，”我想。\n\n当时有一些实验性的“转译编译器”，比如 Google Traceur，它们将代码从 ES6 翻译成\
  \ ES5。其中大多数功能非常局限，或者很难集成到现有的 JavaScript 构建流水线中。但随后一个名为 `6to5` 的新编译器出现了，并改变了一切。它很容易安装，与现有工具集成良好，并产生可读的代码。它像野火一样传播。现在被称为\
  \ `Babel` 的 `6to5` 在规范最终确定之前就将 ES6 特性带来了主流观众。在几个月内，ES6 就无处不在。\n\n由于许多原因，ES6 让社区产生了分歧。就在此书出版之际，它在许多主流浏览器中尚未完全实现。当你刚开始学习这种语言时，拥有一个构建步骤可能会令人敬畏。有些库提供了\
  \ ES6 的文档和示例，你可能会怀疑是否可以在 ES5 中使用这些库。这导致了困惑。许多人并没有预料语言会有任何新功能，因为以前几乎从未改变过。另一些人则焦虑地等待着新功能的到来，并将它们全部一起使用——在某些情况下甚至超过了必要范围。\n\
  \n正当我变得精通 JavaScript 时，我感觉有人抽走了我脚下的毯子，现在我必须学习一种新语言。这几个月我心情很糟糕。最后，在圣诞平安夜，我开始阅读这本书的草稿。我爱不释手。等我发现时已经是凌晨\
  \ 3 点，派对上的每个人都睡着了，而我听懂了 ES6！\n\n\n\n\n\nNicholas 是一位极具天赋的老师。他以直白的方式传达深奥的细节，让你不会听得吃力。除了这本书，他还因创建了\
  \ `ESLint` 而闻名，这是一个 JavaScript 代码分析器，已经被下载了数百万次。\n\nNicholas 对 JavaScript 的熟悉程度极少有人能与其相提。不要错过吸收他的知识的机会。阅读此书，你也将对自己对\
  \ `ES6` 的理解充满自信。\n\nDan Abramov\n\nReact 核心团队成员及 `Redux` 创建者\n\n# 致谢\n\n感谢 Jennifer\
