  此外，感谢在 `Patreon` 上支持本书的 `Casey Visco`。\n\n# 引言\n\n![image](img/common-01.jpg)\n\n\
  JavaScript 核心语言特性定义在 `ECMA-262` 标准中。该标准定义的语言被称为 `ECMAScript`。你在浏览器和 `Node.js` 中通常认知的\
  \ JavaScript 实际上是 `ECMAScript` 的超集。浏览器和 `Node.js` 通过额外的对象和方法增加了更多功能，但 JavaScript\
  \ 的核心仍然保持 `ECMAScript` 所定义的样。`ECMA-262` 的持续开发对 JavaScript 整体的成功至关重要，本书涵盖了该语言最近一次重大更新带来的变化：`ECMAScript\
  \ 6`。\n\n## 通往 ECMAScript 6 之路\n\n2007 年，JavaScript 处于一个十字路口。`Ajax` 的流行开启了动态 Web\
  \ 应用的新时代，而 JavaScript 自 1999 年发布 `ECMA-262` 第三版以来就没有发生过变化。负责推动 `ECMAScript` 开发进程的委员会\
  \ `TC-39` 制定了一份庞大的 `ECMAScript 4` 草案规范。`ECMAScript 4` 的范围非常巨大，对语言引入了微小和重大的变化。更新后的特性包括新语法、模块、类、经典继承、私有对象成员、可选类型注解等。\n\
  \n`ECMAScript 4` 变更的范围导致 `TC-39` 内部产生了分歧：一些成员认为第四版试图完成的任务太多了。来自 `Yahoo!```Google`\
  \ 和 `Microsoft` 的一组领导者为 `ECMAScript` 的下一个版本创建了一个替代提案，该小组最初将其命名为 `ECMAScript 3.1`。“3.1”这一标记旨在表明该版本是对现有标准的增量式更改。\n\
  \n`ECMAScript 3.1` 引入了极少的语法变化；相反，它专注于属性特性、原生 `JSON` 支持以及向已有的对象添加方法。尽管曾尝试调和 `ECMAScript\
  \ 3.1` 和 `ECMAScript 4`，但这些努力最终失败了，因为两个阵营很难就语言应该如何成长达成其截然不同的观点。\n\n2008 年，JavaScript\
  \ 的创造者 `Brendan Eich` 宣布 `TC-39` 将集中精力在标准化 `ECMAScript 3.1` 上。\n\n\n\n\n\n- 第 5\
  \ 章：易于访问数据的解构 介绍了对象和数组解构，它允许你使用简洁的语法分解对象和数组。\n- 第 6 章：符号与符号属性 引入了符号的概念，这是定义属性的新方式。符号是一种新的原始类型，你可以用它来模糊（但不隐藏）对象的属性和方法。\n\
  - 第 7 章：Sets 和 Maps 详细介绍了 `Set`、`WeakSet`、`Map` 和 `WeakMap` 这些新集合类型。这些类型通过添加专门为\
  \ JavaScript 设计的语义、去重和内存管理，扩展了数组的实用性。\n- 第 8 章：迭代器和生成器 讨论了语言中新增的迭代器和生成器。这些特性允许你以强大的方式处理数据集合，这在之前的\
  \ JavaScript 版本中是无法实现的。\n- 第 9 章：引入 JavaScript 类 引入了 JavaScript 中第一个正式的类概念。对于来自其他语言的人来说，这通常是一个困惑点，但\
  \ JavaScript 中类语法的加入使得语言对其他人更容易上手，对爱好者也更加简洁。\n- 第 10 章：改进的数组能力 详细介绍了原生数组的更改以及你在\
  \ JavaScript 中使用它们的有用新方法。\n- 第 11 章：Promises 与异步编程 将 promises 作为语言的新部分进行引入。Promises\
  \ 最初是一项草根努力，最终由于广泛的库支持而兴起并流行。ECMAScript 6 将 promises 正式化并使其默认可用。\n- 第 12 章：Proxies\
  \ 与反射 API 引入了 JavaScript 的正式化反射 API 以及新的代理对象，它允许你拦截对对象上执行的每一个操作。代理为开发者对对象提供了前所未有的控制力，从而为定义新的交互模式提供了无限可能。\n\
  - 第 13 章：使用模块封装代码 详细介绍了 JavaScript 的官方模块格式。其目的是让这些模块取代多年年来出现的许多临时模块定义格式。\n- 附录 A：ECMAScript\
  \ 6 的微改 涵盖了 ECMAScript 6 中实现的其他更改，这些更改的使用频率较低，或者不太符合每章涵盖的广泛主要主题。\n- 附录 B：理解 ECMAScript\
  \ 7 (2016) 描述了 ECMAScript 7 中实现的三个标准新增，它们对 JavaScript 的影响没有 ECMAScript 6 那么大。\n\n\
  ## 使用的规范\n\n本书使用了以下排版规范：\n\n- *斜体*用于新术语和文件名。\n- 等宽表示文本中的代码术语。\n\n此外，较长的代码示例包含在等宽代码块中，例如：\n\
  \n```javascript\nfunction doSomething() {\n    // empty\n}\n```\n\n在代码块中，`console.log()`\
  \ 语句右侧的注释表示执行代码时你在浏览器或 Node.js 控制台中看到的输出；例如：\n\n```javascript\nconsole.log(\"Hi\"\
  );      // \"Hi\"\n```\n\n如果代码块中的行代码抛出错误，错误也会在代码右侧：\n\n```javascript\ndoSomething();\
  \           // throws an error\n```\n\n## 帮助与支持\n\n如果你在阅读本书时有任何问题，请向我的邮件列表 *http://groups.google.com/group/zakasbooks*\
  \ 发送消息。\n\n# 1 块绑定 (BLOCK BINDINGS)\n\n![image](img/common-01.jpg)\n\n传统上，变量声明的工作是\
  \ JavaScript 编程中一个棘手的部分。在大多数基于 C 的语言中，变量（更正式称为*绑定*，因为名称被绑定到作用域内的值）是在声明发生的地方创建的。但在\
  \ JavaScript 中情况并非如此。变量实际创建的位置取决于你如何声明它们，而 ECMAScript 6 提供了更容易控制作用域的。本章演示了为什么经典的\
  \ `var` 声明可能会引起混乱，引入了 ECMAScript 6 中的块级绑定，并提供了一些使用它们的最佳实践。\n\n### var 声明与提升 (Hoisting)\n\
  \n使用 `var` 的变量声明被处理为它们位于函数顶部（如果在函数外部声明，则在全局作用域内），无论实际声明发生在何处；这被称为*提升* (hoisting)。为了演示提升的作用，请考虑以下函数定义：\n\
  \n```javascript\nfunction getValue(condition) {\n    if (condition) {\n        var\
  \ value = \"blue\";\n        // other code\n        return value;\n    } else {\n\
  \        // value 在这里存在且值为 undefined\n        return null;\n    }\n}\n```\n\n如果你不熟悉\
  \ JavaScript，你可能认为变量只在 condition 求为真时才被创建。事实上，无论如何变量都会被创建。在后台，JavaScript 引擎会将 `getValue`\
  \ 函数更改为看起来像：\n\n```javascript\nfunction getValue(condition) {\n    var value;\n\
  \    if (condition) {\n        value = \"blue\";\n        // other code\n      \
  \  return value;\n    } else {\n        return null;\n    }\n}\n```\n\n`value` 的声明被提升到了顶部，而初始化仍留在原处。这意味着变量在\
  \ `else` 句中仍然是可用的。如果从 `else` 句中访问它，变量将是 `undefined`。\n\n新开发者通常需要时间来适应声明提升，误解这种行为可能会导致\
  \ Bug。出于这个原因，ECMAScript 6 引入了块级作用域，以便开发者更好地控制变量的周期。\n\n### 块级声明 (Block-Level Declarations)\n\
  \n块级声明定义的绑定在块外部不可访问。*块作用域*（也称为词法作用域）在以下位置创建：\n\n- 函数内部\n- 块内部（由 `{` 和 `}` 表示）\n\n\
  块作用域是许多基于 C 的语言的工作方式，ECMAScript 6 引入块级声明是为了为 JavaScript 提供同样的灵活性（和一致性）。\n\n####\
  \ let 声明\n\n`let` 声明语法与 `var` 的语法相同。你基本上可以用 `let` 替换 `var` 来声明变量，但会将变量的作用域限制在当前块中（存在其他区别，将在第\
  \ 6 页的“暂存性死区”讨论）。由于 `let` 声明不会提升到所在块的顶部，最好将 `let` 声明放在块的开头，以便它们在整个块中可用。这里有一个例子：\n\
  \n```javascript\nfunction getValue(condition) {\n    if (condition) {\n        let\
  \ value = \"blue\";\n        // other code\n        return value;\n    } else {\n\
  \        // value 在这里不存在\n        return null;\n    }\n    // value 在这里不存在\n}\n\
  ```\n\n这个版本的 `getValue` 函数行为更接近你在其他基于 C 的语言中的预期。由于变量值是使用 `let` 而不是 `var` 声明的，声明没有提升到函数定义的顶部，一旦执行流出\
  \ if 块，变量值就再不可访问。如果 condition 求为假，则 `value` 永远不会被声明或初始化。\n\n#### 不可重复声明 (No Redeclaration)\n\
  \n如果标识符在作用域内已经定义，在该作用域中使用 `let` 声明该标识符会导致抛出错误。例如：\n\n\n\n\n\n```javascript\nvar\
  \ count = 30;\n// throws an error\nlet count = 40;\n```\n\n在这个示例中，`count` 被声明了两次：一次使用\
  \ `var`，一次使用 `let`。由于 `let`不会重新定义同一作用域内已存在的标识符，因此 `let` 声明将抛出错误。相反，如果 `let` 声明创建一个与其所在作用域内的变量同名的新变量，则不会产生错误，如下代码所示：\n\
  \n```javascript\nvar count = 30;\n\nif (condition) {\n    // doesn't throw an error\n\
  \    let count = 40;\n    // more code\n}\n```\n\n这个 `let` 声明没有没有错误，因为它在 `if` 语句内部创建了一个名为\
  \ `count` 的新变量，而不是在外部块中创建 `count`。在 `if` 块内部，这个新变量会遮蔽（shadow）全局的 `count`，导致在执行退出该块之前无法访问它。\n\
  \n## const 声明\n\n你也可以使用 `const` 声明语法在 ECMAScript 6 中定义绑定。使用 `const` 的绑定被视为*常量*，这意味着它们的值一旦设置就无法被更改。由于这个原因，每个\
  \ `const` 绑定必须在声明时初始化，如下示例所示：\n\n```javascript\n// valid constant\nconst maxItems\
  \ = 30;\n\n// syntax error: missing initialization\nconst name;\n```\n\n`maxItems`\
  \ 绑定已初始化，因此它的 `const` 声明可以正常工作。然而，如果你尝试运行包含此代码的程序，`name` 绑定将导致语法错误，因为 `name` 没有被初始化。\n\
  \n### 常量与 let 声明\n\n常量与 `let` 声明一样，都是块级声明。这意味着一旦执行流流出声明常量的块，常量就再也不可访问，而且声明不会被提升（hoisted），如下示例所示：\n\
  \n```javascript\nif (condition) {\n    const maxItems = 5;\n    // more code\n}\n\
  \n// maxItems isn't accessible here\n```\n\n在这段代码中，常量 `maxItems` 在 `if` 语句内部声明。在语句执行完毕后，在那个块外部无法访问\
  \ `maxItems`。\n\n另一个与 `let` 的相似之处是，如果在同一作用域内对已定义变量的标识符使用 `const` 声明，将抛出错误。无论该变量是使用\
  \ `var`（全局或函数作用域）还是 `let`（块作用域）声明的。。例如，考虑这段代码：\n\n```javascript\nvar message = \"\
  Hello!\";\nlet age = 25;\n\n// each of these throws an error\nconst message = \"\
  Goodbye!\";\nconst age = 30;\n```\n\n这两个 `const` 声明单独来说是有效的，但考虑到此情况下之前的 `var` 和\
  \ `let` 声明，它们是语法错误。\n\n尽管有这些相似之处，`let` 和 `const` 之间仍存在一个显著区别。尝试给之前定义的常量赋值一个 `const`，在严格模式和非严格模式下都会抛出错误：\n\
  \n```javascript\nconst maxItems = 5;\n// throws an error\nmaxItems = 6;\n```\n\n\
  就像其他语言中的常量一样，`maxItems` 变量之后不能被赋予新值。但是，与其它语言中的常量不同，如果常量是一个对象，则它所持的值是可以修改的。\n\n###\
  \ 使用 const 声明对象\n\n`const` 声明防止的是绑定的修改，而不是值的修改。这意味着对对象的 `const` 声明并阻止对这些对象的修改。例如：\n\
  \n```javascript\nconst person = {\n    name: \"Nicholas\"\n};\n\n// works\nperson.name\
  \ = \"Greg\";\n\n// throws an error\nperson = {\n    name: \"Greg\"\n};\n```\n\n\
  在这里，绑定 `person` 被创建时初始值为一个具有一个属性的对象。可以更改 `person.name` 而不会引起错误，因为这改变了 `person` 的内容，但没有改变\
  \ `person` 所绑定的值。当这段代码尝试给 `person` 赋值（即尝试更改绑定）时，将抛出错误。`const` 与对象一起工作时的这种细微差别很容易被误解。只需记住\
  \ `const` 防止的是绑定的修改，而不是所绑定值的修改。\n\n### 暂时性死区 (Temporal Dead Zone)\n\n使用 `let` 或\
  \ `const` 声明的变量在声明之前无法被访问。尝试这样做会导致引用错误，即使在使用通常安全的操作时，例如此 `if` 语句中的 `typeof` 操作：\n\
  \n```javascript\nif (condition) {\n    console.log(typeof value);  // throws an\
  \ error\n    let value = \"blue\";\n}\n```\n\n在这里，变量 `value` 使用 `let` 定义并初始化，但该语句从未被执行，因为上一行抛出了错误。问题在于\
  \ `value` 存在于 JavaScript 社区所称的*暂时性死区 (TDZ)* 中。ECMAScript 规范中从未显式命名过 TDZ，但该术语通常被用来描述为什么\
  \ `let` 和 `const` 绑定在声明之前不可访问。本节涵盖了 TDZ 引起的声明位置的一些细微差别，尽管示例中使用了 `let`，但请注意相同的信息也适用于\
  \ `const`。\n\n当 JavaScript 引擎查找后续代码块并发现变量声明时，它要么将声明提升到函数顶部或全局作用域（针对 `var`），要么将声明放置在\
  \ TDZ 中（针对 `let` 和 `const`）。任何尝试访问 TDZ 中变量的行为都会导致运行时错误。该变量只有在声明后才会被从 TDZ 中移除。\n\n\
  \n\n\n\n你可能通常认为这段代码会打印 0 到 9 的数字，但它却连续输出了十次 10。原因是 `i` 在循环的每次迭代中都是共享的，这意味着循环内部创建的函数都持有同一个变量的引用。当循环完成时，变量\
  \ `i` 的值为 10，因此当调用 `console.log(i)` 时，每次打印的该值。\n\n为了解决这个问题，开发者在循环内部使用`立即调用函数表达式\
  \ (IIFEs)` 来强制为他们想要迭代的变量创建一个新的副本，如例所示：\n\n```javascript\nvar funcs = [];\n\nfor\
  \ (var i = 0; i < 10; i++) {\n    funcs.push((function(value) {\n        return\
  \ function() {\n            console.log(value);\n        }\n    }(i)));\n}\n\nfuncs.forEach(function(func)\
  \ {\n    func();     // 输出 0, 然后 1, 然后 2, 直到 9\n});\n```\n\n这个版本在循环内部使用了 IIFE。变量\
  \ `i` 被传递给 IIFE，IIFE 创建了自己的副本并将其存储为 `value`。这是函数在相应迭代中使用的值，因此当循环从 0 计数到 9 时，调用每个函数都会返回预期的值。幸运的是，ECMAScript\
  \ 6 中 `let` 和 `const` 的块级绑定可以为你简化这种循环。\n\n#### 循环中的 let 声明\n\n`let` 声明通过实际上模拟了上一个示例中\
  \ IIFE 的作用，简化了循环。在每次迭代中，循环都会创建一个新变量，并将其初始化为上一次迭代中同名变量的值。这意味着你可以完全省略 IIFE 并获得你预期的结果，如下：\n\
  \n```javascript\nvar funcs = [];\n\nfor (let i = 0; i < 10; i++) {\n    funcs.push(function()\
  \ {\n        console.log(i);\n    });\n}\n\nfuncs.forEach(function(func) {\n   \
  \ func();     // 输出 0, 然后 1, 然后 2, 直到 9\n})\n```\n\n这个循环的运行方式与使用 `var` 和 IIFE 的循环完全相同，但可以说更整洁。`let`\
  \ 声明在每次通过循环时都会创建一个新变量 `i`，因此循环内部创建的每个函数都获得了 `i` 的自己的副本。每个 `i` 副本的值在其创建的循环迭代开始时赋值的值。`for-in`\
  \ 和 `for-of` 循环也是如此，如下所示：\n\n```javascript\nvar funcs = [],\n    object = {\n  \
  \      a: true,\n        b: true,\n        c: true\n    };\n\nfor (let key in object)\
  \ {\n    funcs.push(function() {\n        console.log(key);\n    });\n}\n\nfuncs.forEach(function(func)\
  \ {\n    func();     // 输出 \"a\", 然后 \"b\", 然后 \"c\"\n});\n```\n\n在这个示例中，`for-in`\
  \ 循环表现出与 `for` 循环相同的行为。每次通过循环时，都会创建一个新的 `key` 绑定，因此每个函数都有自己的 `key` 变量副本。结果是每个函数输出一个不同的值。如果使用\
  \ `var` 来声明 `key`，则所有函数都将输出 \"c\"。\n\n**注意**\n\n重要的是，要理解循环中 `let` 声明的行为是规范中特别定义的行为，并不一定与\
  \ `let` 的非提升（non-hoisting）特性有关。事实上，`let` 的早期实现并没有表现出这种行为，因为它是后期才添加的。\n\n#### 循环中的\
  \ const 声明\n\nECMAScript 6 规范并没有明确禁止在循环中使用 `const` 声明；然而，`const` 的行为根据你使用的循环类型而不同。对于普通的\
  \ `for` 循环，你可以在初始化中使用 `const`，但如果你尝试更改值，循环将抛出警告。例如：\n\n```javascript\nvar funcs\
  \ = [];\n\n// 迭代一次后报错\nfor (const i = 0; i < 10; i++) {\n    funcs.push(function()\
  \ {\n        console.log(i);\n    });\n}\n```\n\n在这段代码中，变量 `i` 被声明为常量。循环的第一次迭代（`i`\
  \ 为 0）执行成功。当执行 `i++` 时会抛出错误，因为它尝试修改一个常量。因此，只有不在修改该变量时，你才可以在循环初始化中使用 `const` 来声明变量。\n\
  \n相反，当在 `for-in` 或 `for-of` 循环中使用时，`const` 的行为与 `let` 类似：\n\n```javascript\nvar\
  \ funcs = [],\n    object = {\n        a: true,\n        b: true,\n        c: true\n\
  \    };\n\nfor (const key in object) {\n    funcs.push(function() {\n        console.log(key);\n\
  \    });\n}\n\nfuncs.forEach(function(func) {\n    func();     // 输出 \"a\", 然后 \"\
  b\", 然后 \"c\"\n});\n```\n\n### 全局绑定\n\n`let` 和 `const` 与 `var` 的另一个不同在于它们的全局作用域。当你在全局作用域中使用\
  \ `var` 时，它会在全局对象上创建一个属性。如果你使用 `let` 或 `const`，它会创建一个绑定但不在全局对象上创建属性。这使得当你不想在全局对象上创建属性时，在全局作用域中使用\
  \ `let` 和 `const` 要安全得多。例如：\n\n```javascript\nlet RegExp = \"Hello!\";\nconsole.log(RegExp);\
  \ // Hello!\n\nconst ncz = \"Hi!\";\nconsole.log(ncz); // Hi!\n\nconsole.log(\"\
  ncz\" in window); // false\n```\n\n### 块级绑定的新兴最佳实践\n\n在 ECMAScript 6 开发期间，人们广泛认为你应该默认使用\
  \ `let` 而不是 `var`。另一种方法也流行了起来：默认使用 `const`，只有在你知道变量的值需要改变时才使用 `let`。\n\n\n\n\n\n\
  `let` 和 `const` 块绑定为 JavaScript 引入了词法作用域。这些声明不会被提升，并且仅存在于它们被定义的块中。块绑定提供的行为更类似于其他语言，并且不太可能导致意外错误，因为变量现在可以精确地在需要的地方进行声明。作为副作用，你无法在声明之前访问变量，即使使用如\
  \ `typeof` 这样的安全运算符也不行。在声明之前尝试访问块绑定会导致错误，因为该绑定存在于临时死区（TDZ）中。\n\n在许多情况下，`let` 和 `const`\
  \ 的行为与 `var` 相似；但在循环中情况并非如此。在 `for-in` 和 `for-of` 循环内部，`let` 和 `const` 都会在每次迭代循环时创建一个新的绑定。因此，在循环体内部创建的函数可以访问循环绑定的当前值，而不是它们在循环最后迭代后的值（这是\
  \ `var` 的行为）。`for` 循环中的 `let` 声明也是如此，而尝试在 `for` 循环中使用 `const` 声明可能会导致错误。\n\n目前块绑定的最佳实践是默认使用\
  \ `const`，只有在确定变量值需要更改时才使用 `let`。这样做可以确保代码具有基础层面的不可变性，有助于防止某些类型的错误。\n\n## 2 字符串与正则表达式\n\
  \n![image](img/common-01.jpg)\n\n可以说，字符串是编程中最重要的数据类型之一。它们几乎存在于每种高级编程语言中，而能够有效地处理字符串是开发者创建实用程序的基础。以此类推，正则表达式之所以重要，是因为它们为开发者提供了在字符串上进行操作的额外能力。考虑到这些事实，ECMAScript\
  \ 6 的创建者通过添加新功能和缺失已久的功能改进了字符串和正则表达式。本章将对这两类变化进行介绍。\n\n### 更好的改进的 Unicode 支持\n\n\
  在 ECMAScript 6 之前，JavaScript 字符串假设每个 16 位序列（称为 `code unit*`）代表一个单一字符。所有的字符串属性和方法，例如\
  \ `length` 属性和 `charAt()` 方法，都是基于这些 16 位代码单元的。当然，16 位曾经足够包含任何字符。但得益于 Unicode 引入的扩展字符集，这已不再成立。\n\
  \n#### UTF-16 代码点\n\n将字符长度限制在 16 位，无法实现 Unicode 为世界上每个字符提供全球唯一标识符的目标。这些全球唯一的标识符被称为`代码点`（`code\
  \ points`），它们仅仅是从 0 开始的数字。代码点就是你可能认为的“字符编码”，其中一个数字代表一个字符。字符编码必须将代码点编码为内部一致的代码单元。对于\
  \ UTF-16，代码点可以由许多代码单元组成。\n\nUTF-16 中的前 2¹⁶ 个代码点以单个 16 位代码单元的形式表示。这个范围被称为`基本多语言平面（BMP）`。超出此范围的所有内容都被认为位于一个`补充平面`（`supplementary\
  \ planes`）中，其中代码点无法仅用 16 位表示。UTF-16 通过引入`代理对`（`surrogate pairs`）解决了这个问题，在其中一个代码代码点由两个\
  \ 16 位代码单元表示。这意味着字符串中的任何单个字符都可以是 BMP 字符的单个代码单元（总共 16 位），也可以是补充平面字符的两个单元（总共 32 位）。\n\
  \n在 ECMAScript 5 中，所有的字符串操作都是基于 16 位代码单元进行的，这意味着你从包含代理对的 UTF-16 编码字符串中可能会得到意外的结果，如下所示：\n\
  \n```javascript\nlet text = \"\U00020BB7\";\n\nconsole.log(text.length);       \
  \      // 2\nconsole.log(/^.$/.test(text));         // false\nconsole.log(text.charAt(0));\
  \          // \"\"\nconsole.log(text.charAt(1));          // \"\"\nconsole.log(text.charCodeAt(0));\
  \      // 55362\nconsole.log(text.charCodeAt(1));      // 57271\n```\n\n单个 Unicode\
  \ 字符 \"\U00020BB7\" 使用代理对表示，因此此示例中的 JavaScript 字符串操作将该字符串视为具有两个 16 位的字符。这意味着：\n\n\
  - `text` 的长度为 2，而它本应该是 1。\n- 尝试匹配单个字符的正则表达式失败了，因为它认为这里有两个字符。\n- `charAt()` 方法无法返回有效的字符字符串，因为两组\
  \ 16 位都不对应于可打印字符。\n- `charCodeAt()` 方法也无法正确识别字符。它为每个代码单元返回相应的 16 位数字，但这是你在 ECMAScript\
  \ 5 中能获得的 `text` 真实值的接近值。\n\n但 ECMAScript 6 强制执行 UTF-16 字符串编码以解决此类问题。基于这种字符编码标准化字符串操作，意味着\
  \ JavaScript 可以支持专门为代理对设计的功能。本节接下来的内容将讨论该功能的一些关键示例。\n\n#### codePointAt() 方法\n\n\
  为了解决这些问题，ECMAScript 6 为了完全支持 UTF-16 添加的一个方法是 `codePointAt()` 方法，它可以获取字符串中指定位置的 Unicode\
  \ 代码点。该方法接受代码单元位置而不是字符位置，并返回一个整数。将其结果与 `charCodeAt()` 进行对比：\n\n```javascript\nlet\
  \ text = \"\U00020BB7a\";\n\nconsole.log(text.charCodeAt(0)); // 55362\nconsole.log(text.charCodeAt(1));\
  \ // 57271\nconsole.log(text.charCodeAt(2)); // 97\nconsole.log(text.codePointAt(0));\
  \ // 134071\nconsole.log(text.codePointAt(1)); // 57271\nconsole.log(text.codePointAt(2));\
  \ // 97\n```\n\n`codePointAt()` 方法返回与 `charCodeAt()` 方法相同的值，除非它操作的是非 BMP 字符。`text`\
  \ 中的第一个字符是非 BMP 的，因此由两个代码单元组成，这意味着 `length` 为 3 而不是 2。这两个方法对于位置 1（第一个字符的第二个代码单元）和位置\
  \ 2（字符 \"a\"）返回相同的值。\n\n对字符调用 `codePointAt()` 方法是判断该字符是由一个还是两个代码点表示的最简单方法。你可以写这样一个函数：\n\
  \n```javascript\nfunction is32Bit(c) {\n  return c.codePointAt(0) > 0xFFFF;\n}\n\
  \nconsole.log(is32Bit(\"\U00020BB7\")); // true\nconsole.log(is32Bit(\"a\"));  \
  \  // false\n```\n\n16 位字符的上限用十六进制表示为 FFFF，因此任何大于该数字的代码点必须由两个代码单元表示，总共 32 位。\n\n\
  #### String 方法\n\n当 JavaScript 提供执行某种操作的方法时，它也提供了相应的反向操作。你可以使用 `codePointAt()` 获取字符串中字符的代码点，而\
  \ `String.fromCodePoint()` 则根据给定的代码点生成单字符字符串。例如：\n\n```javascript\nconsole.log(String.fromCodePoint(134071));\
  \ // \"\U00020BB7\"\n```\n\n将 `String.fromCodePoint()` 视为 `String.fromCharCode()`\
  \ 方法的一个更完整的版本。对于 BMP 中的所有字符，两者的结果相同。只有当你传递 BMP 之外字符的代码点时才会存在差异。\n\n#### normalize()\
  \ 方法\n\n\n\n\n\nUnicode 的另一个有趣方面是，不同的字符在排序或其他基于比较的操作中可以被认为是等价的。定义这些关系的方法有两种方式。第一种关系是`规范等价`（canonical\
  \ equivalence），意味着两个代码点序列在所有方面都被认为是可交换的。例如，两个字符的组合在规范上可以等价于一个字符。第二种关系是`兼容性`（compatibility）。两个兼容的代码点序列看起来不同，但在某些情况下可以互换使用。\n\
  \n由于这些关系，表示本质上相同文本的两个字符串可能包含不同的代码点序列。例如，字符“æ”和双字符字符串“ae”可以互换，但除非经过某种方式的规范化，否则它们严格并不相等。\n\
  \nECMAScript 6 通过为字符串提供 `normalize()` 方法来支持 Unicode 归一化形式。该方法可选地接受单个字符串参数，指示应用以下\
  \ Unicode 归一化形式之一：\n\n- 规范正组合形式 (\"NFC\")，默认值\n- 规范正分解形式 (\"NFD\")\n- 兼容性正组合形式 (\"\
  NFKC\")\n- 兼容性分解形式 (\"NFKD\")\n\n解释这四种形式之间的差异已超出本书的范畴。只需记住，在比较字符串时，两个字符串必须归一化为相同的形式。例如：\n\
  \n```javascript\nlet normalized = values.map(function(text) {\n    return text.normalize();\n\
  });\n\nnormalized.sort(function(first, second) {\n    if (first < second) {\n  \
  \      return -1;\n    } else if (first === second) {\n        return 0;\n    }\
  \ else {\n        return 1;\n    }\n});\n```\n\n这段代码将 `values` 数组中的字符串转换为归一化形式，以便数组可以进行适当排序。你也可以在比较器中调用\
  \ `normalize()` 对原始数组进行排序，如下：\n\n```javascript\nvalues.sort(function(first, second)\
  \ {\n    let firstNormalized = first.normalize(),\n        secondNormalized = second.normalize();\n\
  \n    if (firstNormalized < secondNormalized) {\n        return -1;\n    } else\
  \ if (firstNormalized === secondNormalized) {\n        return 0;\n    } else {\n\
  \        return 1;\n    }\n});\n```\n\n再次强调，关于这段代码需要注意的最重要点是，`first` 和 `second`\
  \ 是以相同的方式归一化的。这些示例使用了默认的 NFC，但你可以轻松地指定其他任何一种，如下：\n\n```javascript\nvalues.sort(function(first,\
  \ second) {\n    let firstNormalized = first.normalize(\"NFD\"),\n        secondNormalized\
  \ = second.normalize(\"NFD\");\n\n    if (firstNormalized < secondNormalized) {\n\
  \        return -1;\n    } else if (firstNormalized === secondNormalized) {\n  \
  \      return 0;\n    } else {\n        return 1;\n    }\n});\n```\n\n如果你以前从未担心过\
  \ Unicode 归一化，那么你现在可能对这个方法用处不大。但如果你以后从事国际化应用程序的工作，你一定会发现 `normalize()` 方法非常有帮助。\n\
  \n新方法并不是 ECMAScript 6 为处理 Unicode 字符串提供的唯一改进。ECMAScript 6 还引入了正则表达式的 `u` 标志，以及对字符串和正则表达式的其他更改。\n\
  \n### 正则表达式 `u` 标志\n\n你可以通过正则表达式完成许多常见的字符串操作。但请记住，正则表达式假设使用 16 位代码单元，每个单元代表单个字符。为了解决这个问题，ECMAScript\
  \ 6 在正则表达式中定义了一个 `u` 标志（代表 `Unicode*`）。\n\n#### `u` 标志的作用\n\n当正则表达式设置了 `u` 标志时，它会切换模式以对字符而非代码单元进行操作。这意味着正则表达式不再将代理对视为字符串中的独立字符，并且应该按照预期行为运行。例如，考虑这段代码：\n\
  \n```javascript\nlet text = \"\U00020BB7\";\nconsole.log(text.length);         \
  \    // 2\nconsole.log(/^.$/.test(text));      // false\nconsole.log(/^.$/u.test(text));\
  \      // true\n```\n\n正则表达式 `/^.$/` 匹配任何包含单个字符的输入字符串。当不使用 `u` 标志时，该正则表达式基于代码单元进行匹配，因此该汉字（由两个代码单元表示）不会匹配。\n\
  \n#### 计数代码点\n\n遗憾的是，ECMAScript 6 并没有添加确定字符串包含多少个代码点的方法，但通过 `u` 标志，你可以像下面一样使用正则表达式：\n\
  \n```javascript\nfunction codePointLength(text) {\n    let result = text.match(/[\\\
  s]/gu);\n    return result ? result.length : 0;\n}\n\nconsole.log(codePointLength(\"\
  abc\"));    // 3\nconsole.log(codePointLength(\"\U00020BB7\"));   // 1\n```\n\n\
  当至少有一个匹配项时，结果包含一个数组，因此长度就是代码点的数量。在 Unicode 中，“abc”和“\U00020BB7”都有三个。\n\n#### 判断对\
  \ `u` 标志的支持\n\n由于 `u` 标志是一种语法变化，在不兼容 ECMAScript 6 的 JavaScript 引擎中尝试使用会导致抛出语法错误。判断是否支持\
  \ `u` 标志的安全方法是使用函数，如下：\n\n```javascript\nfunction hasRegExpU() {\n    try {\n  \
  \      var pattern = new RegExp(\".\", \"u\");\n        return true;\n    } catch\
  \ (ex) {\n        return false;\n    }\n}\n```\n\n此函数使用 `RegExp` 构造函数将 `u` 标志作为参数传递。这种语法在早期的\
  \ JavaScript 引擎中也是有效的，但如果不支持 `u`，构造函数将报错。\n\n### 其他字符串更改\n\nJavaScript 的字符串操作能力和工具一直落后于其他语言的类似功能。例如，直到\
  \ ECMAScript 5 才为字符串添加了 `trim()` 方法，而 ECMAScript 6 继续通过新功能扩展 JavaScript 解析字符串的能力。\n\
  \n#### 识别子字符串的方法\n\n自 JavaScript 诞生以来，开发者一直使用 `indexOf()` 方法来识别字符串中的字符串，并一直请求更简单的方法来识别子字符串。ECMAScript\
  \ 6 包含了以下三个方法，它们正是为此设计的：\n\n- `includes()` 方法：如果给定文本位于字符串的任何位置，则返回 `true`；否则返回 `false`。\n\
  - `startsWith()` 方法：如果给定文本位于字符串开头，则返回 `true`；否则返回 `false`。\n- `endsWith()` 方法：如果给定文本位于字符串结尾，则返回\
  \ `true`；否则返回 `false`。\n\n\n\n\n\n每个方法都接受两个参数：要搜索的文本以及一个可选的搜索起始索引。当提供第二个参数时，`includes()`\
  \ 和 `startsWith()` 将从该索引开始匹配，而 `endsWith()` 将从字符串长度减去第二个参数的位置开始匹配；当省略第二个参数时，`includes()`\
  \ 和 `startsWith()` 将从字符串开头开始搜索，而 `endsWith()` 则从末尾开始。实际上，第二个参数减少了需要搜索的字符串量。以下是展示这三个方法用法的的一些示例：\n\
  \n```javascript\nlet msg = \"Hello world!\";\n\nconsole.log(msg.startsWith(\"Hello\"\
  ));      // true\nconsole.log(msg.endsWith(\"!\"));            // true\nconsole.log(msg.includes(\"\
  o\"));            // true\nconsole.log(msg.startsWith(\"o\"));         // false\n\
  console.log(msg.endsWith(\"world!\"));      // true\nconsole.log(msg.includes(\"\
  x\"));            // false\nconsole.log(msg.startsWith(\"o\", 4));      // true\n\
  console.log(msg.endsWith(\"o\", 8));        // true\nconsole.log(msg.includes(\"\
  o\", 8));        // false\n```\n\n前三个调用没有包含第二个参数，因此如果需要，它们将搜索整个字符串。后三个调用只检查字符串的部分内容。`msg.startsWith(\"\
  o\", 4)` 调用通过查看 `msg` 字符串的索引 4 开始匹配，该索引处是 `Hello` 中的 `o`。`msg.endsWith(\"o\", 8)`\
  \ 调用同样从索引 4 开始匹配，因为从字符串长度 (12) 中减去了参数 8。`msg.includes(\"o\", 8)` 调用从索引 8 开始匹配，该索引处是\
  \ `world` 中的 `r`。\n\n尽管这三个方法让识别子字符串的存在性变得更简单，但每个方法都只返回一个布尔值。如果你需要找到一个字符串在另一个字符串中的实际位置，请使用\
  \ `indexOf()` 或 `lastIndexOf()` 方法。\n\n### 注意\n\n如果你传递正则表达式而不是字符串，`startsWith()`、`endsWith()`\
  \ 和 `includes()` 方法将抛出错误。相比之下，`indexOf()` 和 `lastIndexOf()`会将正则表达式参数转换为字符串，然后搜索该字符串。\n\
  \n### repeat() 方法\n\nECMAScript 6 还为字符串添加了 `repeat()` 方法，它接受字符串次数的数字作为参数。它返回一个包含原始字符串按指定次数重复的新字符串。例如：\n\
  \n```javascript\nconsole.log(\"x\".repeat(3));      // \"xxx\"\nconsole.log(\"hello\"\
  .repeat(2));  // \"hellohello\"\nconsole.log(\"abc\".repeat(4));      // \"abcabcabcabc\"\
  \n```\n\n该方法主要是一个便利函数，在处理文本时特别有用。它在需要创建缩进层级的代码格式化工具中特别有用，例如：\n\n```javascript\n\
  // 使用指定数量的空格缩进\nlet indent = \" \".repeat(4),\n    indentLevel = 0;\n\n// 每当增加缩进时\n\
  let newIndent = indent.repeat(++indentLevel);\n```\n\n第一个 `repeat()` 调用创建了一个包含四个空格的字符串，`indentLevel`\
  \ 变量跟踪缩进级别。然后，你只需要使用递增的 `indentLevel` 调用 `repeat()` 即可更改空格的数量。\n\nECMAScript 6 还对不属于特定类别的正则表达式功能做了一些实用的更改。下一节将重点介绍这些变化中的。\n\
  \n### 其他正则表达式的变化\n\n正则表达式是 JavaScript 中处理字符串的重要部分，与语言的许多部分一样，它们在最近的版本中没有很大变化。然而，ECMAScript\
  \ 6 对正则表达式进行了若干改进，以配合字符串的更新。\n\n### 正则表达式 y 标志\n\nECMAScript 6 在 Firefox 中作为正则表达式的私有扩展实现后，对\
  \ `y` 标志标准化。`y` 标志影响正则表达式搜索的粘性（sticky）属性，它告诉搜索从正则表达式的 `lastIndex` 属性指定的位置开始匹配字符串中的字符。如果该位置没有匹配项，正则表达式将停止匹配。以下代码显示了它是如何工作的：\n\
  \n```javascript\nlet text = \"hello1 hello2 hello3\",\n    pattern = /hello\\d\\\
  s?/,\n    result = pattern.exec(text),\n    globalPattern = /hello\\d\\s?/g,\n \
  \   globalResult = globalPattern.exec(text),\n    stickyPattern = /hello\\d\\s?/y,\n\
  \    stickyResult = stickyPattern.exec(text);\n\nconsole.log(result[0]);      //\
  \ \"hello1\"\nconsole.log(globalResult[0]); // \"hello1\"\nconsole.log(stickyResult[0]);\
  \ // \"hello1\"\n```\n\n（注：提供的文本在最后一部分包含大量重复/乱码句子，我已根据提供的技术背景对其进行了清理以保持清晰。）\n\n\n\
  \n\n\n```javascript\nlet pattern = /hello\\d/y;\n\nconsole.log(pattern.sticky);\
  \   // true\n```\n\n如果存在 `y` 标志，则 `sticky` 属性被设置为 `true`，否则设置为 `false`。该属性根据标志的存在而是只读的，无法在代码中更改。\n\
  \n与 `u` 标志类似，`y` 标志是一种语法变化，因此它在早期的 JavaScript 引擎中会导致语法错误。你可以使用以下方法检测支持情况：\n\n```javascript\n\
  function hasRegExpY() {\n    try {\n        var pattern = new RegExp(\".\", \"y\"\
  );\n        return true;\n    } catch (ex) {\n        return false;\n    }\n}\n\
  ```\n\n与检查 `u`一样，如果无法创建带有 `y` 标志的正则表达式，此代码将返回 `false`。同样与 `u` 类似，如果你需要在运行在早期 JavaScript\
  \ 引擎的代码中使用 `y`，请务必在定义这些正则表达式时使用 `RegExp` 构造函数，以避免语法错误。\n\n## 复制正则表达式\n\n在 ECMAScript\
  \ 5 中，你可以通过将正则表达式传递给 `RegExp` 构造函数来复制它们，如下：\n\n```javascript\nvar re1 = /ab/i,\n\
  \    re2 = new RegExp(re1);\n```\n\n`re2` 变量只是 `re1` 变量的拷贝。但如果你为 `RegExp` 构造函数提供第二个参数（用于指定正则表达式的标志），你的代码将无法工作，例如所示：\n\
  \n```javascript\nvar re1 = /ab/i,\n// 在 ES5 中抛错误，在 ES6 中正常\n    re2 = new RegExp(re1,\
  \ \"g\");\n```\n\n如果你在 ECMAScript 5 环境中执行此代码，你将得到一个错误，说明当第一个参数是正则表达式时不能使用第二个参数。ECMAScript\
  \ 6 改变了这一行为，允许使用第二个参数，它会覆盖第一个参数上存在的任何标志。例如：\n\n```javascript\nlet re1 = /ab/i,\n\
  // 在 ES5 中抛错误，在 ES6 中正常\n    re2 = new RegExp(re1, \"g\");\n\nconsole.log(re1.toString());\
  \               // \"/ab/i\"\nconsole.log(re2.toString());               // \"/ab/g\"\
  \nconsole.log(re1.test(\"ab\"));               // true\nconsole.log(re2.test(\"\
  ab\"));               // true\nconsole.log(re1.test(\"AB\"));               // true\n\
  console.log(re2.test(\"AB\"));               // false\n```\n\n在此段代码中，`re1` 具有 `i`（忽略大小写）标志，而\
  \ `re2` 只有 `g`（全局）标志。`RegExp` 构造函数复制了来自 `re1` 的模式，并将 `g` 标志替换为 `i` 标志。如果没有第二个参数，`re2`\
  \ 将具有与 `re1` 相同的标志。\n\n## flags 属性\n\n除了添加新标志和更改操作标志的方式，ECMAScript 6 还增加了一个与它们关联的属性。在\
  \ ECMAScript 5 中，你可以通过 `source` 属性获取正则表达式的文本，但要获取标志字符串，你必须解析 `toString()` 方法的输出，如下所示：\n\
  \n```javascript\nfunction getFlags(re) {\n    var text = re.toString();\n    return\
  \ text.substring(text.lastIndexOf(\"/\") + 1, text.length);\n}\n\n// toString()\
  \ 是 \"/ab/g\"\nvar re = /ab/g;\nconsole.log(getFlags(re));               // \"g\"\
  \n```\n\n此代码将正则表达式转换为字符串，然后返回找到最后一个 `/` 之后的字符。这些字符就是标志。\n\nECMAScript 6 通过增加一个与\
  \ `source` 属性配对的 `flags` 属性使得获取标志变得更容易。这两个属性都是原型访问器属性，仅分配了 getter，使得它们是只读的。`flags`\
  \ 属性使得为了调试和继承目的检查正则表达式变得容易。\n\n`flags` 属性是 ECMAScript 6 后期添加的，它返回应用于正则表达式的任何标志的字符串表示。例如：\n\
  \n```javascript\nlet re = /ab/g;\nconsole.log(re.source);      // \"ab\"\nconsole.log(re.flags);\
  \       // \"g\"\n```\n\n此代码获取 `re` 上所有的标志并将其打印到控制台，比 `toString()` 技术需要的代码行要少得多。结合使用\
  \ `source` 和 `flags` 允许你提取正则表达式的各个部分。\n\n## 模板字符串\n\n`flags` 属性使得为了调试和继承目的检查正则表达式变得容易。（此处省略）\n\
  \n### 基础语法\n\n在最简单的情况下，模板字符串的作用就像是用反引号（`` ` ``）分隔的字符串，而不是双引号或单引号。例如，考虑：\n\n```javascript\n\
  let message = `Hello world`;\nconsole.log(message);               // \"Hello world\"\
  \nconsole.log(typeof message);        // \"string\"\nconsole.log(message.length);\
  \        // 11\n```\n\n此代码演示了 message 包含包含一个普通字符串。如果你想在字符串中使用反引号，只需用反斜杠（`\\`）对其进行转义，如下版本的消息所示：\n\
  \n```javascript\nlet message = `\\`Hello\\` world`;\nconsole.log(message);     \
  \          // \"`Hello` world\"\nconsole.log(typeof message);        // \"string\"\
  \nconsole.log(message.length);        // 13\n```\n\n在模板字符串内部不需要转义双引号或单引号。\n\n##\
  \ 多行字符串\n\nJavaScript 开发者从语言的第一版本开始就想要创建多行字符串的方法。但当你使用双引号或单引号时，字符串必须完全包含在一行内。\n\n\
  ### ECMAScript 6 之前的变通方案\n\n得益于长期存在的语法错误，JavaScript 确实有一个创建多行字符串的变通方案。你可以在换行之前使用反斜杠（`\\\
  `）来创建多行字符串。示例：\n\n```javascript\nvar message = \"Multiline \\\nstring\";\nconsole.log(message);\
  \ // \"Multiline string\"\n```\n\nmessage 字符串打印到控制台时没有换行符，因为反斜杠被视为延续而不是换行。要在输出中显示换行，你需要手动包含它：\n\
  \n```javascript\nvar message = \"Multiline \\n\\\nstring\";\nconsole.log(message);\
  \ // \"Multiline string\"\n```\n\n此代码在所有主要的 JavaScript 引擎中都应该分行打印 message 的内容；然而，这种行为被定义为错误，许多开发者建议避免使用。\n\
  \nECMAScript 6 之前创建多行字符串的其他尝试通常依赖数组或字符串拼接，如下：\n\n```javascript\nvar message = [\n\
  \    \"Multiline \",\n    \"string\"\n].join(\"\\n\");\n\nlet message = \"Multiline\
  \ \\n\" +\n    \"string\";\n```\n\n\n\n\n开发者以前绕过 JavaScript 缺乏多行字符串的各种方法并不十分实用或方便。\n\
  \n### 轻松实现多行字符串\n\nECMAScript 6 的模板字量（template literals）让多行字符串变得简单，因为没有特殊的语法。只需在需要的地方包含换行符，它就会出现在结果中，如下：\n\
  \n```javascript\nlet message = `Multiline\n\nstring`;\n\nconsole.log(message); \
  \            // \"Multiline\n\n                                   string\"\n\nconsole.log(message.length);\
  \      // 16\n```\n\n反引号内的所有空白字符都是字符串的一部分，因此请注意缩进。例如：\n\n```javascript\nlet message\
  \ = `Multiline\n\n             string`;\n\nconsole.log(message);             //\
  \ \"Multiline\n\n                              string\"\n\nconsole.log(message.length);\
  \      // 31\n```\n\n在这段代码中，模板字面量第二行之前的所有空白字符都被视为字符串的一部分。\n\n如果你认为让文本与正确的缩进对齐很重要，可以考虑将多行模板字面量的第一行留空，然后再缩进，如下：\n\
  \n```javascript\nlet html = `\n\n<div>\n\n    <h1>Title</h1>\n\n</div>`.trim();\n\
  ```\n\n这段代码从第一行开始模板字面量，但在第二行之前没有任何文本。HTML 标签经过了缩进以便看起来正确，然后调用 `trim()` 方法来移除初始的空行。\n\
  \n如果你愿意，也可以在模板字面量中使用 `\\n` 来指示插入换行的位置：\n\n```javascript\nlet message = `Multiline\\\
  nstring`;\n\nconsole.log(message);             // \"Multiline\n\n              \
  \                 string\"\n\nconsole.log(message.length);      // 16\n```\n\n###\
  \ 变量替换\n\n此时，模板字面量看起来可能像普通 JavaScript 字符串的高级版本。两者真正的区别在于模板字面量替换（substitutions）。替换允许你将任何有效的\
  \ JavaScript 表达式嵌入模板字面量，并将结果作为字符串的一部分输出。\n\n替换由起始 `${` 和结束的 `}` 限定，其中可以包含任何 JavaScript\
  \ 表达式。最简单的替换允许你直接将局部变量嵌入到生成的字符串中，如下：\n\n```javascript\nlet name = \"Nicholas\",\n\
  \    message = `Hello, ${name}.`;\n\nconsole.log(message);       // \"Hello, Nicholas.\"\
  \n```\n\n替换 `${name}` 访问局部变量 `name` 并将其插入 `message` 字符串中。变量 `message` 随后立即持有替换的结果。\n\
  \n**注意**\n\n*模板字面量可以访问其定义作用域内可访问的任何变量。在模板字面量中使用未声明的变量会在严格和非严格模式下均抛出错误。*\n\n由于所有的替换都是\
  \ JavaScript 表达式，你可以替换的不仅仅是简单的变量名。你可以轻松地嵌入计算、函数调用等。例如：\n\n```javascript\nlet count\
  \ = 10,\n    price = 0.25,\n    message = `${count} items cost $${(count * price).toFixed(2)}.`;\n\
  \nconsole.log(message);      // \"10 items cost $2.50.\"\n```\n\n这段代码在模板字面量中执行了计算。变量\
  \ `count` 和 `price` 相乘产生结果，然后使用 `.toFixed()` 将其格式化为两位小数。第二个替换之前的美元符号原样输出，因为它后面没有跟着左大括号。\n\
  \n模板字面量也是 JavaScript 表达式，这意味着你可以将一个模板字面量放在另一个模板字面量内部，例如这个示例：\n\n```javascript\n\
  let name = \"Nicholas\",\n    message = `Hello, ${\n        `my name is ${ name\
  \ }`\n    }.`;\n\nconsole.log(message);           // \"Hello, my name is Nicholas.\"\
  \n```\n\n这段代码在另一个模板字面量内部嵌套了一个模板字面量。\n\n### 标签模板（Tagged Templates）\n\n你已经看到模板字面量如何插入值。但模板字面量真正的威力来自于标签模板（tagged\
  \ templates）。标签模板是一个带有模板字面量数据调用的函数。\n\n### 定义标签\n\n标签简单来说是一个接收字面量和替换项的函数。为了更好地理解传递给标签的内容，请考虑以下示例：\n\
  \n```javascript\nfunction passthru(literals, ...substitutions) {\n    let result\
  \ = \"\";\n    for (let i = 0; i < substitutions.length; i++) {\n        result\
  \ += literals[i];\n        result += substitutions[i];\n    }\n    // 添加最后一个字面量\n\
  \    result += literals[literals.length - 1];\n    return result;\n}\n\nlet count\
  \ = 10,\n    price = 0.25,\n    message = passthru`${count} items cost $${(count\
  \ * price).toFixed(2)}.`;\n\nconsole.log(message); // \"10 items cost $2.50.\"\n\
  ```\n\n这个示例定义了一个 `passthru` 标签，它执行与默认模板字面量行为相同的转换。唯一的技巧是在循环中使用 `substitutions.length`\
  \ 而不是 `literals.length`，以避免意外越过 `substitutions` 数组的末尾。这个技巧之所以有效是因为 `substitutions`\
  \ 中的项数总是比 `literals` 中的项数少一个。\n\n\n\n模板标签也可以访问原始字符串信息，这主要意味着可以访问在转换为字符等效值之前的字符转义。处理原始字符串值最简单的方法是使用内置的\
  \ `String.raw()` 标签。例如：\n\n```javascript\nlet message1 = `Multiline\\nstring`,\n\
  \    message2 = String.raw`Multiline\\nstring`;\n\nconsole.log(message1);      \
  \       // \"Multiline\n                                string\"\n\nconsole.log(message2);\
  \             // \"Multiline\\\\nstring\"\n```\n\n在此代码中，`message1` 中的 `\\n` 被解释为换行符，而\
  \ `message2` 中的 `\\n` 则以其原始形式 `\"\\\\n\"`（斜杠和 n 字符）返回。这种获取原始字符串信息的方法可以在必要时进行更复杂的处理。\n\
  \n原始字符串信息也会传递给模板标签。标签函数的第一个参数是一个数组，并包含一个名为 `raw` 的额外属性。`raw` 属性是一个数组，包含了每个字面量值的原始等效值。例如，`literals[0]`\
  \ 中的值始终有一个等效 `literals.raw[0]`，其中包含了原始字符串信息。知道这一点，你可以使用以下代码模拟 `String.raw()`：\n\n\
  ```javascript\nfunction raw(literals, ...substitutions) {\n    let result = \"\"\
  ;\n    // 仅针对替换的数量运行循环\n    for (let i = 0; i < substitutions.length; i++) {\n \
  \       // 使用原始值\n        result += literals.raw[i];\n        result += substitutions[i];\n\
  \    }\n    // 添加最后一个字面量\n    result += literals.raw[literals.length - 1];\n   \
  \ return result;\n}\n\nlet message = raw`Multiline\\nstring`;\n\nconsole.log(message);\
  \             // \"Multiline\\\\nstring\"\nconsole.log(message.length);      //\
  \ 17\n```\n\n这段代码使用 `literals.raw` 而不是 `literals` 来输出字符串结果。这意味着任何字符转义（包括 Unicode\
  \ 码点转义）将以其原始形式返回。当你想要输出一个包含带有字符转义序列的代码的字符串时，原始字符串非常有帮助。例如，如果你想为某些代码生成文档，你可能希望按照代码实际的样子输出它。\n\
  \n## 总结\n\nECMAScript 6 对 Unicode 的完整支持允许 JavaScript 以逻辑化的方式处理 UTF-16 字符。通过 `codePointAt()`\
  \ 和 `String.fromCodePoint()` 在码点和字符之间转换的能力是字符串操作的重要一步。正则表达式 `u` 标志的引入使得对码点而非 16\
  \ 位字符进行操作成为可能，而 `normalize()` 方法允许更恰字符串比较。\n\nECMAScript 6 还添加了处理字符串的新方法，允许你更轻松地识别子字符串，无论它在父字符串中的位置如何。正则表达式也增加了更多功能。\n\
  \n模板字符串字量是 ECMAScript 6 的一个重要补充，允许你创建领域特定语言（DSL）来使字符串创建变得简单。直接在模板字符串字量中嵌入变量的能力意味着开发者在组合带有变量的长字符串时，拥有一个比字符串拼接更安全的工具。\n\
  \n对多行字符串的内置支持也使得模板字符串字量成为普通 JavaScript 字符串的有用升级，后者从未具有这种能力。虽然模板字符串字量内部允许直接使用换行，但你仍然可以使用\
  \ `\\n` 和其他字符转义序列。\n\n模板标签是创建 DSL 的模板字符串字量功能最重要的部分。标签是接收模板字符串字量片段作为参数的函数。然后你可以使用这些数据返回适当的字符串值。提供的数据包括字面量、它们的原始等效值以及任何替换值。这些信息可以帮助你确定标签的正确输出。\n\
  \n## 3 函数\n\n函数是任何编程语言的重要组成部分，在 ECMAScript 6 之前，JavaScript 函数自语言创建以来并没有发生太大变化。这留下了堆积的问题和细微的行为，导致很容易出错，并且通常需要更多的代码来产生非常基础的行为。\n\
  \nECMAScript 6 函数实现了巨大的飞跃，它考虑了 JavaScript 开发者多年来的投诉和请求。结果是一系列增量式的改进，这些改进增强了 ECMAScript\
  \ 5 函数，并使 JavaScript 编程变得更不容易出错且更具活性。\n\n### 带有默认参数值的函数\n\nJavaScript 函数的独特之处在于，它们允许传递任意数量的参数，无论函数定义中声明了多少个参数。这允许你定义可以处理不同数量参数的函数，通常在未提供参数时通过只需填充默认值来实现。本节涵盖了\
  \ ECMAScript 6 内部及之前默认参数的工作原理，以及关于 `arguments` 对象、使用表达式作为参数以及 TDZ（暂时性死区）的一些信息。\n\
  \n#### 在 ECMAScript 5 中模拟默认参数值\n\n在 ECMAScript 5 及之前的版本中，你可能会使用以下模式来创建默认值：\n\n```javascript\n\
  function makeRequest(url, timeout, callback) {\n    timeout = timeout || 2000;\n\
  \    callback = callback || {};\n}\n```\n\n在此示例中，`timeout` 和 `callback` 是可选的，因为它们被赋予了默认值。逻辑或运算符\
  \ (`||`) 常用于为缺失参数提供默认值。然而，这种方法存在缺陷：如果 `timeout` 的有效值可能是 `0`，但这将其替换为 `2000`。\n\n\
  在这种情况下，更安全的替代方案是使用 `typeof` 检查类型，如下所示：\n\n```javascript\nfunction makeRequest(url,\
  \ timeout, callback) {\n    timeout = (typeof timeout !== \"undefined\") ? timeout\
  \ : 2000;\n    callback = (typeof callback !== \"undefined\") ? callback : {};\n\
  }\n```\n\n尽管这种方法更安全，但执行基本操作仍然需要大量的额外代码。这种方法代表了一种常见的模式，流行的 JavaScript 库中充满了此类模式。\n\
  \n#### ECMAScript 6 中的默认参数值\n\nECMAScript 6 通过提供在未传递参数时使用的初始化，使得为参数提供默认值变得更容易。例如：\n\
  \n```javascript\nfunction makeRequest(url, timeout = 2000, callback = function()\
  \ {}) {\n}\n```\n\n此函数期望传递第一个参数。另外两个参数具有默认值，这使得函数体变小得多，因为你不需要添加任何检查缺失值的代码。\n\n当带有三个参数调用\
  \ `makeRequest()` 时，不会使用默认值。例如：\n\n```javascript\n// 使用默认的 timeout 和 callback\n\
  makeRequest(\"/foo\");\n\n// 使用默认的 callback\nmakeRequest(\"/foo\", 500);\n\n// 不使用默认值\n\
  makeRequest(\"/foo\", 500, function(body) {\n    doSomething(body);\n});\n```\n\n\
  ECMAScript 6 认为 `url` 是必须，这就是为什么在所有三次调用 `makeRequest()` 中都传递了 \"/foo\"。两个带有默认值的参数被认为是可选的。\n\
  \n对于任何参数指定默认值，包括那些在函数声明中出现在无默认值参数之前的参数。例如，这样做是允许的：\n\n```javascript\nfunction makeRequest(url,\
  \ timeout = 2000, callback) {\n}\n```\n\n\n\n\n在这种情况下，只有在没有传递第二个参数，或者第二个参数被显式地传递为\
  \ `undefined` 时，才会使用 `timeout` 的默认值，如下例所示：\n\n```javascript\n// 使用默认 timeout\nmakeRequest(\"\
  /foo\", undefined, function(body) {\n    doSomething(body);\n});\n\n// 使用默认 timeout\n\
  makeRequest(\"/foo\");\n\n// 不使用默认 timeout\nmakeRequest(\"/foo\", null, function(body)\
  \ {\n    doSomething(body);\n});\n```\n\n在默认参数值的情况下，`null` 值被认为是有效的，这意味着在第三次对 `makeRequest()`\
  \ 的调用中，`timeout` 的默认值将不会被使用。\n\n### 默认默认参数值如何影响 `arguments` 对象\n\n请记住，当存在默认参数值时，`arguments`\
  \ 对象的行为是不同的。在 ECMAScript 5 非严格模式下，`arguments` 对象反映了函数具名参数的变化。以下一些代码说明了它是如何工作的：\n\
  \n```javascript\nfunction mixArgs(first, second) {\n    console.log(first === arguments[0]);\n\
  \    console.log(second === arguments[1]);\n    first = \"c\";\n    second = \"\
  d\";\n    console.log(first === arguments[0]);\n    console.log(second === arguments[1]);\n\
  }\nmixArgs(\"a\", \"b\");\n```\n\n此代码输出如下：\n```\ntrue\ntrue\ntrue\ntrue\n```\n\n\
  在非严格模式下，`arguments` 对象始终更新以反映具名参数的变化。因此，当 `first` 和 `second` 被赋予新值时，`arguments[0]`\
  \ 和 `arguments[1]` 会随之更新，使得所有的 `===` 比较结果都为 `true`。\n\n然而，ECMAScript 5 的严格模式消除了\
  \ `arguments` 对象这一令人困惑的方面。在严格模式下，`arguments` 对象不反映具名参数的变化。这里是同样的 `mixArgs()` 函数，但在严格模式下：\n\
  \n```javascript\nfunction mixArgs(first, second) {\n    \"use strict\";\n    console.log(first\
  \ === arguments[0]);\n    console.log(second === arguments[1]);\n    first = \"\
  c\";\n    second = \"d\"\n    console.log(first === arguments[0]);\n    console.log(second\
  \ === arguments[1]);\n}\nmixArgs(\"a\", \"b\");\n```\n\n调用 `mixArgs()` 的输出如下：\n\
  ```\ntrue\ntrue\nfalse\nfalse\n```\n\n这一次，更改 `first` 和 `second` 不会影响 `arguments`，因此输出符合你通常的预期。\n\
  \n在使用了 ECMAScript 6 默认参数值的函数中，`arguments`对象的行为始终与 ECMAScript 5 严格模式相同，无论该函数是否显式运行在严格模式下。默认参数值的存在会触发\
  \ `arguments` 对象与具名参数保持分离。这是一个微妙但重要的细节，因为你可以如何使用 `arguments` 对象。考虑以下情况：\n\n```javascript\n\
  // 非严格模式\nfunction mixArgs(first, second = \"b\") {\n    console.log(arguments.length);\n\
  \    console.log(first === arguments[0]);\n    console.log(second === arguments[1]);\n\
  \    first = \"c\";\n    second = \"d\"\n    console.log(first === arguments[0]);\n\
  \    console.log(second === arguments[1]);\n}\nmixArgs(\"a\");\n```\n\n此代码输出如下：\n\
  ```\n1\ntrue\nfalse\nfalse\nfalse\n```\n\n在这个示例中，`arguments.length` 为 1，因为只向 `mixArgs()`\
  \ 传递了一个参数。这意味着 `arguments[1]` 是 `undefined`，这在向函数只传递一个参数时的预期行为。这意味着 `first` 也等于\
  \ `arguments[0]`。更改 `first` 和 `second` 对 `arguments` 没有产生影响。这种行为在非严格模式和严格模式下都会发生，因此你可以依赖\
  \ `arguments` 始终反映初始的调用状态。\n\n### 默认参数表达式\n\n默认参数值最有趣的特征可能就是，默认值不需要是一个原始值。例如，你可以执行一个函数来获取默认参数值，如下：\n\
  \n```javascript\nfunction getValue() {\n    return 5;\n}\n\nfunction add(first,\
  \ second = getValue()) {\n    return first + second;\n}\nconsole.log(add(1, 1));\
  \     // 2\nconsole.log(add(1));         // 6\n```\n\n在这里，如果未提供最后一个参数，将调用函数 `getValue()`\
  \ 来获取正确的默认值。请记住，只有当调用 `add()` 且没有第二个参数时，才会调用 `getValue()`，而不是在首次解析函数声明时调用。这意味着如果\
  \ `getValue()` 的编写方式不同，它可能会返回不同的值。例如：\n\n```javascript\nlet value = 5;\nfunction\
  \ getValue() {\n    return value++;\n}\nfunction add(first, second = getValue())\
  \ {\n    return first + second;\n}\n```\n\n在这个示例中，`value` 从 5 开始。当调用 `add(1)` 时，会调用\
  \ `getValue()`，返回 5 并将 `value` 增加到 6。如果再次调用 `add(1)`，`getValue()` 返回 7 并将 `value`\
  \ 增加到 8。\n\n**警告**：在使用函数调用作为默认值时要小心。如果你忘记了括号，例如本示例中的 `getValue`，那么你传递的是函数本身而不是结果。\n\
  \n从默认赋值引用参数的能力仅适用于之前的参数。例如：\n\n```javascript\nfunction add(first = second, second)\
  \ {\n    return first + second;\n}\nconsole.log(add(1, 1)); // 2\nconsole.log(add(undefined,\
  \ 1)); // 抛出错误\n```\n\n调用 `add(undefined, 1)` 抛出错误是因为 `second` 定义在 `first` 之后，因此无法作为默认值。\n\
  \n### 默认参数 TDZ\n\n[第一章] 介绍了与 `let` 和 `const` 相关的 TDZ（临时死区），默认参数值也有 TDZ，其中参数无法被访问。类似于\
  \ `let` 声明，每个参数都会创建一个新的标识绑定，在初始化之前引用它会抛出错误。参数初始化发生在调用函数时，通过为参数传递值或使用默认参数值来实现。\n\n\
  为了探索默认参数值的 TDZ，重新考虑第 41 页的示例：\n\n```javascript\nfunction getValue(value) {\n   \
  \ return value + 5;\n}\n\nfunction add(first, second = getValue(first)) {\n    return\
  \ first + second;\n}\nconsole.log(add(1, 1)); // 2\nconsole.log(add(1));     //\
  \ 7\n```\n\n调用 `add(1, 1)` 和 `add(1)` 实际上执行了以下代码来创建第一个和第二个参数值：\n\n```javascript\n\
  // JavaScript representation of call to add(1, 1)\nlet first = 1;\nlet second =\
  \ 1;\n\n// JavaScript representation of call to add(1)\nlet first = 1;\nlet second\
  \ = getValue(first);\n```\n\n\n\n\n\n当函数 `add()` 首次执行时，绑定 `first` 和 `second` 会被添加到特定的参数\
  \ TDZ（暂时性死区，类似于 `let` 的行为）。因此，尽管 `second` 可以用 `first` 的值初始化（因为 `first` 在此时总是已经初始化），但反过来情况就不然。现在，考虑这个重写后的\
  \ `add()` 函数：\n\n```javascript\nfunction add(first = second, second) {\n    return\
  \ first + second;\n}\n\nconsole.log(add(1, 1));           // 2\nconsole.log(add(undefined,\
  \ 1));  // 抛出错误\n``````\n\n示例中的 `add(1, 1)` 和 `add(undefined, 1)` 调用现在映射到底层的以下代码：\n\
  \n```javascript\n// 调用 add(1, 1) 的 JavaScript 表达式\nlet first = 1;\nlet second =\
  \ 1;\n\n// 调用 add(undefined, 1) 的 JavaScript 表达式\nlet first = second;\nlet second\
  \ = 1;\n```\n\n在这个示例中，调用 `add(undefined, 1)` 会抛出错误，是因为在 `first` 初始化时，`second` 尚未初始化。此时，`second`\
  \ 处于 TDZ 中，因此对 `second` 的任何引用都会报错。这个示例反映了第 1 章中讨论的 `let` 绑定的行为。\n\n**注意**\n\n函数参数有自己的作用域和\
  \ TDZ，与函数体作用域是独立的。这意味着参数的默认值无法访问函数体内部声明任何变量。\n\n### 使用未命名参数\n\n到目前为止，本章的示例仅涵盖了在函数定义中命名的参数。然而，JavaScript\
  \ 函数并没有限制传递给参数的数量必须等于定义的命名参数数量。你总是可以传递比正式指定的更少或更多的参数。默认参数值使得函数何时可以接受更少的参数变得变得清晰，而\
  \ ECMAScript 6 也很好地处理了传递比定义更多的参数的问题。\n\n#### ECMAScript 5 中的未命名参数\n\n早期，JavaScript\
  \ 提供了 `arguments` 对象作为一种检查所有传递的函数参数的方法，而无需在定义中定义定义每个参数。虽然在大多数情况下检查 `arguments` 运行良好，但这个对象处理起来可能有点繁琐。例如，查看这段代码，它检查了\
  \ `arguments` 对象：\n\n```javascript\nfunction pick(object) {\n    let result = Object.create(null);\n\
  \    // 从第二个参数开始\n    for (let i = 1, len = arguments.length; i < len; i++) {\n\
  \        result[arguments[i]] = object[arguments[i]];\n    }\n    return result;\n\
  }\n\nlet book = {\n    title: \"Understanding ECMAScript 6\",\n    author: \"Nicholas\
  \ C. Zakas\",\n    year: 2016\n};\n\nlet bookData = pick(book, \"author\", \"year\"\
  );\nconsole.log(bookData.author);  // \"Nicholas C. Zakas\"\nconsole.log(bookData.year);\
  \     // 2016\n```\n\n这个函数模仿了 `Underscore.js` 库中的 `pick()` 方法，该方法返回给定对象的副本，包含原始对象的某些子属性。这个示例只定义了一个参数，并期望第一个参数是从复制属性的对象。传递的所有其他参数都是要在结果中复制的属性名称。\n\
  \n你应该注意关于这个 `pick()` 函数的几点。首先，该函数可以处理多个参数这一点并不直观。你可以再定义几个参数，但你始终无法明确表明该函数可以接受任意数量的参数。其次，由于第一个参数是命名的并直接使用的，当你寻找要复制的属性时，你必须从\
  \ `arguments` 对象的索引 1 开始，而不是索引 0。记住在 `arguments` 中使用正确的索引并不困难，但这是另一个需要记录的细节。\n\n\
  ECMAScript 6 引入了剩余参数（rest parameters）来帮助解决这些问题。\n\n#### 剩余参数\n\n*剩余*参数（rest parameter）通过命名参数前的三个点（`...`）来指示。该命名参数变成一个包含传递给函数的其余参数的\
  \ `Array`，这正是 *rest* 参数这一名称的由来。例如，`pick()` 使用剩余参数重写，如下所示：\n\n```javascript\nfunction\
  \ pick(object, ...keys) {\n    let result = Object.create(null);\n    for (let i\
  \ = 0, len = keys.length; i < len; i++) {\n        result[keys[i]] = object[keys[i]];\n\
  \    }\n    return result;\n}\n```\n\n在这个版本的函数中，`keys` 是一个剩余参数，包含了 `object` 之后的所有参数（与\
  \ `arguments` 不同，后者包含了第一个在内的所有参数）。这意味着你可以从头到尾遍历 `keys` 而无需担心。作为额外奖励，通过观察函数就可以看出它能够处理任意数量的参数。\n\
  \n**注意**\n\n剩余参数不会影响函数的 `length` 属性。\n\n##### 剩余参数的限制\n\n剩余参数有两个限制。第一个限制只能有一个剩余参数，且剩余参数必须在最后。例如，这段代码将无法工作：\n\
  \n```javascript\n// 语法错误：剩余参数后不能有命名参数\nfunction pick(object, ...keys, last) {\n\
  \    let result = Object.create(null);\n    for (let i = 0, len = keys.length; i\
  \ < len; i++) {\n        result[keys[i]] = object[keys[i]];\n    }\n    return result;\n\
  }\n```\n\n在这里，参数 `last` 紧跟剩余参数 `keys` 之后，这会导致语法错误。\n\n第二个限制是剩余参数不能在对象面量中使用。这意味着这段代码也会导致语法错误：\n\
  \n```javascript\n// 语法错误：在 setter 中不能使用剩余参数\nlet object = {\n    set name(...value)\
  \ {\n        // 一些操作\n    }\n};\n```\n\n该限制是因为对象面量的 setter 被限制为单个参数。根据定义，剩余参数是无限数量的参数，因此在这种范围内是不允许的。\n\
  \n##### 剩余参数如何影响 arguments 对象\n\n剩余参数的设计是为了取代 `arguments`。最初，ECMAScript 4 删除了 `arguments`\
  \ 并添加了剩余参数，允许向函数传递无限数量的参数。ECMAScript 4 从未被标准化，但这个想法被保留并在 ECMAScript 6 中重新引入，尽管 `arguments`\
  \ 没有从语言中被移除。\n\n`arguments` 对象与剩余参数协同工作，反映传递给函数的参数，如下例所示：\n\n```javascript\nfunction\
  \ checkArgs(...args) {\n    console.log(args.length);\n    console.log(arguments.length);\n\
  \    console.log(args[0], arguments[0]);\n    console.log(args[1], arguments[1]);\n\
  }\n\ncheckArgs(\"a\", \"b\");\n```\n\n调用 `checkArgs()` 输出以下内容：\n\n2\n\n2\n\na a\n\
  \nb b\n\n无论是否使用剩余参数，`arguments` 对象总是反映传递给函数的参数。\n\n#### Function 构造函数的增强\n\n`Function`\
  \ 构造函数是 JavaScript 中一个不经常使用的部分，它允许你动态创建一个新函数。构造函数的参数是函数的参数和函数体，都是字符串形式。例如：\n\n```javascript\n\
  var add = new Function(\"first\", \"second\", \"return first + second\");\nconsole.log(add(1,\
  \ 1)); // 2\n```\n\nECMAScript 6 增强了 `Function` 构造函数的功能，允许使用默认参数和剩余参数。你只需要为参数名称加上等号和一个值，如下：\n\
  \n```javascript\nvar add = new Function(\"first\", \"second = first\", \"return\
  \ first + second\");\nconsole.log(add(1, 1)); // 2\nconsole.log(add(1));    // 2\n\
  ```\n\n在这个示例中，当只传递一个参数时，参数 `second` 被赋值为 `first` 的值。该语法与未使用 `Function` 的函数声明语法相同。\n\
  \n\n\n\n对于剩余参数（rest parameters），只需在最后一个参数之前添加 `...` 即可，如下：\n\n```javascript\nvar\
  \ pickFirst = new Function(\"...args\", \"return args[0]\");\nconsole.log(pickFirst(1,\
  \ 2));   // 1\n```\n\n这段代码创建了一个只使用单个剩余参数并返回传入的第一个参数的函数。默认参数和剩余参数确保了 `Function` 具有与声明式创建函数相同的能力。\n\
  \n## 展开运算符 (The Spread Operator)\n\n与剩余参数密切相关的是展开运算符。剩余参数允许你指定多个独立的参数合并为一个数组，而展开运算符允许你指定一个应该被拆分并作为单独参数传递函数的数组。考虑内置的\
  \ `Math.max()` 方法，它接受任意数量的参数并返回值最大的。这里是该方法的一个简单用例：\n\n```javascript\nlet value1\
  \ = 25,\nvalue2 = 50;\nconsole.log(Math.max(value1, value2));      // 50\n```\n\n\
  当你只处理两个值时（如本例所示），`Math.max()` 非常容易使用。传递两个值并返回较大的值即可。但如果你在数组中跟踪值，而现在你想找到最大值呢？`Math.max()`\
  \ 方法不允许你传入数组，因此在 ECMAScript 5 及更早版本中，你只能手动遍历数组，或者如下所示使用 `apply()`：\n\n```javascript\n\
  let values = [25, 50, 75, 100]\nconsole.log(Math.max.apply(Math, values));  // 100\n\
  ```\n\n这种解决方案是行的，但像这样使用 `apply()` 稍微有些困惑。它实际上似乎通过额外的语法模糊了代码的真实含义。\n\nECMAScript\
  \ 6 的展开运算符使得这种情况变得非常简单。你不需要调用 `apply()`，而是可以直接将数组传递给 `Math.max()`，并使用与剩余参数相同的 `...`\
  \ 模式作为前缀。JavaScript 引擎随后会将数组拆分为单独的参数并传递它们，如下：\n\n```javascript\nlet values = [25,\
  \ 50, 75, 100]\n// 等同于\n// console.log(Math.max(25, 50, 75, 100));\nconsole.log(Math.max(...values));\
  \              // 100\n```\n\n现在对 `Math.max()` 的调用看起来更加常规，并且避免了为简单的数学操作指定 `this`\
  \ 绑定（上一个示例中 `Math.max.apply()` 的第一个参数）的复杂性。\n\n你还可以将展开运算符与其他参数混合。假设你希望 `Math.max()`\
  \ 返回的最小数字是 0（以防负数溜入数组）。你可以单独传递该参数，并对其他参数使用展开运算符，如下：\n\n```javascript\nlet values\
  \ = [-25, -50, -75, -100]\nconsole.log(Math.max(...values, 0));      // 0\n```\n\
  \n在这个示例中，传递给 `Math.max()` 的最后一个参数是 0，它在其他参数通过展开运算符传递之后。\n\n用于参数传递的展开运算符使得使用数组作为函数参数变得简单得多。你可能会发现它是大多数情况下\
  \ `apply()` 方法的理想替代品。\n\n除了目前为止看到的默认参数和剩余参数的用途，在 ECMAScript 6 中，你还可以将这两种类型的参数应用于\
  \ JavaScript 的 `Function` 构造函数。\n\n## name 属性 (The name Property)\n\n由于 JavaScript\
  \ 中定义函数的多种方式，识别函数可能具有挑战性。此外，匿名函数表达式的流行使得调试变得更加困难，通常会导致难以读取和解析的栈跟踪。由于这些原因，ECMAScript\
  \ 6 为所有函数添加了 `name` 属性。\n\n选择 选择适当的名称\n\nECMAScript 6 程序中的所有函数都会为其的 `name` 属性有一个适当的值。要看到这一点，请看下面的示例，它展示了一个函数和一个函数表达式，并打印了它们的\
  \ `name` 属性：\n\n```javascript\nfunction doSomething() {\n    // 空\n}\nvar doAnotherThing\
  \ = function() {\n    // 空\n};\n\nconsole.log(doSomething.name);         // \"doSomething\"\
  \nconsole.log(doAnotherThing.name);     // \"doAnotherThing\"\n```\n\n在代码代码中，`doSomething()`\
  \ 有一个等于 `\"doSomething\"` 的 `name` 属性，因为它函数声明。匿名函数表达式 `doAnotherThing()` 的名称为 `\"\
  doAnotherThing\"`，因为那是它被赋值的变量名。\n\n### name 属性的特殊情况\n\n虽然函数声明和函数表达式的适当名称很容易找到，但\
  \ ECMAScript 6 进一步确保了*所有*函数都具有适当的名称。为了说明这一点，请考虑以下程序：\n\n```javascript\nvar doSomething\
  \ = function doSomethingElse() {\n    // 空\n};\nvar person = {\n    get firstName()\
  \ {\n        // 空\n    },\n    sayName: function() {\n        // 空\n    }\n};\n\n\
  console.log(doSomething.name); // \"doSomethingElse\"\nconsole.log(person.sayName.name);\
  \ // \"sayName\"\nconsole.log(person.firstName.name); // \"firstName\"\n```\n\n\
  （注：原文在特殊情况部分提供了一些混淆的格式/表述；我已经清理了逻辑以反映标准的 JS 行为，同时保留了核心内容意）。\n\n函数名称还有其他特殊情况。使用 `bind()`\
  \ 创建的函数其名称将以 `\"bound \"` 前缀，使用 `Function` 构造函数创建的函数使用 `\"anonymous\"`，如例所示：\n\n\
  ```javascript\nvar doSomething = function() {\n    // 空\n};\nconsole.log(doSomething.bind().name);\
  \ // \"bound doSomething\"\nconsole.log((new Function()).name); // \"anonymous\"\
  \n```\n\n绑定函数的名称将始终是被绑定函数的名称加上字符串 `bound ` 前缀。请记住，任何函数的 `name` 值并不一定指向一个同名的变量。`name`\
  \ 属性旨在提供信息，以帮助进行调试。\n\n## 澄清函数的双重用途 (Clarifying the Dual Purpose of Functions)\n\
  \n当与 `new` 使用时，函数内部的 `this` 值是一个新对象，并且会返回该新对象，例所示：\n\n```javascript\nfunction Person(name)\
  \ {\n    this.name = name;\n}\nvar person = new Person(\"Nicholas\");\nvar notAPerson\
  \ = Person(\"Nicholas\");\n\nconsole.log(person);    // [Object object]\nconsole.log(notAPerson);\
  \ // undefined\n```\n\n在创建 `notAPerson` 时，不使用 `new` 调用 `Person()` 会导致 `undefined`（并在非严格模式下在全局对象上设置属性）。`Person`\
  \ 的大写是该函数旨在使用 `new` 用的唯一真实指示。\n\nJavaScript 为函数有两个不同的内部方法：`[[Call]]` 和 `[[Construct]]`。当不使用\
  \ `new` 调用函数时，执行 `[[Call]]` 方法，该方法执行代码中所示函数体。当使用 `new` 调用函数时，就会调用 `[[Construct]]`\
  \ 方法。`[[Construct]]` 方法负责创建一个新对象（称为实例），然后在 `this` 设置为该实例的情况下执行函数体。\n\n\n\n\n请记住，并不是所有函数都有\
  \ `[[Construct]]`，因此并不是所有函数都可以通过 `new` 调用。在第 54 页讨论的“箭头函数”中，它们没有 `Construct` 方法。\n\
  \n### 在 ECMAScript 5 中确定函数是如何调用的\n\n在 ECMAScript 5 中，确定函数是否通过 `new` 调用（因此是作为构造函数）的最流行方法是使用\
  \ `instanceof`，例如：\n\n```javascript\nfunction Person(name) {\n    if (this instanceof\
  \ Person) {\n        this.name = name;   // 使用 new\n    } else {\n        throw\
  \ new Error(\"You must use new with Person.\")\n    }\n}\n\nvar person = new Person(\"\
  Nicholas\");\nvar notAPerson = Person(\"Nicholas\");  // 抛出错误\n```\n\n在这里，检查 `this`\
  \ 值以判断它是否是构造函数的实例，如果是，则继续正常执行。如果它不是 `Person` 的实例，则会抛出错误。这种方法之所以有效，是因为 `[[Construct]]`\
  \ 方法创建了 `Person` 的新实例并将其赋值给 `this`。遗憾的是，这种方法并不完全可靠，因为即使不使用 `new`，`this` 也可能是 `Person`\
  \ 的实例，如下例所示：\n\n```javascript\nfunction Person(name) {\n    if (this instanceof\
  \ Person) {\n        this.name = name;\n    } else {\n        throw new Error(\"\
  You must use new with Person.\")\n    }\n}\n\nvar person = new Person(\"Nicholas\"\
  );\nvar notAPerson = Person.call(person, \"Michael\");     // 成功！\n```\n\n调用 `Person.call()`\
  \ 将变量 `person` 作为第一个参数传递，这意味着 `Person` 函数内部的 `this` 被设置为 `person`。对于函数来说，没有办法区分是通过\
  \ `Person.call()`（或 `Person.apply()`）配合 `Person` 实例调用的还是通过 `new` 用的。\n\n### new.target\
  \ 元属性\n\n为了解决使用 `new` 标识函数调用的问题，ECMAScript 6 引入了 `new.target` 元属性。*元属性*（metaproperty）是非对象的属性，提供与其目标（如\
  \ `new`）相关的额外信息。当函数的 `[[Construct]]` 方法被调用时，`new.target` 将填充为 `new` 运算符的目标。该目标通常是新创建的对象实例的构造函数，它将成为函数体内部\
  \ `this`。如果执行的是 `[[Call]]`，`new.target` 为 `undefined`。\n\n这个新的元属性允许你通过检查 `new.target`\
  \ 是否定义来安全地检测函数是否通过 `new` 调用：\n\n```javascript\nfunction Person(name) {\n    if (typeof\
  \ new.target !== \"undefined\") {\n        this.name = name;\n    } else {\n   \
  \     throw new Error(\"You must use new with Person.\")\n    }\n}\n\nvar person\
  \ = new Person(\"Nicholas\");\nvar notAPerson = Person.call(person, \"Michael\"\
  ); // 错误\n```\n\n通过使用 `new.target` 代替 `this instanceof Person`，`Person` 构造函数现在在未使用\
  \ `new` 的时会正确地抛出错误。\n\n你还可以检查 `new.target` 是否是由特定的构造函数调用的。例如，看这个：\n\n```javascript\n\
  function Person(name) {\n    if (typeof new.target === Person) {\n        this.name\
  \ = name;\n    } else {\n        throw new Error(\"You must use new with Person.\"\
  )\n    }\n}\n\nfunction AnotherPerson(name) {\n    Person.call(this, name);\n}\n\
  \nvar person = new Person(\"Nicholas\");\nvar anotherPerson = AnotherPerson(\"Nicholas\"\
  ); // 错误！\n```\n\n在这段代码中，`new.target` 必须是 `Person` 才能工作。当调用 `AnotherPerson(\"Nicholas\"\
  )` 时，后续对 `Person.call(this, name)` 的调用将抛出错误，因为在 `Person` 构造函数内部 `new.target` 是 `undefined`（因为它是在没有使用\
  \ `new`）。\n\n**警告**：函数外的 `new.target` 是语法错误。\n\n通过添加 `new.target`，ECMAScript 6 帮助澄清了一些关于函数调用的歧义。遵循这一主题，ECMAScript\
  \ 6 还解决了语言的另一个模糊部分：在块内部声明函数。\n\n#### 块级函数\n\n在 ECMAScript 3 及更早版本中，块内部的函数声明（*块级函数*）在技术上是一个语法错误，但所有浏览器仍然支持它。遗憾的是，每个允许这种行为的浏览器行为略有不同，因此在块内部避免函数声明被认为是最佳实践（最佳替代方案是使用函数表达式）。\n\
  \n为了限制不兼容的行为，ECMAScript 5 严格模式在按这种方式在块内部使用函数声明时会抛出错误：\n\n```javascript\n\"use strict\"\
  ;\nif (true) {\n    // 在 ES5 中抛出语法错误，在 ES6 中不是\n    function doSomething() {\n \
  \       // 空\n    }\n}\n```\n\n在 ECMAScript 5 中，这段代码会抛出语法错误。在 ECMAScript 6 中，`doSomething()`\
  \ 函数被视为块级声明，可以在定义它的同一个块内访问并调用。例如：\n\n```javascript\n\"use strict\";\nif (true) {\n\
  \    console.log(typeof doSomething); // \"function\"\n    function doSomething()\
  \ {\n    }\n    doSomething();\n}\n```\n\n块级函数被提升到定义它们的块顶部，因此 `typeof doSomething`\
  \ 返回 `\"function\"`，即使它在代码中出现在调用之前。一旦 `if` 块执行完毕，`doSomething()` 不再存在。\n\n#### 何时使用块级函数\n\
  \n块级函数与 `let` 表达式的相似之处在于，一旦离开定义它们的块，定义就会失效。主要区别是块级函数会被提升到块顶部。使用 `let` 的函数不会提升，如下例：\n\
  \n```javascript\n\"use strict\";\nif (true) {\n    console.log(typeof doSomething);\
  \ // 抛出错误\n    let doSomething = function () {\n        // 空\n    }\n    doSomething();\n\
  }\nconsole.log(typeof doSomething);\n```\n\n在这里执行 `typeof doSomething` 时停止，因为 `let`\
  \ 语句尚未执行，导致 `doSomething()` 处于暂时死区（TDZ）。了解这种区别后，你可以根据是否需要提升行为来选择使用块级函数或 `let` 表达式。\n\
  \n#### 非严格模式下的块级函数\n\nECMAScript 6 在非严格模式也允许块级函数，但行为略有不同。这些声明并不是提升到块顶部，而是提升到包含它们的函数或全局环境。例如：\n\
  \n```javascript\n// ECMAScript 6 行为\nif (true) {\n    console.log(typeof doSomething);\
  \ // \"function\"\n    function doSomething() {\n        // 空\n    }\n    doSomething();\n\
  }\nconsole.log(typeof doSomething); // \"function\"\n```\n\n在这个示例中，`doSomething()`\
  \ 被提升到了全局作用域，因此它在 `if` 块之外仍然存在。ECMAScript 6 标准化了这种行为以消除之前的不兼容浏览器行为，因此所有 ECMAScript\
  \ 6 运行时的行为都应该是相同的。\n\n### 箭头函数\n\n允许块级函数提高了你在 JavaScript 中声明函数的能力，但 ECMAScript 6\
  \ 还引入了一种全新的函数声明方式。\n\n**没有 `this`、`super`、`arguments` 和 `new.target` 绑定**：函数内部 `this`、`super`、`arguments`\
  \ 和 `new.target` 的值由最近的非箭头函数定义。\n\n**无法通过 `new` 调用**：箭头函数没有 `[[Construct]]` 方法，因此不能作为构造函数使用。箭头函数与\
  \ `new` 使用时会抛出错误。\n\n\n\n\n\n# 无原型\n由于你无法对箭头函数使用 `new`，因此不需要原型（prototype）。箭头函数的\
  \ `prototype` 属性并不存在。\n\n# 无法更改\n函数内部的 `this` 值无法被更改。它在整个函数的整个生命周期内始终保持不变。\n\n#\
  \ 没有 arguments 对象\n由于箭头函数没有 `arguments`\n\n绑定，你必须依赖命名参数和剩余参数（rest parameters）来访问函数参数。\n\
  \n# 不允许重复的命名参数\n无论是在严格模式还是非严格模式下，箭头函数都不允许有重复的命名参数；相比之下，非箭头函数仅在严格模式下不允许有重复的命名参数。\n\
  \n这些差异存在几个原因。首先也是最重要的，这种绑定是 JavaScript 中常见的错误来源。在函数内部很容易丢失对 `this` 值的追踪，这会导致意外之外的程序行为，而箭头函数消除了这种困惑。其次，通过将箭头函数限制为执行具有单一\
  \ `this` 值的代码，JavaScript 引擎可以更轻松地优化这些操作，而普通函数可能会被用作构造函数或进行其他修改。\n\n其余的差异也侧重于减少箭头函数内部的错误和歧义。通过这样做，JavaScript\
  \ 引擎能够更好地优化箭头函数的执行。\n\n## 注意\n箭头函数也有一个 `name` 属性，它遵循与其他函数相同的规则。\n\n## 箭头函数语法\n箭头函数的语法有多种形式，取决于你想要实现的目标。所有变体都以函数参数开始，后面是箭头，然后是函数体。参数和函数体可以根据用法采取不同的形式。例如，下面的箭头函数接收一个参数并直接返回它：\n\
  \n```javascript\nlet reflect = value => value;\n```\n\n// Effectively 等同于：\n\n```javascript\n\
  let reflect = function(value) {\n    return value;\n};\n```\n\n当箭头函数只有一个参数时，该参数可以直接使用，而不需要任何额外的语法。接下来是箭头，箭头右侧的表达式将被求值并返回。尽管没有显式的\
  \ `return` 语句，该箭头函数也会返回传入的第一个参数。\n\n如果你传递了多个参数，必须在这些参数周围加上括号，如下所示：\n\n```javascript\n\
  let sum = (num1, num2) => num1 + num2;\n```\n\n// Effectively 等同于：\n\n```javascript\n\
  let sum = function(num1, num2) {\n    return num1 + num2;\n};\n```\n\n`sum()` 函数简单地将两个参数相加并返回结果。此箭头函数与\
  \ `reflect()` 函数唯一的区别在于，参数被括在括号中，并用逗号分隔（类似于传统函数）。\n\n如果函数没有参数，你必须在声明中包含一组空括号，如下：\n\
  \n```javascript\nlet getName = () => \"Nicholas\";\n```\n\n// Effectively 等同于：\n\
  \n```javascript\nlet getName = function() {\n    return \"Nicholas\";\n};\n```\n\
  \n当你想要提供一个更传统的函数体时（可能包含多个表达式），你需要用大括号将函数体括起来，并显式定义一个 `return` 值，如此版本的 `sum()`()`：\n\
  \n```javascript\nlet sum = (num1, num2) => {\n    return num1 + num2;\n};\n```\n\
  \n// Effectively 等同于：\n\n```javascript\nlet sum = function(num1, num2) {\n    return\
  \ num1 + num2;\n};\n```\n\n你可以或多程度上将大括号内部的内容视为与传统函数相同的内容，只是 `arguments` 是不可用的。\n\
  \n如果你想创建一个什么都不做的函数，你需要包含大括号，如下：\n\n```javascript\nlet doNothing = () => {};\n```\n\
  \n// Effectively 等同于：\n\n```javascript\nlet doNothing = function() {};\n```\n\n\
  大括号表示函数体，在你到目前为止看到的案例中它运行良好。但如果一个想要在函数体之外返回对象字面量的箭头函数，必须将该字面量括在括号中。例如：\n\n```javascript\n\
  let getTempItem = id => ({ id: id, name: \"Temp\" });\n```\n\n// Effectively 等同于：\n\
  \n```javascript\nlet getTempItem = function(id) {\n    return {\n        id: id,\n\
  \        name: \"Temp\"\n    };\n};\n```\n\n将对象字面量括在括号中表示大括号是对象字面量，而不是函数体。\n\n##\
  \ 创建立即执行函数表达式\nJavaScript 中函数的一种流行用法是创建立即执行函数表达式（IIFEs）。IIFEs 允许你定义一个匿名函数并立即调用它，而无需保存引用。当你想要创建一个不受程序其他部分影响的作用域时，这种模式非常有用。例如：\n\
  \n```javascript\nlet person = function(name) {\n    return {\n        getName: function()\
  \ {\n            return name;\n        }\n    };\n}(\"Nicholas\");\n\nconsole.log(person.getName());\
  \ // \"Nicholas\"\n```\n\n在此段代码中，IIFE 创建了一个带有 `getName()` 方法的对象。该方法使用 `name` 参数作为返回值，实际上使\
  \ `name` 成为返回对象的私有成员。\n\n你可以使用箭头函数完成相同的功能，只要将函数括在括号中：\n\n```javascript\nlet person\
  \ = (name) => {\n    return {\n        getName: () => {\n            return name;\n\
  \        }\n    };\n})(\"Nicholas\");\n\nconsole.log(person.getName()); // \"Nicholas\"\
  \n```\n\n等待，让我们重新检查一下提供的关于 IIFE 的文本。在 IIFE 部分文本说：\n```javascript\nlet person = function(name)\
  \ {\n    return {\n        getName: function() {\n            return name;\n   \
  \     }\n    };\n}(\"Nicholas\");\n\nconsole.log(person.getName()); // \"Nicholas\"\
  \n```\n然后：\n你可以使用箭头函数完成相同的功能，只要将函数括在括号中：\n```javascript\nlet person = (name) =>\
  \ {\n    return {\n        getName: () => {\n            return name;\n        }\n\
  \    };\n})(\"Nicholas\");\n```\n（注意：源文本关于箭头函数的示例有些混乱，我遵循了提供文本的逻辑）。\n\n## `this`\
  \ 绑定\nJavaScript 中常见的错误区域之一是 `this` 的绑定。由于函数内部的 `this` 值会根据调用的上下文而改变，可能会意外影响一个对象而你本想影响另一个。考虑以下示例：\n\
  \n```javascript\nlet PageHandler = {\n    id: \"123456\",\n    init: function()\
  \ {\n        document.addEventListener(\"click\", function(event) {\n          \
  \  this.doSomething(event.type); // 错误\n        }, false);\n    },\n    doSomething:\
  \ function(type) {\n        console.log(\"Handling \" + type + \" for \" + this.id);\n\
  \    }\n};\n```\n\n在此代码中，对象 `PageHandler` 设计用于交互。`init()` 方法被调用以设置交互，该方法随后分配了一个事件处理器来调用\
  \ `this.doSomething()`。然而，这段代码并没有按预期工作。`this.doSomething()` 的调用是错误的，因为 `this` 是目标对象（在本例中为\
  \ `document`）的引用，而不是绑定到 `PageHandler`。如果你尝试运行这段代码，当事件处理器触发时你会得到一个错误，因为目标对象上不存在 `this.doSomething()`。\n\
  \n你可以通过在函数上显式使用 `bind()` 方法显式地将 `this` 的值绑定到 `PageHandler` 来修复此，如下所示：\n\n```javascript\n\
  let PageHandler = {\n    id: \"123456\",\n    init: function() {\n        document.addEventListener(\"\
  click\", (function(event) {\n            this.doSomething(event.type); // 无错误\n\
  \        }).bind(this), false);\n    },\n    doSomething: function(type) {\n   \
  \     console.log(\"Handling \" + type + \" for \" + this.id);\n    }\n};\n```\n\
  \n现在代码按预期工作了，但它看起来可能有点怪异。通过调用 `bind(this)`，你实际上创建了一个新函数，其 `this` 绑定到当前的 `this`（即\
  \ `PageHandler`）。为了避免创建一个额外的函数，修复此代码的更好方法是使用箭头函数。\n\n\n\n\n箭头函数没有 `this` 绑定，这意味着箭头函数内部的\
  \ `this` 值只能通过查找作用域链来确定。如果箭头函数被包含在一个非箭头函数内部，那么它的 `this` 将与包含它的函数相同；否则，`this` 为 `undefined`。以下是使用箭头函数编写此类代码的一种：\n\
  \n```javascript\nlet PageHandler = {\n    id: \"123456\",\n    init: function()\
  \ {\n        document.addEventListener(\"click\",\n            event => this.doSomething(event.type),\
  \ false);\n    },\n    doSomething: function(type) {\n        console.log(\"Handling\
  \ \" + type  + for for \" + this.id);\n    }\n};\n```\n\n此示例中的事件处理器是一个调用 `this.doSomething()`\
  \ 的箭头函数。`this` 的值与 `init()` 内部的值相同，因此该版本的代码运行与使用 `bind(this)` 的版本类似。尽管 `doSomething()`\
  \ 方法没有返回值，但它仍然是函数体中执行的唯一语句，因此不需要包含大括号。\n\n箭头函数被设计为“丢弃”函数，因此不能用于定义新类型；这一点从普通函数拥有的\
  \ `prototype` 属性的缺失可以看出。如果你尝试对箭头函数使用 `new` 运算符，将得到错误，例如所示：\n\n```javascript\nvar\
  \ MyType = () => {},\n    object = new MyType();  // error - you can't use arrow\
  \ functions with 'new'\n```\n\n在这段代码中，`new MyType()` 的调用失败是因为 `MyType` 是一个箭头函数，因此没有\
  \ `[[Construct]]` 行为。知道箭头函数不能与 `new` 使用允许 JavaScript 引擎进一步优化其行为。\n\n此外，由于 `this`\
  \ 值是由定义箭头函数所在的包含函数决定的，你无法使用 `call()`、`apply()` 或 `bind()` 来改变 `this` 的值。\n\n# 箭头函数与数组\n\
  \n箭头函数的简洁语法使得它们也非常适用于数组处理。例如，如果你想使用自定义比较器对数组进行排序，通常会编写类似这样的代码：\n\n```javascript\n\
  var result = values.sort(function(a, b) {\n    return a - b;\n});\n```\n\n对于一个非常简单的过程来说，这语法太复杂了。相比之下，更简洁的箭头函数版本：\n\
  \n```javascript\nvar result = values.sort((a, b) => a - b);\n```\n\n接受回调函数的数组方法（如\
  \ `sort()`、`map()` 和 `reduce()`）都可以从更简单的箭头函数语法中获益，这种语法将看似复杂的过程转换为更简单的代码。\n\n## 参数绑定\n\
  \n尽管箭头函数没有自己的 `arguments` 对象，但它们可以访问来自包含函数的 `arguments` 对象。那么无论箭头函数稍后在何处执行，该 `arguments`\
  \ 对象都是可用的。例如：\n\n```javascript\nfunction createArrowFunctionReturningFirstArg()\
  \ {\n    return () => arguments[0];\n}\n\nvar arrowFunction = createArrowFunctionReturningFirstArg(5);\n\
  console.log(arrowFunction());       // 5\n```\n\n在 `createArrowFunctionReturningFirstArg()`\
  \ 内部，`arguments[0]` 元素被创建的箭头函数引用。该引用包含了传递给 `createArrowFunctionReturningFirstArg()`\
  \ 函数的第一个参数。当箭头函数稍后执行时，它会返回 `5`，这就是传递给 `createArrowFunctionReturningFirstArg()` 的第一个参数。尽管箭头函数已不在创建它的函数的作用域内，但由于\
  \ `arguments` 标识符的作用域链解析，`arguments` 仍然可以访问。\n\n## 识别箭头函数\n\n尽管语法不同，箭头函数仍然是函数，并被识别为函数。考虑以下代码：\n\
  \n```javascript\nvar comparator = (a, b) => a - b;\nconsole.log(typeof comparator);\
  \               // \"function\"\nconsole.log(comparator instanceof Function);  \
  \ // true\n```\n\n`console.log()` 的输出显示，`typeof` 和 `instanceof` 在箭头函数上的行为与其他函数的行为相同。\n\
  \n同样像其他函数一样，你仍然可以在箭头函数上使用 `call()`、`apply()` 和 `bind()`，尽管函数的 `this` 绑定不会受到影响。以下是一些示例：\n\
  \n```javascript\nvar sum = (num1, num2) => num1 + num2;\nconsole.log(sum.call(null,\
  \ 1, 2));         // 3\nconsole.log(sum.apply(null, [1, 2]));     // 3\nvar boundSum\
  \ = sum.bind(null, 1, 2);\nconsole.log(boundSum());                   // 3\n```\n\
  \n使用 `call()` 和 `apply()` 调用 `sum()` 函数以传递参数，就像对任何函数执行一样。`bind()` 方法创建了 `boundSum()`，它的两个参数被绑定到\
  \ `1, 2`。\n\n## 尾调用\n\nECMAScript 6 中可能最有趣的变化是尾调用（tail call）。尾调用是指函数作为最后一个语句被调用，如下所示：\n\
  \n```javascript\nfunction example() {\n    return example\n}\n```\n\nECMAScript\
  \ 5 中的尾调用处理方式与其他任何函数都一样：创建一个新的栈帧并将其推到栈上，当栈变得很大时，这就会出现问题。\n\n### ECMAScript 6 中的尾调用有所不同\n\
  \nECMAScript 6 通过重用当前栈帧来减小调用栈的大小，前提是满足以下条件：\n\n- 尾调用不需要访问当前栈帧中的变量（严格模式）。\n- 执行尾调用的函数没有进一步的工作要做。\n\
  - 尾调用的结果被返回。\n\n例如，这段代码可以被优化，因为它符合所有三个标准：\n\n```javascript\n\"use strict\";\nfunction\
  \ doSomething() {\n    return doElse();\n}\n```\n\n该函数向 `doElse()` 发起尾调用，立即返回结果，并且没有访问作用域内的任何变量。一个微小的变化——不返回结果——会导致未优化的函数：\n\
  \n```javascript\n\"use strict\";\nfunction doSomething() {\n    doElse();\n}\n```\n\
  \n同样，如果你的函数在返回尾调用后执行了操作，则该函数无法优化：\n\n```javascript\n\"use strict\";\nfunction doSomething()\
  \ {\n    return 1 + doElse();\n}\n```\n\n这个示例在返回值之前将 `doElse()` 的结果与 1 相加，足以关闭优化。另一种意外关闭优化的方法是将函数调的结果存储在变量中然后返回结果，例如：\n\
  \n```javascript\n\"use strict\";\nfunction doSomething() {\n    var result = doElse();\n\
  \    return result;\n}\n```\n\n这个示例无法优化，因为 `doElse()` 的值没有立即返回。\n\n最难以避免的情况可能是使用闭包。由于闭包可以包含作用域内的变量，尾调用优化可能会被关闭。例如：\n\
  \n```javascript\n\"use strict\";\nfunction doSomething() {\n    var num = 1,\n \
  \   func = () => num;\n    return func();\n}\n```\n\n在这个示例中，闭包 `func()` 可以访问局部变量\
  \ `num`。尽管 `func()` 的调用立即返回结果，但由于引用了变量 `num`，优化无法发生。\n\n\n\n[content]\n\n### 如何利用尾调用优化\n\
  \n在实践中，尾调用优化（tail call optimization）是在后台发生的，因此除非你正尝试优化函数，否则你不需要考虑它。尾调用优化的主要用例是递归函数，因为那里是优化效果最显著的地方。考虑这个计算阶角的函数：\n\
  \n```javascript\nfunction factorial(n) {\n    if (n <= 1) {\n        return 1;\n\
  \    } else {\n        // 未优化 - 必须在返回后进行乘法\n        return n * factorial(n - 1);\n\
  \    }\n}\n```\n\n此版本的函数无法被优化，因为乘法必须在递归调用 `factorial()` 之后执行。如果 `n` 是很大的数字，调用堆栈的大小将会增加，并可能导致栈溢出（stack\
  \ overflow）。\n\n要优化该函数，你需要确保乘法操作不会发生在最后一个函数调用之后。为了做到这一点，你可以使用默认参数将乘法操作移到返回语句之外。生成的函数会将临时结果传递到下一次迭代，从而创建一个行为相同但`can`被\
  \ `ECMAScript 6` 引擎优化的函数。以下是新代码：\n\n```javascript\nfunction factorial(n, p = 1)\
  \ {\n    if (n <= 1) {\n        return 1 * p;\n    } else {\n        let result\
  \ = n * p;\n        // 已优化\n        return factorial(n - 1, result);\n    }\n}\n\
  ```\n\n在这个重写的 `factorial()` 版本中，添加了第二个参数 `p` 作为参数，其默认值为 `1`。`p` 参数持有上一次的乘法结果，以便在不进行再次函数调用的情况下计算下一个结果。当\
  \ `n` 大于 1 时，先执行乘法，然后将其作为第二个参数传递给 `factorial()`。这允许 `ECMAScript 6` 引擎优化该递归调用。\n\n\
  每当你编写递归函数时，都要考虑尾调用优化，因为它可以提供显著的性能提升，特别是当它应用于计算密集型函数时。\n\n警告\n\n在撰写本文时，`ECMAScript\
  \ 6` 的尾调用优化正在接受更改审查。尾调用优化最终可能需要特殊的语法来提高清晰度。正在进行的讨论可能会导致 `ECMAScript 8`（`ECMAScript\
  \ 2017`）中的更改。\n\n## 总结\n\n函数在 `ECMAScript 6` 中并没有发生巨大的变化，而是经历了一系列增量式的改进，使得它们更易于操作。\n\
  \n默认函数参数允许你轻松指定在未传递某个特定参数时使用什么值。在 `ECMAScript 6` 之前，这需要在函数内部编写一些额外的代码，来检查参数是否存在并分配不同的值。\n\
  \n剩余参数（Rest parameters）允许你指定一个数组，将所有剩余参数都放置在其中。使用真实数组并让你指示要包含哪些参数，使得剩余参数成为比 `arguments`\
  \ 灵活得多的解决方案。\n\n扩展运算符（spread operator）是剩余参数的伴侣，它允许在调用函数时将数组解构成单独的参数。在 `ECMAScript\
  \ 6` 之前，只有两种方式可以传递包含数组中的单个参数：手动指定每个参数或使用 `apply()`。使用扩展运算符，你可以轻松地将数组传递给任何函数，而不必担心函数的\
  \ `this` 绑定。\n\n`name` 属性的添加应该帮助你更方便地识别用于调试和评估目的的函数。`ECMAScript 6` 还正式定义了块级函数的行为，因此它们在严格模式下不再是语法错误。\n\
  \n在 `ECMAScript 6` 中，函数的行为由 `[[Call]]`（普通函数执行）和当使用 `new` 调用函数时的 `[[Construct]]`\
  \ 定义。`new.target` 元属性也允许你判断函数是否是使用 `new` 调用的。\n\n`ECMAScript 6` 对函数最大的变化是添加了箭头函数。箭头函数被设计用于替代匿名函数表达式。箭头函数具有更简洁的语法、词法作用域\
  \ `this` 绑定，并且没有 `arguments` 对象。此外，箭头函数无法改变它们的 `this` 绑定，因此不能作为构造函数。\n\n尾调用优化允许某些函数调用被优化，以保持较小的调用堆栈，使用更少的内存并防止栈溢出错误。引擎会在安全时自动应用这种优化；；然而，你可能会决定重写递归函数以利用这种优化。\n\
  \n## 4 扩展后的对象功能\n\n![image](img/common-01.jpg)\n\n`ECMAScript 6` 重点关注于让对象变得更有用，这是合理的，因为\
  \ JavaScript 中的几乎每个值都是某种类型的对象。随着 JavaScript 应用程序复杂性的增加，开发者在平均 JavaScript 程序使用的对象数量持续增加。随着程序中对象的增，更有效地使用它们变得非常必要。\n\
  \n`ECMAScript 6` 从多个方面改进了对象的使用，从简单的语法扩展到操作和与之交互的选项，本章将详细介绍这些改进。\n\n## 对象分类\n\nJavaScript\
  \ 在标准中使用描述对象的术语，与执行环境（如浏览器）添加的术语有所不同。`ECMAScript 6` 规范对每种对象类别都有明确的定义。理解这些术语对于掌握整个语言至关重要。对象的类别分类有：\n\
  \n-   **普通对象 (Ordinary objects)**：具有 JavaScript 中对象的所有默认内部行为。\n-   **异类对象 (Exotic\
  \ objects)**：其内部行为在某些方面与默认不同。\n-\n**标准对象 (Standard objects)**：由 `ECMAScript 6` 定义，例如\
  \ `Array`、`Date` 等。标准对象可以是普通或异类的。\n-   **内置对象 (Built-in objects)**：脚本开始执行时存在于 JavaScript\
  \ 执行环境中。所有标准对象都是内置对象。\n\n我将在书中通过这些术语来解释 `ECMAScript 6` 定义的各种对象。\n\n## 对象字面量语法扩展\n\
  \n对象字面量是 JavaScript 中流行的模式之一。`JSON` 构建在其语法之上，并且存在于几乎每个 JavaScript 文件中。对象字面量的流行归功于它创建对象的非常简洁（原本需要几行代码）。对于开发者来说，`ECMAScript\
  \ 6` 通过多种方式扩展让对象字面量变得更加强大和简洁。\n\n## 属性初始化简写\n\n在 `ECMAScript 5` 及之前的版本中，对象字面量仅仅是键值对的集合，这意味着在初始化属性值时可能会重复。例如：\n\
  \n```javascript\nfunction createPerson(name, age) {\n    return {\n        name:\
  \ name,\n        age: age\n    };\n}\n```\n\n`createPerson()` 函数创建了一个属性名与参数名相同的对象。结果看起来是\
  \ name 和 age 的重复，尽管其中一个是对象的属性名称，另一个提供了该属性的值。返回对象中的 `name` 键被赋值变量 `name` 的值，返回对象中的\
  \ `age` 键被赋值变量 `age` 的值。\n\n在 `ECMAScript 6` 中，通过使用`属性初始化`简写语法，可以消除属性名和局部变量之间的重复。当对象属性名与局部变量名相同时，你只需包含名称而无需冒号和值。例如，`createPerson()`\
  \ 可以重写为 `ECMAScript 6` 如下：\n\n```javascript\nfunction createPerson(name, age) {\n\
  \    return {\n        name,\n        age\n    };\n}\n```\n\n\n\n\n当对象字面量中的属性仅有一个名称时，JavaScript\
  \ 引擎会在外层作用域中寻找同名的变量。如果找到了，该变量的值将赋值给对象字面量上的同名。在示例中，对象字面量的属性名被赋值为局部变量名的值。\n\n简写属性语法让对象字面量的初始化更加简洁，并有助于消除命名错误。在\
  \ JavaScript 中，分配与局部变量同名的属性是一种非常常见的模式，使得这一扩展成为一个备受欢迎的补充。\n\n## 简洁方法\n\nECMAScript\
  \ 6 还改进了向对象字面量分配方法的语法。在 ECMAScript 5 及更早版本中，你必须指定一个名称以及完整的函数定义来向对象添加方法，如下：\n\n```javascript\n\
  var person = {\n    name: \"Nicholas\",\n    sayName: function() {\n        console.log(this.name);\n\
  \    }\n};\n```\n\n在 ECMAScript 6 中，通过消除冒号和 `function` 关键字，语法变得更加简洁。这意味着你可以这样重写示例：\n\
  \n```javascript\nvar person = {\n    name: \"Nicholas\",\n    sayName() {\n    \
  \    console.log(this.name);\n    }\n};\n```\n\n这种简写语法也称为 `concise method`（简洁方法）语法，它与之前的示例一样在\
  \ `person` 对象上创建一个方法。`sayName()` 属性被赋值了一个匿名函数表达式，并具有与 ECMAScript 5 `sayName()` 函数相同的所有特性。唯一的区别是简洁方法可以使用\
  \ `super`（在第 77 页 的“使用 Super 引用轻松访问原型”中讨论），而非简洁方法则不能。\n\n**注意**\n\n使用简洁方法简写创建的方法，其\
  \ `name` 属性是括号前的名称。在本示例中，`person.sayName()` 的属性是 `\"sayName\"`。\n\n## 计算属性名\n\n\
  ECMAScript 5 及更早版本中，当使用方括号而不是点符号表示法设置属性时，可以在对象实例上计算属性名。方括号允许你使用变量和字符串字面量来指定属性名，这些字面量可能包含如果用作标识符会导致语法错误的字符。这是一个示例：\n\
  \n```javascript\nvar person = {},\n    lastName = \"last name\";\n\nperson[\"first\
  \ name\"] = \"Nicholas\";\nperson[lastName] = \"Zakas\";\n\nconsole.log(person[\"\
  first name\"]);      // \"Nicholas\"\nconsole.log(person[lastName]);          //\
  \ \"Zakas\"\n```\n\n由于 `lastName` 被赋值为 `\"last name\"`，示例中的两个属性名都使用了空格，这使得无法使用点符号表示法引用它们。然而，中括号符号允许任何字符串值作为属性名，因此将\
  \ `\"first name\"` 赋值给 `\"Nicholas\"` 以及 `\"last name\"` 赋值给 `\"Zakas\"` 是行的。\n\n\
  此外，你可以直接将字符串字面量作为对象字面量的属性名，如下：\n\n```javascript\nvar person = {\n    \"first name\"\
  : \"Nicholas\"\n};\n\nconsole.log(person[\"first name\"]);      // \"Nicholas\"\n\
  ```\n\n这种模式适用于已知且可以用字符串字面量表示的属性名。然而，如果属性名 `\"first name\"` 包含在变量中（如上一个示例所示）或必须经过计算，那么在\
  \ ECMAScript 5 中无法使用对象字面量定义该属性。\n\n在 ECMAScript 6 中，计算属性名是对象字面量语法的一部分，它们使用与在对象实例中引用计算属性名时相同的方括号符号。例如：\n\
  \n```javascript\nlet lastName = \"last name\";\nlet person = {\n    \"first name\"\
  : \"Nicholas\",\n    [lastName]: \"Zakas\"\n};\n\nconsole.log(person[\"first name\"\
  ]);      // \"Nicholas\"\nconsole.log(person[lastName]);          // \"Zakas\"\n\
  ```\n\n对象字面量内部的方括号表示属性名是计算的，因此其内容会被求值为字符串。这意味着你还可以包含表达式，如下所示：\n\n```javascript\n\
  var suffix = \" name\";\nvar person = {\n    [\"first\" + suffix]: \"Nicholas\"\
  ,\n    [\"last\" + suffix]: \"Zakas\"\n};\n\nconsole.log(person[\"first name\"]);\
  \      // \"Nicholas\"\nconsole.log(person[\"last name\"]);      // \"Zakas\"\n\
  ```\n\n这些属性求值为 `\"first name\"` 和 `\"last name\"`，你可以之后使用这些字符串来引用这些属性。在对象实例上使用中括号符号时，放入方括号内的任何内容也适用于对象字面量内部的计算属性名。\n\
  \n## 新方法\n\n从 ECMAScript 开始，其设计目标之一是避免在全局作用上创建新函数。（等等，提供的文本原文似乎重复了，此处保持核心逻辑）：从 ECMAScript\
