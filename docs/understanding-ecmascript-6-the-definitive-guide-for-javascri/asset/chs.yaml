  此外，感谢在 `Patreon` 上支持本书的 `Casey Visco`。\n\n# 引言\n\nJavaScript 核心语言特性在 `ECMA-262`\
  \ 标准中定义。该标准定义的语言被称为 `ECMAScript`。你在浏览器和 `Node.js` 中通常认知的 JavaScript 实际上是 `ECMAScript`\
  \ 的超集。浏览器和 `Node.js` 通过额外的对象和方法增加了更多功能，但 JavaScript 的核心仍然保持 `ECMAScript` 所定义的样。`ECMA-262`\
  \ 的持续开发对 JavaScript 整体的成功至关重要，本书涵盖了该语言最近一次重大更新带来的变化：`ECMAScript 6`。\n\n## 通往 ECMAScript\
  \ 6 之路\n\n2007 年，JavaScript 处于一个十字路口。`Ajax` 的流行开启了动态 Web 应用的新时代，而 JavaScript 自 1999\
  \ 年发布 `ECMA-262` 第三版以来就没有发生过变化。负责推动 `ECMAScript` 开发进程的委员会 `TC-39` 制定了一份庞大的 `ECMAScript\
  \ 4` 草案规范。`ECMAScript 4` 的范围非常巨大，对语言引入了微小和重大的变化。更新后的特性包括新语法、模块、类、经典继承、私有对象成员、可选类型注解等。\n\
  \n`ECMAScript 4` 变更的范围导致 `TC-39` 内部产生了分歧：一些成员认为第四版试图完成的任务太多了。来自 `Yahoo!``、`Google`\
  \ 和 `Microsoft` 的一组领导者为 `ECMAScript` 的下一个版本创建了一个替代提案，该小组最初将其命名为 `ECMAScript 3.1`。“3.1”这一标记旨在表明该版本是对现有标准的增量式更改。\n\
  \n`ECMAScript 3.1` 引入了极少的语法变化；相反，它专注于属性特性、原生 `JSON` 支持以及向已有的对象添加方法。尽管曾尝试调和 `ECMAScript\
  \ 3.1` 和 `ECMAScript 4`，但这些努力最终失败了，因为两个阵营很难就语言应该如何成达成其截然不同的观点。\n\n2008 年，JavaScript\
  \ 的创造者 `Brendan Eich` 宣布 `TC-39` 将集中精力在标准化 `ECMAScript 3.1` 上。\n\n此外，感谢在 `Patreon`\
  \ 上支持本书的 `Casey Visco`。\n\n![image](img/common-01.jpg)\n\nJavaScript 核心语言特性定义在 `ECMA-262`\
