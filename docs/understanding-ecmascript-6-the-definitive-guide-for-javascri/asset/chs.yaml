  \n## 提升你的 JavaScript\n\nECMAScript 6 代表了 JavaScript 历史上核心最大的更新。在《理解 ECMAScript 6》中，专家开发者\
  \ Nicholas C. Zakas 为 ECMAScript 6 带来的对象类型、语法和其他令人兴奋的变化提供了完整的指南。每一章都充满了可以在任何 JavaScript\
  \ 环境中运行的示例代码，因此你可以看到新特性的应用。你将学习：\n\n- ECMAScript 6 类语法与更熟悉的 JavaScript 概念的关系\n-\
  \ 为什么迭代器和生成器很有用\n- 箭头函数与普通函数的区别\n- 使用 set、map 等存储数据的方法\n- 继承的力量\n- 如何通过 Promise\
  \ 异步编程\n- 模块如何改变组织代码的方式\n\n无论你是 Web 开发者还是 Node.js 开发者，在从 ECMAScript 5 到 ECMAScript\
  \ 6 的之旅中，你会发现《理解 ECMAScript 6》是不可缺少的。\n\n## 关于作者\nNicholas C. Zakas 自 2000 年以来致力于\
  \ Web 应用，专注于前端开发，并因编写和演讲前端最佳实践而闻名。在 Yahoo! 的五年里，他磨炼了丰富的经验，担任 Yahoo! 主页首席前端工程师。他有多本书的著作，包括《面向对象的\
  \ JavaScript 原则》（No Starch Press）和《Web 开发者专业 JavaScript》（Wrox）。\n\n"
