  md: "# Building User Interfaces Using React\n\nLet's see how exactly reconciliation\
    \ happens by looking at an example. Suppose this is the initial render:\n\n```\n\
    <ul>\n  <li>Item 1</li>\n  <li>Item 2</li>\n</ul>\n```\n\nIf we remove Item 1\
    \ from the state, the render will change to:\n\n```\n<ul>\n  <li>Item 2</li>\n\
    </ul>\n```\n\nReact algorithms compare DOM items one by one, and whenever they\
    \ find a difference between two nodes, they make mutations. So here, React will\
    \ remove the Item 1 by changing the text of the first list item and removing the\
    \ last one. This process is much faster than removing the list items and adding\
    \ a new list item, which is what ng-repeat does and what we use to do using JavaScript.\n\
    \nIf the type is different, React will treat them as two different subtrees, tree\
    \ away the first one, and build/insert the second one. For example, if we change\
    \ <ul>\n<ol>, the complete <ul> tree will be deleted.\n\nThis behavior is fine\
    \ until you add new items to the end of the list or modify them. In case you add\
    \ new items to the beginning or in between the list, you will start facing rendering\
    \ performance issues. To understand the issue, let's take an example. Let's add\
    \ Item 0 to the beginning. Now, the render will look like this:\n\n```\n<ul>\n\
    \  <li>Item 0</li>\n  <li>Item 1</li>\n  <li>Item 2</li>\n</ul>\n```\n\nHere,\
    \ while reconciling, React will first change the text of the first list item to\
    \ Item 0, then change the text of the second list item to Item 1, and finally\
    \ add a new list item and assign its text to Item 2 instead of simply adding a\
    \ new list item to the beginning of the list. This behavior makes the rendering\
    \ actually slower.\n\nReact provides a way to get around this kind of issue as\
    \ well. It lets us identify each child by assigning it a unique key. When React\
    \ reconciles the keyed children, it will that any child with a key will be reordered\
    \ (instead of being mutated) or destroyed (instead of being reused). A key is\
    \ assigned using the key attribute.\n\n[ 216 ]"
  merge: -1
