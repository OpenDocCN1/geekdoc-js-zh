  md: '# New Features of Bootstrap 4


    Bootstrap 4 is the latest version of Bootstrap at the time of writing. This version
    makes Bootstrap more powerful and easy to customize and use. In this chapter,
    you will learn about the new features of Bootstrap 4 with examples. I will assume
    that you already have some knowledge of Bootstrap and know how to create responsive
    websites using it. If you are new to Bootstrap or responsive web design, you can
    find good ways to learn Bootstrap from scratch from the Packt catalog. We will
    use Bootstrap 4 to design all the projects we will be building from this chapter
    onwards.


    In this chapter, we''ll cover the following topics:


    +   * Various ways to download Bootstrap 4

    * The compatibility of Bootstrap 4

    * Support for Flexbox

    * Customizing Bootstrap 4

    * Responsive CSS units


    # Downloading Bootstrap 4


    To download Bootstrap 4, first visit http://v4-alpha.bootstrap.com/getting-started/download/.
    Here, you will find various ways to download Bootstrap 4, depending on the package
    manager you use. You can also directly download the compiled version if the package
    manager you use is not listed or if you don''t use a package manager at all. This
    page also provides you with a link to download the source files.


    It also provides custom builds, which are just parts of Bootstrap 4 that can be
    used when you just need a few features of Bootstrap 4 but not the whole library.'
  merge: -1
  pgno: 193
- img_proc: true
  md: "# New Features of Bootstrap 4\n\nAll major CDN services also support Bootstrap\
    \ 4, so in case you want to enqueue it from a CDN, you can easily find CDN URLs.\n\
    \nFor this chapter, directly download the compiled version and place it in a new\
    \ directory named bs4. In the same directory, create a file named index.html,\
    \ and place the following code in it:\n\n```\n```html\\<!DOCTYPE html>\n<html\
