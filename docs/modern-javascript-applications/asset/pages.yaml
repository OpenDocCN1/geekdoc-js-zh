  md: '# Breaking into Microservices Architecture


    Let''s consider some examples to understand the issues caused while scaling monolithic
    server-side applications:


    +   * Suppose there is a component of server-side application that requires a
    more powerful or special kind of hardware, we cannot simply scale this particular
    component as all the components are packed together, therefore everything needs
    to be scaled together. So, to make sure that the component gets enough resources,
    you need to run the server-side application on some servers with powerful or special
    hardware, leading to consumption of more resources than actually required.

    * Suppose we have a component that requires to be executed on a specific operating
    system that is not free of charge, we cannot simply run this particular component
    in a non-free operating system as all the components are packed together and therefore,
    to execute this specific component, we need to install the non-free operating
    system on all servers, increasing the cost greatly.


    These are just some examples. There are many more issues that you are likely to
    come across while scaling a monolithic server-side application.


    So, when we scale monolithic server-side applications, the components that don''t
    need more powerful or special kind of resource starts them, therefore deceasing
    resources for the component that needs them. We can say that scaling monolithic
    server-side application involves scaling all components that are forcing to duplicate
    everything in the new servers.


    # Writing monolithic server-side applications


    Monolithic server-side applications are written in a particular programming language
    using a particular framework. Enterprises usually have developers who are experts
    in different programming languages and frameworks to build server-side applications;
    therefore, if they are asked to build a monolithic server-side application, then
    it will be difficult for them to work together.


    The components of a monolithic server-side application can be reused only in the
    same framework using, which it''s built. So, you cannot reuse them for some other
    kind of project that''s built using different technologies.'
  merge: -1
