    # Browser and device support\n\nBootstrap 4 supports the latest stable releases\
    \ of all major browsers and platforms.\n\nIn terms of compatibility, the only\
    \ change Bootstrap 4 has brought in is that it drops support for Internet Explorer\
    \ 8. Everything else remains the same as in Bootstrap 3.\n\n# Understanding the\
    \ rem and em CSS units\n\nBootstrap 4 switched from px to rem and em wherever\
    \ possible. This is the main reason why Bootstrap 4 is not supported in IE 8 as\
    \ IE 8 doesn't support the em and rem units. Bootstrap 4 switched to rem and em\
    \ because they make responsive typography and component sizing easier."
