  md: "# JavaScript improvements\n\nIn the source files, all the JavaScript plugins\
    \ have been written using ES6, and for distribution, it is compiled with Babel.\
    \ They also now come with UMD support.\n\nNow IE 8 support has dropped, it's safe\
    \ to always use jQuery 2.0 with Bootstrap. jQuery 2.0 is smaller and faster and\
    \ has more features.\n\n# Adding Tether\n\nTether is a JavaScript library for\
    \ efficiently making an absolutely positioned element next to another element\
    \ on the page. For example, you might want a tooltip to dialog open and remain\
    \ next to the relevant item on the page.\n\nIn Bootstrap 4, Tether is integrated\
    \ into tooltips and popovers for better placement and performance. So, to make\
    \ tooltips and popovers work in Bootstrap 4, you have to enqueue tether.js.\n\n\
    Add this line to code of the top of the bootstrap.min.js file to include tether\
    \ from a\nCDN:\n\n\n```\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/tether/1.2.0/js/tether.min.js\"\
    ></script>\n```\n\n# The 21:9 aspect ratio class\n\nA new aspect ratio class has\
    \ been added to Bootstrap 4: the .embed-responsive-21by9 class for a 21:9 ratio.\
    \ Here is an example of it:\n\n```\n<div class=\"embed-responsive embed-responsive-21by9\"\
    >\n  <iframe class=\"embed-responsive-item\" src=\"https://packpub.com/\"></iframe>\n\
    </div>\n```\n\n# Customizing Bootstrap 4\n\nIn Bootstrap 4, all the variable options\
    \ are consolidated into a single file called _variables.scss, where you can compile\
    \ your Sass on the fly and with little effort. This was used previously all done\
    \ in a separate stylesheet.\n\nThis file provides a lot more customization options\
    \ than Bootstrap used to provide earlier."
