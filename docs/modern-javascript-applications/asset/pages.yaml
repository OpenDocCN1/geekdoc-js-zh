  md: "# Rendering a value\n\nTo simply render a property of the this keyword, we\
    \ need to use the {{ }} token. Inside these braces, we can simply place the property\
    \ name.\n\nWe can only place expressions inside braces. The expressions we place\
    \ inside look like JavaScript. But there are a few JavaScript expressions that\
    \ we are not allowed to use inside these braces. Here they are:\n\n+   - Assignments\
    \ (=, +=, -)\n- The new operator\n- Chaining expressions with ; or ,\n- Increment\
    \ and decrement operators (++ and --)\n- The bitwise operators | &\n\n# Pipes\n\
    \nWe can also place pipes in braces. A pipe is a function that accepts an input\
    \ value and returns a transformed value. A pipe is represented by the | operator.\
    \ The final result of expressions inside braces can be transformed using pipes.\
    \ There can be as many pipes in the braces as we want. A pipe can also take parameters.\n\
    \nAngular 2 provides some built-in pipes: date, lowercase, currency, and percent.\
    \ We can also create our own pipes.\n\nHere is an example of using {{}}. Place\
    \ this code above the App component:\n\n```\nvar SampleComponent3 = ng.core.Component({\n\
