  md: "# Building an Advanced Profile Search Widget\n\nWhen we combine properties,\
    \ we always get a property, which will have an array of all source properties\
    \ as its value. If we try to combine EventStreams, then they are first converted\
    \ to properties before combining takes place. When there is a push in any of the\
    \ source properties, a new value is pushed into the resultant property.\n**Combining**\
    \ starts after each of the source properties has a value pushed.\n\nHere is an\
    \ example to demonstrate combining. Place this code in the index.js file.\n\n\
    ```\nvar x1 = new Bacon.Bus();\nvar x2 = new Bacon.Bus();\nvar x3 = new Bacon.Bus();\n\
    \nBacon.combineAsArray(x1, x2, x3).onValue(function(value) {\n  console.log(value);\n\
    })\n\nx1.push(0);\nx1.push(1);\nx2.push(2);\nx3.push(3);\nx3.push(4);\nx1.push(5);\n\
    ```\n\nHere is the output of the code:\n\n+   [1, 2, 3]\n[1, 2, 4]\n[5, 2, 4]\n\
    \nZipping is different from combining. **Zipping** means that events from each\
    \ source are combined pairwise so that the first event from each source is published\
    \ first, then the second event, and so on. The results will be published as soon\
    \ as there is a value from each source. When we zip properties and EventStreams,\
    \ we always get an EventStream.\n\nHere is an example to demonstrate zipping.\
    \ Place this code in the index.js file:\n\n```\nvar y1 = new Bacon.Bus();\nvar\
    \ y2 = new Bacon.Bus();\nvar y3 = new Bacon.Bus();\n\nBacon.zipAsArray(y1, y2,\
    \ y3).onValue(function(value) {\n  console.log(value);\n})\n\ny1.push(0);\n```"
