  md: '# Non-vulnerability based attacks


    There are various kinds of attack that can be made on any kind of application,
    as they depend on loopholes in the application. Still, applications can do a lot
    to prevent these attacks.


    Let''s see a few of the most common non-vulnerability-based attacks and how to
    prevent them.


    # Denial-of-service attacks


    A denial-of-service (DoS) attack is an attempt to make a server machine unavailable
    to its intended users temporarily. An attacker uses one or many machines to make
    continuous requests to the server to take it down.


    The best way to prevent DoS is to use an external service as CloudFlare, which
    uses lots of different techniques and data from various sources to block malicious
    requests on your server. It''s always better to avoid handling DoS on your server
    and leave it a service created by DoS experts.


    # Brute force attacks


    A brute force attack aims at the simplest kind of method to gain access to a site:
    trying usernames and passwords, over and over over, until it gets in.


    Here are several ways to prevent brute force attacks:


    +   - We can embed CAPTCHA in forms that can completely prevent bots from making
    brute force attacks and slow down brute force attacks

    - There is a middleware program for Express servers called express-brute that
    limits the rate of incoming requests based on several factors. You can find out
    more about express-brute at https://www.npm.js/package/express-brute.


    # Using secure packages


    The npm packages you use may contain critical security vulnerabilities that could
    also affect your application. It''s not possible to go through every package''s
    code or test each of them separately.'
  merge: -1
