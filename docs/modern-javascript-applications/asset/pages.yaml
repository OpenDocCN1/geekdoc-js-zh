  md: '# Production mode versus development mode


    Until now, we have been running Angular 2 in development mode. The difference
    between development and production mode is that in development mode, Angular 2
    starts detection immediately after the first run and logs a value has changed
    after it was checked error if anything changes between the first and second run.
    This helps locate bugs.


    To enable production mode, place this code above the ng.platform.browser.ng.core.enableProdMode();
    method call:


    ```

    ng.core.enableProdMode();

    ```


    # Summary


    In this chapter, we learned routing Angular 2 by building a basic search engine
    template. Along with learning routing in depth, we also learned about the Angular
    2 HTTP client service as well as how to switch to production mode in Angular 2.


    You should now be comfortable with building the frontend of any kind of web application
    using Angular 2.'
