  md: "# Building a Live Score Site\n\nIn the Initial/LiveScore directory, you will\
    \ find the public directory, app.js file, and package.json file. Inside the public\
    \ directory, you will find css, html, and js directories. In the css and html\
    \ directories, you will find HTML files and CSS files for our user and administrator\
    \ pages. In the js directory, you will find admin.js and index.js files, which\
    \ you will place the socket.io client code for the administrator and users, respectively.\
    \ Similarly, in the html directory, you will find index.html and admin.html files\
    \ that will be served to the users\n\nInside the package.json file, place the\
    \ following code:\n\n```\n{\n  \"name\": \"Live-Score\",\n  \"dependencies\":\
    \ {\n    \"express\": \"4.13.3\",\n    \"socket.io\": \"1.3.7\",\n    \"basic-auth\"\
    : \"1.0.3\",\n    \"socket.io-cookie\": \"0.0.1\"\n  }\n}\n```\n\nNow run the\
    \ npm install command inside Initial/Live-Score directory to download express,\
    \ socket.io, basic-auth, and socket.io-cookie npm packages.\n\n# Integrating socket.io\
    \ server with the Express server\n\nWe can integrate the socket.io server with\
    \ the Express server with just a few lines of code. Here is the code to integrate\
    \ the socket.io server with the Express server.\n\nCreate an app.js file and place\
    \ the following code in:\n\n```\nvar express = require(\"express\");\nvar app\
    \ = express();\nvar server = require(\"http\").createServer(app);\nvar io = require(\"\
    socket.io\")(server, {path: \"/socket-io\"});\n```\n\n```\nserver.listen(8080);\n\
    ```\n\nThe fourth line is where the main integration happens. Here we are using\
    \ the /socket-io path for socket handshaking.\n\nFinally, we are listening on\
    \ port number 8080. That is, both Express server and socket.io server will listen\
    \ on port number 8080."
