  md: '# New Features of Angular 2


    This is the console output of the code:


    ```

    def

    mno

    abc

    ```


    This is how it works:


    +   - First, we create four services: Service1, Service2, Service3 and Service4.

    - They all have a getValue method, which returns a string. Service4 is dependent
    on Service2 and Service3.

    - Then, we create a component called ServiceTest1. It''s dependent on Service1.
    In the viewProviders property, we passed an array of providers. A provider is
    created using the ng.core.provide method. It takes two arguments; the first one
    is the service name, and the second one is the configuration object, which states
    how to create an instance of this service. The useClass property allows Angular2
    to create an instance of this service when an instance of the service in the first
    argument is requested. So here, when an instance of Services is required, an instance
    of Services is what is actually created. Similarly, useValue is used to provide
    a value, and useFactory is used to pass control to a function to decide what to
    return when a new instance is requested. So, when an instance of Service2 is requested,
    we get the def string, and when Service3 is requested, we get the mno string.


    Earlier in this chapter, we were simply assigning viewProviders to the services
    themselves. A service also implements the interface of a provider such that it
    creates the instance of the service itself.


    If there are multiple providers matching a service, then the latest one overrides
    the previous one.


    # The difference between providers and the viewProviders property


    The viewProviders property allows us to make providers available to the component''s
    view only, whereas the providers property makes a provider available to its content
    children and view children.'
