    # # Using MicroEvent.js


    MicroEvent.js is an event emitter library, which provides the observer pattern
    for JavaScript objects. We need MicroEvent.js for triggering events from stores
    to update views.


    You can get MicroEvent.js from http://notes.jetienne.com/2011/03/22/microeventjs.html.


    To make an object or constructor to be able to emit events and others to be able
    to subscribe to it, we need to integrate a MicroEvent interface into the object
    or constructor using the MicroEvent.mixin method.


    Now, inside the object or constructor, we can trigger events using this.trigger(),
    and others can subscribe to events using the bind() method of the object. We can
    also unbind using the unbind() method.


    We will look at example code while building the RSS feed reader.


    # # Introduction to React Router


    The RSS feed reader application we will create is going to be a single-page application.
    In single-page applications, routes are defined on the frontend instead of the
    backend. We need some sort of library that lets us define routes and assign components
    to, that is, we can keep the UI in sync with the URL.


    React Router is the most popular and recommended routing library for React. It
    provides a simple API with powerful features as dynamic route matching and location
    handling built in.


    You can find the source code of React Router at https://github.com/reactjs/react-router
    and the CDN version at https://cdnjs.com/libraries/react-router.'
