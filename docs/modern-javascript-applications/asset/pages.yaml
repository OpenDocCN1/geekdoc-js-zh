  md: '# Text alignment and float utility classes


    Utility classes for floats and text alignment now have responsive ranges. Bootstrap
    4 has dropped unresponsive text alignment and float classes.


    Responsive text alignment classes are of the text - [xs/sm/md/lg/xl] - [left/right/center]
    format. For example, the text-lg-left class aligns text on viewport sizes lg or
    wider.


    Classes of the format pull- [xs/sm/md/lg/xl] - [left/right/none] float an element
    to the left or right floating based on the current viewport size. For example,
    the pull-xs-left class floats the element on all viewport sizes.


    # Reboot


    Bootstrap 3 used Normalize.css as its CSS reset. In Bootstrap 4, the reset and
    Bootstrap base styles are combined into a single file called reboot.scss.


    # Flexbox support


    Flexbox has finally come to Bootstrap in 4. To enable version components and grid
    systems you can download the Flexbox version of Bootstrap CSS file, which is available
    on their download page: http://v4-alpha.getbootstrap.com/getting-started/download/


    Remember that Flexbox has poor browser support, think twice before deciding to
    use it. Here is a diagram that shows the browser support of Flexbox:


    | Edge | Firefox | Chrome | Safari | Opera | iOS Safari | Opera Mini | Android
    Browser | Chrome for Android |

    |---|---|---|---|---|---|---|---|---||

    | 8 | | | | | | 46 | | | |

    | 9 | | | | | | | 4.4 | | |

    | 10 | | 63 | 47 | | | 8.4 | 4.4,4.4 | | |

    | 11 | 13 | 44 | 48 | | 34 | 9.2 | | 47 | |

    | 12 | | 45 | 49 | 9.1 | | 9.3 | | | |

    | 13 | | 46 | 52 | | | | | | |

    | 14 | | | | | 8 | | | |


    You can also change the value of the $enable-flex to true Sass variable and compile
    it to generate the Flexbox version of the Bootstrap CSS.


    Learn more about Flexbox support in Bootstrap 4 at http://v4-alpha.getbootstrap.com/getting-started/flexbox/.'
