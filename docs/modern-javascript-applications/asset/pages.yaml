    # Integrating PeerServer with the Express server


    We can also integrate PeerServer with the Express server, that is, a particular
    path of the Express server will provide the signaling service. The main advantage
    of integrating PeerServer with the Express server is that we can check whether
    a peer is allowed to connect to PeerServer or not, and if it is not allowed, we
    can stop the peer from using it.


    Here is an example code that demonstrates how to integrate PeerServer with the
    Express server. Place the following code in the app.js file and run the node.js
    command to start the server:


    ```

    var express = require("express");

    var app = express();


    var server = app.listen(8080);


    app.use("/signaling", function(httpRequest, httpResponse, next) {

    // check whether peer is allowed to connect or not.


    next();

    }}


    var ExpressPeerServer = require("peer").ExpressPeerServer(server,

    {debug: true});


    app.use("/signaling", ExpressPeerServer);


    ExpressPeerServer.on("connection", function(id) {

    });


    ExpressPeerServer.on("disconnect", function(id) {

    });",

    ```'
