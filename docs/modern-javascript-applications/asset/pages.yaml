    # Integrating Express and Seneca


    We have completed creating our login and register accounts. Now, as our backend
    will be used by an app or it may represent as a website, we need to provide URLs
    to the clients who need to talk to the server.


    Monolithic core is part of our server-side application that the clients interacts
    with most of the functionality. Clients can also interact with services directly
    for some specific functionality if required.


    So, we need to use sort of web development framework in the monolithic core and
    services of our server-side application. We will be using Express, as it''s the
    most popular one.


    Seneca also provides a built-in way to map the URLs to actions, that is, requests
    made to an HTTP server can be automatically mapped to a particular action to define
    a route mapping from Seneca to action patterns. This is using a definition object
    whose properties define a route mapping independent of the framework. Using, we
    need a plugin to the web server framework that will capture and resolve the Seneca
    to action patterns using the definition objects. Definition object allows you
    to attach callbacks that will get the response of the action via a parameter,
    and then the callbacks return the data to the user in whatever format they want.
    This can be useful in case you are creating a plugin for distribution that exposes
    a few actions that need to be called for specific URL requests, then you will
    have to use the built-in method, as it defines route mapping independent of the
    framework


    > You can learn more about how to use the built-in way to integrate Seneca and
    Express at https://github.com/rjrodger/seneca-web.


    [ 21 ]'
