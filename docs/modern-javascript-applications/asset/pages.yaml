  md: '# Chapter 10


    A virtual DOM is an abstract version of just the real DOM, that is, a description
    of the real DOM. Virtual DOM elements are objects where real DOM elements are
    UI elements. Virtual DOM is much faster as it''s a JavaScript data structure and
    manipulating it doesn''t automatically re-render the UI. Earlier, I said in React,
    you don''t write any HTML but instead declare the structure of the DOM. Actually,
    you declare the structure of the virtual DOM, not the real DOM. React keeps the
    real DOM in sync with virtual DOM. Whenever the application state changes to update
    the UI, React finds few mutations as possible for the real DOM to sync with the
    virtual DOM. We will later see how these actually find the difference and mutate
    the real DOM. For example, if we have a list in the virtual DOM and we remove
    the item and add a new list with just an extra item, then only the new item is
    rendered when synced with the real DOM, not the whole list.


