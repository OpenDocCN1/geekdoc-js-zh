  md: "# Building an Advanced Profile Search Widget\n\nDepending on how we create\
    \ a stream, Bacon.js can sometimes identify whether an event is a success or error\
    \ event, and if it's an error event, then it can convert it to Bacon. Error. For\
    \ example, if we use Bacon.fromPromise to create an EventStream, then Bacon can\
    \ identify an error early, especially when an error occurs in a promise pattern,\
    \ the second callback of the then() method or the callback passed to the catch()\
    \ method is executed.\n\nIn case Bacon cannot identify whether an event is an\
    \ error or success event while creating a stream, then we need to explicitly create\
    \ instances of Bacon. Error and replace the error events with them. For example,\
    \ when using Bacon.fromCallback, there is no way for Bacon.js to know whether\
    \ an event is a success or error event, so we need to explicitly convert error\
    \ instances to instances of Bacon. Error.\n\n# Subscribing to errors\n\nA callback\
    \ passed to onError is not invoked for Bacon. Error events or values; instead,\
    \ we need to use onError.\n\nTo see it in action, open the index.js file that\
    \ we created in previous chapter, and add this code:\n\n```\nresponse.onError(function(error)\
    \ {\n  console.log(\"An error occured while fetching the page\",\n  error);\n\
    })\n```\n\nNow, if you enter a URL that cannot be fetched, a custom error message\
    \ is displayed on the console.\n\n# Mapping errors\n\nThe map() function doesn't\
    \ map Bacon.Error instances; therefore, Bacon provides us with mapError(), which\
    \ works the same way as map but maps only Bacon. Error instances.\n\nSimilarly,\
    \ flapMap() doesn't map Bacon.Error instances. Therefore, Bacon provides us with\
    \ flatMapError(), which works the same way as flatMap but maps only Bacon. Error\
    \ instances.\n\nAside from flatMap and map, Bacon. Error instances can pass through\
    \ everything."
