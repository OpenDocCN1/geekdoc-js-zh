  md: '# Getting started


    The coupon site that we will build allow users to submit coupons. For the coupon
    to be publicly visible, the administrator of the site should accept the coupon.
    Every coupon will have an image attached to it that will be stored and served
    by an image storage server.


    We will use MongoDB to store the coupons. Before you continue further, make sure
    that you have MongoDB installed and running. I am assuming that you have basic
    knowledge of MongoDB.


    The exercise contains two directories: Initial and Final. Inside the Final directory,
    you will find the complete coupon site source code. In the Initial directory,
    you will find the HTML code and directories for the monolithic core, services,
    image server, and so on. You will put code related to them in their respective
    directories. The Initial directory will help you quickly get started with building
    the coupon site.


    We won''t get into designing the frontend of our coupon site. We will only be
    concentrating on building the architecture and functionalities of the site. Therefore,
    the HTML code is already included in the Initial directory.


    # Architecture of our site


    Our server-side application will be composed of a monolithic core, three services,
    MongoDB server, and image storage server.


    The monolithic core will serve pages to the site visitors and administrators.


    The three services are database service, URL configuration service, and upload
    service. The following is what each of these services do:


    +   - Database service: Adding, retrieving, updating, and deleting coupons in
    MongoDB is done through database service. The monolithic core retrieves coupons
    from MongoDB through database service, and upload service coupons through database
    service.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '+   Upload service: When a user submits a coupon, the HTML form is submitted
    to the upload service. The upload service sends the image to the image storage
    server and adds metadata about the coupon to the database using the database service.
    We moved these operations to a different service, because if we are resizing and
    converting the image, then it will consume more memory and CPU time and keep the
    port open for more time, which will flood the server and break the monolithic
    core in case there are large number of submissions at a time, moving these operations
    to a different service makes that if there is a rise in submissions, it doesn''t
    affect the site visitors looking for the coupons. We won''t be resizing and converting
    images, but if you need this functionality, you can add this by simply updating
    the upload service. While the upload service is being updated, the form submissions
    will not work, everything else will work. Therefore, we can say that this functionality
    can be independently updated without affecting other functionalities.


    +   URL config service: The client communicates with the monolithic core, image
    storage server, and upload service. In a production site, these three servers
    will remain in different physical computers with three different IP addresses.
    So, for the client to be able to communicate with them, these three need to be
    exposed via different domain names (that the monolithic core can be pointed using
    the main domain and the other two using sub domains) or we can use a load balancer
    or reverse proxy that supports URL rerouting to the respective server based on
    the path and route the requests to the respective server. The URL config service
    will serve the base URL. To follow this chapter, you can simply run these servers
    in the same physical computer using different ports, and when you are ready to
    make the site live, you can change the base URLs in the URL config service, depending
    on what technique you used to make the client able to communicate with the servers.
    You do not have to modify source code of the servers directly, which is a cumbersome
    and risky task.


    We will be creating our own image storage server. However, in a production site,
    I would recommend that you use Amazon S3 or similar to store images, as it makes
    easy to serve images via CDN. You don''t have to worry about scaling and reliability,
    and it''s low cost. The image storage server that we will be creating will be
    a basic one to just demonstrate how to store images in a separate server and serve
    from there.'
