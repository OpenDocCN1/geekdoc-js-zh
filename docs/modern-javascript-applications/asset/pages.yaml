  md: '# Demerits of microservices architecture


    Although there are a lot of merits of using microservices architecture compared
    to monolithic architecture, there are some demerits of microservices architecture
    as well:


    +   - As the server-side application is divided into services, deploying, and
    optionally, configuring each service separately is a cumbersome and time-consuming
    task.


    ![](img/a330fba1360168a944317211e66958a7_29_0.png)


    > Note that developers often use some automation technology (such as AWS, Docker,
    and so on) to make deployment easier; however, to use it, you still need a good
    level of experience and expertise with that technology.


    +   - Communication between services is likely to lag as it''s done via a network.

    - This server-side applications are more prone to network security vulnerabilities
    as services communicate via a network.

    - Writing code for communicating with other services can be harder, is, you need
    to make network calls and then parse the data to read it. This also requires more
    processing. Note that there are frameworks to build server-side applications using
    microservices that make fetching and parsing easier, it still doesn''t deduct
    the processing and network wait time.

    - You will need some monitoring tool to monitor services as they may go down due
    to network, hardware, or software failure. Although you may use the monitoring
    tool only when your application suddenly stops, to build the monitoring software
    or use some sort of service, monitoring needs some level of extra effort and expertise.

    - Microservices-based server-side applications are slower than monolithic-based
    server-side applications as communication via networks is slower compared to memory.


    # When to use microservices architecture


    It may seem its difficult to choose between monolithic and microservices architecture,
    but it''s actually not so hard to decide between them.


    If you are building a server-side application using monolithic architecture and
    you feel that you are unlikely to face any monolithic issues that we discussed
    earlier, then you can stick to monolithic architecture. In future, if you are
    facing issues that can be solved using microservices architecture, then you should
    switch to microservices architecture.'
  merge: -1
