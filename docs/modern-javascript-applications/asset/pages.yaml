  md: '# # 10 Building User Interfaces Using React


    Writing code for reactive UI is a difficult task, as writing code to manipulate
    the DOM using JavaScript whenever the application state changes is difficult and
    it makes understanding the application difficult. Therefore, the MVC architecture
    was introduced, where we define the UI and application state separately, and the
    UI is updated automatically as the application state changes. MVC framework views
    have concentrating on making the writing of code for reactive UIs easier but not
    increasing rendering performance, reusability, and ease of debugging. This is
    what React aims to solve. It not only makes writing code for reactive UI easier
    but also takes care of rendering performance, reusability, and ease of debugging.


    In this chapter, we will cover the following topics:


    +   * What React is

    * Virtual DOM technology

    * Component-based UI development using React

    * One-way dataflow programming

    * Using JSX to write React code

    * Using React on the server side to build isomorphic apps

    * Many other topics to help us get a good hold on React'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Introducing React


    React is a JavaScript library for building reactive UIs. We usually use jQuery
    or pure JavaScript to manipulate a reactive UI whenever the application state
    changes, which makes it difficult to reuse and understand the code. Instead, we
    can use React, which lets us declare how the UI behaves on the application state,
    and it automatically updates the UI whenever the application state changes. There
    are lots of libraries and technologies, such as web components and templating
    engines, that aim to make the building of UIs easier, React stands out from the
    crowd as it makes it easy to build reusable and high-performance reactive UIs.


    React is also used as a view library because it is exactly what a view library
    is supposed to be. A view shows the UI of the application and defines how the
    UI changes based on the application state, that is, how the application state
    is displayed. As''s just a view library, it doesn''t tell us how to manage, access,
    and mutate the application state. It can be used as the view layer in any kind
    of architecture and framework.


    Remember that React is a library and not a framework like Angular or Ember. Thus,
    React can be used with Angular to make Angular views better in terms of performance
    and reusability.


    For example, there is an AngularJS module named ngReact that lets React be used
    as a view in AngularJS.


    Even the Flux architecture uses React as its view. We will learn more about Flux
    in the next chapter.


    React is always used with a framework as it only defines the UI but doesn''t tell
    us how to manage the application logic and state, just like a template library
    or web component is always used with a framework.


    > Is React a templating engine?

    React is not a templating engine. The views of the most MVC frameworks are of
    a template system. In a templating system, we write HTML with a template language
    for the UI, and it is processed in order to generate the final HTML. For example,
    an AngularJS view is a template system''s composed of directives, expressions,
    and so on. React is not a templating engine because we don''t write HTML. Instead,
    we define the structure of the DOM using JavaScript. React can also do much more
    than what a templating engine can do. It can also capture user events in the UI.
    This is how it differs from traditional views. It''s just that React works in
    a different way than a template system.'
