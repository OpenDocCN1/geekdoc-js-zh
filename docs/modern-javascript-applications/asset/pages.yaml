  md: '# Creating actions


    Let''s create actions for login and registration functionality and place them
    in the main.js file. To create actions, we need to use the add method of the seneca
    object. The first argument of the add method takes a JSON string or object that
    is the action identified (pattern to identify the action). The second argument
    is a callback that will be executed when the action is invoked.


    Place this code in the main.js file that creates two actions for login and registration,
    as follows:


    ```

    seneca.add({role: "accountManagement", cmd: "login"}, function(args, respond)
    {

    });

    ```


    ```

    seneca.add({role: "accountManagement", cmd: "register"}, function(args, respond)
    {

    });

    ```


    We will see the code for the body of the actions later in this chapter.


    There is nothing special about role and cmd properties. You can use any property
    names you wish to.


    The second argument is a callback, which will be invoked when the action is called.


    If there are multiple actions with the same pattern, the later one overrides the
    others.


    We need to use the act method of the seneca object to invoke an action that''s
    local to the instance or resides on some other service. The first argument of
    the act method is a pattern to match an action, and the second argument is a callback
    that will be executed once the action has invoked.


    Here is an example code that shows how to call the preceding two actions:


    ```

    seneca.act({role: "accountManagement", cmd: "register", username: "narayan", password:
    "mypassword"}, function(error, response) {

    });

    ```


    ```

    seneca.act({role: "accountManagement", cmd: "login", username: "narayan", password:
    "mypassword"}, function(error, response) {

    });

    ```


    The callback passed to the act method is executed asynchronously once result of
    the action arrives.'
