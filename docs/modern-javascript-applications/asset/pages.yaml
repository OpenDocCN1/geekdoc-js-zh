  md: '![](img/a330fba1360168a944317211e66958a7_23_0.png)


    In the preceding diagram, all the servers will be running the same server-side
    application.


    Although scaling is easy, scaling monolithic server-side application ends up with
    scaling all the components rather than the components that require greater resource.
    Thus, causing unbalanced utilization of resources sometimes, depending on the
    quantity and types of resources the components need.'
