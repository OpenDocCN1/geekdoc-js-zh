  md: 'Everything here is self-explanatory. The only thing you need to know is that
    the second parameter of the second argument passed to the scan method represents
    the value of the property we used to create this property.


    A property holds a stream that has all of its previous and current values internally;
    therefore, we can merge, combine, zip, sample, filter, and transform properties.
    Merging, combining, zipping, sampling, filtering, or transforming properties gives
    us new properties. This feature is useful for writing code for the more complex
    situation of a property''s value depending on another property. For example, if
    we want to ignore some values of a property while calculating the value of another
    property based on it, then we can use filter feature.


    Bacon.js also allows us to create EventStreams based on properties, that is, events
    of an EventStream represent the values of a property. Events in this EventStreams
    occur when their respective property value is changed. This feature has many benefits,
    one of which is that it can prevent code duplication when we have to trigger the
    same action in response to several properties changing their values.


    To create EventStreams based on properties, we can use the toEventStream method
    of a property.


    > Retrieving the latest value of a property

    There is no method to obtain the latest value of a property, and there will be.
    You obtain the value by subscribing to the property and handling the values in
    your callback. If you need the value of more than one source, use one of the combine
    methods. This is how functional reactive code using Bacon.js is supposed to be
    written.


    # Merging, filtering, and transforming EventStreams and properties


    Bacon.js provides various helper functions to work with EventStreams and properties.
    Let''s look at some of the most useful functions.'
