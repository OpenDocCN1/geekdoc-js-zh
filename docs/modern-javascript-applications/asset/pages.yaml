    \ which we didn't press the Shift key. So, for the click event to be accepted,\
    \ we need to press the Shift key while clicking on the button.\n\nYou can think\
    \ of filtering as an alternative to using the if...else conditional.\n\n# Transforming\n\
    \nTransforming is creating an EventStream or property from another EventStream\
    \ or property, whose events are transformed to something else. For example, a\
    \ property whose value can be transformed into another property, whose value represents\
    \ the response of the new URL. Transforming EventStreams and properties actually\
    \ creates new EventStreams and properties, respectively.\n\nYou can think of transforming\
    \ as an alternative to loops, that is, to using for loops.\n\nThere are several\
    \ helper functions provided by Baacon.js for transformation depending on how and\
    \ what you want to transform.\n\nOne popular transformation function is map(),\
    \ which maps events or values of EventStreams or properties to a function. Let's\
    \ look at a code sample to demonstrate this. Find this code in the index.js file:\n\
    \n```\nvar button_click_time = button_click_counter.scan({\n  function(value,\
