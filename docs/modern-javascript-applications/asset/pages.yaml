  md: "# Understanding project directories and files\n\nIn the exercise files of this\
    \ chapter, you will find a directory named `profile-search-widget`. Inside that\
    \ directory, you will find two other directories named `final` and `initial`.\
    \ The final directory contains the final code for the profile search widget where\
    \ the `initial` directory contains the files and code for you to quickly get started\
    \ building the profile search widget. You will now work with the `initial` directory.\n\
    \nYou are supposed to build the server-side code inside the `app.js` file and\
    \ the frontend code inside the `public/js/index.js` file. Currently, the `app.js`\
    \ file imports Bacon, Express, and filesystem modules and also has basic code\
    \ to run the web server and serve static files.\n\nInside the `public/html/index.html`\
    \ file, you will find HTML code. We will not be writing any HTML or CSS.\n\nLet's\
    \ first build the backend and then the frontend.\n\n# Converting Express.js routes\
    \ to a functional reactive pattern\n\nExpress.js routes are written using a callback\
    \ pattern. We need a wrapper to convert the callback pattern to a functional reactive\
    \ pattern.\n\nBacon doesn't provide a direct method for doing this—there are various\
    \ other custom methods. The easiest and shortest way to do this is by creating\
    \ a bus for every route, and whenever a request to a route is made, pushing an\
    \ event into its respective bus. Let's create a route for this serving the `index.html`\
    \ file for requests to the root code in the `app.js` file:\n\n```\nfunction route_eventstream(path)\n\
    {\n  var bus = new Bacon.Bus();\n\n  app.get(path, function(req, res) {\n    bus.push({\n\
    \      req: req,\n      res: res\n    });\n  });\n}\n```"
