  md: '# Building a Live Score Site


    The best way to master socket.io is by building a real-world application, which
    is what we will be doing in this chapter. A live score website shows changes in
    real time to the user as soon as the administrator updates the scores. We will
    create a football live score website. Discussing how to build a live score website
    will help us study socket.io in depth, as it requires socket.io authentication,
    and optionally, integrating socket.io with Express. Our live score website will
    provide an admin panel for the administrators to update the score.


    In this chapter, we will cover the following topics:


    +   * Accessing cookies in the socket.io middleware

    * Discussing HTTP basic authentication

    * Integrating socket.io with Express

    * Discussing socket.io authentication


    # Building the backend


    Before we start building the backend of our live score site, let''s first set
    up our directory and files.


    We will only write code for the backend and frontend architecture and functionality,
    not any HTML or CSS design code.


    The exercise of this chapter contain two directories: Initial and Final. In both
    the directories, you will find a directory named Live-Score. In the Final/Live-Score
    directory, you will get the complete live score source code. In the Initial/Live-Score
    directory, you will only find HTML and CSS files for our live score site. The
    Initial/Live-Score directory is to help you quickly get started with building
    the live score site.'
