- img_proc: true
  md: 'Unfortunately, it doesn''t log anything. That''s lazy evaluation is taking
    place here. The sampledBy function takes the current value of the property, not
    the ones that were generated from previous events. Therefore, map decides to generate
    the property value when an event occurs in the second bus, therefore preventing
    unnecessary calls to the callback passed to the map function. In short, map simply
    prevents calculating property values until it''s actually needed. Now, add this
    code to index.js file:


    ```

    myBus_1.push(2);

    myBus_2.push();

    ```


    Now, when you run the code, you will get this output:


    ```

    Executing 1

    Logged 2

    ```


    Here, you can see that map prevented calculating for the first event pushed inside
    the first bus. It calculated the property value for second event because sampling
    done after that.


    > If you want to prevent lazy evaluation when using the map() method, then use
    flatMap instead of map. The flatMap method doesn''t use lazy evaluation. There
    is no way to prevent lazy evaluation when using combine methods, but if you need
    it, then you can try to rewrite the code using other methods, which may or may
    not be possible depending on what you are trying to achieve.


