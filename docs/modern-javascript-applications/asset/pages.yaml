  md: "# Custom elements\n\n**Custom elements** lets define new types of HTML elements\
    \ (that is, new types\nof HTML tags). When we use a tag name that's not recognized\
    \ by the browser, the\nbrowser simply treats it like a `<span>` tag. But when\
    \ we register a `custom` tag, it gets\nrecognized by the browser. It can inherit\
    \ other elements, lets us perform different\noperations on different stages of\
    \ the element lifecycle, and much more.\n\nLet's create a `custom` element for\
    \ our component. Wherever the tag appears, a new\ninstance of the component will\
    \ be displayed.\n\nHere is the code to display the `custom` element. Place it\
    \ in the `<body>` tag:\n\n```\n<custom-card data-img=\"http://placeholder.it/250x250\"\
    \ data-\ntitle=\"Title 1\" description=\"Description 1\" is=\"custom-\ncard></custom-card>\n\
    <custom-card data-img=\"http://placeholder.it/250x250\" data-\ntitle=\"Title 2\"\
    \ description=\"Description 2\"></custom-card>\n```\n\nWe have to use the `-custom`\
    \ in the custom element name. This is compulsory\nthis restriction allows us to\
    \ distinguish custom elements from\nregular elements and ensure forward compatibility\
    \ when new tags are added to\nHTML Here, we are passing properties of the component\
    \ as data attributes.\n\nNow, let's define `<custom-card>` as a custom element\
    \ and the template code\ninside the tag whenever a new instance of `<custom-card>`\
    \ is created. To do that,\nplace this code in the `<script>` tag:\n\n```\nvar\
    \ customCardProto = Object.create(HTMLElement.prototype);\ncustomCardProto.createdCallback\
    \ = function () {\nvar template = document.querySelector(\"#card-selector\");\n\
    this.getAttribute(\"data-img\").src =\ntemplate.content.querySelector(\"h3\").innerHTML\
    \ =\nthis.getAttribute(\"data-title\");\ntemplate.content.querySelector(\"p\"\
    ).innerHTML =\nthis.getAttribute(\"data-description\");\n}\n\nvar clone = document.importNode(template.content,\
    \ true);\nthis.appendChild(clone);\n\nvar customCard = document.registerElement(\"\
    custom-card\", {\n  prototype: customCardProto\n});\n```"
