- img_proc: true
  md: '# The same-origin policy for WebSocket


    Browsers as well as WebSocket instances can perform cross-domain communication,
    that is, they are not restricted by any same-origin policy.


    While making an HTTP request for a handshake, the browser sends an Origin header
    assigned to the webpage origin.


    If a WebSocket server wants to restrict communication to a particular domain,
    it can read the Origin HTTP header of the handshake HTTP request and block or
    allow the handshake accordingly.


    # Introduction to Socket.IO


    Socket.IO is a combination of the client-side JavaScript library and Node.js used
    to integrate bidirectional communication between a browser and Node.js backend.


    The Socket.IO client-side library is used to create a Socket.IO client whereas
    the Socket.IO Node library is used to create a Socket.IO server. The Socket.IO
    client and server can communicate with each other bidirectionally. Socket.IO primarily
    uses WebSocket to achieve bidirectional communication.


    The reason for using the Socket.IO client-side library instead of using the WebSocket
    API is that WebSocket is a relatively new protocol at the time of writing and
    not all browsers support the API. If Socket.IO sees that the browser doesn''t
    support WebSocket, then it jumps to one of the other mechanisms, such as Flash
    sockets, long polling, multipart streaming, iframes, or JSONP, to implement bidirectional
    communication between browsers and servers. Then we can say that Socket.IO is
    guaranteed to work on every browser. The Socket.IO backend provides APIs to create
    namespaces and rooms, broadcast messages, and so on, which are very useful in
    some cases. Therefore, Socket.IO is the best way to implement bidirectional communication
    between a browser and Node.js server.


    # Setting up your project


    Before we start learning about the Socket.IO API, let''s set up our project directory
    and files. Create a directory named SocketIO-Example. Inside the directory, create
    files called package.json, app.js, and socket.js, and a directory called public.
    In the public directory, create two directories, html and js. Inside the html
    directory, create a file called index.html. Finally, in the js directory, download
    and place the Socket.IO library from https://cdn.socket.io/socket.io-1.3.7.js.
    At the time of writing, the latest version of Socket.IO is 1.3.7; therefore, we
    will be using that version.'
