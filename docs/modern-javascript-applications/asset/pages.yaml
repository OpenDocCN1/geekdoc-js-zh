    # Rooms in Socket.IO


    A room simply represents a group of Socket.IO clients connected to a particular
    namespace. A room belongs to a particular namespace.


    A namespace cannot have two rooms with the same name, but two different namespaces
    can have rooms with the same name. Rooms with the same namespaces are different
    rooms entirely.


    Every Socket.IO client connected to a namespace belong to one or more groups.
    By default, a Socket.IO client is connected, a new group is created and the client
    is added to it. Therefore, every Socket.IO client belongs to a unique group by
    default.


    Here is the code that prints the unique group name of a Socket.IO client after
    it has connected. Place it inside the default and /custom-namespace namespaces''
    connection event handlers:


    ```

    console.log(socket.id);

    ```


    The id of the socket object holds the unique room name.


    # Joining and leaving a room


    To add a Socket.IO client to a custom room, we need to use the socket.use() method.
    To remove a Socket.IO client from a custom room, we need to use the socket.leave()
    method.


    The following code adds every Socket.IO client connected to the default and /custom-namespace
    servers to a room called my-custom-room. Place it inside the default and /custom-namespace
    namespaces'' connection event handlers:


    ```

    socket.join("my-custom-room");

    ```


    Similarly, to remove a user from my-custom-room, you can use this code:


    ```

    socket.leave("my-custom-room");

    ```


    # Referring to all connected Socket.IO clients in a room


    The Socket.IO server API also provides us with a way to send a message or custom
    event to everyone in a room.'
