- img_proc: true
  md: '# Introduction to reactive programming


    Before we get into FRP, we need to understand what it is. I will be explaining
    reactive programming with respect to JavaScript. The concept of reactive programming
    is the same in every programming language.


    **Reactive programming** is writing code to look for asynchronous data updates,
    user activities, and system activities and propagate changes onto the dependent
    parts of the application. Reactive programming is not something new; believe it
    or not, you have already done reactive programming without realizing it. For example,
    the code you write to handle a button''s click event is reactive code. There are
    various approaches to reactive programming, such as event-driven, callback, promise
    patterns and FRP.


    Not every snippet of asynchronous code we write is reactive code. uploading analytics
    data to a server asynchronously after a page load is not reactive code. uploading
    a file to a server asynchronously and displaying a message to the user after the
    upload is complete is reactive code because we are reacting to the completion
    of the file upload.


    A more complex example of reactive programming is in the MVC architecture, where
    reactive programming is what reacts to a change in the model and updates the view
    accordingly, and vice versa.


    # Problems with writing reactive code


    There are basically three patterns natively supported by JavaScript for writing
    reactive code: **event-driven, callback, and promise.**


    Anyone who knows a bit of JavaScript is familiar with event-driven and callback
    patterns. Although these two patterns are the most popular way of writing reactive
    code, they make it difficult to catch exceptions and result in nested function
    calls, which makes the code harder to read and debug.


    Due to the problems caused by event-driven and callback patterns, ES6 (https://www.packpub.com/web-development/learning-ecmascript-6)
    introduced the promise pattern. The promise pattern makes the code look more like
    synchronous code, therefore making it easy to read and debug. The pattern also
    makes exception handling easier. A promise represents an asynchronous operation.'
  merge: -1
  pgno: 148
- img_proc: true
  md: "# Chapter 7\n\nBut the promise pattern has a problem, that is, a promise can\
    \ be resolved only once. The promise pattern can only respond to a single activity\
    \ or data update of an asynchronous operation. For example, if we make an AJAX\
    \ request using a promise pattern, we can handle only request success and failure\
    \ activities and not the states of the request and response cycle, such as weather\
    \ server connections that have been established and response headers. Similarly,\
    \ if we handle a user activity using a promise pattern, then we can handle only\
    \ the first click, not the ones occurring after it, the promise gets resolved\
    \ in the first click.\n\nYou may or not be familiar with the promise pattern,\
    \ let's look at some sample code of what a promise pattern looks:\n\n```\n$http('http://example.com/data.json*').then(function()\
    \ {\n  // do something\n}).then(function() {\n  // do something here\n}).then(function()\
    \ {\n  // do something more here\n}).catch(function() {\n  // handle error\n})\n\
    ```\n\nHere, the $http() method makes an HTTP request asynchronously and returns\
    \ a promise. The promise is resolved if the request is successful, and the callback\
    \ passed to the first then() method is invoked, that is, the promise is resolved.\
    \ If the request fails, then the callback is passed to the catch() method, which\
    \ is invoked, and the promise is rejected. The then() method always returns a\
    \ promise, making it possible to run multiple asynchronous operations one after\
    \ another. In the code, you can see how asynchronous operations are chained. What's\
    \ important here is that the then() method can be resolved only once, and multiple\
    \ attempts will be ignored. Therefore, we cannot promise patterns to write reactive\
    \ code when we have to deal with multiple activities or data updates of an asynchronous\
    \ operation.\n\n> Some developers create a new promise for every activity and\
    \ data update. This technique may seem fine since you are able to write reactive\
    \ code involving multiple activities and data updates using promise patterns,\
    \ but it's an anti-pattern.\n\nDue to the problems with the event-driven, callback,\
    \ and promise patterns, there was a need for another pattern, and functional reactive\
    \ programming came to the rescue."
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Functional Reactive Programming


    FRP is simply reactive programming using functional programming style. We will
    learn more about functional programming in the next section. Actually, the drawbacks
    of the event-driven, callback, and promise patterns weren''t the reason for the
    invention of FRP; rather, FRP was actually invented because there were demands
    for a functional pattern for reactive programming, as functional code is easy
    to write, test, debug, reuse, and read. But FRP solves the problems caused by
    the event-driven, callback, and promise patterns, we can say that FRP is an alternative
    to the other patterns.


    In this chapter, we will learn about FRP, which is considered the modern way of
    writing reactive code.


    # Functional programming in a nutshell


    Before we get into FRP, it''s necessary to have basic knowledge about functional
    programming.


    In a nutshell, functional programming is a style of writing code in which we use
    only pure functions (including recursion) instead of loops and conditionals, and
    data is immutable.


    > Functional programming falls under the criterion of declarative programming.
    Declarative programming is a style of writing code where we write code to tell
    the system what we would like to happen instead of how to do it. Some other examples
    of declarative programming are SQL and regular expressions.


    So what is a pure function? A pure function is a function that depends only on
    its input arguments and always provides the same output for a particular input.
    If it reads anything else outside of its scope, including global variables, then
    it''s not a pure function.


    Obviously, it''s not always possible to make all the functions pure. For example,
    a function that fetches a web page or reads from the filesystem cannot guarantee
    the same return value. We should try to make as many as functions as pure as possible.
    So, we can say that 100% purity is impossible to achieve, but 85% purity is still
    very productive.


    > Functions without side effects, stateless functions, and pure functions are
    terms used interchangeably.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'As data is immutable in functional programming, you must be wondering how it
    is possible to write code without modifying data. Well, in practice, we simply
    create new data structures instead of existing ones. For example, if we have an
    array with four values and we want to remove the last one, then we simply create
    a new array, which doesn''t have the last value.


    # The advantages of immutable data


    There are several advantages of immutable data. Here are a few of them:


    +   They are thread-safe, if multiple threads operating on them cannot modify/corrupt
    their state. Learn more about thread safety at https://en.wikipedia.org/wiki/thread_safety.


    +   They object copying can be shared easily. One doesn''t have to employ a strategy
    such as defensive copying, like in mutable data structures. Learn more about object
    copying at https://en.wikipedia.org/wiki/Object_coupling_(computer_programming)
    #Object-oriented_programming.


    +   They avoid temporal coupling. More about temporal coupling can be found at
    https://en.wikipedia.org/wiki/Coupling_(computer_programming) #Object-oriented_programming.


    # Functional data structures


    As data is immutable, there are several problems you are likely to face. Here
    are a few:


    +   If an immutable array has millions of values, then creating a new array and
    copying all the values from the previous array is CPU and memory intensive


    +   If two threads need to write to the same variable, coordinating the final
    value of the variable will be difficult


    There are many other issues. These issues led to the idea of functional data structures.
    Functional data structures are a different type of data structure that aim to
    solve these kinds of issue. But you don''t need to know about functional data
    structures to follow this chapter or write functional reactive code in JavaScript.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# The advantages of pure functions


    Here are a few advantages of pure functions:


    +   - They increase reusability and maintainability, as each function is independent

    - Easier testing and debugging is possible, as each function can be tested and
    debugged separately

    - Functional programs are easy to understand as they are written in a declarative
    manner, that is, the code says what is to be done instead of it''s.


    The style of writing code using loops, conditionals, and function calls is called
    imperative programming and functional programming. Imperative programming are
    considered opposites of each other. JavaScript, C++, Java, Python, Ruby, are examples
    of imperative programming languages.


    # Functional programming with JavaScript


    You don''t have to use a functional programming language such as Erlang, Haskell,
    and so on to write functional code. Most imperative programming languages allow
    us to write functional code.


    Due to the fact that functions in JavaScript are first-class (we will learn more
    about first-class functions later), it is possible to write functional code in
    JavaScript.


    > "First-class" and "high-order" are terms used interchangeably.


    A function said to be first-class when it can be passed as an argument to another
    function, can return another function, and be assigned to a variable.


    In JavaScript, functions are first-class because they are objects. Because an
    object can be passed as an argument to another function, a function can return
    an object, and an object can be assigned to a variable, functions can be first-class.'
  merge: -1
