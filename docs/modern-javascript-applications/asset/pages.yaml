  md: '# shouldComponentUpdate(nextProps, nextState)


    The shouldComponentUpdate(nextProps, nextState) method is called before the render
    method is called, that is, before rendering happens. If this method returns false,
    then rendering is skipped.


    Remember that this method is not called before forced updates or initial rendering.


    > What is a forced update?

    React provides a forceUpdate method inside a component, which renders the component
    when called. This can be used when the render() depends on some other data instead
    of this.props and this.state, as changes to other data do not trigger the render
    method.


    # componentWillUpdate(nextProps, nextState)


    The componentWillUpdate(nextProps, nextState) method is invoked immediately before
    rendering when new props or state are being received. This method is not called
    for the initial render.


    Note that you cannot use this.setState inside this method.


    # componentDidUpdate(prevProps, prevState)


    The componentDidUpdate(prevProps, prevState) method is invoked immediately after
    the component''s updates are flushed to the real DOM. This method is not called
    for the initial render.


    # componentWillUnmount()


    The componentWillUnmount() method is invoked immediately before a component is
    unmounted from the real DOM.'
