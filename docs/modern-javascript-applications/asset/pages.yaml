    # Middleware in Socket.IO


    Middleware in Socket.IO server is a callback that executed when a Socket.IO client
    makes a handshake request, before the Socket.IO server replies to it. Middleware
    us to allow or reject handlers.


    The middleware concept of Socket.IO is similar to that of Express, but the difference
    is that the middleware doesn''t get access to the HTTP response object; also,
    the parameter signature is different. Therefore, Express middleware cannot be
    used in Socket.IO.


