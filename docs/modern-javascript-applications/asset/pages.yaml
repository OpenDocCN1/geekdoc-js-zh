  md: '# # Functional Reactive Programming


    If you are a frontend or backend JavaScript developer who works on large and complex
    JavaScript applications and deals with a lot of code that responds to asynchronous
    data updates, user activities, and system activities, then it''s perhaps the best
    time to explore functional reactive programming (FRP), as it''s a time-saving,
    bug-preventing, easy-to-read, and modularized style of writing code. You don''t
    need to know any functional programming language or be a hardcore functional language
    programmer; rather, you just need to know the basics of functional programming.
    In this chapter, we will learn how to use FRP using Bacon.js, which is an FRP
    library for both frontend and backend JavaScript.


    We''ll cover the following:


    +   - Reactive programming in a nutshell

    - Problems with writing reactive code in JavaScript

    - Introduction to functional programming

    - What is FRP

    - The building blocks of FRP

    - The advantages of FRP

    - All the APIs provided by Bacon.js'
