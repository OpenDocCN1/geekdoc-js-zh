    Before we get further into React, let''s first set up a project to use it.


    # # Setting up a basic React project


    At the time of writing, the latest version of React was 0.14.7. This is the version
    this book uses. First, visit https://facebook.github.io/react/downloads. you will
    find two types of React builds, production and development builds. The difference
    between these two builds is that the development build is uncompressed and includes
    extra warnings, whereas the production build is compressed, includes extra performance
    optimizations, and strips all extras.


    You should use the development build when your application is in the development
    phase. Once your application is ready for deployment, you should change to the
    production build.


    Again, you will find two types of production and development build: one with add-ons
    and the other without. We will use the development version without add-ons.


    You will find CDN links as well as to download and enqueue React manually. React
    is composed of two files: react.js and react-dom.js. Download both of them manually.


    Create a folder named react-demo and place the files in it. Then, create a file
    called index.html and put this code in it:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="UTF-8" />

    <title>React Demo</title>

    <script src="react.js"></script>

    <script src="react-dom.js"></script>

    </head>

    <body>

    ```'
