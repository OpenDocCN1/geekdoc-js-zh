  md: '# Building an Advanced Profile Search Widget


    The best way to master FRP using Bacon.js is by building a real world application,
    which is what we will do in this chapter. We will build an advanced profile search
    widget, just the ones you would usually find on social networking or dating sites.
    To keep the chapter short and to the point, we will work with some sample data
    instead of building registration functionality. We will also learn some more advanced
    concepts of functional programming and Bacon.js.


    In this chapter, we will cover the following:


    +   * Error events in Bacon.js

    * Handling exceptions in FRP

    * Lazy evaluation

    * Buses in Bacon.js

    * Join patterns

    * Finally, we will build an advanced profile search widget


    # Errors in Bacon.js


    Bacon provides the Bacon.Error constructor to explicitly mark events or values
    of EventStreams or properties respectively as errors so that Bacon can identify
    them and open up a wide variety of other APIs to work with those errors specifically.'
