  md: '4. Now, enter an invalid path in the address bar. You should be able to see
    this output:


    ![](img/a330fba1360168a944317211e66958a7_313_0.png)


    # Routing life cycle methods


    When a path matches a component, Angular 2 activates the component, and when the
    path changes, Angular 2 deactivates it. When we say that a component has been
    activated, it means that Angular 2 has created an instance of a component, that
    is, called the constructor method of the component, whereas when we say a component
    has been deactivated, it means the component has been removed from the DOM and
    is deleted.


    The methods of a component that are called activating or deactivating it are called
    routing lifecycle methods.


    Here is the list of routing lifecycle methods:


    +   * CanActivate: This hook is invoked before activating the component. It should
    return a boolean value or a promise indicating whether to activate the component.

    * routerOnActivate: This method is invoked after the component has been activated.

    * routerCanReuse: This method is invoked to find out whether to reuse the previous
    instance of the component when the next URL change is the URL again. It should
    return a boolean value or a promise indicating whether to reuse. It is invoked
    only if an instance has been created earlier.

    * routerOnReuse: This method is invoked if the component is being reused. It is
    called after `routerCanReuse`.

    * routerCanDeactivate: This method is invoked before deactivating the component.
    It should return a boolean value or a promise indicating whether to deactivate
    the component.

    * routerOnDeactivate: This method is invoked after the component has been deactivated.'
