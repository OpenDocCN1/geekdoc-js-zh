  md: 'Chapter 9


    If you are not familiar with the rem and em CSS units, it''s the right time to
    learn it.


    The em unit is relative to the font size of the parent element. 1em is equal to
    the current font size of the parent element. 2em means two times the size of the
    current font. For example, if an element is displayed with a font size of 10 px,
    then 2em is 20 px. We can achieve responsive typography and components by changing
    the font element''s size using CSS media queries for different viewport or device
    width sizes.


    As sizing is nested (it depends on parent element), if you have elements with
    1.5em sizing and then nest some HTML elements that also have an em declaration,
    their sizing multiples.


    The rem unit is similar to em but is relative to the font size of the HTML tag
    (root element). Therefore, it''s not nested.


    > Bootstrap 4 uses a base font size of 16 pixels.


    # The grid system


    The only change in the Bootstrap 4 grid system is that a new extra-large breakpoint
    has been added. The class prefix for this breakpoint is .col-xl-. Here are the
    Bootstrap 4 breakpoints after this new addition:


    | | Extra Small | Small | Medium | Large | Extra Large |

    |---|---|---|---|---|---|

    | Container width | <544px | ≥544px | ≥768px | ≥992px | ≥1200px |

    | Class prefix | Auto .col-xs- | .col-sm- | .col-md- | .col-lg- | .col-xl- |

    | Gutter width | | | | | 1.875rem / 30px (on each side of a column) |


    .col-xl- breakpoint targets sizes of 1200px or larger, which was targeted by .col-lg-
    in Bootstrap 3. Therefore, this makes breakpoints compress to target smaller sizes
    than they used in Bootstrap 3. Here, you can see that .col-xs- now targets a certain
    width of less than 544px instead of the 768px it did in Bootstrap 3, making it
    easier to target mobile devices and have different layouts for tablets and mobile
    devices, which was lacking in Bootstrap 3.


    [ 175 ]'
  merge: -1
