    \ the route:\n\n```\napp.get(\"/delete/:id\", function (httpRequest, httpResponse,\
    \ next) {\n  fs.unlink(\"/public/images/\" + httpRequest.params.id,\n  function(err)\
    \ {\n    if (err) return httpResponse.status(500).send(\"An error occured\");\n\
