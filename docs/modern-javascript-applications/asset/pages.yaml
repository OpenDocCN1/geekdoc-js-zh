  md: '# Other issues of monolithic architecture


    Here are some other issues that developers might face, depending on the technology
    that is used to build the monolithic server-side application:


    +   * It may need to be completely rebuild and redeployed for every small change
    made to it. This is a time-consuming task and makes your application inaccessible
    for a long time.

    * It may completely fail if any one of the components fails. It is difficult to
    build a monolithic application to handle failure of specific components and degrade
    application features accordingly.

    * It may be difficult to find how much resources are each components consuming.

    * It may be difficult to test and debug individual components separately.


    # Microservices architecture to the rescue


    We saw the problems caused by monolithic architecture. These problems lead developers
    to switch from monolithic architecture to microservices architecture.


    In microservices architecture, the server-side application is divided into services.
    A service (or microservice) is a small and independent process that constitutes
    a particular functionality of the complete server-side application. For example,
    you can have a service for payment processing, another service for account management,
    and so on; the services need to communicate with each other via a network.


    > What do you mean by "small" service?

    You must be wondering how a small service needs to be and how to tell whether
    a service is small or not. Well, it actually depends on many factors as the type
    of application, availability of resources, size of application, and how small
    you think it is. However, a small service is be the one that is written fewer
    lines of code or provides a very basic functionality. A small service can be the
    one on which a team of developers can work independently, which can be scaled
    independently to other services, scaling it doesn''t cause unbalanced utilization
    of resources, and overall they are highly decoupled (independent and unaware)
    of other services.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Breaking into Microservices Architecture


    You don''t have to run each service in a different server, that is, you can run
    multiple services in a single computer. The ratio of server to services depends
    on different factors. A common factor is the amount and type of resources and
    technologies required. For example, if a service needs a lot of RAM and CPU time,
    then it would be better to run it individually on a server. If there are some
    services that don''t need much resources, then you can run them all in a single
    server together.


    The following diagram shows an example of the microservices architecture:


    ![](img/a330fba1360168a944317211e66958a7_26_0.png)'
