  md: '# Shadow DOM


    Shadow DOM allows HTML elements to get a new kind of node called a shadow root
    associated with them. An element that has a shadow root associated with it is
    called a shadow host. The content of a shadow host is not rendered; the content
    of the shadow root is rendered instead. A shadow root can have another shadow
    root below it.


    The benefit of shadow DOM is that CSS styles defined inside a shadow root won''t
    affect its parent document, and CSS styles defined outside the shadow root will
    not affect the elements inside the shadow root. This is useful to define styles
    specific to the components. In short, we can say that shadow DOM provides style
    encapsulation.


    Style encapsulation is not the only benefit of shadow DOM. The HTML inside the
    shadow root is protected from accidental modification from JavaScript. We can
    still inspect the shadow root in browser developer tools.


    Many elements, such as <video> and <audio>, have a shadow root, but when you inspect
    it, you won''t see the shadow root. Browsers by default hide the shadow roots
    of these elements. To see their roots, you need to change browser-specific settings.


    Let''s modify the previous custom element code to render the template inside shadow
    DOM. Replace the previous created method with this:


    ```

    customCardProto.createdCallback = function() {

    var template = document.querySelector(''#cardTemplate'');

    template.content.querySelector(''img'').src = this.getAttribute(''data-img'');

    template.content.querySelector(''h3'').innerHTML = this.getAttribute(''data-title'');

    template.content.querySelector(''p'').innerHTML = this.getAttribute(''data-description'');


    var clone = document.importNode(template.content, true);

    var shadow = this.createShadowRoot();

    shadow.appendChild(clone);

    }

    ```


    Here, instead of appending the template code directly to the custom element, we
    created a shadow root using createShadowRoot and appended the template code to
    it.'
