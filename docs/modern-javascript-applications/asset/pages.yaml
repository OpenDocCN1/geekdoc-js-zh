  md: '# Bidirectional Communication in Real Time


    We have been using COMET techniques to implement bidirectional communication between
    a web browser and web server. Long polling is the most popular technique of achieving
    bidirectional communication between a web browser and web server because it works
    without compromising user experience and without any extra server configuration,
    and it works on all web browsers that support AJAX. Long polling and other comet
    techniques is that none of them are suitable for building real-time apps because
    a bunch of headers and cookie data is transferred to the server, which in turn
    increases the latency; therefore making it unsuitable to creating applications
    such as multiplayer games, chat apps, social de-vveluties, and live score websites,
    which require bidirectional communication in real time. Therefore, a new protocol
    WebSocket was introduced, which was designed to enable bidirectional communication
    in real time between a web browser and WebSocket server.


    In this chapter, we will cover the following:


    +   * An overview of WebSocket

    * The relationship between WebSocket and HTTP

    * The interaction of WebSocket with proxy servers and firewalls

    * Implementing WebSocket using Socket.IO

    * The Socket.IO API in depth

    * Many other important things related to WebSocket and Socket.IO'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Introducing WebSocket


    WebSocket is an application-layer protocol designed to facilitate bidirectional
    (either the client or server can send a message to the other party whenever a
    message is available) and full-duplex communication (both the client and server
    can send messages to each other simultaneously) between a web browser and WebSocket
    server in real time.


    WebSocket is a binary protocol; therefore, it is faster than the HTTP protocol,
    which is a text-based protocol.


    WebSocket has gained popularity and is already being used by many websites for
    its real-time and full-duplex features. Due to overhead caused by comet techniques,
    it was not suitable for real-time bidirectional message transfer, and it was also
    not possible to establish a full-duplex communication system between a web browser
    and web server using comet. That is, comet lets us achieve only half-duplex communication
    system (only the client or server can send messages to the other party at a time).


    WebSocket is designed to facilitate bidirectional communication between a web
    browser and WebSocket server, but it can be used by any client. In this chapter,
    we will only concentrate on how it''s implemented in a web browser.


    > What is the WebSocket API?

    Web browsers provide an API for creating and managing a WebSocket connection to
    a WebSocket server as well as for sending and receiving data on the connection.
    We won''t use this API for implementing WebSocket; instead, we will use the Socket.IO
    library.


    # The relationship between WebSocket and HTTP


    The only relationship between WebSocket and HTTP is that a WebSocket handshake
    between a web browser and WebSocket server is done using HTTP. Therefore, the
    WebSocket server is also an HTTP server. Once the handshake is successful, the
    same TCP connection is used for WebSocket communication, that switches to the
    bidirectional binary protocol, which does not conform to the HTTP protocol. The
    default port number for WebSocket is 80, same as for HTTP.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Chapter 5


    > Why is the default WebSocket port 80?

    The main reason for integrating HTTP and WebSocket so tightly and making WebSocket
    share the HTTP port is to prevent firewalls from blocking non-web content.


    Although you can implement your own WebSocket handshake mechanism if you are using
    WebSocket outside a browser environment, the official WebSocket documentation
    only states the HTTP handshake mechanism because WebSocket is designed to enable
    bidirectional communication between web browsers and WebSocket servers.


    You can integrate a WebSocket server into your main web server that serves your
    HTML pages, or you can use a separate web server for WebSocket communication.


    # Sending and receiving data on a WebSocket connection


    Data is transferred through a WebSocket connection as messages, each of which
    consists of one or more frames containing the data you are sending (called the
    payload). In order to ensure that the message can be properly reconstructed when
    it reaches the other party, each frame is prefixed with 4-12 bytes of data about
    the payload. Using this frame-based messaging system helps reduce the amount of
    non-payload data that is transferred, leading to significant reductions in latency,
    therefore making it possible to build real-time components.


    We won''t get into the exact data format and other details of the WebSocket handshake,
    data framing, and receiving data as this is only required if you are planning
    to create your own WebSocket server. We will use Socket.IO JavaScript library
    to implement WebSocket in our application, which takes care of all the internal
    details of WebSocket and provides an easy-to-use API.


    # WebSocket schemes


    WebSocket protocol specifications have introduced two new URL schemes, called
    ws and wss.


    ws represents an unencrypted connection whereas wss represents an encrypted connection.
    Encryption connections use TLS to encrypt messages.


    So, when making a WebSocket handshake request using HTTP, we need to use ws instead
    of http or https, respectively.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '> Why ws and wss instead of http and https?

    You must be wondering what the point of introducing a new scheme instead of just
    using http. Well, the reason behind this is that WebSocket can also be used outside
    a web browser environment, and a handshake can be negotiated via a non-HTTP server.
    Therefore, a different scheme is required when not using HTTP for the handshake.


    # The interaction of WebSocket with proxy servers, load balancers, and firewalls


    The WebSocket protocol is unaware of proxy servers by itself. When a WebSocket
    connection is established behind a proxy server, the WebSocket connection can
    fail or work properly, depending on whether the proxy server is transparent or
    explicit and whether we have established a secure or unsure connection.


    If the browser is configured to use an explicit proxy server, then it will first
    issue an HTTP CONNECT method to that proxy server when establishing the WebSocket
    connection. The CONNECT method is used to tell a proxy to make a connection to
    another host and reply with the content, without attempting to parse or cache
    it. A browser issues the HTTP CONNECT method regardless of whether the connection
    is encrypted or unencrypted.


    If we are using a transparent proxy server (that is, a proxy server that the web
    browser is unaware of) and the connection is encrypted, then the browser doesn''t
    issue an HTTP CONNECT method because it''s unaware of the proxy server. But as
    the connection is encrypted, the proxy server will most probably let all the encrypted
    data through, causing no problems to the WebSocket connection.


    If we are using a transparent proxy server and the connection is unencrypted,
    then the browser doesn''t issue an HTTP CONNECT method because it''s unaware of
    the proxy server. The proxy server is likely to try to cache, parse, or block
    the data, causing issues for the WebSocket connection. In this case, the proxy
    server should be upgraded or configured to support WebSocket connections.


    The WebSocket protocol is unaware of firewalls by itself. If you are using a TCP
    load balancer, it''s unlikely to cause any problems for a WebSocket connection.
    But if you are using an HTTP load balancer, it''s likely to cause problems; therefore,
    it needs to be upgraded or explicitly configured to handle WebSocket connections.


    The WebSocket protocol is unaware of firewalls by itself. Firewalls are unlikely
    to cause any problems for a WebSocket connection.'
