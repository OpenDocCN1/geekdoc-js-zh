    # # Virtual DOM


    A browser interprets HTML and creates a DOM. A DOM is a tree-like structure that
    defines the structure of the page. The DOM API is what we use to manipulate the
    DOM. When we manipulate it, the browser re-renders the manipulated parts.


    The problem is not with how the DOM works, but how we programmatically alter it.
    Managing nodes of a DOM requires expertise; otherwise, we could end up re-rendering
    lots of nodes unnecessarily, which would result in poor rendering performance.


    For example, imagine we have a large list of products in an e commerce website.
    We also have a filter widget to filter the items. When we change the values in
    the filter widget, the list items are reloaded and the complete list is re-rendered,
    which requires a lot of manipulation to the DOM and can result in bad rendering
    performance. To get better performance, we can actually manipulate only parts
    of the list, such as product titles, image, and cost. Writing code for this is
    going to be hard.


    Let''s take another example. If you are using ng-repeat to display a list, adding
    a new item to the list will cause the complete re-rendering of the list. So, if
    Facebook or Instagram had used ng-repeat, whenever we scrolled, the whole set
    of posts would have been re-rendered. The solution to this problem is instead
    of using ng-repeat, which re-renders the whole list, we can append a new post
    to the end of the list using jQuery or pure JavaScript. But if you want to maintain
    the posts that are being displayed, then you will end up writing more complex
    code.


    Due to these kinds of problem, virtual DOM was introduced. Virtual DOM makes sure
    that anyone can write complex reactive UI without worrying about performance.
    Virtual DOM is the secret that React implements to achieve rendering performance.'
