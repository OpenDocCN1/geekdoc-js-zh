  md: '# New Features of Angular 2


    An Angular 2 application is composed of a view and various services. Services
    are simple JavaScript objects that hold application logic and state. Services
    should be reusable. Views consume services, and services can also interact with
    each other.


    Views and services are loosely coupled that an Angular 2 view can be used with
    any other architecture, such as Flux. Similarly, services can be used with any
    other view, such as React.


    Angular 2 views are based on component-oriented architecture. The application
    UI is divided into reusable components. A component has a UI with code to update
    the UI and handle user actions on the UI. A custom tag is associated with a component,
    and whenever the custom tag appears, a new instance of the component is created
    and rendered. So, we can say that component-oriented architecture is architecture
    for the view of an application. Actually, the components consume the services.


    > In the previous two chapters, we studied React, which is also based on component-oriented
    architecture, since with React, we will build an application as a set of components.


    Here is a diagram from the official Angular 2 website (https://angular.io) that
    shows the complete architecture of Angular 2:


    ![](img/a330fba1360168a944317211e66958a7_264_0.png)


    Here, you can see that the UI of a Component is defined using a Template. Templates
    are written using template HTML, that is, a combination of HTML and many other
    tokens. A component also holds the UI state and event handlers of the UI.'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'We shouldn''t store application logic and state inside a component, as it will
    have an impact on code reusability and cause issues while developing large and
    complex apps. Application state and logic should be stored in services.


    Angular 2 only implements one-way data binding. This makes large and complex apps
    easier to debug.


    Services are injected into specific components that they need, and not all the
    components.


    # Introducing web components


    Before we get into web components, you need to know why we are learning about
    them. Well, we are learning about web components because Angular 2 utilize DOM
    and templates, which are a part of web components.


    In a nutshell, web components are a collection of four browser specifications
    that enable the creation of reusable components in web pages. These four specifications
    are **HTML imports**, **shadow DOM**, **templates**, and **custom elements**.
    They can be used together or separately.


    Web components provide native implementation of component-oriented architecture.
    A component created using web components is called a web component as well.


    Before we learn about web components, let''s consider a project for demonstration
    purposes. Create a directory `web-components`, and then create a file named `index.html`
    in it. Web components have pretty poor browser support, so let''s download webcomponents.js
    polyfill. Download the webcomponents.js file from `https://github.com/webcomponents/webcomponentsjs`
    and place it in the web-components directory.


    Now, place this code in the index.html file:


    ```

    <!doctype html>

    <html>

    <head>

    <title>Web Components Demo</title>

    <script src="webcomponents.js"></script>

    </head>

    <body>

    <script>

    //place JavaScript code here

    </script>

    </body>

    </html>

    ```'
