    \ and immutable and therefore useless for building reactive UIs. Also, they don't\
    \ provide a structured mechanism for UI usability.\n\nA React component is a reusable\
    \ custom tag that is mutable and encapsulated in an embedded state, that is, changes\
    \ to the state or properties will mutate the UI. For example, we have a component\
    \ named clock that takes the current time as an attribute and displays it with\
    \ the passed time. Another exchange could be a Bitcoin price component that displays\
    \ Bitcoin prices in real.\n\nA component state is internal to the component. It's\
    \ created and mutated inside the component, the properties of a component cannot\
    \ be mutated inside the component; rather, they can be mutated by the code that\
    \ created the component instance.\n\nYou can break your UI into components—this\
