  md: '# New Features of Angular 2


    +   - ngDoCheck: This is called during every change-detection cycle and right
    after ngOnInit. We can detect and act upon that Angular 2 can or won''t detect
    on its own. This is invoked after Angular 2 is done checking state changes for
    the component and has updated the state if there was any change in the attributes
    before the component view is updated. After this call is over, the view is rendered,
    and when rendering it, ngAfterContentInit, ngAfterContentChecked, ngAfterViewInit,
    and ngAfterViewChecked are invoked.


    +   - ngAfterContentInit: This is invoked after content children have been initialized
    but not yet rendered, that is, after ngOnChanges, ngOnInit, ngDoCheck, ngAfterContentInit,
    and ngAfterContentChecked methods of the content children have been called.


    +   - ngAfterContentChecked: This is invoked whenever the change-detection cycle
    checks whether the content children have changed as well as right after ngAfterContentInit.
    If there is a change, it''s invoked before the views of the content children.
    Before invoking it, the query results of ng.core.ViewChildren, ng.core.ContentChildren,
    and so on are updated, that is, it''s invoked after ngAfterContentChecked of the
    content children has been invoked. After this call, the content children views
    are updated.


    +   - ngAfterViewInit: This is invoked after view children have been initialized
    but not yet rendered, that is, after ngOnChanges, ngOnInit, ngDoCheck, ngAfterContentInit,
    ngAfterContentChecked, ngAfterViewInit, and ngAfterViewChecked methods of the
    view children have been called.


    +   - ngAfterViewChecked: This is invoked whenever the change-detection cycle
