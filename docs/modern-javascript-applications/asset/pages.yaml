    # Global margin reset


    For all elements, Bootstrap 4 resets margin-top to 0 while keeping a consistent
    margin-bottom value on all elements.


    For example, headings have margin-bottom: .5rem added, and paragraphs have margin-bottom:
    1rem for spacing.


    # Spacing utility classes


    Bootstrap 4 adds a new set of utility classes called spacing utility classes.
    These classes allow you to quickly add padding in any direction of element via
    margin or padding.


    The format of these classes is [margin or padding] - [direction] - [size].'
