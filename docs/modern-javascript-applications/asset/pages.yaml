  md: '# Chapter 3


    The preceding steps seem to have no problem; however, there are some major problems.
    The peers may be behind a NAT device or firewall, so finding their public IP address
    is a challenging task, sometimes it is practically impossible to find their IP
    address. So, how does RTCPeerConnection find an IP address of the peers when they
    may be behind a NAT device or firewall?


    RTCPeerConnection uses a technique called Interactive Connectivity Establishment
    (ICE) to resolve all these issues.


    ICE involves Session Traversal Utilities for NAT (STUN) and Using Relays around
    NAT (TURN) to solve the problems. A STUN server is used to find the public IP
    address of a peer. In the case the IP of a peer cannot be found, or to some other
    reason a peer-to-peer connection cannot be established, then a TURN server is
    used to redirect the traffic, that is, both the peers communicate via the TURN
    server.


    We need to provide the addresses of the STUN and TURN servers and RTCPeerConnection
    handles the rest. Google provides a public STUN server, which is used by everyone.
    Building a TURN server requires a list of resources as the actual data flows through
    it. Therefore, WebRTC makes it optional to use a TURN server. If RTCPeerConnection
    fails to establish a direct communication between two peers and a TURN server
    is not provided, there is no other way for the peers to communicate and a peer-to-peer
    connection establishment fails.


    > WebRTC doesn''t provide any way to make signaling secure. It''s your job to
    make the signaling secure.


    # Transferring MediaStream


    We saw how RTCPeerConnection establishes a peer-to-peer connection. Now, to transfer
    MediaStream, we just need to pass the reference of MediaStream to RTCPeerConnection
    and it will transfer MediaStream to the connected peer.


    > When we say MediaStream is transferred, we mean the mean of individual tracks
    is transferred.


    The Following are some of the things you need to know regarding the transfer of
    MediaStream:


    +   * RTCPeerConnection uses SRTP as an application layer protocol and UDP as
    a transport layer protocol to transfer MediaStream. SRTP is designed for media
    stream transfer in real time.


    [ 65 ]'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Communication between Browsers in Real Time


    +   * UDP doesn''t guarantee the order of packets, but SRTP takes care of the
    order of the frames.


    +   * The Datagram Transport Layer Security (DTLS) protocol is used to secure
    the MediaStream transfer. So, you don''t have to worry about the security while
    transferring MediaStream.


    +   * Constraints of the tracks that the remote peer may be different from the
    constraints of the local tracks, as RTCPeerConnection modifies the stream atomically,
    depending on the bandwidth and other network factors to speed up the transfer,
    achieving real-time data transfer. For example, RTCPeerConnection may decrease
    the resolution and frame rate of video while transferring.


    +   * If you add or remove a track from MediaStream that is already being sent,
    then RTCPeerConnection updates MediaStream of the other peer by communicating
    to the other peer via the signaling server.


    +   * If you pause a track that is being sent, then RTCPeerConnection pauses transfer
    of the track.


    +   * If you stop a track that is being sent, RTCPeerConnection stops the transfer
    of the track.


    > You can send and receive multiple MediaStream instances via single RTCPeerConnection,
    is that, you don''t have to create multiple RTCPeerConnection instances to send
    and receive multiple MediaStream instances to and from peer. Whenever you add
    or remove a new MediaStream to or from RTCPeerConnection, the peers exchange information
    related to this via the signaling server.


    # RTDataChannel API


    RTDataChannel is used to transfer data other than MediaStream between peers to
    transfer arbitrary data. The mechanism to establish a peer-to-peer connection
    to transfer arbitrary data is similar to the mechanism explained in the earlier
    section.


    RTDataChannel is an object that implements the RTDataChannel interface.


    The following are some of the things you need to know regarding RTDataChannel:


    +   * RTDataChannel uses SCTP over UDP as a transport layer protocol to transfer
    data. It doesn''t use unlayered SCTP protocol as the SCPT protocol is not supported
    by many operating systems.


    +   * SCTP can be configured for reliability and delivery order, unlike UDP, which
    is unreliable and unordered.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '+   * RTDataChannel also uses DTLS to secure data transfer. So, you don''t
    have to worry about the security at all while transferring data via RTDataChannel.


    ![](img/a330fba1360168a944317211e66958a7_87_0.png)


    # # WebRTC applications using PeerJS


    PeerJS is a client-side JavaScript library that provides an easy-to-use API to
    work with WebRTC. It only provides an API to exchange MediaStream and arbitrary
    data between peers. It doesn''t provide an API to work with MediaStream.


    # # PeerServer


    PeerServer is an open source signaling server by PeerJS to establish a peer-to-peer
    connection. PeerServer is written in Node.js. If you don''t want to run your own
    PeerServer instance, then you can use PeerServer cloud, which hosts PeerServer
    for public use. PeerServer cloud allows you to establish a maximum of 50 concurrent
    connections for free.


    A unique ID identifies every peer connected to PeerServer. PeerServer itself can
    generate the ID, or else the peers can provide their own ID. For a peer to establish
    a peer-to-peer connection with another peer, it just needs to know the other peer''s
    ID.


    You might want to run your own PeerServer instance when you want to add more functionality
    to PeerServer or you want to support more than 50 concurrent connections. For
    example, if you want to check whether the user is logged in to PeerServer, then
    you need to add this feature and host your own PeerServer.


    In this chapter, we will use PeerServer cloud, but in the next chapter, we will
    create our own account of PeerServer. Therefore, to continue further with this,
    create an account on the PeerServer cloud and retrieve the API key. Every application
    gets an API key to access the PeerServer cloud. If you are hosting your own PeerServer,
    you won''t need an API key. The API key is used by PeerServer cloud to track the
    connections established by an application. To create an account and retrieve an
    API key, visit http://peerjs.com/peerserver.'
  merge: -1
