  md: "# An overview of buses\n\nA bus is just like an EventStream, but it lets us\
    \ push values into the stream manually instead of attaching it to a source, and\
    \ it also allows plugging other EventStreams and properties into the bus on the\
    \ fly.\n\nHere is an example that demonstrates how to create a bus and various\
    \ methods provided by a Bacon.Bus instance. Place this code in the index.js file:\n\
    \n```\nvar bus = new Bacon.Bus();\n\nbus.onValue(function(event) {\n  console.log(event);\n\
    }\n```\n\n```\nbus1.push(1);\nbus1.push(2);\nvar bus2 = new Bacon.Bus();\nbus1.plug(bus2);\n\
    bus2.push(3);\nbus1.error(\"Unknown Error');// pushed an Bacon.Error\nbus1.end();\n\
    bus2.push(4);//this will not be pushed as bus has ended\n```\n\nThe code is self\
    \ explanatory. The output of the above code is as follows:\n\n+   1\n2\n3\n\n\
    # Subscribing to the end of EventStreams and properties\n\nBacon provides the\
    \ onEnd method to subscribe to callbacks that will be executed when an EventStream\
    \ or property ends.\n\nHere is some example code, which shows how to use the onEnd\
    \ callback. Place it in the index.js file:\n\n```\nscript_start_time.onEnd(function()\
    \ {\n  console.log(\"Script start time has been successfully calculated and logged\"\
    );\n}\n```"
