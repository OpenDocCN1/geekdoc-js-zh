  md: '# New Features of Angular 2


    Here is how the code works:


    +   - By default, custom elements inherit methods and properties of HTMLElement

    - To register a custom element, we need to use the `document.register` method.
    The first argument is the custom tag name and the second argument is an optional
    object. This optional object can take a property called `prototype`. The `prototype`
    property defines the HTML element it inherits, that is, the properties and methods
    of the HTML element it inherits. By default, it''s assigned to `Object.create(HTMLElement.prototype)`.

    - We can also add new properties and methods to our custom element by adding new
    properties and methods to the object assigned to the `prototype` property.

    - Here, we''ve added a method `createdCallback`, which is invoked whenever an
    instance of a custom element is created, that is, either an instance created using
    JavaScript or HTML.

    - Inside `createdCallback`, we are retrieving our template and setting the image
    source, title, and description and then appending it to the custom element by
    creating a clone of it, as many custom elements will share the same template.


    Now, if you open `index.html` in a browser, you will see this output:


    | Title 1 | Title 2 |

    | --- | --- |

    | Description 1 | Description 2 |'
