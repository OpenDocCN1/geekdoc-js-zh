    \ {}\n```\n\nNow when you click on the button, the event will be logged.\n\nThe\
    \ log method is also considered as a subscriber.\n\n# # Type 2\n\nMethods such\
    \ as map and combine* use lazy evaluation to avoid evaluating expressions and\
    \ values that aren't actually needed. Lazy evaluation results in high performance\
    \ benefits in some cases.\n\nBut how do map and combine* know whether an event\
    \ or value is needed? Well, there are a few methods that give a hint about this\
    \ to map and combine*, for example, sampledBy."
