  md: '> You can find the official documentation of PeerJS API at http://peerjs.com/docs/#api.


    # # Miscellaneous


    At the time of writing this book, the WebRTC specifications were not finalized.
    The overall idea of how WebRTC does and how WebRTC works has been finalized. It''s
    just that the APIs are still under development.


    For example, WebRTC has introduced an alternative to the navigator.getUserMedia()
    method, that is, navigator.mediaDevices.getUserMediaMedia(). At the time of writing
    this book, navigator.mediaDevices.getUserMediaMedia() is not supported in any
    browsers. The difference between them is that the navigator.mediaDevices.getUserMediaMedia()
    method is based on the callback pattern. At present, there is no need rid of navigator.getUserMediaMedia()
    due to the backward compatibility reason, but in future, navigator.getUserMediaMedia()
    may be removed as WebRTC wants to implement multiple APIs using the promise pattern,
    it''s difficult to maintain multiple APIs anymore. Similarly, navigator.mediaDevices.enumerateDevice()
    is an alternative to MediaStreamTrack.getSources(), that is, navigator.mediaDevices.enumerateDevice()
    is based on the promise pattern.


    > You can find the official specification of WebRTC at http://www.w3.org/TR/#tr_Web_Real_Time_Communication.


    Due to the fact that there are multiple APIs for the same feature, with a different
    browser support, WebRTC provides a script called adapter.js, which is a shim to
    insulate websites from specification changes and prefix differences. You can find
    the shim at https://github.com/webrtc/adapter.


    WebRTC is a GitHub repository where it puts a lot of example projects showing
    some of the things that can be built using WebRTC. You can find the repository
    at https://github.com/webrtc/samples. Just by looking at the examples and their
    source code, you can learn more about WebRTC.'
