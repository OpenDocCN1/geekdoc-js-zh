  md: '# Introduction to WebRTC


    **Web Real-Time Communications (WebRTC)** is a browser technology that enables
    retrieval of media stream of physical media sources and exchange media stream
    or any other data in real time. It comprises of three APIs: MediaStream constructor,
    RTCPeerConnection constructor, and RTCDataChannel interface.


    In short, MediaStream is used to retrieve the stream of physical media source,
    RTCPeerConnection is used to exchange MediaStream among peers in real time, and
    finally, RTCDataChannel is used to exchange arbitrary data among peers.


    Let''s see how these APIs work.


    # MediaStream API


    Two main components of MediaStream API are the MediaStream constructor and MediaStreamTrack
    interface.


    A track represents the stream of a media source. A track implements the MediaStreamTrack
    interface. A track can be either an audio track or a video track. A track that
    is attached to an audio source is an audio track, and a track attached to a video
    source is a video track. There can be multiple tracks attached to a particular
    media source. We can also attach constraints to a track. For example, a track
    attached to a webcam has constraints such as the minimum video resolution and
    FPS. Each track has its own constraints.


    You can change the constraints of a track after it''s created using the `applyConstraints()`
    method of the MediaStreamTrack interface. You can retrieve the constraints applied
    to a track anytime using the `getSettings()` method of the MediaStreamTrack interface.
    To detach a track from a media source, that is to stop the track permanently,
    we use the `stop()` method of the MediaStreamTrack interface. To pause a track,
    that is to stop the track temporarily, we can assign `false` to the enabled property
    of the MediaStreamTrack interface.


    > Find out more about the MediaStreamTrack interface at https://developer.mozilla.org/en-US/docs/Web/API/MediaStreamTrack.


    A track can either be a local or remote track. A local track represents the stream
    of a local media source; whereas, a remote track represents the stream of a remote
    media source. You cannot apply constraints to the remote track. To find whether
    a track is local or remote, we can use the `remote` property of the MediaStreamTrack
    interface.'
