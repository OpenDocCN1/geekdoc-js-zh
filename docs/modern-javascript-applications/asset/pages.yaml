    \n# # Namespaces in Socket.IO\n\nA Socket.IO server is actually divided into client\
    \ servers namespaces. Every namespace has a name, Socket.IO client always connects\
    \ to a namespace, which looks like an HTTP path.\n\nIn the previous code, when\
    \ we created a Socket.IO server, a default namespace was created. The default\
    \ namespace is identified by the / path. If we don't mention a namespace when\
    \ creating a Socket.IO client, it connects to the default namespace. So, the `connection`\
    \ event is specific to a particular namespace, that is, for every namespace, we\
    \ have to register a different `connection` event handler.\n\n> **What is the\
    \ benefit of namespaces?**\nYou be wondering what the point of introducing namespaces\
    \ is. Well, namespaces make writing complex code easier. Let's look at an example\
    \ to understand this.\nnSuppose you have a web page that has multiple components\
    \ that update in real time. You would then either create multiple Socket.IO servers\
    \ or rely on the data format of a message or custom event to find which data belongs\
    \ to which component. Both of these have merits. That is, creating multiple Socket.IO\
    \ servers occupies multiple ports, so it's not suitable for a large number of\
    \ components, and relying on the data formats of messages and custom events make\
    \ it difficult to move frontend components to a separate application, as the new\
    \ application will get a lot of unnecessary messages and events, causing bandwidth\
    \ issues on both sides. Further, namespaces were introduced, which combine the\
    \ benefits of both while minimizing their demerits.\n\nHere is how to create a\
    \ custom namespace. This code in the `socket.js` file:\n\n```\nvar nsp = io.of(\"\
    /custom-namespace\");\n\nsp.on(\"connection\", function(socket) {\n  socket.send(\"\
    Hi, from custom-namespace\");\n});\n\nsocket.on(\"message\", function(message)\
    \ {\n  console.log(message);\n});\n```"
