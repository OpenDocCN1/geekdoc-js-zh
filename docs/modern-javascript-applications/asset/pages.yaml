  md: 'Here, you can think of Service 1 as the web server with which a browser communicates
    and other services providing APIs for various functionalities. The web services
    communicate with other services to get data.


    # Merits of microservices architecture


    Due to the fact that services are small and independent and communicate via network,
    microservices architecture solves many problems that monolithic architecture had
    here. Here are some of the benefits of microservices architecture:


    +   - As the services communicate via a network, they can be written in different
    programming languages using different frameworks


    +   - Making a change to a service only requires that particular service to be
    redeployed instead of all the services, which is a faster procedure


    +   - It becomes easier to measure how much resources are consumed by each service
    as each service runs in a different process


    +   - It becomes easier to test and debug, as you can analyze each service separately


    +   - Services can be reused by other applications as they interact via network
    calls


    # Scaling services


    Apart from the preceding benefits, one of the major benefits of microservices
    architecture is that you can scale individual services that require scaling instead
    of all the services, therefore preventing duplication of resources and unbalanced
    utilization of resources.'
