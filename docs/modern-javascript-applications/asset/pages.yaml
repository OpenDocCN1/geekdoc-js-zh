    # Creating the image upload server


    We have finished building the services. Now let''s build the image storage server.

    The image storage server defines the routes using which an image can be stored,
    deleted, or retrieved.


    Open the Initial/image-storage directory. Inside the directory, you will find
    a package.json file and an app.js file. The app.js file is where you will write
    your code, and package.json lists the dependencies for the image storage server.

