  md: '# Building User Interfaces Using React


    React.createElement is used to create an object of a ReactElement interface.

    A ReactElement object is a light, stateless, and virtual representation of a real
    DOM element, but it''s not a real DOM element. It''s a virtual DOM, basically.

    React and real DOM elements are of different interfaces. The first parameter of
    .createElement is an HTML tag name or an object of a ReactClass interface. We
    will learn more about ReactClass later on. The second argument is an object containing
    attributes of the HTML tag or properties of the ReactClass object. And, then we
    can pass an infinite number of arguments, which can be strings, ReactElement objects,
    or ReactClass objects. All the arguments after the second are treated as children
    of the ReactElement object that''s going to be created. If the elements are dynamically
    decided, then you can provide an array as the third argument.


    Here, we created three ReactElement objects. helloWorld is an anchor tag with
    helloWorlditalic as its children. We assigned the href attribute of the anchor
    tag to.


    DOM.render is used to render ReactElement objects in the real DOM.

    DOM.render takes a ReactElement object as first argument, and the second argument
    is the reference to the container element in the real DOM inside which we want
    to add to the ReactElement.


    Here, we rendered the anchor tag inside the container element.


    > As a ReactElement object is stateless, we cannot assign any UI event handlers
    to the properties object. Also, directly mutating the properties passed to the
    ReactElement object will not have any effect, as React does not watch the properties.


    In the beginning, it may feel as if React and real DOM elements are created in
    different ways and their interface is the same, but this is not true.

    Here are a few differences:


    +   - Instead of the class attribute, you need to use className

    - Instead of the for attribute, you need to use the htmlFor attribute

    - The style attribute cannot be a string; it has to be an object


    There are many more. We will explore them as we go deeper.'
