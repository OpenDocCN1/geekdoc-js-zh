  md: '# Chapter 3


    Here is how the code works:


    +   - First we created a prompt box to take the ID as an input so that every peer
    can decide their own ID.

    - Then we created an instance of Peer with ID and PeerServer cloud key. Here we
    didn''t provide signaling and ICE server''s URLs, therefore, PeerJS will use PeerServer
    cloud as the signaling server and Google''s public STUN server. It will not use
    any TURN server. As soon as a Peer is instance is created, the instance connects
    to the signaling server and registers the given ID.

    - Then we attached five event handlers to the peer object.

    - The open event is triggered when the connection to PeerServer was successful.

    - The error event is triggered for errors on the peer object.

    - The disconnected event is triggered when the connection to the signaling server
    is disconnected. The connection with the signaling server may get disconnected
    by network problem or if you are disconnected, you manually call the `peer.disconnect()`
    method. Once you are disconnected, your ID can be taken by someone else. You can
    try to reconnect to the same ID using `peer.reconnect()` method. You can check
    whether peer is connected to the signaling server using `peer.disconnect` property.

    - The close event is triggered when peer is destroyed, that is, it cannot be used
    anymore, all MediaConnections and DataConnections are killed, connection with
    the signaling server is killed, ID is taken away, and so on. You may manually
    destroy a peer when you don''t need it anymore. You can destroy a peer using the
    `peer.destroy()` method.

    - The connection event is triggered when some other peer establishes DataConnection
    with you. As I said earlier, DataConnection is established without further permission,
    but you can call it as soon as it''s established by you. We let the user decide
    if they want to continue or close the event handler attached to the event receives
    an instance of DataConnection via the parameter that represents the currently
    established connection.

    - The call event is triggered when some other peer establishes MediaConnection
    with you. Here, also let the user decide if they want to continue or close MediaConnection
    established by another peer. The event handler attached to the event receives
    an instance of MediaConnection via the parameter that represents the currently
    established MediaConnection.


    [ 71 ]'
