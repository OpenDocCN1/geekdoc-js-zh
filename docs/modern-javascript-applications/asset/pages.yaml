  md: "Here, we are attaching an onChanged callback to the constant property, which\
    \ we created previously. After initialization, the property is ended; therefore,\
    \ the onEnd callback is invoked. We can register multiple subscribers as well.\n\
    \nActually, to end EventStream or property, Bacon internally pushes an instance\
    \ of the Bacon.End constructor. So, we can also use the Bacon.End constructor\
    \ to end an EventStream or property.\n\nLet's look at an example of how to use\
    \ Bacon.End. Place this code in the index.js file:\n\n```\nvar custom_stream =\
    \ Bacon.fromBinder(function(sink) {\n  sink(10);\n  sink(20);\n  sink(new End());\
    \ // event stream ends here\n  sink(30); //this will not be pushed\n});\n```\n\
    \n```\ncustom_stream.onValue(function(event) {\n  console.log(event);\n});\n```\n\
    \nThe output of the code is:\n\n10\n20\n\nA Bacon.End instance doesn't pass through\
    \ helper functions.\n\n# Unplugging subscribers\n\nWe saw how to subscribe to\
    \ an EventStream and property using onValue, onError, and onEnd. We can also unsubscribe\
    \ the subscribers if we don't need them anymore.\n\nThese functions return a function\
    \ for unsubscribing. To unsubscribe, we need to call the function returned by\
    \ the subscriber function.\n\n# Combining and zipping\n\nBacon provides certain\
    \ methods to combine and zip properties and EventStreams. There is a significant\
