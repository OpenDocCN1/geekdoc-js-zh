  md: "# Functional Reactive Programming\n\nLet's create a property to hold the total\
    \ number of times a button is clicked. Here is the code to do this; place it in\
    \ the index.js file:\n\n```\nvar button_click_counter = myButton_click_stream.scan(0,\n\
    function(value, e) {\n  return ++value;\n})\n\nbutton_click_counter.onValue(function(value)\
    \ {\n  console.log(\"Button is clicked \" + value + \" number of times\");\n})\n\
    ```\n\nHere, we created a property using the scan method and initialized it to\
    \ 0. The second argument is a callback, which is invoked to update the property\
    \ value whenever an event happens in the EventStream to which the property is\
    \ attached. This callback should return the new property value. The callback has\
    \ two parameters, that is, the current value of the property and the event.\n\n\
    The onView method of a property takes a callback that is executed every time the\
    \ property value changes. We can call the onView method multiple times to register\
    \ multiple callbacks.\n\nWhen we register a subscriber for a property, the subscriber\
    \ is executed with the current value as soon as it's registered, but not for the\
    \ values that occurred before it had been registered. If the property has not\
    \ yet been assigned to anything, then the callback is not executed.\n\nHere, whenever\
    \ the property value changes, we log a statement informing us about the total\
    \ number of times the button was clicked.\n\nA property can also be created from\
    \ another property. This is useful when a property's value depends on another\
    \ property. Let's create a property from the previous property, which holds the\
    \ time when the property was last clicked and the button click count that time.\
    \ Here is the code to do this; place it in the index.js file:\n\n```\nvar button_click_time\
    \ = button_click_counter.scan({}, function(value,\ncount) {\n  return {time: Date.now(),\
    \ clicks: count};\n})\n\nbutton_click_time.onValue(function(value) {\n  console.log(value);\n\
    })\n```"
