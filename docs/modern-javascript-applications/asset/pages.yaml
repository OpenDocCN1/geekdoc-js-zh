  md: 'Chapter 7


    The onValue method is used to add subscribers to an EventStream. The onValue method
    of an EventStream takes a callback, which is executed every time a new event is
    added to the EventStream. The callback has a single parameter, which represents
    the current event that has been added to the EventStream. In this case, it''s
    of the event interface. We can call the onValue method multiple times to add multiple
    callbacks.


    A subscriber can be used to update the UI, perform logging, and so on. The logic
    code for handling the event should be written using the helper functions and not
    inside the subscriber. This is how reactive code is supposed to be written.


    The subscriber callback will not be invoked for events that occurred before the
    subscriber was registered.


    Similarly, there are lots of APIs provided by Bacon.js to create EventStreams.
    Here are a few of them:


    +   - Bacon.fromPromise: This is used to create an EventStream from a promise
    object.

    - Bacon.fromEvent: This is used to create an EventStream from events of an EventTarget
    or Node.js EventEmitter object.

    - Bacon.fromCallback: This is used to create an EventStream from a function that
    accepts a callback.

    - Bacon.NodeCallback: This is the same as Bacon.fromCallback, but it requires
    the callback to be called in Node.js convention.

    - Bacon.fromBinder: If none of the previous APIs are fitting well, then you can
    use this one.


    # Creating properties


    A property is created from an EventStream, that is a stream whose the value of
    the property depends on. Whenever an event occurs in the EventStream, a callback
    is executed to update the property value.


    You can create a property for an EventStream using either the toProperty or scan
    methods. The scan method is used instead of toProperty when we want to give an
    initial value as well as an accumulator function to the property. You may or may
    not provide an initial value when creating a property using toProperty().


    Calling scan or toProperty multiple times creates multiple properties.


    [ 139 ]'
  merge: -1
