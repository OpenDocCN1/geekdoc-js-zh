    # Restricting connections based on origin


    By default, a Socket.IO server lets Socket.IO clients from any origin establish
    a Socket.IO connection with it. Socket.IO provides a way to restrict connections
    to a particular origin.


    To restrict connections to a particular origin or set of origins, we can use the
    origins method of the Server instance.


    Place this code in the socket.js file to only allow Socket.IO clients running
    on the localhost domain and port number 8080 to connect to the Socket.IO server:


    ```

    io.origins("localhost:8080");

    ```


    We cannot simply pass any origin to the origins method. Here are examples of some
    valid origins:


    +   * testsite.com:80

    * http://testsite.com:80

    * http://*:8080 (* is a wildcard)

    * *:8080

    * testsite.com:* http://someotherdomain.com:8080 (multiple origins separated by
    spaces)

    * testsite.com:*:/somepath (Socket.IO will ignore /somepath)

    * *:*


    In the previous list, every origin has a port number associated with it because
    it is compulsory to provide a port number or * in place of the port number, indicating
    any port.


    Here are some examples of invalid origins:


    +   * testsite.com

    * http://testsite.com

    * http://testsite.com/somepath'
