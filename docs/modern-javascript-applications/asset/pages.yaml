  md: '# Scaling Node servers


    There is a database called Node Security Project that has a list of the most important
    vulnerable packages. You can use command-line tools such as nsp (https://www.npmjs.com/package/nsp)
    and requireSafe (https://www.npmjs.com/package/requisafe) to check the vulnerable
    dependencies of your application.


    You should always keep an eye on the new version releases of the packages that
    your application is dependent on and update it, as a new release often fixes issues
    related to security.


    If your application has lots of users accessing the system simultaneously, obviously
    a single server cannot handle all the traffic. It will slow down and crash. Therefore,
    we need to deploy the application on multiple servers and distribute the traffic
    between them.


    To distribute traffic between servers, we need to use something called a load
    balancer. A load balancer is a server that sits in front of the application servers.
    The client communicates with the load balancer instead of the application servers,
    and instead of handling the request, the load balancer forwards it to an application
    server; when the application server sends the response, it sends the same response
    to the client.


    As a load balancer doesn''t actually process the request, it can handle many more
    requests than an application server. Obviously, a load balancer cannot handle
    unlimited requests, so we can use multiple load balancers. When we use multiple
    load balancers, the traffic between them is distributed by using the round-robin
    DNS technique. In round-robin DNS, the IP address of the domain pointing to the
    load balancer changes according to an appropriate statistical model.


    Amazon Web Services (AWS) provides a load balancer Amazon ELB, which can be used
    to distribute traffic between Amazon EC2 servers, that is, application servers.
    Obviously, it is difficult to predict the total number of EC2 instances you would
    need to scale your application; therefore, AWS also provides something called
    auto scaling, which can add/remove EC2 instances as needed. Therefore, to host
    a large-scale application, Amazon is the best choice. It also provides lots of
    other cloud services to scale and deploy your application.


    In case you don''t want to worry about scaling, deploying, and managing your servers,
    then you can use cloud services such as Heroku, which makes it much easier to
    achieve all this, and you just need to worry about the application code–that’s
    it.'
  merge: -1
