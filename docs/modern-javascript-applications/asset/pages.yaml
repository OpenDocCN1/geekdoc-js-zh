  md: '# Getting started with FRP


    FRP is simply reactive programming using functional programming style.


    EventStreams and properties (don''t get these confused with object properties)
    are the building blocks of FRP. Let''s look at an overview of what both these
    terms mean.


    # EventStreams


    An EventStream represents a stream of events. Events in an EventStream may happen
    at any time and need not occur synchronously.


    Let''s understand EventStreams by comparing them to events in an event-driven
    pattern. Just like we subscribe to events in an event-driven pattern, we subscribe
    to EventStreams in FRP. Unlike in event-driven programming, the power of EventStreams
    is that they can be merged, concatenated, combined, zipped, filtered, or transformed
    in any number of ways before you handle and act on the events.


    In functional programming, data is immutable, so merging, concatenating, combining,
    zipping, filtering, or transforming an EventStream creates a new EventStream instead
    of modifying the existing one.


    Here is a diagram that shows how an EventStream representing the click event of
    a UI element would look:


    ![](img/a330fba1360168a944317211e66958a7_154_0.png)


    This EventStream can be merged with any other stream. Here is a diagram that shows
    how it looks when two EventStreams are merged:'
  merge: -1
  pgno: 154
- img_proc: true
  md: '![](img/a330fba1360168a944317211e66958a7_155_0.png)


    Merging can be useful when we want to apply the same action when an event occurs
    to two different EventStreams. Instead of subscribing and attaching a callback
    to two different EventStreams, we can now subscribe to a single EventStream, eliminating
    duplicate code and making it easy to update code. Merging can be useful in various
    other cases as well.


    # # Properties


    A property represents a value that changes over time. Properties can be used as
    an alternative to JavaScript variables whose values change in response to asynchronous
    activities and data updates. For example, you can use properties to represent
    the total number of times a button was clicked, the total number of logged-in
    users, and so on.


    > > Properties are also called signals or behaviors.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Functional Reactive Programming


    The advantage of using properties instead of JavaScript variables is that you
    can subscribe to properties, that is, whenever the value of a property changes,
    a callback is fired to update the parts of the system that depend on it. This
    prevents code duplication and has many other benefits.


    > You can create a property from another property as well as merge, combine, zip,
    sample, filter, or transform properties.


    We''ve just looked at the basics of FRP. Creating EventStreams and properties,
    their methods, and other things to work with them differ depending on the library
    we use to write functional reactive code. Now, let''s explore how to write functional
    reactive code using Bacon.js library.


    # FRP using Bacon.js


    Bacon.js is a JavaScript library that helps us write reactive code in JavaScript.
    It can be used for both frontend and backend JavaScript. The official website
    of Bacon.js library is https://baconjs.github.io/.


    Let''s learn how to download and install Bacon.js for use with frontend and backend
    Bacon.js.


    # Setting up the project


    Let''s learn JavaScript. On the frontend, Bacon.js depends on jQuery.


    Create a directory named baconjs-example. Inside it, create files called package.
    jso and app.js and a directory called public. Inside the public directory, create
    directories html and js. Inside the html directory, create a file called index.
    html. Finally, the js directory, create a file called index. js.


    Download the frontend Bacon.js library from http://cdn.cloudflare.com/ajax/libs/bacon.js/0.7.73/Bacon.js
    and jQuery from https://code.jquery.com/jquery-2.2.0.min.js, and place them in
    the js directory.


    At the time of writing this code, 0.7.73 was the latest version of the frontend
    Bacon.js library, and 2.2.0 was the latest version of jQuery.'
