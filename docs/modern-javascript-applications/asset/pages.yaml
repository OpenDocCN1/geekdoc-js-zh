  md: "# Retrying a function call\n\nSometimes, we might want to retry an operation\
    \ if it fails. For example, if we fail to retrieve a web page using AJAX due to\
    \ a server timeout, then we might want to try retrieving it again after some time.\n\
    \nBacon provides the Bacon.retry function, using which we can make a function\
    \ call again and again as long as we want.\n\nBacon.retry returns an EventStream,\
    \ and it takes an object with four properties as follows:\n\n+   - source: This\
    \ is a function that is to be reinoked. This function must return a property or\
    \ EventStream\n- retries: This is a number representing the total number of times\
    \ to retry the source function for addition to the initial attempt. When a Bacon.Error\
    \ instance is pushed to the property or stream returned by the source function,\
    \ then an attempt to retry is made.\n- isRetryable: This is an optional property.\
    \ It's assigned to a function that returns the function. The function can return\
    \ either true or false. When something is pushed into the property or EventStream\
    \ then isRetryable is invoked to find whether an attempt to retry should be made.\n\
    - delay: This is an optional property. It's assigned to a function that returns\
    \ the time in milliseconds before waiting for retrying. The default value is 0.\n\
    \nThe EventStream returned by Bacon.retry has wait the event or value that was\
    \ present in the last EventStream or property returned by the last call to the\
    \ source function.\n\nLet's see the Bacon.retry function in action. Find this\
    \ code in the index.js file:\n\n```\nvar response = urlMap(function(value) {\n\
    \  return Bacon.fromPromise($.ajax({url:value}));\n}).toMap();\n```\n\nReplace\
    \ it with this:\n\n```\nvar response = urlMap(function(value) {\n  return Bacon.retry({\n\
    \    source: function () {\n      return Bacon.fromPromise($.ajax({url:value}));\n\
    \    },\n    retries: 5,\n    isRetryable: function (error) {\n      return error.status\
    \ !== 404;\n    },\n    delay: function(context) {\n      return 2000;\n    }\n\
    \  });}).toMap();\n```"
