    # New Features of Angular 2


    Angular 1 was based on the MVC architecture whereas Angular 2 is based on a components-and-services
    architecture. Angular 1 and Angular 2 are completely different in terms of architecture
    and APIs, so previous knowledge of Angular 1 is unlikely to help you in learning
    Angular 2. In this chapter, we will learn Angular 2 without comparing it with
    Angular 1 as doing that will create confusion and is unnecessary. Even if you
    don''t have knowledge about Angular 1, you can continue with this chapter.


    We will cover the following topics:


    +   - Web components

    - The Angular 2 architecture

    - Template language

    - Component inputs and outputs

    - The component life cycle

    - Events

    - Forms

    - Services


    And much more...


    # # The Angular 2 architecture


    Angular 2 is a framework for building the client side of web applications, based
    on a services-and-components architecture.'
