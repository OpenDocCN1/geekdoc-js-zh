  md: '# Breaking into Microservices Architecture


    Remove the previous plugin attachment code from the main.js file and add the following
    code to register the service:


    ```

    seneca.client({port: "9090", role: "accountManagement"});

    ```


    Here we are registering the service by providing the port number and pin. Both
    of them are optional. In case we don''t use any port number, then it defaults
    to 10101. In case the service is on a different server, then you should use the
    host property to provide the IP address.


    The pin attached to the client method is used to tell the Seneca instance about
    what actions are executed by the service. It is completely optional. Seneca won''t
    send requests to a service that doesn''t match the pin pattern.


    You can add as many services as you want by calling the client method multiple
    times.


    When you call the act to invoke an action, the Seneca instance first looks for
    the action locally if it''s not found locally, then it checks for the services
    that have a pin to see if it any. If a pin matches, then it sends the request
    to this particular service. Finally, if any of the pin doesn''t match, it sends
    the requests by one to all other services that don''t have a pin it gets a valid
    response from one of them.


    You can manually call an action of a service by sending the GET request to these
    types of URL:


    ```

    http://localhost:9090/act?role=accountManagement&cmd=login&username=narayan&password=mypass

    ```


    You can also call a service by using the POST request. Here is how to do it using
    CURL:


    ```

    curl -d ''{"role":"accountManagement","cmd":"Login","username":"narayan","password":"mypass"}''
    -v http://localhost:9090/act

    ```


    # Storing data


    Seneca provides a built-in mechanism to store data. Seneca provides some built-in
    actions that allow us to store data. The built-in actions use mem-store to store
    data by default. mem-store is an asynchronous in-memory storage system.


    You can create your application using the default storing mechanism. In case you
    want to change the underlying store system, you just need to install plugin for
    this particular storage system that will overwrite the built-in storage actions,
    therefore you will not have to refactor your code.'
