  md: '# New Features of the previous code works


    Here is how the previous code works:


    +   - To create a card, we need to use the .card-text class.


    +   - By default, card width is 100% of its parent container. Therefore, here
    we are using a grid system to control width.


    +   - In the first card, we have a header, which is created using the .card-header
    class. Then, we have a card block, inside which we have a title and subtitle.
    A card block is part of a card that has padding. Whenever you need padding in
    any part of the card, simply use the .card-block class. A card title is created
    using .card-title, and a subtitle is created using the .card-subtitle class. The
    .card-title and .card-subtitle classes give appropriate margins. Then, we have
    a responsive image. After that, we have using the .card-text class that makes
    the last child doesn''t have any margin. Then we have two links with the image.
    the .card-link adds a left margin to all .card-link classes from the second one.
    And finally, we have a card footer, which is created using .card-footer.


    +   - In the second card, we have a responsive image and a block quote. We have
    added the .card-img-top class to the image, which adds a right and top-left border
    radius to the image. We also added .card-blockquote to the block quote to remove
    the margin, padding, and left border from the block quote.


    +   - In the third card, we simply have some text and a responsive image. We have
    added the .card-img-bottom class to the responsive image, which adds a bottom-right
    and bottom-left border radius to the image.


    +   - The fourth card we created for demonstrating card overlays. First, we added
    a responsive image with the .card-img class, which adds a border radius to all
    the corners. And then, we created an overlay using the .card-img-overlay class,
    which simply makes the position of the element absolute with some padding and
    no top, right, left, and bottom, but putting the content on top of the card.


    +   - By default, cards use dark theme and add a light background. .card-inverse
    for white text and specify the background-color and border values to go with it.
    The fifth card is a demonstration of .card-inverse. Bootstrap 4 provides a few
    classes that add a background color and border color to cards. These classes are
    demonstrated in the five cards.'
  merge: -1
  pgno: 208
