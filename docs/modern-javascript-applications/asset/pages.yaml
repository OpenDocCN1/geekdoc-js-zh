    # Creating services


    A service is a encara instance that exposes some actions via network. Let''s create
    a service that exposes the login and register actions.


    Create an account-service.js file in the encara-example directory that will act
    as the service. Then place the following code in it to create a service that exposes
    the login and register actions:


    ```

    var seneca = require("seneca");

    ```


    ```

    seneca.use("./account.js", {message: "Plugin Added"});

    ```


    ```

    seneca.listen([port: "9090", pin: {role: "accountManagement"}});

    ```


    Here, we created a encara instance. Then we added actions via a plugin. You can
    also manually add actions using the add method of the encara object. Finally,
    we exposed the actions via an HTTP protocol. Seneca also supports other protocols,
    but we will stick to HTTP, as it is the most commonly used one.


    seneca.listen([port: "9090", pin: which are optional. We also provided the port
    number and pin, The default port is 10101, and by default, there is no pin if
    provided.


    You might be wondering what is a pin and what is it used for? Well, you may not
    always want to expose all the actions of the service via a network. In that case
    you can provide a pattern to the pin property and the server will handle these
    requests that match the pin pattern.


    Now, for other services or monolithic cores to be able to call the actions of
    this service, they need to register this service.'
