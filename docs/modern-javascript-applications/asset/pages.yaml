  md: '# Cross-site request forgery


    Cross-site request forgery (CSRF) is a type of attack in which requests from a
    user are sent to servers without the user knowing about it.


    For example, if an attacker is able to find a reproducible link that executes
    a specific action on the target page where the victim is logged in, he is able
    to embed such a link on a page he controls and trick the victim into opening it.
    The attack-carrying link may be placed in a location that is likely to be visible
    while logged in to the target site sent in an HTML e-mail body or attachment.


    There are various ways to prevent CSRF attacks. Most CSRF prevention techniques
    work by embedding additional authentication data into requests, which allows the
    web application to detect requests from unauthorized locations.


    There is a library named csrf (https://www.npmjs.com/package/csrf) for Node.js
    lets you prevent CSRF attacks. It provides middleware to protect Express web servers
    from CSRF attacks.


    # Cross-site scripting


    We saw earlier that the XSS vulnerability. We basically saw how a reflected XSS
    attack is. There is another type of XSS attack called stored XSS.


    Stored XSS occurs when the application stores user input that is not correctly
    filtered. For example, chatting, if a message is not sanitized, then both users
    can run scripts on each other''s browsers by sending JS code within <script> tags
    as messages.


    To prevent both types of XSS attack, we should always filter/sanitize user input.


    # Session fixation


    Session fixation is an attack that permits an attacker to hijack a valid user
    session. There are several techniques to prevent session fixation:


    +   - Set session timeouts

    - Regenerate session tokens frequently

    - When logged out, expire the session token

    - Store the user agent and IP address of the user when creating a session and
    check whether the value matches during the following HTTP requests.'
