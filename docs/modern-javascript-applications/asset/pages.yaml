  md: 'Here, we''ve created two different components. Inside the Card component, we
    are using the ResponsiveImage component to display a responsive image in it.


    # Component ownership


    When components are used inside other components'' render methods, they are said
    to be an owner-owner relationship and not a parent-child relationship. Component
    X is said to be the owner of component Y if component X created an instance of
    component Y in its render method.


    > Note that component X is not the parent; rather, it''s called the owner of component
    Y.


    For example, in the previous code, the Card component is the owner of the ResponsiveImage
    component and <div> is the parent of ResponsiveImage.


    If we place a component instance inside the opening and closing tags of a component,
    then they are to be in a parent-child relationship. The parent can access its
    children by using the this.props.children object. React also provides utility
    functions to make working with children easier. You can find the utilities at
    https://facebook.github.io/react/docs/top-level-api.html#react.children.


    # Reconciliation


    Reconciliation is the process by which React updates the DOM whenever the state
    changes. React doesn''t re-render everything from scratch when the state changes;
    instead, it first finds whether a mutation is required by comparing the new virtual
    DOM with the old one, and if there is a difference, it compares the new virtual
    DOM with the real DOM and makes the necessary mutations.


    > Note that reconciliation doesn''t happen only when you change the component
    state; it also happens when you call ReactDOM.render on the same container element
    again.'
  merge: -1
  pgno: 235
