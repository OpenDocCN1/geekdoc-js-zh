    any unit. In such a case, the unit is pixels.


    # Isomorphic UI development


    Isomorphic development is where we can use the same code in both the frontend
    and backend.


    Till now, we''ve seen how to use React in the frontend to build reactive UI, but
    the same React code can also be used in the backend. When used in the backend,
    React outputs HTML and doesn''t provide any kind of UI performance advantage or
    reactivity.


    The isomorphic nature of React is one of the things that make it so popular and
    powerful. It has many things easier. For example, it makes easier to prevent FOUC
    by letting us pre-render the page in the backend, and then in the frontend: the
    same components will just add event bindings.


    React code not only executes in Node.js but also can be executed in PHP, Ruby,
    NET, and other major backend languages.


    Due to the fact that React can be used in both the frontend and backend, the React
    developer team decided to split React into two files: React core and another part
    that is specific to the executing environment. That''s why we included React in
    our HTML file earlier, we created two files. The React core contains React.createElement,
    and so on whereas the React DOM contains ReactDOM.render and so on.


    Let''s look at an example of how to use React in Node.js by creating and displaying
    the previous hello world component in Node.js. Create a directory named React-Server-Demo.
    Inside it, create files named app.js and package.json.'
