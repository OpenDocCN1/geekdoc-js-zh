  md: '# Establishing peer-to-peer connection


    For a peer-to-peer connection to be established, a signaling server is needed.
    Through the signaling server, the peers exchange data required to establish a
    peer-to-peer connection. Actual data transfer takes place directly between peer-to-peer.
    The signaling server is just used to exchange pre-requirements to establish a
    peer-to-peer connection. Both the peers can disconnect from the server once the
    peer-to-peer connection has been established. The signaling server doesn''t need
    to be a highly configured server as the actual data is not transferred through
    it. Data transfer for a single peer-to-peer connection will be in some KB, so
    a decent server can be used for signaling.


    A signaling server usually uses a signaling protocol, but it is also okay if it''s
    an HTTP server as long as it can pass messages between two peers. WebRTC forces
    us to use any particular signaling protocol.


    For example, say there are two users, Alice and Bob, on two different browsers.
    If Alice wants to establish a peer-to-peer connection with Bob for chatting, then
    this is how a peer-to-peer connection would be established between them:


    +   1. They will connect to a signaling server.

    2. Alice will then send a request to Bob via the signaling server, requesting
    to chat.

    3. The signaling server can optionally check whether Alice is allowed to chat
    with Bob, and also if Alice and Bob are logged in. If yes, then the signaling
    server passes the message to Bob.

    4. Bob receives the request and sends a message to Alice via the signaling server,
    confirming to establish a peer-to-peer connection.

    5. Now both of them need to exchange messages related to session control, network
    configuration, and media capabilities. All these messages are exchanged between
    the RTCPeerConnection. So, they both need to create an RTCPeerConnection, initiate
    it, and attach an event handler to RTCPeerConnection that will be triggered by
    RTCPeerConnection when it wants to send a message via the signaling server. RTCPeerConnection
    passes the message to the event handler in the Session Description Protocol (SDP)
    format, and the messages for the RTCPeerConnection received from the signaling
    server must be fed to RTCPeerConnection in the SDP format, that is, RTCPeerConnection
    only understands the SDP format. You need to use your own programming logic to
    split custom messages and messages for RTCPeerConnection.'
  merge: -1
  pgno: 84
