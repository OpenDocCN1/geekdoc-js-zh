  md: "# Building an Advanced Profile Search Widget\n\n> What is the sampledBy method?\n\
    TheampledBy method is used for sampling a property based on a property or EventStream.\
    \ It returns a property or EventStream, respectively, by sampling the property\
    \ value at each event from the given property or EventStream. The returned property\
    \ or EventStream will contain the property value at each push in the source property\
    \ or EventStream.\n\nLet's look at an example of how map implements lazy evaluation.\
    \ Place this code in the index.js file:\n\n```\nvar myBus_1 = Bacon.Bus();\nvar\
    \ myBus_2 = Bacon.Bus();\n\nvarProperty_1 = myBus_1.map(function(event) {\n  console.log(\"\
    Executing 1\");\n  return event;\n}).toProperty();\n```\n\n```\nvar myStream_1\
    \ = myProperty_1.sampledBy(myBus_2);\n```\n\n```\nmyStream_1.onValue(function\
    \ (event) {\n  console.log(\"Logged\", event);\n})\n```\n\n```\nmyBus_1.push(1);\n\
    ```\n\nHere is what we are doing in the previous code:\n\n+   1. We create two\
    \ buses.\n2. We, then map in the first bus using the map method, and it is transformed\
    \ into a property.\n3. We create an EventStream by sampling the property value\
    \ at each event in the second bus.\n4. We add a subscriber to the EventStream.\n\
    5. Finally, we push a value to the first bus.\n\nThe previous code looks like\
    \ it should log the following output:\n\n```\nExecuting 1\nLogged 1\n```"
  merge: -1
