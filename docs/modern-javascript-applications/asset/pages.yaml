  md: '# # 14

    Securing and Scaling Node.js Applications


    It''s very important to scale and secure your applications. Scaling and securing
    are not one-time tasks. You need to keep making changes to your code as you add
    new features to increase application security, and as your application traffic
    and data increases, you need to scale your servers. In this chapter, you will
    learn how to make Node.js applications more secure and how to scale Node.js applications.
    I will be assuming that you are using Express for creating your web server as
    it is the most common.


    In this chapter, we will cover:


    +   - Application vulnerabilities

    - Non-vulnerability attacks

    - Various third-party services to protect your application

    - Checking security issues in third-party packages

    - Techniques of distributing traffic


    # ## Common vulnerabilities in applications


    According to Wikipedia, a **vulnerability** is a weakness in the application that
    allows an attacker to reduce a system''s information assurance. Applications expose
    different types of vulnerability.


    Let''s look at some important vulnerabilities and how to prevent them.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Helmet


    **Helmet** is a Node.js library that helps you prevent various attacks by setting
    security-related HTTP headers.


    Here are the various headers added by Helmet:


    +   * **Strict-Transport-Policy**: This header is used to enforce secure (HTTP
    over SSL/TLS) connections to the server. Helmet prevents man-in-the-middle attacks.
    In a man-in-the-middle attack, an attacker secretly alters the communication between
    the client and server. This is done to steal data, add to web pages, and so on.

    * **X-Frame-Options**: This header provides clickjacking protection. Clicking
    uses multiple transparent or opaque layers to trick a user into clicking a button
    or on another page when they intend to click on the top-level page. Thus, the
    attacker ''hijacks'' clicks their page and routing them to some other page, most
    likely under another application, domain, or both. This header prevents the application
    from being viewed inside an iframe, therefore providing clickjacking protection.

    * **X-XSS-Protection**: This header prevents reflective XSS attacks. Reflected
    XSS attacks are a type of Cross-Site Scripting (XSS) attacks are a type of injection
    in which malicious scripts are injected into benign and trusted sites. XSS attacks
    occur when an attacker uses a web application to send malicious code, generally
    in the form of a browser-side script, to a different end user. Reflected XSS is
    the most frequent type of XSS attack. It is also non-persistent XSS attacks since
    the attack payload is delivered and executed via a single request and response.
    Reflected XSS occurs when the attacker executes JavaScript code into the HTML
    response of the URL.

    * **Content-Type-Options**: Browsers can override Content-Type headers and process
    data using an implicit content type. While this can be convenient in some scenarios,
    it can also lead to some kinds of attack, such as a MIME confusion attack, authorized
    linking, and so on. Returning X-Content-Type-Options allows browsers to use the
    provided Content-Type header and not interpret the content as a different content
    type.

    * **Content-Security-Policy**: This header lets us provide a list of trusted sources
    to the browser, from which content such as JavaScript, CSS, HTML frames, images,
    and embeddable objects (Java applets, ActiveX, audio, and video) can be loaded
    onto a page. This helps prevent XSS attacks.


    To learn more about Helmet, visit https://www.npmjs.com/package/helmet'
