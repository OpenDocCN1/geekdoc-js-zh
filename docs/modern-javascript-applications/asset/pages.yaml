    \nIn programming, lazy evaluation is a strategy that delays the evaluation of\
    \ values until they are needed. There are two means by which lazy evaluation is\
    \ implemented by Bacon.\n\n# # Type 1\n\nA stream or property will not be attached\
    \ to its data source until it has subscribers. Let's look at an example to understand\
    \ . This place code in the index.js file:\n\n```\nvar myButton_click_streaml =\n\
    $(\"#myButton\").asEventStream(\"click\").map(function(event){\n  console.log(event);\n\
