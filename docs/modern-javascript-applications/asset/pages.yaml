  md: '# 13

    Building a Search Engine Template Using AngularJS 2


    To build single page applications (SPAs) using Angular 2, we need to learn how
    to implement routing in Angular 2. Angular 2 comes with built-in routing APIs,
    which are very powerful, feature rich, and easy to use. In this chapter, we will
    build a basic search engine template to demonstrate routing in Angular 2. We won''t
    be building a complete search engine engine because that''s out of the scope of
    this book. We will use Bootstrap 4 to design the search engine template. At the
    end of this chapter, you will be comfortable with building SPAs using Angular
    2.


    In this chapter, we will cover the following topics:


    +   * Routing in Angular 2

    * The built-in HTTP client provided by Angular 2

    * Generating random textual data using the Chance.js library


