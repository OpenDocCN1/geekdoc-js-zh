  md: '# Breaking into Microservices Architecture


    If you are switching from a monolithic architecture to microservices architecture,
    then you do not have to rewrite the complete application, instead you can only
    convert the components that are causing issues to services by doing some code
    refactoring. This sort of server-side applications where the main application
    logic is monolithic but some specific functionality is exposed via services is
    called microservices architecture with monolithic core. As issues increase further,
    you can start converting more components of the monolithic core to services.


    ![](img/a330fba1360168a944317211e66958a7_30_0.png)


    If you are building a server-side application using monolithic architecture and
    you feel that you are likely to face any of the monolithic issues that we discussed
    earlier, then you should immediately switch to microservices architecture or microservices
    architecture with monolithic core, depending on what suits you best.


    # Data management


    In microservices architecture, each service can have its own database to store
    data and can also use a centralized database.'
