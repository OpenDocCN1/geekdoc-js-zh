  md: 'Here we using a middleware provided by the PeerServer library to integrate
    PeerServer with Express. Here, PeerServer is made available on the /signaling
    path. You can use any path you want.


    The PeerServer library doesn''t provide any way to check whether the peer is allowed
    to connect to PeerServer or not, so we use our own technique, that is, we are
    attaching another middleware on top of the ExpressPeerServer middleware, which
    performs this check. Although this technique may seem fine, if our custom middleware
    stops the request from proceeding further, then PeerServer performs the connection
    and disconnect events and destroys the Peer instance on the frontend.


    You can learn more about PeerServer at https://www.npmjs.com/package/peer.


    # Creating chatroulette


    The chatroulette that we build is only for people residing in India, that is,
    a peer cannot connect to the PeerServer if the IP address of the peer does not
    resolve to India. We added this filter to make the website a little more complex
    to code so that you can learn how to check whether a user is allowed to connect
    to PeerServer or not.


    We will use a single server that will serve webpages and also act as a PeerServer,
    that is, we will integrate PeerServer with the Express server.


    We won''t get into designing the frontend of our chatroulette. We will only be
    concentrating on building the architecture and functionalities.


    The exercise files for this chapter contain two directories: Chatroulette and
    Custom-PeerServer. In the Chatroulette directory, there are two directories: Initial
    and Final. In the Final directory, you will find the complete chatroulette source
    code. In the Initial directory, you will only find the HTML code for our chatroulette.
    The Initial directory is to help you quickly get started with building the chatroulette.


    You will place the code related to the frontend functionality of the site in the
    Initial/public/js/main.js file and you will place the code related to the server
    side functionality in the Initial/app.js file.'
