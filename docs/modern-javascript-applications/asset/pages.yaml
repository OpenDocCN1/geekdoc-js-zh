    # # Outline buttons


    Bootstrap 4 has added new button styles with outline buttons. Outline buttons
    appear hollow or are simply inverses of regular buttons.


    Here is example code to demonstrate outline buttons. Place this code at the end
    of the container element of index.html:


    ```

    <hr>

    <button type="button" class="btn btn-primary outline">Primary</button>

    <button type="button" class="btn btn-secondary outline">Secondary</button>

    <button type="button" class="btn btn-success outline">Success</button>

    <button type="button" class="btn btn-warning outline">Warning</button>

    <button type="button" class="btn btn-danger outline">Danger</button>

    <hr>

    ```


    Here is how the code looks:


    | Primary | Secondary | Success | Warning | Danger |


    # # Moving from Less to Sass


    The Bootstrap 4 source is written in Sass instead of Less. Less was used until
    Bootstrap 3. This is great because Sass tends to be more favorable to frontend
    developers. It also compiles faster. Also, it doesn''t seem as if there are currently
    plans for a Less version. You can find the source files at https://github.com/twbs/bootstrap/tree/v4-dev.'
