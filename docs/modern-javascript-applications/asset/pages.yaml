  md: '# 11

    Building an RSS Reader Using React and Flux


    React is not enough to build a complete application, as it''s just the view layer.
    We need an architecture for holding the application logic and data, and this is
    where Flux comes in. Obviously, React can be used with any other architecture,
    but Flux is what is most used with React, as Flux is based on unidirectional data
    flow, like React. In this chapter, we will build a single-page RSS reader using
    React and Flux.


    We will cover the following topics:


    +   - Flux architecture in depth

    - Routing using the React Router library

    - Using Flux.js to create a dispatcher

    - Using MicroEvent.js to emit events

    - Integrating Flux and routing


    # Understanding Flux


    Flux is an application architecture and not a framework. You can think of it as
    an alternative to MVC. It was primarily developed to be used with React as both
    of them are based on unidirectional data flow. The Flux architecture enforces
    unidirectional data flow.'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Building an RSS Reader Using React and Flux


    Here is a diagram that shows all the parts of the Flux architecture and how data
    flows in it:


    ![](img/a330fba1360168a944317211e66958a7_246_0.png)


    Here is how each works:


    +   * **Actions**: An action is an object that describes what we want to do and
    the data that we need to do. In Flux, all events and data from all sources are
    converted to actions. Even UI events are converted to actions.


    +   * **Dispatcher**: The dispatcher is a special type of event system. It is
    used to broadcast actions to registered callbacks. What the dispatcher does is
    not the same as a pub/sub system, as callbacks are not subscribed to particular.
    Instead, every action is dispatched to every registered callback. An application
    should contain only one dispatcher.


    +   * **Action creators**: Action creators are methods that dispatch actions to
    the dispatcher.


    +   * **Stores**: Stores are objects that store the application data and logic.
    Stores react to actions. Callbacks ping the store to take appropriate action whenever
    an action that the store depends on is dispatched by the dispatcher.


    +   * **React views**: React views are the components that can retrieve data from
    stores and display as well as listen to events emitted from stores whenever there
    is a change in the data stored by them. Note that the events emitted by stores
    are not converted into actions.


    So, in Flux, all the events and data from different sources are dispatched to
    the dispatcher as actions, then the store update themselves whenever the dispatcher
    dispatches actions, and finally, views get updated whenever stores update.


    [ 226 ]'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Chapter 11


    Here is another diagram, which provides a much higher-level abstraction of how

    Flux works:


    ![](img/a330fba1360168a944317211e66958a7_247_0.png)


    Here you can see that the data flows in a single direction, that is, data and
    events first

    go to the Dispatcher, then to the Store, and finally to the View. So, we can say
    that

    dispatcher, store, and view are the three major parts of the Flux architecture.


    Just as there are many MVC frameworks, such as Angular, Ember, and Backbone,

    there are many Flux frameworks, such as Flexible, Reflux, Alt, and Redux. But
    to

    keep things simple and easier to learn, we will not use any of these frameworks.

    Instead, we will use the Flux.js and MicroEvent.js libraries to implement the

    Flux architecture.


    # Using Flux.js


    The Flux.js is a library created by the creators of Flux. It is used to build
    dispatchers.

    You can find the Flux.js source code at https://github.com/facebook/flux and

    the CDN version at https://cdnjs.com/libraries/flux.


    A dispatcher is created using the Dispatcher constructor. It has five methods,

    as follows:


    +   - register(callback): This method lets us register a callback. It returns
    a

    string called the callback ID to uniquely identify a callback.

    - unregister(id): This is a method lets us unregister a registered callback. To

    unregister, we need to pass the ID of the callback that we want to unregister.

    - waitFor(array): This waits for the specified callbacks to be invoked before

    continuing with the execution of the current callback. This method should

    only be used by a callback in response to a dispatched action.


    [ 227 ]'
