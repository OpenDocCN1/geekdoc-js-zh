  md: "Chapter 12\n\nHere, you can see that shadow DOM was used to achieve style encapsulation.\n\
    \n> In case you don't want style encapsulation for a component, you can assign\
    \ the encapsulation property to ng.core.ViewEncapsulation. None in this case,\
    \ all of the CSS will be placed directly in the <head> tag.\n\n# Angular 2 change\
    \ detection\n\nChange detection is the process of detecting component state change.\
    \ The state of a component is stored and manipulated using this keyword. There\
    \ is no direct way for Angular 2 to detect when the state changes. So, Angular\
    \ 2 uses complex algorithms and third-party libraries to detect state changes.\n\
    \nThe first thing Angular 2 does for detecting state changes is that it pretends\
    \ all the changes happen asynchronously. Then, it uses the zone.js library to\
    \ monitor browser timers, AJAX requests, WebSockets, and other asynchronous things\
    \ that are supported by zone.js.\n\nNow, when any of these asynchronous activities\
    \ takes place, it checks everything that could change, including object properties\
    \ and array elements of the keyword of all the components from the root node;\
    \ if any change is detected, the template bindings of the component are updated.\
    \ Angular 2 doesn't simply render the component. Instead, it checks for the bindings\
    \ that have changed and selects them specifically.\n\nSome components can have\
    \ a lot of state data, and checking the state for every asynchronous operation\
    \ will unnecessarily impact app performance if their state has not changed. Furthermore,\
    \ Angular 2 provides an option to match such kinds of components so that it does\
    \ not check its state unless the component tells itself Angular 2 to check its\
    \ state during the next detection cycle, which is, when the asynchronous activity\
    \ occurs. Let's look at an example to demonstrate this.\n\nPlace this code above\
    \ the AppComponent in the <script> tag of the index.html file:\n\n```\nvar SampleComponent\
    \ = ng.core.Component({\n  selector: \"sampleone\",\n  template: \"{{value}}\"\
    ,\n  viewProviders: [ng.core.ChangeDetectorRef],\n  changeDetection: ng.core.ChangeDetectionStrategy.Detached\n\
    }}).Class({\n```\n\n[ 259 ]"
