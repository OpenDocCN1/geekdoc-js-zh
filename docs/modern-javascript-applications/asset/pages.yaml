  md: 'Chapter 1


    Some developers don''t use a centralized database at all, instead all services
    have their own database to store the data. To synchronize the data between the
    services, the services omit events when their data is changed and other services
    subscribe to the event and update the data. The problem with this mechanism is
    that if a service is down, then it might miss some events. There is also going
    to be a lot of duplicate data, and finally, it is difficult to code this kind
    of system.


    Therefore, it''s a good idea to use a centralized database and also let each service
    to maintain their own database if they want to store something that they don''t
    want to share with. Services should not connect to the centralized database directly,
    instead there be another service called database service that provides APIs to
    work with the centralized database. This extra layer has many advantages, as the
    underlying schema can be changed without updating and redeploying all the services
    that depend on the schema, you can add a caching layer without making changes
    to the services, and there are many other benefits. We can also have multiple
    services if there are multiple schemas, or if there are different types of database,
    or due to some other reason that benefits the overall architecture and decouples
    the services.


    # Implementing microservices using Seneca


    Seneca is a Node.js framework for creating server-side applications using microservices
    architecture with monolithic code.


    Earlier, we discussed that in microservices architecture, we create a separate
    service for every component, so you must be wondering what''s the point of using
    a framework for creating services that can be done by simply writing some code
    to listen to a port and reply to requests. Well, writing code to make requests,
    send responses, and parse data requires a lot of time and work, but a framework
    like Seneca makes this easy. Also, converting the components of a monolithic code
    to services is also a cumbersome as it requires a lot of code refactoring, but
    Seneca makes it easy by introducing the concepts of actions and plugins. Finally,
    services written in any other programming language or framework will be able to
    communicate with Seneca services.


    Seneca, an action represents a particular operation. An action is a function that''s
    identified by an object literal or JSON string called the action pattern.


