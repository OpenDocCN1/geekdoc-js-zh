  md: '# 1

    Breaking into Microservices Architecture


    The architecture of server-side application development for complex and large
    applications (applications with huge number of users and large volume of data)
    shouldn''t just involve faster to, upgrade, providing web services for wide variety
    of platforms. It should be easy to scale, upgrade, update, and deploy. It should
    also be available, allowing the developers write components of the server-side
    application in different programming languages and use different databases. Therefore,
    this leads the developers who build large and complex applications to switch from
    the common monolithic architecture to microservices architecture that allows us
    to do all so easily. As microservices architecture is being widely used in enterprises
    that build large and complex applications, it''s really important to learn how
    to design and create server-side applications using this architecture. In this
    chapter, we will discuss how to create server-side applications based on microservices
    architecture with Node.js using the Seneca toolkit.


    In this chapter, we''ll cover the following topics:


    +   - Understanding monolithic architecture

    - Scaling, upgrading, deploying, and writing applications based on monolithic
    architecture

    - Discussing microservices architecture in depth

    - Scaling, upgrading, deploying, and writing applications based on microservices
    architecture

    - Getting started with Seneca

    - Creating and calling services using Seneca'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# What is monolithic architecture?


    To understand microservices architecture, it''s important to first understand
    monolithic architecture, which is its opposite.


    In monolithic architecture, different functional components of the server-side
    application, such as payment processing, account management, push notifications,
    and other components, all blend together in a single unit.


    For example, applications are usually divided into three parts. The parts are
    HTML or native UI that run on the user''s machine, server-side application that
    runs on the server, and database that also runs on the server. The server-side
    application is responsible for handling HTTP requests, retrieving and storing
    data in a database, executing algorithms, and so on. If the server-side application
    is a single executable (that is, running is a single process) that does all these
    tasks, then we say that the server-side application is monolithic.


    This is a common way of building server-side applications. Almost every major
    CMS, web servers, server-side frameworks, and so on are built using monolithic
    architecture.


    This architecture may seem successful, but problems are likely to arise when your
    application is large and complex.


    # Demerits of monolithic architecture


    The following are some of the issues caused by server-side applications built
    using the monolithic architecture.


    # Scaling monolithic architecture


    As traffic to your server-side application increases, you will need to scale your
    server-side application to handle the traffic.


    In case of monolithic architecture, you can scale the server-side application
    by running the same executable on multiple servers and place the servers behind
    a load balancer or you can use round robin DNS to distribute the traffic among
    the servers:'
  merge: -1
  pgno: 22
