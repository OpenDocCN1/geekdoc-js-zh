    \ method of the EventStream or\nproperty. The endOnError method returns a new\
    \ EventStream or property,\nwhich is ended when a Bacon.Error instance is pushed.\n\
    \n# Handling exceptions\n\nIf an exception is encountered inside a callback passed\
