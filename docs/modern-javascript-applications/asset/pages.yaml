  md: "# Functional Reactive Programming\n\nWe have now set up a basic Bacon.js project.\
    \ Run node app.js to start the web server. Now, let's explore Bacon.js APIs.\n\
    \n# Bacon.js APIs\n\nBacon.js provides APIs to do almost anything that's possible\
    \ using EventStreams and properties. The method of importing and downloading Bacon.js\
    \ for the backend and frontend is different, but the APIs are the same for both.\
    \ Let's look at the most important APIs provided by Bacon.js.\n\n# Creating EventStreams\n\
    \nThere are various ways of creating EventStreams, depending on how an asynchronous\
    \ API follows. An asynchronous API follows the event-driven, promise, or callback\
    \ pattern. We need to wrap these patterns with Bacon-provided APIs to connect\
    \ their data updates or updates to event streams, that is, convert them to functional\
    \ patterns.\n\nIf we want to create an EventStream for a UI element on a web page,\
    \ we can use the $.asEventStream() method. Let's look at an example of how it\
    \ works. Place the following code in the <body> tag of the index.html file to\
    \ create a button:\n\n```\n<button id=\"myButton\">Click me!!</button>\n```\n\n\
    In event-driven pattern, to print whenever a button is clicked, we would write\
    \ something like this: \n\n```\ndocument.getElementById(\"myButton\").addEventListener(\"\
    click\",\nfunction() {\n  console.log(\"Button Clicked\");\n}, false);\n```\n\n\
    In Bacon.js, we will write it this. Place this code in the index.js file:\n\n\
    ```\nvar myFunction_click_stream = $(\"myButton\").asEventStream(\"click\");\n\
    Button_click_stream.onValue(function(e) {\n  console.log(\"Button Clicked\");\n\
    })\n```\n\nHere, we use a jQuery selector to point to the button, and then we\
    \ use the $.asEventStream method to connect its click events to an EventStream.\
