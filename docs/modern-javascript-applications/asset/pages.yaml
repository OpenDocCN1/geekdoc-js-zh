  md: "# Serving static files and HTML to the users\n\nNow we need to write the code\
    \ to server HTML, CSS, and JavaScript files to the users. The following is the\
    \ code to do this. Place this code in the app.js file right after the previous\
    \ snippet:\n\n```\napp.use(express.static(__dirname + \"/public\"));\n\napp.get(\"\
    /\", function(httpRequest, response, next) {\n  httpRequest.sendFile(__dirname\
    \ + \"/public/html/index.html\");\n});\n```\n\nHere, the first line of the code\
    \ is serving static files. The rest of the code is serving index.html when they\
    \ visit the root path.\n\n# Serving HTML to the administrator and protecting the\
    \ admin panel\n\nWe only want the administrators to access the admin panel to\
    \ update the scores. So, for visitors to access the admin panel, they must enter\
