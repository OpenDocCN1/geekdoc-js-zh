  md: '# Building a Coupon Site


    +   - If the coupon metadata got added successfully, we will retrieve the base
    URL of monolithic core from the URL config service and redirect there with a ?status=submitted
    query string, which indicates that the format was submitted successfully. When
    the monolithic core sees this query string, it displays a message saying that
    the coupon was submitted successfully.

    - In case the URL config service doesn''t respond for some reason, we will return
    an HTTP internal server error to the client.


    So what you need to keep in mind coding such services is that you need to handle
    all sorts of failures and also roll back changes if a failure occurs. Now, this
    makes it easy to upload and redeploy the database service, URL config service,
    and image storage server as the upload service handles the failure of these services
    and provides a feedback to the user.


