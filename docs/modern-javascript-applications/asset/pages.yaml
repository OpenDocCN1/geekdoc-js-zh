  md: '# Building an Advanced Profile Search Widget


    This is how the code works:


    +   1. At first, we define two methods, which take a list of profiles and search
    data and filter based on the data. The first one only filters based on e-mail
    whereas the second one filters based on other search data. We have done it this
    way because email is unique for every profile, and if a user provides an e-mail
    ID, then we don''t need to use other data and waste computation. When there is
    a lot of data, you will get a big performance advantage this way.

    2. Then, we create an EventStream for the /search path.

    3. After that, we create two streams, namely profile_search_data_stream_form_email
    and profile_search_data_stream_form_others. The profile_search_data_stream_form_email
    is the final result if an e-mail is provided, and profile_search_data_stream_form_others
    is the final result if an e-mail is not provided.

    4. Finally, we merge profile_search_data_stream_form_email and profile_search_data_stream_form_others,
    zip that with profile_search_stream, and return the response.


