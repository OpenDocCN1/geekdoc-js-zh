  md: '# Summary


    In this chapter, we saw a lot of services and libraries to scale and secure Node.js
    applications. We saw various vulnerabilities and how to prevent them. Make sure
    you take regular backups of your data so that even if your app is hacked, you
    will still have a chance to get the application running again as the data is not
    lost. Obviously, there is a lot more to learn about scaling and securing Node.js
    applications as this is an unending topic and new things come up regularly.'
