  md: "# Functional Reactive Programming\n\nHere, we are using map() to transform\
    \ the Unix timestamp to the HH:MM format, which is easy to understand.\n\nThere\
    \ is another, vital transformation drive helper function provided by Bacon.js\
    \ called flatMap. There are basically two differences between flatMap and map:\n\
    \n+   - The flatMap function always returns an EventStream regardless of whether\
    \ it was called on an EventStream or property.\n- If the callback passed to flatMap\
    \ returns an EventStream or property, then the events of the EventStream returned\
    \ by the flatMap function are then asynchronous and values of the streams and\
    \ properties returned by flatMap. Whenever an event or value is added to the streams\
    \ and properties the event and value will automatically returned by the callback\
    \ passed to flatMap, returned by the EventStream function.\n\nYou need to use\
    \ flatMap instead of map when retrieving the return value of a callback to a network,\
    \ disk drive, or somewhere else. For example, in the previous example we talked\
    \ about transforming a URL to a URL response, we need to use flatMap instead of\
    \ map as instead of a callback, we need to make an AJAX request, and its response\
    \ will be captured as a stream, and the stream will be returned. When the AJAX\
    \ request completes, the event will be put inside the stream returned by the flatMap\
    \ function.\n\nLet's look at an implementation of this example. First, create\
    \ an input text field and place it in the index.html file, as follows:\n\n```\n\
    <input id=\"url\" type=\"url\">\n```\n\nNow, let's write code using Bacon.js to\
    \ log the output of the URL entered in the field when a user hits the Enter key.\
    \ Here is the code to do this. Place it in the index.js file:\n\n```\nvar enter_key_click_stream\
    \ = $(\"url\").asEventStream(\"keyup\")\n  filter(function(e) {\n    return e.key\
    \ == 13;\n})\n```\n\n```\nvar url = enter_key_click_stream.scan(\"\", function(value,\
    \ e) {\n  return e.currentTarget.value;\n})\n```"
