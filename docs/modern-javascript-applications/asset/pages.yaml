  md: "# Merging\n\nMerging streams or properties gives a new stream or property that\
    \ delivers all the events or values of all the streams or properties. To merge\
    \ EventStreams or properties, we can use their Bacon.mergeAll method instances.\
    \ Here is some example code to demonstrate this. Place it in the index.js file:\n\
    \n```\nvar merged_property = Bacon.mergeAll(button_click_counter, button_click_time);\n\
    \nmmerged_property.onValue(function(e) {\n  console.log(e);\n})\n```\n\nHere,\
    \ we merge two properties. Bacon.mergeAll takes an array of either EventStreams\
    \ or properties. Whenever the value of either of the two properties changes, the\
    \ value is made the current value of the resultant property.\n\nThere are other\
    \ helper functions available for merging properties and EventStreams.\n\n# Filtering\n\
    \nFiltering is removing specific events or values from EventStreams or properties,\
    \ respectively, that we don't need.\n\nBacon.js has a lot of helper functions\
    \ to filter EventStreams and properties, depending on what you want to filter.\
    \ Let's look at the filter method for EventStreams and properties that we use\
    \ based on a predicate function; that is, if the function returns true, then the\
    \ value is accepted; otherwise, it is rejected.\n\nLet's look at example code\
    \ to demonstrate this. In the index.js file, find this code:\n\n```\nvar myButton_click_stream\
    \ = $(\\(\"#myButton\")).asEventStream(\"click\");\nmyButton_click_stream.onValue(function(e)\
    \ {\n  console.log(e);\n  console.log(\"Button Clicked\");\n})\n```\n\nReplace\
    \ that with this code:\n\n```\nvar myButton_click_stream = $(\\(\"#myButton\"\
    )).asEventStream(\"click\");\nfilter(function(e) {\n  return e.shiftKey === true;\n\
    });\n```"
