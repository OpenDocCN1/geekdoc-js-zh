  md: "# What is the difference between a closure and a first-class function?\n\n\
    Closures are the most misunderstood topic in JavaScript. In a nutshell, closure\
    \ is a function returned by another function, and when the function is invoked,\
    \ it has access to the lexical scope in which it was defined. A function returned\
    \ by a first-class function may or may not be a closure. Here is an example to\
    \ demonstrate closures.\n\n```\nfunction a() {\n  var b = 12;\n  function c()\
    \ {\n    console.log(b);\n  }\n  return c;\n}\nvar d = a();\nd(); //Output \"\
    12\"\n```\n\nHere, the function named c is it's returned by a, and when invoked,\
    \ it has access to the variables declared inside a.\n\n# Functional programming\
    \ helper functions\n\nFunctional programming languages provide a lot of in-built\
    \ functions called helper functions to make it easy to write functional code.\
    \ For example, as we cannot use loops for iteration of functional code, we need\
    \ some sort of function to take a collection and map each value of the collection\
    \ to a function. Functional programming languages provide the map helper function\
    \ for this purpose. Similarly, there are a lot of other helper functions for different\
    \ purposes.\n\nAs JavaScript is not a functional language, it does not come with\
    \ functional helper functions. However, ES6 introduced some helper functions,\
    \ such as Array.from(),Array.prototype.from(), and Array.prototype.find(). Still,\
    \ this list is not enough to write functional code. Therefore, developers use\
    \ libraries such as Underscore.js to write functional code."
