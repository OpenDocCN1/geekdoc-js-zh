  md: '# 12


    # Exploring Connection Pooling


    Connection pooling means that the connection is reused rather than created for
    every request. A connection pool facilitates reusability of the database connections
    and maintains a memory cache of connections. The connection pooling module sits
    at the top layer of the standard JDBC driver process.


    The practice of using connection pooling in server-side application is performed
    in the background. In addition, it does not affect the procedure of application
    coding. If using the DriverManager class, a DataSource (an object interface) can
    be used by an application to obtain a connection from the connection pool. A DataSource
    is registered with the JNDI Naming service. After the DataSource is registered,
    it is automatically reused with the JNDI Naming service. The following code snippet
    shows how the DataSource is used in a connection pool:


    ```

    Context context = new InitialContext();

    DataSource ds = (DataSource)context.lookup("jdbc/servletink");

    ```


    In the proceeding code snippet, if the DataSource object performs connection pooling,
    the connection manipulation benefits from the connection reuse. The reused connections
    from the pool performs tasks similarly to the newly created connections. When
    all the required are performed by the application, the connection is explicitly
    closed. The following code snippet shows the deconnection from the connection
    pool:


    ```

    Connection db = ds.getConnection("scott", "tiger");

    // do database activities using the connection...

    dbcon.close();

    ```


    In the proceeding code snippet, the closing event of a connection signals the
    pooling mechanism to place the connection back in the connection pool for future
    reuse.


    # Traditional Connection Pooling


    A general framework has been provided by the JDBC API to support for connection
    pooling. In traditional connection pooling, third-party vendors classes support
    the connection pooling mechanism. The implementation of the specific caching or
    pooling algorithms can be done by third-party vendors or users. The JDBC4. API
    uses the ConnectionEvent class and provides various interfaces to create connection
    pool. To provide connection pooling in a server-side application, the DataSource
    must implement the following interface:


    +   - PooledConnectionDataSource Specifies the data source used in a connection
    pool. The interface also acts as a factory for the pooled connection objects.


    +   - ConnectionEventListener Refers to an object that handles the events generated
    by a PooledConnection object.


    +   - JDBCDriverDataSource Refers to a class that implements the standard ConnectionPoolDataSource
    interface. This interface provides hooks, which can be used by the third-party
    vendors to implementing pooling as a layer on top of their JDBC drivers. Moreover,
    in this cases, the ConnectionPoolDataSource interface acts as a factory that creates
    PooledConnection objects.


    +   - JDBCDriverPooledConnection Requires a JDBC driver with a class that implements
    the standard PooledConnection interface to implement the connection pooling mechanism.
    The third-party vendors implementing pooling in the JDBC drivers using this interface.
    In such cases, a PooledConnection object acts as a factory of the Connection objects.
    A PooledConnection is the physical connection to the database, while the Connection
    object created by the PooledConnection object is a handle to the PooledConnection
    object.


