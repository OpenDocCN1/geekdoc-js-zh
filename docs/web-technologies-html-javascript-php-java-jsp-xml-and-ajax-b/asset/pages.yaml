    >\n  <!-- --- Content: xsl:param --- -->\n</xsl:call-template>\n```\n\n# Attributes\n\
    \nTable 7.9 lists the attribute used by this element.\n\n| Table 7.9: Attribute\
    \ of <xsl:call-template> |\n| --- | --- | --- |\n| Name | Value | Meaning |\n\
    | name | templatename | It specifies the name of the template to be called |\"\
    , Name | Value | Meaning\n| name | templatename | It specifies the name of the\
    \ template to be called |\n\n# Using <xsl:call-template>\n\nFor an example, let's\
    \ consider the XML document given in Listing 7.6. Here's the code, given in Listing\
    \ 7.7, for applying the XSL stylesheet to perform transformation:\n\nListing 7.7:\
    \ xsltcalltemplates.xsl\n\n```\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"\
    ?>\n<xsl:stylesheet version=\"1.0\">\n\nxmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
    >\n<xsl:template match=\"//>\n\n<html>\n<title>XSLT ELEMENTS</title>\n<body>\n\
