  md: "# Introducing Arrays\n\nYou have already learnt that a variable is a storage\
    \ area holding numbers and text. The problem is that a variable can hold only\
    \ one value at a time while an array is a special variable, which can hold more\
    \ than one value at a time. An array can hold all values under a single name.\
    \ You can access the values of an array by referring to the array name.\n\n# Creating\
    \ an Array\n\nCreating an array in PHP is a simple task. `array()` construct is\
    \ used in PHP to create an array. Let's start with creating an empty array. That\
    \ is, an array with no index or values. List 5.23 shows how to create an empty\
    \ array using `array()`\n\nList 5.23: Creating an Empty Array\n\n```\n```php\n\
    // create an empty array\n$array=array();\n?>\n```\n```\n\nIn the preceding listing,\
    \ we have created a variable `Sarray`, which is an empty array using `array()`\
    \ construct. PHP provides `is_array()` to check if a variable is an array or not.\
    \ The `is_array()` function takes variable as its only argument and returns a\
    \ Boolean TRUE if the variable is an array otherwise returns FALSE. List 5.24\
    \ checks whether the variable, Sarray is an array or not using the `is_array()`\
    \ function:\n\nList 5.24: Checking the $Sarray Variable\n\n```\n```php\n$array\
    \ = array();          // create an empty array\nif(is_array($array))      // check\
    \ if $array is an array\n{\n    echo \"Variable is an array\"; // if it is an\
    \ array\n}\nelse                       // if it is not an array\n    echo \"Variable\
    \ is not an array\";\n}\n?>\n```\n```\n\nOutput:\nVariable is an Array\n\nIn the\
    \ preceding listing, we first create an empty variable, `$Sarray` and then we\
    \ check whether the variable is an array or not using the `is_array()` function.\
    \ As mentioned above an array is a map of key (index) and value pairs. Each key\
    \ is assigned a value. The value can be in the form of variables, arrays, or objects.\
