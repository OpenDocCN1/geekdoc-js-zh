  md: '# Chapter 13


    +   - actor attribute

    - mustUnderstand attribute

    - encodingStyle attribute


    Let''s explore all these elements.


    # The actor Attribute


    This attribute is used to address the Header element to one or more specific intermediaries.


    # The mustUnderstand Attribute


    This is used to specify whether the receiver has process the header.

    The code given in Listing 13.33 shows where these attributes are used:


    ```

    Listing 13.33: Use of Attributes

    ```xml

    <?xml version="1.0"?>

    soap:Envelope

    xmlns:soap="http://www.w3.org/2001/12/soap-envelope"

    ssoap:encodingStyle="http://www.w3.org/2001/12/soap-encoding">

    <soap:Header>

    <m:Trans

    xmlns:m="http://www.w3schools.com/transaction/

    xmlns:actor="http://www.w3schools.com/appl/"

    actor:mustUnderstand="1"

    </m:Trans>

    </soap:Header>

    ...

    ```

    ```


    mustUnderstand attribute can accept two values either 0 or 1. We assigned "1"
    to mustUnderstand attribute which means that the receiver will process the header
    element. The actor attribute enforces only the header element of message to reach
    intermediary represented by http://www.w3schools.com/appl/URI


    # The encodingStyle Attribute


    The encodingStyle attribute is used to specify the default namespace for SOAP
    encoding and data types.

    Listing 13.33 http://www.w3.org/2001/12/soap-encoding is the default namespace.


    # The body Element


    It is an essential element. It contains the message to be sent to the recipient
    of the message. The message is application specific and not part of SOAP standards.
    The code given in 13.34 explains how the body element looks like:


    ```

    Listing 13.34: The body Element

    ```xml

    <?xml version="1.0"?>

    <soap:Envelope

    xmlns:soap="http://www.w3.org/2001/12/soap-envelope"

    sop:encodingStyle="http://www.w3.org/2001/12/soap-encoding">

    <soap:Body>

    <m:GetPrice xmlns:m="http://www.w3schools.com/prices">

    <m:Item>Shoes</m:Item>

    </m:GetPrice>

    </soap:Body>

    </soap:Envelope>

    ```

