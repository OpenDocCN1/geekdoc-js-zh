  md: '# Chapter 8


    Whenever a client wants to call business methods of an enterprise bean, it needs
    to connect to the container first. The container verifies whether or not the call
    follows the semantics in Deployment Descriptor and then dispatches the request
    to the enterprise bean. This mechanism enables the container to control all the
    aspects of the execution of an enterprise bean, including the following aspects:


    +   - Life Cycle – Refers to the life cycle of an enterprise bean with specification.
    While managing the life cycle of an enterprise bean, the container itself ensures
    security, transaction, and persistence requirements.

    - Security – Refers to the permissions set for access an enterprise bean. When
    a client calls to a method of EJB, the container looks for the user''s permission
    in an Access Control List (ACL) to verify whether the client has permission to
    invoke that method. Deployment Descriptor contains the access control declarations
    about the EJB''s methods.

    - Transaction – Refers to the declarations about the transaction on the EJB''s
    methods included in the Deployment Descriptor object. When a client calls to a
    method of the EJB, the container verifies whether or not the transaction on that
    method.

    - Persistence – Refers to the persistence storage of an entity bean. One is managed
    by beans and the other is managed by the container. The managed bean is responsible
    for implementing data access as the code for data access functions need to be
    defined in the bean class, whereas CMP, the implementation of data access functions
    are done by the container.


    # The EJB Client


    The client code is written to execute business logic embedded in an enterprise
    bean and its methods. An EJB client can be a simple Java program or a Web client.
    The end-users run these clients to get results from the enterprise bean invocation.
    The EJB client can use resource injection or JNDI service to access the enterprise
    bean. The EJB client can be a simple Java class, applet, servlet, or JSP. An enterprise
    bean is looked up using resource injection or the lookup() method, irrespective
    of the EJB clients.


    # Benefits of Enterprise Bean


    The use of enterprise beans simplified the development of large scale and distributed
    applications. Some common benefits of using enterprise bean applications are given
    as follows:


    +   - Enterprise beans have to concentrate on solving the business problems only,
    as the system-level services, such as transaction management and security authorization,
    are handled by the EJB container.

    - Client interface does not need to implement the business logic of the application;
    they can focus on the presentation of the client

    - Enterprise beans are reusable components, so these beans can be used to build
    new applications.

    - Enterprise beans are based on Java technology, so that these beans are write
    once and run anywhere. Therefore, EJB beans can be executed on any JEE server,
    for instance Glassfish.

    - Enterprise beans support distributed transactions, which means that a client
    can begin a transaction and then can invoke methods on beans that are on different
    servers or platforms.


    Let''s explore different types of beans.


    # Types of Beans


    There are different scenarios in the enterprise application development where
    you need to implement different types of enterprise beans. Different enterprise
    beans provide different functionalities.'
