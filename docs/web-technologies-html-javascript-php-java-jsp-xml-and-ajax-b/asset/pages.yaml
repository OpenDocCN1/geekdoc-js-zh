    # Updating a CachedRowSet


    Updating a CachedRowSet is similar to updating a ResultSet object. When the CachedRowSet
    is disconnected from the data source, the updates in the CachedRowSet are performed;
    however, the results of updates are not finally written to the data source. To
    write the results of updates, a connection with the data source must be established.
    Hence, after invoking the updateRow() or insertRow() method, another method, acceptChanges(),
    is called on the CachedRowSet to write the results on the database. Using the
    acceptChanges() method, the CachedRowSet internally updates, establishes the connection
    with the data source and also updates the changes in the data source.


    The following code snippet shows the steps to update a CachedRowSet:


    ```

    //Update 3rd and 4th column of current row

    crs.updateShort(3, 50);

    .updateInt(4, 150000);

    rs.updateRow();

    rs.acceptChanges();

    //Build a new row, inserts into cr and finally inserts into datasource

    rs.insertRow("Name", "shakespeare");

    rs.updateInt("ID", 1098347);

    rs.updateShort("Age", 58);

    rs.insertRow();

    rs.moveToCurrentRow();

    rs.acceptChanges();

    ```


    In the preceding code snippet, a connection is established to each call of the
    acceptChanges() method after calling the updateRow() and insertRow() methods to
    change or insert multiple rows. The advantages of using the CachedRowSet objects
    are as follows:


    +   - Obtains a connection to a data source and executes a query

    - Reads the data from the ResultSet object and updates itself with data that it
    is disconnected

    - Manipulates the data and makes changes to data while it is disconnected

    - Reconnects to the data source to write the changes back to it

    - Checks and resolves the conflicts with the data source


    The JDBC API are not implemented for using the CachedRowSet objects. As the CachedRowSet
    object is serializable, a CachedRowSet object is used to pass data between different
    components of an application. Working on a network environment, a CachedRowSet
    object can be used to send the result of a query that is across the Enterprise
    JavaBeans.


    # WebRowSet Objects


    A WebRowSet object has all the capabilities of a CachedRowSet object and is used
    to read and write the database query results in an XML file. Enterprises on different
    locations and platforms can communicate through XML, hence the XML language has
    become the standard for Web services communication. As a consequence, a WebRowSet
    object solves a problem by making it easy for Web developers to write the Web
    service programs to send and receive data from a database in the form of an XML
    document.


    # Creating and Populating a WebRowSet Object


    The new instance of the WebRowSet object can be created using the reference of
    the WebRowSetImpl class. The following code snippet shows how to create an instance
    of the WebRowSet object:'
