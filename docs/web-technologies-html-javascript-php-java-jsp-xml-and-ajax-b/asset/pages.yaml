    # Sending Data to Server


    When a web page is submitted, two attributes are used to send data to the server.
    These attributes are action and method. The URL of PHP page is assigned to action
    attribute. If we do not use this attribute, the default value is of the current
    PHP document. The method attribute takes two values—GET and POST.

    deault value is GET.


    The code in Listing 13.11 shows the name.html web page:


    Listing 13.11: name.html


    ```

    <html>

    <head>

    <title>Sending data to server</title>

    </head>

    <body>

    <center>

    Sending data using text fields

    <h2>

    <form method="post" action="displayname.php">

    Enter your name:

    <input name="name" type="text">

    <br><br>

    <input type="submit" value="Submit">

    </form>

    </center>

    </body>

    </html>

    ```


    Listing 13.11 is a simple HTML form having a text field and submit button. When
    this form is submitted, the control transfers to displayname page.


    The code in Listing 13.12 shows the use of $_REQUEST array in example:


    Listing 13.12: displayname.php


    ```

    <html>

    <head>

    <title>Reading data</title>

    </head>

    <body>

    <center>

    <h1>Reading data from text fields in PHP</h1>

    Your name is

    <?

    echo $_REQUEST["name"];

    ?>

    </center>

    </body>

    </html>

    ```


    In Listing 13.12, the displayname.php extracts data from the text field name.
    PHP $_GET or $_POST array is used to get data, e.g. from name.html page depending
    on the method used. The syntax for accessing text field is $_POST[''name'']. But
    PHP provides another alternative for accessing GET or POST data, which is $_REQUEST
    is another PHP array, which accesses data without considering GET or POST method.


