    Now, let''s discuss how to validate the information entered by a user in a form.


    # Validating a Form


    Validating a form involves verifying that the users have entered the correct data
    in the relevant form elements of a form. For example, if your form has a box for
    the user to enter an email address in the specific field before submitting a form.
    When using PHP, the data validation is the process of checking that a form has
    been filled correctly before it is processed. For example, if our form has a box
    for the user to type their email address, we might want our form handler to check
    that they''ve filled in their address we deal with the rest of the form.


    There are two main methods for validating forms: server-side (using CGI scripts,
    PHP, etc), and client-side (usually done using JavaScript). Server-side validation
    is more secure. Figure 6.12 shows the process of validating a Web form:


    ![](img/ff578e59567ce41d5431f36224872e10_171_1.png)


    Figure 6.12: Showing Server Side Form Validation


    Figure 6.12 shows that the data entered in a form is sent to the server. The data
    is then verified at the server end.


    When the server encounters an incorrect data element sent through a Web form,
    an error message is displayed. In addition, the server also verifies if the data
    entered in a form element is in the correct format. For example, a date text box
    on a Web form must accept only data in the date format. Let''s explore how we
    display an error message and enforce data rules to ensure that data is entered
    in the correct format.


    Server side validation is usually performed with PHP, ASP, or CGI.


    154'
