  md: '# Chapter 13


    UDDI API has the get_businessDetail method. This method is redundant and can be
    removed from API HTTP also has corresponding GET method. You can perform the same
    operation using HTTP GET method. UDDI has many get methods that work on data objects,
    such as business services. These data objects can be represented by XML documents
    and methods can be eliminated. Everything in UDDI database can also be recognized
    by URI addressable methods. Experts are focusing on use of XML in UDDI. An entry
    in one registry points to a UDDI entry. When a business changes its information,
    it reports change in UDDI. Elements in a single UDDI registry refer to each other,
    but are not able to refer to objects elsewhere on the web. If the business entities
    are written in XML, then it will be easy to add elements and attributes.


    Other methods of UDDI can also be removed. UDDI has the delete_business method.
    HTTP also has corresponding DELETE method. You can perform the same operation
    using HTTP DELETE method. You can now perform HTTP delete. The save_business method
    is used for uploading new businesses. A similar method takes HTTP in PUT or POST.
    The find_business method is similar to search engine sites. HTTP URI takes a set
    of search parameters and returns an XML document representing matched entities.

    Hence all methods in UDDI API can be implemented by HTTP-based URIs. This produces
    another type of architecture for representing Web services of businesses, called
    REST.


