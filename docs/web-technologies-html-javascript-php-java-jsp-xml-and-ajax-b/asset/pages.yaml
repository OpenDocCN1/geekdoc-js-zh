  md: "# Bound and Constrained Properties\n\nA Bean which contains a property generates\
    \ an event when the property is changed. Here, the event is of type PropertyChangeEvent,\
    \ and it is sent to objects that previously registered an interest in receiving\
    \ such notifications. A class that handles this must implement the PropertyChangeListener\
    \ interface.\n\nThe JavaBeans model supports two variations on standard properties—first\
    \ is bound properties and the second is called constrained properties. The role\
    \ of bound properties is to support the registration and notification of \"interested\
    \ parties\", whenever the property changes. And the role of constrained properties\
    \ is to make notification one step further by allowing the notified party to exercise\
    \ a veto in order to prevent the property change. Unless event handled by the\
    \ JavaBeans framework.\n\nBound properties are used for features that allow all\
    \ instances of the same Bean or some other Bean to share a property value and\
    \ synchronize their values accordingly (ie to match the \"trend setting\" Bean).\
    \ Let's allow other GUI Beans to monitor a change in its background color to update\
    \ its background.\n\nHowever, implementation of a bound property is quite easy\
    \ because the underlying framework provided by the JavaBeans architecture. Bean\
    \ supports a bound property. In order to support a bound property, the Bean must\
    \ instantiate an object of the JavaBeans framework, which provides the bulk of\
    \ this functionality, and provides notification methods that simply invoke the\
    \ appropriate methods in the JavaBeans framework. The code snippet shows the use\
    \ of the addPropertyChangeListener() and removePropertyChangeListener() methods:\n\
    \n```\nprivate PropertyChangeSupport changes = new PropertyChangeSupport(this);\n\
    public void addPropertyChangeListener(PropertyChangeListener p) {\n    changes.addPropertyChangeListener(p);\n\
    }\npublic void removePropertyChangeListener(PropertyChangeListener p) {\n    changes.removePropertyChangeListener(p);\n\
    }\n```\n\nEach bound property must invoke the firePropertyChange() method from\
    \ its set() method, as shown in the following code snippet:\npublic void setMode(int\
    \ mod) {\nint oldMod = this.mod;\nthis.mod = mod;\nrepaint();\nchanges.firePropertyChange(\"\
    mode\", oldMod, mod);\n}\n\nIn the proceeding code snippet, PropertyChangeSupport\
    \ is used to handle the notification of all registered targets. You have to note\
    \ that PropertyChangeSupport provides a general-purpose functionality following\
    \ a prescribed protocol. Specifically, the method invocation for the firePropertyChange()\
    \ method must provide the property name, as well as the old and new values, which\
    \ are passed along to notified targets."
