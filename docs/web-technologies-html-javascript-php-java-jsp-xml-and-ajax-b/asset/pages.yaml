  md: "# JavaScript Programming\n\nIn 2.25, you can observe that when you check the\
    \ value of the letter variable to ensure whether the value is a consonant or vowel,\
    \ the value I pass through the if...else blocks and returns that the value is\
    \ vowel. With the nested if...else statements, you can create a group of yes-no\
    \ questions to make decisions. Another alternative to the nested if...else statements\
    \ is the switch statement, which is discussed next.\n\n# Using the switch Statement\n\
    \nThe switch statement provides a simpler alternative to the nested if...else\
    \ statements. You can use the switch statement to select a particular group of\
    \ statements to be executed among several other groups of statements. The group\
    \ of statements that is be executed is selected on the basis of a numeric or string\
    \ expression.\n\nThe syntax of the switch statement is:\n\n```\nswitch(expression)\n\
    {\n  case value1:\n    statement1\n    break;\n  case value2:\n    statement2\n\
    \    break;\n  case value3:\n    statement3\n    break;\n  default:\n    statement_default\n\
    \    break;\n}\n```\n\nIn the preceding syntax, switch, case, and break are keywords\
    \ in JavaScript. The switch keyword indicates the switch statement. The expression\
    \ that is specified to be evaluated within parentheses (the case keyword). If\
    \ any of the case value matches with the value of the expression, the group of\
    \ statements (indicated by statement1, statement2, or statement3) specified by\
    \ the respective case statement is executed. If none of the case value matches\
    \ with the value of the expression, then the default statement, specified by the\
    \ default keyword, is executed. The default statement is generally placed placed\
    \ at the very end of the switch block, however, you can place it anywhere within\
    \ the switch block.\n\nEvery group of statements specified by the case statements\
    \ has a break statement that is indicated by the break keyword. The break statement\
    \ prevents the execution to pass on to the next case or default after a match\
    \ is found.\n\nLet's create a Web page, named switchStatement.html to learn the\
    \ working of the switch statement. Listing 2.24 shows the code of the switchStatement.html\
    \ page:\n\nListing 2.24: Using the switch statement in a Script\n\n```\n<html>\n\
    <head>\n  <title>JavaScriptExample</title>\n</head>\n<body bgcolor=\"pink\">\n\
    \  <script type=\"text/javascript\" language=\"javascript\">\n    var letter=\"\
    I\":\n    switch(letter)\n```\n\n73"
