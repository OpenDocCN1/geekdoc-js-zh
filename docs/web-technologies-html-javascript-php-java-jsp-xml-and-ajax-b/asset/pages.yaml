    # Specifying the Action URL and Method to Send the Form


    In HTML, you can direct the data that the user enters to the server. You can do
    this by specifying the action URL and the method in your HTML code. Specified
    inside the `<form>` tag, action URL is the physical address of the server to you
    want the user to be redirected at the click of the submit button. You can specify
    two submission methods for a form. The method is specified inside the `<form>`
    tag using the method attribute. Table 1.7 lists brief description of the values
    of the method attribute:


    | Value | Description |

    | --- | --- |

    | method="get" | Indicates that the form data has to be encoded by the Web browser
    into a URL. This is the default method. |

    | method="post" | Indicates that the form data appears within the message body.
    |


    Let''s create a Web page, FormWithActionURL.html to learn how to specify the action
    URL and method to send the form. Listing 1.14 shows the code of the FormWithActionURL.html
    page:


    Listing 1.14: Specifying the Action URL and Method


    ```

    <html>

    <head>

    <title>

    Creating HTML Form</title>

    </head>

    <body>

    <form action="Example.html" method="post">

    First Name:

    <input type="text" name="firstname">

    <br>

    Last Name:

    <input type="text" name="lastname">

    ```'
