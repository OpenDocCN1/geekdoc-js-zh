    \ $value)\n{\n    echo $key . \" is \" .$value.\"<br />\";\n}\n?>\n```\n\nOutput:\n\
    \nName is Sulabh\nAge is 23\nAddress is Delhi\n\nIn Listing 4.14, the array element\
    \ (name=sulabh, age=23, address=delhi), is assigned to the $person variable. The\
    \ foreach loop executes continuously until all the elements of the array are traced.\
    \ The statement of the foreach block is executed after all the elements are traced,\
    \ and the message is displayed as the output.\n\n# Defining the Nested Looping\
    \ Statement\n\nThe placement of one loop inside the body of another loop is called\
    \ nesting. When you nest two loops, the outer loop controls the number of iterations\
    \ of the inner loop. You can nest all types of loops. Listing 4.15 shows an example\
    \ to understand the Script of the nested looping statement.\n\n# Listing 4.15:\
    \ Showing the Script of the Nested Looping Statement\n\n```\n<php\nfor($num2 =\
    \ 0; $num2 < 2; $num2++)\n{\n    for($num1 = 0; $num1 < 1; $num1++)\n    {\n \
    \       echo $num2 . \" And \" .$num1.\"<br />\";\n    }\n}\n?>\n```\n\n| Inner\
    \ Loop | Outer Loop |\n| --- | --- |\n\nIn Listing 4.15, two loops are used, outer\
    \ and inner. In the outer loop, the $num2 is initialized as zero and a condition\
    \ is set to evaluate whether the value of the $num2 is less than or equal to 2.\
    \ If the specified condition is true, that, if the value of the $num2 is less\
    \ than or equal to 2, the for loop is executed. In the inner for loop, the $num1\
    \ variable is initialized as zero and a condition is set to check whether the\
    \ value of $num1 is less than or equal to one. If the condition of inner for loop\
    \ is true, then the value of $num1 is incremented by 1 and the echo statement\
    \ of the inner loop displays the result to the user."
