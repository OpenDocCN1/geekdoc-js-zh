  md: "# Chapter 5\n\nFunctions and arrays are two useful programming concepts in\
    \ any programming or as scripting language. In simple terms, an array is a special\
    \ variable with a unique name, which can hold more than one value, at a time.\
    \ On the other hand a function is a block of code with a unique name, which can\
    \ be reused again and again. If required a function can be called by another function.\
    \ A function comprises of statements, such as looping statements, conditional\
    \ statements, and statements that define variables and arrays.\n\nIn this chapter\
    \ you will learn to use functions and arrays in PHP. The first part of this chapter\
    \ introduces the process of creating and invoking user-defined functions within\
    \ a PHP script. This section also discusses about built-in functions and their\
    \ usage in PHP. The second part of this chapter introduces the process of creating\
    \ arrays, and their implementation within the PHP script. Finally, some built-in\
    \ functions are discussed for array manipulation.\n\n# User-Defined Functions\
    \ in PHP\n\nIn PHP, there are more than 700 built-in functions. But PHP also allows\
    \ us to write our own functions. Reusability is the primary advantage of user-defined\
    \ functions. Functions make it easy to use the same piece of code several times\
    \ in your application without the need to write it again and again. The syntax\
    \ to create user-defined functions is as follows:\n\n```\nfunction_name(argument\
    \ 1, ..., argument n) {\n// to execute\n  return;\n}\n```\n\nA function is called\
    \ using keyword, followed by the name of the function and the parenthesis that\
    \ can contain many variables as arguments. The actual function is enclosed in\
    \ curly braces. The last line of the code block should be a return statement,\
    \ which returns control back to the called function.\n\n# Naming Conventions\n\
    \nFollowing are some basic rules, which should be followed while providing names\
    \ to functions:\n\n+   - Function names are not case sensitive. Therefore, fname(),\
    \ Fname(), and FNAME() all refer to the same function.\n- Function names can contain\
    \ only letters from the ASCII character set, digits, and underscores.\n- Function\
    \ names cannot begin with a digit.\n- Two functions cannot have the same name\
    \ as PHP does not support function overloading.\n- Reserved keywords cannot be\
    \ used as function.\n\n# Creating and Invoking a Function\n\nYou can create a\
    \ function using function keyword and invoke or call it by its name. The name\
    \ needs to be followed by a set of parentheses contain contain or more values\
    \ to be passed to the function. Listing 5.1 shows a user-defined function to print\
    \ the book:\n\nListing 5.1: Creating and Invoking a Function\n\n```\n<php\n//function\
    \ definition\nfunction book_Name($name) {\n  echo \"I have a book named \\ $name;\n\
    }\n\n//function invocation\nbook_Name(\"programming in PHP\\n?>\n```"
