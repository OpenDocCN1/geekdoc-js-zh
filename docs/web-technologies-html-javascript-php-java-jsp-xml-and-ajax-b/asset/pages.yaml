  md: '# Table 1.2: Attributes of the <head> Element


    | Attribute | Description |

    | --- | --- |

    | style | Represents inline style indicating how to render the element. |

    | title | Holds additional information for the element. |


    Table 1.3 lists all the elements that can be added inside the <head> element:


    # Table 1.3: Elements to be Added to the <head> Element


    | Attribute | Description |

    | --- | --- |

    | <base> | Represents base URL for the document. |

    | <basefont> | Represents base font for the document. |

    | <bgsound> | Represents background sound. |

    | <is> | Represents rudimentary input control. |

    | <link> | Represents a relationship between the document and another object.
    |

    | <meta> | Represents header information. |

    | <nextid> | Represents hint for the name value when creating a new hyperlink
    element. |

    | <noscript> | Holds text that only appears if the browser does not support the
    <script> element. |

    | <script> | Holds programming script statements, such as JavaScript. |

    | <style> | Includes style information to render the content. |

    | <title> | Represents title of the Web page that appears in the Web browser.
    |


    # The <title> Element


    The <title> element contains the title of the HTML document, which appears in
    the title bar of the Web browser and is used by search engines to refer to the
    document. Each <head> element should contain a <title> element. You should try
    to keep the title relatively short and to the point because some browsers face
    difficulties in handling titles longer than 256 characters. Table 1.4 lists all
    the attributes of the <title> element:


    # Table 1.4: Attributes of the <title> Element


    | Attribute | Description |

    | --- | --- |

    | class | Represents the class of the element is used to render the content. |

    | id | Represents unique alphanumeric identifier for the element. |

    | lang | Represents base language used for the element. |

    | style | Represents inline style indicating how to render the element. |'
