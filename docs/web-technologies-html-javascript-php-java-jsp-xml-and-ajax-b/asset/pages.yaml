  md: '# JSP Application Development


    The action tags are specific to a JSP page. When the JSP container encounters
    an action tag while converting a JSP page into a servlet, it generates the Java
    code that corresponds to the required predefined task. For example, when it comes
    across the ''include'' action tag:


    ```

    <jsp:include page="myjsp.jsp" flush="true" />

    ```


    In the preceding code snippet, the jsp:include action tag allows to include the
    myjsp.jsp page:

    Some important action tags available in JSP include:


    +   - <jsp:forward>

    - <jsp:param>

    - <jsp:useBean>

    - <jsp:setProperty>

    - <jsp:getProperty>

    - <jsp:plugin>

    - <jsp:params>

    - <jsp:fallback>

    - <jsp:attribute>

    - <jsp:body>

    - <jsp:element>

    - <jsp:text>


    Let''s describe these action tags in detail.


    # Describing the Include Tag


    The include action tag allows a static or dynamic resource such as HTML or JSP
    page, specified by a URL, to be included in the current JSP page while processing
    a request. If the included resource is static, its included in the calling JSP
    page. If the resource is dynamic, it acts on a request and sends a result, which
    is included in the JSP page. For example, if the resource is another JSP page,
    the output content generated by the second JSP page is included in the first JSP
    page. The following code snippet shows the syntax of the include tag in a JSP
    page:


    ```

    <jsp:include attributes="

    <!-- Zero or more jsp:param tags --

    "/>

    ```


    The include action tag has certain attributes, which are used to accept values
    for the specified JSP page. The attributes specific to include are:

    Page - Takes a relative URL, which locates the resource to be included in the
    JSP page. This allows us to give an expression that evaluates to a String to specify
    the relative URL directly or in an expression within a page attribute. The following
    syntax shows the use of the page attribute in a JSP page:


    +   - <jsp:include page="Header.jsp"/>

    - <jsp:include page="<%=mypath.jsp%>/>


    The relative URL cannot contain a protocol name, port number, or domain name.
    The relative URL starts with the "/" (forward slash) character, specifying that
    the URL is taken relative to the context path.


