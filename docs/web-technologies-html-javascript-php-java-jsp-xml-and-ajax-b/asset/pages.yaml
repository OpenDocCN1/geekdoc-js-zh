    In this section, you learn how to perform the following tasks:


    +   - Define DTD for a single element

    - Define DTD for nested elements

    - Define attributes in the DTD

    - Define entities in the DTD

    - Refer to external entities


    Let''s discuss these in detail.


    # Defining DTD for a Single Element


    You can define DTD for a single element, which does not contain any text or other
    element. The following code snippet shows how to define DTD for single element:


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <!--

    <!ELEMENT list (of toys)

    -->

    <!ELEMENT PRODUCTDATA (#PCDATA)>

    ```


    In the preceding code snippet, the <ELEMENT case> and PRODUCT+ expression. This
    indicates that the name of the element (PRODUCTDATA, in our case) the PRODUCTDATA
    element contains one or more elements of type <PRODUCT>. If we do not use the
    plus sign, the DTD definition conveys to the parser that the PRODUCTDATA element
    contains a single PRODUCT element.


    Table 7.1 lists the qualifiers that can be used in DTD definition:


    | Qualifier | Name | Description |

    |---|---|---|

    | ? | Question mark | Applies to zero or one element |

    | * | Asterisk | Applies to zero or more elements |

    | + | Plus sign | Applies to one or more elements |


    You can define DTDs for complex and hierarchical XML documents where the root
    element contains many instances of different types of elements specified in some
    definite order. You can also nest parentheses to group multiple items. For example,
    to include an image for every title element, you need to include the ((image,
    title)+) expression inside parentheses.


    173'
