    In the preceding listing, first we create variable $cars with elements Lio, Spark,
    Scorpio, Safari and then print the elements using the print_r() function.


    # Accessing Array Elements


    PHP allows direct access to array values by specifying the array name and index.


    Listing 5.27: Accessing Array Elements Using the Index Number


    ```

    <?php

    // create an array with some element

    $cars = array(''Lio'', ''Spark'', ''Scorpio'', ''Safari'');

    echo "The second element of the array is:".$cars[1];

    ?>

    ```


    Output:


    ```

    The second element of the array is : Spark

    ```


    In the preceding listing, first create an array $cars with elements Lio, Spark,
    Scorpio, Safari and then access its index. The array index of one (one) has been
    used within the array operators [ ], and the output prints the value of the array
    element with the index, 1.


    # Types of Arrays


    Following are three types of arrays in PHP:


    +   - Numeric Array— Defines an array with a numeric ID key

    - Associative Array— Defines an array where each ID key is associated with a value

    - Multidimensional Array— Defines an array containing one or more arrays


    Now let''s discuss different types of arrays in details.


    # Numeric Arrays


    Numeric arrays use integer values as their index number to identify each element
    of the array. The examples discussed in previous listings are numeric as they
    have integer values as numbers for each item.


    Listing 5.28: Using Numeric Array


    ```

    <?php

    $colors = array(''white'',''black'',''blue'');

    print_r($colors);

    ?>

    ```


    Output:


    ```

    Array( [0] => white [1] => black [2] => blue [3] )

    ```'
