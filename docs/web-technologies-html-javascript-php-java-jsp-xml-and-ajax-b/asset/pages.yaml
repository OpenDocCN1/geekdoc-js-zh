    # The <xsl:import> element is the top-level element used to import the contents
    of one stylesheet into another stylesheet. The importing stylesheet has higher
    priority than the imported stylesheets; it means the document is first transformed
    using the importing stylesheet, but if importing stylesheet is missing the imported
    stylesheet will perform the transformation, if it can. The <xsl:import> element
    is the first element among the top-level elements. If it is present in a stylesheet,
    then it needs to proceed from any other top-level element. The <xsl:import> element
    causes the stylesheet at the location specified in its href attribute to be imported.
    Thus, to import the InsertStylesheet.xml stylesheet could use the <xsl:import>
    like this (assuming that InsertStylesheet.xml was situated in the same directory
    as the importing stylesheet):


    ```

    <xsl:import href="InsertStylesheet.xml"/>

    ```


