    \ Giving a Bean Methods\n\nYou can describe methods of JavaBeans to the framework\
    \ using the MethodDescriptor class. The following is the inheritance diagram of\
    \ this class:\n\n![](img/ff578e59567ce41d5431f36224872e10_230_0.png)\n\nTable\
    \ 8.1 describes the constructors of the MethodDescriptor\n\n| Constructor | Description\
    \ |\n| --- | --- |\n| MethodDescriptor(Method method) | Constructs a method descriptor.\
    \ |\n| MethodDescriptor(Method method, ParameterDescriptor[]) | Constructs a method\
    \ descriptor from a method, providing descriptive information for each of the\
    \ method's parameters. |\n\nTable 8.2 describes the methods of the MethodDescriptor\
    \ class:\n\n| Method | Description |\n| --- | --- |\n| getMethod() | Returns the\
    \ method that this method descriptor encapsulates. |\n| ParameterDescriptor[]getParameterDescriptors()\
    \ | Returns the parameter descriptor for each of the parameters of this method\
    \ descriptor's methods. |\n\nMany beans, however, do not use the MethodDescriptor\
    \ objects, because any public method is accessible from other beans. Let's consider\
