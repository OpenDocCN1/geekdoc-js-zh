    Let''s now explore Structured Query Language (SQL) statements used to manipulate
    data in a database.


    # Working with SQL Statements


    SQL is the most used query language to manipulate data in a database. SQL statements
    are categorized as follows:


    +   - Data Definition Language (DDL): Defines the structure of a database and
    its tables. These statements are used to create, delete, and modify tables.

    - Data Manipulation (DML): Allows you to alter and extract data from a database
    table. These statements are used to add, delete, and retrieve from a database,
    and join tables using common fields.

    - Data Control Language (DCL): Specifies access levels and security privileges
    for a database. These statements allow you to grant or deny user privileges, assign
    roles, change passwords, view permissions, and create sets of rules to protect
    access to data.


    Table 6.2: Syntax of Commonly Used SQL Statements


    | SQL Statement | Type of SQL Statement | Action |

    |---|---|---|n| CREATE DATABASE database_name | DDL | Creates a new database |


