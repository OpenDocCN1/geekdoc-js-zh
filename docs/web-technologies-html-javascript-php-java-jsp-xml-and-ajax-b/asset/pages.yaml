  md: "Chapter 7\n\n# The <xsl:include> Element\n\nThis element is a top level element,\
    \ i.e. that comes in the starting of XML stylesheets, which is used for including\
    \ the contents of one stylesheet within another. The <xsl:include> element has\
    \ only one attribute, which is a required attribute. However, if we want to include\
    \ a module called Included then we can do so by using the following code, provided\
    \ the ModuleToBeIncluded.xsl is in the same directory as the stylesheet within\
    \ which the <xsl:include> element exists:\n\n```\n<xsl:include href=\"module.xsl\"\
    />\n```\n\nThe difference between <xsl:import> and <xsl:include> is that, with\
    \ <xsl:include>, the semantics of the included stylesheets are not changed by\
    \ the process, whereas an imported module will be wholly or partially overridden\
    \ by similarly named templates, if such templates are present.\n\nSyntax: <xsl:include>\
    \ is as follows:\n\n```\n<xsl:include href=\"URI\"/>\n```\n\nAttributes\n\nTable\
    \ 7.11 lists the attributes used by: <xsl:include>\n\n| Table 7.11: Attributes\
    \ of <xsl:include> |\n| Name | Value | Meaning |\n| href | URI | It specifies\
    \ the URI of the included stylesheet |\n\n# The <xsl:element> Element\n\nThis\
    \ element is used to create an element node. The name of the element is created\
    \ by its name and namespace attributes. The name attribute gives the qualified\
    \ name for the element and the namespace attribute gives the URI for the element.\
    \ The purpose of the <xsl:element> element is to cause an Element node in the\
    \ result tree.\n\nThere are several techniques available, which can be used to\
    \ add attributes to such a new element. For example, the use-attribute-sets attribute\
    \ of the <xsl:element> element itself can be used for this purpose. Alternatively,\
    \ you can use the <xsl:attribute>, <xsl:copy>, or an <xsl:copy-of> of element\
    \ to add an attribute to a new Element node.\n\nSyntax: <xsl:element> is as follows:\n\
    \n```\n<xsl:element name=\"name\" namespace=\"URI\" use-attribute-sets=\"namelist\"\
    >\n  <!-- Content:template -->\n</xsl:element>\n```\n\nAttributes\n\nTable 7.12\
    \ lists the attributes used by: <xsl:element> element:\n\n| Table 7.12: Attributes\
    \ of <xsl:element> |\n| Name | Value | Meaning |\n| name (mandatory) | Name |\
    \ It is the name of the element to be generated |\n| namespace (optional) | URI\
    \ of namespace | It is the namespace URI of the generated element |\n\n190"
  merge: -1
