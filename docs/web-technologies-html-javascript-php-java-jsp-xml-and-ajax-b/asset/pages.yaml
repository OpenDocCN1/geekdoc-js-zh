  md: "# Working with XML\n\nAfter discussing the DOM APIs for XML parsing, let's\
    \ move on to other APIs used for parsing XML documents, i.e. is SAX.\n\n# Extensible\
    \ Stylesheet Language Transformation (XSLT)\n\nXSLT stands for Extensible Stylesheet\
    \ Language Transformations and it is used for transforming the structure and content\
    \ of XML document into the required output. XSLT processors parse the input XML\
    \ document, as well as the XSLT stylesheet, and process the instructions found\
    \ in the XSLT, using the elements from the input document. During the processing\
    \ of the XSLT instructions, a transformed output is created. XSLT instructions\
    \ are in form of XML elements, and use XML attributes to access and process the\
    \ content of the elements in the XML input.\n\nThe main purpose of using XSLT\
    \ is to convert XML data into human readable format. It is that XSLT is used for\
    \ displaying data in other formats, such as HTML, PDF, etc. The XSLT used for\
    \ transforming an into the required outputs. These steps are as follows:\n\n+\
    \   - Data is converted from the structure of an XML document to the desired output\
    \ structure.\n\n+   - The new structure is displayed in the required format, such\
    \ as HTML, PDF, etc.\n\nXSLT is rarely used without a reference to XPath. XPath\
    \ is a separate recommendation from the W3C that uses a simple path to address\
    \ parts of an XML document. Although XPath is used by other W3C recommendations,\
    \ there is hardly a case for XSLT that does not involve XPath. Generally speaking,\
    \ XSLT provides a series of operations and translators, while XPath paths provide\
    \ precision of selection and addressing.\n\nThe XSLT APIs for Java are defined\
    \ in the packages listed in Table 7.5:\n\n| Table 7.5: Packages of the XSLT API\
    \ |\n| Package | Description |\n| javax.xml.transform | It defines the TransformerFactory\
    \ and Transformer classes, which you may use to get an object for transformations.\
    \ After creating a transformer object, you invoke its transform() method, passing\
    \ an input (source) and output (result) a parameter |\n| javax.xml.transform.dom\
    \ | These are classes to create input (source) and output (result) objects from\
    \ a DOM |\n| javax.xml.transform.sax | These are classes to create input (source)\
    \ objects from a SAX parser and output (result) objects from a SAX event handler\
    \ |\n| javax.xml.transform.stream | These are classes to create input (source)\
    \ and output (result) objects from an I/O stream |\n\nLet's get ready to look\
    \ at an example of using XSLT to transform a very simple XML document. The code\
    \ for this is given in Listing 7.4:\n\n# Listing 7.4: product.xml\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?>\n<xsl-stylesheet type=\"text/xml\" href=\"\
    product.xsl\"?>\n<PRODUCTDATA>\n  <PRODID id=\"P001\">/</PRODID>\n  <PRODUCTNAME>Barbie\
    \ Doll</PRODUCTNAME>\n</PRODUCTDATA>\n```\n\n181"
