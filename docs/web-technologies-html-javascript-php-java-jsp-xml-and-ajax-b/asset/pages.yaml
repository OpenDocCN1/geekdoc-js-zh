  md: '# Chapter 4


    In every programming or scripting language, by default, the program executes in
    a sequential order. However, you can change the flow of the program by using conditional
    and looping statements. These statements are used when you want to specify some
    conditions or parameters in the program. The program executes only if the specified
    conditions are fulfilled. You can use the conditional and looping statements in
    the following conditions:


    +   - Specified condition or value is true

    - Specified condition or value is not true

    - Execute a program or block of code repeatedly until the condition is fulfilled

