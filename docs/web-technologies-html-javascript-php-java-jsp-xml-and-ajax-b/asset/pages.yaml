    and 64kb. |

    | autoFlush | Specifies if the output has to be flushed automatically when the
    buffer is. If this attribute is set to true, it automatically flushes the buffer
    as soon as the buffer is. If this attribute is set to false, an exception is raised
    when buffer overflows. The default value of this attribute is true. |'
