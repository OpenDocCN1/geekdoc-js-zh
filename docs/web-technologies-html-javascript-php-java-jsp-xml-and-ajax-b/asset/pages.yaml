    # Multiple Styles


    Multiple styles can be defined by the different methods to implement CSS. For
    this reason, the use of several external style results in cascading the styles,
    which is a combination of styles for various HTML elements. Multiple styles affect
    the same element, only the last one is used. You can link the external sheets
    to the document as follows:


    ```

    <link rel="stylesheet" type="text/css" href="style1.css">

    <link rel="stylesheet" type="text/css" href="style2.css">

    <link rel="stylesheet" type="text/css" href="style3.css">

    ```


    If multiple conflicting styles are found in the external sheets, the CSS recommendations
    allow users to select from several alternative style sheets using the rel attribute
    of the <style> tag, which is combined with the TITLE attribute to select appropriate
    name.


    ```

    <link rel="alternate stylesheet" type="text/css" href="style1.css">

    <title>style1</title>

    <link rel="alternate stylesheet" type="text/css" href="style2.css">

    <title>style2</title>

    <link rel="stylesheet" type="text/css" href="style2.css">

    ```


    Multiple styles are included in a page by using various inclusion methods. However,
    the style closest to the content is applied when some conflict appears among styles.


    Create a web page, named MultipleStyles.html to understand how multiple styles
    work in an HTML document. Listing 1.34 shows the code of the MultipleStyles.html
    page:


    Listing 1.34: Multiple Styles


    ```

    <html>

    <head>

    <title>External Style Sheets</title>

    <link rel="stylesheet" type="text/css" href="Style.css">

    <link rel="stylesheet" type="text/css" href="style1.css">

    <link rel="stylesheet" type="text/css" href="style2.css">

    </head>

    ```'
