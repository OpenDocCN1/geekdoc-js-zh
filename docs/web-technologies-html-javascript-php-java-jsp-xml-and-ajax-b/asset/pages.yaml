  md: '# Chapter 11


    The <jsp:setProperty> tag contains various attributes, as such as:


    +   - name

    - property

    - value

    - param


    Let us now discuss these attributes in detail.


    # name


    The name attribute takes the name of the existing bean as a reference to invoke
    <jsp:setProperty> to set the setter method. This attribute must match the value
    of the id attribute of <jsp:bean> to set the properties of the bean. Consequently,
    the <jsp:bean> tag must be declared before the <jsp:setProperty> tag in a JSP
    page.


    # property


    The property attribute of the <jsp:setProperty> tag takes the property name that
    has to be set and specifies the setter method by. You can use "* with the value
    of this attribute; it matches all the properties of a bean with the request parameter
    names. However, if you want to match any specific property of bean, you need to
    specify the value of the property attribute with the property name rather than
    using "*. Following is the syntax to use this attribute with " and with specific
    property name:


    +   * Syntax to use property attribute with "*


    ```

    <jsp:setProperty name="reference variable" property="property" />

    ```


    +   * Syntax to use property attribute with specific value


    ```

    <jsp:setProperty name="reference variable" property="property name" />

    ```


    Remember, when you use "* with the property attribute, the value and param attributes
    are not applicable with this tag. If you specify a specific property name for
    this attribute, the value and param attributes are applicable.


    The values of the request parameters sent from the client to the server are always
    of type String. These values will be converted into the property values when stored
    in the bean. If a property has a PropertyEditor class, as indicated in the JavaBeans
    specification, the setAsText(String) method is used to convert the request parameter
    from String to a compatible data type. If the setAsText(String) fails to convert
    the request, it throws an IllegalArgumentException.


    # value


    The value attribute has to be set to the specified property bean. This accepts
    the value as the String type or an expression that is evaluated at runtime. If
    the value is not of the String type, the value is converted to a compatible data
    type


    The syntax to use the <jsp:setProperty> tag with the value attribute is as follows:


    ```

    <jsp:setProperty name="reference variable" property="property name" value="* Property
    value as expression %> />

    ```


    or


    ```

    <jsp:setProperty name="reference variable" property="property name" value="" Property
    value as expression %> />

    ```


    # 302'
