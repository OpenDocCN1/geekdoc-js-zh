    as the default value.


    # Using RowSetObject to form a JOIN


    To form the basis of the JOIN relation, you must first add the RowSet object to
    the JoinRowSet object. However, when the RowSet object is created, it is empty.
    Then you define the column in which each RowSet object is added to the RowSet
    object. The RowSet object contains a match column; the value in each match column
    should be compared to the values in the other match column. A match column can
    be set using the following methods:


    +   - Matching a column using the setMatchColumn() method of the Joinable interface
    before a RowSet object is added to a RowSet object. The RowSet object must implement
    the Joinable interface to use this RowSet object. After setting the match column
    value, the value can be reset using the setMatchColumn method at any time.


    +   - Adding a column name or number, or an array of column names or numbers by
    invoking the addRow() method. A match column parameter is passed as an argument
    in the five addRow() methods.


