  md: "# JavaScript Programming\n\nIn JavaScript, you can use any of the three loops-while,\
    \ do..while, and for loop. The condition is placed either at the start or at the\
    \ end of the loop depending on the type of loop.\nLet's learn about the three\
    \ loops by one starting with the while loop.\n\n# Using the while Loop\n\nYou\
    \ can use the while loop when you want to check the condition at the start of\
    \ the loop. The group of statements is to be executed after the condition. This\
    \ implies that if the condition is false in the first iteration itself, the group\
    \ of statements in the while loop is never executed. On the other hand, the group\
    \ of statements keeps executing until the condition becomes false. Therefore,\
    \ in a while loop, there can be zero or more iterations.\n\nThe syntax for while\
    \ loop is:\n\n```\nwhile(condition)\n{\n  statement1\n}\n```\n\nIn the preceding\
    \ syntax, while is a JavaScript keyword. The condition for the while loop is specified\
    \ in parentheses and the group of statements (statement1) is specified within\
    \ the curly braces.\nLet's create a Web page, whileLoop.html to understand the\
    \ working of the while loop. Listing 225 shows the code of the whileLoop.html\
    \ page.\n\n# Listing 225: Using the while Loop in a Script\n\n```\n<html>\n<head>\n\
    \  <title>JavaScriptExample</title>\n  <body bgcolor=\"pink\">\n  <script type=\"\
    text/javascript\" language=\"javascript\">\nvar totalDistance=0,fare=0;\n  while(totalDistance<=10)\n\
    \  {\n    fare=fare+5;\n    totalDistance=totalDistance+2;\n    document.write(\"\
    Rs: \"+fare+\"<br>\");\n  }\n  </script>\n  </body>\n</head>\n</html>\n```\n\n\
    In Listing 225, the while loop has a condition,totalDistance<=10, that checks\
    \ whether the value of the variable totalDistance is less than or equal to 10.\
    \ In the first iteration, the group of statements specified inside the while loop\
    \ is executed, and the fare is incremented by 5 and the value of totalDistance\
    \ is incremented by 2. The condition of the while loop is evaluated again, as\
    \ a result of which the values of fare and totalDistance are incremented again.\
    \ In that way, the while loop executes six times. At the end of the sixth iteration,\
    \ the totalDistance variable is equal to 12 and the Thank You! message is displayed.\
    \ As a result, it becomes false. The loop is exited and the Thank You! message\
    \ is displayed."
