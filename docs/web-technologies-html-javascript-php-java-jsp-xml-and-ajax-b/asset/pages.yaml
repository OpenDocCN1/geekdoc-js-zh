  md: '# Chapter 13


    Quick Revise


    Q1. AJAX stands for ____________________________


    Ans. Asynchronous JavaScript and XML


    Q2. SOAP stands for __________________________________


    Ans. Simple Object Access Protocol


    Q3. UDDI stands for ___________________________________


    Ans. Universal Description Discovery and Integration


    Q4. Define AJAX.


    Ans. Asynchronous JavaScript and XML (AJAX) is a new technique of web programming.
    Its primary components are JavaScript and XML. AJAX is a technique which describes
    how other technologies, JavaScript, DOM (Document Object Model), and XML can be
    used together to create interactive Web applications.


    Q5. Explain the AJAX Web model.


    Ans. The AJAX application initiates the start-to-stop-start nature or the click,
    wait, and refresh criteria of the client-server interaction. Instead of loading
    the beginning of the page during the web browsing, the browser loads the ASP page,
    sends requests using a JavaScript function. This JavaScript code makes a request
    to the server, and the server returns that includes the data that required is
    provided by the server as the response, and the style or presentation of that
    data with the help of the markup language. The page does not change. Only parts
    of the page that need to change are updated. The JavaScript dynamically updates
    the page without redrawing everything. Nothing has changed; it still responds
    to each request, to the Web server,


    Q6. How the AJAX communicates with the server?


    Ans. When the AJAX engine receives something from the server, retrieving new data
    or loading, additional data, it then uses the asynchronous interaction with the
    server, using JavaScript and XMLHttpRequest object for asynchronous data exchange.
    The engine with the server does not interrupt the user''s interaction with the
    application. In this way, the asynchronous communication is done with help of
    the AJAX engine.


    Q7. PHP is a server-side scripting language embedded in html. (True/False)


    Ans. True


    Q8. JMRP stands for


    Ans. Java Remote Method Protocol.


    Q9. List the rules for SOAP message.


    Ans. It should be written in XML.


    +   * It should use the default namespace for the envelope.

    * It should not have a DTD reference.

    * It should not have XML processing commands.


    Q10. Explain the elements of WSDL.


    Ans. WSDL document consists of the following elements:


    +   * Definition – WSDL document''s definitions are root elements, which consist
    of namespace definitions. WSDL specification recommends the use of XML schema
    definitions. You can recognize data types of each element during encoding an XML
    document in this standard.


