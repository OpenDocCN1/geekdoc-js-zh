  md: '# Chapter 13


    Web services present a model by tasks of e-business processes were distributed
    widely through Internet. This model is not restricted to a specific business model.
    Web services are not graphical interfaces, but can be used to automate user interaction.
    They describe their inputs and outputs in a manner that the second party can predict
    its function, how to call it, and the expected result. Web services are reusable
    software components and the developers reuse basic elements of code made by them.
    There is a loose connection between software components, which allow manageable
    reconfiguration.


    An often-cited example of a Web service is that of stock service, in which the
    request asks for the current price of stock, and the response gives the price.
    This is one of the simplest forms of a Web service. Web services and customers
    are nothing unlike typical businesses, making services predominantly business.
    B2B business can be the provider of Web service, and at the same time the consumer
    of other Web services. For example, a wholesale distributor of spices could be
    in the customer role when he uses a Web service to check the availability of vanilla
    beans and at the same time, in the provider role, where he supplies customers
    with different vendors'' prices for cattle.


    Another example of Web service is an auction engine, such as eBay''s. This website
    provides successful start for this auction service, businesses or companies require
    to build the auction software from start alternatively send the customers to an
    auction website like eBay. Using Web services, eBay leverage its auction to process
    other tasks and applications for fee. Businesses only need to subscribe to eBay''s
    Web service and provide some lines of code to their applications to use Web service.
    Other uses of Web services are payroll management, credit scoring, shipping, business
    intelligence and marketing services, etc.


    # SOAP


    Simple Object Access Protocol (SOAP) is a protocol which allows applications to
    exchange information. Unlike the language or platform specific, such as Internet-ORB
    Protocol (IIOP) or Java Remote Method Protocol (JRMP), SOAP is not a language
    or platform specific protocol. It allows communication between applications running
    on different platforms. SOAP, unlike IIOP and HTTP which are binary protocols,
    is a text-based protocol and uses XML-based to allow any data exchange information
    over HTTP. SOAP is based on vendor agnostic technology, namely XML, and is shared
    by all platforms. It uses the Internet application layer protocol as transport
    protocol and is used to access Web service.


    # SOAP Message


    SOAP message is a well structured document. It is needed for interoperable machine
    communication. It inherits all features of XML, like platform independence, human
    readability, and documenting format, for etc. SOAP messages transform the way
    applications communicate over Web with the notion of Web services. The default
    namespace for SOAP envelope is http://schemas.xmlsoap.org/envelope/; Namespace
    can be used with these elements. SOAP namespaces take care of SOAP message''s
    syntax details. Following are some of the rules that a SOAP message has to abide
    by:


    +   It should be in XML


    +   It should use the default namespace for the envelope.


    +   It should not have a DTD reference.


    +   It should not have XML processing commands.


    # SOAP Message Elements


    SOAP elements are used to contain different types of information about a SOAP
    message and also make it well structured. Before explaining the SOAP message elements,
    let''s have a look at the structure of SOAP message.


    # 382'
