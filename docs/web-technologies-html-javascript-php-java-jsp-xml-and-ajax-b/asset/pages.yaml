  md: "# Chapter 4\n\n# Exit Statement\n\nThe exit statement is used when you want\
    \ to stop a program from running. It can block infinite looping statements in\
    \ the program. The syntax for exit statement is as follows:\n\n```\nfor (condition)\n\
    {\nif (condition)\n{\n    exit;\n    statement;\n    statement;\n}\n```\n\nListing\
    \ 4.18 shows an example to understand the script of the exit statement\n\nListing\
    \ 4.18: Showing the Script of the exit statement\n\n```\n<?php\nfor ($i = 0; $i\
    \ < 5; ++$i) {\n    if ($i == 2) {\n        exit;\n        echo \"The number is:\
    \ \" . $i;\n        echo \"<br>\";\n    }\n}\necho \" This is exit statement\"\
    ;\n?>\n```\n\nOutput:\nThe number is: 0\nThe number is: 1\n\nIn Listing 4.18,\
    \ the 0 is assigned to the $i variable. The loop iterates as long as the value\
    \ of the $i variable remains less than or equal to 5. After each iteration, the\
    \ value of the $i variable is incremented by 1.\nIn this listing, the for loop\
    \ consists of the if condition, which contains an exit statement. The execution\
    \ of the script terminates and the message is displayed as the output, if the\
    \ condition is true.\n\n# Summary\n\nIn this chapter, you have learned about the\
    \ conditional and looping statements that are used to control the program flow.\
    \ You also learned if-else statements and the process of combining conditional\
    \ statements. In addition, you learned about break, continue, and exit statements.\n\
    \n120"
