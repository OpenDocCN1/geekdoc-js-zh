  md: "# Chapter 12\n\nIn the preceding snippet, Driver.connect() method accepts the\
    \ two parameters, namely: url and props. The url parameter represents the database;\
    \ the props represents the connection properties, such as the database user name\
    \ and password, which are required to establish a session to database. If the\
    \ session to the database is established successfully, it returns a Connection\
    \ object representing the session established.\n\nApart from the preceding approach,\
    \ you can use a factory class, java.sql.DriverManager to establish a connection.\n\
    \nPerform the following steps to obtain a connection using the DriverManager:\n\
    \n# Step 1: Registering a Driver with DriverManager\n\nRegistering a driver with\
    \ DriverManager makes the registered driver available to the DriverManager, so\
    \ that in first let i, the DriverManager can use it to establish a connection.\
    \ When a driver is registered with the DriverManager, it returns a DriverInfo\
    \ object to maintain the driver details and stores it into class variable of the\
    \ java.util.Vector.\n\nWe can register the driver using any of the following approaches:\n\
    \n+   a. Invoke the registerDriver() method, which is a static method declared\
    \ in the DriverManager class. The java.sql.Driver type of object passed as an\
    \ argument to the registerDriver() method. The following snippet shows how to\
    \ register the driver with DriverManager:\n\\```java\nDriverManager.registerDriver(new\
    \ sun.jdbc.odbc.JdbcDriver());\n```\n\n+   b. Use the Class.forName<class name>,\
    \ which is used to explicitly load the driver. According to the JDBC specifications,\
    \ every JDBC driver implementation should contain a static block, which should\
    \ be invoked by the registerDriver method passing an object of the driver implementation\
    \ as an argument. The following code shows how to register the Driver object with\
    \ DriverManager using Class.forName:\n```java\nClass.forName(\"sun.jdbc.odbc.JdbcDriver\"\
    );\npublic class JdbcDriver extends {\n    static { DriverManager.registerDriver(new\
    \ JdbcDriver()); }\n}\n```\n\nIn the preceding code snippet, the result is to\
    \ register the driver method.\n\n> NOTE\nIt is recommended to set the method on\
    \ the Class object, which is returned by the Class.forName method as some JVMs\
    \ do not call the static initializers until instance of the class is created.\n\
    \n+   c. Set the property on the System, where the property name is jdbc drivers.\
    \ The value of the System property can be mapped to one or more driver implementation\
    \ class, where ':' character is used as a delimiter. The following snippet shows\
    \ how to register the driver with the DriverManager class:\n```java\nSystem.setProperty(\"\
    jdbc.drivers\",\"sun.jdbc.odbc.JdbcDriver\");\nusing the above method in our application,\
    \ or while executing the application setting the -D option of java command, example:\n\
    ```bash\njava -Djdbc.drivers=sun.jdbc.odbc.JdbcDriver\n```\n\nNote that in JDBC\
    \ 4.0 specification, the DriverManager.getConnection() method has been enhanced\
    \ to support the Java Standard Edition Service Provider mechanism. With this feature,\
    \ the DriverManager can locate and load the JDBC driver described in the META-INF/services/java.sql.Driver\
    \ file. Here, while working with the driver you do not need to perform this step,\
    \ unless explicitly registering a driver with the DriverManager.\n\n# 310"
