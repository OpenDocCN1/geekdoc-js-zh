    \nFigure 2.23: Using the if Statement\n\nIn Figure 2.23, you can observe that\
    \ the if statement checks the expression and returns the value 45 as an odd number.\n\
    \n# Using the if...else Statement\n\nAs you know that the if statement allows\
    \ you to execute a set of statements only when a particular condition is true.\
    \ However, if you want to execute another set of statements when the condition\
    \ is false, then you can use the if...else statement.\n\nThe syntax for the if...else\
    \ statement is:\n\n```\nif (condition) {\n  statement1\n} else {\n  statement2\n\
    }\n```\n\nIn the preceding syntax, if and else are keywords that signify the if...else\
    \ statement. The condition of the if...else statement is also enclosed within\
    \ parentheses. If the condition is true, the group of statements, represented\
    \ by statement1, enclosed within the first curly braces is executed. If the condition\
    \ is false, then execution of statement1 is skipped and is passed on to the else\
    \ clause. The group of statements, represented by statement2, of the else clause\
    \ is executed."
