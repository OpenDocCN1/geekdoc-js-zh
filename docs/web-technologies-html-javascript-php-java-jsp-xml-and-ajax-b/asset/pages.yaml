    # The Fault element


    An error message from SOAP message is present inside a Fault element. A Fault
    element can occur once in a SOAP message and, if present, it must be a child element
    of body element. Table 13.5 lists the sub-elements of the Fault:


    Table 13.5: Sub-elements of Fault Element


    | Element | Description |

    | --- | --- |

    | `<code>` | It provides a code for identifying the fault. It is a mandatory element
    |

    | ` <faultstring>` | It provides a human-readable description of the fault. It
    is also a mandatory element |

    | ` <faultactor>` | It provides an indication of the system that was responsible
    for the fault |

    | ` <detail>` | It provides information related to faults that occur due to errors
    associated with the Body element of the request message |


    Table 13.6 lists the values that the `<faultcode>` element takes with their respective
    causes:


    | Fault code value | Cause |

    | --- | --- |

    | VersionMismatch | Invalid namespace is used |

    | MustUnderstand | Immediate child element is not understandable |

    | Client | Incorrect information in message |

    | Server | Internal error |


