  md: '# Chapter 8


    JavaBeans are Sun''s answer to Microsoft''s ActiveX controls. JavaBeans are reusable
    components written in Java that you can use in a variety of programming environments,
    including third-party programming environments. In fact, they work like ActiveX
    controls, exposing properties, methods, and events to other code components. Using
    beans, you can create your own Java ''controls,'' such as buttons that color when
    you click them or stock tickers that download information from the internet.


    JavaBeans is designed to be used in application builder tools, which are environments
    that allow you to configure beans. One such tool is the beanbox, which you can
    download from java.com using the Sun Bean Development Kit (BDK). We use the BDK
    in this chapter to construct and use reusable components, which can be used in
    creating applications.


    JavaBeans is very important for developers who want to build complex systems from
    software components. These components may be provided by one or more vendors.
    JavaBeans defines an architecture that specifies how these beans can operate.


    If you want to understand the value of Beans in a better way, consider the following
    example: a hardware designer performs a very important function—bringing variety
    of components together to construct a system. The examples of simple components
    are resistors, capacitors, and inductors. More advanced designers use integrated
    circuits. All of these different parts can be reused. It is not necessary or possible
    to rebuild these capabilities each time a new system is needed. Moreover, in different
    types of circuits the same pieces can be used. This is possible only because the
    behavior of these components is understood and documented.


    The software industry has also seen the benefits of reusability and interoperability
    of a component-based approach. Component architecture allows programs to be assembled
    from software blocks, provided by different vendors to realize these benefits.
    It is a must for a designer to select a component, to understand about it and
    how to make it. Then, it is easy to incorporate this functionality into every
    code. Fortunately, such architecture is provided by JavaBeans.


    # Introducing JavaBeans


    A JavaBean is a software component that has been designed for reusability in different
    environments. Regarding the capability of a bean there is no restriction. It can
    perform different types of functions, such as obtaining an inventory value, forecasting
    the performance of a stock portfolio. A Bean may be designed to work autonomously
    on a user''s workstation or work in corporation with a set of other distributed
    components. An example of a Bean is a stock ticker that generates a set of data
    points. However, it is necessary that a Bean provides a real-time price information
    from a stock or commodities exchange would work in corporation with other distributed
    software to obtain its data. The following are the key concepts of a Bean:


    +   First, the tool discovers a Bean''s features (that is, its properties, methods,
    and events) by a process known as introspection support in the following ways:

    * It provides support by adhering to specific rules, known as design patterns,
    at the time when naming Bean features. The Introspector examines Beans for these
    design patterns to discover Bean features. This class relies on the reflection
    API.

    * It provides us by exposing property, method, and event information with a related
    Bean Information class, which implements the BeanInfo interface. Again, a Bean
    class explicitly lists the Bean features that are exposed to application builder
    tools.

    * Properties are the Bean and behavior characteristics, which can be changed at
    design time.

    Beans expose properties so that they can be customized at design time. In this
    case, customization is supported in two ways: using property editors, by using
    more sophisticated Bean customizers.'
