  md: '# Introduction


    The tables are placed just below its reference in the chapters with Table <no>,
    as shown below:


    | Table 9.3: HTTP Headers and Their Values |

    | Header field | Header value |

    | Age | Represents a positive integer representing the estimated time since the
    response was generated from the server. |

    | Content-Length | Indicates the size of the message body, in decimal number of
    octets (8-bit bytes), which is sent to the recipient. |

    | Content-Type | Represents the MIME type corresponding to the content of the
    HTTP response. A browser to determine if the content should be rendered internally
    or launched for rendering by an external application often uses this value. |

    | Date | Represents the date and time when the message originated. |

    | Location | Specifies the location of a resource, as the absolute URL Some HTTP
    response codes redirect to a new resource. |

    | Pragma | Includes implementation-specific directives that may apply to any no-cache
    request chain. The most commonly used value is no-cache, indicating a resource
    should not be cached. |

    | Retry-After | Indicates how long the service is expected to be unavailable to
    the requesting client, if it is used with 503 (Service Unavailable). The value
    of this field can be a date or an integer number of seconds (in decimals) after
    the time of the response. |

    | Server | Represents a String for the information about the server generating
    a response. |


