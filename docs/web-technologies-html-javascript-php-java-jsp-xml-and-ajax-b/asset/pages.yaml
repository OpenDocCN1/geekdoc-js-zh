    * These objects help in handling the HTML parameters, forward a request to a Web
    component, and handle the content of a component, log data through the JSP container,
    control the output stream, and handle exceptions very easily.


    **Q2.** Request objects are passed as parameters to the `_jspService()` method
    when a client request is made.


    **Ans.** True


    **Q3.** The implicit object provides access to the servlet output stream. (True/False)


    **Ans.** The object represents the context of the current JSP page.


    **Q4.** The `pageContext` object helps access session data and is of the HttpSession
    type.


    **Ans.** session


    **Q5.** The exception object is of the `java.lang.Throwable` type and is only
    available for those JSP pages that act as the error handlers for other pages.
    (True/False)


    **Ans.** True


    **Q6.** Explain the page object.


    **Ans.** The page object refers to the servlet of a JSP page processing the current
    request and belongs to the `java.lang.Object` type. It also works as an instance
    of the generated servlet in a JSP page. Since it is a variable of type Object,
    it is rarely used in a document. It cannot be used directly to call the servlet
    methods.


    **Q7.** Explain the request object.


    **Ans.** The implicit object provides access to the servlet output stream. It
    is a subtype of `javax.servlet.JspWriter`. The object can be used directly in
    JSP scripts to display the text data on the browser, since JSP''s expressions
    are automatically placed in the output stream. In simple terms, the object is
    used to write the text data.


    **Q8.** Explain the response object.


    **Ans.** Request objects are passed as parameters to the `_jspService()` method
    when a client request is made. A request object is of the `javax.servlet.http.HttpServletRequest`
    type. You can use the request objects in a JSP page similar to using these servlets.


    **Q9.** Explain the response object.


    **Ans.** The response object is used to carry the response of a client request
    after the `_jspService()` method is executed. The response object is of the `javax.servlet.http.HttpServletResponse`
    type.'
