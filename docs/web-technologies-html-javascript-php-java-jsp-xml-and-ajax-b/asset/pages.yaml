  md: "# Advantages of JSP Servlets\n\nJSP provides a server-side scripting support\
    \ compared as Servlets. Java developers can create Servlets easily; however, Web\
    \ page designers find it difficult to handle the Java code. A JSP page can have\
    \ HTML code with certain Java code embedded in it. Hence, creating a dynamic content\
    \ is easy, as the basic designing of the page is done using the HTML code. We\
    \ can use JSP to add dynamic content to the page. The Java code is embedded using\
    \ different servlets, which we have discussed in Chapter II.\n\nThe following\
    \ are the advantages of using Servlets:\n\n+   - The Web page content can be placed\
    \ on the page in a symmetrical way. These static pages are designed by Web designers\
    \ using HTML code. Designing static pages using Servlets requires a good knowledge\
    \ of Java; however, Web designers may not be comfortable with Java programming.\
    \ In addition, while using Servlets, you have to enclose the HTML code in the\
    \ output( ) method, which makes IDE support for generating the HTML content, using\
    \ JSP is easier than using Servlets for HTML output.\n\n+   - You need a Servlet\
    \ for every single change in its source code; however, for JSP nothing is required,\
    \ as it is automatically handled by the Web Container for any update in the code.\n\
    \n+   - Servlets cannot be accessed directly; they must be first in the web.xml\
    \ file; whereas, a JSP page can be accessed directly as a simple HttpServlet.\n\
    \n+   - Both, Servlets and JSP are server-side components used to generate dynamic\
    \ HTML pages; however, JSP is preferred over Servlet as it is developed using\
    \ a simple HTML template and automatically handled by the JSP container.\n\nThese\
    \ advantages of JSP make it a popular component to use in the presentation layer\
    \ of any application. To understand better about the advantage of using JSP over\
    \ Servlets, let's consider an example. Let's assume that a user needs a Web page\
    \ with some dynamic content (for example, current date and time). The required\
    \ HTML code for this page is shown in Listing 10.1:\n\nListing 10.1: index.html\n\
    \n```\n<html>\n<head>\n  <title>First JSP Page</title>\n</head>\n<body>\n  //The\
    \ current date and time dynamically inserted.\n  <br>Hello world!</br>\n</body>\n\
    </html>\n```\n\nYou can create a Servlet for this Web page, similar to other Servlet\
    \ created in previous chapter. The code for this Servlet is shown in Listing 10.2:\n\
    \nListing 10.2: FirstServlet.java\n\n```\nimport java.io.*;\nimport java.servlet.*;\n\
    import java.servlet.http.*;\nimport java.util.*;\npublic class FirstServlet extends\
    \ HttpServlet {\n  public void doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n  throws IOException, ServletException {\n    response.setContentType(\"\
    text/html\");\n    PrintWriter out = response.getWriter();\n```"
