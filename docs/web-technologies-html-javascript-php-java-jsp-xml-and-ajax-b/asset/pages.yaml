  md: '# AJAX A New Approach


    Instead of loading the web page, as shown at the beginning of the session, the
    browser loads the ASP engine, written in JavaScript. The web page sends its requests
    in Figure 13.1, a JavaScript function. This JavaScript makes a request to the
    server. The server-response consists of data and not the presentation, which implies
    that the data required by the page is provided by the server as the response,
    and the effect is presented on data with the help of the markup language. Only
    the page that needs to be updated. The JavaScript dynamically updates the web
    page without redrawing it. For the web server, nothing has changed; it still responds
    to each request, just as it before.


    Though JavaScript makes a request to the server, you can still type in forms and
    even click buttons, while the server is still working in the background. Then,
    when the server completes its processing, your code updates just the part of the
    page that has. This means you never have to wait around. That is the power of
    asynchronous requests. AJAX engine, between the user and the application, irrespective
    of the server, does asynchronous communication. This prevents the user from waiting
    for server to complete its processing. AJAX engine takes care of displaying the
    user interface and the interaction with the server on the user''s behalf.


    In traditional web apps, the synchronous mode of communication between the client
    and the server, as shown in the Figure 13.2:


    ![](img/ff578e59567ce41d5431f36224872e10_370_0.png)


    Figure 13.2: Synchronous Mode of Communication


    Since the essence of AJAX is a partial screen update and the asynchronous communication,
    the programming model, shown in the Figure 13.3, is not bound to a specific data
    exchange format or the specific programming language or the specific communication
    mechanism:


    ![](img/ff578e59567ce41d5431f36224872e10_370_1.png)


    Figure 13.3: Displaying Asynchronous Mode of Communication


