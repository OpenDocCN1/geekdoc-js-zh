  md: "# Chapter 4\n\nThe for loop syntax is as follows:\n\n```\nfor (initialization;\
    \ condition; increment/decrement)\n{\n    statement;\n}\n```\n\nThe for statement\
    \ takes three expressions inside its parenthetheses, separated by semi-colons;\
    \ which are as follows:\n\n+   1. The initializing expression is executed. This\
    \ expression usually initializes one or more loop counters, but the syntax allows\
    \ an expression of any complexity.\n\n+   2. The condition expression is evaluated.\
    \ If the value of condition is true, the for loop executes. If the value of condition\
    \ is false, the for loop terminates.\n\n+   3. The update expression increment/decrement\
    \ executes.\nThe statements execute, and control returns to step 2.\n\nListing\
    \ 4.12 shows an example to understand the script of the for loop:\n\n# Listing\
    \ 4.12: Showing the Script of the for Loop\n\n```\n<?php\nfor ($i=1; $i<=5; $i++)\
    \ {\n    echo \"The number is \".$i.\".<br />\";\n}?>\n```\n\nOutput:\nThe number\
    \ is 1\nThe number is 2\nThe number is 3\nThe number is 4\nThe number is 5\n\n\
    In Listing 4.12, the value 1 is assigned to the $i variable. The for loop iterates\
    \ as long as the value of the $i variable is less than or equal to 5. After each\
    \ iteration, the value of the $i variable is incremented by 1. The statement inside\
    \ the loop is executed until the condition is true.\n\n# The for loop\n\nThe foreach\
    \ loop is a variation of for loop and allows you to iterate over elements in an\
    \ array. There are two versions of the foreach loop, which are given in the syntax.\
    \ The foreach loop syntaxes are as:\n\n```\nforeach (array as value)\n{\n    statement;\n\
    }\nforeach (array as key=>value)\n{\n    statement;\n}\n```\n\nListing 4.13 shows\
    \ an example to understand the script of the foreach loop:\n\n# Listing 4.13:\
    \ Showing the Script of the foreach Loop\n\n```\n<?php\n$email=array('yogendra\
    \ gupta','sulabh dixit');?>\n```\n\n116"
