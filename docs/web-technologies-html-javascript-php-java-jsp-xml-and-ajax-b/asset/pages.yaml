    # Accessing a Database from a JSP Page


    JSP allows you to access a database from a JSP page. However, the features of
    the JSP related database are not limited to access; it allows you to create, delete,
    and modify data within the database. The steps to get connected to the database
    are:


    +   1. Declare a connection using the Connection interface

    2. Load the JDBC driver.

    3. Call the getConnection() method, which uses the Uniform Resource Locator (URL)
    to the Relational Database Management System (RDBMS) and the username and password
    of the database.

    4. Verify, if the connection is established using the isClosed() method of the
    Connection interface. This step is optional, recommended to ensure that the connection
    is established before you proceed with performing the Create, Read, Update, and
    Delete (CRUD) operations on the database.


    > NOTE

    To ensure that the database connection is established successfully, ensure you
    place the jar in the library of the Tomcat application directory.


