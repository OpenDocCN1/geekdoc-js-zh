    Data in a database can be organized using various database models, such as relational,
    network, hierarchical, and object oriented models. We explore the relational database
    model next.


    # Exploring Relational Database Model, Records, and Primary Keys


    The relational database is the primary model used for storing and manipulating
    data. A relational database stores data in a tabular format, and contain one or
    more tables. Each table in a relational database is assigned a unique name. The
    tables in a relational database are logically related to each other, which helps
    in manipulating data across the entire database. The relational database model
    was introduced by E.F Codd in 1970.

    A table in a relational database stores data in the form of rows and columns.
    Rows in a table are also known as tuples, and columns are also known as attributes.
    Table 6.1 shows an example of a table Employee_Information.


    | Emp_Id | Emp_Name | Emp_Address | Emp_PhoneNumber |

    |---|---|---||

    | 1001 | David | 149,Severson Rd.Etobiscoke | 00175689235 |

    | 1002 | William | 126,Mississauga Ontario | 001564789237 |

    | 1003 | Jenifer | 15,Markham Ave. Toronto | 001785349358 |

    | 1004 | Joana | 56, Finch Ave. Toronto | 001785463298 |


    Table 6.1: Employee_Information


    In the preceding table, there are four rows and columns. The columns or attributes
    are named as Emp_Id, Emp_Name, Emp_Address, and Emp_PhoneNumber. Each of these
    attributes allows only specific values to be entered as domain. For example, the
    Emp_PhoneNumber can have only numbers and no characters.


    # Understanding Relationships and Foreign Keys


    In the relational database, two or more tables can be linked to each other by
    one or more attributes, called foreign keys. The foreign keys make it possible
    to create relationships between different tables and combine data from multiple
    tables to create more comprehensive result sets. While creating a relationship
    between two or more tables, a primary key of one can be referred to as another
    as the foreign key.'
