  md: '# Chapter 12


    The request flow in Struts 2 Web application framework is shown in Figure 12.17:


    ![](img/ff578e59567ce41d5431f36224872e10_367_0.png)


    As you can see in the figure, Struts 2 processes a request in the following steps:


    +   1. **Request received** – Refers to the step in which the framework matches
    the request received from the user with the configuration file, struts-config.xml,
    to invoke the required interceptors, action class, and result class.

    2. **Pre-processing by Interceptors** – Refers to the step in which the request
    passes through a series of interceptors. These interceptors perform certain tasks,
    such as initialization required to process a request.

    3. **Invoke the Action class method** – Refers to the step in which a new instance
    of an action class is created and the method providing the logic for handling
    the request is invoked. Note that in Struts 2, a method to be invoked by an action
    class is specified in the configuration file.

    4. **Invoke Result class** – Refers to the step in which the **Result** class
    determines the mapped class (in struts.xml) based on the obtained result. Then,
    a new instance of this return class is created and invoked.

    5. **Processing by Interceptors** – Refers to the step in which the response is
    passed through the interceptors in reverse order to perform any clean up or additional
    processing.

    6. **Responding user** – Refers to the step to display the processed response
    to the user by the servlet engine.


