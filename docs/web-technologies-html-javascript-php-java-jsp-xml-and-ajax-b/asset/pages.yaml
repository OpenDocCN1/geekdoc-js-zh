    # Exploring Implicit Objects


    JSP implicit objects are used in a JSP page to make the page dynamic. The dynamic
    content can be created and access Java objects within the scripting elements.
    JSP implicit objects are predefined objects that are accessible to all JSP pages.
    These objects are called implicit because you do not need to instantiate them.
    The JSP container automatically instantiates these objects while the script content
    in the scriptlet and expression tags. JSP standardizes certain object reference
    names, which are available for every JSP page so any version-independent translators
    have to initialize these objects in the _jspService method.


    # Features of Implicit Objects


    The following are features of JSP implicit objects:


    +   - These objects allow developers to access services and resources provided
    by the Web container.

    - These objects are used to generate dynamic content of Web pages.

    - They are termed as implicit, so that you do not have to declare these explicitly;
    JSP container automatically instantiates these instances.


    280'
