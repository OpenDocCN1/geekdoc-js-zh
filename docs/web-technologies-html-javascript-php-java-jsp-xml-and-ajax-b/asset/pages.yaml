    # Introducing Cascading Style Sheets


    Cascading Style Sheets (CSS) or simply style sheets are text files that contain
    one or more rules in the form of property/value pairs to determine how elements
    in a Web page should be displayed. They were developed with the aim to create
    style, look and feel of a Web page but the elements on the Web page are handled
    separately. CSS deals with all the style-related aspects important to create a
    Web page. W3C has developed some specifications (or rules) to create and use style
    sheets. These specifications are called as the Cascading Style Sheet (CSS) specifications.
    The two versions of CSS specifications have been released till now: the first
    version is known as CSS1 and the second as CSS2. After the introduction of CSS,
    HTML elements


