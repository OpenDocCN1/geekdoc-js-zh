  md: '# HTML Programming


    # The <!DOCTYPE> Element


    The <!DOCTYPE> element is the first element in the HTML document, which specifies
    the Document Type Definition (DTD) used by the document. A DTD is a separate file
    containing formal definition of grammar, as supported elements and attributes
    used in markup language. The browser checks the code of the document against the
    rules in the <!DOCTYPE> declaration. The <!DOCTYPE> element does not have a closing
    tag.


    DTD uses the <!DOCTYPE> declaration:


    ```

    <!DOCTYPE HTML "//W3C//DTD HTML 4.01//EN">

    ```


    # The <html> Element


    The <html> element starts an HTML document and it comes after the <!DOCTYPE> element
    in an HTML document. It contains everything an HTML document contains except the
    <html> element. Table 1.1 lists all the attributes of:


    Table 1.1: Attributes of the <html> element

    | Attribute | Description |

    |---|---|

    | class | Represents the class of the element and is used to render the content.
    |

    | dir | Gives the direction to directionally neutral text; you can set this attribute
    to ltr for left to right direction or rtl for right to left direction. |

    | id | Represents unique identifier for the element. |

    | lang | Represents base language used for the element. |

    | version | Represents the version of the language used. This attribute has been
    marked as deprecated. |

    | xmlns | Declares a namespace for custom tags in an HTML document. |


    # The <head> Element


    The <head> element contains general information about the HTML document, such
    as its title, keywords for search engines, and a base address for URLs. Table
    1.2 lists all the attributes of the <head> element:


    Table 1.2: Attributes of the <head> Element

    | Attribute | Description |

    |---|---|

    | class | Represents the class of the element and is used to render the content.
    |

    | dir | Gives the direction to directionally neutral text; you can set this attribute
    to ltr for left to right direction or rtl for right to left direction. |

    | id | Represents unique alphanumeric identifier for the element. |

    | lang | Represents base language used for the element. |

    | profile | Gives the location of one or more white-space separated metadata URLs
    for the current document. |'
  merge: -1
  pgno: 20
