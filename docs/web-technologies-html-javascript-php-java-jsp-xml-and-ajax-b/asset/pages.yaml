  md: "# Chapter 6\n\nIn the client/server model of data processing, a user needs\
    \ to enter relevant data at the client end, which is further submitted to the\
    \ server for processing. The client/server data processing model is also applicable\
    \ in cases of Web sites or Web applications, wherein the data to be processed\
    \ is submitted to the Web server through a graphical user interface (GUI) element,\
    \ called a Web form containing various elements, such as text boxes, radio button,\
    \ checkbox, which allow the user to enter the required information. A Web form\
    \ generally contains a submit button. When you enter data in the Web form and\
    \ click the Submit Button, the content of the form is submitted to the server\
    \ for further processing.\n\n# Working with the <form> Tag and Form Elements\n\
    \nThe <form> HTML tag is used to create an HTML form for user input. A form can\
    \ contain various elements, such as text boxes, checkbox, radio buttons, and submit\
    \ buttons. A form can also select menu, text area, field, and label. To create\
    \ a form, you first use the <form> tag and then create the form elements. Listing\
    \ 6.1 shows how to use the <form> tag to create a form.\n\nListing 6.1: Using\
    \ the <form> Tag\n\n```\n<html>\n<head><title>My First Form</title></head>\n<body>\n\
    <form name=\"\" action=\"\" method=\"get/post\" enctype=\"\">\n  Input elements.\n\
    </form>\n</body>\n</html>\n```\n\nIn Listing 6.1, the <form> tag contains four\
    \ attributes, which are:\n\n+   - name—Specifies the name of the form\n- action—Specifies\
    \ the address where you want to send the data, as an e-mail address, a Web server\
    \ address, or any other form\n- method—Specifies the HTTP method used to pass\
    \ the form's content to the Web server\n- enctype—Specifies how the form content\
    \ should be encrypted\n\nAfter creating the form, let's now learn to create the\
    \ following form elements:\n\n+   - Text box\n- Radio button\n- Check box\n- Drop-down\
    \ box\n\n# Creating a Text Box\n\nYou use the <input> tag to create the form elements.\
    \ To create a text box, you need to specify the type of the <input> tag as text.\
    \ Listing 6.2 shows how to create a text box\n\nListing 6.2: Creating a Text Box\n\
    \n```\n<html>\n<head><title>My First Form</title></head>\n<body>\n<form name=\"\
    form1\">\n  First name:\n  <input type=\"text\" name=\"firstname\" />\n  <br />\n\
    ```\n\n146"
