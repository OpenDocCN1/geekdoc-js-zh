  md: 'Let''s learn now about the eval() function in the next section.


    # Using the eval() Function


    The eval() function is generally used to introduce variable values into a string.
    It accepts a string containing JavaScript code that it evaluates as an argument
    and then returns the resulting value.


    Let''s create a Web page, named evalFunction.html to understand how to use the
    eval() function in a script. List 2.35 shows the code of the evalFunction.html
    page:


    List 2.35: Using the eval() in a Script


    ```

    <html>

    <head>

    <title>JavaScriptExample</title>

    </head>

    <body bgcolor="pink">

    <script type="text/javascript" language="javascript">

    eval ("x=25;y=10;document.write("x-y)");

    document.write (eval("9*5"));

    document.write("<br>");

    var a = 15;

    document.write (eval (a/3));

    </script>

    </body>

