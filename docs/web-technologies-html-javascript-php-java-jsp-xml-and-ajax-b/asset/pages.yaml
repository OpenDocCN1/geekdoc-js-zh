  md: '# Chapter 7


    mainly used to define legal building blocks of an XML document, which is similar
    to DTD. XML schema also describes which elements are child elements, the order
    of child elements, number of child elements, whether an element is empty or can
    include text, datatypes for elements and attributes, and default values for elements
    and attributes.XML schema use XML syntax and provides secure communication.


    Some benefits of XML schemas are as follows:


    +   - There is no need to learn a new language

    - You can use your XML editor to edit Schema files

    - You can use your XML parser to parse your Schema files

    - You can manipulate your Schema with the XML DOM

    - You can transform your Schema with XSLT


    # Document Object Model (DOM)


    Document Object Model (DOM) represents the document as the elements, attributes
    and the document as a tree-structure having the root node as the parent element
    and the elements defined as child nodes. So, XML defines the standard way for
    accessing and manipulating XML documents. With the help of the DOM tree, the elements
    containing the text and the attributes can be accessed and modified. The contents
    of these elements can be modified, new elements created or removed from the DOM
    tree. Most important thing to note is that all the elements, their text, and their
    attributes are known as the nodes.


    In the DOM structure, the element is considered as the Element node. The XML tag
    or the element is recognized as the Element node. The text in XML elements is
    referred to as the Text node, the XML attributes are considered as the Attribute
    node and the comments are considered as the Comment node; In the DOM tree, the
    nodes have a hierarchical relationship with each other. The terms ''parent'' and
    ''child'' are used to describe the relationships between the nodes.


    Let''s consider of an XML file and look at its DOM tree-structure. Here''s the
    code, in Listing 7.1: for the product.xml file containing the data related to
    the products.


