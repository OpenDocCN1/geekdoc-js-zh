  md: 'Strings— Represents text literals of arbitrary length. In PHP, strings are
    enclosed within single quotes or double quotes. Strings inside double quotes are
    parsed, strings inside single quotes are not. It means that variable or special
    characters are enclosed in double-quotes with strings, then the values of variables
    are printed with the specified string. When variable names and special characters
    are enclosed in single-quotes, then the output is printed in the same way as you
    typed them. Listing 3.8 shows an example using single and double quotes in strings.


    # Listing 3.8: Single and Double Quotes in Strings


    ```

    <?php

    $name="Kogent India";$value = assigned to $name

    echo "$name="; ''we are Kogent India'';

    echo "$name="; ''we are '' . $name;

    ?>

    ```


    In Listing 3.8, the $name variable is assigned a string, Kogent India. In the
    next statement, when the string, $name variable is enclosed in double quotes then
    the echo statement prints We are Kogent India. When the same string is enclosed
    in single quotes, the echo statement prints We Are Kogent India. The last statement
    prints the variable name index of its value in the string.


    Booleans— Represents a true or false value. All conditions return a true/false
    boolean value based on the condition being tested. Some of the statements always
    return a value, as follows:


    +   * The keyword literal.

    * The integer 0.

    * The floating-point number 0.0.

    * The empty string "".

    * The string "zero"

    * An object with no values or methods.

    * The null value.


    Array— Represents a variable that stores a collection of related data elements.
    Each individual element of an array can be accessed by referencing its index.
    The position is either numerically or alphabetically. You can learn more about
    arrays in Chapter 5, Working with Functions and Arrays.


    Object— Allows you to store data as well as information to process data. The data
    elements in an object are referred to as its properties or attributes of object.
    To declare objects, first you must declare a class of object. You need to instantiate
    the object. Objects also allow you to create your own data types. You can define
    the data type in the object class, and then use the data type in instances of
    class.


    Resource— Represents a special data type, which references to functions and resources
    external to PHP. The most common example of the resource type is a database connection.


    NULL— Represents a special data type that can have only one value, null. Null
    is not only a data type, but also a keyword literal. A variable of the null type
    is a variable that has no value assigned to it. When no value is assigned to a
    variable, it is automatically assigned a value, null.


