    \ Nichole, Salma, and Amber.\n\n# Traversing Arrays using Loops and ArrayIterators\n\
    \nArray traversal is useful to work on each element of an array, such as sending\
    \ a mail to each email in an array of addresses and updating each file in an array\
    \ of filenames. There are several ways to traverse an array in PHP the one you\
    \ choose depends on data and the task you are performing.\n\n# The foreach Construct\n\
    \nPHP 4 has introduced a foreach construct. It provides an easy way to iterate\
    \ over arrays. foreach works only on arrays, and issues an error when you try\
    \ to use on a variable with a different data type or an uninitialized variable.\
    \ There are two syntaxes to define the foreach loop. Following syntax is used\
    \ to define the foreach loop\n\nFirst:\n\n```\nforeach (array_expression as $value)\
    \ {\n    //statement\n```\n\nSecond:\n\n```\nforeach (array_expression as $key\
    \ => $value) {\n    //statement\n```\n\nIn the preceding syntax, first forms a\
    \ loop over the array given array_expression. On each loop, the value of the current\
    \ element is assigned to $value and the internal array pointer is increased by\
    \ one. The second form does the same thing, except that the current element's\
    \ index is assigned to the variable $key on each loop. Listing 5.3 shows the use\
    \ of foreach loop to traverse an array:\n\nListing 5.3: Using the foreach loop\n\
    \n```\nphp\n$students = array();\n//assigning values\n$students[0] = \"david\"\
    ;\n$students[1] = \"kevin\";\n$students[2] = \"julie\";\n$students[3] = \"nayyar\"\
    ;\n// now we use the foreach loop to display all the student names i.e the\narray\
    \ uses\nin one go foreach ($students as $std_name) {\n    echo $std_name . \"\\\
    n\";\n?>\n```\n\nOutput:\n\n```\ndavid kevin julie nayyar\n```\n\n# 140"
