    You can use operators to perform various functions, such as mathematical calculations,
    modifying strings, and making decisions. The combination of operators and a value,
    for example, form expressions. An expression that has a specific value or evaluates
    to a, for example 45 and var+2. In JavaScript and other programming languages,
    expressions are evaluated in a particular order. The order of evaluation is determined
    by the precedence of operators with respect to one another. Operators are evaluated
    in the order of higher precedence to lower precedence. Table 2.6 lists the operators
    in the decreasing order of their precedence.


    # Table 2.6: Precedence of Some Used Operators from Highest to Lowest


    | Operator | Precedence |

    | :--- | :--- |

    | !, - (negative sign), ++, --, typeof | Highest Precedence |

    | *, / | |

    | +, - (subtraction) | |

    | <, <=, >= | |

    | ==, != | |

    | &&, || | |

    | +=, -=, *=, /= %= | Lowest Precedence |


    In there are two or more operators of the same precedence in an expression, operators
    are evaluated from left to right. For the instance, 45+5*10 evaluates to 30. The
    * operator is evaluated first, followed by the + and - operator.


    It is very essential to be aware of the precedence of the operators; otherwise,
    you may get unexpected results. However, you can also override the precedence
    of an operator using parentheses. The parentheses have the highest precedence
    and any expression that is enclosed within parentheses is evaluated first.


    Let''s create a Web page, named OperatorPrecedence.html to learn the uses of the
    operators. Listing 2.20 shows the code of the OperatorPrecedence.html page:'
