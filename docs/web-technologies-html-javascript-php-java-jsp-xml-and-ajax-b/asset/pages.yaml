    # Using Variables in JavaScript


    In JavaScript, the data can be stored in variables which are the named locations
    in the memory. Variables are the name of the variable uniquely identifies the
    variable, the value refers to the data that is stored in the variable, and the
    memory address refers to the memory location of the variable.


    You need to declare a variable before using it to store data. When you declare
    a variable, it means you are introducing it in the script. While declaring a variable,
    you need to provide a user friendly and unique name for the variable.


    The syntax to declare a variable is:


    ```

    var variable_name;

    ```


    In the preceding syntax, var is a keyword and variable_name refers to the name
    of the variable.


    Now, let''s learn about the scope of variables in detail in the next section.


    # Scope of variables


    It is important to note that in JavaScript, there is no limit on the length (number
    of characters) of the name of a variable. However, there are certain rules that
    define the scope of variables. You need to keep these rules in mind naming variables
    in JavaScript.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Chapter 2


    +   - The name of the variable must be unique in the script.


    +   - The name of the variable can only contain letters, numbers, and underscores.
    It cannot contain spaces and certain punctuation characters.


    +   - The name of the variable must begin with an uppercase or lowercase letter
    or an underscore; it cannot begin with a number.


    +   - The name of the variable cannot be enclosed by single or double quotations.


    +   - The name of the variable cannot be same as any keyword in JavaScript.


    In Table 2.2, you can have a look at some examples of invalid and valid names
    of variables in JavaScript:


    | Table 2.2: Examples of Invalid and Valid Names of Variables |

    | Invalid Variable Name | Valid Variable Name |

    | 89Books | Books89 |

    | var | var1 |

    | My_Variable//One | My_Variable_One |

    | "count" | count |

    | _Book Titles | _Book_Titles |


    Let''s take a look at the example, given in Listing 2.10, to declare a variable
    in a JavaScript script:


    # Listing 2.10: Declaring a Variable in JavaScript


    ```

    <html>

    <head>

    <title>JavaScriptExample</title>

    </head>

    <body bgcolor="pink">

    <script type="text/javascript" language="javascript">

    var countBooks;

    </script>

    </body>

    </html>

    ```


    In Listing 2.10, you can observe that the Web page has script in which a variable
    countBooks is declared using the var keyword.


    In JavaScript, you can declare multiple variables in the same statement. To declare
    multiple variables simultaneously, you need to separate the individuals by a comma
    (.).


    Listing 2.11 shows an example of how to declare multiple variables:


    # Listing 2.11: Declaring Multiple Variables in JavaScript


    ```

    <html>

    <head>

    <title>Example</title>

    </head>

    <body bgcolor="pink">

    <script type="text/javascript" language="javascript">

    var countBooks, minBookPrice, maxBookPrice, bookName;

    </script>

    </body>

    </html>

    ```


