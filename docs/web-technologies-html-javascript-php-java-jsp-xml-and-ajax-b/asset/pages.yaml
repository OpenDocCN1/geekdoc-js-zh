    # Using DataSource to Make a Connection


    With the help of the classes and interfaces provided by the javax.sql package,
    as DataSource and DriverManager you can establish as well as manage connection
    with a data source. However, the DataSource mechanism is only preferred, as it
    has many advantages over the DriverManager mechanism. The DataSource interface
    provides you with several advantages, when used to make a connection.


    +   - The developers need not provide code to implement a driver class.

    - If the properties of a data source or driver change, instead of modifying the
    code, you can make the appropriate changes in the configurations of the data source.

    - The connections established using the DataSource object have the pooling and
    distributed transaction capabilities. This also allow the Web server to communicate
    with the middle-tier infrastructure. However, the connections established with
    the help of the DriverManager, do not have the capabilities of connection pooling
    or distributed transactions.


    DataSource implementation provided by the driver vendor. A particular DataSource
    represents a particular physical data source, and each connection created by DataSource
    is a connection to that physical data source.


    The Java Naming and Directory Interface (JNDI) is used to provide a logical name
    for the DataSource to make a connection. This naming service uses the Java Naming
    and Directory Interface (JNDI) API. The DataSource object can be used to retrieve
    the logical name associated with the underlying database. The application can
    use the DataSource to create the connection to the physical data source it represents.


    The DataSource object helps in maintaining connection pooling; therefore, it can
    be used to work with the middle-tier infrastructure. Moreover, a DataSource object
    can also be implemented to work with the middle-tier infrastructure so that the
    connections it produces used for distributed transactions without any special
    coding.


