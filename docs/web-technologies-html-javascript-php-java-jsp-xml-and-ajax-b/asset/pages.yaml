    # Setting the Frame Border Thickness


    You can also apply border to the frame using the frameborder attribute of the
    <frameset> tag. If you want to set a border to your frame, specify either zero
    or 1 as a value of the frameborder attribute. If you do not want to set a border
    to your frame, specify either no or 0 as a value of the frameborder attribute.
    By default, a frame border is applied to the frames. You can also set the thickness
    of the frame border using the framesacing attribute of the <frameset> tag.


    Let''s create a Web page, named FrameBorderThickness.html to learn how to set
    the frame border thickness. Listing 1.22 shows the code of the FrameBorderThickness.html
    page:


    Listing 1.22: Setting the Frame Border Thickness


    ```

    <html>

    <head>

    <title>Frames</title>

    </head>

    <frameset cols="33%,33%,33%" frameborder="1" framesacing="10">

    <frame src="Frame1.html">

    <frame src="Frame2.html">

    <frame src="Frame3.html">

    </frameset>

    <noframes></noframes>

    </html>

    ```


