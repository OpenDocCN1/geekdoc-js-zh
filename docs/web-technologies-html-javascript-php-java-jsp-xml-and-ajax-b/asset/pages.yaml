  md: "# Table 7.12: Attributes of xsi:element\n\n| Name | Value | Meaning |\n|---|---|---|\n\
    | use-attribute-sets (optional) | Whitespace-separated list of attribute-sets\
    \ | It is the list of named attribute sets attributes to be added to this output\
    \ element\n\nUsing `&lt;xsl:element&gt;`\n\nA typical use of the `&lt;xsl:element&gt;`\
    \ would be in an XML to XML transformation. It is used to create an element in\
    \ the output document for an attribute in the source document. Here's the code,\
    \ given in Listing 7.8, that shows the XSLT stylesheet, if we consider the source\
    \ document in Listing 7.4.\n\nListing 7.8: element.xml\n\n```\n&lt;xml version=\"\
    1.0\"?&gt;\n&lt;stylesheet version=\"1.0\"&gt;\n&lt;xsl xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
    &gt;\n&lt;xsl:output method=\"xml\" indent=\"yes\"&gt;\n&lt;xsl:template match=\"\
    \"&gt;\n  &lt;PRODUCT&gt;\n  &lt;PRODUCTDATA&gt;\n  &lt;xsl:for-each select=\"\
    PRODUCTDATA/PRODUCT/PRODID=*\"&gt;\n    &lt;xsl:element name=\"{name}\"&gt;\n\
    \    &lt;xsl:value-of select=\".\"/&gt;\n    &lt;/xsl:element&gt;\n  &lt;/xsl:for-each&gt;\n\
    \  &lt;/PRODUCTDATA&gt;\n  &lt;/PRODUCT&gt;\n&lt;/xsl:template&gt;\n&lt;/xsl:stylesheet&gt;\n\
    ```\n\nYou have to change the `stylesheet type=\"text/xml\" href=\"xelement.xml\"\
    ` in the product file so that it points to this XSLT stylesheet, as follows:\n\
    \n```\n&lt;?-stylesheet type=\"text/xml\" href=\"xelement.xml\"&gt;\n```\n\nListing\
    \ 7.8 will produce a restructured XML document with elements in the output replacing\
    \ attributes in the source document\n\n```\n&lt;xml version=\"1.0\" encoding=\"\
    UTF-8\"?&gt;\n&lt;PRODUCTDATA&gt;\n  &lt;PRODUCT&gt;\n    &lt;ID&gt;P001&lt;/ID&gt;\n\
    \    &lt;ID&gt;P002&lt;/ID&gt;\n    &lt;ID&gt;P003&lt;/ID&gt;\n  &lt;/PRODUCT&gt;\n\
    &lt;/PRODUCTDATA&gt;\n```\n\nBasically, what the template does is that it takes\
    \ each attribute on the `&lt;PRODID&gt;` element in the source document and creates\
    \ a correspondingly named element in the output document, while inserting the\
    \ value of the former as the content of the newly created element."
