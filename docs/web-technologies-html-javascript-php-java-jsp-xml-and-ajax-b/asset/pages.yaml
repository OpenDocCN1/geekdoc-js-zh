  md: "# Chapter 11\n\nSimilarly, if the user clicks the Sub button on the Home.html\
    \ page after entering 50 and 30 as the values of Operand 1 and Operand 2, the\
    \ control is transferred to SubJsp page. Figure 11.15 shows the result of clicking\
    \ the Sub button:\n\n![](img/ff578e59567ce41d5431f36224872e10_315_0.png)\n\nFigure\
    \ 11.15: Displaying Result.jsp forwarded from SubJsp\n\nYou can see the Result.jsp\
    \ page in the figuring.\n\n# Describing the useBean Tag\n\nTo separate logic from\
    \ presentation, it is best to encapsulate logic in a Java object (a JavaBean),\
    \ instantiate and use this object within a JSP page. The `<jsp:useBean>`, `<jsp:setProperty>`\
    \ and `<jsp:getProperty>` tags assist you with this task.\n\nThe `<jsp:useBean>`\
    \ action tag is used to instantiate a JavaBean, or to locate an existing bean\
    \ instance, and assign it to a variable name (or id). We can also specify the\
    \ lifetime of the object by giving it a specific `scope`, such as application\
    \ scope. The `<jsp:useBean>` action tag ensures that the object is available,\
    \ with the specified `id`, in the appropriate `scope` specified by the tag. The\
    \ object can be referenced using its associated id from the JSP page, or even\
    \ from other JSP pages, depending upon the scope of the JavaBean. The syntax of\
    \ the `<jsp:useBean>` action is as follows:\n\n```\n<jsp:useBean attributes=\n\
    \  <optional body ---->\n</jsp:useBean>\n```\n\n# Describing the Attributes of\
    \ the <jsp:useBean> Tag\n\nThe attributes add extra characteristics to a tag,\
    \ irrespective of its basic functionality. For example, the scope attribute of\
    \ the useBean action tag makes a Java bean instance available in different scopes.\
    \ Attributes of the useBean tag include:\n\n+   - id\n- scope\n- class\n- beanName\n\
    - type\n\nLet’s describe these in detail.\n\n# 298"
