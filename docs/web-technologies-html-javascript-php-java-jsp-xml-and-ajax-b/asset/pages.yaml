    work with beans in the beanbox that comes with the BDK. Assuming that you''ve
    installed the BDK (the default paths by windows system), you can open the beanbox;
    for example, in the run.bat file in the beanbox directory. When beanbox opens,
    as shown in Figure 8.1.


