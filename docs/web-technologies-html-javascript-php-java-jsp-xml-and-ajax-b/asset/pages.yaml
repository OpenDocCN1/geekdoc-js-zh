  md: '# Working with Frames


    HTML provides the facility to divide the Internet Explorer into many sections
    using frames. A frameset in HTML is a way to display multiple Web pages in the
    same Internet Explorer, at the same time. You can create vertical and horizontal
    frames as well as set the frame border thickness and color as per the requirement.
    In addition, you can add a hyperlink to a frame.


    # Creating a Frame


    You can create a frame using <frameset> tag. Inside the <frameset> tag, you have
    to use <frame> tag. The <frame> tag uses an attribute named as src. The src attribute
    takes an html file, as a value, which you want to display that frame. You can
    create multiple <frame> tag inside a <frameset> tag.


    Let''s create a Web page, CreatingFrames.html to learn how to create a frame.
    Listing 1.15 shows the code of the CreatingFrames.html page:


    Listing 1.15: Creating a Frame


    ```

    <html>

    <head>

    <title>Frames</title>

    </head>

    <frameset cols="50%,50%">

    <frame src="Frame1.html">

    <frame src="Frame2.html">

    </frameset>

    <noframes></noframes>

    </html>

    ```


    Now, create another Web page, named Frame1.html for the frame. Listing 1.16 shows
    the code of the Frame1.html page:


    Listing 1.16: Creating Web Page for Frame 1


    ```

    <html>

    <head>

    <title>Frames</title>

    </head>

    <body>

    <h1 align="center">Frame 1</h1>

    <h4 align="center">This is Frame 1</h4>

    </body>

    </html>

    ```


    Now, create one more Web page, named Frame2.html for the frame. Listing 1.17 shows
    the code of the Frame2.html page:


    Listing 1.17: Creating Web Page for Frame 2


    ```

    <html>

    <head>

    <title>Frames</title>

    </head>

    <body>

    <h1 align="center">Frame 2</h1>

    <h4 align="center">This is Frame 2</h4>

    </body>

    </html>

    ```'
