    # Displaying Values Using an Expression to Set an Attribute


    Action tags are used for displaying variables using an expression to set an attribute.
    Action tags have been introduced in JSP 1.1, and few additional tags have been
    added to the JSP 1.2 and 2.0 specifications. This set of tags allows us to include
    basic actions, such as inserting other page resources, forwarding the request
    to another page, creating or locating the JavaBean instances, and setting and
    retrieving bean properties, in JSP pages.


