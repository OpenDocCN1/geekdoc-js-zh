  md: '# Chapter 8


    # Customizers


    The role of the customizer, which is provided by Bean developer, is to help another
    developer configure the Bean. A customizer can provide a step-by-step guide through
    the process that must be followed to use the component in a specific context.
    Online documentation can also be provided. To develop a customizer, a Bean developer
    has greater flexibility to differentiate his or her product in the marketplace.


    After having a basic understanding about JavaBeans, let''s explore the interfaces
    and classes of the java.beans package.


    # Designing Programs Using JavaBeans


