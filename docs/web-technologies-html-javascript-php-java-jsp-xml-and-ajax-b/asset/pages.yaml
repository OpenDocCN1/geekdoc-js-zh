  md: "# Introduction\n\n# # How to Use this Book\n\nIn this book we use the Apache\
    \ Tomcat as the Web server and MySQL as the database to run the Web applications.\
    \ Finding a topic in a particular chapter is also simple. All you have to do is\
    \ open the first page of the chapter and move through the list of topics displayed,\
    \ along with their page numbers.\n\n# # Conventions for this Book\n\nThere are\
    \ a few conventions in this book that you should take note of. For example, all\
    \ codes explained of this book have been shown through code listings. The code\
    \ with listing number and caption will appear as shown:\n\n**Listing 10.2:** FirstServlet.java\n\
    \n```\nimport java.servlet.*;\nimport java.servlet.http.*;\nimport java.util.Date;\n\
    public class FirstServlet extends HttpServlet {\n    public void doGet(HttpServletRequest\
    \ request, HttpServletResponse response)\n    throws ServletException, IOException\
    \ {\n        PrintWriter out = response.getWriter();\n        out.setContentType(\"\
    text/html\");\n        out.write(\"<html>\");\n        out.write(\"<head>\");\n\
    \        out.write(\"<title>First JSP Page</title>\");\n        out.write(\"</head>\"\
    );\n        out.write(\"<body>\");\n        out.write(new Date().toString());\n\
    \        out.write(\"<br>Hello world!<br>\");\\n        out.write(\"</body>\"\
    );\n        out.write(\"</html>\");\n        out.close();\n    }\n}\n```\n\nYou'll\
    \ also see notes, which are designed to give you some additional information:\n\
    \n> **Note**nIt is recommended to call the newInstance() method on the Class object,\
    \ which is returned by the Class.forName method some of the JVMs do not call the\
    \ static initializers until an instance is created.\n\nEach of the figures has\
    \ a caption to maintain clarity, as shown below:\n\n![](img/ff578e59567ce41d5431f36224872e10_15_0.png)\n\
    \nxiv"
