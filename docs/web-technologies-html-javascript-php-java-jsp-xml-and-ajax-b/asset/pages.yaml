    It also stores the data in associative indices, using the field names as keys.
    disadvantage of the mysql_fetch_array() over the mysql_fetch_row() function is
    that it is slower than the mysql_fetch_row() function. Another function, mysql_fetch_assoc()
    is used to return data only as an associative array.


