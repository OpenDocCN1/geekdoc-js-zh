    Let''s explore these statements in detail.


    # Conditional Statements


    Conditional statements help the program to decide whether the condition given
    in the script is true and false. The conditions provided in the statements can
    be single or multiple and it allows to branch the path of execution in a script
    based on whether a single, multiple conditions, evaluate to true or false.


    # Exploring Different Types of Conditional Statements


    In PHP, there are four types of conditional statements, which are:


    +   - The if Statement

    - The if-else Statement

    - The if-else if-else Statement

    - The switch-case Statement


    # The if Statements


    The if statements always begin with if and followed by a condition provided in
    parentheses. If the condition is evaluated and found true, the statement or statements
    immediately following the condition are executed. On the other hand, if the condition
    is found false, no change takes place and you get a blank browser window when
    the script is run. The syntax for an if statement is as follows:


    ```

    if (expression)

    statement

    ```


    Listing 4.1 shows an example to understand the script of the if statement:

    Listing 4.1: Script of the if Statement


    ```

    <?php

    $x=1;

    if($x==1)

