  md: '# Chapter 11


    A JSP document contains elements or tags, such as directives, scripting elements,
    and implicit objects. Directives are used in a JSP document to include the content
    of a static dynamic file within another file. Directives are also used to import
    Java files within JSP pages. Scripting elements, such as declaration tags, expression
    tags, and scriptlet tags help to declare variables and object references in a
    JSP page. Scripting elements also help to generate and display dynamic content.
    Similar to the scripting tags, JSP actions also help to create and manipulate
    dynamic content; however, JSP actions are similar to regular tags.


    In this chapter, you learn about generating dynamic content. Then, you explore
    the scripting and directive tags. You also learn about implicit objects. Further,
    you learn about displaying values using an expression to set attributes. The chapter
    describes debugging with JSPDebug and sharing data between JSP pages, and users
    passing control. In the end, the chapter talks about sharing session and application
    data.


    # Generating Dynamic Content


    You can create dynamic content by accessing the object properties of Java programming
    language. You can access a variety of objects within a JSP page, JSP automatically
    makes certain objects available; you can also create and access application-specific
    objects. related to a particular request, page, or session.


    +   - Using Implicit Objects - We created the implicit objects. These objects
    contain the information related to a particular request, page, or session.

    - Using Application-Specific Objects - Application-specific objects are created
    by developers who are expert in the Java programming language and in accessing
    databases and other services. Using standard tags you can create and access application-specific
    objects within a JSP page.

    - Using Shared Objects - You can use the following page directive to indicate
    how a web container should dispatch multiple client requests.


    ```

    <% page isThreadsafe="false" %>

    ```


    When the isThreadsafe attribute is set to true, the web container can dispatch
    multiple concurrent client requests to the JSP page. This is the default setting.
    While using true, you must ensure that you synchronize access to any shared objects
    at the page level.

    If isThreadsafe attribute is set to false, requests are transmitted individually
    in the same order as they were received, and access to page-level objects do not
    have to be controlled.


    # Exploring Scripting Tags


    JSP scripting tags scripting elements allow you to add a script code into the
    Java code of a JSP page generated by the scriptlet. Mostly, JSP is the scripting
    language used to build a JSP page; however, based on the Web objects, other supported
    tags can also be used.

    IN the next section, you will learn to set the scripting language for a JSP page.
    Before we proceed, let''s discuss about the different types of scripting tags.


    # Types of Scripting Tags


    JSP defines three scripting tags, namely: scriptlet, declarative, and expression
    tags. In the next sections, these are described in detail.


    # The Scriptlet Tag


    Scriptlet tags allow you to write the script code (or the Java code) for implementing
    the _jspService method functionality. The JSP translates the statements of this
    tag into the _jspService method of generated. You can use a scriptlet tag to perform
    the following tasks:


