  md: '# Introduction


    Congratulations on buying the Web Technologies Black Book! This book has been
    designed with comprehensive content on various technologies used to develop Web
    applications, such as PHP, HTML, JavaBeans, Servlet, JSP, AJAX. These technologies
    provide Web developers with simple and consistent mechanism for extending the
    functionality of a Web server and accessing existing business systems. Today,
    developing interactive Web applications has become crucial for the Web developers.
    Various technologies can be used to create Web applications, such as online shopping
    cart, online banking system, and online music stores. This book helps you to explore
    and implement various concepts of each Web technology.


    # About this Book


    In Web Technologies Black Book, you''ll find many details about the Web technologies
    as can fit between the covers. There are hundreds of topics covered in different
    chapters of this book, and each of them is discussed for the respective implementation,
    by providing Web applications in the same chapter.

    This book is divided into separate, easily accessible topics, and each topic addresses
    concepts related to Web technologies. In this book, you can find comprehensive
    discussions on the following topics:


    +   - Introduction to HTML

    - Getting Started with JavaScript Programming

    - Introducing PHP

    - Working with Variables and Constants

    - Controlling Program Flow

    - Working with Functions and Arrays

    - Working with Forms and Database

    - Working with XML

    - Working with JavaBeans

    - Introducing Web Server

    - Working with Servlet Programming

    - Working with Action Tags in JSP

    - Understanding the java.sql and javax.sql Packages

    - Accessing Database from JSP Page

    - Invoking a JavaBean from a JSP Page


    That''s just a partial list—there''s a great deal more. This book has special
    coverage for the latest versions of PHP, Servlets, JSP, and JDBC. This book offers
    more coverage than any other book dedicated to the subject.


    ![](img/ff578e59567ce41d5431f36224872e10_14_0.png)'
