  md: '# Chapter 9


    +   - setPath(String), getPath() – Set or get the path of the location, respectively,
    where the client should return a cookie.

    - setSecure(boolean), getSecure(boolean) – Set or get the secure flag of a cookie,
    respectively. Setting the attribute to indicates that the cookie should only be
    sent by using a secure protocol, such as HTTPS or SSL.


    # Listing the Advantages and Disadvantages of Cookies


    The following are the advantages of using cookies:


    +   - Cookies reduce network traffic, compared to URL rewriting.

    - Cookies maintain client data.


    The following are the disadvantages of using cookies:


    +   - Cookies help reduce the complexity of application logic, as do not need
    to read and write the query string or path in all the views.

    - Cookies are not secure; they can be viewed and modified and so personal information
    can be exposed.

    - Cookies are HTTPS-specific and so can be used for HTTP requests.

    - Cookie size allocated for a client is limited and varies from one client application
    to another. Most browsers support 20 cookies for each domain, a total of 300 cookies,
    and 4 KB as the maximum size of each cookie. Due to limited size, cookies; i.e.
    a client may not allow you to save a cookie in system.

    - Clients can disable cookies.


    # Considering the Situations to use Cookies


    You can use the cookies mechanism under the following situations:


    +   - We can use cookies when we want to reduce the network traffic.

    - Cookies are stored at the client side so that we can use static pages between
    the requests to maintain user data.


    Now, let''s create an application, named cookies, to understand the implementation
    of cookies.


