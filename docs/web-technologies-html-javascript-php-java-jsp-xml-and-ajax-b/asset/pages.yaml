    # Control Structures


    Control structures are used to control the flow of execution of program. The if
    else statement is used to do structural programming in PHP.


    The code given in Listing 13.7 shows the use of if else statement:


    Listing 13.7: Using if else Statement


    ```

    <body>

    <h1>Using if else statement</h1>

    <?

    $marks=70;

    If($marks<60) {

    echo " student passed in second division.";

    } else {

    echo "Student passed in first division";

    }

    ?>

    </body>

    ```


    PHP also has loop syntax as, for, while, and do. They work in the same way as
    in JavaScript, except the dollar sign is attached to a loop variable.


    The code given in Listing 13.8 shows the use of for loop:


    Listing 13.8: Using for Loop


    ```

    <body>

    <h1>Using for loop</h1>

    <?

    for($counter=0;$counter<5;$counter++) {

    echo " This line is displayed five times.<br>";

    }

    </body>

    ```


    Other loops have similar as of JavaScript. PHP has the foreach loop. It allows
    you to iterate over arrays and multiple item objects. You do not need to know
    the number of items in an array. Value of the current element in each iteration
    is $value and the array pointer is automatically incremented by one.


    The code given in Listing 13.9 shows the use of foreach loop to generate XML document:


