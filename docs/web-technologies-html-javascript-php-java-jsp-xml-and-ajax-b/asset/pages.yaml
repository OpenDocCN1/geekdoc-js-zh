  md: "# Chapter 7\n\nThe SAX parser is the Event Driven parser. the user defines\
    \ the number of callback methods which would be called when an event occurs during\
    \ parsing. The following is the list of SAX events:\n\n+   - XML Text nodes\n\
    - XML Element nodes\n- XML processing instructions\n- XML Comments\n\nThese events\
    \ are fired at the start and end of each XML node, instruction or text comments\
    \ whenever they are encountered. For example, at the start and end of a Text node,\
    \ the XML Text event will be fired; or, Comments event will be fired at the start\
    \ and end of comments. The most important thing to note is that SAX parsing is\
    \ unidirectional. Unidirectional means the previously parsed data cannot be read\
    \ again, until the parsing operation is started.\n\nFollowing code snippet shows\
    \ an example `protodail.xml` that shows how parsing is done by the SAX parser:\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<PRODUCTDATA>\n  <PRODUCT ID=\"\
    9001\">\n    <PRODUCTNAME>Gone with the Wind</PRODUCTNAME>\n    <DESCRIPTION>The\
    \ backdrop of this book is the American Civil War</DESCRIPTION>\n    <PRICE>25.00</PRICE>\n\
    \    <QUANTITY>35</QUANTITY>\n  </PRODUCT>\n</PRODUCTDATA>\n```\n\nThe protodail.xml\
    \ is the XML document providing the details of the products. The SAX parser fires\
    \ off a series of events as it reads the protodail.xml document. These events\
    \ are fired in following sequence:\n\n+   - XML Processing Instruction, with attributes\
    \ version equal to '1.0' and encoding equal to 'UTF-8'\n- XML Element started\
    \ PRODUCTDATA\n- XML Element started PRODUCT, with an attribute PRODUCTID equal\
    \ to the value P001\n- XML Element started PRODUCTNAME\n- XML Element started\
    \ DESCRIPTION\n- XML Text node with data equal to 'Gone with the Wind' (note that\
    \ text processing with regard to spaces can be changed).\n- XML Element ended\
    \ PRODUCTNAME\n- XML Element started DESCRIPTION\n- XML Text node with data equal\
    \ to 'The backdrop of this book is the American Civil War'\n- XML Element ended\
    \ DESCRIPTION\n- XML Element started PRICE\n- XML Text node with data equal to\
    \ '25.00'\n- XML Element ended PRICE\n- XML Element started QUANTITY\n- XML Text\
    \ node with data equal to '35'\n- XML Element ended QUANTITY\n- XML Element ended\
    \ PRODUCT\n- XML Element ended PRODUCTDATA.\n\n# 198"
  merge: -1
