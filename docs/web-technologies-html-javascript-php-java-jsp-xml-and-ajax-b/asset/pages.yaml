  md: '# Using Operators


    As you know, variables are used to temporarily store the data that you want to
    use in a script. You can modify or change the data by manipulating the variables.
    For instance, you have declared two variables named marksMaths marksScience to
    add the value of these two variables. In such a case, you need to manipulate these
    variables to get the desired result. One of the most common ways of manipulating
    variables is by using an operator which is a symbol or a word that represents
    for a special task or action. Every operator works on one or more operands, that
    is an operator takes the values of its operands, performs an action, and returns
    the result of that action.


    In JavaScript, there is a whole gamut of operators that you can use as per your
    requirements. Some of the operators work on a single value while others work on
    two operands. Some operators work on numbers, others work on strings and Boolean
    values. Table 2.5 lists the commonly used operators in JavaScript


    | Operator | Description | Example |

    |---|---|--|

    | Arithmetic Operators | | |

    | + | Adds numbers or joins two strings. It also represents a positive number
    when it is prefixed to a number. | 45+10 returns 55 \n"My " + "Name" returns "My
    Name" |

    | - | Subtracts two numbers or represents a negative number. | -45-10 returns
    -35 |

    | * | Multiplies two numbers. | 45*10 returns 450 |

    | / | Divides two numbers evenly and returns the quotient. | 45/10 returns 4.5
    |

    | % | Divides two numbers and returns the remainder. | 45%10 returns 5 |

    | ++ | Increments the value of a number by one. It can be prefixed or suffixed
    to a number. When prefixed, the value is increased in the current statement, and
    when suffixed, the value is increased after the current statement. | myVar=45
    \nVar2++myVar1 assigns 46 to myVar \nVar2=myVar1++ assigns 45 to myVar |

    | -- | Decrements the value of a number by one. It can be prefixed or suffixed
    to a number. When prefixed, the value is decremented in the current statement,
    and when suffixed, the value is decremented after the current statement. | myVar=45
    \nVar2--myVar1 assigns 44 to myVar \nVar2=myVar1-- assigns 45 to myVar |

    | Assignment Operators | | |

    | = | Assigns the value on the right hand side to the variable on the left hand
    side | myVar=90 |

    | += | Adds the right hand side operand to the left hand side operand and assigns
    the result to the left hand operand. | myVar=45,myVar2=10 \nVar1+=myVar2 assigns
    55 to myVar1 |'
