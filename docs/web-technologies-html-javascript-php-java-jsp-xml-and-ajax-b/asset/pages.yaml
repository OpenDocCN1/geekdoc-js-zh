    # Defining Entities in the DTD


    Entities are shortcut or aliases that are replaced by complete definition at runtime.
    They can be defined internally in an XML document or in an external DTD. You can
    define entities using the `<ENTITY>` tag. The following syntax shows how to define
    entities in an external DTD:


    ```

    <ENTITY entity-name SYSTEM "URL">

    ```


    In the preceding syntax, the entity-name parameter specifies the name of the entity
    and the URL parameter represents the URL of the DTD or document that contains
    the definition of the entity.

    You can define an entity internally by using the following syntax:


    ```

    <ENTITY entity-name "entity definition">

    ```


    In the preceding syntax, the substitution string (in our case, entity definition)
    replaces the entity name when it is referenced in an XML document.

    Based on the preceding syntax, let''s write the code snippet defining two entities,
    writer and copyright:


    ```

    <ENTITY writer "Ken Greenwood">

    <ENTITY copyright "Copyright 1999 by sams">

    ```


    Now, following the code snippet, use these entities:

    In the preceding code snippets, we have defined the copyright information of published
    materials created by an organization. Suppose at a later point of time, another
    organization acquires the copyright of the book, the copyright information needs
    to be changed only at one place, that is, in the copyright defined in the first
    code snippet. The updated copyright information would then be reflected in all
    the XML documents using the entity (defined in the first code snippet).


