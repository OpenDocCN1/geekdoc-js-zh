  md: '# Chapter 7


    # The <xsl:template> Element


    This element defines a template for producing output. It is a top-level element.
    It contains rules to apply when a specified node is matched against a pattern
    or explicitly by name. It uses a match attribute for defining the pattern. Matching
    against a pattern makes use of the match attribute of the `<xsl:template>` element.
    For example, match=`/ defines the whole document as it matches the root.

    The pattern mentioned in the match attribute may not include a variable reference.
    Therefore, circular references are avoided. Similarly, if the `<xsl:template>`
    element has a name attribute like the one that follows:


    ```

    <xsl:template name="PRODUCTNAME">

    <xsl:call-template name="PRODUCTNAME">

    ```


    Then it can be accessed in the following manner:

    Notice that the name attribute of `<xsl:template>` and `<xsl:call-template>` must
    match exactly. If an `<xsl:template>` element does not have a match attribute
    or a name attribute or both. When both the match and the name attribute exist,
    in that case, `<xsl:template>` element can be called by either `<xsl:apply-templates>`
    or `<xsl:call-template>`.


    Syntax: `<xsl:template>` is as follows:


    ```

    <xsl:template name="name" match="pattern" mode="mode" priority="number">

    <xsl:apply-templates select="$param, template" /> -->

    </xsl:template>

    ```


    # Attributes


    The attributes used by `<xsl:template>` element are listed in Table 7.6.


    | Table 7.6: Attributes of <xsl:template>

    | Name | Value | Meaning |

    | match (optional) | Pattern | It is a pattern that defines which nodes are eligible
    to be processed. If this attribute is absent, then the name attribute must be
    present |

    | name (optional) | Name | It specifies a name for the template. If this attribute
    is absent, then there becomes a for a match |

    | priority (optional) | Number | It is a number (positive or negative, integer)
    that denotes the priority of this template, and when several templates match the
    same node |

    | mode (optional) | List of modes | It specifies the mode or modes to which this
    template applies. When `<xsl:apply-templates>` is used to process a set of nodes,
    only templates considered are those with a matching mode |


    # The <xsl:apply-templates> Element


    This element defines a set of nodes to be processed and causes the system to process
    them by selecting an appropriate template. `<xsl:apply-templates>` element is
    an instruction, which is used within a template. It selects a set of nodes and
    processes each of them by finding a matching template. `<xsl:sort>` element may
    be nested within an `<xsl:apply-templates>` element. If `<xsl:sort>` element is
    nested within `<xsl:apply-templates>`, then it determines the order in which the
    nodes are processed, otherwise the nodes are processed in document order.


