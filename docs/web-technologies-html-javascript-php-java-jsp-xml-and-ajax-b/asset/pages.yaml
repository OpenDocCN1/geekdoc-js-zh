    \ Beans (MDB)\n- Entity Beans\n- Now, let's discuss about the beans in detail.\n\
    \n# Session Beans\n\nA session bean is a type of enterprise bean that exists for\
    \ the client and server sessions. A session bean is generally created when a client\
    \ requests a database with the help of a query to retrieve the required data.\
    \ The bean lasts until the client and server persist. Almost all services start\
    \ with session beans, such as LoginVerificationBean and ShoppingCartBean. Session\
    \ beans hold business processes, such as delivering an order and doing financial\
    \ calculations for an application. These beans are reusable components, which\
    \ provide methods that can be accessed by the client. All the services provided\
    \ by the session bean are in the form of different methods.\n\nAs stateless bean\
    \ is never shared among multiple clients, the methods of a particular bean can\
    \ only be executed by a single client. The length of a session determines the\
    \ duration for which a session bean remains in use. This implies that a session\
    \ bean is a short-lived object.\n\nThe actions performed using the methods of\
    \ a session bean may lead to the change of data of an enterprise bean. This results\
    \ in change of the state of the enterprise bean that may be persistent or transient.\
    \ Persistent change is available for the multiple sessions of a client; however,\
    \ a transient change is available for a single session. There are two types of\
    \ session beans:\n\n+   - stateless session bean\n\nThe difference between stateless\
    \ and stateful beans is that a stateful bean can be used for another client while\
    \ a stateless bean cannot be used for another client.\n\n# Message-Driven Beans\n\
    \nThe MDB itself serves that it is associated with some sort of messaging. To\
    \ communicate among software components or applications, messaging is used. Messaging\
    \ is a facility by using which a client can send/receive messages to/from other\
    \ clients. In cases of MDBs, each client connects to a message agent that facilitates\
    \ creating, sending, receiving, and reading messages.\n\nJava Messaging (JMS)\
    \ is a core service provided by Java EE servers. JMS allows asynchronous invocation\
    \ of different services via messages. JMS clients send messages to the server\
    \ managed queues. To monitor message queues, a special kind of EJB is needed,\
    \ called MDB.\n\n# Entity Beans\n\nJPA provides Plain Old Java Objects (POJO)\
    \ and ORM for mapping persistent data among the applications. The term persistent\
    \ refers to the data of an application that needs to be stored permanently in\
    \ a database. In JPA, the persistent data refers to the entities that serve as\
    \ a collection of the data that needs to be stored or retrieved. For example,\
    \ in an online book booking application, the details of the book to be purchased\
    \ and the person buying the book needs to be maintained in the database. In this\
    \ example, books and people are treated as entities. The personal details of person\
    \ such as name, credit card details and address are logically grouped to represent\
    \ the Person entity. Similarly, International Standard Book Number (ISBN), book\
    \ name, and author name may be grouped to represent the Book entity. In an enterprise\
    \ application, you can define an entity by using a POJO by using annotations."
