  md: "# Built-in Array Functions\n\nArray functions allow us to manipulate arrays.\
    \ PHP supports both simple and multi-dimensional arrays. There are some specific\
    \ functions for populating arrays from results retrieved from the database queries.\
    \ Following are some commonly used array functions to manipulate arrays in PHP.\n\
    \n# Getting the Size of an Array\n\nThe count() function counts all elements in\
    \ an array, or properties in an object. Syntax to define the count() function\
    \ is as follows:\n\n```\nint count(array, mode)\n```\n\n+   * Parameters:\n  *\
    \ array—Required. Specifies the array or object to count.\n  * mode—Optional.\
    \ Specifies the mode of the function. Possible values are 0 or 1.\n\nListing 5.33\
    \ shows the use of count() to count the number of elements in an array:\n\n**Listing\
    \ 5.33:** using count() Function\n\n```\n<?php\n$people = array(\"Peter\", \"\
    Joe\", \"Glenn\", \"Cleveland\");\n$result = count($people);\necho $result;\n\
    ?>\n```\n\nOutput:\n\n```\n4\n```\n\nIn the preceding listing, we create an array,\
    \ people, which has elements Peter, Joe, Glenn, Cleveland. The count counts the\
    \ array, people and returns the output 4.\n\n# Searching For the Occurrence of\
    \ a Given Value\n\nThe array_search() function searches an array for a value and\
    \ returns the index. Syntax to define the array_search() function is:\n\n```\n\
    array_search(value, array, strict)\n```\n\n+   * Parameters:\n  * value—Required.\
    \ Specifies the value to search for\n  * array—Required. Specifies the array to\
    \ search in\n  * strict—Optional. Possible values are true and false.\n\nListing\
    \ 5.34 shows how to use array_search() Function\n\n**Listing 5.34:** using array_search()\
    \ Function\n\n```\n<?php\n$array = array(\"a\"=>\"Dog\", \"b\"=>\"Cat\", \"c\"\
    =>\"Horse\");\necho array_search(\"Dog\", $array);\n?>\n```\n\nOutput:\n\n```\n\
    a\n```\n\nIn the preceding listing, we create an array, $a and at index a, b,\
    \ and c search values Dog, Cat, and Horse respectively. When we print the index\
    \ of dog array $a using array_search() function, it returns a as the output."
