- img_proc: true
  md: 'They are available to JSP pages and can use them without importing into a JSP
    page. Since the implicit objects are declared automatically, the user only needs
    to use a reference variable associated with a given object. This object can be
    used to call the methods associated with it.


    These objects help in handling the HTML parameters, forward a request to a Web
    component, and include the content of a component, log data through the JSP container,
    control the output stream, and handle exceptions very easily.


    # Types of Implicit Objects


    During the translation of a JSP page, the JSP engine initiates nine most commonly
    used JSP objects in the _jspService() method. These JSP implicit objects include:


    +   - Request

    - Response

    - Out

    - Page

    - PageContext

    - Application

    - Session

    - Config

    - Exception


    Let''s learn about these objects in detail.


    # The Request Object


    Request objects are passed as parameters to the _jspService() method when a client
    request is made. A request object is of the javax.servlet.http.HttpRequest type.
    You can use the request objects in a JSP page similar to using them in services.


    # The response Object


    The response object is used to carry the response of a client request after the
    _jspService() method is executed. The response object is of the javax.servlet.http.HttpServletResponse
    type.


    # The out Object


    The out object provides access to the output stream. This is a subtype of javax.servlet.JspWriter.
    The out object can be used directly in JSP scripts to display the data on the
    browser, since JSP expressions are automatically placed in the output stream.
    In simple terms, the out object is used to write the text data.


    # The page Object


    The page object refers to the state of a JSP processing the current request and
    belongs to the java.lang.Object. It also works as an instance of the generated
    servlet in a JSP page. Since it is a variable of type Object, it is rarely used
    in a document. It cannot be used directly to call the servlet.


    # The pageContext Object


    The pageContext object represents the context of the current JSP. It provides
    a single API to manage the various scoped attributes. This object is one of the
    javax.servlet.jsp.PageContext type.'
