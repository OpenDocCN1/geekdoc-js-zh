    # Using the post() Method


    Unlike the get() method, the post() method appends all the data into the Hyper
    Text Transfer Protocol (HTTP) header message body. You can send any amount of
    data using the post() method. Information sent through this method is not displayed
    in the URL of the web browser. Listing 6.7 shows how to use the post() method
    to send the data to the server:


    Listing 6.7: Sending Form Data Using the post() Method


