    # Arrays


    An array consists of a set of similar elements stored in contiguous locations.
    We use the array statement to create an PHP array. Here''s an example:


    ```

    $arr=array(10,20,30);

    ```


    Arrays elements are accessed by using the Syntax Name[index], where name is the
    name of array and index is the subscript. Here''s an example which accesses the
    first element of array arr:


    ```

    echo $arr[0];

    ```


    You can also access "element" using the text index. Here''s an example:


    ```

    $data["temp"] = 98;

    ```


    In this example, "temp" is used to store the value 98.


    # Comments


    To comment a PHP code, three types of comments are used. The first type of comment
    starts with /* and ends with /. These symbols can contain multiple lines of text.
    The second and third type of comment start with // or #, respectively. They are
    one line comments and these comments end at the end of the line.


    The code in Listing 13.6 shows the use of each type of comment:


    # Listing 13.6: Three Types of Comments


    ```

    <?n/* This is comment of Type 1*/

    //This is comment of type 2

    #This is comment of type 3

    echo "- from PHP.";

    ?>

    ```


    # Operators


    Operators act on one or two perform some operation and generate a result. PHP
    has a set of operators that is same as JavaScript. Precedence order of these operators
    is same as that in JavaScript. Table 13.3 shows the precedence of different types
    of operators:


    # Table 13.3: Operator precedence


    | Operators | Precedence |

    | --- | --- |

    | Multiplicative | * % |

    | Additive | + - |

    | Shift | << >>> |

    | Unary | ++ -expr +expr -expr ~ |

    | Postfix | expr++ expr |

    | Relational | < <= instanceof |

    | Equality | == != |'
