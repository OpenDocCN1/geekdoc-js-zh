  md: '# Working with XML


    In this the SAX Parser generates the sequence of events while parsing, DOM has
    the formal specification, but there is no formal specification for SAX. SAX is
    based on the nature of event-driven processing, the processing of the XML document
    would be done faster as compared to DOM-style parsers.


    The quality of which a SAX parser uses functions is smaller as compared to that
    of the DOM parser. In other words, the DOM parser loads the entire XML tree structure
    of the document into memory, so that the amount of memory used by the DOM parser
    depends upon the size of the input data.


    The major drawback of the SAX parser is that, unlike XSL or XPath, SAX parser
    cannot access any node at anytime. Instead, the SAX parser can read the parsed
    data only when the parsing is done again. Table 7.16 lists a summary of the SAX
    APIs:


    # Table 7.16: The SAX API


    | SAX API | Description |

    | --- | --- |

    | ContentHandler | This interface provides methods, such as startDocument(), startElement(),
    and endElement() which are invoked to the notifications of beginning, end of document
    and beginning of element respectively |

    | DefaultHandler | This class is for SAX handlers such as ContentHandler, ErrorHandler,
    DTDHandler, and EntityResolver interfaces |

    | DTDHandler | The DTDResolver allows you to receive notifications of basic DTD
    related events |

    | EntityResolver | The EntityResolver is a basic interface for resolving entities.
    It has resolveEntity() method resolves external entities |

    | ErrorHandler | This interface provides error(), fatal and warning methods that
    are invoked in occurrence of recoverable error, non-recoverable error, and warning
    respectively. To ensure the correct handling, you''ll need to supply your own
    Error handler to the parser |

    | SAXParser | The SAXParser provides several types of parse() methods. In general,
    you pass an XML data source and a DefaultHandler object to these parse() methods,
    which process the XML and invokes the appropriate methods on the handler |

    | SAXParserFactory | A SAXParserFactory creates an instance of the SAXParser class
    based on system property of SAXParserFactory |

    | SAXReader | The SAXReader wraps a SAXReader. It is the SAXReader that carries
    on the conversation with the SAX event handlers you define |


