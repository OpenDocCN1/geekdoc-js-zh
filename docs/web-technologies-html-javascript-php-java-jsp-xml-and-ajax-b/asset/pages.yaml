    # JdbccRowSet Objects


    The JdbcRowSet is a wrapper around the RowSet and always maintains a connection
    to its data source, a ResultSet object. The main difference between a JdbcRowSet
    and ResultSet object is that a JdbcRowSet object has properties and also participates
    in the JavaBeans event model. The use of the JdbcRowSet makes it an independent
    component. A JdbcRowSet can be used this way as it is a wrapper for the driver
    that has obtained its connection to the database. Another benefit of using the
    JdbcRowSet object is that it makes a ResultSet object scrollable and upgradable.
    All RowSet objects are scrollable and upgradable by default. For example, a JdbcRowSet
    populated with the ResultSet data is scrollable and upgradable.


    The ResultSetImpl is used here as a constructor to create new instances of the
    JdbcRowSet objects. It is initialized with default values in the BaseRowSet class,
    which can be set when needed, required. The commands and properties to establish
    a connection are set, after the new instance executes the execute() method. The
    new instance does not work until the execute() method is called.


