    Figure 2.24: Using the if...else Statement


    In Figure 2.24, you can observe that the if...else statement checks the expression
    to find out whether the value 44 is even or odd.

    In JavaScript, you can nest one if...else statement within another. Nested if...else
    statements are useful when you want additional checking or validation on the Web
    page. You can nest as many if...else statements within an if...else statement.
    In most cases, an if...else statement is nested inside the else clause of another
    if...else statement.'
