    # Handling Events


    Events are another common and popular way to increase interactivity on a Web page.
    They refer to a particular action performed on the Web page. For instance, an
    event can occur when the user clicks a hyperlink on the Web page. There are events
    that occur without the user''s participation, for an event occurs when a Web page
    is fully loaded in the Web browser.

    JavaScript defines built-in events you can use to make the Web pages dynamic and
    interactive. When an event occurs, an event handler is called. An event handler
    is a special function that handles a particular event. In JavaScript, you can
    create an event handler and associate it with the desired event. The event handlers
    are associated with the events through certain attributes of various HTML tags.
    Table 2.1 lists some of the common events and the event handling attributes of
    the HTML tags.


    Table 2.1: Common JavaScript Events and the HTML Event Handling Attributes

    | Event | Description | Attribute |

    |---|---|---|n| abort | Occurs when the user stops or cancels the loading of an
    image | onabort |

    | blur | Occurs when an HTML element loses focus because the user clicks outside
    the element | onblur |

    | change | Occurs when the user changes the value of a text field in an HTML form
    | onclick |

    | click | Occurs when the user clicks an HTML element, such as form element, or
    a link | onclick |

    | dblclick | Occurs when the user double-clicks an HTML element | ondblclick |

    | error | Occurs when an error arises while the Web page or an image is loaded
    | onerror |

    | focus | Occurs when an HTML element gets focus | onfocus |


