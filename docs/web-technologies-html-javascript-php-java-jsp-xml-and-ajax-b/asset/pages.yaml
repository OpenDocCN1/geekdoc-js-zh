  md: '# Chapter 9


    # Methods for Buffering


    The ServletResponse interface allows a Servlet to access and set buffering parameters.
    Servlets may or may not support buffering of the output going to client, but most
    containers support it to improve their performance. The following methods of the
    ServletResponse interface are used to access and set buffering information:


    +   - bufferSize(int) - Sets the buffer size. This method must be called before
    any content is written using ServletOutputStream or ServletWriter. Invoking this
    method after writing the content throws IllegalStateException. It is recommended
    to set a large buffer size.


    +   - getBufferSize() - Gets the size of the underlying buffer being used. If
    the client does not support buffering or it is disabled, this method returns zero.


    +   - flushBuffer() - Forces the content in the buffer to be written.


    +   - boolean isCommitted() - Returns true if the bytes have been sent to client;
    otherwise, it returns false.


    +   - reset() - Clears the buffer, including the status codes and headers, if
    the response is not committed. However, if the response is committed, it throws
    IllegalStateException.


    +   - resetBuffer() - Clears the data in the buffer if the response is not committed;
    however, if the response is committed, it throws IllegalStateException.


    Other methods used with HttpServletResponse are as:


    +   - sendError(int), sendError(int, String) - Sets the appropriate header and
    body content for sending error messages to the client. The following types of
    arguments are used in this method:


    +   - If an optional String argument is provided to the method, it sets the body
    content to the given value.


    +   - If the data is written to the response after this method is called, the
    data is ignored. In other words, after this method is invoked, the data is not
    sent to the client.


    +   - Before invoking this method, if the data was written to the response buffer
    but not committed, the data in the response buffer is cleared and replaced with
    the data set by this method. If the response is committed, this method throws
    IllegalStateException.


    +   - sendRedirect(String) - Sets the appropriate header to redirect the client.
    This method takes an absolute URL, or a path given, the container transforms it
    to a fully qualified URL. In this case, if the response fails to transform, it
    throws IllegalStateException.


    Now, you should know the difference between the implementation of the forward()
    and sendRedirect() methods, which is discussed in the following sections.


    # Comparing RequestDispatcher and sendRedirect


    Both the forward() and sendRedirect() instruction is executed to you resource,
    such as a Servlet or JSP. Let''s compare these two methods:


    +   - The redirect(sendRedirect) instruction is executed in the client side; whereas,
    the forward(RequestDispatcher) instruction is executed in the server, i.e. in
    the container.


    +   - The redirect option is provided by HTTP and can be used only with HTTP clients;
    whereas, the forward''s forward method does not depend on the client''s request
    protocol since the forward() method is provided by the Servlet container.


    +   - With the forward() method, the request object is shared by the target resource;
    whereas, with the sendRedirect() method a new request is created for the destination
    resource (if the destination resource is a Servlet).


    +   - With sendRedirect() method, request and response calls are consumed; whereas,
    only one is consumed in the case of the forward() method.


