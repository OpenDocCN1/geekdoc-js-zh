    # CachedRowSet Objects


    The CachedRowSet object inherits the RowSet class in its own capabilities and
    additional features. This object caches its rows in memory; however, it does not
    always connecting to its data source. Usually, the CachedRowSet object retrieves
    rows from a ResultSet but can also connect from rows in tabular forms, such as
    spreadsheets. The CachedRowSet object is a disconnected RowSet, it connects with
    the data source only when it is reading the data to populate the rows or when
    it is updating changes in the underlying data source. You can perform the following
    functions with a CachedRowSet object:


    +   - Create a CachedRowSet object

    - Set the properties of the CachedRowSet object

    - Fill a CachedRowSet object

    - Read data from the CachedRowData object

    - Retrieve the RowMetaData object

    - Update the CachedRowSet object

    - Let discuss each of these in detail


    # Creating a CachedRowSet


    The default implementation for the CachedRowSet object are set to the default
    properties of the RowSet object. The constructor is used to create a new instance.
    The following code snippet demonstrates creation of a new instance of the CachedRowSet
    object:


    ```

    CachedRowSetImpl cri = new CachedRowSetImpl();

    ```


    In the preceding snippet the properties of the CachedRowSet object are set to
    the default properties of the RowSet object. In addition, the CachedRowSet object
    has one synchronization provider RIOptimisticProvider of the SyncProvider type.
    The classes and interfaces for synchronization provider are provided by the javax.sql.rowset.spi
    package. The RowReader is used by the RIOptimisticProvider to read data into the
    CachedRowSet, as this RowSet does not have any established connection to the data.
    The RowSet object obtains a connection using the values set, username, and password
    or URL for the data source. The RIOptimisticProvider also provides the RowSetWriter
    to synchronize any changes made to the CachedRowSet while it was disconnected
    from the updating data source. If you are not using the RowWriter object, the
    SyncProvider are retrieved from the SyncFactory class. The following code snippet
    is used to show the list of synchronization providers in a CachedRowSet object:


    ```

    Java.util.Enumeration SyncFactory.getRegisteredProviders();

    ```


    The method mentioned in preceding code snippet returns the list of providers to
    specify a particular SyncProvider object that the CachedRowSet can use. The following
    code snippet shows how to create the instance of the CachedRowSet object by providing
    a specific SyncProvider object:


    ```

    CachedRowSetImpl cri.setSyncProvider("com.fred.providers.HighAvailabilityProvider");

    ```


    The value for the synchronization parameter can be set using the setSyncProvider()
    method of CachedRowSet:


    ```

    crs.setSyncProvider("com.fred.providers.HighAvailabilityProvider");

    ```'
