  md: '# JSP Application Development


    param

    When setting bean properties from the request parameters, it is not necessary
    for the bean to have the same property names as the request parameters. The param
    attribute is used to specify the name of the request parameter whose value is
    not specified, it is assumed that the request parameter and the bean property
    have the same names.

    The syntax to use the param property is as follows:


    ```

    <jsp:setProperty name="bean" variable="name" property="property" param="request
    parameter" />

    ```


    Let us see few examples to use the syntax with the attributes of the <jsp:setProperty>
    action tag as follows:


    +   To set all properties in the JavaBean while setting bean properties from the
    request object:

    <jsp:setProperty name="bean" property="*" />


    +   To set a specific property name in the JavaBean while setting bean properties
    from the request object:

    <jsp:setProperty name="bean" property="uname" param="uname" />


    +   When setting a property name as a value, you should specify the value attribute
    as a String or an expression that is evaluated at runtime:

    <jsp:setProperty name="bean" property="uname" value="${uname}"/>


    You learned about the <jsp:setProperty> action tag in this section. Now let''s
    learn about the <jsp:getProperty> action tag.


    # Describing the getProperty Tag


    The <jsp:getProperty> action tag gets the value of a property in a bean''s getter
    methods and the syntax to use the <jsp:getProperty> action tag is as follows:


    ```

    <jsp:getProperty attributes="/>

    ```


    The <jsp:getProperty> action tag takes two attributes, name and property, which
    are described in the next few sections.


    # The name Attribute


    The name attribute takes the variable name from which you want to get the getter
    method. If a bean is instantiated using the jspuseBean action tag, the value assigned
    to the name attribute should match with the id value attribute of the bean. In
    this case, the <jsp:useBean> action tag must appear before the <jsp:getProperty>
    tag in the JSP page.


    # The property Attribute


    The property attribute of the <jsp:getProperty> tag gets the value of a property
    and invokes the getter method of the bean property. For example, if the getUname
    method needs to be called, the property attribute takes uname, as shown in the
    following snippet:


    ```

    <jsp:getProperty name="mybean" property="uname"/>

    ```


    In the above code snippet, the <jsp:getProperty> tag gets the value of the uname
    property using the mybean instance and includes this value into the output.


    # Error Handling


    An error in a JSP page may occur either translation-time or request time. Whenever
    a JSP page is accessed for the first time in a client request, the JSP container
    translates and compiles the target JSP page.


