  md: 'After learning the benefits of the tag-based approach used in JSP, let''s discuss
    about the JSP architecture the next section.


    # Describing the JSP Architecture


    JSP specifications demonstrate two approaches to build Web applications using
    JSP. These approaches are known as JSP Model 1 and JSP Model 2 architecture, respectively.
    Let''s study these models in detail.


    # JSP Model I Architecture


    In JSP Model I architecture, the Web browser accesses the JSP pages of a Web container.
    The JSP pages interact with the Web container''s JavaBeans, which represent the
    application model. When a client sends a request from JSP page, the response (that
    is, the JSP page) is sent back to the client depending on the selected hyperlinks
    or those request parameters invoked by the client request. If the generated response
    requires accessing a database, the JSP JavaBeans, which acquires the required
    data from the database. Figure 10.1 shows the architecture of JSP Model I.


    ![](img/ff578e59567ce41d5431f36224872e10_284_0.png)


    Figure 10.1: Architecture of JSP Model I


    # JSP Model II Architecture


    The JSP Model II architecture uses Servlets as well, which are positioned between
    the Web browser and the JSP pages. The Servlet acts as a controller to dispatch
    requests to the next JSP view, such as the URL based on the client request and
    input parameters. It also creates JavaBeans instances, if required by the JSP
    page. The controller also determines the JSP page that has to be forwarded as
    a response based on the client request. The JavaBeans invokes the database server
    if data is needed from a database server. Figure 10.2 shows the architecture of
    JSP Model II.


    ![](img/ff578e59567ce41d5431f36224872e10_284_1.png)


    Figure 10.2: JSP Model II Architecture


    You have familiarized with the JSP architecture; let''s learn about the JSP life
    cycle in the next section.'
