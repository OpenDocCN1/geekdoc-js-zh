  md: '# Chapter 10


    Until today, Servlets have been effectively used to create Web applications. However,
    Servlets are also giving way to superior technology. These days, Servlets, a popular
    mean to create Web pages, are being replaced by better technologies such as Java
    Server Pages (JSP). There are several shortcomings of Java Servlets, which contributed
    to their decline. The main reasons are:


    +   - Inability to use IDE- Designing HTML is not possible using Integrated Development
    Environments (IDEs). This increases the development time of Web applications.

    - Inability to use HTML Designer- Preparing the view is not possible using HTML
    designer services. You, need to depend on the Java manager to prepare this view.

    - Dependency on configuration- Servlet programs depend on the Web configuration.
    The web-xml file is used to configure a Servlet. When using multiple Servlets,
    you have to ensure, in the web-xml file, each Servlet is mapped to the appropriate
    servlet. This increases the complexity of the Web site, so you must know the Servlet-mapping
    (in the web.xml file) to use it.

    - Recurring Recompilation- When you change a Servlet, you must recount your source
    file. This is an issue creating complex views; every time you have to modify the
    Servlet program before generating the output.


    To address problems, the HTML generated using IDEs must include additional instructions
    wherever dynamic content is required. For example, a page with additional instructions
    can be parsed and removed into a standard server-side extension (that is, a Servlet),
    recognized by the container. If there are additional instructions are tag-based,
    they can be directly used by developers to create HTML views. Moreover, tag-based
    instructions can create dynamic HTML views. The tag-based instructions has forcibly
    introduced the JSP technology. In this chapter, we discuss about JSP and how it
    is used to create dynamic Web pages. We also discuss the preference on JSP over
    Servlets to create views. In addition, we explore the architecture and give a
    detailed description of the various stages of the JSP life cycle. At the end,
    we create a simple JSP page.


    Let''s start with a brief introduction of:


    # Understanding JSP


    JSP is a Java extension used to simplify the creation and management of dynamic
    Web pages. JSP allows us to separate the dynamic content of a Web page from its
    state content. As described earlier, programming in Servlets is very complex and
    requires additional files such as web.xml and Java class, to generate the required
    Web pages. JSP offers an easier approach to build dynamic Web pages. JSP documents
    consist of HTML tags and JSP tags. HTML tags are used to create static content
    and JSP is used to add dynamic content to the Web pages. JSP pages are compiled
    into a Java Servlet by a JSP translator. This Servlet is compiled and executed
    to generate an output for the browser (client). Building Web pages using JSP offers
    the following benefits:


    +   - Web pages are portable and can be used easily across multiple platforms
    and Web servers without making any change.

    - Programming in JSP is easier than in Servlets due to the introduction of the
    tag-based approach in JSP.

    - JSP pages are automatically compiled by the Web server, such as Tomcat and Web.
    Developers do not need to compile the source code of the JSP page.

    - One of the most important benefits of JSP is the separation of business logic
    from the presentation logic. The handler classes or JavaBeans contain business
    logic; whereas JSP pages contain presentation logic. The separation of business
    and presentation logic makes an application in JSP secure and reusable.


    You have familiarized with the approach to build dynamic Web pages using JSP.
    Now, let''s understand the advantages of JSP over Servlets.


    264'
