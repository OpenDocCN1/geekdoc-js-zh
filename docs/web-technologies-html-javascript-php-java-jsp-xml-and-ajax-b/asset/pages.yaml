  md: '# Chapter 9


    Java Servlet technology provides a simple, vendor independent mechanism for extending
    the functionality of a Web server. This technology provides high level, component-based,
    platform-independent, and server-independent standards to develop Web applications
    in Java. The Servlet technology is similar to other Web server extensions, such
    as Common Gateway Interface (CGI) and Hypertext Preprocessor (PHP). However, Java
    Servlets are more acceptable since they solve the limitations of CGI, such as
    low performance and low degree scalability.


    A Servlet is a Java class, which is dynamically loaded on a Web server and therefore
    enhances, the functionality of the Web server. A Servlet is secure and portable
    as it runs on the Web server and cannot operate outside its domain. In other words,
    Servlets are objects that generate dynamic content after processing the requests
    originating from a Web server.


    # Tomcat Web Server


    A Web server is a computer or virtual machine used to run Web applications. The
    main purpose of the Web server is to provide Web pages to clients. In the case
    of Web servers, a client uses a Web browser to make an HTTP request, which is
    processed by the Tomcat server which is an open source Web server implemented
    by Apache. The latest version of the Tomcat server is Tomcat 6.0. You can download
    the Tomcat server from the Tomcat website or using the http://tomcat.apache.org/link,
    and install it on your computer. However, before installing the Tomcat server,
    ensure that Java is also installed on the computer. By default, the Tomcat server
    uses port 8080 to run Web applications. After installing Tomcat, you can start
    or stop the Tomcat server by using its Windows installed on Tomcat.


    # Introducing Java Servlet


    Java Servlet is the component APIs of Java Platform Enterprise Edition. It sets
    standards for creating dynamic Web applications in Java. Java Servlet application
    can run on any Web server integrated with a Servlet container. Java Servlet is
    usually designed to process HTTP requests, such as GET and POST. Figure 9.1 shows
    how a Servlet works at higher level


    ![](img/ff578e59567ce41d5431f36224872e10_243_0.png)


    Figure 9.1: Working of a Servlet


    Figure 9.1 shows how a Servlet processes requests.

    The process can be summarized as follows:


    +   - A client sends a request to a Servlet container, which acts as the Web server,
    through a Web browser

    - The Web server searches for the requested Servlet and initiates it

    - The Servlet processes the client request and sends the response back to the
    server, which is then forwarded to the client


    # Exploring the Servlet Container


    Servlet container, sometimes known as Servlet engine, is an integrated set of
    objects that provides runtime environment for Java Servlet components. In other
    words, it is a system that manages Java Servlet components on top of a Web server
    to handle the Web client request. The third party vendors manages container providers
    define the behavior of these objects.'
