  md: '# Web Servers and Servlets


    The preceding example shows how session data of a single session is used to complete
    the online shopping process. Consider another similar example, where you add books
    to the shopping cart and decide to make the payment. You may log out and log in
    again at a later point of time. When you log on to the book store again, you expect
    to simply make the payment of the books in your shopping cart. In such a situation,
    the Web server will require the session data generated in the previous session
    (when you had logged in and added books to the shopping cart). This information
    is also provided to the Web server through session tracking. This is a situation
    where you may need to use the session data of one session in another session.


    After identifying the need of session tracking, let''s discuss the different mechanisms
    for session tracking. These include the following:


    +   - URL retrieving

    - Hidden fields

    - Cookies

    - HTTP session


    # Describing Cookies


    A cookie is a file containing the information that is sent by a Web server to
    a client. Cookies are transmitted to clients through the HTTP response header
    from the server. They are saved at the client side for the given domain and path.
    The cookie file persists on the client machine and the client browser returns
    the cookies to the original server. When the browser requests a resource, the
    cookie matching the domain and path of the request is sent to the Web server as
    a request header. Cookies consist of several kinds of attributes, such as name,
    value, domain, path, comment, and version. Cookies should be used only to store
    non-sensitive information, or information that can be encrypted.


    The Servlet API provides a class Cookie under the `java.servlet.http` package.
    The `java.servlet.http.Cookie` object is designed to represent an HTTP cookie,
    which provides a convenient way to exchange data of a cookie between the client
    and the Servlet. To send cookies to a client, a Servlet can use the `addCookie()`
    method of `HttpServletResponse` object. This method adds fields to the HTTP response
    headers to send cookies. To retrieve cookies, the Servlet uses `getCookies()`
    method of the `HTTPRequest` object.


    The `java.servlet.http.Cookie` class consists of one constructor with two arguments;
    the first argument takes the cookie name and the second takes the cookie value.
    The methods in the `java.servlet.http.Cookie` class are:


    +   - `setValue(String)`—Sets the value of a cookie. The value should not contain
    white space, bytes, parentheses, equals, commas, double quotes, slashes, question
    marks, at signs, colons, or semicolons.

    - `getValue()`—Returns the value of a cookie.

    - `getName()`—Returns the name of a cookie.

    - `setComment(String)`—Sets a comment for a cookie.

    - `getComment()`—Returns the comment that describes the purpose of a cookie, or
    null if there are no comments associated with the cookie.

    - `setVersion(String), getVersion()`—Set and get the version of a cookie, respectively.

    - `setDomain(String), getDomain()`—Set and get the domain, respectively, with
    which a cookie is associated.


