  md: "# JavaScript Programming\n\n# Using the break Statement\n\nAs you know, the\
    \ switch statement uses the break statement to prevent the execution of subsequent\
    \ case statements. The break statement allows you to break or exit a loop. When\
    \ used inside a loop, the break statement stops executing the loop and causes\
    \ the loop to be immediately exited. In case, the loop has statements after the\
    \ break statement, then remaining statements are skipped.\n\nLet's create a Web\
    \ page, named breakStatement.html to understand the working of the break statement.\
    \ Listing 2.28 shows the code of the breakStatement.html page:\n\n**Listing 2.28:**\
    \ Using the break Statement in a Script\n\n```\n<html>\n<head>\n<title>JavaScriptexample</title>\n\
    </head>\n<body bgcolor=\"pink\">\n<script type=\"javascript\" language=\"javascript\"\
    >\nvar count=0;\nwhile(count<10) {\n++count;\nif(count%2==0) \nbreak;\nelse\n\
    document.write(\"count=\"+count+\"<br>\");\nndocument.write(\"while loop exited\"\
    );\n}\n</script>\n</body>\n</html>\n```\n\nIn Listing 2.28, if the count variable\
    \ is less than 10, the while loop is executed. The if...else statement specified\
    \ inside the while loop checks if the count variable is divisible by 2 or not.\
    \ If count is divisible by 2, then the break statement is immediately exited and\
    \ the statement immediately following the while loop is executed.\n\nWhen you\
    \ open this page, the output appears, as shown in Figure 2.30:\n\n![](img/ff578e59567ce41d5431f36224872e10_96_0.png)\n\
    \n**Figure 2.30:** Using the break Statement\n\nIn Figure 2.30, you can observe\
    \ that the count variable is divided by 2 and the remainder is 0, while the loop\
    \ is exited.\n\n79"
