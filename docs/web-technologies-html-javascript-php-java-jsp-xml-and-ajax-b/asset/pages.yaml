    # The `java.sql.ConnectionEvent`


    The `java.sql.ConnectionEvent` represents the connection-related events and provides
    information about them. They are generated when the application calls the pooled
    connection and the listeners are notified. This event handling is similar to the
    event handler in Abstract Window Toolkit (AWT) events. The connection pool decides
    whether to add the connection to listeners pool or not; when connection event
    occurs, the listeners are notified.


    # Implementation of Connection Pooling


    The application server implements connection pooling by implementing the `ConnectionPoolDataSource`
    class, set its properties, and then bind to a name in JNDI.


    The following code snippet shows how to implement `ConnectionPoolDataSource`:


    ```

    com.application.server.ConnectionPoolDataSource ds = new

    com.application.server.ConnectionPoolDataSource();

    ds.setUrl("mydb");

    ds.setUsername("myServer");

    Context context = new InitialContext();

    context.bind("jdbc/pooled", ds);

    ```


    The preceding code snippet shows a data source that is created in JNDI. The user
    can access this data source to establish a connection. The data source returns
    a connection.


    The data source, which is a connection, provides the following properties:


    +   * `InitialPoolSize`: Specifies the number of connections that the connection
    pool can maintain during a session.

    * `minPoolSize`: Indicates the minimum number of connections to be maintained
    in the pool. The 0 value indicates that connections will be created when requested.

    * `maxPoolSize`: Indicates the maximum number of connections that the pool should
    detain. The 0 value indicates that there is no limit.

    * `idleTime`: Indicates the idle time of connections in a pool. It is represented
    in seconds.


