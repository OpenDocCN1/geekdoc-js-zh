  md: "# Step 1.ii: Establishing a connection using a DriverManager\n\nAfter registering\
    \ the driver with a DriverManager, we can now create or establish a connection\
    \ to a database. To create a connection using the DriverManager, invoke any one\
    \ of the following methods of the DriverManager class:\n\n+   * getConnection(String\
    \ url)\n* getConnection(String url, String username, String password)\n* getConnection(String\
    \ url, Properties info)\n\nWhere `<url>` is a JDBC URL, which represents a unique\
    \ name to identify the driver and obtain a connection. The JDBC URL may contain\
    \ additional information, such as username and password, required to establish\
    \ the connection.\n\nThe syntax of the JDBC URL is as follows:\n\n```\njdbc:<sub\
    \ protocol>:<info>\n```\n\nIn the preceding syntax:\n\n+   * `jdbc` — Represents\
    \ the protocol in a JDBC URL\n* `<sub protocol>` — Specifies the vendor-specific\
    \ name of the driver to create a connection\n* `<info>` — Takes additional information\
    \ required to establish a connection, such as the database name and port number,\
    \ which varies from one driver to another\n\nThe following code snippets show\
    \ some JDBC URLs:\n\n```\n// For type-2 driver (e.g. jdbc:Oracle Bridge Driver),\
    \ the JDBC URL is:\ndbc:oracle:kogentSN;\n\n// For Oracle type-2 driver\nstring\
