    \ first need to create a Jewelry.html page, which shows information about the\
    \ jewelry in the showroom.\n\nThe code, in Listing 13.1, shows code for the Jewelry.html\
    \ file of the application:\n\nListing 13.1: Jewelry.html\n\n```\n<html>\n<head>\n\
    <script language = \"javascript\">\n  var XMLHttpRequestObject = false;\n  if\
    \ (window.XMLHttpRequest) {\n    XMLHttpRequestObject = new XMLHttpRequest();\n\
    \  } else if (window.ActiveObject) {\n    XMLHttpRequestObject = new ActiveXObject(\"\
    microsoft.XMLHTTP\");\n  }\n\n  function getData(dataSource) {\n    var obj =\
    \ document.getElementById(div);\n    XMLHttpRequestObject.open(\"GET\", dataSource);\n\
    \n    XMLHttpRequestObject.onreadystatechange = function () {\n      if (XMLHttpRequestObject.readyState\
    \ == 4 &&\n          XMLHttpRequestObject.status == 200) {\n        obj.innerHTML\
    \ = XMLHttpRequestObject.responseText;\n      }\n    }\n  }\n```\n\n354"
