    # Security Issues


    There are mainly two security issues in servlets, which are as follows:


    +   1. It is not secure to send and receive data by using cookies. Since everyone
    can view and modify the data in cookies.


    +   2. When we send the information to server using the `doGet()` method, the
    user information is being visible in browser. So, it is not secure to use the
    `doGet()` method to send the information to server.


    # Summary


    In this chapter, you have learned about Tomcat server, Java Servlet, Servlet container,
    and various Servlet container configurations. You have also described the commonly
    used classes and interfaces of the Servlet 2.5 API. You have also learned the
    details of the Servlet life cycle and the life cycle methods, such as `init()`,
    `service()`, `destroy()`. Next, you created an application, which describes the
    life cycle process of Servlet. Next, you have learned the working and purpose
    of Servlet initialization parameters. You have also learned the `HttpServletRequest`
    and `HttpServletResponse` interfaces along with their various methods, with examples.
    Next, you have learned the for session tracking, various approaches of session
    tracking, their advantages and disadvantages, and when to use these approaches.
    Finally, at the end of the chapter you have learned the cookie approach for session
    tracking.


    262'
