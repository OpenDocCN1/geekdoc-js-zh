  md: '# Web Servers and Servlets


    Information Services (IIS) Web server for Web server functionalities and the server-side
    extensions to be developed in the form of Servlets, you can configure the Tomcat
    Servlet container to run inside the IIS Web server. In this case, the Tomcat Servlet
    container runs inside the IIS Web server process and the IIS Web server passes
    the Servlet-specific requests to the Tomcat container by using Java Native Interface
    (JNI) calls.


    Let''s learn about the out-process containers.


    # Out-Process Containers


    The out-process containers are used in the following cases:


    +   - Non-validity of the Servlet container that supports a specific Web server.

    - Web server does not provide any support for integrating a Servlet container.

    - Need to run both container and Servlets in a different process or on different
    systems.


    In this case, we need to configure the Servlet container to run outside the Web
    server process. In this case, the Web server uses the Inter-Process Communication
    (IPC) mechanism, such as TCP/IP, to communicate with the Servlet container.


    This configuration even allows us to distribute the load between different processes.
    For example, all static page requests can be processed by one process (Web server
    process) and dynamic page requests by another process (Servlet container process),
    as shown in Figure 9.4


    ![](img/ff578e59567ce41d5431f36224872e10_246_0.png)


    Figure 9.4 shows a separate Web server and a separate Servlet container connected
    with the help of a connector (the HTTP protocol). The interaction between the
    Servlet container and the client request is similar to the in-process configuration.


    # Introducing the Servlet API


    The Servlet API is part of a Java specification design by Sun - JCP. This API
    is supported by all Servlet containers, such as Tomcat and WebLogic. This API
    contains classes and interfaces that define a standard contract between the Servlet
    class and Servlet container (or Servlet engine). These classes and interfaces
    are packaged in the following two packages of the Servlet API.


    +   - java.servlet

    - java.servlet.http


    Let''s learn these two packages in detail.'
