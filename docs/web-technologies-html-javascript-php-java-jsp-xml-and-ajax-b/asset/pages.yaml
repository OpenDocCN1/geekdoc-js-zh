    # Working with Control Flow Statements


    The scripts in JavaScript are sequentially executed in a top-down manner, which
    means that the first statement in the script is the first to be executed and the
    last statement in the script is the last to be executed. This is the simplest
    and most straightforward way to execute scripts. However, if you want to change
    the sequence in which script statements are executed, you can use the control
    flow statements.'
