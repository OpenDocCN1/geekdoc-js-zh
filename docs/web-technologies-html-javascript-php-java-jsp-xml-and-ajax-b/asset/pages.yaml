    # Introducing PHP


    PHP is a server-side scripting language embedded in html. An acronym for PHP is
    hypertext preprocessor. It is based on C Under operating system and is made by
    taking the features of Perl and UNIX scripting language. It is set of library
    routines includes a collection of UNIX system calls and interfaces to many databases,
    Oracle, MySQL: etc. Several organizations use it it runs on different platforms,
    like Windows, UNIX, and Linux, etc. and supports various databases MySQL, Oracle,
    Imbase, etc.


    PHP consists of different types of variables, arrays, functions, and control structures,
    while, for etc. A PHP file is saved with the extensions < .php, .php2, .phtml,
    .php3, .php4, .php5, .php7 A PHP file can have text, HTML tags, and scripts. These
    scripts are executed on PHP enabled server. PHP scripts are embedded inside HTML
    page using <?php ?> tags, but some servers use and understand <? ?> Each PHP statement
    must end with a semicolon.


    The code in Listing 13.5 uses the use of echo statement


    Listing 13.5: Using echo statement


    ```

    <html>

    <title>An echo statement example</title></head>

    <body>

    <h1>An echo statement example</h1>

    <?php

    echo "Hi from PHP";

    ?>

    </body>

    </html>

    ```


    An echo statement is used to display the text on the browser by PHP. This text
    is treated as XML, by the browser, therefore set the content-type header to text/xml
    by using the header statement.


    # Variables


    Variables are used to store different types of data. Variables in PHP are similar
    to those in JavaScript. They can hold numbers, arrays, or objects. Each PHP variable
    begins with a dollar sign character, $. No declaration of variable is required.
    We can pass several items to the echo statement, with each separated by a comma.
    To introduce HTML, like indentation, <br> or <p> tags are sent as item. Text strings
    are assigned to a variable by using following syntax:


    ```

    $Svar str="Hi from PHP.";

    ```


    # Strings


    A string is a collection of characters. We can perform many operations with strings.
    Usually ''+'' is used to concatenate strings in PHP, more than one is concatenated
    with the dot operator. Table 13.2 lists


    | Function | Description |

    |---|---|

    | trim | It eliminates extra spaces from start and end of a string |

    | substr | It picks substring from a string |

    | strpos | It locates position of substring in a |

    | ucfirst | It capitalizes the first letter of string |


