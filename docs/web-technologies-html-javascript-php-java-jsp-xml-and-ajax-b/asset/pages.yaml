  md: "# Chapter 13\n\nHere, in this application, the URL from the data you want to\
    \ fetch is passed from the getData function as the dataSource argument. The URL\
    \ can be opened with the standard HTTP techniques, like GET or POST or PUT. This\
    \ example uses the GET method to request the respective text file on the server:\n\
    \n```\nXMLHttpRequest.open('GET', dataSource);\n```\n\nAfter opening the XMLHttpRequest\
    \ object, the XMLHttpRequest object has the property named onreadychange, which\
    \ handles the asynchronous operations. If this property is assigned to the name\
    \ of any JavaScript function, this function will be called each time the XMLHttpRequest\
    \ object's state changes.\n\nThis JavaScript function is also known as \"Callback\"\
    \ function. When the server returns with the information, the callback function\
    \ is invoked. In turn, the callback function can display the information to the\
    \ user. We defined the function XMLHttpRequestobj.onreadystatechange = function\
    \ ()\n\n```\n{\n  if (XMLHttpRequestobj.readyState == 4 &&\n    XMLHttpRequestobj.status\
    \ == 200) {\n    obj.innerHTML = XMLHttpRequestobj.responseText;\n  }\n}\n```\n\
    \nFinally, when the XMLHttpRequest object is in its ready state and the status\
    \ is equal to 200, then the data is fetched. The ready value \"0\" indicates that\
    \ the request is completed and the status 200 refers to the \"Ok\" five ready\
    \ states of the XMLHttpRequest object are as follows:\n\n+   * 0 for uninitialized\
    \ state\n* 1 for loading state\n* 2 for loaded state\n* 3 for interactive state\n\
    * 4 for the complete state\n\nThe status property holds the status of the download.\
    \ Table 13.1 lists some possible values of the status property.\n\n| Table 13.1:\
    \ Possible values for the status property XMLHttpRequest object |\n| Status |\
    \ Possible values |\n|---||\n| Ok | 200 |\n| Created | 201 |\n| No Content | 204\
    \ |\n| Reset Content | 205 |\n| Partial Content | 206 |\n| Bad request | 400 |\n\
    | Unauthorized | 401 |\n| Forbidden status | 403 |\n| Not Found status | 404 |\n\
    \n358"
