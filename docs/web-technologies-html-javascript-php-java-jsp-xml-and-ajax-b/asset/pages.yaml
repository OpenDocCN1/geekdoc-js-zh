  md: 'addHeader(java.lang.String name, java.lang.String value)– Adds a header with
    the given name and value. This method allows response headers to have multiple
    values.


    containsHeader(java.lang.String name)– Returns a Boolean, indicating that the
    named response header has been set.


    setHeader(java.lang.String name, java.lang.String value)– Sets a response header
    with the given name and value. The new value overwrites the previous one. This
    method can be used to test for the presence of a header before setting its value.


    setInt(java.lang.String name, int value)– Sets a response header with the given
    name and integer value. The new value overwrites the previous one. This method
    can be used to test for the presence of a header before setting its value.


    setDate(java.lang.String name, long date)– Sets a response header with the given
    name and date. The date is specified in milliseconds. The new value overwrites
    the previous one. This method can be used to test for the presence of a header
    before setting its value.


    addInt(java.lang.String name, int value)– Adds a response header with the given
    name and integer value. This method allows response headers to have multiple values.


    addDate(java.lang.String name, long date)– Adds a response header with the given
    name and date. The date is specified in milliseconds. This method does not override
    the previous response header and allows response headers to have multiple values.


    Optional HTTP headers that can be set by `HttpServletResponse` objects:


    Table 9.3: HTTP Headers and Their Values

    | Header | Header value |

    |---|||

    | Age | Represents a positive integer representing the elapsed time since the
    response was generated from the server. |

    | Content-Length | Indicates the size of the message body, in decimal of octets
    (8-bit bytes), which is sent to the recipient. |

    | Content-Type | Represents the MIME type corresponding to the content of the
    HTTP response. A browser to determine if the content should be rendered internally
    or launched for an external extension uses this value. |

    | Date | Represents the date and time when the message originated. |

    | Location | Specifies the location of a resource, as the absolute URL Some HTTP
    response codes redirect a client to a new resource. |

    | Pragma | Includes implementation-specific details that may apply to any recipient
    along the request-response chain. The most used value is no-cache, indicating
    a resource should not be cached. |

    | Retry-After | Indicates how long the service is expected to be unavailable to
    the requesting client, if it is used with a 503 (Service Unavailable). The field
    of this field can be a date or an integer number of seconds (in decimals) after
    the time of the response. |

    | Server | Represents a String for the information about the server generating
    a response. |


    It is important to note that you need to set the Content-Type header to text/html
    when a Servlet is sending back HTML content. For other formats, the appropriate
    MIME type should be set.'
