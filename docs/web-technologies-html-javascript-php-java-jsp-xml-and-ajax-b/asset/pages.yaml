  md: "Output:\n\nIn the preceding listing, the function is named book_Name(), that\
    \ has a single argument $name and its body contains a single statement, which\
    \ uses echo to print the name of the book.\n\n# Returning Value from a Function\n\
    \nYou can return a value to the caller function, using the return $value statement.\
    \ Execution control is transferred to the caller function immediately after the\
    \ return statement. If there are other statements in the function after the return\
    \ statement, they will not be executed. Listing 5.2 shows how to return a value\
    \ from a function:\n\nListing 5.2: Returning Value from a Function\n\n```\nphp\n\
    //Function definition\nfunction get_year() {\n    $year=date(\"Y\");\n    return\
    \ $year; // returns to the calling function in our case echo function\n}\necho\
    \ \"This year is: \" . get_year();\n\n```\n\nOutput: This year is 2009\n\nIn the\
    \ preceding listing, we declare a function get_year() that returns the output\
    \ Year is 2009 to the caller function.\n\n# Understanding the Variable Scope\n\
    \nA key concept to user-defined function in PHP is variable scope; the extent\
    \ of a variable's visibility within the space of a PHP program. By default, variables\
    \ defined within a function are local. A local variable is restricted to the function\
    \ space alone, and it can't be viewed or manipulated outside the function in which\
    \ it is declared. Listing 5.3 shows the scope of a local variable:\n\nListing\
    \ 5.3: Defining the Variable Scope\n\n```\nphp\n//Function definition\n//change\
    \ the value of $score\nfunction change_score() {\n    $score=20; //local variable\n\
    }\n//Define variable in the main program\n$score=40;\necho \"Score is: \" . $score;\n\
    //run the change_score(); //Output: Score is: 40\nchange_score();\n//print $score\
    \ again\necho \"Score is: \" . $score; //Output: Score is: 40\n\n```\n\nHere,\
    \ $score is defined in the main program, and the change_score() function contains\
    \ code to change the value of $score. However, after running this function, the\
    \ $score remains in its original setting, because the changes made to $score within\
    \ the change_score() function remain \"local\" to"
