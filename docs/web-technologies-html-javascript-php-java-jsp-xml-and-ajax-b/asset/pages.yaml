    # Exploring Directive Tags


    Directive tags are used to give directions to the JSP translator during the translation
    stage of the JSP life-cycle. These tags are used to set global values such as
    class declarations, methods to be implemented, output content type, and so on.


    # Types of Directive Tags


    According to the JSP specifications, three standard directive tags are available
    with all JSP compliant containers. These directive tags include:


    +   - page

    - include

    - taglib


    Let''s discuss all of these directives in detail.


    # The Page Directive Tag


    The page directive tag holds the instructions used by the translator during the
    translation stage of the JSP life cycle. These instructions affect the various
    properties associated with the JSP page. You can use a page directive multiple
    times in a JSP page. However, it is often good programming style to place the
    page directive at the start of the JSP page. The syntax of the page directive
    is as follows:


    ```

    <@page attributes %>

    ```


    The XML syntax for the page directive is as follows:


    ```

    <jsp:directive.page attributes/>

    ```


    There are total 11 attributes that can be used in the page directive tag. These
    attributes are listed in Table 11.1:


    Table 11.1: Attributes of Page Directive

    | Attribute | Value |

    |---||

    | Language | Takes the scripting language as the value to be used in scripting
    tags. The default value is Java. |

    | Import | Takes comma separated list of Java classes as the value. |

    | extends | Takes a complete qualified class name by the servlet equivalent class
    written by the translator of the current JSP page. |

