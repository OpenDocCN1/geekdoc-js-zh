  md: "# AJAX A New Approach\n\nThe code given in Listing 13.31 presents a structure\
    \ of SOAP Message:\n\n**Listing 13.31**: Structure of SOAP Message\n\n```\n<?xml\
    \ version=\"1.0\"?>\n<soap:Envelope>\n  xmlns:soap=\"http://www.w3.org/2001/12/soap-envelope\"\
    \n  soap:encodingStyle=\"http://www.w3.org/2001/12/soap-encoding\">\n  ...\\n\
    \  <soap:Header>\n    ...\\n  </soap:Header>\n  <soap:Body>\n    <soap:Fault>\n\
    \      ...\\n    </soap:Fault>\n  </soap:Body>\n</soap:Envelope>\n\n\n```\n\n\
    From seeing this structure, we can deduce that the SOAP message consists of the\
    \ following elements:\n\n+   - Envelope element\n- Header element\n- Body element\n\
    - Fault element\n\nWe will explain them one by one.\n\n# The Envelope Element\n\
    \nThe Envelope element is the root element of a SOAP message and is an essential\
    \ element. It recognizes XML document as a SOAP message.\n\nThe code given in\
    \ Listing 13.32 explains how an envelope element looks like:\n\n**Listing 13.32**:\
    \ an envelope element\n\n```\n<?xml version=\"1.0\"?>\n<soap:Envelope>\n  xmlns:soap=\"\
    http://www.w3.org/2001/12/soap-envelope\"\n  encodingStyle=\"http://www.w3.org/2001/12/soap-encoding\"\
    >\n  Message information goes here\n</soap:Envelope>\n\n```\n\nThe xmlns:soap\
    \ namespace must have the value http://www.w3.org/2001/12/soap-envelope, otherwise\
    \ the application throws an error and does not accept the message. Any SOAP element\
    \ can have encodingStyle attribute. It defines data types used in the document.\n\
    \n# The Header Element\n\nThe Header element contain application-related information\
    \ about SOAP message. It is an optional element and should be the first sub-element\
    \ of envelope element, if included. The Header element can have attributes, which\
    \ specify which the recipient processes the message. Header elements act as contracts\
    \ between the sender and the receiver. The attributes of Header element are as\
