    # # Introducing Session Tracking


    A session is a collection of HTTP requests, over a period of time, between a client
    and a server. The lifetime of a session specifies the period of time until the
    session is active. When a session expires, the session is destroyed, and its resources
    are returned to the Servlet engine.


    Session tracking, also known as session management, is used to maintain the state
    of a user within a session. In other words, session tracking is a means to keep
    track of session data, which represents the data being transferred between a client
    and a server. Session tracking is managed in the Web application or by the Web
    container as the, since HTTP is stateless, each time a client opens a connection
    for a Web page, the HTTP adapter at client does not automatically maintain appropriate
    information about a client, such as its IPAddress and the port number. Even with
    servers that support (keep-alive) HTTP connections and keep a socket open for
    multiple requests that occur close together in the same session, there is no built-in
    support for maintaining client information.


    Session tracking is used when session data from one session may be required by
    a server to complete specific operations in the same session. For example, suppose
    you are shopping on an online book store. You access the online book store Web
    site and add items to the shopping cart. When you proceed for checkout and payment,
    the Web server must have the information about the books or items you added to
    the shopping cart. Without this information, the Web server will not be able to
    generate the required invoice and the online shopping process will not be completed.
    The information required by the Web server, in this example, is session data.


