  md: "# AJAX A New Approach\n\nThis functionality comes in the form of server-side\
    \ packages. These server-side AJAX packages automatically create JavaScript code\
    \ for you. Alternative packages also exist in server-side languages, such as JSP\
    \ AJAX integration with other technologies in these frameworks can be performed\
    \ in many ways, such as visual tools, using jQuery, and OR remoting.\n\nMany PHP\
    \ Frameworks are available, AJAXCore, Cake PHP, Sajax, XOAD, Zephyr, Feather AJAX,\
    \ and Tier1, to integrate AJAX with PHP. All these frameworks make making and\
    \ deployment of Web applications easy. These frameworks support Model, View, and\
    \ Controller (MVC) architecture and are free from repeating the same code and\
    \ common functions that are used for different projects.\n\nThe Sajax is an AJAX\
    \ Framework, which generates AJAX-enabled JavaScript from many server-side languages,\
    \ like ASP, ColdFusion, Lua, Perl, PHP, and Ruby on server-side. This is a framework\
    \ that lets you build user interface to server-side methods. Binding happens by\
    \ using JavaScript methods that call the Ajax bridge for extending server-side\
    \ methods. This framework uses the Object Remoting technique. In this technique,\
    \ the object enables changes and the client-side methods are tied to the server-side\
    \ objects in matters that the network call round trip between the current entities.\
    \ In fact, network round trips involved and messages are sent via server oriented\
    \ objects. Ajax exposes its functionality via object broker, Sajax-based application\
    \ is efficient at development time and slower at runtime.\n\nNow let's understand\
    \ the working of Sajax using a simple example. This example generates JavaScript\
    \ from function on the server-side that manipulates data and returns result to\
    \ another JavaScript function on client. The home page, web page, say add.php,\
    \ of this example has three fields and one submit button. The user after entering\
    \ two values in the first two fields, clicks on Submit button, the result will\
    \ be displayed in third field text.\n\nFor Sajax functionality, you have to include\
    \ Sajax in add.php and set up Sajax using ajax_init() method. This page also contains\
    \ a user-defined function, which adds values entered by the user. To access this\
    \ function in JavaScript by another name, we need to export this method. The export\
    \ method enables you to access AJAX method using name x_add. Listing 13.13 shows\
    \ the part of add.php page:\n\n**Listing 13.13:** Portion of add.php\n\n```\n\
    <require(\"sajax.php\");\nfunction add($op1, $op2) \n{\n    return $op1 + $op2;\n\
    }\nsajax_init();\nsajax_export(\"add\");\nsajax_handle_client_request();\n?>\n\
    ```\n\nIn the end of Listing 13.13, handle_client_request method connects the\
    \ add function with Ajax and generates JavaScript. You can embed generated JavaScript\
    \ code in web page using the sajax_javascript method. It is done using following\
    \ syntax:\n\n```\n<script>\n<\nsajax_show_javascript();\n?>\n</script>\n```\n\n\
    When a user clicks on Submit button, the function corresponding to onclick event\
    \ invokes x_add generated JavaScript function in turn calls add function on server-side.\
    \ Listing 13.14 shows the complete add.php page including code-snippet:\n\n365"
