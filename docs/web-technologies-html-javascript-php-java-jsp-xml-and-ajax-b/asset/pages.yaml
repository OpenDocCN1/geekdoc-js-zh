  md: "# AJAX A New Approach\n\nTable 13.1: Possible values for the status property\
    \ of XMLHttpRequest\n| Status | Possible values |\n|---|---|n| Method Not Allowed\
    \ | 405 |\n| Not Acceptable | 406 |\n| Proxy Authentication Required | 407 |\n\
    | Request Timeout | 408 |\n| Length Required | 411 |\n| Requested Entity Too Large\
    \ | 413 |\n| Requested URL Too Long | 414 |\n| Unsupported Media Type | 415 |\n\
    | Internal Server Error | 500 |\n| Not Implemented | 501 |\n| Bad Gateway | 502\
    \ |\n| Service Unavailable | 503 |\n| Gateway Timeout | 504 |\n| HTTP Version\
    \ Not Supported | 505 |\n\nSo, to make sure the data is completely downloaded,\
    \ the value for the status property must be 200. Finally, when the data is completely\
    \ downloaded, it is retrieved in either the standard HTML or the XML format. Here\
    \ the `responseText` property is used to retrieve it in standard HTML format.\
    \ However, if your data is formatted as XML then `responseXML` property is used.\n\
    \nAfter retrieving the data, you have to display the data on the web page. The\
