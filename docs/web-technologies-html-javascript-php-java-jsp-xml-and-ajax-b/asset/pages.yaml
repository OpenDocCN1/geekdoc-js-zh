  md: 'Chapter 7


    # The &lt;xsl:attribute&gt; Element


    The &lt;xsl:attribute&gt; element is used to create attribute node and add it
    to the element.


    Syntax: &lt;xsl:attribute&gt; is as follows:


    ```

    &lt;xsl:attribute name="nameofattribute" namespace="URI" &gt;

    &lt;!-- Content:template --&gt;

    &lt;/xsl:attribute&gt;

    ```


    Attributes


    Table 7.13 lists the attributes used by this element:


    | Name | Value | Meaning |

    | --- | --- | --- |

    | name (mandatory) | Name | It is the name of the attribute to be generated |

    | namespace (optional) | URI of namespace | It is the namespace URI of the generated
    attribute |


    # The &lt;xsl:attribute-set&gt; Element


    This element is one of the starting elements of an XSL stylesheet and is used
    to define a set of attributes and values. The resulting attribute can be applied
    as a whole to any output element.


    Syntax: &lt;xsl:attribute-set&gt; is as follows:


    ```

    &lt;xsl:attribute-set template="name" use-attribute-sets="namelist" &gt;

    &lt;!-- Content:template --&gt;

    &lt;/xsl:attribute-set&gt;

    ```


    Attributes


    Table 7.14 lists the attributes used by this element:


    | Name | Value | Meaning |

    | --- | --- | --- |

    | name (mandatory) | Name | It is the name of the attribute to be generated |

    | use-attribute-sets (optional) | Whitespace-separated list of attribute-sets
    | It is the list of named attribute sets containing attributes to be added to
    this output element |


    # The &lt;xsl:value-of&gt; Element


    This element is mostly used for writing text to a root tree. It is used for constructing
    a Text node and extracting the value of a node.


    Syntax: &lt;xsl:value-of&gt; is as follows:


    ```

    &lt;xsl:value-of&gt;

    select="expression"

    disable-output-escaping="yes|no" /gt;

    ```


