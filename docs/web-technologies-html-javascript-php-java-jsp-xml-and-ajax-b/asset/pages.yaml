  md: "# Chapter 5\n\nthe function and do not reflect in the program. The global keyword\
    \ helps use the same variable everywhere in your code, even inside the functions.\
    \ Listing 5.4 shows the use of a global variable:\n\n**Listing 5.4:** Using the\
    \ Global Variable\n\n```\n<?php\n//function definition\n//change the value of\
    \ $score\nfunction change_score() {\n    $global $score=20;                  \
    \             //global variable\n    //define a variable in the main program\n\
    \    $score=40;\n    echo \"score is: $score\";                              \
    \ //Output: Score is: 40\n    run $change_score() function\n    change_score();\n\
    \    //print $score again\n    echo \"score is: $score\";                    \
    \           //Output: Score is: 20\n?>\n```\n\nHere, the *global* keyword changes\
    \ the scope of the variable, *$score* increasing its scope to encompass the entire\
    \ program. As a result, changes made to a variable within the *change_score()*\
    \ function reflect in the main program.\n\n# Passing Arguments by Reference\n\n\
    An alternative to returning a result or using a *global* variable is to pass a\
    \ reference to a variable as an argument to the function. This means that any\
    \ change made to the variable within the function affects the original variable.\n\
    \n**Listing 5.5:** Passing Arguments by Reference\n\n```\n<?php\n//function definition\n\
    //change the value of $score\nfunction change_score(&$score) {               \
    \                //$score as an argument\n    $score+=20;\n    //define a variable\
    \ in the main program\n    $score=40;\n    echo \"score is: $score\";        \
    \                       //Output: Score is: 40\n    run $change_score(); function\n\
    \    change_score();\n    //print $score again\n    echo \"score is: $score\"\
    ;                               //Output: Score is: 60 ?>\\?>\n```\n\nThe difference\
    \ between Listing 5.4 and 5.5 is that the parameter *$score* is prefixed with\
    \ an ampersand (&). This means a reference of the original variable is passed\
    \ as the parameter, not the value of the variable. The result is that the changes\
    \ made to *$score* in the *change_score()* function affect the original variable\
    \ *$score* outside the function.\n\n# Built-in Functions in PHP\n\nPHP offers\
    \ several built-in functions that can be used in your code. These functions are\
    \ well documented and very helpful in achieving programming goals."
