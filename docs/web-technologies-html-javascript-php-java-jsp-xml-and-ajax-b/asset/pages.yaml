  md: "# Chapter 11\n\n+   Flush - takes true or false, which indicates if the buffer\
    \ needs to be flushed before including the resource. If the value is true, the\
    \ buffer is flushed including the resource. The default value of this attribute\
    \ is false. After the include action is completed, the JSP continues to process\
    \ the rest of the JSP page.\n\n# Describing the Forward Tag\n\nThe jsp:forward\
    \ takes a JSP request to another resource, which can be static or dynamic. If\
    \ the resource is dynamic, we can use a jsp:param tag to pass the name and value\
    \ of the parameter to the resource. We can use the page directive with buffer=\"\
    none\" to specify that the output of the JSP page should not be buffered.\nIf\
    \ the output stream is not buffered, and content has been written to it, a jsp:forward\
    \ action throws a IllegalStateException. The exception in JSP works with the forward()\
    \ method of RequestDispatcher. The following code snippet shows the use of jsp:forward\
    \ action in a JSP page:\n\n```\n<jsp:forward attributes>\n  <jsp:param zero or\
    \ more jsp:param tags />\n</jsp:forward>\n```\n\nThe jsp:forward action takes\
    \ a attribute to specify the page to which the current request is to be forwarded.\
    \ The page attribute takes the relative URL to which the request has to be forwarded.\
    \ This allows an expression that evaluates to a String equivalent to the relative\
    \ URL that locates the resource. We can specify the relative URL directly or by\
    \ using an expression. The following snippet shows the use of the attribute in\
    \ jsp:forward action:\n\n```\n<jsp:forward page=\"header.jsp\" />\n<jsp:forward\
    \ page=\"mypath.jsp\" />\n```\n\nThe URL cannot contain a protocol name, port\
    \ number, or domain name. If the given URL is relative to the context path; else,\
    \ relative to the JSP page. After the forward action is completed, the JSP does\
    \ not continue processing the rest of the JSP page.\n\n# Describing the Param\
    \ Tag\n\nThe jsp:param allows us to pass a name and value parameter to a dynamic\
    \ resource, while including it in a JSP page or forwarding a request from a JSP\
    \ page to another JSP. The jsp:param tag can be used to pass parameters to an\
    \ applet configured on JSP page by using the jsp:plugin tag. The following syntax\
    \ shows the use of the param tag in a JSP page:\n\n```\n<jsp:param attributes=\"\
    \ />\n```\n\nWe can use more than one jsp:param tag to pass more than one parameter.\
    \ The param action tag contains two attributes, name and value, which are in the\
