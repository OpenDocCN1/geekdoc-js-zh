  md: "# Deploying Java Beans in a JSP Page\n\nYou can declare it in a JSP page using\
    \ <jsp:Bean> tag. To declare the Bean in a JSP, you have to create a JSP page.\
    \ In Listing 12.13, we have created a JSP page with the name RegProcess\n\nListing\
    \ 12.13: RegProcess.jsp\n\n```\n<html>\n@page errorPage=\"Registration.html\"\n\
    <body>\n<jsp:useBean name=\"form\" class=\"kogent.jsp.RegForm\" session=\"session\"\
    \ />\nThis is the JSP action tag used to declare bean /\n<jsp:setProperty name=\"\
    form\" property=\"name\" />\n<form action=\"RegProcessFinal.jsp\">\n  First Name\
    \ : <input type=\"text\" name=\"first_name\" />\n  Address : <input type=\"text\"\
    \ name=\"address\" />\n  Password : <input type=\"text\" name=\"password\" />\n\
    \  <input type=\"submit\" value=\"Register\" />\n</form>\n</body>\n</html>\n```\n\
    \nThe <jsp:useBean> action creates an instance of a bean based on the attributes\
    \ in the JSP page. The attributes of the <jsp:useBean> tag used here include:\n\
    \n+   - Id - Specifies the name of the bean that you want to declare\n- Class\
    \ - Specifies the name of the Bean class, which helps the JSP searching in the\
    \ bean class and creating an instance.\n- Scope - Specifies the scope of the bean\n\
    \nAll these attributes help the <jsp:useBean> action tag to create an instance\
    \ of the Bean class. It has fewer attributes along with the existing attributes.\
    \ You can also specify these attributes to make the Bean more specific.\n\n# Accessing\
    \ the Bean Properties\n\nYou can verify the bean using the <jsp:getProperty> action\
    \ tag. The <jsp:getProperty> action tag uses the name and property tags to read\
    \ the Bean properties. We have created ViewRegistrationDetails.jsp page in this\
    \ application to demonstrate how the <jsp:getProperty> action is used to read\
    \ the Bean property, as shown in Listing 12.14:\n\nListing 12.14: ViewRegistrationDetails.jsp\n\
    \n```\n<jsp:useBean id=\"form\" type=\"kogent.jsp.RegForm\" session=\"session\"\
    />\n@page errorPage=\"Registration.html\"\n<body>\n  User Name : <jsp:getProperty\
    \ name=\"form\" property=\"username\" />\n  Password : <jsp:getProperty name=\"\
    form\" property=\"password\" />\n  Email ID : <jsp:getProperty name=\"form\" property=\"\
    email\" />\n  First Name : <jsp:getProperty name=\"form\" property=\"firstName\"\
    \ />\n  Last Name : <jsp:getProperty name=\"form\" property=\"lastName\" />\n\
    \  Address : <jsp:getProperty name=\"form\" property=\"address\" />\n<form method=\"\
    post\" action=\"javascript:alert('The remaining process is under development');\"\
    \ />\n<input type=\"submit\" value=\"Register\" />\n```"
  merge: -1
  pgno: 361
- img_proc: true
  md: "# Database Access\n\n```\n</form>\n<body>\n<html>\n```\n\nBefore reading the\
    \ Bean properties, the JSP container needs to load the instance of the Bean class\
    \ that was created. After the JSP container contains the instance of the Bean,\
    \ it starts reading the Bean properties using the <jsp:getProperty> tag. You can\
    \ see the attributes used with <jsp:getProperty> tag (Listing 12.14). The name\
    \ attribute specifies the name of the Bean class to the JSP container and the\
    \ property attribute specifies the Bean properties that have to be read as JSP\n\
    \n# Generating Dynamic Content within a JSP\n\nThe next step is to create an HTML\
    \ page called Registration.html to retrieve the required data from users. The\
    \ Registration.html page contains a button called Register. When a user clicks\
    \ the Register button after providing all user details, he/she is directed to\
    \ the RegProcess JSP page to set the properties of <Reg> JavaBean based on the\
