  md: '# Quick Revise


    Q9. What are the advantages of PHP over other scripting languages?


    Ans. PHP is one of the most popular server-side scripting languages used for creating
    dynamic web pages. One of the reasons for its popularity is that it offers many
    advantages over most of the scripting languages that are currently used. Now,
    let''s discuss some of the advantages that the PHP offers over the following languages:


    +   - Active Server Pages (ASP)

    - Cold Fusion

    - Practical Extraction and Report Language (Perl)

    - Java Server Pages (JSP)


    Active Server Pages (ASP) is a scripting language that is only available by Microsoft
    Internet Information Systems (IIS). This limits its availability to Win32 based
    servers, whereas PHP scripting is supported by almost all the Web servers. In
    comparison to PHP, ASP is slower, less stable and less secure. PHP works with
    Apache, which has a proven record of speed, reliability and hardened security.


    PHP runs on almost every platform; whereas, Cold Fusion is designed for non-programmers.
    As compared to Perl, PHP is a faster, more efficient and more stable language.


    The main advantage of PHP over Perl is that PHP was designed for the Web servers,
    whereas Perl was designed to handle complex tasks, which is complicated. PHP is
    easier to integrate with the HTML language than Perl. As compared to Perl, PHP
    is easy to learn and has a smaller learning curve. No prior knowledge of programming
    languages is required to learn PHP; whereas Perl requires some knowledge of C
    and shell scripting.


    PHP is supported on any platform that is equal or over 32 bits; whereas, JSP is
    supported only by those platforms that have a Java Virtual Machine. In addition,
    the performance of PHP is almost five times faster than JSP.


    Q10. List the various features of PHP


    Ans. The following are some of the important features of PHP:


    +   - Access control - Provides a built-in Web-based configuration to handle access
    control configuration. Upon detecting the client''s browser, e-mail address, or
    the referring document, various restrictions are applied on the Web pages, such
    as password protected, completely restricted, and logging disabled.

    - File upload support - Allows users to upload files to a Web server. PHP provides
    the Multipart Internet Email Extensions (MIME) denoting to process the files onto
    a server.

    - HTTP-based authentication control - Allows the user to create customized HyperText
    Transfer Protocol (HTTP) HTTP-based authentication mechanisms for the Web-server.

    - Variables, arrays, and objects - Allows the use of variables, arrays, and associative
