    A disconnected RowSet makes a connection to a data source only to read data from
    it, the RowSet object or write data back to the data source. After reading or
    writing data to its data source, the RowSet object disconnects from connect to
    its data source, the object reads and writes data independently. The disconnected
    RowSet objects are serializable as well as lightweight wrappers around a JDBCRowSet
    or ResultSet. However, the disconnected RowSet objects are efficient for threads.
