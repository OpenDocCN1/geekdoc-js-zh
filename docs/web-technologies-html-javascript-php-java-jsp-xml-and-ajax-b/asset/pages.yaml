    \ the web page.\nAny of these three are downloaded by the server, which is in\
    \ the background, while the user is using with the rest of the web page. Read\
    \ further to understand how this is done.\n\n# Creating the XMLHttpRequestObject\n\
    \nThe application created here creates the XMLHttpRequest object. In Listing 13.1,\
    \ towards the beginning of Jewelry; html code, locate the following code snippet:\n\
    \n```\n<script language = \"javascript\">\n  var XMLHttpRequestobj = false;\n\n\
