    # Chapter 7


    +   Q1. What is XML?

    A. Extensible Markup Language (XML) is a markup language based on simple, platform-independent
    rules for processing and displaying textual information in a structured way. The
    platform-independent nature of XML makes an document an ideal format for exchanging
    structured textual information among different applications. XML provides customized
    tags to format and display textual information. XML documents represent data in
    a platform-neutral manner. For example, an XML document generated by an application
    running on Microsoft Windows can be easily consumed by an application running
    on Solaris.


    +   Q2. What is DTD?

    D is the acronym of Document Type Definition, which is used to define the XML
    document structure with a list of elements and attributes. It defines rules and
    attributes, which decide how to use tags in an XML document. A DTD can be declared
    either within an XML document, or can be used as an external reference.


    +   Q3. What is DOM?

    Object Model (DOM) is a platform and language independent convention for representing
    and interacting with objects in HTML, XHTML and XML documents. In DOM, objects
    are also called Elements, which are specified and addressed according to the syntax
    and rules of the programming language. These syntaxes and rules of the programming
    language are specified in the DOM Programming Interface (API).

    DOM presents an XML document as the tree-structure with the root node as the parent
    element and the elements, attributes, and text defined as the child nodes. With
    the help of the DOM tree, the elements containing the text and attributes can
    be manipulated and accessed. In a DOM tree, all the elements can be modified,
    deleted, or even removed. Note that, in a DOM, all the elements are called as
    nodes. The entire document is considered as the Document node. The XML tag or
    the XML element is recognized as the Element node. The text in XML is referred
    to as the Text node, the attributes are considered as the Attribute node and the
    comments are considered as the Comment node. In the DOM tree, the nodes have a
    hierarchical relationship with each other. The terms ''parent'' and ''child''
    are used to describe the relationships between nodes.


    +   Q4. What is SAX?

    AX is the acronym of Simple API for XML, which provides a mechanism to read data
    from an XML document. It is the serial access parser, which is an alternative
    of DOM. The SAX parser is the Event Driven parser. The user defines the set of
    callback methods which would be called when an event occurs during parsing. The
    following is the list of SAX events:

    * XML Text nodes

    * XML Element nodes


