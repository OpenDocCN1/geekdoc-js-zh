    # Introducing the Struts Framework


    Struts is the first version of the Struts Framework. With the changing technology,
    the need for new enhancements and changes was felt in the original design of Struts
    1. These changes include development of new and lightweight MVC-based frameworks,
    such as Spring, Tapestry, and so on, to enable rapid development of Web applications.
    Hence, it became necessary to modify the Struts Framework. Two new frameworks,
    Shale and Struts Ti were introduced in responding to the need for rapid development
    of Web applications. In March 2002, the Web framework was released. WebWork includes
    new ideas, concepts and functionality with the original code. In December 2005,
    WebWorks and the Struts Ti merged to develop Struts 2.


    Struts 2 has similar features to Struts 1, but the Struts 2 Framework has some
    architectural differences compared to Struts 1. In general, the Struts 2 Framework
    implements the MVC 2 architecture by centralizing the control using a front controller
    similar to Struts 1. However, the basic code of components and its configuration
    are quite different in Struts 2.


    # Explaining MVC 2 Design Pattern for Struts 2


    The Struts 2 Framework follows the MVC framework, where model, view, and controller
    components are represented by Action, Result, and FilterDispatcher classes, respectively.
    Figure 12.16 shows the implementation of the MVC pattern by Struts 2 components:


    ![](img/ff578e59567ce41d5431f36224872e10_365_0.png)


    Figure 12.16: Implementing the MVC Pattern in Struts 2


    As you can see in the figure, the following are the steps for the flow in Struts
    2:


    +   1. The user sends a request using a user interface provided by the view, which
    further passes this request to the controller by FilterDispatcher class in Struts
    2.

    2. The controller servlet receives the input request through the interface provided
    by the view, instantiates one of the suitable action class, and executes the different
    methods over this object.

    3. If the state of model is changed, all the associated views are notified about
    it.

    4. Next, the controller selects the new view to be displayed based on the result
    code returned by the action class.

    5. The view presents the user interface, the view queries about the state of the
    model to show the current data, which is retrieved from the action class.


    # The Need for Struts 2


    Struts 2 is created to streamline the entire development cycle of Web applications,
    which includes building, deploying, and maintaining these Web applications. Each
    Web application development framework has its


