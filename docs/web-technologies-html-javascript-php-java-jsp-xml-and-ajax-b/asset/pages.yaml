  md: "# Chapter 5\n\n```\n}\necho factorial(6);\n?>\n```\n\nOutput:\n\n720\n\nIn\
    \ the preceding listing, the factorial() function calls itself again and again\
    \ on a smaller version of the input and multiplies it by the result of recursive\
    \ call until it reaches the base condition. PHP supports the concept of variable\
    \ functions. If a variable name has parentheses appended to it, PHP searches for\
    \ a function with the same name. Variable functions can be used to implement callbacks,\
    \ function calls, and so forth. Listing 5.21 shows how to use the variable function:\n\
    \nListing 5.21: Variable Function\n\n```\n<?php\nfunction myfunc($msg) {\n   \
    \ echo $msg;<br />\";\n}\n$func_name = \"myfunc\";\n$func_name(\"This is a variable\
    \ function calling\");\n?>\n```\n\nOutput:\n\nThis is a variable function calling\n\
    \nIn the preceding listing, we call myfunc(), through use of variable $func_name,\
    \ that contains the actual name of the function and our message \"This is a variable\
    \ function calling\".\n\nCallback function returns to a function that is passed\
    \ to another function so that the second function can call it. This is the simple\
    \ way of making the second function more flexible. By passing different callbacks\
    \ you can get different behavior. Listing 5.22 shows how to use the callback function:\n\
    \nListing 5.22: Callback Function\n\n```\n<?php\n// This function sets a callback\
    \ function.\nfunction doit($callback) {\n    $data = \"This is my data\";\n  \
    \  callback($data);\n}\n// This is a sample callback function for doit().\nfunction\
    \ myCallback($data) {\n    echo $data . \"\\n\";n}\ndroit(\"mycallback\");\n//\
    \ call() to pass our callback function's name.\n?>\n```\n\nOutput:\n\nThis is\
    \ my data\n\nIn the preceding listing, we make a function named, doit() with an\
    \ argument $callback and we use this variable $callback as a variable function.\
    \ We make another function myCallback(). Now, when we call our doit() function\
    \ by passing the 'mycallback' as an argument, PHP looks for myCallback() function\
    \ and attempts to execute it. As a result, \"this is my data\" is printed on the\
    \ screen. In this section, you have learned to create and invoke the user-defined\
    \ functions and the built-in functions. In the next section, you learn to work\
    \ with a special type of variable, array.\n\n136"
