  md: '# Chapter 1


    that purely deal with style-related aspects, such as <u><center>, and <strike>
    have been deprecated

    W3C has recommended that in place of these HTML elements, their replacements should
    be by CSS.


    The syntax of CSS is slightly different from that of HTML. In contrast to the
    angle brackets (< and), equal signs, and quotation marks found in the HTML syntax,
    the CSS syntax curries braces, colons,

    semicolons. The syntax of a CSS rule is:


    ```

    selector{property1:value; property2:value; property3:value;}

    ```


    In the preceding syntax, selector is the element that defines, property1, property2,

    property3 are the properties (attributes) defined for that, property1-value, property2-

    and property3-value are values assigned to these properties. The portion of the
    styles enclosed

    within the curly braces is termed declaration.


    Using the preceding CSS syntax, we can create a CSS rule to set three background
    properties

    (background-color, background-image, and background-repeat) for the <body> element,
    as follows:


    ```

    body {background-color:#0000ff; background-image:url(c:Image.jpg);

    background-repeat:repeat-x}

    ```


    Notice that the preceding CSS rule also uses three properties (background-color,
    background-

    image, and background-repeat) for the <body> element. You can, however, set three

    properties one declaration, using the shorthand property named background. This
    shorthand

    is a CSS property that enables you to set two or more properties in one declaration
    as:


    ```

    body {background-color:#0000ff url(c:Image.jpg) repeat-x}

    ```


    In the preceding CSS rule, you can note that a shorthand property specifies two
    or more properties

    ating them with spaces.


    You can create cascading styles in a Web page in four ways:


    +   - Using inline styles

    - Using external style sheets

    - Using internal style sheets

    - Using style classes


    Let''s discuss these ways to create cascading styles, one by one.


    # Inline Styles


    In the Inline Styles method, for an HTML element, it is specified using its style
    attribute. Inline styles are\useful when you want to define styles for individual
    elements on a Web page.


