    # Using the confirm() Function


    The confirm() function is the advanced form of the alert() function. It is used
    to display a message and to return a true or false value. The confirm() function
    displays a dialog box with two buttons: OK and Cancel at the bottom of the message
    box. When you click the OK, the function returns true. When you click the Cancel,
    the function returns false. This allows you to interrupt your JavaScript process
    to ask the user and then continue processing on which button is clicked.


    Let''s create a Web page, named confirmFunction.html to understand how to use
    the confirm() function in a script. Listing 2.33 shows the code of the confirmFunction.html
    page:


