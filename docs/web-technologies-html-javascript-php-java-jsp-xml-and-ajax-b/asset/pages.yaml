  md: "# Chapter 7\n\nExtensible Markup Language (XML) is a markup language based\
    \ on simple, platform-independent rules for processing and displaying textual\
    \ information in a structured way. The platform-independent nature of XML makes\
    \ an XML document an ideal format for exchanging structured textual information\
    \ among different applications. In the recent years, XML has evolved as the de\
    \ facto standard for document markup. Since its advent, XML has been used to implement\
    \ various operations, as such:\n\n+   - Configuration information\n- Publishing\n\
    - Electronic Data Interchange (EDI)\n- Voicemail systems\n- Vector graphics\n\
    - Remote Method Invocation (RMI)\n- Object serialization\n\nXML provides customized\
    \ tags to format and display textual information. What makes XML an integral element\
    \ of enterprise computing is that text documents that have to be interchanged\
    \ across the world. You can include platform-neutral manner. For example, an XML\
    \ document generated by an application on Microsoft Windows can be easily consumed\
    \ by an application running on Sun Solaris.\n\n# Describing DTD\n\nDTD provides\
    \ a framework to validate XML documents. It defines the structure that the XML\
    \ documents must conform to. DTD defines the structure of an XML document with\
    \ a list of elements. DTD provides common rules to define the structure of the\
    \ XML document across the world. You can include DTD in an XML document either\
    \ by inlining it or as an external reference. The following code snippet shows\
    \ how to include DTD in an XML document:\n\n```\n<xml version=\"1.0\"?>n<!DOCTYPE\
    \ email [\n  <!ELEMENT email (to,from,heading,body)>\n  <!ELEMENT to (#PCDATA)>\n\
    \  <!ELEMENT from (#PCDATA)>\n  <!ELEMENT heading (#PCDATA)>\n  <!ELEMENT body\
    \ (#PCDATA)>\n]>\n<email>\n  <to>abc</to>\n  <from>xyz</from>\n  <heading>welcome</heading>\n\
    \  <body>welcome to our school</body>\n</email>\n```\n\nIn the preceding snippet,\
    \ the DTD code is defined using the <DOCTYPE> tag to define the structure of the\
    \ email, to, from, heading, and body.\n\nThe following code snippet shows how\
    \ to provide an external reference of DTD in an XML document:\n\n```\n<xml version=\"\
    1.0\"?>\n<!DOCTYPE email SYSTEM \"email.dtd\">\n<email>\n  <to>abc</to>\n  <from>xyz</from>\n\
    </email>\n```\n\n172"
