    show Servlet\n  Lifecycle)</title>\n</HEAD>\n<BODY>\n  <FORM ACTION=\"myFirstServlet\"\
    ><br/><br><br/>\n  <center>\n    <INPUT TYPE=\"submit\" value=\"Invoke\n    Life\
    \ Cycle servlet/\"\n  </center>\n</FORM>\n</BODY>\n</HTML>\n```\n\nNow, let's\
