  md: '# Chapter 12


    JSP technology is capable of connecting to the database. Its features are not
    only limited to accessing a database and displaying the records stored in a table.
    It also allows users to perform operations on the data that are specific to the
    application. The package java.sql package plays a major role in connecting to
    the database and maintaining that connection. With the connection established
    using the JSP page, the JDBC can connect to any kind of database from different
    vendors.


    Using JavaBeans with JSP makes it easy for handle data within Java. The Struts
    2 Web framework is based on the Model-View-Controller (MVC) architecture, and
    is used to build business-oriented Web applications. Before the introduction of
    Struts, there was no standard component to develop Java EE applications. The introduction
    of Struts framework supported the development of Web applications with its set
    of Application Programming Interfaces (APIs).


    This chapter takes you through database programming using JDBC and then explains
    the package most important for connecting to a database in Java. Then, you will
    learn to connect to a database from another database using a JSP page. Next, the
    application demonstrates application-specific database actions on a sample JSP
    page. Next, you learn to develop JavaBeans in a JSP page. The chapter ends with
    an introduction to the Struts framework.


    # Database Programming using JDBC


    You must have understood that JDBC API allows the JDBC driver to develop the SQL
    statements in execution. To execute SQL statements, you need to establish a session
    with which all the queries are executed. After understanding that JDBC driver
    is a process for communicating with the database using JDBC APIs, you might wonder
    about the access to the JDBC driver and establish a session. In addition, you
    might also wonder about the JDBC type that can be used to represent an open session.


    We use the Driver object to access the JDBC driver for establishing a session
    to a database. In addition, the java.sql.Connection is a JDBC object that represents
    the session opened to the database. Hence, as a first step to communicate with
    the database in a Java application, you need to perform several steps to establish
    a connection with a database. Figure 12.1 shows the basic steps involved in writing
    a database programming in java using JDBC.


    ![](img/ff578e59567ce41d5431f36224872e10_325_0.png)


    Figure 12.1: Basic Steps to Use JDBC


    Let''s discuss about the basic steps to implement JDBC in Java applications in
    detail.


    308'
