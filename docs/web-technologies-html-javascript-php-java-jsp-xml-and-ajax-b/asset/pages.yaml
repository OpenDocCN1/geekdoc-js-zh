  md: '# Running a PHP Script


    Save the script, shown in Listing 3.1, to a location under your Web server, and
    name it. In this case, we have named it `intro.php`. Then, enter this URL in your
    Web browser, and click the ENTER key. The PHP script runs, as shown in Figure
    3.1:


    ![](img/ff578e59567ce41d5431f36224872e10_112_0.png)


    Figure 3.1: Showing the PHP Script Page


    In Listing 3.1, first of all, you request the `intro.php` script. The Web server
    receives your request, recognizes that the file was a PHP script (by its extension),
    and hands it over to the PHP parser and interpreter for processing. This PHP interpreter
    reads the instructions inside the `<?php` tags, executes them, and passes the
    result back to the server, which in turn back to your browser. The echo statement
    is used to display output to the user. The Print statement can also be used to
    display output instead of the echo statement.


    The following points need to be kept in mind while working with a PHP script:


    +   - All PHP code must be enclosed within `<?php ?>` tags

    - Every PHP statement must be ended in a semicolon

    - Blank lines within the PHP tags are ignored by the parser

    - Single line comments must be preceded by the `//` characters, while multiple
    lines must be enclosed with `/* ... */` comment block


    # Working with Variables and Constants


    In PHP, Hypertext Preprocessor, variables and constants are used to store data
    so that programs can process correctly and efficiently. A variable can be defined
    as a symbolic name associated with a value, which can be changed during the execution
    of a program. The variable value can be numeric or alpha-numeric. On the other
    hand, constants are used to store values that cannot be changed during execution.


    # Using Variables


    As discussed, a variable can be considered as a labeled container that stores
    a value which can be changed during the execution of a program. As a general rule,
    variable names are easy to understand. Let''s discuss the naming rules and conventions
    for a variable.


    # Naming Rules and Conventions


    Every programming language has a set of rules for naming variables. The naming
    rules for PHP variables are as follows:


    +   - Every variable name must be preceded by the $ sign. For example, `$var`
    is valid but `var` is invalid.

    - A variable name must start with a letter or an underscore `_`. For example,
    `$_var`, `$var` are valid variable names but `$1var` is invalid.'
