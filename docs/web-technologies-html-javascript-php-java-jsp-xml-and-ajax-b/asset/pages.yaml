  md: "# Working with Functions and Arrays\n\n# String Manipulation Functions Strings\
    \ are one of the most important parts of the PHP language. Most textual data are\
    \ represented as strings, and many scripts are dedicated to processing, cleaning,\
    \ escaping, parsing, and transforming text. Let's discuss some built-in string\
    \ manipulation functions.\n\n# Getting the Length of a String\n\nThe strlen()\
    \ function returns the length of the string. Following syntax is used to define\
    \ the strlen() function:\n\n```\nint strlen ($string)\nParameters:\n  * string—Required.\
    \ The string being measured for length.\n  * Return—The length of the string on\
    \ success, and 0 if the string is empty.\n```\n\nListing 5.6 shows how to determine\
    \ the length of a string using the strlen() function: Listing 5.6: Getting the\
    \ Length of a String\n\n```\n<?php\n$string=\"Kogent\";necho \"the length of the\
    \ string is:\".strlen($string);\n```\n\nOutput:\nThe length of string is:6\nIn\
    \ the preceding listing, the explode() function returns the length of the string,\
    \ kogent.\n\n# Splitting the string into an Array\n\nThe explode() function breaks\
    \ a string into an array. Following syntax is used to define the explode() function:\n\
    \n```\narray explode(separator, string $string, limit)\nParameters:\n  * separator—Required.\
    \ Specifies where to break the string.\n  * string—Required. Specifies the string\
    \ to split.\n  * limit—Optional. Specifies the maximum number to return.\n```\n\
    \nReturn—If the separator is an empty string (\"\") explode() returns false. If\
    \ separator is not contained in the string then an array is returned.\n\nListing\
    \ 5.7 shows how to break a string into an array using explode() function: Listing\
