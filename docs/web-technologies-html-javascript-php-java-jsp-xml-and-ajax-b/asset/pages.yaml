    # Using the for Loop


    The for loop is one of the most common loops in JavaScript and other programming
    languages. The for loop allows you to execute a block of statements for a predetermined
    number of times, that is, the number of iterations of a for loop is known beforehand.
    The condition of the for is placed at the beginning of the loop.


    The syntax of the for loop is:


    ```

    for(initialization_statement; condition; updation_statement)

    ```


    In the preceding syntax, for is a JavaScript keyword that is immediately followed
    by a pair of parentheses that encompasses the initialization_statement, condition,
    and updation_statement, each of which is separated by a semicolon. The initialization_statement
    refers to the statement in which the loop control variable is declared or assigned
    an initial value. A loop control variable, as the name suggests, is used in condition
    to control the execution of the for loop. The for loop updation_statement refers
    to the statement that updates the value of the loop control variable.


    Note that in the first iteration of the for loop, initialization_statement is
    the first statement to be executed followed by the evaluation of condition, which
    if true results in the execution of the group of statements (statement1) inside
    the for loop. After the group of statements is executed, the updation_statement
    is executed completing the first iteration. The condition of the for loop is again
    evaluated for the second iteration and so on.


