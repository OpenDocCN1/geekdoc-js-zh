  md: "# Chapter 2\n\n# Using the continue Statement\n\nSimilar to the break statement,\
    \ the continue statement can also be used to stop the execution of a loop. However,\
    \ the continue statement does not exit the loop; it causes the evaluation of the\
    \ condition for the next iteration of the loop. If the loop has any statements\
    \ after the continue statement, then those statements are not executed.\n\nLet's\
    \ create a Web page, continueStatement.html to understand the working of the continue\
    \ statement List 2.29 using the code of the continueStatement.html page:\n\nList\
    \ 2.29: Using the continue statement in a Script\n\n```\n<html>\n<head>\n<title>JavaScriptExample</title>\n\
    </head>\n<body bgcolor=\"pink\">\n<script type=\"javascript\" language=\"javascript\"\
    >\nvar count=0;\nwhile(count<10) {\n  count++;\n  if(count%2==0) {\n    continue;\n\
    \  } else {\n    document.write(\"count=\"+count+\"<br/>\");\n  }\n}\ndocument.write(\"\
    while loop exited\");\n</script>\n</body>\n</html>\n```\n\nIn 2.29, the if...else\
    \ statement checks whether count variable is divisible by 2 or not. If count is\
    \ divisible by 2, then the continue statement is executed. The condition of the\
    \ loop is evaluated for the next iteration. Note that in this case, the continue\
    \ statement is executed for every number between 0 and 10. When you open this\
    \ page, the output appears, as shown in Figure 2.31:\n\n![](img/ff578e59567ce41d5431f36224872e10_97_0.png)\n\
    \nFigure 2.31: Using the continue Statement\n\nAs you can observe in Figure 2.31,\
    \ for every even number between 0 and 10, the value of count is not displayed."
