- img_proc: true
  md: '# JSP Application Development


    The attribute represents the variable name assigned to the id attribute of jsp:useBean
    action tag. It is used to locate an existing bean instance in the appropriate
    scope specified in the jsp:useBean action tag. It is case sensitive and must follow
    the naming conventions used to define Java variables.


    # scope


    The scope represents the context in which the bean instance has to be located
    or created. Scopes can be page, request, session, and application. The default
    scope is page. All the scopes are defined as follows:


    +   - page scope – Indicates that the bean can be used where the jsp:useBean action
    tag is used within the JSP page; the page sends a response back to the client
    or for a request to another resource.

    - request scope – Indicates that the bean can be used from any JSP page that is
    processing the same request, until a JSP page sends a response to the client.

    - session scope – Indicates that the bean can be used from any JSP page in the
    same session as the JSP page that shares the session. Remember, the page in which
    the bean must have a directive with session="true".

    - application scope – Indicates that the bean can be used from any JSP page in
    the same application as the JSP page that created the bean. The bean exists throughout
    the entire Web application, and can be accessed by any page in the application.


    # class


    The class takes a qualified class to create a bean instance if the bean is not
    found in the given scope. The class name given in this attribute should have a
    no-argument constructor and should not be an abstract class. This is because the
    JSP uses the new keyword and no-argument constructor to create a bean instance.


    # beanName


    The beanName takes a qualified class name or an expression that resolves to a
    qualified class name or serialized template. The JSP container uses the instantiate
    method of java.beans.Beans class to instantiate the bean. This instantiates the
    given bean in the following approach:


    +   - First, it checks if the given name represents the serialized template; if
    found, it reads the serialized template using the class loader to instantiate
    the bean; serialized form will be located in the file with a name packagename.classname.ser.

    - If the given name does not represent a serialized template, it creates an instance
    using the no-argument constructor.


    # Type


    The type attribute takes a qualified class or interface name, which is the class
    name in the class or beanName or its super type. This attribute can be used with
    or without class or beanName. If this attribute is used with the class or beanName,
    the bean located or created is taken into the reference variable of the type as
    given under this attribute. The variable name is as specified in the id attribute.
    If this attribute is used without the class or beanName attribute, the JSP container
    only tries to locate the Bean, does not instantiate it. If the Bean is not found,
    the JSP container throws InstantiationException.'
