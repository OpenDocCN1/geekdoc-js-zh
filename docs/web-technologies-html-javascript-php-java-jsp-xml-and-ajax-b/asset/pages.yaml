    In the cookiesapplication, you learn how to add and retrieve cookies to maintain
    client data.


    +   - Home.html – Prompts the user to enter the name of a cookie with its values

    - AddCookieServlet.java – Adds a cookie on the request of the user

    - GetCookieServlet.java – Retrieves the values of a cookie

    - web.xml – Configures the Servlets of the cookies application


