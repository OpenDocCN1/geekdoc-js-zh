  md: '# Web Servers and Servlets


    The Servlet container invokes Servlet.init(ServletConfig) method once immediately
    after the Servlet object is instantiated successfully. Therefore, the Servlet.init(ServletConfig)
    method is used to initialize resources, such as Business Factory and JDBC DataSource,
    and implement a code that has to be executed once per instance.


    If this stage is successfully executed, the state of the Servlet enters active
    state and makes it available to handle requests. Servlet container contains a
    Servlet object that is initialized successfully only if the init() method returns
    an object within the time period defined by the Web server, without throwing ServletException.


    Moreover, in this process, if the Servlet fails to initialize, then it can inform
    the container about it by throwing the ServletException or UnavailableException,
    where the UnavailableException is a subtype of ServletException. We can create
    UnavailableException using any of the following constructors:


    +   - UnavailableException(String msg)-Instantiates a permanently unavailable
    exception with the given message


    +   - UnavailableException(String msg, int seconds)-Instantiates a temporarily
    unavailable exception with the given message and specified time period: how long
    will it be unavailable


    If Servlet.init(ServletConfig) method throws exception, the Servlet container
    does not put Servlet into the active state, which removes it (or destroys) the
    instance. If there is an exception by the Servlet.init() method, the Servlet container
    performs the following:


    +   - If it throws UnavailableException, it implies that the Servlet initialization
    has failed, and will not be available for the specified time. The Servlet container
    does not accept any request until the time is available. If any request is made,
    UnavailableException returns the SERVICE UNAVAILABLE (503) response. However if
    there is another request after the given time, container can try to initialize
    and start the Servlet.


    +   - If it permanently UnavailableException, it implies that the Servlet initialization
    has failed, and will not be available until the container is redeployed.


    Let''s learn how a Servlet container performs request,


    # Request Handling


    After initialization, the Servlet instance is ready to serve a request. The Servlet
    container performs the following operations when the Servlet instance is located
    to service a request


    +   - It creates ServletRequest and ServletResponse objects. If this is a HTTP
    request, the Web container contains the HttpServletRequest and HttpServletResponse
    objects, which are subtype of ServletRequest and ServletResponse. The ServletRequest
    encapsulates the request data that includes headers and content from the client.
    The Servlet object can use the Servlet object to respond to the content.


    +   - After creating the request and response objects, it invokes the ServletService(ServletRequest,
    ServletResponse) method to process request and response objects. As discussed
    earlier, the Servlet instance can process multiple requests in its life, now whether
    the Servlet container uses a single instance of Servlet to process multiple requests
    at a time, or depends, on whether the Servlet implements SingleThreadModel or
    not and the service implementation. The following cases occur while dealing with
    multiple requests:


    +   - If the Servlet does not implement the SingleThreadModel interface, the Servlet
    container uses a single instance of the Servlet to process multiple requests at
    a time. The Servlet container sends concurrent requests to the service method
    of Servlet. In this case, you must implement the service method to handle concurrent
    requests.


