  md: '**Type** – Types are data type definitions used in message communication with
    the service. In other words, how are passed parameters to or returned values from
    methods encoded in neutral way? XML schema has a set of simple types, like string;
    coding; and you can create complex types based on simple ones. There is another
    alternative to encode data types inside a WSDL document. WSDL documentation suggests
    using one based on namespace http://schemas.xmlsoap.org/wsdl/


    **Message** – Message defines the messages exchanged with the service. Corresponding
    to each Web service message, the message section contains a message element which
    further contains sub elements.


    **portType**–WSDL port describes the interfaces exposed by a Web service. It defines
    Web service, operations to be performed, and messages to be involved.


    **Binding** – Binding specifies the wire protocols used to access each portType.
    A portType can have many bindings. In other words, a service might provide access
    to all its methods (operations) via numerous different protocols, such as SOAP,
    HTTP and RMI-IIOP


    **Service**–Service describes the set of ports to use when invoking a service.
    A service can have many ports, with each port having a name and a protocol binding.'
