  md: "# Chapter 10\n\n```\n } finally {\n    if (_jspfactory == null) {\n       \
    \ jspfactory.releasePageContext(_jspx_page_context);\n    }\n}\n```\n\nThe Servlet\
    \ created during translation of JSP has the following special characteristics:\n\
    \n+   - The name of the Servlet generated for a JSP page is the name of the JSP\
    \ merged with \"jsp\" and an underscore. Hence, for the firstpage.jsp page, we\
    \ have a Servlet called \"firstpage_jsp\" and its source code, firstpage.jsp (Java\
    \ 10.4).\n\n+   - When a first-time user requests a JSP.\n- When a JSP is loaded\
    \ into a Web container. This is called JSP pre-compilation.\n\nIf there is any\
    \ error in the translation of the JSP life cycle, the container raises an exception,\
    \ 500 (internal server error). If any change occurs in the JSP page, all the stages\
    \ of the JSP life cycle are executed again.\n\n# The Compilation Stage\n\nThe\
    \ compilation stage of the JSP life cycle follows the translation stage. In this\
    \ stage, the container compiles the JSP source code for the Servlet and converts\
    \ it into a Java byte (class) code. After the file is generated, the container\
    \ can decide either discard the code or retain it for debugging. Generally, most\
    \ containers discard the Java source code, by default. After the compilation stage,\
    \ the Servlet is ready to be loaded and initialized.\n\n# The Loading & Initialization\
    \ Stage\n\nIn the loading and initialization stage of the JSP life cycle, the\
    \ container loads and instantiates the Servlet that has been generated and compiled\
    \ in the translation and compilation stages, respectively. The Web container,\
    \ as part of this process, performs the following operations:\n\n+   - In this\
    \ stage, the Web container loads the Servlet generated in the translation and\
    \ compilation stages, using the normal Java class loading option. If the Web container\
    \ fails to load the code, it terminates the loading process.\n\n270"
