  md: '# Table 6.2: Syntax of Commonly Used SQL Statements


    | SQL Statement | Type of SQL Statement | Action |

    |---|---||

    | CREATE table-name (field1, field2, ...) | DDL | Creates a new table |

    | INSERT INTO table-name (field1, field2, ...) VALUES (value1, value2, ...) |
    DML | Inserts new tuple in an existing table |

    | UPDATE table-name SET field1=value1, field2=value2, ... [WHERE condition] |
    DML | Updates the values in an existing tuple |

    | DELETE FROM table-name [WHERE condition] | DML | Deletes a particular tuple
    from a table |

    | SELECT field1, field2, ... FROM table-name [WHERE condition] | DML | Retrieves
    the tuples that matches the condition, from the table |

    | RENAME table-name TO new-table-name | DML | Renames a particular table |

    | DROP table-name | DML | Deletes a particular table from the database |

    | DROP DATABASE database-name | DML | Deletes a database |


    The basic structure of the SQL statement consists of three clauses: **select**,
    **from**, and **where**.

    Let''s discuss each of these clauses.


    # The select Clause


    The **select** clause is used to retrieve data form of a table. For example, the
    SQL statement to retrieve data from the **Employee_Information** table is:


    ```

    select Emp_Name from Employee_Information

    ```


    The preceding example retrieves the values of the **Emp_Name** attribute. If more
    attributes need to be retrieved, the attributes are separated by commas.

    Example:


    ```

    select Emp_ID, Emp_Name from Employee_Information

    ```


    The preceding example retrieves the values of the **Emp_Name** and **Emp_ID**
    attributes of the **Employee_Information** table.

    If all the attributes need to be retrieved, an asterisk (*) is used.

    Example:


    ```

    select * from Employee_Information

    ```


    The preceding example retrieves the values of all the attributes of the **Employee_Information**
    table.


    # The where Clause


    The **where** clause is used with the select clause to retrieve only those records
    that match a specific condition.

    The condition to retrieve the records is specified in the where clause by the
    assignment operator (=), logical operators, such as **and**, **or**, and **not**,
    or comparison operators, such as <, >, <=, >=, = and <.


    161'
