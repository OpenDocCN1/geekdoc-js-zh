    After this we use the DOM API for parsing XML documents. We create an instance
    of DocumentFactory class, which is provided by DOM API. The DocumentFactory object
    provides a parser for parsing an XMLInstance and produces a DOM tree structure.
    The DocumentBuilder object calls its newInstance method to obtain a reference
    to this. This is done as follows:


    ```

    DocumentBuilderFactory builderFactory = DocumentBuilderFactory.newInstance();

    DocumentBuilder builder = builderFactory.newDocumentBuilder();

    ```


    The next step is to create an instance of DocumentBuilder. This class parses the
    document instance which can be created by calling its newDocumentBuilder method
    on the DocumentBuilder object:

    The next step obtains a DOM document. The Document interface represents the XML
    document. It refers the root node and has several methods for creating nodes,
    attributes, etc. Document object is accessed by calling the parse method of DocumentBuilder
    class and passing the XML file as argument. After the parse, a Document object
    is returned to the caller. This is done as follows:


    ```

    Document doc = builder.parse(xmlFile);

    ```


    The next step is to create TransformerFactory class by JAXP. This class is used
    for transforming a document to other formats. We are going to use it to create
    a word file. You can use this this class as follows:


    ```

    Transformer transformer = TransformerFactory.newInstance().newTransformer();

    Node node = doc.getDocumentElement();

    Source src = new DOMSource(node);

    Result dest = new StreamResult(new File("ambrish.doc"));

    transform.transform(src, dest);

    ```


    When you run this program it will process the specified XML file and create a
    word file. The word file created is shown in figure 7.2:


