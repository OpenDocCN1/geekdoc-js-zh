    \ than object-oriented code.\n* Support for action chaining and file downloading—Specifications\
    \ that results obtained after processing of a request can be processed further\
    \ for action chaining and file downloading.\n* Use of JavaBeans for form inputs—Hel\
    \ in parsing binary and string properties directly on the action using JavaBeans.\n\
    * Support for controller and model—Provides the controller and model to handle\
    \ the role of interfaces in Struts 2, as interfaces are not used in Struts 2 Framework.\n\
    \n# Deployment Supporting Features\n\nThe deployment supporting features of Struts\
    \ 2 include:\n\n+   * Allows framework extension, automatic configuration, and\
    \ use of plugins to enhance the capabilities of the framework\n* Helps in debugging\
    \ Struts 2 application ensuring that the errors are reported precisely, indicating\
    \ the location and line of an error\n* Maintenance:Supporting Features\n* The\
    \ maintenance supporting features of Struts 2 include:\n* Help test Struts actions\
    \ directly, without the conventional HTTP objects to debug the application\n*\
    \ Allows easy customization of controller to handle the requests for action, since\
    \ a new class is invoked for every request\n* Provides built-in debugging tools\
    \ to help problems; hence, less time is wasted in manual testing\n Supports JSP,\
    \ FreeMarker, and Velocity tags that encapsulate the business logic\n\n# Processing\
    \ in Struts 2\n\nSimilar to Struts 1, Struts 2 implements the front controller\
    \ approach with the MVC 2 pattern; there is only a single controller front. All\
    \ requests are mapped to this front controller org.apache.struts2.dispatcher.FilterDispatcher\
    \ class. The main work of this controller is to map user requests to the appropriate\
    \ action classes. In Struts 1, where actions are used to handle the business logic\
    \ and the model part is represented by JavaBeans; Struts 2, both the business\
    \ logic and the model are implemented as action components. In addition to the\
    \ JSP pages, view can be implemented using other presentation layer technologies,\
    \ such as the Velocity template, Struts 2.\n\n349"
