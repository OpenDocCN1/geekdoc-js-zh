    \nIn Web services, we try to make it as abstract as possible. Web services do\
    \ not make use of a particular description language example. Description of service\
    \ can be written in XML, plain text, etc. WSDL is now becoming a standard for\
    \ Web service description. Many tools support it and have the capacity to generate\
    \ WSDL documents from Java code and vice versa. WSDL document consists of the\
    \ following elements:\n\n+   **Definition** – WSDL document's definitions are\
    \ root elements, which contain of namespace definitions. WSDL recommends the use\
    \ of XML schema definitions. You can recognize data types of each element during\
    \ encoding and decoding.\n\n+   **Types** – are data types used in message communication\
    \ with the service. In other words, how are parameters or returned values from\
    \ methods encoded in neutral way? XML schema has a set of types, like strings,\
    \ double, and you can create complex types based on simple ones. There is another\
    \ alternative to encode data types inside a WSDL document. WSDL documentation\
    \ suggests one based on namespaces: http://www.example.org/wsdl/\n\n+   **Message**\
    \ – defines the messages exchanged with each Web service message, the message\
    \ section contains the message element which contains sub-elements.\n\n+   **portType**\
    \ – WSDL describes the interfaces exposed by a Web service. It defines Web service,\
    \ operations to be performed, and messages to be invoked.\n\n+   **Binding** –\
    \ specifies the wire protocols used to access each portType. A portType can have\
    \ many bindings. In other words, a service might provide access to its methods\
    \ (operations) via numerous protocols, such as SOAP, HTTP and RMI-IIOP\n\n+  \
    \ **Service** describes the set of ports to use when invoking a service. A service\
    \ can have many ports, with each port having a name and a protocol binding.\n\n\
