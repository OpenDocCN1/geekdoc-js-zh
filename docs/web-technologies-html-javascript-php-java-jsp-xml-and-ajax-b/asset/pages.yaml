  md: '# JavaScript Programming


    In Listing 2.11, you can see that the script within the <body> and </body> tags
    have four variables countBooks, minBookPrice, maxPrice and bookName that are declared
    in the same statement.


    A variable can store only one value at a time; however, it may store different
    values at different times in the script. In JavaScript, it is not necessary that
    a variable to store only a particular type of data. A JavaScript variable can
    store any value of any data type. For example, the same variable can store a string
    and a number at the same script. This is why, JavaScript is considered a poorly
    typed language.


    In JavaScript, you can assign values to a variable either at the time of declaration
    or after that. In addition, the variable stores only the most recent value assigned
    to it. After assigning a value to a variable, you can use it in your script. You
    can access the value of a variable by using its name in script.


    The syntax to assign a value to a variable after it is declared is:


    ```

    variable_name = value;

    ```


    In the preceding syntax, variable_name refers to the name of the variable, = is
    the assignment operator, and value refers to the value that is stored in the variable.


    As stated earlier, you can assign values to a variable by declaring it by using
    the assignment operator.

    Let''s create a page, named assigningVariables.html to assign values to a variable.
    Listing 2.12


