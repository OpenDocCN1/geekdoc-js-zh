  md: "# JavaScript Programming\n\nAs the name suggests, control flow statements are\
    \ special statements that control or alter the flow of execution of script statements.\
    \ You can make decisions about the execution of statements with the help of control\
    \ flow statements. The decisions are based on the value of a condition, which\
    \ is a JavaScript expression that evaluates to a Boolean value (true or false).\
    \ When the condition evaluates to true a particular group of statements is executed\
    \ and when the condition evaluates to false another group of statements is executed.\n\
    In JavaScript, control flow statements can be classified as:\n\n+   - Selection\
    \ statements - Allows the execution of a group of multiple statements\n- Loops\
    \ - Allows a repeated execution of a group of statements\n- Jump Statements -\
    \ Allows the execution to skip or jump over certain statements\n\nLet's learn\
    \ about each of them in detail starting with selection.\n\n# Working with Selection\
    \ Statements\n\nSuppose a Web page has an HTML form to collect certain information,\
    \ such as the name, phone number, and age of the users. When a user fills the\
    \ form on the Web page, you may want to ensure that the user enters the information\
    \ correctly. For instance, you want to assert that the user does not enter a number\
    \ in place of name or enter a text for age. To incorporate such functionality\
    \ and logic, you can use the selection statements in the script\n\nThe selection\
    \ statements use a condition to select or determine the statements that are to\
    \ be executed. These statements assist you to make decisions and control the flow\
    \ of execution of the statements. In JavaScript, there are three selection statements—\
    \ if, if-else, and switch. Let's learn about them in detail one at a time starting\
    \ with the if statement.\n\n# Using the if statement\n\nThe if statement is the\
    \ most basic and simplest control flow statement. You can use the if statement\
    \ when you want to execute a group of one or more script statements only when\
    \ a particular condition is met.\nThe syntax for the if statement is:\n\n```\n\
    if(condition)\n{\n  statement1\n}\n```\n\nIn the preceding syntax, is a JavaScript\
    \ keyword that signifies an statement and condition refers to the condition that\
    \ is evaluated. Note that the condition for the if statement is enclosed within\
    \ parentheses immediately after the if statement. If the condition evaluates to\
    \ true, then the script statement, represented by statement1, enclosed within\
    \ the curly braces is executed. If the condition evaluates to false, then the\
    \ statement enclosed within the curly braces are skipped and the statement immediately\
    \ after the closing brace {} is executed.\n\nLet's create a Web page, named Statement.html\
    \ to learn the working of the if statement. Listing 2.21 shows the code of the\
    \ ifstatement.html page:\n\nListing 2.21: Using the if statement in a Script\n\
    \n```\n<html>\n<head>\n  <title>JavaScriptExample</title>\n</head>\n<body bgcolor=\"\
    pink\">\n  <script type=\"text/javascript\" language=\"javascript\">\n  var Number=45;\n\
    \  if((Number92) != 0)\n```\n\n69"
  merge: -1
