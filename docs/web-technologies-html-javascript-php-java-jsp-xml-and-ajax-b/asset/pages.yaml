  md: '# Summary


    In this chapter, we have learned about the various types of JSP scripting tags,
    implicit objects, and JSP directives. Scripting tags allow us to write the Java
    code in JSP pages. We also learned to create JSP pages using the scripting tags.
    We learned that implicit objects are used in a JSP page to access the Java code.
    JSP directives are used to import a Java file into a JSP page to control the processing
    of the entire page in an application. JSP directives allow you to include other
    pages into the context of a JSP page. Next, we learned about action tags to display
    variables using an expression to set an attribute. We have also learned about
    error handling and debugging in JSP. Finally, we have learned how to share data
    between JSP pages, requests, and users passing control, and sharing of session
    and application data.'
