    \ Lerdorf, in 1995, and was originally created as Personal Home Page. Lerdorf\
    \ initially created set of Common Gateway Interface binaries, written in C to\
    \ replace some Perl scripts in his homepage. He later merged these binaries with\
    \ his Form Interpreter (FI) to create PHP/FI. Although not officially launched,\
    \ this PHP/FI was the first version of the PHP language. PHP/FI had the capability\
    \ to communicate with database and develop Web pages. PHP is free software under\
    \ PHP License, which does not adhere to the GNU Public License (GPL) norms.\n\n\
    In this chapter, you'll learn how to create a PHP script and run that. Also, the\
    \ chapter explores the use of variables and constants along with the discussion\
    \ on the data types used in a PHP script. Finally, different types of operators\
    \ have been used in the PHP file.\n\n# Introducing PHP\n\n+   * PHP Version 2\
    \ — Released on June 8, 1995 by Lerdorf. This version allowed to embed a PHP script\
    \ in HTML (Hypertext Markup Language) file. It also provided the handling of form\
    \ in Web pages.\n* PHP Version 3 — Released in the year 1997. The parser for PHP\
    \ was rewritten by Zeev Surarski and Andy Gutman, who became the base for PHP\
    \ 3. This was the time when PHP grew a new name, PHP: Hypertext Preprocessor.\
    \ PHP/FI 2.0 was officially released in November 1997 and later on PHP version\
    \ 3 was launched in the year 1998.\n* PHP Version 4 — Released on May 22, 2000\
    \ with the Zend Engine 1. Various subversions of PHP version 4 are released until\
    \ August 2008; however, the last released subversion of PHP 4 was PHP 4.9.\n*\
    \ PHP Version 5 — Released on July 13, 2004 with an enhanced version of the Zend\
    \ Engine, Zend Engine II. This version supported advanced features, such as Object\
    \ Oriented Programming, Data Object Extensions. The most recently released version\
