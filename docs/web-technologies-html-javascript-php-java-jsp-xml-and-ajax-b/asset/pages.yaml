  md: "# Working with XML\n\nYou have to change `&lt;xml-stylesheet&gt;` in product.xml\
    \ file so that it points to this XSLT stylesheet, in the following code:\n\n```\n\
    &lt;xml-stylesheet type=\"text/xml\" href=\"calltemplates.xsl\"&gt;\n```\n\nIn\
    \ this stylesheet the `&lt;xsl:template&gt;` matches the root element and the\
    \ `&lt;xsl:call-template&gt;` element with name `PRODUCT` for each node set. The\
    \ `&lt;xsl:call-template&gt;` calls the template `PRODUCT` that selects `PRODUCTNAME`,\
    \ `PRICE`, and `QUANTITY` for the matching `PRODUCT` node specified in `&lt;xsl:for-each&gt;`.\
    \ When you open the XML file in IE, it is transformed into HTML as shown in Figure\
    \ 7.3.\n\n# The `&lt;xsl:stylesheet&gt;` and `&lt;xsl:transform&gt;` Elements\n\
    \nThese are the outermost elements of the stylesheet. Both are used to define\
    \ the root element of the stylesheet.\n\nSyntax: `&lt;xsl:stylesheet&gt;` is as\
    \ follows:\n\n```\n&lt;xsl:stylesheet xmlns=\"\" version=\"number\" extension-element-prefixes=\"\
    namespaces\"\n  -- Content: exclude-result-prefixes=\"namespaces\"\n  -- --\n\
    \  &lt;xsl:param&gt; -- --\n&lt;/xsl:stylesheet&gt;\n```\n\nSyntax: `&lt;xsl:transform&gt;`\
    \ is as follows:\n\n```\n&lt;xsl:transform xmlns=\"\" version=\"number\" extension-element-prefixes=\"\
    namespaces\"\n  -- Content: exclude-result-prefixes=\"namespaces\"\n  &lt;xsl:param&gt;\
    \ -- --\n&lt;/xsl:transform&gt;\n```\n\n# Attributes\n\nThe attributes used by\
    \ these elements are listed in Table 7.10:\n\n| Table 7.10: Attributes of `&lt;xsl:stylesheet&gt;`\
    \ or `&lt;xsl:transform&gt;` |\n| Name | Value | Meaning |\n| id (optional) |\
    \ XML Name | It is an identifier to identify this `&lt;xsl:stylesheet&gt;` element\
    \ when it is embedded in another XML document |\n| version (mandatory) | Number\
    \ | It defines the version of XSLT required by this stylesheet. Use 2.0 for a\
    \ stylesheet that requires XSLT 2.0 features or 1.0, if you want the stylesheet\
    \ to be portable between XSLT 1.0 and XSLT 2.0 processors |\n| extension-element-prefixes\
    \ | Whitespaced list of Namespaces | It defines any namespaces used in this stylesheet\
    \ to identify extension |\n| exclude-result-prefixes (optional) | Whitespaced\
    \ list of Namespaces | It defines any namespaces used in this stylesheet that\
    \ should not be copied to the output destination, unless they are actually used\
    \ in the result document |"
