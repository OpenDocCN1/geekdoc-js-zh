    and enhancing its overall look. They help to break the monotony of text in a Web
    page besides adding a visual element that might attract the user to a particular
    part of the page.


    In this section, you learn to insert an image on a Web page, display alternate
    text for an image, add a border to an image, align an image, use images as links,
