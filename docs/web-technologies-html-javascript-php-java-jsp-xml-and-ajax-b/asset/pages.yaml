    in the URL of the Web browser.


    After learning how to submit the form data using the get() and post() methods,
    let''s now learn how to retrieve the submitted form data.


    # Retrieving the Form Data


    PHP provides various functions to retrieve the submitted form data. The following
    are some of the most commonly used functions to retrieve data:


    +   * The $_GET[] function

    * The $_POST[] function

    * The $_REQUEST[] function


    In addition, you can use the $_SERVER[''REQUEST_METHOD''] to determine the method
    used to send the form data to the server.


    Let''s discuss each of them in detail.


