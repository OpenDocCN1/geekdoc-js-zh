    # Simple API for XML (SAX)


    The SAX refers to the Simple API for XML, which provides a mechanism to read data
    from an XML document. As discussed previously, DOM is used to read data from an
    XML document. Thus, SAX parser proves to be an alternative to the Document Object
    Model (DOM). In technical terms, SAX is the serial access API for XML.'
