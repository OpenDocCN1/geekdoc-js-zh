  md: '# Chapter 1


    Now, let''s learn to align an image in an HTML document.


    # Aligning an Image


    A Web page can have a combination of both text and images. If you are creating
    a Web page with both text and images, you need to align the images as per your
    requirements. To align an image on a Web page, use the align attribute of the
    `<img>` tag. The align attribute of the `<img>` tag takes one of the three values:
    left, right, or center.


    Let''s create a Web page, AligningImage.html to learn how to align an image on
    the Web page. Listing 1.10 the code of the AligningImage.html page:


    Listing 1.10: Aligning an Image


