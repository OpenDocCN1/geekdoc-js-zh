  md: '# Chapter 11


    Whenever a client request is processed, errors might occur in the body of the
    JSP page implementation class. Moreover, the error may occur in any other code,
    such as a Java bean. Runtime errors that occur follow the Java exception mechanism.
    However, exceptions can be caught and handled in the body of JSP page, which the
    author chooses. Suppose, if there is an exception and was not caught; then the
    error is forwarded along with the exception page URL. Here the page is specified
    using the errorPage attribute of the page directive and by using a URL. This is,
    as the errorPage attribute is identified using the isError attribute of the pages.
    The exception is accessible using the implicit object called exception. Moreover,
    in addition to an exception, an errorPage also has request attributes such as
    javax.servlet.error.status_code, javax.servlet.error.request_uri, and javax.servlet.error.servletName.


    Whenever, the PageContext.getErrorData() is used, it is possible to get an instance
    of the javax.servlet.ErrorData class. This allows accessing the attributes. The
    status by error page is as follows:


    ```

    $ pageContext.errorData.statusCode

    For an error page the following is shown in the following code snippet:

    <% page isErrorPage="True" %>

    <H3>The following error occurred in your application:</H3>

    <br/>

    <br/>

    <font color="red" size="4">

    Exception = ${pageContext.exception.message}"</p>

    <p>

    The request URI is: ${pageContext.errorData.requestURI}

    </p>

    <p>

    The status code is: ${pageContext.errorData.statusCode}</p>

    <p>

    The servlet name is: ${pageContext.errorData.servletName}

    </font>

    <br/>

    </p>

    ```


    In the preceding code snippet, a simple JSP forces an exception to be thrown.
    The errorPage attribute of the page directive directs the URI of the error page
    as shown in the following code snippet:


    ```

    <% language="java" errorPage="errorpage.jsp" pageEncoding="ISO-8859-1">

    <html>

    <head>

    <title></title>

    <link rel="stylesheet" type="text/css" href="style.css">

    </head>

    <body>

    <% Throw new Exception("For an exception to be thrown");

    %%

    </body>

    </html>

    ```


    We learned about handling errors in a JSP page. Let''s now discuss about debugging
    JSP page.


    # 304'
