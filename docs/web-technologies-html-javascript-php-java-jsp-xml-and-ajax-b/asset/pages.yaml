  md: '# The javax.servlet.Servlet Interface


    The javax.servlet.Servlet interface is the basic interface of the Java Servlet
    API. This provides a standard abstraction for the Servlet container to understand
    the Servlet object created by the user. That means this interface is designed
    to describe the user Java object to the Servlet container, encapsulates the application
    logic to plug into the Servlet container for processing the client request. The
    Servlet must be a subtype of this interface to be managed by the Servlet container.
    The following are the five methods declared in this interface:


    +   - void init(ServletConfig config)

    - void service(ServletRequest request, ServletResponse response)

    - void destroy()

    - ServletConfig getServletConfig()

    - java.lang.String getServletName()


    Let''s learn about the environment


    # The javax.servlet.ServletConfig Interface


    The javax.servlet.ServletConfig interface of Java Servlet API is designed to describe
    a container object that represents environment details of the Servlet object.
    This means that the javax.servlet.ServletConfig interface provides a standard
    abstraction for the Servlet object to get the environment details from the Servlet
    container. The container implementing ServletConfig supports the following operations:


    +   - Gets the initialization parameters configured in a Web application''s configuration
    document; i.e. web.xml

    - Gets the ServletContext object that describes the Web application''s runtime
    environment

    - Gets the Servlet name as configured in the Web applications configuration file;
    i.e. web.xml, for which the Servlet object is created


    After having a brief understanding about the javax.servlet.Servlet and javax.servlet.ServletConfig
    objects, let''s discuss the life cycle of Servlet object.


    # Servlet Life Cycle


    A Servlet object is initialized and managed by the Servlet container. The Servlet
    container uses the javax.servlet.Servlet interface to understand the Servlet object
    and management. Therefore, before we start creating a Servlet, let''s understand
    the life cycle of the Servlet object, which describes how the Servlet container
    manages the Servlet object. The life cycle of a Servlet object involves creating
    an instance of the Servlet, associating the Servlet with initialization information,
    dispatching requests to the Servlet instance, and finally destroying the Servlet
    instance.


    # Stages of the Servlet Life Cycle


    The Servlet life cycle mainly goes through four stages. The fourth stage does
    not happen immediately after the third stage; instead the Servlet is destroyed
    after the completion of the request mechanism. These four stages are:


    +   - Loading a Servlet

    - Initializing the Servlet

    - Request handling

    - Destroying the Servlet'
