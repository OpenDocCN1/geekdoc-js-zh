    Let''s now discuss the data types available in PHP.


    # Exploring Data Types in PHP


    Data type describes categories of values that a programming language can use.
    A data type refers to the type of data that a variable can hold. PHP has eight
    data types, which are:


    +   - Integers

    - Floating point numbers

    - Strings

    - Booleans

    - Arrays

    - Objects

    - Null


    In PHP, it is not necessary to specify the data type of a variable before using
    it. PHP data types are broadly divided into two categories: scalar or primitive
    data types and compound data types. The scalar data type, such as integers, floating
    point numbers, and Booleans can hold only a single value. The compound data type
    includes objects and arrays that can store a collection of values. All the data
    types of PHP are described as:


    +   **Integers** represents a whole number with no fractional part, for example,
    -5 or 21,067. The permissible range of the integer data type is limited by the
    operating system, generally from -2,147,483,648 to +2,147,483,647. Integers can
    be written in decimal (1, 786, -32, +1006856), octal (01, 023, -012345), or hexadecimal
    (0x, 0xf, 0xe6,-0x1234d) format.


    +   **Floating point numbers** represents real numbers that include one decimal
    part. PHP includes two types of floating point numbers. The first is a simple
    numeric literal with a decimal point. The second is a floatingpoint number written
    in scientific notation. Scientific notation is in the form of [number]E[exponent].
    For example, 1.23, 0.003, -2.13, 2.144E2, -3.14E-3.'
