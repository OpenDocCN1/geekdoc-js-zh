  md: "# Working with Initialization Parameters\n\nIn most cases, developing Web applications\
    \ (Servlets), some data elements required to process the request are not known\
    \ or may be available with the test data at the development phase. Moreover, the\
    \ test data coded in the Servlet at the deployment phase needs to be changed when\
    \ it is configured in the production environment.\n\nThe Servlet provides the\
    \ ability to start up and configuration information for a Servlet in the form\
    \ of initialization parameters, known as init parameters and context init parameters.\
    \ Init parameters are specific to the Servlet configured in the deployment descriptor\
    \ file, the context init parameters are specific to all or multiple Servlet configured\
    \ in the deployment descriptor file. In the following sections, you learn about\
    \ init parameters and context init parameters.\n\n# Need for Initialization Parameters\n\
    \nYou need to minimize the complexity of the server-side programming and reduce\
    \ the maintenance of your Web application. For example, if you configure an administrator\
    \ email address in your Web application in Java:\n\n```\nPrintWriter out = response.getWriter();\n\
    out.println(\"admin@yourcompany.com\");\n```\n\nIn this code, you have to recompile\
    \ the Servlet every time the administrator's address changes. Rather than hard-coding\
    \ the email value directly into your Servlet's source code, you should always\
    \ maintain these values in the deployment descriptor file, so that you can pass\
    \ the value of the administrator's address through the init parameter in the web.xml\
    \ file. You can write the following code snippet to initialize the parameters\
    \ in the web.xml file:\n\n```\n<servlet>\n  <servlet-name>...</servlet-name>\n\
    \  <servlet-class>...</servlet-class>\n  <init-param>\n    <param-name>admin-email</param-name>\n\
    \    <param-value>XYZ@yourcompany.com</param-value>\n  </init-param>\n</servlet>\n\
    ```\n\nYou can access the initialization parameters, defined in web.xml, by using\
    \ the following code snippet:\nout.println(getServletConfig().getInitParameter(\"\
    admin-email\"));​‍);\nLet's learn how to retrieve and use these parameters in\
    \ the context of the Servlet.\n\n# Retrieving Initialization Parameters\n\nThe\
    \ Servlet initialization parameters are retrieved by using the ServletConfig object.\
    \ The following methods of the ServletConfig object provides functionality to\
    \ retrieve the initialization parameters:\n\n+   * **getInitParameter(String)**-\
    \ Returns a string containing the value of the named initialization parameter,\
    \ or null if the requested parameter does not exist in the web.xml file.\n* **Enumeration\
    \ getInitParameterNames()**- Returns the names of the Servlet's initialization\
    \ parameters as an Enumeration of String objects, or an empty Enumeration if the\
    \ Servlet has no initialization parameters specified in the web.xml file.\n\n\
    Init parameters are specified in the deployment descriptor file (web.xml). Each\
    \ of these parameters consists of a name and value, where the name should be unique.\
    \ You can specify any number of parameters for a Servlet configured in web.xml."
