    Q5. What is XSLT?


    XSLT stands for Extensible Stylesheet Language Transformations, which is used
    for transforming the structure and content of XML document into the required output.
    XSLT transforms XML documents into other documents. XML processors parse the input
    XML, as well as the XSLT stylesheet, and then process the instructions in the
    XSLT stylesheet, using the elements from the input document. During the processing
    of the XSLT instructions, a structured XML output is created. XSLT uses XML attributes
    to access and process the content of the elements in the input document. XSLT
    converts the XML data into human readable format; it is used for displaying XML
    data as HTML or PDF.


