  md: '# Using Images as Links


    You can create hyperlink images similar to hyperlink text. To create a hyperlink
    image, first create an anchor tag (<a> and give the reference of an HTML page
    through the href attribute of the <a> tag. Inside the <a> tag, create a <img>
    tag and give the reference of an image file through the src attribute of the <img>
    tag. When you click the image, the referenced page opens in the Internet Explorer.


    Let''s create a Web page named ImageLink.html to learn how to use images as links.
    Listing 1.11 shows the code of ImageLink.html page:


    Listing 1.11: Using Images as Links


    ```

