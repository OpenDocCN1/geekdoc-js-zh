    # Connection Pooling with the java.sql Package


    You can implement the connection pooling mechanism in an application using the
    java.sql package. The java.sql package provides a transparent mechanism of connection
    pooling. This approach allows the Application server and the database driver to
    handle connection pooling internally. Most importantly, as you use DataSource
    objects to get connections, connection pooling is automatically enabled after
    you configure the Java EE application server.


    You should note that the changes in the additional connection pool is maintained
