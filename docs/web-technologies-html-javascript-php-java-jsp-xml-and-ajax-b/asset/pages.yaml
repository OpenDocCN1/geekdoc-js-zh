  md: '# JavaBeans


    It exercises a veto by the following:


    +   1. Including the clause for PropertyVetoException and


    +   2. Raising the exception (throw new PropertyVetoException()), as appropriate.


    The JavaBeans framework receives the propagated exception. And in turn, JavaBeans
    propagates it to setMethod() via the fireVetoChange event. Note that setMethod()
    is organized such that in the event of a veto, (1) it does not handle the exception
    (instead, returning and propagating the exception), hence, (2) it does not update
    the state or property notification for bound-property listeners. Now, it is very
    clear that the JavaBeans framework supports a lot of property-related functionality
    and requires minimal work from the Bean interface. Let''s now discuss the concept
    of persistence.


    # Persistence


    To save the position of a Bean and its properties and instance variables, the
    role of Persistence comes into play. Persistence is able to save the current state
    of a Bean, which also includes the values of Bean''s properties and instance variables
    to retrieve them at a later stage. The object serialization mechanisms are used
    to provide persistence for Beans.


    Among the different methods available, the easiest way to serialize a Bean is
    to implement the java.io.Serializable interface, which is nothing but a marker
    interface. Implementing the java.io.Serializable interface makes serialization
    automatic. Your Bean need not take any other action in this regard. Remember,
    automatic serialization can also be inherited. Therefore, if a superclass of Bean
    implements the java.io.Serializable interface, then automatic serialization is
    obtained. But, the only restriction is that any class that implements the java.io.Serializable
    interface must supply a parameterless constructor.


    When the user is automatic serialization, they can selectively prevent a field
    from being saved through the use of the transient keyword. As a result, data members
    of a Bean specified as transient will not be serialized.


    If a Bean does not implement the java.io.Serializable interface, then you must
    provide serialization yourself. This can be done, such as, by implementing the
    java.io.Externalizable interface. Otherwise, containers cannot save the configuration
    of your component.


