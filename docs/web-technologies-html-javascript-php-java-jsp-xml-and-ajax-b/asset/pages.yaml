  md: '# Step 1: Obtaining a Connection


    In this step, we want to instantiate a Connection object, which establishes a
    session to the database server.

    Following are the three approaches to obtain a connection:


    +   - Using a Driver object

    - Using a DriverManager

    - Using DataSource object


    In this section, let''s learn to obtain a connection using the first two approaches.


    # Obtaining a Connection using a Driver Object


    The two steps are involved in creating a connection using a Driver object:


    +   1. Create a Driver Object — You can use either of the following approaches
    to create a Driver object:

    Use the Java keyword to construct the Driver object. For example, the Driver implementation
    for Type-1 JDBC ODBC Driver is sun.jdbc.odbc.JdbcOdbcDriver, which can be instantiated
    in the following code snippet:

    ```java

    java.sql.Driver dr = new sun.jdbc.odbc.JdbcOdbcDriver();

    ```

    In the code snippet, an instance of the JdbcDriver is created, which is a subtype
    of the java.sql.Driver interface of JDBC API.

    Following are the problems in this approach:

    - We have the JDBC driver to use in the development phase. The JDBC driver API
    is directly used in the application (For example, sun.jdbc.odbc:JdbcOdbcDriver
    class in the code snippet); this makes tightly bound to the specific JDBC driver,
    which causes problems in migration to another JDBC driver.

    - Use the Java Class.newInstance to create a Driver object to avoid the problems
    mentioned in the preceding approach, as shown in the following code snippet:

    ```java

    Class c=Class.forName("sun.jdbc.odbc.JdbcOdbcDriver");

    java.sql.Driver dr = (java.sql.Driver)c.newInstance();

    ```

    In the preceding code, use the reflection core API, the forName(String) method
    of the java.lang.Class. The forName(String) method loads the JdbcOdbcDriver class
    into the JVM if not loaded earlier. The method returns the Class object to support
    the class that it represents. The Class.newInstance() method is used to instantiate
    an object using a no-argument constructor. The code snippet creates an instance
    of sun.jdbc.odbc.JdbcOdbcDriver subtype of java.sql.Driver interface of JDBC API.

    - In this approach, we are able to overcome the problems faced in the preceding
    approach; it is a better approach to create a Driver object.

    2. Establish a Connection — After creating the Driver object, we can establish
    a connection to the database using the Driver.connect() method, as shown in the
    following code snippet:

    ```java

    Driver dr=(Driver)Class.forName("sun.jdbc.odbc.JdbcOdbcDriver").newInstance();

    //Prepare Properties object encapsulating the database / specific properties

    Properties props=new Properties();

    Connection conn=dr.connect(url, props);

    ```'
