  md: '# Chapter 13


    AJAX, Asynchronous JavaScript and XML, is a new technique. Its primary components
    are JavaScript and XML, a technique which describes how other technologies, JavaScript,
    DOM (Document Object Model), and XML can be used together to create interactive
    Web applications.


    In early days, when we used to create Web applications with technologies, the
    applications based on those technologies were known separately; the end-user couldn''t
    work on the Web application as desktop-based application. To overcome this, James
    Garrett of Adaptive Path combined JavaScript, XML, and DOM together to form a
    new technique, called AJAX. In this technique, the request to the Web server is
    sent by using the XMLHttpRequest object. This object, part of JavaScript technology,
    helps in sending asynchronously to the server. With this request, Web applications
    can now interact with Web server asynchronously. The time taken to return the
    page gets minimized which makes the Web application behave like a desktop application
    which is why, in AJAX-based Web applications, web pages need not be refreshed
    repeatedly, when only a part of the page is changing.


    # Introduction to AJAX


    AJAX, a new approach to Web applications, is based on several technologies that
    help to develop applications with better user experience. It uses JavaScript and
    XML, as the main technology for developing interactive Web applications. These
    applications are based on AJAX Web application model, which uses JavaScript and
    XMLHttpRequest object for asynchronous data exchange. The JavaScript uses XMLHttpRequest
    object to exchange data asynchronously over the client and server. Let''s move
    further to a detailed study on the AJAX Web Application Model.


    # AJAX Web Application Model


    You already know the major issue, with regard to the Classical Web application
    model, was resolved through AJAX. The AJAX application eradicates start-start-stop
    nature or the click, wait, wait, and refresh criteria of the client-server interaction.
    Figure 13.1 shows how intermediate layer is introduced between the user and the
    Web server:


    ![](img/ff578e59567ce41d5431f36224872e10_369_0.png)


    Figure 13.1: AJAX Web Application Model


    352'
