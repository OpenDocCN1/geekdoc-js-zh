    \nDepending upon the browser you are using, an \"onmouse\" event is generated\
    \ which calls the getData() function. When the getData() function is called, the\
    \ XMLHttpRequest object is first checked to whether it is valid, and then processing\
    \ is done.\n\n# Opening XMLHttpRequestObject for Asynchronous Requests\n\nWhen\
    \ the valid object of the XMLHttpRequest is created, the object calls its open\
    \ () method. You can configure the object to set the URL, you want by using the\
    \ object's open method. The syntax of open () method is as follows:\n\n```\nreq.open(\"\
    GET\",URL,true);\n```\n\nHere, the first parameter indicates the type of HTTP\
    \ method that is used for sending request; the second parameter is the URL of\
    \ the requested resource; and the third parameter is optional, which shows whether\
    \ the request is synchronous or asynchronous. The default value of third parameter\
    \ is true, which indicates an Asynchronous request.\n\n357"
