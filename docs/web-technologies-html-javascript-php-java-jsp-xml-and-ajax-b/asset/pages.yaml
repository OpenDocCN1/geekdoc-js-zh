    \ Statements\n\n```\n<?php\n$year=2008;\n// leap year are divisible by 400 or\
    \ 4 but not 100\nif (($year % 400==0) || ($year % 100!=0) && ($year % 4==0)) {\n\
    \    echo \"$year is a leap year.\";\n} else {\n    echo \"$year is not a leap\
    \ year.\";\n}\n?>\n```\n\nOutput:\n2008 is a leap year.\n\nIn Listing 4.9, the\
    \ value 2008 is assigned to the $year variable. The parser checks whether or not\
    \ the condition (value of $year) is true. The block of statements under the if\
    \ statement gets executed in case the condition is true; otherwise, the control\
    \ is passed to the else block. In this listing, if the condition is true and the\
    \ message, 2008 is a leap year, is displayed as an output.\n\n# Looping Statements\n\
    \nIn programming, it is often necessary to repeat the same block of statements\
    \ a given number of times, or until certain conditions are fulfilled. This can\
    \ be accomplished by using looping statements. Loops execute a block of statements\
    \ a specified number of times it is true.\n\n# Exploring Different Types of Looping\
    \ Statements\n\nIn PHP, there are four types of looping statements:\n\n+   - The\
    \ while loop\n- The do-while loop\n- The for loop\n- The foreach loop\n\n# The\
    \ while loop\n\nThe while loops are the simplest type of loops in PHP. It executes\
    \ the statements, as long as the while condition is evaluated and found TRUE.\
    \ The value of this condition is checked each time at the beginning of the loop,\
    \ even if this value changes during the execution of the nested statements, execution\
    \ does not stop until the end of the process. If the condition is evaluated and\
    \ found FALSE the statements are not executed. The syntax for while loop is as\
    \ follows:\n\n```\nwhile ($condition) {\n    statement;\n}\n```\n\nListing 4.10\
    \ shows an example to understand the script of the while loop:\n\n```\n<?php\n\
    $i=1;\nwhile($i<=5) {\n}\n\n```\n\n114"
