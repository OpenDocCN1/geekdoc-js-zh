  md: "# Sorting an Array\n\nThe sort() function sorts an array. Following syntax\
    \ is used to define the sort() function:\nsort(array, sorttype);\n\n+   * Parameter:\n\
    \  * array—Optional.\n  * sorttype—Optional. Specifies how to sort the array values.\
    \ Possible values are:\n    * SORT_REGULAR—Default. Sorts values as they are (don't\
    \ change types).\n    * SORT_NUMERIC—Specifies values numerically.\n    * SORT_STRING—Specifies\
    \ values as strings.\n    * SORT_LOCALE_STRING—Specifies values, based on local\
    \ settings.\n\nListing 5.35 shows the use of sort() function to sort array elements\
    \ in alphabetical order:\nListing 5.35: Using sort()\n\n```\n```php\n$my_array\
    \ = array(\"a\" => \"Dog\", \"b\" => \"Cat\", \"c\" => \"Horse\");\nsort($my_array);\n\
    print_r($my_array);\n?>\n```\n```\n\nOutput:\nArray(\n    [0] => Cat\n    [1]\
