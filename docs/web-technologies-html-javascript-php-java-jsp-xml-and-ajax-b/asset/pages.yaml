    After learning about variables, let''s learn more about constants in PHP.


    # Using Constants


    Constants are values that cannot be changed during the execution of the script.
    You can store data, such as configuration settings, value does not change during
    the execution of the script. Constants are also used to represent integer values
    with special meanings in a particular context, such as error codes and flags.
    It is important to note that constants are case sensitive. By convention, the
    constant identifier follows naming rules as variables; however, unlike variables
    the constant do not start with the $ sign. A valid constant name starts with a
    letter or underscore, followed by any number of letters, digits or underscores.


    The syntax to create a constant is as follows:


    ```

    define ("CONSTANT_NAME", constant_value \);

    ```


