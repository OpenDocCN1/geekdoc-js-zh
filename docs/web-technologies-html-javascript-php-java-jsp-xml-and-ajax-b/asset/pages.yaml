  md: "# JavaScript Programming\n\n# # Working with Functions\n\nConsider a situation\
    \ where you need to calculate the average of three numbers at different places\
    \ in the script. In this case, if you write the statements or code to find the\
    \ average at each of places in the script, the script becomes rather long. This\
    \ in may affect the readability and efficiency of the script. So in all such situations,\
    \ you may make use of functions. A function refers to a cohesive block of statements\
    \ that has a name and can be accessed or called from anywhere and any number of\
    \ times in the script.\n\nIn JavaScript, you can quickly create your own function\
    \ in the script to perform an action or task. You can access a function by naming\
    \ it and calling it whenever you want. Every time that you call a function, the\
    \ specified action or task is performed. The statement in the function is known\
    \ as the calling statement.\n\nIn most cases, calling the statement and the function\
    \ exchange information. The calling statement sends some information that the\
    \ function uses or the function returns information that the calling statement\
    \ uses. You can exchange information between the calling statement and the function\
    \ by using parameters, which are variables inside the function.\n\nLet's first\
    \ learn how to create a function in JavaScript. The syntax to create a function\
    \ is:\n\n```\nfunction function_name(parameter1,parameter2, ... parameterN) {\n\
    \  statement1\n}\n```\n\nIn the preceding syntax, function is a JavaScript keyword\
    \ that indicates the start of a function in the script. The function_name refers\
    \ to the name of the function, which is followed by a pair of parentheses. The\
    \ parentheses enclose the parameters (parameter1,parameter2,...) of the function.\
    \ A function can have zero or more parameters. Note that if you do not specify\
    \ any parameters of the function, you need to provide the parentheses. When the\
    \ function is called in the script, the statements (represented by statement1)\
    \ enclosed in the curly braces of the function are executed.\n\nAfter creating\
    \ a function, you can access it by calling it in the script. You can call a function\
    \ by simply passing arguments for the parameters of the function. An argument\
    \ is the value that is passed to the function and the number of arguments provided\
    \ in the function call must be the same as the number of parameters in the function.\n\
    \nWhen you call a function in a script, the execution passes from the calling\
    \ statement to the function. As a result, statements inside the function are executed.\
    \ After the statements are executed, the control of execution passes back to the\
    \ calling statement.\n\nThe syntax of calling, function_name(argument1,argument2,\
    \ ..., argumentN); refers to the name of the function that you want to call. The\
    \ parentheses after function_name enclose the arguments (represented by argument1,argument2,\
    \ and so on).\n\nLet's create a Web page, named function.html to understand how\
