    \ $i gets increased by each time the loop runs. When the value of $i becomes greater\
    \ 5, the statement in the braces is skipped and the loop exits without performing\
    \ any tasks. However, the value of $i is not greater than 5, the statement in\
    \ the braces is executed and the loop returns to the while statement. The process\
    \ repeats until $i is greater than 5.\n\n# The do-while loop\n\nThe do-while loop\
    \ always executes the block of statements at least once and then checks the condition,\
    \ and repeats the loop if the condition is true. The syntax for the do-while loop\
    \ is as follows:\n\n```\ndo\n{\n  statement;\n}\nwhile (condition);\n```\n\nListing\
    \ 411 shows an example to understand the script of the do-while loop.\n\nListing\
    \ 411: Script of the do-while Loop\n\n```\n<php\n$i=1;\ndo\n{\n$i++;necho \"the\
    \ number is \\$i.\\<br />\";\nwhile ($i<=5);\n?>\n```\n\nOutput:\nThe number is\
    \ 2\nThe number is 3\nThe number is 4\nThe number is 5\nThe number is 6\n\nIn\
    \ Listing 411, the value 1 is assigned to the $i variable. The value of i is incremented\
    \ by each time the loop runs. If the value of $i is already greater than 5, then\
    \ the loop exits. If $i is not greater than 5, the statement in the braces executes\
    \ and the loop returns to the do-while statement. The process repeats until $i\
    \ is greater than 5, and the message is display as an output\n\n# The for loop\n\
    \nThe for loop is used when you know how many times you want to execute a statement\
