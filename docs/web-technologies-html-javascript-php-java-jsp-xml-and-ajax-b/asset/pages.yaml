  md: 'Web Servers and Servlets


    The services provided by the Servlet container are as follows:


    +   - Network Services—Loads a Servlet class. The loading may be from a local
    file system, a remote file system, or other network services. The Servlet container
    provides the network services over which the request and response are sent.

    - Decode and Encode MIME Messages—Provides the service of decoding and encoding
    MIME messages. The Servlet container decodes MIME requests.

    - Manager Servlet Lifecycle—Manages the life of a Servlet.

    - Resource Management—Manages the static and dynamic resource, such as HTML files,
    Servlets, JSP pages.

    - Security—Handles authorization and authentication of resource.

    - Session Management—Maintains a session by sending a session ID to the URL path.


    All the Servlet containers must support HTTP as the protocol for request and response;
    additional request/response based protocols, such as HTTPS (HTTP over SSL) may
    be supported by the vendor. HTTP 1.1 is the new version of HTTP specification,
    but the minimum required version of the HTTP specification that a Servlet container
    must implement is HTTP/1.0. It is recommended that Servlet containers implement
    HTTP/1.1 specification so that all features of HTTP are available.


    # Describing the Request Processing Mechanism


    The following are the sequence of events in request processing, when a client,
    such as a browser makes a request to a Web server with the Servlet container:


    +   - The server (or HTTP adapter) receives a request and dispatches it to the
    Servlet container.

    - The Servlet container determines which Servlet to invoke on base of the request.
    It calls the Servlet whose request URL pattern matches the pattern defined in
    the web.xml configuration file. Navigation process implemented by the Servlet
    container locates the Web resource, which is described in detail later in this
    chapter.

    - The Servlet uses the request object to determine the remote user and retrieves
    the values sent as part of the request. The Servlet generates the data to respond
    back to the client. It sends this data to the server through the response object.

    - After the Servlet has finished processing the request, the Servlet container
    ensures that the response is properly flushed, and returns the control back to
    the Web server.

    - The Web server packs the response content into the response message and sends
    it back to the client.


    # Types of Servlet Container Configurations


    A Servlet container implemented by third party vendor can be placed within a Web
    server or be installed as an add-on of the Web server using the native extension
    API of that Web server. Moreover, the Servlet container can be configured with
    the Web server to manage Servlets in three different ways:


    +   - As a standalone container

    - As an in-process container

    - As an out-process container


    Let’s describe this in detail.


    # Standalone Container


    In a standalone Servlet container, the Servlet is strongly coupled with the Web
    server functionality. That is, the Servlet container takes the responsibility
    of the Web server functionality.


