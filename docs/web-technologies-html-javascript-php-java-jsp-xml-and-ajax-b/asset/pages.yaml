  md: '# Chapter 1


    HTML also known as Hypertext Markup Language, is the most commonly used markup
    language to create Web pages. A markup language provides a way of describing the
    structure of text-based information on a Web page. Hypertext through regular text
    has one additional advantage that is when you click the hypertext present on a
    Web page, you are directed to another Web page on the Internet. The hypertext
    is called hyper because the navigation through pages using the hypertext is not
    linear. If you click the hypertext present on a Web page, you are directed to
    the relevant page on the website or Internet, which is not necessarily the page
    on the website. World Wide Web Consortium (W3C) is an organization that defines
    new specifications for HTML and is responsible to update the language.


    HTML allows you to format, arrange and group text, display text as links, and
    add images and multimedia to a Web page. It also allows you to create and work
    with style sheets, controls, and embed scripting language (such as JavaScript
    code) in a Web page.


    # HTML


    HTML is written in form of tags, which are made of pairs of angle brackets (<
    and) and some text placed between these tags. The text between a pair of brackets
    defines an HTML element. Most of the HTML elements have two properties—attributes
    and contents; therefore they have an opening tag (<element-name> and a closing
    tag (<element-name>). However, some elements, such as <b> and <i> do not have
    any content; they do not need a closing tag. HTML tags, elements, and attributes
    are collectively known as HTML markup.


    The attributes of an HTML element are placed within the opening tag (after the
    element''s name) and its content is placed between the opening and closing tags.
    Most of the attributes are name-value pairs, separated by the sign =. However,
    some attributes, such as is of the <img> element is written without specifying
    a value for it. Attribute value should be enclosed within single or double quotes.
    The syntax of an HTML element is given as follows:


    ```

    <element-name attribute="value="content">content</element-name>

    ```


    In this section, we learned about the HTML markup. Now, let''s know how an HTML
    document is structured.


    # Introducing HTML Document Structure


    The basic structure of an HTML document is given in Listing 1.1:


    +   Listing 1.1: Basic Structure of an HTML Document


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>

    title of the Web Page

    </title>

    </head>

    <body>

    Contents of the Web page

    </body>

    </html>

    ```


    You may notice that an HTML document formally begins with the <!DOCTYPE> element.
    However, all your HTML code resides between the <html> and </html> tags. The <html>
    element has two subelements inside it: <head> and <body>. The <head> element is
    used to specify information about the HTML page, such as the title of the Web
    page. whereas actual contents of the Web page are specified inside the <body>
    element.


    Now, we describe all the elements present in the preceding syntax, one by one.


    # 2'
  merge: -1
