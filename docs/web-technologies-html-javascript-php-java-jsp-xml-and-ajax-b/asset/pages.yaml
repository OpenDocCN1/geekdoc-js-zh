  md: 'Beans use events to communicate with other Beans. A Bean that wants to receive
    events (i.e. a listener Bean) registers itself with the Bean that fires the event
    (i.e. a source Bean). Builder tools examine a Bean and determine which events
    the Bean can fire (send) and the one that it can handle (receive).


    Persistence enables Beans to save and restore their state. Once you''ve changed
    the Beans properties, you can save the state of the Bean and restore it later.
    Remember, that properties remain. JavaBeans uses Java Object Serialization to
    support persistence.


    A Beans is similar to the methods of Java Beans. This method can be called from
    other Beans or a scripting environment. Default all public methods are exported.


    Although Beans are designed to be understood by builder tools, all APIs, including
    support for events, properties, and persistence, are brought as a platform-independent
    component of the JavaBeans. You can create reusable, platform-independent components
    with the JavaBeans API. You can use JavaBeans-compliant application builder tools,
    inlets, applications, or composite components. Beans are known as JavaBeans components.


    You require Beans Development Kit (BDK) for the development of JavaBeans. The
    BDK is free on the Web. In addition to this, you will need the Java Development
    Kit (JDK).


    After understanding the basic concepts of a Bean, let''s now describe the advantages
    of JavaBeans.


    # Advantages of JavaBeans


    The JavaBeans technology plays a very important role. The benefits are that JavaBeans
    technology provides for a component developer:


    +   - All the benefits of JavaBeans''''write-once,run-anywhere'''' paradigm are
    present in the Bean.

    - The properties, events, and methods of a Bean that are exposed to another application,
    as such a builder tools, can be controlled.

    - To configure a Bean, auxiliary software can be provided. This software is only
    needed when the design-time parameters for a component are being set. In the runtime
    environment, it does not need to be included.

    - In the persistent storage, the configuration settings of a Bean can be saved
    and restored at a later time.

    - You can also use Bean to receive events from other objects and generate events
    that are sent to other objects.


    # Introspection


    Introspection is present at the core of JavaBeans. Introspection is the process
    by which a builder tool analyzes how a Bean works and differentiates Beans from
    the typical Java classes. As Beans are coded with preferred patterns for their
    method signatures and definitions, tools that recognize these patterns can determine
    properties and behaviors of the Bean.


    You can define introspection as the process of analyzing a Bean to determine its
    capabilities. As it allows another application, such as a design tool, to obtain
    information about a component, it is an essential feature of the Bean API. The
    JavaBeans cannot operate without introspection.


    There are two ways by which the developer of a Bean can identify which of its
    properties, events, and methods should be exposed by an application builder tool.
    The simple naming conventions are used with the first method. These allow the
    introspection mechanism to find information about a Bean. In the second method,
    an additional class that extends the BeanInfo interface is provided that explicitly
    supplies this information.


