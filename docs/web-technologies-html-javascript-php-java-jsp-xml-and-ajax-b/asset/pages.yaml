    \ in the above example but invoke\n        getParameter() and getParameterNames()\
    \ methods on config reference\n        String value = config.getParameter(\"param1\"\
    );\n    }\n}\n```\n```\n\n# # Describing the HttpRequest & HttpServlet Interfaces\n\
    \nThe Java API includes classes to support the Servlet object accessing the HTTP\
    \ request and response specific details. The javax.servlet.http.HttpRequest and\
    \ javax.servlet.http.HttpResponse interfaces of Java API provide a standard abstraction\
    \ for accessing HTTP-request and response information from the Servlet container.\
    \ We discuss the support of HTTP as well as various HTTP message formats. Now,\
    \ let's suppose that you want to design the server-side extension in Java (a Servlet),\
    \ taking all the advantages of the HTTP. You also want to get HTTP-request request\
    \ content and set some HTTP response headers and content. To do this, you need\
    \ a Servlet container that can understand the HTTP standards and expose HTTP-request\
    \ and responses to the Servlet through API. To meet this requirement, the Servlet\
    \ specification has an interface that all Servlet containers support. In other\
    \ words, Servlet containers can make HTTP messages. The Servlet API includes the\
    \ java.servlet.http package classes and interfaces that describe the abstraction\
    \ between Servlets and the Servlet container to use HTTP protocol data. The HttpRequest\
    \ and HttpServlet interfaces have been included into the javax.servlet.http package\
    \ to manage HTTP request data and set HTTP response content. When a client uses\
    \ the HTTP protocol to request information from the server, the Servlet container\
    \ uses the HttpRequest and HttpServlet objects (the instances of HttpRequest and\
    \ HttpServlet), calls the service(method), and passes these request and response\
    \ objects to access\n\n# ## Working with HttpRequest\n\nHttpRequest is an interface\
    \ and a subtype of the ServletRequest. The Web container implements this interface\
    \ to encapsulate all HTTP-based request information, including headers and request."
