  md: '# Chapter 8


    An entity includes the persistence, transaction ability, and identity as its unique
    properties. The persistence property refers to storing and retrieving data held
    by entities in the relational databases. The identity property specifies the unique
    identification of the entity from other ones.


    Entities are POJOs that are used to store data in a database. Entities hold the
    data of an application in the form of fields and the methods associated with the
    details of an entity. They support relational and object-oriented capabilities,
    such as entities, inheritance, and polymorphism.


    Entity beans are designed to bridge the gap between the object and the relational
    representation of the application data. Figure 8.9 shows how a client can manipulate
    the data with help of entity beans. The client can be the Java application or
    the Web browser, which does not communicate directly with the relational database.
    Figure 8.9 shows how entity beans communicate with each other, according to the
    client''s request:


    ![](img/ff578e59567ce41d5431f36224872e10_241_0.png)


    **Figure 8.9: Showing the Entities Communication Based on Client''s Request**


    As shown in Figure 8.9, the Web browser accesses the JSP page available in the
    Web container. Then, the JSP page calls the appropriate entity bean and Java objects
    of the entity bean class that holds the data provided by the client in the JSP
    page. These Java objects, with the help of the EJB container, store the data in
    the mapped tables of a relational database.


