  md: '# Using Array in JavaScript


    Consider a situation where you need to store and use the price of 100 books. For
    this, you can declare variables in the script to store the prices. However, declaring
    so many variables is rather cumbersome and inefficient. In such a case, instead
    of using the variables, you can use an array to store the books. An array is a
    named collection of different values. The values are represented by their respective
    array elements, each of which has a unique index. The index is a whole number
    that indicates the position of an array element with respect to others.


    Similar to variables, you need to introduce the array that you intend to use in
    the script. In JavaScript, arrays are instances of the Array object you can create
    or define arrays using the new keyword. In JavaScript, the values in an array
    are not of the same data type. For instance, an array can have both strings and
    numbers.


    The syntax to define an array is:


    ```

    var array_name = Array(array_length);

    ```


    In the preceding syntax, var and new are JavaScript keywords while Array refers
    to the Array object. The array_name refers to the name of the array and array_length
    refers to the length or the number of array elements. Specifying the number of
    2 array elements while defining an array is optional.


    Let''s take a look at an example, in Listing 214, defining an array in a script:


    # Listing 2.14: Defining an Array in a Script


    ```

    &lt;html&gt;

    &lt;head&gt;

    &lt;title&gt;JavaScriptExample&lt;/title&gt;

    &lt;/head&gt;

    &lt;body bgcolor="pink"&gt;

    &lt;script type="text/javascript" language="javascript"&gt;

    var bookPrices=new Array(3);

    var bookNames=new Array();

    &lt;/script&gt;

    &lt;/body&gt;

    &lt;/html&gt;

    ```


    In Listing 214, bookPrices and bookNames have been defined as arrays using the
    new keyword. The bookPrices array has three elements, while the bookNames array
    has zero array elements.


    As you know, you can specify the number of array elements while defining an array.
    However, the array is not populated, that the array do not store any value and
    display the undefined value. You can assign values to the array elements while
    defining the array as:


    ```

    var bookPrices=new Array("Mexican Bean", "Who Moved Cheese", "The Call of the
    wild");

    ```


    In this code, the bookNames array is populated while defining it. For values the
    array elements are specified within the parentheses after the Array keyword. The
    individual values are separated by a comma. Note that the bookNames array has
    only strings.


    You can access the array elements after defining them. In JavaScript, you can
    use the array that you have defined in a script by accessing its index. As you
    know, the index indicates the relative position of an array element. The starting
    index of arrays in JavaScript is zero; the first array element has an index of
    zero, the second array element has an index of one, the third array element has
    an index of two, and so on.


    The syntax to access an array element is:


    ```

    array_name[array_element_index];

    ```


    In the preceding syntax, array_name refers to the name of the array, which is
    followed by a pair of square brackets. The array_element_index refers to the index
    of a particular element.'
