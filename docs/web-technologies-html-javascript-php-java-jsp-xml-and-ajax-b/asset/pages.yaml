  md: 'Chapter 8


    # Introducing EJB''s


    EJB is architecture for developing Web-based business applications. It is a server-side
    model that hides the actual business logic of an application from the user. The
    EJB specification is one of the Java APIs in the Java EE edition. It was initially
    developed by IBM in 1997. Later the EJB specification was adopted by Sun Microsystems
    (EJB 1.0 and 1.1) in 1999. Next, it is enhanced by the Java Community Process,
    so that the EJB 2.0, EJB 2.1, EJB 3.0 and EJB 3.1 versions are released one by
    one. To deploy and execute EJB application, you require a Java EE application
    server, such as Glassfish.


    Let''s learn about enterprise bean architecture.


    # Enterprise Bean Architecture


    The enterprise bean architecture comprises three components, the EJB server, EJB
    container, and EJB client.

    Figure 8.7 shows enterprise bean architecture:


    ![](img/ff578e59567ce41d5431f36224872e10_237_0.png)


    Figure 8.7: Displaying the Enterprise Bean Architecture


    # The EJB Server


    The EJB server provides a runtime environment on which the enterprise beans applications
    can be executed. The EJB server creates an infrastructure, called components,
    which are used to deploy the server applications. The EJB server also allows you
    to efficiently manage the allocation of resources to client application using
    the Java Naming and Directory Interface (JNDI) service. You can also access to
    system resource using the EJB server.


    In the EJB architecture, servers are the resource managers. Every server manages
    the allocation of resources to the containers it controls. It is the resource
    manager that determines how many containers may run within the server.


    The EJB server performs the following functions:


    +   Manages all incoming requests at the client-level. This also includes connections
    to clients, dispatching requests to containers, and routing responses back to
    the clients.


    +   Manages the processing of the resources that are available to the container
    at the container-level. This type of management includes also working processes
    to the running threads.


    +   Verifies that the container has access to services, such as a centralized
    security manager, a pool of Java Database Connectivity (JDBC) drivers, a transaction
    service implementation, a global cache manager, and an asynchronous messaging
    service. This function is done at the server-level.


    An EJB application can be executed on multiple servers simultaneously, by which
    the server has efficiently allocate the resources on all the servers on which
    the EJB application is running. This cooperation among servers first provides
    the status of services to a load balancing process and assigns the client requests
    to the least-loaded server to provide the requested services.


