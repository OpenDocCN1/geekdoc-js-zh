    # Processing a Web Form


    As you have learned, the information entered in a Web form is sent to a Web server
    for processing. The processing of a Web form may include the following activities:


    +   - Submitting the form data

    - Retrieving the form data

    - Validating the form data


    Let''s learn about these in next detail.


    # Submitting the Form Data


    The data in a Web form can be sent to the server using either the get() or post()
    method.


    # Using the get()Method


    After you press the Submit button on a Web form, the get() method sends the data
    to the server by attaching it at the end of the Resource Locator (URL). The attached
    data is called query_string. The get() method allows you to send only a limited
    amount of information at a time. In addition, the information sent by using the
    get() method is displayed in the address bar of the Web browser.


    Listing 6.6 shows how to use the get() method to send the form data to the server:


    Listing 6.6: Sending Form Data Using the get() Method


    ```

    <head><title>Sending the Form1 method="get" Method</title></head>

    <body>

    <form name="Form1" method="get" action="welcome.php">

    Enter Your Name:

    <input type="text" name="Name" />n

    ```


