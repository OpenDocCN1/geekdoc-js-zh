  md: '# JavaScript Programming


    Similar to other HTML tags, the <script> tag also has various attributes. Some
    of the important attributes of the <script> tag are:


    +   - Refers to the Multipurpose Internet Mail Extensions (MIME) type of script.
    As per the World Web Consortium (W3C), It is mandatory to specify the type attribute.
    It can have text/ecscript, text/javascript, text/vbscript, application/ecscript,
    and application/javascript as its value.

    - Language — Refers to the scripting language used to create scripts. It is important
    to note that this attribute is not required if you use the specified type attribute.
    However, for compatibility with older versions of browsers that may not support
    the type attribute, you can specify both attributes. This attribute has values
    such as javascript and vbscript.

    - src — Refers to the URL of the file that has a script. This attribute is used
    to specify external script files.


    You can embed a script in an HTML document by creating a script within it or linking
    an external script file with the src attribute in the HTML document.


    # Creating a Script in an HTML Document


    You can create entire script within the HTML document itself. Therefore, the script
    code is written inside the <script> and </script> tags in the HTML document. The
    content code is written between


    You can place the <script> and </script> tags in the head or body of the HTML
    document as per your requirements. You may place the <script> and </script> tags
    in the body of the page when you want the script to run while the page is loading
    in the Web browser. On the other hand, if you want to run script only when the
    user hovers over a link, you can place the <script> and </script> tags in the
    head portion of the page.


    Let''s create a Web page, named createScript.html to understand how to create
    a script in an HTML document. Listing 2.1 showed the code of the createScript.html
    page:


    Listing 2.1: Creating a Script in an HTML Document


    ```

    <html>

    <head>

    <title>JavaScriptExample</title>

    </head>

    <body bgcolor="pink">

    <center>

    <h1>

    <script type="text/javascript" language="javascript">

    document.write("Creating a Script in an HTML Document");

    </script>

    </h1>

    </center>

    </body>

    </html>

    ```


    In Listing 2.1 the <script> and </script> tags are placed in the body portion
    of the page, that is, within the <body> and </body> tags. This implies that the
    script is loaded in the Web browser at the time the page is loading. In the <script>
    tag, the type attribute is set to text/javascript and the language attribute is
    set to javascript. These two attributes convey to the Web browser that the subsequent
    content in the HTML document is a script that is written in JavaScript. The document.write("Creating
    a Script in an HTML Document") line between the <script> and </script> tags is
    a JavaScript code. This line of code, document is an object and write is a method
    that allows you to display information on the Web page.'
