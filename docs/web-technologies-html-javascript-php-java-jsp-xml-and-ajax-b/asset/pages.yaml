  md: '# Chapter 11


    | Table 11.1: Attributes of Page Directive |

    | Attribute | Value |

    | isThreadSafe | Takes true or false as its value; the default value is true.
    This attribute specifies whether the JSP page is thread safe or not. If true,
    however, the instance of the servlet equivalent of the JSP page is capable of
    handling simultaneous requests. If this attribute is set to false, only one thread
    can use the service provided by it. If the value of this attribute is true, simultaneous
    requests can be handled by this page. |

    | errorPage | Takes the URL, path of the page to which a request has to be dispatched
    when an exception is raised in the current page. |

    | isErrorPage | Takes true or false as its value; the default value is false.
    This attribute specifies whether the current page is an error page or not. Remember,
    if this attribute is set to true, an additional implicit object, available for
    the current JSP page. |

    | contentType | Takes the content MIME type and optional character encoding. The
    default value is text/html. |

    | Session | Takes true or false, which indicates whether the session is required
    or not, the default value is true. If this attribute is set to false, the JSP
    page cannot use the session implicit object |

    | Info | Takes a string, which can be retrieved using the getServerInfo(). |

    | pageEncoding | Specifies the encoding to be used by the Web container to compile
    a JSP page. Some of the encoding types are ISO-8859-1 and UTF-8. |


    The JSP page, as described earlier, can contain any number of page directive tags.
    However, the import tag, name of others are allowed to be specified more than
    once.


    # The Include Directive


    The include directive serves to merge the contents of two or more files during
    the translation stage of the JSP lifecycle. The include directive adds the text
    of the included file to the JSP page, without any processing or modification.
    The included file can be static or dynamic. If the included file is dynamic, its
    JSP elements are translated and included. In this case, if there are any changes
    in the included page after the included JSP page is translated, the changes are
    not applied until the included JSP page is translated again.


    The syntax of the include directive is as follows:


    ```

    <include include="file path" %>

    ```


    The XML syntax for include directive is as follows:


    ```

    <jsp:include include="file path" />

    ```


    Following is an example to use the include directive for merging the Test.jsp
    and Test1.html files:


    ```

    <include include="Test.jsp" %>

    ```


    ```

    <include include="/Test1.html" %>

    ```


    Remember, the behavior of the include directive with respect to the recompilation
    of the included page, if any changes are done to it, depends on the Web container.
    Thus, if the included page is changed, few containers recognize and apply the
    changes to the JSP page, while others do not.


    288'
