  md: '# Chapter 1


    # Introduction to Forms


    HTML is also designed to create forms that are the primary elements of a Web page
    and gather information from the user. The basic purpose of an HTML form is to
    allow the user to enter data on one end and then send the data on the other end
    through the Web server. It helps the user to purchase goods on the Internet and
    sign up for newsletters and mail orders. The controls are the basic parts of an
    HTML form. The user fills forms by entering data in the text boxes, clicking the
    radio button, and clearing the check boxes. In addition, each form has a submit
    button that helps to send data through the server to the action URL.


    In this section, you will learn with HTML forms and controls. This includes creating
    an HTML form, adding controls to an HTML form, grouping of HTML forms, and specifying
    a label for the control.


    Let''s learn the process to create an HTML form.


    # Creating an HTML Form


    An HTML form is a Web page that contains form elements. The `<form>` tag includes
    the URL of the script needed to process the form; the form elements, which are
    similar to the text fields; and the submit button, which sends the data on the
    server. All input elements should be enclosed within the `<form>` and closing
    `</form>` tags. Table 1.6 lists a brief description of the attributes of the `<form>`
    tag.


    | Table 1.6: Attributes of the <form> Tag |

    | Attributes | Value | Description |

    |---|---|---|

    | action | URL | Defines where to send the data when the submit button is clicked.
    |

    | method | get | Represents the HTTP method that sends data to the action URL.
    The default value for the method attribute is get. |

    | post | | |


    Let''s create a Web page, named `CreatingaForm.html` to learn how to create an
    HTML form. Listing 1.13 shows the code of the `CreatingaForm.html` page:


    +   Listing 1.13: Creating an HTML Form


    ```

    <html>

    <head>

    <title>

    Creating HTML Form

    </title>

    </head>

    <body>

    First Name:

    <input type="text" name="firstname">

    <br>

    Last Name:

    <input type="text" name="lastname">

    <br>

    <input type="submit" value="SUBMIT">

    </form>

    </body>

    </html>

    ```'
