    # Operator Precedence


    Operator precedence refers to the strength with which the two operators are bound.
    For example, in the expression 1 * 5 + 3, the answer is 16 and not 18 because
    the multiplication (*) operator has a higher precedence than the addition (+)
    operator. Listing 3.15 shows an example of operator precedence:


    # Listing 3.15: Showing an Example of Operator Precedence


    ```

    <php

    echo 5*=1; // displays 11

    echo 5+=1; // displays 7

    echo 5(2+1); // displays 15

    ?>

    ```


    In Listing 3.15, the first statement prints 11 while the next statement prints
    7. This is because the precedence of the * operator is higher than the + operator;
    therefore, in the first statement the expression is evaluated as (5*2)+1 and in
    the second case it is evaluated as 5+(2*1).


    Parenthesis is used to force precedence which is seen in the third statement where
    (2+1) is evaluated first and its result is multiplied by 5 and the output is 15.
    If the operators have same precedence then left to right associativity decides
    the order of precedence. Listing 3.16 shows an example of left to right associativity:


