  md: "# Introduction to JSP\n\n+   - Initialization - After the JSP Servlet object\
    \ is instantiated successfully, the JSP container initializes the instantiated\
    \ object. As per the Servlet's life cycle, the container initializes the object\
    \ by invoking the `init(ServletConfig)` method. Here, this method is implemented\
    \ by the container by calling the `jspInit()` method. This indicates that method\
    \ acts as the `init(ServletConfig)` method of the Servlet.\n\nIf the Loading and\
    \ Initialization stage is performed successfully, the Web container activates\
    \ the Servlet object and makes it available to handle client requests.\nThe Next\
    \ stage in the JSP life cycle is handling.\n\n# Request Handling Stage\n\nIn the\
    \ request handling of the JSP life cycle, the Web container uses only those objects\
    \ of a JSP equivalent Servlet that are initialized successfully to handle a client\
    \ request. The container performs the following operations in this stage:\n\n\
    +   - Creates Servlet and Response objects. If the client uses HTTP to make the\
    \ request, the container creates HttpServletRequest and HttpServletResponse objects,\
    \ where the request object represents the request. The request data and client\
    \ information can be retrieved by the Servlet using the request object. The response\
    \ object can be used by the Servlet to generate the response.\n- Based on the\
    \ Servlet life cycle the Web container invokes the `service()` method on the Servlet\
    \ object by passing the request and response objects created in the preceding\
    \ step. In case of JSP Servlet, the container invokes the `jspService()` method.\n\
    \nLet's now explore the final stage of the JSP life cycle, which is the destroying\
    \ stage.\n\n# The Destroying Stage\n\nIf the Servlet decides to destroy the JSP\
    \ Servlet instance; if it decides to end the services provided by the Servlet\
    \ instance, it performs the following operations:\n\n+   - It calls all the running\
    \ threads in the service of the Servlet instance complete their operations. Meanwhile,\
    \ it makes the Servlet unavailable for new requests.\n- After the current threads\
    \ have completed their operations on the service method(), the container calls\
    \ the `destroy()` method on a Servlet instance, which invokes the `jspDestroy()`\
    \ method.\n- After the destroy method is processed, the Servlet's life cycle is\
    \ complete and the Web container releases all the references of the Servlet instance\
    \ and renders them for garbage collection.\n\nLet's learn to create simple JSP\
    \ pages in the next stage.\n\n# Creating Simple JSP Pages\n\nWe have created a\
    \ simple application with two JSP pages. As we have not discussed the various\
    \ constructs used in JSP, such as scripts and directives, let's create simple\
    \ JSP pages to understand how they can be designed, used, and accessed by a Web\
    \ application.\n\nThe first JSP we plan to create is user.jsp, which provides\
    \ an HTML form with two input fields to enter the name and city of a user. The\
    \ code of user.jsp page is provided in Listing 10.5:\n\nListing 10.5: user.jsp\n\
    \n```\n<%@page import=\"java.util.*\" %>\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
    \ HTML 4.01 Transitional//EN\">\n<html>\n  <head>\n    <title>welcome</title>\n\
    \  </head>\n```\n\n271"
