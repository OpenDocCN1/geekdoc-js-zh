  md: "# Table 5.3: Math Functions\n\n| Function | Description | Version |\n| ---\
    \ | --- | --- |\n| fmod() | Returns the remainder (modulo) of the division of\
    \ the arguments | 4 |\n| hexdec() | Converts a hexadecimal number to a decimal\
    \ number | 3 |\n| is_infinite() | Returns true if a value is an infinite number\
    \ | 4 |\n| is_nan() | Returns true if a value is not a number | 4 |\n| max() |\
    \ Returns the number with the highest value of two specified numbers | 3 |\n|\
    \ min() | Returns the number with the lowest value of two specified numbers |\
    \ 3 |\n| octdec() | Converts an octal number to a decimal number | 3 |\n| pi()\
    \ | Returns the value of PI | 3 |\n| pow() | Returns the value of x to the power\
    \ of y | 3 |\n| sin() | Returns the sine of a number | 3 |\n| sqrt() | Returns\
    \ the square root of a number | 3 |\n| tan() | Returns the tangent of an angle\
    \ | 3 |\n\n# Recursive, Variable, and Callback Functions\n\nRecursive function\
    \ is a function that calls itself repeatedly for a specified condition. Using\
    \ recursion, you can break a complex problem into simpler parts. It increases\
    \ the flexibility and adaptability of a function in the same way as a loop increases\
    \ the flexibility and adaptability of a static statement or block of code. Recursive\
    \ functions are particularly useful for navigating dynamic data structures such\
    \ as linked lists and trees. Following are some points, which must be kept in\
    \ mind when using recursion:\n\n+   - You must have an exit condition (the part\
    \ of the function that can be calculated without further calls to that function).\n\
    - Each recursive call must be done after the one before it.\n\nLet's take an example:\
    \ Example: Factorial (The factorial of any given number is equal to that number\
    \ multiplied by the factorial of the number one lower). `6! = 6*5*4*3*2*1=720`\n\
    \nListing 5.20: how to use recursion to calculate factorial of a given number:\n\
    \nListing 5.20: Calculating the Factorial Using Recursion\n\n```\n<? php\nfunction\
    \ factorial($number) {\n    if ($number < 2) {\n        return 1;\n    } else\
    \ {\n        return ($number * factorial($number-1));\n    }\n```\n\n135"
