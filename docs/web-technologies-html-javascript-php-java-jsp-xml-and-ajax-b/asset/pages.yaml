  md: "# Attributes\n\nTable 7.15 lists the attributes used by <xsl:value-of>\n\n\
    | Name | Value | Meaning |\n|---|---|---|n| select (required) | expression | It\
    \ is the expression given in XPath language format that is used to specify nodes\
    \ to extract the value |\n| disable-output-escaping (optional) | Yes No | The\
    \ 'Yes' value specifies the special characters (such as < ) will be displayed\
    \ as it. The 'No' value specifies that the special characters (such as < ) will\
    \ be displayed as &lt; default value is No |\n\n# XSLT Functions\n\nThere are\
    \ over 100 built-in functions in XSLT. These functions also include XPath functions.\
    \ However, in case of XSLT, there are the following built-in functions:\n\n+ \
    \  - current() — This function is used for accessing the current node.\n- document()\
    \ — This function is used for accessing external XML document.\n- element-available()\
    \ — This function checks whether a particular element is present under the XSLT\
    \ Elements.\n- function-available() — This function checks whether a particular\
    \ function is present under the XSLT functions or not.\n- generate-id() — This\
    \ function generates a string that uniquely identifies a node.\n- key() — This\
    \ function is used to find the nodes with a given value for a named key.\n- system-property()\
    \ — This function returns the information about the processing environment, like\
    \ XSLT version, XSLT processor vendor, and their.\n\n# Using XSLT Elements and\
    \ Functions\n\nLet's build a small application using XSLT functions. In this application,\
    \ we are using two XML files — product.xml (given in Learning 7.4) and emp.xml.\
    \ The emp.xml file is as shown here: \n\n```\n<xml version=\"1.0\" encoding=\"\
    ISO-8859-1\" ?>\n<Employee>\n  <FirstName>Amrish</FirstName>\n  <MiddleName>Kumar</MiddleName>\n\
    \  <LastName>Singh</LastName>\n  <Age>25</Age>\n</Employee>\n```\n\nThe XSLT stylesheet\
    \ used for this application is divided into three files. Each stylesheet explains\
    \ the following functions:\n\n+   - current()\n- document()\n- function-available()"
