  md: "# Chapter 13\n\nAs shown in Figure 13.3, every user action generates an HTTP\
    \ request that takes the form of a JavaScript to call the AJAX engine. Any response\
    \ to the server action does not require the trip back to the server as in the\
    \ Classical web model. Rather, the AJAX engine handles on its own, i.e. the data\
    \ validations, some navigation, editing in memory, are handled by the AJAX engine.\n\
    \nIf the AJAX needs something from the server, like retrieving data or loading\
    \ an interface, then the engine handles the asynchronous interaction with the\
    \ server, using JavaScript and XMLHttpRequest object for asynchronous data exchange.\
    \ The interaction with the server does not interrupt the user's interaction with\
    \ the application. In this way, the asynchronous communication is done without\
    \ the help of the AJAX engine.\n\nComparing Figures 13.2 and 13.3, it is seen\
    \ that in the asynchronous mode of interaction, there is no space for the user\
    \ to wait until the server-side processing goes. The AJAX Web application model\
    \ allows users to continue working, and simultaneously, if necessary, the AJAX\
    \ interacts with the server without interrupting the user's interaction.\n\nAfter\
    \ learning how AJAX works and how the problems or shortcomings of traditional\
    \ technologies are overcome by using AJAX, let' create the first AJAX application\
    \ using JavaScript.\n\n# Creating a Sample Application\n\nLet's consider a scenario\
    \ of a Jewelry showroom. The owner wants to design a web page that would display\
