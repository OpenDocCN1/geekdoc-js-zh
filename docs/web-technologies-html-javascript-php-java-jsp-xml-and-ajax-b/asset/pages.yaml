  md: "Chapter 10\n\n# # Describing the JSP Life Cycle\n\nBefore discussing the life\
    \ cycle of JSP, you must remember that JSP is not executed directly. Its execution\
    \ follows a process in which a JSP page is first translated into its corresponding\
    \ Servlet, and the source file of this Servlet is compiled into a class file.\
    \ This Servlet is then loaded into the memory and initialized, similar to any\
    \ other Servlet. Every time a JSP is requested, its corresponding Servlet is executed.\
    \ Hence, most stages of the JSP life cycle are similar to that of a Servlet. The\
    \ major stages of the JSP life cycle are as follows:\n\n+   - Page Translation\n\
    - Compilation\n- Loading & Initialization\n- Request Handling\n- Destroying (End\
    \ of service)\n\nLet's discuss about each stage of the JSP life cycle individually.\n\
    \n# ## The Page Translation Stage\n\nIn the translation stage of the JSP life\
    \ cycle, the Web container translates a JSP document into an equivalent Java code\
    \ which is a Servlet. Usually, a Servlet contains the Java code with certain markup\
    \ tags, such as HTML or XML. JSPs primarily consist of a markup language with\
    \ Java code. The objective of page translation is to convert a document mostly\
    \ with HTML/XML code to a document with more Java code, which can be executed\
    \ by the Java Virtual Machine (JVM).\n\nThe translation of JSP is automatically\
    \ done by the Web server. It occurs either during deployment of the JSP (a process\
    \ generally known as JSP pre-compilation), or when a request for a JSP is received\
    \ for the first time. In this stage, the Web container performs the following\
    \ operations:\n\n+   - Locates the requested JSP\n- Validates the syntactic correctness\
    \ of the JSP page\n- Interprets the standard JSP directives, actions, and custom\
    \ actions used in the JSP page\n- Writes the source code of the equivalent Servlet\
    \ for the JSP page\n\nAll requests for a given JSP page are served by its corresponding\
    \ Servlet class. This Servlet class works as a simple Servlet.\n\nLet's now look\
    \ at the source file of the Servlet generated for a JSP (See Listing 10.3), as\
    \ shown in Listing 10:4:\n\n**Listing 10.4:** firstpage_jsp.java\n\n```\npackage\
    \ org.apache.jsp;\n\nimport javax.servlet.*;\nimport javax.servlet.http.*;\nimport\
    \ javax.servlet.jsp.*;\nimport java.util.Date;\n\npublic final class firstpage_jsp\
    \ extends org.apache.jasper.runtime.HttpJspBase\nimplements org.apache.jasper.runtime.JspSourceDependent\
    \ {\n\n    private static Object java.util.List _jsp_dependencies;\n\n    public\
    \ Object getDependencies() {\n        return _jsp_dependencies;\n    }\n}\n```\n\
    \n268"
