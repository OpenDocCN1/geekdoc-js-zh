  md: '# Defining DTD for Nested Elements


    Similar to defining DTD for a single element, you can define DTD for nested elements.
    In case of defining nested elements, the DTD definition informs the parser which
    elements can contain nested elements or text. The following code snippet shows
    how to define DTD for nested:


    ```

    <!ELEMENT PRODUCT (PRODUCT*)>

    <!ELEMENT PRODUCT (PRODUCTNAME, DESCRIPTION)>

    <!ELEMENT PRODUCTNAME (#PCDATA)>

    <!ELEMENT DESCRIPTION (#PCDATA)>

    ```


    In the preceding code, the DTD informs that the <PRODUCT> element must contain
    either <PRODUCTNAME> or <DESCRIPTION> elements. The <PRODUCTNAME> and <DESCRIPTION>
    elements are defined to contain the data of type Parsed Character (#PCDATA). The
    # in the preceding code snippet that the keyword used after this symbol is a special
    word for an element name.


    You can define DTD using the OR condition, as shown in the following code snippet:


    ```

    <!ELEMENT item (#PCDATA | item*)>

    ```


    In the preceding code, the item element can contain either PCDATA or item. The
    asterisk indicates that the element can occur zero or more than times in a succession.
    Therefore, the item element can contain mixed content (both text and element).


    # Defining Attributes in DTD


    An element can also have attributes. In a DTD file, you can specify the structure
    of attributes of an element by using the following syntax:


    ```

    <ATTLIST element-name attribute-name type default-value>

    ```


    In the preceding syntax, element-name refers to the name of an XML element and
    attribute-name refers to the attribute of the element. The attribute-type specifies
    the type of data that can be stored in the attribute and default-value specifies
    a default value for the attribute.


    The following code snippet shows how to define an attribute, check, of the salary
    element:


    ```

    <ATTLIST salary type CDATA "check">

    ```


    Table 7.2 lists the attribute types:


    | Attribute Type | Description |

    | --- | --- |

    | (value1 \| value2 \| ... ) | Specifies a list of values, separated by vertical
    bars |

    | CDATA | Specifies unparsed character data (a text string) |

    | ENTITIES | Specifies a space separated list of entities |

    | ENTITY | Specifies the name of an entity defined in the DTD |

    | ID | Specifies a unique name for an ID that no other ID attributes share |

    | IDREF | Specifies a reference to an ID defined in the DTD document. |

    | IDREFS | Specifies a space separated list containing one or more references.
    |

    | NMTOKEN | Specifies a valid XML name composed of letters, numbers, hyphens,
    underscores, and colons |'
