    # Using the parseInt() and parseFloat() Functions


    You can use the parseInt() and parseFloat() functions to extract a number from
    the beginning of a string. The parseInt() function parses the string and returns
    the integer value that is found in the string. Similarly, the parseFloat() function
    parses the string and returns the first floating-point value before returning
    the string, then a special value NaN (Not a Number) is returned.


    When you parse a string, JavaScript uses the radix parameter to specify which
    numerical system is used. For example, a radix of 8 (octal) is excluded, it must
    be parsed from an octal number to a decimal number. If the radix parameter is
    excluded, JavaScript assumes the following:


    +   - If it precedes the string, the radix is 16 (hexadecimal)

    - If it precedes the string, the radix is 8 (octal)

    - If any other value precedes the string, the radix is 10 (decimal)


