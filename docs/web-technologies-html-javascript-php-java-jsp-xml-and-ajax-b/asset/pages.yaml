  md: '# Chapter 9


    Figure 9.5 shows the process diagram of the Servlet life cycle:


    ![](img/ff578e59567ce41d5431f36224872e10_251_0.png)


    Figure 9.5: Showing the Life Cycle of a Servlet


    # Loading a Servlet


    The first stage of the Servlet life cycle involves loading and initializing the
    Servlet by the Servlet container. The Web container can load the Servlet at any
    of the following two stages:


    +   - Initializing the config, on the Servlet with a zero or positive integer
    value to load-on-startup property


    +   - If the Servlet is not loaded in the processing stage, it may delay the loading
    process until the Web container determines that this Servlet is needed to serve
    a request.


    The Servlet container performs the following operations as a part of the loading
    process:


    +   - Loading—Loads the Servlet class by the normal Java class loading option.
    Moreover, the Servlet class may be loaded from a local file system, a remote file
    system, or other network services. If the Servlet fails to load the class, it
    terminates this process.


    +   - Instantiation—Creates an instance of the Servlet. To create a new instance
    of the Servlet, the container uses the no-argument constructor.


    The number of instances for a Servlet instance is as follows:


    +   - If the Servlet is not hosted in a distributed environment, and it does not
    implement the SingleThreadModel, the container creates only one instance of the
    Servlet declared in the Deployment Descriptor. A Web application configuration
    file is also known as Deployment Desor.


    +   - If the Servlet is hosted in a distributed environment, the Servlet container
    creates one Servlet instance per Java Virtual Machine (JVM).


    +   - If the Servlet implements the SingleThreadModel, the Servlet may create
    multiple instances of the If, in case the Servlet is hosted across distributed,
    the container may create multiple instances per JVM as needed.


    # Initializing a Servlet


    After the Servlet is instantiated successfully, the Servlet container contains
    the instantiated Servlet object. The container initializes the object by invoking
    the Servlet.init(ServletConfig) method, which accepts the ServletConfig object
    as a parameter. The ServletConfig object allows the Servlet instance to access
    name-value configured initialization parameters and other container specific details.
    The Servlet container creates one ServletConfig object per per Servlet declared
    in the deployment descriptor.


    234'
