  md: '# # The <body> Element


    The <body> element contains the body of the HTML document, which includes the
    entire content that will appear in the Web browser. It can also include text,
    images, multimedia elements. Table 1.5 lists all the attributes of the <body>
    element:


    | Attribute | Description |

    | --- | --- |

    | alink | Specifies the color of the hyperlinks when they are clicked; you can
    set this attribute to a predefined color name or value. This attribute has been
    marked as deprecated. |

    | background | Represents the URL of a graphic file, which is used as the background
    of the browser. This attribute has been marked as deprecated. |

    | bgcolor | Specifies the color of the background of the browser. You can set
    this attribute to a predefined color name or value. This attribute has been marked
    as deprecated. |

    | bgproperties | Indicates if the background should scroll the text. If you set
    this attribute to fixed, which is the only allowed value, the background will
    not scroll when the text scrolls. |

    | bottommargin | Specifies the bottom margin, which is the empty space at the
    bottom of the document, in pixels |

    | class | Represents the class of the element and is used to render the content.
    |

    | dir | Gives the direction to directionally neutral text. You can set this attribute
    to ltr for left to right text direction or rtl for right to left text direction.
    |

    | id | Represents unique alphanumeric identifier for the element. |

    | lang | Represents base language used for the element. |

    | language | Represents scripting language used for the element. |

    | leftmargin | Specifies the left margin, which is the empty space to the left
    of the document, in pixels. |

    | link | Specifies the color of the hyperlinks that have not yet visited. You
    can set this attribute to a predefined color name or value. This attribute has
    been marked as deprecated. |

    | marginheight | Gives the height of the top and bottom margins, in pixels. |

    | marginwidth | Gives the width of the left and right margins, in pixels. |

    | rightmargin | Specifies the right margin, which is the empty space to the right
    of the document, in pixels. |

    | scrollheight | Specifies whether a vertical scrollbar appears to the right of
    the document.'
