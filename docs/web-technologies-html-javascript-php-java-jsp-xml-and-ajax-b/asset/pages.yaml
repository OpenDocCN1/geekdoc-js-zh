  md: '# Chapter 10


    Quick quite


    Q1. Define JSP.


    Ans. JSP is a standard Java extension used to simplify the creation and management
    of dynamic Web pages. JSPs allow us to separate the dynamic content of a Web page
    from its static presentation content. As described earlier, programming in Servlets
    is very complex and requires additional files such as web.xml and Java class files,
    to generate the required Web pages. JSP offers an easier approach to build dynamic
    Web pages. JSP documents consist of HTML tags and special JSP tags. HTML tags
    are used to create static page content and JSP tags are used to add dynamic content
    to the Web pages. JSPs are compiled into a Java Servlet by a JSP translator. This
    Servlet is then compiled and executed to generate an output for the browser (client).


    Q2. List the advantages of JSP over Servlets.


    Ans. The advantages of JSP over Servlets are:


    +   - JSP page is static and different components need to be placed on the page
    in a symmetrical way. Designing static pages using Servlets require a good knowledge
    of Java; however, Web designers may not be comfortable with Java programming.
    In addition, while using Servlets, you must enclose the HTML code in the out.println()
    method, which disables all IDE support for generating the HTML content. however
    using JSP is easier than using Servlets for the HTML output.

    - You need to recompile a Servlet for every single change in the source code;
    whereas, for JSP, recompilation is not required, as they are automatically handled
    by the Web container for any update in the code.

    - Servlets cannot be accessed directly, they must be first mapped in the web.xml
    file; whereas, JSP page can be accessed directly as a simple HTML page.

    - Both Servlets and JSPs are server-side components used to generate dynamic HTML
    pages; however, JSP is preferred over Servlet as it is developed using a simple
    HTML template and automatically handled by the JSP container.


    Q3. Write down the features of JSP tags.


    Ans. Following are the JSP features:


    +   - Reduce Web development and maintenance costs

    - Helps to reduce code in a JSP page

    - Helps in developing Web applications easier and faster

    - Enables developers to reuse Java code in multiple Web applications with JSP
    tags


    Q4. Define JSP model  architecture.


    Ans. In JSP Model 1 architecture, the Web browser accesses the JSP pages of a
    Web container. The JSP pages interact with the Web container''s JavaBeans, which
    represent the application model. When a client sends a request from a JSP page,
    the response (that is, the JSP page) is sent back to the client depending on the
    selected hyperlinks or those request parameters invoked by the client request.
    If the generated response requires accessing a database, the JSP page uses JavaBean,
    which acquires the required data from the database.


