  md: "# Working with Functions and Arrays\n\nIn the code the $std_name works as a\
    \ temporary variable to get each value of array. When the loop executes, the next\
    \ available value of the array overwrites the existing value of the $std_name\
    \ and then $std_name points to the fetched value. It works just as walking through\
    \ your arrays by one.\n\n# The ArrayIterator\n\nPHP array keeps track of the current\
    \ element you are working on; the pointer to the current element is known as the\
    \ iterator. PHP has a ready-made extensible tool to loop over the arrays called\
    \ ArrayIterator (new in PHP 5.0) to set, move, and reset the iterator. The ArrayIterator\
    \ functions are:\n\n+   - current() - Returns the current element pointed by the\
    \ iterator\n- reset() - Moves the iterator to the first element in the array and\
    \ returns its value\n- next() - Moves the iterator to the next element in the\
    \ array and returns its value\n- prev() - Moves the iterator to the previous element\
    \ in the array and returns its value\n- end() - Moves the iterator to the last\
    \ element in the array and returns its value\n- each() - Returns the index and\
    \ value of the current element as an array and moves the iterator to the next\
    \ element in the array\n- key() - Returns the index of the current element\n\n\
    Listing 5.32: Using use of the ArrayIterator to traverse an array.\n\nListing\
    \ 5.32: Using the ArrayIterator\n\n```\n<?php\n$cities=array(\"United Kingdom\"\
    =>\"London\", \"United State\"=>\"Washington\", \"France\"=>\"Paris\", \"India\"\
    =>\"India\");\n// create an ArrayIterator object\n$iterator=new ArrayIterator($cities);\n\
    // rewind to beginning of array\n$iterator->rewind();\n// iterator over array\n\
    // print each value\nwhile($iterator->valid()) {\n    print $iterator->current().\n\
    ```\n\nOutput:\n\nLondon is in United Kingdom\nwashington is in United State\n\
    Paris is in France\nDelhi is in India\n\nIn the preceding listing, an ArrayIterator\
    \ object is initialized with an array variable, and the object's method used is\
    \ rewind() to reset the internal array pointer to the first element of the array.\
    \ While a loop executes until the valid() function returns true. Individual array\
    \ keys are retrieved with the current() function. The next() function moves the\
    \ internal array pointer forward to the next array element.\n\n141"
