  md: '# Debugging with JspDebug


    Debugging in JSP is a complex task, as pages are translated into Servlet source
    code and subsequently compiled. Hence, they become .java files. However, what
    you see in the JSP page and the error that is generated from the .java code correspond
    line for line. It is a tough task for a Web page designer at the given line number,
    the actual JSP code and at times, every error message is displayed in the browser.
    The situation is even worse for runtime errors that include an exception thrown
    from complex Servlet code or JavaBean. To analyze and then remove (or) them from
    the JSP code, you must print statements to the output console.


    JavaDebug is a tool debugging JSP as it converts a JSP page into a Java class,
    which can be easily debugged using any IDE that has a debugger. Once the bug has
    found, the fix can be put into the original JSP. Before adding it to the original,
    the Java file generated by JavaDebug can also be modified to see if particular
    fix solve the problem.


    JspDebug is not the first tool for JSP debugging. There are many other tools to
    help with JSP debugging; however, they have their merits, which are as follows:


    +   - Attempting to debug the JSP script level. This is not very useful, for instance,
    a setProperty fails, it is not useful to examine it at the JSP script level. It
    is necessary to look beneath at individual retrieval and set operations.

    - Attempting to debug the java code generated by the application server. The Java
    code generated by the application server is designed for machines, not humans.


    JspDebug takes a new and original approach to JSP debugging as it compiles Java
    Pages (JSP) files into easy to debug Java files, which can be debugged using any
    IDE, by the included JspDebug debug server.


    # Sharing Data between JSP Pages, Requests, and Users Passing Control


    Sharing of data between JSP pages is possible using the following JSP Scriptlet:


    +   - getParameter();

    - request.getAttribute(); request.setAttribute();

    - session.getAttribute(); session.setAttribute();

    - context.getAttribute(); context.setAttribute();


    For Example:


    ```

    < session.setAttribute("ID", request.getParameter("ID")); %>

    ```


    Here, session is a predefined variable. It is also possible by using the JavaBean.
    You should use the scope in the <jsp:useBean> action tag.


    # Sharing Session and Application Data


    For session sharing, you can use the following action tag:


    +   <jsp:useBean scope="session" ...>",


    For data sharing, you can use the following action tag:


    +   <jsp:useBean scope="application" ...>",'
