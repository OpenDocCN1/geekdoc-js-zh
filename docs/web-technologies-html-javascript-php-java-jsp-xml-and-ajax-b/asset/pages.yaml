  md: '# Chapter 9


    All properties, such as request parameters and attributes, of the ServletRequest
    interface are also accessible through the HttpServletRequest interface.


    Servlet can access request header information of an HTTP request by the following
    methods:


    +   - getHeader(String) – Returns the value of a request header for the given
    header name. If there are multiple headers with the same name, this method returns
    the first header value in the request.


    +   - getHeaderHeaders(String) – Returns all header values associated with the
    given name in the form of Enumeration of String objects.


    +   - getPath() – Returns path elements. Request paths are paths that allow a
    container to a Servlet. Request paths are composed of three parts, Context Path,
    Servlet Path, and Path Info. HttpServletRequest contains various methods to access
    the path URI, which are as follows:


    +   - getContextPath() – Returns an empty String if it is the default context,
    or the context rooted at the base of the Web server. If not, this path starts
    with a / but does not ends with /. The context path is the first part of the Uniform
    Resource Identifier (URI) and a path associated with the ServletContext of this
    servlet is a path.


    +   - getPath() – Returns an empty string, if the Servlet path starts with the
    / character except when the pattern is /. The path of the request URI is a path
    that matches the mapping that activated this request.


    +   - getInfo() – Accesses the path of the request URI that is not a part of the
    Context path or the Servlet path.


    +   - getRequestURI() – Returns the complete path, in the form of a combination
    of the Context path, the Servlet path, and the Path info, as shown in the following
    code:

    `Request URI = Context Path + Servlet Path + Path Info`


    Let''s now discuss the HttpServletResponse interface, which handles the response
    related to the HTTP protocol.


    # Working with HttpServletResponse


    HttpServletResponse is an interface, which is a subtype of the ServletResponse
    interface. The container implements this interface to encapsulate all HTTP protocol
    based information, including headers, to be returned from the server to the client.
    The following are the situations when response is closed:


    +   - When the service() method of the Servlet invoked by the container for the
    original request is terminated.


    +   - When the send() method of the Servlet, invoked as a part of forwarding a
    request (that is, using the `RequestDispatcher.forward(request)` method), is terminated.


    +   - When the amount of content specified in length is written to the response.
    You can use the `setContentLength()` method of `HttpServletResponse` to specify
    content length for a response.


    +   - When the sendError() method is called.


    +   - When the sendRedirect() method is called.


    Let''s now look at the various methods in `HttpServletResponse` to abstract HTTP
    response messages.


    # Methods for Response Headers


    HTTP response headers are helpful for clients to get information on content, such
    as the type of content being sent back, the amount of content being sent, and
    the type of server sending the content. The following are the methods available
    in the `HttpServletResponse` object to manage HTTP response headers:'
