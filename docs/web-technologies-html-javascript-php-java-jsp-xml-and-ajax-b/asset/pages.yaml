    # Writing and Reading the WebRowSet Object to XML Document


    The WebRowSet object can be used to read and write data into an XML document.
    The readXML() method is used to read data from the XML document, whereas the writeXML()
    method allows you to write data in the XML document.


    The uses of writeXML() and readXML() methods are described as follows:


    +   Using the writeXML() method - Writes the WebRowSet as an XML document that
    represents the current state of an object. The method writes the WebRowSet to
    the stream that is passed to it. It can be an OutputStream, such as a FileOutputStream,
    if the user wants to write in a binary format; or a Writer object, such as a FileWriter,
    if the user wants to write in characters.


    The following code snippet uses the WebRowSet as an XML document to the FileOutputStream
    object fileOutputStream:


    ```

    java.io.FileOutputStream outputStream = new

    java.io.FileOutputStream("emp.xml");

    wrs.writeXML(outputStream);

    ```


    The FileWriter is used to write the character data to an XML file, as shown in
    the following code snippet


    ```

    java.io.FileWriter writer = new java.io.FileWriter("emp.xml");

    wrs.writeXML(writer);

    ```


    Two variations of the writeXML() method, name: FileOutputStream and FileWriter,
    are used for the WebRowSet object to write the content of a ResultSet before writing
    it to a stream, as shown in the following code snippet:


    ```

    priceList.writeXML(rs, outputStream);

    priceList.writeXML(rs, writer);

    ```


    +   Using the readXML() method - Parses an XML document to construct a WebRowSet
    object. Similar to writing an XML document to be read, is parsed by the FileInputStream
    or FileWriter and is passed to the readXML(method).


    The following code snippet explains how to read from XML document into a WebRowSet
    object:


    ```

    java.io.FileInputStream inputStream = new

    java.io.FileInputStream("emp.xml");

    wrs.readXML(inputStream);

    ```


    The FileReader is used to read the XML character data to a WebRowSet object, as
    shown in the following code snippet


    ```

    java.io.FileReader reader = new java.io.FileReader("emp.xml");

    wrs.readXML(reader);

    ```


