  md: '# Chapter 5


    # Joining Array Elements into a String


    The implode() function joins array elements with a string. Following syntax is
    used to define the implode() function:


    ```

    string implode(separator , array)

    ```


    +   Parameters:

    - separator—Optional. Specifies what to put between the array elements, default
    is an empty string.

    - array—Required. The array to join to string.


    Return Value—Returns a string containing a string representation of all the array
    elements in the same order, with separator between each element.


    Listing 5.8 shows with a string how to join array elements using implode() function:


    Listing 5.8: Joining Array Elements into a Single String


    ```

    <?php

    $string=array(''kogent'', ''is'', ''a'', ''learning'', ''solution'');

    implode(" \ $string);

    ?>

    ```


    Output:

    kogent is a learning solution


    In the preceding listing, the implode() function joins the array elements into
    a string, kogent learning solution.


    # Finding the Position of a String in Another String


    The strpos() function finds the position of first occurrence of a string in another
    string (case-sensitive). Following syntax is used to define the strpos() function:


    ```

    int strpos(string, find, start)

    ```


    +   Parameters:

    - string—Required. Specifies the string to search.

    - find—Required. Specifies the string to find.

    - start—Optional. Specifies where to begin the search.


    Return Value—Returns the position as an integer. If it is not found, strpos()
    will return boolean false.


    Listing 5.9 shows a how to join array elements using implode() function:


    Listing 5.9: Finding the Position of a String in Another String


    ```

    <?php

    $string="kogent solutions";

    echo "the position of so in kogent solution is:".strpos($string , "so");

    ?>

    ```


    Output:

    7


    In the preceding listing, the strpos() finds the position of the string, in kogent
    solution.


