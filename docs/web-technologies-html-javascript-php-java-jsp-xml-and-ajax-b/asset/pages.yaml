  md: '# The EJB Container


    The EJB container provides an environment in which one or more enterprise beans
    can run. This environment is basically a combination of the available interfaces
    and classes that the container uses to support enterprise beans throughout their
    life cycle. The EJB container intercepts all method calls and provides the following
    to EJB components:


    +   - Life Cycle Management – Creates and removes enterprise bean instances and
    handles instance pooling with the activation and passivation of the bean instances

    - Naming Services – Provides JNDI registry for EJB when an enterprise bean is
    loaded on the Java EE server

    - Security Checks – Performs authentication and access control as well as implements
    declarative and programmatic security

    - Persistence Management – Helps to store the enterprise beans

    - Transaction Coordination – Defines declarative transaction management

    - Resource Pooling – Provides an indirect access to the bean instance


    The EJB container simplifies the development of a distributed application, such
    as security, transaction coordination, and data persistence. The EJB infrastructure
    implemented by the EJB container and service providers deals with the distribution
    aspects, transaction management, and security aspects of an application. The Java
    Application Programming Interfaces (APIs) for the EJB infrastructure are defined
    by the EJB specification. The developers need to focus only on the implementation
    of the business logic in the application, as the presentation logic can be implemented
    by the designers.


    Figure 8.8 shows the services provided by the EJB container:


    ![](img/ff578e59567ce41d5431f36224872e10_238_0.png)


    Figure 8.8: Displaying the Services Provided by the EJB Container


    +   The EJB container performs the following tasks for each enterprise bean:

    - Registers the object of an enterprise bean on the Java EE server

    - Provides a Remote interface for the object

    - Creates and destroys object instances

    - Checks security for the object

    - Manages the active state for the object (activation/passivation)

    - Coordinates distributed transactions

    - Persists Container-Managed Persistence (CMP) entity beans and saves stateful
    session beans when passivated'
