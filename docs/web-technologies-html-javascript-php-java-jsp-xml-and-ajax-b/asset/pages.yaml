  md: '# Chapter 2


    JavaScript is an interpreted, client-side (the scripts in the Web browser), and
    object-scripting language that offers various functionalities to enrich the static
    HTML Web pages. The scripts written in JavaScript are processed by line, which
    is the reason to refer to JavaScript as an interpreted language. The scripts are
    interpreted by the JavaScript interpreter that is an in-built component of the
    Web browser. Working with JavaScript scripts, you can use the in-built objects
    and other programmable features such as control flows and events to your HTML
    Web pages.


    The HTML Web pages that you have worked with in previous chapter are static and
    plain, their presentation, content are more or less fixed. Moreover, plain HTML
    Web pages do not offer a two-way interaction with the user and can be boring and
    monotonous. You can enhance the Web pages by adding dynamic content and interactivity.
    In them, you might want to validate the values that the user enters in an HTML
    form and perform different actions depending on the values, such as submitting
    the form when you click the submit button. In cases, you need to make the Web
    page interactive which you can do by using scripts in the HTML document.


    A script is a program code that is written using a scripting language. A scripting
    language is a kind of programming language with less features. Some of the most
    commonly used languages are JavaScript, VBScript, ASP, and PHP. JavaScript is
    the most popular scripting language to use infuse dynamic and interactivity in
    Web pages.


    # Introducing JavaScript


    JavaScript (originally named Live by its creator Netscape and Sun Microsystems)
    is an interpreted client-side (the scripts in the Web browser), and object-scripting
    language that offers various functionalities to enrich the static HTML Web pages.
    Note that JavaScript is also known as ECMAScript as it was standardized by the
    European Computer Manufacturers Association (ECMA).


    The scripts written in JavaScript are processed by line and is why JavaScript
    is an interpreted language. The scripts are interpreted by the JavaScript interpreter
    that is an in-built component of the Web browser. Working with the JavaScript
    scripts, you can use the in-built objects and other programmable features, such
    as control flows and events to your Web pages.


    # Client-Side Benefits of JavaScript over VB Script


    Client-side scripting languages, such as JavaScript and VBScript, are popularly
    used to develop interactive and dynamic Web pages. VBScript and JavaScript are
    programming languages most commonly used to manipulate and display and HTML content.
    They can be used in many applications. JavaScript, for example, can be embedded
    in the Shockwave Flash and Adobe PDF documents. VBScript is commonly used as a
    scripting language for administrators in the Microsoft Windows environment.


    Both of these languages allow a developer to complete complex tasks in a relatively
    short period of time. This highly allows developers to add dynamic qualities to
    static HTML and allows for more robust Web pages. JavaScript has the following
    benefits over VB Script:


    +   JavaScript is very fast because any code can run immediately without waiting
    for an answer from the server.


    +   JavaScript is relatively simple to learn and implement.


    +   JavaScript reduces the demand on the server as it is a client-side scripting
    language.


    # Embedding JavaScript in an HTML Page


    You can embed a JavaScript script in an HTML document using the <script> and </script>
    tags. The <script> and </script> tags are HTML tags that allow you to enclose
    a script. When an HTML document contains these tags is loaded in the Web browser,
    it processes content enclosed within the <script> and </script> tags as script
    code.'
