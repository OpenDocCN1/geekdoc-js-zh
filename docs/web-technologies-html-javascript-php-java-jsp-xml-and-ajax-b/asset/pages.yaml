  md: "# Working with XML\n\nThe value of the href attribute may be a relative URI,\
    \ as shown in the previous example, or an absolute URI. If the URI is relative\
    \ then it is interpreted in the light of the base URI of the importing stylesheet.\
    \ The file reference in the value of the href attribute must be a valid XSLT stylesheet.\
    \ The top-level <xsl:stylesheet> element of the imported stylesheet is evaluated,\
    \ discarded and the top-level children of the discarded element are inserted into\
    \ the importing stylesheet in place of the <xsl:import> element.\n\nSyntax: <xsl:import>\n\
    \nThe syntax of <xsl:import> is as follows:\n\n```\n <xsl:import href=\"URI\"\
    \ />\n```\n\n# Attributes\n\nTable 7.8: Attribute of <xsl:import>\n\n| Name |\
    \ Value | Meaning |\n|---|---|---|\n| href | URI | It specifies the URI of the\
    \ imported stylesheet |\n\n# The <xsl:call-template> Element\n\nThis element calls\
    \ a named template. We mentioned earlier the <xsl:template> element may have a\
    \ name attribute and such a template can be called by name. The <xsl:call-template>\
    \ element is used to do this. The <xsl:call-template> element has only one attribute,\
    \ the name attribute, which is a required attribute. The name attribute of the\
    \ <xsl:call-template> element and the name attribute of the <xsl:template> element\
    \ must match. An <xsl:call-template> element may have one or more nested <xsl:with-param>\
    \ elements.\n\nIf you have a template like this:\n\n```\n<xsl:template name=\"\
    CalledTemplate\">\n  <!-- The works of the template goes here. -->\n</xsl:template>\n\
    ```\n\nThen you can call template using the following code:\n\n```\n<xsl:call-template\
    \ name=\"CalledTemplate\"/>\n```\n\nOr, if you also want to pass a parameter,\
    \ it would generate this form:\n\n```\n<xsl:call-template name=\"CalledTemplate\"\
    >\n  <xsl:with-param name=\"ID\" select=\"StudentID\"/>\n</xsl:call-template>\n\
    ```\n\nSince the parameter is evaluated, there would need to be a corresponding\
    \ <xsl:param> element within the <xsl:template> element, like this:\n\n```\n<xsl:template\
    \ name=\"CalledTemplate\">\n  <xsl:param name=\"ID\"/>\n  <!--The rest of the\
    \ works of the template goes here. -->\n</xsl:template>\n```\n\nThe <xsl:call-template>\
    \ element can be used recursively to process a list, either a node set or a list\
    \ of separated strings."
