  md: '# Chapter 11


    # the application Object


    The application object refers to the entire environment of a Web application to
    which a JSP page belongs. This object is of the javax.servlet.ServletContext type.


    # The Session Object


    The session object helps access session data and is of the HttpSession type. It
    is declared if the value of the session attribute in a page directive is true.
    By default, the value of the session attribute is always true. If you explicitly
    specify the session attribute to false, the JSP engine does not declare this object.
    In such a case, if you try to access the session object, an error is generated.


    # The Config Object


    The config object specifies the configuration of parameters passed to a JSP page.
    This object is of the javax.servlet.ServletConfig type. To demonstrate the use
    of the config object within a JSP page, we associate a servlet with a <jsp-file>
    element. After associating a Servlet, all initialization parameters for the named
    servlet are made available to the JSP page config.


    # The Exception Object


    The exception object is of java.lang.Throwable type and is only available for
    those JSP pages that act as error handlers for other pages. This object is only
    available to the JSP pages that have the isError attribute set to ''true'' with
    page directive.


    All discussed objects are always available within the script and expression tags.
    These objects are not applicable to be used in the declaration tag. However, you
    can use the getServerConfig() method to get the ServletConfig type of object reference
    in a declaration tag, while implementing the jspInit or jDestroy methods. You
    can use the getServletContext method of ServletConfig to get the Servlet object.


    # Working with Implicit Objects


    Let''s learn how to use implicit objects in a JSP page to create a dynamic Web
    page. Let''s develop a simple Web application using implicitObjects using implicit
    objects, such as request, session, and pageContext. This application performs
    three tasks, namely: overriding the jspInit() method to perform initializations,
    using initialization parameters to implement the config object, and accessing
    the JSP document placed in a private folder.


    This application contains the following pages:


    +   - Home.html – Represents the index page of the application

    - request.jsp – Displays the welcome message

    - pageContext.jsp – Demonstrates the use of the pageContext implicit object

    - other.jsp – Demonstrates the use of other implicit objects such as session,
    output, and application config.


    The Home.html page of this application consists of a simple form with a text field,
    a Name, and a button, Invoke JSP. Listing 11.2 shows the code for the Home.html
    page.


    Listing 11.2: Home.html


    ```

    <html>

    <body>

    <form action="request.jsp" type="text" name="name">

    Name : <input type="text" name="name">

    <input type="submit" value="Invoke" />

    </form>

    </body>

    </html>

    ```


