    $x is equal to 1


    In Listing 4.1, if the condition stated in the block is true, the message $x is
    equal to 1 displayed. However, if the condition is false, the output gets the
    blank Web page. When you have more than one statement to be executed within a
    condition, it is necessary to provide them in brackets as shown in listing 4.2.


