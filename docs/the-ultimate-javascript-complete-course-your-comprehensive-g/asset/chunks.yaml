  trans: "\n\n```javascript\nfunction addNumbers(a, b) {\n  return a + b;\n}\nlet\
    \ result = addNumbers(5, '10'); console.log(result);\n```\n\n### 错误信息：\n\nUncaught\
    \ TypeError: Cannot add property 'toString' of undefined\n\n### 我目前尝试过的：\n\n我尝试过将两个参数都转换为数字，但错误仍然存在。\n\
    \n```yaml\n--\n```\n\n错误是编程的一部分，也是一个宝贵的学习机会。在接下来的章节中，我们将介绍运算符，这是 JavaScript 中的另一个重要概念。\n\
    \n--\n\n# 运算符\n\n## 数学运算符\n\n数学运算符用于执行基本的算术运算。以下是最重要的运算符：\n\n- `+` (加法)：将两个数字相加。\n\
    - `-` (减法)：从一个数字减去另一个数字。\n- `*` (乘法)：将两个数字相乘。\n- `/` (除法)：将一个数字除以另一个数字。\n- `%`\
    \ (取模)：返回除法的余数。\n- `**` (幂)：计算数字的次方。\n\n### 示例\n\n```javascript\nlet a = 10; let\
    \ b = 3;\n\nconsole.log(a + b); // 13\nconsole.log(a - b); // 7\nconsole.log(a\
    \ * b); // 30\nconsole.log(a / b); // 3.3333333333333335 console.log(a % b); //\
    \ 1\nconsole.log(a ** b); // 1000\n```\n\n## 字符串拼接与多行字符串\n\n字符串的拼接也使用 `+` 运算符。\n\
    \n### 示例\n\n```javascript\nlet firstName = 'John';\nlet lastName = 'Doe';\nlet\
    \ fullName = firstName + ' ' + lastName;\n\nconsole.log(fullName); // John Doe\n\
    ```\n\n### 多行字符串\n\n多行字符串可以使用反引号（`` ` ``）创建。\n\n### 示例\n\n```javascript\nlet message\
    \ = `This is a multiline\nString `;\n\nconsole.log(message);\n```\n\n## 模板字符串与多行模板字符串\n\
    \n模板字符串允许你使用 `${}` 将变量和表达式插入字符串中。\n\n### 示例\n\n```javascript\nlet name = 'Alice';\n\
    let greeting = `Hello, ${name}! console.log(greeting); // Hello, Alice!\n```\n\
    \n## 数字的比较运算符\n\n比较运算符用于比较两个值。它们返回一个布尔值（true 或 false）。\n\n- `==` (等于)：检查值是否相等。\n\
    - `!=` (不等于)：检查值是否相等。\n- `===` (严格相等)：检查值和类型是否相等。\n- `!==` (严格不相等)：检查值或类型是否不相等。\n\
    - `>` (大于)：检查左侧值是否大于右侧值。\n- `<` (小于)：检查左侧值是否小于右侧值。\n- `>=` (大于等于)：检查左侧值是否大于或等于右侧值。\n\
    - `<=` (小于等于)：检查左侧值是否小于或等于右侧值。\n\n### 示例\n\n```javascript\nlet x = 5; let y =\
    \ 10;\n\nconsole.log(x == y); // false console.log(x != y); // true console.log(x\
    \ === y); // false console.log(x !== y); // true console.log(x > y); // false\
    \ console.log(x < y); // true console.log(x >= y); // false console.log(x <= y);\
    \ // true\n```\n\n## 字符串的比较运算符\n\n比较运算符也可以应用于字符串。比较基于字典顺序（字母顺序）。\n\n### 示例\n\n\
    ```javascript\nlet str1 = 'apple'; let str2 = 'banana';\n\nconsole.log(str1 ==\
    \ str2); // false\nconsole.log(str1 != str2); // true\nconsole.log(str1 < str2);\
    \ // true (apple 排在 banana 之前) console.log(str1 > str2); // false\n```\n\n## JavaScript\
    \ 中的类型安全\n\nJavaScript 是一种动态类型语言，这意味着变量的类型是在运行时确定的。因此，理解 `==` 和 `===` 的区别非常重要。\n\
    \n- `==` 只检查值的相等性。\n- `===` 同时检查值和类型的相等性。\n\n### 示例\n\n```javascript\nlet num\
    \ = 5; let str = '5';\nconsole.log(num == str); // true (只比较值) console.log(num\
    \ === str); // false (比较了值和类型)\n```\n\n## 逻辑运算符\n\n逻辑运算符用于组合布尔值并评估逻辑表达式。\n\n-\
    \ `&&` (逻辑与)：如果两个操作数都为 true，则返回 true。\n- `||` (逻辑或)：如果其中一个操作数为 true，则返回 true。\n\
    - `!` (逻辑非)：返回值的反值。\n\n### 示例\n\n```javascript\nlet a = true; let b = false;\n\
    \nconsole.log(a && b); // false console.log(a || b); // true console.log(!a);\
    \ // false console.log(!b); // true\n```\n\n以上是 JavaScript 的基本运算符。在下一个章节中，我们将介绍允许你在代码中创建条件语句的控制结构。\n\
    \n# 控制结构 I\n\n## if 语句\n\n`if` 语句用于检查条件，仅当条件为真时才执行代码。\n\n### 语法\n\n```javascript\n\
    if (condition) {\n  // 如果条件为真则执行代码\n}\n```\n\n### 示例\n\n```javascript\nlet age\
    \ = 18;\n\nif (age >= 18) {\n  console.log('You are of legal age.');\n}\n```\n\
    \n在这个示例中，只有当 `age` 变量大于或等于 18 时，才会显示“You are of legal age.”\n\n## if-else 语句\n\
    \n使用 `if-else` 语句，你可以在条件为真时执行代码，在为假时执行其他代码。\n\n### 语法\n\n```javascript\nif (condition)\
    \ {\n  // 如果条件为真则执行代码\n} else {\n  // 如果条件为假则执行代码\n}\n```\n\n### 示例\n\n```javascript\n\
    let age = 16;\n\nif (age >= 18) {\n  console.log('You are of legal age.');\n}\
    \ else {\n  console.log('You are underage.');\n}\n```\n\n在这个示例中，因为 `age` 小于 18，所以显示“You\
    \ are underage.”\n\n## else-if 语句\n\n`else-if` 语句允许检查多个条件。如果第一个条件为假，则检查下一个条件。\n\
    \n### 语法\n\n```javascript\nif (condition1) {\n  // 如果 condition1 为真则执行代码\n} else\
    \ if (condition2) {\n  // 如果 condition2 为真则执行代码\n} else {\n  // 如果所有条件都为假则执行代码\n\
    }\n```\n\n## 嵌套 if 语句\n\n你可以在 `if` 语句内部嵌套其他 `if` 语句来检查复杂的条件。\n\n# 函数\n\n## 函数基础\n\
    \n函数是执行特定任务的可重用代码块。它们有助于代码模块化和可读性。JavaScript 有多种定义函数的方法。\n\n### 语法\n\n```javascript\n\
    function name(parameters) {\n  // 执行代码\n}\n```\n\n### 示例\n\n```javascript\nfunction\
    \ greet() {\n  console.log('Hello, world!');\n}\ngreet();\n```\n\n## 带参数的函数\n\n\
    函数可以参数作为输入。\n\n### 语法\n\n```javascript\nfunction name(parameters) {\n  // 执行代码\n\
    }\n```\n\n### 示例\n\n```javascript\nfunction greet(name) {\n  console.log('Hello,\
    \ ' + name + '!');\n}\ngreet('Max'); // Output: Hello, Max!\n\n## 带默认参数的函数\n\n\
    默认参数允许在未传递参数时定义值。\n\n### 语法\n\n```javascript\nfunction name(parameter = defaultValue)\
    \ {\n  // 执行代码\n}\n```\n\n### 示例\n\n```javascript\nfunction greet(name = 'World')\
    \ {\n  console.log('Hello, ' + name + '!');\n}\ngreet(); // Output: Hello, World!\n\
    ```\n\n## return 语句\n\n函数可以使用 `return` 语句返回值。\n\n### 语法\n\n```javascript\nfunction\
    \ name(parameters) {\n  // 执行代码\n  return value;\n}\n```\n\n### 示例\n\n```javascript\n\
    function add(a, b) {\n  return a + b;\n}\nlet sum = add(5, 3);\nconsole.log(sum);\
    \ // Output: 8\n```\n\n## 作用域\n\n作用域决定了变量的可访问性。变量有两种主要类型：全局和局部。\n\n### 全局作用域\n\
    \n在函数外部声明的变量具有全局作用域，在代码的任何地方都可以访问。\n\n### 局部作用域\n\n在函数内部声明的变量具有局部作用域，仅在该函数内部可用。\n\
    \n### 示例\n\n```javascript\nlet globalVar = 'I am global';\n\nfunction myFunction()\
    \ {\n  let localVar = 'I am local';\n  console.log(globalVar); // 可以访问\n}\n\n\
    myFunction();\n// console.log(localVar); // Error: localVar is not defined\n```\n\
    \n## 提升\n\n提升是 JavaScript 中的一种行为，变量和函数的声明会被移动到它们所在作用域的顶部。\n\n### 示例\n\n```javascript\n\
    console.log(myVar); // undefined\nvar myVar = 'Hello';\n\nfunction myFunc() {\n\
    \  return 'World';\n}\nconsole.log(myFunc()); // Output: World\n```\n\n## 函数表达式\
    \ vs. 函数声明（提升）\n\n定义函数有两种方式：函数声明和函数表达式。函数声明会被提升，而函数表达式则不会。\n\n### 函数声明\n\n```javascript\n\
    function greet() {\n  return 'Hello';\n}\nconsole.log(greet()); // Hello\n```\n\
    \n### 函数表达式\n\n```javascript\nconsole.log(greet()); // Error: greet is not defined\n\
    \nlet greet = function() {\n  return 'Hello';\n};\n```\n\n# 对象\n\n## 对象基础\n\n\
    对象是 JavaScript 中的基本构建块，允许在结构中组织相关数据和函数。对象由属性和方法（函数）组成。\n\n### 语法\n\n```javascript\n\
    let obj = {\n  key1: value1,\n  key2: value2,\n  // 方法\n  methodName: function()\
    \ {\n    // 代码\n  }\n};\n```\n\n### 示例\n\n```javascript\nlet person = {\n  name:\
    \ 'Max',\n  age: 30,\n  greet: function() {\n    console.log('Hello, I am ' +\
    \ this.name);\n  }\n};\nperson.greet(); // Output: Hello, I am Max\n```\n\n##\
    \ 嵌套对象\n\n对象的属性可以是另一个对象。\n\n### 示例\n\n```javascript\nlet address = {\n  city:\
    \ 'Berlin',\n  postalCode: '12345'\n};\n\nlet person = {\n  name: 'Max',\n  address:\
    \ address\n};\nconsole.log(person.address.city); // Output: Berlin\n```\n\n##\
    \ 读取和设置值（点符号）\n\n你可以使用点符号访问和更改对象的属性。\n\n### 示例\n\n```javascript\nlet person =\
    \ {\n  name: 'Max',\n  age: 30\n};\n\nconsole.log(person.name); // Output: Max\n\
    person.age = 31;\nconsole.log(person.age); // Output: 31\n```\n\n## 读取和设置值（括号符号）\n\
    \n另一种，你可以使用方括号符号访问属性。\n\n### 示例\n\n```javascript\nlet person = {\n  name: 'Max',\n\
    \  age: 30\n};\n\nconsole.log(person['name']); // Output: Max\nperson['age'] =\
    \ 31;\nconsole.log(person['age']); // Output: 31\n```\n\n## 添加、更改和删除属性\n\n你可以为对象添加、更改或删除属性。\n\
    \n### 示例\n\n```javascript\nlet person = {\n  name: 'Max',\n  age: 30\n};\n\n//\
    \ 添加\nperson.gender = 'male';\nconsole.log(person.gender); // Output: male\n\n\
    // 修改\nperson.age = 31;\nconsole.log(person.age); // Output: 31\n\n// 删除\ndelete\
    \ person.age;\nconsole.log(person.age); // Output: undefined\n\n# 控制结构 II\n\n\
    ## switch 语句\n\n`switch` 语句用于检查多个条件。它是长 `if-else` 链的良好替代方案。\n\n### 语法\n\n```javascript\n\
    switch (expression) {\n  case value1:\n    // 当 expression === value1 时执行代码\n\
    \    break;\n  case value2:\n    // 当 expression === value2 时执行代码\n    break;\n\
    \  default:\n    // 如果没有 case 匹配则执行代码\n}\n```\n\n### 示例\n\n```javascript\nlet\
    \ fruit = 'Banana';\n\nswitch (fruit) {\n  case 'Apple':\n    console.log(\"It's\
    \ an apple.\");\n    break;\n  case 'Banana':\n    console.log(\"It's a banana.\"\
    );\n    break;\n  case 'Orange':\n    console.log(\"It's an orange.\");\n    break;\n\
    \  default:\n    console.log(\"Unknown fruit.\");\n}\n```\n\n在这个示例中，因为 `fruit`\
    \ 等于 'Banana'所以输出“It's a banana.”\n\n# 数组 I：基础\n\n## 数组基础\n\n数组是用于在单个变量中存储多个值的数据结构。数组中的每个值都有一个索引，从\
    \ 0 开始。\n\n### 语法\n\n```javascript\nlet array = [element1, element2, element3];\n\
    ```\n\n### 示例\n\n```javascript\nlet fruits = ['apple', 'banana', 'orange'];\n\
    console.log(fruits[0]); // Output: apple\nconsole.log(fruits[1]); // Output: banana\n\
    console.log(fruits[2]); // Output: orange\n```\n\n## 数组是特殊的\n\n在 JavaScript 中，数组是特殊的对象。它们拥有专门为处理列表开发的额外方法和属性。\n\
    \n### 示例\n\n```javascript\nlet fruits = ['apple', 'banana', 'orange'];\nconsole.log(typeof\
    \ fruits); // Output: object\n```\n\n## 多维数组\n\n多维数组包含其他数组作为元素。这对于显示矩阵或表格非常有用。\n\
    \n### 示例\n\n```javascript\nlet matrix = [\n  [1, 2, 3],\n  [4, 5, 6],\n  [7, 8,\
    \ 9]\n];\nconsole.log(matrix[0][0]); // Output: 1\nconsole.log(matrix[1][2]);\
    \ // Output: 6\n```\n\n# 数组 II：高级用户功能\n\n## 过滤数组\n\n`filter` 方法创建一个新数组，其中包含所有符合特定元素的。条件由回调函数定义。\n\
    \n### 语法\n\n```javascript\nlet newArray = array.filter(callback);\n```\n\n###\
    \ 示例\n\n```javascript\nlet numbers = [1, 2, 3, 4, 5, 6];\nlet evenNumbers = numbers.filter(function(number)\
    \ {\n  return number % 2 === 0;\n});\nconsole.log(evenNumbers); // Output: [2,\
    \ 4, 6]\n```\n\n可以使用不同的方法向数组添加或删除元素。\n\n## push() 和 pop()\n\n- `push(element)`：向数组末尾添加一个元素。\n\
    - `pop()`：移除数组的最后一个元素并返回它。\n\n### 示例\n\n```javascript\nlet fruits = ['apple',\
    \ 'banana'];\nfruits.push('orange');\nconsole.log(fruits); // Output: ['apple',\
    \ 'banana', 'orange']\n\nlet last = fruits.pop();\nconsole.log(last); // Output:\
    \ orange\nconsole.log(fruits); // Output: ['apple', 'banana']\n```\n\n## unshift()\
    \ 和 shift()\n\n- `unshift(element)`：向数组开头添加元素。\n- `shift()`：移除数组的第一个元素并返回它。\n\n\
    ### 示例\n\n```javascript\nlet fruits = ['apple', 'banana'];\nfruits.unshift('orange');\n\
    console.log(fruits); // Output: ['orange', 'apple', 'banana']\n\nlet first = fruits.shift();\n\
    console.log(first); // Output: orange\nconsole.log(fruits); // Output: ['apple',\
    \ 'banana']\n```\n\n## 使用 includes(), indexOf() 和 lastIndexOf() 数组\n\n- `includes(element)`：检查是否存在特定元素，返回\
    \ true 或 false。\n- `indexOf(element)`：返回元素在数组中的第一次索引，找不到则返回 -1。\n- `lastIndexOf(element)`：返回元素在数组中的最后一个索引，找不到则返回\
    \ -1。\n\n### 示例\n\n```javascript\nlet fruits = ['apple', 'banana', 'apple'];\n\
    console.log(fruits.includes('banana')); // Output: true\nconsole.log(fruits.indexOf('apple'));\
    \ // Output: 0\nconsole.log(fruits.lastIndexOf('apple')); // Output: 2\n```\n\n\
    ## Sets\n\n`Set` 是一个值的集合，每个值只出现一次。\n\n### 创建 Set\n\n```javascript\nlet set = new\
    \ Set();\n```\n\n### 添加值\n\n```javascript\nlet set = new Set();\nset.add(1);\n\
    set.add(2);\nset.add(1); // 1 已经存在，不会重复添加\n```\n\n### 检查值是否存在\n\n```javascript\n\
    let set = new Set([1, 2]);\nconsole.log(set.has(1)); // Output: true\nconsole.log(set.has(3));\
    \ // Output: false\n```\n\n### 删除值\n\n```javascript\nlet set = new Set([1, 2,\
    \ 3]);\nset.delete(2);\nconsole.log(set.has(2)); // Output: false\n```\n\n## Maps\n\
    \n`Map` 对象存储键值对，并记住键的插入顺序。\n\n### 创建 Map\n\n```javascript\nlet map = new Map();\n\
    ```\n\n### 添加值\n\n```javascript\nlet map = new Map();\nmap.set('key1', 'value1');\n\
    map.set('key2', 'value2');\n```\n\n### 获取值\n\n```javascript\nlet map = new Map();\n\
    map.set('key1', 'value1');\nconsole.log(map.get('key1')); // Output: value1\n\
    ```\n\n### 删除值\n\n```javascript\nlet map = new Map();\nmap.set('key1', 'value1');\n\
    map.delete('key1');\nconsole.log(map.get('key1')); // Output: undefined\n```\n\
    \n## 箭头函数 (\"fat arrow syntax\")\n\n箭头函数是 ES6 引入的紧凑语法。它们与普通函数在 `this` 行为上不同。\n\
    \n### 语法\n\n```javascript\nconst myFunction = (param1, param2) => {\n  return\
    \ result;\n};\n```\n\n### 示例\n\n```javascript\nconst add = (a, b) => a + b; //\
    \ 如果函数只有一行，可以省略括号\nconsole.log(add(5, 3)); // Output: 15\n```\n\n## `this` 行为差异\n\
    \n箭头函数从周围上下文绑定 `this` 关键字。\n\n### 示例\n\n```javascript\nfunction Person() {\n \
    \ this.age = 0;\n  setInterval(() => {\n    this.age++;\n    console.log(this.age);\n\
    \  }, 1000);\n}\nlet p = new Person();\n```\n\n## async 和 defer 属性\n\n这些属性用于控制\
    \ HTML 中脚本的执行。\n\n- `async`：脚本异步加载并在一旦可用立即执行。不会阻塞页面加载。\n- `defer`：脚本异步加载，但只有在\
    \ HTML 文档完全解析后才执行。保留 `defer` 脚本的顺序。\n\n```html\n<script src=\"script.js\" async></script>\n\
    <script src=\"script.js\" defer></script>\n```\n\n## 三元运算符\n\n三元运算符提供了条件表达式的紧凑语法。\n\
    \n### 语法\n\n```javascript\ncondition ? expr1 : expr2;\n```\n\n### 示例\n\n```javascript\n\
    let age = 18;\nlet status = (age >= 18) ? 'Adult' : 'Minor';\nconsole.log(status);\
    \ // Output: Adult\n```\n\n## 展开语法 (spread)\n\n展开语法允许展开数组或对象。\n\n### 数组示例\n\n\
    ```javascript\nlet arr1 = [1, 2, 3];\nlet arr2 = [...arr1, 4, 5, 6];\nconsole.log(arr2);\
    \ // Output: [1, 2, 3, 4, 5, 6]\n```\n\n### 对象示例\n\n```javascript\nlet obj1 =\
    \ {a: 1, b: 2};\nlet obj2 = {...obj1, c: 3};\nconsole.log(obj2); // Output: {a:\
    \ 1, b: 2, c: 3}\n```\n\n## 剩余参数语法\n\n剩余参数语法允许以数组形式接收数量的参数。\n\n### 示例\n\n```javascript\n\
    function sum(...numbers) {\n  return numbers.reduce((acc, curr) => acc + curr,\
    \ 0);\n}\nconsole.log(sum(1, 2, 3, 4)); // Output: 10\n```\n\n"
