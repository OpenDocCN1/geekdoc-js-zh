    value.

    • < (less than): Checks whether the left-hand value is smaller than the right-hand
    value.

    • >= (greater than or equal to): Checks whether the left-hand value is greater
    than or equal to the right-hand value.

    • <= (less than or equal to): Checks whether the left-hand value is less than
    or equal to the right-hand value.


