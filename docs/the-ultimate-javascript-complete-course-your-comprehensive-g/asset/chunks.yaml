    # Classes


    ## Object-oriented programming (OOP)


    Object-oriented programming (OOP) is a programming paradigm based on the use of
    objects. An object contains both data (properties) and functions (methods) that
    can be applied to this data. JavaScript supports OOP through the use of classes.


    ## Introduction to the topic of classes


    Classes are templates for objects. They define the properties and methods that
    the created objects have.


    ### Syntax


    class ClassName {

    constructor(parameter1, parameter2) { this.property1 = parameter1; this.property2
    = parameter2;


    }


    method1() { // Method

    }


    method2() { // Method

    }

    }


    ### Example


    class Person {

    constructor(name, age) { this.name = name; this.age = age;


    }

    greet() {

    console.log(`Hello, my name is ${this.name} and I am ${this.age} years old.`);

    }

    }

    let person1 = new Person(''Max'', 30);

    person1.greet(); // Hello, my name is Max and I am 30 years old.


    ## Classes and the constructor


    Theconstructor is a special method that is called when a new object of the class
    is created. It initializes the properties of the object.


    ### Example


    class Car {

    constructor(make, model, year) { this.make = make;

    this.model = model;

    this.year = year;


    }

    displayInfo() {

    console.log(`Auto: ${this.make} ${this.model}, year of manufacture


    ${this.year}`);

    }

    }


    let car1 = new Car(''Toyota'', ''Corolla'', 2020);

    car1.displayInfo(); // Car: Toyota Corolla, year of manufacture 2020


    ## Methods


    Methods are functions that are defined within a class and can be applied to the
    objects of this class.


    ### Example


    class Rectangle {

    constructor(width, height) { this.width = width;

    this.height = height;


    }


    area() {

    return this.width * this.height;

    }

    }


    let rect = new Rectangle(5, 10); console.log(rect.area()); // 50


    ## Getter and setter


    Getters and setters are special methods that enable the properties of an object
    to be read and written.


    ### Example


    class Circle {

    constructor(radius) { this._radius = radius; }


    get radius() {

    return this._radius;

    }


    set radius(value) {

    if (value > 0) {

    this._radius = value;


    } else {

    console.log(''Radius must be positive.'');

    }

    }


    area() {

    return Math.PI * this._radius * this._radius;

    }

    }


    let circle = new Circle(5);

    console.log(circle.radius); // 5

    circle.radius = 10;

    console.log(circle.area()); // 314.1592653589793 circle.radius = -1; // Radius
    must be positive.


    ## The alternative to getters and setters


    You can also use normal methods to set and get properties.


    ### Example


    class Square {

    constructor(side) { this.side = side; }


    getSide() {

    return this.side;

    }


    setSide(value) {

    if (value > 0) {

    this.side = value;


    } else {

    console.log(''Side length must be positive.'');

    }

    }


    area() {

    return this.side * this.side;

    }

    }


    let square = new Square(4);

    console.log(square.getSide()); // 4

    square.setSide(6);

    console.log(square.area()); // 36

    square.setSide(-2); // Side length must be positive.


    ## Extending classes I: extends andsuper()


    With extends, you can let a class inherit from another class in order to take
    over its properties and methods. With super() you can call the constructor of
    the base class.


    ### Example


    class Animal {

    constructor(name) { this.name = name; }


    speak() {

    console.log(`${this.name} makes a noise.`);

    }

    }


    class Dog extends Animal { constructor(name, breed) { super(name);

    this.breed = breed;


    }


    speak() {

    console.log(`${this.name}, the ${this.breed}, barks.`);

    }

    }


    let dog = new Dog(''Bella'', ''Labrador''); dog.speak(); // Bella, the Labrador,
    barks.


    ## Extending classes II: Adding and overwriting properties and methods


    Extended classes can add their own properties and methods or override the methods
    of the base class.


    ### Example


    class Person {

    constructor(name) { this.name = name; }


    introduce() {

    console.log(`Hello, I''m ${this.name}.`);

    }

    }


    class Student extends Person { constructor(name, subject) { super(name);

    this.subject = subject;


    }

    introduce() {

    console.log(`Hello, I''m ${this.name} and I''m studying ${this.subject}.`);

    }


    study() {

    console.log(`${this.name} is currently studying ${this.subject}.`);

    }

    }


    let student = new Student(''Anna'', ''Informatik'');

    student.introduce(); // Hi, I''m Anna and I''m studying computer science. student.study();
    // Anna is currently studying computer science.


    That was the introduction to classes and object-oriented programming in JavaScript.
