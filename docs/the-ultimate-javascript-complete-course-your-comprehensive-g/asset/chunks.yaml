    # Introduction


    ## Welcome to the course!

    Welcome to your JavaScript course! In this book you will learn everything you
    need to get started with JavaScript. JavaScript is a versatile and widely used
    programming language that is mainly used to create interactive websites. Whether
    you are a complete beginner or already have some programming experience, this
    book will help you build a solid foundation in JavaScript.


    ## Note for participants

    Before we get started, here are a few tips to help you get started:


    • Practice makes perfect: programming is a practical skill. The more you practise,
    the better you get.

    • Mistakes are normal: everyone makes mistakes, especially at the beginning. They
    are an important part of the learning process. Learn from them and don''t give
    up!

    • Ask questions: If you don''t understand something, look for answers. Use online
    resources, forums and communities to find support.

    • Stay curious: JavaScript offers endless possibilities. Explore and experiment
    to constantly expand your skills.


    ## What will you learn in this course?

    In this course you will learn the basics of JavaScript step by step. We will start
    with the basic concepts and work our way up to more advanced topics. Here is an
    overview of the topics that await you:


    1. Preparation: Installation and setup of the required software.

    2. The basics of JavaScript: Introduction and your first JavaScript program.

    3. Variables: Dealing with variables and data types.

    4. Operators: Mathematical and logical operations.

    5. Control structures: conditions and loops.

    6. Functions: Definition and use of functions.

    7. Objects: Working with objects and their methods.

    8. Arrays: Basics and advanced functions of arrays.

    9. DOM: Manipulation of the Document Object Model.

    10. Events and event handling: Working with user input and events.

    11. Asynchronous programming: Introduction to Promises and `async/await`.

    12. Error handling and debugging: Dealing with errors in the code.

    13. JavaScript libraries and frameworks: overview of popular tools.

    14. Project work: Creation of a simple web application.

    15. Further resources: Tips and resources for further learning.


    This book is structured so that you can go back and revisit a topic at any time.
    Each section builds on the previous one, so make sure you understand the basics
    before moving on.


    # Preparation


    ## Installing and setting up the code editor (Visual Studio Code)

    Before you can start programming in JavaScript, you need a code editor. We recommend
    Visual Studio Code (`VS Code`) as it is powerful, free and very user-friendly.
    Here are the steps to install and set it up:


    1. Download and installation:

    - Visit the Visual Studio Code website.

    - Download the version for your operating system (Windows, macOS or Linux).

    - Follow the installation instructions.

    2. First installation:

    - Start Visual Studio Code after the installation.

    - Set up your preferred color scheme (light or dark).

    - Install important extensions:

    - `ESLint`: For checking your code for errors.

    - `Prettier`: For the automatic formatting of your code.

    - `JavaScript (ES6) code snippets`: For helpful code snippets.

    3. Create a new project:

    - Open Visual Studio Code.

    - Click on "File" > "Open" and create a new folder for your project.

    - Create a new file with the extension `.js` (e.g. `index.js`).


    ## Installation of the browser (Google Chrome)

    A web browser is necessary to test your JavaScript programs. We recommend Google
    Chrome as it offers powerful developer tools that can help you with debugging
    and testing.


    1. Download and installation:

    - Visit the Google Chrome website.

    - Download and install the version for your operating system.

    2. Developer tools:

    - Open Google Chrome.

    - Press `F12` or `Ctrl + Shift + I` (Windows/Linux) or `Cmd + Option + I` (macOS)
    to open the developer tools.

    - Use the `"Console"` tab to execute and test JavaScript code directly in the
    browser.


    With these preparations, you are now ready to dive into the world of JavaScript.
    In the next chapter, we will look at the basics of JavaScript and write our first
    small program.


    # Basics of JavaScript


    ## Introduction to JavaScript

    JavaScript is one of the three core technologies of the World Wide Web, alongside
    HTML and CSS. While HTML is responsible for the structure and CSS for the design,
    JavaScript enables the interactivity of websites. It is supported in almost every
    modern web browser and is one of the most widely used programming languages in
    the world.


    ### Why JavaScript?

    • Easy to learn: JavaScript is a beginner-friendly language.

    • Widely used: There is a large community and many resources.

    • Flexible: JavaScript can be used for both simple scripts and complex web applications.

    • Interactive: Enables dynamic content and user interaction.


    ## Your first JavaScript program: Hello world!

    Before we go into depth, we''ll write a simple "Hello world!" program that will
    show you how to use JavaScript in an HTML file.


    1. Create an HTML file: Create a new file and name it `index.html`. Add the following
    HTML code:


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initialscale=1.0">

    <title>Hello world</title>

    </head>

    <body>

    <h1>Hello world!</h1>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    2. Create a JavaScript file: Create a new file and name it `script.js`. Add the
    following JavaScript code:

    ```javascript

    alert(''Hello world!'');

    ```


    3. Run your program: Open the `index.html` file in your web browser. You should
    see a pop-up window that says "Hello world!".


    ## Final preparations, then we go!

    Before we dive into the deeper aspects of JavaScript, make sure you have understood
    and set up the following points:


    1. Directory structure: You should have a clear directory structure, e.g. a folder
    for your project with HTML, CSS and JavaScript files.

    2. Code editor: Make sure your code editor (e.g. `VS Code`) is set up correctly
    and that you feel comfortable with it.

    3. Browser developer tools: Familiarize yourself with your browser''s developer
    tools. These will help you to debug and test your code.


    You have now laid the foundations for working with JavaScript. In the next chapter,
    we will look at variables, one of the fundamental concepts of every language.


    # Variables


    ## Variables in JavaScript

    Variables are storage locations in which you can save data that is used by your
    program. They are a fundamental component of every programming language. In JavaScript,
    you can declare variables with the keywords `var`, `let` and `const`.


    ### Example

    ```javascript

    let name = ''Max''; const pi = 3.14; var age = 25;

    ```

    • `let` and `const` were introduced with ES6 and are more modern methods for declaring
    variables.

    • `var` is older and has some differences in scope.


    ## Naming of variables

    Variables must be named according to certain rules:

    • They may only contain letters, numbers, underscores and dollar signs.

    • They must not begin with a number.

    • They must not be reserved words (such as `let`, `const`, `var`, `function`,
    etc.).


    ### Example

    ```javascript

    let myName = ''Sarah''; let _age = 30; let $currency = ''USD'';

    ```


    ## Primitive data types - strings, numbers and booleans

    There are various data types in JavaScript that you can save in variables. The
    most important primitive data types are

    • Strings: Character strings that represent text.

    • Numbers: Numbers, both whole numbers and floating point numbers.

    • Booleans: Truth values that can be either `true` or `false`.


    ### Example

    ```javascript

    let firstName = ''John''; // String let age = 25; // Number

    let isStudent = true; // Boolean

    ```


    ## Changing the values of variables

    Once declared, variables can be changed later in JavaScript (except `const`).


    ### Example

    ```javascript

    let city = ''Berlin'';

    city = ''Hamburg''; // Value of the city variable is changed

    ```


    ## let vs. const

    • `let`: Is used to declare changeable variables.

