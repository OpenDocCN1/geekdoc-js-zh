    let age = 25;\n\nage = 26; // 这是允许的\n\nconst birthYear = 1995;\n\nbirthYear =\
    \ 1996; // 这将导致错误\n```\n\n## 使用 prompt() 获取用户输入\n你可以使用 `prompt()` 函数向用户获取输入。\n\
    \n### 示例\n```javascript\nlet userName = prompt('What is your name?'); console.log('Hello,\
    \ ' + userName + '!');\n```\n\n## 注释\n注释对于记录代码和使其更容易理解非常有用。分为单行注释和多行注释。\n\n###\
    \ 单行注释\n```javascript\n// 这是一个单行注释\n```\n\n### 多行注释\n```javascript\n/*\n这是一个\n\
    多行注释 */\n```\n以上就是 JavaScript 变量的基础知识。在下一章节中，我们将介绍错误，以及当您遇到问题时如何寻找答案和提问。\n\n#\
    \ 深入探讨：错误\n\n## 寻找答案和提问\n错误是编程中不可避免的一部分，特别是在学习新语言时。最重要的是你如何处理它们并学会修复它们。以下是一些在你遇到\
    \ bug 时可以帮助到你的技巧和资源。\n\n### 常见错误类型\n1. 语法错误：当代码不符合语言规则时发生。\n   - 示例：`let x = ;`（缺少值）\n\
    2. 运行时错误：当代码执行但发生问题时。\n   - 示例：访问未定义的变量。\n3. 逻辑错误：当代码执行没有错误但没有得到预 result 结果时。\n\
    \   - 示例：由于运算符错误导致计算错误。\n\n### 故障排除\n1. 阅读错误信息：控制台中的错误信息通常提供关于问题及其发生位置的信息。\n2.\
    \ 逐步检查代码：将你的代码分成小部分并检查每一步。\n3. 使用控制台：使用 `console.log()` 检查值和变量。\n   - 示例：`console.log('The\
    \ value of x is: ', x);`\n\n### 使用在线资源\n有很多在线资源可以帮助你找到问题的答案：\n1. Stack Overflow：程序员最大的社区之一。在这里你可以提问并从经验丰富的开发者那里获得答案。\n\
    2. Mozilla 开发者网络 (MDN)：极佳的 JavaScript 文档和示例资源。\n3. W3Schools：另一个用于教程和参考的实用网站。\n\
    \   - W3Schools JavaScript 教程\n\n### 提问\n在网上提问时，请确保你的表述清晰准确。以下是一些关于如何提问好问题的技巧：\n\
    1. 描述问题：准确解释你想实现什么以及哪些部分不起工作。\n2. 代码示例：插入显示问题的相关代码段。\n3. 错误信息：复制并粘贴你收到的准确错误信息。\n\
    4. 之前的尝试：描述你已经尝试过哪些解决问题的方法。\n\n### 一个好问题的示例\n### 问题：\n我正尝试编写一个简单的 JavaScript 函数来相两个数字，但我收到了一个错误信息。\n\
    \n### 代码：\n```\n\n"
- fmt: "\n```javascript\nfunction addNumbers(a, b) {\n  return a + b;\n}\nlet result\
    \ = addNumbers(5, '10'); console.log(result);\n```\n\n### Error message:\n\nUncaught\
    \ TypeError: Cannot add property 'toString' of undefined\n\n### What I have tried\
    \ so far:\n\nI have tried to convert both arguments to numbers, but the error\
    \ persists.\n\n```yaml\n--\n```\n\nErrors are part of programming and are a valuable\
    \ learning opportunity. In the next chapter, we will look at operators, another\
    \ important concept in JavaScript.\n\n--\n\n# Operators\n\n## Mathematical operators\n\
    \nMathematical operators are used to perform basic arithmetic operations. Here\
    \ are the most important operators:\n\n- `+` (addition): Adds two numbers together.\n\
    - `-` (subtraction): Subtracts one number from another.\n- `*` (multiplication):\
    \ Multiplies two numbers.\n- `/` (division): Divides one number by another.\n\
    - `%` (modulus): Returns the remainder of a division.\n- `**` (exponentiation):\
    \ Raises a number to a power.\n\n### Example\n\n```javascript\nlet a = 10; let\
    \ b = 3;\n\nconsole.log(a + b); // 13\nconsole.log(a - b); // 7\nconsole.log(a\
    \ * b); // 30\nconsole.log(a / b); // 3.3333333333333335 console.log(a % b); //\
    \ 1\nconsole.log(a ** b); // 1000\n```\n\n## Concatenation and multi-line strings\n\
    \nThe concatenation (concatenation) of strings is also carried out with the `+`\
    \ operator.\n\n### Example\n\n```javascript\nlet firstName = 'John';\nlet lastName\
    \ = 'Doe';\nlet fullName = firstName + ' ' + lastName;\n\nconsole.log(fullName);\
    \ // John Doe\n```\n\n### Multiline strings\n\nMulti-line strings can be created\
    \ with backticks (````).\n\n### Example\n\n```javascript\nlet message = `This\
    \ is a multiline\nString `;\n\nconsole.log(message);\n```\n\n## Template strings\
    \ and multi-line template strings\n\nTemplate strings allow you to insert variables\
    \ and expressions into strings by using `${}`.\n\n### Example\n\n```javascript\n\
    let name = 'Alice';\nlet greeting = `Hello, ${name}! console.log(greeting); //\
    \ Hello, Alice!\n```\n\n## Comparison operators for numbers\n\nComparison operators\
    \ are used to compare two values. They return a Boolean value (true or false).\n\
    \n- `==` (equal): Checks for equality.\n- `!=` (unequal): Checks for inequality.\n\
    - `===` (strictly equal): Checks for equality and equality of type.\n- `!==` (strictly\
    \ unequal): Checks for inequality and type inequality.\n- `>` (greater than):\
    \ Checks whether the left-hand value is greater than the right-hand value.\n-\
    \ `<` (less than): Checks whether the left-hand value is smaller than the right-hand\
    \ value.\n- `>=` (greater than or equal to): Checks whether the left-hand value\
    \ is greater than or equal to the right-hand value.\n- `<=` (less than or equal\
    \ to): Checks whether the left-hand value is less than or equal to the right-hand\
    \ value.\n\n### Example\n\n```javascript\nlet x = 5; let y = 10;\n\nconsole.log(x\
    \ == y); // false console.log(x != y); // true console.log(x === y); // false\
    \ console.log(x !== y); // true console.log(x > y); // false console.log(x < y);\
    \ // true console.log(x >= y); // false console.log(x <= y); // true\n```\n\n\
    ## Comparison operators for strings\n\nComparison operators can also be applied\
    \ to strings. The comparisons are based on the lexicographical (alphabetical)\
    \ order.\n\n### Example\n\n```javascript\nlet str1 = 'apple'; let str2 = 'banana';\n\
    \nconsole.log(str1 == str2); // false\nconsole.log(str1 != str2); // true\nconsole.log(str1\
    \ < str2); // true (apple comes before banana) console.log(str1 > str2); // false\n\
    ```\n\n## Type safety in JavaScript\n\nJavaScript is a dynamically typed language,\
    \ which means that the type of a variable is determined at runtime. It is therefore\
    \ important to understand the difference between `==` and `===`.\n\n- `==` only\
    \ checks for equality of values.\n- `===` checks both the equality of the values\
    \ and the types.\n\n### Example\n\n```javascript\nlet num = 5; let str = '5';\n\
    console.log(num == str); // true (only values are compared) console.log(num ===\
    \ str); // false (values and types are compared)\n```\n\n## Logical operators\n\
    \nLogical operators are used to combine Booleans and evaluate logical expressions.\n\
    \n- `&&` (AND): Returns true if both operands are true.\n- `||` (OR): Returns\
    \ true if one of the operands is true.\n- `!` (NOT): Returns the opposite of the\
    \ value.\n\n### Example\n\n```javascript\nlet a = true; let b = false;\n\nconsole.log(a\
    \ && b); // false console.log(a || b); // true console.log(!a); // false console.log(!b);\
    \ // true\n```\n\nThose were the basic operators in JavaScript. In the next chapter,\
    \ we will look at control structures that allow you to create conditional statements\
    \ in your code.\n\n# Control structures I\n\n## if statements\n\nThe `if` statement\
    \ is used to check a condition and only execute code if this condition is true.\n\
    \n### Syntax\n\n```javascript\nif (condition) {\n  // Code that is executed if\
    \ the condition is true\n}\n```\n\n### Example\n\n```javascript\nlet age = 18;\n\
    \nif (age >= 18) {\n  console.log('You are of legal age.');\n}\n```\n\nIn this\
    \ example, the message \"You are of legal age.\" is only displayed if the `age`\
    \ variable is greater than or equal to 18.\n\n## if-else statements\n\nWith an\
    \ `if-else` statement, you can execute code if the condition is true and other\
    \ code if it is false.\n\n### Syntax\n\n```javascript\nif (condition) {\n  //\
    \ Code that is executed if the condition is true\n} else {\n  // Code that is\
    \ executed if the condition is false\n}\n```\n\n### Example\n\n```javascript\n\
    let age = 16;\n\nif (age >= 18) {\n  console.log('You are of legal age.');\n}\
    \ else {\n  console.log('You are underage.');\n}\n```\n\nIn this example, \"You\
    \ are underage.\" is displayed because `age` is less than 18.\n\n## else-if statements\n\
    \nThe `else-if` statement makes it possible to check multiple conditions. If the\
    \ first condition is false, the next condition is checked, and so on.\n\n### Syntax\n\
    \n```javascript\nif (condition1) {\n  // Code that is executed if condition1 is\
    \ true\n} else if (condition2) {\n  // Code that is executed if condition2 is\
    \ true\n} else {\n  // Code that is executed if none of the conditions is true\n\
    }\n```\n\n### Example\n\n```javascript\nlet score = 85;\n\nif (score >= 90) {\n\
    \  console.log('Note: A');\n} else if (score >= 80) {\n  console.log('Note: B');\n\
    } else if (score >= 70) {\n  console.log('Note: C');\n} else {\n  console.log('Note:\
    \ F');\n}\n```\n\nIn this example, \"Note: B\" is displayed because `score` is\
    \ between 80 and 90.\n\n## Nested if statements\n\nYou can nest `if` statements\
    \ within other `if` statements to check complex conditions.\n\n### Example\n\n\
    ```javascript\nlet age = 20;\nlet hasID = true;\n\nif (age >= 18) {\n  if (hasID)\
    \ {\n    console.log('You may enter.');\n  } else {\n    console.log('You need\
    \ an ID.');\n  }\n} else {\n  console.log('You are too young.');\n}\n```\n\nIn\
    \ this example, \"You may enter.\" is displayed because `age` is greater than\
    \ or equal to 18 and `hasID` is true.\n\n# Functions\n\n## Basics of functions\n\
    \nFunctions are reusable blocks of code that perform a specific task. They help\
    \ to keep the code modular and readable. There are various ways to define functions\
    \ in JavaScript.\n\n### Syntax\n\n```javascript\nfunction name(parameters) {\n\
    \  // Code is executed\n}\n```\n\n### Example\n\n```javascript\nfunction greet()\
    \ {\n  console.log('Hello, world!');\n}\ngreet(); // Call the function\n```\n\n\
    ## Functions with parameters\n\nFunctions can have parameters that serve as input\
    \ for the function.\n\n### Syntax\n\n```javascript\nfunction name(parameter1,\
    \ parameter2) {\n  // Code is executed\n}\n```\n\n### Example\n\n```javascript\n\
    function greet(name) {\n  console.log('Hello, ' + name + '!');\n}\ngreet('Max');\
    \ // Output: Hello, Max!\n```\n\n## Functions with default parameters\n\nDefault\
    \ parameters make it possible to define default values for parameters that are\
    \ used if no arguments are passed.\n\n### Syntax\n\n```javascript\nfunction name(parameter1\
    \ = defaultValue1, parameter2 = defaultValue2) {\n  // Code is executed\n}\n```\n\
    \n### Example\n\n```javascript\nfunction greet(name = 'World') {\n  console.log('Hello,\
    \ ' + name + '!');\n}\ngreet(); // Output: Hello, World!\ngreet('Max'); // Output:\
    \ Hello, Max!\n```\n\n## The return statement\n\nA function can return a value\
    \ with the `return` statement.\n\n### Syntax\n\n```javascript\nfunction name(parameters)\
    \ {\n  // Code is executed\n  return value;\n}\n```\n\n### Example\n\n```javascript\n\
    function add(a, b) {\n  return a + b;\n}\nlet sum = add(5, 3);\nconsole.log(sum);\
    \ // Output: 8\n```\n\n## Areas of validity\n\nThe scope of variables determines\
    \ where these variables are accessible. There are two main types of scopes: global\
    \ and local.\n\n### Global scope of validity\n\nVariables that are declared outside\
    \ a function have a global scope and are accessible everywhere in the code.\n\n\
    ### Local area of validity\n\nVariables that are declared within a function have\
    \ a local scope of validity and are only accessible within this function.\n\n\
    ### Example\n\n```javascript\nlet globalVar = 'I am global';\n\nfunction myFunction()\
    \ {\n  let localVar = 'I am local';\n  console.log(globalVar); // Access to global\
    \ variable\n  console.log(localVar); // Access to local variable\n}\nmyFunction();\n\
    console.log(localVar); // Error: localVar is not defined\n```\n\n## Hoisting\n\
    \nHoisting is a behavior in JavaScript in which declarations of variables and\
    \ functions are moved to the beginning of their scope before the code is executed.\n\
    \n### Example\n\n```javascript\nconsole.log(myVar); // undefined\nvar myVar =\
    \ 'Hello';\nconsole.log(myFunc()); // Hello, world!\nfunction myFunc() {\n  return\
    \ 'Hello, world!';\n}\n```\n\n## Function expressions vs. function declarations\
    \ (hoisting)\n\nThere are two ways to define functions: Function declarations\
    \ and function expressions. Function declarations are lifted (hoisted), but function\
    \ expressions are not.\n\n### Function declaration\n\n```javascript\nconsole.log(greet());\
    \ // Hello\n\nfunction greet() {\n  return 'Hello';\n}\n```\n\n### Functional\
    \ expression\n\n```javascript\nconsole.log(greet()); // Error: greet is not defined\n\
    \nlet greet = function() {\n  return 'Hello';\n};\n```\n\n# Objects\n\n## Basics\
    \ of objects\n\nObjects are basic building blocks in JavaScript that make it possible\
    \ to organize related data and functions in a structure. An object consists of\
    \ properties and methods (functions).\n\n### Syntax\n\n```javascript\nlet obj\
    \ = {\n  key1: value1,\n  key2: value2,\n  // Method\n  methodName: function()\
    \ {\n    // Code\n  }\n};\n```\n\n### Example\n\n```javascript\nlet person = {\n\
    \  name: 'Max',\n  age: 30,\n  greet: function() {\n    console.log('Hello, I\
    \ am ' + this.name);\n  }\n};\nperson.greet(); // Output: Hello, I am Max\n```\n\
    \n## Nested objects\n\nObjects can have other objects as properties.\n\n### Example\n\
    \n```javascript\nlet address = {\n  city: 'Berlin',\n  postalCode: '12345'\n};\n\
    \nlet person = {\n  name: 'Max',\n  address: address\n};\nconsole.log(person.address.city);\
    \ // Output: Berlin\n```\n\n## Read and set values (dot notation)\n\nYou can access\
    \ and change the properties of an object with the dot notation.\n\n### Example\n\
    \n```javascript\nlet person = {\n  name: 'Max',\n  age: 30\n};\n\nconsole.log(person.name);\
    \ // Output: Max\nperson.age = 31;\nconsole.log(person.age); // Output: 31\n```\n\
    \n## Read and set values (bracket notation)\n\nAlternatively, you can use square\
    \ bracket notation to access properties.\n\n### Example\n\n```javascript\nlet\
    \ person = {\n  name: 'Max',\n  age: 30\n};\n\nconsole.log(person['name']); //\
    \ Output: Max\nperson['age'] = 31;\nconsole.log(person['age']); // Output: 31\n\
    ```\n\n## Add, change and remove properties\n\nYou can add, change or remove properties\
    \ for an object.\n\n### Example\n\n```javascript\nlet person = {\n  name: 'Max',\n\
    \  age: 30\n};\n\n// Add\nperson.gender = 'male';\nconsole.log(person.gender);\
    \ // Output: male\n\n// Change\nperson.age = 31;\nconsole.log(person.age); //\
    \ Output: 31\n\n// Remove\ndelete person.age;\nconsole.log(person.age); // Output:\
    \ undefined\n```\n\n## Objects in functions\n\nObjects can be passed as arguments\
    \ to functions and returned by functions.\n\n### Example\n\n```javascript\nfunction\
    \ printPerson(person) {\n  console.log('Name: ' + person.name + ', Age: ' + person.age);\n\
    }\n\nlet person = {\n  name: 'Max',\n  age: 30\n};\nprintPerson(person); // Output:\
    \ Name: Max, Age: 30\n```\n\n## Call-by-value vs. call-by-reference\n\nPrimitive\
    \ data types are transferred by value (call-by-value), while objects are transferred\
    \ by reference (call-by-reference).\n\n### Example\n\n```javascript\nlet x = 10;\n\
    let y = x; // Call-by-value\ny = 20;\nconsole.log(x); // Output: 10\n\nlet person1\
    \ = { name: 'Max' };\nlet person2 = person1; // call-by-reference\nperson2.name\
    \ = 'Anna';\nconsole.log(person1.name); // Output: Anna\n```\n\n## Objects as\
    \ return value\n\nFunctions can have objects as return values.\n\n### Example\n\
    \n```javascript\nfunction createPerson(name, age) {\n  return {\n    name: name,\n\
    \    age: age\n  };\n}\nlet person = createPerson('Max', 30);\nconsole.log(person);\
    \ // Output: { name: 'Max', age: 30 }\n```\n\n## Methods\n\nMethods are functions\
    \ that are defined as properties of an object.\n\n### Example\n\n```javascript\n\
    let person = {\n  name: 'Max',\n  age: 30,\n  greet: function() {\n    console.log('Hello,\
    \ I am ' + this.name);\n  }\n};\nperson.greet(); // Output: Hello, I am Max\n\
    ```\n\n## Objects as constants\n\nObjects declared with `const` can still be changed\
    \ as long as the reference is not changed.\n\n### Example\n\n```javascript\nconst\
    \ person = {\n  name: 'Max',\n  age: 30\n};\nperson.age = 31; // This is allowed\n\
    console.log(person.age); // Output: 31\n// person = { name: 'Anna' }; // This\
    \ causes an error\n```\n\n## Compare objects\n\nObjects are compared by reference,\
    \ not by value.\n\n### Example\n\n```javascript\nlet person1 = { name: 'Max' };\n\
    let person2 = { name: 'Max' };\nconsole.log(person1 === person2); // Output: false\n\
    let person3 = person1;\nconsole.log(person1 === person3); // Output: true\n```\n\
    \n# Control structures II\n\n## switch statements: Basics\n\nThe `switch` statement\
    \ is another control structure that is used to check multiple conditions. It is\
    \ a good alternative to long chains of `if-else` statements.\n\n### Syntax\n\n\
    ```javascript\nswitch (expression) {\n  case value1:\n    // Code that is executed\
    \ when expression equals value1\n    break;\n  case value2:\n    // Code that\
    \ is executed when expression equals value2\n    break;\n  // Further case statements\n\
    \  default:\n    // Code that is executed if no case applies\n}\n```\n\n### Example\n\
    \n```javascript\nlet fruit = 'Banana';\n\nswitch (fruit) {\n  case 'Apple':\n\
    \    console.log('It's an apple.');\n    break;\n  case 'Banana':\n    console.log('It's\
