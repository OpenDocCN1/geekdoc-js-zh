    # Cookies and data storage


    ## Cookies


    Cookies are small text files that are stored by a website on the user''s computer.
    They are used to store user data between visits.


    ### Set cookies


    You can set cookies with document.cookie.


    ### Example


    document.cookie = "username=JohnDoe; expires=Fri, 31 Dec 2024 23:59:59 GMT; path=/";

    In this example, a cookie with the name username and the value JohnDoe is set,
    which expires on December 31, 2024 and is available on the entire website.


    ## Cookies: Defining the shelf life of cookies


    Theexpires property determines when the cookie expires.


    ### Example


    document.cookie = "username=JohnDoe; expires=Fri, 31 Dec 2024 23:59:59 GMT; path=/";


    ### Max-Age


    Alternatively, you can usemax-age to set the lifetime of a cookie in seconds.


    ### Example


    document.cookie = "username=JohnDoe; max-age=3600; path=/"; // Cookie expires
    after 1 hour


    ## Overwrite and delete cookies


    A cookie can be overwritten with a new value by setting the same name. To delete
    a cookie, set the expiration date in the past.


    ### Example


    // Overwrite a cookie

    document.cookie = "username=JaneDoe; path=/";


    // Delete a cookie

    document.cookie = "username=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/";


    ## Check and read cookies


    With document.cookie you can access all cookies as a string.


    ### Example


    console.log(document.cookie); // username=JaneDoe


    ### Read cookies


    To get the value of a specific cookie, you can write a function that searches
    the cookies.


    ### Example


    function getCookie(name) {

    let matches = document.cookie.match(new RegExp(


    "(?:^|; )" + name.replace(/([.$?*|{}()[]\\\/+^])/g, ''\\$1'') + "=([^;]*)"

    ));

    return matches ? decodeURIComponent(matches[1]) : undefined;


    }

    console.log(getCookie(''username'')); // JaneDoe


    ## The JSON.stringify() andJSON.parse() methods


    These methods are used to convert JavaScript objects into JSON strings and vice
    versa.

    JSON.stringify()

    Converts a JavaScript object into a JSON string.


    ### Example


    let user = { name: "John", age: 30


    };

    let jsonString = JSON.stringify(user);

    console.log(jsonString); // {"name": "John", "age":30} JSON.parse() Converts a
    JSON string into a JavaScript object.


    ### Example


    let jsonString = ''{"name": "John", "age":30}''; let user = JSON.parse(jsonString);

    console.log(user.name); // John console.log(user.age); // 30


    ## Local storage and session storage


    Local Storage and Session Storage are web storage APIs that make it possible to
    store data in the browser.


    ### Local Storage


    Local Storage stores data without an expiration date.


    ### Example


    // Save

    localStorage.setItem(''username'', ''JohnDoe'');


    // Read out

    let username = localStorage.getItem(''username''); console.log(username); // JohnDoe


    // Delete

    localStorage.removeItem(''username'');

    // Delete all entries localStorage.clear();


    ### Session Storage


    Session Storage stores data for the duration of the session. The data is deleted
    when the browser window is closed.


    ### Example


    // Save

    sessionStorage.setItem(''username'', ''JohnDoe'');


    // Read out

    let username = sessionStorage.getItem(''username''); console.log(username); //
    JohnDoe


    // Delete

    sessionStorage.removeItem(''username'');

    // Delete all entries sessionStorage.clear();

    That was an introduction to cookies and data storage in JavaScript. In the next
    chapter, we will look at modules and learn how to use them to better organize
    your code.


    # Modules


    ## Introduction to the topic of modules


    JavaScript modules allow code to be broken down into smaller, reusable and more
    maintainable parts. ES6 introduced the official module system in JavaScript, which
    makes it possible to export functions, objects or values from one module and import
    them into other modules.


    ## Integrate modules in HTML


    To use JavaScript modules in HTML, the <script> tag must be provided with the
    attribute type="module".


    ### Example


    html


    <!DOCTYPE html>

    <html lang="en">

    <head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Module
    example</title>


    </head>

    <body>


    <script type="module" src="main.js"></script>

    </body>

    </html>


    ## Export features


    You can export functions, objects or values with theexport keyword.


    ### Individual export


    // utils.js

    export function add(a, b) { return a + b;

    }


    ### Several exports


    // utils.js

    export const PI = 3.14159; export function subtract(a, b) {


    return a - b;

    }


    ## Import features


    Use the import keyword to use exported functions, objects or values in another
    module.


    ### Example


    // main.js

    import { add, subtract, PI } from ''./utils.js'';


    console.log(add(2, 3)); // 5 console.log(subtract(5, 2)); // 3 console.log(PI);
    // 3.14159


    ## Designated exports and imports


    Named exports make it possible to export several values from one module and import
    them with the same names in other modules.


    ### Example


    // math.js

    export const PI = 3.14159; export function multiply(a, b) {


    return a * b;

    }

    javascript


    // main.js

    import { PI, multiply } from ''./math.js'';

    console.log(PI); // 3.14159 console.log(multiply(2, 3)); // 6


    ## Default exports


    A module can export a default value that is marked with thedefault keyword. There
    can only be one default export per module.


    ### Example


    // logger.js

    export default function log(message) { console.log(message);

    }

    javascript

    // main.js

    import log from ''./logger.js''; log(''This is a message.''); // This is a message.


    ## Module objects


    You can import all exports of a module as an object.


    ### Example


    // math.js

    export const PI = 3.14159; export function add(a, b) {


    return a + b;

    }

    export function subtract(a, b) {


    return a - b;

    }

    javascript


    // main.js

    import * as math from ''./math.js'';


    console.log(math.PI); // 3.14159 console.log(math.add(2, 3)); // 5 console.log(math.subtract(5,
    2)); // 3


    ## Aggregate modules


    You can aggregate several modules into a single module and export them again.


    ### Example


    // geometry.js

    export * from ''./circle.js''; export * from ''./rectangle.js''; javascript


    // circle.js

    export const PI = 3.14159;

    export function area(radius) {


    return PI * radius * radius;

    }

    // rectangle.js

    export function area(width, height) {


    return width * height;

    }

    // main.js

    import { PI, area as circleArea } from ''./geometry.js''; import { area as rectangleArea
    } from ''./geometry.js'';


    console.log(PI); // 3.14159

    console.log(circleArea(3)); // 28.27431 console.log(rectangleArea(4, 5)); // 20


    ## Dynamic loading of modules


    You can use theimport() function to load modules dynamically. This is useful if
    you only want to load modules when required.


    ### Example


    // main.js

    import(''./utils.js'').then(module => {

    console.log(module.add(2, 3)); // 5

    });

    That was the introduction to JavaScript modules. In the next chapter, we''ll finish
    the book and congratulate you on completing it!


    # Congratulations, you''ve made it!


    ## Review of what we have learned


    You have now been given a comprehensive overview of JavaScript and its many possibilities.
    Here is a brief summary of what you have learned in this book:


    1\. Introduction to JavaScript: Basic concepts and history.

    2\. Preparation: Installation and setup of the development environment.

    3\. The basics of JavaScript: First steps and syntax.

    4\. Variables: Dealing with variables and data types.

    5\. Operators: Mathematical and logical operators.

    6\. Control structures: Conditional statements and loops.

    7\. Functions: Definition and use of functions.

    8\. Objects: Create and manipulate objects.

    9\. Arrays: Working with arrays and their methods.

    10. Time, date, intervals and timeouts: Handling date and time functions.

    11. Working with strings and numbers: methods for string and number manipulation.

    12. DOM I: Basics of the Document Object Model.

    13. DOM II: Event handling and advanced DOM manipulations.

    14. Expert knowledge: Advanced JavaScript techniques such as arrow functions and
    modules.

    15. Classes: Object-oriented programming in JavaScript.

    16. Installing a local web server: Setting up a local development server.

    17. Cookies and data storage: Handling cookies and web storage.

    18. Modules: Use and management of JavaScript modules.


    ## Your next step


    Learning JavaScript is an ongoing journey. Here are some tips and resources to
    further deepen your knowledge:


    ### Online resources


    • Mozilla Developer Network (MDN): MDN Web Docs offers comprehensive and upto-date
    documentation on JavaScript.

    • W3Schools: JavaScript Tutorial offers easy-to-understand tutorials and examples.

    • JavaScript.info: The Modern JavaScript Tutorial is a detailed resource for modern
    JavaScript practices.


    ### Online courses


    • Codecademy: Learn JavaScript

    • Udemy: The ultimate JavaScript complete course by Ruben Winkler

    • freeCodeCamp: JavaScript Algorithms and Data Structures


    ### Books


    • Eloquent JavaScript by Marijn Haverbeke

    • You Don''t Know JS (book series) by Kyle Simpson

    • JavaScript: The Good Parts by Douglas Crockford


    ## Practical projects


    To consolidate your knowledge, it is important to develop your own projects. Here
    are some ideas:


    • To-do list: A simple application to manage tasks.

    • Calculator: A basic calculator for mathematical operations.

    • Weather app: An application that retrieves and displays weather data from an
    API.

    • Quiz game: An interactive game in which the user answers questions.


    ## Community and support


    • Stack Overflow: A large community to ask questions and find answers.

    • GitHub: Host and share your projects to get feedback and participate in open
    source projects.

    • Meetups: Search for local or virtual meetings of JavaScript developers to share
    experiences and learn.


    ## Further topics


    Once you feel comfortable with the basics, you can delve deeper into specialized
    topics:

    • Frameworks and libraries: Learn popular JavaScript frameworks such as React,


    Angular or Vue.js.

    • Backend development: Explore server-side JavaScript with Node.js.

    • TypeScript: A superset of JavaScript that adds static typing and facilitates
    the


    development of large applications.


    Congratulations on your progress! JavaScript is a powerful and versatile language,
    and you have now mastered the basics and some advanced concepts. Stay curious
    and keep experimenting - the possibilities are endless!

