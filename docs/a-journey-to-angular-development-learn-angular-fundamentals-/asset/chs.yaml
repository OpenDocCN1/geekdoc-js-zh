  2. `   border: 1px solid red;`\n3. `}`\n\n**步骤 40：为控件附加验证**\n\n按如下方式修改模板中的内容：\n\n\
  1. `……`\n2. `<div [hidden]=”!IsAddNew”>`\n3. `   <h1>添加新客户</h1>`\n4. `   名字：<input\
  \ type=”text” name=”FName”`\n5. `   [(ngModel)]=”this.FirstName” required minlength=”3”><br>`\n\
  6. `   姓氏：<input type=”text” name=”LName”`\n7. `   [(ngModel)]=”this.LastName” required\
  \ minlength=”3”><br><br>`\n8. `   <input type=”button” value=”保存” (click)=”Save()”>\
  \ &nbsp;`\n9. `   <input type=”button” value=”取消” (click)=”Cancel()” >`\n10. `</div>`\n\
  11. `……`\n\n根据上述代码，两个文本框都不接受空值，并且值必须至少包含 3 个字符。\n\n**步骤 41：检查输出。**\n\n我们还没有完全完成验证。因此，暂时不要点击\
  \ `保存` 按钮。\n\n相反，只需检查格式，并尝试以下操作：\n\n1. 确保开始时没有显示边框，因为控件尚未被触摸。\n2. 将光标放入任意文本框然后移出焦点。由于控件尚未变脏，不应显示边框。\n\
  3. 将光标放入任意文本框，输入超过三个字符的值，然后移出焦点。由于控件有效，不应显示边框。\n4. 将光标放入任意文本框，输入少于三个字符的值或留空，然后移出焦点。由于控件已被触摸、变脏且验证失败，应显示边框。\n\
  \n## 讨论 – 继续\n\n现在我们已经完成了验证控件的格式化，接下来该显示错误消息了。\n\n为此，我们可以使用 `ngModel` 指令暴露的属性。\n\
  \n如你所知，`ngModel` 是一个指令，从概念上讲它是一个 `TypeScript` *类*。\n\n每次我们将指令附加到元素上时，都会创建该指令的一个实例，并与该元素关联。我们可以使用“模板引用变量”在模板中获取该实例的引用。\n\
  \n例如，请看以下代码：\n\n![](img/Image48553.jpg)\n\n**图 9.25**\n\n`ngModel` 类实例将为我们提供以下七个表示控件状态的属性：\n\
  \n1. `touched` – 如果控件被触摸则为 true，否则为 false。\n\n\n\n\n\n2.  `untouched` – 如果控件尚未被触碰，则为\
  \ true，否则为 false。\n\n3.  `pristine` – 如果控件的值尚未更改，则为 true，否则为 false。\n\n4.  `dirty`\
  \ – 如果控件的值从未更改过，则为 true，否则为 false。\n\n5.  `valid` – 如果控件的值有效，则为 true，否则为 false。\n\
  \n6.  `invalid` – 如果控件的值无效，则为 true，否则为 false。\n\n7.  `error` – 如果控件的值有效，则为 null。当控件值无效时，它将是一个包含\
  \ `required`、`minlength`、`pattern` 等属性的对象——每个属性都是一个布尔值，指示哪个验证失败。\n\n让我们进行演示并理解它。\n\
  \n## 实验 – 续\n\n### 步骤 42：附加验证消息\n\n将错误消息添加到两个控件中，如下所示：\n\n```\n1.  <div [hidden]=”!IsAddNew”>\n\
  2.     <h1>添加新客户</h1>\n3.     名字：\n4.     <input type=”text” name=”FName”\n5.    \
  \ [(ngModel)]=”this.FirstName” required minlength=”3”>\n6.     <span>请输入名字</span>\n\
  7.     <span>名字至少需要 3 个字符</span>\n8.     <br>\n9.     姓氏：\n10.     <input type=”text”\
  \ name=”LName”\n11.     [(ngModel)]=”this.LastName” required minlength=”3”>\n12.\
  \     <span>请输入姓氏</span>\n13.     <span>姓氏至少需要 3 个字符</span>\n14.     <br><br>\n\
  15.     <input type=”button” value=”保存” (click)=”Save()”> &nbsp;\n16.     <input\
  \ type=”button” value=”取消” (click)=”Cancel()” >\n17.  </div>\n```\n\n### 步骤 43：使用\
  \ ngModel 实例控制错误消息\n\n如前所述，在模板引用变量中获取 `ngModel` 指令的实例，并控制错误消息的可见性。\n\n```\n1.  ……\n\
  2.     <input type=”text” name=”FName”\n3.     [(ngModel)]=”this.FirstName” required\
  \ minlength=”3” #F=”ngModel”>\n4.     <span [hidden]=”!(F.dirty && F.errors?.required)”>请输入名字</span>\n\
  5.     <span [hidden]=”!(F.dirty && F.errors?.minlength)”>名字至少需要 3 个字符</span>\n\
  6.  ……\n```\n\n`LastName` 的错误消息将作为你的作业。请确保你尝试并完成它。\n\n现在，如果你对 `hidden` 的赋值感到困惑，请阅读接下来的讨论。否则，直接跳到下一步。\n\
  \n## 讨论 – 续\n\n我们来谈谈上述代码中赋给 `hidden` 属性的值：\n\n1.  如果赋值的表达式结果为 *true*，它将隐藏元素。因此，我们需要最终结果为\
  \ *false* 才能看到错误消息。\n\n2.  由于整个表达式被取反，我们希望括号内表达式的结果为 *true* 才能看到错误消息。\n\n3.  如果控件值从未更改，括号表达式的结果为\
  \ *false*。简而言之，控件不是 dirty 状态。要看到错误消息，它必须是 dirty 状态。\n\n4.  如果值有效，括号表达式的结果为 *false*。如果值无效，`error`\
  \ 将返回一个对象，其中 `required` 为 *true* 或 `minlength` 为 *true*。\n\n## 实验 – 续\n\n## 步骤 44：检查输出\n\
  \n保存点击验证尚未完成。所以，不要跳到那里。\n\n相反，只需检查错误消息，为此，请尝试以下操作：\n\n1.  确保错误消息在开始时不可见，因为控件不是 dirty\
  \ 状态。\n\n2.  将光标放在任意文本框中并移出焦点。错误消息应保持不可见，因为控件尚未变为 dirty。\n\n3.  将光标放在任意文本框中并输入一些值。现在它是\
  \ dirty 状态。如果任何验证失败，它应该开始显示错误消息。\n\n## 讨论 – 续\n\n接下来，我们必须控制 `Save` 按钮。\n\n为此，我们将使用\
  \ `ngForm` 指令。\n\n我们将 `ngModel` 附加到各个控件，而 `ngForm` 将附加到整个容器。\n\n可以使用 *模板引用变量* 获取其引用，它将暴露与\
  \ `ngModel` 类似的属性，但它代表整个容器的状态。\n\n例如，一旦任何控件变为 dirty，容器就会变为 dirty。\n\n类似地，只有当所有控件都有效时，容器才有效。\n\
  \n### 步骤 45：控制按钮\n\n将 `ngForm` 指令附加到我们的顶层 div 元素，该元素封装了整个数据录入界面。\n\n接下来，使用模板引用变量获取该指令的引用。\n\
  \n最后，使用 `ngForm` 属性控制 `Save` 按钮，如下所示：\n\n```\n1.  <div [hidden]=”!IsAddNew” ngForm\
  \ #myForm=”ngForm”>\n2.     ………\n3.     <input type=”button” value=”保存” (click)=”Save()”\
  \ [disabled]=”myForm.invalid”>   &nbsp;\n4.     <input type=”button” value=”取消”\
  \ (click)=”Cancel()” >\n5.  </div>\n```\n\n在上述代码中，你可以清楚地看到我们首先附加了 `ngForm` 指令，然后在\
  \ `myForm` 变量中获取了它的引用，最后如果任何内容无效，则禁用 `Save` 按钮。\n\n## 步骤 46：检查输出\n\n运行应用程序，你会注意到一个小问题。你还会在验证错误时看到\
  \ div 周围出现红色边框。\n\n### 步骤 47：移除表单的红色边框\n\n就像 `ngModel` 一样，`ngForm` 也会根据条件动态附加这六个\
  \ CSS 类。因此，红色边框是完全预期的。\n\n将 `style.css` 更改为以下内容：\n\n```\n1.  .ng-invalid.ng-touched.ng-dirty:not([ngForm]){\n\
  2.     border: 1px solid red;\n3.  }\n```\n\n## 步骤 48：检查输出\n\n现在你将能够看到预期的输出。你会注意到当任何控件包含无效值时，`Save`\
  \ 按钮会被禁用。\n\n我用于错误消息的 CSS 组合仅用于演示目的。我强烈建议你尝试不同的组合并正确理解它。\n\n## 讨论 – 续\n\n我相信你们都在认真且专注地跟随并实践每一步。在这种情况下，你一定注意到了我们到目前为止创建的系统中的一个小问题。\n\
  \n*数据录入表单在保存和取消后没有重置状态。*\n\n请按照以下步骤操作：\n\n*   打开应用程序并点击 `AddNew`。\n*   输入一些无效值。你会看到文本框周围出现红色边框以及相应的错误消息。\n\
  *   现在点击 `Cancel`。\n*   再次点击 `AddNew`，你仍然会看到那些红色边框和错误消息。\n\n![](img/Image48566.jpg)\n\
  \n**图 9.26**\n\n可以通过使用 `ngForm` 类中的 `reset` 函数来解决这个问题。\n\n因此，我们需要在组件类中获取 `ngForm`\
  \ 的实例来调用其 `reset` 方法。\n\n为了在组件类内部获取 `ngForm` 实例，我们可以使用 `ViewChild` 装饰器。\n\n让我们看看演示。\n\
  \n## 实验 – 续\n\n### 步骤 49：重置整个表单状态\n\n获取附加到 `form` 标签的 `ngForm` 指令的访问权限，并重新定义 `Reset`\
  \ 函数，如下所示：\n\n```\n1.  import {Component, ViewChild} from ‘@angular/core’;\n2. \
  \ ……\n3.    LastName: string;\n4.     @ViewChild(‘myForm’) CustomerForm: NgForm;\n\
  5.     constructor() {\n6.       this.IsAddNew = false;\n7.  ……\n8.     Reset()\
  \ {\n9.   *// this.FirstName = ‘’;\n10.  *// this.LastName = ‘’;\n11.       this.CustomerForm.reset();\n\
  12.    }\n13.     Save() {\n14.  ……\n15.  ……\n```\n\n### 步骤 50：检查输出\n\n现在你将看到一切正常工作。\n\
  \n#### 总结\n\n我们已经到达第 6 站。\n\n前往第 6 站的旅程非常漫长。我们涵盖了很多内容，但并不是非常深入。\n\n让我们回顾一下本章学到的所有主题：\n\
  \n*   创建和使用 Angular 组件\n*   Angular 插值\n*   指令和 `ngFor` 指令简介\n*   输入属性和属性绑定简介\n\n\
  \n\n\n*   属性绑定与插值的区别\n*   输出属性与事件绑定简介\n*   单向绑定\n*   双向绑定\n*   模板驱动表单简介\n*   验证简介\n\
  *   模板引用变量\n*   ViewChild 简介\n\n## 第 10 章\n\n## 使用 Bootstrap CSS 美化 Angular 界面\n\
  \n#### 简介\n\n在前往站点 7 的下一段旅程中，我们将基于之前的实验进行增强，使其更上一层楼。\n\n如果你还没有这个项目，可以从 GitHub 仓库下载。\n\
  \n（你可以在引言章节找到 GitHub 仓库的链接。）\n\n这是一个简单的 10 步实验，它将基于之前的实验，并使用 Bootstrap 进行美化。\n\n\
  请注意，本实验的目的并非学习 Bootstrap（一种业界流行的 CSS 框架）。本章旨在学习如何在 Angular 应用中引入第三方库。我们还将学习如何在 Angular\
  \ 中使用 `ngClass` 指令。\n\n### 实验 2：Bootstrap 实战\n\n#### 第 1 步：创建项目副本\n\n最好创建上一个项目的副本，而不是直接修改它，然后将项目从\
  \ `lab1-ng` 重命名为 `lab2-ng`。这需要两步：\n\n1.  打开 `package.json` 和 `package.lock.json`。这两个文件都包含一个\
  \ `name` 属性，将其设置为 `lab2-ng`。\n\n2.  现在在 `angular.json` 文件中搜索 `lab1-ng`，并将所有出现的地方替换为\
  \ `lab2-ng`。\n\n#### 第 2 步：安装 Bootstrap\n\n接下来，使用 `npm install bootstrap --save`\
  \ 命令安装 Bootstrap CSS。\n\n请确保在 `npm install` 命令中使用 `--save` 标志。否则 `package.json`\
  \ 中的 `dependencies` 部分不会更新。另外，注意 `npm` 命令和库名都是区分大小写的。\n\n#### 第 3 步：将 Bootstrap\
  \ 引入项目\n\n打开 `angular.json` 文件，在 `styles` 部分引入 `bootstrap.min.css`，如下所示。\n\n![](img/Image48642.jpg)\n\
  \n**图 10.1**\n\n#### 第 4 步：运行项目\n\n使用 `ng serve --open` 命令运行项目。你会在第一次执行时就注意到 Bootstrap\
  \ 的效果。你会看到文本字体和表格边框发生了变化。\n\n![](img/Image48650.jpg)\n\n**图 10.2**\n\n#### 第 5 步：移除多余的标题\n\
  \n从 `app.component.html` 中移除“Simple Angular example”标题。\n\n#### 第 6 步：重新设计客户列表\n\
  \n让我们为 `customer-list` 部分应用一些 Bootstrap 类，如下所示：\n\n```\n<div class=\"container-fluid\
  \ pt-3\">\n  <div class=\"card\" [hidden]=\"IsAddNew\">\n    <h5 class=\"card-header\"\
  >Customer List</h5>\n    <div class=\"card-body\">\n      <div class=\"card-title\"\
  >\n        <i class=\"fas fa-user-plus\"></i>\n        <input type=\"button\" value=\"\
  + Add New\" class=\"btn btn-primary fas fa-coffee fa-xs\" (click)=\"AddNew()\">\n\
  \      </div>\n      <table class=\"table table-striped table-bordered\">\n    \
  \    <thead class=\"thead-dark\">\n          <tr>\n            <th scope=\"col\"\
  >First Name</th>\n            <th scope=\"col\">Last Name</th>\n          </tr>\n\
  \        </thead>\n        <tbody>\n          <tr *ngFor=\"let item of Customers\"\
  >\n            <td scope=\"row\">{{item.FName}}</td>\n            <td>{{item.LName}}</td>\n\
  \          </tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n  <!--\
  \ Data entry form will be added here -->\n</div>\n```\n\n不必过于担心上一步中使用的 CSS 类。本章的目标不是学习\
  \ Bootstrap，而是学习如何使用第三方库。\n\n#### 第 7 步：重新设计数据录入界面\n\n现在，轮到数据录入界面了。\n\n```\n<!--\
  \ Table was added in the previous step here -->\n<div class=\"card\" [hidden]=\"\
  !IsAddNew\" ngForm #myForm=\"ngForm\">\n  <h5 class=\"card-header\">Add New Customer</h5>\n\
  \  <div class=\"card-body\">\n    <div class=\"form-group\">\n      <label for=\"\
  FName\">First Name: </label>\n      <input class=\"form-control\" type=\"text\"\
  \ name=\"FName\"\n        [(ngModel)]=\"this.FirstName\" required minlength=\"3\"\
  \ #F=\"ngModel\">\n      <!-- error -->\n      <div class=\"alert alert-danger\"\
  \ [hidden]=\"!(F.dirty && F.errors?.required)\">\n        Enter First Name\n   \
  \   </div>\n      <div class=\"alert alert-danger\" [hidden]=\"!(F.dirty && F.errors?.minlength)\"\
  >\n        Minimum 3 characters needed for First Name\n      </div>\n    </div>\n\
  \    <div class=\"form-group\">\n      <label for=\"LName\">Last Name:</label>\n\
  \      <input class=\"form-control\" type=\"text\" name=\"LName\"\n        [(ngModel)]=\"\
  this.LastName\" required minlength=\"3\" #L=\"ngModel\">\n      <!-- error -->\n\
  \      <div class=\"alert alert-danger\" [hidden]=\"!(L.dirty && L.errors?.required)\"\
  >\n        Enter Last Name\n      </div>\n      <div class=\"alert alert-danger\"\
  \ [hidden]=\"!(L.dirty && L.errors?.minlength)\">\n        Minimum 3 characters\
  \ needed for Last Name\n      </div>\n    </div>\n    <input type=\"button\" class=\"\
  btn btn-success\" value=\"Save\" (click)=\"Save()\" [disabled]=\"myForm.invalid\"\
  > &nbsp;\n    <input type=\"button\" class=\"btn btn-danger\" value=\"Cancel\" (click)=\"\
  Cancel()\">\n  </div>\n</div>\n```\n\n#### 第 8 步：检查输出\n\n让我们看看现在的效果。\n\n![](img/Image48725.jpg)\n\
  \n**图 10.3**\n\n![](img/Image48827.jpg)\n\n**图 10.4**\n\n很漂亮，不是吗？我们还可以让它更好。\n\n\
  ## 讨论\n\nBootstrap 提供了两个有用的类来处理验证：`is-valid` 和 `is-invalid`。\n\n我们可以使用 Angular 中的属性指令\
  \ `ngClass` 动态地应用这些类。\n\n## 实验 – 继续\n\n#### 第 9 步：附加 Bootstrap CSS 验证消息\n\n首先，移除\
  \ `style.css` 中当前定义的所有 CSS。\n\n然后，为两个文本框添加 `ngClass` 指令，如下所示：\n\n```\n<input class=\"\
  form-control\"\n       [ngClass]=\"{'is-valid':F.valid,'is-invalid':F.invalid}\"\
  \ type=\"text\" name=\"FName\"\n       [(ngModel)]=\"this.FirstName\" required minlength=\"\
  3\" #F=\"ngModel\">\n<!-- 对 Last Name 做同样的操作 -->\n```\n\n## 第 10 步：检查输出\n\n重新检查输出：\n\
  \n![](img/Image48834.jpg)\n\n**图 10.5**\n\n![](img/Image48843.jpg)\n\n**图 10.6**\n\
  \n#### 总结\n\n我们已经到达站点 7。在这段旅程中，我们学习了如何在 Angular 中引入第三方库以及如何美化界面。在进入下一章之前，请多加练习。\n\
  \n我们下一章见。\n\n我们有一个关于 Angular 样式的独立章节，将在其中详细讨论 Angular 中的样式问题。\n\n## 第 11 章\n\n##\
  \ 身份验证\n\n#### 简介\n\n在第 4 部分的上一章中，我们踏上了前往站点 8 的旅程。\n\n在本实验中，我们将为上一个实验中创建的项目添加身份验证功能。\n\
  \n完成本实验后，只有经过身份验证的用户才能访问 `CustomerComponent`。\n\n以下是本实验结束时我们将得到的效果预览。\n\n![](img/Image48910.jpg)\n\
  \n**图 11.1**\n\n### 实验 3 – Angular 身份验证\n\n#### 第 1 步：创建项目副本\n\n创建上一个项目的备份，并将其重命名为\
  \ `lab3-ng`。\n\n#### 第 2 步：创建登录组件\n\n在 `app` 文件夹内创建一个新的 `Login` 文件夹，并创建一个新的 Angular\
  \ 组件 `Login`，如下所示：\n\n```\nlogin.component.ts\nimport {Component} from '@angular/core';\n\
  @Component({\n   selector: 'login',\n   templateUrl: './login.component.html'\n\
  })\n```\n\n\n\n\n\n```\nexport class LoginComponent {\n\n}\n```\n\n```\n<!-- login.component.html\
  \ -->\n<div class=\"container-fluid pt-3\">\n   <div class=\"card\">\n     <h5 class=\"\
  card-header\">Login</h5>\n     <div class=\"card-body\">\n       <div class=\"form-group\"\
  >\n         <label for=\"UserName\">User Name: </label>\n         <input class=\"\
  form-control\" type=\"text\" name=\"UserName\">\n       </div>\n       <div class=\"\
  form-group\">\n         <label for=\"Password\">Password:</label>\n         <input\
  \ class=\"form-control\" type=\"text\" name=\"Password\">\n       </div>\n     \
  \  <input type=\"button\" class=\"btn btn-success\" value=\"Login\">\n     </div>\n\
  \   </div>\n</div>\n```\n\n### 第 3 步：将组件添加到模块\n\n我想我不需要重复，“每个 Angular 组件都属于一个 Angular\
  \ 模块。”\n\n让我们将 `LoginComponent` 添加到 `AppModule` 中。\n\n```\n……\nimport {CustomerComponent}\
  \ from './Customer/customer.component';\nimport {LoginComponent} from './Login/login.component';\n\
  @NgModule({\n   declarations: [AppComponent, CustomerComponent,LoginComponent],\n\
  \   imports: [BrowserModule, FormsModule],\n……\n```\n\n### 第 4 步：显示登录组件\n\n现在，打开\
  \ `app.component.html` 并将 `CustomerComponent` 替换为 `LoginComponent`。\n\n```\n<!--\
