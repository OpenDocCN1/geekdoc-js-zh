  \n## 讨论 – 续\n\n现在有一个困惑。\n\n**同样的 `IsAddNew$` 理论难道不也适用于 `Customers$` 吗？**\n\n`Customers$`\
  \ 是 `CustomerService` 中的一个变量，指向一个由 `CustomerComponent` 订阅的 observable 对象。当点击 `Save`\
  \ 按钮时，会创建一个新的 observable 对象并赋值给 `Customers$` 变量。\n\n\n\n\n简而言之，`CustomerComponent`\
  \ 订阅的可观察对象与保存后 `Customers$` 指向的可观察对象是不同的。简单来说，它应该表现出与我们之前遇到的 `IsAddNew$` 问题相同的问题。\n\
  \n令人困惑的是，它并不会表现出任何问题。`save` 将毫无问题地工作。\n\n![](img/Image51711.jpg)\n\n**图 15.15**\n\
  \n让我们进一步深入探讨。\n\n我们先从 `IsAddNew$` 开始，了解在引入 `Subject` 或 `BehaviorSubject` 解决方案之前发生了什么：\n\
  \n1.  如前所述，`IsAddNew$` 变量指向两组可观察对象，一组在开始时，另一组在“添加新”操作之后。\n\n2.  这两组可观察对象都发出了 `Boolean`\
  \ 值。\n\n3.  `CustomerComponent` 订阅了第一个可观察对象，因此它只会获取第一个 `observable` 发出的值，而不会获取第二个的值。\n\
  \n请查看下图中的完整流程：\n\n![](img/Image51768.jpg)\n\n**图 15.16**\n\n`Customers$` 的情况则略有不同。（请查看上图。）\n\
  \n1.  在 `CustomerService` 中，定义了一个类型为 `Array of Customer` 的类级变量。\n\n2.  我们还在 `CustomerService`\
  \ 中有一个名为 `Customers$` 的 `Observable`，它将发出上述类级变量。\n\n3.  `CustomerComponent` 订阅了前面提到的\
  \ `Customers$`，因此它将获取 `CustomerService` 中定义的 `Array of Customer` 的*引用*。\n\n    请注意，`CustomerComponent`\
  \ 获取的是引用，而不是值，因为 `Array` 是引用类型。\n\n4.  在 `CustomerService` 的 `Save` 方法中，我们向 `Array\
  \ of Customer` 添加了一个新的 `Customer` 元素。（不要忘记，`CustomerComponent` 和 `CustomerService`\
  \ 都持有这个 `Array` 的引用。）\n\n5.  然后，用一个新的可观察对象重新初始化 `Customers$` 变量。所以现在有两个可观察对象，而 `CustomerComponent`\
  \ 订阅的是旧的那个，而不是新的。（在 `IsAddNew$` 的情况下，我们也遇到了类似的情况——希望你能回想起来。我们实施的解决方案是使用 `Subject`，让同一个可观察对象发出新值。）\n\
  \n6.  但你知道吗，前面一点（第 5 点）其实无关紧要。无论我们是重新初始化它，还是使用 `Subject` 让旧的可观察对象发出更新后的数组，都没有关系。\n\
  \n    原因是，对于 `IsAddNew$`，我们有一个布尔值，它是值类型；而这次是一个 `Array`，它是引用类型，并且 `CustomerComponent`\
  \ 和 `CustomerService` 共享这个引用（参见第 3 点）。因此，如果任何 `Array` 发生变化，`CustomerComponent` 都能看到这个变化。\n\
  \n![](img/Image51845.jpg)\n\n**图 15.17**\n\n这就是为什么一切都能按预期工作，而无需使用 `Subject` 的原因。\n\
  \n#### 总结\n\n在本章中，我们学习了以下内容：\n\n*   我们学习了如何使用 `RxJS of` 操作符创建自定义可观察对象。\n\n*   我们再次演示了如何配置元素注入器。\n\
  \n*   我们复习了 Angular 中的 `RxJSSubject`。\n\n*   我们学习了 Angular 中的 `RxJSBehaviorSubject`。\n\
  \n*   我们学习了一种在开发者工具中使用 Angular 暴露的 `ng` 对象来排查/调试 Angular 应用的新方法。\n\n*   我们看到了 `async\
  \ as` 的实际应用。\n\n*   我们看到了 `ngIf` 与 `else` 的实际应用。\n\n*   我们讨论了在从服务中发出引用类型时遇到的挑战。\n\
