  ## 讨论 – 继续\n\n现在所有要素都已准备就绪，是时候学习如何处理错误了。\n\n幸运的是，Angular 已经内置了集中式异常处理。默认实现会将错误消息打印到控制台。\n\
  \n可以通过使用自定义 Angular 服务并将其作为新的错误处理器注入到 Angular 管道中来覆盖默认行为。让我们来做同样的事情。\n\n## 实验 –\
  \ 继续\n\n**步骤 15：创建自定义错误处理器**\n\n在 `Services` 文件夹中创建一个新文件 `app-error-handler.service.ts`，内容如下：\n\
  \n```\n1.  import {HttpErrorResponse, HttpResponseBase} from ‘@angular/common/http’;\n\
  2.  import {ErrorHandler, Injectable, NgZone} from ‘@angular/core’;\n3.  import\
  \ {Router} from ‘@angular/router’;\n5.  @Injectable()\n6.  export class AppErrorsHandler\
  \ implements ErrorHandler {\n7.     constructor(\n8.       private router: Router,\n\
  9.       private zone:NgZone\n10.    ) {}\n12.     handleError(error: Error | HttpErrorResponse)\
  \ {\n13.       if (error instanceof HttpResponseBase) {\n14.  this.HandleServerSideError(error);\
  \ // 表示这是一个服务器端错误\n15.      } else {\n16.  this.HandleClientSideError(error); //\
  \ 表示这是一个客户端错误\n17.      }\n18.    }\n20.     private HandleServerSideError(error:\
  \ HttpErrorResponse) {\n21.       if (error.status === 0) {\n22.         alert(‘服务器未运行’);\n\
  23.      } else if (error.status === 401) {\n24.         this.zone.run(() => this.router.navigate([‘/login’]));\n\
  25.      } else {\n26.         localStorage.error = error.message;\n27.        \
  \ this.zone.run(() => this.router.navigate([‘/error’]));\n28.      }\n29.    }\n\
  30.     private HandleClientSideError(error: Error) {\n31.       localStorage.error\
  \ = error.message;\n32.       this.zone.run(() => this.router.navigate([‘/error’]));\n\
  33.    }\n34.  }\n```\n\n## 讨论 – 继续\n\n让我们理解一下上面的代码。\n\n你首先注意到的肯定是 `ErrorHandler`\
  \ 接口。要创建自定义错误处理器，我们必须让我们的类实现 `ErrorHandler` 接口，并定义 `handleError` 方法。\n\n`handleError`\
  \ 方法不言自明。你可以看到 if…else 条件。在讨论的四种错误中，有三种在 if 块中处理，而剩下的一种在 else 块中处理。\n\n**注意**：在当前情况下，我们只将最新的错误存储在本地存储中。在实际场景中，你可能会采用更持久的介质，例如数据库，并保留所有错误。\n\
  \n**zone**\n\n我敢肯定，上面代码中的 `zone.run` 一定引起了你的注意。\n\n我们将 `router.navigate` 封装在了 `zone.run`\
  \ 调用内部。\n\n为了理解这一点，请看下面的代码：\n\n![](img/Image53790.jpg)\n\n**图 21.7**\n\n上面的代码是 Angular\
  \ 原始源代码的一部分。当 Angular 应用程序抛出未处理的异常时，会执行 `onHandleError`。\n\nAngular 作为对错误的响应，会调用\
  \ `zone.runOutsideAngular` 方法。\n\n**zone.runOutsideAngular**\n\n在 Angular 中，zone\
  \ 为应用程序提供了执行上下文。\n\n`zone.runOutsideAngular` 使代码在 Angular 的执行上下文之外执行，这样变更检测就不会触发。如果你还记得，我们之前曾讨论过变更检测。我们说过它负责更新\
  \ UI，而没有变更检测就意味着没有 UI 更新。\n\n有时，为了控制 Angular 应用程序的性能，我们会有意将某些代码放在 Angular 的执行上下文之外执行。这可以通过\
  \ `runOutsideAngular` 方法来实现。\n\n默认情况下，Angular 只关心在控制台中显示异常详情，而不关心 UI 更新。因此，在集中式错误处理器中，它使用\
  \ `runOutsideAngular` 方法来执行代码。\n\n**zone.run**\n\n当你处于 Angular 的执行上下文之外时，可以使用 `zone.run`\
  \ 方法重新进入执行区域。\n\n上面的代码表明错误处理器在 Angular 上下文之外执行。因此，我们使用了 `zone.run` 方法，以便我们的 `router.navigate`\
  \ 方法在应用程序的原始执行上下文中执行，从而我们看到更新后的 UI。\n\n不必过于纠结于理解上述理论，因为我们在实际中很少使用 `runOutsideAngular`。\n\
  \n我的建议是，不要强行在你的项目中使用 `runOutsideAngular` 方法。\n\n当需要时，你自然会意识到它；其次，一旦你使用了它，你可能需要使用\
  \ `run` 方法回到原始世界。\n\n## 实验 – 继续\n\n**步骤 16：配置注入器**\n\n上一步将是用我们的自定义错误处理器配置根注入器。打开\
  \ `app.module.ts` 文件，并将代码修改为以下内容：\n\n```\n1.  import {HttpClientModule, HTTP_INTERCEPTORS}\
  \ from ‘@angular/common/http’;\n2.  import {APP_INITIALIZER, ErrorHandler, NgModule}\
  \ from ‘@angular/core’;\n3.  import {FormsModule, ReactiveFormsModule} from ‘@angular/forms’;\n\
  4.  import {BrowserModule} from ‘@angular/platform-browser’;\n5.  import {RouterModule}\
  \ from ‘@angular/router’;\n6.  ……\n7.  import {AppErrorsHandler} from ‘./Services/app-error-handler.service’;\n\
  8.  ……\n9.  @NgModule({\n10.  ……\n11.     providers: [\n12.       {provide: APP_INITIALIZER,\
  \ useFactory: initializeConfig, multi: true, deps:[AppConfigService]},\n13.    \
  \   {provide: HTTP_INTERCEPTORS, useClass: TokenInterceptorService, multi: true},\n\
  ```\n\n\n\n\n\n```\n{provide:ErrorHandler, useClass:AppErrorsHandler},\n……\n})\n\
  export class AppModule {}\n```\n\n## 讨论 – 续\n\n在上述代码中，你可以看到我们使用 `NgModule` 装饰器而不是\
  \ `Injectable` 装饰器来配置根注入器。在这种情况下不能使用 `Injectable` 装饰器，因为它不允许我们显式指定 DI 令牌。为了用自定义错误处理器替换错误处理器，我们需要显式提供一个\
  \ DI 令牌（`ErrorHandler`）。\n\n## 步骤 17：检查输出\n\n执行应用程序，确保针对四种错误都生成了期望的输出。\n\n**客户端运行时错误**\n\
