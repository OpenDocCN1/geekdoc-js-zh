  ## 讨论 – 续\n\n**你是否注意到了上述代码中的** `ngIf` **？**\n\n与 `ngFor` 类似，它是一个结构型属性。\n\n与 `hidden`\
  \ 不同，它不会隐藏或显示元素。相反，它会从 DOM 本身创建和移除元素。\n\n## 实验 – 续\n\n**步骤 12：检查输出**\n\n如你所见，初始状态下它是可见的。打开开发者工具，在元素部分检查\
