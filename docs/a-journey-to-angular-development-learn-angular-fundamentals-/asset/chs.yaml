  \ 的概念。这些就足够了。\n*   我们学习了 `npm`，它是一个 Node 包管理器。\n    *   使用它，我们可以将第三方 node 模块安装到我们的应用中。\n\
  \    *   它还能帮助我们执行 node 脚本。\n*   我们学习了 `package.json`，它是 `npm` 命令的配置文件。\n    * \
