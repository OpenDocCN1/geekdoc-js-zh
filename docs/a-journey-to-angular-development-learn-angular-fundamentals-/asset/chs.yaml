  \ Chrome 开发者工具。\n\n![](img/Image49976.jpg)\n\n**图 11.24**\n\n让我们讨论这个错误。\n\n## 讨论\
  \ – 继续\n\nAngular 中的每个组件和指令都属于某个 Angular 模块。\n\n**但是服务呢？**\n\n只有当 `AngularInjectors`\
  \ 配置了 `providers` 时，服务才能工作。\n\n**什么是注入器和提供者？**\n\n*注入器* 是根据配置的 *提供者* 创建并在需要的地方注入服务实例的对象。\n\
  \n我们将在下一章中进一步讨论 *注入器*。\n\n*提供者* 是向 Angular 框架的 *依赖注入* 系统发出的指令，用于决定如何获取依赖值。\n\n**如何将注入器与提供者一起配置？**\n\
  \n有以下三种方式可以实现：\n\n1. `Component` 装饰器允许我们这样做。\n2. `NgModule` 装饰器允许我们这样做。\n3. `Injectable`\
  \ 装饰器允许我们这样做。\n4. 创建一个独立的 *Angular 模块*，在其 `NgModule` 装饰器中配置 *注入器*，然后将该 *Angular\
  \ 模块* *导入* 到我们的 *Angular 模块* 中。\n\n我们将在本书中讨论所有四种方法。这次让我们看看第四种方法。\n\n**自定义 Angular\
  \ 模块和导入方法**\n\n前三种方法非常简单直接。第四种方法有点奇怪。它要求我们创建一个自定义的 *Angular 模块*，然后使用第三种方法配置 *注入器*，最后将该\
  \ *模块* 导入到我们的 *Angular 模块* 中。当我们将一个 *Angular 模块* 导入到另一个模块时，它们的 *providers* 会合并。\n\
  \n这些模块在逻辑上被称为 **服务模块**。\n\n您一定在想为什么要绕这么大一个弯。让我给您一个场景：\n\n1. 假设我们有一个 *ServiceX*，我们的\
  \ *ABCDComponent* 依赖于它。要在 *ABCDComponent* 中使用 *ServiceX*，我们必须使用前三种方法之一配置 *注入器*。\n\
  2. 现在令人惊讶的是，*ServiceX* 依赖于 *ServiceY* 和 *ServiceZ*。因此，仅为 *ServiceX* 配置 *注入器* 是不够的。我们还需要为\
  \ *ServiceY* 和 *ServiceZ* 配置 *注入器*，并且对于 *ServiceY* 和 *ServiceZ* 所依赖的每一个其他依赖项也是如此。\n\
  \n对于服务的消费者（即组件 *ABCDComponent*）来说，这不是工作量太大了吗？\n\n1. 因此，创建 *服务* 的程序员会创建一个 *Angular\
  \ 模块*。我们称之为 *ServiceModule*。\n2. 他会在该 *ServiceModule* 的 `NgModule` 装饰器中为 *ServiceX*\
  \ 以及层次结构中的所有其他 *服务* 配置 *注入器*。\n3. 负责 *ABCDComponent* 的程序员只需将 *ServiceModule* *导入*\
  \ 到包含 *ABCDComponent* 的 *模块* 中。\n4. 在内部，*ServiceModule* 中定义的所有提供者将与 *ABCDComponent’sModule*\
  \ 合并，从而使开发人员的工作更轻松。\n\n对于可重用库来说，这是一种方便的方法。\n\n通常，每当您考虑使用可重用的第三方服务时，您总会找到一个需要导入到目标\
  \ *Angular 模块* 中的 *Angular 模块*。\n\n最重要的是，让我告诉您，这个概念对您来说并不陌生。您已经在 `AppModule` 中导入了\
  \ Browser Module，它负责为 DOM 操作服务配置 *注入器*。\n\n同样，对于 *RouterModule*，您也采用了相同的解决方案。它被导入到\
  \ *AppModule* 中，以便 *注入器* 能够将 *RouterService* 的实例注入到 Customer Component 中。\n\n**对于\
  \ HttpClient，我们是否有类似的 ServiceModule 快捷方式？**\n\n* 在内部，`HttpClient` 服务依赖于其他一些 Angular\
  \ 服务。\n* 因此，仅为 `HttpClient` 注册 *注入器* 是不够的。我们还需要注册所有其他依赖的服务。\n\n因此，Angular 团队通过提供\
  \ `HttpClient` 模块简化了我们的工作。只需将其导入到我们的 `AppModule` 中，一切就完成了。\n\n理解上述查询时出现一些困惑是很常见的。在完成下一章后重新阅读它，就会变得清晰。\n\
  \n## 实验 – 继续\n\n### 步骤 31：在 AppModule 中导入 HttpClientModule\n\n向 `AppModule` 添加如下代码：\n\
