  \n## 讨论 – 续\n\n尽管一切按预期工作，但前面的实验中存在一个大问题，即急切加载。\n\n所有组件从一开始就被加载到项目中。\n\n打开开发者工具并检查源代码选项卡。你会找到\
  \ `main.js`。请打开它并上下滚动，查看客户模板内容、供应商模板内容和产品模板内容。所有内容都打包在一个文件中。\n\n![](img/Image54825.jpg)\n\
  \n**图 23.3**\n\n![](img/Image54860.jpg)\n\n**图 23.4**\n\n让我们构建项目，确认生成的包文件是否也存在同样的问题。\n\
  \n在命令提示符中按 `Ctrl + C` 停止当前执行。\n\n然后使用 `ng build` 命令创建项目构建。\n\n![](img/Image54867.jpg)\n\
  \n**图 23.5**\n\n如你所见，只生成了一个与应用相关的包——`main.js`。\n\n现在，在其中搜索 `customer` 关键字。然后搜索 `supplier`，接着搜索\
  \ `product`。\n\n你会发现所有内容都在这一个 JavaScript 文件中。\n\n想象一下一个包含数百个此类组件的项目。想象一下包的大小，以及浏览器下载这个巨大包文件的负载。\n\
  \n解决方案是惰性加载。我们将配置路由以惰性加载组件。\n\n为此，首先必须将每个组件封装在独立的 Angular 模块中。\n\n## 实验 – 续\n\n\
  ### 步骤 14 – 创建 Angular 模块\n\n在 `Customer` 文件夹中创建一个新的 Angular 模块 `CustomerModule`。然后，将所有与客户相关的组件包含在这个\
  \ `CustomerModule` 中。\n\n```\nimport {NgModule} from ‘@angular/core’;\nimport {CustomerAddComponent}\
  \ from ‘./customer-add.component’;\nimport {CustomerListComponent} from ‘./customer-list.component’;\n\
  import {CustomerComponent} from ‘./customer.component’;\n@NgModule({\n   declarations:\
  \ [CustomerComponent,CustomerListComponent,CustomerAddComponent]\n})\nexport class\
  \ CustomerModule {}\n```\n\n完成后，确保从 `AppModule` 中移除上述所有组件。\n\n![](img/Image54948.jpg)\n\
  \n**图 23.6**\n\n## 讨论 – 续\n\n如你所见，`CustomerComponent`、`CustomerListComponent` 和\
  \ `CustomerAddComponent` 被添加到了 `CustomerModule` 的 `declaration` 部分。\n\n*   但你可能注意到\
  \ `NgModule` 装饰器中没有 `bootstrap` 部分。\n\n    `bootstrap` 部分仅在根模块中需要，用于声明根组件。\n\n*\
  \   你可能已经注意到 `imports` 部分缺少了 `BrowserModule`。\n\n    这是因为 `BrowserModule` 中注册的服务需要是单例的，因此它只在根模块中导入。\n\
  \n不必过于担心。在下一章中，我们将复习关于 Angular 模块（涉及服务、组件、路由等）的所有知识。\n\n## 实验 – 续\n\n### 步骤 15 –\
  \ 创建其他 Angular 模块\n\n接下来，创建 `SupplierModule` 和 `ProductModule`，如下所示：\n\n```\nimport\
  \ {NgModule} from ‘@angular/core’;\nimport {SupplierComponent} from ‘../Supplier/supplier.component’;\n\
  @NgModule({\n   declarations: [SupplierComponent],\n})\nexport class SupplierModule\
  \ {}\n```\n\n```\nimport {NgModule} from ‘@angular/core’;\nimport {ProductComponent}\
  \ from ‘./product.component’;\n@NgModule({\n   declarations: [ProductComponent],\n\
  })\nexport class ProductModule {}\n```\n\n同样，不要忘记从 `AppModule` 中移除相应的组件。\n\n###\
  \ 步骤 16 – 重新配置路由以实现惰性加载\n\n打开 `app.route.ts` 文件，将路由修改为以下内容：\n\n```\nexport const\
  \ AppRoutes: Routes = [\n   {path: ‘login’, component: LoginComponent},\n   {\n\
  \     path: ‘’,\n     component: AuthComponent,\n     canActivate: [AuthGuard],\n\
  \     children: [\n       {\n         path: ‘customer’,\n         loadChildren:\
  \ () =>\n           import(‘src/app/Customer/customer.module’).then(\n         \
  \    (x) => x.CustomerModule\n          ),\n      },\n       {\n         path: ‘supplier’,\n\
  \         loadChildren: () =>\n           import(‘src/app/Supplier/supplier.module’).then(\n\
  \             (x) => x.SupplierModule\n          ),\n      },\n       {\n      \
  \   path: ‘product’,\n         loadChildren: () =>\n```\n\n\n\n\n\n```\n       \
  \    import('src/app/Product/product.module').then(\n             (x) => x.ProductModule\n\
  \          ),\n      },\n       {\n         path: '',\n         redirectTo: 'customer',\n\
  \         pathMatch: 'full',\n      },\n    ],\n  },\n   {path: 'error-test', component:\
  \ ErrorTestComponent},\n   {path: 'error', component: ErrorComponent},\n   {path:\
  \ '**', redirectTo: 'customer', pathMatch: 'full'},\n];\n```\n\n如你所见，我们已经移除了所有组件的引用，现在改为引用模块。\n\
  \n同时，在定义路由时，我们不再使用 `component`，而是使用 `loadChildren`。\n\n### 第 17 步 – 定义子路由\n\n要使懒加载生效，还需要执行最后一步。定义子路由，并在相应的\
  \ Angular 模块中按如下方式配置：\n\n```\nconst childRoute: Routes = [{path: '', component:\
  \ CustomerComponent}];\n\n@NgModule({\n   imports: [RouterModule.forChild(childRoute)],\n\
  \   declarations: [\n     CustomerComponent,\n     CustomerListComponent,\n    \
  \ CustomerAddComponent,\n  ],\n})\nexport class CustomerModule {}\n```\n\n```\n\
  const childRoute: Routes = [{path: '', component: SupplierComponent}];\n\n@NgModule({\n\
  \   imports: [RouterModule.forChild(childRoute)],\n   declarations: [\n     SupplierComponent\n\
  \  ],\n})\nexport class SupplierModule {}\n```\n\n```\nconst childRoute: Routes\
  \ = [{path: '', component: ProductComponent}];\n\n@NgModule({\n   imports: [RouterModule.forChild(childRoute)],\n\
  \   declarations: [\n     ProductComponent\n  ],\n})\nexport class ProductModule\
  \ {}\n```\n\n### 第 18 步 – 检查控制台\n\n我不确定你是否查看过运行 Angular 应用程序的命令提示符。你会发现 `CustomerAddComponent`\
  \ 和 `CustomerListComponent` 抛出了一堆错误。\n\n![](img/Image55004.jpg)\n\n**图 23.7**\n\n\
  向下滚动，你会看到 `CustomerListComponent` 抛出的 `*ngFor` 错误、`CustomerComponent` 抛出的 `*ngIf`\
  \ 错误，以及 `CustomerAddComponent` 抛出的 `ngModel` 错误。\n\n## 讨论 – 续\n\n如你所知，Angular 中的组件属于某个\
  \ Angular 模块。\n\n同样的规则也适用于指令和管道。（稍后我们将创建自定义指令和管道，届时你会看到实际效果。）\n\n我们在本书前面已经讨论过模块的概念——在\
  \ ES6 学习和 TypeScript 学习中。模块的思想在任何地方都是一样的。\n\n在一个模块中定义的所有内容，默认情况下对该模块是私有的，外部无法访问。如果一个模块想要访问另一个模块中定义的内容，那么第二个模块需要导入第一个模块。\n\
  \n**ngModule**\n\n如果你还记得，在我们之前的代码中，`CustomerAddComponent` 是 `AppModule` 的一部分，并且我们在\
  \ `AppModule` 中导入了 `FormsModule`。这就是我们能够在 `CustomerAddComponent` 中使用诸如 `ngModel`\
  \ 等指令的原因。\n\n在新代码中，`CustomerAddComponent` 被定义为 `CustomerModule` 的一部分。我们从未在 `CustomerModule`\
  \ 中导入 `FormsModule`。这就是我们收到此类错误的原因。\n\n在 `CustomerModule` 中导入 `FormsModule` 将解决\
  \ `CustomerAddComponent` 中抛出的一堆错误。\n\n`*ngFor`、`*ngIf` 和 `ngClass`\n\n但这并不能解决 `CustomerListComponent`\
  \ 抛出的关于 `*ngFor` 的错误。\n\n`*ngFor`、`*ngIf`、`ngClass` 是在 `CommonModule` 中定义的指令。\n\n\
  要解决这些指令相关的错误，我们需要在相应的模块中导入 `CommonModule`。\n\n现在，我相信有一个大问题困扰着你。**为什么之前能正常工作？**\n\
  \n之前，`CustomerListComponent` 是 `AppModule` 的一部分。我知道你会立刻说：“但我们没有在 `AppModule` 中导入\
  \ `CommonModule`。” 确实如此，但你导入了 `BrowserModule`，而它内部导入了 `CommonModule`。（你将在下一章中了解更多关于\
  \ Angular 模块的内容。）\n\n**那么为什么我们不在 `CustomerModule` 中导入 `BrowserModule` 呢？**\n\n`BrowserModule`\
  \ 还会为一些负责 DOM 操作和许多其他浏览器相关服务的服务配置注入器。这些服务预期在应用程序级别是单例的。再次导入它会抛出以下错误：\n\n![](img/Image55012.jpg)\n\
  \n**图 23.8**\n\n## 实验 – 续\n\n### 第 19 步 – 导入 Forms 和 CommonModule\n\n在 `CustomerModule`\
  \ 中同时导入 `FormsModule` 和 `CommonModule`。\n\n```\n@NgModule({\n   imports: [RouterModule.forChild(childRoute),CommonModule,FormsModule],\n\
  \   declarations: [\n     CustomerComponent,\n     CustomerListComponent,\n    \
  \ CustomerAddComponent,\n  ],\n})\nexport class CustomerModule {}\n```\n\n### 第\
  \ 20 步 – 检查输出\n\n确保所有路由都能像之前一样正常工作。然后，打开开发者工具并检查源代码选项卡。\n\n![](img/Image55058.jpg)\n\
  \n**图 23.9**\n\n你会看到 `main.js`，但除此之外，你还会发现另一个与客户相关的 JavaScript 文件。\n\n接下来，点击供应商链接，你会发现与供应商相关的\
  \ JavaScript 文件被加载。产品也是如此。\n\n![](img/Image55098.jpg)\n\n**图 23.10**\n\n这就是所谓的懒加载。根据需求，`组件/模块`\
  \ 被加载。\n\n### 第 21 步 – 构建项目\n\n使用 `ng build` 命令构建项目，并检查生成的文件。你会发现每个懒加载模块都有一个对应的包。\n\
  \n# 懒加载的是什么？——模块还是组件？\n\n当你学习这个概念时，有时会听到模块被懒加载，有时是组件。那么，到底什么被懒加载了？\n\n答案是两者都有。模块被懒加载，它们对应的组件也被懒加载。\n\
  \n# 打包是好是坏？\n\n我相信你现在一定在想一件事。\n\n*之前在学习 JavaScript 时，我们谈到了打包的优势。我们说需要打包，而现在我们却在寻找创建多个包的方法。*\n\
  \n让我澄清一下。打包确实很好，但包不应该太大。如果太大，就把它拆分成多个。\n\n我的大多数客户都遇到过这个问题。我见过包大小超过 30MB 的项目。\n\n\
  # 这是否意味着我们应该对每个模块都进行懒加载？\n\n在我们的例子中，我配置路由的方式是让每个模块都懒加载。因此，每个模块都会生成一个包，但在实际项目中并非如此。\n\
  \n如果你这样做，那么打包就毫无意义了。这就像按需加载所有内容。\n\n# 混合方法\n\n在实际项目中，要明智地做出决定。一部分模块急切加载，一部分模块懒加载。\n\
  \n例如，看下面的示例路由：\n\n```\nexport const AppRoutes: Routes = [\n   {path: 'login', component:\
  \ LoginComponent},\n   {path:'',component:AuthComponent,children:[\n     {\n   \
  \    path:'config',\nloadChildren:import(\"src/app/master/maser.module\").then(x=>x.MasterModule)\n\
  \    },\n     {\n       path:'exec',\nloadChildren:import(\"src/app/transaction/transaction.module\"\
  ).then(x=>x.TransactionModule)\n    }\n  ]},\n];\n\n@NgModule({\n   declarations:\
  \ [LoginComponent,HeaderComponent,AuthComponent],\n})\nexport class InitialModule\
  \ {}\n\n@NgModule({\n   imports:[InitialModule,RouterModule.forRoot(AppRoutes)],\n\
  \   declarations: [AppComponent],\n})\nexport class AppModule   {}\n```\n\n\n\n\n\
  \n*   在上述代码中，你可以看到四个 Angular 模块的实际应用——`AppModule`、`InitialModule`、`MasterModule`\
  \ 和 `TransactionModule`。\n    *   假设 `LoginComponent`、`HeaderComponent` 和 `AuthComponent`\
  \ 被声明为 `InitialModule` 的一部分。\n    *   假设 `MasterModule` 包含 `CustomerComponent` 和\
  \ `ProductComponent`。\n    *   假设 `TransactionModule` 包含 `CheckoutComponent` 和 `CheckInComponent`。\n\
  *   `AppComponent` 是根组件，`AppModule` 是根模块。因此它会在应用初始化时被加载，并包含在主包中。\n*   `InitialModule`\
  \ 被直接导入到 `AppModule` 中。因此它会被立即加载，并包含在主包中。\n*   `MasterModule` 将被懒加载，因此会为该模块创建一个单独的包，其中包含\
  \ `CustomerComponent` 和 `ProductComponent`。\n*   `TransactionModule` 将被懒加载，因此会为该模块创建一个单独的包，其中包含\
  \ `CheckoutComponent` 和 `CheckInComponent`。\n\n让我们分别探讨这两个模块。\n\n```\n1.  export\
  \ const configRoutes: Routes = [\n2.     {path: ‘customer’, component: CustomerComponent},\n\
  3.     {path: ‘product’, component: ProductComponent},\n4.  ];\n5.  @NgModule({\n\
  6.     imports:[RouterModule.forChild(configRoutes)],\n7.     declarations: [CustomerComponent,ProductComponent],\n\
  8.  })\n9.  export class MasterModule  {}\n```\n\n`MasterModule` 为其两个组件配置了路由。\n\n\
  ```\n1.  export const execRoutes: Routes = [\n2.     {path: ‘cout’, component: CheckoutComponent},\n\
  3.     {path: ‘cin’, component: CheckInComponent},\n4.     {path: ‘bal’, component:\
  \ BalanceSheetComponent},\n5.     {path: ‘pnl’, component: ProfitAndLossComponent},\n\
  6.  ];\n7.  @NgModule({\n8.     declarations: [BalanceSheetComponent,ProfitAndLossComponent],\n\
  9.  })\n10.  export class ReportModule {}\n11.  @NgModule({\n12.     imports:[ReportModule],\n\
  13.     declarations: [CheckoutComponent,CheckInComponent],\n14.  })\n15.  export\
  \ class TransactionModule  {}\n```\n\n看看 `TransactionModule`。它不仅为自身的每个组件配置了路由，还为\
  \ `ReportsModule` 的组件配置了路由。`TransactionModule` 导入了 `ReportsModule`。因此，当 `TransactionModule`\
  \ 被加载时，`ReportsModule` 也会被加载。此外，`ReportsModule` 中的所有组件都会成为同一个包的一部分。\n\n简而言之，`ReportModule`\
  \ 和 `TransactionModule` 将被包含在同一个模块中。\n\n因此，总体来看，上述示例有三个懒加载模块——主模块、master 模块和 transaction\
  \ 模块。\n\n# 预加载策略\n\n懒加载是一个很好的特性，因为它使包更小并减少了初始加载时间——Angular 会在用户首次请求模块时加载它。\n\nAngular\
  \ 允许我们通过一种称为预加载的技术进一步优化应用——在用户与应用交互时，在后台异步加载懒加载模块。这有助于提升应用的加载时间。\n\n当我们使用 `forRoot`\
  \ 方法配置路由时，我们可以传入第二个参数来指定策略。\n\n```\n1.  RouterModule.forRoot(AppRoutes, {preloadingStrategy:\
  \ NoPreloading}))\n```\n\n它可以有两个可能的值。\n\n`NoPreloading`：这是默认值。表示你不想预加载，因此配置为懒加载的模块将按需下载。\n\
  \n`PreloadAllModules`：表示你想在后台异步加载所有懒加载模块。\n\n通过预加载懒加载模块，用户无需等待模块下载。所有模块都已在后台下载完毕。\n\
  \n尝试使用这两种策略运行我们的项目。这非常简单。只需运行，然后在开发者工具中查看哪些被加载了，哪些没有。\n\n你是否对立即加载和带有 `PreloadAllModules`\
  \ 的懒加载感到困惑？\n\n**立即加载**\n\n将模块作为同一个包的一部分，并在开始时加载。\n\n**带有 NoPreloading 的懒加载**\n\n\
  为每个懒加载模块创建一个单独的包，并按需加载。\n\n**带有 PreloadAllModules 的懒加载**\n\n为每个懒加载模块创建一个单独的包，并在后台异步加载所有模块。\n\
  \n# 自定义预加载策略\n\n我们甚至可以创建自定义预加载策略来满足我们的需求。为此，我们必须创建一个继承自 `PreLoadingStrategy` 类的自定义类，然后定义\
  \ `preload` 方法。\n\n```\n1.  export class CustomPreloadStrategy implements PreloadingStrategy\
  \ {\n2.     preload(route: Route, load: () => Observable<any>): Observable<any>\
  \ {\n3.       if (true){\n4.         return load();\n5.      }\n6.       else{\n\
  7.         return of(null);\n8.      }\n9.    }\n10.  }\n```\n\n`pre-load` 方法会为应用中配置的每个懒加载路由调用一次。\n\
  \n如你所见，pre-load 方法的第一个参数是当前路由。我们可以用它来提取正在加载的路由的信息。\n\n第二个参数是一个 `Observable` 函数，如果我们想预加载这个模块，就需要返回它。如果我们不想预加载该模块，可以返回\
  \ `Observable` 的 null。\n\n#### 总结\n\n至此，我们完成了路由的学习，也完成了前往第 12 站的旅程。让我们回顾一下本章学到的内容：\n\
  \n*   我们学习了当组件 HTML 很简单时，如何使用 template 属性代替 templateUrl。\n*   我们重新回顾了 router-outlet\
  \ 组件，它根据不同的 URL 显示不同的组件。\n*   我们讨论了 `routerLink` 指令，它允许我们在路由之间导航而无需刷新整个页面。\n*  \
  \ 我们学习了 `routerLinkActive`，它允许我们在特定路由处于活动状态时添加 CSS 类。\n*   我们讨论了默认路由，当 URL 为空时会加载这些路由。\n\
  *   我们了解到可以在根级别和子级别定义默认路由。\n*   我们详细研究了懒加载，并学习了它如何减少初始加载时间。\n*   我们讨论了预加载策略，它让我们决定是否异步加载懒加载模块。\n\
  \n## 第 24 章\n\n### Angular 模块\n\n## 引言\n\n前往第 13 站的旅程将是所有旅程中最棒的。通过这一章，你将得到几乎所有之前未解答问题的答案。\n\
  \n我们将讨论 Angular 模块的一切。我们将探讨为什么需要它们？我们将讨论它们如何与组件、服务和路由协同工作。\n\n#### Angular 模块与 Angular\
  \ 组件\n\n在经历了 23 章并完成第 12 站的旅程后，你一定对 Angular 组件有了清晰的认识。它们是 Angular 应用的基本构建块，代表整个\
  \ UI 中自包含的一部分。\n\n组件被封装在 Angular 模块内部。\n\n让我们回答几个与之相关的问题。\n\n##### 问题 1 – 为什么将 Angular\
  \ 组件分组到 Angular 模块中？\n\n我们现在非常清楚，在真实项目中，我们会创建多个基于功能的组件。\n\n想象一个具有十个功能的应用。\n\n它会有多少个组件？\n\
  \n如果你说十个，那并不是正确答案。它会有更多。\n\n我们可能会开发一些可复用的组件。\n\n\n\n\n\n我们甚至可以将每个功能组件规划为多个更小的组件，使其更具可读性和可管理性。还记得我们的\
  \ `CustomerComponent` 吗？我们将其拆分为 `CustomerList`、`CustomerAdd` 和 `CustomerComponent`。\n\
  \n简而言之，我们最终可能会得到大量组件。\n\n组件都有选择器。如何确保每个组件都有唯一的选择器？实际上，这是不可能的。这就是为什么我们需要 Angular\
  \ 模块。\n\n让我们快速演示一下。\n\n# 实验 8 – 多个 Angular 模块和组件\n\n### 步骤 1 – 创建新的 Angular 项目\n\
  \n使用 Angular CLI，按如下方式创建一个新的 Angular 项目：\n\n1.  `ng new myapp`\n\n### 步骤 2 – 创建功能组件\n\
  \n对于此演示，我们需要两个组件——`Customer` 和 `Product`。\n\n这次我们不会手动操作，而是使用 Angular CLI 来完成。\n\n\
  确保你位于 `myapp` 文件夹内，然后执行以下命令：\n\n1.  `ng g c Customer`\n\n如你所见，CLI 为我们完成了所有繁重的工作。\n\
  \n它创建了 customer 文件夹。\n\n![](img/Image55153.jpg)\n\n**图 24.1**\n\n它为你创建了组件，并将组件类与其模板和\
  \ CSS 连接起来。\n\n1.  它将选择器设置为 `app-customer`。\n2.  它还将该组件添加到了 `AppModule` 的 `NgModule`\
  \ 装饰器中的 `declarations` 部分。\n\n### 步骤 3 – 创建 ProductComponent\n\n使用相同的方法，创建 `ProductComponent`。\n\
  \n![](img/Image55215.jpg)\n\n**图 24.2**\n\n### 步骤 4 – 为 Customer 创建 HeaderComponent\n\
  \n现在，假设 `CustomerComponent` 的开发人员决定将其拆分为更小的组件。他/她得出结论，需要 `HeaderComponent`，因此可以像上图所示那样创建它。\n\
  \n![](img/Image55252.jpg)\n\n**图 24.3**\n\n如你所见，我们指示 CLI 在 `customer` 文件夹内创建一个新组件。\n\
  \n其次，默认情况下，CLI 会为每个组件创建一个新文件夹。通过使用 `--flat` 标志，我们指示 CLI 跳过自定义文件夹的创建。\n\n打开组件并检查选择器。\n\
  \n```\n@Component({\n   selector: ‘app-header’,\n……\n```\n\n### 步骤 5 – 为 Product\
  \ 创建 HeaderComponent\n\n`ProductComponent` 的开发人员也经历了同样的思考过程。他也按如下方式创建了 `HeaderComponent`：\n\
  \n![](img/Image55287.jpg)\n\n**图 24.4**\n\n你是否注意到这个组件有什么有趣的地方？你会发现这次 `AppModule`\
  \ 没有更新。\n\nCLI 未能将新的 `HeaderComponent` 添加到 `AppModule`，因为其类名与上一步创建的 `HeaderComponent`\
  \ 冲突。\n\n### 步骤 6 – 将新的 HeaderComponent 添加到模块\n\n让我们使用 TypeScript 别名手动完成，如下所示：\n\
  \n```\n……\nimport {HeaderComponent as ProductHeaderComponent} from\n‘./product/header.component’;\n\
  import {HeaderComponent  } from ‘./customer/header.component’;\nimport {ProductComponent}\
  \ from ‘./product/product.component’;\nimport {CustomerComponent} from ‘./customer/product.component’;\n\
  \n@NgModule({\n   declarations: [\n     AppComponent,\n     CustomerComponent,\n\
  \     ProductComponent,\n     HeaderComponent,\n     ProductHeaderComponent,\n \
  \ ],\n……\n```\n\n如果你想知道 Product 的 `HeaderComponent` 如何变成了 `ProductHeaderComponent`，那你可能漏掉了\
  \ TypeScript 的 import 语句。检查一下，你会发现我们在导入时指定了一个别名，这样两个 `HeaderComponent` 类型就可以同时使用了。\n\
  \n### 步骤 7 – 修改 header 内容\n\n打开 `customer` 文件夹中的 `header.component.html`，放入以下内容：\n\
  \n1.  `<b>I am Customer Header</b>`\n\n然后，将 product 文件夹中的 `header.component.html`\
  \ 文件内容修改为：\n\n1.  `<b>I am Product Header</b>`\n\n### 步骤 8 – 使用组件\n\n打开 `customer.component.html`，将内容修改为：\n\
  \n1.  `<p>customer works!</p><br>`\n2.  `<app-header></app-header>`\n\n打开 `product.component.html`，将内容修改为：\n\
  \n1.  `<p>product works!</p><br>`\n2.  `<app-header></app-header>`\n\n### 步骤 9 –\
  \ 使用 Customer 和 ProductComponent\n\n打开 `app.component.html`，将其内容替换为：\n\n1.  `<app-customer></app-customer><hr>`\n\
  2.  `<app-product></app-product>`\n\n### 步骤 10 – 检查输出\n\n使用 `ng serve` 命令运行应用程序。\n\
  \n你将看到如下运行时错误：\n\n试着想象一个大型企业项目，其中有多个开发人员同时工作。\n\n![](img/Image55334.jpg)\n\n**图\
  \ 24.5**\n\n如果我们采用单个 Angular 模块的方式，在这样的项目中很可能会出现上述错误。每个开发人员无法时刻关注应用中所有其他组件的选择器。\n\
  \n因此，我们采用为应用中的每个功能创建一个 Angular 模块的做法。我们将与一个功能相关的所有组件分组到一个 Angular 模块中。\n\n### 步骤\
  \ 11 – 创建 Customer 模块\n\n使用 Angular CLI 创建一个新的 Angular 模块 `CustomerModule`，如下所示：\n\
  \n![](img/Image55378.jpg)\n\n**图 24.6**\n\n它在 `customer` 文件夹内创建了 `CustomerModule`。\n\
  \n![](img/Image55414.jpg)\n\n**图 24.7**\n\n我相信你知道为什么它的 `imports` 部分有 `CommonModule`。\n\
  \n`CommonModule` 是一个 Angular 模块，它封装了诸如 `*ngIf`、`*ngFor`、`ngClass` 等指令。\n\nAngular\
  \ CLI 足够智能，知道通常每个模块都需要这些指令。因此，导入它是 CLI 设计过程的一部分。如果你愿意，可以移除它，但请记住，之后 `CommonModule`\
  \ 中定义的通用指令和管道将无法工作。\n\n### 步骤 12 – 将与 Customer 相关的组件移动到 CustomerModule\n\n从 `AppModule`\
  \ 的 `declarations` 部分移除 `CustomerComponent` 和 `HeaderComponent`。\n\n然后将它们放入 `CustomerModule`\
  \ 的 `declarations` 部分，如下所示：\n\n![](img/Image55474.jpg)\n\n**图 24.8**\n\n![](img/Image55482.jpg)\n\
  \n**图 24.9**\n\n### 步骤 13 – 创建 ProductModule\n\n接下来，使用 Angular CLI 创建 `ProductModule`。\n\
  \n![](img/Image55519.jpg)\n\n**图 24.10**\n\n### 步骤 14 – 将与 Product 相关的组件移动到 ProductModule\n\
  \n将 `ProductComponent` 和 `HeaderComponent` 都移动到 `ProductModule`。\n\n![](img/Image55608.jpg)\n\
  \n**图 24.11**\n\n![](img/Image55621.jpg)\n\n**图 24.12**\n\n完成此步骤后，`AppModule` 将只剩下一个组件，即\
  \ `AppComponent`。\n\n### 步骤 15 – 检查输出\n\n使用 `ng serve` 命令运行应用程序。你会注意到以下错误：\n\n![](img/Image55658.jpg)\n\
  \n**图 24.13**\n\n上述错误是预料之中的。原因如下：\n\n*   此时，`CustomerComponent` 属于 `CustomerModule`。\n\
  *   规则规定，默认情况下每个组件对其所属模块是私有的。因此，`CustomerComponent` 默认对 `CustomerModule` 是私有的。\n\
  *   因此，它不能在非 `CustomerModule` 的任何组件中使用。\n*   `AppComponent` 不属于 `CustomerModule`，它属于\
  \ `AppModule`。因此，`CustomerComponent` 不能在 `AppComponent` 中使用。\n\n要使其正常工作，我们必须显式地将\
  \ `CustomerComponent` 标记为 `CustomerModule` 中的公共组件。\n\n### 步骤 16 – 使 CustomerComponent\
  \ 对 AppComponent 可见\n\n这需要两步。首先，将 `CustomerComponent` 添加到 `CustomerModule` 的 `exports`\
  \ 部分，然后在 `AppModule` 中导入 `CustomerModule`，如下所示：\n\n![](img/Image55720.jpg)\n\n**图\
  \ 24.14**\n\n![](img/Image55727.jpg)\n\n**图 24.15**\n\n\n\n\n\n在 Angular 中，当一个 Angular\
  \ 模块导入另一个 Angular 模块时，前者可以访问后者中导出的所有成员。\n\n![](img/Image55735.jpg)\n\n**图 24.16**\n\
  \n**步骤 17 – 让 `ProductComponent` 对 `AppComponent` 可见**\n\n对 `ProductComponent` 执行上述步骤。\n\
  \n**步骤 18 – 检查输出**\n\n运行应用程序以获取预期输出。\n\n因此，为每个特性创建一个模块是任何 Angular 应用程序中的推荐做法。这回答了我们的第一个问题。\n\
  \n# 问题 2 – 是否必须从 Angular 模块中导出每个组件？\n\n不，你不应该这样做。\n\n只将那些你希望在其他组件的模板中使用的组件放入 `exports`\
  \ 部分。\n\n通过不在 `exports` 部分声明其他组件，将它们保持为私有。\n\n（请记住——一个模块中的组件彼此之间始终可见。除非标记为公共，否则它们在模块外部不可见。）\n\
  \n# 问题 3 – 路由呢？\n\n即使组件是私有的，也可以通过路由访问它。\n\n# 问题 4 – 当一个 Angular 模块导入另一个模块时会发生什么？\n\
  \n第二个模块中所有导出的组件在第一个模块中变为可见。\n\n# 问题 5 – 指令和管道呢？\n\n你学到的关于组件的所有内容同样适用于指令和管道。\n\n\
  每个指令和管道都将放在 `NgModule` 装饰器的 `declarations` 部分。\n\n之后，同样的公共和私有逻辑将适用。\n\n# 问题 6 –\
  \ 从未被使用的组件会怎样？\n\nAngular 的构建过程非常出色。\n\n你还记得 `Injectable` 装饰器和 `Tree-shaking` 吗？\n\
  \n我们了解到，使用 `Injectable` 装饰器是配置模块注入器的推荐方式。\n\n`Tree-shaking` 是在 Angular 构建过程中发生的过程。它确保如果应用程序中未使用带有\
  \ `Injectable` 装饰器的服务，则将其从最终构建中移除。\n\n同样的 tree-shaking 过程也会处理未使用的组件、指令和管道。如果某个组件从未在任何模板中使用过，它将被从最终构建中移除。\n\
  \n**请注意：** 我说的是“从未在任何模板中使用过”。我从未说过“未在 Angular 模块中声明”。即使组件是 Angular 模块的一部分，只要它未在任何其他组件模板中使用，它也会从打包文件中移除。\n\
  \n由于 tree-shaking，打包文件的整体大小会减小。\n\n作为开发者，你不需要对 tree-shaking 做任何操作。只需创建你的应用程序并构建它。Angular\
  \ CLI 会为你处理所有繁重的工作。\n\n# 问题 7 – tree-shaking 有什么缺点吗？\n\n是的，有。在某些场景下，你永远不会在任何模板中使用某些组件，但你仍然希望它们成为打包文件的一部分。\n\
  \n**在这种情况下该怎么办？**\n\n我们可以处理这种情况。`NgModule` 部分有一个特殊的部分叫做 `entryComponents`。\n\n只需在该组件上声明\
  \ `entryComponents` 部分，就可以了。无论该组件是否在其他模板中使用，它都将成为最终打包文件的一部分。\n\n```\n@NgModule({\n\
  \  declarations: [\n    AppComponent,\n    ProductComponent,\n    ProductHeaderComponent,\
  \ DontDeleteComponent\n  ],\n  imports: [BrowserModule,CustomerModule,ProductModule],\n\
  \  providers: [],\n  bootstrap: [AppComponent],\n  entryComponents:[DontDeleteComponent]\n\
  })\nexport class AppModule {}\n```\n\n**现在你可能想知道，我们为什么要这样做？**\n\n在某些场景下，我们会在代码中动态加载组件，而不是在模板中使用它们。\n\
  \n你能想到一个这样的场景吗？我给你一个提示。你已经做过一个这样的演示了。\n\n那就是路由。我们是否曾在模板中的任何地方使用过那些组件？但它们仍然是打包文件的一部分。为什么？答案是\
  \ `entryComponents`。\n\n你可能会争辩说，你从未在 `entryComponents` 部分中添加过任何组件。\n\n我同意你的说法。你从未这样做过，但\
  \ Angular 做了。每个配置到路由中的组件都会自动添加到 `entryComponents` 数组中。\n\n# 问题 8 – 是否有任何场景需要我们显式地将组件放入\
  \ `entryComponents` 部分？\n\n一个用例是第三方库。有时，你可能会遇到某个第三方 Angular 库，它期望你创建一个组件并将其添加到 `entryComponents`\
  \ 数组中。\n\n# 问题 9 – 层次化导入呢？\n\n以下两个场景将回答这个问题：\n\n![](img/Image55773.jpg)\n\n**图 24.17**\n\
  \n在这个场景中，除非 Module3 显式导入 Module1，否则 Module3 无法访问 Module1 的成员。\n\n![](img/Image55817.jpg)\n\
  \n**图 24.18**\n\n在这个场景中，Module2 重新导出了 Module1 的成员。因此，Module3 也将能够访问 Module1 的组件。\n\
  \n# 如果 Module1 导出了很多成员，而 Module2 想要重新导出所有这些成员怎么办？\n\n答案是，在这种情况下，我们可以直接导出模块，而不是导出成员。\n\
  \n![](img/Image55876.jpg)\n\n**图 24.19**\n\n这意味着，除了 Module2PublicComponent 之外，Module1\
  \ 中导出的每个其他成员也会被 Module2 重新导出。\n\n你之前已经体验过一次了。\n\n*   `BrowserModule` 内部导入了 `CommonModule`。\n\
  *   `CommonModule` 包含 `*ngFor`、`*ngIf` 和其他常用的指令。\n*   `BrowserModule` 重新导出了整个 `CommonModule`。\n\
  *   因此，每个导入 `BrowserModule` 的模块也能访问 Common Module 暴露的指令。\n\n# Angular 模块与服务\n\n\
  我们看到了 Angular 模块在组件中的作用。接下来，轮到服务了。\n\n让我们做一些复习。\n\n在关于服务的章节中，我们讨论了 Angular 注入器：\n\
  \n*   作为应用程序开发者，我们从不创建注入器。Angular 为我们创建它们。我们只通过 provider 配置它。\n*   注入器使用该 provider\
  \ 创建服务的实例。\n*   Angular 创建两种注入器——元素注入器和模块注入器。\n*   Angular 为每个组件创建一个元素注入器，并维护一个类似于应用程序组件树的树形层次结构。在该树中，根组件注入器位于顶部。\n\
  *   当 Angular 应用程序中需要依赖时，第一个请求将发送到关联组件的元素注入器。如果无法解析，它将转发到父组件的元素注入器，依此类推，直到依赖被解析。\n\
  *   如果所有根元素注入器都无法创建实例，它将转发到模块注入器。\n\n![](img/Image55912.jpg)\n\n**图 24.20**\n\n\
  到目前为止，在本书中，我们详细讨论了元素注入器，但谈到模块注入器时，我们只讨论了根注入器。现在是时候讨论*子模块注入器*了。\n\n# 子模块注入器\n\n当应用程序启动时，Angular\
  \ 会创建一个*模块注入器*，称为*根注入器*。\n\n之后，当其他 Angular 模块被懒加载时，会创建子模块注入器，从而创建一个新的树形层次结构。\n\n\
  让我们回答一些关于 Angular 模块与服务相关的问题。为此，我们需要一个演示应用程序。所以让我们先创建一个。\n\n# 实验 9 – 层次化模块注入器\n\n\
  **步骤 1 – 创建一个项目**\n\n\n\n\n\n使用 `ng new` 命令创建一个新项目。\n\n当提示是否配置路由时，选择 `Yes`。\n\n\
  ![](img/Image55950.jpg)\n\n**图 24.21**\n\n## 第 2 步 – 创建更多模块\n\n按如下方式创建六个模块：\n\n\
  ![](img/Image55988.jpg)\n\n**图 24.22**\n\n## 第 3 步 – 创建组件\n\n创建 `CustomerComponent`\
  \ 并将其包含到 `CustomerModule` 中，如下所示：\n\n![](img/Image56001.jpg)\n\n**图 24.23**\n\n\
  “`ng g c Customer`” – 我们在上一个演示中已经看到过它的实际应用。\n\n这次略有不同。你注意到那个特殊的 `-m` 标志了吗？它的值是 `customer`。这意味着将新创建的组件添加到\
  \ `CustomerModule` 中。\n\n同样地，在相应的模块中创建 `Product`、`Checkout` 和 `CheckinComponent`。\n\
  \n## 讨论 – 续\n\n在实际项目中，为了保持根模块的整洁，通常会为路由创建一个单独的模块，然后将该模块导入到根模块中。\n\n当你创建了一个配置了路由的\
  \ Angular 项目时，你会发现生成了一个名为 `app-routing.module.ts` 的文件。其内容如下：\n\n```\nimport {NgModule}\
  \ from ‘@angular/core’;\nimport {RouterModule, Routes} from ‘@angular/router’;\n\
  \nconst routes: Routes = [];\n\n@NgModule({\n   imports: [RouterModule.forRoot(routes)],\n\
  \   exports: [RouterModule],\n})\nexport class AppRoutingModule {}\n```\n\n如果你查看\
  \ `AppModule`，你会在 `imports` 部分找到 `AppRoutingModule`。\n\n当 `AppModule` 导入 `AppRoutingModule`\
  \ 时，发生了以下两件重要的事情：\n\n1.  `AppRoutingModule` 导出的所有内容在 `AppModule` 中变为可见。\n\n    在当前情况下，导出的是\
  \ `RouterModule` – 这使得 `RouterModule` 导出的所有内容对 `AppModule` 的组件可见。例如，`router-outlet`\
  \ 等组件和 `routerLink` 等指令可以在 `AppComponent` 模板中使用。\n\n2.  `AppRoutingModule` 中定义的服务提供者将与\
  \ `AppModule` 中的服务提供者合并。\n\n    你在 `AppRoutingModule` 中看到任何服务提供者了吗？\n\n    没有，但这并不意味着\
  \ `AppRoutingModule` 的服务提供者为空。\n\n    `AppRoutingModule` 导入了 `RouterModule`。因此，`RouterModule`\
  \ 中定义的服务提供者会与 `AppRoutingModule` 的服务提供者合并。`RouterModule` 中定义的一个服务提供者是 `RouterService`，我们在\
  \ *第 11 章* 身份验证章节中已经看到过它的实际应用。\n\n    所以最终，我们为 `RouterService` 注册了根注入器。\n\n请在阅读完本章后重新阅读此讨论。\n\
  \n## 实验 – 续\n\n## 第 4 步 – 配置根路由\n\n在 `app-routing.module.ts` 中重新定义 routes 变量，如下所示：\n\
  \n```\nconst routes: Routes = [\n   {\n     path: ‘master’,\n     loadChildren:\
  \ () =>\n       import(‘src/app/master/master.module’).then((x) => x.MasterModule),\n\
  \  },\n   {\n     path: ‘transaction’,\n     loadChildren: () =>\n       import(‘src/app/transaction/transaction.module’).then((x)\
  \ => x.TransactionModule),\n  },\n];\n```\n\n这意味着我们将懒加载 `MasterModule` 和 `TransactionModule`。\n\
  \n这意味着将为它们创建新的子模块注入器，并且这些注入器将成为根注入器的子级。\n\n## 第 5 步 – 配置第二级路由\n\n接下来，在 `MasterModule`\
  \ 和 `TransactionModule` 中配置子路由，如下所示：\n\n```\nconst routes: Routes = [\n   {\n  \
  \   path: ‘customer’,\n     loadChildren: () =>\n       import(‘src/app/customer/customer.module’).then((x)\
  \ => x.CustomerModule),\n  },\n   {\n     path: ‘product’,\n     loadChildren: ()\
  \ =>\n       import(‘src/app/product/product.module’).then((x) => x.ProductModule),\n\
  \  }\n];\n@NgModule({\n   declarations: [],\n   imports: [CommonModule, RouterModule.forChild(routes)],\n\
  })\nexport class MasterModule {}\n```\n\n这意味着我们将懒加载 `CustomerModule` 和 `ProductModule`。\n\
  \n这意味着将为它们创建新的子模块注入器，并且这些注入器将成为主模块注入器的子级。\n\n```\nimport {CommonModule} from ‘@angular/common’;\n\
  import {NgModule} from ‘@angular/core’;\nimport {RouterModule, Routes} from ‘@angular/router’;\n\
  \nconst routes: Routes = [\n   {\n     path: ‘checkin’,\n     loadChildren: () =>\n\
  \       import(‘src/app/checkin/checkin.module’).then((x) => x.CheckinModule),\n\
  \  },\n   {\n     path: ‘checkout’,\n     loadChildren: () =>\n       import(‘src/app/checkout/checkout.module’).then((x)\
  \ => x.CheckoutModule),\n  }\n];\n@NgModule({\n   declarations: [],\n   imports:\
  \ [CommonModule, RouterModule.forChild(routes)],\n})\nexport class TransactionModule\
  \ {}\n```\n\n这意味着我们将懒加载 `CheckinModule` 和 `CheckoutModule`。\n\n这意味着将为它们创建新的子模块注入器，并且这些注入器将成为事务模块注入器的子级。\n\
  \n## 第 5 步 – 配置第三级路由\n\n最后，定义访问所有四个模块中组件的路由，如下所示：\n\n```\nimport {CommonModule}\
  \ from ‘@angular/common’;\nimport {NgModule} from ‘@angular/core’;\nimport {RouterModule,\
  \ Routes} from ‘@angular/router’;\nimport {CustomerComponent} from ‘./customer.component’;\n\
  \nconst routes: Routes = [\n   {\n     path: ‘’,\n     component: CustomerComponent,\n\
  \  }\n]\n@NgModule({\n   declarations: [CustomerComponent],\n   imports: [CommonModule,\
  \ RouterModule.forChild(routes)],\n})\nexport class CustomerModule {}\n```\n\n```\n\
  import {CommonModule} from ‘@angular/common’;\nimport {NgModule} from ‘@angular/core’;\n\
  import {RouterModule, Routes} from ‘@angular/router’;\nimport {CheckoutComponent}\
  \ from ‘../checkout/checkout.component’;\n\nconst routes: Routes = [\n   {\n   \
  \  path: ‘’,\n     component: CheckoutComponent\n  }\n];\n@NgModule({\n   declarations:\
  \ [CheckoutComponent],\n   imports: [\n     CommonModule, RouterModule.forChild(routes)\n\
  \  ]\n})\nexport class CheckoutModule {}\n```\n\n```\nimport {CommonModule} from\
  \ ‘@angular/common’;\nimport {NgModule} from ‘@angular/core’;\nimport {RouterModule,\
  \ Routes} from ‘@angular/router’;\nimport {CheckinComponent} from ‘../checkin/checkin.component’;\n\
  \nconst routes: Routes = [\n   {\n     path: ‘’,\n     component: CheckinComponent\n\
  \  }\n];\n\n@NgModule({\n   declarations: [CheckinComponent],\n   imports: [\n \
  \    CommonModule, RouterModule.forChild(routes)\n  ]\n})\nexport class CheckinModule\
  \ {}\n```\n\n```\nimport {CommonModule} from ‘@angular/common’;\nimport {NgModule}\
  \ from ‘@angular/core’;\nimport {RouterModule, Routes} from ‘@angular/router’;\n\
  import {ProductComponent} from ‘../product/product.component’;\n\nconst routes:\
  \ Routes = [\n   {\n     path: ‘’,\n     component: ProductComponent\n  }\n];\n\n\
  @NgModule({\n   declarations: [ProductComponent],\n   imports: [\n     CommonModule,\
  \ RouterModule.forChild(routes)\n  ]\n})\nexport class ProductModule {}\n```\n\n\
  **请注意：** 在实际项目中，懒加载需要实际实现。不要试图将所有内容都懒加载。将内容分组后再进行懒加载。我们在 *第 23 章* 路由章节中已经讨论过这一点。\n\
  \n\n\n\n例如，也许对 `Master` 和 `TransactionModule` 进行懒加载是合理的。但如果其他模块直接在这两个模块中导入，可能才是最佳做法——简而言之，就是立即加载。\n\
  \n（目前先别担心这个。专注于练习所有内容。）\n\n## 第 6 步 – 设计 AppComponent\n\n最后，我们需要一个地方来检查输出，为此，打开\
  \ `AppComponent` 并添加以下内容：\n\n1.  `<a routerLink=”/master/customer”>Customer </a>`\n\
  2.  `<a routerLink=”/master/product”>product </a>`\n3.  `<a routerLink=”/transaction/checkout”>checkout\
  \ </a>`\n4.  `<a routerLink=”/transaction/checkin”>checkin </a>`\n6.  `<router-outlet></router-outlet>`\n\
  \n## 第 7 步 – 检查输出\n\n确保你得到了预期的输出。\n\n![](img/Image56164.jpg)\n\n**图 24.24**\n\n\
  ### 我们得到了什么？\n\n我们有一个应用程序，其中模块注入器的层级结构如下：\n\n![](img/Image56172.jpg)\n\n**图 24.25**\n\
  \n# 问题 1 – 拥有注入器层级结构的真正目的是什么？\n\n*   当 Angular 应用程序中需要某个依赖时，第一个请求会发送到关联组件的元素注入器。如果无法解析，则会转发到父组件的元素注入器，依此类推，直到依赖被解析。\n\
  *   最后，如果*根元素注入器*也无法解析该依赖，则会转发到关联模块的模块注入器。如果仍然无法解析，则会转发到父模块注入器，依此类推，直到依赖被解析。最终，如果根模块注入器也无法解析该实例，Angular\
  \ 将抛出“no provider…”错误。\n\n让我们试一试。\n\n创建一个服务，并在 `CusomerComponent` 中使用它。\n\n要创建服务，可以使用以下命令：\n\
  \n![](img/Image56249.jpg)\n\n**图 24.26**\n\n它将创建如下服务：\n\n```\n@Injectable({\n  \
  \ providedIn: ‘root’\n})\nexport class MyTestService {\n   constructor() {}\n}\n\
  ```\n\n移除根中的 provider，因为我们打算用 `NgModule` 进行演示。\n\n然后进行以下尝试：\n\n1.  运行应用程序，你应该会收到“no\
  \ provider…”错误。\n2.  然后，将 provider 放入 `CustomerModule`，如下所示：\n\n    ```\n    @NgModule({\n\
  \       declarations: [CustomerComponent],\n       imports: [CommonModule, RouterModule.forChild(routes)],\n\
  \       providers:[MyTestService]\n    })\n    export class CustomerModule {}\n\
  \    ```\n\n    检查输出。它应该能正常工作。\n3.  然后，从 `CustomerModule` 中移除 provider，并将其放入 `MasterModule`。它应该能正常工作。\n\
  4.  然后，从 `MasterModule` 中移除 provider，并将其放入 `AppModule`。它应该能正常工作。\n5.  现在，不在 `CustomerComponent`\
  \ 中使用该服务，而是在 `CheckInComponent` 中使用它。这次也应该能正常工作，因为 `AppModule` 是所有模块的根。\n6.  现在，从\
  \ `AppModule` 中移除 provider，将 provider 放入 `MasterModule`，并继续在 `CheckInComponent`\
  \ 中使用该服务。它应该再次报错“no provider…error”。\n7.  现在，将 provider 同时放入 `CustomerModule` 和\
  \ `ProductModule`。（从其他所有地方移除。）在 `Customer` 和 `ProductComponent` 中都使用该服务。它将正常工作。\n\
  8.  现在，继续在 `Customer` 和 `ProductComponent` 中使用该服务，但**仅**将 provider 放入 `MasterModule`。它将正常工作。\n\
  \n请随意尝试更多组合。将每个结果记录下来，以便正确分析。\n\n第 7 次和第 8 次尝试的区别在于服务实例的数量：\n\n*   在第 7 次尝试中，创建了两个服务实例。\n\
  \n    为了确认这一点，在服务的 `constructor` 中设置一个断点。你会看到断点被命中两次。\n*   而在第 8 次尝试中，只创建了一个实例。位于层级结构中较高位置的注入器可以创建实例并注入到其下的所有组件中。因此，同一个实例在两个组件之间共享。这次断点只会被命中一次。\n\
  \n由根模块注入器创建的服务实例在整个应用程序中将是单例的。\n\n第二级模块注入器创建的实例将在该模块的所有组件及其子组件中作为单例存在。\n\n所以这个问题的答案是：它可以帮助我们控制\
  \ provider 的作用域。\n\n# 问题 2 – 如果模块注入器在多个层级配置了相同的 provider，会发生什么？\n\n让我简化这个问题。\n\n\
  假设在当前示例项目中，你在 `AppModule` 和 `CustomerModule` 中都为 `MyTestService` 配置了 provider。这种情况下会发生什么？\n\
  \n在这种情况下，会创建一个 `MyTestService` 实例，并且该实例在整个应用程序中可用。除了 `CustomerComponent` 之外，其他任何需要的地方都会注入同一个实例。对于\
  \ `CustomerModule`，会再创建一个独立的实例，并注入到 `CustomerComponent` 中。\n\n这类似于面向对象编程中的覆盖概念。所有组件都获得同一个实例（因为它是根），但\
  \ customer 组件获得自己的实例。\n\n（请务必亲自尝试一下。）\n\n# 问题 3 – 当我们在一个模块中导入另一个模块时，会创建层级结构吗？\n\n\
  请注意，导入模块并不会创建任何层级结构。\n\nAngular 不会为导入的模块创建单独的模块注入器。\n\n子注入器只会在模块被懒加载时创建。\n\n# 问题\
  \ 4 – 在这种情况下，被导入模块的 provider 会怎样？\n\n我们在本章中已经讨论过这一点——provider 会被合并到父模块的 provider\
  \ 中。\n\n例如，`AppModule` 导入的所有模块的 provider 都会被合并到 `AppModule` 的 provider 中。\n\n请自行尝试以下演示：\n\
  \n*   再创建一个 Angular 模块。命名为 `ServiceModule`。\n*   然后，在该 `ServiceModule` 中，为 `MyTestService`\
  \ 定义 provider。\n*   确保应用程序中其他任何地方都没有 provider。\n\n现在，再次尝试问题 1 和问题 2 中的尝试，但这次不直接指定\
  \ provider，而是导入 `ServiceModule`，然后进行测试。\n\n你会看到相同的输出，因为 provider 被合并了。\n\n# 问题 5\
  \ – 使用 NgModule 装饰器进行配置与使用 Injectable 装饰器有何不同？\n\n当使用 `Injectable` 装饰器进行配置时，我们可以获得摇树优化的优势，这确保了如果服务在应用程序中任何地方都没有被使用，它将被从最终打包文件中移除，从而减少整体打包文件大小。\n\
  \n# 问题 6 – 是否可以使用 Injectable 装饰器配置其他子模块注入器？\n\n我们在之前的实验中已经看到了 `Injectable` 装饰器的演示，当时我们使用\
  \ `providedIn` root 方法配置了根注入器。\n\n同样的 `Injectable` 装饰器也可以用于配置子模块注入器。请查看以下代码：\n\n\
  ```\n@Injectable({\n   providedIn: TransactionModule\n})\nexport class MyTestService\
  \ {\n}\n```\n\n上述代码配置了与 `TransactionModule` 关联的模块注入器。这次，服务实例只会被创建，并且在 `TransactionModule`\
  \ 中作为单例存在。\n\n其他任何模块都无法访问它。\n\n我建议你用这种方法尝试问题 1 和问题 2 中的所有八次尝试。\n\n# 问题 7 – 如果某个特定需求可以通过两种方法（即\
  \ NgModule 装饰器和 Injectable 装饰器）实现，那么在这种情况下，推荐使用哪种方法？\n\n答案是 `Injectable` 装饰器，因为它支持摇树优化。\n\
  \n# 问题 8 – 既然如此，配置 NgModule 装饰器似乎毫无用处；为什么我们还要保留它？\n\n\n\n\n这是由于以下两个原因：\n\n1.  可注入装饰器不允许我们显式指定\
  \ `DI token`。当有这种需求时，我们必须使用 `NgModule` 装饰器。请回想本书中的 *第 17 章：令牌拦截器* 和 *第 21 章：错误处理器*。\n\
  \n2.  假设你正在创建一个 Angular 库，供其他人下载和使用。\n\n    假设该库包含一个名为 `NotificationService` 的服务，其他人将使用它。`NotificationService`\
  \ 依赖于 `EmailService`，而 `EmailService` 又依赖于 `ConfigService`。\n\n    在这种情况下，想要使用 `NotificationService`\
  \ 的人必须下载该库，然后为 `NotificationService`、`EmailService` 和 `ConfigService` 配置注入器。\n\n\
  \    对于开发者来说，了解所有依赖项是相当具有挑战性的，尤其是在涉及第三方库时。\n\n    试想一下，当服务的依赖层级更加复杂时。\n\n    更好的做法是：创建服务的开发者同时创建一个\
  \ Angular 模块，并为所有三个服务配置提供者。\n\n    想要使用该服务的人只需在自己的模块中导入该模块即可。\n\n    你还记得 `HTTPClientModule`\
  \ 吗？我们在模块中导入了它，这使得根模块为 `HTTPService` 和所有其他依赖服务完成了配置。\n\n这两个用例无法通过 `Injectable` 装饰器覆盖。\n\
  \n如果你需要一个模块注入器，我的建议是：尽可能使用 `Injectable` 装饰器。\n\n如果你是库开发者，或者想要指定一个 DI Token，那么请显式使用\
  \ `NgModule` 装饰器。\n\n#### 总结\n\n至此，*第 24 章* 结束，我们来到了第 13 站。在你能自称 Angular 开发者之前，还有\
  \ 7 站需要学习。让我们回顾一下本章涵盖的主题：\n\n*   我们学习了如何使用 Angular CLI 创建组件和模块。\n\n*   我们学习了 Angular\
  \ 模块如何使组件开发更加容易。我们将相关组件分组到模块中，然后只导出其中一部分作为公共组件。我们了解到，Angular 模块中未导出的组件对该模块来说是私有的。\n\
  \n*   我们学习了 Angular 模块也对指令和管道进行分组，除非显式导出，否则它们对该模块是私有的。\n\n*   我们学习了 `ServiceModules`，它们是专门用于为服务和依赖服务配置注入器的\
  \ Angular 模块。`HttpClientModule` 就是这样一个 `ServiceModule` 的例子。\n\n*   我们在上一章已经讨论了 Angular\
  \ 模块的第三个优势——惰性加载。\n\n*   我们了解到，即使是 Angular 模块的私有组件也可以通过路由访问。\n\n*   我们学习了 `BrowserModule`\
  \ 导入 `CommonModule` 并重新导出它。因此，`CommonModule` 导出的指令在 `AppModule` 内部是可见的。\n\n*   我们学习了\
  \ Angular 构建过程中的树摇机制确保所有未使用的组件从最终构建中移除，除非它们通过路由被引用。如果某个组件未在任何其他组件的模板中使用，它将被视为未使用。\n\
  \n*   我们学习了当模块被惰性加载时，Angular 会创建一个子模块注入器。\n\n## 第 25 章\n\n## Angular 管道\n\n## 引言\n\
  \n好吧，在前往第 14 站的旅程中，我们将学习 Angular 管道。\n\n到目前为止，你已经看到了两个内置管道的实际应用——`async` 和 `JSON`。\n\
  \n## 什么是管道？\n\n在 Angular 中，我们使用管道来转换数据。\n\n假设我们有一些数据在显示之前需要转换。这时你就需要 Angular 管道。每当你觉得数据需要转换后再显示在项目中时，就为此创建一个管道。\n\
  \n以下是常用的用于数据格式化的内置管道：\n\n*   `DatePipe`：根据区域规则格式化日期值。\n\n*   `UpperCasePipe`：将文本转换为全大写。\n\
  \n*   `LowerCasePipe`：将文本转换为全小写。\n\n*   `CurrencyPipe`：将数字转换为货币字符串，根据区域规则格式化。\n\n\
  *   `DecimalPipe`：将数字转换为带小数点的字符串，根据区域规则格式化。\n\n*   `PercentPipe`：将数字转换为百分比字符串，根据区域规则格式化。\n\
  \n你已经知道使用管道的语法。\n\n我强烈建议你自己用前面列出的几个管道快速做一个演示——在视图类中声明一个变量并在视图中显示它。\n\n1.  `Name=\
  \ “Sukesh Marla”;`\n\n2.  `…`\n\n3.  `{{Name | uppercase}}`\n\n如果我们创建一个自定义管道，那会很有趣。那么，让我们开始吧。\n\
  \n## 实验 10 – 自定义管道实战 – 演示 1\n\n在这个演示中，我们将创建一个自定义管道，将字节转换为 KB、MB、GB……\n\n**步骤 1 –\
  \ 创建项目**\n\n使用 Angular CLI 创建一个新的 Angular 项目。\n\n1.  `ng new lab10-ng`\n\n**步骤 2\
  \ – 修改 AppComponent**\n\n在视图类中声明一个带有初始值的数值属性，并使用插值在模板中显示它。\n\n```\nexport class\
  \ AppComponent {\n   SomeValue: number = 2456;\n}\n{{SomeValue}}\n```\n\n**步骤 3\
  \ – 检查输出**\n\n使用 `ng serve` 命令执行应用程序，确保一切正常。\n\n![](img/Image56345.jpg)\n\n**图 25.1**\n\
  \n**步骤 4 – 创建管道**\n\n使用以下命令创建新管道：\n\n![](img/Image56352.jpg)\n\n**图 25.2**\n\n这将生成一个新文件\
  \ `file-size.pipe.ts`，内容如下：\n\n```\nimport {Pipe, PipeTransform} from ‘@angular/core’;\n\
  \n@Pipe({\n   name: ‘fileSize’\n})\nexport class FileSizePipe implements PipeTransform\
  \ {\n\n   transform(value: unknown, …args: unknown[]): unknown {\n     return null;\n\
  \   }\n}\n```\n\n## 讨论 – 续\n\n**让我们探索执行 CLI 命令后生成的代码。**\n\n该命令创建了一个新文件 `file-size.pipe.ts`，并在\
  \ `app.module.ts` 中做了一些更改。让我们探索两者。\n\n`file-size.pipe.ts`\n\n*   我们有一个 TypeScript\
  \ 类，名为 `FileSizePipe`。\n\n*   该类实现了一个接口 `PipeTransForm`——**创建管道的第一个步骤**。\n\n*  \
  \ 实现该接口迫使我们定义 `transform` 方法。（暂时忽略 `return null`。）\n\n*   该类使用了 `Pipe` 装饰器——**创建管道的第二个步骤**。\n\
  \n*   检查 `Pipe` 装饰器中的 `name` 属性。这就是我们稍后在模板中要使用的名称。\n\n`app.module.ts`\n\n最后，打开 AppModule，你会看到\
  \ `FileSizePipe` 被包含在 `NgModule` 装饰器的 `declarations` 部分。\n\n与组件类似，Angular 中的每个管道都被分组在一个\
  \ Angular 模块内。如果你在一个模块中创建了一个管道，并希望它在另一个模块中使用，那么第一个模块需要导出它。\n\n**CommonModule**\n\
  \n常用的 Angular 内置管道，如 `uppercase`、`async`、`json`，都是 `CommonModule` 的一部分。\n\n**自定义管道和\
  \ AppModule**\n\n在实际项目中，我们不会将自定义管道添加到 AppModule。我们会有一个单独的模块，在需要的地方导入它。这样的模块被称为 SharedModules。\n\
  \n**unknown 数据类型**\n\n我知道你内心的开发者正在为前面代码中的 `unknown` 数据类型而困扰。\n\nTypeScript 中有两种特别的数据类型用于动态编码——`any`\
  \ 和 `unknown`。\n\n它们之间的相似之处如下：\n\n任何值都可以赋值给它们两者。\n\n\n\n```\nlet a: any = 100; \
  \     // 我们可以将任何值赋给 any\n\nlet b: unknown =  1000; // 我们可以像 any 一样将任何值赋给 unknown\n\
  ```\n\n它们之间的区别如下：\n\n`any` 可以赋值给任何类型。`unknown` 不能赋值给任何类型。\n\n`let s1: string = a;`\
  \     // any 可以赋值给任何类型\n\n`let s2: string = b;` // 无效，我们不能将 `b` 赋值给任何其他类型（除非显式断言）\n\
  \n## 实验 – 继续\n\n**第 5 步 – 修改管道逻辑**\n\n按如下方式修改 transform 方法：\n\n```\ntransform(value:\
  \ number, …args: number []): string {\n     return ‘Just Compile’;\n}\n```\n\n你是否注意到我们将\
  \ `unknown` 改为了其他数据类型？始终指定确切的数据类型是最佳实践。\n\n**第 6 步 – 应用管道**\n\n打开 `AppComponent`\
  \ 模板，并按如下方式应用管道：\n\n```\n{{SomeValue |fileSize}}\n```\n\n**第 7 步 – 检查输出**\n\n执行应用程序，你应该会得到以下输出：\n\
  \n![](img/Image56437.jpg)\n\n**图 25.3**\n\n无论 `SomeValue` 变量的值是什么，你都会得到上述输出，因为 transform\
  \ 方法没有返回任何动态内容。\n\n**第 8 步 – 修改管道逻辑**\n\n现在是时候将真正的逻辑放入管道中了——修改 transform 方法。\n\n\
  ```\ntransform(value: number, …args: number[]): string {\n     let data = ‘’;\n\
  \     if (value > (1024 * 1024 * 1024)) {\n         data = (value / 1024 / 1024\
  \ / 1024).toFixed(2) + ‘ GB’;\n    } else if (value > (1024 * 1024)) {\n       \
  \  data = (value / 1024 / 1024).toFixed(2) + ‘ MB’;\n    } else if (value > 1024)\
  \ {\n         data = (value / 1024).toFixed(2) + ‘ KB’;\n    } else {\n        \
  \ data = value + ‘ B’;\n    }\n     return data;\n}\n```\n\n这一次，我们返回的是动态值，而不是固定值。\n\
  \n**第 9 步 – 检查输出**\n\n执行应用程序。\n\n多做几次测试。将值改为更大的数值并检查输出。\n\n![](img/Image56444.jpg)\n\
  \n**图 25.4**\n\n## 实验 11 – 自定义管道实战 – 演示 2\n\n这次我们将创建一个管道，通过将数据与其他值拼接来转换数据。\n\n**第\
  \ 10 步 – 为演示更新 AppComponent**\n\n在 AppComponent 中创建三个 string 类型的属性，并在模板中按如下方式显示它们：\n\
  \n```\nexport class AppComponent {\n   SomeValue: number = 2456;\n   FirstName:\
  \ string= “Sukesh”;\n   MiddleName: string= “Nagesh”;\n   LastName: string= “Marla”;\n\
  }\n```\n\n```\n{{SomeValue |fileSize}}<br>\nFull name :{{FirstName}} - {{MiddleName}}\
  \ - {{LastName}}\n```\n\n**第 11 步 – 检查输出**\n\n![](img/Image56522.jpg)\n\n**图 25.5**\n\
  \n你可以看到三个值被拼接并显示在 UI 中。目前，转换逻辑或拼接逻辑是作为模板的一部分编写的。这是一种不好的做法。对于这种情况，我们需要一个管道。\n\n**第\
  \ 12 步 – 创建管道**\n\n按如下方式创建 concat 管道：\n\n![](img/Image56595.jpg)\n\n**图 25.6**\n\
  \n**第 13 步 – 实现 transform 逻辑**\n\n如你所知，transform 方法中的第一个参数代表管道所附加的数据。\n\n我们当前的需求需要多个值，这就是第二个参数发挥作用的地方。\n\
  \n按如下方式重新定义 transform 方法：\n\n```\nexport class ConcatPipe implements PipeTransform\
  \ {\n   transform(value: string, …args: string[]): string {\n     args.forEach((x)\
  \ => {\n       value = value + ‘-’ + x;\n    });\n     return value;\n  }\n}\n```\n\
  \n**第 14 步 – 应用管道**\n\n将 `AppComponent` 模板修改为以下内容：\n\n```\n……\nFull name :{{FirstName\
  \ |concat: MiddleName: LastName  }}\n```\n\n如你所见，我们将 concat 管道应用于 `FirstName`，然后将\
  \ `MiddleName` 和 `LastName` 作为参数传递。\n\n**第 15 步 – 检查输出**\n\n你将得到相同的输出，但这次拼接逻辑（转换逻辑）是写在管道内部的。\n\
  \n## 我的经验\n\n几乎在我做的每一个咨询项目中，我都会发现一个常见问题。大多数情况下，转换逻辑要么写在组件类中，要么写在模板中。有时，我甚至发现转换逻辑作为服务的一部分编写。这是一种不好的做法。对于任何转换逻辑，请使用管道。\n\
  \n## 非纯管道\n\n关于管道，我们还没有讲完。到目前为止，我们看到的都是纯管道。还有另一种管道——非纯管道。接下来让我们理解它。\n\n*在 Angular\
  \ 中，变更检测是在数据发生变化时更新 DOM 的过程。我们将在接下来的章节中详细讨论它。当 DOM 事件（如点击、聚焦等）发生时，或者当 HTTP 请求完成时，甚至在某些\
  \ API（如 `setTimeout` 和 `setInterval`）执行完成后，变更检测就会执行。*\n\n如果谈到管道，那么管道只会在它所附加的值发生变化时执行**。它不会在每次变更检测时都运行。**\n\
  \n让我们讨论一个场景——我们有数据，并且希望根据本地存储中的某些数据来转换这些数据。假设 UI 中有一个按钮，它会改变本地存储的值。按钮点击后，变更检测会执行，但由于管道所附加的值没有改变，我们的管道不会重新执行。因此，我们不会得到期望的输出。\n\
  \n如果前面这段话不太准确，别担心。让我们通过演示来理解它。\n\n## 实验 12 – 理解非纯管道\n\n**第 16 步 – 创建管道**\n\n使用 CLI\
  \ 创建一个名为 ImpureTest 的新管道。\n\n![](img/Image56606.jpg)\n\n**图 25.7**\n\n**第 17 步 –\
  \ 重新定义 transform**\n\n按如下方式重新定义 transform 方法：\n\n```\ntransform(value: number, …args:\
  \ number[]): number {\n     if (localStorage.myValue) {\n       return value + parseInt(localStorage.myValue);\n\
  \    } else {\n       return value;\n    }\n  }\n```\n\n**第 18 步 – 设置 AppComponent**\n\
  \n首先，在 `AppComponent` 类中声明一个简单的变量，如下所示：\n\n```\nCounter: number = 20;\n```\n\n接下来，在模板中显示该变量，并附加\
  \ `impureTest` 管道，如下所示：\n\n```\nCounter: {{Counter | impureTest}}\n```\n\n然后，在模板中创建一个按钮，如下所示：\n\
  \n```\n<input type=”button” value=”Click Me” (click)=”HandleClick()”>\n```\n\n最后，按如下方式定义\
  \ `HandleClick` 方法：\n\n```\n   HandleClick() {\n     if (!localStorage.myValue)\
  \ {\n       localStorage.myValue = 1;\n    } else {\n       localStorage.myValue\
  \ = parseInt(localStorage.myValue) + 1;\n    }\n  }\n```\n\n请注意，每次点击按钮时，我们都会将本地存储的值增加\
  \ 1，但我们并没有改变变量 `counter` 的值。\n\n**第 19 步 – 检查输出**\n\n执行应用程序。最初，你会看到基于当前本地存储值的结果。\n\
  \n之后，无论你点击按钮多少次，本地存储的值都会改变，但 UI 永远不会改变。\n\n## 讨论 – 继续\n\n不要以为变更检测没有执行。它确实执行了。\n\n\
  问题在于管道没有执行，因为 `counter` 变量的值没有改变。\n\n这是因为它是一个纯管道。\n\n如果你希望管道在每次变更检测时都执行，你必须将其设置为\
  \ `impure`（非纯）。\n\n## 实验 – 继续\n\n**第 20 步 – 将管道设为非纯**\n\n按如下方式将纯管道转换为非纯管道：\n\n```\n\
  @Pipe({\n   name: ‘impureTest’,\n   pure:false\n})\nexport class ImpureTestPipe\
  \ implements PipeTransform {\n```\n\n**第 21 步 – 检查输出**\n\n现在，检查输出。它将正常工作。\n\n以上就是关于管道的全部内容。\n\
  \n\n\n\n\n#### 总结\n\n通过本章，我们离完成旅程又近了一站。第 15 站——自定义指令之旅将在下一章等待你。\n\n让我们回顾一下本章内容：\n\
  \n*   在本章中，我们学习了管道，它帮助我们封装应用程序中的转换逻辑。\n*   我们了解到，创建管道需要创建一个类，实现`PipeTransform`接口，然后附加`Pipe`装饰器。\n\
  *   我们了解到，管道也像组件一样被封装在 Angular 模块中。\n*   我们了解到，Angular 应用程序中常用的管道（如`json`、`async`、`uppercase`等）定义在`CommonModule`中。\n\
  *   我们了解到，自定义 Angular 模块（通常称为`SharedModule`）用于封装所有自定义管道，其他模块在实际项目中会导入这些模块。\n*  \
  \ 我们讨论了 TypeScript 中两种数据类型——`any`和`unknown`的区别。我们了解到，`any`类型的变量可以赋值给其他类型，而`unknown`类型的变量只能赋值给`unknown`类型的变量。\n\
  *   我们演示了 TypeScript 的 REST 参数。\n*   我们了解到，纯管道仅在开始时以及输入值发生变化时执行。\n*   我们了解到，非纯管道在每次变更检测后都会执行。\n\
  \n## 第 26 章\n\n## Angular 指令\n\n## 引言\n\n在前往第 15 站的旅程中，我们将再次讨论 Angular 指令。\n\n到目前为止，我们已经探索了\
  \ Angular 中许多内置指令。现在是时候创建一些我们自己的指令了。\n\n## 什么是指令？\n\n在 Angular 世界中，指令是一种扩展 HTML\
  \ 的方式。\n\n在 Angular 中，我们会发现以下三种指令之一：\n\n1.  元素指令\n2.  属性指令\n3.  结构型指令\n\n**元素指令**在\
  \ Angular 中也称为组件。你已经看到许多演示，我们创建了一个 Angular 组件，从而创建了一个自定义 DOM 元素。\n\n![](img/Image56697.jpg)\n\
  \n**图 26.1**\n\n**属性指令**用于增强任何 DOM 元素的现有行为。`NgClass`和`NgStyle`就是最好的例子。\n\n**结构型指令**用于当我们想要塑造或重塑现有\
  \ DOM 元素的结构时，通常通过添加、操作或移除元素来实现。`NgFor`和`NgIf`就是最好的例子。\n\n让我们对自定义属性指令和结构型指令都做一个演示。\n\
  \n## 实验 11 – 鼠标悬停指令\n\n在本实验中，我们将创建一个自定义指令，该指令将添加在鼠标悬停时更改元素背景颜色的能力。\n\n**步骤 1 – 创建一个新的\
  \ Angular 项目**\n\n按如下方式创建一个新的 Angular 项目：\n\n1.  `ng new lab11-ng`\n\n**步骤 2 – 创建一个新的指令**\n\
  \n按如下方式创建一个新的 Angular 指令：\n\n![](img/Image56747.jpg)\n\n**图 26.2**\n\n这将创建一个包含以下内容的\
  \ TypeScript 文件：\n\n```typescript\nimport {Directive} from '@angular/core';\n\n\
  @Directive({\n   selector: '[appMouseOver]'\n})\nexport class MouseOverDirective\
  \ {\n   constructor() {}\n}\n```\n\n## 讨论 – 继续\n\n上述代码非常直接。有一个用`Directive`装饰器装饰的类。你注意到`selector`中的方括号了吗？这非常重要。我们将在本演示之后进一步讨论。\n\
  \n## 实验 – 继续\n\n**步骤 3 – 添加测试代码**\n\n在指令的构造函数中编写一个简单的`console.log`语句，如下所示：\n\n```typescript\n\
  export class MouseOverDirective {\n   constructor() {\n     console.log('Hello world')\n\
  \  }\n}\n```\n\n**步骤 4 – 附加指令**\n\n打开`AppComponent`并创建一个 HTML 元素，然后按如下方式附加上述指令：\n\
  \n![](img/Image56788.jpg)\n\n**图 26.3**\n\n**步骤 5 – 执行应用程序**\n\n执行应用程序并检查输出。\n\n\
  ![](img/Image56826.jpg)\n\n**图 26.4**\n\n你能在控制台中找到两次“Hello world”吗？\n\n我们将指令应用于两个控件（一个应用于\
  \ span 元素，一个应用于 input 元素），因此创建了两个指令类实例，因此消息显示了两次。\n\n## 讨论 – 继续\n\n接下来，我们需要访问指令所附加的元素，为此，Angular\
  \ 提供了一个名为`ElementRef`的服务。`ElementRef`提供了对指令所附加的`nativeDOM element`的包装。\n\n一旦获得了元素引用，就可以使用另一个\
  \ Angular 服务`Renderer2`来操作它。\n\n## 实验 – 继续\n\n**步骤 6 – 在指令中访问和操作元素**\n\n将这两个服务注入到类中，然后按如下方式修改控件的背景颜色：\n\
  \n```typescript\nexport class MouseOverDirective {\n   constructor(el: ElementRef,\
  \ renderer: Renderer2) {\n     renderer.setStyle(el.nativeElement, 'background',\
  \ 'red');\n  }\n}\n```\n\n***注意：*** 尽管`ElementRef`允许直接操作相应的元素，但不推荐这样做。对于所有操作，建议使用`Renderer2`服务。\n\
  \n**步骤 7 – 检查输出**\n\n这次你将看到更新了颜色的控件。\n\n![](img/Image56863.jpg)\n\n**图 26.5**\n\n\
  ## 讨论 – 继续\n\n让我们理解下一步。\n\n目前，我们在指令中硬编码了颜色。在下一步中，让我们使其动态化，为此我们将使用`inputproperty`。\n\
  \n正如我之前所说，组件也是指令。因此，你会发现它们之间有很多相似的功能，例如输入和输出属性、生命周期事件等。\n\n## 实验 – 继续\n\n**步骤 8\
  \ – 创建一个输入属性**\n\n在指令中为颜色创建一个新的输入属性，并使用它代替硬编码的值。\n\n```typescript\nimport {Directive,\
  \ ElementRef, Input, Renderer2} from '@angular/core';\n\n@Directive({\n   selector:\
  \ '[appMouseOver]'\n})\nexport class MouseOverDirective {\n   @Input() color:string=\
  \ 'red';\n   constructor(el: ElementRef, renderer: Renderer2) {\n     renderer.setStyle(el.nativeElement,\
  \ 'background', this.color);\n  }\n}\n```\n\n**步骤 9 – 为输入属性赋值**\n\n接下来，在`app.component.html`文件中为上述输入属性赋值，如下所示：\n\
  \n```html\n<span appMouseOver color=\"blue\">My Span 1</span><br>\n<input type=\"\
  button\" value=\"I am button\" appMouseOver color=\"yellow\">\n```\n\n## 讨论 – 继续\n\
  \n组件的输入属性在模板中绑定到 DOM 属性。\n\n默认情况下，Angular 认为 DOM 属性名称和输入属性名称相同。\n\n这就是为什么`input`控件的\
  \ DOM 属性`color`映射到了`MouseOverDirective`中的输入属性`color`。\n\n## 实验 – 继续\n\n**步骤 10 –\
  \ 检查输出**\n\n这次你期望元素显示蓝色和黄色吗？如果是，那将会令人失望，因为两者仍然会显示为红色。\n\n## 讨论 – 继续\n\n想知道为什么吗？我们之前曾经提到过。\n\
  \n*构造函数在创建类的实例时执行。*\n\n对于组件和指令来说，`constructor`并不是编写初始化逻辑的理想位置。`constructor`在实例创建后立即执行。此时，输入属性尚未设置为从父组件传递的值。\n\
  \n`ngOnInit`是执行此类逻辑的理想位置。\n\n## 实验 – 继续\n\n**步骤 11 – 实现`ngOnInit`**\n\n接下来，在组件中定义`ngOnInit`方法，如下所示：\n\
  \n```typescript\nimport {Directive, ElementRef, Input, OnInit, Renderer2}\n```\n\
  \n\n\n\n\n```\nfrom '@angular/core';\n……\nexport class MouseOverDirective implements\
  \ OnInit {\n   @Input() color:string= 'red';\n   constructor(private el: ElementRef,\
  \ private renderer: Renderer2) {\n  }\n   ngOnInit(): void {\n     this.renderer.setStyle(this.el.nativeElement,\
  \ 'background', this.color);\n  }\n}\n```\n\n**第 12 步 – 运行应用程序。**\n\n这次你将看到带有新颜色的控件。\n\
  \n## 讨论 – 继续\n\n你对目前为输入属性赋值的方式满意吗？\n\n如果我们能实现类似下面的效果呢？\n\n1.  `<span mouse-over-color=”blue”>My\
  \ Span 1</span><br>`\n2.  `<input type=”button” value=”I am button”  mouse-over-color=”yellow”>`\n\
  \n看起来是不是更好？如果是，那么这就是我们接下来要做的。\n\n## 实验 – 继续\n\n**第 13 步 – 重新定义输入属性**\n\n首先，按如下方式向输入装饰器传递参数：\n\
  \n1.  `   @Input(‘mouse-over-color’) color:string= ‘red’;`\n\n执行上述代码后，我们需要将 `AppComponent`\
  \ 的代码修改为以下内容：\n\n1.  `<span appMouseOver mouse-over-color=”blue”>My Span 1</span><br>`\n\
  2.  `<input type=”button” value=”I am button” appMouseOver mouse-over-color=”yellow”>`\n\
  \n## 讨论 – 继续\n\n通过向 `Input` 装饰器传递参数，我们指示 Angular 进行不同的映射。\n\n现在，输入属性 `color` 被映射到\
  \ DOM 属性 `mouse-over-color`。我们使用参数化的 `Input` 装饰器，以不同的名称将指令的属性暴露给外部世界。\n\n## 实验 –\
  \ 继续\n\n**第 14 步 – 检查输出**\n\n重新检查你的更新。它必须与之前相同。\n\n**第 15 步 – 修改选择器**\n\n接下来，将指令选择器重新定义为\
  \ `mouse-over-color`，如下所示：\n\n```\n……\n@Directive({\nselector: '[mouse-over-color]'\
  \ // （确保不要漏掉方括号。）\n})\nexport class MouseOverDirective implements OnInit {\n   @Input('mouse-over-color')\
  \ color:string= 'red';\n……\n```\n\n## 讨论 – 继续\n\n你注意到我们的选择器和 `Input` 属性现在相同了吗？\n\
  \n如果注意到了，说明你关注到了所有细节；否则，你需要提高注意力。\U0001F60A\n\n## 实验 – 继续\n\n**第 16 步 – 修改 `AppComponent`**\n\
  \n接下来，将 `AppComponent` 的代码修改为以下内容：\n\n1.  `<span mouse-over-color=”blue”>My Span\
  \ 1</span><br>`\n2.  `<input type=”button” value=”I am button” mouse-over-color=”yellow”>`\n\
  \n**第 17 步 – 检查输出**\n\n重新检查你的更新。它必须与之前相同。\n\n## 讨论 – 继续\n\n接下来呢？输出看起来是否像我们之前的目标？我们不是期望在鼠标悬停时颜色发生变化吗？让我们来画上最后的句号。\n\
  \n在 Angular 中，我们可以使用名为 `HostListener` 的装饰器来处理宿主事件。\n\n这里，宿主指的是使用它的元素。\n\n对于指令而言，宿主就是指令所附加到的元素。\n\
  \n## 实验 – 继续\n\n**第 18 步 – 处理鼠标悬停和鼠标离开事件**\n\n在指令类中定义两个方法，并在它们上面附加 `HostListener`\
  \ 装饰器，如下所示：\n\n```\nngOnInit(): void {\n  }\n   @HostListener('mouseover')\n   OnMouseOver(){\n\
  \     this.renderer.setStyle(this.el.nativeElement, 'background', this.color);\n\
  \  }\n   @HostListener('mouseleave')\n   OnMouseLeave(){\n     this.renderer.setStyle(this.el.nativeElement,\
  \ 'background', '');\n  }\n```\n\n使用 `HostListener` 装饰器，我们可以监听指令宿主的事件。\n\n**第 19\
  \ 步 – 检查输出**\n\n这次你会发现，当光标移到该元素上时，颜色会发生变化。\n\n这是一个简单的演示，展示了如何创建自定义属性指令来增强现有 HTML\
  \ 元素的现有行为。这被称为**属性指令**。\n\n## 不同类型的指令选择器\n\n我知道你一直在等待关于我们在选择器中使用的那些方括号的答案。\n\n事实上，方括号只是指定选择器的一种方式——还有更多方式。\n\
  \n**属性选择器**\n\n在前面的例子中，我们为指令指定了选择器 `[mouse-over-color]`。\n\n这是一个属性选择器的例子——指令将附加到每个带有\
  \ `mouse-over-color` 属性的 DOM 元素上。\n\n**CSS 选择器**\n\n请看以下代码：\n\n```\n@Directive({\n\
  \   selector: '.abc'\n})\nexport class MouseOverDirective\n```\n\n这是 CSS 选择器。指令将附加到\
  \ DOM 中每个具有 CSS 类 `abc` 的元素上。例如，它将附加到以下元素：\n\n1.  `<input type=”button” value=”I\
  \ am button” class=”abc”>`\n\n**元素选择器**\n\n请看以下代码：\n\n```\n@Directive({\n   selector:\
  \ 'input'\n})\nexport class MouseOverDirective{}\n```\n\n这是元素选择器。指令将附加到 DOM 中的每个\
  \ `input` 元素上。\n\n例如，它将附加到以下两个元素：\n\n1.  `<input type=”button” value=”I am button”>`\n\
  2.  `<input type=”text” value=”I am button”>`\n\n**ID 选择器**\n\n请看以下代码：\n\n```\n\
  @Directive({\n   selector: #MyId\n})export class MouseOverDirective{}\n```\n\n这是\
  \ ID 选择器。指令将附加到每个具有 id 属性且值为 `MyId` 的元素上。\n\n例如，它将附加到第一个 input 元素，如下所示：\n\n1.  `<input\
  \ id=”MyId” type=”button” value=”I am button”>`\n2.  `<input type=”tex” value=”I\
  \ am button”>`\n\n## 实验 12 – 创建 OnlyIfUserIsAuthorizedDirective 指令\n\n在实验 12 中，我们将创建一个结构型指令，如果当前登录用户的角色不是授权用户，该指令将用一个自定义的\
  \ *HTML div 元素* 替换 *HTML 元素*。\n\n**第 1 步 – 创建新指令**\n\n创建一个新的 Angular 指令 `OnlyIfUserIsAuthorizedDirective`，如下所示：\n\
  \n![](img/Image57103.jpg)\n\n**图 26.6**\n\n**第 2 步 – 运行应用程序**\n\n在 `AppComponent`\
  \ 中添加一个新的输入按钮，并将上述指令附加到它上面。\n\n1.  `<input type=”button” value=”Add new record”\
  \ appOnlyIfUserIsAuthorized >`\n\n然后，在指令的构造函数中放入一条“*hello world*”消息，并确认到目前为止一切正常（类似于之前的实验测试）。\n\
  \n**第 3 步 – 注入必要的服务**\n\n正如我们已经讨论过的，需求是当用户未授权时，移除按钮元素并放入一个 HTML span 元素。为此，像之前一样将\
  \ `ElementRef` 和 `Renderer2` 服务注入到指令中。\n\n```\nexport class OnlyIfUserIsAuthorizedDirective\
  \ implements OnInit {\n   constructor(private ele: ElementRef,private renderer:\
  \ Renderer2) {……}\n```\n\n**第 4 步 – 定义授权逻辑**\n\n将以下代码放入 `ngOnInit` 方法中：\n\n```\n\
  \  ngOnInit(): void {\n     const isAuthorized = true;\n     if (localStorage.IsAuthorized\
  \ !== 'true') {\n       const pNode = this.renderer.createElement('div');\n    \
  \   const txtNode = this.renderer.createText('Not authorized!!!');\n       this.renderer.appendChild(pNode,\
  \ txtNode);\n       this.renderer.appendChild(this.ele.nativeElement.parentElement,\
  \ pNode);\n       this.renderer.removeChild(this.ele.nativeElement.parentElement,this.ele.nativeElement);\n\
  \    }\n  }\n```\n\n## 讨论 – 继续\n\n根据代码，如果本地存储包含 *false* 值，一个元素将被替换为一个 *HTML div\
  \ 元素*。让我们逐步分析代码：\n\n1.  首先，我们创建了一个 *HTML div 元素*。\n2.  然后，我们创建了一个简单的文本。\n3.  接着，我们将文本追加到\
  \ *div 元素* 中。\n\n\n\n\n\n4.  接下来，我们将 *HTML div* 元素追加到当前元素的父元素上。（当前元素指的是我们附加了指令的那个元素。）\n\
  \n5.  最后，我们移除了当前元素。\n\n（我们假设本地存储中保存了一个值，用于指示用户是否已授权。）\n\n## 实验 – 继续\n\n### 步骤 5\
  \ – 执行应用程序\n\n执行应用程序，并确认当本地存储中包含 `false` 值时，按钮元素会自动从 DOM 中移除。\n\n![](img/Image57173.jpg)\n\
