  5.          }\n6.  ……\n```\n\n**步骤 18：检查输出**\n\n现在你将得到预期的输出。\n\n## 讨论 – 续\n\n让我们理解\
  \ `Observable` 和 `Subject` 之间的区别。但首先，让我们探索 *响应式编程* 中 `Observable` 和 `Observer` 的概念。\n\
  \n**Observable 和 Observer**\n\n在 *响应式编程* 世界中，我们有 `Observable` 和 `Observer` 的概念。\n\
  \n想想 Twitter。假设你访问我的 Twitter 账户（`@sukeshmarla`），并点击关注按钮。那么究竟会发生什么？Twitter 将你添加到我的关注者列表。每当我发推文时，所有关注者都会收到通知。在这种情况下，我（你关注的人）是\
  \ `Observable`，Twitter 是 `Observer`，而关注者是 *消费者* 或 *订阅者*。\n\n你观察的对象称为 `Observable`。*订阅者*\
  \ 订阅其变化。\n\n向 observable 提供新数据的对象称为 `Observer`。*订阅者* 获得订阅是因为 *观察者* 向 `Observable`\
  \ 提供了某些内容。\n\n![](img/Image50855.jpg)\n\n**图 12.12**\n\n*这种编程方法称为响应式编程——需求方不会持续请求数据。他会订阅变化。负责数据的程序会在数据可用时做出反应并发布数据。*\n\
  \n**Rxjs 中的 Subject**\n\n我们在之前的某个实验中介绍了 *Rxjs*。它是一个用于 *响应式编程* 的 *JavaScript 库*。\n\
  \n在 *RxJSJS* 中，有一个名为 `Subject` 的类，它同时代表了响应式编程中的 `Observable` 和 `Observer`。\n\n让我们回顾一下之前的实验：\n\
  \n1.  我们创建了 `Subject`。\n2.  我们在 `LoginComponent` 中订阅了它。因此，它是一个 `Observable`。\n3.\
  \  我们使用 `next` 方法向它提供数据。因此，它是一个 `Observer`。\n\n**Rxjs Subject 与 Rxjs Observable**\n\
  \n在 Rxjs 中，还有一个名为 `Observable` 的类，它代表了响应式编程中的 `Observable`。\n\nRxJS `Observable`\
  \ 只能被订阅，而 RxJS *Subjects* 既可以订阅，也可以发出新值。\n\nRxJS *Observables* 不会暴露任何向它提供新数据的方法。简单来说，我们有\
  \ `Subject.next` 方法，但没有 `Observable.next`。\n\n**从 Subject 中提取 Observable**\n\n在实际项目中，作为最佳实践，我们从不直接将\
  \ subjects 暴露给订阅者。\n\n想象一下，多个订阅者订阅了一个 subject，其中一个订阅者调用了 `next` 方法。你能想象会发生什么吗？其他每个订阅者都会收到通知。\n\
  \n因此，建议将 `Subject` 声明为私有，并将其底层的 `Observable` 暴露给 *订阅者* 进行订阅。`Subject` 类有一个 `asObservable()`\
  \ 方法，可以让我们从中提取底层的 `Observable`。\n\n让我们看看解决方案。\n\n## 实验 – 续\n\n**步骤 19：将 Subject\
  \ 转换为 Observable**\n\n打开 `AuthenticationService`，将 Subject 标记为私有，并改为暴露 Observable。\n\
  \n```\n1.  *`// Change 4 - Subject for dealing with invalid credentials`*\n2.  \
  \   private isAuthenticationFailedSubject: Subject<boolean>;\n3.  *`// Change 6\
  \ - Declare Observable`*\n4.     invalidCredentialsObservable$: Observable<boolean>;\n\
  6.  *`// Change no 1 - Router Service injected`*\n7.     constructor(private router:\
  \ Router, private httpClient: HttpClient) {\n8.       this.isAuthenticationFailedSubject\
  \ = new Subject<boolean>();\n9.  *`// Change 7 - Get Observable from Subject`*\n\
  10.      this.invalidCredentialsObservable$ = this.isAuthenticationFailedSubject.asObservable();\n\
  11.    }\n```\n\n***注意：** 在 observable 变量后添加“$”是业界遵循的命名约定。*\n\n**步骤 20：订阅 Observable**\n\
  \n现在，在 Login Component 中，不再订阅 Subject，而是订阅 Observable。\n\n```\n1.  ……\n2.     constructor(private\
  \ authenticationService: AuthenticationService) {\n3.       this.IsAuthenticatiionFailed\
  \ = false;\n4.       this.authenticationService.invalidCredentialsObservable$.subscribe((x)\
  \ =>\n5.       {\n6.         this.IsAuthenticatiionFailed = x;\n7.      });\n8.\
  \    }\n9.  ……\n```\n\n**步骤 21：检查输出**\n\n再次得到令人满意的输出。\n\n以下是应用程序的示意图流程：\n\n![](img/Image51013.jpg)\n\
  \n**图 12.13**\n\n## 讨论 – 续\n\n上述通信方法被称为**观察者模式**，其中许多**订阅者**订阅 `Observable` 的变化。\n\
  \n#### 总结\n\n步骤 21 并不是本实验的最后一步。实验将在下一章继续。我们刚刚完成了一个长实验的一部分。\n\n让我们回顾一下本实验中学到的所有内容：\n\
