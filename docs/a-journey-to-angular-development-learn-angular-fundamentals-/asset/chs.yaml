  \ 12 章\n\n## 身份验证服务\n\n## 引言\n\n在上一章中，我们介绍了一些 Angular 内置服务，如 Router、HTTP 等。\n\n\
  在前往第 9 站的旅程中，我们将探索自定义服务，并回答许多未解之谜。第 9 站的旅程将是所有旅程中最长的，并且跨越多个章节。所以，请保持耐心，继续阅读。\n\n\
  ## 什么是依赖？\n\n在整个第 9 站的旅程中，我们将反复遇到“依赖”这个词。\n\n那么，让我们先理解它是什么。\n\n![](img/Image50300.jpg)\n\
  \n**图 12.1**\n\n## 理解紧耦合\n\n理解紧耦合的最佳方式是通过人体。\n\n![](img/Image50338.jpg)\n\n**图 12.2**\n\
  \n你能想象一个人在需要做重活时，把自己的手换成更强壮的手，或者在考试时把自己的大脑换成非凡的大脑吗？\n\n这是不可能的，因为我们的身体与其他身体部位紧密相连，但如果可能的话，那该有多好啊？\n\
  \n同样的原理也适用于编程世界。请看以下代码：\n\n```\n1.  class EmailLayer{\n2.       sendEmail(){}\n\
  3.  }\n\n5.  class LogicLayer{\n6.       Save(){\n7.           let b:EmailLayer=new\
  \ EmailLayer();\n8.           b.sendEmail();\n9.      }\n10.  }\n\n12.  //UI Code\n\
  13.  let l:LogicLayer=new LogicLayer();\n14.  l.Save();\n```\n\n在上面的代码中，你可以看到 `LoginLayer`\
  \ 类直接与 `EmailLayer` 类连接。\n\n现在，尝试回答以下问题：\n\n1.  如果 `EmailLayer` 类出现错误，你还能测试 `LogicLayer`\
  \ 类的 save 方法吗？\n2.  想象另一个 UI，其中相同的 `LogicLayer` 类可以被重用，但希望使用短信通知而不是电子邮件。这可能实现吗？\n\
  \n上述两个问题的答案都是“不能”，因为与人体部位类似，`LoginLayer` 和 `EmailLayer` 是紧耦合的。\n\n## 理解松耦合\n\n想象一辆机动车。\n\
  \n![](img/Image50376.jpg)\n\n**图 12.3**\n\n与人体不同，机动车与其部件的连接更为松散。\n\n轮胎可以更换为其他轮胎，或者根据需求更换发动机。\n\
  \n这是可能的，因为机动车与其部件是松散连接的。\n\n想象一下如果它们是紧密连接的。如果轮胎损坏，我们就必须更换整个机动车。这完全不符合成本效益。\n\n同样的原理也适用于编程世界。\n\
  \n请看以下代码：\n\n```\n1.  abstract class NotificationLayer{\n2.       abstract Notify():void;\n\
  3.  }\n\n5.  class EmailLayer extends NotificationLayer{\n6.       Notify() {\n\
  7.           //Send email code\n8.      }\n9.  }\n\n10.  class SMSLayer extends\
  \ NotificationLayer{\n11.       Notify() {\n12.           //Send SMS code\n13. \
  \     }\n14.  }\n\n16.  class LogicLayer{\n17.       constructor(private notificationLayer:NotificationLayer){\n\
  18.      }\n19.       Save(){\n20.           this.notificationLayer.Notify();\n\
  21.      }\n22.  }\n\n23.  //UI Code\n24.  let l:LogicLayer=new LogicLayer(new EmailLayer());\n\
  25.  l.Save();\n```\n\n在上面的代码中，`LogicLayer` 与 `NotificationLayer` 是松散连接的。\n\n因此，同一个\
  \ `LogicLayer` 既可以与 `EmailLayer` 一起使用，也可以与 `SMSLayer` 一起使用。它将与 `NotificationLayer`\
  \ 的所有派生类兼容。\n\n## 理解依赖注入\n\n依赖注入（DI）是一种将依赖实例注入系统的模式，由称为 IOC 容器或 DI 框架的外部框架完成。\n\n\
  ![](img/Image50453.jpg)\n\n**图 12.4**\n\n如今，大多数现代技术都配备了 DI 框架。我们在第 11 章：身份验证中已经看到了\
  \ DI 的演示，其中 `HttpClient` 和 Router 服务的实例由 Angular DI 系统注入到 `LoginComponent` 中，并供我们使用。\n\
  \nDI 使应用程序松散耦合，从而使其可测试且可维护。\n\n在第 9 站的旅程中，你将详细了解 Angular 中的 DI。\n\n## Angular 服务\n\
  \n让我们快速回顾一下上一章中学到的 Angular 服务的定义。\n\n\n\n\n它们是可注入的应用程序逻辑。可以是任何逻辑，Angular 的依赖注入系统负责实例的创建，并在正确的位置为我们注入。\n\
  \n## 实验 4：项目中的 Angular 服务\n\n目前，`LoginComponent` 包含了一些按照最佳实践不应存在的代码。作为最佳实践，组件不应包含任何业务逻辑。应用程序中的所有业务逻辑都应迁移到服务中。让我们也这样做。\n\
  \n**步骤 1：重命名项目**\n\n将 `lab3-ng` 重命名为 `lab4-ng`。\n\n**步骤 2：创建 AuthenticationService**\n\
  \n在 `app` 文件夹中创建一个名为 Services 的新文件夹，然后创建一个新文件 `authentication.service.ts`，内容如下：\n\
  \n```\nexport class AuthenticationService{\n}\n```\n\n**步骤 3：将 LoginComponent 连接到\
  \ AuthenticationService**\n\n通过在组件类中将 `AuthenticateService` 指定为构造函数参数来获取其引用。\n\n\
  ```\n……\nimport {HttpClient} from ‘@angular/common/http’;\nimport {AuthenticationService}\
  \ from ‘../Services/authentication.service’;\n……\n   constructor(private authenticationService:AuthenticationService,\n\
  \     private router: Router,private httpClient:HttpClient) {\n     this.IsAuthenticatiionFailed\
  \ = false;\n  }\n   login() {\n……\n```\n\n**步骤 4：检查输出**\n\n这将导致应用程序崩溃。在开发者工具中检查错误。\n\
  \n![](img/Image50495.jpg)\n\n**图 12.5**\n\n## 讨论\n\n是时候再次回顾上一章的陈述了。\n\n“要使 *DI*\
  \ 工作，我们必须使用 *provider* 配置 *injector*。”\n\n**注入器**\n\n这是一个理论，所以不必过于纠结。先轻松地过一遍，稍后再复习。\n\
  \n在 Angular 中，*DI 框架*的核心是一个 *注入器*：\n\n*   Angular 注入器负责实例化依赖并将其注入到应用程序的各个部分，例如组件和服务。\n\
  *   作为应用程序开发者，我们不会手动创建注入器。我们只使用 provider 对其进行配置。\n*   然后注入器使用该 provider 创建服务的实例。\n\
  *   Angular 创建两种注入器——**模块注入器**和**元素注入器**。\n*   当应用程序启动时，Angular 会创建一个 *模块注入器*，称为\
  \ *根注入器*。\n\n    （随着时间的推移，还会创建其他 *子模块注入器*，但暂时不必担心，因为我们还没有看到多个 *Angular 模块* 的实际应用。目前，假设只创建了一个\
  \ *模块注入器*，即 *根注入器*。）\n\n*   Angular 还会为每个组件创建一个元素注入器，并维护一个类似于应用程序组件树的树形层次结构。在当前应用程序中，目前我们有一个简单的组件层次结构。我们有一个\
  \ `AppComponent`，它有两个子组件——`CustomerComponent` 和 `LoginComponent`。因此，我们将为 `AppComponent`\
  \ 创建一个元素注入器，它将作为为 `CustomerComponent` 和 `LoginComponent` 创建的元素注入器的父级。\n*   当 Angular\
  \ 应用程序中需要某个依赖时，第一个请求将发送到关联组件的元素注入器。如果无法解析，它将转发到父组件的元素注入器，依此类推，直到依赖被解析。\n*   如果即使\
  \ `AppComponent` 注入器也无法解析依赖，它将转发到模块注入器。模块注入器也维护一个我们尚未讨论的树。如果模块注入器树也无法解析实例，Angular\
  \ 将抛出“*no provider…*”错误。\n\n**提供者**\n\n提供者是一个对象，它将 *DI 令牌* 与 *依赖* 关联起来。你将在下一个演示中看到它。\n\
  \n**DI 令牌**\n\n*   令牌用于定位提供者。\n*   我们可以创建三种类型的令牌——*类型令牌*、*字符串令牌* 和 *注入令牌*。\n\n \
  \   ![](img/Image50540.jpg)\n\n    **图 12.6**\n\n## 实验 – 继续\n\n**步骤 5：为 AuthenticationService\
  \ 配置注入器**\n\n将 `AuthenticationService` 添加到组件装饰器的 providers 集合中，如下所示：\n\n```\nimport\
  \ {AuthenticationService} from ‘../Services/authentication.service’;\n@Component({\n\
  \   selector: ‘login’,\n   templateUrl: ‘./login.component.html’,\n   providers:[{provide:\
  \ AuthenticationService, useClass: AuthenticationService}]\n})\nexport class LoginComponent\
  \ {\n```\n\n## 讨论 – 继续\n\n让我们理解一下我们做了什么。\n\n![](img/Image50586.jpg)\n\n**图 12.7**\n\
  \n通过编写上述代码，我们向 `CustomerComponent` 的 *providers* 集合中添加了一个新的提供者对象，该对象将由 *CustomerComponent*\
  \ 的元素注入器使用。\n\n在代码中，使用的 *DI 令牌* 是 *类型令牌* 类型。\n\n在上面的示例中，`provide` 和 `useClass` 持有相同的值，但如果有需要，两者可以不同。\n\
  \n基于当前配置，当我们期望 `CustomerService`（因为这是 *provide* 中提到的）时，注入器将注入 `CustomerService`\
  \ 的实例（因为这是 `useClass` 中提到的）。当 `CustomerComponent` 实例被销毁时，创建的实例也将被销毁。\n\n**简写语法**\n\
  \n当两个属性（`provide` 和 `useClass`）共享相同的值时，我们可以使用更简单的语法。\n\n```\n……\nimport {AuthenticationService}\
  \ from ‘../Services/authentication.service’;\n@Component({\n   selector: ‘login’,\n\
  \   templateUrl: ‘./login.component.html’,\n   providers[AuthenticationService]\n\
  })\nexport class LoginComponent {\n```\n\n我们将在本书后面探讨其他类型的 *DI 令牌*。\n\n## 实验 – 继续\n\
  \n**步骤 6：检查输出**\n\n执行应用程序。这次你会发现一切恢复正常。\n\n**步骤 7：创建用户模型**\n\n在 `Models` 文件夹中创建一个新的\
  \ `user.ts` 文件，内容如下：\n\n```\nexport class User{\n   UserName: string;\n   Password:\
