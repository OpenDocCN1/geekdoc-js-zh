  \ 开发之旅\n![](img/Image40710.jpg)\n\n# 第 1 部分\n\n## 第 1 章：夯实基础\n\n## 引言\n\n终于，漫长的等待结束了。火车刚刚抵达站台。请上车。它将带您前往第一站，让您的基础更加扎实。\n\
  \n计划如下：\n1. 了解本系列课程的内容。\n2. 学习与 Angular 学习相关的术语。\n3. 理解 `Node.js` 在 Angular 应用开发中的作用。\n\
  \n![](img/Image40795.jpg)\n**图 1.1**\n\n这一站全是理论。不要急于一次性学完本章的所有内容。您可以在将来重新回顾并复习。放松心情，享受学习过程。\n\
  \n### 理解本系列课程的内容\n\n在学习本系列课程的过程中，如果有人问您在学什么，请不要回答 `AngularJS`，因为本系列与 `AngularJS`\
  \ 无关。这将是一个 Angular 系列课程。\n\n![](img/Image40830.jpg)\n**图 1.2**\n\n### AngularJS\
  \ 和 Angular？\n\n首先，我们必须理解 Angular 和 `AngularJS` 是否相同。\n\n如您所知，*电话* 和 *手机* 是两种不同的东西。\n\
  \n![](img/Image40838.jpg)\n**图 1.3**\n\n*电话* 很久以前就被引入世界，其目的是连接人们。它很好地完成了这项工作。\n\n\
  多年后，一种新设备问世，具有相同的核心目的，但更加便捷，并拥有许多出色的功能。它就是 *手机*。\n\n*电话和手机是一样的吗？答案是否定的。*\n\n对于 Angular\
  \ 和 `AngularJS`，也可以考虑类似的答案。\n\n`AngularJS` 是由 Google 团队创建的 *客户端框架*，用于 *单页应用开发*。\n\
  \n一段时间后，该框架的改进版本被推出。这个新版本强制执行了现代 UI 开发方法论（组件导向架构）。它在 *性能* 方面更好，代码也更加 *有组织且易于管理*。\n\
  \n它以一种全新的方法被引入。它被命名为 Angular，其第一个版本是 2.0。\n\n**它们之间有任何相似之处吗？**\n\n`AngularJS` 和\
  \ Angular 确实共享一些标准词汇/功能。在这两种技术中，您都会看到 `Directives`、`Pipes`、`Services` 以及许多其他标准功能。两者都共享\
  \ **单页应用** 的核心理念。这两种技术中的概念具有相似的想法，但语法完全不同。\n\n**是否有从 AngularJS 应用迁移到 Angular 应用的路径？**\n\
  \n是的，有，它被称为 *重新创建*。\U0001F60A\n\n许多人可能会争辩说 `AngularJS` 应用可以迁移到 Angular 应用，但这实际上是一个神话。只有在试用或演示应用中才有可能。对于实时应用，这只是一个梦想。它们的编程风格和语法截然不同。\n\
  \n### 与 Angular 学习相关的术语\n\n如果您以前尝试过学习 Angular，您一定遇到过一些令人兴奋的词汇，例如 `Node`、`TypeScript`\
  \ 和 `ES6`。让我们讨论其中几个术语。\n\n![](img/Image40875.jpg)\n**图 1.4**\n\n请注意，如果您觉得初始理论有点难以消化，请不要担心，放松并继续。一旦您开始进行实践实验，这些理论就会变得简单。\n\
  \n### JavaScript\n\n可能很多人已经知道 JavaScript 是什么。它是一种编程语言，多年来一直被开发者用于 Web 应用中的客户端脚本。其主要目的是\
  \ DOM 操作。JavaScript 由浏览器在客户端执行，并操作客户端 DOM。\n\n![](img/Image40917.jpg)\n**图 1.5**\n\
  \n**与其他编程语言相比，JavaScript 有何不同？**\n\n与大多数编程语言一样，JavaScript 不是编译型语言。它是一种动态的解释型语言。运行时环境（由浏览器提供）逐行执行代码，并在运行时出现任何问题时抛出错误。\n\
  \n让我们做一个演示来理解这一点。创建一个包含以下内容的 HTML 文件：\n\n```html\n<html>\n<head></head>\n<body>\n\
  \     <script>\n         console.log('A'); console.log('B');\n         console.log('C');\
  \ console.log(ABCD);\n         console.log('D'); console.log('E');\n     </script>\n\
  </body>\n</html>\n```\n\n现在，执行该 HTML 文件。（只需双击文件，在浏览器中打开。）\n\n如您所见，尽管第四个 `console.log`\
  \ 语句中存在错误，但前三行已成功执行。\n\n如果是 `C#` 或 `Java`，我们会看到完全不同的输出。我们会遇到编译时错误。这就是 JavaScript。\n\
  \n![](img/Image40958.jpg)\n**图 1.6**\n\n### ES6\n\n`ES6`、`ES2015` 和 `ECMA 2015`\
  \ 都是相同的。最初，它被提议为 `ES6`，最终 `ES2015` 成为官方名称。通常，大多数人称其为 `ES6`，因此在本系列中我们将称其为 `ES6`。\n\
  \n\n\n\n\n这是一个新的 JavaScript 标准。该版本新增了许多功能和特性，旨在让 JavaScript 开发者的工作更轻松。在本系列中，我们将探讨其中的一些特性。\n\
  \n### 什么是单页应用？为什么需要它？\n\nGmail 和 Facebook 是这类应用中最著名的例子。让我们将传统 Web 应用与单页应用（SPA）进行比较。\n\
  \n![](img/Image41033.jpg)\n**图 1.7**\n\n![](img/Image41041.jpg)\n**图 1.8**\n\n对于\
  \ SPA 而言，性能会好得多。最终用户一开始会获得一个页面，并且这个页面会一直存在。用户后续执行的所有操作看起来都像是简单的 DOM 操作。某些内容动态显示，某些内容隐藏，一些新项目被创建，一些现有项目被移除，但整个\
  \ UI 永远不会刷新。这给人一种整个应用都在一个页面上开发的感觉。因此，它被称为 `单页应用`。\n\n#### 它真的只包含一个页面吗？\n\n但问题是，它内部真的只包含一个页面吗？我的意思是，你认为开发者实际上将整个应用开发成一个页面吗？答案是否定的。这是不可能的。\n\
  \n实际上，对于开发者来说，它是一个多页应用。他/她会在内部创建多个页面。然后，利用 `Ajax`、`CSS` 和 `JavaScript` 等概念，他/她营造出单页应用的外观，从而提升应用的整体用户体验。对于最终用户来说，它就是一个单页应用。\n\
  \n#### 创建 SPA 的挑战是什么？\n\n使用 `原生 JavaScript` 进行 DOM 操作并不容易。这是社区给纯核心 JavaScript 语法（无第三方库）编写的代码起的名字。\n\
  \n用纯 `原生 JavaScript` 创建实时 Web 应用将充满挑战，因为我们必须编写大量 JavaScript 才能实现。其次，我们还需要关注浏览器兼容性。\n\
  \n像 `jQuery` 这样的库让 DOM 操作变得非常容易。\n\n#### 仅靠 jQuery 或其他 DOM 操作库就足以创建 SPA 吗？\n\n试想一下，为了创建一个\
  \ SPA，我们需要编写多少 JavaScript——所有 DOM 操作都将在客户端完成。服务器端代码将仅限于业务逻辑和数据。\n\n如果我们为此使用 `原生\
  \ JavaScript` 或像 `jQuery` 这样的库，代码将变得难以管理，因为代码中没有强制性的关注点分离。随着应用规模的增长，JavaScript 代码会越来越庞大，越来越难以管理。\n\
  \n我并不是说我们不能使用 `jQuery` 或其他 DOM 操作库来创建 SPA。我们可以，但过多的 JavaScript 代码会使代码变得不可管理。我们需要某种标准且结构化的\
  \ UI 开发方式。\n\n你一定听说过服务器端技术中的架构模式，如 `MVC` 或 `MVVM`，它们为应用的不同逻辑区域提供了清晰的分离。它们明确回答了“什么该放在哪里？”以及“什么与什么通信”。当应用采用此类架构开发时，代码更易于管理。\n\
  \n使用 `jQuery`，我们只能获得一些让 DOM 操作更轻松的方法，但代码管理和架构呢？你不觉得我们在客户端也需要一种更结构化的方法吗？尤其是当我们知道最终会编写大量\
  \ JavaScript 代码时。\n\n所以，当前问题的答案是：不。`jQuery` 不足以构建 SPA。我们需要更多。我们需要某种框架，它能在 UI 世界中强制采用结构化的编码方式。\n\
  \n## 什么是 Angular？\n\nAngular 是由 Google 创建的客户端框架。请注意，它不是 JavaScript 的替代品。它是一个 JavaScript\
  \ 框架。\n\n**注意：它不是库，而是框架。**\n**框架是一个比库更宏大的概念。**\n\n![](img/Image41079.jpg)\n**图 1.9**\n\
  \n它提供了开发所需的全面平台。该平台可能包含一些可重用的库以简化工作，但它还可能提供许多其他东西，例如编译器、执行环境。它甚至可能强制你在编码时遵循某种固定的结构。\n\
  \nAngular 框架就像 `jQuery` 一样，让 DOM 操作变得非常容易，但它还为你提供了 UI、UI 逻辑、表示逻辑和应用逻辑之间的清晰分离。\n\n\
  Angular 还强制我们以可重用且可组合的 Web 组件的形式来开发整个 UI 应用。这被称为组件导向架构。这是 `HTML 5` 推荐的 UI 开发标准方式。\n\
  \n简而言之，Angular 是一个用于创建 SPA 的客户端框架。\n\n### 什么是 Node.js？\n\n当我第一次学习 Angular 时，我感到相当困惑。我想知道\
  \ `Node.js` 在这里做什么，我相信很多人也有类似的困惑。\n\n在深入探讨“`Node.js` 在 Angular 应用开发中扮演什么角色？”这个问题之前，我们先来理解一下\
  \ `Node.js` 是什么。\n\n它是执行 JavaScript 代码的运行时。这意味着，我们现在可以编写在浏览器之外运行的 JavaScript 代码。借助\
  \ `Node.js`，我们可以使用 JavaScript 语言创建其他类型的应用，例如桌面应用，甚至是可以响应 `HTTP` 请求的服务器等。\n\n###\
  \ 安装\n\n你可以从以下链接下载最新版本的 `Node.js`：\n[`Node.js.org/en/download/`](http://Node.js.org/en/download/)\n\
  \n### 确认安装成功\n\n要确认安装是否成功，请打开命令提示符，并依次执行以下两个命令：\n\n1. `node` 命令\n你应该会看到以下输出：\n![](img/Image41086.jpg)\n\
  **图 1.10**\n\n2. `npm` 命令\n![](img/Image41156.jpg)\n**图 1.11**\n\n按 `Ctrl` + `C`\
  \ 两次退出 `node` 命令，然后执行 `npm` 命令：\n\n通常，Node 安装过程也会更新系统中的环境变量。有时，由于某些系统安全问题，它可能无法更新环境变量。如果更新失败，你可能会看到以下错误：\n\
  \n* `node` 未被识别为内部或外部命令。\n* `npm` 未被识别为内部或外部命令。\n\n在这种情况下，请确保手动更新。打开 `控制面板 >> 系统和安全\
  \ >> 系统`，然后参考以下两幅图：\n\n**更新路径**：\n![](img/Image41218.jpg)\n**图 1.12**\n\n**更新系统路径**：\n\
  ![](img/Image41225.jpg)\n**图 1.13**\n\n#### Node 控制台应用的快速演示\n\n打开你喜欢的文本编辑器，编写以下代码：\n\
  \n```javascript\nvar a=10;\nvar b=20;\nconsole.log(a+b);\n```\n\n将文件保存为 `firstnode.js`。\n\
  \n现在，打开命令提示符。导航到保存文件的文件夹，并执行以下命令：\n\n```bash\nnode firstnode.js\n```\n\n你将看到以下输出：\n\
  ![](img/Image41308.jpg)\n**图 1.14**\n\n如你所见，JavaScript 代码在没有浏览器的情况下执行了。\n\n这是一个简单的\
  \ `Node.js 应用` 演示。\n\nNode 运行时能理解所有 JavaScript 关键字（除了 UI 特定的关键字，如 `alert` 或 `document`），并知道如何执行它们。`Node.js`\
  \ 甚至能理解新的 `ES6` 特性，以及在一定程度上理解 `ES7`（将在 `ES6` 之后引入的版本）。\n\n（这是一个快速演示，展示使用 `Node.js`\
  \ 可以在没有浏览器的情况下执行 JavaScript。）\n\n### 什么是 npm？\n\n当我们谈论应用时，我们会有依赖项。\n\n\n\n\n例如，假设我们正在开发一个名为\
  \ `App1` 的应用程序，并且想要使用一个名为 `dep1` 的第三方模块。`dep1` 依赖于另外两个第三方模块 `dep2` 和 `dep3`。而 `dep3`\
  \ 又依赖于 `dep4`。\n\n现在，这里的挑战是，作为 `App1` 的开发者，我们有责任下载 `dep1` 以及 `dep2`、`dep3` 和 `dep4`。\n\
  \n简而言之，我们需要对整个依赖层级有完整的了解。我们还需要确保下载正确的版本。例如，`dep2` 的最新版本是 3.5，而 `dep1` 需要 `dep2`\
  \ 的 `2.3` 版本。\n\n这工作量是不是太大了？一个简单的解决方案就是包管理器。它是一种软件工具，可以简化依赖项的管理。你会发现几乎所有技术中都有包管理器的概念。在\
  \ Java 中，我们有 Maven；在 .net 中，我们有 Nuget；在 Python 中，我们有 Pep。Node 也有自己的包管理器，那就是 `npm`。\n\
  \n使用 `npm`，我们可以从 `npm` 注册表（称为 node modules）下载各种 JavaScript 包。\n\nnpm 注册表是一个在线数据库，其中保存着\
  \ node modules。\n\n这些 node modules 既包括可重用的库，也包括实用工具。库可以用于某些应用程序，而实用工具则可以执行一些自动化任务。\n\
  \n### 使用 npm 下载 JavaScript 库\n\n为了演示这一点，让我们使用 `npm` 下载 `jquery`。为此，打开命令提示符，并执行以下命令：\n\
  \n1. `npm install jquery`\n\n现在，打开你执行上述命令的文件夹。你会发现在其中创建了 `node_modules` 文件夹。在 `node_modules`\
  \ 文件夹内，你会找到 jQuery。\n\n如你所见，使用 npm 工具，我们可以从 npm 注册表下载可重用的库。就像 jQuery 一样，我们可以使用 npm\
  \ 轻松下载 Angular、ReactJS 等其他库。\n\n### 使用 npm 下载实用工具\n\nJavaScript 包（也称为 node modules）并不仅限于第三方库。它们也可以是某些可执行应用程序。\n\
  \n例如，我们有一个名为 `webpack` 的 node module，它可以让我们将所有 JS 文件打包成一个单独的 `js` 文件。什么是 *打包*，什么是\
  \ *webpack* 等等……现在不必担心这些问题。我们很快就会讨论。\n\n现在，让我们演示一下下载一个可执行应用程序的 node module。\n\n\
  只需执行以下命令：\n\n1. `npm install -g @just-compile/jc_calc`\n\n你可能会注意到 `npm install`\
  \ 中添加了一个属性 `-g`。这意味着我们正在全局安装我们的 node modules。（我们稍后会讨论全局安装和本地安装的区别。）\n\n（在 Windows\
  \ 机器上，你可以在 `C:\\Users\\{username}\\AppData\\Roaming\\npm` 找到安装位置。）\n\n一旦上述命令执行完毕，我们将获得一个新的\
  \ CLI 命令 `add_jc_calc`。让我们使用它。\n\n1. `add_jc_calc 8 9`\n\n你将得到以下输出：\n\n1. `17`\n\
  \n## 什么是 package.json？\n\n它是一个简单的文本文件，包含关于 `Node.js` 应用程序的元数据信息。\n\n它位于应用程序的根目录中。\n\
  \n使用它有以下三个优点：\n\n1. 提供关于我们的包或应用程序的元数据信息。\n2. 跟踪应用程序的依赖项。\n3. 创建 npm 脚本。\n\n### package.json\
  \ 如何保存关于我们的包或应用程序的元数据信息？\n\n让我们从创建 `package.json` 开始。可以使用任何文本编辑器或 npm 工具手动创建它。\n\
  \n打开命令提示符，导航到某个文件夹，并执行以下命令：\n\n1. `npm init`\n\n它会询问一些输入。\n\n请参考下图：\n\n![](img/Image41366.jpg)\n\
  \n**图 1.15**\n\n在最后的提示中，输入 `yes`，然后按 *Enter* 键。在文件资源管理器中打开该文件夹，你会注意到 `package.json`\
  \ 已在该文件夹中创建，内容如下：\n\n```\n{\n   “name”: “myapp”,\n   “version”: “1.5.1”,\n   “description”:\
  \ “trying package.json for learning”,\n   “main”: “index.js”,\n   “scripts”: {\n\
  \     “test”: “echo \\”Error: no test specified\\” && exit 1”\n   },\n   “author”:\
  \ “sukesh marla”,\n   “license”: “ISC”\n}\n```\n\n如你所见，`package.json` 包含关于我们应用程序的大量信息，这就是第一个优点——保存应用程序的元数据。\n\
  \n### package.json 如何用于跟踪应用程序的依赖项，以及它的好处是什么？\n\n首先，让我们回答为什么要跟踪应用程序的依赖项，然后再回答如何跟踪。\n\
  \n假设一个系统依赖于三个外部库——`jquery`、`systemjs` 和 `core-js`。\n\n每个库都可以使用以下 `npm install` 命令下载：\n\
  \n1. `npm install jquery`\n2. `npm install systemjs`\n3. `npm install corejs`\n\n\
  现在，说到应用程序，会有多个开发者。每个开发者都需要一份源代码副本。因此，建议将整个源代码保存在某种源代码控制仓库中，例如 GitHub、Bitbucket 等。\n\
  \n按照最佳实践，库文件不会包含在源代码控制仓库中；因此，每个开发者都需要使用 `npm` 单独下载它们。\n\n![](img/Image41420.jpg)\n\
  \n**图 1.16**\n\n这种方法的问题是，每个开发者都需要下载每个文件。在上面的例子中，只有三个库，但在某些情况下，可能有 100 个。在这种情况下，他/她很有可能会忘记下载某些库。\n\
  \n解决上述问题的方法是 `package.json`。请按照以下步骤操作：\n\n1. 按照上一节所述的方式创建 `package.json`（即 `npm\
  \ init`）。\n2. 依次执行以下命令：\n   a. `npm install jquery --save`\n   b. `npm install systemjs\
  \ --save`\n   c. `npm install corejs --save`\n\n请注意每个安装命令中添加的额外 `--save` 标志；它会在\
  \ `package.json` 中创建一个名为 dependencies 的新部分，如下所示：\n\n```\n{\n   “name”: “myapp”,\n\
  \   “version”: “1.5.1”,\n   “description”: “trying package.json for learning”,\n\
  \   “main”: “index.js”,\n   “scripts”: {\n     “test”: “echo \\”Error: no test specified\\\
  ” && exit 1”\n   },\n   “author”: “sukesh marla”,\n   “license”: “ISC”,\n   “dependencies”:\
  \ {\n     “corejs”: “¹.0.0”,\n     “jquery”: “³.4.1”,\n     “systemjs”: “⁶.2.5”\n\
  \   }\n}\n```\n\n现在，删除 `node_modules` 文件夹，然后执行 `npm install` 命令（在 `package.json`\
  \ 文件所在的文件夹中）。你会注意到所有依赖项将一次性下载完成。\n\n1. `npm install`\n\n就是这样。`package.json` 会保存所有依赖项的列表，每个开发者只需执行该命令，就能获得所有库。通过这种方式，我们实现了两个要求：\n\
  \n1. 库不作为源代码控制的一部分保存。\n2. 没有人需要记住系统中需要哪些库。\n\n![](img/Image41427.jpg)\n\n**图 1.17**\n\
  \n### 如何创建 npm 脚本以及它的目的是什么？\n\n我们已经演示了如何使用 `npm install` 安装第三方 `node_modules`。\n\
  \n\n\n\n\n### 全局与本地 Node 模块\n\n我们之前已经演示了可执行 Node 模块的用法，但还没有讨论 `npm install` 命令中使用的\
  \ `-g` 标志。使用 `-g` 标志安装 Node 模块会将其安装为全局 Node 模块，这样所有应用程序都可以使用它；而如果不使用 `-g` 标志，则会安装为本地（特定于应用程序的）Node\
  \ 模块。这些本地模块无法直接在命令提示符中执行，我们需要使用 npm 脚本来实现。\n\n下面我们做一个演示。\n\n**步骤 1：** 使用 `npm init`\
  \ 创建 `package.json`。\n\n**步骤 2：** 为了演示，我们将使用相同的 `@just-compile/jc_calc` 包。\n\n首先，使用以下命令卸载全局模块：\n\
  `npm uninstall -g @just-compile/jc_calc`\n\n请确保在上述命令中不要遗漏 `-g` 标志。\n\n现在，将其本地安装如下：\n\
  `npm install @just-compile/jc_calc`\n\n**步骤 3：** 现在执行以下命令：\n`add_jc_calc 8 9`\n\n\
  你将看到以下错误：\n`‘add_jc_calc’ 不是内部或外部命令，也不是可运行的程序或批处理文件。`\n\n由于该包未全局安装，你无法在命令提示符中直接使用\
  \ `add_jc_calc` CLI。我们需要一个 npm 脚本来执行本地模块。\n\n**步骤 4：** 打开 `package.json`，并按如下方式添加/修改脚本部分：\n\
  \n```json\n{\n  \"name\": \"myapp\",\n  \"version\": \"1.5.1\",\n  \"description\"\
  : \"尝试使用 package.json 进行学习\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n   \
  \ \"add\": \"add_jc_calc\"\n  },\n  \"author\": \"sukesh marla\",\n  \"license\"\
  : \"ISC\"\n}\n```\n\n**步骤 5：** 现在，在命令提示符中，使用以下命令立即执行 npm 脚本：\n`npm run add 8 9`\n\
  \n你将看到以下输出：\n```\nC:\\SukeshRND\\node\\package>npm run add 9 9\n> package@1.0.0\
  \ add C:\\SukeshRND\\node\\package\n> add_jc_calc “9” “9”\n18\n```\n\n执行本地 Node\
  \ 模块并不是 npm 脚本的唯一用途。有时，我们可能会遇到一些复杂且需要多次使用的命令。与其多次重复编写这些复杂命令，不如创建指向这些复杂命令的 npm 脚本。\n\
  \n## Webpack\n\n你能想象一个只有一个 JavaScript 文件的实时 Web 应用程序吗？我认为你无法想象。实际项目总是会有大量的 JavaScript\
  \ 文件。你能想象手动引入所有这些 JavaScript 文件吗（尤其是在单页应用的情况下）？那将是巨大的开销。\n\n### 模块加载器\n\n一种解决方案是使用模块加载器。模块加载器是一种在运行时动态加载\
  \ JavaScript 文件的库。此类模块加载器的一个例子是 `systemjs`。\n\n模块加载器可以通过 `npm` 直接下载。例如，要下载 `systemjs`，请使用以下命令：\n\
  `npm install systemjs`\n\n![](img/Image41487.jpg)\n**图 1.18**\n\n模块加载器的问题在于性能。在运行时加载\
  \ JavaScript 文件会影响性能。在未来的某篇文章中，我们将看到模块加载器的一个很好的演示。所以现在，只需尝试理解模块加载器的概念即可。\n\n## 模块打包器\n\
  \n模块打包器是一种 Node 模块，它接收一个 JavaScript 文件作为输入，然后识别该输入文件所依赖（直接或间接）的所有其他 JavaScript 文件，最后将所有文件合并并生成一个单一的\
  \ JavaScript 文件。它以不影响这些 JavaScript 文件内部逻辑的方式将它们合并在一起。\n\n生成的这个打包文件将被包含在 HTML 文件中。\n\
  \n![](img/Image41543.jpg)\n**图 1.19**\n\n**模块打包器和模块加载器如何理解依赖关系？**\n现在不必担心这个问题。当我们计划使用模块打包器或模块加载器时，我们会按照某些标准编写代码。目前，只需相信在每个\
  \ JavaScript 文件中，我们都会以某种方式指定与其他 JavaScript 文件的依赖关系。\n\n**只有一个 JavaScript 文件不会影响性能吗？**\n\
  它反而会提升性能，因为它将多个请求调用替换为单个请求。如果打包文件太大，我们可以配置模块打包器创建多个按功能划分的打包文件。\n\n**Webpack 是模块打包器吗？**\n\
  是的，`webpack` 是一个模块打包器，但它并不是唯一的打包器。还有其他的，比如 `Browserify`。我们将在后续的一篇文章中演示 webpack。\n\
  \n**模块打包器只打包 JavaScript 文件吗？**\n不，它也可以打包 CSS 文件。\n\n## 什么是 TypeScript？为什么使用它？\n\n\
  让我们通过回答几个更具体的问题来理解这一点。\n\n*   **什么是 TypeScript？**\n    它是一种编程语言。\n*   **它有什么作用？**\n\
  \    与大多数编程语言一样，TypeScript 是一种带有编译器的语言。TypeScript 编译器是一个可以通过 `npm` 下载的 Node 模块。编译后，它会生成\
  \ JavaScript 代码。\n    ![](img/Image41583.jpg)\n    **图 1.20**\n*   **在哪里可以使用 TypeScript？**\n\
  \    TypeScript 可以用于任何可以使用 JavaScript 的地方。你可以编写 TypeScript 代码，编译它，然后使用生成的 JavaScript\
  \ 代码，而不是直接编写 JavaScript。\n*   **为什么我应该用 TypeScript 而不是 JavaScript 编写代码？**\n    使用\
  \ TypeScript 而不是 JavaScript 编写代码会让你的工作更轻松。它会为我们提供一个类型安全的环境来编写代码（这在 JavaScript 中是不可能的），此外，它还具备一些让程序员生活更轻松的特性。\n\
  *   **学习一门新语言不是一种负担吗？**\n    对于任何 JavaScript 开发者来说，学习 TypeScript 语言都非常容易。TypeScript\
  \ 语言的语法继承自 JavaScript。\n    *   在 TypeScript 中声明变量和函数、赋值以及许多其他操作的语法与 JavaScript\
  \ 相同。\n    *   在 JavaScript 中能实现的所有功能，在 TypeScript 中同样可以实现。\n    *   JavaScript\
  \ 中的每个函数在 TypeScript 中都有对应的版本。例如，`alert`、`document.getElementById`、`console.log`\
  \ 等函数在 TypeScript 中同样可以使用。\n    任何 JavaScript 代码都可以直接从 JavaScript 文件中复制并粘贴到 TypeScript\
  \ 文件中，并且会被视为 TypeScript 代码。\n*   **TypeScript 中的 ES6 特性呢？**\n    我们很快就会介绍 ES6 特性。如果你正在使用\
  \ TypeScript，那么好消息是 TypeScript 具有类似的特性。\n    ![](img/Image41643.jpg)\n    **图 1.21**\n\
  \    事实上，TypeScript 还拥有额外的特性（例如：装饰器、泛型）。\n*   **TypeScript 编译后会生成什么样的 JavaScript\
  \ 代码？**\n    这取决于我们使用的 TypeScript 特性以及我们期望的输出目标版本。TypeScript 编译器提供了指定期望输出的 JavaScript\
  \ 目标版本的选项。如果 TypeScript 特性在 JavaScript 目标版本中可用，则会生成完全相同的代码。如果 TypeScript 特性在目标 JavaScript\
  \ 版本中不可用，TypeScript 编译器将生成相应的逻辑。\n*   **TypeScript 在 Angular 学习中扮演什么角色？**\n    正如我之前所说，Angular\
  \ 是一个 JavaScript 框架。要使用 Angular 创建应用程序，我们需要编写大量的 JavaScript 代码。我们知道，使用 TypeScript\
  \ 语言而不是 JavaScript 语言编写代码会让我们的工作更轻松。因此，建议使用 TypeScript 语言创建 Angular 应用程序。\n\n\n\n\
  \n这只是对 TypeScript 的快速概述。我们有一篇专门针对 TypeScript 的详细文章。\n\n### Node.js 在 Angular 应用开发中的作用\n\
  \n许多刚开始学习 Angular 的人会对 Node.js 感到困惑。他们误以为需要掌握 Node.js 才能学习 Angular。\n\n让我们澄清这个困惑。你不需要成为\
  \ Node 专家就能学习 Angular。\n\n我们不会在 Angular 应用中编写任何一行 Node.js 代码。\n\n**那么，我可以在对 Node.js\
  \ 了解不多的情况下创建 Angular 应用吗？**\n\n是的，完全可以。\n\n但这并不意味着我们完全不需要 Node.js。\n\n*   我们会安装\
  \ Node.js。\n*   使用 `npm`，我们将下载一个第三方 node 模块，并用它来创建 Angular 应用（我们将在后续文章中详细讨论）。\n\
  *   我们可能会根据需要，使用 `npm` 下载一些额外的 node 模块。\n*   我们可能会使用一些 `npm scripts` 来简化开发、构建和部署。\n\
  \n作为 Angular 开发者，你应该了解 `npm`、`package.json`、`npm scripts` 以及 node 模块的概念。这些就足够了。\n\
