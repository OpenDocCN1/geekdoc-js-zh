  现在，相同的代码可以使用 interpolation 编写如下：\n\n```\n1.  <input type=”text” value=”Hello, the\
  \ company name is {{CompanyName}}” />\n```\n\n你可以轻松地说，使用 interpolation 变得更容易。这给我们留下了一个问题：为什么我们需要属性绑定？\n\
  \n### 为什么使用属性绑定？\n\n首先，你应该知道 `interpolation` 在后台会被转换为 `property binding`。\n\n当值是非字符串值时，使用\
  \ interpolation 会遇到困难。为了证明这一点，做一件事：在我们的实验中，将 `Property binding` 改为 `interpolation`，然后检查输出。\n\
  \n我确信它不起作用。无论 `IsAddNew` 变量的值是什么，你一定注意到 `data-entry` div 始终不可见。\n\n因此，如果值是非字符串值，则首选输入属性，因为\
  \ interpolation 将所有内容解释为字符串。\n\n## 实验 – 继续\n\n### 步骤 25：将组件属性连接到表单控件\n\n首先，在组件类中创建两个属性。\n\
