  \ Angular 应用程序。\n\n*   我们决定使用 Visual Studio Code 作为 Angular 编码的代码编辑器。\n\n*   我们了解到，默认情况下，AppComponent\
  \ 将被视为应用程序的根组件，正如 AppModule 的 bootstrap 部分中所提到的。\n\n\n\n*   我们还了解到，默认情况下 `AppModule`\
  \ 是我们应用的根模块，因为它是在 `main.ts` 文件中被引导启动的。\n*   我们提到了 `ng build --prod` 命令，该命令用于编译应用并生成优化后的、可部署的文件。\n\
