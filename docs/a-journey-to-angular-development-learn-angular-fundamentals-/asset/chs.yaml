  \ 都让我们在 UI 中显示最新值。\n\n### 为什么使用 interpolation？\n\nInterpolation 使绑定更简单。\n\n假设我们在组件类中有一个变量\
  \ `CompanyName`，并且我们希望将其与一些硬编码字符串拼接后显示在文本框中。\n\n使用属性绑定，语法如下：\n\n```\n1.  <input\
