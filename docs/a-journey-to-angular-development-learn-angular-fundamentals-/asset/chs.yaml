  \n# 第二部分\n\n## 第 2 章：ES6 特性 – 第一部分\n\n## 引言\n\n希望你喜欢第一站的旅程。通过那段旅程，我们讨论了与 Angular\
  \ 学习相关的各种术语，例如 Node.js、`npm`、TypeScript 等。\n\n现在，我们身处第一站。我说，吃完你的早餐/午餐/晚餐，然后再次登上火车，因为我们将开始前往第二站的旅程。确保你已经准备好编码工具。这次，我们将进行大量的编码。\n\
  \n这次，全部是关于 ES6 的内容。我们将其拆分成多篇文章，这样就不会有人被一篇冗长的文章吓到。\n\n### 规划执行环境\n\n我们将学习 ES6，这意味着我们在学习更多的\
  \ JavaScript——因此我们需要一个执行环境。\n\n让我们试着回忆一下 JavaScript 有哪些运行时环境。我们有浏览器，还有 Node.js。我们会根据情况随机使用它们，看哪种最合适。\n\
  \n事不宜迟，让我们开始探索 ES6 的特性。\n\n## 变量声明\n\n到目前为止，我们一直使用 `var` 关键字在 JavaScript 中声明变量。现在有了\
  \ ES6，我们有了两种新的方式：`let` 和 `const`。让我们做一些演示来理解传统方式中的问题。\n\n#### 传统方式\n\n**演示 1**\n\
  \n创建一个 JavaScript 文件 `Variable_Declaration.js`，包含以下代码块：\n\n```javascript\n//Demo\
  \ 1\nconsole.log(a);\n```\n\n现在，花点时间思考一下，如果执行上述代码，输出会是什么。\n\n打开命令提示符，导航到上述文件所在的文件夹，并使用\
  \ `node` 命令执行它。由于变量未定义，我们将得到运行时错误。\n\n![](img/Image41758.jpg)\n**图 2.1**\n\n**演示\
  \ 2**\n\n现在将代码替换为以下代码，并尝试输出：\n\n```javascript\nvar a;\nconsole.log(a);\n```\n\n\
  ![](img/Image41766.jpg)\n**图 2.2**\n\n同样，这是非常预期的输出。在 JavaScript 中，如果变量被声明但从未赋值，默认值为\
  \ `undefined`。\n\n**演示 3**\n\n```javascript\n//Demo 3\nconsole.log(a);\nvar a;\n\
  ```\n\n![](img/Image41766.jpg)\n**图 2.3**\n\n现在预期输出是什么？逻辑上，我们应该得到“未定义错误”，因为我们在变量声明之前使用了它。让我们看看会得到什么。\n\
  \n![](img/Image41840.jpg)\n**图 2.4**\n\n为什么我们得到了 `undefined`？\n\n在 JavaScript 中，使用\
  \ `var` 关键字声明的变量会被提升。这个概念称为“提升”。无论你在哪里声明变量，它总是被视为顶级变量。简单来说，所有变量声明都会被提升到顶部。\n\n**演示\
  \ 4**\n\n```javascript\n//Demo 4\nconsole.log(a);\nvar a=8;\n```\n\n输出仍然是 `undefined`，因为我说的是变量声明被提升，而不是赋值。你可以将上述代码视为三步代码：\n\
  \n```javascript\n//Demo 4\nconsole.log(a);\nvar a;\na=8\n```\n\n只有第二行（即 `var a;`）被提升。\n\
  \n**演示 5**\n\n接下来，尝试以下代码：\n\n```javascript\n//Demo 5\nconsole.log(a);\nif(false)\
  \ {\n   var a;\n}\n```\n\n![](img/Image41766.jpg)\n**图 2.5**\n\n这次我们不应该得到运行时错误吗？如果不是\
  \ JavaScript，我们可能会说“是”，因为变量是在 `if` 块内部声明的。\n\nJavaScript 不支持块级变量（至少在使用 `var` 关键字声明时），因此所有在条件或迭代块内部声明的变量都会获得外部作用域。由于变量被提升，我们得到\
  \ `undefined` 作为输出。\n\n**演示 6**\n\n\n\n\n你必须清楚，使用 `var` 关键字声明的变量会提升（hoisting），并且不会被视作块级变量。让我展示一个因这种行为导致的实际问题。\n\
  \n假设我们有以下现有代码：\n\n```javascript\n//Demo 6\nvar a=10;\nconsole.log(a);\nif(true)\
  \ {\n    //Some logic\n}\nconsole.log(a);\n```\n\n两个 `console.log` 的输出都是 10。\n\n\
  现在，想象一下应用程序的一个新变更要求在 if 块内添加更多代码。新开发者对现有代码不太了解。\n\n假设他做了修改，最终得到以下代码：\n\n```javascript\n\
  //Demo 6\nvar a=10; // 旧代码 - 未受影响\nconsole.log(a); // 旧代码 - 未受影响 - 期望输出 10\nif(true){\n\
  \    //Some logic\n    var a=9; // 新代码\n    console.log(a); // 新代码 - 未受影响 - 期望输出\
  \ 9\n}\nconsole.log(a); // 旧代码 - 未受影响 - 期望输出 10\n```\n\n![](img/Image41924.jpg)\n\
  **图 2.6**\n\n使用 `node` 执行它并检查结果。\n\n新代码也影响了现有代码。\n\n![](img/Image41963.jpg)\n**图\
  \ 2.7**\n\n我知道你感到沮丧，因为这有点令人困惑且出乎意料。别担心。这就是为什么 ES6 引入了一种新的变量声明方式。\n\n### 使用 var 关键字创建私有变量\n\
  \n为此，我们需要创建函数。函数有自己的作用域。\n\n```javascript\n//Demo 7\nconsole.log(a);\nmyFunction();\n\
  function myFunction(){\n    var a;\n}\n```\n\n![](img/Image42000.jpg)\n**图 2.8**\n\
  \n如你所见，变量 `a` 在函数外部不可访问。这是在 JavaScript 中使变量私有的一种合理方式。\n\n### 新方式\n\nES6 的 `let`\
  \ 关键字将解决 `var` 关键字带来的所有问题。\n\n创建另一个文件 `Variable_Declaration2.js`，包含以下代码：\n\n# 演示\
  \ 1\n```javascript\n//Demo 1\nconsole.log(a);\nlet a;\n```\n\n![](img/Image42042.jpg)\n\
  **图 2.9**\n\n现在它强制我们在使用变量之前先声明。简而言之，现在没有提升。\n\n# 演示 2\n```javascript\n//Demo 2\n\
  if(true){\n   let a;\n}\nconsole.log(a);\n```\n\n![](img/Image42086.jpg)\n**图 2.10**\n\
  \n如你所见，现在变量被视为块级变量。\n\n#### 演示 3\n```javascript\n//Demo 3\nlet a=10; // 旧代码 - 未受影响\n\
  console.log(a); // 旧代码 - 未受影响 - 期望输出 10\nif(true){\n    //Some logic\n    let a=9;\
  \ // 新代码\n    console.log(a); // 新代码 - 未受影响 - 期望输出 9\n}\nconsole.log(a); // 旧代码\
  \ - 未受影响 - 期望输出 10\n```\n\n![](img/Image42130.jpg)\n**图 2.11**\n\n当变量使用 `let` 关键字声明时，生活就简单了。\n\
  \n### 常量变量\n\nES6 也支持常量变量。\n\n创建一个 JavaScript 文件 `Constant_Declaration.js`，包含以下代码块：\n\
  \n```javascript\nconst c=10;\nc=20\nconsole.log(c);\n```\n\n使用 `node` 命令执行它。\n\n\
  ![](img/Image42170.jpg)\n**图 2.12**\n\n如你所见，当我们试图改变变量的值时，得到了一个错误。\n\n（它与 `let` 关键字有相似的行为，即没有提升，变量被视为块级变量，但不允许改变值。）\n\
  \n### 面向对象编程\n\n有了 ES6，JavaScript 世界支持类。\n\n在 ES6 之前，JavaScript 中的面向对象编程并不直接。我们使用诸如\
  \ IIFE、闭包和构造函数等逻辑概念来实现面向对象风格的编码。ES6 引入了 `class` 关键字来创建类，就像其他编程语言一样。\n\n# 演示 1\n\
  创建一个新的 JavaScript 文件，命名为 `oops.js`，内容如下：\n\n```javascript\nclass Customer{\n   Save(){\n\
  \       console.log(“Customer Saved: “+this.CustomerName+”(“+this.Designation+”-”+this.CompanyName+”)”);\n\
  \   }\n}\n\nlet c=new Customer();\nc.CustomerName= ‘Sukesh Marla’;\nc.Designation=\
  \ ‘Director’;\nc.CompanyName= ‘Just Compile’;\nc.Save();\n```\n\n让我们分析代码：\n- 使用\
  \ `class` 关键字创建类。\n- 使用 `new` 关键字创建类的实例。\n- 使用点（`.`）运算符访问类成员。\n- 在类内部，使用 `this`\
  \ 关键字访问成员。\n\n对于任何面向对象程序员来说，这都是简单的代码。\n\n由于 JavaScript 是一种动态语言，无需在类内部显式声明 `CustomerName`\
  \ 和其他成员变量。当执行语句 `c.CustomerName = ‘SukeshMarla’` 时，类成员在运行时被创建。\n\n让我们使用 `node` 命令执行代码：\n\
  \n![](img/Image42246.jpg)\n**图 2.13**\n\n# 演示 2\n在演示 2 中，我们将学习如何创建构造函数。\n\n在 JavaScript\
  \ 中，构造函数语法非常不同。这里，我们不遵循“类名和构造函数名应匹配”的规则；相反，创建构造函数时使用 `constructor` 关键字。\n\n```javascript\n\
  //Demo2\nclass Customer{\n   constructor(CustomerName,CompanyName,Designation){\n\
  \       this.CustomerName=CustomerName;\n       this.CompanyName=CompanyName;\n\
  \       this.Designation=Designation;\n   }\n   Save(){\n       console.log(“Customer\
  \ Saved: “+this.CustomerName+”(“+this.Designation+”-”+this.CompanyName+”)”);\n \
  \  }\n}\n\nlet c=new Customer(“Dipesh Shinde”,”CEO”,”Just Compile”);\nc.Save();\n\
  ```\n\n![](img/Image42253.jpg)\n**图 2.14**\n\n#### 演示 3\n接下来，让我们做一个简单的继承示例。\n\n\
  ```javascript\n//Demo 3.1\nclass Customer{\n   constructor(CustomerName,CompanyName,Designation){\n\
  \       this.CustomerName=CustomerName;\n       this.CompanyName=CompanyName;\n\
  \       this.Designation=Designation;\n   }\n   Save(){\n       console.log(“Customer\
  \ Saved: “+this.CustomerName+”(“+this.Designation+”-”+this.CompanyName+”)”);\n \
  \  }\n}\nclass GoldCustomer extends Customer{\n}\n\nlet c=new GoldCustomer(“Parvez”,”Siddiqui”,”Technical\
  \ Architect”);\nc.Save();\n```\n\n我们在 JavaScript 中使用 `extends` 关键字进行继承。\n\n你注意到了吗？`GoldCustomer`\
  \ 类中没有定义任何构造函数，但我们在创建实例时传递了三个参数。\n\n嗯，这对于像 C++ 或 C# 这样的静态语言程序员来说是一种新行为。\n\n执行后，你将得到以下输出：\n\
  \n**你在想发生了什么吗？**\n\n![](img/Image42295.jpg)\n**图 2.15**\n\n基类构造函数被调用了。\n\n现在，让我们在派生类中创建一个空构造函数，并检查行为。\n\
  \n```javascript\n//Demo3.2\nclass Customer{\n   constructor(CustomerName,CompanyName,Designation){\n\
  \       this.CustomerName=CustomerName;\n       this.CompanyName=CompanyName;\n\
  \       this.Designation=Designation;\n   }\n   Save(){\n       console.log(“Customer\
  \ Saved: “+this.CustomerName+”(“+this.Designation+”-”+this.CompanyName+”)”);\n \
  \  }\n}\nclass GoldCustomer extends Customer{\n   constructor(){}\n}\nlet c=new\
  \ GoldCustomer(“Parvez”,”Siddiqui”,”Technical Architect”);\nc.Save();\n```\n\n![](img/Image42340.jpg)\n\
  **图 2.16**\n\n输出将是一个错误。\n\n规则说，在继承中，如果派生类有构造函数，“派生类构造函数必须显式调用基类构造函数。”\n\n让我们来做。\n\
  \n```javascript\n//Demo3.3\nclass Customer{\n```\n\n\n\n\n\n```\n   constructor(CustomerName,CompanyName,Designation){\n\
  \       this.CustomerName=CustomerName;\n       this.CompanyName=CompanyName;\n\
  \       this.Designation=Designation;\n   }\n   Save(){\n       console.log(“Customer\
  \ Saved: “+this.CustomerName+”(“+this.Designation+”-”+this.CompanyName+”)”);\n \
  \  }\n}\nclass GoldCustomer extends Customer{\n   constructor(){\n       super();\n\
  \   }\n}\n\nlet c=new GoldCustomer(“Parvez”,”Siddiqui”,”Technical Architect”);\n\
  c.Save();\n```\n\n让我们检查输出。\n\n![](img/Image42416.jpg)\n\n**图 2.17**\n\n**对输出感到疑惑？我们来理解一下。**\n\
  \n*   `GoldCustomer` 类的构造函数没有任何参数。因此，传递给构造函数的所有参数都被忽略了。\n*   父类（基类）的构造函数在未传递任何参数的情况下被调用。所以，`CustomerName`、`CompanyName`\
  \ 和 `Designation` 这三个变量都将获得 `undefined` 作为值。\n*   因此，我们得到了上述输出。\n\n将代码重写如下：\n\n\
  ```\n//Demo3.4\nclass Customer{\n   constructor(CustomerName,CompanyName,Designation){\n\
  \       this.CustomerName=CustomerName;\n       this.CompanyName=CompanyName;\n\
  \       this.Designation=Designation;\n   }\n   Save(){\n       console.log(“Customer\
  \ Saved: “+this.CustomerName+”(“+this.Designation+”-”+this.CompanyName+”)”);\n \
  \  }\n}\nclass GoldCustomer extends Customer{\n   constructor(CustomerName,CompanyName,Designation){\n\
  \       super(CustomerName,CompanyName,Designation);\n   }\n}\nlet c=new GoldCustomer(“Parvez”,”Siddiqui”,”Technical\
  \ Architect”);\nc.Save();\n```\n\n像之前一样执行它。\n\n![](img/Image42423.jpg)\n\n**图 2.18**\n\
  \n*   这一次，`GoldCustomer` 类有一个包含三个参数的构造函数。\n*   在 `GoldCustomer` 的构造函数中，我们调用了 `Customer`\
  \ 类的构造函数，并将这三个值作为参数传递。\n\n### 字符串插值\n\n这是 ES6 中一个虽小但令人兴奋且实用的特性。请看下面的演示：\n\n```\n\
  //Demo 1\nlet myName=”Sukesh Marla”;\nlet myCompany=”Just Compile”;\nconsole.log(“My\
  \ Name is “+myName+” and my company is “+myCompany)\n```\n\n![](img/Image42467.jpg)\n\
  \n**图 2.19**\n\n输出如下：\n\n这种编码方式的唯一问题在于拼接的困难。\n\n我们最终会用到大量的 `+`，这使得代码难以阅读且充满挑战。\n\
  \n例如，请看下面的代码：\n\n```\n//Demo 2\nlet myName=”Sukesh Marla”;\nlet myCompany=”Just\
  \ Compile”;\nconsole.log(“My Name is “+myName+” and my company is”+myCompany)\n\
  ```\n\n你能看出 `Demo 1` 和 `Demo 2` 之间的区别吗？\n\n如果看不出来，请检查上述代码的输出。\n\n![](img/Image42511.jpg)\n\
  \n**图 2.20**\n\n区别在于 `is` 和 `Just Compile` 之间少了一个空格。\n\n在 ES6 中，借助字符串插值，拼接变得更加方便。\n\
