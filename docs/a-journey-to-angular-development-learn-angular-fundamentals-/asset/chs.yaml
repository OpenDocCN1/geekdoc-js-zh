  \n1.  `……`\n2.  `   private Customers: Array<Customer>;`\n4.  `   private IsAddNewSubject:\
  \ BehaviorSubject<boolean>;`\n5.  `   IsAddNew$: Observable<boolean>;`\n6.  `  \
  \ Customers$: Observable<Array<Customer>>;`\n7.  `   constructor() {`\n8.  `   \
  \  this.IsAddNewSubject = new BehaviorSubject<boolean>(false);`\n9.  `     this.IsAddNew$\
  \ = this.IsAddNewSubject.asObservable();`\n10. `……`\n\n如上述代码所示，我们向 `BehaviorSubject`\
  \ 构造函数传递了 `false` 作为参数，因为我们希望默认值为 `false`。\n\n### 第 48 步：检查输出\n\n现在，借助前面讨论中使用的临时\
  \ header 标签来交叉验证输出。\n\n（测试后不要忘记删除临时代码。）\n\n## 讨论 – 续\n\n我们完成了吗？还是遗漏了什么？\n\n遗憾的是，还有一个容易被忽略但不应被忽视的问题。为了找出这个问题，我想分享一种在\
  \ Angular 中进行调试的新方法。\n\n请按以下步骤逐一操作：\n\n### 第 1 步：选择 Customer 组件\n\n打开 Chrome 开发者工具，导航到\
