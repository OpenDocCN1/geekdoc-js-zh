  \ *RxJS* 的 `map` 操作符。\n\n## 实验 – 继续\n\n### 步骤 62：使用 map 操作符\n\n使用 RxJS 的 map 操作符将实际响应转换为所需响应，如下所示：\n\
  \n```\n……\nimport {BehaviorSubject, Observable, Subject} from 'RxJS';\nimport {map}\
  \ from 'RxJS/operators';\nimport {Customer} from '../Models/customer';\n……\n   \
  \  this.httpClient\n       .get<Array<{firstName: string, lastName: string}>>('http://localhost:4000/customers',\
  \ {\n         headers: {'x-access-token': localStorage.token},\n      }).\n    \
  \   pipe(map(customerAPIResponse => {\n         return customerAPIResponse.map(customer\
  \ => new Customer(customer.firstName, customer.lastName));\n      }))\n       .subscribe((x)\
  \ => {\n         this.CustomersSubject.next(x);\n      });\n……\n```\n\n## 讨论 – 继续\n\
