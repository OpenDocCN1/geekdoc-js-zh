  #### 第 4 步 – 定义样式\n\n打开 `style.css` 并添加以下内容：\n\n```\ndiv{\n   padding: 20px;\n \
  \  margin-top: 10px;\n   border: 1px solid black;\n}\n```\n\n#### 第 5 步 – 运行应用程序\n\
  \n为了正确学习和理解变更检测，请使用 `ng serve --prod` 命令在生产模式下运行应用程序。\n\n![](img/Image58744.jpg)\n\
  \n**图 29.8**\n\n打开开发者工具。你会看到每个组件都输出了一条消息。由于变更检测在启动时会执行两次，因此你会看到每条消息出现两次。\n\n![](img/Image58779.jpg)\n\
  \n**图 29.9**\n\n#### 第 6 步 – 点击按钮\n\n清空控制台，然后点击任意组件中的按钮。\n\n你会发现，无论点击哪个按钮，每个组件的消息都会显示出来——这意味着每个组件都被重新渲染了。\n\
  \n![](img/Image58821.jpg)\n\n**图 29.10**\n\n#### 第 7 步 – 将应用程序与 zone.js 断开连接\n\n\
  让我们将应用程序与 `zone.js` 断开连接。\n\n为此，从 `polyfills.ts` 文件中移除导入语句，并将 `main.ts` 的内容修改如下：\n\
  \n```\nplatformBrowserDynamic().bootstrapModule(AppModule,{ngZone:'noop'})\n   .catch(err\
  \ => console.error(err));\n```\n\n#### 第 8 步 – 测试输出\n\n运行应用程序。初始消息仍然不受影响。\n\n清空开发者控制台，然后点击按钮。\n\
  \n由于上一步中移除了 `zone.js`，不再有变更检测的自动触发，因此你不会收到任何消息。\n\n#### 第 9 步 – 使用 tick 方法实现手动变更检测\n\
  \n在 `CustomerListComponent` 中注入 `ApplicationRef` 服务，并在 `HandleClick` 方法中执行 `tick`\
  \ 方法。\n\n```\nexport class CustomerListComponent{\n   constructor(private app: ApplicationRef){\n\
  \n  }\n   ……\n   HandleClick(): void  {\n     this.app.tick();\n  }\n}\n```\n\n\
  #### 第 10 步 – 测试输出\n\n点击 `CustomerListComponent` 中的按钮。\n\n虽然你得到了输出，但这并不是一个令人满意的输出。点击按钮后，每个组件都会被渲染，因为\
  \ `ApplicationRef.tick` 方法会触发整个层级中每个组件的变更检测。\n\n如果我们只想触发特定组件的变更检测，而不是整个层级，该怎么办？这可以通过一个名为\
  \ `ChangeDetectorRef` 的 Angular 服务来实现。\n\n#### 第 11 步 – 使用 ChangeDetectionRef 服务实现手动变更检测\n\
  \n在 `CustomerAddComponent` 中注入 `ChangeDetectionRef` 服务，并在 `HandleClick` 方法中触发变更检测，如下所示：\n\
  \n```\nexport class CustomerAddComponent {\n   constructor(private cd: ChangeDetectorRef){\n\
  \n  }\n……\n   HandleClick(): void  {\n     this.cd.detectChanges();\n  }\n```\n\n\
  #### 第 12 步 – 测试应用程序\n\n这一次，点击 `CustomerAddComponent` 内部的按钮。它只会显示 CustomerAddComponent\
  \ 的消息，这意味着只有 `CustomerAddComponent` 被渲染。\n\n## 从特定组件中分离变更检测\n\n通过使应用程序无 zone，我们影响了整个应用程序。如果我们只想对某个特定组件这样做呢？\n\
  \n这可以通过 `ChangeDetectorRef` 类的 `detach` 方法来实现。\n\n### 第 1 步 – 准备项目\n\n创建一个新项目 lab19-ng，然后像上一个项目一样创建\
  \ Customer、CustomerList、CustomerAdd 和 Product 组件。\n\n### 第 2 步 – 分离变更检测\n\n从 `CustomerListComponent`\
  \ 中分离变更检测，如下所示：\n\n```\nexport class CustomerListComponent implements OnInit {\n\
  \   constructor(private cd: ChangeDetectorRef) {}\n   ngOnInit(): void {\n     this.cd.detach();\n\
  \  }\n……\n```\n\n### 第 3 步 – 测试应用程序\n\n在生产模式下运行应用程序。\n\n**初始消息**\n\n分离变更检测器和无 zone\
  \ 的 Angular 是两件不同的事情。\n\n变更检测器负责检测 Angular 组件中的变化，而无 zone 的 Angular 则是关于禁用变更检测的自动触发。\n\
  \n![](img/Image58830.jpg)\n\n**图 29.11**\n\n这一次我们分离了变更检测器本身。因此，在加载应用程序时，控制台中不会出现\
  \ `CustomerListComponent` 的消息。\n\n（我相信你知道为什么消息会显示两次。我们已经多次提到过。）\n\n**点击按钮后的输出**\n\
  \n现在，点击组件内部的按钮。无论点击哪个按钮，输出始终如下：\n\n![](img/Image58877.jpg)\n\n**图 29.12**\n\n你可能对一件事感到有些困惑。\n\
  \n**为什么当点击 CustomerListComponent 内部的按钮时，其他组件也会渲染？**\n\n我们的应用程序仍然有 zone.js，因此每次事件发生后，`ApplicationRef`\
  \ 服务的 `tick` 方法会自动被调用。这将触发除 `CustomerListComponent` 之外的所有组件的变更检测（因为变更检测器已被分离）。\n\
  \n### 第 4 步 – 手动检测变化\n\n在 `CustomerListComponent` 的 `HandleClick` 方法中手动检测变化，如下所示：\n\
  \n```\n   HandleClick(): void {\n     this.cd.detectChanges();\n  }\n```\n\n###\
  \ 第 5 步 – 测试应用程序\n\n经过上述更改后，`CustomerList` 组件内部的按钮点击事件的行为略有不同。点击后，你会在控制台中看到 `CustomerListComponent`\
  \ 的消息以及其他组件的消息。\n\n## OnPush 变更检测策略\n\n还有另一种在组件级别控制变更检测的方法。即通过更改变更检测策略。默认策略使变更检测始终运行。\n\
  \n通过将其设置为 `OnPush`，我们将其限制为仅以下特定情况：\n\n*   当组件内触发事件时。\n*   当组件的输入属性引用发生变化时。\n*  \
  \ 当使用 `async` 管道消费的可观察对象发出新值时。\n\n### 第 1 步 – 将 OnPush 设置为 ChangeDetectionStrategy\n\
  \n打开 `CustomerAddComponent` 并将其变更检测设置为 `OnPush`，如下所示：\n\n```\n@Component({\n   selector:\
  \ 'app-customer-add',\n   templateUrl: './customer-add.component.html',\n   styleUrls:\
  \ ['./customer-add.component.css'],\n```\n\n\n\n\n\n## 步骤 2 – 执行应用程序\n\n你将看到以下输出：\n\
  \n### 初始执行\n\n![](img/Image58961.jpg)\n\n**图 29.13**\n\nAngular 首次为应用程序触发了变更检测。\n\
  \n在之前的某个步骤中，我们已经将变更检测器从 `CustomerListComponent` 中分离出来。\n\n因此，除了 `CustomerListComponent`\
  \ 之外，我们从每个组件都收到了消息。\n\n之后，`zone.js` 再次执行变更检测。这次，你还会发现 `CustomerAddComponent` 的消息也缺失了，因为它采用了\
  \ `OnPush` 策略。\n\n### 按钮点击 – 除 CustomerAddComponent 之外\n\n点击除 `CustomerAddComponent`\
  \ 按钮之外的所有按钮。你将看到以下输出：\n\n![](img/Image58996.jpg)\n\n**图 29.14**\n\n如你所见，没有显示 `CustomerList`\
  \ 和 `CustomerAddComponent`，因为我们已将变更检测器从其中一个组件分离，而另一个组件采用了 `OnPush` 作为默认策略。\n\n###\
  \ 点击 `CustomerAddComponent` 按钮\n\n你将看到以下输出：\n\n![](img/Image59062.jpg)\n\n**图 29.15**\n\
  \n在 `CustomerAddComponent` 内部事件触发后，我们收到了 `CustomerAddComponent` 的消息。\n\n这证明了 `OnPush`\
  \ 的第一点：当组件内部触发事件时，该组件的变更检测会被触发。\n\n## 步骤 3 – 创建一个类来保存数据\n\n创建一个简单的类 `CustomerAddData`，如下所示：\n\
  \n```\nexport class CustomerAddData{\n   CustomerName: string;\n}\n```\n\n## 步骤\
  \ 4 – 创建输入属性\n\n接下来，在 `CustomerAddComponent` 内部创建一个输入属性，如下所示：\n\n```\nexport class\
  \ CustomerAddComponent {\n   @Input() cData: CustomerAddData;\n   ……\n```\n\n##\
  \ 步骤 5 – 修改 CustomerComponent\n\n然后，在 `CustomerComponent` 中创建一个 `CustomerAddData`\
  \ 实例，并将其赋值给 `CustomerAddComponent` 的输入属性，如下所示：\n\n```\nexport class CustomerComponent\
  \  {\n   CustomerData: CustomerAddData={CustomerName:\"Sukesh\"};\n   ……\n```\n\n\
  ```\n<!-- customer.component.html -->\n<div>\n   {{GetMessage()}}\n   <input type=\"\
  button\" value=\"CustomerButton\" (click)=\"HandleClick()\">\n   <app-customer-list></app-customer-list>\n\
  \   <app-customer-add [cData]=\"CustomerData\"></app-customer-add>\n</div>\n```\n\
  \n## 步骤 6 – 重新定义 HandleClick 方法\n\n在 `CustomerComponent` 中重新定义 `HandleClick` 方法，如下所示：\n\
  \n```\nHandleClick(): void  {\n     this.CustomerData.CustomerName=\"ABCD\";\n \
  \ }\n```\n\n## 步骤 7 – 测试应用程序\n\n如果你期望在点击 `CustomerComponent` 中的按钮后看到 `CustomerAddComponent`\
  \ 重新渲染，那么说明你还没有正确理解变更检测的第二点。该点指出，只有当组件输入属性的引用发生改变时，变更检测才会被触发，而当前代码并没有做到这一点，它只是修改了对象本身。\n\
  \n## 步骤 8 – 改变引用\n\n在 `CustomerComponent` 中重新定义 `HandleClick` 方法，如下所示：\n\n```\n\
  \   HandleClick(): void  {\n     this.CustomerData.CustomerName=\"ABCD\";\n  }\n\
  ```\n\n## 步骤 9 – 测试输出\n\n这次，你会发现点击 `CustomerComponent` 中的按钮后，`CustomerAddComponent`\
  \ 的消息显示出来了。\n\n## 步骤 10 – 巩固你的技能\n\n证明变更检测的第三点将作为你的练习任务。\n\n到目前为止，我们已经完成了许多实验。我认为，现在你已经足够聪明，可以自己完成这个任务了。\n\
  \n*   创建一个服务。\n*   从中暴露一个 `Subject`。\n*   在 `CustomerAddComponent` 中使用 `async` 管道订阅该\
  \ `Subject`。\n*   在其他组件中让该 `Subject` 发出新数据。\n\n#### 总结\n\n在本章中，我们详细讨论了变更检测器。本章的内容并不要求你全部记住。只需记住，让\
  \ Angular 应用程序实现 *无 zone* 和 *OnPush*，变更检测可以显著提升应用程序性能。至此，我们结束了第 18 站的旅程。在开始第 19\
  \ 站的旅程之前，让我们快速回顾一下本章所学的内容：\n\n*   我们讨论了变更检测，它会遍历绑定、计算表达式、与之前的值进行比较，并在必要时更新 DOM。\n\
  *   我们了解到，默认情况下，在每个变更检测周期中，层级结构中的每个组件都会被检查是否有变化，并在需要时重新渲染。\n*   我们了解到，Angular 在应用程序初始化后首次执行变更检测。之后，每当\
  \ DOM 事件被触发、HTTP 请求完成、宏任务（如 `setTimeout` 和 `setInterval`）的回调方法执行完毕，或微任务（如 *Promise*）完成时，变更检测都会被触发。\n\
  *   我们了解到，Angular 已经对所有的底层 JavaScript API 进行了猴子补丁（monkey patching），并在这些 API 执行结束时显式地执行变更检测。Angular\
  \ 使用了 `zone.js` 库来实现猴子补丁。\n*   我们了解到，在开发模式下，变更检测默认执行两次。\n*   我们了解到，在开发模式下，Angular\
  \ 会执行两次变更检测。第一次运行时，DOM 会以最新的组件状态进行渲染；第二次运行时，它会确认 DOM 在上一次重新渲染后没有发生变化。如果发生了变化，我们会得到一个运行时错误——`ExpressionChangedAfterItHasBeenChecked`。\n\
  *   我们了解到，在应用程序初始化期间，变更检测会执行两次。这会产生以下可能性：\n    *   开发模式 + 应用程序初始化时间 = 变更检测将执行四次。\n\
  \    *   开发模式 + 其他变更检测触发器（如事件处理程序、宏任务等）= 变更检测将执行两次。\n    *   生产模式 + 应用程序初始化时间 =\
  \ 变更检测将执行两次。\n    *   生产模式 + 其他变更检测触发器（如事件处理程序、宏任务等）= 变更检测将只执行一次。\n*   我们明确了 `zone.js`\
  \ 与变更检测的执行方式或内部逻辑无关。它的核心目的是对底层 API 进行猴子补丁，以便在需要时自动触发变更检测。\n*   我们了解到，我们可以将 `zone.js`\
  \ 从 Angular 应用程序中断开，之后将不再有自动的变更检测触发。\n*   我们了解到，Angular 应用程序必须有一个 zone 来执行应用程序，因此移除\
  \ `zone.js` 会导致应用程序崩溃。我们演示了 `NoopNgZone`——这是 Angular 提供的一个 zone 对象，它不会像 `zone.js`\
  \ 那样对底层 API 进行猴子补丁。\n*   我们了解了 `ApplicationRef` 服务，它提供了 `tick` 方法，我们可以使用该方法在应用程序中显式触发变更检测。\n\
  *   我们讨论了 polyfills——这些库为现有的 JavaScript 添加了一些额外功能，并使不兼容的浏览器变得兼容。\n*   我们讨论了 `polyfill.ts`\
  \ 文件，我们会在其中导入期望应用程序拥有的 polyfills。默认情况下，创建应用程序时，它只包含一个针对 `zone.js` 的入口语句。\n*   我们讨论了\
  \ `ChangeDetectorRef` 服务，它允许我们为单个组件触发变更检测。\n*   我们了解到，我们可以使用 `ChangeDetectorRef`\
  \ 类的 `detach` 方法将变更检测器从特定组件中分离。\n*   我们研究了 `OnPush` 变更检测策略，该策略将变更检测限制为仅在以下某些情况下触发：\n\
  \n\n\n\n*   当事件在组件内部触发时。\n*   当组件输入属性的引用发生变化时。\n*   当使用 async 管道订阅的可观察对象发出新值时。\n\
  \n## 第 30 章\n\n### Angular 元素\n\n#### 简介\n\n在前往第 19 站的旅程中，我们将发现一个不那么出名但很有用的特性——Angular\
  \ 元素。\n\n#### 什么是 Angular 元素？\n\n你是否曾想过在非 Angular 项目中使用你的 Angular 组件？\n\n如果有，那么\
  \ Angular 元素就是实现这一目标的方式。Angular 元素是可以打包为自定义元素（即 Web 组件）的 Angular 组件。\n\n有了它，你就可以在任何地方使用你的组件，例如\
  \ React、Vue 等。\n\n#### 实验 20 – 创建 Angular 元素\n\n**步骤 1 – 创建一个新的 Angular 项目**\n\n\
  创建一个新的 Angular 项目 `lab20-ng`。\n\n**步骤 2 – 创建一个新组件**\n\n创建一个新的 Angular 组件 `MyReusable`。\n\
  \n```\nexport class MyReusableComponent {\n   Message = ‘Initial Message’;\n   constructor()\
  \ {}\n\n   ChangeMessage(): void {\n     this.Message = ‘Changed Message’;\n  }\n\
  }\n```\n\n```\n<h2>Message is : {{Message}}</h2>\n<input type=”button” value=”Change\
  \ Message” (click)=”ChangeMessage()”>\n```\n\n**步骤 3 – 使用组件**\n\n在 `AppComponent`\
  \ 中使用上述组件。\n\n```\n<!-- app.component.html -->\n<app-my-reusable></app-my-reusable>\n\
  ```\n\n**步骤 4 – 测试应用程序**\n\n使用 `ng serve` 命令运行应用程序，确保一切按预期工作。\n\n**初始输出**\n\n![](img/Image59143.jpg)\n\
  \n**图 30.1**\n\n**点击按钮后**\n\n![](img/Image59180.jpg)\n\n**图 30.2**\n\n**步骤 5 – 为\
  \ Angular 元素配置项目**\n\n如你所知，此项目的目标是创建一个 Angular 元素。\n\n为此，我们需要一个名为 `document-register-element`\
  \ 的库。\n\n可以使用 `npm install` 命令下载它，然后通过在 `polyfill.ts` 文件中导入它来将其包含在应用程序中。\n\n还有另一种更简单的方法。我们可以使用\
  \ `ng add @angular/elements` 命令，如下所示：\n\n![](img/Image59223.jpg)\n\n**图 30.3**\n\
  \n`ng add` 命令专门用于处理第三方库。它会下载库并更新 `package.json`，还会执行第三方库所需的应用程序中的其他必要配置。\n\n**步骤\
  \ 4 – 将 Angular 组件配置为 AngularModule**\n\n为此，在 `AppModule` 中定义一个构造函数，如下所示：\n\n```\n\
  import {Injector, NgModule} from ‘@angular/core’;\nimport {createCustomElement}\
  \ from ‘@angular/elements’;\nimport {BrowserModule} from ‘@angular/platform-browser’;\n\
  import {AppComponent} from ‘./app.component’;\nimport {MyReusableComponent} from\
  \ ‘./my-reusable/my-reusable.component’;\n\nexport class AppModule {\n   constructor(private\
  \ injector: Injector) {\n     const custom = createCustomElement(MyReusableComponent,\
  \ {\n       injector: this.injector,\n    });\n     customElements.define(‘my-custom-angular-element’,\
  \ custom);\n  }\n}\n```\n\n在上述代码中，我们在 `AppModule` 中注入了根模块的注入器实例，然后将 `MyReusableComponent`\
  \ 配置为 Angular 元素。\n\n**步骤 5 – 构建项目**\n\n像往常一样使用 `ng build` 命令构建项目，但这次要加上一个额外的标志。\n\
  \n![](img/Image59263.jpg)\n\n**图 30.4**\n\n你注意到 `--output-hashing none` 标志的作用了吗？\n\
  \n你还记得构建命令后生成的每个文件名后面都会附加一个哈希值吗？例如 `main.3a82886dd6c280a056fd.js`。\n\n现在这个哈希值不再存在了。\n\
  \n我们没有什么特别的原因要去掉这里的哈希值。这只是为了让名称更简单。\n\n**步骤 6 – 项目的示例 HTML 文件**\n\n为了测试上述 Angular\
  \ 元素，我们不需要一个 Angular 项目。\n\n![](img/Image59272.jpg)\n\n**图 30.5**\n\n为了确保你正确理解了这个概念，在机器上的某个位置创建一个名为\
  \ `Test-Angular-Elements` 的独立文件夹。\n\n然后在该文件夹内创建一个名为 `index.html` 的新 HTML 文件，并将以下内容放入其中：\n\
  \n```\n<!doctype html>\n<html lang=”en”>\n<head>\n     <title>Angular Elements Demo</title>\n\
  </head>\n<body>\n     <my-custom-angular-element></my-custom-angular-element>\n\
  \     <script src=”../lab20-ng/dist/lab20-ng/runtime.js” ></script>\n     <script\
  \ src=”../lab20-ng/dist/lab20-ng/polyfills.js” ></script>\n     <script src=”../lab20-ng/dist/lab20-ng/main.js”\
  \ ></script>\n</body>\n</html>\n```\n\n**步骤 7 – 测试 HTML 文件**\n\n在你选择的任何浏览器中打开上一步创建的\
