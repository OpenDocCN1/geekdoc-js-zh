  \n![](img/Image42467.jpg)\n\n**图 2.21**\n\n### 增强的对象字面量\n\n让我们通过一个演示来理解。\n\n```\n\
  let CustomerName=”Ramlal”;\nlet Address=”Ramgarh”;\nlet Customer={CustomerName:CustomerName,\
