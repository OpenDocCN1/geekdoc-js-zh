  \ `firstName` 和 `lastName` 的对象。\n\n请注意，你可以选择创建单独的类来保存 API 响应，这将是最佳实践。\n\n但在应用程序中，很多时候我们会遇到这样的情况：我们不想创建单独的类，但又需要一些动态的东西。在这种情况下，我们可以这样使用。\n\
