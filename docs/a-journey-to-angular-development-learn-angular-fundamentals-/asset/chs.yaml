  \ true，div 被动态创建。如果 `IsAuthenticatiionFailed` 变为 false，它又会再次被移除。\n\n![](img/Image49269.jpg)\n\
  \n**图 11.8**\n\n## 讨论 – 续\n\n现在我们已经准备好了初始 UI 相关的内容，包括凭据无效时应该发生什么，接下来的问题是：凭据有效时应该发生什么？\n\
  \n明确的答案是——成功登录后，我们应该重定向到 `CustomerComponent`，并维护一些状态来指示用户已通过身份验证。\n\n是时候引入一个新的 Angular\
  \ 概念了，叫做 `Angular Routing`。\n\n路由是许多技术中常用的术语。其核心思想是根据不同的 URL 在 UI 中显示不同的内容。我们向路由引擎提供一些数据，路由引擎根据这些数据为不同的\
  \ URL 显示 UI。\n\n## 实验 – 续\n\n**步骤 13：定义路由**\n\n首先，在 app 文件夹中创建一个名为 `Routes` 的文件夹。然后在该文件夹内创建一个文件\
  \ `app.routes.ts`，内容如下：\n\n```\nimport {Routes} from '@angular/router';\nimport\
  \ {LoginComponent} from '../Login/login.component';\nimport {CustomerComponent}\
  \ from '../Customer/customer.component';\nexport const AppRoutes:Routes=[\n   {path:'login',component:LoginComponent},\n\
  \   {path:'customer',component:CustomerComponent}\n];\n```\n\n这段代码是不是很直观？我们现在有两条简单的路由——当\
  \ URL 为 login 时，显示 `LoginComponent`；当 URL 为 customer 时，显示 `CustomerComponent`。\n\
  \n**步骤 14：导入 RouterModule**\n\n现在，要在 Angular 中配置路由，我们需要在 `AppModule` 中导入 `RouterModule`。\n\
  \n```\n……\nimport {RouterModule} from '@angular/router';\nimport {AppRoutes} from\
  \ './Routes/app.routes';\n@NgModule({\n   declarations: [AppComponent, CustomerComponent,LoginComponent],\n\
  \   imports: [BrowserModule, FormsModule,ReactiveFormsModule\n   ,RouterModule.forRoot(AppRoutes)],\n\
  \   providers: [],\n   bootstrap: [AppComponent],\n})\nexport class AppModule {}\n\
  ```\n\n如你所见，在导入 `RouterModule` 时，我们将 `Routes` 传递给了它。\n\n## 讨论 – 续\n\n如你所见，这次导入有些不同。这次我们没有在\
  \ `NgModule` 装饰器的 imports 部分提及类名，而是调用了 `RouterModule` 类的 `forRoot` 方法，并将我们的 `Routes`\
  \ 对象作为参数传递。这将在应用程序中配置路由。\n\n**这些不同的组件将在哪里显示？**\n\n我们在应用程序中配置了路由，指定了哪个 URL 对应哪个组件，但问题是，这些组件会在\
  \ UI 的哪个位置显示呢？\n\n这时，Angular 组件 `RouterOutlet` 就登场了。\n\n`RouterOutlet` 将作为其他组件的占位符。\n\
  \n是不是文字太多，让你感到困惑了？让我们直接进入实验，在那里讨论。\n\n## 实验 – 续\n\n**步骤 15：在 AppComponent 中添加占位符**\n\
  \n在前面的某个步骤中，我们将 `AppComponent` 中的 `CustomerComponent` 替换为了 `LoginComponent`。现在，让我们将\
  \ `LoginComponent` 替换为 `RouterOutletComponent`。\n\n```\n<!-- <customer></customer>\
  \ -->\n<!-- <login></login> -->\n<router-outlet></router-outlet>\n```\n\n在上述代码中，`router-outlet`\
  \ 是 `RouterOutletComponent` 的选择器。\n\n**步骤 16：检查输出**\n\n切换回浏览器，在 URL 后追加 \"`/login`\"\
  。\n\n你将看到 `LoginComponent`。\n\n![](img/Image49318.jpg)\n\n**图 11.9**\n\n![](img/Image49311.jpg)\n\
  \n**图 11.10**\n\n将 \"`/login`\" 替换为 \"`/customer`\"，你将看到 `CustomerComponent`。\n\n\
  ## 讨论 – 续\n\n让我们理解整个流程：\n\n![](img/Image49394.jpg)\n\n**图 11.11**\n\n1.  对于 SPA，第一个请求会发送到服务器。服务器会向客户端发送初始的\
  \ *HTML* 响应。对于 Angular 应用程序，它是一个包含 `AppComponent` 的 `index.html` 文件。\n\n2.  由于路由是在客户端配置的，路由系统会根据\
  \ URL 搜索匹配的路由。\n\n3.  根据路由信息，相应的组件会被加载到 UI 中。对于 Angular 应用程序，组件会被加载到 `RouterOutlet`\
  \ 中。\n\n## 实验 – 续\n\n**步骤 17：默认路由**\n\n你是否注意到了初始输出？我是说，当 URL 仅为 `http://localhost:[端口号]`\
  \ 时。\n\n它会显示一个漂亮的空白屏幕。\n\n让我们配置路由，使其在路径为空时返回 `LoginComponent`。为此，向我们的 `RouteCollection`\
  \ 添加更多路由，如下所示：\n\n```\n……\nexport const AppRoutes:Routes=[\n   {path:'login',component:LoginComponent},\n\
  \   {path:'customer',component:CustomerComponent},\n   {path:'',redirectTo:'login',pathMatch:'full'}\n\
  ];\n```\n\n## 讨论 – 续\n\n**什么是 pathMatch？**\n\n你可以跳过这个解释，因为它并不重要。\n\n当 `pathMatch`\
  \ 设置为 `full` 时，整个 URL 路径必须匹配，并且会被路由匹配算法消耗。\n\n## 实验 – 续\n\n**步骤 18：检查输出**\n\n切换回浏览器，将\
  \ URL 改为简单的 `http://localhost:[端口号]`，你应该会看到 `LoginComponent`。\n\n![](img/Image49432.jpg)\n\
  \n**图 11.12**\n\n**步骤 19：用随机字符串测试**\n\n现在，在 URL 中使用随机字符串测试应用程序。\n\n例如，尝试 `http://localhost:[端口号]/asd`\
  \ 并检查输出。\n\n我们会看到一个空白屏幕。打开开发者工具检查错误。目前，没有配置与指定当前 URL 模式匹配的组件。\n\n![](img/Image49471.jpg)\n\
  \n**图 11.13**\n\n**步骤 20：定义无效路由**\n\n\n\n\n在我们的 `RouteCollection` 中添加一条路由，用于支持无效路径。\n\
  \n```\n1.  `……`\n2.  `export const AppRoutes:Routes=[`\n3.  `   {path:’login’,component:LoginComponent},`\n\
  4.  `   {path:’customer’,component:CustomerComponent},`\n5.  `   {path:’’,redirectTo:’login’,pathMatch:’full’},`\n\
