  \ 第一个应用\n\n## 引言\n\n在上一站（Station 5）的旅程中，我们了解了创建 C Angular 应用的基础知识。\n\n相信我，真正的乐趣现在才开始。从本章开始，我们将逐步学习\
  \ Angular。这与我们学习 ES6 和 TypeScript 的方式截然不同。\n\n我们不会逐一讲解每个概念来学习 Angular。相反，我们将进行一些实际工作。我们会创建几个实验，每个实验都会引入一些新的\
  \ Angular 概念和新的挑战。每完成一个实验，你都会在旅程中前进到下一站。你甚至不会意识到自己已经到达终点，并成为了一名 Angular 开发者。\n\n\
  ## 我们将要创建什么？\n\n我们将创建一个基础的 Angular 应用，它会在一个 HTML 表格中显示一组内存中的记录，并提供添加新记录的功能。\n\n\
  ![](img/Image47457.jpg)\n\n**图 9.1**\n\n## 实验 1：理解基础的 Angular 应用\n\n**步骤 1：创建 Angular\
  \ 项目**\n\n使用 `ng` 创建一个新的 Angular 项目 `lab1-ng`，操作如下：\n\n1.  `ng new lab1-ng`\n\n\
  **步骤 2：检查应用**\n\n使用 `ng serve` 命令运行应用。\n\n1.  `ng serve --open`\n\n![](img/Image47466.jpg)\n\
  \n**图 9.2**\n\n## 讨论\n\n上述项目包含 `AppModule`（我们的 Angular 根模块）和 `AppComponent`（我们的\
  \ Angular 根组件）。\n\n下面是一些关于组件的要点。\n\n*   组件是 Angular 应用的基本构建块。整个 Angular 应用是由可复用、可组合的\
  \ Web 组件组合而成的。\n*   第一个组件，作为所有其他未来组件的容器，被称为根组件。按照惯例，它被命名为 `AppComponent`。\n\n  \
  \  例如，查看以下 Angular 应用中的组合。`AppComponent` 包含 `CustomerComponent`。`CustomerComponent`\
  \ 由 `CustomerAddComponent`、`HeaderComponent` 和 `FooterComponent` 组成。接着，`CustomerAddComponent`\
  \ 由 `Section1Component`、`Section2Component` 和 `Section3Component` 组成。最后，`Section3Component`\
  \ 由 `Widget1Component` 和 `Widget2Component` 组成。\n\n    ![](img/Image47536.jpg)\n\
  \n    **图 9.3**\n*   创建组件相当于教会你的浏览器一个新的 HTML 标签。通过构建它，你将创建一个新的 HTML 元素。\n\n在整本书中，我们将创建大量组件。所以请相信我，“*读完这本书，你将掌握组件导向设计。*”\n\
  \n目前不用担心 Angular 模块。\n\n## 实验 – 继续\n\n**步骤 3：创建新组件**\n\n在 `app` 文件夹内，创建一个名为 `customer`\
  \ 的新文件夹。\n\n然后在该文件夹中，创建一个 TypeScript 文件 `customer.component.ts`，内容如下：\n\n```\nimport\
  \ {Component} from ‘@angular/core’;\n\n@Component({\n   selector: ‘customer’,\n\
  \   templateUrl: ‘./customer.component.html’\n})\n\nexport class CustomerComponent\
  \ {\n}\n```\n\n## 讨论 – 继续\n\n上一步中创建的 `CustomerComponent` 类被称为*组件类*或*模板类*。它通过 `templateUrl`\
  \ 属性与一个模板文件连接。两者共同构成 Angular 组件。\n\n![](img/Image47584.jpg)\n\n**图 9.4**\n\n以下三点值得讨论：\n\
  \n*   你可能会问：“*为什么要建文件夹？*” 我们将组件创建在 Customer 文件夹内。将组件放在独立的文件夹中是行业标准。\n*   其次，你一定注意到了类文件名中的\
  \ `component.ts` 和模板文件名中的 `component.html`。你可能会问，这是必须的吗？再次强调，这只是行业中的一种实践。`.ts` 和\
  \ `.html` 是扩展名，而 `.component` 用于标识该文件包含组件。请注意，这不是硬性规定。你可以随意命名文件。\n*   `templateUrl`\
  \ 并不是将模板附加到组件类的唯一方式。有时你可能会看到 *template* 而不是 *templateUrl*。如果你的 HTML 很简单，你可以使用 *template*\
  \ 而不是 *templateUrl*，以减少创建另一个 HTML 文件并连接两者的开销。在实际开发中，大多数情况下我们都会使用 *templateUrl*。\n\
  \n## 实验 – 继续\n\n**步骤 4：模板文件**\n\n在 Customer 文件夹内创建一个文件 `customer.component.html`，内容如下：\n\
  \n1.  `<h1>Hello From Customer.</h1>`\n\n**步骤 5：使用组件**\n\n打开 `app.component.html`，并按如下方式使用\
  \ `CustomerComponent`：\n\n1.  `<h1>Simple Angular example</h1>`\n2.  `<customer></customer>`\n\
  \n**步骤 6：检查输出**\n\n切换回浏览器并查看输出。\n\n我们不是应该得到一些不同的输出吗？\n\n你觉得呢？会发生什么？\n\n![](img/Image47591.jpg)\n\
  \n**图 9.5**\n\n在进入下一步之前，我建议你给自己一些时间思考原因。\n\n![](img/Image47658.jpg)\n\n**图 9.6**\n\
  \n**步骤 7：检查错误**\n\n切换到命令提示符以检查错误。\n\n![](img/Image47665.jpg)\n\n**图 9.7**\n\n##\
  \ 讨论 – 继续\n\nAngular 中的每个组件都属于某个 Angular 模块。如果一个组件不属于任何 Angular 模块，它将无法使用，并且我们会收到“*不是已知元素错误*”。\n\
  \n要将组件添加到模块中，我们必须在模块的 `declarations` 部分中提及该组件。\n\n![](img/Image47700.jpg)\n\n**图\
  \ 9.8**\n\n请注意区分 *declarations* 和 *bootstrap*。在 *bootstrap* 部分中，只会提及根级组件，而在 *declarations*\
  \ 部分中，每个组件都会被声明。\n\n（目前不用担心系统中存在多个 Angular 模块，我们稍后会讨论。）\n\n## 实验 – 继续\n\n**步骤 8：将组件添加到模块**\n\
  \n打开 `app.module.ts`，并在 declarations 部分添加 `CustomerComponent`。\n\n```\n……\nimport\
  \ {AppComponent} from ‘./app.component’;\nimport {CustomerComponent} from ‘./Customer/customer.component’;\n\
  \n@NgModule({\n   declarations: [\n     AppComponent,CustomerComponent\n  ],\n……\n\
  ```\n\n**步骤 9：检查输出**\n\n切换到浏览器并查看输出。\n\n现在我们已经有了一个基础组件，让我们将其转换为符合需求的样子。从动态表格开始。\n\
  \n![](img/Image47736.jpg)\n\n**图 9.9**\n\n**步骤 10：创建模型**\n\n在 app 文件夹内创建一个名为 Models\
  \ 的文件夹，然后创建一个文件 `customer.ts`，内容如下：\n\n```\nexport class Customer {\n   constructor(public\
  \ FName:string, public LName:string) {\n  }\n}\n```\n\n## 讨论 – 继续\n\n*模型*是我们用来表示视图数据（即模板或\
  \ UI 中所需的数据）的标准命名。上一步中我们没有做任何特殊操作，只是一个简单的文件夹和一个简单的类。\n\n**步骤 11：填充模型**\n\n在 `CustomerComponent`\
  \ 的组件类中，创建一个类型为 `Customer` 数组的变量，并在类构造函数中填充一些虚拟值。\n\n```\nimport {Customer} from\
  \ “../Models/customer”\n……\nexport class CustomerComponent {\n     Customers:Array<Customer>;\n\
  \     constructor() {\n```\n\n\n\n\n\n6.  `this.Customers=new Array<Customer>();`\n\
  7.  `this.Customers.push(new Customer(“Sukesh”,”Marla”));`\n8.  `this.Customers.push(new\
  \ Customer(“Just”,”Compile”));`\n9.  `this.Customers.push(new Customer(“Ram”,”Lakhan”));`\n\
  10. `}`\n11. `……`\n\n## 讨论 – 续\n\n现在该介绍**插值**了。这是 Angular 的一个特性，用于在模板中显示动态内容。我们需要将表达式放在`{{`和`}}`之间，它会被求值并渲染。我们将在下一步中看到它的实际应用。\n\
  \n## 实验 – 续\n\n### 步骤 12：在模板中显示动态内容\n\n打开 `customer.component.html`，将内容替换为以下内容：\n\
  \n```\n1.  <h1>显示单个客户</h1>\n2.  <hr>\n3.  名字: {{Customers[0].FName}}<br>\n4.  姓氏:\
  \ {{Customers[0].LName}}\n```\n\n![](img/Image47781.jpg)\n\n**图 9.10**\n\n### 步骤\
  \ 13：检查输出\n\n看看浏览器中显示的内容。\n\n我们已经成功动态显示了集合中的第一个客户。这是我们的需求吗？我想不是。\n\n我们需要显示整个客户集合。\n\
  \n## 讨论 – 续\n\n现在该介绍**指令**了。\n\n指令是 Angular 的一个概念，用于扩展我们的 HTML。\n\n有以下三种指令：\n\n\
  1.  **组件指令**\n\n    你已经见过这种了。`AppComponent` 和 `CustomerComponent` 就是组件指令，也称为组件。创建它们就像创建新的\
  \ HTML 标签一样。\n\n2.  **属性指令**\n\n    顾名思义，它是一种属性。我们将其附加到其他 HTML 元素或 Angular 组件上，其默认行为会发生变化。\n\
  \n3.  **结构指令**\n\n    它们也是属性，但不会像属性指令那样改变 HTML 元素或 Angular 组件的默认行为。相反，它们会改变该元素的默认结构。\n\
  \n    在本书中，我们将看到所有三种指令的实际应用，包括我们自定义的指令。\n\n现在，让我们看看 `*ngFor`。不要漏掉那个 `*`。\n\n`*`\
  \ 表示它是一个*结构指令*。我们将其附加到一个元素上，它的结构就会改变。让我们通过演示来理解它。\n\n## 实验 – 续\n\n### 步骤 14：显示数组\n\
  \n将 `customer.component.html` 的内容更改为以下代码：\n\n```\n1.  <h1>客户列表</h1>\n2.  <table\
  \ border=”1”>\n3.     <tr>\n4.       <th>名字</th><th>姓氏</th>\n5.     </tr>\n6.    \
  \ <tr *ngFor=”let item of Customers”>\n7.       <td>{{item.FName}}</td><td>{{item.LName}}</td>\n\
  8.     </tr>\n9.  </table>\n```\n\n### 步骤 15：检查输出\n\n运行应用程序，确保客户列表显示出来。\n\n![](img/Image47831.jpg)\n\
  \n**图 9.11**\n\n## 讨论 – 续\n\n### `*ngFor`\n\n如你所知，`tr` 代表一个 HTML 行，但由于我们附加了 `*ngFor`\
  \ 指令，它的结构发生了变化。我们得到了三行，而不是一行，因为集合中有三个元素。\n\n看看赋给 `*ngFor` 的表达式。\n\n即 – `let item\
  \ of Customers`\n\n`item` 将持有单个 `Customer` 对象，并作为特定行的数据。它的值可以使用插值动态显示。\n\n我建议你在继续阅读之前，再多玩一下这个演示。\n\
  \n### Angular 模块\n\n你已经大致了解了*模块*的基本概念。\n\n*在一个模块内定义的任何内容都对该模块私有，并且无法在其他模块中访问。如果我们想让某些内容可用，必须显式地导入和导出。我们在\
  \ ES6 章节中已经看到过。*\n\n*模块几乎无处不在。ES6 有它，TypeScript 有它，甚至 Angular 也有它。它们都遵循相同的原则：对外部世界抽象掉不必要的东西。*\n\
  \n在 Angular 的世界中，Angular 模块是对组件、指令和管道的逻辑封装。\n\n（你还没有见过管道，所以暂时不用担心。）\n\n如果是这样，那么就会引出以下两个问题：\n\
  \n1.  `*ngFor` 指令封装在哪个 Angular 模块中？\n\n2.  为什么我们可以在 `CustomerComponent` 中使用 `*ngFor`？因为\
  \ `CustomerComponent` 是作为 `AppModule` 的一部分定义的，而 `*ngFor` 却不是。\n\n答案是，这是可能的，因为 `CustomerComponent`\
  \ 定义在 `AppModule` 内部，而 `AppModule` 导入了 `BrowserModule`，`BrowserModule` 又导出了 `*ngFor`。\n\
  \n***注意：*** 当我说 `BrowserModule` 导出了 `*ngFor` 时，你可能会认为 `*ngFor` 是作为 `BrowserModule`\
