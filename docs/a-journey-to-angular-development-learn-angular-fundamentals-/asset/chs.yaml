  \n**图 11.17**\n\n## 讨论 – 继续\n\n我们已经完成了几乎所有 UI 和导航步骤。现在，让我们启动服务器（REST API），进行实时身份验证。\n\
  \n首先，让我们了解身份验证在 SPA 中是如何工作的：\n\n**1 – 从服务器获取身份验证令牌**\n\n![](img/Image49684.jpg)\n\
  \n**图 11.18**\n\n![](img/Image49720.jpg)\n\n**图 11.19**\n\n**2 – 在客户端保护路由**\n\n\
  ![](img/Image49754.jpg)\n\n**图 11.20**\n\n![](img/Image49788.jpg)\n\n**图 11.21**\n\
  \n除非用户拥有有效的令牌，否则不允许访问受保护的路由。\n\n**3 – 保护服务器资源**\n\n到目前为止，我们通过 REST API 调用获取了身份验证令牌。这是我们到目前为止唯一的服务器调用。一个实时应用程序会有更多的\
  \ API 调用，例如很快我们将在 `CustomerComponent` 中发起 REST 调用，以将客户列表与动态数据绑定。\n\n很快你也会看到这一点。这些\
  \ API 与身份验证 API 的区别在于安全性。\n\n身份验证 API 对所有人开放，而其他 API 仅对经过身份验证的用户开放。因此，在进行 REST 调用时，必须在请求头中将令牌传递给服务器。服务器仅在令牌有效时返回响应，否则返回错误。\n\
  \n![](img/Image49849.jpg)\n\n**图 11.22**\n\n**上一步中的令牌是什么？**\n\n它是一个由服务器应用程序创建并返回给客户端的字符串值。令牌充当客户端的*身份证*。客户端在每次后续请求中将该令牌发送给服务器。\n\
  \n服务器验证令牌，仅当令牌有效且未过期时才返回响应。\n\n**如何确保令牌的安全性？**\n\n首先需要的是 SSL，它确保通过线路交换的所有数据都是加密的。\n\
  \n其次，它取决于我们遵循的令牌标准。最常用的是 JWT，即 JSON Web 令牌。\n\nJWT 的官方定义如下：\n\n\n\n\n\n“JSON Web\
  \ Token (JWT) 是一种开放标准（RFC 7519），它定义了一种紧凑且自包含的方式，用于在各方之间以 JSON 对象的形式安全地传输信息。由于该信息经过数字签名，因此可以被验证和信任。JWT\
  \ 可以使用密钥（通过 HMAC 算法）或使用 RSA 或 ECDSA 的公钥/私钥对进行签名。”\n\n由于它已签名，因此在传输过程中任何人都无法修改。\n\n\
  令牌还具有有效期。服务器在有效期过后会将令牌视为无效。\n\n我们是否要创建一个用于生成令牌的 REST API？\n\n我们不会从头构建 REST API。我们将为您提供一个示例演示用途的\
  \ REST API 代码，该代码会根据一些静态值验证用户名和密码，然后在用户有效的情况下返回 JWT 令牌作为响应。\n\n演示服务器代码在哪里？\n\n您将在下一步中了解。\n\
  \n## 实验 – 继续\n\n### 步骤 28：准备服务器\n\n请按照以下步骤启动您的演示服务器：\n\n1. 从本书的 GitHub 仓库的 `station\
