  \ 装饰器都可以配置模块注入器，而 `Component` 装饰器则配置元素注入器。\n\n\n\n\n\n*   我们了解到，无论配置了哪个注入器，每个依赖于其他服务的\
  \ Angular 服务都必须添加 `Injectable` 装饰器。\n*   我们了解到，根 `Injector` 会创建一个全局单例实例，而元素注入器则会创建特定于组件实例（及其子组件）的实例。\n\
  *   我们讨论了当 `provide` 和 `useClass` 值相同时，配置注入器的简短语法。\n*   我们学习了响应式编程，以及如何在 Angular\
  \ 中借助 RxJS 实现它。\n*   我们了解到，在响应式编程中，`Observable` 由 `Subscriber` 订阅，而 `Observer` 将数据馈送到\
  \ `Observable` 中。\n*   我们演示了 RxJS 的 `Subject`，它在响应式编程中同时代表 `Observable` 和 `Observer`。\n\
  *   我们了解到，在实际项目中，RxJS 的 `Subject` 会被标记为私有，而底层的 `Observable` 会作为公共成员暴露出来。\n\n## 第\
  \ 13 章\n\n## 取消订阅\n\n## 引言\n\n在本章中，我们将学习取消订阅 Observable 的重要性和步骤。\n\n## 为什么要取消订阅？\n\
  \n重要的一点是，无论你使用什么技术栈，当涉及观察者模式时，取消订阅与订阅同样至关重要。想象一下，有几个订阅者订阅了我们的 Observable，而其中一些订阅者不再对接收通知感兴趣。\n\
  \n或者更确切地说，假设某些订阅者甚至已经不存在了。在这种情况下，保持活跃的订阅还有意义吗？当然没有。保留所有不必要的订阅可能会导致内存泄漏。\n\n*最佳实践是，一旦不再需要订阅，就应该取消订阅。否则，会导致内存泄漏。*\n\
  \n## 在 Angular 中何时以及如何取消订阅？\n\n**如何取消订阅 RxJS Observable 订阅？**\n\n幸运的是，RxJS 的 `Subscription`\
  \ 提供了一种取消订阅的方法。我们很快就会看到演示。\n\n**我们应该何时取消订阅？**\n\n下一个问题是，在我们的应用程序中，我们应该何时取消订阅。\n\n\
  在我们的案例中，一旦成功登录，我们会重定向到 `CustomerComponent`，这将销毁 `LoginComponent`。一旦 `LoginComponent`\
  \ 被销毁，之后就没有必要再保留对 `invalidCredentialsObservable$` 的订阅了。\n\nAngular 提供了各种生命周期事件，其中之一是\
  \ `ngOnDestroy`，它会在组件被销毁时执行。这是执行取消订阅的完美位置。\n\n随着我们的深入，我们将探索其他生命周期事件。\n\n## 实验 –\
  \ 续 – 取消订阅\n\n**第 22 步：实现 ngOnDestroy 方法**\n\n这是一个两步过程。首先，让 `LoginComponent` 类实现\
  \ `OnDestroy` 接口，这将强制你定义 `ngOnDestroy` 方法。\n\n```\nimport {Component, OnDestroy}\
  \ from '@angular/core';\n……\nexport class LoginComponent implements OnDestroy {\n\
  ……\nngOnDestroy(): void {\n}\n……\n```\n\n**第 23 步：取消订阅**\n\n同样是一个两步过程。首先，将订阅保存在一个全局变量中，然后在\
  \ `ngOnDestroy` 方法中取消订阅。\n\n```\n……\nimport {FormControl, FormGroup, Validators}\
  \ from '@angular/forms';\nimport {Subscription} from 'rxjs';\n……\nexport class LoginComponent\
  \ implements OnDestroy {\ninvalidCredentialsSubscription: Subscription;\n……\nconstructor(private\
  \ authenticationService: AuthenticationService) {\nthis.invalidCredentialsSubscription\
  \ = this.authenticationService.invalidCredentialsObservable$.subscribe(\n(x) =>\
  \ {\nthis.IsAuthenticatiionFailed = x;\n}\n);\n}\nngOnDestroy(): void {\nthis.invalidCredentialsSubscription.unsubscribe();\n\
  }\n……\n```\n\n## 讨论 – 续\n\n现在你已经理解了取消订阅的重要性，是时候研究一种更好的方法来实现同样的目的了。这可以通过使用 **async\
  \ 管道** 来完成。\n\n**什么是 Angular 管道？**\n\n*管道* 是 Angular 的一个概念，用于在组件模板中转换数据。\n\n**什么是\
  \ async 管道？**\n\nAsync 管道是一个 Angular 管道，它在内部订阅 *observable* 并返回该 **observable**\
  \ 发出的最新值。当组件被销毁时，最棒的是 async 管道会自动取消订阅，以避免潜在的内存泄漏。\n\n例如，假设我们有一个 observable `ABCD`，它会返回一些值，并且这些值需要在\
  \ UI 中显示。已知的方法如下：\n\n```\n//在组件类中\nthis.somesubsctiption = ABCD.subscribe(\n(x)\
  \ => {\nthis.myValue = x;\n}\n);\n……\nngOnDestroy(): void {\nthis.invalidCredentialsSubscription.unsubscribe();\n\
  }\n<!-- 在模板中 -->\n<span>{{myValue}}</span>\n```\n\n使用 async 管道，则如下所示：\n\n```\n<span>{{ABCD\
  \ | async}}</span>\n```\n\n以上两种方法中，你觉得哪一种更简单？\n\n让我们在我们的应用程序中实现更好的那一种。\n\n## 实验\
  \ – 续\n\n**第 24 步：实现 Async 管道**\n\n这将是一个三步过程：\n\n*   在第 1 步中，我们将从 `LoginComponent`\
  \ 中移除不必要的代码。\n*   在第 2 步中，我们将在 `LoginComponent` 中创建一个新的全局变量来保存表示无效凭据的 observable。\n\
  *   最后，在第 3 步中，我们将在模板中使用 async 管道。\n\n让我们来实现它。\n\n```\nexport class LoginComponent\
  \ // implements OnDestroy\n/* 阅读：不需要实现 OnDestroy，\n因为取消订阅将由 async 管道处理 */\n{\n/*\
  \ 阅读：不需要保存订阅，因为 observable\n会在组件销毁时自动取消订阅 */\n\n// invalidCredentialsSubscription:\
  \ Subscription;\n\nloginForm = new FormGroup({\nUserName: new FormControl('', [\n\
  Validators.required,\nValidators.minLength(6),\n]),\nPassword: new FormControl('',\
  \ [\nValidators.required,\nValidators.minLength(6),\n]),\n});\n\n/* 阅读：不需要布尔变量，\n\
  而是需要 Observable 布尔值 */\nIsAuthenticatiionFailed$: Observable<boolean>;\n// IsAuthenticatiionFailed:\
  \ boolean;\n\nconstructor(private authenticationService: AuthenticationService)\
  \ {\n\n// this.IsAuthenticatiionFailed = false;\nthis.IsAuthenticatiionFailed$ =\
  \ this.authenticationService.invalidCredentialsObservable$;\n\n/* 阅读：不需要手动订阅，\n\
  async 管道会处理订阅 */\n\n// this.invalidCredentialsSubscription = this.authenticationService.invalidCredentialsObservable$.subscribe(\n\
  // (x) => {\n// this.IsAuthenticatiionFailed = x;\n// }\n// );\n}\n// ngOnDestroy():\
  \ void {\n// this.invalidCredentialsSubscription.unsubscribe();\n// }\nlogin() {\n\
  this.authenticationService.authenticate(this.loginForm.value);\n}\n}\n```\n\n最后，让我们在模板中使用\
  \ async 管道。\n\n```\n<div class=\"alert alert-danger\"\n*ngIf=\"IsAuthenticatiionFailed$|async\"\
  \ >\n无效的用户名或密码\n</div>\n```\n\n**第 25 步：检查输出**\n\n你将得到类似的输出。只是代码变得更加简洁。\n\n####\
  \ 总结\n\n这是一个非常简单的章节，讨论了取消订阅。在本章中，我们涵盖了 Angular 中的以下主题：\n\n*   我们了解到取消订阅非常重要，否则会导致内存泄漏。\n\
  \n\n\n\n\n*   我们学习了如何取消订阅 RxJS 订阅。\n*   我们了解了 Angular 组件的 `ngOnDestroy` 生命周期事件。\n\
  *   我们简要讨论了 Angular 管道。它用于封装 Angular 中的转换逻辑（有专门的一章介绍）。\n*   最后，我们讨论了 async 管道。\n\
  \n## 第 14 章\n\n## 登出与路由守卫清理\n\n## 引言\n\n在本章中，我们将对之前的实验进行一些清理——遵循最佳实践、消除冗余等。\n\n\
  ## 实验 – 续 – 登出与路由守卫\n\n**第 26 步：重构登出**\n\n在上一步中，我们重构了身份验证逻辑。接下来，让我们重构登出代码。\n\n在\
  \ `AuthenticationService` 中创建一个新的 `logout` 方法，如下所示：\n\n```\n……\n@Injectable()\n\
  export class AuthenticationService {\n……\n   logout(){\n     localStorage.clear();\n\
  }\n……\n```\n\n**第 27 步：修改 CustomerComponent**\n\n接下来，将 `AuthenticationService` 注入到\
  \ `CustomerComponent` 中，然后修改 `CustomerComponent` 中的登出方法，如下所示：\n\n```\n……\nexport\
  \ class CustomerComponent {\n……\n   constructor(private authenticationService: AuthenticationService)\
  \ {\n     const decodedToken = jwt_decode(localStorage.token);\n……\n  }\n……\n  \
  \ logout() {\n    this.authenticationService.logout();\n  }\n……\n```\n\n**第 28 步：检查输出**\n\
  \n运行应用程序。尝试使用正确的凭据登录，但奇怪的是，应用程序不会重定向到 `CustomerComponent`。\n\n打开开发者工具。你会看到“No provider\
  \ for AuthenticationService”错误。\n\n## 讨论 – 续\n\n目前，我们为 `LoginComponent` 配置了 `AuthenticationService`\
  \ 的元素注入器。\n\n因此，`LoginComponent` 可以访问 `AuthenticationService`，但这并不会让 `CustomerComponent`\
  \ 也能访问 `AuthenticationService`。\n\n**如何实现这一点？**\n\n只有在现有应用程序中执行以下操作之一才能实现：\n\n1.\
  \  为 `CustomerComponent` 的元素注入器配置 `AuthenticationService` 提供者。\n2.  不为 `LoginComponent`\
  \ 配置元素注入器，而是为 `AppComponent` 配置元素注入器。\n3.  使用 `NgModule` 装饰器为根注入器配置 `AuthenticationService`\
  \ 提供者。\n4.  使用带有 `{providedIn: ‘root’}` 参数的 `Injectable` 装饰器为根注入器配置 `AuthenticationService`\
  \ 提供者。\n\n**方式 1**\n\n如果采用第一种方法，最终会创建两个 `AuthenticationService` 实例——一个用于 `LoginComponent`，一个用于\
  \ `CustomerComponent`。\n\n`AuthenticationService` 是一种在应用程序中会反复需要的服务。因此，建议保持一个应用程序范围的实例，而不是多个。因此，不推荐这种方法。\n\
  \n**方式 2、3、4**\n\n假设我们采用前面提到的其他任何一种方式。那么，`LoginComponent` 中就不需要提供者了。这三种方法都会产生一个\
  \ `AuthenticationService` 的单例实例，该实例将可供整个应用程序使用。\n\n**方式 2 – 为什么是单例？**\n\n正如我之前所说，从技术上讲，元素注入器使服务实例可用于特定组件及其所有子组件。当组件实例被销毁时，该服务实例也会被销毁。有趣的是，`AppComponent`\
  \ 是我们的根组件，因此它永远不会被销毁。所以，最终在根组件上注册的服务在逻辑上成为了全局单例实例。\n\n但是，使用元素注入器来实现单例实例并不是行业中的常见做法（尽管你可以这样做）。因此，我们必须选择方式\
  \ 3 或方式 4。\n\n**方式 3 与方式 4 的比较**\n\n这两种方式都能达到目的。它们会配置根注入器，从而维护单个服务。\n\n最大的问题是，在方式\
  \ 3 和方式 4 之间应该选择哪一个。\n\n`providedIn: 'root'` 是在 Angular 6 中引入的，并且是推荐的做法。在此之前，配置根注入器的唯一可用选项是使用\
  \ `NgModule` 装饰器。\n\n**为什么推荐使用 Injectable 装饰器？**\n\n当使用 `Injectable` 来配置注入器时，如果该服务在应用程序中从未被使用，它就不会被包含在最终构建中。这个概念称为\
  \ Tree Shaking。\n\n我们很快就会讨论使用 `NgModule` 配置注入器的重要性。\n\n## 实验 – 续\n\n**第 29 步：从 LoginComponent\
  \ 中移除提供者**\n\n首先，打开 `LoginComponent` 类并移除 providers。\n\n**第 30 步：注册根注入器**\n\n使用\
  \ `Injectable` 装饰器注册根注入器，如下所示：\n\n```\n……\n@Injectable({providedIn: ‘root’})\nexport\
  \ class AuthenticationService {\n……\n```\n\n**第 31 步：检查输出**\n\n运行应用程序，确认登录和登出都能正常工作。\n\
  \n**第 32 步：重构守卫**\n\n既然我们正在重构所有内容，那么也来重构我们的守卫。\n\n将 `isAuthenticated` 和 `isTokenExpired`\
  \ 方法从 `AuthGuard` 类移动到 `AuthenticationService` 类。\n\n```\nimport {JwtHelperService}\
  \ from “@auth0/angular-jwt”;\n@Injectable({providedIn: ‘root’})\nexport class AuthenticationService\
  \ {\n……\n   isAuthenticated(): boolean {\n     const token = localStorage.token;\n\
  \     return token!=null || token!=undefined;\n  }\n   isTokenExpired(): boolean{\n\
  \     const helper = new JwtHelperService();\n     return helper.isTokenExpired(localStorage.token)\n\
  \  }\n   logout(){\n     localStorage.clear();\n  }\n}\n```\n\n之后，使用 `AuthenticationService`\
  \ 重构 `AuthGuard`，如下所示：\n\n```\n@Injectable({providedIn: ‘root’})\nexport class AuthGuard\
  \ implements CanActivate {\n   constructor(\n     private router: Router,\n    \
  \ private authenticationService: AuthenticationService\n  ) {}\n   canActivate(route:\
  \ ActivatedRouteSnapshot, state: RouterStateSnapshot) {\n     if (!this.authenticationService.isAuthenticated()\
  \ ||\n       this.authenticationService.isTokenExpired()\n    ) {\n       this.router.navigate([‘login’]);\n\
  \       return false;\n    }\n     return true;\n  }\n}\n```\n\n**第 33 步：检查输出**\n\
  \n测试更改总是好的。尝试在没有正确登录的情况下直接导航到 `CustomerComponent`。如果你被重定向到 LoginComponent，那么一切正确。\n\
  \n**第 34 步：自动聚焦**\n\n你是否厌倦了每次页面刷新时都需要手动将光标放入 `UserName` 文本框？\n\n这可以纯粹使用 HTML 解决，不需要\
  \ Angular 的功能。\n\n只需将 autofocus 属性附加到任何输入控件上，当页面加载时，焦点就会自动设置到该控件上。\n\n```\n  <label\
  \ for=”UserName”>User Name: </label>\n         <input class=”form-control” autofocus\n\
  \         [ngClass]=”{‘is-valid’:loginForm.\n……\n```\n\n**第 35 步：检查输出**\n\n现在，每次刷新页面时，焦点都会自动设置在\
  \ `UserName` 文本框上。\n\n**第 36 步：按回车提交**\n\n目前应用程序中另一个烦人的地方是 `Login` 点击。每次提交时我们都必须手动点击。最终用户通常更喜欢按回车键。同样，这可以纯粹用\
  \ HTML 实现。\n\n这将是一个两步过程：\n\n\n\n\n\n首先，将登录按钮从标准按钮转换为提交按钮。\n\n```\n<input type=”submit”\
  \ class=”btn btn-success” value=”Login”\n       (click)=”login()”  [disabled]=”loginForm.invalid”\
  \ >\n```\n\n接下来，不要使用`div`作为所有表单控件的容器，而是使用`form`标签。\n\n```\n    ……\n     <h5 class=”card-header”>Login</h5>\n\
  \     <!-- <div class=”card-body” [formGroup]=”loginForm”> -->\n       <form  class=”card-body”\
  \ [formGroup]=”loginForm”>\n       <div class=”form-group”>\n         <div class=”alert\
  \ alert-danger” *ngIf=”IsAuthenticatiionFailed$|async” >\n    ……\n```\n\n### 第 37\
  \ 步：检查输出\n\n刷新登录页面。输入一些凭据，然后按键盘上的*Enter*键。如果你正确遵循了每一步，现在应该能看到预期的输出。\n\n（目前不要尝试在`CustomerComponent`中实现相同的解决方案。它不会起作用。我们稍后会做。）\n\
  \n#### 总结\n\n本章主要关于如何让代码变得更好。我们还涉及了一些令人兴奋的内容。让我们再次回顾一下：\n\n*   我们了解了通过将现有代码移到服务中，在服务中编写逻辑的重要性。\n\
  \n*   我们在本章中再次复习了元素注入器和模块注入器。由于元素注入器无法满足我们的需求，我们切换到了模块注入器。\n\n*   我们了解到`AppComponent`的元素注入器会间接创建一个全局单例实例，因为它作为根组件永远不会被销毁。其次，作为根组件，它创建的服务实例对所有子组件都是可访问的。\n\
  \n*   我们了解到，在配置根注入器时，`Injectable`装饰器比`NgModule`装饰器更受青睐，因为`Injectable`装饰器支持摇树优化。摇树优化是\
  \ Angular 构建过程中的一个步骤，确保所有未使用的服务从最终打包文件中移除。\n\n*   我们了解到，我们可以通过使用 HTML 的`autofocus`属性、`form`标签和`submit`按钮来利用\
  \ Angular 中的 HTML 能力。\n\n## 第 15 章\n\n### 客户服务\n\n#### 简介\n\n在本章中，通过创建`CustomerService`，我们将把项目提升到一个新的水平。\n\
  \n#### 实验 – 续 – CustomerService\n\n##### 第 38 步：使用 CustomerService 清理 CustomerComponent\n\
  \n在`Services`文件夹中创建一个新文件`customer.service.ts`，内容如下：\n\n```\nimport {Injectable}\
  \ from ‘@angular/core’;\nimport {Observable, of} from ‘RxJS’;\nimport {Customer}\
  \ from ‘../Models/customer’;\n@Injectable()\nexport class CustomerService {\n  \
  \ private Customers: Array<Customer>;\n\n   IsAddNew$: Observable<boolean>;\n  \
  \ Customers$: Observable<Array<Customer>>;\n   constructor() {\n     this.IsAddNew$\
  \ = of(false);\n\n     this.Customers = new Array<Customer>();\n     this.Customers.push(new\
  \ Customer(‘Sukesh’, ‘Marla’));\n     this.Customers.push(new Customer(‘Just’, ‘Compile’));\n\
  \     this.Customers.push(new Customer(‘Ram’, ‘Lakhan’));\n\n     this.Customers$\
  \ = of(this.Customers);\n  }\n   setAddNew(){\n     this.IsAddNew$ = of(true);\n\
  \  }\n   setList(){\n     this.IsAddNew$ = of(false);\n  }\n   Save(customer: Customer)\
  \ {\n     this.Customers.push(customer);\n     this.Customers$ = of(this.Customers);\n\
  \     this.IsAddNew$ = of(false);\n  }\n}\n```\n\n## 讨论 – 续\n\n你可能期望有一些 API 调用。请耐心等待。\n\
  \n我们很快就会用动态 API 调用替换掉虚拟逻辑。\n\n我们已经看到了使用`HttpClient`服务的示例，并了解到它返回可观察对象。订阅者订阅该可观察对象以获取响应。我们设计了带有虚拟逻辑的`CustomerService`，以便以后创建真实逻辑时可以轻松适应。现在不用担心这个。我们稍后会讨论。\n\
  \n#### 代码解释\n\n*   `of`是一个`RxJS`方法，它从值创建一个可观察对象。\n\n*   我们将`IsAddNew`和`Customers`封装在可观察对象中，这些可观察对象将由`CustomerComponent`订阅。\n\
  \n你会发现`CustomerComponent`中几乎所有的逻辑现在都成为了`CustomerService`的一部分。\n\n## 实验 – 续\n\n####\
