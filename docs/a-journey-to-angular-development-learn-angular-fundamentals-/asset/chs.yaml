  \n## 讨论 – 继续\n\n**你觉得这看起来像一个具有不同逻辑的属性型指令吗？**\n\n如果你的答案是肯定的，那么你是对的。\n\n**我们是否说过在本实验开始时我们将创建一个结构型指令？**\n\
  \n是的，我们说过了。\n\n从逻辑上讲，属性型指令和结构型指令都是作为属性附加到现有元素上的。它们根据用途进行区分：一个添加某些行为，另一个修改结构。通常，你会发现所有结构型指令都使用星号（`*`）符号编写。\n\
  \n我们很快就会探讨星号（`*`）背后的秘密。\n\n## 实验 – 继续\n\n### 步骤 6 – 添加更改授权的按钮\n\n手动更改本地存储的值一定非常烦人。因此，让我们在\
  \ `AppComponent` 中为此创建一个输入按钮，如下所示：\n\n```\n  <input type=”button” value=”Change\
  \ Authorization” (click)=”Change()”>\n  CurrentValue:{{CurrentAuthorization}}<br>\n\
  \  <input type=”button” value=”Add new record” appOnlyIfUserIsAuthorized >\n  ……\n\
  \  export class AppComponent {\n     title = ‘lab11-ng’;\n     CurrentAuthorization\
  \ = localStorage.IsAuthorized;\n     Change(): void {\n         localStorage.IsAuthorized\
  \ =\n  localStorage.IsAuthorized === ‘true’ ? false : true;\n        this.CurrentAuthorization\
  \ = localStorage.IsAuthorized;\n    }\n  }\n```\n\n这是一个简单的代码。每次单击按钮时，本地存储中的值都会被反转。\n\
  \n### 步骤 7 – 执行应用程序\n\n你会惊讶地发现，单击按钮后，DOM 中的授权部分不会改变。执行硬刷新，你会看到变化。\n\n![](img/Image57180.jpg)\n\
  \n**图 26.8**\n\n## 讨论 – 继续\n\n**上述情况的确切原因是什么？**\n\n到目前为止，我们已将 DOM 操作逻辑写在 `ngOnInit`\
  \ 中。\n\n`ngOnInit` 是一个 Angular 生命周期事件，在 Angular 指令初始化时执行。初始化仅在开始时发生一次，这意味着 `ngOnInit`\
  \ 只执行一次。单击按钮后，该代码不会运行，因此 UI 不会改变。\n\n我们需要其他东西。有一个名为 `ngOnChanges` 的事件。让我们尝试一下。\n\
  \n## 实验 – 继续\n\n### 步骤 8 – 实现 ngOnChanges\n\n不要从 `OnInit` 接口实现，而是从 `OnChanges` 接口实现指令。然后，按如下方式定义\
  \ `ngOnChanges` 方法：\n\n```\nngOnChanges(changes: SimpleChanges): void {\n     const\
  \ isAuthorized = true;\n     if (localStorage.IsAuthorized !== ‘true’) {\n     \
  \  const pNode = this.renderer.createElement(‘div’);\n       const txtNode = this.renderer.createText(‘Not\
  \ authorized!!!’);\n       this.renderer.appendChild(pNode, txtNode);\n       this.renderer.appendChild(this.ele.nativeElement.parentElement,\
  \ pNode);\n       this.renderer.removeChild(this.ele.nativeElement.parentElement,this.ele.nativeElement);\n\
  \    }\n  }\n```\n\n### 步骤 9 – 检查输出\n\n这同样无法达到目的。经过上述更改后，输出不会改变。\n\n## 讨论 – 继续\n\
  \n**ngOnChanges**\n\n`ngOnChanges` 在 `ngOnInit` 方法之后执行一次，之后当指令的数据绑定属性发生变化时，它会被执行。\n\
  \n目前，我们的指令没有任何数据绑定属性，因此 `ngOnChanges` 仅在开始时执行。\n\n**ngDoCheck 解决方案**\n\n我们确实有一个专门用于此类情况的独特生命周期方法——`ngDoCheck`。\n\
  \n它会在每次变更检测时执行。\n\n现在不必担心变更检测。只需理解变更检测负责更新 DOM，并且在 DOM 事件发生后自动发生。\n\n让我们回顾一下到目前为止我们看到的所有生命周期事件。\n\
  \n*   `Constructor` 和 `ngOnInit` 仅在组件或指令构建时执行一次。\n\n    （请注意，`ngIf` 指令和路由会根据需要销毁和创建组件/指令。这两个方法在每次创建组件/指令时都会执行。）\n\
  \n*   `ngOnChanges` 在 `ngOnInit` 方法之后运行一次，之后当指令的数据绑定属性发生变化时，它会被执行。\n\n*   `ngAfterViewInit`\
  \ 在视图完全初始化后执行。当你需要访问组件中的 DOM 元素时使用它。（还记得 *第 22 章* 中的焦点示例吗？）\n\n*   `ngDestroy` 在组件/指令被销毁时执行，用于清理操作。（还记得我们销毁订阅的示例吗？）\n\
  \n*   `ngDoCheck` 在每次变更检测时执行。\n\n对于我们的情况，`ngDoCheck` 最合适。\n\n### 步骤 10 – 实现 ngDoCheck\n\
  \n移除 `ngOnChanges` 并添加 `ngDoCheck`，如下所示：\n\n```\nexport class OnlyIfUserIsAuthorizedDirective\
  \ implements DoCheck {\n   constructor(\n     private ele: ElementRef,\n     private\
  \ renderer: Renderer2\n  ) {}\n   ngDoCheck(): void {\n     const isAuthorized =\
  \ true;\n     if (localStorage.IsAuthorized !== ‘true’) {\n       const pNode =\
  \ this.renderer.createElement(‘div’);\n       const txtNode = this.renderer.createText(‘Not\
  \ authorized!!!’);\n       this.renderer.appendChild(pNode, txtNode);\n       this.renderer.appendChild(this.ele.nativeElement.parentElement,\
  \ pNode);\n       this.renderer.removeChild(this.ele.nativeElement.parentElement,this.ele.nativeElement);\n\
  \    }\n  }\n}\n```\n\n### 步骤 11 – 检查输出\n\n现在按如下方式测试应用程序：\n\n1.  打开开发者工具，将 `IsAuthorized`\
  \ 本地存储的值更改为 `true`。\n\n2.  现在刷新浏览器。你应该能够看到授权部分。\n\n3.  现在单击 `Change Authorization`\
  \ 按钮。它将反转本地存储的值，使授权部分被替换为“`Not authorized!!!`”消息。\n\n4.  现在再次单击 `Change Authorization`\
  \ 按钮。奇怪的是，你无法恢复授权部分。如果你检查本地存储中的值，会发现它已更新为 `true`。\n\n5.  再次单击 `Change Authorization`\
  \ 按钮。你会在控制台中发现以下错误：\n\n    ![](img/Image57341.jpg)\n\n    **图 26.9**\n\n## 讨论 –\
  \ 继续\n\n**这里到底发生了什么？**\n\n当用户未授权时，元素会从 DOM 中**移除**，并插入新元素。\n\n**移除**是一个关键词。由于它被移除了，下次将不再可用，这就是导致之前显示的奇怪输出的原因。\n\
  \n使用指令处理 DOM 操作场景的最佳方法是使用 `ViewContainerRef` 和 `TemplateRef` 服务。\n\n让我们先看看它的实际效果，然后进行详细讨论。\n\
  \n\n\n\n\n## 实验 – 续\n\n### 步骤 12 – 将新服务注入指令\n\n在指令中注入 `ViewContainerRef` 和 `TemplateRef`，并按如下方式移除\
  \ `ngDoCheck` 中的代码：\n\n```\nconstructor(\n     private vc: ViewContainerRef, private\
  \ tc: TemplateRef<any>) {}\n   ngDoCheck(): void {\n  }\n```\n\n### 步骤 13 – 将授权内容包裹在\
  \ ng-template 中\n\n在 `AppComponent` 中，将授权内容包裹在 ng-template 内，如下所示：\n\n```\n<ng-template>\n\
  \   <input type=”button” value=”Add new record” >\n</ng-template>\n```\n\n暂时不用担心\
  \ `appOnlyIfUserIsAuthorized` 指令。我们很快就会让它重新发挥作用。\n\n### 步骤 14 – 检查输出\n\n你会发现，无论用户是否被授权，ng-template\
  \ 内部的内容都不会渲染到屏幕上。\n\n你可能会认为这些内容默认应该被渲染。\n\n但事实并非如此，我们来讨论一下原因。\n\n## 讨论 – 续\n\n##\
  \ ng-template、TemplateRef 和 ViewContainerRef\n\n`ng-template` 指令代表一个 Angular 模板。\n\
  \n通常，模板指的是一种 DOM 结构，它本身不会独立存在。它们会在运行时与其他 DOM 元素组合在一起。\n\n### 这个定义难以理解吗？\n\n别担心。只需记住，`ng-template`\
  \ 内部定义的内容不会自动成为 DOM 的一部分。它会在代码中手动使用，并插入到某个位置。\n\n## TemplateRef 和 ViewContainerRef\
  \ – 两位英雄\n\n`TemplateRef` 服务会提供对 `ng-template` 内部定义内容的引用。\n\n`ViewContainerRef`\
  \ 代表一个容器，可以将一个或多个视图附加到组件上。\n\n继续演示；之后事情会变得简单得多。\n\n## 实验 – 续\n\n### 步骤 15 – 附加指令\n\
  \n将 `appOnlyIfUserIsAuthorized` 指令附加到 `ng-template` 上，如下所示：\n\n```\n……\n<ng-template\
  \ appOnlyIfUserIsAuthorized >\n   <input type=”button” value=”Add new record” >\n\
  </ng-template>\n```\n\n如果你还记得，之前的 `appOnlyIfUserIsAuthorized` 指令是附加在按钮上的。现在我们把它移到了\
  \ ng-template 上。\n\n### 步骤 16 – 定义 ngDoCheck\n\n按如下方式实现 `ngDoCheck`：\n\n```\n……\n\
  \   ngDoCheck(): void {\n     const isAuthorized = true;\n     if (localStorage.IsAuthorized\
  \ !== ‘true’) {\n       this.vc.clear();\n    }\n     else{\n       this.vc.clear();\n\
  \       this.vc.createEmbeddedView(this.tc);\n    }\n  }\n```\n\n如你所见，当用户被授权时，模板会被动态嵌入到视图容器中；如果用户未被授权，视图容器会被清空。\n\
  \n`TemplateRef` 服务为我们提供了指令所附加的 `ng-template` 的引用，而 `ViewContainerRef` 则提供了容器的引用，我们可以在其中动态添加更多视图。\n\
  \n### 步骤 17 – 检查输出\n\n只需检查输出，当 `IsAuthorized` 为 true 时，你会看到“*Add new record*”；当\
  \ `IsAuthorized` 为 false 时，它会消失。\n\n## 讨论 – 续\n\n输出中存在一个大问题。你注意到了吗？如果你认为这是用户未授权时缺少消息的问题，那并不是我们要讨论的。我们很快就会用更好的方式解决那个问题。这是一个更大的问题，**即\
  \ *ngDoCheck* 会在每次变更检测时执行。**\n\n这是问题吗？这不正是我们一直想要的吗？\n\n也许是的，但并非在所有变更检测期间都如此。\n\n\
  这是什么意思？\n\n你注意到我们在 *if* 和 *else* 块中都调用了 *clear* 方法吗？你有没有问过自己为什么这样？\n\n*if* 块是有意义的，因为它代表未授权部分，在这种情况下，我们期望它被清空，但为什么\
  \ *else* 块中也有它？\n\n如果不在 *else* 块中调用 *clear* 方法，每次变更检测发生时，都会向容器中插入一个新元素。你可以自己验证一下。\n\
  \n从 *else* 块中移除那个 *clear* 方法调用。\n\n在开发模式下，Angular 在开始时执行两次变更检测。所以，你会在开始时看到两个按钮。（现在不用担心这个。）\n\
  \n假设你的 MouseOverDirective 仍在生效，将光标移到该指令所附加的那个元素上。你会注意到，每次移动光标时，都会多创建一个元素。移出光标时也是如此。\n\
  \n这就是为什么在 *if* 和 *else* 块中都要调用 *clear* 方法的原因。\n\n这是正确的方法吗？\n\n不，每次变更检测时移除元素并重新创建，从性能角度来看非常糟糕。我们需要一种更优雅的方式。\n\
  \n这是一个逻辑问题，可以使用一个简单的 *Boolean* 变量来解决。\n\n## 实验 – 续\n\n### 步骤 18 – 修改 ngDoCheck\n\
  \n声明一个布尔变量 `IsViewCreated`，初始值为 false，并在 `ngDoCheck` 中使用它。\n\n```\n   IsViewCreated\
  \ = false;\n   ngDoCheck(): void {\n     const isAuthorized = true;\n     if (localStorage.IsAuthorized\
  \ !== ‘true’ && this.IsViewCreated) {\n       this.vc.clear();\n       this.IsViewCreated\
  \ = false;\n    } else if (localStorage.IsAuthorized !== ‘false’ && !this.IsViewCreated)\
  \ {\n       this.vc.createEmbeddedView(this.tc);\n       this.IsViewCreated = true;\n\
  \    }\n  }\n```\n\n### 步骤 19 – 检查输出\n\n现在一切应该都能正常工作。\n\n在我的咨询经验中，我经常发现这个问题——不必要的\
  \ DOM 操作，这会导致应用程序变慢，有时可以通过简单的逻辑来避免。\n\n## 讨论 – 续\n\n接下来，如果用户未授权，我们需要重新显示那条缺失的消息。\n\
  \n为此，我们首先创建一个自定义组件，然后动态加载它。\n\n是时候学习新东西了——**动态加载组件**。\n\n这可以通过一个名为 *ComponentFactoryResolver*\
  \ 的 Angular 服务来实现。\n\n让我们开始行动。\n\n## 实验 – 续\n\n### 步骤 20 – 创建 CustomMessageComponent\n\
  \n使用 Angular CLI 创建一个名为 `CustomMessageComponent` 的新 Angular 组件，然后在其中创建一个名为 `Message`\
  \ 的 `Input` 属性，并在模板中使用它。\n\n```\n……\nexport class CustomMessageComponent implements\
  \ OnInit {\n   @Input() Message: string = ‘Default message’;\n……\n```\n\n```\n<b>{{Message}}</b>\n\
  ```\n\n### 步骤 21 – 将 ComponentFactoryResolver 注入指令\n\n```\nimport {\n   ComponentFactoryResolver,\n\
  \   ……\n} from ‘@angular/core’;\n……\nexport class OnlyIfUserIsAuthorizedDirective\
  \ implements DoCheck {\n   constructor(\n     private vc: ViewContainerRef,\n  \
  \   private tc: TemplateRef<any>,\n     private resolver: ComponentFactoryResolver,\n\
  \  ) {}\n……\n```\n\n### 步骤 22 – 重新定义 ngDoCheck\n\n是时候施展一些魔法了。\n\n```\nngDoCheck():\
  \ void {\n     const isAuthorized = true;\n     if (localStorage.IsAuthorized !==\
  \ ‘true’ && this.IsViewCreated) {\n       this.vc.clear();\n       const MessageComponentFactory\
  \ = this.resolver.resolveComponentFactory(\n         CustomMessageComponent\n  \
  \    );\n       const MessageComponent = this.vc.createComponent(MessageComponentFactory);\n\
  \       MessageComponent.instance.Message = ‘Not Authorized!!!’;\n       this.IsViewCreated\
  \ = false;\n    } else if (localStorage.IsAuthorized !== ‘false’ && !this.IsViewCreated)\
  \ {\n       this.vc.createEmbeddedView(this.tc);\n       this.IsViewCreated = true;\n\
  \    }\n  }\n```\n\n只需查看前面代码中的 `if` 块。它包含了所有的魔法。\n\n\n\n\n仅需两行代码，组件即可动态创建并加载。\n\n\
  你会在 `else` 代码块中再次看到对 clear 方法的调用。这是必需的，因为我们需要移除动态创建的组件。（但我们的布尔变量确保逻辑不会在每次不必要的变更检测时执行。）\n\
  \n**第 23 步 – 检查输出。**\n\n非常棒，不是吗？前面的代码完美运行。你将看到“*未授权！！！*”重新出现在操作中。\n\n## 讨论 – 续\n\
  \n我非常确信，你内心的开发者仍然不满意。他/她仍然渴望更多。他/她还在思考我们在 `*ngIf` 和 `*ngFor` 指令中使用的那个特殊的星号（*）符号。\n\
  \n让我展示给你看，而不是解释。\n\n## 实验 – 续\n\n**第 24 步 – 修改 AppComponent。**\n\n打开 `AppComponent`，并按如下方式修改你的授权部分：\n\
  \n```\n<input type=”button” value=”添加新记录” *appOnlyIfUserIsAuthorized >\n```\n\n\
  （请注意：这里没有 `ng-template`。）\n\n**第 25 步 – 检查输出。**\n\n什么都不会改变。你仍然会得到相同的输出。\n\n## 讨论\
  \ – 续\n\n当我们把星号（*）放在指令前面时，Angular 会自动创建 `*ng-template`，附加指令，并将内容（本例中的输入按钮）放入 `*ng-template`\
  \ 中。\n\n简而言之，它将前面的代码转换为以下代码：\n\n```\n<ng-template appOnlyIfUserIsAuthorized >\n\
  \   <input type=”button” value=”添加新记录” >\n</ng-template>\n```\n\n使用星号（*）被称为微语法。它让我们在使用结构型指令时更加轻松。\n\
  \n#### 总结\n\n通过本章，我们完成了 Angular 中的一个重要概念。没有自定义指令，我无法想象任何 Angular 项目。至此，我们结束了第 15\
  \ 站的旅程。我们离终点已经很近了，只剩下五站。让我们回顾一下本章学到的内容：\n\n*   我们在本章学习了指令。它们扩展了现有的 HTML。\n*   我们了解到\
  \ Angular 有三种类型的指令。\n*   第一种称为元素指令，允许我们创建新的 HTML 标签。元素指令在 Angular 中也可以称为组件。\n* \
  \  第二种是属性指令，允许我们扩展现有 HTML 元素的行为。`ngClass` 和 `ngStyle` 是这类指令的典型例子。\n*   第三种是结构型指令，允许我们改变现有\
  \ HTML 元素的结构。结构型指令与属性指令类似，会作为属性附加到 HTML 元素上。\n*   我们了解到，通常结构型指令会以 * 前缀附加到 HTML 元素上。例如\
  \ – `*ngFor`、`*ngIf`。\n*   我们学习了为指令指定选择器的不同方式 – 属性选择器、ID 选择器、CSS 选择器和元素选择器。\n* \
  \  我们演示了 Angular 中的 `ElementRef` 服务，用于引用指令所附加的 HTML 元素。\n*   我们学习了 Angular 中的 `Render2`\
  \ 服务，它提供了处理 DOM 操作的各种方法。\n*   我们再次理解了为什么 `ngOnInit` 方法更适合初始化逻辑。我们了解到，*构造函数* 在创建类的对象时执行，而\
  \ `ngOnInit` 在组件/指令初始化后执行。这里，初始化意味着实例已创建，并且所有属性都已用父组件传递的值初始化。\n*   我们学习了参数化的 Input\
  \ 装饰器，它允许我们以不同的名称将组件/指令的属性暴露给外部世界。\n*   我们学习了 `HostListner` 装饰器，它允许我们处理指令所附加元素的事件。\n\
  *   我们学习了 Angular 的 `ngOnChanges` 生命周期事件，每当组件数据绑定属性的值发生变化时，它就会执行。\n*   我们学习了 Angular\
  \ 的 `ngDoCheck` 生命周期事件，它在每次变更检测时执行。\n*   我们讨论了用于创建 Angular 模板的 `ng-template`。Angular\
  \ 模板不会自动渲染。它们会在运行时根据某些自定义逻辑在其他 DOM 元素内部使用和渲染。\n*   我们学习了 `TemplateRef` 服务，它提供了 `ng-template`\
  \ 内部定义内容的引用。\n*   我们看到了 `ViewContainerRef` 服务的实际应用，它提供了一个容器的引用，可以将一个或多个视图附加到该容器上。\n\
  *   我们学习了 `ComponentFactoryResolver` 服务，它可以用于在运行时动态加载组件。\n*   我们讨论了指令的微语法，它消除了显式创建\
  \ `ng-template` 元素的负担。\n\n## 第 27 章：Angular 表单\n\n## 引言\n\n我们前往第 16 站的旅程将是一次自学课程。\n\
  \n在前面的章节中，我们已经介绍了模板驱动表单和响应式表单的基础知识。\n\n在学习任何技术时，我坚信 RND（研究与开发）起着关键作用。\n\n当我们遇到困难时，我们会在互联网上搜索答案：\n\
  \n*   这会让我们找到一些论坛、文章或视频。\n*   这会向我们介绍一些新的、未知的、未曾接触过的概念。\n*   这会将我们的技能提升到新的水平。\n\n\
  因此，我非常相信 RND 在学习和技术方面扮演着非常重要的角色。\n\n考虑到这一点，我希望你能自己创建类似下面的内容：\n\n![](img/Image57433.jpg)\n\
  \n**图 27.1**\n\n它包含了你在任何项目中通常能看到的所有内容。\n\n用两种方式创建它——一种是模板驱动方式，另一种是响应式方式。\n\n在实际项目中，对于如此复杂的表单，不推荐使用模板驱动方式。模板驱动方式适用于没有太多验证的小型表单。但这并不能保证你永远不会遇到使用模板驱动方式的复杂项目。因此，最好用两种方式完成这个实验。\n\
  \n最后，你可以从 Git 仓库下载相应的示例。\n\n考虑到你已经诚实地完成了所有内容，现在你已经准备好前往第 17 站——Angular 样式。\n\n##\
  \ 第 28 章：Angular 样式\n\n## 引言\n\n在前往第 17 站的旅程中，我们将学习如何在 Angular 中处理样式表。\n\n### 外部样式表\n\
  \n你一定注意到了 Angular 应用中有一个名为 `angular.json` 的文件。它是 Angular CLI 的配置文件。诸如 `ng serve`\
  \ 和 `ng build` 等命令都是使用该文件中的设置执行的。\n\n![](img/Image57444.jpg)\n\n**图 28.1**\n\n该文件中定义的一个重要部分是\
  \ builds/styles 部分。\n\n默认情况下，你会在该部分找到 `style.css` 的条目。\n\n它充当 Angular 应用的全局 CSS\
  \ 文件。在其中定义的样式将在整个应用中可用。我们在前面某一章中已经看到过它的实际应用。\n\n#### 可以有多个外部样式表文件吗？\n\n是的，有以下三种方式可以实现：\n\
  \n1.  在 `Index.html` 中使用 link 标签包含它。\n2.  使用 CSS @import。\n3.  在 `angular.json`\
  \ 文件中导入。\n\n第一种方式非常简单。使用 `link` 标签将外部 CSS 文件包含在 `index.html` 中。\n\n```\n<link rel=”stylesheet”\
  \ href=”mystyle.css”>\n```\n\n让我们看看另外两种方式。\n\n**第 1 步 – 创建一个项目。**\n\n\n\n\n使用 `ng`\
  \ 命令创建一个新的 Angular 项目 `lab15-ng`。\n\n#### 步骤 2 – 创建一个组件。\n\n创建一个名为 `ExternalCSSTestComponent`\
  \ 的新组件，然后将其包含在 `AppComponent` 中。（删除 `AppComponent` 的现有内容。）\n\n```\n<!-- 外部 CSS 测试组件\
  \ -->\n<p class=”MyClass1 MyClass2”>Hello World!!!</p>\n```\n\n```\n<!-- 应用组件 -->\n\
  <app-external-csstest-component></app-external-csstest-component>\n```\n\n#### 步骤\
  \ 3 – 创建一个新的 CSS 文件。\n\n在 `src` 文件夹中创建一个名为 `mystyle.css` 的新 CSS 文件，并放入以下内容：\n\n\
  ```\n.MyClass2{\n   font-weight: bold;\n}\n```\n\n#### 步骤 4 – 更新 style.css\n\n使用\
  \ CSS @Import 规则在 `style.css` 中导入 `mystyle.css`，然后创建一个新的 CSS 类，如下所示：\n\n```\n@import\
  \ \"mystyle.css\";\n.MyClass1{\n   border:1px solid black;\n}\n```\n\n#### 步骤 5\
  \ – 测试输出\n\n执行应用程序。你将看到一个带有黑色边框的粗体“Hello World!!!”——粗体来自 `mystyle.css`，边框来自 `style.css`。\n\
  \n#### 步骤 6 – 构建应用程序。\n\n使用 `ng build --prod` 命令构建应用程序。\n\n执行命令后，你将找到一个名为 `style.***.css`\
  \ 的单个 CSS 文件。\n\n打开该文件并检查其内容。\n\n```\n.MyClass2{font-weight:700}.MyClass1{border:1px\
  \ solid #000}\n```\n\n如你所见，`style.css` 和 `mystyle.css` 的内容现在被捆绑到一个文件中。\n\n让我们看看如果导入多个\
  \ CSS 文件会发生什么。\n\n#### 步骤 7 – 创建一个新的 CSS 文件。\n\n在 `src` 文件夹中创建一个新的 CSS 文件 `color.css`。\n\
  \n```\n.MyClass3{\n   color: red;\n}\n```\n\n#### 步骤 8 – 更新 ExternalCSSTestComponent\n\
  \n在 `ExternalCSSTestComponent` 中应用这个新的 CSS 类，如下所示：\n\n```\n<!-- 外部 CSS 测试组件 -->\n\
  <p class=”MyClass1 MyClass2 MyClass3”>Hello World!!!!</p>\n```\n\n#### 步骤 9 – 导入新的\
  \ CSS 文件\n\n与之前类似，在 `style.css` 中导入 color.css，如下所示：\n\n```\nimport \"mystyle.css\"\
  ;\n@import \"color.css\";\n.MyClass1{\n   border:1px solid black;\n}\n```\n\n####\
  \ 步骤 10 – 执行应用程序\n\n执行应用程序。你将得到一个粗体且红色的“Hello World!!!”，它由所有三个 CSS 类装饰。\n\n####\
  \ 步骤 11 – 构建应用程序\n\n现在构建应用程序。\n\nAngular CLI 会将所有三个 CSS 文件捆绑到一个文件中。\n\n构建后，你将得到一个\
  \ CSS 文件 `style.***.css`，它封装了所有三个文件的内容。\n\n```\n.MyClass2{font-weight:700}.MyClass3{color:red}.MyClass1{border:1px\
  \ solid #000}\n```\n\n这就是 CSS @import 的示例。在 ng build 时，Angular CLI 会将 `style.css`\
  \ 及其所有依赖的样式表捆绑到一个包中。\n\n接下来，让我们看看 `angular.json` 的方式。\n\n#### 步骤 12 – 在 angular.json\
  \ 中导入 color.css\n\n首先，删除 `style.css` 中 color.css 的导入语句。\n\n```\nimport \"mystyle.css\"\
  ;\n.MyClass1{\n   border:1px solid black;\n}\n```\n\n接下来，将 `color.css` 包含在 `angular.json`\
  \ 文件中，如下所示：\n\n```\n\"build\": {\n           ……\n             \"styles\": [\n  \
  \             \"src/styles.css\",\n               \"src/color.css\"\n          \
  \  ],\n             \"scripts\": []\n          },\n```\n\n#### 步骤 13 – 执行应用程序\n\n\
  `angular.json` 文件中的任何更改都需要重新执行 `ng serve` 命令。\n\n所以请确保你执行了相同的操作。（为此，按 Ctrl+C 停止现有执行，然后再次执行\
  \ ng serve 命令。）\n\n执行后，你将得到与之前相同的输出。你将看到红色、粗体并带有黑色边框的“Hello World!!!”。\n\n#### 步骤\
  \ 14 – 构建应用程序\n\n使用 `ng build --prod` 命令构建应用程序，令人惊讶的是，你不会发现任何显著的不同。你会找到一个生成的单个 CSS\
  \ 文件，其中包含来自所有三个 CSS 文件的内容，与之前类似。\n\n```\n.MyClass2{font-weight:700}.MyClass1{border:1px\
  \ solid #000}.MyClass3{color:red}\n```\n\n看起来没有任何变化。CSS @import 和 `angular.json`\
  \ 的行为相同。\n\n## 讨论 – 继续\n\n对于外部样式表，我们可以使用 CSS @import 或 `angular.json` 来包含它们。在实际项目中，你可能会看到其中任何一种方式，或者两者都用。\n\
  \n在前面的案例中，我们两者都用了。\n\n你可能想知道该遵循哪一种。嗯，两者都有优缺点：\n\n* CSS @import 使开发变得容易，因为每次我们想要从应用程序中添加或删除外部样式表时，都不需要重新执行\
  \ `ng serve` 命令。\n* 另一方面，`angular.json` 允许我们在需要时创建多个包。如果你觉得生成的 CSS 包太大，需要拆分成多个文件，那么\
  \ `angular.json` 是最好的方式。让我们看看这个的实际应用。\n\n## 实验 – 继续\n\n### 步骤 15 – 为多个包配置 angular.json\n\
  \n打开 `angular.json` 并将 styles 部分修改如下：\n\n```\n\"styles\": [\n               \"src/styles.css\"\
  ,\n               {\n                 \"input\": \"src/color.css\",\n          \
  \       \"bundleName\": \"color\"\n              }\n            ],\n```\n\n### 步骤\
  \ 16 – 执行应用程序\n\n重新运行 `ng serve` 命令。输出不会有任何变化。\n\n### 步骤 17 – 构建应用程序\n\n再次构建应用程序。这次会生成两个\
  \ CSS 包——`style.***.css` 和 `color.***.css`。\n\n第一个包含 `styles.css` 和 `mystyle.css`\
  \ 的内容。\n\n第二个包含 `color.css` 的内容。\n\n## 组件样式\n\n当我们谈论组件时，我们称之为两件事的组合——模板类和模板。但这并不完全正确。有时，它也可以有自己的\
  \ CSS 文件。\n\n当你使用 Angular CLI 创建 Angular 组件时，你一定注意到了这样的文件。如果没有，不用担心。我们现在就来研究一下，并理解这个\
  \ CSS 文件与 `style.css` 有何不同。\n\n## 实验 – 15 – 理解组件样式\n\n### 步骤 1 – 注释 ExternalCSSTestComponent\n\
  \n在 `AppComponent` 中注释掉 `ExternalCSSTestComponent`，如下所示：\n\n```\n<!-- 应用组件 -->\n\
  <!-- <app-external-csstest-component></app-external-csstest-component> -->\n```\n\
  \n### 步骤 2 – 创建组件\n\n创建四个组件——`Customer`、`CustomerList`、`Product` 和 `ProductDashboard`。\n\
  \n### 步骤 3 – 使用组件\n\n将这些组件相互嵌套使用，如下所示：\n\n```\n<!-- 应用组件 -->\n<!-- <app-external-csstest-component></app-external-csstest-component>\
  \ -->\n<div class=\"DivContainer\">\n   <p>Hello From App Comonent</p>\n   <app-customer></app-customer>\n\
  \   <app-product></app-product>\n</div>\n```\n\n```\n<!-- 客户组件 -->\n<div class=\"\
  DivContainer\">\n   <p>Hello From Customer</p>\n   <app-customer-list></app-customer-list>\n\
  </div>\n```\n\n```\n<!-- 产品组件 -->\n<div class=\"DivContainer\">\n   <p>Hello From\
  \ Product</p>\n   <app-product-dashboard></app-product-dashboard>\n</div>\n```\n\
  \n```\n<!-- 客户列表组件 -->\n<div class=\"DivContainer\">\n   <p>Hello From Product-List</p>\n\
  </div>\n```\n\n```\n<!-- 产品仪表板组件 -->\n<div class=\"DivContainer\">\n   <p>Hello\
  \ From Product-Dashboard</p>\n</div>\n```\n\n### 步骤 4 – 定义样式\n\n现在魔法开始了。在 `style.css`\
  \ 中定义一个新的样式，如下所示：\n\n```\n……\n.DivContainer {\n   border:1px solid black;\n   margin:\
  \ 5px;\n}\n```\n\n![](img/Image57587.jpg)\n\n**图 28.2**\n\n### 步骤 5 – 检查输出\n\n\n\
  \n\n\n执行应用程序，你将看到以下输出。\n\n正如预期，相同的 CSS 被应用到了每个组件中。\n\n**第 6 步 – 定义组件样式**\n\n接下来，在\
  \ `app.component.css` 文件中定义新样式，如下所示：\n\n```\n.DivContainer {\n   border:2px black\
  \ dashed;\n}\n```\n\n**第 7 步 – 检查输出**\n\n你会发现，`app.component.css` 文件中定义的样式只影响了 `AppComponent`\
  \ 中的 `div` 元素。其他组件仍然显示由 `style.css` 附加的实心黑色边框。\n\n![](img/Image57699.jpg)\n\n**图\
  \ 28.3**\n\n你能看到虚线边框吗？这是因为 `app.component.css` 文件附加到了 `AppComponent` 上。\n\n**第 8\
  \ 步 – 定义组件样式**\n\n接下来，在 `customer-list.component.css` 文件中定义样式，如下所示：\n\n```\n.DivContainer\
  \ {\n   border:3px red dotted;\n}\n```\n\n**第 9 步 – 检查输出**\n\n这次你会注意到，新样式只影响了 `CustomerListComponent`\
  \ 内部的 `div` 元素。\n\n你在之前的输出中看到红色点状边框了吗？这是因为我们在 `customer-list.component.css` 文件中添加的新样式。\n\
  \n![](img/Image57707.jpg)\n\n**图 28.4**\n\n这就是组件样式的全部内容——样式被封装在组件内部。\n\n**第 10 步\
  \ – 构建应用程序**\n\n让我们构建应用程序，并准确理解构建后这些组件样式发生了什么变化。\n\n## 讨论 – 续\n\n你会惊讶地发现，构建后没有为任何组件生成特定的\
  \ CSS 文件。\n\n打开 `style.***.css` 和 `color.***.css`，检查组件样式是否被打包在这些文件中。你也不会在这些文件中找到组件样式。\n\
  \n**那么组件样式在哪里？**\n\n组件 CSS 样式被封装到了组件自身的视图中，这就是为什么它不会影响应用程序的其他部分。\n\nAngular CLI\
  \ 将所有自定义应用程序代码打包到一个名为 `main.***.js` 的包文件中。\n\n打开那个 `main.***.js` 文件，搜索 `3px`。如果你还记得，CustomerList\
  \ 的 CSS 中有 `3px border`。\n\n你会在文件中找到它。\n\n![](img/Image57784.jpg)\n\n**图 28.5**\n\
  \n在运行时，当相应的组件被加载时，Angular 会动态地将这些样式作为内联样式注入到 DOM 中。你甚至可以在开发者工具中检查它们。\n\n![](img/Image57826.jpg)\n\
  \n**图 28.6**\n\n***注意：*** 如你所知，在惰性加载的情况下，会生成多个这样的包。因此，你会在相应的包中找到组件样式，而不是在主包中。\n\n\
  **`styleUrls` 是创建组件特定样式的唯一方法吗？**\n\n`styleUrls` 允许我们将外部 CSS 文件包含到组件中，但这并不是拥有组件特定样式的唯一方法。我们还有另一种方法——内联样式。可以这样做：\n\
  \n```\n@Component({\n   selector: ‘app-customer-list’,\n   templateUrl: ‘./customer-list.component.html’,\n\
  \   // styleUrls: [‘./customer-list.component.css’]\n   styles: [`.DivContainer\
  \ {\n     border:3px red dotted;\n   }`]\n})\nexport class CustomerListComponent\
  \ implements OnInit {……\n```\n\n建议使用 `styleUrls` 而不是 `styles`，但你仍然会在项目中找到一些使用后者的地方。\n\
  \n## 视图封装\n\n我们已经说过好几次了——组件 CSS 样式被封装到了组件自身的视图中。\n\n我们可以通过设置组件装饰器中的封装模式，在每个组件的基础上控制这种封装。\n\
  \n目前有以下三种可能的值：\n\n# 1. 模拟（Emulated）\n\n这是默认模式。在这种模式下，你会发现每个 DOM 元素都附加了一些唯一的属性。\n\
  \n```\n@Component({\n   selector: ‘app-root’,\n   templateUrl: ‘./app.component.html’,\n\
  \   styleUrls: [‘./app.component.css’],\n   encapsulation: ViewEncapsulation.Emulated,\n\
  })\nexport class AppComponent {\n```\n\n执行应用程序，打开开发者工具，并打开 **`Elements`** 选项卡。\n\
  \n**你能在上图中看到 `_ngcontent-pij-c15` 吗？**\n\n如你所见，它附加到了 `AppComponent` 中的每个元素上。\n\n\
  **你能找到 `_ngcontent-pij-c12` 吗？**\n\n如你所见，它附加到了 `CustomerComponent` 的每个元素上。\n\n![](img/Image57833.jpg)\n\
  \n**图 28.7**\n\nAngular 为每个组件生成一个唯一的字符串，并将其添加到该组件的每个子元素上。\n\n**你是否好奇 Angular 为什么要这样做？**\n\
  \n通过这样做，Angular 使这些样式成为组件特定的。\n\n![](img/Image57877.jpg)\n\n**图 28.8**\n\n要理解这一点，请检查\
  \ head 部分。你会发现多个 style 标签。\n\nAngular 在运行时动态创建了这些 style 标签。\n\n其中两个是全局样式，之后每个 style\
  \ 标签代表一个组件。\n\n展开第三个 *style* 标签。它代表 AppComponent 的样式。\n\n**你看到什么有趣的东西了吗？**\n\nCSS\
  \ 选择器也被重命名了。\n\n重命名将确保这些 CSS 设置只附加到具有相应属性的元素上。\n\n![](img/Image57910.jpg)\n\n**图\
  \ 28.9**\n\n# 2. 无（None）\n\n这个值在实际中没什么用。设置此值表示我们不希望任何视图封装，从而使组件样式成为全局样式。\n\n```\n\
  @Component({\n   selector: ‘app-root’,\n   templateUrl: ‘./app.component.html’,\n\
  \   styleUrls: [‘./app.component.css’],\n   encapsulation: ViewEncapsulation.None,\n\
  })\nexport class AppComponent {\n```\n\n你会注意到，将其设置为 None 后，AppComponent 中定义的任何样式都将全局应用。\n\
  \n# 3. ShadowDOM\n\n我之前已经说过一次，Angular 组件是受 HTML5 中引入的 **`Web Components`** 概念启发的。**`WebComponent`**\
  \ 的核心特性之一就是 ShadowDOM。\n\n**让我向你展示什么是 ShadowDOM？**\n\n创建一个 HTML 文件，并将以下内容放入其中。我们是在演示一个\
  \ HTML 概念，所以不需要 Angular 项目。你可以有一个简单的 HTML 文件。\n\n```\n<html>\n<head>\n     <title>日期选择器</title>\n\
  </head>\n<body><input type=”date”></body>\n</html>\n```\n\n执行该文件并打开开发者工具。\n\n![](img/Image57951.jpg)\n\
  \n**图 28.10**\n\n**你知道这个 HTML 5 日期元素的特殊之处吗？**\n\n它是一个 Web 组件。就像我们的 Angular 组件一样，它是对某些\
  \ HTML（最好称为模板）、格式（CSS）和行为（逻辑代码）的封装。你想看看底层的模板吗？\n\n点击开发者工具中的设置图标。\n\n![](img/Image57991.jpg)\n\
  \n**图 28.11**\n\n这将打开设置面板。在 Elements 子部分中，勾选“*显示用户代理 shadow DOM 选项*”。\n\n然后，关闭设置面板并重新检查\
  \ **`Elements`** 部分。这次你将能够展开日期元素。\n\n![](img/Image58031.jpg)\n\n**图 28.12**\n\n\
  **你看到 `#shadow-root` 了吗？**\n\n这就是 ShadowDOM。包含在其中的样式不会泄漏到外部世界，因此外部世界不受影响，但这还不是全部。Web\
  \ 组件的内容也不会受到外部世界 CSS 的影响。这意味着外部世界附加到 div 元素上的任何 CSS 格式都不会影响日期元素的 div 元素。\n\n![](img/Image58073.jpg)\n\
  \n**图 28.13**\n\n**Angular 中的 ShadowDOM**\n\n在 Angular 中，通过将封装设置为 `ShadowDOM`，我们将获得类似的行为。\n\
  \n# 演示 1\n\n**第 1 步 – 设置封装**\n\n为了演示，将 `AppComponent` 和 `CustomerListComponent`\
  \ 的封装模式设置为 ShadowDOM。然后，从 `AppComponent` 中移除 `styleUrls`，并从 `CustomerListComponent`\
  \ 中移除 `styles`。\n\n```\n@Component({\n```\n\n\n\n\n\n```\n   selector: ‘app-customer-list’,\n\
  \   templateUrl: ‘./customer-list.component.html’,\n// styleUrls: [‘./customer-list.component.css’]\n\
  // styles: [`.DivContainer {\n//   border:3px red dotted;\n//}`],\n   encapsulation:\
  \ ViewEncapsulation.ShadowDom,\n})\nexport class CustomerListComponent implements\
  \ OnInit {\n```\n\n```\n@Component({\n   selector: ‘app-root’,\n   templateUrl:\
  \ ‘./app.component.html’,\n//styleUrls: [‘./app.component.css’],\n   encapsulation:\
  \ ViewEncapsulation.ShadowDom,\n})\nexport class AppComponent {\n```\n\n**第 2 步\
  \ – 设置封装**\n\n将 `Product`、`ProductDashboard` 和 `CustomerComponent` 的封装模式设置为 `ShadowDOM`。\n\
  \n**第 3 步 – 执行应用程序**\n\n现在执行应用程序。你将看到一个没有任何边框的屏幕。\n\n![](img/Image58111.jpg)\n\n\
  **图 28.14**\n\n这证明外部 CSS 对视图封装设置为 `ShadowDOM` 的组件没有影响。（`style.css` 中的 CSS 没有影响这些组件。）\n\
  \n# 演示 2\n\n**第 1 步 – 定义组件样式**\n\n按如下方式为 `CustomerListComponent` 和 `AppComponent`\
  \ 添加组件样式：\n\n```\n@Component({\n   selector: ‘app-root’,\n   templateUrl: ‘./app.component.html’,\n\
  \   styleUrls: [‘./app.component.css’],\n   encapsulation: ViewEncapsulation.ShadowDom,\n\
  })\nexport class AppComponent\n```\n\n```\n@Component({\n   selector: ‘app-customer-list’,\n\
  \   templateUrl: ‘./customer-list.component.html’,\n// styleUrls: [‘./customer-list.component.css’]\n\
  \   styles: [`.DivContainer {\n     border:3px red dotted;\n  }`],\n   encapsulation:\
  \ ViewEncapsulation.ShadowDom,\n})\nexport class CustomerListComponent implements\
  \ OnInit {\n```\n\n**第 2 步 – 更改封装**\n\n移除除 `AppComponent` 之外所有组件的封装。\n\n（换句话说，将\
  \ `AppComponent` 的封装设置为 `Emulated`。）\n\n**第 3 步 – 执行应用程序**\n\n执行应用程序，并使用开发者工具检查输出和\
  \ DOM。\n\n![](img/Image58156.jpg)\n\n**图 28.15**\n\n![](img/Image58163.jpg)\n\n\
  **图 28.16**\n\n`AppComponent` 被渲染为 `ShadowDOM`，因此其样式直接渲染在内部。\n\n现在让我们检查输出。\n\n你会看到\
  \ `AppComponent` 周围有一个虚线边框。这很明显，因为 `AppComponent` 的样式就是这样写的。\n\n你会看到 `CustomerListComponent`\
  \ 周围有一个红色点状边框。这也很明显，因为 `CustomerListComponent` 的样式就是这样写的。\n\n**为什么其他组件有虚线边框？**\n\
  \n看到其他组件周围的虚线边框，你是否感到失望？\n\n当封装设置为 `emulated` 时，`AppComponent` 的样式仅限于 `AppComponent`。`CustomerComponent`\
  \ 没有继承它。\n\n但这次情况不同。这次，`AppComponent` 的样式被所有子组件继承，因此除了 `CustomerList` 组件之外的所有组件都有虚线边框。客户列表组件有红色点状边框，因为它有自己的组件样式。\n\
  \n你可能会说这*违反了 ShadowDOM 的规则*——外部样式不会影响 ShadowDOM 内部的内容，而 ShadowDOM 内部定义的样式也不会影响其他元素。\n\
  \n答案是否定的。它并没有违反。再看一下生成的 DOM。`AppComponent` 被渲染为 `ShadowDOM`，但其他组件呢？它们被渲染为 `AppComponent`\
  \ 的普通子元素，并且它们的封装仍然设置为 `emulated`（默认值）。因此，它们将遵循相同的旧方法，即使用唯一属性。\n\n这就是为什么它们都有虚线边框的原因。\n\
  \n**第 4 步 – 更改封装**\n\n将所有组件的 `encapsulation` 设置为 `ShadowDOM`。\n\n![](img/Image58230.jpg)\n\
  \n**图 28.17**\n\n完成此操作后，你将得到以下输出。\n\n这次每个组件都被渲染为 `ShadowDOM`。因此，它们都不受外部 CSS 的影响。\n\
  \n在创建可重用的独立组件时，`ShadowDOM` 是最佳选择。\n\n*对于实际应用程序，推荐且最佳的方法是 `emulated`*。使用它，我们可以利用全局样式表，并且在需要组件特定样式时，我们也有相应的支持。\n\
  \n#### 总结\n\n*   我们讨论了在 Angular 应用程序中包含外部样式表的三种方式——使用 `index.html` 文件中的 `link` 标签、使用\
  \ *CSS @import* 以及使用 `angular.json` 文件。\n\n*   我们了解到 `angular.json` 文件中有一个名为 *builds/styles*\
  \ 的部分，用于声明项目中的外部 CSS 文件。默认情况下，Angular 样板项目包含一个 `style.css` 文件的条目。\n\n*   我们演示了 *CSS\
  \ @import*，并了解到在执行 `ng build` 时，Angular CLI 会将 `style.css` 及其依赖的每个样式表文件打包成一个包。\n\
  \n*   我们演示了使用 `angular.json` 文件导入样式表文件，并了解到 `angular.json` 文件中提到的所有样式表文件在执行 `ng\
  \ build` 时会被打包成一个文件。\n\n*   我们了解到，使用 `angular.json` 而不是 *CSS @import* 来导入样式表文件被认为是更好的方法。它让我们能够指示\
  \ Angular CLI 在需要时生成多个包。\n\n*   我们学习了如何使用 *Component* 装饰器的 `styleURL` 或 `styles`\
  \ 属性将样式附加到单个组件。我们了解到这些样式在构建后不会被打包到任何 CSS 包中；相反，它们会成为组件视图本身的一部分。\n\n*   我们学习了 *ViewEncapsulation*，它让我们能够控制样式如何封装到组件视图中。\n\
  \n*   我们讨论了 `Emulated` 封装，这是默认模式。此模式为组件的每个 DOM 元素附加一个唯一属性，并重命名每个 CSS 选择器，使样式仅对该组件生效。\n\
  \n*   我们讨论了 `Native` 封装，它遵循 HTML 5 的 *ShadowDOM* 方法。使用此模式，我们确保没有外部 CSS 影响组件的内容，并且组件特定的样式不会影响外部世界。这是可重用组件的最佳方法。\n\
  \n*   我们讨论了 `None` 封装，它使每个组件特定的样式成为全局样式。\n\n## 第 29 章\n\n## Angular 变更检测\n\n####\
  \ 简介\n\n你是否曾问过自己，模板是如何始终显示最新数据的？每当组件类中的数据发生变化时，它是如何更新的？变更检测就是答案，在本章中，我们将详细探讨变更检测。\n\
  \n## 什么是变更检测？\n\n变更检测是 Angular 中的一种机制，它遍历绑定、评估表达式、将其与先前的值进行比较，并在必要时更新 DOM。\n\n简而言之，它负责保持\
  \ UI 的最新状态。\n\n## 哪些组件会参与变更检测？\n\n正如我们之前多次讨论过的，Angular 维护一个组件的树形层次结构。这棵树在顶部有一个根组件。\n\
  \n在变更检测中，组件层次结构中的每个组件都会被检查，并在需要时重新渲染。\n\n（你很快会在我们的演示中看到它的实际效果。）\n\n## Angular 何时执行变更检测？\n\
  \nAngular 在应用程序生命周期中的以下事件期间执行变更检测。\n\n1.  **应用程序初始化之后**——即在 Angular 应用程序启动并加载引导组件之后。\n\
  \n\n\n\n\n2.  DOM 事件监听器之后——即在浏览器事件（如 click、focus、blur 等）被处理之后。\n\n3.  HTTP 数据请求之后——即在\
  \ Ajax 请求被处理（收到服务器响应）之后——响应可以是错误响应或成功响应。\n\n4.  宏任务（MacroTasks）之后——即在 `setTimeout()`\
  \ 或 `setInterval()` 等宏任务完成之后。这些宏任务在传递给它们的回调函数执行完毕后即视为完成。\n\n5.  微任务（MicroTasks）之后——即在\
  \ Promise 等微任务完成之后——Promise 在 resolve 或 reject 后即视为完成。\n\n6.  其他异步操作之后——即在 `WebSocket.onMessage`\
  \ 和 `Canvas.toBlob` 等其他异步操作执行完毕之后。\n\n## Angular 如何触发变更检测？\n\nAngular 使用名为 `zone.js`\
  \ 的库对上述所有 API 进行了*猴子补丁（monkey patched）*。\n\n它用新版本替换了所有这些底层 API。这些新版本增加了一些额外功能——例如，在回调被调用后，它会确保检测到变更并在需要时更新\
  \ UI，即进行变更检测。\n\n## 开发模式下的变更检测\n\n你必须理解的一个重要点是：在开发模式下，变更检测会执行两次。为了证明这一点，我们来做一个快速演示。\n\
  \n**步骤 1 - 创建项目**\n\n使用 `ng new` 命令创建一个新的 Angular 项目 `lab16-ng`。\n\n**步骤 2 - 创建新组件**\n\
  \n使用 `ng` 命令创建一个名为 `TwiceDetectionTestComponent` 的新 Angular 组件，然后将以下内容放入其中：\n\n\
  ```\n<h1>Testing twice change detection call - {{getData()}}</h1>\n<input type=”button”\
  \ value=”Click Me” (click)=”HandleClick()” >\n@Component({\n   selector: ‘app-twice-detection-test-component’,\n\
  \   templateUrl: ‘./twice-detection-test-component.component.html’,\n   styleUrls:\
  \ [‘./twice-detection-test-component.component.css’]\n})\nexport class TwiceDetectionTestComponentComponent\
  \   {\n   getData(): string {\n     console.log(“getData invoked”)\n     return\
  \ “Just Compile LLP”\n  }\n   HandleClick(){\n  }\n}\n```\n\n**步骤 3 – 在根组件中包含该组件**\n\
  \n打开 `app.component.html`，将现有内容替换为以下内容：\n\n```\n<!-- app.component.html -->\n<app-twice-detection-test-component></app-twice-detection-test-component>\n\
  ```\n\n**步骤 4 – 运行应用程序**\n\n使用 `ng serve` 命令运行应用程序并检查输出。\n\n![](img/Image58286.jpg)\n\
  \n**图 29.1**\n\n但比起输出，你更应该关注开发者工具的控制台。\n\n![](img/Image58351.jpg)\n\n**图 29.2**\n\
  \n## 讨论\n\n我说过在开发模式下变更检测会执行两次吗？\n\n你觉得这是两次吗？实际上是四次。\n\n我们稍后再讨论这个问题。现在，继续下一步。\n\n\
  ## 实验 – 继续\n\n**步骤 5 – 点击按钮**\n\n清空开发者控制台，然后点击组件中的 `Click Me` 按钮。正如我之前所说，按钮点击会触发变更检测。检查变更检测执行了多少次会很有趣。\n\
  \n![](img/Image58410.jpg)\n\n**图 29.3**\n\n清空控制台再试一次。你会注意到每次点击按钮，控制台都会显示两条消息。\n\n\
  ## 讨论 – 继续\n\n我相信你仍然对一开始的四次执行感到困惑。别担心。\n\n通过上一步，我们证明了点击按钮时变更检测会执行两次。\n\n你想知道原因吗？我们来讨论一下。\n\
  \n打开开发者工具，在 `getData` 方法中设置断点，并检查调用栈。\n\n在第一次断点处，你会得到以下调用栈。\n\n![](img/Image58418.jpg)\n\
  \n**图 29.4**\n\n第二次，调用栈如下：\n\n![](img/Image58486.jpg)\n\n**图 29.5**\n\n你能找出两者之间的区别吗？\n\
  \n在第一次执行时，Angular 更新了 DOM，这正是 `detectchanges` 方法所做的。\n\n在第二次调用中，Angular 确保在之前的 DOM\
  \ 重新渲染后没有任何变化，这正是 `checkNoChanges` 方法所做的。如果它发现绑定的值发生了变化或确定 DOM 应该更新，就会抛出异常。我们来证明这一点。\n\
  \n## 实验 – 继续\n\n**步骤 6 – 在第一次调用后更改 DOM**\n\n为此，将 `getData` 方法修改如下：\n\n```\ngetData():\
  \ number {\n     const data = Math.random() * 100;\n     console.log(data);\n  \
  \   return data;\n  }\n```\n\n**步骤 7 – 重新检查应用程序**\n\n忽略第一次执行的情况。清空控制台并点击 `Click\
  \ Me` 按钮。你的开发者控制台应该如下所示：\n\n![](img/Image58535.jpg)\n\n**图 29.6**\n\n我们会得到一个异常——`ExpressionChangedAfterItHasBeenChecked`。\n\
  \nAngular 执行了两次变更检测。在第一次执行期间，生成了某些输出；在第二次执行期间，Angular 发现要渲染的值不同了。因此我们得到了这个错误。\n\n\
  请注意，这种两次执行的情况仅在开发模式下可见。在生产模式下，变更检测只执行一次。\n\n**步骤 8 – 在生产模式下运行**\n\n使用 `ng serve\
  \ --prod` 命令重新运行应用程序。检查开发者工具。你会发现显示两个输出。（之前，在开发模式下是四次。）\n\n清空控制台并点击按钮。你会发现只显示一个值。（之前，在开发模式下是两次。）\n\
  \n## 为什么初始化时会执行两次？\n\n基于之前的实验，我们得到以下组合：\n\n*   开发模式 + 应用程序初始化时 = 变更检测执行四次。\n\n*\
  \   开发模式 + 其他变更检测触发器（如事件处理程序、宏任务等）= 变更检测执行两次。\n\n*   生产模式 + 应用程序初始化时 = 变更检测执行两次。\n\
  \n*   生产模式 + 其他变更检测触发器（如事件处理程序、宏任务等）= 变更检测只执行一次。\n\n我们了解到，在开发模式下，Angular 会执行两次变更检测。第一次运行时，DOM\
  \ 会以最新的组件状态进行渲染；第二次运行时，它会确认在之前的重新渲染后 DOM 没有发生变化。如果发生了变化，我们会得到一个运行时错误——*`ExpressionChangedAfterItHasBeenChecked`*。\n\
  \n现在的问题是，为什么在应用程序初始化后也会执行两次？\n\n*   在应用程序初始化期间，Angular 默认会调用 tick 方法，这会导致变更检测。（在开发模式下，它会执行两次——一次\
  \ `changedetection`，一次 `checkNoChanges`。）\n\n*   一旦完成，由于 `zone.js` 的存在，tick 方法会再次执行。这会导致第二次变更检测循环。（在开发模式下，它会执行两次——一次\
  \ `changedetection`，一次 `checkNoChanges`。）\n\n## 将 zone.js 与 Angular 断开连接\n\n之前我们了解到，Angular\
  \ 使用 `zone.js` 对原生底层 API 进行猴子补丁。这些猴子补丁确保一旦这些底层 API 完成，就会触发变更检测，从而更新 DOM。\n\n**这是否意味着没有\
  \ zone.js 就没有变更检测？**\n\n并非如此。\n\n**变更检测**是 Angular 中的一种机制，它遍历绑定、评估表达式、与之前的值进行比较，并在必要时更新\
  \ DOM。\n\n\n\n\n\n通过猴子补丁（monkey patching）底层 API（如 `addEventListener`、`setTimeout`\
  \ 等），`zone.js` 确保了变更检测能够自动触发。\n\n如果我们移除 `zone.js`，并不会移除 Angular 的变更检测能力，只是移除了自动化机制。\n\
  \n在 Angular 中，有一种方法可以将默认的 zone 与应用程序断开连接。让我们来操作一下。\n\n### 第 1 步 – 创建新项目\n\n变更检测的学习有时会变得非常令人困惑。因此，我总是建议为每个新演示创建一个新项目。\n\
  \n使用 `ng` 命令创建一个新的 Angular 项目 `lab17-ng`。\n\n### 第 2 步 – 修改 AppComponent\n\n将 `AppComponent`\
  \ 的内容修改如下：\n\n```\nexport class AppComponent   {\n   Counter: number=0;\n   Increement(){\n\
  \     this.Counter++;\n   }\n}\n```\n\n```\n<input type=”button” value=”Increement”\
  \ (click)=”Increement()” /> {{Counter}}\n```\n\n### 第 3 步 – 运行应用程序\n\n使用 `ng serve`\
  \ 命令运行应用程序。确保每次点击按钮后数值都会更新。\n\n当前应用程序默认配置为使用 `zone.js` 运行，每次点击都会触发变更检测。\n\n### 第\
  \ 4 步 – 断开 zone.js\n\n在 `src` 文件夹中，你会找到一个名为 `polyfill.ts` 的文件。\n\n滚动到底部，你会看到一行导入\
  \ zone 库的代码。注释掉该语句或将其删除。\n\n```\n//import 'zone.js/dist/zone'; // Included with\
  \ Angular CLI.\n```\n\n#### 第 5 步 – 运行应用程序\n\n运行后，你会看到一个空白页面。打开开发者工具检查以下错误：\n\n\
  ![](img/Image58660.jpg)\n\n**图 29.7**\n\n## 讨论 – 继续\n\n由于我们已经移除了 `zone.js`，Angular\
  \ 应用程序中不再有 zone。zone 是 Angular 应用程序的执行上下文。不必过于担心——只需注意一点：Angular 需要 zone，否则会破坏应用程序，而为了使其正常工作，我们需要提供自定义的\
  \ zone 对象。\n\n另一种替代方案是 `NoopNgZone`——Angular 自带了 noop zone，它什么也不做，与 `zone.js` 提供的\
  \ zone 对象不同，后者会对底层 API 进行猴子补丁。\n\n## 实验 – 继续\n\n### 第 6 步 – 提供 noop zone\n\n为此，将\
  \ `main.ts` 文件中的引导语句修改如下：\n\n```\nplatformBrowserDynamic().bootstrapModule(AppModule,{ngZone:\
  \ 'noop'})\n   .catch(err => console.error(err));\n```\n\n### 第 7 步 – 运行应用程序\n\n\
  运行应用程序。你会发现计数器值显示为“0”。\n\n接下来，点击按钮。你不会看到任何 DOM 变化。这证明 DOM 事件发生后没有进行变更检测。\n\n## 讨论\
  \ – 继续\n\nAngular 在应用程序初始化后只执行一次变更检测。这就是计数器初始值正确显示的原因。\n\n但由于 `zone.js` 已断开连接，变更检测的自动触发不再生效。\n\
  \n## 实验 – 继续\n\n### 第 8 步 – 手动检测变更\n\n我们移除了 `zone.js`，因此应用程序中不再有任何自动变更检测，但我们可以通过显式调用\
  \ `tick` 方法来手动执行。\n\n在 `AppComponent` 中获取 `ApplicationRef` 服务的引用，然后按如下方式调用 `tick`\
  \ 方法：\n\n```\nexport class AppComponent {\n   Counter: number = 0;\n   constructor(private\
  \ app: ApplicationRef) {}\n   Increement() {\n     this.Counter++;\n     this.app.tick();\n\
  \   }\n}\n```\n\n### 第 9 步 – 检查输出\n\n这次你会看到预期的输出。\n\n采用无 zone 的 Angular 方法可以显著提高性能，因为它限制了变更检测，但可能会增加应用程序的复杂性。因此，请谨慎选择。\n\
  \n## polyfill.ts\n\n我相信在完成实验后，你一定想了解 `polyfill.ts` 文件。\n\n### 什么是 polyfill？\n\n\
  Polyfill 是一些库，它们为现有的 JavaScript 添加额外的功能，从而使不兼容的浏览器变得兼容。\n\n让我们快速演示一个名为 `classlist.js`\
  \ 的 polyfill。\n\n### 第 1 步 – 创建新的 HTML 文件\n\n创建一个新的 HTML 文件 `index.html`，并放入以下内容：\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n     <style>\n         .mystyle {\n    \
  \         width: 300px;\n             height: 50px;\n             border: 1px solid\
  \ black;\n        }\n     </style>\n</head>\n<body>\n     <button onclick=”addStyle()”>Add\
  \ Style</button>\n     <div id=”myDIV”>\n         I am a DIV element\n     </div>\n\
  \     <script >\n         function addStyle() {\n             document.getElementById(“myDIV”).classList.add(“mystyle”);\n\
  \        }\n     </script>\n</body>\n</html>\n```\n\n### 第 2 步 – 测试 HTML 文件\n\n\
  在你选择的任意浏览器中打开该 HTML 文件。\n\n（确保如果你使用 IE，版本应为 10 或更高）\n\n点击按钮，你应该会在 DIV 元素周围看到一个黑色边框。\n\
  \n### 第 3 步 – 在 IE9 或更低版本中测试 HTML 文件\n\n现在，在 IE9 或更低版本的 IE 中打开同一个 HTML 文件。\n\n你会发现演示无法工作，因为\
  \ IE9 及更低版本不支持 classList。\n\n### 第 4 步 – 下载 polyfill\n\n为了使其工作，我们将使用一个名为 `classlist.js`\
  \ 的 polyfill。\n\n可以使用 `npm install classlist.js` 命令下载它。\n\n### 第 5 步 – 引入 polyfill\n\
  \n下载完成后，将下载的库文件按如下方式引入到 `index.html` 中：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
  \     <script  src=\"./node_modules/classlist.js/classList.js\"></script>\n    \
  \ <style>\n         .mystyle {\n……\n```\n\n### 第 6 步 – 在 IE9 或更低版本中重新测试 HTML\n\n\
  这次你会发现它可以正常工作。\n\n## Angular 项目中的 polyfill.ts 是什么？\n\n这是一个文件，我们将在其中包含所有希望在应用程序加载之前加载的\
  \ polyfill。\n\n默认情况下，它只有一个条目——`zone.js` 的条目。\n\nAngular 库是基于 Web 平台的最新标准构建的。我们无法保证所有这些标准在所有浏览器上都能正常工作。假设你计划在旧版浏览器中运行\
  \ Angular 应用程序。在这种情况下，你肯定需要一些 polyfill 库，按照标准，下载 polyfill 后，必须将其包含在 `polyfill.ts`\
  \ 文件中。\n\n所有在 `polyfill.ts` 中导入的库在使用 `ng build` 命令构建应用程序时，会被打包并压缩为 `polyfill.***.js`。\n\
  \n## 具有组件层次结构的变更检测\n\n在第四个演示中，我们将学习具有组件层次结构的变更检测。\n\n### 第 1 步 – 创建新项目\n\n创建一个新的\
  \ Angular 项目 `lab18-ng`。\n\n### 第 2 步 – 创建组件\n\n使用 `ng` 命令创建 Customer、CustomerList、CustomerAdd\
  \ 和 Product 组件。\n\n### 第 3 步 – 使用组件\n\n*   在 Customer 组件内部使用 CustomerList 和 CustomerAddComponent。\n\
  *   在 AppComponent 内部使用 Product 和 Customer 组件。\n*   同时，在所有组件中创建一个按钮并处理其点击事件。\n*\
  \   在所有组件类中创建一个 `GetMessage` 方法，并在相应模板的插值语法中调用它。\n\n```\nexport class AppComponent\
  \ {\n   GetMessage(): void {\n     console.log('App Component message');\n   }\n\
  \   HandleClick(): void  {}\n}\n<!-- app.component.html -->\n<div>\n   {{GetMessage()}}\n\
  \   <input type=”button” value=”AppButton” (click)=”HandleClick()”>\n   <app-customer></app-customer>\n\
  \   <app-product></app-product>\n</div>\n```\n\n\n\n\n\n```\nexport class CustomerComponent\
  \  {\n   GetMessage(): void {\n     console.log('Customer Component message');\n\
