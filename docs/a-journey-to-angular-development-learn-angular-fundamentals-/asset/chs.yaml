  \n**图 15.9**\n\n### 第 2 步：显示选中的组件\n\n现在，进入 `console` 选项卡并输入 `$0`。\n\n![](img/Image51519.jpg)\n\
  \n**图 15.10**\n\n它会返回当前选中的 DOM 元素。\n\n（此操作仅在开发环境中有效。）\n\n### 第 3 步：获取组件\n\n接下来，在控制台中编写以下代码：\n\
  \n![](img/Image51553.jpg)\n\n**图 15.11**\n\n很酷，不是吗？它会显示附加到所选元素上的 `CustomerComponent`\
  \ 实例。\n\n### 第 4 步：探索 `IsAddNew$`\n\n首先，展开 `CustomerComponent`，然后选择 `IsAddNew$`。\n\
  \n你会找到一个名为 `source` 的属性。\n\n它就是 `BehaviorSubject`。\n\n展开它，你会找到一个名为 `observers` 的属性，它表示订阅了该\
  \ `Observable` 的订阅者。\n\n![](img/Image51588.jpg)\n\n**图 15.12**\n\n在我们的例子中，你可以看到两个订阅者。\n\
  \n这意味着我们订阅了 `IsAddNew$` 两次。\n\n**你还记得订阅了两次吗？**\n\n交叉检查你的所有代码。先别管两次。我们甚至一次都没有**手动**订阅过。\n\
  \n上一句中的“手动”被加粗了，因为它确实会被自动订阅。\n\n**你还记得** `async pipe` **以及我们在模板中写的** `{IsAddNew$|async}`\
  \ **吗？**\n\n这就是自动订阅的原因。\n\n我们在模板中写了两次。\n\n一次用于*显示*，一次用于*隐藏*。每次使用 *async pipe* 时，observable\
  \ 都会被自动订阅。\n\n作为最佳实践，我们应该避免不必要的订阅。\n\n可以通过手动订阅和取消订阅来实现，而不是使用 *async pipe*。但这会带来太多手动工作。还有另一种方法，那就是\
  \ `ngIf` *和* `async` *as 语法*。\n\n### `ngIf` 和 `async as`\n\n为了理解这个解决方案，请看下图：\n\n\
  ![](img/Image51625.jpg)\n\n**图 15.13**\n\n首先，让我们理解它是什么，然后讨论可以应用此解决方案的用例：\n\n1. \
  \ 在这种方法中，我们将 `ngIf` 指令附加到一个元素上，并将其与带有 *async pipe* 的 observable 绑定，后面跟着*一个别名*。在上图中，我们有一个父级\
  \ `div` 元素，我们为其附加了 `ngIf` 指令。\n\n2.  当 observable 发出一个值时，该值将被存储在一个变量中，并且该变量只能在该元素内部访问。在我们的例子中，*XYZ*\
  \ 将保存 observable 发出的最新值。\n\n这种方法的缺点是 observable 必须发出某个值，并且该值不能是 `false`，否则元素将不会渲染：\n\
  \n*   假设上例中的 `X$` observable 返回一个布尔值 `false`。在这种情况下，元素甚至不会被渲染。这就是 `ngIf` 的工作原理。\n\
  \n*   如果 observable 发出布尔值 `true` 或任何非空值，则元素会被渲染，并且可以使用变量 `XYZ` 访问该值。`XYZ` 变量的作用域是附加了\
  \ `ngIf` 指令的元素。\n\n考虑到这一点，在当前 `IsAddNew$` 的场景中，这个解决方案并不适用，因为我们的 `IsAddNew$` 一开始就发出了\
  \ `false`。因此，整个父元素本身都不会被渲染。\n\n![](img/Image51665.jpg)\n\n**图 15.14**\n\n**你是否在想在使用\
  \ `ngIf` 时对值取反？**\n\n嗯，这是不可能的，因为取反操作无法与 `async` `as` 语法一起使用。\n\n`async as` 对你来说可能看起来像是一个无用的特性。\n\
  \n但它并非无用。如果初始值是 `true`，我们就可以毫无问题地使用它。\n\n### 新的解决方案 - `*ngIf` 和 else 方法\n\n在这种方法中，我们将使用带有\
  \ `else` 的 `*ngIf`。我们已经有了一个 `*ngIf` 的例子。\n\n嗯，它还有一些扩展。我们可以指定 `else` 部分，如下所示：\n\n\
  1.  `<div class=”card” *ngIf=”!(IsAddNew$|async);else AddNewContainer”…`\n\n你是否在想\
  \ `AddNewContainer` 是什么？它引用了一个元素，当 `IsAddNew$` 发出 `false` 值时，该元素需要被显示。在我们的例子中，它将是对\
  \ *数据录入 div* 的引用。\n\n简而言之，用 Angular 的术语来说，它是一个*模板引用变量*。\n\n### 将模板引用变量附加到数据录入 div\
  \ 时的问题\n\n我们已经在该 `div` 元素上使用了一个*模板引用变量*。检查代码：\n\n1.  `<div class=”card” ngForm #myForm=”ngForm”>`\n\
  \n如你所见，*模板引用变量* 持有附加到该元素上的 `ngForm` 指令的引用。\n\n### 可能的解决方案\n\n*   因此，解决方案是在上述 `div`\
  \ 元素周围再添加一个父元素。这样做可能会破坏 HTML 结构，并且我们的 UI 可能会受到影响。\n\n*   幸运的是，Angular 提供了一种创建虚拟父元素的方法；这种元素不会影响\
  \ UI，仅充当父元素。它就是 `ng-template`。我们可以称之为静默父元素。\n\n所以，事不宜迟，让我们来实现它。\n\n## 实验 – 续\n\n\
  ### 第 49 步：应用带有 else 的 `*ngIf`\n\n将 `CustomerComponent` 模板修改如下：\n\n1.  `……`\n2.\
  \  `<div class=”container-fluid pt-3” >`\n3.  `   <div class=”card” *ngIf=”!(IsAddNew$|async);else\
