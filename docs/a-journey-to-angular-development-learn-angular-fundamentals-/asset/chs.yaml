  \ {\n     this.authenticationService.logout();\n  }\n}\n```\n\n如你所见，现在我们的组件`class`比以前干净多了。\n\
  \n所有操作都简单地移到了 Angular 服务中。\n\n#### 第 43 步 – 在模板中处理可观察对象\n\n接下来，我们需要在`CustomerComponent`模板中处理`IsAddNew$`和`Customers$`可观察对象。\n\
