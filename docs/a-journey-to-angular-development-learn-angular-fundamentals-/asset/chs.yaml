  \n1.  `……` `//AuthenticationService`\n2.  `authenticate(user: User): void {`\n3.\
  \  `// 更改编号 3 - 订阅 Observable`\n4.  `     this.httpClient`\n5.  `       .post<AuthenticationResponse>(`\n\
  6.  ``         `${this.appConfigService.apiUrl}/signin`,user).subscribe(……``\n7.\
  \  `……`\n8.  `……` `//CustomerService`\n9.  `Save(customer: Customer) {`\n10.  `\
  \     const newCustomer: NewCustomer = new NewCustomer(`\n11.  `       customer.FName,`\n\
  12.  `       customer.LName`\n13.  `    );`\n14.  `     this.httpClient`\n15.  ``\
  \       .post(`${this.appConfigService.apiUrl}/customers`, newCustomer)``\n16. \
  \ `       .subscribe(……`\n17.  `……`\n\n**步骤 104：检查输出**\n\n执行、测试并确认保存和登录功能均正常工作。\n\
  \n**步骤 105：运行时配置**\n\n我相信经过上述步骤，你对运行时配置已经清楚了，如果还不清楚，那么再演示一次后就会明白。使用 `ng build` 命令并带上\
