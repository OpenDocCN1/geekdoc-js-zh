  \ `map.js` 的文件）会缺失。源映射文件包含有关源 TypeScript 文件的信息。正是由于源映射文件，我们才能直接在浏览器中调试 TypeScript\
  \ 文件。\n\n*   第二个区别是，生产构建中不会生成 `vendor.js` 文件。该文件原本用于包含导入到应用程序中的第三方库。\n\n    主包在生产构建期间会被优化。在生成最终包时，所有未使用的代码都会被移除；因此，对于生产构建，供应商构建会被集成到主包中。\n\
  \n### 步骤 89 – 检查应用程序\n\n再次启动 *lite-server* 并检查输出。这次，你将看到来自运行在 5000 端口的服务器的客户记录。\n\
  \n这证明，被考虑的是 *environment.prod.ts* 而不是 *environment.ts*。\n\n这被称为*编译时配置*。在编译时，应用程序会配置一个\
  \ API URL。（同时修改 *Save* 函数并进行测试。）\n\n#### 总结\n\n让我们回顾一下本章学到的主题：\n\n*   我们首先理解了应用程序中配置的必要性。\n\
  \n*   我们学习了编译时配置和运行时配置的区别。编译时配置意味着配置将在编译时完成，而运行时配置意味着它将在部署时完成。\n\n*   我们了解了 *environment.ts*\
  \ 文件，以及在生产模式下它如何被 *environment.prod.ts* 文件替换。\n\n*   我们分别使用 *ng build* 和 *ng build\
  \ --prod* 命令生成了 Angular 应用程序的非生产模式和生产模式构建。\n\n*   我们了解到，在非生产构建中，Angular CLI 也会生成源映射文件；因此，我们可以在运行时直接调试\
  \ TypeScript 文件。\n\n*   我们了解到，在生产构建中不会得到单独的 *vendor.js* 文件，因为它被集成到了 *main* 包中。\n\
  \n*   我们演示了一个名为 lite-module 的 Angular 模块，它可以用作静态文件的开发用途 Web 服务器。\n\n## 第 20 章\n\n\
  ### 运行时配置\n\n## 引言\n\n在上一章中，我们讨论了编译时配置。\n\n但在某些情况下，运行时配置更为合适。在本章中，我们将学习如何实现它。\n\n\
  ## 实验 – 续 – 运行时配置\n\n### 步骤 90：创建配置文件\n\n在 `src/assets` 文件夹中创建一个新文件 `config.json`，内容如下：\n\
  \n```\n{\n   “apiUrl”: “http://localhost:4000”\n}\n```\n\n## 讨论\n\n**为什么是 *assets*\
  \ 文件夹？**\n\n你一定在想，为什么我们特意把文件放在 `assets` 文件夹中。\n\n如你所知，在当前实验中，我们计划启用运行时配置。\n\n为此，我们需要\
  \ `config.json` 文件原样保留在最终构建中。\n\n`ng build` 命令的一个很棒的特性是，*assets* 文件夹会原样复制到最终构建中。\n\
  \n你是否好奇为什么 assets 文件夹如此特殊？\n\n你可以在 `angular.json` 文件中找到答案。\n\n![](img/Image53136.jpg)\n\
  \n**图 20.1**\n\n你注意到 *build* 部分中的 *assets* 部分了吗？\n\n在其中，我们将 *assets* 文件夹指定为值之一。Angular\
  \ CLI 会将此部分中定义的所有文件夹和文件原样复制到最终构建中。\n\n### 步骤 91：创建 AppConfigService\n\n接下来，在 `Services`\
  \ 文件夹中创建一个名为 `app-config.service.ts` 的文件，内容如下：\n\n```\nimport {HttpClient} from\
  \ ‘@angular/common/http’;\nimport {Injectable} from ‘@angular/core’;\nimport {Subscription}\
  \ from ‘RxJS’;\n@Injectable({\n   providedIn: ‘root’\n})\nexport class AppConfigService\
  \ {\n   apiUrl: string;\n   constructor(private http: HttpClient) {}\n   loadConfig():\
  \ Subscription {\n     return this.http\n       .get<{apiUrl: string}>(‘./assets/config.json’)\n\
  \       .subscribe(config => {\n         this.apiUrl = config.apiUrl;\n      });\n\
  \  }\n}\n```\n\n### 步骤 92：在服务中动态获取 API URL\n\n将 `AppConfigService` 注入到 `CustomerService`\
  \ 中，如下所示：\n\n```\n……\nexport class CustomerService {\n……\n   constructor(private\
  \ appConfigService: AppConfigService,\n               private httpClient: HttpClient)\
  \ {\n……\n  }\n……\n```\n\n### 步骤 93：使用动态 URL 进行 API 调用\n\n接下来，按如下方式修改 `LoadCustomers`\
  \ 方法：\n\n```\n……\n   private LoadCustomers(): void{\n     this.httpClient\n    \
  \ .get<Array<CustomerItemResponse>>(`${this.appConfigService.apiUrl}\n/customers`)\n\
  \     .pipe(\n```\n\n\n\n\n\n```\n       map((customerAPIResponse) => {\n      \
  \   return customerAPIResponse.map(\n           (customer) => new Customer(customer.firstName,\
  \ customer.lastName)\n        );\n      })\n     .subscribe((x) => {\n       this.CustomersSubject.next(x);\n\
  \    });\n  }\n……\n```\n\n如你所见，现在 API URL 不再是硬编码的了。\n\n### 第 94 步：检查输出\n\n在浏览器中检查输出。你看到的是一个空表格吗？当然，你看到了。\U0001F60A\
  \n\n检查开发者工具。你会看到以下错误：\n\n![](img/Image53143.jpg)\n\n**图 20.2**\n\n## 讨论 – 继续\n\n\
  **为什么会出现这个错误？**\n\n如你所知，`AppConfigService` 的 `LoadConfig` 方法负责设置 `apiURL` 属性的值。令人惊讶的是，到目前为止我们还没有在任何地方调用过该方法。因此，`apiURL`\
  \ 是 `undefined`。\n\n**你知道我们到底想要什么吗？**\n\n我们希望在进行任何外部 API 调用之前，`apiUrl` 属性能够被 `config.json`\
  \ 文件中的值更新。\n\n**我们该怎么做？**\n\n我们必须在 Angular 将应用程序标记为已初始化之前调用 `LoadConfig` 方法。这样，我们就能\
  \ 100% 确保在任何组件加载之前 `apiURL` 属性已经被更新。\n\n简而言之，我们需要一个钩子来接入 Angular 的初始化过程，并编写我们自己的代码。\n\
  \n**这可行吗？**\n\n在 Angular 中，我们有一个钩子可以接入 Angular 的引导过程。\n\n我们可以配置一个函数，该函数会在应用程序启动时被注入，并在应用程序初始化期间执行。如果该函数返回一个\
  \ `promise`，那么初始化过程会一直等待，直到该 `promise` 被解决。\n\n**如何将自定义逻辑钩入 Angular 的初始化过程？**\n\n\
  你注意到前面解释中提到的 *注入* 这个词了吗？如果没有注意到，请再读一遍。\n\nAngular 暴露了一个类型为 `InjectionToken` 的 DI\
  \ 令牌，名为 `APP_INITIALIZER`。\n\n我们将函数提供给这个令牌，它就会自动被钩入 Angular 的初始化过程。\n\n**如何将函数注入到\
  \ DI 令牌中？**\n\n我们已经见过使用 `useClass` 创建提供者的例子。那是在我们想要提供 *类型* 作为值的时候。Angular 注入器会创建该类型的一个实例并注入它。\n\
  \n但除了 `useClass` 之外，还有更多方式：\n\n*   `useFactory` – 这允许我们提供一个方法作为值。当我们想要手动控制对象的创建时使用。\n\
  \n    Angular 注入器每次想要进行注入时都会调用工厂方法。工厂方法始终期望返回一个对象。工厂方法返回的任何内容都将被注入到应用程序中。\n\n* \
  \  `useValue` – 这允许我们注入一个静态值。值可以是任何标量值或对象。最适合注入常量值。\n\n*   `useExisting` – 这是别名提供者。当我们想要用新的提供者替换旧的提供者时使用。\n\
  \n在我们当前的情况下，`useFactory` 非常合适。让我们看看它的实际应用。\n\n## 实验 – 继续\n\n### 第 95 步：创建 initializeConfig\
  \ 方法\n\n在 `Services` 文件夹中创建一个新文件 `app-initializer.ts`，并在其中创建一个名为 `initializeConfig`\
  \ 的函数，如下所示：\n\n```\nexport function initializeConfig() {\n   return () => {\n  \
  \   return new Promise((resolve) => {\n       setTimeout(() => {\n         console.log('Testing');\n\
  \         resolve();\n      }, 3000);\n    });\n  };\n}\n```\n\n请花点时间分析一下这段代码。\n\
  \n这是一个简单的函数，它返回另一个函数，而那个函数又返回一个 `promise`，最后，这个 `promise` 在 3 秒后被解决。\n\n### 第 96\
  \ 步：配置注入器以注入初始化函数\n\n在 `AppModule` 中，按如下方式配置根注入器：\n\n```\nimport {HttpClientModule,\
  \ HTTP_INTERCEPTORS} from '@angular/common/http';\nimport {APP_INITIALIZER, NgModule}\
  \ from '@angular/core';\n……\nimport {initializeConfig} from './Services/app-initializer';\n\
  ……\n@NgModule({\n   declarations: [AppComponent, CustomerComponent, LoginComponent],\n\
  \   imports: [……],\n   providers: \n     {provide: APP_INITIALIZER, useFactory:\
  \ initializeConfig,multi:true},\n     {provide: HTTP_INTERCEPTORS, useClass: TokenInterceptorService,\
  \ multi:true}\n……\n```\n\n### 第 97 步：检查输出\n\n运行应用程序，你会注意到在 `CustomerComponent` 或\
  \ `LoginComponent` 显示之前有 3 秒的停顿。如果你还没有完全理解，那么将 3 秒的时间增加到更大的数字。你会发现，只有在 promise 被解决之后，应用程序才会被认为已初始化，也只有在那之后，组件才会被渲染。\n\
  \n### 第 98 步：从 AppConfigService 返回 promise\n\n`AppConfigService` 中的 `loadConfig`\
  \ 方法返回的是订阅对象，因为 observable 的 subscribe 方法返回的是订阅对象。让我们修改它，使其返回 promise 对象。\n\n```\n\
  \  loadConfig(): Promise<void> {\n     return this.http\n       .get<{apiUrl: string}>('./assets/config.json').toPromise()\n\
  \       .then(config => {\n         this.apiUrl = config.apiUrl;\n      });\n  }\n\
  ```\n\n### 第 99 步：将 AppConfigService 注入到 initializeConfig 方法中\n\n通过将 `AppConfigService`\
  \ 作为参数添加到方法中，将其注入到 `InitalizeConfig` 中。然后，在其中调用 `loadConfig` 方法，如下所示：\n\n```\nimport\
  \ {AppConfigService} from './app-config.service';\nexport function initializeConfig(appConfigService:\
  \ AppConfigService) {\n   return () => {\n     return appConfigService.loadConfig();\n\
  \  };\n}\n```\n\n### 第 100 步：检查输出\n\n再次，我们会得到一个“*白屏死机*”。\n\n在开发者工具中，我们会发现以下错误：\n\
  \n![\n\n**图 20.3**\n\n## 讨论 – 继续\n\n**前面到底发生了什么？**\n\nAngular 按预期在初始化过程中调用了工厂函数，即\
  \ `initializeConfig`。\n\n问题出在 `initializeConfig` 函数的参数上。\n\n在前面的情况中，当 DI 系统在 Angular\
  \ 中调用工厂方法时，没有传递任何参数，因此 `appConfigService` 是 `undefined`，导致了前面的错误。\n\n**该怎么办？**\n\
  \n我们必须以某种方式告诉 Angular，我们的工厂函数依赖于 `AppConfigService`，这样在调用工厂函数之前，它会创建 `AppConfigService`\
  \ 类的实例并传递给它，然后在调用时将其作为参数传递。简而言之，我们必须告诉 Angular 将 `AppConfigService` 类的实例注入到工厂函数中。\n\
  \n这可以通过使用 `deps` 来实现。\n\n## 实验 – 继续\n\n### 第 101 步：定义依赖\n\n在 `AppModule` 中，定义 `APP_INITIALIZER`\
  \ 的工厂函数时，设置 `deps` 属性以表明我们的工厂函数依赖于 `AppConfigService`。\n\n```\n……\n   providers:\
  \ [\n     {provide: APP_INITIALIZER, useFactory: initializeConfig, multi: true,\
  \ deps:[AppConfigService]},\n……\n  ],\n   bootstrap: [AppComponent],\n……\n```\n\n\
  ### 第 102 步：检查输出\n\n最后，我们会看到表格显示了从服务器动态返回的客户数据。\n\n## 讨论 – 继续\n\n现在我知道，尽管得到了正确的输出，你仍然感觉不太舒服。\n\
  \n你一定在想，为什么在使用 `useFactory` 时必须显式地使用 `deps` 属性来指定依赖关系。而在使用 `useClass` 时，这是自动完成的。\n\
  \n\n\n\n答案是，对于 `useClass` 的情况，如果你还记得，我说过：“服务的每个消费者都必须用 `Injectable` 装饰器进行装饰。”这个\
  \ `Injectable` 装饰器为我们完成了自动化工作。它向 Service 类添加了元数据，指定了它所依赖的其他服务。\n\n对于 `useFactory`\
  \ 的情况，我们没有添加任何此类装饰器。因此，我们必须手动完成，为此，我们使用了 `deps`。\n\n## 实验 – 续\n\n**步骤 103：更改所有其他\
  \ API 调用**\n\n通过前面的步骤，可以确认 `AppConfigService` 在 `LoadCustomers` 中按预期工作。接下来，让我们在\
