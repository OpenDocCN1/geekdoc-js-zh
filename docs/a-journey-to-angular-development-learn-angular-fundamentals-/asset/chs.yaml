  \n**`Observable.pipe` 和 `Observable.subscribe` 的区别**\n\n`pipe` 方法用于链式调用 *Observable\
  \ 操作符*，而 `subscribe` 用于激活 *Observable* 并监听发出的值。\n\n*   更准确地说，我们订阅 *observable* 以获取发出的值。为此，使用\
  \ `subscribe` 方法。\n\n\n\n\n\n在值到达 `subscribe` 方法之前，发出的值会通过各个操作符进行管道传输，这些操作符可能会改变值甚至阻止进一步发射。为此，使用了\
  \ `pipe` 方法。\n\n在前面的例子中，我们配置了发出的记录通过 `map` 操作符进行管道传输。`map` 操作符允许我们将值转换为其他内容。\n\n\
