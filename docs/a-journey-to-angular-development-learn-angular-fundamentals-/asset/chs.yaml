  **服务器未运行时的服务器端错误**\n\n![](img/Image53914.jpg)\n\n**图 21.11**\n\n#### 总结\n\n至此，我们已经到达了第\
  \ 10 站。在这一旅程中，我们涵盖了以下主题：\n\n*   我们了解到可以为组件附加组件特定的样式。为此，我们将使用 `Component` 装饰器的 `styleUrls`\
  \ 参数。\n\n*   我们了解到 Angular 已经内置了集中式异常处理。默认实现会将错误消息打印到控制台。\n\n*   我们了解到可以通过自定义 Angular\
  \ 服务并将其作为新的错误处理器注入到 Angular 管道中来覆盖默认行为。为此，我们必须为 DI 令牌 `ErrorHandler` 配置根注入器。\n\n\
  *   我们了解到要实现自定义错误处理器服务，必须实现 `ErrorHandler` 接口。\n\n*   我们了解了 `zone.runOutsideAngular`\
  \ 方法，它允许我们在 Angular 执行上下文之外执行代码。\n\n*   我们了解了 `zone.run` 方法，它允许我们回到 Angular 执行上下文。\n\
  \n## 第 5 节\n\n#### 总结\n\n在第 5 节中，我们详细探讨了 Angular 服务，并涵盖了第 9 站和第 10 站，这完成了我们旅程的一半。让我们回顾一下本节中的每一章。\n\
  \n#### 第 12 章 – 认证服务\n\n*   我们再次复习了 DI 概念，并了解到它使我们的代码松散耦合，从而更易于维护和测试。\n\n*   我们讨论了\
  \ Angular 注入器，它负责将服务实例注入到 Angular 应用程序中。\n\n*   我们讨论了两种注入器：模块注入器和元素注入器。\n\n*   我们了解到这两种注入器都维护着一个层级结构。\n\
  \n*   我们学习了如何使用 `Injectable` 装饰器和 `Component` 装饰器配置服务。\n\n*   我们了解到 `NgModule` 和\
  \ `Injectable` 装饰器都可以配置模块注入器，而 `Component` 装饰器则配置元素注入器。\n\n*   我们了解到，对于依赖于其他服务的每个\
  \ Angular 服务，无论配置了哪个注入器，都必须添加 `Injectable` 装饰器。\n\n*   我们了解到根注入器会创建一个全局单例实例，而元素注入器则会创建特定于组件实例（及其子组件）的实例。\n\
  \n*   我们讨论了当 `provide` 和 `useClass` 具有相同值时配置注入器的简写语法。\n\n*   我们了解了响应式编程，并借助 RxJS\
  \ 在 Angular 中实现它。\n\n*   我们了解到在响应式编程中，`Observable` 由 `Subscriber` 订阅，而 `Observer`\
  \ 将数据馈送到 `Observable` 中。\n\n*   我们演示了 RxJS 的 `Subject`，它在响应式编程中同时代表 `Observable`\
  \ 和 `Observer`。\n\n*   我们了解到在实际项目中，RxJS 的 subject 会被标记为私有，而底层的 observable 会作为公共成员暴露。\n\
  \n#### 第 13 章 – 取消订阅\n\n*   我们了解到取消订阅非常重要，否则会导致内存泄漏。\n\n*   我们学习了如何取消订阅 RxJS 订阅。\n\
  \n*   我们了解了 Angular 组件的 `ngOnDestroy` 生命周期事件。\n\n*   我们简要讨论了 Angular 管道。它用于封装 Angular\
  \ 中的转换逻辑（有专门的一章介绍）。\n\n*   最后，我们讨论了 async 管道。\n\n#### 第 14 章 – 登出和路由守卫清理\n\n*  \
  \ 我们了解了通过将现有代码移动到服务中来编写服务逻辑的重要性。\n\n*   在本章中，我们再次复习了元素注入器和模块注入器。由于元素注入器无法满足我们的需求，我们切换到了模块注入器。\n\
  \n*   我们了解到 `AppComponent` 的元素注入器会间接创建一个全局单例实例，因为它作为根组件永远不会被销毁。其次，作为根组件，它创建的服务实例对所有子组件都是可访问的。\n\
  \n*   我们了解到，对于配置根注入器，`Injectable` 装饰器比 `NgModule` 装饰器更受青睐，因为 `Injectable` 装饰器可以实现摇树优化。摇树优化是\
  \ Angular 构建过程中的一个步骤，确保所有未使用的服务从最终打包文件中移除。\n\n*   我们了解到可以在 Angular 中利用 HTML 的功能，例如使用\
  \ HTML 的 `autofocus` 属性、`form` 标签和提交按钮。\n\n#### 第 15 章 – 客户服务\n\n*   我们学习了如何使用 RxJS\
  \ 的 `of` 操作符创建自定义 observable。\n\n*   我们再次演示了如何配置元素注入器。\n\n*   我们复习了 Angular 中的 RxJS\
  \ `Subject`。\n\n*   我们学习了 Angular 中的 RxJS `BehaviorSubject`。\n\n*   我们学习了一种新的故障排除/调试\
  \ Angular 应用程序的方法，即在开发者工具中使用 Angular 暴露的 `ng` 对象。\n\n*   我们看到了 `async as` 的实际应用。\n\
  \n*   我们看到了 `*ngIf with else` 的实际应用。\n\n*   我们讨论了从服务中发出引用类型时面临的挑战。\n\n#### 第 16\
  \ 章 – HTTP 服务\n\n*   我们在应用程序中再次使用了 `HttpClient` 服务。\n\n*   我们使用了 `HttpClient.get`\
  \ 和 `post` 方法的泛型版本。\n\n*   我们再次演示了 `Subject`。\n\n*   我们讨论了基于令牌的身份验证，并在应用程序中实现了它。\n\
  \n*   我们讨论了 `json` 管道。使用此管道，我们可以通过插值显示对象的内容。它们仅用于故障排除。\n\n*   我们了解到，当涉及多个管道时，顺序至关重要。\n\
  \n*   我们演示了使用匿名对象作为泛型参数。虽然不推荐，但在项目中可能会看到。\n\n*   我们了解到，我们使用 `subscribe` 方法来获取发出的值，并使用\
  \ `pipe` 方法将值通过各个操作符进行管道传输，这些操作符可能会改变值甚至停止进一步发出。\n\n*   我们讨论了 RxJS 中的 `map` 操作符。使用它，我们可以将实际的\
  \ HTTP 响应转换为所需的响应。\n\n#### 第 17 章 – 令牌拦截器\n\n*   在本章中，我们学习了如何创建和配置 HTTP 拦截器。\n\n\
  *   我们讨论了 `HttpInterceptor` 接口，创建拦截器时需要实现该接口。\n\n*   我们了解到不能在拦截器中直接修改 HTTP 请求，因为它们是不可变的。因此，我们需要克隆现有请求。我们将头部附加到克隆的请求上，然后将该克隆的请求传递到管道中。\n\
  \n*   我们演示了配置注入器时的长语法和短语法。\n\n\n\n\n\n*   我们了解到，需要显式指定 DI 令牌——`HTTP_INTERCEPTORS`，以便为\
  \ HTTP 拦截器配置注入器。\n*   我们了解到，尽管由于摇树优化的考虑，推荐使用可注入装饰器，但我们不能一直用它来配置模块注入器，因为它不允许我们显式指定\
  \ DI 令牌。\n*   我们还了解到使用 `NgModule` 装饰器配置注入器的好处。与可注入装饰器相比，它提供了更多的配置选项。\n*   我们了解到，注入器需要为\
  \ HTTP 拦截器配置多提供者。\n\n## 第 18 章 – 多提供者\n\n*   在本章中，我们了解到可以为单个 DI 令牌定义多个提供者。这被称为多提供者。\n\
  *   我们了解到，如果为单个 DI 令牌定义了多个常规提供者，那么一个提供者将根据顺序替换另一个。\n*   我们了解到，如果为单个 DI 令牌定义了多个多提供者，那么注入器将注入一个服务数组。\n\
  *   我们了解到，在定义提供者时，DI 令牌和实际服务不要求兼容。它们可以具有完全不同的结构。\n*   我们了解到，不能为单个 DI 令牌同时定义常规提供者和多提供者。对于单个\
  \ DI 令牌，要么所有提供者都是常规的，要么所有提供者都是多提供者。\n*   我们了解到，建议使用字符串或 InjectionToken 与多提供者一起作为\
  \ DI 令牌，而不是使用类型令牌。\n*   我们了解了 `Inject` 装饰器，它允许我们手动告诉 Angular 该参数必须被注入。它将在使用字符串和\
  \ InjectionToken 时使用。\n*   我们了解到，在创建可复用服务时，多提供者有时非常有用。\n\n## 第 19 章 – 编译时配置\n\n\
  *   本章开始时，我们理解了应用程序中配置的必要性。\n*   我们了解了编译时配置和运行时配置之间的区别。编译时配置意味着配置将在编译时完成，而运行时配置意味着它将在部署时完成。\n\
  *   我们了解了 `environment.ts` 文件，以及它如何在生产模式下被 `environment.prod.ts` 文件替换。\n*   我们分别使用\
  \ `ng build` 和 `ng build --prod` 命令生成了 Angular 应用程序的非生产模式和生产模式构建。\n*   我们了解到，在非生产构建中，Angular\
  \ CLI 还会生成源映射文件；因此，我们可以在运行时直接调试 TypeScript 文件。\n*   我们了解到，在生产构建中不会得到单独的 `vendor.js`\
  \ 文件，因为它已集成到主包中。\n*   我们演示了一个名为 `lite-module` 的 Angular 模块，它可以用作静态文件的开发用途 Web 服务器。\n\
  \n## 第 20 章 – 运行时配置\n\n*   我们了解到，位于 Angular 应用程序 SRC 文件夹中的 assets 文件夹将被复制到最终构建中。\n\
  *   我们了解到，可以通过使用 DI 令牌提供者 `APP_INITIALIZER` 配置根注入器，来挂钩 Angular 的初始化过程。\n*   我们了解到，可以使用\
  \ `useFactory` 将一个方法作为值提供给 DI 令牌。\n*   我们讨论了 observable 类的 `toPromise` 方法，它可以从 observable\
  \ 创建一个 promise。\n*   我们了解到，在创建提供者时，使用 `deps` 属性可以指定当前提供者的依赖项。在使用 `useFactory` 时，必须显式定义依赖项。\n\
  *   我们了解到，在使用 `useClass` 的情况下，不需要显式指定依赖服务，因为可注入装饰器会为我们完成这项工作。这就是为什么我们必须为每个服务类附加一个可注入装饰器，无论为其配置了哪个注入器。\n\
  \n## 第 21 章 – 错误处理\n\n本章是第 5 部分的最后一章，因此让我们到达了第 10 站。\n\n*   我们详细讨论了 Angular 中的错误处理。\n\
  *   我们了解到，可以为组件附加组件特定的样式。为此，我们将使用 Component 装饰器的 `styleUrls` 参数。\n*   我们了解到 Angular\
  \ 已经内置了集中式异常处理。默认实现将错误消息打印到控制台。\n*   我们了解到，可以使用自定义 Angular 服务并将其作为新的错误处理程序注入到 Angular\
  \ 管道中，从而覆盖默认行为。为此，我们必须为 DI 令牌 `ErrorHandler` 配置根注入器。\n*   我们了解到，要创建自定义错误处理程序服务，必须实现\
  \ `ErrorHandler` 接口。\n*   我们了解了 `zone.runOutsideAngular` 方法，它允许我们在 Angular 执行上下文之外执行代码。\n\
  *   我们了解了 `zone.run` 方法，它允许我们返回到 Angular 的执行上下文。\n\n# 第 6 部分\n\n## 第 22 章\n\n##\
  \ 组件导向风格实战\n\n## 引言\n\n本章将非常精彩。我们将接手之前的项目，并通过实际遵循组件导向风格来改进它。通过本章，你将完成前往第 11 站的旅程。\n\
  \n### 组件导向风格\n\n**组件导向风格**是一种 UI 设计方法，它允许我们将 UI 创建为可复用和可组合的 Web 组件的集合。\n\n看看下面的\
  \ UI。当你看到它时，你会想到什么？\n\n![](img/Image54019.jpg)\n\n**图 22.1**\n\n这难道不正是两个标签、两个文本框和两个按钮的组合吗？\n\
  \n这些标签、文本框和按钮到底是什么？它们是**组件**。\n\n现在，看看下面这个。你看到了什么？\n\n![](img/Image54071.jpg)\n\n\
  **图 22.2**\n\n你可能会说——下拉菜单。\n\n我不否认。它确实是一个下拉菜单。\n\n*   但它也可以被视为一个文本框、一个按钮和一个显示多个项目的动态框的组合。\n\
  *   按钮通过一些 CSS 放置，使其看起来像是文本框的一部分。\n*   当点击该按钮时，会执行一些代码，使动态框在运行时出现，显示几个列表项。当点击这些列表项时，它们会显示在文本框中。\n\
  \n我的意思是，下拉菜单是一个组件，但它是由其他更小的元素（或者更准确地说是组件）组合而成的。\n\n基于我们到目前为止完成的实验，我相信现在你应该对组件有了清晰的概念。\n\
  \n组件代表整个 UI 的一部分。我们将这些组件组合在一起，形成一个巨大的组件，并持续这样做，直到整个 UI 完成。\n\n到目前为止，在我们的应用程序中，我们已经看到了一些组件的实际应用，例如\
  \ `LoginComponent`、`CustomerComponent`、`ErrorComponent` 和 `ErrorTestComponent` 等。\n\
  \n### 组件导向风格与 Angular\n\n你可能会惊讶地发现，Angular 并没有首创组件导向风格。\n\n你可以看到其他 UI 技术（如 Polymer、ReactJS\
  \ 等）也采用了类似的方法。\n\n这是随着 HTML5 的出现而引入的一种标准方法/实践。\n\n这种方法使我们的代码维护变得容易，并允许多个 UI 开发人员并行工作。\n\
  \n### 当前应用程序中的一个问题\n\n你认为我们在迄今为止开发的当前项目中真正遵循了组件导向风格吗？\n\n嗯，部分是的，部分不是。\n\n\n\n\n\
  我们将应用程序分解为多个组件，每个组件都有其角色——`Login`、`Customer`、`ErrorTest` 和 `Error`。\n\n这些顶层组件将根据项目的功能进行识别。这类组件被称为**功能组件**。\n\
  \n更多的功能会引入更多的组件，这些组件主要通过路由进行访问。\n\n一旦确定了一个功能组件并准备开发，下一步就是确定每个功能组件的设计方式。创建一个庞大的功能组件并不是一个好主意，因为它会使代码变得**不可读**且**难以管理**。我们应该将其分解为多个更小的组件。\n\
  \n在我们的示例中，`CustomerComponent` 应该被分解为多个更小的组件。我们还没有这样做，这就是问题所在。\n\n# 容器-展示模式\n\n在分解功能组件时，容器-展示模式被广泛使用并证明有效。\n\
  \n在这种方法中，我们将功能组件分解为多个组件。其中一个称为容器组件，其他的称为展示组件。\n\n有些人对此有不同的称呼。\n\n**容器组件**被称为**智能**组件。它们将与外部\
  \ API 交互以检索和更新数据。它们负责应用程序状态的变化。\n\n**展示组件**被认为是**哑**组件。它们只负责处理一种功能。它们将处理整个功能组件逻辑的一部分。\n\
  \n它们将依赖容器组件与外部世界进行任何交互，例如与外部 API 交互、更新应用程序状态等。\n\n在下一个演示之后，您将很好地理解这一点。\n\n# 实验室\
  \ – 升级项目以遵循容器-展示模式\n\n为了实现这一点，我们必须引入两个新的组件——`CustomerList` 和 `CustomerAdd`。\n\n\
  *   一个将处理列表，另一个将处理数据输入部分。\n*   这两个组件都将封装在 `CustomerComponent` 内部。\n*   `CustomerComponent`\
  \ 将处理 `CustomerService`。\n\n**步骤 1 – 设置实验室 6**\n\n获取源代码 `lab-5` 并将其重命名为 `lab-6`。\n\
  \n**步骤 2 – 创建 CustomerListComponent**\n\n在 `Customer` 文件夹中创建一个新的 Angular 组件 `CustomerListComponent`，如下所示：\n\
  \n```\nimport {Component} from '@angular/core';\n@Component({\n   selector: 'customer-list',\n\
  \   templateUrl: './customer-list.component.html'\n})\nexport class CustomerListComponent\
  \ {\n}\n```\n\n**步骤 3 – 创建 CustomerAddComponent**\n\n接下来，创建 `CustomerAddComponent`，如下所示：\n\
  \n```\nimport {Component} from '@angular/core';\n@Component({\n   selector: 'customer-add',\n\
  \   templateUrl: './customer-add.component.html'\n})\nexport class CustomerAddComponent\
  \ {}\n```\n\n**步骤 4 – 将两个组件添加到 AppModule**\n\n打开 `app.module.ts`，并将这两个组件添加到 `AppModule`\
  \ 的声明部分。\n\n```\n……\nimport {CustomerAddComponent} from './Customer/customer-add.component';\n\
  import {CustomerListComponent} from './Customer/customer-list.component';\n……\n\
  @NgModule({\n   declarations: [AppComponent, LoginComponent,CustomerComponent, ErrorTestComponent,\
  \ ErrorComponent, CustomerAddComponent,CustomerListComponent],\n  ……\n)\nexport\
  \ class AppModule {}\n```\n\n## 讨论 – 继续\n\n所以现在，我们有三个与客户相关的组件——`CustomerComponent`、`CustomerListComponent`\
  \ 和 `CustomerAddComponent`。\n\n在第一部分中，让我们为新组件准备模板文件。\n\n# 实验室 – 继续\n\n**步骤 5 – 准备\
  \ CustomerList 模板**\n\n`CustomerListComponent` 将负责组件的列表部分。\n\n因此，让我们从 `CustomerComponent`\
  \ 中取出列表部分的 HTML，并将其放入 `CustomerListComponent` 中。（暂时不要对 `CustomerComponent` 做任何更改。我们稍后会处理那部分。现在，只需将内容复制到\
  \ `CustomerList` 中。）\n\n```\n<div class=\"card\">\n   <h5 class=\"card-header\"\
  >Customer List</h5>\n   <div class=\"card-body\">\n     <div class=\"card-title\"\
  >\n       <i class=\"fas fa-user-plus\"></i>\n       <input type=\"button\" value=\"\
  + Add New\"\n       class=\"btn btn-primary fas fa-coffee fa-xs\" (click)=\"AddNew()\"\
  >\n     </div>\n     <table class=\"table table-striped table-bordered\">\n    \
  \   <thead class=\"thead-dark\">\n         <tr>\n           <th scope=\"col\">First\
  \ Name</th><th scope=\"col\">Last Name</th>\n         </tr>\n       </thead>\n \
  \      <tbody>\n         <tr *ngFor=\"let item of (Customers$|async)\">\n      \
  \     <td scope=\"row\">{{item.FName}}</td><td>{{item.LName}}</td>\n         </tr>\n\
  \       </tbody>\n     </table>\n   </div>\n</div>\n```\n\n**步骤 6 – 准备 CustomerListComponent\
  \ 的视图类**\n\n`CustomerListComponent` 需要两样东西——`Customers$` 变量和 `AddNew` 方法。\n\n让我们添加它们。\n\
  \n```\n……\nexport class CustomerListComponent {\n   Customers$: Observable<Array<Customer>>;\n\
  \   AddNew() {\n  }\n}\n```\n\n**步骤 7 – 准备 CustomerAddComponent 模板**\n\n从 `CustomerComponent`\
  \ 中取出整个数据输入部分，并将其放入 `CustomerAddComponent` 中，如下所示：\n\n```\n<div class=\"card\" ngForm\
  \ #myForm=\"ngForm\">\n   <h5 class=\"card-header\">Add New Customer</h5>\n   <div\
  \ class=\"card-body\">\n     <div class=\"form-group\">\n       <label for=\"FName\"\
  >First Name: </label>\n       <input class=\"form-control\" [ngClass]=\"{'is-valid':F.valid,'is-invalid':F.invalid}\"\
  \ type=\"text\" name=\"FName\"\n         [(ngModel)]=\"this.FirstName\" required\
  \ minlength=\"3\" #F=\"ngModel\">\n       <!-- error -->\n       <div class=\"alert\
  \ alert-danger\" [hidden]=\"!(F.dirty && F.errors?.required)\">\n         Enter\
  \ First Name\n       </div>\n       <div class=\"alert alert-danger\" [hidden]=\"\
  !(F.dirty && F.errors?.minlength)\">\n         Minimum 3 characters needed for First\
  \ Name\n       </div>\n     </div>\n     <div class=\"form-group\">\n       <label\
  \ for=\"LName\">Last Name:</label>\n       <input class=\"form-control\" [ngClass]=\"\
  {'is-valid':L.valid,'is-invalid':L.invalid}\" type=\"text\" name=\"LName\"\n   \
  \      [(ngModel)]=\"this.LastName\" required minlength=\"3\" #L=\"ngModel\">\n\
  \       <!-- error -->\n       <div class=\"alert alert-danger\" [hidden]=\"!(L.dirty\
  \ && L.errors?.required)\">\n         Enter Last Name\n       </div>\n       <div\
  \ class=\"alert alert-danger\" [hidden]=\"!(L.dirty && L.errors?.minlength)\">\n\
  \         Minimum 3 characters needed for Last Name\n       </div>\n     </div>\n\
  \     <input type=\"button\" class=\"btn btn-success\" value=\"Save\" (click)=\"\
  Save()\" [disabled]=\"myForm.invalid\"> &nbsp;\n     <input type=\"button\" class=\"\
  btn btn-danger\" value=\"Cancel\" (click)=\"Cancel()\">\n   </div>\n</div>\n```\n\
  \n**步骤 8 – 准备 CustomerAddComponent 视图类**\n\n`CustomerAddComponent` 逻辑上需要以下内容——`FirstName`\
  \ 和 `LastName` 变量、`CustomerForm` 变量、`Reset`、`Save` 和 `Cancel` 方法。\n\n```\nexport\
  \ class CustomerAddComponent {\n   FirstName: string;\n   LastName: string;\n  \
