  \ 1**：如果验证失败，在控件周围添加红色边框。\n\n**阶段 2**：显示错误消息。\n\n为了完成阶段 1，我们将使用 CSS，而最棒的是 `ngModel`\
  \ 会根据条件动态地将 CSS 类应用于控件。我们只需定义这些类即可。\n\n![](img/Image48430.jpg)\n\n**图 9.24**\n\n\
  你可以注意到控件上附加了以下三个 CSS 类：\n\n1. `ng-untouched`：表示控件尚未被触摸。将光标放入文本框然后移出焦点，`ng-untouched`\
  \ 将变为 `ng-touched`。一旦被触摸，就不能再回到未触摸状态。\n2. `ng-pristine`：表示控件的值未被修改。尝试将其更改为任何值，它将变为\
  \ `ng-dirty`。一旦变脏，就不能再回到原始状态。\n3. `ng-valid`：表示控件包含有效值，当验证失败时会变为 `ng-invalid`。与其他两个不同，这个类会在有效和无效之间切换。\n\
  \n**如何附加验证？**\n\n为此，我们将使用 HTML 属性，例如 *required*、*minlength*、*pattern* 等。\n\n## 实验\
