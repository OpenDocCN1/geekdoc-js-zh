    A more sophisticated retry strategy is to use exponential backoff. This approach
    increases the delay between retry attempts, reducing the load on the server and
    increasing the chances of a successful request.


    ```

    async  function  fetchWithExponentialBackoff(url, options  = {}, maxRetries  =  5)
    {


      for (let  i  =  0; i  <  maxRetries; i++) {


        try {const  response  =  await  fetch(url, options);


          if (!response.ok) {


            throw  new  Error(`HTTP error! status: ${response.status}`);


          }


          return  await  response.json();


        } catch (error) {


          if (i  ===  maxRetries  -  1) throw  error;


          const  delay  =  Math.pow(2, i) *  1000; // Exponential backoff       console.log(`Attempt
    ${i  +  1} failed. Retrying in ${delay}ms...`);


          await  new  Promise(resolve  =>  setTimeout(resolve, delay));


        }


      }


    } // Usage (async () => {try {const  data  =  await  fetchWithExponentialBackoff(''https://api.example.com/data'');


        console.log(''Fetched data:'', data);


      } catch (error) {


        console.error(''Failed to fetch data after multiple attempts:'', error);


      }


    })();

    ```


    In this implementation, the delay between retries increases exponentially. The
    first retry happens after 1 second, the second after 2 seconds, the third after
    4 seconds, and so on.


    ### Retry with Jitter


    To prevent multiple clients from retrying at exactly the same time after a server
    failure, it''s often beneficial to add some randomness (jitter) to the retry delay:


    ```

    async  function  fetchWithBackoffAndJitter(url, options  = {}, maxRetries  =  5)
    {


      for (let  i  =  0; i  <  maxRetries; i++) {


        try {const  response  =  await  fetch(url, options);


          if (!response.ok) {


            throw  new  Error(`HTTP error! status: ${response.status}`);


          }


          return  await  response.json();


        } catch (error) {


          if (i  ===  maxRetries  -  1) throw  error;


          const  baseDelay  =  Math.pow(2, i) *  1000;


          const  jitter  =  Math.random() *  1000;


          const  delay  =  baseDelay  +  jitter;


          console.log(`Attempt ${i  +  1} failed. Retrying in ${delay}ms...`);


          await  new  Promise(resolve  =>  setTimeout(resolve, delay));


        }


      }


    } // Usage (async () => {try {const  data  =  await  fetchWithBackoffAndJitter(''https://api.example.com/data'');


        console.log(''Fetched data:'', data);


      } catch (error) {


        console.error(''Failed to fetch data after multiple attempts:'', error);


      }


    })();

    ```


    This implementation adds a random jitter of up to 1 second to each retry delay,
    helping to distribute retry attempts more evenly.


    ### Conditional Retries


    In some cases, you might want to retry only for certain types of errors. For example,
    you might retry on network errors or server errors (5xx status codes), but not
    on client errors (4xx status codes).


    ```

    async  function  fetchWithConditionalRetry(url, options  = {}, maxRetries  =  3)
    {


      for (let  i  =  0; i  <  maxRetries; i++) {


        try {const  response  =  await  fetch(url, options);


          if (response.ok) {


            return  await  response.json();


          }


          if (response.status  >=  400  &&  response.status  <  500) {


            // Don''t retry client errors         throw  new  Error(`Client error!
    status: ${response.status}`);


          }


          throw  new  Error(`Server error! status: ${response.status}`);


        } catch (error) {


          if (i  ===  maxRetries  -  1  ||  error.message.includes(''Client error''))
    {


            throw  error;


          }


          console.log(`Attempt ${i  +  1} failed. Retrying...`);


          await  new  Promise(resolve  =>  setTimeout(resolve, 1000));


        }


      }


    } // Usage (async () => {try {const  data  =  await  fetchWithConditionalRetry(''https://api.example.com/data'');


        console.log(''Fetched data:'', data);


      } catch (error) {


        console.error(''Failed to fetch data:'', error);


      }


    })();

    ```


    This implementation immediately throws an error for client errors (4xx status
    codes) without retrying, while retrying for server errors (5xx status codes) and
    network errors.


    ## Creating Delays with Asynchronous Code


    Sometimes in asynchronous programming, you need to introduce deliberate delays.
    This could be for various reasons:


    1. To simulate network latency in testing environments.

    2. To implement rate limiting when making API calls.

    3. To create animations or timed events in user interfaces.

    4. To space out operations to reduce server load.


    Let''s explore different ways to create delays in asynchronous JavaScript.


    ### Using setTimeout with Promises


    The most basic way to create a delay is to use `setTimeout` wrapped in a `Promise`:


    ```

    function  delay(ms) {


      return  new  Promise(resolve  =>  setTimeout(resolve, ms));


    } // Usage async  function  exampleWithDelay() {


      console.log(''Starting'');


      await  delay(2000); // Wait for 2 seconds   console.log(''Two seconds have passed'');


      await  delay(1000); // Wait for 1 more second   console.log(''One more second
    has passed'');


    } exampleWithDelay();

    ```


    This `delay()` function returns a `Promise` that resolves after the specified
    number of milliseconds. By using `await`, we can easily introduce delays in our
    async functions.


    ### Creating a Sleep Function


    We can create a more expressive `sleep()` function that mimics the behavior found
    in other programming languages:


    ```

    async  function  sleep(seconds) {


      await  new  Promise(resolve  =>  setTimeout(resolve, seconds  *  1000));


    } // Usage async  function  countdownWithSleep() {


      for (let  i  =  5; i  >  0; i--) {


        console.log(i);


        await  sleep(1);


      }


      console.log(''Liftoff!'');


    } countdownWithSleep();

    ```


    This `sleep()` function takes the number of seconds to wait, making it more intuitive
    to use than specifying milliseconds.


    ### Implementing a Timed Retry Mechanism


    We can combine our `delay()` function with a retry mechanism to create a timed
    retry for API calls:


    ```

    async  function  fetchWithTimedRetry(url, options  = {}, maxRetries  =  3, delayMs  =  1000)
    {


      for (let  i  =  0; i  <  maxRetries; i++) {


        try {const  response  =  await  fetch(url, options);


          if (!response.ok) {


            throw  new  Error(`HTTP error! status: ${response.status}`);


          }


          return  await  response.json();


        } catch (error) {


          if (i  ===  maxRetries  -  1) throw  error;


          console.log(`Attempt ${i  +  1} failed. Retrying in ${delayMs}ms...`);


          await  delay(delayMs);


        }


      }


    } // Usage (async () => {try {const  data  =  await  fetchWithTimedRetry(''https://api.example.com/data'');


        console.log(''Fetched data:'', data);


      } catch (error) {


        console.error(''Failed to fetch data after multiple attempts:'', error);


      }


    })();

    ```


    This implementation retries the fetch operation with a fixed delay between attempts.


    ### Implementing Rate Limiting


    Delays can be crucial for implementing rate limiting when making API calls. Here''s
    an example of a simple rate limiter:


    ```

    class  RateLimiter {constructor(limit, interval) {


        this.limit  =  limit;


        this.interval  =  interval;


        this.queue  = [];this.lastRun  =  Date.now();


      }


      async  run(fn) {


        this.queue.push(fn);


        await  this.process();


      }


      async  process() {


        if (this.queue.length  ===  0) return;


        const  now  =  Date.now();


        if (now  -  this.lastRun  <  this.interval) {


          await  delay(this.interval  - (now  -  this.lastRun));


        }


        const  fn  =  this.queue.shift();


        this.lastRun  =  Date.now();


        await  fn();


        if (this.queue.length  >  0) {


          await  this.process();


        }


      }


    } // Usage const  limiter  =  new  RateLimiter(1, 1000); // 1 request per second   async  function  fetchWithRateLimit(url)
    {


      return  limiter.run(() =>  fetch(url).then(res  =>  res.json()));


    } // Example usage (async () => {for (let  i  =  0; i  <  5; i++) {


        const  data  =  await  fetchWithRateLimit(`https://api.example.com/data/${i}`);


        console.log(`Fetched data ${i}:`, data);


      }


    })();

    ```

