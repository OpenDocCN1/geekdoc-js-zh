    } button:hover {background-color: #0056b3;


    } .movie {background-color: #f9f9f9;


        border: 1px  solid  #ddd;


        padding: 10px;


        margin-bottom: 10px;


        border-radius: 3px;


    } .movie  h2 {margin-top: 0;


    }


    ### Implementing the Movie Database App


    Now, let''s create our app.js file and implement the movie database application:


    const  API_KEY  =  ''your_api_key_here''; // Replace with your actual TMDB API
    key const  BASE_URL  =  ''https://api.themoviedb.org/3''; const  movieIds  = [550,
    551, 552, 553, 554]; // Example movie IDs   const  fetchSequentialButton  =  document.getElementById(''fetchSequential'');
    const  fetchParallelButton  =  document.getElementById(''fetchParallel''); const  movieList  =  document.getElementById(''movieList'');
    async  function  fetchMovie(id) {


        const  response  =  await  fetch(`${BASE_URL}/movie/${id}?api_key=${API_KEY}`);


        if (!response.ok) {


            throw  new  Error(`HTTP error! status: ${response.status}`);


        }


        return  await  response.json();


    } function  displayMovie(movie) {


        const  movieElement  =  document.createElement(''div'');


        movieElement.classList.add(''movie'');


        movieElement.innerHTML  =  `          <h2>${movie.title}</h2>  <p>Release
    Date: ${movie.release_date}</p>  <p>Overview: ${movie.overview}</p>      `;


        movieList.appendChild(movieElement);


    } async  function  fetchMoviesSequentially() {


        movieList.innerHTML  =  ''<p>Fetching movies sequentially...</p>'';


        console.time(''Sequential'');


        for (const  id  of  movieIds) {


            try {const  movie  =  await  fetchMovie(id);


                displayMovie(movie);


            } catch (error) {


                console.error(`Error fetching movie ${id}:`, error);


            }


        }


        console.timeEnd(''Sequential'');


    } async  function  fetchMoviesInParallel() {


        movieList.innerHTML  =  ''<p>Fetching movies in parallel...</p>'';


        console.time(''Parallel'');


        const  moviePromises  =  movieIds.map(id  =>  fetchMovie(id));


        try {const  movies  =  await  Promise.all(moviePromises);


            movies.forEach(displayMovie);


        } catch (error) {


            console.error(''Error fetching movies:'', error);


        }


        console.timeEnd(''Parallel'');


    } fetchSequentialButton.addEventListener(''click'', fetchMoviesSequentially);
    fetchParallelButton.addEventListener(''click'', fetchMoviesInParallel);


    In this implementation, we''ve created two main functions: fetchMoviesSequentially
    and fetchMoviesInParallel. These functions demonstrate two different approaches
    to fetching multiple pieces of data:


    1.  Sequential Fetching: In fetchMoviesSequentially, we use a for...of loop with
    await to fetch each movie one after the other. This approach is useful when the
    order of operations matters or when you need to process each result before moving
    on to the next request.


    2.  Parallel Fetching: In fetchMoviesInParallel, we use Promise.all to fetch all
    movies simultaneously. This approach is generally faster when dealing with independent
    requests, as it allows them to be processed concurrently.


    We''ve also included console.time and console.timeEnd calls to measure the performance
    difference between these two approaches.


    The fetchMovie function is a reusable async function that fetches data for a single
    movie. We''ve implemented error handling using try/catch blocks to gracefully
    handle any errors that might occur during the API calls.


    The displayMovie function takes a movie object and creates a DOM element to display
    its information. This function is called for each successfully fetched movie.


    ### Testing the Movie Database App


    To test the movie database app, you''ll need to sign up for a free API key from
    TMDB (https://www.themoviedb.org/documentation/api). Once you have your API key,
    replace ''your_api_key_here'' in the app.js file with your actual API key.


    When you open the HTML file in a browser, you should see two buttons: "Fetch Sequentially"
    and "Fetch in Parallel". Clicking these buttons will fetch movie data using the
    respective methods and display the results on the page.


    This project demonstrates how to handle multiple asynchronous operations, both
    sequentially and in parallel, using async/await and Promise.all. It also showcases
    how to structure your code to handle API calls, process the results, and update
    the UI accordingly.


