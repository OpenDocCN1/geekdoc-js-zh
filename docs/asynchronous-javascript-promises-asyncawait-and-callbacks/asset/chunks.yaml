    \  = () => ({component:  import('./AsyncComponent.vue'),\n  loading:  LoadingComponent,\n\
    \  error:  ErrorComponent,\n  delay:  200,\n  timeout:  3000 })\n```\n\nThis creates\
    \ a component that's loaded asynchronously. Vue will show a loading component\
