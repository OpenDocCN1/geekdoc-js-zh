      .then(response  => {if (!response.ok) {


          throw  new  Error(`HTTP error! status: ${response.status}`);


        }


        return  response.json();


      })


      .then(data  =>  console.log(data))


      .catch(error  =>  console.error(''There was a problem with the fetch operation:'',
    error));


    ### Unnecessary Use of Async/Await


    While async/await is powerful, it''s not always necessary. Using it unnecessarily
    can lead to less efficient code.


    // Anti-pattern: Unnecessary async/await const  getData  =  async () => {return  "some
    data";


    }; // Better approach: Regular function const  getData  = () => {return  "some
    data";


