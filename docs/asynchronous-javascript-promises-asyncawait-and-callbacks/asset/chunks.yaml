    在这个示例中，我们首先获取用户数据，然后使用该数据获取用户的帖子。每个 `.then()` 返回一个新的 Promise，允许我们链式调用这些操作。\n\n\
    ### .catch() 方法\n\n`.catch()` 方法用于处理 Promise 链中发生的任何错误。它等同于 `.then(null, errorHandlingFunction)`，但更易读，是推荐的处理错误的方式。\n\
    \n```javascript\nmyPromise\n  .then((result) => {\n    console.log(\"Promise 已兑现:\"\
    , result);\n  })\n  .catch((error) => {\n    console.error(\"发生错误:\", error);\n\
    \  });\n```\n\n`.catch()` 方法会处理它之前 Promise 链中的任何拒绝。这意味着你可以在多个 `.then()` 方法之后使用一个\
    \ `.catch()` 来处理前面任何步骤中可能发生的错误。\n\n```javascript\nfetchUserData(123)\n  .then((userData)\
    \ => {\n    console.log(\"用户数据:\", userData);\n    return fetchUserPosts(userData.id);\n\
    \  })\n  .then((posts) => {\n    console.log(\"用户帖子:\", posts);\n    return analyzeUserActivity(posts);\n\
    \  })\n  .catch((error) => {\n    console.error(\"发生错误:\", error);\n  });\n```\n\
    \n在这个示例中，如果 `fetchUserData()`、`fetchUserPosts()` 或 `analyzeUserActivity()` 中发生错误，都会被末尾的单个\
    \ `.catch()` 捕获。\n\n### .finally() 方法\n\n`.finally()` 方法用于指定一个回调，无论 Promise 被兑现还是被拒绝，该回调都会执行。这对于在成功和失败情况下都需要执行的清理操作非常有用。\n\
    \n```javascript\nmyPromise\n  .then((result) => {\n    console.log(\"Promise 已兑现:\"\
    , result);\n  })\n  .catch((error) => {\n    console.error(\"发生错误:\", error);\n\
    \  })\n  .finally(() => {\n    console.log(\"Promise 已敲定，在此处进行清理\");\n  });\n\
    ```\n\n`.finally()` 方法特别适用于关闭数据库连接或文件句柄，或更新 UI 元素以指示操作已完成等任务。\n\n```javascript\n\
    let isLoading = true;\nfetchData()\n  .then((data) => {\n    console.log(\"数据已获取:\"\
