    In this example, we have three separate functions to fetch different types of
    data related to a user: fetchUserData, fetchUserPosts, and fetchUserComments.
    Each of these functions is asynchronous and returns a Promise.


    The getUserInfo function demonstrates how to use Promise.all with async/await:


    1.  We pass an array of Promises to Promise.all. Each Promise is created by calling
    one of our fetch functions.


    2.  We use await with Promise.all, which pauses the execution of getUserInfo until
    all the Promises have resolved (or one of them has rejected).


    3.  We use array destructuring to assign the results of each Promise to separate
    variables.


    4.  If any of the Promises reject, the catch block will handle the error.


    This approach has several advantages:


    *   It allows us to start all three fetch operations concurrently, potentially
    saving significant time compared to running them sequentially.


    *   The code remains clean and readable, clearly showing the intent to fetch multiple
    pieces of information in parallel.


    *   Error handling is straightforward, catching any errors that occur in any of
    the parallel operations.'
