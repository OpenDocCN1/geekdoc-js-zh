    \ } from  'vue'  export  function  useFetch(url) {\n  const  data  =  ref(null)\n\
    \  const  error  =  ref(null)\n  async  function  fetchData() {\n    try {const\
    \  response  =  await  fetch(url)\n      data.value  =  await  response.json()\n\
    \    } catch (err) {\n      error.value  =  err }\n  }onMounted(fetchData)\n \
    \ return { data, error, refresh:  fetchData }\n} // Usage in a component export\
