    \ \"John Doe\", email: \"john@example.com\" });\n      } else {\n        reject(new\
    \ Error(\"用户未找到\"));\n      }\n    }, 1000); // 模拟 1 秒延迟\n  });\n}\n```\n\n这个函数返回一个\
    \ Promise，如果 `userId` 是 123，则 resolve 并返回用户数据，否则 reject 并返回错误。\n\n### 使用 Promise\n\
    \n使用 Promise 涉及使用 `then()`、`catch()` 和 `finally()` 等方法来处理异步操作的结果。\n\n`then()`\
