    It''s important to note that while `Promise.all` runs the Promises concurrently,
    it will reject immediately if any of the input Promises reject. If you need all
    Promises to settle regardless of whether they fulfill or reject, you can use `Promise.allSettled`
    instead.


    Here''s how you might use `Promise.allSettled`:


    ```

    async  function  getUserInfoWithAllSettled(userId) {


      try {const  results  =  await  Promise.allSettled([


          fetchUserData(userId),


          fetchUserPosts(userId),


          fetchUserComments(userId)


        ]);


        return  results.map(result  => {if (result.status  ===  ''fulfilled'') {


            return  result.value;


          } else {console.error(''Operation failed:'', result.reason);


            return  null;


          }


        });


      } catch (error) {


        console.error(''An unexpected error occurred:'', error);


        throw  error;


      }


    }

    ```


    In this version, even if one or more of the fetch operations fail, the function
    will still return an array with the results of all operations, allowing you to
    handle partial failures more gracefully.


    Combining `async/await` with `Promise.all` (or `Promise.allSettled`) allows you
    to write efficient, concurrent asynchronous code that is still easy to read and
    reason about. This combination is particularly powerful when dealing with multiple
    independent asynchronous operations, such as making several API calls in parallel
    or processing multiple files simultaneously.


    As you become more comfortable with `async/await` and Promises, you''ll find that
    this combination provides a flexible and powerful toolset for handling complex
    asynchronous workflows in your JavaScript applications.,


    # Chapter 6: Common Patterns and Use Cases


    # ​❧​


    In the world of asynchronous JavaScript programming, certain patterns and use
    cases emerge as particularly common and useful. This chapter will explore four
    such patterns: fetching data from APIs asynchronously, managing sequential versus
    parallel execution of async code, implementing retry mechanisms for failed requests,
    and creating deliberate delays in code execution. Each of these patterns addresses
    specific challenges that developers frequently encounter when working with asynchronous
    operations, and mastering them will significantly enhance your ability to write
    efficient, robust, and responsive JavaScript applications.


    ## Fetching Data from APIs Asynchronously


    In modern web development, fetching data from external APIs is a fundamental operation.
    Whether you''re building a weather app, a social media dashboard, or an e-commerce
    platform, the ability to retrieve data from remote servers is crucial. Asynchronous
    JavaScript provides powerful tools for handling these operations smoothly, ensuring
    that your application remains responsive while waiting for data to arrive.


    ### Using Fetch API with Promises


    The Fetch API, introduced as part of the HTML5 standard, provides a powerful and
    flexible way to make HTTP requests. It returns a Promise, making it naturally
    suited for asynchronous operations. Here''s a basic example of how to use the
    Fetch API to retrieve data from a hypothetical weather API:


    ```

    function  getWeatherData(city) {


      return  fetch(`https://api.weatherapp.com/forecast?city=${city}`)


        .then(response  => {if (!response.ok) {


            throw  new  Error(''Network response was not ok'');


          }


          return  response.json();


        })


        .then(data  => {console.log(''Weather data:'', data);


          return  data;


        })


        .catch(error  => {console.error(''There was a problem fetching the weather
    data:'', error);


        });


    } getWeatherData(''New York'');

    ```


    In this example, we define a function `getWeatherData` that takes a city name
    as an argument. It uses the Fetch API to make a GET request to our hypothetical
    weather API. The `fetch` function returns a Promise that resolves with the response
    from the server. We then chain `.then()` methods to handle the response:


    1.  The first `.then()` checks if the response was successful (`response.ok`).
    If not, it throws an error. If successful, it parses the JSON from the response.


    2.  The second `.then()` logs the parsed data and returns it for further use.


    3.  The `.catch()` at the end handles any errors that occurred during the fetch
    operation or in the preceding `.then()` blocks.


    ### Using Async/Await for Cleaner Code


    While the Promise-based approach works well, the `async/await` syntax often leads
    to cleaner, more readable code, especially when dealing with multiple asynchronous
    operations. Here''s the same example rewritten using `async/await`:


    ```

    async  function  getWeatherData(city) {


      try {const  response  =  await  fetch(`https://api.weatherapp.com/forecast?city=${city}`);


        if (!response.ok) {


          throw  new  Error(''Network response was not ok'');


        }


        const  data  =  await  response.json();


        console.log(''Weather data:'', data);


        return  data;


      } catch (error) {


        console.error(''There was a problem fetching the weather data:'', error);


      }


    } // Usage (async () => {const  weatherData  =  await  getWeatherData(''New York'');


      // Do something with weatherData })();

    ```


    In this version, we use the `async` keyword to define an asynchronous function.
    Inside the function, we use `await` to pause execution until the Promise returned
    by `fetch` resolves. This allows us to write the code in a more synchronous-looking
    style, which many developers find easier to read and reason about.


    The `try/catch` block provides a clean way to handle errors that might occur during
    the fetch operation or while parsing the JSON. This approach centralizes error
    handling, making it easier to manage and debug issues.


    ### Handling Multiple API Calls


    Often, you''ll need to make multiple API calls, either sequentially or in parallel.
    Asynchronous JavaScript provides elegant solutions for both scenarios.


    #### Sequential API Calls


    Sometimes, the result of one API call is needed to make the next call. In such
    cases, you need to make the calls sequentially. Here''s an example where we first
    fetch a user''s profile, then use that information to fetch their latest posts:


    ```

    async  function  getUserDataAndPosts(userId) {


      try {// First, fetch the user profile     const  userResponse  =  await  fetch(`https://api.example.com/users/${userId}`);


        if (!userResponse.ok) throw  new  Error(''Failed to fetch user data'');


        const  userData  =  await  userResponse.json();


        // Then, use the user''s ID to fetch their posts     const  postsResponse  =  await  fetch(`https://api.example.com/posts?userId=${userData.id}`);


        if (!postsResponse.ok) throw  new  Error(''Failed to fetch user posts'');


        const  postsData  =  await  postsResponse.json();


        return { user:  userData, posts:  postsData };


      } catch (error) {


        console.error(''Error fetching user data and posts:'', error);


      }


    } // Usage (async () => {const  userDataAndPosts  =  await  getUserDataAndPosts(123);


      console.log(userDataAndPosts);


    })();

    ```


    In this example, we first fetch the user data, and only after that''s complete
    do we fetch the user''s posts. This ensures that we have the necessary user information
    before attempting to retrieve their posts.


    #### Parallel API Calls


    When the API calls are independent of each other, you can improve performance
    by making them in parallel. The `Promise.all()` method is perfect for this scenario:


    ```

    async  function  getWeatherForMultipleCities(cities) {


      try {const  weatherPromises  =  cities.map(city  => fetch(`https://api.weatherapp.com/forecast?city=${city}`)


            .then(response  =>  response.json())


        );


        const  weatherData  =  await  Promise.all(weatherPromises);


        return  weatherData;


      } catch (error) {


        console.error(''Error fetching weather data:'', error);


      }


    } // Usage (async () => {const  cities  = [''New York'', ''London'', ''Tokyo'',
    ''Sydney''];


      const  allWeatherData  =  await  getWeatherForMultipleCities(cities);


      console.log(allWeatherData);


    })();

    ```

