    \ 方法总是返回一个新的 Promise，这允许链式调用。当你需要按顺序执行多个异步操作时，这尤其有用。\n\n```javascript\nfetchUserData(123)\n\
    \  .then((userData) => {\n    console.log(\"用户数据:\", userData);\n    return fetchUserPosts(userData.id);\n\
