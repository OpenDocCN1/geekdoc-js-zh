      const  posts  =  await  fetch(`/api/posts?userId=${userId}`).then(res  =>  res.json());


      const  comments  =  await  Promise.all(posts.map(post  => fetch(`/api/comments?postId=${post.id}`).then(res  =>  res.json())


      ));'
