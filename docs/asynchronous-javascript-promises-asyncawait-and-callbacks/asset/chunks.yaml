    \ 范式\n\n虽然 Promise 相比回调有了显著改进，但 JavaScript 在 ECMAScript 2017（ES8）中引入了 `async`/`await`\
    \ 语法，又向前迈进了一大步。Async/await 提供了一种使用更接近同步代码的语法来处理 Promise 的方式，使得异步代码更易于编写和理解。\n\n\
    `async` 关键字用于定义返回 Promise 的函数，而 `await` 关键字在 async 函数内部使用，用于等待 Promise 解析后再继续执行。\n\
