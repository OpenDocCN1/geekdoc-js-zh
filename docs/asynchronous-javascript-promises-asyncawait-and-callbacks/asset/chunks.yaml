    考虑这样一种情况：你正在为 API 调用实现超时机制。你希望要么获取 API 响应，要么在耗时过长时取消操作。下面展示了如何使用 `Promise.race`
    来实现这一点：


    ```

    const  fetchData  =  new  Promise(resolve  => {setTimeout(() =>  resolve(''数据获取成功''),
    3000);


    }); const  timeout  =  new  Promise((_, reject) => {setTimeout(() =>  reject(new  Error(''请求超时'')),
    2000);


    }); Promise.race([fetchData, timeout])


      .then(result  =>  console.log(result))


      .catch(error  =>  console.error(error.message));

    ```


    在这个例子中，`Promise.race` 会以最先敲定的 promise 为准。如果 `fetchData` 在超时之前解决，我们会看到成功消息。然而，由于超时被设置为在
    `fetchData` 解决之前触发，我们实际上会看到超时错误。


    `Promise.race` 特别适用于实现超时、处理来自多个服务器的第一个响应，或者在冗余操作中选择最快的可用选项。


    ## `Promise.allSettled` 和 `Promise.any` 的作用


    随着 JavaScript 的不断发展，新的方法被引入以更细致地处理 promise。其中两个方法是 `Promise.allSettled` 和 `Promise.any`，它们各自在管理多个
    promise 时服务于独特的用例。


    ### `Promise.allSettled`：全面的报告者


    `Promise.allSettled` 在 ES2020 中引入，它接收一个可迭代的 promise 集合，并等待所有 promise 敲定，无论它们是兑现还是拒绝。当你想要知道一组中每个
    promise 的结果，而不关心它们各自的成功或失败时，这个方法特别有用。


    考虑一个场景：你正在批量处理一组操作，并且想要知道每个操作的结果，无论成功与否：


    ```

    const  promises  = [Promise.resolve(1),


      Promise.reject(''发生错误''),


      new  Promise(resolve  =>  setTimeout(() =>  resolve(3), 1000))


    ]; Promise.allSettled(promises)


      .then(results  => {results.forEach((result, index) => {if (result.status  ===  ''fulfilled'')
    {


            console.log(`Promise ${index  +  1} 以值兑现:`, result.value);


          } else {console.log(`Promise ${index  +  1} 因原因拒绝:`, result.reason);


          }


        });


      });

    ```


    输出结果大致如下：


    ```

    Promise 1 以值兑现: 1

    Promise 2 因原因拒绝: 发生错误

    Promise 3 以值兑现: 3

    ```


    当你需要执行多个独立操作，并且想要知道每个操作的结果（无论某些操作是否可能失败）时，`Promise.allSettled` 非常宝贵。这在批量更新等场景中特别有用，你希望尽可能多地处理项目并报告所有结果。


    ### `Promise.any`：乐观的敲定者


    `Promise.any` 在 ES2021 中引入，它接收一个可迭代的 promise 集合，并返回一个单一的 promise，该 promise 会在集合中的任何一个
    promise 兑现时立即解决。如果所有 promise 都被拒绝，它会以一个包含所有拒绝原因的 `AggregateError` 拒绝。


    这个方法非常适合你有多个备选方案并且只关心第一个成功结果的场景。让我们看一个例子：你试图从多个服务器获取数据，并且希望使用第一个成功的响应：


    ```

    const  server1  =  new  Promise((resolve, reject) =>  setTimeout(() =>  reject(new  Error(''服务器
    1 失败'')), 1000)); const  server2  =  new  Promise(resolve  =>  setTimeout(() =>  resolve(''来自服务器
    2 的数据''), 2000)); const  server3  =  new  Promise(resolve  =>  setTimeout(() =>  resolve(''来自服务器
    3 的数据''), 3000)); Promise.any([server1, server2, server3])


      .then(result  =>  console.log(''第一个成功响应:'', result))


      .catch(error  => {if (error  instanceof  AggregateError) {


          console.error(''所有服务器都失败了:'', error.errors);


        }


      });

    ```


    在这个例子中，尽管 `server1` 拒绝了，`Promise.any` 会以来自 `server2` 的数据解决，因为它是第一个成功解决的 promise。如果所有
    promise 都被拒绝，catch 块会捕获一个包含所有拒绝原因的 `AggregateError`。


    `Promise.any` 特别适用于你有后备选项并希望使用第一个可用的成功结果的场景，例如尝试多个 CDN、API 端点或数据源。


    ## 管理 Promise 拒绝与错误处理


    在使用 promise 时，正确的错误处理至关重要。未处理的 promise 拒绝可能导致静默失败和难以调试的问题。让我们探讨一些有效管理 promise
    拒绝的最佳实践和技术。


    ### catch 块的重要性


    始终在 promise 链后链式调用 `catch` 块以处理潜在错误：


    ```

    fetchData()


      .then(processData)


      .then(displayResults)


      .catch(error  => {console.error(''发生错误:'', error);


        // 适当地处理错误   });

    ```


    这确保了 `fetchData`、`processData` 或 `displayResults` 中抛出的任何错误都会被捕获并处理。


    ### 重新抛出错误


    有时，你可能希望处理错误但仍然将其向上传播到链中。你可以通过在 `catch` 块中重新抛出错误来实现这一点：


    ```

    fetchData()


      .then(processData)


      .catch(error  => {console.error(''处理数据时出错:'', error);


        // 执行一些清理或日志记录     throw  error; // 重新抛出错误   })


      .then(displayResults)


      .catch(error  => {console.error(''显示结果时出错:'', error);


        showErrorMessage(error);


      });

    ```


    ### 使用 `finally` 进行清理


    `finally` 方法对于执行无论 promise 是兑现还是拒绝都应发生的清理操作非常有用：


    ```

    showLoadingSpinner(); fetchData()


      .then(processData)


      .then(displayResults)


      .catch(error  => {console.error(''发生错误:'', error);


        showErrorMessage(error);


      })


      .finally(() => {hideLoadingSpinner();


      });

    ```


    ### 自定义错误类型


    创建自定义错误类型有助于区分不同类型的错误并适当地处理它们：


    ```

    class  NetworkError  extends  Error {constructor(message) {


        super(message);


        this.name  =  ''NetworkError'';


      }


    } class  ValidationError  extends  Error {constructor(message) {


        super(message);


        this.name  =  ''ValidationError'';


      }


    } fetchData()


      .then(validateData)


      .then(processData)


      .catch(error  => {if (error  instanceof  NetworkError) {


          // 处理网络错误 } else  if (error  instanceof  ValidationError) {


          // 处理验证错误 } else {// 处理其他类型的错误     }


      });

    ```


    ### 全局未处理拒绝处理


    对于 Node.js 应用程序或在浏览器中，你可以设置全局处理程序来处理未处理的 promise 拒绝：


    在 Node.js 中：


    ```

    process.on(''unhandledRejection'', (reason, promise) => {console.error(''未处理的拒绝，promise:'',
    promise, ''原因:'', reason);


      // 应用程序特定的日志记录、抛出错误或其他逻辑 });

    ```


    在浏览器中：


    ```

    window.addEventListener(''unhandledrejection'', event  => {console.error(''未处理的拒绝（promise:'',
    event.promise, ''原因:'', event.reason, ''）'');


    });

    ```


    这些全局处理程序充当安全网，捕获任何未在本地处理的拒绝。


    ## 使用 DevTools 调试 Promise


    调试异步代码可能具有挑战性，但现代浏览器 DevTools 提供了强大的功能来简化此任务。让我们以 Chrome DevTools 为例，探讨一些有效调试
    promise 的技术。


    ### 使用异步堆栈跟踪


    现代 DevTools 会自动捕获异步堆栈跟踪，让你能够看到导致代码中特定点的完整异步调用链。


    1. 打开 Chrome DevTools（F12 或 Mac 上的 Cmd+Option+I）。

    2. 转到 Sources 面板。

    3. 在与 promise 相关的代码中设置断点。

    4. 当断点被触发时，你会看到 Call Stack 面板。展开它以查看异步堆栈跟踪。


