    ### Implementing the Retry Mechanism


    Now, let''s create our app.js file and implement the retry mechanism:


    const  fetchDataButton  =  document.getElementById(''fetchData''); const  resultDiv  =  document.getElementById(''result'');
    // Simulated API call with a 50% chance of failure async  function  simulateAPICall()
    {


        const  randomDelay  =  Math.floor(Math.random() *  1000) +  500; // Random
    delay between 500ms and 1500ms     await  new  Promise(resolve  =>  setTimeout(resolve,
    randomDelay));


        if (Math.random() <  0.5) {


            throw  new  Error(''API call failed'');


        }


        return { message:  ''API call succeeded'', timestamp:  new  Date().toISOString()
    };


    } async  function  fetchWithRetry(retries  =  3, delay  =  1000) {


        try {const  result  =  await  simulateAPICall();


            return  result;


        } catch (error) {


            if (retries  >  0) {


                console.log(`Retrying... (${retries} attempts left)`);


                await  new  Promise(resolve  =>  setTimeout(resolve, delay));


                return  fetchWithRetry(retries  -  1, delay  *  2);


            } else {throw  error;


            }


        }


    } async  function  handleFetchData() {


        resultDiv.textContent  =  ''Fetching data...'';


        try {const  result  =  await  fetchWithRetry();


            resultDiv.textContent  =  `Success: ${result.message} (Timestamp: ${result.timestamp})`;


        } catch (error) {


            resultDiv.textContent  =  `Error: ${error.message}`;


        }


    } fetchDataButton.addEventListener(''click'', handleFetchData);


    In this implementation, we''ve created a retry mechanism that attempts to fetch
    data multiple times in case of failure. Here''s a breakdown of the key components:


    1.  simulateAPICall: This function simulates an API call with a random delay and
    a 50% chance of failure. In a real-world scenario, this would be replaced with
    an actual API call.


    2.  fetchWithRetry: This is the core of our retry mechanism. It takes two parameters:


    *   retries: The number of retry attempts (default is 3)


    *   delay: The initial delay between retries in milliseconds (default is 1000ms)


    The function attempts to call simulateAPICall. If it succeeds, it returns the
    result. If it fails and there are retries left, it waits for the specified delay
    and then recursively calls itself with one less retry and double the delay (implementing
    an exponential backoff strategy).


    3.  handleFetchData: This function is called when the "Fetch Data" button is clicked.
    It calls fetchWithRetry and updates the UI with the result or error message.


    The exponential backoff strategy (doubling the delay with each retry) is a common
    approach in retry mechanisms. It helps to avoid overwhelming the server with immediate
    retry attempts and gives it more time to recover between attempts.


    ### Testing the Retry Mechanism


    When you open the HTML file in a browser, you''ll see a "Fetch Data" button. Clicking
    this button will trigger the simulated API call with the retry mechanism. You
    can observe the behavior in the browser console:


    *   If the initial call succeeds, you''ll see the success message immediately.


    *   If the initial call fails, you''ll see retry messages in the console, with
    the number of attempts left.


    *   If all retries fail, you''ll see an error message.


    This project demonstrates how to implement a robust retry mechanism for handling
    unreliable API calls or network conditions. It showcases the use of async/await
    for managing asynchronous operations, error handling, and implementing more complex
    logic around API requests.


