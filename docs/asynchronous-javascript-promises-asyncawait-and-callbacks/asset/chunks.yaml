    # Chapter 5: Async/Await


    # ​❧​


    ## Introduction to async and await


    Asynchronous programming has become an essential part of modern JavaScript development,
    allowing developers to write non-blocking code that can handle time-consuming
    operations without freezing the entire application. While Promises provided a
    significant improvement over callback-based asynchronous programming, the introduction
    of async and await keywords in ECMAScript 2017 (ES8) revolutionized the way we
    write asynchronous code in JavaScript.


    The async and await keywords provide a more intuitive and readable way to work
    with Promises, making asynchronous code look and behave more like synchronous
    code. This syntactic sugar built on top of Promises allows developers to write
    asynchronous code that is easier to understand, maintain, and debug.


    Let''s start by understanding the basic syntax and usage of async and await:


    async  function  fetchData() {


      const  response  =  await  fetch(''https://api.example.com/data'');


      const  data  =  await  response.json();


      return  data;


    }


    In this example, we define an async function called fetchData. The async keyword
    before the function declaration indicates that this function will always return
    a Promise, even if we don''t explicitly return one. Inside the function, we use
    the await keyword to pause the execution of the function until the Promise returned
    by fetch is resolved. Once resolved, the response is stored in the response variable,
    and we can proceed to the next line.


    The await keyword can only be used inside an async function. It allows you to
    write asynchronous code that looks synchronous, making it easier to reason about
    and understand the flow of your program.


    Here''s how you would typically use an async function:


    async  function  main() {


      try {const  data  =  await  fetchData();


        console.log(data);


      } catch (error) {


        console.error(''An error occurred:'', error);


      }


    } main();


    In this example, we define another async function called main. Inside this function,
    we await the result of fetchData(). The await keyword ensures that the execution
    of main is paused until fetchData completes and returns the data. If an error
    occurs during the execution of fetchData, it will be caught by the catch block.


    One of the key benefits of using async/await is that it allows you to handle errors
    using traditional try/catch blocks, which we''ll explore in more detail later
    in this chapter.


    It''s important to note that while async/await makes asynchronous code look synchronous,
    it doesn''t actually make the code run synchronously. The asynchronous operations
    still run in the background, allowing other code to execute while waiting for
    the asynchronous operations to complete.


    ## Refactoring Promises to Async/Await


    Now that we have a basic understanding of async/await, let''s look at how we can
    refactor Promise-based code to use this new syntax. This refactoring often results
    in code that is more readable and easier to reason about.


    Consider the following Promise-based code:


    function  fetchUserData(userId) {


