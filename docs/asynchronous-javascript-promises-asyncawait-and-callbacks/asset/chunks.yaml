    ## Handling Multiple Promises with Promise.all and Promise.race


    In the world of asynchronous JavaScript, developers often find themselves dealing
    with multiple promises simultaneously. Whether you''re fetching data from various
    APIs, processing multiple files, or coordinating complex asynchronous operations,
    the ability to manage multiple promises efficiently is crucial. This is where
    Promise.all and Promise.race come into play, offering powerful tools to handle
    collections of promises with ease and elegance.


    ### Promise.all: The Collective Resolver


    Imagine you''re building a dashboard that needs to display information from three
    different data sources. Each data fetch is an asynchronous operation, represented
    by a promise. You want to update the dashboard only when all the data is available.
    This is a perfect scenario for Promise.all.


    Promise.all takes an iterable (usually an array) of promises and returns a new
    promise. This new promise resolves when all of the input promises have resolved,
    or rejects if any of the input promises reject. Let''s look at a practical example:


    const  fetchUserData  = () =>  new  Promise(resolve  =>  setTimeout(() =>  resolve({
    name:  ''John Doe'', age:  30 }), 1000)); const  fetchUserPosts  = () =>  new  Promise(resolve  =>  setTimeout(()
    =>  resolve([''Post 1'', ''Post 2'', ''Post 3'']), 1500)); const  fetchUserFriends  =
    () =>  new  Promise(resolve  =>  setTimeout(() =>  resolve([''Alice'', ''Bob'',
    ''Charlie'']), 2000)); Promise.all([fetchUserData(), fetchUserPosts(), fetchUserFriends()])


      .then(([userData, userPosts, userFriends]) => {console.log(''User Data:'', userData);


        console.log(''User Posts:'', userPosts);


        console.log(''User Friends:'', userFriends);


        // Update dashboard with all the data   })


      .catch(error  =>  console.error(''An error occurred:'', error));


    In this example, we have three functions that return promises, simulating API
    calls with different response times. Promise.all waits for all these promises
    to resolve before executing the then block. The resolved values are passed as
    an array, which we destructure for easy access.


    The power of Promise.all lies in its ability to handle multiple asynchronous operations
    concurrently, potentially saving significant time compared to sequential execution.
    However, it''s important to note that if any promise in the array rejects, the
    entire Promise.all rejects immediately with that error, short-circuiting the process.


    ### Promise.race: The Swift Competitor


    While Promise.all waits for all promises to settle, there are scenarios where
    you might want to proceed as soon as any promise resolves (or rejects). This is
    where Promise.race shines. As its name suggests, Promise.race initiates a race
    between promises, settling as soon as one promise settles (either resolves or
    rejects).'
