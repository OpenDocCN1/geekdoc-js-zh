    ### Exercise 4: Implementing a Timeout Mechanism


    Problem: Create a function that wraps an asynchronous operation and adds a timeout
    mechanism. If the operation doesn''t complete within the specified time, it should
    reject with a timeout error.


    Promise Solution:


    ```

    function  withTimeout(asyncOperation, timeoutMs) {


      return  new  Promise((resolve, reject) => {const  timeoutId  =  setTimeout(()
    => {reject(new  Error(''Operation timed out''));


        }, timeoutMs);


        asyncOperation()


          .then(result  => {clearTimeout(timeoutId);


            resolve(result);


          })


          .catch(error  => {clearTimeout(timeoutId);


            reject(error);


          });


      });


    } // Usage function  slowOperation() {


