  trans: "\n\n总之，异步代码中的有效错误处理对于构建健壮且可靠的 JavaScript 应用程序至关重要。通过遵循 Promise 和 Async/Await\
    \ 的最佳实践、实现优雅降级和回退策略，并利用强大的调试技术，你可以创建能够优雅处理意外情况、即使在错误或网络故障面前也能提供流畅用户体验的应用程序。请记住，错误处理是一个持续的过程，根据实际使用情况和反馈不断改进你的方法，将使应用程序更具弹性和用户友好性。\n\
    \n# 第 8 章：调试异步 JavaScript\n\n# ​❧​\n\n调试异步 JavaScript 可能是一项具有挑战性的任务，即使对于经验丰富的开发者也是如此。非线性的执行流程以及潜在的竞态条件，使得追踪问题并理解事件顺序变得困难。在本章中，我们将探讨有效调试异步\
    \ JavaScript 代码的各种技术和工具，重点介绍如何使用断点、检查调用栈以及利用浏览器开发者工具。我们还将讨论常见错误及其避免方法，确保你能够从容应对最复杂的异步调试场景。\n\
    \n## 在异步代码中使用断点和调用栈\n\n断点是开发者调试工具中最强大的工具之一。它们允许你在特定点暂停代码执行，从而有机会检查变量、计算表达式并逐行执行代码。在处理异步\
    \ JavaScript 时，断点变得更加关键，因为它们帮助你理解非线性代码中的执行流程。\n\n### 在异步代码中设置断点\n\n为了有效调试异步代码，了解在哪里以及如何设置断点非常重要。以下是一些关键策略：\n\
    \n1.  `Promise` 断点：在 `Promise` 执行器、`.then()` 回调和 `.catch()` 处理程序中设置断点。这允许你在 Promise\
    \ 链的关键点暂停执行。\n\n```\nconst fetchData = () => {\n  return new Promise((resolve,\
    \ reject) => {\n    // 在此处设置断点以检查 Promise 的创建\n    setTimeout(() => {\n      resolve('数据获取成功');\n\
    \    }, 1000);\n  });\n};\n\nfetchData()\n  .then(data => {\n    // 在此处设置断点以检查解析后的值\n\
    \    console.log(data);\n  })\n  .catch(error => {\n    // 在此处设置断点以检查任何错误\n  \
    \  console.error(error);\n  });\n```\n\n2.  Async/Await 断点：在异步函数内部放置断点，特别是在 await\
    \ 表达式之前和之后。这有助于你跟踪控制权让出和恢复时的执行流程。\n\n```\nasync function processData() {\n  try\
    \ {\n    // 在此处设置断点以检查 await 之前的状态\n    const result = await fetchData();\n  \
    \  // 在此处设置断点以检查 await 之后的状态\n    console.log(result);\n  } catch (error) {\n\
    \    // 在此处设置断点以捕获任何错误\n    console.error(error);\n  }\n}\n```\n\n3.  事件循环断点：在浏览器开发者工具中，你可以针对事件循环中的特定事件设置断点，例如\
    \ `setTimeout`、`setInterval` 和 `XHR` 请求。这对于调试与时间相关的问题特别有用。\n\n4.  条件断点：使用条件断点仅在满足特定条件时暂停执行。这在调试复杂异步流程中的特定场景时很有帮助。\n\
    \n```\n// 在开发者工具中，在此行设置条件断点\n// 条件为：data.status === 'error'\nprocessApiResponse(data);\n\
    ```\n\n### 在异步代码中导航调用栈\n\n调用栈是理解代码执行上下文的关键工具。然而，在处理异步 JavaScript 时，调用栈可能难以解释。以下是如何在调试异步代码时有效使用调用栈：\n\
    \n1.  理解异步调用栈：现代浏览器的开发者工具在调用栈视图中提供了“异步”选项。启用此选项可以看到完整的异步调用栈，包括异步操作的起源。\n\n2. \
    \ 追踪 Promise 链：当在 Promise 链中的断点处暂停时，调用栈会显示当前函数及其调用者。利用这一点可以回溯 Promise 链，理解你是如何到达当前点的。\n\
    \n3.  Async/Await 调用栈：在调试 async/await 代码时，调用栈会显示异步函数及其调用者。这使得理解以更同步风格编写的异步代码的执行流程变得更加容易。\n\
    \n4.  事件循环和微任务队列：请记住，调用栈只显示当前的执行上下文。异步操作可能会被排队到微任务队列或事件循环中，在它们被执行之前不会出现在调用栈中。\n\
    \n以下是一个调试异步函数时调用栈可能呈现的示例：\n\n```\nasync function fetchUserData(userId) {\n  const\
    \ response = await fetch(`/api/users/${userId}`);\n  const userData = await response.json();\n\
    \  return userData;\n}\n\nasync function displayUserProfile(userId) {\n  try {\n\
    \    const userData = await fetchUserData(userId);\n    updateUI(userData);\n\
    \  } catch (error) {\n    showError(error);\n  }\n}\n\ndisplayUserProfile(123);\n\
    ```\n\n如果你在 `fetchUserData` 函数内部设置了一个断点，调用栈可能看起来像这样：\n\n```\nfetchUserData\nasync\
    \ function (anonymous)\ndisplayUserProfile\nasync function (anonymous)\n(anonymous)\
    \ // 对 displayUserProfile 的初始调用\n```\n\n这个调用栈显示了异步函数调用的完整链条，帮助你理解你是如何到达代码中当前点的。\n\
    \n## 在开发者工具中检查 Promise 和异步函数\n\n现代浏览器开发者工具提供了强大的功能来检查和调试 Promise 及异步函数。让我们探讨其中一些工具和技术：\n\
    \n### Promise 检查\n\n1.  `Promise` 状态：在控制台和源代码面板中，你可以检查 `Promise` 对象以查看其当前状态（待定、已完成或已拒绝）以及其解析或拒绝的值。\n\
    \n2.  异步调用栈：在调用栈视图中启用“异步”选项，可以看到完整的异步调用栈，包括 `Promise` 创建和解析的起源。\n\n3.  `Promise`\
    \ 链可视化：某些开发者工具（如 Chrome）在源代码面板中提供了 `Promise` 链的可视化表示，使理解复杂的异步流程更加容易。\n\n### 异步函数调试\n\
    \n1.  跳过异步操作：使用调试器中的“单步跳过”按钮来跳过 await 表达式，从而可以像调试同步函数一样调试异步函数。\n\n2.  异步断点：在 await\
    \ 表达式之前和之后设置断点，以检查异步流程中关键点的应用程序状态。\n\n3.  异步控制台：使用带有 await 的 `console.log()` 语句直接在控制台中记录异步值：\n\
    \n```\nasync function fetchData() {\n  const response = await fetch('/api/data');\n\
    \  console.log(await response.json());\n}\n```\n\n### 使用网络面板进行 API 调试\n\n当处理涉及\
    \ API 调用的异步代码时，开发者工具中的网络面板成为宝贵的资源：\n\n1.  请求检查：检查每个 API 请求的详细信息，包括标头、负载和计时信息。\n\
    \n2.  响应分析：检查响应数据、状态码和标头，以确保你的 API 按预期运行。\n\n3.  节流：使用网络节流来模拟较慢的连接，并测试你的异步代码在不同网络条件下的行为。\n\
    \n4.  重放 XHR：使用“重放 XHR”功能重新运行特定的 API 请求，而无需重新加载整个页面，这对于调试特定的 API 相关问题非常有用。\n\n\
    以下是一个如何结合使用网络面板和断点来调试 API 调用的示例：\n\n"
