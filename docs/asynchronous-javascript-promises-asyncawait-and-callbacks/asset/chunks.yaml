    In this project, we''ll create a simple movie database app that demonstrates both
    sequential and parallel data fetching. We''ll use the TMDB (The Movie Database)
    API to fetch movie data and display it on our page.


    ### Setting Up the Project


    First, let''s create our HTML structure:


    <!DOCTYPE html>


    <html  lang="en">


    <head>


        <meta  charset="UTF-8">


        <meta  name="viewport"  content="width=device-width, initial-scale=1.0">


        <title>Movie Database App</title>


        <link  rel="stylesheet"  href="styles.css">


    </head>


    <body>


        <div  class="container">


            <h1>Movie Database App</h1>


            <button  id="fetchSequential">Fetch Sequentially</button>


            <button  id="fetchParallel">Fetch in Parallel</button>


            <div  id="movieList"></div>


        </div>


        <script  src="app.js"></script>


    </body>


    </html>


    Now, let''s add some CSS to style our app:


    body {font-family: Arial, sans-serif;


        line-height: 1.6;


        margin: 0;


        padding: 20px;


        background-color: #f4f4f4;


    } .container {max-width: 800px;


        margin: auto;


        padding: 20px;


        background-color: white;


