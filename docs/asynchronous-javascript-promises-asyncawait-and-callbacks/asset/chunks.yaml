    {


        console.log(page);


      }


    })();

    ```


    This approach provides a clean and readable way to work with multiple asynchronous
    operations, especially when dealing with sequences of data.


    ### AbortController and AbortSignal


    The `AbortController` and `AbortSignal` APIs provide a standardized way to abort
    asynchronous operations. While already implemented in modern browsers, their usage
    is becoming more widespread and integrated into various APIs.


