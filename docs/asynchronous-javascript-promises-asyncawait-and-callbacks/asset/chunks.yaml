    ### Async Iterators and Generators


    Async iterators and generators provide a way to work with asynchronous data streams
    in a more intuitive manner. They allow you to use `for-await-of` loops to iterate
    over asynchronous data sources.


    Here''s an example of an async generator:


    ```

    async  function*  fetchPages(urls) {


