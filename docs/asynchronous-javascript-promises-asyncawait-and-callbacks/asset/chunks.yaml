    \ {\n    promise,\n    cancel: () => controller.abort()\n  };\n}\n// Usage\nconst\
    \ { promise, cancel } = cancellableApiCall('https://api.example.com/data');\n\
    // To cancel the operation\ncancel();\n```\n\n### Scenario 5: Debouncing an Asynchronous\
    \ Function\n\n**Problem:** You need to debounce an asynchronous function to limit\
