  \  const userPostsPromise = fetch(`https://api.example.com/users/${userId}/posts`)\n\
  \    .then(response => response.json());\n  return Promise.all([userDataPromise,\
  \ userPostsPromise])\n    .then(([userData, userPosts]) => {\n      return {\n \
  \       user: userData,\n        posts: userPosts\n      };\n    });\n}\n// 使用示例\n\
  fetchUserDataAndPosts(123)\n  .then(result => console.log(result))\n  .catch(error\
  \ => console.error('Error fetching data:', error));\n```\n\n**Async/Await 解决方案：**\n\
  \n```\nasync function fetchUserDataAndPosts(userId) {\n  try {\n    const [userData,\
  \ userPosts] = await Promise.all([\n      fetch(`https://api.example.com/users/${userId}`).then(response\
  \ => response.json()),\n      fetch(`https://api.example.com/users/${userId}/posts`).then(response\
  \ => response.json())\n    ]);\n    return {\n      user: userData,\n      posts:\
  \ userPosts\n    };\n  } catch (error) {\n    throw new Error('Error fetching data:\
  \ ' + error.message);\n  }\n}\n// 使用示例\nasync function fetchAndLogUserData() {\n\
  \  try {\n    const result = await fetchUserDataAndPosts(123);\n    console.log(result);\n\
  \  } catch (error) {\n    console.error(error);\n  }\n}\nfetchAndLogUserData();\n\
  ```\n\n### 练习 3：带错误处理的顺序 API 调用\n\n**问题：** 创建一个函数，进行三次顺序 API 调用，每次调用依赖于前一次的结果。为每一步实现适当的错误处理。\n\
  \n**Promise 解决方案：**\n\n```\nfunction sequentialApiCalls(initialId) {\n  return fetch(`https://api.example.com/step1/${initialId}`)\n\
  \    .then(response => {\n      if (!response.ok) throw new Error('Error in step\
  \ 1');\n      return response.json();\n    })\n    .then(data1 => {\n      return\
  \ fetch(`https://api.example.com/step2/${data1.nextId}`)\n        .then(response\
  \ => {\n          if (!response.ok) throw new Error('Error in step 2');\n      \
  \    return response.json();\n        });\n    })\n    .then(data2 => {\n      return\
  \ fetch(`https://api.example.com/step3/${data2.finalId}`)\n        .then(response\
  \ => {\n          if (!response.ok) throw new Error('Error in step 3');\n      \
  \    return response.json();\n        });\n    })\n    .then(finalData => {\n  \
  \    console.log('Final result:', finalData);\n      return finalData;\n    })\n\
  \    .catch(error => {\n      console.error('Error in sequential calls:', error.message);\n\
  \      throw error;\n    });\n}\n```\n\n\n\n\n\n```\n} // 用法 sequentialApiCalls(1)\n\
  \n  .then(result  =>  console.log('成功:', result))\n\n  .catch(error  =>  console.error('失败:',\
  \ error));\n\nAsync/Await 解决方案：\n\nasync  function  sequentialApiCalls(initialId)\
  \ {\n\n  try {const  response1  =  await  fetch(`https://api.example.com/step1/${initialId}`);\n\
  \n    if (!response1.ok) throw  new  Error('步骤 1 出错');\n\n    const  data1  =  await\
  \  response1.json();\n\n    const  response2  =  await  fetch(`https://api.example.com/step2/${data1.nextId}`);\n\
  \n    if (!response2.ok) throw  new  Error('步骤 2 出错');\n\n    const  data2  =  await\
  \  response2.json();\n\n    const  response3  =  await  fetch(`https://api.example.com/step3/${data2.finalId}`);\n\
  \n    if (!response3.ok) throw  new  Error('步骤 3 出错');\n\n    const  finalData \
  \ =  await  response3.json();\n\n    console.log('最终结果:', finalData);\n\n    return\
  \  finalData;\n\n  } catch (error) {\n\n    console.error('顺序调用出错:', error.message);\n\
  \n    throw  error;\n\n  }\n\n} // 用法 async  function  runSequentialCalls() {\n\n\
    try {const  result  =  await  sequentialApiCalls(1);\n\n    console.log('成功:',\
  \ result);\n\n  } catch (error) {\n\n    console.error('失败:', error);\n\n  }\n\n\
  } runSequentialCalls();\n```\n### 练习 4：实现超时机制\n\n问题：创建一个函数，包装一个异步操作并添加超时机制。如果操作在指定时间内未完成，则应拒绝并返回超时错误。\n\
  \nPromise 解决方案：\n\n```\nfunction  withTimeout(asyncOperation, timeoutMs) {\n\n  return\
  \  new  Promise((resolve, reject) => {const  timeoutId  =  setTimeout(() => {reject(new\
  \  Error('操作超时'));\n\n    }, timeoutMs);\n\n    asyncOperation()\n\n      .then(result\
  \  => {clearTimeout(timeoutId);\n\n        resolve(result);\n\n      })\n\n      .catch(error\
  \  => {clearTimeout(timeoutId);\n\n        reject(error);\n\n      });\n\n  });\n\
  \n} // 用法 function  slowOperation() {\n\n  return  new  Promise(resolve  =>  setTimeout(()\
  \ =>  resolve('操作完成'), 3000));\n\n} withTimeout(slowOperation, 5000)\n\n  .then(result\
  \  =>  console.log(result))\n\n  .catch(error  =>  console.error(error.message));\
  \ withTimeout(slowOperation, 2000)\n\n  .then(result  =>  console.log(result))\n\
  \n  .catch(error  =>  console.error(error.message));\n```\nAsync/Await 解决方案：\n\n\
  ```\nasync  function  withTimeout(asyncOperation, timeoutMs) {\n\n  const  timeoutPromise\
  \  =  new  Promise((_, reject) => setTimeout(() =>  reject(new  Error('操作超时')),\
  \ timeoutMs)\n\n  );\n\n  try {return  await  Promise.race([asyncOperation(), timeoutPromise]);\n\
  \n  } catch (error) {\n\n    throw  error;\n\n  }\n\n} // 用法 async  function  slowOperation()\
  \ {\n\n  await  new  Promise(resolve  =>  setTimeout(resolve, 3000));\n\n  return\
  \  '操作完成';\n\n} async  function  testTimeout() {\n\n  try {const  result1  =  await\
  \  withTimeout(() =>  slowOperation(), 5000);\n\n    console.log(result1);\n\n    const\
  \  result2  =  await  withTimeout(() =>  slowOperation(), 2000);\n\n    console.log(result2);\n\
  \n  } catch (error) {\n\n    console.error(error.message);\n\n  }\n\n} testTimeout();\n\
  ```\n### 练习 5：实现带指数退避的重试机制\n\n问题：创建一个函数，为不可靠的 API 调用实现带指数退避的重试机制。该函数应在指定次数内重试操作，并在每次尝试之间增加延迟。\n\
  \nPromise 解决方案：\n\n```\nfunction  retryWithBackoff(operation, maxRetries  =  3,\
  \ baseDelay  =  1000) {\n\n  return  new  Promise((resolve, reject) => {let  attempts\
  \  =  0;\n\n    function  attempt() {\n\n      operation()\n\n        .then(resolve)\n\
  \n        .catch(error  => {attempts++;\n\n          if (attempts  >=  maxRetries)\
  \ {\n\n            reject(new  Error(`操作在 ${maxRetries} 次尝试后失败`));\n\n          }\
  \ else {const  delay  =  baseDelay  *  Math.pow(2, attempts  -  1);\n\n            console.log(`第\
  \ ${attempts} 次尝试失败。将在 ${delay}ms 后重试...`);\n\n            setTimeout(attempt, delay);\n\
  \n          }\n\n        });\n\n    }\n\n    attempt();\n\n  });\n\n} // 用法 function\
  \  unreliableApiCall() {\n\n  return  new  Promise((resolve, reject) => {if (Math.random()\
  \ <  0.7) {\n\n      reject(new  Error('API 调用失败'));\n\n    } else {resolve('API\
  \ 调用成功');\n\n    }\n\n  });\n\n} retryWithBackoff(unreliableApiCall, 5, 1000)\n\n\
    .then(result  =>  console.log(result))\n\n  .catch(error  =>  console.error(error.message));\n\
  ```\nAsync/Await 解决方案：\n\n```\nasync  function  retryWithBackoff(operation, maxRetries\
  \  =  3, baseDelay  =  1000) {\n\n  for (let  attempts  =  1; attempts  <=  maxRetries;\
  \ attempts++) {\n\n    try {return  await  operation();\n\n    } catch (error) {\n\
  \n      if (attempts  ===  maxRetries) {\n\n        throw  new  Error(`操作在 ${maxRetries}\
  \ 次尝试后失败`);\n\n      }\n\n      const  delay  =  baseDelay  *  Math.pow(2, attempts\
  \  -  1);\n\n      console.log(`第 ${attempts} 次尝试失败。将在 ${delay}ms 后重试...`);\n\n\
        await  new  Promise(resolve  =>  setTimeout(resolve, delay));\n\n    }\n\n\
    }\n\n} // 用法 async  function  unreliableApiCall() {\n\n  if (Math.random() < \
  \ 0.7) {\n\n    throw  new  Error('API 调用失败');\n\n  }\n\n  return  'API 调用成功';\n\
  \n} async  function  testRetry() {\n\n  try {const  result  =  await  retryWithBackoff(unreliableApiCall,\
  \ 5, 1000);\n\n    console.log(result);\n\n  } catch (error) {\n\n    console.error(error.message);\n\
  \n  }\n\n} testRetry();\n```\n这些练习为在 JavaScript 中应用异步编程概念提供了实际场景。通过解决这些问题并研究解决方案，开发者可以提升处理复杂异步操作、错误管理以及实现超时和重试等常见模式的能力。基于\
  \ Promise 和 Async/Await 解决方案的并排对比也有助于理解每种方法的优势和使用场景。\n\n"
