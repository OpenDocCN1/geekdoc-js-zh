  \n\n\n`weatherInfo.innerHTML` = `\n    <h2>${name}</h2>\n    <p>Temperature: ${main.temp}°C</p>\n\
  \    <p>Feels like: ${main.feels_like}°C</p>\n    <p>Humidity: ${main.humidity}%</p>\n\
  \    <p>Weather: ${weather[0].description}</p>\n`;\n\n`getWeatherButton.addEventListener('click',\
  \ async () => {`\n    `const city = cityInput.value.trim();`\n    `if (!city) {`\n\
  \        `weatherInfo.textContent = 'Please enter a city name';`\n        `return;`\n\
  \    `}`\n    `try {`\n        `weatherInfo.textContent = 'Loading...';`\n     \
  \   `const weatherData = await getWeather(city);`\n        `displayWeather(weatherData);`\n\
  \    `} catch (error) {`\n        `weatherInfo.textContent = \\`Error: ${error.message}\\\
  `;`\n    `}`\n`});`\n\n在这个实现中，我们使用了 `async/await` 来处理异步 API 调用。`getWeather` 函数被标记为\
  \ `async`，允许我们在发起 `fetch` 请求时使用 `await` 关键字。与传统的 Promise 链相比，这使我们的代码更具可读性，也更易于理解。\n\
  \n我们还通过 `try/catch` 块实现了错误处理，既在 `getWeather` 函数中，也在事件监听器中。这确保了我们可以优雅地处理 API 调用或处理响应时可能发生的任何错误。\n\
  \n`displayWeather` 函数接收从 API 返回的数据，并用相关的天气信息更新 DOM。这种关注点分离（获取数据 vs. 显示数据）使我们的代码更加模块化，也更易于维护。\n\
  \n### 测试天气应用\n\n要测试天气应用，你需要从 OpenWeatherMap（https://openweathermap.org/）注册一个免费的\
