  \ 以清晰直观的方式处理异步操作，从而更轻松地使用 API 并根据接收到的数据更新 UI。\n\n## 项目 2：电影数据库应用的顺序与并行数据获取\n\n在这个项目中，我们将创建一个简单的电影数据库应用，演示顺序和并行数据获取。我们将使用\
  \ TMDB（The Movie Database）API 来获取电影数据并显示在页面上。\n\n### 项目设置\n\n首先，创建我们的 HTML 结构：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
  >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n    <title>Movie Database App</title>\n    <link rel=\"stylesheet\" href=\"styles.css\"\
  >\n</head>\n<body>\n    <div class=\"container\">\n        <h1>Movie Database App</h1>\n\
  \        <button id=\"fetchSequential\">Fetch Sequentially</button>\n        <button\
  \ id=\"fetchParallel\">Fetch in Parallel</button>\n        <div id=\"movieList\"\
  ></div>\n    </div>\n    <script src=\"app.js\"></script>\n</body>\n</html>\n```\n\
  \n现在，添加一些 CSS 来美化应用：\n\n```css\nbody {\n    font-family: Arial, sans-serif;\n  \
  \  line-height: 1.6;\n    margin: 0;\n    padding: 20px;\n    background-color:\
  \ #f4f4f4;\n}\n.container {\n    max-width: 800px;\n    margin: auto;\n    padding:\
  \ 20px;\n    background-color: white;\n    border-radius: 5px;\n    box-shadow:\
  \ 0 2px 5px rgba(0, 0, 0, 0.1);\n}\nbutton {\n    padding: 10px 15px;\n    margin:\
  \ 10px 5px;\n    background-color: #007bff;\n    color: white;\n    border: none;\n\
  \    border-radius: 3px;\n    cursor: pointer;\n}\nbutton:hover {\n    background-color:\
  \ #0056b3;\n}\n.movie {\n    background-color: #f9f9f9;\n    border: 1px solid #ddd;\n\
  \    padding: 10px;\n    margin-bottom: 10px;\n    border-radius: 3px;\n}\n.movie\
  \ h2 {\n    margin-top: 0;\n}\n```\n\n### 实现电影数据库应用\n\n现在，创建 `app.js` 文件并实现电影数据库应用：\n\
  \n```javascript\nconst API_KEY = 'your_api_key_here'; // 替换为你的实际 TMDB API 密钥\nconst\
  \ BASE_URL = 'https://api.themoviedb.org/3';\nconst movieIds = [550, 551, 552, 553,\
  \ 554]; // 示例电影 ID\n\nconst fetchSequentialButton = document.getElementById('fetchSequential');\n\
  const fetchParallelButton = document.getElementById('fetchParallel');\nconst movieList\
  \ = document.getElementById('movieList');\n\nasync function fetchMovie(id) {\n \
  \   const response = await fetch(`${BASE_URL}/movie/${id}?api_key=${API_KEY}`);\n\
  \    if (!response.ok) {\n        throw new Error(`HTTP error! status: ${response.status}`);\n\
  \    }\n    return await response.json();\n}\n\nfunction displayMovie(movie) {\n\
  \    const movieElement = document.createElement('div');\n    movieElement.classList.add('movie');\n\
  \    movieElement.innerHTML = `\n        <h2>${movie.title}</h2>\n        <p>Release\
  \ Date: ${movie.release_date}</p>\n        <p>Overview: ${movie.overview}</p>\n\
  \    `;\n    movieList.appendChild(movieElement);\n}\n\nasync function fetchMoviesSequentially()\
  \ {\n    movieList.innerHTML = '<p>Fetching movies sequentially...</p>';\n    console.time('Sequential');\n\
  \    for (const id of movieIds) {\n        try {\n            const movie = await\
  \ fetchMovie(id);\n            displayMovie(movie);\n        } catch (error) {\n\
  \            console.error(`Error fetching movie ${id}:`, error);\n        }\n \
  \   }\n    console.timeEnd('Sequential');\n}\n\nasync function fetchMoviesInParallel()\
  \ {\n    movieList.innerHTML = '<p>Fetching movies in parallel...</p>';\n    console.time('Parallel');\n\
  \    const moviePromises = movieIds.map(id => fetchMovie(id));\n    try {\n    \
  \    const movies = await Promise.all(moviePromises);\n        movies.forEach(displayMovie);\n\
  \    } catch (error) {\n        console.error('Error fetching movies:', error);\n\
  \    }\n    console.timeEnd('Parallel');\n}\n\nfetchSequentialButton.addEventListener('click',\
  \ fetchMoviesSequentially);\nfetchParallelButton.addEventListener('click', fetchMoviesInParallel);\n\
  ```\n\n在这个实现中，我们创建了两个主要函数：`fetchMoviesSequentially` 和 `fetchMoviesInParallel`。这两个函数演示了获取多条数据的两种不同方法：\n\
  \n1. **顺序获取**：在 `fetchMoviesSequentially` 中，我们使用 `for...of` 循环配合 `await` 逐个获取电影。当操作顺序重要，或者需要在继续下一个请求之前处理每个结果时，这种方法很有用。\n\
  \n2. **并行获取**：在 `fetchMoviesInParallel` 中，我们使用 `Promise.all` 同时获取所有电影。当处理独立请求时，这种方法通常更快，因为它允许并发处理。\n\
  \n我们还加入了 `console.time` 和 `console.timeEnd` 调用来测量这两种方法的性能差异。\n\n`fetchMovie` 是一个可复用的\
  \ `async` 函数，用于获取单部电影的数据。我们使用 `try/catch` 块实现了错误处理，以优雅地处理 API 调用过程中可能发生的任何错误。\n\n\
  `displayMovie` 函数接收一个电影对象，并创建一个 DOM 元素来显示其信息。每个成功获取的电影都会调用此函数。\n\n### 测试电影数据库应用\n\
  \n要测试电影数据库应用，你需要从 TMDB（https://www.themoviedb.org/documentation/api）注册一个免费的 API\
  \ 密钥。获得 API 密钥后，将 `app.js` 文件中的 `'your_api_key_here'` 替换为你的实际 API 密钥。\n\n当你在浏览器中打开\
  \ HTML 文件时，应该会看到两个按钮：“Fetch Sequentially”（顺序获取）和“Fetch in Parallel”（并行获取）。点击这些按钮将使用相应的方法获取电影数据，并在页面上显示结果。\n\
  \n这个项目演示了如何使用 `async/await` 和 `Promise.all` 处理多个异步操作，包括顺序和并行方式。它还展示了如何组织代码来处理 API\
  \ 调用、处理结果并相应地更新 UI。\n\n## 项目 3：为失败的 API 请求创建重试机制\n\n\n\n\n\n在这个最终项目中，我们将实现一个用于处理失败\
  \ API 请求的重试机制。这是实际应用中的常见需求，因为网络条件可能不可靠，或者服务可能经历临时中断。\n\n### 项目设置\n\n让我们从 HTML 结构开始：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
  >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n    <title>API Retry Mechanism</title>\n    <link rel=\"stylesheet\" href=\"\
  styles.css\">\n</head>\n<body>\n    <div class=\"container\">\n        <h1>API Retry\
  \ Mechanism</h1>\n        <button id=\"fetchData\">Fetch Data</button>\n       \
  \ <div id=\"result\"></div>\n    </div>\n    <script src=\"app.js\"></script>\n\
  </body>\n</html>\n```\n\n现在，让我们添加一些 CSS 来为应用设置样式：\n\n```css\nbody {\n    font-family:\
  \ Arial, sans-serif;\n    line-height: 1.6;\n    margin: 0;\n    padding: 20px;\n\
  \    background-color: #f4f4f4;\n}\n.container {\n    max-width: 600px;\n    margin:\
  \ auto;\n    padding: 20px;\n    background-color: white;\n    border-radius: 5px;\n\
  \    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);\n}\nbutton {\n    padding: 10px 15px;\n\
  \    margin: 10px 0;\n    background-color: #007bff;\n    color: white;\n    border:\
  \ none;\n    border-radius: 3px;\n    cursor: pointer;\n}\nbutton:hover {\n    background-color:\
  \ #0056b3;\n}\n#result {\n    margin-top: 20px;\n    padding: 10px;\n    background-color:\
  \ #f9f9f9;\n    border: 1px solid #ddd;\n    border-radius: 3px;\n}\n```\n\n###\
  \ 实现重试机制\n\n现在，让我们创建 `app.js` 文件并实现重试机制：\n\n```javascript\nconst fetchDataButton\
  \ = document.getElementById('fetchData');\nconst resultDiv = document.getElementById('result');\n\
  \n// Simulated API call with a 50% chance of failure\nasync function simulateAPICall()\
  \ {\n    const randomDelay = Math.floor(Math.random() * 1000) + 500; // Random delay\
  \ between 500ms and 1500ms\n    await new Promise(resolve => setTimeout(resolve,\
  \ randomDelay));\n    if (Math.random() < 0.5) {\n        throw new Error('API call\
  \ failed');\n    }\n    return { message: 'API call succeeded', timestamp: new Date().toISOString()\
  \ };\n}\n\nasync function fetchWithRetry(retries = 3, delay = 1000) {\n    try {\n\
  \        const result = await simulateAPICall();\n        return result;\n    }\
  \ catch (error) {\n        if (retries > 0) {\n            console.log(`Retrying...\
  \ (${retries} attempts left)`);\n            await new Promise(resolve => setTimeout(resolve,\
  \ delay));\n            return fetchWithRetry(retries - 1, delay * 2);\n       \
  \ } else {\n            throw error;\n        }\n    }\n}\n\nasync function handleFetchData()\
  \ {\n    resultDiv.textContent = 'Fetching data...';\n    try {\n        const result\
  \ = await fetchWithRetry();\n        resultDiv.textContent = `Success: ${result.message}\
  \ (Timestamp: ${result.timestamp})`;\n    } catch (error) {\n        resultDiv.textContent\
  \ = `Error: ${error.message}`;\n    }\n}\n\nfetchDataButton.addEventListener('click',\
  \ handleFetchData);\n```\n\n在这个实现中，我们创建了一个重试机制，在失败时多次尝试获取数据。以下是关键组件的分解：\n\n1. `simulateAPICall`：此函数模拟一个\
  \ API 调用，具有随机延迟和 50% 的失败概率。在实际场景中，这将被替换为实际的 API 调用。\n\n2. `fetchWithRetry`：这是重试机制的核心。它接受两个参数：\n\
  \   - `retries`：重试次数（默认为 3）\n   - `delay`：重试之间的初始延迟（毫秒，默认为 1000ms）\n\n   该函数尝试调用\
  \ `simulateAPICall`。如果成功，则返回结果。如果失败且还有剩余重试次数，则等待指定的延迟，然后递归调用自身，重试次数减一，延迟加倍（实现指数退避策略）。\n\
  \n3. `handleFetchData`：当点击“Fetch Data”按钮时调用此函数。它调用 `fetchWithRetry` 并更新 UI 显示结果或错误消息。\n\
  \n指数退避策略（每次重试延迟加倍）是重试机制中的常见方法。它有助于避免立即重试请求压垮服务器，并给服务器更多时间在尝试之间恢复。\n\n### 测试重试机制\n\
  \n当你在浏览器中打开 HTML 文件时，会看到一个“Fetch Data”按钮。点击此按钮将触发带有重试机制的模拟 API 调用。你可以在浏览器控制台中观察行为：\n\
  \n- 如果初始调用成功，你将立即看到成功消息。\n- 如果初始调用失败，你将在控制台中看到重试消息，并显示剩余尝试次数。\n- 如果所有重试都失败，你将看到错误消息。\n\
  \n该项目演示了如何实现一个健壮的重试机制，以处理不可靠的 API 调用或网络条件。它展示了使用 `async`/`await` 管理异步操作、错误处理以及围绕\
  \ API 请求实现更复杂逻辑的方法。\n\n## 结论\n\n在本章中，我们探索了三个动手项目，展示了异步 JavaScript 概念的实际应用：\n\n1.\
  \ 使用 Async/Await 进行 API 调用的天气应用\n2. 电影数据库应用的顺序和并行数据获取\n3. 为失败的 API 请求创建重试机制\n\n\
  这些项目为你提供了使用 `async`/`await`、处理 API 调用、管理多个异步操作以及实现错误处理和重试逻辑的实践经验。这些都是构建健壮、真实世界应用的关键技能，能够处理异步操作和网络请求的复杂性。\n\
  \n请记住，掌握这些概念的关键在于练习。你可以随意扩展这些项目，添加新功能，或使用你学到的技术创建自己的项目。随着你继续使用异步 JavaScript，你将更加熟悉这些模式，并能够在自己的应用中轻松实现它们。\n\
  \n# 第 11 章：异步 JavaScript 的最佳实践\n\n# ​❧​\n\n随着我们深入异步 JavaScript 的世界，不仅理解 Promise、`async`/`await`\
  \ 和回调的机制变得越来越重要，掌握编写清晰、高效且可维护的异步代码的艺术也至关重要。本章将探讨最佳实践、常见陷阱以及构建、测试和调试异步 JavaScript\
  \ 的基本技巧。\n\n## 为可读性构建异步代码\n\n处理异步代码时最大的挑战之一是保持可读性和可理解性。随着应用复杂性的增长，以清晰直观的方式构建异步代码至关重要。让我们探讨一些实现这一目标的策略。\n\
  \n### 模块化与关注点分离\n\n在处理异步操作时，很容易将多个操作串联到一个代码块中。然而，这种方法会迅速导致所谓的“回调地狱”或“Promise 地狱”——嵌套回调或\
  \ Promise 链的混乱局面，难以阅读和维护。\n\n相反，考虑将异步操作分解为更小、更易于管理的函数。每个函数应理想地处理单一职责。这种方法不仅提高了可读性，还增强了代码的可重用性和可测试性。\n\
  \n让我们看一个例子：\n\n```javascript\n// 不良实践：所有内容都在一个函数中\nasync function fetchUserDataAndPosts(userId)\
  \ {\n  const user = await fetch(`/api/users/${userId}`).then(res => res.json());\n\
  \  const posts = await fetch(`/api/posts?userId=${userId}`).then(res => res.json());\n\
  \  const comments = await Promise.all(posts.map(post =>\n    fetch(`/api/comments?postId=${post.id}`).then(res\
  \ => res.json())\n  ));\n}\n```\n\n\n\n\n\n`return { user, posts, comments };`\n\
  \n```javascript\n} // 良好实践：模块化函数\nasync function fetchUser(userId) {\n  const response\
  \ = await fetch(`/api/users/${userId}`);\n  return response.json();\n}\nasync function\
  \ fetchPosts(userId) {\n  const response = await fetch(`/api/posts?userId=${userId}`);\n\
  \  return response.json();\n}\nasync function fetchComments(postId) {\n  const response\
  \ = await fetch(`/api/comments?postId=${postId}`);\n  return response.json();\n\
  }\nasync function fetchUserDataAndPosts(userId) {\n  const user = await fetchUser(userId);\n\
  \  const posts = await fetchPosts(userId);\n  const comments = await Promise.all(posts.map(post\
  \ => fetchComments(post.id)));\n  return { user, posts, comments };\n}\n```\n\n\
  在改进版本中，每个 API 调用都被封装在自己的函数中。这使得代码更具可读性，并允许在应用程序的其他部分更容易地重用这些函数。\n\n### 一致的错误处理\n\
  \n错误处理是异步编程的关键方面。一致且彻底的错误处理不仅使代码更健壮，还有助于调试和维护。\n\n在使用 Promise 或 `async`/`await`\
  \ 时，使用 `try-catch` 块来处理错误是一种良好实践。对于 Promise，始终在链的末尾添加 `.catch()` 来捕获可能发生的任何错误。\n\
  \n```javascript\nasync function fetchData() {\n  try {\n    const response = await\
  \ fetch('https://api.example.com/data');\n    if (!response.ok) {\n      throw new\
  \ Error(`HTTP error! status: ${response.status}`);\n    }\n    const data = await\
  \ response.json();\n    return data;\n  } catch (error) {\n    console.error('获取数据时出现问题：',\
  \ error);\n    // 可选：重新抛出错误或返回默认值\n    throw error;\n  }\n}\n// 使用该函数\nfetchData()\n\
  \  .then(data => console.log(data))\n  .catch(error => console.error('主流程中的错误：',\
  \ error));\n```\n\n在这个示例中，我们在 `async` 函数内部使用 `try-catch` 块来处理在 fetch 操作或 JSON 解析过程中可能发生的任何错误。我们还检查了响应状态，如果状态不是\
  \ ok，则抛出错误。这提供了一种一致的方式来处理网络错误和 API 错误。\n\n### 命名约定\n\n清晰且一致的命名约定可以显著提高异步代码的可读性。以下是一些指导原则：\n\
  \n1. 对于返回 Promise 或 `async` 的函数，考虑使用 `fetchX`、`getX` 或 `loadX` 等前缀来表示它们是异步操作。\n\n\
  2. 对于保存 Promise 的变量名，可以使用 `Promise` 或 `Async` 等后缀来明确它们不是已解析的值。\n\n3. 使用 `.then()`\
  \ 回调时，为参数命名以清晰表示它们代表什么。\n\n```javascript\n// 良好的命名实践\nasync function fetchUserProfile(userId)\
  \ {\n  const userDataPromise = fetchUserData(userId);\n  const userPostsPromise\
  \ = fetchUserPosts(userId);\n  const [userData, userPosts] = await Promise.all([userDataPromise,\
  \ userPostsPromise]);\n  return { ...userData, posts: userPosts };\n}\nfetchUserProfile(123)\n\
  \  .then(profile => {\n    console.log('用户资料：', profile);\n  })\n  .catch(error\
  \ => {\n    console.error('获取用户资料失败：', error);\n  });\n```\n\n### 使用 async/await\
  \ 提高可读性\n\n虽然 Promise 功能强大，但 `async`/`await` 语法通常能带来更易读的代码，尤其是在处理多个异步操作时。它允许你编写看起来和行为更像同步代码的异步代码。\n\
  \n```javascript\n// 使用 Promise\nfunction fetchUserData(userId) {\n  return fetch(`/api/users/${userId}`)\n\
  \    .then(response => response.json())\n    .then(userData => {\n      return fetch(`/api/posts?userId=${userId}`)\n\
  \        .then(response => response.json())\n        .then(posts => {\n        \
  \  return { ...userData, posts };\n        });\n    });\n}\n// 使用 async/await\n\
  async function fetchUserData(userId) {\n  const userResponse = await fetch(`/api/users/${userId}`);\n\
  \  const userData = await userResponse.json();\n  const postsResponse = await fetch(`/api/posts?userId=${userId}`);\n\
  \  const posts = await postsResponse.json();\n  return { ...userData, posts };\n\
  }\n```\n\n`async`/`await` 版本更加直接且易于阅读，因为它消除了嵌套的 `.then()` 调用。\n\n## 避免异步代码中的常见反模式\n\
  \n与任何编程范式一样，异步 JavaScript 中有一些实践最好避免。让我们探讨一些常见的反模式以及如何纠正它们。\n\n### 厄运金字塔（回调地狱）\n\
  \n这可能是异步 JavaScript 中最臭名昭著的反模式。当你有多个嵌套回调时，会导致代码难以阅读和维护。\n\n```javascript\n// 反模式：回调地狱\n\
  getData(function(a) {\n  getMoreData(a, function(b) {\n    getMoreData(b, function(c)\
  \ {\n      getMoreData(c, function(d) {\n        getMoreData(d, function(e) {\n\
  \          console.log(e);\n        });\n      });\n    });\n  });\n});\n// 更好的方法：使用\
  \ Promise\ngetData()\n  .then(a => getMoreData(a))\n  .then(b => getMoreData(b))\n\
  \  .then(c => getMoreData(c))\n  .then(d => getMoreData(d))\n  .then(e => console.log(e))\n\
  \  .catch(error => console.error(error));\n// 更好的方法：使用 async/await\nasync function\
  \ fetchAllData() {\n  try {\n    const a = await getData();\n    const b = await\
  \ getMoreData(a);\n    const c = await getMoreData(b);\n    const d = await getMoreData(c);\n\
  \    const e = await getMoreData(d);\n    console.log(e);\n  } catch (error) {\n\
  \    console.error(error);\n  }\n}\n```\n\n### 忽略错误\n\n一个常见的错误是忽略异步操作中的潜在错误。始终处理错误，即使只是暂时记录它们。\n\
  \n```javascript\n// 反模式：忽略错误\nfetch('https://api.example.com/data')\n  .then(response\
  \ => response.json())\n  .then(data => console.log(data));\n// 更好的方法：处理错误\nfetch('https://api.example.com/data')\n\
  \  .then(response => {\n    if (!response.ok) {\n      throw new Error(`HTTP error!\
  \ status: ${response.status}`);\n    }\n    return response.json();\n  })\n  .then(data\
  \ => console.log(data))\n  .catch(error => console.error('fetch 操作出现问题：', error));\n\
  ```\n\n### 不必要的 async/await 使用\n\n虽然 `async`/`await` 功能强大，但并非总是必要。不必要地使用它可能导致效率较低的代码。\n\
  \n```javascript\n// 反模式：不必要的 async/await\nconst getData = async () => {\n  return\
  \ \"some data\";\n};\n// 更好的方法：普通函数\nconst getData = () => {\n  return \"some data\"\
  ;\n};\n// 反模式：对非 Promise 使用 await\nconst processData = async (data) => {\n  const\
  \ result = await data.toString(); // 不必要的 await\n  return result;\n};\n// 更好的方法：不要对非\
  \ Promise 使用 await\nconst processData = (data) => {\n  return data.toString();\n\
  };\n```\n\n### 忘记返回 Promise\n\n在使用 Promise 时，务必从函数中返回它们。忘记这样做可能导致意外行为。\n\n```javascript\n\
  // 反模式：未返回 Promise\nfunction fetchData() {\n  fetch('https://api.example.com/data')\n\
  \    .then(response => response.json())\n    .then(data => console.log(data));\n\
  }\n// 更好的方法：返回 Promise\nfunction fetchData() {\n  return fetch('https://api.example.com/data')\n\
  \    .then(response => response.json());\n}\n// 使用\nfetchData().then(data => console.log(data));\n\
  ```\n\n### 顺序执行独立的异步操作\n\n当你有多个独立的异步操作时，顺序执行它们可能会不必要地增加总执行时间。\n\n```javascript\n\
  // 反模式：顺序执行\nasync function fetchAllData() {\n  const users = await fetchUsers();\n\
  \  const posts = await fetchPosts();\n  const comments = await fetchComments();\n\
  ```\n\n\n\n\n\n```\n  return { users, posts, comments };\n\n} // Better approach:\
  \ Parallel execution async  function  fetchAllData() {\n\n  const [users, posts,\
  \ comments] =  await  Promise.all([\n\n    fetchUsers(),\n\n    fetchPosts(),\n\n\
  \    fetchComments()\n\n  ]);\n\n  return { users, posts, comments };\n\n}\n```\n\
  \n通过使用 `Promise.all()`，我们可以并发执行这些独立操作，从而可能节省大量时间。\n\n## 测试与调试异步函数\n\n测试和调试异步代码会带来独特的挑战。让我们探讨一些策略和工具，使这一过程更易于管理。\n\
  \n### 单元测试异步代码\n\n在对异步函数进行单元测试时，确保测试在断言结果之前等待异步操作完成非常重要。大多数现代测试框架都提供了处理异步测试的方法。\n\
  \n以下是一个使用 Jest 的示例：\n\n```\n// Function to test async  function  fetchUser(id) {\n\
  \n  const  response  =  await  fetch(`https://api.example.com/users/${id}`);\n\n\
  \  if (!response.ok) {\n\n    throw  new  Error('Failed to fetch user');\n\n  }\n\
  \n  return  response.json();\n\n} // Test test('fetchUser returns user data', async\
  \ () => {const  userData  = { id:  1, name:  'John Doe' };global.fetch  =  jest.fn(()\
  \ => Promise.resolve({\n\n      ok:  true,\n\n      json: () =>  Promise.resolve(userData),\n\
  \n    })\n\n  );\n\n  const  user  =  await  fetchUser(1);\n\n  expect(user).toEqual(userData);\n\
  \n}); test('fetchUser throws error for failed request', async () => {global.fetch\
  \  =  jest.fn(() => Promise.resolve({\n\n      ok:  false,\n\n    })\n\n  );\n\n\
  \  await  expect(fetchUser(1)).rejects.toThrow('Failed to fetch user');\n\n});\n\
  ```\n\n在这些测试中，我们模拟了全局的 `fetch` 函数以控制其行为。测试函数中的 `async` 关键字以及调用 `fetchUser` 时的 `await`\
  \ 关键字确保了测试会等待异步操作完成。\n\n### 调试异步代码\n\n调试异步代码可能比较棘手，因为执行过程并非线性。以下是一些让调试更轻松的技巧：\n\n\
  1.  策略性地使用 `console.log`：在异步代码的关键位置放置 `console.log` 语句，以跟踪执行流程。\n\n```\nasync  function\
  \  fetchData() {\n\n  console.log('Starting fetchData');\n\n  try {const  response\
  \  =  await  fetch('https://api.example.com/data');\n\n    console.log('Fetch completed',\
  \ response.status);\n\n    const  data  =  await  response.json();\n\n    console.log('Data\
  \ parsed', data);\n\n    return  data;\n\n  } catch (error) {\n\n    console.error('Error\
  \ in fetchData', error);\n\n    throw  error;\n\n  }\n\n}\n```\n\n2.  利用浏览器开发者工具：现代浏览器开发者工具为调试异步代码提供了出色的支持。你可以设置断点、单步执行异步函数，并检查调用栈。\n\
  \n3.  使用异步堆栈跟踪：Node.js 和现代浏览器支持异步堆栈跟踪，这有助于追踪异步代码中错误的来源。\n\n4.  错误处理：如前所述，正确的错误处理对于调试至关重要。始终在异步函数中捕获并记录错误。\n\
  \n5.  使用调试库：像 `debug` 这样的库有助于进行更复杂的调试，尤其是在 Node.js 环境中。\n\n```\nconst  debug  =\
  \  require('debug')('myapp:fetchData'); async  function  fetchData() {\n\n  debug('Starting\
  \ fetchData');\n\n  try {const  response  =  await  fetch('https://api.example.com/data');\n\
  \n    debug('Fetch completed: %O', response);\n\n    const  data  =  await  response.json();\n\
  \n    debug('Data parsed: %O', data);\n\n    return  data;\n\n  } catch (error)\
  \ {\n\n    debug('Error in fetchData: %O', error);\n\n    throw  error;\n\n  }\n\
  \n}\n```\n\n### 性能分析\n\n处理异步代码时，了解操作的性能特征通常很重要。大多数浏览器的开发者工具都包含一个“性能”选项卡，允许你记录和分析\
  \ JavaScript 代码（包括异步操作）的执行情况。\n\n你还可以使用 `performance.now()` 方法来测量特定操作的持续时间：\n\n\
  ```\nasync  function  measureOperation() {\n\n  const  start  =  performance.now();\n\
  \n  await  someAsyncOperation();\n\n  const  end  =  performance.now();\n\n  console.log(`Operation\
  \ took ${end  -  start} milliseconds`);\n\n}\n```\n\n### 处理竞态条件\n\n当异步代码的结果依赖于不可控事件的顺序或时序时，就可能出现竞态条件。它们可能特别难以调试。以下是一个潜在竞态条件的示例：\n\
  \n```\nlet  data; async  function  fetchData() {\n\n  const  response  =  await\
  \  fetch('https://api.example.com/data');\n\n  data  =  await  response.json();\n\
  \n} function  processData() {\n\n  console.log(data); // 如果 fetchData 尚未完成，这里可能是\
  \ undefined } fetchData(); processData();\n```\n\n为了避免此类问题，请确保在使用数据之前数据已经可用。你可以使用\
  \ Promise 或 async 函数来协调操作：\n\n```\nasync  function  fetchAndProcessData() {\n\n\
  \  const  response  =  await  fetch('https://api.example.com/data');\n\n  const\
  \  data  =  await  response.json();\n\n  processData(data);\n\n} function  processData(data)\
  \ {\n\n  console.log(data); // 现在我们可以确定数据已经可用 } fetchAndProcessData();\n```\n\n\
  通过遵循这些最佳实践并注意常见陷阱，你可以编写更健壮、可读性更高且更易于维护的异步 JavaScript 代码。请记住，关键在于保持代码模块化、一致地处理错误、使用合适的调试工具，并始终留意操作的异步特性。通过练习，你会发现处理异步\
  \ JavaScript 变得更加直观，甚至令人愉悦，从而为创建响应迅速且高效的 Web 应用开辟新的可能性。\n\n# 第 12 章：接下来是什么？\n\n\
  # ❧\n\n当我们结束异步 JavaScript 领域的旅程时，必须认识到这仅仅是个开始。异步编程的世界广阔且不断演变，新的技术、库和框架层出不穷。在最后一章中，我们将探讨一些高级主题和未来方向，帮助你继续成长为一名\
  \ JavaScript 开发者。\n\n## 为使用 RxJS 进行高级异步编程做准备\n\n虽然 `Promises` 和 `async/await` 已经彻底改变了\
  \ JavaScript 中的异步编程，但还有更强大的工具可用于处理复杂的异步操作。其中一个工具是 `RxJS`（JavaScript 的响应式扩展），这是一个使用可观察序列来组合异步和基于事件的程序的库。\n\
  \n### 理解 Observable\n\n`RxJS` 的核心是 `Observable` 的概念。`Observable` 是一种强大的抽象，可以表示随时间变化的数据或事件流。与\
  \ `Promises` 不同，`Promises` 解析为单个值，而 `Observables` 可以随时间发出多个值。\n\n让我们看一个简单的例子来说明\
  \ `Observables` 的强大之处：\n\n```\nimport { Observable } from  'rxjs'; const  observable\
  \  =  new  Observable(subscriber  => {subscriber.next(1);\n\n  subscriber.next(2);\n\
  \n  subscriber.next(3);\n\n  setTimeout(() => {subscriber.next(4);\n\n    subscriber.complete();\n\
  \n  }, 1000);\n\n}); console.log('Just before subscribe'); observable.subscribe({\n\
  \n  next(x) { console.log('Got value '  +  x); },\n\n  error(err) { console.error('Something\
  \ wrong occurred: '  +  err); },\n\n  complete() { console.log('Done'); }\n\n});\
  \ console.log('Just after subscribe');\n```\n\n在这个例子中，我们创建了一个 `Observable`，它发出四个值：1、2\
  \ 和 3 立即发出，然后在一秒延迟后发出 4。`subscribe` 方法允许我们定义当新值发出（`next`）、发生错误（`error`）以及 `Observable`\
  \ 完成（`complete`）时发生的情况。\n\n### 操作符：RxJS 的力量\n\n\n\n\nRxJS 最强大的特性之一是其丰富的操作符集。这些操作符允许你以多种方式转换、组合和操作\
  \ Observable。以下是一个使用 `map` 和 `filter` 操作符的示例：\n\n```\nimport { of } from  'rxjs';\
  \ import { map, filter } from  'rxjs/operators'; const  numbers$  =  of(1, 2, 3,\
  \ 4, 5); numbers$.pipe(\n  filter(n  =>  n  %  2  ===  0),\n  map(n  =>  n  *  n)\n\
  ).subscribe(x  =>  console.log(x));\n```\n\n在这个示例中，我们创建了一个数字的 `Observable`，过滤掉奇数，对剩下的偶数进行平方运算，然后输出结果。输出将是\
  \ 4 和 16。\n\n### 处理复杂的异步场景\n\nRxJS 在处理复杂异步场景时真正大放异彩。例如，考虑一个需要发起多个 API 调用并合并其结果的情况：\n\
  \n```\nimport { forkJoin, from } from  'rxjs'; import { mergeMap, map } from  'rxjs/operators';\
  \ function  getUser(id) {\n  return  from(fetch(`https://api.example.com/users/${id}`).then(res\
  \  =>  res.json()));\n} function  getUserPosts(userId) {\n  return  from(fetch(`https://api.example.com/posts?userId=${userId}`).then(res\
  \  =>  res.json()));\n} getUser(1).pipe(\n  mergeMap(user  =>  forkJoin({\n    user:\
  \  of(user),\n    posts:  getUserPosts(user.id)\n  })),\n  map(({ user, posts })\
  \ => ({...user,\n    posts }))\n).subscribe(\n  result  =>  console.log(result),\n\
  \  error  =>  console.error(error)\n);\n```\n\n在这个示例中，我们首先获取一个用户，然后获取其帖子，最后合并结果。RxJS\
  \ 使得组合这些异步操作并优雅地处理错误变得简单。\n\n### 为什么要学习 RxJS？\n\n1.  **强大的抽象**：RxJS 提供了一种统一的方式来处理异步数据，无论是来自用户事件、HTTP\
  \ 请求还是 WebSocket 连接。\n2.  **可组合性**：RxJS 操作符可以链式组合，轻松创建复杂的数据流。\n3.  **错误处理**：RxJS\
  \ 提供了健壮的错误处理机制，使得在复杂异步场景中管理错误更加容易。\n4.  **取消操作**：与 `Promise` 不同，RxJS 的 `Observable`\
  \ 可以轻松取消，这对于防止内存泄漏和不必要的计算至关重要。\n5.  **基于时间的操作**：RxJS 内置了对基于时间操作的支持，非常适合涉及防抖、节流或周期性更新的场景。\n\
  \n随着你在异步 JavaScript 领域的深入探索，学习 RxJS 将为你打开新的可能性，并提供强大的工具来处理最复杂的异步场景。\n\n## 探索框架中的异步模式（例如\
  \ React、Vue）\n\n现代 JavaScript 框架（如 React 和 Vue）有自己处理异步操作的方式，通常建立在本书中探讨的核心概念之上。让我们看看这些框架是如何处理异步编程的。\n\
  \n### React 中的异步模式\n\nReact 作为一个视图库，并没有内置的异步操作解决方案。然而，它提供了与异步 JavaScript 配合良好的钩子和模式。\n\
  \n#### 用于副作用的 `useEffect`\n\n`useEffect` 钩子通常用于处理副作用，包括异步操作：\n\n```\nimport  React,\
  \ { useState, useEffect } from  'react'; function  UserProfile({ userId }) {const\
  \ [user, setUser] =  useState(null);\n  useEffect(() => {async  function  fetchUser()\
  \ {\n      try {const  response  =  await  fetch(`https://api.example.com/users/${userId}`);\n\
  \        const  data  =  await  response.json();\n        setUser(data);\n     \
  \ } catch (error) {\n        console.error('Failed to fetch user:', error);\n  \
  \    }\n    }\n    fetchUser();\n  }, [userId]);\n  if (!user) return <div>Loading...</div>;\n\
  \  return <div>{user.name}</div>;\n}\n```\n\n在这个示例中，我们使用 `useEffect` 钩子在组件挂载或 `userId`\
  \ 变化时获取用户数据。异步函数 `fetchUser` 定义在 effect 内部，以避免使 effect 本身成为异步（这是不允许的）。\n\n#### 用于可复用异步逻辑的自定义钩子\n\
  \nReact 鼓励创建自定义钩子来封装可复用的逻辑，包括异步操作：\n\n```\nimport { useState, useEffect } from \
  \ 'react'; function  useFetch(url) {\n  const [data, setData] =  useState(null);\n\
  \  const [loading, setLoading] =  useState(true);\n  const [error, setError] = \
  \ useState(null);\n  useEffect(() => {async  function  fetchData() {\n      try\
  \ {const  response  =  await  fetch(url);\n        const  json  =  await  response.json();\n\
  \        setData(json);\n        setLoading(false);\n      } catch (error) {\n \
  \       setError(error);\n        setLoading(false);\n      }\n    }\n    fetchData();\n\
  \  }, [url]);\n  return { data, loading, error };\n} // 使用 function  UserList()\
  \ {\n  const { data:  users, loading, error } =  useFetch('https://api.example.com/users');\n\
  \  if (loading) return <div>Loading...</div>;\n  if (error) return <div>Error: {error.message}</div>;\n\
  \  return (\n    <ul>\n      {users.map(user  => (\n        <li  key={user.id}>{user.name}</li>\n\
  \      ))}\n    </ul>\n  );\n}\n```\n\n这个自定义的 `useFetch` 钩子封装了发起异步请求并管理其状态的逻辑。它可以在不同组件中复用，促进了代码复用和关注点分离。\n\
  \n### Vue 中的异步模式\n\nVue 与 React 类似，在其基于组件的架构中提供了处理异步操作的模式和工具。\n\n#### 用于异步操作的侦听器\n\
  \nVue 的侦听器非常适合在数据变化时触发异步操作：\n\n```\nexport  default {data() {\n    return {userId:\
  \  1,\n      user:  null }\n  },watch: {userId: {handler: async  function(newId)\
  \ {\n        try {const  response  =  await  fetch(`https://api.example.com/users/${newId}`);\n\
  \          this.user  =  await  response.json();\n        } catch (error) {\n  \
  \        console.error('Failed to fetch user:', error);\n        }\n      },\n \
  \     immediate:  true }\n  }\n}\n```\n\n在这个示例中，侦听器会在 `userId` 变化时获取用户数据，并且在组件创建时立即执行（由于\
  \ `immediate: true`）。\n\n#### 异步组件\n\nVue 支持异步组件，这对于代码分割和懒加载特别有用：\n\n```\nconst\
  \  AsyncComponent  = () => ({component:  import('./AsyncComponent.vue'),\n  loading:\
  \  LoadingComponent,\n  error:  ErrorComponent,\n  delay:  200,\n  timeout:  3000\
  \ })\n```\n\n这会创建一个异步加载的组件。Vue 会在加载过程中显示一个加载组件，如果加载失败或超时则显示错误组件。\n\n#### 组合式 API\
  \ 与异步逻辑\n\nVue 3 的组合式 API 提供了一种灵活的方式来组织和复用异步逻辑：\n\n```\nimport { ref, onMounted\
  \ } from  'vue'  export  function  useFetch(url) {\n  const  data  =  ref(null)\n\
  \  const  error  =  ref(null)\n  async  function  fetchData() {\n    try {const\
  \  response  =  await  fetch(url)\n      data.value  =  await  response.json()\n\
  \    } catch (err) {\n      error.value  =  err }\n  }onMounted(fetchData)\n  return\
  \ { data, error, refresh:  fetchData }\n} // 在组件中使用 export  default {setup() {\n\
  \    const { data, error, refresh } =  useFetch('https://api.example.com/users')\n\
  \    return { data, error, refresh }\n  }\n}\n```\n\n这个 `useFetch` 组合式函数封装了发起异步请求的逻辑，并且可以轻松地在不同组件中复用。\n\
  \n## 深化 JavaScript 性能优化知识\n\n随着你在 JavaScript 领域的进阶，不仅要编写功能性的异步代码，还要对其进行性能优化，这一点至关重要。以下是一些需要关注的领域：\n\
  \n### 微任务与宏任务\n\n理解微任务（如 `Promise` 回调）和宏任务（如 `setTimeout` 回调）之间的区别，对于预测和优化异步代码的执行顺序至关重要。\n\
  \n\n\n\n`console.log('Script start'); setTimeout(() => console.log('setTimeout'),\
  \ 0); Promise.resolve().then(() => console.log('Promise')); console.log('Script\
  \ end'); // 输出:`\n\n```\n// Script start\n// Script end\n// Promise\n// setTimeout\n\
  ```\n\n在这个例子中，尽管 `setTimeout` 在 `Promise` 之前被调用，但 `Promise` 的回调会先执行，因为它是一个微任务。\n\
  \n## 避免内存泄漏\n\n在处理异步代码时，尤其是在长时间运行的应用程序中，注意潜在的内存泄漏非常重要。常见的泄漏来源包括：\n\n1. 被遗忘的定时器和间隔：当不再需要定时器和间隔时，务必清除它们。\n\
  2. 未解决的 Promise：一个从未完成（解决或拒绝）的 `Promise` 可能会阻止其关联资源的垃圾回收。\n3. 持有引用的闭包：注意异步函数中的闭包，它们可能不必要地长时间持有大对象。\n\
  \n## 优化网络请求\n\n在处理 API 调用时，可以考虑以下技术：\n\n1. 防抖和节流：使用这些技术来限制 API 调用等昂贵操作的频率。\n\n```\n\
  function debounce(func, delay) {\n  let timeoutId;\n  return function (...args)\
  \ {\n    clearTimeout(timeoutId);\n    timeoutId = setTimeout(() => func.apply(this,\
  \ args), delay);\n  };\n}\nconst debouncedSearch = debounce(searchAPI, 300);\n```\n\
  \n2. 缓存：实现缓存策略以避免不必要的网络请求。\n3. 请求批处理：将多个请求分组以减少网络开销。\n\n## 用于 CPU 密集型任务的 Web Workers\n\
  \n对于可能阻塞主线程的计算密集型任务，可以考虑使用 Web Workers：\n\n```\n// main.js\nconst worker = new Worker('worker.js');\n\
  worker.postMessage({ data: complexData });\nworker.onmessage = function(event) {\n\
  \  console.log('Received result:', event.data);\n};\n\n// worker.js\nself.onmessage\
  \ = function(event) {\n  const result = performComplexCalculation(event.data);\n\
  \  self.postMessage(result);\n};\n```\n\nWeb Workers 允许你在后台线程中运行脚本，即使在密集计算期间也能保持主线程的响应性。\n\
  \n## 性能分析与监控\n\n学习使用浏览器开发者工具来分析 JavaScript 性能。例如，Chrome 的 Performance 和 Memory 标签可以提供关于代码运行时行为和内存使用情况的宝贵见解。\n\
