  ### 关键点\n以下是一些实用的方法选择，允许你从日期对象中检索一些有用信息：\n\n| 方法 | 返回 |\n| :--- | :--- |\n| `getDate()`\
  \ | 月份中的日期 (1-31) |\n| `getDay()` | 星期几 (0 = 星期日，6 = 星期六) |\n| `getFullYear()` |\
  \ 四位年份 |\n| `getHours()` | 小时 (0-23) |\n| `getMilliseconds()` | 毫秒 (0-999) |\n|\
  \ `getMinutes()` | 分钟 (0-59) |\n| `getMonth()` | 月份 (0-11) |\n| `getSeconds()` |\
  \ 秒 (0-59) |\n| `getTime()` | 毫秒的日期和时间 – 也称为 Unix 时间 |\n\nJavaScript 内部将日期和时间信息存储为从\
  \ 1970 年 1 月 1 日开始计算的毫秒数。这是大多数编程语言的共同点，也是大多数计算机系统存储时间信息的方式。\n\n![](img/Image00000.jpg)\n\
  \n例如：\n\n```javascript\ndtNow = new Date();\ndocument.write(dtNow.getTime());\n\
  ```\n会写入自 1970 年 1 月 1 日以来经过的毫秒数。\n\n意识到每秒有 1000 毫秒，一分钟有 60 秒，一小时有 60 分钟，一天有 24\
  \ 小时，你可以通过从一个毫秒格式的日期减去另一个来建立两个日期之间的天数（或小时、分钟等）。为了获得所需的单位，请执行相应的除法（例如，计算分钟，先将减法结果除以\
  \ 1000，再除以 60），然后对结果使用 `Math.floor()` 以根据需要将数字向下取整。\n\n### 项目\n打开你之前的项目文件，并将其保存为\
