  \ = true;\n    }\n}\n```\n\n其中 `Product` 是选择框的名称，`Format` 是单选按钮组的名称，第一个单选按钮的值为 `Slide`。\n\
  \n最后，使用 `reset()` 方法将所有表单对象重置为初始状态：\n\n`oFormObject.reset()`\n\n### 项目\n\n1. 打开之前的项目文件，并将其保存为\
