  \ `head` 区域的脚本元素中，定义一个名为 `describe_image()` 的函数，该函数将弹出一个警告框，包含关于你图像的以下信息：\n    -\
  \ 使用的图像文件\n    - 图像宽度\n    - 图像高度\n- 为了让每段文本都换行显示，你可以在警告文本中添加以下字符：`\\n`\n- 例如：\n\
  \  ```javascript\n  alert(“line one\\nLine two”);\n  ```\n- 在浏览器中加载你的页面并查看结果。\n\n\
  ![](img/Image00000.jpg)\n\n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\n## 23\
  \ 简单的图像翻滚 (Image Rollovers)\n\n### 关键点\n\n简单的图像翻滚是鼠标悬停在页面上的图像（通常是链接按钮）上时发生的一种效果。原始图像会被另一个大小相同的图像替换，通常会产生按钮以某种方式高亮的效果。\n\
  \n根据我们目前所学的内容，我们已经了创建简单图像翻滚的能力。剩下的只是明确该过程的细节：\n\n- 页面加载，原始图像按照 `<img>` 标签的 `src`\
  \ 属性显示在页面上。\n- 鼠标移动到图像上，备用图像被加载到位置。\n- 鼠标离开图像，原始图像重新加载。\n\n正如你可能意识到的，我们将使用 JavaScript\
  \ 来更改图像标签的 `src` 属性。最好的思考方式是将 `<img>` 标签简单地视为页面上的一个空间，图像文件可以加载到该空间。`src` 属性告诉浏览器要向该空间加载哪个图像，因此如果我们更改了该值，图像就会改变。\n\
  \n换句话说，`<img>` 标签的 `id` 属性是在命名这个“空间”，而不是图像。\n\n![](img/Image00000.jpg)\n\n| JavaScript\
  \ 初学者 |  |\n|  |  |  |\n|  |  |  |\n\n现在，为了用 JavaScript 更改 `src` 属性，我们需要告诉 JavaScript\
  \ 我们想要更改哪一个图像“空间”。我们使用 `id` 属性结合上一章的 `getElementById()` 方法来实现这一点：\n\n```javascript\n\
  button_img = document.getElementById(“button”);\nbutton_img.src = “new_image.jpg”;\n\
  ```\n\n我们可以直接将此代码插入到图像的事件处理器中：\n\n```html\n<img src=”old.jpg” id=”button” onmouseover=”document.getElementById(‘button’).src\
  \ = ’new.jpg’;”>\n```\n\n注意，这段代码突然变得非常复杂。有两个直接的潜在解决方案。第一个是定义一个函数：\n\n```javascript\n\
  function swap_image( id, new_image ) {\n  img = document.getElementById(id);\n \
  \ img.src = new_image;\n}\n```\n\n```html\n<img src=”old.jpg” id=”button” onmouseover=”swap_image(‘button’,\
  \ ‘new.jpg’);”>\n```\n\n这是一个干净得多的解决方案，更重要的是，我们可以通过简单更改函数调用的参数，将此用于页面上的任何图像。我们还可以使用该函数来实现“切换回”功能：\n\
  \n```html\n<img src=”old.jpg” id=”button” onmouseover=”swap_image(‘button’, ‘new.jpg’);”\
  \ onmouseout=”swap_image(‘button’, ‘old.jpg’);”>\n```\n\n![](img/Image00000.jpg)\n\
  \n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\n尽管如此，我们可以进一步地“清理”我们的代码。由于事件处理器被用于更改正在发生事件的对象（即鼠标正移动到我们试图更改的图像标签上），我们可以使用“自动”的\
  \ JavaScript 对象 `this` 来执行操作：\n\n```javascript\nfunction swap_image( img, new_image\
  \ ) {\n  img.src = new_image;\n}\n```\n\n```html\n<img src=”old.jpg” id=”button”\
  \ onmouseover=”swap_image(this, ‘new.jpg’);”>\n```\n\n注意几点。首先，`this` 周围没有引号——我们像使用变量名一样使用它。其次，我们的函数现在直接使用第一个参数，而不是使用它从页面中获取相关对象。我们可以这样做是因为这实际上是一个对象——它会获取被调用时的任何对象的属性和方法，在这种情况下，它等同于\
  \ `document.getElementById(‘button’ )`，尽管明显短得多！\n\n使用 `this` 有一些局限性。例如，如果我们想在鼠标移动过“button”时更改页面上任何其他图像的\
  \ `src` 属性，我们将无法使用它，因此必须定义另一个接受 `id` 作为参数的函数。\n\n### 项目\n\n- 从网络驱动器将名为 `images`\
