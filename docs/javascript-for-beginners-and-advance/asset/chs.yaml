  \n## 36 要求表单值或选择\n\n### 关键点\n\n如果表单数据在没有某些信息的情况下被发送到服务器，则它可能是无效的——例如，如果用户漏掉了从菜单中选择项目。与其尝试处理无效信息而浪费用户和服务器的时间，不如不去处理它。\n\
  \n\n\n\n\n对于选择框（selection box），验证的一种方法是在默认选项中包含一个空值（null）。在之前的项目中，选择框的默认值（除非另有说明，否则始终是第一个选项）是\
  \ `\"\"`。如果用户没有主动进行其他选择，你可以在将其发送到服务器之前检查选择框的值。\n\n另一个例子是单选按钮（radio buttons）组。假设对于一家虚拟公司，订单单包含两个表单元素——一个指定订购哪个产品的选择框，以及两个指定是作为照片打印还是幻灯片的单选按钮。\n\
  \n假设订单表单的 `id` 为 `OrderForm`，每个单选按钮的 `name` 为 `Format`。（记住，在 HTML 中，一组单选按钮通过它们的\
  \ `name` 相关，每个相关的单选按钮的 name 必须相同）。\n\n`radio` 对象是一个数组，数组中的每个元素存储与每个单选按钮对象相关的信息（记住，计数从\
  \ 0 开始）。\n\n![](img/Image00000.jpg)\n\n| JavaScript 初学者 |  |\n|  |  |  |\n|  | \
  \ |  |\n\n由于组中每个单选按钮的 `name` 都是相同的，你无法通过 `name` 访问单个单选按钮。但你可以使用标准的数组符号来访问它：\n\n\
  `oOrderForm.Format[i]`\n\n在这种情况下，`i` 是 0 和 1 之间的整数，`oOrderForm` 是指向 `OrderForm`\
  \ 元素的对象变量。\n\n一组中的每个单选按钮都有一个 `checked` 属性，它存储一个指定单选按钮是否被选中的 `Boolean` 值。显然，你可以通过以下方式访问此值：\n\
  \n`oOrderForm.Format[i].checked`\n\n因此，为了验证一组单选按钮中至少有一个被选中，你所做的就是使用数组的 `length`\
  \ 属性遍历每个单选按钮，以指定循环的次数：\n\n```javascript\nFormatSelected = false;\noOrderForm = document.getElementById(\"\
  OrderForm\");\nfor ( i=0; i < oOrderForm.Format.length; i++ )\n{\n    if ( oOrderForm.Format[i].checked\
  \ )\n    {\n        FormatSelected = true;\n    }\n}\n```\n\n![](img/Image00000.jpg)\n\
  \n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\n在我们的订单单示例中，某个产品可能只有幻灯片格式。你可以使用\
  \ `select` 对象的 `onchange` 事件处理器来调用一个函数，该函数会自动设置相关 radio 对象的 `checked` 属性值：\n\n```javascript\n\
  function SetFormat ()\n{\n    oOrderForm = document.getElementById(\"OrderForm\"\
