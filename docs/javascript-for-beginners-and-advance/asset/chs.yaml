  \ 小于等于某个数字的最大整数。也就是说，向下取整到整数。 |\n| `Math.floor(2.6)` | 2 |\n| `Math.max(n1,n2)`\
  \ | 两个参数中较大的。 |\n| `Math.min(n1,n2)` | 两个参数中较小的。 |\n| `Math.random()` | 0 到 1 之间的随机数。\
  \ |\n| `Math.round()` | 四舍五入到最近整数。 |\n| `Math.sqrt()` | 数字的平方根。 |\n\n如果你不向服务器发送数据，则不需要\
