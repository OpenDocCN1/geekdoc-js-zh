  ## 15 数组 (Arrays)\n\n### 关键点点\n\n在很多情况下，JavaScript  way 变量可以完全满足我们对数据存储的需求。然而，在许多情况下，我们可能希望将变量“分组”到一个相关项的集合中。\n\
  \n以星期几为例。每天我们都会执行若干任务，所以我们可能希望将每个任务记录作为一个单独的项目，放在一个名为（例如）“周一任务”的组下。\n\n在 JavaScript\
  \ 中，为了实现这一点，我们将每个任务存储在单独的变量中，将这些变量组合成数组。\n\n数组是一种特殊的 JavaScript 对象，它可以存储多个数据值——与变量不同，变量一次只能存储一个数据值。\n\
  \n将数组想象成办公室里的一排邮箱可能会很有帮助，就像你可能把变量想象成单个、孤独的邮箱一样。\n\n数组中的箱是从向上编号的，从第 0 号箱开始——注意，这里的计数是从\
  \ 0 开始的，正如我们在上一节中讨论的那样。分配给每个箱的数字被称为它的 `index`（索引）。\n\n![](img/Image00000.jpg)\n\n\
  | JavaScript 初学者教程 |  |\n|  |  |  |\n|  |  |  ||\n\n为了在 JavaScript 中使用数组，你必须先创建它。在\
  \ JavaScript 中创建数组有多种方法。最简单的方法如下：\n\n```javascript\narrDays = new Array();\n```\n\
  \n这条语句创建了一个名为 `arrDays` 的空数组。我们可以像调用变量一样调用数组，但只需进行微小的调整。\n\n如果你已经知道给定数组将包含多少个元素，可以显式声明它：\n\
  \n```javascript\narrDays = new Array(7);\n```\n\n此修改创建了一个带有 7 个空箱的数组。然而，在 JavaScript\
  \ 中，数组会扩展和收缩到所需的大小，因此你需要指定数组大小的情况很少。\n\n然而，更有用的功能是在创建数组时“填充”数组的箱子。例如：\n\n```javascript\n\
  arrDays = new Array(“Monday”,”Tuesday”);\n```\n\n现在我们有一个有两个元素的数组。第一个元素（元素 0）的值是“Monday”，第二个元素（元素\
  \ 1）的值是“Tuesday”。我们不需要将数组中的值限制为字符串值——布尔值、数值和字符串值都是允许的，就像在普通数组中一样。我们甚至可以将其他数组赋值给数组元素——稍后会详细介绍。\n\
  \n创建数组最常用的方法是使用“方括号”符号。方括号在数组的使用中起着很大作用，因此这通常是最容易记忆的方法：\n\n```javascript\narrDays\
  \ = [“Monday”，“Tuesday”];\n```\n\n这与之前的示例完全相同。\n\n![](img/Image00000.jpg)\n\n| JavaScript\
  \ 初学者教程 |  |\n|  |  |  |\n|  |  |  ||\n\n要访问数组的元素，我们首先调用数组名称，然后在方括号中指定元素的数字，如下：\n\
  \n```javascript\nalert(arrDays[0]);\n```\n\n注意这里 0 周围没有引号。这行代码等同于：\n\n`alert(“Monday”);`\n\
  假设数组如之前的示例所示已定义。\n\n我们不仅可以使用这种符号访问数组元素的值，还可以给它赋值：\n\n```javascript\narrDays[2] =\
  \ “Tuesday”;\narrDays[3] = “Wednesday”;\n```\n\n如果你想在不知道最后一个元素索引的情况下向数组添加一个元素，可以使用以下代码：\n\
  \n```javascript\narrDays[] = “some other day”;\n```\n\n正如我们将会看到的，样，数组实际上是特殊的 JavaScript\
  \ 对象，并具有与之相关的属性和方法。每个数组都拥有的最重要的属性是它的 `length` 属性：\n\n```javascript\nhow_many_days\
  \ = arrDays.length;\n```\n\n除了属性外，数组还有非常有用的方法。如果你想对数组进行字母数字顺序排序，可以使用 `sort` 方法：\n\
  \n`arrDays.sort()`\n\n注意 `sort` 方法作用于实际数组，会覆盖当前值。所以，如果你有一个每个每天作为一个元素的数组，调用它将意味着\
