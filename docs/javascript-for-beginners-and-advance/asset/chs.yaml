  \   - `whatsnew.jpg`\n- 在 `head` 区域的脚本元素中创建一个 JavaScript 函数，接收两个参数——`id` 和文件名。它应该将相应对象的\
  \ `src` 属性更改为。\n- 使用此函数在鼠标移动到图像上时，将按钮的 `src` 属性切换为 `contactsover.jpg`。\n- 一旦运行成功，更新剩余的五个图像的事件处理器，将\
