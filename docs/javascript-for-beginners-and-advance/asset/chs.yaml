  \ 0 到 100 之间的数值。\n\n![](img/Image0000.jpg)\n\n| JavaScript 初学者 JavaScript |  |\n\
  |  |  |  |\n|  |  |  |\n\n使用一个 `if` 语句和多个 `else if` 语句根据以下评分标准检查该变量的值，并将适当的消息打印到页面上：\n\
  \n| 考试结果 | 消息 |\n|---|---|\n| 90 分或以上 | 优秀。优异通过。 |\n| 70 到 89 分 | 做得好。荣誉通过。 |\n\
  | 50 到 69 分 | 刚通过。 |\n| 54 分或以下 | 未及格。下次努力。 |\n\n在浏览器中测试你的结果。改变 `exam_result` 的值并检查浏览器中显示的值。为了练习，尝试使用提示框来尽可能方便地更改\
  \ `exam_result`。\n\n![](img/Image0000.jpg)\n\n# 循环\n\n### 关键要点\n\n字母 `i`、`j` 和 `k`\
  \ 传统上被程序员用来命名作为计数器的变量。例如，在程序的不同阶段，`i` 可能包含数字 1, 2, 3 等。为了实现“计数”效果，你需要根据一个固定值增加或减小计数器变量的值。以下是一些示例：\n\
  \n```javascript\ni = i + 1;\ni = i - 1;\ni = i + 3;\nincr = 0;\n```\n\n为了保持简洁，我们可以使用以下快捷方法：\n\
  \n```javascript\ni++; // 等于 i + 1;\ni--; // 等于 i - 1;\n```\n\nJavaScript 中的计数（像许多其他语言一样）通常从零开始。在很多情况下，这很有意义。然而，它经常会引起混淆。考虑从\
  \ 0 开始数到 10。在这种情况下，我们实际上数了 11 个项目：\n\n1. 在纸上写下数字 0。\n2. 每次操作后，擦掉纸上的数字并将其加 1。\n3.\
  \ 在每次操作之前，检查纸上的数字。如果小于 100，则执行该操作。\n\n或者，他们可能决定从 1 开始计数。在这种情况下，步骤是相同的，但每次操作前的检查将是确保数字严格小于\
  \ 10。\n\n在 JavaScript 中，我们几乎说相同的话。以下代码将在页面上显示 1 到 10 的数字：\n\n```javascript\nfor\
  \ (i = 1; i <= 10; i++)\n{\n  document.write(\"<p>\" + i + \"</p>\");\n}\n```\n\n\
  ![](img/Image0000.jpg)\n\n| JavaScript 初学者 JavaScript |  |\n|  |  |  |\n|  |  |\
  \  |\n\n`for` 语句告诉浏览器我们即将执行一个循环。这里的布局与条件语句非常相似，但在这种情况下，我们在括号中有更多信息：\n\n1. **初始化\
  \ (initialiser)**：这设置了初始计数条件，在这种情况下为 `i = 1`。\n2. **条件 (conditional)**：这与我们之前的条件语句相同，必须返回\
  \ true 或 false。如果返回 true，循环继续，否则退出。\n3. **递增器 (incrementer)**：这定义了在每次循环结束时执行的操作。在这种情况下，`i`\
  \ 增加了一个值为 1 的值。\n\n通过让条件不依赖于计数值，可以创建一个无限循环——例如：\n\n```javascript\nfor (i=0; 5 >\
  \ 4; i++)\n```\n\n这将始终执行大括号中的脚本，并可能导致浏览器中出现错误。\n\n\n\n\n请注意，在 JavaScript 中从 0 开始计数是非常常见的。其原因是因为我们通常希望统计某个操作执行了多少次。\n\
  \n考虑以下情况：\n\n```javascript\nfor ( i=1; 1 < 2; i++ )\n```\n\n在这种情况下，循环将运行一次，但 `i`\
  \ 的值将变为 2，因为在第一次运行后，`i` 会增加到 2，然后通过测试失败，循环就会退出。如果我们使用以下代码：\n\n```javascript\nfor\
  \ ( i=0; 1 < 1; i++ )\n```\n\n那么循环将运行一次，之后 `i` 的值将是 1，正正如我们所希望的那样。\n\n### 项目\n\n\
