  \ |  |\n|  |  |  |\n|  |  |  \n\n 17 二维数组\n\n### 核心要点\n\n回到我们之前的邮箱箱类比，我们的数组可以被想象成一排邮箱箱，每个邮箱箱都有自己的内容和标签，那么二维数组就可以被看作是这些排邮箱箱堆叠在一起的。\n\
  \n实际上，二维数组仅仅是一个数组，其中的每个元素本身也是另一个数组。二维数组的每个“子数组”长度可以是不同的——换句话说，二维数组并不非得是“正方形的”。\n\
  \n你可以使用两对方括号而不是一对来访问每个子数组的内容。下面的示例能最好地说明这一点：\n\n```javascript\narray_1 = [\"element”,\
  \ “element 2”];\narray_2 = [another element”, 2, 98, true];\narray_3 = [array_1,\
  \ array_2];\nalert(array_3[1][3]); // 显示 “98”\n```\n\n虽然你不能在一个数组中混合使用数值索引和字符串索引系统（即数组不能既是数值数组又是关联数组），但你可以在二维数组中同时拥有关联数组和数值数组。例如，将上述内容重构如下：\n\
  \n```javascript\narray_3 = new Array();\narray_3[\"firstArray\"] = array_1;\narray_3[\"\
  secondArray\"] = array_2;\nalert(array_3[\"secondArray\"][3]); // 再次显示 “98”\n```\n\
  \n![](img/Image00000.jpg)\n\n| 入初者的 JavaScript |  |\n|  |  |  |\n|  |  |  ||\n\n\
  同样，我们可以愉快地对关联数组使用我们的“对象”符号：\n\n```javascript\nalert(array_3.secondArray[3]);\n//\
