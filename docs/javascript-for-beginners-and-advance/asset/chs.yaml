  \ (128)\n\n## 1 什么是编程语言？\n\n编程语言是一组我们用来给计算机下达指令的代码。常见的编程语言包括 `C++`、`COBOL`、`BASIC`、`LISP`\
  \ 等。大多数编程语言都是易读的，因为它们共享许多共同概念。特别是它们都拥有`变量`、`数组`、`条件语句`和`函数`。我们稍后会遇到这些概念。\n\n传统的编程语言被用于编写“独立”应用程序。诸如\
  \ `Microsoft Word`、`Mozilla Firefox` 和 `Lotus Notes` 等程序都是此类应用程序的示例。它们在 PC 上运行，并不一定需要在旁边安装其他软件。Web\
  \ 应用程序在许多方面与这些程序不同，最显著的区别是它们都运行在浏览器内部。Web 应用程序的示例包括 `Google`、`Hotmail`、`Flickr`\
  \ 和 Gmail。\n\n## 2 服务端与客户端\n\n万维网构建在多种技术之上。对于大多数用户来说，Web 的开始和结束于他们对浏览器的。浏览器被认为定义了\
  \ Web 的客户端，浏览器、运行它的计算机以及上网的用户统称为客户端。\n\n考虑一个决定访问 `www.google.com` 网站的客户端。首先发生的是客户端向\
  \ Google 的 Web 服务器请求该网站的默认页面。Web 服务器是运行在 Google 拥有的计算机上的应用程序。与客户端一样，服务器程序及其运行的计算机定义了\
  \ Web 的服务端，并统称为服务器。\n\n当服务器接收到对特定页面的请求时，它的工作是从计算机文件中检索页面并将其返回给客户端。在许多情况下，这种操作是一个非常简单的过程，对服务器部分很少或完全没有工作量要求。\n\
  \n\n\n\n\n然而，使用 `PHP`、`Perl` 或 `Java` 等编程语言，我们可以让服务器在将页面传给客户端之前对其进行修改，甚至可以完全从头开始生成页面。这被称为服务器端应用程序。传给客户端的页面（对客户端而言）与任何其他未修改的页面看起来完全一样。\n\
  \n![](img/Image00000.jpg)\n\n| 面初学者 JavaScript |  |\n\n|  |  |  |\n\n|  |  |  |\n\
  \n服务器端应用程序的一个示例可能是向页面插入当前日期和时间。这意味着每当页面被请求时（例如，使用浏览器的刷新按钮），页面上就会被添加一个新的新时间值。\n\n\
  一旦客户端从服务器接收到页面，它就会显示该页面并等待用户请求另一个页面。页面一进入这种 这种状态，它就超出了服务器的控制范围。现在，任何服务器端应用程序都无法在不需要客户端再次返回服务器获取新的（且可能已更新的）页面副本的情况下，更改页的内容。\n\
  \n然而，所有现代浏览器都允许运行客户端应用程序。这些是嵌入在页面本身 `HTML` 代码中的小型应用程序。\n\n服务器端应用程序在修改发送给客户端的页面时，会忽略发现的任何客户端应用程序，因此通常情况下，这两类应用程序无法相互“交谈”。\n\
  \n然而，一旦客户端接收了客户端应用程序，它就可以开始动态地修改页面，而无需返回服务器。\n\n客户端应用程序的一个示例可能是网页上每秒更新一次的时钟。\n\n\
  客户端应用程序一个遗憾的副作用是，所有代码都必须发送到客户端运行，这意味着应用程序的内部运作对任何人可见。这使得检查密码或执行任何可能导致机密信息泄露外界的操作变得不切。\n\
  \n此外，所有现代网络浏览器都为用户提供了完全关闭客户端应用程序的机会。除此之外，同一个客户端应用程序的运行方式会随着浏览器类型的不同而异。\n\n尽管有这些缺点，客户端应用程序（或由于其通用性短小，常被称为**脚本**）仍然是开发\
  \ Web 应用程序时为 Web 用户提供丰富环境的最佳方式。\n\n![](img/Image00000.jpg)\n\n| 面初学者 JavaScript\
  \ |  |\n\n|  |  |  |\n\n|  |  |  |\n\n### 简而言之，这两种技术各有优劣：\n\n客户端脚本允许开发者动态地更改页面，并立即响应用户操作，而无需等待服务器创建页面的新版本。然而，需要注意安全和跨浏览器兼容性问题，这些问题通常是非同常的。\n\
  \n服务器端应用程序允许开发者保持代码的安全和秘密性，从而能够创建更强大的应用程序。此外，由于运行代码的服务器始终是已知的实体，在一个浏览器中成功运行的应用程序将在所有浏览器中成功运行。然而，尽管有这些强大功能，服务器端应用程序并没有直接的方法在不强制客户端加载另一个页面的情况下更改页面。这使得对于下拉菜单、提交前的表单检查、定时器、警告警报等功能来说是完全不切实际。\n\
  \n![](img/Image00000.jpg)\n\n| 面初学者 JavaScript |  |  |\n\n|  |  |  |\n\n|  |  |\
  \  |\n\n## 3 关于 JavaScript\n\n### 核心要点\n\n`JavaScript` 是一种解释型的、客户端的、事件驱动的、面向对象的脚本语言，你可以用它为你的网页添加动态交互功能。\n\
  \n`JavaScript` 脚本是用纯文本编写的，类似于 `HTML`、`XML`、`Java`、`PHP` 以及几乎任何其他现代计算机代码。在代码中，我们将使用\
  \ Windows `NotePad`（记事本）来创建和编辑我们的 `JavaScript` 代码，但也有许多替代方案。选择 `NotePad` 是为了演示 `JavaScript`\
  \ 的即时性和简单性。\n\n你可以使用 `JavaScript` 实现任何以下功能：\n\n- 使用图像创建特殊效果，当鼠标指针悬停在按钮上时，产生按钮被高亮或按下的错。\n\
  - 验证用户在你的 Web 表单中输入的信息。\n-在新窗口中打开页面，并自定义这些新窗口的外观。\n- 检测用户浏览器的能力并相应地更改你的页面内容。\n-\
  \ 在无需 `PHP` 等服务器端语言的情况下，“即时”创建自定义页面。\n- 以及更多更多……\n\n![](img/Image00000.jpg)\n\n\
  | 面初学者 JavaScript |  |  |\n\n|  |  |  |\n\n|  |  |  |\n\n`JavaScript` **并不是** `Java`，尽管如果你有\
  \ `Java` 背景，你会发现这两种语言在编写时看起来很相似。`Java` 是一种功能齐全且全面的编程语言，类似于 `C` 或 `C++`，尽管 `JavaScript`\
  \ 可以与 `Java` Web 应用程序交互，但不应将两者混淆。\n\n不同的网络浏览器会以不同的、有时是不兼容的方式运行你的 `JavaScript`。为了解决这个问题，通常需要使用\
  \ `JavaScript` 本身来检测它所处环境的能力，并根据结果更改其操作。\n\n回顾本章的定义，请注意以下几点：\n\n- **解释型的（Interpreted）**\
  \ 指 `JavaScript` 代码在加载到浏览器时就会被执行（处理）。这与 `Java` 这样的编译型语言有所不同，后者在运行单行代码之前会彻底地检查你的程序，而且如果你来自非解释型编程背景，这可能会产生许多让你措手无不及的影响。\n\
  - **客户端的（Client-side）** 已在上一章中定义过。\n- **事件驱动的（Event-based）** 指 `JavaScript` 仅在指定事件发生时才运行某些代码的能力。事件可以可以是页面加载、表单提交、链接被点击或鼠标指针指向图像。\n\
  - **面向对象的（Object-oriented）** 表明 `JavaScript` 控制 `HTML` 页面的能力基于操作该页面内的对象。如果你熟悉面向对象编程，你将意识到这能为编码环境带来一些力量。\n\
  \n![](img/Image00000.jpg)\n\n| 面初学者 JavaScript |\n\n|  |\n\n最后的说明：虽然 `JavaScript`\
  \ 是一种编程语言，但 `HTML`（万维网语言）不是。`HTML` 是一种**标记语言**，这意味着它可以将文档的某些区域标记为具有特殊特征，如标题、段落、图像、表单等，但它本身无法执行任何逻辑处理。因此，虽然\
  \ `JavaScript` 通常与 `HTML` 一起编写，但一者的规则并不对另一个有任何影响。\n\n## 4 JavaScript 之之旅\n\n###\
  \ 核心要点\n\n让我们快速浏览一下 `JavaScript` 的主要功能。本章旨在展示 `JavaScript` 能做什么，而不是对深层概念进行深入研究，所以如果你迷路或不理解你输入的代码，不要太担心！\n\
  \n### 项目\n\n我们的所有 `JavaScript` 都将使用 `NotePad` 编写。打开 `NotePad` 并生成的空文档保存到你的用户驱动器中，命名为\
  \ `chapter_4.htm` l .\n\n\n\n\n\n首先在你的空白文档中创建一个基础 HTML 页面。它不需要任何花哨——以下内容就完全足够了：\n\
  \n```html\n<html>\n<head>\n<title>第 4 章：JavaScript 游览</title>\n</head>\n<body>\n\
  <h1>JavaScript 游览</h1>\n</body>\n</html>\n```\n\n按照惯例，当笔记意图让你将所有代码都写在同一行时，它们会使用一个像上面那样的箭头\
  \ `↵` 来指示你不应该在该处换行。对于 `HTML` 来说，这并不重要，但对于 `JavaScript` 来说，错误位置换行会导致你的代码无法运行。\n\n\
  ![](img/Image00000.jpg)\n\n| 初学者 JavaScript | | |\n|  |  |  |\n|  |  |  |\n\n保存你的新网页，并在网页浏览器中查看它。目前，请使用\
  \ `Internet Explorer` 查看此页面。要执行此操作，在你的用户驱动器上找到保存的文件，并双击它。这将默认用 `Internet Explorer`\
  \ 打开文件，并让你看到刚刚创建的页眉。\n\n到为止，我们还没有做任何超出 `HTML` 范围的事情。让我们给页面添加一些 JavaScript。\n\n（通俗地说）网页上有三个地方可以让我们添加\
  \ `JavaScript`。其中第一个是位于新的一组 HTML 标签之间。这些 `script` 标签采用以下形式：\n\n```html\n<script\
  \ language=\"JavaScript\" ↵ type=\"text/JavaScript\">\n… code …\n</script>\n```\n\
  \n上面的 `script` 元素几乎可以放置在 `HTML` 页面中任何放置元素的地方——也就是说，可以放在 `head` 元素或 `body` 元素中。它最常被放在前者，尽管通常这样做是为了让所有的代码在页面上都能被找到。\n\
  \n同时注意，`HTML` 页面中包含的 `script` 元素数量没有限制。除了谨慎起见外，没有什么能阻止你在页面上散布上百个这样的标签。\n\n让我们将起始和结束\
  \ `script` 标签添加到页面的 `head` 元素中，如下：\n\n```html\n<html>\n<head>\n<title> … </title>\n\
  <script language=\"JavaScript\" ↵ type=\"text/JavaScript\">\n</script>\n</head>\n\
  …\n```\n\n![](img/Image00000.jpg)\n\n| 初学者 JavaScript | | |\n|  |  |  |\n|  |  |\
  \  |\n\n保存文件，然后尝试在浏览器窗口中刷新页面。注意，什么都没有发生。这是我们预料之中的——到为止我们只是在页面上设置了一个区域来存放我们的 `JavaScript`。\n\
  \n回到 `NotePad`，在起始和结束 `script` 标签之间输入以下文本：\n\n```javascript\nwindow.alert(\"Hello\
  \ world!\");\n```\n\n保存更改，再次在浏览器窗口中刷新页面。欢迎来到 JavaScript 世界！\n\n回到 `notepad` 并删除你刚刚添加的\
  \ `window.alert` 行。现在添加以下稍微复杂一点的代码：\n\n```javascript\nif ( confirm(\"Go to Google?\"\
  ) ) { \n    document.location = ↵ \"http://www.google.com/\";\n}\n```\n\n再次保存更改并刷新页面。对于那些关注后续章节的人来说，这是一个条件语句的示例，我们要求\
  \ JavaScript 检查某事的条件（在这种情况下，是我们对一个问题的回答），然后根据它的发现来改变它的行为。\n\n现在，这两段 JavaScript 代码在页面加载到浏览器时都是不受控制地运行的。在大多数情况下，我们希望对\
  \ JavaScript 何时执行我们要求的操作有更多控制。\n\n这种控制是事件（events）的领域。在浏览器中，`HTML` 文档的每个元素都关联着若干可以发生在其身上的事件。链接可以被点击，表单可以提交，页面可以加载等等。\n\
  \n修改你 `script` 元素中之前的 JavaScript 行以匹配以下内容：\n\n```javascript\nfunction go_to_google()\
  \ {\n    if ( confirm(\"Go to Google?\") ) { \n        document.location = ↵ \"\
  http://www.google.com/\";\n    }\n}\n```\n\n![](img/Image00000.jpg)\n\n| 初学者 JavaScript\
  \ | | |\n|  |  |  |\n|  |  |  |\n\n在这里注意这里的括号！\n\n保存并刷新，注意这次什么也没有发生。这是因为我们已经把之前的操作（弹出问题并根据响应采取行动）封装在一个\
  \ `function`（函数）中。`function` 是一个赋予了名称的代码块——在这种情况下，名称是 `go_to_google()`——并且只有当该名称被“调用”时才会运行。将函数视为在念出其名称时可以召唤的魔咒可能会很有用。\n\
  \n要施展这个魔咒，我们需要在页面上选择一个元素来触发它。一个自然的候选者是链接元素，因此在页面的 `body` 部分添加以下 HTML：\n\n```html\n\
  <p>A quick <a href=\"#\">\">test</a>.</p>\n```\n\n`#` 链接是一个常用的 HTML 技巧，允许我们创建一个“通往无何处的链接”。\n\
  \n保存并刷新，检查链接是否出现在页面上，以及点击时它是否没有去往任何地方。\n\n现在，我们希望在点击链接时让页面询问我们是否要“前往 Google？”。方法如下：\n\
  \n获取链接元素并对其进行如下修改：\n\n```html\n<a href=\"#\" onclick=\"go_to_google();\">test</a>\n\
  ```\n\n保存并刷新，然后点击链接。这是一个事件处理器（event handler）的示例。当链接被点击（`onclick`）时，我们的浏览器会说“魔咒”\
  \ `go_to_google()`，我们的函数就会被调用。\n\n最后一个魔术，在页面的 `body` 部分包含链接的段落之后添加以下代码：\n\n```html\n\
  <body>\n…\n<script language=\"JavaScript\" ↵ type=\"text/JavaScript\">\ndocument.write(\"\
  <h2>Here’s another ↵ header!</h2>\");\n</script>\n</body>\n```\n\n注意，该行代码应该在同一行上！\n\
  \n![](img/Image00000.jpg)\n\n| 初学者 JavaScript | | |\n|  |  |  |\n|  |  ||  |\n\n\
  保存页面并刷新浏览器。注意现在页面上多了一行新文本——另一个标题！我们使用 JavaScript 创建了 HTML 并告诉浏览器恰当地地显示它。在这个示例中，JavaScript\
  \ 做的任何事情我们都能用 HTML 办到，但在未来的章节中，我们将看到如何利用它来编写当前日期。\n\n![](img/Image00000.jpg)\n\n\
  | 初学者 JavaScript | | |\n|  |  |  |\n|  |  ||  |\n\n## 5 对象、属性和方法\n\n### 核心要点\n\n\
  - 通俗地说，对象（objects）是“东西”。例如，钢琴就是一个对象。\n- 属性（properties）是用来描述和定义特定对象的术语。例如，我们的钢琴有颜色、重量、高度、踏板、键盘和盖子。\n\
  - 注意上述内容，对象的属性本身也可以是属性。所以我们存在这样的情况：钢琴盖子是钢琴的属性，但它本身也是一个对象，拥有自己的一组属性——例如，盖子有颜色、长度，甚至有开启或关闭的状态。\n\
  - 如果说对象是编程语言中的名词，属性是形容词，那么方法（methods）就是动词。方法是在特定对象上执行（或由特定对象执行）的操作。继续我们的钢琴例子，你可以弹钢琴、打开它的盖子或踩下延音踏板。\n\
  - 许多编程语言都有类似的方式引用对象及其属性或方法。通常，它们是层次级的，对象与其属性、方法以及与其他对象之间的关系通常可以通过编程表示法轻松看出。\n- 在\
  \ JavaScript 中，我们使用“点符号表示”（dot notation）来表示对象及其属性和方法。例如，我们这样引用我们钢琴的颜色：\n  `piano.colour;`\n\
  \n![](img/Image00000.jpg)\n\n- 如果我们想指令 JavaScript 弹钢琴，可以写非常简单的：\n  `piano.play();`\n\
  - 当我们决定打开钢琴盖子时，可以看到一个清晰的对象层次结构示例：\n  `piano.lid.open();`\n\n\n\n\n\n如果我们想按下钢琴的延音踏板，更是如此：\n\
  \n```javascript\npiano.pedals.sustain.press();\n```\n\n请注意，在上面的某些示例中，我们在每组单词后面都有括号`()`，而在另一些中没有。这是为了确保\
  \ JavaScript 能够理解我们说的内容。\n\nJavaScript 在浏览器中的整个存在过程中都在与对象交互。页面上所有的 HTML 元素都可以描述为对象、属性或方法。我们在之前的介绍性章节中已经见过其中一些对象：\n\
  \n```javascript\ndocument.write(…);\ndocument.location;\n```\n\n在这些示例中，`document`\
  \ 是一个对象，而 `write` 是一个方法，`location` 是一个属性。\n\n在这些行中，我们看到了关于在这些语句中使用括号的线索。我们使用括号来告诉\
  \ JavaScript 我们正在谈论一个对象的方法，而不是同名的属性。\n\n括号还允许我们向对象的方法传递某些额外信息。在上面的示例中，为了向网页文档写入文本“Hello\
  \ world!”，我们将编写以下 JavaScript 代码：\n\n```javascript\ndocument.write(“Hello World”);\n\
  ```\n\n每个方法执行的操作都取决于括号中的内容（或者用技术术语说，“传递给方法的参数”）。事实上，许多方法可以接受多个“参数”来修改其行为。多个参数之间用逗号（`,`）分隔。\n\
  \n![](img/Image00000.jpg)\n\n| 给初学者的 JavaScript |  |\n|  |  |  |\n|  |  |  |\n\n\
  像这里显示的 JavaScript 指令被称为 JavaScript 语句。所有语句都应该以单个分号（`;`）结束。JavaScript 经常会忽略行尾缺失的分号，并自动为你插入分号。然而，这可能会导致一些意想不到的结果。请考虑以下情况：\n\
  \n```javascript\ndocument.write(“<h1>\nHello World!\n</h1>”);\n```\n\n在许多其他语言中，这是可以接受的。然而，JavaScript\
  \ 经常会将此类内容解释为如下：\n\n```javascript\ndocument.write(“<h1>;\nHello World!;\n</h1>”);\n\
  ```\n\n这种解释将产生错误，因为如果我们在结束语句时没有确保引号内的任何术语都有匹配的引号，JavaScript 就会报错。在这个示例中，第一行的“语句”被截断了，JavaScript\
  \ 将会崩溃。\n\n因此，建议你所有的语句都以分号结尾。\n\n![](img/Image00000.jpg)\n\n| 给初学者的 JavaScript |\
  \  |\n|  |  |  |\n|  |  |  |\n\n## 6 给属性赋值\n\n### 关键点\n\n虽然对象和方法允许我们在页面上执行某些操作，例如更改内容或弹出对话框与用户交互，但在许多情况下，我们可能想要直接更改对象某个属性的值。这些情况类似于将我们的钢琴漆成绿色。\n\
  \n考虑到我们目前为止对方法的讨论，我们可能会认为能够使用方法来更改对象的属性——例如，以下代码似乎是有逻辑的：\n\n```javascript\npiano.paint(“green”);\n\
  ```\n\n在很多情况下，这确实是我们要做的。然而，这里有两个缺点。首先，在课程中，我们发现的大多数对象都是内置并定义的。如果我们依靠一个方法来更改对象的属性，我们就是在依赖该方法存在这一事实。解决此问题的更直接的方法是直接访问对象的属性。例如：\n\
  \n```javascript\npiano.colour = “green”;\n```\n\n在这里，我们不再使用方法，而是使用所谓的运算符 `=`。\n\n\
  ![](img/Image00000.jpg)\n\n| 给初学者的 JavaScript |  |\n|  |  |  |\n|  |  |  |\n\n在\
  \ JavaScript 中，我们可以非常有效地使用这个运算符。例如，我们可以动态式地更改页面标题。这可以在用户点击页面部分时完成，也可以自动设置以显示时间。我们为此使用的代码是：\n\
  \n```javascript\ndocument.title = “new”;\n```\n\n有很多赋值运算符。表中显示了一些常见的：\n\n| 赋值 |\
  \ 功能 |\n|  |  |\n| `x = y` | 将 `x` 的值设置为 `y` |\n| `x += y` | 将 `x` 的值设置为 `x + y`\
  \ |\n| `x -= y` | 将 `x` 的值设置为 `x - y` |\n| `x *= y` | 将 `x` 的值设置为 `x * y` |\n| `x\
  \ /= y` | 将 `x` 的值设置为 `x / y` |\n\n并不是所有的赋值运算符都适用于所有类型。在处理数字时，结果是两个数字之和。在处理文本时，结果是两个字符串的拼接：\n\
  \n```javascript\ndocument.title += “!”;\n```\n\n这将导致 `!` 被添加到当前标题的末尾。打开你的项目并将其保存为\
  \ `chapter_6.htm`。如下更改标题的值：\n\n```html\n<title>With help from</title>\n```\n\n现在，向你的脚本添加一条语句以添加以下：\n\
  \n```javascript\ndocument.title = “JavaScript!”\n```\n\n重新加载页面并考虑结果。我们之前遇到过 `window`\
  \ 对象。我们在第 4 节中对 `alert` 方法的演示写成：\n\n```javascript\nwindow.alert(“message”);\n```\n\
  \n在很多情况下，我们在编写代码时可以省略对象/属性/方法层级中的某些部分。我们稍后会再次讨论这一点。为了理解 `prompt` 方法发生了什么，我们可以写下一个方法原型（prototype）。这是一种描述方法参数的方式，使它们对方法的影响更加自显其意。window\
  \ 对象的 `prompt` 方法原型可能如下：\n\n```javascript\nwindow.prompt( message , default_response\
  \ );\n```\n\n所以，我们可以看到第一个参数定义了出现在 prompt 对话框中的问题文本。第二个参数就没那么清楚了。用不同的值尝试你的代码，看看你的更改产生了什么变化。最后，我们注意到这个\
  \ prompt 方法以某种方式获取框中输入的信息，并将其传递给我们的 JavaScript 赋值。假设有人在框中输入了“Hello World”。就好像我们的赋值实际上是：\n\
  \n```javascript\ndocument.title = “Hello World”;\n```\n\n\n\n\n当发生这种值的传递时，我们就说方法返回了所传递的值。在这种情况下，我们可以说“prompt\
  \ 方法返回了值‘Hello World’”，或者说“prompt 方法的返回值为‘Hello World’”。当我们以后处理事件处理程序时，返回值将变得非常重要。\n\
  \n![](img/Image00000.jpg)\n\n| 面初学者 JavaScript | | |\n\n## 7 章 关于注释\n\n### 核心要点\n\
  \n跟我读一遍：注释很重要。注释很重要。注释很重要。\n\n在你的代码中添加注释始终是一种良好的做法。随着脚本复杂性的增加，注释可以帮助你在日后重新查看代码时，帮助你（以及他人）理解其结构。\n\
  \n许多快速创建的代码被称为“只写不读”代码，因为它们天生缺乏结构或注释。调试此类代码，或者在几个月后重新使用它，将变得极其困难，因为你试图记住某行代码本该是做什么的，或者为什么使用某些值会导致代码停止运行。\n\
  \n只要注释格式正确，JavaScript 会完全忽略它们，并且对脚本的运行速度不会产生任何影响。\n\n然而，注释可能会减慢页面的加载速度——许多程序员会保留一份带有完整注释的“开发版”代码用于编辑，并在最终发布时删除代码中的所有注释。\n\
  \nJavaScript 中有两种类型的注释——单行注释和多行注释。\n\n单行注释以两个正斜杠字符（`//`）开头，并换行结束：\n\n```\nthis is\
  \ a comment alert(\"hello\"); // so is this\n```\n\n![](img/Image00000.jpg)\n\n\
  | 面初学者 JavaScript | | | |\n\nJavaScript 中的单行注释也可以使用你可能熟悉的 HTML 注释格式：\n\n```html\n\
  <!-- this is a comment\nalert(\"hello\");\n```\n\n注意两点：首先，这种 HTML 注释格式的使用不需要闭合的\
  \ `-->` 标签。其次，这只是单行注释，与在 HTML 中的用法不同（HTML 中的注释会注释直到结束标签之前的所有行）。\n\n你可以通过将注释块封装在\
  \ `/*` 和 `*/` 之间来添加多行注释。例如：\n\n```javascript\n/* 所有的文本将被将被 JavaScript 忽略。这允许我们编写更大的注释，而必担心需要“注释掉”每一行\
  \ */\nalert(\"Hello World\");\n/* 一个单行的“多行”注释 */\n```\n\n除了为你的脚本添加说明外，你还可以使用注释从页面中移除代码，而无需删除代码。例如：\n\
  \n```javascript\nthis was the old message\nalert(\"Hello World\");\nand this is\
  \ the new message\nalert(\"Hello everyone!\");\n```\n\n如果你正尝试追踪代码中的错误，这非常有用——你可以逐个“注释掉”每一行可疑代码，直到你设让代码重新工作为止。\n\
  \n### 项目\n\n打开你之前的项目文件，并将其保存为 `chapter_7.htm`。\n\n在脚本的开头添加单行注释：\n`This is my first\
  \ comment`\n\n![](img/Image00000.jpg)\n\n| 面初学者 JavaScript | | | |\n\n向你的脚本中添加一个多行注释，替换你之前的单行注释。多行注释应该描述你的脚本目前的功能。\n\
  \n![](img/Image00000.jpg)\n\n| 面初学者 JavaScript | | | |\n\n## 8 章 向旧版浏览器隐藏脚本\n\n\
  ### 核心要点\n\n非常旧的浏览器不理解 JavaScript。今天在使用的此类浏览器寥寥无几，但有两个因素迫使我们继续考虑可能无法处理我们 JavaScript\
  \ 代码的环境。\n\n首先，所有现代浏览器都允许用户控制是否运行 JavaScript 代码。在许多情况下，用户对公司的策略没有话语权，甚至可能不知道他们的工作机器已经禁用了\
  \ JavaScript。\n\n其次，并不是所有的访问者都会使用可以利用任何 JavaScript 的浏览器。盲文显示器、屏幕阅读器和其他非视觉浏览器对许多\
  \ JavaScript 技巧几乎无大用用之地。此外，像 Google 这样的搜索引擎会忽略你在页面上使用的任何 JavaScript，这可能会隐藏重要内容，并导致你的页面无法被收录索引。\n\
  \n不支持 JavaScript 的浏览器本应该忽略开始和结束 script 标签之间的任何内容。然而，许多浏览器会违反这一规则，并尝试尝试将你的代码渲染为 HTML，这可能会导致尴尬的后果。\n\
  \n![](img/Image00000.jpg)\n\n| 面初学者 JavaScript | | | |\n\n然而，我们可以利用这样一个事实：`<!--`\
  \ 在 JavaScript 中表示单行注释，但在 HTML 中表示多行注释，这可以确保我们的代码能被精通 JavaScript 的浏览器看到，但被其他设备视为被注释掉的\
  \ HTML 而忽略：\n\n```html\n<script>\n<!-- hide from older browsers\n… your code\nstop\
  \ hiding code --> </script>\n```\n\n这防止了旧版浏览器显示代码，但如果我们想将其替换为某些注释呢？例如，假设我们有一段代码用于显示时间并按名称问候用户。如果没有\
  \ JavaScript，在应该有问候语的地方将是一片空白。\n\n我们可以使用 `<noscript>` 标签让我们的代码在 JavaScript 不可用时“优雅地失败”。该元素的内容在理解\
  \ JavaScript 的地方被忽略，在其他地方显示。例如：\n\n```html\n<noscript>\n<h1>Welcome to our site!</h1>\n\
  </noscript>\n<script>\n<!-- hide from older browsers\nstop hiding code --> </script>\n\
  ```\n\n### 项目\n\n打开你之前的项目文件，并将其保存为 `chapter_8.htm`。\n\n在代码中添加两行，以确保它不会混淆旧版浏览器或用户禁用了\
  \ JavaScript 的浏览器。\n\n![](img/Image00000.jpg)\n\n| 面初学者 JavaScript | | | |\n\n在可能的情况下你应该使用\
  \ `<noscript>` 元素提供能够充分替代脚本内容的内容。例如，如果你使用 JavaScript 在页面上构建一个导航面板，`noscript` 元素应该包含一个执行相同任务的纯列表。\n\
  \n## 9 章 自动重定向用户\n\n### 核心要点\n\n我们已经在第 4 章中见过浏览器重定向的使用。\n\n为了更完整地表述这个想法，为了将用户重定向到不同的页面，你需要设置\
  \ `document` 对象的 `location` 属性。\n\n正如我们在第 6 章中看到的，这里可以使用赋值运算符。例如：\n\n```javascript\n\
  document.location = \"http://www.bbc.co.uk/\";\ndocument.location = \"chapter_4.html\"\
  ;\n```\n\n### 项目\n\n打开你之前的项目文件，并将其保存为 `chapter_9_redirect.htm`。\n\n保存该文件的副本，这次命名为\
  \ `chapter_9.htm`。\n\n确保两个文件都保存在同一个文件夹中，并且你在编辑器中打开了 `chapter_9.htm`。\n\n删除 script\
  \ 标签之间的所有脚本，只保留你的浏览器隐藏行。确保 script 标签仍然页面的 head 部分。\n\n\n\n\n[content]\n现在，向此脚本添加一条语句，以便在页面加载到浏览器时自动将用户重定向到\
  \ `chapter_9_redirect.html` 页面。\n\n![](img/Image00000.jpg)\n\n| JavaScript 初学者 |\
  \  |\n|  |  |  |\n|  |  |  |\n\n最后，在页面的 body 部分添加一个标题标签，其中包含“You can’t see me!”的文本。\n\
  \n关闭此页面，先不要在浏览器中检查，并在编辑器中打开 `chapter_9_redirect.html` 页面。\n\n移除页面上的所有 JavaScript（包括你的\
  \ `script` 标签），并确保页面上只剩下 HTML。\n\n在页面的 body 部分添加一个标题标签，其中包含“But you can see ME!”的文本。\n\
  \n保存此页面，并在浏览器中加载 `chapter_9.html` 页面。\n\n尝试在 `chapter_9.html` 中变换 `script` 标签的不同位置，看看是否可以让标题在重定向之前出现。\n\
  \n![](img/Image00000.jpg)\n\n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\n##\
  \ 10 Alert, Prompt 和 Confirm\n\n### 关键点\n\n到目前为止，我们已经看到了 `alert()`、`prompt()` 和\
  \ `confirm()` 对话框的简要示例，用于请求用户响应并在后台暂停所有代码直到请求得到满足。\n\n所有这些框都是 `window` 对象方法的结果。该对象是\
  \ JavaScript 在浏览器中可以处理的最高级对象。因此，页面上的所有其他对象（少数例外除外）都是 `window` 对象的属性。\n\n由于这种普遍性，即使省略了它，也被认为它存在。因此，在技术上我们应该写：\n\
  \n```javascript\nwindow.document.write(“…”);\n```\n\n但写成这样同样有效：\n\n```javascript\n\
  document.write(“…”);\n```\n\n正如我们一直这样做的那样。\n\n同样，与其写：\n\n```javascript\nwindow.alert(“…”);\n\
  ```\n\n我们可以愉快地写成：\n\n```javascript\nalert(“…”);\n```\n\n![](img/Image00000.jpg)\n\
  \n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\n这三个方法的原型原型是：\n\n```javascript\n\
  window.alert( message );\nwindow.confirm( message );\nwindow.prompt( message, default_response\
  \ );\n```\n\n`alert()` 在点击“ok”被清除时将始终返回值“true”。\n\n`confirm()` 将根据所选的清除对话框的响应来返回“true”或“false”。\n\
  \n`prompt()` 将返回输入的值，如果未输入任何内容则返回“null”，如果框被取消则返回“false”。\n\n### 项目\n\n打开你之前的项目文件，并将其将其保存为\
  \ `chapter_10.html`。\n\n清除之前的重定向代码，并确保 `script` 标签已返回文档的 head 部分。\n\n在页面上的 `script`\
  \ 中添加一条新语句，以便在显示页面其余部分之前显示以下消息：\nWelcome to my website! Click OK to continue.\n\n\
  在浏览器中检查你的页面。\n\n我们将在整个课程中反复使用 `alert()`、`confirm()` 和 `prompt()`。花一点时间在这个页面上轮流尝试每个方法，每次都停下来检查你的更改。\n\
  \n使用 `document` 对象的 `write()` 方法来检查每个方法的返回值。例如：\n\n```javascript\ndocument.write(alert(“hello\
  \ world”));\n```\n\n确保你将此特定代码段放在页面 body 区域的 `script` 标签中，因为我们正在生成供浏览器渲染的文本输出。此外，注意此处对引号的使用（或不使用）。更多内容请见下一章！\n\
  \n![](img/Image00000.jpg)\n\n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\n##\
  \ 11 变量与运算符\n\n### 关键点\n\n我们已经被引入了对象以及它们的各种属性和方法的概念。这些相互关联的概念允许任何网页被拆分为许多小段信息或数据段，然后可以通过\
  \ JavaScript 访问它们，并在许多情况下对其进行更改。\n\n然而，如果我们想为不一定具有页面对应项的信息创建自己的存储空间该怎么办呢？例如，如果我们想在更改\
  \ `document` 的 `title` 属性之前存储其旧值，以便稍后检索；或者如果我们希望存储页面加载到浏览器的时间，以便在页面的多个处进行复制，而又不想每次都重新计算时间该怎么办？\n\
  \n变量是 JavaScript 中用于存储值的命名容器。它们在许多方面与对象属性相似，但有重要的区别：\n\n- 从实际意义上说，变量没有与之关联的“父”对象。\n\
  - 变量可以由你作为开发者创建（“声明”），并可以在某些规则内赋予任何任意名称——然而，对象的属性受限于父对象的定义。例如，对于我们之前章节中的 `piano`\
  \ 对象来说，有一个 `propeller` 属性是没有意义的！\n\n![](img/Image00000.jpg)\n\n| JavaScript 初学者\
  \ |  |\n|  |  |  |\n|  |  |  |\n\n变量命名规则非常直观——没有空格，名称必须以字母开头。有效变量名的示例有：`BrowserName`、`page_name`、`Message1`、`MESSAGE1`。\n\
  \n在许多浏览器中，JavaScript 是大小敏感的，这意味着最后两个变量是不同的。为你的变量选择一种特定的风格并坚持下去是一个好主意。\n\n在最简单的层面上，变量可以存储三种类型：\n\
  - 数字：例如，`3.14`\n- 字符串：例如， `\"Hello World\"`\n- 布尔值：例如，`true`、`false`\n\n注意字符串可以包含数字，但以下变量是不等价的：`123`\
  \ 和 `\"123\"`。后者是一个字符串。考虑：\n\n```javascript\na = 123\nb = 456\na + b // 579\n\"\
  a\" + \"b\" // \"ab\" (如果是字符串)\n```\n\n一些开发者在变量名上使用自己的命名约定来表示变量中预期的值类型。例如，`strMessage`\
  \ 可能表示字符串变量，而 `numHits` 可能表示数值。\n\n变量赋值的实现方式与对象属性相同。当变量第一次被赋值时，它会被自动创建。这与其它编程语言不同，在那些语言中，必须先显式创建变量，然后加载值。\n\
  \n以下是变量赋值的一些示例：\n\n```javascript\nnumBrowserVersion = 5.5;\nnumTotal += 33;\nMessage\
  \ = “Hello!”;\nMessage = “Goodbye”;\nMessage = 3;\n```\n\n注意最后三个示例显示变量可以在初始赋值后被更改，而且变量中存储的值类型也可以以类似的方式更改。一旦创建了变量并存储了值，我们希望能够访问它并可能对其进行操作。与对象属性类似，我们通过直接调用变量来访问它们：\n\
  \n```javascript\nMessage = “Hello!”;\nalert(Message);\n```\n\n注意我们没有在变量名周围使用引号。上面的代码与此不同：\n\
  \n```javascript\nalert(“Message”);\n```\n\n出于显而易见的原因。\n\n除了使用变量存储和访问，我们还可以使用运算符组合并处理它们。例如：\n\
  \n```javascript\na = 12;\nb = 13;\nc = a + b // c 现在是 25\nc += a // c 现在是 37\nc\
  \ = b + “ Hello!” // c 现在是 “13 Hello!”\n```\n\n\n\n\n我们的上一个例子可能出乎了意料——我们向一个字符串添加了一个数字，结果得到一个字符串。JavaScript\
  \ 足够智能，能够意识到数字无法在数值意义上“加”到字符串上，因此它会将数字临时转换为字符串，并对这两个字符串进行拼接。请注意 `b` 仍然是 `13`，而不是“11”。\n\
  \n运算符表：\n\n| 运算符 | 功能 |\n| :--- | :--- |\n| `x + y` | 如果两者均为数值，则将 `x` 加到 `y`；否则执行拼接\
  \ |\n| `x – y` | 如果两者均为数值，则从 `y` 中减去 `x` |\n| `x * y` | 将 `x` 与 `y` 相乘 |\n| `x /\
  \ y` | 将 `x` 除以 `y` |\n| `x % y` | 将 `x` 除以 `y` 并返回余数 |\n| `-x` | 反转 `x` 的符号 |\n\
  | `x++` | 在执行任何关联赋值**之后**给 `x` 加 1 |\n| `++x` | 在执行任何关联赋值**之前**给 `x` 加 1 |\n| `x--`\
  \ | 在执行任何关联赋值**之后**给 `x` 减 1 |\n| `--x` | 在执行任何关联赋值**之前**给 `x` 减 1 |\n\n### 项目\n\
