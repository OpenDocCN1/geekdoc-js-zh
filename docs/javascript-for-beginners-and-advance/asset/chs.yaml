  | | | |\n\n## 32 表单方法与事件处理器\n\n### 关键点\n\n每个表单对象（例如文本、按钮等）都有一组与其相关的属性。每个表单元素的情况都是不同的。`value`\
  \ 属性是大多数表单元素共有的，是最用的属性之一。\n\n你可以通过如下方式将包含在 `id=Enquiry` 表单中的名为 `Name` 的文本框的数据赋值给变量：\n\
  \n`variable = document.getElementById('Enquiry');`\n`Name.value`\n\n表单对象还有与其相关的方法。每个表单对象的可用方法集是不同的。\n\
  \n以下是文本对象的常用方法列表：\n\n| 方法 | 描述 |\n|---|---|\n| `blur()` | 移除文本框的焦点 |\n| `focus()`\
  \ | 给文本框赋予焦点 |\n| `select()` | 选中文本框 |\n\n以下是按钮对象的常用方法列表：\n\n| | 方法 | 描述 |\n|---|---|---|\n\
  | | `blur()` | 移除按钮的焦点 |\n| | `focus()` | 给按钮赋予焦点 |\n| | `click()` | 调用按钮的 `onclick`\
  \ 事件处理器 |\n\n| JavaScript 初学者 | |\n| | |\n\n表单对象还有与其相关的事件处理器。每个表单对象的可用事件处理器集是不同的。\n\
  \n以下是文本对象的常用事件处理器列表：\n\n| 事件处理器 | 当……时运行 JavaScript 代码 |\n|---|---|\n| `onblur`\
  \ | 文本框失去焦点。 |\n| `onfocus` | 文本框获得焦点。 |\n| `onselect` | 用户选择了文本框内的某些文本。 |\n| `onchange`\
  \ | 文本框失去焦点且文本被修改过。 |\n\n以下是按钮对象的常用事件处理器列表：\n\n| 事件处理器 | 当……时运行 JavaScript 代码 |\n\
  |---|---|\n| `onBlur` | 按钮失去焦点 |\n| `onFocus` | 按钮获得焦点 |\n| `onClick` | 用户点击了按钮\
  \ |\n\n最后，如果你正在向服务器发送数据，提交按钮并不是唯一的方法。你可以在由事件处理器调用的函数中使用 `submit()` 方法。它的运行方式就好像点击了提交按钮一样：\n\
  \n```javascript\ndocument.getElementById('Enquiry').submit();\n```\n\n### 项目\n\n\
