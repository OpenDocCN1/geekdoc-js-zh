  \ != \"\"\n{\n    alert(\"The following errors were found:\\n\" + error);\n    return\
  \ false;\n}\nelse\n{\n    return true;\n}\n```\n\n37 处理日期\n\n### 关键点\n\n`Date` 对象存储了从年份到毫秒的所有日期方面。要使用新日期，你必须创建它并将其赋值给对象变量。以下代码创建一个新对象，存储当前日期和时间并赋值给变量\
  \ `dtNow`：\n\n```javascript\ndtNow = new Date();\n```\n\n在创建日期对象时，你可以指定自己的参数：\n\n\
  ```javascript\ntheDate = new Date(year, month, day, hours, minutes, seconds, mseconds);\n\
  ```\n\n前三个参数是强制性的，其余的是可选的。注意月份由数字 0 到 11 表示（1 月到 12 月）。日期由 1 到 31 表示，小时为 0 到 23，分钟和秒为\
  \ 0 到 59，毫秒为 0 到 999。\n\n以下代码将 2004 年 7 月 17 日晚上 9:15:30 存储在变量 `theDate` 中：\n\n\
  ```javascript\ntheDate = new Date(2004,6,17,21,15,30,0);\n```\n\n`theDate = new\
  \ Date(2004,6,17)` Gives 上述日期的午夜。\n\n可以通过以下方式使用字符串为变量赋值日期：\n\n```javascript\ntheDate\
  \ = new Date(\"Sun, 10 Oct 2000 21:15:00 – 0500\");\n```\n\n从小时开始之后都是可选的，在实际操作中日期也是可选的。例如：\n\
  \n```javascript\ntheDate = new Date(\"10 Oct 2000\");\n```\n\n是一个有效的日期。\n\n\n\n\n\
