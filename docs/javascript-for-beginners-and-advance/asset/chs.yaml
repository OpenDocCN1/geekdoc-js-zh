  \ 点击正方形和圆形。在页面上查看它们点击了多少次。在控制台中查看 `click()` 函数中的 `this`。在 `click()` 内部，`this` 被设置为正方形或圆形，取决于我们点击哪个元素。如果设置为正方形，我们引用了正形的\
  \ `numClicks` 属性和 `name` 属性。对圆形也是同样的操作。\n\n`call()` 是 `click()` 函数的一个方法。正如之前所说的，函数像任何对象一样具有属性和方法。每当你定义一个函数（如\
  \ `click()`），你实际上是在使用 `Function` 构造函数创建一个 `Function` 对象的实例（JavaScript 在后台为你完成）。记住，对象可以从它的原型继承方法和属性。在这种情况下，函数的原型中包含了\
  \ `call()` 方法。你可以自己检查（此会话假设你加载了 `this.html` 文件）：\n\n![](img/Image00124.jpg) 交互会话：\n\
  \n```javascript\nclick() {\n  console.log(\"This in click function: \");\n  console.log(this);\n\
  \  this.numClicks++;\n  document.getElementById(\"counter_\" + this.id).innerHTML\
  \ =\n  \"You've clicked \" + this.numClicks + \" times on \" + this.name;\n}\n\n\
  click.call\n\nfunction call() { [native code] }\n```\n首先，我们通过输入函数名称来显示函数 `click()`。然后我们请求查看\
  \ `click()` 函数的 `call` 属性，它是从其 `Function` 原型继承的，并且由浏览器原生实现（因此你无法看到细节）。\n\n## call()\
  \ 和 apply()\n\n\n\n\n\n`call()` 和 `apply()` 方法本质上执行相同的操作，但你使用的方式略有不同。这两个方法的第一个参数都是你想要用来替代\
  \ `this` 的对象。如果你调用的函数接收参数，那么你也将把这些参数分别传递给 `call()` 和 `apply()`。对于 `call()`，你将这些参数作为参数列表传递（就像你通常传递参数那样），而对于\
  \ `apply()`，你将所有参数放在一个数组中传递。\n\n所以，要使用 `call()`，你可以这样写：\n\n![](img/Image00120.jpg)\
  \ 观察：\n\n```javascript\nfunction myFunction( param1, param2, param3 ) {\n\n...\n\
  }\n\nvar anObject = { x: 1 };\n\nmyFunction .call( anObject , 1, 2, 3 );\n```\n\n\
  ...而要使用 `apply()`，你可以这样写：\n\n![](img/Image00098.jpg)\n\n 观察：\n\n```javascript\n\
  function myFunction( param1, param2, param3 ) {\n\n...\n\n}\n\nvar anObject = {\
  \ x: 1 };\n\nmyFunction .apply( anObject , [ 1, 2, 3 ]);\n```\n\n在这两个示例中，对象 `anObject`\
  \ 被定义为函数 `myFunction()` 中 `this` 的值，参数 `1, 2, 3` 被传递给 `myFunction()`，并存储在参数 `param1`、`param2`\
  \ 和 `param3` 中。\n\n正如我们在使用 `call()` 调用 `click()` 函数的示例所示，参数是可选的——如果你的函数不需要参数，你就不需要提供任何参数。\n\
  \n你可以在自己的函数上使用 `call()` 和 `apply()`，也可以用于 JavaScript 的内置函数。例如，假设你有一个数字数组，你想找到数组中的最大数字。有一个方便的\
  \ `Math.max()` 方法可用，但它不接受数组，它接受的是数字列表：\n\n![](img/Image0059.jpg) 交互式演示：\n\n```javascript\n\
  var myArray = [1, 2, 3];\nMath.max(myArray) // undefined\nMath.max(1, 2, 3) // 3\n\
  ```\n\n然而，我们可以使用 `apply()` 来解决这个问题，如下所示：\n\n![](img/Image0067.jpg) 交互式演示：\n\n```javascript\n\
  Math.max.apply(null, myArray) // 3\n```\n\n注意，我们传递 `null` 作为 `this` 的值（因为我们不需要任何对象来代替\
  \ `this`），并且因为我们使用了 `apply()`，数组中的值被作为参数列表传递到 `Math.max()` 方法中。\n\n### 函数参数\n\n\
  当你调用函数时，你将参数传递给函数的参数。当参数的数量与参数的数量相等时，每个参数都会获得来自函数的一个对应参数。那么，如果参数的数量与参数的数量不匹配会发生什么？\n\
  \n假设你想编写自己的 `max()` 函数（类似于 `Math.max()`）。你会如何做？嗯，你可以从简单的开始：\n\n![](img/Image0191.jpg)\
  \ 输入代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title> max </title>\n<meta\
  \ charset=\"utf-8\">\n<script>\nfunction max(n1, n2) {\nif (n1 > n2) {\nreturn n1;\n\
  } else {\nreturn n2;\n}\n}\nconsole.log(max(99, 101)); // 101\n</script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n将此保存在你的 `/JS` 文件夹中并为 `max.html`，然后 ![](img/Image0042.jpg)。在控制台中，你看到\
  \ `101`。参数 `99` 确实传递给了函数，但由于我们没有为它提供参数名称也没有使用它，因此它没有包含在最大值的计算中。\n\n如果你传递的参数太少，那么预期参数的参数值为\
  \ `undefined`。让我们看看如果只给 `max()` 函数传递一个参数会发生什么：\n\n![](img/Image0020.jpg) 输入代码：\n\
  \n```javascript\nfunction max(n1, n2) {\nconsole.log(\"n2 is \" + n2);\nif (n1 >\
  \ n2) {\nreturn n1;\n} else {\nreturn n2;\n}\n}\nconsole.log(max(99)); // n2 is\
  \ undefined\n```\n\n![](img/Image0042.jpg) 和 ![](img/Image0021.jpg)。在控制台中，你看到 \"\
  n2 is undefined.\"。我们希望编写 `max()` 函数，使其能够接收任意数量的参数（类似于 `Math.max()`），并找到最大值。为了实现这一点，我们可以使用\
  \ `arguments` 对象。该对象包含了传递给函数的所有参数。让我们重写 `max()` 函数来使用它：\n\n![](img/Image0192.jpg)\
  \ 输入代码：\n\n```javascript\nfunction max(n1, n2) {\nconsole.log(\"n2 is \" + n2);\n\
  if (n1 > n2) {\nreturn n1;\n} else {\nreturn n2;\n}\nvar max = Number.NEGATIVE_INFINITY;\n\
  for (var i = 0; i < arguments.length; i++) {\nif (arguments[i] > max) {\nmax = arguments[i];\n\
  }\n}\nreturn max;\n}\nconsole.log(max(99, -55, 101, 22)); // 103\n```\n\n![](img/Image0087.jpg)\
  \ 和 ![](img/Image0036.jpg)。你在控制台中看到结果 `103`。首先注意，我们的 `max()` 函数不再指定任何参数。这是因为我们将通过\
  \ `arguments` 对象访问所有参数。\n\n`arguments` 对象是一个类数组对象；你可以对其进行迭代，并且它有一个 `length` 属性，因此我们可以像使用数组一样遍历所有参数并找到最大值。为了这样做，我们将变量\
  \ `max` 初始化为负无穷，然后检查每个参数看它是否大于 `max`。每当一个参数大于 `max` 时，我们就更新 `max` 的值，因此最终结果就是传递给对象的所有参数中的最大值。\n\
  \n### 调用函数的四种方式\n\n你已经见过调用函数的四种方式：\n1. 作为函数 ![](img/Image0006.jpg)\n2. 作为方法 ![](img/Image0006.jpg)\n\
  3. 作为构造函数 ![](img/Image0006.jpg)\n4. 使用 `apply()` 或 `call()` ![](img/Image0006.jpg)\n\
  \n你可能会经常使用前三种，但在某些情况下第四种（使用 `apply()` 或 `call()`）也会有用。通常情况下，`this` 关键字绑定到包含函数的对象。对于全局函数，它是全局\
  \ `window` 对象；对于构造函数，它是被构造的对象；对于方法，它是包含该方法的对象。\n\n这个规则的三个大例外是：当你在像 \"click\" 这样的事件处理函数中时；当你显式使用\
  \ `call()` 或 `apply()` 修改了 `this` 的值时；以及当你处于嵌套函数中时。记住这 在三种情况下的行为，以免产生困扰（更不用说，掌握这一点是应对那些\
  \ JavaScript 面试问题的佳方法！）。\n\n在本节中，你学习了在 JavaScript 中调用函数的四种方式以及每种情况下 `this` 的情况。在进入下一节之前，花些时间练习调用函数，在下一节中我们将查看调用模式：使用某些有趣方式调用函数的代码设计。\n\
  \n### 调用模式\n\n![](img/Image0005.jpg)\n\n### 学习目标\n\n当你完成本节后，你将能够：\n- 递归调用函数 ![](img/Image0006.jpg)\n\
  - 创建对象以便链式调用方法 ![](img/Image0006.jpg)\n- 通过链式调用函数 ![](img/Image0006.jpg)\n- 创建静态方法\
  \ ![](img/Image0006.jpg)\n- 区分静态方法和实例方法 ![](img/Image0005.jpg) ![](img/Image0006.jpg)\n\
  \n\n\n\n\n```javascript\nthis.display = function() {\n  var el = document.createElement(\"\
  div\");\n  el.setAttribute(\"id\", this.id);\n  el.setAttribute(\"class\", \"square\"\
  );\n  el.style.width = this.size + \"px\";\n  el.style.height = this.size + \"px\"\
  ;\n  el.innerHTML = \"<p>\" + this.id + \"</p>\";\n  console.log(this.id + \" has\
  \ size \" + this.size + \", and is a \" + this.constructor.name);\n  document.getElementById(\"\
  squares\").appendChild(el);\n};\n}\n\nfunction createSquares(n) {\n  var size =\
  \ 10;\n  if (n == 0) {\n    return;\n  }\n  while (n >= 1) {\n    var s = new Square((\"\
  s\" + n), n * size);\n    s.display();\n    n--;\n  }\n}\n\nwindow.onload = function()\
  \ {\n  createSquares(7);\n};\n```\n\n将此文件保存在你的 `/AdvJS` 文件夹中，命名为 `recursion.html`，你会看到七个尺寸逐渐减小的正方形。（最小的正方形的名称无法正常放入\
  \ `<div>` 中；暂不用担心这个）。\n\n来看这段代码：\n\n```javascript\nfunction createSquares( n ) {\n\
  \  var size = 10;\n  if ( n == 0) {\n    return;\n  }\n  while ( n >= 1) {\n   \
  \ var s = new Square((\"s\" + n ), n * size);\n    s.display();\n    n--;\n  }\n\
  }\n```\n\n我们使用函数 `createSquares()` 来创建指定数量的正方形。在 `Square()` 构造函数中，通过调用其循环来显示生成的正方形对象，我们调用了\
  \ `display()` 方法。`display()` 方法创建一个代表正方形的新 `<div>` 对象，并将其添加到页面中 ID 为 `\"squares\"\
  ` 的 `<div>` 中。\n\n为了创建正确数量的正方形，我们使用 `while` 循环来迭代传入 `createSquares()` 的数字 `n`。我们还使用\
  \ `n` 来计算要添加到页面的正方形尺寸（使用 `n * size`，其中 `size` 为 10），并将其作为每个正方形名称的一部分（例如，`s3`）。\n\
  \n我们可以通过将 `while` 循环替换为对函数 `createSquares()` 的调用来重写这个函数：\n\n```javascript\nfunction\
  \ createSquares(n) {\n  var size = 10;\n  if (n == 0) {\n    return;\n  }\n  while\
  \ (n >= 1) {\n    var s = new Square((\"s\" + n), n * size);\n    s.display();\n\
  \    n--;\n  }\n  var s = new Square((\"s\" + n), n * size);\n  s.display();\n \
  \ createSquares(n-1);\n}\n```\n\n你看到了同样的七个尺寸递减的正方形。让我们比较一下递归版本和迭代版本，看看它是如何运作的：\n\
  \n```javascript\nwhile ( n >= 1) {\n  var s = new Square((\"s\" + n ), n * size);\n\
  \  s.display();\n  n--;\n}\n```\n\n在这里，它遍历 `n` 的所有值，直到 `n` 等于 1。当我们把 7 传递给函数 `createSquares()`\
  \ 时，在第一次迭代中，`n` 是 7，我们得到一个尺寸为 70 的正方形（使用 `n * size`，即 `7 * 10`），然后将 `n` 减一，并继续循环直到\
  \ `n` 为 1。\n\n```javascript\nvar s = new Square((\"s\" + n ), n * size);\ns.display();\n\
  createSquares( n -1);\n```\n\n递归版本本质上做的是相同的事情，只是每次想要较小尺寸的正方形时都调用 `createSquares()`。第一次调用\
  \ `createSquares()` 时，`n` 是 7，所以我们创建并显示了一个尺寸为 70 的正方形。然后我们再次调用 `createSquares()`，但我们将\
  \ `n - 1` 作为参数传递给函数。所以在这次对 `createSquares()` 的调用中，`n` 是 6。我们创建并显示了一个尺寸为 60 的正方形，再次带参数\
  \ 5 调用 `createSquares()`，以此类推。\n\n当 `n` 为 1 时，我们执行创建并显示尺寸为 10 的正方形的代码。然后我们调用 `createSquares()`\
  \ 并值 0 传递给 `n`。现在，我们没有执行创建尺寸为 0 的正方形的代码，而是检查发现 `n` 为 0 并返回：\n\n```javascript\nif\
  \ (n == 0) {\n  return;\n}\n```\n\n这个 `if` 语句被称为**基准情况（base case）**，它极其重要，因为如果没有它，递归将无限持续——试一下。注释掉\
  \ `if` 块。这和迭代一样：必须提供一个条件测试来告诉迭代何时停止。在递归中，基准情况告诉递归何时停止。我们希望递归在 `n` 为 0 时停止。因此在这种情况下，我们不再再次调用\
  \ `createSquares()`，这导致递归停止。\n\n这两个版本的 `createSquares()` 结果完全相同，但第一个使用迭代，第二个使用递归。再次，递归始终可以被迭代替换。\n\
  \n### 为什么要使用递归？\n\n某些算法天生就是递归的。例如，计算数字 `n` 阶乘的算法就是递归的。要计算一个数字（例如 5）的阶乘，我们将 5 乘以该数字减\
  \ 1 的阶乘：\n\n- 5 的阶乘是 5 * 4 的阶乘。\n- 4 的阶乘是 4 * 3 的阶乘。\n- 3 的阶乘是 3 * 2 的阶乘。\n- 2 的阶乘是\
  \ 2 * 1 的阶乘。\n- 1 的阶乘是 1。\n\n所以，5 的阶乘是 5 * 4 * 3 * 2 * 1，结果为 120。用伪代码写出来，你可以看到阶乘：\n\
  \n```\nfactorial(5) = 5 * factorial(4)\nfactorial(4) = 4 * factorial(3)\nfactorial(3)\
  \ = 3 * factorial(2)\nfactorial(2) = 2 * factorial(1)\nfactorial(1) = 1\n```\n\n\
  你可能想要创建函数的许多算法天生是递归的。这些天生的递归函数用递归方式表示通常比用迭代（使用循环）表示更容易阅读。\n\n然而，递归也有缺点。每当你调用一次函数，都会将该函数添加到调用栈中；这会占用内存。迭代也会占用内存，但通常没有像调用栈上的一堆函数那么多内存。要查看由递归调用创建的调用栈，我们可以使用\
  \ Chrome 浏览器工具，并在 `createSquares()` 中递归调用 `createSquares()` 的那行代码添加断点。\n\n然后重新加载页面，在每次递归调用\
  \ `createSquares()` 时执行都会停止。在每次点击“恢复（Resume）”按钮时查看作用域变量；`n` 的值每次减一。最终，`n` 达到 0，递归停止，代码完成。这种发生是因为我们在上一次\
  \ `createSquares()` 调用完成之前，就在 `createSquares()` 内部调用了 `createSquares()`。对比，假设你有一个函数\
  \ `add()`（它不是递归的），你调用了它三次：\n\n```javascript\nfunction add(num1, num2) {\n  return\
  \ num1 + num2;\n}\n\nadd(1, 2);\nadd(2, 3);\nadd(3, 4);\n```\n\n\n\n\n`add()` 函数会在调用栈上进入三次。然而，在任何时刻，调用栈上都只有一次\
  \ `add()` 的调用，这是因为每次 `add()` 的调用都会在下一次调用开始之前结束，所以调用栈的大小永远不会超过一个函数。\n\n现在再次想一下 `createSquares()`。我们在上一次对\
  \ `createSquares()` 的调用完成之前，就再次调用了 `createSquares()`。因此，我们调用了 `createSquares(7)`，在该函数调用仍在栈上时，我们又调用了\
  \ `createSquares(6)`。这个函数调用位于 `createSquares(7)` 用的上方，因此栈上有有两个函数调用。然后我们又对 `createSquares(5)`\
  \ 重复此操作，以此类推，直到我们调用 `createSquares(0)` 为止。\n\n当我们调用 `createSquares(0)` 时，`createSquares(0)`\
  \ 被添加到栈的最顶，但 `createSquares(0)` 直接返回了，因此它会立即从栈中弹出。当 `createSquares(0)` 返回后，`createSquares(1)`\
  \ 就可以完成执行并从栈中弹出。一旦完成，`createSquares(2)` 就可以完成执行并从栈中弹出，以此类推，直到最后 `createSquares(7)`\
  \ 完成并从栈中弹出，你就完成了。\n\n这里是每次对 `createSquares()` 进行递归调用时，调用栈是如何构建的。当我们到达基本情况且每个函数调用都可以完成时，这些函数调用就会从栈中移除：\n\
  \n![](img/Image00198.jpg)\n\n当你递归调用一个函数时，在调用栈上创建的这堆函数调用如果你的函数很小（且每个激活对象中没有太多变量），并且函数递归调用的次数（即进入栈的调用次数）较少，那么就不是大问题。但是，如果你的函数很大且包含很多变量和/或函数被递归调用了很多，那么你的代码将占用大量内存。此外，浏览器会限制同时允许在调用栈上的函数数量。\n\
  \n大多数时候，你的函数会有少量的局部变量，因此你调用递归函数的频率不会高到产生问题。现在你知道在在使用递归设计时遇到内存问题应该注意留意些什么了。\n\n###\
  \ 链式调用（仿 jQuery 式）\n\n在 JavaScript 中你会看到的另一种调用模式是方法链式调用（method chaining）。链式调用在某些\
  \ JavaScript 库（如 jQuery）中很常见。这种技术允许你在同一个对象上以链的形式编写多个方法调用。例如，而不是写成：\n\n![](img/Image00033.jpg)\n\
  \n观察：\n\n```\nobj.method1();\nobj.method2();\nobj.method3();\n```\n\n...你可以写成：\n\
  \n![](img/Image00199.jpg) 观察：\n\n```\nobj.method1().method2().method3();\n```\n\n\
  为了让链式调用生效，每个方法都必须返回一个对象，以便可以在该对象上调用下一个方法。在上面的示例中，如果 `obj.method1()` 返回 `obj`，那么该对象就会立即用于调用\
  \ `obj.method2()`。\n\n让我们来看一个具体的例子。我们将使用之前相同的 Squares 示例，并对其进行一些修改。将 `recursion.html`\
  \ 保存到你 `/JS` 文件夹中的新文件中并命名为 `chaining.html`，并进行这些更改：\n\n![](img/Image0200.jpg) 需要输入的代码：\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n  <title>Chaining</title>\n  <meta charset=\"\
  utf-8\">\n  <style>\n    .square {\n      background-color: lightblue;\n      cursor:\
  \ pointer;\n    }\n    .square p {\n      padding-top: 5%;\n      text-align: center;\n\
  \    }\n    -webkit-user-select: none;\n    -moz-user-select: none;\n    -ms-user-select:\
  \ none;\n    user-select: none;\n  </style>\n  <script>\n    function Square(id,\
  \ size) {\n      this.id = id;\n      this.size = size;\n      this.el = null;\n\
  \      this.bigger = function(size) {\n        if (this.el) {\n          this.size\
  \ += size;\n          this.el.style.width = this.size + \"px\";\n          this.el.style.height\
  \ = this.size + \"px\";\n        }\n        return this;\n      };\n      this.color\
  \ = function(color) {\n        if (this.el) {\n          this.el.style.backgroundColor\
  \ = color;\n        }\n        return this;\n      };\n      this.display = function()\
  \ {\n        this.el = document.createElement(\"div\");\n        this.el.setAttribute(\"\
  id\", this.id);\n        this.el.setAttribute(\"class\", \"square\");\n        this.el.style.width\
  \ = this.size + \"px\";\n        this.el.style.height = this.size + \"px\";\n  \
  \      this.el.innerHTML = \"<p>\" + this.id + \"</p>\";\n        console.log(this.id\
  \ + \" has size \" + this.size + \", is a \" + this.constructor.name);\n       \
  \ document.getElementById(\"squares\").appendChild(this.el);\n        return this;\n\
  \      };\n    }\n\n    function createSquares(n) {\n      var size = 10;\n    \
  \  if (n == 0) {\n        return;\n      }\n      var s = new Square(\"s\" + n,\
  \ size);\n      s.display();\n      createSquares(n - 1);\n    }\n\n    window.onload\
  \ = function() {\n      createSquares(7);\n      var mySquare = new Square(\"mySquare\"\
  , 100);\n      mySquare.display().color(\"green\");\n      mySquare.el.onclick =\
  \ function() {\n        mySquare.bigger(50).color(\"red\");\n      };\n    };\n\
  \  </script>\n</head>\n<body>\n  <div id=\"squares\"></div>\n</body>\n</html>\n\
  ```\n\n![](img/Image0087.jpg) 保存并 ![](img/Image0036.jpg)。你会看到一个名为 \"mySquare\" 的绿色正方形。点击这个正方形。正方形变大并变红。每次点击正方形它都会变大。\n\
  \n在我们的代码中，我们对 `display()` 方法进行了修改：现在该方法将为正方形创建的 `div`元素存储在 `Square` 对象的属性 `el` 中。现在我们可以在新增的两个方法\
  \ `bigger()` 和 `color()` 中使用该 `div` 。`bigger()` 接收一个值并将其正方形的大小，然后修改 `div` 的样式以改变大小（这会让正方形看起来变大了）。同样，`color()`\
  \ 接收一个颜色字符串（如 \"blue\"、green\" 或 \"red\"），并修改 `div` 的样式将背景更改为该颜色。\n\n我们还在每个方法中都添加了一行返回\
  \ `this`。例如：\n\n![](img/Image0095.jpg) 观察：\n\n```javascript\nthis.color = function(color)\
  \ {\n  if (this.el) {\n    this.el.style.backgroundColor = color;\n  }\n  return\
  \ this;\n};\n```\n\n`Square` 的三个方法中的每一个现在都返回 `this`，所以当我们调用 `mySquare.display()`\
  \ 时，我们返回的是 `mySquare`。这意味着我们可以立即在返回的对象上调用其他方法之一，比如 `color()` 或 `bigger()`。我们可以将这些方法链起来！\n\
  \n事实上，这正是我们在创建 `mySquare` 之后在代码中所做的：\n\n![](img/Image0104.jpg) 观察：\n\n```javascript\n\
  mySquare.display().color(\"green\");\nmySquare.el.onclick = function() {\n  mySquare.bigger(50).color(\"\
  red\");\n};\n```\n\n### 静态方法与实例方法\n\n我们在本节中看到的最后一种调用模式是调用静态方法，以及静态方法与实例方法之间的区别。\n\
  \n让我们开始探索 `Date()` 构造函数。你可以使用 `Date()` 创建新的日期对象，如下：\n\n![](img/Image00061.jpg)\n\
  \n交互会话：\n\n```javascript\nvar nowDate = new Date() undefined\nnowDate.toString()\n\
  nowDate.getMonth() 8\nnowDate.getTime() 1378401459465\n```\n\n\n\n在这里，我们通过调用 `Date()`\
  \ 构造函数创建了一个新的日期对象 `nowDate`。如果你不向构造函数传递任何参数，该函数将创建一个表示当前日期和时间的对象，因此结果是一个表示“此时此刻”的日期对象，它（在编写本课程时）是\
  \ 2013 年 9 月 5 日星期四上午 10:17 的日期对象。\n\n日期对象 `nowDate` 具有各种方法和属性，你可以像使用任何其他对象一样使用它们。例如，你可以使用\
  \ `nowDate.toString()` 方法获取一个表示当前日期和时间的字符串，并使用 `nowDate.getMonth()` 获取月份（注意，返回的数值来自一个索引从\
  \ 0 开始的数组，因此 9 月用数字 8 表示）。你可以使用 `getTime()` 方法获取代表日期和时间的数字。\n\n现在尝试一下：\n\n![](img/Image00060.jpg)\n\
  \n交互会话：\n\n```javascript\nvar time = Date.now() undefined\ntime\n1378401746077\n\
  ```\n\n我们在 `Date` 对象上调用了方法 `now()`。`Date` 和 `Date()` 是同一个对象：它们都是 `Date()` 构造函数。记住，函数也是对象——而对象确实可以拥有属性。\n\
  \n`now()` 方法是 `Date()` 函数对象的一个方法。\n\n注意，结果 `time` 是一个包含当前时间数字的变量。但它与变量 `nowDate`\
  \ 不同。`nowDate` 是 `Date` 对象，而 `time` 仅仅是一个数字：\n\n![](img/Image00060.jpg)\n\n交互会话：\n\
  \n```javascript\nnowDate instanceof Date true\ntime instanceof Date false\n```\n\
  \n你可以使用 `time` 来创建一个 `Date` 对象，如下所示：\n\n![](img/Image00059.jpg)\n\n交互会话：\n\n```javascript\n\
  var anotherDate = new Date(time); undefined\nanotherDate\nanotherDate.getTime()\n\
  1378401746077\n```\n\n一旦你拥有了 `anotherDate` 对象，你就可以使用 `getTime()` 方法获取代表日期和时间的数字（它与我们最初用于创建对象时使用的变量\
  \ `time` 中的数字相同）。\n\n那么，使用构造函数创建日期对象后在该日期对象上调用方法，与直接在函数对象本身上调用方法之间有什么区别？另外，你到底是如何直接向函数添加方法的呢？\n\
  \n我们将通过在本课程中一直在使用的 `Square()` 构造函数上添加一个方法来回答这些问题。按所示修改 `chaining.html` 中的 JavaScript\
  \ 代码：\n\n![](img/Image00202.jpg)\n\n需要输入的代码：\n\n```javascript\nfunction Square(id,\
  \ size) {\n  this.id = id;\n  this.size = size;\n  this.el = null;\n  this.bigger\
  \ = function(size) {\n    if (this.el) {\n      this.size += size;\n      this.el.style.width\
  \ = this.size + \"px\";\n      this.el.style.height = this.size + \"px\";\n    \
  \  return this;\n    }\n  };\n  this.color = function(color) {\n    if (this.el)\
  \ {\n      this.el.style.backgroundColor = color;\n      return this;\n    }\n \
  \ };\n  this.display = function() {\n    this.el = document.createElement(\"div\"\
  );\n    this.el.setAttribute(\"id\", this.id);\n    this.el.setAttribute(\"class\"\
  , \"square\");\n    this.el.style.width = this.size + \"px\";\n    this.el.style.height\
  \ = this.size + \"px\";\n    this.el.innerHTML = \"<p>\" + this.id + \"</p>\";\n\
  \    console.log(this.id + \" has size \" + this.size + \", and is a \" + this.constructor.name);\n\
  \    document.getElementById(\"squares\").appendChild(this.el);\n    return this;\n\
  \  };\n}\n\nSquare.info = function() {\n  return \"Square is a constructor for making\
  \ square objects with an id and size.\";\n};\n\nwindow.onload = function() {\n \
  \ var mySquare = new Square(\"mySquare\", 100);\n  mySquare.display().color(\"green\"\
  );\n  mySquare.el.onclick = function() {\n    mySquare.bigger(50).color(\"red\"\
  );\n  };\n  var info = Square.info();\n  console.log(info);\n};\n```\n\n![](img/Image00042.jpg)\
  \ 和 ![](img/Image00021.jpg)。在控制台中，显示了消息：“Square is a constructor for making square\
  \ objects with an id and size.”\n\n我们在这里正在处理两种不同的对象。首先，我们使用 `Square()` 构造函数通过调用\
  \ `new Square()` 来创建新对象：\n\n![](img/Image00076.jpg)\n\n观察：\n\n```javascript\nvar\
  \ mySquare = new Square(\"mySquare\", 100);\n```\n\n在这种情况下，对象 `mySquare` 被称为 `Square`\
  \ 的实例：它是由构造函数创建的对象，拥有我们在构造函数中通过 `this.PROPERTYNAME = SOME VALUE` 指定的属性和方法。像 `bigger()`、`color()`\
  \ 和 `display()` 这样的方法是*实例方法*，因为它们是通过使用 `new` 调用 `Square()` 创建的对象实例的方法。\n\n我们正在处理的另一个对象是...\n\
  \n\n\n\n...这没有意义。在没有创建特定实例之前，`Date` 不代表任何特定的日期。然而，`Date` 对象可以拥有实用的属性和方法，它们与你正在创建的特定日期无关。`now()`\
  \ 方法就是这些实用用方法之一：它生成一个表示“此时”日期时间的数字。不需要创建一个新的日期对象实例来获取该数字。\n\n同样，`Square.info()`\
  \ 方法提供了关于 `Square` 构造函数的信息，这些信息与 `square` 的任何特定实例无关。同时，像 `color()` 和 `display()`\
  \ 这样的方法对于 `square` 的特定实例有效，即具有大小并关联了分配颜色的元素的实例。\n\n所以，从某种意义上说，调用静态方法和实例方法是一样的。静态方法是在定义它的对象（构造函数）上调用的，而实例方法也是在定义它的对象（通过调用构造函数创建的实例对象）上调用的。技巧在于追踪哪个对象是谁。\n\
  \n此外，我们不仅使用“静态”和“实例”来描述方法，还可以使用这些术语来描述对象的其他属性。在我们的 Squares 示例中，我们说 `size` 属性是 `square`\
  \ 对象的实例变量。你可以向 `Square()` 构造函数添加一个静态变量，例如 `recommendedSize`，如下：\n\n![](img/Image00199.jpg)\
  \ 观察：\n\n```\nSquare.recommendedSize = 100;\n```\n\n要从 `info()` 方法访问该变量，你需要写道：\n\
  \n![](img/Image00095.jpg) 观察：\n\n```javascript\nSquare.info = function() {\n  return\
  \ \"Square is a constructor for making square objects with an id and size. \" +\n\
  \  \"The recommended size for a square is \" + Square.recommendedSize + \".\";\n\
  };\n```\n\n在本节中，我们讨论了三种在 JavaScript 中经常使用的调用模式：递归、链式调用和静态方法。当然，还有其他调用模式，在你继续学习 JavaScript\
  \ 并获得更多经验时可能会遇到。在接后的课程中，我们将探索模块模式，但现在先完成测试和项目，然后休息一下。继续吧！\n\n# 封装与 API\n\n![](img/Image00005.jpg)\n\
  \n### 学习目标\n\n完成本节后，你将能够：\n- 在对象中创建私有属性和方法。\n![](img/Image00006.jpg)\n- 创建一个使用对象的公共接口。\n\
  ![](img/Image00005.jpg)\n\n## 封装与 API\n\n面向对象语言中对象的优点之一是封装：能够将对象的属性和行为模块化，并提供一个接口，使得程序的其他部分不需要担心它们是如何实现的。对象只需要工作。想想你在\
  \ JavaScript 中使用的其他对象，如 `JSON`、`Date` 或 `Math`。这些对象都有属性和方法；你不需要担心内部机制。有时你可能想要隐藏属性和方法的内部操作，以免依赖实现。在本节中，我们将学习如何使用对象和函数来封装结构和行为，以及如何使用隐藏技术来保护细节。\n\
  \n## 私有性\n\n在上一节中，我们使用 `Square()` 构造函数创建 square 对象并将它们显示在页面上。在那个示例中，我们创建了一些属性和方法，给一个新的\
  \ square 对象一个 `id`、一个 `size` 以及一个表示该对象的 `<div>` 元素：\n\n![](img/Image00205.jpg) 观察：\n\
  \n```javascript\nfunction Square(id, size) {\n  this.id = id;\n  this.size = size;\n\
  \  this.el = null;\n  this.bigger = function(size) {\n    if (this.el) {\n     \
  \ this.size += size;\n      this.el.style.width = size + \"px\";\n      this.el.style.height\
  \ = size + \"px\";\n      return this;\n    }\n  };\n  this.color = function(color)\
  \ {\n    if (this.el) {\n      this.el.style.backgroundColor = color;\n      return\
  \ this;\n    }\n  };\n  this.display = function() {\n    this.el = document.createElement(\"\
  div\");\n    this.el.setAttribute(\"id\", id);\n    this.el.setAttribute(\"class\"\
  , \"square\");\n    this.el.style.width = size + \"px\";\n    this.el.style.height\
  \ = size + \"px\";\n    this.el.innerHTML = \"<p>\" + this.id + \"</p>\";\n    console.log(this.id\
  \ + \" has size \" + this.size + \", and is a \" + this.constructor.name);\n   \
  \ document.getElementById(\"squares\").appendChild(this.el);\n    return this;\n\
  \  };\n}\n\nwindow.onload = function() {\n  var mySquare = new Square(\"mySquare\"\
  , 100);\n  mySquare.display().color(\"green\");\n  mySquare.el.onclick = function()\
  \ {\n    mySquare.bigger(50).color(\"red\");\n  };\n};\n```\n\nsquare 对象中的所有值都是属性或方法，这意味着我们可以随时更改它们。例如，你可以写：\n\
  \n![](img/Image00076.jpg) 观察：\n\n```javascript\nmySquare.size = 200;\n```\n\n...这会改变\
  \ `mySquare` 对象的 size 属性，但页面上的 square 不会变大。仅仅更改 square 的 size 属性完全不会影响存储 `el` 属性中的\
  \ `<div>` 元素。除非调用 square 的 `bigger()` 方法，否则页面上 `<div>` 的大小不会发生变化。你也可以这样做：\n\n![](img/Image00076.jpg)\
  \ 观察：\n\n```javascript\nmySquare.el = document.createElement(\"p\");\n```\n\n...因为如果代表\
  \ square 的元素没有正确设置（通过调用 `display()` 方法），square 就不会出现在页面上。\n\n现在，你可能不会犯这些错误，但如果你把\
  \ `Square` 代码给一个朋友，而他不完全理解如何正确使用，就会出现各种问题。\n\n所以，开发者喜欢创建保护对象内部机制的对象，并为其他开发者提供一个简单的接口来操作对象。接口是对象的公共视图，隐藏了它的内部机制，但允许使用对象的人与之交互。\n\
  \n例如，我们可能允许有人创建一个 square，但与其控制 square 的显示，不如让 square 私有处理，以便只显示一次（现在你可以调用两次 `display()`）。我们可能希望保护\
  \ `el` 属性以防任何人更改它。我们可能希望在 square 对象内部控制颜色和每次增长的量，并只允许 square 对象的用户来“增长”square。\n\
  \n## 示例\n\n这太抽象了，让我们来看一个示例。我们将修改 Squares 示例，但从新文件从零开始。去创建一个新文件并添加以下代码：\n\n![](img/Image00125.jpg)\
  \ 输入代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title> Squares with API </title>\n\
  <meta charset=\"utf-8\">\n<style>\n.square {\n  background-color: lightblue;\n \
  \ cursor: pointer;\n}\n.square p {\n  padding-top: 35%;\n  text-align: center;\n\
  \  -webkit-user-select: none;\n  -moz-user-select: none;\n  -ms-user-select: none;\n\
  \  user-select: none;\n}\n</style>\n<script>\nfunction Square(size) {\n  var initialSize\
  \ = size;\n  var el = null;\n  var id = getNextId();\n  this.grow = function() {\n\
  \    setBigger(10);\n    setColor(\"red\");\n  };\n  var self = this;\n  display();\n\
  }\nfunction setBigger(growBy) {\n  if (el) {\n    size += growBy;\n    el.style.width\
  \ = size + \"px\";\n    el.style.height = size + \"px\";\n  }\n}\nfunction setColor(color)\
  \ {\n  if (el) {\n    el.style.backgroundColor = color;\n  }\n}\nfunction display()\
  \ {\n  el = document.createElement(\"div\");\n  el.setAttribute(\"id\", id);\n \
  \ el.setAttribute(\"class\", \"square\");\n  el.style.width = size + \"px\";\n \
  \ el.style.height = size + \"px\";\n  el.innerHTML = \"<p>\" + id + \"</p>\";\n\
  \  el.onclick = self.grow;\n  document.getElementById(\"squares\").appendChild(el);\n\
  }\nfunction getNextId() {\n  var squares = document.querySelectorAll(\".square\"\
  );\n  if (squares) {\n    return squares.length;\n  }\n  return 0;\n}\n}\n</script>\n\
  </head>\n<body>\n<div id=\"squares\"></div>\n</body>\n</html>\n```\n\n![](img/Image00206.jpg)\n\
  \nwindow.onload = function() {\n  var square1 = new Square(100);\n  var square2\
  \ = new Square(200);\n};\n```\n\n\n\n\n\n```javascript\nvar growButton = document.getElementById(\"\
  growButton\"); growButton.onclick = function() {\n  square1.grow();\n  square2.grow();\n\
  };\n```\n</script>\n</head>\n<body>\n<form>\n<input type=\"button\" id=\"growButton\"\
  \ value=\"Grow\"> </form>\n<div id=\"squares\"></div>\n</body>\n</html>\n\n![](img/Image00042.jpg)\
  \ 将此文件保存到你的 `/AdvJS` 文件夹中并命名为 `squaresAPI.html`，然后 ![](img/Image00021.jpg)。当你点击一个正方形时，该正方形会增大；当你点击\
  \ Grow 按钮时，两个正方形都会增大。\n\n让我们仔细观察代码。\n\n![](img/Image00207.jpg)\n\n### 观察：\n\n```javascript\n\
  function Square(size) {\n  var initialSize = size;\n  var el = null;\n  var id =\
  \ getNextId();\n  this.grow = function() {\n    setBigger(10);\n    setColor(\"\
  red\");\n  };\n  ...\nwindow.onload = function() {\n    var square1 = new Square(100);\n\
  \    var square2 = new Square(200);\n    var growButton = document.getElementById(\"\
  growButton\"); growButton.onclick = function() {\n      square1.grow();\n      square2.grow();\n\
  \    };\n  };\n};\n```\n\n首先，注意到我们现在 `Square()` 构造函数中只有一个公共属性：一个方法 `grow()`。我们在这里说的“公共”是什么意思？嗯，回想构造函数的工作原理。当你使用\
  \ `new` 调用像 `Square()` 这样的函数时，构造函数创建一个新的对象实例，并包含你在构造函数中使用 `this` 添加的任何属性和方法。在这个示例中，我们只为\
  \ `Square()` 构造函数创建的对象添加了一个属性：`grow()` 方法。因此，结果对象将只包含这一个属性。\n\n那么对象创建后，所有其他内容发生了什么？如果\
  \ `Square()` 构造函数执行完成后就消失了，我们该如何使用 `square` 对象中的变量和函数呢？\n\n这些都是非常棒的问题。我们将在下一节中详细回答。简单的答案是：闭包（closure）。构造函数中的其他一些“内容”在\
  \ `Square()` 完成并返回新正方形对象后仍然是可以访问的，因为它们保存在闭包中。现在不用担心这个；只需将其记在心里，并知道与对象封装的变量和函数在构造函数完成后仍然可用。\n\
  \n### 私有变量\n\n我们之前作为属性时创建的所有值现在都变成了变量：\n\n![](img/Image00123.jpg)\n\n### 观察：\n\n\
  ```javascript\nfunction Square(size) {\n  var initialSize = size;\n  var el = null;\n\
  \  var id = getNextId();\n  ...\n}\n```\n\n这些变量是**私有**的。你不能通过编写这样的代码来访问它们：\n\n![](img/Image00076.jpg)\n\
  \n### 观察：\n\n```javascript\nsquare1.id\n```\n在你创建正方形对象的代码中输入上述内容。试一下。看看尝试访问其中一个变量时会发生什么。\n\
  \n![](img/Image00150.jpg)\n\n**需要输入的代码：** 更新 `squaresAPI.html` 中的代码以添加以下 JavaScript\
  \ 代码……\n\n```javascript\nwindow.onload = function() {\n  var square1 = new Square(100);\n\
  \  var square2 = new Square(200);\n  console.log(square1.id);\n  var growButton\
  \ = document.getElementById(\"growButton\"); growButton.onclick = function() {\n\
  \    square1.grow();\n    square2.grow();\n  };\n};\n```\n\n![](img/Image00042.jpg)\
  \ 和 ![](img/Image00021.jpg) 并检查控制台：\"undefined.\"。`square1` 没有 `id` 属性，所以 `square1.id`\
  \ 的值为 `undefined`。\n\n一旦你测试了这段代码，请删除你添加的那几行。\n\n这些变量现在只能在构造函数内部访问。正方形对象的用户无法访问它们，因此我们说它们是**私有**的。我们使用\
  \ `initialSize` 变量来跟踪正方形的初始大小（我们可以通过 `this.grow()` 改变正方形的大小，所以如果以后需要，我们可能想知道原始大小是多少）。我们将使用\
  \ `el` 变量来持有 `<div>` 元素（一旦我们在 `display()` 函数中创建了它），并使用 `id` 来存储正方形唯一的 id，我们将使用 `getNextId()`\
  \ 生成该 id。\n\n### 私有函数\n\n`Square()` 构造函数不接受 `id`（与上一节的版本不同）；相反，我们根据页面上已有的正方形数量在构造函数中生成\
  \ `id`。我们使用嵌套函数 `getNextId()` 来生成下一个 id。让我们更仔细地检查这个函数：\n\n![](img/Image00208.jpg)\
  \ **观察：**\n\n```javascript\nfunction Square(size) {\n  var initialSize = size;\n\
  \  var el = null;\n  var id = getNextId();\n  ...\n  function getNextId() {\n  \
  \  var squares = document.querySelectorAll(\".square\"); if (squares) {\n      return\
  \ squares.length;\n    }\n    return 0;\n  }\n};\n```\n\n为了将 `id` 变量设置为下一个 id（即不再被任何现有正方形用\
  \ id 的数字），我们调用了 `getNextId()`。该函数首先使用 `document.querySelectorAll()` 从 HTML 页面获取所有类名为\
  \ \"square\" 的元素，这会返回一个元素数组（如果存在的话）。如果我们还没有正方形，数组将为空，长度为 0，下一个 id 应该是 0。同样，如果页面上有一个正方形，那么数组长度为\
  \ 1，下一个 id 应该是 1，依此类推。\n\n再次注意，这个嵌套函数 `getNextId()` 是私有的，只能在构造函数内部访问。创建和使用正方形对象的代码无法访问它。\n\
  \n我们在构造函数运行时，在正方形创建时就设置了它的 `id`，在对象创建后我们完全不需要 `getNextId()` 了。\n\n### 公共方法\n\n到为止，我们看过的变量（`initialSize`、`el`\
  \ 和 `id`）以及函数（`getNextId()`）都是**私有**的。下一个函数 `grow()` 是一个公共方法。这意味着该方法被添加到了构造函数创建的对象中，创建和使用正方形对象的代码可以调用它。\n\
  \n![](img/Image0121.jpg)\n\n**观察：**\n\n```javascript\nfunction Square(size) {\n\
  \  var initialSize = size;\n  var el = null;\n  var id = getNextId();\n  this.grow\
  \ = function() {\n    setBigger(10);\n    setColor(\"red\");\n  };\n  ...\n  function\
  \ getNextId() {\n    var squares = document.querySelectorAll(\".square\"); if (squares)\
  \ {\n      return squares.length;\n    }\n    return 0;\n  }\n}\n```\n\n这个方法是正方形对象的公共接口，暴露给代码的其他部分。一旦正方形被创建，就可以使用它进行交互。为了让正方形变大，调用\
  \ `grow()` 方法。该方法调用了两个私有函数：`setBigger()` 和 `setColor()`。这两个函数都嵌套在构造函数内部，因此 `grow()`\
  \ 方法可以访问它们，但正方形外部的代码无法访问。你不能调用 `square1.setBigger(10)` 让正方形变大；你应该调用 `square1.grow()`。\n\
  \n![](img/Image0209.jpg)\n\n**观察：**\n\n```javascript\nfunction Square(size) {\n\
  \  var initialSize = size;\n  var el = null;\n  var id = getNextId();\n  this.grow\
  \ = function() {\n    setBigger(10);\n    setColor(\"red\");\n  };\n  ...\n  function\
  \ setBigger(growBy) {\n    if (el) {\n      size += growBy;\n      el.style.width\
  \ = size + \"px\";\n      el.style.height = size + \"px\";\n    }\n  }\n  function\
  \ setColor(color) {\n    if (el) {\n      el.style.backgroundColor = color;\n  \
  \  }\n  }\n  ...\n  function getNextId() {\n    var squares = document.querySelectorAll(\"\
  .square\"); if (squares) {\n      return squares.length;\n    }\n    return 0;\n\
  \  }\n}\n```\n\n`setBigger()` 和 `setColor()` 都会检查 `el` 变量是否已正确初始化（我们将在 `display()`\
  \ 函数中这样做），然后修改 `<div>` 元素的样式以使正方形变大并确保其颜色为正确的红色。\n\n\n\n\n\n同样注意，`setBigger()` 和\
  \ `setColor()` 函数可以访问私有变量 `el`（这也是因为闭包）。因此我们可以通过调用公共方法来操作私有变量的值。但我们无法从对象外部操作该私有变量。这让你（作为此\
  \ `Square()` 构造函数以及由此创建的 `square` 对象的开发者）对这些对象的使用方式具有更大的控制权。\n\n### 从私有函数访问公共方法\n\
  \n到此时，我们已经初始化了三个私有变量，并定义了一个公共方法 `grow()`。现在，我们需要创建一个代表页面上正方形的 `<div>` 元素。\n\n为了实现这一点，我们将调用\
  \ `display()` 函数。这是一个嵌套函数，它首先为正方形创建一个新的 `<div>` 元素，然后设置各种属性使正方形具有正确的尺寸和颜色。\n\n我们在这个函数中还为\
  \ `<div>` 设置了点击处理程序。当你点击正方形的 `<div>` 时，我们希望正方形增大，因此我们调用正在使用的正方形对象的 `grow()` 方法。你可能认为我们可以这样写\
  \ `display()` 函数：\n\n![](img/Image00210.jpg) 观察：\n\n```javascript\nfunction display()\
  \ {\n  el = document.createElement(\"div\");\n  el.setAttribute(\"id\", id);\n \
  \ el.setAttribute(\"class\", \"square\");\n  el.style.width = size + \"px\";\n \
  \ el.style.height = size + \"px\";\n  el.innerHTML = \"<p>\" + id + \"</p>\";\n\
  \  el.onclick = this.grow;\n  document.getElementById(\"squares\").appendChild(el);\n\
  }\n```\n\n然而，当你调用对象内部的嵌套函数时，`this` 被设置为全局 `window` 对象，而不是该函数所属的对象。那么，我们如何在 `display()`\
  \ 方法内部引用这个 \"this\" 对象呢？\n\n我们将 `this` 的值保存在另一个变量 `self` 中（你可以给这个变量起任何名字，但按照习惯它通常被称为\
  \ `self` 或 `that`。遵循这个习惯是一个好主意，可以让其他程序员更容易理解你的代码）。一旦我们将 `this` 的值保存到 `self` 中，就可以调用\
  \ `display()`，现在 `display()` 就可以通过 `self.grow` 引用对象的 `grow()` 方法了：\n\n![](img/Image00211.jpg)\
  \ 观察：\n\n```javascript\nfunction Square(size) {\n  var initialSize = size;\n  var\
  \ el = null;\n  var id = getNextId();\n\n  this.grow = function() {\n    setBigger(10);\n\
  \    setColor(\"red\");\n  };\n\n  var self = this;\n  display();\n\n  function\
  \ setBigger(growBy) {\n    if (el) {\n      size += growBy;\n      el.style.width\
  \ = size + \"px\";\n      el.style.height = size + \"px\";\n    }\n  }\n\n  function\
  \ setColor(color) {\n    if (el) {\n      el.style.backgroundColor = color;\n  \
  \  }\n  }\n\n  function display() {\n    el = document.createElement(\"div\");\n\
  \    el.setAttribute(\"id\", id);\n    el.setAttribute(\"class\", \"square\");\n\
  \    el.style.width = size + \"px\";\n    el.style.height = size + \"px\";\n   \
  \ el.innerHTML = \"<p>\" + id + \"</p>\";\n    el.onclick = self.grow;\n    document.getElementById(\"\
  squares\").appendChild(el);\n  }\n\n  function getNextId() {\n    var squares =\
  \ document.querySelectorAll(\".square\");\n    if (squares) {\n      return squares.length;\n\
  \    }\n    return 0;\n  }\n}\n```\n\n当你点击正方形时，会在存储在 `self` 中的对象上调用 `grow()` 方法，该对象是在将\
  \ `self` 的值赋值给 `this` 时创建的正方形对象。`self` 是私有变量，与其他私有变量和方法一样，它在正方形内部是可以访问的，尽管使用正方形对象的代码无法访问它。\n\
  \n让我们通过在代码中添加几个 `console.log()` 来检查我们在 `window.onload` 函数中创建的正方形对象的内容：\n\n![](img/Image00212.jpg)\
  \ 需要输入的代码：更新你在 `squaresAPI.html` 中的 JavaScript 代码：\n\n```javascript\nwindow.onload\
  \ = function() {\n  var square1 = new Square(100);\n  var square2 = new Square(200);\n\
  \  console.log(square1);\n  console.log(square2);\n  var growButton = document.getElementById(\"\
  growButton\");\n  growButton.onclick = function() {\n    square1.grow();\n    square2.grow();\n\
  \  };\n};\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00036.jpg)。在控制台中显示了两个正方形对象（Chrome\
  \ 浏览器）：\n\n![](img/Image00213.jpg)\n\n你可以看到，每个正方形对象中唯一的（我们添加的）属性就是 `grow()` 方法。\n\
  \n点击正方形会导致该正方形增大，因为我们调用了你点击的正方形的 `grow()` 方法。\n\n对正方形 `grow()` 方法的调用是在 `display()`\
  \ 方法中设置的，但在你实际点击正方形之前该方法不会被调用。为了让你更显式地看到可以使用 `square1` 和 `square2` 对象调用正方形的 `grow()`\
  \ 方法，我们设置了一个带有按钮 `Grow` 的表单，它会调用两个正方形对象的 `grow()` 方法：\n\n![](img/Image00030.jpg)\
  \ 观察：\n\n```javascript\nwindow.onload = function() {\n  var square1 = new Square(100);\n\
  \  var square2 = new Square(200);\n  var growButton = document.getElementById(\"\
  growButton\");\n  growButton.onclick = function() {\n    square1.grow();\n    square2.grow();\n\
  \  };\n};\n```\n\n首先，我们从页面获取按钮元素，并为按钮添加点击处理程序函数。点击处理程序调用了 `square1` 和 `square2`\
  \ 的 `grow()` 方法。因为 `grow()` 是一个公共方法，也就是说我们用构造函数创建的对象的属性，因此该方法对对象外部的代码是可见的。\n\n###\
  \ 封装与 API\n\n因此，正方形对象有很多许多“外部世界”无法访问的内部组件。这些都是我们在 `Square()` 构造函数中定义的私有变量和函数。\n\n\
  正方形拥有的唯一公共方法 `grow()` 是它的接口：即正方形与其他交互的点。你允许从正方形外部调用的方法只有 `grow()`。我们将这种接口称为应用程序接口，简称\
  \ `API`。当你在软件中使用 `API` 术语时，指的是决定软件组件如何相互作用的属性和方法集合。\n\n我们封装了所有不希望外部代码交互的私有内容：`id`、代表正方形的元素对象、初始尺寸以及用于创建和操作正方形的函数。这些私有属性不在\
  \ API 中；它们被隐藏并保护，无法在外部使用。\n\n封装是限制对象组件内容的语言机制。在某些语言（如 Java）中，我们使用关键字来指定对象的哪些部分是私有的或公共的。在\
  \ JavaScript 中，我们没有关键字提供帮助，但我们可以通过本节涵盖的技术将变量和函数设置为对象私有来实现封装。我们有时将这种技术称为信息隐藏，因为我们正在隐藏对象的实现细节，以防止其被错误使用。\n\
  \n封装并为正方形这样的对象提供 API 的优点是可以防止使用正方形的代码将对象的内部状态设置为无效状态。我们无法修改正方形的 `id` 或代表页面上正方形的元素——这两者都会破坏正方形的工作方式——因为这些值现在受到了不受外部操作的保护。\n\
  \n\n\n\n让我们回顾一下。我们定义了一个 `Square()` 构造函数，它创建一个新的正方形对象，并包含一个公共方法 `grow()` 以及各种私有变量（有时称为私有“成员”）和方法。在构造时添加到对象的任何属性和方法（例如\
  \ `grow()`），无论是通过构造函数还是通过对象的原型添加的，对于使用该对象的代码来说都是访问的。而在构造函数中定义的任何变量和函数（如 `id` 和 `display()`），对象外部的代码都是无法访问的。正方形对象的接口（API）就是\
  \ `grow()` 方法：这是外部代码可以调用的唯一方法。\n\n如果你正在编写与他人共享的代码，那么为对象定义接口就尤为重要。也许你正在为工作中的产品开发组件，而开发小组的其他成员将使用你开发的组件。或者，你可能正在开发一个像\
  \ `jQuery` 这样希望在网上提供的库。通过封装对象的工作细节并为使用对象提供简单的接口，你将使你的对象变得更容易理解和更容易使用。\n\n## 闭包 (Closures)\n\
  \n![](img/Image00005.jpg)\n\n### 课程目标\n\n完成本节课程后，你将能够：\n\n* 创建并使用闭包来“记住”值。\n![](img/Image00006.jpg)\n\
  * 解释闭包是如何创建的。\n![](img/Image00006.jpg)\n* 使用闭包为点击事件处理器存储值。\n![](img/Image00005.jpg)\
  \ ![](img/Image00006.jpg)\n\n### 闭包\n\n在上一节课程中，你学习了封装和信息隐藏。所有这些功能的实现都得益于 JavaScript\
  \ 的特性：闭包。闭包看起来相对简单，但实际上可能很难理解。这整节课程都将致力于闭包：它们是什么、如何工作、以及何时该使用它们。\n\n## 创建闭包\n\n\
  我们之前提到过闭包，现在是时候揭开围绕它们的神秘面纱了。我们将从一些基础示例开始，然后回到之前几中的中的几个示例，看看我们过去是如何使用闭包的。\n\n创建一个新文件并添加以下代码：\n\
  \n![](img/Image00068.jpg)\n\n需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title> Closures </title>\n<meta charset=\"utf-8\">\n<script>\nfunction makeAdder(x,\
  \ y) {\nvar adder = function() {\nreturn x + y;\n};\nreturn adder;\n}\nvar f = makeAdder(2,\
  \ 3);\nvar result = f();\nconsole.log(\"Result is: \" + result);\n</script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 将其保存到你的 `/AdvJS` 文件夹并命名为\
  \ `closure.html`，然后 ![](img/Image000021.jpg) 。打开控制台（如有必要请刷新文件），你将看到“Result is: 5.”\n\
  \n在这段代码中，我们有一个返回另一个函数的函数。你可能在早之前的课程中记得，函数是一等公民值；也就是说，你可以从一个函数返回一个函数，就像你可以返回 3 或\
  \ \"string\" 这样的值一样。`makeAdder()` 函数返回一个函数 `adder()`，该函数会将两个值并返回结果。我们在 `makeAdder()`\
  \ 内部将函数命名为 `adder()`，但当我们从 `makeAdder()` 返回它时，我们将其命名为 `f()`。因此，为了调用返回的函数，我们使用 `f()`。（我们可以在两个地方为函数使用相同的名称，但对于这节课程，我们希望在函数定义时有一种识别方式，在函数调用时另一种识别方式。）\n\
  \n我们想要相加的两个值是在调用 `makeAdder()` 函数时作为参数传递给该函数的。`adder()` 函数不接受任何参数。相反，`adder()` 会将传递\
  \ `makeAdder()` 的两个数字相加。那么，它是如何工作的呢？\n\n局部变量（包括函数的参数）在定义它们的函数执行完毕后就会消失。因此，虽然在创建函数\
  \ `adder()` 时定义了参数 `x` 和 `y`，但当我们稍后使用名称 `f()` 调用它时，`x` 和 `y` 早已消失了。那么，调用 `f()` 将是如何返回（正确的）值\
  \ 5 的呢？似乎 `f()` 以某种方式“记住”了在创建 `f()`（即作为 `adder()`）时定义的 `x` 和 `y` 的值。\n\n嗯，事实确实如此。函数\
  \ `f()` 通过闭包“记住”了 `x` 和 `y` 的值。让我们逐步执行这段代码，在 JavaScript 控制台中查看闭包。\n\n首先，在 Chrome\
  \ 浏览器中打开 `closure.html`，并在调用 `makeAdder()` 的代码行添加一个断点：\n\n![](img/Image00214.jpg)\n\
  \n添加断点，点击“Sources”（源代码）选项卡，然后从左侧窗格打开 `closure.html`。点击你想添加断点的代码行旁的行号（在我们版本中，是第 16\
  \ 行）。断点会出现在右侧面板的“Breakpoints”（断点）部分。\n\n现在，刷新页面并双击“Step into”（步入）按钮。这是右侧面板从左数起第三个按钮，点上方有一个指向下方的小箭头：\n\
  ![](img/Image00215.jpg)\n\n我们现在处于返回 `adder()` 的那一行。查看右侧面板下的“Scope Variables”（作用域变量）。在\
  \ `makeAdder()` 内部定义的局部变量，包括两个参数 `x` 和 `y`，以及 `adder()` 函数。这些都是局部变量，因为它们被定义在 `makeAdder()`\
  \ 内部。\n\n再点击两次“Step into”；我们现在停在调用 `f()` 的行（我们还没有执行这一行）。`f` 是一个全局变量（如果你在右侧面板的“Scope\
  \ Variables”下打开“Global”，你会看到它被定义为全局变量，即全局 window 对象）。\n\n![](img/Image00216.jpg)\n\
  \n再次点击一次“Step into”，以便调用 `f()` 并在返回 `x` 和 `y` 的相加结果之前停止：\n![](img/Image00217.jpg)\n\
  \n在“Scope Variables”的“Local”下，你会看到一个名为“Closure”（闭包）的东西。在里面你会看到两个变量 `x` 和 `y`，它们的值被正确设置为\
  \ 2 和 3——我们之前传递给 `makeAdder()` 的参数。这就是闭包，`f()` 获取相加的两个值的地方。\n\n再次“Step into”两次执行代码行\
  \ `return x + y` 并返回 `f()`。闭包消失了：\n![](img/Image0218.jpg)\n\n点击“Resume”（恢复）执行脚本。\n\
  \n## 什么是闭包？\n\n现在你了一个闭包，但闭包到底是什么？\n\n要理解闭包，你需要记住作用域是如何工作的。在关于作用域的早期课程中，我们讨论了调用函数时如何创建作用域链。作用域链是包含函数变量的作用域对象序列。对于全局函数（即定义在顶层的函数），我们有两个作用域层：局部作用域（函数内部的作用域）和全局作用域。当你调用函数并引用变量时，我们首先通过局部作用域获取变量值，如果在那里找不到，我们就查看全局作用域。\n\
  \n现在，回想调用嵌套（或“内部”）函数时，有三个作用域层：嵌套函数的作用域、包含嵌套函数的函数的作用域，最后是全局作用域。\n\n在示例中，我们创建了一个名为\
  \ `adder()` 的嵌套函数：\n\n![](img/Image0030.jpg)\n\n观察：\n\n在 `adder()` 内部，我们引用了两个变量\
  \ `x` 和 `y`。这些变量定义在 `makeAdder()` 函数中，因此它们不是 `adder()` 的局部变量。如果我们直接在 `makeAdder()`\
  \ 内部调用 `adder()`（例如将行 `return adder` 改为 `adder()`），你会为了确定变量 `x` 和 `y` 的值，我们将使用作用域链。我们首先在\
  \ `adder()` 的作用域中查找这些值，但在那里找不到，所以我们会在 `makeAdder()` 的作用域中查找这些值，并找到了它们。\n\n\n\n然而，我们并没有在\
  \ `makeAdder()` 内部调用 `adder()`；而是从 `makeAdder()` 中返回 `adder()`。当我们返回 `adder()` 函数时，它会随带一个作用域对象：该对象包含了在\
  \ `adder()` 创建时所在作用域内的变量。这包括了两个变量 `x` 和 `y`。这个对象本质上与为作用域链创建的 `makeAdder()` 作用域对象是相同的。它是\
  \ `adder()` 被创建的上下文。\n\n这个对象就是闭包（closure）。闭包是一个在函数创建时捕获其位置上下文的对象。闭包“记住”了内部函数创建时在作用域内的所有变量。如果我们直接调用内部函数，那么当包含它的函数结束时，闭包就会被丢弃；但如果我们返回了那个内部函数，闭包就会随之一起返回：\n\
  \n![](img/Image00219.jpg)\n\n当我们稍后调用该函数并查找它所引用的变量值时，如果不在函数本身内部找到这些值（即它们不是局部变量），我们会在闭包中查找：\n\
  \n![](img/Image00220.jpg)\n\n因此，当你调用一个函数时，闭包就成为了作用域链的一部分。\n\n闭包看起来非常像从包含它的函数调用嵌套函数时添加到链中的作用域对象（例如，如果我们在\
  \ `makeAdder()` 内部调用 `adder()` 的话）。尽管在这里我们使用闭包而不是作用域对象，是因为我们是在包含函数返回后才调用返回的函数（`f()`），所以我们无法使用普通的作用域链来查找\
  \ `f()` 中变量的值；我们必须使用闭包。我们在闭包中“捕获”了嵌套函数创建时的作用域或上下文，以便我们可以在包含函数执行完毕很长时间之后仍然引用这些变量。\n\
  \n### 玩转闭包\n\n让我们玩玩闭包，这样你就能看到它们是如何工作的。首先，让我们看看内部函数实际引用的变量是如何添加到闭包中的。修改\n\n![](img/Image00159.jpg)\n\
  \n如下所示修改 closures.html 以证明哪些变量是闭包：\n\n需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title> Closures</title>\n<meta charset=\"utf-8\">\n<script>\nfunction makeAdder(x,\
  \ y) {\n  var z = 10;\n  var adder = function() {\n    return x + y;\n  };\n  return\
  \ adder;\n}\nvar f = makeAdder(2, 3);\nvar result = f();\nconsole.log(\"Result is:\
  \ \" + result);\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg)\
  \ 和 ![](img/Image00021.jpg)。在控制台中，打开 Sources（源代码）标签页，并查看 closure.html。清除之前的断点，并在返回\
  \ `x` 和 `y` 相加结果的行上（在 `adder()` 内部）添加一个断点，如下所示：\n\n![](img/Image00221.jpg)\n\n刷新页面。执行将停在断点处，这样你可以检查闭包。注意，尽管我们向\
  \ `makeAdder()` 添加了一个局部变量 `z`，但该变量并没有被包含在闭包中。为什么？\n\n因为它没有被 `adder()` 引用，所以闭包中不需要它。\n\
  \n接下来，让我们证明只有非局部变量会被添加到闭包中：\n\n![](img/Image00222.jpg)\n\n需要输入的代码：\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title> Closures</title>\n<meta charset=\"utf-8\"\
  >\n<script>\nfunction makeAdder(x, y) {\n  var z = 10;\n  var adder = function()\
  \ {\n    var x = 10;\n    return x + y;\n  };\n  return adder;\n}\nvar f = makeAdder(2,\
  \ 3);\nvar result = f();\nconsole.log(\"Result is: \" + result);\n</script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)\
  \ 预览。在控制台中，打开 Sources 标签页，并查看 closure.html：\n\n![](img/Image00223.jpg)\n\n现在，只有\
  \ `y` 在闭包中。局部变量 `x` 隐藏了 `makeAdder()` 中的参数 `x`，所以闭包中不再需要 `x` ——因为如果我们在 `adder()`\
  \ 中引用 `x`，将始终使用该局部变量的值。此外，查看控制台（点击 Console 标签页）；结果现在是 13 而不是 5。\n\n你认为如果我们在 `adder()`\
  \ 中引用 `z` 会发生什么？\n\n![](img/Image00222.jpg)\n\n需要输入的代码：\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title> Closures</title>\n<meta charset=\"utf-8\">\n<script>\nfunction\
  \ makeAdder(x, y) {\n  var z = 10;\n  var adder = function() {\n    var x = 10;\n\
  \    return x + y + z;\n  };\n  return adder;\n}\nvar f = makeAdder(2, 3);\nvar\
  \ result = f();\nconsole.log(\"Result is: \" + result);\n</script>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)。在控制台中，打开\
  \ Sources 标签页，并查看 closure.html。注意我们现在向 `x` 和 `y` 添加了 `z`。在返回 `x`、`y` 和 `z` 相加结果的行上（在\
  \ `adder()` 内部）添加一个断点，如下所示：\n\n![](img/Image00224.jpg)\n\n刷新页面。当执行停止时，你会发现 `z` 现在被包含在闭包中了，因为它被\
  \ `adder()` 引用。\n\n你认为如果我们删除 `z` 的声明，但保留 `adder()` 中对 `z` 的引用会发生什么？试试看吧！\n\n###\
  \ 每个闭包都是唯一的\n\n每次调用 `makeAdder()`，你都会得到一个将两个数字相加的函数。让我们再写一个函数 `g()`，将数字 4 和 5 相加：\n\
  \n![](img/Image00225.jpg)\n\n需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title> Closures</title>\n<meta charset=\"utf-8\">\n<script>\nfunction makeAdder(x,\
  \ y) {\n  var z = 10;\n  var adder = function() {\n    var x = 10;\n    return x\
  \ + y + z;\n  };\n  return adder;\n}\nvar f = makeAdder(2, 3);\nvar result = f();\n\
  console.log(\"Result is: \" + result);\nvar g = makeAdder(4, 5);\nvar anotherResult\
  \ = g();\nconsole.log(\"Another result is: \" + anotherResult);\n</script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)。在控制台中，你会看到调用\
  \ `g()` 的结果是 9。现在，打开 Sources 标签页并查看 closure.html。在返回 `adder()` 的的行（我们版本中的第 10 行）添加一个断点，并刷新页面。执行第一次停在断点处时，我们在调用\
  \ `f()`，所以你会看到闭包中 `x` 和 `y` 的值为 2 和 3。再次继续。现在执行停在断点处时，我们在调用 `g()`，你会看到闭包中 `x` 和\
  \ `y` 的值为 4 和 5。\n\n换句话说，`f()` 和 `g()` 获得了不同 `x` 和 `y` 值的独立闭包。在调用 `g()` 之后再次调用 `f()`，你仍然会得到正确的答案。当\
  \ `f()` 和 `g()` 创建时，`x` 和 `y` 的值是不同的，因此每个函数都有一个独立的闭包，其中包含的值不同。记住，闭包捕获了函数创建时的上下文。\n\
  \n![](img/Image00226.jpg)\n\n### 闭包并不总是如你预期\n\n现在，尝试这个：\n\n![](img/Image00155.jpg)\n\
  \n需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title> Closures</title>\n\
  <meta charset=\"utf-8\">\n<script>\nfunction makeAdder(x, y) {\n  var adder = function()\
  \ {\n    return x + y;\n  };\n  x = 10;\n  return adder;\n}\nvar f = makeAdder(2,\
  \ 3);\nvar result = f();\nconsole.log(\"Result is: \" + result);\nvar g = makeAdder(4,\
  \ 5);\nvar anotherResult = g();\nconsole.log(\"Another result is: \" + anotherResult);\n\
  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)。查看控制台中的结果。调用\
  \ `f()` 的结果现在是 13，调用 `g()` 的结果现在是 15。如果你仍在第 10 行设置了断点，你会发现闭包现在在两个函数中 `x` 的值都是 10。这是因为闭包是指向一个对象的引用：该对象包含了\n\
  \n\n\n\n与闭包相关的函数作用域内的变量值。因此，当我们第一次调用 `makeAdder()` 时，我们通过在 `makeAdder()` 中定义它来创建函数\
  \ `adder()`。闭包被创建了，`adder()` 获取了对该闭包对象的引用，该对象包含一个名为 `x` 的属性，其值为 `2`（我们传递给 `makeAdder()`\
  \ 的值）。在返回 `adder()` 函数值之前，我们更改了与 `adder()` 关联的闭包对象中属性的值。`adder()` 仍然指向闭包对象，但我们更改了该闭包对象中的值，因此稍后当我们调用\
  \ `f()`（这只是我们在调用 `makeAdder(2, 3)` 时创建的 `adder()` 函数的另一个名称）时，我们查找 `x` 的值发现的是 `10`\
  \ 而不是 `2`：\n\n![](img/Image00227.jpg)\n\n理解这一点非常重要，请仔细查看几次。如果你不记得与函数相关的闭包是一个对象，并且存储在函数对象中作为闭包的实际上是对对象的引用，你可能会遇到问题。如果你在创建函数后更改了该对象，该函数将使用对象中的新值，而不是原始值。\n\
  \n### 方法的闭包\n\n闭包也适用于方法（方法只是对象中的函数）：\n\n![](img/Image00228.jpg)\n\n需要输入的代码：\n\n\
  ```html\n<!doctype html>\n<html\n<head>\n<title> Closures </title>\n<meta charset=\"\
  utf-8\">\n<script>\nfunction makeAdder(x, y) {\nvar adder = function() {\nreturn\
  \ x + y;\n};\nx = 10;\nreturn adder;\n}\nvar f = makeAdder(2, 3);\nvar result =\
  \ f();\nconsole.log(\"Result is: \" + result);\nvar g = makeAdder(4, 5);\nvar anotherResult\
  \ = g();\nconsole.log(\"Another result is: \" + anotherResult);\nfunction makeObject(x,\
  \ y) {\nreturn {\nz: 10,\nadder: function() {\nreturn x + y + this.z;\n}\n\n};\n\
  }\nvar o = makeObject(2, 3);\nvar result2 = o.adder();\nconsole.log(\"Result in\
  \ o is: \" + result2);\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg)\
  \ 和 ![](img/Image00021.jpg)。在控制台中，你看到 `result 2` 的值为 `15`。\n\n继续通过在新的 `makeObject()`\
  \ 函数的返回处设置断点进行实验（在我们版本中第 28 行）。当你在带有断点的情况下执行代码时，你会发现当我们调用 `o.adder()` 时，`this` 的值是对象\
  \ `o`（很好！），而且该对象包含两个属性：方法 `adder()` 和值为 `10` 的属性 `z`。闭包包含了 `x` 和 `y` 的值 `2` 和 `3`。我们不需要闭包中包含\
  \ `this.z` 的值，因为我们是从包含正在调用的方法的对象中获取该值的——即。\n\n![](img/Image00229.jpg)\n\n### 使用闭包\n\
  \n现在你知道闭包是如何工作的了，那么它们什么时候有用用呢？毕竟，在日常代码中，我们并不经常创建返回其他函数的函数。让我们来看看闭包派上用场的几个例子。\n\n\
  #### 使用闭包创建私有数据\n\n我们将从创建一个计数函数开始。创建一个新文件并添加此代码：\n\n![](img/Image00230.jpg)\n\n\
  需要输入的代码：\n\n```html\n<!doctype html>\n<html\n<head>\n<title> Counter </title>\n\
  <meta charset=\"utf-8\">\n<script>\nfunction makeCounter() {\nvar count = 0;\nreturn\
  \ function() {\ncount = count + 1;\nreturn count;\n};\n}\nvar counter = makeCounter();\n\
  console.log(\"Counter: \" + counter());\nconsole.log(\"Counter: \" + counter());\n\
  console.log(\"Counter: \" + counter());\nconsole.log(\"Counter: \" + counter());\n\
  console.log(\"Counter: \" + counter());\n</script>\n</head>\n<body>\n</body>\n</html>\n\
  ```\n\n![](img/Image00042.jpg) 将此文件保存为 `counter.html` 并保存在 `AdvJS` 文件夹中 ![](img/Image0027.jpg)。\
  \ 打开文件 ![](img/Image0098.jpg)。在控制台中，你看到：\n\n![](img/Image00230.jpg)\n\n观察：\nCounter:\
  \ 1\nCounter: 2\nCounter: 3\nCounter: 4\nCounter: 5\n\n这非常酷，因为我们使用闭包来封装 `count`\
  \ 变量。每次我们调用 `counter()`，它都会增加 `count` 的值并返回它。`count` 变量是私有的，因为在外部无法直接访问它，只能通过 `counter()`\
  \ 函数来访问。\n\n\n\n\n当 `i` 的值为 `3` 时，我们的循环就会停止迭代。因此，当我们稍后调用这些点击处理函数之一时（例如当你点击一个 `<div>`\
  \ 时），你看到的是 `i` 在循环结束时的值，而不是在最初创建闭包时 `i` 的值。\n\n尝试使用控制台（console）在代码中添加断点以检查闭包。在点击处理函数中我们\
  \ `console.log()` 显示 `<div>` 信息的那行上添加断点。点击 `<div>`，以便在点击处理函数被调用时查看闭包。\n\n我们可以通过创建另一个闭包来修复这个问题。让我们来看看如何操作：\n\
  \n![](img/Image00232.jpg)\n\n需要输入的代码：\n\n...\n\n```javascript\nwindow.onload = function()\
  \ {\n  var numDivs = 3;\n\n  for (var i = 0; i < numDivs; i++) {\n    var div =\
  \ document.getElementById(\"div\" + i);\n    div.onclick = function() {\n      console.log(\"\
  You just clicked on div number \" + i);\n    };\n\n    div.onclick = (function(divNum)\
  \ {\n      return function() {\n        console.log(\"You just clicked on div number\
  \ \" + divNum);\n      };\n    })(i);\n  }\n};\n```\n\n![](img/Image00042.jpg) 和\
  \ ![](img/Image00021.jpg) 。再次尝试点击每个 `<div>`。现在你为每个 `<div>` 获得了正确的数值。\n\n### 它是如何工作的？\n\
  \n![](img/Image00030.jpg)\n\n观察：\n\n```javascript\nwindow.onload = function() {\n\
  \  var numDivs = 3;\n\n  for (var i = 0; i < numDivs; i++) {\n    var div = document.getElementById(\"\
  div\" + i);\n    div.onclick = (function(divNum) {\n      return function() {\n\
  \        console.log(\"You just clicked on div number \" + divNum);\n      };\n\
  \    })(i);\n  }\n};\n```\n\n当我们为每个 `<div>` 的点击处理函数赋值时，我们是通过执行另一个函数来实现，该函数返回一个函数值作为点击处理函数。这个函数会立即执行。这看起来有点奇怪，因为我们先把函数表达式放在括号中，在函数表达式之后，我们还有另一组括号：\n\
  \n![](img/Image00076.jpg)\n\n观察：\n\n`div.onclick = (function(divNum) { ... }) (i);`\n\
  \n我们正在调用刚刚创建的那个函数。（我们将在后的课程中详细讨论这种一步完成函数创建和调用的模式）。\n\n将函数表达式放在括号中，可以确保该函数表达式被视为一个表达式而不是一个函数声明。此外，我们把\
  \ `i` 的值传递给我们正在调用的函数。该值被传递给变量 `divNum`，它由我们从刚刚调用的函数返回的函数所使用。当我们从一个函数中返回另一个函数时，我们会创建一个闭包，它包含了被返回函数所引用的任何变量，而这些变量定义在包含它的函数中。在这种情况下，这两个函数都是匿名的；我们实际上并没有像之前使用\
  \ `makeAdder()` 和 `adder()` 那样给它们命名，但没关系。闭包的工作原理完全相同。在这种情况下，与返回函数关联的闭包包含了 `divNum`\
  \ 的值。请注意，这个值不会改变。即使 `i` 的值发生了变化，闭包中的 `divNum` 的值也不会变化（记住参数是按值传递给函数的，所以 `divNum`\
  \ 获取的是 `i` 值的副本）。\n\n返回的函数被赋值给 `div.onclick` 属性，因此一旦 `window.onload` 函数完成，它就可以可用了。这意味着该函数闭包中的值也是可用的，所以当你点击一个\
  \ `<div>` 时，你会得到该 `<div>` 的正确数字，因为你正在访问闭包中的 `divNum` 变量。再次在代码的 `console.log()` 行上（在我们版本中是第\
  \ 23 行）添加断点，并在点击 `<div>` 时检查闭包。你会看到变量 `divNum` 以及你所点击的 `<div>` 的正确数字：\n\n![](img/Image00233.jpg)\n\
  \n这种使用闭包通过将变量传递给返回另一个函数的函数来捕获变量当前值的方法，是 JavaScript 程序员常用的技术（我们将在下节课程中进一步探讨）。\n\n\
  ### 我们之前在哪里用过闭包\n\n在结束课程之前，让我们看看课程早期使用闭包的两个例子。\n\n首先，再看一眼函数（Functions）课程中的示例 `AdvJS/functions3.html`。（如果你没有这个文件，不用担心——你可以将其复制并保存为\
  \ `AdvJS/functions3.html`）。\n\n![](img/Image00153.jpg) 需要输入的代码：此代码位于你 `AdvJS/` 文件夹下的\
  \ `functions3.html` 文件中\n\n```html\n<!doctype html>\n<html>\n<head>\n  <title> Returning\
  \ Functions </title>\n  <meta charset=\"utf-8\">\n  <script>\n    function makeConverterFunction(multiplier,\
  \ term) {\n      return function(input) {\n        var convertedValue = input *\
  \ multiplier;\n        convertedValue = convertedValue + term;\n        return convertedValue;\n\
  \      };\n    }\n\n    var converter = makeConverterFunction(2, \"px\");\n    console.log(converter(10));\
  \ // 20px\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n*(注：提供的代码块文本为乱码/不完整；我根据提示中提到的“Returning\
  \ Functions”和“makeConverterFunction”的上下文重构了逻辑结构。）*\n\n\n\n\n由 `Square()` 构造函数创建的闭包并不明显，但它确实存在。在\
  \ `this.grow()` 中，我们引用了两个嵌套函数：`setBigger()` 和 `setColor()`。它们都是嵌套函数，这意味着它们是 `Square()`\
  \ 构造函数中的局部变量。就像任何其他种类的局部变量（如 `initialSize` 或 `id`）一样，这些函数的值在 `Square()` 执行完成后就会消失。\n\
  \n由于我们在 `this.grow()` 中引用了这些函数，因此这些函数被添加到 `this.grow()` 方法的闭包中。此外，这两个函数作用范围内的任何局部变量也会被添加到闭包中。为什么？因为当我们调用\
  \ `square1.grow()` 和 `square2.grow()` 时，可能需要这些值，否则我们将会得到引用错误（reference error）。因此，被\
  \ `this.grow()` 直接使用的两个函数值，以及这两个函数作用范围内的任何其他变量，都被添加到闭包中。\n\n你可以通过在 `this.grow()`\
  \ 的某行代码上添加断点来检查闭包。当你点击 `Grow` 按钮调用正方形的 `this.grow()` 方法时，你会遇到断点，并能够看到闭包：\n\n![](img/00235.jpg)\n\
  \n每当你创建一个引用了周围上下文变量的函数时，就会创建一个闭包。如果你从一个函数返回该函数，或者将其赋值给对象的属性（使得该函数在其创建的上下文之外可用），那么闭包会随函数一起到来。这意味着函数可以“记住”它所引用的变量值。这就是闭包名称的由来：闭包在函数创建时“闭合”作用范围内的变量，以便在原始上下文消失后，函数仍能继续使用这些变量。可以将闭包看作“函数加上作用域”。如果你理解了作用域，你就会理解它。注意，全局变量不需要闭包，因为全局变量具有全局作用域。它们在你的代码的任何地方都是可用的，因此没有必要在闭包中“记住”它们。闭包的主要用途是创建私有数据，就像我们在计数器示例和正方形示例中所做的那样。你会经常看到这样使用闭包（例如在\
  \ jQuery 和 Backbone.js 等库中）。闭包以难以理解著称，所以请花额外的时间复习课程，确保你已经掌握了。使用控制台检查你创建的闭包，以帮助你理解发生了什么。模块模式\n\
  \n![](img/00005.jpg)\n\n### 课程目标\n\n当你完成本课程时，你将能够：\n- 使用立即执行函数表达式 (`IIFE`) 为你的代码创建局部作用域。![](img/00006.jpg)\n\
  - 解释在 `IIFE` 完成后如何使用闭包访问变量。![](img/00006.jpg)\n- 在 jQuery 的实现中使用模块模式。![](img/00006.jpg)\n\
  - 使用模块模式创建代码模块。![](img/00005.jpg)(00006.jpg)\n\n## 模块模式\n\n模块模式已成为你在 JavaScript\
  \ 中能看到的最常见模式之一。大多数 JavaScript 库和插件脚本都使用了它，包括 Backbone.js、jQuery、YUI 和 Prototype\
  \ 等库。你可以使用该模式来保持代码结构整洁、减少使用的全局变量数量、封装结构和行为，并为你的对象提供简单的 API。这一切之所以成为实现，是因为闭包，而你已经在上一节课中学习了闭包。在本节课中，我们将查看模块模式：它是什么、它是如何工作的、它与闭包的关系，以及它如何帮助你组织代码。\n\
  \n### IIFE 或立即执行函数表达式 (Immediately Invoked Function Expressions)\n\n要理解模块模式，你需要了解闭包是如何运作的（你已经学过了）、如何使用带闭包的对象来创建私有和公共数据（你已经学过了），以及为对象创建公共\
  \ API 意味着什么（你已经学过了）。你唯一还不知道（尽管我们在上一节课中见过一个）就是立即执行函数表达式。让我们来看你所创建的最简单的一类 `IIFE`：![](img/0150.jpg)\n\
  \n需要输入的代码：\n```html\n<!doctype html>\n<head>\n  <title>IIFE</title>\n  <meta charset=\"\
  utf-8\">\n  <script>\n  (function() {\n    var x = 3;\n  })();\n  </script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n![](img/0042.jpg) 将此文件保存到你的 `/JS` 文件夹中并重命名为 `ifife.html`，![](img/0021.jpg)。你现在还什么都看不到，因为到目前为止，我们的\
  \ `IIFE` 并没有做什么。我们需要让它做些事情，但首先，让我们仔细看看代码中到底发生了什么：![](img/0033.jpg)\n\n观察：\n```javascript\n\
  (function() {\n  var x = 3;\n})();\n```\n将这段代码拆解为三部分。首先，看 `function expression`（函数表达式）。这是一个匿名函数（没有名字的函数），它现在所做的只是将变量\
  \ `x` 初始化为 `3`。其次，我们在函数周围加上了括号。我们加上括号是因为我们想要立即执行该 `function`，这是第三部分。我们需要在函数周围加上括号是为了使其成为一个`函数表达式`而不是`函数声明`（function\
  \ declaration），因为当你在全局层级使用 `function` 关键字时，JavaScript 会自动创建一个`函数声明`。如果你尝试立即执行一个`函数声明`，你将得到语法错误（试一看：去掉括号你就会得到语法错误）。通过在函数周围加上括号，我们创建了一个`函数表达式`，然后可以通过在函数后添加括号来立即执行它。这段代码与以下代码几乎相同：![](img/0104.jpg)\n\
  \n观察：\n```javascript\nfunction foo() {\n  var x = 3;\n}\nfoo();\n```\n在这里，我们有一个函数\
  \ `foo` 的`函数声明`。然后我们在定义后立即调用了该 `function`。这两段代码本质上完成了相同的事情：它们为变量 `x` 创建了一个上下文（或作用域）。`x`\
  \ 是局部变量；它只在函数作用域内可用。然而，有一个关键区别：在第一个版本中，我们从未给函数命名，因此没有对全局对象做任何更改。代码执行完全不影响全局对象（它没有添加任何新的变量或函数定义）。在第二个版本中，我们确实更改了全局对象：向它添加了名称\
  \ `foo`，并将 `foo` 的值设置为一个函数。\n\n代码的版本是一个 `IIFE`。`IIFE` 用于创建一个带有函数的上下文，在这个上下文中你可以声明变量、定义函数并执行代码，而不会影响你\
  \ JavaScript 中的全局变量。`IIFE` 之所以命名，是因为我们在定义函数的同一个表达式中调用（触发）了它。换句话说，我们立即执行了该`函数表达式`。`IIFE`\
  \ 非常有用。例如，你可以创建一个 `IIFE` 为页面上的某个元素设置点击处理程序。按照所示修改 `ifife.html`：![](img/0236.jpg)\n\
  \n需要输入的代码：\n```html\n<!doctype html>\n<head>\n  <title>IIFE</title>\n  <meta charset=\"\
  utf-8\">\n  <script>\n  (function() {\n    var x = 3;\n    var message = \"I've\
  \ been clicked!\";\n    window.onload = function() {\n      var div = document.querySelector(\"\
  div\");\n      div.onclick = function() {\n        alert(message);\n      };\n \
  \   };\n  })();\n  </script>\n</head>\n<body>\n  <div>click me!</div>\n</body>\n\
  </html>\n```\n![](img/0042.jpg) 和 ![](img/0021.jpg)。文字 \"click me!\" 出现在你的页面上。点击文本，你就会看到\
  \ \"I've been clicked!\" 警告框。我们在页面中完成了一些工作（设置了点击处理程序），但再次，除了为 `window.onload` 属性赋值值外，我们没有向全局对象添加任何新内容。然而，其他变量\
  \ `x`、`message` 和 `div` 都是 `IIFE` 的私有的，一旦页面加载时函数执行完毕后就会消失。\n\n\n\n然而，我们可以点击文本并在\
  \ IIFE 运行结束很久后看到消息。怎么做到呢？当然是使用闭包！每当我们创建一个引用了其所在上下文定义的变量的函数，并让该函数在（上下文之外可用时，它就会带上一个包含该函数所需变量值的闭包，从而使该函数能够“记住”这些值。\n\
  \n在我们的 IIFE 内部，我们将一个点击处理函数赋值给 `<div>` 元素的 `onclick` 属性。该函数引用了变量 `message`，并且由于该函数在我们的\
  \ IIFE 消失后仍然可用（因为我们将其保存在了 `<div>` 元素的 `onclick` 属性中，而 `<div>` 元素并没有消失），所以我们随函数一起获得了一个闭包。该闭包包含了变量\
  \ `message`。\n\n![](img/Image00128.jpg) 观察：\n\n```javascript\n(function() {\n  var\
  \ message = \"You've been clicked!\";\n  window.onload = function() {\n    var div\
  \ = document.querySelector(\"div\");\n    div.onclick = function() {\n      alert(\
  \ message );\n    };\n  };\n})();\n```\n\nIIFE 有助于在完成工作的同时对全局作用范围的影响降到最低。此外，你还可以通过给对象的属性赋值（例如\
  \ `<div>` 元素）来设置稍后运行的代码，因为这些对象在 IIFE 消失后仍然存在。\n\n## 模块模式\n\n现在你已经掌握了使用模块模式所需的所有知识。让我们来看一个使用该模式结构的小程序示例。按所示创建一个新文件：\n\
  \n![](img/Image00237.jpg) 需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title> Module Pattern </title>\n<meta charset=\"utf-8\">\n<script>\n  var counterModule\
  \ = (function() {\n    var counter = 0;\n    return {\n      increment: function()\
  \ {\n        counter++;\n      },\n      decrement: function() {\n        counter--;\n\
  \      },\n      reset: function() {\n        counter = 0;\n      },\n      getValue:\
  \ function() {\n        return counter;\n      }\n    };\n  })();\n\n  window.onload\
  \ = function() {\n    counterModule.increment();\n    counterModule.increment();\n\
  \    counterModule.decrement();\n    counterModule.increment();\n    console.log(counterModule.getValue());\n\
  \    counterModule.reset();\n  };\n</script>\n</head>\n<body>\n</body>\n</html>\n\
  ```\n\n![](img/Image00042.jpg) 将其保存在你的 `/AdvJS` 文件夹中并为 `module.html`，然后 ![](img/Image00085.jpg)。控制台中会显示值\
  \ `2`。\n\n让我们更仔细检查这段代码。首先，我们使用一个 IIFE 创建了一个管理变量 `counter` 的对象。与我们之前的 IIFE 示例不同，我们实际上从函数中返回了一个值：一个包含四个用于管理计数器的方法的对象。然而，`counter`\
  \ 并不是返回的对象的一部分。相反，它是 IIFE 的局部变量，这意味着它是一个私有变量。因为对象的方法引用了该变量，当对象被返回时，我们为每个方法都获得了一个包含\
  \ `counter` 变量的闭包（注意，每个闭包都引用同一个变量，因此如果其中一个方法更改了 `counter` 的值）。\n\n接下来，我们为返回的对象命名。我们给它命名为\
  \ `counterModule`。这是一个全局变量，因此程序的其余部分可以使用它，但请注意这是我们创建的唯一全局变量。这就是模块模式的意义：减少你创建的全局变量数量。\n\
  \n## 在 JavaScript 库中使用模块模式\n\n模块模式对于 JavaScript 库特别有用，因为它允许你组合来自不同来源的代码，同时不必担心意外覆盖变量。因为模块为私有数据提供了公共\
  \ API，你访问它时也不可能发生灾难性的操作。\n\n例如，看看 [jQuery](http://jquery.com/latest.js) 是如何结构的。实际代码包含一些我们不会深入探讨的复杂性，但如果你查看下面的代码片段，你会发现\
  \ jQuery 的作者使用模块模式来构建库。jQuery 的内部是私有变量和方法，而供你使用的库通过公共方法暴露。在这种情况下，一旦对象在 IIFE 内部设置好，并没有返回该对象，而是将对象赋值给全局对象的两个属性：`window.$`\
  \ 和 `window.jQuery`。\n\n![](img/Image00119.jpg) 观察：\n\n```javascript\n(function(\
  \ window, undefined ) {\n  // 这里有大量代码\n  // 定义 jQuery 的本地拷贝 = function( selector,\
  \ context ) {\n    // jQuery 对象实际上是 init 构造函数\n    return new jQuery.init( selector,\
  \ context );\n  };\n\n  // 更多代码...\n  // 在此处我们将 jQuery 对象作为全局变量添加\n  window.jQuery\
  \ = window.$ = jQuery;\n})( window );\n```\n\n不要担心上面代码的细节（这只是从 jQuery 版本中提取的一个小片段）。只需注意库的结构使用了模块模式即可。几乎每个\
  \ JavaScript 库都使用这种模式。\n\n如果你正在使用多个库，可能会发现使用模块模式组织自己的代码很有用，并如下所示将库导入你的模块：\n\n![](img/Image0033.jpg)\
  \ 观察：\n\n```javascript\nvar myModule = (function( J$ , U$ ) {\n})( jQuery , _ );\n\
  ```\n\n在这里，我们向 IIFE 传递两个参数：`jQuery` 对象（我们在链接 jQuery 库时获取）和 `_` 对象（它是 [Underscore](http://underscorejs.org)\
  \ 库的全局对象名称）。我们可以通过在 IIFE 参数中使用不同的名称来为这两个库对象设置别名：`J$` 代表 jQuery，`U$` 代表 Underscore。你可能只是更喜欢这些名字；但有时这样做是为了避免模块内部的命名冲突。\n\
  \n## 使用模块模式的购物篮\n\n这是另一个使用模块模式的示例——一个购物篮模块：\n\n![](img/Image00125.jpg) 需要输入的代码：\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title> Shopping Basket: Module Pattern\
  \ </title>\n<meta charset=\"utf-8\">\n<script>\n  var basket = (function() {\n \
  \   var basket = {};\n    var items = [];\n\n    // 向购物篮添加新物品。\n    // 如果物品已存在，则增加现有物品的计数。\n\
  \  });\n</script>\n</head>\n<body>\n</body>\n```\n\n\n\n\n返回：篮中该物品的数量。\n\n```javascript\n\
  function addItem(item, cost) {\n  for (var i = 0; i < items.length; i++) {\n   \
  \ if (items[i].name == item) {\n      items[i].count++;\n      return items[i].count;\n\
  \    }\n  }\n  items.push({ name: item, price: cost, count: 1 }); return 1;\n}\n\
  ```\n\n### 从篮中移除物品\n如果篮中该物品数量大于 1，则减少计数。\n如果移除一个后没有剩余该物品，则完全移除该物品。\n返回：剩余该物品的数量；如果尝试移除的物品不存在，则返回\
  \ -1。\n\n```javascript\nfunction removeItem(item) {\n  for (var i = 0; i < items.length;\
  \ i++) {\n    if (items[i].name == item) {\n      items[i].count--;\n      if (items[i].count\
  \ == 0) {\n        items.splice(i, 1);\n        return 0;\n      }\n      return\
  \ items[i].count;\n    }\n  }\n  return -1;\n}\n```\n\n### 计算篮中物品的总费用。\n```javascript\n\
  function cost() {\n  var total = 0;\n  for (var i = 0; i < items.length; i++) {\n\
  \    total += items[i].price * items[i].count;\n  }\n  return total;\n}\n\nbasket.addItem\
  \ = function(item, cost) {\n  var count = addItem(item, cost);\n  console.log(\"\
  You have \" + count + \" of \" + item + \" in your basket.\");\n};\n\nbasket.removeItem\
  \ = function(item) {\n  var count = removeItem(item);\n  if (count >= 0) {\n   \
  \ console.log(\"You have \" + count + \" of \" + item + \" left in your basket.\"\
  );\n  } else {\n    console.log(\"Sorry, couldn't find \" + item + \" in your basket\
  \ to remove.\");\n  }\n};\n\nbasket.cost = function() {\n  var totalCost = cost();\n\
  \  console.log(\"Your total cost is: \" + totalCost);\n};\n\nbasket.show = function()\
  \ {\n  console.log(\"====== Shopping Basket =========\");\n  for (var i = 0; i <\
  \ items.length; i++) {\n    console.log(items[i].count + \" \" + items[i].name +\
  \ \", \" + (items[i].price * items[i].count));\n  }\n  console.log(\" \");\n};\n\
  \nreturn basket;\n})();\n\nwindow.onload = function() {\n  basket.addItem(\"broccoli\"\
  , 1.49);\n  basket.addItem(\"pear\", 0.89);\n  basket.addItem(\"kale\", 2.38);\n\
  \  basket.addItem(\"broccoli\", 1.49);\n  basket.show();\n  basket.cost();\n  basket.removeItem(\"\
  broccoli\");\n  basket.cost();\n};\n```\n\n将此文件保存到你的 `/AdvJS` 文件夹中命名为 `basket.html`。在控制台中，将显示输出：\n\
  \n**观察：**\nYou have 1 of broccoli in your basket.\nYou have 1 of pear in your basket.\n\
  You have 1 of kale in your basket.\nYou have 2 of broccoli in your basket.\n======\
  \ Shopping Basket =========\n2 broccoli, 2.98\n1 pear, 0.89\n1 kale, 2.38\nYour\
  \ total cost is: 6.25\nYou have 1 of broccoli left in your basket.\nYour total cost\
  \ is: 4.76\n\n在我们的模块中，我们有两个私有变量：`basket`（我们作为模块值返回的对象）和 `items`（存储篮篮中物品的数组）。我们还有几个处理管理购物篮功能的私有函数：`addItem()`、`removeItem()`\
  \ 和 `cost()`。一旦模块创建完成，这些私有变量或函数对模块用户来说都是不可用的，除非通过公开 API，而该公开 API 是通过从 IIFE 中返回 `basket`\
  \ 对象并将结果存储在 `basket` 全局变量中创建的。\n\n请注意，我们对篮对象的局部变量和存储已完成模块的全局变量使用了相同的名称。这完全没有问题。\n\
  \n公开 API 是 `basket` 对象中方法的集合：`basket.addItem()`、`basket.removeItem()`、`basket.cost()`\
  \ 和 `basket.show()`。这些方法可以被使用 `basket` 模块的代码调用。\n\n浏览代码并确保你理解它是如何工作的以及它是如何使用模块模式（Module\
  \ Pattern）构建的。请记住，该模式是一种设计指南，而不是具体的实现，因此它根据你实现的特定模块的需求，在代码中以不同的方式表示。\n\n### 为什么不直接使用对象构造函数？\n\
  \n那么，既然你可以直接使用对象构造函数并实现相同的效果（如下所示），为什么要使用模块模式呢？\n\n**需要输入的代码：**\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n<title> Counter Constructor instead of Module Pattern </title>\n\
  <meta charset=\"utf-8\">\n<script>\nfunction CounterModule() {\n  var counter =\
  \ 0;\n  this.increment = function() {\n    counter++;\n  };\n  this.decrement =\
  \ function() {\n    counter--;\n  };\n  this.reset = function() {\n    counter =\
  \ 0;\n  };\n  this.getValue = function() {\n    return counter;\n  };\n};\n\nvar\
  \ counterModule;\nwindow.onload = function() {\n  counterModule = new CounterModule();\n\
  \  counterModule.increment();\n  counterModule.increment();\n  counterModule.decrement();\n\
  \  counterModule.increment();\n  console.log(counterModule.getValue());\n  counterModule.reset();\n\
  };\n</script>\n</head>\n<body></body>\n</html>\n```\n\n将此文件保存到你的 `/AdvJS` 文件夹中命名为\
  \ `module2.html`。在控制台中，显示的输出与我们之前的计数器模块版本相同：2。\n\n在这里，我们使用构造函数 `CounterModule()`\
  \ 来创建一个与之前完全相同类型的对象：一个具有一些公开方法的对象，用于管理计数器，而该计数器是一个私有变量（并且只能通过这些公开方法访问）。\n\n这两种方法的区别在于创建计数器的方式。如果我们使用构造函数，我们需要使用\
  \ `new CounterModule()` 来创建一个 `counterModule`（这是没可以的）。使用 `new` 来创建对象或使用模块模式来创建对象在本质上是相同的。\n\
  \n\n\n\n\n在本课程中，我们一直关注 JavaScript 的语言特性，但它的意义远于此，因为 JavaScript 运行在一个环境中。大多数情况下，该环境就是浏览器。当我们使用\
  \ JavaScript 通过添加新元素或设置样式来更新 DOM，或者从表单获取用户输入时，我们已经看到过 JavaScript 与浏览器之间的交互。在本节中，我们将仔细观察\
  \ JavaScript 如何与其环境进行交互，以及在浏览器中运行 JavaScript 时需要注意的事项。\n\n# 核心语言与环境扩展\n\nJavaScript\
  \ 创建于 1995 年（在互联网时代是很久以前的事了），专门为在 Netscape 浏览器中运行而设计；JavaScript 仍然主要是浏览器的语言。不过，它已经超越了浏览器的范围，最著名的作为\
  \ PDF 文档、OpenOffice、DX Studio、Logic Pro 等的脚本语言。此外，JavaScript 现在可以作为服务器端语言运行在 `Node.js`\
  \ 等环境中。\n\nJavaScript 运行在一个环境中，该环境通常是浏览器。根据 JavaScript 运行环境的不同，你有方法可以修改语言来操纵该环境。如果你在浏览器中运行\
  \ JavaScript，你会在获得基础语言之外之外获得额外的“东西”，这允许你从页面获取数据、操纵页面内容，甚至更改页面样式。\n\n你可以将 JavaScript\
  \ 视为由两部分组成的语言：核心语言以及由其运行环境提供的扩展。语言的核心是控制动作的语法和语义，例如你如何定义变量和函数、如何编写循环、如何调用函数、作用域如何工作等。\n\
  \n语言的扩展是由环境提供的部分。通常，这些部分是对象，为你提供一个 JavaScript 接口供你在环境中使用。对于浏览器来说，这指的是 `document`\
  \ 对象、`window` 对象以及随这些对象一起的所有属性和方法。\n\n在控制台中检查这些对象：\n\n![](img/Image00067.jpg)\n\n\
  ### 交互会话：\n\n```\nwindow\nWindow {top: Window, window: Window, location: Location,\
  \ external: Object, chrome: Object}\n```\n\n在 Chrome 中尝试一下。点击结果旁边的箭头，你将看到一个 `window`\
  \ 对象各种属性的长列表：\n\n![](img/Image00240.jpg)\n\n如果你在控制台中输入此内容，每个浏览器都会给你一个 `window` 对象的某种表示，但它们之间可能略有不同。\n\
  \n现在尝试 `document` 对象：\n\n![](img/Image00060.jpg)\n\n### 交互会话：\n\n```\ndocument #document\n\
  <!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 3.2 Final//EN\"> <html>...</</html>\n```\n\
  \n再次，展开 `#document` 旁边的箭头，即可看到 `document` 对象的显示。`document` 对象代表你的网页，所以当你打开它时，就能看到页的内容。\n\
  \n`document` 有许多你可以用于访问页面内容的属性和方法，如 `getElementById()` 等。要查看 `document` 拥有哪些属性，输入\
  \ `\"document\"` 并在后面跟一个点：\n\n![](img/Image00241.jpg)\n\n### 交互会话：\n\n```\ndocument.\n\
  ```\n\n如果你在 Chrome、Safari、Firefox 或 IE 中执行此操作，你将看到弹出的窗口，显示你之后可以输入的 `document` 所有属性：\n\
  \n![](img/Image00242.jpg)\n\n向下滚动列表，你将看到许多你熟悉的属性，以及许多你尚不熟悉的属性。\n\n`document` 对象是\
  \ `window` 对象的一个属性：\n\n### 交互会话：\n\n```\nwindow.document\n#document\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD HTML 3.2 Final//EN\"> <html>...</</html>\n```\n\n你用 JavaScript\
  \ 进行的所有与浏览器相关的操作都是 `window` 对象的属性。我们说 `window` 对象是全局对象或头对象，因为它让你访问所有用于操纵浏览器环境的其他对象。尝试在浏览器中输入这些属性名称并查看结果（我们在这里展示\
  \ Chrome 的结果）：\n\n![](img/Image00243.jpg)\n\n### 交互会话：\n\n```\nwindow.localStorage\n\
  Storage {2269ae85-adeb-40cb-aef0-c43e9b4940ea_popup_openPosition: \"{\"top\":184,\"\
  left\":270}\", 235486a4-943d-45a7-a1f4-31d1b4d6bae1_popup_openPosition: \"{\"top\"\
  :184,\"left\":314}\", 3437639f-10f2-4bd7-8e24-2314e5beeb6d_popup_openPosition: \"\
  {\"top\":184,\"left\":270}\", 3af686d4-ef0e-4ba4-a302-81bf2a8c23d6_popup_openPosition:\
  \ \"{\"top\":33,\"left\":2}\", 46c2259c-fa5e-4c41-8bf7-3973fc2f678e_popup_openPosition:\
  \ \"{\"top\":184,\"left\":270}\"...}\n\nwindow.navigator.geolocation\nGeolocation\
  \ {getCurrentPosition: function, watchPosition: function, clearWatch function}\n\
  \nwindow.JSON JSON {}\n```\n\n记住，由于 `window` 对象是全局对象，它也是默认对象，所以访问 `window` 对象的属性时不需要输入\
  \ `window`。例如，你可以写 `window.alert()` 或直接写 `alert()`，写 `window.JSON` 或 `JSON`。\n\n\
  你还可以直接在控制台中创建并检查元素，以查看浏览器中各种元素对象支持哪些属性。例如，如果你想查看 `<video>` 元素支持的属性，尝试这样做：\n\n![](img/Image00067.jpg)\n\
  \n### 交互会话：\n\n```\nvar media = document.createElement(\"video\") undefined\nmedia.\n\
  ```\n\n我们使用 `document.createElement()` 方法创建了一个 `<video>` 元素。一旦我们拥有该元素（在变量中，尚未添加到页面），我们就可以输入\
  \ `\"media\"` 后跟一个点来检查它。和之前一样，会弹出一个窗口，显示 `<video>` 元素支持的所有各种属性。列表中的某些属性和方法是其他元素或\
  \ `document` 对象不支持的。因为视频对象是一个 DOM 对象，它将继承所有元素对象都拥有的许多方法，但它也有诸如 `autoplay` 和 `loop`\
  \ 这样视频特有的属性（音频也具有许多与视频相似的属性）。\n\n# 浏览器如何运行 JavaScript 代码\n\n当 JavaScript 首次被添加到浏览器时，它纯粹是一种解释型语言。为了在你的网页中运行\
  \ JavaScript，浏览器会在页面加载时从上到下解释并执行你的 JavaScript。你代码的每一行都会由浏览器内部的其他代码解析并进行评估。浏览器的运行时环境包含了你所有的变量、函数等，所以如果你声明一个变量\
  \ `x` 并给它赋值 `3`，浏览器会在该运行时环境中创建一段存储空间，并将值 3 存储在那里。\n\n解释型语言通常比编译型语言（如 `C`、`C++`、`Java`\
  \ 和 `C#`）慢，因为它们在运行之前没有转换为机器码或进行优化。浏览器在到达下一行时解释每一行代码，并且按照你编写的方式解析每一行代码。\n\n出于这个原因，浏览器中的\
  \ JavaScript 以慢而闻名。然而，随着开发者开始扩展网页的使用方式，并创建更像应用程序而非静态文档的网页，浏览器开发者开始看到让 JavaScript\
  \ 变巨大优势。想想 Google Maps：我们希望地图运行得快，这样我们可以在地图上滚动、缩放，并让页面快速响应。\n\n浏览器开发者开始在浏览器中构建可以编译\
  \ JavaScript 代码的引擎（使用“即时”，即 JIT 编译器），将其转换为浏览器可以更快运行的特殊代码。例如，Chrome 的 `V8` JavaScript\
  \ 引擎会在浏览器执行代码之前将你的 JavaScript 编译为机器码。当浏览器编译代码时，它可以进行优化，使代码运行得更快。\n\n\n\n\n\n浏览器仍然从上到下运行你的代码（正如大多数运行时环境一样），因此你编写代码的方式没有改变。然而，浏览器处理你代码的方式发生了变化，这导致在运行\
  \ JavaScript 时速度有了巨大的提升，所以现在你可以在网页中编写运行快速的庞大应用程序（例如 Google 地图和邮箱、Facebook、Netflix\
  \ 和 Hulu、Evernote、Vimeo 和 YouTube 等许多应用）。\n\n![](img/Image00034.jpg)\n\n| 注意 | 若要了解更多关于浏览器中\
  \ JavaScript 引擎的工作原理，请查看 [JavaScript Engine](http://en.wikipedia.org/wiki/JavaScript_engine#JavaScript_engines)\
  \ 维基百科页面。 |\n\n![](img/Image00018.jpg)\n\n## 在你的页面中引入 JavaScript\n\n在页面中引入 JavaScript\
  \ 有两种方法：作为 HTML 页面中的嵌入脚本（使用 `<script>` 元素），以及指向外部脚本的链接。如果你将脚本（无论是嵌入脚本还是链接）放在页面顶部（通常在\
  \ `<head>` 元素中），JavaScript 将在浏览器解释你的 HTML 之前执行：\n\n![](img/Image00030.jpg)\n\n观察：\n\
  \n```html\n<!doctype html\n<html>\n<head>\n<title> </title>\n<meta charset=\"utf-8\"\
  >\n<script>\nvar x = 3;\n</script>\n</head>\n<body></body>\n\n</html>\n```\n\n或者\n\
  \n![](img/Image00128.jpg)\n\n观察：\n\n```html\n<!doctype html\n<html\n<head>\n<title>\
  \ </title>\n<meta charset=\"utf-8\">\n<script src=\"external.js\"> </script>\n</head>\n\
  <body></body>\n</html>\n```\n\n将你的代码放在页面的末尾，如下所示：\n\n![](img/Image00208.jpg) 观察：\n\
  \n```html\n<!doctype html\n<html\n<head>\n<title> </title>\n<meta charset=\"utf-8\"\
  >\n</head>\n<body>\n<div>\n其他 HTML 内容\n</div>\n<script>\nvar x = 3;\n</script>\n\
  </body>\n</html>\n```\n\n该代码将在页面其他部分加载且浏览器解释完 HTML 之后运行。\n\n我们以前建议你将 JavaScript\
  \ 添加到文档的 `<head>` 中，但最近有更多开发者建议你将 JavaScript 添加到底部，紧邻闭合的 `</body>` 标签。随着 JavaScript\
  \ 变得越来越大（对于更复杂的页面），下载、解析和执行 JavaScript 需要的时间越长，用户必须等待越久才能看到网页。两种方法都得通，但如果你正在编写带有大型\
  \ JavaScript 文件的复杂页面，你可能想测试你的页面，看看将 JavaScript 放在文件底部是否会带来更好的用户体验。\n\n将 JavaScript\
  \ 放在外部文件中有一个优势是：如果多个网页都使用该 JavaScript，浏览器将缓存该 JavaScript 文件，这样就不需要多次下载。这对于库文件尤为重要，例如\
  \ `jQuery` 或 `Underscore.js`，它们通常用于整个网站而不仅仅是一个页面。如果你为库使用知名的 URL（例如网站的托管 URL，甚至是\
  \ [Google 服务器上的某个 URL](https://developers.google.com/speed/libraries/?csw=1) ），那么用户的浏览器可能已经缓存了该文件，这将进一步缩短下载时间。\n\
  \n要查看将代码包含在页面 `<head>` 中和位于底之间的区别，请尝试以下操作：\n\n![](img/Image00150.jpg)\n\n需要输入的代码：\n\
  \n```html\n<!doctype html\n<html\n<head>\n<title> Script Testing </title>\n<meta\
  \ charset=\"utf-8\">\n<script>\nvar div = document.getElementById(\"div1\");\ndiv.innerHTML\
  \ = \"Testing when the browser loads a script\"; </script>\n</head>\n<body>\n<div\
  \ id=\"div1\"></div>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 将此保存到你的 `/AdvJS`\
  \ 文件夹中并命名为 `t est Load.ht ml`，然后 ![](img/Image00021.jpg)。 打开控制台。你会看到一条消息：`\"Uncaught\
  \ TypeError: Cannot set property 'innerHTML' of null.\"`\n\n现在将脚本移动到页面底部：\n\n![](img/Image00244.jpg)\
  \ 需要输入的代码：\n\n```html\n<!doctype html\n<html\n<head>\n<title> Script Testing </title>\n\
  <meta charset=\"utf-8\">\n<script>\nvar div = document.getElementById(\"div1\");\n\
  div.innerHTML = \"Testing when the browser loads a script\"; </script>\n</head>\n\
  <body>\n<div id=\"div1\"></div>\n<script>\nvar div = document.getElementById(\"\
  div1\");\ndiv.innerHTML = \"Testing when the browser loads a script\"; </script>\n\
  </body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00036.jpg)。现在控制台中没有错误，页面显示了消息。\n\
  \n因为浏览器是从上到下评估页面的，在第一个版本中，当浏览器执行你的脚本时，DOM 准备好。在第二个版本中，DOM 已经构建完成，你正在修改的 `<div>`\
  \ 在 DOM 中，因此脚本可以工作。如果你希望将脚本放在文档的 `<head>` 中，请确保任何使用或操作 DOM 的代码都是从 `windo w.o nlo\
  \ ad` 事件处理程序内部调用的。如果你学习 JavaScript 有段时间了，你已经知道这一点，但值得重申，因为这很重要。\n\n## JavaScript\
  \ 事件循环\n\n一旦浏览器在加载页面时从上到下执行了你的代码，它就会进入事件循环。这个循环是浏览器内部的。它基本上是一个等待事件发生的循环。如果你移动鼠标、点击某个元素或从另一个网站请求数据，就会生成一个事件。浏览器也有内部事件。例如，当浏览器完成页面加载时，它会生成\
  \ `\"load\"` 事件，如果你定义了它，它将导致你的 `windo w.o nlo ad` 事件处理程序执行。\n\n当事件发生时，浏览器会检查你是否为该事件定义了事件处理器；如果有，就会运行该函数。函数完成后，浏览器将再次开始事件循环。只要网页加载着，这个事件循环就会持续。\n\
  \n在执行的这个阶段（即浏览器等待事件的阶段），事件可能随时时候发生，而不是按照特定的顺序。你可以通过编写占用浏览器过多处理能力的代码来干扰事件处理。请看下面的代码。\n\
  \n![](img/Image0032.jpg)\n\n可以随意输入下面的代码并尝试，但要警告你的是——你可能需要关闭浏览器。如果是这样，我们建议使用与你阅读课程时不同的浏览器。\n\
  \n![](img/Image0018.jpg) 需要输入的代码：\n\n```html\n<!doctype html\n<html\n<head>\n<title>\
  \ Script Testing </title>\n<meta charset=\"utf-8\">\n<script>\nwindow.onload = function()\
  \ {\ndocument.onclick = function() {\nalert(\"You clicked on the web page!\");\n\
  }\nvar div = document.getElementById(\"div1\");\nfor (var i = 0; i < 100000000000;\
  \ i++) {\ndiv.innerHTML += i + \",\";\n}\n\n}\n</script>\n</head>\n<body>\n<div\
  \ id=\"div1\"></div>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 将此保存到你的 `/AdvJS`\
  \ 文件夹中并命名为 `script Erro r.ht ml`，然后 ![](img/Image00021.jpg)。你可能会得到一个类似下面的（来自 Firefox）\"\
  unresponsive script\"` 对话框：\n\n![](img/Image00246.jpg)\n\n如果是，选择停止脚本选项，可能会重新获得浏览器的控制权。然而，你的浏览器可能会完全无响应。在这种情况下，你可以在\
  \ Mac 上通过按下 `Opt ion+Co mmand+Escape`（同时按下）强制退出浏览器，选择无响应的浏览器并选择 `Fo rce quit`。在\
  \ Windows 中，在任务栏上右键点击，选择 `St art T Ask Manager`，选择浏览器应用程序并选择 `End T ask`。\n\n让我们逐步分析代码查看发生了什么：\n\
  \n![](img/Image00131.jpg) 观察：\n\n```javascript\nwindow.onload = function() {\ndocument.onclick\
  \ = function() {\nalert(\"You clicked on the web page!\");\n}\nvar div = document.getElementById(\"\
  div1\");\nfor (var i = 0; i < 100000000000; i++) {\ndiv.innerHTML += i + \",\";\n\
  }\n\n}\n```\n\n首先，我们现在 `windo w.o nlo ad` 事件处理程序中运行所有代码。这在浏览器完成页面加载后运行，因此我们可以安全地访问\
  \ DOM。\n\n\n\n\n\n我们在 `document` 上设置了一个点击事件处理程序。这意味着你在页面上的任何地方点击都会触发此事件。一旦设置完成，我们从页面中获取\
  \ `\"div1\"` 对象，然后开始一个循环，使用 `innerHTML` 向 `<div>` 标签的内容中连续添加整数。然而，循环的终点是一个非常大的数字。即使对于快速的计算机来说，这个循环也将花费很长时间。\n\
  \n现在，如果你愿意，可以尝试点击页面。浏览器正忙于执行该循环，在你看到浏览器错误之前，它可能一段时间都不会识别出该事件（如果它能识别的话的话）。\n\n将上面的非常大的数字改为\
  \ 10,000：\n\n![](img/Image00044.jpg)\n\n需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title> Script Testing </title>\n<meta charset=\"utf-8\">\n<script>\nwindow.onload\
  \ = function() {\ndocument.onclick = function() {\nalert(\"You clicked on the web\
  \ page!\");\n}\nvar div = document.getElementById(\"div1\");\nfor (var i = 0; i\
  \ < 10000 ; i++) {\ndiv.innerHTML += i + \",\";\n}\n}\n</script>\n</head>\n<body>\n\
  <div id=\"div1\"></div>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)\
  \ 。在页面加载后立即点击网页。你可能需要等待一会儿，但你最终会收到一个弹窗。\n\n## 事件队列\n\n所以，浏览器完成循环仍然需要一小时间，但它最终会完成，并对你的点击做出响应。即使你在循环完成之前点击了页面，浏览器也不会忘记该事件，因为每当浏览器中发生事件时，该事件就会被添加到事件队列中。浏览器按照事件发生的顺序处理这些事件。\n\
  \n事件队列确保了即使发生了多个事件，并且其中某些事件的句程序执行需要一些时间，浏览器最终也能处理所有事件（除非某个事件处理程序耗时过长，导致浏览器显示无响应脚本对话框，或者事件处理程序发生错误导致你的浏览器完全停止执行脚本）。\n\
  \n## 异步编程\n\n假设你编写了一个脚本，为鼠标点击设置了点击处理程序，并使用 `XHR`（`XMLHttpRequest`，也称为 Ajax）发送请求以获取更多数据。你获取更多数据的请求可能立即启动，但如果获取数据需要一段时间，那么在接收数据后调用的事件处理程序将在一段时间后执行。在此期间，你可以多次点击鼠标，你的鼠标点击事件处理程序将会执行。\n\
  \n你创建的获取更多数据的 `XHR` 请求是异步执行的。也就是说，在等待从 `XHR` 请求获取数据时，浏览器允许你执行其他事情。事实上，在等待数据时，浏览器返回执行事件循环，以便响应其他事件。当你最终通过\
  \ `XHR` 获取数据时，你的 `XHR` 事件处理程序将被执行。对比浏览器处理同步循环（如我们上面创建的）的方式与处理 `XHR` 等异步请求的方式：循环会阻塞事件循环，而\
  \ `XHR` 请求不会。\n\n这是一个使用 `XHR` 为你的应用程序获取数据的简单示例。它还设置了一个点击处理程序：\n\n![](img/Image00247.jpg)\n\
  \n需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title> XHR Asynchronous\
  \ Request </title>\n<meta charset=\"utf-8\">\n<script>\nwindow.onload = function()\
  \ {\ndocument.onclick = function() {\nalert(\"You clicked on the web page!\");\n\
  }\nvar request = new XMLHttpRequest(); \nrequest.open(\"GET\", \"data.json\"); \n\
  request.onreadystatechange = function(response) {\nvar div = document.getElementById(\"\
  div1\");\nif (this.readyState == this.DONE && this.status == 200) { \nif (response\
  \ != null) {\ndiv.innerHTML = this.responseText;\n}\nelse {\ndiv.innerHTML += \"\
  <br>Error: Problem getting data\";\n}\n}\nelse {\ndiv.innerHTML += \"<br>Error:\
  \ \" + this.status;\n}\n}\nrequest.send();\n}\n</script>\n</head>\n<body>\n<div\
  \ id=\"div1\"></div>\n</body>\n</html>\n```\n\n如果你想尝试这段代码并查看这些事件的运行，![](img/Image00042.jpg)\
  \ 将文件保存在你的 `/AdvJS` 文件夹中命名为 `eventQueue.html`。在同一文件夹中创建一个名为 `data.json` 的文件。你可以在文件中放入任何\
  \ JSON 数据，如下所示：\n\n![](img/Image00076.jpg)\n\n观察：\n```json\n[ \"test data\" ]\n\
  ```\n\n![](img/Image00021.jpg) 预览 `eventQueue.html` 文件。`[\"test data\"]` 出现在网页上。你可以点击页面来查看弹窗。\n\
  \n我们的数据很小，所以获取不需要花费太多时间，浏览器加载你的 JSON 数据的速度快到让你无法在它完成之前点击页面。尽管如此，你从代码中可以看到我们设置了两个事件：一个会在你每次点击鼠标时发生，另一个会在文件\
  \ `\"data.json\"` 中的数据被获取后发生。我们无法知道哪一个会先发生（但我们可以做一个合理的推测，因为你点击鼠标的速度没那么快）。如果你从未点击鼠标，那么鼠标点击事件将永远不会发生。\n\
  \n如果你将此处的少量数据替换为大量数据，你可能延迟加载足够长的时间来点击鼠标。如果你愿意，可以尝试一下。\n\n记住，浏览器中的 JavaScript 是事件驱动的；一旦浏览器在第一阶段（加载页面时）加载并执行了你的代码，第二阶段就会响应事件，这使得你的网页具有交互性。\n\
  \n还要记住，某些操作（如 `XHR` 请求）是异步执行的。我们设置 `XHR` 事件处理程序的方法与其他类型的事件处理程序相同：通过将函数赋值给对象的属性，在这种情况下，是\
  \ `XMLHttpRequest` 对象。当 `XHR` 请求请求的数据返回浏览器时，事件处理程序会被调用。我们无法确切知道事件何时发生，而且因为浏览器在等待数据时不会停止事件循环，我们可以继续与浏览器交互。\n\
  \n## 浏览器之外的环境中的 JavaScript\n\n你在浏览器中使用 JavaScript，但你在本课程中学学的很多内容也适用于其他环境中的 JavaScript。例如，如果你正在为\
  \ Photoshop 编写 JavaScript 脚本，访问 Photoshop 环境的主要入口是 `app` 对象。更多关于为 Photoshop 编写 JavaScript\
  \ 的信息，请查看此处链接：[`www.adobe.com/devnet/photoshop/scripting.html`](http://www.adobe.com/devnet/photoshop/scripting.html\
  \ 。当然，其他 Adobe 产品也提供脚本功能。\n\n另一个日益流行的 JavaScript 环境是 [Node.js](http://nodejs.org/api/)。`Node.js`\
  \ 允许你在命令行运行 JavaScript，你可以使用 `Node.js` 提供网页服务并运行网络服务。如果你下载并安装了 Node.js，可以通过命令行中运行\
  \ `node` 来对其进行实验。就像使用 JavaScript 控制台一样与它交互，只是你没有所有内置的浏览器对象；相反，你将拥有内置的 `Node.js`\
  \ 对象。这里来自我自己电脑的一个示例交互会话（除非安装了 Node.js，否则你无法重现这一点，这对于本课程并不是必要的；我们展示此会话以防你感兴趣）：\n\n\
  ![](img/Image00248.jpg)\n\n交互会话：\n```bash\n[elisabeth-robsons-mac-pro]% node\nvar\
  \ i = 3; undefined\ni\n3\nconsole.log(\"i is \" + i) i is 3\nundefined\nrequire(\"\
  os\")\n{\nendianness: [Function],\nhostname: [Function],\nloadavg: [Function],\n\
  uptime: [Function],\nfreemem: [Function],\ntotalmem: [Function],\ncpus: [Function],\n\
  type: [Function],\nrelease: [Function],\nnetworkInterfaces: [Function],\narch: [Function],\n\
  platform: [Function],\ntmpdir: [Function],\ntmpDir: [Function],\ngetNetworkInterfaces:\
  \ [Function: deprecated],\nEOL: '\\n'\n}\nos.arch()\n'x64'\nos.uptime()\n28466\n\
  ```\n\n\n\n\n如你所见，本节的第一部分看起来和浏览器的 JavaScript 控制台会话完全一样。\n\n然而，在进行一半时，我们写了 `require(\"\
  os\")`。这加载了一个 `Node.js` 模块，它就是一个 JavaScript 代码库（类似于在网页中引用了像 `jQuery` 这样的库）。一旦我们加载了这个模块，我们就可以访问另一个对象\
  \ `os`，它可以提供有关我们正在运行 `Node.js` 的操作系统的信息。JavaScript 在浏览器中无法做到这一点，因为浏览器中的 JavaScript\
  \ 运行在沙箱中：这是浏览器的一个特殊区域，保护你的系统免受下载到浏览器中执行的任何代码（这有助于防止 JavaScript 病毒）。\n\n如果你想探索另一个\
  \ JavaScript 环境，你会发现可以将目前学的大部分信息应用到该环境中，但你也需要学习该环境的扩展，以理解如何在该环境中使用 JavaScript。\n\
  \n浏览器提供的用于操作浏览器的 JavaScript 对象很大程度上是基于 [W3C](http://w3.org)（万维网联盟）编写的规范。虽然大多数浏览器厂商同意，如果浏览器支持相同的功能，我们将受益（这样我们就不需要为不同的浏览器编写不同的代码），但各种浏览器制造商总是在想出酷酷的新功能。其中一些功能进入了规范并被其他浏览器实现，而另一些则没有。\n\
  \n我们在本课程中讨论过的所有浏览器扩展都受到了所有主流浏览器的最新版本的支持。要使用正在加入浏览器的前沿功能，请测试这些功能，可以通过你自己编写测试代码，或者使用像\
  \ [Modernizr](http://modernizr.com) 这样的 JavaScript 库。针对功能而非特定浏览器进行测试可以确保你的代码具有向前兼容：也就是说，如果用户现在没有支持该功能的浏览器，他们将来可能会，因此你的\
  \ Web 应用程序对他们有效。\n\n库，如 [jQuery](http://jquery.com) 和 [Underscore.js](http://underscorejs.org)（以及许多其他），也可以帮助浏览器兼容性。这些库提供了所谓的“垫片（shims）”，为并非所有浏览器都支持的功能提供回退行为。\n\
  \n要了解更多关于（很大程度上）决定浏览器支持哪些功能的规范，请查看 [W3C TR 页面](http://www.w3.org/TR/)（从 DOM、DOM\
  \ 事件和 JavaScript API TR 开始，并继续向下查看）。此外，每个浏览器厂商都会在其网站上提供关于其各个独立浏览器所支持功能的文档：\n\n[Safari\
  \ Developer Center](https://developer.apple.com/devcenter/safari/index.action)\n\
  ![](img/Image00006.jpg)\n\n[MDN Developer Network](https://developer.mozilla.org/en-US/)\n\
  ![](img/Image00006.jpg)\n\n[Chrome Developer Site](https://developers.google.com/chrome/)\n\
  ![](img/Image00006.jpg)\n\n[IE Developer Site](http://msdn.microsoft.com/en-us/ie/aa740469.aspx)\n\
  ![](img/Image00006.jpg)\n\n[Opera Developer Site](http://www.opera.com/developer)\n\
  ![](img/Image00006.jpg)\n\n## ECMAScript 5.1\n\n### 课程目标\n\n当你完成本课时，你将：\n- 描述 JavaScript\
  \ 基础的最新版本标准 `ECMAScript 5.1`。\n![](img/Image00006.jpg)\n- 使用 `strict mode`（严格模式）防止常见错误。\n\
  ![](img/Image00006.jpg)\n- 探索 `ES5` 中添加的新方法。\n![](img/Image00006.jpg)\n- 使用对象属性描述符控制对对象的访问。\n\
  ![](img/Image00006.jpg)\n- 根据你自己的原型创建对象。\n![](img/Image00005.jpg) ![](img/Image00006.jpg)\n\
  \n### JavaScript 的 ECMAScript 标准\n\nJavaScript 有一段[复杂的历史](http://www.w3.org/community/webed/wiki/A_Short_History_of_JavaScript)，但好消息是，所有主流浏览器现在（多程度上）都支持标准的\
  \ JavaScript 版本。有了核心语言标准和浏览器扩展标准（正如我们在上一节课中讨论过的），现在使用 JavaScript 比以前要好得多，那时我们还必须为每个不同的浏览器编写不同的\
  \ JavaScript。那真是一团糟！\n\n核心 JavaScript 语言的标准被描述在 `EMCAScript` 规范中，该规范由 `ECMA International`\
  \ 组织维护，它是一个面向信息和通信系统的国际性的、私有的（基于成员制）、非营利标准组织。JavaScript `ECMAScript` 标准的当前版本是 `5.1`。你可以在\
  \ [`www.ecma-international.org/publications/standards/Ecma-262.htm`](http://www.ecma-international.org/publications/standards/Ecma-262.htm)\
  \ 找到该标准的规范 [[PDF]。（一个](http://www.ecma-international.org/publications/standards/Ecma-262.htm)\
  \ [HTML 版本](http://www.ecma-international.org/ecma-262/5.1/) 同样可用）。]\n\n标准的 `5.1`\
  \ 版本（我们通常称之为 `ES5`）于 2011 年完成；主流浏览器今天已实现了该标准的大部分。幸运的是，`5.1` 版本与之前的版本（`3.1`；别问版本\
  \ `4` 怎么了）完全向下兼容，所以你不需要遗忘任何东西来学习 `5.1` 版本中的新内容。这里有一份方便的[兼容表](http://kangax.github.io/es5-compat-table/)，描述了浏览器对各种\
  \ `ES5` 功能的支持情况。我们将在本课中对这些功能中的一些进行实验，因此请确保你安装了最喜爱浏览器的最新版本。\n\n语言的 `ES5` 版本有很多相当细小的变化，对\
  \ `Objects` 有一些有趣的添加，以及一个我们将探索的新 `strict mode`。请记住，语言规范是针对核心语言，不涉及我们在上一节课中探索的浏览器扩展。\n\
  \n### 严格模式 (Strict Mode)\n\n尽管我们刚刚说了不需要为 `ES5` 遗忘任何东西，但在 JavaScript 中，你可以做一些你真的不应该被允许做的事。（你在本课程中没有做这些事，但了解它们对你是有主意的。）这些特殊用法中的某些在\
  \ `ES5` 中被废弃了。这意味着它们在语言中不再被支持，但浏览器仍然允许你这样做（作为与标准上一个版本的向兼容的一部分）。这里有一个例子：\n\n![](img/Image00203.jpg)\n\
  \n要输入的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title> </title>\n<meta charset=\"\
  utf-8\">\n<script>\nmyVar = \"I'm not declared!\";\n</script>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n![](img/Image00042.jpg) 将其保存在你的 `/AdvJS` 文件夹中并为 `strict.html`，![](img/Image00021.jpg)\
  \ 。打开控制台并输入所示命令：\n\n![](img/Image00069.jpg) 交互会话：\n\n```js\nmyVar\n\"I'm not declared!\"\
  \n```\n\n你看到了变量 `myVar` 中字符串的值。这段代码的问题在于你没有声明变量 `myVar`。正如我们在课程早些时候讨论的那样，这是不好的。我们总是希望你声明变量。此外，尽量尽量减少你使用的全局变量数量。\n\
  \nES5 引入了一种新模式，称为 `strict mode`（严格模式），帮助你捕获这些错误。当你处于严格模式时，你不能给未声明的变量赋值。以下是是将你的代码放入严格模式的方法：\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title> </title>\n<meta charset=\"utf-8\"\
  >\n<script>\n\"use strict\";\nmyVar = \"I'm not declared!\";\n</script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)\
  \ 。在控制台中你看到这个错误（如果你使用的是 Chrome 的浏览器，则看到类似的）：\n\n![](img/Image00076.jpg)\n\n观察：\n\
  \n```\nUncaught ReferenceError: myVar is not defined\n```\n\n\n\n\n在严格模式（strict\
  \ mode）下，你不允许犯这种错误。要修复此错误，请在变量前添加 `\"var\"` 关键字：\n\n![](img/Image00249.jpg)\n\n\
  需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title> </title>\n<meta charset=\"\
  utf-8\">\n<script>\n\"use strict\";\nvar myVar = \" I'm not I am declared!\";\n\
  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)\
  \ 。在控制台中，你再也不会看到错误，并且你可以输入 `\"myVar\"` 并看到它的值。\n\n你可以在全局层级上使用 `\"use strict\"`，也可以也可以在单个函数内部使用。如果你在全局级别放置\
  \ `\"use strict\"`，它会影响你所有的代码。如果你只把它放在函数内部，它将只会影响该函数内部的代码。因此，你可以将所有的严格模式代码放入一个 IIFE（立即执行函数表达式）中，如下所示：\n\
  \n![](img/Image00250.jpg) 需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title> </title>\n<meta charset=\"utf-8\">\n<script>\n\"use strict\";\nvar myVar\
  \ = \"I am declared!\";\n(function() {\n\"use strict\";\ninnerMyVar = \"I'm not\
  \ declared in this function either.\";\n})();\n</script>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n![](img/Image00087.jpg) 和 ![](img/Image00036.jpg) 。在控制台中，你会看到一个引用错误（reference\
  \ error）。你可以通过在变量 `innerMyVar` 前添加 `\"var\"` 来修复它。\n\n让我们看看严格模式帮助防止错误的另一种另一种方法：\n\
  \n![](img/Image00251.jpg) 需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title> </title>\n<meta charset=\"utf-8\">\n<script>\n(function() {\n\"use strict\"\
  ;\nvar innerMyVar = \"I'm not declared in this function either.\";\nvar o = {\n\
  \    3,\n    10\n};\n})();\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n\
  我们添加了一个对象 `o`，并在对象定义中定义了两次属性 `o.x`。让我们看看在严格模式下会发生什么。![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)\
  \ 。在控制台中，你看到一个错误（在 Chrome 中）：\n\n![](img/Image00043.jpg)\n\n观察：\nUncaught SyntaxError:\
  \ Duplicate data property in object literal not allowed in strict mode\n\n在此之前，在对象中定义两次相同的属性是完全允许的（尽管这不是个好主意）。尝试一下看看会发生什么（你可以通过用\
  \ `//` 注释掉 `\"use strict \"` 行来尝试）。在严格模式下，我们不能再这样做，浏览器会生成一个描述该问题的错误。\n\n严格模式可以帮助你编写更整洁、更好的代码。严格模式还将帮助你完成其他任务；更多信息请查阅\
  \ [MDN 开发者网络上的严格模式页面](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions_and_function_scope/Strict_mode)。\n\
  \n我们告诉浏览器使用严格模式的方式看起来可能有点奇怪；毕竟，它只是一个字符串，`\"use strict.\"`。\n\n你认为为什么语言设计师决定这样做？\n\
  \n他们这样做是为了让不支持严格模式的旧浏览器能够安全地忽略该语句。对于旧浏览器来说，`\"use strict\"` 仅仅是一个字符串，完全不会影响你代码的运行方式。对于较新的浏览器，当然，这个字符串会导致浏览器进入严格模式。这意味着你可以在代码中使用严格模式，而无需担心旧浏览器无法运行这些代码。然而，如果你在页面中链接了多个脚本，请务必注意。如果所有脚本都是严格的，或都是非严格的，你可以将它们合并，但你不能将两者混合！在链接它们之前，请确保你了解所有脚本的模式。\n\
  \n## 新方法\n\n语言中的对象中添加了一些新方法。让我们来看看其中一些最实用的方法。\n\n对于字符串，`trim()` 方法现在是语言的一部分。浏览器已经实现它一段时间了。实用的\
  \ `trim()` 方法可以移除字符串开头和结尾的空白字符：\n\n![](img/Image00059.jpg)\n\n交互式会话：\n```\n| > var\
  \ s = \"   Lots of white space here | \";\n| undefined | |\n| > s | \" | |\n| \"\
  \ | Lots of white space here | |\n| > | s.trim() | | \"Lots of white space here\"\
  \n```\n\n很棒！你可以自己实现一个 `trim()` 函数，正如你在之前的项目中所看到的那样，但将其内置语言中要好得多。\n\n还有一些新的数组方法：\n\
  \n![](img/Image00061.jpg)\n\n交互式会话：\n```\n      var a = [1, 2, 3]; undefined\n \
  \     a\n[1, 2, 3]\n      a.forEach(function(x, i, a) { a[i] = x + 1; }); undefined\n\
  \      a\n[2, 3, 4]\n```\n\n在这里，我们定义了一个数组 `a`，然后使用 `forEach()` 方法对数组的每个元素应用函数。（这可能让你觉得很熟悉，因为你在课程早些时候已经实现了自己的\
  \ `forEach()` 函数。）`forEach()` 接收一个函数，并将该函数应用于数组的每个元素以对其修改。该函数的三个参数是 `x`（正在应用于函数的当前数组项的值）、`i`（当前数组项的索引）和\
  \ `a`（数组本身）。我们的函数为数组中的每个项加 1。注意 `forEach` 方法不返回任何内容，但在（严格模式下）它会修改数组。现在让我们试试 `map()`\
  \ 方法：\n\n![](img/Image00059.jpg)\n\n交互式会话：\n```\n| > a.map(function(x) { return\
  \ x * 2; }); undefined\n| > a\n[4, 6, 8]\n```\n`map()` 将函数应用于每个项，并创建一个包含值的新数组。ES5\
  \ 定义了其他几个数组方法，包括 `isArray()`、`every()`、`filter()` 和 `reduce()`。\n\n## 对象描述符\n\n\
  在 ES5 中，对象变得稍微复杂了。幸运的是，你不需要改变创建对象的方式。对象的一个大变化是对象属性现在带有一个属性描述符（property descriptor）。事实上，假设你正在使用实现\
  \ ES5 标准的浏览器，你在本课程中创建的对象都有属性描述符。\n\n![](img/Image0060.jpg)\n\n交互式会话：\n```\n| > var\
  \ o = { x: 1 } undefined\n| > Object.getOwnPropertyDescriptor(o, \"x\")\nObject\
  \ { value: 1, writable: true, enumerable: true, configurable: true }\n```\n我们定义了一个简单对象\
  \ `o`，只有一个属性 `o.x`，其值为 1。然后我们使用 `Object` 方法（记住，它是所有对象的父对象）`Object.getOwnPropertyDescriptor()`\
  \ 来获取属性 `x` 的属性描述符。我们将对象和属性名称（作为字符串）作为参数传递给方法，并返回属性描述符。\n\n属性描述符显示属性的值，以及 `writable`、`enumerable`\
  \ 和 `configurable` 属性的值。让我们这些这些属性。\n\n如果 `writable` 为 `true`，你可以更改属性的值：\n\n![](img/Image0060.jpg)\n\
  \n交互式会话：\n```\n| > o.x = 10\n10\n| > o\nObject { x: 10 }\n```\n正如你预期的那样，这是默认行为。那么，如果你想更改它呢？你有几种方法可以做到。一种是使用\
  \ `Object` 方法 `Object.defineProperty()` 直接修改属性描述符的属性。我们现在尝试这种方法，但稍后我们会看一种更简单的方法来更改对象以防止其属性不可写。\n\
  \n![](img/Image0059.jpg)\n\n交互式会话：\n```\n| > Object.defineProperty(o, \"x\", { writable:\
  \ false }); Object { x: 10 }\n| > o.x = 20;\n20\n| > o.x\n10\n```\n\n\n\n\n\n`Object.defineProperty()`\
  \ 方法接受三个参数：你想要修改属性的属性、属性名（注意这是一个字符串），以及一个包含你想要修改的属性的对象。在这种情况下，我们传递了一个将 `writable`\
  \ 属性设置为 `false` 的对象。然后我们尝试将属性 `o.x` 的值改为 `20`，但我们无法做到这一点；`o.x` 的值仍然是 `10`。注意，我们并没有得到错误！赋值只是被忽略了。这是因为我们没有在控制台中使用严格模式。让我们尝试在严格模式下执行相同的操作。按照所示所示修改\
  \ `strict.xml`：\n\n![](img/![](Image00252.jpg)\n\n需要键入的代码：\n\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n<title> </title>\n<meta charset=\"utf-8\">\n<script>\n\
  (function() {\n\"use strict\";\nvar innerMyVar = \"I'm not declared in this function\
  \ either.\";\nvar o = {\n    3 ,\n         10\n};\nObject.defineProperty(o, \"x\"\
  , { writable: false }); o.x = 20;\n})();\n</script>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n在这里，我们定义了一个对象 `o`，修改属性 `x` 使其变得不可写，然后尝试将 `x` 的值设置为 `20`。![](img/Image00042.jpg)\
  \ 和 ![](img/Image00036.jpg)。在控制台中，你会看到这个错误（在 Chrome 中）：\n\n![](img/Image00043.jpg)\n\
  \n观察结果：\nUncaught TypeError: Cannot assign to read only property 'x' of #<Object>\n\
  \n因此，在严格模式下，尝试设置一个不可写属性的值将生成一个错误；如果你不在严格模式下，赋值将失败，但你不会得到错误（并且你的代码将继续执行）。我们将继续在控制台中操作，但我们会注明在控制台中被忽略的操作在严格模式下何会产生错误。\n\
  \n请记住，当你使用 `Object.defineProperty()` 修改属性的属性时，你并不是在修改整个对象的属性；你只是在修改对象中特定属性的属性。你添加到对象的每个属性都将有自己的一套属性。让我们尝试向以下对象添加新属性：\n\
  \n![](img/Image00071.jpg)\n\n交互式：\n```javascript\nvar o = { x: 10 } undefined\n\
  Object.defineProperty(o, \"x\", { writable: false }); Object {x: 10}\no.y = 20;\n\
  20\no\nObject.getOwnPropertyDescriptor(o, \"x\");\nObject { value: 10, writable:\
  \ false , enumerable: true, configurable: true }\nObject.getOwnPropertyDescriptor(o,\
  \ \"y\");\nObject { value: 20, writable: true , enumerable: true, configurable:\
  \ true }\n```\n\n首先我们向 `o` 添加了一个新属性；这像往常一样工作。然后我们显示这两个属性的描述符。你可以看到 `o.x` 不是可写的，而\
  \ `o.y` 是（因为 `writable` 默认是 `true`）。\n\n好了，我们探索了 `writable` 属性，现在 `enumerable` 呢？这个属性表示当在你遍历对象的属性时（或使用其中一个新的\
  \ `Object` 方法显示属性时），你可以枚举该属性。让我们尝试一下：\n\n![](img/Image00059.jpg)\n\n交互式：\n```javascript\n\
  o\nfor (var prop in o) { console.log(prop); }\nx y\n⋖ undefined\n```\n\n我们的对象 `o`\
  \ 有两个属性，目前它们都是可枚举的（回看上面两个属性的 `enumerable` 属性，你会发现两个属性值都是 `true`）。这意味着当我们通过上面的 `for`\
  \ 循环遍历对象中的所有属性名来枚举它们时，我们可以看到两个属性名。\n\nES5 添加了另外两个枚举对象属性名的方法：`Object.keys()` 和 `Object.getOwnPropertyNames()`。让我们尝试这两种方法来枚举\
  \ `o` 中的属性名：\n\n![](img/Image00060.jpg)\n\n交互式：\n```javascript\nObject.keys(o);\
  \ [\"x\", \"y\"]\nObject.getOwnPropertyNames(o); [\"x\", \"y\"]\n```\n\n在两种情况下，结果都是一个属性名的数组。这些获取对象属性名的新方法（在\
  \ ES5 中添加）实际上非常高效。当你使用它们时，不需要编写循环来访问每个属性名。\n\n现在，让我们尝试将 `o.y` 属性的 `enumerable` 属性设置为\
  \ `false`：\n\n![](img/Image00124.jpg)\n\n交互式：\n```javascript\nObject.defineProperty(o,\
  \ \"y\", { enumerable: false }); Object { x: 10 }\no\nObject.getOwnPropertyDescriptor(o,\
  \ \"y\");\nObject { value: 20, writable: true, enumerable: false , configurable:\
  \ true }\nObject.keys(o);\n[\"x\"]\nObject.getOwnPropertyNames(o); [\"x\", \"y\"\
  ]\n```\n\n首先，我们把 `o.y` 的 `enumerable` 属性设置为 `false`。你可以立即看到，当我们显示对象时，不再看到 `y` 属性了。这意味着\
  \ `Object.toString()` 方法无法“看到”不可枚举的属性。\n\n我们获取 `o.y` 的属性描述符，发现 `enumerable` 属性确实被设置为\
  \ `false`。当我们使用 `Object.keys()` 方法获取对象 `o` 中的属性名时，在结果数组中我们不再看到 `\"y\"` 了。所以 `Object.keys()`\
  \ 方法也无法“看到”不可枚举的属性。\n\n最后，我们使用 `Object.getOwnPropertyNames()` 方法获取属性名，再次在结果中看到了\
  \ `\"y\"`。\n\n所以，我们有一种方法可以在显示对象时隐藏属性名，或者在尝试使用 `Object.getOwnPropertyNames()` 之外的任何方法枚举属性名时。\n\
  \n现在，让我们来看看 `configurable` 属性。一旦你将此属性设置为 `false`，你就无法将其改回，因为该属性不再是可配置的。如果一个属性不可配置的，它就无法从对象中删除。\n\
  \n![](img/Image00091.jpg)\n\n交互式：\n```javascript\no.z = 3;\nObject.defineProperty(o,\
  \ \"z\", { configurable: false }); Object {x: 10, z: 3}\no.z = 4;\n4\ndelete o.z;\n\
  TypeError: Cannot delete property 'z'\n```\n\n首先，我们添加一个新属性 `o.z` 并将其 `configurable`\
  \ 属性设置为 `false`。我们仍然可以更改属性的值，我们确实这样做了（设置为 `4`），但我们无法删除该属性，无法将其 `configurable` 属性设回\
  \ `true`。\n\n![](img/Image0034.jpg) 对象的密封与冻结\n\n你有两种快捷方法可以设置属性属性并帮助保护你的对象。\n\n第一个是\
  \ `Object.seal()`。该方法将对象中每个属性的 `configurable` 属性设置为 `false`，并且不允许向对象添加任何新属性。你仍然可以读取、写入和枚举对象中的属性；你只是不能删除属性或添加新的。\n\
  \n![](img/Image00253.jpg) 交互式：\n```javascript\nvar myObject = {\nname: \"Elisabeth\"\
  ,\ncourse: \"Advanced JavaScript\",\nyear: 2013\n};\nundefined\nmyObject\nObject\
  \ {name: \"Elisabeth\", course: \"Advanced JavaScript\", year: 2013}\nObject.getOwnPropertyDescriptor(myObject,\
  \ \"name\");\nObject {value: \"Elisabeth\", writable: true, enumerable: true, configurable:\
  \ true }\nObject.getOwnPropertyDescriptor(myObject, \"course\");\nObject {value:\
  \ \"Advanced JavaScript\", writable: true, enumerable: true, configurable: true}\n\
  Object.getOwnPropertyDescriptor(myObject, \"year\");\nObject {value: 2013, writable:\
  \ true, enumerable: true, configurable: true}\nObject.seal(myObject);\nObject {name:\
  \ \"Elisabeth\", course: \"Advanced JavaScript\", year: 2013}\nObject.getOwnPropertyDescriptor(myObject,\
  \ \"name\");\nObject {value: \"Elisabeth\", writable: true, enumerable: true, configurable:\
  \ false}\nObject.getOwnPropertyDescriptor(myObject, \"course\");\nObject {value:\
  \ \"Advanced JavaScript\", writable: true, enumerable: true, configurable: false}\n\
  Object.getOwnPropertyDescriptor(myObject, \"year\");\nObject {value: 2013, writable:\
  \ true, enumerable: true, configurable: false}\nmyObject.z = 4;\n4\nmyObject.newProperty\
  \ = \"attempting to add a new property\"; \"attempting to add a new property\"\n\
  myObject\n```\n\n这些属性允许你对对象的属性有更多的控制。\n\n\n\n\n\n```javascript\nObject {name: \"\
  Elisabeth\", course: \"Advanced JavaScript\", year: 2013}\n\nObject.keys(myObject);\n\
  \n[\"name\", \"course\", \"year\"]\n\nmyObject.name = \"Scott\";\n\nObject {name:\
  \ \"Scott\", course: \"Advanced JavaScript\", year: 2013}\n```\n\n首先，我们定义了一个新对象\
  \ `myObject`，它包含三个属性：`name`、`course` 和 `year`。默认情况下，这些属性的属性描述符（property descriptor）中的属性均为\
  \ `true`，我们可以通过使用 `Object.getOwnPropertyDescriptor()` 检查它们来确认。（遗憾的是，没有办法一次查看所有属性的属性描述符）。\n\
  \n接下来，我们通过调用 `Object.seal()` 并传入对象 `myObject` 来“封印”（seal）该对象。这会将每个属性的可配置性（configurable）属性设置为\
  \ `false`。\n\n我们尝试向对象中添加一个新属性 `myObject.newProperty`。当我们尝试这样做时，并没有得到错误信息（因为我们不在严格模式下），但赋值操作被忽略了，该属性没有被添加到对象中。当我们使用\
  \ `Object.keys()` 方法显示对象中的属性名时，可以看到没有添加任何新属性。\n\n最后，我们将 `myObject.name` 属性的值从 \"\
  Elisabeth\" 改为 \"Scott\"，这只是为了证明即使对象被封印，我们仍然可以更改属性的值。\n\n![](img/Image00032.jpg)\n\
  \n如果你在严格模式下尝试向 `myObject`（已封印）添加新属性，你将得到错误信息 `Uncaught TypeError: Can't add property\
  \ newProperty, object is not extensible`。\n\n![](img/Image00069.jpg) ![](img/Image00018.jpg)\n\
  \n你可以使用 `Object.isSealed()` 方法检查一个对象是否被封印：\n\n交互会话：\n```\nObject.isSealed(myObject)\
  \ true\n```\n\n一个类似的方法是 `Object.freeze()`。它的作用类似于 `Object.seal()`，但此外，它还会将所有属性描述符的可写性（writable）属性设置为\
  \ `false`，因此你无法更改属性的值：\n\n![](img/Image00059.jpg)\n\n交互会话：\n```\nObject.freeze(myObject);\n\
  myObject.name = \"Elisabeth\" \"Elisabeth\"\nmyObject\nObject {name: \"Scott\",\
  \ course: \"Advanced JavaScript\", year: 2013}\n```\n\n你可以使用 `Object.isFrozen()`\
  \ 方法判断一个对象是否被冻结。\n\n![](img/Image00032.jpg)\n\n如果你在严格模式下尝试设置冻结对象中的属性值，你将得到错误信息 `Uncaught\
  \ TypeError: Cannot assign to read only property 'name' of #<Object>`。\n\n![](img/Image00018.jpg)\n\
  \n`Object.seal()` 和 `Object.freeze()` 方法对于保护你的对象非常有用，同时仍然允许对属性进行访问（包括读取属性值和枚举属性）。\n\
  \n`Object.seal()` 和 `Object.freeze()` 都会通过将对象设置为不可扩展（non-extensible）来禁止向对象中添加新属性。你可以使用\
  \ `Object.preventExtensions()` 方法自己（独立地）完成这一操作，并使用 `Object.isExtensible()` 方法判断一个对象是否是可扩展的。\n\
  \n我们将这些 JavaScript 对象新功能的描述留到了课程的最后，因为它们是最近添加的，因此目前使用得不多。尽管如此，知道在需要时可以使用它们仍然很重要。在某些情况下，你可能会需要它们，比如当你想要确保一个对象免受更改时。此外，这些功能可能会在语言未来的扩展中被使用。\n\
  \n## 创建对象\n\nES5 添加的另一个 `Object` 新方法是 `Object.create()`。你已经知道如何通过编写字面量对象和使用构造函数来创建对象。\n\
  \n`Object.create()` 有些不同，因为它允许你创建一个对象并指定其原型（prototype）。因此，如果你创建了一个对象（例如下面的 `Person`\
  \ 对象），你就可以创建使用 `Person` 作为原型的对象（这意味着这些对象继承了 `Person` 对象的属性和方法）：\n\n![](img/Image00254.jpg)\
  \ 需要输入的代码：\n\n```html\n<!doctype html>\n<html\n<head>\n<title> Creating Objects\
  \ </title>\n<meta charset=\"utf-8\">\n<script>\nvar Person = {\nwelcome: function()\
  \ {\n  console.log(\"Welcome \" + this.name + \"!\");\n},\nisAdult: function() {\n\
  \  if (this.age > 17) {\n    return true;\n  }\n}\n};\nvar bob = Object.create(Person);\n\
  bob.name = \"Bob Parsons\";\nbob.age = 42;\nbob.welcome();\nif (bob.isAdult()) {\n\
  \  console.log(bob.name + \" can get a beer\");\n}\nvar mary = Object.create(Person);\n\
  mary.name = \"Mary Smith\";\nmary.age = 12;\nmary.welcome();\nif (!mary.isAdult())\
  \ {\n  console.log(\"Sorry, \" + mary.name + \" can't get a beer\");\n}\n</script>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 将文件保存在你的 `/AdvJS/`\
  \ 文件夹中名为 `createObjects.html` 并 ![](img/Image00021.jpg)。打开控制台；你看到：\n\n![](img/Image00104.jpg)\n\
  \n观察：\nWelcome Bob Parsons!\nBob Parsons can get a beer\nWelcome Mary Smith!\nSorry,\
  \ Mary Smith can't get a beer\n\n我们将这些变量设为全局变量，以便你可以在控制台中访问它们。尝试一下：\n\n![](img/Image00141.jpg)\
  \ 交互会话：\n```\nPerson.isPrototypeOf(bob) true\nPerson.isPrototypeOf(mary) true\n\
  bob\nObject {name: \"Bob Parsons\", age: 42, welcome: function, isAdult: function}\n\
  mary\nObject {name: \"Mary Smith\", age: 12, welcome: function, isAdult: function}\n\
  ```\n\n`Person` 对象都是 `bob` 和 `mary` 的原型，这些对象确实继承了来自 `Person` 的属性。（那么，当你使用 `Object.keys()`\
  \ 获取 `bob` 和 `mary` 的属性名时会发生什么？为什么？）\n\n然而，注意，因为我们使用 `Object.create()` 而不是构造函数来创建\
  \ `bob` 和 `mary`，当你这样查看 `bob` 的构造函数时：\n\n![](img/Image00064.jpg)\n\n交互会话：\n```\n\
  bob.constructor\nfunction Object() { [native code] }\nbob\nObject {name: \"Bob Parsons\"\
  , age: 42, welcome: function, isAdult: function}\n```\n\n...你可以看到构造函数是 `Object()`。`bob`\
  \ 和 `mary` 是在幕后使用 `Object()` 构造函数创建的，然后显式地将原型对象更改为 `Person`。当我们在控制台中显示 `bob` 时也能反映这一点：你看到\
  \ \"Object\" 是对象的“类型”，尽管该对象的原型是 `Person`。\n\n每当你使用构造函数创建对象时，该对象都会获得一个存储在构造函数 `prototype`\
  \ 属性中的原型。回想我们通过编写 `new Circle()` 创建了一个圆，结果对象的原型是 `Circle.prototype` 中的 `Circle`\
  \ 对象。将将这种创建对象的方法与使用 `Object.create()` 进行对比。`Object.create()` 允许你在不（显式）使用构造函数的情况下分配对象的原型（尽管在幕后使用了\
  \ `Object()` 构造函数）。\n\n此外，通过 `Object.create()`，你可以向该方法传递第二个参数，其中包含一个指定属性属性的对象：\n\
  \n![](img/Image00255.jpg) 交互会话：\n```\nvar jim = Object.create(Person, { name: {\n\
  \  value: \"Jim Smith\",\n  writable: false\n}, age: {\n  value: 42,\n  writable:\
  \ false\n}\n});\nundefined\njim.name \"Jim Smith\"\njim.age 42\njim.welcome() Welcome\
  \ Jim Smith!\njim.isAdult() true\njim.name = \"Joe Schmoe\" \"Joe Schmoe\"\njim.welcome()\
  \ Welcome Jim Smith!\n```\n\n在这里，我们使用 `Object.create()` 创建了一个新对象，并传递 `Person` 对象作为原型。我们还传递了一个定义新对象属性值及其属性的对象。\n\
  \n由于我们设置了两个属性使其均不可写，因此我们无法更改 `jim` 对象中的值。\n\n![](img/Image00034.jpg)\n\n| 注意 | 如果你在严格模式下尝试更改\
  \ `jim.name` 的值，你将看到错误信息 `Uncaught TypeError: Cannot assign to read only property\
  \ 'name' of #<Object>`。 |\n\n|  |\n\n![](img/Image00018.jpg)\n\n所以，`Object.create()`\
  \ 为 JavaScript 中对象的创建原型链提供了一种高效的方法。\n\n\n\n\n\n在本节中，你学习了 ES5（或 ECMAScript 5.1 规范）中添加的一些\
  \ JavaScript 新特性。如果你运行的是最新版本的现代浏览器，那么你很可以使用所有这些新特性。\n\n开发者们已经在为 JavaScript 的下一个版本（代号为\
  \ Harmony）制定 ECMAScript 6 规范工作了。你可以在 [ECMAScript wiki](http://wiki.ecmascript.org/doku.php?id=harmony:specification_drafts)看到正在制定中的规范。截至本文写作时，新规范的创建正在进行中，因此许多新特性在浏览器中尚不可用。变化将比\
  \ ES5 更广泛，包括块级作用域、类和模块的引入。令人兴奋！\n\n你在本课程中已经走了很远的路，探索了 JavaScript 语言的大量内容，包括类型和值、函数、对象和闭包。你还学习了编程技巧，例如使用模块模式来减少全局变量并保持对象的某些部分为私有。做得好！我们期待看到你在最终项目中的表现！\n\
