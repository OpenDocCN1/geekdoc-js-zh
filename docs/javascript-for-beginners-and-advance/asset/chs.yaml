  \n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  ||  |\n\n在你的页面的表单元素上添加一个事件处理器，在表单提交时将调用名为\
  \ `check_form()` 的函数。该函数将根据表单是否通过下述的若干测试来返回 `true` 或 `false`。记住在事件处理器的函数调用之前加上 `return`，以确保表单在继续之前等待函数的确认。\n\
