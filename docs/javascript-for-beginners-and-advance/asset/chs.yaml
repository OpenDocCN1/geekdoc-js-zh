  \n![](img/Image00000.jpg)\n\n## 39 创建一个 JavaScript 时钟\n\n### 关键点\n`setTimeout()`\
  \ 是 `window` 对象的一个方法。通常情况下，它允许你在指定的时间（毫秒）通过后运行任何函数。例如：\n\n```javascript\nsetTimeout(\"\
  functionName\", 1000)\n```\n将在一秒后运行 `functionName()`。\n\n你可以运行任意数量的“超时”。为了识别每一个，最好的做法是将\
  \ `setTimeout` 的返回值赋值给一个变量：\n\n```javascript\nfirstTimeout = setTimeout(\"functionName\"\
  , 5000)\n```\n如果你想取消超时，可以使用 `clearTimeout()` 方法。例如：\n\n```javascript\nclearTimeout(firstTimeout)\n\
  ```\n将起作用。\n\n注意：你无法清除一个尚不存在超时。因此，你需要检查超时是否正在运行。一种方法是在时钟启动时将一个布尔变量设置为 true。通过检查这个变量，你可以停止它。\n\
  \n通常，让函数“递归”不是一个好主意。例如，想象以下情况：\n\n```javascript\nfunction annoy_me() {\n    alert(\"\
  BOO!\");\n}\n```\n这会不断弹出窗口，并可能锁定用户！\n\n然而，你可能希望使用 `setTimeout` 定期调用自己。想象一个每秒调用自己一次来检查时间的函数。\n\
  \n为了显示一个 am/pm 时钟，你显然需要考虑分钟或秒小于 10 的情况。例如，考虑：`10:59:59 am` 变为 `11:0:0 am`。\n\n在这种情况下，我们需要在实际值的前面拼接一个额外的“0”，以产生我们预期的\
  \ `11:00:00 am`。\n\n我们可以使用 `if` 条件的简写形式来使其简单。例如：\n\n```javascript\ns = theDate.getSeconds();\n\
  s = ( s < 10 ) ? \"0\" + s : s;\n```\n这里发生了什么？首先，我们获取秒的当前值并将其存储在变量变量 `s` 中。接下来，我们根据括号中的条件重置\
  \ `s` 的值。这种 `if` 条件的形式原型是：`var = ( condition ) ? value if true : value if false;`\n\
  \n换句话说，我们可以把 `?` 想象成 `if` 条件的左括号 `{`，将 `:` 想象成 `} else {`，将 `;` 想象成右括号。条件测试的结果将存储在\
  \ `var` 中。\n\n注意，为了便于阅读，这里分成三行。在实践中（见上文），我们可以将其放在一行以便方便使用。\n\n\n\n\n在 `body` 部分，创建一个带有\
  \ `id=\"clockBox\"` 的表单输入元素，以及两个标记为 `Start` 和 `Stop` 的表单输入按钮。\n\n在 `head` 部分的 `script`\
  \ 元素中，创建两个空函数——`start_clock()` 和 `stop_clock()`。\n\n在两个函数定义之前，作为 `script` 元素的第一条语句，创建一个名为\
  \ `timer` 的变量，并将其赋值为 `null`。\n\n![](img/Image00000.jpg)\n\n| 面初学者 JavaScript | |\n\
  |---|---|\n| | | |\n| | | |\n\n紧接在该语句下方，创建一个名为 `timer_running` 的变量。将其赋值为 `false`。我们将使用这些变量来跟踪时的状态。\n\
  \n现在，在 `start_clock()` 函数中添加语句来实现以下操作：\n- 获取当前时间。\n- 将当前时间格式化为 `hh:mm:ss am/pm`（根据情况定）。\n\
  - 将格式化后的时间显示在页面的字段中。\n- 创建一个 `timeout`，它将在半秒后再次运行 `start_clock()` 函数，并将该超时对象的返回对象赋值给\
  \ `timer` 变量变量。\n- 将 `timer_running` 变量设置为 `true`。\n\n在 `stop_clock()` 函数中添加语句来实现：\n\
  - 检查时钟是否正在运行。\n- 如果正在运行，清除超时并将 `timer_running` 设置为 `false`。\n\n最后，为两个表单按钮添加事件处理器，以确保标记为\
  \ `Stop` 的按钮在点击时调用函数 `stop_clock()`，而标记为 `Start` 的按钮在点击时调用函数 `start_clock()`。\n\n\
  虽然这应该可以工作（测试你的代码！），但你会发现输出有点丑。在文本字段中显示时间并不是页面上显示时钟最自然的方式。幸运的是，我们可以稍微修改代码以实现更专业的效果。\n\
  \n将你的输入字段替换为以下内容：\n\n```html\n<span id=\"clockBox\"></span>\n```\n\n`<<span>>` 是一个\
  \ HTML 标签，允许你标记没有任何语义含义的内容区域——例如，时钟不是段落或标题，所以我们不想将其标记为这些。\n\n![](img/Image00000.jpg)\n\
  \n| 面初学者 JavaScript | |\n|---|---|\n| | | |\n| | | | |\n\n通过 JavaScript，我们可以控制页面上的几乎任何元素的内容。在我们之前的示例中，我们使用了\
  \ `getElementById`（希望是这样！）来获取输入字段的引用，然后更改它的 `value` 属性来显示我们的时钟。\n\n由于我们在这里使用了相同的\
  \ `id` 值，所以我们不需要对函数做太大修改。但是，`getElementById` 方法现在返回不同类型的对象——一个没有 `value` 属性的对象。\n\
  \n然而，HTML 中所有的内容标签（如 `<p>`、`<h1>`、`<div>` 等）在作为 JavaScript 对象返回时，都有一个特殊属性指向它们的文本内容——该属性是\
  \ `innerHTML`。\n\n我们可以使用它来更改标签的内容。例如，如果我们之前的输入字段方案有以下代码：\n\n```javascript\nclk =\
  \ document.getElementById(\"clockBox\"); clk.value = formatted_time;\n```\n\n其中\
  \ `formatted_time` 是一个包含所需格式化时间的变量，那么将其替换为此代码：\n\n```javascript\nclk = document.getElementById(\"\
  clockBox\"); clk.innerHTML = formatted_time;\n```\n\n将允许我们使用修改后的 `<span>` 元素来代替\
  \ `<input>` 元素。\n\n尝试调整你的代码使用这种方法在页面上显示内容。\n\n![](img/Image00000.jpg)\n\n## 高级 JavaScript\
