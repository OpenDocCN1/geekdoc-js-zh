  \ `1955 年 7 月 17 日 凌晨 1:00` 写入页面。通过在新的 `Date()` 构造构造函数中输入相应的参数来实现。\n\n现在，再次使用参数在你的脚本中添加新行，在现有日期下方另起一行显示\
  \ `2004 年 7 月 17 日 午夜 0:00`。\n\n最后，使用日期对象的字符串方法，在你的脚本中添加新行，在现有信息下方另起一行以标准的日期和时间格式显示\
