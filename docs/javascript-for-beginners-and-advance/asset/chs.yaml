  \ 18 字符串处理\n\n### 核心要点\n\n在生产环境中使用 JavaScript 时，你经常会用它从变量中读取值，并根据发现的内容更改行为。\n\n\
  在测试相等性的比较章节，我们已经看到了一些基础的字符串读取。然而，这种“全有或无”的方法对于我们的目的来说往往不够细致。\n\n以这种情况为例：我们需要检查用户的姓名是否在已知用户列表中。例如，如果用户输入的名字是“Karen”，那么只有当他们拼写的名字与我们记录的完全一致（包括大小写等）时，这才是正确的。如果用户决定输入她的全名，例如“Karen\
  \ Aaronofsky”，代码将无法识别她。\n\n在这种情况下，我们想看看文本“Karen”是否出现在字符串中。我们称之为 `子字符串搜索`，它可以非常有用。\n\
  \n最简单的子字符串搜索之一是通过使用 `indexOf` 方法完成的。每个字符串类型的变量都关联有这个方法。考虑这段代码：\n\n```javascript\n\
  var_1 = “Karen Aaronofsky”;\nvar_2 = var_1.indexOf(“Karen”);\n```\n\n在这种情况下，`var_2`\
  \ 的值为 0 —— 记住 JavaScript 从 0 开始计数的！\n\n![](img/Image00000.jpg)\n\n| 入初者的 JavaScript\
  \ |  |\n|  |  |  |\n|  |  |  ||如果我们在这里搜索姓氏：\n\n```javascript\nvar_1 = “Karen Aaronofsky”;\n\
  var_2 = var_1.indexOf(“Aaronofsky”);\n```\n\n`var_2` 的值将是 6。\n\n最后，如果搜索“失败”了，例如我们搜索名为“Anisa”的子字符串，那么\
  \ `var_2` 的值将是 -1。注意，这种方式更灵活，但如果用户忘记大写我们正在搜索的任何子字符串中的某个字母，仍然会产生问题——在 JavaScript\
  \ 中，“Karen”不等于“karen”。\n\n为了解决这个问题，我们可能希望确保不考虑大小写。实现此点的一种简单方法是在检查之前将字符串强制转换为小写：\n\
  \n```javascript\nreal_name = “Karen”;\nname = prompt(“Your name?”,””);\nreal_name\
  \ = real_name.toLowerCase();\ntry_name = name.toLowerCase();\nif ( try_name.indexOf(real_name)\
  \ > -1 ) {\n    alert(“Hello!”);\n} else {\n    // 注意我们在这里使用了原始的、未转换大小的名字\nalert(“Welcome\
  \ “ + name);\n}\n```\n\n有很多字符串方法可以用来对字符串执行“值检查”。以下表格列出了其中一些常用方法：\n\n| 方法 | 行为 |\n\
  | :--- | :--- |\n| `String.indexOf(“str”)` | 返回子字符串 `str` 在 `String` 中第一个字符的数值位置\
  \ |\n| `String.charAt(x)` | 返回字符串中位置 `x` 处的字符 —— `indexOf` 的相反操作 |\n| `String.toLowerCase()`\
  \ | 返回字符串的副本，将所有大写字母替换为对应的小写字母 |\n| `String.toUpperCase()` | 返回字符串的副本，将所有小写字母替换为对应的大写字母\
  \ |\n| `String.match(/exp/)` | 根据对字符串的正则表达式搜索返回真或假 |\n\n这里的最后一种方法值得说明。什么是正则表达式？\n\
  \n正则表达式是编写易于识别的字符“模式”的标准方式。例如，考虑一个典型的电子邮件地址：\n\njonathan@relativesanity.com\n\n\n\
  \n\n\n电子邮件地址遵循一种“模式”，这使得人类能够一眼识别出它是一个电子邮件地址。如果我们能在 JavaScript 中定义这种模式供浏览器使用，那不是很方便吗？正则表达式（Regular\
  \ expressions）让我们得以实现。\n\n让我们再次看看我们的电子邮件地址。我们可以将其拆解为如下的“原型”电子邮件地址：\n\n`[一些字母]@[更多字母].[再几个字母]`\n\
  \n当然，实际情况比这要复杂一点——某些字符是不允许出现在电子邮件地址的特定部分的（例如，不能有空格），但这能让你理解到将此字符串拆分为若干个必需“块”（chunks）的想法。\n\
  \n现在，将其转换为正则表达式。正如我们在 JavaScript 中使用引号来表示（或“界定”）字符串值一样，为了表示一个正则表达式，我们使用正斜杠：`/`。我们的电子邮件地址正则表达式可能像这样：\n\
  \n```\n/^.+@.+\\..+$/\n```\n\n这值得我们讨论一下。让我们逐个字符地来看它：\n\n- `/` 表示正则表达式的开始\n\n![](img/Image00000.jpg)\n\
  \n| JavaScript for Beginners |  |\n|  |  |  |\n|  |  |  |\n\n- `^` 表示我们希望这个正则表达式出现在我们正在搜索的字符串的最开头。\n\
  - `.+` 点符号 `.` 用于代表任何字符。`+` 表示我们希望找到至少一个这样的字符。所以这等同于我们的纯英语短语 `[一些字母]`。\n- `@` 这仅仅是一个字符——除了表示我们想在从字符串开始至少经过一个字符之后找到一个\
  \ `@` 字符外，它没有特殊含义。\n- `.+` 与之前相同——在 `@` 之后至少再有一个字符。\n- `\\.` 这很有趣。我们知道点符号在正则表达式中有特殊含义——它意味着“匹配任何字符”。然而，在这里我们想要找到一个真实的点`.。与没有特殊含义的\
  \ `@` 不同，我们必须告诉 JavaScript 忽略点的特殊含义。我们通过在它前面加一个反斜杠 `\\` 来实现，这告诉 JavaScript 将紧随其后的字符视为没有特殊含义。这是你在编程过程中会遇到很多次的约定。这里的最终是，我们希望在一系列字符之后匹配一个点。\n\
  - `.+` 再次，在点之后至少再有一个字符。\n- `$` 它是开头 `^` 的镜像——这匹配被测试字符串的结尾。\n- `/` 告诉 JavaScript\
  \ 我们到了正则表达式的结尾。\n\n呼！这里有很多需要考虑的因素。正则表达式在最好的情况下也是一门深奥的艺术，所以如果上面的代码无法理解，也不要太担心。现在重要的是意识到，我们可以在\
  \ JavaScript 中执行相当复杂的模式识别，而无需多次检查字符串的每一个单独字符。\n\n![](img/Image00000.jpg)\n\n| JavaScript\
  \ for Beginners |  |\n|  |  |  |\n|  |  |  |\n\n以下代码检查一个变量查看它看起来像不像电子邮件地址：\n\n```javascript\n\
  var_1 = prompt(\"Your email?\", \"\");\nif ( var_1.match(/^.+@.+\\..+$/) )\n{\n\
  \  alert(\"valid email address\");\n}\nelse\n{\n  alert(\"are you sure?\");\n}\n\
  ```\n\n这段代码目前有几个问题——例如，它会很顺然地通过“-@.-.-”这个字符串，这显然是错误的。我们将在课程的后续部分介绍解决办法。\n\n### 项目\n\
  \n- 打开你之前的项目文件，并将其保存为 `chapter_18.html`。\n- 清空 `script` 标签中所有的 JavaScript 代码。\n\
  - 使用提示框（prompt box）获取用户输入并赋值给变量 `check_string`。\n- 使用 `document.write` 语句输出将各种字符串方法应用于用户输入时产生的结果。\n\
  - 检查用户输入查看它是否为电子邮件地址，并相应更改你的输出为“That’s an email address”（这是一个电子邮件地址）或“That doesn’t\
  \ look like an email address to me!”（在我看来不像电子邮件地址！）。\n- 在后的情况下，也输出失败的字符串，以便用户可以看到自己的输入并在下次需要时进行。\n\
  \n![](img/Image00000.jpg)\n\n| JavaScript for Beginners |  |\n|  |  |  |\n|  | \
  \ |  |\n\n## 19 使用函数\n\n### 关键点\n\n函数是一个执行任务的命名语句集合，出现在 `<script>` 标签内部。任务可以简单也可以复杂，函数的名称由你决定，类似于变量。声明如下：\n\
  \n```javascript\nfunction name_of_function()\n{\n}\n```\n\n与我们为止看到的所有指令不同，函数在没有被特定请求之前不会运行。这种请求被称为函数调用（function\
  \ call）：\n\n```javascript\nname_of_function()\n```\n\n\n\n\n\n```javascript\nif\
  \ ( address.match(/^.+@.+\\..+$/) )\n{\n  return true;\n}\nreturn false;\n```\n\n\
  或者更好的方法，因为 `address.match()` 本身就会返回一个布尔值：\n\n```javascript\nfunction check_email(\
  \ address )\n{\n  return address.match(/^.+@.+\\..+$);\n}\n```\n\n![](img/Image00000.jpg)\n\
  \n| JavaScript 初学者 | |\n\n上面的函数看起来可能并不是很大的节省。毕竟，我们使用了四行代码来定义一个只执行一行代码的函数。对比一下：\n\
  \n```javascript\nfunction check_email( address )\n{\n  return address.match(/^.+@.+\\\
  ..+$);\n}\nif ( check_email(address) )\n{\n  …执行一些邮件操作…\n}\n```\n\n与此：\n\n```javascript\n\
  if ( address.match(/^.+@.+\\..+$/) )\n{\n  …执行一些邮件操作…\n}\n```\n\n虽然这里的处并不显而易见，但考虑一下这种情况：在未来的某个时刻，你发现了一种更好的检查电子邮件地址的方法。在上面的第二种情况下，你必须搜索代码中该方法的每一个实例，并将其替换为你的新方法，而新方法可能不仅仅一行代码。在第一种情况下，你只需要更改底层的函数定义，这种“升级”就会在整个代码中生效，而无需你更新每个出现的地方。\n\
  \n### 项目\n\n- 打开你之前的项目文件，并将其另存为 `chapter_19.html`。\n- 清除脚本标签（script tags）中所有的 JavaScript\
  \ 代码。\n- 确保你在页文档的 `head` 区域有一个 `script` 元素，在 `body` 区域也有一个。\n- 在 `head` 区域，定义一个名为\
  \ `show_message` 的函数。该函数应该接受一个名为 `message` 的参数，并使用 `alert` 对话框来显示该参数的内容。\n- 在 `body`\
  \ 区域，使用带有各种消息作为参数调用该函数。\n\n![](img/Image00000.jpg)\n\n| JavaScript 初学者 | |\n\n现在在\
  \ `body` 区域使用一个变量来存储 `prompt` 向用户询问消息的返回值。使用此变量作为 `show_message` 单一实例的参数。\n\n- 在\
  \ `head` 区域定义一个名为 `get_message` 的新函数。它不应该接受参数，但应该复制 `body` 区域中 `prompt`的功能，通过 `prompt`\
  \ 框向用户询问消息。\n- 确保 `get_message` 返回一个合理的值。我们的目标是将 `body` 区域中的 `prompt` 语句替换为以下代码：\n\
  `message = get_message();`\n因此考虑你需要返回什么才能使其正常工作。\n- 一旦你对 `get_message` 的定义满意，尝试用上述语句替换你\
  \ `body` 区域中的 `prompt` 代码。\n- 为了演示函数的威力，将 `show_message` 的操作更改为将消息写入页面，而无需更改页面 `body`\
  \ 区域的任何代码。\n\n![](img/Image00000.jpg)\n\n| JavaScript 初学者 | |\n\n## 20 逻辑运算符\n\n\
  ### 核心要点\n\n在我们对条件语句的讨论中，我们看到了如何通过比较运算符来检查单个条件的真假性：\n\n```javascript\nif ( x > some_value\
  \ )\n{\n  …表达式…\n}\n```\n\n我们还看到了这种方法的局限性。假设我们想发现 `x` 是否位于两个值之间，例如 `val_1` 和 `val_2`。有多种方法可以实现这一点。在学生成绩的示例中，我们学习了可以使用\
  \ `if…else` 对来实现这种效果：\n\n```javascript\nif ( x > val_1 )\n{\n  …执行某些操作…\n}\nelse\n\
  if ( x > val_2 )\n{\n  …执行其他操作…\n}\n```\n\n上面的代码实现了我们的目标——对于第二个分支，`x` 必须位于 `val_2`\
  \ 和 `val_1` 之间（假设 `val_1` 大于 `val_2`）。然而，它是相当臃肿的，无法优雅地扩展到三个条件（假设我们还想检查 `x` 是否为偶数），或者实际上到十个条件。逻辑运算符。这些运算符用于连接条件检查，并根据所有或任何检查是否为真返回真或假。![](img/Image0000.jpg)\n\
  \n| JavaScript 初学者 | |\n\n在英语中，我们用“AND”（与）和“OR”（或）来称呼这些运算符。例如，假设我们想在每周二晚上 8 点做某事情。我们想要检查当前是否是周二，以及时间是否是晚上\
  \ 8 点。另一个例子：假设我们想在每月第一个星期二做某事情，并在每月的 3 号也这样做。我们必须检查当前日期是否是该月的第一个星期二，或者是否是该月的 3 号。注意最后一个例子，如果两个条件都为真，那么我们就是\
  \ 3 号周二，并执行该操作。换句话说，`or` 条件允许其中一个、另一个、或者两个条件都为真![](img/Image00000.jpg)\n\n| JavaScript\
  \ 初学者 | |\n\n在 JavaScript 中，我们使用以下语法来检查多个条件：\n`(100 > 10 && 5 < 8)` 翻译为“如果 100 大于\
  \ 10 且 5 小于 8”。在这种情况下，结果为 `true`。\n`(100 > 200 && 4 < 9)` 在这种情况下，结果为 `false`。注意，这里实际上只检查了第一个条件。因为\
  \ `and` 要求两次比较都为真，一旦发现 `false`，它就会停止检查。这非常有用。\n`(100 > 10 || 9 < 8)` 翻译为“如果 100\
  \ 大于 10 或 9 小于 8”。在这种情况下，结果为 `true`，因为至少有一个条件被满足了。\n`(100 > 200 || 4 > 9)` 在这种情况下，结果为\
  \ `false`，因为两个比较都不为真。最后：\n`(100 > 200 || 5 < 2 || 3 > 2)` 在这种情况下，结果为 `true`。三个条件中的任何一个为真都会提供这个结果。\n\
  \n正如从最后一个例子中看到的，这种检查方法可以扩展到任意数量的条件。我们还可以混合使用运算符。例如：\n`((100 > 200 && 100 > 300)\
  \ || 100 > 2)` 在这种情况下，`and` 条件求值为假，但由于只要或最后一个条件为真就能返回真，整个条件返回 `true`，因为 100 确实大于\
  \ 2。这种复杂的逻辑需要一些时间来理解，并且不是课程的一部分。但是，了解它是有用的![](img/Image00000.jpg)\n\n| JavaScript\
  \ 初学者 | |\n\n### 项目\n\n- 打开你之前的项目文件，并将其另存为 `chapter_20.html`。\n- 清除脚本标签中所有的 JavaScript\
  \ 代码。\n- 确保你在文档的 `head` 区域有一个 `script` 元素，在 `body` 区域也有一个。\n- 从网络驱动器复制 `available_plugins.js`\
  \ 文件（老师会演示），并使用记事本的 `文件 > 打开` 命令打开它。\n- 将 `available_plugins.js` 的全部内容复制并粘贴到当前项目文件的\
  \ `head` 区域 `script` 元素中。\n- 阅读一遍代码。注意它定义了一个大型二维数组。该数组列出了浏览器中可能存在的各种组件（如 Flash 或\
  \ Quicktime）。\n- 在 `head` 区域添加一个名为 `flash_exists()` 的函数。该函数应该使用 `for` 循环检查 `available_plugins`\
  \ 数组的每个元素，并确定 Flash 是否存在。\n- 在 `head` 区域再添加一个名为 `quicktime_exists()` 的函数。该函数也应该使用\
  \ `for` 循环检查数组的每个元素，这次是如果 Quicktime 存在则返回 `true`。\n- 最后，在 `head` 区域添加一个名为 `both_quicktime_and_flash_exist()`\
  \ 的函数。该函数应该调用之前的两个函数，将它们的结果存储在变量中，并产生一个包含以下消息的 `alert` 对话框：\n\n\n\n\n\n如果两个函数都返回\
  \ `true`，则显示“两者 Quicktime 和 Flash”；或者：如果其中一个函数返回 `false`，则显示“缺失 Quicktime 或 Flash\
  \ 之一”。\n\n从 body 区域的 script 元素调用最终函数。\n\n在浏览器中检查你的结果。\n\n![](img/Image00000.jpg)\n\
  \n## 21 使用事件处理器\n\n### 核心要点\n\n到为止，我们的脚本是在浏览器页面加载后就立即运行的。即使我们使用了函数来“封装”代码，这些函数也是在页面中被调用时立即运行的，或者如果没有调用，则完全不运行。换句话说，到为止我们的脚本响应的唯一事件就是页面加载到浏览器窗口的事件。\n\
  \n然而，大多数情况下，你可能希望代码能够对用户的活动做出特定响应。你会希望定义函数，并让它们仅在用户执行某些操作时才触发。这就是事件处理器。\n\n每当用户与页面进行交互时，浏览器都会告诉\
  \ JavaScript 发生了一个“事件”。该事件可能是鼠标点击、鼠标指针移入或移出某个元素（如图像或段落）、用户使用 Tab 键切换到 HTML 表单的新部分、用户离开页面、用户提交表单等。\n\
  \n事件处理器是一段 JavaScript 代码，允许我们能够在每个事件发生时捕获它，并通过运行某些 JavaScript 代码来做出响应。\n\n通常情况下，我们将事件处理器绑定到特定的\
  \ HTML 标签上，因此页面上某一个元素的鼠标点击可能会被事件处理器捕获，但点击其他其他地方可能会执行完全不同的操作，或者实际上什么都不发生。\n\n下表是一些常见的事件处理器：\n\
  \n| 事件处理器 | 发生的情况是…… |\n| :--- | :--- |\n| `onload` | 元素在页面上加载 |\n| `onunload` |\
  \ 元素未加载，例如当用户离开页面时 |\n| `onmouseover` | 当鼠标指针进入 HTML 元素定义的区域时 |\n| `onmouseout`\
  \ | 当鼠标指针离开 HTML 元素定义的区域时 |\n| `onclick` | 在 HTML 元素定义的区域内点击左鼠标键时 |\n| `onmousedown`\
  \ | 在 HTML 元素定义的区域内按下左鼠标键时 |\n| `onmouseup` | 在 HTML 元素定义的区域内松开左鼠标键时 |\n\n最后三个是相关的，但存在细微的差异——`onclick`\
  \ 被定义为在给定元素区域内同时发生 `mousedown` 和 `mouseup` 事件时。例如，如果你点击页面的某个区域，这会注册该区域的 `mousedown`\
  \ 事件。如果你在松开鼠标之前按住鼠标并移动到另一个区域，它将注册另一个区域的 `mouseup` 事件。然而，浏览器的 `click` 事件将保持未注册状态。\n\
  \n理论上，我们可以将这些事件处理器中的大多数添加到我们想要的几乎任何 HTML 标签上。在实践中，许多浏览器限制了我们可以交互的内容。\n\n我们将主要将事件处理器绑定到\
  \ `<img>`、`<a>` 和 `<body>` 标签上。\n\n要向标签绑定事件处理器，我们使用以下方法：\n\n```html\n<a href=\"\
  ...\" onclick=\"a_function();\">link</a>\n```\n\n我们可以使用此方法将上述列出的任何事件处理器绑定到页面元素。除了调用函数（当然可以带有任何可选参数），我们还可以直接在事件处理器中编写\
  \ JavaScript：\n\n```html\n<a href=\"...\" onclick=\"alert('hello');\">link</a>\n\
  ```\n\n![](img/Image00000.jpg)\n\n注意这里引号的潜在问题——如果你在事件处理器周围使用双引号，则需要在内部使用单引号，反之亦然。\n\
  \n### 项目\n\n打开你之前的项目文件，并将其保存为 `chapter_21.htm`。\n\n清除你 script 标签中所有的 JavaScript\
  \ 代码。\n\n确保你在文档的 head 区域中有一个 `script` 元素，且 body 区域没有。\n\n在 head 区域的 script 元素中，定义以下函数：\n\
  \n```javascript\nfunction set_status( msg )\n{\n  window.status = msg;\n}\n```\n\
  \n调用时，此函数会将浏览器状态栏（窗口页面内容下方的部分）显示的文本设置为传递给参数的任何内容。例如，要设置状态栏显示“Welcome”，我们将调用：`set_status(\"\
  Welcome\");`。\n\n现在紧接着上一个函数定义以下函数：\n\n```javascript\nfunction clear_status( )\n\
  {\n  set_status(\"\");\n}\n```\n\n调用时，此函数将清空状态栏。注意我们在新函数中使用之前之前的函数。这是一种常见的编程技术，允许我们使用更通用的函数来定义特定情况的函数。\n\
  \n现在，在页面的 body 区域添加以下 HTML。记住，我们在这里添加的是 HTML 而不是 JavaScript，所以不要试图在项目的这部分使用 script\
  \ 标签：\n\n```html\n<a href=\"#\" onmouseover=\"set_status('hello');\" onmouseout=\"\
  clear_status();\">testing</a>\n```\n\n![](img/Image00000.jpg)\n\n在浏览器中加载页面，并观察当鼠标移动到链接上时发生了什么。\n\
  \n链接 `href` 属性的 `#` 值允许我们在页面上定义一个“死”链接。点击链接将不会带你去任何地方——试试看。\n\n现在，修改代码使链接指向你已知的真实网站。\n\
  \n现在点击链接将带你离开页面。假设我们想抑制这种行为。当事件处理器拦截事件时，它会暂停正常操作。例如，如果你在链接上使用 onclick 弹出对话框，只有在对话框关闭后才会执行链接。我们可以使用事件处理器来取消操作。在\
  \ head 区域添加一个新函数：\n\n```javascript\nfunction confirm_link( )\n{\n  check = confirm(\"\
  This will take you away from site. Are you sure?\");\n  return check;\n}\n```\n\n\
  `check` 的值将为 `true` 或 `false`。现在，修改你的链接包含以下事件处理器：\n\n```html\nonclick=\"return confirm_link();\"\
  \n```\n\n通过在我们的事件处理器中使用 `return`，函数的响应将决定是否执行剩余操作。情况下，如果 `confirm_link()` 返回 `false`，我们的链接操作将被取消。在浏览器中加载页面并查看结果。\n\
  \n![](img/Image0000.jpg)\n\n## 22 处理图像\n\n### 核心要点\n\n在 HTML 中，我们可以使用 `id` 属性标识页面上的特定元素。例如，为了“命名”图像，我们可以使用以下代码：\n\
  \n```html\n<img src=\"logo.gif\" alt=\"\" id=\"theLogo\" />\n```\n\n在 JavaScript\
  \ 中引用此元素，我们现在可以通过其 `id` 值直接获取它：`document.getElementById(\"theLogo\")`。\n\n该方法将返回一个指向页面给定元素的对象。如果找不到此类元素，该方法将返回\
  \ `false`。\n\n为了方便使用，我们可以找到的对象赋值给变量。例如，为了在脚本创建一个名为 `our_logo` 的对象，我们可以使用以下行代码：\n\
  \n```javascript\nour_logo = document.getElementById(\"theLogo\");\n```\n\n结果对象具有许多属性。由于在这种情况下我们的对象代表图像元素，它的属性包括：\n\
  \n`our_logo.height`\n\n`our_logo.width`\n\n`our_logo.src`\n\n\n\n\n\n我们可以使用 JavaScript\
  \ 来更改这些属性中的任何一个，因此如果我们想更改显示的图像，可以采取如下操作：\n\n```javascript\nour_logo.src = “new_logo.gif”;\n\
  ```\n\n![](img/Image00000.jpg)\n\n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\
