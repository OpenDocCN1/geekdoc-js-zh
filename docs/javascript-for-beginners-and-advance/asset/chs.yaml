  # 16 关联数组与对象数组 (Associative & Objective Arrays)\n\n### 关键点\n\n我们已经看到可以通过索引访问数组元素：\n\
  \n```javascript\narrDays = [“Monday”, “Tuesday”];\n```\n\n向页面打印“Monday”：`document.write(arrDays[0]);`\n\
  \n然而，能够为我们的数组元素命名可能会更有用。默认情况下，数组被创建为数值数组。我们也可以创建关联数组：\n\n```javascript\narrDays\
  \ = new Array();\narrDays[“Monday”] = “Go to the dentist”; arrDays[“Tuesday”] =\
  \ “Attend JavaScript class”;\narrDays[“Wednesday”] = “JavaScript homework”;\n```\n\
  \n\n\n\n`remind you of Wednesday’s task alert(arrDays[\"Wednesday\"]);`\n\n这看起来和我们之前讨论的对象和属性非常相似。事实上，由于数组实际上是一个对象，我们可以像访问属性一样访问它的元素：\n\
  \n```javascript\n// remind you of Wednesday’s task alert(arrDays.Wedensday);\n```\n\
  \n![](img/Image00000.jpg)\n\n| 入初者的 JavaScript |  |\n|  |  |  |\n|  |  |  ||\n\n\
  注意这里有一个细微的差别——在我们之前的数值数组示例中，星期几的名称是数组元素的值。而在这里，星期几的名称是元素的索引。请避免以下常见错误：\n\n```javascript\n\
  arrDays = [\"Monday\",\"Tuesday\"];\narrDays[\"Monday\"] = “Go to work”;\n\n// 这实际上等同于\
  \ arrDays = new Array();\narrDays[0] = “Monday”;\narrDays[1] = “Tuesday”;\narrDays[\"\
  Monday\"] = “Go to work”;\n// 现在的 arrDays.length 是 3，而不是 2\n```\n\n### Project\n\
