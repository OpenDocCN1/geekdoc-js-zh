  \ 属性值），但当鼠标移动到上方时，上方的图像应该更改为 `logo.gif`。\n- 鼠标离开文本链接应将 logo 到之前的状态。在浏览器中检查你的工作。\n\
  \n## 24 对象实例化与更好的翻滚\n\n### 关键点\n\n到目前，我们看到了一个非常简单的图像翻滚示例。它功能齐全并按预期工作，但在一些细节上尚欠。\n\
  \n具体来说当我们用 JavaScript 更改 `<img>` 标签的 `src` 属性时，浏览器必须从头开始加载此图像。在我们的本地机器上，这不会引起可以察觉的延迟，但在处理远程服务器（正如我们将在互联网上所做）时，这种延迟会导致明显的“延迟”，这可能会破坏动态界面的感觉。\n\
  \n\n\n理想情况下，我们希望指示浏览器在加载页面时加载任何替代图像。这将允许我们确保新图像已存在于用户的计算机上，准备好随时进行切换。\n\n为了实现这一点，我们需要了解对象变量和对象实例化（或创建）。特别是，我们需要查看\
  \ `Image` 对象。\n\n页面上的每个 `<<img>>` 标签在 JavaScript 中都有一个对应的 `Image` 对象。我们已经研究了直接操纵这些对象的方法，并对\
  \ `Image` 对象可能具有的某些属性有了一些了解。\n\n然而，我们可以直接在 JavaScript 中创建 `Image` 对象，而不需要在页面上有相应的\
  \ `<<img>>` 标签。当我们创建这样的对象并设置其 `src` 属性时，浏览器会将适当的文件加载到内存中，但不会在页面上显示该图像。\n\n![](img/Image00000.jpg)\n\
  \n| JavaScript 入学者教程 |  |\n|  |  |  |\n|  |  |  |\n\n换句话说，我们可以创建存在 JavaScript 内部的“虚拟”图像，并使用这些\
  \ `Image` 对象来存储我们“真实”图像的替代图像。\n\n要创建一个 `Image` 对象（事实上，是创建任何对象），我们需要使用以下代码：\n\n```javascript\n\
  virtual_image = new Image();\n```\n\n我们以前见过这种语法——在我们创建数组（Arrays）时使用了 `new` 关键字。`new`\
  \ 告诉 JavaScript 我们正在创建一个新对象。赋值中的 `virtual_image` 部分只是一个变量名。在这种情况下，该变量是一个对象变量（Object\
  \ Variable），因为它包含一个对象。\n\n要使用此变量来预加载我们的图像，我们利用它具有与其他任何图像相同的属性和方法的这一事实：\n\n```javascript\n\
  virtual_image.src = “contactsover.jpg”;\n```\n\n浏览器现在将预加载我们的图像，准备在稍后切换。\n\n### 项目\n\
  \n打开你之前的项目文件，并将其保存为 `chapter_24.htm`。\n\n从你之前的代码开始，在页面的 `head` 区域脚本元素中创建一个名为 `preload_images`\
  \ 的新函数。\n\n使用此函数创建七个新的图像对象，并使用每个对象对应的对象变量来预加载你的“覆盖”图像变体。\n\n在浏览器中检查你的工作，确保图像切换仍按预期工作。\n\
  \n将你的 `preload_images` 函数添加到页面的 `body` 标签中，以确保它在页面加载完成后运行。使用以下语法：\n\n```html\n<body\
  \ onload=”preload_images();”>\n```\n\n![](img/Image00000.jpg)\n\n| JavaScript 入学者教程\
  \ |  |\n|  |  |  |\n|  |  |  |\n\n一旦你验证了图像切换仍按预期工作，扩展你的 `preload_images` 函数以定义一个要预加载的图像数组，然后使用\
  \ `for` 循环遍历数组并将每个图像分配给对象变量的 `src` 属性。提示：对象变量可以是任何存储信息的内容——例如数组元素。\n\n在浏览器中检查你的工作。\n\
  \n![](img/Image00000.jpg)\n\n| JavaScript 入学者教程 |  |\n|  |  |  |\n|  |  |  |\n\n\
  ## 25 浏览器窗口操作\n\n## 关键要点\n\n使用标准的 HTML 链接，我们可以打开新的浏览器窗口：\n\n```html\n<a href=”#”\
  \ target=”_new”>link</</a>\n```\n\n然而，这种方法对结果图像提供的控制能力几乎为零。我们无法通过这种方法控制该窗口的大小、形状、在屏幕上的位置或任何其他属性。\n\
  \nJavaScript 允许我们进行更精细的控制，正如我们预期的那样：\n\n```javascript\nwindow.open( page_url, name,\
  \ parameters );\n```\n\n从上面的原型可以看出，该方法只能接受三个参数。然而，`parameters` 参数实际上比我们想象的要复杂得多：\n\
  \n`”param1,param2,param3,param4…”`\n\n因为我们可以使用它为该方法添加许多参数。注意参数列表中没有空格。\n\n`name`\
  \ 用于给窗口一个 HTML 名称——因此我们可以使用上述 `target` 方法使用该名称将链接打开到新窗口中。\n\n![](img/Image00000.jpg)\n\
  \n| JavaScript 入学者教程 |  |\n|  |  |  |\n|  |  |  |\n\n来自 `open` 方法的返回值是一个指向新打开窗口的对象变量。换句话说，如果我们像这样打开一个新窗口：\n\
  \n```javascript\nwin = window.open(“page.html”, “”, “”);\n```\n\n我们可以使用对象变量 `win`\
  \ 通过 JavaScript 更改新窗口。\n\n一个实际示例——假设我们想打开一个高 300 像素、宽 400 像素的新窗口，并在其中显示 BBC 新闻页面。以下代码即可：\n\
  \n```javascript\nwindow.open(“http://news.bbc.co.uk/”, “bbc”, “width=300,height=300”);\n\
  ```\n\n下表给出了一些可用参数：\n\n| 参数 | 值 | 功能 |\n| :--- | :--- | :--- |\n| location | Yes/no\
  \ | 指定是否显示位置（地址）栏 |\n| menubar | Yes/no | 指定是否显示菜单栏 |\n| status | Yes/no | 指定是否显示状态栏\
  \ |\n| width | Pixels | 指定新窗口的宽度 |\n| height | Pixels | 指定新窗口的高度 |\n| resizable\
  \ | Yes/no | 允许或禁止重调整窗口大小 |\n| scrollbars | Yes/no | 允许或禁止窗口滚动 |\n\n如果未设置任何参数，则每个参数的值在适当的情况下将被设置为“yes”。例如：\n\
  \n```javascript\nwindow.open(“http://www.bbc.co.uk/”, “bbc”, “”);\n```\n\n等同于：\n\
  \n```html\n<a href=”http://www.bbc.co.uk/” target=”bbc”>\n```\n\n![](img/Image00000.jpg)\n\
  \n| JavaScript 入学者教程 |  |\n|  |  |  |\n|  |  |  |\n\n但然而，如果设置了任何参数，所有其他参数都将默认为“no”。所以如果你只想有一个滚动条而没有其他设置，以下代码即可：\n\
  \n```javascript\nwindow.open(“http://www.bbc.co.uk/”, “bbc”, “scrollbars=yes”);\n\
  ```\n\n### 项目\n\n打开你之前的项目文件，并将其保存为 `chapter_25.htm`。\n\n从你之前的代码开始，在页面的 `head` 区域脚本元素中创建一个名为\
  \ `view_new_log` 的新函数。该函数应该：\n\n1. 打开一个 200 像素正方形的新窗口。\n2. 从 images 文件夹加载图像 `logo.jpg`。\n\
  3. 命名为 `RLogo`。\n4. 存储在对象变量 `objNewLog` 中。\n5. 无滚动条，固定大小，并且尽可能没有其他功能。\n\n从链接中删除所有事件处理程序，并添加一个新的处理程序以便在点击链接时运行上述函数。一旦你验证了点击链接时按需弹出窗口，请在函数测试上表中的每个参数。\n\
  \n![](img/Image00000.jpg)\n\n| JavaScript 入学者教程 |  |\n|  |  |  |\n|  |  |  |\n\n\
  ## 26 浏览器窗口的定位\n\n## 关键要点\n\n`screen` 对象允许你在 JavaScript 应用程序中访问用户计算机显示屏的属性。一些可用属性如下：\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| availHeight | 用户屏幕的像素高度，减去工具栏和任何其他永久对象（例如 Windows\
  \ 任务栏） |\n| availWidth | 与 availHeight 相同，但处理水平空间 |\n| colorDepth | 用户屏幕可以显示的最大颜色数（位位格式，例如\
  \ 24 位、16 位等） |\n| height | 用户显示器的真实像素高度 |\n| width | 用户显示器的真实像素宽度 |\n\n`open()`\
  \ 方法的 `left` 和 `top` 参数允许你通过指定从屏幕左侧和顶部的像素数来指定窗口在屏幕上的位置。\n\n\n\n\n\n如果你需要使用变量来指定\
  \ `open()` 方法中参数的值，可以如下操作：\n\n```javascript\nwindow.open(“index.html”, “window_name”,\
  \ “width=200,height=200,left=”+var_left+ “top=”+var_top);\n```\n\n其中 `var_left`\
  \ 和 `var_top` 是适当的变量。\n\n![](img/Image00000.jpg)\n\n| JavaScript 初学者教程 | |\n|---|---|\n\
  | | | | |\n| | | | |\n\n注意使用 `+` 运算符，以确保在添加变量时，`open()` 方法的第三个参数保持为一个字符串。\n\n为了让窗口在用户的屏幕上居中，需要一点简单的几何知识。屏幕的中心显然是屏幕宽度除以\
  \ 2 且高度除以 2 得到的点。然而，如果我们将窗口的顶部和左侧值设置为这些坐标，居中的将是窗口的左上角，而不是窗口本身。\n\n为了居中，我们需要从顶部值中减去窗口高度的一半，并从左侧值中减去窗口宽度的一半。实现此点的简单脚本如下：\n\
  \n```javascript\nwin_width = 200;\nwin_height = 200;\nwin_left = (screen.availWidth/2)\
  \ - (win_width/2);\nwin_top = (screen.availHeight/2) - (win_height/2);\n```\n\n\
  通过使用此脚本，对于任何适当使用 `win_width` 和 `win_height` 的窗口，`win_left` 和 `win_top` 的值将被正确设置，以便在屏幕上居中。\n\
  \n### 项目\n\n打开之前的项目文件，并将其保存为 `chapter_26.htm`。\n\n修改现有代码以确保 Logo 在用户的屏幕上居中。如果可能，不要通过增加两个两个新函数——`get_win_left(width)`\
  \ 和 `get_win_top(height)` 来修改你的原始函数。\n\n![](img/Image00000.jpg)\n\n| JavaScript\
  \ 初学者教程 | |\n|---|---|\n| | | | |\n| | | | |\n\n## 27 焦点（Focus）与模糊（Blur）\n\n###\
  \ 关键点\n\n`window` 对象的 `focus()` 方法赋予特定窗口焦点。换句话说，它确保该窗口位于任何其他窗口之上，并由计算机激活。例如，如果我们创建了一个新窗口并将结果存储在名为\
  \ `new_window` 的对象变量中，我们可以在窗口打开后的任何时候通过以下代码确保该窗口回到最前层：\n\n```javascript\nnew_window.focus();\n\
  ```\n\n相反，我们可以使用 `blur()` 方法移除指定窗口的焦点——并根据情况将焦点返回给之前选中的窗口。它的用法与 `focus()` 方法类似。\n\
  \n这两个事件都有关联的事件处理器：`onblur` 和 `onfocus`。然而，由于它们没有关联的 HTML 标签，我们该如何将事件处理器附加到对象上呢？\n\
  \n事实证明，在 JavaScript 中，每个对象对于其可以应用的每个事件处理器都有一个单独的属性。例如，如果我们想为页面上的图像标签添加事件处理器，可以采用以下方法之一：\n\
  \n```html\n<img src=\"…\" id=\"test_img\" onclick=\"do_something();\" />\n<script>\n\
  document.getElementById(“test_img”).onclick = do_something();\n</script>\n```\n\n\
  ![](img/Image00000.jpg)\n\n| JavaScript 初学者教程 | |\n|---|---|\n| | | | |\n| | | |\
  \ |\n\n所以，为了将函数附加到窗口的焦点事件，我们可以使用：\n\n```javascript\nnew_window.onfocus = some_function();\n\
  ```\n\n### 项目\n\n打开之前的项目文件，并将其保存为 `chapter_27.htm`。\n\n修改你的函数，在打开原始窗口的同时打开另一个窗口，并具有以下功能：\n\
  \n- 第二个窗口应命名为 `oldLogo`，赋值给对象变量 `objOldLogo`，并显示文件 `images/rocollogo.gif` 中的旧 Logo。\n\
  - 打开时，窗口的位置应该安排得使得两个窗口都能清晰可见。\n- 此时测试你的修改。\n- 观察窗口打开时函数的动作，然后将原始窗口置于它们前面并再次调用该函数。\n\
  - 在函数中添加一条新语句，使用 `focus()` 方法确保在调用函数时，两个新窗口都移动到窗口“堆栈”的顶部。\n- 观察当调用函数时哪个 Logo 显示在“最上方”。再次使用\
  \ `focus()` 方法来改变这一点。\n\n![](img/Image00000.jpg)\n\n| JavaScript 初学者教程 | |\n|---|---|\n\
  | | | | |\n| | | | |\n\n## 28 动态创建内容\n\n### 关键点\n\n按需创建新页面非常简单。在这种背景下，我们讨论的是在没有文件的情况下创建一个新页面。要做到这一点，调用\
  \ `window` 对象的 `open()` 方法并将位置留空：\n\n```javascript\nnew_win = window.open(\"\",\
  \ “newWin”)\n```\n\n接下来，记住你可以使用窗口的 `write()` 方法向页面写入。到为止我们只使用了当前窗口。然而，我们可以指定想要操作的窗口：\n\
  \n```javascript\nnew_win.write(\"<html><head>\");\nnew_win.write(\"<title>demo</title>\"\
  );\nnew_win.write(\"</head><body>\");\nnew_win.write(\"<h1>Hello!</h1>\");\nnew_win.write(\"\
  </body></html>\");\n```\n\n### 项目\n\n打开之前的项目，并将其保存为 `chapter_28.htm`。\n\n![](img/Image00000.jpg)\n\
  \n| JavaScript 初学者教程 | |\n|---|---|\n| | | | |\n| | | | |\n\n修改你的现有脚本以创建一个具有以下内容的第三个窗口：\n\
  \n- 窗口应命名为 `newWin`，并赋值给对象变量 `objNewWin`。\n- 它应该是 400 像素的正方形。\n- 它在创建时不应加载任何页面。它应该以\
  \ `<h1>` 形式显示单词“Welcome”。\n- 它应该包含一个文本为“Please decide which logo you like to choose.”的段落。\n\
  - 第三个窗口的标题应为“Rocol Art”。\n- 当所有窗口都打开后，第三个窗口应获得焦点。\n- 在浏览器中检查你的工作。\n\n## 29 处理多个窗口\n\
  \n### 关键点\n\n`window` 对象的 `close()` 方法允许你关闭窗口。如果你在当前窗口中有一个指向想要关闭的窗口的对象变量，你可以简单地使用：\n\
  \n```javascript\nnew_window.close();\n```\n\n来关闭该窗口。\n\n当你想要从打开窗口的其他窗口关闭窗口时，情况会变得复杂一些。为了解决这个问题，我们需要考虑窗口的作用域（scope）。\n\
  \n当我们把 JavaScript 写入代码时，该脚本中的所有函数和变量供我们在该窗口内使用。例如，如果我们在主窗口中有一个名为 `say_hello()` 的函数，我们可以轻松地调用该函数。然而，如果我们想从新打开的窗口中调用该函数，就无法从新窗口直接调用它，因为我们的函数和变量是“绑定”在它们最初定义的窗口中的。\n\
  \n这就是为什么当我们想要向包含我们 JavaScript 代码的任何窗口写入内容时，我们必须访问该窗口的文档对象（document object），以便将内容放在正确的位置。\n\
  \n但反方向又呢？假设我们在主窗口（称之为窗口 1）中使用一个函数来打开一个新窗口（窗口 2）。如果我们把窗口 2 存储为对象变量，我们就可以通过该对象从窗口\
  \ 1 访问窗口 2 的所有属性。问题是，我们如何从窗口 2 访问窗口 1 的任何属性呢？\n\n\n\n\n\n# 初学者 JavaScript 入\n\n\
  关键在于 `window 2` 和 `window 1` 之间存在特殊的关系——“父/子”关系。我们可以通过使用名为 `opener` 的特殊对象从 `window\
  \ 2` 访问 `window 1` 的任何属性。该对象是在任何由 `JavaScript` 打开的窗口中创建的，它始终引用打开该新窗口的那个窗口。\n\n为了说明这一点，让我们考虑之前的项目。我们有三个新窗口和一个“父”窗口。如果我们想在其中一个新窗口上使用事件处理程序来关闭另一个新窗口，我们需要先访问父窗口，然后访问父窗口中指向我们想要关闭的窗口的对象变量。\n\
  \n假设我们想从 `window_1` 中的一个链接关闭 `window_2`。我们需要在链接中创建一个包含以下代码的事件处理程序：\n\n```html\n\
  onclick=\"opener.window_2.close();\"\n```\n\n### 项目\n\n打开你之前的项目文件，并将其保存为 `chapter_29.htm`。\n\
  \n修改现有的脚本以实现以下功能：\n- 在第三个窗口的内容中添加两个新段落，包含以下文本：\n  The Old Logo（旧标志）\n  The New Logo（新标志）\n\
  - 每一行都包含在一个超链接中，其事件处理程序将访问指向相应新窗口的父窗口对象变量。然后调用其 `close()` 方法。\n\n在浏览器中检查你的工作。\n\n\
  ![](img/Image00000.jpg)\n\n## 30 使用外部脚本文件\n\n### 关键点\n\n- `JavaScript` 可以轻松地让我们避免编写大量的\
  \ HTML。正如我们所看到的，我们可以使用 `JavaScript` 少量的代码来生成大型表单元素和表格。这对我们来说是个好消息，因为它让我们的工作变得更简单。这对我们的访问者来说也是一个好消息，因为他们只需要下载少量的代码即可获得较大量的内容。\n\
  - 然而，我们可以做得更好。目前，如果我们有一个函数用于为表单的出生日期部分生成年份下拉菜单，我们需要在每个需要它的页面中都包含该函数。这意味着我们的访问者正在多次下载相同的内容。此外，如果我们更改或改进了该函数，就必须确保在包含该函数的每个页面中更新它。\n\
  - `HTML` 允许我们解决这个问题，由于它提供了一种机制，可以将外部文本文件加载到 `HTML` 页面中，并将其内容视为 `JavaScript` 代码。由于它是单独的文件，一旦被下载过，如果另一个页面请求该文件，浏览器将不再下载该文件的后续副本。换句话说，我们可以将所有的\
  \ `JavaScript` 代码加载到一个文件中，文件中的任何更改将立即反映在整个网站上。\n- 要使用外部文件中的代码，我们仍然使用 `<script>`\
  \ 标签——但使用一个新属性 `src` 属性。这与在页面上加载图像文件非常相似：\n\n```html\n<script language=\"JavaScript\"\
  \ type=\"text/JavaScript\" src=\"s/script_file.js\"></script>\n```\n\n注意三点：\n![](img/Image00000.jpg)\n\
  \n- `language` 和 `type` 属性在这里是关重要的。\n- `script` 标签仍然有一个闭合标签 `</script>`。\n- 当我们使用标签加载外部文件时，不能在标签之间添加任何额外的\
  \ `JavaScript`。要仅向当前页面添加 `JavaScript`，我们必须使用第二组 `<script>` 标签。\n\n### 项目\n\n打开你之前的项目文件，并将其保存为\
  \ `chapter_30.htm`。\n\n- 将所有的 `JavaScript` 函数定义以及 head 部分 `script` 元素中的任何其他代码，移动到名为\
  \ `script.js` 的新文件中。\n- 修改你的 head 部分 `script` 元素以从新文件加载代码。\n- 检查你的页面是否仍按预期工作。\n\n\
  **注意**：`.js` 文件扩展仅是一种命名约定。`<script>` 标签将从任何文本文件加载 `JavaScript`（因此需要包含 `type` 和 `language`\
  \ 属性）。然而，这是一个广泛使用的约定，值得遵循它，以确保未来任何可能维护你代码的人都能轻松理解它。\n\n![](img/Image00000.jpg)\n\
  \n## 31 JavaScript 与表单\n\n### 关键点\n\n- 没有 `JavaScript`，服务器将处理所有通过表单提交的信息的验证和处理。在方程的客户端使用\
  \ `JavaScript` 可以为用户节省时间并创建一个更高效的过程。\n- 某些处理可以由 `JavaScript` 处理（例如数学计算），并且 `JavaScript`\
  \ 可以确保只将正确的数据发送到服务器进行处理。\n- `JavaScript` 与服务器端处理配合使用——它不是它的替代品。\n- 要访问表单中的信息，我们使用\
  \ `document` 对象的 `getElementById()` 方法，正如我们之前访问页面上的其他对象一样。例如，如果页面上有如下所示的表单：\n\n\
  ```html\n<form id=\"testForm\" ... >\n</form>\n```\n\n我们在 `JavaScript` 中通过以下方式访问它：\n\
  \n```javascript\ndocument.getElementById('testForm');\n```\n\n生成的对象实际上是一个多维数组。它的每个元素本身本身都是一个包含表单信息（文本框、按钮）的数组。通过正确命名\
  \ `<INPUT>` 标签中表单的每个元素，你就可以进行访问。\n\n![](img/Image00000.jpg)\n\n要访问表单中名为 `Name` 的文本框数据，你需要使用\
  \ `value` 属性，如下：\n\n```javascript\nobjForm = document.getElementById('Enquiry');\n\
  strValue = objForm.Name.value\n```\n\n将表单数据发送到服务器有两种。使用 `method` 属性，你可以指定 `GET`\
  \ 或 `POST` 方法：\n\n```html\n<form id=\"enquiryform\" method=\"GET\">\n```\n或者\n```html\n\
  <form id=\"enquiryform\" method=\"POST\">\n```\n\n通常情况下，如果你想从表单发送大量数据（例如文件、大量文本），你应该使用\
  \ `POST` 方法。如果你想处理搜索表单等，应该使用 `GET` 方法，因为 `GET` 表单将像 URL 一样传输，因此可以被“保存”为书签或链接。\n\n\
  通常，会将表单发送到服务器端脚本，该脚本由表单的 `action` 属性指定：\n\n```html\n<form id=\"enquiryform\" method=\"\
  GET\" action=\"process.php\">\n```\n\n当用户点击表单的提交按钮时，如果没有 JavaScript 的干预，表单数据将直接发送到服务器进行处理。但你可以通过在\
  \ `<form>` 标签中包含 `onsubmit` 事件处理程序，在发送之前拦截数据（以便用 `JavaScript` 对其进行处理）。这允许你在发送数据之前运行\
  \ JavaScript 函数：\n\n```html\n<form id=\"enquiryform\" method=\"GET\" action=\"process.php\"\
  \ onsubmit=\"functionName()\">\n```\n\n在上面的示例中，当用户点击提交按钮时，首先运行函数 `functionName()`，然后将数据发送到服务器。\n\
  \n![](img/Image00000.jpg)\n\n当表单提交触发 `submit` 事件时，浏览器会等待发现事件处理程序返回的内容。默认情况下，事件处理程序将返回\
  \ `true`。\n\n然而，如果事件处理程序返回 `false` 值，表单的提交将中止，页面将不会提交到服务器。\n\n\n\n\n通过从你的函数返回 `true`\
  \ 或 `false` 值（如上例中的 `functionName()`），并确保该值也是 `onsubmit` 事件处理器的返回值，你就可以决定表单数据是否实际发送到服务器。\n\
  \n你通过以下方式指定函数的返回值为 `onsubmit` 事件处理器的返回值：\n\n`onsubmit=\"return functionName();\"\
  `\n\n### 项目\n\n打开你之前的项目文件，并将其保存为 `chapter_31.html`。\n\n清除页面 `body` 元素中的所有内容，并确保\
