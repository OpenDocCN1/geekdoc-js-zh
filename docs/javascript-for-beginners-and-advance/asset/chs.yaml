  \n![](img/Image00000.jpg)\n\n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\n##\
  \ 35 选菜单项的动作\n\n### 关键点\n\nHTML `<select>` 表单标签允许你创建一个包含选项的菜单（选择框），用户可以从中进行选择：\n\
  \n```html\n<form id=”menu”>\n  <select name=”Product”>\n    <option value=”one”>Image\
  \ one</option>\n    <option value=”two”>Image two</option> \n    <option Value=”three”>Image\
  \ three</option>\n  </select>\n</form>\n```\n\n通常，从选择框中选择选项仅指定选择框的值。这将被用于进一步处理——通过\
  \ JavaScript 或通过服务器。\n\n你可以使用 JavaScript 根据选择框的当前值（选中的选项）来调用动作。这些动作可能是直接加载另一个页面或执行某些其他类型的处理。\n\
  \n这种动作的另一种名称是“跳转菜单（jump menu）”。\n\n为了实现这一点，你需要知道表单上的每个选择框都有一个与其关联的 select 对象。使用上面的示例，因此可以通过以下方式访问位于\
  \ `ProductMenu` 表单上的 `Product` 选择框的当前值（即当前选中选项的值）：\n\n```javascript\ndocument.getElementById(“menu”).Product.value\n\
  ```\n\n![](img/Image00000.jpg)\n\n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\
  \n正如你所预期的，select 选项具有关联的方法和事件处理器：\n\n- `focus()` 方法赋予选择框焦点。\n- `blur()` 方法从选择框中移除焦点。\n\
  - select 对象的可用事件处理器如下所示：\n\n| 事件处理器 | 当……时运行 JavaScript 代码 |\n| :--- | :--- |\n\
  | `onblur` | 选择框失去焦点 |\n| `onfocus` | 选择框获得焦点 |\n| `onchange` | 选择框的值被修改 |\n\n当用户从选择框中选择选项时，调用动作的方法是准备一个\
  \ JavaScript 函数，该函数将通过 select 对象的 `onchange` 事件处理器被调用：\n\n```html\n<select name=”name”\
