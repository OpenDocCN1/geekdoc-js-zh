  \n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\n## 34 对象变量 – 复习\n\n### 关键点\n\n\
  引用对象可能是一个漫长的过程。考虑上一个示例中的 `Player 1` 文本框。你如下完整地引用它：\n\n```javascript\ndocument.getElementById(“MaxWins”).Player1\n\
  ```\n\n这种表示法虽然精确，但枯燥、耗时，并且容易出错。幸运的是，有一些快捷方法可以节省时间并减少输入错误。\n\n每当我们处于需要反复引用某些对象的情况时，就可以使用对象变量来简化工作。要使用对象变量，你首先简单地将其赋值给一个特定对象：\n\
  \n```javascript\noPlayer1 = document.getElementById(“MaxWins”).Player1\n```\n\n\
  一旦赋值，你就可以在任何可以使用特定对象本身的地方使用该对象变量。使用上一段中的对象变量：\n\n`oPlayer1.value` 等同于：\n\n```javascript\n\
  document.getElementById(“MaxWins”).Player1.value\n```\n\n![](img/Image00000.jpg)\n\
  \n| JavaScript 初学者 |  |\n|  |  |  |\n|  |  |  |\n\n请记住，你是将对象赋值给对象变量。你会将文本框、按钮或图像等赋值给对象变量，然后如上所示引用该对象的属性（`oPlayer1.value`）。你不会将文本或字符串值赋值给对象变量。因此：\n\
  \n```javascript\noPlayer1 = document.getElementById(“MaxWins”).Player1.value\n```\n\
  \n这仅仅是将存储在 `Player 1` 中的值赋值给变量 `oPlayer1`。\n\n希望显而易见，你不需要在对象变量名的开头包含‘o’。这只是为了区分不同类型变量的习惯。\n\
  \n### 项目\n\n打开你之前的项目文件，并将其另存为 `chapter_34.htm`。\n\n按如下方式修改 `head` 区域 `script` 元素中的函数：\n\
