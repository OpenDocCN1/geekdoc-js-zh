  \n![](img/Image00000.jpg)\n\n## 12 比较\n\n### 关键点\n\n比较运算符比较两个值。最常见的用法是比较两个变量的内容——例如，我们可能想要检查\
  \ `var_1` 的值在数值上是否大于 `var_2`。\n\n当你使用比较运算符时，比较返回的值始终是 `true` 或 `false` 的布尔值。例如，考虑以下语句：\n\
  \n```\nvar_1 = 4;\nvar_2 = 10;\nvar_3 = var_1 > var_2;\n```\n\n在这种情况下，`var_3` 的值是\
  \ `false`。注意，布尔值 `false` 与文本字符串“false”并不相同：\n\n```\nvar_4 = false; // 布尔值\nvar_5\
  \ = \"false\"; // 文本字符串\n```\n\n常见的比较运算符所示：\n\n| 比较 | 功能 |\n| :--- | :--- |\n| `x\
  \ == y` | 如果 `x` 和 `y` 等价，返回 `true`；否则返回 `false` |\n| `x != y` | 如果 `x` 和 `y` 不相等，返回\
  \ `true`；否则返回 `false` |\n| `x > y` | 如果 `x` 在数值上大于 `y`，返回 `true`；否则返回 `false` |\n\
  | `x >= y` | 如果 `x` 在数值上大于或等于 `y`，返回 `true`；否则返回 `false` |\n| `x < y` | 如果 `x` 在数值上小于\
  \ `y`，返回 `true`；否则返回 `false` |\n| `x <= y` | 如果 `x` 在数值上小于或等于 `y`，返回 `true`；否则返回\
  \ `false` |\n| `!x` | 反转 `x` 的逻辑值 |\n\n## 13 条件语句\n\n### 关键点\n\n到目前，我们的项目还无法做出决策。例如，如果有一个名字列表并以不同的方式进行问候，那就好了。条件语句赋予了我们这种能力，是使用\
  \ JavaScript 的关键。条件语句由三部分组成：\n- 一个测试（通常带有比较运算符），用于检查给定条件为真为假。\n- 如果条件为真，则执行的代码块。\n\
  - 如果条件为假，则执行的代码块（可选）。\n\n这三部分在 JavaScript 中的表示方式如下所示：\n\n```\nif (conditional_test)\
  \ {\n    JavaScript statement;\n    JavaScript statement;\n    JavaScript statement;\n\
  }\nelse {\n    JavaScript statement;\n    JavaScript statement;\n    JavaScript\
  \ statement;\n}\n```\n\n从第一个括号（括号）开始的所有都是可选的，因此以下原型也是有效的：\n\n```\nif (conditional_test)\
  \ {\n    JavaScript statement;\n    JavaScript statement;\n    JavaScript statement;\n\
  }\n```\n\n在这种情况下，如果 `conditional_test` 不返回 `true`，则什么都不会发生。\n\n完整条件语句的示例如下：\n\n\
  ```\nif (var_1 > var_2) {\n    alert(\"Variable 1 is greater”);\n}\nelse {\n   \
  \ alert(\"Variable 2 is greater”);\n}\n```\n\n注意，上面的条件并不总是正确的。考虑 `var_1` 等于 `var_2`\
  \ 的情况。在这种情况下，上面的代码将产生“Variable 2 is greater”的消息，因为 `var_1 > var_2` 返回 `false`。在这种情况下，我们希望在\
  \ `else` 分支中添加一个额外的条件：\n\n```\nif (var_1 > var_2) {\n    alert(\"Variable 1 is greater”);\n\
  }\nelse if (var_1 < var_2) {\n    alert(\"Variable 2 is greater”);\n}\n```\n\n\n\
  \n\n在这种情况下，相等判断不会产生任何输出，因为没有任何一个条件会返回 true。为了完整性，我们可以在语句中添加一个最后的 `else` 分支：\n\n\
  ```javascript\nif ( var_1 > var_2 )\n{\nalert(“Variable 1 is greater”);\n}\nelse\n\
  if ( var_1 < var_2 )\n{\nalert(“Variable 2 is greater”);\n}\nelse\n{\nalert(“The\
  \ variables are equal”);\n}\n```\n\n注意，在这种情况下，我们不需要在最后一个分支中检查相等性，因为如果 `var_1` 既不大于\
  \ `var_2` 也小于 `var_2`，那么——至少从数值上看——它们必须相等的。\n\n我们可以根据需要在此堆栈中继续添加多个 `else if` 语句。\n\
  \n![](img/Image0000.jpg)\n\n| JavaScript 初学者 JavaScript |  |\n|  |  |  |\n|  | \
  \ |  |\n\n如果你在条件测试后只有一个语句，可以省略大括号：\n\n```javascript\nif ( var_1 > var_2 )\nalert(“Variable\
  \ 2 is greater”);\n```\n\n然而，如果你稍后想向此条件分支添加更多语句，你就必须在块周围添加大括号，这可能会导致混淆。建议使用大括号包裹所有的条件代码块。\n\
  \n考虑以下代码块：\n\n```javascript\nif ( var_1 > 4 )\n{\nvar_2 = var_1;\n}\nelse\n{\nvar_2\
  \ = 4;\n}\n```\n\n这段代码相当长，但实现的功能相对很少——`var_2` 等于 `var_1` 或 `4`，以较大者为准。\n\n更简洁写法可以是：\n\
  \n```javascript\nvar_2 = 4;\nif ( var_1 > var_2 )\n{\nvar_2 = var_1;\n}\n```\n\n\
  然而，另一种更简洁的写法是使用三元运算符：\n\n```javascript\nvar_2 = (var_1 > 4) ? var_1 : 4;\n```\n\n\
  在上面的语句中，条件会被求值，如果为真，返回的是 `?` 和 `:` 符号之间的值；如果为假，则是 `:` 和 `;` 符号之间的值。\n\n### 项目\n\n\
