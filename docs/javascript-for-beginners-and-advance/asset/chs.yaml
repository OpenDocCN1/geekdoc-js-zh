  \ 在控制台中显示消息（用于调试）。\n![](img/Image00006.jpg)\n* 在代码中使用良好的编程实践。\n![](img/Image00005.jpg)\
  \ ![](img/Image00006.jpg)\n\n### 课程格式\n\n我们将在每节课中尝试许多示例。我们将让你编写代码、查看代码并编辑现有代码。代码将以框的形式呈现，框内将指示对代码需要进行的操作。\n\
  \n每当你看到像下面的白色框时，你将内容输入到编辑器窗口中亲自尝试示例。白色框顶部的 `CODE TO TYPE`（需输入的代码）栏包含你要遵循的指令：\n\n\
  ![](img/Image00007.jpg)\n\n**需输入的代码：**\n\n像这样的白色框包含供你尝试的代码（输入到文件中运行）。\n\n如果你已经写了一些代码，你需要添加的新代码看起来像这样。\n\
  \n如果我们想让你删除现有代码，要删除的代码看起来像这样。\n\n我们可能还会包含你不需要输入的指示性注释。\n\n我们可能会在操作系统的终端会话或其他命令行环境中运行程序并进行其他活动。这些内容将如下所示：\n\
  \n![](img/Image00008.jpg)\n\n**交互会话：**\n\n我们在这些 `INTERACTIVE`（交互）框中提供的纯黑文本是由系统提供的（不是让你输入的）。我们希望你插入命令看起来如下。\n\
  \n在灰色 `OBSERVE`（观察）框中呈现的代码和信息用于供你检查和吸收。这些信息通常会有颜色区分，并附有详细解释代码的文本：\n\n![](img/Image00009.jpg)\n\
  \n**观察：**\n\n像这样的灰色的“观察”框包含供你观察的信息（通常是代码细节）。\n\n随随其后的段落可能对“观察”框中高亮的信息提供更多细节。\n\n\
  我们还会把特别相关的信息单独列在“Note”（注意）框中：\n\n![](img/Image00010.jpg)\n\n**注意：** 注意事项提供了有用的信息，但对于执行当前任务并非绝对必要。\n\
  \n![](img/Image00011.jpg) ![](img/Image00012.jpg)\n\n**提示：** 提示提供了可能帮助你更容易使用工具的信息，例如快捷键。\n\
  \n![](img/Image00013.jpg) ![](img/Image00014.jpg)\n\n**警告：** 警告提供了有助于防止程序崩溃和数据丢失的信息。\n\
  \n![](img/Image00015.jpg)\n\n### CodeRunner 屏幕\n\n本课程在 CodeRunner 中呈现，它是 OST 的自环境。我们稍后会讨论细节，这里是屏幕各个区域的快速概述：\n\
  \n![](img/Image00016.jpg)\n\n这些视频解释了如何使用 CodeRunner：\n\n* [文件管理演示](http://www.youtube.com/watch?v=45sATp529Mw)\n\
  * [代码编辑器演示](http://www.youtube.com/watch?v=SvbM6vPAG9k)\n* [课程演示](http://www.youtube.com/watch?v=WmajY8bIXrA)\n\
  \n## 欢迎来到高级 JavaScript\n\n你可以快速上手 JavaScript。你只需要文本编辑器和一个浏览器，就可以开始实验。当你学习 JavaScript\
  \ 基础时，你可能用它来修改网页，并可能根据用户输入修改页面的样式。你可能已经写过事件监听器来处理点击事件等事件，并且很可能使用 JavaScript 验证表单数据，或在用户与其交互时添加和移除元素。\n\
  \n在本课程中，我们将专注于 JavaScript 语言本身。由于我们使用 JavaScript 的主要地方是在浏览器中创建交互网页，我们仍然会构建网页应用程序，但重点将放在语言特性，而不是\
  \ Web 以及我们创建 Web 应用的技术。本课程的目标是将让你对 JavaScript 的理解提升到更深层次，从脚本编写变为程序员。你将学习如何在编程中利用\
  \ JavaScript 的强大功能，以及如何避免常见错误。\n\n### 访问控制台\n\n我们将频繁使用控制台来查看通过 `console.log` 生成的输出，并检查代码。因此，在做其他事情之前，让我们确保你熟悉开发者控制台，并记住如何在每个主流浏览器中访问和使用它。大多数终端用户从未见过控制台，因为它是为那些创建、测试和调试代码的开发者准备，所以如果你以前没有使用控制台的经验，不要担心，我们会让你快速进入状态。\n\
  \n在本课程中，我们将使用 Chrome 浏览器控制台显示大多数示例，因为截至本文编写，它功能最全且是所有浏览器控制台中中最易使用的。但你应该熟悉多个浏览器控制台，以便测试和调试你的代码。\n\
  \n![](img/Image00017.jpg) 浏览器会不断更新新版本，其中包含新版本的控制台。注意，虽然控制台的基本功能可能保持不变，但你的控制台版本可能与你在本课程中看到的略有不同。当你熟悉不同的浏览器控制台时，你将学会如何使用每一个一个。\n\
  \n![](img/Image00018.jpg)\n\n为你的工作创建一个文件夹。在文件浏览器中，右键点击 Home（主）文件夹并选择“新建文件夹...”（或点击\
  \ Home 文件夹并按 `Ctrl+n`），输入新文件夹名称 `AdvJS` 并按回车。\n\n现在创建一个新的 HTML 文件，然后添加此代码：\n\n![](img/Image00019.jpg)\n\
  \n**需输入的代码：**\n\n```html\n<!doctype html>\n<html>\n<head>\n<title> Getting Started\
  \ </title>\n<meta charset=\"utf-8\">\n<script src=\"basics.js\"></script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n将其保存为 `basics.html` 位于你的 `/AdvJS` 文件夹中。\n\n现在创建一个新的\
  \ JavaScript 文件并添加此代码：\n\n![](img/Image00020.jpg)\n\n**需输入的代码：**\n\n```javascript\n\
  var onSale = true,\ninventoryLevel = 12,\ndiscount = 3;\n\nif (onSale && inventoryLevel\
  \ > 10) {\n  console.log(\"We have plenty left\");\n}\n\nif (onSale || discount\
  \ > 0) {\n  console.log(\"On sale!\");\n} else {\n  console.log(\"Full price\");\n\
  }\n```\n\n将其保存为 `basics.js` 位于你的 `/AdvJS` 文件夹中。\n\n现在 ![](img/Image00021.jpg）预览你的\
  \ `basics.html` 文件。你会看到空白网页。要查看 JavaScript 的结果，请打开浏览器的控制台。获取访问控制台的指令，请点击你使用的浏览器链接：\n\
  \n* Chrome (Image00006.jpg)\n* Safari (Image00006.jpg)\n* Firefox (Image00006.jpg)\n\
  * Internet Explorer (Image00006.jpg)\n\n在 Chrome 中访问控制台，使用 查看 | 开发者 | JavaScript\
  \ 控制台 菜单：\n\n![](img/Image00022.jpg)\n\n一旦启用了控制台，你可能需要刷新页面才能看到输出。你会看到：\n\n![](img/Image00023.jpg)\n\
  \n控制台有很多部分。在我们学习课程的过程中，你会越来越熟悉其中一些。\n\n继续下一步。\n\n\n\n\n\n要访问 Safari 中的控制台，请使用 `Developer\
  \ | Show Web Inspector` 菜单（如果你没有启用 `Developer` 菜单，可以通过菜单栏中的 `Preferences | Advanced\
  \ | Show Developer menu` 来启用）：\n\n![](img/Image00024.jpg)\n\n你可能需要刷新页面才能看到此输出：\n\
  \n![](img/Image00025.jpg)\n\n为了在 Safari 控制台中看到输出内容，请确保你已选择控制台中的 `Log` 标签页，并且选中了左侧列表顶部的“Current\
  \ log”（你可能只看到一条日志，但如果你刷新页面，就可以看到之前的日志。当前日志始终位于最顶端。这里就是你通过 `console.log` 输出的最新内容将出现的地方）。\n\
  \n继续下一步。\n\n要启用 Firefox 控制台，请使用 `Tools > Web Developer > Web Console` 菜单并访问控制台：\n\
  \n![](img/Image00026.jpg)\n\n你可能需要刷新页面才能在控制台中看到输出。请注意，在 Firefox 中，控制台的默认位置在网页上方（与\
  \ Chrome 和 Safari 不同）。你可以点击控制台中的 `Position` 菜单并选择“bottom”（底部）或“window”（窗口）来更改控制台的位置。选择“window”会将控制台弹出一个独立的窗口。\n\
  \n![](img/Image00027.jpg)\n\n继续下一步。\n\n要启用 Internet Explorer 控制台，请选择 `Tools | F12\
  \ Developer Tools` 然后选择 `Console` 标签页。\n\n![](img/Image00028.jpg)\n\n你可能需要刷新页面才能在控制台中看到输出。\n\
  \n## 使用控制台\n\n让我们仔细观察 Chrome 控制台，因为我们在整个课程的示例中都将使用它。其他浏览器控制台具有相同的基本功能。当你需要专门使用 Chrome\
  \ 控制台来跟进操作时，我们会通知你。\n\n![](img/Image00023.jpg)\n\n控制台顶部有几个标签页，包括我们正在使用的 `Console`。当你查看\
  \ `console.log()` 的结果以及通过检查是否有任何 JavaScript 错误来调试代码时，你会最频繁地使用 `Console`。在 Safari\
  \ 中，等对应的内容是截图所示的 `Log` 标签页；在 Firefox 中，它是你从菜单访问 `Web Console` 时看到的默认视图；在 IE 中，它是一个标记为\
  \ `Console` 的标签页。\n\n在 Chrome 中，如果你想将控制台在独立窗口中查看，点击左下角的图标：\n\n![](img/Image00029.jpg)\n\
  \n现在点击取消（undo）图标。这将为控制台创建一个独立的窗口。你可以点击该新窗口相同位置的图标，将其重新固定回原始窗口。尝试一下吧。\n\n你在控制台中看到了我们在代码中通过\
  \ `console.log` 创建的两个消息：\n\n![](img/Image00030.jpg)\n\n观察：\n\n```javascript\nvar\
  \ onSale = true,\ninventoryLevel = 12,\ndiscount = 3;\nif (onSale && inventoryLevel\
  \ > 10) {\n  console.log(\"We have plenty left\");\n}\n\nif (onSale || discount\
  \ > 0) {\n  console.log(\"On sale!\");\n} else {\n  console.log(\"Full price\");\n\
  }\n```\n\n上面以橙色显示的两个 `console.log()` 创建了控制台中的输出。语句出现的文件名以及这两个语句的行号会显示在控制台中，就在输出旁边。\n\
  \n在 Chrome 中，尝试点击其中一个行号，例如 `basics.js:5`。这将打开 `Sources` 标签页，并临时用黄色高亮该行：\n\n![](img/Image00031.jpg)\n\
  \n这可以帮助你追踪潜在的错误。“Sources”面板右侧有很多选项，包括“Call Stack”（调用栈）、“Scope variables”（作用域变量）和“Breakpoints”（断点），我们在以后学习更高级的主题时都会用到。请确保你已经下载了\
  \ Chrome 电脑上安装了最新版本以便测试。在编写本文时，当前版本是 `26`。你的版本可能不同，但没关系，因为控制台的基本功能是相同的。\n\n![](img/Image00032.jpg)\n\
  \n遗憾的是目前其他浏览器默认没有安装相同的工具。请务必去下载 Chrome 并熟悉控制台工具，即使你通常使用其他浏览器来创建网页。\n\n![](img/Image00018.jpg)\n\
  \n我们稍后会探索更多控制台内容，但现在我们仔细查看代码。\n\n## 良好的编程风格实践\n\n让我们回顾一些编写 JavaScript 程序的良好实践：\n\
  \n![](img/Image00030.jpg)\n\n观察：\n\n```javascript\nvar onSale = true,\ninventoryLevel\
  \ = 12,\ndiscount = 3;\nif (onSale && inventoryLevel > 10) {\n  console.log(\"We\
  \ have plenty left\");\n}\n\nif (onSale || discount > 0) {\n  console.log(\"On sale!\"\
  );\n} else {\n  console.log(\"Full price\");\n}\n```\n\n我们使用的变量都声明在顶部并赋予了默认值。通常情况下，将变量声明在文件顶部（如果是局部变量则在函数顶部）并给它们赋值是一个良好的习惯。给变量赋值通常比让它们未定义（undefined）要好。\n\
  \n我们使用了逗号分隔的来声明变量。尽管如此，你也可以每个变量声明单独放在一行，如下：\n\n![](img/Image00033.jpg)\n\n```javascript\n\
  var onSale = true;\ninventoryLevel = 12;\ndiscount = 3;\n```\n\n接下来，你会看到我们在每个语句后都使用了分号。虽然\
  \ JavaScript 不强制要求，但这是一个值得养成的习惯。如果你漏掉分号，JavaScript 可能会以你意料之外的方式解释你的语句。开始在每个语句后加上分号吧。\n\
  \n![](img/Image00030.jpg)\n\n```javascript\nvar onSale = true,\ninventoryLevel =\
  \ 12,\ndiscount = 3;\nif (onSale && inventoryLevel > 10) {\n  console.log(\"We have\
  \ plenty left\");\n}\n\nif (onSale || discount > 0) {\n  console.log(\"On sale!\"\
  );\n} else {\n  console.log(\"Full price\");\n}\n```\n\n另一个你应该养成的习惯是为每个 `if`（或 `while`、`for`\
  \ 等）代码块使用大括号，即使块中只有一个语句。如果一个块中只有一个语句，技术上你不需要使用 `{` 和 `}` 字符来界定块。然而，这是一个坏习惯，因为会导致你漏掉错误。始终使用大括号！\n\
  \n使用大量的空白区域。增加空白区域并格式化代码使其易于阅读，比为了节省空间而让代码变短要好。在处理更大更复杂的程序时，可读性至关重要，而且你以后可以对 JavaScript\
  \ 进行“压缩（minify）”，以移除空白并提高下载效率。\n\n![](img/Image00034.jpg)\n\n| Note | 市面上有很多“代码压缩”程序可以为你压缩代码，例如\
  \ | [jscompress.com](http://jscompress.com) 和 [YUI compressor](http://refresh-sf.com/yui/)\
  \ . |\n\n我们将在整个课程中涵盖其他良好的编程实践和风格建议。我们会在每课结束时回顾它们，这样你就有充足的练习机会。如果你想进一步探索这个主题，网上还有很多优秀的风格指南（当然，并不是它们在所有方面都意见一致）。我们喜欢\
  \ [Airbnb JavaScript Style Guide (github)](https://github.com/airbnb/javascript)\
  \ 。\n\n\n\n\n让我们练习使用控制台来检查代码中的值。更新你的文件 `basics.js` 来定义一个对象 `rect`，然后使用 `console.log()`\
  \ 显示它。在这里，我们将 `rect` 定义为一个对象字面量；即我们使用 `{` 和 `}` 字符来界定对象，并将其作为变量的值写出来。记住，对象只是键值对的集合。在这种情况下，`rect`\
  \ 只有两个属性——`width` 和 `height`：\n\n![](img/Image00035.jpg) 需要输入的代码：\n\n```\nvar onSale\
  \ = true,\ninventoryLevel = 12,\ndiscount = 3;\n\nif (onSale && inventoryLevel >\
  \ 10) {\n  console.log(\"We have plenty left\");\n}\n\nif (onSale || discount >\
  \ 0) {\n  console.log(\"On sale!\");\n} else {\n  console.log(\"Full price\");\n\
  }\n\nvar rect = {\n  width: 100,\n  height: 50\n};\n\nconsole.log(rect);\n```\n\n\
  保存你的更改（`basics.js`），并 ![](img/Image00036.jpg) 预览你的 HTML 文件（`basics.html`），或者如果它仍在浏览器中打开着，只需重新加载页面即可。确保浏览器控制台已打开（你可能需要刷新页面才能看到输出）。你将看到此输出：\n\
  \n![](img/Image00033.jpg)\n\n观察：\n```\nWe have plenty left\nOn sale!\nObject { width:\
  \ 100, height: 50 }\n```\n\n在 Chrome 中，它看起来像这样：\n\n![](img/Image00037.jpg)\n\n在\
  \ Safari 中，它看起来像这样（确保你点击 `Object` 旁边的小箭头以查看对象属性）：\n\n![](img/Image00038.jpg)\n\n\
  在 Firefox 中，它看起来像这样：\n\n![](img/Image00039.jpg)\n\n在 IE 中，它看起来像这样：\n\n![](img/Image00040.jpg)\n\
  \n注意每个略有不同，但每个控制台向你展示了关于对象的相同基本信息，包括两个属性名/值对。\n\n现在，让我们对代码做一个微小的更改：\n\n![](img/Image00041.jpg)\n\
  \n需要输入的代码：\n\n```\nvar onSale = true,\ninventoryLevel = 12,\ndiscount = 3;\n\nif\
  \ (onSale && inventoryLevel > 10) {\n  console.log(\"We have plenty left\");\n}\n\
  \nif (onSale || discount > 0) {\n  console.log(\"On sale!\");\n} else {\n  console.log(\"\
  Full price\");\n}\n\nvar rect = {\n  width: 100,\n  height: 50\n};\n\nconsole.log(rect);\n\
  console.log(\"My object rect is: \" + rect);\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)。在控制台中，你看到：\n\
  \n![](img/Image00043.jpg)\n\n观察：\n```\nObject { width: 100, height: 50 }\nMy object\
  \ rect is: [object Object]\n```\n\n你认为这是为什么的的？我们没有像之前那样看到对象包含的两个属性，而是只看到了对象的字符串表示\
  \ `\"[object Object]\"`。这并没有真正的帮助。在我们的代码中，我们在输出结果到控制台之前，通过将对象 `rect` 与字符串 `\"My\
  \ object rect is: \"` 拼接创建了一个字符串。之前，我们将对象本身传递给 `console.log()`，因此 `console.log()`\
  \ 函数显示了对象。现在我们传递一个字符串传递给 `console.log()`。当 JavaScript 将对象转换为字符串时，我们并没有得到一个非常有用的对象显示。\n\
  \n对你的代码做最后一次更改：\n\n![](img/Image00044.jpg)\n\n需要输入的代码：\n\n```\nvar onSale = true,\n\
  inventoryLevel = 12,\ndiscount = 3;\n\nif (onSale && inventoryLevel > 10) {\n  console.log(\"\
  We have plenty left\");\n}\n\nif (onSale || discount > 0) {\n  console.log(\"On\
  \ sale!\");\n} else {\n  console.log(\"Full price\");\n}\n\nvar rect = {\n  width:\
  \ 100,\n  height: 50 ,\n  toString: function() {\n    return \"Width: \" + this.width\
  \ + \", height: \" + this.height;\n  }\n};\n\nconsole.log(rect);\nconsole.log(\"\
  My object rect is: \" + rect);\nconsole.log(\"My object rect is: \" + rect.toString());\n\
  ```\n\n不要忘记在 `height` 属性值之后加上逗号！我们作为第三个属性值向此对象添加了一个方法，因此在第二个和第三个属性之间需要一个逗号 ![](img/Image00042.jpg)\
  \ 和 ![](img/Image00021.jpg)。\n\n![](img/Image00033.jpg)\n\n观察：\n```\nObject { width:\
  \ 100, height: 50, toString: function }\nMy object rect is: Width: 100, height:\
  \ 50\nMy object rect is: Width: 100, height: 50\n```\n\n`toString()` 方法现在作为 `rect`\
  \ 对象的一部分出现在 `console.log(rect)` 的输出中，你可以在上面输出的第一行看到。我们刚刚那行代码调用了此方法来显示对象的 `width`\
  \ 和 `height` 属性，你可以在上面输出的第三行看到它们。\n\n然而，之前显示 `\"[object Object]\"` 的第二行现在显示的内容与第三行相同。这是因为\
  \ JavaScript 在将对象转换为字符串时会自动调用 `toString()` 方法。如果你在对象中自己实现了 `toString()` 方法，那么这就是\
  \ JavaScript 将调用的方法。如果你没有实现，JavaScript 就会调用 `Object` 对象中的 `toString()` 方法，它是你在 JavaScript\
  \ 中创建的所有对象的父对象。`Object` 对象中实现的 `toString()` 版本在从对象创建有帮助的字符串方面做得并不好，正如你看到 `\"[object\
  \ Object]\"` 显示时的那样。\n\n现在不用担心这些细节；我们以后会回到这些问题。现在只需注意控制台显示输出的不同方式，这取决于你如何调用 `console.log()`\
  \ 以及传递给此函数的值的类型。\n\n这是 Chrome 中的输出。在截图中，我点击了显示对象属性的行（输出中的第三行），这会展开对象以显示更多细节，包括关于\
  \ `toString()` 方法的大量细节。再次，现在不要担心这些细节；我们将在课程的后续部分讨论它们，这样你在结束时就会知道它们的含义。\n\n![](img/Image00045.jpg)\n\
  \nSafari（注意你可以在此控制台中打开对象，还可以打开 `toString()` 方法以查看类似的细节）：\n\n![](img/Image00046.jpg)\n\
  \nFirefox:\n\n![](img/Image00047.jpg)\n\n看到输出行旁边的 (2) 吗？这意味着同一行输出显示了两次。\n\nIE:\n\
  \n![](img/Image00048.jpg)\n\n### 直接在控制台中进行交互\n\n到目前为止，我们一直在使用 `console.log()` 在控制台中显示消息，但你可以直接与控制台交互以显示变量的值、创建新语句，甚至修改你的网页。\n\
  \n在浏览器的控制台中，你将看到一个提示符，指示你可以在哪里输入自己的 JavaScript。点击控制台窗口中提示符旁边并输入：\n\n![](img/Image00049.jpg)\
  \ 交互会话：\n```\n> onSale\ntrue\n```\n\n![](img/Image00050.jpg) 注意 \">\" 字符是提示符，你不输入这部分。\n\
  \n![](img/Image00051.jpg)\n\n我们输入了全局变量 `onSale` 并按了回车。JavaScript 返回了 `onSale` 的值。\n\
  \n这是在 Chrome、Safari、Firefox 和 IE 浏览器中的输出：\n\n![](img/Image00052.jpg) ![](img/Image00053.jpg)\
  \ ![](img/Image00054.jpg)\n\n\n\n\n在这条语句中，你定义了一个新变量 `a`，其值为一个包含三个值的数组。你看到了值 `undefined`。这在起初可能会让你有点困惑。这并不意味着\
  \ `a` 的值是 `undefined`，它意味着执行这条语句后返回给控制台的结果是 `undefined`（也就是说，语句本身的值是 `undefined`）。\n\
  \n为了验证你确实为数组 `a` 创建了值，请在提示符处输入 `a`：\n\n![](img/Image00049.jpg)\n\n### 交互式演示：\n\n\
  ```\na\n[1, 2, 3]\n```\n\n现在，让我们在控制台中直接写一个循环来遍历这个数组。要做到这一点，你可以一行输入整个 `for` 循环，或者在\
  \ Chrome 和 Safari 中使用 `Ctrl+Enter`，在 Firefox 中使用 `Shift+Enter`，并点击多行模式图标 ( ![](img/Image00055.jpg)\
  \ ) 在控制台中创建换行。\n\n![](img/Image00056.jpg) 交互式演示：\n\n```\nfor (var i = 0; i < a.length;\
  \ i++) { console.log(\"a[\" + i + \"]: \" + a[i]);\n}\n```\n\n如果你忘记创建换行符并不小心按了 `Enter`。一旦你输入完并误按了\
  \ `Enter`，你会得到一个错误并必须重新完成代码，你会看到此输出：\n\n![](img/Image00033.jpg)\n\n### 观察：\n\n```\n\
  a[0]: 1\na[1]: 2\na[2]: 3\n```\n\n如果刷新页面会发生什么？`a` 的值会消失。通过控制台添加的变量仅对当前会话有效，在刷新或关闭标签页或窗口时就会消失。\n\
  \n实验一下吧！创建一些新变量并在控制台中写一些 JavaScript 语句。熟悉如何使用控制台，特别是在 Chrome 中。\n\n## 为你的代码编写注释\n\
  \n当然，我们不能不提到注释就结束这节课。注释是创建可读程序的重要部分，特别是当你的程序变得巨大且复杂时。你可能已经知道，在 JavaScript 中有两种注释代码的方法：`/*\
  \ ... */` 和 `//`。让我们都尝试一下这两个：\n\n![](img/Image00057.jpg)\n\n### 需要输入的代码：\n\n```javascript\n\
  /*\nvar onSale = true,\ninventoryLevel = 12,\ndiscount = 3;\nif (onSale && inventoryLevel\
  \ > 10) {\n  console.log(\"We have plenty left\");\n}\nif (onSale || discount >\
  \ 0) {\n  console.log(\"On sale!\");\n} else {\n  console.log(\"Full price\");\n\
  }\nvar rect = {\n  width: 100,\n  height: 50,\n  toString: function() {\n    return\
  \ \"Width: \" + this.width + \", height: \" + this.height;\n  }\n};\nconsole.log(rect);\n\
  console.log(\"My object rect is: \" + rect); \nconsole.log(\"My object rect is:\
  \ \" + rect.toString()); */\n\n//\n// 此函数计算圆的面积\n// @param {number} 圆的半径\n// @return\
  \ {number} 圆的面积\n//\nfunction computeArea(radius) {\n  return radius * radius *\
  \ Math.PI;\n}\nconsole.log(\"Area is: \" + computeArea(3));\n```\n\n在这里，我们使用 `/*\
  \ ... */` 来注释掉大块代码。这是标准做法，因为 `/*` 和 `*/` 分隔符为你提供了一种快速直接的方法来注释多行，这可以让测试和调试变得更容易。\n\
  \n我们还使用了 `//` 在我们添加到代码中的新 `computeArea()` 函数上方创建了几行注释。不过，我们没有将这些注释都放在 `/* ... */`\
  \ 中，因为如果我们稍后决定注释掉整个函数，我们可以将整个部分（包括标题注释）都放在 `/*` 和 `*/` 分隔符之间，这使得注释大块代码（包括多个函数）变得简单得多。当然，我们可以使用\
  \ `//` 临时注释掉单行代码以进行调试，或在函数内部提供注释。\n\n最后，注意我们注释此函数使用的样式。我们为该函数提供了简短描述，以及关于它预期的参数（圆的半径\
  \ `radius`）和它返回的值（圆的面积）的信息。\n\n我们不会总是对示例进行详细注释，但要养成为项目代码注释的习惯。你的同事（以及老板）会感激不尽，当你以后（当）需要回来修改你的代码时，你也会感激的。\n\
  \n花些时间在控制台中进行实验。在示例中添加更多 `console.log()` 语句（或创建自己的示例并进行实验）。直接在控制台中编写语句。\n\n从这里开始，我们将主要展示\
  \ Chrome 的截图，但你可以（也应该）在多个浏览器中尝试课程示例。当你需要使用特定的浏览器控制台进行测试时，我们会通知你。\n\n现在你已经掌握了使用控制台的基础知识，我们在下一节课中将进入\
  \ JavaScript 类型的细节。\n\n## 了解你的类型\n\n![](img/Image00005.jpg)\n\n### 课程目标\n\n当你完成本节课时，你将能够：\n\
  - 区分原始类型和对象。(![](img/Image00006.jpg)\n- 分类原始类型。(![](img/Image00006.jpg)\n- 区分 null\
  \ 和 undefined。(![](img/Image00006.jpg)\n- 构建对象。(![](img/Image00006.jpg)\n- 使用控制台对\
  \ JavaScript 类型、对象属性和各种数字表示进行实验。(![](img/Image00005.jpg) ![](img/Image00006.jpg)\n\
  \nJavaScript 只有几种基本类型，但它们仍然需要考虑。在这节课中，我们将回顾原始类型和对象的基础知识，深入一些你可能从未遇到过的细节，并加深对基础的理解。\n\
  \n### 了解你的类型：原始类型和对象\n\nJavaScript 中的每个值要么是原始类型要么是对象。原始类型是简单类型，如数字和字符串，而对象是复杂类型，因为它们由多个值组成，就像这个方形对象：\n\
  \n![](img/Image00058.jpg)\n\n### 观察：\n\n```javascript\nvar square = {\n  width:\
  \ 10,\n  height: 10\n};\n```\n\n这个对象由两个原始值组成：一个值为 `10` 的 `width`，另一个同样值为 `10` 的\
  \ `height`。\n\n我们将首先查看原始类型；稍后会回到对象。\n\n### 原始类型\n\n你最常用的三种原始类型是数字、字符串和布尔值。你可以直接在浏览器的控制台中测试这些类型。\n\
  \n在浏览器窗口中打开控制台并尝试输入一些原始值。某些浏览器不允许对空白页打开控制台。你可以加载上一节课为 `basics.html` 创建的网页，然后打开控制台，尝试测试某些类型，如下：\n\
  \n![](img/Image00059.jpg)\n\n### 交互式演示：\n\n```\n3\n3\n\"test\"\n\"test\"\ntrue\n\
  true\n```\n\n让我们尝试一个表达式：\n\n![](img/Image00049.jpg)\n\n### 交互式演示：\n\n```\n3 + 5\n\
  8\n```\n\n当你输入一个表达式时，该表达式的结果是一个值，它显示在控制台中。\n\n当你输入一条语句时，该语句的结果（通常）是 `undefined`：\n\
  \n![](img/Image0060.jpg)\n\n### 交互式演示：\n\n```javascript\nvar x = 3;\nundefined\n\
  x + 5\n8\n```\n\n在这里，我们在语句中声明了一个新变量 `x`（你在控制台中输入的第一个内容），然后在表达式 `x + 5` 中使用了它（你在控制台中键的第二个内容）。尽管语句将\
  \ `x` 的值设置为 `3`，但语句本身的结果是 `undefined`。表达式的结果只是表达式计算出的值。习惯这种行为，以免以后在控制台中看到 `undefined`\
  \ 时会感到困惑！\n\n### 使用 Typeof 获取值的类型\n\nJavaScript 有一个 `typeof` 运算符，你可以用它来检查值的类型。有几个原因导致你不一定要在代码中依赖这个运算符。我们稍后会讨论这些原因，但现在我们使用\
  \ `typeof` 来检查原始类型的类型，如下：\n\n![](img/Image0061.jpg)\n\n### 交互式演示：\n\n```\ntypeof\
  \ 3 \"number\"\ntypeof x \"number\"\ntypeof \"test\" \"string\"\ntypeof true \"\
  boolean\"\n```\n\n`typeof` 运算符看起来看起来有点奇怪；它不像你习惯的那些接受两个值的运算符。`typeof` 只接受一个值，并把该值的类型作为字符串返回。因此，数字\
  \ 3 的类型以字符串 \"number\" 返回。注意，我们可以对值（如 3）或包含值的变量（如 `x `）使用 `typeof`。\n\n\n\n\n你可以在表达式中使用\
  \ `typeof`，如下所示：\n\n![](img/Image00060.jpg)\n\n### 交互会话：\n\n```javascript\nif (typeof\
  \ x == \"number\") {\n  alert(\"x is a number!\");\n}\nundefined\n```\n\n记得在控制台的行末尾使用\
  \ `Ctrl+Enter` 或 `Shift+Enter` 以避免产生错误。在 `if` 语句的末尾（闭合大括号 `}` 之后）使用 `Enter`。你看到弹窗提示了吗？\n\
  \n我们将表达式 `typeof x` 的结果与字符串 `\"number\"` 进行比较，如果它们相等，就会弹出一个消息（是的，你可以从控制台弹出警告！）。`if`\
  \ 语句的结果是 `undefined`。\n\n## Null 和 undefined\n\n现在，让我们来看这两个原始类型：`null` 和 `undefined`。你已经在控制台输入的语句结果中看到过\
  \ `undefined` 了。它也会出现在其他地方，但不过，让我们先从 `null` 开始吧。\n\n`null` 是表示变量“没有值”的一种方式：\n\n\
  ![](img/Image00062.jpg) ### 交互会话：\n\n```javascript\nvar y = null; undefined\nif\
  \ (y == null) {\n  console.log(\"y is null!\");\n}\ny is null!\nundefined typeof\
  \ y \"object\"\n```\n\n在这里，我们把值 `null` 赋值给变量 `y`。所以 `y` 有一个值——一个表示“没有值”的值。很奇怪。我们可以将该值与\
  \ `null` 进行比较，由于 `y` 的值是 `null`，所以这个比较为真，因此我们在控制台中看到了消息 \"y is null!\"（是的，我们可以从控制台调用\
  \ `console.log()`！）。注意你在控制台中看到了 \"y is null\"，然后你看到了语句的结果，即 `undefined`。在 Chrome\
  \ 和 Safari 中，控制台会在语句结果 `undefined` 旁边显示一个微小的 `⋖` 字符，这样你就不会把控制台的输出（`\"y is null!\"\
  `）与语句的结果（`undefined`）搞混。在 Firefox 中，你会在语句结果旁边看到看到一个指向右侧的箭头。\n\n更奇怪的是，当你检查 `typeof\
  \ y` 时，得到的结果是 `\"object\"`。什么？这看起来不对劲。好吧，你猜怎么着——它确实不对！这是 JavaScript 当前实现中的一个错误。结果本应该是\
  \ `null`，因为 `null` 的类型是 `null`。\n\n![](img/Image00032.jpg)\n\n这个错误就是你不想在代码中依赖 `typeof`\
  \ 的原因之一。这个失误应该在 JavaScript 未来的实现中被修复，但现在如果你需要使用 `typeof`，请记住这一点。（`typeof` 还有另一个问题我们稍后会提到）。\n\
  \n![](img/Image00018.jpg)\n\n那么，`undefined` 呢？很多人初开始学习 JavaScript 时会混淆 `null` 和\
  \ `undefined`，所以如果觉得它看起来有点模糊，不要担心。虽然 `null` 是一个表示“没有值”的值（这本身就很绕脑筋），但 `undefined`\
  \ 表示一个变量完全没有值，甚至连 `null` 都：\n\n![](img/Image00060.jpg) ### 交互会话：\n\n```javascript\n\
  var z; undefined\nz undefined\n```\n\n你可以通过声明一个变量但不对其进行初始化来创建一个 `undefined` 变量。在这里，我们声明了变量\
  \ `z`，但没有给它初始化值。当我们通过在控制台中输入它的名称来检查 `z` 的值时，得到的结果是 `undefined`。\n\n不要把你看到的语句 `var\
  \ z;` 的结果 `undefined` 与你看到的表达式 `z` 的结果 `undefined` 混混。\n\n那么 `undefined` 的类型是什么呢？你能猜到吗？（这次，JavaScript\
  \ 的实现是正确的。）\n\n![](img/Image00049.jpg) ### 交互会话：\n\n```javascript\ntypeof z undefined\n\
  ```\n\n是的，`undefined` 的类型是 `undefined`！\n\n尽管 `z` 是 `undefined`（意味着它没有值），你仍然像这样测试\
  \ `z` 是否为 `undefined`：\n\n![](img/Image00063.jpg) ### 交互会话：\n\n```javascript\nif\
  \ (z == undefined) {\n  console.log(\"z is undefined!\");\n}\nz is undefined!\n\
  undefined\n```\n\n或者你可以像这样测试：\n\n![](img/Image00064.jpg) ### 交互会话：\n\n```javascript\n\
  if (typeof z == \"undefined\") {\n  console.log(\"z is undefined!\");\n}\nz is undefined!\n\
  undefined\n```\n\n你会得到相同的结果。尝试一下吧！尽管如此，通常我们建议除非你有充分理由，否则不要使用 `typeof`。你可以直接通过比较变量的值（在这种情况下是变量\
  \ `z` 与值 `undefined`）来测试变量是否为 `undefined`。在这里你你根本不需要使用 `typeof`。\n\n## 一些有趣的数字\n\
  \n在离开原始类型之前，让我们再多聊聊数字。在你的 JavaScript 程序中，你可能已经使用数字来遍历数组、表示价格、计数物品等等，但还有一些数字你可能还没有遇到。\n\
  \n首先，让我们过一下数字是如何表示的。在 JavaScript 中，表示数字有两种方式：整数（integers）和浮点数（floating point numbers）。例如：\n\
  \n![](img/Image00061.jpg) ### 交互会话：\n\n```javascript\nvar myInt = 3; undefined\n\
  var myFloat = 3.12583E03; undefined\nmyInt 3\nmyFloat 3125.83\n```\n\n你可以使用科学计数法写浮点数，`3.12583E03`（这意味着\
  \ \"E\" 之后的数字是该数字乘以 10 的次数）。当你想要表示非常大或非常小的数字时，这非常方便。\n\n说到这里，你如何知道最大或最小的数字？`Number`\
  \ 对象（我们稍后会详细讨论）拥有这些的内置属性：`MAX_VALUE` 和 `MIN_VALUE`。在你的控制台中尝试它们：\n\n![](img/Image00060.jpg)\
  \ ### 交互会话：\n\n```javascript\nNumber.MAX_VALUE 1.7976931348623157e308\nNumber.MIN_VALUE\
  \ 5e-324\n```\n\n哇。`MAX_VALUE` 非常大，MIN_VALUE` 非常小。你可能认为这意味着 JavaScript 可以表示很多数字，但\
  \ JavaScript 能表示的数字比你想象的要少得多。为什么？因为 `MAX_VALUE` 和 `MIN_VALUE` 都是浮点数表示的，注意，它们在 17\
  \ 位上是精确的。超过这个位数，它们就全是零了，例如 `1.79769313486231570000000e308`。\n\n当你需要精度时，你会想要使用整数，并且你需要知道\
  \ JavaScript 可以表示的最大（和最小）整数。让我们来看看 2 的 53 次方：\n\n![](img/Image00049.jpg) ### 交互会话：\n\
  \n```javascript\nMath.pow(2, 53) 9007199254740992\n```\n\n这也是大数字，但比 `MAX_VALUE`\
  \ 小得多。JavaScript 可以精确表示从零到这个数字的所有整数。这为你提供了大量的数字可以操作，而且也适用于最小整数 `Math.pow(2, -53)`。\n\
  \n理解计算机如何表示数字可能是一门课程，所以我们现在不会深入探讨这个主题。如果你对进一步探索这个主题感兴趣，可以 [ECMAScript](http://ecma262-5.com/ELS5_HTML.htm#Section_8.5)规范（JavaScript\
  \ 基于的规范），以及关于[二进制编码](http://en.wikipedia.org/wiki/Binary-coded_decimal)小数的 Wikipedia\
  \ 页面。\n\n![](img/Image00065.jpg)\n\n假设你正在现代电脑上使用现代浏览器，而 `Math.pow(2, 53)` 是基于 JavaScript\
  \ 表示 64 位数字的能力，现代电脑上的现代浏览器可以做到这一点。如果由于某种原因，你在旧电脑上使用旧浏览器，那么你的最大数字可能是基于 32 位数字的。\n\
  \n## 直达无穷远\n\n你可能还记得数学课上，如果除以 0，你会得到无穷。当你开始编程时，这会导致问题，因为如果你尝试在某些编程语言中表示无穷，呃这么说，你的电脑不会太高兴的。\n\
  \n\n\n\n\n## JavaScript 无穷 (Infinity)\n\n然而，JavaScript 非常乐意表示无穷：\n\n![](img/Image00059.jpg)\n\
  \n### 交互式会\n\n```javascript\nvar zero = 0; undefined\nvar crazy = 3/zero; undefined\n\
  crazy\nInfinity\n```\n\nJavaScript 在除以 0 时并没有报错，而是直接返回了值 `Infinity`。至少在 JavaScript\
  \ 中，`Infinity` 是什么？（我想我们可能现实世界中可能无法得知。）\n\n![](img/Image00049.jpg)\n\n### 交互式会\n\
  \n```javascript\ntypeof crazy \"number\"\n```\n\n在 JavaScript 中，`Infinity` 是一个数字（`-Infinity`\
  \ 也是如此）。如果你愿意，可以运行这个实验，但请准备好关闭浏览器窗口，因为这是一个永远不会结束的实验：\n\n![](img/Image00066.jpg)\
  \ 观察：\n\n```javascript\nvar counter = 0; undefined\nwhile (counter < crazy) { \n\
  \  counter++; \n  console.log(counter);\n}\n```\n1\n2\n3\n... 永远\n\n所以，虽然你可以在程序中表示\
  \ `Infinity`，但并不意味着你永远能到达它。不过，你可以通过测试它来防止错误：\n\n![](img/Image00067.jpg)\n\n### 交互式会\n\
  \n```javascript\nif (crazy == Infinity) { console.log(\"stop!\"); } stop!\n```\n\
  ⋖ undefined\n\n## NaN\n\n你应该知道的最后一个有趣的数字是 `NaN`，或者说 \"Not a Number\"不是数字）。等一下，一个意思是“不是数字”的东西竟然是个数字？是的！这是\
  \ JavaScript 世界的另一个奇现象。试一试：\n\n![](img/Image00059.jpg)\n\n### 交互式会\n\n```javascript\n\
  var invalid = parseInt(\"I'm not a number!\"); undefined\ninvalid\ntypeof invalid\
  \ \"number\"\n```\n\n在这里，我们尝试将字符串 \"I'm not a number\" 解析为整数。显然这会失败，因为在字符串 \"I'm\
  \ not a number\" 中没有任何东西看起来像整数。那么变量 `invalid` 的结果是什么呢？嗯，它是 `NaN`。而当我们检查 `invalid`\
  \ 的类型时，我们发现它确实是一个 \"number\"（数字），尽管它的值是 `NaN`。\n\n你可能认为可以这样测试结果是否为 `NaN`：\n\n![](img/Image00049.jpg)\n\
  \n### 交互式会\n\n```javascript\nif (invalid == NaN) { console.log(\"invalid is not\
  \ a number!\"); } undefined\n```\n\n但这不起作用。去吧，现在试一下。你不会在控制台中看到消息 \"invalid is not\
  \ a number!\"。\n\n相反，要测试一个变量是否不是数字，你需要使用内置函数 `isNaN()`：\n\n![](img/Image0056.jpg)\
  \ 交互式会：\n\n```javascript\nif (isNaN(invalid)) { console.log(\"invalid is not a number!\"\
  ); } invalid is not a number!\n```\n⋖ undefined\n\n不过使用 `isNaN()` 要小心。如果你写下面的代码，你预期得到什么：\n\
  \n![](img/Image00049.jpg)\n\n### 交互式会\n\n```javascript\nisNaN(\"3\") false\n```\n\
  \n你可能期望看到结果为 `true`（意味着字符串 \"3\" 不是数字），但我们得到了 `false`（意味着字符串 \"3\" 是数字）。为什么呢？因为\
  \ `isNaN()` 在检查它是否不是数字之前，会尝试将其参数转换为数字。在 \"3\" 的情况下，JavaScript 成功了。可以把这段代码等同于 `parseInt\
  \ (\"3\")` 并将结果 `3` 传递给 `isNaN()`。这种行为被广泛认为是 JavaScript 的一个 bug，可能会在未来的版本中修复。在此期间，只需确保你知道\
  \ `isNaN()` 是如何工作的，以便在你传递给它的值可以转换为数字时做好做好准备。\n\n## 对象 (Objects)\n\n我们在原始类型世界中花费了大量时间，现在让我们来到对象世界待一会儿。到目前为止，你可能已经对对象有了相当丰富的经验，但让我们快速回顾一下，以确保你为接下来的一些更高级的对象课程做好准备。\n\
  \n对象是属性的集合。属性可以是原始值、其他对象或函数（当它们在对象内部时，被称为方法）。让我们来看一个对象的示例。我们将创建一个简单的 HTML 文件来装载我们的对象（这比在控制台提示符处输入要简单）：\n\
  \n![](img/Image00068.jpg)\n\n### 需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title> Objects </title>\n<meta charset=\"utf-8\">\n<script>\nvar person\
  \ = {\n  name: \"James T. Kirk\",\n  birth: 2233,\n  isEgotistical: true,\n  ship:\
  \ {\n    name: \"USS Enterprise\",\n    number: \"NCC-1701\",\n    commissioned:\
  \ 2245\n  },\n  getInfo: function() {\n    return this.name + \" commands the \"\
  \ + this.ship.name;\n  }\n};\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\
  \n![](img/Image00042.jpg) 将其保存为 `/AdvJS` 文件夹中的 `objects.html`，然后 ![](img/Image00021.jpg)。你在页面上不会看到任何内容，所以打开控制台（并刷新页面以防万一）。由于我们将\
  \ `person` 定义为全局变量，我们可以在控制台中使用它：\n\n![](img/Image00069.jpg) 交互式会：\n\n```javascript\n\
  person.getInfo()\n\"James T. Kirk commands the USS Enterprise\"\n```\n\n`person`\
  \ 对象包含原始值属性和其它对象属性。我们说 `person.ship` 对象嵌套在 `person` 对象内部。你可以在对象中嵌套对象、在对象中嵌套对象，以此此类推，直到达到你想要的深度（尽管深度是有限制的，但在正常程序中不太可能触及），但请记住，嵌套的对象越多，你的对象就越低效。还要注意，最深层嵌套的对象必须具有原始值或方法属性（这样嵌套才能停止）。\n\
  \n## 添加和删除属性\n\nJavaScript 对象的一个酷点是它们是动态的，也就是说，你可以通过更改其值、甚至通过添加或删除属性来随时更改属性：\n\n\
  ![](img/Image00070.jpg)\n\n### 交互式会\n\n```javascript\nperson.title undefined\nperson.title\
  \ = \"Captain\"; \"Captain\"\nperson.title\n\"Captain\"\nperson\nObject {\n  name:\
  \ \"James T. Kirk\",\n  birth: 2233,\n  isEgotistical: true,\n  ship: Object,\n\
  \  getInfo: function\n  birth: 2233\n  getInfo: function () {\n  isEgotistical:\
  \ true\n  name: \"James T. Kirk\"\n  ship: Object\n  title: \"Captain\"\n  __proto__:\
  \ Object\n}\n```\n\n在这里，我们获取了 `person` 中不存在的属性 `person.title` 的值。结果是 `undefined`，这是我们的预期。接下来，我们通过定义并赋予值\
  \ \"Captain\" 为 `person` 设置了属性 `title`。现在，我们可以使用 `person.title` 获取该属性的值。当我们控制台中显示\
  \ `person` 的值时（只需输入对象的名称并按回车），我们看到 `title` 已经被添加到对象中，就像它一直在那里一样。（注意，我们通过点击 Chrome\
  \ 中对象旁边的箭头检查了 `person` 的详细信息。）\n\n现在，假设你想删除 `title` 属性：\n\n![](img/Image0071.jpg)\n\
  \n### 交互式会\n\n```javascript\ndelete person.title true\nperson.title undefined\n\
  person\nObject {\n  name: \"James T. Kirk\",\n  birth: 2233,\n  isEgotistical: true,\n\
  \  ship: Object,\n  getInfo: function\n  birth: 2233\n  getInfo: function () {\n\
  \  isEgotistical: true\n  name: \"James T. Kirk\"\n  ship: Object\n  __proto__:\
  \ Object\n}\n```\n\n`delete` 删除的是整个属性，而不仅仅是值。该属性不再存在于对象中，所以当我们尝试获取它的值时，再次得到了 `undefined`。当我们检查对象时，可以看到\
  \ title 属性已经消失了。\n\n这是加载 `objects.html` 后在 Chrome 中的控制台交互截图：\n\n![](img/Image0072.jpg)\n\
  \n## 对象的类型是什么？\n\n你想知道对象的类型吗？去吧，在控制台中使用 `typeof` 测试：\n\n![](img/Image00049.jpg)\n\
  \n### 交互式会\n\n```javascript\ntypeof person \"object\"\n```\n\n在这里，当我们询问 `person`\
  \ 对象的类型时，JavaScript 返回了字符串 \"object\"。很好。\n\n## 枚举对象属性\n\nJavaScript 有在程序内部检查对象属性的能力。这被称为类型检查。让我们来看一个示例。按照所示修改\
  \ `objects.html`。\n\n![](img/Image0073.jpg) 需要输入的代码：\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title> Objects </title>\n<meta charset=\"utf-8\">\n<script>\nvar\
  \ person = {\n  name: \"James T. Kirk\",\n  birth: 2233,\n  isEgotistical: true,\n\
  \  ship: {\n    name: \"USS Enterprise\",\n    number: \"NCC-1701\",\n    commissioned:\
  \ 2245\n  },\n  getInfo: function() {\n    return this.name + \" commands the \"\
  \ + this.ship.name;\n  }\n};\nconsole.log(person);\n</script>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n\n\n\n\n```javascript\nreturn this.name + \" commands the\
  \ \" + this.ship.name;\n\n};\n\nfor (var prop in person) {\n  console.log(person[prop]);\n\
  }\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00036.jpg) 。 你会在控制台中看到对象的每个属性显示——这是它在\
  \ Chrome 中看起来的样子：\n\n![](img/Image00074.jpg)\n\n让我们仔细观察我们是如何做到的：\n\n![](img/Image00033.jpg)\n\
  \n### 观察：\n\n```javascript\nfor (var prop in person) {\n  console.log(person[prop]);\n\
  }\n```\n\n我们使用 `for` 循环来遍历对象中的所有属性，但我们没有使用你可能熟悉的传统的 `for` 循环，而是使用了 `for/in` 循环（你可能在之前的课程中在访问\
  \ `LocalStorage` 中的键和值时用过它）。在 `for/in` 语句中，我们声明了一个变量：`prop`。每次循环时，`prop` 都会获取对象\
  \ `person` 中下一个属性的属性名。当我们遍历一个对象以访问其每个属性时，我们称之为为枚举对象的属性。\n\n然后，在循环内部，我们在控制台中显示对象属性的值。我们使用方括号表示法来访问对象的属性。你可以自己在控制台中尝试一下这个，看看它是如何工作的的：\n\
  \n![](img/Image00069.jpg)\n\n### 交互式练习：\n\n```\nperson[\"name\"] \"James T. Kirk\"\
  \n```\n\n要使用方括号表示法访问对象的属性值，你需要将属性名放在括号内的双引号中，并紧接对象的名称。\n\n这种表示法非常方便，因为它允许你预先访问属性（回想循环中的\
  \ `for/in` 属性名）。\n\n在不知道循环变量的名称的情况下访问对象的属性，并看到我们正在使用一个变量 `prop` 作为...\n\n你会在什么时候使用这个呢？嗯，你可能想将属性从一个对象复制到另一个对象，前提是该属性确实存在。你可以使用方括号表示法先检查属性是否存在。或者你可能正在使用\
  \ `XHR` (`Ajax`) 从文件加载 `JSON` 数据，并根据这些数据创建或修改对象。我们将在课程的后续部分看到几个例子，在其中枚举对象属性的能力将派上用场。\n\
  \n### 像对象一样的原始类型\n\n之前我们说过，你可以将 JavaScript 值分为两类：原始类型和对象。这表明它们是完全分离的，而且在大多数情况下确实如此。然而，你应该知道，某些原始类型——特别是数字、字符串和布尔值——有时可以像对象一样工作。\n\
  \n尝试一下这个：\n\n![](img/Image00061.jpg)\n\n### 交互式练习：\n\n```\nvar s = \"I'm a string\"\
  ; undefined\ns\n\"I'm a string\"\ns.length\n12\ns.substring(0, 3); \"I'm\"\n```\n\
  \n在第一行中，我们声明并初始化变量 `s` 为一个字符串 \"I'm a string\"。如你所知，字符串是一个原始类型。然而，我们请求了字符串的长度 `s.length`\
  \ 以及字符串的前三个字母 `s.substring(0, 3)`，将字符串 `s` 视为一个对象处理。毕竟，只有对象才有像 `length` 这样的属性和像\
  \ `substring()` 这样的方法，对吧？那么，发生了什么呢？\n\n我们有一个表现得像对象的原始类型！当你尝试访问作用于原始类型的属性和方法时，JavaScript\
  \ 会在后台将该原始类型转换为对象，使用属性或调用方法，然后将其转换回原始类型。在这个例子中，字符串 `s` 被临时转换为一个 `String` 对象以便我们使用\
  \ `length` 属性，然后变回原始类型。接着，它又被转换为 `String` 对象以便我们调用 `substring()` 方法，然后再次变回原始类型。\n\
  \n同样的情况也发生在数字和布尔值上：\n\n![](img/Image00075.jpg)\n\n### 交互式练习：\n\n```\nvar num = 32;\
  \ undefined\nnum\n32\nnum.toString()\n\"32\"\nvar b = true; undefined\nb.toString()\n\
  \"true\"\n```\n\n在实践中，你需要的数字和布尔值像对象一样工作的情况不多，除非你将它们转换为字符串，这种情况每当你像这样使用 `console.log()`\
  \ 时就会发生：\n\n![](img/Image00067.jpg)\n\n### 交互式练习：\n\n```\nconsole.log(\"My num is\
  \ \" + num); My num is 32\nundefined\n```\n\n在这里，`num` 被临时转换为 `Number` 对象，调用了它的\
  \ `toString()` 方法，结果与 \"My num is\" 拼接，结果显示在控制台中（此时 `num` 被转换回原始类型）。这一切都在后台完成，所以你不需要担心它。\n\
  \n与 `Array`、`Date` 和 `Math` 等内置对象类型类似，JavaScript 也有内置的对象类型 `Number`、`String` 和 `Boolean`。不过，你很少使用这些，而且当你只需要一个简单的原始值（如\
  \ 3）时，你永远不应该这样做：\n\n![](img/Image00060.jpg)\n\n### 交互式练习：\n\n```\nvar num = new\
  \ Number(3); undefined\nnum\nNumber {}\n```\n\n为什么？因为 JavaScript 在需要时总是会将像 3 这样的原始类型转换为对象，而不需要你去担心它。所以，原始类型有时会在后台转换为对象，但你可能可能永远不需要直接使用这些对象。\n\
  \n### JavaScript 是动态类型语言的\n\n如果你接触过其他语言，你可能遇到过某些在创建新变量时必须声明变量类型的语言，如下所示：\n\n![](img/Image00043.jpg)\n\
  \n### 观察：\n\n```\nint x = 3;\nString myString = \"test\";\n```\n\n在这些语言中，一旦你将变量声明为某种类型，该变量必须始终是该类型。如果你尝试将不同类型的值放入变量，就会得到错误。例如，你不能做类似的操作：\n\
  \n![](img/Image0076.jpg)\n\n### 观察：\n\n```\nx = myString;\n```\n\n在这里，我们尝试将变量 `x`\
  \ 设置为字符串，但我们做不到，因为 `x` 被声明为整数。这些语言被称为“静态类型”语言。“静态”是因为类型不能改变。\n\n与之相反，JavaScript\
  \ 是一种动态类型语言。在 JavaScript 中，你声明变量时不需要类型，并且可以随时更改值的类型：\n\n![](img/Image0061.jpg)\n\
  \n### 交互式练习：\n\n```\nvar x = 3; undefined\nvar myString = \"test\"; undefined\n\
  x = myString;\n\"test\"\n```\n\n所以 `x` 初始是一个数字，最后变成了字符串。JavaScript 对此没有问题。\n\n\n\
  \n\n\n![](img/Image00006.jpg)\n\n在使用相等运算符和类型转换时，请设计合适的条件测试。\n\n![](img/Image00006.jpg)\n\
  \n## 探索对象的相等性。\n\n![](img/Image00005.jpg) ![](img/Image00006.jpg)\n\n你可能认为测试两个值的相等性是简单且直接的。事实上，有时是，有时则不是。在\
  \ JavaScript 中，当我们比较两个值时，会得到一个结果：true 或 false。然而，确定比较的结果并不总是像你想象的那么简单，因为除了 true\
  \ 和 false 之外，我们还有真值（truthy）和假值（falsey）。此外，测试原始类型的相等性与测试对象的相等性是不同的。在本节中，你将学习当你比较值时背后到底发生了什么。\n\
  \n对于本节中的示例，欢迎创建一个带有 `<script>` 标签的 HTML 文件或使用控制台。任何一种都可以。我们将展示这两种者的示例。\n\n## 真值、假值与相等性\n\
  \n在 JavaScript 中，我们一直都在比较值。例如，你可能会这样做：\n\n![](img/Image00077.jpg)\n\n**观察：**\n\n\
  ```javascript\nvar weather = \"sunny\";\n\nif ( weather == \"sunny\" ) {\n  console.log(\"\
  今天是晴天!\");\n} else {\n  console.log(\"可能下雨了.\");\n}\n```\n\n我们使用条件表达式 `weather ==\
  \ \"sunny\"` 将字符串值与另一个字符串值比较，判断它们是否相等，该条件表达式的结果为 true 或 false（在这种情况下是 true）。在 `if`\
  \ 语句中，我们使用条件表达式来决定是否执行一段代码。如果括号中的表达式结果为 true，则执行第一块代码；如果不是，则执行 `else` 块（如果有的话——如果没有，执行将继续运行\
  \ `if` 语句后的下一行代码）。\n\n我们可以像这样对直接为 true 或 false 的值执行操作：\n\n![](img/Image00077.jpg)\n\
  \n**观察：**\n\n```javascript\nvar isItSunny = true;\n\nif (isItSunny) {\n  console.log(\"\
  今天是晴天!\");\n} else {\n  console.log(\"可能下雨了.\");\n}\n```\n\n注意，在这里我们不需要将 `isItSunny`\
  \ 与 `true` 比较，因为我们知道 `isItSunny` 是一个布尔值。这意味着我们可以将表达式缩短为 `isItSunny`。\n\n在很多情况下，我们处理的是为\
  \ true 或 false 的表达式，但有时我们处理的是真值（truthy）或假值（falsey）。这意味着某些值并不直接是 true 或 false，但在某些情况下（如条件表达式）会被\
  \ JavaScript 解释为 true 或 false。这里有一个示例（在你尝试在控制台中运行它们之前，先看看你是否能猜出每个语句的结果是什么）：\n\n\
  ![](img/Image00078.jpg) **观察：**\n\n```javascript\nif (1 == 1) { console.log(\"1\
  \ 真的等于 1\"); }\nif (1) { console.log(\"1 是真的\"); }\n```\n\n请继续在控制台中尝试这些语句（记住你可能需要加载\
  \ HTML 页面才能访问控制台）：\n\n![](img/Image00079.jpg)\n\n**交互式：**\n\n```javascript\nif (1\
  \ == 1) { console.log(\"1 真的等于 1\"); }\n1 真的等于 1 ⋖ undefined\n\nif (1) { console.log(\"\
  1 是真的\"); }\n1 是真的\nundefined\n```\n\n第一个语句是直观的；我们比较值 `1` 和值 `1`，所以我们自然认为它们是相等的，并期待控制台日志消息“1\
  \ 真的等于 1”。\n\n那么第二个语句呢？在这里，我们测试了值 `1` 以判断它是真是假，但 `1` 既不是真也不是假，它是 `1`，对吧？然而，这个语句的结果是我们确实看到了控制台日志消息“1\
  \ 是真的”，这意味着 JavaScript 必须认为 `1` 是真的。嗯。这很困惑。\n\n接下来这个例子呢？你认为会得到什么？\n\n![](img/Image00080.jpg)\n\
  \n**观察：**\n\n```javascript\nif (0) { console.log(\"0 是真的!\"); }\n```\n\n试一下。这次我们没有看到控制台日志消息，这意味着\
  \ JavaScript 必须认为 `0` 是假的：\n\n![](img/Image00081.jpg)\n\n**交互式：**\n\n```javascript\n\
  if (0) { console.log(\"0 是真的!\"); } undefined\n```\n\n再试一次实验：\n\n![](img/Image00008.jpg)\n\
  \n**交互式：**\n\n```javascript\nif (-5) { console.log(\"-5 是真的!\"); } -5 是真的!\n⋖ undefined\n\
  ```\n\n很有趣。JavaScript 认为 `-5` 是真的！\n\n事实证明，除 0 以外的数字都是**真值（truthy）**，而 `0` 是**假值（falsey）**。我们使用这些术语表示，尽管\
  \ `-5` 不是真，它在条件表达式中为真。`0` 也如此；尽管 `0` 不是假，它在条件表达式中为假。自己实验一下。例如，`NaN` 是真值还是假值？`Infinity`\
  \ 呢？\n\n## 真值或假值\n\n我们需要找出 JavaScript 中其他哪些值是真值假值。让我们在控制台中进行一些测试，看看 JavaScript 如何处理真值和假值情况的值。我们从\
  \ `undefined` 开始。在看下面的示例之前，你认为 `undefined` 是真值还是假值？\n\n![](img/Image00082.jpg) **交互式：**\n\
  \n```javascript\nvar myValue; undefined\nif (myValue) { console.log(\"undefined\
  \ 是真值!\"); } undefined\nif (!myValue) { console.log(\"undefined 是假值!\"); } undefined\
  \ 是假值!\n⋖ undefined\n```\n\n记住 `!` 意味着 非（NOT），所以如果 `myValue` 为 false，那么 `!myValue`\
  \ 为 true。所以 `undefined` 是假值，因为在第二个表达式中，`myValue` 解析为 false，然后我们用 `!myValue` 说“非假”，结果为\
  \ true，因此我们执行 `if` 语句块来显示消息“undefined 是假值！”。这是你预期的吗？即 `undefined` 是假值？这是 Chrome\
  \ 控制台中的显示：\n\n![](img/Image00083.jpg)\n\n那么 `null` 呢？你能猜到吗？\n\n![](img/Image00084.jpg)\
  \ **交互式：**\n\n```javascript\nmyValue = null; null\nif (myValue) { console.log(\"\
  null 是真值!\"); } undefined\nif (!myValue) { console.log(\"null 是假值!\"); } null 是假值!\n\
  ⋖ undefined\n```\n\n所以，`null` 也是假值。如果 `undefined` 是假值，那么 `null` 也是假值，这似乎很有道理，对吧？\n\
  \n好了，我们看了数字、`undefined` 和 `null`。那么字符串呢：\n\n![](img/Image00084.jpg) **交互式：**\n\n\
  ```javascript\nvar myString = \"a string\"; undefined\nif (myString) { console.log(\"\
  myString 是真值!\"); } myString 是真值!\n⋖ undefined\nif (!myString) { console.log(\"\
  myString 是假值!\"); } undefined\n```\n\n在这种情况下，我们看到了字符串 \"myString is true\"，这意味着\
  \ `myString` 是真值。如果我们将 `myString` 设置为空字符串 `\"\"` 会话呢？现在你认为 `myString` 是真值还是假值？\n\
  \n![](img/Image00082.jpg) **交互式：**\n\n```javascript\nmyString = \"\";\n\"\"\nif\
  \ (myString) { console.log(\"myString 是真值!\"); } undefined\nif (!myString) { console.log(\"\
  myString 是假值!\"); } myString 是假值!\n⋖ undefined\n```\n\n所以，带有字符的字符串是真值，但空字符串是假值。实验一下。如果\
  \ `myString` 是一个包含一个空格的字符串，像这样：\" \" 呢？\n\n## 使用真假假值结果的快捷方法\n\n知道 `undefined`、`null`\
  \ 和 `\"\"` 都是假值，你能想到好方法来缩短下面的代码吗？\n\n![](img/Image00041.jpg) **要输入的代码：**\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title> 真值、假值、相等性 </title>\n<meta charset=\"utf-8\"\
  >\n<script>\nvar myString = prompt(\"输入字符串\");\nif (myString == null || myString\
  \ == undefined || myString == \"\") {\n  console.log(\"请输入一个非空字符串!\");\n} else {\n\
  \  console.log(\"感谢输入字符串 '\" + myString + \"'\");\n}\n</script>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n![](img/Image00042.jpg) 将其保存在 `/AdvJS` 文件夹中的 `stringTest.html`，并\
  \ ![](img/Image00085.jpg)。打开控制台（你可能需要刷新页面在控制台中看到输出）。输入一个字符串并注意你看到的消息。尝试在提示框中输入不同的值，例如\
  \ `null`（直接点击 OK ）、\"\" 和 \"test\"。\n\n现在你了解了真值和假值，你可以缩短这段代码：\n\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n<title> 真值、假值、相等性 </title>\n<meta charset=\"utf-8\">\n\
  <script>\nvar myString = prompt(\"输入字符串\");\n</script>\n```\n\n\n\n\n\n```javascript\n\
  if (myString == null || myString == undefined || myString == \"\") {\n  console.log(\"\
  Please enter a non-empty string!\");\n} else {\n  console.log(\"Thanks for entering\
  \ the string '\" + myString + \"'\");\n}\n```\n\n![](img/Image00087.jpg) 和 ![](img/Image00036.jpg)\
  \ 再次运行（如果页面仍然打开，请重新加载）。你会得到与之前相同的行为，但条件表达式短得多。再次尝试输入几个不同的值以确保其运行符合你的预期。尝试将 `myString`\
  \ 的提示词替换为 `undefined`、`null`、空字符串或其他内容。\n\n在需要测试以确保变量具有“真值”（truthy value）但你并不不在乎该值具体是什么的情况下，你可以使用这种快捷方式来节省打字时间。\n\
  \n不过要小心。在需要测试特定值的情况下，你还需要理解**隐式类型转换**（implied typecasting）。我们将在下一步讨论。\n\n## 隐式类型转换\
  \ (Implied Typecasting)\n\n`88` 等于 `\"88\"` 吗？这是一个有趣的问题。让我们来看看：\n\n![](img/Image00088.jpg)\n\
  \n交互会话：\n```javascript\nvar myNum = 88; undefined\nvar myString = \"88\"; undefined\n\
  if (myNum == myString) {\n  console.log(\"My number is equal to my string!\");\n\
  }\nMy number is equal to my string!\nundefined\n```\n\nJavaScript 在对 `myNum` 和 `myString`\
  \ 进行比较之前，会将字符串 `\"88\"` 转换为数字，因此比较实际上发生在 `88` 和 `88` 之间。当然，这些值是相等，所以结果为 `true`，我们看到了控制台输出“My\
  \ number is equal to my string!”\n\n这种在进行比较或其他操作之前将字符串转换为数字的过程被称为“隐式类型转换”（也称为类型强制转换\
  \ type coercion 或类型转换 type conversion）。JavaScript 根据需要进行隐式类型转换。例如，当你执行如下操作时：\n\n\
  ![](img/Image00089.jpg) 交互会话：\n```javascript\nvar age = 29; undefined\nvar output\
  \ = \"My age is \" + age; undefined\noutput\n\"My age is 29\"\n```\n\n在这里，你正在使用\
  \ JavaScript 将变量 `age` 从数字自动转换为字符串的能力，以便它可以与字符串 `\"My age is.\"` 进行拼接。\n\n在转换字符串和数字时，要小心，因为结果并不总是你预期的那样。你知道有时\
  \ JavaScript 会将字符串转换为数字，比如当我们比较 `88` 和 `\"88,\"` 时；你也知道有时 JavaScript 会将数字转换为字符串，当你想将一个数字连接到字符串时。那么，当你尝试将一个包含数字的字符串与数字相加时，你认为结果是什么？\n\
  \n![](img/Image00059.jpg) 交互会话：\n```javascript\nvar x = 4; undefined\nx = x + \"\
  4\"; \"44\"\nx\n\"44\"\n```\n\n你可能预期得到 `8`。\n\n让我们尝试另一个实验：\n\n![](img/Image00070.jpg)\
  \ 交互会话：\n```javascript\nvar myString = \"test\"; undefined\nif (myString) {\n  console.log(\"\
  'test' is truthy\");\n} else {\n  console.log(\"'test' is falsey\");\n}\n'test'\
  \ is truthy\nundefined\n\nif (myString == true) { \n  console.log(\"'test' is true\"\
  );\n} else {\n  console.log(\"'test' is false\");\n}\n'test' is false\nundefined\n\
  ```\n\n注意，在第一个 `if` 语句 `if (myString) ...` 中，我们依赖 `myString` 的真值或假值性来产生 `true` 或\
  \ `false`，以决定执行流。然而，在第二个 `if` 语句 `if (myString == true) ...` 中，我们显式地将 `myString`\
  \ 的值与布尔值 `true` 进行比较。JavaScript 在这里没有对 `myString` 到 `true` 或 `false` 进行隐式类型转换和转换。\n\
  \n正如你可能看到的，要完全确定每种情况下 JavaScript 如何（或不会）对值进行类型转换以进行比较有点棘手。让你更有信心获得预期结果的方法之一是使用严格相等运算符\
  \ `===` 来代替相等运算符 `==`。\n\n关于 JavaScript 如何执行类型转换的更多信息，请参阅 [ECMAScript 规范](http://www.ecma-international.org/ecma-262/5.1/#sec-9)。\n\
  \n## 测试相等性 (Testing Equality)\n\nJavaScript 有两个用于测试相等性的运算符：`==` 和 `===`。你可能在 JavaScript\
  \ 编程中一直使用 `==`，但考虑改用 `===`（至少有时）。让我们仔细看看这两个运算符的区别，以及为什么你可能使用其中一个而不是另一个。\n\n我们将从观察这两个运算符运行的示例开始：\n\
  \n![](img/Image00060.jpg) 交互会话：\n```javascript\nnull == undefined true\nnull ===\
  \ undefined false\n```\n\n相等运算符 `==` 在比较两个值之前尝试进行隐式类型转换。因此，在上面的第一个表达式中，JavaScript\
  \ 看到你正尝试比较不同类型的值，因此尝试将一种类型转换为另一种类型以进行比较。在这种情况下，JavaScript 可以将 `undefined` 转换为 `null`，或者将\
  \ `null` 转换为 `undefined`（JavaScript 两种方式都可以），然后这两个值就是相等的。\n\n然而，严格相等运算符 `===` 不进行隐式类型转换。相反，它按原样比较两个值。如果两个操作数的类型不同，则结果将立即为\
  \ `false`。让我们看看在我们之前对 `88` 和 `\"88\"` 进行比较中使用严格相等会发生什么：\n\n![](img/Image00090.jpg)\
  \ 交互会话：\n```javascript\nvar myNum = 88; undefined\nvar myString = \"88\"; undefined\n\
  if (myNum === myString) {\n  console.log(\"My number is equal to my string!\");\n\
  } else {\n  console.log(\"A number shouldn't really be equal to a string!\");\n\
  }\nA number shouldn't really be equal to a string!\nundefined\n```\n\n让我们在一个假值值上尝试严格相等，例如\
  \ `0`：\n\n![](img/Image00091.jpg) 交互会话：\n```javascript\nvar zero = 0; undefined\n\
  if (zero == false) {\n  console.log(\"zero is a falsey value!\");\n}\nzero is a\
  \ falsey value!\nundefined\n\nif (zero === false) {\n  console.log(\"zero is a falsey\
  \ value!\");\n} else {\n  console.log(\"Now we don't convert zero to false\")\n\
  }\nNow we don't convert zero to false\nundefined\n```\n\n所以，严格相等防止了将假值（如 `0`）转换为\
  \ `false`。\n\n就像 `==` 相等运算符有一个否定版本 `!=`（意味着不等于）一样，严格相等运算符也有一个否定版本 `!==`。`!=` 和 `!==`\
  \ 的唯一区别在于 `!=` 尝试将操作数转换为相同类型，而 `!==` 不会。\n\n对这四个运算符：`==`、`!=`、`===` 和 `!==` 做些实验。你可能会对发现感到惊讶。有些程序员总是使用严格相等（和严格不相等）而不是相等（和不相等）。然而，有时你可能想利用\
  \ JavaScript 进行类型转换的能力。如果你这样做，请务必小心并确保你确切知道该类型转换将如何作用于这些值的类型。\n\n你可以在 [ECMAScript\
  \ 规范](http://www.ecma-international.org/ecma-262/5.1/#sec-11.9)中获取相等运算符和严格相等运算符（也称为恒等运算符）算法的所有细节。\n\
  \n## 对象与真值性 (Objects and Truthy-ness)\n\n到为止，我们一直在观察数字、字符串、`null` 和 `undefined`\
  \ 等原始值的真值性和假值性。那么对象呢？\n\n![](img/Image00088.jpg) 交互会话：\n```javascript\nvar o = {\
  \ name: \"object\" }; undefined\no\nObject {name: \"object\"}\nif (o) {\n  console.log(\"\
  This object is truthy!\");\n}\nThis object is truthy!\nundefined\n```\n\n所以看起来对象是真值。那么空对象呢？（记得空字符串是假的，所以你可能认为空对象也是假的。）\n\
  \n![](img/Image0088.jpg) 交互会话：\n```javascript\nvar p = {}; undefined\nif (p) {\n\
  \  console.log(\"This object is truthy!\");\n} else {\n  console.log(\"This object\
  \ is falsey!\");\n}\nThis object is truthy!\nundefined\n```\n\n有趣。即使是完全空的对象，像 `p`\
  \ 一样，它也是真值。但是……\n\n![](img/Image00060.jpg) 交互会话：\n```javascript\np == true false\n\
  ```\n\n\n\n\n`p == false` false\n\n尽管 `p` 可能是真值（truthy），但使用相等运算符时它并不等于 `true`（或\
  \ `false`），因此这里没有发生类型转换。\n\n## 对象与相等性\n\n让我们在控制台中再进行几次测试，并将我们的空对象 `p` 与其他值进行比较：\n\
  \n![](img/Image00092.jpg) 交互会话：\n\n```\nvar p = {}; undefined\np == 0 false\np ==\
  \ null false\np == undefined false\np == \"{}\" false\np == {} false\n```\n\n在这个示例中，我们使用了相等运算符\
  \ `==`，因为我们希望 JavaScript 尝试对值进行类型转换以便进行比较。如你所示，所有的结果都是 `false`，这意味着即使 JavaScript\
  \ 能够进行类型转换，比较结果仍然是 `false`。\n\n这些结果大部分可能意料之中，但最后一个结果绝对不是！我们知道 `p` 是一个空对象 `{}`，那么为什么\
  \ `p` 不等于另一个空对象呢？它们不是同一个东西吗？来创建一个包含两个对象的文件，我们可以进行实验：\n\n![](img/Image00093.jpg)\n\
  \n需要输入的代码：\n\n```html\n<!doctype html>\n<html\n<head>\n<title> Comparing objects\
  \ </title>\n<meta charset=\"utf-8\">\n<script>\nvar book1 = {\ntitle: \"Harry Potter\"\
  ,\nauthor: \"JK Rowling\",\npublished: 1999,\nhasMovie: true\n};\nvar book2 = {\n\
  title: \"Harry Potter\",\nauthor: \"JK Rowling\",\npublished: 1999,\nhasMovie: true\n\
  };\nif (book1 == book2) {\nconsole.log(\"The two books are the same\"); } else {\n\
  console.log(\"The two books are different\");\n}\n</script>\n</head>\n<body>\n</</body>>\n\
  </html>\n```\n\n在这里，我们使用对象字面量创建了两个书籍对象，然后测试这些书是否相等。\n\n![](img/Image00042.jpg) 将此保存到你的\
  \ `/AdvJS` 文件夹中并命名为 `objectsTest.html`，然后 ![](img/Image00021.jpg)。在控制台中，你看到了消息：“The\
  \ two books are different.”\n\n这两本书 `book1` 和 `book2` 是完全相同的：它们具有相同的属性。所有的属性名都相同，属性值也相同，属性的数量也相同。那么为什么它们不等呢？（注意，我们在这里使用相等运算符来测试相等性；我们知道这两个对象的类型是相同的，所以我们不需要担心发生任何类型转换）。\n\
  \n这两个对象不相等，是因为计算机内存中存储原始值（primitive values）和存储对象的方式存在重要差异。当你创建一个原始值时，例如：\n\n![](img/Image00076.jpg)\n\
  \n观察：\n\n```\nvar x = 3;\n```\n\n计算机会分配一块内存，将其命名为 \"x\"，并将值 `3` 储存在那块内存中：\n\n![](img/Image00094.jpg)\n\
  \n现在，对比一下当你创建一个对象时会发生什么，例如从上面的中创建 `book1`：\n\n![](img/Image00095.jpg)\n\n观察：\n\n\
  ```javascript\nvar book1 = {\ntitle: \"Harry Potter\",\nauthor: \"JK Rowling\",\n\
  published: 1999,\nhasMovie: true\n};\n```\n\n在这种情况下，计算机为对象中的每个属性都命名并分配了一些内存，然后为变量名分配了一块单独的内存，并在该内存中存储一个指向对象实际存储内存位置的值。这被称为**对象引用**（object\
  \ reference）。因此，变量 `book1` 并不包含对象本身；它实际上包含的是指向对象的引用。就像这样：\n\n![](img/Image00096.jpg)\n\
  \n在这种情况下，对象值（即对象中的所有属性，加上关于对象的其他一些信息）存储在内存位置 `495823`（这只是为了这个示例随机编的，但你理解意思），而变量\
  \ `book1` 包含了该位置（就像 `x` 包含 `3` 一样）。\n\n现在让我们看看创建第二个书籍对象 `book2` 时会发生什么：\n\n![](img/Image00095.jpg)\n\
  \n观察：\n\n```javascript\nvar book2 = {\ntitle: \"Harry Potter\",\nauthor: \"JK Rowling\"\
  ,\npublished: 1999,\nhasMovie: true\n};\n```\n\n尽管属性完全相同，仍然了一个完全独立的书籍对象，并存储在内存完全不同的部分：\n\
  \n![](img/Image00097.jpg)\n\n变量 `book2` 包含了这个第二个对象的内存位置，而该内存位置与 `book1` 的内存位置不同。\n\
  \n所以当我们比较 `book1` 和 `book2` 时：\n\n![](img/Image00098.jpg)\n\n观察：\n\n```javascript\n\
  if (book1 == book2) {\nconsole.log(\"The two books are the same\"); } else {\nconsole.log(\"\
  The two books are different\");\n}\n```\n\n所比较的值是两个对象的内存位置。它们不相等，所以我们看到了消息“The two\
  \ books are different.”\n\n![](img/Image00099.jpg)\n\n将此与比较原始值时发生的情况进行对比：\n\n![](img/Image00084.jpg)\n\
  \n交互会话：\n\n```javascript\nvar x = 3; undefined\nvar y = 3; undefined\nif (x == y)\
  \ { console.log(\"x and y are the same\"); } x and y are the same\nundefined\n```\n\
  \n![](img/Image00100.jpg)\n\n在上面比较两个书籍对象的示例中，我们使用了对象字面量来创建书籍。你认为如果我们使用对象构造函数，结果会相同吗？让我们看看：\n\
  \n![](img/Image00068.jpg)\n\n需要输入的代码：\n\n```html\n<!doctype html>\n<html\n<head>\n\
  <title> Comparing objects, take two </title> <meta charset=\"utf-8\"> <script>\n\
  function Book(title, author, published, hasMovie) { this.title = title;\nthis.author\
  \ = author;\nthis.published = published;\nthis.hasMovie = hasMovie;\n}\nvar book1\
  \ = new Book(\"Harry Potter\", \"JK Rowling\", 1999, true); var book2 = new Book(\"\
  Harry Potter\", \"JK Rowling\", 1999, true); if (book1 == book2) {\nconsole.log(\"\
  book1 is equal to book2\");\n} else {\nconsole.log(\"book1 is NOT equal to book2\"\
  );\n}\n</script>\n</head>\n<body>\n</</body>>\n</html>\n```\n\n现在我们使用构造函数 `Book()`\
  \ 创建了两本书，然后测试这些书籍是否相等。\n\n![](img/Image00042.jpg) 将此保存到你的 `/AdvJS` 文件夹中并命名为 `objectsTest.html`，然后\
  \ ![](img/Image00021.jpg)。在控制台中，你看到了消息：“book1 is NOT equal to book2.”\n\n结果是相同的，因为我们创建了两个不同的对象，尽管它们使用了相同的构造函数。\n\
  \n好了，既然你已经知道了对象是如何存储的，你认为当我们这样修改程序会发生什么？\n\n![](img/Image0101.jpg) 当我们将 `book1`\
  \ 的值赋值给 `book2`（`var book2 = book1`）时，我们将 `book1` 中数据的内存位置存储到 `book2` 中，就像这样：\n\n\
  ![](img/Image0102.jpg)\n\n现在当我们比较 `book1` 和 `book2` 的值时，它们是相同的：它们都指向同一个内存位置。\n\n\
  让我们再次更新程序：\n\n![](img/Image0103.jpg) 需要输入的代码：\n\n```html\n<!doctype html>\n<html\n\
  <head>\n<title> Comparing objects, take two </title>\n<meta charset=\"utf-8\">\n\
  <script>\nfunction Book(title, author, published, hasMovie) { this.title = title;\n\
  this.author = author;\nthis.published = published;\nthis.hasMovie = hasMovie;\n\
  }\nvar book1 = new Book(\"Harry Potter\", \"JK Rowling\", 1999, true);\nvar book2\
  \ = book1;\nif (book1 == book2) {\nconsole.log(\"book1 is equal to book2\");\n}\
  \ else {\nconsole.log(\"book1 is NOT equal to book2\");\n}\nbook1.star = \"Harry\"\
  ;\nconsole.log(book1);\nconsole.log(book2);\n</script>\n</head>\n<body>\n</</body>>\n\
  </html>\n```\n\n![](img/Image0104.jpg) 看看我们在控制台中显示的两个书籍对象。发现什么有趣的现象了吗？\n\n![](img/Image0104.jpg)\
  \ 观察：\n\n```javascript\nBook {title: \"Harry Potter\", author: \"JK Rowling\", published:\
  \ 1999, movie: true,\nstar: \"Harry\" }\n```\n\n\n\n\n\n```javascript\nBook {title:\
  \ \"Harry Potter\", author: \"JK Rowling\", published: 1999, movie: true, star:\
  \ \"Harry\" }\n```\n\n在代码中，我们为 `book1` 添加了一个新属性 `star`，并将其值设置为 `\"Harry.\"`。然而，当你查看控制台中的那两个对象时，你会发现\
  \ `book1` 和 `book2` 现在都拥有属性 `star`，且其值为 `\"Harry\"`。这是如何发生的呢？\n\n嗯，请记住 `book2` 指向与\
  \ `book1` 相同的内存地址。因此，如果我们更改了 `book1` 中的数据，我们也就更改了 `book2` 中的数据，因为它们是同一个对象。\n\n你认为如果我们更改了\
  \ `book2` 的标题会发生什么？尝试将 `book2` 的标题改为 `\"Harry Potter and the Sorcerer's Stone.\"\
  `。当你显示 `book1` 和 `book2` 时，你看到了什么？\n\n现在，你可能会问：“如果我不能使用相等运算符来比较两个不同的对象以判断它们是否相同（即它们具有相同的属性和值），那么我该如何知道两个对象是否相同呢？”\n\
  \n答案是，你必须单独查看对象的每个属性。如果对象中的属性都是原始值（数字、字符串、布尔值），那么做起来并不难。然而，如果你的对象具有嵌套对象和/或方法，那么情况就会变得复杂一些，因为解决方案取决于你对两个对象之间“相等性”的定义。你认为一个对象与另一个对象“相等”意味着什么？这是一个非常值得你思考的话题。\n\
  \n各种 JavaScript 库通过实现检查对象相等性的函数来解决这个问题。但要非常小心，因为不同的库对对象相等性的含义可能有不同的解释。确保库函数的作用符合你的预期。例如，你可以使用\
  \ [Underscore.js](http://underscorejs.org/#isEqual) 库的 `isEqual()` 函数来测试对象的相等性。\n\
  \n本节我们涵盖了大量内容，包括真值（truthy）和假值（falsey）、隐式类型转换以及比较两个值时会发生的情况、两种不同的相等运算符，以及比较原始值和对象值之间的区别。呼！这些细节非常多，其中一些你可能从未遇到过，但在进入更高级的\
  \ JavaScript 编程时，你会需要这些知识。\n\n休息一下让大脑放松放松，然后在进入下一节课程之前，通过测验和项目来帮助你吸收这些知识。\n\n# 构建对象\n\
  \n![](img/Image00005.jpg)\n\n### 课程目标\n\n完成本节课程后，你将能够：\n- 使用你自己的构造函数和 `new` 来构建对象。\n\
  ![](img/Image00006.jpg)\n- 构建对象字面量。\n![](img/Image00006.jpg)\n- 构建空对象并添加新属性。\n![](img/Image00006.jpg)\n\
  - 比较函数作为函数和作为构造函数的工作方式。\n![](img/Image00006.jpg)\n- 在构造函数中初始化对象的属性值。\n![](img/Image00006.jpg)\n\
  - 使用条件运算符。\n![](img/Image00006.jpg)\n- 探索对象创建时 `this` 的值。\n![](img/Image00006.jpg)\n\
  - 用两种方式构建数组。\n![](img/Image00005.jpg) ![](img/Image00006.jpg)\n\nJavaScript 中的几乎一切内容都是对象，因此理解对象是理解和编写\
  \ JavaScript 的关键。在本节中，我们将深入探讨如何在 JavaScript 中创建对象。\n\n# 构建 JavaScript 对象\n\n当你在\
  \ JavaScript 中构建对象时，你实际上是在创建一个属性名和值的动态集合。你已经见过了创建不同的创建对象的方法，即使用构造函数（如我们在上一节课程中使用的\
  \ `Book()` 函数）和使用对象字面量。\n\n让我们仔细观察构建对象的三个方法，以及它们之间的相似与不同之处。\n\n## 使用构造函数构建对象\n\n\
  我们将检查的第一种构建对象的方法是使用构造函数。在上一节课程中，我们使用构造函数 `Book()` 来创建书籍对象，传递了 `title`、`author`、书籍出版日期以及是否已拍成电影的参数。我们在这里将使用同一个对象，但我们会为该对象添加一个新方法\
  \ `display()`：\n\n![](img/Image00068.jpg)\n\n**需要输入的代码：**\n\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n<title> Constructing objects </title>\n<meta charset=\"\
  utf-8\">\n<script>\nfunction Book(title, author, published, hasMovie) { \n  this.title\
  \ = title;\n  this.author = author;\n  this.published = published;\n  this.hasMovie\
  \ = hasMovie;\n  this.display = function() {\n    console.log(this);\n  };\n}\n\n\
  var book1 = new Book(\"The Hound of the Baskervilles\", \"Sir Arthur Conan Doyle\"\
  , 1901, true);\nbook1.display();\n</script>\n</head>\n<body>\n</body>\n</html>\n\
  ```\n\n![](img/Image00042.jpg) 将其保存在你的 `/AdvJS` 文件夹中并为 `objectConstructor.html`，并\
  \ ![](img/ImageImage00036.jpg)。打开控制台（如果需要请刷新页面），你会看到构造函数创建了一个书籍对象：\n\n![](img/Image00105.jpg)\n\
  \n（此截图是在 Chrome 控制台中截的，但在 IE 中看起来也相似）。构造函数与其他任何函数一样，但我们调用构造函数的方式不同：我们使用 `new` 关键字。\n\
  \n![](img/Image00043.jpg) **观察：**\n\n```javascript\nvar book1 = new Book(\"The Hound\
  \ of the Baskervilles\", \"Sir Arthur Conan Doyle\", 1901, true);\n```\n\n`new`\
  \ 单词表示我们正在使用一个函数来构建对象，而不仅仅是执行代码。在构造函数内部，我们将正在被创建的对象称为 `this`：\n\n![](img/Image00106.jpg)\
  \ **观察：**\n\n```javascript\nfunction Book(title, author, published, hasMovie) {\
  \  this.title = title;\n  this.author = author;\n  this.published = published;\n\
  \  this.hasMovie = hasMovie;\n  this.display = function() {\n    console.log(this);\n\
  \  };\n}\n```\n\n当你使用 `new` 调用函数时，在该函数内部会创建一个新的空对象，并将 `this` 关键字设置为该对象。（在函数内部，`this`\
  \ 的作用就像局部变量，不同之处是你不能自己设置它的值；这是由系统自动为你完成的）。然后你使用 `this` 来设置该对象中任何需要的属性值。在函数的结束处，你不需要显式地返回你创建的对象；JavaScript\
  \ 会因为你使用了 `new` 关键字而自动为你完成这一操作。返回的对象就是 `this`：即在你调用函数时创建的新对象，它包含了你在函数中设置的属性。\n\n\
  当然，如果你愿意，任何函数都可以返回一个对象：\n\n![](img/Image00059.jpg) **交互式演示：**\n\n```javascript\n\
  function makeObj() { return { x: 1 }; }\nundefined\nvar myObj = makeObj();\nundefined\n\
  myObj Object {x: 1}\n```\n\n然而，在这个示例中，`makeObj()` true 一个构造函数，因为我们没有使用 `new` 调用它。相反，我们正常地调用了该函数，并在函数内部临时创建了一个对象字面量，并将其返回给函数\
  \ `makeObj()` 的调用者。这两种创建函数的方法看起来相似，但有一些关键区别。在 `makeObj()` 内部 `this` 的值没有被设置为正在创建的对象，而且如果你没有从\
  \ `makeObj()` 显式返回一个对象，默认返回值将是 `undefined`。\n\n这些函数根据是否使用 `new` 调用而表现出的行为差异，这也是为什么我们总是（按照约定）使用大写字母开头来为构造函数命名（例如\
  \ `Book()`），而使用小写字母开头来为普通函数命名（例如 `makeObj()`）的原因之一。这样，你就能通过代码看出一个函数是否被设计为构造函数。\n\
  \n当你通过 `new` 调用构造函数创建对象时，还会发生另一件事，这在通过其他方式创建对象时不会发生。回来看我们调用 `makeObj()` 创建的对象：\n\
  \n![](img/Image00107.jpg)\n\n\n\n\n现在将此与你之前在控制台中看到的 `book1` 对象进行对比（如果你仍然加载了页面，只需在控制台中输入\
  \ `book1` 即可再次查看，但请确保你是在特定的 Chrome 或 Safari 控制台中进行操作）：\n\n![](img/Image00108.jpg)\n\
  \n当你在控制台中显示 `myObj` 时，你会在对象旁边看到 `Object` 单词：\n\n![](img/Image00076.jpg)\n\n观察：\n\
  \n```\nObject {x: 1}\n```\n\n但你在 `book1` 对象旁边看到的是 \"Book\" 单词：\n\n![](img/Image00043.jpg)\n\
  \n观察：\n```\nBook {title: \"The Hound of the Baskervilles\", author: \"Sir Arthur\
  \ Conan Doyle\", published: 1901, hasMovie: true, display: function}\n```\n\n在 `Book`\
  \ 示例中，我们使用 `Book()` 构造函数创建了 `book1` 对象。当你使用构造函数创建对象时，JavaScript 会通过一个名为 `constructor`\
  \ 的属性来跟踪该函数。`constructor` 是对象（在本例中为 `book1`）的一个属性，它是通过调用构造函数 `Book()` 产生的。现在，JavaScript\
  \ 也会为未使用构造函数创建的对象设置 `constructor` 属性，例如我们从 `makeObj()` 函数创建并返回的字面量对象，在这种情况下，`constructor`\
  \ 属性被设置为 `Object ()`。\n\n你可以访问对象的构造函数：\n\n![](img/Image00109.jpg) 交互会话：\n\n```\n\
  myObj.constructor\nfunction Object() { [native code] }\n\nbook1.constructor\nfunction\
  \ Book(title, author, published, hasMovie) { \n    this.title = title;\n    this.author\
  \ = author;\n    this.published = published;\n    this.hasMovie = hasMovie;\n  \
  \  this.display = function() {\n        console.log(this);\n    };\n}\n```\n\n你可以将对象的构造函数（无论是\
  \ `Book()` 还是 `Object()`）理解为决定对象的类型。这在像 `Java` 这样的静态类型语言中并不完全严谨，但它可以作为描述对象的一种方便方法。我们将在后的课程中讨论\
  \ `instanceof` 运算符时再次回到这个观点。\n\n目前，对你来说，关键要点是理解使用 `new` 关键字通过构造函数构建对象与我们创建对象的其他方式之间的区别。\n\
  \n### 使用字面量构建对象\n\n你刚刚看到了创建一个字面量对象并从函数返回它的示例。让我们创建另一个字面量对象，即另一本书，这样我们就可以直接与使用构造函数创建的\
  \ `book1` 对象进行结果对比。如下所示修改 `objectConstructor.html`：\n\n![](img/Image00110.jpg) 需要输入的代码：\n\
  \n```html\n<!doctype html>\n<html\n<head>\n<title> Constructing objects </title>\n\
  <meta charset=\"utf-8\">\n<script>\nfunction Book(title, author, published, hasMovie)\
  \ { \n    this.title = title;\n    this.author = author;\n    this.published = published;\n\
  \    this.hasMovie = hasMovie;\n    this.display = function() {\n        console.log(this);\n\
  \    };\n}\n\nvar book1 = new Book(\"The Hound of the Baskervilles\", \"Sir Arthur\
  \ Conan Doyle\", 1901, true);\nbook1.display();\n\nvar book2 = {\n    title: \"\
  The Adventures of Sherlock Holmes\",\n    author: \"Sir Arthur Conan Doyle\",\n\
  \    published: 1892,\n    movie: true,\n    display: function() {\n        console.log(this);\n\
  \    }\n};\n\nbook2.display();\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\
  \n![](img/Image00042.jpg) 和 ![](img/Image00036.jpg) . 打开控制台，比较 `book1` 和 `book2`（使用\
  \ Chrome 或 Safari）：\n\n![](img/Image00111.jpg)\n\n这两个对象是相似的：它们都具有相同的属性名，都拥有一个 `display()`\
  \ 方法，并且所有属性值的类型都是相同的。然而，如果你查看 `book1` 和 `book2` 的构造函数，你会发现（就像之前的 `myObj` 一样），`book1`\
  \ 的构造函数是 `Book()`，因为我们是使用构造函数创建它的；但 `book2` 的构造函数是 `Object ()`，因为我们是使用对象字面量创建它的：\n\
  \n![](img/Image00109.jpg) 交互会话：\n\n```\nbook1.constructor\nfunction Book(title,\
  \ author, published, hasMovie) { \n    this.title = title;\n    this.author = author;\n\
  \    this.published = published;\n    this.hasMovie = hasMovie;\n    this.display\
  \ = function() {\n        console.log(this);\n    };\n}\n\nbook2.constructor\nfunction\
  \ Object() { [native code] }\n```\n\n`[native code]` 意味着 `Object()` 构造函数的实现是隐藏的，因为它是浏览器内部的。\n\
  \n对象中名为 `__proto__` 的属性是 `book1` 和 `book2` 对象中的最后一个属性：\n\n![](img/Image00111.jpg)\n\
  \n`book1` 的 `__proto__` 值为 `Book`，而 `book2` 的 `__proto__` 值为 `Object`。你可能在认为 `__proto__`\
  \ 属性必须与对象的构造函数相关，你是正确的（尽管它们并不是同一个东西）。\n\n你可能还会注意到 `constructor` 属性没有列在 `book1` 和\
  \ `book2` 对象的属性中。这是因为该属性继承自对象的 `prototype`（原型）。正如你可能猜到的，`__proto__` 属性也与原型有关。我们将在后的课程中详细介绍原型。\n\
  \n字面量对象中的 `this` 是怎样的？你已经知道可以在对象的方法中使用 `this` 来指代“此对象”，但与构造函数不同，我们不（不能）使用 `this`\
  \ 来初始化对象属性。相反，我们通过在对象中直接指定键值对（即直接输入它们）来创建并初始化属性。（这就是为什么它被称为对象字面量）。`this` 指向对象的唯一情况是在调用它的某个方法时。（`this`\
  \ 如何被设置以及被设置成什么，是我们以后会深入探讨的另一个话题）。\n\n### 使用通用对象构造函数构建对象\n\n创建对象字面量的另一种方法是从一个空对象开始，然后向其添加属性。你可以通过两种方式之一创建一个空的通用对象：\n\
  \n![](img/Image00043.jpg)\n\n观察：\n\n```\nvar obj1 = { };\nvar obj2 = new Object();\n\
  ```\n\n这两种创建对象的方法的作用是相同的。你会经常看到通过第一种方法创建空对象（因为写起来简单一点），但理解第二种方法也是有益的。当你使用 `new Object()`\
  \ 创建对象时，它与使用 `new Book()` 创建对象完全一样，区别在于 `Object()` 是一个不需要自己编写的内置构造函数。你不需要在构造函数中向\
  \ `Object()` 传递任何参数来初始化对象属性，而是在对象创建后添加所有属性。如下所示修改 `objectConstructor.html`：\n\n\
  ![](img/Image00112.jpg) 需要输入的代码：\n\n```html\n<!doctype html>\n<html\n<head>\n<title>\
  \ Constructing objects </title>\n<meta charset=\"utf-8\">\n<script>\nfunction Book(title,\
  \ author, published, hasMovie) { \n    this.title = title;\n    this.author = author;\n\
  \    this.published = published;\n    this.hasMovie = hasMovie;\n    this.display\
  \ = function() {\n        console.log(this);\n    };\n}\n\nvar book1 = new Book(\"\
  The Hound of the Baskervilles\", \"Sir Arthur Conan Doyle\", 1901, true);\nbook1.display();\n\
  \nvar book2 = {\n    title: \"The Adventures of Sherlock Holmes\",\n    author:\
  \ \"Sir Arthur Conan Doyle\",\n    published: 1892,\n    movie: true,\n    display:\
  \ function() {\n        console.log(this);\n    }\n};\nbook2.display();\n\nvar book3\
  \ = new Object(); // 等于 var book3 = { }; book3.title = \"A Study in Scarlet\"; book3.author\
  \ = \"Sir Arthur Conan Doyle\";\nbook3.published = 1887;\nbook3.movie = false;\n\
  book3.display = function() {\n    console.log(this);\n};\nbook3.display();\n</script>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n我们添加了与 `book1` 和 `book2` 完全相同的属性，只是某些值有所不同，因为这是一本不同的书。`book3`\
  \ 也拥有一个 `display()` 方法，就像 `book1` 和 `book2` 一样。\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)\
  \ . 在控制台中，将 `book3` 与 `book2` 以及 `book1` 进行比较。\n\n![](img/Image00113.jpg)\n\n\n\n\
  \n\n`book3` 看起来和 `book2` 相似，因为 `book3` 也是一个对象字面量；它的创建方式略有不同。注意 `book3` 的构造函数也是 `Object()`，你可以在浏览器控制台中对其进行测试：\n\
  \n![](img/Image00049.jpg)\n\n**交互式会：**\n\n```javascript\nbook3.constructor\n\nfunction\
  \ Object() { [native code] }\n```\n\n# 那么创建对象的最佳方法是什么？\n\n你已经看到了三种不同的构造方式（在稍后的课程中你会看到第四种），但哪种是最佳方法呢？\n\
  \n这取决于具体情况。如果你只需要一个快速的、一次性的对象，那么像我们之前为 `book2` 或 `book3` 那样创建一个对象字面量可能足够了。然而，如果你知道自己将需要多个书籍对象，那么编写一个像\
  \ `Book()` 这样的构造函数，并用它来创建许多书籍对象是更好的选择。你还需要考虑你正在创建的对象是比如 `Books`（书籍）还是 `Magazines`（杂志）。正如你所看到的，用构造函数创建的对象带有关于它们如何创建的额外信息，这可能很有用。我们将在稍后的课程中讨论原型时看到相关的例子。\n\
  \n## 在构造函数中初始化值\n\n现在让我们回到构造函数，看看如何通过函数初始化你正在构造的对象的属性。我们将使用一个不同的示例，请打开一个新文件：\n\n\
  ![](img/Image00114.jpg) **需要输入的代码：**\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title> 初始化对象 </title>\n<meta charset=\"utf-8\">\n<script>\nfunction Point(x, y)\
  \ {\n  if (x == undefined || x == null) {\n    this.x = 50;\n  } else { \n    this.x\
  \ = x;\n  }\n  if (y == undefined || y == null) {\n    this.y = 50;\n  } else {\
  \ \n    this.y = y;\n  }\n  // 创建一个我们可以使用的 toString() 方法来显示点\n  this.toString =\
  \ function() {\n    return \"[\" + this.x + \", \" + this.y + \"]\";\n  }\n}\n//\
  \ 构造函数中也可以包含代码\nvar p = new Point();\nconsole.log(\"My point is: \" + p.toString());\n\
  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 将其保存到你的\
  \ `/AdvJS` 文件夹并命名为 `point.html`，然后在浏览器中打开它。打开控制台（如有需要刷新页面）；`Point` 对象 `p` 显示如下：\n\
  \n![](img/Image00076.jpg)\n\n**观察：**\n```\nMy point is: [50, 50]\n```\n\n在这段代码中，我们有一个\
  \ `Point()` 构造函数来创建 `Point` 对象。让我们讨论一下代码：\n\n![](img/Image00115.jpg) **观察：**\n\n\
  ```javascript\nfunction Point( x, y ) {\n  if (x == undefined || x == null) {\n\
  \    this.x = 50;\n  } else { \n    this.x = x;\n  }\n  if (y == undefined || y\
  \ == null) {\n    this.y = 50;\n  } else { \n    this.y = y;\n  }\n  // toString():\
  \ 显示点\n  this.toString = function() {\n    return \"[\" + this.x + \", \" + this.y\
  \ + \"]\";\n  }\n}\n\nvar p = new Point();\nconsole.log(\"My point is: \" + p.toString());\n\
  ```\n\n我们使用构造函数 `Point()` 来设置对象 `p` 的属性，你会看到 `Point()` 创建了一个 `Point` 对象 `p`。因此，如果你看这个构造函数\
  \ `Point()`，它实际上期望两个参数 `x` 和 `y`，它们是点的坐标，但我们在不带任何参数的情况下调用了 `Point()`。事实证明 JavaScript\
  \ 完全可以接受这一点，但除非我们进行进一步的操作，否则我们尝试创建的点的 `x` 和 `y` 坐标将是 `undefined`。因此，我们编写了测试代码来检查是否传递了\
  \ `x` 和 `y` 值。如果传递了，我们就分别用值 `x` 和 `y` 初始化 `this.x` 和 `this.y`。如果我们没有传递任何值，则对 `this.x`\
  \ 和 `this.y` 使用默认值 `50`。\n\n现在，你可能想走捷径，将 `if (x == undefined || x == null) { ...\
  \ }` 改写为 `if (!x) { ... }`（基于你在上一节中中学到的关于真值和假值的知识），但要小心！我们可能想要一个位于 `0, 0` 的点，而 `0`\
  \ 是假值，所以这种捷径在这种情况下对我们不起作用。不过，我们可以利用条件运算符来缩短初始化过程。按所示修改 `point.html`：\n\n![](img/Image00116.jpg)\
  \ **需要输入的代码：**\n\n```html\n<!doctype html>\n<html>\n<head>\n<title> 初始化对象 </title>\n\
  <meta charset=\"utf-8\">\n<script>\nfunction Point(x, y) {\n  this.x = (!x && x\
  \ != 0) ? 50 : x;\n  this.y = (!y && y != 0) ? 50 : y;\n  if (x == undefined ||\
  \ x == null) {\n    this.x = 50;\n  } else { \n    this.x = x;\n  }\n  if (y ==\
  \ undefined || y == null) {\n    this.y = 50;\n  } else { \n    this.y = y;\n  }\n\
  \  // 创建一个我们可以使用的 toString() 方法来显示点\n  this.toString = function() {\n    return\
  \ \"[\" + this.x + \", \" + this.y + \"]\";\n  }\n}\n// 构造函数中也可以包含代码\nvar p = new\
  \ Point();\nconsole.log(\"My point is: \" + p.toString());\n</script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 并打开它。你看到了与之前相同的结果。\n\n\
  现在，有些程序员像避瘟一样避免条件运算符（也简写为 `?:`），因为它难以阅读，而且你始终可以使用更易读的 if/else 语句来编写相同的代码。如果你属于这一派，请尽管使用\
  \ if/else 语句。尽管如此，你仍然需要知道阅读使用条件运算符的语句；它们在初始化对象时非常频繁。\n\n所以，你读到这个：\n\n![](img/Image00076.jpg)\
  \ **观察：**\n```javascript\nthis.x = (!x && x != 0) ? 50 : x;\n```\n像这样：\n\n```javascript\n\
  this.x = (!x && x != 0) ? 50 : x;\n```\n换句话说，你读到的是：“如果 `x` 为假值且不等于 `0`，则将其赋值为 `50`，否则赋值为\
  \ `x`。”\n\n我们使用构造函数 `Point()` 来设置对象 `p` 的属性，你会看到 `Point()` 创建了一个 `Point` 对象 `p`。因此，如果你看这个构造函数\
  \ `Point()`，它实际上期望两个参数 `x` 和 `y`，它们是点的坐标，但我们在不带任何参数的情况下调用了 `Point()`。事实证明 JavaScript\
  \ 完全可以接受这一点，但除非我们进行进一步的操作，否则我们尝试创建的点的 `x` 和 `y` 坐标将是 `undefined`。因此，我们编写了测试代码来检查是否传递了\
  \ `x` 和 `y` 值。如果传递了，我们就分别用值 `x` 和 `y` 初始化 `this.x` 和 `this.y`。如果我们没有传递任何值，则对 `this.x`\
  \ 和 `this.y` 使用默认值 `50`。\n\n现在，你可能想走捷径，将 `if (x == undefined || x == null) { ...\
  \ }` 改写为 `if (!x) { ... }`（基于你在上一节中中学到的关于真值和假值的知识），但要小心！我们可能想要一个位于 `0, 0` 的点，而 `0`\
  \ 是假值，所以这种捷径在这种情况下对我们不起作用。不过，我们可以利用条件运算符来缩短初始化过程。按所示修改 `point.html`：\n\n\n\n\n\n\
  ```javascript\nconsole.log(\"This in getArea is: \"); console.log(this);\n\nreturn\
  \ (r.width * r.height);\n\n}\n\nconsole.log(\"Area from getArea(rect1): \" + getArea(rect1));\n\
  ```\n\n![](img/Image00042.jpg) 将此保存到你的 `/AdvJS` 文件夹并命名为 `rectangle.html`，然后 ![](img/![](Image00085.jpg)。在控制台中，你看到了大量的输出：\n\
  \n![](img/Image00118.jpg)\n\n这里涉及的内容很多，我们将逐一进行逐步分析：\n\n![](img/Image00119.jpg)\n\
  \n### 观察：\n\n```javascript\n// 创建矩形对象的构造函数\nfunction Rectangle(width, height) {\
  \ \n    console.log(\"This in Rectangle is: \"); \n    console.log(this);\n\n  \
  \  this.width = width || 0;\n    this.height = height || 0;\n\n    this.getArea\
  \ = function() {\n        console.log(\"This in a Rectangle's getArea is: \"); \n\
  \        console.log(this);\n        return this.width * this.height;\n    };\n\
  }\n\nvar rect1 = new Rectangle(5, 10);\nconsole.log(\"Area of rectangle 1: \" +\
  \ rect1.getArea());\n```\n\n在这段代码中，我们有一个 `Rectangle()` 构造函数，可以使用它来创建具有 `width` 和\
  \ `height` 属性的矩形，以及一个返回矩形面积的方法 `getArea()`。我们在构造函数内部的两个地方添加了 `console.log()` 调用，以检查\
  \ `this` 的值。\n\n当我们调用 `new Rectangle(5, 10)` 来创建一个矩形对象 `rect1` 时，函数中的前两行代码显示了 `this`\
  \ 的值。结果是一个空的 `Rectangle` 对象：\n\n![](img/Image00043.jpg)\n\n### 观察：\n\n```\nThis\
  \ in Rectangle is:\nRectangle {}\n```\n\n当使用 `new` 调用构造函数时，首先发生的是创建了一个新的空对象。这就是我们在控制台中看到的这个\
  \ `Rectangle {}` 对象。它的构造函数是 `Rectangle`，并且它（目前）还没有任何属性。\n\n构造函数的其余部分为 `width`、`height`\
  \ 和 `getArea()` 属性赋值，这样当函数结束返回对象时，它的所有属性都已经被创建并赋予了值。\n\n接下来，我们调用刚刚创建的 `Rectangle`\
  \ 对象的 `getArea()` 方法。`getArea()` 方法的前两行在控制台中显示了 `this` 的值。我们看到 `this` 是一个 `Rectangle`\
  \ 对象，并且现在包含了我们在构造函数中创建的属性：\n\n![](img/Image00120.jpg)\n\n### 观察：\n\n```\nThis in\
  \ Rectangle is:\nRectangle {}\n\nThis in Rectangle's getArea is:\nRectangle {width:\
  \ 5, height: 10, getArea: function}\n\nArea of rectangle 1: 50\n```\n\n最后，我们显示调用\
  \ `getArea()` 的结果，结果为 `50`。\n\n因此，在构造函数体和方法中，`this` 指的“该对象”，即由构造函数创建的 `Rectangle`\
  \ 对象。`this` 的第一次使用是在对象创建并修改时（即我们调用构造函数时）创建的对象。`this` 的第二次使用是在我们调用对象方法 `getArea()`\
  \ 后访问它时的对象。在这种情况下，`this` 的值被自动赋值，因为你正在调用一个对象的方法。\n\n现在让我们对比一下调用 `makeRectangle()`\
  \ 来创建矩形对象时发生的情况。\n\n![](img/Image00121.jpg)\n\n### 观察：\n\n```javascript\n// 创建矩形对象的函数\n\
  function makeRectangle(width, height) { \n    console.log(\"This in makeRectangle\
  \ is: \"); \n    console.log(this);\n\n    return {\n        width: width || 0,\n\
  \        height: height || 0,\n        getArea: function() {\n            console.log(\"\
  This in makeRectangle's getArea is: \"); \n            console.log(this);\n    \
  \        return this.width * this.height;\n        }\n    };\n}\n\nvar rect2 = makeRectangle(5,\
  \ 10);\nconsole.log(\"Area of rectangle 2: \" + rect2.getArea());\n```\n\n`makeRectangle()`\
  \ 不是构造函数，它只是一个普通函数，所以我们不使用 `new` 调用它；而是用普通方式调用。`makeRectangle()` 中的前两行代码显示了 `this`\
  \ 的值。你可以看到 `this` 是全局的 `Window` 对象：\n\n![](img/Image00095.jpg)\n\n### 观察：\n\n```\n\
  This in makeRectangle is:\nWindow {top: Window, window: Window, location: Location,\
  \ external: Object, chrome: Object}\n\nThis in a makeRectangle's getArea is:\nObject\
  \ {width: 5, height: 10, getArea: function}\n\nArea of rectangle 2: 50\n```\n\n\
  `makeRectangle()` 没有自动创建对象。虽然我们在在这个函数中创建了一个对象，但那个对象并不是 `this` 的值。我们在下一条语句中创建了那个对象（通过返回一个对象字面量）。\n\
  \n然而，当我们调用 `makeRectangle()` 返回的对象 `rect2` 的 `getArea()` 方法时，你可以看到 `getArea()` 方法中\
  \ `this` 的值确实是一个对象：\n\n![](img/Image00122.jpg)\n\n### 观察：\n\n```\nThis in makeRectangle\
  \ is:\nWindow {top: Window, window: Window, location: Location, external: Object,\
  \ chrome: Object}\n\nThis in a makeRectangle's getArea is:\nObject {width: 5, height:\
  \ 10, getArea: function}\n\nArea of rectangle 2: 50\n```\n\n我们看到的对象是 `rect2`，“该对象”，即我们调用方法的对象。再次注意，该对象的构造函数是\
  \ `Object()`（对比上面 `rect1` 的构造函数）。\n\n最后，我们显示了 `rect2` 的面积，为 `50`。\n\n我们还包含了一个函数\
  \ `getArea()`，它接收一个矩形对象并返回面积：\n\n![](img/Image00123.jpg)\n\n### 观察：\n\n```javascript\n\
  function getArea(r) {\n    console.log(\"This in getArea is: \"); \n    console.log(this);\n\
  \    return (r.width * r.height);\n}\n\nconsole.log(\"Area from getArea(rect1):\
  \ \" + getArea(rect1));\n```\n\n`getArea()` 函数中 `this` 的值显示为：\n\n![](img/Image00104.jpg)\n\
  \n### 观察：\n\n```\nThis in getArea is:\nWindow {top: Window, window: Window, location:\
  \ Location, external: Object, chrome: Object}\n\nArea from getArea(rect1): 50\n\
  ```\n\n再次，`this` 是全局的 `Window` 对象。就像 `makeRectangle()` 一样，`getArea()` 只是一个恰好接收对象并进行计算的普通函数。这个函数没有“该对象”，所以\
  \ `this` 的值被自动设置为 `Window` 对象。\n\n在 JavaScript 中跟踪 `this` 的值可能很复杂，但它是重要的。你需要理解 `this`\
  \ 的值是如何设置的，以及在所有情况下它被设置为什么什么。我们将在后续课程中回顾 `this`。\n\n### 构造数组对象\n\n在离开本节之前，我们来谈构造构造对象。数组是对象，尽管你应该认为它们具有某些我们目前为止创建的对象不具备的特征，例如索引以及对元素的排序。\n\
  \n创建数组有两种方法。在控制台中输入这些命令：\n\n![](img/Image0124.jpg)\n\n### 交互式：\n\n```javascript\n\
  var a1 = new Array(); undefined\na1[0] = 1; // 1\na1[1] = 2; // 2\na1[2] = 3; //\
  \ 3\na1 // [1, 2, 3]\n```\n\n在这里我们使用 `Array()` 构造函数创建了一个空数组 `a1`，像调用其他构造函数一样对其使用\
  \ `new`。然后我们向 0、1、2 索引逐个添加数组项。这类似于使用 `new Object()` 并逐个添加属性，正如我们在课程早期对 `book3` 所的那样。\n\
  \n### 可以括号法访问对象的属性，如下：\n\n![](img/Image076.jpg)\n\n### 观察：\n\n```javascript\nvar\
  \ theTitle = book1[\"title\"];\n```\n\n括号法用于访问数组项，我们使用的是索引而不是属性名。\n\n创建数组的第二方法是使用数组字面量符号：\n\
  \n![](img/Image0060.jpg)\n\n### 交互式：\n\n```javascript\nvar a2 = [1, 2, 3]; undefined\n\
  a2 // [1, 2, 3]\n```\n\n这与上一个例子的效果完全相同；它创建一个在 0、1、2 索引带有值的新数组，但写法要短得多！在实践中，你很少使用\
  \ `Array()` 构造函数来创建数组。相反，你会使用更简洁的数组字面量符号。一种例外是当你需要创建一个预定义数量索引的空数组时：\n\n![](img/Image0060.jpg)\n\
  \n### 交互式：\n\n```javascript\nvar a3 = new Array(100); undefined\na3 // [undefined\
  \ x 100]\n```\n\n\n\n\n这创建了一个长度为 100 的数组，每个索引上的所有项都设置为 `undefined`，Chrome 控制台使用简写\
  \ `[undefined x 100]` 来显示此数组的值。（其他浏览器不使用这种简写，因此当你请求 `a3` 的值时，在不同的浏览器中看到不同的结果）。\n\
  \n与任何其他对象一样，数组可以拥有命名属性，而且实际上它们带有一个命名属性 `length`，你可以用它来获取数组的长度：\n\n![](img/Image00059.jpg)\n\
  \n### 交互会话：\n\n```\na1.length\n3\na2.length\n3\na3.length\n100\n```\n\n与其他对象一样，你可以使用\
  \ `constructor` 属性来检查数组的构造函数：\n\n![](img/Image00089.jpg) \n\n### 交互会话：\n\n```\n\
  a1.constructor\nfunction Array() { [native code] }\n\na2.constructor\nfunction Array()\
  \ { [native code] }\n\na3.constructor\nfunction Array() { [native code] }\n```\n\
  \n在每个情况下，数组的构造函数都是 `Array()`。这类似于 `Object()` 是使用字面量符号或 `new Object()` 创建对象的构造函数。\n\
  \n在本节中，你学习了如何构建对象、构造函数如何工作、使用构造函数创建的对象与使用字面量创建的对象之间的区别，以及当你构建和使用对象时发生了什么。\n\n在下一节中，我们将探索更多与对象相关的优秀特性：原型和继承。在深入学习之前，请先完成测验和项目，然后进行一次应得的休息。\n\
  \n# 原型与继承\n\n![](img/Image00005.jpg)\n\n### 课程目标\n\n当你完成本节后，你将能够：\n\n* 使用 `instanceof`\
  \ 检查特定对象的构造函数或“类型”。\n![](img/Image00006.jpg)\n* 检查构造函数的 `prototype` 属性。\n![](img/Image00006.jpg)\n\
  * 向对象的原型添加方法，以便在对象之间共享它们。\n![](img/Image00006.jpg)\n* 探索在对象的原型中会发生什么。\n![](img/Image00006.jpg)\n\
  * 检查对象的原型链。\n![](img/Image00006.jpg)\n* 使用原型继承从原型链的更高层访问属性。\n![](img/Image00006.jpg)\n\
  * 使用 `hasOwnProperty()` 确定属性是定义在对象本身还是对象的原型上。\n![](img/Image00006.jpg)\n* 在控制台中通过\
  \ `__proto__` 检查对象的原型。\n![](img/Image00005.jpg) ![](img/Image00006.jpg)\n\nJavaScript\
  \ 在两个方面上是一门“面向对象的语言”：首先，它是面向对象的，因为该语言中的几乎所有内容都是对象（除了几个原始类型）。其次，它也是面向对象的，是因为对象可以从其他对象继承属性，并因此与它们共享代码。然而，如果你有任何\
  \ `Java`、`C++` 或 `C#` 等语言的经验，请准备好在本节中用不同的方式思考，因为 JavaScript 对象继承属性的方式与这些语言不同。\n\n\
  # JavaScript 中的面向对象编程\n\n理解 JavaScript 对象如何工作以及它们如何继承属性的关键在于理解 `prototypes`（原型）。在跳转到原型之前，让我们先复习如何使用构造函数创建对象，并引入一个新的操作符\
  \ `instanceof`。\n\n## instanceof\n\n让我们通过创建一个示例来开始对对象的深入研究。我们将让这个示例变得稍微有趣一点，并在网页中显示对象的表示（不过重点是理解对象是如何工作的，所以不要太沉迷于这个示例的酷炫网页）。按照所示创建一个新的\
  \ HTML 文件，然后逐步完成它：\n\n![](img/Image00125.jpg) \n\n字体 需要输入的代码：\n\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n<title> 带有原型和继承的形状 </title>\n<meta charset=\"utf-8\">\n\
  <style>\nhtml, body, div#container {\nwidth: 100%;\nheight: 100%;\nmargin: 0px;\n\
  padding: 0px;\n}\ndiv#container {\nposition: relative;\n}\n.shape {\nposition: absolute;\n\
  text-align: center;\n}\n.shape span {\nposition: relative;\ntop: 44%;\n}\n.square\
  \ {\nbackground-color: lightblue;\n}\n.circle {\nbackground-color: goldenrod;\n\
  border-radius: 50%;\n}\n</style>\n<script>\nfunction Circle(name, radius) {\nthis.name\
  \ = name;\nthis.radius = radius;\nthis.getCircumference = function() {\nreturn this.radius\
  \ * Math.PI * 2;\n};\nthis.getName = function() {\nreturn this.name;\n};\n}\nfunction\
  \ Square(name, size) {\nthis.name = name;\nthis.size = size;\nthis.getArea = function()\
  \ {\nreturn this.size ^ 2;\n};\nthis.getName = function() {\nreturn this.name;\n\
  };\n}\n\n// 全局变量，以便我们可以在控制台中轻松检查它们！（否则，我们通常会将它们设为 window.onload 函数局部）。\nvar circle1\
  \ = new Circle(\"circle1\", 100);\nvar circle2 = new Circle(\"circle2\", 200);\n\
  var square = new Square(\"my square\", 150);\n\nwindow.onload = function() {\naddShapeToPage(circle1);\n\
  addShapeToPage(circle2);\naddShapeToPage(square);\n};\n\nfunction addShapeToPage(shape)\
  \ {\n![](img/Image00126.jpg)\nvar container = document.getElementById(\"container\"\
  );\nvar div = document.createElement(\"div\");\nvar width = 0;\nvar classes = \"\
  shape \";\n\nif (shape instanceof Circle) {\nclasses += \"circle\";\nwidth = shape.radius;\n\
  } else if (shape instanceof Square) {\nclasses += \"square\";\nwidth = shape.size;\n\
  }\n\ndiv.setAttribute(\"class\", classes);\ndiv.style.left = Math.floor(Math.random()\
  \ * (container.offsetWidth - 175)) + \"px\";\ndiv.style.top = Math.floor(Math.random()\
  \ * (container.offsetHeight - 175)) + \"px\";\ndiv.style.width = width + \"px\"\
  ;\ndiv.style.height = width + \"px\";\nvar span = document.createElement(\"span\"\
  );\nspan.innerHTML = shape.getName();\nspan.style.visibility = \"hidden\";\ndiv.appendChild(span);\n\
  \ndiv.onmouseover = function() {\nspan.style.visibility = \"visible\";\n};\n\ncontainer.appendChild(div);\n\
  }\n</script>\n</head>\n<body>\n<div id=\"container\"></div>\n</body>\n</html>\n\
  ```\n\n![](img/Image00042.jpg) 将此保存在你的 JS 文件夹中 ![](img/Image00127.jpg)。你在页面上三个形状：两个圆和一个正方形。打开控制台，验证你可以访问为这三个形状创建的全局变量：\n\
  \n![](img/Image00088.jpg)\n\n### 交互会话：\n\n```\ncircle1\nCircle {name: \"circle1\"\
  , radius: 100, getCircumference: function, getName: function}\n\ncircle2\nCircle\
  \ {name: \"circle2\", radius: 200, getCircumference: function, getName: function}\n\
  \nsquare\nSquare {name: \"my square\", size: 150, getArea: function, getName: function}\n\
  ```\n\n这段代码中有许多讨论的内容，包括一个新的操作符 `instanceof`。我们将逐段进行讨论。\n\n首先，我们有两个构造函数 `Circle()`\
  \ 和 `Square()`：\n\n![](img/Image00115.jpg) \n\n### 观察：\n\n```javascript\nfunction\
  \ Circle(name, radius) {\nthis.name = name;\nthis.radius = radius;\nthis.getCircumference\
  \ = function() {\nreturn this.radius * Math.PI * 2;\n};\nthis.getName = function()\
  \ {\nreturn this.name;\n};\n}\n\nfunction Square(name, size) {\nthis.name = name;\n\
  this.size = size;\nthis.getArea = function() {\nreturn this.size ^ 2;\n};\nthis.getName\
  \ = function() {\nreturn this.name;\n};\n}\n```\n\n\n\n当我们在控制台中显示这三个对象时，我们使用构造函数来创建每种形状。我们知道圆形是由\
  \ `Circle()` 构造函数创建的，正方形是由 `Square()` 构造函数创建的\n\n![](img/Image00128.jpg)\n\n###\
  \ 观察：\n\n> circle1\nCircle {name: \"circle1\", radius: 100, getCircumference: function,\
  \ getName: funct ion}\n\n> circle2\nCircle {name: \"circle2\", radius: 200, getCircumference:\
  \ function, getName: funct ion}\n\n> square\nSquare {name: \"my square\", size:\
  \ 150, getArea: function, getName: function}\n\n我们给 `window.onload` 属性分配了一个短函数，它会在浏览器运行且\
  \ DOM 准备就绪执行。该函数调用了我们创建 `addShapeToPage()`。\n\n一旦页面加载，为每个形状执行该函数\n\n![](img/Image00129.jpg)\
  \ 观察：\n\n```javascript\nfunction addShapeToPage( shape ) {\n  var container = document.getElementById(\"\
  container\"); \n  var div = document.createElement(\"div\"); \n  var width = 0;\n\
  \  var classes = \"shape \";\n\n  if ( shape instanceof Circle) {\n    classes +=\
  \ \"circle\";\n    width = shape .radius;\n  } else if ( shape instanceof Square)\
  \ { \n    classes += \"square\";\n    width = shape .size;\n  }\n\n  div.setAttribute(\"\
  class\", classes);\n  div.style.left = Math.floor(Math.random() * (container.offsetWidth\
  \ - 175)) + \"px\";\n  div.style.top = Math.floor(Math.random() * (container.offsetHeight\
  \ - 175)) + \"px\";\n  div.style.width = width + \"px\";\n  div.style.height = width\
  \ + \"px\";\n\n  var span = document.createElement(\"span\");\n  span.innerHTML\
  \ = shape .getName();\n  span.style.visibility = \"hidden\";\n  div.appendChild(span);\n\
  \n  div.onmouseover = function() {\n    this is the div (the shape) you click on\
  \ this.firstElementChild.style.visibility = \"visible\";\n  };\n  container.appendChild(div);\n\
  }\n```\n\n`addShapeToPage()` 函数将形状添加到页面中。它有一个 `shape` 参数，可以是圆形也可以是正方形，并为该形状创建一个\
  \ `<div>` 元素。当然，我们希望我们的圆形看起来像圆形，正方形看起来像正方形，因此我们创建了 CSS 类来适当为每种形状的 `<div>` 元素样式。回过\
  \ CSS，你会发现我们为两种形状都有 `shape` 类，专门针对正方形的 `square` 类以及专门针对圆形的 `circle` 类：\n\n![](img/Image00130.jpg)\n\
  \n### 观察：\n\n```css\n.shape {\n  position: absolute;\n  text-align: center;\n}\n\
  .shape span {\n  position: relative;\n  top: 44%;\n}\n.square {\n  background-color:\
  \ lightblue;\n}\n.circle {\n  background-color: goldenrod;\n  border-radius: 50%;\n\
  }\n```\n\n在 `addShapeToPage()` 中，我们需要知道传入的形状是圆形还是正方形。为什么？因为如果是圆形，我们想给 `<div>` 添加\
  \ `circle` 类；如果是正方形，我们想给 `<div>` 添加 `square` 类。此外，为了正确设置 `<div>` 的宽度，我们需要访问圆形的 `radius`\
  \ 属性或正方形的 `size` 属性。\n\n那么我们如何确定传入的形状是正方形还是圆形呢？我们使用 `instanceof` 运算符：\n\n![](img/Image00131.jpg)\
  \ 观察：\n\n```javascript\nvar width = 0;\nvar classes = \"shape \";\n\nif ( shape\
  \ instanceof Circle ) {\n  classes += \"circle\";\n  width = shape .radius;\n} else\
  \ if ( shape instanceof Square ) { \n  classes += \"square\";\n  width = shape .size;\n\
  }\n```\n\n`instanceof` 运算符是一个二元运算符：它接受两个参数。左侧的操作数是对象（你想确定该对象的类型），右侧的操作数是用于创建该对象的构造函数名称。在这种情况下，我们使用\
  \ `instanceof` 运算符来确定形状是否为 `Circle`。如果是，我们就知道该形状是使用 `Circle()` 构造函数构建的，并且是一个圆形对象。同样，如果是\
  \ `Square`，我们就知道形状是一个正方形。\n\n一旦我们知道形状是圆形还是正方形，我们就可以设置 `classes` 和 `width` 变量，这样形状在网页中就能正确显示。\n\
  \n然后我们设置剩余的 `<div>` 以在网页中显示圆形或正方形，并将 `<div>` 添加到 DOM 以便在页面中显示。我们为 `<div>` 添加了一个\
  \ `mouseover` 处理器。关于该处理器：\n\n![](img/Image00104.jpg)\n\n### 观察：\n\n```javascript\n\
  div.onmouseover = function() {\n  this is the div (the shape) you click on\n  this\
  \ .firstElementChild.style.visibility = \"visible\";\n};\n```\n\n在上一节课程中，我们讨论了 `this`\
  \ 以及当你构建一个对象或调用对象的方法时 `this` 会被设置为什么。\n\n在大多数情况下，当附加到 DOM 对象的上的事件处理器被调用时，`this`\
  \ 被设置为发生事件的 DOM 对象。因此，在这种情况下，我们为代表形状的 `<div>` 对象挂载了 `mouseover` 处理器。当你把鼠标悬停在那个 `<div>`\
  \ 上并且处理器函数被调用时，`this` 被设置为该 `<div>` 对象，而不是形状对象。\n\n这很容易让你产生困惑，这也是为什么跟踪 `this` 是什么的另一个重要原因。\n\
  \n### 原型 (Prototypes)\n\n那么原型到底是什么？\n\n每当你在 JavaScript 中创建一个对象时，你都会得到第二个对象，即它的 `prototype`。原型与对象的构造函数相关。每个函数都有一个名为\
  \ `prototype` 的属性，它包含一个原型对象。每当你使用该函数作为构造函数创建新对象时，该新对象就会获得该函数 `prototype` 属性中的对象作为它的原型。因此，`Circle()`\
  \ 构造函数有一个 `prototype` 属性，其中包含一个 `Circle` 原型对象。如果你使用 `Circle()` 创建一个新对象 `circle1`，那么\
  \ `circle1` 的原型将是 `Circle.prototype`（即 `Circle()` 构造函数 `prototype` 属性中的对象）。\n\n\
  你可以通过函数的 `prototype` 属性来查看构造函数的原型，如下：\n\n![](img/Image00132.jpg) 交互式会：\n\n```javascript\n\
  function Circle(name, radius) {\n  this.name = name;\n  this.radius = radius;\n\
  \  this.getCircumference = function() {\n    return this.radius * Math.PI * 2;\n\
  \  };\n  this.getName = function() {\n    return this.name;\n  }\n}\nCircle.prototype\
  \ = {}\n\nfunction Square(name, size) {\n  this.name = name;\n  this.size = size;\n\
  \  this.getArea = function() {\n    return this.size ^ 2;\n  };\n  this.getName\
  \ = function() {\n    return this.name;\n  }\n}\nSquare.prototype = {}\n```\n\n\
  当你在控制台中输入 `Circle` 时，你看到它的值是构造函数 `Circle()`。当你输入 `Circle.prototype` 时，你会看到它的值是一个对象\
  \ `Circle { }`。`Circle.prototype` 对象是一个空对象；里面什么都没有。然而，任何使用 `Circle()` 构造函数创建的对象都会获得这个\
  \ `Circle { }` 对象作为它的原型。\n\n你可以通过获取该对象构造函数的原型来获取该对象的原型，如下：\n\n![](img/Image00049.jpg)\
  \ 交互式会：\n\n```javascript\ncircle1.constructor.prototype Circle { }\n```\n\n尝试使用控制台获取\
  \ `circle2` 和 `square` 对象的原型。你得到的是预期的结果吗？\n\n起初要理清这一切可能会有点困惑。但只需这样想：每当你创建一个对象时，该对象都会获得一个原型。原型仅仅是一个对象！如果你想访问对象的原型，就使用该对象的构造函数的\
  \ `prototype` 属性。\n\n所以，当你写 `new Circle(\"circle1\", 100)` 时，你得到一个对象 `circle1`。`circle1`\
  \ 对象的原型是另一个对象 `Circle.prototype`。注意，虽然我们说 `circle1` 的原型是 `Circle.prototype`，但这并不意味着\
  \ `circle1` 拥有一个名为 `prototype` 的属性（它并没有）。`circle1` 与其原型之间的关系不等同于 `circle1` 拥有该属性。现在，你可以通过\
  \ `circle1` 的构造函数 `Circle()` 使用构造函数的 `prototype` 属性来获取 `circle1` 的原型：`Circle.prototype`，但那是另一回事。也许这个图表有助于让这种区别更加清晰：\n\
  \n![](img/Image00133.jpg)\n\n\n\n\n现在，因为你使用相同的构造函数 `Circle()` 创建了对象 `circle2`，所以\
  \ `circle2` 与 `circle1` 具有相同的原型：\n\n![](img/Image00059.jpg)\n\n交互式：\n```javascript\n\
  circle1.constructor.prototype Circle { }\ncircle2.constructor.prototype Circle {\
  \ }\ncircle1.constructor.prototype === circle2.constructor.prototype true\n```\n\
  \n我应该指出的是，`prototype` 属性是 `Circle()` 函数的一个属性。是的，函数可以拥有属性！为什么呢？因为函数也是对象！它们是特殊的对象，但本质上仍然对象。我们稍后会更详细地讨论这一点。\n\
  \n### 字面量对象的原型\n\n让我们来看一个使用字面量对象原型的示例：\n\n![](img/Image00092.jpg)\n\n交互式：\n\n```javascript\n\
  var myObject = { x: 3 }; undefined\nmyObject\nmyObject.constructor\nfunction Object()\
  \ { [native code] }\nmyObject.constructor.prototype Object { }\nmyObject instanceof\
  \ Object true\nmyObject instanceof Circle false\n```\n\n字面量对象 `myObject` 的构造函数是\
  \ `Object()`，而它的原型是 `Object.prototype`。我们可以使用 `instanceof` 来检查 `myObject` 是否是一个\
  \ `Object`。为了保险起见，我们又检查了 `myObject` 是否是 `Circle`，它并不是。很好！\n\n### 原型有什么用？\n\n说了这么多关于原型的内容，你可能还在想，原型到底有什么用？我为什么要关心一个对象是否拥有原型呢？\n\
  \n这就是“面向对象编程”大显身场的地方原型的一个巨大优势是，你可以将所有拥有该原型的对象共享的属性放在原型对象中。\n\n当你尝试访问对象的属性时，无论该属性包含的是原始值还是方法，JavaScript\
  \ 都会首先在对象中查找该属性；如果 JavaScript 在那里没有找到该属性，它就会去原型中查找。如果在原型中找到了该属性，那就是 JavaScript 将使用的值。这被称为`原型链`（prototype\
  \ chain）。让我们仔细观察它是如何工作的。\n\n`circle1` 和 `circle2` 各自拥有不同的名称和半径，但这两个对象的 `getCircumference()`\
  \ 和 `getName()` 方法是相同的——它们不会发生改变。\n\n然而，当我们像之前所做的那样，从同一个构造函数创建两个独立的对象时：\n\n![](img/Image00043.jpg)\n\
  \n观察：\n```javascript\nvar circle1 = new Circle(\"circle1\", 100);\nvar circle2 =\
  \ new Circle(\"circle2\", 200);\n```\n\n每个对象都获得了一份 `getCircumference()` 和 `getName()`\
  \ 方法的拷贝：\n\n![](img/Image00134.jpg)\n\n在这个例子中，这并不重要，但在每个对象都拥有大量属性或方法的情况下，就会出现问题。每个对象都会占用内存。对象占内存越多，程序使用的内存就越多，运行也越慢。\n\
  \n`circle1` 和 `circle2` 的 `Circle.prototype` 目前都是一个空对象：\n\n![](img/Image00049.jpg)\n\
  \n交互式：\n```javascript\ncircle1.constructor.prototype Circle { }\n```\n\n同样，`Square.prototype`\
  \ 目前也是一个空对象。\n\n我们可以将两个圆包含的两个方法移动到 `Circle.prototype` 对象中，并将所有正方形获得的方法移动到 `Square.prototype`\
  \ 对象中。按照所示修改 `proto.html`：\n\n![](img/Image00135.jpg)\n\n需要输入的代码：\n```javascript\n\
  function Circle(name, radius) {\n  this.name = name;\n  this.radius = radius;\n\
  \  this.getCircumference = function() {\n    return this.radius * Math.PI * 2;\n\
  \  };\n  this.getName = function() {\n    return this.name;\n  };\n}\n\nCircle.prototype.getCircumference\
  \ = function() { return this.radius * Math.PI * 2; };\nCircle.prototype.getName\
  \ = function() { return this.name; };\n\nfunction Square(name, size) {\n  this.name\
  \ = name;\n  this.size = size;\n  this.getArea = function() {\n    return this.size\
  \ ^ 2;\n  };\n  this.getName = function() {\n    return this.name;\n  };\n}\n\n\
  Square.prototype.getArea = function() { return this.size * this.size; };\nSquare.prototype.getName\
  \ = function() { return this.name; };\n\n// 全局变量，以便我们在控制台中方便地检查它们！\n//（否则，我们通常会将它们设为\
  \ window.onload 函数的局部变量）。\nvar circle1 = new Circle(\"circle1\", 100);\nvar circle2\
  \ = new Circle(\"circle2\", 200);\nvar square = new Square(\"my square\", 150);\n\
  \nwindow.onload = function() {\n  addShapeToPage(circle1);\n  addShapeToPage(circle2);\n\
  \  addShapeToPage(square);\n};\n\nfunction addShapeToPage(shape) {\n  var container\
  \ = document.getElementById(\"container\");\n  var div = document.createElement(\"\
  div\");\n  div.className = \"shape\";\n  div.innerHTML = shape.name;\n  div.onmouseover\
  \ = function() {\n    div.style.visibility = \"visible\";\n  };\n  div.onmouseout\
  \ = function() {\n    div.style.visibility = \"hidden\";\n  };\n  container.appendChild(div);\n\
  \n  if (shape instanceof Circle) {\n    div.className += \" circle\";\n  } else\
  \ if (shape instanceof Square) {\n    div.className += \" square\";\n  }\n}\n```\n\
  \n\n\n注意，原型对象中的方法仍然使用了 `this`。那么，`this` 是如何被设置为正确的对象的呢？毕竟，`getName()` 方法现在位于原型对象中，但它对两个圆形对象仍然有效。\n\
  \n当你调用一个方法时，例如 `circle1.getName()`，包含被调用方法的对象（在本例中为 `circle1`）将用用作 `this`，即使该方法在对象的原型中也是如此。因此，当你调用\
  \ `circle1.getName()` 时，`this` 被设置为 `circle1`。当你调用 `circle2.getName()` 时，`this`\
  \ 被设置为 `circle2`。\n\n让我们回到控制台，多做一些测试来帮助理解这些内容（接下来的章节来自 Chrome 控制台，所以如果你想完全复制这些操作，请使用\
  \ Chrome）：\n\n![](img/Image00140.jpg)\n\n### 交互会话：\n\n#### 圆形 (Circle)\n\n```javascript\n\
  function Circle(name, radius) {\n  this.name = name;\n  this.radius = radius;\n\
  }\n\nCircle.prototype\n\ncircle1\nCircle { name: \"circle1\", radius: 100, getCircumference:\
  \ function, getName: function }\n\ncircle1.constructor\nfunction Circle(name, radius)\
  \ {\n  this.name = name;\n  this.radius = radius;\n}\n\ncircle1.constructor.prototype\n\
  \ncircle2.constructor.prototype\nCircle { getCircumference: function, getName: function\
  \ }\n```\n\n首先，我们检查 `Circle` 的值。它只是构造函数 `Circle()`。然后我们检查 `Circle.prototype` 的值。记住，函数也是对象，所以它们可以像任何其他对象一样拥有属性。我们获取\
  \ `Circle()` 构造函数的 `prototype` 属性的值；该值是一个包含两个属性 `getCircumference()` 和 `getName()`\
  \ 的 `Circle` 对象，这两个属性都是方法。\n\n接下来，我们检查 `circle1` 的值。这是一个 `Circle` 对象，因为它是用 `Circle()`\
  \ 构造函数创建的，并且包含了四个属性：`name`、`radius`、`getCircumference()` 和 `getName()`。等一下！我们将这两个方法移动到了原型中。为什么它们会列在对象里呢？在这种情况下，这是因为\
  \ Chrome 控制台显示了 `circle1` 原型对象中的属性，以证明它们可以作为属性被访问。（我们很快就会看到如何判断一个属性是存在对象中还是对象的原型中。）\n\
  \n最后，我们通过首先获取构造函数（使用对象的 `constructor` 属性，结果为 `Circle()`），然后使用构造函数的 `prototype` 属性获取原型，从而检查\
  \ `circle1` 和 `circle2` 对象的原型。我们看到这两个对象的原型都是一个 `Circle` 对象。\n\n尝试对正方形对象（square object）执行此操作。\n\
  \n当我们创建用于 放在代表形状的 `div` 内部的 `span` 时，我们正在访问变量 `shape` 中对象的 `getName()` 方法：\n\n![](img/Image00104.jpg)\n\
  \n### 观察：\n\n```javascript\nvar span = document.createElement(\"span\");\nspan.innerHTML\
  \ = shape.getName();\nspan.style.visibility = \"hidden\";\ndiv.appendChild(span);\n\
  ```\n\n正如我们在控制台会话中看到的那样，当我们访问 `shape.getName()` 时，我们使用的是存储在 `shape` 原型中的方法。无论形状是\
  \ `circle1`、`circle2` 还是 `square` 都没有关系；我们会在原型中（取决于变量 `shape` 中存储的是什么类型的对象，可能是 `Circle.prototype`\
  \ 或 `Square.prototype`）找到 `getName()`，并且 `this` 被设置为变量 `shape` 中的对象。\n\n由于 `Circle.prototype`\
  \ 和 `Square.prototype` 是对象，它们也有自己的原型。`Circle.prototype` 的原型是 `Object.prototype`。记住\
  \ `Object()` 是一个内置的构造函数，用于创建对象，就像当你这样写时：\n\n![](img/Image00141.jpg)\n\n### 交互会话：\n\
  \n```javascript\nvar o = { x: 3 }; undefined\no\nObject { x: 3 }\no.constructor\n\
  function Object() { [native code] }\nObject.prototype Object { }\n```\n\n`Object`\
  \ 是一个对象，因为它是字面量对象，它的构造函数是 `Object()`。`Object()` 构造函数有一个 `prototype` 属性，包含了 `o` 的原型。`Object.prototype`\
  \ 看起来是一个空的 `Object`，但那只是在控制台中看起来是那样。实际上，这个对象包含了一系列对象的内置方法，如 `toString()`。你看不见它们，因为\
  \ `Object.prototype` 的实现是浏览器内部的（也就是说，它不是你写的 JavaScript）；它就像你尝试检查 `Object()` 时看到的\
  \ `[native code]` 一样。\n\n所以让我们看看输入这些内容会发生什么：\n\n![](img/Image00049.jpg)\n\n### 交互会话：\n\
  \n```javascript\ncircle1.toString(); \"[object Object]\"\n```\n\n记住原型链：当你编写 `circle1.toString()`\
  \ 时，JavaScript 首先在 `circle1` 中查找，在那里没有找到 `toString()` 方法，然后它会在 `circle1` 的原型（`Circle.prototype`）中查找。如果在那里也没有找到该方法，它就会在\
  \ `circle1` 原型的原型（`Object.prototype`）中查找，并在那里找到了。我们把这种行为称为“查找原型链”以寻找方法：\n\n![](img/Image00142.jpg)\n\
  \n那么 `Object.prototype` 对象的原型是什么呢？它是 JavaScript 中唯一没有原型的对象。`Object.prototype` 是原型链的顶端，因此查找在\
  \ във处结束。\n\n### 原型继承\n\n你创建的每个对象都从原型继承属性，一直延伸到原型链。在我们的示例中，`circle1` 从它的原型继承了 `getName()`\
  \ 和 `getCircumference()` 方法（因为我们特意将它们添加到原型中），并且 `circle1` 从 `Object.prototype` 继承了\
  \ `toString()` 方法。\n\n我们称之为原型继承，这意味着如果你尝试访问对象的属性，而该属性在对象本身不存在，JavaScript 就会查找原型链尝试寻找该属性。大多数对象只有一个或两个原型。如果一个对象是对象字面量，或者是使用\
  \ `new Object()` 创建的，它将拥有原型 `Object.prototype`。如果对象使用如 `Circle()` 这样的构造函数创建，它将拥有两个原型，在这种情况下，链上的第一个原型是\
  \ `Circle.prototype`，第二个是链上再往一层的 `Object.prototype`。有些对象拥有更长的链，但这相当少见。\n\n让我们暂时回到\
  \ `instanceof`。早些时候讨论过 `instanceof` 是一个用于确定你拥有什么种类型对象的运算符。我们在本节的示例中用它来判断 `shape`\
  \ 是圆形还是正方形：\n\n![](img/Image00123.jpg)\n\n### 观察：\n\n```javascript\nif (shape instanceof\
  \ Circle) {\n  classes += \"circle\";\n  width = shape.radius;\n} else if (shape\
  \ instanceof Square) {\n  classes += \"square\";\n  width = shape.size;\n}\n```\n\
  \n`instanceof` 检查 `shape` 的原型链，查看是否存在 `Circle.prototype` 对象或 `Square.prototype`\
  \ 对象。在我们的示例中，形状是由 `Circle()` 或 `Square()` 构造函数创建的，因此我们的形状将拥有 `Circle.prototype`\
  \ 原型或 `Square.prototype` 原型，因此我们会在原型链中找到其中一个原型。\n\n记住，`Object.prototype` 也在原型链中，所以我们可以这样：\n\
  \n![](img/Image00061.jpg)\n\n### 交互会话：\n\n```javascript\ncircle1 instanceof Circle\
  \ true\ncircle1 instanceof Object true\nsquare instanceof Square true\nsquare instanceof\
  \ Object true\n```\n\n`circle1` 既是 `Circle` 的实例也是 `Object` 的实例！`square` 也是如此；`square`\
  \ 既是 `Square` 的实例也是 `Object` 的实例。这很，毕竟所有对象都是对象的实例。然而，原型链中的额外对象提供了关于你正在处理的对象类型的更多信息。在这种情况下，它告诉你该对象是圆形还是正方形。\n\
  \n\n\n\n\n如果你有使用如 `Java`、`C++` 或 `C#` 等面向对象语言的经验，那么原型继承对你来说可能非常奇怪。它与经典继承确实不同——在经典继承中，你从类创建对象，并通过扩展其他对象来创建继承体系。关于原型继承、经典继承以及两者的比较，请参见维基百科上的[基于原型编程](http://en.wikipedia.org/wiki/Prototype-based_programming)[页面](http://en.wikipedia.org/wiki/Prototype-based_programming)。\n\
  \n## 原型对象是在何时创建的？\n\n你可以在原型对象创建后向它们添加属性（例如 `Circle.prototype`），但原型对象是什么时候创建的？每当你定义一个函数时，就会创建一个原型对象。换句话说，每个函数都有一个包含原型对象的\
  \ `prototype` 属性。如果你稍之后使用该函数通过 `new` 创建一个新对象，该新对象就会获得该函数的原型。\n\n因此，一旦定义了 `Circle()`\
  \ 和 `Square()` 函数，我们就可以向 `Circle.prototype` 和 `Square.prototype` 对象添加属性，甚至在用它们创建任何对象之前就可以做到。回看代码，你会发现我们在定义\
  \ `circle1`、`circle2` 或 `square` 之前，就已经向这两个原型添加了属性。\n\n在控制台中尝试以下操作（确保你已加载了 `proto.html`\
  \ 文档）：\n\n![](img/Image00092.jpg) 交互会话：\n\n```\nCircle.prototype.x = 400; // 400\n\
  Circle.prototype.y = 200; // 200\ncircle1.x // 400\ncircle1.y // 200\ncircle2.x\
  \ // 400\ncircle2.y // 200\n```\n\n我们在创建 `circle1` 和 `circle2` 对象后，向 `Circle.prototype`\
  \ 对象添加了两个属性，但你可以看到，当我们查询 `circle1` 和 `circle2` 时，这些属性是有值的。在对象创建后，属性在没有专门修改这些对象（例如通过直接添加属性，如\
  \ `circle1.x = 400;`）的情况下就能出现在对象中，这似乎很奇怪。但如果你回看显示原型工作原理的图，你会发现，如果你尝试访问对象中的某个属性，而该属性在对象本身中不存在，我们就会沿着原型链向上查找。即使我们在对象创建后向该对象的原型添加了属性，该属性也可以从该对象被访问。\n\
  \n### hasOwnProperty\n\n对象可以从其原型链继承属性，但你如何判断一个属性是在对象本身中，还是在对象的某个原型中呢？你应当使用 `hasOwnProperty()`\
  \ 方法。确保你的 `proto.html` 文档已加载，并在控制台中尝试以下操作：\n\n![](img/Image00124.jpg)\n\n交互会话：\n\
  \n```\ncircle1.hasOwnProperty(\"name\") // true\ncircle1.hasOwnProperty(\"getName\"\
  ) // false\ncircle1.hasOwnProperty(\"radius\") // true\nCircle.prototype.x = 400;\
  \ // 400\ncircle1.hasOwnProperty(\"x\") // false\n```\n\n传递给 `hasOwnProperty()`\
  \ 的属性名必须是字符串（将属性名放在引号中）。调用 `circle1.hasOwnProperty(\"name\")` 的结果为 `true`，因为属性名\
  \ `name` 定义在 `circle1` 对象中。然而，`getName` 属性（一个方法）没有定义在 `circle1` 对象中，而是定义在 `circle1`\
  \ 的原型 `Circle.prototype` 中，因此在该属性上调用 `hasOwnProperty()` 的结果为 `false`。同样，属性 `radius`\
  \ 定义在 `circle1` 中，但属性 `x` 没有定义；它定义在 `Circle.prototype` 中。\n\n尝试这个：\n\n![](img/Image00060.jpg)\
  \ 交互会话：\n\n```\ncircle1.hasOwnProperty(\"x\") // false\ncircle1.hasOwnProperty(\"\
  radius\") // true\n```\n\n\n\n\n\n# 引言\n\n在这个示例中，我们为圆形和正方形使用了同一个对象作为原型：`shape`。这意味着原型对象中的属性和方法对于圆形和正方形来说都是有意义的。之前，我们通过编写\
  \ `Circle.prototype.PROPERTY = VALUE` 和 `Square.prototype.PROPERTY = VALUE` 来设置原型的属性，因为圆形和正方形需要不同的属性和方法。在设置对象原型时，请记住这一点：你选择如何设置原型链取决于你的具体情况，以及你的对象是否需要不同的原型或通的原型。\n\
  \n查看圆形和正方形对象：\n\n![](img/Image00091.jpg)\n\n#### 交互式：\n\n```javascript\ncircle\n\
  Circle {radius: 50, computeArea: function, x: 100, y: 100, area: 7853.98163397448\
  \ 3}\n\nsquare\nSquare {size: 50, computeArea: function, x: 300, y: 300, area: 2500}\n\
  \ncircle.constructor.prototype\nObject {}\n\nsquare.constructor.prototype\nObject\
  \ {}\n\ncircle instanceof Circle true\n\ncircle instanceof shape\nTypeError: Expecting\
  \ a function in instanceof check, but got #<Circle>\n```\n\n我们看到 `circle` 的构造函数是\
  \ `Circle`，`square` 的是 `Square`，但现在 `circle.constructor.prototype` 显示为 `Object {}`（之前是\
  \ `Circle {}`）。这是因为原型是 `square` 对象，由于 `square` 对象是一个字面量对象，它的构造函数是 `Object()`，所以它的“类型”是\
  \ `Object`。`square` 也是如此。\n\n换句话说，`circle` 是 `Circle` 的实例（因为我们使用 `Circle()` 构造函数创建了\
  \ `circle`），而 `circle` 也是 `Object` 的实例，因为 `shape` 是一个字面量对象，它的构造函数是 `Object()`。\n\
  \n原型继承并不极其复杂，但这个主题可能很难理解，特别是如果你有类语言经验。你必须放下那些知识，以不同的方式思考对象和继承。这一切都归结为一点：在 JavaScript\
  \ 中，每个对象都有原型（当然，`Object.prototype` 除外），并且可以从原型链继承属性。\n\n请确保为自己留出充足的时间来练习和理解本节的概念。对自己的对象和原型进行实验。使用控制台检查你的对象，并利用你现在的工具进行测试，以确保你认为应该发生的事情确实发生了。在测验和项目中练习，并确保清楚自己在做什么。\n\
  \n# 函数\n\n![](img/Image00005.jpg)\n\n### 课程目标\n\n完成本节后，你将能够：\n* 使用基本函数。\n* 使用函数组织代码。\n\
  * 使用函数声明和函数表达式定义函数。\n* 比较使用函数声明和函数表达式的区别。\n* 将函数表示为一等值。\n* 将函数表示为匿名函数。\n* 将函数作为值传递给其他函数。\n\
  * 从一个函数中返回一个函数。\n* 将函数用事件处理器。\n* 识别值如何通过“值传递”传递给函数。\n* 解释当我们将对象传递给函数时会发生什么。\n\n\
  在过去的几节中，我们一直在处理对象；现在让我们关注函数。\n\n## JavaScript 函数\n\n在整个课程中，我们以各种方式使用了函数。如果不使用函数，想要进行任何严肃的\
  \ JavaScript 开发都是困难的。\n\n### 什么是函数？\n\n函数是一段定义一次的代码块，但可以执行多次。让我们来看一个简单的函数声明：\n\n\
  ![](img/Image00104.jpg)\n\n**观察：**\n```javascript\nfunction computeArea ( radius\
  \ ) {\n  var area = radius * radius * Math.PI;\n  return area;\n}\n```\n\n这个函数有很多不同的部分，让我们逐步分析。首先，我们有\
  \ `function` 关键字。然后，是函数的名 `computeArea`。接着在括号中，我们有一个参数(`radius`）。函数体（调用函数时执行的语句）定义在大括号内。在函数体中，我们有两个语句：第一个是声明并计算局部变量\
  \ `area` 值的语句；第二个是 `return` 语句，它将 `area` 的值返回给调用函数的语句。\n\n现在让我们调用这个函数：\n\n![](img/Image00086.jpg)\
  \ **需要输入的代码：**\n\n```html\n<!doctype html>\n<html\n<head>\n<title> Functions </title>\n\
  <meta charset=\"utf-8\">\n<script>\nfunction computeArea(radius) {\n  var area =\
  \ radius * radius * Math.PI;\n  return area;\n}\nvar circleArea = computeArea(3);\n\
  console.log(\"Area of circle with radius 3: \" + circleArea);\n</script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n![](img/Image00087.jpg) 将其保存到你的 `/AdvJS` 文件夹并命名为\
  \ `functions.html`，![](img/Image00127.jpg)。在控制台中，你看到了半径为 3 的圆的面积：\n\n![](img/Image00043.jpg)\n\
  \n**观察：**\n`Area of circle with radius 3: 28.274333882308138`\n\n让我们仔细观察一下：\n\n\
  ![](img/Image00095.jpg)\n\n**观察：**\n```javascript\nfunction computeArea( radius\
  \ ) {\n  var area = radius * radius * Math.PI;\n  return area;\n}\nvar circleArea\
  \ = computeArea ( 3 );\n```\n\n我们使用函数名 (`computeArea`) 调用函数，并向函数传递一个参数(`3`）。函数的参数\
  \ `radius` 获取了参数的值。该值被用于计算。当我们向函数传递参数时，我们说该参数绑定到了参数上。因此在这里，值 `3` 绑定到了参数 `radius`。\n\
  \n函数返回的值存储在变量 `circleArea` 中。\n\n我们可以根据需要无限次调用该函数：\n\n![](img/Image00020.jpg) **需要输入的代码：**\n\
  \n```javascript\nfunction computeArea(radius) {\n  var area = radius * radius *\
  \ Math.PI;\n  return area;\n}\nvar circleArea = computeArea(3);\nconsole.log(\"\
  Area of circle with radius 3: \" + circleArea); \ncircleArea = computeArea(5);\n\
  console.log(\"Area of circle with radius 5: \" + circleArea); \ncircleArea = computeArea(7);\n\
  console.log(\"Area of circle with radius 7: \" + circleArea);\n```\n![](img/Image00042.jpg)\
  \ 和 ![](img/Image00021.jpg)。在控制台中，你现在可以看到半径为 5 和 7 的圆的面积，以及半径为 3 的圆的面积。\n\n通过创建函数\
  \ `computeArea()`，我们封装了一段计算圆面积的代码；这样在每次调用函数时都可以重复使用。此外，我们可以通过为参数传递不同的值，在每次调用函数时对代码进行一些自定义。如果我们返回一个值，我们还可以从函数获取自定义的值。在这种情况下，我们得到了通过传入函数的半径所对应的圆的面积。注意，函数总是会返回一个值；如果你不显式返回，函数将返回\
  \ `undefined`（除非你将其作为构造函数使用，此时函数返回一个对象）。\n\n所以，函数是重用代码的一种。它们也是组织代码的一种。良好的编程习惯是将函数视为将相关代码放在一起的方式。例如，你可以将所有与圆面积的代码放在一个函数中，而将所有与计算两点间距离的代码放在另一个函数中。\n\
  \n\n\n\n\n当你创建一个函数时，你实际上也是为可执行语句创建了一个作用域。在下一节中，我们将更详细地讨论作用域，但现在，请注意参数 `radius` 和变量\
  \ `area` 都是局部的（即只在函数体内部可见），而不是全局的（即在你的代码的任何地方可见）。程序员通常对 JavaScript 依赖全局变量持批评态度，因为全局变量很容易丢失和被误用。函数有助于将变量排除在全局作用域之外。当你将自己的代码与来自库的代码（如\
  \ `jQuery` 或 `Underscore.js`）结合时，这尤尤为有用。使用函数将变量排除在全局作用域之外通常被称为“模块模式”（Module Pattern）。我们将在后的课程中详细介绍它。\n\
  \n## 定义函数的不同方式\n\n在上面的代码中，我们使用了所谓的“函数声明”（function declaration）来定义 `computeArea()`\
  \ 函数。\n\n也就是说，我们使用一个以 `function` 关键字开头的语句声明了该函数。它看起来如下：\n\n![](img/Image00033.jpg)\n\
  \n观察：\n\n```javascript\nfunction functionName(parameters) {\n  // 函数体放在这里\n}\n```\n\
  \n使用函数声明定义函数的优点之一是，你可以将函数放在使用它们的代码上方或下方。尝试一下：\n\n![](img/Image00146.jpg)\n\n需要输入的代码：\n\
  \n```javascript\nfunction computeArea(radius) {\n  var area = radius * radius *\
  \ Math.PI;\n  return area;\n}\n\nvar circleArea = computeArea(3);\nconsole.log(\"\
  Area of circle with radius 3: \" + circleArea); circleArea = computeArea(5);\nconsole.log(\"\
  Area of circle with radius 5: \" + circleArea); circleArea = computeArea(7);\nconsole.log(\"\
  Area of circle with radius 7: \" + circleArea);\n\nfunction computeArea(radius)\
  \ {\n  var area = radius * radius * Math.PI;\n  return area;\n}\n```\n\n![](img/Image00042.jpg)\
  \ 和 ![](img/Image00021.jpg) ; 你的代码运行方式与之前完全相同，即使函数 `computeArea()` 定义在我们调用它的地方下方。\n\
  \n这之所以有效，是因为当浏览器加载你的页面时，它会在执行你的代码之前，遍历你所有的 JavaScript 并查找函数声明。当你像我们在这里这样在全局级别定义函数时，JavaScript\
  \ 会将函数添加为全局 `window` 对象的属性，因此函数定义在你的代码的任何地方都可见。然后，浏览器回到 JavaScript 的顶部，并从上到下开始执行代码。所以，当\
  \ JavaScript 解释器到达调用 `computeArea()` 的第一行时，该函数已经定义好了，因此函数调用成功了。\n\n创建函数的另一种方法是使用“函数表达式”（function\
  \ expression）：\n\n![](img/Image00147.jpg)\n\n需要输入的代码：\n\n```javascript\nvar circleArea\
  \ = computeArea(3);\nconsole.log(\"Area of circle with radius 3: \" + circleArea);\
  \ circleArea = computeArea(5);\nconsole.log(\"Area of circle with radius 5: \" +\
  \ circleArea); circleArea = computeArea(7);\nconsole.log(\"Area of circle with radius\
  \ 7: \" + circleArea);\n\nfunction computeArea(radius) {\n  var area = radius *\
  \ radius * Math.PI;\n  return area;\n}\n\nvar computeArea = function(radius) {\n\
  \  var area = radius * radius * Math.PI;\n  return area;\n};\n```\n\n我们用变量声明替换了函数声明：我们声明了变量\
  \ `computeArea`，并将该变量初始化为函数表达式的结果，即一个函数值。由于 `computeArea` 是一个全局变量，最终结果几乎相同：在全局 `window`\
  \ 对象上添加了一个名为 `computeArea` 的属性，并将其设置为函数值。然而，当你 ![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)\
  \ 预览时，你看到的是一个错误而不是预期的日志消息。为什么呢？\n\nJavaScript 将此语句仅视为变量的声明和初始化。变量的值恰好是一个函数，但由于我们没有使用函数声明，该函数在代码的第一遍扫描中不再被定义；相反，在\
  \ JavaScript 到达变量声明之前，函数是未定义的，而这正是从上到下执行代码的时候。现在函数在尝试调用它的语句之后才被定义，因此我们得到了错误信息。\n\
  \n我们可以通过将变量声明移动到代码顶部来修复错误，如下：\n\n![](img/Image00148.jpg)\n\n需要输入的代码：\n\n```javascript\n\
  var computeArea = function(radius) {\n  var area = radius * radius * Math.PI;\n\
  \  return area;\n}\n\nvar circleArea = computeArea(3);\nconsole.log(\"Area of circle\
  \ with radius 3: \" + circleArea); circleArea = computeArea(5);\nconsole.log(\"\
  Area of circle with radius 5: \" + circleArea); circleArea = computeArea(7);\nconsole.log(\"\
  Area of circle with radius 7: \" + circleArea);\n\nvar computeArea = function(radius)\
  \ {\n  var area = radius * radius * Math.PI;\n  return area;\n}\n```\n\n![](img/Image00042.jpg)\
  \ 和 ![](img/Image00021.jpg) ; 你的代码再次正常工作。\n\n当我们在对象中定义方法时，也会使用函数表达式：\n\n![](img/Image00149.jpg)\
  \ 观察：\n\n```javascript\ncircle = {\n  radius: 3,\n  computeArea: function() {\n\
  \    var area = this.radius * this.radius * Math.PI;\n    return area;\n  }\n};\n\
  ```\n\n你可以看到，我们使用相同的语法来定义方法（`circle` 对象中的 `computeArea()`），就像我们将其定义为全局函数时一样。区别在于，现在该属性只在\
  \ `circle` 对象中可见；函数不再是全局 `window` 对象的属性。\n\n所以，在定义全局函数时，哪种方法更好：使用函数声明，还是声明变量并初始化为函数表达式？\n\
  \n使用函数声明定义全局函数的主要优点是，它们在代码随处可见，因此你不需要将它们都放在顶部。然而，只要你的函数在代码执行时已经定义，使用变量声明并将其设置为函数表达式的效果同样好。减少全局变量（包括函数！）在\
  \ JavaScript 中总是优先的。接下来，我们将查看其他使用函数表达式而非函数声明的情况。\n\n## 作为类值的函数\n\n我们倾向于将函数与其他值（例如\
  \ `3` 或 `circle` 对象）区分开来，但在 JavaScript 中，函数只是另一种值，是可以赋值给变量或对象属性、甚至从从函数返回的值。\n\n\
  我们说 JavaScript 中的函数是类值。类值是可以存储在变量中、传递给函数并从函数返回的值。你 reality 数字、字符串和布尔值是类值；对象也是。如果你已经使用\
  \ JavaScript 了一段时间，你可能知道函数是类值。并不是所有语言都有类函数。在某些语言中，函数被与其他值分开并区别对待。\n\n那么类函数到底意味着什么？我们将通过查看\
  \ `map()` 方法来回答这个问题。创建一个新文件并添加以下代码：\n\n![](img/Image0150.jpg)\n\n需要输入的代码：\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title> First Class Functions</title>\n<meta charset=\"\
  utf-8\">\n<script>\nvar myArray = [1, 2, 3];\nvar newArray = myArray.map(function(x)\
  \ { return x+1; }); console.log(newArray);\n</script>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n![](img/Image00042.jpg) 将此文件保存在 `/AdvJS` 文件夹中并为 `functions2.html`，并\
  \ ![](img/Image00085.jpg)。打开控制台。你在控制台中看到一个数组：\n\n![](img/Image0076.jpg)\n\n观察：\n\
  \n```\n[2, 3, 4]\n```\n\n![](img/Image0017.jpg) 如果你在尝试这段代码时遇到错误，是因为你的浏览器尚不支持 `map()`\
  \ 。\n\n\n\n\n\n注意：这是一个相当新的方法，作为 ECMAScript 5 标准的一部分添加到 JavaScript 中。确保你的浏览器是最新版本以尝试此代码，因为\
  \ `map()` 在所有最新浏览器中都得到了广泛支持。\n\n![](img/Image00018.jpg)\n\n`map()` 方法是一个数组方法，所有数组都继承自\
  \ `Array` 原型。它接收一个函数，并将该函数（按顺序）应用于数组的每个元素。因此，在我们的示例中，`map()` 首先将函数应用于 `myArray[0]`，然后是\
  \ `myArray[1]`，依此类推。数组元素被作为参数 `x` 的参数传递。`map()` 返回一个新数组，其长度与原数组相同，其中的元素是我们传递给 `map()`\
  \ 的函数每次调用时返回的值。在我们的示例中，传递给 `map()` 的函数将数组的每个元素加 1，因此你返回的数组项比原始数组中的每个对应项都大 1。\n\n\
  我们传递给 `map()` 的值是一个函数。遗憾的是，由于 `map()` 会在后台为你将函数应用于数组的元素上，因此你无法看到作为参数传递的函数是如何工作的。让我们实现我们自己的版本的\
  \ `map()`，这样你不仅可以看到如何将一个函数作为参数传递，还能看到如何在传递给它的函数内部使用它：\n\n![](img/Image00093.jpg)\n\
  \n需要输入的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title> First Class Functions\
  \ </title>\n<meta charset=\"utf-8\">\n<script>\nvar myArray = [1, 2, 3];\nvar newArray\
  \ = myArray.map(function(x) { return x+1; }); console.log(newArray);\n\nfunction\
  \ map(a, f) {\nvar newArray = [];\nfor (var i = 0; i < a.length; i++) {\nnewArray.push(f(a[i]));\n\
  }\nreturn newArray;\n}\n\nfunction addOne(x) {\nreturn x+1;\n}\nvar newArray2 =\
  \ map(myArray, addOne);\nconsole.log(newArray2);\n</script>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg) 预览。在控制台中，我们为自己版本的\
  \ `map()` 得到了与之前完全相同的结果，数组 `[2, 3, 4]`。让我们逐步检查代码：\n\n![](img/Image00151.jpg) 观察：\n\
  \n```javascript\nfunction map( a , f ) {\nvar newArray = [];\nfor (var i = 0; i\
  \ < a.length ; i++) {\nnewArray .push( f ( a[i] ));\n}\nreturn newArray ;\n}\n\n\
  function addOne(x) {\nreturn x+1;\n}\nvar newArray2 = map( myArray , addOne );\n\
  ```\n\n我们版本的 `map()` 是一个函数而不是一个方法，因此我们需要将数组和作用于数组的 `f` 函数都传递给 `map()` 函数。这就是为什么我们的函数有两个参数而不是一个。\n\
  \n首先，我们创建了一个新的空数组 `newArray`。然后，我们遍历传入的数组 `a` 中的所有元素，并将函数 `f` 应用于数组元素。在 `map()`\
  \ 内部，我们找到了 `f`。`f` 产生一个新值，然后将其添加到与 `a[i]` 相同索引的 `newArray` 中。完成后，我们返回 `newArray`。\n\
  \n现在让我们看看如何调用这个 `map()` 函数。我们需要一个数组和一个函数传递给它；我们将重用 `myArray`（来自代码顶部），并创建一个名为 `addOne()`\
  \ 的函数进行传递。和之前一样，`addOne()` 是一个接收参数、对其加 1 并返回该值的函数。我们调用 `map()`，将 `myArray` 和 `addOne`\
  \ 作为参数，得到一个每个元素都比 `myArray` 大 1 的新数组。\n\n将函数传递给函数就像将任何其他值传递给函数，只不过你将其作为函数使用，并且需要知道函数期望什么样的参数以及它返回什么值（如果有）。你可以编写像\
  \ `map()` 这样执行有用工作的方法和函数，并通过传入不同的函数进行自定义。\n\n### 匿名函数\n\n我们在数组上调用 `map()` 方法时，使用了函数表达式作为传递给\
  \ `map()` 的参数，而在我们实现的 `map()` 中，我们使用定义的函数作为参数。使用哪种并不重要，如果你不在 `map()` 的参数处的地方使用 `addOne()`\
  \ 函数，你可能想避免冗余并改用函数表达式：![](img/Image00152.jpg) 需要的代码：\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title> First Class Functions </title>\n<meta charset=\"utf-8\"\
  >\n<script>\nvar myArray = [1, 2, 3];\nvar newArray = myArray.map(function(x) {\
  \ return x+1; }); console.log(newArray);\n\nfunction map(a, f) {\nvar newArray =\
  \ [];\nfor (var i = 0; i < a.length; i++) {\nnewArray.push(f(a[i]));\n}\nreturn\
  \ newArray;\n}\n\nfunction addOne(x) {\nreturn x+1;\n}\nvar newArray2 = map(myArray,\
  \ addOne);\nvar newArray2 = map(myArray, function(x) { return x+1; }); console.log(newArray2);\n\
  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)。你在控制台中看到了相同的结果。\n\
  \n现在，我们不是声明函数 `addOne()`，而是向 `map()` 传递一个函数表达式。与传递 `addOne()` 不同，这个函数没有名称。它被称为匿名函数。当然，它在\
  \ `map()` 内部有一个名称，因为它绑定到了参数 `f`。\n\n匿名函数表达式只是没有名称的函数值。当我们向函数传递函数或从函数返回函数时这非常有用，因为在这两种情况下函数都会绑定到一个名称。当你将匿名函数传递给函数时，它绑定到参数变量上；当你从函数返回匿名函数时，它被存储在你用于持有返回值的变量中。你会在\
  \ JavaScript 中频繁看到匿名函数作为声明和命名函数的快捷方式。\n\n### 从函数返回函数你不仅可以将函数传递给函数，还可以从函数返回函数。让我们来看一个例子：![](img/Image00153.jpg)\
  \ 需要的代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title> Returning Functions\
  \ </title>\n<meta charset=\"utf-8\">\n<script>\nfunction makeConverterFunction(multiplier,\
  \ term) { return function(input) {\nvar convertedValue = input * multiplier;\nconvertedValue\
  \ = convertedValue.toFixed(2);\nreturn convertedValue + \" \" + term;\n};\n}\n\n\
  var kilometersToMiles = makeConverterFunction(0.6214, \"miles\"); console.log(\"\
  10 km is \" + kilometersToMiles(10));\nvar milesToKilometers = makeConverterFunction(1.62,\
  \ \"km\"); console.log(\"10 miles is \" + milesToKilometers(10));\n</script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n将其保存到你的 `/AdvJS` 文件夹并命名为 `functions3.html`![](img/Image00085.jpg)。在控制台中，你看到了这个输出：![](img/Image00043.jpg)\n\
  \n观察：\n10 km is 6.21 miles\n10 miles is 16.20 km\n\n让我们检查代码：![](img/Image00154.jpg)\
  \ 观察：\n\n```javascript\nfunction makeConverterFunction(multiplier, term) { return\
  \ function(input) {\nvar convertedValue = input * multiplier;\nconvertedValue =\
  \ convertedValue.toFixed(2);\nreturn convertedValue + \" \" + term;\n};\n}\n\nvar\
  \ kilometersToMiles = makeConverterFunction(0.6214, \"miles\"); console.log(\"10\
  \ km is \" + kilometersToMiles(10));\nvar milesToKilometers = makeConverterFunction(1.62,\
  \ \"km\"); console.log(\"10 miles is \" + milesToKilometers(10));\n```\n\n我们正在使用一个函数\
  \ `makeConverterFunction()` 来创建另外两个函数 `kilometersToMiles` 和 `milesToKilometers`。`makeConverterFunction()`\
  \ 接收两个参数：用于转换的乘法值（什么种转换无所谓，只要通过一个值乘以另一个值即可），以及一个代表我们从生成的函数中预期的单位字符串。\n\n`makeConverterFunction()`\
  \ 返回一个函数。它返回的函数接收一个参数 `input`，并使用该参数与 `makeConverterFunction()` 的参数进行计算。\n\n\n\n\
  \n\n`makeConverter()` 并不了解我们想要执行的转换类型。它只知道正在生成一个新函数，将输入乘以 `multiplier`，使用 `Fixed()`\
  \ 确保生成的数字最多保留两位小数，然后返回一个由该数字与传入 `makeConverter()` 的 `term` 组合成的字符串。\n\n我们可以使用 `makeConverter()`\
  \ 来创建特定类型转换的函数，为 `multiplier` 传入一个值为 `term` 传入一个字符串。因此，为了创建一个将公里转换为英里（`kilometersToMiles`）的函数，我们传入\
  \ `0.6214` 作为 multiplier，并将 `\"miles,\"` 作为 term，返回一个可以在调用并传入公里数时执行此转换的函数。同样，我们可以通过为\
  \ `multiplier` 传入 `1.62` 并为 `term` 传入 `\"km\"` 来创建一个英里转换为公里（`milesToKilometers`）的函数。\n\
  \n仔细检查这段代码以确保你理解了它。`makeConverter()` 返回一个函数，该函数同时使用了 `makeConverter()` 的参数以及尚未绑定的参数\
  \ `input`。一旦 `makeConverter()` 创建并返回该函数，参数 `multiplier` 和 `term` 就会消失，但不知为何，函数 `kilometersToMiles()`\
  \ 和 `milesToKilometers()` 却“记住”了这些值。这种带有魔法色彩的记忆能力的秘密就是闭包（closure）——我们将在后的课程中回到它。\n\
  \n现在，只需注意你传入 `makeConverter()` 的参数会被 `makeConverter()` 创建的函数使用（并记住）。因此，在 `kilometersToMiles()`\
  \ 中，`multiplier` 的值为 `0.6214`，`term` 的值为 `\"miles,\"`；而在 `milesToKilometers()` 中，`multiplier`\
  \ 的值为 `1.62`，`term` 的值为 `\"km.\"`。\n\n## 作为回调的函数\n\n几乎每个 JavaScript 程序的内核都是事件。当你编写\
  \ Web 应用时，你使用 JavaScript 为页面添加交互性，这意味着你的程序需要响应由浏览器生成的事件以及用户生成的事件。\n\n在 JavaScript\
  \ 中，我们使用函数来处理事件。我们通常将事件处理器称为回调（callbacks），因为当事件发生时，我们会“回调用”一个函数来处理该事件。回调并不总是关于浏览器和用户事件，但很多时候确实如此。\n\
  \n你可能已经使用过函数来处理页面加载和按钮点击等事件。如果你在 JavaScript 程序中使用过 Ajax（也称为 XHR）或地理定位（Geolocation），你可能对用作回调的函数熟悉。例如，使用\
  \ Ajax 时，你提供一个函数在当 `XMLHttpRequest` 从文件加载数据时进行“回调”。使用地理定位时，你提供一个函数在浏览器定位到你的位置时进行“回调”。让我们快速看一个简单的地理定位示例，你就可以看到我们如何使用函数作为回调：\n\
  \n![](img/Image00155.jpg)\n\n需要输入的代码：\n\n```html\n<!doctype html>\n<html\n<head>\n\
  <title> Functions as callbacks </title>\n<meta charset=\"utf-8\">\n<script>\nwindow.onload\
  \ = function() {\nif (navigator.geolocation) {\nnavigator.geolocation.getCurrentPosition(getLocation);\n\
  }\nelse {\nconsole.log(\"Sorry, no Geolocation support!\"); return;\n}\n}\n};\n\n\
  function getLocation(position) {\nvar latitude = position.coords.latitude;\nvar\
  \ longitude = position.coords.longitude;\nvar div = document.getElementById(\"container\"\
  );\ndiv.innerHTML = \"You are at lat: \" + latitude + \", long: \" + longitude;\n\
  }\n</script>\n</head>\n<body>\n<div id=\"container\"></</div>\n</body>\n</</html>\n\
  ```\n\n![](img/Image00042.jpg) 将此文件保存到你的 `/AdvJS` 文件夹中并命名为 `functions4.html`，然后\
  \ ![](img/Image00021.jpg)。稍后你的位置将在浏览器中显示出来。\n\n![](img/Image00034.jpg)\n\n| Note\
  \ | 所有现代浏览器都支持地理定位，但地理定位失败有很多原因。如果你没有获取到位置，不要担心，只需跟着操作即可。 |\n|  |\n\n![](img/Image00018.jpg)\n\
  \n在这个示例中，我们在两个地方使用了函数作为回调：首先，我们通过将 `window.onload` 属性设置为该函数，将匿名函数作为加载事件处理器。这意味着当浏览器触发“加载”事件时——即页面完全加载时——存储在\
  \ `window.onload` 属性中的函数就会被调用。这是异步发生的。你无法预测页面何时加载；你唯一知道的是当浏览器加载完页面后，它会调用这个函数。\n\n\
  其次，我们将 `getLocation()` 函数作为地理定位 `getCurrentPosition()` 方法的回调。同样，这也是一个事件处理器：一个在特定事件发生时被调用的函数——在这种情况下，是当定位对象找到你的位置时。这个回调是异步的：你无法预测浏览器找到你的位置需要多久，你只需要知道当它找到时，浏览器会带上你的位置回调你的函数。\n\
  \n与 `window.onload` 不同，我们通过将 `getLocation()` 函数传递给 `getCurrentPosition()` 方法来指定此回调。`getCurrentPosition()`\
  \ 方法会在浏览器获取你的位置后立即（在后台）调用 `getLocation()`。在 `getLocation` 中我们拥有一个有效的位置，因此我们将位置作为\
  \ `latitude` 和 `longitude` 添加到网页中。（如果在获取位置时出错，`getLocation()` 将不会被调用；它只在浏览器能找到你时才会被调用）。\n\
  \n## 调用函数：值传递\n\n在本节中，我们看到了很多函数的示例，并且向函数传递了各种不同的值，包括数字、字符串和其他函数。让我们仔细观察向函数传递参数时发生了什么。创建一个新文件并添加以下代码：\n\
  \n![](img/Image00041.jpg)\n\n需要输入的代码：\n\n```html\n<!doctype html>\n<html\n<head>\n\
  <title> Functions: Pass by value </title>\n<meta charset=\"utf-8\">\n<script>\n\
  function changeNum(num) {\nnum = 3;\n}\nvar myNum = 10;\nchangeNum(myNum);\nconsole.log(myNum);\n\
  </script>\n</head>\n<body>\n</body>\n</</html>\n```\n\n![](img/Image00042.jpg) 将此文件保存到你的\
  \ `/AdvJS` 文件夹中并命名为 `functions5.html`，然后 ![](img/Image00021.jpg)。打开控制台。\n\n你看到了值\
  \ 10。这是你预期的结果吗？当你将 `myNum` 传递给函数 `changeNum()` 时，参数 `num` 获得了 `myNum` 值的副本。当你将 `num`\
  \ 改为 3 时，并没有改变 `myNum` 的值。\n\n这种在向函数传递参数时值复制到参数的过程中被称为值传递（pass-by-value）。\n\n现在向程序中添加以下代码：\n\
  \n![](img/Image00156.jpg) 需要输入的代码：\n\n```html\n<!doctype html>\n<html\n<head>\n\
  <title> Functions: Pass by value </title>\n<meta charset=\"utf-8\">\n<script>\n\
  function changeNum(num) {\nnum = 3;\n}\nvar myNum = 10;\nchangeNum(myNum);\nconsole.log(myNum);\n\
  \nfunction changeObj(obj) {\nobj.x = 3;\nobj.z = 10;\n}\nvar foo = {\n    x: 0,\n\
  \    y: 1\n};\nconsole.log(\"Before changeObj, foo is: \"); console.log(foo);\n\
  changeObj(foo);\nconsole.log(\"After changeObj, foo is: \"); console.log(foo);\n\
  </script>\n</head>\n<body>\n</body>\n</</html>\n```\n\n![](img/Image00042.jpg) 和\
  \ ![](img/Image00021.jpg)。你看到了如下输出（或类似的内容；我们的来自 Chrome）：\n\n![](img/Image0104.jpg)\n\
  \n观察：\n\n调用 changeObj 前，foo 是：\nObject {x: 0, y: 1}\n\n调用 changeObj 后，foo 是：\nObject\
  \ {x: 3, y: 1, z: 10}\n\n在新代码中，我们创建了一个对象 `foo`，它有两个属性：`foo.x` 和 `foo.y`。我们将对象 `foo`\
  \ 传递给函数 `changeObj()`，该对象被绑定到参数 `obj`。该函数将属性 `obj.x` 的值设置为 3，并将属性 `obj.z` 的值设置为\
  \ 10。\n\n\n\n\n在我们调用 `changeObj()` 并将 `f o o` 传递给函数后，`f o o` 的属性发生了变化。JavaScript\
  \ 是值传递（pass-by-value），这意味着函数参数获取的是我们传递给函数的参数值的副本。那么，`f o o` 的属性到底是如何被改变的呢？\n\n变量\
  \ `f o o` 中的值是一个引用——也就是说，是一个内存地址，指向对象中数据的指针。当我们将 `f o o` 传递给 `changeObj()` 时，传递的是内存地址的副本，而不是内存地址中数据的副本。因此\
  \ `o bj`（参数）也是一个内存地址，指向与 `f o o` 相同的地方。当你更改属性值或向 `o bj` 添加新属性时，你实际上是在 `f o o` 上进行了这些更改和添加，因为它们指向同一个对象。\n\
  \n![](img/Image00157.jpg)\n\n这种值传递的概念起初可能有点点棘手，所以花些时间查看这段代码，以确保你理解了它。自己做做实验。尝试向一个改变数组的函数传递一个数组。记住数组也是对象。你得到预期的结果了吗？\n\
  \n## Return\n\n在我们结束本节之前，让我们来讨论 `return` 语句。`return` 用于从函数返回值。然而，如果你没有 `return`\
  \ 语句，函数仍然会返回一个值：`undefined`（除非你将函数用构造函数，在这种情况下它会返回一个对象）。\n\n你可能认为 `return` 总是是函数体中的最后一个语句，但并非如此。你可以使用\
  \ `return` 提前退出函数。创建一个新文件并添加下面的代码，我们就可以看到它是如何工作的：\n\n![](img/Image00158.jpg) 输入代码：\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title> Functions </title>\n<meta charset=\"\
  utf-8\">\n<script>\nfunction getWeather(temp) {\n  if (temp >= 80) {\n    return\
  \ \"It's hot!\";\n  } else if (temp >= 50 && temp < 80) { \n    return \"It's nice!\"\
  ; \n    console.log(\"test\");\n  } else {\n    return \"It's cold!\";\n  }\n}\n\
  var returnValue = getWeather(71);\nconsole.log(returnValue);\n</script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 将其保存到你的 `/AdvJS` 文件夹并命名为\
  \ `functions6.html`，然后 ![](img/Image00021.jpg) 。在控制台中，你看到消息 \"It's nice\"，但你看不到消息\
  \ \"test\"。我们从 `getWeather()` 函数返回了一个字符串，然后在控制台中显示了该值。因此 `returnValue` 持有了从函数返回的值。注意，我们现在函数中有三个\
  \ `return` 语句。一旦执行了其中任何一个，函数就会返回，因此 `return` 语句之后的任何代码都会被忽略。当我们返回字符串 \"It's nice\"\
  \ 时，函数执行停止，所以我们永远不会在控制台中看到 \"test\" 消息。\n\n当你从函数返回一个值时，请仔细编写你的 `return` 语句。按照所示稍微修改你的代码：\n\
  \n![](img/Image00159.jpg) 输入代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>\
  \ Functions </title>\n<meta charset=\"utf-8\">\n<script>\nfunction getWeather(temp)\
  \ {\n  if (temp >= 80) {\n    return \"It's hot!\";\n  } else if (temp >= 50 &&\
  \ temp < 80) { \n    return \"It's nice!\";\n    return\n    \"It's nice!\"; \n\
  \    console.log(\"test\");\n  } else {\n    return \"It's cold!\";\n  }\n}\nvar\
  \ returnValue = getWeather(71);\nconsole.log(returnValue);\n</script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)\
  \ 。现在你在控制台中看到的只有 `undefined`；你没有看到消息 \"It's nice!\"。\n\n通常情况下，你可以在 JavaScript 程序中添加空格而不影响程序的执行方式，但在这种情况下，函数不再不再按照我们预期的方式工作了。\n\
  \n这是一个“自动分号插入”（automatic semicolon insertion）的例子，它是人们过去在不使用分号编写 JavaScript 时的遗留。JavaScript\
  \ 读取上述代码如下：\n\n![](img/Image00043.jpg) 观察：\n\n```javascript\nreturn ;\n\"It's nice!\"\
  ;\n```\n\nJavaScript 认为你忘记在 `return` 语句结束加上分号，所以它“体贴地”为你插入了一些分号，并在过程中破坏了你的代码。并没有报错，因为\
  \ \"It's nice\" 是一个有效的表达式和语句（它虽然没做什么，但它是完全有效的）。因此，你的函数在遇到 `return;` 语句时返回；因为你没有返回任何值，所以从函数返回的值是\
  \ `undefined`。语句 \"It's nice\"; 永远不会被执行（即使执行了，作为一个独立语句，也不会产生任何可见的结果）。\n\n`return`\
  \ 语句并不是 JavaScript 执行自动分号插入的唯一情况，但它是[错误的常见原因，所以请注意！你可以在](http://www.ecma-international.org/ecma-262/5.1)中阅读更多关于自动分号插入的内容。\n\
  \n## Scope\n\n要真正理解函数以及整个 JavaScript，你需要理解作用域。JavaScript 有两种作用域：全局作用域（global），意味着变量随处可见；以及局部作用域（local），意味着变量只在函数内部可见。你可能是在浏览器中使用\
  \ JavaScript，所以你知道全局作用域带有一个对象 `window`，它暴露了创建 Web 应用程序所需的所有浏览器相关功能。在本节中，我们将深入研究作用域；我们将从作用域的角度再次查看变量和函数的原理、JavaScript\
  \ 的作用域规则，以及如何规划代码以避免某些“陷阱”。我们还将使用 Chrome 开发者工具来检查函数调用栈，并亲眼观察作用域的运作。让我们开始吧！\n\n###\
  \ Variable Scope\n\n我们将从全局作用域开始。以下是创建全局变量的三种方法：\n\n![](img/Image0044.jpg) 输入代码：\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title> Global Scope </title>\n<meta\
  \ charset=\"utf-8\">\n<script>\nvar globalScope1 = \"Global\";\n//\n          不使用\
  \ var 来定义新变量是不良习惯！\nglobalScope2 = \"Global\";\n\nfunction f() {\nglobalScope3 =\
  \ \"Global\";\n}\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg)\
  \ 将其保存到你的 `/AdvJS` 文件夹并命名为 `globalScope.html`，然后 ![](img/Image00021.jpg) 。打开控制台，查看哪些变量是全局定义的：\n\
  \n![](img/Image0089.jpg) 交互会话：\n\nglobalScope1\n\"Global\"\n\nglobalScope2\n\"Global\"\
  \n\nglobalScope3\nReferenceError: globalScope3 is not defined\n\n`globalScope1`\
  \ 和 `globalScope2` 都是全局变量，你可以在控制台中检查它们，但我们还没有调用函数 `f()`，所以 `globalScope3` 还没有创建。调用\
  \ `f()` 然后再次检查：\n\n![](img/Image00060.jpg) 交互会话：\n\nf()\nundefined\n\nglobalScope3\n\
  \"Global\"\n\n\n\n现在，`globalScope` 被定义了，它是一个全局变量。为什么 `globalScope` 是一个全局变量呢？毕竟，我们是在函数\
  \ `f()` 内部定义它的。嗯，注意，我们没有使用 `var` 来声明这个变量。当你在函数中使用新变量而不使用 `var` 关键字时，JavaScript 会自动为你创建一个新的全局变量。如果你没有预料到这一点，这可能会产生问题！例如，如果你使用相同的名称并忘记写\
  \ `var`，你可能会意外覆盖现有全局变量的值。因此，避免在函数内部使用新变量名创建全局变量。通常情况下，无论全局变量还是局部变量，请始终使用 `var` 声明。\n\
  \n`global scope`（全局作用域）一词描述了变量的可见性。全局变量在 JavaScript 代码的任何地方都是可见，如果你加载了外部脚本，它们在外部文件中也是可见。因此，聪明的\
  \ JavaScript 程序员会在绝对必要的情况下才会使用全局变量。\n\n全局变量被添加到 `global object`（全局对象）中，在所有当前浏览器中它都是\
  \ `window` 对象。在控制台中输入 `window`：\n\n![](img/Image00067.jpg)\n\n交互式演示：\n```\nwindow\n\
  Window {top: Window, window: Window, location: Location, external: Object, chrome:\
  \ Object}\n```\n\n你看到了窗口对象及其许多方法和属性。在 Chrome、Safari 和 Firefox 中，如果你点击控制台中对象旁边的箭头，你会看到一些熟悉的方法和属性。向下滚动到以小字母\
  \ \"g\" 开头的属性，寻找你在上方代码中定义的全局变量。你在那里看到了所有三个属性。向上滚动回到 \"f\" 部分，你会看到我们定义的函数 `f()`。\n\
  \n每当你定义一个全局变量时，它都会作为一个属性被添加到 `global object` 中。\n\n当你使用全局变量或方法时，无论是你自己定义的（如我们上面创建的全局变量），还是\
  \ `global object` 的属性（如 `alert()`、`console.log()` 或 `document` 文档对象），都不需要指定 `window.alert()`\
  \ 或 `window.globalScope1`；你只需要输入名称即可，例如 `alert()` 或 `globalScope1`。全局对象是所有变量的默认作用域。\n\
  \n### Image00060.jpg\n\n交互式演示：\n```\nwindow.globalScope1\n\"Global\"\nglobalScope1\n\
  \"Global\"\n```\n\n两种方式都有效，所以我们通常直接省略 \"window\" 部分。\n\n## 函数作用域 (Function Scope)\n\
  \nJavaScript 中的另一种作用域是 `local scope`（局部作用域）。每当你调用一个函数时，就会创建一个 `local scope`：\n\n\
  ![](img/Image00160.jpg) 需要输入的代码：\n```html\n<!doctype html>\n<html>\n<head>\n<title>\
  \ Local Scope </title>\n<meta charset=\"utf-8\">\n<script>\nvar message = \"Loading...\"\
  ;\nwindow.onload = function() {\nvar message = \"Done loading\";\nvar div = document.getElementById(\"\
  container\"); div.innerHTML = message;\n}\n</script>\n</head>\n<body>\n<div id=\"\
  container\"></</div>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 将此文件保存到你的\
  \ `/AdvJS` 文件夹中，并命名为 `localScope.html`，然后 ![](img/Image00021.jpg)。你在网页上看到了 \"Done\
  \ loading\" 的消息。打开控制台并尝试访问这些变量：\n\n![](img/Image00060.jpg)\n\n交互式演示：\n```\nmessage\
  \ \"Loading...\"\ndiv\nReferenceError: div is not defined\n```\n\n我们可以访问全局定义的变量\
  \ `message`，但无法访问局部定义的变量 `message` 和 `div`。此外，我们有两个同名的变量。在（匿名）函数内部定义的 message 是局部变量，而在函数上方定义的\
  \ message 是全局变量。同样地，变量 `div` 也是一个局部变量。\n\n在函数内部，我们将 `div` 对象的 `innerHTML` 属性设置为局部\
  \ `message` 变量的值（即在函数内部定义的那个），因为局部 `message` 变量遮蔽（shadows）了全局的 `message` 变量。如果你在函数中使用与全局变量同名的局部变量，那么在函数内部引用它时将使用该局部变量。\n\
  \n参数也具有局部作用域。让我们修改一下代码，看看它是如何工作的：\n\n![](img/Image00161.jpg) 需要输入的代码：\n```javascript\n\
  var message = \"Loading...\";\nwindow.onload = function() {\nvar message = \"Done\
  \ loading\";\nvar div = document.getElementById(\"container\"); div.innerHTML =\
  \ message;\nupdateMessage(message);\n}\nfunction updateMessage(msg) {\nconsole.log(message);\n\
  console.log(msg);\nvar div = document.getElementById(\"container\"); div.innerHTML\
  \ = msg;\n}\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00036.jpg)。在控制台中，你看到了两条消息：\n\
  \n![](img/Image00043.jpg) 观察：\n```\nLoading...\nDone loading\n```\n\n第一个参数来自 `console.log(message)`\
  \ 这一行。显示的是全局变量 `message` 的值，而不是 `window.onload` 函数中定义的值，尽管我们是从该函数中调用 `updateMessage()`\
  \ 的。此外，我们从该函数将局部变量 `message` 的值传递给 `updateMessage()`，但将其作为参数赋予了一个新名 `msg`。记住，当你调用函数并传递参数时，函数的参数会获得该参数值的副本，因此\
  \ `msg` 得到了字符串 \"Done loading\" 的副本。这就是你在控制台中看到的第二条消息，也是你在网页的 `<div>` 中看到的消息。\n\n\
  `msg` 是一个局部变量；对于函数 `updateMessage()` 是局部的。尝试在控制台中显示 `msg` 的值：\n\n![](img/Image00049.jpg)\n\
  \n交互式演示：\n```\nmsg\nReferenceError: msg is not defined\n```\n\n你无法在定义它的函数外部访问局部变量。\n\
  \n你可能对变量遮蔽（variable shadowing）的工作原理感到好奇。是否存在一个存放所有全局变量的全局对象，是否也有一个用于局部变量的局部对象？我们稍后讨论作用域链时回到这些话题。\n\
  \n## 变量提升 (Hoisting)\n\n我们已经讨论了 JavaScript 拥有的两种作用域：全局和局部。让我们仔细观察 `local scope`，因为有时局部作用域的行为可能不乎你的意料，特别是当函数中有代码块，并且你在这些块中定义了新变量时。我们所说的“块”（block）指的是循环或\
  \ if 语句，其中“块”由循环或 if 语句体内的所有语句组成（括号 {} 之间的所有内容）：\n\n![](img/Image00162.jpg) 需要输入的代码：\n\
  ```html\n<!doctype html>\n<html>\n<head>\n<title> Hoisting </title>\n<meta charset=\"\
  utf-8\">\n<script>\nvar icecream = [\"vanilla\", \"chocolate\", \"strawberry\"];\
  \ function init() {\nvar flavorButton = document.getElementById(\"getFlavorButton\"\
  ); flavorButton.onclick = checkFlavor;\n}\n\nfunction checkFlavor() {\nconsole.log(flavor);\n\
  if (icecream.length > 0) {\nvar div = document.getElementById(\"container\");\n\
  var flavor = document.getElementById(\"flavor\").value; if (flavor) {\nfor (var\
  \ i = 0; i < icecream.length; i++) {\nif (icecream[i] == flavor) {\nvar found =\
  \ true;\ndiv.innerHTML = \"We have \" + flavor;\nbreak;\n}\n}\n}\n}\nif (!found)\
  \ {\ndiv.innerHTML = \"Sorry, we don't have \" + flavor;\n}\n}\n}\nconsole.log(flavor);\n\
  }\nwindow.onload = init;\n</script>\n</head>\n<body>\n<div id=\"container\">Enter\
  \ a flavor of ice cream you'd like: </div> <form>\n<input type=\"text\" id=\"flavor\"\
  >\n<input type=\"button\" id=\"getFlavorButton\" value=\"Check flavor\"> </form>\n\
  </body>\n</html>\n```\n\n![](img/Image0042.jpg) 将此文件保存到你的 `/AdvJS` 文件夹中，并命名为 `hoisting.html`，然后\
  \ ![](img/Image00021.jpg)。你看到了一个要求输入冰淇淋口味的消息、一个输入口味的表单输入以及一个提交表单的按钮。\n\n在提交表单之前，仔细观察代码并确保你理解它是如何工作的：\n\
  \n![](img/Image00163.jpg) 观察：\n```javascript\nvar icecream = [\"vanilla\", \"chocolate\"\
  , \"strawberry\"]; function init() {\nvar flavorButton = document.getElementById(\"\
  getFlavorButton\"); flavorButton.onclick = checkFlavor ;\n}\n\nfunction checkFlavor()\
  \ {\nconsole.log(flavor);\nif (icecream.length > 0) {\nvar div = document.getElementById(\"\
  container\");\n```\n\n\n\n\n```javascript\nvar flavor = document.getElementById(\"\
  flavor\").value; if (flavor) {\n  for (var i = 0; i < icecream.length; i++) {\n\
  \    if (icecream[i] == flavor) {\n      var found = true;\n      div.innerHTML\
  \ = \"We have \" + flavor;\n      break;\n    }\n  }\n  if (!found) {\n    div.innerHTML\
  \ = \"Sorry, we don't have \" + flavor;\n  }\n  }\n}\nconsole.log(flavor);\n```\n\
  \n我们为表单设置了一个点击处理器，当你点击按钮时，它会调用 `checkFlavor()` 函数。在 `checkFlavor()` 函数中，我们使用了一个名为\
  \ `flavor` 的变量来存储你输入表单的值。看看该变量在函数中的定义位置；我们在 `console` 中两次显示了它的值：一次在函数的顶部，在 `flavor`\
  \ 变量定义之前；另一次在函数的末尾，紧在函数结束之前，并且在定义 `flavor` 的 `if` 块之外。\n\n你认为当你输入一个冰淇淋口味并点击按钮运行这段代码时，会在\
  \ `console` 中看到什么？\n\n好了，确保你的 `console` 已经打开，并输入 \"vanilla\"。你在页面上看到了 \"We have\
  \ vanilla\" 的消息。检查 `console` 中显示的值。\n\n![](img/Image00043.jpg)\n\n观察：\n\nundefined\n\
  vanilla\n\n第一个 `console.log(flavor)` 显示 `undefined`，而第二个 `console.log(flavor)` 显示\
  \ `vanilla`。\n\n你可能预预期第一个 `console.log(flavor)` 调用会产生错误，因为 `flavor` 变量还没有被定义，而且通常当你尝试访问一个未定义的变量时，会得到一个\
  \ `Reference Error`（引用错误）。（如果你需要复习 `Reference Error`，只需返回 `console` 并输入一个此程序未定义的变量名，比如\
  \ `x`。）\n\n为什么在我们尝试在定义 `flavor` 之前或者在包含 `flavor` 定义的块结束之后尝试访问 `flavor` 时，我们没有得到\
  \ `Reference Error` 呢？答案是：`hoisting`（变量提升）。`hoisting` 是 JavaScript 中一种奇怪行为的非正式名称：无论你在函数内部何时定义变量，变量声明都会移动（或“提升”）到函数的顶部。再读一遍。注意，移动的只有声明；而不是初始化。所以，这就好像你是这样写\
  \ `checkFlavor()` 函数一样：\n\n![](img/Image00115.jpg) 观察：\n\n```javascript\nfunction\
  \ checkFlavor() {\n  var flavor;\n  console.log(flavor);\n  if (icecream.length\
  \ > 0) {\n    var div = document.getElementById(\"container\");\n    var flavor\
  \ = document.getElementById(\"flavor\").value; if (flavor) {\n      for (var i =\
  \ 0; i < icecream.length; i++) {\n        if (icecream[i] == flavor) {\n       \
  \   var found = true;\n          div.innerHTML = \"We have \" + flavor;\n      \
  \    break;\n        }\n      }\n      if (!found) {\n        div.innerHTML = \"\
  Sorry, we don't have \" + flavor;\n      }\n    }\n  }\n  console.log(flavor);\n\
  }\n```\n\n当我们在第一个 `console.log(flavor)` 中访问它时，`flavor` 被定义了。它被定义了但没有被初始化，所以 `flavor`\
  \ 的值是 `undefined`。这就是为什么你看到第一个 `console.log(flavor)` 的结果是 `undefined`。然后，我们将它的值设置为你输入表单的值，并且当我们到达第二个\
  \ `console.log(flavor)` 时，它保持为该值。\n\n`hoisting` 发生在 `checkFlavor()` 中的所有局部变量上。你能找到函数中其他被提升的变量吗？\n\
  \n如果你有其他语言（比如 `Java` 或 `C#`）的经验，这种 `hoisting` 行为可能会让你感到惊讶，因为许多语言有第三种作用域：`block scope`（块作用域）。在\
  \ `block scope` 中，像 `flavor` 这样的变量只会在声明和初始化的块内被定义，而不在该块之外。在这种情况下，如果你在两个 `console.log(flavor)`\
  \ 语句中尝试访问 `flavor`，你将得到 `reference error`。然而，JavaScript 并没有 `block scope`。它只有 `global\
  \ scope`（全局作用域）和 `local scope`（局部作用域）。所有的局部变量在函数内部任何地方都是可见的，即使它们是在块内被定义和初始化的。\n\n\
  ![](img/Image00034.jpg)\n\n| Note | 截至本文写作，JavaScript 还没有块作用域，但以后可能会被添加。 |\n|  |\n\
  \n![](img/Image00018.jpg)\n\n## 嵌套函数\n\n有时在 JavaScript 中，我们将函数嵌套在其他函数内部。通常这些是“辅助”函数，只由嵌套它们的函数使用。让我们来看一个例子，然后谈谈嵌套函数的作用域是如何工作的。\n\
  \n![](img/Image00164.jpg) 需要输入的代码：\n\n```html\n<!doctype html>\n<html\n<head>\n\
  <title> Nested Functions </title>\n<meta charset=\"utf-8\">\n<style>\n.red {\nbackground-color:\
  \ red;\n}\n.blue {\nbackground-color: lightblue;\n}\n.pink {\nbackground-color:\
  \ pink;\n}\n</style>\n<script>\nwindow.onload = function() {\n  var theId = \"list\"\
  ;\n  findElement(theId);\n}\nfunction findElement(id) {\n  var color = \"red\";\n\
  \  var el = document.getElementById(id);\n  if (el) {\n    changeAllBlueChildren(el);\n\
  \  }\nfunction changeAllBlueChildren(el) {\n  for (var i = 0; i < el.childElementCount;\
  \ i++) { var child = el.children[i];\n    if (child.tagName.toLowerCase() == \"\
  li\") {\n      var theClass = child.getAttribute(\"class\");\n      if (theClass\
  \ == \"blue\") {\n        child.setAttribute(\"class\", color);\n      }\n    }\n\
  \  }\n}\n}\n}\n}\n</script>\n</head>\n<body>\n<ul id=\"list\">\n<li class=\"red\"\
  >I'm already red</li>\n<li class=\"blue\">I'm blue</li>\n<li class=\"blue\">I'm\
  \ blue too</li>\n<li class=\"pink\">And I'm pink</li>\n</ul>\n</body>\n</html>\n\
  ```\n\n![](img/Image00042.jpg) 将此保存到你的 `/AdvJS` 文件夹中命名为 `nested.html`，并 ![](img/Image00021.jpg)\
  \ 。列表中的前三项是红色的，最后一个是粉色的。在 HTML 和 CSS 中，第二和第三项属于 \"blue\" 类，所以通常这些项的背景应该是 \"lightblue\"\
  ，但我们使用代码更改了它。\n\n![](img/Image00165.jpg)\n\n在代码中，你还可以看到我们有一个 `window.onload` 函数，它在页面加载时被调用；该函数调用\
  \ `findElement()`，该函数找到 ID 为 \"list\" 的元素，并调用 `changeAllBlueChildren()`。`changeAllBlueChildren()`\
  \ 遍历列表的所有子元素（所有的 `<li>` 元素），如果元素的类是 \"blue\"，`changeAllBlueChildren()` 就会将类更改为 \"\
  red\"。\n\n![](img/Image00166.jpg)\n\n观察：\n\n```javascript\nfunction findElement(id)\
  \ {\n  var color = \"red\";\n  var el = document.getElementById(id);\n  if (el)\
  \ {\n    changeAllBlueChildren(el);\n  }\nfunction changeAllBlueChildren(el) {\n\
  \  for (var i = 0; i < el.childElementCount; i++) { var child = el.children[i];\n\
  \    if (child.tagName.toLowerCase() == \"li\") {\n      var theClass = child.getAttribute(\"\
  class\");\n      if (theClass == \"blue\") {\n        child.setAttribute(\"class\"\
  , color);\n      }\n    }\n  }\n}\n}\n```\n\n在这里我们正在探索嵌套函数。`findElement()` 函数内部有一个嵌套函数：一个定义在函数内部的函数。与\
  \ `findElement()` 和 `window.onload` 等全局函数不同，`changeAllBlueChildren()` 是局部函数，只在 `findElement()`\
  \ 内部可见。如果你尝试在 `console` 中访问该函数（或尝试从 `findElement()` 外部调用它），你将得到引用错误：\n\n![](img/Image00049.jpg)\n\
  \n交互环节：\n\nchangeAllBlueChildren\n\nReferenceError: changeAllBlueChildren is not\
  \ defined\n\n本质上，`changeAllBlueChildren()` 在 `findElement()` 之外是隐藏的（我们将在课程后面的部分回到数据隐藏的概念）。\n\
  \n我们使用函数声明来声明 `changeAllBlueChildren()` 函数。如果我们将代码改为使用函数表达式来声明函数，会发生什么？\n\n![](img/Image00167.jpg)\n\
  \n需要输入的代码：\n\n```javascript\nfunction changeAllBlueChildren(el) {\n  var changeAllBlueChildren\
  \ = function(el) {\n    ...\n  }\n}\n```\n\n![](img/Image00087.jpg) 和 ![](img/Image00036.jpg)\
  \ .\n\n![](img/Image0076.jpg)\n\n观察：\n\n> Uncaught TypeError: undefined is not a\
  \ function\n\n\n\n\n\n与函数中的其他局部变量一样，`changeAllBlueChildren` 变量也会被提升（hoisted）。因此，现在\
  \ `changeAllBlueChildren` 在函数顶部被隐式声明，但值是 `undefined`（就像所有其他局部变量一样）。由于我们在调用函数之后才将函数表达式赋值给该变量，这会导致一个错误。我们试图在\
  \ `changeAllBlueChildren` 仍然是 `undefined` 且在未赋值函数表达式之前调用该变量。\n\n请继续将你的代码改回使用函数声明（function\
  \ declaration）。函数声明同样是在在我们调用函数之后定义的，但与使用函数表达式定义的函数不同，嵌套的函数声明在它所嵌套的整个函数范围内都是可见的。这与在全局范围内声明的函数的工作方式相似：你可以将它们放在代码的底部，但在代码的任何地方访问它们。在这里，我们将\
  \ `changeAllBlueChildren` 函数声明放置在 `findElement()` 函数的底部，但现在（使用函数声明而不是函数表达式），它在整个\
  \ `findElement()` 函数中都是可见的（并且已定义！）。\n\n### 词法作用域 (Lexical Scoping)\n\n现在让我们来看看当存在嵌套函数时，变量的作用域会发生什么变化。记得我们之前说过局部变量在定义变量的整个函数范围内都是可见的。让我们来看看这个程序中的变量在哪些地方是的。\n\
  \n![](img/Image00168.jpg)\n\n观察：\n\n```javascript\nwindow.onload = function() {\n\
  \  var theId = \"list\";\n  findElement( theId );\n}\n\nfunction findElement( id\
  \ ) {\n  var color = \"red\";\n  var el = document.getElementById( id );\n  if (\
  \ el ) {\n    changeAllBlueChildren( el );\n  }\n\n  function changeAllBlueChildren(\
  \ el ) {\n    for (var i = 0; i < el .childElementCount; i++) {\n      var child\
  \ = el .children[i];\n      if (child.tagName.toLowerCase() == \"li\") {\n     \
  \   var theClass = child.getAttribute(\"class\");\n        if (theClass == \"blue\"\
  ) {\n          child.setAttribute(\"class\", color );\n        }\n      }\n    }\n\
  \  }\n}\n```\n\n我们从 `theId` 开始。这个变量定义在 `window.onload` 或 `findElement()` 中。然而，我们将它传递给了\
  \ `findElement()` 函数，该函数不是全局可见的，因此它在参数变量 `id` 中获得了一个值的副本。`id` 是 `findElement()`\
  \ 的局部变量，因此我们可以在该函数的任何地方访问它，但同样，在全局不可访问。同样，`color` 和 `el` 是局部变量，在 `findElement()`\
  \ 的任何地方都是可见的。\n\n接下来，看 `changeAllBlueChildren()`。我们有一个参数 `el` 以及几个局部变量，包括 `i`、`child`\
  \ 和 `theClass`，它们都是 `changeAllBlueChildren()` 的局部变量。\n\n这里发生着一些有趣的事情。我们在 `changeAllBlueChildren()`\
  \ 内部使用了变量 `color`，尽管 `color` 在 `changeAllBlueChildren()` 中并没有定义，它也不是全局变量。之所以可能，是因为\
  \ `changeAllBlueChildren()` 嵌套在 `findElement()` 内部，`color` 在嵌套函数内部是可见的，所以我们可以像它是\
  \ `changeAllBlueChildren()` 的局部（或全局）变量一样访问它。这被称为**词法作用域**（lexical scoping）。这意味着，当你使用变量（如\
  \ `color`）时，你首先在局部作用域（即 `changeAllBlueChildren()`）中查找变量的值，然后在下一个外层作用域中查找。通常，下一个外层作用域是全局作用域，但在这种情况下，由于\
  \ `changeAllBlueChildren()` 嵌套在另一个函数内部，下一个外层作用域是 `findElement()`。`color` 定义在那里，所以这就是我们在\
  \ `changeAllBlueChildren()` 中使用的值。\n\n看看 `el`。我们有一个参数 `el`，它是 `changeAllBlueChildren()`\
  \ 的局部变量；我们在 `findElement()` 中也有变量 `el`，它在整个 `findElement()` 范围内都是可见的，包括 `changeAllBlueChildren()`\
  \ 内部！那么我们使用哪个值呢？嗯，记得在 `changeAllBlueChildren()` 内部定义的 `el` 会屏蔽 `findElement()` 中的\
  \ `el`。为什么？因为词法作用域。当我们在 `changeAllBlueChildren()` 中使用 `el` 时，首先在局部作用域中查找，并在那里找到了它的值，所以我们使用那一个。\n\
  \n如果你在局部作用域内完全没有找到变量，那么就在全局作用域中查找。如果那里也没有，就会得到一个引用错误（Reference Error）。\n\n![](img/Image00169.jpg)\n\
  \n好了，我们讨论了函数如何组织代码片段。这正是我们在这里所做的。我们将所有与将元素的蓝色子改为红色相关的代码都放在这个函数中，这使得代码更容易阅读和理解，同时也创建了一块易于重用的代码块。在这种情况下，我们只调用了一次\
  \ `changeAllBlueChildren()`，但你可以想象我们最终可能会调用它多次。通过将函数嵌套在 `findElement()` 内部，我们使其对不需要知道它的其他代码隐藏起来，并组织我们的代码，使相关部分在一起。如果我们想在代码的其他地方使用\
  \ `changeAllBlueChildren()`，我们就必须把它从 `findElement()` 中移动出来，以便其他代码可以调用它。\n\n嵌套函数也有缺点：像\
  \ `changeAllBlueChildren()` 这样的嵌套函数在每次调用它所嵌套的函数时都必须重新创建，而在全局级别定义的函数只创建一次，并在程序运行期间一直存在。在我们的情况下，这是没问题的；我们只调用了一次\
  \ `findElement()`，所以我们只创建了一次 `changeAllBlueChildren()`。在中小型程序中，你可能会发现嵌套函数的组织益处大于对性能的影响。然而，如果你正在构建一个需要尽可能快速应用程序，你将希望避免嵌套函数。\n\
  \n### 作用域链 (Scope Chains)\n\n你知道 JavaScript 有两种作用域：全局和局部。你还知道作用域是按“词法”工作的。当你想要解析变量（即在使用它时确定它的值是什么）时，首先查看你所处函数的局部作用域，如果没找到，就查看外层作用域，依此类推，直到到达全局作用域。如果你在这些地方都没有找到该变量，就会得到一个错误。\n\
  \n作用域在背后的工作方式是通过作用域链实现的。作用域链分两个阶段创建：第一阶段是函数定义时，第二阶段是函数执行时。当你定义函数时，会创建初始的作用域链。你可以将作用域链视为从函数指向定义时周围函数的作用域的指针列表。这些作用域是有序的，所以链顶的作用域（第一个位置）是紧邻函数的作用域（通常是全局作用域，除非函数是嵌套的），后续的作用域更远（如上一个图中的层）。\n\
  \n在第二个阶段，当函数执行时，会创建一个激活对象（activation object）。该对象代表函数执行时的状态，因此它包含了所有局部变量以及 `this`（通常是全局对象\
  \ `window`）。激活对象被添加到作用域链的顶部（第一个位置）。当函数执行并遇到一个变量且需要解析该变量以确定其值时，函数从作用域链的第一个位置开始，即激活对象。如果函数在该处找到了该变量（即该变量是函数的局部变量），它就会停在那里并使用该值。如果函数在该处没有找到变量，它将查找作用域链中的下一个位置，依此类推。函数继续沿链向下，直到找到包含该变量的作用域。如果它到达了末尾（全局作用域始终是链的最后一个站点）还没有找到该变量，我们就会得到一个引用错误。\n\
  \n\n\n\n\n让我们来看这个特定示例中函数的作用域链。`window.onload` 函数定义在顶层，因此它的定义时作用域链是全局对象。当 `window.onload`\
  \ 被调用（由浏览器在页面加载时调用）时，一个激活对象（activation object）会被添加到作用域链的顶部。因此，当我们查找变量 `theId` 的值时，我们在激活对象中找到了它，不需要继续向链的下方查找。\n\
  \n![](img/Image00170.jpg)\n\n同样，`findElement()` 是在全局定义的，因此在定义时，全局对象被添加到作用域链中；而在执行时——当我们调用该函数时——激活对象被添加到链中。我们首先在这些处查找函数中使用的变量值，如\
  \ `id` 和 `el` 以及 `document`。\n\n`document` 未在激活对象中定义，因此我们在全局对象中查找并在那里找到了 `document`。\n\
  \n![](img/Image00171.jpg)\n\n当我们调用 `findElement()` 时，定义了 `changeAllBlueChildren()`。在定义时，我们在链中多了一个额外的作用域对象：`findElement()`\
  \ 的作用域对象。因为 `changeAllBlueChildren()` 是定义在 `findElement()` 函数内部的，所以它定义在 `findElement()`\
  \ 函数的作用域内。额外的作用域对象包含了从嵌套函数引用的任何变量。在这种情况下，它只是 `color` 变量。当我们调用 `changeAllBlueChildren()`\
  \ 时，它的激活对象被添加到链中。当我们查找变量 `color` 时，首先在激活对象中查找，但由于在其中没有找到，我们会在 `findElement()` 作用域中查找，找到后停止查找。\n\
  \n![](img/Image00172.jpg)\n\n## 检查作用域链\n\n你可以使用 Chrome 开发者工具在代码运行时查看作用域链的运行情况。确保你已将\
  \ `nested.html` 文件加载到浏览器页面，并在 Chrome 浏览器中打开控制台窗口（遗憾的是，其他浏览器的内置工具尚未提供相同的功能，因此你需要\
  \ Chrome 来进行操作）。\n\n点击 `Sources`（源）标签页。如果你在控制台左侧面板没有看到任何内容，点击控制台左上角的向右 `Show Navigator`（显示导航器）箭头并选择你的文件\
  \ `nested.html`。执行后，你就能看到文件的源代码：\n\n![](img/Image00173.jpg)\n\n在右侧面板中，确保你打开了 `Call\
  \ Stack`（调用栈）、`Scope Variables`（作用域变量）和 `Breakpoints`（断点）部分（它们旁边的箭头指向下方）。\n\n现在，为你的代码添加断点。断点是告诉浏览器在某一点停止执行代码的方法。你可以通过点击左侧面板最左侧的任意行号来添加断点。当你添加断点时，你会看到一个小小的蓝色标记，指示断点所在的代码行。添加三个断点：一个在\
  \ `window.onload` 中调用 `findElement()` 的那行上；一个在 `findElement()` 中调用 `changeAllBlueChildren()`\
  \ 的那行上；一个在 `changeAllBlueChildren()` 的最底部（函数的结束大括号，即文件中的倒数第二个大括号）。查看右侧面板中的 `Breakpoints`\
  \ 下，以验证你是否点击了正确的行。\n\n![](img/Image00174.jpg)\n\n现在，刷新页面。不要担心，你的断点会留在原处。当你刷新时，你会发现在网页顶部显示了“Paused\
  \ in debugger”（已在调试器中暂停）的消息，并且第一个断点处的代码行被高亮显示，这表示执行已在该行暂停：\n\n![](img/Image00175.jpg)\n\
  \n在右侧面板的 `Call Stack` 部分，你看到了 `window.onload`。这是因为我们调用了 `window.onload`，并且在调用 `findElement()`\
  \ 之前暂停了执行。现在，看 `Scope Variables` 部分。这就是作用域链。链的顶部是局部作用域；你可以看到在那里定义的局部变量，包括 `theId`\
  \ 和 `this`。接下来你看到全局作用域，以及它所有的通常内容（你可以打开它查看，但它包含很多属性，完成后务必关闭它）。\n\n现在，我们想要继续执行代码，直到遇到下一个断点。点击右面板左上角像“播放”按钮的小按钮（`Resume\
  \ script execution`，恢复脚本执行）。当你点击此按钮时，执行将恢复，直到遇到位于调用 `changeAllBlueChildren()` 那一行的下一个断点：\n\
  \n![](img/Image00176.jpg)\n\n执行再次在调用函数之前停止，因此我们可以检查调用栈和作用域变量。注意右侧面板中 `Call Stack`\
  \ 下，现在 `findElement()` 位于顶部，`window.onload` 在下方。这意味着我们从 `window.onload` 调用了 `findElement()`。现在看\
  \ `Scope Variables`。作用域链的顶部部分包含了由 `findElement()` 定义的局部变量。下方是全局作用域。在继续之前，注意列表中的第二和第三项仍然是蓝色的，因为我们还没有调用\
  \ `changeAllBlueChildren()`！\n\n点击 `Resume script execution` 按钮继续代码执行。现在执行停止在 `changeAllBlueChildren()`\
  \ 函数的最后一行——在大括号处，就在该函数返回之前的一刻。\n\n![](img/Image00177.jpg)\n\n现在，列表中的第二和第三项是红色的。注意\
  \ `Call Stack`；你可以看到 `changeAllBlueChildren()` 在顶部。我们从 `findElement()` 调用了 `changeAllBlueChildren()`，而我们从\
  \ `window.onload` 调用了 `findElement()`（调用栈对于追踪哪些函数调用了哪些函数非常！）。\n\n查看 `Scope Variables`。你看到作用域链顶部\
  \ `changeAllBlueChildren()` 函数的局部变量。下方是一个被称为 `Closure`（闭包）的东西。这是 `findElement()`\
  \ 作用域的作用域链对象，包含了 `color` 变量。点击 `Closure` 旁边的箭头（使其指向下方），你就可以看到它。（我们将在另一课程中解释为什么它被称为闭包）。然后，作用域链的底部是全局作用域。\n\
  \n再次点击 `Resume script execution` 以继续执行并完成代码执行。页面恢复正常。你的断点仍在那里（在删除它们之前它们会一直留在那里），如果你想再次这样做，只需刷新页面并按照相同的步骤操作。要移除断点，点击蓝色标记，它们就会消失。一旦删除了断点，如果你刷新页面，页面将像通常一样运行，一直执行代码而没有任何停止。\n\
  \n在本节中，你学习了关于作用域的所有知识，包括它如何与作用域链工作的细节。嵌套函数（有时被称为“内部函数”）在作用域链中创建了额外的层，因此我们探索了如何创建嵌套函数以及在使用嵌套函数时作用域是如何工作的。词法作用域是一种规则，允许我们通过查看作用域链的每一层（从顶部（第一个位置）到底部（始终是全局作用域））找到要使用的变量正确值。\n\
  \n## 调用函数\n\n![](img/Image00005.jpg)\n\n### 课程目标\n\n当你完成本节后，你将能够：\n\n* 像函数一样调用函数。\n\
  ![](img/Image00006.jpg)\n* 像方法一样调用函数。\n![](img/Image00006.jpg)\n* 像构造函数一样调用函数。\n\
  ![](img/Image00006.jpg)\n* 使用 `apply()` 和 `call()` 调用函数。\n![](img/Image00006.jpg)\n\
  * 在不同方式调用函数时使用 `this`。\n![](img/Image00006.jpg)\n* 比较嵌套函数中 `this` 的定义与全局函数中的定义。\n\
  ![](img/Image00006.jpg)\n* 使用 `apply()` 和 `call()` 控制 `this` 的定义。\n![](img/Image00006.jpg)\n\
  * 使用 `arguments` 对象创建支持数量参数的函数。\n![](img/Image00005.jpg) ![](img/Image00006.jpg)\n\
  \n## 调用函数\n\n\n\n\n\n在 JavaScript 中，我们通过许多不同的方式来调用（call）或函数（invoke）。我们调用内置函数、创建并调用自己的函数、将函数作为构造函数、调用对象中的方法等等。在本节中，我们将查看调用函数的所有不同方式以及我们使用每种方式的原因。\n\
  \n![](img/Image00178.jpg)\n\n**注意**：`Invoke` 只是 `call` 的另一个表达。在整个课程中，我们将交替使用这两个术语。\n\
  \n![](img/Image00179.jpg)\n\n## 调用函数的不同方式\n\n到目前，你已经熟悉了如何在 JavaScript 中调用函数。在编写脚本时，不调用至少一个函数是很的。你可能正在调用一个内置函数，如\
  \ `alert()`，或者是你自己写的函数，或者是由 JavaScript 库（如 `jQuery`）提供的函数。让我们来看一个包含几种不同类型函数调用的示例：\n\
  \n![](img/Image00044.jpg)\n\n需要输入的代码：\n\n```html\n<!doctype html>\n<html\n<head>\n\
  <title> Calling a function </title>\n<meta charset=\"utf-8\">\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n<script>\nfunction callMeMaybe(number) {\n  return \"Call me at \" +\
  \ number;\n}\n\nwindow.onload = function() {\n  var number = callMeMaybe(\"555-1212\"\
  );\n  $(\"body\").append(\"<div>\" + number + \"</div>\");\n  alert(\"Content added\"\
  );\n}\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg)\
  \ 将此文件保存到你的 `/AdvJS` 文件夹中命名为 `functionCalls.html`，并 ![](img/Image00085.jpg)。你在页面上看到“Call\
  \ me at 555-1212”文字，以及一个显示文本“Content added”的警告框。\n\n在这里我们看到了在 JavaScript 中调用函数的四种不同方式中的两种示例：\n\
  \n1. 作为函数调用\n![](img/Image00006.jpg)\n2. 作为方法调用\n![](img/Image00006.jpg)\n3. 作为构造函数调用（我们稍后会讲这个）\n\
  ![](img/Image00006.jpg)\n4. 使用 `apply()` 或 `call()` 调用（我们稍后也会讲这个）\n![](img/Image00006.jpg)\n\
  \n首先，我们以函数的方式创建并调用了我们自己的函数 `callMeMaybe()`（即 `callMeMaybe()` 是我们按照普通调用函数的方式调用的普通函数）。我们还调用了由\
  \ jQuery 提供的函数 `$()`（它是 `jQuery()` 函数的简写——是的，`$` 是一个有效的函数名）。同样，我们像调用函数一样调用 `$()`\
  \ 函数。\n\n调用函数的第二种方式是作为方法调用。在这个示例中有两个方法调用：`$(\"body\").append()` 和 `alert()`。`append()`\
  \ 是从 `$()` 函数返回的 `jQuery` 对象的一个方法。我们使用“点符号法”来调用它，就像调用任何其他方法一样。\n\n那么 `alert()` 呢？记得在课程早开始时，我们提到过像\
  \ `alert()` 这样的 JavaScript 内置函数实际上是全局 `window` 对象的方法，而 `window` 是浏览器中运行 JavaScript\
  \ 程序的默认对象。因为它是默认对象，如果你在调用方法和属性时没有指定它（例如我们调用 `alert()` 时），JavaScript 会认为你的意思是 `window.alert()`。所以调用\
  \ `alert()` 实际上是一个方法调用，而不是函数调用。\n\n这段代码中实际上还隐含了第三次方法调用。你能找到它吗？它是赋值给 `window.onload`\
  \ 属性的函数。我们没有自己调用这个方法；当页面加载完成后，浏览器会我们调用它。\n\n作为函数调用函数和作为方法调用方法的一个重要区别是（在大多数情况下）你需要使用点符号法来调用方法。你需要指定对象的名称（如\
  \ `window`）和方法的名称（如 `alert()`），并用点（句）将两者隔开以得到 `window.alert()`。而要调用函数，你直接使用函数名。\n\
  \n让我们来看第三种调用函数的方式：\n\n![](img/Image00180.jpg) 需要输入的代码：\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title> Calling a function as a constructor </title>\n<meta charset=\"\
  utf-8\">\n<style>\n.square {\nbackground-color: lightblue;\ncursor: pointer;\n}\n\
  .circle {\nbackground-color: orange;\ncursor: pointer;\n}\n.square, .circle p {\n\
  padding-top: 35%;\ntext-align: center;\n-webkit-user-select: none;\n-moz-user-select:\
  \ none;\n-ms-user-select: none;\n}\n</style>\n<script>\nfunction Square(id, name,\
  \ size) {\n  this.id = id;\n  this.name = name;\n  this.size = size;\n  this.display\
  \ = function() {\n    var el = document.getElementById(this.id);\n    el.style.width\
  \ = this.size + \"px\";\n    el.style.height = this.size + \"px\";\n    el.innerHTML\
  \ = \"<p>\" + this.name + \"</p>\";\n  };\n}\n\nwindow.onload = function() {\n \
  \ var square = new Square(\"s1\", \"square one\", 100);\n  square.display();\n}\n\
  </script>\n</head>\n<body>\n<div id=\"s1\" class=\"square\"></div>\n</body>\n</html>\n\
  ```\n\n![](img/Image00042.jpg) 将此文件保存到你的 `/AdvJS` 文件夹中命名为 `functionCalls.html`，并\
  \ ![](img/Image00085.jpg)。你在页面上看到“Call me at 555-1212”文字，以及一个显示文本“Content added”的警告框。\n\
  \n第四种也是最后调用函数的方式是间接调用，使用 `apply()` 和 `call()`。你还没有见过这些方法，所以我们将在该主题上花费大量时间。\n\n##\
  \ 调用函数时 `this` 发生了什么\n\n当你调用函数时，`this` 的定义规则取决于你如何调用它以及你调用它的上下文。让我们来看一些示例。我们将修改之前的\
  \ `Square` 构造函数示例来展示\n\n![](img/Image00125.jpg) 需要输入的代码：\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title> What happens to this?</title>\n<meta charset=\"utf-8\">\n\
  <style>\n.square {\nbackground-color: lightblue;\ncursor: pointer;\n}\n.circle {\n\
  background-color: orange;\ncursor: pointer;\n}\n.square, .circle p {\npadding-top:\
  \ 35%;\ntext-align: center;\n-webkit-user-select: none;\n-moz-user-select: none;\n\
  -ms-user-select: none;\n}\n</style>\n<script>\nvar n = 0;\nfunction Square(id, name,\
  \ size) {\n  console.log(\"This at the top of the Square constructor: \"); console.log(this);\n\
  \  this.id = id;\n  this.name = name;\n  this.size = size;\n  this.display = function()\
  \ {\n    console.log(\"This in the Square's display method: \"); console.log(this);\n\
  \    var el = document.getElementById(this.id);\n    el.style.width = this.size\
  \ + \"px\";\n    el.style.height = this.size + \"px\";\n    el.innerHTML = \"<p>\"\
  \ + this.name + \"</p>\";\n  };\n  console.log(\"This at the bottom of the Square\
  \ constructor: \"); console.log(this);\n}\n\nwindow.onload = function() {\n  console.log(\"\
  This in window.onload: \"); console.log(this);\n  var square = new Square(\"s1\"\
  , \"square one\", 100);\n  setupClickHandler(square);\n  square.display();\n}\n\n\
  function setupClickHandler(square) {\n  var el = document.getElementById(square.id);\n\
  \  el.onclick = function() {\n    console.log(\"This in the click handler: \");\
  \ console.log(this);\n  };\n}\n</script>\n</head>\n<body>\n<div id=\"s1\" class=\"\
  square\"></div>\n</body>\n</html>\n```\n\n\n\n\n\n```javascript\nfunction setupClickHandler(shape)\
  \ {\n  console.log(\"This in setupClickHandler: \");\n  console.log(this);\n\n \
  \ var elDiv = document.getElementById(shape.id);\n  elDiv.onclick = function() {\n\
  \    console.log(\"This in click handler: \");\n    console.log(this);\n\n    n++;\n\
  \    var counter = document.getElementById(\"counter_\" + shape.id);\n    counter.innerHTML\
  \ = \"You've clicked \" + n + \" times.\";\n  };\n}\n```\n\n</script>\n</head>\n\
  \n![](img/Image00181.jpg)\n\n<body>\n<div id=\"s1\" class=\"square\"></div>\n<p\
  \ id=\"counter_s1\"></p>\n</body>\n</html>\n\n![](img/Image00042.jpg) 将文件保存在你的 `/AdvJS`\
  \ 文件夹中，命名为 `this.html` 并 ![](img/Image00036.jpg) 。我们在几处添加了一些 `console.log()` 调用（请确保你现在找到了所有它们，因为我们下面会引用其中的每一个）。我们还添加了一个全新的函数\
  \ `setupClickHandler()`，它为 `\"s1\"` `<div>` 添加了一个点击处理程序，这样当你点击 `\"s1\"` `<div>`\
  \ 时，你将看到一条消息，指示你点击了该 `<div>` 多少次。打开控制台（如果没有看到任何输出，请刷新页面），你会看到类似这样的消息：\n\n![](img/Image00182.jpg)\n\
  \n### 观察：\n\n在 `window.onload` 中：\nWindow {top: Window, window: Window, location:\
  \ Location, external: Object, chrome: Object}\n\n在 `Square` 构造函数的顶端：`Square {}`\n\
  \n在 `Square` 构造函数的底部：\nSquare {id: \"s1\", name: \"square one\", size: 100, display:\
  \ function}\n\n在 `setupClickHandler` 中：\nWindow {top: Window, window: Window, location:\
  \ Location, external: Object, chrome: Object}\n\n在 `Square` 的 `display` 方法中：\nSquare\
  \ {id: \"s1\", name: \"square one\", size: 100, numClicks: 0, display: function\
  \ }\n\nsquare one 的大小为 100，是一个 `Square`\n\n这些 `console.log()` 消息中的每一个都显示了代码中特定位置\
  \ `this` 的值。\n\n第一条消息来自 `window.onload` 函数中的 `console.log()`。通常，当你调用对象的方法时，`this`\
  \ 指向该对象。这里的情况如此：我们调用了赋值给 `window.onload` 属性的函数（因此该函数是一个方法），所以该方法中的 `this` 是 `window`\
  \ 对象。\n\n第二条消息来自 `Square()` 构造函数顶部的 `console.log()`。在这里，`this` 被设置为一个全新的对象（由构造函数创建的那个），并且由于我们尚未设置它的任何属性，因此该对象是空的。\n\
  \n在 `Square()` 构造函数的结束处，当我们为构造函数创建的对象添加了属性和方法后，我们看到了第三条消息。在消息中，我们看到一个完全构造好的 `Square`\
  \ 对象，它将返回给调用 `new Square()` 的代码。\n\n第四条消息来自 `setupClickHandler()` 中的 `console.log()`，我们在调用\
  \ `square.display()` 之前刚刚调用了它。`setupClickHandler()` 中 `this` 的值也是 `window` 对象，但原因完全不同。在这里，`this`\
  \ 被设置为 `window` 对象，是因为 `setupClickHandler()` 是我们创建的一个全局定义函数，而它被调用的上下文是 `window`\
  \ 对象——即全局对象。每当你作为函数调用全局定义的函数时，`this` 被设置为 `window` 对象（除非你将其设置为了其他值）。\n\n最后两条消息来自\
  \ `square.display()` 方法中的 `console.log()`。`this` 被设置为 `Square` 对象；即我们从 `Square`\
  \ 对象调用的该方法。\n\n我们还没有看到 `\"s1\"` `<div>` 点击处理程序中的消息（假设你还没有点击那个 `<div>`；如果你已经点击了，请刷新页面并不要点击它，这样你的消息就能和我们的一致）。\n\
  \n现在，点击 `\"s1\"` `<div>`（通过点击文本上的任何地方）。页面上出现了更多文本，“You've clicked 1 times.”，并且在控制台中，你看到：\n\
  \n![](img/Image00043.jpg)\n\n### 观察：\n\n>在点击处理程序中：\n<div id=\"s1\" class=\"square\"\
  \ style=\"width: 100px; height: 100px;\">...</div>\n\n这是我们赋值给 `\"s1\"` `<div>` 的\
  \ `onclick` 属性的函数中的 `console.log()` 消息。由于我们正在给对象的点击属性赋值一个函数（一个代表 `<div>` 的元素对象），所以这个函数实际上是一个方法。在该方法内部，`this`\
  \ 被设置为包含我们正在调方法的对象——即 `\"s1\"` `<div>`。\n\n再次尝试点击。注意，每当你点击时，我们都会递增全局变量 `n`，以便跟踪你点击的总次数。（作为一个练习，思考一下为什么\
  \ `n` 在这里必须是一个全局变量。）\n\n到目前为止一切顺利；一切几乎符合我们的预期。现在让我们来做修改并看看会发生什么：\n\n![](img/Image00183.jpg)\n\
  \n### 需要输入的代码：\n\n```javascript\nvar n = 0;\n\nfunction Square(id, name, size) {\n\
  \  console.log(\"This at the top of the Square constructor: \"); console.log(this);\n\
  \  this.id = id;\n  this.name = name;\n  this.size = size;\n  this.numClicks = 0;\n\
  \  this.display = function() {\n    console.log(\"This in the Square's display method:\
  \ \"); console.log(this);\n    var el = document.getElementById(this.id);\n    el.style.width\
  \ = this.size + \"px\";\n    el.style.height = this.size + \"px\";\n    el.innerHTML\
  \ = \"<p>\" + this.name + \"</p>\";\n    console.log(this.name + \" has size \"\
  \ + this.size + \", and is a \" + this.constructor.name);\n  };\n  this.click =\
  \ function() {\n    console.log(\"This in the Square's click method: \");\n    this.this++;\n\
  \    document.getElementById(\"counter_\" + this.id).innerHTML = \"You've clicked\
  \ \" + n + \" times.\";\n  };\n  console.log(\"This at the bottom of the Square\
  \ constructor: \");\nconsole.log(this);\n}\n\nwindow.onload = function() {\n  console.log(\"\
  This in window.onload: \"); console.log(this);\n  var square = new Square(\"s1\"\
  , \"square one\", 100);\n  setupClickHandler(square);\n  square.display();\n}\n\n\
  function setupClickHandler(shape) {\n  console.log(\"This in setupClickHandler:\
  \ \");\n  console.log(this);\n  var elDiv = document.getElementById(shape.id);\n\
  \  elDiv.onclick = function() {\n    console.log(\"This in click handler: \");\n\
  \    console.log(this);\n\n    n++;\n    var counter = document.getElementById(\"\
  counter_\" + shape.id);\n    counter.innerHTML = \"You've clicked \" + n + \" times.\"\
  ;\n  };\n  elDiv.onclick = shape.click;\n}\n```\n\n...\n\n![](img/Image00042.jpg)\
  \ 和 ![](img/Image00036.jpg) 预览。我们用 `square` 对象的方法 `square.click()` 替换了在 `setupClickHandler()`\
  \ 中定义的 `\"s1\"` `<div>` 的点击处理程序（我们在 `setupClickHandler()` 中将 `square` 传递给名为 `shape`\
  \ 的参数）。本质上，该处理程序执行相同的任务，只是我们现在使用 square 对象的属性 `numClicks` 来跟踪点击次数，而不是使用全局变量。\n\n\
  现在像以前一样尝试点击 `\"s1\"` `<div>`。它不起作用！你在页面上看到了“You've clicked NaN times on book”。记得\
  \ `NaN` 意味着“不是数字”，所以计数器出了问题。此外，我们没有看到书籍的名字。\n\n查看 `click()` 方法的代码：\n\n![](img/Image00123.jpg)\n\
  \n### 观察：\n\n```javascript\nthis.click = function() {\n  console.log(\"This in the\
  \ Square's click method: \");\n  console.log(this);\n  this.numClicks++;\n  document.getElementById(\"\
  counter_\" + this.id).innerHTML = \"You've clicked \" + this.numClicks + \" times\
  \ on \" + this.name;\n};\n```\n\n我们没有看到 `this.numClicks` 或 `this.name` 的值。再次查看控制台，你会发现\
  \ `click()` 方法中 `this` 的值是 `\"s1\"` `<div>` 对象（元素对象），而不是 `square` 对象：\n\n![](img/Image00067.jpg)\n\
  \n### 交互式会话：\n\n>在点击处理程序中：\n<div id=\"s1\" class=\"square\" style=\"width: 100px;\
  \ height: 100px;\">...</div>\n\n\n\n\n\n在这里，\"s1\" `<div>` 对象替换了 `square.click()`\
  \ 方法中 `this` 的普通值。事实上，在任何你用作如 \"click\" 等事件处理程序的函数中，`this` 都会被定义为目标元素对象。当我们想要在点击处理句程序中访问被点击的元素时，这种行为非常有用，但在这种情况下，这种行为违背了我们对\
  \ `square` 对象方法中 `this` 应该是什么的预期。\n\n幸运的是，有一个简单的方法可以避免这个问题。与其写：\n\n![](img/Image00076.jpg)\n\
  \n观察：\n\n`elDiv.onclick = shape.click;`\n\n我们可以这样写：\n\n![](img/Image00033.jpg)\n\
  \n观察：\n\n```javascript\nelDiv.onclick = function() {\n  shape.click();\n}\n```\n\
  \n现在，`this` 被设置为外层点击处理句函数中的 \"s1\" `<div>`（即我们赋值给 `elDiv` 的 `onclick` 属性的匿名函数），但当我们从该函数内部调用\
  \ `shape.click()` 时，`this` 被设置为传递给 `setupClickHandler()` 的 square 对象（因为现在我们是像对象方法一样正常地调用它，而不是作为事件处理程序）。如果你出于某种原因在点击处理程序中需要\
  \ \"s1\" `<div>` 对象，你可以将 `this` 传递给方法：\n\n![](img/Image00184.jpg) 观察：\n\n```javascript\n\
  elDiv.onclick = function() {\n  shape.click(this);\n}\n```\n\n...并修改 `Square` 构造函数中的\
  \ `click()` 方法，添加一个参数来接收此参数。\n\n我们不需要在 `click()` 方法中 \"s1\" `<div>`，所以现在只需将代码修改如下：\n\
  \n![](img/Image00020.jpg)\n\n输入代码：\n\n```javascript\nfunction setupClickHandler(book)\
  \ {\n  var elDiv = document.getElementById(shape.id);\n  elDiv.onclick = shape.click;\n\
  \  elDiv.onclick = function() {\n    console.log(\"This in click handler: \");\n\
  \    console.log(this);\n    shape.click();\n  };\n}\n```\n\n![](img/Image00042.jpg)\
  \ 和 ![](img/Image00036.jpg)。现在，当你点击 \"s1\" `<div>` 时，页面会正确更新，在控制台中，你会看到 `this` 在点击处理函数中被设置为\
  \ \"s1\" `<div>` 对象，在 `square.click()` 方法中设置为 square 对象，正如你预期的那样。\n\n![](img/Image00185.jpg)\n\
  \nJavaScript 在事件处理器中对 `this` 的处理是一个复杂的话。如果你使用内联事件处理器（不推荐！），例如 `<p onclick=\"click()\"\
  >`，`this` 将指向全局 `window` 对象，而不是 `<p>` 元素对象。同样，如果你在 IE8 及之前的版本中使用（现过时的）`attachEvent()`\
  \ 函数，`this` 将指向 `window` 对象。为了在处理 `this` 时保持一致，我们建议使用 `onclick` 属性来设置点击处理程序（以及其他常见的事件处理程序），或者如果你知道所有用户都在\
  \ IE9+，则添加 `addEventListener()`。在这两种情况下，`this` 都会被设置为事件处理函数中被点击的元素。\n\n![](img/Image00018.jpg)\n\
  \n本节课程需要理解的关键点是：`this` 的值取决于你如何调用函数，而你想知道在这些不同情况下 `this` 的值将会是什么。\n\n### 嵌套函数\n\n\
  嵌套函数中 `this` 的值可能不是你预期的。让我们来看例子。创建一个所示的新 HTML 文件：\n\n![](img/Image00186.jpg) 输入代码：\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n  <title> 嵌套函数</title>\n  <meta charset=\"\
  utf-8\">\n  <script>\n    function outer() {\n      console.log(\"outer: \", this);\n\
  \      inner();\n      function inner() {\n        console.log(\"inner: \", this);\n\
  \      }\n    }\n    outer();\n  </script>\n</head>\n<body>\n</body>\n</html>\n\
  ```\n\n![](img/Image00042.jpg) 将其保存在你的 `/AdvJS` 文件夹中并为 `self.html`，并 ![](img/Image00085.jpg)。在控制台中，你看到：\n\
  \n![](img/Image00095.jpg)\n\n观察：\n\nouter:\nWindow {top: Window, window: Window,\
  \ location: Location, external: Object, chromObject}\ninner:\nWindow {top: Window,\
  \ window: Window, location: Location, external: Object, chromObject}\n\n第一个结果不应该感到意外：我们知道当你调用一个全局定义的函数时，`this`\
  \ 被设置为全局 `window` 对象。\n\n`inner()` 函数中 `this` 的值也是 `window` 对象。如果你预期 `this` 被定义为函数\
  \ `outer`，可能会惊讶（因为 `outer` 是一个对象——是的，函数也是对象！）。关于 `this` 还需要记住的另一点是：\n\n如果在对象构造函数内部调用嵌套函数会怎样？\n\
  \n![](img/Image00156.jpg) 输入代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n  <title>\
  \ 嵌套函数</title>\n  <meta charset=\"utf-8\">\n  <script>\n    function outer() {\n\
  \      console.log(\"outer: \", this);\n      inner();\n      function inner() {\n\
  \        console.log(\"inner: \", this);\n      }\n    }\n    outer();\n    function\
  \ MakeObject() {\n      this.aProperty = 3;\n      console.log(\"outer object: \"\
  , this);\n      function inner() {\n        console.log(\"inner to object: \", this);\n\
  \      }\n      inner();\n    }\n    var outerObject = new MakeObject();\n  </script>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg) 和 ![](img/Image00021.jpg)。你这次看到的的结果可能更加令人：\n\
  \n![](img/Image00104.jpg)\n\n观察：\n\nouter object: MakeObject {aProperty: 3}\ninner\
  \ to object:\nWindow {top: Window, window: Window, location: Location, external:\
  \ Object, chrome: Object}\n\n`this` 被定义为我们在第一个消息中 `MakeObject()` 构造函数中创建的对象（正如预期的那样），但在\
  \ `inner()` 函数内部（在构造函数内部定义并调用它）中，`this` 被定义为全局 `window` 对象。我们在嵌套函数中“丢失”了 `this`\
  \ 的值（即我们正在创建的对象）。\n\n由于这种行为，JavaScript 中一种常见的惯用法是将 `this` 的值“保存”到另一个变量中，以便嵌套函数可以访问，如下所示：\n\
  \n![](img/Image00114.jpg) 输入代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n  <title>\
  \ 嵌套函数</title>\n  <meta charset=\"utf-8\">\n  <script>\n    function outer() {\n\
  \      console.log(\"outer: \", this);\n      inner();\n      function inner() {\n\
  \        console.log(\"inner: \", this);\n      }\n    }\n    outer();\n    function\
  \ MakeObject() {\n      this.aProperty = 3;\n      console.log(\"outer object: \"\
  , this);\n      var self = this;\n      function inner() {\n        console.log(\"\
  inner to object: \", self);\n      }\n      inner();\n    }\n    var outerObject\
  \ = new MakeObject();\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/Image00042.jpg)\
  \ 和 ![](img/Image00036.jpg) 预览。现在你看到：\n\n![](img/Image00043.jpg)\n\n观察：\n\nouter\
  \ object: MakeObject {aProperty: 3}\ninner to object: MakeObject {aProperty: 3}\n\
  \n我们在调用 `inner()` 之前将 `this` 的值保存在变量 `self` 中。由于词法作用域，`inner()` 函数可以看到 `self`，因此可以访问由构造函数创建的对象。\n\
  \n![](img/Image0034.jpg)\n\n| 注意 | 我们刚刚描述的行为（嵌套函数中定义为全局 window 对象）可能会在未来的 版本 中发生变化。\
  \ |\n| | |\n\n![](img/Image0018.jpg)\n\n### 当你想控制如何定义\n\n所以你已经看到了当作为函数调用全局函数、作为构造函数调用函数、作为方法调用函数，以及在点击处理程序和嵌套函数这些特殊情况下，`this`\
  \ 是如何定义的。\n\n在所有这些情况下，JavaScript 规则决定了 `this` 的定义。但如果你想在调用函数时控制并定义自己的 `this` 值呢？\n\
  \n那就是使用 `apply()` 和 `call()` 的时候。这些方法专门设计用于允许你在使用 `apply()` 或 `call()` 调用函数时定义 `this`\
  \ 的值。\n\n假设你决定为程序添加另一个形状。按所示编辑 `this.html`：\n\n![](img/Image00187.jpg) 编辑代码：this.html\n\
  \n```html\n...\n<script>\nfunction Square(id, name, size) {\n  this.id = id;\n \
  \ this.name = name;\n  this.size = size;\n  this.numClicks = 0;\n  this.display\
  \ = function() {\n    var el = document.getElementById(this.id);\n    el.style.width\
  \ = this.size + \"px\";\n    el.style.height = this.size + \"px\";\n    el.innerHTML\
  \ = \"<p>\" + this.name + \"</p>\";\n    console.log(this.name + \" has size \"\
  \ + this.size + \", and is a \" + this.constructor.name);\n  };\n  this.click =\
  \ function() {\n```\n\n\n\n\n\n```javascript\nconsole.log(\"This in the Square's\
  \ click method: \"); console.log(this);\n\nthis.numClicks++;\n\ndocument.getElementById(\"\
  counter_\" + this.id).innerHTML =\n\"You've clicked \" + this.numClicks + \" times\
  \ on \" + this.name;\n\n};\n\n}\n\nfunction Circle(id, name, radius) {\n  this.id\
  \ = id;\n  this.name = name;\n  this.radius = radius;\n  this.numClicks = 0;\n \
  \ this.display = function() {\n    var el = document.getElementById(this.id);\n\
  \    el.style.width = (this.radius * 2) + \"px\";\n    el.style.height = (this.radius\
  \ * 2) + \"px\";\n    el.style.borderRadius = this.radius + \"px\";\n    el.innerHTML\
  \ = \"<p>\" + this.name + \"</p>\";\n    console.log(this.name + \" has radius \"\
  \ + this.radius + \", and is a \" + this.constructor.name);\n  };\n  this.click\
  \ = function() {\n    this.numClicks++;\n    document.getElementById(\"counter_\"\
  \ + this.id).innerHTML =\n    \"You've clicked \" + this.numClicks + \" times on\
  \ \" + this.name;\n  };\n}\n\nwindow.onload = function() {\n  var square = new Square(\"\
  s1\", \"square one\", 100);\n  setupClickHandler(square);\n  square.display();\n\
  \  var circle = new Circle(\"c1\", \"circle one\", 50);\n  setupClickHandler(circle);\n\
  \  circle.display();\n}\n\nfunction setupClickHandler(shape) {\n  var elDiv = document.getElementById(shape.id);\n\
  \  elDiv.onclick = function() {\n    shape.click();\n  }\n}\n```\n</script>\n</head>\n\
  <body>\n![](img/Image00188.jpg)\n\n<div id=\"s1\" class=\"square\"></div>\n<div\
  \ id=\"c1\" class=\"circle\"></div>\n<p id=\"counter_s1\"></p>\n<p id=\"counter_c1\"\
  ></p>\n\n</body>\n</html>\n\n![](img/Image00042.jpg) and ![](img/Image00036.jpg)\
  \ 。页面上出现了一个名为 \"circle one\" 的圆形。你可以点击正方形并看到消息 \"You've clicked 1 times on square\
  \ one\"，你也可以点击圆形并看到消息 \"You've clicked 1 times on circle one。\" 重复点击任何一个对象都会在相应的显示句子中增加点击计数。\n\
  \n我们添加了一个新的 `Circle()` 构造函数，它与 `Square()` 相似，不同在于它有一个 `radius` 属性，且它的 `display()`\
  \ 函数有所不同。不过，`click()` 函数是完全相同的。\n\n我们还在 `window.onload` 函数中添加了新代码，以创建一个圆形对象，调用 `setupClickHandler()`\
  \ 为代表页面中圆形的 `\"c1\"` `div` 对象添加点击处理程序，并调用 `circle.display()` 让我们就能在页面上看到它。\n\n每个形状都有自己独立的点击处理程序。当我们把\
  \ `square` 传递给 `setupClickHandler()` 时，我们将 `\"s1\"` `div` 对象的点击处理程序设置为正形的 `click()`\
  \ 方法；而当我们把 `circle` 传递给 `setupClickHandler()` 时，我们将 `\"c1\"` `div` 对象的点击处理程序设置为圆形的\
  \ `click()` 方法。\n\n由于两者的代码完全相同，我们可以将代码从两个对象中提取出来，并对两者使用相同的代码。如所示再次修改 `this.html`。\n\
  \n![](img/Image00189.jpg) 需要输入的代码：\n\n```javascript\nfunction Square(id, name, size)\
  \ {\n  this.id = id;\n  this.name = name;\n  this.size = size;\n  this.numClicks\
  \ = 0;\n  this.display = function() {\n    var el = document.getElementById(this.id);\n\
