    \n    prevCircle.setStyle({ color: '#000ff' });\n    currCircle.setStyle({ color:\
    \ '#ff0000' });\n  });\n```\n\npairwise groups each event with the previously\
    \ emitted value in an array. We're always getting distinct rows, pairwise will\
    \ always yield the row that the mouse left and the row where the mouse is hovering\
    \ over. With this information, it is easy to clear each earthquake circle accordingly.\n\
    \nHandling the click event is even simpler:\n\n```\nexamples_earthquake_ui/code3.pairwise.js\n\
    \ngerFromEvent('click')\n  .subscribe(function(row) {\n    var circle = quakeLayer.get(codeLayers[row.id]);\n\
