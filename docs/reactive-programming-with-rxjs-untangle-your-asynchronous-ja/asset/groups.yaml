    \ = true;\n        shot.x = shot.y = -100;\n        break;\n      }\n    }\n \
    \   shot.y = SHOOTING_SPEED;\n    drawTriangle(shot.x, shot.y, 5, '#ff00ff', 'up');\n\
    \  });\n}\n```\n\nAnd of course, we add paintScore to renderScene so score appears\
