    \ (x) {\n console.log('Observer 1: ' + x);\n});\n```\n\n```\nsetTimeout(function()\
    \ {\n var observer2 = source.subscribe(function (x) {\n console.log('Observer\
    \ 2: ' + x);\n });\n}, 3000);\n```\n\nOutput:\n\n+   - Observer 1: 0\nObserver\
    \ 1: 1\nObserver 1: 2"
  - "[PAGE 94]\n\nObserver 1: 3\n\nObserver 2: 0\n\nObserver 1: 4\n\nObserver 2: 1\n\
    \n...\n\nNow we see that something is really really off. When subscribing three\
    \ seconds later, observer2 receives all the values that the source already pushed,\
    \ instead of starting with the current value and continuing from there, because\
    \ Rx.Observable.interval is a cold Observable. If the difference between hot and\
    \ cold Observables is not clear, scenarios like this can be surprising.\n\nIf\
    \ we have several Observers listening to a cold Observable, they will receive\
    \ copies of the same sequence of values. So strictly speaking, although the Observers\
    \ are sharing the same Observable, they are not sharing the same exact sequence\
    \ of values. If we want the Observers to share the same sequence, we need not\
    \ a hot Observable.\n\n# From Cold to Hot Using publish\n\nWe can turn a cold\
    \ Observable into a hot one using publish. Calling creates a new Observable that\
    \ acts as a proxy to the original. It does that by subscribing itself to the original\
    \ and pushing the values it receives to its subscribers.\n\nA published Observable\
    \ is actually a ConnectableObservable, which has an extra method called connect\
    \ that we call to start receiving values. This allows us to subscribe to it before\
    \ it starts running:\n\n```\nhot_cold.js\n// Create an Observable that yields\
    \ a value every second\nvar source = Rx.Observable.interval(1000);\nvar publisher\
    \ = source.publish();\n\n// Even if we are subscribing, no values are pushed yet.\n\
    var observer1 = publisher.subscribe(function (x) {\n  console.log('Observer 1:\
    \ ' + x);\n});\n\n// publisher connects and starts publishing values\npublisher.connect();\n\
    setTimeout(function() {\n  // 5 seconds later, observer2 subscribes to it and\
    \ starts receiving\n  // current values, not the whole sequence.\n  var observer2\
    \ = publisher.subscribe(function (x) {\n    console.log('Observer 2: ' + x);\n\
    \  });\n}, 5000);\n```"
  - "[PAGE 95]\n\n# Sharing a Cold Observable\n\nLet's get back to our earthquake\
    \ example. The code we have so far looks reasonable; we have an Observable quakes\
    \ with two subscriptions: one that paints earthquakes on the map, and one that\
    \ lists them in the table.\n\nBut we can make our code much more efficient. By\
    \ having two subscribers to quakes we're in fact, requesting the data twice. We\
    \ can check that by putting a console.log inside the flatMap operator in quakes.\n\
    \nThis happens because quakes is a cold Observable, and it will re-emit all its\
    \ values to each new subscriber, so a new subscription means a new JSONP request.\
    \ This impacts our application performance by requesting the data twice over the\
    \ network.\n\nFor the next example we'll use the share operator, which automatically\
    \ creates a subscription to the Observable when the number of Observers goes from\
    \ zero to one. This spares us from calling connecting:\n\n```\nexamples.earthquake_ui/code2.js\n\
    \nvar quakes = Rx.Observable\n  .interval(5000)\n  .flatMap(function() {\n   \
    \ return Rx.DOM.httpRequest({\n      url: QUAKE_URL,\n      jsonCallback: 'eqfeed_callback'\n\
    \    });\n  })\n  .flatMap(function(result) {\n    return Rx.Observable.from(result.response.features);\n\
    \  })\n  .distinct(function(quake) { return quake.properties.code; }\n  .share();\n\
    ```\n\nNow quakes behaves like a hot Observable, and we don't have to worry about\
    \ how many Observers we connect to it, since they will receive the exact same\
    \ data.\n\n# Buffering Values\n\nOur preceding code works well, but notice that\
    \ we insert a tr node every time we receive information about an earthquake. That's\
    \ inefficient, because with each insertion we're modifying the DOM and causing\
    \ a repaint of the page, making the browser to do unnecessary work to calculate\
    \ the new layout. This can cause noticeable performance drop."
  - "[PAGE 96]\n\nIdeally, we would batch several incoming earthquake objects and\
    \ insert each batch every few seconds. That would be tricky to implement by hand\
    \ because we've have to keep counters and element buffers, and we would have to\
    \ reset them with every batch. But with RxJS operators, we can just use one of\
    \ the buffer-based RxJS operators.\n\nWith bufferTime we can buffer values and\
    \ release them as an array every x period of time:\n\n```\nexamples/earthquake_ui/code3.bufferWithTime.js\n\
    var table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(mapRow)\n  .bufferWithTime(500)\n  .filter(function(rows) { return rows.length\
    \ > 0; }) // /\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function (fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\nThis is what's going on in the new code:\n\n+   * Buffer every\
    \ incoming value and release the batch of values every 500 milliseconds.\n* bufferTime\
    \ executes every value 500ms no matter what, and if there have been no incoming\
    \ values, it will yield an empty array. We'll filter those.\n* We insert every\
    \ row into a document fragment, which is a document without a parent. This means\
    \ it's not in the DOM, and modifying its contents is very fast and efficient.\n\
    * Finally, we append the fragment to the DOM. An advantage of appending a fragment\
    \ is that it counts as a single operation, causing just one redraw. It also appends\
    \ the fragment's children to the same element to we're appending the fragment\
    \ itself.\n\nUsing buffers and fragments, we manage to keep row insertion performant\
    \ while keeping the real-time nature of our application (with a maximum delay\
    \ of half a second). Now we're ready to add the next feature to our dashboard:\
    \ interactivity!"
- md: "\n# Adding Interaction\n\nWe have earthquakes on the map and in a list, but\
    \ no interaction between both representations yet. It would be nice, for example,\
    \ to center an earthquake on the map whenever we click it on the list, and to\
    \ highlight an earthquake with a circle on the map when we move the mouse over\
    \ its row. Let's get to it.\n\nIn Leaflet, you can draw a map and put drawings\
    \ in their own layers so you can manipulate them individually. Let's create a\
    \ group of layers called quakeLayer where we'll store all the earthquake circles.\
    \ Each circle will be a layer inside the group. We'll also create an objectLayers\
    \ where we'll store the correlation between an earthquake code and the internal\
    \ layer ID, so that we can refer to them by the earthquake ID:\n\n```\nexamples_earthquake_ui/code3.js\n\
    var codeLayers = {};\nvar quakeLayer = L.layerGroup([]).addTo(map);\n```\n\nAnd\
    \ now in the subscription for the quakes Observable initialize, we'll add each\
    \ circle to the layer group and store its ID in codeLayers. It seems a bit intricate,\
    \ it's because the only way Leaflet allows us to refer to drawings in a map.\n\
    \n```\nexamples_earthquake_ui/code3.js\nquakes.subscribe(function(quake) {\nvar\
    \ coords = quake.geometry.coordinates;\nvar size = quake.properties.mag * 10000;\n\
    var circle = L.circle([coords[1],coords[0]], size).addTo(map);\nquakeLayer.addLayer(circle);\n\
    codeLayers[quake.id] = quakeLayer.getLayer(circle);\n});\n```\n\nLet's now create\
    \ the hovering effect. We'll write a new function, isHovering, which returns a\
    \ Boolean value for whether the mouse is over a particular earthquake circle at\
    \ any given moment:\n\n```\nexamples_earthquake_ui/code3.js\nvar identity = Rx.helpers.identity;\n\
    function isHovering(element) {\nvar over = Rx.DOM.mouseover(element).map(identity(true));\n\
    var out = Rx.DOM.mouseout(element).map(identity(false));\nreturn over.merge(out);\n\
    }\n```\n\nRx.helpers.identity is the identity function. Given a parameter x, it\
    \ returns x. This way we don't have to write functions that return the value receive.\n\
    \nover is an Observable that emits true when the user hovers the mouse over the\
    \ element.\n\nout is an Observable that emits false when the user moves the mouse\
    \ outside of the element.\n\nisHovering merges both over and out, returning an\
    \ Observable that emits true when the mouse is over an element, and false when\
    \ it leaves it.\n\nWithHovering in place we can modify the modification that creates\
    \ the rows, so that we subscribe to events in each row as it is created:\n\n```\n\
    examples_earthquake_ui/code3.js\nvar table = document.getElementById('quakes_info');\n\
    quakes\n  .pluck('properties')\n  .map(bufferWithTime(500))\n  .filter(function(rows)\
    \ { return rows.length > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      var circle = quakeLayer.get(codeLayers[row.id]);\n\
    \      isHovering(row).subscribe(function(hovering) {\n        circle.setStyle({\
    \ color: hovering ? '#ff0000' : '#0000ff' });\n      });\n    });\n      Rx.DOM.click(row).subscribe(function()\
    \ {\n        map.panTo(circle.getLatLng());\n      });\n\n      fragment.appendChild(row);\n\
    \    });\n    return fragment;\n  })\n  .subscribe(function(fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\nWe get the circle element for the earthquake on the map using the\
    \ ID we get from the row element. With that, codeLayers gives us the corresponding\
    \ internal ID, which gets us the circle element using quakeLayer.getLayer.\n\n\
    We call isHovering with the current row and we subscribe to the resulting Observable.\
    \ if the hovering argument is true, we'll paint the circle red; otherwise, it\
    \ will be blue.\n\nWe subscribe to the Observable created from the click event\
    \ in the current row. When the row in the list is clicked, the map will be centered\
    \ on the corresponding circle in the map.\n\n# Making It Efficient\n\nExperienced\
    \ front-end developers know that creating many events on a page is a recipe for\
    \ bad performance. In our previous example, we created three events for each row.\
    \ If we get 100 earthquakes on the list, we would have three hundred events floating\
    \ around the page! That is terrible for performance, and we can do better. Because\
    \ events in DOM bubble up (from children to parent), a well-known technique among\
    \ front-end developers to avoid attaching events to many elements is to attach\
    \ them instead of their parent. Once the event is fired on the parent, we can\
    \ use the event's target property to find the child element that was. Because\
    \ we'll need similar functionality for the events click and mouseover, we will\
    \ create a function getRowFromEvent:\n\n```\nexamples_earthquake_ui/code3.js\n\
    function getRowFromEvent(event) {\n  return Rx.Observable\n    .fromEvent(table,\
    \ event)\n    .filter(function(event) {\n      var el = event.target.tagName ===\
    \ 'TD' ? event.target.parentNode : null;\n      return el;\n    })\n    .pluck('parentNode')\n\
    \    .distinctUntilChanged();\n}\ngetRowFromEvent gives us the row in which the\
    \ event has happened. Here are the details: we make sure that we get events happening\
    \ in a table cell, and we check that the parent of that cell is a row with an\
    \ ID. These rows are the ones tagged with the earthquake ID. The pluck operator\
    \ extracts the nested parentNode inside the element's target.\n\n# Adding a List\
    \ of Earthquakes\n\nThis prevents getting the same element more than once. That\
    \ happens a lot with the mouseover event, for example. In the previous section\
    \ we attached events mouseover and mouseout on each row to change the earthquake\
    \ color each time the mouse entered or exited the row. Now we'll use only the\
    \ mouseover event on the table, combined with the convenient pairwise operator:\n\
    \n```\nexamples_earthquake_ui/code3.pairwise.js\ngetRowFromEvent('mouseover')\n\
    \  .pairwise().subscribe(function(rows) {\n    var prevCircle = quakeLayer.get(codeLayers[rows[0].id]);\n\
    \    var currCircle = quakeLayer.get(codeLayers[rows[1].id]);\n\n    prevCircle.setStyle({\
    \ color: '#000ff' });\n    currCircle.setStyle({ color: '#ff0000' });\n  });\n\
    ```\n\npairwise groups each event with the previously emitted value in an array.\
    \ We're always getting distinct rows, pairwise will always yield the row that\
    \ the mouse left and the row where the mouse is hovering over. With this information,\
    \ it is easy to clear each earthquake accordingly. Handling the click event is\
    \ even simpler:\n\n```\nexamples_earthquake_ui/code3.pairwise.js\ngetRowFromEvent('click')\n\
    \  .subscribe(function(row) {\n    var circle = quakeLayer.get(codeLayers[row.id]);\n\
    \    map.panTo(circle.getLatLng());\n  });\n```\n\nAnd we can go back to just\
    \ subscribing to quakes to generate the rows:\n\n```\nexamples_earthquake_ui/code3.pairwise.js\n\
    quakes\n  .pluck('properties')\n  .map(makeRow)\n  .subscribe(function(row) {\
    \ table.appendChild(row); });\n```\n\nOur code is now more clean and idiomatic,\
    \ and it doesn't depend on the rows being there. If there are no rows, getRowFrom\
    \ won't try to yield any. What's more important, our code now is very efficient.\
    \ Regardless of the amount of earthquake information we retrieve, we'll always\
    \ have just a single mouseover event and a single click event, instead of hundreds\
    \ of events.\n\n# Getting Real-Time Updates from Twitter\n\nThe second part of\
    \ our plan to make a real-time dashboard for earthquakes is to add reports and\
    \ information from Twitter to the different earthquakes happening on the planet.\
    \ For this, we'll create a Node.js program that will fetch the stream of tweets\
    \ related to the earthquakes.\n\n# Setting Up Our Node.js Environment\n\nLet's\
    \ configure our Node.js application. Based on RxJS, we will be using two third-party\
    \ modules to make our life easier: ws and tw. Any similar modules should work\
    \ with minimal changes to the code.\n\nFirst, let's create a folder for our application\
    \ and install the modules we'll use. (Note that the output of the npm command\
    \ may vary depending on the current versions of the packages).\n\n```bash\n$ mkdir\
    \ tweet_stream\n$ cd tweet_stream\n$ npm install ws tw rx\nrx@3.1.2 node_modules/tw\n\
    tw@1.1.19 node_modules/tw\n└── oauth@0.9.9\nws@0.8.0 node_modules/ws\n├── options@0.0.6\n\
    ├── utf8@1.0.2\n│└── utf-8-validate@1.2.1 (bindings@1.2.1, nan@0.0.9)\n└── bufferutil@1.2.1\
    \ (bindings@1.2.1, nan@0.0.9)\n```\n\n# Client-Server Communication\n\nNow we're\
    \ ready to start building our application. Let's create a new file called index.js\
    \ inside the tweet_stream folder to load the modules we'll use:\n\n```\nexamples_earthquake_ui/tweet_stream/index.js\n\
    var WebSocket = require('ws').Server;\nvar Twit = require('tweet');\nvar Rx =\
    \ require('rx');\n```\n\nTo use the Twitter API, we need to request a consumer\
    \ key and an access token from the Twitter website. Once you have that, create\
    \ a new Twit object with a configuration object, like this:\n"
  mdcn: "\n\n# 添加交互\n\n我们在地图和列表中都显示了地震数据，但这两种表示形式之间还没有交互。如果能实现诸如：当我们点击列表中的某次地震时，地图会自动定位到该地震的位置；当当鼠标悬停在列表的某行上时，地图上会用圆圈高亮该地震。让我们开始吧。\n\
    \n在 Leaflet 中，你可以绘制地图并将图形放在各自的层中，这样你就可以对它们进行单独操作。让我们创建一个名为 `quakeLayer` 的层组，用于存储所有的地震圆。每个圆将是该组内的一个层。我们还会创建一个\
    \ `codeLayers` 对象，用于存储地震代码与内部层 ID 之间的对应关系，这样我们就可以通过地震 ID 来引用它们：\n\n```\nexamples_earthquake_ui/code3.js\n\
    var codeLayers = {};\nvar quakeLayer = L.layerGroup([]).addTo(map);\n```\n\n现在，在\
    \ `quakes` Observable 的订阅回调中，我们将每个圆添加到层组中，并将它的 ID 存储在 `codeLayers` 中。这看起来有点复杂，因为这是\
    \ Leaflet 允许我们引用地图上图形的唯一方式。\n\n```\nexamples_earthquake_ui/code3.js\nquakes.subscribe(function(quake)\
    \ {\nvar coords = quake.geometry.coordinates;\nvar size = quake.properties.mag\
    \ * 10000;\nvar circle = L.circle([coords[1],coords[0]], size).addTo(map);\nquakeLayer.addLayer(circle);\n\
    codeLayers[quake.id] = quakeLayer.getLayer(circle);\n});\n```\n\n现在让我们创建悬停效果。我们将编写一个新函数\
    \ `isHovering`，它返回一个布尔值，表示在任何时刻鼠标是否悬停在特定的地震圆上：\n\n```\nexamples_earthquake_ui/code3.js\n\
    var identity = Rx.helpers.identity;\nfunction isHovering(element) {\nvar over\
    \ = Rx.DOM.mouseover(element).map(identity(true));\nvar out = Rx.DOM.mouseout(element).map(identity(false));\n\
    return over.merge(out);\n}\n```\n\n`Rx.helpers.identity` 是恒等函数。给定一个参数 `x`，它返回\
    \ `x`。这样我们就不需要编写返回接收到的值的函数了。\n\n`over` 是一个当用户鼠标悬停在元素上时发射 `true` 的 Observable。\n\
    \n`out` 是一个当用户将鼠标移出元素范围时发射 `false` 的 Observable。\n\n`isHovering` 合并了 `over` 和\
