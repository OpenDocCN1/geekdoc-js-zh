    \ 之后，我们可以修改创建行的代码，以便在每行被创建时都订阅该行的事件：\n\n```\nexamples_earthquake_ui/code3.js\n\
    var table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(bufferWithTime(500))\n  .filter(function(rows) { return rows.length >\
    \ 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      var circle = quakeLayer.get(codeLayers[row.id]);\n\
    \      isHovering(row).subscribe(function(hovering) {\n        circle.setStyle({\
    \ color: hovering ? '#ff0000' : '#0000ff' });\n      });\n    });\n      Rx.DOM.click(row).subscribe(function()\
    \ {\n        map.panTo(circle.getLatLng());\n      });\n\n      fragment.appendChild(row);\n\
    \    });\n    return fragment;\n  })\n  .subscribe(function(fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\n我们通过从行元素获取的 ID 获取地图上地震的圆元素。通过它，`codeLayers` 提供了对应的内部 ID，我们借通过 `quakeLayer.getLayer`\
    \ 获取圆元素。\n\n我们使用当前行调用 `isHovering` 并订阅生成的 Observable。如果 `hovering` 参数为 `true`，我们将圆圈涂成红色；否则将是蓝色。\n\
    \n我们订阅了从当前行点击事件创建的 Observable。当点击列表中的某行时，地图将对齐地图上对应的圆圈。\n\n# 提高效率\n\n经验的前端开发者知道，在页面上创建许多事件是性能低下的万根源。在上一个示例中，我们为每行创建了三个事件。如果列表中有\
    \ 100 次地震，页面上就会浮动着 300 个事件！这对性能来说是糟糕的，我们可以做得更好。由于 DOM 事件会冒泡（从子元素到父元素），前端开发者中一种避免在许多元素上绑定事件的常用技术是绑定到父元素上。一旦事件在父元素上触发，我们就可以使用事件的\
