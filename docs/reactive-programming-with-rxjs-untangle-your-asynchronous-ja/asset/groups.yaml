    \n## 副作用与外部状态\n\n如果一个动作对其发生范围之外产生了影响，我们称之为为**副作用**（side effect）。更改函数外部的变量、打印到控制台或更新数据库中的值都是副作用的例子。\n\
    \n例如，更改函数内部变量的值是安全的。但如果该变量位于函数范围之外，那么其他函数就可以改变它的值。我们的函数不再拥有控制权，它无法假设外部变量包含了我们预期的值。我们需要跟踪它并添加检查，以确保它的值符合我们的预期。到那时，我们就会添加与程序逻辑无关的代码，使其变得更加复杂且容易出错。\n\
    \n虽然副作用对于构建任何有趣的程序都是必不可少的，但我们应该努力在代码中尽可能减少它们。在响应式程序中，我们有很多随时间变化的活动部分。在书中，我们将追求避免外部状态和副作用的方法。事实上，在第\
    \ 39 页的第 3 章“构建并发程序”中，我们将构建一个没有任何副作用的视频游戏。\n\n我们满足了早期的需求，但对于如此简单的目标却得到了相当复杂的代码。这种代码难以维护，对于第一次查看它的开发者来说并不直观。更重要的是，我们让它在未来容易产生细微的\
    \ bug，因为我们需要保持状态。\n\n在那种情况下，我们想要的只是查询点击的“数据库”。如果我们处理的是关系型数据库，将使用声明式语言 SQL：\n\n\
