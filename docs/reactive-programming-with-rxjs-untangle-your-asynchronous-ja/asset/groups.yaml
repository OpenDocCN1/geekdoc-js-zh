    ```\n"
  mdcn: "\n\n## 第 1 章 响应式之道\n\n我们可以将流式序列（streaming sequence）看作一个数组，其中的元素是通过时间而不是内存分隔的。无论是通过时间还是内存，我们都拥有元素序列：\n\
