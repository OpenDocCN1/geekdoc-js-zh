    \ 调用 `onCompleted`，图中用垂直线表示。\n\n来看涉及多个 `Observable` 的示例。`merge` 操作符接收两个不同的 `Observable`\
    \ 并返回一个带有合并值的新 Observable。`interval` 操作符返回一个以给定时间间隔（毫秒）产生递增数字的 `Observable`。\n\
    \n在下面的代码中，我们将合并两个使用 `interval` 以不同间隔产生值的 `Observable`：\n\n```\nvar a = Rx.Observable.interval(200).map(function(i)\
    \ {\n  return 'A' + i;\n});\nvar b = Rx.Observable.interval(100).map(function(i)\
    \ {\n  return 'B' + i;\n});\nRx.Observable.merge(a, b).subscribe(function(x) {\n\
    \  console.log(x);\n});\n```\n\n+   - B0, A0, B1, B2, A1, B3, B4...\n\n"
