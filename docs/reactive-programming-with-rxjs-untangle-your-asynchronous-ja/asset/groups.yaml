    \ another Observable, and we can push values to whenever we want.\n\nspaceship_reactive/score.js\n\
    \n```\nvar ScoreSubject = new Rx.BehaviorSubject(0);\nvar score = ScoreSubject.scan(function(prev,\
    \ cur) {\n  return prev + cur;\n}, 0);\n```\n\nIn that code we use the scan operator\
    \ to sum each new value to the total aggregate result.\n\nNow we have to push\
    \ score to our Subject whenever we hit an enemy; that happens in paintHeroShots.\n\
    \nspaceship_reactive/score.js\n\n```\nvar SCORE_INCREASE = 10;\nfunction paintHeroShots(heroShots,\
