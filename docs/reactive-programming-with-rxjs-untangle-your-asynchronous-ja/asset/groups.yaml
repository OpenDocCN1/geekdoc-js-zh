    \ operator to manipulate a sequence. It is, in fact, the base implementation for\
    \ a whole subset of methods called aggregate operators.\n\n# Aggregate Operators\n\
    \nAggregate operators process a sequence and return a single value. For example,\
    \ Rx.Observable.first takes an Observable and an optional predicate function and\
    \ returns the first element that satisfies the condition in the predicate.\n\n\
    Calculating the average value of a sequence is an aggregate operation as well.\
