    \ RxJS 技能：\n\n- 添加第二个（或第三个！）以不同速度移动的星场来创建视差效果。可以通过多种方式实现。尝试重用现有代码并尽可能声明式地完成。\n\
    - 让敌人变得不可预测，让它们以随机间隔发射，而不是 `ENEMY_SHOOTING_FREQ` 中指定的频率。如果你能让它们随着玩家分数的提高而射得更快将获得额外奖励！\n\
    - 允许玩家在短时间内击中多个敌人获得更多分数。\n\n# 总结\n\n我们仅使用 Observables 就为浏览器构建了一个完整的游戏，并在此过程中，我们看到了许多处理并发以及组合和转换\
    \ Observables 的极其方便的方法。这是 RxJS 的优势之一；总有方法可以帮助解决你尝试处理的问题。随时在 RxJS 文档中探索它们¹。\n\n\
    响应式编程让编写并发程序变得简单。Observable 抽象和强大的 RxJS 方法让程序的不同部分之间进行高效交互变得很自然。不依赖外部状态的编程可能需要一些适应，但它具有巨大的好处。我们可以将整个行为封装在单个\
    \ Observable 管道中，使我们的程序更加健壮可靠。\n\n在下一章中，我们将回到地震可视化器应用程序，并添加一个 Node.js 服务器部分，显示与地震相关的推文。我们还将改进其用户界面，使其看起来像一个真实的地震仪表盘。\n\
    \n> ¹ https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/core/observable.md\n\
