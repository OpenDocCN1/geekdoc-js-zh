    \ each earthquake.\n\n## Going Deeper\n\nCan we do better?\n\n## What Is JSONP?\n\
    \nJSONP—or JSON padding—is a technique for bypassing cross-origin request restrictions.\
    \ It works by loading a `<script>` tag that points to a different domain, which\
    \ returns a function call with the data as an argument.\n\nSame-origin policy:\
    \ https://en.wikipedia.org/wiki/Same-origin_policy\n\nLibraries like RxJS automate\
    \ this by providing operators that handle these complexities internally.\n\n##\
    \ There Is Always a Method\n\nSo far we've used RxJS operators included in rxall.js,\
    \ but it's usually worth checking out operators that come with other RxJS-based\
    \ libraries. In our case, we'll look at RxJS-DOM. RxJS-DOM is an external library\
    \ that, among others, can create an operator to handle JSON requests: jsonRequest.\n"
  mdcn: "\n\n## 第 2 章 深入理解序列 • 30\n\n我们还将使用 JavaScript 库 Leaflet 来渲染交互式地图。让我们来看看我们的\
    \ `index.html` 是什么样的，并回顾一下重点：\n\nexamples_earthquake/index.html\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en-us\">\n<head>\n  <meta charset=\"utf-8\">\n  <link rel=\"\
    stylesheet\" href=\"http://cdn.leaflet.js/leaflet-0.7.3/leaflet.css\" />\n  <script\
    \ src=\"http://cdn.leaflet.js/leaflet-0.7.3/leaflet.js\"></script>\n  <script\
    \ src=\"./quake.all-4.0.0.js\"></script>\n  <script src=\"./dom-7.0.3.js\"></script>\n\
    \  <title>Earthquake map</title>\n  <style type=\"text/css\">\nhtml, body {\n\
    \  margin: 0;\n  padding: 0;\n  height: 100%;\n}\n\n#map { height: 100%; }\n</style>\n\
    </head>\n<body>\n<div id=\"map\"></</div> <!-- map -->\n<script>\n  var QUAKE_URL\
    \ = 'http://earthquake.usgs.gov/earthquakes/feed/v1.0/' + \n  'summary/all_day.geojsonp';\n\
    \n  function loadJSONP(url) {\n  var script = document.createElement('script');\n\
    \  script.src = url;\n\n  var head = document.getElementsByTagName('head')[0];\n\
    \  head.appendChild(script);\n  }\n\n  var map = L.map('map').setView([33.85631,\
    \ -118.279602], 7);\n  L.tileLayer('http://{s}.tile.osm.org/{z}/{y}.png').addTo(map);\n\
    </script>\n  <script src=\"code.js\"></script> <!-- code -->\n</body>\n</html>\n\
    ```\n\n这是 Leaflet 用于渲染我们地图的占位 `div` 元素。\n\n这是我们用来来加载 JSONP 内容的辅助函数。\n\n## 制作实时地震可视化器\
    \ • 31\n\n我们通过将坐标设置为洛杉矶的中心（那里有很多地震！）并设置合理的缩放级别来初始化 Leaflet 地图。\n\n我们告诉 Leaflet\
    \ 为我们的地图设置默认瓦片集（tile set）。瓦片集就像是地图的“主题”。\n\n最后，我们在 DOM 和地图初始化之后加载我们的代码。\n\n##\
    \ 获取地震位置\n\n现在我们的 HTML 已经准备好了，可以为应用程序编写逻辑了。首先，我们需要知道获取的是什么样的数据，以及我们需要哪些数据来在地图上表示地震。\n\
    \n来自 USGS 网站的 JSONP 数据如下：\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_50_0.png)\n\
    \n```json\neqfeed_callback({\n  \"type\": \"FeatureCollection\",\n  \"metadata\"\
    : {\n    \"generated\": 1408030886000,\n    \"url\": \"http://earthquake.usgs.gov/earthquakes/...\"\
    ,\n    \"title\": \"USGS All Earthquakes, Past Day\",\n    \"status\": 200, \"\
    api\": \"1.0.13\", \"count\": 134\n  },\n  \"features\": [\n    {\n      \"type\"\
    : \"Feature\",\n      \"properties\": {\n        \"mag\": 0.82,\n        \"title\"\
    : \"M 0.8 - 3km WSW of Idyllwild-Pine Cove, California\",\n        \"place\":\
    \ \"3km WSW of Idyllwild-Pine Cove, California\",\n        \"time\": 1408030368460\n\
    \      },\n      \"geometry\": {\n        \"type\": \"Point\",\n        \"coordinates\"\
    : [ -116.7366667, 33.7303333, 17.33]\n      },\n      \"id\": \"ci55538377\"\n\
    \    },\n    ...\n  ]\n})\n```\n\n`features` 数组包含一个今天发生的所有地震数据的对象。那数据量非常大！一天之内发生这么多地震，真是令人惊叹（也令人恐惧）。对于我们的程序，我们只需要每个地震的坐标、标题和震级。\n\
    \n我想先创建一个 Observable 来获取数据集并发射单个地震。这是第一个版本：\n\nexamples_earthquake/code.js\n\n\
    ```javascript\nvar quakes = Rx.create(function(observer) {\n  window.efeed_callback\
    \ = function(response) {\n    var quakes = response.features;\n    quakes.forEach(function(quake)\
    \ {\n      observer.onNext(quake);\n    });\n  };\n  loadJSONP(QUAKE_URL);\n});\n\
    \nquakes.subscribe(function(quake) {\n  var coords = quake.geometry.coordinates;\n\
    \  var size = quake.properties.mag * 10000;\n  L.circle([coords[1], coords[0]],\
    \ size).addTo(map);\n});\n```\n\n等等，我们代码中那个显眼的函数 `window.efeed_callback` 是在做什么？嗯，事实证明\
    \ `window.efeed_callback` 只是 JSONP 请求的回调函数。我们在全局 `window` 对象上定义了它，这样 USGS 网站的脚本在数据准备就绪就可以调用它。\n\
    \n`features` 数组包含一个今天发生的所有地震数据的对象。那数据量非常大！一天之内发生这么多地震，真是令人惊叹（也令人恐惧）。对于我们的程序，我们只需要每个地震的坐标、标题和震级。\n\
    \n## 进阶\n\n我们可以做得更好吗？\n\n## 什么是 JSONP？\n\nJSONP（或 JSON padding）是一种绕过跨域请求限制的技术。它通过加载指向不同域的\
    \ `<script>` 标签工作，该标签返回一个以数据作为参数的函数调用。\n\n同源策略：https://en.wikipedia.org/wiki/Same-origin_policy\n\
    \nRxJS 等库通过提供内部处理这些复杂性的运算符来实现这一点。\n\n## 总是有方法\n\n到为止，我们使用的是 `rxall.js` 中包含的 RxJS\
    \ 运算符，但通常值得查看其他基于 RxJS 的库提供的运算符。在我们的案例中，查看 RxJS-DOM。RxJS-DOM 是一个外部库，它等功能之一是可以创建一个处理\
    \ JSON 请求的运算符：`jsonRequest`。\n\n"
