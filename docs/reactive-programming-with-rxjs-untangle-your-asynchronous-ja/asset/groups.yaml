  mdcn: "\n这段代码的功能与我们之前的完全相同，但我们不需要为 `XMLHttpRequest` 创建一个包装器；它已经存在了。请注意，这次我们省略了 `onCompleted`\
    \ 回调，因为我们不计划在 `Observable` 完成时做出反应。我们知道它只会产生一个结果，而且我们已经在 `onNext` 回调中使用它了。\n\n\
    在本书中，我们将使用许多方便的操作符。RxJS 特是“开箱即用”（batteries included）。事实上，这是它的主要优势之一。\n\n## 统治一切的数据类型\n\
    \n在 RxJS 程序中，我们应该努力让所有数据都进入 `Observable`，而不仅仅是来自异步源的数据。这样做可以轻松地组合来自不同来源的数据，例如现有数组与回调的结果，或者用户触发的\
    \ `XMLHttpRequest` 事件的结果。\n\n例如，如果我们有一个 `items` 数组需要与其他地方的数据结合，那么将此数组转换为 `Observable`\
    \ 会更好。（显然，如果数组只是一个不需要组合的中间变量，则没有必要这样做。）在整本书中，你将学习在什么情况下将数据类型转换为 `Observable` 是值得的。\n\
    \nRxJS 提供了从大多数 JavaScript 数据类型创建 `Observable` 的操作符。让我们来看一下最常用的几个，你将一直使用它们：数组、事件和回调。\n\
    \n## 从数组创建 Observable\n\n我们可以使用多用途的 `from` 操作符将任何类数组或可迭代对象转换为 `Observable`。`from`\
    \ 接收数组作为参数并返回一个发射其每个元素的 `Observable`。\n\n```\nRx.Observable\n  .from(['Adrià',\
    \ 'Jen', 'Sergi'])\n  .subscribe(\n    function(x) { console.log('Next: ' + x);\
    \ },\n    function(err) { console.log('Error:', err); },\n    function() { console.log('Completed');\
    \ }\n  );\n```\n\n`from` 与 `event` 一样，是 RxJS 代码中最方便且最常用的操作符之一。\n\n## 从 JavaScript\
    \ 事件创建 Observable\n\n当我们把事件转换为 `Observable` 时，它就变成了一个可以组合和传递的等等值。例如，这里有一个 `Observable`\
    \ 在鼠标指针移动时都会发射鼠标指针的坐标：\n\n```\nvar allMoves = Rx.Observable.fromEvent(document,\
    \ 'mousemove')\nallMoves.subscribe(function(e) {\n  console.log(clientX, e.clientY);\n\
    });\n```\n\n将事件转换为 `Observable` 释放了从其自然限制中的事件。更重要的是，我们可以根据原始的 `Observable` 创建新的\
    \ `Observable`。这些新的 `Observable` 是独立的，可以用于不同的任务：\n\n```\nvar movesOnTheRight =\
    \ allMoves.filter(function(e) {\n  return clientX > window.innerWidth / 2;\n});\n\
    \nvar movesOnTheLeft = allMoves.filter(function(e) {\n  return clientX < window.innerWidth\
    \ / 2;\n});\n\nmovesOnTheRight.subscribe(function(e) {\n  console.log('Mouse is\
    \ on the right:', e.clientX);\n});\n\nmovesOnTheLeft.subscribe(function(e) {\n\
    \  console.log('Mouse is on the left:', e.clientX);\n});\n```\n\n在前面的代码中，我们从原始的\
    \ `allMoves` 创建了两个 `Observable`。每个都只包含原始数据过滤后的项：`movesOnTheRight` 包含了屏幕右侧的鼠标事件，而\
    \ `movesOnTheLeft` 包含了屏幕左侧的鼠标事件。它们中的任何一个都没有修改原始的 `Observable`：`allMoves` 将继续发射所有的鼠标移动。`Observable`\
    \ 是不可变的，应用在它们上的每个操作符都会创建一个新的 `Observable`。\n\n## 从回调函数创建 Observable\n\n如果你使用第三方\
    \ JavaScript 库，你很有可能需要与基于回调的代码进行交互。我们可以使用两个函数 `fromCallback` 和 `NodeCallback`\
    \ 将这些回调转换为 `Observable`。Node.js 遵循一种约定，即在调用回调函数时先传递错误参数，以指示回调函数发生了问题。我们随后使用 `fromCallback`\
    \ 专门从 Node.js 风格的回调创建 `Observable`：\n\n```\nvar Rx = require('rx'); // 加载 RxJS\n\
    var fs = require('fs'); // 加载 Node.js 文件模块\n// 从 readdir 方法创建 Observable\nvar\
    \ readdir = Rx.Observable.fromNodeCallback(fs.readdir);\n// 发送延迟消息\nvar source\
    \ = readdir('/Users/Sergi');\nvar subscription = source.subscribe(\n  function(res)\
    \ { console.log('List of directories: ' + res); },\n  function(err) { console.log('Error:\
    \ ' + err); },\n  function() { console.log('Done!'); }); });\n```\n\n在前面的代码中，我们用\
    \ Node.js 的 `readdir` 方法创建了一个 `Observable` 读取器。`fs.readdir` 接收目录路径和一个回调函数 `delayedMsg`，该回调会在获取目录内容后调用一次。\n\
    \n我们使用传递给原始 `fs.readdir` 的相同参数调用 `readdir`，但除了回调函数。这返回了一个 `Observable`，当我们对其订阅一个观察者时，它将正确地使用\
    \ `onNext`、`onError` 和 `onCompleted`。\n\n## 总结\n\n在本章中，我们探索了响应式编程方法，并看到 RxJS 如何通过\
    \ `Observable`解决其他方法（如回调或 Promise）的问题。现在你理解了为什么 `Observable` 是强大的，并且知道如何创建它们。有了这个基础，我们现在可以创建更多有趣的响应式程序。下一章将向你展示如何创建和组合基于序列的程序，为\
    \ Web 开发中的一些常见场景提供更“Observable”的方法。\n\n## 可视化 Observable\n\n你即将学习一些我们最常用的操作符。讨论操作符对序列做了什么可能很抽象。为了帮助开发者轻松理解操作符，我们将使用一种序列的标准视觉表示，称为弹性图（marble\
    \ diagrams）。它们直观地表示了异步数据流。\n\nRange\n\n来看 `range` 操作符，它返回一个发射指定范围内整数的 `Observable`：`Rx.Observable.range(1,\
