    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search;\
    \ });\n}\n```\n\nFirst we declare some URLs our application will use to query\
    \ Wikipedia. In\nt function searchRequest we take a responses object that contains\
    \ all the\ndrivers in our application, and we use the method in the DOM driver.\n\
    select(element).event(type) behaves similarly to fromEvent: it takes a selector\
    \ for a\nDOM element and the function of event to listen to and returns an Observable\n\
    that emits events.\n\nFrom that moment on, the rest of the code should look pretty\
    \ familiar to you,\nsince it consists of transforming an Observable's values through\
    \ our usual\noperators:\n\n+   - Throttle to receive one every 300 milliseconds\
    \ at most.\n\n+   - Extract the value of the input box.\n\n+   - Append the final\
    \ value to Wikipedia's API URL.\n\nGreat! So far we have the function to generate\
    \ the UI and the function to\nretrieve user input from that UI. We now need to\
    \ add the functionality that\nwill get the information from Wikipedia.\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_128_0.png)"
- md: "\n## Revising Our main Function\n\nYou may have noticed the code on page 106\
    \ that the main function takes a parameter, `responses`, that we're not using.\
    \ These are the responses that come from drivers in the `run` function. The drivers\
    \ and the main function form a cycle (hence the name of the framework): the output\
    \ of `main` is the input of the `drivers`, and the output of the `drivers` is\
    \ the input for `main`. And remember, input and outputs are always Observables.\n\
    \nWe use JSONP to query Wikipedia, as we did in Chapter 2. We use JSONP instead\
    \ of HTTP to make it easier to run this example on our local computers; retrieving\
    \ data from a different domain using HTTP causes some browsers to block these\
    \ requests for security reasons. In almost any other situation, especially in\
    \ production code, use HTTP to retrieve remote data.\n\nIn any case, using JSONP\
    \ doesn't affect the point of this chapter. Cycle has an experimental module for\
    \ JSONP, and we can install it using npm:\n\n```bash\nnpm install @cycle/json\n\
    ```\n\nThen we use it in application like this:\n\n```javascript\ncycle/step2.js\n\
    var Cycle = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom');\nvar\
    \ CycleJSONP = require('@cycle/json');\nvar Rx = Cycle.Rx;\nvar h = CycleDOM.h;\n\
    \nfunction searchQuery(responses) {\n  return responses.select('.search-field').events('input')\n\
    \    .debounce(300)\n    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search\
    \ });\n}\n\nfunction treeElements(results) {\n  return h('div', {\n    h('h1',\
    \ 'Wikipedia Search '),\n    h('input', {className:'search-field', attributes:\
    \ {type: 'text'}}),\n    h('hr'),\n    h('div', results.map(function(result) {\n\
    \      return h('div', {\n        h('a', { href: API_URL + result.title }, result.title)\n\
    \      });\n    }));\n  });\n}\n```\n\n```javascript\nfunction main(responses)\
    \ {\n  return {\n    DOM: Rx.Observable.just(CycleDOM.h('span', 'Hey there!')),\n\
    \    JSONP: searchRequest(responses)\n  }\n}\n```\n\n```javascript\nvar drivers\
    \ = {\n  DOM: CycleDOM.makeDriver('#container'),\n  JSONP: CycleJSONP.makeJSONPDriver()\n\
    };\n\nCycle.run(main, drivers);\n```\n\nWe want to plug the `searchRequest` into\
    \ the JSONP driver, so that as soon as the user types a search term, we query\
    \ Wikipedia with the term.\n\nTo do that, we create a new JSONP driver using `CycleJSONP.makeJSONPDriver`,\
    \ which will receive whatever we put in the property `JSONP` in the return object\
    \ from `main`. After doing that, we should already be querying Wikipedia when\
    \ we introduce a search term in the input box, but we're not connecting the JSONP\
    \ output to anything, we don't see any changes on the page. Let's change that:\n\
    \n### cycle/step3.js\n\n```javascript\nfunction main(responses) {\n  var vtree$\
    \ = responses.JSONP\n    .filter(function(res) {\n      return res.request.indexOf(API_URL)\
    \ === 0;\n    })\n    .mergeAll()\n    .pluck('query', 'search')\n    .startWith([])\n\
    \    .map(vtreeElements);\n  return {\n    DOM: vtree$,\n    JSONP: searchRequest(responses)\n\
    \  }\n}\n```\n\n`main` receives the output of all drivers through its `responses`\
    \ parameter. We can get the result of the JSON calls in `responses.JSONP`, an\
    \ Observable of all the JSONP responses in our application. We have that, we can\
    \ transform the Observable to get the search results in our format we want:\n\n\
    - `responses.JSONP` emits all JSONP responses in the application. We start by\
    \ filtering the ones that contain the API URL of Wikipedia in its request, to\
    \ make sure that we're processing the relevant responses.\n- `responsesJSON` is\
    \ an Observable of Observables. For each response there is an Observable. In this\
    \ line we flatten them all out, so we deal with the responses themselves from\
    \ now on, instead of the Observables.\n\nThe responses are JSON objects, and the\
    \ information we're interested in is in the `search` property. We use the `pluck`\
    \ operator to extract it.\n\nWe don't know if we'll have results, so at the very\
    \ least we ensure we'll have an empty array.\n\nFinally, we apply our `treeElements`\
    \ function to every result from Wikipedia. This will update our UI.\n\nNotice\
    \ the `$` at the end of the variable's name. In this chapter I'm adopting a naming\
    \ convention in Cycle.js code that adds `$` to the name of a variable to that\
    \ it is an Observable. For that it makes it much easier to understand Observable-based\
    \ code!\n\nThe most important takeaway from the preceding code is that in the\
    \ last step we seem to be repainting the whole UI for every single result we receive.\
    \ But here's where the virtual DOM shines. No matter how many times we rerender\
    \ the page, the virtual DOM will ensure that all the differences are rendered,\
    \ making it very efficient. If there are no changes to the virtual DOM, no changes\
    \ will be rendered in the page.\n\nThis way we don't have to worry about adding\
    \ or removing elements. We just render the whole application every time.\n\n###\
    \ Chapter 6. Reactive Web Applications with Cycle.js\n\n### cycle/index.js\n\n\
    ```javascript\nfunction intent(JSONP) {\n  return JSONP\n    .filter(function(res)\
    \ {\n      return res.request.indexOf(API_URL) === 0;\n    })\n    .mergeAll()\n\
    \    .pluck('query', 'search')\n    .startWith([]);\n}\n\nfunction model(actions)\
    \ {\n  return actions;\n}\n\nfunction view(state) {\n  return h('div',\n    h('h1',\
    \ 'Wikipedia Search'),\n    h('input', {className: 'search-field', attributes:\
    \ {type: 'text'}}),\n    h('hr'),\n    h('div', state.map(function(link) {\n \
    \     return h('div', {\n        h('a', {href: WIKI_URL + link.title}, link.title)\n\
    \      });\n    }))\n  );\n}\n\nfunction userIntent(DOM) {\n  return DOM.select('.search-field').events('input',\n\
    \    .debounce(300)\n    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search;\
    \ })\n  );\n}\n\nfunction main(responses) {\n  return {\n    DOM: view(model(intent(responses.JSONP))),\n\
    \    JSONP: userIntent(responses.DOM)\n  };\n}\n\nCycle.run(main, {\n  DOM: CycleDOM.makeDriver('#container'),\n\
    \  JSONP: CycleJSONP.makeJSONPDriver()\n});\n```\n\n## Creating Reusable Widgets\n\
    \nAs we make more complex applications, we'll want to reuse some of their UI components.\
    \ Our Wikipedia Search application is tiny for the sake of example, but it already\
    \ has a couple of components that could be reused in other\n"
  mdcn: "\n\n## 修改我们的 main 函数\n\n你可能已经注意到第 106 页的代码了，`main` 函数接收一个参数 `responses`，但我们并没有使用它。这些响应是来自\
    \ `run` 函数中驱动程序（drivers）的响应。驱动程序和 `main` 函数形成循环（这也是框架命名的由来）：`main` 的输出是 `drivers`\
    \ 的输入，而 `drivers` 的输出是 `main` 的输入。记住，输入和输出始终是 Observable（可观察）。\n\n我们像在第 2 章中那样使用\
    \ JSONP 来查询维基百科。我们使用 JSONP 而不是 HTTP 是为了方便在本地计算机上运行此示例；使用 HTTP 从不同域检索数据会导致某些浏览器出于安全考虑阻止这些请求。在几乎任何其他情况下，特别是生产代码中，请使用\
    \ HTTP 获取远程数据。\n\n无论如何，使用 JSONP 不会影响本章的重点。Cycle 有一个用于 JSONP 的实验模块，我们可以使用 npm 安装它：\n\
    \n```bash\nnpm install @cycle/json\n```\n\n然后我们在应用程序中这样使用它：\n\n```javascript\n\
    cycle/step2.js\nvar Cycle = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom');\n\
    var CycleJSONP = require('@cycle/json');\nvar Rx = Cycle.Rx;\nvar h = CycleDOM.h;\n\
    \nfunction searchQuery(responses) {\n  return responses.select('.search-field').events('input')\n\
    \    .debounce(300)\n    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search\
    \ });\n}\n\nfunction treeElements(results) {\n  return h('div', {\n    h('h1',\
    \ 'Wikipedia Search '),\n    h('input', {className:'search-field', attributes:\
    \ {type: 'text'}}),\n    h('hr'),\n    h('div', results.map(function(result) {\n\
    \      return h('div', {\n        h('a', { href: API_URL + result.title }, result.title)\n\
    \      });\n    }));\n  });\n}\n```\n\n```javascript\nfunction main(responses)\
    \ {\n  return {\n    DOM: Rx.Observable.just(CycleDOM.h('span', 'Hey there!')),\n\
    \    JSONP: searchRequest(responses)\n  }\n}\n```\n\n```javascript\nvar drivers\
    \ = {\n  DOM: CycleDOM.makeDriver('#container'),\n  JSONP: CycleJSONP.makeJSONPDriver()\n\
    };\n\nCycle.run(main, drivers);\n```\n\n我们想将 `searchRequest` 接入 JSONP 驱动程序，这样用户一输入搜索词，我们就能用该词语查询维基百科。\n\
    \n为了做到这一点，我们使用 `CycleJSONP.makeJSONPDriver` 创建一个新的 JSONP 驱动程序，它将接收我们放入 `main`\
    \ 返回对象中 `JSONP` 属性的任何内容。完成之后，当我们在输入框中引入搜索词时，应该已经开始查询维基百科了，但我们还没有将 JSONP 输出连接到任何地方，页面上没有看到任何变化。让我们改变这一点：\n\
    \n### cycle/step3.js\n\n```javascript\nfunction main(responses) {\n  var vtree$\
    \ = responses.JSONP\n    .filter(function(res) {\n      return res.request.indexOf(API_URL)\
    \ === 0;\n    })\n    .mergeAll()\n    .pluck('query', 'search')\n    .startWith([])\n\
    \    .map(vtreeElements);\n  return {\n    DOM: vtree$,\n    JSONP: searchRequest(responses)\n\
    \  }\n}\n```\n\n`main` 通过其 `responses` 参数接收所有驱动程序的输出。我们可以在 `responses.JSONP` 中获取\
    \ JSON 调的结果，它是应用程序中所有 JSONP 响应的 Observable。有了它，我们就可以转换这个 Observable 以获取我们所需格式的搜索结果：\n\
    \n- `responses.JSONP` 发出应用程序中所有的 JSONP 响应。我们首先过滤掉那些在请求中包含维基百科 API URL 的响应，以确保我们处理的是相关的响应。\n\
    - `responsesJSON` 是一个 Observable 的 Observable（Observable of Observables）。每个响应对应一个\
    \ Observable。在这一行中，我们将它们全部扁平化，从现在开始我们处理响应本身，而不是 Observable。\n\n响应是 JSON 对象，我们感兴趣的信息在\
    \ `search` 属性中。我们使用 `pluck` 算符来提取它。\n\n我们不知道是否会有结果，所以至少我们要确保会有一个空数组。\n\n最后，我们将\
    \ `treeElements` 函数应用到来自维基百科的每个结果。这将更新我们的 UI。\n\n注意变量名末尾的 `$`。在本章中，我采用了 Cycle.js\
    \ 代码中的一种命名规范，在变量名后添加 `$` 以表示它是一个 Observable。这使得理解基于 Observable 的代码变得简单得多！\n\n\
    上述代码最重要的收获是：在最后一步中，我们似乎为收到的每一个结果都重新绘制了整个 UI。但正是虚拟 DOM 发光的地方。无论重新渲染页面多少次，虚拟 DOM\
    \ 都会确保所有的差异都被渲染，这非常高效。如果虚拟 DOM 没有变化，则页面上不会渲染任何变化。\n\n这样，我们就不需要担心添加或删除元素。我们每次只需渲染整个应用程序。\n\
    \n### 第 6 章 使用 Cycle.js 构建响应式 Web 应用\n\n### cycle/index.js\n\n```javascript\n\
    function intent(JSONP) {\n  return JSONP\n    .filter(function(res) {\n      return\
    \ res.request.indexOf(API_URL) === 0;\n    })\n    .mergeAll()\n    .pluck('query',\
    \ 'search')\n    .startWith([]);\n}\n\nfunction model(actions) {\n  return actions;\n\
    }\n\nfunction view(state) {\n  return h('div',\n    h('h1', 'Wikipedia Search'),\n\
    \    h('input', {className: 'search-field', attributes: {type: 'text'}}),\n  \
    \  h('hr'),\n    h('div', state.map(function(link) {\n      return h('div', {\n\
    \        h('a', {href: WIKI_URL + link.title}, link.title)\n      });\n    }))\n\
    \  );\n}\n\nfunction userIntent(DOM) {\n  return DOM.select('.search-field').events('input',\n\
    \    .debounce(300)\n    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search;\
    \ })\n  );\n}\n\nfunction main(responses) {\n  return {\n    DOM: view(model(intent(responses.JSONP))),\n\
    \    JSONP: userIntent(responses.DOM)\n  };\n}\n\nCycle.run(main, {\n  DOM: CycleDOM.makeDriver('#container'),\n\
    \  JSONP: CycleJSONP.makeJSONPDriver()\n});\n```\n\n## 创建可复用的组件\n\n随着我们构建更复杂的应用程序，我们将复用一些\
    \ UI 组件。我们的维基百科搜索应用程序为了示例非常小，但它已经有一些可以在其他地方复用的组件了\n\n"
