    \nIterators are great to encapsulate traversing logic for any kind of data structure.\
    \ As we saw in the preceding example, iterators get interesting when made generic\
    \ to handle different types of data, or when they can be configured in runtime,\
    \ like like we did in our example with the divisor parameter.\n\n# The Rx Pattern\
    \ and the Observable\n\nWhile the Observer and the Iterator patterns are powerful\
    \ in their own right, the combination of both is even better. We call this the\
    \ Rx pattern, named after the Reactive Extensions libraries. We'll be using this\
    \ pattern for the rest of the book.\n\nThe Observable sequence, or simply Observable\
    \ is central to the Rx pattern. An Observable emits its values in order—like an\
    \ iterator—but instead of consumers requesting the next value, the Observable\
    \ “pushes” values to consumers as they become available. It has a similar role\
    \ to the Producer in the Observer pattern: emitting values and pushing them to\
    \ its listeners.\n\n> Pulling vs. Pushing\n> In, push-based behavior means that\
    \ the server component of an application sends updates to its clients instead\
    \ of the clients having to poll the server for these updates. It's like saying,\
    \ \"Don't call us; we'll call you.\"\n> RxJS is push-based, so the source of events\
    \ (the Observable) will push new values to the consumer (the Observer), without\
    \ the consumer requesting the next value.\n\nPut more simply, an Observable is\
    \ a sequence whose items become available over time. The consumers of Observables,\
    \ Observers, are the equivalent of listeners in the Observer pattern. When an\
    \ Observer is subscribed to an Observable, it will receive the values in the sequence\
    \ as they become available, without having to request them.\n\n- 2. https://rx.codeplex.com/\n\
    \nSo far it seems there's not much of a difference from the traditional Observer\
    \ pattern. But actually there are two essential differences:\n\n- An Observable\
    \ doesn't start streaming items until it has at least one Observer subscribed\
    \ to it.\n- Like iterators, an Observable can signal when the sequence is completed.\n\
    \nUsing Observables, we can declare how to react to the sequence of elements they\
    \ emit, instead of reacting to individual items. We can efficiently copy, transform,\
    \ and query the sequence, and these operations will apply to all the elements\
    \ of the sequence.\n\n# Creating Observables\n\nThere are several ways to create\
    \ Observables, the create operator being the most obvious one. The create operator\
