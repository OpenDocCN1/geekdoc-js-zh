- md: "\n# Implicit Cancellation: By Operator\n\nMost of the time, operators will\
    \ automatically cancel subscriptions for you. Operators such as range or take\
    \ cancel the subscription when the sequence finishes or when the operator conditions\
    \ are met. More advanced operators such as latestFrom or flatMap will internally\
    \ create and destroy subscriptions as needed, they handle several Observables\
    \ in motion. In short, you should not worry about canceling most subscriptions.\n\
    \n# Observables That Wrap External APIs\n\nWhen you're using Observables that\
    \ wrap external APIs that don't provide cancellation, the Observable will still\
    \ be emitting notifications when canceled, but the underlying API will not necessarily\
    \ be canceled. For example, if you're using an Observable that wraps a promise,\
    \ the Observable will stop emitting when canceled, but the underlying promise\
    \ will not be canceled.\n\nIn the following code, we attempt to cancel a subscription\
    \ to an Observable that wraps a promise `p`, and at the same time we set an action\
    \ in the traditional way for when the promise is resolved. The promise should\
    \ resolve in five seconds, but we cancel the subscription immediately after creating\
    \ it:\n\n```javascript\nvar p = new Promise(function(resolve, reject) {\n  window.setTimeout(resolve,\
    \ 5000);\n});\n\np.then(function() {\n  console.log('Potential side effect!');\n\
    });\n\nvar subscription = Rx.Observable.fromPromise(p).subscribe(function(msg)\
    \ {\n  console.log('Observable resolved!');\n});\n\nsubscription.dispose();\n\
    ```\n\nAfter 5 seconds, we see:\n\n> Potential side effect!\n\nIf we cancel the\
    \ subscription to the Observable it effectively stops it from receiving the notification.\
    \ But the promise's then method still runs, showing that canceling the Observable\
    \ doesn't cancel the underlying promise.\n\nIt's important to know the details\
    \ of external APIs that we use in Observables. You might think you've canceled\
    \ a sequence, but the underlying API keeps running and causes some side effects\
    \ in your program. These errors can be really hard to catch.\n\n# Handling Errors\n\
    \nWe can't use the conventional try/catch mechanism in callbacks because it is\
    \ synchronous. It would run before any asynchronous code, and wouldn't be able\
    \ to catch any errors.\n\nWith callbacks, this was solved by passing the error\
    \ (if any) as a parameter to the callback function. That works, but it makes the\
    \ code pretty fragile.\n\nLet's see how to catch errors inside Observables.\n\n\
    # The onError Handler\n\nRemember when we talked about the three methods we can\
    \ call on an Observer, in First Contact with Observers, on page 10? We're familiar\
    \ with onError and onCompleted, but we haven't yet used onError; it is the key\
    \ to effectively handling errors in Observable sequences.\n\nTo see how it works,\
    \ we'll write a simple function to take an array of JSON strings and return an\
    \ Observable that emits the objects parsed from those strings, using JSON.parse:\n\
    \n```javascript\nfunction getJSON(arr) {\n  return Rx.observable.from(arr).map(function(str)\
    \ {\n    var parsedJSON = JSON.parse(str);\n    return parsedJSON;\n  });\n}\n\
    \ngetJSON([\n  '{\"1\": 1, \"2\": 2}',\n  '{\"success\": true}', // Invalid JSON\
    \ string\n  '{\"enabled\": true}'\n]).subscribe({\n  function(json) {\n    console.log('Parsed\
    \ JSON: ', json);\n  },\n  function(err) {\n    console.log(err.message);\n  }\n\
    });\n```\n\nWe'll pass an array with three JSON strings to getJSON, in which the\
    \ second string in the array contains a syntax error, so JSON.parse won't be able\
    \ to parse it. Then we'll subscribe to the result, providing handlers for onNext\
    \ and onError:\n\nParsed JSON: {1: 1, 2: 2}\nJSON.parse: unterminated string at\
    \ line 1 column 8 of the JSON data\n\nThe Observable emits the parsed JSON for\
    \ the first result but throws an exception when trying to parse the second. The\
    \ onError handler catches this and prints it out. The default behavior is that\
    \ whenever an error happens, the Observable stops emitting items, and onCompleted\
    \ is not called.\n\n# Catching Errors\n\nSo far we've seen how to detect that\
    \ an error has happened and do something with that information, but we haven't\
    \ been able to react to it and continue with whatever we were doing. Observable\
    \ instances have the catch operator, which allows us to react to an error in the\
    \ Observable and continue with another Observable.\n\ncatch takes either an Observable\
    \ or a function that receives the error as a parameter and returns another Observable.\
    \ In our scenario, we want the Observable to emit a JSON object containing an\
    \ error property if there were errors in the original Observable:\n\n```javascript\n\
    function getJSON(arr) {\n  return Rx.Observable.from(arr).map(function(str) {\n\
    \    var parsedJSON = JSON.parse(str);\n    return parsedJSON;\n  });\n}\nvar\
    \ caught = getJSON(['{\"1\": 1, \"2\": 2}', '{\"1\": 1}']).catch(\n  Rx.Observable.return({\n\
    \    error: 'There was an error parsing JSON'\n  })\n).subscribe(\n  function(json)\
    \ {\n    console.log('Parsed JSON: ', json);\n  },\n  // Because we catch errors\
    \ now, `onError` will not be executed\n  function(e) {\n    console.log('ERROR',\
    \ e.message);\n  }\n});\n```\n\nIn the preceding code, we create a new Observable,\
    \ caught, that uses the catch operator to catch errors in the original Observable.\
    \ If there's an error it will continue the sequence with an Observable that emits\
    \ only one item, with an error property describing the error. This is the output:\n\
    \n+ Parsed JSON: {1: 1, 2: 2}\nParsed JSON: {error: \"There was an error parsing\
    \ JSON\"}\n\n# Chapter 2. Deep in the Sequence\n\nAnd here's the marble diagram\
    \ for catch:\n\n![](img/0247a79f7325c8a55eb84ba4fc3e6f2_47.png)\n\nNotice the\
    \ X to indicate that the sequence experienced an error. The different shape of\
    \ values—triangles in this case—means that they are values coming from another\
    \ Observable. Here, catch is useful for reacting to an error.\n\n# Retrying Sequences\n\
    \nSometimes errors just happen and there's not much we can do about it. For example,\
    \ there could be a timeout requesting data because the user has a spotty connection,\
    \ or a remote server that could crash. In these cases it would be great if we\
    \ kept requesting the data until we needed to succeed. The retry operator does\
    \ exactly that:\n\n```javascript\nsequences/error_handling.js\n```\n\n```javascript\n\
    // This will try to retrieve the remote URL up to 5 times.\nRx.DOM.get('/products').retry(5)\n\
    .subscribe(\n  function(xhr) { console.log(xhr); },\n  function(err) { console.error('ERROR:\
    \ ', err); }\n);\n```\n\nThere are two important things to know when using retry.\
    \ First, if we don't pass any parameters, it will retry indefinitely until the\
    \ sequence is finished with no errors. This is dangerous for performance if the\
    \ Observable keeps producing errors. If we're using synchronous Observables, it\
    \ would have the same effect as an infinite loop.\n\nSecond, retry will always\
    \ retry the whole Observable sequence again, even if some of the items didn't\
    \ error. This is important in case you're causing any side effects when processing\
    \ items.\n\n# Making a Real-Time Earthquake Visualizer\n\nUsing the concepts that\
    \ we've covered so far in this chapter, we'll build a web application that uses\
    \ RxJS to show where earthquakes are happening in real time. We'll start by building\
    \ a functional but naive reactive implementation, and we'll improve it as we go.\
    \ The final result will look like this:\n\n![](img/0247a79f7325c8a55eb84ba4fc3e6f2_48.png)\n\
    \n# Preparing Our Environment\n\nWe'll use the USGS (U.S. Geological Survey) earthquake\
    \ database, which offers a real-time earthquake dataset in several formats. We\
    \ will get our data from the weekly dataset in JSONP format.\n\n- 1. http://earthquake.usgs.gov/earthquakes/feed/v1.0/\n"
  mdcn: "\n\n# 通过操作符隐式取消\n\n大多数情况下，操作符会自动为你取消订阅。像 `range` 或 `take` 这样的操作符会在序列结束或满足操作条件时取消订阅。更高级的操作符如\
    \ `latestFrom` 或 `flatMap` 会根据需要内部创建并销毁订阅，它们处理了多个正在运行的 Observable。简而言之，你不需要担心取消大多数订阅。\n\
    \n# 封装外部 API 的 Observable\n\n当你使用封装了不提供取消功能的外部 API 的 Observable 时，即使被取消，Observable\
    \ 仍然会发射通知，但底层的 API并不一定会被取消。例如，如果你正在使用一个封装了 promise 的 Observable，当被取消时，Observable\
    \ 将停止发射，但底层的 promise 不会被取消。\n\n在下面的代码中，我们尝试取消对封装了 promise `p` 的 Observable 的订阅，同时用传统方式设置了\
    \ promise 解析后的动作。该 promise 将在五秒后解析，但我们在创建它后立即取消了订阅：\n\n```javascript\nvar p =\
    \ new Promise(function(resolve, reject) {\n  window.setTimeout(resolve, 5000);\n\
    });\n\np.then(function() {\n  console.log('Potential side effect!');\n});\n\n\
    var subscription = Rx.Observable.fromPromise(p).subscribe(function(msg) {\n  console.log('Observable\
    \ resolved!');\n});\n\nsubscription.dispose();\n```\n\n5 秒后，我们看到：\n\n> Potential\
    \ side effect!\n\n如果我们取消对该 Observable 的订阅，它实际上阻止了自己接收通知。但 promise 的 `then` 方法仍然运行，这说明取消\
    \ Observable 并不会取消底层的 promise。\n\n了解我们在 Observable 中使用的外部 API 的细节非常重要。你可能认为你已经取消了一个序列，但底层的\
    \ API 仍在运行并在你的程序中引起某些副作用。这些错误可能很难捕获。\n\n# 处理错误\n\n我们不能在回调函数中使用传统的 `try/catch`\
    \ 机制，因为它是同步的。它会在任何异步代码之前运行，并且无法捕获任何错误。\n\n在回调函数中，这个问题通过将错误（如果有）作为参数传递给回调函数来解决。这种方法可行，但它会让代码变得非常脆弱。\n\
    \n让我们看看如何在 Observable 内部捕获错误。\n\n# onError 处理器\n\n记得我们在《与 Observer 初次接触》第 10 页中讨论过可以在\
    \ Observer 上调用的三个方法吗？我们熟悉 `onError` 和 `onCompleted`，但我们还没有使用过 `onError`；它是有效处理\
    \ Observable 序列中错误的关键。\n\n为了查看它是如何工作的，我们将编写一个简单的函数，接收一个 JSON 字符串数组，并使用 `JSON.parse`\
    \ 返回一个发射从这些字符串解析出的对象的 Observable：\n\n```javascript\nfunction getJSON(arr) {\n\
    \  return Rx.observable.from(arr).map(function(str) {\n    var parsedJSON = JSON.parse(str);\n\
    \    return parsedJSON;\n  });\n}\n\ngetJSON([\n  '{\"1\": 1, \"2\": 2}',\n  '{\"\
    success\": true}', // 无效 JSON 字符串\n  '{\"enabled\": true}'\n]).subscribe({\n \
    \ function(json) {\n    console.log('Parsed JSON: ', json);\n  },\n  function(err)\
    \ {\n    console.log(err.message);\n  }\n});\n```\n\n我们将一个包含三个 JSON 字符串的数组传递给\
    \ `getJSON`，其中数组中的第二个字符串包含语法错误，因此 `JSON.parse` 无法解析它。然后我们对结果进行订阅，为 `onNext` 和\
    \ `onError` 提供处理程序：\n\nParsed JSON: {1: 1, 2: 2}\nJSON.parse: unterminated string\
    \ at line 1 column 8 of the JSON data\n\nObservable 为第一个结果发射了解析后的 JSON，但在尝试解析第二个时抛出了异常。`onError`\
    \ 处理器捕获并打印了它。默认行为是每当发生错误，Observable 停止发射项目，且不会调用 `onCompleted`。\n\n# 捕获错误\n\n\
    到为止，我们已经看到了如何检测错误发生并对该信息进行处理，但我们无法对其做出反应并继续正在正在做。Observable 实例拥有 `catch` 操作符，允许我们对\
    \ Observable 中的错误做出反应并继续另一个 Observable。\n\n`catch` 接收一个 Observable 或一个接收错误作为参数并返回另一个\
    \ Observable 的函数。在我们的场景中，如果原始 Observable 中存在错误，我们希望 Observable 发射一个包含 `error`\
    \ 属性的 JSON 对象：\n\n```javascript\nfunction getJSON(arr) {\n  return Rx.Observable.from(arr).map(function(str)\
    \ {\n    var parsedJSON = JSON.parse(str);\n    return parsedJSON;\n  });\n}\n\
    var caught = getJSON(['{\"1\": 1, \"2\": 2}', '{\"1\": 1}']).catch(\n  Rx.Observable.return({\n\
    \    error: 'There was an error parsing JSON'\n  })\n).subscribe(\n  function(json)\
    \ {\n    console.log('Parsed JSON: ', json);\n  },\n  // 因为我们现在捕获了错误，`onError`\
    \ 将不会执行\n  function(e) {\n    console.log('ERROR', e.message);\n  }\n});\n```\n\
    \n在前面的代码中，我们创建了一个新的 Observable `caught`，它使用 `catch` 操作符捕获原始 Observable 中的错误。如果发生错误，它将使用一个仅发射一个项目的\
    \ Observable 继续序列，项目包含一个描述错误的 `error` 属性。这是输出：\n\n+ Parsed JSON: {1: 1, 2: 2}\n\
    Parsed JSON: {error: \"There was an error parsing JSON\"}\n\n# 序列中的深度解析\n\n这里是\
    \ `catch` 的弹性图：\n\n![](img/0247a9f7325c8a55eb84ba4fc3e6f2_47.png)\n\n注意 X 表示序列发生了错误。不同的形状（在这种情况下是三角形）意味着它们来自另一个\
    \ Observable。在这里，`catch` 用于对错误做出反应。\n\n# 重试序列\n\n有时错误发生发生我们对此无能为力。例如，由于用户连接不稳定导致请求超时，或者远程服务器崩溃。在这些情况下，如果我们能一直请求数据直到成功就太好了。`retry`\
    \ 操作符正是如此：\n\n```javascript\nsequences/error_handling.js\n```\n\n```javascript\n\
    // 这将尝试获取远程 URL 5 次\nRx.DOM.get('/products').retry(5)\n.subscribe(\n  function(xhr)\
    \ { console.log(xhr); },\n  function(err) { console.error('ERROR: ', err); }\n\
    );\n```\n\n使用 `retry` 有两个重要的点。首先，如果不传递参数，它将无限重试直到序列无错误结束。如果 Observable 持续产生错误，这对性能是非常危险的。如果是同步\
    \ Observable，效果相当于无限循环。\n\n其次，`retry` 总是重试整个 Observable 序列，即使某些项目没有错误。如果你在处理项目时引起了任何副作用，这一点很重要。\n\
    \n# 实时地震可视化器\n\n利用我们到本章为止涵盖的所有概念，我们将构建一个使用 RxJS 显示实时地震的 Web 应用程序。我们将从构建一个功能性但原始的响应式实现开始，并随着过程不断改进。最终结果如下：\n\
    \n![](img/0247a9f7325c8a55eb84ba4fc3e6f2_48.png)\n\n# 准备我们的环境\n\n我们将使用 USGS（美国地质调查）地震数据库，它提供了多种格式的实时地震数据集。我们将从\
    \ JSONP 格式的每周数据获取数据。\n\n- 1. http://earthquake.usgs.gov/earthquakes/feed/v1.0/\n\
    \n"
