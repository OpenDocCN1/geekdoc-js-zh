  - "[PAGE 54]\n\n# Making a Real-Time Earthquake Visualizer\n\n));\nKeep in mind\
    \ that for this code to run, you need to include the file rx.dom from RxJS-DOM\
    \ in the HTML. Notice how we've added a map operator that transforms the earthquake\
    \ objects into simple objects containing only the information we need for our\
    \ visualization: latitude, longitude, and magnitude of the earthquake. The less\
    \ functionality we put in the subscribe operator, the better.\n\n# Making It Real\
    \ Time\n\nOur reactive version of the earthquake application doesn't update the\
    \ map of earthquakes in real time. To implement that, we will use the interval\
    \ operator—which we saw earlier in this chapter—and the überuseful distinct operator.\
    \ Let me show you the code and we will go through the changes:\n\nexamples_earthquake/code_1.js\n\
    \n```\nvar quakes = Rx.Observable;\ninterval(5000)\n  .flatMap(function() {\n\
    \    return Rx.DOM.jsonRequest({\n      url: QUAKE_URL,\n      jsonCallback: 'eqfeed_callback'\n\
    \    }).retry(3);\n  })\n  .flatMap(function(result) {\n    return Rx.Observable.from(result.response.features);\n\
    \  })\n  .distinct(function(quake) { return quake.properties.code; });\n\nquakes.subscribe(function(quake)\
    \ {\n  var coords = quake.geometry.coordinates;\n  var size = quake.properties.mag\
    \ * 10000;\n  \n  L.circle([coords[1], coords[0]], size).addTo(map);\n});\n\n\
    ```\n\nIn the preceding code, we use interval to make new requests and process\
    \ them at regular intervals of five seconds. interval creates an Observable that\
    \ emits an incrementing number every five seconds. We don't do anything with those\
    \ numbers; instead, we use flatMap to retrieve the data of the jsonpRequest. Notice\
    \ also how we use retry to try again in case there are problems retrieving the\
    \ list at first.\n\nThe last operator we apply is distinct, which emits only elements\
    \ that haven't been emitted before. It takes a function that returns the property\
    \ to check for equality. This way we never redraw earthquakes that are already\
    \ drawn."
  - '[PAGE 55]


    In fewer than 20 lines, we''ve written an application that regularly polls an
    external JSONP URL, extracts concrete data from its contents, and then filters
    out earthquakes that have already been imported. That is, we represent the earthquakes
    on a map, with a size proportional to their magnitude—all written in a self-contained,
    clear, and concise way, without relying on external state. Not at all! Shows how
    expressive Observables can be.


    # # Ideas for Improvements


    Here are a couple of ideas to put your newly acquired RxJS skills to use and make
    this little application a bit more interesting:


    +   * When we hover the mouse over an earthquake, offer a pop-up that shows more
    information about that particular earthquake. One way to do that would be to create
    a new Observable from the quakes one with just the properties you want to show,
    and dynamically filter it upon hovering.

    * Implement a counter at the top of the page that shows the number of earthquakes
    so far today and resets every day.


    # # Operator Rundown


    This chapter presented you with a few new operators, so here''s a recap of them,
    along with some scenarios for ways we can use in our applications. Remember, you
    can always find the complete API documentation for operators on the RxJS GitHub
    site.^4


    +   * Rx.Observable.from


    Default behavior: *Synchronous*


    Since many of the data sources you use in your applications will come from arrays
    or iterables, it makes sense to have an operator that creates Observables out
    of them. from one is one of the operators you''ll use the most.


    With from we can create Observables from arrays, array-like objects (for instance,
    the arguments object or DOM NodeLists), and even types that implement the iterable
    protocol, such as String, Map, and Set.^5


    +   * Rx.Observable.range


    Default behavior: *Synchronous*'
  - '[PAGE 56]


    The range operator generates finite Observables that emit integers in a particular
    range. It is extremely versatile and can be used in many scenarios. For example,
    you could use range to generate the initial squares on the board of a game like
    Minesweeper.


    +   - Rx.Observable.interval


    Default behavior: *Asynchronous*


    Each time you need to generate values spaced in time, you''ll probably start with
    an interval operator as the generator. Since it emits sequential integers every
    x milliseconds (where x is a parameter we pass), we just need to transform the
    values to whatever we want. Our game in Chapter 3, *Building Concurrent Programs*,
    on page 39, is heavily based on that technique.


    +   - Rx.Observable.distinct


    Default behavior: *Same as the Observable it filters*


    distinct is one of these extremely simple operators that saves a ton of development
    work. It filters out of the sequence any value that has already been emitted.
    That keeps us from writing time and again that error-prone boilerplate code that
    uses a dictionary somewhere with the emitted results, against which we compare
    incoming results. You know what kind of code I''m talking about. Yuck. That''s
    gone with distinct.


    ![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_56_0.png)


    distinct lets us use a function that specifies the comparison method. Additionally,
    we can pass no arguments and it will use strict comparison to compare primitives
    such as numbers or strings, and run deep comparisons in case of more complex objects.'
  - '[PAGE 57]


    # Wrapping Up


    In this chapter we covered how to visually represent and understand Observable
    flows using marble diagrams. We''ve covered the most common operators to transform
    Observables, and, more importantly, we''ve built a real-world application using
    only Observable sequences, avoiding setting any external state, loops, or conditional
    branches. We expressed our whole program in a declarative way, without having
    to encode every step to accomplish the task at hand.


    In the next chapter we''ll continue to explore Observable sequences, this time
    taking a look at more advanced operators that allow you to control and bend flows
    and data in your program like you''ve never imagined possible with procedural
    code!'
  - "[PAGE 58]\n\n# Building Concurrent Programs\n\nConcurrency is the art of doing\
    \ several things at the same time, correctly and efficiently. To accomplish this,\
    \ we structure our programs to take advantage of time so that tasks run together\
    \ in the most efficient way. Examples of everyday concurrency in applications\
    \ include keeping the user interface responsive while other activities are happening,\
    \ and processing hundreds of customers' orders efficiently.\n\nIn this chapter\
    \ we'll explore concurrency and pure functions in RxJS by making a shoot-em-up\
    \ spaceship game for the browser. We'll first introduce the Observable pipeline,\
    \ a technique to chain Observable operators and pass state between them. Then\
    \ I'll show you how to use the pipeline to build programs without relying on external\
    \ state or side effects, by encapsulating all your logic and state inside the\
    \ Observables themselves.\n\nVideo games are computer programs that need to keep\
    \ a lot of state, but we'll write our game with no external state whatsoever,\
    \ using the power of the Observable pipeline and some great RxJS operators.\n\n\
    # Purity and the Observable Pipeline\n\nAn Observable pipeline is a group of operators\
    \ chained together, where each takes one Observable as input and returns an Observable\
    \ as output. We've been using pipelines in this book; they are ubiquitous when\
    \ programming with RxJS. Here's a simple one:\n\n```\nspaceship_reactive/pipeline\n\
    Rx.Observable\n  .from([1, 2, 3, 4, 5, 6, 7, 8])\n  .filter(function(val) { return\
    \ val % 2; }\n  .map(function(val) { return val * 10;});\n```"
  - "[PAGE 59]\n\nPipelines are self-contained. All state flows from one operator\
    \ to the next, without the need for any external variables. But as we build our\
    \ reactive programs, we may be tempted to store state outside the Observable pipeline\
    \ (we talked about external state in *Side Effects and External State*, on page\
    \ 5). This forces us to keep track of the variables we set outside the pipeline,\
    \ and all that bean-counting can easily lead to bugs. To avoid this, the operators\
    \ in a pipeline should always use pure functions.\n\nPure functions always return\
    \ the same output given the same input. It's easier to design programs with high\
    \ concurrency when we can guarantee that a function in the program cannot modify\
    \ state other other functions rely on. And that's what pure functions give us.\n\
    \n# Avoiding External State\n\nIn the following example we count the even numbers\
    \ that interval has yielded so far. We do that by creating an Observable from\
    \ interval ticks and increasing evenTicks when the tick we receive is an even\
    \ number:\n\n```\nspaceship_reactive/state.js\n evenTicks = 0;\nfunction updateDistance(i)\
    \ {\n  if (i % 2 === 0) {\n    evenTicks += 1;\n  }\n  return evenTicks;\n}\n\
    var ticksObservable = Rx.Observable\n.interval(1000)\n.map(updateDistance)\nticksObservable.subscribe(function()\
    \ {\n  console.log('Subscriber 1 - evenTicks: ' + evenTicks + ' so far');\n});\n\
    ```\n\nThis is the output we get after the program has been running for four seconds:\n\
    \n+   - Subscriber 1 - evenTicks: 1 so far\n- Subscriber 1 - evenTicks: 1 so far\n\
    - Subscriber 1 - evenTicks: 2 so far\n- Subscriber 1 - evenTicks: 2 so far\n\n\
    Now, just for kicks, let's add another subscriber to ticksObservable:"
