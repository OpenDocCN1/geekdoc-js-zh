    > Real-time and asynchronous applications pose a huge challenge in web development
    today. This book does an excellent job of explaining how RxJS addresses challenges
    and teaches you how to rethink your world in terms of Observables.

    Zef Hemel, VP of engineering, STX Next


    # # Reactive Programming with RxJS


    Reactive programming is revolutionary. It makes asynchronous programming clean,
    intuitive, and robust. Write complex programs in a simple way using the Reactive
    Extensions for JavaScript (RxJS) library, unifying asynchronous mechanisms into
    the powerful Observable data type. Think about your programs as streams of data
    that you can transform by expressing *what* should happen, instead of having to
    program *how* it should happen.


    Find out about Observable sequences, a unifying data type to write highly concurrent
    code, and change the concept of time in your applications with Schedulers. Build
    real-world examples for the browser and Node.js, including a real-time earthquake
    visualization and a shoot-''em-up space videogame. And use Cycle.js to make a
    whole new breed of web applications.


    You’ll be able to manage real-world concurrency and write complex flows of events
    in your applications with ease.


