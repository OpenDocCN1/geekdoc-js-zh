    \ `Observable` 的表达能力有多强。\n\n# 改进想法\n\n这里有几个想法可以让你运用新学到的 RxJS 技能，并让这个小应用程序更有趣：\n\
    \n- 当我们将鼠标悬停在地震上时，弹出一个窗口显示关于该特定地震的更多信息。实现此点的一种方法是从 `quakes` 创建一个新的 `Observable`，其中仅包含你想显示的属性，并在悬停时对其进行动态过滤。\n\
    - 在页面顶部实现一个计数器，显示今天到为止的地震数量，并在每天重置。\n\n# 操作符回顾\n\n本章向你介绍了几个新的操作符，所以这里是它们的回顾，以及我们可以在应用程序中使用它们的一些场景。记住，你始终可以在\
    \ RxJS 的 GitHub 网站上找到操作符的完整 API 文档。\n\n- **Rx.Observable.from**\n\n  默认行为：*同步*\n\
    \n  由于你在应用程序中使用的许多数据源来自数组或可迭代对象（iterables），因此创建一个从它们生成 `Observable` 的操作符是有意义的。`from`\
    \ 是你使用最频繁的操作符之一。\n\n  通过 `from`，我们可以从数组、类数组对象（例如 `arguments` 对象或 DOM `NodeLists`），甚至从实现了可迭代协议的类型（如\
    \ `String`、`Map` 和 `Set`）创建 `Observable`。\n\n- **Rx.Observable.range**\n\n  默认行为：*同步*\n\
    \n  `range` 操作符生成在特定范围内发射整数的有限 `Observable`。它非常多能，可以用于许多场景。例如，你可以使用 `range` 来生成扫雷等游戏棋盘上的初始方格。\n\
    \n- **Rx.Observable.interval**\n\n  默认行为：*异步*\n\n  每当你需要生成时间间隔的值时，你可能都会从 `interval`\
    \ 操作符开始生成器。由于它每 x 毫秒发射一个顺序整数（x 是我们传递的参数），我们只需要将这些值转换为我们需要的任何即可。我们在第 3 章第 39 页《构建并发程序》中的游戏很大程度上依赖于这种技术。\n\
    \n- **Rx.Observable.distinct**\n\n  默认行为：*与其过滤的 Observable 相同*\n\n  `distinct`\
    \ 是这些极其简单的操作符之一，它节省了大量的开发工作。它过滤掉序列中任何已经发射过的值。这让我们避免了反复编写那些容易出错的模板代码——这些代码通常会在某处使用字典存储已发射的结果，并与传入的结果进行比较。你知道我在说哪种代码。真讨厌。有了\
    \ `distinct`，这些都消失了。\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_56_0.png)\n\n\
    `distinct` 让我们可以使用一个指定比较方法的函数。此外，我们可以不传递任何参数，它将使用严格比较来比较数字或字符串等原始类型，并在对象复杂对象运行时深度比较。\n\
    \n# 总结\n\n在本章中，我们涵盖了如何使用弹力图（marble diagrams）来视觉化表示和理解 `Observable` 流。我们涵盖了最常用的操作符，更重要的是，我们学习了如何避免外部状态。在下一章中，我们将继续探索流和高级操作符。\n\
    \n# 构建并发程序\n\n并发是同时做几件事的艺术。在本章中，我们将探索如何在响应式编程中处理并发。我们将查看如何管理数据流以及如何协调它们。\n\n#\
    \ 纯性与 Observable 管道\n\n`Observable` 管道是一组链式的操作符，每个操作符接收一个 `Observable` 作为输入并返回一个\
    \ `Observable` 作为输出。我们在书中一直在管道；它们无处不在。这里有一个简单的示例：\n\n```javascript\nspaceship_reactive/pipeline\n\
    Rx.Observable\n  .from([1, 2, 3, 4, 5, 6, 7, 8])\n  .filter(function(val) { return\
    \ val % 2; })\n  .map(function(val) { return val * 10; });\n```\n\n# 避免外部状态\n\n\
