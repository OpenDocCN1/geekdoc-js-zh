    # Spreadsheets Are Reactive


    Let''s start by considering the quintessential example of a reactive system: the
    spreadsheet. We all have used them, but we rarely stop and think how shockingly
    intuitive they are. Let''s say we have a value in cell A1 of the spreadsheet.
    We can then reference it in other cells in the spreadsheet, and whenever we change
    A1, every cell depending on A1 will automatically update its own value.


    | A | B | C |

    |---|---|---||

    | 1 | 100 | 20 |


    That behavior feels natural to us. We didn''t have to tell the computer to update
    cells that depend on A1 or how to do it; these cells reacted to the change. In
    a spreadsheet, we simply declare our problem, and we don''t worry about how the
    computer calculates the results.


    This is what reactive programming aims for. We declare relationships between players,
    and the program evolves as these entities change or come up with new values.


    # The Mouse as a Stream of Values


    To understand how to see events as streams of values, let''s think of the program
    from the beginning of this chapter. We used mouse clicks as an infinite sequence
    of events generated in real time as the user clicks. This is an idea by Erik Meijer—the
    inventor of RxJS—proposed in his paper ''Your Mouse Is a Database.''¹


    In reactive programming, we see mouse clicks as a continuous stream of events
    that we can query and manipulate. Thinking of streams instead of isolated values
    opens up a whole new way to program, one in which we can manipulate entire sequences
    of values that haven''t been created yet.


    Let that thought sink in for a moment. This is different from what we''re used
    to, which is having values stored somewhere such as a database or an array and
    waiting for them to be available before we use them. If they are not available
    yet (for instance, a network request), we wait for them and use them only when
    they become available.


    > ¹ http://queue.acm.org/detail.cfm?id=2169076'
- md: "\n## Chapter 1. The Reactive Way\n\nWe can think of streaming sequence as an\
    \ array in which elements are separated by time instead of by memory. With either\
    \ time or memory, we have sequences of elements:\n\nSeeing your program as flowing\
    \ sequences of data is key to understanding RxJS programming. It takes a bit of\
    \ practice, but it is not hard. In fact, most data we use in any application can\
    \ be expressed as a sequence. We'll look at sequences more in depth in Chapter\
    \ 2, Deep in the Sequence, on page 17.\n\n## Querying the Sequence\n\nLet's implement\
    \ a simple version of mouse stream using traditional event listeners in JavaScript.\
    \ To log the x- and y-coordinates of mouse clicks, we could write something like\
    \ this:\n\n```javascript\nch1/thinking_sequences.js\ndocument.body.addEventListener('click',\
    \ function(e) {\n  console.log(e.clientX, e.clientY);\n});\n```\n\nThis code will\
    \ print the x- and y-coordinates of every mouse click in order.\nThe output looks\
    \ like this:\n\n- 252 183\n- 211 232\n- 153 323\n\nLooks like a sequence, doesn't\
    \ it? The problem, of course, is that manipulating events is not as easy as manipulating\
    \ arrays. For example, if we want to change the preceding code so it logs only\
    \ the first 10 clicks on the right side of the screen (quite a random goal, but\
    \ bear with me here), we would write something like this:\n\n```javascript\nvar\
    \ clicks = 0;\ndocument.addEventListener('click', function registerClicks(e) {\n\
    \  if (clicks < 10) {\n    if (e.clientX > window.innerWidth / 2) {\n      console.log(e.clientX,\
    \ e.clientY);\n      clicks += 1;\n    }\n  }\n  document.removeEventListener('click',\
    \ registerClicks);\n});\n```\n\nFor our requirements, we introduced external state\
    \ through a global variable that counts clicks made so far. We also need to check\
    \ for two different conditions and use nested conditional blocks. And when we're\
    \ done, we need to tidy up and unregister the event to not leak memory.\n\n##\
    \ Side Effects and External State\n\nIf an action has impact outside of the scope\
    \ where it happens, we call this a side effect. Changing a variable external to\
    \ our function, printing to the console, or updating a value in a database are\
    \ examples of side effects.\n\nFor example, changing the value of a variable that\
    \ exists inside our function is safe. But if that variable is outside the scope\
    \ of our function then other functions can change its value. Our function is not\
    \ in control anymore and it can't assume that external variable contains the value\
    \ we expect. We will need to track it and add checks to ensure its value is what\
    \ we expect. At that point we'd be adding code that is not relevant to our program,\
    \ making it more complex and error prone.\n\nAlthough side effects are necessary\
    \ to build any interesting program, we should strive for having as few as possible\
    \ in our code. In reactive programs, where we have many moving pieces that change\
    \ over time. Throughout this book, we will pursue an approach that avoids external\
    \ state and side effects. In fact, in Chapter 3, Building Concurrent Programs,\
    \ on page 39, we'll build an entire video game with no side effects.\n\nWe managed\
    \ to meet our early requirements, but ended up with pretty complicated code for\
    \ such a simple goal. It's difficult code to maintain and is not obvious for a\
    \ developer who looks at it for the first time. More importantly, we made it prone\
    \ to develop subtle bugs in the future because we need to keep state.\n\nAll we\
