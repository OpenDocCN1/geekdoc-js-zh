    >\n  <title>Wikipedia search</title>\n</head>\n<body>\n  <div id=\"container\"\
    ></div>\n  <script src=\"bundle.js\"></script>\n</body>\n</html>\n```\n\n# Our\
    \ Project: Wikipedia Search\n\nIn this section we'll build an application that\
    \ searches Wikipedia as the user types.\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_124_0.png)"
  - "[PAGE 125]\n\n# Chapter 6. Reactive Web Applications with Cycle.js • 106\n\n\
    RxJS already makes retrieving and processing the remote data easy, but as you\
    \ saw in Chapter 4, Building a Complete Web Application, on page 69, still need\
    \ to jump through some hoops to make our DOM operations efficient.\n\nOne of the\
    \ objectives of Cycle.js is to completely eliminate DOM manipulation from our\
    \ code. Let's start with some basic scaffolding:\n\ncycle/step1.js\n\n```\nvar\
    \ Cycle = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom');\nvar\
    \ Rx = Cycle.Rx;\n\nfunction main(responses) {\n  return {\n    DOM: Rx.Observable.just(CycleDOM.h('span',\
    \ 'Hi there!'))\n  };\n}\nvar drivers = {\n  DOM: CycleDOM.makeDOM('#container')\n\
    };\n```\n\n+   - Cycle.run(main, drivers);\n\nThis code shows the text *Hi there!*\
    \ onscreen, but there's already quite a lot going on. The important parts are\
    \ the main function and the drivers object. Let's go through the steps:\n\n+ \
    \  - We require Cycle Core and the Cycle DOM driver. I'll explain what a Cycle.js\
    \ driver is in the next section.\n\n+   - The main function is always the entry\
    \ point for our application. It returns a collection of Observables, for each\
    \ driver in the application. So far we're only using one driver: the *DOM driver*.\n\
    \n+   - The Observable for the DOM driver emits a virtual tree, which we create\
    \ using the `h` method in the Cycle DOM library. In this case, we create only\
    \ a single `span` element with the text 'Hi there!'. The DOM driver consumes that\
    \ virtual tree and renders the actual DOM on the page from.\n\n+   - We create\
    \ a DOM driver that will build the DOM tree from the items emitted by the main\
    \ function. The DOM tree will be built in the element or selector that we pass\
    \ as a parameter. In this case, #container.\n\n+   - The Cycle.run connects the\
    \ main function with the drivers object, creating a circular flow between the\
    \ two."
  - "[PAGE 126]\n\n# Cycle.js Drivers\n\nCycle.js drivers are functions we use to\
    \ cause side effects. Nowhere else in our programs should we be modifying state\
    \ in any way. Drivers take an Observable that emits data from our application,\
    \ and they return another Observable that causes the side effects.\n\nWe won't\
    \ be creating drivers very often—only when we need side effects like modifying\
    \ the DOM, reading and writing from other interfaces (for example, Local Storage),\
    \ or making requests. In most applications we'll need only the DOM driver (which\
    \ renders web pages) and the HTTP driver (which we can use to make HTTP requests).\
    \ In this example, we'll use yet another one, the JSONP driver.\n\n# The User\
    \ Interface\n\nWe need actual content for our page, not just a span. Let's make\
    \ a function that creates the virtual tree that represents our page:\n\n```\n\
    cycle/index.js\nfunction vtreeElements(results) {\n  var h = CycleDOM.h;\n  return\
    \ h('div', [\n    h('h1', 'Wikipedia Search'),\n    h('input', {className: 'search-field',\
    \ attributes: {type: 'text'}}),\n    h('hr'),\n    h('div', results.map(function(result)\
    \ {\n      return h('div', [\n        h('a', { href: WIKI_URL + result.title },\
    \ result.title)\n      ]);\n    }))\n  ]);\n}\n```\n\nThis function might look\
    \ a bit strange, but don't panic. It is using Virtual Hyperscript, a domain-specific\
    \ language for creating virtual DOM trees. Virtual Hyperscript contains a single\
    \ method, called h. h declares nodes in a way similar to how HTML does, but using\
    \ JavaScript. We can add attributes to elements or append children to them by\
    \ passing extra objects or arrays as parameters to h. The resulting virtual tree\
    \ will eventually be rendered into real browser DOM.\n\nvtreeElements takes an\
    \ array of objects, results, and returns a virtual tree that represents the simple\
    \ UI for our app. an input field and a listing of links from the objects in results,\
    \ which will eventually contain Wikipedia's search results. We'll use vtreeElements\
    \ to render our application."
  - "[PAGE 127]\n\n# Chapter 6. Reactive Web Applications with Cycle.js • 108\n\n\
    Using JSX\nInstead of using the h function, we could write our UI using JSX, an\
    \ XML-like syntax extension invented by Facebook that makes writing virtual DOM\
    \ structures easier and more readable. Or our vtreeElements function would look\
    \ like this:\n\n```\ncycle/index.js\nfunction vtreeElementsJSX(results) {\n  results\
    \ = results.map(function(result) {\n    var link = WIKI_URL + result.title;\n\
    \    return <div><a href={link}>{result.title}</a></div>;\n  });\n}\n\nreturn\
    \ <div>\n  <h1>Wikipedia Search</h1>\n  <input className=\"search-field\" type=\"\
    text\" />\n  <div>{results}</div>\n</div>;\n}\n```\n\nDoesn't it look nicer? JSX\
    \ looks more familiar to developers because it resembles HTML, we can write it\
    \ alongside JavaScript code, with the added advantage that we can treat it as\
    \ a JavaScript type. For example, notice how we iterate the results array and\
    \ we return a <div> element directly, using the value of link result.title in\
    \ the element itself. (JavaScript values can be inclined by putting them inside\
    \ curly brackets.)\n\nSince JSX is a syntax extension, we need a compiler that\
    \ transforms it into the final JavaScript code (which looks much like our h-based\
    \ code from the previous section). We'll use Babel for Babel. Babel is a compiler\
    \ that transforms modern JavaScript into JavaScript that runs everywhere. It also\
    \ transforms some JavaScript extensions, such as JSX, which is our particular\
    \ case.\n\nIf you want to use JSX, you need to install Babel and use it when compiling\
    \ the project. Fortunately, Babel has an adapter for Browserify called Babelify:\n\
    \n```\n$ npm install babelify\n```\n\nIn every file that uses JSX, we need to\
    \ add the following lines at the top of the file:\n\n```\n/* @jsx hJSX */\nvar\
    \ hJSX = CycleDOM.hJSX;\n```\n\n3. https://babel.io"
