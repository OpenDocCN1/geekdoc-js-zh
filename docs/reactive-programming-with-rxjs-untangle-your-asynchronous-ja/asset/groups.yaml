    \ the transformations we defined once per item.\n\nWith Observables, we'll go\
    \ through our list only once, and we'll apply the transformations only if absolutely\
    \ required. For example, let's say we added a take operator to our previous example:\n\
    \n```\nspaceship_reactive/array_chain.js\n\nstringObservable\n.map(function(str)\
    \ {\n  return str.toUpperCase();\n}}\n.filter(function(str) {\n  return /^[A-Z]+$/.test(str);\n\
    }}\n.take(5)\n.subscribe(function(str) {\n  console.log(str);\n});\n```\n\ntake\
    \ makes the Observable emit only the first n items we specify. In our case, n\
    \ is five, so out of the thousand strings, we'll receive only the first. The cool\
    \ part is that our code will never traverse all the items; it will apply our transformations\
    \ to only the first five."
  - "[PAGE 64]\n\nThis makes the developer's life much easier. You can rest assured\
    \ that when manipulating sequences, RxJS will do only as much work as necessary.\
    \ This way of operating is called lazy evaluation, and it is very common in functional\
    \ languages such as Haskell and Miranda.\n\n# RxJS's Subject Class\n\nA Subject\
    \ is a type that implements both Observer and Observable types. As an Observer,\
    \ it can subscribe to Observables, and as an Observable it can produce values\
    \ and have Observers subscribe to it.\n\nIn some scenarios a single Subject can\
    \ do the work of a combination of Observers and Observables. For example, for\
    \ making a proxy object between data source and the Subject's listeners, we use\
    \ this:\n\n```\nspaceship_reactive/subjects.js\n```\n\n```\nvar subject = new\
    \ Rx.Subject();\nvar source = Rx.Observable.interval(300)\n  .map(function(v)\
    \ { return 'Interval message #' + v; });\n  .take(5);\n\nsource.subscribe(subject);\n\
    var subscription = subject.subscribe(\n  function onNext(x) { console.log('onNext:\
    \ ' + x); },\n  function onError(e) { console.log('onError: ' + e.message); },\n\
    \  function onCompleted() { console.log('onCompleted'); }\n);\n\nsubject.onNext('Our\
    \ message #1');\nsubject.onNext('Our message #2');\n```\n\n```\nsetTimeout(function()\
    \ {\n  subject.onCompleted();\n}, 1000);\n```\n\nOutput:\n\n```\n{ onNext: Our\
    \ message #1\nonNext: Our message #2\nonNext: Interval message #0\nonNext: Interval\
    \ message #1\nonNext: Interval message #2\nonCompleted\n```\n\nIn the preceding\
    \ example we create a new Subject and a source Observable that emits every integer\
    \ 300 milliseconds. Then we subscribe the Subject to the Observable. After that,\
    \ we subscribe an Observer to the Subject itself. The Subject now behaves as an\
    \ Observable."
- md: "\n## Chapter 3. Building Concurrent Programs * 46\n\nNext we make the Subject\
    \ emit values of its own (message and message). In the final result, we get the\
    \ Subject's own messages and then the proxied values from the source Observable.\
    \ The values from the Observable come later because they are asynchronous, whereas\
    \ we made the Subject's own values immediate. Notice that if we tell the source\
    \ Observable to take the first five values, the output shows only the first three.\
    \ That's because after one second we call onCompleted on the Subject. This finishes\
    \ the notifications to all subscriptions and overrides the take operator in this\
    \ case.\n\nThe Subject class provides the base for creating some specialized Subjects.\
    \ In fact, RxJS comes with some interesting ones: AsyncSubject, ReplaySubject,\
    \ and BehaviorSubject.\n\n## AsyncSubject\n\nAsyncSubject emits the last value\
    \ of a sequence only if the sequence completes. This value is cached forever,\
    \ and any Observer that subscribes after the value has been emitted will receive\
    \ it right away. AsyncSubject is convenient for asynchronous operations that return\
    \ a single value, such as Ajax requests.\n\nLet's see a simple example of an AsyncSubject\
    \ subscribing to a range:\n\n```javascript\nspaceship_reactive/subjects.js\nvar\
    \ delayedRange = Rx.Observable.range(0, 5).delay(1000);\nvar subject = new Rx.AsyncSubject();\n\
    delayedRange.subscribe({\n  function onNext(item) { console.log('Value:', item);\
    \ },\n  function onError(err) { console.log('Error:', err); },\n  function onCompleted()\
    \ { console.log('Completed.'); }\n});\n```\n\nIn this example, delayedRange emits\
    \ the values 0 to 4 after a delay of a second. Then we create a new AsyncSubject\
    \ subject and subscribe it to delayedRange. The output is following:\n\nValue:\
    \ 4\nCompleted.\n\nAs expected, we get only the last value that the Observer emits.\
    \ Let's now use AsyncSubject reactive for a more realistic scenario. We'll retrieve\
    \ some remote content:\n\n```javascript\nspaceship_reactive/subjects.js\nfunction\
    \ getProducts(url) {\n  var subject;\n  return Rx.Observable.create(function(observer)\
    \ {\n    if (!subject) {\n      subject = new Rx.AsyncSubject();\n      Rx.DOM.get(url).subscribe(subject);\n\
    \      return subject.subscribe(observer);\n    }\n  });\n\nvar products = getProducts('/products');\n\
    // Will trigger request and receive the response when read\nproducts.subscribe(\n\
    \  function onNext(result) { console.log('Result 1:', result.response); },\n \
    \ function onError(error) { console.log('ERROR', error); }\n);\n\n// Will receive\
    \ the result immediately because it's cached\nsetTimeout(function() {\n  products.subscribe(\n\
    \    function onNext(result) { console.log('Result 2:', result.response); },\n\
    \    function onError(error) { console.log('ERROR', error); }\n  );\n}, 5000);\n\
    ```\n\nIn this code, when getProducts is called with a URL, it returns an Observer\
    \ that emits the result of the HTTP GET request. Here's how it breaks down:\n\n\
    - products returns an Observable sequence. We create it here.\n- If we haven't\
    \ created an AsyncSubject, we create it and subscribe it to the Observable that\
    \ Rx.DOM.request(url) returns.\n- We subscribe the Observer to the AsyncSubject.\
    \ Every time an Observer subscribes to the Observable, it will actually be subscribed\
    \ to the AsyncSubject, which is acting as a proxy between the Observable retrieving\
    \ the URL and the Observers.\n- We create the Observable that retrieves the URL\
    \ \"products\" and store it in the products variable.\n- This is the first subscription\
    \ and will kick off the URL retrieval and log the results when the URL is retrieved,\
    \ which runs five seconds after the first one.\n- This is the second subscription,\
    \ at time the URL has already been retrieved, there's no need for another network\
    \ request. It will receive the result of the request immediately because it is\
    \ already stored in the AsyncSubject that subscribes to.\n\nThe interesting bit\
    \ is that we're using AsyncSubject that the Rx.DOM.request Observable. Because\
    \ AsyncSubject caches the last result, any subsequent subscription to products\
    \ will receive the result right away, without causing another network request.\
    \ We can use AsyncSubject whenever we expect a single result and want to hold\
    \ onto it.\n\n> Joe asks:\n> Does That Mean AsyncSubject Acts Like a Promise?\n\
    \nIndeed.\nAsyncSubject represents the result of an asynchronous action, and you\
    \ can use it as a substitute for a promise. The difference internally is that\
    \ a promise will only ever process a single value, whereas AsyncSubject processes\
    \ all values in a sequence, only ever emitting (and caching) the last one.\nBeing\
    \ able to easily simulate promises shows the flexibility of the RxJS model. (Even\
    \ without AsyncSubject, it would be pretty easy to simulate a promise using Observables.)\n\
    \n## BehaviorSubject\n\nWhen an Observer subscribes to a BehaviorSubject, it receives\
    \ the last emitted value and then all the subsequent values. BehaviorSubject requires\
    \ that we provide a starting value, so that all Observers will always receive\
    \ a value when they subscribe to a BehaviorSubject.\nImagine we want to retrieve\
    \ a remote file and print its contents on an HTML page, but we place placeholder\
    \ text while we wait for the contents. We use BehaviorSubject for this:\n\n```javascript\n\
    spaceship_reactive/behavior_subject.js\nvar subject = new Rx.BehaviorSubject('Waiting\
    \ for content');\nsubject.subscribe({\n  function(result) {\n    document.body.textContent\
    \ = result.response || result;\n  },\n  function(err) {\n    // handle error\n\
    \  }\n});\nRx.DOM.get('/content').subscribe(subject);\n```\n\nIn the code, BehaviorSubject\
    \ initializes the placeholder value. Now we subscribe to it and BehaviorSubject\
    \ guarantees that there will always be at least one value because we provide a\
    \ default value. Once we receive the content, BehaviorSubject replaces the placeholder\
    \ text.\n\n## ReplaySubject\n\nAsyncSubject emits the last value of a sequence\
    \ only if the sequence completes. This value is cached forever, and any Observer\
    \ that subscribes after the value has been emitted will receive it right away.\
    \ AsyncSubject is convenient for asynchronous operations that return a single\
    \ value, such as Ajax requests.\n\nReplaySubject is useful to make sure Observers\
    \ get all the values from the start. Unlike AsyncSubject, it doesn't need to be\
    \ completed for this happen. It caches all values in memory. To prevent it from\
    \ using too much memory, we can limit the amount of data it stores by buffer size\
    \ or window of time.\n\nThe first parameter to the constructor of ReplaySubject\
    \ takes a number that represents many values we want to buffer:\n\n```javascript\n\
    var subject = new Rx.ReplaySubject(2); // Buffer size of 2\n\nsubject.onNext(1);\n\
    subject.onNext(2);\nsubject.onNext(3);\n\nsubject.subscribe(function(n) {\n  console.log('Received\
    \ value:', n);\n});\n```\n\n> Received value: 2\n> Received value: 3\n\nThe second\
    \ parameter takes a number that represents the time in milliseconds during which\
    \ we have to buffer:\n\n```javascript\nvar subject = new Rx.ReplaySubject(null,\
    \ 200); // Buffer size of 200ms\n\nsetTimeout(function() { subject.onNext(1);\
    \ }, 100);\nsetTimeout(function() { subject.onNext(2); }, 200);\nsetTimeout(function()\
    \ { subject.onNext(3); }, 300);\nsetTimeout(function() {\n  subject.subscribe(function(n)\
    \ {\n    console.log('Received value:', n);\n  });\n}, 350);\n```\n\nIn this example\
    \ we set a buffer based on time, instead of the number of values. Our ReplaySubject\
    \ will cache values that were emitted up to 200 milliseconds ago. We emit three\
    \ values, each separated by 100 milliseconds another, and after 350 milliseconds\
    \ we subscribe an Observer and emit another value. At the moment of the subscription\
    \ the items cached are 2 and 3, because 1 happened too long ago (around 250 milliseconds\
    \ ago), so it is no longer cached.\n\n## Spaceship Reactive!\n\nTo show how we\
    \ can keep an application pure, we'll build a video game in which our hero fights\
    \ endless hordes of enemy spaceships. We'll make heavy use of Observable pipelines,\
    \ and I'll point out all the way when it might be tempting to store state outside\
    \ the pipeline and how to avoid it.\n"
  mdcn: "\n\n## 第 3 章. 构建并发程序 * 46\n\n接下来，我们让 Subject 发射它自己的值（消息和消息）。在最终结果中，我们先得到了\
    \ Subject 自身的消息，然后是来自源 Observable 的代理值。来自 Observable 的值较后出现，因为它们是异步的，而我们让 Subject\
    \ 自身的值是即时的。请注意，如果我们告诉源 Observable 取前五个值，输出只显示了前三个。这是因为在一秒钟后，我们在 Subject 上调用了 `onCompleted`。这会完成对所有订阅的通知，并在这种情况下覆盖了\
    \ `take` 操作符。\n\nSubject 类为创建某些特殊的 Subject 提供了基础。事实上，RxJS 自带了一些有趣的 Subject：AsyncSubject、ReplaySubject\
    \ 和 BehaviorSubject。\n\n## AsyncSubject\n\nAsyncSubject 只有在序列完成（complete）时才会发射序列的最后一个值。该值会被永久缓存，任何在值发射后订阅的\
    \ Observer 都会立即收到它。AsyncSubject 对于返回单个值的异步操作（例如 Ajax 请求）非常方便。\n\n让我们来看一个 AsyncSubject\
    \ 订阅范围（range）简单示例：\n\n```javascript\nspaceship_reactive/subjects.js\nvar delayedRange\
    \ = Rx.Observable.range(0, 5).delay(1000);\nvar subject = new Rx.AsyncSubject();\n\
    delayedRange.subscribe({\n  function onNext(item) { console.log('Value:', item);\
    \ },\n  function onError(err) { console.log('Error:', err); },\n  function onCompleted()\
    \ { console.log('Completed.'); }\n});\n```\n\n在这个示例中，delayedRange 在延迟一秒后发射值 0\
    \ 到 4。然后我们创建了一个新的 AsyncSubject subject 并将其订阅到 delayedRange。输出如下：\n\nValue: 4\n\
    Completed.\n\n正如预期的那样，我们只得到了 Observer 发射的最后一个值。现在让我们使用 AsyncSubject 响应处理一个更真实的场景。我们将获取一些远程内容：\n\
    \n```javascript\nspaceship_reactive/subjects.js\nfunction getProducts(url) {\n\
    \  var subject;\n  return Rx.Observable.create(function(observer) {\n    if (!subject)\
    \ {\n      subject = new Rx.AsyncSubject();\n      Rx.DOM.get(url).subscribe(subject);\n\
    \      return subject.subscribe(observer);\n    }\n  });\n\nvar products = getProducts('/products');\n\
    // 读取时将触发请求并接收响应\nproducts.subscribe(\n  function onNext(result) { console.log('Result\
    \ 1:', result.response); },\n  function onError(error) { console.log('ERROR',\
    \ error); }\n);\n\n// 将立即收到结果，因为它被缓存了\nsetTimeout(function() {\n  products.subscribe(\n\
    \    function onNext(result) { console.log('Result 2:', result.response); },\n\
    \    function onError(error) { console.log('ERROR', error); }\n  );\n}, 5000);\n\
    ```\n\n在代码代码中，当带有 URL 运行 getProducts 时，它返回一个发射 HTTP GET 请求结果的 Observer。以下是它的分解说明：\n\
    \n- products 返回一个 Observable 序列。我们在这里创建它。\n- 如果我们还没有创建 AsyncSubject，就会创建一个并将其订阅到\
    \ Rx.DOM.request(url) 返回的 Observable。\n- 我们将 Observer 订阅到 AsyncSubject。每当 Observer\
    \ 订阅 Observable 时，它实际上是订阅到了 AsyncSubject，AsyncSubject 在获取 URL 的 Observable 和 Observer\
    \ 之间充当代理。\n- 我们创建了获取 URL \"products\" 的 Observable 并将其存储在 products 变量中。\n- 这是第一次订阅，它将启动\
    \ URL 获取并在 URL 获取时记录结果，该操作在第一次订阅五秒后运行。\n- 这是第二次订阅，此时 URL 已经获取完成，不需要再次进行网络请求。它将立即收到请求结果，因为结果已经存储在所订阅的\
    \ AsyncSubject 中了。\n\n有趣的一点是，我们对 Rx.DOM.request Observable 使用了 AsyncSubject。因为\
    \ AsyncSubject 缓存了最后的结果，对 products 的任何后续订阅都将立即收到结果，而不会引发另一个网络请求。每当我们预期的一个单个结果并想要保留它时，我们可以使用\
    \ AsyncSubject。\n\n> Joe 问：\n> 这是否意味着 AsyncSubject 的作用就像 Promise（承诺）？\n\n 确实如此。\n\
    AsyncSubject 代表异步操作的结果，你可以将其用作 promise 的替代品。内部的区别在于，promise 只会处理单个值，而 AsyncSubject\
    \ 会处理序列中的所有值，但只发射（并缓存）最后一个。\n能够轻松地模拟 promise 显示了 RxJS 模型的灵活性。（即使没有 AsyncSubject，使用\
    \ Observables 模拟 promise 也很容易。）\n\n## BehaviorSubject\n\n当 Observer 订阅 BehaviorSubject\
    \ 时，它会接收上一个发射的值，然后是后续的所有值。BehaviorSubject 要求我们提供一个初始值，以便所有 Observer 在订阅 BehaviorSubject\
    \ 时总能收到一个值。\n假设我们要获取一个远程文件并将其内容打印在 HTML 页面上，但在等待内容期间放置占位符文本。我们使用 BehaviorSubject\
    \ 来：\n\n```javascript\nspaceship_reactive/behavior_subject.js\nvar subject = new\
    \ Rx.BehaviorSubject('Waiting for content');\nsubject.subscribe({\n  function(result)\
    \ {\n    document.body.textContent = result.response || result;\n  },\n  function(err)\
    \ {\n    // 处理错误\n  }\n});\nRx.DOM.get('/content').subscribe(subject);\n```\n\n\
    在代码中，BehaviorSubject 初始化了占位符值。现在我们订阅它，BehaviorSubject 保证始终至少有一个值，因为我们提供了默认值。一旦我们收到内容，BehaviorSubject\
    \ 就会替换掉占位符文本。\n\n## ReplaySubject\n\nAsyncSubject 只有在序列完成时才会发射序列的最后一个值。该值会被永久缓存，任何在值发射后订阅的\
    \ Observer 都会立即收到它。AsyncSubject 对于返回单个值的异步操作（例如 Ajax 请求）非常方便。\n\nReplaySubject\
    \ 用于确保 Observer 从开始获取所有值。与 AsyncSubject 不同，这不需要序列完成。它在内存中缓存所有值。为了防止它占用过多内存，可以通过缓冲区大小或时间窗口限制它存储的数据量。\n\
    \nReplaySubject 构造函数的第一个参数接收一个数字，代表我们想要缓存多少值：\n\n```javascript\nvar subject =\
    \ new Rx.ReplaySubject(2); // 缓冲区大小为 2\n\nsubject.onNext(1);\nsubject.onNext(2);\n\
    subject.onNext(3);\n\nsubject.subscribe(function(n) {\n  console.log('Received\
    \ value:', n);\n});\n```\n\n> Received value: 2\n> Received value: 3\n\n第二个参数接收一个数字，代表我们需要缓存的时间（毫秒）：\n\
    \n```javascript\nvar subject = new Rx.ReplaySubject(null, 200); // 缓冲区大小为 200ms\n\
    \nsetTimeout(function() { subject.onNext(1); }, 100);\nsetTimeout(function() {\
    \ subject.onNext(2); }, 200);\nsetTimeout(function() { subject.onNext(3); }, 300);\n\
    setTimeout(function() {\n  subject.subscribe(function(n) {\n    console.log('Received\
    \ value:', n);\n  });\n}, 350);\n```\n\n在这个示例中，我们根据时间设置缓冲区，而不是值的数量。我们的 ReplaySubject\
    \ 将缓存过去 200 毫秒内的值。我们发射了三个值，每个值之间间隔 100 毫秒，并在 350 毫秒后订阅了一个 Observer。在订阅瞬间，缓存的项是\
    \ 2 和 3，因为 1 发生得太早（大约 250 毫秒前），所以不再被缓存。\n\n## 响应式太空！\n\n为了展示如何保持应用程序的纯性，我们将创建一个英雄与无限敌飞船战斗的游戏。我们将大量使用\
    \ Observable 流水线，我会指出所有可能在流水线之外存储状态的情况，以及如何避免这样做。\n\n"
