    \n# 第 1 章\n\n# 响应式之道\n\n现实世界相当混乱：事件按随机顺序发生，应用程序崩溃，网络故障。很少有应用程序是完全同步的，编写异步代码对于保持应用程序的响应能力是必要的。大多数时候这是非常痛苦的，但其实并非如此。\n\
