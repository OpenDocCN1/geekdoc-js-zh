    \ coordinates much faster.\n\nTo avoid this and similar problems in the future,\
    \ we need to normalize the game's speed so that no Observable can emit values\
    \ faster than our chosen speed for the game.\n\nAnd yes, as you have guessed,\
    \ RxJS has an operator for that.\n\n# Avoid Drinking from the Firehose\n\nThere\
    \ is such a thing as receiving data too fast. Most of the time we want all the\
