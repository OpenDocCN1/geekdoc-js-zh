- md: "\napplications. Take the search input box, for example. We can definitely make\
    \ this into its own widget.\n\nThe objective is to encapsulate our widget in its\
    \ own component so that we use it as any other DOM element. We should also be\
    \ able to parameterize the component with any properties we want. We'll use it\
    \ in our applications like this:\n\n```javascript\nvar wpSearchBox = searchBox({\n\
    \  props: Rx.Observable.just({\n    apiURL: API_URL\n  })\n});\n```\n\nWe'll build\
    \ our widget using a concept also introduced by Cycle.js, nested dialogues. A\
    \ nested dialogue, or *dialogue*, is a function (like everything in Cycle.js)\
    \ that takes an Observable of events as input, and outputs an Observable—with\
    \ the result of applying these inputs to its internal logic.\n\nLet's start building\
    \ the search-component. We first create a function that takes a responses parameter\
    \ where we pass it any properties we want from the main application:\n\ncycle/search.js\n\
    \n```javascript\nvar Cycle = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom');\n\
    var Rx = Cycle.Rx;\nvar h = CycleDOM.h;\nvar a;\n```\n\n```javascript\nfunction\
    \ searchBox(responses) {\n  var props$ = responses.props$;\n  var apiURL$ = props$.map(function\
    \ (props) {\n    return props['apiURL'];\n  }).first();\n```\n\nEvery parameter\
    \ searchBox receives an Observable. In this case props$ is an Observable that\
    \ emits a single JavaScript object containing the configuration parameters for\
    \ our Wikipedia search box.\n\nAfter retrieving the properties, we define the\
    \ virtual tree for our widget. In our case, it is a very simple one that contains\
    \ just an input field:\n\ncycle/view.js\n\n```javascript\nvar vtree$ = Rx.Observable.just(\n\
    \  h('div', { className: 'search-field' }, [\n  h('input', { type: 'text' })\n\
    ])));\n```\n\nWe want everything to be an Observable, so we wrapped the tree in\
    \ a just Observable, which just returns an Observable that emits the value we\
    \ pass it.\n\nNow we need the search box to query the Wikipedia API whenever the\
    \ user types a search term in the input field. We reuse the code in the function\
    \ userintentfrom from our previous section:\n\n```javascript\ncycle/searchbox.js\n\
    \nvar searchQuery = apiUrl.FlatMap(function (apiUrl) {\n  return responses.DOM.select('.search-field').events('input')\n\
    \  .debounce(300)\n  .map(function (e) { return e.target.value; })\n  .filter(function\
    \ (value) { return value.length > 3; })\n  .map(function (searchTerm) { return\
    \ apiUrl + searchTerm; });\n});\n```\n\nWe still need to connect the output of\
    \ searchQuery to the input of the JSON driver. We do just like it do we do it\
    \ in the Normal Cycle application:\n\n```javascript\ncycle/searchbox.js\n\nreturn\
    \ {\n  DOMTree: vtree,\n  JSONPQuery: searchQuery\n};\n```\n\nAnd finally, we\
    \ shouldn't forget to export the checkBox widget:\n\n```javascript\ncycle/searchbox.js\n\
    \nmodule.exports = searchQuery; // Export it as a module\n```\n\nNow we're ready\
    \ to use the checkBox widget in our application. The main view will look like\
    \ this:\n\n```javascript\ncycle/index-mvi2.js\n\nvar h = CycleDOM.h;\nvar SearchBox\
    \ = require('./searchbox');\n\nfunction main(responses) {\n  var wpSearch = checkBox({\n\
    \    DOM: responses.DOM,\n    props$: Rx.Observable.just({\n      apiUrl: API_URL\n\
    \    })\n  });\n  var searchDOM$ = wpSearch.DOMTree;\n  var searchResults = responses.JSONP\n\
    \  .filter(function(res) {\n    return res.request.indexOf(API_URL) === 0;\n \
    \ }))\n  .concatAll()\n  .pluck('query', 'search')\n  .startsWith([]);\n  return\
    \ {\n    JSONP: wpSearchBox.JSONQuery,\n    DOM: Rx.Observable.combineLatest(\n\
    \      searchDOMs, searchResults$, function(tree, links) {\n        return h('div',\
    \ [\n          h('h1', 'Wikipedia Search'),\n          tree,\n          h('hr'),\n\
    \          h('div', links.map(function(link) {\n            return h('div', [\n\
    \              h('a', { href: WIKI_URL + link.title }, link.title)\n         \
    \   ]);\n          }))\n        ]);\n      })\n    ));\n}\nCycle.run(main, {\n\
    \  DOM: CycleDOM.makeDOMDriver('#container'),\n  JSONP: CycleJSONP.makeJSONPDriver()\n\
    });\n```\n\nWe now delegate the responsibility of handling user input and rendering\
    \ the search box, which we could easily reuse in another application that requires\
    \ a search box that queries URL APIs. These are the main changes:\n\n- Import\
    \ the searchBox widget we just created.\n- Create an instance of searchBox, passing\
    \ the DOM driver and the properties we want for our search widget.\n- Our wpSearchBox\
    \ will eventually emit items from its DOMTree Observable. We assign it here to\
    \ use later when we render the actual DOM.\n- We send the Wikipedia query URLs\
    \ to the JSONP driver so that it retrieves its results. When they are available,\
    \ it will emit them in response.JSON, which we refine in searchResults.\n- To\
    \ render the final DOM tree, we use combineLatest with searchDOM and searchResults.\
    \ Each of them causes the layout to change.\n\nWith the final code, we can see\
    \ the power of reactive programming in web development. Each component is an Observable,\
    \ and we've built a functional Wikipedia search box in just a few lines of code.\n\
    \nEvery parameter searchBox receives an Observable. In this case props$ is an\
    \ Observable that emits a single JavaScript object containing the configuration\
    \ parameters for our Wikipedia search box.\n\nAfter retrieving the properties,\
    \ we define the virtual tree for our widget. In our case, it is a very simple\
    \ one that contains just an input field:\n\nThe final code demonstrates how side\
    \ effects can be managed and how logic decoupled. By using Cycle.js, we can build\
    \ complex, reactive web applications that are easy to maintain and test.\n"
  mdcn: "\n应用程序。以搜索输入框为例，我们完全可以将其转换为自己的组件（widget）。\n\n目标是将我们的组件封装在自己的组件中，以便我们像使用任何其他\
    \ DOM 元素一样使用它。我们还应该能够根据所需的任何属性对组件进行参数化。我们将像这样在应用程序中使用它：\n\n```javascript\nvar\
    \ wpSearchBox = searchBox({\n  props: Rx.Observable.just({\n    apiURL: API_URL\n\
    \  })\n});\n```\n\n我们将使用 Cycle.js 引入的另一个概念——嵌套对话（nested dialogues）来构建我们的组件。嵌套对话，或\
    \ *dialogue*，是一个函数（就像 Cycle.js 中的所有内容都一样），它接收一个事件 Observable 作为输入，并输出一个 Observable\
    \ ——其结果是将这些输入应用于其内部逻辑的结果。\n\n让我们开始构建搜索组件。我们首先创建一个接收 `responses` 参数的函数，在其中我们从主应用程序传递任何我们想要的的属性：\n\
    \ncycle/search.js\n\n```javascript\nvar Cycle = require('@cycle/core');\nvar CycleDOM\
    \ = require('@cycle/dom');\nvar Rx = Cycle.Rx;\nvar h = CycleDOM.h;\nvar a;\n\
    ```\n\n```javascript\nfunction searchBox(responses) {\n  var props$ = responses.props$;\n\
    \  var apiURL$ = props$.map(function (props) {\n    return props['apiURL'];\n\
    \  }).first();\n```\n\n每个 `searchBox` 接收一个 Observable。在这种情况下，`props$` 是一个发射单个\
    \ JavaScript 对象的 Observable，该对象包含了我们 Wikipedia 搜索框的配置参数。\n\n获取属性后，我们为组件定义了虚拟树。在我们的情况下，它是非常简单的树，只包含一个输入字段：\n\
    \ncycle/view.js\n\n```javascript\nvar vtree$ = Rx.Observable.just(\n  h('div',\
    \ { className: 'search-field' }, [\n  h('input', { type: 'text' })\n])));\n```\n\
    \n我们希望一切都是 Observable，因此我们将树封装在一个 `just` Observable 中，它只负责返回一个发射我们传递给它的值的 Observable。\n\
    \n现在，我们需要搜索框在用户在输入字段中输入搜索词时查询 Wikipedia API。我们复用了上一节中 `userintentfrom` 函数中的代码：\n\
    \n```javascript\ncycle/searchbox.js\n\nvar searchQuery = apiUrl.FlatMap(function\
    \ (apiUrl) {\n  return responses.DOM.select('.search-field').events('input')\n\
    \  .debounce(300)\n  .map(function (e) { return e.target.value; })\n  .filter(function\
    \ (value) { return value.length > 3; })\n  .map(function (searchTerm) { return\
    \ apiUrl + searchTerm; });\n});\n```\n\n我们仍然需要将 `searchQuery` 的输出连接到 JSON driver\
    \ 的输入。做法就像我们在 Normal Cycle 应用程序中所做的一：\n\n```javascript\ncycle/searchbox.js\n\n\
    return {\n  DOMTree: vtree,\n  JSONPQuery: searchQuery\n};\n```\n\n最后，我们不要忘记导出\
    \ `searchBox` 组件：\n\n```javascript\ncycle/searchbox.js\n\nmodule.exports = searchQuery;\
    \ // 导出为模块\n```\n\n现在我们准备好在应用程序中使用 `searchBox` 组件了。主视图看起来如下：\n\n```javascript\n\
    cycle/index-mvi2.js\n\nvar h = CycleDOM.h;\nvar SearchBox = require('./searchbox');\n\
    \nfunction main(responses) {\n  var wpSearch = checkBox({\n    DOM: responses.DOM,\n\
    \    props$: Rx.Observable.just({\n      apiUrl: API_URL\n    })\n  });\n  var\
    \ searchDOM$ = wpSearch.DOMTree;\n  var searchResults = responses.JSONP\n  .filter(function(res)\
    \ {\n    return res.request.indexOf(API_URL) === 0;\n  }))\n  .concatAll()\n \
    \ .pluck('query', 'search')\n  .startsWith([]);\n  return {\n    JSONP: wpSearchBox.JSONQuery,\n\
    \    DOM: Rx.Observable.combineLatest(\n      searchDOMs, searchResults$, function(tree,\
    \ links) {\n        return h('div', [\n          h('h1', 'Wikipedia Search'),\n\
    \          tree,\n          h('hr'),\n          h('div', links.map(function(link)\
    \ {\n            return h('div', [\n              h('a', { href: WIKI_URL + link.title\
    \ }, link.title)\n            ]);\n          }))\n        ]);\n      })\n    ));\n\
    }\nCycle.run(main, {\n  DOM: CycleDOM.makeDOMDriver('#container'),\n  JSONP: CycleJSONP.makeJSONPDriver()\n\
    });\n```\n\n现在我们委托了处理用户输入和渲染搜索框的责任，我们可以轻松地将其复用于另一个需要查询 URL API 搜索框的应用程序中。这些是主要的更改：\n\
    \n- 导入我们创建的 `searchBox` 组件。\n- 创建 `searchBox` 实例，传递 DOM driver 和我们为搜索组件设置的属性。\n\
    - 我们的 `wpSearchBox` 最终会从它的 `DOMTree` Observable 发射项。我们在这里将其赋值，以便稍后渲染实际 DOM 时使用。\n\
    - 我们将 Wikipedia 查询 URL 发送到 JSONP driver，以便其获取结果。当结果可用时，它们将在 `response.JSON` 中发射，我们在\
    \ `searchResults` 中对其进行精炼。\n- 为了渲染最终的 DOM 树，我们使用 `combineLatest` 结合 `searchDOM`\
    \ 和 `searchResults`。它们中的每一个都会导致布局变化。\n\n通过最终代码，我们可以看到 Web 开发中响应式编程的力量。每个组件都是一个\
    \ Observable，我们只用几行代码就构建了一个功能性的 Wikipedia 搜索框。\n\n每个 `searchBox` 接收一个 Observable。在这种情况下，`props$`\
    \ 是一个发射单个 JavaScript 对象的 Observable，该对象包含了我们 Wikipedia 搜索框的配置参数。\n\n获取属性后，我们为组件定义了虚拟树。在我们的情况下，它是非常简单的树，只包含一个输入字段：\n\
    \n最终代码展示了如何管理副作用以及逻辑是如何解耦的。通过使用 Cycle.js，我们可以构建易于维护和测试的复杂响应式 Web 应用程序。\n"
