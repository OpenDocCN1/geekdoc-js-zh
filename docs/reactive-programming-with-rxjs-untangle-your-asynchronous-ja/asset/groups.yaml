    \     {results.map(function(result) {\n          return (\n            <div>\n\
    \              <a href={WIKI_URL + result.title}>{result.title}</a>\n        \
    \    </div>\n          );\n        })}\n      </div>\n    </div>\n  );\n}\n```\n\
    \n# Getting the Search Term from the User\n\nWe need a function that returns an\
    \ Observable of URLs that query Wikipedia using search terms entered by the user.\
    \ First we declare some URLs our application will use:\n\n```\ncycle.js\nvar MAIN_URL\
    \ = 'https://en.wikipedia.org';\nvar WIKI_URL = MAIN_URL + '/wiki/';\nvar API_URL\
    \ = MAIN_URL + '/w/api.php?' +\n  'action=query&list=searchformat=json&srsearch=';\n\
    function searchRequest(responses) {\n  return responses.DOM.select('.search-field').events('input')\n\
    \    .debounce(300)\n    .map(function(e) { return e.target.value; })\n    .filter(function(value)\
    \ { return value.length > 2; })\n    .map(function(search) { return API_URL +\
    \ search; });\n}\n```\n\nFirst we declare some URLs our application will use.\
    \ In function searchRequest we take a responses object that contains all the drivers,\
    \ and we use the method in the DOM driver. select(element).event(type) behaves\
    \ similarly to fromEvent: it takes a selector for a DOM element and the function\
    \ of event to listen to and returns an Observable that emits events.\n"
