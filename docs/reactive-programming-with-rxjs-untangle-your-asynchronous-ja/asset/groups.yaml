    \ code on page 5, and it reads like this:\n\n- An Observable of click events and\
    \ filter out the clicks that happen on the left side of the screen. Then print\
    \ the coordinates of only the first 10 clicks to the console as they happen.\n\
    \nNotice how the code is easy to read if you're not familiar with it. Also, there's\
