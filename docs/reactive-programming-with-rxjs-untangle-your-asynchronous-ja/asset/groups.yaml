    \ sum: prev.sum + cur,\n    count: prev.count + 1\n  };\n}, {sum: 0, count: 0})\n\
    .map(function(o) {\n  return o.sum / o.count;\n});\nvar subscription = avg.subscribe(function(x)\
    \ {\n  console.log('Average is: ', x);\n});\n```\n\n# Average is: 2\n\nIn this\
    \ code we use reduce to add each new value to the previous one. Because reduce\
