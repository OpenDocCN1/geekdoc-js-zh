  mdcn: "\n\n# 默认调度器 (Default Scheduler)\n\n默认调度器异步执行操作。你可以将其认为类似于延迟为 0 毫秒的 `setTimeout`，它保持了序列中的顺序。它使用了运行平台上可用最高效的异步实现（例如\
    \ Node.js 中的 `process.nextTick` 或浏览器中的 `setTimeout`）。\n\n让我们采用之前带有范围的示例让它在默认调度器上运行。为了实现这一点，我们将使用\
    \ `observeOn` 算符：\n\n```javascript\nconsole.log('Before subscription');\nRx.Observable.range(1,\
    \ 5)\n  .do(function(value) {\n    console.log('Processing value', value);\n \
    \ })\n  .observeOn(Rx.Scheduler.default)\n  .map(function(value) { return value\
    \ * value;})\n  .subscribe(function(value) { console.log('Emitted', value); });\n\
    console.log('After subscription');\n```\n\n- 订阅前\nProcessing value 1\nProcessing\
    \ value 2\nProcessing value 3\nProcessing value 4\nProcessing value 5\n订阅后\nEmitted\
    \ 1\nEmitted 4\nEmitted 9\nEmitted 16\nEmitted 25\n\n此输出存在显著差异。我们的同步 `console.log`\
    \ 语句会对每个值立即执行，但我们让 Observable 运行在默认调度器上，这使得每个值都是异步产生的。这意味着我们在 `do` 算符中的日志语句是在平方值之前被处理的。\n\
    \n# 何时使用它\n\n默认调度器永远不会阻塞事件循环，因此它是涉及时间的操作（如异步请求）的理想选择。它也可以用于永远不会完成 Observable，因为它在等待新通知（可能永远不会发生）时不会阻塞程序。\n\
    \n# 当前线程调度器 (Current Thread Scheduler)\n\n`currentScheduler` 与立即调度器（immediate\
    \ Scheduler）一样同步同步，但当我们使用递归算符时，它会将操作放入队列执行而不是立即执行。递归算符是指自身会调度另一个算符的算符。一个很好的例子是\
    \ `repeat`。`repeat` 算符——如果没有给定参数——会无限重复链中之前的 Observable 序列。\n\n如果你在一个使用立即调度器的算符（例如\
    \ `return`）上调用 `repeat`，你就会遇到麻烦。让我们尝试重复值 10，然后使用 `take` 只获取重复的第一个值。理想情况下，代码应该打印一次\
    \ 10 然后退出：\n\n```javascript\n// 注意：下面的代码将冻结你的环境！\nRx.Observable.return(10).repeat().take(1)\n\
    \  .subscribe(function(value) {\n    console.log(value);\n  });\n```\n\n错误：递归过多\
    \ (Error: Too much recursion)\n\n这段代码会导致无限循环。在订阅时，`return` 调用 `onNext(10)` 然后调用\
    \ `onCompleted`，这使得 `repeat` 再次订阅 `return`。由于 `return` 运行在立即调度器上，这个过程会不断重复，导致无限循环且永远无法到达\
    \ `take`。\n\n但如果我们通过传递第二个参数将 `return` 调度在 `currentThread` 调度器上，就会得到：\n\n```javascript\n\
    var scheduler = Rx.Scheduler.currentThread;\nRx.Observable.return(10, scheduler).repeat().take(1)\n\
    \  .subscribe(function(value) {\n    console.log(value);\n  });\n```\n\n- 10\n\
    \n现在，当 `repeat` 重新订阅 `return` 时，由于之前的 `onCompleted` 仍在发生，新的 `onNext` 调用将被放入队列。`repeat`\
    \ 向 `take` 返回一个可释放对象，该对象调用 `onCompleted` 并通过释放 `repeat` 取消重复，最终来自 `subscribe`\
    \ 的调用返回。\n\n根据经验法则，`currentThread` 调度器应该用于迭代大型序列以及使用如 `repeat` 等递归算符时。\n\n# 何时使用它\n\
    \n`currentIndex` 调度器适用于涉及 `repeat` 等递归算符的操作，并且通常用于包含嵌套算符的迭代。\n\n# 动画调度 (Scheduling\
    \ for Animations)\n\n对于如 canvas 或 DOM 动画等快速视觉更新，我们可以使用具有极低毫秒值的 `interval` 算符，或者创建一个内部使用类似\
    \ `setTimeout` 函数来调度通知的调度器。\n\n但这两种方法都不是理想的。在这两种情况下，我们都是将所有这些更新发送给浏览器，浏览器可能无法处理得足够快。由于浏览器正尝试渲染一帧，然后接收到渲染下一帧的指令，因此它丢弃当前帧以跟上速度。结果就是卡顿的动画。我们在网页上见过太多这种情况了。\n\
    \n浏览器有处理动画的内置方式，并提供了一个使用它的 API，称为 `requestAnimationFrame`。`requestAnimationFrame`\
    \ 允许浏览器通过在最合适的时间排列动画来优化性能，帮助我们实现更平滑的动画。\n\n# 有专门的调度器 (There's a Scheduler for\
    \ That)\n\nRxDOM 库带有一些额外的调度器，其中之一是 `requestAnimationFrame` 调度器。\n\n是的，你可以使用这个调度器来改进我们的飞船游戏。事实上，我们通过以\
    \ 40ms 的刷新速度（大约每秒 25 帧）创建一个该速度的 `interval` Observable，然后使用 `combineLatest` 按 `interval`\
    \ 设置的速度更新整个游戏场景（因为它是更新最快的 Observable）……但谁知道使用这种技术浏览器丢弃了多少帧！使用 `requestAnimationFrame`\
    \ 我们将获得更好的性能。\n\n让我们创建一个使用 `Rx.Scheduler.requestAnimationFrame` 作为调度器的 Observable。注意它的工作方式与\
    \ `interval` 算符类似：\n\n（注：原文后续存在大量重复和乱码的 OCR 文本，已根据指令要求过滤冗余，仅保留逻辑并翻译核心内容。）\n\n\
    ```javascript\nch_schedulers/starfield_raf.js\n\nfunction animationLoop() {\n\
    \  return Rx.Observable.generate(\n    0,\n    function() { return true; }, //\
    \ 无限生成\n    function(x) { return x + 1; },\n    function(x) { return x; },\n \
    \   Rx.Scheduler.requestAnimationFrame);\n}\n```\n\n"
