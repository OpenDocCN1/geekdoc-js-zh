    BehaviorSubject guarantees that there will always be at least one value emitted,
    because we provide a default value in its constructor. Once the BehaviorSubject
    completes it won''t emit any more values, freeing the memory used by the cached
    value.


    # ReplaySubject


    A ReplaySubject caches its values and re-emits them to any Observer that subscribes
    to it. Unlike AsyncSubject, the sequence doesn''t need to be completed for this
    happen.


    | Subject | ReplaySubject |

    | --- | --- |

    | var subject = new Rx.Subject(); | var subject = new Rx.ReplaySubject(); |

    | subject.onNext(1); | subject.onNext(1); |

    | subject.subscribe(function(n) { console.log(''Received value:'', n); }); | subject.subscribe(function(n)
    { console.log(''Received value:'', n); }); |

    | subject.onNext(2); | subject.onNext(2); |

    | subject.onNext(3); | subject.onNext(3); |

    | < Received value: 2 | < Received value: 1 |

    | Received value: 3 | Received value: 2 |


    ReplaySubject is useful to make sure that Observers get all the values emitted
    by an Observable from the start. It spares us from writing messy code that caches
    previous values, saving us from nasty concurrency-related bugs.


    Of course, to accomplish that behavior ReplaySubject caches all values in memory.
    To prevent it from using too much memory, we can limit the amount of data it stores
    by buffer size or window of time, or by passing particular parameters to the constructor.


    The first parameter to the constructor of ReplaySubject takes a number that represents
    many values we want to buffer:'
  - "[PAGE 69]\n\n# Chapter 3. Building Concurrent Programs * 50\n\n```\nvar subject\
    \ = new Rx.ReplaySubject(2); // Buffer size of 2\n\nsubject.onNext(1);\nsubject.onNext(2);\n\
    subject.onNext(3);\n\nsubject.subscribe(function(n) {\n  console.log('Received\
    \ value:', n);\n});\n```\n\n> > Received value: 2\nReceived value: 3\n\nThe second\
    \ parameter takes a number that represents the time in milliseconds during which\
    \ we have to buffer values:\n\n```\nvar subject = new Rx.ReplaySubject(null, 200);\
    \ // Buffer size of 200ms\n\nsetTimeout(function() { subject.onNext(1); }, 100);\n\
    setTimeout(function() { subject.onNext(2); }, 200);\nsetTimeout(function() { subject.onNext(3);\
    \ }, 300);\nsetTimeout(function() {\n  subject.subscribe(function(n) {\n    console.log('Received\
    \ value:', n);\n  });\n});\n\nsubject.onNext(4);\n350);\n```\n\nIn this example\
    \ we set a buffer based on time, instead of the number of values. Our ReplaySubject\
    \ will cache values that were emitted up to 200 milliseconds ago. We emit three\
    \ values, each separated by 100 milliseconds another value, and after 350 milliseconds\
    \ we subscribe an Observer and emit yet another value. At the moment of the subscription\
    \ the items cached are 2 and 3, because 1 happened too long ago (around 250 milliseconds\
    \ ago), so it is no longer cached.\n\nSubjects are a powerful tool that can save\
    \ you a lot of time. They provide great solutions to common scenarios like caching\
    \ and repeating. And since at their core they are just Observables and Observers,\
    \ you don't need to learn anything new.\n\n# Spaceship Reactive!\n\nTo show how\
    \ we can keep an application pure, we'll build a video game in which our hero\
    \ fights endless hordes of enemy spaceships. We'll make heavy use of Observable\
    \ pipelines, and I'll point out all the way when it might be tempting to store\
    \ state outside the pipeline and how to avoid it."
- md: "\nVideo games notoriously keep a lot of external state—scores, screen coordinates\
    \ for the characters, timers, and so on. Our plan is to build the whole game without\
    \ relying on a single external variable that keeps state.\n\nIn our game, the\
    \ player will move the spaceship horizontally using the mouse, and will shoot\
    \ by clicking the mouse or tapping the spacebar. Our game will have four main\
    \ actors: rx, the moving star field in the background, the player's spaceship,\
    \ the enemies, and the shots from both the player and the enemies.\n\nIt will\
    \ look like this:\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_70_0.png)\n\nIn\
    \ the screenshot, the red triangle is our spaceship and the green ones are the\
    \ enemies. The tinier triangles are the fired shots.\n\nLet's start by setting\
    \ the stage; this will be our HTML file:\n\n```\nspaceship-reactive/spaceship.html\n\
    \n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>Spaceship\
    \ Reactive!</title>\n  <script src=\"../rx.all-4.0.0.js\"></script>\n<style>\n\
    \  html, body {\n  margin: 0;\n  padding: 0;\n}\n</style>\n</head>\n<body>\n<script\
    \ src=\"spaceship.js\"></script>\n</body>\n</html>\n```\n\nIt's just a simple\
    \ HTML file that loads the JavaScript file we'll be working with for the rest\
    \ of the chapter. In that JavaScript file, we start by setting up a canvas element\
    \ that we will render:\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_71_0.png)\n\
    \n```\nvar canvas = document.createElement('canvas');\nvar ctx = canvas.getContext(\"\
    2d\");\ndocument.body.appendChild(canvas);\ncanvas.width = window.innerWidth;\n\
    canvas.height = window.innerHeight;\n```\n\nWith this we can start describing\
    \ our game's components. First let's draw our starry background.\n\n## Creating\
    \ the Star Field\n\nThe first things we need for a game set in space are stars.\
    \ We'll create a star field that scrolls down to give the feeling of traveling\
    \ through space. For this, we'll first generate the stars using the range operator:\n\
    \n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_71_1.png)\n\n```\nvar SPEED = 40;\n\
    var STAR_NUMBER = 250;\nvar StarStream = Rx.Observable.range(1, STAR_NUMBER)\n\
    .map(function() {\n  return {\n    x: parseInt(Math.random() * canvas.width),\n\
    \    y: parseInt(Math.random() * canvas.height),\n    size: Math.random() * 3\
    \ + 1\n  };\n});\n```\n\nEach star will be represented by an object that contains\
    \ random coordinates and a size between 1 and 4. This code will give us a stream\
    \ that generates 250 of these \"stars.\"\n\nWe want these stars to keep moving.\
    \ A way to do that is to increase the y-coordinate every few milliseconds for\
    \ all stars. We'll transform the StarStream Observable into an array toArray,\
    \ which will emit a single array containing all the objects generated by range.\
    \ Then we can pick up that array with a flatMap operator that will transform the\
    \ Observable into one that yields a value every few milliseconds. Using map we\
    \ can increase the y-coordinate in each item of the original array. We even get\
    \ a nice parallax effect for free moving star a distance from its size:\n\n`spaceship_reactive/starfield_1.js`\n\
    \n```\nvar SPEED = 40;\nvar STAR_NUMBER = 250;\nvar StarStream = Rx.Observable.range(1,\
    \ STAR_NUMBER)\n.map(function() {\n  return {\n    x: parseInt(Math.random() *\
    \ canvas.width),\n    y: parseInt(Math.random() * canvas.height),\n    z: Math.random()\
    \ * 3 + 1\n  };\n})\n.toArray()\n.flatMap(function(starArray) {\n  return Rx.Observable.interval(SPEED).map(function()\
    \ {\n    starArray.forEach(function(star) {\n      if (star.y >= canvas.height)\
    \ {\n        star.y = 0; // Reset star to top of the\n      }\n      star.y +=\
    \ star.size; // Move star\n    });\n    return starArray;\n  });\n```\n\nInside\
    \ map we check if the y-coordinate is already outside the screen, and in this\
    \ case we reset it to 0. By changing the coordinates in every star object we can\
    \ keep using the same array of stars all the time.\n\nNow we need a smaller helper\
    \ function that \"paints\" an array of stars on our canvas:\n\n`spaceship_reactive/starfield_1.js`\n\
    \n```\nfunction paintStars(stars) {\n  ctx.fillStyle = '#000000';\n  ctx.fillRect(0,\
    \ 0, canvas.width, canvas.height);\n  ctx.fillStyle = '#ffffff';\n  stars.forEach(function(star)\
    \ {\n    ctx.fillRect(star.x, star.y, star.size, star.size);\n  });\n}\n```\n\n\
    paintStars paints a black background and draws the stars on the canvas. The only\
    \ thing left to achieve a moving star field is to subscribe to the Observable\
    \ and call paintStars with the resulting array. Here's the final code:\n\n```\n\
    spaceship_reactive/starfield_1.js\nfunction paintStars(stars) {\n  ctx.fillStyle\
    \ = '#000000';\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n  ctx.fillStyle\
    \ = '#ffffff';\n  stars.forEach(function(star) {\n    ctx.fillRect(star.x, star.y,\
    \ star.size, star.size);\n  });\n}\nvar SPEED = 40;\nvar StarStream = Rx.Observable.range(1,\
    \ STAR_NUMBER)\n  .map(function() {\n    return {\n      x: parseInt(Math.random()\
    \ * canvas.width),\n      y: parseInt(Math.random() * canvas.height),\n      size:\
    \ Math.random() * 3 + 1\n    };\n  })\n  .toArray()\n  .flatMap(function(starArray)\
    \ {\n    return Rx.Observable.interval(SPEED).map(function(star) {\n      if (star.y\
    \ >= canvas.height) {\n        star.y = 0; // Reset star to top of the screen\n\
    \      }\n      star.y += star.size; // Move star\n      return starArray;\n \
    \   });\n  })\n  .subscribe(function(starArray) {\n    paintStars(starArray);\n\
    \  });\n```\n\nNow we've set the stage, it's time for our hero to make an appearance.\n\
    \n## Adding the Player's Spaceship\n\nNow that we have our beautiful starry background,\
    \ we're ready to program the hero's spaceship. Even though it's the most important\
    \ object in the game, our spaceship is deceptively simple. An Observer of mouse\
    \ moves that emits the current mouse x-coordinate and a constant y-coordinate\
    \ (the player only moves horizontally, so we never change the y-coordinate):\n\
    \n`spaceship_reactive/hero_1.js`\n\n```\nvar HERO_Y = canvas.height - 30;\nvar\
    \ mouseMove = Rx.Observable.fromEvent(canvas, 'mousemove');\nvar SpaceShip = mouseMove\n\
    \  .map(function(event) {\n    return {\n      x: event.clientX,\n      y: HERO_Y\n\
    \    }\n  }).startWith({\n  x: canvas.width / 2,\n  y: HERO_Y\n});\n```\n\nNotice\
    \ that I used startWith(). This sets the first value in the Observable, and set\
    \ it to a position in the middle of the screen. Without startWith our Observable\
    \ would start emitting only when the player moves the mouse.\n\nLet's render our\
    \ hero on the screen. In this game all the characters are triangles (my graphic-design\
    \ skills are not very impressive), so we'll define a helper function to render\
    \ triangles on the canvas, given the coordinates, size, and color, and the direction\
    \ they're facing:\n\n`spaceship_reactive/hero_1.js`\n\n```javascript\nfunction\
    \ drawTriangle(x, y, width, color, direction) {\n  ctx.fillStyle = color;\n  ctx.beginPath();\n\
    \  ctx.moveTo(x - width, y);\n  ctx.lineTo(x, direction === 'up' ? y - width :\
    \ y + width);\n  ctx.lineTo(x + width, y);\n  ctx.lineTo(x - width, y);\n  ctx.fill();\n\
    }\n```\n\nWe'll also define paintSpace, which uses the helper function:\n\n`spaceship_reactive/hero_1.js`\n\
    \n```javascript\nfunction paintSpaceShip(x, y, 20, '#ff0000', 'up') {\n  drawTriangle(x,\
    \ y);\n}\n```\n\nBut we're facing a problem now. If we subscribe to the SpaceShip\
    \ Observable and call drawTriangle in the subscription, our spaceship would be\
    \ visible only when we move the mouse, and for just an instant. This is because\
    \ starStream is updating the canvas many times per second, crashing our spaceship\
    \ if we don't move the mouse. And because the starStream doesn't have direct access\
    \ to the spaceship, we can't render the spaceship in the starStream subscription.\n\
    \nWe could save the latest spaceship coordinates to a variable that the starStream\
    \ can access, but then we would be breaking our rule of not modifying external\
    \ state. What to do?\n\nAs is usually the case. RxJS has a very convenient operator\
    \ we can use to solve our problem.\n\nRx.Observable.combineLatest is a handy operator.\
    \ It takes two or more Observables and emits the last result of each whenever\
    \ any of them emits a new value. Knowing that starStream emits new item (the array\
    \ of stars) frequently, we can remove the starStream subscription and use combineLatest\
    \ to combine both the starStream and SpaceShip Observables and update them as\
    \ soon as any of them emit a new item:\n\n`spaceship_reactive/hero.js`\n\n```javascript\n\
    function renderScene(actors) {\n  paintStars(actors.stars);\n  paintSpaceShip(actors.spaceship.x,\
    \ actors.spaceship.y);\n}\n\nvar Game = Rx.Observable\n  .combineLatest(\n   \
    \ StarStream, SpaceShip,\n    function(stars, spaceship) {\n      return { stars:\
    \ stars, spaceship: spaceship };\n    });\n```\n\nGame.subscribe(renderScene);\n\
    \nWe're now using a function renderScene to paint everything on the screen, you\
    \ can remove the following subscription code for StarStream:\n\n```javascript\n\
    .subscribe(function(starArray) {\n  paintStars(starArray);\n});\n```\n\n## Generating\
    \ Enemies\n\nThis would be a very boring game if we didn't have any enemies to\
    \ take care of. So let's create an infinite stream of them! We want to create\
    \ a new enemy\n"
  mdcn: "\n视频游戏通常会维护大量的外部状态——分数、角色的屏幕坐标、计时器等。我们的计划是构建整个游戏，且不依赖任何一个保持状态的外部变量。\n\n在我们的游戏中，玩家将使用鼠标水平移动飞船，并通过点击鼠标或按下空格键来射击。我们的游戏将包含四个主要的执行者：rx、背景中移动的星场、玩家的飞船、敌人，以及玩家和敌人的子弹。\n\
    \n它看起来是这样：\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_70_0.png)\n\n在截图中，红色三角形是我们的飞船，绿色的是敌人。较小的三角形是射出的子弹。\n\
    \n让我们从搭建舞台开始；这将是 HTML 文件：\n\n```\nspaceship-reactive/spaceship.html\n\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>Spaceship Reactive!</title>\n\
    \  <script src=\"../rx.all-4.0.0.js\"></script>\n<style>\n  html, body {\n  margin:\
    \ 0;\n  padding: 0;\n}\n</style>\n</head>\n<body>\n<script src=\"spaceship.js\"\
    ></script>\n</body>\n</html>\n```\n\n这只是一个简单的 HTML 文件，加载了我们在在本章节剩余部分将使用的 JavaScript\
    \ 文件。在那个 JavaScript 文件中，我们首先设置一个我们将要渲染的 canvas 元素：\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_71_0.png)\n\
    \n```\nvar canvas = document.createElement('canvas');\nvar ctx = canvas.getContext(\"\
    2d\");\ndocument.body.appendChild(canvas);\ncanvas.width = window.innerWidth;\n\
    canvas.height = window.innerHeight;\n```\n\n通过这个，我们可以开始描述游戏的组件。首先，让我们画出星空背景。\n\
    \n## 创建星场\n\n对于在太空太空的游戏，我们首先需要的是星星。我们将创建一个向下滚动的星场，以营造出穿梭太空的感觉。为了这一点，我们将首先使用范围操作符来生成星星：\n\
    \n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_71_1.png)\n\n```\nvar SPEED = 40;\n\
    var STAR_NUMBER = 250;\nvar StarStream = Rx.Observable.range(1, STAR_NUMBER)\n\
    .map(function() {\n  return {\n    x: parseInt(Math.random() * canvas.width),\n\
    \    y: parseInt(Math.random() * canvas.height),\n    size: Math.random() * 3\
    \ + 1\n  };\n});\n```\n\n每颗星星将由一个包含随机坐标和 1 到 4 之间大小的对象表示。这段代码将为我们提供生成 250 颗此类“星星”的流。\n\
    \n我们希望这些星星持续移动。方法是每隔几毫秒增加所有星星的 y 坐标。我们将 StarStream Observable 转换为数组 `toArray`，它将发射一个包含由\
    \ `range` 生成的所有对象的数组。然后我们可以使用 `flatMap` 操作符获取该数组，它将 Observable 转换为一个每隔几毫秒产生一个值的\
    \ Observable。使用 `map`，我们可以增加原始数组中每个项的 y 坐标。我们甚至还免费获得了一个根据移动星星距离与其大小比例的良好视差效果：\n\
    \n`spaceship_reactive/starfield_1.js`\n\n```\nvar SPEED = 40;\nvar STAR_NUMBER\
    \ = 250;\nvar StarStream = Rx.Observable.range(1, STAR_NUMBER)\n.map(function()\
    \ {\n  return {\n    x: parseInt(Math.random() * canvas.width),\n    y: parseInt(Math.random()\
    \ * canvas.height),\n    z: Math.random() * 3 + 1\n  };\n})\n.toArray()\n.flatMap(function(starArray)\
    \ {\n  return Rx.Observable.interval(SPEED).map(function() {\n    starArray.forEach(function(star)\
    \ {\n      if (star.y >= canvas.height) {\n        star.y = 0;\n      }\n    \
    \  star.y += star.size;\n    });\n    return starArray;\n  });```\n\n在 `map` 内部，我们检查\
    \ y 坐标是否已经离开了屏幕，在这种情况下将其重置为 0。通过更改每个星星对象的坐标，我们可以一直使用同一个星星数组。\n\n现在，我们需要一个较小的辅助函数在我们的\
    \ canvas 上“绘制”星星数组：\n\n`spaceship_reactive/starfield_1.js`\n\n```\nfunction paintStars(stars)\
    \ {\n  ctx.fillStyle = '#000000';\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n\
    \  ctx.fillStyle = '#ffffff';\n  stars.forEach(function(star) {\n    ctx.fillRect(star.x,\
    \ star.y, star.size, star.size);\n  });\n}\n```\n\n`paintStars` 绘制背景并在 canvas\
    \ 上绘制星星。实现移动星场的唯一工作就是订阅 Observable 并使用结果数组调用 `paintStars`。这是最终的代码：\n\n```\nspaceship-reactive/starfield_1.js\n\
    function paintStars(stars) {\n  ctx.fillStyle = '#000000';\n  ctx.fillRect(0,\
    \ 0, canvas.width, canvas.height);\n  ctx.fillStyle = '#ffffff';\n  stars.forEach(function(star)\
    \ {\n    ctx.fillRect(star.x, star.y, star.size, star.size);\n  });\n}\nvar SPEED\
    \ = 40;\nvar StarStream = Rx.Observable.range(1, STAR_NUMBER)\n  .map(function()\
    \ {\n    return {\n      x: parseInt(Math.random() * canvas.width),\n      y:\
    \ parseInt(Math.random() * canvas.height),\n      size: Math.random() * 3 + 1\n\
    \    };\n  })\n  .toArray()\n  .flatMap(function(starArray) {\n    return Rx.Observable.interval(SPEED).map(function(star)\
    \ {\n      if (star.y >= canvas.height) {\n        star.y = 0; // 重置星星到顶部\n  \
    \    }\n      star.y += star.size; // 移动星星\n    });\n    return starArray;\n \
    \ })\n  .subscribe(function(starArray) {\n    paintStars(starArray);\n  });\n\
    ```\n\n现在我们已经搭建好了舞台，是时候让英雄登出现了。\n\n## 添加玩家飞船\n\n有了漂亮的星空背景，我们就可以编写英雄的飞船了。尽管它是游戏中最重要的对象，但我们的飞船编写起来非常简单。一个鼠标观察者会发射当前的鼠标\
    \ x 坐标和固定的 y 坐标（玩家只水平移动，所以我们永远改变 y 坐标）：\n\n`spaceship_reactive/hero_1.js`\n\n\
    ```\nvar HERO_Y = canvas.height - 30;\nvar mouseMove = Rx.Observable.fromEvent(canvas,\
    \ 'mousemove');\nvar SpaceShip = mouseMove\n  .map(function(event) {\n    return\
    \ {\n      x: event.clientX,\n      y: HERO_Y\n    }\n  }).startWith({\n  x: canvas.width\
    \ / 2,\n  y: HERO_Y\n});\n```\n\n注意我使用了 `startWith()`。它设置了 Observable 中的第一个值，并将其设置为屏幕中间。如果没有\
    \ `startWith`，我们的 Observable 只会在玩家移动鼠标时开始发射值。\n\n让我们在屏幕上渲染我们的英雄。在这个游戏中，所有角色都是三角形（我的图形设计技能并不出色），所以我们将定义一个辅助函数，根据坐标、大小、颜色以及它们朝向的方向在\
    \ canvas 上渲染三角形：\n\n`spaceship_reactive/hero_1.js`\n\n```javascript\nfunction\
    \ drawTriangle(x, y, width, color, direction) {\n  ctx.fillStyle = color;\n  ctx.beginPath();\n\
    \  ctx.moveTo(x - width, y);\n  ctx.lineTo(x, direction === 'up' ? y - width :\
    \ y + width);\n  ctx.lineTo(x + width, y);\n  ctx.lineTo(x - width, y);\n  ctx.fill();\n\
    }\n```\n\n我们还会定义 `paintSpace`，它使用了该辅助函数：\n\n`spaceship_reactive/hero_1.js`\n\n\
    ```javascript\nfunction paintSpaceShip(x, y, 20, '#ff0000', 'up') {\n  drawTriangle(x,\
    \ y);\n}\n```\n\n但我们现在遇到了一个问题。如果我们订阅 `SpaceShip` Observable 并在订阅中调用 `drawTriangle`，那么我们的飞船只在我们移动鼠标时可见，而且只有一瞬间。这是因为\
    \ `starStream` 每秒更新 canvas 很多次，如果不移动鼠标，我们的飞船就会“崩溃”。而且由于 `starStream` 无法直接访问飞船，我们无法在\
    \ `starStream` 订阅中渲染飞船。\n\n我们可以将最新的飞船坐标保存到 `starStream` 可以访问的变量中，但这样做违反了不修改外部状态的规则。该怎么办？\n\
    \n通常情况下，RxJS 有一个非常方便的操作符可以解决我们的问题。\n\n`Rx.Observable.combineLatest` 是一个实用的操作符。它接受两个或多个\
    \ Observable，并在其中任何一个发射新值时，发射它们最后的结果。由于 `starStream` 频繁发射新项（星星数组），我们可以移除 `starStream`\
    \ 的订阅，并使用 `combineLatest` 结合 `starStream` 和 `SpaceShip` Observable，在它们任何一个发射新项时立即更新它们：\n\
    \n`spaceship_reactive/hero.js`\n\n```javascript\nfunction renderScene(actors)\
    \ {\n  paintStars(actors.stars);\n  paintSpaceShip(actors.spaceship.x, actors.spaceship.y);\n\
    }\n\nvar Game = Rx.Observable\n  .combineLatest(\n    StarStream, SpaceShip,\n\
    \    function(stars, spaceship) {\n      return { stars: stars, spaceship: spaceship\
    \ };\n    });\n```\n\nGame.subscribe(renderScene);\n\n```\n\n我们现在使用函数 `renderScene`\
    \ 来绘制屏幕上的所有内容，你可以移除以下针对 `StarStream` 的订阅代码：\n\n```javascript\n.subscribe(function(starArray)\
    \ {\n  paintStars(starArray);\n});\n```\n\n## 生成敌人\n\n如果没有敌人对付，这个游戏将非常无聊。所以，让我们创建一个它们的无限流吧！我们想要创建一个新的敌人\n\
    \n"
