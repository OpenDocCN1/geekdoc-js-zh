    \ enemies\n  }\n)\n.sample(SPEED)\n.subscribe(renderScene);\n```\n\nBy calling\
    \ sample after combineLatest we make sure combineLatest will never yield any value\
    \ faster than 40 milliseconds after the previous one (our constant SPEED is set\
