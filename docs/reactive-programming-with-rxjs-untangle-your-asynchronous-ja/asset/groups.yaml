    quakes\n  .pluck('properties')\n  .map(makeRow)\n  .subscribe(function(row) {\
    \ table.appendChild(row); });\n```\n\nThe pluck operator extracts the value of\
    \ properties from each earthquake object, because it contains all the info we\
    \ need for makeRow. Then we map each earthquake object to makeRow to transform\
    \ it into a populated HTML tr element. Finally, in the subscription we append\
    \ every emitted row to our table.\n\n# Hot and Cold Observables\n\n“Hot” Observables\
    \ emit values regardless of Observers being subscribed to them. On the other hand,\
    \ “cold” Observables emit the entire sequence of values from the start to every\
    \ Observer.\n"
  mdcn: "\n为了记录分数，我们将使用一个初始值为 0 的 `BehaviorSubject`。我们可以轻松地在基于 `combineLatest` 的主游戏循环中使用它，就像使用另一个\
    \ `Observable` 一样，并且随时向它推送值。\n\nspaceship_reactive/score.js\n\n```\nvar ScoreSubject\
    \ = new Rx.BehaviorSubject(0);\nvar score = ScoreSubject.scan(function(prev, cur)\
    \ {\n  return prev + cur;\n}, 0);\n```\n\n在那段代码中，我们使用 `scan` 算子将每个新值累加到总聚合结果中。\n\
    \n现在，每当我们击中敌人时，必须向 Subject 推送分数；这发生在 `paintHeroShots` 中。\n\nspaceship_reactive/score.js\n\
