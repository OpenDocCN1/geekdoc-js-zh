    \ way to think about asynchronous code. I'll show how streams of events—which\
    \ we call Observables—are a beautiful way to handle asynchronous code. Then we\
    \ will create an Observable and see how reactive thinking and RxJS dramatically\
    \ improve on existing techniques and make you a happier, more productive programmer.\n\
    \n# What's Reactive?\n\nLet's start by looking at a little reactive RxJS program.\
    \ This program needs to retrieve data from different sources with the click of\
