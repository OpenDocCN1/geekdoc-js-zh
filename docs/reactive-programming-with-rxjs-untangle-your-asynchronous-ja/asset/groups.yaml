    # Preface


    Reactive programming is taking the software world by storm. This book combines
    the reactive programming philosophy with the possibilities of JavaScript, and
    you''ll learn how to apply reactive techniques to your own projects. We''ll focus
    on reactive programming to manage and combine streams of events. In fact, we''ll
    cover how to make entire real-world, concurrent applications just by declaring
    transformations on your program''s events.


    Most software today deals with data that is available only over time: websites
    load remote resources and respond to complex user interactions, servers are distributed
    across multiple physical locations, and people have mobile devices that they expect
    to work at all times, whether on high-speed Wi-Fi or spoty cellular networks.
    Any serious application involves many asynchronous parts that need to be efficiently
    coordinated, and that''s very hard with today''s programming techniques. On top
    of that, we have what''s always been here: servers crashing, slow networks, and
    software bugs we have to deal with.


    We can''t afford to keep programming applications the way we always have. Worked
    for a while, but now it''s time for a new approach.


    # New World, Old Methods


    In recent years JavaScript has become the most ubiquitous language in the world
    and now powers the mission-critical infrastructure of businesses such as Walmart
    and Netflix,¹ mobile operating systems such as Firefox OS, and complex popular
    applications as Google Docs.


    And yet we''re still using ol'' imperative-style programming to deal with problems
    that are essentially asynchronous. This is very hard.


    JavaScript developers see the language''s length of threads as a feature, and
    we usually write asynchronous code using callbacks, promises, and events But


    > ¹ http://venturebeat.com/2014/01/24/why-walmart-is-using-node-js/, http://techblog.netflix.com/2014/06/scale-and-performance-of-large.html'
- md: "\nas we keep adding more concurrency to our applications, the code to coordinate\
    \ asynchronous flows becomes unwieldy. Current mechanisms all have serious shortcomings\
    \ that hinder the developer's productivity and make for fragile applications.\n\
    \nHere's a quick rundown of the current mechanisms for handling asynchronous operations,\
    \ along with their problems.\n\n## Callback Functions\n\nA callback is a function\
    \ (A) passed as a parameter to another function (B) that performs an asynchronous\
    \ operation. When (B) is done, it calls back (A) with the results of the operation.\
    \ Callbacks are used to manage asynchronous flows such as network I/O, database\
    \ access, or user input.\n\n```javascript\n//callback_example.js\n```\n\n```javascript\n\
    function B(callback) {\n  // Do operation that takes some time\n  callback('Done!');\n\
    }\n\nfunction A(message) {\n  console.log(message);\n}\n\n// Execute 'B' with\
    \ 'A' as a callback\nB(A);\n```\n\nCallbacks are easy to grasp and have become\
    \ the default way of handling asynchronous flows in JavaScript. But this simplicity\
    \ comes at a price. Callbacks have the following drawbacks:\n\n- *Callback hell.\
    \ It's easy to end up with lists of nested callbacks when dealing highly asynchronous\
    \ code. When that happens, code stops being linear and becomes hard to reason\
    \ about. While applications end up passed around in callbacks, and they become\
    \ difficult to maintain and debug.\n\n- *Callbacks can run more than once. There's\
    \ no guarantee the same callback will be called only once. Multiple invocations\
    \ can be hard to detect and result in errors and general mayhem in your application.\n\
    \n- *Callbacks change error semantics. Callbacks break the traditional try/catch\
    \ mechanism and rely on the programmer to check for errors and pass them around.\n\
    \n- * Concurrency gets increasingly complicated. Combining interdependent results\
    \ of multiple asynchronous operations becomes difficult. It requires us to keep\
    \ track of the state of each operation in temporal variables, and then delegate\
    \ them to the final combination operation in the proper order.\n\n## Promises\n\
    \nPromises came to save us from callbacks. A promise represents the result of\
    \ an asynchronous operation. In promise-based code, calling an asynchronous function\
    \ immediately returns a “promise” that will eventually be either resolved or rejected\
    \ with an error. In the meantime, the pending promise can be used as a placeholder\
    \ for the final value.\n\nPromises usually make programs more clear by being closer\
    \ to synchronous code, reducing the need for nesting blocks and keeping track\
    \ of less state.\nUnfortunately, promises are not a silver bullet. They’re an\
    \ improvement over callbacks, but they have a major shortcoming: they only ever\
    \ yield a single value. That makes them useless for handling recurrent events\
    \ as mouse clicks or streams of data from the server, because we would have to\
    \ create a promise for each separate event instead of creating a promise that\
    \ handles the stream of events as it comes.\n\n## Event Emitters\n\nWhen we emit\
    \ an event, event listeners that are subscribed to it will fire. Using events\
    \ is a great way to decouple functionality, and in JavaScript, event programming\
    \ is common and generally a good practice.\n\nBut, you guessed it, event listeners\
    \ come with their own set of problems, too:\n\n- * Events force side effects.\
    \ Event listener functions always ignore their return values, which forces the\
    \ listener to have side effects if it wants to have any impact in the world.\n\
    - * Events are not first-class values. For example, a series of click events can’t\
    \ be passed as a parameter or manipulated as the sequence it actually is. We’re\
    \ limited to handling each event individually, and only after the event happens.\n\
    - * It is easy to miss events if we start listening too late. An infamous example\
    \ of that is the first version of the streams interface in Node.js, which would\
    \ often emit its data event before listeners had time to listen to it, losing\
    \ its forever.\n\nSince these mechanisms are what we’ve always used to manage\
    \ concurrency, it might be hard to think of a better way. But in this book I’ll\
    \ show you one: reactive programming and RxJS try to solve all these problems\
    \ with some new concepts and mechanisms to make asynchronous programming a breeze—and\
    \ much more fun.\n\n## What Is Reactive Programming?\n\nReactive programming is\
    \ a programming paradigm that encompasses many concepts and techniques. In this\
    \ book I'll focus particularly on creating, transforming, and reacting to streams\
    \ of data. Mouse clicks, network requests, arrays of strings—all these can be\
    \ expressed as streams to which we can “react” as they publish new values, using\
    \ the same interfaces regardless of their source.\n\nReactive programming focuses\
    \ on propagating changes without our having to explicitly specify how our code\
    \ should do, without having to code every step to do it. This results in a more\
    \ reliable and maintainable approach to building software.\n\n## What Is RxJS?\n\
    \nRxJS is a JavaScript implementation of the Reactive Extensions, or Rx². Rx is\
    \ a reactive programming model originally created at Microsoft that allows developers\
    \ to easily compose asynchronous streams of data. It provides a common interface\
    \ to combine and transform data from wildly different sources, such as filesystem\
    \ operations, user interaction, and social-network updates.\n\nRx started with\
    \ an implementation for .NET, but today it has a well-maintained open source implementation\
    \ in every major language (and some minor ones). It is becoming the standard to\
    \ program reactive applications, and Observable is being proposed for inclusion\
    \ in ECMAScript 7 as an integral part of JavaScript.\n\n## Who This Book Is For\n\
    \nThis book is for developers with some experience with JavaScript. You should\
    \ be comfortable with closures and higher-order functions, and you should understand\
    \ the scope rules in JavaScript. That being said, I try to explain the most complex\
    \ language concepts we go through in this book.\n\n> 2. https://rx.codeplex.com/\n\
    \n## What's in This Book\n\nThis book is a practical introduction to reactive\
    \ programming using RxJS. The objective is to get you to think reactively by building\
    \ real-world applications, so you can learn how to introduce reactive programming\
    \ in your day-to-day and make your programs more robust. This is not a theoretical\
    \ book about reactive programming, and it is not an exhaustive reference book\
    \ for the RxJS API. You can find these kinds of resources online.\n\nWe'll developing\
    \ mostly for the browser, but we'll see some examples in Node.js, too. We'll get\
    \ deep into the subject early on, and we'll build applications along the way to\
    \ keep it real. Unless you have used RxJS before, start with Chapter 1, The Reactive\
    \ Way, on page 1. In this chapter we introduce Observables, the main data type\
    \ of RxJS, which we will use extensively throughout the book.\n\nWith the basics\
    \ of Observables established, we move on to Chapter 2, Deep in the Sequence, on\
    \ page 17. You see that in reactive programming it's all sequences of events.\
    \ We visit some important sequence operators and we build our first application,\
    \ a real-time earthquake visualizer.\n\nIn Chapter 3, Building Concurrent Programs,\
    \ on page 39, we look at how to write concurrent code with minimal side effects.\
    \ After covering the Observable pipeline, we build a cool spaceship video game\
    \ in about 200 lines of code and with almost no global state.\n\nIn Chapter 4,\
    \ Building a Complete Web Application, on page 69, we get deeper into reactive\
    \ app development and enhance the earthquake application we made previously by\
    \ making a server part in Node.js that shows tweets related to earthquakes happening\
    \ right now.\n\nWe get into more advanced concepts of RxJS with Chapter 5, Bending\
    \ Time with Schedules, on page 89, where we talk about the useful concept RxJS\
    \ provides to handle concurrency at a more fine-grained level: Schedulers.\n\n\
    With the knowledge of Schedulers under our heads, we explore how they help us\
    \ with testing. We'll see how to simulate time in our tests to accurately test\
    \ asynchronous programs.\n\nFinally, in Chapter 6, Reactive Web Applications with\
    \ Cycle.js, on page 103, we'll use Cycle.js, a UI framework built on top of RxJS,\
    \ to build a simple application. Cycle.js draws concepts from modern frameworks\
    \ such as React.js to create a reactive framework that uses the advantages of\
    \ Observables to help us create fast user interfaces in a simple and reliable\
    \ way.\n"
  mdcn: "\n随着我们不断在应用程序中增加并发性，协调异步流的代码变得越来越难以维护。目前的机制都存在严重的缺陷，阻碍了开发者的生产力，并导致应用程序变得脆弱。\n\
    \n以下是处理异步操作的现有机制简要介绍以及它们存在的问题。\n\n## 回调函数 (Callback Functions)\n\n回调是一个作为参数传递给执行异步操作的另一个函数\
    \ (B) 的函数 (A)。当 (B) 完成时，它会回调 (A) 并传入操作结果。回调被用于管理网络 I/O、数据库访问或用户输入等异步流。\n\n```javascript\n\
    //callback_example.js\n```\n\n```javascript\nfunction B(callback) {\n  // 执行一些需要时间的操作\n\
    \  callback('Done!');\n}\n\nfunction A(message) {\n  console.log(message);\n}\n\
    \n// 使用 'A' 作为回调执行 'B'\nB(A);\n```\n\n回调函数易于理解，并已成为 JavaScript 中处理异步流的默认方式。但这种简单性是有付代价的。回调有以下缺点：\n\
    \n- *回调地狱（Callback hell）。在处理高度异步的代码时，很容易陷入嵌套回调列表中。当发生这种情况时，代码不再是线性的，变得难以理解。同时，应用程序在回调中层层传递，变得难以维护和调试。*\n\
    \n- *回调可能会运行多次。无法保证同一个回调只被调用一次。多次调用可能难以察觉，并导致应用程序中出现错误和各种混乱。*\n\n- *回调改变了错误语义。回调破坏了传统的\
    \ try/catch 机制，依赖程序员手动检查错误并在程序中传递它们。*\n\n- * 并发性变得日益复杂。组合多个异步操作之间相互依赖的结果变得非常困难。这要求我们在临时变量中跟踪每个操作的状态，然后按照正确的顺序将它们委托给最终的组合操作。*\n\
    \n## Promises (承诺对象)\n\nPromise 的出现是为了让我们从回调中解脱出来。一个 Promise 代表一个异步操作的结果。在基于 Promise\
    \ 的代码中，调用异步函数会立即返回一个“promise”，它最终会被解析（resolved）或被错误拒绝（rejected）。在此期间，挂起的（pending）promise\
    \ 可以作为最终值的占位符。\n\nPromise 通常通过更接近同步代码来使程序更加清晰，减少了嵌套块的需求并减少了状态的跟踪。\n遗憾的是，Promise\
    \ 并非灵丹妙药。它们是对回调的改进，但有一个主要的缺点：它们永远只能产生单个值。这使得它们在处理鼠标点击或来自服务器的数据流等循环事件时变得毫无用，因为我们必须为每个独立事件创建一个\
    \ promise，而不是创建一个处理随之而来的事件流的 promise。\n\n## 事件发射 (Event Emitters)\n\n当我们发布事件时，订阅了该事件的事件监听器就会触发。使用事件是解耦功能的极方法，在\
    \ JavaScript 中，事件编程非常常见且通常是一种良好的做法。\n\n但是，正如你所料的，事件监听器也有自己的问题：\n\n- * 事件强制产生副作用。事件监听器函数总是忽略其返回值，这迫使监听器如果对世界产生任何影响，就产生副作用。*\n\
    - * 事件不是一等值。例如，一系列点击事件无法作为参数传递，也无法作为其实际序列来进行操作。我们局限于单独处理每个事件，并且只能在事件发生后进行处理。*\n\
    - * 如果我们开始监听得太晚，很容易错过事件。一个臭名的例子是 Node.js 中流接口的第一个版本，它经常在监听器来得及监听之前就发布了数据事件，导致丢失了永久性。*\n\
    \n由于这些机制是我们一直用来管理并发的工具，可能很难想出更好的方法。但在书中，我将向你展示一种：响应式编程和 RxJS 尝试通过一些新概念和机制来解决所有问题，让异步编程变得轻松自如且有趣得多。\n\
    \n## 什么是响应式编程？\n\n响应式编程是一种包含许多概念和技术的编程范式。在书中，我将特别关注数据流的创建、转换和响应。鼠标点击、网络请求、字符串数组——所有这些都可以表示为流，当它们发布新值时，我们可以做出“反应”，无论其来源如何，都使用相同的接口。\n\
    \n响应式编程关注于传播变化，而无需我们显式指定代码应该如何做，也不需要为每一步编写代码。这导致了一种更可靠、更易维护的软件构建方法。\n\n## 什么是\
    \ RxJS？\n\nRxJS 是 Reactive Extensions（或称 Rx²）的 JavaScript 实现。Rx 是最初在微软创建的一种响应式编程模型，允许开发者轻松地组合异步数据流。它提供了一个通用接口，用于合并和转换来自完全不同源的数据，例如文件系统操作、用户交互和社交网络更新。\n\
    \nRx 起于 .NET 的实现，但今天在每种主流语言（以及一些少数语言）中都有良好的开源实现。它正成为编写响应式应用程序的标准，并且 Observable\
    \ 正被提议纳入 ECMAScript 7 作为 JavaScript 的不可组成部分。\n\n## 这本书适合谁读\n\n本书适合具有一定 JavaScript\
    \ 经验的开发者。你应该熟悉闭包和高阶函数，并理解 JavaScript 中的作用域规则。尽管如此，我也会尝试解释我们在书中涉及的最复杂的语言概念。\n\n\
    > 2. https://rx.codeplex.com/\n\n## 本书中包含的内容\n\n本书是一本关于使用 RxJS 进行响应式编程的实战介绍。目标是通过构建真实世界的应用让你学会以响应式方式思考，这样你就可以学习如何在日常工作中引入响应式编程，并让你的程序更加健壮。这并不是一本关于响应式编程的理论书籍，也不是\
    \ RxJS API 的详尽参考书。你可以在网上找到这类资源。\n\n我们将主要针对浏览器开发，但也会看到 Node.js 的示例。我们将尽早深入主题，并在过程中构建应用程序以保持真实性。除非你之前用过\
    \ RxJS，否则请从第 1 章“响应式之路 (The Reactive Way)”开始。在这一章中，我们将介绍 RxJS 的核心数据类型 Observable，并在书中大量使用。\n\
    \n在建立了 Observable 的基础之后，我们进入第 2 章“深入序列 (Deep in the Sequence)”。你会发现在响应式编程中一切都是事件序列。我们将访问一些重要的序列操作符，并构建第一个应用程序：实时地震可视化器。\n\
    \n在第 3 章“构建并发程序 (Building Concurrent Programs)”中，我们将查看如何用最少的副作用编写并发代码。在涵盖 Observable\
    \ 管道后，我们将用大约 200 行代码编写一个几乎没有全局状态酷飞船游戏。\n\n在第 4 章“构建完整的 Web 应用程序 (Building a Complete\
    \ Web Application)”中，我们将深入响应式应用开发，并通过制作 Node.js 服务器部分来增强之前的地震应用程序，显示与当前发生的地震相关的推文。\n\
    \n我们将通过第 5 章“通过调度器弯曲时间 (Bending Time with Schedules)”进入 RxJS 的更高级概念，在那里我们将讨论 RxJS\
    \ 提供的在更细粒度级别处理并发的有用概念：调度器（Schedulers）。\n\n在掌握了调度器的知识后，我们将探索它们如何帮助我们进行测试。我们将学习如何在测试中模拟时间，以准确测试异步程序。\n\
    \n最后，在第 6 章“使用 Cycle.js 构建响应式 Web 应用 (Reactive Web Applications with Cycle.js)”中，我们将使用构建在\
    \ RxJS 之上的 UI 框架 Cycle.js 构建一个简单的应用程序。Cycle.js 借鉴了 React.js 等现代框架的概念，创建了一个响应式框架，利用\
    \ Observable 的优势帮助我们以简单可靠的方式创建快速的用户界面。\n"
