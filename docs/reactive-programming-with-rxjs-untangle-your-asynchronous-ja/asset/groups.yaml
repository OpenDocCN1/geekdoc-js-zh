    \ it will filter out the ones outside the screen. We can use isVisible to filter\
    \ out elements that are outside the screen, too as we do in the return statement.\n\
    \nWe need to update paintemies so that it renders enemy shots and updates their\
    \ y-coordinates. We use our handy drawTriangle function to draw the shots:\n\n\
    ```\nspaceship_reactive/enemy_shots.js\nfunction paintEnemies(enemies) {\n  enemies.forEach(function(enemy)\
    \ {\n    enemy.y += 5;\n    enemy.x += getRandomInt(-15, 15);\n    drawTriangle(enemy.x,\
    \ enemy.y, 20, '#00ff00', 'down');\n    enemy.shots.forEach(function(shot) {\n\
    \      shot.y += SHOOTING_SPEED;\n    });\n  });\n```\n\n```\ndrawTriangle(shot.x,\
    \ shot.y, shot.y, 5, '#0ffff', 'down');\n}\n});\n```\n\nWith this in place everybody\
