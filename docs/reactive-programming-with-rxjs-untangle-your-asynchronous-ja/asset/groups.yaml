    \ Document Object Model (DOM) and client-server communication using WebSockets\
    \ in a Node.js server.\n\nFor the user-interface bits, we'll use the RxJS-DOM\
    \ library, a library by the same team that made RxJS, which provides convenient\
    \ operators to deal with DOM and browser-related stuff that will make our lives\
    \ easier. For the server part, we'll also use two well-established node libraries\
    \ and wrap some of their APIs with Observables to use them in our application.\n\
    \nAfter this chapter, you'll be able to use RxJS to build user interfaces in a\
    \ declarative way, using the techniques we've seen so far and applying them to\
    \ the DOM. You'll also be ready to use RxJS in any Node.js project and able to\
    \ use reactive programming and RxJS in any project.\n\n# Building a Real-Time\
    \ Earthquake Dashboard\n\nWe'll be building both server and client parts for an\
    \ earthquake dashboard application, picking up where we left the application we\
    \ started in *Making a Real-Time Earthquake Visualizer*, on page 29. We'll build\
    \ the server in Node.js, and improve our application to make it more interactive\
    \ and informative.\n\nThe screenshot on page 70 shows how the dashboard will look\
    \ when we're finished:\n\nOur starting point will be the code from *Making a Real-Time\
    \ Earthquake Visualizer*, on page 29, which we left like this:\n\n```\nexamples_earthquake/code1.js\n\
    var quakes = Rx.Observable\n  .interval(5000)\n  .flatMap(function() {\n```\n\n\
    | Location | Magnitude | Time |\n|---|---|---|\n| 6km WNW of The Geysers, California\
    \ | 0.0 | Wed 11 2015 18:01:00 GMT |\n| 6km N of Anza, California | 0.6 | Wed\
    \ 11 2015 17:11:34 GMT |\n| 12km SE of Bear City, California | 1.3 | Wed 11 2015\
    \ 17:09:52 GMT |\n\n```\nRX.DOM.jsonRequest({\n  url: QUAKE_URL,\n  jsonCallback:\
    \ 'quake_callback'\n}).retry(3)\n.flatMap(function(result) {\n  return Rx.Observable.from(result.features);\n\
    })\n.distinct(function(quake) { return quake.properties.code; });\n\nquakes.subscribe(function(quake)\
    \ {\n  var coords = quake.geometry.coordinates;\n  var size = quake.properties.mag\
    \ * 1000;\n  L.circle(coords[1], coords[0], size).addTo(map);\n});\n```\n\nThis\
    \ code already has one potential bug: it could be executed before the DOM is ready,\
    \ throwing errors whenever we try to use DOM elements in our code. What we want\
    \ is to load after the DOMContentLoaded event is fired, which signals the browser\
    \ is aware of all elements on the page.\n\nRxJS-DOM provides the Rx.DOM.ready()\
    \ Observable, which emits once, when DOMContentLoaded is fired. So let's wrap\
    \ our code in an initialize function and execute it when we subscribe to Rx.DOM.ready():\n\
    \n```\nexamples_earthquake/ui/code.js\nfunction initialize() {\n  var quakes =\
    \ Rx.Observable\n    .interval(5000)\n    .flatMap(function() {\n      return\
    \ Rx.DOM.jsonRequest({\n        url: QUAKE_URL,\n        jsonCallback: 'quake_callback'\n\
    \      });\n    })\n    .flatMap(function(result) {\n      return Rx.Observable.from(result.features);\n\
    \    })\n    .distinct(function(quake) { return quake.properties.code; });\n}\n\
    quakes.subscribe(function(quake) {\n  var coords = quake.geometry.coordinates;\n\
    \  var size = quake.properties.mag * 1000;\n  L.circle(coords[1], coords[0], size).addTo(map);\n\
    });\nRx.DOM.ready().subscribe(initialize);\n```\n\nNext, we'll add an empty table\
    \ to our HTML, which is where we'll populate earthquake data in the next section:\n\
    \n<table>\n  <thead>\n    <tr>\n      <th>Location</th>\n      <th>Magnitude</th>\n\
    \      <th>Time</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr id=\"quakes_info\"\
    ></tr>\n  </tbody>\n</table>\n\nWith this, we're ready to start writing the new\
    \ code for our dashboard.\n\n# Adding a List of Earthquakes\n\nThe first feature\
    \ in the new dashboard is to display a real-time list of earthquakes, including\
    \ information about their locations, magnitudes, and dates. The data for this\
    \ list is the same as the map, which comes from the USGS website. We'll first\
    \ create a function that returns a row element given a props object parameter:\n\
    \n```\nexamples_earthquake_ui/code2.js\nfunction makeRow(props) {\n  var row =\
    \ document.createElement('tr');\n  row.id = props.id + props.code;\n\n  var date\
    \ = new Date(props.time);\n  var time = date.toString();\n  [props.className,\
    \ props.mag, time].forEach(function(text) {\n    var cell = document.createElement('td');\n\
    \    cell.textContent = text;\n    row.appendChild(cell);\n  });\n\n  return row;\n\
    }\n```\n\nThe props parameter is the same as the properties property in the JSON\
    \ that we retrieve from the USGS site.\n\nTo generate the rows, we'll make another\
    \ subscription to the quakes Observable. This subscription creates a row in the\
