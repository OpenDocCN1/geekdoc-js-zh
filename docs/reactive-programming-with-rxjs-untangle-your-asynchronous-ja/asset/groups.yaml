  - "[PAGE 50]\n\n# Making a Real-Time Earthquake Visualizer • 31\n\nWe initialize\
    \ the Leaflet map by setting the coordinates to the center of Los Angeles (plenty\
    \ of earthquakes there!) with a reasonable zoom level.\n\nWe tell Leaflet to set\
    \ the default tile set for our map. The tile set is just a “theme” for our map.\n\
    \nFinally, we load our code after the DOM and the map have been initialized.\n\
    \n# Retrieving Earthquake Locations\n\nNow that our HTML is ready, we can write\
    \ the logic for our application. First we need to know what kind of data we get\
    \ and what data we need to represent earthquakes on a map.\n\nThe JSONP data from\
    \ the USGS site looks looks like this:\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_50_0.png)\n\
    \n```\neqfeed_callback({\n  \"type\": \"FeatureCollection\",\n  \"metadata\":\
    \ {\n    \"generated\": 1408030886000,\n    \"url\": \"http://earthquake.usgs.gov/earthquakes/...\"\
    ,\n    \"title\": \"USGS All Earthquakes, Past Day\",\n    \"status\": 200, \"\
    api\": \"1.0.13\", \"count\": 134\n  },\n  \"features\": [\n    {\n      \"type\"\
    : \"Feature\",\n      \"properties\": {\n        \"mag\": 0.82,\n        \"title\"\
    : \"M 0.8 - 3km WSW of Idyllwild-Pine Cove, California\",\n        \"place\":\
    \ \"3km WSW of Idyllwild-Pine Cove, California\",\n        \"time\": 1408030368460\n\
    \      },\n      \"geometry\": {\n        \"type\": \"Point\",\n        \"coordinates\"\
    : [ -116.7366667, 33.7303333, 17.33]\n      },\n      \"id\": \"ci55538377\"\n\
    \    },\n    ...\n  ]\n})\n```"
  - "[PAGE 51]\n\nThe features array contains an object with the data for every earthquake\
    \ that happened today. That's a truckload of data! It's amazing (and terrifying)\
    \ how many earthquakes happen in a single day. For our program we'll need only\
    \ the coordinates, title, and magnitude for each earthquake.\n\nI first want to\
    \ create an Observable that retrieves the dataset and emits single earthquakes.\
    \ Here's a first version:\n\nexamples_earthquake/code.js\n\n```\nvar quakes =\
    \ Rx.create(function(observer) {\n  window.efeed_callback = function(response)\
    \ {\n    var quakes = response.features;\n    quakes.forEach(function(quake) {\n\
    \      observer.onNext(quake);\n    });\n  };\n  loadJSONP(QUAKE_URL);\n});\n\n\
    quakes.subscribe(function(quake) {\n  var coords = quake.geometry.coordinates;\n\
    \  var size = quake.properties.mag * 10000;\n  L.circle([coords[1], coords[0]],\
    \ size).addTo(map);\n});\n```\n\nWait, what is that blatant function window.efeed_callback\
    \ doing in our code? Well, it turns out that JSONP URLs often provide a way—by\
    \ adding a querystring in the URL—to specify the function name to handle the response,\
    \ but the USGS site doesn't allow that, so we need to create a global function\
    \ with the name they decided we must use, which is efeed_callback.\n\nOur Observable\
    \ emits all earthquakes in order. We have an earthquake generator now! We don't\
    \ have to care about asynchronous flows or having to put all of logic in the same\
    \ function. As long as we subscribe to the Observable, earthquakes will come to\
    \ us.\n\nBy having the earthquake retrieval \"blackboxed\" in the quakes Observable,\
    \ we can now subscribe to it and process each earthquake. Then we'll draw a circle\
    \ for each earthquake with a size proportional to its magnitude.\n\n# Going Deeper\n\
    \nCan we do better? You bet! In the preceding code, we're still managing flow\
    \ by traversing the array and calling onNext to yield each earthquake, even if\
    \ we isolated it inside the Observable. So much for reactivity!"
  - "[PAGE 52]\n\n# What Is JSONP?\n\nJSONP—or JSON with *padding*—is a sneaky technique\
    \ that web developers come up to work around browser restrictions when requesting\
    \ data from third-party domains.a\n\nIt bypasses these restrictions by loading\
    \ external content using script tags instead of the usual XMLHttpRequest. Adding\
    \ a script tag to the DOM loads and executes its content directly, and the security\
    \ restrictions are not applied.\n\nThe remote request's content is then normal\
    \ JSON wrapped in a function call (the P JSON). It looks like:\n\n```\ncallbackFn(a:\
    \ 1, b: 2, c: 3);\n```\n\nJSONP URLs usually accept a query string parameter so\
    \ that the caller can specify the name of the callback. The developer then has\
    \ to define a function in his code that has the same name as the callback in the\
    \ server response, and when the script tag is added to the document, that function\
    \ will be called with the JSON data as the first parameter.\n\nLibraries like\
    \ jquery automate this process by internally creating the global function to handle\
    \ the JSONP call, and tidying up afterward to avoid polluting the global namespace.\n\
    \n> a. http://en.wikipedia.org/wiki/Same-origin_policy\n\nThis is a perfect situation\
    \ for flatMap. We'll retrieve the data and make Observable out the features array\
    \ using Rx.Observable. Then we'll merge that back in the main Observable:\n\n\
    ```\nexamples_earthquake/code1.js\n```\n\n```\nvar quakes = Rx.Observable.create(function(observer)\
    \ {\n  window.efeed.callback = function(response) {\n    observer.onNext(response);\n\
    \    observer.onCompleted();\n  };\n\n  loadJSONP(QUAKE_URL);\n}).flatMap(function\
    \ transform(dataset) {\n  return Rx.Observable.from(dataset.features);\n});\n\n\
    quakes.subscribe(function(quake) {\n  var coords = quake.geometry.coordinates;\n\
    \  var size = quake.properties.mag * 10000;\n  L.circle([coords[1], coords[0]],\
    \ size).addTo(map);\n});\n```"
  - "[PAGE 53]\n\n# Chapter 2. Deep in the Sequence • 34\n\nWe're not manually managing\
    \ the flow anymore. There are no loops or condi-\ntials to extract the individual\
    \ earthquake objects and pass them around.\nHere's what happening:\n\n+   - onNext\
    \ happens once this time, and it yields the whole.JSON response.\n\n+   - Since\
    \ we'll yield only one time, we signal completion after onNext.\n\n+   - We are\
    \ chaining the flatMap call to the result of create, so flatMap will take each\n\
    result from the Observable (in this case only one), use it as a parameter\nt the\
    \ transform function, and merge the Observable resulting from that\nfunction into\
    \ the source Observable.\n\n+   - Here we take the features array containing all\
    \ the earthquakes and create\nan Observable from it. Because of flatMap, this\
    \ will become the actual\nObservable that the quakes variable will contain.\n\n\
    +   - Subscribe doesn't change at all; it keeps dealing with a stream of earth-\n\
    quakes just like before.\n\n# There Is Always a Method\n\nSo far we've used RxJS\
    \ operators included in rxall.js, but it's usually worth\nchecking out operators\
    \ that come with other RxJS-based libraries. In our case,\nwe'll look at RxJS-DOM.\
    \ RxJS-DOM is an external library that, among\nothers, can create an operator\
    \ to handle JSON requests: jsonRequest. That\nsaves us some code and keeps us\
    \ from using nasty global functions:\n\n```\nvar quakes = Rx.DOM.jsonRequest({\n\
    \  url: QUAKE_URL,\n  jsonCallback: 'eqfeed_callback'\n})\n.flatMap(function(result)\
    \ {\n  return Rx.Observable.from(result.response.features);\n})\n.map(function(quake)\
    \ {\n  return {\n    lat: quake.geometry.coordinates[1],\n    lng: quake.geometry.coordinates[0],\n\
    \    size: quake.properties.mag * 10000\n  };\n  });\nquakes.subscribe(function(quake)\
    \ {\n  L.circle([quake.lat, quake.lng], quake.size).addTo(map);\n```\n\n3. github.com/Reactive-Extensions/RxJS-DOM"
- md: "\n# Making a Real-Time Earthquake Visualizer\n\nKeep in mind that for this\
    \ code to run, you need to include the file rx.dom from RxJS-DOM in the HTML.\
    \ Notice how we've added a map operator that transforms the earthquake objects\
    \ into simple objects containing only the information we need for our visualization:\
    \ latitude, longitude, and magnitude of the earthquake. The less functionality\
    \ we put in the subscribe operator, the better.\n\n# Making It Real Time\n\nOur\
    \ reactive version of the earthquake application doesn't update the map of earthquakes\
    \ in real time. To implement that, we will use the interval operator—which we\
    \ saw earlier in this chapter—and the überuseful distinct operator. Let me show\
    \ you the code and we will go through the changes:\n\nexamples_earthquake/code_1.js\n\
    \n```javascript\nvar quakes = Rx.Observable;\ninterval(5000)\n  .flatMap(function()\
    \ {\n    return Rx.DOM.jsonRequest({\n      url: QUAKE_URL,\n      jsonCallback:\
    \ 'eqfeed_callback'\n    }).retry(3);\n  })\n  .flatMap(function(result) {\n \
    \   return Rx.Observable.from(result.response.features);\n  })\n  .distinct(function(quake)\
    \ { return quake.properties.code; });\n\nquakes.subscribe(function(quake) {\n\
    \  var coords = quake.geometry.coordinates;\n  var size = quake.properties.mag\
    \ * 10000;\n  \n  L.circle([coords[1], coords[0]], size).addTo(map);\n});\n```\n\
    \nIn the preceding code, we use interval to make new requests and process them\
    \ at regular intervals of five seconds. interval creates an Observable that emits\
    \ an incrementing number every five seconds. We don't do anything with those numbers;\
    \ instead, we use flatMap to retrieve the data of the jsonpRequest. Notice also\
    \ how we use retry to try again in case there are problems retrieving the list\
    \ at first.\n\nThe last operator we apply is distinct, which emits only elements\
    \ that haven't been emitted before. It takes a function that returns the property\
    \ to check for equality. This way we never redraw earthquakes that are already\
    \ drawn.\n\nIn fewer than 20 lines, we've written an application that regularly\
    \ polls an external JSONP URL, extracts concrete data from its contents, and then\
    \ filters out earthquakes that have already been imported. That is, we represent\
    \ the earthquakes on a map, with a size proportional to their magnitude—all written\
    \ in a self-contained, clear, and concise way, without relying on external state.\
    \ Not at all! Shows how expressive Observables can be.\n\n# Ideas for Improvements\n\
    \nHere are a couple of ideas to put your newly acquired RxJS skills to use and\
    \ make this little application a bit more interesting:\n\n- When we hover the\
    \ mouse over an earthquake, offer a pop-up that shows more information about that\
    \ particular earthquake. One way to do that would be to create a new Observable\
    \ from the quakes one with just the properties you want to show, and dynamically\
    \ filter it upon hovering.\n- Implement a counter at the top of the page that\
    \ shows the number of earthquakes so far today and resets every day.\n\n# Operator\
    \ Rundown\n\nThis chapter presented you with a few new operators, so here's a\
    \ recap of them, along with some scenarios for ways we can use in our applications.\
    \ Remember, you can always find the complete API documentation for operators on\
    \ the RxJS GitHub site.\n\n- **Rx.Observable.from**\n\n  Default behavior: *Synchronous*\n\
    \n  Since many of the data sources you use in your applications will come from\
    \ arrays or iterables, it makes sense to have an operator that creates Observables\
    \ out of them. from is one of the operators you'll use the most.\n\n  With from\
    \ we can create Observables from arrays, array-like objects (for instance, the\
    \ arguments object or DOM NodeLists), and even types that implement the iterable\
    \ protocol, such as String, Map, and Set.\n\n- **Rx.Observable.range**\n\n  Default\
    \ behavior: *Synchronous*\n\n  The range operator generates finite Observables\
    \ that emit integers in a particular range. It is extremely versatile and can\
    \ be used in many scenarios. For example, you could use range to generate the\
    \ initial squares on the board of a game like Minesweeper.\n\n- **Rx.Observable.interval**\n\
    \n  Default behavior: *Asynchronous*\n\n  Each time you need to generate values\
    \ spaced in time, you'll probably start with an interval operator as the generator.\
    \ Since it emits sequential integers every x milliseconds (where x is a parameter\
    \ we pass), we just need to transform the values to whatever we want. Our game\
    \ in Chapter 3, *Building Concurrent Programs*, on page 39, is heavily based on\
    \ that technique.\n\n- **Rx.Observable.distinct**\n\n  Default behavior: *Same\
    \ as the Observable it filters*\n\n  distinct is one of these extremely simple\
    \ operators that saves a ton of development work. It filters out of the sequence\
    \ any value that has already been emitted. That keeps us from writing time and\
    \ again that error-prone boilerplate code that uses a dictionary somewhere with\
    \ the emitted results, against which we compare incoming results. You know what\
    \ kind of code I'm talking about. Yuck. That's gone with distinct.\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_56_0.png)\n\
    \ndistinct lets us use a function that specifies the comparison method. Additionally,\
    \ we can pass no arguments and it will use strict comparison to compare primitives\
    \ such as numbers or strings, and run deep comparisons in case of more complex\
    \ objects.\n\n# Wrapping Up\n\nIn this chapter we covered how to visually represent\
    \ and understand Observable flows using marble diagrams. We've covered the most\
    \ common operators and, more importantly, we've learned how to avoid external\
    \ state. In the next chapter we'll continue to explore more flows and advanced\
    \ operators.\n\n# Building Concurrent Programs\n\nConcurrency is the art of doing\
    \ several things at time. In this chapter we'll explore how to handle concurrency\
    \ in reactive programming. We'll look at how to manage multiple streams of data\
    \ and how to coordinate them.\n\n# Purity and the Observable Pipeline\n\nAn Observable\
    \ pipeline is a group of operators chained together, where each takes one Observable\
    \ as input and returns an Observable as output. We've been using pipelines in\
    \ book; they are ubiquitous. Here's a simple one:\n\n```javascript\nspaceship_reactive/pipeline\n\
    Rx.Observable\n  .from([1, 2, 3, 4, 5, 6, 7, 8])\n  .filter(function(val) { return\
    \ val % 2; })\n  .map(function(val) { return val * 10; });\n```\n\n# Avoiding\
    \ External State\n\nIn the following example we count the even numbers that interval\
    \ has yielded so far. We do that by creating an Observable from interval ticks\
    \ and increasing evenTicks when the tick we receive is an even number:\n\n```javascript\n\
    spaceship_reactive/state.js\nevenTicks = 0;\nfunction updateDistance(i) {\n  if\
    \ (i % 2 === 0) {\n    evenTicks += 1;\n  }\n  return evenTicks;\n}\nvar ticksObservable\
    \ = Rx.Observable\n.interval(1000)\n.map(updateDistance)\nticksObservable.subscribe(function()\
    \ {\n  console.log('Subscriber 1 - evenTicks: ' + evenTicks + ' so far');\n});\n\
    ```\n\nThis is the output we get after the program has been running for four seconds:\n\
    \n- Subscriber 1 - evenTicks: 1 so far\n- Subscriber 1 - evenTicks: 1 so far\n\
    - Subscriber 1 - evenTicks: 2 so far\n- Subscriber 1 - evenTicks: 2 so far\n\n\
    Now, just for kicks, let's add another subscriber to ticksObservable:\n"
  mdcn: "\n\n# 制作实时地震可视化器\n\n请记住，为了运行这段代码，你需要在 HTML 中包含来自 RxJS-DOM 的 `rx.dom` 文件。注意看我们添加了一个\
    \ `map` 操作符，它将地震对象转换为简单的对象，仅包含我们可视化所需的信息：纬度、经度和地震震级。`subscribe` 操作符中包含的功能越少越好。\n\
    \n# 实现实时性\n\n我们的响应式地震应用版本并没有实时更新地震地图。为了实现这一点，我们将使用 `interval` 操作符——我们在本章的前面的部分见过的——以及非常有用的\
    \ `distinct` 操作符。让我向你展示代码，我们将一起过的变化：\n\nexamples_earthquake/code_1.js\n\n```javascript\n\
    var quakes = Rx.Observable;\ninterval(5000)\n  .flatMap(function() {\n    return\
