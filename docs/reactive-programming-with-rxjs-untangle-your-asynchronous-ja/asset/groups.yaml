    var button = document.getElementById('retrieveDataBtn');\nvar source1 = Rx.DOM.JSON('resource1').pluck('name');\n\
    var source2 = Rx.DOM.JSON('resource2').pluck('props', 'name');\nfunction getResults(amount)\
