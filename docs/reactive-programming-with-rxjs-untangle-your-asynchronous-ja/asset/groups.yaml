    \      var el = event.target.tagName === 'TD' ? event.target.parentNode : null;\n\
    \      return el;\n    })\n    .pluck('parentNode')\n    .distinctUntilChanged();\n\
    }\n```\n\n`getRowFromEvent` 为我们提供了事件发生的行。以下是细节：我们确保获取到正确的行。\n\n# 提高效率（注：此部分原文似乎存在重复或逻辑断层，已按语意翻译）\n\
    \n经验的前端开发者知道，在页面上创建许多事件是性能低下的万根源。在上一个示例中，我们为每行创建了三个事件。如果列表中有 100 次地震，页面上就会浮动着\
    \ 300 个事件！这对性能来说是糟糕的，我们可以做得更好。由于 DOM 事件会冒泡（从子元素到父元素），前端开发者中一种避免在许多元素上绑定事件的常用技术是绑定到父元素上。一旦事件在父元素上触发，我们就可以使用事件的\
    \ `target` 属性来找到被触发的子元素。因为我们需要为 `click` 和 `mouseover` 事件实现类似的功能，我们将创建一个函数 `getRowFromEvent`：\n\
