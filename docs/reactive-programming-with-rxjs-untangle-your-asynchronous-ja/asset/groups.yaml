    # Getting Real-Time Updates from Twitter


    The second part of our plan to make a real-time dashboard for earthquakes is to
    add reports and information from Twitter related to the different earthquakes
    happening on the planet. For this, we''ll create a Node.js program that will fetch
    the stream of tweets related to the earthquakes.


    # Setting Up Our Node.js Environment


    Let''s configure our Node.js application. Based RxJS, we will be using two venerable
    third-party modules to make our life easier: ws and tw.¹ Any similar modules should
    work with minimal changes to the code.


    First, let''s create a folder for our application and install the modules that
    we''ll use. (Note that the output of the npm command may vary depending on the
    current versions of the packages).


    ```

    $ mkdir tweet_stream

    $ cd tweet_stream

    ~/tweet_streams npm install ws tw rx

    rx@3.1.2 node_modules/tw

    wit@1.1.19 node_modules/tw

    └── oauth@0.9.9

    ws@0.8.0 node_modules/ws

    ├── options@0.0.6

    ├── utlf8@1.0.2

    │└── utf-8-validate@1.2.1 (bindings@1.2.1, nan@2.0.9)

    └── bufferutil@1.2.1 (bindings@1.2.1, nan@2.0.9)

    ```


    # Client-Server Communication


    Now we''re ready to start building our application. Let''s create a new file called
    index.js inside the tweet_stream folder to load the modules we''ll use:


    ```

    examples_earthquake.ui/tweet_stream/index.js

    var WebSocket = require(''ws'').Server;

    var Twit = require(''tweet'');

    var Rx = require(''rx'');

    ```


    To use the Twitter API, we need to request a consumer key and an access token
    from the Twitter website. Once you have that, create a new Twit object with a
    configuration object, like this:


    > 1. https://github.com/websockets/ws and https://github.com/ttezel/tweet'
