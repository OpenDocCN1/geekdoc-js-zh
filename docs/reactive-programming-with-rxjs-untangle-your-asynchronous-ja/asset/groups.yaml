  - '[PAGE 38]


    Here, the dotted arrows along the y-axis point to the final result of the transformation
    applied to each element in sequences A and B. The resulting Observable is represented
    by C, which contains the merged elements of A and B. If elements of different
    Observables are emitted at the same time, the order of these elements in the merged
    sequence is random.


    # Basic Sequence Operators


    Among the dozens of operators that transform Observables in RxJS, the most used
    are those that any language with decent collection-processing abilities also have:
    map, filter, and reduce. In JavaScript, you can find these operators in Array
    instances.


    RxJS follows JavaScript conventions, so you''ll find that the syntax for the following
    operators is almost the same as for array operators. In fact, we''ll show the
    implementation using both arrays and Observables to show how similar the two APIs.


    # Map


    map is the sequence transformation operator most used. It takes an Observable
    and a function and applies that function to each of the values in the source Observable.
    It returns a new Observable with the transformed values.


    ![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_38_0.png)


    | JS Arrays | Observables |

    |---|---|

    | var src = [1, 2, 3, 4, 5]; | var src = Rx.observable.range(1, 5); |

    | var upper = src.map(function(name) { | var upper = src.map(function(name) {
    |

    | return name * 2; | return name * 2; |

    | }); | }); }); |

    | upper.forEach(logValue); | upper.subscribe(logValue); |


    In both cases, src does not mutate.


    This code, and code that follows, uses this definition of logValue:


    ```

    var logValue = function(val) { console.log(val) };

    ```'
  - '[PAGE 39]


    # Chapter 2. Deep in the Sequence • 20


    It could be that the function we pass to map does some asynchronous computation
    to transform the value. In that case, map would not work as expected. For these
    cases, it would be better to use flatMap, on page 22.


    # Filter


    filter takes an Observable and a function and tests each element in the Observable
    using that function. It returns an Observable sequence of all the elements for
    which the function returned true.


    ![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_39_0.png)


    | JS Arrays | Observables |

    | :--- | :--- |

    | var isEven = (function(val) { return val % 2 === 0; }); | |

    | var src = [1, 2, 3, 4, 5]; | var src = Rx.Observable.range(1, 5); |

    | var even = src.filter(isEven); | var even = src.filter(isEven); |

    | even.forEach(logValue); | even.subscribe(logValue); |


    # Reduce


    reduce (also known as fold) takes an Observable and returns a new one that always
    contains a single item, which is the result of applying a function over each element.
    That function receives the current element and the result of the function''s previous
    invocation.


    ![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_39_1.png)'
