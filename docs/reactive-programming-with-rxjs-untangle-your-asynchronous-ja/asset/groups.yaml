  - "[PAGE 90]\n\n# Adding a List of Earthquakes • 71\n\nexamples_earthquake.ui/code.js\n\
    \n```\nfunction initialize() {\n  var quakes = Rx.Observable\n    .interval(5000)\n\
    \    .flatMap(function() {\n      return Rx.DOM.jsonRequest({\n        url: QUAKE_URL,\n\
    \        jsonpCallback: 'efquake_callback'\n      });\n    })\n    .flatMap(function(result)\
    \ {\n      return Rx.Observable.from(result.response.features);\n    })\n    .distinct(function(quake)\
    \ { return quake.properties.code; });\n}\nquakes.subscribe(function(quake) {\n\
    \  var coords = quake.geometry.coordinates;\n  var size = quake.properties.mag\
    \ * 1000;\n  L.circle([coords[1], coords[0]], size).addTo(map);\n});\nRx.DOM.ready().subscribe(initialize);\n\
    ```\n\nNext, we'll add an empty table to our HTML, which is where we'll populate\
    \ earthquake data in the next section:\n\n<table>\n  <thead>\n    <tr>\n     \
    \ <th>Location</th>\n      <th>Magnitude</th>\n      <th>Time</th>\n    </tr>\n\
    \  </thead>\n  <tbody>\n    <tr id=\"quakes_info\"></tr>\n  </tbody>\n</table>\n\
    \nWith this, we're ready to start writing the new code for our dashboard.\n\n\
    # Adding a List of Earthquakes\n\nThe first feature in the new dashboard is to\
    \ display a real-time list of earthquakes, including information about their locations,\
    \ magnitudes, and dates. The data for this list is the same as the map, which\
    \ comes from the USGS website. We'll first create a function that returns a row\
    \ element given a props object parameter:"
  - "[PAGE 91]\n\n# Chapter 4. Building a Complete Web Application • 72\n\nexamples_earthquake_ui/code2.js\n\
    \n```\nfunction makeRow(props) {\n  var row = document.createElement('tr');\n\
    \  row.id = props.net + props.code;\n\n  var date = new Date(props.time);\n  var\
    \ time = date.toString();\n  [props.class, props.mag, time].forEach(function(text)\
    \ {\n  var cell = document.createElement('td');\n    cell.textContent = text;\n\
    \    row.appendChild(cell);\n  });\n\n  return row;\n}\n```\n\nThe props parameter\
    \ is the same as the properties property in the JSON that we retrieve from the\
    \ USGS site.\n\nTo generate the rows, we'll make another subscription to the quakes\
    \ Observable. This subscription creates a row in the table for each new earthquake\
    \ received. We add the code to the end of the initialize function:\n\nexamples_earthquake_ui/code2.js\n\
    \n```\nvar table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(makeRow)\n  .subscribe(function(row) { table.appendChild(row); });\n```\n\
    \nThe pluck operator extracts the value of properties from each earthquake object,\
    \ because it contains all the info we need for makeRow. Then we map each earthquake\
    \ object to makeRow to transform it into a populated HTML tr element. Finally,\
    \ in the subscription we append every emitted row to our table.\n\nLooks good,\
    \ and it was easy enough! Still, we can make some improvements. First, though,\
    \ we explore an important concept in RxJS: hot and cold Observables.\n\n# Hot\
    \ and Cold Observables\n\n“Hot” Observables emit values regardless of Observers\
    \ being subscribed to them. On the other hand, “cold” Observables emit the entire\
    \ sequence of values from the start to every Observer."
- md: "\n# Hot Observables\n\nAn Observer subscribed to a hot Observable will receive\
    \ values emitted at the exact moment it subscribes to it. Every other Observer\
    \ subscribed at that moment will receive the exact same values. This is similar\
    \ to how JavaScript events work.\n\nMouse events and a stock-exchange ticker are\
    \ examples of hot Observables. In both cases the Observable emits values regardless\
    \ of whether it has subscribers, and could already be producing values before\
    \ any subscriber is listening. Here's an example:\n\n```javascript\nhot_cold.js\n\
    var onMove = Rx.Observable.fromEvent(document, 'mousemove');\nvar subscriber1\
    \ = onMove.subscribe(function(e) {\n  console.log('Subscriber1:', e.clientX, e.clientY);\n\
    });\nvar subscriber2 = onMove.subscribe(function(e) {\n  console.log('Subscriber2:',\
    \ e.clientX, e.clientY);\n});\n// Result:\n// Subscriber1: 23 24\n// Subscriber2:\
    \ 23 24\n// Subscriber1: 34 37\n// Subscriber2: 34 37\n// Subscriber1: 46 49\n\
    // Subscriber2: 46 49\n...\n```\n\nIn the example, both subscribers receive the\
    \ same values from the Observable as they are emitted. To JavaScript programmers,\
    \ that behavior feels natural because it resembles how JavaScript events work.\n\
    \nNow let's see how cold Observables work.\n\n# Cold Observables\n\nA cold Observable\
    \ emits values only when Observers subscribe to it.\n\nFor example, Rx.Observable.range\
    \ returns a cold Observable. Every new Observer that subscribes to it will receive\
    \ the whole range:\n\n```javascript\nhot_cold.js\nfunction printValue(value) {\n\
    \  console.log(value);\n}\nvar rangeToFive = Rx.Observable.range(1, 5);\nvar obs1\
    \ = rangeToFive.subscribe(printValue); // 1, 2, 3, 4, 5\n```\n\n```javascript\n\
    var obs2 = Rx.Observable.just( // Creates an empty Observable.\n).delay(2000).flatMap(function()\
    \ {\n  return rangeToFive.subscribe(printValue); // 1, 2, 3, 4, 5\n});\n```\n\n\
    Understanding when we're dealing with hot or cold Observables is essential to\
    \ avoid subtle and sneaky bugs. For example, Rx.Observable.interval returns an\
    \ Observable that produces an increasing integer value at regular intervals of\
    \ time. We imagine we want to use it to push the same values to multiple observers.\
    \ We could implement it like this:\n\n```javascript\nhot_cold.js\nvar source =\
    \ Rx.Observable.interval(2000);\nvar observer1 = source.subscribe(function (x)\
    \ {\n  console.log('Observer 1, next value: ' + x);\n});\n```\n\n```javascript\n\
    var observer2 = source.subscribe(function (x) {\n  console.log('Observer 2: next\
    \ value: ' + x);\n});\n```\n\nOutput:\n\n- Observer 1, next value: 0\nObserver\
    \ 2: next value: 0\nObserver 1, next value: 1\nObserver 2: next value: 1\n\nThat\
    \ seems to work. But now imagine that we need the second subscriber to join three\
    \ seconds after the first one:\n\n```javascript\nhot_cold.js\nvar source = Rx.Observable.interval(1000);\n\
    var observer1 = source.subscribe(function (x) {\n  console.log('Observer 1: '\
    \ + x);\n});\n```\n\n```javascript\nsetTimeout(function() {\n  var observer2 =\
    \ source.subscribe(function (x) {\n    console.log('Observer 2: ' + x);\n  });\n\
    }, 3000);\n```\n\nOutput:\n\n- Observer 1: 0\nObserver 1: 1\nObserver 1: 2\nObserver\
    \ 1: 3\nObserver 2: 0\nObserver 1: 4\nObserver 2: 1\n...\n\nNow we see that something\
    \ is really really off. When subscribing three seconds later, observer2 receives\
    \ all the values that the source already pushed, instead of starting with the\
    \ current value and continuing from there, because Rx.Observable.interval is a\
    \ cold Observable. If the difference between hot and cold Observables is not clear,\
    \ scenarios like this can be surprising.\n\nIf we have several Observers listening\
    \ to a cold Observable, they will receive copies of the same sequence of values.\
    \ So strictly speaking, although the Observers are sharing the same Observable,\
    \ they are not sharing the same exact sequence of values. If we want the Observers\
    \ to share the same sequence, we need not a hot Observable.\n\n# From Cold to\
    \ Hot Using publish\n\nWe can turn a cold Observable into a hot one using publish.\
    \ Calling creates a new Observable that acts as a proxy to the original. It does\
    \ that by subscribing itself to the original and pushing the values it receives\
    \ to its subscribers.\n\nA published Observable is actually a ConnectableObservable,\
    \ which has an extra method called connect that we call to start receiving values.\
    \ This allows us to subscribe to it before it starts running:\n\n```javascript\n\
    hot_cold.js\n// Create an Observable that yields a value every second\nvar source\
    \ = Rx.Observable.interval(1000);\nvar publisher = source.publish();\n\n// Even\
    \ if we are subscribing, no values are pushed yet.\nvar observer1 = publisher.subscribe(function\
    \ (x) {\n  console.log('Observer 1: ' + x);\n});\n\n// publisher connects and\
    \ starts publishing values\npublisher.connect();\nsetTimeout(function() {\n  //\
    \ 5 seconds later, observer2 subscribes to\n  var observer2 = publisher.subscribe(function\
    \ (x) {\n    console.log('Observer 2: ' + x);\n  });\n}, 5000);\n```\n\n# Sharing\
    \ a Cold Observable\n\nA published Observable is actually a ConnectableObservable,\
    \ which has an extra method called connect that we call to start receiving values.\
    \ This allows us to subscribe to it before it starts running:\n\n```javascript\n\
    hot_cold.js\n// Create an Observable that yields a value every second\nvar source\
    \ = Rx.Observable.interval(1000);\nvar publisher = source.publish();\n\n// Even\
    \ if we are subscribing, no values are pushed yet.\nvar observer1 = publisher.subscribe(function\
    \ (x) {\n  console.log('Observer 1: ' + x);\n});\n\n// publisher connects and\
    \ starts publishing values\npublisher.connect();\n```\n\nWait, let me re-examine\
    \ the flow:\n\n```javascript\n// publisher connects and starts publishing values\n\
    publisher.connect();\nsetTimeout(function() {\n  // 5 seconds later, observer2\
    \ subscribes to\n  var observer2 = publisher.subscribe(function (x) {\n    console.log('Observer\
    \ 2: ' + x);\n  });\n}, 5000);\n```\n\n# Buffering Values\n\nOur preceding code\
    \ works well, but notice that we insert a tr node every time we receive an earthquake.\
    \ That's inefficient, because with each insertion we're modifying the DOM and\
    \ causing a repaint.\n\nIdeally, we would batch several earthquake objects and\
    \ insert each batch every few seconds. That would be tricky to implement by hand\
    \ because we've have to keep counters and buffers, and we would have to reset\
    \ them every batch. But with RxJS operators, we can just use one of the buffer-based\
    \ operators.\n\nWith bufferTime we can buffer values and release them as an array\
    \ every x period of time:\n\n```javascript\nearthquake_ui/code3.bufferTime.js\n\
    var table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(mapRow)\n  .bufferTime(500)\n  .filter(function(rows) { return rows.length\
    \ > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function (fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\nThis is what's going on in the new code:\n\n- Buffer every incoming\
    \ value and release the batch of values every 500 milliseconds.\n- bufferTime\
    \ executes every 500ms no matter what, and if there have been no incoming values,\
    \ it will yield an empty array. We'll filter those.\n- We insert every row into\
    \ a document fragment, which is a document without a parent. This means it's not\
    \ in the DOM, and modifying its contents is very fast and efficient.\n- Finally,\
    \ we append the fragment to the DOM. An advantage of appending a fragment is that\
    \ it counts as a single operation, causing just one redraw. It also appends the\
    \ fragment's children to the same element to we're appending the fragment itself.\n"
  mdcn: "\n\n# 热观测流 (Hot Observables)\n\n订阅了热 Observable 的 Observer 将在其订阅的精确刻接收到发射出的值。在同一时刻订阅的其他\
    \ Observer 将接收到完全相同的值。这与 JavaScript 事件的工作方式类似。\n\n鼠标事件和股票交易所报价器都是热 Observable\
    \ 的例子。在这两种情况下，无论是否有订阅者，Observable 都会发射值，并且在任何订阅者监听之前可能就已经产生了了值。这是一个示例：\n\n```javascript\n\
    hot_cold.js\nvar onMove = Rx.Observable.fromEvent(document, 'mousemove');\nvar\
    \ subscriber1 = onMove.subscribe(function(e) {\n  console.log('Subscriber1:',\
    \ e.clientX, e.clientY);\n});\nvar subscriber2 = onMove.subscribe(function(e)\
    \ {\n  console.log('Subscriber2:', e.clientX, e.clientY);\n});\n// Result:\n//\
    \ Subscriber1: 23 24\n// Subscriber2: 23 24\n// Subscriber1: 34 37\n// Subscriber2:\
    \ 34 37\n// Subscriber1: 46 49\n// Subscriber2: 46 49\n...\n```\n\n在示例中，两个订阅者都会在\
    \ Observable 发射值时接收到相同的值。对于 JavaScript 程序员来说，这种行为感觉很自然，因为它类似于 JavaScript 事件的工作方式。\n\
    \n现在让我们来看看冷观测流（Cold Observables）是如何工作的。\n\n# 冷观测流 (Cold Observables)\n\n冷 Observable\
    \ 仅在 Observer 订阅它时才发射值。\n\n例如，Rx.Observable.range 返回一个冷 Observable。每个订阅它的新 Observer\
    \ 都会接收到整个范围：\n\n```javascript\nhot_cold.js\nfunction printValue(value) {\n  console.log(value);\n\
    }\nvar rangeToFive = Rx.Observable.range(1, 5);\nvar obs1 = rangeToFive.subscribe(printValue);\
    \ // 1, 2, 3, 4, 5\n```\n\n```javascript\nvar obs2 = Rx.Observable.just( // 创建一个空的\
    \ Observable.\n).delay(2000).flatMap(function() {\n  return rangeToFive.subscribe(printValue);\
    \ // 1, 2, 3, 4, 5\n});\n```\n\n理解我们何时处理的是热或冷 Observable 对于避免微妙且隐蔽的 bug 至关重要。例如，Rx.Observable.interval\
    \ 返回一个在固定的时间间隔内产生递增整数值的 Observable。我们设想用它来将相同的值推给多个观察者。我们可以这样实现它：\n\n```javascript\n\
    hot_cold.js\nvar source = Rx.Observable.interval(2000);\nvar observer1 = source.subscribe(function\
    \ (x) {\n  console.log('Observer 1, next value: ' + x);\n});\n```\n\n```javascript\n\
    var observer2 = source.subscribe(function (x) {\n  console.log('Observer 2: next\
    \ value: ' + x);\n});\n```\n\n输出：\n\n- Observer 1, next value: 0\nObserver 2:\
    \ next value: 0\nObserver 1, next value: 1\nObserver 2: next value: 1\n\n这似乎可以工作。但现在想象一下我们需要第二个订阅者在第一个订阅者三秒后加入：\n\
    \n```javascript\nhot_cold.js\nvar source = Rx.Observable.interval(1000);\nvar\
    \ observer1 = source.subscribe(function (x) {\n  console.log('Observer 1: ' +\
    \ x);\n});\n```\n\n```javascript\nsetTimeout(function() {\n  var observer2 = source.subscribe(function\
    \ (x) {\n    console.log('Observer 2: ' + x);\n  });\n}, 3000);\n```\n\n输出：\n\n\
    - Observer 1: 0\nObserver 1: 1\nObserver 1: 2\nObserver 1: 3\nObserver 2: 0\n\
    Observer 1: 4\nObserver 2: 1\n...\n\n现在我们发现有些非常不对劲。当三秒后订阅时，observer2 接收到了 source\
    \ 已经推送的所有值，而不是从当前值开始并从那里继续，因为 Rx.Observable.interval 是一个冷 Observable。如果热和冷 Observable\
    \ 之间的区别不明确，这种场景可能会可能会感到惊讶。\n\n如果我们有多个 Observer 正在监听一个冷 Observable，它们将接收到相同值序列的副本。因此严格来说，虽然\
    \ Observer 共享同一个 Observable，但它们共享并不是完全相同的值序列。如果我们希望 Observer 共享相同的序列，我们需要的不是热\
    \ Observable。\n\n# 使用 publish 从冷转为热\n\n我们可以使用 `publish` 将冷 Observable 转换为热 Observable。调用它会创建一个新的\
    \ Observable，作为原始 Observable 的代理。它通过自己订阅原始 Observable 并将其接收到的值推给其订阅者来实现。\n\n一个发布的\
    \ Observable 实际上是一个 `ConnectableObservable`，它有一个额外的方法 `connect`，我们通过调用这个方法来开始接收值。这允许我们在它开始运行之前订阅它：\n\
    \n```javascript\nhot_cold.js\n// 创建一个每秒产生一个值的 Observable\nvar source = Rx.Observable.interval(1000);\n\
    var publisher = source.publish();\n\n// 即使我们正在订阅，尚未推送任何值。\nvar observer1 = publisher.subscribe(function\
    \ (x) {\n  console.log('Observer 1: ' + x);\n});\n\n// publisher 连接并开始发布值\npublisher.connect();\n\
    setTimeout(function() {\n  // 5 秒后，observer2 订阅\n  var observer2 = publisher.subscribe(function\
    \ (x) {\n    console.log('Observer 2: ' + x);\n  });\n}, 3000);\n```\n\n# 共享冷\
    \ Observable\n\n发布的 Observable 实际上是 `ConnectableObservable`，它有一个额外的方法 `connect`，我们通过调用它来开始接收值。这允许我们在开始运行之前订阅它：\n\
    \n```javascript\nhot_cold.js\n// 创建一个每秒产生一个值的 Observable\nvar source = Rx.Observable.interval(1000);\n\
    var publisher = source.publish();\n\n// 即使我们正在订阅，尚未推送任何值。\nvar observer1 = publisher.subscribe(function\
    \ (x) {\n  console.log('Observer 1: ' + x);\n});\n\n// publisher 连接并开始发布值\npublisher.connect();\n\
    ```\n\n等等，让我重新检查流程：\n\n```javascript\n// publisher 连接并开始发布值\npublisher.connect();\n\
    setTimeout(function() {\n  // 5 秒后，observer2 订阅\n  var observer2 = publisher.subscribe(function\
    \ (x) {\n    console.log('Observer 2: ' + x);\n  });\n}, 5000);\n```\n\n# 值缓冲\n\
    \n我们之前的代码运行良好，但注意到我们在每次收到地震数据时都会插入一个 tr 节点。这是低效的，因为每次插入我们都在修改 DOM 并导致重绘。\n\n理想情况下，我们会每隔几秒对多个地震对象进行分组并插入。手动实现这将很困难，因为我们需要维护计数器和缓冲区，并且每批都要重置它们。但通过\
    \ RxJS 操作符，我们可以直接使用基于缓冲的操作符。\n\n使用 `bufferTime` 我们可以缓冲值并在每一段时间后以数组的形式释放它们：\n\n\
    ```javascript\nearthquake_ui/code3.bufferTime.js\nvar table = document.getElementById('quakes_info');\n\
    quakes\n  .pluck('properties')\n  .map(mapRow)\n  .bufferTime(500)\n  .filter(function(rows)\
    \ { return rows.length > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function (fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\n这是新代码正在发生的情况：\n\n- 缓冲每个进入的值，每隔 500 毫秒释放一次值批。\n- `bufferTime` 无论如何每\
    \ 500 毫秒执行一次，如果没有输入，它将产生一个空数组。我们将过滤掉它们。\n- 我们将每行插入到 `documentFragment` 中，它是没有父节点的文档。这意味着它不在\
    \ DOM 中，修改其内容非常快速且高效。\n- 最后，我们将片段添加到 DOM 中。添加片段的一个优势是它被视为单次操作，仅引起一次重绘。它还将片段的子元素添加到同一个元素中，因为我们正在添加的是片段本身。\n\
    \n"
