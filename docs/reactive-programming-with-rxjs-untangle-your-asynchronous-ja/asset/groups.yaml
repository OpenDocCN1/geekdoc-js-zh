    \ use the Scheduler we pass as a parameter.\n\nobserveOn takes a Scheduler and\
    \ returns a new Observable that uses that Scheduler. It will make every onChanged\
    \ call run in the new Scheduler.\n\nsubscribeOn forces the subscription and un-subscription\
    \ work (the notifications) of an Observable to run on a particular Scheduler.\
    \ Like observeOn, it accepts a Scheduler as a parameter. subscribeOn is useful\
    \ when, for example,"
  - "[PAGE 111]\n\n# Chapter 5. Bending Time with Schedulers • 92\n\nwe're running\
    \ in the browser and doing significant work in the subscribe call but we don't\
    \ want to block the UI thread with it.\n\n# Basic Rx Schedulers\n\nLet's look\
    \ a bit more in depth at the Schedulers we just used. The ones RxJS operators\
    \ we use most are immediate, default, and currentThread.\n\n# Immediate Scheduler\n\
    \nThe immediate Scheduler emits notifications from the Observable synchronously,\
    \ so whenever an action is scheduled on the immediate Scheduler, it will be executed\
    \ right away. Rx.Observable.range is one of the operators that uses the immediate\
    \ Scheduler internally:\n\n```\nconsole.log('Before subscription');\nRx.Observable.range(1,\
    \ 5)\n  .do(function(a) {\n    console.log('Processing value', a);\n  })\n  .map(function(value)\
    \ { return value * value; })\n  .subscribe(function(value) { console.log('Emitted',\
    \ value); });\n\nconsole.log('After subscription');\n```\n\n+   - Before subscription\n\
    Processing value 1\nEmitted 1\nProcessing value 2\nEmitted 4\nProcessing value\
    \ 3\nEmitted 9\nProcessing value 4\nEmitted 16\nProcessing value 5\nEmitted 25\n\
    After subscription\n\nThe program output happens in the order we expect. Each\
    \ console.log statement runs before the notification of the current item.\n\n\
    # When to Use It\n\nThe immediate Scheduler is very well suited for Observables\
    \ that execute predictable and not-very-expensive operations in each notification.\
    \ Also, the Observable has to eventually call onCompleted."
- md: "\n# Default Scheduler\n\nThe default Scheduler runs actions asynchronously.\
    \ You can think of it as a rough equivalent of setTimeout zero milliseconds delay\
    \ that keeps the order in the sequence. It uses the most efficient asynchronous\
    \ implementation available on the platform it runs (for example, process.nextTick\
    \ in Node.js or setTimeout in the browser).\n\nLet's take the previous example\
    \ with range and make it run on the default Scheduler. For this, we'll use the\
    \ observeOn operator:\n\n```javascript\nconsole.log('Before subscription');\n\
    Rx.Observable.range(1, 5)\n  .do(function(value) {\n    console.log('Processing\
    \ value', value);\n  })\n  .observeOn(Rx.Scheduler.default)\n  .map(function(value)\
    \ { return value * value;})\n  .subscribe(function(value) { console.log('Emitted',\
    \ value); });\nconsole.log('After subscription');\n```\n\n- Before subscription\n\
    Processing value 1\nProcessing value 2\nProcessing value 3\nProcessing value 4\n\
    Processing value 5\nAfter subscription\nEmitted 1\nEmitted 4\nEmitted 9\nEmitted\
    \ 16\nEmitted 25\n\nThere are significant differences in this output. Our synchronous\
    \ console.log statement runs immediately for every value, but we make the Observable\
    \ run on the default Scheduler, which yields each value asynchronously. That means\
    \ our log statements in the do operator are processed before the squared values.\n\
    \n# When to Use It\n\nThe default Scheduler never blocks the event loop, so it's\
    \ ideal for operations that involve time, like asynchronous requests. It can also\
    \ be used in Observables that never complete, because it doesn't block the program\
    \ while waiting for new notifications (which may never happen).\n\n# Current Thread\
    \ Scheduler\n\nThe currentScheduler is synchronous like the immediate Scheduler,\
    \ but in case we use recursive operators, it enqueues the actions to execute instead\
    \ of executing them right away. A recursive operator is an operator that itself\
    \ schedules another operator. A good example is repeat. The repeat operator—if\
    \ given no parameters—keeps repeating the previous Observable sequence in the\
    \ chain indefinitely.\n\nYou'll get in trouble if you call repeat on an operator\
    \ that uses the immediate Scheduler (such as return). Let's try this by repeating\
    \ the value 10 and then use take to take only the first value of the repetition.\
    \ Ideally, the code would print 10 once and then exit:\n\n```javascript\n// Be\
    \ careful: the code below will freeze your environment!\nRx.Observable.return(10).repeat().take(1)\n\
    \  .subscribe(function(value) {\n    console.log(value);\n  });\n```\n\nError:\
    \ Too much recursion\n\nThis code causes an infinite loop. Upon subscription,\
    \ return calls onNext(10) and then onCompleted, which makes repeat subscribe again\
    \ to return. Since return is running on the immediate Scheduler, this process\
    \ repeats itself, causing an infinite loop and never getting to take.\n\nBut if\
    \ instead we schedule return on the currentThread Scheduler by passing it as the\
    \ second parameter, we get this:\n\n```javascript\nvar scheduler = Rx.Scheduler.currentThread;\n\
    Rx.Observable.return(10, scheduler).repeat().take(1)\n  .subscribe(function(value)\
    \ {\n    console.log(value);\n  });\n```\n\n- 10\n\nNow, when repeat resubscribes\
    \ to return, the new onNext call will be queued because the previous onCompleted\
    \ is still happening. repeat returns a disposable object to take, which calls\
    \ onCompleted and cancels the repetition by disposing repeat, and ultimately the\
    \ call from subscribe returns.\n\nAs a rule of thumb, currentThread Scheduler\
    \ should be used to iterate on large sequences and when using recursive operators\
    \ such as repeat.\n\n# When to Use It\n\nThe currentIndex Scheduler is useful\
    \ for operations that involve recursive operators like repeat, and in general\
    \ for iterations that contain nested operators.\n\n# Scheduling for Animations\n\
    \nFor fast visual updates such as canvas or DOM animations, we can either use\
    \ the interval operator with a very low millisecond value or we can make a Scheduler\
    \ that uses a function like setTimeout internally to schedule notifications.\n\
    \nBut neither approach is ideal. In both of them we're throwing all these updates\
    \ at the browser, which may not be able to process them quickly enough. That happens\
    \ because the browser is trying to render a frame and then it receives instructions\
    \ to render the next one, so it drops the current frame to keep up the speed.\
    \ The results are choppy animations. And we have enough of those on the web.\n\
    \nBrowsers have a native way to handle animations, and they provide an API to\
    \ use it called requestAnimationFrame.requestAnimationFrame allows the browser\
    \ to optimize performance by lining up animations at the most appropriate time\
    \ and helping us achieve smoother animations.\n\n# There's a Scheduler for That\n\
    \nThe RxDOM library comes with some extra schedulers, one of which is the requestAnimationFrameFrame\
    \ Scheduler.\n\nYes, you can use this Scheduler to improve our spaceship video\
    \ game. In fact, we established a refresh speed of 40ms—roughly 25 frames per\
    \ second—by creating an interval Observable at that speed and then using combineLatest\
    \ to update the whole game scene at the speed set by interval (because it is the\
    \ fastest-updating Observable) ... but who knows how many frames the browser is\
    \ dropping by using this technique! We would get much better performance by using\
    \ requestAnimationFrame.\n\nLet's create an Observable that uses Rx.Scheduler.requestAnimationFrame\
    \ as Its Scheduler. Notice how it works similarly to the interval operator operates:\n\
    \n```javascript\nch_schedulers/starfield_raf.js\n\nfunction animationLoop() {\n\
    \  return Rx.Observable.generate(\n    0,\n    function() { return true; }, //\
    \ Keep generating forever\n    function(x) { return x + 1; },\n    function(x)\
    \ { return x; },\n    Rx.Scheduler.requestAnimationFrame);\n}\n```\n\n# Chapter\
