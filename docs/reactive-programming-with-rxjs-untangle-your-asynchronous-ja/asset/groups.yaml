  - "[PAGE 70]\n\nVideo games notoriously keep a lot of external state—scores, screen\
    \ coordinates for the characters, timers, and so on. Our plan is to build the\
    \ whole game without relying on a single external variable that keeps state.\n\
    \nIn our game, the player will move the spaceship horizontally using the mouse,\
    \ and will shoot by clicking the mouse or tapping the spacebar. Our game will\
    \ have four main actors: rx, the moving star field in the background, the player's\
    \ spaceship, the enemies, and the shots from both the player and the enemies.\n\
    \nIt will look like this:\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_70_0.png)\n\
    \nIn the screenshot, the red triangle is our spaceship and the green ones are\
    \ the enemies. The tinier triangles are the fired shots.\n\nLet's start by setting\
    \ the stage; this will be our HTML file:\n\n```\nspaceship-reactive/spaceship.html\n\
    \n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>Spaceship\
    \ Reactive!</title>\n  <script src=\"../rx.all-4.0.0.js\"></script>\n<style>\n\
    \  html, body {\n```"
  - "[PAGE 71]\n\n# Chapter 3. Building Concurrent Programs • 52\n\n```\nmargin: 0;\n\
    \  padding: 0;\n}\n</style>\n</head>\n<body>\n<script src=\"spaceship.js\"></script>\n\
    </body>\n</html>\n```\n\nIt's just a simple HTML file that loads the JavaScript\
    \ file we'll be working with for the rest of the chapter. In that JavaScript file,\
    \ we start by setting up a canvas element that we will render:\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_71_0.png)\n\
    \n```\nvar canvas = document.createElement('canvas');\nvar ctx = canvas.getContext(\"\
    2d\");\ndocument.body.appendChild(canvas);\ncanvas.width = window.innerWidth;\n\
    canvas.height = window.innerHeight;\n```\n\nWith this we can start describing\
    \ our game's components. First let's draw our starry background.\n\n# Creating\
    \ the Star Field\n\nThe first things we need for a game set in space are stars.\
    \ We'll create a star field that scrolls down to give the feeling of traveling\
    \ through space. For this, we'll first generate the stars using the range operator:\n\
    \n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_71_1.png)\n\n```\nvar SPEED = 40;\n\
    var STAR_NUMBER = 250;\nvar StarStream = Rx.Observable.range(1, STAR_NUMBER)\n\
    .map(function() {\n  return {\n    x: parseInt(Math.random() * canvas.width),\n\
    \    y: parseInt(Math.random() * canvas.height),\n    size: Math.random() * 3\
    \ + 1\n  };\n});\n```\n\nEach star will be represented by an object that contains\
    \ random coordinates and a size between 1 and 4. This code will give us a stream\
    \ that generates 250 of these \"stars.\"\n\nWe want these stars to keep moving.\
    \ A way to do that is to increase the y-coordinate every few milliseconds for\
    \ all stars. We'll transform the StarStream"
  - "[PAGE 72]\n\nObservable into an array setTo, which will emit a single array containing\
    \ all the objects generated by range. Then we can pick up that array with a flatMap\
    \ operator that will transform the Observable into one that yields a value every\
    \ few milliseconds. Using map we can increase the y-coordinate in each item of\
    \ the original array. We even get a nice parallax effect for free moving star\
    \ a distance from its size:\n\n`spaceship_reactive/starfield_1.js`\n\n```\nvar\
    \ SPEED = 40;\nvar STAR_NUMBER = 250;\nvar StarStream = Rx.Observable.range(1,\
    \ STAR_NUMBER)\n.map(function() {\n  return {\n    x: parseInt(Math.random() *\
    \ canvas.width),\n    y: parseInt(Math.random() * canvas.height),\n    z: Math.random()\
    \ * 3 + 1\n  };\n})\n.toArray()\n.flatMap(function(starArray) {\n  return Rx.Observable.interval(SPEED).map(function()\
    \ {\n    starArray.forEach(function(star) {\n      if (star.y >= canvas.height)\
    \ {\n        star.y = 0; // Reset star to top of the screen\n      }\n      star.y\
    \ += star.size; // Move star\n    });\n    return starArray;\n  });\n});\n```\n\
    \nInside map we check if the y-coordinate is already outside the screen, and in\
    \ this case we reset it to 0. By changing the coordinates in every star object\
    \ we can keep using the same array of stars all the time.\n\nNow we need a smaller\
    \ helper function that \"paints\" an array of stars on our canvas:\n\n`spaceship_reactive/starfield_1.js`\n\
    \n```\nfunction paintStars(stars) {\n  ctx.fillStyle = '#000000';\n  ctx.fillRect(0,\
    \ 0, canvas.width, canvas.height);\n  ctx.fillStyle = '#ffffff';\n  stars.forEach(function(star)\
    \ {\n    ctx.fillRect(star.x, star.y, star.size, star.size);\n  });\n}\n```"
  - "[PAGE 73]\n\n# Chapter 3. Building Concurrent Programs * 54\n\npaintStars paints\
    \ a black background and draws the stars on the canvas. The only thing left to\
    \ achieve a moving star field is to subscribe to the Observable and call paintStars\
    \ with the resulting array. Here's the final code:\n\n```\nspaceship reactive/starfield\
    \ 1.js\nfunction paintStars(stars) {\n  ctx.fillStyle = '#000000';\n  ctx.fillRect(0,\
    \ 0, canvas.width, canvas.height);\n  ctx.fillStyle = '#ffffff';\n  stars.forEach(function(star)\
    \ {\n    ctx.fillRect(star.x, star.y, star.size, star.size);\n  });\n}\nvar SPEED\
    \ = 40;\nvar StarStream = Rx.Observable.range(1, STAR_NUMBER)\n  .map(function()\
    \ {\n    return {\n      x: parseInt(Math.random() * canvas.width),\n      y:\
    \ parseInt(Math.random() * canvas.height),\n      size: Math.random() * 3 + 1\n\
    \    };\n  })\n  .toArray()\n  .flatMap(function(starArray) {\n    return Rx.Observable.interval(SPEED).map(function(star)\
    \ {\n      if (star.y >= canvas.height) {\n        star.y = 0; // Reset star to\
    \ top of the screen\n      }\n      star.y += star.size; // Move star\n      return\
    \ starArray;\n    });\n  })\n  .subscribe(function(starArray) {\n    paintStars(starArray);\n\
    \  });\n```\n\nNow we've set the stage, it's time for our hero to make an appearance.\n\
    \n# Adding the Player's Spaceship\n\nNow that we have our beautiful starry background,\
    \ we're ready to program the hero's spaceship. Even though it's the most important\
    \ object in the game, our spaceship is deceptively simple. An Observer of mouse\
    \ moves that emits the current mouse x-coordinate and a constant y- coordinate\
    \ (the player only moves horizontally, so we never change the y-coordinate):"
  - "[PAGE 74]\n\n# spaceship_reactive/hero_1.js\n\n```\nvar HERO_Y = canvas.height\
    \ - 30;\nvar mouseMove = Rx.Observable.fromEvent(canvas, 'mousemove');\nvar SpaceShip\
    \ = mouseMove\n.map(function(event) {\n  return {\n    x: event.clientX,\n   \
    \ y: HERO_Y\n  }\n}).startsWith({\n  x: canvas.width / 2,\n  y: HERO_Y\n});\n\
    ```\n\nNotice that I used startWith(). This sets the first value in the Observable,\
    \ and set it to a position in the middle of the screen. Without startWith our\
    \ Observable would start emitting only when the player moves the mouse.\n\nLet's\
    \ render our hero on the screen. In this game all the characters are triangles\
    \ (my graphic-design skills are not very impressive), so we'll define a helper\
    \ function to render triangles on the canvas, given the coordinates, size, and\
    \ color, and the direction they're facing:\n\n# spaceship_reactive/hero_1.js\n\
    \n```\nfunction drawTriangle(x, y, width, color, direction) {\n  ctx.fillStyle\
    \ = color;\n  ctx.beginPath();\n  ctx.moveTo(x - width, y);\n  ctx.lineTo(x, direction\
    \ === 'up' ? y - width : y + width);\n  ctx.lineTo(x + width, y);\n  ctx.lineTo(x\
    \ - width, y);\n  ctx.fill();\n}\n```\n\nWe'll also define paintSpace, which uses\
    \ the helper function:\n\n# spaceship_reactive/hero_1.js\n\n```\nfunction paintSpaceShip(x,\
    \ y, 20, '#ff0000', 'up') {\n  drawTriangle(x, y);\n}\n```\n\nBut we're facing\
    \ a problem now. If we subscribe to the SpaceShip Observable and call drawTriangle\
    \ in the subscription, our spaceship would be visible only when we move the mouse,\
    \ and for just an instant. This is because starStream is updating the canvas many\
    \ times per second, crasing our spaceship if we don't move the mouse. And because\
    \ the starStream doesn't have direct access"
  - "[PAGE 75]\n\n# Chapter 3. Building Concurrent Programs • 56\n\nto the spaceship,\
    \ we can't render the spaceship in the starStream subscription.\nWe could save\
    \ the latest spaceship coordinates to a variable that the starStream can access,\
    \ but then we would be breaking our rule of not modifying external state. What\
    \ to do?\n\nAs is usually the case. RxJS has a very convenient operator we can\
    \ use to solve our problem.\n\nRx.Observable.combineLatest is a handy operator.\
    \ It takes two or more Observables and emits the last result of each Observable\
    \ whenever any of them emits a new value. Knowing that starStream emits new item\
    \ (the array of stars) frequently, we can remove the starStream subscription and\
    \ use combineLatest to combine both the starStream and SpaceShip Observables and\
    \ update them as soon as any of them emit a new item:\n\nspaceship_reactive/hero.js\n\
    \n```\nfunction renderScene(actors) {\n  paintStars(actors.stars);\n  paintSpaceShip(actors.spaceship.x,\
    \ actors.spaceship.y);\n}\n\nvar Game = Rx.Observable\n  .combineLatest(\n   \
    \ StarStream, SpaceShip,\n    function(stars, spaceship) {\n      return { stars:\
    \ stars, spaceship: spaceship };\n    });\n```\n\nGame.subscribe(renderScene);\n\
    \nWe're now using a function renderScene to paint everything on the screen, you\
    \ can remove the following subscription code for StarStream:\n\n```\n.subscribe(function(starArray)\
    \ {\n  paintStars(starArray);\n});\n```\n\nWith this, we'll paint the starry background\
    \ every time any Observable emits a new item. We now have a spaceship flying through\
    \ space, and we can move it at will using our mouse. Not bad for so little code!\
    \ But our hero's spaceship is too lonely in the vastness of space. What about\
    \ giving it company?\n\n# Generating Enemies\n\nThis would be a very boring game\
    \ if we didn't have any enemies to take care of. So let's create an infinite stream\
    \ of them! We want to create a new enemy"
- md: "\nevery second and a half to not overwhelm our hero. Let's look at the code\
    \ for\nThe Enemies Observable and then go through it:\n\n```\nspaceship_reactive/enemy_1.js\n\
    var ENEMY_FREQ = 1500;\nvar Enemies = Rx.Observable.interval(ENEMY_FREQ)\n  .scan(function(enemyArray)\
    \ {\n  var enemy = {\n    x: parseInt(Math.random() * canvas.width),\n    y: -30,\n\
    \  };\n  enemyArray.push(enemy);\n  return enemyArray;\n}, []);\nvar Game = Rx.Observable\n\
    \  .combineLatest(\nStarStream, SpaceShip, Enemies,\nfunction(stars, spaceship,\
    \ enemies) {\n  return {\n    stars: stars,\n    spaceship: spaceship,\n    enemies:\
    \ enemies\n  };\n});\nGame.subscribe(renderScene);\n```\n\nTo create enemies,\
    \ we use an interval operator to run every 1,500 milliseconds,\nand then we use\
    \ the scan operator to create an array of enemies.\n\nWe briefly saw the scan\
    \ operator in Can We Aggregate Infinite Observables?\non page 22. scan aggregates\
    \ results each time an Observable emits a value,\nand emits intermediate result.\
    \ In the Enemies Observable we start with\nan empty array for each's first parameter\
    \ and we push a new object to it\nevery iteration. The object contains a random\
    \ x-coordinate, and a fixed y-\ncoordinate outside the visible screen. With this,\
    \ Enemies will emit an array of\nall current enemies every 1,500 milliseconds.\n\
    \nThe only thing left to render enemies is a helper function to paint each of\n\
    the canvas. This function will also be the one updating the coordi-\nn of each\
    \ item in our array:\n\n```\nspaceship_reactive/enemy_1.js\n// Helper function\
    \ to get a random integer\nfunction getRandomInt(min, max) {\n  return Math.floor(Math.random()\
    \ * (max - min + 1)) + min;\n}\n```\n\nChapter 3. Building Concurrent Programs\
    \ * 58\n\n```\nfunction paintEnemies(enemies) {\n  enemies.forEach(function(enemy)\
    \ {\n    enemy.y += 5;\n    enemy.x += getRandomInt(-15, 15);\n\n    drawTriangle(enemy.x,\
    \ enemy.y, 20, '#0ff00', 'down');\n  });\n}\n```\n\nYou can see in paintEnemies\
    \ that we are also changing the x-coordinate randomly so that enemies move a bit\
    \ unpredictably to the sides. Now we need to update the function renderScene to\
    \ include a call to paintEnemies.\n\nYou might have noticed a strange effect while\
    \ playing the game we have so far: if you move the mouse, the enemies go faster\
    \ toward you! That could be a nice feature in the game, but we definitely didn't\
    \ intend to do that. Can you guess what causes this bug?\n\nIf you guessed that\
    \ it was related to the paintEnemies function, you're right on the money. combineLatest\
    \ renders our scene whenever any of the Observables yields a value. If we don't\
    \ move the mouse, the fastest emitter will always be starStream because it has\
    \ an interval of 40 milliseconds (the Enemies Observable emits only every 1,500\
    \ milliseconds). When we move the mouse, SpaceShip will emit faster than starStream\
    \ (your mouse coordinates many times per second), and paintEnemies will execute\
    \ that many times, increasing the enemies' coordinates much faster.\n\nTo avoid\
    \ this and similar problems in the future, we need to normalize the game's speed\
    \ so that no Observable can emit values faster than our chosen speed for the game.\n\
    \nAnd yes, as you have guessed, RxJS has an operator for that.\n\n# Avoid Drinking\
    \ from the Firehose\n\nThere is such a thing as receiving data too fast. Most\
    \ of the time we want all the speed we can get, but depending on the frequency\
    \ at which the Observable streams values, we might want to drop some of the values\
    \ we receive. We're now in one of these scenarios. The speed at which we render\
    \ things onscreen is proportional to the speed of the fastest Observable we have.\
    \ It turns out that our fastest Observable is too fast for us, and we need to\
    \ establish a constant update speed in the game.\n\nsample is a method in Observable\
    \ instances, given a time parameter in milliseconds, returns an emitter that emits\
    \ the last value emitted by the parent Observable in each time interval.\n\n#\
    \ Spaceship Reactive! • 59\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_78_0.png)\n\
    \nNotice how sample drops any values before the last value at the moment of the\
    \ interval. It's important to consider whether you want this behavior. In our\
    \ case, we don't care about dropping values because we want to render the current\
    \ state of each element every 40 milliseconds. If all the values are important\
    \ to you, you might want to consider the buffer operator:\n\nspaceship_reactive/enemy_2.js\n\
    \n```\nRx.Observable.combineLatest(\n  StarStream, SpaceShip, Enemies,\n  function(stars,\
    \ spaceship, enemies) {\n    stars: stars,\n    spaceship: spaceship,\n    enemies:\
    \ enemies\n  }\n)\n.sample(SPEED)\n.subscribe(renderScene);\n```\n\nBy calling\
    \ sample after combineLatest we make sure combineLatest will never yield any value\
    \ faster than 40 milliseconds after the previous one (our constant SPEED is set\
    \ to 40).\n\n# Shooting\n\nIt's a bit scary seeing the hordes of enemies coming\
    \ at us; all we can do about it is move out of the way and hope they don't. We\
    \ need to know the position of the spaceship so we can fire. We'll use the timestamp\
    \ operator to get the time of each shot. We want to use the sample operator to\
    \ limit the frequency of shots.\n\nChapter 3. Building Concurrent Programs · 60\n\
    \nspaceship_reactive/hero_shots.js\nvar playerFiring = Rx.Observable\n.merge(\n\
    \  Rx.Observable.fromEvent(document, 'click'),\n  Rx.Observable.fromEvent(document,\
    \ 'keydown')\n)\n.filter(function(evt) { return evt.keyCode === 32; });\n\nvar\
    \ HeroShots = Rx.Observable.combineLatest(\n  playerFiring,\n  SpaceShip,\n  function(shotEvents,\
    \ spaceship) {\n    return { x: spaceship.x };\n  }\n)\n.scan(function(shotArray,\
    \ shot) {\n  shotArray.push({x: shot.x, y: HERO_Y});\n  return shotArray;\n},\
    \ []);\n.timestamp()\n.sample(200);\n\nWe now get the values from SpaceShip and\
    \ playerFiring, so we can get the x-coordinate. We use scan in the same way we\
    \ used it for Enemy Observable, creating an array of current coordinates for each\
    \ of shots. With that we should be ready to draw our shots on the screen. We use\
    \ a helper function to draw every shot in the array of:\n\n```\nspaceship_reactive/hero_shots.js\n\
    var SHOOTING_SPEED = 15;\nfunction paintHeroots(heroShots) {\n  heroShots.forEach(function(shot)\
    \ {\n    shot.y = SHOOTING_SPEED;\n    drawTriangle(shot.x, shot.y, 5, '#ffff00');\n\
    \  });\n}\n```\n\nThen we call paintHeroots from our main combineLatest operation:\n\
    \n```\nRx.Observable.combineLatest(\n  StarStream, SpaceShip, Enemies, HeroShots,\n\
    function(stars, spaceship, enemies, heroShots) {\n  return {\n    stars: stars,\n\
    \    spaceship: spaceship,\n    enemies: enemies,\n    heroShots: heroShots\n\
    \  };\n}\n).sample(SPEED)\n.subscribe(renderScene);\n```\n\nAnd we add a call\
    \ to paintHeroots inside renderScene:\n\n```\nfunction renderScene(actors) {\n\
    \  paintStars(actors.stars);\n  paintSpaceShip(actors.spaceship.x, actors.spaceship.y);\n\
    \  paintEnemies(actors.enemies);\n  paintHeroots(actors.heroShots);\n}\n```\n\n\
    Now when you run the game you'll notice every time you move the mouse, our spaceship\
    \ fires an insane number of shots. Not bad for an effect, but that's not what\
    \ we wanted! Let's look at the HeroShots Observable again. In it, we're using\
    \ combineLatest so that we have values from playerFiring and SpaceShip. This looks\
    \ similar to the problem we had before, combineLatest in HeroShots is\n"
  mdcn: "\n每1.5秒执行一次，以免让我们的英雄压力不堪。让我们来看 Enemies Observable 的代码并过一遍：\n\n```\nspaceship_reactive/enemy_1.js\n\
    var ENEMY_FREQ = 1500;\nvar Enemies = Rx.Observable.interval(ENEMY_FREQ)\n  .scan(function(enemyArray)\
    \ {\n  var enemy = {\n    x: parseInt(Math.random() * canvas.width),\n    y: -30,\n\
    \  };\n  enemyArray.push(enemy);\n  return enemyArray;\n}, []);\nvar Game = Rx.Observable\n\
    \  .combineLatest(\nStarStream, SpaceShip, Enemies,\nfunction(stars, spaceship,\
    \ enemies) {\n  return {\n    stars: stars,\n    spaceship: spaceship,\n    enemies:\
    \ enemies\n  };\n});\nGame.subscribe(renderScene);\n```\n\n为了创建敌人，我们使用 `interval`\
    \ 操作符每 1,500 毫秒运行一次，然后使用 `scan` 操作符来创建一个敌人数组。\n\n我们在第 22 页的《我们可以聚合无限 Observable\
    \ 吗？》中简要见过过scan` 操作符。`scan` 在每次 Observable 发射值时都会聚合结果，并发射中间结果。在 Enemies Observable\
    \ 中，我们为第一个参数从空数组开始，并在每次迭代中向其推入新对象。该对象包含一个随机的 x 坐标和一个可视屏幕之外的固定 y 坐标。通过此，Enemies\
    \ 将每 1,500 毫秒发射一个包含所有当前敌人的数组。\n\n最后需要渲染敌人的是一个用于绘制画布上每个部分的辅助函数。该函数也将用于更新我们数组中每个项的坐标：\n\
    \n```\nspaceship_reactive/enemy_1.js\n// 获取随机整数的辅助函数\nfunction getRandomInt(min,\
    \ max) {\n  return Math.floor(Math.random() * (max - min + 1)) + min;\n}\n```\n\
    \n第 3 章. 构建并发程序 * 58\n\n```\nfunction paintEnemies(enemies) {\n  enemies.forEach(function(enemy)\
    \ {\n    enemy.y += 5;\n    enemy.x += getRandomInt(-15, 15);\n\n    drawTriangle(enemy.x,\
    \ enemy.y, 20, '#0ff00', 'down');\n  });\n}\n```\n\n在 `paintEnemies` 中你可以看到我们也在随机改变\
    \ x 坐标，以便敌人向两侧产生一些不可预测的移动。现在我们需要更新 `renderScene` 函数以包含对 `paintEnemies` 的调用。\n\n\
    你可能已经在玩目前为止的游戏时注意到一个奇怪的现象：如果你移动鼠标，敌人向你冲得会更快了！这可能是游戏中的一个很棒的功能，但我们绝对没有打算那样做。你能猜出是什么导致了这个\
    \ bug 吗？\n\n如果你认为这与 `paintEnemies` 函数有关，那么你完全正确。`combineLatest` 每当任何 Observable\
    \ 产生值时就会渲染我们的场景。如果我们不移动鼠标，速度最快的发射器将始终是 `starStream`，因为它的间隔是 40 毫秒（Enemies Observable\
    \ 每 1,500 毫秒才发射一次）。当我们移动鼠标时，`SpaceShip` 发射得比 `starStream` 快（你的鼠标坐标每秒变化多次），`paintEnemies`\
    \ 会随之执行相应的次数，从而更快地增加敌人的坐标。\n\n为了避免未来出现此类及类似问题，我们需要归一化游戏的速度，使得没有任何 Observable 发射值的速度能超过我们为游戏选择的速度。\n\
    \n是的，正如你猜的那样，RxJS 有一个操作符可以实现这一点。\n\n# 避免从消防水柱中饮水\n\n确实存在接收数据过快的情况。大多数时候我们希望越快越好，但取决于\
    \ Observable 流值的频率，我们可能丢弃接收到的某些值。我们现在正处于这种场景之一。我们在屏幕上渲染东西的速度与我们最快的 Observable\
    \ 的速度成正比。事实证明我们最快的 Observable 对我们来说太快了，我们需要在游戏中建立恒定的更新速度。\n\n`sample` 是 Observable\
    \ 实例中的方法，给定以毫秒为单位的时间参数，返回一个发射器，在每个时间间隔发射父 Observable 发射的最后一个值。\n\n# 反应式火箭！ • 59\n\
    \n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_78_0.png)\n\n注意 `sample` 如何丢弃间隔时刻前最后一个值之前的任何值。考虑你是否想要这种行为是非常重要的。在我们的情况下，我们不在乎丢弃值，因为我们希望每\
    \ 40 毫秒渲染每个元素的当前状态。如果你认为所有值对你都很重要，你可能想要考虑 `buffer` 操作符：\n\nspaceship_reactive/enemy_2.js\n\
    \n```\nRx.Observable.combineLatest(\n  StarStream, SpaceShip, Enemies,\n  function(stars,\
    \ spaceship, enemies) {\n    stars: stars,\n    spaceship: spaceship,\n    enemies:\
    \ enemies\n  }\n)\n.sample(SPEED)\n.subscribe(renderScene);\n```\n\n在 `combineLatest`\
    \ 之后调用 `sample`，我们确保 `combineLatest` 产生任何值都不会比上一个快 40 毫秒（我们的常量 `SPEED` 设置为 40）。\n\
    \n# 射击\n\n看到成群的敌人向我们冲来有点可怕；我们能做的就是避开并希望它们不要撞上。我们需要知道火箭的位置以便发射。我们将使用 `timestamp`\
