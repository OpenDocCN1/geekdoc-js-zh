    \  paintEnemies(actors.enemies);\n  paintHeroShots(actors.heroShots, actors.enemies);\n\
    \  paintScore(actors.score);\n}\n```\n\nThat completes our Spaceship Reactive\
    \ game. With about 200 lines we've managed to code an entire game in the browser,\
    \ avoiding changing any external state through the power of Observable pipelines.\n\
    \n# Ideas for Improvements\n\nI'm sure you already have some ideas for making\
