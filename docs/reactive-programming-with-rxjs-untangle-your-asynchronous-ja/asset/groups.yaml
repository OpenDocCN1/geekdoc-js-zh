    ```\n\n现在的输出如下：\n\n- Subscriber 1 - evenTicks: 1 so far\n- Subscriber 2 - evenTicks:\
    \ 2 so far\n- Subscriber 1 - evenTicks: 2 so far\n- Subscriber 2 - evenTicks:\
    \ 2 so far\n- Subscriber 1 - evenTicks: 3 so far\n- Subscriber 2 - evenTicks:\
    \ 4 so far\n- Subscriber 1 - evenTicks: 4 so far\n- Subscriber 2 - evenTicks:\
    \ 4 so far\n\n等一下——订阅者 2 的偶数计数完全错误！它应该始终与订阅者 1 相同的 evenTicks 计数。正如你可能猜的那样，原因是\
    \ Observable 管道会为每个订阅者运行一次，导致 evenTicks 增加了两次。\n\n由共享外部状态引起的问题通常比这个例子更微妙。在复杂的应用程序中，允许在管道之外更改状态会导致代码变得复杂，错误很快就会出现。解决方案是尽可能在管道内部封装信息。这里是我们可以重构之前的代码以避免外部状态的方法：\n\
    \n# 第 3 章 构建并发程序 * 42\n\nspaceship_reactive/state.js\n\n```javascript\nfunction\
    \ updateDistance(acc, i) {\n  if (i % 2 === 0) {\n    acc += 1;\n  }\n  return\
    \ acc;\n}\nvar ticksObservable = Rx.Observable\n  .interval(1000)\n  .scan(updateDistance,\
    \ 0);\nticksObservable.subscribe(function(eventTicks) {\n  console.log('Subscriber\
    \ 1 - ' + eventTicks + ' so far');\n});\nticksObservable.subscribe(function(eventTicks)\
    \ {\n  console.log('Subscriber 2 - ' + eventTicks + ' so far');\n});\n```\n\n\
    预期的输出：\n\n- Subscriber 1 - eventTicks: 1 so far\n- Subscriber 2 - eventTicks:\
    \ 1 so far\n- Subscriber 1 - eventTicks: 1 so far\n- Subscriber 2 - eventTicks:\
    \ 1 so far\n- Subscriber 1 - eventTicks: 2 so far\n- Subscriber 2 - eventTicks:\
    \ 2 so far\n- Subscriber 1 - eventTicks: 2 so far\n- Subscriber 2 - eventTicks:\
    \ 2 so far\n\n使用 `scan`，我们完全消除了外部状态更新。我们将事件滴答的累加计数传递给 `updateDistance`，而不是依赖外部变量来保存累加值。\n\
    \n在大多数情况下，我们可以依赖外部状态。使用它的常见场景是缓存值或跟踪程序中变化的值。但正如你将在《Spaceship Reactive!》第 50 页中看到的那样，这些场景可以通过其他几种方式处理。例如，当我们需要缓存值时，第\
    \ 45 页的 RxJS Subject 类可以很有帮助，而当我们需要跟踪游戏之前的状态时，可以使用像 `Rx.Observable.scan` 这样的方法。\n\
    \n# 管道是高效的\n\n当我第一次将一组操作链式接到管道中以转换序列时，我的直觉告诉我这绝不可能高效。我知道在 JavaScript 中通过链式操作转换数组是有开销的。然而，在本书中，我告诉你通过将序列转换为新序列来设计你的程序。这不是非常低效吗？\n\
    \n链式调用在 Observables 和数组中看起来相似；两种类型中甚至存在像 `filter` 和 `map` 这样的方法。但存在一个关键区别：数组方法会在每次操作的结果都创建一个新数组，而该数组会被下一次操作完全遍历。相反，Observable\
    \ 管道不会创建中间 Observable，而是一次性地将所有操作应用于每个元素上。因此，Observable 只被遍历一次，这使得链式调用 Observable\
    \ 变得高效。查看以下示例：\n\n```javascript\nspaceship_reactive/array_chain.js\n```\n\n```javascript\n\
    stringArray // 代表一个包含 1,000 个字符串的数组\n.map(function(str) {\n  return str.toUpperCase();\n\
    })\n.filter(function(str) {\n  return /^[A-Z]+$/.test(str);\n})\n.forEach(function(str)\
    \ {\n  console.log(str);\n});\n```\n\n假设 `stringArray` 是一个包含 1,000 个字符串的数组，我们想将其转换为大写，然后过滤掉包含字母字符以外任何字符（或完全没有字母）的部分。然后我们想将结果数组中的每个字符串打印到控制台。\n\
    \n这是在后台发生的情况：\n\n- 遍历数组并创建一个所有项目都已大写的新数组。\n- 遍历大写数组，创建另一个包含 1,000 个元素的数组。\n- 遍历过滤后的数组，并将每个结果记录到控制台。\n\
    \n在转换数组的过程中，我们遍历了三次数组并创建了新数组。如果你关心性能或处理大型序列，这远非高效。这是使用 Observables 时的效果：\n\n```javascript\n\
    spaceship_reactive/array_chain.js\n```\n\n```javascript\nstringArray // 代表一个包含\
    \ 1,000 个字符串的数组\n.map(function(str) {\n  return str.toUpperCase();\n})\n.filter(function(str)\
    \ {\n  return /^[A-Z]+$/.test(str);\n})\n```\n\n# 第 3 章 构建并发程序 * 44\n\n```javascript\n\
    spaceship_reactive/array_chain.js\n```\n\n```javascript\nstringArray // 代表一个包含\
    \ 1,000 个字符串的数组\n.map(function(str) {\n  return str.toUpperCase();\n})\n.filter(function(str)\
    \ {\n  return /^[A-Z]+$/.test(str);\n})\n```\n\n等等，正确的逻辑是：\n\n```javascript\n\
    stringArray // 代表一个包含 1,000 个字符串的数组\n.map(function(str) {\n  return str.toUpperCase();\n\
    })\n.filter(function(str))\n```\n\n（注：此处由于原文提供的 OCR 文本存在重复和断裂。）\n\n等等，看看实际实现：\n\
    \n```javascript\nstringArray // 代表一个包含 1,000 个字符串的数组\n.map(function(str) {\n \
    \ return str.toUpperCase();\n})\n.filter(function(str))\n```\n\n实际上，高效的方法是：\n\n\
    ```javascript\nstringArray // 代表一个包含 1,000 个字符串的数组\n.map(function(str) {\n  return\
    \ str.toUpperCase();\n})\n.filter(function(str))\n```\n\n等等，让我重新检查文本。文本说：\n\n\
