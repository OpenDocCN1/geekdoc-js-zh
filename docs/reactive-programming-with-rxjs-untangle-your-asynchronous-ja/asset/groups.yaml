    # Testing with Schedulers


    Testing is perhaps one of the most compelling scenarios where we can use Schedulers.
    So far in this book we''ve been coding our heads without thinking much about the
    consequences. But in a real-world software project, we would be writing tests
    to make sure our code works as we intend.

    Testing asynchronous code is hard. We usually run into one of these problems:


    +   * Simulating asynchronous events is complicated and error prone. The whole
    point of having tests is to avoid bugs and errors, but if your tests themselves
    have errors, they''re not helping.


    +   * If we want to accurately test time-based functionality, automated testing
    becomes really slow. For example, if we need to accurately test that an error
    is called after four seconds of trying to retrieve a remote file, each test will
    take at least that much time to run. If we run our test suite continuously, that
    impacts our development time.


    # The TestScheduler


    RxJS gives us the TestScheduler, a Scheduler designed to help with testing. TestScheduler
    allows us to emulate time at our convenience and create deterministic tests, where
    they are guaranteed to be 100% repeatable. Besides that, it allows us to execute
    operations that would take a considerable amount of time and compress them into
    an instant, while maintaining the test''s accuracy.


    A TestScheduler is a specialization of a VirtualTimeScheduler. VirtualTimeSchedulers
    execute actions in "virtual" time instead of real time. Scheduled actions go in
    a queue and are assigned a moment in virtual time. The Scheduler then runs the
    actions in order when its clock advances. Because it is virtual time, everything
    runs immediately, without having to wait for the time specified.

