  md: "# Spaceship Reactive! • 59\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_78_0.png)\n\
    \nNotice how sample drops any values before the last value at the moment of the\
    \ interval. It's important to consider whether you want this behavior. In our\
    \ case, we don't care about dropping values because we want to render the current\
    \ state of each element every 40 milliseconds. If all the values are important\
    \ to you, you might want to consider the buffer operator:\n\nspaceship_reactive/enemy_2.js\n\
    \n```\nRx.Observable.combineLatest(\n  StarStream, SpaceShip, Enemies,\n  function(stars,\
    \ spaceship, enemies) {\n    stars: stars,\n    spaceship: spaceship,\n    enemies:\
    \ enemies\n  }\n)\n.sample(SPEED)\n.subscribe(renderScene);\n```\n\nBy calling\
    \ sample after combineLatest we make sure combineLatest will never yield any value\
    \ faster than 40 milliseconds after the previous one (our constant SPEED is set\
    \ to 40).\n\n# Shooting\n\nIt's a bit scary seeing the hordes of enemies coming\
    \ at us; all we can do about it is move out of the way and hope they don't see\
