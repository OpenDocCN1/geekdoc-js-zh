  md: "# Chapter 2. Deep in the Sequence • 34\n\nWe're not manually managing the flow\
    \ anymore. There are no loops or condi-\ntials to extract the individual earthquake\
    \ objects and pass them around.\nHere's what happening:\n\n+   - onNext happens\
    \ once this time, and it yields the whole.JSON response.\n\n+   - Since we'll\
    \ yield only one time, we signal completion after onNext.\n\n+   - We are chaining\
    \ the flatMap call to the result of create, so flatMap will take each\nresult\
    \ from the Observable (in this case only one), use it as a parameter\nt the transform\
    \ function, and merge the Observable resulting from that\nfunction into the source\
    \ Observable.\n\n+   - Here we take the features array containing all the earthquakes\
    \ and create\nan Observable from it. Because of flatMap, this will become the\
    \ actual\nObservable that the quakes variable will contain.\n\n+   - Subscribe\
    \ doesn't change at all; it keeps dealing with a stream of earth-\nquakes just\
    \ like before.\n\n# There Is Always a Method\n\nSo far we've used RxJS operators\
    \ included in rxall.js, but it's usually worth\nchecking out operators that come\
    \ with other RxJS-based libraries. In our case,\nwe'll look at RxJS-DOM. RxJS-DOM\
    \ is an external library that, among\nothers, can create an operator to handle\
    \ JSON requests: jsonRequest. That\nsaves us some code and keeps us from using\
    \ nasty global functions:\n\n```\nvar quakes = Rx.DOM.jsonRequest({\n  url: QUAKE_URL,\n\
    \  jsonCallback: 'eqfeed_callback'\n})\n.flatMap(function(result) {\n  return\
    \ Rx.Observable.from(result.response.features);\n})\n.map(function(quake) {\n\
    \  return {\n    lat: quake.geometry.coordinates[1],\n    lng: quake.geometry.coordinates[0],\n\
    \    size: quake.properties.mag * 10000\n  };\n  });\nquakes.subscribe(function(quake)\
    \ {\n  L.circle([quake.lat, quake.lng], quake.size).addTo(map);\n```\n\n3. github.com/Reactive-Extensions/RxJS-DOM"
