  md: "# Adding a List of Earthquakes 81\n\n- This prevents getting the same element\
    \ more than once. That happen a lot with the mouseover event, for example.\n\n\
    In the previous section we attached the events mouseover and mouseout on each\
    \ row to change the earthquake circle color each time the mouse entered or exited\
    \ the row. Now, we'll use only the mouseover event on the table, combined with\
    \ the convenient pairwise operator:\n\n```\nexamples earthquake_ui/code3.pairwise.js\n\
    \ngrowFromEvent('mouseover')\n  .pairwise.subscribe(function(rows) {\n    var\
    \ prevCircle = quakeLayer.get(codeLayers[rows[0].id]);\n    var currCircle = quakeLayer.get(codeLayers[rows[1].id]);\n\
    \n    prevCircle.setStyle({ color: '#000ff' });\n    currCircle.setStyle({ color:\
    \ '#ff0000' });\n  });\n```\n\npairwise groups each event with the previously\
    \ emitted value in an array. We're always getting distinct rows, pairwise will\
    \ always yield the row that the mouse left and the row where the mouse is hovering\
    \ over. With this information, it is easy to clear each earthquake circle accordingly.\n\
    \nHandling the click event is even simpler:\n\n```\nexamples_earthquake_ui/code3.pairwise.js\n\
    \ngerFromEvent('click')\n  .subscribe(function(row) {\n    var circle = quakeLayer.get(codeLayers[row.id]);\n\
    \    map.panTo(circle.getLatLng());\n  });\n```\n\nAnd we can go back to just\
    \ subscribing to quakes to generate the rows:\n\n```\nexamples_earthquake_ui/code3.pairwise.js\n\
    \nquakes\n  .pluck('properties')\n  .map(makeRow)\n  .subscribe(function(row)\
    \ { table.appendChild(row); });\n```\n\nOur code is now more clean and idiomatic,\
    \ and it doesn't depend on the rows being there. If there are no rows, getRowFrom\
    \ won't try to yield any.\n\nWhat's more important, our code now is very efficient.\
    \ Regardless of the amount of earthquake information we retrieve, we'll always\
    \ have just a single mouseover event and a single click event, instead of hundreds\
    \ of events."
