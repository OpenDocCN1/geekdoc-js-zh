  md: "applications. Take the search input box, for example. We can definitely make\
    \ this into its own widget.\n\nThe objective is to encapsulate our widget in its\
    \ own component so that we use it as any other DOM element. We should also be\
    \ able to parameterize the component with any properties we want. We'll use it\
    \ in our applications like this:\n\n```\nvar wpSearchBox = searchBox({\n  props:\
    \ Rx.Observable.just({\n    apiURL: API_URL\n  })\n});\n```\n\nWe'll build our\
    \ widget using a concept also introduced by Cycle.js, nested dialogues. A nested\
    \ dialogue, or *dialogue*, is a function (like everything in Cycle.js) that takes\
    \ an Observable of events as input, and outputs an Observable—with the result\
    \ of applying these inputs to its internal logic.\n\nLet's start building the\
    \ search-component. We first create a function that takes a responses parameter\
    \ where we pass it any properties we want from the main application:\n\ncycle/search.js\n\
    \n```\nvar Cycle = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom');\n\
    var Rx = Cycle.Rx;\nvar h = CycleDOM.h;\nvar a;\n```\n\n```\nfunction searchBox(responses)\
    \ {\n  var props$ = responses.props$;\n  var apiURL$ = props$.map(function (props)\
    \ {\n    return props['apiURL'];\n  }).first();\n```\n\nEvery parameter searchBox\
    \ receives an Observable. In this case props$ is an Observable that emits a single\
    \ JavaScript object containing the configuration parameters for our Wikipedia\
    \ search box.\n\nAfter retrieving the properties, we define the virtual tree for\
    \ our widget. In our case, it is a very simple one that contains just an input\
    \ field:\n\ncycle/view.js\n\n```\nvar vtree$ = Rx.Observable.just(\nh('div', {\
    \ className: 'search-field' }, [\n  h('input', { type: 'text' })\n])));\n```"
