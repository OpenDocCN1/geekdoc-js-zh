  md: "# Chapter 3. Building Concurrent Programs * 66\n\n```\n));\n});\n}\n```\n\n\
    This function returns true if an enemy or a shot from an enemy hits the player's\
    \ spaceship.\n\nBefore moving on, let's get to know a useful operator: takeWhile.\
    \ When we call takeWhile on an existing Observable, Observable will keep emitting\
    \ values until the function passed as a parameter to takeWhile returns false.\n\
    \nWe can use takeWhile to tell our combineLatest Observable to keep taking values\
    \ until gameOver returns true:\n\n```\nspaceship_reactive/enemy_shots.js\n```\n\
    \n```\nRx.Observable.combineLatest(\n  StarShips, SpaceShip, Enemies, HeroShots,\n\
    \  function(stars, spaceship, enemies, heroShots) {\n    return\n      stars:\
    \ stars,\n      spaceship: spaceship,\n      enemies: enemies,\n      heroShots:\
    \ heroShots\n    };\n  })\n.sample(SPEED)\n.takeWhile(function(actors) {\n  return\
    \ gameOver(actors.spaceship, actors.enemies) === false;\n})\n.subscribe(renderScene);\"\
    ,\n```\n\nWhen gameOver returns true, combineLatest will stop emitting values,\
    \ effectively stopping the game.\n\n# One Last Thing: Keeping Score\n\nWhat kind\
    \ of game would it be if we couldn't brag about our results to our friends? We\
    \ obviously need a way to track of how well we did. We need a score.\n\nLet's\
    \ make a simpler helper function to draw the score to the upper left of the screen:\n\
    \n```\nspaceship_reactive/score.js\n```\n\n```\nfunction paintScore(score) {\n\
    \  ctx.fillStyle = '#ffffff';\n  ctx.font = 'bold 26px sans-serif';\n  ctx.fillText('Score:\
