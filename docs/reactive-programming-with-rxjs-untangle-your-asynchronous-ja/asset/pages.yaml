  md: "# Chapter 4. Building a Complete Web Application • 74\n\n```\nvar obs2 = Rx.Observable.just(\
    \ // Creates an empty Observable.delay(2000).flatMap(function() {\n return rangeTo.subscribe(printValue);\
    \ // 1, 2, 3, 4, 5\n});\n```\n\nUnderstanding when we're dealing with hot or cold\
    \ Observables is essential to avoid subtle and sneaky bugs. For example, Rx.Observable.interval\
    \ returns an Observable that produces an increasing integer value at regular intervals\
    \ of time. We imagine want to use it to push the same values to multiple observers.\
    \ We could implement it like this:\n\n```\nhot_cold.js\nvar source = Rx.Observable.interval(2000);\n\
    var observer1 = source.subscribe(function (x) {\n console.log('Observer 1, next\
    \ value: ' + x);\n});\n```\n\n```\nvar observer2 = source.subscribe(function (x)\
    \ {\n console.log('Observer 2: next value: ' + x);\n});\n```\n\nOutput:\n\n+ \
    \  - Observer 1, next value: 0\nObserver 2: next value: 0\nObserver 1, next value:\
    \ 1\nObserver 2: next value: 1\n\nThat seems to work. But now imagine that we\
    \ need the second subscriber to join three seconds after the first one:\n\n```\n\
    hot_cold.js\nvar source = Rx.Observable.interval(1000);\nvar observer1 = source.subscribe(function\
    \ (x) {\n console.log('Observer 1: ' + x);\n});\n```\n\n```\nsetTimeout(function()\
    \ {\n var observer2 = source.subscribe(function (x) {\n console.log('Observer\
    \ 2: ' + x);\n });\n}, 3000);\n```\n\nOutput:\n\n+   - Observer 1: 0\nObserver\
    \ 1: 1\nObserver 1: 2"
