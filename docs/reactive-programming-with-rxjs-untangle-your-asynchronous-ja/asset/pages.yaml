  md: "# Handling Errors\n\nWe can't use the conventional try/catch mechanism in callbacks\
    \ because it is synchronous. It would run before any asynchronous code, and wouldn't\
    \ be able to catch any errors.\n\nWith callbacks, this was solved by passing the\
    \ error (if any) as a parameter to the callback function. That works, but it makes\
    \ the code pretty fragile.\n\nLet's see how to catch errors inside Observables.\n\
    \n# The onError Handler\n\nRemember when we talked about the three methods we\
    \ can call on an Observer, in First Contact with Observers, on page 10? We're\
    \ familiar with onError and onCompleted, but we haven't yet used onError; it is\
    \ the key to effectively handling errors in Observable sequences.\n\nTo see how\
    \ it works, we'll write a simple function to take an array of JSON strings and\
    \ return an Observable that emits the objects parsed from those strings, using\
    \ JSON.parse:\n\n```\nfunction getJSON(arr) {\n  return Rx.observable.from(arr).map(function(str)\
    \ {\n    var parsedJSON = JSON.parse(str);\n    return parsedJSON;\n  });\n}\n\
    \ngetJSON([\n  '{\"1\": 1, \"2\": 2},\n  '{\"success: true}', // Invalid JSON\
    \ string\n  '{\"enabled\": true}'\n]).subscribe({\n  function(json) {\n    console.log('Parsed\
    \ JSON: ', json);\n  },\n  function(err) {\n    console.log(err.message);\n  }\n\
    });\n```\n\nWe'll pass an array with three JSON strings to getJSON, in which the\
    \ second string in the array contains a syntax error, so JSON.parse won't be able\
    \ to parse it. Then we'll subscribe to the result, providing handlers for onNext\
    \ and onError:\n\nParsed JSON: {1: 1, 2: 2}\nJSON.parse: unterminated string at\
    \ line 1 column 8 of the JSON data"
  merge: -1
  pgno: 45
- img_proc: true
  md: "The Observable emits the parsed JSON for the first result but throws an exception\
    \ when trying to parse the second. The onError handler catches this and prints\
    \ it out. The default behavior is that whenever an error happens, the Observable\
    \ stops emitting items, and onCompleted is not called.\n\n# Catching Errors\n\n\
    So far we've seen how to detect that an error has happened and do something with\
    \ that information, but we haven't been able to react to it and continue with\
    \ whatever we were doing. Observable instances have the catch operator, which\
    \ allows us to react to an error in the Observable and continue with another Observable.\n\
    \ncatch takes either an Observable or a function that receives the error as a\
    \ parameter and returns another Observable. In our scenario, we want the Observable\
    \ to emit a JSON object containing an error property if there were errors in the\
    \ original Observable:\n\n```\nfunction getJSON(arr) {\n  return Rx.Observable.from(arr).map(function(str)\
    \ {\n    var parsedJSON = JSON.parse(str);\n    return parsedJSON;\n  });\n}\n\
    var caught = getJSON(['{\"1\": 1, \"2\": 2}', '{\"1\": 1}']).catch(\n  Rx.Observable.return({\n\
    \    error: 'There was an error parsing JSON'\n  });\n).subscribe(\n  function(json)\
    \ {\n    console.log('Parsed JSON: ', json);\n  },\n  // Because we catch errors\
    \ now, `onError` will not be executed\n  function(e) {\n    console.log('ERROR',\
    \ e.message);\n  }\n});\n```\n\nIn the preceding code, we create a new Observable,\
    \ caught, that uses the catch operator to catch errors in the original Observable.\
    \ If there's an error it will continue the sequence with an Observable that emits\
    \ only one item, with an error property describing the error. This is the output:\n\
    \n+   < Parsed JSON: Object { 1: 1, 2: 2 }\nParsed JSON: Object { error: \"There\
    \ was an error parsing JSON\" }"
  merge: -1
  pgno: 46
- img_proc: true
  md: "# Chapter 2. Deep in the Sequence • 28\n\nAnd here's the marble diagram for\
    \ the catch operator:\n\n![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_47_0.png)\n\n\
    Notice the X to indicate that the sequence experienced an error. The different\
    \ shape of the Observable values—triangles in this case—means that they are values\
    \ coming from another Observable. Here, that's the Observable we return in case\
    \ of an error.\n\ncatch is useful for reacting to errors in a sequence, and it\
    \ behaves much like the traditional try/catch block. In some cases, though, it\
    \ be very convenient to ignore an error that happens with an item in the Observable\
    \ and let the sequence continue. In those cases, we can use the retry operator.\n\
    \n# Retrying Sequences\n\nSometimes errors just happen and there's not much we\
    \ can do about it. For example, there could be a timeout requesting remote data\
    \ because the user has a spotty Internet connection, or a remote server that querying\
    \ could crash. In these cases it would be great if we kept requesting the data\
    \ until we needed to succeed. The retry operator does exactly that:\n\n```\nsequences/error_handling.js\n\
    ```\n\n```\n// This will try to retrieve the remote URL up to 5 times.\nRx.DOM.get('/products').retry(5)\n\
    .subscribe(\n  function(xhr) { console.log(xhr); },\n  function(err) { console.error('ERROR:\
    \ ', err); }\n);\n```\n\nIn the preceding code, we create a function that returns\
    \ an Observable that retrieves contents from a URL using XMLHttpRequest. Because\
    \ our connection might be a spotty, we add retry(5) before subscribing to it,\
    \ ensuring that in case of an error, it will try up to five times before giving\
    \ up and showing an error."
