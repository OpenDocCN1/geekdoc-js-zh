  md: "Rx.helpers.identity is the identity function. Given a parameter x, it returns\
    \ x. This way we don't have to write functions that return the value receive.\n\
    \nover is an Observable that emits true when the user hovers the mouse over the\
    \ element.\n\nout is an Observable that emits false when the user moves the mouse\
    \ outside of the element.\n\nisHovering merges both over and out, returning an\
    \ Observable that emits true when the mouse is over an element, and false when\
    \ it leaves it.\n\nWithHovering in place we can modify the modification that creates\
    \ the rows, so that we subscribe to events in each row as it is created:\n\nexamples_earthquake_ui/code3.js\n\
    \n```\nvar table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(bufferWithTime(500))\n  .filter(function(rows) { return rows.length >\
    \ 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      var circle = quakeLayer.get(codeLayers[row.id]);\n\
    \      isHovering(row).subscribe(function(hovering) {\n        circle.setStyle({\
    \ color: hovering ? '#ff0000' : '#0000ff' });\n      });\n    });\n      Rx.DOM.click(row).subscribe(function()\
    \ {\n        map.panTo(circle.getLatLng());\n      });\n\n      fragment.appendLatChild(row);\n\
    \    });\n    return fragment;\n  })\n  .subscribe(function(fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\nWe get the circle element for the earthquake on the map using the\
    \ ID we get from the row element. With that, codeLayers gives us the corresponding\
    \ internal ID, which gets us the circle element using quakeLayer.getLayer."
