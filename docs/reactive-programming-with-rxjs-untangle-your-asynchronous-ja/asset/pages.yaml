  md: "# Chapter 1. The Reactive Way * 2\n\nWe would write something like this:\n\n\
    ```\nvar button = document.getElementById('retrieveDataBtn');\nvar source1 = Rx.DOM.JSON('resource1').pluck('name');\n\
    var source2 = Rx.DOM.JSON('resource2').pluck('props', 'name');\nfunction getResults(amount)\
    \ {\n  return source1.merge(source2)\n    pluck('names')\n    .flatMap(function(array)\
    \ { return Rx.Observable.from(array); })\n    .distinct()\n    .take(amount);\n\
    }\nvar clicks = Rx.Observable.fromEvent(button, 'click');\nclicks.debounce(1000)\n\
    \  .flatMap(getResults(5))\n  .subscribe(\n    function(value) { console.log('Received\
    \ value, value); },\n    function(error) { console.error(error); },\n    function()\
    \ { console.log('All values retrieved!'); }\n  );\n```\n\nDon't worry about understanding\
    \ what's going on here: let's focus on the 10,000-foot view for now. The first\
    \ thing you see is that we express more with fewer lines of code. We accomplish\
    \ this by using Observables.\n\nAn Observable represents a stream of data. Programs\
    \ can be expressed largely as streams of data. In the preceding example, both\
    \ remote sources are Observables, and so are the clicks from the user. In fact,\
    \ our program is essentially a single Observable made from a button's click event\
    \ that we transform into the results we want.\n\nReactive programming is expressive.\
    \ Take, for instance, throttling clicks in our every. Imagine how complex it would\
    \ be to do that using callbacks or promises; we'd need to reset a timer every\
    \ single second and keep state of whether a success has passed since the last\
    \ time the user clicked the button. It's a lot of complexity for so little functionality,\
    \ and the code for it is not even related to your program's actual functionality.\
    \ In bigger applications, these little complexities add up quickly to make for\
    \ a tangled code base.\n\nWith the reactive approach, we use the method debounce\
    \ to throttle the stream of clicks. This ensures that there is at least a second\
    \ between each click, and discards any clicks between. We don't care how this\
    \ happens internally; we just express what we want our code to do, not how to\
    \ do it.\n\nIt gets much more interesting. Next you'll see how reactive programming\
    \ can help us make our programs more efficient and expressive."
