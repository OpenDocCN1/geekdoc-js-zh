  md: "# Chapter 4. Building a Complete Web Application • 80\n\nWe call isHovering\
    \ with the current row and we subscribe to the resulting Observable. if the hovering\
    \ argument is true, we'll paint the circle red; otherwise, it will be blue.\n\n\
    We subscribe to the Observable created from the click event in the current row.\
    \ When the row in the list is clicked, the map will be centered on the corresponding\
    \ circle in the map.\n\n# Making It Efficient\n\nExperienced front-end developers\
    \ know that creating many events on a page is a recipe for bad performance. In\
    \ our previous example, we created three events for each row. If we get 100 earthquakes\
    \ on the list, we would have three hundred events floating around the page just\
    \ to do some light highlighting work! That is terrible for performance, and we\
    \ can do better.\n\nBecause events in DOM bubble up (from children to parent elements),\
    \ a well-known technique among front-end developers to avoid attaching mouse events\
    \ to many elements individually is to attach them instead of their parent element.\
    \ Once the event is fired on the parent, we can use the event's target property\
    \ to find the child element that was the event's target.\n\nBecause we'll need\
    \ similar functionality for the events click and mouseover, we will create a function\
    \ getRowFromEvent:\n\n```\nexamples/earthquake_ui/code3.js\nfunction getRowFromEvent(event)\
    \ {\n  return Rx.Observable\n    .fromEvent(table, event)\n    .filter(function(event)\
    \ {\n      var el = event.target === 'TD' && event.parentNode.length;\n      return\
    \ el.tagName;\n    })\n    .pluck('target', 'parentNode')\n    .distinctUntilChanged();\n\
    }\n```\n\ngetRowFromEvent gives us the row in which the event has happened. Here\
    \ are the details:\n\nWe make sure that we get events happening in a table cell,\
    \ and we check that the parent of that cell is a row with an ID attribute. These\
    \ rows are the ones we tagged with the earthquake ID.\n\nThe pluck operator extracts\
    \ the nested property parentNode inside the element's target property."
