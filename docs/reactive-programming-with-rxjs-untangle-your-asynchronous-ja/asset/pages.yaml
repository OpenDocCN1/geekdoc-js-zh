  md: "this book I'm telling you to design your program by transforming sequences\
    \ into new ones. Isn't that terribly inefficient?\n\nChaining looks similar in\
    \ Observables and in arrays; there are even methods like filter and map that are\
    \ present in both types. But there's a crucial difference: array methods create\
    \ a new array as a result of each operation, which is traversed entirely by the\
    \ next operation. Observable pipelines, on the other hand, don't create intermediate\
    \ Observables and apply all operations to each element in one go. The Observable\
    \ is thus traversed only once, which makes chaining Observables efficient. Check\
    \ out the following example:\n\n```\nspaceship_reactive/array_chain.js\n```\n\n\
    ```\nstringArray // represents an array of 1,000 strings\n.map(function(str) {\n\
    \  return str.toUpperCase();\n})\n.filter(function(str) {\n  return /^[A-Z]+$/.test(str);\n\
    })\n.forEach(function(str) {\n  console.log(str);\n});\n```\n\nLet's say stringArray\
    \ is an array with 1,000 strings that we want to convert to uppercase and then\
    \ filter out the ones that contain anything other than alphabet characters (or\
    \ no letters at all). Then we want to print each string of the resulting array\
    \ to the console.\n\nThis is what happens behind the scenes:\n\n+   -Iterate through\
    \ the array and create a new array with all items uppercase.\n-Iterate through\
    \ the uppercase array, creating another array with 1,000 elements.\n-Iterate through\
    \ the filtered array and log each result to the console.\n\nIn the process of\
    \ transforming the array, we've iterated arrays three times and created two completely\
    \ new big arrays. This is far from efficient! You shouldn't program this way if\
    \ if you're concerned about performance or you're dealing with big sequences of\
    \ items.\n\nThis is what the same operation would look like using Observables:\n\
    \n```\nspaceship_reactive/array_chain.js\n```\n\n```\nstringObservable // represents\
    \ an observable emitting 1,000 strings\n.map(function(str) {\n  return str.toUpperCase();\n\
    ```"
