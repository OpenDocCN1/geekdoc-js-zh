  md: "# What Is JSONP?\n\nJSONP—or JSON with *padding*—is a sneaky technique that\
    \ web developers come up to work around browser restrictions when requesting data\
    \ from third-party domains.a\n\nIt bypasses these restrictions by loading external\
    \ content using script tags instead of the usual XMLHttpRequest. Adding a script\
    \ tag to the DOM loads and executes its content directly, and the security restrictions\
    \ are not applied.\n\nThe remote request's content is then normal JSON wrapped\
    \ in a function call (the P JSON). It looks like:\n\n```\ncallbackFn(a: 1, b:\
    \ 2, c: 3);\n```\n\nJSONP URLs usually accept a query string parameter so that\
    \ the caller can specify the name of the callback. The developer then has to define\
    \ a function in his code that has the same name as the callback in the server\
    \ response, and when the script tag is added to the document, that function will\
    \ be called with the JSON data as the first parameter.\n\nLibraries like jquery\
    \ automate this process by internally creating the global function to handle the\
    \ JSONP call, and tidying up afterward to avoid polluting the global namespace.\n\
    \n> a. http://en.wikipedia.org/wiki/Same-origin_policy\n\nThis is a perfect situation\
    \ for flatMap. We'll retrieve the data and make Observable out the features array\
    \ using Rx.Observable. Then we'll merge that back in the main Observable:\n\n\
    ```\nexamples_earthquake/code1.js\n```\n\n```\nvar quakes = Rx.Observable.create(function(observer)\
    \ {\n  window.efeed.callback = function(response) {\n    observer.onNext(response);\n\
    \    observer.onCompleted();\n  };\n\n  loadJSONP(QUAKE_URL);\n}).flatMap(function\
    \ transform(dataset) {\n  return Rx.Observable.from(dataset.features);\n});\n\n\
    quakes.subscribe(function(quake) {\n  var coords = quake.geometry.coordinates;\n\
    \  var size = quake.properties.mag * 10000;\n  L.circle([coords[1], coords[0]],\
    \ size).addTo(map);\n});\n```"
