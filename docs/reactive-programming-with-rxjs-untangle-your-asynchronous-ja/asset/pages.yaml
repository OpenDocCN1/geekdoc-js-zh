  md: "Observer 1: 3\n\nObserver 2: 0\n\nObserver 1: 4\n\nObserver 2: 1\n\n...\n\n\
    Now we see that something is really really off. When subscribing three seconds\
    \ later, observer2 receives all the values that the source already pushed, instead\
    \ of starting with the current value and continuing from there, because Rx.Observable.interval\
    \ is a cold Observable. If the difference between hot and cold Observables is\
    \ not clear, scenarios like this can be surprising.\n\nIf we have several Observers\
    \ listening to a cold Observable, they will receive copies of the same sequence\
    \ of values. So strictly speaking, although the Observers are sharing the same\
    \ Observable, they are not sharing the same exact sequence of values. If we want\
    \ the Observers to share the same sequence, we need not a hot Observable.\n\n\
    # From Cold to Hot Using publish\n\nWe can turn a cold Observable into a hot one\
    \ using publish. Calling creates a new Observable that acts as a proxy to the\
    \ original. It does that by subscribing itself to the original and pushing the\
    \ values it receives to its subscribers.\n\nA published Observable is actually\
    \ a ConnectableObservable, which has an extra method called connect that we call\
    \ to start receiving values. This allows us to subscribe to it before it starts\
    \ running:\n\n```\nhot_cold.js\n// Create an Observable that yields a value every\
    \ second\nvar source = Rx.Observable.interval(1000);\nvar publisher = source.publish();\n\
    \n// Even if we are subscribing, no values are pushed yet.\nvar observer1 = publisher.subscribe(function\
    \ (x) {\n  console.log('Observer 1: ' + x);\n});\n\n// publisher connects and\
    \ starts publishing values\npublisher.connect();\nsetTimeout(function() {\n  //\
    \ 5 seconds later, observer2 subscribes to it and starts receiving\n  // current\
