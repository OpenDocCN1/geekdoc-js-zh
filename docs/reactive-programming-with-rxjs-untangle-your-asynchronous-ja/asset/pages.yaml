  md: "Chapter 3. Building Concurrent Programs * 58\n\n```\nfunction paintEnemies(enemies)\
    \ {\n  enemies.forEach(function(enemy) {\n    enemy.y += 5;\n    enemy.x += getRandomInt(-15,\
    \ 15);\n\n  drawTriangle(enemy.x, enemy.y, 20, '#0ff00', 'down');\n  });\n}\n\
    ```\n\nYou can see in paintEnemies that we are also changing the x-coordinate\
    \ randomly so that enemies move a bit unpredictably to the sides. Now we need\
    \ to update the function renderScene to include a call to paintEnemies.\n\nYou\
    \ might have noticed a strange effect while playing the game we have so far: if\
    \ you move the mouse, the enemies go faster toward you! That could be a nice feature\
    \ in the game, but we definitely didn't intend to do that. Can you guess what\
    \ causes this bug?\n\nIf you guessed that it was related to the paintEnemies function,\
    \ you're right on the money. combineLatest renders our scene whenever any of the\
    \ Observables yields a value. If we don't move the mouse, the fastest emitter\
    \ will always be starStream because it has an interval of 40 milliseconds (the\
    \ Enemies Observable emits only every 1,500 milliseconds). When we move the mouse,\
    \ SpaceShip will emit faster than starStream (your mouse coordinates many times\
    \ per second), and paintEnemies will execute that many times, increasing the enemies'\
    \ coordinates much faster.\n\nTo avoid this and similar problems in the future,\
    \ we need to normalize the game's speed so that no Observable can emit values\
    \ faster than our chosen speed for the game.\n\nAnd yes, as you have guessed,\
    \ RxJS has an operator for that.\n\n# Avoid Drinking from the Firehose\n\nThere\
    \ is such a thing as receiving data too fast. Most of the time we want all the\
    \ speed we can get, but depending on the frequency at which the Observable streams\
    \ values, we might want to drop some of the values we receive. We're now in one\
    \ of these scenarios. The speed at which we render things onscreen is proportional\
    \ to the speed of the fastest Observable we have. It turns out that our fastest\
    \ Observable is too fast for us, and we need to establish a constant update speed\
    \ in the game.\n\nsample is a method in Observable instances, given a time parameter\
    \ in milliseconds, returns an emitter that emits the last value emitted by the\
    \ parent Observable in each time interval."
