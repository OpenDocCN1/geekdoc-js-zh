  md: "# spaceship_reactive/hero_1.js\n\n```\nvar HERO_Y = canvas.height - 30;\nvar\
    \ mouseMove = Rx.Observable.fromEvent(canvas, 'mousemove');\nvar SpaceShip = mouseMove\n\
    .map(function(event) {\n  return {\n    x: event.clientX,\n    y: HERO_Y\n  }\n\
    }).startsWith({\n  x: canvas.width / 2,\n  y: HERO_Y\n});\n```\n\nNotice that\
    \ I used startWith(). This sets the first value in the Observable, and set it\
    \ to a position in the middle of the screen. Without startWith our Observable\
    \ would start emitting only when the player moves the mouse.\n\nLet's render our\
    \ hero on the screen. In this game all the characters are triangles (my graphic-design\
    \ skills are not very impressive), so we'll define a helper function to render\
    \ triangles on the canvas, given the coordinates, size, and color, and the direction\
    \ they're facing:\n\n# spaceship_reactive/hero_1.js\n\n```\nfunction drawTriangle(x,\
    \ y, width, color, direction) {\n  ctx.fillStyle = color;\n  ctx.beginPath();\n\
    \  ctx.moveTo(x - width, y);\n  ctx.lineTo(x, direction === 'up' ? y - width :\
    \ y + width);\n  ctx.lineTo(x + width, y);\n  ctx.lineTo(x - width, y);\n  ctx.fill();\n\
    }\n```\n\nWe'll also define paintSpace, which uses the helper function:\n\n# spaceship_reactive/hero_1.js\n\
    \n```\nfunction paintSpaceShip(x, y, 20, '#ff0000', 'up') {\n  drawTriangle(x,\
    \ y);\n}\n```\n\nBut we're facing a problem now. If we subscribe to the SpaceShip\
    \ Observable and call drawTriangle in the subscription, our spaceship would be\
    \ visible only when we move the mouse, and for just an instant. This is because\
    \ starStream is updating the canvas many times per second, crasing our spaceship\
    \ if we don't move the mouse. And because the starStream doesn't have direct access"
