  md: "# Chapter 4. Building a Complete Web Application • 86\n\nHere's a way to do\
    \ it:\n\n```\nexamples_earthquake_ui/tweet_stream/index.js\n\nRx.Observable\n\
    \  .from(ws, 'message')\n  .flatMap(function(quakesObj){\n    quakesObj = JSON.parse(quakesObj);\n\
    \    return Rx.Observable.from(quakesObj.quakes);\n  })\n  .scan([],function (boundsArray,\
    \ quake) {\n    quake.lng - 0.3, quake.lat - 0.15,\n    quake.lng + 0.3, quake.lat\
    \ + 0.15\n    .map(function(coordinate) {\n      coordinate = coordinate.toString();\n\
    \      return coordinate.match(/\\-?\\d+\\.\\-?\\d{2}\\/)[0];\n    });\n  });\n\
    \  var boundsArray = boundsArray.concat(bounds);\n  return boundsArray.slice(Math.max(boundsArray.length\
    \ - 50, 0));\n  })\n  .subscribe(function(boundsArray) {\n    stream.stop();\n\
    \    stream.params.locations = boundsArray.toString();\n    stream.start();\n\
    \  });\n```\n\nAnd here is the step-by-step of what is happening in the preceding\
    \ code:\n\n+   We meet our old friend scan. Any time we need to accumulate results\
    \ and yield each intermediate result, scan is our friend. In this case, we'll\
    \ keep accumulating earthquake coordinates in the boundsArray array.\n\n+   From\
    \ the single latitude/longitude pair of coordinates of the epicenter of the earthquake,\
    \ we create an array that contains an area determined by a north-west coordinate\
    \ and a south-east one. The numbers used to approximate the bounds rectangle the\
    \ size of a large city.\n\n+   After that, we use a regular expression to limit\
    \ the decimal precision of each coordinate to two decimals, to comply with the\
    \ Twitter API requirements.\n\n+   We concatenate the generated boundaries to\
    \ boundsArray, which contains every previous earthquake's boundaries. Then we\
    \ take the last 25 pairs of boundaries (50 items in the array), since that is\
    \ the limit of the Twitter API."
