  md: "To keep score we'll use a BehaviorSubject with a starting value of 0. We can\
    \ easily-use it in our combineLatest-based main game loop as if it were just another\
    \ Observable, and we can push values to whenever we want.\n\nspaceship_reactive/score.js\n\
    \n```\nvar ScoreSubject = new Rx.BehaviorSubject(0);\nvar score = ScoreSubject.scan(function(prev,\
    \ cur) {\n  return prev + cur;\n}, 0);\n```\n\nIn that code we use friend the\
    \ scan operator to sum each new value to the total aggregate result.\n\nNow we\
    \ have to push score to our Subject whenever we hit an enemy; that happens in\
    \ paintHeroSh\n\nspaceship_reactive/score.js\n\n```\nvar SCORE_INCREASE = 10;\n\
    function paintHeroShots(heroShots, enemies) {\n  heroShots.forEach(function(shot,\
    \ i) {\n    for (var l=0; l<enemies.length; l++) {\n      var enemy = enemies[l];\n\
    \      if (!enemy.isDead && collision(shot, enemy)) {\n        ScoreSubject.next(SCORE_INCREASE);\n\
    \        enemy.isDead = true;\n        shot.x = shot.y = -100;\n        break;\n\
    \      }\n    }\n    shot.y = SHOOTING_SPEED;\n    drawTriangle(shot.x, shot.y,\
    \ 5, '#ff00ff', 'up');\n  });\n}\n```\n\nAnd of course, we add paintScore to renderScene\
    \ so score appears onscreen:\n\nspaceship_reactive/score.js\n\n```\nfunction renderScene(actors)\
    \ {\n  paintStars(actors.stars);\n  paintSpaceShip(actors.spaceship.x, actors.spaceship.y);\n\
    \  paintEnemies(actors.enemies);\n  paintHeroShots(actors.heroShots, actors.enemies);\n\
    \  paintScore(actors.score);\n}\n```\n\nThat completes our Spaceship Reactive\
    \ game. With about 200 lines we've managed to code an entire game in the browser,\
    \ avoiding changing any external state through the power of Observable pipelines."
