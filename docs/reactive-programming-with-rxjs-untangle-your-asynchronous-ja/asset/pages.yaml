  md: "# Chapter 6. Reactive Web Applications with Cycle.js • 112\n\nresponsesJSON\
    \ is an Observable of Observables. For each response there is an Observable. In\
    \ this line we flatten them all out, so we deal with the responses themselves\
    \ from now on, instead of the Observables.\n\nThe responses are JSON objects,\
    \ and the information we're interested in is in the querysearch property. We use\
    \ the pluck operator to extract it.\n\nWe don't know if we'll have results, so\
    \ at the very least we ensure we'll have an empty array.\n\nFinally, we apply\
    \ our treeElements function to every result from Wikipedia. This will update our\
    \ UI.\n\nNotice the $ at the end of the variable's name. In this chapter I'm adopting\
    \ a naming convention in Cycle.js code that adds $ to the name of a variable to\
    \ that it is an Observable. For that it makes it much easier to understand Observable-based\
    \ code!\n\nThe most important takeaway from the preceding code is that in the\
    \ last step we seem to be repainting the whole UI for every single result we receive.\
    \ But here's where the virtual DOM shines. No matter how many times we rerender\
    \ the page, the virtual DOM will ensure that all the differences are rendered,\
    \ making it very efficient. If there are no changes to the virtual DOM, no changes\
    \ will be rendered in the page.\n\nThis way we don't have to worry about adding\
    \ or removing elements. We just render the whole application every time, and we\
    \ let the Virtual DOM figure out what to update under the hood.\n\n# Model-View-Intent\n\
    \nThe architectural approach we used to build the Wikipedia real-time search is\
    \ not just another framework's random approach to programming UI. There's a design\
    \ pattern behind structuring code like we did: Model-View-Intent (MVI).\n\nModel-View-Intent\
    \ (MVI). \n\nModel-View-Intent is a term coined by the creator of Cycle.js, André\
    \ Startz, for an architecture inspired by the Model-View-Controller (MVC) architecture.⁴\
    \ In MVC we separate the functionality of an application into three components:\
    \ the model, the view, and the controller. In MVI, the three components are the\
    \ model, the view, and the intent. MVI is designed to fit the Reactive model of\
    \ programming like a glove.\n\nMVI being reactive means that each component observes\
    \ its dependencies and reacts to the dependencies' changes. This is different\
    \ from MVC, in which\n\n> 4. https://en.wikipedia.org/wiki/Model-view-controller"
