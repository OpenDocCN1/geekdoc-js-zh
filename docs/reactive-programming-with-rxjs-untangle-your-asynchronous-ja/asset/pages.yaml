  md: "as we keep adding more concurrency to our applications, the code to coordinate\
    \ asynchronous flows becomes unwieldy. Current mechanisms all have serious shortcomings\
    \ that hinder the developer's productivity and make for fragile applications.\n\
    \nHere's a quick rundown of the current mechanisms for handling asynchronous operations,\
    \ along with their problems.\n\n# Callback Functions\n\nA callback is a function\
    \ (A) passed as a parameter to another function (B) that performs an asynchronous\
    \ operation. When (B) is done, it calls back (A) with the results of the operation.\
    \ Callbacks are used to manage asynchronous flows such as network I/O, database\
    \ access, or user input.\n\n```\n//callback_example.js\n```\n\n```\nfunction B(callback)\
    \ {\n  // Do operation that takes some time\n  callback('Done!');\n}\n\nfunction\
    \ A(message) {\n  console.log(message);\n}\n\n// Execute 'B' with 'A' as a callback\n\
    B(A);\n```\n\nCallbacks are easy to grasp and have become the default way of handling\
    \ asynchronous flows in JavaScript. But this simplicity comes at a price. Callbacks\
    \ have the following drawbacks:\n\n+   * Callback hell. It's easy to end up with\
    \ lists of nested callbacks when dealing highly asynchronous code. When that happens,\
    \ code stops being linear and becomes hard to reason about. While applications\
    \ end up passed around in callbacks, and they become difficult to maintain and\
    \ debug.\n\n+   * Callbacks can run more than once. There's no guarantee the same\
    \ callback will be called only once. Multiple invocations can be hard to detect\
    \ and result in errors and general mayhem in your application.\n\n+   * Callbacks\
    \ change error semantics. Callbacks break the traditional try/catch mechanism\
    \ and rely on the programmer to check for errors and pass them around.\n\n+  \
    \ * Concurrency gets increasingly complicated. Combining interdependent results\
    \ of multiple asynchronous operations becomes difficult. It requires"
