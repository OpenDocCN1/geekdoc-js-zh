  md: "# Retrieving and Sending Tweets\n\nWe're using the streaming Twitter client\
    \ for Node.js twit to connect to Twitter and search tweets. All code in the server\
    \ from now will happen inside the onConnect function it assumes that a connection\
    \ to a WebSocket is already established. Let's initialize the stream of tweets:\n\
    \n```\nexamples/earthquake_ui/tweet_stream/index.js\nvar stream = T.stream('statuses/filter',\
    \ {\n  track: 'earthquake',\n  locations: []\n});\n```\n\nThis tells our Tweet\
    \ instance to start streaming Twitter statuses, filtered by the keyword earthquake.\
    \ This is, of course, very generic and not directly related to the earthquakes\
    \ happening right now. But notice the earthquake locations array. This is an array\
    \ of latitude and longitude boundaries that we can use to filter tweets by their\
    \ geographic location, along with the word earthquake. That's much more specific!\
    \ Alright, let's subscribe to this stream and send tweets to the browser:\n\n\
    ```\nexamples/Observable_EventEmitter/index.js\nRx.Observable(stream, 'tweet').subscribe(function(tweetObject)\
    \ {\n  ws.send(JSON.stringify(tweetObject), function(err) {\n  if (err) {\n  \
    \  console.log('There was an error sending the message');\n  }\n  });\n});\n```\n\
    \nIf we restart the server and reload the browser, we should receive tweets in\
    \ the browser, and the console in the development panel should be printing the\
    \ tweets.\n\nThese tweets are not filtered by earthquake yet. To do that, we need\
    \ to do the following things with each piece of earthquake information we receive:\n\
    \n+   - Take the longitude and latitude pair of epicenter coordinates of each\
    \ earthquake and create a bounding box that delimits the geographical area of\
    \ the tweets that we consider related to the earthquake.\n- Accumulate all the\
    \ boundary coordinates so that tweets sent to the client keep being relevant to\
    \ the earthquakes on the map.\n- Update the tweet stream with the new coordinates\
    \ every time we receive the message for a new earthquake."
  merge: -1
