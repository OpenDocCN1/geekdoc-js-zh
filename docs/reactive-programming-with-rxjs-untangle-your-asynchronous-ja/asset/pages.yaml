  md: "# Chapter 6. Reactive Web Applications with Cycle.js • 108\n\nUsing JSX\nInstead\
    \ of using the h function, we could write our UI using JSX, an XML-like syntax\
    \ extension invented by Facebook that makes writing virtual DOM structures easier\
    \ and more readable. Or our vtreeElements function would look like this:\n\n```\n\
    cycle/index.js\nfunction vtreeElementsJSX(results) {\n  results = results.map(function(result)\
    \ {\n    var link = WIKI_URL + result.title;\n    return <div><a href={link}>{result.title}</a></div>;\n\
    \  });\n}\n\nreturn <div>\n  <h1>Wikipedia Search</h1>\n  <input className=\"\
    search-field\" type=\"text\" />\n  <div>{results}</div>\n</div>;\n}\n```\n\nDoesn't\
    \ it look nicer? JSX looks more familiar to developers because it resembles HTML,\
    \ we can write it alongside JavaScript code, with the added advantage that we\
    \ can treat it as a JavaScript type. For example, notice how we iterate the results\
    \ array and we return a <div> element directly, using the value of link result.title\
    \ in the element itself. (JavaScript values can be inclined by putting them inside\
    \ curly brackets.)\n\nSince JSX is a syntax extension, we need a compiler that\
    \ transforms it into the final JavaScript code (which looks much like our h-based\
    \ code from the previous section). We'll use Babel for Babel. Babel is a compiler\
    \ that transforms modern JavaScript into JavaScript that runs everywhere. It also\
    \ transforms some JavaScript extensions, such as JSX, which is our particular\
    \ case.\n\nIf you want to use JSX, you need to install Babel and use it when compiling\
    \ the project. Fortunately, Babel has an adapter for Browserify called Babelify:\n\
    \n```\n$ npm install babelify\n```\n\nIn every file that uses JSX, we need to\
    \ add the following lines at the top of the file:\n\n```\n/* @jsx hJSX */\nvar\
    \ hJSX = CycleDOM.hJSX;\n```\n\n3. https://babel.io"
  merge: -1
