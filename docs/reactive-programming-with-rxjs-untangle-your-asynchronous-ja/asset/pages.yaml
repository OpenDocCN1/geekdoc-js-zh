  md: "Chapter 1. The Reactive Wave • 10\n\nSo far it seems there's not much of a\
    \ difference from the traditional Observer pattern. But actually there are two\
    \ essential differences:\n\n+   - An Observable doesn't start streaming items\
    \ until it has at least one Observer subscribed to it.\n- Like iterators, an Observable\
    \ can signal when the sequence is completed.\n\nUsing Observables, we can declare\
    \ how to react to the sequence of elements they emit, instead of reacting to individual\
    \ items. We can efficiently copy, transform, and query the sequence, and these\
    \ operations will apply to all the elements of the sequence.\n\n# Creating Observables\n\
    \nThere are several ways to create Observables, the create operator being the\
    \ most obvious one. The create operator in the Rx.Observable object takes a callback\
    \ that accepts an Observer as a parameter. That function defines how the Observable\
    \ will emit values. Here's how we create a simple Observable:\n\n```\nvar observable\
    \ = Rx.Observable.create(function(observer) {\n  observer.next('Simon');\n  observer.next('Gen');\n\
    \  observer.next('Sergi');\n  observer.onCompleted(); // We are done\n});\n```\n\
    \nWhen we subscribe to this Observable, it emits three strings by calling the\
    \ onError method on its listeners. It then calls onCompleted to signal that the\
    \ sequence is finished. But how exactly do we subscribe to an Observable? We use\
    \ Observers.\n\n# First Contact with Observers\n\nObservers listen to related\
    \ method. Whenever an event happens in an Observable, It calls the related method\
    \ in all of its Observers.\n\nObservers have three methods: onNext, onCompleted,\
    \ and onError:\n\nonNext The equivalent of Update in the Observer pattern. It\
    \ is called when the Observable emits a new value. Notice the name reflects the\
    \ fact that we're subscribed to sequences, not only to discrete values.\n\nonCompleted\
    \ Signals that there is no more data available. After onCompleted is called, further\
    \ calls to onNext will have no effect.\n\nonError Called when an error occurs\
    \ in the Observable. After it is called, further calls to onNext will have no\
    \ effect."
