  md: "```\nfunction main(responses) {\nreturn {\n  DOM: Rx.Observable.just(CycleDOM.h('span',\
    \ 'Hey there!')),\n  JSONP: searchRequest(responses)\n}\n}\n```\n\n```\nvar drivers\
    \ = {\n  DOM: CycleDOM.makeDriver('#container'),\n  JSONP: CycleJSONP.makeJSONPDriver()\n\
    };\n```\n\nCycle.run(main, drivers);\n\nWe want to plug the searchRequest into\
    \ the JSONP driver, so that as soon as the user types a search term, we query\
    \ Wikipedia with the term.\n\nTo do that, we create a new JSONP driver using CycleJSONP.makeJSONPDriver,\
    \ which will receive whatever we put in the property JSONP in the return object\
    \ from main. After doing that, we should already be querying Wikipedia when we\
    \ introduce a search term in the input box, but we're not connecting the JSONP\
    \ output to anything, we don't see any changes on the page. Let's change that:\n\
    \n# cycle/step3.js\n\n```\nfunction main(responses) {\n  var vtree$ = responses.JSONP\n\
    \  .filter(function(res) {\n    return res.request.indexOf(API_URL) === 0;\n \
    \ })\n  .mergeAll(\n    .pluck('query', 'search')\n    .startWith([])\n  .map(vtreeElements);\n\
    \  return {\n    DOM: vtree$,\n    JSONP: searchRequest(responses)\n  }\n}\n```\n\
    \nmain receives the output of all drivers through its responses parameter. We\
    \ can get the result of the JSON calls in responses.JSONP, an Observable of all\
    \ the JSONP responses in our application. We have that, we can transform the Observable\
    \ to get the search results in our format we:\n\n+   - responses.JSONP emits all\
    \ JSONP responses in the application. We start by filtering the ones that contain\
    \ the API URL of Wikipedia in its request, to make sure that we're processing\
    \ the relevant responses."
