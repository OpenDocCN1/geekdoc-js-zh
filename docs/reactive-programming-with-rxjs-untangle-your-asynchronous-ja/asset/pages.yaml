  md: "# Hot Observables\n\nAn Observer subscribed to a hot Observable will receive\
    \ values emitted at the exact moment it subscribes to it. Every other Observer\
    \ subscribed at that moment will receive the exact same values. This is similar\
    \ to how JavaScript events work.\n\nMouse events and a stock-exchange ticker are\
    \ examples of hot Observables. In both cases the Observable emits values regardless\
    \ of whether it has subscribers, and could already be producing values before\
    \ any subscriber is listening. Here's an example:\n\n```\nhot_cold.js\nvar onMove\
    \ = Rx.Observable.fromEvent(document, 'mousemove');\nvar subscriber1 = onMove.subscribe(function(e)\
    \ {\n  console.log('Subscriber1:', e.clientX, e.clientY);\n});\nvar subscriber2\
    \ = onMove.subscribe(function(e) {\n  console.log('Subscriber2:', e.clientX, e.clientY);\n\
    });\n// Result:\n// Subscriber1: 23 24\n// Subscriber2: 23 24\n// Subscriber1:\
    \ 34 37\n// Subscriber2: 34 37\n// Subscriber1: 46 49\n// Subscriber2: 46 49\n\
    ...\n```\n\nIn the example, both subscribers receive the same values from the\
    \ Observable as they are emitted. To JavaScript programmers, that behavior feels\
    \ natural because it resembles how JavaScript events work.\n\nNow let's see how\
    \ cold Observables work.\n\n# Cold Observables\n\nA cold Observable emits values\
    \ only when Observers subscribe to it.\n\nFor example, Rx.Observable.range returns\
    \ a cold Observable. Every new Observer that subscribes to it will receive the\
    \ whole range:\n\n```\nhot_cold.js\nfunction printValue(value) {\n  console.log(value);\n\
    }\nvar rangeToFive = Rx.Observable.range(1, 5);\nvar obs1 = rangeToFive.subscribe(printValue);\
    \ // 1, 2, 3, 4, 5\n```"
