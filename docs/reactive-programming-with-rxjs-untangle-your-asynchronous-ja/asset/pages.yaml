  md: "Here's how we create a basic Observer:\n\n```\nvar observer = Rx.Observer.create(\n\
    \  function next(x) { console.log(' ' + x); },\n  onError(err) { console.log('\
    \ ' + err); },\n  function onCompleted() { console.log('Completed'); }\n);\n```\n\
    \nThe method in the Rx.Observer object takes functions for the onError,\nonCompleted,\
    \ and onError cases and returns an Observer instance. These three\nfunctions are\
    \ optional, and you can decide which one to include. For example,\nif we are subscribing\
    \ to an infinite sequence like clicks on a button (the\nuser could keep clicking\
    \ forever), the onCompleted handler will never be called.\nIf we're confident\
    \ that the sequence can't error (for example, by making an\nObservable from an\
