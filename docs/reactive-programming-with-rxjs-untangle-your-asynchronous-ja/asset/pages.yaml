- img_proc: true
  md: 'The range operator generates finite Observables that emit integers in a particular
    range. It is extremely versatile and can be used in many scenarios. For example,
    you could use range to generate the initial squares on the board of a game like
    Minesweeper.


    +   - Rx.Observable.interval


    Default behavior: *Asynchronous*


    Each time you need to generate values spaced in time, you''ll probably start with
    an interval operator as the generator. Since it emits sequential integers every
    x milliseconds (where x is a parameter we pass), we just need to transform the
    values to whatever we want. Our game in Chapter 3, *Building Concurrent Programs*,
    on page 39, is heavily based on that technique.


    +   - Rx.Observable.distinct


    Default behavior: *Same as the Observable it filters*


    distinct is one of these extremely simple operators that saves a ton of development
    work. It filters out of the sequence any value that has already been emitted.
    That keeps us from writing time and again that error-prone boilerplate code that
    uses a dictionary somewhere with the emitted results, against which we compare
    incoming results. You know what kind of code I''m talking about. Yuck. That''s
    gone with distinct.


    ![](img/0247a79f7325c8a55ebc84ba4fc3e6f2_56_0.png)


    distinct lets us use a function that specifies the comparison method. Additionally,
    we can pass no arguments and it will use strict comparison to compare primitives
    such as numbers or strings, and run deep comparisons in case of more complex objects.'
