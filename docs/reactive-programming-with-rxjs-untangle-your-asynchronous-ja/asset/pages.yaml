    With this we finally have a sidebar with relevant, geolocated tweets that can
    give us more insight about the areas affected by the earthquakes.


    # Ideas for Improvements


    This dashboard is already functional, but there are many improvements that could
    be done. Some ideas to make it better:


    +   * Add earthquake databases. USGS is a fantastic resource, but it mainly provides
    earthquakes happening in the United States. It would be interesting to merge in
    earthquake reports from around the world, not just the United States, and present
    them all together in the map. To do this, you could use the help of merge and
    mergeAll, and use distinct with a selector function to user duplicates.


    +   * Whenever the user clicks on a tweet, center the map on the related earthquake.
    This would involve grouping the tweets by earthquake on the server, and you''d
    probably want to use the groupBy operator to group tweets to a particular geographical
    area.


    # Wrapping Up


    In this chapter we''ve used RxJS to create a reactive user interface that allows
    us to see different kinds of data about earthquakes happening on the planet in
    real time. We''ve used RxJS both in the browser client and in the Node.js server,
    showing how easy it is to use Observables to manage different areas of an application.


    More importantly, we''ve seen that we can use RxJS in the same way on the client
    and on the server, bringing the Observable sequence abstraction everywhere in
