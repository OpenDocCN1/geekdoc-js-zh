  md: "# Cycle.js Drivers\n\nCycle.js drivers are functions we use to cause side effects.\
    \ Nowhere else in our programs should we be modifying state in any way. Drivers\
    \ take an Observable that emits data from our application, and they return another\
    \ Observable that causes the side effects.\n\nWe won't be creating drivers very\
    \ often—only when we need side effects like modifying the DOM, reading and writing\
    \ from other interfaces (for example, Local Storage), or making requests. In most\
    \ applications we'll need only the DOM driver (which renders web pages) and the\
    \ HTTP driver (which we can use to make HTTP requests). In this example, we'll\
    \ use yet another one, the JSONP driver.\n\n# The User Interface\n\nWe need actual\
    \ content for our page, not just a span. Let's make a function that creates the\
    \ virtual tree that represents our page:\n\n```\ncycle/index.js\nfunction vtreeElements(results)\
    \ {\n  var h = CycleDOM.h;\n  return h('div', [\n    h('h1', 'Wikipedia Search'),\n\
    \    h('input', {className: 'search-field', attributes: {type: 'text'}}),\n  \
    \  h('hr'),\n    h('div', results.map(function(result) {\n      return h('div',\
    \ [\n        h('a', { href: WIKI_URL + result.title }, result.title)\n      ]);\n\
    \    }))\n  ]);\n}\n```\n\nThis function might look a bit strange, but don't panic.\
    \ It is using Virtual Hyperscript, a domain-specific language for creating virtual\
    \ DOM trees. Virtual Hyperscript contains a single method, called h. h declares\
    \ nodes in a way similar to how HTML does, but using JavaScript. We can add attributes\
    \ to elements or append children to them by passing extra objects or arrays as\
    \ parameters to h. The resulting virtual tree will eventually be rendered into\
    \ real browser DOM.\n\nvtreeElements takes an array of objects, results, and returns\
    \ a virtual tree that represents the simple UI for our app. an input field and\
    \ a listing of links from the objects in results, which will eventually contain\
    \ Wikipedia's search results. We'll use vtreeElements to render our application."
  merge: -1
