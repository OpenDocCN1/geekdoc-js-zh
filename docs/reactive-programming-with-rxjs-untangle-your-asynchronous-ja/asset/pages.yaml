  md: "# Chapter 3. Building Concurrent Programs • 48\n\ncausing another network request.\
    \ We can use AsyncSubject whenever we expect a single result and want to hold\
    \ onto it.\n\n```\nJoe asks:\nDoes That Mean AsyncSubject Acts Like a Promise?\n\
    ```\n\nIndeed.\nAsyncSubject represents the result of an asynchronous action,\
    \ and you can use it as a substitute for a promise. The difference internally\
    \ is that a promise will only ever process a single value, whereas AsyncSubject\
    \ processes all values in a sequence, only ever emitting (and caching) the last\
    \ one.\nBeing able to easily simulate promises shows the flexibility of the RxJS\
    \ model. (Even without AsyncSubject, it would be pretty easy to simulate a promise\
    \ using Observables.)\n\n# BehaviorSubject\n\nWhen an Observer subscribes to a\
    \ BehaviorSubject, it receives the last emitted value and then all the subsequent\
    \ values. BehaviorSubject requires that we provide a starting value, so that all\
    \ Observers will always receive a value when they subscribe to a BehaviorSubject.\n\
    Imagine we want to retrieve a remote file and print its contents on an HTML page,\
    \ but we place placeholder text while we wait for the contents. We use BehaviorSubject\
    \ for this:\n\n```\nspaceship_reactive/behavior_subject.js\\var subject = new\
    \ Rx.BehaviorSubject('Waiting for content');\nsubject.subscribe({\n  function(result)\
