  md: '# Adding Interaction


    We have earthquakes on the map and in a list, but no interaction between both
    representations yet. It would be nice, for example, to center an earthquake on
    the map whenever we click it on the list, and to highlight an earthquake with
    a circle on the map when we move the mouse over its row. Let''s get to it.


    In Leaflet, you can draw a map and put drawings in their own layers so you can
    manipulate them individually. Let''s create a group of layers called quakeLayer
    where we''ll store all the earthquake circles. Each circle will be a layer inside
    the group. We''ll also create an objectLayers where we''ll store the correlation
    between an earthquake code and the internal layer ID, so that we can refer to
    them by the earthquake ID:


    ```

    examples_earthquake_ui/code3.js

    var codeLayers = {};nvar quakeLayer = L.layerGroup([]).addTo(map);

    ```


    And now in the subscription for the quakes Observable initialize, we''ll add each
    circle to the layer group and store its ID in codeLayers. It seems a bit intricate,
    it''s because the only way Leaflet allows us to refer to drawings in a map.


    ```

    examples_earthquake_ui/code3.js

    quakes.subscribe(function(quake) {

    var coords = quake.geometry.coordinates;

    var size = quake.properties.mag * 10000;

    var circle = L.circle([coords[1],coords[0]], size).addTo(map);

    quakeLayer.addLayer(circle);

    codeLayers[quake.id] = quakeLayer.getLayer(circle);

    });

    ```


    Let''s now create the hovering effect. We''ll write a new function, isHovering,
    which returns a Boolean value for whether the mouse is over a particular earthquake
    circle at any given moment:


    ```

    examples_earthquake_ui/code3.js

    var identity = Rx.helpers.identity;

    function isHovering(element) {

    var over = Rx.DOM.mouseover(element).map(identity(true));

    var out = Rx.DOM.mouseout(element).map(identity(false));

    return over.merge(out);

    }

    ```'
  merge: -1
  pgno: 97
