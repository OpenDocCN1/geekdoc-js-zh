  md: "# Chapter 3. Building Concurrent Programs • 44\n\n```\n}}\n.filter(function(str)\
    \ {\n  return /^[A-Z]+$/.test(str);\n}}\n.subscribe(function(str) {\n  console.log(str);\n\
    }}\n```\n\nObservable pipelines look extremely similar to array chains, but their\
    \ similarities end here. In an Observable, nothing ever happens until we subscribe\
    \ to it, no matter how many queries and transformations we apply to. When we chain\
    \ a transformation like map, we're composing a single function that will operate\
    \ on every item of the array once. So, in the preceding code, this is what will\
    \ happen:\n\n+   Create an uppercase function that will be applied to each item\
    \ of the Observable and return an Observable that will emit these new items, whenever\
    \ an Observer subscribes to it.\n\n+   Compose a filter function with the previous\
    \ uppercase function, and return an Observable that will emit the new items, uppercased\
    \ and filtered, but only when an Observable is subscribed to it.\n\n+   Trigger\
    \ the Observable to emit items, going through all of them only once and applying\
    \ the transformations we defined once per item.\n\nWith Observables, we'll go\
    \ through our list only once, and we'll apply the transformations only if absolutely\
    \ required. For example, let's say we added a take operator to our previous example:\n\
    \n```\nspaceship_reactive/array_chain.js\n\nstringObservable\n.map(function(str)\
    \ {\n  return str.toUpperCase();\n}}\n.filter(function(str) {\n  return /^[A-Z]+$/.test(str);\n\
    }}\n.take(5)\n.subscribe(function(str) {\n  console.log(str);\n});\n```\n\ntake\
    \ makes the Observable emit only the first n items we specify. In our case, n\
    \ is five, so out of the thousand strings, we'll receive only the first. The cool\
    \ part is that our code will never traverse all the items; it will apply our transformations\
    \ to only the first five."
