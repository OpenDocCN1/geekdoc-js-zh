  md: '# Ideas for Improvements


    I''m sure you already have some ideas for making the game even more exciting,
    but let me propose some improvements that will make the game better and sharpen
    your RxJS skills at the same time:


    +   - Add a second (or third!) star field that moves at a different speed to create
    a parallax effect. This could be done in several ways. Try to reuse existing code
    and to do it as declaratively as you can.

    - Make more unpredictable enemies by making them fire at random intervals instead
    of the one specified in ENEMY_SHOOTING_FREQ. Extra points if you can make them
    fire more quickly as the player''s score gets higher!

    - Allow the player to get more points by hitting several enemies in a short amount
    of time.


    # Wrapping Up


    We''ve built an entire game for the browser using only Observables, and along
    the way we''ve seen several extremely convenient methods to handle concurrency
    and to compose and transform Observables. This is one of the strengths of RxJS;
    there is always a method to help with the problem you''re trying to tackle. Feel
    free to explore them in the RxJS documentation.¹


    Reactive programming makes it easy to write concurrent programs. The Observable
    abstraction and the powerful RxJS methods make it natural for different parts
    of a program to interact efficiently. Programming without relying on external
    state might take some getting used to, but it has enormous benefits. We can encapsulate
    entire behaviors in a single Observable pipeline, making our program more solid
    and reliable.


    In the next chapter we''ll pick up our earthquake visualizer application where
    we left it and add a Node.js server part that shows tweets related to the earthquakes.
    We''ll also improve its user interface to make it look like a real earthquake
    dashboard.


    > ¹ https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/core/observable.md'
