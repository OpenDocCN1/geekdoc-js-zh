  md: "# Revising Our main Function\n\nYou may have noticed the code on page 106 that\
    \ the main function takes a parameter, responses, that we're not using. These\
    \ are the responses that come from drivers in the run function. The drivers and\
    \ the main function form a cycle (hence the name of the framework): the output\
    \ of main is the input of the drivers, and the output of the drivers is the input\
    \ for main. And remember, input and outputs are always Observables.\n\nWe use\
    \ JSONP to query Wikipedia, as we did in Chapter 2. We use JSONP instead of HTTP\
    \ to make it easier to run this example on our local computers, retrieving data\
    \ from a different domain using HTTP causes some browsers to block these requests\
    \ for security reasons. In almost any other situation, especially in production\
    \ code, use HTTP to retrieve remote data.\n\nIn any case, using JSONP doesn't\
    \ affect the point of this chapter. Cycle has an experimental module for JSONP,\
    \ and we can install it using npm:\n\n```\nnpm install @cycle/json\n```\n\nThen\
    \ we use it in application like this:\n\n```\ncycle/step2.js\\var Cycle = require('@cycle/core');\n\
    var CycleDOM = require('@cycle/dom');\nvar CycleJSONP = require('@cycle/json');\n\
    var Rx = Cycle.Rx;\nvar h = CycleDOM.h;\nfunction searchQuery(responses) {\n \
    \ return responses.select('.search-field').events('input')\n    .debounce(300)\n\
    \    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search\
    \ });\n}\nfunction treeElements(results) {\n  return h('div', {\n    h('h1', 'Wikipedia\
    \ Search '),\n    h('input', {className:'search-field', attributes: {type: 'text'}}),\\\
    n    h('hr'),\n    h('div', results.map(function(result) {\n      return h('div',\
    \ {\n        h('a', { href: API_URL + result.title }, result.title)\n      });\n\
    \    }));\n  });\n}\n```"
