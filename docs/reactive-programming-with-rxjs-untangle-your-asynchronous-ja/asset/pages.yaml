  md: "# Chapter 3. Building Concurrent Programs * 46\n\nNext we make the Subject\
    \ emit values of its own (message and message). In the final result, we get the\
    \ Subject's own messages and then the proxied values from the source Observable.\
    \ The values from the Observable come later because they are asynchronous, whereas\
    \ we made the Subject's own values immediate. Notice that if we tell the source\
    \ Observable to take the first five values, the output shows only the first three.\
    \ That's because after one second we call onCompleted on the Subject. This finishes\
    \ the notifications to all subscriptions and overrides the take operator in this\
    \ case.\n\nThe Subject class provides the base for creating some specialized Subjects.\
    \ In fact, AsyncSubject, RxJS comes with some interesting ones: AsyncSubject,\
    \ ReplaySubject, and BehaviorSubject.\n\n# AsyncSubject\n\nAsyncSubject emits\
    \ the last value of a sequence only if the sequence completes. This value is cached\
    \ forever, and any Observer that subscribes after the value has been emitted will\
    \ receive it right away. AsyncSubject is convenient for asynchronous operations\
    \ that return a single value, such as Ajax requests.\n\nLet's see a simple example\
    \ of an AsyncSubject subscribing to a range:\n\n```\nspaceship_reactive/subjects.js\n\
