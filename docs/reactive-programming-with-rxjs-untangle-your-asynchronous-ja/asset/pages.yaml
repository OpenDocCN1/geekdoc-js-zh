  md: "# Chapter 6. Reactive Web Applications with Cycle.js • 106\n\nRxJS already\
    \ makes retrieving and processing the remote data easy, but as you saw in Chapter\
    \ 4, Building a Complete Web Application, on page 69, still need to jump through\
    \ some hoops to make our DOM operations efficient.\n\nOne of the objectives of\
    \ Cycle.js is to completely eliminate DOM manipulation from our code. Let's start\
    \ with some basic scaffolding:\n\ncycle/step1.js\n\n```\nvar Cycle = require('@cycle/core');\n\
    var CycleDOM = require('@cycle/dom');\nvar Rx = Cycle.Rx;\n\nfunction main(responses)\
    \ {\n  return {\n    DOM: Rx.Observable.just(CycleDOM.h('span', 'Hi there!'))\n\
    \  };\n}\nvar drivers = {\n  DOM: CycleDOM.makeDOM('#container')\n};\n```\n\n\
    +   - Cycle.run(main, drivers);\n\nThis code shows the text *Hi there!* onscreen,\
    \ but there's already quite a lot going on. The important parts are the main function\
    \ and the drivers object. Let's go through the steps:\n\n+   - We require Cycle\
    \ Core and the Cycle DOM driver. I'll explain what a Cycle.js driver is in the\
    \ next section.\n\n+   - The main function is always the entry point for our application.\
    \ It returns a collection of Observables, for each driver in the application.\
    \ So far we're only using one driver: the *DOM driver*.\n\n+   - The Observable\
    \ for the DOM driver emits a virtual tree, which we create using the `h` method\
    \ in the Cycle DOM library. In this case, we create only a single `span` element\
    \ with the text 'Hi there!'. The DOM driver consumes that virtual tree and renders\
    \ the actual DOM on the page from.\n\n+   - We create a DOM driver that will build\
    \ the DOM tree from the items emitted by the main function. The DOM tree will\
    \ be built in the element or selector that we pass as a parameter. In this case,\
    \ #container.\n\n+   - The Cycle.run connects the main function with the drivers\
    \ object, creating a circular flow between the two."
