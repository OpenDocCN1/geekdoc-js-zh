  md: '# Bending Time with Schedulers


    As soon as I discovered RxJS, I started using it in my projects. For a while thought
    I knew how to use it effectively, but there was a nagging question: how I know
    whether the operator is synchronous or asynchronous? In other words, when exactly
    do operators emit notifications? This seemed a crucial part of using RxJS correctly,
    but it felt a bit blurry to me.


    The interval operator, I thought, is clearly asynchronous, so it must use something
    like setTimeout internally to emit items. But what if I''m using range? Does it
    emit asynchronously as well? Does it block the loop? What about from? I was using
    these operators everywhere, but I didn''t know much about their internal concurrency
    model.


    Then I learned about Schedulers.


    Schedulers are a powerful mechanism to precisely manage concurrency in your applications.
    They give you fine-grained control over how Observable emits notifications by
    allowing you to change their concurrency model as you go. In this chapter you
    will learn how to use Schedulers and apply them in common scenarios. We''ll focus
    on testing, where Schedulers are especially useful, and you''ll learn how to make
    your own Schedulers.


    # Using Schedulers


    A Scheduler is a mechanism to “schedule” an action to happen in the future. Each
    operator in RxJS uses one Scheduler internally, selected to provide the best performance
    in the most likely scenario.


    Let''s see how we can change the Scheduler in operators and the consequences of
    doing so. First let''s create an array with 1,000 integers in it:'
