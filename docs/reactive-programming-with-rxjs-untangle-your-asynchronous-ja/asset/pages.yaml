    \ a new value. We can use this to our advantage. Whenever the mouse moves, combineLatest\
    \ emits the new SpaceShip position and the last emitted value of playerFiring,\
    \ which will be unchanged unless we free a new shot. We can then emit a value\
    \ only when the emitted shot is different from the previous one. The distinctUntilChanged\
    \ operator does the dirty work for us.\n\nThe operators distinct and distinctUntilChanged\
    \ allow us to filter out results that an Observable has already emitted. distinct\
    \ filters out any result previously emitted and distinctUntilChanged filters out\
    \ identical results unless a different one is emitted between. We only need to\
    \ make sure that the new shot is different from the previous one, so distinctUntilChanged\
    \ is enough for us. (It also saves us from the higher memory usage of distinct;\
    \ distinct needs to keep all the previous results in memory.)\n\nWe modify HeroShots\
    \ so it only emits new shots, based on their timestamp:\n\n```\nspaceship_reactive/Hero_shots2.js\n\
    var HeroShots = Rx.Observable\n  .combineLatest(\n    playerFiring,\n    SpaceShip,\n\
    \    function(shotEvents, spaceShip) {\n    return {\n      timestamp: shotEvents.timestamp,\n\
    \      x: spaceShip.x\n    }\n  })\n  .distinctUntilChanged(function(shot) { return\
    \ shot.timestamp; })\n  .scan(function(shotArray, shot) {\n    shotArray.push({x:shot.x,\
    \ y: HERO_Y});\n    return shotArray;\n}, []);\n```\n\nIf everything goes well,\
    \ we're now able to shoot at enemies from our spaceship!\n\n# Enemy Shots\n\n\
    We should allow enemies to shoot as well; otherwise it's a pretty unfair universe.\
    \ And a boring one! For enemy shots, we'll do the following:\n\n+   - Each enemy\
    \ will keep an updated array of its own shots."
