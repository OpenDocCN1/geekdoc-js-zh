    \ });\n}\n```\n\nFirst we declare some URLs our application will use to query\
    \ Wikipedia. In\nt function searchRequest we take a responses object that contains\
    \ all the\ndrivers in our application, and we use the method in the DOM driver.\n\
    select(element).event(type) behaves similarly to fromEvent: it takes a selector\
    \ for a\nDOM element and the function of event to listen to and returns an Observable\n\
    that emits events.\n\nFrom that moment on, the rest of the code should look pretty\
    \ familiar to you,\nsince it consists of transforming an Observable's values through\
    \ our usual\noperators:\n\n+   - Throttle to receive one every 300 milliseconds\
    \ at most.\n\n+   - Extract the value of the input box.\n\n+   - Append the final\
