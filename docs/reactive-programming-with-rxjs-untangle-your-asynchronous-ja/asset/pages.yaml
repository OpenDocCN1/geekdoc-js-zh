  md: "# Chapter 2. Deep in the Sequence • 22\n\nWhen the sequence ends, reduce will\
    \ call next with the object containing the final sum and the final count. At that\
    \ point we use map to return the result of dividing the sum by the count.\n\n\
    # // Joe asks:\nCan We Aggregate Infinite Observables?\n\nImagine we're writing\
    \ a program that gives users their average speed while they walk. Even if the\
    \ user hasn't finished walking, we need to be able to make a calculation using\
    \ the speed values we know so far. We need to log the average of an infinite sequence\
    \ in real time. The problem is that if the sequence never ends, an aggregate operator\
    \ like reduce will never call its Observers' next operator.\n\nLikely for us,\
    \ RxJS team has thought of this scenario and provided us with the scan operator,\
    \ which acts like reduce but emits each intermediate result:\n\n```\nvar avg =\
    \ Observable.interval(1000)\nscan(function (prev, cur) {\n  return {\n    sum:\
    \ prev.sum + cur,\n    count: prev.count + 1\n  };\n}, { sum: 0, count: 0 })\n\
    .map(function(o) {\n  return o.sum / o.count;\n});\n\nvar subscription = avg.subscribe(function\
    \ (x) {\n  console.log(x);\n});\n```\n\nBy this way, we can aggregate sequences\
    \ that take a long time to complete or that are infinite. In the preceding example,\
    \ we generated an incremental integer every second and substituted the previous\
    \ reduce call for scan. We now get the average of the values generated so far,\
    \ every second.\n\n# flatMap\n\nWhat can you do if you have an Observable whose\
    \ results are more Observables? Most of the time you'd want to unify items in\
    \ those nested Observables in a single sequence. That's exactly what flatMap does.\n\
    \nThe flatMap operator takes an Observable A whose elements are also Observables,\
    \ and returns an Observable with the flattened values of A's child Observables.\
    \ Let's visualize it with a graph:"
