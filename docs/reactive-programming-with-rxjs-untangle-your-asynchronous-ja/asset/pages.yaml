  md: "# Chapter 3. Building Concurrent Programs • 56\n\nto the spaceship, we can't\
    \ render the spaceship in the starStream subscription.\nWe could save the latest\
    \ spaceship coordinates to a variable that the starStream can access, but then\
    \ we would be breaking our rule of not modifying external state. What to do?\n\
    \nAs is usually the case. RxJS has a very convenient operator we can use to solve\
    \ our problem.\n\nRx.Observable.combineLatest is a handy operator. It takes two\
    \ or more Observables and emits the last result of each Observable whenever any\
    \ of them emits a new value. Knowing that starStream emits new item (the array\
    \ of stars) frequently, we can remove the starStream subscription and use combineLatest\
    \ to combine both the starStream and SpaceShip Observables and update them as\
    \ soon as any of them emit a new item:\n\nspaceship_reactive/hero.js\n\n```\n\
    function renderScene(actors) {\n  paintStars(actors.stars);\n  paintSpaceShip(actors.spaceship.x,\
    \ actors.spaceship.y);\n}\n\nvar Game = Rx.Observable\n  .combineLatest(\n   \
    \ StarStream, SpaceShip,\n    function(stars, spaceship) {\n      return { stars:\
    \ stars, spaceship: spaceship };\n    });\n```\n\nGame.subscribe(renderScene);\n\
    \nWe're now using a function renderScene to paint everything on the screen, you\
    \ can remove the following subscription code for StarStream:\n\n```\n.subscribe(function(starArray)\
    \ {\n  paintStars(starArray);\n});\n```\n\nWith this, we'll paint the starry background\
    \ every time any Observable emits a new item. We now have a spaceship flying through\
