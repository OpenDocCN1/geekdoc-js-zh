    \ Sharing\n- Mobile-friendly Responsive Design\n- Easy to Customize with Themes\
    \ and Plugins\n- Integrates with Your SSO and IT Infrastructure\n- Choose Cloud-based\
    \ or On-premise Hosting\n\n[Watch Video](#) | [Free Demo](#) | [Pricing](#)\n\n\
    ## HTML5 Web Workers\n\n### Multithreaded JavaScript for High-Performance Web\
    \ Apps\n\nBy: Gerard Gallant\n\n- Contents Include:\n- Creating Workers\n- Within\
    \ a Worker\n- Error Handling\n- Passing Messages to a Worker\n- Receiving Messages\n\
    - Additional Resources... and More!\n\n### INTRODUCTION\n\nPrior to HTML5 Web\
    \ Workers, all JavaScript code would run in the same thread as the user interface\
    \ of the browser window.\n\nThe result was that all long-running scripts would\
    \ cause the browser window to become unresponsive to user input until the processing\
    \ finished. If the script took long enough, the browser would even prompt the\
    \ user to see if they wanted to stop the unresponsive script.\n\nWeb Workers came\
    \ to the rescue by allowing JavaScript code to run in a separate thread from the\
    \ browser window's UI thread. This allows long-running scripts to do their processing\
    \ without interfering with the responsiveness of the browser's UI (the user can\
    \ still click on buttons and scroll content for example).\n\nA couple of things\
    \ to be aware of with Web Workers is that, because they are running in a separate\
    \ thread from the UI, the worker threads have no access to the DOM or other UI\
    \ functionality. In addition, Web Workers are not intended to be used in large\
    \ numbers and are expected to be long-lived since they have a high start-up performance\
    \ cost and high memory cost per worker instance.\n\n### Types of Workers\n\nThere\
    \ are two types of workers available: dedicated workers and shared workers.\n\n\
    Dedicated workers are linked to their creator and are a bit simpler to work with\
    \ than shared workers.\n\nShared workers, on the other hand, allow any script\
    \ from the same origin/domain to obtain a reference to the worker and communicate\
    \ with it.\n\nSince worker threads take time to start initially and use a lot\
    \ of memory per worker, being able to share a single worker rather than creating\
    \ one for each open window can improve performance.\n\nThe trade off, however,\
    \ is that shared workers are a bit more involved to set up and work with than\
    \ dedicated workers.\n\n### Shared Worker Scope\n\nYou may be curious about what\
    \ happens when the window that created a shared worker is closed. Is the worker\
    \ thread still accessible by other windows from the same origin?\n\nA shared worker\
    \ will remain active as long as one window has a connection to it. For example:\n\
    \nWindow 1 creates a shared worker and Window 2 connects to it.\n\nLater, Window\
    \ 1 is closed but, because Window 2 is still connected, the shared worker thread\
    \ remains active even though Window 2 didn't originally create it.\n\n### Browser\
    \ Support\n\n[http://caniuse.com](http://caniuse.com): This handy website can\
    \ tell you if a feature is supported by a browser, and in which version of the\
    \ browser the desired feature became available. This can save considerable testing\
    \ time needed to determine if the desired feature is available in the browsers\
    \ you intend to support. The site is updated regularly.\n\nAt the time of this\
    \ article's writing, dedicated workers have the most browser support including:\n\
    \nInternet Explorer 10+, Firefox, Chrome, Safari, Opera, iOS Safari, BlackBerry,\
    \ Opera Mobile, Chrome for Android, and Firefox for Android.\n\nShared worker\
    \ support currently includes:\n\nChrome, Safari, Opera, iOS Safari, BlackBerry,\
    \ and Opera Mobile\n\n### CREATING WORKERS\n\n#### Test if the feature exists\n\
    \nUnless you know for certain that your users will be using a specific browser\
    \ version, there is a chance that your website will be accessed by a browser that\
    \ does not have the HTML5 feature you wish to use.\n\nIt is always best to test\
    \ if the browser supports the feature you intend to use before you try using the\
    \ feature.\n\nBoth dedicated and shared workers will exist as objects on the global\
    \ window object if the browser supports them.\n\nThe following is an example of\
    \ how you can test to see if the browser supports dedicated or shared workers:\n\
    \n```\nif (window.Worker) { /* Dedicated Workers are supported */ }\nif (window.SharedWorker)\
    \ { /* Shared Workers are supported */ }\n```\n\n#### Creating a Worker\n\nTo\
    \ create dedicated worker, you simply create a new instance of the Worker object\
    \ passing in a string that specifies the location of the JavaScript file that\
    \ contains the worker thread's main code.\n\nThe following is an example of how\
    \ a dedicated worker can be created:\n\n```\nvar aDedicatedWorker = new Worker(\"\
    DedicatedWorker.js\");\n```\n\n![](img/c87c2c7cc0fb6e0fcbc547fd91db34d3_1_0.png)\n\
    \nA shared worker is created the same way you create a dedicated worker with the\
    \ only change being that, rather than specifying a Worker object, we specify a\
    \ SharedWorker object:\n\n```\nvar aSharedWorker = new SharedWorker(\"SharedWorker.js\"\
    );\n```\n\nThe worker objects were designed to accept a string indicating the\
    \ location of the JavaScript file (rather than a function) in order to prevent\
    \ the creation of a closure that would allow the worker to gain direct access\
    \ to the browser's DOM or other page elements.\n\n### Receiving Messages from\
    \ a Worker\n\nCommunication between workers and the thread that created them is\
    \ accomplished by passing messages.\n\nSince several HTML5 technologies pass messages,\
    \ a separate specification exists that is specifically for messages called HTML5\
    \ Web Messaging. I mention this because certain details critical to how Web Workers\
    \ work are not found within the web worker specifications but rather within the\
    \ web messaging specifications.\n\nIn order to receive messages from a worker,\
    \ you need to attach to the onmessage event handler of the worker instance.\n\n\
    The following is an example of how you can set up an event listener for a dedicated\
    \ worker:\n\n```\naDedicatedWorker.onmessage = OnWorkerMessage;\n```\n\nSetting\
    \ up the event listener for a shared worker object is similar to the dedicated\
    \ worker but in this case you need to access the port object as in the following\
    \ example:\n\n```\naSharedWorker.port.onmessage = OnWorkerMessage;\n```\n\nFor\
    \ both dedicated and shared workers, you can also attach to the message event\
    \ handler event type by using the addEventListener method as in the following\
    \ example:\n\n```\naSharedWorker.port.addEventListener(\"message\", OnWorkerMessage,\
    \ false);\n```\n\nOne thing to be aware of if you use the addEventListener method\
    \ is that, for shared workers, you will also need to start the worker.\n\n```\n\
    aSharedWorker.port.start();\n```\n\nThe onmessage event listener method will be\
    \ passed by a MessageEvent parameter which will have a .data property containing\
    \ the message passed from the worker thread.\n\nThe following is our onmessage\
    \ event listener (there is no difference between dedicated and shared workers\
    \ here):\n\n```\nfunction OnWorkerMessage(evt){\n    alert(\"Message received\
    \ from the worker: \" + evt.data);\n}\n```\n\n### Passing Messages to a Worker\n\
    \nTo pass a message to a dedicated worker, you call the postMessage function of\
    \ the worker instance as in the following example:\n\n```\naDedicatedWorker.postMessage(\"\
    Hello from the UI thread!\");\n```\n\nPassing a message to a shared worker is\
    \ similar but in this case the postMessage function is found on the port object:\n\
    \n```\naSharedWorker.port.postMessage(\"Hello from the UI thread!\");\n```\n\n\
    The postMessage function is not limited to just passing strings between threads.\n\
    \nYou can also pass structured data like JSON objects, JavaScript objects like\
    \ numbers and Dates, as well as certain data objects like File Blob, FileList\
    \ and ArrayBuffer.\n\nThe following is an example of passing an object:\n\n```\n\
    var objData = {\n    \"employeeId\": 103,\n    \"name\": \"Sam Smith\",\n    \"\
    dateHired\": new Date(2006, 11, 15)\n};\naDedicatedWorker.postMessage(objData);\n\
    ```\n\nBecause the objects are passed between the two threads so seamlessly (we\
    \ pass the object in from one side and receive it on the other side without any\
    \ special work on our part), it feels like the data is passed directly but by\
    \ default that is not actually the case. By default, all data is actually copied\
    \ between the threads (also referred to as structured cloning).\n\nWhen you pass\
    \ data to another thread, behind the scenes the object is serialized into a string,\
    \ passed to the other thread, and then de-serialized back into an object on the\
    \ other side.\n\nFor the most part you probably won't notice too much of a performance\
    \ hit if you're just passing small amounts of data, but if you need to pass large\
    \ amounts of data, this cloning may result in noticeable delays.\n\nFortunately,\
    \ some browsers now support a concept called transferable objects where the ownership\
    \ of the data is transferred to the other thread. The data is moved rather than\
    \ copied, which can result in large performance improvements.\n\nWhen you transfer\
    \ an object like an ArrayBuffer to another thread, for example, the contents are\
    \ transferred to the other thread leaving an empty ArrayBuffer object in the calling\
    \ thread. To transfer an object to a thread you still use the postMessage method\
    \ but also include an array in the optional second parameter indicating which\
    \ items in the message should be transferred.\n\n> Hot Tip\n\nAt the time of this\
    \ writing, not all browsers support the second parameter of the postMessage method\
    \ and will actually throw an exception if you attempt to use the second parameter.\
    \ It is recommended that you use a try/catch statement around your postMessage\
    \ call if you wish to use this technique.\n\nIf you're passing in just the one\
    \ object, as in the following example, then you can specify the object itself\
    \ in the array.\n\n```\nvar abBuffer = new ArrayBuffer(32);\naDedicatedWorker.postMessage(abBuffer,\
    \ [abBuffer]);\n```\n\nNot all objects are transferable but, if the object you're\
    \ passing contains a transferable object, you can specify just the portion of\
    \ the object that you want to be transferred in the transfer parameter array as\
    \ in the following example:\n\n```\nvar objData = {\n    \"employeeId\": 103,\n\
    \    \"name\": \"Sam Smith\",\n    \"dateHired\": new Date(2006, 11, 15),\n  \
    \  \"abBuffer\": new ArrayBuffer(32)\n};\naDedicatedWorker.postMessage(objData,\
    \ [objData.abBuffer]);\n```\n\nIf the object you are passing to the other thread\
    \ contains multiple transferable objects, you can specify each item by comma separating\
    \ them in the transfer parameter array.\n\nNot all browsers support transferable\
    \ objects. The following example demonstrates a way to detect if a browser supports\
    \ transferable objects by actually trying to pass a small amount of data in an\
    \ ArrayBuffer to another thread. If the buffer's length is zero after the postMessage\
    \ call, then we know that the data was transferred rather than simply copied:"
  mdcn: "\n![](img/c87c2c7cc0fb6e0fcbc547fd91db34d3_0_0.png)\n\n## 收集、管理和分享您团队所需的所有答案\n\
    \n-  企业知识共享的问答软件\n-  移动友好的响应式设计\n-  易于通过主题和插件进行定制\n-  与您的单点登录和IT基础设施集成\n-  选择基于云的或本地托管\n\
    \n[观看视频](#) | [免费演示](#) | [定价](#)\n\n## HTML5 Web Workers\n\n### 用于高性能Web应用的多线程JavaScript\n\
    \n作者：Gerard Gallant\n\n-  内容包括：\n-  创建Workers\n-  在Worker内部\n-  错误处理\n-  向Worker传递消息\n\
    -  接收消息\n-  附加资源...等等！\n\n### 引言\n\n在HTML5 Web Workers出现之前，所有JavaScript代码都与浏览器窗口的用户界面运行在同一个线程中。\n\
    \n结果是，所有长时间运行的脚本都会导致浏览器窗口对用户输入无响应，直到处理完成。如果脚本运行时间足够长，浏览器甚至会提示用户是否要停止无响应的脚本。\n\n\
    Web Workers通过允许JavaScript代码在与浏览器窗口UI线程分开的线程中运行来解决这个问题。这使得长时间运行的脚本可以在不干扰浏览器UI响应性的情况下进行处理（例如，用户仍然可以点击按钮和滚动内容）。\n\
    \n关于Web Workers需要注意几点：由于它们运行在与UI分开的线程中，worker线程无法访问DOM或其他UI功能。此外，Web Workers并非设计为大量使用，并且预期是长期运行的，因为它们每个worker实例都有很高的启动性能成本和内存成本。\n\
    \n### Worker的类型\n\n有两种可用的worker类型：专用worker（dedicated workers）和共享worker（shared\
    \ workers）。\n\n专用worker与它们的创建者相关联，并且比共享worker稍微简单一些。\n\n另一方面，共享worker允许来自同一源/域的任何脚本获取对worker的引用并与之通信。\n\
    \n由于worker线程初始启动需要时间并且每个worker使用大量内存，能够共享单个worker而不是为每个打开的窗口创建一个worker可以提高性能。\n\
    \n然而，代价是共享worker的设置和使用比专用worker稍微复杂一些。\n\n### 共享Worker的作用域\n\n您可能想知道当创建共享worker的窗口被关闭时会发生什么。其他来自同一源的窗口是否仍然可以访问该worker线程？\n\
    \n只要有一个窗口与之保持连接，共享worker就会保持活动状态。例如：\n\n窗口1创建一个共享worker，窗口2连接到它。\n\n之后，窗口1被关闭，但是因为窗口2仍然连接着，共享worker线程即使没有被窗口2最初创建，也仍然保持活动状态。\n\
    \n### 浏览器支持\n\n[http://caniuse.com](http://caniuse.com)：这个方便的网站可以告诉您某个功能是否被浏览器支持，以及在哪个版本的浏览器中该所需功能变得可用。这可以节省确定所需功能在您打算支持的浏览器中是否可用所需的大量测试时间。该网站会定期更新。\n\
    \n在撰写本文时，专用worker获得了最多的浏览器支持，包括：\n\nInternet Explorer 10+、Firefox、Chrome、Safari、Opera、iOS\
    \ Safari、BlackBerry、Opera Mobile、Android版Chrome和Android版Firefox。\n\n共享worker支持目前包括：\n\
    \nChrome、Safari、Opera、iOS Safari、BlackBerry和Opera Mobile\n\n### 创建Workers\n\n\
    #### 测试功能是否存在\n\n除非您确定您的用户将使用特定的浏览器版本，否则您的网站有可能会被一个不支持您希望使用的HTML5功能的浏览器访问。\n\n\
    在尝试使用某个功能之前，最好先测试浏览器是否支持您打算使用的功能。\n\n如果浏览器支持，专用worker和共享worker都将作为对象存在于全局window对象上。\n\
    \n以下是测试浏览器是否支持专用或共享worker的示例：\n\n```\nif (window.Worker) { /* 支持专用Workers */ }\n\
    if (window.SharedWorker) { /* 支持共享Workers */ }\n```\n\n#### 创建一个Worker\n\n要创建专用worker，您只需创建一个新的Worker对象实例，并传入一个字符串，该字符串指定包含worker线程主要代码的JavaScript文件的位置。\n\
    \n以下是如何创建专用worker的示例：\n\n```\nvar aDedicatedWorker = new Worker(\"DedicatedWorker.js\"\
    );\n```\n\n![](img/c87c2c7cc0fb6e0fcbc547fd91db34d3_1_0.png)\n\n共享worker的创建方式与创建专用worker相同，唯一的区别在于，我们指定一个SharedWorker对象而不是Worker对象：\n\
    \n```\nvar aSharedWorker = new SharedWorker(\"SharedWorker.js\");\n```\n\nWorker对象被设计为接受一个指示JavaScript文件位置的字符串（而不是一个函数），以防止创建一个闭包，从而使worker能够直接访问浏览器的DOM或其他页面元素。\n\
    \n### 从Worker接收消息\n\nWorker与创建它们的线程之间的通信是通过传递消息来完成的。\n\n由于多种HTML5技术都传递消息，因此存在一个专门的规范，称为HTML5\
    \ Web Messaging。我提到这一点是因为，Web Workers工作方式的某些关键细节并不在web worker规范中，而是在web messaging规范中。\n\
    \n为了从worker接收消息，您需要附加到worker实例的onmessage事件处理程序。\n\n以下是如何为专用worker设置事件监听器的示例：\n\
    \n```\naDedicatedWorker.onmessage = OnWorkerMessage;\n```\n\n为共享worker对象设置事件监听器与专用worker类似，但在此情况下您需要访问port对象，如下例所示：\n\
    \n```\naSharedWorker.port.onmessage = OnWorkerMessage;\n```\n\n对于专用和共享worker，您也可以通过使用addEventListener方法附加到message事件处理程序事件类型，如下例所示：\n\
    \n```\naSharedWorker.port.addEventListener(\"message\", OnWorkerMessage, false);\n\
    ```\n\n如果您使用addEventListener方法，需要注意的一点是，对于共享worker，您还需要启动该worker。\n\n```\naSharedWorker.port.start();\n\
    ```\n\nonmessage事件监听器方法将被传递一个MessageEvent参数，该参数将有一个.data属性，其中包含从worker线程传递的消息。\n\
    \n以下是我们onmessage事件监听器的实现（在这里专用worker和共享worker没有区别）：\n\n```\nfunction OnWorkerMessage(evt){\n\
    \    alert(\"Message received from the worker: \" + evt.data);\n}\n```\n\n###\
    \ 向Worker传递消息\n\n要向专用worker传递消息，您可以调用worker实例的postMessage函数，如下例所示：\n\n```\naDedicatedWorker.postMessage(\"\
    Hello from the UI thread!\");\n```\n\n向共享worker传递消息类似，但在此情况下postMessage函数位于port对象上：\n\
    \n```\naSharedWorker.port.postMessage(\"Hello from the UI thread!\");\n```\n\n\
    postMessage函数不仅限于在线程之间传递字符串。\n\n您还可以传递结构化数据，如JSON对象、JavaScript对象（如数字和Date对象），以及某些数据对象，如File\
    \ Blob、FileList和ArrayBuffer。\n\n以下是传递一个对象的示例：\n\n```\nvar objData = {\n    \"\
    employeeId\": 103,\n    \"name\": \"Sam Smith\",\n    \"dateHired\": new Date(2006,\
    \ 11, 15)\n};\naDedicatedWorker.postMessage(objData);\n```\n\n因为对象在两个线程之间无缝传递（我们在一侧传入对象，在另一侧接收它，而无需我们做任何特殊工作），感觉数据是直接传递的，但实际上默认情况下并非如此。默认情况下，所有数据实际上都是在线程之间复制的（也称为结构化克隆）。\n\
    \n当您向另一个线程传递数据时，幕后对象被序列化为字符串，传递到另一个线程，然后在另一侧反序列化回对象。\n\n在大多数情况下，如果您只是传递少量数据，您可能不会注意到太大的性能影响，但如果您需要传递大量数据，这种克隆可能会导致明显的延迟。\n\
    \n幸运的是，一些浏览器现在支持一种称为可传输对象（transferable objects）的概念，其中数据的所有权被转移给另一个线程。数据是被移动而不是被复制，这可以带来巨大的性能提升。\n\
    \n例如，当您将像ArrayBuffer这样的对象传输到另一个线程时，内容被移动到另一个线程，在调用线程中留下一个空的ArrayBuffer对象。要将对象传输到线程，您仍然使用postMessage方法，但在可选的第二个参数中包含一个数组，指示消息中的哪些项目应该被传输。\n\
    \n> 实用提示\n\n在撰写本文时，并非所有浏览器都支持postMessage方法的第二个参数，如果您尝试使用第二个参数，实际上会抛出异常。如果您希望使用此技术，建议在postMessage调用周围使用try/catch语句。\n\
    \n如果您只传递一个对象，如下例所示，那么您可以在数组中指定该对象本身。\n\n```\nvar abBuffer = new ArrayBuffer(32);\n\
    aDedicatedWorker.postMessage(abBuffer, [abBuffer]);\n```\n\n并非所有对象都是可传输的，但如果您传递的对象包含一个可传输对象，您可以在传输参数数组中指定您希望传输的对象的哪一部分，如下例所示：\n\
    \n```\nvar objData = {\n    \"employeeId\": 103,\n    \"name\": \"Sam Smith\"\
    ,\n    \"dateHired\": new Date(2006, 11, 15),\n    \"abBuffer\": new ArrayBuffer(32)\n\
    };\naDedicatedWorker.postMessage(objData, [objData.abBuffer]);\n```\n\n如果您传递到另一个线程的对象包含多个可传输对象，您可以通过在传输参数数组中用逗号分隔来指定每个项目。\n\
    \n并非所有浏览器都支持可传输对象。以下示例展示了一种检测浏览器是否支持可传输对象的方法，即通过实际尝试将少量数据放在ArrayBuffer中传递到另一个线程。如果postMessage调用后buffer的长度为零，那么我们知道数据是被传输了，而不是仅仅被复制：\n"
