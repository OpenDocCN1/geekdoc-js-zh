  md: '# # HTML5 Web Workers


    # ## Multithreaded JavaScript for High-Performance Web Apps


    By: Gerard Gallant


    +   - Contents Include:

    - Creating Workers

    - Within a Worker

    - Error Handling

    - Passing Messages to a Worker

    - Receiving Messages

    - Additional Resources... and More!


    # ## INTRODUCTION


    Prior to HTML5 Web Workers, all JavaScript code would run in the same thread as
    the user interface of the browser window.


    The result was that all long-running scripts would cause the browser window to
    become unresponsive to user input until the processing finished. If the script
    took long enough, the browser would even prompt the user to see if they wanted
    to stop the unresponsive script.


    Web Workers came to the rescue by allowing JavaScript code to run in a separate
    thread from the browser window''s UI thread. This allows long-running scripts
    to do their processing without interfering with the responsiveness of the browser''s
    UI (the user can still click on buttons and scroll content for example).


    A couple of things to be aware of with Web Workers is that, because they are running
    in a separate thread from the UI, the worker threads have no access to the DOM
    or other UI functionality. In addition, Web Workers are not intended to be used
    in large numbers and are expected to be long-lived since they have a high start-up
    performance cost and high memory cost per worker instance.


    # ### Types of Workers


    There are two types of workers available: dedicated workers and shared workers.


    Dedicated workers are linked to their creator and are a bit simpler to work with
    than shared workers.


    Shared workers, on the other hand, allow any script from the same origin/domain
    to obtain a reference to the worker and communicate with it.


    Since worker threads take time to start initially and use a lot of memory per
    worker, being able to share a single worker rather than creating one for each
    open window can improve performance.


    The trade off, however, is that shared workers are a bit more involved to set
    up and work with than dedicated workers.


    # ### Shared Worker Scope


    You may be curious about what happens when the window that created a shared worker
    is closed. Is the worker thread still accessible by other windows from the same
    origin?


    A shared worker will remain active as long as one window has a connection to it.
    For example:


    Window 1 creates a shared worker and Window 2 connects to it.


    Later, Window 1 is closed but, because Window 2 is still connected, the shared
    worker thread remains active even though Window 2 didn''t originally create it.


    # ### Browser Support


    [http://caniuse.com](http://caniuse.com): This handy website can tell you if a
    feature is supported by a browser, and in which version of the browser the desired
    feature became available. This can save considerable testing time needed to determine
    if the desired feature is available in the browsers you intend to support. The
    site is updated regularly.


    At the time of this article''s writing, dedicated workers have the most browser
    support including:


    Internet Explorer 10+, Firefox, Chrome, Safari, Opera, iOS Safari, BlackBerry,
    Opera Mobile, Chrome for Android, and Firefox for Android.


    Shared worker support currently includes:


    Chrome, Safari, Opera, iOS Safari, BlackBerry, and Opera Mobile


    # ## CREATING WORKERS


    # ### Test if the feature exists


    Unless you know for certain that your users will be using a specific browser version,
    there is a chance that your website will be accessed by a browser that does not
    have the HTML5 feature you wish to use.


    It is always best to test if the browser supports the feature you intend to use
    before you try using the feature.


    Both dedicated and shared workers will exist as objects on the global window object
    if the browser supports them.


    The following is an example of how you can test to see if the browser supports
    dedicated or shared workers:


    ```

    if (window.Worker) { /* Dedicated Workers are supported */ }

    if (window.SharedWorker) { /* Shared Workers are supported */ }

    ```


    # ### Creating a Worker


    To create dedicated worker, you simply create a new instance of the Worker object
    passing in a string that specifies the location of the JavaScript file that contains
    the worker thread''s main code.


    The following is an example of how a dedicated worker can be created:


    ```

    var aDedicatedWorker = new Worker("DedicatedWorker.js");

    ```


    ![](img/c87c2c7cc0fb6e0fcbc547fd91db34d3_1_0.png)'
