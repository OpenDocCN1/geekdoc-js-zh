  md: 'For more information about **HTML5 Web Messaging**, which is the technology
    used to pass messages to and receive messages from Web Workers: [http://www.w3.org/TR/webmessaging/](http://www.w3.org/TR/webmessaging/)
    Check [http://caniuse.com/](http://caniuse.com/) for detailed breakdown of current
    browser support.


    Because both specs and browsers are developing so quickly, it''s especially good
    in this case to know the spec itself pretty well. Tutorials and step-by-step howto
    guides can become out of date, but the basic principles behind Web Workers are
    pretty solid. As a general rule, applicable to HTML5 technologies including but
    not limited to Web Workers, try to cross-reference the spec against any howto
    guides or code snippets you find -- and be especially conscious of writing good
    test code. The web is replete with HTML5 developer sites but, I have found that
    the following sites stand out and are very helpful in understanding some of the
    details of the various technologies:


    +   - HTML5 Zone: [www.DZone.com/mz/html5](http://www.DZone.com/mz/html5)

    - Mozilla Developer Network: [https://developer.mozilla.org/en-US/docs/HTML/HTML5](https://developer.mozilla.org/en-US/docs/HTML/HTML5)

    - HTML5 Rocks: [www.html5rocks.com](http://www.html5rocks.com)


    # ABOUT THE AUTHORS


    Gerard Gallant is a Senior Software Developer / Software Architect with Dovico
    Software. For over a decade, he has played a major role in developing most software
    products released by Dovico ranging from the creation of the Microsoft Project
    link ActiveX control to the creation of the new Hosted Services API. He is married
    with two beautiful and smart girls. He unwinds by shooting hoops or watching a
    movie and also enjoys traveling extensively. Recent publications can be found
    on his blog: [http://cggallant.blogspot.ca/](http://cggallant.blogspot.ca/)


    # RECOMMENDED BOOK


    Web apps would run much better if heavy calculations could be performed in the
    background, rather than compete with the user interface. With this book, you''ll
    learn how to use Web Workers to run computationally intensive JavaScript code
    in a thread parallel to the UI. Yes, multi-threaded programming is complicated,
    but Web Workers provide a simple API that helps you be productive without the
    complex algorithms.


