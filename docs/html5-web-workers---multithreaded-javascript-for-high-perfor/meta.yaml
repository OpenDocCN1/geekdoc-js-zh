    工作线程有权访问一个 importScripts 函数，该函数允许线程引入所有必要的 JavaScript 文件。\n\nimportScripts 函数可用于导入一个或多个文件。如果指定了多个文件，它们将并行下载，但将按指定的顺序同步加载和处理。\n\
    \n此外，importScripts 文件在所有指定的文件加载和处理完毕之前不会返回。\n\n以下是使用 importScripts 将 3 个 JavaScript\
    \ 文件导入工作线程的示例（此示例到 3 个文件为止，但你可以指定任意数量的文件）：\n\n```\nimportScripts(\"file1.js\"\
    , \"file2.js\", \"file3.js\");\n```\n\n### 接收消息\n\n为了使专用工作线程能够从其创建者接收消息，它必须附加到\
    \ onmessage 事件，如下例所示：\n\n```\nself.onmessage = function(evt) {\n    // 来自调用线程的数据可以在参数的\
    \ .data 属性中找到\n}\n```\n\n在共享工作线程中，你需要处理 onconnect 事件，该事件在每次有线程连接到共享工作线程时触发。\n\n\
    在 onconnect 事件监听器中，你可以附加到 ports 数组中第一个端口对象的 onmessage 事件（数组中永远只有一个端口）：\n\n```\n\
    self.onconnect = function(evt) {\n    evt.ports[0].onmessage = function(evtMessage)\
    \ {\n        // 来自调用线程的数据可以在参数的 .data 属性中找到。\n\n        // 调用线程的端口可以在参数的 .target\
    \ 属性中找到\n    }\n}\n```\n\n### 传递消息\n\n专用工作线程能够通过 postMessage 函数向其创建者传递消息：\n\n\
    ```\nself.postMessage(\"Hello from the dedicated worker\");\n```\n\n从共享工作线程出发，为了向已连接的线程传递消息，你需要使用你希望发送消息给的那个已连接线程的端口上的\
    \ postMessage 事件。\n\n有几种方法可以获取端口对象。一种选项是在 onconnect 事件处理程序中创建一个全局数组来保存每个已连接的端口。\n\
    \n另一种获取端口对象的选项是访问 onmessage 事件对象的 target 属性，该属性保存对调用线程端口的引用，如下例所示：\n\n```\nevt.target.postMessage(\"\
    Hello from the shared worker\");\n```\n\n### 超时\n\n工作线程支持超时（setTimeout、clearTimeout、setInterval\
    \ 和 clearInterval），如果你只想在设定的时间间隔而不是持续处理时进行处理，这非常有用。\n\n一个场景可能是你想检查第三方服务器是否有新信息，但又不想用请求轰炸该网站。你可以设置一个超时，每隔\
    \ 5 分钟左右检查一次是否有新信息。\n\n### XMLHttpRequest\n\n在工作线程内部，可以发起 XMLHttpRequest，由于工作线程与浏览器窗口的\
    \ UI 线程分离，不会影响性能，因此由你决定是同步还是异步发起请求。\n\n然而，需要注意的一点是，在工作线程内部，XMLHttpRequest 对象将仅通过\
    \ responseText 属性返回数据（当 XMLHttpRequest 对象在工作线程中使用时，responseXML 属性始终返回 null）。\n\
    \n以下是在工作线程内部使用 XMLHttpRequest 对象的示例：\n\n```\n// 我们要发送给服务器端代码的数据\nvar objData =\
    \ { \"sPageIndex\": iPage };\n\n// 向服务器发起同步调用\nvar xhrRequest = new XMLHttpRequest();\n\
    xhrRequest.open(\"POST\", \"/main.aspx/GetNextPage\", false);\nxhrRequest.setRequestHeader(\"\
    Content-Type\", \"application/json\");\nxhrRequest.send(JSON.stringify(objData));\n\
    \n// 将响应返回给 UI 线程\nself.postMessage(xhrRequest.responseText);\n```\n\n### location\n\
    \n工作线程有权访问一个 location 对象，该对象表示线程创建时设置的绝对 URI。\n\n可用的 location 属性有：href、protocol、host、hostname、port、pathname、search\
    \ 和 hash。\n\n### navigator\n\nnavigator 对象在工作线程内可用，提供有关浏览器的一些详细信息。\n\n一些可用的属性是：appName、appVersion、platform\
    \ 和 userAgent。\n\nnavigator 对象中另一个可用的属性是 onLine，如果用户代理确定离线，则返回 false；如果用户代理可能在线，则返回\
    \ true。\n\n关于 navigator 对象的 onLine 属性需要注意的一点是，在撰写本文时，并非每个浏览器都支持它。因此，如果你选择使用此属性，最好先检查该属性是否存在。\n\
    \n### 错误处理\n\n工作线程可以选择附加到全局 onerror 事件处理程序，以监听未处理的异常。\n\n这对于共享工作线程特别有用，因为许多浏览器不会将未处理的异常传递给工作线程对象本身的\
    \ onerror 事件处理程序。\n\n以下是在工作线程内部附加到 onerror 事件处理程序的示例：\n\n```\nself.onerror = function(evt)\
    \ {\n    // 处理错误，可能通过向此线程的创建者发起 postMessage 调用，以便可以显示一条消息\n}\n```\n\n### 自行关闭\n\
    \n工作线程可以通过调用 close 方法自行关闭：\n\n```\nself.close();\n```\n\n以下是专用工作线程内部 JavaScript\
    \ 的摘要：\n\n```\n// 可选地加载一些通用 JavaScript\n// self.importScripts(\"common.js\");\n\
    \n// 附加到 onmessage 事件以监听来自调用者的消息\nself.onmessage = function (evt) {\n    // 传回一条消息\n\
    \    self.postMessage(\"Text received from the UI: \" + evt.data);\n}\n\n// 附加到\
    \ onerror 事件以监听未处理的异常\nself.onerror = function (evtError) {\n    var sMsg = \"\
    Unknown Error\";\n\n    // 测试错误事件对象，看它是否有 message 属性。如果没有，检查它是否是一个字符串。\n    if\
    \ (evtError.message) { sMsg = evtError.message; }\n    else if (typeof evtError\
    \ === \"string\") { sMsg = evtError; }\n\n    // 将消息传递给此工作线程的创建者\n    postMessage(\"\
    Dedicated Worker - Error Message: \" + sMsg);\n}\n\n// 在某个时候，我们可以自己关闭线程\nself.close();\n\
    ```\n\n以下是共享工作线程内部 JavaScript 的摘要：\n\n```\n// 可选地加载一些通用 JavaScript\n// self.importScripts(\"\
    common.js\");\n\n// 全局变量，将保存对最后连接到此共享工作线程的线程的引用。也可以使用数组来存储每个已连接线程的端口。\nvar gLastPort\
    \ = null;\n\n// 附加到 onconnect 事件以监听连接到此共享工作线程的线程\nself.onconnect = function (evtConnect)\
    \ {\n    // 获取已连接线程端口的引用（数组中永远只有 1 个端口），并附加到 onmessage 事件\n    gLastPort = evtConnect.ports[0];\n\
    \    gLastPort.onmessage = function (evtMessage) {\n        evtMessage.target.postMessage(\"\
    Text received from the UI: \"\n        + evtMessage.data);\n    }\n}\n\n// 附加到\
    \ onerror 事件以监听未处理的异常\nself.onerror = function (evtError) {\n    var sMsg = \"\
    Unknown Error\";\n\n    // 测试错误事件对象，看它是否有 message 属性。如果没有，检查它是否是一个字符串。\n    if\
    \ (evtError.message) { sMsg = evtError.message; }\n    else if (typeof evtError\
    \ === \"string\") { sMsg = evtError; }\n```\n"
