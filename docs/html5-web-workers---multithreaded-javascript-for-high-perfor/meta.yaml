  - "[PAGE 5]\n\n```\n// Pass the message to this worker's creator\ngLastPort.postMessage(\"\
    Shared Worker - Error Message: \" +\n    sMsg);\n}\n\n// At some point we can\
    \ close the thread ourselves\nself.close();\n```\n\n# EXTRAS\n\n# Creating Multiple\
    \ Shared Workers\n\nOne of the advantages of shared workers is that you can share\
    \ the use of a single worker thread across several open windows but you're not\
    \ limited to a single shared worker.\n\nThe SharedWorker object accepts a 2nd\
    \ parameter in the constructor that specifies the name of the worker.\n\nThe 2nd\
    \ parameter is case sensitive so giving the shared worker a name of Worker in\
    \ one window and worker in another window will actually result in two shared worker\
    \ threads being created instead of one that is shared between the two windows\
    \ because of the difference in the case of the 'W'.\n\nThe following is an example\
    \ of how you can create two shared workers:\n\n```\n// Window 1 - Shared worker\
    \ 1 & 2\nvar aSharedWorker1 = new SharedWorker(\"SharedWorker.js\",\n    \"Worker1\"\
    );\nvar aSharedWorker2 = new SharedWorker(\"SharedWorker.js\",\n    \"Worker2\"\
    );\n\n// Window 2 - Shared worker 1 & 2\nvar aSharedWorker1 = new SharedWorker(\"\
    SharedWorker.js\",\n    \"Worker1\");\nvar aSharedWorker2 = new SharedWorker(\"\
    SharedWorker.js\",\n    \"Worker2\");\n```\n\n# Spawning Additional Workers from\
    \ Within a Worker\n\nIf need be, a worker thread can create additional worker\
    \ objects (sometimes referred to as subworkers) in the same manner that they're\
    \ created in the UI thread.\n\nSubworkers need to belong to the same origin/domain\
    \ as the parent page. Also, URIs within subworkers are resolved relative to the\
    \ parent thread's location rather than the location of the main page.\n\n# JSONP\
    \ within a Worker\n\nBefore I go any further with this topic, it's important to\
    \ understand that there are security concerns with importing JavaScript files/content\
    \ from a 3rd party site.\n\nWhen you import data using script injection, the browser\
    \ will download the JavaScript data received, evaluate it—turning the text received\
    \ into functions, variables, objects, etc.—and any global code within the payload\
    \ will be run.\n\nOther than the potential of having arbitrary code run, there\
    \ is also the possibility of information being leaked to the 3rd party site via\
    \ the HTTP traffic being exchanged in the process (cookies or other header information).\n\
    \nTraditionally with JSONP you use script injection by modifying the DOM. In the\
    \ case of Web Workers you don't have access to the DOM so how do we accomplish\
    \ script injection?\n\nIt turns out that it is surprisingly simple to make a JSONP\
    \ request from within a worker by using the importScripts function as in the following\
    \ example:\n\n```\nfunction MakeRequest(){\n    importScripts(\"http://SomeServer.com?jsonp=HandleRequest\"\
    );\n}\nfunction HandleRequest(objJSON){\n    // do something with the returned\
    \ JSON object\n}\n```\n\n# Inline Workers\n\nThere are times when you might want\
    \ to take advantage of Web Workers but at the same time you don't want to deal\
    \ with separate worker files. Inline workers have several advantages including:\n\
    \n+   - You can make a server request that returns a string containing custom\
    \ worker code on the fly to meet the current need of your code\n- By including\
    \ the worker code as a string within your JavaScript file, or as part of the markup\
    \ of the page, you can eliminate a network request which can speed up load time\n\
    \nTo accomplish inline workers you populate a Blob object with a string containing\
    \ the worker code. You then create a URL for the Blob and with that URL you can\
    \ then create your Worker object. To create a URL for the Blob we use the window.URL.createObjectURL\
    \ method which gives us a URL similar to the following:\n\n```\nblob:http://localhost/72cdddc4-7989-4104-87ef-cf65ed5f5bf9\n\
    ```\n\nThe blob URLs will be unique and last for the lifetime of your application.\
    \ If you no longer need the URL, you can release it by calling the window.URL.revokeObjectURL\
    \ passing in the blob's URL.\n\nThe following is one example of how an inline\
    \ worker can be created:\n\n```\nvar bInlineWorker = new Blob([\"onmessage = function(evt)\
    \ {\n    postMessage(\\\"Text received from the UI: \\\" + evt.data);\n}\"]);\n\
    var sBlobURL = window.URL.createObjectURL(bInlineWorker);\n\nvar aDedicatedWorker\
    \ = new Worker(sBlobURL);\naDedicatedWorker.onmessage = handleMessage;\naDedicatedWorker.postMessage(\"\
    Hello to our inline worker!\");\n```\n\nThe following example is a modification\
    \ to the above approach, which defines the worker code within the markup of the\
    \ page allowing for more natural editing of the code as compared to building it\
    \ as a string directly within a Blob object:\n\n```\n<script id=\"scriptWorker\"\
    \ type=\"javascript/worker\">\n    // This block of code is ignored by the JavaScript\
    \ engines\n    // of the browsers because of the type specified\n    self.onmessage\
    \ = function(evt) {\n        self.postMessage(\"Text received from the UI: \"\
    \ + evt.data);\n    };\n</script>\n```\n\nThe JavaScript code of the main page\
    \ would then populate the blob dynamically from the content of the script tag:\n\
    \n```\nvar bInlineWorker = new Blob([document.\n    getElementById(\"scriptWorker\"\
    ).textContent]);\nvar sBlobURL = window.URL.createObjectURL(bInlineWorker);\n\n\
    var aDedicatedWorker = new Worker(sBlobURL);\naDedicatedWorker.onmessage = handleMessage;\n\
    aDedicatedWorker.postMessage(\"Hello to our inline worker!\");\n```\n\n# ADDITIONAL\
    \ RESOURCES\n\nSome example code has been written to show a possible real-world\
    \ use case for dedicated web workers.\n\nThe example demonstrates using a dedicated\
    \ worker thread to pre-fetch data needed by a vertical list of items that the\
    \ user is able to page through.\n\nMost of code is within the 'main.js' and 'DedicatedWorker.js'\
    \ files and can be found in the following github repository.\n\nhttps://github.com/dovicoapi/HTML5WebWorkerExample\n\
    \nThe **W3C spec** is located here: http://www.w3.org/TR/workers/"
