    \ [abBuffer]);\nif (abBuffer.byteLength) {\n    alert(\"Transferrable Objects\
    \ are not supported by your browser\");\n}\n```\n\n```\n}\nelse if (evtError.message)\
    \ {\n    updateResults(\"Error...Message: \" + evtError.message +\n        \"\
    , File name: \" + evtError.filename +\n        \", Line number: \" + evtError.lineno);\n\
    }\nelse {\n    updateResults(\"Unknown error\");\n}\n}\n\n// OnMessage event listener\n\
    function handleMessage(evtMessage) {\n    updateResults(\"Message received from\
    \ the worker: \" +\n        evtMessage.data);\n}\n\n// A helper to update a div\
    \ on the page with a new message\nfunction updateResults(sMessage) {\n    var\
    \ $divResults = $(\"#divResults\");\n    $divResults.html($divResults.html() +\
    \ \"<br />\" + sMessage);\n}\n```\n\n# Error Handling\n\nFor both dedicated and\
    \ shared workers you can attach to the onerror event handler of a worker instance\
    \ so that you can be informed if a runtime error occurs (e.g., maybe there is\
    \ a network error preventing the creation of the worker object).\n\nFor dedicated\
    \ workers, the onerror event handler will also tell you about any unhandled exceptions\
    \ from within the worker thread.\n\nThe following is an example of how you would\
    \ add an event listener for a onerror event on a worker object:\n\n```\naDedicatedWorker.onerror\
    \ = function(evt) { alert(evt.message); }\naSharedWorker.onerror = function(evt)\
    \ { alert(evt.message); }\n```\n\n| ErrorEvent properties | Description |\n| ---\
    \ | --- |\n| message | A human-readable error message |\n| filename | The name\
    \ of the script file in which the error occurred (in some browsers this property\
    \ is undefined and in other browsers the property is an empty string) |\n| lineno\
    \ | The line number of the script file on which the error occurred (in some browsers\
    \ this is set to zero) |\n\n# Closing a Worker\n\nBoth a dedicated and shared\
    \ worker thread can be closed by calling terminate on the worker instance as in\
    \ the following example:\n\n```\naDedicatedWorker.terminate();\naSharedWorker.terminate();\n\
    ```\n\nOne thing to be aware of with calling terminate is that it does not give\
    \ the worker thread an opportunity to finish its operations or to clean up after\
    \ itself.\n\nThe following is a summary of the JavaScript that creates a dedicated\
    \ and shared worker:\n\n```\nvar gDedicatedWorker = null;\nvar gSharedWorker =\
    \ null;\n\n$(document).ready(function () {\n    // If Dedicated Workers are supported\
    \ by this browser...\n    if (window.Worker) {\n        gDedicatedWorker = new\
    \ Worker(\"DedicatedWorker.js\");\n        gDedicatedWorker.onerror = handleError;\n\
    \        gDedicatedWorker.onmessage = handleMessage;\n\n        gDedicatedWorker.postMessage(\"\
    Hello from the UI thread!\");\n    } // End if (window.Worker)\n\n    // If shared\
    \ Workers are supported by this browser...\n    if (window.SharedWorker) {\n \
    \       gSharedWorker = new SharedWorker(\"SharedWorker.js\");\n        gSharedWorker.onerror\
    \ = handleError;\n        gSharedWorker.port.onmessage = handleMessage;\n\n  \
    \      gSharedWorker.port.postMessage(\"Hello from the UI thread!\");\n    } //\
    \ End if (window.SharedWorker)\n});\n\n// OnError event listener\nfunction handleError(evtError)\
    \ {\n    if (typeof evtError === \"string\") {\n        updateResults(\"Error:\
    \ \" + evtError);\n    }\n    else if (evtError.message) {\n        updateResults(\"\
    Error...Message: \" + evtError.message +\n            \", File name: \" + evtError.filename\
    \ +\n            \", Line number: \" + evtError.lineno);\n    }\n    else {\n\
    \        updateResults(\"Unknown error\");\n    }\n}\n\n// OnMessage event listener\n\
    function handleMessage(evtMessage) {\n    updateResults(\"Message received from\
    \ the worker: \" +\n        evtMessage.data);\n}\n\n// A helper to update a div\
    \ on the page with a new message\nfunction updateResults(sMessage) {\n    var\
    \ $divResults = $(\"#divResults\");\n    $divResults.html($divResults.html() +\
    \ \"<br />\" + sMessage);\n}\n```\n\n# WITHIN A WORKER\n\n# Including JavaScript\
    \ Files\n\nWorker threads have access to an importScripts function which allows\
    \ the thread to pull in all necessary JavaScript files.\n\nThe importScripts function\
    \ can be used to import one or more files. If multiple files are specified, they\
    \ are downloaded in parallel but will be loaded and processed synchronously in\
    \ the order specified.\n\nAlso, the importScripts file will not return until all\
    \ of the files specified have been loaded and processed.\n\nThe following is an\
    \ example of using the importScripts to import 3 JavaScript files into the worker\
    \ (this example stopped at 3 files but you can specify any number of files):\n\
    \n```\nimportScripts(\"file1.js\", \"file2.js\", \"file3.js\");\n```\n\n# Receiving\
    \ Messages\n\nIn order for a dedicated worker to receive messages from its creator\
    \ it must attach to the onmessage event as in the following example:\n\n```\n\
    self.onmessage = function(evt) {\n    // Data from calling thread can be found\
    \ in the .data property\n    // of the parameter\n}\n```\n\nWithin shared workers,\
    \ you need to handle the onconnect event which is triggered whenever a thread\
    \ connects to the shared worker.\n\nWithin the onconnect event listener you can\
    \ then attach to the onmessage event of the first port object in the ports array\
    \ (there is only ever the one port in the array):\n\n```\nself.onconnect = function(evt)\
    \ {\n    evt.ports[0].onmessage = function(evtMessage) {\n        // Data from\
    \ calling thread can be found in the .data\n        // property of the parameter.\n\
    \n        // The calling thread's port can be found in the .target\n        //\
    \ property of the parameter\n    }\n}\n```\n\n# Passing Messages\n\nA dedicated\
    \ worker is able to pass a message to its creator by means of the postMessage\
    \ function:\n\n```\nself.postMessage(\"Hello from the dedicated worker\");\n```"
