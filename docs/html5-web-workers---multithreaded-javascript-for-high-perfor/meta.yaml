  mdcn: "\n# 附加内容\n\n## 创建多个共享工作者\n\n共享工作者的一个优势在于，你可以让多个打开的窗口共享使用单个工作者线程，但你并不局限于只使用一个共享工作者。\n\
    \n`SharedWorker` 对象在构造函数中接受第二个参数来指定工作者的名称。\n\n第二个参数是大小写敏感的。因此，如果在一个窗口中将共享工作者命名为\
    \ `Worker`，而在另一个窗口中命名为 `worker`，由于 'W' 的大小写差异，实际上会创建两个共享工作者线程，而不是两个窗口之间共享的一个。\n\
    \n以下是如何创建两个共享工作者的示例：\n\n```javascript\n// 窗口 1 - 共享工作者 1 和 2\nvar aSharedWorker1\
    \ = new SharedWorker(\"SharedWorker.js\", \"Worker1\");\nvar aSharedWorker2 =\
    \ new SharedWorker(\"SharedWorker.js\", \"Worker2\");\n\n// 窗口 2 - 共享工作者 1 和 2\n\
    var aSharedWorker1 = new SharedWorker(\"SharedWorker.js\", \"Worker1\");\nvar\
    \ aSharedWorker2 = new SharedWorker(\"SharedWorker.js\", \"Worker2\");\n```\n\n\
    ## 从工作者内部生成额外的工作者\n\n如果需要，工作者线程可以像在 UI 线程中创建工作者对象一样，以相同的方式创建额外的工作者对象（有时称为子工作者）。\n\
    \n子工作者需要与父页面属于相同的来源/域名。此外，子工作者中的 URI 是相对于父线程的位置进行解析的，而不是相对于主页面的位置。\n\n## 在工作者中使用\
    \ JSONP\n\n在进一步讨论这个主题之前，重要的是要理解从第三方站点导入 JavaScript 文件/内容存在安全问题。\n\n当你使用脚本注入导入数据时，浏览器会下载接收到的\
    \ JavaScript 数据，对其求值——将接收到的文本转换为函数、变量、对象等——并且负载中的任何全局代码都将被运行。\n\n除了可能运行任意代码外，还有可能通过交换过程中使用的\
    \ HTTP 流量（如 Cookie 或其他头部信息）将信息泄露给第三方站点。\n\n传统上，JSONP 通过修改 DOM 来使用脚本注入。而在 Web Workers\
    \ 的情况下，你无法访问 DOM，那么我们如何实现脚本注入呢？\n\n事实证明，通过使用 `importScripts` 函数，从工作者内部发出 JSONP\
    \ 请求出奇地简单，如下例所示：\n\n```javascript\nfunction MakeRequest(){\n    importScripts(\"\
    http://SomeServer.com?jsonp=HandleRequest\");\n}\nfunction HandleRequest(objJSON){\n\
    \    // 处理返回的 JSON 对象\n}\n```\n\n## 内联工作者\n\n有时你可能想要利用 Web Workers，但同时又不想处理单独的工作者文件。内联工作者有几个优点，包括：\n\
    \n- 你可以发出一个服务器请求，该请求动态返回包含自定义工作者代码的字符串，以满足代码的当前需求\n- 通过将工作者代码作为字符串包含在 JavaScript\
    \ 文件中或作为页面标记的一部分，你可以消除网络请求，从而加快加载速度\n\n要实现内联工作者，你需要用一个包含工作者代码的字符串填充一个 `Blob` 对象。然后为该\
    \ `Blob` 创建一个 URL，并使用该 URL 创建 `Worker` 对象。为了创建 `Blob` 的 URL，我们使用 `window.URL.createObjectURL`\
    \ 方法，它会给我们一个类似于以下内容的 URL：\n\n```\nblob:http://localhost/72cdddc4-7989-4104-87ef-cf65ed5f5bf9\n\
    ```\n\nBlob URL 将是唯一的，并且在你的应用程序生命周期内有效。如果你不再需要该 URL，可以通过调用 `window.URL.revokeObjectURL`\
    \ 并传入 Blob 的 URL 来释放它。\n\n以下是创建内联工作者的一个示例：\n\n```javascript\nvar bInlineWorker\
    \ = new Blob([\"onmessage = function(evt) {\n    postMessage(\\\"Text received\
    \ from the UI: \\\" + evt.data);\n}\"]);\nvar sBlobURL = window.URL.createObjectURL(bInlineWorker);\n\
    \nvar aDedicatedWorker = new Worker(sBlobURL);\naDedicatedWorker.onmessage = handleMessage;\n\
    aDedicatedWorker.postMessage(\"Hello to our inline worker!\");\n```\n\n以下示例是对上述方法的修改，它在页面的标记中定义工作者代码，与直接在\
    \ `Blob` 对象中将其构建为字符串相比，允许更自然地编辑代码：\n\n```html\n<script id=\"scriptWorker\" type=\"\
    javascript/worker\">\n    // 由于指定的类型，浏览器的 JavaScript 引擎会忽略此代码块\n    self.onmessage\
    \ = function(evt) {\n        self.postMessage(\"Text received from the UI: \"\
    \ + evt.data);\n    };\n</script>\n```\n\n然后，主页面的 JavaScript 代码会从 script 标签的内容动态填充\
    \ blob：\n\n```javascript\nvar bInlineWorker = new Blob([document.getElementById(\"\
    scriptWorker\").textContent]);\nvar sBlobURL = window.URL.createObjectURL(bInlineWorker);\n\
    \nvar aDedicatedWorker = new Worker(sBlobURL);\naDedicatedWorker.onmessage = handleMessage;\n\
    aDedicatedWorker.postMessage(\"Hello to our inline worker!\");\n```\n\n## 附加资源\n\
    \n已编写了一些示例代码，以展示专用 Web Workers 的一个可能的实际用例。\n\n该示例演示了如何使用专用工作者线程来预取用户可以分页浏览的垂直项目列表所需的数据。\n\
    \n大部分代码位于 'main.js' 和 'DedicatedWorker.js' 文件中，可以在以下 GitHub 仓库中找到：\n\n[https://github.com/dovicoapi/HTML5WebWorkerExample](https://github.com/dovicoapi/HTML5WebWorkerExample)\n\
    \n**W3C 规范**位于此处：[http://www.w3.org/TR/workers/](http://www.w3.org/TR/workers/)\n\
    \n有关 **HTML5 Web Messaging** 的更多信息（这是用于与 Web Workers 传递和接收消息的技术）：[http://www.w3.org/TR/webmessaging/](http://www.w3.org/TR/webmessaging/)。查看\
    \ [http://caniuse.com/](http://caniuse.com/) 了解当前浏览器支持情况的详细分解。\n\n由于规范和浏览器发展得如此之快，在这种情况下，对规范本身有深入的了解尤其重要。教程和分步指南可能会过时，但\
    \ Web Workers 背后的基本原则相当稳固。作为适用于包括但不限于 Web Workers 在内的 HTML5 技术的一般规则，尝试将规范与你找到的任何操作指南或代码片段进行交叉引用——并特别注意编写良好的测试代码。网络上充斥着\
    \ HTML5 开发者网站，但我发现以下网站非常突出，并且在理解各种技术的一些细节方面非常有帮助：\n\n- HTML5 Zone: [www.DZone.com/mz/html5](http://www.DZone.com/mz/html5)\n\
    - Mozilla Developer Network: [https://developer.mozilla.org/en-US/docs/HTML/HTML5](https://developer.mozilla.org/en-US/docs/HTML/HTML5)\n\
    - HTML5 Rocks: [www.html5rocks.com](http://www.html5rocks.com)\n\n## 关于作者\n\n\
    Gerard Gallant 是 Dovico Software 的高级软件开发人员/软件架构师。十多年来，他在 Dovico 发布的大多数软件产品的开发中发挥了重要作用，从创建\
    \ Microsoft Project 链接 ActiveX 控件到创建新的托管服务 API。他已婚，有两个美丽聪明的女孩。他通过投篮或看电影来放松身心，也喜欢广泛旅行。最近的出版物可以在他的博客上找到：[http://cggallant.blogspot.ca/](http://cggallant.blogspot.ca/)\n\
    \n## 推荐书籍\n\n如果繁重的计算可以在后台执行，而不是与用户界面竞争，Web 应用程序的运行效果会好得多。通过这本书，你将学习如何使用 Web Workers\
    \ 在与 UI 并行的线程中运行计算密集型 JavaScript 代码。是的，多线程编程很复杂，但 Web Workers 提供了一个简单的 API，帮助你在不使用复杂算法的情况下提高生产力。\n\
    \n**点击此处购买**\n\n![](img/c87c2c7cc0fb6e0fcbc547fd91db34d3_6_0.png)\n\n**浏览我们超过\
    \ 150 个免费速查表的合集**\n\n**免费 PDF**\n\n**即将推出的 Refcardz**\n\n- C++\n- Cypher\n- Clean\
    \ Code\n- Git for the Enterprise\n\nDZone, Inc.\n150 Preston Executive Dr.\nSuite\
    \ 201\nCary, NC 27513\n888.678.0399\n919.678.0300\n\n**欢迎提供 Refcardz 反馈**\nrefcardz@dzone.com\n\
    \n**赞助机会**\nsales@dzone.com\n\nDZone 社区每月为超过 330 万软件开发人员、架构师和决策者提供超过 600 万页的内容。DZone\
    \ 为每个人提供内容，包括新闻、教程、速查表、博客、专题文章、源代码等。\"**DZone 是开发者的梦想**\"，PC Magazine 如此评价。\n\n\
    ISBN-13: 978-1-936502-75-2\nISBN-10: 1-936502-75-5\n50795\n9 781936 502752\n"
