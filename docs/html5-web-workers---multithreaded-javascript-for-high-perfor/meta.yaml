  md: "From a shared worker, in order to pass a message to a connected thread, you\
    \ need to use the postMessage event on the port of the connected thread that you\
    \ wish to send the message to.\n\nThere are a few options available to obtain\
    \ the port object. One option could be the creation of a global array to hold\
    \ each connected port from the onconnect event handler.\n\nAnother option for\
    \ obtaining a port object is to access the target property of the onmessage event\
    \ object which holds a reference to the calling thread's port as in the following\
    \ example:\n\n```\nevt.target.postMessage(\"Hello from the shared worker\");\n\
    ```\n\n# Timeouts\n\nWorker threads support timeouts (setTimeout, clearTimeout,\
    \ setInterval, and clearInterval), which are very useful if you only want to do\
    \ processing at set intervals rather than constantly processing.\n\nOne scenario\
    \ could be if you wanted to check a 3rd party server to see if it has new information\
    \ but you don't want to hammer the site with requests. What you could do is set\
    \ up a timeout to check to see if there is new information every 5 minutes or\
    \ so.\n\n# XMLHttpRequest\n\nWithin a worker thread, it's possible to make an\
    \ XMLHttpRequest and, since a worker is separate from the UI thread of the browser\
    \ window and won't affect performance, it's up to you if you want to make the\
    \ request synchronously or asynchronously.\n\nOne thing to be aware of, however,\
    \ is that within a worker the XMLHttpRequest object will only return data via\
    \ the responseText property (the responseXML property will always return null\
    \ when the XMLHttpRequest object is used in a worker).\n\nThe following is an\
    \ example of the use of an XMLHttpRequest object within a worker:\n\n```\n// Data\
    \ we want to send to server-side code\nvar objData = { \"sPageIndex\": iPage };\n\
    \n// Make a synchronous call to the server\nvar xhrRequest = new XMLHttpRequest();\n\
    xhrRequest.open(\"POST\", \"/main.aspx/GetNextPage\", false);\nxhrRequest.setRequestHeader(\"\
    Content-Type\", \"application/json\");\nxhrRequest.send(JSON.stringify(objData));\n\
    \n// Return the response to the UI thread\nself.postMessage(xhrRequest.responseText);\n\
    ```\n\n# location\n\nWorker threads have access to a location object which indicates\
    \ the absolute URI that was set at the time of the thread's creation.\n\nThe following\
    \ location properties are available: href, protocol, host, hostname, port, pathname,\
    \ search, and hash.\n\n# navigator\n\nThe navigator object is available within\
    \ a worker giving some details about the browser.\n\nSome of the properties that\
    \ are available are: appName, appVersion, platform, and userAgent.\n\n![](img/c87c2c7cc0fb6e0fcbc547fd91db34d3_4_0.png)\n\
    \nAnother property available in the navigator object is onLine which will return\
    \ false if the user agent is definitely offline and will return true if the user\
    \ agent might be online.\nOne thing to note about the onLine property of the navigator\
    \ object is that, at the time of this article's writing, not every browser supports\
    \ it. As a result, if you choose to use this property, it would be best to check\
    \ to see if the property exists first.\n\n# Error Handling\n\nA worker thread\
    \ has the option of attaching to a global onerror event handler to listen for\
    \ unhandled exceptions.\n\nThis is especially useful for shared workers since\
    \ several browsers do not pass unhandled exceptions to the onerror event handler\
    \ of the worker object itself.\n\nThe following is an example of attaching to\
    \ the onerror event handler within a worker thread:\n\n```\nself.onerror = function(evt)\
    \ {\n    // Handle the error possibly by doing a postMessage call to\n    // this\
    \ thread's creator so that a message can be displayed\n}\n```\n\n# Closing Itself\n\
    \nA worker can close itself by calling the close method:\n\n```\nself.close();\n\
    ```\n\nThe following is a summary of the JavaScript within a dedicated worker:\n\
    \n```\n// Optionally load in some common JavaScript\n// self.importScripts(\"\
    common.js\");\n\n// Attach to the onmessage event to listen for messages from\n\
    // the caller\nself.onmessage = function (evt) {\n    // Pass a message back\n\
    \    self.postMessage(\"Text received from the UI: \" + evt.data);\n}\n\n// Attach\
    \ to the onerror event to listen for unhandled exceptions\nself.onerror = function\
    \ (evtError) {\n    var sMsg = \"Unknown Error\";\n\n    // Test the error event\
    \ object to see if it has a message\n    // property. If it does not, check to\
    \ see if it's a string.\n    if (evtError.message) { sMsg = evtError.message;\
    \ }\n    else if (typeof evtError === \"string\") { sMsg = evtError; }\n\n   \
    \ // Pass the message to this worker's creator\n    postMessage(\"Dedicated Worker\
    \ - Error Message: \" + sMsg);\n}\n\n// At some point we can close the thread\
    \ ourselves\nself.close();\n```\n\nThe following is a summary of the JavaScript\
    \ within a shared worker:\n// Optionally load in some common JavaScript\n// self.importScripts(\"\
    common.js\");\n\n// Global variable that will hold a reference to the last thread\n\
    // that connects to this shared worker. Could also use an array to\n// store each\
    \ connected thread's port.\nvar gLastPort = null;\n\n// Attach to the onconnect\
    \ event to listen for threads that\n// connect to this shared thread\nself.onconnect\
    \ = function (evtConnect) {\n    // Grab a reference to the connected thread's\
    \ port (only\n    // even the 1 port in the array) and attach to the\n    // onmessage\
    \ event\n    gLastPort = evtConnect.ports[0];\n    gLastPort.onmessage = function\
    \ (evtMessage) {\n        evtMessage.target.postMessage(\"Text received from the\
    \ UI: \"\n        + evtMessage.data);\n    }\n}\n\n// Attach to the onerror event\
    \ to listen for unhandled exceptions\nself.onerror = function (evtError) {\n \
    \   var sMsg = \"Unknown Error\";\n\n    // Test the error event object to see\
    \ if it has a message\n    // property. If it does not, check to see if it's a\
    \ string.\n    if (evtError.message) { sMsg = evtError.message; }\n    else if\
    \ (typeof evtError === \"string\") { sMsg = evtError; }\n    ------Snippet cont'd\
    \ on next page------------>"
