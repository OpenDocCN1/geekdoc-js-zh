    \ files and can be found in the following github repository.\n\n[https://github.com/dovicoapi/HTML5WebWorkerExample](https://github.com/dovicoapi/HTML5WebWorkerExample)\n\
    \nThe **W3C spec** is located here: [http://www.w3.org/TR/workers/](http://www.w3.org/TR/workers/)\n\
    \nFor more information about **HTML5 Web Messaging**, which is the technology\
    \ used to pass messages to and receive messages from Web Workers: [http://www.w3.org/TR/webmessaging/](http://www.w3.org/TR/webmessaging/).\
    \ Check [http://caniuse.com/](http://caniuse.com/) for detailed breakdown of current\
