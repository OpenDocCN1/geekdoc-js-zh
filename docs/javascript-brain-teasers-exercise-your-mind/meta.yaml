    ```\n\n### 猜猜输出结果\n\n在翻到下一页之前，试着猜猜输出结果是什么。\n\n你可能预期输出会是 3，但这段代码的实际输出是 2。\n\n###\
    \ 讨论\n\n在这个小测验中，数组最初是一个空数组，就像一个空篮子。然后，我们开始填充数组。我们使用 `groceryList[0] = \"Bread\"\
    ` 将字符串 `\"Bread\"` 放入数组的第一个位置。所以现在，篮子里有一样东西了：\"Bread\"。\n\n接下来，我们使用 `groceryList[1]\
    \ = \"Milk\"` 将字符串 `\"Milk\"` 放入数组的第二个位置。现在，篮子里有两样东西了：\"Bread\" 和 \"Milk\"。但这里有个棘手的地方：我们还偷偷地给数组添加了一个名为\
    \ `user` 的属性，并给了它值 `\"John\"`。这就像在篮子上贴了一张小纸条。\n\n当我们使用 `groceryList.length` 询问数组里面有多少东西时，它忽略了那张偷偷摸摸的小纸条。它只计算数组内部的实际元素，不计算额外的属性。由于我们有两个实际元素，即字符串\
    \ `\"Bread\"` 和 `\"Milk\"`，所以数组的长度是 `2`。\n\n你也可以使用方括号表示法给数组添加属性，就像处理普通对象一样：\n\n\
    ```javascript\nconst groceryList = [];\n\ngroceryList[0] = \"Bread\";\ngroceryList[1]\
