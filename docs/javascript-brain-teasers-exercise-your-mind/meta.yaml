  md: "*Temporal dead zone* (TDZ) is a term dubbed by the JavaScript community to\
    \ describe why it's not possible to access `let` and `const` before they are declared.\
    \ `let` and `const` are both hoisted similarly to `var` and `function` declarations,\
    \ but there is a time span between entering the scope and being declared in which\
    \ they cannot be accessed. This period is the temporal dead zone.\n\nAny attempt\
    \ to access variables while they are in TDZ causes a `ReferenceError`. Once execution\
    \ reaches the declaration, the variable in TDZ is removed, and they are allowed\
    \ to be accessed. The TDZ exists to help us find bugs in our code. Trying to access\
    \ a variable before declaring it is rarely intentional.\n\n> **The Lifespan of\
    \ Variables**\n\nThe lifespan of variables within a function spans the duration\
    \ of the function's execution. Once a function concludes its execution, all local\
    \ variables within it are automatically cleared. In contrast, global variables\
    \ remain in memory until the program/webpage is closed.\n\nIt's important to remember\
    \ that TDZ applies only to the code block in which the variable is declared. Attempting\
    \ to access a variable outside its scope does not throw an error because the variable\
    \ is not in TDZ:\n\n```\nconsole.log(a);    // → undefined\n\n{\n  console.log(a);\
    \    // → ReferenceError\n  let a = 10;\n}\n\nvar a = 20;\n```\n\n# Function Hoisting\n\
    \nSimilar to variables, function declarations are hoisted to the top of their\
    \ containing scope. But they are hoisted entirely, including both the name and"
  merge: -1
