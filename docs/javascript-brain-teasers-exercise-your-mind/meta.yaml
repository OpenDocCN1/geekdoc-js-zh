  - "[PAGE 22]\n\nIn JavaScript, if you define multiple functions with the same name,\
    \ the last one you define will replace the previous functions. But, there's a\
    \ workaround. You just need to be a little creative.\n\nInstead of having separate\
    \ functions, you can write a single function and then check the types and number\
    \ of arguments inside it. Based on what you find, you can make your function behave\
    \ differently. It's a bit different from traditional function overloading, but\
    \ it gets the job done in JavaScript:\n\n```\nthe_usurper/the_usurper_ex1.js\n\
    \nfunction calculateArea(length, width) {\n  if (width === undefined) {\n    //\
    \ Calculate area of a square\n    return length * length;\n  } else {\n    //\
    \ Calculate area of a rectangle\n    return length * width;\n  }\n}\n\nconsole.log(calculateArea(5));\
    \      // → 25 (Area of a square)\nconsole.log(calculateArea(4, 6));   // → 24\
    \ (Area of a rectangle)\n```\n\nIn this example, we have a function that can calculate\
    \ the area of both squares and rectangles. Here's how it works: if we call the\
    \ function with just one argument, the second argument will have a value of **undefined**.\
    \ So, it squares the **length** value and gives us the area we want.\n\nBut, if\
    \ we decide to pass two arguments, the function realizes that we're dealing with\
    \ a rectangle. So, it multiplies the **length** and **width** values together\
    \ and we get the area of that rectangle.\n\nThis trick allows us to have a single\
    \ function that does all the work. Now, it's worth mentioning that with the introduction\
    \ of ECMAScript 2015 (ES6), JavaScript got some new tricks up its sleeve. Default\
    \ function parameters and the rest parameter syntax can help us handle different\
    \ numbers of arguments with more flexibility."
