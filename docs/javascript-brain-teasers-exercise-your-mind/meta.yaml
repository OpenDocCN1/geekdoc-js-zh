    The number 1 is considered a "truthy" value. So when we apply the `!` operator
    once, it turns into **false** because we''re saying "not 1." But when we apply
    the `!` operator again, it flips it back to **true** because we''re saying "not
    not 1."


    So, it''s a shorthand way of saying, "I want the boolean version of the number
    1, please!" When you want to convert any value, whether it''s a number, a string,
    or something else, into a **true** or **false** value. You just stick `!!` in
    front of it, and you get the boolean version. For example, `!!0` would evaluate
    to **false**, `!!NaN` would evaluate to **false**, and `!!"hello"` would evaluate
    to **true**.


    # What Are Truthy and Falsy Values?


    Truthy values are those that are considered **true** when evaluated as a boolean,
    whereas falsy values are deemed **false**. Here are the values considered falsy
    in JavaScript:


    +   - `0` - The number zero

    - `0n` - The BigInt zero

    - `""` - An empty string

    - `null` - Represents the absence of any object value

    - `undefined` - Represents an undefined value

    - `NaN` - Stands for "Not a Number" and represents an invalid or unrepresentable
    value


    All other values, including non-empty strings, non-zero numbers, arrays, objects,
    and functions, are considered truthy.


    The purpose of the function in this puzzle is to filter out the falsy values (`NaN`
    and an empty string) from the original array `arr`, creating a new array `newArr`
    that only contains the truthy values (numbers).


    Inside the callback function, we used the expression `!!item` as a way to convert
    a value to its corresponding boolean representation. It essentially performs two
    boolean conversions, converting any truthy value to **true** and any falsy value
    to **false**.'
