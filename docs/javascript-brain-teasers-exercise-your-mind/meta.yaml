    Miki Tebeka


    (110 页) ISBN: 9781680508994 $18.95


    ## Rust 实战


    ![](img/7ad0e8939612afa723b8affa6c064dcf_113_1.png)


    Rust 是一门激动人心的新编程语言，它结合了 C 的强大功能与内存安全、无畏并发和生产力提升——还有什么比通过制作游戏更好的学习方式呢？本书的每一章都呈现了从
    “Hello, World” 到构建完整地牢爬行者游戏的实践、实用项目。通过本书，您将学习适用于其他引擎（包括 Unity 和 Unreal）的游戏开发技能。


    Herbert Wolverson


    (342 页) ISBN: 9781680508161 $47.95


    ## 使用 Rust 编程 WebAssembly


    ![](img/7ad0e8939612afa723b8affa6c064dcf_114_0.png)


    WebAssembly 实现了网络技术长久以来的承诺：快速的代码、编译时类型安全、在浏览器中或在嵌入式设备上执行，或在任何其他地方执行。Rust 在一种严格执行类型安全的语言中提供了
    C 的强大功能。结合这两种语言，您可以以前所未有的方式为网络编写代码！学习如何与 JavaScript 集成、在浏览器以外的平台上运行代码，并迈入物联网领域。探索构建跨平台应用程序的简便方法，无需牺牲性能，并改变您为网络编写代码的方式。


    Kevin Hoffman


    (238 页) ISBN: 9781680506365 $45.95

