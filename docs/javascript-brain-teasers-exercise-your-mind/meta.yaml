    \ false。\n\n但不用担心！你可以通过所谓的*规范化*将字符串置于标准化格式中，以便准确地进行比较。在 JavaScript 中，你可以使用字符串对象上可用的\
    \ `normalize()` 方法来实现这一点。以下是规范化字符串并执行比较的示例：\n\n```\ndo_you_trust_your_eyes/do_you_trust_your_eyes_ex1.js\n\
    \n// 比较前对字符串进行规范化\n\nconst string1 = \"Château\";\nconst string2 = \"Château\"\
    ;\n\nconst normalizedString1 = string1.normalize(\"NFC\");\nconst normalizedString2\
    \ = string2.normalize(\"NFC\");\n\nconsole.log(normalizedString1 === normalizedString2);\
    \  // → true\n```\n\n`normalize()` 方法确保在比较字符串时，即使字符的构成方式存在差异，它们也始终保持一致。你可以选择特定的规范化形式，在我们的例子中，我们使用\
    \ NFC。\n\n我们还可以为 `normalize()` 提供其他三个选项，包括 NFD、NFKC 和 NFKD。选择哪种形式取决于程序的需求，但通常情况下，对于常规文本，NFC\
    \ 是更安全的选择，因为它对从旧编码转换而来的字符效果更好。\n\n## 延伸阅读\n\n- 使用 JavaScript 进行文本处理\n  https://pragprog.com/titles/fkjavascript/text-processing-with-javascript/\n\
    \n- Mathias Bynens 的《JavaScript 存在 Unicode 问题》\n  https://mathiasbynens.be/notes/javascript-unicode\n\
    \n- normalize() 方法\n  https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/normalize\n\
    \n## 谜题 25 真相还是虚构？\n\n```\ntruth_or_fiction/truth_or_fiction.js\n```\n\n```\n\
    const arr = [1, 8, NaN, 15, \"\"];\n\nconst newArr = arr.filter(function(item)\
    \ {\n  return !!item\n});\n\nconsole.log(newArr);\n```\n\n### 猜猜输出\n\n在翻到下一页之前，试着猜猜输出是什么。\n\
    \n这段代码将输出：\n\n[1, 8, 15]\n\n### 讨论\n\nJavaScript 中的 `!!` 代码可以用作一种快速且巧妙地将值转换为 `true`\
    \ 或 `false` 的方法。首先，`!` 符号是逻辑非运算符。它对其后的值进行取反。例如，`!true` 的结果是 `false`，而 `!false`\
    \ 的结果是 `true`。\n\n现在，如果我们应用两次 `!` 运算符，就像是说“非非”。这可能听起来很奇怪，但它实际上是一个巧妙的技巧。第一个 `!`\
    \ 翻转值，第二个 `!` 再将其翻转回原来的值。\n\n数字 `1` 被视为“真值”。因此，当我们应用一次 `!` 运算符时，它会变成 **false**，因为我们表示的是“非\
    \ 1”。但当我们再次应用 `!` 运算符时，它又翻转回 **true**，因为我们表示的是“非非 1”。\n\n所以，这是一种简写方式，表示“我想要数字\
    \ 1 的布尔值，谢谢！”当你想将任何值，无论是数字、字符串还是其他东西，转换为 **true** 或 **false** 值时，只需在其前面加上 `!!`，就能得到布尔版本。例如，`!!0`\
    \ 的结果是 **false**，`!!NaN` 的结果是 **false**，而 `!!\"hello\"` 的结果是 **true**。\n\n## 什么是真值和假值？\n\
    \n真值是指在作为布尔值求值时被视为 **true** 的值，而假值则被视为 **false**。以下是 JavaScript 中被视为假值的值：\n\n\
    - `0` - 数字零\n- `0n` - BigInt 零\n- `\"\"` - 空字符串\n- `null` - 表示没有任何对象值\n- `undefined`\
    \ - 表示未定义的值\n- `NaN` - 代表“非数字”，表示无效或无法表示的值\n\n所有其他值，包括非空字符串、非零数字、数组、对象和函数，都被视为真值。\n\
    \n这个谜题中函数的目的就是从原始数组 `arr` 中过滤掉假值（`NaN` 和一个空字符串），创建一个仅包含真值（数字）的新数组 `newArr`。\n\n\
    在回调函数内部，我们使用表达式 `!!item` 作为将值转换为其相应布尔表示的一种方式。它本质上执行两次布尔转换，将任何真值转换为 **true**，任何假值转换为\
    \ **false**。\n\n`filter` 函数使用回调函数的返回值来决定是否将某个元素包含在 `newArr` 中。如果返回值是 `true`，则包含该元素；如果是\
    \ `false`，则排除该元素。\n\n现在，我们可以使用箭头函数进一步简化这段代码：\n\n```\ntruth_or_fiction/truth_or_fiction_ex1.js\n\
    \nconst arr = [1, 8, NaN, 15, \"\"];\n\nconst newArr = arr.filter(i => i);\n\n\
    console.log(newArr);\n// → [1, 8, 15]\n```\n\n在这个版本的代码中，我们使用箭头函数直接返回数组本身的值。由于\
    \ `NaN` 和空字符串是假值，它们会自动转换为 `false`，从而导致它们被排除在数组之外。\n\n所以请记住，你可以使用双感叹号（`!!`）作为 `Boolean()`\
    \ 函数的快捷方式。当你需要过滤掉假值时，箭头函数可以使你的代码更简短。\n\n## 延伸阅读\n\n- *逻辑非 (!) 运算符*\n  https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Logical_NOT\n\
    \n- *箭头函数表达式*\n  https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions\n"
