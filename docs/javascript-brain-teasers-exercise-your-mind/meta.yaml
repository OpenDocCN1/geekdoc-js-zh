    console.log(Number.MIN_SAFE_INTEGER);    // → -9007199254740991

    console.log(Number.MAX_SAFE_INTEGER);    // → 9007199254740991

    ```


    Previously, to handle very large numbers with precision, JavaScript developers
    had to use external libraries like BigInt.js[^2] or BigNumber.js.[^3] Fortunately,
    ECMAScript 2020 (the standardized specification for JavaScript) came to the rescue
    with a fantastic solution called BigInt. Creating a BigInt is easy: simply append
    the letter **n** to the end of an integer, like this:


    ```

    console.log(9999999999999999n);    // → 9999999999999999n

    ```


    Or, you can use the `BigInt()` constructor:


    ```

    BigInt("9999999999999999");    // → 9999999999999999n

    ```


    So, to fix the code in this puzzle, we can write:


    ```

    const largeNumber = BigInt("1000000000000000");

    const smallNumber = BigInt("1");;


    console.log(largeNumber + smallNumber);

    // → 1000000000000001n

    ```


    You might be curious about why we''re also converting the `smallNumber` to a BigInt.
    To maintain the integrity of the data and avoid potential loss of information,
