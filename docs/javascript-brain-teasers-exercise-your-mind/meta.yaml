    characters from the Mortal Kombat video game series, whereas the `maleMKCharacters`
    array contains the names of male characters from the same game.


    The puzzle then attempts to combine two arrays into one big array using the +
    operator. But here''s the problem: when you use the + operator with arrays in
    JavaScript, it doesn''t merge them as you might expect. Instead, it treats them
    as strings and does string concatenation. So, the end result is that `MKCharacters`
    becomes a single string that smashes the two arrays together as if they were strings.


    Fortunately, there are multiple ways to combine two arrays. Here are a few common
    approaches:


    +   1. `concat()`: A quick way to combine two arrays is by using `concat()`. This
    method creates a new array that includes the elements from both arrays:


    ```

    mortal_koncatenation/mortal_koncatenation_ex1.js


    const array1 = [1, 2, 3];

    const array2 = [4, 5, 6];

    const combinedArray = array1.concat(array2);


    console.log(combinedArray);  // → [1, 2, 3, 4, 5, 6]

    ```


    You can also use `concat()` when you have a variable number of arrays to concatenate
    or if you need to concatenate arrays dynamically based on certain conditions.


    +   2. Spread Operator: The spread operator (`...`) is a newer feature introduced
    in ECMAScript 2015 (ES6) that provides a concise way to combine arrays. It unpacks
    the elements of each array and creates a new array with all the elements:


    ```

    mortal_koncatenation/mortal_koncatenation_ex2.js


    const array1 = [1, 2, 3];

    const array2 = [4, 5, 6];

    ```'
