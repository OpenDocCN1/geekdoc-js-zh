  - "[PAGE 63]\n\n# # Discussion\n\nIn this puzzle, the intention is to create an\
    \ array of closure functions, each printing the current value of the variable\
    \ `i`. However, when you run this code, you'll get an unexpected result. Instead\
    \ of printing the values 0, 1, 2, 3, and 4, the code will print the value 5 five\
    \ times.\n\nThis result is because `var` has function-level scope, not block-level\
    \ scope. The variable `i` declared in the `for` loop is shared across all the\
    \ closure functions. By the time the functions are called, the `for` loop has\
    \ already finished executing, and the final value of `i` is 5.\n\nA straightforward\
    \ approach to fix this issue is to use the `let` keyword instead of `var` to declare\
    \ the variable `i`. Using `let` will create a new block-scoped variable for each\
    \ iteration of the loop:\n\n```\nthe_permanent_closure/the_permanent_closure_ex1.js\n\
    \nfunction createCounterArray() {\n  const counterArray = [];\n  for (let i =\
    \ 0; i < 5; i++) {\n    counterArray.push(() => {\n      console.log(`Counter:\
    \ ${i}`);\n    });\n  }\n  return counterArray;\n}\n\nconst counters = createCounterArray();\n\
    \ncounters.forEach(counter => counter());\n```\n\nWith this change, each function\
    \ in the `closureArray` will capture its own separate value of `i`, and you'll\
    \ see the expected output:\n\n```\nCounter: 0\nCounter: 1\n```"
  - "[PAGE 64]\n\nCounter: 2\nCounter: 3\nCounter: 4\n\nAnother way to fix this problem\
    \ is to use an immediately invoked function expression (IIFE) to create a new\
    \ scope for each iteration of the loop:\n\n```\nthe_permanent_closure/the_permanent_closure_ex2.js\n\
    \nfunction createCounterArray() {\n    const counterArray = [];\n    for (var\
    \ i = 0; i < 5; i++) {\n        ((i) => {\n            counterArray.push(() =>\
    \ {\n                console.log(`Counter: ${i}`);\n            });\n        })(i);\n\
    \    }\n    return counterArray;\n}\n\nconst counters = createCounterArray();\n\
    \ncounters.forEach(counter => counter());\n```\n\nIn this version, we introduce\
    \ the IIFE `((i) => {...})(i)` to create a new scope for each iteration of the\
    \ loop. This ensures that each closure function captures its own copy of `i` with\
    \ the correct value. Now, when you run the code, it will print the values 0, 1,\
