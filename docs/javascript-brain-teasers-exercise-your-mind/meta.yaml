    sequences of ones and zeros. Character encoding steps in to make sense of these
    binary bits and turn them into actual characters we understand.


    To pull this off, each character gets linked to a special number, known as a code
    point. So, for instance, take the black club suit character (♣)—it’s linked to
    the code point U+2663. When a character gets tied to a specific code point, it’s
    called an encoded character.


    In JavaScript, you have the ability to directly use the code point of a character
    by adding \u before the code point, as in this example:


    ```

    console.log("\u2663");    // → ♣

    ```


    When you write a string like that, you’re generating what’s referred to as a *Unicode
    escape sequence*. Unicode escape sequences are particularly useful when you want
    to use escape characters with special meanings in your code or display those hard-to-type
    characters, like foreign language characters, mathematical symbols, or even emojis.


