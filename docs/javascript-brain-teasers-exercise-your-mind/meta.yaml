    \n你可能预期输出是：\n\n```\nCounter: 0\nCounter: 1\nCounter: 2\nCounter: 3\nCounter: 4\n\
    ```\n\n但这段代码会输出：\n\n```\nCounter: 5\nCounter: 5\nCounter: 5\nCounter: 5\nCounter:\
    \ 5\n```\n\n### 讨论\n\n在这个谜题中，意图是创建一个闭包函数数组，每个函数打印变量 `i` 的当前值。然而，当你运行这段代码时，你会得到一个意想不到的结果。代码不是打印值\
    \ 0、1、2、3 和 4，而是打印五次值 5。\n\n这个结果是因为 `var` 具有函数级作用域，而不是块级作用域。在 `for` 循环中声明的变量 `i`\
    \ 在所有闭包函数之间共享。等到这些函数被调用时，`for` 循环已经执行完毕，`i` 的最终值是 5。\n\n修复此问题的一个简单方法是使用 `let`\
