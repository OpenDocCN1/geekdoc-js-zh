- md: "# Puzzle 6 The Fun-ction\n\n```javascript\nthe_fun-ction/the_fun-ction.js\n\
    \n!function() {\n  const name = \"john\";\n  const age = 20;\n}();\n\nconst capitalizedName\
    \ = name[0].toUpperCase() + name.slice(1);\n\nconsole.log(capitalizedName);\n\
    ```\n\n## Guess the Output\n\nTry to guess what the output is before moving to\
    \ the next page.\n\nYou might have expected the output to be the capitalized name\
    \ \"John\", but this code will actually log:\n\n```\nTypeError: Cannot read properties\
    \ of undefined\n```\n\n## Discussion\n\nThe problem in this code is that **name**\
    \ has what we call *function scope*, meaning it's accessible only within that\
    \ function. So, if you attempt to use the value of **name** out of the function,\
    \ you'll encounter a reference error because **name** is undefined in the outer\
    \ scope.\n\nThe function in this puzzle is known as an *immediately invoked function\
    \ expression* (IIFE). It's a handy design pattern that lets you execute a function\
    \ right after defining it. The best part is that it helps you create a separate\
    \ scope for your variables so you don't mess up the global namespace.\n\nWhen\
    \ it comes to defining IIFEs, there's actually more than one way to do it. Let's\
    \ dive in and explore the various forms of syntax you can use for IIFEs:\n\n1.\
    \ Traditional Parentheses Enclosure:\n\n```javascript\n(function() {\n  // function\
    \ body\n})();\n```\n\nIn this form, the IIFE is enclosed within parentheses. The\
    \ magic happens when we define the function inside those parentheses and then\
    \ immediately invoke it by adding another set of parentheses at the end. You can\
    \ also write this form with an arrow function, like this:\n\n```javascript\n(()\
    \ => {\n  // function body\n})();\n```\n\nThis syntax is widely used and considered\
    \ the standard way of writing IIFEs.\n\n2. Unary Operator Enclosure:\n\n```javascript\n\
    !function() {\n  // function body\n}();\n```\n\nIn this form, the IIFE is preceded\
    \ by the Logical NOT (!) operator. We define the function after the operator and\
    \ go ahead and immediately invoke it with (). Now, here's the fun part: you can\
    \ actually use other unary operators like +, -, or ~ if you feel like it. The\
    \ reason we use an operator is to make sure that the function is treated like\
    \ an expression. It's a shorthand way of saying, \"Execute this function immediately.\"\
    \n\n3. Grouping Operator Enclosure:\n\n```javascript\n(function() {\n  // function\
    \ body\n}());\n```\n\nThis form is similar to the traditional parentheses enclosure,\
    \ but the outer set of parentheses is placed around the whole IIFE expression.\
    \ We define the function inside the parentheses, and the inner pair of parentheses\
    \ () immediately invokes it.\n\n4. Function Declaration Enclosure:\n\n```javascript\n\
    (function namedIIFE() {\n  // function body\n})();\n```\n\nIn this form, the IIFE\
    \ is a named function expression enclosed within parentheses. Why do we give it\
    \ a name, you ask? Well, it’s all about making life easier when we’re checking\
    \ stack traces or using some fancy recursion inside the function. We define the\
    \ function inside parentheses and immediately invoke it with ().\n\nSo, we have\
    \ these different forms of IIFE that give us some flexibility when it comes to\
    \ writing self-executing functions. It’s totally up to you—your own personal preference\
    \ and coding style—to choose which syntax floats your boat. However, if you’re\
    \ collaborating in a team, you might prefer using the traditional parentheses\
    \ enclosure since more developers are familiar with its syntax.\n\n## Further\
    \ Reading\n\nIIFE definition\n<https://developer.mozilla.org/en-US/docs/Glossary/IIFE>\n\
    \nScope definition\n<https://developer.mozilla.org/en-US/docs/Glossary/Scope>\n\
    \n# Puzzle 7 How Long Is a Pirate Flag?\n\n```javascript\npirate_flag/pirate_flag.js\n\
    \n// Happy Flag Day!\n\nconst flag = \"\U0001F3F4‍☠️\";\nconsole.log(flag.length);\n\
    ```\n\n> **Guess the Output**\n\n⚠️ Try to guess what the output is before moving\
    \ to the next page.\n\nYou might have anticipated that the output would be 1,\
    \ but this code will actually output:\n\n```\n4\n```\n\n## Discussion\n\nThe length\
    \ of emojis may not be what you expect. In JavaScript, some characters and emojis\
    \ are formed by multiple code units, which can lead to unexpected results when\
    \ using the length property. The Pirate Flag emoji is called an Emoji ZWJ Sequence,\
    \ and it's made up of two separate emojis:\n\n\U0001F3F4‍☠️ = \U0001F3F4 + ☠️\n\
    \nWhen a zero-width joiner (ZWJ) is placed between these emojis, they are displayed\
    \ as a connected sequence on platforms that support it. The ZWJ itself is a non-printing\
    \ character that enables this connected display. The length of the Pirate Flag\
    \ emoji is 4 because the length property counts the code unit of each independent\
    \ emoji as well as the ZWJ required to connect them.\n\nIn the realm of JavaScript,\
    \ the sequence of code points `\\uD83C\\uDFF4` represents the black flag emoji,\
    \ while the solitary skull emoji is denoted by the code point `\\u2620`. When\
    \ combined, including the ZWJ in between, their collective length totals four\
    \ characters.\n\n## Variation Selectors Extend Emoji/Character Length\n\n\U0001F4A1\
    \ Unicode variation selectors are used to indicate specific variations or alternate\
    \ representations of a character or emoji, typically for purposes like skin tone\
    \ modifications or presentation style variations.\n\nIn many cases, a character\
    \ can be represented without a variation selector, and the default representation\
    \ will be used. The Pirate Flag emoji might include a variation selector, which\
    \ would increase the emoji's length from 4 to 5 characters. For more information\
    \ on the variation selector, please see the \"Further Reading\" section.\n\nTo\
    \ tackle this issue, we have the Internationalization API. It provides a handy\
    \ method called `Segmenter()` that helps you segment strings properly, taking\
    \ into account the intended segmentation rules of various languages and scripts:\n\
    \n```javascript\n// The correct way to calculate the length of emojis\n\nfunction\
    \ getLength(str) {\n  return [...new Intl.Segmenter().segment(str)].length;\n\
    }\n\ngetLength(\"\U0001F3F4‍☠️\");  // → 1\n```\n\nThe `Intl.Segmenter()` constructor\
    \ is a handy tool that allows you to break down a string based on a specific locale\
    \ and granularity. In this case, we're keeping it simple by using the default\
    \ settings, so you just call the method without any arguments. Just remember that\
    \ because `Intl.Segmenter()` is a constructor, you'll want to use it with the\
    \ `new` keyword.\n\nWhen you call `Intl.Segmenter()`, it gives you back an object\
    \ that has a `segment()` method. This method takes a string as its input and does\
    \ exactly what it sounds like—it divides the string into those segments that make\
    \ sense to humans. Because the result is an iterator, you can make life easier\
    \ by using the spread syntax, which is those three dots in a row (...). This syntax\
    \ allows you to quickly transform the iterator into an array and obtain its length.\n\
    \nIf the code seems a bit confusing, we've got an alternative version for you\
    \ to use:\n\n```javascript\npirate_flag/pirate_flag_ex2.js\n\nfunction getLength(str)\
    \ {\n  // Create a an instance of segmenter\n  const Segmenter = new Intl.Segmenter();\n\
    \n  // Segment the string\n  const segment = Segmenter.segment(str);\n\n  // Convert\
    \ it into an array\n  const arr = Array.from(segment);\n\n  // Return the number\
    \ of characters\n  return arr.length;\n}\n```\n\nThis version of the code performs\
    \ the same operations as the first one.\n\nThe Internationalization API is really\
    \ clever when it comes to counting ZWJ emojis. It treats them as a single character,\
    \ which makes things much easier for us. Whenever you need to get the length of\
    \ a string that may contain emojis or Unicode characters, consider using the `Intl.Segmenter()`\
    \ method.\n\n## Further Reading\n\nThe pirate flag emoji\n<http://www.unicode.org/L2/L2018/18059-pirate-flag.pdf>\n\
    \nGeneral variation sequences FAQ\n<http://unicode.org/faq/vs.xhtml>\n\nThe Intl.Segmenter\
    \ object\n<https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/Segmenter>\n\
    \nThe Internationalization API\n<https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl>\n\
    \nThe zero-width joiner\n<https://en.wikipedia.org/wiki/Zero-width_joiner>\n\n\
    # Puzzle 8 What's This?\n\n```javascript\nwhats_this/whats_this.js\n\nlet key\
    \ = 2049;\n\n(function() {\n    \"use strict\";\n    console.log(this.key);\n\
    })();\n```\n\n## Guess the Output\n\n![](img/7ad0e8939612afa723b8affa6c064dcf_43_0.png)\n\
    \nThis code will output:\n\n```\nTypeError: Cannot read properties of undefined\n\
    ```\n\n## Discussion\n\nThe `this` keyword in JavaScript can be a bit tricky because\
    \ its value depends on where the code is running and how it's being used. If you\
    \ run the code outside of any specific function or object, `this` refers to the\
    \ global object. In a web browser, the global object is usually `window`, and\
    \ in Node.js, it's `global`. So, if you run `console.log(this)` in a web browser's\
    \ console, you'll see the value of `window` printed out.\n\nBut here's the interesting\
    \ part: the value of `this` can change depending on the context. If you're inside\
    \ a function that is not part of an object, then `this` might be different. In\
    \ strict mode, it'll be `undefined`, and in non-strict mode, it'll be the global\
    \ object again."
  mdcn: "\n# 谜题 6 函数的妙用\n\n```javascript\nthe_fun-ction/the_fun-ction.js\n\n!function()\
    \ {\n  const name = \"john\";\n  const age = 20;\n}();\n\nconst capitalizedName\
    \ = name[0].toUpperCase() + name.slice(1);\n\nconsole.log(capitalizedName);\n\
    ```\n\n## 猜猜输出\n\n在继续下一页之前，试着猜猜输出是什么。\n\n你可能期望输出是首字母大写的 \"John\"，但这段代码实际上会输出：\n\
    \n```\nTypeError: Cannot read properties of undefined\n```\n\n## 讨论\n\n这段代码的问题在于\
    \ **name** 具有我们所谓的*函数作用域*，这意味着它只能在该函数内部被访问。因此，如果你试图在函数外部使用 **name** 的值，你会遇到引用错误，因为\
    \ **name** 在外部作用域中是未定义的。\n\n本谜题中的函数被称为*立即调用函数表达式*（IIFE）。这是一种方便的设计模式，允许你在定义函数后立即执行它。最棒的是，它帮助你为变量创建一个独立的作用域，这样就不会污染全局命名空间。\n\
    \n当谈到定义 IIFE 时，实际上有不止一种方法。让我们深入探索可以用于 IIFE 的各种语法形式：\n\n1. 传统括号包围：\n\n```javascript\n\
    (function() {\n  // 函数体\n})();\n```\n\n这种形式将 IIFE 包裹在括号中。魔法发生在我们定义了括号内的函数，然后通过在末尾添加另一组括号立即调用它。你也可以用箭头函数来写这种形式，像这样：\n\
    \n```javascript\n(() => {\n  // 函数体\n})();\n```\n\n这种语法被广泛使用，被认为是编写 IIFE 的标准方式。\n\
    \n2. 一元运算符包围：\n\n```javascript\n!function() {\n  // 函数体\n}();\n```\n\n在这种形式中，IIFE\
    \ 前面是逻辑非 (!) 运算符。我们在运算符之后定义函数，然后立即用 () 调用它。有趣的是：实际上你也可以使用其他一元运算符，如 +、- 或 ~，如果你愿意的话。使用运算符的原因是为了确保函数被视为表达式。这是一种简写方式，意思是“立即执行此函数”。\n\
    \n3. 分组运算符包围：\n\n```javascript\n(function() {\n  // 函数体\n}());\n```\n\n这种形式与传统括号包围类似，但外层括号是包裹整个\
    \ IIFE 表达式的。我们在括号内定义函数，内部的括号对 () 立即调用它。\n\n4. 函数声明包围：\n\n```javascript\n(function\
    \ namedIIFE() {\n  // 函数体\n})();\n```\n\n在这种形式中，IIFE 是一个命名的函数表达式，包裹在括号内。你可能会问，为什么要给它命名？嗯，这完全是为了在检查堆栈跟踪或在函数内部使用一些高级递归时让生活更轻松。我们在括号内定义函数，然后立即用\
    \ () 调用它。\n\n所以，我们有这些不同形式的 IIFE，它们在编写自执行函数时为我们提供了一些灵活性。完全取决于你——你个人的偏好和编码风格——来选择哪种语法最适合你。然而，如果你在团队中协作，你可能更喜欢使用传统括号包围，因为更多的开发者熟悉它的语法。\n\
    \n## 延伸阅读\n\nIIFE 定义\n<https://developer.mozilla.org/en-US/docs/Glossary/IIFE>\n\
    \n作用域定义\n<https://developer.mozilla.org/en-US/docs/Glossary/Scope>\n\n# 谜题 7 海盗旗有多长？\n\
    \n```javascript\npirate_flag/pirate_flag.js\n\n// 旗帜日快乐！\n\nconst flag = \"\U0001F3F4\
    ‍☠️\";\nconsole.log(flag.length);\n```\n\n> **猜猜输出**\n\n⚠️ 在继续下一页之前，试着猜猜输出是什么。\n\
    \n你可能预期输出是 1，但这段代码实际上会输出：\n\n```\n4\n```\n\n## 讨论\n\n表情符号的长度可能并非你所期望的那样。在 JavaScript\
    \ 中，一些字符和表情符号由多个代码单元组成，这在使用 `length` 属性时可能导致意外的结果。海盗旗表情符号被称为 Emoji ZWJ 序列，它由两个独立的表情符号组成：\n\
    \n\U0001F3F4‍☠️ = \U0001F3F4 + ☠️\n\n当零宽连接符 (ZWJ) 放置在这些表情符号之间时，在支持它们的平台上，它们会显示为一个连接的序列。ZWJ\
    \ 本身是一个非打印字符，它实现了这种连接显示。海盗旗表情符号的长度为 4，因为 `length` 属性计算了每个独立表情符号的代码单元以及连接它们所需的\
    \ ZWJ。\n\n在 JavaScript 领域中，代码点序列 `\\uD83C\\uDFF4` 代表黑色旗帜表情符号，而单独的骷髅表情符号由代码点 `\\\
    u2620` 表示。当它们组合在一起时，包括中间的 ZWJ，它们的总长度为四个字符。\n\n## 变体选择器扩展表情符号/字符长度\n\n\U0001F4A1\
    \ Unicode 变体选择器用于表示字符或表情符号的特定变体或替代表示，通常用于肤色修改或显示样式变体等目的。\n\n在许多情况下，字符可以在没有变体选择器的情况下表示，并使用默认表示。海盗旗表情符号可能包含变体选择器，这将使表情符号的长度从\
    \ 4 个字符增加到 5 个字符。有关变体选择器的更多信息，请参阅“延伸阅读”部分。\n\n为了处理这个问题，我们有国际化 API。它提供了一个方便的方法\
    \ `Segmenter()`，可以帮助你正确地分割字符串，考虑到各种语言和书写系统的预期分割规则：\n\n```javascript\n// 计算表情符号长度的正确方式\n\
    \nfunction getLength(str) {\n  return [...new Intl.Segmenter().segment(str)].length;\n\
    }\n\ngetLength(\"\U0001F3F4‍☠️\");  // → 1\n```\n\n`Intl.Segmenter()` 构造函数是一个方便的工具，允许你根据特定的区域设置和粒度来分解字符串。在这种情况下，我们保持简单，使用默认设置，所以你只需调用该方法而无需任何参数。请记住，因为\
    \ `Intl.Segmenter()` 是一个构造函数，你需要用 `new` 关键字来使用它。\n\n当你调用 `Intl.Segmenter()` 时，它会返回一个具有\
    \ `segment()` 方法的对象。这个方法接受一个字符串作为输入，并且正如它的名字所示——它将字符串分成对人类有意义的那些部分。因为结果是一个迭代器，你可以通过使用扩展语法（也就是那三个连续的点\
    \ `...`）来让生活更轻松。这种语法允许你快速将迭代器转换为数组并获取其长度。\n\n如果代码看起来有点困惑，我们为你准备了一个替代版本：\n\n```javascript\n\
    pirate_flag/pirate_flag_ex2.js\n\nfunction getLength(str) {\n  // 创建一个 segmenter\
    \ 实例\n  const Segmenter = new Intl.Segmenter();\n\n  // 分割字符串\n  const segment\
    \ = Segmenter.segment(str);\n\n  // 转换为数组\n  const arr = Array.from(segment);\n\
    \n  // 返回字符数量\n  return arr.length;\n}\n```\n\n这个版本的代码执行的操作与第一个版本相同。\n\n国际化 API\
    \ 在计算 ZWJ 表情符号方面非常聪明。它将它们视为单个字符，这让我们的事情变得容易得多。每当你需要获取可能包含表情符号或 Unicode 字符的字符串的长度时，请考虑使用\
    \ `Intl.Segmenter()` 方法。\n\n## 延伸阅读\n\n海盗旗表情符号\n<http://www.unicode.org/L2/L2018/18059-pirate-flag.pdf>\n\
    \n通用变体序列常见问题解答\n<http://unicode.org/faq/vs.xhtml>\n\nIntl.Segmenter 对象\n<https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/Segmenter>\n\
    \n国际化 API\n<https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl>\n\
    \n零宽连接符\n<https://en.wikipedia.org/wiki/Zero-width_joiner>\n\n# 谜题 8 这是什么？\n\n\
    ```javascript\nwhats_this/whats_this.js\n\nlet key = 2049;\n\n(function() {\n\
    \    \"use strict\";\n    console.log(this.key);\n})();\n```\n\n## 猜猜输出\n\n![](img/7ad0e8939612afa723b8affa6c064dcf_43_0.png)\n\
    \n这段代码将输出：\n\n```\nTypeError: Cannot read properties of undefined\n```\n\n## 讨论\n\
    \nJavaScript 中的 `this` 关键字可能有点棘手，因为它的值取决于代码运行的位置以及使用方式。如果你在任何特定函数或对象之外运行代码，`this`\
    \ 指的是全局对象。在 Web 浏览器中，全局对象通常是 `window`，在 Node.js 中，它是 `global`。因此，如果你在 Web 浏览器的控制台中运行\
    \ `console.log(this)`，你会看到 `window` 的值被打印出来。\n\n但有趣的部分在于：`this` 的值可以根据上下文而改变。如果你在一个不属于对象的函数内部，那么\
    \ `this` 可能会不同。在严格模式下，它将是 `undefined`，在非严格模式下，它将再次是全局对象。\n"
