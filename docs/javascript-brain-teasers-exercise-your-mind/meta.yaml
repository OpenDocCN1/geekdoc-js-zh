    \ : (response === \"off\") ? 0 : undefined;\n```\n\n在这个小测验中，我们使用了一个额外的巧妙技巧，让代码更加紧凑！我们使用一个对象来将响应映射到对应的状态值：\"\
    on\" 映射到 1，\"off\" 映射到 0。\n\n这里发生了什么：在 JavaScript 中，当使用方括号访问对象属性时，括号内的值被视为一个键。因此，`{on:1,\
    \ off:0}[response]` 本质上是访问键与 `response` 值匹配的属性的值。由于 `response` 是 `\"on\"`，表达式被计算为\
