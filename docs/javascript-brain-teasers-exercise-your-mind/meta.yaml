    ## 现代异步 JavaScript


    ![](img/7ad0e8939612afa723b8affa6c064dcf_110_1.png)


    当今的 JavaScript 必须与数据密集型 API 和网络进行交互。解决方案是一个可以异步工作的程序，而不是按顺序完成任务。在现代 JavaScript
    中，您将使用 promise 而不是回调来提高应用程序的性能和响应能力。ES2020、ES2021 和 ESNext 中引入的 JavaScript 特性，如
    Promise.allSettled()、Promise.any() 和顶级 await，可帮助您开发小巧、快速、低调的应用程序。借助 AbortController
    API，您可以在挂起的异步请求完成之前取消它。《现代异步 JavaScript》为您提供了一套工具集，用于构建始终响应用户请求、从困难条件中快速恢复并提供最大性能的程序。


    Faraz K. Kelhini


    (77 页) ISBN: 9781680509045 $14.99


