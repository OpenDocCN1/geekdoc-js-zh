- md: " ## Puzzle 16 Waiting in Line\n\nwaiting_in_line/waiting_in_line.js\n\n```\n\
    console.log(\"Start\");\n\nsetTimeout(() => {\n    console.log(\"Timeout\");\n\
    }, 0);\n\nPromise.resolve().then(() => {\n    console.log(\"Promise\");\n});\n\
    \nconsole.log(\"End\");\n```\n\n## Guess the Output\n\nTry to guess what the output\
    \ is before moving to the next page.\n\nYou might have anticipated that the output\
    \ would be:\n\n- Start\n- Timeout\n- Promise\n- End\n\nBut the code will output:\n\
    \n- Start\n- End\n- Promise\n- Timeout\n\n## Discussion\n\nHere, we have a mixture\
    \ of synchronous and asynchronous operations and use `console.log()` to output\
    \ different messages at various points in the code. Since the `setTimeout()` is\
    \ set to 0 milliseconds, you might expect the messages to appear in the order\
    \ of \"Start\", \"Timeout\", \"Promise\", and \"End\". But, the actual output\
    \ is different because of the event loop and how JavaScript handles asynchronous\
    \ tasks.\n\nThe event loop is an important part of JavaScript that ensures code\
    \ execution happens in a non-blocking way. It takes care of tasks like managing\
    \ asynchronous operations, timers, and callbacks.\n\nIn this puzzle, we have two\
    \ asynchronous tasks: a `setTimeout` and a `Promise`. The `setTimeout()` function\
    \ allows us to schedule a callback function to run after a specific delay. However,\
    \ even though we set the delay to 0, the callback function isn't immediately executed.\
    \ Instead, it's added to the event queue, waiting for the event loop to finish\
    \ executing the current synchronous code before it gets its turn.\n\nAfter that,\
    \ we have a `Promise.resolve()` statement. Promises are a way to handle asynchronous\
    \ operations in JavaScript. Here, we create a promise using `Promise.resolve()`,\
    \ which immediately resolves the promise with a value of `undefined`. We then\
    \ attach a `.then()` method to the promise, which allows us to specify a function\
    \ to execute once the promise is resolved. In this example, the function logs\
    \ the message \"Promise\" to the console.\n\nUnlike `setTimeout()`, the `Promise.resolve().then`\
    \ code is scheduled to run in the next microtask checkpoint, which happens before\
    \ the event queue is processed. Now, when both the `setTimeout()` and the `Promise`\
    \ are present in the code, the following sequence of events occurs:\n\n1. The\
    \ synchronous code is executed.\n2. The `setTimeout` callback is placed in the\
    \ event queue.\n3. The `Promise` callback is executed immediately.\n4. The event\
    \ loop picks up the `setTimeout` callback from the event queue and executes it.\n\
    \nIt's important to note that even though the delay in the `setTimeout()` function\
    \ is set to 0 milliseconds, the actual delay can vary depending on the workload\
    \ of the JavaScript engine and other factors. This behavior might seem unexpected\
    \ if you're not familiar with JavaScript's event loop and asynchronous execution.\n\
    \n### Further Reading\n\n- *Introducing asynchronous JavaScript*\n  [https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Asynchronous/Introducing](https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Asynchronous/Introducing)\n\
    \n- *The Promise.resolve() static method*\n  [https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/resolve](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/resolve)\n\
    \n- *The setTimeout() method*\n  [https://developer.mozilla.org/en-US/docs/Web/API/setTimeout](https://developer.mozilla.org/en-US/docs/Web/API/setTimeout)\n\
    \n## Puzzle 17 Chasing Promises\n\n```\nchasing_promises/chasing_promises.js\n\
    ```\n\n```\nconsole.log(\"Application started\");\n\nasync function fetchDataFromAPI()\
    \ {\n    console.log(\"Fetching data from API...\");\n    await processAPIData();\n\
    \    console.log(\"Data fetched successfully\");\n}\n\nasync function processAPIData()\
    \ {\n    console.log(\"Processing API data...\");\n}\n\nfetchDataFromAPI();\n\n\
    console.log(\"Application ended\");\n```\n\n## Guess the Output\n\nTry to guess\
    \ what the output is before moving to the next page.\n\nYou might have expected\
    \ the output to be:\n\n```\nApplication started\nApplication ended\nFetching data\
    \ from API...\nProcessing API data...\nData fetched successfully\n```\n\nBut this\
    \ code will actually output:\n\n```\nApplication started\nFetching data from API...\n\
    Processing API data...\nApplication ended\n```\n\n## Discussion\n\nThe `await`\
    \ keyword allows you to write asynchronous code in a more linear fashion, making\
    \ it easier to understand the flow of execution, even when dealing with operations\
    \ that take time to complete.\n\nFirst, we have the synchronous `console.log(\"\
    Application started\")` that simply logs the string \"Application started\" to\
    \ the console. Then we have `async function fetchDataFromAPI() { ... }`, which\
    \ declares an asynchronous function. Asynchronous functions can use the `await`\
    \ keyword to pause their execution while waiting for a promise to resolve.\n\n\
    Inside the function, `await processAPIData()` uses the `await` keyword to pause\
    \ the execution of the `fetchDataFromAPI` function until the `processAPIData`\
    \ function completes its execution. In this case, since `processAPIData` is an\
    \ asynchronous function, it returns a promise, and `await` ensures that the program\
    \ will wait for that promise to be resolved before proceeding.\n\nTo summarize\
    \ the sequence of events:\n\n- The code starts by logging \"Application started\"\
    .\n- The `fetchDataFromAPI` function is called, which logs \"Fetching data from\
    \ API...\", and awaits the completion of the `processAPIData` function.\n- Inside\
    \ the `processAPIData` function, \"Processing API data...\" is logged.\n- The\
    \ script then logs \"Application ended\", as it is now allowed to continue to\
    \ execute outside the `fetchDataFromAPI` function.\n- Finally, \"Data fetched\
    \ successfully\" is logged.\n\nSo, the `await` keyword is helpful when you have\
    \ tasks that take time, like talking to a server, and you want to make sure they\
    \ happen in a smooth sequence. Here, the code waits for `fetchDataFromAPI()` and\
    \ `processAPIData()` to finish their tasks before moving on. As a result, things\
    \ happen in a different order.\n\n### Further Reading\n\n- *Modern Asynchronous\
    \ JavaScript*\n  > https://pragprog.com/titles/fkajs/modern-asynchronous-javascript/\n\
    \n- *The Promise object*\n  > https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise\n\
    \n- *The await operator*\n  > https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/await\n\
    \n## Puzzle 18 Oo Na Na Na\n\n```\noo_na_na_na/oo_na_na_na.js\n\nlet price = 10;\n\
    let tax;\n\nconst sum = price + tax;\n\nconsole.log(sum);\n```\n\n## Guess the\
    \ Output\n\nTry to guess what the output is before moving to the next page.\n\n\
    You might have expected the output to be **10**, but this code will actually log:\n\
    \n```\nNaN\n```\n\n## Discussion\n\nIn this puzzle, the statement `const tax;`\
    \ declares a constant variable without assigning any value to it. So, the variable\
    \ holds a default value of `undefined`. When trying to add `undefined` to the\
    \ value of `price`, the operation yields `NaN` (Not-a-Number).\n\n`NaN` is a special\
    \ value in JavaScript that represents the result of an invalid or undefined mathematical\
    \ operation. You may encounter `NaN` when doing math operations that don't produce\
    \ a meaningful numeric value, like trying to divide zero by zero or taking the\
    \ square root of a negative number.\n\nHere are some JavaScript operations that\
    \ would result in `NaN`:\n\n1. When dividing a zero by zero\n2. Attempting to\
    \ convert a non-numeric string to a number\n3. Parsing an invalid floating-point\
    \ notation\n4. Performing a mathematical operation involving **NaN**\n5. Using\
    \ an undefined variable in a math operation\n6. Taking the square root of a negative\
    \ number\n7. Performing certain mathematical operations with **Infinity**\n\n\
    ```\n0 / 0;    // → NaN\n```\n\n```\nNumber(\"hello\");    // → NaN\n```\n\n```\n\
    parseFloat(\"abc\");    // → NaN\n```\n\n```\nNaN + 5;    // → NaN\n```\n\n```\n\
    let x;\nx + 10;    // → NaN\n```\n\n```\nMath.sqrt(-9);    // → NaN\n```\n\n```\n\
    Infinity - Infinity;    // → NaN\n```\n\nThese operations all result in **NaN**\
    \ because they involve operations that don't produce meaningful numeric results\
    \ according to JavaScript's specifications.\n\nNow, here's the tricky part. You\
    \ can't use the strict equality operator to check if the result of an operation\
    \ is **NaN**:\n\n```\noo_na_na_na/oo_na_na_na_ex1.js\n\nlet price = 10;\nlet tax;\n\
    \nconst sum = price + tax;\n```"
