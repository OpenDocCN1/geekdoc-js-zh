    But the syntax can sometimes get a bit wordy. Some developers make the code shorter
    by using the ternary operator:


    ```

    let response = "on";

    let state = (response === "on") ? 1 : (response === "off") ? 0 : undefined;

    ```


    In this teaser, we''re using an extra nifty trick to make the code even more compact!
    We use an object to map the response to corresponding state values: "on" maps
    to 1 and "off" maps to 0.


    Here''s what''s happening: in JavaScript, when using square brackets to access
    an object property, the value inside the brackets is treated as a key. So, {on:1,
    off:0}[response] is essentially accessing the value of the property whose key
    matches the value of the response. Since the response is "on", the expression
    evaluates to {on:1, off:0}["on"], which returns the value 1. It''s like a hack
    to squeeze out some extra brevity.


