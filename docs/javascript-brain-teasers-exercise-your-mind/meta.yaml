    \ You can also write this form with an arrow function, like this:\n\n```\n(()\
    \ => {\n  // function body\n})();\n```\n\nThis syntax is widely used and considered\
    \ the standard way of writing IIFEs.\n\n2. Unary Operator Enclosure:\n\n```\n\
    !function() {\n  // function body\n}();\n```\n\nIn this form, the IIFE is preceded\
    \ by the Logical NOT (!) operator. We define the function after the operator and\
    \ go ahead and immediately invoke it with (). Now, here's the fun part: you can\
    \ actually use other unary operators like +, -, or ~ if you feel like it. The\
    \ reason we use an operator is to make sure that the function is treated like\
    \ an expression. It's a shorthand way of saying, \"Execute this function immediately.\"\
    \n\n3. Grouping Operator Enclosure:\n\n```\n(function() {\n  // function body\n\
    }());\n```"
