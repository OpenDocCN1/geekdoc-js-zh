    permitted. The reason behind this restriction is that the resulting value may
    not be accurately representable by either BigInt or Number data types.


    Let''s take a look at the following example to better understand this:


    ```

    10000000000000000n + 0.5;

    // → TypeError: Cannot mix BigInt and other types, use explicit conversions

    ```


    Converting a Number with a fractional part to a BigInt may not yield an accurate
    representation, just as converting a BigInt larger than 2^53 to a Number may also
    result in loss of precision.


    When performing arithmetic computations involving both BigInt and Number values,
    you have to choose the domain in which the operation should take place. Convert
    either of the operands by using the functions **Number()** or **BigInt()**:


    ```

    // convert the Number to a BigInt

    BigInt(5) + 5n;   // → 10n


    // or convert the BigInt to a Number

    5 + Number(5n);   // → 10

    ```


    There are some subtle differences between a Number and a BigInt. You can use all
    arithmetic operators on a BigInt except for the unary plus (+) operator:


    ```

    console.log(1n + 2n);   // → 3n

    console.log(1n - 2n);   // → -1n

    console.log(1n * 2n);   // → 2n

    console.log(2n / 1n);   // → 2n

    console.log(14n % 10n); // → 4n

    console.log(5n ** 3n);  // → 125n


    let x = 1n;

    console.log(++x); // → 2n

    console.log(--x); // → 1n

    console.log(-x);  // → -1n

    console.log(+x);  // → TypeError: Cannot convert a BigInt value to a Number

    ```'
  - '[PAGE 27]


    The unary plus (+) operator is not supported for a reason. Some programs may depend
    on the fact that the + operator always results in a Number or throws an exception.
    By not supporting it, JavaScript ensures that your code remains reliable and consistent.


    When you use arithmetic operators with BigInt operands, you would expect them
    to return a BigInt value. So, when it comes to the division (/) operator, the
    result is automatically truncated to maintain consistency with this expectation:


    ```

    console.log(12 / 5);      // → 2.4

    console.log(12n / 5n);    // → 2n

    ```


    When it comes to comparing a BigInt with a regular number, remember that they
    are not of the same type. This means you can''t use the strict equality operator
    (===) directly to compare them:


    ```

    console.log(1n === 1);     // → false

    console.log(typeof 1n);    // → bigint

    console.log(typeof 1);     // → number

    ```


    However, you do have the option to use the equality operator (==), which automatically
    converts the types of its operands (known as *type coercion*) before comparing
    them:


    ```

    console.log(10n == 10);    // → true

    ```


    It''s worth mentioning that you should also avoid passing a BigInt as an argument
    to built-in JavaScript functions and APIs that specifically require a Number.
    Doing so will trigger a TypeError, as in this example:


    ```

    Math.min(5n, 10n, 15n);   // → TypeError

    ```


    So, you should use the Number data type when dealing with regular numeric values
    that fall within the range of -9007199254740991 and 9007199254740991, which is
    suitable for most everyday calculations.'
- md: "On the other hand, you should opt for the BigInt data type when working with\
    \ exceptionally large integer values that exceed the safe limits of the Number\
    \ type, as BigInt allows for arbitrary precision arithmetic and can accurately\
    \ represent and manipulate integers of any size, albeit at a potential performance\
    \ cost.\n\n## Further Reading\n\n*The BigInt value*\n[https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/BigInt](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/BigInt)\n\
    \n## Puzzle 4 Mortal Koncatenation\n\n```js\n// mortal_koncatenation/mortal_koncatenation.js\n\
    \nconst femaleMKCharacters = [\n  \"Sonya Blade\",\n  \"Sindel\",\n  \"Cassie\
    \ Cage\",\n  \"Sheeva\"\n];\n\nconst maleMKCharacters = [\n  \"Scorpion\",\n \
    \ \"Sub-Zero\",\n  \"Raiden\",\n  \"Johnny Cage\"\n];\n\nconst MKCharacters =\
    \ femaleMKCharacters + maleMKCharacters;\n\nconsole.log(MKCharacters);\n```\n\n\
    ## Guess the Output\n\nTry to guess what the output is before moving to the next\
    \ page.\n\nYou might have anticipated that the output would be a merged array,\
    \ but this code will actually output:\n\n```\nSonya Blade,Sindel,Cassie Cage,SheevaScorpion,Sub-Zero,Raiden,Johnny\
    \ Cage\n```\n\n## Discussion\n\nThis JavaScript code defines two arrays: `femaleMKCharacters`\
    \ and `maleMKCharacters`. The `femaleMKCharacters` array contains the names of\
    \ female characters from the Mortal Kombat video game series, whereas the `maleMKCharacters`\
    \ array contains the names of male characters from the same game.\n\nThe puzzle\
    \ then attempts to combine two arrays into one big array using the + operator.\
    \ But here's the problem: when you use the + operator with arrays in JavaScript,\
    \ it doesn't merge them as you might expect. Instead, it treats them as strings\
    \ and does string concatenation. So, the end result is that `MKCharacters` becomes\
    \ a single string that smashes the two arrays together as if they were strings.\n\
    \nFortunately, there are multiple ways to combine two arrays. Here are a few common\
    \ approaches:\n\n1. `concat()`: A quick way to combine two arrays is by using\
    \ `concat()`. This method creates a new array that includes the elements from\
    \ both arrays:\n\n```js\n// mortal_koncatenation/mortal_koncatenation_ex1.js\n\
    \nconst array1 = [1, 2, 3];\nconst array2 = [4, 5, 6];\nconst combinedArray =\
    \ array1.concat(array2);\n\nconsole.log(combinedArray);  // → [1, 2, 3, 4, 5,\
    \ 6]\n```\n\nYou can also use `concat()` when you have a variable number of arrays\
    \ to concatenate or if you need to concatenate arrays dynamically based on certain\
    \ conditions.\n\n2. Spread Operator: The spread operator (`...`) is a newer feature\
    \ introduced in ECMAScript 2015 (ES6) that provides a concise way to combine arrays.\
    \ It unpacks the elements of each array and creates a new array with all the elements:\n\
    \n```js\n// mortal_koncatenation/mortal_koncatenation_ex2.js\n\nconst array1 =\
    \ [1, 2, 3];\nconst array2 = [4, 5, 6];\nconst combinedArray = [...array1, ...array2];\n\
    \nconsole.log(combinedArray);    // → [1, 2, 3, 4, 5, 6]\n```\n\nCompared to `concat()`,\
    \ the spread operator is more readable, especially when you only need to combine\
    \ a couple of arrays.\n\n3. **push() or unshift()**: You can also use array manipulation\
    \ methods like `push()` or `unshift()` to merge arrays:\n\n```js\n// mortal_koncatenation/mortal_koncatenation_ex3-1.js\n\
    \nconst array1 = [1, 2, 3];\nconst array2 = [4, 5, 6];\n\n// Combining arrays\
    \ using push()\narray1.push(...array2);\nconsole.log(array1);    // → [1, 2, 3,\
    \ 4, 5, 6]\n```\n\n```js\n// mortal_koncatenation/mortal_koncatenation_ex3-2.js\n\
    \nconst array1 = [1, 2, 3];\nconst array2 = [4, 5, 6];\n\n// Combining arrays\
    \ using unshift()\narray1.unshift(...array2);\nconsole.log(array1);    // → [4,\
    \ 5, 6, 1, 2, 3]\n```\n\nThe `push()` method appends the elements of the second\
    \ array to the end of the first array, while `unshift()` adds them to the beginning.\n\
    \n4. **splice()**: If you want to insert the elements of an array into another\
    \ array at a specific index, you can use the `splice()` method:\n\n```js\n// mortal_koncatenation/mortal_koncatenation_ex4.js\n\
    \nconst array1 = [1, 2, 3];\nconst array2 = [4, 5, 6];\n\n// Assuming you want\
    \ to add array2 to array1 at index 2\nconst insertIndex = 2;\n\n// Using splice()\
    \ to insert the elements of array2 into array1\narray1.splice(insertIndex, 0,\
    \ ...array2);\n\nconsole.log(array1); // → [1, 2, 4, 5, 6, 3]\n```\n\nThese are\
    \ some of the common ways to combine two arrays in JavaScript. Keep in mind that\
    \ `concat()` and the spread operator do not alter the existing arrays; instead,\
    \ they return a new array. On the contrary, `push()`, `unshift()`, and `splice()`\
    \ modify the contents of the array they are applied to. Choose the method that\
    \ best suits your specific requirements and coding style.\n\n## Further Reading\n\
    \nA complete list of available array methods: [https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array#instance_methods](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array#instance_methods)\n\
    \n## Puzzle 5 Offbeat Identifierz\n\n```js\n// offbeat_identifierz/offbeat_identifierz.js\n\
    \nlet シ = \"\\u2663\";\n\nconsole.log(シ);\n```\n\n> ## Guess the Output\n\nTry\
    \ to guess what the output is before moving to the next page.\n\nThis code will\
    \ output:\n\n♣\n\n## Discussion\n\nYou might be surprised that シ (which is a Japanese\
    \ character called \"shi\") is a valid identifier in JavaScript and that \"\\\
    u2663\" converts to a single character. But, in JavaScript, you can use a wide\
    \ range of Unicode characters as identifiers. Surprisingly, not many developers\
    \ know about this cool feature.\n\nAnd that's not all! You can also make use of\
    \ Unicode escape sequences to rescue yourself from special characters that hold\
    \ meaning in your code or to display those tricky-to-type characters, including\
    \ foreign language characters, mathematical symbols, and even emojis.\n\nSince\
    \ ECMAScript 2015, you can use most Unicode characters as an identifier in JavaScript.\
    \ According to the ECMAScript specification, JavaScript allows the use of Unicode\
    \ characters in identifiers for variables, functions, classes, and other language\
    \ constructs.\n\nHere's a function with an identifier in the Persian language:\n\
    \n```js\n// offbeat_identifierz/offbeat_identifierz_ex1.js\n\nfunction سلام()\
    \ {\n  return \"Hello\";\n}\n\nسلام();     // → \"Hello\"\n```\n\n> **Avoid Copy-Pasting\
    \ from PDF**\n>\n> If you want to try this code, don't just copy-paste it from\
    \ the PDF because it might not grab all those fancy Unicode characters. Instead,\
    \ click on the small gray box located above the code segment to retrieve the JavaScript\
    \ file.\n\nHowever, there are some restrictions on the characters that can be\
    \ used:\n\n- The first character of an identifier must be a Unicode letter (category\
    \ L), an underscore (_), a dollar sign ($), or a Unicode escape sequence.\n- Subsequent\
    \ characters can be letters, digits, underscores, dollar signs, or Unicode escape\
    \ sequences (we'll talk about Unicode escape sequences shortly).\n- Reserved words\
    \ and keywords cannot be used as identifiers (for a list of reserved words, visit\
    \ MDN)⁴.\n\nUsing Unicode characters as an identifier can be quite convenient,\
    \ but it's important to consider how it can potentially complicate the lives of\
    \ your fellow programmers. So, I recommend sticking to the tried-and-true ASCII\
    \ for the sake of everyone's convenience.\n\nNow, let's go back to our puzzle,\
    \ where we assigned \\u2663 to a constant. The visuals displayed on computers\
    \ represent binary information comprising sequences of ones and zeros. Character\
    \ encoding steps in to make sense of these binary bits and turn them into actual\
    \ characters we understand.\n\nTo pull this off, each character gets linked to\
    \ a special number, known as a code point. So, for instance, take the black club\
    \ suit character (♣)—it's linked to the code point U+2663. When a character gets\
    \ tied to a specific code point, it's called an encoded character.\n\nIn JavaScript,\
    \ you have the ability to directly use the code point of a character by adding\
    \ \\u before the code point, as in this example:\n\n```js\nconsole.log(\"\\u2663\"\
    );    // → ♣\n```\n\nWhen you write a string like that, you're generating what's\
    \ referred to as a *Unicode escape sequence*. Unicode escape sequences are particularly\
    \ useful when you want to use escape characters with special meanings in your\
    \ code or display those hard-to-type characters, like foreign language characters,\
    \ mathematical symbols, or even emojis.\n\n## Further Reading\n\n*Valid JavaScript\
    \ variable names in ES2015*\nhttps://mathiasbynens.be/notes/javascript-identifiers-es6\n\
    \n*Information about the Unicode character ェ (U+30B7)*\nhttps://compart.com/en/unicode/U+30B7\n\
    \n*Identifier definition*\nhttps://developer.mozilla.org/en-US/docs/Glossary/Identifier\n\
    \n*Unicode character properties*\nhttps://unicode.org/versions/Unicode15.0.0/ch04.pdf"
