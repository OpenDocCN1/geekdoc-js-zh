    # Puzzle 28 Negative Gravity


    ```

    negative_gravity/negative_gravity.js


    console.log(7 - - 5)

    console.log(7 - -5)

    console.log(7- -5)

    console.log(7--5)

    ```


    # Guess the Output


    > Try to guess what the output is before moving to the next page.


    This code will output:


    ```

    12

    12

    12

    SyntaxError: invalid increment/decrement operand

    ```


    # Discussion


    The minus sign (-) is usually used for subtraction, but here we have two minus
    signs next to each other. So, the - is applied twice to the second operand, effectively
    negating the value twice. Since negating a negative number results in a positive
    number, the expression **7 - - 5** is effectively interpreted as **7 - (-5)**,
    which simplifies to **7 + 5**. Consequently, the expression evaluates to the number
    **12**.


    The expression on the second line, **7 - -5**, is similar to the first one. It
    correctly subtracts the value **-5** from **7**. The result is **12**. **7- -5**
    also correctly subtracts the value **-5** from **7**. Just like the previous two
    expressions, the result is **12**.'
  - "[PAGE 104]\n\nThe fourth expression, 7--5, is different. There are two consecutive\
    \ minus signs without any space in between. In JavaScript, -- is treated as the\
    \ decrement operator, which is used to decrease a variable's value by 1. Since\
    \ there are no variables here, this expression will result in a syntax error because\
    \ it's not a valid operation.\n\nSo, similar to mathematical operations in the\
    \ real world, subtracting a negative number from another number is equivalent\
    \ to adding the positive value of that number. But, there is a caveat when there's\
    \ no space between the first minus sign and the second one, in which case the\
    \ expression is interpreted as the decrement operator.\n\n# Further Reading\n\n\
    *The decrement operator*  \nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Decrement\n\
