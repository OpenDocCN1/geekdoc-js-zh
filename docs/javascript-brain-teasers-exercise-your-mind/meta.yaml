    \ `Symbol()` function and call it `name`. It's like giving our symbol a special\
    \ label.\n\nNext, we add a new piece of information to our country object. Using\
    \ the symbol `name` as the key, we set a value of `Holland`. Think of it as adding\
    \ a hidden note to our country object. We use square brackets to access the property\
    \ with the symbol key, like `country[name]`.\n\nNow, if we print `country[name]`\
    \ to the console, it will show us the value associated with the symbol key `name`,\
    \ which is `Holland`. On the other hand, if we print `country[\"name\"]` to the\
    \ console, it will show us the value associated with the regular string key `name`.\
    \ We initially set this value to `Netherlands`, so when we print it, we see `Netherlands`\
    \ in the console.\n\nSymbols are useful when we want to create properties that\
    \ are not easily accessible or visible from the outside. They provide a way to\
    \ add hidden or private information to objects. Since symbols are unique, we don't\
    \ have to worry about accidentally overlapping or conflicting with other property\
    \ names.\n\n### Further Reading\n\n*Detailed overview of symbols*\nhttps://exploringjs.com/es6/ch_symbols.xhtml\n\
    \n*The symbol object*\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Symbol\n\
    \n## Puzzle 14 The Permanent Closure\n\n```\nthe_permanent_closure/the_permanent_closure.js\n\
    \nfunction createCounterArray() {\n  const counterArray = [];\n  for (var i =\
    \ 0; i < 5; i++) {\n    counterArray.push(() => {\n      console.log(`Counter:\
    \ ${i}`);\n    });\n  }\n  return counterArray;\n}\n\nconst counters = createCounterArray();\n\
    counters.forEach(counter => counter());\n```\n\n### Guess the Output\n\nTry to\
    \ guess what the output is before moving to the next page.\n\nYou might have expected\
    \ the output to be:\n\n```\nCounter: 0\nCounter: 1\nCounter: 2\nCounter: 3\nCounter:\
    \ 4\n```\n\nBut this code will output:\n\n```\nCounter: 5\nCounter: 5\nCounter:\
    \ 5\nCounter: 5\nCounter: 5\n```\n\n### Discussion\n\nIn this puzzle, the intention\
    \ is to create an array of closure functions, each printing the current value\
    \ of the variable `i`. However, when you run this code, you'll get an unexpected\
    \ result. Instead of printing the values 0, 1, 2, 3, and 4, the code will print\
    \ the value 5 five times.\n\nThis result is because `var` has function-level scope,\
    \ not block-level scope. The variable `i` declared in the `for` loop is shared\
    \ across all the closure functions. By the time the functions are called, the\
    \ `for` loop has already finished executing, and the final value of `i` is 5.\n\
    \nA straightforward approach to fix this issue is to use the `let` keyword instead\
    \ of `var` to declare the variable `i`. Using `let` will create a new block-scoped\
    \ variable for each iteration of the loop:\n\n```\nthe_permanent_closure/the_permanent_closure_ex1.js\n\
    \nfunction createCounterArray() {\n  const counterArray = [];\n  for (let i =\
    \ 0; i < 5; i++) {\n    counterArray.push(() => {\n      console.log(`Counter:\
    \ ${i}`);\n    });\n  }\n  return counterArray;\n}\n\nconst counters = createCounterArray();\n\
    \ncounters.forEach(counter => counter());\n```\n\nWith this change, each function\
    \ in the `counterArray` will capture its own separate value of `i`, and you'll\
    \ see the expected output:\n\n```\nCounter: 0\nCounter: 1\nCounter: 2\nCounter:\
    \ 3\nCounter: 4\n```\n\nAnother way to fix this problem is to use an immediately\
    \ invoked function expression (IIFE) to create a new scope for each iteration\
    \ of the loop:\n\n```\nthe_permanent_closure/the_permanent_closure_ex2.js\n\n\
    function createCounterArray() {\n    const counterArray = [];\n    for (var i\
    \ = 0; i < 5; i++) {\n        ((i) => {\n            counterArray.push(() => {\n\
    \                console.log(`Counter: ${i}`);\n            });\n        })(i);\n\
    \    }\n    return counterArray;\n}\n\nconst counters = createCounterArray();\n\
    \ncounters.forEach(counter => counter());\n```\n\nIn this version, we introduce\
    \ the IIFE `((i) => {...})(i)` to create a new scope for each iteration of the\
    \ loop. This ensures that each closure function captures its own copy of `i` with\
    \ the correct value. Now, when you run the code, it will print the values 0, 1,\
    \ 2, 3, and 4 as expected.\n\nJavaScript closures are useful because they enable\
    \ the creation of self-contained and encapsulated functions that can maintain\
    \ their own local state, even after the parent function that created them has\
    \ finished executing. But as we've discovered from this puzzle, it's important\
    \ to be cautious when making them, or else we might end up with surprising outcomes!\n\
    \n### Further Reading\n\nImmediately invoked function expressions\nhttps://developer.mozilla.org/en-US/docs/Glossary/IIFE\n\
    \nThe let declaration\n\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let\n\
    \n## Puzzle 15 Cracking the Color Code\n\n```\ncracking_the_color_code/cracking_the_color_code.js\n\
    \nconst canvas = document.createElement(\"canvas\");\nconst ctx = canvas.getContext(\"\
    2d\");\n\nctx.fillStyle = \"yellow\";\n\nconsole.log(ctx.fillStyle);\n```\n\n\
    ## Guess the Output\n\nTry to guess what the output is before moving to the next\
    \ page.\n\nYou might have anticipated that the output would be yellow, but this\
    \ code will actually output:\n\n```\n#ffff00\n```\n\n## Discussion\n\nWhat happens\
    \ here is that we create a temporary HTML canvas, and then we get its 2D context.\
    \ After that, we set a color for the fillStyle property. Now, here's the unexpected\
    \ part: when we log ctx.fillStyle using console.log(), instead of showing the\
    \ color we assigned, it actually converts it to its hexadecimal (hex) representation\
    \ automatically. Here's what each line of the code does:\n\n1. `const canvas =\
    \ document.createElement(\"canvas\")`: This line creates a new canvas element,\
    \ just like preparing a blank piece of paper. It's like saying, \"Hey, let's make\
    \ a fresh canvas to draw on!\"\n\n2. `const ctx = canvas.getContext(\"2d\")`:\
    \ This line sets up a \"context\" for drawing on the canvas. Think of it as getting\
    \ your brushes, paints, and palette ready. We're using a technique called \"2D\"\
    \ drawing, which means we'll be working with two-dimensional shapes like lines\
    \ and curves.\n\n3. `ctx.fillStyle = \"yellow\"`: This line is like choosing the\
    \ color you want to use. Here, we're picking \"yellow\" as our color. So, any\
    \ shapes we draw will be filled with yellow.\n\n4. `console.log(ctx.fillStyle)`:\
    \ This line prints out the current fill color we've chosen in the console. It's\
    \ like checking your palette to see which color you're using before you start\
    \ painting. But, instead of printing \"yellow\", JavaScript implicitly converts\
    \ it to the corresponding hex representation of the color. So, the actual output\
    \ is `#ffff00`.\n\nHexadecimal notation offers a concise and effective method\
    \ for denoting a diverse spectrum of colors. By converting color names to hex\
    \ notation, we can specify a color in a way that can be used across different\
    \ software platforms and devices.\n\n### Further Reading\n\n*The getContext()\
    \ method*\nhttps://developer.mozilla.org/en-US/docs/Web/API/HTMLCanvasElement/getContext\n\
    \n*The fillStyle property*\nhttps://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/fillStyle"
