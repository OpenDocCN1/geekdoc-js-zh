    \nThe bitwise OR (|) operator\n\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Bitwise_OR\n\
    \n## Puzzle 13 Netherlands or Holland?\n\n```\nnetherlands_or_holland/netherlands_or_holland.js\n\
    \nconst country = {\n  name: \"Netherlands\"\n};\n\nconst name = Symbol(\"name\"\
    );\n\ncountry[name] = \"Holland\";\n\nconsole.log(country[\"name\"]);\n```\n\n\
    ## Guess the Output\n\nTry to guess what the output is before moving to the next\
    \ page.\n\nYou might have anticipated that the output would be **Holland**, but\
    \ this code will actually output **Netherlands**.\n\n## Discussion\n\nThis puzzle\
    \ is about a fascinating JavaScript feature called *Symbol*. Symbols let us define\
    \ hidden or private properties within objects. Since symbols are unique, they're\
    \ unlikely to cause conflicts with other properties. They won't show up in `for...in`\
    \ loops or `Object.keys()`, making them suitable for creating properties that\
    \ are not intended to be accessed by external code.\n\nIn this code, we have an\
    \ object representing a country. The country we're talking about here is the Netherlands,\
