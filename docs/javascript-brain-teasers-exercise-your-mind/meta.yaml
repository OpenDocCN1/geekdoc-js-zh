  md: '# Puzzle 27 The Grocery List


    ```

    the_grocery_list/the_grocery_list.js

    ```


    ```

    const groceryList = [];


    groceryList[0] = "Bread";

    groceryList[1] = "Milk";

    groceryList.user = "John";


    console.log(groceryList.length);

    ```


    # Guess the Output


    Try to guess what the output is before moving to the next page.


    You might have expected that the output would be 3, but this code will actually
    output 2.


    # Discussion


    In this puzzle, the array initially starts as an empty array, like an empty bucket.
    Then, we start filling up the array. We put the string "Bread" in the first position
    of the array using groceryList[0] = "Bread". So now, the bucket has one thing
    in it: the "Bread".


    Next, we put the string "Milk" in the second position of the array with groceryList[1]
    = "Milk". Now, the bucket has two things: the "Bread" and "Milk". But here''s
    the tricky part: we also try to be sneaky and add a property to the array called
    "user", and we give it the value "John". It''s like sticking a little note on
    the bucket.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'When we ask the array how many things it has inside using `groceryList.length`,
    it ignores the sneaky little note. It counts only the actual elements inside the
    array, not the extra properties. Since we have two actual elements, the strings
    `"Bread"` and `"Milk"`, the length of the array is `2`.


    You can also add properties to an array using the bracket notation, just like
    you would with a regular object:


    ```

    const groceryList = [];


    groceryList[0] = "Bread";

    groceryList[1] = "Milk";

    groceryList["user"] = "John";


    console.log(groceryList.length);  // → 2

    ```


    Here, because `"user"` is a string, it gets included as a property within the
    array.


    So, properties are like extra information we can attach to an array or any other
    object, but they are not considered part of the array''s length or elements. They
    are simply properties of the underlying object that happens to be an array. You
    also won''t be able to iterate over these properties using array iteration methods
    like `forEach()` or `map()`.


    # Further Reading


    *The Array object*

    > https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array'
