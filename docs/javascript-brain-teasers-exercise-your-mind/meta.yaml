    \ pragprog.com 上本书的主页找到。我们在这里让您的生活更轻松。\n\n## 新书公告\n\n想了解我们最新的书籍和公告，以及偶尔的特别优惠吗？只需在\
    \ [pragprog.com](pragprog.com) 创建一个账户（只需一个电子邮件地址和密码），然后选择接收新闻通讯的复选框。您也可以在 Twitter\
    \ 上关注我们，账号为 @pragprog。\n\n## 关于电子书格式\n\n如果您直接从 [pragprog.com](pragprog.com) 购买，您只需支付一个价格即可获得所有可用格式的电子书。您可以通过\
    \ Dropbox 在所有设备（包括 iPhone/iPad、Android、笔记本电脑等）之间同步您的电子书。您可以获得该版本的终身免费更新。当然，您随时可以在需要时回来重新下载您的书籍。从\
