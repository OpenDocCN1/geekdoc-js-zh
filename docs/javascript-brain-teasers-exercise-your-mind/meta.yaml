    \ [https://pragprog.com/book/fkjsbrain](https://pragprog.com/book/fkjsbrain)。\n\
    \n感谢您持续的支持，\n\nThe Pragmatic Bookshelf\n\n制作本书的团队包括：Dave Thomas（出版人）、Janet Furlow（首席运营官）、Susannah\
    \ Davidson（执行编辑）、系列编辑：Miki Tebeka、Margaret Eldridge（开发编辑）、Karen Galle（文字编辑）、Gilson\
    \ Graphics（排版）\n\n如需客户支持，请联系 [support@pragprog.com](mailto:support@pragprog.com)。\n\
    \n如需国际版权事宜，请联系 [rights@pragprog.com](mailto:rights@pragprog.com)。\n\n# 目录\n\n\
    - [致谢](#)\n- [前言](#)\n  - [关于作者](#)\n  - [关于你](#)\n  - [关于代码](#)\n\n## 第一部分 JavaScript\
    \ 脑力谜题\n\n1. [你的代码值得一次提升](#)\n2. [篡位者](#)\n3. [数学魔术师](#)\n4. [致命拼接](#)\n5. [另类标识符](#)\n\
    6. [趣味函数](#)\n7. [海盗旗有多长？](#)\n8. [这是什么？](#)\n9. [地平说协会](#)\n10. [用 1 和 0 施法](#)\n\
    11. [数学约会](#)\n12. [Math 的值是多少？](#)\n13. [谜题 13. 荷兰还是荷兰？](#)\n14. [谜题 14. 永久闭包](#)\n\
    15. [谜题 15. 破解颜色代码](#)\n16. [谜题 16. 排队等候](#)\n17. [谜题 17. 追逐 Promise](#)\n18.\
    \ [谜题 18. Oo Na Na Na](#)\n19. [谜题 19. 十六进制驱魔](#)\n20. [谜题 20. 数组大师](#)\n21. [链式大师](#)\n\
    22. [变形者](#)\n23. [字母有氧运动](#)\n24. [你相信自己的眼睛吗？](#)\n25. [真相还是虚构？](#)\n26. [开还是关？](#)\n\
    27. [杂货清单](#)\n28. [负重力](#)\n\n## 第二部分 制作谜题\n\n29. [谜题 29. 制作你自己的 JavaScript 谜题](#)\n\
    \n# *JavaScript 脑力谜题* 的早期赞誉\n\n> 这些富有挑战性、多样化的谜题让你欲罢不能，而简洁的解释让你不断学到新东西。喜欢这本关于 JavaScript\
    \ 的出人意料的 eclectic 书籍的每一页。\n\n→ Lukas Mathis\n*Designed for Use* 的作者\n\n> 一本关于\
    \ JavaScript 特性和函数的有趣读物，这些内容可能并非每位语言使用者都熟悉。既有趣又有教育意义。\n\n→ Marcus S. Zarra\niOS/OS\
    \ X 开发者\n\n> 我写 JavaScript 已经超过十年了，我从这本书中学到了东西。我喜欢这些谜题不是关于晦涩边缘情况的\"陷阱\"问题——这类主题很容易陷入这种陷阱——每个谜题都有一个特定的学习目标。\n\
    \n→ Randall Koutnik\n*Build Reactive Websites with RxJS* 的作者\n\n# 致谢\n\n感谢您与我一起踏上这段编程冒险之旅。写书从来不是一个人的努力；它是许多人的支持、指导和鼓励的结晶。\n\
    \n我向 The Pragmatic Programmers 团队表示感谢，他们的专业知识将这一愿景变为现实。特别感谢 Margaret Eldridge，您细致的编辑和对细节的敏锐眼光，确保了内容的质量和清晰度。\n\
    \n非常感谢专家 Michael Fazio、Andy Lester 和 Daniel Posey，他们在本书付印前提供了宝贵的审阅。他们作为开发者的专业知识为代码质量提供了关键见解。\n\
    \n我还要向 Randall Koutnik、Lukas Mathis 和 Marcus S. Zarra 表示感谢。他们不仅花时间审阅我的书并指出我犯的错误，还提供了善意的鼓励和赞扬。\n\
    \n# 前言\n\nJavaScript 历来以其古怪和独特性而闻名。这些不寻常的特性通常源于其作为语言的演变以及维护向后兼容性的需要等因素。例如，JavaScript\
    \ 中一个著名的古怪特性是类型强制转换：JavaScript 试图对数据类型宽容，这可能导致不同类型混合时出现意外行为。\n\n开发者了解 JavaScript\
    \ 的这些方面对于编写更健壮和可预测的代码非常重要。幸运的是，定义 JavaScript 的 ECMAScript 标准正在不断发展，以解决许多这些问题，并为语言引入更可预测的行为和额外的功能。\n\
    \n在本书中，我们邀请您踏上一段旅程，通过精心策划的一系列引人入胜的 JavaScript 挑战，揭示定义该语言本质的复杂细微差别和奇特之处。无论您是寻求成长的高级初学者，还是希望磨练技能的资深开发者，这些页面中都有适合您的内容。\n\
    \n在每章开头，我会向您抛出一个很酷的 JavaScript 小程序，并挑战您猜测它的输出结果。别担心，我不会让您悬而未决。在做出最佳猜测后，请随意运行代码，看看魔法如何发生！然后，继续查看解释，提升您的\
    \ JavaScript 技能。\n"
