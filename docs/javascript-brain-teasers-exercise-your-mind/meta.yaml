    \ `Netherlands`。\n\n当我们想创建不易从外部访问或可见的属性时，符号非常有用。它们提供了一种向对象添加隐藏或私有信息的方法。由于符号是唯一的，我们不必担心意外地与其他属性名重叠或冲突。\n\
