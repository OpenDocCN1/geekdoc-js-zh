    for math concepts you may have only just learned or long since forgotten. Get
    ready to have more fun with numbers than you''ve ever had before.


    Erica Sadun


    (186 pages) ISBN: 9781680509748 $18.95


    ## Go Brain Teasers


    ![](img/7ad0e8939612afa723b8affa6c064dcf_113_0.png)


    This book contains 25 short programs that will challenge your understanding of
    Go. Like any big project, the Go developers had to make some design decisions
    that at times seem surprising. This book uses those quirks as a teaching opportunity.
    By understanding the gaps in your knowledge, you''ll become better at what you
    do. Some of the teasers are from the author''s experience shipping bugs to production,
    and some from others doing the same. Teasers and puzzles are fun, and learning
    how to solve them can teach you to avoid programming mistakes and maybe even impress
    your colleagues and future employers.


    Miki Tebeka


    (110 pages) ISBN: 9781680508994 $18.95


    ## Hands-on Rust


    ![](img/7ad0e8939612afa723b8affa6c064dcf_113_1.png)


    Rust is an exciting new programming language combining the power of C with memory
    safety, fearless concurrency, and productivity boosters—and what better way to
    learn than by making games. Each chapter in this book presents hands-on, practical
    projects ranging from "Hello, World" to building a full dungeon crawler game.
    With this book, you''ll learn game development skills applicable to other engines,
    including Unity and Unreal.


    Herbert Wolverson


    (342 pages) ISBN: 9781680508161 $47.95


    ## Programming WebAssembly with Rust


    ![](img/7ad0e8939612afa723b8affa6c064dcf_114_0.png)


    WebAssembly fulfills the long-awaited promise of web technologies: fast code,
    type-safe at compile time, execution in the browser, on embedded devices, or anywhere
    else. Rust delivers the power of C in a language that strictly enforces type safety.
    Combine both languages and you can write for the web like never before! Learn
    how to integrate with JavaScript, run code on platforms other than the browser,
    and take a step into IoT. Discover the easy way to build cross-platform applications
    without sacrificing power, and change the way you write code for the web.


    Kevin Hoffman


    (238 pages) ISBN: 9781680506365 $45.95'
