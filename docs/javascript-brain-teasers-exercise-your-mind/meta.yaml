    const string1 = "Château";

    const string2 = "Château";


    const normalizedString1 = string1.normalize("NFC");

    const normalizedString2 = string2.normalize("NFC");


    console.log(normalizedString1 === normalizedString2);  // → true

    ```


    The normalize() method makes sure that when comparing strings, they''re always
    consistent, even when there are differences in how characters are made. You can
    pick a particular normalization form, and in our case, we go with NFC.


    There are three other options we can give to normalize(), including NFD, NFKC,
    and NFKD. The choice of form depends on what your program needs, but usually,
    NFC is a safer bet for regular text because it works better with characters converted
