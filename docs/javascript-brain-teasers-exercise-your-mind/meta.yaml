    will have created a string that contains all the lowercase letters from a to z.


    # What Is Base 36?


    Base 36 is a numeral system that uses 36 distinct symbols to represent numbers:
    the digits 0-9 and the letters A-Z (or a-z, depending on convention). Base 36
    allows you to represent large numbers with fewer characters compared to base 10
    (decimal) or base 16 (hexadecimal). For example, it can be helpful in generating
    compact URLs or unique keys or encoding data for storage or transmission.


    So, the takeaway from this puzzle is that you don''t have to type in each and
