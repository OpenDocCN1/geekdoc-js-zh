- md: "## Puzzle 26 On or Off?\n\non_or_off/on_or_off.js\n\n```javascript\nlet response\
    \ = \"on\",\nstate = {on: 1, off: 0}[response]\n\nconsole.log(state);\n```\n\n\
    ### Guess the Output\n\n> Try to guess what the output is before moving to the\
    \ next page.\n\nThis code will output:\n\n```\n1\n```\n\n### Discussion\n\nSuppose\
    \ you have a light switch that can be turned on or off. You receive a response\
    \ from a user indicating the current state of the switch:\n\n```javascript\nlet\
    \ userResponse = \"on\";\n```\n\nWhen you're faced with the need to make decisions\
    \ or run different blocks of code depending on specific conditions, the trusty\
    \ if...else statement comes in handy:\n\n```javascript\nlet response = \"on\"\
    ;\nlet state;\n\nif (response === \"on\"){\n  state = 1;\n} else if (response\
    \ === \"off\"){\n  state = 0;\n}\n```\n\nBut the syntax can sometimes get a bit\
    \ wordy. Some developers make the code shorter by using the ternary operator:\n\
    \n```javascript\nlet response = \"on\";\nlet state = (response === \"on\") ? 1\
    \ : (response === \"off\") ? 0 : undefined;\n```\n\nIn this teaser, we're using\
    \ an extra nifty trick to make the code even more compact! We use an object to\
    \ map the response to corresponding state values: \"on\" maps to 1 and \"off\"\
    \ maps to 0.\n\nHere's what's happening: in JavaScript, when using square brackets\
    \ to access an object property, the value inside the brackets is treated as a\
    \ key. So, {on:1, off:0}[response] is essentially accessing the value of the property\
    \ whose key matches the value of the response. Since the response is \"on\", the\
    \ expression evaluates to {on:1, off:0}[\"on\"], which returns the value 1. It's\
    \ like a hack to squeeze out some extra brevity.\n\n### Further Reading\n\n*The\
    \ Object type*\n\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object\n\
    \n## Puzzle 27 The Grocery List\n\n```javascript\nconst groceryList = [];\n\n\
    groceryList[0] = \"Bread\";\ngroceryList[1] = \"Milk\";\ngroceryList.user = \"\
    John\";\n\nconsole.log(groceryList.length);\n```\n\n### Guess the Output\n\nTry\
    \ to guess what the output is before moving to the next page.\n\nYou might have\
    \ expected that the output would be 3, but this code will actually output 2.\n\
    \n### Discussion\n\nIn this puzzle, the array initially starts as an empty array,\
    \ like an empty bucket. Then, we start filling up the array. We put the string\
    \ \"Bread\" in the first position of the array using groceryList[0] = \"Bread\"\
    . So now, the bucket has one thing in it: the \"Bread\".\n\nNext, we put the string\
    \ \"Milk\" in the second position of the array with groceryList[1] = \"Milk\"\
    . Now, the bucket has two things: the \"Bread\" and \"Milk\". But here's the tricky\
    \ part: we also try to be sneaky and add a property to the array called \"user\"\
    , and we give it the value \"John\". It's like sticking a little note on the bucket.\n\
    \nWhen we ask the array how many things it has inside using `groceryList.length`,\
    \ it ignores the sneaky little note. It counts only the actual elements inside\
    \ the array, not the extra properties. Since we have two actual elements, the\
    \ strings `\"Bread\"` and `\"Milk\"`, the length of the array is `2`.\n\nYou can\
    \ also add properties to an array using the bracket notation, just like you would\
    \ with a regular object:\n\n```javascript\nconst groceryList = [];\n\ngroceryList[0]\
    \ = \"Bread\";\ngroceryList[1] = \"Milk\";\ngroceryList[\"user\"] = \"John\";\n\
    \nconsole.log(groceryList.length);  // → 2\n```\n\nHere, because `\"user\"` is\
    \ a string, it gets included as a property within the array.\n\nSo, properties\
    \ are like extra information we can attach to an array or any other object, but\
    \ they are not considered part of the array's length or elements. They are simply\
    \ properties of the underlying object that happens to be an array. You also won't\
    \ be able to iterate over these properties using array iteration methods like\
    \ `forEach()` or `map()`.\n\n### Further Reading\n\n*The Array object*\n\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array\n\
    \n## Puzzle 28 Negative Gravity\n\n```javascript\nconsole.log(7 - - 5)\nconsole.log(7\
    \ - -5)\nconsole.log(7- -5)\nconsole.log(7--5)\n```\n\n### Guess the Output\n\n\
    > Try to guess what the output is before moving to the next page.\n\nThis code\
    \ will output:\n\n```\n12\n12\n12\nSyntaxError: invalid increment/decrement operand\n\
    ```\n\n### Discussion\n\nThe minus sign (-) is usually used for subtraction, but\
    \ here we have two minus signs next to each other. So, the - is applied twice\
    \ to the second operand, effectively negating the value twice. Since negating\
    \ a negative number results in a positive number, the expression **7 - - 5** is\
    \ effectively interpreted as **7 - (-5)**, which simplifies to **7 + 5**. Consequently,\
    \ the expression evaluates to the number **12**.\n\nThe expression on the second\
    \ line, **7 - -5**, is similar to the first one. It correctly subtracts the value\
    \ **-5** from **7**. The result is **12**. **7- -5** also correctly subtracts\
    \ the value **-5** from **7**. Just like the previous two expressions, the result\
    \ is **12**.\n\nThe fourth expression, 7--5, is different. There are two consecutive\
    \ minus signs without any space in between. In JavaScript, -- is treated as the\
    \ decrement operator, which is used to decrease a variable's value by 1. Since\
    \ there are no variables here, this expression will result in a syntax error because\
    \ it's not a valid operation.\n\nSo, similar to mathematical operations in the\
    \ real world, subtracting a negative number from another number is equivalent\
    \ to adding the positive value of that number. But, there is a caveat when there's\
    \ no space between the first minus sign and the second one, in which case the\
    \ expression is interpreted as the decrement operator.\n\n### Further Reading\n\
    \n*The decrement operator*\n\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Decrement\n\
    \n*The subtraction operator*\n\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Subtraction\n\
    \n### Footnotes\n\n[2] https://github.com/TimothyMeadows/bigintjs\n\n[3] https://mikemcl.github.io/bignumber.js/\n\
    \n[4] https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#reserved_words\n\
