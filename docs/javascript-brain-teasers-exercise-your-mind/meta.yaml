    \ => {\n    console.log(\"Promise\");\n});\n\nconsole.log(\"End\");\n```\n\n##\
    \ 猜一猜输出结果\n\n在翻到下一页之前，试着猜猜输出结果是什么。\n\n你可能预料输出会是：\n\n- Start\n- Timeout\n- Promise\n\
    - End\n\n但代码实际会输出：\n\n- Start\n- End\n- Promise\n- Timeout\n\n## 讨论\n\n这里，我们混合了同步和异步操作，并使用\
    \ `console.log()` 在代码的不同位置输出不同的消息。由于 `setTimeout()` 被设置为0毫秒，你可能预期消息会按 \"Start\"\
    、\"Timeout\"、\"Promise\" 和 \"End\" 的顺序出现。但是，由于事件循环和 JavaScript 处理异步任务的方式，实际输出是不同的。\n\
    \n事件循环是 JavaScript 的重要组成部分，它确保代码以非阻塞的方式执行。它负责管理异步操作、定时器和回调等任务。\n\n在这个谜题中，我们有两个异步任务：一个\
    \ `setTimeout` 和一个 `Promise`。`setTimeout()` 函数允许我们在指定的延迟后安排一个回调函数运行。然而，即使我们将延迟设置为0，回调函数也不会立即执行。相反，它会被添加到事件队列中，等待事件循环完成当前同步代码的执行后，才能轮到它。\n\
    \n之后，我们有一个 `Promise.resolve()` 语句。Promise 是 JavaScript 中处理异步操作的一种方式。这里，我们使用 `Promise.resolve()`\
    \ 创建了一个 promise，并立即以值 `undefined` 解决了该 promise。然后我们给 promise 添加了一个 `.then()` 方法，它允许我们指定一个在\
    \ promise 被解决后执行的函数。在这个例子中，该函数向控制台记录了消息 \"Promise\"。\n\n与 `setTimeout()` 不同，`Promise.resolve().then`\
    \ 代码被安排在下一个微任务检查点运行，这发生在处理事件队列之前。现在，当代码中同时存在 `setTimeout()` 和 `Promise` 时，会发生以下事件序列：\n\
    \n1. 同步代码被执行。\n2. `setTimeout` 回调被放入事件队列。\n3. `Promise` 回调立即执行。\n4. 事件循环从事件队列中取出\
    \ `setTimeout` 回调并执行它。\n\n需要注意的是，即使 `setTimeout()` 函数中的延迟设置为0毫秒，实际延迟也可能因 JavaScript\
    \ 引擎的工作负载和其他因素而异。如果你不熟悉 JavaScript 的事件循环和异步执行，这种行为可能看起来出乎意料。\n\n### 延伸阅读\n\n-\
    \ *异步 JavaScript 简介*\n  [https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Asynchronous/Introducing](https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Asynchronous/Introducing)\n\
    \n- *Promise.resolve() 静态方法*\n  [https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/resolve](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/resolve)\n\
    \n- *setTimeout() 方法*\n  [https://developer.mozilla.org/en-US/docs/Web/API/setTimeout](https://developer.mozilla.org/en-US/docs/Web/API/setTimeout)\n\
    \n## 第17题 追踪 Promise\n\n```\nchasing_promises/chasing_promises.js\n```\n\n```\n\
    console.log(\"Application started\");\n\nasync function fetchDataFromAPI() {\n\
    \    console.log(\"Fetching data from API...\");\n    await processAPIData();\n\
    \    console.log(\"Data fetched successfully\");\n}\n\nasync function processAPIData()\
    \ {\n    console.log(\"Processing API data...\");\n}\n\nfetchDataFromAPI();\n\n\
    console.log(\"Application ended\");\n```\n\n## 猜一猜输出结果\n\n在翻到下一页之前，试着猜猜输出结果是什么。\n\
    \n你可能预料输出会是：\n\n```\nApplication started\nApplication ended\nFetching data from\
    \ API...\nProcessing API data...\nData fetched successfully\n```\n\n但这段代码实际会输出：\n\
    \n```\nApplication started\nFetching data from API...\nProcessing API data...\n\
    Application ended\n```\n\n## 讨论\n\n`await` 关键字允许你以更线性的方式编写异步代码，即使处理需要时间完成的操作，也能更容易地理解执行流程。\n\
    \n首先，我们有一个同步的 `console.log(\"Application started\")`，它只是将字符串 \"Application started\"\
    \ 记录到控制台。然后我们有 `async function fetchDataFromAPI() { ... }`，它声明了一个异步函数。异步函数可以使用\
    \ `await` 关键字来暂停其执行，同时等待一个 promise 被解决。\n\n在函数内部，`await processAPIData()` 使用了\
    \ `await` 关键字来暂停 `fetchDataFromAPI` 函数的执行，直到 `processAPIData` 函数完成其执行。在这种情况下，由于\
    \ `processAPIData` 是一个异步函数，它返回一个 promise，`await` 确保程序会等待该 promise 被解决后再继续执行。\n\
    \n事件序列总结如下：\n\n- 代码开始时记录 \"Application started\"。\n- `fetchDataFromAPI` 函数被调用，它记录\
    \ \"Fetching data from API...\"，并等待 `processAPIData` 函数的完成。\n- 在 `processAPIData`\
    \ 函数内部，记录 \"Processing API data...\"。\n- 脚本随后记录 \"Application ended\"，因为它现在可以继续在\
    \ `fetchDataFromAPI` 函数外部执行。\n- 最后，记录 \"Data fetched successfully\"。\n\n因此，当你有需要时间的任务（如与服务器通信），并且希望确保它们以流畅的顺序发生时，`await`\
    \ 关键字非常有帮助。在这里，代码会等待 `fetchDataFromAPI()` 和 `processAPIData()` 完成它们的任务后再继续。结果，事情发生的顺序就不同了。\n\
    \n### 延伸阅读\n\n- *现代异步 JavaScript*\n  > https://pragprog.com/titles/fkajs/modern-asynchronous-javascript/\n\
    \n- *Promise 对象*\n  > https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise\n\
    \n- *await 操作符*\n  > https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/await\n\
    \n## 第18题 哦呐呐呐\n\n```\noo_na_na_na/oo_na_na_na.js\n\nlet price = 10;\nlet tax;\n\
    \nconst sum = price + tax;\n\nconsole.log(sum);\n```\n\n## 猜一猜输出结果\n\n在翻到下一页之前，试着猜猜输出结果是什么。\n\
    \n你可能预料输出会是 **10**，但这段代码实际会记录：\n\n```\nNaN\n```\n\n## 讨论\n\n在这个谜题中，`const tax;`\
    \ 语句声明了一个常量变量，但没有给它赋值。因此，该变量持有默认值 `undefined`。当尝试将 `undefined` 加到 `price` 的值上时，运算结果为\
    \ `NaN`（非数字）。\n\n`NaN` 是 JavaScript 中的一个特殊值，表示无效或未定义的数学运算的结果。当你进行无法产生有意义的数值的数学运算时，可能会遇到\
    \ `NaN`，例如尝试将零除以零或对负数取平方根。\n\n以下是一些会导致 `NaN` 的 JavaScript 运算：\n\n1. 当零除以零时\n2.\
    \ 尝试将非数字字符串转换为数字时\n3. 解析无效的浮点表示法时\n4. 执行涉及 **NaN** 的数学运算时\n5. 在数学运算中使用未定义的变量时\n\
    6. 对负数取平方根时\n7. 执行某些涉及 **Infinity** 的数学运算时\n\n```\n0 / 0;    // → NaN\n```\n\n\
    ```\nNumber(\"hello\");    // → NaN\n```\n\n```\nparseFloat(\"abc\");    // →\
