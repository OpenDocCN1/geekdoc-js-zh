- md: "## 什么是 `this`\n\n在 JavaScript 中，`this` 关键字的行为取决于函数的调用方式，而不是函数的定义位置。以下是几个关键场景：\n\
    \n### 在立即执行函数表达式（IIFE）中\n\n```javascript\n// whats_this/whats_this_ex1.js\n(function()\
    \ {\n  \"use strict\";\n  console.log(this);    // → undefined\n})();\n\n(function()\
    \ {\n  console.log(this);    // → Window {...}\n})();\n```\n\n在这个谜题中，我们试图在立即执行函数表达式（IIFE）中读取\
    \ `undefined` 的 `key` 属性。请记住，IIFE 是在创建后立即执行的函数。由于 `undefined` 没有属性，因此代码会产生错误。\n\
    \n注意函数顶部的 `\"use strict\"` 表达式。这行代码告诉 JavaScript 引擎在该函数中启用严格模式。严格模式是一种选择更严格规则集和行为的方式，由\
    \ JavaScript 引擎强制执行，这有助于捕获常见的编码错误和“不安全”操作，最终导致更健壮和可维护的代码。\n\n如果没有 `\"use strict\"\
    `，函数会记录 `undefined` 而不是抛出错误：\n\n```javascript\n// whats_this/whats_this_ex2.js\n\
    let key = 2049;\n\n(function() {\n  console.log(this.key);  // → undefined\n})();\n\
    ```\n\n### 在对象的方法中\n\n现在，如果我们在对象的方法中使用 `this`，它将指向该对象本身。因此，如果你像 `object.method()`\
    \ 这样调用对象的方法，那么 `this` 将是该方法的 `object`：\n\n```javascript\n// whats_this/whats_this_ex3.js\n\
    const user = {\n  firstName: \"Mikasa\",\n  lastName: \"Ackerman\",\n  getFullname()\
    \ {\n    return `${this.firstName} ${this.lastName}`;\n  }\n};\n\nconsole.log(user.getFullname());\
    \  // → Mikasa Ackerman\n```\n\n### 使用 `new` 关键字时\n\n如果你使用 **new** 关键字通过构造函数创建对象，**this**\
    \ 将指向新创建的对象：\n\n```javascript\n// whats_this/whats_this_ex4.js\nfunction Book(name,\
    \ year) {\n  this.name = name;\n  this.year = year;\n  this.getBookInfo = () =>\
    \ {\n    return `${this.name} (${this.year})`;\n  }\n}\n\nconst book1 = new Book(\"\
    Death by Black Hole\", 2006);\nbook1.getBookInfo();  // → Death by Black Hole\
    \ (2006)\n```\n\n### 使用 `call()`, `apply()` 或 `bind()` 显式设置时\n\n最后，如果你使用 **call()**、**apply()**\
    \ 或 **bind()** 等方法显式设置 **this** 的值，它将指向你作为第一个参数传递的对象：\n\n```javascript\n// whats_this/whats_this_ex5.js\n\
    function describeMeal() {\n  return `A ${this.dish} usually has about ${this.calories}\
    \ calories.`;\n}\n\nconst meal = {\n  dress: \"salad\",\n  calories: \"300\",\n\
    };\n\nconsole.log(describeMeal.call(meal));\n// → A salad usually has about 300\
    \ calories.\n```\n\n### 关于全局对象\n\n因此，运行 `console.log(this)` 将根据代码运行的位置和使用方式给出不同的输出。请记住，如果你使用\
    \ `this` 来访问全局对象，可能会降低代码的可移植性。每个 JavaScript 环境都有自己的对象模型和访问全局对象的不同方式。在 Web 浏览器中，你可以使用\
    \ `window`、`self`、`this` 或 `frames` 来访问全局对象。这非常灵活！\n\n例如，`window.alert('Hello')`\
    \ 访问全局对象（window）并调用 `alert` 方法。此外，你也可以不使用 `window` 前缀直接访问全局对象。例如，`alert('Hello')`\
    \ 也可以工作。\n\n然而，在 Node.js 中，像 `window` 和 `self` 这样的属性不存在，你必须使用 `global`。在 Web Workers\
    \ 中，只有 `self` 可用。这些引用全局对象的不同方式使得编写可在多种环境中工作的可移植 JavaScript 代码变得困难。\n\n幸运的是，ECMAScript\
    \ 在 ES2020 中通过引入一个标准属性 `globalThis` 解决了这个问题，该属性在所有环境中都可用：\n\n```javascript\n//\
    \ whats_this/whats_this_ex6.js\n\n// Browser environment\nconsole.log(globalThis);\
    \  // → Window {...}\n\n// Node.js environment\nconsole.log(globalThis);  // →\
    \ <ref *1> Object [global] {...}\n\n// Web worker environment\nconsole.log(globalThis);\
    \  // → DedicatedWorkerGlobalScope {...}\n```\n\n使用 `globalThis`，你的代码无需额外检查即可在窗口和非窗口上下文中轻松工作。\n\
    \n当你不确定代码将使用的环境，或者希望确保其在不同环境中的兼容性时，`globalThis` 属性变得非常有用。请记住，较旧的浏览器可能需要一个 polyfill。polyfill\
    \ 是一段代码，它为缺乏原生支持的旧版 Web 浏览器提供现代 JavaScript 功能。\n\n另一方面，如果你确信代码将在特定环境中使用，你可以依赖该环境的现有方法来引用全局对象。这样，你可以避免包含\
    \ polyfill 的麻烦。\n\n## 进一步阅读\n\n*什么是 globalThis，为什么应该开始使用它？*\nhttps://blog.logrocket.com/what-is-globalthis-why-use-it/\n\
    \n*globalThis 全局属性*\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/globalThis\n\
    \n## 谜题 9：平坦的地球协会\n\n```javascript\n// the_flat_earth_society/the_flat_earth_society.js\n\
    const nestedArray = [\"apple\", [\"blueberry\", \"blackberry\"],\n           \
    \          [\"tangerine\", \"orange\"], \"grape\"];\nconst newArr = [].concat.apply([],\
    \ nestedArray);\n\nconsole.log(newArr);\n```\n\n## 猜输出\n\n> 在查看下一页之前，试着猜猜输出是什么。\n\
    \n这个代码将输出：\n\n```\n['apple', 'blueberry', 'blackberry', 'tangerine', 'orange',\
    \ 'grape']\n```\n\n## 讨论\n\n这段 JavaScript 代码是关于展平一个数组的数组。首先，我们有一个名为 `nestedArray`\
    \ 的数组。它包含四个元素：两个字符串和两个子数组。第二行代码实现了展平数组的魔法。它的工作原理如下：\n\n1. `[]` 创建一个空数组。这将是 `concat()`\
    \ 方法的初始值。\n2. `concat()` 是一个内置的 JavaScript 数组方法，用于将两个或多个数组合并在一起。它接受一个或多个数组作为参数，并返回一个包含所有输入数组元素组合的新数组。\n\
    \n3. **apply()** 是一个方法，允许你使用给定的 **this** 值和一个数组（或类数组对象）作为参数来调用一个函数。在这里，我们使用它将\
    \ **concat** 方法应用于空数组 **[]**，同时将 **nestedArray** 的元素作为参数传递。\n\n所以，当你运行 **[].concat.apply([],\
    \ nestedArray)** 时，它本质上是将 **nestedArray** 中的所有元素连接成一个单一的扁平数组。这是 JavaScript 中展平嵌套数组的常用技术。\n\
    \n但这似乎不是最优雅的解决方案，对吗？\n\n幸运的是，自 ES2019 起，有一个方便的方法叫 **flat()**，它允许你通过将所有子数组折叠成一个一维数组来快速展平嵌套数组。\n\
    \n以下是如何使用 **flat()** 方法：\n\n```javascript\n// the_flat_earth_society/the_flat_earth_society_ex1.js\n\
    const nestedArray = [\"apple\", [\"blueberry\", \"blackberry\"],\n           \
    \          [\"tangerine\", \"orange\"], \"grape\"];\nconst flattenedArray = nestedArray.flat();\n\
    \nconsole.log(flattenedArray);\n// → [\"apple\", \"blueberry\", \"blackberry\"\
    , \"tangerine\", \"orange\", \"grape\"]\n```\n\n**flat()** 神奇地遍历所有嵌套级别，创建一个一维数组。但等等，还有更多！你还可以提供一个名为\
    \ **depth** 的可选参数来控制它将展平多少层嵌套。\n\n默认情况下，**depth** 设置为 **1**，意味着它只展平一层，但你可以指定不同的深度以进行更深层的操作。如果你将深度设置为\
    \ **Infinity**，它将展平所有层级，无论它们有多深：\n\n```javascript\n// the_flat_earth_society/the_flat_earth_society_ex2.js\n\
    const deeplyNestedArray = [\"a\", [\"b\", [\"c\", [\"d\", [\"e\"]]]]];\nconst\
    \ flattenedArray = deeplyNestedArray.flat(Infinity);\n\nconsole.log(flattenedArray);\n\
    // → [\"a\", \"b\", \"c\", \"d\", \"e\"]\n```\n\n请记住，当你使用 `flat()` 时，它会创建一个全新的数组，而原始数组保持不变。如果你不再需要原始数组，可以直接将展平后的数组赋值给同一个变量。\n\
    \n## 进一步阅读\n\n*Google 的 v8 博客*\n<https://v8.dev/features/array-flat-flatmap>\n\
    \n*flat() 方法*\n<https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/flat>\n\
    \n*apply() 方法*\n<https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/apply>"
  mdcn: "\n## 什么是 `this`\n\n在 JavaScript 中，`this` 关键字的行为取决于函数的调用方式，而不是函数的定义位置。以下是几个关键场景：\n\
    \n### 在立即执行函数表达式（IIFE）中\n\n```javascript\n// whats_this/whats_this_ex1.js\n(function()\
    \ {\n  \"use strict\";\n  console.log(this);    // → undefined\n})();\n\n(function()\
    \ {\n  console.log(this);    // → Window {...}\n})();\n```\n\n在这个谜题中，我们试图在立即执行函数表达式（IIFE）中读取\
    \ `undefined` 的 `key` 属性。请记住，IIFE 是在创建后立即执行的函数。由于 `undefined` 没有属性，因此代码会产生错误。\n\
    \n注意函数顶部的 `\"use strict\"` 表达式。这行代码告诉 JavaScript 引擎在该函数中启用严格模式。严格模式是一种选择更严格规则集和行为的方式，由\
    \ JavaScript 引擎强制执行，这有助于捕获常见的编码错误和\"不安全\"操作，最终导致更健壮和可维护的代码。\n\n如果没有 `\"use strict\"\
    `，函数会记录 `undefined` 而不是抛出错误：\n\n```javascript\n// whats_this/whats_this_ex2.js\n\
    let key = 2049;\n\n(function() {\n  console.log(this.key);  // → undefined\n})();\n\
    ```\n\n### 在对象的方法中\n\n现在，如果我们在对象的方法中使用 `this`，它将指向该对象本身。因此，如果你像 `object.method()`\
    \ 这样调用对象的方法，那么 `this` 将是该方法的 `object`：\n\n```javascript\n// whats_this/whats_this_ex3.js\n\
    const user = {\n  firstName: \"Mikasa\",\n  lastName: \"Ackerman\",\n  getFullname()\
    \ {\n    return `${this.firstName} ${this.lastName}`;\n  }\n};\n\nconsole.log(user.getFullname());\
    \  // → Mikasa Ackerman\n```\n\n### 使用 `new` 关键字时\n\n如果你使用 **new** 关键字通过构造函数创建对象，**this**\
    \ 将指向新创建的对象：\n\n```javascript\n// whats_this/whats_this_ex4.js\nfunction Book(name,\
    \ year) {\n  this.name = name;\n  this.year = year;\n  this.getBookInfo = () =>\
    \ {\n    return `${this.name} (${this.year})`;\n  }\n}\n\nconst book1 = new Book(\"\
    Death by Black Hole\", 2006);\nbook1.getBookInfo();  // → Death by Black Hole\
    \ (2006)\n```\n\n### 使用 `call()`, `apply()` 或 `bind()` 显式设置时\n\n最后，如果你使用 **call()**、**apply()**\
    \ 或 **bind()** 等方法显式设置 **this** 的值，它将指向你作为第一个参数传递的对象：\n\n```javascript\n// whats_this/whats_this_ex5.js\n\
    function describeMeal() {\n  return `A ${this.dish} usually has about ${this.calories}\
    \ calories.`;\n}\n\nconst meal = {\n  dress: \"salad\",\n  calories: \"300\",\n\
    };\n\nconsole.log(describeMeal.call(meal));\n// → A salad usually has about 300\
    \ calories.\n```\n\n### 关于全局对象\n\n因此，运行 `console.log(this)` 将根据代码运行的位置和使用方式给出不同的输出。请记住，如果你使用\
    \ `this` 来访问全局对象，可能会降低代码的可移植性。每个 JavaScript 环境都有自己的对象模型和访问全局对象的不同方式。在 Web 浏览器中，你可以使用\
    \ `window`、`self`、`this` 或 `frames` 来访问全局对象。这非常灵活！\n\n例如，`window.alert('Hello')`\
    \ 访问全局对象（window）并调用 `alert` 方法。此外，你也可以不使用 `window` 前缀直接访问全局对象。例如，`alert('Hello')`\
    \ 也可以工作。\n\n然而，在 Node.js 中，像 `window` 和 `self` 这样的属性不存在，你必须使用 `global`。在 Web Workers\
    \ 中，只有 `self` 可用。这些引用全局对象的不同方式使得编写可在多种环境中工作的可移植 JavaScript 代码变得困难。\n\n幸运的是，ECMAScript\
    \ 在 ES2020 中通过引入一个标准属性 `globalThis` 解决了这个问题，该属性在所有环境中都可用：\n\n```javascript\n//\
    \ whats_this/whats_this_ex6.js\n\n// Browser environment\nconsole.log(globalThis);\
    \  // → Window {...}\n\n// Node.js environment\nconsole.log(globalThis);  // →\
    \ <ref *1> Object [global] {...}\n\n// Web worker environment\nconsole.log(globalThis);\
    \  // → DedicatedWorkerGlobalScope {...}\n```\n\n使用 `globalThis`，你的代码无需额外检查即可在窗口和非窗口上下文中轻松工作。\n\
    \n当你不确定代码将使用的环境，或者希望确保其在不同环境中的兼容性时，`globalThis` 属性变得非常有用。请记住，较旧的浏览器可能需要一个 polyfill。polyfill\
    \ 是一段代码，它为缺乏原生支持的旧版 Web 浏览器提供现代 JavaScript 功能。\n\n另一方面，如果你确信代码将在特定环境中使用，你可以依赖该环境的现有方法来引用全局对象。这样，你可以避免包含\
    \ polyfill 的麻烦。\n\n## 进一步阅读\n\n*什么是 globalThis，为什么应该开始使用它？*\nhttps://blog.logrocket.com/what-is-globalthis-why-use-it/\n\
    \n*globalThis 全局属性*\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/globalThis\n\
    \n## 谜题 9：平坦的地球协会\n\n```javascript\n// the_flat_earth_society/the_flat_earth_society.js\n\
    const nestedArray = [\"apple\", [\"blueberry\", \"blackberry\"],\n           \
    \          [\"tangerine\", \"orange\"], \"grape\"];\nconst newArr = [].concat.apply([],\
    \ nestedArray);\n\nconsole.log(newArr);\n```\n\n## 猜输出\n\n> 在查看下一页之前，试着猜猜输出是什么。\n\
    \n这个代码将输出：\n\n```\n['apple', 'blueberry', 'blackberry', 'tangerine', 'orange',\
    \ 'grape']\n```\n\n## 讨论\n\n这段 JavaScript 代码是关于展平一个数组的数组。首先，我们有一个名为 `nestedArray`\
    \ 的数组。它包含四个元素：两个字符串和两个子数组。第二行代码实现了展平数组的魔法。它的工作原理如下：\n\n1. `[]` 创建一个空数组。这将是 `concat()`\
    \ 方法的初始值。\n2. `concat()` 是一个内置的 JavaScript 数组方法，用于将两个或多个数组合并在一起。它接受一个或多个数组作为参数，并返回一个包含所有输入数组元素组合的新数组。\n\
    \n3. **apply()** 是一个方法，允许你使用给定的 **this** 值和一个数组（或类数组对象）作为参数来调用一个函数。在这里，我们使用它将\
    \ **concat** 方法应用于空数组 **[]**，同时将 **nestedArray** 的元素作为参数传递。\n\n所以，当你运行 **[].concat.apply([],\
    \ nestedArray)** 时，它本质上是将 **nestedArray** 中的所有元素连接成一个单一的扁平数组。这是 JavaScript 中展平嵌套数组的常用技术。\n\
    \n但这似乎不是最优雅的解决方案，对吗？\n\n幸运的是，自 ES2019 起，有一个方便的方法叫 **flat()**，它允许你通过将所有子数组折叠成一个一维数组来快速展平嵌套数组。\n\
    \n以下是如何使用 **flat()** 方法：\n\n```javascript\n// the_flat_earth_society/the_flat_earth_society_ex1.js\n\
    const nestedArray = [\"apple\", [\"blueberry\", \"blackberry\"],\n           \
    \          [\"tangerine\", \"orange\"], \"grape\"];\nconst flattenedArray = nestedArray.flat();\n\
    \nconsole.log(flattenedArray);\n// → [\"apple\", \"blueberry\", \"blackberry\"\
    , \"tangerine\", \"orange\", \"grape\"]\n```\n\n**flat()** 神奇地遍历所有嵌套级别，创建一个一维数组。但等等，还有更多！你还可以提供一个名为\
    \ **depth** 的可选参数来控制它将展平多少层嵌套。\n\n默认情况下，**depth** 设置为 **1**，意味着它只展平一层，但你可以指定不同的深度以进行更深层的操作。如果你将深度设置为\
    \ **Infinity**，它将展平所有层级，无论它们有多深：\n\n```javascript\n// the_flat_earth_society/the_flat_earth_society_ex2.js\n\
    const deeplyNestedArray = [\"a\", [\"b\", [\"c\", [\"d\", [\"e\"]]]]];\nconst\
    \ flattenedArray = deeplyNestedArray.flat(Infinity);\n\nconsole.log(flattenedArray);\n\
    // → [\"a\", \"b\", \"c\", \"d\", \"e\"]\n```\n\n请记住，当你使用 `flat()` 时，它会创建一个全新的数组，而原始数组保持不变。如果你不再需要原始数组，可以直接将展平后的数组赋值给同一个变量。\n\
    \n## 进一步阅读\n\n*Google 的 v8 博客*\n<https://v8.dev/features/array-flat-flatmap>\n\
    \n*flat() 方法*\n<https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/flat>\n\
    \n*apply() 方法*\n<https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/apply>\n"
