- img_proc: true
  md: 'But if you happen to use an integer outside of this range, there''s a chance
    that it won''t be represented accurately. This issue is known as *loss of precision*
    when dealing with large numbers in JavaScript. Here''s another example you can
    try:


    ```

    console.log(9999999999999999);    // → 10000000000000000

    ```


    JavaScript has got you covered with a couple of handy constants that make it easy
    to get the maximum and minimum safe integers. Just use the [Number.MAX_SAFE_INTEGER](Number.MAX_SAFE_INTEGER)
    constant to get the largest safe integer and the [Number.MIN_SAFE_INTEGER](Number.MIN_SAFE_INTEGER)
    constant to grab the smallest safe integer:


    ```

    console.log(Number.MIN_SAFE_INTEGER);    // → -9007199254740991

    console.log(Number.MAX_SAFE_INTEGER);    // → 9007199254740991

    ```


    Previously, to handle very large numbers with precision, JavaScript developers
    had to use external libraries like BigInt.js[^2] or BigNumber.js.[^3] Fortunately,
    ECMAScript 2020 (the standardized specification for JavaScript) came to the rescue
    with a fantastic solution called BigInt. Creating a BigInt is easy: simply append
    the letter **n** to the end of an integer, like this:


    ```

    console.log(9999999999999999n);    // → 9999999999999999n

    ```


    Or, you can use the `BigInt()` constructor:


    ```

    BigInt("9999999999999999");    // → 9999999999999999n

    ```


    So, to fix the code in this puzzle, we can write:


    ```

    const largeNumber = BigInt("1000000000000000");

    const smallNumber = BigInt("1");;


    console.log(largeNumber + smallNumber);

    // → 1000000000000001n

    ```


    You might be curious about why we''re also converting the `smallNumber` to a BigInt.
    To maintain the integrity of the data and avoid potential loss of information,
    mixed operations between BigInts and Numbers are not'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'permitted. The reason behind this restriction is that the resulting value may
    not be accurately representable by either BigInt or Number data types.


    Let''s take a look at the following example to better understand this:


    ```

    10000000000000000n + 0.5;

    // → TypeError: Cannot mix BigInt and other types, use explicit conversions

    ```


    Converting a Number with a fractional part to a BigInt may not yield an accurate
    representation, just as converting a BigInt larger than 2^53 to a Number may also
    result in loss of precision.


    When performing arithmetic computations involving both BigInt and Number values,
    you have to choose the domain in which the operation should take place. Convert
    either of the operands by using the functions **Number()** or **BigInt()**:


    ```

    // convert the Number to a BigInt

    BigInt(5) + 5n;   // → 10n


    // or convert the BigInt to a Number

    5 + Number(5n);   // → 10

    ```


    There are some subtle differences between a Number and a BigInt. You can use all
    arithmetic operators on a BigInt except for the unary plus (+) operator:


    ```

    console.log(1n + 2n);   // → 3n

    console.log(1n - 2n);   // → -1n

    console.log(1n * 2n);   // → 2n

    console.log(2n / 1n);   // → 2n

    console.log(14n % 10n); // → 4n

    console.log(5n ** 3n);  // → 125n


    let x = 1n;

    console.log(++x); // → 2n

    console.log(--x); // → 1n

    console.log(-x);  // → -1n

    console.log(+x);  // → TypeError: Cannot convert a BigInt value to a Number

    ```'
  merge: -1
