    ```

    // Using splice() to insert the elements of array2 into array1

    array1.splice(insertIndex, 0, ...array2);


    console.log(array1); // → [1, 2, 4, 5, 6, 3]

    ```


    These are some of the common ways to combine two arrays in JavaScript. Keep in
    mind that `concat()` and the spread operator do not alter the existing arrays;
    instead, they return a new array. On the contrary, `push()`, `unshift()`, and
    `splice()` modify the contents of the array they are applied to. Choose the method
