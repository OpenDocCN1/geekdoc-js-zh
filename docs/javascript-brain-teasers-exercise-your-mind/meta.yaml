    \nConsider the following code:\n\n```\n// Create a variable\nvar a = 10;\n```\n\
    \nThis code is processed by JavaScript in the following manner:\n\n```\nvar a;\n\
    // Create a variable\na = 10;\n```\n\nWhen you declare a variable using the **var**\
    \ keyword, the declaration is moved (or \"hoisted\") to the top of the containing\
    \ function or global scope. However, the assignment (initialization) of the variable\
    \ remains in its original place. This means that you can reference a **var** before\
    \ it's declared in your code without causing an error. However, the value will\
    \ be **undefined** until you actually assign a value to it.\n\nThis behavior can\
    \ lead to unexpected outcomes when working with functions. Any variable that is\
    \ declared within a function will be hoisted to the top. Consequently, if there\
    \ exists a variable with an identical name in the global scope, it will become\
    \ concealed within the function. For example:\n\n```\nvar a = 10;\n\nfunction\
    \ fn() {\n  console.log(a);  // → undefined\n  var a = 20;\n\n  console.log(a);\
    \  // → 20\n}\n```"
  - "[PAGE 17]\n\n```\nfn();\n```\n\nSo, when looking at the first line of this function,\
    \ you might think it'll log **10** and **20**. But JavaScript actually processes\
    \ the code differently:\n\n```\nvar a = 10;\n\nfunction fn() {\n  var a;\n  console.log(a);\
    \    // → undefined\n  a = 20;\n  console.log(a);    // → 20\n}\n\nfn();\n```\n\
    \nTo make sure things go smoothly and we don't run into any surprises, ES2015\
    \ came up with a solution: the `let` keyword for declaring variables. With `let`,\
    \ variables still get hoisted, but now they're like reminders. They'll give us\
    \ a heads-up if we try to use a variable that hasn't been declared, preventing\
    \ any unexpected hiccups:\n\n```\nfunction fn() {\n  console.log(a);    // → undefined\n\
    \  console.log(b);    // → ReferenceError: b is not defined\n\n  var a = 20;\n\
    \  let b = 20\n\n  console.log(a);\n}\n\nfn();\n```\n\nSo with `var`, when you\
    \ try to get hold of a variable before it's declared, you'll get `undefined` as\
    \ a response. On the other hand, if you attempt the same thing with `let`, you'll\
    \ get an error message. As with `let`, if you try to use a `const` or `class`\
    \ before declaring them, you'll get a `ReferenceError` thrown your way."
  - "[PAGE 18]\n\n*Temporal dead zone* (TDZ) is a term dubbed by the JavaScript community\
    \ to describe why it's not possible to access `let` and `const` before they are\
    \ declared. `let` and `const` are both hoisted similarly to `var` and `function`\
    \ declarations, but there is a time span between entering the scope and being\
    \ declared in which they cannot be accessed. This period is the temporal dead\
    \ zone.\n\nAny attempt to access variables while they are in TDZ causes a `ReferenceError`.\
    \ Once execution reaches the declaration, the variable in TDZ is removed, and\
    \ they are allowed to be accessed. The TDZ exists to help us find bugs in our\
    \ code. Trying to access a variable before declaring it is rarely intentional.\n\
    \n> **The Lifespan of Variables**\n\nThe lifespan of variables within a function\
    \ spans the duration of the function's execution. Once a function concludes its\
    \ execution, all local variables within it are automatically cleared. In contrast,\
    \ global variables remain in memory until the program/webpage is closed.\n\nIt's\
    \ important to remember that TDZ applies only to the code block in which the variable\
    \ is declared. Attempting to access a variable outside its scope does not throw\
    \ an error because the variable is not in TDZ:\n\n```\nconsole.log(a);    // →\
    \ undefined\n\n{\n  console.log(a);    // → ReferenceError\n  let a = 10;\n}\n\
    \nvar a = 20;\n```\n\n# Function Hoisting\n\nSimilar to variables, function declarations\
    \ are hoisted to the top of their containing scope. But they are hoisted entirely,\
    \ including both the name and"
  - "[PAGE 19]\n\nthe function body. This means you can call a function declared using\
    \ `function` before the actual declaration in the code:\n\n```\nfn1();    // →\
    \ Hello!\n\nfunction fn1() {\n  console.log(\"Hello!\");\n}\n```\n\nFunction expressions,\
    \ on the other hand, are not hoisted in the same way. Only the variable declaration\
    \ is hoisted, and the function assignment occurs at the point where the variable\
    \ is declared:\n\n```\nfn2();    // → TypeError: fn2 is not a function\n\nvar\
    \ fn2 = function() {\n  console.log(\"Hello!\");\n};\n```\n\nIn this case, the\
    \ variable `fn2` is initially assigned `undefined`, so you can't call it as a\
    \ function until the assignment is made.\n\nSo remember, it's best to declare\
    \ variables at the top of the scope they belong to. That way, you'll steer clear\
    \ of any confusion down the road. Additionally, try to get into the habit of using\
    \ `let` and `const` instead of `var` because they help prevent potential problems\
    \ like variable hoisting and accidental variable redeclaration.\n\n# Further Reading\n\
    \n*JavaScript hoisting*\n\n> https://developer.mozilla.org/en-US/docs/Glossary/Hoisting\n\
    \n*The var statement*\n\n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var\n\
    \n*The letdeclaration*"
