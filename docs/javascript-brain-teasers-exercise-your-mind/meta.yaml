    # Discussion


    The `await` keyword allows you to write asynchronous code in a more linear fashion,
    making it easier to understand the flow of execution, even when dealing with operations
    that take time to complete.


    First, we have the synchronous `console.log("Application started")` that simply
    logs the string "Application started" to the console. Then we have `async function
    fetchDataFromAPI() { ... }`, which declares an asynchronous function. Asynchronous
    functions can use the `await` keyword to pause their execution while waiting for
    a promise to resolve.


    Inside the function, `await processAPIData()` uses the `await` keyword to pause
    the execution of the `fetchDataFromAPI` function until the `processAPIData` function
    completes its execution. In this case, since `processAPIData` is an asynchronous
    function, it returns a promise, and `await` ensures that the program will wait
    for that promise to be resolved before proceeding.


    To summarize the sequence of events:


    +   - The code starts by logging "Application started".

    - The `fetchDataFromAPI` function is called, which logs "Fetching data from API...",
    and awaits the completion of the `processAPIData` function.

    - Inside the `processAPIData` function, "Processing API data..." is logged.

    - The script then logs "Application ended", as it is now allowed to continue to
    execute outside the `fetchDataFromAPI` function.

    - Finally, "Data fetched successfully" is logged.'
