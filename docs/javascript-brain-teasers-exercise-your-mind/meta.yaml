  md: "```\nfn();\n```\n\nSo, when looking at the first line of this function, you\
    \ might think it'll log **10** and **20**. But JavaScript actually processes the\
    \ code differently:\n\n```\nvar a = 10;\n\nfunction fn() {\n  var a;\n  console.log(a);\
    \    // → undefined\n  a = 20;\n  console.log(a);    // → 20\n}\n\nfn();\n```\n\
    \nTo make sure things go smoothly and we don't run into any surprises, ES2015\
    \ came up with a solution: the `let` keyword for declaring variables. With `let`,\
    \ variables still get hoisted, but now they're like reminders. They'll give us\
    \ a heads-up if we try to use a variable that hasn't been declared, preventing\
    \ any unexpected hiccups:\n\n```\nfunction fn() {\n  console.log(a);    // → undefined\n\
    \  console.log(b);    // → ReferenceError: b is not defined\n\n  var a = 20;\n\
    \  let b = 20\n\n  console.log(a);\n}\n\nfn();\n```\n\nSo with `var`, when you\
    \ try to get hold of a variable before it's declared, you'll get `undefined` as\
    \ a response. On the other hand, if you attempt the same thing with `let`, you'll\
    \ get an error message. As with `let`, if you try to use a `const` or `class`\
    \ before declaring them, you'll get a `ReferenceError` thrown your way."
