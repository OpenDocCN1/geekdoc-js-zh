    \n## Part 1\nJavaScript Brain Teasers\n\n### Puzzle 1: Your Code Deserves a Lift\n\
    \n```\nyour_code_deserves_a_lift/your_code_deserves_a_lift.js\n\nlet temp = 25;\n\
    \nfunction displayTemperature() {\n  console.log(`Current temperature: ${temp}\
    \ °C`);\n}\n\nfunction forecastTemperature() {\n  console.log(`Expected temperature:\
    \ ${temp} °C`);\n  var temp = 28;\n}\n\ndisplayTemperature();\nforecastTemperature();\n\
    ```\n\n### Guess the Output\n\nTry to guess what the output is before moving to\
    \ the next page.\n\n![Output illustration](img/7ad0e8939612afa723b8affa6c064dcf_15_0.png)\n\
    \nYou might have expected the output to be:\n\n```\nCurrent temperature: 25 °C\n\
    Expected temperature: 25 °C\n```\n\nBut this code will actually output:\n\n```\n\
    Current temperature: 25 °C\nExpected temperature: undefined °C\n```\n\n### Discussion\n\
    \nIn JavaScript, all declarations are subject to *hoisting*. This includes **var**,\
    \ **let**, **const**, **function**, **function\\***, and **class** declarations.\
    \ Hoisting involves the automatic relocation of these declarations to the scope's\
    \ beginning. But, their initialization is deferred until the execution flow hits\
    \ the line where hoisting occurred. This process occurs before the code is executed,\
    \ and it helps JavaScript handle references to variables and functions.\n\nConsider\
    \ the following code:\n\n```\n// Create a variable\nvar a = 10;\n```\n\nThis code\
    \ is processed by JavaScript in the following manner:\n\n```\nvar a;\n// Create\
    \ a variable\na = 10;\n```\n\nWhen you declare a variable using the **var** keyword,\
    \ the declaration is moved (or \"hoisted\") to the top of the containing function\
    \ or global scope. However, the assignment (initialization) of the variable remains\
    \ in its original place. This means that you can reference a **var** before it's\
    \ declared in your code without causing an error. However, the value will be **undefined**\
    \ until you actually assign a value to it.\n\nThis behavior can lead to unexpected\
    \ outcomes when working with functions. Any variable that is declared within a\
    \ function will be hoisted to the top. Consequently, if there exists a variable\
    \ with an identical name in the global scope, it will become concealed within\
    \ the function. For example:\n\n```\nvar a = 10;\n\nfunction fn() {\n  console.log(a);\
    \  // → undefined\n  var a = 20;\n\n  console.log(a);  // → 20\n}\n\nfn();\n```\n\
    \nSo, when looking at the first line of this function, you might think it'll log\
    \ **10** and **20**. But JavaScript actually processes the code differently:\n\
    \n```\nvar a = 10;\n\nfunction fn() {\n  var a;\n  console.log(a);    // → undefined\n\
    \  a = 20;\n  console.log(a);    // → 20\n}\n\nfn();\n```\n\nTo make sure things\
    \ go smoothly and we don't run into any surprises, ES2015 came up with a solution:\
    \ the `let` keyword for declaring variables. With `let`, variables still get hoisted,\
    \ but now they're like reminders. They'll give us a heads-up if we try to use\
    \ a variable that hasn't been declared, preventing any unexpected hiccups:\n\n\
    ```\nfunction fn() {\n  console.log(a);    // → undefined\n  console.log(b); \
    \   // → ReferenceError: b is not defined\n\n  var a = 20;\n  let b = 20;\n\n\
    \  console.log(a);\n}\n\nfn();\n```\n\nSo with `var`, when you try to get hold\
    \ of a variable before it's declared, you'll get `undefined` as a response. On\
    \ the other hand, if you attempt the same thing with `let`, you'll get an error\
    \ message. As with `let`, if you try to use a `const` or `class` before declaring\
    \ them, you'll get a `ReferenceError` thrown your way.\n\n*Temporal dead zone*\
    \ (TDZ) is a term dubbed by the JavaScript community to describe why it's not\
    \ possible to access `let` and `const` before they are declared. `let` and `const`\
    \ are both hoisted similarly to `var` and `function` declarations, but there is\
    \ a time span between entering the scope and being declared in which they cannot\
    \ be accessed. This period is the temporal dead zone.\n\nAny attempt to access\
    \ variables while they are in TDZ causes a `ReferenceError`. Once execution reaches\
    \ the declaration, the variable in TDZ is removed, and they are allowed to be\
    \ accessed. The TDZ exists to help us find bugs in our code. Trying to access\
    \ a variable before declaring it is rarely intentional.\n\n> **The Lifespan of\
    \ Variables**\n>\n> The lifespan of variables within a function spans the duration\
    \ of the function's execution. Once a function concludes its execution, all local\
    \ variables within it are automatically cleared. In contrast, global variables\
    \ remain in memory until the program/webpage is closed.\n\nIt's important to remember\
    \ that TDZ applies only to the code block in which the variable is declared. Attempting\
    \ to access a variable outside its scope does not throw an error because the variable\
    \ is not in TDZ:\n\n```\nconsole.log(a);    // → undefined\n\n{\n  console.log(a);\
    \    // → ReferenceError\n  let a = 10;\n}\n\nvar a = 20;\n```\n\n#### Function\
    \ Hoisting\n\nSimilar to variables, function declarations are hoisted to the top\
    \ of their containing scope. But they are hoisted entirely, including both the\
    \ name and the function body. This means you can call a function declared using\
    \ `function` before the actual declaration in the code:\n\n```\nfn1();    // →\
    \ Hello!\n\nfunction fn1() {\n  console.log(\"Hello!\");\n}\n```\n\nFunction expressions,\
    \ on the other hand, are not hoisted in the same way. Only the variable declaration\
    \ is hoisted, and the function assignment occurs at the point where the variable\
    \ is declared:\n\n```\nfn2();    // → TypeError: fn2 is not a function\n\nvar\
    \ fn2 = function() {\n  console.log(\"Hello!\");\n};\n```\n\nIn this case, the\
    \ variable `fn2` is initially assigned `undefined`, so you can't call it as a\
    \ function until the assignment is made.\n\nSo remember, it's best to declare\
    \ variables at the top of the scope they belong to. That way, you'll steer clear\
    \ of any confusion down the road. Additionally, try to get into the habit of using\
    \ `let` and `const` instead of `var` because they help prevent potential problems\
    \ like variable hoisting and accidental variable redeclaration.\n\n#### Further\
    \ Reading\n\n*JavaScript hoisting*\n\n> https://developer.mozilla.org/en-US/docs/Glossary/Hoisting\n\
    \n*The var statement*\n\n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var\n\
    \n*The let declaration*\n\n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let\n\
    \n*The const declaration*\n\n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const\n\
    \n## The Usurper\n\n```\nthe_usurper/the_usurper.js\n```\n\n```\n// Calculate\
    \ the area of a rectangle\nfunction calculateArea(length, width) {\n  return length\
    \ * width;\n}\n\n// Calculate the area of a square\nfunction calculateArea(length)\
    \ {\n  return length * length;\n}\n\nconsole.log(calculateArea(4, 6));\n```\n\n\
    ### Guess the Output\n\n![Output illustration](img/7ad0e8939612afa723b8affa6c064dcf_21_0.png)\n\
    \nTry to guess what the output is before moving to the next page.\n\nYou might\
    \ have expected the first function, which accepts two arguments, to be executed,\
    \ but the second function is executed resulting in the following output:\n\n```\n\
    16\n```\n\n### Discussion\n\nJavaScript doesn't support *function overloading*\
    \ like you might be used to in other languages. Function overloading means having\
    \ multiple functions with the same name but different parameter lists, and the\
    \ right function gets called based on the arguments you provide."
  mdcn: "\n## 关于作者\n\nFaraz K. Kelhini 是 *Modern Asynchronous JavaScript* 和 *Text\
    \ Processing with JavaScript* 的作者。凭借对 JavaScript 语言及其复杂 API 的深刻理解，Faraz 的旅程源于对推广创新理念的热情——这些理念旨在改善编程体验，同时构建将创意与功能无缝融合解决方案。\n\
    \n## 关于你\n\n在我们踏上这段激动人心的旅程之前，有必要说明：具备一定的 JavaScript 基础知识将大大有助于你理解此处讨论的概念。如果你是\
    \ JavaScript 新手，从未有机会探索它的奇妙之处，我建议你先花些时间学习基础知识——你会发现这是一段愉快的体验！\n\n## 关于代码\n\n提供的代码示例设计得简洁明了，旨在展示每个脑筋急转弯的核心本质。你可以随意在浏览器的控制台中执行这些示例，但请确保你的浏览器已更新到最新版本。\n\
    \n要获取书中 featured 的示例代码，请访问 Pragmatic Bookshelf 网站。[^1] 在那里，你可以提供反馈、报告错误、获取最新信息，并参与该书专门论坛页面上的讨论。\n\
    \n如果你以 PDF 格式阅读本书，可以通过选择代码段上方的小灰色框来查看或检索特定示例。\n\n**脚注**\n\n[^1]: https://www.pragprog.com/titles/fkjsbrain\n\
    \n## 第一部分\nJavaScript 脑筋急转弯\n\n### 谜题 1：你的代码值得提升\n\n```\nyour_code_deserves_a_lift/your_code_deserves_a_lift.js\n\
    \nlet temp = 25;\n\nfunction displayTemperature() {\n  console.log(`Current temperature:\
    \ ${temp} °C`);\n}\n\nfunction forecastTemperature() {\n  console.log(`Expected\
    \ temperature: ${temp} °C`);\n  var temp = 28;\n}\n\ndisplayTemperature();\nforecastTemperature();\n\
    ```\n\n### 猜测输出结果\n\n在翻到下一页之前，试着猜猜输出结果是什么。\n\n![输出结果图示](img/7ad0e8939612afa723b8affa6c064dcf_15_0.png)\n\
    \n你可能预期的输出是：\n\n```\nCurrent temperature: 25 °C\nExpected temperature: 25 °C\n\
    ```\n\n但这段代码的实际输出将是：\n\n```\nCurrent temperature: 25 °C\nExpected temperature:\
    \ undefined °C\n```\n\n### 讨论\n\n在 JavaScript 中，所有声明都受制于*提升*（hoisting）。这包括 **var**、**let**、**const**、**function**、**function\\\
    *** 和 **class** 声明。提升涉及将这些声明自动重新定位到作用域的开头。但是，它们的初始化被推迟到执行流到达提升发生的那一行时才进行。此过程在代码执行之前发生，它帮助\
    \ JavaScript 处理对变量和函数的引用。\n\n考虑以下代码：\n\n```\n// 创建一个变量\nvar a = 10;\n```\n\nJavaScript\
    \ 按以下方式处理这段代码：\n\n```\nvar a;\n// 创建一个变量\na = 10;\n```\n\n当你使用 **var** 关键字声明变量时，声明会被移动（或\"\
    提升\"）到包含函数或全局作用域的顶部。然而，变量的赋值（初始化）保留在其原始位置。这意味着你可以在代码中声明之前引用 **var** 而不会导致错误。但是，在真正为其赋值之前，其值将是\
    \ **undefined**。\n\n这种行为在使用函数时可能导致意外的结果。在函数内声明的任何变量都会被提升到顶部。因此，如果全局作用域中存在同名变量，它将在函数内被隐藏。例如：\n\
    \n```\nvar a = 10;\n\nfunction fn() {\n  console.log(a);  // → undefined\n  var\
    \ a = 20;\n\n  console.log(a);  // → 20\n}\n\nfn();\n```\n\n所以，当看到这段函数的第一行时，你可能以为它会输出\
    \ **10** 和 **20**。但 JavaScript 实际上以不同方式处理这段代码：\n\n```\nvar a = 10;\n\nfunction\
    \ fn() {\n  var a;\n  console.log(a);    // → undefined\n  a = 20;\n  console.log(a);\
    \    // → 20\n}\n\nfn();\n```\n\n为了确保一切顺利并避免任何意外，ES2015 提出了一个解决方案：使用 `let` 关键字声明变量。使用\
    \ `let` 时，变量仍然会被提升，但现在它们就像提醒一样。如果我们尝试使用尚未声明的变量，它们会给我们一个提示，防止任何意外的麻烦：\n\n```\n\
    function fn() {\n  console.log(a);    // → undefined\n  console.log(b);    //\
    \ → ReferenceError: b is not defined\n\n  var a = 20;\n  let b = 20;\n\n  console.log(a);\n\
    }\n\nfn();\n```\n\n所以使用 `var` 时，当你尝试在声明之前获取变量，会得到 `undefined` 作为回应。另一方面，如果你用 `let`\
    \ 做同样的事情，你会收到错误消息。与 `let` 类似，如果你尝试在声明之前使用 `const` 或 `class`，也会收到抛出的 `ReferenceError`。\n\
    \n*暂时性死区*（TDZ）是 JavaScript 社区创造的一个术语，用来说明为什么无法在 `let` 和 `const` 声明之前访问它们。`let`\
    \ 和 `const` 的提升方式与 `var` 和 `function` 声明类似，但在进入作用域和声明完成之间存在一个时间段，在此期间无法访问它们。这个时期就是暂时性死区。\n\
    \n任何在变量处于 TDZ 时尝试访问它们的行为都会导致 `ReferenceError`。一旦执行到达声明行，TDZ 中的变量便被移除，允许被访问。TDZ\
    \ 的存在是为了帮助我们找出代码中的 bug。在声明之前尝试访问变量很少是有意的。\n\n> **变量的生命周期**\n>\n> 函数内变量的生命周期贯穿函数执行的整个持续时间。一旦函数执行结束，其内部所有局部变量都会被自动清除。相比之下，全局变量会一直保留在内存中，直到程序/网页关闭。\n\
    \n重要的是要记住，TDZ 仅适用于声明变量的代码块。尝试在作用域之外访问变量不会抛出错误，因为该变量不在 TDZ 中：\n\n```\nconsole.log(a);\
    \    // → undefined\n\n{\n  console.log(a);    // → ReferenceError\n  let a =\
    \ 10;\n}\n\nvar a = 20;\n```\n\n#### 函数提升\n\n与变量类似，函数声明会被提升到其包含作用域的顶部。但它们会被完全提升，包括函数名称和函数体。这意味着你可以在代码中实际声明之前调用使用\
    \ `function` 声明的函数：\n\n```\nfn1();    // → Hello!\n\nfunction fn1() {\n  console.log(\"\
    Hello!\");\n}\n```\n\n另一方面，函数表达式不会以相同方式提升。只有变量声明被提升，函数赋值发生在变量声明的位置：\n\n```\nfn2();\
    \    // → TypeError: fn2 is not a function\n\nvar fn2 = function() {\n  console.log(\"\
    Hello!\");\n};\n```\n\n在这种情况下，变量 `fn2` 最初被赋值为 `undefined`，所以在赋值完成之前你无法将其作为函数调用。\n\
    \n所以请记住，最好在变量所属作用域的顶部声明变量。这样，你就能避免日后的任何困惑。此外，尽量养成使用 `let` 和 `const` 而不是 `var`\
    \ 的习惯，因为它们有助于防止诸如变量提升和意外变量重新声明等潜在问题。\n\n#### 延伸阅读\n\n*JavaScript 提升*\n\n> https://developer.mozilla.org/en-US/docs/Glossary/Hoisting\n\
    \n*var 语句*\n\n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var\n\
    \n*let 声明*\n\n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let\n\
    \n*const 声明*\n\n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const\n\
    \n## 篡夺者\n\n```\nthe_usurper/the_usurper.js\n```\n\n```\n// 计算长方形的面积\nfunction\
    \ calculateArea(length, width) {\n  return length * width;\n}\n\n// 计算正方形的面积\n\
    function calculateArea(length) {\n  return length * length;\n}\n\nconsole.log(calculateArea(4,\
    \ 6));\n```\n\n### 猜测输出结果\n\n![输出结果图示](img/7ad0e8939612afa723b8affa6c064dcf_21_0.png)\n\
    \n在翻到下一页之前，试着猜猜输出结果是什么。\n\n你可能预期第一个接受两个参数的函数会被执行，但第二个函数被执行了，产生以下输出：\n\n```\n16\n\
    ```\n\n### 讨论\n\nJavaScript 不支持你在其他语言中可能已经习惯的*函数重载*。函数重载意味着拥有多个同名但参数列表不同的函数，根据提供的参数来调用正确的函数。\n"
