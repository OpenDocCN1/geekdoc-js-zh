    ```

    const combinedArray = [...array1, ...array2];


    console.log(combinedArray);    // → [1, 2, 3, 4, 5, 6]

    ```


    Compared to `concat()`, the spread operator is more readable, especially when
    you only need to combine a couple of arrays.


    3. **push() or unshift()**: You can also use array manipulation methods like `push()`
    or `unshift()` to merge arrays:


    ```

    mortal_koncatenation/mortal_koncatenation_ex3-1.js


    const array1 = [1, 2, 3];

    const array2 = [4, 5, 6];


    // Combining arrays using push()

    array1.push(...array2);

    console.log(array1);    // → [1, 2, 3, 4, 5, 6]

    ```


    ```

    mortal_koncatenation/mortal_koncatenation_ex3-2.js


    const array1 = [1, 2, 3];

    const array2 = [4, 5, 6];


    // Combining arrays using unshift()

    array1.unshift(...array2);

    console.log(array1);    // → [4, 5, 6, 1, 2, 3]

    ```


    The `push()` method appends the elements of the second array to the end of the
    first array, while `unshift()` adds them to the beginning.


    4. **splice()**: If you want to insert the elements of an array into another array
    at a specific index, you can use the `splice()` method:


    ```

    mortal_koncatenation/mortal_koncatenation_ex4.js


    const array1 = [1, 2, 3];

