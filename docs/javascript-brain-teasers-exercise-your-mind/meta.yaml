    \  // → 2\n```\n\n这里，因为 `\"user\"` 是一个字符串，所以它作为数组内部的一个属性被包含进来。\n\n所以，属性就像我们可以附加到数组或任何其他对象上的额外信息，但它们不被视为数组长度或元素的一部分。它们只是这个恰好是数组的基础对象的属性。你也不能使用像\
    \ `forEach()` 或 `map()` 这样的数组迭代方法来遍历这些属性。\n\n### 延伸阅读\n\n*Array 对象*\n\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array\n\
    \n## 第28题 负重力\n\n```javascript\nconsole.log(7 - - 5)\nconsole.log(7 - -5)\nconsole.log(7-\
    \ -5)\nconsole.log(7--5)\n```\n\n### 猜猜输出结果\n\n> 在翻到下一页之前，试着猜猜输出结果是什么。\n\n这段代码的输出是：\n\
    \n```\n12\n12\n12\nSyntaxError: invalid increment/decrement operand\n```\n\n###\
    \ 讨论\n\n减号 (-) 通常用于减法，但这里我们有两个减号紧挨在一起。因此，减号被应用了两次到第二个操作数上，实际上等于对值进行了两次取反。由于对一个负数取反会得到一个正数，所以表达式\
    \ **7 - - 5** 实际上被解释为 **7 - (-5)**，简化后就是 **7 + 5**。因此，表达式的结果是数字 **12**。\n\n第二行的表达式\
    \ **7 - -5** 与第一个类似。它正确地从 **7** 中减去了值 **-5**。结果是 **12**。**7- -5** 也正确地从 **7**\
    \ 中减去了值 **-5**。就像前两个表达式一样，结果是 **12**。\n\n第四个表达式 `7--5` 则不同。这里有两个连续的减号，中间没有任何空格。在\
    \ JavaScript 中，`--` 被视为递减运算符，用于将变量的值减少 1。由于这里没有变量，这个表达式会导致语法错误，因为它不是有效的操作。\n\n\
    所以，类似于现实世界中的数学运算，从一个数中减去另一个负数，等同于加上那个数的绝对值。但是，当第一个减号和第二个减号之间没有空格时，就需要注意了，这种情况下表达式会被解释为递减运算符。\n\
