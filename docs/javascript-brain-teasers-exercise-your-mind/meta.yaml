- md: "## Puzzle 3: The Mathemagician\n\nthe_mathemagician/the_mathemagician.js\n\n\
    ```js\nconst largeNumber = Math.pow(10, 16);\nconst smallNumber = 1;\n\nconsole.log(largeNumber\
    \ + smallNumber);\n```\n\n> **Guess the Output**\n> Try to guess what the output\
    \ is before moving to the next page.\n\nYou might have expected the output to\
    \ be 10000000000000001, but this code will actually log:\n\n```\n10000000000000000\n\
    ```\n\n## Discussion\n\nIn JavaScript, the `Math.pow()` function can be used to\
    \ raise a number to a specified power. In this case, the code `Math.pow(10, 16)`\
    \ calculates the result of raising the number 10 to the power of 16, resulting\
    \ in 10000000000000000. But why does the sum of 10000000000000000 and 1 equal\
    \ 10000000000000000?\n\nJavaScript does have some limitations when it comes to\
    \ representing very large numbers accurately. The limitation is due to the way\
    \ numbers are stored and the precision of the data type used in JavaScript. The\
    \ Number type has a specific range where it works best. It can handle integers\
    \ between -9007199254740991 and 9007199254740991 perfectly without losing any\
    \ precision.\n\nBut if you happen to use an integer outside of this range, there's\
    \ a chance that it won't be represented accurately. This issue is known as *loss\
    \ of precision* when dealing with large numbers in JavaScript. Here's another\
    \ example you can try:\n\n```js\nconsole.log(9999999999999999);    // → 10000000000000000\n\
    ```\n\nJavaScript has got you covered with a couple of handy constants that make\
    \ it easy to get the maximum and minimum safe integers. Just use the `Number.MAX_SAFE_INTEGER`\
    \ constant to get the largest safe integer and the `Number.MIN_SAFE_INTEGER` constant\
    \ to grab the smallest safe integer:\n\n```js\nconsole.log(Number.MIN_SAFE_INTEGER);\
    \    // → -9007199254740991\nconsole.log(Number.MAX_SAFE_INTEGER);    // → 9007199254740991\n\
    ```\n\nPreviously, to handle very large numbers with precision, JavaScript developers\
    \ had to use external libraries like BigInt.js[^2] or BigNumber.js.[^3] Fortunately,\
    \ ECMAScript 2020 (the standardized specification for JavaScript) came to the\
    \ rescue with a fantastic solution called BigInt. Creating a BigInt is easy: simply\
    \ append the letter **n** to the end of an integer, like this:\n\n```js\nconsole.log(9999999999999999n);\
    \    // → 9999999999999999n\n```\n\nOr, you can use the `BigInt()` constructor:\n\
    \n```js\nBigInt(\"9999999999999999\");    // → 9999999999999999n\n```\n\nSo, to\
    \ fix the code in this puzzle, we can write:\n\n```js\nconst largeNumber = BigInt(\"\
    1000000000000000\");\nconst smallNumber = BigInt(\"1\");\n\nconsole.log(largeNumber\
    \ + smallNumber);\n// → 1000000000000001n\n```\n\nYou might be curious about why\
    \ we're also converting the `smallNumber` to a BigInt. To maintain the integrity\
    \ of the data and avoid potential loss of information, mixed operations between\
    \ BigInts and Numbers are not permitted. The reason behind this restriction is\
    \ that the resulting value may not be accurately representable by either BigInt\
    \ or Number data types.\n\nLet's take a look at the following example to better\
    \ understand this:\n\n```js\n10000000000000000n + 0.5;\n// → TypeError: Cannot\
    \ mix BigInt and other types, use explicit conversions\n```\n\nConverting a Number\
    \ with a fractional part to a BigInt may not yield an accurate representation,\
    \ just as converting a BigInt larger than 2^53 to a Number may also result in\
    \ loss of precision.\n\nWhen performing arithmetic computations involving both\
    \ BigInt and Number values, you have to choose the domain in which the operation\
    \ should take place. Convert either of the operands by using the functions **Number()**\
    \ or **BigInt()**:\n\n```js\n// convert the Number to a BigInt\nBigInt(5) + 5n;\
    \   // → 10n\n\n// or convert the BigInt to a Number\n5 + Number(5n);   // → 10\n\
    ```\n\nThere are some subtle differences between a Number and a BigInt. You can\
    \ use all arithmetic operators on a BigInt except for the unary plus (+) operator:\n\
    \n```js\nconsole.log(1n + 2n);   // → 3n\nconsole.log(1n - 2n);   // → -1n\nconsole.log(1n\
    \ * 2n);   // → 2n\nconsole.log(2n / 1n);   // → 2n\nconsole.log(14n % 10n); //\
    \ → 4n\nconsole.log(5n ** 3n);  // → 125n\n\nlet x = 1n;\nconsole.log(++x); //\
    \ → 2n\nconsole.log(--x); // → 1n\nconsole.log(-x);  // → -1n\nconsole.log(+x);\
    \  // → TypeError: Cannot convert a BigInt value to a Number\n```\n\nThe unary\
    \ plus (+) operator is not supported for a reason. Some programs may depend on\
    \ the fact that the + operator always results in a Number or throws an exception.\
    \ By not supporting it, JavaScript ensures that your code remains reliable and\
    \ consistent.\n\nWhen you use arithmetic operators with BigInt operands, you would\
    \ expect them to return a BigInt value. So, when it comes to the division (/)\
    \ operator, the result is automatically truncated to maintain consistency with\
    \ this expectation:\n\n```js\nconsole.log(12 / 5);      // → 2.4\nconsole.log(12n\
    \ / 5n);    // → 2n\n```\n\nWhen it comes to comparing a BigInt with a regular\
    \ number, remember that they are not of the same type. This means you can't use\
    \ the strict equality operator (===) directly to compare them:\n\n```js\nconsole.log(1n\
    \ === 1);     // → false\nconsole.log(typeof 1n);    // → bigint\nconsole.log(typeof\
    \ 1);     // → number\n```\n\nHowever, you do have the option to use the equality\
    \ operator (==), which automatically converts the types of its operands (known\
    \ as *type coercion*) before comparing them:\n\n```js\nconsole.log(10n == 10);\
    \    // → true\n```\n\nIt's worth mentioning that you should also avoid passing\
    \ a BigInt as an argument to built-in JavaScript functions and APIs that specifically\
    \ require a Number. Doing so will trigger a TypeError, as in this example:\n\n\
    ```js\nMath.min(5n, 10n, 15n);   // → TypeError\n```\n\nSo, you should use the\
    \ Number data type when dealing with regular numeric values that fall within the\
    \ range of -9007199254740991 and 9007199254740991, which is suitable for most\
    \ everyday calculations.\n\n## Further Reading\n\n- *Function overloading*\n \
    \ [https://en.wikipedia.org/wiki/Function_overloading](https://en.wikipedia.org/wiki/Function_overloading)\n\
    \n- *Default parameters*\n  [https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Default_parameters](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Default_parameters)\n\
    \n- *Rest parameters*\n  [https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/rest_parameters](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/rest_parameters)"
  mdcn: "\n## 谜题 3：数学魔术师\n\nthe_mathemagician/the_mathemagician.js\n\n```js\nconst\
    \ largeNumber = Math.pow(10, 16);\nconst smallNumber = 1;\n\nconsole.log(largeNumber\
    \ + smallNumber);\n```\n\n> **猜测输出**\n> 在翻到下一页之前，试着猜一猜输出是什么。\n\n你可能预期输出是 10000000000000001，但这段代码实际会输出：\n\
    \n```\n10000000000000000\n```\n\n## 讨论\n\n在 JavaScript 中，`Math.pow()` 函数可用于将一个数提升到指定的幂。在这个例子中，代码\
    \ `Math.pow(10, 16)` 计算 10 的 16 次方，结果是 10000000000000000。但为什么 10000000000000000\
    \ 加 1 会等于 10000000000000000 呢？\n\nJavaScript 在精确表示非常大的数字时确实存在一些局限性。这种局限性源于数字的存储方式以及\
    \ JavaScript 中使用的数据类型的精度。Number 类型有一个特定的工作范围，它可以完美地处理 -9007199254740991 到 9007199254740991\
    \ 之间的整数，不会丢失任何精度。\n\n但如果你恰好使用了超出这个范围的整数，就有可能无法被精确表示。这个问题被称为在 JavaScript 中处理大数时的*精度丢失*。这里还有另一个你可以尝试的例子：\n\
    \n```js\nconsole.log(9999999999999999);    // → 10000000000000000\n```\n\nJavaScript\
    \ 为你提供了几个方便的常量，让你轻松获取最大和最小安全整数。只需使用 `Number.MAX_SAFE_INTEGER` 常量来获取最大的安全整数，使用\
    \ `Number.MIN_SAFE_INTEGER` 常量来获取最小的安全整数：\n\n```js\nconsole.log(Number.MIN_SAFE_INTEGER);\
    \    // → -9007199254740991\nconsole.log(Number.MAX_SAFE_INTEGER);    // → 9007199254740991\n\
    ```\n\n以前，为了精确处理非常大的数字，JavaScript 开发者不得不使用 BigInt.js[^2] 或 BigNumber.js[^3] 等外部库。幸运的是，ECMAScript\
    \ 2020（JavaScript 的标准化规范）带来了一个绝佳的解决方案，那就是 BigInt。创建 BigInt 很简单：只需在整数末尾加上字母 **n**，像这样：\n\
    \n```js\nconsole.log(9999999999999999n);    // → 9999999999999999n\n```\n\n或者，你也可以使用\
    \ `BigInt()` 构造函数：\n\n```js\nBigInt(\"9999999999999999\");    // → 9999999999999999n\n\
    ```\n\n所以，要修复这个谜题中的代码，我们可以这样写：\n\n```js\nconst largeNumber = BigInt(\"1000000000000000\"\
    );\nconst smallNumber = BigInt(\"1\");\n\nconsole.log(largeNumber + smallNumber);\n\
    // → 1000000000000001n\n```\n\n你可能好奇为什么我们也要将 `smallNumber` 转换为 BigInt。为了维护数据的完整性并避免潜在的信息丢失，BigInt\
    \ 和 Number 之间的混合运算是不被允许的。这一限制的原因是，结果值可能无法被 BigInt 或 Number 数据类型准确表示。\n\n让我们看看下面的例子来更好地理解这一点：\n\
    \n```js\n10000000000000000n + 0.5;\n// → TypeError: Cannot mix BigInt and other\
    \ types, use explicit conversions\n```\n\n将带有小数部分的 Number 转换为 BigInt 可能无法得到准确的表示，同样，将大于\
    \ 2^53 的 BigInt 转换为 Number 也可能导致精度丢失。\n\n当执行涉及 BigInt 和 Number 值的算术运算时，你必须选择运算应该在哪个域中进行。使用\
    \ **Number()** 或 **BigInt()** 函数转换任一操作数：\n\n```js\n// 将 Number 转换为 BigInt\nBigInt(5)\
    \ + 5n;   // → 10n\n\n// 或者将 BigInt 转换为 Number\n5 + Number(5n);   // → 10\n```\n\
    \nNumber 和 BigInt 之间存在一些细微的差异。你可以在 BigInt 上使用所有算术运算符，但一元加号（+）运算符除外：\n\n```js\n\
    console.log(1n + 2n);   // → 3n\nconsole.log(1n - 2n);   // → -1n\nconsole.log(1n\
    \ * 2n);   // → 2n\nconsole.log(2n / 1n);   // → 2n\nconsole.log(14n % 10n); //\
    \ → 4n\nconsole.log(5n ** 3n);  // → 125n\n\nlet x = 1n;\nconsole.log(++x); //\
    \ → 2n\nconsole.log(--x); // → 1n\nconsole.log(-x);  // → -1n\nconsole.log(+x);\
    \  // → TypeError: Cannot convert a BigInt value to a Number\n```\n\n一元加号（+）运算符不被支持是有原因的。某些程序可能依赖于\
    \ + 运算符总是返回 Number 或抛出异常这一事实。通过不支持它，JavaScript 确保你的代码保持可靠和一致。\n\n当你对 BigInt 操作数使用算术运算符时，你会期望它们返回\
    \ BigInt 值。因此，对于除法（/）运算符，结果会自动截断，以符合这一预期：\n\n```js\nconsole.log(12 / 5);     \
    \ // → 2.4\nconsole.log(12n / 5n);    // → 2n\n```\n\n在比较 BigInt 和普通数字时，记住它们不是同一种类型。这意味着你不能直接使用严格相等运算符（===）来比较它们：\n\
    \n```js\nconsole.log(1n === 1);     // → false\nconsole.log(typeof 1n);    //\
    \ → bigint\nconsole.log(typeof 1);     // → number\n```\n\n不过，你可以选择使用相等运算符（==），它会自动转换操作数的类型（称为*类型强制*）后再进行比较：\n\
    \n```js\nconsole.log(10n == 10);    // → true\n```\n\n值得一提的是，你还应该避免将 BigInt 作为参数传递给那些明确要求\
    \ Number 的内置 JavaScript 函数和 API。这样做会触发 TypeError，就像这个例子：\n\n```js\nMath.min(5n,\
    \ 10n, 15n);   // → TypeError\n```\n\n所以，你应该在处理位于 -9007199254740991 到 9007199254740991\
    \ 范围内的常规数值时使用 Number 数据类型，这适用于大多数日常计算。\n\n## 延伸阅读\n\n- *函数重载*\n  [https://en.wikipedia.org/wiki/Function_overloading](https://en.wikipedia.org/wiki/Function_overloading)\n\
    \n- *默认参数*\n  [https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Default_parameters](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Default_parameters)\n\
    \n- *剩余参数*\n  [https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/rest_parameters](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/rest_parameters)\n"
