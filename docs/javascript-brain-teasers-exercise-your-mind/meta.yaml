  md: 'So, running `console.log(this)` will give you different outputs depending on
    where the code is running and how it''s being used. Keep in mind that if you use
    `this` to access the global object, it could make your code less portable. Every
    JavaScript environment has its own object model and different ways to reach the
    global object. In a web browser, you can access the global object using `window`,
    `self`, `this`, or `frames`. It''s pretty flexible!


    For example, `window.alert(''Hello'')` accesses the global object (window) and
    invokes the `alert` method. Additionally, you can access the global object directly
    without using the `window` prefix. For example, `alert(''Hello'')` would work
    as well.


    In Node.js, however, properties like `window` and `self` don''t exist, and you
    must use `global` instead. In Web Workers, only `self` is available. These different
    ways of referencing the global object have made it tough to write portable JavaScript
    code that works in multiple environments.


    Fortunately, ECMAScript fixed this issue in ES2020 by introducing a standard property
    called `globalThis` that''s available in all environments:


    ```

    whats_this/whats_this_ex6.js


    // Browser environment

    console.log(globalThis);  // → Window {...}


    // Node.js environment

    console.log(globalThis);  // → <ref *1> Object [global] {...}


    // Web worker environment

    console.log(globalThis);  // → DedicatedWorkerGlobalScope {...}

    ```


    By using `globalThis`, your code will work effortlessly in both window and non-window
    contexts without the need for extra checks.


    When you''re unsure about the environment in which your code will be utilized
    or if you want to ensure its compatibility across different environments, the
    `globalThis` property becomes incredibly useful. Keep in mind'
