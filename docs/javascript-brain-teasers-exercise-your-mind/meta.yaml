- md: "## Puzzle 21 The Chain Master\n\nthe_chain_master/the_chain_master.js\n\n```javascript\n\
    const titles = null;\nlet x = 0;\n\ntitles?.[++x].toUpperCase();\n\nconsole.log(x);\n\
    ```\n\n## Guess the Output\n\nTry to guess what the output is before moving to\
    \ the next page.\n\nThis code will output:\n\n```\n0\n```\n\n## Discussion\n\n\
    In this puzzle, we attempt to increment x by 1 through optional chaining, but\
    \ since titles is null, the increment operation is not executed. So, it prints\
    \ the value of x (which is still 0) to the console.\n\nLet’s dig a bit deeper.\
    \ The ?. is called the optional chaining operator. It allows us to access properties\
    \ or call methods on an object only if the object is not null or undefined. Since\
    \ titles is null, the code after ?. will not be executed.\n\nInside the square\
    \ brackets, we have ++x. This is a pre-increment operator, which means it increments\
    \ the value of x by 1 before the expression is evaluated. However, this line is\
    \ essentially skipped due to `titles` being `null`. So x remains 0 and is not\
    \ changed.\n\nThe optional chaining operator (`?.`) was added to ECMAScript 2020\
    \ to help developers prevent errors that could occur when trying to access properties\
    \ or call methods on non-existent or nullish values. Before the optional chaining\
    \ operator was introduced, developers had to write longer and more complex code\
    \ to perform this check, which often involved using conditional statements or\
    \ ternary operators.\n\nFor example:\n\n```javascript\nthe_chain_master/the_chain_master_ex1.js\n\
    \n// Check if response has a data object\n// and data has a user property\n\n\
    const response = {\n    //...\n};\n\n// using the conditional statement\nif (response\
    \ && response.data) {\n    const user = response.data.user;\n}\n\n// using the\
    \ ternary operator\nconst user =\n    (response ?\n        (response.data ?\n\
    \            response.data.user :\n            undefined) :\n        undefined);\n\
    ```\n\nThe optional chaining operator simplifies this process by allowing developers\
    \ to directly access properties or call methods on an object without worrying\
    \ about potential `null` or `undefined` values:\n\n```javascript\nthe_chain_master/the_chain_master_ex2.js\n\
    \nconst response = {};\nconst city = response?.data?.user?.city;\n\nconsole.log(city);\
    \    // → undefined\n```\n\nThis code tries to grab a property that’s nested inside\
    \ **response**, but it doesn’t actually exist. Now, instead of freaking out and\
    \ throwing an error, JavaScript just gives you an **undefined** value. The syntax\
    \ is not only shorter but also easier to read.\n\nTechnically speaking, when you\
    \ use **response?.data**, it’s basically the same as **response == null ? undefined\
    \ : response.data**. That little **?.** thing is just a handy way to make it faster.\
    \ And here’s something to keep in mind: you can’t use the optional chaining on\
    \ the left side of an assignment:\n\n```javascript\nthe_chain_master/the_chain_master_ex3.js\n\
    \nconst response = {};\n\nresponse?.data = \"abc\";\n// → SyntaxError: Invalid\
    \ left-hand side in assignment\n```\n\nSo, the optional chaining operator streamlines\
    \ the process of accessing nested properties and methods within objects. This\
    \ operator short-circuits the evaluation if any intermediary property is **null**\
    \ or **undefined**, preventing runtime errors and allowing for cleaner, more reliable\
    \ code that gracefully handles missing or incomplete data structures.\n\n## Further\
    \ Reading\n\n- [Error-free property chaining with ES2020 optional chaining operator](https://blog.logrocket.com/error-free-property-chaining-with-es2020-optional-chaining-operator/)\n\
    - [The optional chaining (?.) operator](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Optional_chaining)\n\
    \n## Puzzle 22 The Shape Shifter\n\n```javascript\nthe_shape_shifter/the_shape_shifter.js\n\
    const a = \"f\"<{};\nconst b = \"F\"<{};\n\nconsole.log(a);\nconsole.log(b);\n\
    ```\n\n## Guess the Output\n\nTry to guess what the output is before moving to\
    \ the next page.\n\nThis code will output:\n\n```\nfalse\ntrue\n```\n\n## Discussion\n\
    \nIn JavaScript, when you use the < operator to compare values, it performs a\
    \ process called *type coercion* to convert the values into a common type before\
    \ making the comparison.\n\nIn this code snippet, we have a string \"f\" on the\
    \ left side and an empty object {} on the right side. JavaScript does its magic\
    \ and tries to convert these values into a common type. In this case, since there's\
    \ a string \"f\" involved, the common type chosen is a string.\n\nWhen JavaScript\
    \ tries to convert the empty object {} into a string, it uses the object's default\
    \ toString() method, which returns a string representation of the object. In this\
    \ case, the empty object {} is converted into the string \"[object Object]\".\
    \ So now we have the comparison \"F\" < \"[object Object]\".\n\nWhen you compare\
    \ strings using the < operator, it performs a lexicographic comparison. That means\
    \ JavaScript examines the character codes (Unicode values) of the corresponding\
    \ characters from left to right. In Unicode, the character code for \"[\" (opening\
    \ square bracket) is greater than the character code for \"F\" (uppercase letter\
    \ F).\n\nTherefore, \"F\" is considered to be less than \"[object Object]\", and\
    \ the expression \"F\" < \"[object Object]\" evaluates to true. On the other hand,\
    \ the character \"f\" has a higher Unicode value than the character \"[\", so\
    \ \"f\" is considered to be more than \"[object Object]\", and the comparison\
    \ evaluates to false.\n\nYou can also transform this technique into a reusable\
    \ function:\n\n```javascript\nthe_shape_shifter/the_shape_shifter_ex1.js\n\nconst\
    \ isUpperCase = x => x < {};\n\nisUpperCase(\"F\");  // → true\nisUpperCase(\"\
    f\");  // → false\n```\n\nNow, I want to mention that this code snippet is controversial\
    \ and may not output correct results for non-letter characters. For example:\n\
    \n```javascript\nthe_shape_shifter/the_shape_shifter_ex2.js\n\nconst isUpperCase\
    \ = x => x < {};\n\nisUpperCase(\"5\");  // → true\n```\n\nIt’s more of a demonstration\
    \ to explore the fascinating quirks of JavaScript’s type coercion system. To accurately\
    \ verify that a string has only uppercase letters, you can use the following function:\n\
    \n```javascript\nthe_shape_shifter/the_shape_shifter_ex3.js\n\nfunction isUpperCase(str)\
    \ {\n  return str === str.toUpperCase() &&\n         str !== str.toLowerCase();\n\
    }\n\nconsole.log(isUpperCase(\"7\"));    // → false\nconsole.log(isUpperCase(\"\
    @\"));    // → false\nconsole.log(isUpperCase(\"F\"));    // → true\n```\n\nThis\
    \ function checks if a given string contains only uppercase letters by comparing\
    \ it to its uppercase and lowercase versions. It returns `false` only if the input\
    \ string contains a non-alphabetic character or a lowercase character.\n\nSo,\
    \ remember, JavaScript's type coercion can be a powerful feature, but it can also\
    \ lead to unexpected behavior if not used carefully. To play it safe, it's usually\
    \ better to stick with explicit methods and functions for string operations.\n\
    \nThis way, your code becomes easier to read, you'll know what to expect, and\
    \ you'll dodge bugs caused by sneaky type conversions. If you choose to use type\
    \ coercion, make sure you fully understand the potential risks.\n\n## Further\
    \ Reading\n\n- [The *toString()* method](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/toString)\n\
    - [The *toUpperCase()* method](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/toUpperCase)\n\
    - [The *toLowerCase()* method](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/toLowerCase)\n\
    \n## Puzzle 23 Alphabet Aerobics\n\nalphabet_aerobics/alphabet_aerobics.js\n\n\
    ```javascript\nfor(i=9,a='';++i<36;)a+=i.toString(36)\nconsole.log(a);\n```\n\n\
    ## Guess the Output\n\n> Try to guess what the output is before moving to the\
    \ next page.\n\nThis code will output:\n\n```\nabcdefghijklmnopqrstuvwxyz\n```\n\
    \n## Discussion\n\nThis JavaScript code is a clever way to create a string containing\
    \ the English alphabet. It generates a string with lowercase letters by converting\
    \ each number from 9 to 35 into a character and adding it to a growing string.\n\
    \nLet’s start with the for loop:\n\n```javascript\nfor(i=9,a='';++i<36;)\n```\n\
    \nThis line sets up a loop that starts at 9 and goes up to 35:\n\n1.  `i=9` sets\
    \ the starting point for the loop.\n2.  `a=\"\"` initializes the variable a as\
    \ an empty string. This variable will be used to store the generated characters."
  mdcn: "\n## 谜题 21 链式大师\n\nthe_chain_master/the_chain_master.js\n\n```javascript\n\
    const titles = null;\nlet x = 0;\n\ntitles?.[++x].toUpperCase();\n\nconsole.log(x);\n\
    ```\n\n## 猜测输出结果\n\n在翻到下一页之前，试着猜猜输出结果是什么。\n\n这段代码会输出：\n\n```\n0\n```\n\n## 讨论\n\
    \n在这个谜题中，我们尝试通过可选链来将 x 加 1，但由于 titles 是 null，所以增量操作不会执行。因此，它将 x 的值（仍然是 0）打印到控制台。\n\
    \n让我们再深入一点。**?.** 被称为可选链运算符。它允许我们在对象不为 null 或 undefined 时访问其属性或调用其方法。由于 titles\
    \ 是 null，**?.** 后面的代码不会执行。\n\n在方括号内，我们有 **++x**。这是前置增量运算符，意味着它在表达式求值之前将 x 的值增加\
    \ 1。然而，由于 `titles` 是 `null`，这一行基本上被跳过了。所以 x 保持为 0，没有发生变化。\n\n可选链运算符（`?.`）被添加到\
    \ ECMAScript 2020 中，以帮助开发者防止在尝试访问不存在的或 nullish 值的属性或调用其方法时可能发生的错误。在引入可选链运算符之前，开发者必须编写更长、更复杂的代码来执行此检查，这通常涉及使用条件语句或三元运算符。\n\
    \n例如：\n\n```javascript\nthe_chain_master/the_chain_master_ex1.js\n\n// 检查 response\
    \ 是否有 data 对象\n// 以及 data 是否有 user 属性\n\nconst response = {\n    //...\n};\n\n\
    // 使用条件语句\nif (response && response.data) {\n    const user = response.data.user;\n\
    }\n\n// 使用三元运算符\nconst user =\n    (response ?\n        (response.data ?\n   \
    \         response.data.user :\n            undefined) :\n        undefined);\n\
    ```\n\n可选链运算符简化了这个过程，允许开发者直接访问对象的属性或调用其方法，而无需担心潜在的 `null` 或 `undefined` 值：\n\n\
    ```javascript\nthe_chain_master/the_chain_master_ex2.js\n\nconst response = {};\n\
    const city = response?.data?.user?.city;\n\nconsole.log(city);    // → undefined\n\
    ```\n\n这段代码尝试获取嵌套在 **response** 内部的属性，但它实际上并不存在。现在，JavaScript 不会报错并抛出错误，而是直接给你一个\
    \ **undefined** 值。这种语法不仅更短，而且更容易阅读。\n\n从技术角度来说，当你使用 **response?.data** 时，它基本上等同于\
    \ **response == null ? undefined : response.data**。那个小小的 **?.** 只是一种方便的快捷方式。另外需要注意的是：你不能在赋值的左侧使用可选链：\n\
    \n```javascript\nthe_chain_master/the_chain_master_ex3.js\n\nconst response =\
    \ {};\n\nresponse?.data = \"abc\";\n// → SyntaxError: Invalid left-hand side in\
    \ assignment\n```\n\n因此，可选链运算符简化了访问对象中嵌套属性和方法的过程。如果任何中间属性是 **null** 或 **undefined**，该运算符会短路求值，防止运行时错误，并使代码更简洁、更可靠，能够优雅地处理缺失或不完整的数据结构。\n\
    \n## 延伸阅读\n\n- [使用 ES2020 可选链运算符进行无错误的属性链式访问](https://blog.logrocket.com/error-free-property-chaining-with-es2020-optional-chaining-operator/)\n\
    - [可选链 (?.) 运算符](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Optional_chaining)\n\
    \n## 谜题 22 变形者\n\n```javascript\nthe_shape_shifter/the_shape_shifter.js\nconst\
    \ a = \"f\"<{};\nconst b = \"F\"<{};\n\nconsole.log(a);\nconsole.log(b);\n```\n\
    \n## 猜测输出结果\n\n在翻到下一页之前，试着猜猜输出结果是什么。\n\n这段代码会输出：\n\n```\nfalse\ntrue\n```\n\n\
    ## 讨论\n\n在 JavaScript 中，当你使用 < 运算符比较值时，它会执行一个称为*类型强制转换*的过程，在比较之前将值转换为共同的类型。\n\n\
    在这段代码中，我们左侧有一个字符串 \"f\"，右侧是一个空对象 {}。JavaScript 施展它的魔法，尝试将这些值转换为共同的类型。在这种情况下，由于涉及字符串\
    \ \"f\"，选择的共同类型是字符串。\n\n当 JavaScript 尝试将空对象 {} 转换为字符串时，它会使用对象的默认 toString() 方法，该方法返回对象的字符串表示形式。在这种情况下，空对象\
    \ {} 被转换为字符串 \"[object Object]\"。所以现在我们要比较的是 \"F\" < \"[object Object]\"。\n\n\
    当你使用 < 运算符比较字符串时，它会执行字典序比较。这意味着 JavaScript 从左到右检查相应字符的字符编码（Unicode 值）。在 Unicode\
    \ 中，\"[\"（左方括号）的字符编码大于 \"F\"（大写字母 F）的字符编码。\n\n因此，\"F\" 被认为小于 \"[object Object]\"\
    ，表达式 \"F\" < \"[object Object]\" 求值为 true。另一方面，字符 \"f\" 的 Unicode 值高于字符 \"[\"\
    ，所以 \"f\" 被认为大于 \"[object Object]\"，比较求值为 false。\n\n你还可以将这种技巧转化为一个可复用的函数：\n\n\
    ```javascript\nthe_shape_shifter/the_shape_shifter_ex1.js\n\nconst isUpperCase\
    \ = x => x < {};\n\nisUpperCase(\"F\");  // → true\nisUpperCase(\"f\");  // →\
    \ false\n```\n\n现在，我想提一下，这段代码片段是有争议的，对于非字母字符可能无法输出正确的结果。例如：\n\n```javascript\n\
    the_shape_shifter/the_shape_shifter_ex2.js\n\nconst isUpperCase = x => x < {};\n\
    \nisUpperCase(\"5\");  // → true\n```\n\n这更多的是一个演示，用来探索 JavaScript 类型强制转换系统的迷人特性。要准确验证一个字符串是否只包含大写字母，你可以使用以下函数：\n\
    \n```javascript\nthe_shape_shifter/the_shape_shifter_ex3.js\n\nfunction isUpperCase(str)\
