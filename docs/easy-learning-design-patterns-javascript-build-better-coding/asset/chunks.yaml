    ## Facade Pattern


    ### Principle


    Facade Pattern : A single class that represents an entire subsystem. Provide a
    unified interface to a set of interfaces in a system. Facade defines a higher-level
    interface that makes the subsystem easier to use.


    1. State provide a consistent interface to perform : Light, music and video.


    ![](Image00044.jpg)


    ### Test


    1. Create a TestFacade.html with Notepad and open it in your browser


    ### Code Example


    ```

    <script type ="text/javascript" >function Light(){this.flash = function (){document.write(
    "Flashing color light<br>" );}}function Music(){this.play = function (){document.write(
    "Playing classical music<br>" );}}function Video (){this.show = function (){document.write(
    "Mountain stream video display<br>" );}}function Facade(){this.light = new Light();this.music
    = new Music();this.video = new Video();this.sing = function (){document.write(
    "Start singing with<br>" );this.light.flash();this.music.play();}this.dance =
    function (){document.write( "Start dancing with<br>" );this.light.flash();this.music.play();this.video.show();}this.act
    = function (){document.write( "Start acting with<br>" );this.light.flash();this.video.show();}}/////////////////////test///////////////////////////////////////////////////////var
    facade = new Facade();facade.sing();document.write( "<br>------------------------------<br>"
    );facade.dance();document.write( "<br>------------------------------<br>" );facade.act();</script>

    ```


