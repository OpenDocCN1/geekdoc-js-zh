    \n2. UML diagram\n\n   ![](Image00014.jpg)\n\n3. Create a `TestCompositionCase.html`\
    \ with Notepad and open it in your browser.\n\n   Result: ![](Image00015.jpg)\
    \ ![](Image00016.jpg)\n\n## Singleton Pattern Principle\n\n**Singleton Pattern**:\
    \ A class of which only a single instance can exist. Ensure a class only has one\
    \ instance, and provide a global point of access to it.\n\n1. UML Diagram\n\n\
    \   ![](Image00017.jpg)\n\n2. Create a `TestSingleton.html` with Notepad and open\
    \ it in your browser.\n\n   ```javascript\n   <script type=\"text/javascript\"\
    >\n   var Singleton = {\n       instance: null,\n       getInstance: function()\
    \ {\n           if (Singleton.instance == null) {\n               // there is\
    \ only one instance\n               Singleton.instance = {};\n           }\n \
    \          return Singleton.instance;\n       }\n   };\n   /////////////////////test/////////////////////////\n\
    \   var singleton1 = Singleton.getInstance();\n   var singleton2 = Singleton.getInstance();\n\
    \   document.write(singleton1 === singleton2);   // true one instance\n   </script>\n\
    \   ```\n\n## Singleton Pattern Case\n\n**Singleton Pattern**: Ensure that there\
    \ is only one instance of a class, sharing global access.\n\n1. Click Login Button\
    \ always show the same dialog box to avoid duplicate creation.\n\n   ![](Image00018.jpg)\n\
    \n   UML Diagram\n\n   ![](Image00019.jpg)\n\n2. Create a `TestSingletonCase.html`\
    \ with Notepad and open it in your browser.\n\n   ```html\n   <style>\n   #login{\n\
    \       width:300px; height: 100px;\n       border:1px solid #cccccc; background-color:\
    \ #fff0f3;\n       text-align:center;\n       padding: 20px;\n   }\n   </style>\n\
    \   <input type=\"button\" value=\"Login\" onclick=\"doLogin()\" />\n   <script\
    \ type=\"text/javascript\">\n   var Dialog = {\n       instance: null,\n     \
    \  showDialog: function() {\n           if (Dialog.instance == null) {\n     \
    \          var dialogDiv = document.createElement(\"div\");\n               dialogDiv.setAttribute(\"\
    id\", \"login\");\n               dialogDiv.innerHTML = \"Username: <input type='text'\
    \ id='username' />\";\n               dialogDiv.innerHTML += \"<br><br>\";\n \
    \              dialogDiv.innerHTML += \"Password: <input type='password' id='password'\
    \ />\";\n               dialogDiv.innerHTML += \"<br><br>\";\n               dialogDiv.innerHTML\
    \ += \"<input type='button' value='Submit' />\";\n               document.body.appendChild(dialogDiv);\n\
    \               Dialog.instance = {};\n           }\n           return Dialog.instance;\n\
    \       }\n   };\n   function doLogin() {\n       Dialog.showDialog(); // Singleton\
    \ instance always create one dialog\n   }\n   </script>\n   ```\n\n   Result:\
