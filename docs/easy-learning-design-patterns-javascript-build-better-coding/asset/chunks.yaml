    ## Decorator Pattern


    ### Principle


    Decorator Pattern : Add responsibilities to objects dynamically. Attach additional
    responsibilities to an object dynamically. Decorators provide a flexible alternative
    to subclassing for extending functionality.


    ![](Image00051.jpg)


    ### Test


    1. Create a TestDecorator.html with Notepad and open it in your browser


    ### Code Example


    ```

    <script type ="text/javascript" >function Person(){this.show = function (){}}function
