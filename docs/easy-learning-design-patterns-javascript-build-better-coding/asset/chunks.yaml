    ## Adapter Pattern


    ### Principle


    Adapter Pattern : Match interfaces of different classes. Convert the interface
    of a class into another interface clients expect. Adapter lets classes work together
    that couldn’t otherwise because of incompatible interfaces.


    1. The original power is 100 voltages, and it needs to be adapted to 36 voltages
    to work.


    ![](Image00039.jpg)


    ### Test


    1. Create a TestAdapter.html with Notepad and open it in your browser


    ### Code Example


    ```

    <script type ="text/javascript" >function Plug(){this.recharge = function (){}}function
    HighVoltagePlug(){Plug.call( this );this.recharge = function (){return 100 ; //
    Power is 100 Voltage}}function AdapterPlug (){Plug.call( this );this.recharge
    = function (){var highPlug = new HighVoltagePlug();var highVoltage = highPlug.recharge();var
    lowVoltage = highVoltage - 64 ;return lowVoltage;}}/////////////////////test///////////////////////////////////////////////////////var
    plug = new HighVoltagePlug();document.write( plug.recharge() + " too much voltage
    <br>" );plug = new AdapterPlug();document.write( "Adapter into " + plug.recharge()
    + " voltage" )</script>

    ```


