    # Chain Pattern Principle


    Chain Pattern : A way of passing a request between a chain of objects. Avoid coupling
    the sender of a request to its receiver by giving more than one object a  chance
    to handle the request. Chain the receiving objects and pass the request along
    the chain until an object handles it.


    1 . Resignation Apply -> Financial Review -> Manager Review -> Approval


    ![](Image00073.jpg)


    1 . Create a `TestChain.html` with Notepad and open it in your browser


    ```

    <script type ="text/javascript" >function Handler(){this.handleRequest = function
    ( request){}}function FrontHandler( nextHandler){Handler.call( this );this.nextHandler
    = nextHandler;this.handleRequest = function ( request){if ( "ResignationApply"
    == request){document.write( "Resignation Apply -> " )if ( this.nextHandler !=
    null ){this.nextHandler.handleRequest( "FinancialReview" );}}}}function FinanceHandler(
    nextHandler){Handler.call( this );this.nextHandler = nextHandler;this.handleRequest
    = function ( request){if ( "FinancialReview" == request){document.write( "Financial
    Review Completed -> " )if ( this.nextHandler != null ){this.nextHandler.handleRequest(
    "ManagerReview" );}}}}function ManagerHandler( nextHandler){Handler.call( this
    );this.nextHandler = nextHandler;this.handleRequest = function ( request){if (
    "ManagerReview" == request){document.write( "Manager Review Completed -> " )if
    ( this.nextHandler != null ){this.nextHandler.handleRequest( "Approval" );}}}}function
    HrHandler( nextHandler){Handler.call( this );this.nextHandler = nextHandler;this.handleRequest
    = function ( request){if ( "Approval" == request){document.write( "HR Approval
    -> " )if ( this.nextHandler != null ){this.nextHandler.handleRequest( "Approval
    Completed" );}}}}var hrHandler = new HrHandler( null );var managerHandler = new
    ManagerHandler( hrHandler);var financeHandler = new FinanceHandler( managerHandler);var
    frontHandler = new FrontHandler( financeHandler);frontHandler.handleRequest( "ResignationApply"
    );</script></body></html>

    ```


