  trans: "\n\n# 设计模式示例\n\n## 迭代器模式案例\n\n使用 JavaScript 的 `forEach` 输出新闻列表。\n\n![1558542526(1)](img/Image00084.jpg)\n\
    ![1558544000(1)](img/Image00085.jpg)\n\n1. 用记事本创建一个 `TestIteratorCase.html` 文件，并在浏览器中打开它\n\
    \n```html\n<style>\n#book_table {\n  border: 1px solid #dddddd;\n  background-color:\
    \ f7fefe;\n  width: 550px;\n  font-size: 16px;\n}\n</style>\n<table id=\"book_table\"\
    >\n  <tr><td> title </td><td> Date </td></tr>\n</table>\n<script type=\"text/javascript\"\
    >\n//for example this data from server\nvar bookArray = new Array(\n  { \"title\"\
    : \"Easy Learning Javascript\", \"date\": \"09/09/2019\" },\n  { \"title\": \"\
    Easy Learning Python 3\", \"date\": \"07/07/2019\" },\n  { \"title\": \"Easy Learning\
    \ Java\", \"date\": \"06/06/2019\" }\n);\nvar book_table = document.getElementById(\"\
    book_table\");\nbookArray.forEach(function(item) {\n  var book_tr = book_table.insertRow();\n\
    \  var title = book_tr.insertCell();\n  var date = book_tr.insertCell();\n  title.innerHTML\
    \ = item.title;\n  date.innerHTML = item.date;\n});\n</script>\n```\n\n结果：![1558544091(1)](img/Image00086.jpg)\n\
    \n## 中介者模式原理\n\n**中介者模式**：定义类之间的简化通信。定义一个对象，该对象封装了一组对象如何交互。中介者通过使对象不显式地相互引用来促进松散耦合，并允许你独立地改变它们的交互。\n\
    \n1. 客户想通过中介联系房东租房\n\n![1556178253(1)](img/Image00087.jpg)\n\n2. UML 图\n\n![](img/Image00088.jpg)\n\
    \n1. 用记事本创建一个 `TestMediator.html` 文件，并在浏览器中打开它\n\n```html\n<script type=\"text/javascript\"\
    >\nfunction HouseOwner() {\n  this.action = function() {}\n}\nfunction HouseRent()\
    \ {\n  HouseOwner.call(this);\n  this.action = function() {\n    document.write(\"\
    Client come to rent a house <br>\");\n  }\n}\nfunction HouseSale() {\n  HouseOwner.call(this);\n\
    \  this.action = function() {\n    document.write(\"Client come to need to sell\
    \ <br>\");\n  }\n}\nfunction Mediator() {\n  this.owner1 = new HouseRent();\n\
    \  this.owner2 = new HouseSale();\n  this.handle = function(content) {\n    if\
    \ (content == \"rent\") {\n      this.owner1.action();\n    }\n    if (content\
    \ == \"sale\") {\n      this.owner2.action();\n    }\n  }\n}\nvar mediator = new\
    \ Mediator();\n// mediator help adjust the renting and selling between the client\
    \ and the houseowner\nmediator.handle(\"rent\");\nmediator.handle(\"sale\");\n\
    </script>\n```\n\n结果：![1558582785(1)](img/Image00089.jpg)\n\n## 中介者模式案例\n\n我们有\
    \ 3 个用户，通过向聊天室（中介者）注册来加入聊天。每个用户由一个 User 对象表示。用户之间发送消息，聊天室负责路由。\n\n![1558586195(1)](img/Image00090.jpg)\n\
    \n2. UML 图\n\n![](img/Image00091.jpg)\n\n1. 用记事本创建一个 `TestMediatorCase.html` 文件，并在浏览器中打开它\n\
    \n结果：![1558586656(1)](img/Image00092.jpg)\n\n## 备忘录模式原理\n\n**备忘录模式**：捕获并恢复对象的内部状态。在不破坏封装的前提下，捕获并外部化对象的内部状态，以便以后可以将对象恢复到此状态。例如文本编辑器的撤销、重做、历史恢复等。\n\
    \nUML 图\n\n![](img/Image00093.jpg)\n\n1. 用记事本创建一个 `TestMemento.html` 文件，并在浏览器中打开它\n\
    \n```html\n<script type=\"text/javascript\">\nfunction Memento(state) {\n  this.state\
    \ = state;\n  this.getState = function() {\n    return this.state;\n  }\n  this.setState\
    \ = function(state) {\n    this.state = state;\n  }\n}\nfunction TextEdit() {\n\
    \  this.mementos = [];\n  this.index = 0;\n  this.push = function(memento) {\n\
    \    this.mementos.push(memento);\n    this.index += 1;\n  }\n  this.forward =\
    \ function() {\n    memento = this.mementos[this.index];\n    this.index += 1;\n\
    \    return memento;\n  }\n  this.back = function() {\n    this.index -= 1;\n\
    \    memento = this.mementos[this.index];\n    return memento;\n  }\n}\nfunction\
    \ Originator() {\n  this.state = '';\n  this.getState = function() {\n    return\
    \ this.state;\n  }\n  this.setState = function(state) {\n    this.state = state;\n\
    \  }\n  this.createMemento = function() {\n    return new Memento(this.state);\n\
    \  }\n  this.setMemento = function(memento) {\n    this.state = memento.getState();\n\
    \  }\n  this.show = function() {\n    document.write(this.state);\n  }\n}\n/////////////////////test///////////////////////////////////////////////////////\n\
    var textEdit = new TextEdit();\n// Enter text in textEdit, save while saving\n\
    var originator = new Originator();\noriginator.setState(\"Move you in the direction\
    \ of your dream. <br>\");\ntextEdit.push(originator.createMemento());\noriginator.setState(\"\
    Ways to start your day positively. <br>\");\ntextEdit.push(originator.createMemento());\n\
    originator.setState(\"Love can change the world. <br>\");\noriginator.show();\n\
    // Undo  redo   Recovery history\noriginator.setMemento(textEdit.back());\noriginator.show();\n\
    originator.setMemento(textEdit.back());\noriginator.show();\ndocument.write(\"\
    <br>------------------------------ <br>\");\noriginator.setMemento(textEdit.forward());\n\
    originator.show();\noriginator.setMemento(textEdit.forward());\noriginator.show();\n\
    </script>\n```\n\n结果：![1558589229(1)](img/Image00094.jpg)\n\n## 备忘录模式案例\n\nHtmlEdit\
    \ 的撤销、重做、历史恢复。\n\n![1558597832(1)](img/Image00095.jpg)\n\nUML 图\n\n![](img/Image00096.jpg)\n\
    \n1. 用记事本创建一个 `TestMementoCase.html` 文件，并在浏览器中打开它\n\n结果：![1558598184(1)](img/Image00097.jpg)\n\
    \n点击撤销按钮\n\n![1558598169(1)](img/Image00098.jpg)\n\n## 观察者模式原理\n\n**观察者模式**：一种向多个类通知变化的方式。定义对象之间的一对多依赖关系，这样当一个对象改变状态时，其所有依赖者都会自动收到通知并更新。\n\
    \n1. 在股票市场中，股票数据随时变化。卖家和买家可以随时看到变化。\n\n![](img/Image00099.jpg)\n\n1. 用记事本创建一个\
    \ `TestObserver.html` 文件，并在浏览器中打开它\n\n```html\n<script type=\"text/javascript\"\
    >\nfunction Observable() {\n  this.observerList = [];\n  this.notifyObservers\
    \ = function() {\n    this.observerList.forEach(function(observer) {\n      observer.update();\n\
    \    });\n  }\n  this.addObserver = function(observer) {\n    this.observerList.push(observer);\n\
    \  }\n}\nfunction StockData(price) {\n  Observable.call(this);\n  this.price =\
    \ price;\n  this.getPrice = function() {\n    return this.price;\n  }\n  this.setPrice\
    \ = function(price) {\n    this.price = price;\n    this.notifyObservers();\n\
    \  }\n}\nfunction Observer(observable) {\n  this.observable = observable;\n  this.observable.addObserver(this);\n\
    \  this.update = function(observable) {}\n}\nfunction Buyer(observable) {\n  Observer.call(this,\
    \ observable);\n  this.update = function(observable) {\n    document.write(\"\
    Buyer Price :\" + this.observable.getPrice() + \"<br>\");\n  }\n}\nfunction Seller(observable)\
    \ {\n  Observer.call(this, observable);\n  this.update = function(observable)\
    \ {\n    document.write(\"Seller Price :\" + this.observable.getPrice() + \"<br>\"\
    );\n  }\n}\n/////////////////////test///////////////////////////////////////////////////////\n\
    var data = new StockData(16.9);\nvar buyer = new Buyer(data);\nvar seller = new\
    \ Seller(data);\ndata.setPrice(18.9);\ndocument.write(\"<br>-------------------------<br>\"\
    );\ndata.setPrice(12.9);\n</script>\n```\n\n结果：\n\n## 观察者模式案例\n\n画布绘制各种形状、直方图和饼图，选择颜色后自动更改填充颜色。\n\
    \n![1558628258(1)](img/Image00101.jpg)\n\n1. UML 图\n\n![](img/Image00102.jpg)\n\
    \n1. 用记事本创建一个 `TestObserverCase.html` 文件，并在浏览器中打开它\n\n结果：![1558628592(1)](img/Image00103.jpg)\
    \ ![1558628630(1)](img/Image00104.jpg)\n\n## 访问者模式原理\n\n**访问者模式**：在不改变类的情况下定义新的操作。表示要对对象结构的元素执行的操作。访问者允许你在不改变所操作元素类的情况下定义新操作。\n\
    \n1. 男人可以成功  \n   女人可以成功  \n   男人恋爱了  \n   女人恋爱了\n\n![](img/Image00105.jpg)\n\n\
    1. 用记事本创建一个 `TestVisitor.html` 文件，并在浏览器中打开它\n\n结果：![1558631243(1)](img/Image00106.jpg)\n\
    \n## 访问者模式案例\n\nJavaScript 的拖放功能类似于访问者模式\n\n![1558664119(1)](img/Image00107.jpg)\n\
    \n1. 用记事本创建一个 `TestVisitorCase.html` 文件，并在浏览器中打开它\n\n"
