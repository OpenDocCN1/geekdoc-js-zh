    ## 适配器模式


    ### 原理


    适配器模式：匹配不同类的接口。将一个类的接口转换成客户期望的另一个接口。适配器使得原本由于接口不兼容而无法一起工作的类能够协同工作。


    1. 原始电源为 100 伏特，需要适配为 36 伏特才能工作。


