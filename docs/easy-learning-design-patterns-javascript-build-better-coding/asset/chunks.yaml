  trans: "\n\n## 组合模式案例\n\n1. 下拉菜单。\n\n   ![](img/Image00013.jpg)\n\n2. UML 图\n\n\
    \   ![](img/Image00014.jpg)\n\n3. 使用记事本创建 `TestCompositionCase.html` 并在浏览器中打开。\n\
    \n   结果：![](img/Image00015.jpg) ![](img/Image00016.jpg)\n\n## 单例模式原理\n\n**单例模式**：一个类只能存在一个实例。确保一个类只有一个实例，并提供一个全局访问点。\n\
    \n1. UML 图\n\n   ![](img/Image00017.jpg)\n\n2. 使用记事本创建 `TestSingleton.html` 并在浏览器中打开。\n\
    \n   ```javascript\n   <script type=\"text/javascript\">\n   var Singleton = {\n\
    \       instance: null,\n       getInstance: function() {\n           if (Singleton.instance\
    \ == null) {\n               // there is only one instance\n               Singleton.instance\
    \ = {};\n           }\n           return Singleton.instance;\n       }\n   };\n\
    \   /////////////////////test/////////////////////////\n   var singleton1 = Singleton.getInstance();\n\
    \   var singleton2 = Singleton.getInstance();\n   document.write(singleton1 ===\
    \ singleton2);   // true one instance\n   </script>\n   ```\n\n## 单例模式案例\n\n**单例模式**：确保一个类只有一个实例，共享全局访问。\n\
    \n1. 点击登录按钮始终显示同一个对话框，避免重复创建。\n\n   ![](img/Image00018.jpg)\n\n   UML 图\n\n  \
    \ ![](img/Image00019.jpg)\n\n2. 使用记事本创建 `TestSingletonCase.html` 并在浏览器中打开。\n\n\
    \   ```html\n   <style>\n   #login{\n       width:300px; height: 100px;\n    \
    \   border:1px solid #cccccc; background-color: #fff0f3;\n       text-align:center;\n\
    \       padding: 20px;\n   }\n   </style>\n   <input type=\"button\" value=\"\
    Login\" onclick=\"doLogin()\" />\n   <script type=\"text/javascript\">\n   var\
    \ Dialog = {\n       instance: null,\n       showDialog: function() {\n      \
    \     if (Dialog.instance == null) {\n               var dialogDiv = document.createElement(\"\
    div\");\n               dialogDiv.setAttribute(\"id\", \"login\");\n         \
    \      dialogDiv.innerHTML = \"Username: <input type='text' id='username' />\"\
    ;\n               dialogDiv.innerHTML += \"<br><br>\";\n               dialogDiv.innerHTML\
    \ += \"Password: <input type='password' id='password' />\";\n               dialogDiv.innerHTML\
    \ += \"<br><br>\";\n               dialogDiv.innerHTML += \"<input type='button'\
    \ value='Submit' />\";\n               document.body.appendChild(dialogDiv);\n\
    \               Dialog.instance = {};\n           }\n           return Dialog.instance;\n\
    \       }\n   };\n   function doLogin() {\n       Dialog.showDialog(); // Singleton\
    \ instance always create one dialog\n   }\n   </script>\n   ```\n\n   结果：![](img/Image00020.jpg)\
    \ 始终点击登录按钮显示同一个对话框 ![](img/Image00021.jpg)\n\n## 模板模式原理\n\n**模板模式**：将算法的具体步骤延迟到子类中实现。定义一个操作中的算法骨架，将一些步骤延迟到子类中。模板方法使得子类可以在不改变算法结构的情况下重新定义算法的某些步骤。\n\
    \n1. 父类打印 A4 纸，子类还可以设置颜色。\n\n   ![](img/Image00022.jpg)\n\n2. 使用记事本创建 `TestTemplate.html`\
    \ 并在浏览器中打开。\n\n   ```javascript\n   <script type=\"text/javascript\">\n   function\
    \ PaperTemplate() {\n       this.parentPrint = function() {\n           document.write(\"\
    Print A4 Paper<br>\");\n       }\n   }\n   function ColorTemplate() {}\n   /////////////////////test///////////////////////////////////////////////////////\n\
    \   ColorTemplate.prototype = new PaperTemplate();\n   ColorTemplate.prototype.colorPrint\
    \ = function() {\n       this.parentPrint();\n       document.write(\"Set the\
    \ color of A4 paper red<br>\");\n   }\n   var template = new ColorTemplate();\n\
    \   template.colorPrint();\n   </script>\n   ```\n\n   结果：![](img/Image00023.jpg)\n\
    \n## 模板模式案例\n\n**飞机游戏**：不同的飞机具有相同的飞机特征，但每架飞机的行为不同。\n\n   ![](img/Image00024.jpg)\n\
    \n1. UML 图\n\n   ![](img/Image00025.jpg)\n\n2. 使用记事本创建 `TestTemplateCase.html`\
    \ 并在浏览器中打开。\n\n   结果：![](img/Image00026.jpg)\n\n## 工厂模式原理\n\n**飞机游戏**：通过工厂创建不同的飞机，然后发射不同的子弹。\n\
    \n   ![](img/Image00027.jpg)\n\n1. UML 图\n\n   ![](img/Image00028.jpg)\n\n2. 使用记事本创建\
    \ `TestFactory.html` 并在浏览器中打开。\n\n   ```html\n   <input type=\"radio\" name=\"\
    fly\" value=1 onclick=\"doCreate(this)\" /> Banshee\n   <input type=\"radio\"\
    \ name=\"fly\" value=2 onclick=\"doCreate(this)\" /> B747fly\n   <input type=\"\
    radio\" name=\"fly\" value=3 onclick=\"doCreate(this)\" /> A380fly\n   <br><br>\n\
    \   <span id=\"result\"></span>\n   <script type=\"text/javascript\">\n   function\
    \ Fly() {\n       this.shoot = function() {}\n   }\n   function Banshee() {\n\
    \       this.shoot = function() {\n           document.getElementById(\"result\"\
    ).innerHTML = \"Banshee fire the laser\";\n       }\n   }\n   Banshee.prototype\
    \ = new Fly();\n   function B747fly() {\n       this.shoot = function() {\n  \
    \         document.getElementById(\"result\").innerHTML = \"B747 fire the missile\"\
    ;\n       }\n   }\n   B747fly.prototype = new Fly();\n   function A380fly() {\n\
    \       this.shoot = function() {\n           document.getElementById(\"result\"\
    ).innerHTML = \"A380 fire the trigeminal shot\";\n       }\n   }\n   A380fly.prototype\
    \ = new Fly();\n   var FlyFactory = {\n       create: function(type) {\n     \
    \      var fly = null;\n           if (type == 1) {\n               fly = new\
    \ Banshee();\n           } else if (type == 2) {\n               fly = new B747fly();\n\
    \           } else if (type == 3) {\n               fly = new A380fly();\n   \
    \        }\n           return fly;\n       }\n   };\n   /////////////////////test///////////////////////////////////////////////////////\n\
    \   function doCreate(obj) {\n       fly = FlyFactory.create(obj.value);\n   \
    \    fly.shoot();\n   }\n   </script>\n   ```\n\n   结果：![](img/Image00029.jpg)\
    \ ![](img/Image00030.jpg)\n\n## 工厂模式案例\n\n**绘制图形**：在画布上绘制不同的图形，如矩形、正方形等。\n\n \
    \  ![](img/Image00031.jpg)\n\n1. UML 图\n\n   ![](img/Image00032.jpg)\n\n2. 使用记事本创建\
    \ `TestFactoryCase.html` 并在浏览器中打开。\n\n   结果：![](img/Image00033.jpg)\n\n## 建造者模式原理\n\
    \n**建造者模式**：将对象的构建与其表示分离。将一个复杂对象的构建与其表示分离，使得同样的构建过程可以创建不同的表示。\n\n1. 汽车分为三个部分：车头、车身、车轮分别构建。\n\
    \n   ![](img/Image00034.jpg)\n\n2. 使用记事本创建 `TestBuilder.html` 并在浏览器中打开。\n\n"
