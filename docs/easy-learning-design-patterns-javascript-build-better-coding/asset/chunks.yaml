    ## Strategy Pattern Principle


    Strategy Pattern : Encapsulates an algorithm inside a class. Define a family of
    algorithms, encapsulate each one, and make them interchangeable. Strategy lets
    the algorithm vary independently from clients that use it.


    ### 1. Calculate Strategy Addition, subtraction, multiplication, division


    ![](Image00003.jpg)


    1. Create a `TestStrategy1.html` with Notepad and open it in your browser


    ```javascript

    <script type ="text/javascript" >function Addition(){this.caculate = function
    ( a, b){return a + b;}}function Subtraction(){this.caculate = function ( a, b){return
    a - b;}}function Multiplication (){this.caculate = function ( a, b){return a *
    b;}}function Division(){this.caculate = function ( a, b){return a / b;}}function
    Context( strategy){this.strategy = strategy;this.caculate = function ( a, b){return
    this.strategy.caculate( a, b);}}var context = new Context( new Addition());var
    result = context.caculate( 4 , 2 );document.write( result + "<br>" );var context
    = new Context( new Subtraction());var result = context.caculate( 4 , 2 );document.write(
    result + "<br>" );var context = new Context( new Multiplication());var result
    = context.caculate( 4 , 2 );document.write( result + "<br>" );var context = new
    Context( new Division());var result = context.caculate( 4 , 2 );document.write(
    result + "<br>" );</script>

    ```


    Result:


    ![](Image00004.jpg)


    2. Anther way create a `TestStrategy2.html` with Notepad and open it in your browser


    ```javascript

    <script type ="text/javascript" >var strategy = {"Addition" : function ( a, b){return
    a + b;},"Subtraction" : function ( a, b){return a - b;},"Multiplication" : function
    ( a, b){return a * b;},"Division" : function ( a, b){return a / b;}};var context
    = function ( key, a, b ){return strategy[ key]( a, b);};var result = context(
    "Addition" , 4 , 2 );document.write( result + "<br>" );var result = context( "Subtraction"
    , 4 , 2 );document.write( result + "<br>" );var result = context( "Multiplication"
    , 4 , 2 );document.write( result + "<br>" );var result = context( "Division" ,
    4 , 2 );document.write( result + "<br>" );</script>

    ```


