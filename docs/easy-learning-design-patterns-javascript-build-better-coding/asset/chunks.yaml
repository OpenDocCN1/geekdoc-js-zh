    ## Proxy Pattern Principle


    Proxy Pattern : An object representing another object. Provide a surrogate or
    placeholder for another object to control access to it.


    1. Agency registration


    ![](Image00115.jpg)


    1. Create a `TestProxy.html` with Notepad and open it in your browser


    | <script type ="text/javascript" >var Target = {doSomething: function () {document.write(
    "Agency registration company" );}}function Proxy(){this.call = function ( target,
    method){document.write( "<br> before <br>" );result = target[ method]();document.write(
    "<br> after  <br>" );return result;}}var proxy = new Proxy();proxy.call( Target,
    "doSomething" );</script> |


    Result:![1558671982(1)](Image00116.jpg)


    ### Proxy Pattern Case


    When loading a large image, preload the default small icon through the proxy,
    waiting for the big image to be loaded, immediately display the large image.


    ![1558674545(1)](Image00117.jpg)


    UML Diagram


    ![](Image00118.jpg)


    1. Create a `TestProxyCase.html` with Notepad and open it in your browser


    | <div id ="image" ></div><script type ="text/javascript" >var Target = {loadImage:
    function ( loadimg, imageSrc) {var img = document.createElement( ''img'' );img.src
    = imageSrc;img.onload = function (){//Once the image is loaded, it will be displayed
    immediatelyloadimg.src = img.src;}}}function Proxy(){this.call = function ( target,
    method, imageSrc){//preload imagevar img = document.createElement( ''img'' );img.src
    = "images/loading.gif" ;document.getElementById( "image" ). appendChild( img);result
    = target[ method]( img, imageSrc);return result;}}var proxy = new Proxy();proxy.call(
    Target, "loadImage" , "images/javascript.jpg" );</script> |


