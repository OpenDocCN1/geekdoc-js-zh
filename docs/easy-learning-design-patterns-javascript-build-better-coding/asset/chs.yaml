  ## 责任链模式原理\n\n责任链模式：一种在对象链之间传递请求的方式。通过给多个对象处理请求的机会，避免请求发送者与接收者之间的耦合。将接收对象链接起来，并沿着链传递请求，直到某个对象处理它。\n\
  \n1. 离职申请 -> 财务审核 -> 经理审核 -> 批准\n\n![](img/Image00073.jpg)\n\n1. 用记事本创建一个 `TestChain.html`\
  \ 并在浏览器中打开\n\n```\n<script type =\"text/javascript\" >function Handler(){this.handleRequest\
  \ = function ( request){}}function FrontHandler( nextHandler){Handler.call( this\
  \ );this.nextHandler = nextHandler;this.handleRequest = function ( request){if (\
  \ \"ResignationApply\" == request){document.write( \"Resignation Apply -> \" )if\
  \ ( this.nextHandler != null ){this.nextHandler.handleRequest( \"FinancialReview\"\
  \ );}}}}function FinanceHandler( nextHandler){Handler.call( this );this.nextHandler\
  \ = nextHandler;this.handleRequest = function ( request){if ( \"FinancialReview\"\
  \ == request){document.write( \"Financial Review Completed -> \" )if ( this.nextHandler\
  \ != null ){this.nextHandler.handleRequest( \"ManagerReview\" );}}}}function ManagerHandler(\
  \ nextHandler){Handler.call( this );this.nextHandler = nextHandler;this.handleRequest\
  \ = function ( request){if ( \"ManagerReview\" == request){document.write( \"Manager\
  \ Review Completed -> \" )if ( this.nextHandler != null ){this.nextHandler.handleRequest(\
  \ \"Approval\" );}}}}function HrHandler( nextHandler){Handler.call( this );this.nextHandler\
  \ = nextHandler;this.handleRequest = function ( request){if ( \"Approval\" == request){document.write(\
  \ \"HR Approval -> \" )if ( this.nextHandler != null ){this.nextHandler.handleRequest(\
  \ \"Approval Completed\" );}}}}var hrHandler = new HrHandler( null );var managerHandler\
  \ = new ManagerHandler( hrHandler);var financeHandler = new FinanceHandler( managerHandler);var\
  \ frontHandler = new FrontHandler( financeHandler);frontHandler.handleRequest( \"\
  ResignationApply\" );</script></body></html>\n```\n\n结果：![](img/Image00074.jpg)\n\
