  \ `TestTemplateCase.html` 并在浏览器中打开。\n\n   结果：![](img/Image00026.jpg)\n\n## 工厂模式原理\n\
  \n**飞机游戏**：通过工厂创建不同的飞机，然后发射不同的子弹。\n\n   ![](img/Image00027.jpg)\n\n1. UML 图\n\n\
  \   ![](img/Image00028.jpg)\n\n2. 使用记事本创建 `TestFactory.html` 并在浏览器中打开。\n\n   ```html\n\
  \   <input type=\"radio\" name=\"fly\" value=1 onclick=\"doCreate(this)\" /> Banshee\n\
  \   <input type=\"radio\" name=\"fly\" value=2 onclick=\"doCreate(this)\" /> B747fly\n\
  \   <input type=\"radio\" name=\"fly\" value=3 onclick=\"doCreate(this)\" /> A380fly\n\
  \   <br><br>\n   <span id=\"result\"></span>\n   <script type=\"text/javascript\"\
  >\n   function Fly() {\n       this.shoot = function() {}\n   }\n   function Banshee()\
  \ {\n       this.shoot = function() {\n           document.getElementById(\"result\"\
  ).innerHTML = \"Banshee fire the laser\";\n       }\n   }\n   Banshee.prototype\
  \ = new Fly();\n   function B747fly() {\n       this.shoot = function() {\n    \
  \       document.getElementById(\"result\").innerHTML = \"B747 fire the missile\"\
  ;\n       }\n   }\n   B747fly.prototype = new Fly();\n   function A380fly() {\n\
  \       this.shoot = function() {\n           document.getElementById(\"result\"\
  ).innerHTML = \"A380 fire the trigeminal shot\";\n       }\n   }\n   A380fly.prototype\
  \ = new Fly();\n   var FlyFactory = {\n       create: function(type) {\n       \
  \    var fly = null;\n           if (type == 1) {\n               fly = new Banshee();\n\
  \           } else if (type == 2) {\n               fly = new B747fly();\n     \
  \      } else if (type == 3) {\n               fly = new A380fly();\n          \
  \ }\n           return fly;\n       }\n   };\n   /////////////////////test///////////////////////////////////////////////////////\n\
  \   function doCreate(obj) {\n       fly = FlyFactory.create(obj.value);\n     \
  \  fly.shoot();\n   }\n   </script>\n   ```\n\n   结果：![](img/Image00029.jpg) ![](img/Image00030.jpg)\n\
  \n## 工厂模式案例\n\n**绘制图形**：在画布上绘制不同的图形，如矩形、正方形等。\n\n   ![](img/Image00031.jpg)\n\n\
