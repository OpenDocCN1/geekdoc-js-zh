- "# 轻松学习 JavaScript 设计模式：更好的编码与设计模式构建指南\n\n简单是智慧的开始。本书简要阐述概念，生动培养编程兴趣，深入分析 JavaScript\
  \ 设计模式，让您轻松、快速且扎实地掌握。\n\n[`en.verejava.com`](http://en.verejava.com)\n\n## 策略模式原理\n\
  \n策略模式：将算法封装在类中。定义一系列算法，将每个算法封装起来，并使它们可以互换。策略模式让算法独立于使用它的客户端而变化。\n\n### 1. 计算策略：加、减、乘、除\n\
  \n![](img/Image00003.jpg)\n\n1. 使用记事本创建 `TestStrategy1.html`，并在浏览器中打开\n\n```javascript\n\
  <script type =\"text/javascript\" >function Addition(){this.caculate = function\
  \ ( a, b){return a + b;}}function Subtraction(){this.caculate = function ( a, b){return\
  \ a - b;}}function Multiplication (){this.caculate = function ( a, b){return a *\
  \ b;}}function Division(){this.caculate = function ( a, b){return a / b;}}function\
  \ Context( strategy){this.strategy = strategy;this.caculate = function ( a, b){return\
  \ this.strategy.caculate( a, b);}}var context = new Context( new Addition());var\
  \ result = context.caculate( 4 , 2 );document.write( result + \"<br>\" );var context\
  \ = new Context( new Subtraction());var result = context.caculate( 4 , 2 );document.write(\
  \ result + \"<br>\" );var context = new Context( new Multiplication());var result\
  \ = context.caculate( 4 , 2 );document.write( result + \"<br>\" );var context =\
  \ new Context( new Division());var result = context.caculate( 4 , 2 );document.write(\
  \ result + \"<br>\" );</script>\n```\n\n结果：\n\n![](img/Image00004.jpg)\n\n2. 另一种方式：使用记事本创建\
  \ `TestStrategy2.html`，并在浏览器中打开\n\n```javascript\n<script type =\"text/javascript\"\
  \ >var strategy = {\"Addition\" : function ( a, b){return a + b;},\"Subtraction\"\
  \ : function ( a, b){return a - b;},\"Multiplication\" : function ( a, b){return\
  \ a * b;},\"Division\" : function ( a, b){return a / b;}};var context = function\
  \ ( key, a, b ){return strategy key;};var result = context( \"Addition\" , 4 , 2\
  \ );document.write( result + \"<br>\" );var result = context( \"Subtraction\" ,\
  \ 4 , 2 );document.write( result + \"<br>\" );var result = context( \"Multiplication\"\
  \ , 4 , 2 );document.write( result + \"<br>\" );var result = context( \"Division\"\
  \ , 4 , 2 );document.write( result + \"<br>\" );</script>\n```\n\n## 策略模式案例\n\n\
