  ## 装饰器模式\n\n### 原理\n\n装饰器模式：动态地向对象添加职责。动态地给对象附加额外的职责。装饰器为扩展功能提供了一种比子类化更灵活的替代方案。\n\
  \n![](img/Image00051.jpg)\n\n### 测试\n\n1. 使用记事本创建一个 TestDecorator.html 文件，并在浏览器中打开\n\
  \n### 代码示例\n\n```\n<script type =\"text/javascript\" >function Person(){this.show\
  \ = function (){}}function Man(){this.show = function (){document.write( \"I am\
  \ a man <br>\" );}}Man.prototyoe = new Person();function Decorator( person){this.person\
  \ = person;}function ManagerDecorator( person){Decorator.call( this , person);this.show\
  \ = function (){this.person.show();document.write( \"I am still a manager <br>\"\
  \ );}}function ActorDecorator( person){Decorator.call( this , person);this.show\
  \ = function (){this.person.show();document.write( \"I am still an international\
  \ actor. <br>\" );}}/////////////////////test///////////////////////////////////////////////////////var\
  \ person = new Man();person.show();document.write( \" <br>------------------------------------\
  \ <br>\" )person = new ManagerDecorator( person);person.show();document.write( \"\
  \ <br>------------------------------------ <br>\" )person = new ActorDecorator(\
  \ person);person.show();</script>\n```\n\n### 结果\n\n![1558111489(1)](img/Image00052.jpg)\n\
