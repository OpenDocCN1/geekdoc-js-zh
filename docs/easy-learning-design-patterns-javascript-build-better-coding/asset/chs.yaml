  \ ( name){\n        this.name = name;\n    }\n}\nvar Cache = {\n    map : {},\n\
  \    get: function ( key ){\n        return Cache.map[ key];\n    },\n    put: function\
  \ ( key, value){\n        Cache.map[ key] = value;\n    }\n};\n/////////////////////test/////////////////////////////////////////////////////////\n\
  // Basic data types are stored in the cache\nCache.put( \"1\" , 1000 );\n// String\
  \ are stored in the cache\nCache.put( \"name\" , \"Grace\" );\n// Object are stored\
