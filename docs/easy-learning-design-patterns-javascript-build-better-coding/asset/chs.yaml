  \n## 备忘录模式原理\n\n**备忘录模式**：捕获并恢复对象的内部状态。在不破坏封装的前提下，捕获并外部化对象的内部状态，以便以后可以将对象恢复到此状态。例如文本编辑器的撤销、重做、历史恢复等。\n\
  \nUML 图\n\n![](img/Image00093.jpg)\n\n1. 用记事本创建一个 `TestMemento.html` 文件，并在浏览器中打开它\n\
  \n```html\n<script type=\"text/javascript\">\nfunction Memento(state) {\n  this.state\
  \ = state;\n  this.getState = function() {\n    return this.state;\n  }\n  this.setState\
  \ = function(state) {\n    this.state = state;\n  }\n}\nfunction TextEdit() {\n\
  \  this.mementos = [];\n  this.index = 0;\n  this.push = function(memento) {\n \
  \   this.mementos.push(memento);\n    this.index += 1;\n  }\n  this.forward = function()\
  \ {\n    memento = this.mementos[this.index];\n    this.index += 1;\n    return\
  \ memento;\n  }\n  this.back = function() {\n    this.index -= 1;\n    memento =\
  \ this.mementos[this.index];\n    return memento;\n  }\n}\nfunction Originator()\
  \ {\n  this.state = '';\n  this.getState = function() {\n    return this.state;\n\
  \  }\n  this.setState = function(state) {\n    this.state = state;\n  }\n  this.createMemento\
  \ = function() {\n    return new Memento(this.state);\n  }\n  this.setMemento =\
  \ function(memento) {\n    this.state = memento.getState();\n  }\n  this.show =\
  \ function() {\n    document.write(this.state);\n  }\n}\n/////////////////////test///////////////////////////////////////////////////////\n\
  var textEdit = new TextEdit();\n// Enter text in textEdit, save while saving\nvar\
  \ originator = new Originator();\noriginator.setState(\"Move you in the direction\
  \ of your dream. <br>\");\ntextEdit.push(originator.createMemento());\noriginator.setState(\"\
  Ways to start your day positively. <br>\");\ntextEdit.push(originator.createMemento());\n\
  originator.setState(\"Love can change the world. <br>\");\noriginator.show();\n\
  // Undo  redo   Recovery history\noriginator.setMemento(textEdit.back());\noriginator.show();\n\
  originator.setMemento(textEdit.back());\noriginator.show();\ndocument.write(\"<br>------------------------------\
  \ <br>\");\noriginator.setMemento(textEdit.forward());\noriginator.show();\noriginator.setMemento(textEdit.forward());\n\
  originator.show();\n</script>\n```\n\n结果：![1558589229(1)](img/Image00094.jpg)\n\n\
