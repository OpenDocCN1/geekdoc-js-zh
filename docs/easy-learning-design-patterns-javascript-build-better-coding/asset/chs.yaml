  \n## 组合模式原理\n\n组合模式：简单对象和复合对象的树形结构。将对象组合成树形结构以表示“部分-整体”的层次结构。组合模式使得客户端对单个对象和组合对象的使用具有一致性。\n\
  \n### 1. 国家城市树形图\n\n![](img/Image00010.jpg)\n\n### 2. UML 图\n\n![](img/Image00011.jpg)\n\
