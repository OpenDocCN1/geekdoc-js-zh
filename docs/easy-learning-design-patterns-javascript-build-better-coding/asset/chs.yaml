  \n   结果：![](img/Image00033.jpg)\n\n## 建造者模式原理\n\n**建造者模式**：将对象的构建与其表示分离。将一个复杂对象的构建与其表示分离，使得同样的构建过程可以创建不同的表示。\n\
  \n1. 汽车分为三个部分：车头、车身、车轮分别构建。\n\n   ![](img/Image00034.jpg)\n\n2. 使用记事本创建 `TestBuilder.html`\
  \ 并在浏览器中打开。\n\n\n\n\n\n## 建造者模式\n\n### 代码示例\n\n```\n<script type =\"text/javascript\"\
  \ >function Car(){this.head = \"\" ;this.body = \"\" ;this.wheel = \"\" ;this.getHead\
  \ = function (){return this.head;}this.setHead = function ( head){this.head = head;}this.getBody\
  \ = function (){return this.body;}this.setBody = function ( body){this.body = body;}this.getWheel\
  \ = function (){return this.wheel;}this.setWheel = function ( wheel){this.wheel\
  \ = wheel;}}function Builder(){this.buildHead = function (){}this.buildBody = function\
  \ (){}this.buildWheel = function (){}this.buildPart = function (){}}function ConcreteBuilder\
  \ (){this.car = new Car();this.buildHead = function (){this.car.setHead( \"Car head\
  \ construction completed\" );}this.buildBody = function (){this.car.setBody( \"\
  Car body construction completed\" );}this.buildWheel = function (){this.car.setWheel(\
  \ \"Car Wheel construction completed\" );}this.buildPart = function (){return this.car;}}var\
  \ Director = {construct: function ( builder){builder.buildHead();builder.buildBody();builder.buildWheel();return\
  \ builder.buildPart();}};/////////////////////test///////////////////////////////////////////////////////var\
  \ car = Director.construct( new ConcreteBuilder());document.write( car.getHead()\
  \ + \"<br>\" );document.write( car.getBody() + \"<br>\" );document.write( car.getWheel()\
  \ + \"<br>\" );</script>\n```\n\n### 结果\n\n![1558060552(1)](img/Image00035.jpg)\n\
  \n### 案例\n\n建造者模式案例弹出对话框：首先内部创建提示、消息和按钮，最后构建对话框使其弹出。\n\n![1558065220(1)](img/Image00036.jpg)\n\
  \n### UML 图\n\n![](img/Image00037.jpg)\n\n### 测试\n\n1. 使用记事本创建一个 TestBuilderCase.html\
  \ 文件，并在浏览器中打开\n\n结果：![1558066242(1)](img/Image00038.jpg)\n\n## 适配器模式\n\n### 原理\n\
  \n适配器模式：匹配不同类的接口。将一个类的接口转换成客户期望的另一个接口。适配器使得原本由于接口不兼容而无法一起工作的类能够协同工作。\n\n1. 原始电源为\
  \ 100 伏特，需要适配为 36 伏特才能工作。\n\n![](img/Image00039.jpg)\n\n### 测试\n\n1. 使用记事本创建一个 TestAdapter.html\
  \ 文件，并在浏览器中打开\n\n### 代码示例\n\n```\n<script type =\"text/javascript\" >function Plug(){this.recharge\
  \ = function (){}}function HighVoltagePlug(){Plug.call( this );this.recharge = function\
  \ (){return 100 ; // Power is 100 Voltage}}function AdapterPlug (){Plug.call( this\
  \ );this.recharge = function (){var highPlug = new HighVoltagePlug();var highVoltage\
  \ = highPlug.recharge();var lowVoltage = highVoltage - 64 ;return lowVoltage;}}/////////////////////test///////////////////////////////////////////////////////var\
  \ plug = new HighVoltagePlug();document.write( plug.recharge() + \" too much voltage\
  \ <br>\" );plug = new AdapterPlug();document.write( \"Adapter into \" + plug.recharge()\
  \ + \" voltage\" )</script>\n```\n\n### 结果\n\n![1558068178(1)](img/Image00040.jpg)\n\
  \n### 案例\n\n适配器模式案例弹出列表菜单和图片列表菜单：数据填充，相同的数据，不同的适配显示不同的视图\n\n![](img/Image00041.jpg)\n\
  \n### UML 图\n\n![](img/Image00042.jpg)\n\n### 测试\n\n1. 使用记事本创建一个 TestAdapterCase.html\
  \ 文件，并在浏览器中打开\n\n结果：![1558072556(1)](img/Image00043.jpg)\n\n## 外观模式\n\n### 原理\n\n\
  外观模式：一个代表整个子系统的单一类。为系统中的一组接口提供统一的接口。外观定义了一个更高级别的接口，使得子系统更易于使用。\n\n1. 状态提供一致的接口来执行：灯光、音乐和视频。\n\
  \n![](img/Image00044.jpg)\n\n### 测试\n\n1. 使用记事本创建一个 TestFacade.html 文件，并在浏览器中打开\n\
  \n### 代码示例\n\n```\n<script type =\"text/javascript\" >function Light(){this.flash\
  \ = function (){document.write( \"Flashing color light<br>\" );}}function Music(){this.play\
  \ = function (){document.write( \"Playing classical music<br>\" );}}function Video\
  \ (){this.show = function (){document.write( \"Mountain stream video display<br>\"\
  \ );}}function Facade(){this.light = new Light();this.music = new Music();this.video\
  \ = new Video();this.sing = function (){document.write( \"Start singing with<br>\"\
  \ );this.light.flash();this.music.play();}this.dance = function (){document.write(\
  \ \"Start dancing with<br>\" );this.light.flash();this.music.play();this.video.show();}this.act\
  \ = function (){document.write( \"Start acting with<br>\" );this.light.flash();this.video.show();}}/////////////////////test///////////////////////////////////////////////////////var\
  \ facade = new Facade();facade.sing();document.write( \"<br>------------------------------<br>\"\
  \ );facade.dance();document.write( \"<br>------------------------------<br>\" );facade.act();</script>\n\
  ```\n\n### 结果\n\n![1558084663(1)](img/Image00045.jpg)\n\n### 案例\n\n外观模式案例\n\n1.\
