  \ 文件，并在浏览器中打开\n\n结果：![1558149161(1)](img/Image00055.jpg)\n\n## 浅克隆模式\n\n### 原理\n\
  \n浅克隆只复制基本数据类型\n\n![1558247710(1)](img/Image00056.jpg)\n\n### 测试\n\n1. 使用记事本创建一个\
  \ TestShallowClone.html 文件，并在浏览器中打开\n\n结果：![1558247782(1)](img/Image00057.jpg)\n\
  \nshallowClonePerson 和 person 实例指向不同的 name、age，但指向相同的 hobby、cat 引用\n\n## 深克隆模式\n\
  \n### 原理\n\n深克隆模式：可以复制基本数据类型和引用对象。\n\n![1558248040(1)](img/Image00058.jpg)\n\n###\
  \ 测试\n\n1. 使用记事本创建一个 TestDeepClone.html 文件，并在浏览器中打开\n\n\n\n\n\n## 克隆模式\n\n### 克隆模式案例\n\
  \n```javascript\n<script type =\"text/javascript\" >\nfunction Cat( name){\n   \
  \ this.name = name;\n    this.getName = function (){\n        return this.name;\n\
  \    }\n    this.setName = function ( name){\n        this.name = name;\n    }\n\
  }\nfunction Person( name, age, hobby, cat ){\n    this.name = name;\n    this.age\
  \ = age;\n    this.hobby = hobby;\n    this.cat = cat;\n    this.getName = function\
  \ (){\n        return this.name;\n    }\n    this.setName = function ( name){\n\
  \        this.name = name;\n    }\n    this.getAge = function (){\n        return\
  \ this.age;\n    }\n    this.setAge = function ( age){\n        this.age = age;\n\
  \    }\n    this.getHobby = function (){\n        return this.hobby;\n    }\n  \
  \  this.setHobby = function ( hobby){\n        this.hobby = hobby;\n    }\n    this.getCat\
  \ = function (){\n        return this.cat;\n    }\n    this.setCat = function (\
  \ cat){\n        this.cat = cat;\n    }\n}\n//deep clone\nfunction deepClone( obj,\
  \ newObj){\n    var newObj = newObj||{};\n    for ( var i in obj){\n        if (\
  \ typeof obj[ i]=== 'object' ){\n            newObj[ i] = ( obj[ i]. constructor\
  \ === Array) ? [] : {};\n            deepClone( obj[ i], newObj[ i]);\n        }\
  \ else {\n            newObj[ i] = obj[ i];\n        }\n    }\n    return newObj;\n\
  }\n/////////////////////test///////////////////////////////////////////////////////\n\
