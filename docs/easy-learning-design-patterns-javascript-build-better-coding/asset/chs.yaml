  \ ul 列表拖拽到 div 框中![1558664324(1)](img/Image00109.jpg)\n\n## 状态模式原理\n\n状态模式：当对象的状态改变时，改变其行为。允许对象在内部状态改变时改变其行为。该对象看起来像是改变了它的类。\n\
  \n![](img/Image00110.jpg)\n\n1. 使用记事本创建一个 `TestState.html` 文件，并在浏览器中打开它\n\n| <script\
  \ type =\"text/javascript\" >function Flow(){this.action = function (){}}function\
  \ ApplyFlow(){Flow.call( this );this.action = function (){document.write( \"Apply\
  \ -> \" );}}function VerfiyFlow(){Flow.call( this );this.action = function (){document.write(\
  \ \"Verfiy -> \" );}}function ApproveFlow(){Flow.call( this );this.action = function\
  \ (){document.write( \"Approve\" );}}function Context(){this.flow = null ;this.setFlow\
  \ = function ( flow){this.flow = flow;}this.process = function (){this.flow.action();}}/////////////////////test///////////////////////////////////////////////////////var\
  \ context  = new Context();context.setFlow( new ApplyFlow());context.process();context.setFlow(\
  \ new VerfiyFlow());context.process();context.setFlow( new ApproveFlow());context.process();</script>\
  \ |\n\n结果：![1558665200(1)](img/Image00111.jpg)\n\n### 状态模式案例\n\n新闻发布管理有 3 种状态：查看、编辑、审核。每个状态下只显示对应的操作按钮。\n\
  \n![1558667113(1)](img/Image00112.jpg)\n\nUML 图\n\n![](img/Image00113.jpg)\n\n1.\
  \ 使用记事本创建一个 `TestState.html` 文件，并在浏览器中打开它\n\n| <style>#news_table{border:1px solid\
  \ #dddddd;background-color:#eeeeee;width:550px;font-size:16px;}#title_tool{background-color:#dddddd;}</style><table\
  \ id =\"news_table\" ><tr id =\"title_tool\" ><td> title </td><td> Date </td><td>\
  \ State </td><td> Action </td></tr></table><script type =\"text/javascript\" >function\
  \ Flow(){this.action = function (){}}function ViewFlow(){Flow.call( this );this.action\
  \ = function (){return \"\" ;}}function EditFlow (){Flow.call( this );this.action\
  \ = function (){return \"<input type='button' value='Update' />\" ;}}function VerifyFlow(){Flow.call(\
  \ this );this.action = function (){return \"<input type='button' value='Update'\
  \ /> <input type='button' value='Delete' />\" ;}}function Context(){this.flow =\
  \ null ;this.setFlow = function ( flow){this.flow = flow;}this.process = function\
  \ (){return this.flow.action();}}var newsArray = new Array ({ \"title\" : \"Happy\
  \ Labor Day\" , \"date\" : \"05/01/2019\" , \"state\" : \"view\" },{ \"title\" :\
  \ \"New book has been released\" , \"date\" : \"07/07/2019\" , \"state\" : \"edit\"\
  \ },{ \"title\" : \"Merry Christmas\" , \"date\" : \"12/25/2019\" , \"state\" :\
  \ \"verify\" })newsArray.forEach( function ( item) {var news_tr = news_table.insertRow();var\
  \ title = news_tr.insertCell();var date = news_tr.insertCell();var state = news_tr.insertCell();var\
  \ action = news_tr.insertCell();title.innerHTML = item.title;date.innerHTML = item.date;state.innerHTML\
  \ = item.state;var context = new Context();if ( item.state == \"view\" ){context.setFlow(\
  \ new ViewFlow());} else if ( item.state == \"edit\" ){context.setFlow( new EditFlow());}\
  \ else if ( item.state == \"verify\" ){context.setFlow( new VerifyFlow());}action.innerHTML\
  \ = context.process();});</script> |\n\n结果：![1558667238(1)](img/Image00114.jpg)\n\
  \n## 代理模式原理\n\n代理模式：一个代表另一个对象的对象。为另一个对象提供一个代理或占位符，以控制对其的访问。\n\n1. 代理注册\n\n![](img/Image00115.jpg)\n\
  \n1. 使用记事本创建一个 `TestProxy.html` 文件，并在浏览器中打开它\n\n| <script type =\"text/javascript\"\
  \ >var Target = {doSomething: function () {document.write( \"Agency registration\
  \ company\" );}}function Proxy(){this.call = function ( target, method){document.write(\
  \ \"<br> before <br>\" );result = target[ method]();document.write( \"<br> after\
  \  <br>\" );return result;}}var proxy = new Proxy();proxy.call( Target, \"doSomething\"\
  \ );</script> |\n\n结果：![1558671982(1)](img/Image00116.jpg)\n\n### 代理模式案例\n\n当加载大图时，通过代理预加载默认的小图标，等待大图加载完成后立即显示大图。\n\
  \n![1558674545(1)](img/Image00117.jpg)\n\nUML 图\n\n![](img/Image00118.jpg)\n\n1.\
  \ 使用记事本创建一个 `TestProxyCase.html` 文件，并在浏览器中打开它\n\n| <div id =\"image\" ></div><script\
  \ type =\"text/javascript\" >var Target = {loadImage: function ( loadimg, imageSrc)\
  \ {var img = document.createElement( 'img' );img.src = imageSrc;img.onload = function\
  \ (){//Once the image is loaded, it will be displayed immediatelyloadimg.src = img.src;}}}function\
  \ Proxy(){this.call = function ( target, method, imageSrc){//preload imagevar img\
  \ = document.createElement( 'img' );img.src = \"images/loading.gif\" ;document.getElementById(\
  \ \"image\" ). appendChild( img);result = target method;return result;}}var proxy\
  \ = new Proxy();proxy.call( Target, \"loadImage\" , \"images/javascript.jpg\" );</script>\
