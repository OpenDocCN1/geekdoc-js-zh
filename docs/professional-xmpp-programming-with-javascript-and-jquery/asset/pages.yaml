  md: "The example iq-stanza shows a fully constructed error response to a publish-subscribe\
    \ related iq:\n\n```\n<iq from='pubsub.pemberley.lit'\nto='elizabeth@longbourn.lit/sitting_room'\n\
    type='error'\n id='elabeth-bel'>\n <pubsub xmlns='http://jabber.org/protocol/pubsub'>\n\
    \ <subscribe node='latest_books'\n    jid='elizabeth@longbourn.lit'/>\n </pubsub>\n\
    \ </iq>\n <error type='cancel'>\n  <not-allowed xmlns='urn:iet:params:xml:xmpp-stanzas'>\n\
    \  <closed-node xmlns='http://jabber.org/protocol/pubsub#errors'/>\n  <text xmlns='urn:iet:params:xml:xmpp-stanzas'>\n\
    You must be on the whitelist to subscribe to this node.\n </text>\n  </not-allowed>\n\
    \ </error>\n```\n\nThe error's type is cancel, indicating that this action should\
    \ not be retried and the condition <not-allowed> indicates the general failure.\
    \ The <text> child contains a description of the problem. Finally, the connection\
    \ element, <closed-node/>, gives the exact application error.\n\n# THE CONNECTION\
    \ LIFE CYCLE\n\nThe three stanzas you've learned about can accomplish virtually\
    \ any task in XMPP when combined properly. However, sending usually requires an\
    \ authenticated XMPP stream be established. This section describes the other portions\
    \ of an XMPP connection's life cycle — connection, stream set up, authentication,\
    \ and disconnection.\n\n# Connection\n\nBefore any stanzas are sent, an XMPP stream\
    \ is necessary. Before an XMPP stream can exist, a connection must be made to\
    \ an XMPP server. XMPP includes some sophisticated support for establishing connections\
    \ to the right servers.\n\nTypically clients and servers utilize the domain name\
    \ service (DNS) to resolve a domain name to an address they connect to. E-mail\
    \ servers in particular use mail exchange (MX) records to provide a list of servers\
    \ that handle mail for a given domain so that one well-known server does not have\
    \ to handle every service. Every email, being an early Internet application, gets\
    \ special treatment in DNS. These days, service records (SRV) are used to provide\
    \ a similar function for arbitrary services.\n\nThe first thing an XMPP client\
    \ or server does when connecting to another XMPP server is to query the appropriate\
    \ SRV record at the server’s domain. The response may involve multiple SRV records,\
    \ which can be used to load balance connections across multiple servers.\n\nIf\
    \ an appropriate SRV record cannot be found, the application tries to connect\
    \ to the given domain directly as a fallback. Most libraries also allow you to\
    \ specify a server to connect to explicitly."
  merge: -1
