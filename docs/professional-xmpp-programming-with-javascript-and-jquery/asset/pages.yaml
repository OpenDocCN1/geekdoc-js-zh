- img_proc: true
  md: '# Building the Console 65


    has been successfully started. You''ll first handle traffic display that you can
    see these setup stanzas as they happen.


    The XMPP streams carry data in XML, but that XML is not formatted for display.
    In fact, XMPP servers, clients, and libraries will send XML that is stripped of
    unnecessary whitespace. Stanzas viewed on the wire will look mostly like one giant
    stanza of text. This is an example of a stanza with formatting, from the same
    stanza as it would typically appear:


    ```

    <message to=''darcy@pemberley.lit/meryton'' from=''bingley@netherfield.lit/meryton''

    type=''chat''>

    <body>Come, Darcy, I must have you. I hate to see you standing about by yourself
    in this stupid manner. You had much better dance.</body>

    </message>

    ```


    For short differences this is not great, but for longer stanzas and within large
    groups of stanzas, the latter is almost unbearable.


    You will be using xmlInput and xmlOutput to get structured traffic, and then wrapping
    this in HTML and CSS to display the traffic using syntax highlighting and extra
    whitespace. We won''t be covering this display translation code in much detail
    because it is orthogonal to your objective, but the code is easy to understand
    and modify if you''re curious.


    With your console set up and receiving protocol traffic, your attentions will
    turn to handling user input. By allowing the user to use XML stanzas by hand.
    Because Strophe accepts actual XML data for sending across the connection, you
    must parse this input into XML and send it over the connection. You''ll use browser''s
    native parsing abilities to accomplish this.


    Typing out XML is fairly tedious, so you''ll add the ability for users to use
    Strophe''s stanza building commands like $msg(), $pres(), and $iq(). Peek will
    use JavaScript''s eval() to execute this code.


    If it sounds simple, it is. However, Peek will be extremely useful in experimenting
    and debugging your applications and the servers with which you interact.


    # BUILDING THE CONSOLE


