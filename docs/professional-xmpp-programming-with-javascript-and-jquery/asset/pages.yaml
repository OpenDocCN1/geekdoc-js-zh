    # ## Finding a Proxy Server


    XMPP clients often support peer-to-peer file transfers between contacts. Due to
    network restrictions, however, many peers are behind NATs (network address translators)
    or corporate firewalls. In these cases, it is necessary to use a third-party proxy
    service to complete the transfer.


    It may happen that neither party knows of a proxy service to, but with service
    discovery browsers, their client software can determine whether the users'' servers
    provide one. Normally, this would be done transparently to the end user, but here
    use Dig to find an answer manually.


    Open the Dig application in your web browser, type jabber.org into the text box,
    and click Dig! You should see a similar result to the screenshot in Figure 7-2,
