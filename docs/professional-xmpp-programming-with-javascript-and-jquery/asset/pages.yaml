  md: "messages are privately sent and not shared with the rest of the room. To complete\
    \ Groupie, you’ll want to add support for sending and receiving private messages\
    \ within the room.\n\nTo send a private message, you need only address the message\
    \ directly to the occupant's room JID, making sure to use the type attribute to\
    \ chat instead of groupchat. As discussed in the Anonymity section, the participant's\
    \ room JID is used since the room can be configured as anonymous or semi-anonymous.\n\
    \nWithout a different type attribute, the recipient would have no way to distinguish\
    \ a public message from a private one. To receive messages, you must watch for\
    \ messages from room occupants with a type attribute of chat.\n\nFirst, add a\
    \ new <message> stanza handler for private messages to the others in the connected\
    \ event handler:\n\n```\nGroupie.connection.addHandler(Groupie.on_private_message,\
    \ null, \"message\", \"chat\");\n```\n\nNext, add the on_private_message() function\
    \ to the Groupie object:\n\n```\non_private_message: function (message) {\nvar\
    \ from = $(message).attr('from');\nvar room = Strophe.BareJidFromJid(from);\n\
    var nick = Strophe.GetResourceFromJid(from);\n\n// make sure this message is from\
    \ the correct room\nif (room === Groupie.room) {\nvar body = $(message).children('body').text()\
    \ + \nGroupie.add_message(\"<div class='message private'>\" + \n@&lt;span class='nick'>\"\
    \ + \nnick + \"/</span><span class='body'>\" + \nbody + \"/</span>@/</div>\");\n\
    }\n\n  return true;\n}\n```\n\nGroupie ensures the message is a participant of\
    \ the room before displaying it to the user.\n\nFinally, you need to modify the\
    \ text box's keypress event handler to detect private messages and send them.\
