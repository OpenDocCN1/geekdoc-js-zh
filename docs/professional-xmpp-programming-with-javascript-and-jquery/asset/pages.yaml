    \ specific `<div>` element. Because the dialog box is created by JavaScript code,\
    \ its `<div>` element is given the hidden class so it only appears when needed.\n\
    \nThe empty `<div>` with the `id` attribute of `log` is used to show the server's\
    \ response and status updates as the application is running. This enables you\
    \ to follow along with what is happening very easily and see exactly what code\
    \ you are writing.\n\n# LISTING 3-1: hello.html\n\n```\n<!DOCTYPE PUBLIC \"-//W3C//DTD\
    \ HTML 4.01//EN\"\n   \"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n\
    <title>Hello - Chapter 3</title>\n<link rel='stylesheet' href='http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/themes/ui/jquery-ui.css'>\n\
