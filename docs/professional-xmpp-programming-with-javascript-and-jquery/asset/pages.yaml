  md: "Once the user clicks the button, the code starts connecting to the XMPP server.\n\
    Successful connections fire the connected event, and any disconnection (or connection\
    \ failure)\nfires disconnected.\n\nYou can now request it in the connected event\
    \ handler.\n\n# Requesting Rosters\n\nRosters are manipulated with IQ-get and\
    \ IQ-set stanzas that contain a <query> element under the\njabber:iq=roster namespace.\
    \ Rosters can be retrieved and contacts modified and deleted using\nthese simple\
    \ stanzas. You see addition of new contacts, but for now, you can focus just on\n\
    trieval.\n\nThe following stanza requests Elizabeth's roster from her server:\n\
    \n```\n<q from='elizabeth@longbourn.lit/library'\ntype='get'\nid='roster1'\n<query\
    \ xmlns='jabber:iq:roster'>/>\n</q>\n```\n\nHer server will reply with something\
    \ similar to the following:\n\n```\n<q to='elizabeth@longbourn.lit/library'\n\
    type='result'\nid='roster'\n<query xmlns='jabber:iq:roster'>\n<item j='darcy@pemberley.lit'\
    \ name='Mr. Darcy' subscription='both'/>\n<item j='jane@longbourn.lit' name='Jane'\
    \ subscription='both'/>\n</query>\n</q>\n```\n\nThis roster contains two contacts.\
    \ The j attribute is the address of the contact, and the name\natribute is a user-assignable\
    \ nickname for the contact. The subscription attribute is set base\non the presence\
    \ status of the contact. It can have the value both if there is a subscription\n\
    in direction, to if Elizabeth has a subscription but the other party does not,\
    \ and from\nElizabeth is not subscribed to the contact's presence but the other\
    \ user has a subscription to\npresence. Generally, the user will want to see contacts\
    \ in the roster for which the subscription\nvalue is both or to.\n\nAdd the following\
    \ JavaScript code to the connected event handler to retrieve the roster:\n\n```\n\
    $(document).bind('connected', function () {\n  var i = $(iq({type: 'get'})).c('query',\
    \ {xmlns: 'jabber:iq:roster});\n  Gab.connection.sendIQ(iq, Gab.on_roster);\n\
    });\n```\n\n![](img/eb420c48595351b731631bccf1c8fdc4_136_0.png)\n\ncode snippet\
    \ gab.js"
