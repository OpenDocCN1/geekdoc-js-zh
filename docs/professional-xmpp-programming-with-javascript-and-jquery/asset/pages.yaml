  md: "The CSS styles for Hello are shown in Listing 3-2. This file contains a few\
    \ styles to make the application prettier.\n\n# LISTING 3-2: hello.css\n\n```\n\
    body {\n  font-family: Helvetica;\n}\n\nh1 {\n  text-align: center;\n}\n\n.hidden\
    \ {\n  display: none;\n}\n\n#log {\n  padding: 10px;\n}\n```\n\nWith the HTML\
    \ and CSS files covered, you can get started on the code.\n\n# Application Code\n\
    \nThe JavaScript code in this book is structured into three basic sections. First,\
    \ there is the application's namespace object, where all of the application's\
    \ state and functions are defined. Following the namespace object is the document\
    \ ready handler, which initializes the application once the browser is ready.\
    \ Finally come the custom event handlers, which handle internal events that are\
    \ not triggered by elements or interactions.\n\n# Namespacing\n\nThe namespace\
    \ object is used to avoid the use of global variables as much as possible. One\
    \ can never trust that every third-party library will keep to itself, but you\
    \ can ensure a minimum of problems by putting your own application state and global\
    \ variables inside a single object, a namespace object.\n\nInstead of defining\
    \ your variables and functions like this:\n\n```\nvar some_global = 0;\nvar another_global\
    \ = true;\n```\n\n```\nfunction my_adder(x, y) {\n  return x + y;\n}\n```\n\n\
    you can put the same code into a global MyNamespace object:\n\n```\nvar MyNamespace\
    \ = {\n  some_global: 0,\n```"
  merge: -1
