  md: "# ADDING ACTIVITY NOTIFICATIONS\n\nMany clients support sending and receiving\
    \ activity notifications. These notifications inform the opposite party when someone\
    \ is typing, paying attention to the chat, or has left or closed the chat. These\
    \ events are all defined in Chat State Notifications (XEP-0085): To make Gab more\
    \ user friendly, you will support for displaying and sending typing notifications.\n\
    \n# Understanding Chat States\n\nFollowing are the five chat states:\n\n+   -\
    \ Active: The user is paying attention to the chat.\n- Inactive: The user is not\
    \ paying attention to the chat.\n- Composing: The user is typing a message for\
    \ the chat.\n- Paused: The user was typing, but has briefly stopped.\n- Gone:\
    \ The user has left or closed the chat.\n\nEach state can transition to one or\
    \ more of the other states. For example, a user in the composing state may move\
    \ to paused or to active, and a user in the gone state can only move to active.\
    \ You can find the full list of state transitions in XEP-0085.\n\nSome clients\
    \ may not support activity notifications. Gab assumes that all clients will understand\
    \ this, which is not optimal, but shouldn't cause any problems elements that are\
    \ not understood. In a real-world application, you would want to detect support\
    \ for this feature and disable the notifications to the other party if their client\
    \ couldn't process them. The specification details several ways in which this\
    \ detection can be\n\nNotifications are communicated in <message> stanza. Some\
    \ states are communicated alongside the message body, but some are in their own\
    \ messages that do not contain bodies. The following example shows a user entering\
    \ the composing state, and then sending the completed message along with the transition\
    \ to the active state:\n\n```\n<message from='darcy@pomberley.lit/rosings'\nto='elizabeth@longbour.lit/hunsford'\n\
    type='chat'>\n<xml xmlns='http://jabber.org/protocol/chatstates'/>\n</message>\n\
    ```\n\n```\n<message from='darcy@pomberley.lit/rosings'\nto='elizabeth@longbour.lit/hunsford'\n\
    type='chat'>\n  <body>In have I struggled. It will not do. My feelings will not\
    \ be repressed.\nYou must allow me to tell you how ardently I admire and love\
    \ you.</body>\n  <active xmlns='http://jabber.org/protocol/chatstates'/>\n</message>\n\
    ```\n\nDarcy's client first sends a notification to Elizabeth that he has begun\
    \ typing. Several seconds later, a normal message is received with the beings\
    \ of his proposal along with a second notification that"
  merge: -1
  pgno: 155
- img_proc: true
  md: "he is paying attention to this. Elizabeth's client can use these notifications\
    \ to modify her display appropriately.\n\n# Sending Notifications\n\nGab supports\
    \ only active and composing states. When the user starts typing, the composing\
    \ state is communicated to the intended recipient. Upon completion of the message,\
    \ the active state is sent. This is exactly the series of events shown in the\
    \ previous example.\n\nFirst, you should modify the keypress event handler of\
    \ the chat input boxes to send the composing notification. It will also need to\
    \ add the active state notification when the message is sent. The modified handler\
    \ is:\n\n```\n$('.chat-input').live('keypress', function (ev) {\n    var jid =\
    \ $(this).parent().data('jid');\n\n    if (ev.which === 13) {\n        ev.preventDefault();\n\
