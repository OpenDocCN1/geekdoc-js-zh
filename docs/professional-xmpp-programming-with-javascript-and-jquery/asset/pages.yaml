  md: 'Now


    Similar transformations are possible between any pair of operations.


    # Details of the Algorithm


    As you''ve learned, operational transformation solves a complex problem in a relatively
    simple and straightforward manner. However, you have a few important details to
    consider before the algorithm can be implemented in NetPad. The structure of operation
    requests must be defined. Executing groups of operations will need some care,
    and the algorithm has the set of priorities to address this. It is also necessary
    for each user to maintain a queue of outstanding operations, to know where a given
    operation applies, and to track the history of operations that have already been
    performed.


    # State


    Each user must keep a state vector with one element for each user participating
    in the session. There will be two participants in every NetPad session, and the
    state vectors for both users will have two elements. The elements of the state
    vector are counters that start at zero. For every operation executed, the operation
    initiator of the state vector is incremented by one. For example, if the first
    position in the state vector represents the local user and the second position
    represents the remote user, a state vector of $<10,23>$ means that 10 locally
    generated operations and 23 remotely generated operations were executed on the
    local document.


    Each user''s place in the state vector must be the same for all state vectors.
    This can be achieved easily by lexicographical ordering the users by their JIDs.


    # Operation Requests


    When any user executes a local operation, it will broadcast a corresponding operation
    request to the other users. Operation requests can be represented as a four-element
    vector in the form $<c, s, o, p>$. The first element is the initiator''s position
    in the state vector. The next element, $s$, is the state vector of the $j$th user
    at the time the operation was generated. The element $o$ is the requested operation,
    and $p$ is the operation''s priority.


    Each request carries not only the operation and its parameters but also the state
    vector at the time the operation was executed and its priority. This extra information
    will allow the other participants to determine when to execute the request. For
    example, one user may generate an operation that comes after a second user'',
    who has received the second user''s operation first, must wait for the first user''s
    operation before they can execute it. Without knowledge of the operation''s corresponding
    state, it would not be possible to order execution properly.'
