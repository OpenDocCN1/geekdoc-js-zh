  md: "# Building the Chats\n\nNew tabs are added with the add subcommand of tabs().\
    \ You can add a new tab to the preceding ones with:\n\n```\n$('#tab-example').tabs('add',\
    \ '#tab-example-3', 'Third Tab');\n$('#tab-example-3').html(<p>Finally, a third\
    \ tab!</p>);\n```\n\nYou can also programmatically change the tab with the select\
    \ subcommand. Switch to the second tab with:\n\n```\n$('#tab-example').tabs('select',\
    \ '#tab-example-2');\n```\n\nTabs support number of other commands as well as\
    \ various options that control their behavior. Please refer to jQuery UI's documentation\
    \ if you'd like to explore the additional functionality.\n\nYou will put your\
    \ newabbing knowledge to use in the next section when you create chat windows.\n\
    \n# Creating New Chats\n\nThe easiest place to start chatting is by letting users\
    \ click contacts in the roster to create or select chats. Before you implement\
    \ these actions, you must first initialize the chat area. Add the following code\
    \ to the document ready handler:\n\n```\n$('#chat-area').tabs().find('.ui-tabs-nav').sortable({axis:\
    \ 'x'});\n```\n\ncode snippet gab.js\n\nThe code initializes the chat area as\
    \ a tabbed control and then makes the tab in the tab bar using jQuery's sortable()\
    \ function. This allows the user to reorder the tabs after they are created so\
    \ that appear exactly where the user prefers.\n\nNow that you have a real tab\
    \ area, you will need to respond to click events on the roster contacts. For now,\
    \ you've used bind() or click() to set up event handlers, but you will now have\
    \ to use live(). bind(), live() which attaches a handler to an event, but it will\
    \ do this for any elements that are created after live() is called. Because roster\
    \ contacts are being added dynamically, you must use live() to ensure that any\
    \ future roster contacts will still get the right event handlers.\n\n```\n.roster-contact').live('click',\
    \ function () {\n  var id = $(this).find('.roster-id').text();\n  var name = $(this).find('.roster-name').text();\n\
    \  var var_id = Gab.to_id(id);\n\n  if ('#chat-' + var_id).length > 0) {\n   \
    \ $('#chat-area').tabs('select', '#chat-' + var_id);\n  } else {\n    $('#chat-area').tabs('add',\
    \ '#chat-' + var_id, name);\n    $('#chat-' + var_id).find(' > #chat-' + var_id).append($(\n\
    \      <div class='chat-messages'></div>\n      <input type='text' class='chat-input'>\n\
    \    ));\n  }\n});\n```"
  merge: -1
  pgno: 148
