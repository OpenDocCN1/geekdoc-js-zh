    code snippet groupie.js


    The directed presence stanza looks just like the ones you saw as before, but the
    initial presence has something new, a priority child.


    Presence priorities give information to the user''s server about which connected
    resources are more important for message delivery. Messages will be routed to
    the resources with the highest possible presence priority, and in the case of
    it, the message will be delivered to one or all of the resources with tied priorities.


    The presence priority in Groupie is negative, which has a special meaning. Any
    resource with negative priority will never receive messages addressed the bare
    JID. This is very useful for XMPP applications that do not use presence because
    the negative priority ensures that the application is not delivered messages it
    won''t process. It also ensures that the user does not lose private messages that
    are sent to resources that are not capable of private chat.


    Because Groupie doesn''t handle private messages, aside from the special group
    chat private messages you see later, it sets the priority to -1 to avoid accidentally
    stealing messages from users.


    Now Groupie starts the process to join a group chat room, you should add support
    for handling the broadcast of the other participants'' presence as well as the
    broadcast of your presence, which indicates the room join is complete.


