  md: "Now Mr. Darcy has a pubsub node with a nice title to entice subscribers and\
    \ the ability to persist the data after the most recent 100 books he has read.\n\
    \n# Pubsub Events\n\nPubsub nodes and their configuration are necessary and useful,\
    \ but they do not do much themselves. The real value of pubsub nodes is in the\
    \ events that are published to them and broadcast to subscribers.\n\nAnything\
    \ can be included in a pubsub event. The pubsub service doesn't know or care what\
    \ is inside the event; the same event is carried in a node's subscribers. The\
    \ content of a pubsub event is called its payload. Generally, subscribers will\
    \ know what payloads are published at a given node and how to interpret them.\
    \ Some common payloads include blog posts in the Atom synchronization format or\
    \ information about songs currently using in User Tune format (XEP-0118).\n\n\
    When publishing, the event is wrapped in a `<publish>` action within the `<pubsub>`\
    \ element, and when receiving events, the same is carried in a `<message>` stanza.\
    \ In both cases the event payload is simple. Following is an example of an event\
    \ with a User Tune payload:\n\n```\n<tune xmlns='http://jabber.org/protocol/tune'\n\
    \  <artist>Elizabeth Bennet</artist>\n  <title>A Piano Song for Lady Catherine</title>\n\
    </tune>\n```\n\nForms are flexible enough to represent many kinds of payloads,\
    \ and Mr. Darcy has chosen to encode the data into forms that he can read. However\
    \ when he finishes reading a book, he publishes an event to his pubsub node using\
    \ the following form-based payload:\n\n```\n<x xmlns='jabber:x:data' type='result'>\n\
    \  <field var='title'>\n    <value>History of Pemberley</value>\n  </field>\n\
    \  <field var='author'>\n    <value>Sir Lewis de Burgh</value>\n  </field>\n</x>\n\
    ```\n\nThe previous examples included event payloads, but nodes can also be configured\
    \ to send only event notifications. In this case, the payload can be retrieved\
    \ by querying the pubsub node. You see how to publish and receive events as well\
    \ as how to retrieve payloads in the pubsub sections.\n\n# Publishing to a Node\n\
    \nMr. Darcy, having just finished his latest book, must now publish a new event\
    \ to his pubsub node. You saw Mr. Darcy's event payloads in the previous section;\
    \ here is how they are published:\n\n```\n<iq from='darcy@pemberley.lit/library'\n\
    \ to='pubsub.pemberley.lit'\n type='set'\n id='publish1'>\n <pubsub xmlns='http://jabber.org/protocol/pubsub'>\n\
    ```"
  merge: -1
  pgno: 240
- img_proc: true
  md: "```\n<publish node='latest_books'>\n<item>\n  <x xmlns='jabber:data' type='result'>\n\
    \    <field var='title'>\n      <value>A History of Pemberley</value>\n    </field>\n\
    \    <field var='author'>\n      <value>Sir Lewis de Burgh</value>\n    </field>\n\
    \  </x>\n</item>\n</publish>\n</pubsub>\n<iq>\n```\n\nIn this example, the event\
    \ payload is wrapped in an <item> element and then placed inside the <publish>\
    \ action. If Mr. Darcy had just finished two books, he would just append the second\
    \ one in its own <item> element.\n\nThe server will accept the pubsub request\
    \ and return a successful response:\n\n```\n<iq from='pubsub.pemberley.lit'\n\
    to='darcy@pemberley.lit/library'\ntype='result'\nid='publish'>\n<pubsub xmlns='http://jabber.org/protocol/pubsub'>n\
    \  <publish node='latest_books'>\n    <item id='821b576d5fabc6b358b6ec4139b87f5c'/>\n\
    \  </publish>\n</pubsub>\n</iq>\n```\n\nNotice that the server response also includes\
    \ an <item> element. Because Mr. Darcy's <item element did not contain an id attribute,\
    \ the server created one for every item since every item must have an identifier.\
    \ These identifiers are used for notifications, item retrieval, and retraction.\n\
    \nMr. Darcy could also have specified an id attribute in his original publish\
    \ stanza, and the server would have used that instead. This is very similar to\
    \ the earlier examples of normal and instant node creation.\n\n# Subscribing and\
    \ Unsubscribing\n\nandElizabeth and are both readers and quite curious about what\
    \ books what. Darcy had in his nose lately. Each of the ladies can subscribe to\
    \ Mr. Darcy’s pubsub node by sending an IQ-set with the <subscribe> action:\n\n\
    ```\n<iq from='elizabeth@longbourn.lit/outside'\nto='pubsub.pemberley.lit'\ntype='set'\n\
    id='subscribe'>\n<pubsub xmlns='http://jabber.org/protocol/pubsub'>\n```"
