  md: '# CHAPTER 3 SAYING HELLO: THE FIRST APPLICATION


    XMPP stanzas are just partial XML documents. You can certainly use the browser’s
    DOM manipulation functions to build stanzas, and vary slightly from browser. The
    DOM API can be quite tedious, Strophe abstracts these APIs, in the same way jQuery
    abstracts from the same APIs, so that you can focus on creating the stanzas without
    worrying about all the details.


    # Strophe Builders


    Constructing XMPP stanzas is the job of Strophe.Builder. These objects were inspired
    by jQuery and making building stanzas extremely fast and agile. Strophe goes above
    and beyond providing several shortcut functions to accomplish common construction
    operations.


    A builder is created with two parameters: an element and a set of attributes.
    The first line of the following code creates the stanza `<presence/>` and the
    second line creates the stanza `<presence to=''example.com''/>


    ```

    var pres1 = new Strophe.Builder("presence");

    var pres2 = new Strophe.Builder("presence", (to: "example.com"));

    ```


    Because building stanzas is a common operation and using "new Strophe.Builder"
    is rather long, Strophe provides four global aliases for creation: build(), $msg(),
    $pres(), and $iq().

    The code for these functions just uses Strophe.Builder objects exactly like the
    examples above. The function build() takes the same arguments as the constructor
    for Strophe.Builder. The other three functions create <message/>, <presence/>,
    and iq stanzas, and take an optional argument of the desired attributes.


    You can shorten the coding using either build() or $pres(), although the latter
    is more often used:


    ```

    var pres1 = build("presence");

    var pres2 = build("presence", (to: "example.com"));

    var pres3 = $pres();

    var pres4 = $pres((to: "example.com"));

    ```


    Building more complex stanzas is accomplished via chaining function calls. Just
    like jQuery, Strophe’s building shortcut methods return the builder object when
    they are called. The methods on the builder object, which you see shortly, also
    return the builder object. This means that you can keep methods in a chain, just
    like in jQuery. Don''t worry if this seems confusing; you will see plenty of examples.


    All the builder''s methods have shortened names to save typing. The chainable
    methods that return the builder object are c(), cnode(), t(attrs), and up(). There
    are two methods that do not return the builder object, toString() and tree().


    The toString() method serializes the stanza to text. This can be very handy for
    debugging purposes. For example, pres().toString() returns the string "presence/>".
    The method tree() does a similar job, but returns the DOM element at the top of
    the stanza tree. This is normally used, if you need to access the DOM elements
    inside a builder object, it is there there.


    You add a new child element to the stanza with c() and cnode(). The former takes
    the same parameters as $build() and appends a new child element to current element.
    The latter method does


    ![](img/eb420c48595351b731631bccf1c8fdc4_79_0.png)'
  merge: -1
  pgno: 79
