- img_proc: true
  md: '# GROWING VERTICALLY


    Horizontal scalability is sometimes tough to achieve. Not only must you deal with
    your application’s normal concerns, you must also keep in mind how the various
    machines involved will distribute the work and handle internal communication.
    If you don’t plan ahead for such scalability, it can be difficult to retrofit
    your application. On the other hand, it is just a question of money to buy faster
    machines and a question of time and effort to optimize the application’s code.


    All applications can be profiled and find slow operations. XMPP applications in
    particular have a few common places where performance problems appear, and this
    section focuses on those. The main areas to watch out for are communication latency,
    XML serialization, and HTML DOM operations.


    # Reducing Latency


    All network applications must deal with some latency. The speed of an operation
    can be lightning fast, but if the time it takes to send the request to the server
    and receive the response is high, the user will still experience an irritating
    delay. Often, reducing latency provides enormous benefits to perceived application
    speed, so you should always aspire to make your application’s latency as minimal
    as possible.


    Latency can come from many places, but only a few are under your control as an
    application developer. The two biggest sources of latency in XMPP applications
    are initialization and setup of connections (and other resources) and large stanzas.
    Each of these can be handled in a number of ways depending on your application’s
    particular needs.


    # Streamlining Connections and Setup


    When XMPP applications start, they need to connect to a server. This process takes
    some time and involves a few rounds of requests and responses to complete. Once
    connected, applications often need to perform a set of initialization operations
    such as fetching the roster and joining chat rooms. When native XMPP connections
    are used, these processes are not as much of a problem, but over HTTP, the story
    is much different.


    Any number of stanzas can be sent in one HTTP request to a connection manager,
    and the same is true for stanzas in responses. The nature of initialization stanzas
    is that they must be sent and received sequentially, with the next stanza depending
    on the results of the previous one. If you assume 100 milliseconds of latency
    per request and response, a handful of initialization stanzas don’t take long
    to add up to noticeable delays and annoyed users.


    The first step to combating these problems is to parallelize as much as possible.
    If you can start several events simultaneously, fewer HTTP round trips will be
    needed to complete the initialization. If you have three initialization tasks
    that can be run in parallel, the number of round trips needed to complete all
    of them is equal to the number needed to complete just the longest one. For example,
    if a group chat application joins rooms on startup, it should join every room
    at once, instead of serially. The end result will be much faster launch times
    for the application.'
  merge: -1
  pgno: 419
- img_proc: true
  md: 'By default, Strophe automatically sends new stanzas as soon as you call the
    send() function. If your application is going to be sending a lot of stanzas in
    a short amount of time, this behavior is undesirable because it could result in
    using more HTTP round trips than necessary. You could batch stanzas in your code
    to send all at once, but this is hard to do if your initialization code is spread
    over several modules.


    Strophe provides two functions that help you optimize these areas of your application:
    pause() and resume(). After pause() is called, Strophe stops sending any data
    to the server until resume(). Optimizing the transmission of a large number of
    stanzas is as easy as pausing, doing all individual calls to send(), and then
    resuming. The end result will be one large request to the server instead of many
    small.


    You''ve already seen another helpful tool to reduce latency, the attached sessions
    described in Chapter 12. All of the initial set up of connection happens over
    a native XMP connection—often from a machine on the same network as the XMP server—only
    one round trip is needed to start the connection. By making the connection and
    authentication faster, you can use common initialization code in the server-side
    attachment service to make operations faster as well. This can easily reduce multiples
    of latency down to a mere instant.


    Session attachment can''t help once your application is already running, but the
    other techniques are equally applicable during other phases of your application''s
    session. For example, a gaming client might need to make several requests to a
    central service as well as join room and query initial state. The pause() and
    resume() functions combined with parallelization can make this happen as quickly
    as possible.


    Of course, all these latency-saving measures can be combined in various ways.
    Choose the ones that are the most effective and appropriate for your particular
    application. Both Amazon and Google have done extensive research on the benefits
    of reducing latencies in requests and found them to significantly impact their
    bottom lines. Your users will definitely appreciate your responsiveness.


    # Dealing with Large Stanzas


    The XMPP protocol is built for exchanging small bits of information, and is therefore
    no surprise that large stanzas can cause problems. For the most part, it is easy
    to avoid large stanzas, but even when they can''t be avoided, several tools help
    mitigate their effect.


    To understand why large stanzas can be a problem, remember that each XMPP session
    consists of two XMPP streams. Only one stanza at a time can be sent over a stream,
    and each stanza takes some time to transmit from the source to the destination.
    Further stanzas that need to be sent must wait until the ones before them have
    been transmitted.


    Normally, the stanzas are small, so each stanza must wait only a very short amount
    of time before it is actually transmitted. When a large stanza is sent, the transmission
    time can be large, and during this time, no other stanzas can be sent in the same
    direction.'
  merge: -1
  pgno: 420
- img_proc: true
  md: '# 396 | CHAPTER 13 DEPLOYING XMPP APPLICATIONS


    Imagine playing a chess game over XMPP, and in the middle of the game, right before
    you move, a giant avatar of your contacts is sent to the server immediately, and
    your opponent instantly responds, but your client must now wait until the avatar
    is completely transmitted before you see your opponent''s move. Meanwhile, your
    clock is ticking away precious seconds!


    Two main methods exist for handling large stanzas: splitting them into smaller
    stanzas and dealing with them out of band.


    XMPP provides a number of ways to split a large amount of data over available,
    smaller stanzas. XEP-0047, which break up a large payload into smaller chunks
    and sent in a series of `<iq>`, `<message>` stanzas. Once all the stanzas for
    the payload are received, the original data can be combined and processed. Unlike
    sending data in a large blob, chunking it over several stanzas works for other
    stanzas can also be sent, improving latency.


    Some XMPP stanzas consist of a long list of items or results. For example, a service
    discovery request to a pubsub system returns thousands of available nodes, resulting
    in a large, cumbersome stanza. For these types of stanzas, it is often better
    to return the set of results in pages. Results Set Management (XEP-0237) provides
    a similar solution specifically for rosters. These solutions aren''t all built
    into every extension, but you can add them to your own. Over time, the XMPP community
    will apply a solution to these across all extensions that may may generate large
    stanzas.


    XMPP may not be the best protocol for transferring large blocks of information,
    plenty of other protocols exist that you use these other protocols to transfer
    large blobs of data out of (OOB), outside of the XMPP connection.


    The most common OOB technique for web-based XMPP applications is to use normal
    HTTP requests. For example, instead of transferring avatars or images over XMPP,
    the URLs of the data can be transmitted over XMPP and the actual data fetched
    via HTTP. The XMPP connection will retain the necessary latency, and the large
    pieces of data can be sent over a near-optimal transport. As an added bonus, the
    browser caches many requests, which might request the same data that can be answered
    without wasting bandwidth on duplicate data.


    The Jingle extensions (XEP-0166, XEP-0234, XEP-0247, and others) provide a very
    flexible framework for negotiating, establishing, and communicating over OOB connections.
    This technology was originally developed by Google for in voice and video chat
    that has been standardized and extended by the XMPP community to handle a wide
    variety of use cases.


    If sufficient intermediary services exist, Jingle is capable of negotiating and
    facilitating connections even through NATs and firewalls. Jingle is also capable
    of negotiating in-band channels for those cases where no OOB channel is available.
    Although Jingle came from a need for multimedia transport negotiation and management,
    it is quickly becoming one of XMPP''s most important tools, and extensions already
    exist for Jingle for binary file transfers and end-to-end communications.'
  merge: -1
  pgno: 421
- img_proc: true
  md: '# Minimizing XML Serialization


    Applications work with stanzas in a convenient data structure, and when ready
    for transmission, these data structures are serialized to XML bytes and sent over
    the network. Busy applications will be serializing a lot of XML data, and though
    it is not usually an expensive operation, it can become a critical factor in performance.


    Aside from optimizing the XML serialization yourself, the only way to improve
    performance is to reduce the amount of serialization that is done. Applications
    can be structured to minimize serialization, but you must first know where it
    happens.


    Every XMPP connection involves a minimum of two serialization steps. One entity
    must serialize XML to send to another, and the recipient must serialize any response
    it sends. For two clients on different servers, there are up to six serialization
    steps. First Darcy must serialize his stanzas to send them to the longterm.lit
    server. His server may need to parse and serialize to send them to the longterm.lit
    server. The longterm.lit server may need to serialize the stanza for transmission
    to Elizabeth''s client. Finally, Elizabeth''s server will take the response route.
    If both clients are using HTTP connection managers, there may be more serialization
    occurring!


    Some optimized XMPP servers can run many stanzas without fully parsing them, avoiding
    re-serialization, and connection managers may use similar tricks to avoid unnecessary
    serialization as well. If serialization becomes a bottleneck for your application,
    you might consider using one of these existing, optimized implementations.


    In some cases, your application may be able to avoid serialization. For example,
    just like an optimized server, if you have access to the raw XML bytes and you
    only need to send a copy of a stanza, you can transmit the same bytes out. Unfortunately,
    most interesting applications are not often copying stanzas.


    There is, one instance where serialization can be more of an issue — components.
    XMPP server components communicate over an XMPP stream just like clients, and
    because they are both the endpoint and origin of communication, they cannot simply
    route pre-serialized stanzas around. Components are doomed to a life full of parsing
    and serialization.


    The only way to eliminate this kind of serialization is to transmit the data structure
    representation between the entities, but because the entities are often written
    in different programming languages by different people or teams, this is not usually
    a practical solution.


    Server plug-ins do not have these kinds of serialization issues because they share
    data representations — and often the same memory or process — and have no need
    for serialization. Also, because they are part of the server itself, communication
    is usually done with function instead of TCP socket connections.


    If you have a component that is bottlenecked on XML serialization, converting
    it to a server plug-in may be the most viable option.


    In all cases, understanding where serialization is happening and at which points
    it is strictly required is the first step to figuring out how to optimize this
    part of your application. Once you know the extra serialization steps are, it
    is fairly straightforward to apply one of the preceding techniques to minimize
    it.'
  merge: -1
  pgno: 422
- img_proc: true
  md: '# Optimizing DOM Operations


    Dynamic web applications must do a lot of DOM operations. The application''s user
    interface changes as new data or user interactions are processed. Operations that
    manipulate the DOM are often among the most expensive.


    You can use a few techniques to reduce or optimize your access and manipulation
    of the browser''s DOM: batching operations, cloning, and limiting scope.


    # Batching Operations


    If you''ve ever written any graphics code you might be familiar with double buffering.
    Instead of painting on the screen, a double-buffered application paints on an
    off-screen buffer area. Once the painting is complete, the buffer is swapped with
    the on-screen buffer. This results in flicker-free frame changes.


    DOM operations are the same as double buffering. Instead of manipulating the DOM
    one element at a time, you build up an part of a DOM tree off-screen, and then
    insert the entire part at once. Performance is gained because the browser does
    not have to render anything to the screen until your final structure is complete.


    Another technique, also extensively used in computer graphics, is to update the
    user interface at regular intervals. Humans cannot perceive small slices of time;
    any operation that completes enough is perceived as instantaneous. You can save
    several intermediate updates over a small slice of time and then render them all
    at once. The user will not be able to tell the difference, but computer must do
    fewer screen updates, which are expensive.


    The following example may be helpful in illustrating both of these techniques.
    The on-screen roster in Chapter 6''s Gab application is composed of a list of
    items, each of which is composed of several elements. When elements are added
    or removed from the roster, the whole element is manipulated at once, as opposed
    to in place, to manage the DOM efficiently. It is possible for many roster updates
    to happen simultaneously. It would be much more efficient if Gab would accumulate
    roster changes in a batch and process them every 1/10th of a second. The user
    will not notice any significant decrease in responsiveness, but the browser will
    have to update the UI 10 times in a second, even if hundreds of changes are coming
    in.


    # Cloning Instance of Creating


    Browsers can clone an already existing element much faster than they can create
    a similar element from scratch. By cloning and then changing template elements,
    you can optimize the insertion of new UI elements.


    If your application needs to insert many kinds of elements that differ only in
    a few places, you can gain some efficiency by using template elements. You can
    include a template element in the HTML code or create one when your application
    starts. When you need to insert a similar element, you clone the template, make
    the necessary changes, and then insert the cloned element. jQuery clone() function,
    which makes this operation easy.'
  merge: -1
  pgno: 423
- img_proc: true
  md: 'You can also use cloning in conjunction with batching updates. First, clone
    the section of the UI that will be receiving the changes. Next, do all of your
    updates to this cloned element. When you''re finished, you can replace the original
    element with the cloned one, exposing all your DOM manipulations at once.


    # Limiting the Scope of Operations


    Many DOM operations are done on sets of elements, and before the operations can
    be done, the set of elements must be enumerated. By carefully choosing selectors
    when using JQuery or similar libraries, you can limit the scope of the target
    element. This can make a big difference; the code will only need to traverse a
    small set of elements to find the ones you want instead of traversing the entire
    document.


    The easiest way to limit the scope is to use an element identifier as the first
    part of your selector. For example, if you want to manipulate all elements of
    class roster-item and these elements all happen to be descendants of an element
    with the roster id, you can use the selector #roster .roster-item instead of the
    less efficient .roster-item. The browser will only need to search through all
    descendants of the roster element instead of all elements in the document. For
    large documents, this can result in tremendous speed increases.


    # SUMMARY


    The world may feel small, but it is filled with millions of potential users. You
    must take into account considerations of scale when your application needs to
    serve a large audience. Similarly, if your application is very resource-intensive,
    you will often need to deploy it with special attention to optimization and scalability.


    In this chapter, you learned about how to solve these kinds of deployment issues
    using techniques like:


    +   - Scaling applications both horizontally and vertically

    - Distributing HTTP connection managers

    - Clustering XMPP servers

    - Load balancing server components

    - Internally federating servers

    - Speaking the server-to-server protocol

    - Minimizing latency in initialization

    - Dealing with large stanzas

    - Reducing XML serialization

    - Optimizing DOM manipulations in browsers


    In the next and final chapter, you will discover how the Strophe library is easily
    extendable by developers to add new functionality.'
