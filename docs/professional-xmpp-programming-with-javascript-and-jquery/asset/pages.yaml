    \    }\n  },\n\n  xml2html: function (s) {\n    return s.replace(/&/g, \"&amp;\"\
    )\n      .replace(/<//g, \"&lt;\")\n      .replace(/>/g, \"&gt;\");\n  }\n};\n\
    ```\n\n![](img/eb420c48595351b731631bccf1c8fdc4_94_0.png)\n\ncode snippet peek.js\n\
    \nThe Peek object serves as a namespace container for all application code and\
    \ state. This is good-programming practice, and isolates your code from other\
    \ applications. Currently, the only application state the application has is the\
    \ connection variable.\n\nWeb do not speak XMPP natively (at least not yet) so\
    \ XMPP connections must be tunneled through HTTP requests. A side effect of this\
    \ tunneling is that stanzas are delivered in a `<body>`"
