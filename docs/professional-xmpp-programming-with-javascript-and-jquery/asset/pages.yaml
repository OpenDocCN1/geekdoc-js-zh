    });\n```\n\n```code snippet peek.js```\n\nThe user can now use XML in the text\
    \ area when an established connection exists. You just need to do something when\
    \ the user clicks Send.\n\nStrophe's send() function only accepts valid DOM objects\
    \ or Strophe.Builder objects. This makes it difficult to send invalid XML over\
    \ the XMPP connection. Sending invalid XML would cause the server to terminate\
