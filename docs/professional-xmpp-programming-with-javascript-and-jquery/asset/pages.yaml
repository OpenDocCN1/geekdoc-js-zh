- img_proc: true
  md: '# Talking with Friends:

    One-on-One Chat


    WHAT''S IN THIS CHAPTER?


    +   - Presence subscriptions

    - Managing rosters and contacts

    - Message routing

    - Best practices for one-on-one communication

    - Chat state notifications


    For many years, XMPP was used primarily for its original purpose of instant messaging.
    The other uses of the protocol, many of which you will see in upcoming chapters,
    were just the experiments of a few creative hackers. Today, the instant messaging
    pieces aren''t fashionable as publish-subscribe, group chat, and collaborative
    applications, but the IM foundations of XMPP remain extremely important.


    Instant messaging systems are first class social networks. Each member has a social
    graph, their roster, and can communicate and participate with others. These social
    tools are baked into XMPP at a low level, and they make building social applications
    quite easy. Unlike many popular social networks, the XMPP network is also federated,
    connecting many disparate communities.


    Social and community aspects of applications are becoming increasingly important,
    and therefore it is imperative that you gain an understanding of XMPP''s basic
    social tools. The chat application in this chapter, called Gab, may not be on
    the cutting edge of software, but its parts can be used to add important social
    features to nearly any kind of application. Indeed, many users will expect to
    see these features as they have grown accustomed to them in other tools.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'Instant messaging is the oldest use of XMPP, and in this chapter, you build
    your own basic messaging application for chatting and keeping tabs on friends.
    Each feature will seem familiar if you''ve ever used instant messaging applications
    before and forms a solid basis for developing social software.


    # APPLICATION PREVIEW


    The interface for this chapter''s application is quite a bit more complex than
    the ones youve built in previous chapters. Figure 6-1 shows what the finished
    application will look like.


    ![](img/eb420c48595351b731631bccf1c8fdc4_129_0.png)


    FIGURE 6-1


    The area is located on the left side. Each chat appears in a separate tab in the
    interface, allowing the user to keep track of many conversations at once. The
    roster appears on the right side and shows the name and status for each of the
    user''s contacts. Just above these areas are buttons for common functions.


    This interface has a lot going on — multiple tabs, multiple controls, and multiple
    new pieces of the XMPP protocol.


    # GAB DESIGN


    Instant messaging in XMPP relies heavily on the use of the <message> and <presence>
    stanzas. A <message> stanza is sent whenever a user communicates with another.
    You saw a basic example of these stanzas in the previous chapter; the Identica
    API is just a computer program mimicking a user. <presence> stanzas are sent whenever
    contacts come online, change status to away, or go offline.'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'These two stanzas go hand in hand. The <presence> stanza communicates a user’s
    availability for chat. If a user is offline or away, may not be the best time
    to attempt a conversation. An online user, however, is probably happy to talk.
    Once a user has decided to communicate, <message> stanzas do the work of moving
    pieces of the conversation between its participants.


    # Presence


    XMPP'' designers were quite sensitive to privacy issues, presence information
    is controlled through subscriptions. In order for Elizabeth to receive presence
    updates from Wickham, she must first subscribe to these updates. Furthermore,
    Wickham must approve her subscription request.


    Presence subscriptions are asymmetric. If Elizabeth has a subscription to Wickham’s
    presence, it does not necessarily mean Wickham is subscribed to Elizabeth’s. In
    most cases, a user will send a subscription request to someone, and automatically
    approve the subscription request coming from that person.


    You see subscriptions in detail when you build Gab''s roster area functionality.


    # Messages


    As you saw in the previous chapter, messages are usually quite simple. They do
    have special delivery semantics that, an XMPP programmer, must take into account.
    These semantics on addressing and whether a message is addressed to a chat''s
    bar JID (elizabeth@longburn.it) or to a full JID (elizabeth@longburn.it/library).


    Messages can also contain more than just the message''s text. They can carry formatting
    information (as in the previous chapter’s use of XHTML-IM), metadata, or application-specific
    payloads. As you see a little bit later, activity notifications sometimes appears
    in messages containing no text at all!


    Gab has two major centers of functionality, the chat area and the roster area,
    as well as bar for common functions. Each area deals with one type of stanza.
    The chat area handles the <message> stanzas and the roster area handles <presence>.


    # Chat Area


    Gab must support multiple contacts simultaneously. A tab for each chat creates
    separation between all the conversations as making it easy for users to navigate
    to the one they want.


    Each incoming message is stamped with the address of the person who sent it. Chat
    tab handles the incoming messages from a particular sender. An input area for
    outgoing messages appears at the bottom of every tab.


    New tabs are created when a new message is received from a contact who does not
    already have an open tab. Tabs can also be created by pressing the New Chat With
    Button in the action bar above the chat area or by clicking a contact in the roster
    area.


    Each chat will need to display messages, status changes, and activity notifications
    for the associated user.'
  merge: -1
  pgno: 130
- img_proc: true
  md: "# Roster Area\n\nThe roster area displays the user's contacts as well as their\
    \ current presence status. This list should be sorted so that the available contacts\
    \ appear at the top of the list, followed by the ones who are away. Offline contacts\
    \ appear at the very bottom of the list.\n\nIncoming presence information update\
    \ the roster area so that the user is always aware of the latest status for each\
    \ contact.\n\nClicking the New Contact button in the action bar adds new contacts\
    \ to the roster and requests a presence subscription. You must also handle the\
    \ case when the new contact requests a subscription to the user's own presence\
    \ so that the user can decide whether to approve or deny the subscription. With\
    \ the basic design layout out, it's time to start working on Gab.\n\n# MAKING\
    \ THE INTERFACE\n\nThe HTML for Gab's interface appears in Listing 6-1. It contains\
    \ the action bar, followed by the chatarea<div> and the roster-area <div>. Below\
    \ are several dialog boxes that Gab needs — the login dialog you've seen in previous\
    \ chapters, the contact dialog box for adding new contacts to the roster, the\
    \ chat dialog for starting new chats, and the approval dialog box for handling\
    \ incoming subscription requests.\n\n+   LISTING 6-1: gab.html\n\n```\n<!DOCTYPE\
