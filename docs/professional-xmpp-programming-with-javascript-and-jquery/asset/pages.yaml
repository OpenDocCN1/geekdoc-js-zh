    # SUMMARY


    This chapter covered a simple, but important, XMPP extension called service discovery,
    often referred to as disco. Using service discovery, your application can browse
    available resources, determine support for specific features, and find metadata
    about various services. Your application can also implement service discovery
    to enable other entities to gather information on your application''s resources.

