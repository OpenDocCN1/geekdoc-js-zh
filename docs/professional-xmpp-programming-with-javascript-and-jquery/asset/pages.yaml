  md: '# XML Namespaces


    Many are familiar with XML, but few seem to have much experience with XML namespaces.
    Namespaces are important for defining XMPP extensions as they allow the addition
    of elements and attributes that will be interpreted in a new context.


    An XML namespace is a URI, or uniform resource identifier. It is important to
    note that although a URI sometimes looks like a URL, it does not necessarily refer
    an actual location on the Web.


    In XMPP, the URIs take several forms. Original URIs of the form *jabber:foo* or
    *jabber:ix:foo* were used. Eventually the community adopted more URL-like URIs
    such as `http://jabber.org/protocol/muc`. Today, XMPP URIs look like `xmpp:simple:1`.
    These differences are due to the community’s increasing knowledge of sophistication
    and with URLs.


    Official XMPP extensions register their URIs with the XMPP registrar as part of
    the standardization process. Application-specific namespaces that are not intended
    for standardization typically use URL-style URIs such as `http://myapp.com/ns`.
    If you intend to submit your protocol extension to the XSF, you can contact the
    XMPP registrar to obtain a temporary namespace to use until your extension reaches
    draft status and is assigned a permanent namespace.


    XML elements can have a default namespace, and this namespace is inherited by
    child elements that no declaration of their own. For instance, `jabber:client
    <message>` element in the stream does not need to declare itself part of the `jabber:client`
    namespace because it will inherit its property from the default namespace. This
    inheritance is quite handy because it saves having to declare the namespace of
    every element, most of the time, elements will be in a common, inherited namespace.


    # Extended Elements


    Extended elements are just new child elements that live under a different namespace.
    You’ve seen several examples of these including XHTML-IM’s an `<html>` child and
    every IQ-get and IQ-set stanza in the body.


    There’s no restriction on where you can place elements, except that you cannot
    normally place an element at the XMPP stanza level. XMPP routinely added extended
    elements to over XMPP’ elements.


    Extended elements for a particular protocol extension can generally appear only
    in few specific places. For example, to place a `jabber:iq:roster` element anywhere
    but as the first child of an `<iq>` stanza. Some extensions do have more generic
    properties; Data Forms in particular can go near anywhere.


    Extended elements can appear two ways. They can either declare a default namespace
    by including the `xmlns` attribute in the element, or they can use namespace prefixes.


    # Changing the Default Namespace


    Changing the default namespace is the most common method used with extended elements,
    and all the examples in this book have used this method. Any method can declare
    the default namespace'
