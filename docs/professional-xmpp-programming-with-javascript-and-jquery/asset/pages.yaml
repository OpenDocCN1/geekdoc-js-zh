  md: "```\n$('$@chat-' + jid.id).data('jid', jid);\n}\n$('$@chat-' + jid.id + ' input').focus();\n\
    ```\n\nThis click handler finds the JID and name of the contact. It determines\
    \ if a chat tab already exists for this contact, and if so, selects. Otherwise,\
    \ it creates a new chat tab for the contact and initializes it. Finally, the text\
    \ input box is focused so that the user can start typing. Notice that the jQuerydata\
    \ function is used to stash the JID of the contact with the <div> element. This\
    \ Jid will be needed by other code.\n\nThese newly created tabs are not very interesting\
    \ yet. You need to enable the user to send messages and update the content when\
    \ new messages are received.\n\n# Sending Messages\n\nYou should send the user's\
    \ message whenever they hit the Enter key inside the input box. Again, you can\
    \ use jQuery's event handlers to do:\n\n```\n$('.roster-input').live('keypress',\
    \ function (ev) {\n  if (ev.which === 13) {\n    ev.preventDefault();\n  }\n\n\
    \  var body = $(this).val();\n  var jid = $(this).parent().data('jid');\n\n  Gab.connection.send($msg({\n\
    \    to: jid,\n    type: \"chat\"\n  })).c(body).t(body);\n\n  $(this).parent().find('.chat-messages').append(\n\
    \    \"<div class='chat-message'>&lt;\" +\n    \"<span class='chat-name me'>\"\
    \ +\n    Strophe.nodeFromJid(Gab, connection.jid) + +\n    \"</span>&gt;<span\
    \ class='chat-text'>\" + +\n    body + +\n    \"</span></div>\");\n  );\n\n  Gab.scroll_chat(Gab.jid_to_id(jid));\n\
    }\n  $(this).val('');\n});\n```"
