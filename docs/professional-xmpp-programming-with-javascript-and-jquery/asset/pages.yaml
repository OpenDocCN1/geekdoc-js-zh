    FIGURE 2-5


    # XMPP VERSUS HTTP


    Every project benefits when the right tools are chosen to complete it. Therefore,
    it is important to know when XMPP best meets the needs of your application. You
    probably have some idea that XMPP might better suit your needs or are interested
    in exploring the protocol''s possibilities. This section attempts to point out
    where XMPP is most useful in comparison to the Web''s native protocol, HTTP.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Advantages of XMPP


    XMPP has the following advantages over HTTP, each of which are explored in detail:


    +   - Enables pushing data, not just pushing

    - Firewall friendly

    - Strong authentication and security

    - Provides many out-of-the-box tools for solving a wide range of problems


    # Pushing Data


    HTTP clients can only request data from a server. Unless the server is responding
    to a client request, it cannot send data to the client. XMPP connections, on the
    other hand, are bidirectional. Either party can send data to other at any time,
    as long as the connection is open.


    This ability to push data greatly expands the possibilities for web applications
    and protocol design. Instead of inefficient polling for updates, applications
    can receive notifications when new information is available. This not only results
    in fewer requests, but it also makes the latency between the time new information
    is available and the client is aware of this information nearly zero.


    # Pleasing Firewalls


    Some web applications support the use of HTTP callbacks, where the web server
    makes requests to another HTTP server to send data. This would be a heady feature
    to push data if it weren''t for firewalls, network address translation (NAT),
    and other realities of the Internet. In practice it is very hard to establish
    arbitrary connections to clients from the outside world.


    XMPP connections are NAT friendly because the client initiates the connection
    on which server-to-client communication takes place. Once a connection is established,
    the server can push all the data it needs to the client, just as it can in the
    response to an HTTP request.


    # Improving Security


    XMPP is built upon of TLS and SASL technologies, which provide robust encryption
    and security for XMPP connections. Though HTTP uses SSL, the HTTP authentication
    mechanisms do not see much implementation or by fewer requests. Instead, the Web
    is full of sites that have implemented their own authentication schemes, often
    badly.


    # A Bigger Toolbox


    HTTP is limited to simple request-response semantics and support for only a handful
    of operations - GET, PUT, POST, DELETE, and so on. XMPP includes three different
    low-level tools, <presence>, <message>, and <iq> stanzas, and almost 300 extensions
    that compose these tools into sophisticated protocols.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'It’s certainly possible to build many of the same constructs on top of HTTP,
    but protocol design is non-trivial. The extensions and protocols of XMPP are robust
    and widely reviewed; comparable HTTP extensions tend to be incompatible with each
    other, brittle, or primitive.


    Many XMPP tools rely on and take advantage of the ability to push data. Any HTTP
    solution to similar problems would need to re-invent much of XMPP.


    # # Disadvantages of XMPP


    Every protocol is a bag of both features and problems. In many cases XMPP is not
    the best tool for the job or suffers from some limitation. XMPP’s drawbacks include:


    +   - Stateful protocol

    - Community and deployments are not as broad as HTTP

    - More overhead than HTTP for simple chores

    - Specialized implementations still needed


    # # Statefulness


    HTTP is a stateless protocol; XMPP is stateful. Stateless protocols are easier
    to scale each server does not need to know the entire state in order to serve
    a request. This drawback of XMPP is less onerous because most non-trivial web
    applications make use of cookies, backend databases, and many other forms of stored
    state.


    Many of the same tools used to scale HTTP-based applications can also be used
    to scale XMPP-based ones, although the number and diversity of tools is more limited,
    due to XMPP’s younger age and lesser popularity.


    # # Smaller Ecosystem


    HTTP is nearly twice as old as XMPP, and as the foundation of the Web, has become
    extremely popular and well understood. HTTP’s ecosystem is bigger than XMPP’s
    in every respect as a result of this time. There are more HTTP libraries, more
    HTTP servers, and more engineers who understand HTTP than there are for nearly
    every other protocol in existence, including XMPP.


    That said, the situation exists for the C and Java programming languages compared
    to Python, Ruby, Perl, Objective-C, and others. These less popular languages are
    less capable of doing great things, and often often a better solution to many
    tasks. Many companies find that the most powerful tool gives them a competitive
    advantage over those using only the most popular tools.


    When developing XMPP applications you will come across a piece that is not implemented
    well or in a different way than you require. It is generally easy to build solutions
    to these problems, because the protocols and interactions are already defined
    and documented. It is also the case that custom implementations of XMPP extensions,
    should they be required for your project, need not implement the entire specification,
    only the parts they depend on.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# More Overhead


    XMPP is not optimized for short-lived sessions or simple requests. These are both
    areas where HTTP is a clear winner. It takes some resources to set up, maintain,
    and destroy XMPP sessions. It is perfectly capable of serving static documents,
    but unless this is in a larger context where XMPP is used, this is outside of
    XMPP''s sweet spot.


    For longer or more sophisticated interactions, the XMPP overhead is negligible
    compared to an HTTP solution. Any HTTP solution would also need to support state,
    push notifications, and the features that make XMPP so interesting. HTTP-based
    solutions for similar problems are starting to appear, the XMPP one tends to be
    more mature and optimized.


    # Specialized Implementations


    It used to be that Apache web server was all needed to build web applications.
    These days, companies are building their own specialized systems to process web
    requests in order to oke performance improvements and response times.


    XMPP is just entering its golden age of applications and development, and companies
    haven''t had much time to spend building XMPP servers and libraries for specific
    needs. Most XMPP servers are designed around typical IM use cases, although many
    can be stripped down and put to other uses.


    Most of your application will not be so demanding as to need specialized implementations
    to power it. Over time, the community of application developers pushing XMPP to
    its limits will follow the HTTP community''s example and develop specialized tools
    focused on performance and massive scale.


    # BRIDGING XMPP AND THE WEB


    Even though several browsers are experimenting with features that use XMPP, none
    of the major browsers currently provide built-in support for the XMPP protocol.
    However, by using some programming and a little server-side help, you can tunnel
    XMPP sessions over HTTP connections efficiently and effectively.


    The technology that enables this efficient tunneling is called HTTP long. Coupled
    with a simple HTTP-based management protocol and an XMPP connection manager, it
    is possible to bring XMPP, and all its charms, into HTTP-speaking applications.


    # Long Polling


    Early web pages that wanted to provide access to live, changing data used page
    refreshes at intervals. This blunt method works well when the data is constantly
    changing; for example, many sites used refreshed for live blogging news.


    Microsoft eventually released an API within Internet Explorer called XMLHttpRequest,
    which allowed JavaScript in web pages to make requests and process the data returned
    without reloading the page. This API eventually found its way into all major browsers,
    and programmers'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'began to pick up and make use of this handy tool. This technique was eventually
    given the name

    AJAX, for Asynchronous JavaScript and XML.


    With AJAX, it is possible to update data without refreshing the entire page. This
    increase in efficiency

    paid dividends, and everything becoming more dynamic and responsive.


    Even with AJAX, data was still being requested, or polled, at timed intervals.
    If you''ve ever worked

    under an unbearable boss asking "is the software done yet?", you have experienced
    polling. Polling

    servers cannot get annoyed or angry, they can be crippled if too many clients
    poll too fast; you get

    less done if someone is constantly distracting you. However, to get quick updates,
    the polling interval

    to be quite small; the lowest latency is the benefit of the polling interval.


    Another issue with polling is that most requests do not receive new data. In order
    to see these

    within a reasonable time frame of when they occur, the polling interval must be
    quite short, but the

    actual data may not change often. Just as with your (hopefully fictional) overbearing
    employer,

    server''s answer to "is the software done yet?" is usually "not yet."


    Some clever folks discovered a neat trick to solve this problem. Instead of answering
    the request

    immediately, they can hang on it for some period of time if no new data is received.


    For example, if there is new data on the server, the server answers immediately.
    If there is not

    new data, the server keeps the connection open, holding any reply. If new data
    arrives, it

    sponds to the request. If no new data arrives after some period of time, the server
    can send back

    an empty response, so not to hold open many connections at once. Once a result
    is returned, the

    client immediately sends a new one, and the whole process starts.


    Because each polling is potentially open for a long period of time, this technique
    is called

    long polling. It has many advantages over normal polling.


    The client receives new data the moment it becomes available, because it always
    has at least one con-

    ection and waiting for an update from the server. By setting the length of the
    poll to something

    high, the total number of requests the server has to handles reasonable, even
    though the

    latency of the updates is minimized. Users see instances in data, and server operators
    don''t

    broke trying to use out their systems; everybody.


    The only real change is that instead of the client waiting to resent the request,
    the server waits

    it has something to say before it responds.


    Multiple libraries and protocols have been designed to take advantage of long
    polling, but XMPP

    s is one of the oldest implementations. In XMPP, this bridge is BOSH, for Bidirectional
    streams

    Over Synchronous HTTP. You may also have heard of Comet or reverse HTTP, which
    are protocols

    built on the same technique.


    One drawback is that the server needs to be a little smaller in order to deal
    with these long polling

    requests, and that is where a connection manager comes in.


    # Managing the Connection


    XMPP connections for arbitrarily long periods of time, but HTTP requests are quite
    short.

    A connection manager maintains an XMPP connection for a third party and provides
    access to the

    connection via the HTTP long polling technique.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# CHAPTER 2 DESIGNING XMPP APPLICATIONS


    The browser and the connection manager communicate over HTTP using a simple protocol
    called BOSH. Essentially, BOSH helps an HTTP client establish a new XMPP session,
    which transports stanzas back and forth over HTTP wrapped in a special <body>
    element. It also provides some security features to make sure that XMPP sessions
    can''t easily hijacked. The connection manager communicates with an XMPP server
    as if it were a normal client.


    In this way, an HTTP application can control a real XMPP session. Because of the
    efficiency and low latency suffered by the long polling technique, the end performs
    quite well, outlying native connections.


    It may seem like a lot of effort to get XMPP into a browser, but not only this
    work well in practice, it turns out this technique even has some advantages over
    direct XMPP connections:


    +   Interactions with the connection manager are requested by request, which allows
    the client to move from network to network. The managed connection stays available
    even if the end user''s IP address changes several times.


    +   Because one failing request doesn''t terminate the managed connection, these
    managed sessions are extremely robust and tolerant of network failure.


    +   Because connection managers cache and resent data for a request, you don''t
    have to worry about losing data when your connection is interrupted.


    +   HTTP is extremely firewall friendly, and most connection managers run on standard
    HTTP ports, managed connections still work well in limited network environments
    that don''t allow anything but HTTP.


    These advantages make managed connections a perfect fit for some scenarios, as
    far as even direct XMPP communication is possible.


    # Making JavaScript Speak XMPP


    With HTTP long polling, you have the technology for low-latency data updates from
    a server. Combining with this connection manager gives you a way to send and receive
    XMPP data over a series of HTTP requests. The last piece of the puzzle is making
    this easy to JavaScript, the Web''s native programming language.


    The Strophe library was created to make programming XMPP applications in JavaScript
    as easy as in any other language, hiding all the details of the managed connection.
    As far as Strophe''s users are concerned, it acts as if they are working with
    a native XMPP connection just as they would in any other environment.


    Long polling applications have some special requirements compared to normal AJAX
    applications. Most AJAX libraries do very little error handling because the number
    of AJAX requests that fail is a small percentage. Unfortunately for XMPP applications,
    any failed request can result in a huge increase in latency and a tarnished user
    experience. For this reason, Strophe handles many errors as it gracefully and
    uses early timeouts to detect problems before they would otherwise be discovered.'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'These features make Strophe quite reliable and high-performance, even in the
    face of unavoidable, occasional errors. Strophe''s users have frequently reported
    their applications can live for days with-out being disconnected.


    # MAKING XMPP APPLICATIONS


    The XMPP protocol is a good choice for a variety of application domains, and you''ve
    seen some technical details on how XMPP can be used from the Web. Now it''s time
    to learn a few details about making XMPP applications before you embark on your
    first application in the next chapter.


    # The Browser Platform


    The web browser is probably the most deployed and used application platform that
    has ever existed. Web browsers exist on every kind of computer and even many mobile
    phones, and more importantly, the users of these devices tend to be very familiar
    with the browser and web applications.


    As and more sophistication has been demanded of web applications, new technologies
    and abstractions have been created to evolve the platform. XMPP brings yet another
    set of technologies and abstractions, but with it carries enormous potential for
    real-time, interactive, and collaborative applications. The rise of the Web has
    given rise to social applications, and if developers want to take more steps towards
    the human race, technologies like XMPP will help them do it.


    For XMPP developers, targeting the web browser as a platform makes enormous sense.
    Web applications are cross-platform, easily deployable, and with a large user
    base already familiar with them. More than that, web technologies make heavy use
    of HTML, and it is often the case that tools for manipulating HTML work well on
    XML, and therefore, on XMPP.


    One tool, familiar to many web developers, is the jQuery library; jQuery makes
    many manipulations of HTML and CSS easy and fun. This power is also much equally
    applicable to XML data, because it shares a very similar structure. This book''s
    applications use jQuery to process and manipulate both the user interface, a combination
    of HTML and CSS, and the incoming XMPP data.


    Web technologies have their warts, but from a practical standpoint, both developers
    and XMPP developers could scarcely ask for a better platform on to create new
    and wonderful things.


    # Basic Infrastructure


    Just as web applications often need a web server and an application server or
    framework, XMPP applications require require some basic infrastructure. An XMPP
    connection requires an XMPP server and, often, an account on that server. An XMPP
    application also needs to communicate with a connection manager, because browsers
    don''t speak XMPP natively. Finally, the services applications will need to be
    provided by the XMPP server.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'The XMPP server requirement is not a very difficult one. It is easy to download,
    install, and run an XMPP server on nearly any platform, and there are several
    to choose from. You can also make use of public XMPP servers that a user may already
    have an account on, although this depends on the amount of data your application
    uses; many public XMPP servers are optimized for traffic and will limit high-throughput
    counts.


    Many users have XMPP accounts, thanks to the efforts of Google, Livejournal, forwarding
    ISPs, and other large organizations. If you run your own server and require users
    to register there, it is generally easy to programmatically create XMPP accounts
    from a normal web application back end.


    All major XMPP servers come with built-in support for HTTP-managed connections,
    and BOSH support. It is a matter of altering a configuration file to turn this
    on, if it is not enabled by default. If you want to allow users to connect to
    XMPP servers, you will need a standalone connection manager. Please see Appendix
    B for more information on using and configuring managers.


    Each XMPP server supports a core of functionality as well as a number of XMPP
    extensions. Generally the extensions are documented on the XMPP server''s website.
    Most servers support the mature and popular extensions such as multi-user chat
    and pub-subscribe. If your application makes use of XMPP extensions, be sure to
    check that your server supports these extensions.


    Many XMPP applications can be realized without any special application servers
    or other infrastructure. The applications in this book are all self-contained
    and designed to be run on publicly available XMPP servers. A connection manager
    is also provided for your development purposes, so you need not set up one while
    you work through the applications in the book.


    # Protocol Design


    Unless you are creating a new and better version of an existing XMPP service,
    like multi-user chat or the traditional IM functions, you will probably be doing
    some protocol to realize your vision. XMPP provides a lot of tools to build on,
    and the simple composition of these tools is enough to satisfy the needs of most
    applications. The following guidelines have influenced the applications in this
    book and may help you in your own protocol designs.


    # Compose Existing Protocols


    If your application can be implemented with the composition of protocol extensions,
    it is often best to do so. With almost 300 such published extensions, there is
    usually a good starting point available.


    Even if the particular extensions used do not have implementations, it is far
    easier to implement a protocol than to do one from scratch. The extension''s authors
    have already been thinking about the problem domain with enough gusto to drive
    them to document a solution. Furthermore, XMPP extensions are a community effort,
    and your feedback will help improve the extension for everyone.


    For a concrete example, consider the game developed in Chapter 11. One possible
    solution is to create a new protocol for all game interaction. Instead, the application
    game semantics on top of'
  merge: -1
  pgno: 59
- img_proc: true
  md: "multi-user chat rooms. This involves a small amount of protocol design to handle\
    \ the game-specific content, and reuses a large amount of work from a well-tested,\
    \ extension.\n\nUsing protocol composition saves work, and it makes new protocols\
    \ much easier to understand by others. To understand your new protocol, they need\
    \ only understand how the pieces fit together and possibly a few small, new things.\n\
    \n# Keep It Simple\n\nKeeping it simple is excellent advice in nearly every domain,\
    \ and it equates equally to XMPP protocol design. If you do have to create something\
    \ completely new, try to do it as simple as possible.\n\nNot only will your protocol\
    \ be easier to understand, the lack of complexity will result in fewer bugs and\
    \ development time. Usually a complex protocol is a sign that a simpler path has\
    \ been overlooked.\n\nMany XMPP extensions are themselves extended to address\
    \ new use cases. It is not necessary nor is desirable, to pack every feature that\
    \ may be needed into the protocols at the beginning. In fact, many of the more\
    \ complex extensions end up getting split into a core and several related extensions\
    \ once they get large.\n\n# Avoiding Presence Extension\n\nThe <presence> stanza\
    \ can often be the largest factor in a server's traffic. Most <presence> stanza\
    \ extensions are not applicable to the general case. Instead of extending <presence>\
    \ directly, it is a best practice to use the Personal Eventing Protocol, or PEP,\
    \ defined in XEP-0163, which allows users to subscribe to the extra data they\
    \ are interested in.\n\n PEP extension, along with Entity Capabilities (XEP-0114)\
    \ and Service Discovery (XEP-0015), providing extended presence-type information\
    \ and opt-in.\n\nOther stanzas do not require similar optimizations, because they\
    \ are not normally broadcast to many people at once.\n\n# Participate in the Community\n\
    \nThe XMPP community contains numerous individuals with protocol design experience,\
    \ and they are generally quite friendly. You may also want to document and submit\
    \ your new protocol as an XMPP extension if you think it would be generally useful.\
    \ Beyond your own applications, it can be very helpful to get the community's\
    \ feedback on your designs.\n\nDesign discussions normally take place on the standards\
    \ list, which you can subscribe to by visiting the discussion pages at the XSF\
    \ web, http://xmpp.org/about/discuss.shtml. Feel free to ask questions, share\
    \ your protocol ideas, and contribute to the discussion and feedback of other\
    \ protocols. The community always welcomes new members.\n\nShould you want to\
    \ submit your protocol as an official extension, you will want to document it\
    \ in the XEP format using the template and guidelines provided at the extension\
    \ submission page, http://xmpp.org/extensions/submit.shtml. New extensions will\
    \ be considered by the XSF"
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Council for acceptance. The requirements for acceptance are simply that the
    extension is generally useful and not covered by existing work.


    You can also join the XSF as a member; the XSF is an open organization, run by
    its membership. Elections are held every quarter, and the XSF is always looking
    for new members, whether they are developers or just enthusiasts. See the membership
    page, http://xmpp.org/xsf/members/, for more information.


    # SUMMARY


    In this chapter, you learned why XMPP is often the best tool for the job and how
    it is different from HTTP. You also discovered how XMPP can be made to work in
    the HTTP-only world of web browsers and how XMPP applications are built.


    Along the way, the following topics were covered:


    +   - Inspiring examples of the XMPP applications of others

    - The pros and cons of XMPP versus HTTP

    - HTTP long polling

    - Managed XMPP connections (BOSH)

    - The Strophe library

    - Required infrastructure for XMPP applications

    - How to design XMPP protocols


    In the next chapter, you will finally begin your XMPP development career by creating
    your first application.'
