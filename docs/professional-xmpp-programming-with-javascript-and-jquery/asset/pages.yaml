- img_proc: true
  md: "The handlers for normal events get passed a single argument, the event object.\
    \ The on_click() handler here demonstrates this:\n\n```\nfunction on_click(ev)\
    \ {\n  // handler code\n}\n```\n\nIf trigger() is passed some data as its second\
    \ parameter, this data will be passed along to the handler in the second parameter:\n\
    \n```\nfunction on_new_contact(ev, data) {\n  // add the new contact\n}\n```\n\
    \n# Convenience Event Methods\n\nTo save typing and readability, jQuery supplies\
    \ several convenience methods for working with common DOM events.\n\nMost DOM\
    \ events have a corresponding method in jQuery with the same name as the event.\
    \ For example, the click() method triggers the click event. When these methods\
    \ are invoked without arguments, the corresponding event is triggered, but when\
    \ passed a function as the argument, it bind a new handler for the event. The\
    \ example from the previous section for a button's click event can be rewritten\
    \ as:\n\n```\n$('#go_button').click(function () {\n  // do something here\n});\n\
    ```\n\nThe methods provided by jQuery include keypress(), keyup(), keydown(),\
    \ mouseup(), mousedown(), mousemove(), click(), load(), and ready().\n\n# The\
    \ Document Ready Event\n\nThe document ready event is somewhat special. This event\
    \ fires soon as the DOM is available to be accessed and manipulated by JavaScript\
    \ code. Most initialization and startup code for web applications is generally\
    \ put in a handler for the document ready event.\n\nTo bind a handler to the document\
    \ ready event, you can use either:\n\n```\n$(document).bind('ready', function\
    \ () {\n  // init code here\n});\n```\n\nor:\n\n```\n$(document).ready(function\
    \ () {\n  // init code here\n});\n```"
  merge: -1
