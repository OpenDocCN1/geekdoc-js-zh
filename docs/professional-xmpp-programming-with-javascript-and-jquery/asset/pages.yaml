  md: '# CHAPTER 10 WRITING WITH FRIENDS: A COLLABORATIVE TEXT EDITOR


    In this case, prefixes are more verbose than changing the default namespace. However,
    if the children of the `<pubsub:event>` were replaced with elements under the
    `<jabber:client>` namespace, the use of prefixes would be an improvement. This
    is why the `<stream:stream>` element of an XMPP stream is prefixed; most of the
    elements it belongs to a different namespace.


    Note that changing the default namespace and using prefixes can be in the same
    element; in fact, this is exactly what the `<stream:stream>` element does:


    ```

    <stream:stream xmlns=''jabber:client''

    xmlns:stream=''http://etherix.jabber.org/streams''

    version=''1.0''

    from=''pemberley.lit''

    id=''893ca01f5ff22c2499984e9b7e8af''

    xml:lang=''en''>

    ```


    # Extended Attributes


    Extended attributes can also be created, but these are rarely used in protocol
    extensions. Attributes are treated somewhat differently in XML elements; an attribute
    with no prefix does not belong to the default namespace, but to the element in
    which it appears. What interpretation element gives to an attribute is application
    definition. For this, it is suggested that only prefixed attributes be used for
    extending XMPP.


    Prefixed attributes work very similarly to prefixed elements, and the prefix must
    be defined in the same manner as prefixed elements. The following example uses
    a prefixed attribute on a message-<body> element to add an explicit emotion to
    the text:


    ```

    <message to=''darcy@pemberley.lit''

    from=''elizabeth3@longbour.lit/ballroom''

    <body>body=''emotion:annoyed'' xmlns:emote=''http://metajack.im/ns/emote-0''>

    I cannot talk of books in a ball-room; my head is always full of

    sothing else.

    </body>

    </message>

    ```


    You could easily have made the emotion attribute an element instead, perhaps so
    the emoticon could pertain to the stanza, not just the <body> element. Indexed
    elements are the preferred way to extend XMPP. Few protocol extensions use attributes,
    but especially if you ever need it. For an example of in real-world use, see SOAP
    over XMPP in XEP-0072.


    One prefix is defined—xml—and this prefix is often used to add attributes to various
    XMPP elements. In addition, you will see any prefix beginning with "xml" (or "XML",
    "XML", and so on) is reserved. Most often you will see the `xml:lang` attribute
    used to designate which language is used. For example, you could send a message
    with two <body> elements, each with a different `xml:lang` value. Unlike other
    prefixes, the `xml` prefix does not need to be defined; it is implicitly defined
    in XML, as is the `xmlns` attribute.'
