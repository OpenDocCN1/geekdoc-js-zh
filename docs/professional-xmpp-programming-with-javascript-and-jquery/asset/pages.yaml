  md: "You can create a new Strophe.Connection object just as you would any other\
    \ JavaScript object, by using the new keyword:\n\n```\nvar conn = new Strophe.Connection(\"\
    http://bosh.metajack.im:5280/xmpp-httpbind\");\n```\n\nOnce you have a connection\
    \ object, you can connect() and disconnect() to start and end communication with\
    \ the server:\n\n```\n// starting a connection to example.com\nconn.connect(\"\
    user@example.com\", \"password\", my_callback\\);\n\n// disconnecting\nconn.disconnect();\n\
    ```\n\nThe first two parameters to connect() are the JID and password to use to\
    \ authenticate the session, and the last parameter is the callback function discussed\
    \ earlier. The callback will be called with a single parameter that is set to\
    \ one of the statuses described in the previous section. A simple callback function\
    \ that disconnects the connection reaches the CONNECTED phase is shown here:\n\
    \n```\nfunction my_callback(status) {\n  if (status === Strophe.Status.CONNECTED)\
    \ {\n    conn.disconnect();\n  }\n}\n```\n\nEvery time the connection changes\
    \ its status, this callback function is executed. The my_callback() function simply\
    \ ignores any status but the CONNECTED status, and disconnects once the connection\
    \ has reached that status.\n\nThere's not much work involved to start and stop\
    \ connections. You can use this new knowledge to implement the login dialog box\
    \ for Hello.\n\n# Connecting Hello\n\nTo establish a connection, you must first\
    \ gather the user's credentials. The login dialog box exists for this purpose,\
    \ but it is initially hidden and needs to be created and shown. You can use jQuery\
    \ UI's dialog() function to show and hide this dialog box and use custom events\
    \ to start the connection using Strophe.\n\nThe dialog() function is called on\
    \ the elements that you want to convert into dialog boxes and takes a list of\
    \ properties defining how the dialog boxes behave. Most of the properties used\
    \ won't be fully explained here, but their functions are fairly obvious from their\
    \ queries. All properties are fully explained in the jQuery documentation at http://ui.jquery.com/.\n\
    \nCreate the hello.js file and add the following code to it:\n\n```\n$(document).ready(function\
    \ () {\n  $('#login_dialog').dialog({\n    autoOpen: true,\n    draggable: false,\n\
    \    modal: true,\n    title: 'Connect to XMPP',\n```\n\n![](img/eb420c48595351b731631bccf1c8fdc4_74_0.png)"
  merge: -1
  pgno: 74
- img_proc: true
  md: "```\nbuttons: {\n  \"Connect\": function () {\n    $(document).trigger('connect',\
    \ {\n      jid: $(\\#jid).val(),\n      password: $(\\#password).val()\n    });\n\
    \n    $(\\#password).val('');\n    $(this).dialog('close');\n  }\n}\n};\n```\n\
    \ncode snippet hello.js\n\nThe most important property is buttons, which defines\
    \ the dialog box's buttons and the actions to take when those buttons are clicked.\
    \ A single button is defined here called Connect. When the Connect button is triggered,\
    \ a custom event called connect is triggered, and the JID and password are passed\
    \ along to the event handlers. When the event has triggered, the password field\
    \ is cleared and the dialog box is closed. When the function for the Connect button\
    \ is executed, this object will be set to the dialog's main element, #login_dialog.\
    \ You can wrap this with jQuery to easily access the dialog's other methods, close,\
    \ as is done in the preceding code.\n\nNext, you will need to create a handler\
    \ for the connect event that creates a new Strophe. Connection object calls the\
    \ connect() method. You will also need to provide a callback that can respond\
    \ to changes in the connection status.\n\nAdd the following custom event handlers\
    \ to the document ready function you wrote:\n\n```\n$(document).bind('connect',\
    \ function (ev, data) {\n  var conn = new Strophe.Connection(\n    'http://bosh.metjak.im:5280/xmmpp-http-bind');\n\
    \  );\n  conn.connect(data.jid, data.password, function (status) {\n    if (status\
    \ === Strophe.Status.CONNECTED) {\n      $(document).trigger('connected');\n \
    \   } else if (status === Strophe.Status.DISCONNECTED) {\n      $(document).trigger('disconnected');\n\
    \    }\n  });\n});\n```\n\n```\n$(document).bind('connected', function () {\n\
    \  // nothing here yet\n});\n```\n\n```\n$(document).bind('disconnected', function\
    \ () {\n  // nothing here yet\n});\n```\n\ncode snippet hello.js"
