  md: "Please refer to the documentation for information on the specific configurations\
    \ shown here or for information on more advanced uses. You can find the documentation\
    \ at http://haproxy.eu/download/1.3/doc/configuration.txt.\n\n# Clustering XMPP\
    \ Servers\n\nSeveral XMPP servers support clustering. In a clustered configuration,\
    \ several instances of the XMPP server provide services for a single XMPP domain.\
    \ For example, the pemberley.lit could resolve to a group of 10 clustered servers,\
    \ no matter which server was selected by a user, it would appear as pemberley.lit.\n\
    \nEach XMPP server has its own configuration requirements for clustering. In this\
    \ section, you see an example of how to cluster an ejabber server on two separate\
    \ machines. You can obtain and learn more about ejabber at http://www.ejabber.im.\n\
    \nNext, you need to install ejabber on two separate machines. For this example,\
    \ it is assumed that these machines are named pemberley-1.pemberley.lit and xmpp-2.pemberley.lit,\
    \ and that both provide an XMPP service for the pemberley.lit domain. Please refer\
    \ to the ejabber documentation for basic installation instructions.\n\nYou must\
    \ edit the ejabber.cfg configuration file to configure both machines.\n\nFirst,\
    \ you must change the ejabber's hostname to the correct domain; in this case it\
    \ will be pemberley.lit. This should be the same on both xmpp-1.pemberley.lit\
    \ and xmpp-2.pemberley.lit. Find the line similar to the following, and change\
    \ the domain to pemberley.lit:\n\n```\nhosts, [\"pemberley.lit\"]\n```\n\nNext,\
    \ you can make any other normal configuration changes, just as you normally would\
    \ for a single server.\n\nNow you can start the XMPP server on xmpp-1.pemberley.lit.\
    \ Just run: \n\n```\nejabberctl start\n```\n\nYou can check if the server is started\
    \ correctly by running: \n\n```\nejabberctl status\n```\n\nAfter a few seconds\
    \ is running, it creates an Erlang cookie file. You need to make sure the Erlang\
    \ cookie files on both machines match. ejabber's Erlang cookie is named .erlang.cookie\
    \ and can be found along with ejabber's other data files. On UNIX-like systems,\
    \ including Mac OS and GNU/Linux, it usually be found in the /var/lib/ejabber\
    \ directory. Simply copy the cookie file from xmpp-1.pemberley.lit to the same\
    \ location on xmpp-2.pemberley.lit.\n\nBefore you start this node, you must first\
    \ initialize the cluster's database on this node. This step can be a little tricky\
    \ depending on how you have named your ejabber nodes. By default, ejabber uses\
    \ short names, but you can also use the fully qualified domain names if configured.\
    \ The command is slightly different for each case, and the one shown here is for\
    \ the default setup."
