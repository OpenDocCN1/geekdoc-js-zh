    \ be more than sufficient, but occasionally cnode() is useful for copying or reusing\
    \ already built pieces of stanzas.\n\nBecause these methods return the builder\
    \ object, they can be chained:\n\n```\nvar stanza = $build(\"foo\").c(\"bar\"\
    ).c(\"baz\");\n```\n\nCalling toString() would result in:\n\n```\n<foo><bar>baz</bar></foo>\n\
    ```\n\nEach time you add a child, the current element in the builder changes to\
