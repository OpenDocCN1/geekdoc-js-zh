  md: '# flXHR


    The flXHR library is located at http://flxhr.flensed.com. This library provides
    cross-domain request support for Strophe and is enabled via a special Strophe
    plug-in. You will need at least version 1.0.4 of flXHR, but a later version should
    work fine.


    Once you''ve downloaded flXHR and uncompressed it


    Enabling flXHR in your application is as easy as loading two additional JavaScript
    files:


    ```

    <script src="scripts/flXHR.js"></script>

    <script src="scripts/strophe.flXHR.js"></script>

    ```


    The first script, flXHR.js, loads the flXHR library. The second script is a special
    Strophe plug-in that enables Strophe to use flXHR for cross-domain requests.


    # XMPP Accounts


    If you don''t already have an XMPP account, you can create one of the many public
    XMPP servers. There is a long list of these public XMPP services at http://xmpp.org/services/.
    The jabber.org server is always a popular choice, and you can create an account
    there by visiting http://register.jabber.org.


    Please note that if you have an existing XMPP account, most XMPP accounts are
    normally provided for typical instant messaging. Each server may have different
    sets of features enabled, so you will need to make sure your server supports the
    features needed for the application you are building. The jabber.org server supports
    all the functionality needed in this book, for example.


    You should now have all the libraries you need to start building XMPP applications
    as well as an XMPP account to use with these applications. It''s time to start
    building something!


    # STARTING YOUR FIRST APPLICATION


    All the applications in this book consist of an HTML file, a CSS file, and one
    or more JavaScript files in addition to the required libraries discussed in the
    previous section. The HTML and CSS files make up the user interface of the application
    and include the dialog boxes used, the controls the user interacts with, and the
    styling information for making those elements attractive. The main focus of your
    attention will be on the JavaScript files, which contain all the application''s
    code.


    # User Interface


    Each chapter begins with the basic HTML and CSS layouts for the application. During
    a chapter, new things may be added to these files, but for the most part, the
    initial HTML and CSS are all the final versions.'
