  md: "# 76 | CHAPTER 4 EXPLORING THE XMPP PROTOCOL: A DEBUGGING CONSOLE\n\nNow you\
    \ must also reset the background color code once the user starts to correct his\
    \ mistake. You can use a keypress event handler to do this. The following code\
    \ should be added to the document ready handler:\n\n```\n$('#input').keypress(function\
    \ () {\n  $(this).css({backgroundColor: '#fff'});\n});\n```\n\nPeek is now a working\
    \ XMPP debugger!\n\n# Making Input Easier\n\nTyping all the XML by hand can be\
    \ a tiresome thing, Strope compensates for this by having the easy-to-use Builder\
    \ object and its helper functions, $msg(), $spres(), and $iq(). It's easy to extend\
    \ Peek to use user input to produce code as XML, making their life much easier\
    \ if they know a little JavaScript.\n\nFirst, you must detect if the input is\
    \ code. The easiest way to do this is to look at the first character. If it is\
    \ <, then it looks like XML; if it is $ it looks like like one of the three Builder\
    \ object helper functions. If the user's input looks like code, you can use JavaScript's\
    \ eval() function to execute it.\n\n```\n$('#send_Button').click(function () {\n\
    \  var input = $('#input').val();\n  var error = false;\n  if (input.length >\
    \ 0) {\n    if (input[0] === '<') {\n      var xml = Peek.text_to_xml(input);\n\
    \      if (xml) {\n        Peek.connection.send(xml);\n        $('#input').val('');\n\
    \      } else {\n        error = true;\n      }\n    } else if (input[0] === '$')\
    \ {\n      try {\n        var builder = eval(input);\n        Peek.connection.send(builder);\n\
    \        $('#input').val('');\n      } catch (e) {\n        error = true;\n  \
    \    }\n    } else {\n      error = true;\n    }\n  }\n  if (error) {\n    $('#input').animate({backgroundColor:\
    \ \"#faa\"});\n  }\n});\n```"
