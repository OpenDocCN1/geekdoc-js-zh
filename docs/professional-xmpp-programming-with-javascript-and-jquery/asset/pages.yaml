    FIGURE 7-1


    On the left is the service tree for a given entity. The panel on the right displays
    information about the selected item. The user can input the entity for which query
    services at the top of the application.


    The tree shown in Figure 7-1 is just part of the service tree for jabber.org’s
    multi-user chat server at conference.jabber.org.


    # DIG DESIGN


    Dig must make two kinds of service discovery queries to an entity — disco#info
    and disco#items. The hash character in their name is taken from their underlying
    namespace. A disco#info query returns basic identity information and supported
    features for an entity. Disco#items queries enumerate an entity’s children.'
  merge: -1
  pgno: 171
- img_proc: true
  md: "Once users input an entity they want to view, both types of queries are run,\
    \ and the results begin to form a tree in the left pane. Clicking leaves of the\
    \ tree results in further service queries and further expands the tree. Results\
    \ from disco#info queries appear in the right information pane, and disco#items\
    \ query results are used to expand the tree.\n\nThe application's UI is quite\
    \ simple, but the amount of information the user can learn about XMPP services\
    \ and servers is immense.\n\n# FINDING INFORMATION\n\nService discovery, defined\
    \ in XEP-0030 and often called disco, consists of a hierarchy of information relating\
    \ to an entity or service and a pair of queries, disco#info and disco#items, to\
    \ request and traverse the tree, respectively.\n\n# Disco#info Queries\n\nMost\
    \ XMPP entities you will interact with will respond to disco#info queries. Generally,\
    \ these queries are concerned with two kinds of information: identity and features.\
    \ Identity information contains the entity's name and purpose, and some services\
    \ may have multiple identities. Feature information is useful to discover which\
    \ particular features a service supports. For example, a publish-subscribe service\
    \ may report that it supports all some of the optional features defined in the\
    \ Publish-subscribe specification (XEP-0060) and that it supports several other\
    \ extensions.\n\nDisco#info queries are extremely simple. They consist of an IQ-get\
    \ stanza using the http://jabber.org/protocols/disco#info namespace:\n\n```\n\
    <iq to='permberley.lit'\nfrom='elizabeth@longbourn.lit/lambton'\ntype='get'\n\
    id='info'\n<query xmlns='http://jabber.org/protocol/disco#info'>\n</n</iq>\n```\n\
    \nIn this example, Elizabeth is probing the permberley.lit server for information.\
    \ This server responds with a list of identities and features:\n\n```\n<iq to='elizabeth@longbourn.lit/lambton'\n\
    from='permberley.lit'\ntype='result'\nid='info'\n<query xmlns='http://jabber.org/protocol/disco#info'>\n\
    \  <identity name='Pemberley XMPP Server'\n    category='server'\n    type='im'/>\n\
    \  <feature var='http://jabber.org/protocol/disco#info'/>\n  <feature var='jabber:client'/>\n\
    \  <feature var='jabber:iq:roster'/>\n</iq>\n```"
  merge: -1
