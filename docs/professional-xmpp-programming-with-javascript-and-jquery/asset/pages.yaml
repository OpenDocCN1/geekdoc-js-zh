  md: "# PROXiescript SECURITY POLICY\n\nJavaScript is subject to numerous restrictions\
    \ when run inside a web browser. These are the same origin policy, which restricts\
    \ JavaScript from making HTTP connections to the same server from which the application\
    \ is loaded. If the index.html file for your application is served from example.com\
    \ on port 80, the JavaScript code can only make requests to that same domain and\
    \ port.\n\nAJAX libraries like jQuery have partial workarounds for this restriction,\
    \ but these only help if you need to make GETs and the remote server can return\
    \ data in the special JSON-format post. Unfortunately, BOSH requests are made\
    \ with HTTP POST, and the data sent and received in XML, these workarounds won't\
    \ help.\n\nOne solution to this problem is to use JavaScript's cross-domain abilities\
    \ to make the HTTP connections, and this approach is used for the applications\
    \ in this book by strope's fxHR plugin-in. Another solution is to use a reverse\
    \ proxy to make a URL local to the application's server proxy make BOSH service.\
    \ To JavaScript, the requests are made to the same server, but over the backend,\
    \ the data is actively being sent by the web server to a remote service and then\
    \ the responses are forwarded back to the proxy.\n\n# Cross-Domain Requests with\
    \ Flash\n\nJust like JavaScript, Flash has a strict security policy, unlike JavaScript,\
    \ it allows cross-domain requests to be sent to domains that permit such requests.\
    \ Flash checks for permission by requiring a special configuration file at the\
    \ target domain, crossdomain.xml.\n\nThe crossdomain.xml must reside in the root\
    \ directory of the website to which your application needs to make a cross-domain\
    \ request. For example, if your application is hosted at http://pemberley.lit\
    \ and needs to access the connection manager at http://longbour.lit:5280/xmpp-httpbind,\
    \ then Flash will search the file http://longbour.lit:5280/crossdomain.xml for\
    \ permission to make the needed cross-domain requests. If a crossdomain.xml file\
    \ is found and contains the appropriate configuration, the requests will be allowed.\n\
    \nTo enable a BOSH connection manager to serve Archie-based clients, you will\
    \ need to serve a permissive crossdomain.xml such as the one shown in Listing\
    \ B-1. Note that this files allow cross-domain requests from any domain. If this\
    \ policy is not right for your application, you can use a more restrictive configuration.\
    \ See http://www.adobe.com/devnet/articles/crossdomain_policy_spec.html to learn\
    \ more about how to craft custom crossdomain.xml files.\n\n+   LISTING B-1: crossdomain.xml\n\
    \n```\n<!DOCTYPE cross-domain-policy SYSTEM\n  * \"http://www.macromedia.com/xml/dtds/cross-domain-policy.dtd\"\
    >\n<cross-domain-policy>\n```\n\n<!-- Cross domain policy file for allow everything.\
    \ If you need more\n\ncontinues\n\n![](img/eb420c48595351b731631bccf1c8fdc4_460_0.png)"
  merge: -1
  pgno: 460
- img_proc: true
  md: '# 436 | APPENDIX B SETTING UP BOSH CONNECTION MANAGER


    information on these, please see:

    http://www.adobe.com/devnet/articles/crossdomain_policy_file_spec.html


    ```

    ---->

    <site-control permitted-cross-domain-policies="all">

    <allow-access-from-domain="*" />

    <allow-http-request-headers from domain="*" headers />

    ```


    # Serving crossdomain.xml with Punjab


    Punjab''s default pun own configuration file includes support for serving static
    content. By default it makes the html subdirectory of the directory in which it
    runs accessible via HTTP.

    to serve crossdomain.xml, just place the file in the html directory. You can verify
    that it is working by visiting http://bosh.example.com:5280/crossdomain.xml if
    your Punjab server is running at bosh.example.com on port 5280.


    # Serving crossdomain.xml with ejaberd


    The ejaberd server also includes support for serving static content with its mod_http_fileserver
    module. You can enable this module and add the appropriate request handler in
    ejaberd''s configuration file.


    First, add the following line within the modules section:


    ```

    {mod_http_fileserver, ({docroot, "path/to/html"}

    (content_types, (["*.xml", "text/xml"])))}

    ```


    The droroot option provides a path where ejaberd will look for static files to
    serve. The content types option just adds the appropriate text/xml content type
    to the list of known types. This is needed because ejaberd does not include this
    particular mapping by default.


    Now that the module is loaded, you will need a new request handler to tell ejaberd
    how and where to serve static files. Modify the ejaberd_http section of the configuration
    file to look like this:


    ```

    (5280, ejaberd_http, [

    web_admin,

    request_handlers, [[(xmppp-httpbind,

    mod_http_bind),

    {1, mod_http_fileserver}]]

    ])

    ```


    The bolded line shows the new request handler, which serves the configured document
    root at the root of ejaberd''s web service.


    All that is left is to put the crossdomain.xml file in the document root. Once
    that is in the right spot, you can check that everything is working by visiting
    http://example.com:5280/crossdomain.xml, replacing example.com with the name of
    your server.'
  merge: -1
