  md: "The last steps cause the server to send presence probes to contacts for whom\
    \ the user has a presence subscription. These probes will result in a <presence>\
    \ stanza sent back to the user for each contact that is online.\n\nGab will need\
    \ to replicate this sequence of actions and handle the resulting roster data and\
    \ presence updates. First, you will hook the login dialog box, just as you did\
    \ in previous chapters, as well as build the basic connection handler. Create\
    \ file gab.js and insert the following code, which should be familiar from the\
    \ previous chapters:\n\n```\nvar Gab = {\n  connection: null\n};\n\n$(document).ready(function\
    \ () {\n  $('#login_dialog').dialog({\n    autoOpen: true,\n    draggable: false,\n\
    \    modal: true,\n    title: 'Connect to XMPP',\n    buttons: {\n      'Connect':\
    \ function () {\n        $(document).trigger('connect', {\n          jid: $('#jid').val(),\n\
    \          password: $('#password').val()\n        });\n        $('#password').val('');\n\
    \        $(this).dialog('close');\n      }\n    }\n  });\n});\n\n$(document).bind('connect',\
    \ function (ev, data) {\n  var conn = new Strophe.Connection(\n    'http://bosh.metajjak.im:5280/xmpp-httpbind'\n\
    \  );\n\n  conn.connect(data.jid, data.password, function (status) {\n    if (status\
    \ === Strophe.Status.CONNECTED) {\n      $(document).trigger('connected');\n \
    \   } else if (status === Strophe.Status.DISCONNECTED) {\n      $(document).trigger('disconnected');\n\
    \    }\n  });\n  Gab.connection = conn;\n});\n\n$(document).bind('connected',\
    \ function () {\n  // nothing here yet\n});\n\n$(document).bind('disconnected',\
    \ function () {\n  // nothing here yet\n});\n```"
