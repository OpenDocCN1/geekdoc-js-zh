  md: '# CHAPTER 4 EXPLORING THE XMPP PROTOCOL: A DEBUGGING CONSOLE


    One of the most common message errors is failed delivery to a user. For example,
    try sending a message to a made-up user on a made-server:


    ```

    $msg(to: elizabeth@longburn.lit, type: ''chat'')).c(''body'')

    t(''What do you think of books?'')

    ```


    Because the domain longburn.lit does not exist, the server will respond with a
    message error like the following:


    ```

    <message

    to=''darcy@pemberley.lit''

    from=''elizabeth@longburn.lit''

    type=''error''>

    <body>What do you think of books?</body>

    <error code=''404''

    type=''cancel''/>

    <remote-server-not-found xmlns=''urn:ietf:params:xml:xmpp-stanzas''/>

    </error>

    </message>

    ```


    These kinds of delivery errors are quite common; users often mistype addresses
    or have contacts that have changed servers.


    # Presence Stanza Errors


    Like message errors, <presence> stanza errors generally occur when remote servers
    are unreachable either because they don''t exist or some network link is offline.
    They occasionally crop up in places just. Like IQ and message errors, presence
    errors have a type attribute of error and contain the <error> element.


    Often you will see this as a result of server presence probes. Your XMPP server
    sends a probe to all your contacts when you send presence, and if any of those
    contacts'' servers cannot be reached, this generates a presence error that gets
    delivered to you. An example of this error is included here:


    ```

    <presence to=darcy@pemberley.lit.library>

    from=''elizabeth@longburn.lit''

    type=''error''>

    <error code=''404''

    type=''cancel''/>

    <remote-server-not-found xmlns=''urn:ietf:params:xml:xmpp-stanzas''/>

    </error>

    </presence>

    ```


    For some reason, the longburn.lit server was not reachable by the pemberley.lit
    server where Darcy''s XMPP account is, and a presence error is returned as a result
    of the presence probe.


    Each type of stanza has a matching error stanza, and they all work the same way.
    The errors that your application must pay attention to are dependent on the application
    and the significance of the failure. For instance, clients usually ignore these
    presence errors because the state of the contact'
