- img_proc: true
  md: '# Grouppie''s UI


    Grouppie''s UI design appears simplistic, there is some sophistication necessary
    to make a usable group chat. Grouppie will need to support features like room
    creation and configuration, topic changes, private messaging between participants,
    and basic moderation.


    When the application starts, the user is presented with an expanded version of
    the login dialog box you have seen in earlier chapters. This new login dialog
    box contains new fields for the multi-user chat room the user wants to join as
    well as the nickname the user wants to use within the room. If the room already
    exists, the user will join the participants in the room, and if the room doesn''t
    already exist, the room will be created.


    Once in the room, messages from other participants appear in the chat area, and
    the user can type their own messages in the text box. The list of participants
    to the right of the chat area changes as people join and leave the room. Private
    messages can be sent to other participants using special commands in the text
    box, and private messages get sent to the user show in the normal chat area but
    rendered differently.


    Two other special commands will be implemented — user actions and topic changes.
    User actions allow users to describe their actions, similar to talking about himself
    or herself in the third person. Topic changes allow the user to modify the room''s
    topic if they have adequate permissions within the room.


    Group chat has roles and affiliations, which control permissions and access to
    the room on a short- or long-term basis. Manipulating roles is necessary for silencing
    or removing users in a room when they get out of hand and changing a participant
    affiliation can make them a fellow administrator or ban them permanently. Grouppie
    supports these operations via special text commands. You will see more on these
    topics later in Understanding Roles and Affiliations.


    It may seem like a lot to implement, but these features just scratch the surface
    of possible functionality for multi-user chat rooms. Before you start coding,
    you should become familiar with the stanzas that make up the multi-user chat protocol.


    # PUBLIC SPEAKING


    Group chat allows multiple people to gather in the same place to discuss a topic.
    These virtual meeting places are called rooms, and unlike in the real world, users
    can be in more than one group chat room at the same time. Rooms have access controls,
    moderators, administrators, and even automatic logging and archive of the group''s
    communications. Before you can start work on your application, you must first
    learn how group chat operations are accomplished at the protocol level.


    # Group Chat Services


    Group chat is provided as a service, usually alongside a real XMPP server. The
    group chat service has its own domain; for example, the jabber.org server runs
    a group chat service at conference.jabber.org.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'Each room on the group chat service has its own address, which looks just like
    a JID. The XMPP developer''s chat room on the conference.jabber.org is jdev@conference.jabber.org,
    and general XMPP-related chat takes place in jabber@conference.jabber.org.


    Many XMP servers run group chat services, and thousands of rooms are spread across
    these services. Service discovery can be used to locate group chat services as
    well as the public rooms hosted on them.


    # Entering and Leaving a Room


    Before you can join with a group chat room, you must first enter the room. This
    is also often referred to as joining the room. When you are participating, you
    leave the room. Because this mirrors the concept of a user coming and going and
    offline, the multi-user chat designers decided to model this part of the protocol
    with <presence> stanzas.


    Users can join a group chat room by sending presence to the room, along with a
    note that they understand the multi-user chat protocol. Sending presence directly
    to a JID instead of the user''s server is *directed presence*. Similarly, to leave,
    unavailable presence is sent to the room.


    # DIRECTED PRESENCE


    > Sending presence stanzas directly to a JID instead of the user''s server is
    called sending directed presence. Directed presence is quite useful in XMPP protocols
    and extensions because it has some special properties.


    Directed presence can be sent to users or services without requiring presence
    subscriptions be set up. This is useful for giving another user or an external
    service temporary access to presence information.


    Another property of directed presence is that the server keeps track of who received
    directed presence notifications. The server uses this information to ensure that
    the recipients are notified when the sender goes offline, even if the sender forgets
    to send unavailable presence before logging off.

    \There is one limitation to be aware of when using directed presence — only unavailable
    presence is sent automatically. Presence changes from away or to available are
    not automatically broadcast on the sender''s behalf.


    Because group chat services need to keep track of participants'' presence, directed
    presence fulfills a crucial role. The server rarely loses track of a participant''s
    presence, even if that person forgets to send unavailable presence.


    Each participant in a group chat room gets their own address as well. Each participant
    picks a nickname for the room, and their JID within the room is the room''s JID
    with a resource added containing their nickname. For example, Darcy''s nickname
    in the Meryton ball chat room is darcy, so his group chat JID is darcy@chat.meryton.lit/darcy.'
  merge: -1
  pgno: 193
- img_proc: true
  md: "If Bingley and Jane want to join the group chat room for the Meryton ball,\
    \ they will both need to send directed presence to their desired identity in the\
    \ room ball@chat.meryton.lit. Their stanzas are shown here:\n\n```\n<presence\
    \ to='ball@chat.meryton.lit/bingley'\n  from='bingley@netherfield.lit/meryton'>\n\
    \  <x xmlns='http://jabber.org/protocol/muc'/>/>\n</presence>\n```\n\n```\n<presence\
    \ to='ball@chat.meryton.lit/jane'\n  from='jane@longbourn.lit/meryton'>\n  <x\
    \ xmlns='http://jabber.org/protocol/muc'/>/>\n</presence>\n```\n\nOnce they have\
    \ joined the room, the group chat service will broadcast all other participants'\
    \ presence stanzas to them. After all the other participants' presence stanzas\
    \ are sent, the server includes the presence broadcast by sending the arriving's\
    \ presence to everyone, including the new arrival. When a new participant sees\
    \ their own presence broadcast back to them, they know they have joined the room:\n\
    \nThis is Jane's client will receive upon joining the room:\n\n```\n<presence\
    \ to='jane@longbourn.lit/meryton'\n  from='ball@chat.meryton.lit/elabeth'>\n \
    \ <x xmlns='http://jabber.org/protocol/muc'/>\n  <item affiliation='member' role='participant'/>/>\n\
    </presence>\n```\n\n```\n<presence to='jane@longbourn.lit/meryton'\n  from='ball@chat.meryton.lit/bingley'\n\
    \  <x xmlns='http://jabber.org/protocol/muc'/>\n  <item affiliation='member' role='participant'/>/>\n\
    </presence>\n```\n\n```\n<presence to='jane@longbourn.lit/meryton'\n  from='ball@chat.meryton.lit/jane'\n\
    \  <x xmlns='http://jabber.org/protocol/muc'/>\n  <item affiliation='member' role='participant'/>\n\
    \  <status code='110'/>/>\n</presence>\n```\n\nThe room sends the affiliations\
    \ and roles of each participant along with their. Jane's own presence broadcast\
    \ also includes a status code of 110, which signals that this presence refers\
