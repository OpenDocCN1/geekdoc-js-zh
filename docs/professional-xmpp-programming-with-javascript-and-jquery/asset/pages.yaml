  md: "# 318 | CHAPTER 11 PLAYING GAMES: HEAD TO HEAD TIC-TAC-TOE\n\nTo track presence\
    \ and answer players' queries, the referee will need handlers for <presence> and\
    \ <iframe>在我. You can make the following modifications to the connected event\
    \ handler to set up these handlers:\n\n```\n$(document).bind('connected', function\
    \ () {\n  var conn = Referee.connection;\n\n  $('#log').prepend(\"<Connected as\
    \ \" + conn.jid + \"</p>\");\n\n  conn.addHandler(Referee.on, null, \"presence\"\
    );\n  conn.addHandler(Referee.on, null, \"iq\");\n\n  conn.send($pres));\n});\n\
    ```\n\ncode snippet referee.js\n\nBoth of these handlers will need to be implemented.\n\
    Add the following to the Referee object:\n\n```\non_presence: function (pres)\
    \ {\n  var from = $(pres).attr('from');\n  var bare_from = Strophe.getBareJidFromJid(from);\n\
    \  var type = $(pres).attr('type');\n  var bare_jid = Strophe.getBareJidFromJid(Referee.connection.jid);\n\
    \n  // only lock direct presence from other users\n  if ((type == \"unavailable\"\
    ) && from != bare_jid) {\n    if (type == \"unavailable\") {\n      delete Referee.presence[bare_from];\n\
    \    }\n\n    // remove from lists\n    Referee.remove_waiting(from);\n\n    $('#log').prepend(\"\
    <Unregistered \" + bare_from + \"</p>\");\n  } else if ($(pres).find('register').length\
    \ > 0) {\n    Referee.presence[bare_from] = from;\n\n    $('#log').prepend(\"\
    <Registered \" + bare_from + \"</p>\");\n    Referee.send_waiting(from);\n  }\n\
    \n  return true;\n}\n```\n\ncode snippet referee.js\n\nThe on_presence() function\
    \ ignores any <presence> stanza the referee itself or its other resources. For\
    \ available <presence> stanzas containing <register>, it will add the sender to\
    \ the tracked list and send the list of waiting players. For unavailable <presence>\
    \ stanzas, the referee will remove the sender from the tracked list and remove\
    \ them from the waiting list"
