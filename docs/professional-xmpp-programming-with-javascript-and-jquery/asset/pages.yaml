    \ {\n  NetPad.connection = null;\n  NetPad.collaborator = null;\n\n  $('#login_dialog').dialog('open');\n\
    });\n```\n\nNext, enable the Disconnect button once the connection has been established.\
    \ Add the following line as the first line of the connected event handler:\n\n\
    ```\n$$('#disconnect').removeAttr('disabled');\n```\n\nFinally, add the click\
    \ event handler for the button. The following code should be added to the document\
    \ ready handler:\n\n```\n$$('#disconnect').click(function () {\n  $(this).attr('disabled',\
    \ 'disabled');\n\n  NetPad.connection.disconnect();\n});\n```\n\nNow the application\
    \ will behave as the user expects.\n\n# Establishing NetPad Sessions\n\nOnce NetPad\
    \ has determined a collaborator supports the protocol, it can request an editing\
    \ session. In the NetPad protocol you designed, this is done with directed presence\
    \ containing a special <collaborate> element.\n\nAfter the directed presence is\
    \ sent to request an editing session, the master editor responds with a special\
    \ message containing the <start> element to begin the session or with an 'already-collaborating'\
    \ error. The master editor can also send a session stop message using the <stop>\
    \ element when it terminates the session. If the other user terminates their connection,\
    \ the master editor needs to stop the collaboration; it handles this by watching\
    \ for the unavailable presence."
