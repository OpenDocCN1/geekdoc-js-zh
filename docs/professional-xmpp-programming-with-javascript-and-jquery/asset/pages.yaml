    # Dealing with Subscription Requests


    Roster additions may also happen as a result of new subscription requests being
    accepted by the user. Recall that in an example you saw Jane add Bingley as a
    contact. After adding him to the roster, she would send a presence subscription
    request. Gab takes these steps in the contact_added event handler you saw earlier.


    Jane''s subscription request to Bingley would appear as shown here:


    ```

    <presence from=''jane@longbour.lit/sitting_room''

    to=''bingley@netherfield.lit''

    type=''subscribe'' />

    ```


    Bingley can approve or deny her request by replying with a presence stanza containing
    any attribute of subscribed or unsubscribed, respectively. His response, approving
    Jane''s subscription, is shown here:


    ```

    <presence from=''bingley@netherfield.lit/parlour''

    to=''jane@longbour.lit/sitting_room''

    type=''subscribed'' />

    ```


    If Bingley wanted to deny Jane''s subscription request, this stanza would have
    a type of unsubscribed.


    If Bingley had not already had Jane as a contact in his roster, the server would
    immediately add Jane and send him a roster update including the subscription stanza.


    ```

    <iq to=''bingley@netherfield.lit/parlour''

    type=''set''

    id=''newcontact1''

    <query xmlns=''jabber:iq''>

    <item jid=''elizabeth@longbour.lit''

    ubscription=''from''/>

