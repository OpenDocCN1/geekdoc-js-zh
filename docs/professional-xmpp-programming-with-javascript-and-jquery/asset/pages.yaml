  md: "The plug-in will now keep track of the basic roster information, but it doesn't\
    \ keep this information up to date as the roster changes or as contacts change\
    \ their presence. You can solve the first issue by setting up stanza event handlers\
    \ for IQ-stanzas that contain roster updates from the server. The second issue\
    \ can be solved by adding presence stanza handlers.\n\nIn Chapter 6, you discovered\
    \ how to modify rosters by adding, updating, and deleting contacts. The server\
    \ also notifies other connected resources about roster changes so that each client's\
    \ state remains consistent. For example, if Darcy deletes Wick from his roster\
    \ while connected to the resource library, his other resource, `drawing_room`,\
    \ will be notified of the resource. First, Darcy deletes Wick from his roster:\n\
    \n```\n```\n<iq from='darcy@pemberley.lit/library'\n  type='set'\n  id='delete'>\n\
    \  <query xmlns='jabber:iq:roster'>\n    <item j='wickham@mila.lit' subscription='remove'/>\n\
    \  </query>\n</iq>\n```\n```\n\nThe server notifies Wick and all of Darcy's connected\
    \ resources about the roster change. Darcy's `drawing_room` resource will receive:\n\
    \n```\n```\n<iq to='darcy@pemberley.lit/drawing_room'\n  type='set'\n  id='delete1'>\n\
    \  <query xmlns='jabber:iq:roster'>\n    <item j='wickham@mila.lit' subscription='remove'/>\n\
    \  </query>\n</iq>\n```\n```\n\nDarcy's library resource will also receive the\
    \ same update, even though it requested the change. The server will always notify\
    \ all resources of roster state changes.\n\n```\n```\n<iq to='darcy@pemberley.lit/library'\n\
    \  type='set'\n  id='delete1'>\n  <query xmlns='jabber:iq:roster'>\n    <item\
    \ j='wickham@mila.lit' subscription='remove'/>\n  </query>\n</iq>\n```\n```\n\n\
    Both clients acknowledge the IQ-stanza with an IQ-result. At this point, each\
    \ client will have the same view of the roster.\n\nYou can extend `statusChanged()`\
    \ to set up handlers for roster changes and add a function to the plug-in to handle\
    \ these changes. A modified version of `statusChanged()` is shown in the code,\
    \ with the new lines highlighted, followed by the new `rosterChanged()` function.\
    \ Because the server will always send a single change at a time, `rosterChanged()`\
    \ only needs to handle one `<item>` child."
