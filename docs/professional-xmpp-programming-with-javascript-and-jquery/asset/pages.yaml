  md: "vectors are encoded in <state> elements, priorities in <priority> elements.\
    \ Each cell value appears in a <cell> element. This is very similar to the encoding\
    \ process that Chapter 9's SketchPad application used, here instead of using a\
    \ form, a custom protocol is employed.\n\nThe following examples show operations\
    \ in action:\n\n```\n<message to='bingley@netherfield.lit/drawing_room'\nfrom='darcy@pemberley.lit/library'\n\
    \  type='chat'>\n<op name='insert' pos='12' char='' xmlns='http://metajack.im/ns/netpad'>\n\
    <state>\n<cell>0</cell>\n<cell>0</cell>\n</state>\n<priority>\n<cell>1</cell>\n\
    </priority>\n</op>\n</message>\n```\n\n```\n<message to='darcy@pemberley.lit/library'\n\
    from='bingley@netherfield.lit/drawing_room'\n  type='chat'>\n<op name='delete'\
    \ pos='4' xmlns='http://metajack.im/ns/netpad'>\n<state>\n<cell>0</cell>\n<cell>1</cell>\n\
    </state>\n<priority>\n<cell>0</cell>\n</priority>\n</op>\n</message>\n```\n\n\
    Darcy has added a comma, and Bingley has started to delete the “est” from “Dearest”.\n\
    \nThese are all the pieces necessary for the NetPad protocol. By layering the\
    \ protocol on top of existing primitives, the new elements remain simple but accomplish\
    \ much. You shortly that this protocol is not just easy to understand; it is also\
    \ easy to implement.\n\n# BUILDING THE EDITOR\n\nWith the fundamentals of operational\
    \ transformation and XMPP protocol extensions in hand, you can start building\
    \ the NetPad collaborative editor. You build the editor in three stages. First,\
    \ you must determine feature support and set up the editing session between the\
    \ users. Next, you add chat capabilities between the two users. Finally, you enable\
    \ both users to collaborate on a single document in the editing window.\n\n# The\
    \ Initial Skeleton\n\nBefore you start writing code, NetPad needs a user interface,\
    \ some styling, and the initial skeleton of the code. These are all similar to\
    \ the other applications you've seen in previous chapters."
