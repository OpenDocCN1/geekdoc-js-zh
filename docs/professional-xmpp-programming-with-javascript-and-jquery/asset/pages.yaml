  md: '# # Create real-time, highly interactive apps quickly with the powerful XMPP
    protocol


    XMPP is a robust protocol used for a wide range of applications, including instant
    messaging, multi-user chat, voice and video conferencing, real-time gaming, data
    synchronization, and search. This book teaches you how to harness the power of
    XMPP in your apps and presents you with all the tools you need to build the next
    generation of apps using XMPP or add new features to your current apps. Featuring
    the JavaScript language throughout and making use of the JQuery library, the book
    contains several XMPP apps of increasing complexity that serve as ideal learning
    tools.


    +   * Learn about XMPP''s instant messaging features, such as rosters, presence
    and subscriptions, and private chats

    * Covers XMPP stanzas, stanza, errors, and client protocol syntax and semantics

    * Discusses discovery, data forms, and publish-subscribe

    * Addresses XMPP programming-related topics as application design, event, and
    combining existing protocols

    * Details the best ways to deploy XMPP-based applications

    * Explains how to use Strophe''s plugin system and how to create your plugins


    Jack Moffitt is CTO of Collective, where he leads a team that produces several
    XMPP-related projects including Strophe (a family of libraries for XMPP communication),
    Palaver (a group chat server), Punjab (an HTTP to XMPP gateway server), and Speeke
    (a simple web-based group chat client). He has served several terms on the Board
    of Directors and Council of the XMPP Standards Foundation.


    Wrox Professional guides are planned and written by working programmers to meet
