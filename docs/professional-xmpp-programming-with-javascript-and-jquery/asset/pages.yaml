  md: 'The contact_added event handler creates a roster IQ-set stanza and sends it
    to the server. Then it sends a presence stanza of type subscribe to the new contact
    to request a subscription to the connection. Notice that there is no code to update
    the UI with the new roster state. Instead of handling this here, you will create
    another handler, which will be notified when the user''s roster state changes.


    # Responding to Roster Changes


    Users may connect to their XMPP server multiple times, with each connection being
    assigned its own resource. Any of these resources could make changes to the roster.
    To keep every resource synchronized with respect to the roster, an XMPP server
    will broadcast roster changes to all connected resources.


    Each connected resource will be notified of roster additions, deletions, and modifications,
    even the ones resource itself performed. Some actions, like requesting a subscription,
    may cause the roster to change as a side effect. These changes will be broadcast
    in the same manner.


    Imagine that Jane used''''s new contact dialog box to add Bing to her roster.
    Just like the code you saw earlier, Jane''s client would send an IQ-set like the
    one here:


    ```

    <iq from=''jane@longbourn.lit/sitting_room''

    type=''set''

    id=''add1''>

    <query xmlns=''jabber:iq:roster''>

    <item j=''bingley@netherfield.lit'' name=''Mr. Bingley''/>

    </query>

    </iq>

    ```


    The server will respond with the IQ-result acknowledging her request:


    The server will also broadcast the roster state change in a very similar IQ-set
    stanza:


    ```

    <iq to=''jane@longbourn.lit/sitting_room''

    type=''result''

    id=''add1''>

    <query xmlns=''jabber:iq:roster''>

    <item j=''bingley@netherfield.lit'' name=''Mr. Bingley'' subscription=''none''/>

    </query>

    </iq>

    ```


    The server''s reply may contain attributes that were unspecified in the original
    IQ-set from Jane, with the subscription attribute in the preceding code. Just,
    as with any other stanza, Jane must respond with an IQ-result or IQ-error stanza:


    ```

    <iq type=''result'' id=''changed1''/>

    ```


    If Jane had been connected from multiple resources, each of those connections
    would have received the same roster add notification.'
