    \ the priority calculation. The do_local() function must also return the constructed\
    \ request back to the caller in order for the request to be broadcast to the remote\
    \ users. The priority calculation was described previously in the \"Priorities\"\
    \ section.\n\nNetPad calls init() once the editing session has started, and from\
    \ on it calls do_local() when the local user performs editing operations and do_remote()\
    \ when requests are received from the remote user. After each request is executed,\
