  md: "each() can also be used on normal JavaScript arrays by using the global version\
    \ of the method, accessed as a property of the global $ object:\n\n```\nvar list\
    \ = [1, 2, 3, 4, 5];\n$.each(list, function () {\n  $('body').append('called for\
    \ item ' + this);\n});\n```\n\n# # DEALING WITH EVENTS\n\nAside from dealing with\
    \ DOM elements themselves, web applications must also handle and trigger events\
    \ on the document and specific elements. The event models across two browsers\
    \ can behave quite differently, but jQuery provides a consistent interface for\
    \ events that makes them simple.\n\nAside from the normal user interaction like\
    \ clicking a button or a page loading finish, jQuery provides support for custom\
    \ events. Custom events can be used for all sorts of interesting things. You can\
    \ have a piece of UI in your application trigger a contact_added event or a series\
    \ of events into a composite event that is meaning in your particular application.\n\
    \nCustom events provide an easy way to decouple your application's code. Instead\
    \ of having one piece of code call another, directly can fire an event that the\
    \ other piece of code can listen for. If more pieces of the application need to\
    \ be involved in the same bit of logic, they can simply listen and respond to\
    \ the same event, instead of changing the name of the code to call the new function.\n\
    \nCustom events are handled exactly like normal DOM events; the only differences\
    \ are the event names are different and jQuery doesn't provide conveniently helper\
    \ functions for custom events.\n\n# # Basic Event Methods\n\nThe basic event handling\
    \ methods are bind() and trigger(). bind() is used to listen for events, and trigger()\
    \ notifies listeners that an event has happened.\n\nbind() accepts two parameters:\
    \ an event name and a function that is executed when the event is triggered.\n\
    \n```\n$('#go_button').bind('click', function () {\n  // do something else\n});\n\
    ```\n\nYour code can trigger both custom events and normal DOM events with trigger().\
    \ The first argument to trigger() is the event's name, and the optional second\
    \ argument is extra data that you can pass to the event's handlers.\n\n```\n$('#go_button').trigger('click');\
    \ // click the button programmatically\n```\n\n```\n// trigger a custom event\
    \ with event specific data\n$(document).trigger('contact_added', jid: 'darcy@permberley.lit');\n\
    ```"
  merge: -1
