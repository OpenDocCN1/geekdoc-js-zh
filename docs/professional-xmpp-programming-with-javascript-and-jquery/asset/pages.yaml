  md: '# Error Stanzas


    All of the XMPP stanzas have an error type, and the contents of each type of error
    stanza are arranged in the same pattern. Error stanzas have a well-defined structure,
    often including the contents of the original, offending stanza, the generic error
    information, and optionally, an application-specific error condition and information.


    All error stanzas must have a type attribute set to the server and an <error>
    child element. Many error stanzas also include the original stanza''s contents,
    but this is not required and, in some cases, not desirable.


    The <error> child has a required type attribute of its own, which can be one of
    cancel, continue, modify, auth, or wait. The value signifies that the action should
    not be retried, because it will always fail. A wait value generally indicates
    a warning and is not frequently encountered. An error type communicates that the
    data needs some change in order to be accepted. An auth error informs the entity
    that the action should be retried after authenticating in some way. Finally, the
    wait value reports that the server is temporarily having problem, and the original
    stanza should remain unmodified after a short time.


    An <error> child is also required to contain an error condition from a list of
    defined conditions as a child element. It may also contain a <text> element giving
    further details about the error. An application-specific error condition can also
    be specified in a child element of the <error> element under its namespace.


    Table 1-1 lists the most common defined error conditions. For more information
    on, please refer to Section 3.9.2 of RFC 3920. Note that each of these condition
    elements must be under the urn:ietf:params:xmlns:xmmp-stanzas namespace.


    # TABLE 1-1: Common Error Conditions


    | CONDITION ELEMENT | DESCRIPTION |

    |--- | --- |

    | <bad-request/> | The request was malformed or includes unexpected data. |

    | <conflict/> | Another resource or session exists with the same name. |

    | <feature-not-implemented/> | The feature requested is not implemented by the
    service. |

    | <forbidden/> | The client does not have authorization to make the request. |

    | <internal-server-error/> | The server had an undefined internal error that prevented
    it from processing the request. |

    | <item-not-found/> | The item involved in the request does not exist. This error
    is equivalent to the HTTP 404 error. |

    | <recipient-unavailable/> | The intended recipient is temporarily unavailable.
    |

    | <remote-server-not-found/> | The remote server does not exist or could not be
    reached. |

    | <remote-server-timeout/> | Communication with the remote server has been interrupted.
    |

    | <service-unavailable/> | The requested service is not provided. |'
  merge: -1
