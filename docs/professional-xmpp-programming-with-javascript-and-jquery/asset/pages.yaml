  md: '# ABOUT THE AUTHOR


    ![](img/eb420c48595351b731631bccf1c8fdc4_10_0.png)


    **JACK MOFFITT** is a hacker and entrepreneur based in Albuquerque, New Mexico.
    He has founded several startups built on XMPP technology including Chesspark,
    a real-time, multi-user gaming platform, and Collecta, a real-time search engine
    for the Web. He has started and contributed to numerous XMPP related open source
    and free software projects including the Strophe XMPP client libraries, the Punjab
    XMPP connection manager, the Palaver multi-user chat component, the Speec group
    chat application. He has also served several terms on both the XMPP Board of Directors
    and the XSF Council.


    Previous to his XMPP work, he created the Iecast streaming media server, managed
    the Ogg, Vorbis, and Theora decodec codc projects, and co-founded the Xiph.org
    Foundation, a standards organization for royalty-free multimedia technologies
    for the Internet. He is passionate about free software and open source, open standards,
    and Internet technology. His favorite programming languages include JavaScript,
    Erlang, and Python. You can find him at http://metajack.im, blogging about start-ups
    and code, as @metajack on Twitter and Identica, or often spreading the word of
    XMPP at technology conferences.'
