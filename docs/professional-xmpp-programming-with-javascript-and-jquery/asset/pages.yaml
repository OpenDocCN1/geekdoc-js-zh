  md: 'As from more error cases defined in the specification, that is all there is
    joining and leaving group chat rooms.


    # Sending and Receiving Messages


    Once in a room, users can communicate with each other by sending and receiving
    messages. This works very similarly to private messages, which you''ve seen in
    previous chapters.


    Messages are sent to a room with a special type — groupchat. Messages directed
    to the bare room JID, ball@chat.meryton.lit, for example, are broadcast to all
    occupants. Messages sent to the full JID of an occupant in the room are private
    and relayed by the real JID of the user.


    In the following example, Mr. Bingley addresses Mr. Darcy in the first. Bingley
    sends his message to the room:


    ```

    <message to=''ball@chat.meryton.lit''

    from=''bingley@netherfield.lit/meryton''

    type=''groupchat''>

    <body>Come, Darcy, I must have you. I hate to see you standing

    about by yourself in this stupid manner. You had much better

    dance.</body>

    </message>

    ```


    His message will be broadcast to all occupants, including Mr. Darcy. Darcy''s
    client will receive:


    ```

    <message to=''darcy@pemberley.lit/meryton''

    from=''ball@chat.meryton.lit/bingley''

    type=''groupchat''>

    <body> Come, Darcy, I must have you dance. I hate to see you standing

    about by yourself in this stupid manner. You had much better

    dance.</body>

    </message>

    ```


    In most group chat rooms, messages will appear just like these, with XHTML-IM
    payloads for nicer formatting. Group chat messages can be extended to just anything
    like XMPP, and by using extensions, the messages can carry arbitrary structured
    information. You see this in action in Chapter 11 when you build a game service
    using group chat.


    # Anonymity


    XMPP multi-user chat rooms have configurable levels of anonymity, unlike many
    other group chat systems. These are currently defined in the specification: non-anonymous,
    semi-anonymous, and fully anonymous.


    In non-anonymous rooms, each occupant can see the real JID of the other occupants;
    the room will broadcast an extra attribute in the occupant''s presence updates.


    In semi-anonymous rooms, only owners and admins can see the real JIDs of occupants.
    Semi-anonymous and non-anonymous rooms are the most common types, and most group
    chat services will be configured to use one of these as the default for newly
    created rooms.'
  merge: -1
  pgno: 196
- img_proc: true
  md: "# CHAPTER 8 GROUP CHATTING: A MULTI-USER CHAT CLIENT\n\nFully anonymous rooms\
    \ are quite rare, and only server administrators have access to the real JIDs\
    \ of participants of these rooms. Not even the room's owner can access the real\
    \ JIDs.\n\nNormal private messages cannot be sent to participants in semi-anonymous\
    \ or anonymous rooms, as the sender does not have access to the participant's\
    \ actual JID. This is why private messages in group chat are sent to the participant's\
    \ room JID.\n\n# Creating Rooms\n\nThousands of rooms in the federated XMPP network\
    \ are already available for you to participate, but sometimes you will find the\
    \ room you are looking for does not exist. Creating rooms is easy, and it is accomplished\
    \ in the same manner as joining a room.\n\nActually, rooms can be created by joining\
    \ a non-existent room. Assuming the service allows you to create new rooms, sending\
    \ presence to the desired room JID of the new room will cause the room to be created\
    \ and the you to be set as the room's owner. Here, Bingley creates a new room\
    \ for the Netherfield party:\n\n```\n<presence to='chat@chat.netherfield.lit/bingley'\n\
    \  from='bingley@netherfield.lit/drawing_room'>\n  <x xmlns='http://jabber.org/protocol/muc'/>\n\
    </presence>\n```\n\nThe netfield.lit service responds with the presence broadcast\
    \ for the room's new and only occupant:\n\n```\n<presence to='bingley@netherfield.lit/drawing_room'\n\
    \  from='chat@chat.netherfield.lit/bingley'>\n  <x xmlns='http://jabber.org/protocol/muc'/>\n\
    \    <item affiliation='owner' role='moderator'>\n      <status code='110'/>\n\
    \      <status code='201'/>\n    </item>\n  </x>\n</presence>\n```\n\nNotice that\
    \ Bingley has the owner affiliation and the moderator role. These attributes give\
    \ Bingley special powers within the room, and you see more about these later.\
    \ The 110 status code is sent, as it was before, and a new status code of 201\
    \ is sent created.\n\nOnce the room is created, the owner will usually configure\
    \ it to behave as desired. Group chat support a wide range of configuration options,\
    \ including:\n\n+   - Room persistence, or whether the room will continue to exist\
    \ after all participants have left\n- Room description\n- Whether the room's messages\
    \ should be logged\n- Whether participants are allowed to change the room's topic\n\
    - The maximum number of occupants\n- Access controls like membership list"
  merge: -1
