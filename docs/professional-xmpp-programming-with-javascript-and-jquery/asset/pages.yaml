  md: '# INTRODUCTION


    XMPP POWERS A WIDE RANGE OF APPLICATIONS including instant messaging, multi-user
    chat, voice and video conferencing, collaborative spaces, real-time gaming, data
    synchronization, and even search. Although XMPP started its life as an open, standardized
    alternative to proprietary instant messaging systems like ICQ and AOL Instant
    Messenger, it has matured into an extremely robust protocol for all kinds of exciting
    creations.


    Facebook uses XMPP technology as part of its system. Google uses XMPP to power
    Google Talk and its exciting new Google Wave protocol. Collecta has built a real-time
    search engine extensively over XMPP''s publish-subscribe system. Several web browsers
    are experimenting with XMPP as the basis of their synchronization and sharing
    domains. Dozens of other companies have XMPP-enabled their web applications to
    provide enhanced user experiences and real-time interaction.


    The core of XMPP is the exchange of small, structured chunks of information. Like
    HTTP, XMPP is a client-server protocol, but it differs from HTTP by allowing either
    side to send data to the other asynchronously. XMPP connections are long-lived,
    and are pushed instead of pull.


    Because of its differences, it provides an excellent companion to HTTP. XMPP-powered
    web applications are to what AJAX was to the static web; they are the next level
    of interactivity and dynamism. Where JavaScript and dynamic HTML have brought
    desktop application features to the web browser, XMPP brings new communications
    possibilities to the Web.


    XMPP has many common social features built-in, due to its instant messaging heritage.
    Contact lists and subscriptions create social graphs, presence updates help users
    keep track of what is doing, and private messaging makes communication among users
    trivial. XMPP also has nearly 300 extensions, providing a broad and useful range
    of tools on which build sophisticated applications. With a handful of these, along
    with the core protocol, amazing things can be built


    This book teaches you how to harness the power of XMPP in your applications, enabling
    you to build applications that are social, collaborative, real-time, or all of
    above. You will develop a series of increasingly sophisticated XMPP applications,
    starting from "Hello, World!" and finishing with a collaborative text editor,
    a shared sketch pad, and a real-time, multi-player game. By the end, you will
    have all the tools you need to build the next generation of applications using
    XMPP or to add new real-time, push, or social features to your current applications.


    # WHO THIS BOOK IS FOR


    This book is written for developers interested in making XMPP applications. You
    need not to have any previous experience with XMPP, although it will certainly
    be helpful if you do. The book starts from the assumption that you''ve heard great
    things about XMPP and are looking to dive right in.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# INTRODUCTION


    The JavaScript language is used to develop all the applications in the book because
    it is an easy language to understand, is familiar to a large number of programmers,
    and comes on every computer with a web browser. Even though this book uses JavaScript,
    all the concepts and applications could be developed in any language; most the
    "hard parts" are not related to the programming language, the libraries used,
    or the web browser. You do not need to be a JavaScript expert to understand and
    work with the code in this book.


    It is assumed that you understand the basic front-end web technologies, CSS and
    HTML. If you''ve ever written a little HTML from scratch and changed a few CSS
    styling properties, you should be fine.


    This book also makes use of two libraries, jQuery and Strophe. It is helpful if
    you have used jQuery before, but if you haven''t, a short primer is included in
    Appendix A. The Strophe library is explained fully as the applications are developed.


    # WHAT THIS BOOK COVERS


    The XMPP protocol and its extensions cover a lot of ground. This book focuses
    on the pieces of XMPP in wide use. The following topics receive much attention:


    +   - XMPP instant messaging features like routers, presence and subscriptions,
    and private chats

    - XMPP stanza, stanza errors, and client protocol syntax and semantics

    - Extending XMPP

    - Service discovery (XEP-0030)

    - Data Forms (XEP-0004)

    - Multi-User Chat (XEP-0045)

    - Publish-Subscribe (XEP-0060)


    Although these topics are all approached from the client side, almost all of it
    is equally applicable to XMPP bots or server components and plug-ins.


    The book also covers XMPP programming related topics such as application design,
    event handling, and combining simple protocol elements into a greater whole. Along
    the way, a few programming topics are also discussed as the Canvas API.


    XMPP is now more than 10 years old and mature. This book covers the 1.0 version
    of the core protocol. The XMPP protocol parts of this book should work in future
    versions of the protocol, just as HTTP 1.0 clients can communicate with HTTP 1.1
    servers.


    XMPP has many extensions and several of these are also covered. For the most part,
    the book concentrates on extensions that are in a stable, mature state. For each
    extension used, the document is always given, and if in doubt, you can always
    check the latest version of the extension to see if it has changed or superseded.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'The book was written with the 1.3 series versions of jQuery and the 1.7 versions
    of jQuery UI. These libraries generally remain backward compatible to a large
    degree. Version 1.0 of the Strophe library is used, but future 1.X versions should
    also work.


    # HOW THIS BOOK IS STRUCTURED


    This book is primarily organized as a walkthrough tutorial of a series of example
    XMPP applications. Each application increases in difficulty and teaches you one
    or more useful parts of the XMPP protocol and its extensions. These applications
    are stripped down for clarity, but they are examples of the kinds of applications
    XMPP developers create every day.


    This book is divided into three parts.


    The first part is an introduction to the XMPP protocol, its uses, and XMPP application
    design. Chapter 1 covers the use cases for XMPP, the history of the protocol and
    its components. Chapter 2 explains when XMPP is a good choice for the job and
    gets into detail about how XMPP applications work, particularly for the Web.


    The second part is the book and contains nine XMPP applications that solve a variety
    of problems. Each application is more complex than the last and builds on the
    constructs of the previous ones. Chapter 3 starts with a simple "Hello, World!"
    type example, and by Chapter 11 you will build a real-time, multi-player game.


    The last part covers a few advanced but important topics. Chapter 12 discusses
    attached sessions, a useful trick for security, optimization, and persistence.
    Chapter 13 goes into detail about how to deploy and scale XMP-based applications.
    Chapter 14 explains how to use Strophe''s plug-in system and how to use your own
    plug-ins.


    # WHAT YOU NEED TO USE THIS BOOK


    This book makes use of web technologies and therefore requires almost no special
    tools. You can use, build, and run the applications in this book on virtually
    any platform. The libraries needed for the applications are explained in Chapter
    3, and most can be used without downloading any code.


    You will need some way to serve web pages as a local server or a hosting server:
    Tape to serve the files; Tape is a simple web server and is explained in Appendix
    B. It is an unfortunate requirement of browser security policy that you cannot
    easily run these applications directly from your local file system.


    You will need an XMPP account (or multiple accounts in some cases if you want
    to test the code by yourself) to run the applications. You can avail yourself
    of any of the public XMPP servers for this purpose, although you will need to
    ensure that the server has support for publish-subscribe and multi-user chat;
    most do. You can also download and run your own XMPP server instead, although
    this is not covered in the book.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# INTRODUCTION


    Chapter 12 requires server-side assistance. The example uses the Python programming
    language along with the Django framework to provide this. This chapter is an advanced
    topic and is not needed for the normal applications in the book.


    # CONVENTIONS


    To help you get the most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book.


    > Boxes like this one hold important, not-to-be forgotten information that is
    directly relevant to the surrounding text.


    > Notes, tips, hints, tricks, and asides to the current discussion are offset
    and placed in italics like this.


    As for styles in the text:


    +   * We highlight new terms and important words when we introduce them.

    * We show keyboard strokes like this: Ctrl+A.

    * We show file names, URLs, and code within the text like so: `persistence.properties`.

    * We present code in two ways:


