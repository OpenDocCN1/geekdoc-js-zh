  md: "# CHAPTER 4 EXPLORING THE XMPP PROTOCOL: A DEBUGGING CONSOLE\n\nwrapper, which\
    \ contains some metadata about the request. The details of this tunneling, called\
    \ BOSH, are the subject of XEP-0124 and XEP-0206 and were touched on in Chapter\
    \ 2. The show_traffic() function ignores this <body> wrapper and deals with its\
    \ children, which are the stanzas.\n\nEach stanza is converted from XML to text\
    \ (this is referred to as serialization) using a new Strophe, Strophe.serialize().\
    \ The XML string produced by Strophe's serialize() function must be first inserted\
    \ into the HTML document, or the XML elements will be interpreted as HTML. The\
    \ escaping is done by the xmlhtml() function, which replaces the special characters\
    \ with their escaped versions. The text is appended to the console's content <div>.\
    \ Incoming stanzas are given a CSS class of incoming and outgoing stanzas receive\
    \ the class outgoing. These are typical uses of jQuery.\n\nThe console should\
    \ scroll when new data comes in, the scrollTop attribute of the element is equal\
    \ to its height. However, it would be frustrating if it moved to the bottom while\
    \ you were scrolled up to read something at the top. The code checks if the console\
    \ is looking if the user is looking at something old, the window will not jump\
    \ to the bottom when new messages come in. When the user returns to the bottom,\
    \ the auto-scrolling behavior will be killing action.\n\nFinally, you should add\
    \ some logic to make the Disconnect button functional. Peek is connected, you'll\
    \ want to enable the Disconnect button, and when Peek connects, you'll want to\
    \ disable it. You can do this by binding the connected and disconnected events,\
    \ which your connection callback when those states are reported by Strophe. Add\
    \ the following handlers at the end of peek.js:\n\n```\n```$(document).bind('connected',\
    \ function () {\n  $('#connect_button').removeAttr('disabled');\n});\\```\n```\n\
    \n```\n```$(document).bind('disconnected', function () {\n  $('#connect_button').attr('disabled',\
    \ 'disabled');\n});\\```\n```\n\nTo make the button do something, you must handle\
    \ its click event. Add the following code to the document event handler:\n\n```\n\
    ```$('#disconnect_button').click(function () {\n  Peek.connection.disconnect();\n\
    });\\```\n```\n\nIf you load the application in a web browser and log in to your\
    \ favorite XMPP server, you'll see the stanzas that are sent during authentication\
    \ appear in the console. The only problem is that they are shown as long strings\
    \ without any formatting. It is time for you to make them prettier and easier\
    \ to read."
