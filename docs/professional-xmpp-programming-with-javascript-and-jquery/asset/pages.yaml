  md: "# Getting and Maintaining the Roster\n\nYou saw how to retrieve and deal with\
    \ the roster in Chapter 6, and now you will put those skills to use again to populate\
    \ the roster state in the plug-in. First, you must get an initial copy of the\
    \ roster from the server once the connection is established. After that, each\
    \ contact's information will need to be updated as their presence changes. The\
    \ plug-in must also trigger an event so that the user's code gets notified when\
    \ roster changes have been made.\n\nIn Chapter 6, you learned how to retrieve\
    \ rosters from the server. The plug-in must do this every time the user is disconnected\
    \ in the client, another client could have made changes. Also, when the plug-in\
    \ is notified about disconnection, it needs to put the roster representation into\
    \ an appropriate state.\n\nThe following code implements the statusChanged function\
    \ to handle these tasks for the CONNECTED and DISCONNECTED states. It also notifies\
    \ handlers for the roster_changed event that the roster has been updated. You\
    \ should insert this into your plug-in's prototype after init().\n\n```\nstatusChanged(status)\
    \ {\n    if (status === Strophe.Status.CONNECTED) {\n        this.contacts = {};\n\
    \n        // build and send initial roster query\n        var roster_iq = $iq({type:\
    \ 'get'})\n            .c('query', {xmlns: Strophe.NS.ROSTER});\n\n        var\
    \ that = this;\n        this.connection.send0(roster_iq, function (iq) {\n   \
    \         $(iq).find(\"item\").each(function () {\n                // build a\
    \ new contact and add it to the roster\n                var contact = new Contact();\n\
    \                contact.name = $(this).attr('name') || '';\n                contact.subscription\
    \ = $(this).attr('subscription') ||\n                    'none';\n           \
    \     contact.ask = $(this).attr('ask') || '';\n                $(this).find(\"\
    group\").each(function () {\n                    contact.groups.push($(this).text());\n\
    \                });\n                that.contacts[$(this).attr('jid')] = contact;\n\
    \            });\n        });});\n\n        // let user code know something happened\n\
    \        $(document).trigger('roster_changed', that);\n    }\n    } else if (status\
    \ === Strophe.Status.DISCONNECTED) {\n        // set all users offline\n     \
    \   for (var contact in this.contacts) {\n            this.contacts[contact].resources\
    \ = {};\n        }\n    }\n\n    // notify user code\n    $(document).trigger('roster_changed',\
    \ this);\n}\n```\n\n![](img/eb420c48595351b731631bccf1c8fdc4_432_0.png)"
