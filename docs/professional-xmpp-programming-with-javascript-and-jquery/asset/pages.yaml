    \ > s2[i]) {\n      return 1;\n    } else if (s1[i] < s2[i]) {\n      smaller\
    \ = true;\n  }\n```\n\n![](img/eb420c48595351b731631bccf1c8fdc4_282_0.png)\n\n\
    Available for download on W3.com"
