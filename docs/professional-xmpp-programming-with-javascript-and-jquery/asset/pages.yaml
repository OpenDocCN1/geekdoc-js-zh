  md: 'As you can see, the last part of the namespace has changed. The response from
    pemberley.lit appears here:


    ```

    <iq to=''elizabeth@longbourn.lit/lambton''

    from=''pemberley.lit''

    type=''result''

    id=''items1''>

    <query xmlns=''http://jabber.org/protocol/disco#items''>

    <item id=''pubsub.pemberley.lit''>

    name=''The Pemberley Pubsub System''>

    <item id=''chat.pemberley.lit''>

    jid=''The Pemberley Multi-User Chat System''>

    <item id=''pemberley.lit''>

    node=''statistics''/>

    name=''Pemberley Server Statistics''/>

    </query>

    </iq>

    ```


    Each item of the entity is represented by an <item> element in the response. The
    preceding example shows three children, two which are server components, and one
    is an internal node. All of these items will respond to disco#info and disco#items
    queries over the:


    # Disco Nodes


    Internal parts of the service tree are exposed as nodes. The disco#items query
    you saw in the list section contained a statistics node as one of the pemberley.lit
    children. Disco nodes are address by a node attribute in the <query> element of
    the request:


    ```

    <iq to=''pemberley.lit''

    from=''elizabeth@longbourn.lit/lambton''

    type=''get''

    id=''info2''>

    <query xmlns=''http://jabber.org/protocol/disco#info''>nnode=''statistics''/>

    </iq>

    ```


    The statistics node will respond with one or more <identity> elements and one
    or more <feature> elements, just like any other entity. A disco#items query to
    the statistics node may also reveal child nodes.


    Aside from the various error cases and other small details, these simple pieces
    are all there is to service delivery. You have all the knowledge you need to start
    building Dig.


