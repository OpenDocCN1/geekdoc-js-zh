    \ this for the Disconnect button in the connected and disconnected event handlers.\
    \ Because both buttons have the button class, you can handle both buttons at the\
    \ same time. For the area, you will also need to remove the disabled class, which\
    \ was used to alter the background color. The new handlers are shown here with\
    \ the changes highlighted:\n\n```\ndocument.bind('connected', function () {\n\
    \  $('.button').removeattr('disabled');\n  $('#input').removeClass('disabled').removeattr('disabled');\n\
