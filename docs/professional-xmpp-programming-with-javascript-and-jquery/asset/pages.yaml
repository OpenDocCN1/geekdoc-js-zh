- img_proc: true
  md: "Because this construction is so common, jQuery also provides an even simpler\
    \ shortcut. Just pass the handler directly to the $ ( ) function:\n\n```\n```javascript\n\
    $(function () {\n  // init code here\n});\n```\n```\n\nMany jQuery programmers\
    \ seem to use the shortest construction, but this book uses ready() to make the\
    \ code as easy to understand as possible. You will see other DOM events handled\
    \ with their specially named methods as well, and custom events are managed with\
