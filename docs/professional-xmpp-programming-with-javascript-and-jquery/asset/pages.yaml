  md: "# APPENDIX A GETTING STARTED WITH JQUERY\n\nYou can load jQuery by including\
    \ a <script> element in your page like the one shown here:\n\n```\n<script src='http://ajax.googleapis.com/libs/jquery/1.3.2/jquery.js'>\n\
    </script>\n```\n\nIn a production application, you may want to use the minimized\
    \ version of the library, which reduces to the size of the library to make your\
    \ application's page load faster. The minimized version is usually named jquery.min.js\
    \ instead of jquery.js.\n\nOnce jQuery is loaded in your application, you can\
    \ extend its functionality via the $() function. This funny looking function has\
    \ a short name to save typing because it usually becomes one of the most used\
    \ functions in an application.\n\n# JQUERY VERSUS DOM\n\nBefore you jump into\
    \ the details of jQuery, take a look at the following example comparing DOM and\
    \ jQuery. This example should give you a feeling for what jQuery code looks like\
    \ and how it is different from the DOM API directly.\n\nThe following code has\
    \ a task. Find all the <p> elements in the page and changes their background color\
    \ to light red. First the DOM API:\n\n```\nvar p_elements = document.getElementsByTagName('p');\n\
    for (var i = 0; i < p_elements.length; i++) {\n  p_elements[i].style.backgroundColor\
    \ = '#faa';\n}\n```\n\nNow the same action using jQuery:\n\n```\n$('p').css(backgroundColor:\
    \ '#faa');\n```\n\nThe jQuery code is not much shorter, but it is also much cleaner.\
    \ It selects of elements using CSS selector syntax and applies a new background\
    \ color to all the matching elements.\n\nThe DOM code in the previous example\
    \ works in all browsers, but jQuery really shines when the code uses some DOM\
    \ functionality that is not consistent across all browsers. For the inconsistent\
    \ DOM API functions, the jQuery code is just as short, but equivalent code without\
    \ jQuery is generic-filled with extra if statements for compatibility checks.\n\
    \n# USING JQUERY\n\njQuery's design is simple, but powerful: find a set of elements\
    \ and perform an operation on the resulting set.\n\n# Finding Elements\n\nAs you\
    \ saw in the previous section, jQuery's $() function accepts an extended version\
    \ of CSS selector syntax instead of the DOM's getElementById() or getElementsByTagName().\
    \ This makes"
  merge: -1
