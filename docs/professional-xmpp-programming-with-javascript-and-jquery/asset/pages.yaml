- img_proc: true
  md: "The handler for the connect event creates a new connection and calls connect()\
    \ with a callback function that merely triggers new custom events. The connected\
    \ event is fired whenever Strophe notifies the callback function of the CONNECTED\
    \ status, and the disconnected event is fired for the DISCONNECTED status.\n\n\
    The next event handlers are bound to handle these new custom events but don't\
    \ do anything. This custom event design is a pattern used throughout this book's\
    \ applications. The custom events have made it trivial to separate out the various\
    \ parts of the connection process, and you can modify any of the handlers without\
    \ affecting the others.\n\nThere is one set of additions to make before you move\
    \ to the next section of Hello. The logging area is used for notifying the user\
    \ of what is happening as the application runs, you should create a function to\
    \ write messages to this area and log when the connected and disconnected events\
    \ are triggered.\n\nFirst, create a namespace for Hello and add a connection property\
    \ to the log function. The connection property will store the active connection\
    \ object so that it can be accessed. The log function simply updates the logging\
    \ area with a message. The following code can go before the document ready at\
    \ the top of the file:\n\n```\nvar Hello = {\n  connection: null,\n\n  log: function\
    \ (msg) {\n    $('#log').append('<p>' + msg + '</p>');\n  }\n};\n\ncode snippet\
    \ hello.js\n```\n\nThe connection property is initialized to null, but you'll\
    \ need to create the connection object and set it back to null when the connection\
    \ is terminated. You should also add the message to the connected event handler.\
    \ The modified event handlers are shown here, with their modified lines highlighted:\n\
    \n```\n$document.bind('connected', function (ev, data) {\n  var conn = new Strophe.Connection(\n\
    \    \"/bosh.metajak.im:5280/xmpp-httpbind\");\n  conn.connect(data.id,data.password,\
    \ function (status) {\n    if (status === Strophe.Status.CONNECTED) {\n      $(document).trigger('connected');\n\
    \    } else if (status === Strophe.Status.DISCONNECTED) {\n      $(document).trigger('disconnected');\n\
    \    }\n  });\n});\n\nHello.connection = conn;\n});\n$document.bind('connected',\
    \ function () {\n  // inform the user\n  Hello.log(\"Connection established.\"\
    );\");\n```"
