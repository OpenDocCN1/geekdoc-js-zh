  md: "every edit. Unfortunately, IE 6 does not support the selectionStart and selectionEnd\
    \ properties, so this code will not work. It should work fine in later versions\
    \ of IE and in other browsers.\n\n# Local and Remote Operations\n\nThe next step\
    \ is to generate and broadcast local editing events. While the user is in the\
    \ editing area, certain press keys will cause the contents of the buffer to change.\
    \ These keys include normal alphanumeric keys, the Delete and Backspace keys,\
    \ as well as the shortcuts for copy and paste. It is a lot of work to handle the\
    \ full range of possibilities, for the sake of simplicity, NetPad will be limited\
    \ to the most basic operations and will disable the others.\n\nThe following keypress\
    \ event handles local editing events. After it determines which event is it, call\
    \ the send_op() function to update the OpTrans object and broadcast the operation\
    \ to the other member:\n\n```\n$(`pad`).keypress(function (ev) {\n  if (NetPad.collaborator)\
    \ {\n    var idx = this.selectionStart;\n    var handled = true;\n    if (ev.which\
    \ === 8) {\n      this.selectionStart = idx - 1;\n      this.selectionEnd = idx\
    \ - 1;\n      NetPad.send_op('delete', idx - 1);\n    } else if (ev.which ===\
    \ 46) {\n      NetPad.send_op('delete', idx);\n    } else if (ev.which > 32 &&\
    \ ev.which < 127) ||\n      ev.which >= 256) {\n      NetPad.send_op('insert',\
    \ idx, String.fromCharCode(ev.which));\n    }\n  }\n  ev.preventDefault();\n}\n\
    });\n```\n\n![](img/eb420c48595351b731631bccf1c8fdc4_314_0.png)\n\nThe key codes\
    \ 8 and 46 are for the Backspace and Delete keys, respectively. The range of keys\
    \ in the last case handle the printable ASCII character set as well as the printable-ASCII\
    \ characters. The handler passes the send_op() function operation, the index at\
    \ which the operation occurred, and for an insertion operation, the character\
    \ that was inserted. Any characters not explicitly here will be ignored because\
    \ the default behaviors are switched off with the call to preventDefault().\n\n\
    The send_op() function takes a local operation, encodes it in the NetProtocol\
    \ XML format you designed, and previously sends it to the collaborator. Its counterpart,\
    \ process_op(), handles decoding the NetProtocol stanza and passing the operation\
    \ request to OpTrans's do_remote() function. Add the following two functions to\
    \ the NetPad object:\n\n```\nsend_op: function (op, pos, chr) {\n  var req = OpTrans.do_local(op,\
    \ pos, chr);\n}\n\nvar op_attrs = (xmlns: NetPad.NS_NETPAD,\n  name: op);\n```\n\
    \n![](img/eb420c48595351b731631bccf1c8fdc4_314_1.png)\n\n*"
