    \ first create a parser that parses text into XML parsers. Adding the following\
    \ text_to_xml() function to the Peek object:\n\n```\ntext_to_xml: function (text)\
    \ {\n  var doc = null;\n  if (window.DOMParser) {\n    var parser = new DOMParser();\n\
