  md: '# 5

    Microblogging in Real Time:

    An Identica Client


    WHAT''S IN THIS XMPP?


    +   - Using XMPP <message> stanzas

    - Using the Identica XMPP API

    - Improving messages with XHTML-IM

    - Dealing with stored offline messages


    Millions of users communicate with friends and the world on Twitter, Identica,
    and other microblogging services. These services ask users to answer a simple
    question: “What are you doing?” The resulting stream of users'' updates is very
    similar to a dynamic, global chat room, where each user defines the room they
    see by the people they are interested in.


    Like chat systems, microblogging systems typically have low latencies, facilitating
    real-time communication among participants. Unfortunately, this low-latency channel
    is hampered by traditional, high-latency user interfaces. Many power of microblogging
    services interact with these systems using third-party clients that make the experience
    faster.


    One service, Identica, has full support for XMPP clients. In this chapter, you
    build a real-time microblogging client for the Identica system. You will start
    to see how XMPP-powered web applications result in a more dynamic, low-latency,
    real-time experience.


    In the previous two chapters, you learned the basics of the Strophe library and
    built a simple application to facilitate experimentation and debugging. The fun
    stuff starts in this chapter, in which you make useful software using XMPP that
    would be challenging to create using other methods.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# APPLICATION PREVIEW


    Updates on the Identica service are called dents. The application you build in
    this chapter is called Arthur — a reference to Arthur Dent, the protagonist of
    The Hitchhiker''s Guide to the Galaxy. Figure 5-1 shows Arthur in action.


    ![](img/eb420c48595351b731631bccf1c8fdc4_113_0.png)


    FIGURE 5-1


    The input area appears at the top of the application. Users type and send their
    dents here. Below the input area, incoming messages are displayed in reverse chronological
    order. These messages often contain clickable links, because they are delivered
    in XHTML format.


    # ARTHUR DESIGN


    Identica''s XMPP API uses XMPP <message> stanzas for interacting with the system.
    The user''s dents are sent as messages to update@identica.ca, and the same address
    sends incoming updates from followers as they occur. This is exactly how normal
    one-to-one communication works in XMPP.


    Although this API is a little clumsy for user actions from new dents, it has the
    advantage that any XMPP client can use it without modification. XMPP clients support
    all one-to-one chats and are therefore capable of basic Identica integration.


    Arthur mimics this basic one-to-one integration in a web application. Arthur''s
    requirements are much simpler than a full client because it needs only to support
    chatting with a single entity. The other end is a computer program, not a human,
    Arthur doesn''t need to support things like typing notification or presence updates.
    On the other hand, because of the application''s narrowing focus, the user experience
    will be enhanced because it is designed specifically for microblogging.


    Arthur will need to handle incoming messages from the Identica system and display
    them appropriately. These messages also come with XHTML markup that can be used
    to improve their display significantly. New dents from the user will need to be
    sent to Identica as well. Finally, Arthur must deal with messages that were sent
    while the user was offline.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# MICROBLOGGING WITH IDENTICA


    Identica is one among many microblogging services, but it has some important properties
    that make it one of the best to work with, not the least of which is XMPP. Though
    Twitter is the most well known of these services, its early experiments with XMPP
    were abandoned when its priorities shifted towards keeping the site active. Twitter
    is a walled garden, which is to say that it does not interoperate with other microblogging
    services.


    Identica is the most well known system built on the StatusNet microblogging framework.
    StatusNet is an open source, federated microblogging platform that can run. In
    fact, StatusNet is more than just source; it is a Free Network (see http://autonomo.us/2008/07/franklin-statement/)
    — a service built on free software with the added emphasis of users over their
    data.


    Unlike Twitter and other walled garden microblogging services, StatusNet forms
    a network of microblogs are capable of communicating with each other. This federation
    is very similar to the XMPP network described in Chapter 1 or the network of Internet
    e-mail servers. AnyNet site can receive and send updates to other microblogging
    sites using the Open Microblogging Protocol (OMB).


    # OPEN MICROBLOGGING PROTOCOL OR OMB


    The OMB protocol was created by Evan Prodromou to address the need for an open,
    federated world of microblogging. Evan also leads the StatusNet project, which
    is the most well known software that implements OMB.


    The current version of OMB is 0.1 and you can find it at:


    ```

    http://microblogging.org/protocol/0.1/

    ```


    OMB is currently only defined over HTTP transports, but in many the OMB community
    are hoping to see an XMPP transport added in the next version. If you are interested
    in participating or reading more about OMB, you can join the list or follow the
    OMB blog at the following URLs:


    ```

    http://lists.microblogging.org/mailer/listinfo/omb

    http://microblogging.org/

    ```


    The philosophy of OMB and the StatusNet project match well with the philosophy
    of the Internet in general. That many StatusNet sites, including Identica, have
    great support for XMPP is just an added bonus. The XMPP support also makes it
    easy for you to build real-time applications on top of StatusNet servers.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Creating Your Account


    If you don''t already have an Identica account, or an account on another XMPP-enabled
    StatusNet service, you should create one now, because you will need to test Arthur.
    Just visit Identica at http://identi.ca (or your favorite XMPP-enabled StatusNet
    system) and sign up for an account.


    My account is http://identi.ca/metajack if you are looking for follow with your
    new account.


    Once you have your account, you''ll need to set it up for XMPP notifications.


    # Turning on XMPP


    To configure your Identica account for XMPP support, follow these steps:


    +   1. On any Identica page, click the Connect link in the navigation bar at the
    top right of the page.

    2. Select the IM tab.

    3. In the IM Address field, type your Jabber ID and click Add.

    4. Make sure the Send Notices by Jabber/Gtalk option is enabled. You might also
    want to enable Send Me Replies by Jabber/Talk from People I''m Not Subscribed
    To.

    5. Click Save.

    6. Identica will send a confirmation message to your XMPP account. Click the confirmation
    link it provides to complete the setup.


    Now your XMPP account should receive messages whenever 8ball anyone you follow
    posts an update.


    You can test if this is working by sending an update to 8ball. 8ball is an Identica
    bot that generates random yes or no responses to questions, just like the known
    Magic 8-ball toys. Send 8ball a message as @8ball Is it working? Remember, if
    you didn''t enable replies from people you aren''t subscribed to, you''ll need
    to subscribe to 8ball by visiting http://identi.ca/8ball and clicking subscribing.


    If all is well, 8ball''s response will appear in your chat window, and you''re
    ready to start building-Arthur.


    # BUILDING ARTHUR


    Identica has already started delivering notifications to your XMPP account. These
    are probably appearing in your favorite chat looking much like regular private
    messages from your normal contacts. Your first goal is to write enough code that
    Arthur can connect to your XMPP account, receive updates from Identica, and display
    them. With that accomplished, you can spend some effort making the incoming messages
    prettier by using the XHTML-IM extension. Finally, you will need to enable the
    users to send their updates to Identica.'
  merge: -1
