- img_proc: true
  md: "# CHAPTER 3 SAYING HELLO: THE FIRST APPLICATION\n\n```\nanother_global: true,\n\
    \nmy_adder: function (x, y) {\n  return x + y;\n}\n```\n\nThe syntax is slightly\
    \ different, because each symbol becomes a property of the MyNamespace object,\
    \ which is defined using the {} syntax. If no other library defines some_global,\
    \ your code will not be affected. MyNamespace.some_global access calling .my_adder(1,\
    \ 2) would return 3.\n\nYou can access the attributes of the namespace object\
    \ just like any other object's attributes. Writing MyNamespace.some_global would\
    \ access the some_global attribute, and calling MyNamespace.my_adder(1, 2) would\
    \ return 3.\n\nThe only caveat to namespace objects is you must take care that\
    \ the last attribute does not have a trailing comma. the code will not load correctly\
    \ in Internet Explorer. The following code will fail:\n\n```\nvar MyNamespace\
    \ = {\n  some_global: 0,\n}\n```\n\nthe comma after the 0 will signal to the interpreter\
    \ that another attribute definition will follow, but none exists. These extra\
    \ commas are often allowed in other languages, and most browsers ignore them in\
    \ JavaScript, but Internet Explorer is quite picky about this.\n\n# Document Ready\
    \ Handler\n\nThe document ready event fires as soon as the document object model\
    \ (DOM) is available for use by JavaScript. This event fires before the entire\
    \ page's content is loaded, unlike the document load event, which fires all the\
    \ CSS, scripts, and images are fetched and ready. It is generally best to put\
    \ initialization code here, because the DOM will be available, and the ready event\
    \ is fired early enough that the user won't have to wait for initialization to\
    \ start.\n\nThe jQuery library makes it easy to write functions that will be executed\
    \ when the ready event fires. You create a document ready event handler using\
    \ the jQuery's ready() method. The following method alerts the user as soon as\
    \ the document ready event fires:\n\n```\n$(document).ready(function () {\n  alert('document\
    \ ready');\n});\n```\n\nNotice that the initialization function doesn't have a\
    \ name, and the function is passed directly into the ready() function. Functions\
    \ like this are anonymous functions, which are quite common when using callback-based\
    \ libraries like jQuery and Stripe.\n\nThe applications in this book will have\
    \ some initialization code in the document ready handler to do things like create\
    \ dialog boxes and set up event handlers. When the text says to add something\
    \ to the document ready handler, you can simply place the relevant code at the\
    \ end of this initialization function."
  merge: -1
