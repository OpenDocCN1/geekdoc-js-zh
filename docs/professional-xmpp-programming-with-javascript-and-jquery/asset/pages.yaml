  md: "Because the server broadcasts state changes to all resources, XMPP clients\
    \ will wait for the notification before updating the UI. This also has the advantage\
    \ that the roster will not display an inconsistent state; if the roster was updated\
    \ immediately before the response was received, the UI might reflect the addition\
    \ when the server has actually rejected the operation.\n\nYou can now add support\
    \ for these roster changes to Gab, which will not only show the modified roster\
    \ to the user after they add a new contact, but also show any modifications, that\
    \ happen, from the user's other. The following highlighted lines show the changes\
    \ you must make to the connected event handler:\n\n```\n$(document).bind('connected',\
    \ function () {\n  var iq = $iq({type: 'get'}).get('query', {xmns: 'jabber:iq:roster'});\n\
    \  Gab.connection.send(iq, Gab.on_roster);\n\n  Gab.connection.addHandler(Gab.on_roster_changed,\
    \ \n    \"jabber:iq:roster\", \"iq\", \"set\");\n});\n```\n\nThe on_roster_changed()\
    \ function defined will also need to be added to the Gab object:\n\n```\non_roster_changed:\
    \ function (iq) {\n  $(iq).find('item').each(function () {\n    var sub = $(this).attr('subscription');\n\
    \    var jid = $(this).attr('id');\n    var name = $(this).attr('name') || jid;\n\
    \    var roster_id = Gab.jid_to_id(jid);\n\n    if (sub === 'remove') {\n    \
    \  // contact is being removed\n      $('#' + jid).remove();\n    } else {\n \
    \     // contact is being added or modified\n      var contact_html = '<li id=\"\
    ' + jid + '\">' + \n        '<div class=\"' + \n        ($('#' + jid).attr('class')\
    \ || 'roster-contact offline') + ' \">' + \\ \n        '<div class=\"roster-name\"\
    >' + \n        name + \n        '</div><div class=\"roster-id\">' + \n       \
    \ jid + \n        '</div></div></li>';\n\n      if ($('#' + jid).length > 0) {\n\
    \        $('#' + jid).replaceWith(contact_html);\n      } else {\n        Gab.insert_contact(contact_html);\n\
    \      }\n    });\n}\n```"
