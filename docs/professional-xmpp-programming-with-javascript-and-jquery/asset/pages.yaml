- img_proc: true
  md: 'finding elements quick and easy. Once an initial selection has been made, jQuery
    contains helper functions to augment the selection if needed.


    jQuery''s $() function also accepts DOM elements instead of CSS selectors. The
    given DOM elements become the jQuery selection.


    # Selectors


    Just like CSS, jQuery supports the following basic selectors:


    +   - anlement: Selects elements with the name element

    - .class: Selects elements that have the class class

    - #id: Selects the element with the unique ID


    These selectors can be combined in the selectors p.error and input#textbox to
    make more specific. Multiple selectors can be separated by commas, and the resulting
    selector find any element that matches any of these selectors.


    Selectors can also find elements in a specific hierarchy by separating several
    selectors with spaces. For example, the chat p finds any <p element the element
    identified by chat. More specific relationships can be specified with >, +, and
    -. The selector div > p finds only the <p> elements that are descendants of a
    <div> element. Using h1 + p only <p> elements that come immediately after an <h1>,
    and similarly, h - p selects <p elements that come immediately before an <h1>.


    Selectors can also be filtered. Adding :first or :last selects only the first
    or last of the elements that match the rest of the selector. :visible and :hidden
    are similar, but restrict the selection to those that the user can see or not


    Finally, jQuery provides several filters for attributes. The main variants are
    [anattr], which matches when the elements have an anattr attribute, and [anattr=''somevalue''],
    which matches the elements have that attribute and its value equals ''somevalue''.


    See if you can determine what elements match the following selectors:


    +   - first

    - ul > i .name

    - input[type=''text''], input[type=''password'']


    # Augmenting Selections


    Once a selection is made, jQuery contains plenty of methods to refine it to just
    the elements you need. The most common of these are discussed here.


    filter() picks out a subselection of elements from a given selection. If you have
    large selection of elements that need a common manipulation performed, but a smaller
    subset needs a second manipulation, you can use filter() after the first operation
    to narrow the selection and then perform the immediate manipulation.'
  merge: -1
  pgno: 446
- img_proc: true
  md: 'children() filters the list for all immediate children of the matched elements.
    This is often used to match the first-level children of XMPP stanzas. For example,
    to get the <error> element out of a stanza, you could use $(stanza).children(''error'').


    find() looks for matching elements among the current selection''s descendants.
    Because XMPP stanzas will generally start off with the top-level element selected,
    find() is often used to intersect-ing child elements from there.


    not() removes the matching elements from the selection. This function is very
    useful for removing one or two stragglers from an otherwise perfect selection.


    # Acting on Elements


    The operations that jQuery supports on selected elements include changing CSS
    properties, getting and setting the contents of each element or its attributes,
    and binding event handlers. jQuery supports several functional programming-inspired
    methods like each() and map(), which allow easy iteration and function application
    over the entire selection. You are introduced to all these shortly.


    # Making Chains


    Function chaining also contributes to jQuery''s accessibility and power. Chaining
    allows multiple operations to be performed on the same selection.


    Most of jQuery''s methods return the jQuery object itself along with its corresponding
    selection. This means that method call on the object can be chained one after
    another.


    The following code shows an example of a typical object''s methods being called:


    ```

    var obj = new SomeObject();

    obj.foo();

    obj.bar(2);

    obj.baz(''XMPP'');

    ```


    If some Object''s methods returned the object''s instance, these methods could
    be chained. A chained invocation is shown here:


    ```

    var obj = new SomeObject();

    obj.foo().bar(2).baz(''XMPP'');

    ```


    This may look a little peculiar if it is the first time you''ve seen such a construction.
    It turns out to be quite useful in practice with libraries that are designed for
    it, like jQuery. Strophe uses chaining to make building stanzas easier, as you
    can see in Chapter 3.


    The following jQuery examples are understandable and quite readable even if you''ve
    never seen the library before:


    ```

    $(''$p.error'').css({backgroundColor: ''#f00'', fontHeight: ''14pt''}).show();


    $(''#list ul'').append(''<li>New item</li>'').append(''<li>Another new item</li>'');

    ```'
  merge: -1
  pgno: 447
- img_proc: true
  md: '# MANIPULATING ELEMENTS


    Much of the work you do with jQuery in this book relates to extracting out of
    elements, adding new elements, or modifying existing elements. This section goes
    over the most common manipulations that jQuery supports and are used throughout
    the book''s applications.


    # Data Extraction


    When dealing with XMPP stanzas, jQuery is used mainly to extract the interesting
    information out of the XML, like a programmatic version of XPath.


    attr(i) is used to get and set an element''s attributes. To get an attribute,
    pass the attribute''s name, and to set an attribute, pass the desired value. If
    the current jQuery selection contains more than one element, only the first element
    is affected when called as attr(name); all elements are called as attr(name, value).
    See the following examples for the typical usage of attr():


    ```

    $(stanza).find(''item'').attr(''jid''); // get the first item''s jid attribute


    // set the form''s input elements to buttons

    $(someform input).attr(''type'', ''button'');

    ```


    text() and html get the text or HTML contents of the element. Because Strophe''s
    builders are used to construct many blocks, this book uses these methods to retrieve
    values rather than set them.


    ```

    var body = $(stanza).find(''body'').text(); // get the message body contents


    $(chat_input).text(''Type your message here..''); // set the text box prompt

    ```


    # Styling Elements


    Most dynamic web applications encapsulate UI tasks by manipulating the styles
    of elements. Elements can be shown or hidden, change colors and sizes, or have
    their CSS classes manipulated programmatically. The following jQuery methods provide
    this behavior.


    show() and hide() are somewhat obvious from their names. They change the visibility
    of all the selected elements. This is used to make dialog boxes pop into view
    or replace one tab''s contents with another.


    css() can retrieve a specific CSS style from an element or change one of its properties.
    The following code shows how typical uses of this are:


    ```

    var c = $(''#tab'').css(''color''); // get the tab''s font color

    $(''.username).css(''background-color'', ''#fff''); // set a single css style

    $(''.errorMsg).css(fontSize: ''150%'', color: ''red''); // change multiple styles
    at once

    ```


    Notice that the style name can be set as fontSize or ''font-size''. jQuery helpfully
    allows you to save typing the quotes and the dash.'
