  md: "# Add the following do_local() and do_remote() functions to the ObTrans object:\n\
    \n```\ndo_local: function (op, pos, chr) {\n  // calculate p\n  var maxp = [];\n\
    \  for (let i = 0; i < this.log.length; i++) {\n    if (this.log[i][4] === pos)\
    \ {\n      if (this.compare_priority(maxp, this.log[i][3]) == 1) {\n        maxp\
    \ = this.log[i][3];\n      }\n    }\n  }\n\n  var p = maxp.concat(this.jid_map[this.jid]);\n\
    \n  // append request to queue\n  var req = [this.jid_map[this.jid],\n    this.state.concat(),\n\
    \    op, pos, chr,\n    p\n  ];\n  this.queue.push(req);\n\n  this.execute();\n\
    \n  return req;\n}\n```\n\n```\ndo_remote: function (jid, state, op, pos, chr,\
    \ pri) {\n  // append request\n  var req = [this.jid_map[jid], state, [op, pos,\
    \ chr], pri];\n  this.queue.push(req);\n\n  this.execute();\n}\n```\n\nFor do_local()\
    \ only the operation's details are passed in, for do_remote() you must pass in\
    \ all the necessary components of the request, which are used to create a request\
