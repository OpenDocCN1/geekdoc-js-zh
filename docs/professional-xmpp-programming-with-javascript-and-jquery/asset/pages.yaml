  md: '# # Contributing Extensions


    If you develop an interesting extension that you think might be useful to the
    community at large, you should consider submitting it to the XSF and participating
    in the standardization process. The XSF welcomes new and interesting ideas from
    both within and outside the XMPP community.


    Submitting a proposal is very easy. A document template for XEPs is provided at
    http://xmpp.org/extensions/submit.html, which you can modify to describe your
    extension. The entire process of standardization is described in XEP-0001, XMPP
    Extension Protocols, and a set of guidelines to help you is provided by Guidelines
    for Authors of XMPP Extension Proposals in XEP-0143.


    Once submitted, you send your proposal to the XMPP extensions editors, and the
    proposal will be placed in the XEP. The XSF elects a group of members every year
    to form the XMPP Council, and this council votes on whether to accept new proposals
    or modify existing ones.


    The XMPP Council and the XMPP extensions editors are very friendly, and they will
    be more happy to work with your proposal by providing feedback and answering any
    questions you may have.


    Another way to participate is to join one of many discussion lists run by the
    XSF. You can find these lists at http://xmpp.org/about/discuss.html. The standards@xmpp.org
    list is where most people join, propose new ideas, point out errors or missing
    functionality in existing protocols, and answer protocol-related questions. Lists
    also exist for variety of specialized topics, and there is a list for real-time
    web services, sw-xmpp@xmpp.org.


    You can also apply for XSF membership. The XSF holds membership elections every
    quarter, and the XSF membership elects the XSF Council, the board of directors,
    and new members; they also vote on changes to the organization''s structure and
    role.


    For the past several years, the XSF has two summits every year — one in the U.S.
    and one in Europe. These summits are open to everyone, and many of the most prolific
    community members attend them as well as developers from a variety of companies.
    You can find more information at http://xmpp.org/summit/


    # # DESIGNING THE PROTOCOL


    The Netpad protocol is a combination of other XMPP protocols plus a set of elements
    specific to the application. These new elements belong to a specific namespace,
    http://metajack.im/ns/netpad. First, support for the Netpad protocol is discoverable
    using standard Service Discovery queries. Finally, commands to start and stop
    the session all the editing operations themselves travel inside <message> stanzas.


    The actual application specific bits are sparing, and they are layered within
    fairly standard pieces of existing XMPP protocols. This type of protocol construction
    is crucial and demonstrates why so many developers are able to build amazing things
    with such little effort.'
