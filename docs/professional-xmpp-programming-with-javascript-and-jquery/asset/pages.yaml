  md: "# CHAPTER 6 TALKING WITH FRIENDS: ONE-ON-ONE CHAT\n\nEach time you send an\
    \ IQ-get or IQ-set stanza, you usually want to handle the success and error responses.\
    \ You must set up a status handler for each IQ-get or IQ-set you send. Also, you\
    \ need to take care that your id attributes are unique so that incoming responses\
    \ are not ambiguous.\n\nThe sendIQ() function wraps all these requirements and\
    \ the associated behavior in an easy-to-use interface. Instead of creating a unique\
    \ id value, setting up success and error handlers, and sending out the <iq stanza,\
    \ sendIQ() ensures you have a unique id, automatically sets up handlers with the\
    \ success and error callbacks you provide, and ensures the handlers are cleaned\
    \ up after your callbacks are executed.\n\nCalls to sendIQ() look like this:\n\
    \n```\nConnection.sendIQ(iq_stanza, success_callback, error_callback);\n```\n\n\
    The success and error callbacks are both optional. The success callback fires\
    \ if an IQ-result is received, and the error callback fires on an IQ-error. Both\
    \ callbacks are passed a single parameter—the response stanza.\n\nIn addition,\
    \ sendIQ() accepts a timeout as an optional fourth parameter. If a response to\
    \ the IQ-get or IQ-set stanza is not received within the timeout period, the error\
    \ callback is automatically triggered. This timeout can be very useful for making\
    \ your code robust in the presence of network or service errors that cause responses\
    \ to be delayed or unset.\n\nsendIQ() makes dealing with IQ stanzas extremely\
    \ easy, and you will see more of it in later chapters.\n\n# Updating Presence\
    \ Status\n\nAfter the roster is retrieved, the code should send initial presence\
    \ to kick off the probes and presence updates from the user's contacts. In order\
    \ not to make any updates, you should always set up the appropriate handler stanza\
    \ that will trigger events of interest. Modify the on_roster() handler by adding\
    \ the following highlighted code:\n\n```\non_roster: function (iq) {\n  $(iq).find('item').each(function\
    \ () {\n    var jid = $(this).attr('jid');\n    var name = $(this).attr('name')\
    \ || jid;\n\n    var jid_id = Gab.jid_to_id(jid);\n\n    var contact = \"<li id='\"\
    \ + jid_id + \">\" + \\\n      \"\"<div class='roster-contact offline'>\" + \\\
    \n      \"\"<div class='roster-name'>\" + \\\n        name + \\\n      \"\"</div></div><div\
    \ class='roster-jid'>\" + \\\n        jid + \\\n      \"\"</div></div></li>\"\
    ;\n  });\n\nGab.insert_contact(contact);\n```\n\n![](img/eb420c48595351b731631bccf1c8fdc4_139_0.png)"
  merge: -1
