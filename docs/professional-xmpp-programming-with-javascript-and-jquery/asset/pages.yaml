  md: "descendants. The first criterion, is slightly different, and it is checked\
    \ for the top-level element as\nwell as its immediate children. You see why.\n\
    \nThe name criterion will almost always be null, to match any stanza, or one of\
    \ message, presence,\nor iq. The addHandler() example set up a handler that would\
    \ be called for any <message> stanza received.\n\nThe type, id and from criteria\
    \ match the main attributes of <message>, <presence> and <iq>\nstanzas. You can\
    \ use type to differentiate between regular chat messages and group chat messages\n\
    or to separate out IQ-result stanzas from IQ-error stanzas. The id criterion is\
    \ often used to handle\nreplies to specific requests, like the IQ-result associated\
    \ with a particular IQ-request. Matching\non on the from limits the handler to\
    \ dealing with messages that come from a specific JID.\nYou should use from because\
    \ you may not know which resource another user or service\nwill communicate with\
    \ you. any JID supplied by a criterion will not match any full\nID; the match\
    \ must be exact.\n\nMatching on the ns (for namespace) criterion is mostly done\
    \ with IQ stanzas. IQ stanzas generate a single child element named according\
    \ to the type of function it serves.\n example, the ping stanza was set earlier\
    \ as an IQ-get stanza with a <ping/> child under the\nurn:xmpp:ping namespace.\
    \ Setting up a handler to catch all incoming requests would be due\nwith the following:\n\
    \n```\nconn.addHandler(my_ping_handler, \"urn:xmpp:ping\", \"iq\");\n```\n\nThe\
    \ function my_ping_handler() would be called every connection received an IQ stanza\n\
    with a child under the urn:xmpp:ping namespace. You would get all of these stanzas,\
    \ regardless of\nthey type, id, or from attributes, because those criteria were\
    \ left unspecified.\n\n# Stanza Handler Functions\n\nWhenever a match is found\
    \ for a handler, the handler function is invoked and passed the\nstanza as its\
    \ argument. When the function returns true or some expression that evaluates to\
    \ true,\nt handler function will be removed once it finishes.\n\nThe example example\
    \ handler is called a one-shot handler, because it returns false. After\nh handler\
    \ is finished with the first stanza, it will be deleted and not be called again\
    \ unless it is\nexplicit re-added by another call to addHandler().\n\n```\nfunction\
    \ my_ping_handler(iq) {\n  // do something interesting\n return false;\n}\n```\n\
    \nIf the function doesn't use the return statement at all, it returns undefined,\
    \ which results in\nt same outcome as returning false. If you find that your handlers\
    \ stop working, be is sure to check\nthe return value.\n\nThe next example shows\
    \ a handler that returns true and is therefore able to process as many stan-zas\
