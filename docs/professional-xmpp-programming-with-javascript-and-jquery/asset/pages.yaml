  md: "```\n<query xmlns='jabber:iq' version='/>\n<error code='503' type='cancel'>\n\
    \  <service-unavailable xmlns='urn:ietf:xml:ns:xmpp-stanzas'/>\n</error>\n</query>\n\
    ```\n\nThis IQ-error stanza contains the contents of the original request as the\
    \ first child. Many error stanza will receive the original request's contents,\
    \ in some cases, this may be omitted if the stanza is quite large or contains\
    \ sensitive information. The <error> element is required, and it should contain\
    \ a <text> element and exactly one child with the urn:ietf:params:xml:ns:xmpp-stanzas\
    \ namespace. The preceding error stanza did not contain a <text> child-it's optional\
    \ but you can see an example of this in the next stanza. The latter type of child's\
    \ name tells you the kind of error that happened. In this case it was service-unavailable.\
    \ This is exactly the error that was expected, because gmail does not support\
    \ this extension.\n\nNotice, also that the <error> element's type attribute is\
    \ cancel. This means that you should not try to continue this operation. Some\
    \ errors will have type attributes of modify, which means your application should\
    \ apply with the corrected input. Other error types are also possible and include\
    \ continue, auth, and wait. You can send the following stanza to a non-existent\
    \ room or a multi-user client to induce an\n\n```\n<iq type='get' to='bad-room-123@conference.jabber.org'\
    \ id='info'>\n  <query xmlns='http://jabber.org/protocol/disco#info'/>\n</iq>\n\
    ```\n\nYou should receive a response like the following one. Note that the server\
    \ has supplied a human-readable <text> element as the normal error condition element.\n\
    \n```\n<iq to='darcy@pemberley.lib/library'>\n<from='bad-room-123@conference.jabber.org'>\n\
    \  <id>info</id>\n  <error type='cancel'>\n    <query xmlns='http://jabber.org/protocol/disco#info'/>\n\
    \    <code='404'/>\n    <item-not-found xmlns='urn:ietf:params:xml:ns:xmpp-stanzas'>n\
    \      Conference room does not exist\n    </item-not-found>\n  </error>\n</iq>\n\
    ```\n\nThe <error> element may also contain an application-specific error condition,\
    \ which will have a namespace specific to the service. You can find more information\
    \ on the <error> element and IQ-error stanzas in RFC 3920 section 9.3.\n\n# Message\
    \ Stanza Errors\n\n<message> stanza can also result in errors, and they are structured\
    \ very similarly to IQ-error stanzas. <message> stanza errors will have a type\
    \ attribute of error, usually contain the original message, and also contain the\
    \ same <error> elements."
