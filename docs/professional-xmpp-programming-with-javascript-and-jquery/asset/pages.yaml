  md: '# Haprophy


    Haprophy is a high-performance, highly available load balancer for TCP and HTTP
    services. It is capable of supporting complex load balancing configurations, but
    here it is used in a basic configuration useful for BOSH connection managers.


    You can find Hapxy at its website, http://hapxy.lwt.eu/


    Just as with the nginx, this example assumes the three punjab servers are available,
    all listening on port 5280, with the BOSH service accessible at the path /xmpp-httpbind.
    The servers are named bosh-1.pemberley.lit, bosh-2.pemberley.lit, and bosh-3.pemberley.lit.


    First, in the hapxy.cfg file, you need to define a new backend linking the set
    of Punjab servers similar to the following:


    ```

    backend punjab

    mode http

    balance leastconn

    cookie BOSSHRV insert direct nocache

    server bosh-1:5280 bosh-1.pemberley.lit bosh-1

    server bosh-2:5280 bosh-2.pemberley.lit bosh-2

    server bosh-3:5280 bosh-3.pemberley.lit bosh-3

    ```


    This section defines an HTTP backend called punish with three servers. The balancing
    strategy, leastconn, is to choose the server with the least number of current
    connections. A cookie is used to make sure that each client continues to be served
    by the same Punjab server across multiple HTTP requests.


    To use the new backend, you need to add some to your relevant frontend section.
    The following lines demonstrate a configuration:


    ```

    frontend www

    # normal config would be here

    option httpclose

    acl bosh_path_beg /xmpp-httpbind

    use_backend punjab if bosh

    ```


    The httpclose option is necessary because Haprophy does not support keep-alive
    mode; if it is omitted, Haprophy only processes the initial request, and can cause
    some unexpected behavior. The httpclose option works by disabling keep-alive mode.


    The other two lines tell Haprophy to use the punjab backend whenever the path
    begins with /xmpp-httpbind.


    When Haprophy sees an /xmpp-httpbind path, it forwards the request to one of the
    three servers configured for the punjab backend. If this cookie already exists,
    it inserts an HTTP cookie named BOSSHRV to the identifier of the server, or it
    routes to the correct server. Because Haprophy uses cookies to identify the servers
    instead of a hash, the configuration can be changed without affecting users.


    More complex setups can be created with Haprophy. For example, each Punjab server
    can be limited to serving a specific number of connections, have custom timeouts,
    and be continuously monitored for availability.'
  merge: -1
