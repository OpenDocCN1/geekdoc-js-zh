  md: '# EXPLORING XMPP


    Peek is quite useful at helping you investigate how something works or why something
    is not doing what you expect. You can cut and paste the stanza building code from
    your application and see exactly what the server''s response is. If you are unfamiliar
    with a particular protocol extension, you can type in the examples to see how
    the server responds to various inputs.


    This book is filled with examples that you can try out in Peek. Be sure to adjust
    the names and JIDs appropriately; the examples in this book use imaginary server
    domains and JIDs of fictional characters. You see what happens if you try to use
    these made-up examples in the section "Dealing with Errors.",


    # Controlling Presence


    As you learned in Chapter 1, presence information and presence control are some
    of the basic features of XMPP.


    Open the Peek application, log in to your favorite XMPP server, type the following
    line, and click Send:


    ```

    <presence/>

    ```


    This first <presence> element sent on an XMPP connection is called initial presence.
    Normally the server will broadcast your presence to all the connected resources
    for your JID and all users subscribed to your presence notifications. The initial
    presence will also allow the server to send presence enables the reception of
    incoming presence stanzas from your contacts.


    If your roster is empty, you''ll only see a slightly modified version of your
    stanza reflected back at you in response. If your roster has other people in it,
    you''ll likely receive presence notifications from them immediately. As long as
    the server goes online, you will continue to receive presence updates from your
    contacts as your presence status changes.


    Because you didn''t specify any attributes on the <presence> element, it signals
    the server that you are online. Try typing the following input into Peek to see
    your presence status to away:


    ```

    $pres.c(''show'').t(''away'').up().c(status'').t(''reading'');

    ```


    # Probing Presence


    Most XMPP clients, and ever servers, support the Software Version extension (XEP-0092).
    This simple extension asks an entity to report its software and version number.
    Servers and XMPP services often use this protocol extension for gathering statistics,
    and you can use Peek to experiment with requesting software versions.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# CHAPTER 4 EXPLORING THE XMPP PROTOCOL: A DEBUGGING CONSOLE


    To request the software version of your server, send an IQ-get stanza with a <query>
    element using the jabber:version namespace. You can input any of the following
    into Peek to ask the Jabber.org server what software it runs:


    ```

    $iq((type: ''get'', id: ''version1'', to: ''jabber.org''))

    .(<query xmlns=''jabber:version''>

    ```


    or


    ```

    <iq type=''get'' id=''version1'' to=''jabber.org''><query xmlns=''jabber:iq:version''/></iq>

    ```


    The server will respond with something similar to this stanza. Because the Jabber.org
    server may have been upgraded by the time you read this, the response you receive
    may be different.


    ```

    <iq xmlns=''jabber:client''

    from=''jabber.org''

    to=''darcy@pemberley.lit/library''

    id=''version1''>

    <query xmlns=''jabber:iq:version''>

    <name>ejabcd</name>

    <version>2.1.0-alpha</version>

    <os>unix/linux 2.6.18</os>

    </query>

    </iq>

    ```


    Try some of your contacts or other servers to see what software they use.


    # Dealing with Errors


    Handling errors is an important part of any application. The XMPP protocol has
    a uniform error reporting mechanism using the core protocol and nearly every event.
    IQ-error stanzas were talked about in Chapter 1, but you can use Peek to investigate
    these and other situations in more detail.


    # IQ Stanza Errors


    IQ-get and IQ-set stanzas that you send should always receive a reply of IQ-result
    or IQ-error. You should try sending some bad stanzas to see how different entities
    respond.


    The Google Talk service at gmail.com does not support the Software Version extension
    discussed earlier. Send gmail.com a request for its software version:


    ```

    $iq((type: ''get'', id: ''version2'', to: ''gmail.com''))

    .(<query xmlns=''jabber:iq:version''>

    ```


    The server should respond immediately with an error:


    ```

    <iq from=''gmail.com''

    to=''darcy@pemberley.lit/library''

    id=''version1''

    type=''error''>

    ```'
  merge: -1
