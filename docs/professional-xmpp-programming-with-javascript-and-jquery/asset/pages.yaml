    # Subscription Management


    You saw that when subscribing to a pubsub node, you must include the JID at which
    you want to receive notifications. This JID can be either the JID (as with elizabeth@longbourn.lit)
    or a full JID (as darcy@pemberley.lit). Because delivery of events is done with
    <message> the stanza elements are different depending on whether a subscription
    is for the bare or full JID. Whether an account should use the bare or full JID
    depends on the situation.


    Normally, each subscription will last as long as the pubsub node exists or until
    the user unsubscribes. A pubsub node can also have a different subscription life
    cycle; the specification contains examples of expiring subscriptions (see section
    12.18 of XEP-0060 (an example). For instance, anonymously connected users'' subscriptions
    will be removed when their session terminates, even if they never unsubscribe
    explicitly. Some clever developers are even working on presence-based subscriptions
    that can be cancelled when the pubsub goes offline.


    Considering the number of available pubsub services and nodes, Elizabeth might
    forget just what she is subscribed to where events are supposed to be. If Elizabeth
    remembers the pubsub services that she has subscriptions on, she can ask them
    for a list of her subscriptions:


    ```

    <iq from=''elizabeth@longbourn.lit/outside''

    to=''pubsub.pemberley.lit''

    type=''get''

    ```'
