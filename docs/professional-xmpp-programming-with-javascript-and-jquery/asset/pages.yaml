  md: "# Building the Console\n\n```\nreturn null;\n\nreturn elem;\n```\n\n```\ncode\
    \ snippet peek.js\n```\n\nThe text_to_xml() function creates an XML parser and\
    \ parses the string. Internet Explorer 6 does not have the DOMParser class, so\
    \ you must use an ActiveX object instead. Firefox, Safari, and Opera, however,\
    \ implement DOMParser differs slightly from the DOMParser API, and for Peek's\
    \ needs, the changes required are very minor.\n\nSome DOMParser objects will produce\
    \ XML documents for invalid input, and these error documents will have a top-level<parsererror>\
    \ element. You must check for this so that you don't accidentally send these error\
    \ documents as XMPP stanzas.\n\nAll that is left is to send the button to the\
    \ text_to_xml() function and send the result. You can add the following code to\
    \ the document ready event handler to achieve this:\n\n```\n$('#send_button').click(function\
