- img_proc: true
  md: 'Room configuration is done with Data Forms (XEP-0004), which you learn about
    in the next chapter. Groupie''s needs are modest so the default room configuration
    will be sufficient.


    # Understanding Roles and Affiliations


    You''ve already seen that everyone in a group chat has a role and an affiliation
    assigned. Occupants will have a role of participant and an affiliation of member,
    but as saw with room creation, the room''s creator has a role of moderator and
    an affiliation of owner. It''s time to learn a little more about roles and affiliations
    because they are important for one of the most essential pieces of chat rooms,
    community management.


    Roles and affiliations enable or restrict functionality, but they also operate
    on different time scales. An affiliation is a long-term property that persists
    across the room, but roles apply only to the current visit. For example, when
    the room''s owner joins the room, their role is moderator, and when they leave,
    their role remains none as owner.


    Roles and affiliations are mostly hierarchical, and each level has all the properties
    of the previous one as well as a few new ones. Table 8-1 defines the defined roles
    and their normal meanings, and Table 8-2 lists the possible affiliations.


    Table 8-1: Group Chat Roles


    | ROLE | PRIVILEGES |

    | --- | --- |

    | None | No permissions — not in the room |

    | Visitor | Observe conversation, but can''t talk |

    | Participant | Can fully participate in public conversation |

    | Moderator | Can remove users from the room, or promote participants to visitors
    |


    Table 8-2: Group Chat Affiliations


    | AFFILIATION | PRIVILEGES |

    | --- | --- |

    | Outcast | Banned from the room |

    | None | Can join the room |

    | Member | Can join if room is members-only, and can retrieve the member list
    |

    | Admin | Can ban members or unaffiliated users; can add and remove the member
    affiliation or the moderator role |

    | Owner | Can add and remove admins and owners; can configure or destroy the room
    |


    Using the information in Table 8-1 and Table 8-2, you can begin to see how community
    management is accomplished. Kicking out a rowdy participant is done by setting
    their role within the room'
  merge: -1
