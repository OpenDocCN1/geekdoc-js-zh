    Arthur should now be receiving updates and displaying them.\n\n# XHTML-IM\n\n\
    It didn't take long for the XMPP community to get bored with plain text messages.\
    \ XHTML-IM (XEP-007) was created to reuse XHTML's existing formatting and inline\
    \ CSS styling to make messages more structured and as visually pleasing. Many\
    \ XMPP clients support supporting and receiving XHTML-IM messages, and XMPP services\
    \ like Identica use XHTML-IM to add content to messages.\n\nXHTML-IM is a stripped-down\
    \ version of XHTML designed to be appropriate for the use case of small messages.\
    \ Embedded objects, script, styles, and content transformations are removed, leaving\
    \ a basic set of markup and inline styles. The Following is an example <message>\
    \ stanza using XHTML-IM. Note that a normal <body> element and an XHTML-namespaced\
    \ <html> element are provided, allowing for graceful fallback if XHTML-IM is unsupported.\n\
    \n```\n<message from='bingley@netherfield.lit'\n  to='janelongbourne.lit'\n  type='chat'>n\
    \  <body>I hope my dear friends join me at Netherfield for this Tuesday.</body>\n\
    \  <html xmlns='http://jabber.org/protocol/xhtml-im'>\\    <p style='font-weight:\
    \ bold;'>I hope my dear friends join me at Netherfield for this Tuesday.</p>\n\
    \  </html>\n</message>\n```"
