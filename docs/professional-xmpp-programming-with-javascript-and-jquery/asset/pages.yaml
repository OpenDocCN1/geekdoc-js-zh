  md: "The referee will also need to send errors to clients that make the illegal\
    \ or unexpected requests. Create the following function, send_error(), and add\
    \ it to the Referee object:\n\n```\nsend_error: function (iq, etype, ename, app_error)\
    \ {\n  var error = $(iq).attr('from'),\n    id: $(iq).attr('id'),\n    type: 'error');\n\
    \  .node(iq.clonode(true)).up()\n  c('error', (type: etype))\n  c(ename, (xmlns:\
    \ Strophe.NS_STANZAS)).up();\n\n  if (app_error) {\n    c(error, (xmlns: Referee.NS_TOETEM));\n\
    \  }\n\n  Referee.connection.send(error);\n```\n\nThis function is quite handy\
    \ because the referee will have to deal with a list of errors.\n\nBecause the\
    \ referee will often need to check if a player is on the waiting list, the is_waiting()\
    \ function is also helpful to have. Add the following code to the Referee object\
    \ to implement this:\n\n```\nis_waiting: function (jid) {\n  var bare_jid = Strophe.getBareJidFromJid(jid);\n\
    \n  var i;\n  for (i = 0; i < Referee.waiting.length; i++) {\n    var wjid = Strophe.getBareJidFromJid(Referee.waiting[i]);\n\
    \    if (wjid === bare_jid) {\n      return true;\n    }\n  }\n  return false;\n\
    }\n```\n\nJust like the remove_waiting() function, is_waiting() looks for a player's\
    \ JID by traversing the list.\n\nNow you can implement the on_iq() function, which\
    \ handles many of the interactions with players. In this version, only the waiting\
    \ and stop-waiting commands are implemented. Add the following code to the Referee\
    \ object:\n\n```\non_iq: function (iq) {\n  var id = $(iq).attr('id');\n  var\
    \ from = $(iq).attr('from');\n```"
