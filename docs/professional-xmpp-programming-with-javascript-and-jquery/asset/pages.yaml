  md: "# CHAPTER 4 EXPLORING THE XMPP PROTOCOL: A DEBUGGING CONSOLE\n\nNext, you'll\
    \ need to modify show_traffic() to use something besides Strophe.serialize() to\
    \ generate the representation. In the following code, Peek.pretty_xml() has replaced\
    \ the old serialization on the highlighted line:\n\n```\nshow_traffic: function\
    \ (body, type) {\n  if (body.childNodes.length > 0) {\n    var console = $('#console').get(0);\n\
    \    var at_bottom = console.scrollTop >= console.scrollHeight;\n    console.clientHeight;\n\
    \n    $.each(body.childNodes, function () {\n      $('#console').append('<div\
    \ class=' + type + '>' + \n      Peek.pretty_xml(this) + \n      '</div>');\n\
    \    });\n  }\n}\n```\n\ncode snippet peek.js\n\nNext, you'll need to implement\
    \ pretty_xml(). The implementation in Listing 4-3 is recursive. It styles the\
    \ opening tag and its attributes; the function calls itself for each child tag;\
    \ and finally, it closes the tag. There are a few extra cases to handle the text\
    \ children and empty tags. Each line of the output is in its own `<div>` element,\
    \ and the text children are on the outside, potentially multiline `<div>`.\n\n\
    You might want to put the puts into strings, part by part, using an array instead\
    \ of concatenating them with +. Using an array to hold parts of a larger string\
    \ and joining it all together at once is a common optimization in JavaScript.\
    \ JavaScript strings are immutable, a new string must be created when two strings\
    \ are joined. Waiting until all the small strings are created to do final concatenation\
    \ saves cost of intermediate string creation by the interpreter. Simple string\
    \ concatenation patterns exists for other programming languages with immutable\
    \ strings like Python and Java.\n\n# LISTING 4-3: The pretty_xml() function in\
    \ peek.js\n\n```\npretty_xml: function (xml, level) {\n  var i, j;\n  var result\
    \ = [];\n  if (!level) {\n    level = 0;\n  }\n\n  result.push('<div class='xml_level='\
    \ + level + ' >');\nn  result.push('<span class='xml_punc&lt;</span>');\nn  result.push('<span\
    \ class='xml_tag>');\nn  result.push(xml.tagName);\n  result.push('</span>');\n\
    n\n  var attrs = xml.attributes;\n```"
