  md: "# Custom Event Handlers\n\nThe jQuery library makes it easy to create and use\
    \ your own custom events. These custom events are often used to make code easier\
    \ to read and reduce coupling between components. For example, instead of placing\
    \ all the code for connecting to an XMPP server inside the function that handles\
    \ the user's click on the Connect button, you can have the click event handler\
    \ trigger a custom event called connect and place the connection in the connect\
    \ event handler.\n\nUsing custom events makes it easy to extend the code without\
    \ having to change the flow in multiple locations. If more things needed to happen\
    \ in response to the connect event just described, you can simply add another\
    \ handler for that event containing the new logic; there is no need to add more\
    \ complexity to the login dialog box's code.\n\nTo fire custom events, you call:\n\
    \n```\n$(document).trigger('event_name', event_data);\n```\n\nThe event's name\
    \ can be anything you want, although it is not wise to use the same names as normal\
    \ DOM events like click and keypress. The event_data parameter can be set to anything\
    \ you'd like to pass to the event handler, or if you don't want to pass anything\
    \ extra, you can omit it entirely.\n\nYou create a handler for these events using\
    \ bind:\n\n```\n$(document).bind('event_name', function (e, data) {\n  var event_data\
    \ = data;\n});\n```\n\nThis sets up the function as a handler for the event_name\
    \ event. The first parameter passed is the event object, similar to the one that\
    \ gets passed for normal DOM events. The second parameter is the same event_data\
    \ passed into trigger().\n\nYou see shortly how namespace objects, the document\
    \ ready handler, and custom event handlers interact as you develop the initial\
    \ code for Hello.\n\n# MAKING CONNECTIONS\n\nBefore Hello can send any data to\
    \ the server, it must first establish a connection. You will need to gather the\
    \ XMPP credentials from the user and then use Strophe to connect to the XMPP server.\
    \ Once a connection is established, Strophe uses the credentials provided to authenticate\
    \ and create a session, allowing data to be sent and received over XMPP.\n\n#\
    \ The Connection Life Cycle\n\nXMPP connections are created, destroyed, and go\
    \ through a number of phases during their lifetimes, as discussed in Chapter 1.\
    \ It is important to understand these phases, because the phase transitions are\
    \ generally where important application logic will be found. For example, if your\
    \ application needs to be connected to do anything useful, it will be waiting\
    \ for the transition to the connected phase."
  merge: -1
