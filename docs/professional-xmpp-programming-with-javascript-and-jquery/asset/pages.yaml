    \ idx1 + 1, op1[2]];\n    }\n  }\n}\n};\n```\n\n# # EXTENDING THE XMPP PROTOCOL\n\
    \nIn previous applications you have used much of the core XMPP protocol and several\
    \ important extensions, but you've not yet created your own extensions. Creating\
    \ protocol extensions is an important part of XMPP development, and sometimes\
    \ you'll even need to create extensions of another protocol.\n\nXML documents\
    \ are easily extensible through the use of namespaces. Every attribute or element\
    \ attached to some namespace, can be added under different namespaces. XMPP systems\
    \ are designed to ignore XML under namespaces they don't recognize, but they will\
    \ forward the payloads along to their final destinations. This combination of\
    \ features makes XMPP easy to extend, and the community around developing extensions\
    \ has used these features to create nearly 300 protocol extensions.\n\n# # Ignoring\
    \ the Unknown\n\nXMPP extensions work because XMPP systems do not require knowledge\
    \ of every bit of XML passing through. New things can be added without breaking\
    \ existing XMPP software, and anything unknown will not be ignored, but will be\
    \ preserved until it is finally delivered to its destination.\n\nThis principle\
    \ of ignoring the unknown is adhered to every piece of the XMPP stack. servers\
    \ do not know anything about typing notifications, these can still be sent from\
    \ one client to another. Clients, likewise, may not understand some features of\
    \ other clients; this does not cause them to break, and the strange features are\
    \ simply ignored.\n\nIt is hard to know how developers or even end users use a\
    \ protocol. Therefore, it is best to remain as flexible as possible, leaving room\
    \ for future growth and change. If XMPP did not ignore unknown protocol elements,\
    \ it is likely that it would still be limited to the few uses for which it was\
    \ originally designed."
