  md: '# Designing the Protocol 27


    <already-collaborating xmlns=''http://metajack.im/ns/netpad/>

    </error>

    <presence>


    This error''s general condition is <recipient-unavailable>, which is the most
    appropriate choice for the situation. The type of the error is wait, signaling
    retrying in the future may prove successful. The original contents of the failed
    request are also included.


    Alternatively, if the session request is successful, Bingley should send an acknowledgement
    to Darcy. Also, Bingley may have already started working on his document; Darcy
    must be the current text so that Bingley''s future editing commands make sense.


    You can use a <message> stanza to respond to the session request and include the
    contents of the document with it. A new element is needed to signal that this
    <message> stanza is part of the document. Since this is the official start of
    the editing process, it seems reasonable to call this <start>. The following example
    shows Bingley''s response to Darcy''s session request:


    ```

    <message to=''darcy@pemberley.lit/library''

    from=''bingley@netherfield.lit/drawing_room''

    type=''chat''>

    <start xmlns=''http://metajack.im/ns/netpad>

    Dear Jane

    </start>

    ```


    Darcy receives the <start> acknowledgement of what appears to be the beginnings
    of a letter to Jane. If Bingley had not yet anything, the <start> element will
    be empty.


    Darcy can determine the editing session by sending an unavailable presence or
    going offline, but Bingley also needs the ability to stop the session. You can
    add a <stop> element to a <message> stanza to accomplish this, and this is in
    the following example:


    ```

    <message to=''darcy@pemberley.lit/library''

    from=''bingley@netherfield.lit/drawing_room''

    type=''chat''>

    <stop xmlns=''http://metajack.im/ns/netpad/>

    </message>

    ```


    Both parties can terminate a session.


    # Editing Operations


    Once a session is underway, the parties need to send editing operations to each
    other. These can be easily carried by new elements inside <message> stanzas. The
    new element is called <op>, and it must carry the name of the operation and its
    parameters. Also, operation requests must include the state vector and the operation''s
    priority.


    Because the name, position, and character attributes of operation are single values,
    they are placed in the attributes of an <op> element. The state vector and priority
    value are lists of numbers, so each of these is encoded as a container of child
    elements holding the individual cell values. State'
