  md: '# APPLICATION PREVIEW


    Before you start on each application, there will be a few screenshots of what
    the final result will look like.


    Figure-3-1 and Figure-3-2 show a glimpse of the future of your XMPP programming
    career. These screenshots let you see what the final application will look like,
    and they also provide a reference point that you can compare your work against.


    The login dialog box shown in Figure 3-1 opens when the application starts and
    accepts the user''s XMPP address and password. Once the application has sent a
    message to the server, the server''s response is displayed similarly to Figure
    3-2.


    ![](img/eb420c48595351b731631bccf1c8fdc4_65_0.png)


    FIGURE 3-1


    ![](img/eb420c48595351b731631bccf1c8fdc4_65_1.png)


    FIGURE 3-2


    The user interfaces are kept deliberately simple to let you concentrate on the
    XMPP protocol and JavaScript code.


    # HELLO DESIGN


    Every application is composed of small pieces that fit together in a particular
    way. These pieces may be interface elements, XMPP protocol handlers, or implementations
    of a certain process. In each chapter, you first learn about the various pieces
    involved in the chapter''s application and how they fit together to form a cohesive
    whole.


    The first application is called Hello, and you''ve already seen the two visible
    pieces in Figure 3-1 and Figure 3-2: the login dialog box and the server response
    screen. There are a few pieces you can''t see as well: the XMPP connection handling,
    XMPP stanza generation, and the event handling.


    When a user first opens the application, they are presented with the login dialog
    box in order to enter their XMPP username and password. When the user then clicks
    Connect, Hello must initiate a connection to the XMPP server and authenticate
    the user.'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'Once connected, Hello''s task is to send a simple stanza to the user''s server
    and wait for the server''s reply. The Strophe library provides the ability to
    attach handlers to a connection in order to respond to specific stanzas. You will
    see that these handlers make dealing with incoming requests and responses very
    easy.


    Finally, Hello displays a more human-readable version of the server''s reply and
    disconnects.


    Hello is not an ambitious application, but as you see throughout the book, the
    same XMPP tools used here are repeated in every application.


    # PREPARING THE WAY


    Before you can get started writing code, you must collect a few JavaScript libraries
    that you will use to build the applications. You will need the following:


    +   - jQuery: The jQuery library makes dealing with HTML and CSS a breeze, and
    it is also extremely handy for manipulating XML, and therefore, XMPP stanzas.

    - jQuery UI: The jQuery UI library provides some user interface building blocks
    that you will need, including dialog boxes and tabs.

    - Strophe: The Strophe library makes writing XMPP client applications extremely
    simple and is available in multiple programming languages. You''ll be using the
    JavaScript version of course!

    - fXHR: Strophe can use of fXHR, a replacement for the standard XMLHttpRequest
    API, to make dealing with JavaScript''s same origin policy. Normally, a JavaScript
    application cannot talk to external servers, but with the help of flax and fXHR,
    Strophe can overcome this restriction.


    Additionally, if you do not already have an XMPP account on a public server, you
    need to create one.


    SAME ORIGIN POLICY


    JavaScript code runs in a sandboxed environment for security reasons. Though web
    applications can load JavaScript code from anywhere, all the code must restrict
    its communication to the server that hosts the web application. This restriction
    is called the same origin policy.


    In times, it has become common to find workarounds to this policy so that more
    interesting applications can be built. Most web applications including jQuery,
    already provide some methods for making cross-domain requests. Unfortunately,
    the normal workarounds for HTTP GET operations do not work for XMPP, which must
    use HTTP POST instead.


    This book uses the fXHR library to enable cross-domain requests, but other solutions
    are possible. The most common alternative is to use reverse proxies to make the
    BOSH connection manager appear local to the application''s home server. This alternative
    is discussed in Appendix B.'
