  md: '# CHAPTER 10 WRITING WITH FRIENDS: COLLABORATIVE TEXT EDITOR


    Each user''s editing actions will generate a sequence of these operations. It
    is important that the sequence of operations be executed in the proper order.
    For example, consider the four operations insert(0, ''c''), insert(0, ''b''),
    insert(0, ''a''), and delete(0). Permuting the order of these operations would
    result in a different string. ace. If the two operations are switched, the resulting
    string becomes ac.


    Each user''s operations generate ace and, other users must execute them in the
    same order. In addition, the total set of operations has an order as well, unlike
    local operations, this ordering is not always complete. It is possible for two
    users to generate different operations simultaneously on the same string. These
    operations are overlapping and cannot be ordered in relation to each other.


    Figure 10-2 and Figure 10-3 illustrate these two cases. In both figures user,
    u, and u₂, generates an operation, o₁, and o₂, respectively. In Figure 10-2, o₁
    is executed by u before they generate o₂. However, in Figure 10-3, u, and u₂ perform
    simultaneous operations that overlap.


    ![](img/eb420c48595351b731631bccf1c8fdc4_279_0.png)


    ADAPTED FROM FIGURE 2 OF "CONCURRENCY CONTROL IN GROUPWARE SYSTEMS" BY Ellis and
    Gibbs, ACM Sigmoid RECORD, ACM 18(2), 1989.


    # FIGURE 10-2


    ![](img/eb420c48595351b731631bccf1c8fdc4_279_1.png)


    ADAPTED FROM FIGURE 2 OF "CONCURRENCY CONTROL IN GROUPWARE SYSTEMS" BY Ellis and
    Gibbs, ACM Sigmoid RECORD, ACM 18(2), 1989.


    # FIGURE 10-3


    The case where operations overlap is the crux of the collaborative editing problem.
    Non-overlapping cases can be easily handled by keeping track of the order of operations,
    and enforcing execution in the correct order. Overlapping operations, however,
    have no ordering. How are these to be executed?


    Overlapping operations must be transformed into new operations that can be ordered,
    and this where the name "operational transformation" comes from. Because u knows
    the state on o₂, they can transform o₁ into an operation that accounts for the
    local operation o₁. Similarly, u₂, can transform o₁ for the changes made by o₂.


    Imagine both u and u₂ have the string ace in their editors. Each user simultaneously
    does an insert operation; o₁, performed by u, is insert(1, ''b''), and o₂, performed
    by u₂, is insert(2, ''d'').

    First, what happens when these operations are not transformed. The first user
    executes o₁, and then receives and executes o₂, the resulting string is abdee.
    The second user executes o₂ and then o₁, and ends up with the string abcde. Each
    user now has an inconsistent view of the data, and only one of them has the correct
    version.'
