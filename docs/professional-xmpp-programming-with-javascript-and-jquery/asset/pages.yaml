  md: "# 424 | APPENDIX A GETTING STARTED WITH JQUERY\n\naddClass() and removeClass()\
    \ the CSS classes that are in effect for the selected elements. Provide a fast\
    \ way to change lots of CSS styles at once, without having to specify them all\
    \ individually.\n\n# Adding and Removing Elements\n\nShowing and hiding elements\
    \ works well for a lot of things, but sometimes you will have to add or remove\
    \ elements completely from the DOM. For example, in Chapter 6's chat application,\
    \ when items are added to the contact list.\n\nYou can add content with append()\
    \ and prepend(), or with the previously mentioned html() function. Each of these\
    \ functions takes a string containing the new HTML to append, prepend, or replace.\n\
    \nremove() deletes the selected elements from the DOM. empty() removes all the\
    \ child elements for each element in the selection, and is often used to clear\
    \ lists or whole <div>s.\n\n# Iterating over Selections\n\nApplications will often\
    \ need to perform some function over all the elements in a selection. In popular\
    \ languages, this is often done with the aid of a for or while loop, but jQuery\
    \ allows you to do this easily by borrowing patterns from functional programming.\n\
    The jQuery object supports the length attribute, just like JavaScript arrays,\
    \ and each element in the selection can be accessed with normal bracket notation\
    \ for arrays. Using these properties, the following code follows the traditional\
    \ iteration pattern to add contacts to a list:\n\n```\nvar i;\nvar items = $(stanza).find('.item');\n\
    for (i = 0; i < items.length; i++) {\n  $('#contact_list').append('<li>' + items[i].attr('jid')\
    \ + '</</li>');\n}\n```\n\nThis code finds all <li>elements in an XMPP stanza\
    \ and extracts the jid attribute from each and adds this new elements to a contact\
    \ list. Note that items[i] is wrapped by $ because it is a normal DOM element,\
    \ not a jquery selection; after calling $() on the element, it will be a normal\
    \ jQuery selection of just the one element.\nThe same actions can be accomplished\
    \ using jQuery's each() method on the initial selection:\n$(stanza).find('.item').each(function\
    \ () {\n  $('#contact_list').append('<li>' + $(this).attr('jid') + '</li');\n\
    });\n\neach takes a function as its argument, and that function performs the desired\
    \ action for each item. Each time the function is called, the item is, this variable\
    \ represents the current item of the iteration. Again, because the item is a normal\
    \ DOM element, to use the attr() method, it must first be wrapped by the $() function.\n\
    Notice that lots of unnecessary things have been eliminated, such as the variable\
    \ i, to leave a very readable bit of code."
