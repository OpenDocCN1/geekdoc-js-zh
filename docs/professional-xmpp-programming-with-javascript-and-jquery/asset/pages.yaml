  md: '# Keeping Track of Users


    Keeping track of users is quite important. For starters, the other players will
    want to know who is available to play and who is already playing. Even more importantly,
    the referee must gracefully handle the situation where players leave unexpectedly.


    If a player leaves who is not playing or in the waiting list, it is not a concern.
    However, if a player in a game or a player in the waiting list leaves, the consequences
    will be felt by other users. It will be frustrating for users if they click a
    player''s Play button and that player is no longer there. Even worst is the exit
    of a player during a game.


    The first case is easily handled by removing the player from the list of waiting
    players. In the second case, a decision must be made on how to handle the situation.
    To Toetem, the simplest solution is used, which is to forfeit the player who leaves
    the game. But it prevents the most common form of abuse—cheating by leaving in
    a losing position.


    The Toetem protocol uses directed presence to keep track of players. To interact
    with the referee, the user must first direct it. From then on, the referee will
    know when the user becomes unavailable, and the referee can take the appropriate
    action. This is the same technique used by NetPad in Chapter 10 and by multi-user
    chat rooms.


    The following example <presence> stanza Darcy registering with the referee. Note
    that the namespace used for the Toetem protocol is http://metajack.im/ns/toetem.


    ```

    <presence to=''referee@pemberley.lit/toetem''

    from=''darcy@pemberley.lit/library''>

    <register xmlns=''http://metajack.im/ns/toetem''>

    </presence>

    ```


    When a player leaves, the referee will receive a stanza similar to this:


    ```

    <presence to=''referee@pemberley.lit/toetem''

    from=''darcy@pemberley.lit/library''

    type=''unavailable''>

    ```


    Once a player registers with the referee, the current list of waiting players
    and active games will be sent in a <message> stanza. Darcy receives the <message>
    stanzas after registering:


    ```

    <message to=''darcy@pemberley.lit/library''

    from=''referee@pemberley.lit/toetem''

    <waiting xmlns=''http://metajack.im/ns/toetem>

    <player id=''elizabeth@longbourn.lit/sitting_room''/>

    </waiting>

    </message>

    ```


    ```

    <message to=''darcy@pemberley.lit/library''

    from=''referee@pemberley.lit/toetem''

    <games xmlns=''http://metajack.im/ns/toetem''>

    ```'
