    Elizabeth has specified both the node she wants to subscribe to as well as the
    address to which should be delivered. As long as she stays a subscriber, she''ll
    be immediately notified Whenever Mr. Darcy finishes a book and publishes a corresponding
    correspondence.


    The server sends a successful response to Elizabeth''s request:


    ```

    <iq from=''pubsub.pemberley.lit''

    to=''elizabeth@longbourn.lit/outside''

    type=''result''

    id=''subscribed''

    <pubsub xmlns=''http://jabber.org/protocol/pubsub''>

    <subscribe node=''latest_books''

    jid=''elizabeth@longbourn.lit/outside''

    ubscription=''subscribed''/>

    </pubsub>

    </iq>

    ```


    The subscription attribute informs Elizabeth about the status of her subscription,
    and in this example, it informs she is fully subscribed. Pubsub nodes can be configured
    with a variety of access models, some of which require the owner''s node to approve
    broadcasts requests. If Mr. Darcy does not configure this, the subscription attribute
    would have a value of pending.


    If some reason Mr. Darcy had configured this node to allow only a specific set
    of people to subscribe (a whitelist access model), Elizabeth''s request might
    have returned with a not-allowed error:


    ```

    <iq from=''pubsub.pemberley.lit''

    to=''elizabeth@longbourn.lit/outside''

    type=''error''

    id=''subscribed''

    <pubsub xmlns=''http://jabber.org/protocol/pubsub''>

    <subscribe node=''latest_books''

    jid=''elizabeth@longbourn.lit/outside''/>

    </pubsub>

    <error type=''cancel''>

    <not-allowed xmlns=''urn:ietf:params:xml:ns:xmmp-stanzas''>

    <closed-node xmlns=''http://jabber.org/protocol/pubsub#errors''/>

    </error>

    </iq>

    ```


    Now that Elizabeth has subscribed, she''ll receive event broadcasts when Mr. Darcy
    finishes a book. Event broadcasts are sent in <message> stanzas containing an
    <event> child with the http://jabber.org/protocol/pubsub#event namespace. The
    <event> element will contain one or more <item> elements wrapped in an <items>
    element; the payloads are contained within the <items> elements, if included.
    In this example, a item appears, and the item''s id attribute'
