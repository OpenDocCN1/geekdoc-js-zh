  md: "# Implementing Sessions and the Waiting List\n\n```\nvar type = $(iq).attr('type');\n\
    \n// make we know the user's presence first\nif (!Referee.presence[Strophe.getBareJidFromJid(from)])\
    \ {\n    Referee.send_error(iq, 'auth', 'forbidden');\n} else {\n    var child\
    \ = $(iq).find('*[ns=' + Referee.NS_TOETEM + ']:first');\n    if (child.length\
    \ > 0) {\n        if (type === 'get') {\n            Referee.send_error('cancel',\
    \ 'bad-request');\n            return true;\n        } else if (type == 'set')\
    \ {\n            // ignore IQ-error and IQ-result\n            return true;\n\
    \        }\n\n        switch (child[0].tagName) {\n            case 'waiting':\n\
    \                Referee.on_waiting(id, from, child);\n                break;\n\
    \n            case 'stop-waiting':\n                Referee.on_stop_waiting(id,\
    \ from, child);\n                break;\n\n            default:\n            \
    \    Referee.send_error(iq, 'cancel', 'bad-request');\n        }\n    } else {\n\
    \        Referee.send_error(iq, 'cancel', 'feature-not-implemented');\n    }\n\
    }\n\nreturn true;\n```\n\nThis function first checks whether the referee is tracking\
    \ the user making the request; the appropriate error is sent if this is not the\
    \ case. If the request is from a tracked client, the function looks for a Toetem\
    \ command in an IQ-set stanza, and if not found, responds with an error. For the\
    \ waiting command, on_iq(iq) delegates the behavior to on_waiting(); the stop-waiting\
