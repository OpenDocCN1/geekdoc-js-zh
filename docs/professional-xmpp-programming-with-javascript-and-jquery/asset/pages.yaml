  md: '# APPLICATION PREVIEW


    The final version of the NetPad application is shown in Figure 10-1. It has a
    simple UI, but is never-theless quite powerful.


    ![](img/eb420c48595351b731631bccf1c8fdc4_277_0.png)


    FIGURE 10-1


    A large editing area takes up most of the screen. A status area and a disconnect
    button should appear at the top, and the chat area appears at the bottom. Not
    only can the two collaborators work on the same text, but they can chat with each
    other about their ideas.


    # NETPAD DESIGN


    Like any editor, NetPad''s primary focus is to edit text. It is easy to accept
    local edits to the text, but NetPad must also support editing operations coming
    from a remote user. Most of the work of building NetPad is supporting these remote
    operations. The chat area is a slimmed-down version of the functionality from
    Chapter 6''s Gab application, and by now you should be comfortable with the private
    messaging peers that are needed.


    To allow users to collaborate on the same text, NetPad uses the theory of operational
    transformation. Local editing actions are expressed as operations on the text
    and sent to the remote party. Remote operations are received and transformed into
    slightly modified versions; after these modified versions are applied, both parties
    end up with a consistent view of the text.


    NetPad must establish an editing session between a pair of users, send local operations
    to the other party, and process incoming remote operations. These operations will
    be encoded into XML as an'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'extension to the <message> stanzas. The application uses <presence> stanzas
    for establishing sessions and <message> stanzas for communicating editing operations.


    Of course, not every user will be capable of collaborating on a NetPad document,
    so NetPad must first determine whether the potential collaborator''s client has
    this editing functionality. This can be done with Service Discovery, which you
    saw in Chapter 7.


    NetPad''s design is rather simple, but operational transformation and XMPP protocol
    extensions are both worthy of a thorough investigation. Once these concepts are
    explained, you will be ready to design the NetPad protocol and build NetPad.


    # OPERATIONAL TRANSFORMATION


    Ellis and Gibbs presented the concept behind operational transformation in their
    paper "Concurrency Control in Group Systems." This paper is an excellent example
    of an academic article that is extremely readable, turning a complex topic into
    a simple description. The algorithm that NetPad uses is based on the work of these
    researchers.


    Collaborative editing is a form of real-time groupware. These types of applications
    have many interesting and important properties. First, they are highly interactive,
    real-time, distributed network applications. These properties are true of most
    of the applications in this book. Groupware applications are ad-hoc and volatile
    in nature; there is no telling what actions users will take or what order they
    take in, and the users may go freely. Finally, these types of applications are
    quite chaotic; each user of the system is interacting with the same data and making
    conflicting changes.


    The main challenge of group applications is consistency. The view that one user
    of a document should be as close as possible to the other users'' views of the
    same information. When editing operations have stopped, the resulting documents
    should all be identical. This allows users to work cooperatively at the end of
    each session


    Concurrency problems are not unique to groupware applications, but the real-time
    and distributed properties of these systems make most common solutions to the
    concurrency impractical. For example, database management systems have often supported
    various forms of concurrency control, but they accomplish this by disallowing
    conflicting operations altogether. Other systems allow only one editor at a time,
    and this ability passes from user to user. The low latency and interactivity required
    by groupware necessitates a different approach.


    # Basic Principles


    The operational transformation algorithm is concerned with a group of users, the
    operations users can perform, and the order in which each user executes these
    operations.


    The set of operations that NetPad needs is simple — inserting a character and
    deleting a character. The insertion operation takes two arguments — the character
    and the position at which to place it. This operation is written as `insert(pos,
    char)`. The deletion operation needs only the position at which to delete a character
    and is written as `delete(pos)`'
