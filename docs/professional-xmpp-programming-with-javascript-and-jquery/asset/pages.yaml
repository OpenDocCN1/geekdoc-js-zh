  md: "Tape also supports a simple configuration file that you can put in your XMPP\
    \ application's directory. This file is named .taperc. The following .taperc example\
    \ emulates the previous example using the -p and -P options:\n\n```\n[server]\n\
    port = 8000\n\n[proxies]\nxmpp-httpbind = http://bosh.metajack.im:5280/xmpp-httpbind\n\
    ```\n\nTape makes it easy to fire up an instant web server that corrects the URL.\
    \ With a .taperc file in each XMPP application's directory, you can simply switch\
    \ to the new project and view tape, and your application will be immediately available\
    \ with the correct configuration.\n\nTape is also useful for serving the Flash-associated\
    \ version of Strophe's security policy requires that you compile the Flash code\
    \ either for file:// URL access or http:// URL access. In order to use a Flash\
    \ object with http:// URLs, the Flash object will need to be served from an http://\
    \ URL. If you don't already have a web server set up and ready to go, Tape makes\
    \ a substitute during development.\n\n# MORE BOSH CONNECTION MANAGERS\n\nMore\
    \ BOSH connection managers are available than the ones highlighted in this appendix.\
    \ The following is a list of the other popular options and where you can find\
    \ more information about them: \n\n+   Openfire, an XMPP server written in Java\
    \ with BOSH support, http://www.igniterealtime.org/projects/openfire/index.jsp\n\
    Tigase, another XMPP server written in Java with BOSH support, http://www.tigase.org/\n\
    Prosody, the lightweight, easy-to-use XMPP server written in Lua, http://prosody.im/\n\
    JabberHTTPBbind, a Java servlet-based standalone connection manager, http://blog.jwchat/org/jhb/\n\
    rhb, a standalone connection manager in Ruby, http://rubyforge.org/projects/rhb/"
