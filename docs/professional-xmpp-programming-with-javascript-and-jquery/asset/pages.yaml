  md: '# Setting Up a BOSH Connection Manager


    Web browsers do not speak XMPP. In order to use XMPP in web applications, a middleman
    is needed that turns the stateless HTTP requests into stateful and long-lived
    XMPP connections. The details surrounding this process are called Bi-directional
    Over Synchronous HTTP (BOSH), and a server that provides this service is is called
    a connection manager.


    This chapter gives you the information you need to choose and install a BOSH connection
    manager for your XMPP applications. The applications in this book have all used
    a public BOSH connection manager provided by the author for testing purposes.
    If you plan to make your application widely applicable, you will probably want
    to set up your own.


    Due to JavaScript''s origin policy (see the Same Origin Policy section of Chapter
    3), direct communication with a connection manager is typically treated as a security
    violation. To circumvent this policy, the applications in this book have used
    a library called flXHR to allow cross-domain requests. Alternatively, you can
    use a reverse proxy to make the connection appear to be part of your own web server.


    The last section of this appendix shows you how to configure a reverse-proxied
    connection manager for the cases where Flash is not possible or not desirable.


    # CHOOSING A CONNECTION MANAGER


    Connection managers come in two main flavors: built-in to an XMPP server or standalone
    managers. Each type has its own advantages and disadvantages and, accordingly,
    may be more or less appropriate for your particular application.'
  merge: -1
  pgno: 454
- img_proc: true
  md: '# Standalone Managers


    The original connection managers were all standalone, because the XMPP server
    teams had not yet had time to integrate BOSH services into their systems. A standalone
    connection manager runs as a separate service or daemon, possibly on a machine
    far from any XMPP server.


    Standalone managers can typically connect to any XMPP server reachable on the
    Internet. When a request comes in for an XMPP connection, the connection manager
    initiates a normal XMPP client connection to the desired server on behalf of the
    requesting party. This makes a standalone manager a great choice when the application''s
    users already have XMPP accounts across a variety of different XMPP servers.


    Because a standalone manager must maintain XMPP connections on behalf of users,
    there is extra overhead to connect. In addition to the normal TCP connection to
    the XMPP server, there will be two or more HTTP connections as well. This means
    that for every user of the connection manager at least three TCP sockets be needed.


    The benefit of this is standalone BOSH connection managers are often more scalable
    than the built-in ones. This is a result of the decoupling of the BOSH service
    from the rest of the XMPP server. Scaling a standalone connection manager is achieved
    with the normal methods for scaling other HTTP services, but scaling a built-in
    manager relies on the scalability of the underlying XMPP server.


    # Built-In Managers


    Most XMPP servers now come with built-support for BOSH. These built-in connection
    managers are easy to set up; they generally require only a small change to the
    server''s configuration to enable them. This means they are often a programmer''s
    first stop when looking for a connection manager for their applications.


    Unlike their standalone counterparts, built-in managers cannot establish XMPP
    connections to external servers, only the server they are running on. This makes
    them ideal for applications where all users have accounts on the server where
    the connection manager is located or where all users are connecting anonymously.


    Built-in managers have low overhead because they are coupled to the XMPP server.
    There is no need for a TCP connection to the server, because the connection manager
    is running as part of the server. A built-in manager can convert the HTTP requests
    directly into internally routed packets without going through an extra network
    layer.


    Another benefit of efficiency gained by built-in managers is decentralized serialization
    costs. Normally applications will serialize XML data in a specialized data structure
    that makes the data easy to manipulate and retrieve. When writing the XML to a
    socket for transmission to the server, this data structure must be serialized
    into actual XML. In high-performance situations, this serialization cost can be
    substantial. Standalone connection managers must often re-serialize the data they
    receive for transmission to the external XMPP server, but built-in managers can
    avoid this extra step.'
  merge: -1
  pgno: 455
- img_proc: true
  md: 'Finally, built-in managers are well tested with their corresponding servers
    because they are developed as a unit. Standalone connection managers are generally
    tested against a wide variety of servers, but it is hard to beat the stability
    afforded by direct integration by the same team of programmers who write the XMPP
    server.


    # Connection Manager Trade-offs


    Each connection manager has its own strengths and weaknesses.


    # Support for External Servers


    Standalone connection managers can connect to any XMPP server reachable over the
    Internet, but built-in connection managers can only connect to the server that
    hosts them.


    # Setup and Configuration Complexity


    Built-in servers are easy to set up because they require only a few configuration
    file changes to an existing XMPP server. Standalone servers, however, must be
    installed and configured on their own, making them slightly more complicated.


    # Scalability


    Built-in servers can be much more efficient by saving extra serialization costs,
    but depend on the underlying layer for their scalability. Standalone servers can
    usually be scaled similarly to any other web service, though they have slightly
    higher serialization cost.


    No solution is perfect for all applications. The correct choice can only be made
    by careful consideration of the needs of your own applications.


    # PUNJAB: A STANDALONE MANAGER


    If your application demands a standalone connection manager that can make connections
    to any XMPP server, Punjab can deliver. Punjab is a Python daemon written with
    the Twisted working library. It is well tested and delivers high performance.


    # Getting Punjab


    You can obtain Punjab from its site at http://code.stanziq.com/punjab. It requires
    Python 2.5 or later, and Twisted Python 8.1 or later is recommended.


    Python is available from the Python web site at http://www.python.org. If you
    are running a Linux distribution or Mac OS X, a suitable version of Python is
    probably already installed.


    You can find Twisted Python at http://www.twistedmatrix.com. Linux users will
    probably find a version of Twisted Python in their distribution''s package list,
    and Mac OS users already get a copy preinstalled with the operating system.'
  merge: -1
  pgno: 456
- img_proc: true
  md: '# Installation and Setup


    Punjab can be installed in the familiar Python fashion using setup.py. First,
    extract the compressed files in the distribution to a directory of your choice.
    Next, run the following command to install Punjab:


    ```

    python setup.py install

    ```


    Once installed, you can configure Punjab by creating a .tac file for it. A .tac
    file contains the application''s configuration, and Twisted''s twisted command
    uses this when it launches Punjab.


    The Punjab package comes with a default punjab.tac file, which configures Punjab
    to run on port 5280 with a BOSH URL of /xmpp-httpbind. This default configuration
    is usually enough but feel free to change these settings if your application needs
    something different. The values you will want to change should be clear when you
    view the file.


    # Starting and Testing Punjab


    Punjab is started by the twisted command. To start Punjab as a background process,
    or daemon, run the following command:


    ```

    twisted -y punjab.tac

    ```


    If you''d run Punjab in the foreground here you can add the parameter -n to the
    command as follows


    ```

    twisted -ny punjab.tac

    ```


    Whichever way you choose, Punjab should start up normally and respond on port
    5280 (the port you choose in the configuration). If you are running Punjab on
    your local machine, you can visit http://localhost:5280/xmpp-httpbind to see if
    Punjab is working. If it is running on another host, use the host''s normal name
    instead of localhost.


    If Punjab is working correctly, you should see some variant of the following message
    when you visit the configured URL:


    ```

    XEP-0124 - BOSH

    ```


    Note that unless you are using the flXHR library with Strophe for cross-domain
    access, you will need to proxy Punjab into your web application''s directory tree
    to comply with JavaScript''s same origin policy.


    # EJABERD AND MOD_HTTP_BIND: A BUILT-IN MANAGER


    ejaberd is one of the most popular XMPP servers out there, and it should be no
    surprise that it comes with a BOSH connection manager to enable XMPP access over
    HTTP connections. If you are already running ejaberd as your XMPP server, it is
    very easy to enable BOSH support.'
  merge: -1
  pgno: 457
- img_proc: true
  md: "# Obtaining mod_http_bind\n\nejabber has included mod_http_bind along with\
    \ its distribution files for some time, but if you happen to use a version that\
    \ predates this practice, you can obtain mod_http_bind separately from the ejabber\
    \ modules page at http://www.ejabber.im/ejabber-modules.\n\nIf you need to get\
    \ a copy of ejabber edit or upgrade your older version, you can always find the\
    \ latest code at http://www.ejabber.im.\n\n# Configuring mod_http_bind\n\nModules\
    \ in ejabber are enabled in the ejabber.cfg file. These files are actually full\
    \ of actual syntax structures, so they don't resemble most configuration files\
    \ you might be used. They are still easy to modify if you know what to watch out\
    \ for.\n\nThe default ejabber.cfg file has some server options already enabled,\
    \ so you only need to modify them slightly to add connection manager support.\n\
    \nSearch through the ejabber.cfg file until you find a section that looks similar\
    \ to the following:\n\n```\n(listen,\n{\n  {5222\n```\n\nThis section of the configuration\
    \ file handles the ports which ejabber will listen for connections. A few lines\
    \ down, you should see a bit of configuration for port 5280:\n\n```\n(5280, ejabber_http,\n\
    \n  http_poll,\n  web_admin\n)\n```\n\nYou will need to modify this section slightly\
    \ to add support for http_bind instead of http_poll. Change the section so that\
    \ it appears as here:\n\n```\n(5280, ejabber_http,\n\n  web_admin,\n  (request_handlers,\
    \ \n    [[*xmpp-httpbind*],\n      mod_http_bind]])\n)\n```\n\nIf your configuration\
    \ file did not already have a section for port 5280, you can easily add the previous\
    \ one to the file. Just make sure to put a comma after the last section of the\
    \ list block, and add the new section. For example, the following highlighted\
    \ lines where a web section has been added to a list block that did not previously\
    \ contain one:\n\n```\n(listen,\n{\n  % some sections omitted\n\n(5269, ejabber_s2s_in,\
    \ [\n```"
  merge: -1
