  md: "# Adding New Contacts\n\nGab already works well for seeing your current contacts,\
    \ but you must also add functionality that users can create new ones. New contacts\
    \ are created in two ways: users can click Add Contact and enter in the contact's\
    \ information, or they can receive and accept a presence subscription from some-one.\n\
    \nFirst, you should set up the new contact dialog box and bind the click event\
    \ on the appropriate button to open the dialog. Add the following code to the\
    \ document ready function:\n\n```\n$('#contact-dialog').dialog({\n  autoOpen:\
    \ false,\n  draggable: false,\n  modal: true,\n  title: 'Add a Contact',\n  buttons:\
    \ {\n    Add: function () {\n      $(document).trigger('contact_added', {\n  \
    \      jid: $('#contact-jid').val(),\n        name: $('#contact-name').val()\n\
    \      });\n      $('#contact-jid').val('');\n      $('#contact-name').val('');\n\
    \n      $(this).dialog('close');\n    }\n  }\n});\n\n$('#new-contact').click(function\
    \ (ev) {\n  $('#contact-dialog').dialog('open');\n});\",\n```\n\ncode snippet\
    \ gab.js\n\nThe dialog box will fire the contact_added event when the user clicks\
    \ the Add button. You'll need to handle this event to send the appropriate XML\
    \ to actually add the contact to the user's roster. This following handler should\
    \ be added after the other document bindings at the end of gab.js:\n\n```\n$(document).bind('contact_added',\
    \ function (ev, data) {\n  var iq = $('<iq(type: \"set\").c(xmlns: \"jabber:iq:roster\"\
    )\nc(\"item\", data);\n  Gab.connection.sendIQ(iq);\n\n  var subscribe = $pres({to:data.jid,\
    \ type: \"subscribe\"});\n  Gab.connection.send(subscribe);\n});\n```\n\ncode\
    \ snippet gab.js"
