- img_proc: true
  md: "# Proxying BOSH\n\nProxies require the cooperation of a web server and some\
    \ extra configuration. To make this book’s material as simple as possible, the\
    \ Flash plug-in was used, sometimes the proposed solution is preferable. For example,\
    \ the iPhone’s web browser does not support Flash, as XMPP applications written\
    \ for that platform will need to use proxy BOSH connection managers.\n\nThe examples\
    \ in the next sections assume you already have a working BOSH connection manager\
    \ set up. If you want to experiment with proxying BOSH services without having\
    \ to set up a BOSH connection manager, you can use the BOSH service at http://bosh.metjak.im:5280/xmpp-httpbind\
    \ for testing.\n\n# Configuring Apache to Proxy BOSH\n\nThe Apache HTTP server\
    \ has been one of the most popular choices for serving web pages and applications,\
    \ and it has comprehensive proxy support via its mod_proxy module. If you use\
    \ Apache for your web application, you can add a proxy for a BOSH connection manager.\n\
    \nYou’ll need to ensure the mod_proxy module is built or otherwise available,\
    \ although it is often compiled and by default.\n\nFirst, you must allow access\
    \ to the BOSH server. You can put the <Proxy> section most anywhere, although\
    \ it is often placed within the <VirtualHost> section or in the main httpd.conf\
    \ configuration file.\n\n```\n<Proxy http://bosh.metjak.im:5280/xmpp-httpbind\n\
    \  Order allow, deny\n  Allow from all\n</Proxy>\n```\n\nThe BOSH URL is used\
    \ here http://bosh.metjak.im:5280/xmpp-httpbind, which can be used for testing,\
    \ but you should substitute your own BOSH server URL.\n\nOnce the BOSH URL is\
    \ allowed in configurations, you can add the relevant ProxyPass and ProxyPassReverse:\n\
    \n```\nProxyPass /xmpp-httpbind http://bosh.metjak.im:5280/xmpp-httpbind\nProxyPassReverse\
    \ /xmpp-httpbind http://bosh.metjak.im:5280/xmpp-httpbind\n```\n\nThese two lines\
    \ proxy the /xmpp-httpbind URL on the local server to the remote BOSH service\
    \ URL.\n\nOnce Apache has been configured, you can restart the Apache server however\
    \ normally do. You can check that the new configuration is working by visiting\
    \ the /xmpp-httpbind URL on your Apache server; you should see some mention there\
    \ of XEP-0124 or BOSH.\n\n# Configuring nginx to Proxy BOSH\n\nnginx (pronounced\
    \ “engine x”) is a small and fast web server created by Igor Syosov, and it is\
    \ used by many of the busiest Internet startups due to its amazing performance.\
    \ nginx also has great support for proxying resources, and this makes it an excellent\
    \ choice for serving XMPP-enabled applications."
  merge: -1
  pgno: 462
- img_proc: true
  md: "# 438 | APPENDIX B SETTING UP A BOS MANAGER\n\nProxies are very easy to set\
    \ up in nginx. You need only add a location block within the relevant server block.\
    \ The following example adds the location /xmpp-httpbind, which proxies the BOS\
    \ service at http://bosh.metajack.im:5280/xmpp-httpbind:\n\n```\nserver {\n  \
    \  listen 80;\n\n    # more configuration...\n\n    location /xmpp-httpbind {\n\
    \        proxy_pass http://bosh.metajack.im:5280;\n    }\n\n    # more configuration...\n\
    }\n```\n\nOnce the configuration is changed and the server restarted, you can\
    \ test the proxy setup is working by visiting the /xmpp-httpbind resource on your\
    \ nginx server.\n\n# Using Tape for Local Development\n\nIf you're developing\
    \ more than one XMPP application or if you are testing various versions of the\
    \ same application, it can be a little tedious to keep changing web server configurations\
    \ to proxy the correct BOS service. To make this kind of development easy, the\
    \ Tape program was created. Tape is a really simple web server.\n\nTape is generally\
    \ run in a directory and serves files in that directory and its subdirectories\
    \ over the Web. In addition to serving static files, it can also proxy arbitrary\
    \ URLs under the local directory tree. This can be used to proxy BOS services\
    \ for use in your XMPP applications without having to set up and configure a replica\
    \ copy of that web server.\n\nTo get the most recent version of Tape, you can\
    \ visit http://github.com/metajack/tape. Like Punjab, described earlier in this\
    \ appendix, Tape depends on the Twisted Python framework. It needs no special\
    \ installation; just put the Tape file in /usr/local/bin on OS X or Linux and\
    \ somewhere in your system path on Windows.\n\nChange to the directory where your\
    \ application is located and launch Tape:\n\n```\ncd awesome_project\ntape\n```\n\
    \nBy default, Tape serves files at http://localhost:8273 (8273 spells out T-A-P-E\
    \ on a phone number pad). You can easily tell Tape to proxy a BOS service with\
    \ the -p option on the command line:\n\n```\ntape -p /xmpp-httpbind=http://bosh.metajack.im:5280/xmpp-httpbind\n\
    ```\n\nIf port 8273 is not to your liking, you can also change the port with the\
    \ -p option:\n\n```\ntape -p 8000 -P /xmpp-httpbind=http://bosh.metajack.im:5280/xmpp-httpbind\n\
    ```\n\nTo stop running Tape, simply press Ctrl+C or kill the process."
  merge: -1
