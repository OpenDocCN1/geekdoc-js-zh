  md: '# #1


    # ## Getting to Know XMPP


    **WHAT''S IN THIS CHAPTER?**


    +   - The history of XMPP

    - XMPP networks and connections

    - XMPP''s three building block stanzas


    The Extensible Messaging and Presence Protocol (XMPP) is, at its most basic level,
    a protocol for moving small, structured pieces of data between two places. From
    this humble basis, it has been used to build large-scale instant messaging systems,
    Internet gaming platforms, search engines, collaboration spaces, and voice and
    video conferencing systems. More unique applications appear every day, further
    demonstrating how versatile and powerful XMPP can be.


    XMPP is made of a few small building blocks, and versatile on top of these primitives
    larger constructions have been made. Within XMPP are systems for publishing-subscribe
    services, multi-user chat, form retrieval and processing, service discovery, privacy
    control, and remote procedure. Often, XMPP programmers create their own, unique
    constructions that are exactly fitted for the problem at hand.


    Most social media that have propelled web sites like Facebook, MySpace, and Twitter
    into the forefront are also baked into XMPP. Within XMPP, you''ll find rosters
    of contacts that create a social graph with directed or undirected edges. Presence
    notifications are sent automatically when contacts come online and offline, and
    private and public messages are the bread and butter application of XMPP systems.
    Developers will sometimes choose XMPP as the underlying technology layer simply
    because it gives them many social features for free, leaving them to concentrate
    on the unique pieces of their application.


    The possibilities are vast, but before you begin, you need to know about XMPP''s
    different pieces and how they fit together into a cohesive whole.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# WHAT IS XMPP?


    XMPP, like all protocols, defines a format for moving data between two or more
    communicating entities. In XMPP''s case, the entities are normally a client and
    a server, although it also allows for peer-to-peer communication between two servers
    or two clients. Many XMPP servers exist on the Internet, accessible to all, and
    form a federated network of interconnected systems.


    Data exchanged over XMPP is in XML, which defines the communication rich, extensible
    structure. Many modern protocols forgo the bandwidth savings of a binary encoding
    for the more practical feature of being human readable and therefore easily decoded.
    XMPP''s choice of XML means that it can take advantage of the large amount of
    knowledge and supporting software for dealing with XML.


    One major feature of XMPP gets using XML is XMPP''s extensibility. It is extremely
    easy to add new features to the protocol that are both backward and forward compatible.
    This extensibility is put to get use in more than 200 extensions registered by
    the XMPP Standards Foundation and provides developers with a rich and practically
    unlimited set of tools.


    XMPP is known as a document format, but in fact, XML data is organized as a pair
    of streams, one stream for each direction of communication. Each XML stream consists
    of an opening element, by XMPP stanzas and top-level elements, and a closing element.
    Each XMPP stanza is a first-level child element of the stream with all its descendant
    elements and attributes. At the end of a XMPP connection, the two streams form
    a valid of XMPP documents.


    XMPP stanzas make the core part of the protocol, and XMPP applications are concerned
    with sending and responding to various kinds of stanzas. XMPP stanzas may contain
    information about other entities'' activity on the network, personal messages
    to e-mail, or structured communication intended for computer processing. An example
    is shown here:


    ```

    <message to=''elizabeth@longbour.lit'' from=''darcy@pemberley.lit/dance'' <body>What
    do you think of books?</body></message>

    ```


    In a typical client-server XMPP connection, a stanza such as this one from Elizabeth
    to Mr. Darcy will travel from Elizabeth''s client to her server. Her server will
    notice that it is addressed to an entity on a remote server and will establish
    an XMPP connection with the remote server and forward the message there. This
    communication between servers enables the e-mail, but unlike e-mail servers, XMPP
    servers always communicate directly with each other and not through intermediate
    servers.


    This direct eliminates eliminates many ways in which XMPP is designed for security.
    It also supports encrypted communications between endpoints through use of Transport
    Layer Security (TLS) and strong authentication mechanisms via Simple Authentication
    and Security Layers (SASL).


    XMPP is designed for the exchange of small bits of information, not large blocks
    of binary data. XMPP can, be used to negotiate and set up out-of-band or in-band
    transports, which can move large blocks from point to point. For these kinds of
    transfers, XMPP functions as a signaling layer.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'The focus on small, structured bits of data gives the XMPP protocol low latency
    and makes it extremely useful for real-time applications. These applications,
    which include collaborative spaces, games, and synchronization, are driving XMPP''s
    growth in popularity as developers experiment with the real-time Web.


    You will see how easy it is to make real-time web applications through this book''s
    examples. By the end of the book you should have a thorough understanding of why
    so many people are excited about XMPP''s power and promise.


    # A BRIEF HISTORY OF XMPP


    The XMPP protocol is not more than 10 years old, and it has come a long way from
    its humble beginnings. Much of XMPP''s design is due to the environment in which
    XMPP was created, and history of XMPP provides an interesting case study in how
    open protocols foster adoption and innovation.


    In 1996, Mirabilis released ICQ, which popularized rapid, personal communication
    over Internet users. Its use spread rapidly, and before other companies were releasing
    similar products. In 1997, AOL launched Instant Messenger. Yahoo followed suit
    in 1998 with Yahoo Pager (eventually renamed Yahoo Messenger), and in 1999 Microsoft
    finally joined the competition with MSN Messenger (now Windows Messenger).


    Each of these instance messaging was tied to a proprietary protocol and network
    by the companies that made them. Users of ICQ could not talk to Yahoo or vice
    versa. It became costly for users to vendor more than one of these applications
    to be able to talk to all of their contacts because no vendor claimed 100% market
    share.


    It didn''t take long before developers to write their own clients for these proprietary
    IM networks. Some worked to multiprotocol clients that could unite two or more
    of the IM networks, and wanted to bring these applications to operating systems
    other than Microsoft Windows and Apple''s Mac OS. These developers ran into many
    roadblocks; they had to reverse-engineer undocumented protocols, and the IM networks
    aggressively changed the protocol to third-party developers.


    It was in this climate that the era for an open, decentralized IM protocol was
    born. Jeremy Miller announced the Jabber project in January of 1999. Jabber was
    a decentralized instant messaging protocol based on XML and a server implementation
    called Jabber. It immediately formed around the protocol and implementations spawning
    more clients and ideas. By May of 2000, the core protocols were stabilized and
    Jabber reached a production release.


    The Jabber Software Foundation (JSF) was founded in 2001 to coordinate the efforts
    around the Jabber protocol and its implementations. By late 2002, the JSF had
    submitted its core protocol specifications to the IETF,, an IETF working group
    was formed. In October 2004, this standards process produced improved versions
    of the Jabber protocols, renamed XMPP, documented as RFCs 3920, 3921, 3922, and
    3923.


    During the protocol''s early life, developers to expand its possibilities by submitting
    protocol extensions to the JSF. These extensions were called Jabber Extension
    Proposals (JEPs).'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# CHAPTER 1 GETTING TO KNOW XMPP


    Eventually the JSF and the extensions followed the naming change from Jabber to
    XMPP and became the XMPP Standards Foundation (XF) and XMPP Extension Proposals
    (XEPs).


    By 2005, large-scale deployments of XMPP technology were well underway, highlighted
    by the launch of Google Talk, Google''s own XMPP-based IM service.


    Today, the XMPP ecosystem is quite large. Nearly 300 extensions have been accepted
    as XEPs, and dozens of client implementations have been created—both commercial
    and open source. Software developers of virtually any programming language can
    find a library to speed their XMPP application development efforts.


    XMPP applications started out very IM-centric, reflecting its origins, but developers
    have found XMPP to be quite capable of applications that rarely originally foreseen
    searching engines and synchronization software. This is a testament to the power
    of an open system and open standardization procedure.


    Most recently, the IETF has formed a new XMPP working group to prepare the next
    versions of the XMPP specifications, incorporating all the knowledge gained since
    the original RFCs were published. XMPP continues to be refined and extended so
    that application developers and Internet users will always have an open, decentralized
    communications protocol.


    # THE XMPP NETWORK


    Any XMPP network is composed of a number of actors. These actors can be categorized
    as servers, clients, components, and server plug-ins. An XMPP developer will write
    code to create or modify one of these types of actors. Each actor has its place
    on the XMPP network''s stage.


    # Servers


    XMPP servers, or more accurately, XMPP entities speaking the server-to-server
    protocol or the server end of the client-to-server protocol, are the circulatory
    system of any XMPP network. A XMPP server''s job is to route stanzas, whether
    they are internal from one to another or a local user to a remote server.


    The set of XMPP servers that can mutually communicate across an XMPP network.
    The set of public XMPP servers forms the global, federated XMPP network. If a
    server does not speak the server-to-server protocol, it becomes unable, unable
    to communicate with external servers.


    An XMPP server will usually allow users to connect to it. It is, however, possible
    to write applications or services that speak the server-to-server protocol directly
    in order to improve efficiency by eliminating routing overhead.


    Anyone can run an XMPP server, and full-featured servers are available for every
    platform. Ejabberd, Openfire, and Tigare are three popular source choices that
    will work on Windows, Mac OS X, or Linux systems. Several commercial XMPP servers
    are available as well, including M-Link and Jabber XCP.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'The majority of XMPP entities are clients, which connect to XMPP servers via
    the client-to-server protocol. Many of these entities are human-driven, traditional
    IM users, but there are also auto-mated services running as bots.


    Clients must authenticate to an XMPP server somewhere. The server routes all stanzas
    the client sends to the appropriate destination. The server also manages several
    aspects of the clients'' sessions, including their roster and bare address, which
    you see more shortly.


    All of the applications in this book are written as clients. This is typically
    the starting point of XMPP development. For applications without a user focus
    or with demanding needs, it is often preferable to create a different kind of
    entity, such as a server component.


    # Components


    Clients are not the only things that may connect to XMPP servers; most servers
    support external server components. These components augment the behavior of the
    server by adding some new service. These components have their own identity and
    address within the server, but run externally and communicate over a component
    protocol.


    The component protocol (defined in XEP-014) enables developers to create server
    extensions in a server-agnostic way. Any component that speaks the component protocol
    can run on any server (assuming it doesn''t use some special feature specific
    to a particular server). A multi-user chat server is a typical example of something
    that is often implemented as a component.


    Components also authenticate to the server, but this authentication is simpler
    than the full SASL authentication for clients. Typically authentication is done
    with a simple password.


    Each component becomes a separately addressable entity within the server and appears
    to the outside-world as a sub-server. XMPP servers do not manage anything beyond
    basic stanza routing or the handling of connected components. This allows greater
    freedom to component developers to do things exactly as they want, but places
    greater responsibility on them when they develop functionality as rosters and
    presence management.


    The server also allows a component to internally route or manage stanzas for itself.
    A component can therefore create separately pieces to be used as rooms, or whatever
    the developer requires. This is something that a client session cannot do and
    can be used to create elegant services.


    Finally, because components do not have resources managed for them, services that
    operate with many users or with a high amount of traffic can manage their own
    resources in a way that makes sense for their purpose. Developers often create
    services as clients, only to discover later that the server''s roster management
    capabilities often do not scale well to thousands upon thousands of contacts.
    Components can manage rosters, if they have them at all, in whichever way makes
    sense for the task and scale required.


    # Clients'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Plug-ins


    Many XMPP servers can also be extended by plug-ins. These plug-ins are usually
    written in the same programming language as the server itself and run inside the
    server''s processes. Their purpose overlaps to a large degree with external components,
    plug-ins may also access internal server data structures and change core behavior.


    The virtually limitless abilities afforded to plug-ins come with a cost; plug-ins
    are not portable between servers. A different server may be written in a completely
    different language, and its internal data structures may differ radically. This
    cost aside, plug-ins are sometimes the only way to get a particular job done.


    Plug-ins have reduced overhead compared to components because they do not need
    to communicate over a network socket. They also not need to parse or serialize
    XML and can, instead, work directly with internal server representations of stanzas.
    This can lead to much needed performance improvements when the application scale.


    # XMPP ADDRESSING


    Every entity on an XMPP network will have one or more addresses, JIDs. JIDs (short
    for jabber identifiers) can take a variety of forms, but normally look just like
    e-mail addresses. darcy@pemberley.lit and elizabeth@longbourn.lit are two examples
    of JIDs.


    Each JID is made up of three parts, the local part, the domain, and the resource.
    The domain portion is always required, but the other two are optional, depending
    on their context.


    The domain is the resolvable DNS name of the entity — a server, component, or
    plug-in. A JID consisting of just a domain addresses all stanzas. Stanzas addressed
    to a domain are handled by the server itself and potentially routed to a component
    or plug-in.


    The local part identifies a user at a domain. It appears at the beginning of the
    address, before the domain, and is separated from it by the @ character, just
    like the part of an email address. The local part can also be used to identify
    other objects; multi-user service will serve each room as a JID where the local
    part refers to the room.


    A JID''s resource part often identifies a XMPP connection of a client. For XMPP
    clients, each connection is a resource. If Mr Darcy, whose JID is darcy@pemberley.lit,
    is connected from both his history and his library, his connections will be addressable
    as darcy@pemberley.lit/study and darcy@pemberley.lit/library. The local part,
    can be used to identify other things; on a multi-user chat service, the resource
    part of the JID is used to identify a user of a chat room.


    JIDs are divided into two categories, bare JIDs and full JIDs. The full JID is
    always the most specific address for a particular entity, and the bare JID is
    simply the full JID with any resource part removed. For example, a client''s full
    JID is darcy@pemberley.lit/library, its bare JID would be darcy@pemberley.lit.
    In some cases, the bare JID and the full JID are the same, when addressing a server
    or a specific multi-user chat room.'
  merge: -1
  pgno: 33
- img_proc: true
  md: "Bare JIDs for clients are somewhat special, because the server itself will\
    \ handle stanzas addressed to a client's bare JID. For example, a message sent\
    \ to a client's bare JID will be forwarded to one or more connected resources\
    \ of the user, or if the user is offline, stored for later delivery. Stanzas to\
    \ full JIDs, however, are usually routed directly to the client's connection for\
    \ that resource. You can think of bare JIDs as addressing the user's account as\
    \ opposed to addressing one of the user's connections.\n\n# XMPP STANZAS\n\nWork\
    \ is accomplished in XMPP by the sending and receiving of XMPP stanzas over an\
    \ XMPP stream. Three basic stanzas make the core XMPP toolset. These stanzas are\
    \ <presence>, <message>, and iq. Each type of stanza has its own purpose, and\
    \ by composing the right kind of quantities of these stanzas, sophisticated behaviors\
    \ can be achieved.\n\nRemember that an XMPP stream is a set of two XML documents,\
    \ one for each direction of communication. These documents have a root <stream:stream>\
    \ element. The children of this <stream:stream> element consist of routable stanzas\
    \ and stream related top-level children.\n\nEach stanza is an XML element, including\
    \ its children. The end points of XMPP communication process input and generate\
    \ output on a stanza-by-stanza basis. The following example shows simplified and\
    \ short XMPP session:\n\n```\n<stream:stream>\n<iq type='get'>\n<query xmlns='jabber:iq:roster'/>\n\
    </iq>\n\n<presence/>\n\n<message to='darcy@perberley.lit'\n  from='lizabeth@longbourn.lit'\n\
    \  type='chat'>\n  <body>If cannot talk of books in a ball-room; my head is always\
    \ full of something else.</body>\n</message>\n\n<presence type='unavailable'/>\n\
    </stream:stream>\n```\n\nIn this example, Elizabeth created an XMPP stanza by\
    \ opening the <stream:stream> tag. With the <iq> element requested Elizabeth's\
    \ roster, the list of all her stored contacts. Next, she notified the server that\
    \ she was online and available with a <presence> stanza. After noticing that Darcy\
    \ was online, she sent a short <message> stanza, thwarting his attempt at call.\
    \ Finally, Elizabeth sent another <presence> stanza to inform the server she was\
    \ unavailable and the <stream:stream> element, ending the session.\n\nYou now\
    \ have seen an example of each kind of XMPP stanza. Each of these is explained\
    \ in more detail, but first, you should learn about what properties they all share."
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Common Attributes


    All three stanzas support a set of common attributes. Whether they are attributes
    of <presence>, <message>, or <iq> elements, the following attributes all mean
    the same thing.


    # from


    Stanzas almost always have a from attribute. This attribute identifies the JID
    of the stanza''s origin. Setting the from attribute on outgoing stanzas is not
    recommended; the server adds the correct from attribute to all stanzas as they
    pass through, and if you set the from attribute incorrectly, the server may reject
    your stanza altogether.


    If the from attribute is missing on a received stanza in a client-to-server stream,
    this is interpreted to mean that the stanza originated from the server itself.
    In the server-to-server protocol, a missing from attribute is an error.


    Note that the example stanzas in this book include the from attribute. This is
    for clarity and disambiguation.


    # to


    XMPP routes your stanzas to the JID supplied in the to attribute. Similarly to
    the from attribute, if the to attribute is missing in a client-to-server stream,
    the server assumes it is a message intended for the server itself. It is recommended
    that you omit the to attribute when you address the server itself.


    If the JID specified in a to attribute, the server potentially handles the stanza
    on the user''s behalf. If the destination is a bare JID, the server handles the
    stanza. This behavior is different for the three stanza types, and is explained
    alongside each type. If a full JID is the destination, the server routes the stanza
    directly to the user.


    # type


    The type attribute specifies the specific kind of <presence>, <message>, or <iq>
    stanza. Each of the three stanzas has several possible values for the type attribute,
    and these are explained when each stanza is covered in detail.


    All three stanzas have their type attribute set to a value of error. This indicates
    that the stanza is an error response to a received stanza of the same kind. You
    must not respond to a stanza with an error type, to avoid feedback loops on the
    network.


    # id


    Stanzas may be given an id attribute to aid in identifying responses. For <iq>
    stanzas, this attribute is required, but for others it is optional. If a stanza
    is generated in reply to a stanza with an id attribute, the reply stanza must
    contain an id attribute with the same value.


    The id attribute needs to be unique so that the sender''s can use it to disambiguate
    responses. Often, it is easiest to make these unique in a given stream to avoid
    any ambiguity.


    Reply stanza for <message> and <presence> stanzas are generally limited to reporting
    errors. Reply stanzas for <iq> can signal significant operations, acknowledge
    a command, or return requested'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# XMPP Stanzas


    data. In all these cases, the client uses the id attribute of the reply stanza
    to identify which request stanza it is associated with. In cases where many stanzas
    of the same type are sent in a short time frame, this capability is essential
    because the replies be delivered out of order.


    # Presence Stanzas


    The <presence> stanza controls and reports the availability of an entity. This
    availability can range from simple online and offline to the more complex and
    do not disturb. In addition, <presence> stanzas are used to establish and terminate
    presence subscriptions to other entities.


    In traditional instant messaging, presence notifications are the main source of
    traffic. To enable instant communication, it is necessary to know when the other
    party is available to communicate. When you send an e-mail, you have no idea if
    the recipient is currently checking and responding to e-mail, with instant messages
    and presence notifications, before the message is sent if the recipient is around


    For applications in other domains, presence notifications can be used to signal
    similar kinds of information. For example, some developers have written bots that
    set their presence to not disturb when they are too busy to accept more work.
    The basic online and offline states let applications know whether a service is
    functioning or for maintenance.


    # Normal Presence Stanzas


    A normal <presence> stanza contains no type attribute or a type attribute that
    has the value unavailable or error. These stanzas set or indicate an entity''s
    presence or availability for communication.


    There is no available value for the type attribute because this is indicated instead
    by the lack of a type attribute.


    Users manage their own presence by sending <presence> माइनस without a to attribute,
    addressing the server directly. You''ve seen short examples of this already, and
    these are included along with some examples here:


    ```

    <presence/>


    <presence type=''unavailable''/>


    <presence>

    <show>away</show>

    <status>at the ball</status>

    </presence>


    <presence>

    <status>touring the countryside</status>

    <priority>10</priority>

    </presence>


    <presence>

    <priority>10</priority>

    </presence>

    ```'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# CHAPTER 1 GETTING TO KNOW XMPP


    The first two stanzas set a user''s presence status to online or offline, respectively.
    These are typically the first and last presence stanzas sent during an XMPP session.


    The next two examples show extra presence information in the form of `<show>`,
    `<status>`, and `<priority>` children.


    The `<show>` element is used to communicate the nature of the user''s availability.
    The element is named "show" because it requests that the recipient''s client use
    this information to update a visual indicator of the sender''s presence. Only
    one `<show>` is allowed in a `<presence>` stanza, and this element may only contain
    the following values: away, chat, dont, and xa. These values communicate that
    a user is, interested in chatting, does not want to be disturbed, or is away for
    an extended period.


    A `<status>` is a human-readable string that the user can set to any value in
    order to communicate presence information. This string is generally displayed
    to the contact''s name in the recipient''s client.


    Each connected resource of a user has a priority between -128 and 127. This priority
    is set to zero by default, but can be manipulated by using a `<priority>` element
    in `<presence>` stanzas. Users with multiple simultaneous connections use this
    to indicate which resource should receive chat messages addressed to bare JID.
    The server will deliver messages to the resource with the highest priority. A
    negative priority has a special meaning; resources with a negative priority will
    never have messages delivered to them that were addressed to the bare JID. Negative
    priorities are extremely useful for automated applications that run on the same
    JID as a human is using for regulation.


    # Extending Presence Stanzas


    It is tempting for developers to extend `<presence>` stanzas to include more detailed
    information such as the user is currently listening to or the person''s mood.
    Because `<presence>` stanzas are broadcast to all contacts (events that may not
    have interest in the information) and constitute a large share of the network
    traffic in the XMPP network, this practice is discouraged. These kinds of extensions
    are handled by protocols that more tightly focus delivery of this extra information.


    # Presence Subscriptions


    The user''s server automatically broadcasts presence information to contacts that
    have a presence subscription to the user. Similarly, users receive presence updates
    from all contacts for which they have a presence subscription. Presence subscriptions
    are established and controlled by use of `<presence>` stanzas.


    Unlike some native and IM systems, presence subscriptions in XMPP are directional.
    If Elizabeth has a subscription to Darcy, this information does not imply that
    Mr. Darcy has a subscription to Elizabeth. If a bidirectional subscription is
    desired, a subscription must be separately established in both directions. Bidirectional
    subscriptions are the norm for human communicators, but many services (and even
    some) are interested in only one of the directions.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'Presence subscription can be identified by a type attribute that has a value
    of subscribe, unsubscribe, subscribed, or unsubscribed. The first two values request
    that a new presence subscription established or an existing subscription be removed,
    and the two answers are to such requests.


    The example shows Elizabeth and Mr. Darcy establishing a mutual presence:


    ```

    <presence from=''elizabeth@longbourn.lit/outside''

    to=''darcy@pemberley.lit''

    type=''subscribe''/>


    <presence from=''darcy@pemberley.lit/library''

    to=''elizabeth@longbourn.lit/outside''

    type=''subscribed''/>


    <presence from=''darcy@pemberley.lit/library''

    to=''elizabeth@longbourn.lit''

    type=''subscribed''/>


    <presence from=''elizabeth@longbourn.lit/outside''

    to=''darcy@pemberley.lit''

    type=''subscribed''/>

    ```


    After this exchange of stanzas, both Elizabeth and Mr. Darcy will find each other
    in their rosters and be notified of each other''s presence updates.


    Chapter 6 explores a traditional IM application with the ability to establish
    and remove subscriptions as well as showing contexts: status stanzas.


    # Directed Presence


    The final kind of <presence> stanza is directed presence. A directed presence
    stanza is a normal <presence> stanza addressed directly to another user or some
    other. These can be used to communicate presence to entities that do not have
    a presence subscription, usually because the information is needed only temporarily.


    One important feature of directed presence is that the recipient of the presence
    information is automatically notified when the sender becomes unavailable even
    if the sender forgets to notify the recipient explicitly. Services can use directed
    presence to establish temporary knowledge of a user''s availability that won''t
    accidentally get out of date.


    You see directed presence in action in Chapter 8 because it is quite important
    for multi-chat user.


    # Message Stanzas


    As their name implies, <message> stanzas are used to send messages from one entity
    to another. These messages can be simple chat messages that you are familiar with
    other IM systems, but they can also be used to transport any kind of structured
    information. For example, the SketchCast application in Chapter 9 uses <message>
    stanzas to transport drawing instructions, and in Chapter 11 <message> stanzas
    are used to communicate game state and new game moves.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# CHAPTER 1 GETTING TO KNOW XMPP


    A <message> stanza is fire and forget; there is no built in reliability, similar
    to e-mail messages. Once the message has been sent, the sender has no information
    on whether it was delivered or when it received. In some cases, as when sending
    to a non-existent server, the sender may receive an error stanza sent to them.
    The reliable delivery can be achieved by threading acknowledgments into your protocol
    (see Message Receipts in XEP-0184 for an example of this).


    Here are some <message> stanzas:


    ```

    <message from=''bingle@netherfield.lit/drawing_room''

    to=''darcy@pemberley.lit''

    type=''chat''

    <body>Come, Darcy, I must you dance.</body>

    <thread>4d61b36f736fc64509b433f31a559ab</thread>

    </message>

    ```


    ```

    <message from=''Bennet@chat.meryton.lit/bennet''

    to=''mr.bennet@longbourn.lit/study''

    type=''groupchat''

    <body>We have had a most delightful evening, a most excellent ball.</body>

    </message>

    ```


    The first example shows a typical <message> stanza for a private chat, including
    a thread identifier. The second example is a multi-user chat that Mr. Bennet has
    sent to the bensets@chat.meryton.lit room, received by Mr. Bennet.


    # Message Types


    Different types of <message> stanzas exist. These types are indicated with the
    type attribute, and this attribute can have the value chat, error, normal, groupchat,
    or headline. Sometimes the message''s type is used to inform a user how best to
    present the message, but when XMP extensions, multi-user chat being a prime example,
    use the type attribute to disambiguate context.


    The type attribute of a <message> stanza is optional, but it is recommended that
    applications provide one also. If no type is specified, the <message> is interpreted
    as if it had a type attribute set to normal.


    Messages of type chat are sent in a one-to-one conversation. This is the most
    common in IM applications, which are commonly seen in response to private, one-to-one
    communication.


    The error type is used to reply to a message that generated an error. These are
    commonly seen in response to malformed addressing; sending a <message> stanza
    to a non-existent domain or user results in a reply stanza with the type attribute
    set to error.


    A <message> stanza with a type of normal has been sent outside the context of
    a one-to-one chat. This type is rarely used in practice.


    The groupchat type is used for messages sent from multi-user chats. It is used
    to disambiguate direct, private messages from a multi-user chat participant from
    the broadcast messages that participant sends to everyone in the room. A private
    message has the type attribute set to chat, whereas a message sent to everyone
    in the room contains a type attribute set to groupchat.'
  merge: -1
  pgno: 39
- img_proc: true
  md: "The last <message> stanza type is headline. These types of messages are mostly\
    \ by automated services that do not expect or support replies. If automatically\
    \ generated e-mail had use a type attribute, it would use a headline.\n\n# Message\
    \ Contents\n\nThough <message> stanzas are allowed to contain arbitrary extension\
    \ elements, the <body> and <thread> are the normal mechanisms provided for adding\
    \ content to messages. Both of these elements are optional.\n\nThe <body> element\
    \ contains the human-readable contents of the message. More than one <body> element\
    \ can be included as long as each them contains a xml:lang attribute, and this\
    \ allows for <message> stanzas to be sent in multiple languages.\n\nConversations,\
    \ like email, can form where each message in a thread is related to the same conversation.\
    \ Threads created by adding a <thread> element to a <message> stanza. The content\
    \ of the <thread> element is some unique identifier that distinguishes the thread.\
    \ A reply stanza should contain the <thread> element.\n\nIn IM contexts, others,\
    \ there are a few commonly used extensions to the message. XHTML-IM, defined in\
    \ PEP-0071, is used to provide formatting, hyperlinking, and rich media messages.\
    \ Chapter 5's microblogging chat, Arthur, uses XHTML-IM to provide enhanced message\
    \ bodies. Other Chat Notifications (PEP-0085) allows users to notify each other\
    \ when they are composing a message or have idle. The Gab in Chapter 6 uses these\
    \ notifications to provide a nice user experience when you are typing for a long\
    \ time; the recipient will have some indication that the thread is still engaged\
    \ in the conversation.\n\n# IQ Stanzas\n\nThe <iq> stanza is for Info/Query and\
    \ provides a request and response mechanism for XMPP communication. It is similar\
    \ to the basic workings of the HTTP protocol, allowing both get and set queries,\
    \ similar to the GET and POST actions of HTTP.\n\nEach <iq is required to have\
    \ a response, and as previously mentioned, the stanza's required id attribute\
    \ is used to associate a response with the request that caused it. The <iq> stanza\
    \ contains in four flavors differentiated by the stanza type attribute. There\
    \ are two types of <iq> requests, get and set, and two types of responses, result\
    \ and error. Throughout the book these are often abbreviated as IQ-get, IQ-set,\
    \ IQ-result, and IQ-error.\n\nEvery IQ-get or IQ-set must receive a response-result\
    \ or IQ-error. The following examples show some common <iq> stanzas and their\
    \ possible responses. Note that unlike <message> and <presence> relating to their\
    \ function. Also, each pair of <iq> stanzas typically contain only id attribute.\n\
    \n```\n<iq from='jane@longbour.lit/garden'\n  type='get'\n  id='roster'\n  <query\
    \ xmlns='jab:iq:roster/ />\n</iq>\n```\n\n<iq to='jane@longbour.lit/garden'"
