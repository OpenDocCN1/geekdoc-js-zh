- img_proc: true
  md: '# LEARNING FROM OTHERS


    It''s always nice to get a little inspiration before starting a project, and many
    great XMPP applications out there provide inspiration and insight into what is
    possible. The following applications are just scratching the surface of XMPP''s
    potential, but they serve as great examples of what you can do with a little help
    from XMPP, even in the context of an existing application.


    Just as XMPP started as a protocol for better instant messaging, the first application
    is an IM client. Figure 2-1 shows a screenshot of the Adium client (http://adium.im)
    running on Mac OS X. This client supports XMPP as well as a number of other IM
    protocols. Comparable clients exist for every platform imaginable.


    ![](img/eb420c48595351b731631bccf1c8fdc4_49_0.png)


    FIGURE 2-1


    Google has made huge investments in XMPP technology. It started with the Google
    Talk service, which has improved over years. Google Talk provides IM services
    to a Gmail account, as well as to Google Apps for Domains customers. Google also
    did the initial work on Jingle, the XMPP extension that enables video and video
    conferencing. Its upcoming Wave protocol is an XMPP extension itself, and its
    cloud computing platform, AppEngine, is also XMPP enabled. Figure 2-2 shows the
    Gmail client (http://gmail.com), which also includes a simple, web-based IM client.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Learning from Others


    ![](img/eb420c48595351b731631bccf1c8fdc4_50_0.png)


    2-2


    With the advent of Twitter, the rise of microblogging is at hand, even in the
    corporate environment. Services like Socialcast, Yammer, and Presently all offer
    private microblogging services to improve the companies'' internal communications.
    Because low-latency communication is desirable, it is no surprise that many of
    these companies turn to XMPP as a solution. Figure 2-3 shows the Presently application
    (https://presently.com) allowing users to keep in touch with their co-workers.
    Presently using the Strophe library to handle XMPP communication, just like the
    applications in this book. They also use XMPP to power their backend infrastructure.


    XMPP is great at enabling communication and collaboration, supporting features
    like group chat and file sharing. Drop.io (http://drop.io) has turned XMPP''s
    multi-user chat rooms into rich, collaborative spaces capable of sharing audio,
