- img_proc: true
  md: "# Set Up\n\nOnce a connection is established to a given XMPP server, an XMPP\
    \ stream is started. An XMPP stream is opened by sending the opening <stream:stream>\
    \ element to the server. The server responds by sending the response's opening\
    \ <stream:stream> tag.\n\nOnce XMPP streams are open in both directions, elements\
    \ can be sent back and forth. At this stage of the connection life, these elements\
    \ will be related to the stream and the server's features.\n\nThe server first\
    \ sends a <stream:features> element, which details all the supported features\
    \ on the XMPP server. These mostly relate to encryption and authentication options\
    \ that are available. For example, the server will specify if encryption (TLS)\
    \ is available and whether not anonymous logins are allowed.\n\nYou don't need\
    \ to know how much detail about this stage of an XMPP connection as many libraries\
    \ for XMPP development handle this work for you, but the following example shows\
    \ a typical exchange of <stream:stream> elements as the server's feature list.\n\
    \nThe first client sends the opening element to the server:\n\n```\n<xml version='1.0'?>\n\
    <stream:stream xmlns='jabber:client'\n    xmlns:stream='http://etherix.jabber.org/streams'\n\
    \    version='1.0'\n    to='emberley.lit'>\n```\n\nThe server replies:\n\n```\n\
    <xml version='1.0'?>\n<stream:stream xmlns='jabber:client'\n    xmlns:stream='http://etherix.jabber.org/streams'\n\
    \    version='1.0'\n    from='emberley.lit'\n    id='893ca41if5ff2ec2499984e9b7eafc'\n\
    xml:lang='en'>\n<stream:feature>\n<stream:features>\n  <starttls xmlns='urn:iet:params:xml:ns:xmpp-tls'/>\n\
    \  <compression xmlns='http://jabber.org/features/compression'>n    <method>zlib</method>\n\
    \  </compression>\n  <mechanisms xmlns='urn:iet:params:xml:ns:xmpp-sasl'>n   \
    \ <mechanism>DIGEST-MD5</mechanism>\n    <mechanism>PLAIN</mechanism>\n  </mechanisms>\n\
    </stream:features>\n</stream:feature>\n```\n\nFrom this exchange, you know the\
    \ emberley.org server supports TLS, stream compression via zlib, and several authentication\
    \ mechanisms.\n\nThe XMPP streams set up between two servers look identical except\
    \ that the top-level namespace jabber:server instead of jabber:client."
  merge: -1
  pgno: 44
