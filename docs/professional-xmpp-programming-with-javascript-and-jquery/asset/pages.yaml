  md: '# Designing the Game Protocol


    ```

    type=''set''

    id=''model''

    <move xmlns=''http://metajack.im/ns/toetem''

    col=''b'' row=''2''/>

    </iq>

    ```


    The referee determines that this move is legal and responds to Elizabeth with
    an IQ-request stanza. Then, the referee forwards the move to the other player
    and the observers in the room:


    ```

    <iq to=''elizabeth@longbourn.lit/sitting_room''

    from=''referee@pemberley.lit/toetem''

    type=''result''

    id=''model''/>


    <message to=''toetem-789@games.lit''

    from=''referee@pemberley.lit/toetem''

    type=''groupchat''>

    <body>-elizabeth has marked an x at b2.</body>

    <move xmlns=''http://metajack.im/ns/toetem''

    col=''b'' row=''2''/>

    </message>

    ```


    The rest of the time continues until some game reaches conclusion.


    Elizabeth may attempt to move out or send an illegal move. The referee must return
    a proper error in both of these cases. In the former case, the correct error is
    unexpected, and in the latter case, not acceptable. The unexpected request can
    also be used if a player moves before the game has officially started and the
    not allowed error will suffice for the case where the game has already ended.
    These errors are nearly identical to the error stanzas used; only the error condition
    element is changed.


    > Note that is important that all participants in the game room check the state
    of game messages. Only game state changes broadcast by the referee are legal.
    A rogue player could potentially referee if the participants were not paying attention
    to the origin of the messages.


    These simple bits of protocol handle most of the interaction within a game. One
    problem remains; however, if a new observer joins in the middle of a game, they
    won''t know the current state of the game. The referee must send the current state
    to whoever joins the room. Once the user has joined and received the state, the
    user can use game state broadcasts like just others


    The game state consists of the phase of the game, the players and their pieces,
    the current board position, and the result if one is known. The phase of the game
    may be waiting, playing, or finished. If the state is waiting, only the players
    and pieces need to communicate the rest of the game. During the playing state,
    the players, pieces, and board position are needed. In the finished state, all
    the information is necessary.


    The referee can send this information in a <game> element inside a direct room
    to the user who has joined. The <game> element can use a phase attribute for the
    game''s phase. The x-player and o-player attributes you saw earlier can be reused
    to communicate the players and their pieces if needed. Finally, the board position
    can be stored in the pos attribute encoded as a string.'
