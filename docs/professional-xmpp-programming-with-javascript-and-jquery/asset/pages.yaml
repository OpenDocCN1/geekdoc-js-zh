  md: 'The roster plug-in you created does an excellent job abstracting away the details
    of roster management, which is exactly what was intended.


    # Improving the Roster Plug-in


    The roster plug-in you created is pretty simple, although it is still quite useful.
    Here are some ideas for improvements you can try:


    +   * Send more detailed update information in the roster_changed event so that
    the user''s code doesn''t have to refresh the entire roster every time.


    +   * Extend the plug-in to trigger more events for things like including presence
    subscriptions and contacts going on and offline.


    +   * Add support for Personal Eventing Protocol (XEP-0163) and Entity Capabilities
    (XEP-0115) to get extended information, such as music contacts are listening to.


    # SUMMARY


    Plug-ins make developers'' lives easier by abstracting away protocol details and
    letting developers reuse and build easily upon the work of others. The Strophe
    library provides a simple, yet highly effective plug-in system that allows its
    users to add advanced functionality. In this chapter:


    +   * Learned how to load and use Strophe plug-ins


    +   * Discovered how to create your own plug-ins


    +   * Created a roster management plug-in that made dealing with rosters, roster
    updates, and presence changes really easily


    +   * Saw how application logic becomes when plug-ins are available to the heavily
    lifting


    It''s a long journey, but I hope it was an interesting and enjoyable one. You
    built many applications, including really sophisticated ones, and learned how
    to scale XMPP applications. You should now be versed in the XMPP protocol and
    the Strophe library as well, and perhaps a few new JavaScript or jQuery tricks,
    too. Hopefully your head is now filled with wonderful ideas for great XMPP-powered
    applications. Good luck and happy hacking!'
