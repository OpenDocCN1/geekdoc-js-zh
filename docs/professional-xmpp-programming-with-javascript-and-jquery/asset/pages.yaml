  md: '# Toetem


    ![](img/eb420c48595351b731631bccf1c8fdc4_326_0.png)


    FIGURE 11-2


    # TOETEM DESIGN


    Toetem consists of two major pieces: the referee and the game client.


    The referee is an XMPP bot that enforces game rules and keeps track of the active
    games and waiting players. Users interact with the referee indirectly through
    the actions they take in the game client. Only one referee is needed for all the
    players in the system, but without a referee, there would be no way to prevent
    cheating and abuse by malicious players.


    The game client is the application that each player uses to access the system
    and play games. Actions that the user takes are sent to the referee and broadcast
    out to all other players and observers.


    Because the referee is a bot, it does not need a user interface. It simply maintains
    a connection and listens for commands from users, checks their legality, and broadcasts
    them out to other users or updates its internal state.


    The referee understands a number of commands, and these are covered in detail
    in the following "Designing the Game Protocol". The protocol you create is a healthy
    mix of all three types — `<iq>`, `<presence>`, and `<message>` — and makes of
    using extensions like multi-user client.


    Games are organized around multi-user chat rooms. Each game has an associated
    room, and all players and observers join this room to play or watch the game.
    This chat room provides the communication area for all the game''s participants,
    and it is also used to broadcast the players'' moves to everyone. Multi-user chat
    rooms already provide most of the functionality needed, so they make a great building
    block for the Toetem protocol.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# BOTS AND COMPONENTS


    Toetem uses a bot for the referee, but bots have potential pitfalls. Because bots
    are normal users on the server, they come complete with rosters and all the normal
    message routing that clients have. Usually this extra functionality is not necessary
    and can get in the way as your bot scales in size.


    In a more robust system, the referee would be replaced with a component that performed
    the same function. The component would have more control over its resources and
    routing, and it wouldn''t run into size limitations as quickly.


    For more information on components and scaling see the "Components" section in
    Chapter 1 and the "Spreading Out Components" section in Chapter 13.


    Users wishing to play games will need to know the JID of the referee when they
    connect. Once connected, they will be able to view the list of current games and
    the list of waiting players. They can choose to start a game with one of the waiting
    players, to play, or to watch one of the active games played by others.


    If they start a game or join a game as an observer they will be switched to the
    game view. In the game view, the user will see the Tic-Tac-Toe board as well as
    the game''s chart. Whenever a player moves, the board will update in real time
    for all the players and observers. An observer can leave the game at any time,
    but players must wait until the game has concluded before they leave.


    Most of the work will be defining and implementing the Toetem protocol and creating
    the game board control. The protocol you design in this chapter is not limited
    to Tic-Tac-Toe games; in fact, it is a simplification of the same protocol Chebyshev
    uses for its chess games. Changing the game board and the particular kinds of
    moves and state is all you need to turn it into any other game. Tic-Tac-Toe was
    chosen because it has extremely simple rules, allowing you to concentrate on the
    protocol and interactions between players instead of complex game logic.


    # DESIGNING THE GAME PROTOCOL


    You design a simple protocol in the previous chapter, and in this, you design
    a much more complex protocol for managing and running a game system. Each piece
    of the protocol is built out of the protocol blocks that you''ve seen in previous
    chapters, but the combination of these simple results in a sophisticated system.


    The Toetem protocol comprises four main areas. First, you need some to keep track
    of players in the system, and just as in the previous chapter, you use directed
    presence for this task. Next, you need to manage the list of players who are waiting
    for a game. You also need to manage the active games and their corresponding chat
    rooms. Finally, you must deal with the player interactions within each game.'
  merge: -1
  pgno: 327
