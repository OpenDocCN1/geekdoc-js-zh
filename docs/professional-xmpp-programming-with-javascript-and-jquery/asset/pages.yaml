  md: "The code keeps track of whether or not the room is joined in order to know\
    \ when to fire the room_joined event. Only fire room_joined the first time it\
    \ receives the user's presence as indicated by a status code of 110. If a presence\
    \ error occurs, this usually signals a nickname conflict. Groupie resets the application\
    \ in this case. Note that the group chat service may change the user's requested\
    \ nickname; this change is signaled by the 210 status code, so in that case, the\
    \ nickname property is updated to reflect the change.\n\nYou can add a handler\
    \ for the room_joined event to let the user know their action was successful and\
    \ enable the Leave button. Add the following handler to groupie.js:\n\n```\n$(document).bind('room_joined',\
    \ function () {\n  $('#leave').removeAttr('disabled');\n  $('#room-name').text(Groupie.joined);\n\
    \  $('#chat').append('<div class=\"notice\">*** Room joined.</div>');\n});\n```\n\
    \nAll that's left is to enable the user to leave the room by clicking the Leave\
    \ button. Add the following code to the document reader handler:\n\n```\n$('#leave').click(function\
    \ () {\n  Groupie.connection.send({\n    to: Groupie.room + \"/\" + Groupie.nickname,\n\
    \    type: \"unavailable\"\n  });\n  Groupie.connection.disconnect();\n});\n```\n\
    \nThe preceding code sends direct presence of type unavailable to the room to\
    \ exit next and then terminates the connected event handler: \n\n```\n$(document).bind('connected',\
    \ function () {\n  Groupie.connection = null;\n  $('#participant-list').empty();\n\
