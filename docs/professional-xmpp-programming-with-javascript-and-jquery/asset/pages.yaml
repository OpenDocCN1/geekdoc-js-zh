  md: '# XMPP EXTENSION PROPOSALS OR XEPS


    XMPP is defined in the IETF RFCs (Request for Comments documents) 3920 and 3921.
    These documents cover the basic semantics of XMPP streams, the workings of XMPP
    federation, and the details on the main stanza types. Anything that is not considered
    a core part of XMPP but is accepted as a generally useful addition is documented
    in an XMPP Extension Proposal, or XEP.


    Anyone can propose a XEP by submitting it to the XMPP Standards Foundation (XSF).
    The XSF Council reviews all proposed XEPs and votes on whether to accept them
    into the standardization process. Once accepted, XEPs are assigned numbers and
    a status of experimental. Over time, people refine and implement the XEP, it may
    move to a status of draft and perhaps eventually to final. XEPs in draft or final
    status are considered well reviewed and ready for wide implementation and deployment.
    In some cases, XEPs become deprecated or historical when they are supersed or
    out of general use.


    Some XEPs are very tiny, like Software Version (XEP-0092), and a few are quite
    large, Publish-Subscribe (XEP-0060), which you will see in Chapter 9. The first
    decade of XMPP''s existence nearly 300 XEPs were accepted, and they cover a wide
    range of functionality from remote commands to publishing song information. After
    April 1st, the XSF even publishes a humorous XEP (my favorite of these is XEP-0239).


    Several important XEPs are covered throughout this book, and you can find the
    full list of XEPs and their specifications at:


    ```

    http://xmpp.org/extensions/

    ```


    # Adding XHTML-IM to Arthur


    If you were to peek, the debug console from the previous chapter, and inspect
    the incoming messages from Identica, you would see that the service appends an
    XHTML-IM payload to each update message. These structured payloads will use usernames,
    hashtags, groups, and references into clickable links. If a user sees an update
    in Arthur referring someone they''ve never heard of, they can easily find out
    more information.


    Because Arthur is a web application, it is extremely easy to render the XHTML-IM
    message. You can use jQuery contents to get all the XHTML children and insert
    them into the appropriate place. Since the application uses HTML DOM and the XMPP
    connection uses XML DOM, you must use importNode() to transfer the elements between
    documents. Unfortunately,'
