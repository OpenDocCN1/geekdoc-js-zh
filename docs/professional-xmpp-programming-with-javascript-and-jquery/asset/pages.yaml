    \ nothing here yet\n});\n```\n\nWith the initial bits of drudgery out of the way,\
    \ you can start implementing the first bits of the protocol.\n\n# IMPLEMENTING\
    \ SESSIONS AND THE WAITING LIST\n\nThe place to start on Toetem is with session\
    \ tracking and the waiting player's list. Session tracking is needed before players\
    \ can interact with the referee, and the waiting list is the easiest piece of\
    \ the protocol in Toetem. Because you build both the service and the client in\
    \ this chapter, you implement both sides in parallel.\n\nThe referee must keep\
    \ track of players' presence and maintain a list of players who are waiting for\
    \ games. The referee will add and remove players from the list at their request.\
    \ This list must be sent to all players whenever they register, and changes to\
    \ the list must be broadcast to players as they happen.\n\nThe user must send\
    \ direct message to the referee to establish a gaming session and gain access\
    \ to the game functionality. Once the referee is tracking the player's presence,\
    \ the player can query the list or add or remove themselves from the list by clicking\
    \ various buttons in the UI.\n\n# Referee Version One\n\nFirst, the referee will\
    \ need structures to track player presence and to store the waiting list. Also,\
    \ it is handy to create a Toetem protocol namespace container to save typing.\
    \ Add the following to the Referee object:\n\n```\nwaiting: {\npresence: {},\n\
    NS_TOETEM: \"http://metajack.im/ns/toetem\"\n```\n\n![](img/eb420c48595351b731631bccf1c8fdc4_342_0.png)\n\
    \n```\ncode snippet referee.js\n```\n\nThe waiting list will be stored in an array\
