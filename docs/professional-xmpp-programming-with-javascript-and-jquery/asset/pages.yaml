  md: 'created. Delayed delivery was finally written down in XEP-0091, which was later
    replaced by the current Delayed Delivery (XEP-0203).


    The sender of a message doesn''t need to do anything special to support offline
    messages. If a message is received for an offline user, a typical server will
    queue that message for the user next comes online. Little is required from the
    recipient as well. When the recipients of offline messages next intend the server
    will deliver all pending messages to them. No special attention is needed to pay
    these messages, they will appear to have been just sent, but on closer inspection,
    they contain extra metadata inserted by the server when they were originally sent.


    Take a look at the following example traffic. First, Jane sent her initial presence,
    informing the server that she is now available. The next, server delivers several
    messages to her; but all the final message were sent before she came online.


    JANE: <presence>


    ```

    SERVER: <message from=''elizabeth@longbour.lit/bedroom''

    nto=''jane@longbour.lit/bedroom''

    type=''chat''>

    <body> Bingley sees that her brother is in love with you, and

    hants to marry Mary Darcy </body>

    <delay xmlns=''urn:xmpp:delay''

    from=''longbour.lit''

    stamp=''1809-09-22T12:44:13Z''>Offline storage</delay>

    </message>

    ```


    ```

    <message from=''elizabeth@longbour.lit/bedroom''

    to=''jane@longbour.lit/bedroom''

    type=''chat''>

    <body>She follows him to town in the hope of keeping him there, and tries

    to persuade him that he does not care about you. </body>

    <delay xmlns=''urn:xmpp:delay''

    from=''longbour.lit''

    stamp=''1809-09-22T12:44:24Z''>Offline storage</delay>

    </message>

    ```


    ```

    <message from=''elizabeth@longbour.lit/bedroom''

    to=''jane@longbour.lit/bedroom''

    type=''chat''>

    <body>No one who has ever seen you together, can doubt this

    affection. </body>

    </message>

    ```


    Notice the extra <delay> element in the messages that were received while Jane
    was offline. These extra elements are a delayed delivery marker and indicate that
    the messages have been delivered some period of time after they were originally
    received. The stamp attribute indicates the time Jane''s server received the message.


    You can indicate which messages in the stream happened while the user was offline
    by giving them a special color in the user interface. You do this by assigning
    an extra CSS class in handle_message() when a <message> stanza is processed containing
    a <delay> element.'
