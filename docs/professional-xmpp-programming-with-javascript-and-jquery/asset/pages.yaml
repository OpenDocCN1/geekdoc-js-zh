    # Retrieving Items


    Elizabeth just subscribed to Mr. Darcy''s latest_books node, and she has missed
    his event broadcasts from earlier in the week. She must investigate his past reading
    material if she wants to learn more about him.


    Remember that Mr. Darcy configured his node to persist items. Anyone can query
    his node for the most published items. Here, Elizabeth requests the last five
    items by sending an IQ-get stanza to the node using the <items> action:


    ```

    <iq from=''elizabeth@longbourn.lit/outside''

    to=''pubsub.pemberley.lit''

    type=''get''

    id=''items1''

    <pubsub xmlns=''http://jabber.org/protocol/pubsub''>

    <items node=''latest_books'' max_items=''3''/>

    </pubsub>

    i>

    ```


    The <items> element contains a node attribute just like the other actions you
    have previously seen. Elizabeth also set the max_items attribute because she is
    interested in the recent history. If she had omitted max_items, the server would
    interpret it as a request to send all the historical data that has been configured
    to keep. If she had set max_items to 500, which is much larger than the configured
    maximum for the node, the server would have sent as many as available.'
