- img_proc: true
  md: 'XMPP applications can use a number of techniques to do this. What technique
    is appropriate depends on which resource is contention and the nature of the specific
    application. Your application can grow horizontally in the following ways:


    +   * Running multiple connection managers on different machines and load balancing
    between them

    * Clustering XMPP servers to spread connections over multiple machines

    * Running a single server component on several machines

    * Using internal federation to spread the application over a network of XMPP servers

    * Speaking the server-to-server protocol directly


    Clever programmers will no doubt discover additional ways, but these constitute
    the current practices.


    # ## Multiple Connection Managers


    The BOSH connection manager is an HTTP service, and like most HTTP services, is
    fairly easy to scale across multiple machines. If your application has thousands
    of simultaneously connected users, you will probably need to spread their connections
    and provide a common endpoint for accessing across connection managers.


    Running multiple connection managers is easy with standalone managers, but requires
    server support for clustering when using built-in managers. Once all the connection
    managers are running, you will want to load balance their use and provide a common
    endpoint for accessing them.


    Great source and commercial applications as well as specialized hardware are available
    that load balance and aggregate HTTP services. Most large web sites already employ
    these tools for their normal web applications. Two open source tools for these
    purposes are used as examples in this chapter: nginx and Happoxy.


    Before you dive into the details, there is one more thing to think about load
    balancing BOSH connection managers; connection managers keep a small amount of
    state—the XMPP connection and its identifiers. When a user sends an HTTP request
    for the first time, the load balancer must pick a server to respond. For all later
    requests, the load balancer must continue to choose the same server or the connection
    may be interrupted. Fortunately, most load balancers are capable of tracking server
    assignments via special HTTP cookies because web applications with session support
    often need similarity.


    Each product''s configuration and setup are unique, but many of the concepts described
    in the following examples are applicable to all of them.


    # nginx


    nginx is a lightweight web server built for high performance and stability. Its
    great support for reverse HTTP proxies and load balancing making it a good fit
    for XMPP-based web applications. This section describes a basic load balancing
    setup for the standalone connection manager Punjab. See'
  merge: -1
  pgno: 413
- img_proc: true
  md: "Appendix B for more information on Punjab, standalone connection managers,\
    \ and using nginx as a simple proxy.\n\nYou can find nginx at its web site, http://nginx.net.\n\
    \nFirst, you need to configure and set up Punjab on multiple machines, or run\
    \ several instances on the same machine on different IPs or ports. For purposes\
    \ of this example, it is assumed that Punjab is running on port 5280 on the following\
    \ machines, and that the path to the service is /xmpmp-httpbind:\n\n+   - bosh-1.pemley.lit\n\
    - bosh-2.pemley.lit\n- bosh-3.pemley.lit\n\nnginx will be configured to reverse\
    \ proxy and load balance these three Punjab servers under the local path at /xmpmp-httpbind.\n\
    \nUnder the http section, you need to add an upstream configuration section, like\
    \ the one here, to define the set of Punjab servers:\n\n```\nupstream punjab {\n\
    \    ip_hash;\n    server bosh-1.pemley.lit:5280;\n    server bosh-2.pemley.lit:5280;\n\
    \    server bosh-3.pemley.lit:5280;\n}\n```\n\nThe `ip_hash` directive tells nginx\
    \ to use a hash of the user's IP address to pick a server, guaranteeing that each\
    \ request from that IP will be sent to the same server. Users will not accidentally\
    \ get to a Punjab instance that does not have the user's state. You might notice\
    \ that this is not true load balancing, but in many situations this hash-based\
    \ approach is similarly effective.\n\nUnder the `server` section, you need to\
    \ add a `location` configuration section to set up the reverse proxy. Instead\
    \ of using the hostname of the proxied server, you instead use the previously\
    \ set up upstream configuration named `punjab:\n\n```\nlocation /xmpmp-httpbind\
    \ {\n    proxy_pass http://punjab;\n}\n```\n\nNow nginx will proxy an incoming\
    \ request to /xmpmp-httpbind to one of the three configured servers based on the\
    \ hash of the user's IP address. Please note that adding or removing servers changes\
    \ the hash function; users will likely experience a temporary disconnection if\
    \ you reconfigure the server in this way.\n\nThat's all there is to it! Of course,\
    \ nginx has many configuration options not covered here that can expand upon this\
    \ basic example. Please see the nginx documentation at http://wiki.nginx.org for\
    \ more information on nginx's configuration."
