    \ {\n    var doc = new ActiveXObject('MSXML2.DOMDocument');\n    doc.async = false;\n\
    \    doc.loadXML(text);\n  } else {\n    throw {\n      type: 'PeekError',\n \
    \     message: 'No DOMParser object found.'\n    };\n  }\n}\n```\n\n```\nvar elem\
    \ = doc.documentElement;\nif ($(elem).filter('parserferrer').length > 0) {\n```"
