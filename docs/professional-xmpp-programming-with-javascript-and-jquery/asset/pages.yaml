- img_proc: true
  md: 'To initialize the second node''s database, run the following command:


    ```

    erl -sname ejabberd@xmpp-2 -mnesia dir ''/var/lib/ejabberd'' \nmnesia extra_db_nodes
    ''[ejabberd@xmpp-1]'' -s mnesia

    ```


    Be sure to use the correct quotes because they are important, and the command
    won''t work without the proper quoting. The backslash just continues the command
    on the next line; if you enter the entire command on one line, you can omit it.
    You may also have to edit the node names and the path to the database if these
    are different on your system. Finally, if you are using fully qualified names,
    you''ll need to change -sname -name.


    The previous command will leave you inside an Erlang command shell. You can verify
    that both nodes are connected to the database by typing the following command
    and pressing Enter:\mnesia:info().


    You should see a line starting with “running db nodes” that includes your two
    ejabber nodes.


    If all has gone, you can now copy the schema to the new node. Type in the following
    command and press Enter:\mnesia:change_table_copy_type(schema, node(), disc_copies).


    You can now exit the Erlang shell by typing:

    q().


    Your second ejabber node is ready to be started. Start it the same way as the
    first node, with:

    ejabberdctl start


    If you are running more than two nodes, you can repeat the instructions for the
    second node for all the additional nodes. Some people run ejabber clusters spanning
    dozens of machines!

    You can use the same steps as in the previous section to load balance among them.
    If you want to load balance XMPP connections, you rely on DNS to round-robin requests
    by listing all available XMPP nodes in appropriate SRV records. You can use Haproxy
    or another TCP load balancer solution to load balance the XMPP connections from
    a single endpoint.


    # Spreading Out Components


    You learned about components in Chapter 1 when the different kinds of XMPP entities
    were described. All of the XMPP code in this book describes the server as a client,
    but often XMPP services are written as server components. Several XMPP servers,
    including ejabber, support load balancing components, offering yet another way
    to scale your applications.


    The idea behind load balancing of components is that multiple components connect
    to the server with the same identity. For example, if the service is provided
    by library.pemberley.lit, each machine would run the component and connect as
    library.pemberley.lit.'
  merge: -1
  pgno: 417
- img_proc: true
  md: 'In ejabber''s case, this load balancing is done by sending requests to each
    machine in a round-robin fashion. In a clustered setup, ejabber first tries connected
    machines, followed by the remote ones. This load balancing strategy is not suited
    to all applications, but it is helpful in several cases. Currently, other strategies
    are not supported but should be easy to add by aspiring Erlang hackers.


    You will need to consult your server''s documentation to see if it supports load
    balancing of components and what strategies it employs. If your service can be
    to take advantage of this, it will be able to scale well.


    # Federating Internally


    There is no reason that every user or component of an XMPP service must be located
    on the same server or domain. In these cases, you can forgo server clustering
    and turn to internal federation to achieve scale. Federated servers are internal
    servers that talk to each other via the server-to-server protocol, just as public
    XMPP servers talk to each other.


    Internal federation can even be combined with clustering. For example, a global
    XMPP service may have clusters in the U.S. and in Europe, each of which communicates
    with the other via regular


    One advantage of federation over clustering is that there are no shared databases
    between servers, so the achievable scale is far higher. There is practically no
    limit to how many XMPP servers (or e-mail, HTTP, or DNS servers) can exist and
    communicate with each other.


    Often application boundaries exist out which to place the federation boundaries.
    Some might use geography as a guide, and others might use IP hashes. If the service
    is the same at any location, any number of techniques can be used to place users
    at the fastest or most appropriate


    # Becoming a Server


    There is no reason that XMPP servers must be the only things that speak the server-to-server
    protocol. Probably the most efficient way to scale an application is to use the
    always translator and have your service speak the server-to-server directly.


    The server-to-server protocol is slightly more complicated than the client-to-server
    protocol, due to its reliance on TLS certificates or dialback authentication.
    Once the XMPP streams are set up, the same kinds of stanzas are sent back and
    forth.


    If your XMPP service has little need for user accounts, rosters, or other traditional
    IM features, you might be better off without a server. For example, an XMPP pubsub
    service might be unrelated to any particular server full of users, and such a
    pubsub service could be made directly addressable as a server.


    There aren''t yet a lot of libraries that make server-to-server protocol programming
    easier, but the situation is rapidly changing as more and more non-IM-related
    XMPP services spring up. This may soon become the way way XMPP services are exposed,
    much in the same way web services have become their own HTTP servers as well.'
  merge: -1
