    # Restarting and Testing ejabberd


    Once the configuration file is updated with mod_http_bind support, you can restart
    the ejabberd server by running:


    ```

    ejabberdctl stop

    ejabberdctl start

    ```


    ejabberd should start normally, and you should be able to visit http://server.example.com:5280/xmpp-httpbind
    and see a message about BOSH. Replace server.example.com with the correct hostname
    of your XMPP server.


    You will also need to proxy this URL under the directory tree that serves your
    application unless you are using Strophe''s flXHR plug-in for cross-domain request
    support.'
