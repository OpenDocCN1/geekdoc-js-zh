- img_proc: true
  md: 'When you ask Strophe to connect to a server, you also provide a callback function,
    which Strophe invokes every time the connection phase changes. This allows your
    application to handle events like the connection starting, authentication failing,
    or disconnection.


    The full list of these phase changes or statuses is shown in Table 3-1. The status
    names correspond to constants defined in the Strophe.Status object. For example,
    the CONNECTED status is Strophe.Status.CONNECTED.


    # ### TABLE 3-1: Strophe Connection Statuses


    | STATUS | DESCRIPTION |

    | --- | --- |

    | CONNECTING | Strophe has started its attempt to make a connection to the XMPP
    server. |

    | AUTHENTICATING | The connection has been established, and Strophe is now attempting
    to authenticate and create a session. |

    | CONNECTED | A session has been established, and user data may now flow freely.
    |

    | DISCONNECTING | Termination of the connection has started. |

    | DISCONNECTED | The connection is fully terminated. |

    | CONNAIL | Strophe encountered a problem trying to establish the connection.
    |

    | AUTFAIL | An error occurred during the authentication process. |


    A normal XMPP connection will progress through the first five phases, and your
    application will be concerned mostly with CONNECTED and DISCONNECTED. Errors in
    the connection can be handled by watching for the CONNAIL and AUTFAIL statuses.
    The -ING statuses are not often used, except to provide visual updates in the
    UI so that users know what they are waiting for.


    # ## Creating a Connection


    XMPP connections are managed through the Strophe.Connection object. In Chapter
    2 you learned a BOSH connection manager provides the bridge between the worlds
    of HTTP and XMPP. BOSH connection managers are exposed to HTTP clients as URLs,
    and the Strophe.Connection object you create needs to know about one of these
    URLs.


    Many servers have support for BOSH built in, and they typically expose the server
    at http://example.com:5280/bosh-bind and http://example.com:5280/xmpp-httpbind.
    Some BOSH connection managers can handle connections for arbitrary XMPP servers,
    but generally the built-in connection managers can only talk to the server they
    run on.


    For developing the applications in this book, you are free to use the BOSH connection
    manager at http://bosh.metajack.im:5280/xmpp-httpbind. This BOSH connection manager
    is able to speak to any public XMPP server. This server is provided specifically
    for readers of this book to use during development to avoid everyone having to
    set up their BOSH service.'
  merge: -1
  pgno: 73
