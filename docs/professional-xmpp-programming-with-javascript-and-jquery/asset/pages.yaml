- img_proc: true
  md: '```

    <feature var=''jabber:iq:version''>

    <feature var=''msgoffline''/>

    </query>

    </iq>

    ```


    The pamberley.lit server reports its name and tells the client it is an instant
    messaging service. It also enumerates the features that the server supports, including
    disco#info support, XMPP client support, support for roster commands, support
    for roster queries, and support for the storage of messages for offline users.


    XMPP servers vary in their responses to disco#info queries, but the responses
    in the same format are. Formally, XMPP servers will support a wide range of features,
    and the list of identities and features will be much longer than those of the
    fictional pamberley.lit. Disco#info responses are required to contain at least
    one identity and at least disco#info feature.


    Each <identity> element contains an optional name attribute as well as the required
    category and type attributes. A list of category and type values is maintained
    by the XMPP registrar and you can find it at http://xmpp.org/registrar/disco-categories.html
    Entities that provide multiple services under a single address return <identity>
    elements, one per service.


    The <feature> element lists the basic features of the entity. These often refer
    to namespaces used in various XMPP protocol extensions, and the XMPP registrar
    maintains the list of registered features at http://xmpp.org/registrar/disco-features.html.
    In the previous example, all the msgoffline feature used the relevant namespaces
    as identifiers.


    Applications use this information to determine what kind of services particular
    entities provide, or to determine whether a particular service supports some specific
    feature. For example, not all servers support server-side logging of group chats.
    Those that do not advertise support in a <feature> element.


    # Disco#items Queries


    Service discovery is organized in the form of a tree. The disco#items query requests
    the list of children for. Some of these will be other entities and some will be
    internal nodes. By continuing to do disco#items queries on each child, the entire
    tree can be expanded.


    Requesting disco#items on an XMPP server returns the various server-side components
    that make up the server, as a separately addressable entity. For example, a publish-subscribe
    service would return the list of top-level nodes, which may also have child nodes.
    Multi-user chat servers return disco#items queries by returning the list of chats.


    Disco#items queries are almost exactly the same as disco#info queries:


    ```

    <iq to=''pember.lit''

    from=''elizabeth@longbourn.lit/lambton''

    type=''get''

    id=''items''

    <query xmlns=''http://jabber.org/protocol/disco#items''/>

    </iq>

    ```'
