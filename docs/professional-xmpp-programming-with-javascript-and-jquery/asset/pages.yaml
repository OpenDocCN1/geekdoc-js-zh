  md: "```\n));\nPeek.connection = conn;\n));\n```\n\ncode snippet peek.js\n\nMuch\
    \ of this code you've seen in Chapter 3. The highlighted lines are new, and over-write\
    \ the blank, do-nothing default logging functions of the connection object with\
    \ your own versions. Instead of printing to two functions that would be almost\
    \ identical, inline functions are used that will call `show_traffic()` with the\
    \ correct parameters.\n\nAdd the following implementation of the Peek object,\
