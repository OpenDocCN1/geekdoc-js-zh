  md: '# Authentication


    XMPP allows for Transport Layer Security (TLS) encryption, and most clients use
    this by default. Once TLS support is advertised by the server, the client starts
    the TLS connection and upgrades the current socket to an encrypted without disconnecting.
    Once TLS encryption is established, a new pair of XMPP streams is created.


    Authentication in XMPP uses the Simple Authentication and Security Layers (SASL)
    protocol, and depending on the server involved, can support a number of authentication
    mechanisms. Normally servers provide plain text authentication and MD5 digest-based
    authentication, but some servers support authenticating via Kerberos or special
    tokens.


    These same encryption and authentication technologies are also used in many other
    protocols — e-mail and LDAP are — and common libraries for supporting TLS and
    SASL can be used well for XMPP.


    Once authentication is complete, a client must bind for a resource and start a
    session. If you are watching XMPP traffic on the wire, you will see <bind> and
    <session> elements — inside iqanzas being sent to those jobs. If the client does
    not provide a resource to bind, the server chooses one for it, usually randomly.
    The server may alter the user''s chosen resource even if the client provides one.


    When two servers connect to each other, the authentication steps are slightly
    different. The servers exchange and verify TLS certificates, or the recipient
    server uses a dialback protocol to verify the sender''s identity over DNS.


    # Disconnection


    When users are done with their XMPP sessions, they terminate the sessions and
    disconnect. The most polite way to terminate a session is to first send unavailable
    presence and then close the <stream:stream> element.


    By sending a unavailable presence, the user''s contacts can be informed about
    the reasons for the user''s departure. The stream explicitly allows any in-flight
    stanzas to arrive safely.


    A polite disconnection would look like this:


    ```

    <presence type=''unavailable''/>

    </stream:stream>

    ```


    The server then terminates its stream to the client.


    # SUMMARY


    In this chapter, you met the XMPP protocol and learned about its history, addressing,
    vocabulary, and the connection life cycle. You''ve also seen several example XMPP
    stanzas and learned about the different entities composing an XMPP network.'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'You should now understand:


    +   - XMPP is an open, standardized protocol, originally developed to replace
    proprietary IM networks.

    - The XMPP protocol is more than a decade old and mature.

    - XMPP is great for writing IM applications, but it also excels at any task that
    benefits from exchanging structured messages.

    - Servers, clients, components, and plug-ins are all parts of XMPP networks and
    have their special uses.

    - XMPP addresses, called JIDs, resemble e-mail addresses and decompose into three
    parts: the local part, the domain, and the resource.

    - Full JIDs are the most specific addresses for an entity; for example, darcy@pemberley.lit/.

    - Bare JIDs are the same as full JIDs without the resource; for example, darcy@pemberley.lit.

    - Stanzas will handle to a client''s bare JID, potentially routing them to one
    or more resources.

    - There are three stanzas in the main XMPP vocabulary: `<message>`, `<presence>`,
    and `<iq>`.

    - The `<message>` stanza is used for fire-and-forget messages between two entities.

    - `<presence>` stanzas communicate presence status changes and are used to manipulate
    presence subscriptions.

    - The `<iq>` stanza provides request-response semantics very similar to the GET
    and POST operations of the HTTP protocol.

    - Every XMPP session has a life cycle consisting of several phases: connection,
    stream set up, authentication, the session body, and disconnection.


    The basic concepts and protocol syntax of XMPP are all once piece of the puzzle.
    You learn how to use these ideas to design XMPP applications in the next chapter.'
  merge: -1
