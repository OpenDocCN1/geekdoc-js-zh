  md: 'is the from the user’s perspective whether the contact is on an unreachable
    server or offline. However, presence errors received when trying to join a multi-user
    chat room (see Chapter 8) indicate real problems that the user should be notified.


    # BETTER DEBUGGING


    Peek is already extremely useful, but it could be even better. Try adding some
    extra features:


    +   - Make stanzas in the console foldable — clicking on an element hides and
    shows children.

    - Often users will want to run the same commands again; add support for command
    history.


    # SUMMARY


    In this chapter, you built an application to inspect protocol traffic and aid
    in exploration and debugging of XMPP applications and services. Along the way:


    +   - Hooked into Strophe’s structured logging facilities

    - Parsed XML input from the user

    - Rendered XML as nicely formatted HTML

    - Evaluated user input as JavaScript code


    Once Peek was built, it was used to explore some common pieces of the XMPP protocol:


    +   - Manipulating your own presence information

    - Retrieving software version information from other entities

    - Dealing with various common stanza errors


    Throughout the rest of the book, you should find Peek useful in diagnosing problems
    and exploring the XMPP protocol.


    In the next chapter, you build a simple messaging client for use with the Identi.ca
    microblogging service.'
