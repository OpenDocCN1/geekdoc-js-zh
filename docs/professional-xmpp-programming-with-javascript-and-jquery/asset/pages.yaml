    \ is left is to enable the users to send their updates back to Identica.\n\n#\
    \ Sending Messages\n\nSending messages to Identica is via normal XMPP messages,\
    \ as you might expect. You don't need to worry about sending XHTML-IM content\
    \ or dealing with links in the message because the Identica system will translate\
    \ your and link all of the appropriate items before delivering it to your subscribers.\
    \ Before you send the message, you should hook up the character counter so that\
    \ Arthur can give users warning before Identica rejects their long messages.\n\
    \nCounting characters is trivial in JavaScript, because the String object supports\
    \ the length property just like arrays. The only challenge is when to measure\
    \ the length of the text and then update\n\nWhen someone uses an input field or\
    \ text box, the browser triggers the keydown, keypress, and keyup events in the\
    \ order. The trouble is that the keypress event, which is the most obvious choice\
    \ for where to put the count logic, is triggered before the value of the input\
    \ field is modified. When the first keypress event is triggered, the value of\
    \ the field will still be blank. Fortunately, the field is modified before the\
    \ keyup event is called, so you can place the appropriate logic there to update\
    \ the counter."
