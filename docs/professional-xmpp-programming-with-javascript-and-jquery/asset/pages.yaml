  md: '# #8

    Group Chatting:

    A Multi-User Chat Client


    WHAT''S IN THIS CHAPTER?


    +   - Joining group chat rooms

    - Creating and configuring rooms

    - Exchanging presence and messages in group chat

    - Multi-user chat roles and permissions

    - Moderating rooms


    XMPP''s multi-user chat (MUX) extension was originally inspired by the Internet
    Relay Chat (IRC) protocol. Some clever XMPP protocol designers wanted to improve
    upon IRC in several ways, while at the same time bringing group chat natively
    to XMPP.


    XMPP''s multi-user chat (MUX) has one enormous advantage over its predecessors
    — structured payloads. IRC and other chat protocols typically transmit plain text
    and forth with very little structure. Because of XMPP''s extensibility, MUC messages
    can carry arbitrarily complex payloads even within regular chat messages.


    MUX is also a form of message broadcast. A single message sent to a room gets
    reread out to all the participants automatically. This makes it similar to Publish-Subscribe,
    which you see in the next chapter. Unlike Publish-Subscribe, MUC provides a lot
    of advanced management features typical of group chat services, such as room moderation,
    and each participant is often allowed to broadcast messages to the room as well.'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'The combination of structured messaging, automatic broadcast, and group publishing
    opens the doors to many alternative uses of MUC. It has been used as the basis
    for rich, collaborative spaces (for example, Drop.io, which was shown in Chapter
    2), and in Chapter 11, you build a multi-user Tic-Tac-Toe game on top of MUC.


    Multi-user chat is a big protocol, and a full-featured client can become quite
    sophisticated. In this chapter, you build a simple group chat client called Groupie,
    which uses the most important pieces of the MUC protocol.


    # APPLICATION PREVIEW


    Figure 8-1 shows a screenshot of the finished Groupie application. Just as in
    previous chapters, the application''s interface is as simple as possible.


    ![](img/eb420c48595351b731631bccf1c8fdc4_191_0.png)


    FIGURE 8-1


    At the top of the screen are the chat and participant areas. The chat area contains
    all the messages people send to the room as well as private messages sent to and
    from the user. The participant area contains the list of current occupants with
    whom the user is conversing. Beneath the chat area is a text box for the user
    to type and send messages.'
  merge: -1
