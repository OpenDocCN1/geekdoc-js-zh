  md: "# 10\n\n# # Writing with Friends:\n A Collaborative Text Editor\n\n**WHAT'S\
    \ IN THIS CHAPTER?\n\n+   - Learning the Operational Transformation algorithm\n\
    - Using service discovery to probe features\n- Extending XMPP stanzas\n\nPeople\
    \ used to mail manuscripts back and forth to collaborate. Over the years, as technology\
    \ improved, this turned into file sharing via disks and then sharing over e-mail.\
    \ Technology has now reached a point where multiple people, even in large groups,\
    \ can simultaneously edit the same document over the network, and the familiarity\
    \ of the Web has made it both easy and common. Given your previous experience\
    \ with XMPP applications, it should be no surprise to that XMPP provides an ideal\
    \ medium for collaborative document editing.\n\nOne of the latest examples of\
    \ such applications is Google Wave, a rich, media-filled, collaborative space\
    \ for people to work on shared documents. When Google needed a protocol to facilitate\
    \ such a platform, it turned to XMPP. On top of XMPP, Google has built a fantastic\
    \ platform for collaborative editing based on the principles of *operational transformation*.\
    \ It has also chosen to detail its project design on the Wave protocol in the\
    \ open at http://www.waveprotocol.org.\n\nIn this chapter, you will build a collaborative\
    \ text editor based on the same principles as Google Wave — operational transformation.\
    \ Although the application is designed for collaboration between pair of users,\
    \ the underlying algorithms can be scaled to arbitrary numbers of collaborators.\
    \ You see through this and other applications how simple it is to build sophisticated\
    \ software on top of XMPP’s core technology."
