    Once the invitations are received, both players must join the room. The protocol
    interactions are thereafter covered in the next section.


    A few possible errors exist for game starts. If a player tries to start a game
    with a user who is not currently on the list, the server returns an item not found
    error such as the following:


    ```

    <iq to=''jane@longbourn.lit/outside''

    from=''referee@pemberley.lit/tootem''

    type=''error''

    id=''start2''>

    <start xmlns=''http://metajack.im/ns/tootem''

    with=''elizabeth@longbourn.lit/library''/>

    <error type=''modify''>

    <item-not-found xmlns=''urn:ietf:params:xml:ns:xmpp-stanzas''/>

    </error>

    </iq>

    ```


    Also, it is possible that the requested player has already started a game with
    someone else and is currently busy playing. In this case, the referee returns
    a not allowed error such as the:


    ```

    <iq to=''jane@longbourn.lit/outside''

    from=''referee@pemberley.lit/tootem''

    type=''error''

    id=''start1''>

    <start xmlns=''http://metajack.im/ns/tootem''

    with=''darcy@pemberley.lit/library''/>

    <error type=''cancel''>

    <not-allowed xmlns=''urn:ietf:params:xml:ns:xmpp-stanzas''/>

    </error>

    </iq>

    ```


