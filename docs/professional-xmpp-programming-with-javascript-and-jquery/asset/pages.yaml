  md: "# IMPLEMENTING GAME MANAGEMENT\n\nThe next step on the path to a complete game\
    \ system is to implement the game management features as well as chat game.\n\n\
    For the referee this includes the ability to create new games between players,\
    \ make chat rooms for these games, and invite the players to the rooms to interact.\
    \ The referee must also handle the list of active games as well as keep this list,\
    \ the waiting player list, and the players up-to-date as games begin and end.\n\
    \nThe game page of the Totem client will be activated and its widgets enabled.\
    \ The Start Game button you saw in the previous section must also be implemented.\
    \ Finally, the client will need to be able to send and receive chat messages in\
    \ the room.\n\n# Referee Version Two\n\nThe referee must keep track of active\
    \ games and it will interact with a multi-user chat server to create game rooms.\
    \ Add the following new attributes to the Referee object, which an add games dictionary\
    \ and protocol namespaces for MUC:\n\n```\ngames: {\nNS_MUC: \"http://jabber.org/protocol/muc\"\
    ,\nNS_MUC_USER: \"http://jabber.org/protocol/muc#\",\nNS_MUC_OWNER: \"http://jabber.org/protocol/muc#\"\
    ,\nMUC_SERVICE: 'games.mberley.lit'\n```\n\ncode snippet referee.js\n\nNote that\
    \ you must change the MUC_SERVICE value to an appropriate multi-user chat service;\
    \ the value used here is only a placeholder. Favorite XMPP server probably runs\
    \ a service at conference.domain.com.\n\nThe referee's on_iq(iq) handler, created\
    \ earlier, will need to respond to new commands — start and resign. These new\
    \ commands will start a new game and end a game. Add the following new commands\
    \ to the switch statement in on_iq(iq) handler:\n\n```\ncase 'start':\n    Referee.on_game_start(iq,\
    \ id, from, child);\n    break;\ncase 'resign':\n    Referee.on_resign(iq, id,\
    \ from);\n    break;\n```\n\ncode snippet referee.js\n\nNext, you implement on_game_start()\
    \ and on_resign()."
