  md: "The handler sends an IQ-result with the appropriate <identity> and <feature>\
    \ elements. NetPad identifies itself as a chat with NetPad protocol support. Note\
    \ that the response's id attribute must match the original request's id attribute.\n\
    \nIf you run NetPad now, you should be able to see the feature negotiation in\
    \ action. Try collaborating with both NetPad user and a regular XMPP server, and\
