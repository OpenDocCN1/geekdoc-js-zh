  md: "# Extending the XMPP Protocol\n\nby setting the value of the xmlns attribute\
    \ to the namespace defined. The following example shows a <message> stanza with\
    \ an extended <event> child under a new default namespace. Children under the\
    \ <event> element are also under the new namespace because they have no namespace\
    \ specified, and the <x> element declares another namespace for the form and its\
    \ children.\n\n```\n<message to='elizabeth@longbourn.lit/bedroom'\n  from='pubsub.pemberley.lit'>n<event\
    \ xmlns='http://jabber.org/protocol/pubsub#event'>\n<items name='latest_books'>\n\
    \  <item id='821b576dafabc6b358b6ec4139b87f5c'>\n<x xmlns='jabber:x' type='result'>\n\
    <field var='title'>\n<value>A History of Pemberley</value>\n</field>\n<field var='author'>\n\
    <value>Sir Lewis de Burgh</value>\n</field>\n</x>\n</item>\n</items>\n</event>\n\
    </message>\n```\n\n# Namespaces Prefixes\n\nInstead of changing the default namespace,\
    \ XML elements may define namespace prefixes. You're see these briefly in Chapter\
    \ 1; the <stream:stream> element that opens an XMPP stream is a fixed element.\n\
    \nPrefixes must be defined before or at the time of their use, and descendants\
    \ of an element that defines a prefix will also inherit the prefix's definition.\
    \ The prefix is defined by including an xmlns:foo attribute, where foo is the\
    \ prefix you want to use. The value of this attribute is what the prefix is bound.\
    \ Prefixes appear before element names and are separated from them by a colon.\n\
    \nThe following example shows the same <message> stanza as before, but uses prefixes\
    \ instead of changing the default namespace:\n\n```\n<message to='elizabeth@longbourn.lit/bedroom'\n\
    \  from='pubsub.pemberley.lit'>\n<pubsub:event xmlns='http://jabber.org/protocol/pubsub#event'>\n\
    <pubsub:items name='latest_books'>\n<pubsub:item id='821b576dafabc6b358b6ec4139b87f5c'>\n\
    <x xmlns='jabber:x' type='result'>\n<field var='title'>\n<value>A History of Pemberley</value>\n\
    </field>\n<field var='author'>\n<value>Sir Lewis de Burgh</value>\n</field>\n\
    </x>\n</pubsub:item>\n</pubsub:items>\n</pubsub:event>\n</message>\n```"
