    \ game room. Add the following code to the Referee object:\n\n```\non_game_start:\
    \ function (iq, id, from, elem) {\n    var with_id = $elem->attr('with');\n  \
    \  var with_bare = Strophe.getBareJidFromid(with_id);\n\n    // check that the\
    \ players are available\n    if (Referee::is_waiting(with_id)) {\n        Referee::send_error(iq,\
    \ 'modify', 'item-not-found');\n        return;\n    }\n\n    if (Referee::is_playing(with_id)\
