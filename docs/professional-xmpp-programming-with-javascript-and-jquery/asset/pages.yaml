  md: 'The server''s response looks just like your original creation request for a
    named node. It generated a random number for the node name because it instructed
    that you didn''t care what the node was. Pubsub services may name instant nodes;
    one might name each node with a random string of characters, and another might
    use a numeric counter.


    # Configuring Nodes


    Newly created pubsub nodes have a default configuration that is useful for many
    purposes. Normally the default configuration is for a publicly accessible node
    that persists a few of the most recently published items and only the node''s
    creator (also called the owner) to publish to. The exact configuration that you
    use depends on the service and its configuration.


    Applications with special requirements may need to configure pubsub nodes appropriately
    to ensure those requirements are met. SketchCast, for example, should just provide
    a few drawing actions or new subscribers may be confused by a partial sketch.
    The pubsub node configuration also includes things like the title of the node,
    the access controls, and whether event notifications include the original data.


    Pubsub node configuration is done by submitting a form inside a <configure> action.
    Node configuration must be done by the owner of the node, so the <pub> element''s
    name is slightly different from the previous example. Request a configuration
    form to see what options are available:


    ```

    <iq from="darcy@pembley.lit/library"

    to="pubsub.pembley.lit"

    type="get"

    id="configure1"

    <pubsub xmlns="http://jabber.org/protocol/pubsub#owner">

    <configure node="latest_books"/>

    </pubsub>

    </iq>

    ```


    The server returns a blank configuration form. Many of the form fields are omitted
    in the following form so you can concentrate on the structure of the protocol
    instead of fine details. Also, XMPP servers vary in their support of the pubsub
    feature set, so don''t be surprised if a server doesn''t return some of these
    fields.


    ```

    <iq from="pubsub.pembley.lit"

    to="darcy@pembley.lit/library"

    type="result"

    id="configure1"

    <pubsub xmlns="http://jabber.org/protocol/pubsub#owner">

    <configure node="latest_books">

    <x xmlns="x:data" type="form">

    <field var="FORM_TYPE" type="hidden">

    <value>http://jabber.org/protocol/pubsub#node_config</value>

    </field>

    <field var="pubsub_title" type="text-single">

    label=''A friendly name for the node/''

    </field>

    <field var="pubsub_persist_items" type="boolean">

    label=''Persist items to storage/''

    <value>true</value>

    </field>

    </x>

    </configure>

    </pubsub>

    </iq>

    ```'
