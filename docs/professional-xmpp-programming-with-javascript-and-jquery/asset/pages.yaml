    \ be able to log in to a server and see your roster displayed and sorted.\n\n\
    # Handling IQs\n\n<iq> stanzas are special in XMPP in that they are the only stanzas\
    \ required to have a response. Every IQ-get or IQ-set stanza must receive a corresponding\
    \ IQ-result or IQ-error stanza, just as any GET or POST request must receive a\
    \ response in the HTTP protocol. All <iq> stanzas must also contain an id attribute\
    \ that is unique enough to identify them within a session. The reason for this\
    \ is that the same attribute be used to tag the response so that the code knows\
    \ which IQ-get IQ-set stanza a particular IQ-result or IQ-error stanza corresponds."
