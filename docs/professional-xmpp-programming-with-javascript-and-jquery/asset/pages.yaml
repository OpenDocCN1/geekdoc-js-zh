  md: "# Testing for Support\n\nA client can signal support for the NetPad protocol\
    \ by responding appropriately to service discovery requests. The client must watch\
    \ for disco#info queries and return a <feature> element containing a var attribute\
    \ of http://metajack.im/ns/netpad.\n\nHere is an example from a client claiming\
    \ to support the NetPad protocol:\n\n```\n<iq to='darcy@mberley.lit/library'\n\
    from='bingley@netherfield.lit/drawing_room'\ntype='result'\nid='netpad'>\n <query\
    \ xmlns='http://jabber.org/protocol/disco#info'>\n <identity category='client'\n\
    \  type='pc'\n  name='NetPad'/>\n <feature var='http://jabber.org/protocol/disco#info'>\n\
    \  <feature var='http://metajack.im/ns/netpad'/>\n </query>\n</iq>\n```\n\nOnce\
    \ the application knows that the remote user supports the NetPad protocol, it\
    \ can start to interact with using the protocol.\n\n# Requesting and Controlling\
    \ Sessions\n\nOnce an editing session is established, the hosting user will want\
    \ to be notified if the other party leaves. Directed presence is well suited to\
    \ provide a base protocol for this situation. The remote user can send direct\
    \ presence along with a NetPad protocol element requesting an editing session.\n\
    \nThis new element is called <collaborate>, and here is an example of it for an\
    \ editing session:\n\n```\n<presence to='bingley@netherfield.lit/drawing_room'\n\
    from='darcy@mberley.lit/library'\n <collaborate xmlns='http://metajack.im/ns/netpad'/>\n\
    </presence>\n```\n\nBingley receives not only the request for collaboration, but\
    \ will also receive notification if Darcy goes offline, explicitly ending an session.\n\
    \nIt's possible that Bingley is already in a session with another user, so an\
    \ appropriate error must be returned in this case. XMPP stanzas may contain application\
    \ specific condition codes, and you can create the <already-collaborating> condition\
    \ for this situation. Here's an example error response from Bingley:\n\n```\n\
    <presence to='darcy@mberley.lit/library'\nfrom='bingley@netherfield.lit/drawing_room'\n\
    type='error'\n <collaborate xmlns='http://metajack.im/ns/netpad'>\n <error type='wait'>\n\
    \ <recipient-unavailable xmlns='urn:iet:params:xml:xmpp-stanzas'/>\n```"
  merge: -1
