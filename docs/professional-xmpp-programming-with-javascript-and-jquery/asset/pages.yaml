  md: "# BEST PRACTICES FOR INSTANT MESSAGING\n\nGab is currently a little too simple,\
    \ and it doesn't conform to the standard best practices for communication. For\
    \ example, outgoing messages are always sent to the bare JID of the user, even\
    \ if a full address is known for them. Messages need to be addressed with care\
    \ because their delivery is affected by a server's routing rules.\n\n# Understanding\
    \ Message Routing\n\nXMPP <message> stanzas are routed specially by XMPP servers.\
    \ Particularly, the server will do different things depending on whether the attribute\
    \ is a bare JID or a full JID.\n\nMessages addressed to a user's bare JID are\
    \ delivered to the connected resource with the highest priority. If multiple resources\
    \ are tied for the highest priority, the server may choose to deliver the message\
    \ to all of them or choose the best one. A server chooses the best resource for\
    \ delivery is server dependent. Most servers deliver to all tied resources, but\
    \ you may encounter servers that attempt to guess by estimating the most recently\
    \ active resource.\n\nMessages addressed to full JIDs are delivered only to that\
    \ specific resource, or if that resource is offline, potentially to avoid storage\
    \ until the next online comes.\n\nBecause sending a message to a bare JID may\
    \ result in multiple deliveries, it is best to address messages to the full JID\
    \ as soon as you receive the full address of the other party.\n\nFor example,\
    \ if you haven't been communicating with a user, you should address a message\
    \ to their bare JID. They respond, and you will know which resource you are talking\
    \ to, and you can use that destination to address messages to them.\n\nUsers may\
    \ go online and offline and away back at a chat. Because you may want to receive\
    \ messages at a different location after these events, it is best to forget the\
    \ full addresses of users whenever their presence status changes. Once you have\
    \ their first reply, you can start addressing messages to the potentially new,\
    \ full address.\n\nNow that you have a better understanding of message routing,\
    \ you can update Gab to the right thing when sending messages.\n\n# Addressing\
    \ Messages Better\n\nChanging Gab to address messages to full JIDs is very easy.\
    \ The default way to send messages is already stored in the chat's <div> element,\
    \ so all that is needed is replace the bare JID stored with the user's full JID.\
    \ Of course, you only want to do this when you know the full address in on_message().\
    \ Modify the following lines in your on_message() handler:\n\n```\non_message:\
    \ function (message) {\n  var full_jid = $(message).attr('from');\n  var jid =\
    \ Strophe.getBareJIDFromJID(full_jid);\n  var j_id = Gab.to(jid);\n\n  if ($('#chat-'\
    \ + jid_id).length === 0) {\n    $('#chat-area').tabs('add', '#chat-' + jid_id,\
    \ jid);\n\n}\n```\n\n![](img/eb420c48595351b731631bccf1c8fdc4_152_0.png)"
  merge: -1
  pgno: 152
