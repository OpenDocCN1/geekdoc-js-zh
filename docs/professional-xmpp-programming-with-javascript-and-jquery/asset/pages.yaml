  md: "# 14\n\n# Writing Strophe Plug-ins\n\nWHAT'S IN THIS CHAPTER?\n\n+   - Using\
    \ Strophe plug-ins\n- Creating plug-ins\n- Adding namespaces to Strophe\n- Building\
    \ a simple roster plug-in\n\nThe applications in this book were all written using\
    \ Strophe's primitive functions to build and send XMPP code this way provided\
    \ valuable visibility into how the various extensions of XMPP work. In real applications,\
    \ however, it is nice to develop some abstractions to reduce some of the grunt\
    \ work. Strophe allows users to build and load plug-ins that extend its functionality\
    \ so that abstractions can be built by developers and used by applications.\n\n\
    As an example, recall that in Chapter 9 you built SketchCast, which broadcast\
    \ events to a pubsub node for subscribers to watch. The application's code created\
    \ subscription stanzas, node creation stanzas, and configuration stanzas to accomplish\
    \ its task. Imagine if there was a pubsub plug-in for Strophe that encapsulated\
    \ this logic for you. Code using this plug-in might appear as:\n\n```\nSketchCast.connection.pubsub.create(\n\
    \  SketchCast.node, SketchCast.created, SketchCast.create_error());\n\nSketchCast.connection.pubsub.configure(\n\
    \  SketchCast.node, {\"max_items\": 20},\n  SketchCast.configured, SketchCast.configure_error);\n\
    ```"
  merge: -1
  pgno: 426
- img_proc: true
  md: "This version of the code is no less correct, but much shorter and much clearer.\
    \ The details of how to build the various stanzas required for the operations\
    \ are hidden behind the Strophe's interface, leaving you to think about your application's\
    \ logic rather than protocol details.\n\nSeveral Strophe plug-ins are already\
    \ available on the Strophe web, and more are created by its users. Before you\
    \ start your next XMP project, you might want to take a look at the available\
    \ plug-ins to see if there is one that meets your application's needs. You should\
    \ feel free to contribute plug-ins to the community as well!\n\nPlug-ins are a\
    \ great way to create running code, by leveraging the work of others. They also\
    \ enable you to modularize your code, by separating application logic from the\
    \ underlying protocol semantics. In this chapter, you see exactly how to use plug-ins\
    \ and create ones of your own.\n\n# USING PLUG-INS\n\nUsing plug-ins is as easy\
    \ as loading the plug-in code and accessing the new functionality through a Strophe.Connection\
    \ instance. Each plug-in automatically installs itself into the Strophe library\
    \ when loaded and becomes an attribute of the connection whenever a new connection\
    \ is created.\n\n# Loading Plug-ins\n\nStrophe plug-ins must be loaded after the\
    \ Strophe library. The following HTML code loads the Strophe pubsub plug-in, included\
    \ with the Strophe library, after the main Strophe code:\n\n```\n<script src='strophe.js'></script>\n\
    <script src='strophe.pubsub.js\\></script>\n```\n\nBy convention, plug-ins are\
    \ named strophe.plugin-name.js. The plug-inject inserts itself into the Strophe\
    \ library automatically once loaded (see how this is done in \"Creating Plug-ins\"\
    \ section). If you are familiar with jQuery plug-ins, this should look very similar.\n\
    \n# Accessing Plug Functionality\n\nOnce plug-ins are loaded, they become available\
    \ to all Strophe.Connection object instances. If you load a plug-in from the file\
    \ strophe.plugin.js, the plug-interface will be accessible via the myplugin attribute\
    \ on the connection object. If you load the Strophe pubsub in the previous example,\
    \ you would access it like this:\n\n```\nvar connection = new Strophe.Connection(BOSH_URL);\n\
    connection.connect( . );\n\nconnection.pubsub.subscribe('pubsub.pemberly.lit',\
    \ 'latest_books',\n  function (iq) { . },\n  function (iq) { . } });\n```\n\n\
    Other pubsub plug-in functionality will be accessed the same way."
  merge: -1
  pgno: 427
- img_proc: true
  md: 'In addition to providing new functions, plug-ins can also add new namespaces
    to Strope. These namespaces are accessible alongside the built-in ones found in
    the Strope.NS object. For example, the Strope pubsub-plug-in adds many pubsub-related
    namespaces to Strope, a of which are:


    +   - Strope.NS.PUBSUB, which expands to http://jabber.org/protocol/pubsub

    - Strope.NS.PUBSUB_OWNER, which expands to http://jabber.org/protocol/pubsub-owner

    - Strope.NS.PUBSUB_EVENT, which expands to http://jabber.org/protocol/pubsub-event


    These namespaces make it very convenient to build pubsub stanzas yourself if for
    some reason the plug-in doesn''t provide the functionality you want directly.
    They will save you typing and searching through the specifications.


    Each plug-in provides different functions, but these are always accessible in
    the same way. Want to learn more about a particular plug-in and the operations
    it performs, please see its documentation. Even if the plug-in is sparsely documented
    or not documented at all, the tools you have learned throughout this book should
    make it easy to understand all the most complicated plug-ins. After all, most
    plug-ins are just wrappers around common protocol operations.


    Now that you know how to load and use plug plugins, you should read on to how
    to build your own!


    # BUILDING PLUG-INS


    Plug-ins are created by making a prototype object that defines the plug-in''s
    functionality and registering that with the Strophe library. When a new Strophe
    connection is established, it creates a plug-object from the prototype and calls
    the object''s init() to initialize the plug-in. After initialization, the plug-in
    is ready to be used by your application for later.


    The init() also serves another purpose. Most plug-ins will need to send data over
    the XMPP connection and set status handlers, and for these tasks, the plug-in
    needs access to a Strope.Connection object. Strope will pass the connection object
    as the first parameter to init(), and the plug-in can use this reference for later
    use.


    Another function to most plug-ins is statusChanged(). Strope calls each plug-in''s
    statusChanged() whenever the connection status changes. This is exactly the same
    as the connection callback you''ve seen in many of the previous chapters. This
    allows the plug-in to react to events like CONNECTED and DISCONNECTED. This function
    is optional, but some plug-ins may need to respond to invocation.


    The example plug-in in Listing 14-1 is one of the smallest Strope plug-ins you
    can make. Aside from the init() function discussed earlier, it also provides online()
    and offline() functions that change your presence.'
  merge: -1
  pgno: 428
