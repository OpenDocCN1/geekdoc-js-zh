    darcy@emberley.lit\"\n```\n\nHello now says to the user's server, but it does\
    \ not yet anything on the server's response. The last piece of the puzzle is handling\
    \ stanzas.\n\n# HANDLING EVENTS\n\nMost XMPP applications are event driven. Some\
    \ events are triggered by user interactions like clicking the mouse or pressing\
    \ a key, and others are triggered by incoming stanzas. For example, when a message\
    \ is received the application handles displaying it to the user. Handling incoming\
    \ stanzas is probably the most important part of an XMPP application, and Strophe\
    \ makes doing so quite simple.\n\n# Adding and Removing Handlers\n\nNew stanzas\
    \ can be added with addHandler() and removed with deleteHandler(). The following\
    \ code shows the basics of using these functions:\n\n```\nvar ref = conn.addHandler(my_handler_function,\
    \ null, \"message\");\n// once the handler is no longer needed:\nconnection.deleteHandler(ref);\n\
    ```\n\nThe addHandler() returns a handler reference. This reference is only used\
    \ for passing to deleteHandler() to identify the specific handler\n\nThe deleteHandler()\
    \ function is not often used since handlers have a way of removing themselves\
    \ when they are no longer needed. In some cases, the knowledge of when to remove\
    \ a handler is not available within the handler, and deleteHandler() does the\
    \ job in these situations.\n\n# Stanza Matching\n\nThe addHandler() function takes\
    \ one or more parameters. The first parameter is the function that is invoked\
    \ when a stanza is received. The rest of the list of parameters is shown in this\
    \ abbreviated function from the Strophe server code:\n\n```\naddHandler: function\
    \ (handler, ns, name, type, id, from) {\n  implementation omitted\n}\n```\n\n\
    If any of the criteria are null or undefined, any stanza will match. Otherwise,\
    \ stanzas match only if they satisfy the criteria by string equality in a particular\
    \ part of the stanza. The last four criteria—name, type, id, and from—filters\
    \ on the stanza's element name and the type, id, and from attributes. These four\
    \ criteria are checked only on the top-level element, not on any of the element's"
