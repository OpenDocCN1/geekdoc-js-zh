    Jane attempts to add Mr. Darcy to her roster, and the server indicates success
    with a blank IQ-result. In the cases where the response is simply an acknowledgment
    of success, the IQ-result stanza will often be empty.


    The <iq> stanza is quite useful in any case where result data or simple acknowledgment
    is required. Most XMPP extension protocols use a mix of <iq> and <message> stanzas
    to accomplish their goals. The <iq> stanzas are used for things like configuration
    and state changes, where <message> stanzas are used for regular communication.
    In some cases <iq> stanzas are used for communication because stanza acknowledgment
    can be used for rate limiting.'
