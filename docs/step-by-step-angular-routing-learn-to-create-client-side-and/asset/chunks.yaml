  raw: '## [Summary](#toc.xhtml_ch64)


    Using lazy loading to load modules improves the startup performance of our Angular
    application by loading only the required modules, and then when the user requests
    for a specific module, we will load it to provide the template for that. We also
    saw how we can preload the lazy loaded modules to avoid the waiting time and the
    three different strategies of preloading. We then saw how to preload all the lazy
    loaded modules or preload only some of them, whereas loading others only if and
    when required.


    In the next chapter, we will deal with loads of data and perform different create,
    read, update, and delete operations on this data using routing.


    # [CHAPTER 12](#toc.xhtml_cn12)


    # [CRUD Operations


    with Routing](#toc.xhtml_cn12)


    After having learnt almost all the concepts of routing, let us jump into dealing
    with data when performing Angular routing. In this chapter, we will see how to
    perform various operations on data with routing in an Angular application. The
    most required operations in almost any application that we work with are creating,
    reading, updating, and deleting the data which is what is known as CRUD operations.
    Now perform these operations on different routes bring in routing in the concept
    of CRUD operations.


    By the end of this chapter, you will be able to understand how to deal with the
    data and these operations on different routes using all the concepts that you
    have learnt like route guards, loading data in a child route, using the auxiliary
    route to load the data, and more.


    We will cover the following topics in this chapter:


    *   What are CRUD operations?


    *   Using in-memory-web-api


    *   Read data


    *   Create data


    *   Update data


    *   Delete data


    ## [What are CRUD operations?](#toc.xhtml_ch65)


    Let us first take a look at CRUD operations.


    The operations to be performed on the data are create, read, update, and delete
    which are collectively called CRUD operations. These operations are a must to
    perform when dealing with data that might be residing on the server or in a local
    file or anywhere else as shown in the following screenshot:


    ![](images/p106-001.jpg)


    Fig 12.1


    To get the data to perform these operations, we can send an HTTP request to the
    server, receive the data, and perform the operations. However, for testing and
    development purposes, we can use the `angular-in-memory-web-api` provided by the
    Angular official documentation. This `angular-in-memory-web-api` mocks the call
    to the backend server and gets the data for us to perform these operations on
    it. This `angular-in-memory-web-api,` however, is not a part of Angular core.
    When we say it mocks the call to the backend, it means that it will send the HTTP
    request to the local in-memory-data-store and get the data for us, thus making
    the task of dealing with data a lot easier. We can simply replace this service
    when working with the real server in a real-time application.


    There are many other ways of faking the backend server to get the data such as
    creating a file with the hard coded data in it, using a local JSON file, and as
    discussed, using the `angular-in-memory-web-api`.


    ## [Using in-memory-web-api](#toc.xhtml_ch66)


    To start, the very first task is to install `angular-in-memory-web-api` using
    the following command:


    **`npm install angular-in-memory-web-api — save-dev`**


    The save dev flag is used here to save this dependency that you will use for the
    development purpose.


    Once done, you will be able to see it in the dependencies inside your `package.json`
    file as shown in the following screenshot:


    ![](images/p107-001.jpg)


    Fig 12.2


    Now that we have this dependency saved in our application, we can go forward with
    using the `angular-in-memory-web-api` for performing CRUD operations inside our
    application.


    Step one is to create an entity class where we mention the class name and its
    properties as shown in the following screenshot:


    ![](images/p108-001.jpg)


    Fig 12.3


    After our entity class is ready, we will implement `InMemoryDbService` inside
    a new class as a service. Let us take a look at the following code for this:


    `import {InMemoryDbService} from ‘angular-in-memory-web-api’;`


    `import {User} from ‘./user-data’;`


    `export class UserData implements InMemoryDbService {`


    `createDb(){`


    `  const users: User[]=[`


    `{ id: 1, name: ‘Ram’, email: ‘ram@gmail.com’, contact: ‘0000000000’ },`


    `{ id: 2, name: ‘Shyam’, email: ‘sh@gmail.com’, contact: ‘1111111111’ },`


    `{ id: 3, name: ‘Mohan’, email: ‘moh@live.in’, contact: ‘2222222222’ },`


    `{ id: 4, name: ‘Rohan’, email: ‘rohan@gmail.com’, contact: ‘6666666666’ },`


    `{ id: 5, name: ‘Sumit’, email: ‘sumit@live.in’, contact: ‘9909999999’ }`


    `  ];`


    `  return {users};`


    `}`


    `}`


    In the preceding code, we are overriding the `createDb()` method and creating
    a collection of the entity `users` which returns its collection in the end. The
    other thing that we do here is to import the `InMemoryDbService` module. To use
    all these, we need to register these inside the module as shown in the following
    screenshot:


    ![](images/p109-001.jpg)


    Fig 12.4


    After we have registered it inside the module, we are finally ready to perform
    the CRUD operations using the angular in-memory web API now.


    To do this, let us create a service and perform HTTP operations inside that as
    shown in the following code snippet:


    `import { Injectable } from ‘@angular/core’;`


    `import {HttpClient, HttpHeaders} from ‘@angular/common/http’;`


    `import {Observable, throwError} from ‘rxjs’;`


