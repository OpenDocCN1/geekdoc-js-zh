    ## [What is Angular?](#toc.xhtml_ch1)


    Angular is a JavaScript framework used to build client-side applications using
    HTML, CSS, and a programming language such as JavaScript. It is a collection of
    components which contain the code to execute the applications and have an associated
    template that displays the data on the browser. Angular provides features like
    binding the data from the code to appear on the template, expressive HTML, built-in
    packages to interact with different services, service for back-end integration,
    and more.


    Angular comprises components, services, directives, modules, pipes, etc. to make
    our applications much more effective. There are so many applications built on
    Angular now and there has been a shift in the world of web development after the
    introduction of the Angular framework from AngularJS to Angular 7 (soon to be
    Angular 8). Angular started as a side project in 2009 by Misko Hevery and Adam
    Abrons to help build web applications using HTML tags. The name *Angular* comes
    from the angle brackets used for HTML tags.


    The basic structure of Angular includes:


    *   NgModules


    *   Components


    *   Directives


    *   Services and Dependency Injection


    *   Routing


    *   Data binding


    *   We will start by taking a look at how to set up a development environment
    for building applications with Angular.


    ## [Setting up a development environment](#toc.xhtml_ch2)


    To build Angular applications, we would need to connect many dependencies, web
    development servers, and packages to each other. But to build and set up an Angular
    application from scratch takes some time.


    Angular provides us with a command line tool for creating the Angular apps called
    Angular CLI.


    Angular CLI provides us with all the required dependencies, boilerplates, takes
    care of the web pack configuration, unit test configuration, and transpiles TypeScript
    files to JavaScript.


    To install Angular CLI on our local machine, we can use the node package manager
    `npm.`


