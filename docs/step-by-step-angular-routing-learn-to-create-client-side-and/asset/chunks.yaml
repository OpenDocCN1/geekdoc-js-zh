    ## [Summary](#toc.xhtml_ch53)


    In this chapter, we covered the concept of grouping routes and creating component-less
    routes. We also saw how a component-less route groups every route inside it and
    uses common guards and route resolvers. In the next chapter, we will learn about
    route resolvers and how they make routing in Angular much more effective when
    dealing with any data.


    # [CHAPTER 10](#toc.xhtml_cn10)


    # [Route Resolvers](#toc.xhtml_cn10)


    We have been coming across route resolvers for a long time now. In almost every
    topic, we discussed and saw the usage of route resolvers somewhere or the other.
    But you might be wondering why I put this topic a little later in the book. So,
    this chapter will sort of justify its placement here in the book.


    We have seen different usages of routes now such as child routes loading the data
    within some template, secondary routes loading the routes as stand-alone at a
    higher level, route guards making the application much more effective by taking
    care of important things like security, monitoring, authorization, and so on.
    Now, in this chapter, we will see how the routes, as the name of this chapter
    clearly denotes, will get some data loaded before loading the whole template view.
    It might sound a little confusing now, but by the end of this chapter, you will
    be able to understand why this topic is known as **`Resolving the routes`**.


    In this chapter, we will cover the following topics:


    *   What are route resolvers?


    *   Usage of route resolvers


    *   Adding route resolvers


    ## [What are route resolvers?](#toc.xhtml_ch54)


    When we route from one view to another, and the template of the second view requires
    some data, we face a delayed loading of data in this view. The static data on
    the template loads as the user navigates to the route, whereas the data that is
    coming from the server through the APIs takes a long time to show up in the template
    view. This does not appear to be very responsive in an application. Partial loading
    of any view is not attractive at all. In such a case, we can load the data before
    actually routing the view so that when we receive all the data, i.e. static as
    well as the data that is to come from the server, then we can proceed to route
    to the next view with the full template ready.


    By prefetching the data, we would not actually have to face the partial data loaded
    in the view. We can also reuse the data while prefetching and use the same code
    for the data access service. Prefetching also allows you to resolve any errors
    that we might have in the route before actually navigating to the next route.


    Now there are different ways to get the data for your component view. This data
    can come from the `angular-in-memory-web-api`, or some service, or maybe from
    some local JSON file or you can also use the data property of the route configuration.
    This data property of the route configuration looks like this:


    `//Route Data Property`


    `{`


    `path: ‘user’,`


    `component: UserComponent,`


    `data: {dataProp: ‘UserData’}`


    `}`


    In the code, route looks like this:


    ![](images/p086-001.jpg)


    Fig 10.1


    And inside the component, refer to this data property as given in the following
    code:


    `this.dataProp = this.route.snapshot.data[‘dataProp’];`


    This is one way of getting the data; however, we can get the data from an Angular
    service to communicate among components that are not related to each other or
    via HTTP to create API calls to the server.


    Before moving to the usages of route resolvers, let us understand how the process
    of resolving a route works. So, you route to a URL where you expect some data
    in the template. However, the static elements of that template appear in the view
    but the data coming from the backend loads in some time after the static data
    on the template. To solve this, resolvers actually prevent your view to be displayed
    before the data gets loaded. So, the component actually gets activated when your
    data has arrived at the view and the template can be displayed fully, not just
    with the static elements.


    But how does it work?


    So, with a route resolver, the data need not come to the component when it has
    been activated already. It comes to the resolver service which then gets ready
    with the data and activates the component to display the completely loaded template
    view. If we do not have a resolver, the click of a link/button will direct you
    to the view, load what is available, wait for the data to come from the server,
    and then display the rest of the data on the template.


    Let us see how it looks diagrammatically (without the route resolver):


    ![](images/p087-001.jpg)


    Fig 10.2


    Without the route resolver, when you click on the link/button to navigate to the
    next route, the flow goes to the component template which is to be displayed.
    This then displays whatever data is available inside the template and then waits
    for the data from the server. In the meantime, the user gets a partially loaded
    view of the component’s template. After it gets the data from the server, it shows
    up on the template and the view appears fully loaded.


    Let us see how it looks diagrammatically (with the route resolver):


    ![](images/p088-001.jpg)


    Fig 10.3


    With the route resolver, however, the flow goes to the service instead of directly
    going to the component, and waits for the data from the server. Once it gets the
    complete data, it activates the component and displays the fully loaded component
    template view.


    ## [Uses of route resolvers](#toc.xhtml_ch55)


    Working with route resolvers includes three steps in the process. Resolvers are
    created as Angular services so the first step is to build a custom Angular service
    for the data needed for our component. Once the service is created, we add the
    resolve property to the route configuration and use it to add the resolver to
    access the data for that particular route. After the route gets the data, which
    we need for the component, the component then reads the data from the activated
    route service.


    In the previous chapter, we saw how to read the data from the `ActivatedRoute`
    service. It can be done using a snapshot or an observable. In case the data does
    not change and always remains the same, we use the snapshot. However, if the data
    that comes is expected to change, it is advisable to use an observable. Now let
    us read the following code:


    `//Building a Route Resolver Service`


    `import { Injectable } from ‘@angular/core’;`


    `import { Resolve, ActivatedRouteSnapshot, RouterStateSnapshot } from ‘@angular/`


    `router’;`


    `import { Observable } from ‘rxjs’;`


    `import {User} from ‘./user-data’;`


    `@Injectable({`


    `  providedIn: ‘root’ })`


    `export class UserResolver implements Resolve<User> {`


    `resolve(route: ActivatedRouteSnapshot, state: RouterStateSnapshot):`


    `Observable<User>{}`


    `}`


    The `ActivatedRouteSnapshot` module gives us the information about the current
    route whereas the `RouteStateSnapshot` module tells about the state of the router.
    After calling the resolve method, the router calls in the data and then gets the
    component view loaded.


    Inside the code, it looks as shown in the following screenshot:


    ![](images/p089-001.jpg)


    Fig 10.4


    What does the resolve method do?


    It calls the `get` method for the data and returns it to the component.


    Use the resolve property inside the route configuration.


