  trans: "\n\n*   通过代码激活路由\n*   使用 `navigate()` 和 `navigateByUrl()`\n*   路由路径和模块的顺序\n\
    \n## 定义功能模块 (Feature Module)\n\n当你的应用程序开始增长，并且想要根据包含的特定功能和功能来组织代码时，功能模块（feature\
    \ modules）就是你的救星。功能模块用于将特定功能的代码组织到某个特定的模块中。例如，如果你想将应用程序中所有与用户相关的路由路径放在一起，你可以创建一个\
    \ `UserModule`，它本质上就是一个功能模块。\n\n功能模块有助于将代码从根模块（root module）中分离，但在整个应用程序的任何地方都可以访问。功能模块通过使用服务、指令、组件等与其他模块以及根模块进行协作。\n\
    \n要创建一个功能模块，你将在 CLI 上使用以下命令：\n\n```\nng generate module module-name\n```\n\n功能模块的结构与\
    \ Angular 中的任何其他模块一样。下一步是导入一个公共模块，它会拉取所有需要的公共指令：\n\n```typescript\nimport {CommonModule}\
    \ from ‘angular/common’;\n```\n\n如果你想引入所有路由路径都需要访问的公共模块，你也可以创建一个共享模块（shared module）并将其导入。\n\
    \n要向功能模块添加路由，你需要向 `RouterModule` 添加导入语句并将其添加到 `declarations` 数组中。由于这是一个功能模块，你需要使用\
    \ `forChild()` 代替 `forRoot()` 来声明 `Routes` 数组：\n\n```typescript\nRouterModule.forChild([\n\
    \  {path: ‘next’, component: NextComponent}\n])\n```\n\n我们将按照下面的截图定义 `NgModule`：\n\
    \n![](img/p036-001.jpg)\n\n图 4.1\n\n在命名功能路由时，对功能路由使用相同的名称，然后添加它的其他扩展版本，这是一种良好的做法。这意味着，如果你正在创建一个用户功能模块，并且想通过特定的\
    \ ID 访问用户，你应该能够简单地使用 `user/:id`，其中 `id` 是一个路由参数。\n\n路由参数（Route parameters）的概念将在下一章介绍。\n\
    \n![](img/p037-001.jpg)\n\n图 4.2\n\n## 通过代码激活路由\n\n在上一章中，你已经了如何使用 `routerLink`\
    \ 指令在组件模板上激活路由。然而，当你想要在执行路由之前使用代码时，你会面临一个挑战。\n\n简单来说，理解这一点：当用户已登录，而你想在实际导航到主页之前使用注销按钮注销用户，这时你需要在实际执行路由之前使用代码。\n\
    \n为了实现这一点，你需要使用 Angular 的 `Router` 服务。该服务被注入到组件的构造函数中，通过它，你可以使用 `navigate` 方法链接到路由路径进行导航：\n\
    \n```typescript\nimport { Component } from ‘@angular/core’;\nimport { Router }\
    \ from ‘@angular/router’;\n\n@Component({\n  selector: ‘app-root’,\n  templateUrl:\
    \ ‘./app.component.html’,\n  styleUrls: [‘./app.component.css’]\n})\nexport class\
    \ AppComponent {\n  title = ‘RoutingDemo’;\n  constructor(private router: Router){}\n\
    \  signOut(){\n    this.router.navigate([‘/next’]);\n  }\n}\n```\n\n这将在用户注销账户后导航到\
    \ `NextComponent`。\n\n## 使用 navigate() 和 navigateByUrl()\n\n`navigateByUrl` 方法显示完整的\
    \ URL 路径，移除其中存在的任何其他路径。当涉及到次级路由（secondary routes）时，该方法与 `navigate` 方法不同。\n\n使用\
    \ `navigate` 方法，第一个路由信息将改变，但次级路由将保持原样且不会从当前路由中消失。\n\n例如，`localhost:4200/next(secondaryroute)`。在这种情况下，如果可以将路由从\
    \ `next` 改为 `third`，即：\n\n`localhost:4200/third`\n\n使用 `navigate` 方法，你可以将路由从 `next`\
    \ 改为 `third`，但次级路由将保持原样，它看起来如下：\n\n`localhost:4200/third(secondaryroute) //使用\
    \ navigate() 方法`\n\n然而，如果你想通过链接到的新路由替换整个 URL，你可以使用 `navigateByUrl` 方法，它将通过替换整个路由导航到\
    \ `thirdcomponent`。代码看起来如下：\n\n`localhost:4200/third //使用 navigateByUrl() 方法`\n\
    \n现在让我们来看看它的实现。在 `LoginComponent` 内部，我正在使用 `navigateByUrl()` 方法来确保无论用户从 `Login`\
    \ 组件路由到任何其他地方，它都会完全替换 URL。代码如下：\n\n```typescript\nexport class LoginComponent\
    \ implements OnInit {\n  loginForm: FormGroup;\n  constructor(private router:\
    \ Router){}\n  ngOnInit(){\n    this.loginForm = new FormGroup({\n      Name :\
    \ new FormControl(),\n      Email: new FormControl(),\n      Password: new FormControl()\n\
    \    })\n  }\n  submit(){\n    this.router.navigateByUrl(‘/home’);\n  }\n}\n```\n\
    \n现在让我们在浏览器中查看！\n\n![](img/p39-001.jpg)\n\n图 4.3\n\n## Appmodule 内部路由及其顺序\n\n\
    在 Angular 应用程序中，放置路由的顺序至关重要，因为它决定了组件的路由。让我们通过一个示例来理解这一点。目前，`appmodule` 如下：\n\n\
    ```typescript\nRouterModule.forRoot([\n  {path: ‘home’, component: HomeComponent},\n\
    \  {path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},\n  {path: ‘**’, component:\
    \ NotFoundComponent}\n]),\nUserModule,\nDataModule\n```\n\n现在的顺序看起来如下：\n\n*  \
    \ `AppComponent`\n*   `‘’`\n*   `UserModule`\n*   `DataModule`\n\n但这并不是 Angular\
    \ 放置路由的顺序。显式定义在模块中的任何路由始终在导入的功能模块之后考虑。\n\n因此，正确的顺序应该是：\n\n*   `UserModule`\n*\
    \   `DataModule`\n*   `HomeComponent`\n*   `‘’`\n*   `**`\n\n现在让我们看看具有独立路由模块的情况。在上一章中，你已经看到如果应用程序涉及路由，最新版本的\
    \ CLI 会要求创建一个独立的路由模块。\n\n在这种情况下，结构如下 (`RoutingModule`）：\n\n```typescript\n@NgModule({\n\
    \  imports: [\n    RouterModule.forRoot([\n      {path: ‘home’, component: HomeComponent},\n\
    \      {path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},\n      {path: ‘**’,\
    \ component: NotFoundComponent}\n    ])\n  ],\n  exports: [RouterModule]\n})\n\
    export class RoutingModule{}\n```\n\n在这种情况下，结构如下 (`AppModule`）：\n\n```typescript\n\
    @NgModule({\n  imports: [\n    RoutingModule,\n    UserModule,\n    DataModule\n\
    \  ],\n  declarations: [\n  AppComponent,\n  HomeComponent,\n  NotFoundComponent\n\
    ]\n})\nexport class AppModule{}\n```\n\n"
- fmt: "\nTherefore, it is very important to make sure that when you have routing\
    \ configurations in an external routing module, import it in the `AppModule` after\
    \ all the feature module routes.\n\nThis order in the `AppModule` will then look\
    \ like as shown in the following code:\n\n```typescript\n@NgModule({\n  imports:\
    \ [\n    UserModule,\n    DataModule,\n    AppRoutingModule //AppRoutingModule\
    \ moved at the end of all other modules\n  ],\n  declarations: [\n    AppComponent,\n\
    \    HomeComponent,\n    NotFoundComponent\n  ]\n})\nexport class AppModule{}\n\
    ```\n\nPlacing the routes in a separate routing module now behaves in the same\
    \ way as it was when all the routes were in the `AppModule`.\n\n## Use of a separate\
    \ module for routing configurations\n\nWhen the application starts becoming huge\
    \ and complex, keeping all the route configurations inside a dedicated routing\
    \ module simplifies the task quite a lot and helps in better organization. You\
    \ would not need to see all the route configurations every time you want to make\
    \ any updates in the `AppModule`.\n\n## Summary\n\nIn this chapter, we learned\
    \ about the use of feature modules and how routing becomes so simplified by using\
    \ better ordering and organization of route paths in an Angular application. We\
    \ also covered topics such as creating feature modules and accessing them using\
    \ the feature route configurations. We also saw the use of `navigate` and `navigateByUrl`,\
    \ followed by understanding the importance of adding routes in a particular order.\
    \ We also discussed how to pass routing parameters to view specific component\
    \ data. In the next chapter, we will learn about Routing parameters.\n\n# CHAPTER\
    \ 5\n\n# Routing Parameters\n\nIn this chapter, you will learn about passing data\
    \ to your routes to get specific views of your component. When you move from one\
    \ component to the next component and you need to pass some data, you use route\
    \ parameters. For example, if there is a list of products on your current component\
    \ and you want to view one of the products from that list of products. To do this,\
    \ you would need an identifier for that particular product and this identifier\
    \ can be passed as a route parameter to be viewed on the next component.\n\nYou\
    \ will learn about route parameters in detail but before that, you would need\
    \ to have clear concepts about the following topics:\n\n* Configuration, set up\
    \ and activation of routes\n* Understanding of feature routes\n\nNow that you\
    \ know how to set up routes, configure them, activate the routes both from the\
    \ template and the code, and feature modules, you are good to go with passing\
    \ parameters to the routes that you have set up.\n\nIn this chapter, we will cover\
    \ the following topics:\n\n* Defining route parameters\n* Working with route parameters\n\
    * Reading route parameters\n* Optional and query parameters\n\n## Defining route\
    \ parameters\n\nWhen we need to access a particular item out of all the items\
    \ present in the list, we have a unique identifier for that. We pass that unique\
    \ identifier as a route parameter to our route and display the view of the details\
    \ of the item associated with that particular identifier. These are the variables\
    \ passed within the routes whose value depends on the chosen product or item.\n\
    \nIn the previous chapter, we were sort of acquainted with the use of route parameters.\
    \ Our goal in this chapter is to actually understand what that means and how can\
    \ we use route parameters in our application. I will use the same example from\
    \ the previous chapter here:\n\n![](images/p046-001.jpg)\n\nFig 5.1\n\nHere the\
    \ common route is `user` which is a constant route whereas `:id` is a placeholder\
    \ for the variable route which is dependent on which product is chosen. We can\
    \ have multiple variable routes too in the application.\n\nFor example, `localhost:4200/user/:id/products/:num`.\n\
    \nTo configure the route parameter, use the following code:\n\n```typescript\n\
    {path: ‘user/:id’, component: GetUserDetails}\n```\n\n![](images/p047-001.jpg)\n\
    \nFig 5.2\n\nYou have already seen how to activate the routes in the previous\
    \ chapter. To activate the routes which have route parameters passed in, this\
    \ is the syntax that is followed (from the template):\n\n```html\n<a [routerLink]\
    \ = “[‘/user’, user.id]\">{{user.userName}}</a>\n<a [routerLink] = “[‘/user’,\
    \ 0]”>Create User</a>\n```\n\nAs you can see, in the first line of code, the ID\
    \ of the user is passed and this is redirecting the view to the user details with\
    \ that ID. However, if the ID is passed as zero, it will redirect the view to\
    \ create a new user since 0 is not associated with any user as yet.\n\nSimilarly\
    \ (from the `Component`):\n\n```typescript\nthis.router.navigate([‘/user’, this.user.id])\n\
    ```\n\nThis will navigate to the view of the user with this `id` and will appear\
    \ in the browser as shown in the following screenshot:\n\n![](images/p047-002.jpg)\n\
    \nFig 5.3\n\nThe view displays the URL against the user with ID `5`. But we cannot\
    \ really see the data, even though the URL appears to be correct. So, this happens\
    \ because we have just configured the route parameters but are not actually reading\
    \ them.\n\nTo populate the view with the data contained in a particular routed-to\
    \ component, we need to read the route parameters.\n\nAfter configuring and using\
    \ a basic example of a route parameter, let us now proceed to see how we can read\
    \ parameters.\n\n## Reading route parameters\n\nTill now, we have configured the\
    \ routes and we can see the change in the URL. To read the route parameters from\
    \ the activated component, we use the `ActivatedRoute` service. This service helps\
    \ to read the route parameters and display the data corresponding to a particular\
    \ route. To inject this service, use the following line of code:\n\n```typescript\n\
    constructor( private activateRoute: ActivatedRoute)\n```\n\nAfter having injected\
    \ the service, we will use the snapshot option of this service which actually\
    \ provides the initial state of this route. To access the route parameter, we\
    \ use the `paramMap.get()` method and pass in the placeholder for the route as\
    \ the argument:\n\n```typescript\nconst id = this.activateRoute.snapshot.paramMap.get(‘id’);\n\
    ```\n\nAfter receiving the initial value, we would want to change the view every\
    \ time the parameter changes. To subscribe to the change in the parameter, the\
    \ service provides this `paramMap` observable which will get notified every time\
    \ there is some change in the parameter:\n\n```typescript\nthis.activateRoute.paramMap.subscribe(\n\
    \  parameters => {\n    const id = parameters.get(‘id’);\n  }\n);\n```\n\n## Using\
    \ the snapshot option of the ActivatedRoute service\n\nTo use the snapshot method,\
    \ the first step that we need to perform is to import the service:\n\n```typescript\n\
    import {ActivatedRoute} from ‘@angular/router’;\n```\n\nHaving imported the service,\
    \ let us inject it inside the `constructor` of the component. This is similar\
    \ to what we saw earlier in this chapter:\n\n```typescript\nconstructor( private\
    \ activateRoute: ActivatedRoute)\n```\n\nNow, since the snapshot option helps\
    \ to get the initialized state of the route, we need to give it a thought as to\
    \ where exactly to place this statement which reads the data. Now is when the\
    \ lifecycle hook `ngOnInit()` comes into play:\n\n```typescript\nngOnInit(){\n\
    \  const id = this.activateRoute.snapshot.paramMap.get(‘id’);\n  this.getUser(id);\n\
    }\n```\n\nHaving read the route parameters now, let us check if we can see the\
    \ data in the browser:\n\n![](images/p049-001.jpg)\n\nFig 5.4\n\nHowever, when\
    \ there is some change in the route parameter value, the read route parameter\
    \ option will not work. This is because the component will not reinitialize the\
    \ data.\n\nIn such cases, when we need to capture the data for any change that\
    \ has taken place, we need to use the observable provided by the `ActivatedRoute`\
    \ service, that is, `paramMap`.\n"
  raw: 'Therefore, it is very important to make sure that when you have routing configurations
    in an external routing module, import it in the `AppModule` after all the feature
    module routes.


    This order in the `AppModule` will then look like as shown in the following code:


    `@NgModule({`


    `imports: [`


    `UserModule,`


    `DataModule,`


    `AppRoutingModule //AppRoutingModule moved at the end of all other modules`


    `],`


    `})`


    `declarations: [`


    `AppComponent,`


    `HomeComponent,`


    `NotFoundComponent`


    `]`


    `export class AppModule{}`


    Placing the routes in a separate routing module now behaves in the same way as
    it was when all the routes were in the `AppModule`.


    ## [Use of a separate module for routing configurations](#toc.xhtml_ch22)


    When the application starts becoming huge and complex, keeping all the route configurations
    inside a dedicated routing module simplifies the task quite a lot and helps in
    better organization. You would not need to see all the route configurations every
    time you want to make any updates in the AppModule.


    ## [Summary](#toc.xhtml_ch23)


    In this chapter, we learned about the use of feature modules and how routing becomes
    so simplified by using better ordering and organization of route paths in an Angular
    application. We also covered topics such as creating feature modules and accessing
    them using the feature route configurations. We also saw the use of `navigate`
    and `navigateByUrl`, followed by understanding the importance of adding routes
    in a particular order. We also discussed how to pass routing parameters to view
    specific component data. In the next chapter, we will learn about Routing parameters.


    # [CHAPTER 5](#toc.xhtml_cn5)


    # [Routing Parameters](#toc.xhtml_cn5)


    In this chapter, you will learn about passing data to your routes to get specific
    views of your component. When you move from one component to the next component
    and you need to pass some data, you use route parameters. For example, if there
    is a list of products on your current component and you want to view one of the
    products from that list of products. To do this, you would need an identifier
    for that particular product and this identifier can be passed as a route parameter
    to be viewed on the next component.


    You will learn about route parameters in detail but before that, you would need
    to have clear concepts about the following topics:


    *   Configuration, set up and activation of routes


    *   Understanding of feature routes


    Now that you know how to set up routes, configure them, activate the routes both
    from the template and the code, and feature modules, you are good to go with passing
    parameters to the routes that you have set up.


    In this chapter, we will cover the following topics:


    *   Defining route parameters


    *   Working with route parameters


    *   Reading route parameters


    *   Optional and query parameters


    ## [Defining route parameters](#toc.xhtml_ch24)


    When we need to access a particular item out of all the items present in the list,
    we have a unique identifier for that. We pass that unique identifier as a route
    parameter to our route and display the view of the details of the item associated
    with that particular identifier. These are the variables passed within the routes
    whose value depends on the chosen product or item.


    In the previous chapter, we were sort of acquainted with the use of route parameters.
    Our goal in this chapter is to actually understand what that means and how can
    we use route parameters in our application. I will use the same example from the
    previous chapter here:


    ![](images/p046-001.jpg)


    Fig 5.1


    Here the common route is user which is a constant route whereas `:id` is a placeholder
    for the variable route which is dependent on which product is chosen. We can have
    multiple variable routes too in the application.


    For example, `localhost:4200/user/:id/products/:num`.


    To configure the route parameter, use the following code:


    `{path: ‘user/:id’, component: GetUserDetails}`


    ![](images/p047-001.jpg)


    Fig 5.2


    You have already seen how to activate the routes in the previous chapter. To activate
    the routes which have route parameters passed in, this is the syntax that is followed
    (from the template):


    `<a [routerLink] = “[‘/user’, user.id]”>{{user.userName}}</a>`


    `<a [routerLink] = “[‘/user’, 0]”>Create User</a>`


    As you can see, in the first line of code, the ID of the user is passed and this
    is redirecting the view to the user details with that ID. However, if the ID is
    passed as zero, it will redirect the view to create a new user since 0 is not
    associated with any user as yet.


    Similarly, (from the `Component`):


    `his.router.navigate([‘/user’, this.user.id])`


    This will navigate to the view of the user with this `id` and will appear in the
    browser as shown in the following screenshot:


    ![](images/p047-002.jpg)


    Fig 5.3


    The view displays the URL against the user with ID `5`. But we cannot really see
    the data, even though the URL appears to be correct. So, this happens because
    we have just configured the route parameters but are not actually reading them.


    To populate the view with the data contained in a particular routed-to component,
    we need to read the route parameters.


    After configuring and using a basic example of a route parameter, let us now proceed
    to see how we can read parameters.


    ## [Reading route parameters](#toc.xhtml_ch25)


    Till now, we have configured the routes and we can see the change in the URL,
    but what about the data to be retrieved? To read the route parameters from the
    activated component, we use the `ActivatedRoute` service.


    This service helps to read the route parameters and display the data corresponding
    to a particular route. To inject this service, use the following line of code:


    `constructor( private activateRoute: ActivatedRoute)`


    After having injected the service, we will use the snapshot option of this service
    which actually provides the initial state of this route. To access the route parameter,
    we use the `paramMap.get()` method and pass in the placeholder for the route parameter
    as the argument:


    `const id = this.activateRoute.snapshot.paramMap.get(‘id’)`


    After receiving the initial value, we would want to change the view every time
    the value of the parameter changes. To subscribe to the change in the parameter
    value, the service provides this `paramMap` observable which will get notified
    every time there is some change in the router parameter value:


    `this.activateRoute.paramMap.subscribe(){`


    `parameters => {`


    `const id = parameters.get(‘id’);`


    `}`


    `}`


    ## [Using the snapshot option of the ActivatedRoute service](#toc.xhtml_ch26)


    To use the snapshot method, the first step that we need to perform is to import
    the service:


    `import {ActivatedRoute} from ‘@angular/router’;`


    Having imported the service, let us inject it inside the `constructor` of the
    component. This is similar to what we saw earlier in this chapter:


    `constructor( private activateRoute: ActivatedRoute)`


    Now, since the snapshot option helps to get the initialized state of the route,
    we need to give it a thought as to where exactly to place this statement which
    reads the data. Now that is when the lifecycle hook `ngOnInit()` comes into play:


    `ngOnInit(){`


    `const id = this.activateRoute.snapshot.paramMap.get(‘id’);`


    `this.getUser(id);`


    `}`


    Having read the route parameters now, let us check if we can see the data in the
    browser:


    ![](images/p049-001.jpg)


    Fig 5.4


    However, when there is some change in the route parameter value, the read route
    parameter option will not work. This is because the component will not reinitialize
    the data.


    In such cases, when we need to capture the data for any change that has taken
    place, we need to use the observable provided by the `ActivatedRoute` service,
    that is, `paramMap`.'
