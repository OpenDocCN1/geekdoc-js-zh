    the template to display them in the view.


    To place the child routes on the template, we use the router outlet element. This
    element identifies the component template to be displayed without any name given
    to the router outlet. This is because it understands which route to display from
    the hierarchy. The `user.component.html` has the following code:


    `<div>`


    `<div>`


    `<a routerLink=’list’>User List</a>`


    `<a routerLink = ‘details’> User Details </a>`


    `</div>`


    `<router-outlet></router-outlet>`


    `</div>`


    And how does the URL look like when we click on let us say, the **`User List`**
    tab:


    `https:localhost:4200/user/list`


    So, now we have created the child routes, but when we go and click on the child
    routes, they do not work for the obvious reason that we have only created the
    child routes but have not actually activated them. In the next section of this
    chapter, we will see how to activate the child routes that we have created and
    placed using the template.


    Now there are two ways to activate the child routes. We can use the absolute path
    or the relative path.


    The first view of the application will look like this:


    ![](images/p058-002.jpg)


    Fig 6.4


    ## [Activating from the template](#toc.xhtml_ch34)


    Using the absolute path:


    `<a [routerlink]= “[‘/user’, ‘list]” > User List </a>`


    Using the relative path:


    `<a [routerLink]= “[‘list’]” > User List </a>`


    In the case of using an absolute path on the template, we put in all the required
    component route details inside the `routerLink` array. However, in the case of
    using a relative path from the template, we simply use the route name without
    using a slash. This will directly go straight to the list component from the current
    component which is `UserComponent`.


    Now let us see how to activate using the code.


    ## [Activating from the code](#toc.xhtml_ch35)


    Using the absolute path:


    `this.router.navigate([‘/user’,’list’]);`


    Using the relative path


    `this.router.navigate([‘info], {relativeTo: this.route });`


    ![](images/p060-001.jpg)


    Fig 6.5


    We need to make sure that we do not use a slash while using a relative path because
    if we do, the `relativeTo` property will be meaningless then.


    ![](images/p061-001.jpg)


    Fig 6.6


    ## [Summary](#toc.xhtml_ch36)


    In this chapter, we learned how to use child routes in an Angular routing application.
    By child routes, we actually mean placing one route within another route and displaying
    it in the view. We learned how to configure child routes and place them on the
    template. We also saw how to activate the created child routes inside our application.
    We also learned the two ways to activate the child routes, both from the template
    and through the code using the absolute path or the relative path and the `relativeTo`
    attribute while activating through the code.


    In the next chapter, we will learn the other type of routes which are called secondary
    routes. You can call them auxiliary routes too. They are basically displayed at
    the same time in the view and at the same level in the hierarchy of routes.


    # [CHAPTER 7](#toc.xhtml_cn7)


    # [Secondary Routes](#toc.xhtml_cn7)


    In the previous chapter, we saw how one route can contain a child route in a view
    and be placed within a route. Basically, the routes within a route are called
    child routes and this helps us use many routes in a view just by containing it
    inside another route. We can also place multiple routes in a view without them
    actually having a child- parent relationship. All these multiple routes can be
    navigated to from one particular view and have independent navigation at the same
    time. In this chapter, we will see what secondary routes are and how we can implement
    multiple router outlets in a view using named router outlets.


    The concepts around router outlet and child routes have been discussed previously
    in the chapters:


    *   What are secondary routes?


    *   Named router outlets


    *   Activating secondary routes


    ## [What are secondary routes?](#toc.xhtml_ch37)


    When we have a component view where we want to display multiple router outlets
    with different navigation routes for each of them, secondary routes are used.
    Secondary routes are the multiple routes also known as peer or auxiliary routes.


    To place the template of any route component in the view, we use the `<router-outlet>
    </router-outlet>` element. However, in case of multiple routes to be implemented
    in the same view, we would need to place multiple router outlets on the template.
    The first router outlet, therefore, is known as primary router-outlet. And the
    other router outlets are known as secondary router outlets.


    A secondary route is just like another route which has its own child routes, route
    parameters, and secondary routes.


    In a view, this scenario will look something like this:


    ![](images/p064-001.jpg)


    Fig 7.1


    Let us take a look at one of the HTML files of an Angular project and you will
    see a router outlet tag placed in there to basically place the route component
    template on the view where router outlet is:


    `<div align = ‘center’ bg-color=’blue’><h1>Dummy App </h1></div>`


    `<router-outlet></router-outlet>`


    To place the primary route component template, we use the primary router outlet.


    `<router-outlet></router-outlet>`'
