    ## [Summary](#toc.xhtml_ch72)


    In this chapter, we discussed how to create an in-memory data store to mock the
    call to the API and generate a service to get the data from this API. We performed
    the `http.get()` method to read data, the `http.post()` method to create data,
    the `http.put()` method to update data, and the `http.delete()` method to delete
    data by routing to different component templates.


    You should now be able to:


    *   Create routes in Angular.


    *   Navigate to the different routes.


    *   Use multiple router outlets in the same view using named router outlets.


    *   Work with child routes and secondary routes.


    *   Load routes with routes using the child route configurations.


    *   Understand the usage of route guards and route resolvers to make your application
    more effective.


    *   Use asynchronous routing, that is, lazy loading modules to improve the startup
    performance of your application.


    *   Understand why grouping the routes under component-less routes helps.


    *   Understand why it is always better to organize your routes and modules into
    a better hierarchy using feature modules.


    *   Understand why feature modules are needed to perform lazy loading.


    *   Preload data with the techniques to preload all modules, and you will be able
    to also preload only the required lazy loaded modules using the custom preloading
    strategy.


    Remember how `canLoad` guard blocks preloading but this can be fixed by replacing
    the `canLoad` guard with `canActivate` guard.'
