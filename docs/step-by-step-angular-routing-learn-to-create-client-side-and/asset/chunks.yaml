    ## 什么是 Angular?


    Angular 是一个使用 HTML、CSS 和 JavaScript 语言构建客户端应用的 JavaScript 框架。它是一个组件集合，包含了执行代码并关联显示数据的模板。Angular
    提供了诸如将数据绑定到模板、与不同服务交互的内置包以及后端集成等功能。它包含了组件、服务、指令、模块、管道等，使我们的应用程序更加高效。从 AngularJS
    转向 Angular 7 后，Web 开发的世界发生了变化。*Angular* 这个名字源于用于 HTML 标签的角括号。


    Angular 的基础结构包括：


    *   `NgModules`

    *   组件 (Components)

    *   指令 (Directives)

    *   服务 (Services) 和依赖注入

    *   路由 (Routing)

    *   数据绑定 (Data binding)

    *   我们将首先查看如何设置


    ## 搭建开发环境


    要构建 Angular 应用，我们需要连接许多依赖项、开发服务器和包。但从零开始构建和设置 Angular 应用需要花费时间。Angular 为我们提供了用于创建
    Angular 应用的命令行工具，称为 `Angular CLI`。`Angular CLI` 为我们提供了所需的所有依赖、模板代码，处理 webpack
    配置、单元测试配置，并将 TypeScript 文件编译为 JavaScript。


    我们通过节点包管理器 `npm` 在本地机器上安装 `Angular CLI`。


