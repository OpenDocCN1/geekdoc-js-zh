  trans: "\n\n`Tab 1` 是子组件之一，当你点击 `Tab 1` 详情时它将显示其数据。同样，`Tab 2` 是另一个子组件，它通过替换第一个视图在同一个视图中显示结果。\n\
    \n## 配置子路由\n\n要显示子路由，我们将它们放置路由配置中的 `children` 数组中。代码如下：\n\n```\npath: ‘user’,\
    \ component: UserComponent, children: [\n  {path: ‘’, redirectTo: ‘’, pathMatch:\
    \ ‘full’},\n  {path: ‘list’, component: UserListComponent},\n  {path: ‘details,\
    \ component: UserDetailsComponent}\n]\n```\n\n让我们来讨论一下这意味着。这个路由实例是 `routes` 数组的一部分，该数组包含了应用程序中所有的路由。现在对于这个特定的路由\
    \ `UserComponent`，我们需要创建一个或多个子路由。为了实现这一点，我们在该路由实例内部取名为 `children` 的属性。该子属性再次是一个路由数组，包含了该\
    \ `UserComponent` 的所有子路由。现在为了匹配此路由，Angular 将在 URL 中显示为 `user/<child>`。\n\n在这种情况下，可以使用\
    \ [`https://localhost:4200/user/list`](https://localhost:4200/user/list) 或者使用\
    \ [` localhost:4200/user/details`](https://localhost:4200/user/details)。\n\n在\
    \ `Routes` 数组中配置好这些子路由后，我们需要确保在 `declarations` 数组中也声明了它们：\n\n```\ndeclarations:\
    \ [\n  UserListComponent,\n  UserDetailsComponent\n]\n```\n\n我们可以做的另一件事是，当用户进入\
    \ `UserComponent` 时默认显示第一个子路由。这意味着当用户尝试访问 `localhost:4200/user` 时，它实际上会将用户重定向到\
    \ `localhost:4200/user/list` 页面。为了实现这一点，我们可以使用相同的配置并对代码进行微调：\n\n```\npath: ‘user’,\
    \ component: UserComponent, children: [\n  {path: ‘’, redirectTo: ‘list’, pathMatch:\
    \ ‘full’},\n  {path: ‘list’, component: UserListComponent},\n  {path: ‘details,\
    \ component: UserDetailsComponent}\n]\n```\n\n在子路由实例的 `redirectTo` 属性中，我们使用指向\
    \ `UserListComponent` 的路由，这样默认页面就会成为 `UserComponent` 模板的页面。这里最常见的错误之一是在 `redirectTo`\
    \ 属性的路由中使用斜杠。如果我们在 `redirectTo` 属性中使用斜杠，它实际上会将你重定向到 `Home` 页面，那是父级路由实例的 `redirectTo`\
    \ 属性的作用。\n\n在代码中，如下所示：\n\n![](img/p058-001.jpg)\n\n图 6.3\n\n现在我们已经配置了子路由，我们需要将这些路由放置在模板中以便在视图中显示它们。\n\
    \n要在模板上放置子路由，我们使用 `router-outlet` 元素。该元素标识要显示的组件模板，而无需为 router outlet 命名。这是因为它可以从层级结构中理解应该显示哪个路由。`user.component.html`\
    \ 具有以下代码：\n\n```html\n<div>\n  <div>\n    <a routerLink=’list’>User List</a>\n\
    \    <a routerLink = ‘details’> User Details </a>\n  </div>\n  <router-outlet></router-outlet>\n\
    </div>\n```\n\n当我们点击（比如）`User List` 标签时，URL 看起来是怎样的：\n\n`https:localhost:4200/user/list`\n\
    \n所以，现在我们创建了子路由，但当我们点击子路由时，它们不起作用，显而易见的原因是我们只创建了子路由，但还没有真正激活它们。在本章的下一节中，我们将看到如何激活我们创建并放置在模板中的子路由。\n\
    \n现在有两种激活子路由的方法。我们可以使用绝对路径或相对路径。\n\n应用程序的第一个视图看起来如下：\n\n![](img/p058-002.jpg)\n\
    \n图 6.4\n\n## 从模板中激活\n\n使用绝对路径：\n\n```html\n<a [routerlink]= “[‘/user’, ‘list]”\
    \ > User List </a>\n```\n\n使用相对路径：\n\n```html\n<a [routerLink]= “[‘list’]” > User\
    \ List </a>\n```\n\n在模板上使用绝对路径时，我们在 `routerLink` 数组中放入所有的组件路由详情。然而，在从模板使用相对路径的情况下，我们只需使用不带斜杠的路由名称。这将直接从当前组件（即\
    \ `UserComponent`）跳转到列表组件。\n\n现在让我们看看如何通过代码激活。\n\n## 从代码中激活\n\n使用绝对路径：\n\n```javascript\n\
    this.router.navigate([‘/user’,’list’]);\n```\n\n使用相对路径：\n\n```javascript\nthis.router.navigate([‘info],\
    \ {relativeTo: this.route });\n```\n\n![](img/p060-001.jpg)\n\n图 6.5\n\n![](img/p061-001.jpg)\n\
    \n图 6.6\n\n我们需要确保在使用相对路径时不使用斜杠，因为如果这样做，`relativeTo` 属性将失去意义。\n\n## 总结\n\n在本章中，我们学习了如何在\
    \ Angular 中使用子路由。我们看到了如何配置子路由并将它们放置在模板上。我们还学习了如何从模板和通过代码使用绝对或相对路径来激活子路由。在下一章中，我们将学习另一种类型的路由，称为辅助路由（secondary\
    \ routes）。\n\n"
- fmt: "\nSimilarly, to place a secondary router outlet in the same view, you will\
    \ need to use the second router outlet which in this case will then be called\
    \ the secondary outlet. We can place various secondary router outlets in the same\
    \ view to refer to different navigation views and routes.\n\nBut the challenge\
    \ here is how the Angular router would identify which `router-outlet` to use when.\
    \ This means there is no identifier for a particular router outlet which tells\
    \ the Angular router that this particular router outlet contains this particular\
    \ template to be placed in the view.\n\nAnd that is when the concept of named\
    \ router outlets comes in. It is basically a concept to bring in an identifier\
    \ for different router outlets so that the Angular `Router` knows which template\
    \ should be placed in the place of which `Router outlet`.\n\n# Named router outlets\n\
    \nDefining a unique identifier for every router outlet that you have created in\
    \ the view at the same level in the hierarchy of routes is what makes it possible\
    \ for the Angular `Router` to identify where to place the route template.\n\n\
    When we say creating the routes on the same level of hierarchy, it means there\
    \ is no child route created. All routes are the primary ones.\n\nWe can create\
    \ a named router outlet (on the template) using the following code:\n\n```html\
    \ own<div>\n  <router-outlet></router-outlet>\n</div>\n<div>\n  <router-outlet\
    \ name=\"second\"></router-outlet>\n</div>\n```\n\nNow that we have placed the\
    \ secondary router outlet on the template, we need to configure it in the code.\n\
    \n# Setting up and configuring the secondary route\n\nCreating a secondary route\
    \ is very similar to creating a primary route path inside the `RouterModule.forRoot`\
    \ array:\n\n```javascript\n[RouterModule.forRoot([\n  {path: 'login', component:\
    \ LoginComponent, outlet: 'second'}]\n])\n```\n\nThis `outlet` attribute is added\
    \ as one more property to the route path to give the route a unique identifier.\
    \ Whatever name is given to the `outlet` attribute that named router outlet is\
    \ picked up. If inside a feature module, the route is configured inside the `forChild()`\
    \ array.\n\n![](images/p066-001.jpg)\n\nFig 7.2\n\nSo far, there are two steps\
    \ in the process that are done. Step one is to place the router outlet on the\
    \ template wherever you need it, the second step is to configure this route inside\
    \ the code inside the `forRoot` or `forChild` array of the `RouterModule`.\n\n\
    Let us see how the secondary route that we configured looks in the browser. Say,\
    \ there is a route `https://localhost:4200/User`. You want to access the router\
    \ outlet named `second`. It will appear in the browser as `localhost:4200/User(second:\
    \ login)`.\n\nIt follows the route path with the parenthesis to display the secondary\
    \ route with the outlet name, colon, and the secondary route path. In the previous\
    \ example, the route path is `localhost:4200/User`, outlet name is `second`, and\
    \ the secondary route path is `login`.\n\nThe next final step is to activate the\
    \ route that we created.\n\n# Activating secondary outlets\n\nSimilar to the other\
    \ routes’ activation, in case of secondary outlets also, we activate the router\
    \ outlet by placing it inside the template under the `routerLink` directive:\n\
    \n```html\n<a [routerLink]=\"[{outlets: {second: ['login']}}]\"> LOGIN </a>\n\
    ```\n\nThe `routerLink` array contains the `outlet` property which is a key-value\
    \ pair containing the name of the router outlet as the key and the value as the\
    \ name of the secondary route path.\n\nWe can also route to multiple router outlets\
    \ at once. We will first load the primary outlet and then give the key-value pair\
    \ to the secondary outlet:\n\n```html\n<a [routerLink]=\"['/users', user.id, {outlets:\
    \ {second: ['login']}}]\">Login </a>\n```\n\nIn the first part of the array, the\
    \ primary router outlet gets loaded and then when the outlet’s property gets activated,\
    \ it loads the secondary outlet with the outlet name and the route path name.\n\
    \nThis changes the URL and looks like this:\n\n`https://localhost:4200/users(second:\
    \ login)`\n\nHowever, when you need to set some property when configuring the\
    \ secondary route, you would need to write a code for that inside the component\
    \ file and activate the secondary route from the code itself. To do this, let\
    \ us see how to activate the secondary route from the code in the component class.\n\
    \n# Activating from the code\n\nTo activate the secondary route from the code\
    \ instead of the template, we use the `navigate` method:\n\n```javascript\nthis.router.navigate([{outlets:\
    \ {second: ['login']}}]);\n```\n\nSimilarly, to activate the route from the code\
    \ but activate multiple routes at once, we will use the code given below:\n\n\
    ```javascript\nthis.router.navigate(['/users', user.id, {outlets: {second: ['login']}}]);\n\
    ```\n\nWe can also activate the primary and the secondary outlet both at the same\
    \ time. The name that needs to be given to our secondary outlets is chosen by\
    \ us; however, the name given to the primary outlet is by default called `primary`.\n\
    \nWe can also use the `navigatebyUrl` method as discussed in the previous chapters.\
    \ This can be done by manually writing in the URL which you want.\n\n```javascript\n\
    this.router.navigatebyUrl(['/users/2(second: login)])\n```\n\nThis will help access\
    \ the property at the same time when configuring the service and activating the\
    \ secondary outlet.\n\nWhen you want to clear out any secondary outlet that you\
    \ created, you can simply initialize the outlet property to `null`.\n\n```javascript\n\
    this.router.navigate([{outlets: {second: null}}]);\n```\n\nThe following line\
    \ of code is from the template under `routerLink`:\n\n```html\n<a [routerLink]=\"\
    [{outlets: {second: null}}]\">\n```\n\nThis clears the activation of the secondary\
    \ route and the primary outlet still unaffected.\n\n# Summary\n\nIn this chapter,\
    \ we learned how to create secondary routes, how and why is it important to create\
    \ secondary routes. We also saw the use of `Named` router outlets to identify\
    \ uniquely the different router outlets. Activation of the router outlet from\
    \ the template as well as the code was also explained. The primary router uses\
    \ the other outlet, gets it named by default and the secondary ones have the outlet\
    \ name given by us.\n"
  raw: 'Similarly, to place a secondary router outlet in the same view, you will need
    to use the second router outlet which in this case will then be called the secondary
    outlet. We can place various secondary router outlets in the same view to refer
    to different navigation views and routes.


    But the challenge here is how the Angular router would identify which router-outlet
    to use when. This means there is no identifier for a particular router outlet
    which tells the Angular router that this particular router outlet contains this
    particular template to be placed in the view.


    And that is when the concept of named router outlets comes in. It is basically
    a concept to bring in an identifier for different router outlets so that the Angular
    Router knows which template should be placed in the place of which Router outlet.


    ## [Named router outlets](#toc.xhtml_ch38)


    Defining a unique identifier for every router outlet that you have created in
    the view at the same level in the hierarchy of routes is what makes it possible
    for the Angular Router to identify where to place the route template.


    When we say creating the routes on the same level of hierarchy, it means there
    is no child route created. All routes are the primary ones.


    We can create a named router outlet (on the template) using the following code:


    `<div>`


    `<router-outlet ></router-outlet>`


    `</div>`


    `<div>`


    `<router-outlet name = “second”></router-outlet>`


    `/div>`


    Now that we have placed the secondary router outlet on the template, we need to
    configure it in the code.


    ## [Setting up and configuring the secondary route](#toc.xhtml_ch39)


    Creating a secondary route is very similar to creating a primary route path inside
    the `RouterModule.forRoot` array:


    `[RouterModule.forRoot([`


    `{path: ‘login’, component: LoginComponent, outlet: ‘second’}`


    `])`


    This outlet attribute is added as one more property to the route path to give
    the route a unique identifier. Whatever name is given to the outlet attribute
    that named router outlet is picked up. If inside a feature module, the route is
    configured inside the `forChild()` array.


    ![](images/p066-001.jpg)


    Fig 7.2


    So far, there are two steps in the process that are done. Step one is to place
    the router outlet on the template wherever you need it, the second step is to
    configure this route inside the code inside the `forRoot` or `forChild` array
    of the `RouterModule`.


    Let us see how the secondary route that we configured looks in the browser. Say,
    there is a route `https://localhost:4200/User`. You want to access the router
    outlet named second. It will appear in the browser as `localhost:4200/User(second:
    login)`.


    It follows the route path with the parenthesis to display the secondary route
    with the outlet name, colon, and the secondary route path. In the previous example,
    the route path is `localhost:4200/User`, outlet name is second, and the secondary
    route path is login


    The next final step is to activate the route that we created.


    ## [Activating secondary outlets](#toc.xhtml_ch40)


    Similar to the other routes’ activation, in case of secondary outlets also, we
    activate the router outlet by placing it inside the template under the `routerLink`
    directive:


    `<a [routerLink] = “[{outlets: {second: [‘login’]}}]”> LOGIN </a>`


    The `routerLink` array contains the outlet property which is a key-value pair
    containing the name of the router outlet as the key and the value as the name
    of the secondary route path.


    We can also route to multiple router outlets at once. We will first load the primary
    outlet and then give the key-value pair to the secondary outlet:


    `<a [routerLink] = “[‘/users’, user.id, {outlets: {second: [‘login’]}}]”>Login
    </a>`


    In the first part of the array, the primary router outlet gets loaded and then
    when the outlet’s property gets activated, it loads the secondary outlet with
    the outlet name and the route path name.


    This changes the URL and looks like this:


    `https://localhost:4200/users(second: login)`


    However, when you need to set some property when configuring the secondary route,
    you would need to write a code for that inside the component file and activate
    the secondary route from the code itself. To do this, let us see how to activate
    the secondary route from the code in the component class.


    ## [Activating from the code](#toc.xhtml_ch41)


    To activate the secondary route from the code instead of the template, we use
    the navigate method:


    `this.router.navigate([{outlets: {second: [‘login’]}}]);`


    Similarly, to activate the route from the code but activate multiple routes at
    once, we will use the code given below:


    `this.router.navigate([‘/users’, user.id, {outlets: {second: [‘login’]}}]);`


    We can also activate the primary and the secondary outlet both at the same time.
    The name that needs to be given to our secondary outlets is chosen by us; however,
    the name given to the primary outlet is by default called primary.


    We can also use the `navigatebyUrl` method as discussed in the previous chapters.
    This can be done by manually writing in the URL which you want.


    `this.router.navigatebyUrl([‘/users/2(second: login)’])`


    This will help access the property at the same time when configuring the service
    and activating the secondary outlet.


    When you want to clear out any secondary outlet that you created, you can simply
    initialize the outlet property to null.


    `this.router.navigate([{outlets: {second: null }}]);`


    The following line of code is from the template under the `routerLink` directive:


    `<a [routerLink] = “[{outlets: {second: null }}]”>`


    This clears the activation of the secondary route and the primary router outlet
    still works unaffected.


    ## [Summary](#toc.xhtml_ch42)


    In this chapter, we learned how to create secondary routes, how and why is it
    important to create secondary routes. We also saw the use of `Named` router outlets
    to identify uniquely the different secondary router outlets. Activation of the
    router outlet from the template as well as the code was also explained. The primary
    router uses the other outlet, gets it named by default and the secondary ones
    have the outlet name given by us.


    In the next chapter, we will see how we can limit the access of all the routes
    to particular users by the use of route guards. As the name suggests, route guards
    will guard the access to the route for authorization, monitoring, and security
    purposes.


    # [CHAPTER 8](#toc.xhtml_cn8)


    # [Route Guards](#toc.xhtml_cn8)


    We have been learning about navigating from one route to another by going to different
    component views. We also learned the use of child routes, feature routes and using
    different kinds of route parameters to provide specific information to the route
    URLs. We will now dive a little deeper and take a look at securing the route navigation.
    The name of this chapter has a literal meaning of that. When the user wants to
    route from one view to another, but let us assumes he is not a registered user
    and we do not want some information to be visible to this unregistered user, so
    in that case, the best approach to use is using route guards.


    Before getting into the working of route guards, perform a quick check to see
    if the concept of routing from one view to another is clear enough for you to
    proceed. From here, a good understanding of routes, configuring routes, feature
    routes, child routes, and route `params` is a must.


    In this chapter, we will cover the following topics:


    *   Defining route guards


    *   Creating a route guard


    *   CanActivate and CanActivateChild


    *   CanDeactivate


    ## [Defining route guards](#toc.xhtml_ch43)'
