  trans: "\n\n`paramMap` 观察对象将订阅构造函数中 `route` 参数变量值的变化，我们在构造函数中注入了 `ActivatedRoute`\
    \ 服务的依赖。\n\n在从 Angular/router 导入 `ActivatedRoute` 服务并在构造函数中注入该服务后，`paramMap` 观察对象将订阅路由参数值的变化：\n\
    \n```typescript\nconstructor (private activateRoute: ActivatedRoute){\n  this.activateRoute.paramMap.subscribe(\n\
    \    parameters => {\n      console.log(parameters.get('id'));\n    }\n  );\n\
    }\n```\n\n在查看了 snapshot（快照）和 observable（观察对象）的用法后，我们需要确定何时使用 snapshot 选项以及服务提供的\
    \ observable：\n\n- **使用 snapshot 的场景：** 当你只需要读取一次路由参数时，可以使用此选项。当你希望保持代码简单并且知道没有变化空间时，也可以使用此选项。\n\
    - **使用 Observable 的场景：** 当该参数预计反复变化。当你希望获取路由参数的变化通知并订阅这些数据时，可以使用此选项。\n\n在你读取了路由参数并能够在特定路由上成功显示数据后，下一步是查看其他可选参数是什么：\n\
    \n![](img/p051-001.jpg)\n图 5.5\n\n这产生了如下所示所示输出：\n\n![](img/p051-002.jpg)\n图 5.6\n\
    \n现在，当你点击 `Go to this product` 按钮时，它将带你进入下一个路由并在 URL 中显示路由参数：\n\n![](img/p052-001.jpg)\n\
    图 5.7\n\n## 查询参数与可选参数\n\n当我们想要向路由传递一些可选信息时，我们可选参数（optional parameters）。可选参数通过在路由中命名技术键值对，方便访问更复杂的信息。\n\
    \n要定义可选参数，我们使用 `routerLink` 数组并使用键值对传递它们：\n\n`<a [routerLink] = ['/users', {name:\
    \ username, age: userAge}]>``\n\n现在由于每个参数都有唯一的键，它们很容易被识别，且不会使路由配置复杂。\n\n生成的 URL\
    \ 如下：\n\n`https://localhost:4200/users;name=Manish;age=42`\n\n正如你在生成的 URL 中看到的，它包含这些键值对，每个可选参数都有唯一标识符，这样就不会发生任何路由冲突问题。\n\
    \n## 读取可选参数\n\n要读取可选参数，我们将像之前讨论的那样导入 `ActivatedRoute` 服务并将其注入构造函数中。完成后，我们将可选参数放在\
    \ `routerLink` 数组中，最后在构造函数中使用 snapshot 选项通过代码获取参数。\n\n我们可以使用以下代码实现此：\n\n`console.log(this.activateRoute.snapshot.paramMap.get('name'));`\n\
    \n## 查询参数\n\n当我们想要将可选信息传递给组件，但又希望在组件执行某些操作后保留这些信息时，查询参数（query parameters）将大有益处。查询参数有助于在多个路由之间进行通信，从而保留在特定组件视图上检索的数据。\n\
    \n查询参数遵循的语法是以问号开头，并使用和符号作为分隔符：\n\n`https://localhost:4200/users/?nameby=this&age=some`\n\
    \n要定义查询参数，我们使用 `queryParams` 指令来绑定信息，它不是作为 `routerLink` 数组的一部分传递的。\n\n它基本上看起来如下代码：\n\
    \n`<a [routerLink]= \"/users\", user.id [queryParams] ==\"{...}\"></a>`\n\n从以下代码中，我们定义了\
    \ `queryParams`：\n\n```typescript\nthis.router.navigate(['/users'],{\n  queryParams:\
    \ {...}\n});\n```\n\n查询参数也包含像可选参数一样的键值对。现在当我们从当前页面返回时，我们希望数据被保留。为了保留数据，我们可以使用\
    \ `queryParamsHandling` 指令来保留已更改的数据：\n\n`<a [routerLink]= \"['/users']\",queryParamshandling=\"\
    preserve\"></a>`\n\n这保留了浏览器中的 URL，但我们不应该忘记需要读取参数。\n\n## 读取查询参数\n\n要读取查询参数，我们将执行与之前讨论相同的步骤。我们将从\
    \ Angular/route 导入 `ActivatedRoute` 服务并将其注入构造函数。在构造函数内部，我们只需使用 `get` 方法通过以下代码读取查询参数：\n\
    \n`console.log(this.activateRoute.snapshot.queryParamMap.get(''));`\n\n这将最终读取参数并根据查询参数显示数据。\n\
    \n## 总结\n\n在本章中，我们学习了路由参数，它用于向路由配置传递特定的标识符。这用于获取与给定路由参数标识符的项目对应的数据。我们还看到使用路由参数会带来变化，但在视图中显示它，我们需要使用\
    \ snapshot 或 observable 来读取参数。然后，我们学习了其他参数，如可选参数和查询参数。\n\n在下一章中，我们将学习子路由以及如何将一个路由放置在另一个路由之中。\n\
    \n"
- fmt: "\n`Tab 1` is one of the child components which will display its data when\
    \ you click on `Tab 1` details. Similarly, `Tab 2` is another child component\
    \ of its own and displays the results in the same view by displacing the first\
    \ view.\n\n## Configuring child routes\n\nTo display the child routes, we place\
    \ them inside the children array inside the route configuration. The code is as\
    \ follows:\n\n```\npath: ‘user’, component: UserComponent, children: [\n  {path:\
    \ ‘’, redirectTo: ‘’, pathMatch: ‘full’},\n  {path: ‘list’, component: UserListComponent},\n\
    \  {path: ‘details, component: UserDetailsComponent}\n]\n```\n\nLet us talk about\
    \ what this means. This route instance is part of a routes array which consists\
    \ of all the routes inside our application. Now for this particular route `UserComponent`,\
    \ we need to create one or more child routes. To do this, we take an attribute\
    \ inside this route instance called `children`. This child attribute is again\
    \ a route array which will consist of all the child routes for this `UserComponent`.\
    \ Now to match this route, Angular will display as `user/<child>` in the URL.\n\
    \nIn this case, [`https://localhost:4200/user/list`](https://localhost:4200/user/list)\
    \ or else you can use [https:// localhost:4200/user/details](https://localhost:4200/user/details).\n\
    \nHaving configured these child routes inside the `Routes` array, we need to make\
    \ sure that we declare them in the declarations array as well:\n\n```\ndeclarations:\
    \ [\n  UserListComponent,\n  UserDetailsComponent\n]\n```\n\nAnother thing we\
    \ can do is to display the first child route by default when the user goes to\
    \ the `UserComponent`. This means that when the user tries to access `localhost:4200/user`,\
    \ it will actually redirect him to the `localhost:4200/user/list` page. To do\
    \ this, we can use the same configuration with a minor change in the code:\n\n\
    ```\npath: ‘user’, component: UserComponent, children: [\n  {path: ‘’, redirectTo:\
    \ ‘list’, pathMatch: ‘full’},\n  {path: ‘list’, component: UserListComponent},\n\
    \  {path: ‘details, component: UserDetailsComponent}\n]\n```\n\nInside the `redirectTo`\
    \ attribute of the child route instance, we use the route to `UserListComponent`\
    \ so that the default page comes up to be that of the `UserComponent` template.\
    \ One of the most commonly made mistakes here is using a slash with the route\
    \ in the `redirectTo` attribute. If we use a slash in the `redirectTo` property,\
    \ it will actually redirect you to the `Home` page which is the role of the `redirectTo`\
    \ property of your parent route instance.\n\nIn the code, this looks like as shown\
    \ in the following screenshot:\n\n![](images/p058-001.jpg)\n\nFig 6.3\n\nNow that\
    \ we have configured the child routes, we need to place these routes inside the\
    \ template to display them in the view.\n\nTo place the child routes on the template,\
    \ we use the `router-outlet` element. This element identifies the component template\
    \ to be displayed without any name given to the router outlet. This is because\
    \ it understands which route to display from the hierarchy. The `user.component.html`\
    \ has the following code:\n\n```html\n<div>\n  <div>\n    <a routerLink=’list’>User\
    \ List</a>\n    <a routerLink = ‘details’> User Details </a>\n  </div>\n  <router-outlet></router-outlet>\n\
    </div>\n```\n\nAnd how does the URL look like when we click on let us say, the\
    \ `User List` tab:\n\n`https:localhost:4200/user/list`\n\nSo, now we have created\
    \ the child routes, but when we go and click on the child routes, they do not\
    \ work for the obvious reason that we have only created the child routes but have\
    \ not actually activated them. In the next section of this chapter, we will see\
    \ how to activate the child routes that we have created and placed using the template.\n\
    \nNow there are two ways to activate the child routes. We can use the absolute\
    \ path or the relative path.\n\nThe first view of the application will look like\
    \ this:\n\n![](images/p058-002.jpg)\n\nFig 6.4\n\n## Activating from the template\n\
    \nUsing the absolute path:\n\n```html\n<a [routerlink]= “[‘/user’, ‘list]” > User\
    \ List </a>\n```\n\nUsing the relative path:\n\n```html\n<a [routerLink]= “[‘list’]”\
    \ > User List </a>\n```\n\nIn the case of using an absolute path on the template,\
    \ we put in all the required component route details inside the `routerLink` array.\
    \ However, in the case of using a relative path from the template, we simply use\
    \ the route name without using a slash. This will directly go straight to the\
    \ list component from the current component which is `UserComponent`.\n\nNow let\
    \ us see how to activate using the code.\n\n## Activating from the code\n\nUsing\
    \ the absolute path:\n\n```javascript\nthis.router.navigate([‘/user’,’list’]);\n\
    ```\n\nUsing the relative path:\n\n```javascript\nthis.router.navigate([‘info],\
    \ {relativeTo: this.route });\n```\n\n![](images/p060-001.jpg)\n\nFig 6.5\n\n\
    We need to make sure that we do not use a slash while using a relative path because\
    \ if we do, the `relativeTo` property will be meaningless then.\n\n![](images/p061-001.jpg)\n\
    \nFig 6.6\n\n## Summary\n\nIn this chapter, we learned how to use child routes\
    \ in Angular. We saw how to configure child routes and place them on the template.\
    \ We also learned how to activate child routes, both from the template and through\
    \ the code using absolute or relative paths. In the next chapter, we will learn\
    \ the other type of routes which are called secondary routes.\n"
