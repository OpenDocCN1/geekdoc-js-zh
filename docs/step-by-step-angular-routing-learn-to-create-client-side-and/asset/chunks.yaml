    \n`localhost:4200/third`\n\nUsing the `navigate` method, you can change the route\
    \ next to third, but the secondary route will remain as it is and this is how\
    \ it will look like:\n\n`localhost:4200/third(secondaryroute) //using navigate()\
    \ method`\n\nHowever, if you want to replace the entire URL by the new route linked\
    \ to, you can use the `navigateByUrl` method which will route to `thirdcomponent`\
    \ by replacing the entire route. This is how the code will look like:\n\n`localhost:4200/third\
    \ //using navigateByUrl() method`\n\nLet us see its implementation now. Inside\
    \ `LoginComponent`, I am using the `navigateByUrl()` method to make sure that\
    \ whenever the user routes from the `Login` component to any other, it will replace\
    \ the URL entirely. This is how the code looks like:\n\n```typescript\nexport\
    \ class LoginComponent implements OnInit {\n  loginForm: FormGroup;\n  constructor(private\
    \ router: Router){}\n  ngOnInit(){\n    this.loginForm = new FormGroup({\n   \
    \   Name : new FormControl(),\n      Email: new FormControl(),\n      Password:\
    \ new FormControl()\n    })\n  }\n  submit(){\n    this.router.navigateByUrl(‘/home’);\n\
    \  }\n}\n```\n\nLet us see it in the browser now!\n\n![](images/p39-001.jpg)\n\
    \nFig 4.3\n\n## Routes and their order inside the Appmodule\n\nIn an Angular application,\
    \ the order in which you place your routes is of utmost importance as this decides\
    \ the routing of components. Let us try to understand this using an example. Currently,\
    \ the `appmodule` looks like this:\n\n```typescript\nrouterModule.forRoot([\n\
    \  {path: ‘home’, component: HomeComponent},\n  {path: ‘’, redirectTo: ‘home’,\
    \ pathMatch: ‘full’},\n  {path: ‘**’, component: NotFoundComponent}\n]),\nUserModule,\n\
    DataModule\n```\n\nNow the order that is to be followed looks very simple here:\n\
    \n*   `AppComponent`\n*   `‘’`\n*   `UserModule`\n*   `DataModule`\n\nBut this\
    \ is not the order in which Angular application places its routes. Any routes\
    \ which are explicitly defined in a module are always considered after the feature\
    \ modules that are imported.\n\nSo, the correct order to be followed should be:\n\
    \n*   `UserModule`\n*   `DataModule`\n*   `HomeComponent`\n*   `‘’`\n*   `**`\n\
    \nNow, let us take a look at the scenario where you have a separate routing module.\
    \ In the previous chapter, you saw how the latest CLI version asks you to create\
    \ a separate routing module if the application involves routing.\n\nThe structure\
    \ in this scenario looks like this (`RoutingModule`):\n\n```typescript\n@NgModule({\n\
    \  imports: [\n    RouterModule.forRoot([\n      {path: ‘home’, component: HomeComponent},\n\
    \      {path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},\n      {path: ‘**’,\
    \ component: NotFoundComponent}\n    ])\n  ],\n  exports: [RouterModule]\n})\n\
    export class RoutingModule{}\n```\n\nThe structure in this scenario looks like\
    \ this (`AppModule`):\n\n```typescript\n@NgModule({\n  imports: [\n    RoutingModule,\n\
    \    UserModule,\n    DataModule\n  ],\n})\ndeclarations: [\n  AppComponent,\n\
    \  HomeComponent,\n  NotFoundComponent\n]\nexport class AppModule{}\n```\n\nLet\
    \ us see now what exactly is happening here.\n\nIn the app-routing module, we\
    \ moved all the explicit configurations for the route paths and exported the `RouterModule`\
    \ so that it is accessible to the `AppModule`. Now inside the `AppModule`, we\
    \ have imported the `RoutingModule` which contains the route configurations followed\
    \ by the feature modules that we are using for different features.\n\nBut here\
    \ comes a challenge!\n\nWhen you import the `RoutingModule` as an external module\
    \ inside the `AppModule`, the order of `Routes` remains as it is brought in and\
    \ Angular does not go to the feature modules at first.\n\nThis will break the\
    \ routes every time at the `RoutingModule` level only. This is because the configuration\
    \ inside the `RoutingModule` contains the `**` path and this will be routed to\
    \ every time before being able to come to the feature modules.\n"
  raw: '*   Activating the route through code


    *   Using `navigate()` and `navigateByUrl()`


    *   Order of route paths and modules


    ## [Defining a feature module](#toc.xhtml_ch18)


    When you want to organize your code specific to the features and the functionalities
    that your app contains as it starts growing, feature modules are a savior. feature
    modules are used to organize your feature-specific code into a particular module.
    For example, if you want to put all the route paths related to the users in your
    application in one place, you can create `UserModule`, which is nothing but a
    feature module.


    A feature module helps separate the code from the root module but is accessible
    everywhere throughout the application. feature modules collaborate with other
    modules and the root module through the use of services, directives, components,
    and so on.


    To create a feature module, you will use the following command on the CLI:


    **`ng generate module module-name`**


    The structure of a feature module is like any other module in an Angular application.
    The next step is to import a common module which pulls in all the required common
    directives:


    `import {CommonModule} from ‘@angular/common’;`


    You can also create a shared module and import it if you want to pull in all the
    common modules which need to be accessed by all the route paths.


    To add routing to a feature module, you need to add an import statement to the
    `RouterModule` and add it to the declarations array. Since this is a feature module,
    you need to declare the `Routes` array by using `forChild()` in place of `forRoot()`:


    `RouterModule.forChild([`


    `{path: ‘next’, component: NextComponent}`


    `])`


    We will define the `NgModule` as shown in the following screenshot:


    ![](images/p036-001.jpg)


    Fig 4.1


    When naming the feature routes, it is a good practice to use the same name for
    the feature route and then add the other extended versions of it. This means that
    if you are creating a user feature module and if you want to access the user with
    a particular ID, you should be able to simply use `user/:id` where: id is a route
    parameter.


    The concept of Route parameters will be covered in the next chapter.


    ![](images/p037-001.jpg)


    Fig 4.2


    ## [Activating the route through code](#toc.xhtml_ch19)


    In the previous chapter, you saw how to use the `routerLink` directive to activate
    the route on the component template. However, one of the challenges you face when
    you want to use the code before performing routing.


    To understand this in simple terms, when a user is signed in and you want to sign
    the user out using the sign out button before actually navigating to the home
    page, that is when you need to use the code before actually performing routing.


    To achieve this, you need to use Angular’s Router service. This service is injected
    inside the constructor of the component and using this, you can use the navigate
    method to link to the route path to navigate to:


    `import { Component } from ‘@angular/core’;`


    `import { Router } from ‘@angular/router’;`


    `@Component({`


    `selector: ‘app-root’,`


    `templateUrl: ‘./app.component.html’,`


    `styleUrls: [‘./app.component.css’]`


    `})`


    `export class AppComponent {`


    `title = ‘RoutingDemo’;`


    `constructor(private router: Router){}`


    `signOut(){`


    `  this.router.navigate([‘/next’]);`


    `}`


    `}`


    This navigates the user to `NextComponent` after he signs out of the account.


    ## [Using navigate() and navigateByUrl()](#toc.xhtml_ch20)


    The `navigateByUrl` method displays the complete URL path, removing any other
    path present in it. This method is different from the navigate method when the
    secondary routes come into the picture.


    Using the navigate method, the first route information will change but the secondary
    route will remain as it is and will not disappear from the current route.


    For example, `localhost:4200/next(secondaryroute)`. In this case, if can change
    the routes from next to third, that is, like this:


    `localhost:4200/third`


    Using the navigate method, you can change the route next to third, but the secondary
    route will remain as it is and this is how it will look like:


    `localhost:4200/third(secondaryroute) //using navigate() method`


    However, if you want to replace the entire URL by the new route linked to, you
    can use the `navigateByURL` method which will route to `thirdcomponent` by replacing
    the entire route. This is how the code will look like:


    `localhost:4200/third //using navigateByUrl() method`


    Let us see its implementation now. Inside `LoginComponent`, I am using the `navigateByUrl`()
    method to make sure that whenever the user routes from the `Login` component to
    any other, it will replace the URL entirely. This is how the code looks like:


    `export class LoginComponent implements OnInit {`


    `loginForm: FormGroup;`


    `constructor(private router: Router){}`


    `ngOnInit(){`


    `this.loginForm = new FormGroup({`


    `Name : new FormControl(),`


    `Email: new FormControl(),`


    `Password: new FormControl()`


    `})`


    `}`


    `submit(){`


    `this.router.navigateByUrl(‘/home’);`


    `}`


    `}`


    Let us see it in the browser now!


    ![](images/p039-001.jpg)


    Fig 4.3


    After clicking on the **`Login`** button, you will see the following screen:


    ![](images/p040-001.jpg)


    Fig 4.4


    ## [Routes and their order inside the Appmodule](#toc.xhtml_ch21)


    In an Angular application, the order in which you place your routes is of utmost
    importance as this order decides the routing of your components in the application.
    Let us try to understand this using an example. Currently, the `appmodule` looks
    like this:


    `routerModule.forRoot([`


    `{path: ‘home’, component: HomeComponent},`


    `{path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},`


    `{path: ‘**’, component: NotFoundComponent}`


    `]),`


    `UserModule,`


    `DataModule`


    Now the order that is to be followed looks very simple here:


    *   `Homecomponent`


    *   `‘’`


    *   **


    *   `UserModule`


    *   `DataModule`


    But this is not the order in which an Angular application places its routes. Any
    routes which are explicitly defined in a module are always considered after the
    feature modules that are imported.


    So, the correct order to be followed here should be as follows:


    *   UserModule


    *   DataModule


    *   HomeComponent


    *   ‘’


    *   **


    Now, let us take a look at the scenario where you have a separate routing module
    to organize all your route configurations. In the previous chapter, you saw how
    the latest Angular CLI version asks you to create a separate routing module if
    the application involves routing.


    The structure in this scenario looks like this (`AppRoutingModule`):


    `@NgModule({`


    `imports: [`


    `RouterModule.forRoot([`


    `{path: ‘home’, component: HomeComponent},`


    `{path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},`


    `{path: ‘**’, component: NotFoundComponent}`


    `]),`


    `],`


    `exports: [RouterModule]`


    `})`


    `export class AppRoutingModule{}`


    The structure in this scenario looks like this (`AppModule`):


    `@NgModule({`


    `imports: [`


    `AppRoutingModule,`


    `UserModule,`


    `DataModule`


    `],`


    `})`


    `declarations: [`


    `AppComponent,`


    `HomeComponent,`


    `NotFoundComponent`


    `]`


    `export class AppModule{}`


    Let us see now what exactly is happening here.


    In the app-routing module, we moved all the explicit configurations for the route
    paths and exported the `RouterModule` so that it is accessible to the `AppModule`.
    Now inside the `AppModule`, we have imported the `AppRoutingModule` which contains
    the route configurations followed by the feature modules that we are using for
    different features.


    But here comes a challenge!


    When you import the `AppRoutingModule` as an external module inside the `AppModule`,
    the order of `Routes` remains as it is brought in and Angular does not go to the
    feature modules at first.


    This will break the routes every time at the `AppRoutingModule` level only. This
    is because the configuration inside the `AppRoutingModule` contains the `**` path
    and this will be routed to every time before being able to come to the feature
    modules.'
