    \    </td>\n    <td>\n      {{u.name}}\n    </td>\n    <td>\n      {{u.model}}\n\
    \    </td>\n  </tr>\n</table>\n```\n\n这是获取用户列表后在浏览器中显示的界面：\n\n![](img/p112-001.jpg)\n\
    图 12.6\n\n从服务器读取数据是所有 CRUD 操作中最容易简单的，而且执行数据读取与创建、更新和删除数据的功能实现并不相似。我们需要根据特定的 `id`\
    \ 获取用户以更新或删除该特定用户。同样，为了创建一个新用户数据，我们需要输入详细信息，然后将它们保存为某些初始化的 `User` 数组。\n\n## 获取数据\n\
    \n要执行此操作，让我们先看看如何根据特定 ID 获取用户：\n\n```typescript\ngetUser (id: number): Observable<UserFetch>\
    \ {\n  const url = `${this.apiurl}/${id}`;\n  return this.http.get<UserFetch>(url).pipe(\n\
    \    catchError(this.handleError)\n  );\n}\n```\n\n以下代码片段来自 `component.ts` 文件：\n\
    \n```typescript\nfetchId = 1;\ngetUser() {\n  this.dataservice.getUser(this.fetchId).subscribe(data\
    \ => {\n    this.user = data;\n    this.displayData= true;\n  });\n}\n```\n\n\
    然后我们可以在模板上创建一个输入框，让用户输入他们想要获取详情的用户 `id`，然后显示获取到的用户详情。这如下截图所示：\n\n![](img/p113-001.jpg)\n\
    图 12.7\n\n## 创建数据\n\n要在 API 中创建数据，我们需要执行 HTTP POST 操作并传递需要插入数据库的数据。\n\n我们将使用 `addUser()`\
    \ 方法来实现此操作。由于我们现在想在不同的路由上创建用户，我们将使用此方法在 `CreateUserComponent` 对象上添加用户。\n\n在数据服务中，添加以下代码：\n\
    \n```typescript\naddUser (user: UserFetch): Observable<UserFetch> {\n  user.id=null;\n\
    \  return this.http.post<UserFetch>(this.apiurl, user, this.httpOptions).pipe(\n\
    \    tap(data => console.log(data)),\n    catchError(this.handleError)\n  );\n\
    }\n```\n\n在 `CreateUser` 组件上，使用 `addUser` 方法：\n\n```typescript\nexport class CreateUserComponent\
    \ implements OnInit {\n  userFormGroup: FormGroup;\n  users: User[];\n  user:\
    \ UserFetch;\n  constructor(private dataservice: DataService){}\n  getUsers(){{\n\
    \    this.dataservice.getUsers().subscribe(data => {\n      this.users = data;\n\
    \    });\n  }\n  ngOnInit() {\n    this.userFormGroup = new FormGroup(\n     \
    \ {\n        name : new FormControl(‘’),\n        model : new FormControl(‘’)\n\
    \      },\n    );\n    this.getUsers();\n  }\n  addUser() {\n    this.dataservice.addUser(this.userFormGroup.value).subscribe(data\
    \ => {\n      this.user = data;\n      console.log(this.user);\n    });\n    this.getUsers();\n\
    \  }\n}\n```\n\n输出将如下所示：\n\n![](img/p115-001.jpg)\n图 12.8\n\n添加用户后，它会被添加到 `User`\
    \ 列表中：\n\n![](img/p115-002.jpg)\n图 12.9\n\n## 更新数据\n\n同样，现在要更新数据，我们将获取想要更新的用户\
    \ `id` 并更新该特定用户的年龄。我们可以直接在 `GetUser` 模板视图中执行此操作，因为我们不需要路由到新视图来更新组件上的用户。\n\n要做到这一点，让我们先将其添加到服务中：\n\
    \n```typescript\nupdateUser(user: UserFetch): Observable<UserFetch>{\n  const\
    \ url = `${this.apiurl}/${user.id}`;\n  return this.http.put<UserFetch>(this.apiurl,\
    \ user, this.httpOptions).pipe(\n    map(() => user),\n    catchError(this.handleError)\n\
    \  );\n}\n```\n\n这里需要注意的一点是，每当我们需要更新数据时，`component.ts` 文件都会以下片段：\n\n```typescript\n\
    idtoUpdate = 0;\nupdateUser() {\n  this.dataservice.getUser(this.idtoUpdate).subscribe(data\
    \ => {\n    this.user = data;\n    this.user.model = ‘Updated Model’;\n    this.dataservice.updateUser(this.user).subscribe(data\
    \ => {\n      this.getUsers();\n    });\n  });\n}\n```\n\n## 删除数据\n\n从列表中删除数据，在服务中添加删除操作如下：\n\
    \n```typescript\ndeleteUser(id: number): Observable<UserFetch> {\n  const url\
    \ = `${this.apiurl}/${id}`;\n  return this.http.delete<UserFetch>(url, this.httpOptions).pipe(\n\
    \    catchError(this.handleError)\n  );\n}\n```\n\n在 `DeleteUserComponent` 上，我们使用以下代码订阅：\n\
    \n```typescript\nidtodelete=0;\ndeleteUser() {\n  this.dataservice.deleteUser(this.idtodelete).subscribe(data\
    \ => {\n    this.getUsers();\n  });\n}\n```\n\n"
