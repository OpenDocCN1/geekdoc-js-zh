    Angular Router 是一个库包，包含了路由所需的所有服务、配置和指令。一旦你在 `app` 模块中导入了上述语句，下一步就是在你的应用内部内部配置路由。`RouterModule`
    提供的不同指令如下：


    *   `routerLink`

    *   `routerLinkActive`

    *   `routerOutlet`


    我们将在本章的后续章节中讨论这些内容。


    在最新版本的 Angular 中，当你创建一个新的 Angular 应用程序时，CLI 会在你的 Angular 应用中设置路由：


    ![](img/p027-001.jpg)


    图 3.1


    这会在 Angular 应用内部设置一个特定路由的模块，该模块包含了所有的 Angular 路由配置。


    一旦你的应用程序在 VS Code 中设置好，你的 `app-routing` 模块就准备就绪：


    ![](img/p028-001.jpg)


    图 3.2


    CLI 还通过在 `app` 模块中导入 `AppRoutingModule` 来更新 `app` 模块：


    ![](img/p028-002.jpg)


    图 3.3


    现在，让我们简要说明 CLI 如何配置我们的 Angular 应用中的路由。它从 `@angular/router` 包导入了 `Routes` 和 `RouterModule`。然后它在
    app 模块内部导入了 `RouterModule` 以配置路由路径和组件。它还导出了 `RouterModule`，通过 `app` 路由模块与 `app`
    模块通信。


    ## 配置应用路由


    为了配置路由，开发者通常有两种配置方法。


    一种方法是在 `forRoot()` 方法内部放入路由配置，如下：


    ```javascript

    @NgModule({

    imports: [RouterModule.forRoot([

    {path: ‘home’, component: HomeComponent},

    {path: ‘next’, component: NextComponent},

    {path: ‘’, redirectTo: ‘home’}

    ])],

    exports: [RouterModule]

    })

    ```


    另一种方法是使用变量来引用路由数组，然后对它们进行单独配置。


    ```javascript

    const routes: Routes = [

    {path: ‘home’, component: HomeComponent},

    {path: ‘next’, component: NextComponent},

    {path: ‘’, redirectTo: ‘home’}

    ];


    @NgModule({

    imports: [RouterModule.forRoot(routes)],

    exports: [RouterModule]

    })

    ```


    配置好这些路由后，让我们尝试理解路由配置内部的 `path` 和 `component` 属性的。


    要配置路由，你需要指定它的路径（path）和它应该引用的组件视图（component）。假设你想从 Home 视图导航到 `Contact` 部分。`Contact`
    视图上的信息由另一个组件提供，例如 `ContactComponent`。现在要从 `HomeComponent` 路由到 `ContactComponent`
    视图，你将使用以下命令：


    ```javascript

    {path: ‘contact’, Component: ContactComponent}

    ```


    现在当 URL 被 `contact` 路径附加或修改时，它会将你引导到 `ContactComponent` 视图并显示该信息。


    为了给组件视图设置不同的路由，让我们使用一些路由配置：


    ```javascript

    {path: ‘home’, component: HomeComponent},

    {path: ‘next’, component: NextComponent},

    {path: ‘third’, component: ThirdComponent},

    {path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},

    {path: ‘**’, component: NotFoundComponent}

    ```


    第一个显示的组件是 `HomeComponent`，它是主插槽（primary outlet）。主插槽是你放置在 app 组件模板中的第一个插槽。从 app
    组件，视图被引导到 `HomeComponent`。在下一个路由中，你需要指定一个默认路由，以防没有路由段。这是通过使用空路径实现的，它会将你重定向到同一个
    `Home` 页面，该页面是应用程序的主视图。此默认路由具有 `pathMatch` 属性，当 URL 中的整个路径为空时，它匹配为 `full`。


    如果存在某些我们在路由配置中未提到的路径且 Angular 无法识别，那么在这种情况下，我们将它重定向到 `NotFoundComponent` 内部的未找到视图。星号指的是通配符路由，我们的应用程序中没有直接到该路由。


    ## 激活路由


    要在模板上访问路由，我们使用 `routerLink` 指令将其与视图变化时要显示的路径链接：


    ```html

    <a routerLink=”/next”> Next</a>

    <a routerLink=”/third”>Third</a>

    ```


    现在，除了这两个路径外，如果用户在 URL 中传递了任何其他内容，它将重定向到 `NotFoundComponent` 组件。


    这是使用 `routerLink` 指令的一种简单技术。然而，当你需要从要引导的视图获取数组时，你也可以在方括号内绑定 `routerLink` 指令并如下所示使用：


    ```html

    <a [routerLink]=[”/next”]> Next</a>

    <a [routerLink]=[”/third”]>Third</a>

    ```


    通过这种方式路由被激活，并且在模板中放置 `router-outlet`，你可以看到导航正常工作。


    ## Router outlet


    Router outlet 是一种指令，用于将数据放置在模板中任何地方。此 router outlet 充当占位符，用于在视图中放入 `Component`
    数据：


    ```html

    <router-outlet></router-outlet>

    ```

