    The Angular Router is a library package that contains all the required services,
    configurations, and directives required for routing. Once you have imported the
    preceding statement in the `app` module, the next step is to configure routes
    inside your app. The different directives that `RouterModule` provides are as
    follows:


    *   `routerLink`

    *   `routerLinkActive`

    *   `routerOutlet`


    We will talk about these in the following sections of this chapter.


    With the latest versions of Angular, the CLI sets up routing in your Angular application
    when you are creating a new Angular application:


    ![](images/p027-001.jpg)


    Fig 3.1


    This will set up a routing-specific module inside the Angular application which
    consists of all the Angular routes configurations.


    Once your application is set up inside the VS Code, your `app-routing` module
    is ready:


    ![](images/p028-001.jpg)


    Fig 3.2


    The CLI also updates the `app` module by importing `AppRoutingModule` in it:


    ![](images/p028-002.jpg)


    Fig 3.3


    Now, let us briefly explain what the CLI has done to configure routing in our
    Angular application. It imported the `Routes` and `RouterModule` from the `@angular/router`
    package. It then imported the `RouterModule` inside the app module to configure
    the route paths and the components. It also exported the `RouterModule` to communicate
    with the `app` module through the `app` routing module.


    ## Configuring application routes


    To configure routes, there are two ways developers like to configure them.


    One way is by putting in the route configuration inside the `forRoot()` method
    as follows:


    ```javascript

    @NgModule({

    imports: [RouterModule.forRoot([

    {path: ‘home’, component: HomeComponent},

    {path: ‘next’, component: NextComponent},

    {path: ‘’, redirectTo: ‘home’}

    ])],

    exports: [RouterModule]

    })

    ```


    The other way is by using a variable to refer to the array of routes and then
    configuring them separately.


    ```javascript

    const routes: Routes = [

    {path: ‘home’, component: HomeComponent},

    {path: ‘next’, component: NextComponent},

    {path: ‘’, redirectTo: ‘home’}

    ];


    @NgModule({

    imports: [RouterModule.forRoot(routes)],

    exports: [RouterModule]

    })

    ```


    After you have configured these routes, let us try to understand the usage of
    path and component properties inside the route configuration.


    To configure a route, you need to specify its path and the component view it should
    refer to. Let us say you want to navigate from your Home view to the `Contact`
    section. The information to be present on the `Contact` view is available in another
    component say, `ContactComponent`. Now to route to the `ContactComponent` view
    from your `HomeComponent`, you will use the following command:


    ```javascript

    {path: ‘contact’, Component: ContactComponent}

    ```


    Now when the URL gets appended or modified by the `contact` path in it, it directs
    you to the `ContactComponent` view and shows that information.


    To set up different routes for the component views, let us use some route configurations:


    ```javascript

    {path: ‘home’, component: HomeComponent},

    {path: ‘next’, component: NextComponent},

    {path: ‘third’, component: ThirdComponent},

    {path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},

    {path: ‘**’, component: NotFoundComponent}

    ```


    The first component to be displayed is the `HomeComponent` which is the primary
    outlet. The primary outlet is the first outlet that you have placed in the app
    component template. From the app component, the view is directed to the `HomeComponent`.
    In the next route, you need to specify a default route in case there are no route
    segments. This is done by using an empty path which will redirect you to the same
    `Home` page which is the primary view for your application. This default route
    has the `pathMatch` property which is matched to full when the entire path in
    the URL is empty.


    In case, there is some path which we have not mentioned in the route configuration
    and Angular does not identify that, then in that case we redirect it to the page
    not found view inside `NotFoundComponent`. The asterisks refer to the wildcard
    route which is not directed to in our application.


    ## Activating the Routes


    To access the routes on the template, we use the `routerLink` directive to link
    it with the path to be displayed on the change of the view:


    ```html

    <a routerLink=”/next”> Next</a>

    <a routerLink=”/third”>Third</a>

    ```


    Now, other than these two paths, if the user passes any other in the URL, it will
    get redirected to the `NotFoundComponent` component.


    This is a short technique of using the `routerLink` directive. However, when there
    are arrays to obtain from the view you are directing to, you can also bind the
    `routerLink` directive inside square brackets and use it as follows:


    ```html

    <a [routerLink]=[”/next”]> Next</a>

    <a [routerLink]=[”/third”]>Third</a>

    ```


    With this, the routes are activated and with `router-outlet` placed inside the
    template, you can see the navigation working.


    ## Router outlet


    Router outlet is a directive used for placing the data on the template where ever
    it is present. This router outlet acts as a placeholder for putting in the `Component`
    data in the view:


    ```html

    <router-outlet></router-outlet>

    ```

    '
