  trans: "\n在创建一个守卫服务（guard service）时，正如我们在前面的示例中所看到的，它默认会实现 `canActivate` 守卫。然而，当用户离开此路径时，我们可以使用该守卫。因此，我们需要使用\
    \ `canDeactivate` 路由。\n\n要使用 `canDeactivate` 路由，我们需要指定泛型参数，并在泛型参数中传递我们需要使用该特定守卫的组件。\n\
    \n![](img/p076-001.jpg)\n图 8.7\n\n如你在前面的代码所示，首先实现的是与我们在 `export` 语句的接口中实现的相同的组件。\n\
    \n它可以返回的不同值可以是 `true` 或 `false`。在这里，`true` 意味着从当前路由继续到下一个路由，而 `false` 则意味着取消导航过程并停留在当前路由。\n\
    \n它还可以返回一个 `Promise` 或 `observable`，如果它依赖于某些其他过程并等待该活动的完成。一旦完成，将就会发生从当前路由到状态路由的导航。\n\
    \n在你的 `canDeactivate` 守卫中实现功能后，下一步也是最后一步是将其与所需的组件关联起来：\n\n![](img/p077-001.jpg)\n\
    图 8.8\n\n最后，你应该能看到一个警报确认框，要求你在离开之前进行确认：\n\n![](img/p076-002.jpg)\n图 8.9\n\n##\
    \ 总结\n\n在本章中，我们学习了 Angular 路由的一些高级且精细的概念，使用路由守卫来限制用户对特定路由的访问，或者在用户离开路由之前进行确认。我们看到了\
    \ `Angular/router` 包中提供的不同类型的路由守卫。我们还学习了如何借助 `CLI` 创建不同的守卫。\n\n对路由守卫有了良好的理解后，我们已经准备好查看更多类型的路由，在下一章中，我们将学习无组件路由和分组路由。\n\
    \n# 第 9 章\n\n# 分组路由与无组件路由\n\n你可能在好奇 Angular 路由中总共有多少种类型的路由。我们讨论了主路由、通往功能的路由以及子路由和次级路由。但假设你遇到了一个看起来如下的路由配置：\n\
    \n```\n{path: 章 next’, children:[\n  {path: ‘’, component: NextComponent},\n \
    \ {path: ‘login’, component: LoginComponent}\n]}\n```\n\n可能任何人脑海中出现的第一个想法是程序员忘记在这里编写\
    \ `component` 属性了。然而，在这种情况下并非如此。在本章中，我们将详细讨论这种配置的含义，以及我们为什么要这样配置以及在没有组件属性的路由中对路由进行分组（即无组件路由）。\n\
    \n在本章中，我们将涵盖以下主题：\n\n* 路由分组\n* 什么是无组件路由？\n* 为什么使用无组件路由？\n\n## 分组路由\n\n到目前，我们已经在应用程序中处理了很多路由。我们还将路由作为其中一个父路由的子路由。因此我们理解什么是分组以及它如何帮助我们。然而，我们目前为止看到的大多数示例都有一个父组件，将其他路由作为其子路由分组，并在它自己的\
    \ router outlet 中显示它们。\n\n假设我们有如下所示所示配置，并且我们对路由进行分组：\n\n```\nconst routes: Routes\
    \ = [\n  {path: 章 home’, component: HomeComponent},\n  {path: 章 next’, component:\
    \ NextComponent},\n  {path: 章 third’, component: ThirdComponent},\n  {path: 章\
    \ login’, component: LoginComponent},\n  {path: 章’, redirectTo: 章 home’, pathMatch:\
    \ 章 full’},\n  {path: 章**’, component: NotFoundComponent}\n];\n```\n\n让我们看看这种场景在图上是怎样的：\n\
    \n![](img/p080-001.jpg)\n图 9.1\n\n为了分组这些路由，可以将它们放在任何一个路由的 `children` 属性中。让我们看看分组后的后续代码：\n\
    \n```\nconst routes: Routes = [\n  {path: 章 home’, component: HomeComponent},\n\
    \  {path: 章 next’, component: NextComponent},\n  {path: 章 third’, component: ThirdComponent},\n\
    \  {path: 章 login’, component: LoginComponent},\n  {path: 章’, redirectTo: 章 home’,\
    \ pathMatch: 章 full’},\n  {path: 章**’, component: NotFoundComponent}\n];\n```\n\
    \n不，让我们看看分组后的这些代码：\n\n```\nconst routes: Routes = [\n  {path: 章 home’, component:\
    \ HomeComponent},\n  {path: 章 next’, component: NextComponent, children: [\n \
    \   {path: 章 third’, component: ThirdComponent},\n    {path: 章 login’, component:\
    \ LoginComponent}\n  ]},\n  {path: 章’, redirectTo: 章 home’, pathMatch: 章 full’},\n\
    \  {path: 章**’, component: NotFoundComponent}\n];\n```\n\n在这个代码中，我们基本上安排了路由，并为了更好的组织将它们分组。\n\
    \n让我们看看现在这种场景在图上是怎样的：\n\n![](img/p081-001.jpg)\n图 9.2\n\n这就是我们为了更好的层次结构而对路由进行分组的方式。然而，如果你现在去浏览器中查看，位于\
    \ `NextComponent` 下分组的路由将不起作用。有人想猜猜为什么发生这种情况吗？\n\n这就是无组件路由（Component-less Routes）概念出现的地方。\n\
    \n## 无组件路由\n\n在配置中没有 `component` 属性的路由并不是错误的写法，而是被称为 `无组件路由`。无组件路由是那些为了更好的结构而分组路由，但不预期\
    \ router outlet 放置在其内部的路由。那么主组件在哪里呢？它位于空路径的分组中。让我们查看下面的代码以更好地理解：\n\n```\nconst\
    \ routes: Routes = [\n  {path: 章 home’, component: HomeComponent},\n  {path: 章\
    \ next’, children: [\n    {path: 章’, component: NextComponent},\n    {path: 章\
    \ third’, component: ThirdComponent},\n    {path: 章 login’, component: LoginComponent}\n\
    \  ]},\n  {path: 章’, redirectTo: 章 home’, pathMatch: 章 full’},\n  {path: 章**’,\
