    \n图 1.5\n\n一旦创建了应用程序，你可以在代码编辑器中打开它。要在 Visual Studio Code 中打开它，请使用以下命令：\n\n`code\
    \ .`\n\n![](img/p006-002.jpg)\n\n图 1.6\n\n这将在 Visual Studio Code 中打开新创建的项目，文件夹结构如下：\n\
    \n![](img/p007-001.jpg)\n\n图 1.7\n\n现在，要编译你的应用程序，请使用以下命令：\n\n`ng serve`\n\n![](img/p007-002.jpg)\n\
    \n图 1.8\n\n这将为你提供任何 Angular 应用的介绍视图，标题为你的项目名称：\n\n![](img/p007-003.jpg)\n\n图 1.9\n\
    \n## Components\n\n在 Angular 中，组件是最基础的构建块，它包含了实现视图中显示内容的代码。组件由模板、类以及用于为应用程序设置样式的\
    \ CSS 文件组成。\n\n组件本质上是一个被 `Component` 装饰器装饰的类。这个装饰器使类按照组件装饰器的功能进行行为。组件装饰器包含了类以特定方式行为的元数据。\n\
    \n让我们来看一个组件类：\n\n```\nimport { Component } from '@angular/core';\n@Component({\n\
    \  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls:\
    \ ['./app.component.css']\n}) \nexport class AppComponent {\n  title = 'BasicsofRouting';\n\
    }\n```\n\n`AppComponent` 类包含了实现组件视图的属性和方法。它被组件装饰器装饰，该装饰器包含了类作为组件行为的信息，以及将显示在浏览器上的模板。`import`\
    \ 语句包含了我们需要的重要文件。\n\n要从 CLI 创建组件，我们使用以下命令：\n\n`ng generate component <component-name>\
    \ OR ng g c <component-name>`\n\n组件还由一个 HTML 文件组成，它决定视图中显示的内容。每个组件都有自己关联的模板。\n\
    \n组件文件的结构如下所示：\n\n![](img/p009-001.jpg)\n\n图 1.10\n\n## Directives\n\n当我们想给元素添加指定的行为时，可以使用指令（directive）。指令可以更改文档对象模型（`DOM`）的结构、行为等。Angular\
    \ 中三种类型的指令，如下：\n\n* 组件 (Components)\n* 属性指令 (Attribute directives)\n* 结构指令 (Structure\
    \ directives)\n\n组件也是指令的一种，它们带有关联的模板。属性指令用于更改 DOM 的外观和行为，结构指令用于通过添加或删除元素来更改 DOM\
    \ 的布局。\n\n同样，指令可以使用 `@Directive` 装饰器作为类装饰器。我们还可以在 Angular 中创建自定义属性指令，并根据我们的需求来修改\
    \ DOM。\n\n我们可以使用以下命令在 Angular 中创建指令：\n\n`ng generate directive <directive-name>\
    \ OR ng g d <directive-name>`\n\n![](img/p010-001.jpg)\n\n图 1.11\n\n指令在我们的 Angular\
    \ 应用中的结构如下截图所示：\n\n![](img/p010-002.jpg)\n\n图 1.12\n\n## Services\n\n当我们有两个或多个组件并想在它们之间共享数据时，可以使用组件通信技术。其中一些使用了\
    \ `input`、`output`、模板引用变量等。然而，当组件之间不共享任何内容时，则使用服务（services）进行通信。\n\n因此，为了实现任何独立于组件的功能，我们使用服务。现在，当你想在特定组件中使用此功能时，可以将此服务注入到模块中。\n\
    \n要从 CLI 创建服务，我们使用以下命令：\n\n`ng generate service <service-name> OR ng g s <service-name>`\n\
    \n![](img/p011-001.jpg)\n\n图 1.13\n\n创建后服务文件所示：\n\n![](img/p011-002.jpg)\n\n图\
    \ 1.14\n\n构建服务后，我们在模块中注册服务如下：\n\n![](img/p012-001.jpg)\n\n图 1.15\n\n要在任何组件中使用此服务，你可以将其注入到组件的构造函数中。\n\
    \n```\nconstructor (private demo: DemoService){}\n```\n\n## Modules\n\n模块是由 `@NgModule`\
    \ 装饰器装饰的类，帮助我们更好地组织代码。模块的一些示例包括 `BrowserModule`、`FormsModule` 等。\n\n它声明应用程序中的每个组件、指令和管道。它引导组件，定义应用程序从何开始。它还会在模块内部导入所有所需的模块以使其功能正常，并导出某些模块可能需要的模块。Angular\
    \ 模块还将需要注入到组件的服务注册为 `providers`。\n\n它包含以下数组：\n\n* imports（导入）\n* exports（导出）\n\
    * providers（提供者）\n* bootstrap（引导）\n* declarations（声明）\n\n![](img/p013-001.jpg)\n\
    \n图 1.16\n\n我们也可以可以使用命令创建模块：\n\n`ng generate module <module-name> OR ng g m <module-name>`\n\
    \n![](img/p013-002.jpg)\n\n图 1.17\n\n在下面的截图中，新创建的模块如下所示。它被 `NgModule` 装饰器装饰，使该类作为模块行为：\n\
    \n![](img/p013-003.jpg)\n\n图 1.18\n\n## Routing\n\nAngular 是单页应用程序（`SPAs`）。当我们需要将应用程序视图从一个切换到另一个视图时，我们无法真正导航到应用程序内的其他页面。同样，当我们需要从一个视图导航到另一个视图或者说从一个组件导航到另一个组件时，我们使用路由（routing）。路由帮助我们从页面的一个视图到另一个视图，提供带有不同信息的模板视图。\n\
    \n我们导入 `RouterModule` 来执行路由并定义路由如下：\n\n![](img/p014-001.jpg)\n\n图 1.19\n\n"
- fmt: "\nWith the later versions of Angular, the CLI asks if we need routing for\
    \ our application, and creates `AppRoutingModule` if we need routing in our application.\
    \ This separate module for the route configurations helps organize the code better\
    \ and exports `RouterModule` which is then imported inside `AppModule`. The `AppRoutingModule`\
    \ module created by the CLI looks like this:\n\n![](images/p015-001.jpg)\n\nFig\
    \ 1.20\n\nTo use these routes, we can use the path value to navigate to any of\
    \ the routes from a component view. We will see routing in detail in the upcoming\
    \ chapters.\n\n## Summary\n\nIn this introductory chapter to Angular, we discussed\
    \ all the basic concepts of Angular to get a rough idea of the structure and anatomy\
    \ of Angular. The topics important to get started with Angular routing have been\
    \ explained briefly. By the end of this chapter, the reader must be able to form\
    \ a basic understanding of the core concepts of Angular such as components which\
    \ are the basic building blocks of Angular, modules which contain and import all\
    \ the required components, directives, pipes, and more, services which help us\
    \ use the functionality for components that are not related to each other. We\
    \ also saw how to create new components, directives, modules, and services using\
    \ the Angular command line interface (`CLI`). A small introduction to Angular\
    \ routing was also covered to get an idea of what Angular routing really means.\n\
    \nIn the next chapter, we will learn about routing and its importance at a broader\
    \ level.\n\n# CHAPTER 2\n\n## Introduction to Routing\n\nWith an idea of how the\
    \ structure of files is in Angular applications, we can move ahead to learn about\
    \ routing in Angular applications. In this chapter, you will learn about routing\
    \ in detail, how it helps build single-page applications (`SPAs`), and what is\
    \ the significance of routing in Angular applications. By the end of this chapter,\
    \ you should be able to answer all the why’s you have regarding the use of routing\
    \ in the web applications built using the Angular framework.\n\nIn this chapter,\
    \ we will cover the following topics:\n\n*   Defining routing\n*   Routing and\
    \ SPAs\n\n## Defining routing\n\nAs discussed in the introduction chapter, we\
    \ do have an idea by now about what routing helps us to do in an Angular application.\
    \ When you need to change the template view from one to another, the browser URL\
    \ gets changed and you will see a different view from the earlier one. The working\
    \ of routing in Angular is based on the Angular router.\n\n## What is an Angular\
    \ router?\n\nThe Angular router is the official library with JavaScript implementation\
    \ for routing in the Angular-based web applications. It comes as a part of Angular\
    \ core packaged as `@angular/router`.\n\nThe Angular router is the one behind\
    \ all the functionalities that we perform in routing from one view to another\
    \ in an Angular application. It activates all the components associated with a\
    \ particular route configuration. It not only helps to view another component\
    \ from one component without reloading the page, but also helps us redirect the\
    \ URL to the desired component.\n\nIn the upcoming chapters, we will learn about\
    \ routes resolvers, route guards, lazy loading the modules; all these functionalities\
    \ are used as part of the `@angular/router` package.\n\nLet us take a look at\
    \ the working of an Angular router.\n\nThe very first and foremost task of an\
    \ Angular router is to navigate to the configured routes for the components which\
    \ are routable. So, the routes components are configured as the route configurations\
    \ and these configurations are known as router states. Once these states are configured,\
    \ the Angular router will render this set of components and bring the change in\
    \ the browser URL. This will also require the router outlet to be present on the\
    \ template as a placeholder for placing the template view on that page.\n\nAnd\
    \ this is why the first step when working with Angular routing is to import `RouterModule`\
    \ inside your application. The next step is to configure the router states which\
    \ form a tree of the router states. To do this, the routes are configured inside\
    \ the `routermodule.forRoot()` method.\n\nIn the next chapter of setting up a\
    \ routing application, you will see the different ways of using `routermodule.forRoot()`.\n\
    \nAt a given point in time, there is going to be one route which will be running\
    \ and that is called the active route.\n\nWhenever the routed path changes, it\
    \ brings a change in the URL of the browser and the activated route also changes.\
    \ In the upcoming chapters, you will also see how the order of paths in the route\
    \ configuration or you can say route state tree, matters a lot. It follows the\
    \ depth-first search algorithm and matches the first route path with the entire\
    \ URL.\n\nOnce the configurations of the routes are covered, we can see how the\
    \ Angular router navigates from one route to another. To understand this better,\
    \ let us understand the router lifecycle first:\n\n*   Apply the redirects\n*\
    \   Match the router state URL\n*   Activate the guards\n*   Activate the resolvers\n\
    *   Activate the final view on the template using router outlet\n\nThe following\
    \ diagram shows the lifecycle of a router:\n\n![](images/p019-001.jpg)\n\nFig\
    \ 2.1\n\nThe router has a lot of events that take place during this whole process.\
    \ The router events can be listened to using the router service with the help\
    \ of an observable. Some of the router events are as follows:\n\n*   `NavigationStart`:\
    \ When the navigation cycle of the router starts successfully.\n*   `NavigationEnd`:\
    \ When the navigation cycle of the router ends successfully.\n*   `NavigationCancel`:\
    \ This event is triggered when the navigation is canceled.\n*   `NavigationError`:\
    \ When the navigation fails due to some unex-pected error, this event is triggered.\n\
    *   `ResolveStart`: This event is triggered when it is in the resolve phase of\
    \ routing.\n*   `ResolveEnd`: This represents the end phase of routing.\n*   `RouteConfigLoadEnd`:\
    \ When any of the lazy loaded is loaded, this event is triggered to show that\
    \ some route has been lazy loaded.\n*   `RouteConfigLoadStart`: This is triggered\
    \ before lazy loading a route.\n*   `GuardsCheckStart`: This is triggered when\
    \ the Guard phase of routing starts.\n*   `GuardsCheckEnd`: This is triggered\
    \ when the Guard phase of routing ends.\n*   `RoutesRecognized`: As the name suggests,\
    \ when the routes are recognized, this event is triggered.\n*   `ChildActivationStart`:\
    \ When the resolve phase of routing ends, this event is triggered to show the\
    \ start of the end of this phase.\n*   `ChildActivationEnd`: When the resolve\
    \ phase of routing ends, this event is triggered to show the start of the end\
    \ of this phase.\n*   `ActivationStart`: When the resolve phase of routing ends,\
    \ this event is triggered to show the start of the end of this phase.\n*   `ActivationEnd`:\
    \ When the resolve phase of routing ends, this event is triggered to show the\
    \ start of the end of this phase.\n*   `Scroll`: This represents a scrolling event.\n\
    \nThese events tell the state of the Angular router; for example, `NavigationStart`\
    \ denotes the start of the navigation cycle, `NavigationEnd` denotes the end of\
    \ the navigation cycle, `NavigationCancel` is used when the guard does not allow\
    \ the user the access to navigate to a route.\n\nWe can see a series of events\
    \ from the browser by setting the `enableTracing` option to be true for the `RouterModule`\
    \ object’s `forRoot()` method or by injecting the router service and subscribing\
    \ to the events observable:\n\n```\nconstructor(private router: Router) {\n  this.router.events.subscribe(\
    \ (event: RouterEvent) => console.log(event))\n}\n```\n\nTherefore, the Angular\
    \ router makes it easy to configure the route configurations, that is, router\
    \ states, and also helps to navigate to one route path to another with so many\
    \ different router events running in the background which definitely can be looked\
    \ at.\n"
