  trans: "\n因此，当你在外部路由模块中有路由配置时，确保在所有功能模块路由之后在 `AppModule` 中导入它是非常重要的。\n\n`AppModule`\
    \ 中的这种顺序将如下代码所示：\n\n```typescript\n@NgModule({\n  imports: [\n    UserModule,\n\
    \    DataModule,\n    AppRoutingModule //AppRoutingModule 移动到所有其他模块的末尾\n  ],\n\
    \  declarations: [\n    AppComponent,\n    HomeComponent,\n    NotFoundComponent\n\
    \  ]\n})\nexport class AppModule{}\n```\n\n现在，将路由放在单独的路由模块中，其行为与所有路由都在 `AppModule`\
    \ 中时是相同的。\n\n## 使用独立模块进行路由配置\n\n当应用变得庞大且复杂时，将所有的路由配置保留在专用的路由模块中可以极大简化任务并有助于更好地组织。每当你想要在\
    \ `AppModule` 中进行任何更新时，都不需要查看所有的路由配置。\n\n## 总结\n\n在本章中，我们学习了功能模块的使用，以及如何通过对 Angular\
    \ 应用中路由路径进行更好的排序和组织来使路由变得如此简单。我们还涵盖了创建功能模块以及使用功能路由配置访问这些模块等主题。我们还看到了 `navigate`\
    \ 和 `navigateByUrl` 的使用，并理解了按特定顺序添加路由的重要性。我们还讨论了如何传递路由参数以查看特定的组件数据。在下一章中，我们将学习路由参数。\n\
    \n# 第 5 章\n\n# 路由参数\n\n在本章中，你将学习如何向路由传递数据，以获取组件的特定视图。当你从一个组件移动到下一个组件并需要传递某些数据时，你会使用路由参数。例如，如果你的当前组件上有一个产品列表，你想查看该列表中的其中一个产品。要实现这一点，你需要该特定产品的标识符，此标识符可以作为路由参数传递，并在下一个组件中查看。\n\
    \n你将详细学习路由参数，但在那之前，你需要对以下主题有清晰的理解：\n\n* 路由的配置、设置和激活\n* 对功能路由的理解\n\n现在你已经知道如何设置路由、配置路由、同时从模板和代码中激活路由，以及功能模块，你就可以准备好向已设置的路由传递参数了。\n\
    \n在本章中，我们将涵盖以下主题：\n\n* 定义路由参数\n* 使用路由参数\n* 读取路由参数\n* 可选参数和查询参数\n\n## 定义路由参数\n\n\
    当我们我们需要从列表的所有项目项访问某个特定项目时，我们对其有一个唯一的标识符。我们将该唯一标识符作为路由参数传递给路由，并显示与该特定标识符相关的项详细视图。这些是在路由内部传递的变量，其值取决于所选的产品或项目。\n\
    \n在上一章中，我们已经有点熟悉了路由参数的使用。我们在本章的目标是实际上理解这意味着什么，以及我们如何在应用程序中使用路由参数。我将在这里继续使用上一章的相同示例：\n\
    \n![](img/p046-001.jpg)\n\n图 5.1\n\n这里，公共路由是 `user`，它是一个常量路由，而 `:id` 是变量路由的占位符，它取决于选择了哪个产品。应用程序中也可以有多个变量路由。\n\
    \n例如，`localhost:4200/user/:id/products/:num`。\n\n要配置路由参数，请使用以下代码：\n\n```typescript\n\
    {path: ‘user/:id’, component: GetUserDetails}\n```\n\n![](img/p047-001.jpg)\n\n\
    图 5.2\n\n你已经在上一章中看到了如何激活路由。要激活传递了路由参数的路由，遵循的是以下语法（从模板）：\n\n```html\n<a [routerLink]\
    \ = “[‘/user’, user.id]\">{{user.userName}}</a>\n<a [routerLink] = “[‘/user’,\
    \ 0]”>Create User</a>\n```\n\n如你所见，在第一行代码中传递了用户的 ID，这会将视图重定向到该 ID 的用户详情。然而，如果传递的\
    \ ID 为零，它将把视图重定向到创建新用户，因为 0 尚未关联任何用户。\n\n同样（从 `Component` 中）：\n\n```typescript\n\
    this.router.navigate([‘/user’, this.user.id])\n```\n\n这将导航到此 `id` 用户的视图，并在浏览器中显示如如下截图所示：\n\
    \n![](img/p047-002.jpg)\n\n图 5.3\n\n视图显示了 ID 为 `5` 的用户的 URL。但我们实际上无法看到数据，尽管 URL\
    \ 看起来是正确的。所以，发生这种情况是因为我们只是配置了路由参数，但并没有实际读取它们。\n\n为了用包含在特定路由组件中的数据填充视图，我们需要读取路由参数。\n\
    \n在配置并使用路由参数的基本示例后，让我们现在继续查看我们如何读取参数。\n\n## 读取路由参数\n\n到目前为止，我们已经配置了路由，并且可以看到 URL\
    \ 的变化。要从激活的组件读取路由参数，我们使用 `ActivatedRoute` 服务。该服务有助于读取路由参数并显示与特定路由对应的数据。要注入此服务，请使用以下代码行：\n\
    \n```typescript\nconstructor( private activateRoute: ActivatedRoute)\n```\n\n\
    注入服务后，我们将使用该服务的 `snapshot` 选项，它提供了路由的初始状态。要访问路由参数，我们使用 `paramMap.get()` 方法并将路由占位符作为参数：\n\
    \n```typescript\nconst id = this.activateRoute.snapshot.paramMap.get();\n```\n\
    \n在接收到初始值后，我们希望在每次参数变化时更改视图。为了订阅参数的变化，服务提供了此 `paramMap` Observable 对象，每当参数发生变化时都会收到通知：\n\
    \n```typescript\nthis.activateRoute.paramMap.subscribe(\n  parameters => {\n \
    \   const id = parameters.get(‘id’);\n  }\n);\n```\n\n## 使用 ActivatedRoute 服务的快选项\n\
    \n要使用 snapshot 方法，我们需要执行的第一步是导入服务：\n\n```typescript\nimport {ActivatedRoute} from\
    \ ‘@angular/router’;\n```\n\n导入服务后，我们在组件的 `constructor` 中注入它。这与我们之前在本章中看到的相似：\n\
    \n```typescript\nconstructor( private activateRoute: ActivatedRoute)\n```\n\n\
    现在，由于快 选项有助于获取路由的初始化状态，我们需要考虑具体放在哪里读取数据的语句。现在是生命周期钩子 `ngOnInit()` 发挥作用的时候：\n\n\
    ```typescript\nngOnInit(){\n  const id = this.activateRoute.snapshot.paramMap.get(‘id’);\n\
    \  this.getUser(id);\n}\n```\n\n现在我们读取了路由参数，让我们检查是否能在浏览器中看到数据：\n\n![](img/p049-001.jpg)\n\
    \n图 5.4\n\n然而，当路由参数值发生变化时，读取路由参数的方法将不起。这是因为组件不会重新初始化数据。\n\n在这种情况下，当我们需要捕获任何变化的数据时，我们需要使用\
    \ `ActivatedRoute` 服务提供的 Observable，即 `paramMap`。\n\n"
- fmt: "\nThe `paramMap` observable will subscribe to the change that takes place\
    \ in the value of the variable `route` parameter inside the constructor where\
    \ we injected the dependency of the `ActivatedRoute` service.\n\nAfter having\
    \ imported the `ActivatedRoute` service from the Angular/ router and having injected\
    \ the service inside the constructor, the `paramMap` observable will subscribe\
    \ to the value of the change in the route parameter:\n\n```typescript\nconstructor\
    \ (private activateRoute: ActivatedRoute){\n  this.activateRoute.paramMap.subscribe(\n\
    \    parameters => {\n      console.log(parameters.get('id'));\n    }\n  );\n\
    }\n```\n\nHaving looked at the usage of both the snapshot and observable, we need\
    \ to figure out as to when to use the snapshot option and the observable provided\
