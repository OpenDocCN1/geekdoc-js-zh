    as he performs different tasks on the **Document Object Model** (**DOM**).


    Let us take the example of a simple website to understand the basic setup of a
    routing application.


    The first thing we must do is go to the browser and type the **Uniform Resource
    Locator** (**URL**) of the website. What we will see then is the first view of
    the web application.


    Now suppose if you click on some button on the website to look for the details
    of some item, let us say, you get access to some new information now which was
    earlier not available to you. Technically, the first view that you see when accessing
    the website through the URL does not have this information and this basically
    means that the data you receive on the click of the button may be contained in
    some other view, in this case, another component.


    And this is why we navigate from one view to another. To achieve this activity
    of moving to and from different views, we use routing.


    The browser identifies the first view through the URL which directs you to the
    first component template, and then using different routing techniques, the URL
    can be modified redirecting to another component associated with that particular
    path.


    To start creating your Angular routing application, the first step is to go the
    index.html file and look for the <base> element under the head tag. This base
    path is appended to the path of the server. To work with routing and navigation,
    set this element as mentioned below:


    `<base href=“/”>`


    This is applicable if the application root for your Angular application is the
    `app folder.` This base path is used for development purpose. However, when the
    application is deployed for production, the base path needs to be changed. One
    way to do it is to manually go to the `index.html` file, and another better way
    is to use the CLI to do it for you by passing the name of the sub folder. The
    command to be used on the CLI for this is as follows:


    **`ng-build –base-href /subfolder/`**


    The next step after setting up your `index.html` file is to do the necessary imports
    before writing the code for navigation. The `import` statement required in the
    beginning is in the following code:


    `import { Routes, RouterModule } from ‘@angular/router’;`'
