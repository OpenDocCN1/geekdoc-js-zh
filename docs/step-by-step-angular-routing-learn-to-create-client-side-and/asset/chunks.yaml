    with`


    `the data private handleError(error: any) {`


    `console.error(error); //Created a function to handle and log errors, in case`


    `return throwError(error);`


    `}`


    `}`


    Now, let us try to understand this code. We have created the service `DataService`.
    Inside this service, we access the data through the remote API with the help of
    this line of code:


    `apiurl = ‘api/users’;`


    The next step is to inject the `HttpClient` service but before we do this, we
    need to import some important files:


    `import {HttpClient, HttpHeaders} from ‘@angular/common/http’;`


    `import {Observable, throwError} from ‘rxjs’;`


    `import { tap, catchError } from ‘rxjs/operators’;`


    In the preceding code, we are setting the `httpOptions` variable to perform HTTP
