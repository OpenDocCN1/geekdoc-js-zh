  raw: 'The `paramMap` observable will subscribe to the change that takes place in
    the value of the variable route parameter inside the constructor where we injected
    the dependency of the `ActivatedRoute` service.


    After having imported the `ActivatedRoute` service from the Angular/ router and
    having injected the service inside the constructor, the `paramMap` observable
    will subscribe to the value of the change in the route parameter:


    `constructor (private activateRoute: ActivatedRoute){`


    `this.activateRoute.paramMap.subscribe(`


    `parameters => {`


    `  console.log(parameters.get(‘id’));`


    `}`


    `);`


    `}`


    Having looked at the usage of both the snapshot and observable, we need to figure
    out as to when to use the snapshot option and the observable provided by the service:


    *   Use snapshot when: You can use this option when you want to read the route
    parameters only once. You can also use this option when you want to keep the code
    simple and you know there is no scope for changes.


    *   Use Observable when: This parameter is expected to change repeatedly. You
    can use this option when you want to get notified of the changes in the route
    parameters and subscribe to that data.


    After you have read the route parameters and are able to successfully view the
    data on the specific routes, the next bit to jump into is to see what the other
    optional parameters are:


    ![](images/p051-001.jpg)


    Fig 5.5


    This gives the output as shown in the following screenshot:


    ![](images/p051-002.jpg)


    Fig 5.6


    Now when you click on the **`Go to this product`** button, it takes you to the
    next route with the route parameter displayed in the URL:


    ![](images/p052-001.jpg)


    Fig 5.7


    ## [Query and optional parameters](#toc.xhtml_ch27)


    When we want to pass in some optional information to the route, we use optional
    parameters. Option parameters make it easy to access the more complex information
    by having key-value pairs naming technical in the route.


    To define the optional parameters, we use the `routerLink` array and pass them
    in using the key-value pairs:


    `<a [routerLink] = [‘/users’, {name: username, age: userAge}]>`


    Now since each parameter has a unique key, it is easily identifiable and does
    not complicate the route configuration.


    The resulting URL then looks like this:


    [`https://localhost:4200/users;name=Manish;age=42`](https://localhost:4200/users;name=Manish;age=42)


    As you can see in the generated URL, it has these key-value pairs with unique
    identifiers for each of the optional parameters so that no route collision issues
    will take place as such.


    ## [Reading the optional parameters](#toc.xhtml_ch28)


    To read the optional parameters, we will simply import the `ActivatedRoute` service
    as discussed earlier and inject it inside the constructor. Having done this, we
    will put the optional parameters in the `routerLink` array and then finally use
    it inside the constructor using the snapshot option to get the parameters through
    the code.


    We can do this using the following code:


    `console.log(this.activateRoute.snapshot.paramMap.get(‘name’));`


    ## [Query parameters](#toc.xhtml_ch29)


    When we want to pass the option information to the component but want to retain
    it at the same time after some operation has been performed on the component,
    query parameters come to be of great help. query parameters help to communicate
    across multiple routes, therefore, retaining the data retrieved on a particular
    component view.


    The syntax that query parameters follow is that they start with a question mark
    and an ampersand as a separator:


    [`https://localhost:4200/users/?nameby=this&age=some`](https://localhost:4200/users/?nameby=this&age=some)


    To define the query parameters, we use the `queryParams` directive to bind the
    information and it is not passed as part of the `routerLink` array.


    It basically looks like the following code:


    `<a [routerLink]= “/users”, user.id [queryParams] =“{…}”></a>`


    From the following code, we define our `queryParams`:


    `this.router.navigate([‘/users’].{`


    `queryParams: {…}`


    `);`


    Query parameters also contain key-value pairs like the optional parameters. Now
    when we navigate back from the current page, we want the data to be retained.
    To retain the data, we can use the `queryParamsHandling` directive to preserve
    the data that has been changed:


    `<a [routerLink]= “[‘/users’]”,queryParamshandling=”preserve”></a>`


    This retains the URL in the browser but we should not forget that we need to read
    the parameters.


    ## [Reading the query parameters](#toc.xhtml_ch30)


    To read the query parameters, we will perform the same steps as discussed earlier.
    We will import the `ActivatedRoute` service from the Angular/route and inject
    it inside the constructor. Inside the constructor, we will simply use the get
    method to read the query parameters using the following code:


    `console.log(this.activateRoute.snapshot.queryParamMap.get(‘’));`


    This will finally read the parameter and display the data as per the query parameters.


    ## [Summary](#toc.xhtml_ch31)


    In this chapter, we learned about the routing parameters which are used to pass
    a specific identifier to our route configuration. This is used to get the data
    corresponding to the item identified by the given route parameter. We also saw
    how using the route parameter brings in the change in the URL, but to display
    it in the view, we need to read the parameter using either the snapshot option
    or the observable provided by the `ActivatedRoute` service. Then, we learned about
    some other parameters like optional and query parameters.


    In the next chapter, we will learn about child routes and how we can place and
    view one route within another route.


    # [CHAPTER 6](#toc.xhtml_cn6)


    # [Child Routes](#toc.xhtml_cn6)


    Until now, we have very well understood the use of routing in an Angular application.
    We have also seen how to create feature routes to organize and implement our Angular
    app much better. This brings us to dive a little deeper into organizing the routes
    in a more hierarchical manner. This basically means that if we have some feature
    routes already created and we have some edit functionality to add to it, we will
    definitely need another component for this. A better approach would be to create
    this edit component inside the already created feature module. We can call it
    a nested route.


    Before moving on to see the working of child routes, make sure that you are well-versed
    with feature routes and how they can be configured and routed to inside an application.


    In this chapter, we will cover the following topics:


    *   Defining child routes


    *   Configuring child routes


    *   Activating these routes


    ## [Defining child routes](#toc.xhtml_ch32)


    Child Routes help us organize our components better in an Angular application.
    We define a route hierarchy to organize and navigate to different components through
    Child Routes. Also, child routes make it easy to lazy load routes thus improving
    the performance of the application. Lazy loading is an important concept of routing
    and will be discussed in the upcoming chapters. These child routes are nested
    under any of the primary routes, which then act as the parent components having
    one or more children routes:


    ![](images/p056-001.jpg)


    Fig 6.1


    If we want to display a route component template, we simply put the router outlet
    element on the template and it appears in the view. However, if you want to display
    one route inside another route component template, we use Child routes. But the
    question still persists that how to display two templates in the same view.


    To do this, the best approach is to use tabs to contain the different routes information
    and display whenever whichever tab is being clicked on. The result to be obtained
    on the click of a tab can be displayed inside a general containing component for
    the view. The first component for the view to be used as a container is shown
    in the following screenshot:


    ![](images/p056-002.jpg)


    Fig 6.2'
