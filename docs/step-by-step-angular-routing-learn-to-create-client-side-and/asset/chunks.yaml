    # About the Author


    `Nishu Goel` is a software developer currently working with `IBM` in Bengaluru,
    India. She has completed her Bachelor studies in computer science as in 2018.
    She works on `Angular` and keeps learning on the go. She loves to write blog posts
    and talk around the basic concepts of `Angular` at conferences. She is also the
    author of “Angular for Beginners” course on Udemy. With her work to apply technology
    towards sustainable development goals (SDGs) by the United Nations living in the
    villages of Jharkhand, India for three months, she has been awarded by the Prime
    Minister of the UK.


    Some of her hobbies are: Working for community development with a focus on selective
    SDGs, Speaking at conferences, exploring places.


    With this book, she aims to share her learning and understanding of the concepts
    of `Angular Routing` with everyone.


    You can tweet her at `@DcoustaWilson` and read her blog posts at [https://nishugoel.wordpress.com/](https://nishugoel.wordpress.com/)


    ## This book is dedicated to

    my Papa and Mumma for supporting what I wish to do at every step of my life.


    # Foreword


    Routing is one of the most important concepts for `Angular` developers. Whether
    you are just getting started in web development, or are an `Angular` expert, the
    mapping between the URL bar and the state of your application is a critical piece
    of functionality. Routing bridges the gaps between the individually addressable
    page model of the past and the rich client-side single page applications of today.


    The `Angular router` is very powerful and this comes with some complexity. In
    the early days of `Angular`, it took the `Angular` team a few tries to get all
    of the complexity right. Nishu’s guide to the router covers everything that an
    `Angular` developer will need to know to take care of the most common use cases,
    but she also covers more advanced strategies that will take developers’ skill
    sets to the next level.


    By acting as a guide to each of the learning steps that `Angular` developers should
    take in their journey with the router, she accelerates the learning process and
    hits important markers along the road, such as the nuances of handling asynchronicity
    with the router.


    With this book, Nishu cements her place as a rising star in the `Angular` community.


    **Stephen Fluin, Developer Relations Lead, Angular**


    # Preface


    Building web applications has been done using `HTML`, `JavaScript` in the past
    a lot. When it comes to building large applications, libraries like `Dojo`, `knockout`
    etc. were used at a large scale. In 2009, the web developer community was taken
    by a storm when `AngularJS` was introduced. Misko Hevery and Adam Abrons built
    it as a side project at `Google` and since then, this framework is not stopping
    to amaze people and help them build applications much faster and efficiently.


    With the constant upgrades to this framework, it is growing more and more user-friendly
    and is now called `Angular` after the first version which was called `AngularJS`.
    From `Angular 2` to the current version of `Angular`, the widely used name is
    just `Angular` irrespective of the version number.


    At the time of writing this book, the version of `Angular` used is `7.3.7` and
    is very soon to be upgraded to `Angular 8`.


    Some of the amazing features of `Angular` framework make it a widely-used framework
    for building single-page web applications. And one of the things that attracted
    me the most towards `Angular` framework was the so-simplified routing and navigation
    techniques in it and how it is so compatible with the `Angular CLI` (command-line
    interface).


    And this was one of the driving factors for me to invest my time into writing
    this book about `Angular Routing`.


    The structure of this book is kept simple starting from the introduction of some
    the basic concepts of `Angular` to get started, followed by the introduction to
    `Angular Routing`, basic set-up, concepts like guarding the routes, using parameters
    to route to different views, using lazy loading to improve the performance of
    the application etc era.


    I have tried my best to keep the language simple to understand and used no heavy
    terms, in the hope of making this book an easy read for the audience and also
    a good read for the beginners in `Angular`.


    The major motivation for me to write this book came from the person who has lived
    `Angular` for years and is the one who got me started in learning `Angular` right
    after my under-graduate studies. Mr. Dhananjay Kumar a.k.a `DJ` is the organiser
    of the `Angular` conference of India, `ng-India` and is a Developer Evangelist
    at `Infragistics`. He is the author of the book `Angular Essentials`. He has always
    been an inspiration whether it is his knowledge, hard-work, or the passion to
    teach people and help them grow.


    Another one of the driving factors for me was my interest to write a book on a
    technical topic and after having learned some concepts of `Angular` with my major
    focus on `Angular routing` and having a clarity about Routing concepts, I decided
    to go for it.


    The major learning sources for me in my journey of getting my basic concepts clear
    were `DJ` of course, the Pluralsight courses by `Deborah Kurata`, and the official
    documentation of `Angular`, `angular.io`.


    This book has a `GitHub` repository associated with it and the link to the repository
    is shared inside, because as we all have heard, the best way to learn something
    is by doing it.


    # CODE ALONG!


    GitHub Link to the working code examples for different topics in the book:


    **[https://github.com/NishuGoel/AngularRoutingBook](https://github.com/NishuGoel/AngularRoutingBook)**


