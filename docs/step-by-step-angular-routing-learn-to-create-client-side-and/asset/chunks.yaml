    \ routing to a feature module, you need to add an import statement to the `RouterModule`\
    \ and add it to the declarations array. Since this is a feature module, you need\
    \ to declare the `Routes` array by using `forChild()` in place of `forRoot()`:\n\
    \n```typescript\nRouterModule.forChild([\n  {path: ‘next’, component: NextComponent}\n\
    ])\n```\n\nWe will define the `NgModule` as shown in the following screenshot:\n\
    \n![](images/p036-001.jpg)\n\nFig 4.1\n\nWhen naming the feature routes, it is\
    \ a good practice to use the same name for the feature route and then add the\
    \ other extended versions of it. This means that if you are creating a user feature\
    \ module and if you want to access the user with a particular ID, you should be\
    \ able to simply use `user/:id` where: `id` is a route parameter.\n\nThe concept\
    \ of Route parameters will be covered in the next chapter.\n\n![](images/p037-001.jpg)\n\
    \nFig 4.2\n\n## Activating the route through code\n\nIn the previous chapter,\
    \ you saw how to use the `routerLink` directive to activate the route on the component\
    \ template. However, one of the challenges you face when you want to use the code\
    \ before performing routing.\n\nTo understand this in simple terms, when a user\
    \ is signed in and you want to sign the user out using the sign out button before\
    \ actually navigating to the home page, that is when you need to use the code\
    \ before actually performing routing.\n\nTo achieve this, you need to use Angular’s\
    \ `Router` service. This service is injected inside the constructor of the component\
    \ and using this, you can use the `navigate` method to link to the route path\
    \ to navigate to:\n\n```typescript\nimport { Component } from ‘@angular/core’;\n\
    import { Router } from ‘@angular/router’;\n\n@Component({\n  selector: ‘app-root’,\n\
    \  templateUrl: ‘./app.component.html’,\n  styleUrls: [‘./app.component.css’]\n\
    })\nexport class AppComponent {\n  title = ‘RoutingDemo’;\n  constructor(private\
    \ router: Router){}\n  signOut(){\n    this.router.navigate([‘/next’]);\n  }\n\
    }\n```\n\nThis navigates the user to `NextComponent` after he signs out of the\
    \ account.\n\n## Using navigate() and navigateByUrl()\n\nThe `navigateByUrl` method\
    \ displays the complete URL path, removing any other path present in it. This\
    \ method is different from the `navigate` method when the secondary routes come\
    \ into the picture.\n\nUsing the `navigate` method, the first route information\
    \ will change but the secondary route will remain as it is and will not disappear\
    \ from the current route.\n\nFor example, `localhost:4200/next(secondaryroute)`.\
