  trans: "\n\n以下代码片段演示了如何添加路由解析器（route resolvers）的示例：\n\n```javascript\n{\n  path:\
    \ ‘user’,\n  component: UserComponent,\n  resolve: {user: UserResolver}\n}\n```\n\
    \n可以使用解析器服务的引用作为键值对来添加解析器。在本文示例中，我们使用 `user` 作为键来引用 `UserResolver` 服务：\n\n![](img/p090-001.jpg)\n\
    \n图 10.5\n\n我们也可以为组件使用多个解析器服务，以确保每个解析器服务的键是唯一的。此外，另一个需要确保点是在模块（module）内部导入解析器服务。你可以参考以下代码：\n\
    \n```javascript\nimport {UserResolver} from ‘./user-resolver..service’;\n```\n\
    \n## 读取路由解析器\n\n现在我们已经创建了解析器服务并将其注册到模块中，最后最后一步也是最终一步了，即从服务中读取数据。实现此操作有两种方法：第一是使用快照（snapshot），第二是使用观察流（observable）。让我们先看看在数据不变化且为静态的情况下如何操作，我们可以使用快照：\n\
    \n```javascript\nconstructor(private route: ActivatedRoute){\n  this.user = this.route.snapshot.data[‘user’];\n\
    }\n```\n\n现在我们有了这些非变化的数据，可以在 `ngOnInit()` 生命周期钩子中获取这些数据：\n\n```javascript\nngOnInit(){\n\
    \  const <key>: UserResolver = this.route.snapshot.data[‘<key>’];\n}\n```\n\n\
    在我们的情况下，它应该像下面的代码：\n\n```javascript\nngOnInit(){\n  const user: UserResolver =\
    \ this.route.snapshot.data[‘user’];\n}\n```\n\n我们还需要将此键及其值传递给处理它的方法，因此在 `ngOnInit`\
    \ 生命周期钩子中，我们使用以下代码：\n\n```javascript\nngOnInit(){\n  const user: UserResolver\
    \ = this.route.snapshot.data[‘user’];\n  this.method(user.User)\n}\n```\n\n如果数据每次进入同一页面时发生变化，我们将使用观察流（observables）：\n\
    \n```javascript\nthis.route.data.subscribe(data => {\n  const user: User Resolver\
    \ = data[‘user’]\n  this.method(user.User)\n})\n```\n\n这在整个页面加载时按需加载变化的数据方面提供了得更好的体验，且不会出现部分页面加载的情况。此外，如果在运行时发生错误，解析器将帮助你在重定向到下一个视图之前解决错误。因此，在错误处理中这也有用。\n\
    \n## 总结\n\n在本章之初，解析器的用法听起来非常模糊。在本章结束时，我们学习了解析器如何帮助我们完整加载页面，而不会面临某些数据的响应延迟，而且还能帮助我们执行错误处理；例如，当传递错误的\
    \ URL 时。我们还学习了通过快照和观察流使用解析器服务的方法。\n\n在下一章中，我们将学习路由中最常用且讨论最多的话题，即组件的懒加载，让 Angular\
    \ 中的路由变得更加高效。\n\n# 第 11 章\n\n## 懒加载\n\n在本章中，我们将深入研究路由概念，并尝试通过提高性能和启动应用使我们的应用程序更高效，以及组件如何在应用程序内部加载。\n\
    \n当用户启动应用程序时，请求会发送到应用程序服务器以加载所需的文件。用户发送请求与用户实际接收数据之间的时间应该尽可能短。为了做到这一点，我们使用了异步路由，也称为\
    \ `懒加载（lazy loading）`。\n\n在本章中，我们将学习文件和路由的懒加载。在本章中，我们将涵盖以下主题：\n\n*   什么是懒加载？\n\
    *   CanLoad 卫\n*   预加载策略（Preloading strategy）\n*   自定义策略\n\n## 什么是懒加载？\n\n处理懒加载时的第一步是查看\
    \ Angular 如何构建我们应用程序所需的所有文件。\n\n为了做到这一点，让我们进入项目并在命令行中运行 `npm start` 来查看它构建的所有文件：\n\
    \n```bash\nnpm start\n```\n\n这是所用命令的输出内容所示：\n\n![](img/p094-001.jpg)\n\n图 11.1\n\
    \n现在让我们仔细观察已构建的文件，并尝试理解它们的用途。\n\n`main.js` 文件包含了我们应用程序中的所有代码，`polyfills.js` 文件加载所有\
    \ `polyfill` 脚本以确保它能兼容所有现代浏览器。`runtime.js` 加载所有其他文件。`styles.js` 文件顾其名加载样式，`vendor.js`\
    \ 文件加载所有导入的库。\n\n此外，让我们看看这些文件不同的大小，我们将其与生产环境生成的文件进行比较。\n\n现在让我们使用以下命令在生产模式下运行应用程序：\n\
    \n```bash\nng serve -o –prod\n```\n\n让我们查看以下截图：\n\n![](img/p094-002.jpg)\n\n图\
    \ 11.2\n\n现在看看生成的这些，它们的数量更少，大小也很小。`main.js` 文件包含了我们应用程序中的所有代码...（为了简洁省略）... `Ahead-of-Time`\
    \ 编译 (`AOT`）加载 HTML 和 TypeScript 代码。因此，懒加载的主要目的是减少体积最大的文件，即 `main.js`。我们通过懒加载所需的文件来实现这一点。其工作原理如下：\n\
    \n![](img/p095-001.jpg)\n\n图 11.3\n\n然而，在 Angular 中懒加载路由时，情况有点不同：\n\n![](img/p096-001.jpg)\n\
    \n图 11.4\n\n## 使用懒加载\n\n在处理懒加载路由之前，这里这里一些重要点：\n\n*   懒加载作用于功能模块，因为它适用于应用程序的特定功能，该功能应该定义在自己的模块中。\n\
    *   由于懒加载配置在父路由上，我们需要确保路由是作为父路由的子路由配置的。\n*   功能模块不应在任何其他模块中引用，否则 Angular 将下载并编译该功能模块。这无法解决我们懒加载文件的目的。\n\
    \n为了启动懒加载按需异步加载功能模块，我们需要进入路由配置并使用 `loadChildren` 属性。让我们看看属性的作用：\n\n```javascript\n\
    {path: ‘user’, loadChildren: ‘./users/user.module#UserModule'},\n```\n\n`loadChildren`\
    \ 属性与我们在子路由看到的 `children` 属性无关。该属性专门用于懒加载功能模块。\n\n现在当路由被激活时，`loadChildren` 属性将被激活并加载请求的模块。随后它将加载请求的组件并显示该组件的模板。\n\
    \n"
- fmt: "\n```typescript\nimport { NotFoundComponent } from './not-found/not-found.component';\n\
    import { LoginComponent } from './login/login.component';\nimport { CartComponent\
    \ } from './cart/cart.component';\n\nconst routes: Routes = [\n  {path: 'home',\
    \ component: HomeComponent},\n  {path: 'user', loadChildren: './user/user.module#UserModule'},\n\
    \  {path: 'next', children:[\n    {path: '', component: NextComponent},\n    {path:\
    \ 'login', component: LoginComponent}\n  ]},\n  {path: 'third', component: ThirdComponent},\n\
    \  { path: 'login', component: LoginComponent },\n  { path: 'Cart', component:\
    \ CartComponent },\n  {path: '', redirectTo: 'home', pathMatch: 'full'},\n  {path:\
    \ '**', component: NotFoundComponent}\n];\n\n@NgModule({\n  imports: [RouterModule.forRoot(routes)],\n\
    \  exports: [RouterModule]\n})\nexport class AppRoutingModule { }\n```\n\nDo not\
    \ forget to remove the configuration of this route from the feature module. Once\
    \ we have configured this property, we need to go to the console to see which\
    \ files are generated.\n\nWe will see an extra bundle file generated.\n\nNow,\
    \ if you go the network tab in the console to see the files generated on routing\
    \ to the `UserModule` module, you will see one extra file created with some numeric\
    \ value which might look something like this:\n\n![](images/p098-001.jpg)\nFig\
    \ 11.5\n\nThis is how lazy loading gets implemented using the `loadChildren` feature\
    \ in the route configuration for the specific feature module. This creates another\
    \ bundle file only when that route is navigated to and the data is requested.\n\
    \nWe now go to see the use of `CanLoad` guard in the lazy loading of routes.\n\
    \nWe have seen how to use guards like `canActivate`, `canDeactivate`, etc. to\
    \ authorize and monitor our application routes. However, when lazy loading the\
    \ data, we can use the `canLoad` guard. Let us see how it works.\n\n## canLoad\
    \ guard\n\nSo, the first thing about the `canLoad` guard is its meaning is clear\
    \ from its name itself. This guard apparently tells to load a particular module\
    \ only if it can be loaded. This means that we need to check the criteria before\
    \ loading the module; otherwise, there is no need to even load this module if\
    \ the requirements are not met. This secures our application from the users who\
    \ do not have the access to view a particular component template.\n\nSo if we\
    \ do not want the module to be loaded, we use `canLoad` guard, authorize the user,\
    \ if successful, and then move to load the module. Let us take a look at the diagrammatic\
    \ representation of the scenario we just discussed:\n\n![](images/p099-001.jpg)\n\
    Fig 11.6\n\nTo create this guard, as we have seen earlier, we will import it inside\
    \ a service:\n\n```typescript\nimport {CanLoad} from '@angular/router';\n```\n\
    \nThis `canLoad` guard also has a route property:\n\n```typescript\ncanLoad(route:\
    \ Route): boolean {\n  return this.method(route.path);\n}\n```\n\nPut this guard\
    \ inside the route configuration now:\n\n```typescript\n{ path: 'user',\n  canLoad:\
    \ [AuthGuard],\n  loadChildren: './user/user.module#UserModule'}\n}\n```\n\nNow,\
    \ after loading the page, it redirects you to the guard and if you see the files\
    \ loaded inside the network tab of the console, you will notice that the module\
    \ has not been loaded as yet. It will load only once the authorization of the\
    \ user is complete. This scenario will appear like this:\n\n![](images/p100-001.jpg)\n\
    Fig 11.7\n\nNow, if we cancel the authorization, the file will not need to load,\
    \ and if the authorization is complete, then it will load the bundle file.\n\n\
    ## PreLoading modules\n\nSo, we have seen that when the user navigates from the\
    \ root component template to the feature module, it has this waiting time to load\
    \ this bundle file for this specific feature module and then the feature module\
    \ template appears. However, when we are making everything perform efficiently,\
    \ why not this?\n\nSo, instead of waiting for the router to load the feature module\
    \ after the user requests for it, we can actually preload the data required in\
    \ the backend and serve it as and when the user requests for it. This is what\
    \ preloading means. Preloading is useful for loading those modules for which we\
    \ know that at some point in time, we would definitely need to load the data for\
    \ this module, and it is not based on the authorization of the user to access\
    \ it or not.\n\nThis is also known as `eager lazy loading` and the name now describes\
    \ why it is called so by itself.\n\nTo preload the data, the router provides us\
    \ with the following three preloading techniques:\n\n*   No preloading: This is\
    \ something we have been using by default because we were not pre-loading the\
    \ data at all and loading it only after the user requests for it.\n*   Full pre-loading:\
    \ In full pre-loading, we load all the lazy loaded modules before hand and serve\
    \ them whenever they are requested for without having the waiting time.\n\nTo\
    \ use full preloading, we use the preload key-value pair as the second argument\
    \ to the `forRoot`/`forChild` array:\n\n```typescript\n{preloadingStrategy: PreloadAllModules}\n\
    ```\n\nIn the code, it looks like this:\n\n```typescript\nRouterModule.forRoot([\n\
    \  {path: 'home', component: HomeComponent},\n  {path: 'user', loadChildren: './user/user.module#UserModule'},\n\
    \  {path: 'next', children:[\n    {path: '', component: NextComponent},\n    {path:\
    \ 'login', component: LoginComponent}\n  ]},\n  {path: 'third', component: ThirdComponent},\n\
    \  {path: 'login', component: LoginComponent },\n  { path: 'Cart', component:\
    \ CartComponent },\n  {path: '', redirectTo: 'home', pathMatch: 'full'},\n  {path:\
    \ '**', component: NotFoundComponent}\n], {preloadingStrategy: PreloadAllModules})\n\
    ```\n\nThis is how the scenario of preloading all lazy loaded modules looks like:\n\
    \n![](images/p102-001.jpg)\nFig 11.8 (corrected from context)\n\nThe two things\
    \ we need to make sure of while implementing preloading are as follows:\n\nImport\
    \ `PreloadAllModules` inside the router.\n\nAlso, remember that the `canLoad`\
    \ guard always blocks preloading, so if `canLoad` guard is executed, preloading\
    \ will not work. However, if we want preloading to work but at the same time we\
    \ want to secure access of the route, we can replace the `canLoad` guard with\
    \ the `canActivate` guard, and then it works perfectly.\n\n## Custom preloading\
    \ modules\n\nWhen we want to preload only some of the lazy loaded modules, we\
    \ use custom preloading. We can preload some of the commonly used lazy loaded\
    \ modules but not some other lazy loaded modules at all.\n\nBuilding a custom\
    \ preload strategy works similar to a guard. We create a service and set the preloading\
    \ strategy option inside it.\n\nTo build this service, use the following code:\n\
    \n```typescript\nimport { Injectable } from '@angular/core';\nimport {PreloadingStrategy}\
    \ from '@angular/router';\nimport {Observable} from '@angular/router';\n\n@Injectable({\n\
    \  providedIn: 'root'\n})\nexport class CustomStrategy implements PreloadingStrategy{\n\
    \  preload(route: Route, load: Function): Observable<any>{\n  }\n}\n```\n\nThe\
    \ `route` property references to the route to be navigated to and the `load` function\
    \ loads the custom preloading strategy. The `preload` method then finally implements\
    \ the logic as to when to preload the lazy loaded modules.\n\nThen, it is set\
    \ as the second parameter to the route configuration:\n\n```typescript\n{preloadingStrategy:\
    \ CustomStrategy}\n```\n\nTo define the load function, we can use the `data` property\
    \ of the route configurations that we discussed in the previous chapters. Let\
    \ us take a look at the following code:\n\n```typescript\npreload(route: Route,\
    \ load: Function): Observable<any>{\n  if(route.data && route.data['preload']){\n\
    \    return load();\n  }\n  return of(null);\n}\n```\n\nAlso, make sure that you\
    \ define this data property in the route configuration as true:\n\n```typescript\n\
    {path: 'user',\n  canActivate: [AuthGuard],\n  data: {preload: true},\n  loadChildren:\
    \ './user/user.module#UserModule'}}\n```\n\nWith the data property configured,\
    \ the lazy loaded module will work as per the function `load` and load only the\
    \ required lazy loaded modules as per the custom strategy service.\n"
  raw: '`import { NotFoundComponent } from ‘./not-found/not-found.component’;`


    `import { LoginComponent } from ‘./login/login.component’;`


    `import { CartComponent } from ‘./cart/cart.component’;`


    `const routes: Routes = [`


    `{path: ‘home’, component: HomeComponent},`


    `{path: ‘user’, loadChildren: ‘./user/user.module#UserModule’},`


    `{path: ‘next’, children:[`


    `{path: ‘’, component: NextComponent},`


    `{path: ‘login’, component: LoginComponent}`


    `]},`


    `{path: ‘third’, component: ThirdComponent},`


    `{ path: ‘login’, component: LoginComponent },`


    `{ path: ‘Cart’, component: CartComponent },`


    `{path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},`


    `{path: ‘**’, component: NotFoundComponent}`


    `];`


    `@NgModule({`


    `imports: [RouterModule.forRoot(routes)],`


    `exports: [RouterModule]`


    `})`


    `export class AppRoutingModule { }`


    Do not forget to remove the configuration of this route from the feature module.
    Once we have configured this property, we need to go to the console to see which
    files are generated.


    We will see an extra bundle file generated.


    Now, if you go the network tab in the console to see the files generated on routing
    to the `UserModule` module, you will see one extra file created with some numeric
    value which might look something like this:


    ![](images/p098-001.jpg)


    Fig 11.5


    This is how lazy loading gets implemented using the `loadChildren` feature in
    the route configuration for the specific feature module. This creates another
    bundle file only when that route is navigated to and the data is requested.


    We now go to see the use of `CanLoad` guard in the lazy loading of routes.


    We have seen how to use guards like `canActivate`, `canDeactivate,` etc. to authorize
    and monitor our application routes. However, when lazy loading the data, we can
    use the `canLoad` guard. Let us see how it works.


    ## [canLoad guard](#toc.xhtml_ch61)


    So, the first thing about the `canLoad` guard is its meaning is clear from its
    name itself. This guard apparently tells to load a particular module only if it
    can be loaded. This means that we need to check the criteria before loading the
    module; otherwise, there is no need to even load this module if the requirements
    are not met. This secures our application from the users who do not have the access
    to view a particular component template.


    So if we do not want the module to be loaded, we use `canLoad` guard, authorize
    the user, if successful, and then move to load the module. Let us take a look
    at the diagrammatic representation of the scenario we just discussed:


    ![](images/p099-001.jpg)


    Fig 11.6


    To create this guard, as we have seen earlier, we will import it inside a service:


    `import {CanLoad} from ‘@angular/router’;`


    This `canLoad` guard also has a route property:


    `canLoad(route: Route): boolean {`


    `return this.method(route.path);`


    `}`


    Put this guard inside the route configuration now:


    `{ path: ‘user’,`


    `canLoad: [AuthGuard],`


    `loadChildren: ‘./user/user.module#UserModule’}`


    `}`


    Now, after loading the page, it redirects you to the guard and if you see the
    files loaded inside the network tab of the console, you will notice that the module
    has not been loaded as yet. It will load only once the authorization of the user
    is complete. This scenario will appear like this:


    ![](images/p100-001.jpg)


    Fig 11.7


    Now, if we cancel the authorization, the file will not need to load, and if the
    authorization is complete, then it will load the bundle file.


    ## [PreLoading modules](#toc.xhtml_ch62)


    So, we have seen that when the user navigates from the root component template
    to the feature module, it has this waiting time to load this bundle file for this
    specific feature module and then the feature module template appears. However,
    when we are making everything perform efficiently, why not this?


    So, instead of waiting for the router to load the feature module after the user
    requests for it, we can actually preload the data required in the backend and
    serve it as and when the user requests for it. This is what preloading means.
    Preloading is useful for loading those modules for which we know that at some
    point in time, we would definitely need to load the data for this module, and
    it is not based on the authorization of the user to access it or not.


    This is also known as **`eager lazy loading`** and the name now describes why
    it is called so by itself.


    To preload the data, the router provides us with the following three preloading
    techniques:


    *   No preloading: This is something we have been using by default because we
    were not pre-loading the data at all and loading it only after the user requests
    for it.


    *   Full pre-loading: In full pre-loading, we load all the lazy loaded modules
    before hand and serve them whenever they are requested for without having the
    waiting time.


    To use full preloading, we use the preload key-value pair as the second argument
    to the `forRoot`/`forChild` array:


    `{preloadingStrategy: PreloadAllModules}`


    In the code, it looks like this:


    `RouterModule.forRoot([`


    `{path: ‘home’, component: HomeComponent},`


    `{path: ‘user’, loadChildren: ‘./user/user.module#UserModule’},`


    `{path: ‘next’, children:[`


    `  {path: ‘’, component: NextComponent},`


    `  {path: ‘login’, component: LoginComponent}`


    `]},`


    `{path: ‘third’, component: ThirdComponent},`


    `{ path: ‘login’, component: LoginComponent },`


    `{ path: ‘Cart’, component: CartComponent },`


    `{path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},`


    `{path: ‘**’, component: NotFoundComponent}`


    `], {preloadingStrategy: PreloadAllModules})`


    This is how the scenario of preloading all the lazy loaded modules looks like:


    ![](images/p102-001.jpg)


    Fig 11.8


    The two things we need to make sure of while implementing preloading are as follows:


    Import `PreloadAllModules` inside Angular or the router.


    Also, remember that the `canLoad` guards always blocks preloading, so if the `canLoad`
    guard is executed, preloading will not work. However, if we want preloading to
    work but at the same time, we want to secure access of the users to the route,
    we can replace the `canLoad` guard with the `canActivate` guard, and then it works
    perfectly fine.


    ## [Custom preloading modules](#toc.xhtml_ch63)


    When we want to preload only some of the lazy loaded modules, we use custom preloading.
    We can preload some of the most commonly used lazy loaded modules but do not preload
    some other lazy loaded modules at all.


    Building a custom preload strategy works similar to a guard. We create a service
    and set the preloading strategy routing option inside it.


    To build this service, use the following code:


    `import { Injectable } from ‘@angular/core’;`


    `import {PreloadingStrategy} from ‘@angular/router’;`


    `import {Observable} from ‘@angular/router’;`


    `@Injectable({`


    `providedIn: ‘root’`


    `})`


    `export class CustomStrategy implements PreloadingStrategy{`


    `  preload(route: Route, load: Function): Observable<any>{`


    `}`


    `}`


    The route property references to the route to be navigated to and the `load` function
    loads the custom preloading strategy. The preload method then finally implements
    the logic as to when to preload the lazy loaded modules.


    Then, it is set as the second parameter to the route configuration:


    `{preloadingStrategy: CustomStrategy}`


    To define the load function, we can use the data property of the route configurations
    that we discussed in the previous chapters. Let us take a look at the following
    code:


    `preload(route: Route, load: Function): Observable<any>{`


    `if(route.data && route.data[‘preload’]){`


    `  return load();`


    `}`


    `return of(null);`


    `}`


    Also, make sure that you define this data property in the route configuration
    as true:


    `  {path: ‘user’,`


    `canActivate [AuthGuard],`


    `data: {preload: true},`


    `loadChildren: ‘./user/user.module#UserModule’},`


    With the data property configured, the lazy loaded module will work as per the
    function load and load only the required lazy loaded modules as per the custom
    strategy service.'
