  trans: "\n在 Angular 路由中，用户通过路由从一个视图导航到其他视图。这些路由路径在路由模块（routing modules）中配置，使用户可以根据代码逻辑从一个路由访问另一个路由。然而，在实际场景中，我们有许多需求，不希望一个用户能够访问应用程序内部所有可能的路由路径。本章开头提到了其中一个例子。让我们再来看一个例子。\n\
    \n假设用户正在填写一份复杂的申请表单，在过程中他想检查有关表单的某些细节，因此想返回该表单的介绍信息；但是，如果他这样做，他将丢失已经在表单中输入的详细信息。在这种情况下，应用程序需要设置一个守卫（guard），告知想要返回的用户：如果你导航回另一个视图，你将丢失在此页面上输入的所有信息。“你确定要离开此页面吗？”这听起来非常熟悉！不是吗？\n\
    \n这是理解路由守卫（route guards）用例的一个很好的例子。路由守卫不仅帮助我们保护应用程序，对于监控、授权或防止用户离开路由也很有用：\n\n\
    ![](img/p070-001.jpg)\nFig 8.1\n\n正如所述，从 `Route 1` 到 `Route 2` 的导航不会在没有任何检查标准的情况下发生。它会通过一个路由守卫，然后导航到下一个路由。只有当满足路由守卫条件时，才会发生：\n\
    \n![](img/p071-001.jpg)\nFig 8.2\n\nAngular 提供的不同路由守卫都用于多种目的，如监控、安全等。让我们来看其中一些：\n\
    \n*   `canActivate`\n*   `canActivateChild`\n*   `canDeactivate`\n*   `canLoad`\n\
    *   `resolve`\n\n`canActivate` 路由守卫用于保护到某个路由的导航，而 `canActivateChild` 路由守卫将保护从一个路由到子路由的导航。另一方面，`canDeactivate`\
    \ 路由守卫将保护离开路由的导航，防止用户离开路由。这三个是最常用的常用的路由守卫。然而，还有两种用于路由目的的路由守卫。\n\n`canLoad` 守卫用于用户想要懒加载（lazy\
    \ load）路由的场景。这意味着该守卫在防止异步路由时非常有用，并被用于懒加载技术中。在使用懒加载加载模块时，该守卫取代了 `canActivate` 守卫，并且在守卫允许访问时才会实际加载下一个模块。\n\
    \n`resolve` 路由守卫是另一种类型的守卫，正如名称所示，它用于在视图中出现任何内容之前解析某些内容。我们将在接下来的章节中学习路由解析器（route\
    \ resolvers）。当用户在实际加载下一个路由组件模板视图之前预取某些数据时，就会使用 `resolve` 路由守卫。\n\n现在让我们来看这些路由守卫在\
    \ Angular 中的执行顺序。按特定顺序实现这些路由守卫非常重要，因为在每一步中，用户必须能够通过安全且受监控的路由活动访问路由。\n\n执行顺序如下：\n\
    \n![](img/p072-001.jpg)\nFig 8.3\n\n让我们看看为什么。第一个激活的路由守卫是 `canDeactivate` 路由守卫。它将决定用户是否能够离开当前路由。下一个激活的路由守卫是\
    \ `canLoad` 路由守卫。该守卫检查某些功能模块是否已异步加载。然后是第三种路由守卫，它在导航到任何子路由时进行检查，接着是 `canActivate`\
    \ 路由守卫，路由器会在用户尝试导航到任何路由时对其进行检查。最后，路由器使用 `resolve` 路由守卫，这非常有意义，因为路由器希望只有在检查了所有其他路由守卫后，才加载任何特定视图上的所有数据。如果用户没有通过其他路由，加载数据就没有意义。\n\
    \n## 创建路由守卫\n\n路由守卫是在 Angular 应用程序中作为服务（service）创建的。这意味着新服务将作为一个类导出，并由 `Injectable`\
    \ 装饰器进行装饰。由于此服务需要像守卫一样工作，我们需要为它实现此接口以便作为特定的守卫运行。此外，此接口必须从相应的路由器包导入。我们也可以使用 CLI\
    \ 通过以下命令创建守卫：\n\n`ng generate guard <guard-name> or ng g g <guard-name>`\n\n```typescript\n\
    //创建路由守卫的服务\nexport {Injectable} from ‘angular/core’;\nexport {CanActivate} from\
    \ ‘angular/router’;\n@Injectable({\n  providedIn: ‘root’;\n})\nexport class guardService\
    \ implements CanActivate{\n  canActivate(){\n    …\n  }\n}\n```\n\n在实现接口后（在本例中\
    \ `CanActivate`），我们需要确保实现与接口关联的方法。\n\n现在，下一步是将守卫添加到特定路由中：\n\n`{path: ‘user’, Component:\
    \ UserComponent, canActivate: [ guardService ] }`\n\n我们还可以共享守卫，这意味着一个守卫可以应用于多个子路由或父路由，以便其所有子路由都能使用此路由。\n\
    \n## canActivate 守卫\n\n`CanActivate` 路由守卫用于路由必须激活的场景。该守卫主要用于检查用户是否已经登录。它还用于提供某些敏感数据的访问。\n\
    \n现在让我们在应用程序中创建一个。当我们使用 CLI 创建路由守卫时，CLI 会默认实现 `canActivate` 守卫，并在其中实现所需的方法。\n\n\
    这是你从 CLI 创建的路由守卫的样子：\n\n![](img/p074-001.jpg)\nFig 8.4\n\n代码中看起来如下：\n\n![](img/p074-002.jpg)\n\
    Fig 8.5\n\n在 `canActivate` 方法中，你可以实现现在用户继续之前检查所需信息的功能。你可以将 `canActivate` 守卫应用于任何需要它的路由路径上：\n\
    \n![](img/p075-001.jpg)\nFig 8.6\n\n## canActivateChild 守卫\n\n`canActivateChild`\
    \ 守卫类似于 `canActivate` 守卫。当任何路由的子被激活时，就会调用此路由守卫。它在激活子路由之前检查所有所需信息。`canActivateChild`\
    \ 守卫的常见用法与 `canActivate` 路由守卫相似。它还在激活子路由之前检查用户是否登录或注册。它还限制了这些子路由的访问。\n\n然而，如果子路由发生了变化，`canActivate`\
    \ 守卫不会再次执行。\n\n`canActivateChild` 守卫的工作原理与 `canActivate` 路由守卫相同。\n\n## canDeactivate\
    \ 守卫\n\n正如我们之前看到的，`canDeactivate` 守卫用于用户离开路由路径。该守卫用于用户正在填写表单且处于处理过程中、尚未保存更改的场景。它还用于在离开之前进行确认，以确保没有无小心点击返回按钮。\n\
    \n每当路由从一个路径变为另一个路径时，此守卫都会被调用。非常重要的注意的是，如果用户打开另一个网站或关闭浏览器，此守卫将无法作用。\n\n## 创建 Deactivate\
    \ 路由\n\n"
