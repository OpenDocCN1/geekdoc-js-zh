    components that are not related to each other. We also saw how to create new components,
    directives, modules, and services using the Angular **command line interface**
    (**CLI**). A small introduction to Angular routing was also covered to get an
    idea of what Angular routing really means.


    In the next chapter, we will learn about routing and its importance at a broader
    level.


    # [CHAPTER 2](#toc.xhtml_cn2)


    # [Introduction to Routing](#toc.xhtml_cn2)


    With an idea of how the structure of files is in Angular applications, we can
    move ahead to learn about routing in Angular applications. In this chapter, you
    will learn about routing in detail, how it helps build **single-page applications**
    (**SPAs**), and what is the significance of routing in Angular applications. By
    the end of this chapter, you should be able to answer all the why’s you have regarding
    the use of routing in the web applications built using the Angular framework.


    In this chapter, we will cover the following topics:


    *   Defining routing


    *   Routing and SPAs


    ## [Defining routing](#toc.xhtml_ch9)


    As discussed in the introduction chapter, we do have an idea by now about what
    routing helps us to do in an Angular application. When you need to change the
    template view from one to another, the browser URL gets changed and you will see
    a different view from the earlier one. The working of routing in Angular is based
    on the Angular router.


    ## [What is an Angular router?](#toc.xhtml_ch10)


    The Angular router is the official library with JavaScript implementation for
    routing in the Angular-based web applications. It comes as a part of Angular core
    packaged as `@angular/router.`


    The Angular router is the one behind all the functionalities that we perform in
    routing from one view to another in an Angular application. It activates all the
    components associated with a particular route configuration. It not only helps
    to view another component from one component without reloading the page, but also
    helps us redirect the URL to the desired component.


    In the upcoming chapters, we will learn about routes resolvers, route guards,
    lazy loading the modules; all these functionalities are used as part of the `@angular/router`
    package.


    Let us take a look at the working of an Angular router.


    The very first and foremost task of an Angular router is to navigate to the configured
    routes for the components which are routable. So, the routes components are configured
    as the route configurations and these configurations are known as **router states**.
    Once these states are configured, the Angular router will render this set of components
    and bring the change in the browser URL. This will also require the router outlet
    to be present on the template as a placeholder for placing the template view on
    that page.


    And this is why the first step when working with Angular routing is to import
    `RouterModule` inside your application. The next step is to configure the router
    states which form a tree of the router states. To do this, the routes are configured
    inside the `routermodule.forRoot() method.`


    In the next chapter of setting up a routing application, you will see the different
    ways of using `routermodule.forRoot().`


    At a given point in time, there is going to be one route which will be running
    and that is called the active route.


    Whenever the routed path changes, it brings a change in the URL of the browser
    and the activated route also changes. In the upcoming chapters, you will also
    see how the order of paths in the route configuration or you can say route state
    tree, matters a lot. It follows the depth-first search algorithm and matches the
    first route path with the entire URL.


    Once the configurations of the routes are covered, we can see how the Angular
    router navigates from one route to another. To understand this better, let us
    understand the router lifecycle first:


    *   Apply the redirects


    *   Match the router state URL


    *   Activate the guards


    *   Activate the resolvers


    *   Activate the final view on the template using router outlet


    The following diagram shows the lifecycle of a router:


    ![](images/p019-001.jpg)


    Fig 2.1


    The router has a lot of events that take place during this whole process. The
    router events can be listened to using the router service with the help of an
    observable. Some of the router events are as follows:


    *   NavigationStart: When the navigation cycle of the router starts successfully.


    *   NavigationEnd: When the navigation cycle of the router ends successfully.


    *   NavigationCancel: This event is triggered when the navigation is canceled.


    *   NavigationError: When the navigation fails due to some unex-pected error,
    this event is triggered.


    *   ResolveStart: This event is triggered when it is in the resolve phase of routing.


    *   ResolveEnd: This represents the end phase of routing.


    *   RouteConfigLoadEnd: When any of the lazy loaded route is loaded, this event
    is triggered to show that some route has been lazy loaded.


    *   RouteConfigLoadStart: This is triggered before lazy loading a route.


    *   GuardsCheckStart: This is triggered when the Guard phase of routing starts.


    *   GuardsCheckEnd: This is triggered when the Guard phase of routing ends.


    *   RoutesRecognized: As the name suggests, when the routes are recognized, this
    event is triggered.


    *   ChildActivationStart: When the resolve phase of routing ends, this event is
    triggered to show the start of the end of this resolve phase.


    *   ChildActivationEnd: When the resolve phase of routing ends, this event is
    triggered to show the start of the end of this resolve phase.


    *   ActivationStart: When the resolve phase of routing ends, this event is triggered
    to show the start of the end of this resolve phase.


    *   ActivationEnd: When the resolve phase of routing ends, this event is triggered
    to show the start of the end of this resolve phase.


    *   Scroll: This represents a scrolling event.


    These events tell the state of the Angular router; for example, `NavigationStart`
    denotes the start of the navigation cycle successfully, `NavigationEnd` denotes
    the end of the navigation cycle, `NavigationCancel` is used when the guard does
    not allow the user the access to navigate to a route.


    We can see a series of events from the browser by setting the `enableTracing`
    option to be true for the `RouterModule` object’s `forRoot`() method or by injecting
    the router service and subscribing to the events observable:


    `constructor(private router: Router) {`


    `this.router.events.subscribe( (event: RouterEvent) => console.log(event))`


    `}`


    Therefore, the Angular router makes it easy to configure the route configurations,
    that is, router states, and also helps to navigate to one route path to another
    with so many different router events running in the background which definitely
    can be looked at.'
