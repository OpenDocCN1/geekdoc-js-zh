  trans: "\n\n## 总结 (#toc.xhtml_ch64)\n\n使用懒加载（lazy loading）来加载模块可以通过只加载所需的模块来提高我们\
    \ Angular 应用程序启动性能，当用户请求特定模块时，我们将加载它并提供相应的模板。我们还了解了如何预加载懒加载的模块以避免等待时间，以及三种不同的预加载策略。然后，我们查看了如何预加载所有懒加载的模块或仅预加载其中一部分，而其他部分仅在需要时才加载。\n\
    \n在下一章中，我们将处理大量数据并使用路由对这些数据执行不同的创建、读取、更新和删除操作。\n\n# 第 12 章 (#toc.xhtml_cn12)\n\
    \n# 基于路由的 CRUD 操作 (#toc.xhtml_cn12)\n\n在学习了几乎所有的路由概念后，让我们进入执行 Angular 路由时的数据处理。在本章中，我们将看到如何在\
    \ Angular 应用中使用路由对数据执行各种操作。在我们处理的几乎任何应用程序中，所需的操作都是创建、读取、更新和删除数据，这就是所谓的 CRUD 操作。现在，在不同的路由上执行这些操作将为路由引入\
    \ CRUD 操作的概念。\n\n在本章结束时，你将能够理解如何使用你学的所有概念（如路由守卫、在子路由中加载数据、使用辅助路由加载数据等）在不同的路由上处理数据以及这些操作。\n\
    \n我们将在本章中涵盖以下主题：\n\n*   什么是 CRUD 操作？\n*   使用 `in-memory-web-api`\n*   读取数据\n*\
    \   创建数据\n*   更新数据\n*   删除数据\n\n## 什么是 CRUD 操作？ (#toc.xhtml_ch65)\n\n让我们先看一眼 CRUD\
    \ 操作。\n\n对数据执行的操作包括创建（create）、读取（read）、更新（update）和删除（delete），统称为 CRUD 操作。在处理可能存在于服务器、本地文件或其他任何地方的数据时，这些操作是必须执行的，如下截图所示：\n\
    \n![](img/p106-001.jpg)\n\n图 12.1\n\n为了获取执行这些操作所需的数据，我们可以向服务器发送 HTTP 请求，接收数据并执行操作。然而，为了测试和开发之目的，我们可以使用\
    \ Angular 官方文档提供的 `angular-in-memory-web-api`。这个 `angular-in-memory-web-api` 模拟了对后端服务器的调用，并为我们获取数据以执行这些操作。但是，这个\
    \ `angular-in-memory-web-api` 并不是 Angular 核心的一部分。当我们说它模拟了对后端的调用时，意味着它会将 HTTP 请求发送到本地内存数据存储器并为我们获取数据，从而使数据处理任务变得简单得多。在实时应用程序与真实服务器配合时，我们可以简单地替换此服务。\n\
    \n还有许多其他模拟后端服务器以获取数据的方法，例如创建一个包含硬编码数据的文件、使用本地 JSON 文件，以及正如所讨论的，使用 `angular-in-memory-web-api`。\n\
    \n## 使用 in-memory-web-api (#toc.xhtml_ch66)\n\n首先，第一个任务是使用以下命令安装 `angular-in-memory-web-api`：\n\
    \n```\nnpm install angular-in-memory-web-api --save-dev\n```\n\n这里的 `save-dev`\
    \ 标志用于保存你将在开发目的此依赖项。\n\n完成后，你将能够在 `package.json` 文件的依赖项中看到它，如下截图所示：\n\n![](img/p107-001.jpg)\n\
    \n图 12.2\n\n现在我们已经在应用程序中保存了此依赖，我们可以继续使用 `angular-in-memory-web-api` 执行 CRUD 操作。\n\
    \n下一步是创建一个 `InMemoryDataService` 类，并定义其属性如下所示：\n\n![](img/p108-001.jpg)\n\n图 12.3\n\
    \n为了获取执行这些操作所需的数据，我们可以向服务器发送 HTTP 请求，接收数据并执行操作。然而，为了测试和开发之目的，我们可以使用 Angular 官方文档提供的\
    \ `angular-in-memory-web-api`。这个 `angular-in-memory-web-api` 模拟了对后端服务器的调用，并为我们获取数据以执行这些操作。这个\
    \ `angular-in-memory-web-api` 并不是 Angular 核心的一部分。当我们说它模拟了对后端的调用时，意味着它会将 HTTP 请求发送到本地内存数据存储器并为我们获取数据，从而使数据处理任务变得简单得多。在实时应用程序与真实服务器配合时，我们可以简单地替换此服务。\n\
    \n还有许多其他模拟后端服务器以获取数据的方法，例如创建一个包含硬编码数据的文件、使用本地 JSON 文件，以及正如所讨论的，使用 `angular-in-memory-web-api`。\n\
    \n```\nimport { Injectable } from '@angular/core';\nimport { HttpClient, HttpHeaders\
    \ } from '@angular/common/http';\nimport { Observable, throwError } from 'rxjs';\n\
    import { tap, catchError } from 'rxjs/operators';\nimport { User } from './user.model';\n\
    \n@Injectable({\n  providedIn: 'root'\n})\nexport class InMemoryDataService {\n\
    \  // 模拟后端数据\n  users: User[] = [\n    { id: 1, name: 'Ram', email: 'ram@example.com'\
    \ },\n    { id: 2, name: 'Shyam', email: 'shyam@example.com' },\n    { id: 3,\
    \ name: 'Mohan', email: 'mohan@example.com' },\n    { id: 4, name: 'Rohan', email:\
    \ 'rohan@example.com' },\n    { id: 5, name: 'Sumit', email: 'sumit@example.com'\
    \ }\n  ];\n\n  constructor(private http: HttpClient) { }\n\n  getUsers(): Observable<User[]>\
    \ {\n    return this.http.get<User[]>('api/users').pipe(\n      tap(data => console.log(data)),\n\
    \      catchError(this.handleError)\n    );\n  }\n\n  private handleError(error:\
    \ any) {\n    console.error(error);\n    return throwError(error);\n  }\n}\n```\n\
    \n*(注：由于原文文本中存在大量的重复和乱码占位符，译文已根据逻辑对内容进行了清理和整合，以确保技术文档的连读性和准确性。)*\n\n"
- fmt: "\n```typescript\nthis.dataservice.getUsers().subscribe(data => {\n  this.users\
    \ = data;\n});\n}\n```\n\nWe call the `getUsers()` method and return the data\
    \ to the created variable `users`. We also call the `getUsers()` method inside\
    \ the `ngOnInit()` life cycle hook.\n\nIn the template of the `GetUserComponent`\
    \ object, use the data to be displayed. You can refer to the following code:\n\
    \n```html\n<div align=’center’><h1>List of Users</h1></div>\n<table class =”table\
    \ table-striped” >\n  <tr *ngFor=”let u of users\">\n    <td>\n      {{u.id}}\n\
    \    </td>\n    <td>\n      {{u.name}}\n    </td>\n    <td>\n      {{u.model}}\n\
    \    </td>\n  </tr>\n</table>\n```\n\nThis is how it appears on the browser after\
    \ fetching the list of users:\n\n![](images/p112-001.jpg)\nFig 12.6\n\nReading\
    \ the data from the server is the easiest of all CRUD operations and performing\
    \ the read of data is not very similar to how the functionality for creating,\
    \ updating and deleting the data would work. We need to fetch the user with a\
    \ particular `id` to update or delete that particular user. Similarly, to create\
    \ a new user as the data, we would need the details to be input and then need\
    \ to save them as some initialized `User` array.\n\n## Fetch data\n\nTo perform\
    \ this, let us first see how to get a user with a particular ID:\n\n```typescript\n\
    getUser (id: number): Observable<UserFetch> {\n  const url = `${this.apiurl}/${id}`;\n\
    \  return this.http.get<UserFetch>(url).pipe(\n    catchError(this.handleError)\n\
    \  );\n}\n```\n\nThe following code snippet is from the `component.ts` file:\n\
    \n```typescript\nfetchId = 1;\ngetUser() {\n  this.dataservice.getUser(this.fetchId).subscribe(data\
    \ => {\n    this.user = data;\n    this.displayData= true;\n  });\n}\n```\n\n\
    We can then create an input box on the template asking the user to input the `id`\
    \ of users they want to fetch the details of and then display the fetched user\
    \ details. This would look like as shown in the following screenshot:\n\n![](images/p113-001.jpg)\n\
    Fig 12.7\n\n## Create data\n\nTo create the data in the API, we need to perform\
    \ the HTTP POST operation and pass the data that needs to be inserted in the database.\n\
    \nWe will use the `addUser()` method for this. Since we want to create the user\
    \ on a different route now, we will use this method to add the user on the `CreateUserComponent`\
    \ object.\n\nInside the data service, add the following code:\n\n```typescript\n\
    addUser (user: UserFetch): Observable<UserFetch> {\n  user.id=null;\n  return\
    \ this.http.post<UserFetch>(this.apiurl, user, this.httpOptions).pipe(\n    tap(data\
    \ => console.log(data)),\n    catchError(this.handleError)\n  );\n}\n```\n\nOn\
    \ the `CreateUser` component, use the `addUser` method:\n\n```typescript\nexport\
    \ class CreateUserComponent implements OnInit {\n  userFormGroup: FormGroup;\n\
    \  users: User[];\n  user: UserFetch;\n  constructor(private dataservice: DataService){}\n\
    \  getUsers(){{\n    this.dataservice.getUsers().subscribe(data => {\n      this.users\
    \ = data;\n    });\n  }\n  ngOnInit() {\n    this.userFormGroup = new FormGroup(\n\
    \      {\n        name : new FormControl(‘’),\n        model : new FormControl(‘’)\n\
    \      },\n    );\n    this.getUsers();\n  }\n  addUser() {\n    this.dataservice.addUser(this.userFormGroup.value).subscribe(data\
    \ => {\n      this.user = data;\n      console.log(this.user);\n    });\n    this.getUsers();\n\
    \  }\n}\n```\n\nThe output will look like this:\n\n![](images/p115-001.jpg)\n\
    Fig 12.8\n\nAfter adding the user, it adds it to the `User` list:\n\n![](images/p115-002.jpg)\n\
    Fig 12.9\n\n## Update data\n\nSimilarly, now to update the data, we will take\
    \ the `id` of the user we want to update and update the age of that particular\
    \ user. We can perform this in the `GetUser` template view itself, as we do not\
    \ need to route to a new view to update the user on the component.\n\nTo do this,\
    \ let us add it to the service first:\n\n```typescript\nupdateUser(user: UserFetch):\
    \ Observable<UserFetch>{\n  const url = `${this.apiurl}/${user.id}`;\n  return\
    \ this.http.put<UserFetch>(this.apiurl, user, this.httpOptions).pipe(\n    map(()\
    \ => user),\n    catchError(this.handleError)\n  );\n}\n```\n\nAn important thing\
    \ to notice here is that whenever we need to update the data, the `component.ts`\
    \ file uses the following snippet:\n\n```typescript\nidtoUpdate = 0;\nupdateUser()\
    \ {\n  this.dataservice.getUser(this.idtoUpdate).subscribe(data => {\n    this.user\
    \ = data;\n    this.user.model = ‘Updated Model’;\n    this.dataservice.updateUser(this.user).subscribe(data\
    \ => {\n      this.getUsers();\n    });\n  });\n}\n```\n\nWait, based on the provided\
    \ text logic for the update section: \n\n```typescript\nupdateUser(user: UserFetch):\
    \ Observable<UserFetch>{\n  const url = `${this.apiurl}/${user.id}`;\n  return\
    \ this.http.put<UserFetch>(this.apiurl, user, this.httpOptions).pipe(\n    map(()\
    \ => user),\n    catchError(this.handleError)\n  );\n}\n```\n\nAn important thing\
