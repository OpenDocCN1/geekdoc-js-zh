    # [CHAPTER 11](#toc.xhtml_cn11)


    # [Lazy Loading](#toc.xhtml_cn11)


    In this chapter, we dive deeper into the routing concepts and try to make our
    application much more effective by improving the performance and the starting
    the application, and how the components get loaded inside the application.


    When the user starts his application, the request goes to the application server
    to load the required files. The time between the request sent by the user and
    the user actually receiving the data should be minimum. To do this, we use asynchronous
    routing which is also known as **`lazy loading`**.


    In this chapter, we will learn the lazy loading of files and routes. In this chapter,
    we will cover the following topics:


    *   What is lazy loading?


    *   CanLoad guard


    *   Preloading strategy


    *   Custom strategy


    ## [What is lazy loading?](#toc.xhtml_ch59)


    The first step to approach when working with lazy loading is looking at how Angular
    builds all the files that we require for the working for our application.


    To do this, let us go inside our project and run `npm start` on the command line
    to see all the files it builds:


    **`npm start`**


    This is what the output of the command used will look like:


    ![](images/p094-001.jpg)


    Fig 11.1


    Now let us take a closer look at the files that have been built and try to understand
    what they are for.


    The `main.js` file contains all the code in our application, the `polyfills.js`
    file loads all the `polyfill` scripts to make sure it can be compatible with all
    the modern browsers. The `runtime.js` loads all the other files. The `styles.js`
    file loads the styles as the name suggests and the `vendor.js` file loads all
    the imported libraries.


    Also, let us take a look at the different sizes of these files which we will compare
    with the production generated files.


    Now, let us run our application in the production mode using the following command:


    **`ng serve -o –prod`**


    Let us take a look at the following screenshot:


    ![](images/p094-002.jpg)


    Fig 11.2


    Look at the generated files now which are less in number and the size too is very
    small. Where did the `vendor.js` bundle go? So, the imported libraries are now
    inside the `main.js` bundle and the compilation process during the build does
    the **`Ahead-of-Time`** compilation (**`AOT`**) which loads the HTML and TypeScript
    code into JS files. This will render the application faster on the browser and
    the compiler does not need to be inside the bundle. The request would not need
    to load all the files from the server now which will improve the startup time
    of our application.


    The main purpose of lazy loading is, therefore, to reduce the size of the only
    large-sized file now, which is `main.js`. We do this by lazy loading the files
    that are required occasionally. Its working is shown in the following screenshot:


    ![](images/p095-001.jpg)


    Fig 11.3


    However, when lazy loading routes in Angular, the situation looks a bit different:


    ![](images/p096-001.jpg)


    Fig 11.4


    Whatever is the size of the applications; it does not make our application heavy
    and loads only what is required currently.


    ## [Working with lazy loading](#toc.xhtml_ch60)


    Here are some of the important things to understand before working with a lazy
    loaded route:


    *   Lazy loading works on a feature module because it applies to a particular
    function of the application which should be defined inside its own specific module.


    *   Since lazy loading is configured on a parent route, we need to make sure that
    the routes are configured inside a parent route configuration as its children.


    *   The feature module should not be referenced in any other module because otherwise
    Angular will download the feature module also and compile it. This will definitely
    not solve our purpose of lazy loading the files.


    To start lazy loading to asynchronously load the feature module for routing whenever
    required, we need to go to the route configuration and use the `loadChildren`
    property. Let us see what this property does:


    `{path: ‘user’, loadChildren: ‘./users/user.module#UserModule’},`


    The `loadChildren` property is not something that is related to the children property
    that we saw in child routes. This property is only used for lazy loading the feature
    module.


    Let us break down the property’s values. The `loadChildren` property accepts a
    string value which contains the route to the feature module followed by a hash
    symbol and then the name of the feature module.


    Now when the route gets activated, the `loadChildren` property will get activated
    and load the requested module. It will then load the requested component and display
    that component’s template as shown in the following code:


    **`// app-routing.module.ts`**


    `import { NgModule } from ‘@angular/core’;`


    `import { Routes, RouterModule } from ‘@angular/router’;`


    `import { HomeComponent } from ‘./home/home.component’;`


    `import { NextComponent } from ‘./next/next.component’;`


    `import { ThirdComponent } from ‘./third/third.component’;`'
