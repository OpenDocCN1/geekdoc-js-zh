    ## [Summary](#toc.xhtml_ch17)


    In this chapter, you learned the basics of routing from setting up an Angular
    application to using routing to knowing the use of directives to place the view
    on the template. You learned how to import the router statements to start with
    the setup of your application and configured paths to different components. You
    also saw how to activate the routes on the template and finally place the view
