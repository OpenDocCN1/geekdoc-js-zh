  trans: "\n\n```javascript\n{path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},\n\
    {path: ‘’, component: NotFoundComponent}\n];\n```\n\n现在，此路由守卫士（route guard）将应用到无组件路由内部的所有配置路由。同样地，我们可以创建一个解析器（resolver），并将其用于无组件路由内配置的所有路由。我们将在下一章查看路由解析器（Route\
    \ resolvers）是如何工作的。\n\n不仅如此，通过对特定功能的路由进行分组，我们还可以懒加载该功能路由的配置路由。懒加载（Lazy loading）是\
    \ Angular 路由中非常重要的概念，它是路由支柱之一。\n\n## 总结\n\n在本章中，我们涵盖了路由分组和创建无组件路由的概念。我们还看到了无组件路由如何组合其内部的每一个路由并使用公共守卫士和路由解析器。在下一章中，我们将学习路由解析器以及它们在处理任何数据时如何让\
    \ Angular 路由变得更加高效。\n\n# 第 10 章\n\n# 路由解析器 (Route Resolvers)\n\n我们已经接触路由解析器很长时间了。在几乎每个主题中，我们都在某个地方讨论并看到了路由解析器的用法。但你可能会奇怪，为什么我把这个主题放在书的靠后位置。因此，本章将从某种程度上证明它出现在书中这里的合理。\n\
    \n我们现在已经看到了路由的不同用法，例如子路由在某些模板内加载数据、次级路由在更高层级独立加载路由、路由守卫士通过处理安全、监控、授权等重要事项使应用程序变得更高效。现在，在本章中，我们将看到路由——正如本章名称明确指示的那样——将在加载整个模板视图之前加载某些数据。这现在听起来可能有点令人困惑，但本章结束时，你将能够理解为什么这个主题被称为`解析路由（Resolving\
    \ the routes）`。\n\n在本章中，我们将涵盖以下主题：\n\n*   什么是路由解析器？\n*   路由解析器的用法\n*   添加路由解析器\n\
    \n## 什么是路由解析器？\n\n当我们从一个视图导航到另一个视图时，如果第二个视图的模板需要某些数据，我们会面临该视图中数据延迟加载的问题。模板上的静态数据会在用户导航到路由时加载，而通过\
    \ API 从服务器传来的数据在模板视图中显示需要很长时间。这在应用程序中看起来并不很灵敏。任何视图的局部加载完全不具有吸引力。在这种情况下，我们可以在实际路由到视图之前加载数据，这样当我们接收到所有数据（即静态数据以及将从服务器获取的数据）时，我们就可以准备好完整的模板并继续路由到下一个视图。\n\
    \n通过预取（prefetching）数据，我们实际上不需要面对视图中加载了数据的情况。我们还可以在预取时复用数据，并对数据访问服务使用相同的代码。预取还允许你在实际导航到下一个路由之前，解决我们在路由中可能遇到的任何错误。\n\
    \n现在有不同的方法来获取组件视图所需的数据。这些数据可以来自 `angular-in-memory-web-api`、某些服务，或者可能来自某些本地 JSON\
    \ 文件，你也可以使用路由配置的 `data` 属性。路由配置的此 `data` 属性如下：\n\n```javascript\n//路由 Data 属性\n\
    {\n  path: ‘user’,\n  component: UserComponent,\n  data: {dataProp: ‘UserData’}\n\
    }\n```\n\n在代码中，路由如下：\n\n![](img/p086-001.jpg)\n\n图 10.1\n\n在组件内部，如如下代码所示引用此数据属性：\n\
    \n```javascript\nthis.dataProp = this.route.snapshot.data['‘dataProp’];\n```\n\
    \n这是获取数据的一种方法；然而，我们可以从 Angular 服务获取数据，以便在互不相关的组件之间进行通信，或者通过 HTTP 创建到服务器的 API 调用。\n\
    \n在转向路由解析器的用法之前，让我们先了解解析路由的过程是如何工作的。因此，你路由到一个 URL，你期望在模板中有某些数据。然而，该模板的静态元素会出现在视图中，但来自后端的数据会在模板上的静态数据之后一段时间才加载。为了解决这个问题，解析器实际上会在数据加载之前阻止你的视图显示。因此，只有当你的数据到达视图时，组件实际上才会被激活，模板才能完整显示，而不仅仅是静态元素。\n\
    \n但它是如何工作的呢？\n\n因此，通过路由解析器，数据不需要在组件已激活时到达组件。它来到解析器服务，然后解析器准备数据准备就绪并激活组件以显示完全加载的模板视图。如果没有解析器，点击链接/按钮将你引导到视图，加载可用的内容，等待数据从服务器传回，然后在模板上显示剩余的数据。\n\
    \n让我们看看图示中它是什么样的（不带路由解析器）：\n\n![](img/p087-001.jpg)\n\n图 10.2\n\n没有路由解析器，当你点击链接/按钮导航到下一个路由时，流程将进入要显示的组件模板。这会显示模板内任何可用的数据，然后等待来自服务器的数据。在此期间，用户获得一个部分加载的视图。在获取服务器数据后，它会显示在模板上。\n\
    \n让我们看看图示中它是什么样的（带路由解析器）：\n\n![](img/p088-001.jpg)\n\n图 10.3\n\n然而，有了路由解析器，流程将进入服务而不是直接进入组件，并等待来自服务器的数据。一旦获取数据，它就会激活组件并显示完全加载的模板。\n\
    \n## 路由解析器的用法\n\n处理路由解析器的工作包含三个步骤。解析器作为 Angular 服务创建的，因此第一步是为数据构建自定义 Angular 服务。一旦创建了服务，我们在路由配置中添加\
    \ `resolve` 属性并使用它添加解析器以访问数据。路由获取组件所需的数据后，组件从激活的路由读取数据。\n\n在上一章中，我们看到了如何从 `ActivatedRoute`\
    \ 服务读取数据。可以使用快照（snapshot）或观察（observable）。在数据不变化且保持不变的情况下，我们使用快照。如果预期产生的数据会变化，建议使用观察。现在让我们阅读以下代码：\n\
    \n```typescript\n//构建路由解析器服务\nimport { Injectable } from ‘@angular/core’;\nimport\
    \ { Resolve, ActivatedRouteSnapshot, RouterStateSnapshot } from ‘@angular/router’;\n\
    import { Observable } from ‘rxjs’;\nimport {User} from ‘./user-data’;\n\n@Injectable({\n\
    \  providedIn: ‘root’ })\nexport class UserResolver implements Resolve<User> {\n\
    \  resolve(route: ActivatedRouteSnapshot, state: RouterStateSnapshot): Observable<User>{}\n\
    }\n```\n\n`ActivatedRouteSnapshot` 模块提供当前路由的信息，而 `RouterStateSnapshot` 模块告知路由的状态。在调用\
    \ resolve 方法后，路由器调用数据，然后获取组件视图。\n\n在代码内部，它如下截图所示：\n\n![](img/p089-001.jpg)\n\n\
    图 10.4\n\n`resolve` 方法的作用是什么？\n\n它调用 `get` 方法获取数据并将其返回给组件。\n\n在路由配置内部使用 `resolve`\
    \ 属性添加解析器。\n\n## 添加路由解析器\n\n"
- fmt: "\nThe following code snippet is an example of how to add the route resolvers:\n\
    \n```javascript\n{\n  path: ‘user’,\n  component: UserComponent,\n  resolve: {user:\
    \ UserResolver}\n}\n```\n\nThe resolver can be added as a key-value pair using\
    \ the reference to the resolver service. Here in this example, we use the user\
    \ as the key to reference to the `UserResolver` service:\n\n![](images/p090-001.jpg)\n\
    \nFig 10.5\n\nWe can also use multiple resolver services for the component to\
