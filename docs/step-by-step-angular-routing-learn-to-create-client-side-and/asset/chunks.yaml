  trans: "\n\n```typescript\nimport { NotFoundComponent } from './not-found/not-found.component';\n\
    import { LoginComponent } from './login/login.component';\nimport { CartComponent\
    \ } from './cart/cart.component';\n\nconst routes: Routes = [\n  {path: 'home',\
    \ component: HomeComponent},\n  {path: 'user', loadChildren: './user/user.module#UserModule'},\n\
    \  {path: 'next', children:[\n    {path: '', component: NextComponent},\n    {path:\
    \ 'login', component: LoginComponent}\n  ]},\n  {path: 'third', component: ThirdComponent},\n\
    \  { path: 'login', component: LoginComponent },\n  { path: 'Cart', component:\
    \ CartComponent },\n  {path: '', redirectTo: 'home', pathMatch: 'full'},\n  {path:\
    \ '**', component: NotFoundComponent}\n];\n\n@NgModule({\n  imports: [RouterModule.forRoot(routes)],\n\
    \  exports: [RouterModule]\n})\nexport class AppRoutingModule { }\n```\n\n不要忘记从功能模块中移除该路由的配置。一旦我们配置了这个属性，我们需要去控制台查看生成了哪些文件。\n\
    \n我们将看到生成了一个额外的包文件。\n\n现在，如果你在控制台的网络标签页中查看路由到 `UserModule` 模块时生成的文件，你将看到一个带有某些数值的额外文件，它可能像这样：\n\
    \n![](img/p098-001.jpg)\n图 11.5\n\n这就是在特定功能模块的路由配置中使用 `loadChildren` 特性实现懒加载的方式。它只有在导航到该路由并请求数据时，才会创建另一个包文件。\n\
    \n我们现在来看 true 在路由懒加载中使用 `CanLoad` 守卫的情况。\n\n## canLoad 守卫\n\n所以，关于 `canLoad` 守卫的第一点是，它的含义从其名称本身就能看出。这个守卫显然是：只有在可以加载时才加载特定的模块。这意味着我们需要在加载模块之前检查标准；否则，如果不符合要求，甚至不需要加载该模块。这保护了我们的应用程序免受没有权限查看特定组件模板的用户的影响。\n\
    \n因此，如果我们不想让模块加载，我们就使用 `canLoad` 守卫，授权用户，如果成功，则移动到加载模块。让我们来看刚刚讨论的场景的图表示：\n\n![](img/p099-001.jpg)\n\
    图 11.6\n\n为了创建这个守卫，正如我们之前看到的，我们将在服务内部导入它：\n\n```typescript\nimport {CanLoad} from\
    \ '@angular/router';\n```\n\n这个 `canLoad` 守卫还有一个路由属性：\n\n```typescript\ncanLoad(route:\
    \ Route): boolean {\n  return this.method(route.path);\n}\n```\n\n现在将此守卫放入路由配置中：\n\
    \n```typescript\n{ path: 'user',\n  canLoad: [AuthGuard],\n  loadChildren: './user/user.module#UserModule'}\n\
    }\n```\n\n现在，在加载页面后，它会将你重定向到守卫，如果你在控制台的网络标签页中看到加载的文件，你会注意到模块尚未加载。它只会在用户授权完成后才会加载。这种场景看起来像图所示：\n\
    \n![](img/p100-001.jpg)\n图 11.7\n\n现在，如果我们取消授权，文件将不再需要加载；如果授权完成，那么它将加载包文件。\n\n\
    ## 预加载模块 (PreLoading modules)\n\n所以，我们已经看到当用户从根组件模板导航到功能模块时，会有这段等待时间来加载该特定功能模块的包文件，然后显示功能模块模板。然而，当我们让一切高效运行时，为什么不这样做呢？\n\
    \n所以，与其等待路由器在用户请求后才加载功能模块，我们实际上可以在后端预加载所需的数据，并在用户请求时提供。这就是预加载的含义。预加载对于那些我们知道在某个时间点肯定需要加载该模块数据的模块非常有用，而且它不是基于用户是否有权限访问该模块来决定的。\n\
    \n这被称为 `急进懒加载` (eager lazy loading)，这个名字现在本身就解释了为什么被这样命名。\n\n为了预加载数据，路由器为我们提供了以下三种预加载技术：\n\
    \n*   不预加载 (No preloading)：这是我们一直以来默认使用的，因为我们完全没有预加载数据，只在用户请求后才加载。\n*   全预加载 (Full\
    \ pre-loading)：在全预加载中，我们提前加载所有懒加载模块，并在每次被请求时提供它们，而无需等待时间。\n\n要使用全预加载，我们将 `preloadStrategy`\
    \ 键值对作为第二个参数传递给 `forRoot`/`forChild` 数组：\n\n```typescript\n{preloadingStrategy:\
    \ PreloadAllModules}\n```\n\n在代码中，它如下：\n\n```typescript\nRouterModule.forRoot([\n\
    \  {path: 'home', component: HomeComponent},\n  {path: 'user', loadChildren: './user/user.module#UserModule'},\n\
    \  {path: 'next', children:[\n    {path: '', component: NextComponent},\n    {path:\
    \ 'login', component: LoginComponent}\n  ]},\n  {path: 'third', component: ThirdComponent},\n\
    \  {path: 'login', component: LoginComponent },\n  {path: 'Cart', component: CartComponent\
    \ },\n  {path: '', redirectTo: 'home', pathMatch: 'full'},\n  {path: '**', component:\
    \ NotFoundComponent}\n], {preloadingStrategy: PreloadAllModules})\n```\n\n预加载所有懒加载模块的场景如下：\n\
    \n![](img/p102-001.jpg)\n图 11.8（根据上下文）\n\n在实现预加载时，我们需要确保两点如下：\n\n在路由器中导入 `PreloadAllModules`。\n\
    \n此外，请记住 `canLoad` 守卫总是阻止预加载，因此如果执行了 `canLoad` 守卫，预加载将无法工作。然而，如果我们希望预加载工作但同时又想保护路由访问，可以将\
    \ `canLoad` 守卫替换为 `canActivate` 守卫，这样就可以完美运行。\n\n## 自定义预加载模块\n\n当我们只想预加载某些懒加载模块时，我们使用自定义预加载。我们可以预加载某些常用的懒加载模块，但完全不加载其他模块。\n\
    \n构建自定义预加载策略与守卫类似。我们创建一个服务并在内部设置预加载策略。\n\n要构建此服务，使用以下代码：\n\n```typescript\nimport\
    \ { Injectable } from '@angular/core';\nimport {PreloadingStrategy} from '@angular/router';\n\
    import {Observable} from '@angular/router';\n\n@Injectable({\n  providedIn: 'root'\n\
    })\nexport class CustomStrategy implements PreloadingStrategy{\n  preload(route:\
    \ Route, load: Function): Observable<any>{\n  }\n}\n```\n\n`route` 属性引用要导航到的路由，`load`\
    \ 函数加载自定义预加载策略。`preload` 方法最终实现关于何时预加载懒加载模块的逻辑。\n\n然后，将它设置为路由配置的第二个参数：\n\n```typescript\n\
    {preloadingStrategy: CustomStrategy}\n```\n\n为了定义 `load` 函数，可以使用我们在之前的章节中讨论的路由配置的\
    \ `data` 属性。让我们来看以下代码：\n\n```typescript\npreload(route: Route, load: Function):\
    \ Observable<any>{\n  if(route.data && route.data['preload']){\n    return load();\n\
    \  }\n  return of(null);\n}\n```\n\n同时确保在路由配置中将此数据属性设置为 `true`：\n\n```typescript\n\
    {path: 'user',\n  canActivate: [AuthGuard],\n  data: {preload: true},\n  loadChildren:\
    \ './user/user.module#UserModule'}}\n```\n\n配置数据属性后，懒加载模块将按照 `load` 函数工作，并根据自定义策略服务仅加载所需的懒加载模块。\n\
    \n"
- fmt: "\n## Summary (#toc.xhtml_ch64)\n\nUsing lazy loading to load modules improves\
    \ the startup performance of our Angular application by loading only the required\
    \ modules, and then when the user requests for a specific module, we will load\
    \ it to provide the template for that. We also saw how we can preload the lazy\
    \ loaded modules to avoid the waiting time and the three different strategies\
    \ of preloading. We then saw how to preload all the lazy loaded modules or preload\
    \ only some of them, whereas loading others only if and when required.\n\nIn the\
    \ next chapter, we will deal with loads of data and perform different create,\
    \ read, update, and delete operations on this data using routing.\n\n# CHAPTER\
    \ 12 (#toc.xhtml_cn12)\n\n# CRUD Operations with Routing (#toc.xhtml_cn12)\n\n\
    After having learnt almost all the concepts of routing, let us jump into dealing\
    \ with data when performing Angular routing. In this chapter, we will see how\
    \ to perform various operations on data with routing in an Angular application.\
    \ The most required operations in almost any application that we work with are\
    \ creating, reading, updating, and deleting the data which is what is known as\
    \ CRUD operations. Now perform these operations on different routes bring in routing\
    \ in the concept of CRUD operations.\n\nBy the end of this chapter, you will be\
    \ able to understand how to deal with the data and these operations on different\
    \ routes using all the concepts that you have learnt like route guards, loading\
    \ data in a child route, using the auxiliary route to load the data, and more.\n\
    \nWe will cover the following topics in this chapter:\n\n*   What are CRUD operations?\n\
    *   Using in-memory-web-api\n*   Read data\n*   Create data\n*   Update data\n\
    *   Delete data\n\n## What are CRUD operations? (#toc.xhtml_ch65)\n\nLet us first\
    \ take a look at CRUD operations.\n\nThe operations to be performed on the data\
    \ are create, read, update, and delete which are collectively called CRUD operations.\
    \ These operations are a must to perform when dealing with data that might be\
    \ residing on the server or in a local file or anywhere else as shown in the following\
    \ screenshot:\n\n![](images/p106-001.jpg)\n\nFig 12.1\n\nTo get the data to perform\
    \ these operations, we can send an HTTP request to the server, receive the data,\
    \ and perform the operations. However, for testing and development purposes, we\
    \ can use the `angular-in-memory-web-api` provided by the Angular official documentation.\
    \ This `angular-in-memory-web-api` mocks the call to the backend server and gets\
    \ the data for us to perform these operations on it. This `angular-in-memory-web-api`,\
    \ however, is not a part of Angular core. When we say it mocks the call to the\
    \ backend, it means that it will send the HTTP request to the local in-memory-data-store\
    \ and get the data for us, thus making the task of dealing with data a lot easier.\
    \ We can simply replace this service when working with the real server in a real-time\
    \ application.\n\nThere are many other ways of faking the backend server to get\
    \ the data such as creating a file with the hard coded data in it, using a local\
    \ JSON file, and as discussed, using the `angular-in-memory-web-api`.\n\n## Using\
    \ in-memory-web-api (#toc.xhtml_ch66)\n\nTo start, the very first task is to install\
    \ `angular-in-memory-web-api` using the following command:\n\n```\nnpm install\
    \ angular-in-memory-web-api --save-dev\n```\n\nThe save dev flag is used here\
    \ to save this dependency that you will use for the development purpose.\n\nOnce\
    \ done, you will be able to see it in the dependencies inside your `package.json`\
