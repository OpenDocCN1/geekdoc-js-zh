    ## [Summary](#toc.xhtml_ch49)


    In this chapter, we learned some advanced and manicured concepts of Angular routing,
    using the route guards to limit access of the user to a particular route, or confirming
    before he leaves a route. We saw the different types of route guards available
    in the Angular/router package. We also saw how to create different guards with
    the help of CLI.


    With a good understanding of route guards, we are all set to see more of the types
    of routes and in the next chapter, we will learn about componentless and grouping
    routes.


    # [CHAPTER 9](#toc.xhtml_cn9)


    # [Grouping and Component-less Routes](#toc.xhtml_cn9)


    You might be wondering how many types of routes are there in all in Angular routing.
    We discussed primary routes, routing to features, and child and secondary routes.
    But then suppose you come across a route configuration which looks something like
    this:


    `{path: ‘next’, children:[`


    `{path: ‘’, component: NextComponent},`


    `{path: ‘login’, component: LoginComponent}`


    `]},`


    Probably, the first thing that would come to anybody’s mind would be that the
    programmer forgot to write the component property here. However, that is not true
    in this case. In this chapter, we will discuss what such a configuration means
    and why do we configure it and group the routes in a route without a component
    property, that is, componentless route in detail.


    In this chapter, we will cover the following topics:


    *   Grouping the routes


    *   What are component-less routes?


    *   Why component-less routes?


    ## [Grouping the routes](#toc.xhtml_ch50)


    We have been working with a lot of routes in our application by now. We have also
    put our routes as children of one of the parent routes. So we understand what
    grouping is and how it helps. However, most of the examples we have seen until
    now had a parent component which grouped other routes as its child routes and
    displayed them within its own router outlet.


    Let us say we have some configuration as shown in the following code and we want
    to group the routes:


    `const routes: Routes = [`


    `{path: ‘home’, component: HomeComponent},`


    `{path: ‘next’, component: NextComponent},`


    `{path: ‘third’, component: ThirdComponent},`


    `{path: ‘login’, component: LoginComponent},`


    `{path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},`


    `{path: ‘**’, component: NotFoundComponent}`


    `];`


    Let us see how this scenario looks diagrammatically:


    ![](images/p080-001.jpg)


    Fig 9.1


    To group these routes, we can put them inside the children property of any one
    of these routes and contain them inside the router outlet of that parent route.


    Let us take a look at the following code after grouping the routes:


    `const routes: Routes = [`


    `{path: ‘home’, component: HomeComponent},`


    `{path: ‘next’, component: NextComponent, children: [`


    `  {path: ‘third’, component: ThirdComponent},`


    `  {path: ‘login’, component: LoginComponent}`


    `]},`


    `{path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},`


    `{path: ‘**’, component: NotFoundComponent}`


    `];`


    In this code, we have basically arranged the routes and grouped them inside one
    of the routes for the sake of better organization.


    Let us see how this scenario looks diagrammatically now:


    ![](images/p081-001.jpg)


    Fig 9.2


    This is how we grouped our routes for better hierarchy and structure. However,
    if you now go and look at it in the browser, the routes that are grouped under
    the `NextComponent` do not work anymore. Does anyone want to take a guess at why
    does it happen?


    That is when the concept of Component-less Routes comes in.


    ## [Component-less routes](#toc.xhtml_ch51)


    The routes that do not have a component property in their configuration are not
    wrongly written but called **`component-less routes`**. Componentless routes are
    the ones which group the other routes for better structure but do not expect the
    router outlet to be placed within its router outlet. Why? Because there is no
    parent component now, so all the routes that have been grouped inside the component-less
    routes will all appear at a higher level and not within some other router outlet.


    But where does the primary component go then? This component comes inside the
    grouping with the other grouped routes but with an empty path. Let us take a look
    at the following code and understand it better:


    `const routes: Routes = [`


    `{path: ‘home’, component: HomeComponent},`


    `{path: ‘next’, children: [`


    `  {path: ‘’, component: NextComponent},`


    `  {path: ‘third’, component: ThirdComponent},`


    `  {path: ‘login’, component: LoginComponent}`


    `]},`


    `{path: ‘’, redirectTo: ‘home’, pathMatch: ‘full’},`


    `{path: ‘**’, component: NotFoundComponent}`


    `];`


    How is this code different from the previous code? Inside the children property,
    we have added another route with an empty path and the component to it. This component
    was previously put as a primary router outlet behaving as the parent component
    and expecting other routes to be displayed within its own router outlet.


    Now all these three routes appear inside the grouped configuration and will be
    displayed at the same level without being inside any other route’s router outlet.


    How does this look diagrammatically now?


    ![](images/p082-001.jpg)


    Fig 9.3


    The preceding diagram very clearly explains the meaning of a componentless route
    which has many routes configured inside it.


    When you go back to the browser now and check if these two routes work, you will
    notice that they work perfectly fine in their own router outlet view.


    It is pretty clear by now why we need component-less routes but let us quickly
    look at it broadly now.


    ## [Why component-less routes?](#toc.xhtml_ch52)


    As we saw, grouping definitely helps us to organize our routes in a better hierarchical
    structure. Also, in a large enterprise-level Angular application, where route
    configurations are huge, grouping them under component-less routes is a very safe
    idea.


    The best part about grouping components under the component fewer routes is that
    you need not use the route guards and route resolvers for every child route separately.
    You can use the guard and resolvers with the component-less route and this will
    apply to all the route configurations that have been configured inside it.


    Let us take a look at how this appears in the code:


    `const routes: Routes = [`


    `{path: ‘home’, component: HomeComponent},`


    `{path: ‘next’, canActivateChild: [CheckGuard], children: [`


    `  {path: ‘’, component: NextComponent},`


    `  {path: ‘third’, component: ThirdComponent},`


    `  {path: ‘login’, component: LoginComponent}`


    `]},`'
