    ## 路由与单页应用 (SPA)


    我们已经经历了使用包含多个互联 HTML 页面的网站的时代。然而，页面数量逐渐减少，并最终演变成了我们现在所使用的单页应用（SPA）。SPA 可以用较少的文件来实现，而这与互联的
    HTML 文件则不同。使用 SPA 的优势之一是它不需要每次都从服务器下载每一个页面。它只需要下载 `index.html`，其余的操作都在客户端完成。


    如果我们检查任何基于 SPA 的网站的主页，会发现第一个下载的页面是 `index.html`，而不需要从服务器一个接一个地下载所有页面。


    你可能会奇怪，我们只从服务器加载了极少的 HTML，并且只包含了当时存在的数据。那么之后添加的数据又呢？在单页应用中，这些数据每次是如何更新的呢？为了做到这一点，浏览器每次都需要将数据转换为
    HTML。这是一个非常逻辑的问题！


    答案可以通过将这些应用程序与传统的基于服务器的应用程序进行对比得到。以前在服务器端完成的数据渲染在 SPA 中采取了不同的方法。


    在 SPA 中，数据到 HTML 的转换是在客户端完成的。是的，你听得没错。支持 SPA 的浏览器内部运行着类似模板引擎的东西，这使得渲染部分变得更快、更简单。现在，数据不再需要每次都从服务器加载。


    另一个出现的问题是，为什么我们为 SPA 需要 Angular，或者我们到底需不需要它？


    答案是：不需要！我们并不总是需要 Angular 来创建 SPA，但让我们理解为什么 Angular 会出现在这里！当我们为了创建一个单页应用而向一个网页中放入大量数据时，程序会变得非常复杂，而且在这种情况下不是由
    HTML 驱动，而是由 JavaScript 驱动。代码变得非常复杂，为了处理此类复杂的函数，Angular 介入了。现在，我们不再将应用程序视为一组包含大量数据的静态页面；相反，我们将其理解为一个复杂的程序，它需要使用使用
    `TypeScript` 等强类型语言进行开发项目所需的所有工具。


    这里另一个非常重要的的一点是，我们不需要 Angular 来创建一个 SPA 并不是因为网站本身是一个 SPA，而是因为网站是一个包含大量代码和复杂函数的复杂程序。理解这一点的一种简单方法是：非
    SPA 网站实际上只是许多 SPA 的列表。许多单页应用组合成一个单页应用。


    使用 SPA 的一些优势如下：


    *   在生产环境中更易部署。

    *   服务器只需提供最少三个文件——单页 `index.html`、一个 CSS 束和一个 JS 束。

    *   页面刷新速度更快，且不会发生全页刷新。


    在下一章中，我们将看到 Angular 应用中路由的设置，以及如何配置路由、添加守卫（guards）、解析器（resolvers）、执行懒加载等。


    然而，基于路由的 Angular 应用程序设置是通过 CLI 完成的。在创建新项目时，它会询问你是否要向应用程序添加路由。如果你说是，CLI 就会创建并配置这个独立的路由模块。然而，如果开发者不确定是否添加路由，可以说否，但在以后需要时完全可以手动添加。在
    CLI 上，看起来像这样：


    ![](img/p023-001.jpg)


    图 2.2


    ## 总结


    在本章中，我们看到了路由的真实含义以及它在 SPA 中扮演着什么角色。我们还学习了 Angular 路由器的生命周期，以及它如何通过简单更改 URL 使在同一页面上实现不同视图的任务变得更容易。本章还涵盖了
    SPA 的一些优势。


    在下一章中，我们将开始设置基于路由的 Angular 应用程序。在 Angular 的后继版本中，CLI 几乎为我们完成了设置基于路由的 Angular 应用程序的所有任务。它只需询问你是否需要添加路由，如果答案是，它就会创建一个独立的路由模块并从该新路由模块导出
    `RouterModule`。


    # 第 3 章


    ## 路由基础


    在本章中，你将学习路由的基本概念。将涵盖从设置 Angular 路由应用程序到在 Angular 中处理路由所需的各种组件和指令的使用等。在本章结束时，你将能够创建一个非常基础的路由应用程序，让你能够从一个视图导航到另一个视图。


    开始学习路由概念的一些前提如下：


    *   良好理解 Angular 中的组件（components）和模块（modules）

    *   对指令（directives）和服务（services）的基本了解

    *   理解组件之间如何通信


    在本章中，我们将涵盖以下主题：


    *   路由应用程序的基本设置

    *   配置应用路由

    *   激活路由

    *   路由出口（Router outlet）


    如果你对上述主题尚不确定，你可能想回到引言章节来熟悉这些概念。


    ## 路由应用程序的基本设置


    正如我们所知，路由允许用户在执行不同文档对象模型 (`DOM`) 操作时从一个视图导航到另一个视图。


    让我们通过一个简单的网站示例来理解路由应用程序的基本设置。


    我们必须执行的第一件事是在浏览器输入网站的统一资源定位符 (`URL`)。我们将看到应用程序的第一个视图。


    现在假设你点击网站上的某个按钮查看详情，你获取了一些之前无法获得的信息。技术上，当你通过 `URL` 访问的第一个视图并没有这些信息，这意味着点击时获得的数据可能位于另一个视图中，在这种情况下是另一个组件。


    这就是为什么我们需要从一个视图导航到另一个视图。为了实现这种切换视图的行为，我们使用路由。


    浏览器通过 `URL` 识别第一个视图并指向组件模板，然后通过不同的路由技术可以修改 `URL` 跳转到相关的组件。


    开始创建你的 Angular 路由应用程序的第一步是进入 `index.html` 文件并查找 `head` 标签下的 `<base>` 元素。此基础路径将附加到服务器路径上。为了处理路由和导航，如下所示设置该元素：


    ```html

    <base href="/">

    ```


    这适用于 Angular 应用程序根目录为 `app` 文件夹。此基础路径用于开发。然而，当应用程序部署到生产环境时，需要更改基础路径。一种方法是手动进入
    `index.html` 文件，另一种更好的方法是使用 CLI 通过传递子文件夹名称来为你完成。在 CLI 上用于此操作的命令如下：


    ```bash

    ng build --base-href /subfolder/

    ```


    在设置好 `index.html` 文件之后，下一步是在编写导航代码之前进行必要的导入。开头所需的 `import` 语句如代码所示：


    ```typescript

    import { Routes, RouterModule } from ''@angular/router'';

    ```


