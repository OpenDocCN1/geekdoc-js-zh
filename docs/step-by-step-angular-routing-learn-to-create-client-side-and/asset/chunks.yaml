    ## [Component](#toc.xhtml_ch3)


    In Angular, a component is the most basic building block which contains the code
    for implementing what should appear in the view. A component consists of a template,
    class, and a CSS file for styling your application.


    A component is basically a class which is decorated by a Component decorator.
    This decorator makes the class behave as per the functionality of the component
    decorator. The component decorator contains the metadata for the class to behave
    in a certain manner.


    Let us take a look at a Component class:


    `import { Component } from ‘@angular/core’;`


    `@Component({`


    `selector: ‘app-root’,`


    `templateUrl: ‘./app.component.html’,`


    `styleUrls: [‘./app.component.css’]`


    `}) export class AppComponent {`


    `title = ‘BasicsofRouting’;`


    `}`


    The `AppComponent` class contains the properties and methods for the implementation
    of our component view. It is decorated by the component decorator which contains
    the information for the class to behave as a component and the template which
    will appear on the browser. The import statement includes the important files
    that we need.


    To create a component from the CLI, we use the following command:


    **`ng generate component <component-name> OR ng g c <component-name>`**


    A component also consists of an HTML file which decides what goes in the view.
    Every component has an associated template of its own.


    This is how the structure of a component file looks like:


    ![](images/p009-001.jpg)


    Fig 1.10


    ## [Directives](#toc.xhtml_ch4)


    When we want to add a specified behavior to an element, we can use a directive.
    Directives change the structure of the **Document Object Model** (**DOM**), behaviors,
    and more. There are three types of directives in Angular, which are as follows:


    *   Components


    *   Attribute directives


    *   Structure directives


    Components are also a type of directives which have a template associated with
    them. The attribute directives are used to change the appearance and behavior
    of the DOM, and the structure directives are used to change the layout of the
    DOM by adding or removing elements.


    Similarly, the directives are used as class decorators using the `@Directive`
    decorator. We can also create custom attribute directives in Angular and use them
    to modify the DOM as per our requirements.


    We can create a directive in Angular by using the following command:


    **`ng generate directive <directive-name> OR ng g d <directive-name>`**


    ![](images/p010-001.jpg)


    Fig 1.11


    The structure of a directive in our Angular application looks like as shown in
    the following screenshot:


    ![](images/p010-002.jpg)


    Fig 1.12


    ## [Services](#toc.xhtml_ch5)


    When we have two or more components and we want to share data among them, we can
    use component communication techniques. Some of them use input, output, template
    ref. variable, and more. However, when we have components which do not share anything
    among themselves, services are used for their communication.


    So basically, to implement any functionality that is independent of the component,
    we use services. Now, when you want to use this functionality inside your service
    for a particular component, you can inject this service inside that module.


    To create a service from the CLI, we use the following command:


    **`ng generate service <service-name> OR ng g s <service-name>`**


    ![](images/p011-001.jpg)


    Fig 1.13


    The service file looks like this after creating it from the CLI:


    ![](images/p011-002.jpg)


    Fig 1.14


    After building the service, we register the service inside the module as follows:


    ![](images/p012-001.jpg)


    Fig 1.15


    To use this service inside any of the components, you can inject it inside the
    constructor of that component.


    To inject the service, use the following command:


    `constructor (private demo: DemoService){}`


    ## [Modules](#toc.xhtml_ch6)


    Modules are the classes decorated by the `@NgModule` decorator which help us organize
    the piece of code better. Some of the examples of the modules are `BrowserModule,
    FormsModule`, and so on.


    It declares every component, directive, and pipe inside the application. It bootstraps
    the component, defining from where the application begins. It also imports all
    the required modules inside the module to get their functionality working and
    exports the module which may be required for the working of some other modules.
    The Angular module also registers the services required to be injected inside
    the components as `providers.`


    It consists of the following arrays:


    *   imports


    *   exports


    *   providers


    *   bootstrap


    *   declarations


    ![](images/p013-001.jpg)


    Fig 1.16


    We can also create modules using the following command:


    **`ng generate module <module-name> OR ng g m <module-name>`**


    ![](images/p013-002.jpg)


    Fig 1.17


    In the following screenshot, this is how the newly created module looks like.
    It is decorated by the `NgModule` decorator which makes the class behave as a
    module:


    ![](images/p013-003.jpg)


    Fig 1.18


    ## [Routing](#toc.xhtml_ch7)


    Angular applications are **single-page applications** (**SPAs**). When we need
    to change the view of the application from one view to another, we cannot really
    navigate to some other page within the application. Also, when we need to navigate
    from one view to another or you can say from one component to another component,
    we use routing. Routing helps us route from one view of the page to another view,
    providing different template views with different information.


    To navigate from the view of one component to another component, we need to define
    route configurations.


    We import `RouterModule` to perform routing and define the routes as follows:


    ![](images/p014-001.jpg)


