    \ Angular CLI 创建一个 Angular 项目，CLI 会为你完成相关工作，例如注入所需的服务、获取样板代码等。\n\n要借助 CLI 创建新的\
    \ Angular 项目，请使用以下命令：\n\n`ng new <project-name>`\n\n在较新版本的 Angular 中，当你创建一个新项目并在继续下一步之前，CLI\
