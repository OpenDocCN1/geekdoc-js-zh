- fmt: "\n`node -version OR node -v`\n\n![](images/p003-001.jpg)\n\nFig 1.1\n\nWhen\
    \ we install node, it also installs the `npm` package manager along with itself.\
    \ To check if `npm` is installed properly in your machine, use the following command\
    \ as shown in the following screenshot:\n\n`npm -version OR npm -v`\n\n![](images/p004-001.jpg)\n\
    \nFig 1.2\n\nWith node and `npm` installed, you can go ahead and install Angular\
    \ CLI using the following command:\n\n`npm install -g @angular/cli`\n\nTo check\
    \ if Angular CLI is installed properly, use the command given below:\n\n`ng version\
    \ OR ng v`\n\n![](images/p004-002.jpg)\n\nFig 1.3\n\nWith Angular CLI installed,\
    \ you are good to proceed further. Now, you can create an Angular project with\
    \ the help of Angular CLI and CLI does the work for you such as injecting required\
    \ services, getting boilerplates, and so on.\n\nTo create a new Angular Project\
    \ with the help of CLI, use the following command:\n\n`ng new <project-name>`\n\
    \nWith the later versions of Angular, when you create a new project and before\
    \ moving further, CLI asks if you want to add routing to your application and\
    \ builds the project accordingly. We will discuss routing later in this chapter.\
    \ CLI also asks the styling framework you would like to use. You can choose any\
    \ as per your requirement. It will then start building your project, which is\
    \ shown in the following screenshot:\n\n![](images/p005-001.jpg)\n\nFig 1.4\n\n\
    Once the project build is completed you will be able to view the following:\n\n\
    ![](images/p006-001.jpg)\n\nFig 1.5\n\nOnce your application is created, you can\
    \ open it inside your code editor. To open it inside Visual Studio Code, use the\
    \ following command:\n\n`code .`\n\n![](images/p006-002.jpg)\n\nFig 1.6\n\nThis\
    \ will open the newly created project inside Visual Studio Code and the folder\
    \ structure will look like this:\n\n![](images/p007-001.jpg)\n\nFig 1.7\n\nTo\
    \ compile your application now, use the following command:\n\n`ng serve`\n\n![](images/p007-002.jpg)\n\
    \nFig 1.8\n\nThis will give you the introduction view of any Angular application\
    \ with the title as the name of your project:\n\n![](images/p007-003.jpg)\n\n\
    Fig 1.9\n\n## Components\n\nIn Angular, a component is the most basic building\
    \ block which contains the code for implementing what should appear in the view.\
    \ A component consists of a template, class, and a CSS file for styling your application.\n\
    \nA component is basically a class which is decorated by a `Component` decorator.\
    \ This decorator makes the class behave as per the functionality of the component\
    \ decorator. The component decorator contains the metadata for the class to behave\
    \ in a certain manner.\n\nLet us take a look at a Component class:\n\n```\nimport\
    \ { Component } from '@angular/core';\n@Component({\n  selector: 'app-root',\n\
    \  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.css']\n\
    }) \nexport class AppComponent {\n  title = 'BasicsofRouting';\n}\n```\n\nThe\
    \ `AppComponent` class contains the properties and methods for the implementation\
    \ of our component view. It is decorated by the component decorator which contains\
    \ the information for the class to behave as a component and the template which\
    \ will appear on the browser. The import statement includes the important files\
    \ that we need.\n\nTo create a component from the CLI, we use the following command:\n\
    \n`ng generate component <component-name> OR ng g c <component-name>`\n\nA component\
    \ also consists of an HTML file which decides what goes in the view. Every component\
    \ has an associated template of its own.\n\nThis is how the structure of a component\
    \ file looks like:\n\n![](images/p009-001.jpg)\n\nFig 1.10\n\n## Directives\n\n\
    When we want to add a specified behavior to an element, we can use a directive.\
    \ Directives change the structure of the Document Object Model (`DOM`), behaviors,\
    \ and more. There are three types of directives in Angular, which are as follows:\n\
    \n* Components\n* Attribute directives\n* Structure directives\n\nComponents are\
    \ also a type of directives which have a template associated with them. The attribute\
    \ directives are used to change the appearance and behavior of the DOM, and the\
    \ structure directives are used to change the layout of the DOM by adding or removing\
    \ elements.\n\nSimilarly, the directives are used as class decorators using the\
    \ `@Directive` decorator. We can also create custom attribute directives in Angular\
    \ and use them to modify the DOM as per our requirements.\n\nWe can create a directive\
    \ in Angular by using the following command:\n\n`ng generate directive <directive-name>\
    \ OR ng g d <directive-name>`\n\n![](images/p010-001.jpg)\n\nFig 1.11\n\nThe structure\
    \ of a directive in our Angular application looks like as shown in the following\
    \ screenshot:\n\n![](images/p010-002.jpg)\n\nFig 1.12\n\n## Services\n\nWhen we\
    \ have two or more components and we want to share data among them, we can use\
    \ component communication techniques. Some of them use input, output, template\
    \ ref. variable, and more. However, when we have components which do not share\
    \ anything, services are used for communication.\n\nSo, to implement any functionality\
    \ that is independent of the component, we use services. Now, when you want to\
    \ use this functionality inside a particular component, we can inject this service\
    \ inside the module.\n\nTo create a service from the CLI, we use the following\
    \ command:\n\n`ng generate service <service-name> OR ng g s <service-name>`\n\n\
    ![](images/p011-001.jpg)\n\nFig 1.13\n\nThe service file looks like this after\
    \ creating it from the CLI:\n\n![](images/p011-002.jpg)\n\nFig 1.14\n\nAfter building\
    \ the service, we register the service inside the module as follows:\n\n![](images/p012-001.jpg)\n\
    \nFig 1.15\n\nTo use this service inside any of the components, you can inject\
    \ it inside the constructor of that component.\n\n```\nconstructor (private demo:\
    \ DemoService){}\n```\n\n## Modules\n\nModules are the classes decorated by the\
    \ `@NgModule` decorator which help us organize the piece of code better. Some\
    \ of the examples of the modules are `BrowserModule`, `FormsModule`, and so on.\n\
    \nIt declares every component, directive, and pipe inside the application. It\
    \ bootstraps the component, defining from where the application begins. It also\
    \ imports all required modules inside the module to get their functionality working\
    \ and exports the module which may be required for the working of some modules.\
    \ The Angular module also registers the services required to be injected inside\
    \ the components as `providers`.\n\nIt consists of the following arrays:\n\n*\
