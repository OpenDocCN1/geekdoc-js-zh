    We will start this book with the introduction to some basic concepts of Angular.
    In this chapter, we will cover the introduction to Angular, prerequisites to start
    with this framework, the version history of Angular, and the important concepts
    to start building your client-side applications in Angular.


    In this chapter, we will focus on all the concepts required to start your learning
    Angular routing and all the required starter files can be found in the GitHub
    repository mentioned at the beginning of this book.


    If you are familiar with the basic concepts of Angular, this book will help you
    dive deeper into the routing concepts of Angular. However, if you are totally
    new to Angular, you can skill up your concepts around the following topics that
    will be discussed in this chapter, and then you are all good to go.


    *   What is Angular?


