  trans: "\n同样，要在同一个视图中放置次级路由器出口（secondary router outlet），你需要使用第二个路由器出口，在这种情况下它将被称为次级出口（secondary\
    \ outlet）。我们可以在同一个视图中放置多个次级路由器出口，以引用不同的导航视图和路由。\n\n但这里的挑战在于 Angular 路由器如何识别何时使用哪个\
    \ `router-outlet`。这意味着对于特定的路由出口，并没有标识符来告诉 Angular 路由器该特定的路由出口包含要放置在视图中的特定模板。\n\
    \n这时，命名路由出口（named router outlets）的概念就派上用场了。它基本上为不同的路由出口引入标识符的概念，以便让 Angular `Router`\
    \ 知道应该将哪个模板放置在哪个 `Router outlet` 的位置。\n\n# 命名路由出口\n\n在路由层级的同一层级中，为你创建的每个路由出口定义一个唯一标识符，使得\
    \ Angular `Router` 能够识别将路由模板放置在何处。\n\n当我们说在路由层级的同一层级创建路由时，意味着没有创建子路由。所有路由都是主路由。\n\
    \n我们可以使用以下代码（在模板中）创建一个命名路由出口：\n\n```html <div>\n  <router-outlet></router-outlet>\n\
    </div>\n<div>\n  <router-outlet name=\"second\"></router-outlet>\n</div>\n```\n\
    \n现在我们已经在模板上放置了次级路由器出口，我们需要在代码中对其进行配置。\n\n# 设置和配置次级路由\n\n创建次级路由与在 `RouterModule.forRoot`\
    \ 数组内部创建主路径非常相似：\n\n```javascript\n[RouterModule.forRoot([\n  {path: 'login',\
    \ component: LoginComponent, outlet: 'second'}]\n])\n```\n\n此 `outlet` 属性作为额外的属性添加到路由路径中，以为路由提供唯一标识符。无论给\
    \ `outlet` 属性赋予什么名称，该命名路由出口就会被选中。如果在功能模块内部，路由则在 `forChild()` 数组中配置。\n\n![](img/p066-001.jpg)\n\
    \n图 7.2\n\n到为止，该过程完成了两个步骤。第一步是在需要的地方在模板上放置路由出口，第二步是在 `RouterModule` 的 `forRoot`\
    \ 或 `forChild` 数组在代码中配置此路由。\n\n让我们看看配置的次级路由在浏览器中长什么样。假设有一个路由 `https://localhost:4200/User`。你想访问名为\
    \ `second` 的路由器出口。它将在浏览器中显示为 `localhost:4200/User(second: login)`。\n\n它遵循带有括号的路由路径，显示带有出口名称、冒号和次级路由路径的次级路由。在上例中，路由路径是\
    \ `localhost:4200/User`，出口名称是 `second`，次级路由路径是 `login`。\n\n下一个最终步骤是激活我们创建的路由。\n\
    \n# 激活次级出口\n\n与其他路由的激活方式类似，在次级出口的情况下，我们也通过将它放置在模板的 `routerLink` 指令下来激活路由出口：\n\n\
    ```html\n<a [routerLink]=\"[{outlets: {second: ['login']}}]\"> LOGIN </a>\n```\n\
    \n`routerLink` 数组包含 `outlet` 属性，这是一个键值对，键为路由出口的名称，值位次级路由路径的名称。\n\n我们还可以同时路由到多个路由出口。我们首先加载主出口，然后给次级出口提供键值对：\n\
    \n```html\n<a [routerLink]=\"['/users', user.id, {outlets: {second: ['login']}}]\"\
    >Login </a>\n```\n\n在数组的第一部分，主路由出口被加载，当出口属性被激活时，它会加载带有出口名称和路由路径名称的次级出口。\n\n这更改了\
    \ URL 并显示如下：\n\n`https://localhost:4200/users(second: login)`\n\n然而，当需要在配置次级路由时设置某些属性，你需要在组件文件中编写代码并从代码本身激活次级路由。为了这样做，让我们看看如何在组件类的代码中激活次级路由。\n\
    \n# 从代码激活\n\n要从代码而不是模板激活次级路由，我们使用 `navigate` 方法：\n\n```javascript\nthis.router.navigate([{outlets:\
    \ {second: ['login']}}]);\n```\n\n同样，要从代码激活路由但同时激活多个路由，我们将使用下面的代码：\n\n```javascript\n\
    this.router.navigate(['/users', user.id, {outlets: {second: ['login']}}]);\n```\n\
    \n我们还可以同时激活主出口和次级出口。次级出口名称由我们选择；然而，主出口的默认名称为 `primary`。\n\n我们还可以像前面的章节讨论的那样使用\
    \ `navigatebyUrl` 方法。这可以通过手动编写你想要的 URL 来实现。\n\n```javascript\nthis.router.navigatebyUrl(['/users/2(second:\
    \ login)])\n```\n\n这有助于在配置服务和激活次级出口的同时访问该属性。\n\n当你想要清除创建的任何次级出口时，只需将出口属性初始化为 `null`\
    \ 即可。\n\n```javascript\nthis.router.navigate([{outlets: {second: null}}]);\n```\n\
    \n以下行代码来自 `routerLink` 下的模板：\n\n```html\n<a [routerLink]=\"[{outlets: {second:\
    \ null}}]\">\n```\n\n这将清除次级路由的激活，而主出口不受影响。\n\n# 总结\n\n在本章中，我们学习了如何创建次级路由，以及创建次级路由的重要性及其原因。我们看到了使用命名路由出口来唯一标识不同的路由出口。还解释了如何从模板以及代码激活路由出口。主路由使用其他出口并默认被命名，而次级出口由我们提供出口名称。\n"
- fmt: "\nIn Angular routing, the user navigates from one view to the others using\
    \ routes. These route paths are configured inside the routing modules and make\
    \ it accessible to the user to access one route from another as per the code.\
    \ However, in real-case scenarios, we have so many requirements where we would\
    \ not want one user to be able to access all the possible route paths inside our\
    \ application. One such example was mentioned at the beginning of this chapter.\
    \ Let us take one more example.\n\nSuppose the user is filling out a long application\
    \ form and midway he wants to check some details regarding the form, so wants\
    \ to go back to the intro information of this application form; however, if he\
    \ does that, he will lose the details that he has already entered in the form.\
    \ In this case, the application needs to put a guard where it informs the user\
    \ who wants to go back that you will lose all the information entered on this\
    \ page if you navigate back to another view. “Are you sure you want to leave the\
    \ page?” Sounds very familiar! Doesn’t it?\n\nThis is one good example to understand\
    \ the use cases of route guards. route guards not only help us secure the application,\
    \ but are also useful to monitor, authorize or prevent the user from leaving the\
    \ route:\n\n![](images/p070-001.jpg)\nFig 8.1\n\nAs discussed, the navigation\
    \ from `Route 1` to `Route 2` would not just happen without any criteria to check.\
    \ It passes through a route guard and then navigates to the next route. And this\
    \ only happens if the route guard conditions are met:\n\n![](images/p071-001.jpg)\n\
    Fig 8.2\n\nThe different route guards provided by Angular are all used for several\
    \ purposes like monitoring, securing, and so on. Let us take a look at some of\
    \ those:\n\n*   `canActivate`\n*   `canActivateChild`\n*   `canDeactivate`\n*\
    \   `canLoad`\n*   `resolve`\n\nThe `canActivate` route guard is used to guard\
    \ the navigation to a route whereas the `canActivateChild` route guard will secure\
    \ the navigation from one route to a child route. The `canDeactivate` route guard,\
    \ on the other hand, will guard the navigation away from the route that is preventing\
    \ the user from leaving a route. These three are the most commonly used route\
    \ guards. However, there are two more types of route guards that are used for\
    \ routing purposes.\n\nThe `canLoad` guard is used when the user wants to lazy\
    \ load routes. That means this guard comes very handy when preventing asynchronous\
    \ routing and is used in the lazy loading technique. This guard is used in place\
    \ of the `canActivate` guard when using lazy loading to load the modules and actually\
    \ loads the next module only if the guard gives access to it.\n\nThe `resolve`\
    \ route guard is another type of guard, which as the name suggests, is used when\
    \ you want to resolve something before anything appears in the view. We will learn\
    \ about route resolvers in the upcoming chapter. When the user needs to prefetch\
    \ some data before actually loading the next route component template view, the\
    \ `resolve` route guard is used.\n\nLet us now take a look at the order of execution\
    \ of these route guards in an Angular application. The implementation of these\
    \ route guards in a particular order is very important because, at every step,\
    \ the user must be able to access the route with a secure and monitored route\
    \ activity.\n\nThe order goes as follows:\n\n![](images/p072-001.jpg)\nFig 8.3\n\
    \nLet us see why. The first route guard to be activated is the `canDeactivate`\
    \ route guard. This will determine if the user would be able to leave the current\
    \ route or not. The next route guard to be activated is the `canLoad` route guard.\
    \ This guard checks if some feature module has been loaded asynchronously. Then,\
    \ comes the third type of route guard which is checked when navigating to any\
    \ of the child routes and then comes the `canActivate` route guard which is checked\
    \ by the router if the user is trying to navigate to any of the routes. Then finally,\
    \ the router uses the `resolve` router guard, which is meaningful enough, because\
    \ the router wants to load all the data on any particular view only after it has\
    \ checked all the other route guards. There is no sense of loading the data if\
    \ the user does not get through the other routes.\n\n## Creating a route guard\n\
    \nA route guard is created as a service inside an Angular application. This means\
    \ that this new service will be exported as a class and will be decorated by the\
    \ `Injectable` decorator. Now that this service needs to behave as a guard, we\
    \ need to implement this interface for it to behave as a particular guard. Also,\
    \ this interface must be imported from the corresponding router package. We can\
    \ also create a guard using the CLI with the following command:\n\n`ng generate\
    \ guard <guard-name> or ng g g <guard-name>`\n\n```typescript\n//Creating the\
    \ service for route guard\nexport {Injectable} from ‘angular/core’;\nexport {CanActivate}\
    \ from ‘angular/router’;\n@Injectable({\n  providedIn: ‘root’;\n})\nexport class\
    \ guardService implements CanActivate{\n  canActivate(){\n    …\n  }\n}\n```\n\
    \nAfter implementing the interface, `CanActivate` in this example, we need to\
    \ ensure to implement the method associated with the interface.\n\nNow, the next\
    \ step is to add the guard to a particular route:\n\n`{path: ‘user’, Component:\
    \ UserComponent, canActivate: [ guardService ] }`\n\nWe can share the guards also\
    \ which means a guard can be applied to various child routes or to a parent route\
    \ so that all its children are able to use this route.\n\n## canActivate Guard\n\
    \nThe `CanActivate` route guard is used when the route has to be activated. This\
    \ guard is mainly used to check if the user has already logged in. It is also\
    \ used to give access to only some confidential data.\n\nLet us create one in\
    \ the application now. When we use the CLI to create the route guard, the CLI\
    \ will implement the `canActivate` guard by default, implementing the required\
    \ methods inside it.\n\nThis is how your route guard looks when you create it\
    \ from the CLI:\n\n![](images/p074-001.jpg)\nFig 8.4\n\nInside the code, it looks\
    \ like this:\n\n![](images/p074-002.jpg)\nFig 8.5\n\nInside the `canActivate`\
    \ method, you can implement the functionality to check the required information\
    \ before letting him continue. You can apply the `canActivate` guard then to all\
    \ the route paths where ever require it:\n\n![](images/p075-001.jpg)\nFig 8.6\n\
    \n## canActivateChild Guard\n\nThe `canActivateChild` guard is similar to the\
    \ `canActivate` guard. When a child of any route is activated, that is when this\
    \ route guard is called. It checks all the required information before activating\
    \ a child route. The common usages of the `canActivateChild` guard are similar\
    \ to that of the `canActivate` route guard. It also checks if the user is logged\
    \ in or registered before activating the child routes. It also limits access to\
    \ these child routes.\n\nHowever, if there are some changes in the child route,\
    \ the `canActivate` guard does not execute it again.\n\nThe working of a `canActivateChild`\
    \ guard is the same as that of a `canActivate` route guard.\n\n## canDeactivate\
    \ guard\n\nAs we saw earlier, the `canDeactivate` guard is used when the user\
    \ routes away from a route path. This route guard is used when the user is filling\
    \ in some form and is midway through the form having some changes that are not\
    \ saved yet. This is also used to confirm before leaving a route just to make\
    \ sure; for example, the back button has not been clicked on accident.\n\nThis\
    \ guard is called every time the route changes from one path to another. One very\
    \ important thing to make a note of is that this guard will not work if the user\
    \ opens a different website or closes the browser.\n\n## Creating the Deactivate\
    \ route\n"
  raw: 'In Angular routing, the user navigates from one view to the others using routes.
    These route paths are configured inside the routing modules and make it accessible
    to the user to access one route from another as per the code. However, in real-case
    scenarios, we have so many requirements where we would not want one user to be
    able to access all the possible route paths inside our application. One such example
    was mentioned at the beginning of this chapter. Let us take one more example.


    Suppose the user is filling out a long application form and midway he wants to
    check some details regarding the form, so wants to go back to the intro information
    of this application form; however, if he does that, he will lose the details that
    he has already entered in the form. In this case, the application needs to put
    a guard where it informs the user who wants to go back that you will lose all
    the information entered on this page if you navigate back to another view. “Are
    you sure you want to leave the page?” Sounds very familiar! Doesn’t it?


    This is one good example to understand the use cases of route guards. route guards
    not only help us secure the application, but are also useful to monitor, authorize
    or prevent the user from leaving the route:


    ![](images/p070-001.jpg)


    Fig 8.1


    As discussed, the navigation from **`Route 1`** to **`Route 2`** would not just
    happen without any criteria to check. It passes through a route guard and then
    navigates to the next route. And this only happens if the route guard conditions
    are met:


    ![](images/p071-001.jpg)


    Fig 8.2


    The different route guards provided by Angular are all used for several purposes
    like monitoring, securing, and so on. Let us take a look at some of those:


    *   canActivate


    *   canActivateChild


    *   canDeactivate


    *   canLoad


    *   resolve


    The `canActivate` route guard is used to guard the navigation to a route whereas
    the `canActivateChild` route guard will secure the navigation from one route to
    a child route. The `canDeactivate` route guard, on the other hand, will guard
    the navigation away from the route that is preventing the user from leaving a
    route. These three are the most commonly used route guards. However, there are
    two more types of route guards that are used for routing purposes.


    `The canLoad` guard is used when the user wants to lazy load routes. That means
    this guard comes very handy when preventing asynchronous routing and is used in
    the lazy loading technique. This guard is used in place of the `canActivate` guard
    when using lazy loading to load the modules and actually loads the next module
    only if the guard gives access to it.


    The resolve route guard is another type of guard, which as the name suggests,
    is used when you want to resolve something before anything appears in the view.
    We will learn about route resolvers in the upcoming chapter. When the user needs
    to prefetch some data before actually loading the next route component template
    view, the resolve route guard is used.


    Let us now take a look at the order of execution of these route guards in an Angular
    application. The implementation of these route guards in a particular order is
    very important because, at every step, the user must be able to access the route
    with a secure and monitored route activity.


    The order goes as follows:


    ![](images/p072-001.jpg)


    Fig 8.3


    Let us see why. The first route guard to be activated is the `canDeactivate` route
    guard. This will determine if the user would be able to leave the current route
    or not. The next route guard to be activated is the `canLoad` route guard. This
    guard checks if some feature module has been loaded asynchronously. Then, comes
    the third type of route guard which is checked when navigating to any of the child
    routes and then comes the `canActivate` route guard which is checked by the router
    if the user is trying to navigate to any of the routes. Then finally, the router
    uses the resolve router guard, which is meaningful enough, because the router
    wants to load all the data on any particular view only after it has checked all
    the other route guards. There is no sense of loading the data if the user does
    not get through the other routes.


    ## [Creating a route guard](#toc.xhtml_ch44)


    A route guard is created as a service inside an Angular application. This means
    that this new service will be exported as a class and will be decorated by the
    `Injectable` decorator. Now that this service needs to behave as a guard, we need
    to implement this interface for it to behave as a particular guard. Also, this
    interface must be imported from the corresponding router package. We can also
    create a guard using the CLI with the following command:


    `ng generate guard <guard-name> or ng g g <guard-name>`


    `//Creating the service for route guard`


    `export {Injectable} from ‘@angular/core’;`


    `export {CanActivate} from ‘@angular/router’;`


    `@Injectable({`


    `providedIn: ‘root’;`


    `})`


    `export class guardService implements CanActivate{`


    `canActivate(){`


    `…`


    `}`


    `}`


    After implementing the interface, `CanActivate` in this example, we need to ensure
    to implement the method associated with the interface.


    Now, the next step is to add the guard to a particular route:


    `{path: ‘user’, Component: UserComponent, canActivate: [ guardService ] }`


    We can share the guards also which means a guard can be applied to various child
    routes or to a parent route so that all its children are able to use this route.


    ## [canActivate Guard](#toc.xhtml_ch45)


    The `CanActivate` route guard is used when the route has to be activated after
    checking for some conditions. This guard is mainly used to check if the user has
    already logged in or not. It is also used to give access to only some users for
    some confidential data.


    Let us create one in the application now. When we use the CLI to create the route
    guard for us using the command discussed earlier. The CLI will implement the `canActivate`
    route guard by default, implementing the required methods inside it.


    This is how your route guard looks like when you create it from the CLI before
    making any change in the code yourself:


    ![](images/p074-001.jpg)


    Fig 8.4


    Inside the code, it looks like this:


    ![](images/p074-002.jpg)


    Fig 8.5


    Inside the `canActivate` method, you can implement the functionality to check
    the required information before letting him continue. You can apply the `canActivate`
    guard then to all the route paths where ever you require it:


    ![](images/p075-001.jpg)


    Fig 8.6


    ## [canActivateChild Guard](#toc.xhtml_ch46)


    The `canActivateChild` guard is similar to the `canActivate` guard. When a child
    of any route is activated, that is when this route guard is called. It checks
    all the required information before activating a child route. The common usages
    of the `canActivateChild` guard are similar to that of the `canActivate` route
    guard. It also checks if the user is logged in or registered before activating
    the child routes. It also limits access to these child routes.


    However, if there are some changes in the child route, the `canActivate` guard
    does not execute it again.


    The working of a `canActivateChild` route guard is the same as that of a `canActivate`
    route guard.


    ## [canDeactivate guard](#toc.xhtml_ch47)


    As we saw earlier, the `canDeactivate` guard is used when the user routes away
    from a route path. This route guard is used when the user is filling in some form
    and is midway through the form having some changes that are not saved yet. This
    is also used to confirm before leaving a route just to make sure; for example,
    the back button has not been clicked on by accident.


    This guard is called every time the route changes from one path to another. One
    very important thing to make a note of is that this guard will not work if the
    user opens a different website or closes the browser.


    ## [Creating the Deactivate route](#toc.xhtml_ch48)'
