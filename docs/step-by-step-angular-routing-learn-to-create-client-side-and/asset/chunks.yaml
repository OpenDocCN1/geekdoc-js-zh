  trans: "\n\n在较后版本的 Angular 中，CLI 会询问我们是否需要为应用配置路由，如果需要，它将创建一个 `AppRoutingModule`。这个用于路由配置的独立模块有助于更好地组织代码，并导出\
    \ `RouterModule`，该模块随后会被导入 `AppModule` 内部。CLI 创建的 `AppRoutingModule` 模块看起来如下：\n\
    \n![](img/p015-001.jpg)\n\n图 1.20\n\n要使用这些路由，我们可以使用 `path` 值从组件视图导航到任何路由。我们将在接下来的章节中详细介绍路由。\n\
    \n## 总结\n\n在 Angular 的入门章节中，我们讨论了 Angular 的所有基本概念，以便对 Angular 的结构和解剖有一个大致的了解。对于开始\
    \ Angular 路由至重要的主题已经进行了简要说明。到本章结束，读者能够对 Angular 的核心概念形成基本理解，例如：作为 Angular 构建单元的**组件**；包含并导入所有所需组件、指令、管道等的**模块**；以及帮助我们使用互不相关组件功能的**服务**。我们还学习了如何使用\
    \ Angular 命令行界面 (`CLI`) 创建新的组件、指令、模块和服务。此外，还对 Angular 路由进行了简要介绍，以了解 Angular 路由的真正含义。\n\
    \n在下一章中，我们将从更广泛的层面学习路由及其重要性。\n\n# 第 2 章\n\n## 路由简介\n\n在了解了 Angular 应用中文件结构的构造后，我们可以继续学习\
    \ Angular 应用中的路由。在本章中，你将详细学习路由、它如何帮助构建单页应用 (`SPAs`)，以及路由在 Angular 应用中的重要性。到本章结束，你应该能够回答所有关于在\
    \ Angular 框架构建 Web 应用时使用路由的疑问。\n\n在本章中，我们将涵盖以下主题：\n\n*   定义路由\n*   路由与 SPA\n\n\
    ## 定义路由\n\n正如在介绍章节中所讨论的，我们现在已经了解路由在 Angular 应用中能帮我们什么。当你需要将模板视图从一个切换到另一个时，浏览器的\
    \ URL 会发生变化，你将看到与之前不同的视图。Angular 路由的工作原理基于 Angular router。\n\n## 什么是 Angular router？\n\
    \nAngular router 是用于基于 Angular 的 Web 应用中路由的官方 JavaScript 实现库。它作为 Angular 核心包的一部分被封装为\
    \ `@angular/router`。\n\nAngular router 是我们在 Angular 应用中执行从一个视图到另一个视图路由的所有功能的核心。它会激活与特定路由配置相关的所有组件。它不仅有助于在不重新加载页面的从一个组件查看另一个组件，还能帮助我们把\
    \ URL 重定向到目标组件。\n\n在接下来的章节中，我们将学习路由解析器 (resolvers)、路由守卫 (guards) 以及模块的懒加载；这些功能都是作为\
    \ `@angular/router` 包的一部分使用的。\n\n让我们来看看 Angular router 的工作原理。\n\nAngular router\
    \ 最首要的任务是导航到可路由组件的配置路由。因此，路由组件被配置为路由配置，这些配置被称为路由状态 (router states)。一旦配置了这些状态，Angular\
    \ router 就会渲染这组组件并更改浏览器的 URL。这还需要模板上存在 `router outlet`，作为占位符，用于在该页面上放置模板视图。\n\n\
    这就是为什么在处理 Angular 路由时，第一步是在你的应用程序中导入 `RouterModule`。下一步是配置路由状态，这些状态形成了一个路由状态树。要实现这一点，路由是在\
    \ `routermodule.forRoot()` 方法内部配置的。\n\n在设置路由应用的下一章节中，你将看到使用 `routermodule.forRoot()`\
    \ 的不同方法。\n\n在任何给定的时间点，都会有一个路由正在运行，这被称为活动路由 (active route)。\n\n每当路由路径发生变化时，浏览器\
    \ URL 就会发生变化，激活的路由也会随之改变。在接下来的章节中，你还会看到路由配置（或者说路由状态树）中路径的顺序非常。它遵循深度优先搜索算法，并将第一个路由路径与整个\
    \ URL 进行匹配。\n\n一旦涵盖了路由配置，我们就可以看到 Angular router 如何从一个路由导航到另一个路由。为了更好地理解这一点，让我们先理解路由的生命周期：\n\
    \n*   应用重定向 (redirects)\n*   匹配路由状态 URL\n*   激活守卫 (guards)\n*   激活解析器 (resolvers)\n\
    *   使用 router outlet 激活模板上的最终视图\n\n下面的图表显示了路由的生命周期：\n\n![](img/p019-001.jpg)\n\
    \n图 2.1\n\n路由在整个过程中发生了很多事件。可以使用路由服务配合可观察对象 (observable) 来监听路由事件。某些路由事件如下：\n\n\
    *   `NavigationStart`: 当路由的导航周期成功开始时触发。\n*   `NavigationEnd`: 当路由的导航周期成功结束时触发。\n\
    *   `NavigationCancel`: 当导航被取消时触发此事件。\n*   `NavigationError`: 当导航因某些意外错误失败时，触发此事件。\n\
    *   `ResolveStart`: 当处于路由的解析阶段时触发此事件。\n*   `ResolveEnd`: 代表路由的结束阶段。\n*   `RouteConfigLoadEnd`:\
    \ 当加载任何懒加载的项时，触发此事件以显示某些路由已懒加载。\n*   `RouteConfigLoadStart`: 在懒加载路由之前触发。\n*  \
    \ `GuardsCheckStart`: 当路由的守卫阶段开始时触发。\n*   `GuardsCheckEnd`: 当路由的守卫阶段结束时触发。\n*\
    \   `RoutesRecognized`: 如其所示，当路由被识别时触发此事件。\n*   `ChildActivationStart`: 当路由的解析阶段结束时触发此事件，显示该阶段的开始。\n\
    *   `ChildActivationEnd`: 当路由的解析阶段结束时触发此事件，显示该阶段的结束。\n*   `ActivationStart`: 当路由的解析阶段结束时触发此事件，显示该阶段的开始。\n\
    *   `ActivationEnd`: 当路由的解析阶段结束时触发此事件，显示该阶段的结束。\n*   `Scroll`: 代表滚动事件。\n\n这些事件告诉我们\
    \ Angular router 的状态；例如，`NavigationStart` 表示导航周期的开始，`NavigationEnd` 表示导航周期的结束，`NavigationCancel`\
    \ 用于守卫不允许用户访问导航到某个路由的情况。\n\n通过将 `RouterModule` 对象的 `forRoot()` 方法的 `enableTracing`\
    \ 选项设置为 `true`，或者通过注入路由服务并订阅事件观察对象，我们可以从浏览器看到一系列事件：\n\n```\nconstructor(private\
    \ router: Router) {\n  this.router.events.subscribe( (event: RouterEvent) => console.log(event))\n\
    }\n```\n\n因此，Angular router 能够轻松配置路由配置（即路由状态），并且在后台运行许多不同路由事件的情况下帮助从一个路由路径导航到另一个路由，这些绝对是可以查看的。\n\
    \n"
- fmt: '

    ## Routing and SPAs


    We have evolved from the time when we used websites involving a number of HTML
    pages interlinked. However, it reduced to fewer and fewer and then what came to
    be used as single-page applications. SPAs can be implemented with smaller number
    of files whereas this will not be the same case with the interlinked HTML files.
    One advantage of using SPAs is that it does not need to download every page every
    time from the server. It just downloads the `index.html` and the rest happens
    on the client side.


    If we inspect the main page of any of the websites based on SPAs, we will see
    that the first page to be downloaded is the `index.html` and there is no need
    to download all the pages one by one from the server.


    You might be wondering that we load very little HTML from the server, with the
    data that is present at that time. What about the data that is added later. How
    does that get updated every time in a single-page application! To do this, the
    browser needs to change the data into HTML every time. That is a very logical
    question!


    The answer to that can be obtained by comparing these applications to those traditional
    server-based applications. The rendering of data which used to be done on the
    server-side has a different approach with SPAs.


    With SPAs, the data to HTML transformation is done on the client-side. Yes, you
    heard it right. The SPA-friendly browsers have something like a template engine
    running in them which makes the rendering part much faster and easier. Now, the
    data will not be needed to be loaded from the server every time.


    The other question that arises is why do we need Angular for SPAs or do we need
    it at all?


    The answer to this is No! We do not always need Angular to create SPAs but let
    us understand why Angular comes into picture then! When we are putting in a lot
    of data into one web page with the aim of creating a single-page application,
    the program becomes very complex and is not driven by HTML but JavaScript in that
    case. The code becomes very complex and then to handle such complex functions,
    Angular jumps in. Now we will not look at our application as a set of static pages
    with a lot of data in them; instead, we understand it as a complex program which
    needs to use all the tools required for a development project using a typed language
    like `TypeScript`.


    Another very important thing to put light on, here, is that we do not need Angular
    to create an SPA because the website is an SPA but because the website is a complex
    program with a lot of code and complex functions in it. An easy-way of understanding
    this can be by saying that a non-SPA is actually nothing but a list of many SPAs.
    Many single-page applications comprise to form a single-page application.


    Some of the advantages of using SPAs are as follows:


    * Easier to deploy in production.

    * Server to serve a minimum of three files — single page `index.html`,a CSS bundle,
    and a JS bundle.

    * Faster page refreshes and no full page refreshes occur.


    In the next chapter, we will see the setup of routing in an Angular application
    and how to configure routes, add guards, resolvers, perform lazy loading, and
    more.


    However, the setup of a routing-based Angular application is done by the CLI.
    On the creation of a new project, it asks if you want to add routing to your application.
    If you say yes, the CLI creates and configures this separate routing module. However,
    if the developer is not sure whether to add routing or not, he can say No but
    can definitely add it manually later when required. On the CLI, it looks like
    this:


    ![](images/p023-001.jpg)


    Fig 2.2


    ## Summary


    In this chapter, we saw what routing actually means and what role does it play
    in SPAs. We also learned about the lifecycle of Angular router and how it makes
    the task of implementing different views on the same page by simply changing the
    URLs much easier. Some of the advantages of SPAs were also covered in the chapter.


    In the next chapter, we will start with setting up our routing-based Angular application.
    With the later versions of Angular, the CLI does almost all the tasks of setting
    up a routing-based Angular application for us. It simply asks if you need to add
    routing and if the answer is yes, it creates a separate routing module and exports
    `RouterModule` from this new routing module.


    # CHAPTER 3


    ## Basics of Routing


    In this chapter, you will learn about the basic concepts of routing. It will cover
    the topics from setting up an Angular routing application to the usage of different
    components and directives required to work with routing in Angular. By the end
    of this chapter, you will be able to create a very basic routing application which
    enables you to navigate from one view to another.


    Some of the pre-requisites to start learning the concepts of routing are as follows:


    * Good understanding of components and modules in Angular

    * Basic understanding of directives and services

    * Understanding of how components communicate with one another


    In this chapter, we will cover the following topics:


    * The basic setup of a routing application

    * Configuring application routes

    * Activating the routes

    * Router outlet


    If you think you are not too sure about the aforementioned topics, you may want
    to go back to the Introduction chapter and touch base with these concepts.


    ## The basic setup of a routing application


    As we know now, routing enables the user to navigate from one view to another
    as he performs different tasks on the `Document Object Model` (`DOM`).


    Let us take the example of a simple website to understand the basic setup of a
    routing application.


    The first thing we must do is go to the browser and type the `Uniform Resource
    Locator` (`URL`) of the website. What we will see then is the first view of the
    web application.


    Now suppose if you click on some button on the website to look for the details
    of some item, let us say, you get access to some new information which was earlier
    not available to you. Technically, the first view that you see when accessing
    the website through the `URL` does not have this information and this basically
    means that the data you receive on the click of the button may be contained in
    some other view, in this case, another component.


    And this is why we navigate from one view to another. To achieve this activity
    of moving to and from different views, we use routing.


    The browser identifies the first view through the `URL` which directs you to the
    first component template, and then using different routing techniques, the `URL`
    can be modified redirecting to another component associated with that particular
    path.


    To start creating your Angular routing application, the first step is to go the
    `index.html` file and look for the `<base>` element under the `head` tag. This
    base path is appended to the path of the server. To work with routing and navigation,
    set this element as mentioned below:


    ```

    <base href="/">

    ```


    This is applicable if the application root for your Angular application is the
    `app` folder. This base path is used for development purpose. However, when the
    application is deployed for production, the base path needs to be changed. One
    way to do it is to manually go to the `index.html` file, and another better way
    is to use the CLI to do it for you by passing the name of the sub folder. The
    command to be used on the CLI for this is as follows:


    ```

    ng-build --base-href /subfolder/

    ```


    The next step after setting up your `index.html` file is to do the necessary imports
    before writing the code for navigation. The `import` statement required in the
    beginning is in the following code:


    ```

    import { Routes, RouterModule } from ''@angular/router'';

    ```

    '
