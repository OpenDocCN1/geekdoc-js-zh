    # # Introduction to Angular


    We take immense pride in our work at BPB Publications and follow best practices
    to ensure the accuracy of our content to provide with an indulging reading experience
    to our subscribers. Our readers are our mirrors, and we use their inputs to reflect
    and improve upon human errors if any, occurred during the publishing processes
    involved. To let us maintain the quality and help us reach out to any readers
    who might be having difficulties due to any unforeseen errors, please write to
    us at :


    [errata@bpbonline.com](mailto:errata@bpbonline.com)


    Your support, suggestions and feedbacks are highly appreciated by the BPB Publications’
    Family.


    ## What is Angular?


    Angular is a JavaScript framework used to build client-side applications using
    HTML, CSS, and a programming language such as JavaScript. It is a collection of
    components which contain the code to execute and have an associated template that
    displays the data on the browser. Angular provides features like binding the data
    from the code to appear on the template, built-in packages to interact with different
    services, service for back-end integration, and more.


    Angular comprises components, services, directives, modules, pipes, etc. to make
    our applications much more effective. There are so many applications built on
    Angular now there has been a shift in the world of web development after the introduction
    of the Angular framework from AngularJS to Angular 7. The name *Angular* comes
    from the angle brackets used for HTML tags.


    The basic structure of Angular includes:


    *   `NgModules`

    *   Components

    *   Directives

    *   Services and Dependency Injection

    *   Routing

    *   Data binding

    *   We will start by taking a look at how to set up a.


    ## Setting up a development environment


    To build Angular applications, we would need to connect many dependencies, web
    development servers, and packages to each other. But to build and set up an Angular
    application from scratch takes some time.


    Angular provides us with a command line tool for creating the Angular apps called
    `Angular CLI`.


    `Angular CLI` provides us with all the required dependencies, boilerplates, takes
    care of the web pack configuration, unit test configuration, and transpiles TypeScript
    files to JavaScript.


    To install `Angular CLI` on our local machine, we can use the node package manager
    `npm.`


    Node.js can be downloaded from the browser at the following link as per your operating
    system:


    [https://nodejs.org/en/download/](https://nodejs.org/en/download/)


    Once it is installed, you can check to confirm if Node.js is installed properly
    in your machine.


    To check if node is installed properly, use the following command:

    ```bash

    node -v

    ```

