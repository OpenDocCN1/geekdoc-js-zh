    ## [Router outlet](#toc.xhtml_ch16)


    Router outlet is a directive used for placing the data on the template where ever
    it is present. This router outlet acts as a placeholder for putting in the `Component`
    data in the view:


    `<router-outlet></router-outlet>`


    The primary router outlet is placed in the app component template because that
    is the main template where all the data is placed. There can be multiple router
    outlets too; you will see more about multiple router outlets in the upcoming chapters.


    Here is what it looks like now in the browser.


    Go to the browser and type in the URL. The first thing is that it will be directed
    to the `HomeComponent` view as shown in the following screenshot:


    ![](images/p031-001.jpg)


    Fig 3.4


    To route to the **`Next`** component, click on **`Next`** and you will see this
    as shown in the following screenshot:


    ![](images/p032-001.jpg)


    Fig 3.5


    Similarly, the `ThirdComponent` object works as shown in the following screenshot:


    ![](images/p032-002.jpg)


    Fig 3.6


    In case we pass some new route to the URL which it does not recognize, it gives
    results as shown in the following screenshot:


    ![](images/p032-003.jpg)


    Fig 3.7


    One of the important things to ensure is that when specifying the route configurations
    inside the routes array in the module, the order in which the routes are placed
    matters a lot. In case, you put `NotFoundComponent` above all the routes, no other
