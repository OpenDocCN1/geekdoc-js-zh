  \nRGB 格式是红、绿、蓝在 0 – 255 范围内的颜色组合。十六进制颜色代码是 RGB 数字的十六进制表示。\n\n十六进制使用 16 个唯一符号，将 0\
  \ – 9 之间的值表示为“0 – 9”，将 10 – 15 之间的值表示为“A – F”或“a – f”。\n\n### 方法 1. 使用 toString()\
  \ 方法\n`toString()` 方法接收一个进制值并将值转换为该进制。\n\n```javascript\nconst componentToHex =\
