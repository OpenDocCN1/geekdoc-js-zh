  \n---\n**由于您提供的原始文本在结尾处重复和乱码，以下是针对您提供的最后文本部分的纯净翻译：**\n\n[content]\n\n# 使用数组实现两个栈\n\
  \n### 问题描述 -\n创建一个名为 `twoStacks` 的数据结构，它将仅使用一个数组来存储数据，但作为两个不同的 [栈](https://learnersbucket.com/tutorials/algorithms/stack)。\n\
  \n`twoStacks` 数据结构将执行以下操作：\n\n- `push1(elm)`: 这向第一个栈中添加数据。\n- `push2(elm)`: 这向第二个栈中添加数据。\n\
  - `pop1()`: 这从第一个栈中移除数据。\n\n\n\n\n\n● `pop2()` : 将从第二个栈中移除数据。\n\n## 示例\n\n输入：\n\
  ```javascript\nlet stack = new twoStacks(10);\n\n//向第一个栈推入数据\nstack.push1('stack1');\n\
  \n//向第二个栈推入数据\nstack.push2('stack2');\n\n// 从第一个栈弹出数据\nconsole.log(stack.pop1());\n\
  \n// 从第二个栈弹出数据\nconsole.log(stack.pop2());\n```\n\n输出：\n```text\n\"stack1\"\n\"\
  stack2\"\n```\n\n我们有两种不同的方法来实现此这种功能。\n\n### 方法 1：通过将数组分为两个等份\n在数组中实现两个栈的方法之一，是将数组平分为两个等份，并使用这两个部分作为两个不同的栈来存储数据。\n\
  \n这种方法可以正常工作，但它并不是空间高效的。假设我们有两个分别包含 `4` 和 `6` 个元素的栈，而我们的数组长度为 `10`。如果我们把数组平分为两个等份，它将得到两个长度为\
  \ `5` 的栈。如果我们只向第一个栈推入 `4` 个元素，它就有一个空闲空间；当我们尝试向第二个栈推入 `6` 个元素时，它会溢出，因为它的容量只有 `5`。我们本可以使用第一个栈的\
  \ `1` 个空闲空间来存储数据。\n\n### 方法 2：一种空间高效的方法\n这种方法非常节省空间，只要数组或任何一个栈中有可用空间，就不会溢出。\n\n\
  我们在这里使用的概念是将数据存储在数组的两个末端（从起始和末尾）。\n\n第一个栈存储从前端开始的数据，位于索引 `0`；而第二个栈存储从末尾开始的数据，位于索引\
  \ `size-1`。\n\n两个栈都从相反的端推入和弹出数据，为了防止溢出，我们只需要检查数组中是否有可用空间。\n\n### 实现\n\n```javascript\n\
  class twoStacks {\n  // 初始化栈的大小\n  constructor(n) {\n    this.size = n;\n    this.top1\
  \ = -1;\n    this.top2 = n;\n    this.arr = [];\n  }\n\n  // 向栈 1 推入数据\n  push1\
  \ = (elm) => {\n    // 检查数组中是否有空间\n    // 在数组的开头推入\n    if (this.top1 < this.top2\
  \ - 1) {\n      this.arr[++this.top1] = elm;\n    } else {\n      console.log('栈溢出');\n\
  \      return false;\n    }\n  }\n\n  // 向栈 2 推入数据\n  push2 = (elm) => {\n    //\
  \ 检查数组中是否有空间\n    // 在数组的末尾推入\n    if (this.top1 < this.top2 - 1) {\n      this.arr[--this.top2]\
  \ = elm;\n    } else {\n      console.log('栈溢出');\n      return false;\n    }\n\
  \  }\n\n  // 从栈 1 弹出数据\n  pop1 = () => {\n    // 检查栈 1 是否有数据\n    // 从栈的前端移除\n \
  \   if (this.top1 >= 0) {\n      let elm = this.arr[this.top1];\n      this.top1--;\n\
  \      return elm;\n    } else {\n      console.log('栈下空');\n      return false;\n\
  \    }\n  }\n\n  // 从栈 2 弹出数据\n  pop2 = () => {\n    // 检查栈 2 是否有数据\n    // 从数组的末尾移除\n\
  \    if (this.top2 < this.size) {\n      let elm = this.arr[this.top2];\n      this.top2++;\n\
  \      return elm;\n    } else {\n      console.log('栈下空');\n      return false;\n\
  \    }\n  }\n}\n```\n\n### 测试用例\n\n输入：\n```javascript\nlet stack = new twoStacks(10);\n\
  // 向第一个栈推入数据\nstack.push1('stack1');\n\n// 向第二个栈推入数据\nstack.push2('stack2');\n\n\
  // 从第一个栈弹出\nconsole.log(stack.pop1());\n\n// 从第二个栈弹出\nconsole.log(stack.pop2());\n\
  ```\n\n输出：\n```text\n\"stack1\"\n\"stack2\"\n```\n\n---\n\n# 实现优先级队列\n\n#### 什么是优先级队列？\n\
  由于队列在计算机编程和现实生活中都被广泛使用，因此需要一些原始队列数据结构的不同模型来更高效地处理数据。\n\n优先级队列是原始队列的变体之一。元素根据它们的优先级进行添加和移除。它是一种抽象数据类型，描述了一个元素带有优先级的容器。最高优先级的元素总是出现在队列的前端。如果该元素被移除，下一个高优先级元素就会出现。\n\
  \n优先级队列的现实生活例子包括：\n- 医院的患者（最紧急的病例优先治疗）。\n- 机场的旅客（商务舱优于经济舱）。\n- 用于任务调度的操作系统。\n\n\
  #### 为什么我们需要优先级队列？\n当我们需要根据重要性处理元素时，就会使用它，例如在 Dijkstra 算法或霍夫数据压缩中。\n\n### 实现\n\n\
  ```javascript\nclass PriorityQueue {\n  constructor() {\n    this.items = [];\n\
  \  }\n\n  // 容器\n  QueueElement(element, priority) {\n    this.element = element;\n\
  \    this.priority = priority;\n  }\n\n  // 在队列中添加新元素\n  enqueue(element, priority)\
  \ {\n    let queueElement = new QueueElement(element, priority);\n    let added\
  \ = false;\n\n    for (let i = 0; i < this.items.length; i++) {\n      // 如果新元素的优先级更高，则插入到该位置\n\
  \      if (queueElement.priority > this.items[i].priority) {\n        this.items.splice(i,\
  \ 0, queueElement);\n        added = true;\n        break;\n      }\n    }\n\n \
  \   // 如果元素没有被添加\n    // 则将其添加到队列的末尾\n    if (!added) {\n      this.items.push(queueElement);\n\
  \    }\n  }\n\n  // 从队列中移除元素\n  dequeue() {\n    return this.items.shift();\n  }\n\
  \n  // 返回队列中的第一个元素\n  front() {\n    return this.items[0];\n  }\n\n  // 返回队列中的最后一个元素\n\
  \  rear() {\n    return this.items[this.items.length - 1];\n  }\n\n  // 检查队列是否为空\n\
  \  isEmpty() {\n    return this.items.length === 0;\n  }\n\n  // 返回队列的大小\n  size()\
  \ {\n    return this.items.length;\n  }\n\n  // 打印队列\n  print() {\n    for (let\
  \ i = 0; i < this.items.length; i++) {\n      console.log(`${this.items[i].element}\
  \ - ${this.items[i].priority}`);\n    }\n  }\n}\n```\n\n\n\n\n\n# 实现 LRU 缓存\n\n\
  ## 什么是 LRU 缓存？\n\nLRU 缓存简称为 `Least Recently Used`（最久未使用使用）缓存，是一种在缓存满时用于从缓存中驱除元素为新元素腾空间的缓存策略。在添加新元素之前，它会先移除最久未使用的元素。\n\
  \n众所周知，缓存是计算机科学中的重要概念之一，因为它通过在内存中存储数据极大地提高了运行速度。因此，它可以存储单个元素或整个索引以优化。\n\n## LRU\
  \ 缓存是如何工作的？\n\n让我们通过一个包含 4 个元素的缓存示例（例如 1, 2, 3, 4）来理解 LRU 缓存的工作原理。\n\n为了向其中添加一个新元素（例如\
  \ 5），我们必须首先移除最久未使用的元素，在这种情况下是 1。\n\n现在，当你再次访问 2 时，它会再次移动到末尾，因为它现在是最近使用的元素，而 3 将变成最久未使用的元素。\n\
  \n## 在 Javascript 中实现 LRU 缓存？\n\n我们结合使用两种数据结构来实现 LRU 缓存。\n\n- `Queue`：使用 `doubly-linked\
  \ list`（双向链表）实现。最近使用的项靠近头部，最久使用的页面靠近尾部。\n- `HashMap`：以项目/页码为键（key），对应队列节点的地址为值（value）。\n\
  \n以下是在 LRU 缓存上形成的操作列表：\n\n- `get(key)`：返回给定项目/页码的缓存值。\n- `put(key, val)`：在缓存中添加一个新值。\n\
  - `use(key)`：使用现有值之一，并通过将被使用的项标记为最近使用来重新排列缓存。\n- `evict()`：从缓存中移除一个值。\n- `Insert(key,\
  \ val)`：在执行 `put` 时向缓存中添加值的辅助函数。\n\n### 基础函数\n\n```javascript\nclass Node {\n  constructor(key,\
  \ val) {\n    this.key = key;\n    this.val = val;\n    this.prev = null;\n    this.next\
  \ = null;\n  }\n}\n\nconst LRUCache = function(cap) {\n  this.cap = cap;\n  this.count\
  \ = 0;\n  this.head = null;\n  this.tail = null;\n  this.cache = new Map();\n  //other\
  \ methods will go here\n}\n```\n\n### Use(Key)\n\n- 首先从哈希表中获取键对应的队列节点。\n- 然后重新排列双向链表，将当前节点推到末尾（或尾部），将其标记为最近使用。\n\
  \n```javascript\n// 使用给定 key 的缓存并将其标记为最近使用\nthis.use = function(key) {\n  const\
  \ node = this.cache.get(key);\n  if (node === this.head) {\n    return;\n  } else\
  \ if (node === this.tail) {\n    node.prev.next = null;\n    this.tail = node.prev;\n\
  \    node.prev = null;\n    node.next = this.head;\n    this.head.prev = node;\n\
  \    this.head = node;\n  } else {\n    if (node.prev) {\n      node.prev.next =\
  \ node.next;\n    }\n    if (node.next) {\n      node.next.prev = node.prev;\n \
  \   }\n    node.next = this.head;\n    node.prev = null;\n    this.head.prev = node;\n\
  \    this.head = node;\n  }\n};\n```\n\n### Evict\n\n- 首先从哈希表中获取队列节点，然后将其移除该节点并重新排列所有节点。\n\
  - 同时从哈希表中删除它。\n\n```javascript\n// 移除最久未使用的缓存\nthis.evict = function() {\n  const\
  \ keyToEvict = this.tail ? this.tail.key : null;\n  if (!this.tail) {\n    return;\n\
  \  } else if (this.head === this.tail) {\n    this.head = null;\n    this.tail =\
  \ null;\n  } else {\n    this.tail.prev.next = null;\n    this.tail = this.tail.prev;\n\
  \  }\n  if (keyToEvict) {\n    this.count--;\n    this.cache.delete(keyToEvict);\n\
  \  }\n};\n```\n\n### Insert(key, val)\n\n在队列的适当位置添加新元素，并将其插入到哈希表中。\n\n```javascript\n\
  // 在队列中添加新缓存的辅助函数\nthis.insert = function(key, val) {\n  const node = new Node(key,\
  \ val);\n  this.count++;\n  this.cache.set(key, node);\n  if (!this.head) {\n  \
  \  this.head = node;\n    this.tail = node;\n  } else {\n    this.head.prev = node;\n\
  \    node.next = this.head;\n    this.head = node;\n  }\n};\n```\n\n### Put(key,\
  \ val)\n\n- 如果键已存在，则使用它并将其标记为最近使用。\n- 如果超过容量，则移除最久使用的项，然后插入新键。\n\n```javascript\n\
  // 在列表中添加新项\nthis.put = function(key, val) {\n  if (this.cache.has(key)) {\n   \
  \ const node = this.cache.get(key);\n    node.val = val;\n    this.use(key);\n \
  \ } else {\n    if (this.count >= this.cap) {\n      this.evict();\n    }\n    this.insert(key,\
  \ val);\n  }\n};\n```\n\n### Get(key)\n\n获取键对应的队列节点。\n\n```javascript\nthis.get\
  \ = function(key) {\n  const node = this.cache.get(key);\n  if (node) {\n    this.use(key);\n\
  \    return node.val;\n  }\n  return -1;\n};\n```\n\n### Display()\n\n按顺序打印所有项。\n\
  \n```javascript\nthis.display = function() {\n  let current = this.head;\n  while\
  \ (current) {\n    console.log(current.key);\n    current = current.next;\n  }\n\
  }\n```\n\n\n\n\n\n```javascript\nnode.next = this.head;\nthis.head = node;\n};\n\
  \n//显示列表\nthis.display = function() {\n  let current = this.head;\n  while (current)\
  \ {\n    console.log(current.key, current.val);\n    current = current.next;\n \
  \ }\n};\n```\n\n© JavaScript Interview Guide | learnersbucket.com | 129\n\n### 测试用例\n\
  输入:\n```javascript\nconst lru = new LRUCache(4);\nlru.put(1, 'a');\nlru.put(2, 'b');\n\
  lru.put(3, 'c');\nlru.put(4, 'd');\nlru.display();\nlru.use(2);\nlru.display();\n\
  ```\n输出:\n```text\n//LRU\n4\n\"d\"\n3\n\"c\"\n2\n\"b\"\n1\n\"a\"\n// 使用 2 后\n2\n\
  \"b\"\n4\n\"d\"\n3\n\"c\"\n1\n\"a\"\n```\n© JavaScript Interview Guide | learnersbucket.com\
  \ | 130\n\n### 实现防抖函数 (debounce)\n\n#### 什么是函数防抖？\n防抖（Debouncing）是一种在确保在给定时间内不会触发后续重复事件时，执行函数的方法或方式。\n\
  \n一个技术上的例子是，当我们在任何电子商务网站上搜索内容时，我们不希望在用户每输入一个字母时都触发搜索函数并向服务器发送请求。我们希望用户完成输入，然后等待一段指定的时间，看用户是否还会输入其他内容或是否已完成输入，然后再发送请求并返回结果。\n\
  \n过度调用函数会严重影响性能，并被认为是主要的障碍之一。\n\n### 实现\n```javascript\nconst debounce = (func,\
  \ delay) => {\n  // 用于存储实例的“私有”变量\n  // 闭包中的每个计时将被分配给它\n  let inDebounce;\n  //\
  \ debounce 返回一个新的匿名函数（闭包）\n  return function() {\n    // 为 setTimeout 引用上下文和参数\n\
  \    const context = this;\n    const args = arguments;\n    // 基础情况\n    // 清除超时以便为其分配新的超时\n\
  \    // 当事件被重复触发时，这有助于重置\n    clearTimeout(inDebounce);\n    // 设置新的超时并使用 apply\
  \ 调用原始函数\n    inDebounce = setTimeout(() => func.apply(context, args), delay);\n\
  \  };\n};\n```\n© JavaScript Interview Guide | learnersbucket.com | 131\n\n####\
  \ 解释\n我们创建了一个返回另一个函数的函数。外部函数使用一个变量来跟踪内部函数执行的 `timerId`。\n\n内部函数只在指定的时间窗口后才被调用，为了实现这一点，我们使用了\
  \ `setTimeout` 函数。\n\n我们存储了 `setTimeout` 函数的引用，以便在外部函数在指定时间之前再次调用时，我们可以清除它 `clearTimeout(inDebounce)`\
  \ 并再次调用它。\n\n如果是第一次调用，我们的函数将在延迟结束时执行。如果在延迟结束前再次调用并再次调用，延迟将重新开始。\n\n### 测试用例\n输入:\n\
  ```javascript\n// 打印鼠标位置\nconst onMouseMove = (e) => {\n  console.clear();\n  console.log(e.x,\
  \ e.y);\n}\n// 定义防抖后的鼠标移动函数\nconst debouncedMouseMove = debounce(onMouseMove, 50);\n\
  // 在每次鼠标移动时调用防抖函数\nwindow.addEventListener('mousemove', debouncedMouseMove);\n```\n\
  输出:\n```text\n300 400\n```\n© JavaScript Interview Guide | learnersbucket.com |\
  \ 132\n\n### 实现带即时执行标记 (Immediate Flag) 的防抖函数\n防抖是一种在确保在给定时间内不会触发后续重复事件时，执行函数的方法或方式。\n\
  \n在上一个例子中，我们看到了如何实现带延迟的经典 `debounce 函数`。在这次实现中，我们将添加一个名为 `immediate` 的额外标记，以便立即执行函数而无需任何进一步延迟。在初始执行后，在延迟之前它不会再次运行。\n\
  \n此标记是可选的，这意味着如果将其设置为 false，则防抖函数将正常运行。\n\n### 实现\n```javascript\nconst debounce\
  \ = (func, wait, immediate) => {\n  // 用于存储实例的“私有”变量\n  // 闭包中的每个计时将被分配给它\n  let\
  \ timeout;\n  // debounce 返回一个新的匿名函数（闭包）\n  return function() {\n    // 为 setTimeout\
  \ 引用上下文和参数\n    let context = this,\n    let args = arguments;\n    // 现在是否应该调用函数？如果\
  \ immediate 为 true\n    // 且已在超时中，那么答案是：是\n    const callNow = immediate && !timeout;\n\
  \    // 基础情况\n    // 清除超时以便为其分配新的超时。\n    // 当事件被重复触发时，这有助于重置\n    clearTimeout(timeout);\n\
  \    // 设置新的超时\n    timeout = setTimeout(function() {\n      // 在超时函数内部清除超时变量\n\
  \      // 这将会在 'immediate' 模式下允许下一次执行\n      timeout = null;\n      // 检查函数是否已带\
  \ immediate 标记运行过\n      if (!immediate) {\n        // 使用 apply 调用原始函数\n       \
  \ func.apply(context, args);\n      }\n    }, wait);\n    // 即时模式且没有等待计时器？立即执行函数\n\
  \    if (callNow) func.apply(context, args);\n  }\n```\n#### 解释\n我们创建了一个返回函数的函数。外部函数使用一个变量来跟踪内部函数执行的\
  \ `timerId`。\n\n内部函数只在指定的时间窗口后才被调用，为了实现这一点，我们使用了 `setTimeout` 函数。\n\n我们存储了 `setTimeout`\
  \ 函数的引用，以便在外部函数在指定时间之前再次调用时，我们可以清除它 `clearTimeout(inDebounce)` 并再次调用它。\n\n如果是第一次调用，我们的函数将在延迟结束时执行。如果在延迟结束前再次调用并再次调用，延迟将重新开始。\n\
  \n© JavaScript Interview Guide | learnersbucket.com | 133\n\n### 测试用例\n输入:\n```javascript\n\
  // 打印鼠标位置\nconst onMouseMove = (e) => {\n  console.clear();\n  console.log(e.x,\
  \ e.y);\n}\n// 定义防抖后的鼠标移动函数\nconst debouncedMouseMove = debounce(onMouseMove, 50);\n\
  // 在每次鼠标移动时调用防抖函数\nwindow.addEventListener('mousemove', debouncedMouseMove);\n```\n\
  输出:\n```text\n300 400\n```\n34\n\n### 实现节流函数 (throttling function)\n\n#### 什么是节流函数？\n\
  节流（Throttling）是一种在规定时间内限制函数执行/调用次数的方法/技术。\n\n应用程序中过度的函数调用影响性能。为了优化应用，我们需要正确处理这种情况。\n\
  \n在某些场景下，我们可能会在不需要时调用函数。例如，考虑在点击按钮时向服务器发送 API 用的场景。如果用户疯狂点击，这将每次点击都进行 API 调用。这不是我们想要的，我们希望限制可以进行的\
  \ API 调用次数。其他调用将在指定的时间间隔后才会进行。\n\n节流帮助我们控制函数调用的频率。\n\n### 实现\n```javascript\nconst\
  \ throttle = (func, limit) => {\n  // 跟踪计时 ID 和时间\n  let lastFunc;\n  let lastRan;\n\
  \  return function() {\n    // 获取上下文和参数\n    const context = this;\n    const args\
  \ = arguments;\n    // 如果尚未运行，则运行一次\n    if (!lastRan) {\n      func.apply(context,\
  \ args);\n      lastRan = Date.now();\n    } else {\n      // 重置计时器\n      clearTimeout(lastFunc);\n\
  \      // 再次启动\n      lastFunc = setTimeout(function() {\n        if ((Date.now()\
  \ - lastRan) >= limit) {\n          func.apply(context, args);\n          lastRan\
  \ = Date.now();\n        }\n      }, limit - (Date.now() - lastRan));\n    }\n \
  \ }\n}\n```\n\n### 测试用例\n输入:\n```javascript\nconst print = () => {\n  console.log(\"\
  hello\");\n}\nconst throttled = throttle(print, 2500);\nwindow.addEventListener('mousemove',\
  \ throttled, false);\n```\n输出:\n```text\n// 开始时 \"hello\"\n// 2500 毫秒后 \"hello\"\
  \n// 2500 毫秒后 \"hello\"\n```\n© JavaScript Interview Guide | learnersbucket.com\
