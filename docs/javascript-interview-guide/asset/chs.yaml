  // [object Array] (2)\n[1, 2]\n// 6th call after 2 seconds\n```\n\n# 解码字符串\n\n##\
  \ 题目描述\n给定一个字符串，编写一个程序来解码该字符串。该字符串采用特定模式：子字符串包裹在方括号中，且前面有一个数字。\n\n## 示例\n**输入:**\n\
  - `\"2[a2[b]]\"`\n- `\"3[b2[ca]]\"`\n\n**输出:**\n- `\"abbabb\"`\n- `\"bcacabcacabcaca\"\
  `\n\n这个问题可以通过使用两个[栈](https://learnersbucket.com/tutorials/algorithms/stack) 来解决。\n\
  \n- 我们将使用两个不同的栈：一个存储数字计数 `numStack`，另一个存储子字符串 `charStack`。\n- 我们遍历整个字符串的每个字符，并检查当前字符是否为数字，如果是，将其推入\
  \ `numStack`。\n- 否则，如果字符是左括号 `[`，则检查是否为其分配了计数数字。如果是，它可能已经在第一个条件中被推入了，因此只需将字符添加到\
  \ `charStack`；否则，将当前字符添加到 `charStack` 并将 `1` 推入 `numStack`，因为它只会被调用一次。\n- 如果字符是右括号\
  \ `]`，则从 `numStack` 获取（栈顶元素）计数，从 `charStack` 获取子字符串并进行解码，然后将解码后的字符串加回 `charStack`，这样在下一次迭代中，解码后的子字符串将与父字符串一起重复。\n\
  - 否则，字符是字母，因此将其添加到 `charStack`。\n- 最后，从 `charStack` 创建一个字符串（包含解码后的子字符串）并返回它。\n\n\
  ```javascript\nlet decodeString = (str) => {\n  let numStack = new Stack();\n  let\
  \ charStack = new Stack();\n  let decoded = \"\", temp = \"\";\n\n  for (let i =\
  \ 0; i < str.length; i++) {\n    let count = 0;\n    let val = str[i];\n    // 如果字符是数字则推入\
  \ numStack\n    if (/^\\d+$/.test(val)) {\n      numStack.push(val);\n    } else\
  \ if (val === '[') {\n      // 否则如果左括号且上一个字符是数字\n      // 那么它已经在上面的 (if 条件) 中被添加到\
  \ numStack\n      // 只需将字符添加到 charStack\n      if (/^\\d+$/.test(str[i - 1])) {\n\
  \        charStack.push(str[i]);\n      } else {\n        // 否则向 numstack 推入 1\n\
  \        // 并向 charStack 推入字符\n        charStack.push(str[i]);\n        numStack.push(1);\n\
  \      }\n    } else if (val === ']') {\n      // 如果是右括号则重置 temp 和 count\n     \
  \ temp = \"\";\n      count = 0;\n      // 从 numStack 获取计数\n      count = !numStack.isEmpty()\
  \ && numStack.pop();\n      // 从 charStack 获取子 Str\n      while (!charStack.isEmpty()\
  \ && charStack.peek() !== '[') {\n        temp = charStack.pop() + temp;\n     \
  \ }\n      // 从 charStack 移除 '[' 字符\n      if (!charStack.isEmpty() && charStack.peek()\
  \ === '[') {\n        charStack.pop();\n      }\n      // 创建重复的 subStr\n      decoded\
  \ = temp.repeat(count);\n      // 将新创建的 subStr 推入 charStack\n      for (let j =\
  \ 0; j < decoded.length; j++) {\n        charStack.push(decoded[j]);\n      }\n\
  \      // 重置字符串\n    } else {\n      // 字母则添加到 charStack\n      charStack.push(val);\n\
  \    }\n  }\n  // 从 charStack 构建字符串\n  while (!charStack.isEmpty()) {\n    decoded\
  \ = charStack.pop() + decoded;\n  }\n  // 返回字符串\n  return decoded;\n}\n```\n\n###\
  \ 测试用例\n**输入:**\n```javascript\nconsole.log(\"2[a2[b]]\");\nconsole.log(\"3[b2[ca]]\"\
  );\n```\n**输出:**\n```text\nabb\nbcacabcacabcaca\n```\n\n# Trie 数据结构\n\nTrie，也称为字典树或前缀树，是一种[树数据结构](https://learnersbucket.com/tutorials/data-structures/tree-data-structure)，用于存储字符串键的关联数组。\n\
  \n## 什么是 Trie 数据结构？\nTrie 由 René de Briandais 在 1959 年提出，专门解决表示集合的问题。术语“Trie”源于检索，通常读作“try”。\n\
  \n### Trie 的操作\n- `insert(word)`：添加新单词。\n- `remove(word)`：删除单词。\n- `contains(word)`：检查\
  \ Trie 是否包含该单词。\n- `find(prefix)`：返回所有带前缀的单词。\n\n## 实现 Trie 数据结构\n每个 Trie 都有一个空根节点，并与其他节点有链接（或引用）。因此，Trie\
  \ 的大小与其可能表示的所有值的大小直接相关。\n\n### 基础结构\n我们需要一个 `TrieNode` 对象来向 Trie 插入新单词，这将代表一个全新的\
  \ Trie。\n\n```javascript\n// 开始 TrieNode\nconst TrieNode = function (key) {\n  //\
  \ \"key\" 值将是序列中的字符\n  this.key = key;\n  // 我们保留指向父节点的引用\n  this.parent = null;\n\
  \  // 我们拥有子节点的哈希\n  this.children = {};\n  // 检查节点是否在末尾\n  this.end = false;\n\n\
  \  this.getWord = function() {\n    let output = [];\n    let node = this;\n   \
  \ while (node !== null) {\n      output.unshift(node.key);\n      node = node.parent;\n\
  \    }\n    return output.join('');\n  };\n}\n\nconst Trie = function () {\n  this.root\
  \ = new TrieNode(null);\n  //其他方法将在此处\n}\n```\n\n### 在 Trie 中插入单词\n要在 Trie 中插入新单词，我们需要检查两点：\n\
  - 检查需要添加的单词是否已存在于此 Trie 中。\n- 接下来，如果我们已经遍历了该单词所在的分支且单词尚不存在，我们将在单词应该所在的节点中插入一个值。\n\
  \n```javascript\n// 将单词插入到 trie 中\nthis.insert = function (word) {\n  let node =\
  \ this.root;\n  // 我们从根节点开始\n```\n\n\n\n```javascript\n// 遍历单词中的每一个字符\nfor (let\
  \ i = 0; i < word.length; i++) {\n  // 检查 children 中是否存在字符节点。\n  if (!node.children[word[i]])\
  \ {\n    // 如果不存在，则创建它。\n    node.children[word[i]] = new TrieNode(word[i]);\n \
  \   // 我们也将父节点赋值给子节点\n    node.children[word[i]].parent = node;\n  }\n  // 继续进入\
  \ Trie 的下一深度。\n  node = node.children[word[i]];\n  // 最后，检查是否是单词的最后一个。\n  if (i\
  \ == word.length - 1) {\n    // 如果是，将结束标记设置为 true。\n    node.end = true;\n  }\n\
  }\n```\n\n### 在 Trie 中查找单词\n\n要检查 Trie 是否包含给定单词：\n\n- 遍历单词中的每一个字符。检查 `children`\
  \ 中是否存在字符节点。\n- 如果存在，继续进入 Trie 的下一深度。\n- 否则返回 `false`，因为它不是一个有效的单词。\n- 在最后返回该单词。\n\
  \n```javascript\n// 检查是否包含一个完整的单词。\nthis.contains = function(word) {\n  let node\
  \ = this.root;\n  // 遍历单词中的每一个字符\n  for (let i = 0; i < word.length; i++) {\n  \
  \  // 检查 children 中是否存在字符节点。\n    if (node.children[word[i]]) {\n      // 如果存在，继续进入\
  \ Trie 的下一深度。\n      node = node.children[word[i]];\n    } else {\n      // 不存在，返回\
  \ false，因为它不是一个有效的单词。\n      return false;\n    }\n  }\n  // 我们已经遍历完了所有的字符，但它是一个完整的单词吗？\n\
  \  return node.end;\n};\n```\n\n### 在 Trie 中查找以给定前缀的单词\n\n要找到所有具有给定前缀的单词，我们需要执行两个操作：\n\
  \n- 首先，确保该前缀确实有单词。\n- 第二，找到所有带有给定前缀的单词。\n\n```javascript\n// 返回所有带有给定前缀的单词\nthis.find\
  \ = function(prefix) {\n  let node = this.root;\n  let output = [];\n  // 遍历前缀中的每一个字符\n\
  \  for (let i = 0; i < prefix.length; i++) {\n    // 确保前缀确实有单词\n    if (node.children[prefix[i]])\
  \ {\n      node = node.children[prefix[i]];\n    } else {\n      // 没有了。直接返回。\n\
  \      return output;\n    }\n  }\n  // 递归地查找节点中的所有单词\n  findAllWords(node, output);\n\
  \  return output;\n};\n\n// 递归查找给定节点中所有单词的函数\nconst findAllWords = (node, arr) =>\
  \ {\n  // 基础情况，如果节点是一个单词，则将其推入输出数组\n  if (node.end) {\n    arr.unshift(node.getWord());\n\
  \  }\n  // 遍历每个子节点，调用递归\n  for (let child in node.children) {\n    findAllWords(node.children[child],\
  \ arr);\n  }\n};\n```\n\n### 从 Trie 中删除单词\n\n要删除一个键，我们并不删除该键对应的节点，因为它可能包含某些仍然包含键的子节点。相反，我们只需要找到它并将其值设置为\
  \ `null`。\n\n然而，为了提高效率，如果与键对应的节点没有子节点，或者其所有子节点的值均为 `null`，我们也可以删除整个节点。\n\n```javascript\n\
  // 指定的单词\nthis.remove = function(word) {\n  let root = this.root;\n  if (!word)\
  \ return;\n  // 递归地查找并移除单词\n  const removeWord = (node, word) => {\n    // 检查当前节点是否包含该单词\n\
  \    if (node.end && node.getWord() === word) {\n      // 检查节点是否有子节点\n      let\
  \ hasChildren = Object.keys(node.children).length > 0;\n      // 如果有子节点，我们只需要取消结束节点的标记\n\
  \      // 它标记单词的结束。这样我们就不会删除包含\n      // 传入单词的单词。\n      if (hasChildren) {\n  \
  \      node.end = false;\n      } else {\n        // 通过获取父节点并将子字典置为空来移除单词\n    \
  \    node.parent.children = {};\n      }\n      return true;\n    }\n    // 从所有子节点递归移除单词\n\
  \    for (let key in node.children) {\n      removeWord(node.children[key], word)\n\
  \    }\n    return false;\n  };\n  // 对根节点调用移除单词\n  removeWord(root, word);\n};\n\
  ```\n\n### Trie 数据结构的完整代码\n\n```javascript\n// 从 TrieNode 开始\nconst TrieNode = function(key)\
  \ {\n  // \"key\" 值将是序列中的字符\n  this.key = key;\n  // 保留父节点的引用\n  this.parent = null;\n\
  \  // 拥有子节点的哈希表\n  this.children = {};\n  // 检查节点是否在结尾\n  this.end = false;\n  this.getWord\
  \ = function() {\n    let output = [];\n    let node = this;\n    while (node !==\
  \ null) {\n      output.unshift(node.key);\n      node = node.parent;\n    }\n \
  \   return output.join('');\n  };\n};\n\nconst Trie = function() {\n  this.root\
  \ = new TrieNode(null);\n  // 将单词插入 tri 中。\n  this.insert = function(word) {\n \
