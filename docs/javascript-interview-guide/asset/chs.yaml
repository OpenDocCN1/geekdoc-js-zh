  console.log(JSON.parse('[3,\"false\",null]'));\nconsole.log(JSON.parse('{\"x\":\
  \ [10,null,null]}'));\nconsole.log(JSON.parse('[]'));\n```\n\n### 字符串的 HTML 编码\n\
  \n**问题描述** - 给定一个字符串和一个表示该字符串从给定索引到给定标签的 HTML 编码的数组。返回 HTML 编码后的字符串。\n\n**示例**\n\
  **输入：**\n```javascript\nconst str = 'Hello, world';\nconst styleArr = [[0, 2, 'i'],\
  \ [4, 9, 'b'], [7, 10, 'u']];\n```\n**输出：**\n`'<i>Hel</i>l<b>o, w<u>orl</u></b><u>d</u>'`\n\
  \n**注意** – `<u>` 标签被放在 `<b>` 标签之前和之后，因为插入索引与其重叠。\n\n这是 [WYSIWYG](https://en.wikipedia.org/wiki/WYSIWYG)\
  \ 编辑器中最常见的功能之一，在编辑器中你编写普通文本并对其应用样式，最后它会被转换为 HTML 编码。\n\n解决此问题有两种方法：\n- 第一种极其简单，因为大部分工作由\
  \ JavaScript 的内置方法完成。\n- 第二种方法中，我们编写编码的完整逻辑。\n\n让我们先看第二种方法，因为在面试中你通常会被要求实现这种方式。\n\
  \n#### 字符串 HTML 编码的自定义函数\n\n样式可能会发生重叠，因此一个标签可能会覆盖另一个标签，在这种情况下，我们必须关闭重叠的标签并重新打开。\n\
  \n**输入：**\n```javascript\nconst str = \"Hello, World\";\nconst style = [[0, 2, 'i],[1,\
  \ 3, 'b']];\n```\n**输出：**\n`<i>H<b>el</b></i><b>l</b>, World` // b 从 1 开始到 3 ，i\
  \ 在 b 之间。\n\n如你所见，在上面的示例中 `b` 是重叠的，因此在字符串的第 2 个字符处关闭并在第 3 处重新打开。\n\n我们可以借助优先级队列和栈来解决这个问题：\n\
  - 根据它们范围差异的优先级（`endIndex – startIndex`）对起始索引处的样式进行聚合。这样会创建最长的标签。\n- 现在使用 `stack`\
  \ 跟踪标签的开启和关闭。\n- 如果当前样式的结束索引大于上一个，则由于存在重叠，创建一个新标签并将此新条目推回栈中，并在下一次迭代中创建此标签。\n- 最后返回栈顶端条目的字符串。\n\
  \n# 优先级队列\n\n我们不会使用优先级队列的完整实现，而是使用辅助函数，它向数组中添加新项并根据顺序进行升序或降序排序。\n\n```javascript\n\
  // 辅助函数充当优先级队列\n// 添加标签并根据开始和结束之间的差异\n// 将它们按降序排序\nfunction addAndSort(track, index,\
  \ data) {\n  if\n```\n\n\n\n\n```javascript\n(!track[index]) track[index] = [];\n\
  track[index] = [...track[index], data];\ntrack[index].sort((a, b) => a.getRange()\
  \ > b.getRange());\n```\n\n## 栈 (Stack)\n\n栈数据结构的简单实现，包含所需的方法。\n\n```javascript\n\
  function Stack() {\n  let items = [];\n  let top = 0;\n\n  // 将元素推入栈中\n  this.push\
  \ = function(element) {\n    items[top++] = element;\n  };\n\n  // 从栈中弹出元素\n  this.pop\
  \ = function() {\n    return items[--top];\n  };\n\n  // 查看栈顶元素但不将其弹出\n  this.peek\
  \ = function() {\n    return items[top - 1];\n  };\n}\n```\n\n### Tag 方法\n\n一个为每个样式条目及其对应项创建新标签的辅助函数，也有助于获取范围以便在优先级队列中进行方便的处理。我们将其推入优先级队列并进行排序。\n\
  \n```javascript\n// 用于形成标签的辅助函数\n// 并追踪字符串\nfunction Tag(start, end, tag) {\n  this.start\
  \ = start;\n  this.end = end;\n  this.tag = tag;\n  this.text = \"\";\n\n  this.getRange\
  \ = () => {\n    return this.end - this.start;\n  };\n}\n```\n\n### 编码 (主) 方法\n\n\
  在此方法中，我们逐步执行所有的编码步骤。\n\n- 创建一个与输入字符串长度相同的空数组 `trace`。\n- 遍历样式并为每个条目创建一个新标签。\n- 在样式聚合的起始索引处，根据范围的差异按降序排列，将公共标签汇总到优先级队列中。\n\
  - 将这些优先级队列添加到 `trace` 中样式的起始索引处。\n- 创建一个新的栈并添加一个具有最大范围的初始 `Tag`，即 `Tag(start = 0,\
  \ end = Number.MAX_VALUE, tag = \"\")`。\n- 遍历到输入字符串长度，获取每个索引处从 `trace` 获取的标签，如果存在，则遍历这些优先级标签。\n\
  - 为队列中的每个标签创建起始 HTML 标签并将其推入栈。检查标签的当前结束索引是否大于栈中前一个索引，如果是，则创建一个新标签并将其推入优先级队列。\n-\
  \ 在循环结束时，关闭给定索引处的所有 HTML 标签。\n\n```javascript\nfunction parse(str, markups) {\n\
  \  // 为字符串的所有索引\n  // 创建一个空数组\n  const track = new Array(str.length).fill(null);\n\
  \n  // 在 markups 中提到的每个文本的\n  // 起始处添加标签\n  for (let markup of markups) {\n    const\
  \ [start, end, tag] = markup;\n    addAndSort(track, start, new Tag(start, end,\
  \ tag));\n  }\n\n  // 创建一个新的栈\n  const html = new Stack();\n  // 初始化一个具有最大范围\n \
  \ // 和空字符串的新标签\n  html.push(new Tag(0, Number.MAX_VALUE, \"\"));\n\n  // 遍历字符串的每个字符\n\
  \  for (let i = 0; i < str.length; i++) {\n    // 检查起始标签并添加它们\n    while (track[i]\
  \ && track[i].length > 0) {\n      const cur = track[i].shift();\n      cur.text\
  \ = `<${cur.tag}>`;\n      // 例如在 [0, 2, 'i'], [1, 3, 'b']\n      // b 从 1 开始到 3\
  \ 结束，i\n      // 在 b 之间。\n      // <i> <b> </b> </i> <b> </b>\n      // 如果嵌套标签的结束位置比\n\
  \      // 父级标签要大，\n      // 则拆分标签\n      // 并剩余的拆分部分插入到\n      // 父标签之后的桶\n    \
  \  if (cur.end > html.peek().end) {\n        const split = new Tag(html.peek().end\
  \ + 1, cur.end, cur.tag);\n        cur.end = html.peek().end;\n        addAndSort(track,\
  \ html.peek().end + 1, split);\n      }\n      // 推入新标签\n      html.push(cur);\n\
  \    }\n    // 将当前字符添加到当前\n    // 最顶部的标签中\n    html.peek().text += str[i];\n   \
  \ // 检查结束标签并关闭它们。\n    while (html.peek().end === i) {\n      html.peek().text +=\
  \ `</${html.peek().tag}>`;\n      const temp = html.pop().text;\n      html.peek().text\
  \ += temp;\n    }\n  }\n  // 返回顶部的\n  return html.pop().text;\n}\n```\n\n### 测试用例\n\
  \n输入：\n`const encoded = parse('Hello, World', [[0, 2, \"i\"], [7, 10, \"u\"], [4,\
  \ 9, \"b\"], [2, 7, \"i\"], [7, 9, \"u\"]]);`\n`console.log(encoded);`\n\n输出：\n\
  `\"<i>He<i><b>llo, <b>World</b></b></b></b></i>\"`\n\n---\n\n## DOMParser() l\n\n\
  使用 [`DOMParser()`](https://developer.mozilla.org/en-US/docs/Web/API/DOMParser)，`DOMParser()`\
  \ 解析 HTML 字符串并生成 DOM 树，从而允许我们使用 DOM API 来操作它，而不需要在文档中渲染它。这在处理动态生成的内容时非常有用。\n\n\n\
  \n\n\n© JavaScript 面试指南 | learnersbucket.com\n\n## 聚合输入值\n\n## 题目描述\n在一个容器内有多个不同名称（name）和值（value）的输入元素。根据名称聚合这些输入元素的值。\n\
  \n## 示例\n输入：\n```html\n<form id=\"parent\">\n  <input type=\"text\" name=\"a.c\"\
  \ value=\"1\"/>\n  <input type=\"text\" name=\"a.b.d\" value=\"2\"/>\n  <input type=\"\
  text\" name=\"a.b.e\" value=\"3\"/>\n</form>\n```\n输出：\n```json\n{\n  \"a\": {\n\
  \    \"c\": \"1\",\n    \"b\": {\n      \"d\": \"2\",\n      \"e\": \"3\"\n    }\n\
  \  }\n}\n```\n\n解决此问题的方法很简单：创建一个函数，接收父元素的 `id` 作为输入，并获取该父元素下的所有 input 元素。\n\n现在使用\
  \ `Array.reduce()` 我们可以根据每个输入的键（key）聚合的值。我们需要做的是：\n\n- 按点 `.` 拆分名称并将所有键获取为数组。\n\
  - 检查该键是否存在，如果不存在，则创建一个空对象并赋值给它。\n- 如果该键是数组中的最后一个，则将值赋值给它。\n- 最后将此新对象的引用更新到当前对象。\n\
  \n```javascript\nconst aggregateValues = (id) => {\n  // 获取元素\n  const element =\
  \ document.querySelector(`#${id}`);\n  // 获取其下方的所有 input 元素\n  // 根据需求更改类型\n  //\
  \ 可以作为参数传递\n  const inputs = element.querySelectorAll('input[type=\"text\"]');\n\
  \n  // 聚合输入值\n  return Array.from(inputs).reduce((prev, current) => {\n    // 拆分名称并形成键的数组\n\
  \    const names = current.name.split(\".\");\n\n    // 存储上一个对象\n    // 用于遍历对象\n\
  \    // 父 -> 子 -> 孙子\n    let temp = prev;\n\n    // 遍历名称中的每个键\n    names.forEach((name,\
  \ index) => {\n      // 如果键不存在，\n      // 创建一个空对象\n      if (!(name in temp)) {\n\
  \        temp[name] = {};\n      }\n      // 如果当前键是最后一个\n      // 将值赋值给它\n     \
  \ if (index == names.length - 1) {\n        temp[name] = current.value;\n      }\n\
  \      // 将下一个值引用到当前\n      temp = temp[name];\n    });\n    // 返回生成的对象\n    return\
  \ prev;\n  }, {});\n}\n```\n\n### 测试用例\n输入：\n```html\n<form id=\"parent\">\n  <input\
  \ type=\"text\" name=\"a.c\" value=\"1\"/>\n  <input type=\"text\" name=\"a.b.d\"\
  \ value=\"2\"/>\n  <input type=\"text\" name=\"a.b.e\" value=\"3\"/>\n</form>\n\
  ```\n```javascript\nconsole.log(aggregateValues('parent'));\n```\n输出：\n```json\n\
  {\n  \"a\": {\n    \"c\": \"1\",\n    \"b\": {\n      \"d\": \"2\",\n      \"e\"\
  : \"3\"\n    }\n  }\n}\n```\n\n## Fetch 请求与响应拦截器\n\n## 题目描述\n为 `fetch` 添加请求和响应拦截器方法，用于监控每次请求和响应。\n\
  \n## 示例\n```javascript\nconst requestInterceptor = (requestArguments) => {\n  console.log(\"\
  Before request\");\n}\nconst responseInterceptor = (response) => {\n  console.log(\"\
  After response\");\n}\nfetch('https://jsonplaceholder.typicode.com/todos/1')\n \
  \ .then(response => response.json())\n  .then(json => console.log(json))\n// \"\
  Before request\"\n// \"After response\"\n/*\n{\n  \"userId\": 1,\n  \"id\": 1,\n\
  \  \"title\": \"delectus aut autem\",\n  \"completed\": false\n}\n*/\n```\n\nAxios\
  \ 是最流行的网络请求库之一，它自带了拦截器 `axios.interceptor.request` 和 `axios.interceptor.response`，可以用于在任何请求发送之前和每个响应接收之后进行监控并执行操作。\n\
  \n例如，你可以添加一个响应拦截器来监控服务器是否返回了 401 未授权，如果是，则从应用程序中注销用户并重置状态。\n\n我们可以通过重写现有的 `fetch`\
  \ 方法来实现相同的功能。我们需要做的只是将原始 `fetch` 方法存储在变量中并进行重写。\n\n在 `window` 对象上创建两个方法（以便全局可用），`requestInterceptor`\
  \ 和 `responseInterceptor`。在每次请求之前，将参数传递给 `requestInterceptor` 并获取其返回的更新值，将其进一步传递给原始\
  \ `fetch` 方法。同样，在每次响应之后，将响应传递给 `responseInterceptor` 并返回其更新后的值。\n\n```javascript\n\
  // 存储原始 fetch\nconst originalFetch = window.fetch;\n\n// 请求拦截器\n// 执行所有请求前的操作\n\
  window.requestInterceptor = (args) => {\n  // 你的操作在这里\n  return args;\n}\n// 响应拦截器\n\
  // 执行所有响应后的操作\nwindow.responseInterceptor = (response) => {\n  // 你的操作在这里\n  return\
  \ response;\n}\n// 重写原始 fetch\nwindow.fetch = async (...args) => {\n  // 请求拦截器\n\
  \  // 将 args 传递给请求拦截器\n  args = requestInterceptor(args);\n  // 将更新后的 args 传递给 fetch\n\
  \  let response = await originalFetch(...args);\n  // 响应拦截器\n  // 将 response 传递给响应拦截器\n\
  \  response = responseInterceptor(response);\n  // 返回更新后的响应\n  return response;\n\
  };\n```\n\n### 测试用例\n如你所示，在 `requestInterceptor` 中我们手动设置了页码，在 `responseInterceptor`\
  \ 中我们返回了解析后的 JSON 值。\n\n输入：\n```javascript\n// 请求拦截器\n// 执行所有请求前的操作\nwindow.requestInterceptor\
  \ = (args) => {\n  //原始请求不包含分页信息\n  // 在拦截器中分配分页\n  args[0] = args[0] + \"2\";\n\
  \  return args;\n}\n// 响应拦截器\n// 执行所有响应后的操作\nwindow.responseInterceptor = (response)\
  \ => {\n  // 将值转换为 json\n  // 避免重复解析\n  return response.json();\n}\nfetch('https://jsonplaceholder.typicode.com/todos/')\n\
  \  .then(json => console.log(json));\n```\n输出：\n```json\n{\n  \"userId\": 1,\n \
  \ \"id\": 2,\n  \"title\": \"quis ut nam facilis et officia qui\",\n  \"completed\"\
  : false\n}\n```\n\n## 带过期时间的缓存 API 调用\n\n## 题目描述\n在 JavaScript 中实现一个函数，用于在指定时间内缓存\
  \ API 响应。如果在此时间内进行了新的调用，则将返回缓存的响应，否则将发起新的 API 调用。\n\n## 示例\n```javascript\nconst\
  \ call = cachedApiCall(1500);\n// 第一次调用\n// 将进行 API 调用并缓存其响应\ncall('https://jsonplaceholder.typicode.com/todos/1',\
  \ {})\n  .then(a => console.log(a));\n// \"making new api call\"\n/*\n{\n  \"userId\"\
  : 1,\n  \"id\": 1,\n  \"title\": \"delectus aut autem\",\n  \"completed\": false\n\
  }\n*/\n// 将返回缓存响应\n// 它将非常快\nsetTimeout(() => {\n  call('https://jsonplaceholder.typicode.com/todos/1',\
  \ {})\n    .then(a => console.log(a));\n}, 700);\n/*\n{\n  \"userId\": 1,\n  \"\
  id\": 1,\n  \"title\": \"delectus aut autem\",\n  \"completed\": false\n}\n*/\n\
  // 发起新的 API 调用\n// 因为缓存条目的已过期\nsetTimeout(() => {\n  call('https://jsonplaceholder.typicode.com/todos/1',\
  \ {})\n    .then(a => console.log(a));\n}, 2000);\n// \"making new api call\"\n\
  /*\n{\n  \"userId\": 1,\n  \"id\": 1,\n  \"title\": \"delectus aut autem\",\n  \"\
  completed\": false\n}\n*/\n```\n\n我们可以通过构建闭包来实现此函数。外部函数接收时间并返回一个异步内部函数，该内部函数接收执行\
  \ API 调用的参数。在内部函数中，我们将根据参数创建一个新的唯一键来缓存值。使用该键从缓存中获取条目。如果不存在条目或条目时间过期，则发起新的 API 调用。否则，返回条目的值。为了生成键和发起\
  \ API 调用，我们将使用两个辅助函数。\n\n\n\n\n\n# 生成唯一键\n\n```javascript\n// helper function to\
  \ create a key from the input\nconst generateKey = (path, config) => {\n  const\
  \ key = Object.keys(config)\n    .sort((a, b) => a.localeCompare(b))\n    .map((k)\
  \ => k + \":\" + config[k].toString())\n    .join(\"&\");\n  return path + key;\n\
  };\n```\n\n# 调用 API\n\n```javascript\n// helper function to make api call\nconst\
  \ makeApiCall = async (path, config) => {\n  try {\n    let response = await fetch(path,\
  \ config);\n    response = await response.json();\n    return response;\n  } catch\
  \ (e) {\n    console.log(\"error \" + e);\n  }\n  return null;\n};\n```\n\n# 缓存\
  \ API 用的主函数\n\n```javascript\nconst cachedApiCall = (time) => {\n  // to cache data\n\
  \  const cache = {};\n  // return a new function\n  return async function (path,\
  \ config = {}) {\n    // get the key\n    const key = generateKey(path, config);\n\
  \    // get the value of the key\n    let entry = cache[key];\n    // if there is\
  \ no cached data or the value is expired make a new API call\n    if (!entry ||\
  \ Date.now() > entry.expiryTime) {\n      console.log(\"making new api call\");\n\
  \      // store the new value in the cache\n      try {\n        const value = await\
  \ makeApiCall(path, config);\n        cache[key] = { value, expiryTime: Date.now()\
  \ + time };\n      } catch (e) {\n        console.log(error);\n      }\n    }\n\
  \    //return the cache\n    return cache[key].value;\n  }\n};\n```\n\n### 测试用例\n\
  \n```javascript\nconst call = cachedApiCall(1500);\n// 第一次调用 - 将发起 API 调用并缓存其响应\n\
  call('https://jsonplaceholder.typicode.com/todos/1', {}).then((a) => console.log(a));\n\
  //\"正在发起新的 API 调用\" \n/*\n{\n  \"userId\": 1,\n  \"id\": 1,\n  \"title\": \"delectus\
  \ aut autem\",\n  \"completed\": false\n}\n*/\n// 返回缓存的响应 - 速度会很快\nsetTimeout(()\
  \ => {\n  call('https://jsonplaceholder.typicode.com/todos/1', {}).then((a) => console.log(a));\n\
  }, 700);\n/*\n{\n  \"userId\": 1,\n  \"id\": 1,\n  \"title\": \"delectus aut autem\"\
  ,\n  \"completed\": false\n}\n*/\n// 因为缓存条目的已过期，将发起新的 API 调用\nsetTimeout(() => {\n\
  \  call('https://jsonplaceholder.typicode.com/todos/1', {}).then((a) => console.log(a));\n\
  }, 2000);\n//\"正在发起新的 API 调用\"\n/*\n{\n  \"userId\": 1,\n  \"id\": 1,\n  \"title\"\
  : \"delectus aut autem\",\n  \"completed\": false\n}\n*/\n```\n\n# `getElementByClassName()`\
  \ 的 Polyfill\n\n## 问题描述\n编写一个自定义函数来在 DOM 中查找所有具有给定类名的元素。\n\n## 示例\n**输入：**\n```html\n\
  <div class='a' id=\"root\">\n  <div class='b' id='b-1'>\n    <div class='a' id='a-2'>\n\
  \      <div class='d' id='d-1'></div>\n    </div>\n    <div class='c' id='c-1'>\n\
  \      <div class='a' id='a-3'>\n        <div class='d' id='d-2'></div>\n      </div>\n\
  \    </div>\n  </div>\n</div>\n```\n`findByClass('a')`\n\n**输出：**\n```html\n[\n\
  \  <div class=\"a\" id=\"root\">\n    <div class=\"b\" id=\"b-1\">\n      <div class=\"\
  a\" id=\"a-2\">\n        <div class=\"d\" id=\"d-1\"></div>\n      </div>\n    \
  \  <div class=\"c\" id=\"c-1\">\n        <div class=\"a\" id=\"a-3\">\n        \
  \  <div class=\"d\" id=\"d-2\"></div>\n        </div>\n      </div>\n    </div>\n\
  \  </div>,\n  <div class=\"a\" id=\"a-2\">\n    <div class=\"d\" id=\"d-1\"></div>\n\
  \  </div>,\n  <div class=\"a\" id=\"a-3\">\n    <div class=\"d\" id=\"d-2\"></div>\n\
  \  </div>\n]\n```\n\n这是我们可以采用的方法之一，因为 DOM 元素可以有多个类，我们需要做的只是从 `body` 或根元素开始，检查当前节点的\
  \ `classList` 是否包含该类。\n\n如果包含，则将节点推入结果中。之后遍历该节点的所有子元素，并检查每个子元素的 `classList` 中是否包含该类。\n\
  \n我们可以对每个子元素递归调用同一个函数，它将调用它们的子元素，以此类推，执行测试并返回结果。\n\n这种遍历模式被称为 DFS ([深度优先搜索](https://learnersbucket.com/tutorials/data-structures/tree-data-structure-in-javascript))。\n\
  \n```javascript\nfunction findByClass(class) {\n  // 获取根元素，可以从 body 开始\n  const\
  \ root = document.body;\n  // 使用 dfs 执行搜索的辅助函数\n  function search(node) {\n    //\
  \ 存储结果\n    let result = [];\n    // 如果元素包含该类名\n    if (node.classList.contains(class))\
  \ {\n      result.push(node);\n    }\n    // 递归搜索元素的所有子元素\n    for (const element\
  \ of node.children) {\n      // 将递归搜索的结果合并到实际结果中\n      const res = search(element);\n\
  \      result = result.concat(res);\n    }\n    // 返回结果\n    return result;\n  }\n\
  \  // 初始化搜索并返回结果\n  return search(root);\n}\n```\n\n\n\n\n\n```javascript\n// 获取当前的类名\n\
  \nconst targetClass = classNames[index];\n\n// 如果是 classNames 中的最后一个类\n// 并且元素包含该类\n\
  // 则将元素添加到结果中\nif (index === classNames.length - 1 && element.classList.contains(targetClass))\
  \ {\n  result.push(element);\n  return;\n}\n\n// 遍历元素的每个孩子\nfor (const child of\
  \ element.children) {\n  // 如果子元素包含该类\n  // 递归遍历并在子元素中搜索\n  // 下一个类\n  // 从而将索引加一\n\
  \  if (element.classList.contains(targetClass)) {\n    traverseDOM(child, classNames,\
  \ index + 1, result);\n  }\n  // 否则从子元素中重新开始搜索\n  else {\n    traverseDOM(child,\
  \ classNames, 0, result);\n  }\n}\n```\n\n### 测试用例\n\n输入:\n```html\n<div class=\"\
  a\" id=\"root\">\n  <div class=\"b\" id=\"b-1\">\n    <div class=\"c\" id=\"c-1\"\
  ></div>\n    <div class=\"c\" id=\"c-2\"></div>\n  </div>\n  <div class=\"b\" id=\"\
  b-2\">\n    <div class=\"c\" id=\"c-3\"></div>\n  </div>\n</div>\n```\n```javascript\n\
  console.log(getByClassNameHierarchy(document.getElementById('root'), 'a>b>c'));\n\
  ```\n\n输出:\n```json\n[\n  <div class=\"c\" id=\"c-1\"></div>\n  <div class=\"c\"\
  \ id=\"c-2\"></div>\n  <div class=\"c\" id=\"c-3\"></div>\n]\n```\n\n---\n\n###\
  \ 查找具有给定颜色属性的元素\n\n## 题目描述\n编写一个函数来查找所有给定颜色的元素。这里的颜色可以任何格式提供，例如纯文本（`white`）、HEX\
  \ 值（`#fff` 或 `#ffffff`）或 RGB 值（`RGB(255, 255, 255)`）。\n\n## 示例\n输入:\n```html\n<div\
  \ id=\"root\">\n  <span style=\"color:#fff;\">1</span>\n  <span style=\"color:#eee;\"\
  >2</span>\n  <span style=\"color:white;\">3</span>\n  <span style=\"color:rgb(255,\
  \ 255, 255);\">4</span>\n</div>\n```\n```javascript\nfindElementByColor(document.getElementById('root'),\
  \ 'rgb(255, 255, 255)');\n```\n输出:\n```json\n[\n  <span style=\"color:#fff;\">1</span>\n\
  \  <span style=\"color:white;\">3</span>\n  <span style=\"color:rgb(255, 255, 255);\"\
  >4</span>\n]\n```\n\n这个问题中最具挑战性的部分是将颜色值转换为可用于比较的单一格式。\n\n为了实现这一点，我们可以创建一个函数，它临时创建一个新元素并将输入颜色作为其样式应用，然后使用\
  \ `getComputedStyle()` 方法获取颜色的 RGB 值并将其转换为 HEX 代码进行比较。\n\n```javascript\nfunction\
  \ getHexColor(color) {\n  // 创建一个新元素\n  const div = document.createElement('div');\n\
  \  // 将颜色应用到元素上\n  div.style.color = color;\n  // 获取 div 的计算样式\n  let colors = window.getComputedStyle(document.body.appendChild(div));\n\
  \  // 获取颜色的 RGB 值\n  colors = colors.color.match(/\\d+/g).map(function(a) {\n  \
  \  return parseInt(a, 10);\n  });\n  // 移除 div\n  document.body.removeChild(div);\n\
  \  // 将 RGB 值转换为 HEX 并返回。\n  return (colors.length >= 3) ? '#' + (((1 << 24) + (colors[0]\
  \ << 16) + (colors[1] << 8) + colors[2]).toString(16).substr(1)) : false;\n}\n```\n\
  \n为了查找给定颜色值的元素，我们首先使用 `getHexColor` 函数将输入颜色值转换为 HEX。然后递归遍历所有 DOM 元素，获取它们的颜色值并将其转换为\
  \ HEX，最后与输入颜色的 HEX 进行比较。如果匹配，则将元素推入结果数组并返回。\n\n```javascript\nfunction findElementByColor(element,\
  \ colorValue) {\n  // 将输入颜色转换为 HEX\n  const inputColorHexa = getHexColor(colorValue);\n\
  \  // 存储结果\n  const result = [];\n  // 遍历 DOM 的辅助函数\n  const search = (element,\
  \ attrValue) => {\n    // 获取元素的颜色值\n    let value = element.style['color'];\n  \
  \  // 将值转换为 HEX\n    value = getHexColor(value);\n    // 如果 HEX 值匹配\n    // 存储结果\n\
  \    if (value === inputColorHexa) {\n      result.push(element);\n    }\n    //\
  \ 递归搜索元素的每个孩子\n    for (const child of element.children) {\n      search(child,\
  \ attrValue);\n    }\n  };\n  // 开始搜索\n  search(element, colorValue);\n  // 返回结果\n\
  \  return result;\n}\n```\n\n\n\n\n\n```javascript\n// to run it after the delay\n\
