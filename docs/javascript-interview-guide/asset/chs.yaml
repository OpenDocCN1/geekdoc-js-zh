  **94**\n\n# 依赖异步任务\n\n## 问题描述\n假设我们有多个异步任务 `A`、`B`、`C`、`D` 和 `E`（不是 Promise）。`A`、`B`\
  \ 和 `C` 是独立任务，而 `D` 依赖 `A` 和 `B` 来执行任务，`E` 依赖 `D` 和 `C` 来执行任务。编写一个任务函数/类来解决这个问题。\n\
  \n为了解决这个问题，我们创建一个类，接收依赖项列表和回调函数作为输入。\n\n在 `dependencies` 列表中，我们将检查列表中的所有任务是否已完成，如果已完成，则将它们过滤掉，因为我们不再需要运行它们。\n\
  \n如果 `dependencies` 中没有项，则直接调用回调。\n\n否则，如果有待处理的依赖项，将它们推入一个列表并逐个执行。一旦全部完成，则调用回调。\n\
  \n使用一个标记来判断任务的状态，即是否已 `completed`（完成）。\n\n```javascript\nclass Task {\n  // 接收依赖项列表\n\
  \  // 和回调函数\n  constructor(dependencies = [], job) {\n    // 过滤尚未完成的依赖项\n    this.dependencies\
  \ = dependencies ? dependencies.filter(\n      dependency => dependency instanceof\
  \ Task && !dependency.isCompleted\n    ) : [];\n    this.currentDependencyCount\
  \ = this.dependencies.length;\n    // 回调\n    this.job = job;\n    // 如果当前任务已完成\n\
  \    this.isCompleted = false;\n    // 存储依赖列表回调\n    // 按顺序执行\n    this.subscribedList\
  \ = [];\n    // 开始任务\n    this.processJob();\n  }\n\n  processJob() {\n    // 如果存在依赖项\n\
  \    // 订阅每一个依赖项\n    if (this.dependencies && this.dependencies.length) {\n   \
  \   for (let dependency of this.dependencies) {\n        dependency.subscribe(this.trackDependency.bind(this));\n\
  \      }\n    }\n    // 否则直接调用回调\n    else {\n      this.job(this.done.bind(this));\n\
  \    }\n  }\n\n  // 如果所有依赖项都已执行\n  // 调用回调\n  trackDependency() {\n    this.currentDependencyCount--;\n\
  \    if (this.currentDependencyCount === 0) {\n      this.job(this.done.bind(this));\n\
  \    }\n  }\n\n  // 将回调推入列表\n  subscribe(cb) {\n    this.subscribedList.push(cb);\n\
  \  }\n\n  // 如果当前任务已完成\n  // 标记其为完成\n  // 调用所有依赖项的回调\n  // 按顺序打印\n  done() {\n \
  \   this.isCompleted = true;\n    for (const callback of this.subscribedList) {\n\
  \      callback();\n    }\n  }\n}\n```\n\n### 测试用例\n**输入：**\n```javascript\nconst\
  \ processA = new Task(null, (done) => {\n  setTimeout(() => {\n    console.log('Process\
  \ A');\n    done();\n  }, 100);\n});\n\nconst processB = new Task([processA], (done)\
  \ => {\n  setTimeout(() => {\n    console.log('Process B');\n    done();\n  }, 1500);\n\
  });\n\nconst processC = new Task(null, (done) => {\n  setTimeout(() => {\n    console.log('Process\
  \ C');\n    done();\n  }, 1000);\n});\n\nconst processD = new Task([processA, processB],\
  \ (done) => {\n  setTimeout(() => {\n    console.log('Process D');\n    done();\n\
  \  }, 1000);\n});\n\nconst processE = new Task([processC, processD], (done) => {\n\
  \  setTimeout(() => {\n    console.log('Process E');\n    done();\n  }, 100);\n\
  });\n\nconst createAllDoneInstance = (allDoneCallback) =>\n  new Task([processA,\
  \ processB, processC, processD, processE], allDoneCallback);\n\ncreateAllDoneInstance((done)\
  \ => {\n  console.log('All is done!');\n  done();\n});\n```\n\n**输出：**\n```\n\"\
  Process A\"\n\"Process C\"\n\"Process B\"\n\"Process D\"\n\"Process E\"\n\"All is\
  \ done!\"\n```\n\n© JavaScript Interview Guide | learnersbucket.com\n**98**\n\n\
  # 创建可暂停的自动递增器\n\n## 问题描述\n在 JavaScript 中创建一个可暂停的自动递增器，它接收初始值和步长作为输入，并每秒按给定步长增加初始值。该递增器可以暂停和恢复。\n\
  \n这是使用 JavaScript 中两个最难概念之一的经典之一：\n1. `Timers`（定时器）。\n2. `Closure`（闭包）。\n\n使用 `setInterval`\
  \ 方法每秒按给定步长增加初始值。该递增器可以暂停和恢复。\n\n### 定义函数体\n我们的递增器函数将接收初始值和步长。在函数内部，我们需要两个变量以便进行控制。\n\
  \n```javascript\nconst timer = (init = 0, step = 1) => {\n  let intervalId;\n  let\
  \ count = init;\n\n  const startTimer = () => {\n    if (!intervalId) {\n      intervalId\
  \ = setInterval(() => {\n        console.log(count);\n        count += step;\n \
  \     }, 1000);\n    }\n  };\n\n  const stopTimer = () => {\n    clearInterval(intervalId);\n\
  \    intervalId = null;\n  };\n\n  return { startTimer, stopTimer };\n};\n```\n\n\
  ### 测试用例\n**输入：**\n```javascript\nconst timerObj = timer(10, 10);\n//开始\ntimerObj.startTimer();\n\
  //停止\nsetTimeout(() => {\n  timerObj.stopTimer();\n}, 5000);\n```\n\n**输出：**\n```\n\
  10\n20\n30\n40\n```\n\n© JavaScript Interview Guide | learnersbucket.com\n**101**\n\
  \n# 使用两个栈实现队列\n\n## 问题描述\n使用两个不同的 `stacks(https://learnbucket.com/tutorials/stack)`\
  \ 来实现 `queue(https://learnbucket.com/tutorials/queue-implementation-in-javascript)`\
  \ 数据结构，而不是使用数组或对象作为链表。\n\n**队列上执行的操作列表：**\n- `enqueue(val)`：向队列添加元素。\n- `dequeue()`：从队列中移除元素。\n\
  - `peek()`：返回顶部元素。\n\n使用 `stack` 创建 `queue` 有两种不同方法：\n1. 使 `enqueue` 操作代价较高。\n2.\
  \ 使 `dequeue` 操作代价较高。\n\n通常队列的 `enqueue` 和 `dequeue` 操作在 `O(1)` 时间内完成。但由于我们使用了栈而不是数组或链表，其中任何一个操作的运行时间都是\
  \ `O(n)`。这取决于我们决定采用哪种方式。\n\n### 使入队代价较高\n每当向队列添加项时，首先将 `stack1` 中的所有项复制到 `stack2`，然后将新元素添加到\
  \ `stack2`。最后再次将所有项从 `stack2` 复制回 `stack1`。这样我们通过保持第一个元素在前端、最后一个元素在末尾，来维持 FIFO（先进先出）原则。\n\
  \n### 实现\n```javascript\n// 入队代价\nclass QueueUsingStack {\n  constructor() {\n \
