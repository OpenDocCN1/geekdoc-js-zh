  ### 比较两个数组或对象\n\n### 问题描述 -\n编写一个程序来深度比较两个数组或对象。在 JavaScript 中，没有提供特定的内置方法来比较两个不同的数组或对象。我们需要创建自己的自定义函数来比较两个不同的对象。\n\
  \n### 方法 1：使用 `JSON.stringify()`\n最基础的方法是将整个数组或对象转换为字符串，然后比较这些字符串是否相等。我们将使用 `JSON.stringify()`\
  \ 来转换数组或对象。\n\n```javascript\nlet a = {a: 1, b: 2, c: 3};\nlet b = {a: 1, b: 2,\
  \ c: 3};\n// \"{'a':1,'b':2,'c':3}\" \"{'a':1,'b':2,'c':3}\"\nconsole.log(JSON.stringify(a)\
  \ === JSON.stringify(b));\n// true\n```\n\n这看起来运行正常，但当我们更改元素的顺序时，这种方法就会失效。\n\n```javascript\n\
  let a = {a: 1, b: 2, c: 3};\nlet b = {b: 2, a: 1, c: 3};\n// \"{'a':1,'b':2,'c':3}\"\
  \ \"{'b':2,'a':1,'c':3}\"\nconsole.log(JSON.stringify(a) === JSON.stringify(b));\n\
  // false\n```\n\n#### 方法 2：递归检查数组或对象\n由于数组在 JavaScript 中本质上是对象，我们可以对它们使用对象的方法。`Object.keys([1,\
  \ 2])` 将返回索引作为键，因此我们可以用它从数组中获取值。\n\n- 获取两个对象的键。\n- 如果键的数量不同，返回 false。\n- 遍历键，如果两个对象在给定键上的值都是对象，则对这些值递归调用相同的函数并进行深度检查，如果不相等则返回\
  \ false。\n- 如果值是非可迭代的，进行等值性检查，如果不相等则返回 false。\n- 如果所有情况都通过，返回 true。\n\n```javascript\n\
  const deepEqual = (object1, object2) => {\n  // (此处省略具体实现，遵循上述逻辑描述)\n}\n```\n*(注：原文提供的代码块在方法\
  \ 2 处不完整，此处根据翻译要求翻译描述部分)*\n\n\n\n\n\n- `addListener(eventName, callback)` : 这将为事件添加一个回调函数。\n\
  - `pushWithEvent(eventName, items)` : 添加数组中的所有项并触发给定名称的事件。\n- `popWithEvent(eventName)`\
  \ : 从数组中移除最后一个项并触发给定名称的事件。\n- `triggerEvent(eventName, args)` : 一个辅助函数，用于触发所有与给定事件名称关联的回调函数。\n\
  - `removeListener(eventName, callback)` : 移除附加到 `eventName` 的回调函数。注意：它对匿名函数无效。\n\
  \n```javascript\n// 用于跟踪事件及其回调\nArray.prototype.listeners = {};\n\n// 用于添加/分配带有监听器的新事件\n\
  Array.prototype.addListener = function (name, callback) {\n  // 如果不存在监听器\n  // 创建一个新的\n\
  \  // 我们将在事件触发时调用所有的回调函数\n  if (!this.listeners[name]) {\n    this.listeners[name]\
  \ = [];\n  }\n  this.listeners[name].push(callback);\n};\n\n// 添加一个在 push 时触发事件的新方法\n\
  // 调用 trigger event\nArray.prototype.pushWithEvent = function (event, args) {\n\
  \  // 推入新值\n  this.push(...args);\n  // 触发添加事件\n  this.triggerEvent(event, args);\n\
  };\n\n// 添加一个在 pop 时触发事件的新方法\n// 调用 trigger event\nArray.prototype.popWithEvent\
  \ = function (event, args) {\n  // 弹出新值\n  const element = this.pop();\n  // 触发添加事件\n\
  \  this.triggerEvent(event, element);\n};\n\nArray.prototype.triggerEvent = function\
  \ (eventName, elements) {\n  // 如果事件存在\n  // 使用该值触发所有的回调\n  if (this.listeners[eventName])\
  \ {\n    this.listeners[eventName].forEach(callback =>\n      callback(eventName,\
  \ elements, this)\n    );\n  }\n};\n\nArray.prototype.removeListener = function\
  \ (eventName, callback) {\n  // 如果事件存在\n  if (this.listeners[eventName]) {\n   \
  \ // 过滤掉监听器\n    // 注意：这对匿名函数无效\n    this.listeners[eventName] = this.listeners[eventName].filter((e)\
  \ => e !== callback);\n  }\n};\n```\n\n### 测试用例\n**输入:**\n```javascript\nconst arr\
  \ = [];\nconst onAdd = (eventName, items, array) => {\n  console.log('items were\
  \ added', items);\n}\nconst onAddAgain = (eventName, items, array) => {\n  console.log('items\
  \ were added again', items);\n}\narr.addListener('add', onAdd);\narr.addListener('add',\
  \ onAddAgain);\narr.addListener('remove', (eventName, item, array) => {\n  console.log(item,\
  \ ' was removed');\n});\narr.pushWithEvent('add', [1, 2, 3, 'a', 'b']);\narr.removeListener('add',\
  \ onAddAgain); // 移除第二个监听器\narr.pushWithEvent('add', [4, 5]);\narr.popWithEvent('remove');\n\
  console.log(arr);\n```\n\n**输出:**\n```text\n\"items were added\" // [object Array]\
  \ (5)\n[1, 2, 3, \"a\", \"b\"]\n\"items were added again\" // [object Array] (5)\n\
  [1, 2, 3, \"a\", \"b\"]\n\"items were added\" // [object Array] (2)\n[4, 5]\n5 \"\
  \ was removed\" // [object Array] (6)\n[1, 2, 3, \"a\", \"b\", 4]\n```\n\n---\n\n\
  ### 根据值或索引过滤对象数组\n**问题描述** -\n在 JavaScript 中实现一个函数，根据值或索引对对象数组进行过滤。\n\n**示例**\n\
  ```javascript\nconst arr = [\n  { name: \"Amir\", id: \"1\" },\n  { name: \"Samlan\"\
  , id: \"2\" },\n  { name: \"Shahrukh\", id: \"0\" },\n];\nconsole.log(filterObject(arr,\
  \ 0)); // { name: \"Amir\", id: \"1\" }\nconsole.log(filterObject(arr, \"Amir\"\
  )); // { name: \"Amir\", id: \"1\" }\nconsole.log(filterObject(arr, \"0\")); //\
  \ { name: \"Shahrukh\", id: \"0\" }\n```\n\n一种解决方法是使用 `Proxy` 并重写 `get` 方法，但这种方法的问题是它会将输入值转换为字符串，因此很难判断我们应该根据索引还是值来过滤。我们可以使用另一种替代方法，创建一个接受对象数组和过滤条件作为输入的函数，并根据\
  \ `filter` 的类型在对象中进行检查，返回相应的值。如果没有找到，则返回 `undefined`。\n\n```javascript\nconst filterObject\
  \ = (arr, filter) => {\n  // 如果 filter 的值是字符串，则在对象中查找\n  if (typeof filter === \"\
  string\") {\n    for (const entry of arr) {\n      // 遍历每个条目并检查值\n      for (const\
  \ [key, val] of Object.entries(entry)) {\n        if (val === filter) {\n      \
  \    return entry;\n        }\n      }\n    }\n  }\n  // 如果 filter 是数字且可以在 arr 中访问\n\
  \  if (filter in arr) {\n    return arr[filter];\n  }\n  // 如果未找到\n  return undefined;\n\
  };\n```\n\n---\n\n### 根据键聚合对象数组\n**问题描述** -\n给定一个对象数组和两个键 `on` 和 `who`，聚合 `who`\
  \ 的值。\n\n**示例输入**\n```javascript\nconst endorsements = [\n  { skill: \"css\", user:\
  \ \"Bill\" },\n  { skill: \"javascript\", user: \"Chad\" },\n  { skill: \"javascript\"\
  , user: \"Bill\" },\n  { skill: \"css\", user: \"Sue\" },\n  { skill: \"javascript\"\
  , user: \"Sue\" },\n  { skill: \"html\", user: \"Sue\" }\n];\n```\n\n我们可以使用 `Array.reduce()`\
  \ 来聚合对象数组的值。我们需要做的是：\n- 获取 `on` 键的值并聚合 `who` 键的值。\n- 按照我们预期的格式返回输出。\n\n```javascript\n\
  const aggregate = (arr, on, who) => {\n  // 使用 reduce 方法聚合\n  const agg = arr.reduce((a,\
  \ b) => {\n    // 获取两个键的值\n    const onValue = b[on];\n    const whoValue = b[who];\n\
  \    // 如果键已存在，则合并其值\n    if (a[onValue]) {\n      a[onValue] = {\n        [on]:\
  \ onValue,\n        [who]: [...a[onValue][who], whoValue]\n      };\n    }\n   \
  \ // 在键上创建一个新条目\n    else {\n      a[onValue] = {\n        [on]: onValue,\n    \
  \    [who]: [whoValue]\n      };\n    }\n    // 返回聚合器\n    return a;\n  }, {});\n\
  \  // 只返回聚合后的值\n  return Object.values(agg);\n};\n```\n\n**测试用例:**\n```javascript\n\
  console.log(aggregate(endorsements, \"skill\", \"user\"));\n```\n\n**输出:**\n```json\n\
  [\n  { \"skill\": \"css\", \"user\": [\"Bill\", \"Sue\"] },\n  { \"skill\": \"javascript\"\
  , \"user\": [\"Chad\", \"Bill\", \"Sue\"] },\n  { \"skill\": \"html\", \"user\"\
  : [\"Sue\"] }\n]\n```\n\n\n\n\n# 将实体关系数组转换为祖先树\n\n## 问题描述\n给定一个包含两个条目（父级和子关系）的数组，将数组转换为关系字符串（父级\
  \ -> 子 -> 孙子）。\n\n输入数组包含许多祖先关系，顺序是随机的。我们必须返回一个表示不同关系的[字符串](https://learnersbucket.com/tutorials/data-structures/javascript-string)数组。\n\
  \n例如，在下面的用例中，最顶部的祖先是一个动物。\n\n**输入：**\n```javascript\n[\n  [\"lion\", \"cat\"],\n\
  \  [\"cat\", \"mammal\"],\n  [\"dog\", \"mammal\"],\n  [\"mammal\", \"animal\"],\n\
  \  [\"fish\", \"animal\"],\n  [\"shark\", \"fish\"],\n];\n```\n\n**输出：**\n```javascript\n\
  [\n  \"animal -> mammal -> cat -> lion\",\n  \"animal -> mammal -> cat\",\n  \"\
  animal -> mammal -> dog\",\n  \"animal -> mammal\",\n  \"animal -> fish\",\n  \"\
  animal -> fish -> shark\"\n]\n```\n\n为了解决这个问题，我们要做的第一件事是将数组转换为父子关系的对象，以便更好地处理。\n\
  \n```javascript\n// 聚合父级 / 子关系\nconst aggregate = (arr) => {\n  // 聚合值以便于处理\n  return\
  \ arr.reduce((a, b) => {\n    const [child, parent] = b;\n    // 针对子级进行聚合\n    a[child]\
  \ = parent;\n    return a;\n  }, {});\n};\n\nconst arr = [\n  [\"lion\", \"cat\"\
  ],\n  [\"cat\", \"mammal\"],\n  [\"dog\", \"mammal\"],\n  [\"mammal\", \"animal\"\
  ],\n  [\"fish\", \"animal\"],\n  [\"shark\", \"fish\"],\n];\n\nconsole.log(aggregate(arr));\n\
  /*\n{\n  \"lion\": \"cat\",\n  \"cat\": \"mammal\",\n  \"dog\": \"mammal\",\n  \"\
  mammal\": \"animal\",\n  \"fish\": \"animal\",\n  \"shark\": \"fish\"\n}\n*/\n```\n\
  \n我们已经对子级进行了聚合，因为一个子级只有一个父级，这样就形成了一个键值对，在处理和构建关系时会更快。\n\n现在，我们需要做的就是不断遍历这个映射并形成关系字符串。为了实现，我们将获取当前键的值，并使用该值和映射递归调用相同的函数以获取它的祖先，依此类推。\n\
  \n```javascript\n// 从聚合后的值获取关系\nconst convert = (obj) => {\n  return Object.keys(obj).reduce((a,\
  \ b) => {\n    a.push(getKey(obj, b));\n    return a;\n  }, []);\n};\n\n// 构建字符串的辅助函数\n\
  // 直到最后一个层级\nconst getKey = (obj, key) => {\n  // 访问\n  const val = obj[key];\n\
  \  // 通过改变键的顺序可以反转形成\n  // 子级 -> 父级 | 父级 -> 子级\n  if (val in obj) {\n    return\
  \ getKey(obj, val) + \" -> \" + key;\n  } else {\n    return val + \" -> \" + key;\n\
  \  }\n};\n\n// 聚合后的映射\nconst map = {\n  \"lion\": \"cat\",\n  \"cat\": \"mammal\"\
  ,\n  \"dog\": \"mammal\",\n  \"mammal\": \"animal\",\n  \"fish\": \"animal\",\n\
  \  \"shark\": \"fish\"\n};\n\nconsole.log(convert(map));\n/*\n[\n  \"animal -> mammal\
  \ -> cat -> lion\",\n  \"animal -> mammal -> cat\",\n  \"animal -> mammal -> dog\"\
  ,\n  \"animal -> mammal\",\n  \"animal -> fish\",\n  \"animal -> fish -> shark\"\
  \n]\n*/\n```\n\n将它们结合在一起。\n\n```javascript\nconst ancestry = (arr) => {\n  // 聚合父级\
  \ / 子关系\n  const aggregate = (arr) => {\n    // 聚合值以便于处理\n    return arr.reduce((a,\
  \ b) => {\n      const [child, parent] = b;\n      // 针对子级进行聚合\n      a[child] =\
  \ parent;\n      return a;\n    }, {});\n  };\n\n  // 从聚合后的值获取关系\n  const convert\
  \ = (obj) => {\n    return Object.keys(obj).reduce((a, b) => {\n      a.push(getKey(obj,\
  \ b));\n      return a;\n    }, []);\n  };\n\n  // 构建字符串的辅助函数\n  // 直到最后一个层级\n \
  \ const getKey = (obj, key) => {\n    // 访问\n    const val = obj[key];\n    // 通过改变键的顺序可以反转形成\n\
  \    // 子级 -> 父级 | 父级 -> 子级\n    if (val in obj) {\n      return getKey(obj, val)\
  \ + \" -> \" + key;\n    } else {\n      return val + \" -> \" + key;\n    }\n \
  \ };\n\n  // 获取聚合后的映射\n  const aggregatedMap = aggregate(arr);\n  // 返回祖先关系\n  return\
  \ convert(aggregatedMap);\n};\n\n// 测试用例\nconst arr = [\n  [\"lion\", \"cat\"],\n\
  \  [\"cat\", \"mammal\"],\n  [\"dog\", \"mammal\"],\n  [\"mammal\", \"animal\"],\n\
  \  [\"fish\", \"animal\"],\n  [\"shark\", \"fish\"],\n];\nconsole.log(ancestry(arr));\n\
  // 输出: [\n  \"animal -> mammal -> cat -> lion\",\n  \"animal -> mammal -> cat\"\
  ,\n  \"animal -> mammal -> dog\",\n  \"animal -> mammal\",\n  \"animal -> fish\"\
  ,\n  \"animal -> fish -> shark\"\n]\n```\n\n# 从字符串路径获取对象值\n\n## 问题描述\n实现一个方法，它接收一个对象和字符串或字符串数组作为路径，并返回该路径对应的值。如果没有找到，则返回\
  \ `undefined`。这基本上是 `lodash._get()` 的填充。\n\n**输入：**\n```javascript\nconst obj =\
  \ {\n  a: {\n    b: {\n      c: [1, 2, 3]\n    }\n  }\n};\nconsole.log(get(obj,\
  \ 'a.b.c'));\nconsole.log(get(obj, 'a.b.c.0'));\nconsole.log(get(obj, 'a.b.c[1]'));\n\
  console.log(get(obj, ['a', 'b', 'c', '2']));\nconsole.log(get(obj, 'a.b.c[3]'));\n\
  console.log(get(obj, 'a.c'));\n```\n**输出：**\n```text\n// [1,2,3]\n// undefined\n\
  // 2\n// 3\n// undefined\n```\n\n我们可以实现一个函数来处理以下情况：\n- 检查路径类型，如果是数组，则将其合并为字符串。\n\
  - 忽略 `[` `]` 等特殊字符从字符串获取实际值。\n- 一旦有了精确路径，深度遍历输入对象。\n\n```javascript\nconst get =\
  \ (obj, path) => {\n  // 如果路径为空或长度为 0\n  if (path === '' || path.length == 0)\n\
  \    return undefined;\n  // 如果路径是数组，将其合并\n  if (Array.isArray(path))\n    path\
  \ = path.join('.');\n  // 过滤括号和点\n  let exactPath = [];\n  for (let i = 0; i < path.length;\
  \ i++) {\n    if (path[i] !== '[' && path[i] !== ']' && path[i] !== '.') {\n   \
  \   exactPath.push(path[i]);\n    }\n  }\n  // 获取序列中路径的值\n  const value = exactPath.reduce((source,\
  \ path) => source[path], obj);\n  // 如果未找到则返回 undefined\n  return value ? value\
  \ : undefined;\n};\n\n// 测试用例\nconst obj = {\n  a: {\n    b: {\n      c: [1, 2,\
  \ 3]\n    }\n  }\n};\nconsole.log(get(obj, 'a.b.c'));\nconsole.log(get(obj, 'a.b.c.0'));\n\
  console.log(get(obj, 'a.b.c[1]'));\nconsole.log(get(obj, ['a', 'b', 'c', '2']));\n\
  console.log(get(obj, 'a.b.c[3]'));\nconsole.log(get(obj, 'a.c'));\n```\n\n# 在字符串路径上设置对象值\n\
  \n## 问题描述\n给定一个对象、字符串或字符串数组格式的路径以及一个值，更新对象中给定路径上的值。这是 `lodash._set()`https://lodash.com/docs/4.17.15#set\
  \ 的填充，并且是 `lodash._get()` 的相反操作。\n\n**示例：**\n```javascript\nconst object = {\n \
  \ 'a': [{\n    'b': {\n      'c': 3\n    }\n  }]\n};\nset(object, 'a[0].b.c', 4);\n\
  console.log(object.a[0].b.c); // 4\nset(object, ['x', '0', 'y', 'z'], 5);\nconsole.log(object.x[0].y.z);\
  \ // 5\n```\n\n\n\n所有© JavaScript 面试指南 | learnersbucket.com\n\n269\n\n- 否则，使用当前值作为下一个路径递归调用同一个函数。\n\
  - 在移动到下一个路径时，检查键的类型，如果是数字，则值应该是数组，因此传递数组；如果是字符串，传递对象。\n\n**注意**:- 这将覆盖现有值并分配一个新值。\n\
  \n```javascript\nconst helper = (obj, path, value) => {\n  // 从路径中获取当前键和剩余键\n  let\
  \ [current, ...rest] = path;\n  // 如果还有更多键\n  // 根据 key 的类型\n  // 将值作为对象或数组添加\n\
  \  if (rest.length > 0) { own    // 如果不存在该键\n    // 创建一个新的键\n    if (!obj[current])\
  \ {\n      // 如果键是数字\n      // 添加一个数组\n      // 否则添加对象\n      const isNumber = `${+rest[0]}`\
  \ === rest[0];\n      obj[current] = isNumber ? [] : {};\n    }\n    // 递归更新剩余路径\n\
  \    // 如果最后一个路径不是对象类型\n    // 但键是\n    // 则根据键创建一个对象或数组\n    // 并更新值\n    if (typeof\
  \ obj[current] !== 'object') {\n      // 确定键是字符串还是数字\n      const isNumber = `${+rest[0]}`\
  \ === rest[0];\n      obj[current] = helper(isNumber ? [] : {}, rest, value);\n\
  \    }\n    // 否则直接更新值\n    else {\n      obj[current] = helper(obj[current], rest,\
  \ value);\n    }\n  }\n  // 否则直接将值赋值给键\n  else {\n    obj[current] = value;\n  }\n\
  \  // 返回更新后的 obj\n  return obj;\n};\n\nconst set = (obj, path, value) => {\n  let\
  \ pathArr = path;\n  // 如果路径是字符串类型\n  // 替换特殊字符\n  // 并根据 . 分割字符串获取路径键\n  if (typeof\
  \ path === 'string') {\n    pathArr = path.replace('[', '.).replace(']', '').split(\"\
  .\");\n  }\n  // 使用辅助函数进行更新\n  helper(obj, pathArr, value);\n};\n```\n\n### 测试用例\n\
  \n**输入:**\n```javascript\nconst abc = {\n  a: {\n    b: {\n      c: [1, 2, 3]\n\
  \    },\n    d: {\n      a: \"hello\"\n    }\n  }\n};\n\nconst instance1 = JSON.parse(JSON.stringify(abc));\n\
  set(instance1, 'a.b.c', 'learnersbucket');\nconsole.log(instance1.a.b.c);\n\nconst\
  \ instance2 = JSON.parse(JSON.stringify(abc));\nset(instance2, 'a.b.c.0', 'learnersbucket');\n\
  console.log(instance2.a.b.c[0]);\n\nconst instance3 = JSON.parse(JSON.stringify(abc));\n\
  set(instance3, 'a.b.c[1]', 'learnersbucket');\nconsole.log(instance3.a.b.c[1]);\n\
  \nconst instance4 = JSON.parse(JSON.stringify(abc));\nset(instance4, ['a', 'b',\
  \ 'c', '2'], 'learnersbucket');\nconsole.log(instance4.a.b.c[2]);\n\nconst instance5\
