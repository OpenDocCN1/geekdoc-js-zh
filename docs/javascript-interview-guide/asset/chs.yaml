  let test = {\n  a: (b, c) => b + c,\n  b: (a, b) => a + b,\n  c: (a, b) => a - b\n\
  };\nconsole.log(pipe(test)(1, 2));\n```\n\n输出:\n```\n{a: 3, b: 5, c: 2}\n```\n\n\
  © JavaScript Interview Guide | learnersbucket.com\n\n350\n\n# JavaScript 中的管道函数\
