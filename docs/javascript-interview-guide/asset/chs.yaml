  \ => console.log(\"success:\" + result))\n  .catch(() => console.log(\"no success\"\
  ));\n```\n\n**输出:**\n```text\n/// 第一批\n2\n4\n6\n/// 第二批\n8\n10\n\"success:2,4,6,8,10\"\
