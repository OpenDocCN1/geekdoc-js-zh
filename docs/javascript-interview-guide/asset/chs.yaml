  >\n        <div>\n          <div>\n            <label>Number:</label>{\" \"}\n \
  \           <input\n              type=\"number\"\n              value={inputValue}\n\
  \              onChange={inputChangeHandler}\n            />\n          </div>\n\
  \          <div>\n            <label>Duration:</label>{\" \"}\n            <input\n\
  \              type=\"number\"\n              value={duration}\n              onChange={durationChangeHandler}\n\
  \            />\n          </div>\n        </div>\n        <br />\n        <div>\n\
  \          <button onClick={startHandler}>start</button>{\" \"}\n          <button\
  \ onClick={resetHandler}>reset</button>\n        </div>\n      </section>\n    \
  \  <br />\n      <section className=\"result-area\">\n        <div>\n          SetInterval:{\"\
  \ \"}\n          {(start && (\n            <CountSetTimeout\n              label={\"\
  count\"}\n              number={inputValue}\n              duration={parseInt(duration)}\n\
  \            />\n          )) || 0}\n        </div>\n      </section>\n    </main>\n\
  \  );\n};\n\nexport default App;\n```\n\n![](img/index-482_1.png)\n\n### 输出\n这花费的时间比\
  \ `setInterval` 更多。为什么会发生这种情况？\n如果你阅读了这些方法的定义，你就会意识到这一点。\n\n- `setTimeout`: 此方法设置一个计时器，在计时器过期后执行一次函数或指定的代码段。\n\
  - `setInterval`: 此方法重复调用函数或执行代码段，每次调用之间有固定的时间延迟。\n\n这意味着这两个函数中的任一个指定的时间都是最小时间，但实际花费的时间可能比这长。\n\
  在对 MDN 进行了一些研究后，我发现了导致延迟两个主要原因。\n\n1. **限制（Clamping）**。在现代浏览器中，由于嵌套（嵌套层至少达到特定深度）触发连续调用，或在经过数量数量间隔后，`setTimeout()`/`setInterval()`\
  \ 调用被限制为最小 4 毫秒。\n2. **执行上下文** 当页面（或操作系统/浏览器）忙于其他任务时，计时器也可能会延迟触发。需要注意的重要一点是，调用 `setTimeout()`\
  \ 的线程终止之前，函数代码段无法执行。\n\n事实证明，在以下情况下 `setTimeout` 或 `setInterval` 函数无法正常工作：\n1. 延迟小于\
  \ 4 毫秒。\n2. 定时器函数内部正在执行阻塞后续执行的操作。\n\n如果我们能设法避免使用定时器函数，我们应该能够解决这个问题。但是有不使用它们的方法吗？\n\
  \n### 解决方案 3：使用 requestAnimationFrame 方法\n\n使用此方法，我们可以出一个在指定的持续时间内从 0 递增计数的解决方案。\n\
  首先，让我们了解这个方法。\n\n根据 MDN 定义：`window.requestAnimationFrame()` 方法告诉浏览器你想要执行动画，并请求浏览器在下一次重绘之前调用指定的函数来更新动画。该方法接受一个回调函数作为参数，并在重绘之前调用。简单来说，此方法的作用是请求浏览器执行动画，反过来非常快速地刷新屏幕。每秒至少\
  \ 60 帧来执行动画。\n\n现在，这在创建递增计数器时有什么用呢？\n阅读来自 MDN 的文本以以便更好地理解。\n\n\n\n\n每你每当准备好更新屏幕上的动画时，都应该调用此方法。这将请求浏览器在执行下一次重绘之前调用你的动画函数。回调次数通常为每秒\
  \ 60 次，但根据 W3C 的建议，它通常会匹配大多数网络浏览器的显示刷新率。\n\n此函数接收一个回调函数，并将当前的 `timestamp` 作为参数传递给该回调函数。\n\
  \n现在，通过使用存储在调用函数前时间的 `startTime` 变量，以及我们每次在回调中收到的这个当前 `timestamp`，我们可以在指定的持续时间内递归地调用此函数，并通过合理的计算来递增\
  \ `count`。\n\n考虑到每秒至少刷新 60 帧，这意味着如果我们必须在 1 秒内从 0 计数到 1000，我们应该以 `60/1000 = ~16.667`\
  \ 的步长增加数字，通过这种方式我们可以得出巧妙的计算方法，根据动画经过的时间长度来增加数字。\n\n取决于此函数被调用的频率，我们将看到屏幕上发生递增动画。\n\
  \n对于较大的数字，计数器并不是每次加 1，但动画发生得非常快，肉眼将无法区分。\n\n注意：在 gif 中你应该能看到这一点。\n\n```javascript\n\
  //Animation\nconst countAnimate = (obj, initVal, lastVal, duration) => {\n  let\
  \ startTime = null;\n\n  // 获取当前时间戳并将其赋值给 currentTime 变量\n  let currentTime = Date.now();\n\
  \n  // 将当前时间戳传递给 step 函数\n  const step = (currentTime) => {\n    // 如果开始时间为空，则将当前时间赋值给\
  \ startTime\n    if (!startTime) {\n      startTime = currentTime;\n    }\n    //\
  \ 计算用于显示数字所需的进度\n    const progress = Math.min((currentTime - startTime) / duration,\
  \ 1);\n\n    // 使用上述得到的值计算要显示的内容\n    obj.innerHTML = Math.floor(progress * (lastVal\
  \ - initVal) + initVal);\n\n    // 确保计数器不会超过最后一个值\n    if (progress < 1) {\n   \
  \   window.requestAnimationFrame(step);\n    } else {\n      window.cancelAnimationFrame(window.requestAnimationFrame(step));\n\
  \      // 添加时间差\n      const diff = currentTime - startTime;\n      const elm =\
  \ document.createElement(\"SPAN\");\n      elm.innerHTML = ` | Took : <b>${diff\
  \ / 1000}</b> seconds to complete;\n      obj.appendChild(elm);\n    }\n  };\n\n\
  \  // 开始动画\n  window.requestAnimationFrame(step);\n};\n```\n\n让我们来测试一下。\n\n```javascript\n\
  // app.js\nimport React, { useState, useRef } from \"react\";\nimport { countAnimate\
