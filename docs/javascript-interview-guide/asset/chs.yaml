  \  };\n\n  return (\n    <main style={{ width: \"500px\", margin: \"50px auto\"\
  \ }}>\n      <section className=\"input-area\">\n        <div>\n          <div>\n\
  \            <label>Number:</label>{\" \"}\n            <input type=\"number\" value={inputValue}\
  \ onChange={inputChangeHandler} />\n          </div>\n          <div>\n        \
