  \n© JavaScript Interview Guide | learnersbucket.com\n\n147\n\n# 创建一个切换函数 (toggle)\n\
  \n问题描述 -\n\n创建一个切换函数，它接收一个参数列表，并在循环调用时切换其中的每一个参数。\n\n示例：\n\n```javascript\nlet hello\
  \ = toggle(\n```\n\n\n\n\n\"hello\"\n\n);\n\nhello()\n\n// \"hello\";\n\nhello()\n\
  \n// \"hello\";\n\nlet\n\nonOff = toggle(\n\"on\",\n\"off\"\n);\n\nonOff() // \"\
  on\"\n\nonOff() // \"off\"\n\nonOff() // \"on\"\n\n`toggle` 函数在每次调用时都会按时针返回每个值，也可以通过从\
  \ `toggle` 函数返回一个函数来实现，该函数对值形成闭包以跟踪循环。\n\n### 实现\n\n```javascript\nconst toggle\
  \ = (...list) => {\n  // 跟踪循环\n  let current = -1;\n  const length = list.length;\n\
  \  return function() {\n    // 移动到下一个元素，当 current > length 时重置为 0\n    current =\
  \ (current + 1) % length;\n    return list[current];\n  }\n}\n```\n\n### 测试用例\n\n\
  ```javascript\nconst hello = toggle(\"1\", \"2\");\nconsole.log(hello()); // \"\
  1\"\nconsole.log(hello()); // \"2\"\nconsole.log(hello()); // \"1\"\n```\n\n© JavaScript\
  \ Interview Guide | learnersbucket.com | 148\n\n# 采样函数 (Sampling function)\n\n##\
  \ 问题描述\n创建一个函数，接受一个函数作为输入和一个计数，并在指定的调用次数后执行一次该输入函数。这被称为采样函数。\n\n## 示例\n\n```javascript\n\
  function message() {\n  console.log(\"hello\");\n}\nconst sample = sampler(message,\
  \ 4);\nsample();\nsample();\nsample();\nsample(); // “hello” 这将被执行\nsample();\n\
  sample();\nsample();\nsample(); // “hello” 这将被执行\n```\n\n采样函数与 `throttling`（节流）不同，节流是限制函数在给定时间时间内只执行一次，而采样是通过通过在给定的调用次数内执行一次函数来限制其执行。\n\
  \n要创建一个采样函数，我们可以创建一个闭包来跟踪函数被调用的次数，当它达到指定计数时，执行输入函数并重置计数器。\n\n### 实现\n\n```javascript\n\
  function sampler(fn, count, context) {\n  let counter = 0;\n  return function(...args)\
  \ {\n    // 设置计数器\n    let lastArgs = args;\n    context = this ?? context;\n  \
  \  // 仅当调用次数等于计数时调用\n    if (++counter !== count) return;\n    fn.apply(context,\
  \ args);\n    counter = 0;\n  };\n}\n```\n\n### 测试用例\n\n```javascript\nfunction\
  \ message() {\n  console.log(\"hello\");\n}\nconst sample = sampler(message, 4);\n\
  sample();\nsample();\nsample();\nsample(); // hello\nsample();\nsample();\nsample();\n\
  sample(); // hello\n```\n\n© JavaScript Interview Guide | learnersbucket.com | 150\n\
  \n# 让函数休眠 (Make function sleep)\n\n许多编程语言都有内置函数，可以可以在指定时间内停止函数执行。\n\n* **C 或 PHP**:\
  \ `sleep(2)`\n* **JAVA**: `Thread.sleep(2000)`\n* **Python**: `time.sleep(2)`\n\
  * **Go**: `time.Sleep(2 * time.Second)`\n\nJavascript 没有内置的此类函数，但得益于 ES2018 引入的\
  \ promises 和 `async-await`，我们现在可以轻松地实现此功能并无缝使用。\n\n### 实现\n\n```javascript\nconst\
  \ sleep = (milliseconds) => {\n  return new Promise(resolve => setTimeout(resolve,\
  \ milliseconds))\n};\n```\n\n这将创建一个包装函数，该函数将在指定的毫秒后解析 promise。我们可以使用它来防止函数在一定时间内执行执行。\n\
  \n### 测试用例 1: 使用 `.then()`\n\n```javascript\nsleep(500).then(() => {\n  // 执行一些事情\n\
  \  console.log('我在 500 毫秒后运行');\n});\n```\n\n### 测试用例 2: 使用 `async…await`\n\n```javascript\n\
  const performAction = async () => {\n  await sleep(2000);\n  // 执行一些事情\n}\nperformAction();\n\
  ```\n\n这种效果良好，但由于 javascript 的工作机制，它不会像其他编程语言那样停止整个程序的执行，而是只会让我们当前的函数休眠。\n\n© JavaScript\
  \ Interview Guide | learnersbucket.com | 152\n\n# 从对象中移除循环 (Remove cycle from the\
  \ object)\n\n## 问题描述\n给定一个带有循环的对象，将其中的移除循环或循环引用。\n\n## 示例\n\n**输入：**\n```javascript\n\
  const List = function(val){\n  this.next = null;\n  this.val = val;\n};\nconst item1\
  \ = new List(10);\nconst item2 = new List(20);\nconst item3 = new List(30);\nitem1.next\
  \ = item2;\nitem2.next = item3;\nitem3.next = item1;\n// 这形成了一个循环，如果你 console.log\
  \ 它，你会看到一个循环对象，\n// 例如，item1 -> item2 -> item3 -> item1 -> 以此类推。\n```\n\n**输出：**\n\
  ```javascript\n// 移除循环\n// item1 -> item2 -> item3\n```\n\n如果你看到上面的示例，我们创建了一个接受值和指向下一个相同节点的列表（类似于链表），并使用它创建了循环对象。为了打破这个循环，我们必须删除\
  \ `next` 指针。\n\n这种移除可以在两个地方发生：\n1. 正常用途。\n2. 创建 JSON 时。\n\n### 实现\n\n```javascript\n\
  const removeCycle = (obj) => {\n  // 设置\n  const set = new WeakSet();\n  // 递归函数\n\
  \  function iterateObj(obj) {\n    for (let key in obj) {\n      if (obj.hasOwnProperty(key))\
  \ {\n        if (typeof obj[key] === 'object') {\n          // 如果集合中包含对象\n     \
  \     if (set.has(obj[key])){\n            delete obj[key];\n          } else {\n\
  \            // 存储对象引用\n            set.add(obj[key]);\n            // 递归迭代下一个\n\
  \            iterateObj(obj[key]);\n          }\n        }\n      }\n    }\n  }\n\
  \  iterateObj(obj);\n}\n```\n\n### 测试用例\n\n**输入：**\n```javascript\nconst List =\
  \ function(val){\n  this.next = null;\n  this.val = val;\n};\nconst item1 = new\
  \ List(10);\nconst item2 = new List(20);\nconst item3 = new List(30);\nitem1.next\
  \ = item2;\nitem2.next = item3;\nitem3.next = item1;\n\nremoveCycle(item1);\nconsole.log(item1);\n\
  ```\n**输出：**\n```javascript\n{val: 10, next: {val: 20, next: {val: 30}}}\n```\n\n\
  在创建 JSON 时 `JSON.stringify` 接受一个替换函数（replacer），可用于更改字符串化过程。我们可以使用同一个函数来检测并从对象移除循环。\n\
  \n```javascript\nconst getCircularReplacer = () => {\n  // 创建闭包并使用这个 weakset 监控对象引用。\n\
  \  const seen = new WeakSet();\n  // 返回替换函数\n  return (key, value) => {\n    if\
  \ (typeof value === 'object' && value !== null) {\n      if (seen.has(value)) {\n\
  \        return;\n      }\n      seen.add(value);\n    }\n    return value;\n  };\n\
  };\n```\n\n### 测试用例\n\n**输入：**\n```javascript\nconst List = function(val){\n  this.next\
  \ = null;\n  this.val = val;\n};\nconst item1 = new List(10);\nconst item2 = new\
  \ List(20);\nconst item3 = new List(30);\nitem1.next = item2;\nitem2.next = item3;\n\
  item3.next = item1;\n\nconsole.log(JSON.stringify(item1, getCircularReplacer()));\n\
  ```\n**输出：**\n```json\n{\"next\":{\"next\":{\"val\":30},\"val\":20},\"val\":10}\n\
  ```\n\n© JavaScript Interview Guide | learnersbucket.com | 156\n\n# 过滤多维数组 (Filter\
  \ Multidimensional Array)\n\n## 问题描述\n给定多维数组，创建一个过滤函数，该函数接受回调函数作为输入，并返回一个所有通过回调函数实现的测试元素的新数组。\n\
  \n## 示例\n\n**输入：**\n```javascript\nconst arr = [[1, [2, [3, 'foo', {'a': 1, 'b':\
  \ 2}]], 'bar']];\nconst filtered = filter(arr, (e) => typeof e ===\n```\n\n\n\n\n\
  ```javascript\n'string'\n\n);\n\nconsole.log(JSON.stringify(filtered));\n```\nOutput:\n\
  ```json\n[[[[\n\"foo\"\n]],\n\"bar\"\n]]\n```\n\n要过滤多维数组，我们需要递归地过滤每个子数组并合并它们的结果。\n\
  \n```javascript\nconst filter = (arr, test) => {\n  // 存储输出\n  const result = [];\n\
  \  // 遍历数组\n  for (let a of arr) {\n    // 如果是子数组\n    if (Array.isArray(a)) {\n\
  \      // 递归过滤子数组\n      const output = filter(a, test);\n      // 存储结果\n      result.push(output);\n\
  \    } else {\n      // 如果不是数组\n      // 测试元素\n      // 如果通过测试，存储其结果\n      if (test(a))\
  \ {\n        result.push(a);\n      }\n    }\n  }\n  // 返回结果\n  return result;\n\
  };\n```\n\n### 测试用例\nInput:\n```javascript\nconst arr = [[1, [2, [3, \"foo\", {\
  \ a: 1, b: 2 }]], \"bar\"]];\nconst filtered = filter(arr, (e) => typeof e === \"\
  number\");\nconsole.log(JSON.stringify(filtered));\n```\nOutput:\n```json\n[[1,[2,[3]]]\n\
  ```\n\n我们可以扩展这种方法，在数组的原型本身实现一个 `multiFilter`，它将接收一个回调函数并根据回调的结果过滤数组。\n\n```javascript\n\
  Array.prototype.multiFilter = function (test) {\n  // 原始数组;\n  const originalArray\
  \ = this;\n  const filter = (arr, test) => {\n    // 存储输出\n    const result = [];\n\
  \    // 遍历数组\n    for (let a of arr) {\n      // 如果是子数组\n      if (Array.isArray(a))\
  \ {\n        // 递归过滤子数组\n        const output = filter(a, test);\n        // 存储结果\n\
  \        result.push(output);\n      } else {\n        // 如果不是数组\n        // 测试元素\n\
  \        // 如果通过测试，存储其结果\n        if (test(a)) {\n          result.push(a);\n  \
  \      }\n      }\n    }\n    // 返回结果\n    return result;\n  };\n  // 过滤并返回\n  return\
  \ filter(originalArray, test);\n};\n```\n\n### 测试用例\nInput:\n```javascript\nconst\
  \ arr = [[1, [2, [3, \"foo\", { a: 1, b: 2 }]], \"bar\"]];\nconst filtered = arr.multiFilter((e)\
  \ => typeof e === \"number\");\nconsole.log(JSON.stringify(filtered));\n```\nOutput:\n\
  ```json\n[[1,[2,[3]]]\n```\n\n# 嵌套数组中的元素计数\n\n## 题目描述 -\n给定一个嵌套数组和一个回调函数，统计所有通过回调测试的元素数量并返回计数。\n\
  \n这个问题与上面的 `多维数组过滤` 类似，唯一的区别在于，我们不需要过滤数组，只需要返回数组中通过测试的元素数量。\n\n## 示例\nInput:\n```javascript\n\
  const arr = [[1, [2, [3, 4, \"foo\", { a: 1, b: 2 }]], \"bar\"]];\nconst count =\
  \ countInArray(arr, (e) => typeof e === \"number\");\nconsole.log(count);\n```\n\
  Output:\n`4`\n\n我们只需要创建一个包含内部函数的闭包。父函数将持有一个变量，每当数组元素通过回调函数的测试时，该变量就会加增，而内部函数将递归搜索嵌套数组。\n\
  \n```javascript\nlet countInArray = function (inputArr, test) {\n  // 跟踪计数\n  let\
  \ count = 0;\n  const search = (arr, test) => {\n    // 遍历数组\n    for (let a of\
  \ arr) {\n      // 如果不是数组\n      // 测试元素\n      // 如果通过测试，存储其结果\n      if (test(a))\
  \ {\n        count += 1;\n      }\n      // 如果是子数组\n      if (Array.isArray(a))\
  \ {\n        // 递归过滤子数组\n        search(a, test);\n      }\n    }\n  };\n  // 搜索\n\
  \  search(inputArr, test);\n  // 返回\n  return count;\n};\n```\n\n### 测试用例\nInput:\n\
  ```javascript\nconst arr = [[1, [2, [3, 4, \"foo\", { a: 1, b: 2 }]], \"bar\"]];\n\
  const count = countInArray(arr, (e) => typeof e === \"number\");\nconsole.log(count);\n\
  ```\nOutput:\n`4`\n\n# 将 HEX 颜色转换为 RGB\n\n## 题目描述 -\n实现一个将 HEXA 颜色代码转换为 RGB 数字的函数。\n\
  \n## 示例\nInput:\n`\"#ff33ff\"`\nOutput:\n```json\n{\n  \"r\": 255,\n  \"g\": 51,\n\
  \  \"b\": 255\n}\n```\n\n十六进制使用 16 个唯一符号，将 0 – 9 之间的值表示为“0 – 9”，将 10 – 15 之间的值表示为“A\
  \ – F”或“a – f”。\n\nRGB 格式是红、绿、蓝在 0 – 255 范围内的颜色组合。十六进制代码是 RGB 数字的十六进制表示。\n\n有多种方法可以将\
  \ HEXA 颜色代码转换为 RGB 数字。\n\n### 方法 1. 使用 slice() 方法\nHEXA 颜色代码 '#ff33ff' 以 '#' 开头，后面跟着六个字符，分别代表\
  \ R、G、B。我们可以使用 `slice()` 获取两个数字，然后使用 `parseInt()` 方法接收一个进制值并将字符串转换为数字。\n\n```javascript\n\
  const hex2rgb = (hex) => {\n  const r = parseInt(hex.slice(1, 3), 16);\n  const\
  \ g = parseInt(hex.slice(3, 5), 16);\n  const b = parseInt(hex.slice(5, 7), 16);\n\
  \  return { r, g, b };\n}\nconsole.log(hex2rgb(\"#ff33ff\"));\n/*\n{\n  \"r\": 255,\n\
  \  \"g\": 51,\n  \"b\": 255\n}\n*/\n```\n如果是类似 #f3f 这种短形式的 Hex 代码，我们需要将其转换为原始形式。\n\
  \n```javascript\n// 创建完整的 hex\nconst fullHex = (hex) => {\n  let r = hex.slice(1,\
  \ 2);\n  let g = hex.slice(2, 3);\n  let b = hex.slice(3, 4);\n  if (hex.length\
  \ === 4) {\n    r = r + r;\n    g = g + g;\n    b = b + b;\n  }\n  return {\n  \
  \  r: parseInt(r, 16),\n    g: parseInt(g, 16),\n    b: parseInt(b, 16)\n  };\n\
  };\n\n// 将 hex 转换为 rgb\nconst hex2rgb = (hex) => {\n  if (hex.length === 4) {\n\
  \    return fullHex(hex);\n  }\n  const r = parseInt(hex.slice(1, 3), 16);\n  const\
  \ g = parseInt(hex.slice(3, 5), 16);\n  const b = parseInt(hex.slice(5, 7), 16);\n\
  \  return { r, g, b };\n}\nconsole.log(hex2rgb(\"#f3f\"));\n/*\n{\n  \"r\": 255,\n\
  \  \"g\": 51,\n  \"b\": 255\n}\n*/\n```\n\n### 方法 2. 使用正则\n字符串的 `match()` 方法接收正则表达式并返回匹配数组。我们可以使用这个数组来解析\
  \ HEXA 值。\n\n```javascript\nconst hex2rgb = (hex) => {\n  const rgbChar = ['r',\
  \ 'g', 'b'];\n  const normal = hex.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);\n\
  \  if (normal) {\n    return normal.slice(1).reduce((a, e, i) => {\n      a[rgbChar[i]]\
  \ = parseInt(e, 16);\n      return a;\n    }, {});\n  }\n  const shorthand = hex.match(/^#([0-9a-f])([0-9a-f])([0-9a-f])$/i);\n\
  \  if (shorthand) {\n    return shorthand.slice(1).reduce((a, e, i) => {\n     \
  \ a[rgbChar[i]] = parseInt(e + e, 16);\n      return a;\n    }, {});\n  }\n  return\
  \ null;\n}\nconsole.log(hex2rgb(\"#ff33ff\"));\n/*\n{\n  \"r\": 255,\n  \"g\": 51,\n\
  \  \"b\": 255\n}\n*/\nconsole.log(hex2rgb(\"#f3f\"));\n/*\n{\n  \"r\": 255,\n  \"\
  g\": 51,\n  \"b\": 255\n}\n*/\n```\n\n# 将 RGB 转换为 HEX 颜色\n\n## 题目描述 -\n实现一个将 RGB\
