  \ 的错误消息被拒绝（reject）。\n- 结果的顺序与给定数组中 promise 的顺序一致。\n\n### 实现\n  //存储结果\n  const results\
  \ = [];\n  // 跟踪有多少个 promise 完成\n  let promisesCompleted = 0;\n  // 返回一个新的 promise\n\
