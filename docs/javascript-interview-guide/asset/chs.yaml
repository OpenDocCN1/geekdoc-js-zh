  \n342\n\n### 在排序数组中查找给定数字首次和最后一次出现的位置\n\n## 题目描述\n\n给定一个包含重复值的排序数组，我们需要创建两个不同的算法来找到给定元素第一次和最后一次出现的位置。\n\
  \n## 示例\n\n输入:\n```\n[1, 2, 3, 4, 5, 5, 6, 7, 8, 9]\n5\n```\n\n输出:\n```\n4 // 首次位置的索引\n\
  5 // 第二次位置的索引\n```\n\n在排序数组中查找任何内容的最佳方法是使用[二分查找](https://learnersbucket.com/examples/algorithms/binary-search-in-javascript)。\n\
  \n我们将使用二分查找的变体来找到数组中元素第一次或最后一次出现的位置。\n\n### 首次出现\n\n由于二分查找一旦找到元素后就会立即返回其索引，为了找到第一次出现的位置，即使在找到元素后，我们将继续在较低范围内查找，以检查该元素之前是否出现过；如果是，则返回最小的索引。\n\
  \n```javascript\nconst first = (arr, value) => {\n  let low = 0;\n  let high = arr.length\
  \ - 1;\n  let result = -1;\n  // 继续查找数组中的所有元素\n  while (low <= high){\n    // 获取中间值\n\
  \    const mid = Math.ceil((low + high) / 2);\n    // 如果找到元素\n    // 则存储索引并在较低范围内查找首次出现的位置\n\
  \    if (arr[mid] === value){\n      result = mid;\n      high = mid - 1;\n    }\
  \ else if (value < arr[mid]){\n      // 如果值小于中间元素，则在较低范围内查找\n      high = mid -\
  \ 1;\n    } else {\n      // 如果值大于中间元素，则在较高范围内查找\n      low = mid + 1;\n    }\n\
  \  }\n  // 返回索引\n  return result;\n}\n```\n\n### 测试用例\n\n输入:\n```javascript\nconst\
  \ arr = [1, 2, 3, 4, 5, 5, 6, 6, 7, 8, 9, 10];\nconsole.log(first(arr, 5));\nconsole.log(first(arr,\
  \ 6));\n```\n\n输出:\n```\n4\n6\n```\n\n### 最后一次出现\n\n与查找首次出现一样，为了找到最后一次出现的位置，我们必须在找到元素后继续在较高范围内查找，以确保获得元素的最后一个索引。\n\
  \n```javascript\nconst last = (arr, value) => {\n  let low = 0;\n  let high = arr.length\
  \ - 1;\n  let result = -1;\n  // 搜索直到数组结束\n  while (low <= high){\n    // 获取中间值\n\
  \    const mid = Math.ceil((low + high) / 2);\n    // 如果找到元素\n    // 则在较高范围内继续查找最后一个元素\n\
  \    if (arr[mid] === value){\n      result = mid;\n      low = mid + 1;\n    }\
  \ else if (value < arr[mid]){\n      // 如果值小于中间元素，则在较低范围内查找\n      high = mid -\
  \ 1;\n    } else {\n      // 如果值大于中间元素，则在较高范围内查找\n      low = mid + 1;\n    }\n\
  \  }\n  // 返回索引\n  return result;\n}\n```\n\n### 测试用例\n\n输入:\n```javascript\nconst\
  \ arr = [1, 2, 3, 4, 5, 5, 6, 6, 7, 8, 9, 10];\nconsole.log(last(arr, 5));\nconsole.log(last(arr,\
  \ 6));\n```\n\n输出:\n```\n5\n6\n```\n\n© JavaScript Interview Guide | learnersbucket.com\n\
  \n345\n\n# JavaScript 中的管道函数 – 部分 1\n\n## 题目描述\n\n给定一个可以函数作为值的对象，创建一个函数，该函数接受输入并通过所有函数并返回计算后的值。\n\
  \n## 示例\n\n输入:\n```javascript\n{\n  a: (b, c) => b + c,\n  b: (a, b) => a + b,\n\
