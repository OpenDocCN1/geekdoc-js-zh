  \          />\n        )) || 0}\n      </div>\n    </section>\n  </main>\n);\n\n\
  export default App;\n```\n\n![](img/index-478_1.png)\n\n### 输出\n很奇怪，吧？尽管我们所做的一切都是正确的，但增加计数的时间比我们预期的要长。\n\
  事实证明，`setInterval` 函数的行为并没有我们想象中的那样。\n\n### 解决方案 2：使用 setTimeout\n\n让我们改变方法，尝试使用\
  \ `setTimeout` 实现相同的逻辑。\n我们可以通过递归调用同一个函数来使用 `setTimeout` 模拟 `setInterval` 函数。\n\
  使用相同的计算逻辑，来实现它。\n\n```javascript\n//setTimeout\nconst CountSetTimeout = (props)\
  \ => {\n  const intervalRef = useRef();\n  const countRef = useRef();\n\n  // 计数器的标签\n\
  \  // 要递增到的数字\n  // 计数的持续时间（秒）\n  const { number, duration } = props;\n  // 组件显示的数字\n\
  \  const [count, setCount] = useState(\"0\");\n  // 计算计算所需的时间\n  const [timeTaken,\
  \ setTimeTaken] = useState(Date.now());\n\n  useEffect(() => {\n    let start =\
  \ 0;\n    // 来自 props 的前三个数字\n    const end = parseInt(number);\n    // 如果为零，返回\n\
  \    if (start === end) return;\n\n    // 找到每次递增的持续时间\n    let totalMilSecDur =\
  \ parseInt(duration);\n    let incrementTime = (totalMilSecDur / end) * 1000;\n\n\
  \    // 定时器增加计数器\n    // 然后更新计数\n    // 如果 start 达到 end 则结束\n    let counter = ()\
  \ => {\n      intervalRef.current = setTimeout(() => {\n        start += 1;\n  \
  \      // 使用状态更新\n        setCount(String(start));\n        // 使用 ref 更新\n     \
  \   // countRef.current.innerHTML = start;\n        counter();\n        if (start\
  \ === end) {\n          clearTimeout(intervalRef.current);\n          const diff\
  \ = Date.now() - timeTaken;\n          // 使用 ref 时取消注释\n          // setCount(String(start));\n\
  \          setTimeTaken(diff / 1000);\n        }\n      }, incrementTime);\n   \
  \ };\n    // 调用\n    counter();\n    // 依赖项数组\n  }, [number, duration]);\n\n  return\
  \ (\n    <>\n      <span ref={countRef} className=\"Count\">{count}</span>\n   \
  \   {\"{\" \"}\n      {number === count && (\n        <span>\n          | 完成耗时：<b>{timeTaken}</b>\
  \ 秒\n        </span>\n      )}\n    </>\n  );\n};\n```\n\n让我们看看在点击开始按钮调用此函数时发生了什么。\n\
  \n```javascript\n// app.js\nimport React, { useState } from \"react\";\nimport {\
  \ CountSetTimeout } from \"./CountMethods\";\n\nconst App = () => {\n  const [number,\
  \ setNumber] = useState(0);\n  const [duration, setDuration] = useState(0);\n  const\
  \ [start, setStart] = useState(false);\n\n  // 如果任何输入变化重置\n  const basicReset =\
  \ () => {\n    setStart(false);\n  };\n\n  //存储数字\n  const numberChangeHandler =\
  \ (e) => {\n    const { value } = e.target;\n    setNumber(value);\n    basicReset();\n\
  \  };\n\n  //存储持续时间\n  const durationChangeHandler = (e) => {\n    const { value\
  \ } = e.target;\n    setDuration(value);\n    basicReset();\n  };\n\n  const startHandler\
  \ = () => {\n    // 触发动画\n    setStart(true);\n  };\n\n  const resetHandler = ()\
  \ => {\n    window.location.reload();\n  };\n\n  return (\n    <main style={{ width:\
