  \ Interview Guide | learnersbucket.com\n\n145\n\n# 在 JavaScript 中实现 store 类 (hashSet)\n\
  \n问题描述 -\n\n创建一个具有 `set(key, value)`、`get(key)` 和 `has(key)` 方法的简单 store 类 (hashSet)。\n\
  \n示例：\n\n```javascript\nconst store = new Store();\nstore.set('a', 10);\nstore.set('b',\
