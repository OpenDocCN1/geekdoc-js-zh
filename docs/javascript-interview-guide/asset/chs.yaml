  ));\n```\n\n**输出:**\n```text\n// 第一批\n2\n4\n6\n\"no success\"\n```\n\n# 实现 async\
  \ filter 函数\n\n## 题目描述\n实现一个函数，接受一个输入数组和一个异步迭代函数，并返回一个 promise。该 promise 将通过通过迭代函数测试的输入列表而\
  \ resolve。输入将并行运行，但输出将与原始顺序一致。\n\n异步迭代函数将接受一个输入和一个 `callback`。当输入处理完成时，将调用回调函数，回调的第一个参数是错误标志，第二个参数是结果。\n\
  \n## 示例\n\n**输入:**\n```javascript\nlet numPromise = filter([1, 2, 3, 4, 5], function(num,\
  \ callback) {\n  setTimeout(function () {\n    num = num * 2;\n    console.log(num);\n\
  \    // 抛出错误\n    if (num === 7) {\n      callback(true);\n    } else {\n      callback(null,\
  \ num !== 4);\n    }\n  }, 2000);\n});\n\nnumPromise.then((result) => console.log(\"\
  success:\" + result))\n  .catch(() => console.log(\"no success\"));\n```\n\n**输出:**\n\
  ```text\n2\n4\n6\n8\n10\n\"success:1,3,4,5\"\n```\n\n\n\n\n此函数是 `Array.filter()`\
  \ 的简单扩展，用于处理异步操作。\n\n为了实现这一功能，我们将创建一个新的 `promise` 并返回它。在 `promise` 内部，使用 `Array.forEach()`\
  \ 并行运行所有输入值，并在 `forEach` 内部将每个值传递给迭代函数（iteratee function）。\n\n在迭代函数的回调中，如果结果为 `true`（意味着输入通过了测试），则将该输入添加到当前索引的结果中。\n\
  \n最后，当我们处于输入数组的最后一个元素时，用结果解析该 `promise`。\n\n对最终输出进行过滤以移除间隙，因为我们必须保持通过测试值的顺序。输出数组中，未通过值的索引处将没有值。\n\
  \n```javascript\nconst filter = (arr, fn) => {\n  // 返回一个新的 promise\n  return new\
  \ Promise((resolve, reject) => {\n    const output = [];\n    let track = 0;\n \
  \   arr.forEach((e, i) => {\n      fn(e, (error, result) => {\n        // 发生错误时\
  \ reject\n        if(error){\n          reject(error);\n        }\n        // 已处理输入的数量\n\
  \        track++;\n        // 如果输入通过测试\n        // 将其添加到当前索引\n        if (result){\n\
  \          output[i] = e;\n        }\n        // 如果是输入数组的最后一个元素\n        if (track\
  \ >= arr.length){\n          // 使用真值过滤最终输出\n          // 以按顺序返回值\n          resolve(output.filter(Boolean));\n\
  \        }\n      });\n    });\n  });\n};\n```\n\n### 测试用例\n输入：\n```javascript\n\
  let numPromise = filter([1, 2, 3, 4, 5], function (num, callback) {\n  setTimeout(function\
  \ () {\n    num = num * 2;\n    console.log(num);\n    // 抛出错误\n    if (num ===\
  \ 7){\n      callback(true);\n    }\n    else{\n      callback(null, num !== 4);\n\
  \    }\n  }, 2000);\n});\n\nnumPromise.then((result) => console.log(\"success:\"\
  \ + result))\n  .catch(() => console.log(\"no success\"));\n```\n输出：\n```\n2\n4\n\
  6\n8\n10\n\"success:1,3,4,5\"\n```\n\n# 实现异步 reject 函数\n\n## 题目描述 -\n实现一个函数，该函数接收一个输入数组和一个异步迭代函数，并返回一个\
  \ `promise`。该 promise 解析为通过迭代函数未通过测试的输入列表。此函数与 `Async Filter` 完全相反。\n\n输入将并行运行，但输出顺序与原始顺序相同。\n\
