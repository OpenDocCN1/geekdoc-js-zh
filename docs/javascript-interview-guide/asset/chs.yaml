  // 输出:\n// \"Completing 3\"\n// \"Completing 1\"\n对于 JavaScript 是一种同步编程语言还是异步语言、是阻塞还是非阻塞代码，每个人都有自己的说法，但并不是所有人都能确定这一点（甚至我也不确定\
