  \ 78\n\n# 实现 mapLimit 异步函数\n\n## 题目描述\n实现一个 `mapLimit` 函数，它类似于 `Array.map()`，但它返回的是一个\
  \ promise。该 promise 在通过异步迭代函数映射每个输入后根据输出列表而 resolve（解析），或者在发生任何错误时 reject（拒绝）。它还接受一个限制参数（limit），来决定同时可以进行多少次操作。\n\
  \n异步迭代函数将接受一个输入和一个 `callback`。当输入处理完成时，将调用回调函数，回调的第一个参数是错误标志，第二个参数是结果。\n\n## 示例\n\
  \n**输入:**\n```javascript\nlet numPromise = mapLimit([1, 2, 3, 4, 5], 3, function(num,\
  \ callback) {\n  // 我是一个异步迭代函数\n  // 在这里执行异步操作\n  setTimeout(function () {\n   \
  \ num = num * 2;\n    console.log(num);\n    callback(null, num);\n  }, 1000);\n\
  });\n\nnumPromise.then((result) => console.log(\"success:\" + result))\n  .catch(()\
  \ => console.log(\"no success\"));\n```\n\n**输出:**\n```text\n/// 第一批\n2\n4\n6\n\
  /// 第二批\n© JavaScript Interview Guide | learnersbucket.com 79\n8\n10\n/// 最终结果\n\
  \"success: [2, 4, 6, 8, 10]\n```\n\n为了实现这个函数，我们必须结合使用 `Async.parallel` 和 `Async.series`。\n\
  \n- 首先，将输入数组切分成给定限制大小的子数组。这将返回一个数组的数组，类似于 `[[1, 2, 3], [4, 5]]`。\n- 父级数组将串行（series）运行，即只有在当前子数组完成后，下一个子数组才会执行。\n\
  - 每个子数组中的所有元素将并行（parallel）运行。\n- 累积每个子数组元素的结果，并据此 resolve promise。\n- 如果发生任何错误，则\
  \ reject。\n\n```javascript\n// 将数组按指定大小切成分块的辅助函数\nArray.prototype.chop = function(size)\
  \ {\n  // 临时数组\n  const temp = [...this];\n  // 如果 size 未定义\n  if (!size) {\n  \
  \  return temp;\n  }\n  // 输出\n  const output = [];\n  let i = 0;\n  // 遍历数组\n \
  \ while (i < temp.length) {\n    // 切片出给定大小的子数组\n    //并将它们推入输出数组\n    output.push(temp.slice(i,\
  \ i + size));\n    i = i + size;\n    © JavaScript Interview Guide | learnersbucket.com\
  \ 80\n  }\n  return output;\n};\n\nconst mapLimit = (arr, limit, fn) => {\n  //\
  \ 返回一个新的 promise\n  return new Promise((resolve, reject) => {\n    // 将输入数组切分为限制大小的子数组\n\
  \    // [[1, 2, 3], [1, 2, 3]]\n    let chopped = arr.chop(limit);\n    // 对于 chopped\
  \ 的所有子数组\n    // 串行运行它们\n    // 即一个接一个\n    // 初始它将取一个空数组来 resolve\n    // 合并子数组的输出并将其传递\n\
  \    // 给下一个\n    const final = chopped.reduce((a, b) => {\n      // 监听上一个值的响应\n\
  \      return a.then((val) => {\n        // 并行运行子数组的值\n        // 将每个输入传递给迭代函数\n\
  \        // 在所有任务执行后存储它们的输出\n        return new Promise((resolve, reject) => {\n\
  \          const results = [];\n          let tasksCompleted = 0;\n          b.forEach((e)\
  \ => {\n            // 根据异步迭代函数\n            // 的输出\n            fn(e, (error, value)\
  \ => {\n              if (error) {\n                reject(error);\n           \
  \   } else {\n                results.push(value);\n                tasksCompleted++;\n\
  \                if (tasksCompleted === b.length) {\n                  resolve([...val,\
  \ ...results]);\n                }\n              }\n            });\n         \
  \ });\n        });\n      });\n    }, Promise.resolve([]));\n\n    // 根据最终 promise\
  \ 的状态\n    // 调用最终 promise。\n    final.then((result) => {\n      resolve(result);\n\
  \    }).catch((error) => {\n      reject(error);\n    });\n  });\n};\n```\n\n###\
  \ 测试用例 1. 全部成功\n\n**输入:**\n```javascript\nlet numPromise = mapLimit([1, 2, 3, 4,\
  \ 5], 3, function(num, callback) {\n  setTimeout(function () {\n    num = num *\
