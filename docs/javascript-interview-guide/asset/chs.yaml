  \ {\n          resolve(results)\n        }\n        reject(error)\n      })\n  \
  \  })\n  });\n}\n```\n\nfunction task(time) {\n  return new Promise(function(resolve,\
  \ reject) {\n    setTimeout(function() {\n      resolve(time);\n    }, time);\n\
