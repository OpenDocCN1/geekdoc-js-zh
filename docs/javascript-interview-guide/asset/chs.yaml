  \ 部分\n\n## 问题描述\n创建一个类似于 `[Immer produce()](https://immerjs.github.io/immer/produce/)`\
  \ 的不可变辅助函数，允许对受限制的对象进行修改。\n\n## 示例\n```javascript\nconst obj = {\n  a: {\n    b:\
  \ {\n      c: 2\n    }\n  }\n};\n\n// 对象是被冻结的\n// 它的属性无法更新\ndeepFreeze(obj);\n\n\
  // obj 只能通过 produce 函数更新\nconst newState = produce(obj, draft => {\n  draft.a.b.c\
  \ = 3;\n  draft.a.b.d = 4;\n});\n\nconsole.log(newState);\n```\n\n```json\n{\n \
  \ \"a\": {\n    \"b\": {\n      \"c\": 3,\n      \"d\": 4\n    }\n  }\n}\n```\n\
  // newState 也会被冻结\n// 它无法被更新\ndelete newState.a.b.c;\n\nconsole.log(newState);\n\
  ```\n\n```json\n{\n  \"a\": {\n    \"b\": {\n      \"c\": 3,\n      \"d\": 4\n \
  \   }\n  }\n}\n```\n*/\n\n为了实现这一点，我们首先创建输入 `obj` 的克隆，然后将此输入对象传递给 `produce` 的回调函数进行处理。\n\
  \n处理完成后，执行 `深度比较` 来检查是否有变化。如果没有变化，则返回原始输入，否则返回更新后的新对象。\n\n在返回之前对对象进行 `深度冻结`，以便它无法被直接更新。\n\
  \n```javascript\n// 深度冻结对象的函数\nfunction deepFreeze(object) {\n  // 获取在对象上定义的属性名\n\
  \  let propNames = Object.getOwnPropertyNames(object);\n  // 递归冻结所有属性\n  for (let\
  \ name of propNames) {\n    let value = object[name];\n    object[name] = value\
  \ && typeof value === \"object\" ? deepFreeze(value) : value;\n  }\n  return Object.freeze(object);\n\
  };\n\n// 深度检查两个对象的函数\nconst deepEqual = (object1, object2) => {\n  // 获取对象的键\n \
  \ const keys1 = Object.keys(object1);\n  const keys2 = Object.keys(object2);\n \
  \ // 如果键不匹配\n  if (keys1.length !== keys2.length) {\n    return false;\n  }\n  for\
  \ (const key of keys1) {\n    // 获取值\n    const val1 = object1[key];\n    const\
  \ val2 = object2[key];\n    // 如果两个值都是对象\n    const areObjects = val1 && typeof\
  \ val1 === \"object\" && val2 && typeof val2 === \"object\";\n    // 如果是对象\n   \
  \ if (areObjects) {\n      // 再次深度检查\n      if (!deepEqual(val1, val2)) {\n    \
  \    return false;\n      }\n    }\n    // 如果不是对象\n    // 比较值\n    else if (!areObjects\
  \ && val1 !== val2) {\n      return false;\n    }\n  }\n  return true;\n};\n\n//\
  \ 更新值的主函数\nfunction produce(base, recipe) {\n  // 克隆冻结对象\n  let clone = JSON.parse(JSON.stringify(base));\n\
  \  // 将克隆传递给 recipe\n  // 获取更新后的值\n  recipe(clone);\n  // 如果两者不同\n  // 更新值\n  if\
  \ (deepEqual(base, clone)) {\n    clone = base;\n  }\n  // 深度冻结\n  deepFreeze(clone);\n\
  \  // 返回克隆\n  return clone;\n};\n```\n\n### 测试用例\n```javascript\nconst obj = {\n\
  \  a: {\n    b: {\n      c: 2\n    }\n  }\n};\n\n// 对象是被冻结的\n// 它的属性无法更新\ndeepFreeze(obj);\n\
  \n// obj 只能通过 produce 函数更新\nconst newState = produce(obj, draft => {\n  draft.a.b.c\
  \ = 3;\n  draft.a.b.d = 4;\n});\n\nconsole.log(newState);\n```\n\n```json\n{\n \
  \ \"a\": {\n    \"b\": {\n      \"c\": 3,\n      \"d\": 4\n    }\n  }\n}\n```\n\
  // newState 也会被冻结\n// 它无法被更新\ndelete newState.a.b.c;\n\nconsole.log(newState);\n\
  ```\n\n```json\n{\n  \"a\": {\n    \"b\": {\n      \"c\": 3,\n      \"d\": 4\n \
  \   }\n  }\n}\n```\n*/\n\n# 高优先级\n\n## 问题描述\n当你正在节流请求时，假设需要进行高优先级调用，你该如何管理？有两种方式可以优先级调用：\n\
  \n1. `low`:（默认）\n2. `high`: 使用 `microtask`\n\n根据 MDN – 微任务是在返回控制权给事件循环之后，但在浏览器将控制权交给其他事件之前执行的任务。微任务队列被\
  \ `microtask` 函数使用。\n\n```javascript\n// 低优先级\nlet callback = () => {\n  console.log(\"\
  low priority\");\n};\nsetTimeout(callback, 0);\n\n// 高优先级\nlet callback2 = () =>\
  \ {\n  console.log(\"high priority\");\n};\nsetTimeout(callback2, 10);\n\n// 高优先级\n\
  let urgentCallback = () => {\n  console.log(\"high priority\");\n};\nqueueMicrotask(urgentCallback);\n\
  \nconsole.log(\"Main program started\");\n```\n\n**输出：**\n```\nMain program started\n\
  high priority\nlow priority\nlow priority\n```\n注意 – 调用是有优先级的，但它们解析的时间可能会变化，因此我们看到的输出是随机的。\n\
  \n[]\n\n# 将 JSON 转换为 HTML\n\n## 问题描述\n给定一个包含 DOM 元素类型、子元素和属性 JSON，编写一个函数将对象转换为实际的\
  \ DOM。\n\n## 示例\n**输入：**\n```javascript\nconst json = {\n  type: 'div',\n  props:\
  \ {\n    id: 'hello',\n    class: \"foo\"\n  },\n  children: [\n    {\n      type:\
  \ 'h1',\n      children: 'HELLO'\n    },\n    {\n      type: 'p',\n      children:\
  \ [\n        {\n          type: 'span',\n          props: { class: \"bar\" },\n\
  \          children: 'World'\n        }\n      ]\n    }\n  ]\n};\n\nJSONtoHTML(json);\n\
  ```\n\n**输出：**\n```html\n<div id=\"hello\" class=\"foo\">\n  <h1>HELLO</h1>\n  <p>\n\
  \    <span class=\"bar\">World</span>\n  </p>\n</div>\n```\n\n输入的 JSON 可能是一个对象，也可能是对象数组，因此必须进行妥善处理。\n\
  \n实现此函数的逻辑非常直观：\n\n- 创建一个片段来存储 DOM 元素数组。\n- 如果 JSON 元素是元素数组，遍历数组，对于数组中的每个项，创建一个给定类型的新元素...\n\
  \n\n\n\n\n分配所有属性，如果子节点是元素数组，则递归调用相同函数来生成相同的 HTML，否则将子节点设置为 `innerText`。\n\n● 如果\
  \ `JSON` 元素是一个对象，则将其转换为数组并递归调用相同函数，以便据此构建 DOM。\n\n```javascript\nconst JSONtoHTML\
  \ = (json) => {\n  // create a fragment\n  const fragment = document.createDocumentFragment();\n\
  \  if (Array.isArray(json)) {\n    // 将数组中的每个条目转换为 DOM 元素\n    for (let entry of\
  \ json) {\n      // 创建元素\n      const element = document.createElement(entry.type);\n\
  \      // 如果属性可用\n      // 设置它们\n      if (entry.props) {\n        for (let key\
  \ in entry.props) {\n          element.setAttribute(key, entry.props[key]);\n  \
  \      }\n      }\n      // 如果子节点是数组\n      if (Array.isArray(entry.children)) {\n\
  \        // 递归将子节点转换为 DOM\n        // 并分配它们\n        for (let child of entry.children)\
  \ {\n          element.appendChild(JSONtoHTML(child));\n        }\n      }\n   \
  \   // 如果子节点是字符串/文本\n      else {\n        element.innerText = entry.children;\n\
  \      }\n      // 将元素加回碎片\n      fragment.appendChild(element);\n    }\n  }\n \
  \ // 如果不是数组，递归调用相同函数\n  // 将条目作为数组传递\n  else {\n    return JSONtoHTML([json]);\n\
  \  }\n  return fragment;\n};\n```\n\n### 测试用例\n\nInput:\n```javascript\nconst JSON\
  \ = [\n  {\n    type: 'div',\n    props: { id: 'hello', class: \"foo\" },\n    children:\
  \ [\n      { type: 'h1', children: 'HELLO' },\n      { type: 'p', children: [{ type:\
  \ 'span', props: { class: \"bar\" }, children: 'World' }] }\n    ]\n  },\n  {\n\
  \    type: 'section',\n    props: { id: 'hello-2', class: \"foo-2\" },\n    children:\
  \ [\n      { type: 'h1', children: 'HELLO-2' },\n      { type: 'p', children: [{\
  \ type: 'span', props: { class: \"bar-2\" }, children: 'World' }] }\n    ]\n  }\n\
  ];\nconsole.log(JSONtoHTML(json));\n```\n\nOutput:\n```html\n<div id=\"hello\" class=\"\
  foo\">\n  <h1>HELLO</h1>\n  <p>\n    <span class=\"bar\">World</span>\n  </p>\n\
  </div>\n<section id=\"hello-2\" class=\"foo-2\">\n  <h1>HELLO-2</h1>\n  <p>\n  \
  \  <span class=\"bar-2\">World</span>\n  </p>\n</section>\n```\n\n# 将 HTML 转换为 JSON\n\
  \n## 问题描述\n编写一个函数，接收 DOM 节点作为输入并将其转换为 JavaScript 对象。该对象应该包含节点的类型、属性以及所有子节点。\n\n\
  ## 示例\n\nInput:\n```html\n<div id=\"foo\">\n  <h1>Hello</h1>\n  <p class=\"bar\"\
  >\n    <span>World!</span>\n  </p>\n</div>\n```\n\nOutput:\n```json\n{\n  \"props\"\
  : {\n    \"id\": \"foo\"\n  },\n  \"children\": [\n    {\n      \"children\": \"\
  Hello\",\n      \"type\": \"h1\"\n    },\n    {\n      \"props\": {\n        \"\
  class\": \"bar\"\n      },\n      \"children\": [\n        {\n          \"children\"\
  : \"World!\",\n          \"type\": \"span\"\n        }\n      ],\n      \"type\"\
  : \"p\"\n    }\n  ],\n  \"type\": \"div\"\n}\n```\n\n为了创建此函数，我们通常需要处理三点：\n\n● 获取节点的\
  \ HTML 元素名称。\n● 获取节点的所有属性/特性。\n● 如果节点没有任何子节点，则获取其内容；否则遍历每个子节点，并递归调用相同函数来为每个子节点生成对象。\n\
  \n我们将使用一个辅助函数来获取节点的所有属性。\n\n```javascript\n// 获取节点所有属性的辅助函数\nconst getAllAtrributes\
  \ = (node) => {\n  let obj = {};\n  for (let att, i = 0, atts = node.attributes,\
  \ n = atts.length; i < n; i++) {\n    att = atts[i];\n    obj[att.nodeName] = att.nodeValue;\n\
  \  }\n  return obj;\n};\n\nconst HTMLtoJSON = (node) => {\n  // 存储输出\n  const output\
  \ = {};\n  // 获取节点名\n  const type = node.localName;\n  // 默认将子节点设置为 innerText\n\
  \  let children = node.innerText;\n  // 如果节点有子节点\n  if (node.children.length > 0)\
  \ {\n    // 递归计算所有子节点\n    children = [];\n    for (let child of node.children)\
  \ {\n      children.push(HTMLtoJSON(child));\n    }\n  }\n  // 获取节点的所有属性\n  const\
  \ props = getAllAtrributes(node);\n  // 如果属性存在则存储它们\n  if (Object.keys(props).length)\
  \ {\n    output['props'] = props;\n  }\n  // 存储类型和子节点\n  output['children'] = children;\n\
  \  output['type'] = type;\n  return output;\n};\n```\n\n### 测试用例\n\nInput:\n```html\n\
  <div id=\"foo\">\n  <h1>Hello</h1>\n  <p class=\"bar\">\n    <span>World!</span>\n\
  \  </p>\n</div>\n```\n```javascript\nconst node = document.getElementById(\"foo\"\
  );\nconsole.log(HTMLtoJSON(node));\n```\n\nOutput:\n```json\n{\n  \"props\": {\n\
  \    \"id\": \"foo\"\n  },\n  \"children\": [\n    {\n      \"children\": \"Hello\"\
  ,\n      \"type\": \"h1\"\n    },\n    {\n      \"props\": {\n        \"class\"\
  : \"bar\"\n      },\n      \"children\": [\n        {\n          \"children\": \"\
  World!\",\n          \"type\": \"span\"\n        }\n      ],\n      \"type\": \"\
  p\"\n    }\n  ],\n  \"type\": \"div\"\n}\n```\n\n# 并发历史系统\n\n## 问题描述\n设计一个并发历史系统，在该系统中可以注册实体及其服务，并跟踪它们所做的更改。\n\
  \n为了实现这个系统，我们将使用一个 `map` 来存储唯一的实体。每个实体内部可以包含多个服务（文档），该对象将作为值存储在实体旁边。\n\n每当请求新的历史条目时，我们将其与上一次历史进行比较，如果数据发生了变化，将其推入历史记录。\n\
  \n## 示例\n\n```javascript\nconst historyTracking = new HistoryTracking();\nhistoryTracking.registerEntity(\"\
  document\");\nhistoryTracking.registerService(\"document\", \"Ultimate Guide\");\n\
  historyTracking.track(\"document\", \"Ultimate Guide\", \"Problem 1\");\nhistoryTracking.track(\"\
  document\", \"Ultimate Guide\", \"Problem 2\");\nconsole.log(historyTracking.get(\"\
  document\"));\n```\n\n### 实现\n\n我们将使用单例设计模式来确保跟踪时使用一个实例。\n\n```javascript\nclass\
  \ HistoryTracking {\n  constructor() {\n    // 跟踪唯一的条目\n    this.entities = new\
  \ Map();\n  }\n  // 注册新实体\n  registerEntity(entity) {\n    this.entities.set(entity,\
  \ {});\n  }\n  // 为实体注册新服务\n  registerService(entity, service) {\n    const existingServices\
  \ = this.entities.get(entity);\n    // 如果实体不存在\n    // 创建带有服务的实体\n    if (!existingServices)\
  \ {\n      this.entities.set(entity, { [service]: [] });\n    }\n    // 将服务添加到现有实体\n\
  \    else {\n      const merged = { ...existingServices, [service]: [] };\n    \
  \  this.entities.set(entity, merged);\n    }\n  }\n  // 实体及其服务的历史\n  track(entity,\
  \ service, newData) {\n    // 获取服务的最后一个条目\n    const services = this.entities.get(entity);\n\
  \    const history = services[service];\n    const last = history[history.length\
  \ - 1];\n    // 没有之前的条目\n    // 将当前的设置为最新\n    if (!last) {\n      const serviceWithNewHistory\
  \ = { ...services, [service]: [newData] };\n      this.entities.set(entity, serviceWithNewHistory);\n\
  \    }\n    // 否则比较新的和上一个的\n    // 如果两者不同，则创建新条目\n    else {\n      const lastStr\
  \ = JSON.stringify(last);\n      const newDataStr = JSON.stringify(newData);\n \
  \     if (lastStr !== newDataStr) {\n        history.push(newData);\n      }\n \
  \   }\n  }\n  get(entity) {\n    return this.entities.get(entity);\n  }\n}\n```\n\
  \n\n\n\n\n```javascript\n.stringify(newData);\n\nif (lastStr !== newDataStr) {\n\
  \  const serviceWithNewHistory = {\n    ...services,\n    [service]: [...history,\
  \ newData]\n  };\n  this.entities.set(entity, serviceWithNewHistory);\n}\n}\n\n\
  // 获取完整的历史\ngetHistory(entity, service) {\n  const services = this.entities.get(entity);\n\
  \  return services[service];\n}\n\n// 创建跟踪器的单例实例\n// 使用单例设计模式\nconst HistoryTracking\
  \ = (function() {\n  let instance;\n  return function() {\n    if (!instance) {\n\
  \      instance = new HistoryTrackingHelper();\n    }\n    return instance;\n  };\n\
  })();\n```\n\n### 测试用例\n**输入:**\n```javascript\nconst historyTracking = HistoryTracking();\n\
  historyTracking.registerEntity(\"document\");\nhistoryTracking.registerService(\"\
  document\", 'JavaScript Ultimate Guide');\nhistoryTracking.track(\"document\", 'JavaScript\
  \ Ultimate Guide', \"Problem 1\");\nhistoryTracking.track(\"document\", 'JavaScript\
  \ Ultimate Guide', \"Problem 1, Problem 2\");\nhistoryTracking.track(\"document\"\
  , 'JavaScript Ultimate Guide', \"Problem 3\");\nconsole.log(historyTracking.getHistory(\"\
  document\", 'JavaScript Ultimate Guide'));\n```\n\n**输出:**\n```json\n[\n  \"Problem\
  \ 1\",\n  \"Problem 1, Problem 2\",\n  \"Problem 3\"\n]\n```\n\n---\n\n### 实现一个内存搜索引擎\n\
  **问题描述**\n实现一个内存搜索引擎，其中多个文档可以存储在特定的命名空间（namespace）下，并对其进行搜索，传递 `orderBy` 参数对搜索结果进行排序。\n\
  \n**示例**\n```javascript\nconst searchEngine = new InMemorySearch();\nsearchEngine.addDocuments('Movies',\
  \ \n  {name: 'Avenger', rating: 8.5, year: 2017},\n  {name: 'Black Adam', rating:\
  \ 8.7, year: 2022},\n  {name: 'Jhon Wick 4', rating: 8.2, year: 2023},\n  {name:\
  \ 'Black Panther', rating: 9.0, year: 2022}\n);\nconsole.log(searchEngine.search('Movies',\
  \ (e) => e.rating > 8.5, {key: 'rating', asc: false}));\n```\n**输出:**\n```json\n\
  [\n  {\n    \"name\": \"Black Panther\",\n    \"rating\": 9,\n    \"year\": 2022\n\
  \  },\n  {\n    \"name\": \"Black Adam\",\n    \"rating\": 8.7,\n    \"year\": 2022\n\
  \  }\n]\n```\n\n为了实现这一点，我们可以使用 [map](https://learnersbucket.com/tutorials/es6/maps)\
  \ 来注册和跟踪不同的命名空间及其关联文档。对于搜索，我们将接收命名空间和一个回调函数，该回调函数将根据其输出过滤值。该函数还将接受一个 `orderBy` 参数，包含搜索结果排序的键名和顺序。\n\
  \n```javascript\nclass InMemorySearch {\n  constructor() {\n    // 跟踪命名空间及其文档\n\
  \    this.entities = new Map();\n  }\n  // 注册新命名空间\n  registerNameSpace(name) {\n\
  \    this.entities.set(name, []);\n  }\n  // 向命名空间添加文档\n  addDocuments(nameSpace,\
  \ ...documents) {\n    const existing = this.entities.get(nameSpace);\n    // 如果命名空间不存在\n\
  \    // 创建一个并添加文档\n    if (!existing) {\n      this.entities.set(nameSpace, [...documents]);\n\
  \    }\n    // 否则合并文档\n    else {\n      this.entities.set(nameSpace, [...existing,\
  \ ...documents]);\n    }\n  }\n  // 搜索给定命名空间的文档\n  search(nameSpace, filterFN, orderByFN)\
  \ {\n    // 获取命名空间\n    const docs = this.entities.get(nameSpace);\n    // 获取过滤后的结果\n\
  \    const filtered = docs.filter((e) => filterFN(e));\n    // 如果请求了 orderby\n \
  \   if (orderByFN) {\n      const {key, asc} = orderByFN;\n      // 根据请求的键和顺序\n\
  \      // 对搜索结果进行排序\n      return filtered.sort((a, b) => {\n        if (asc) {\n\
  \          return a[key] - b[key];\n        } else {\n          return b[key] -\
  \ a[key];\n        }\n      });\n    }\n    return filtered;\n  }\n};\n```\n\n**测试用例**\n\
  **输入:**\n```javascript\nconst searchEngine = new InMemorySearch();\nsearchEngine.addDocuments('Movies',\
  \ \n  {name: 'Avenger', rating: 8.5, year: 2017},\n  {name: 'Black Adam', rating:\
  \ 8.7, year: 2022},\n  {name: 'Jhon Wick 4', rating: 8.2, year: 2023},\n  {name:\
  \ 'Black Panther', rating: 9.0, year: 2022}\n);\nconsole.log(searchEngine.search('Movies',\
  \ (e) => e.rating > 8.5, {key: 'rating', asc: false}));\n```\n**输出:**\n```json\n\
  [\n  {\n    \"name\": \"Black Panther\",\n    \"rating\": 9,\n    \"year\": 2022\n\
  \  },\n  {\n    \"name\": \"Black Adam\",\n    \"rating\": 8.7,\n    \"year\": 2022\n\
  \  }\n]\n```\n\n---\n\n### 实现一个模糊搜索函数\n**问题描述**\n在 JavaScript 中实现一个执行模糊匹配的函数，它接受字符串数组和查询字符串作为输入，并返回匹配的字符串列表。\n\
  \n**示例**\n```javascript\nconst strArr = [\n  'Doomsayer', 'Doomguard', 'Doomhamer',\
  \ 'Bane of Doom',\n  'Fearsome Doomguard', 'Dr. Boom', 'Majordomo',\n  'Shadowbomber',\
  \ 'Shadowform', 'Goldshire footman'\n];\nconst query = 'an';\nfuzzySearch(strArr,\
  \ query);\n// [\"Bane of Doom\", \"Goldshire footman\"]\n```\n如果搜索字符串中的字符都按照相同的顺序出现在字符串中，则认为该字符串是匹配。该函数最复杂的部分是创建模糊搜索算法。从问题描述中，我们了解到字符的顺序在搜索中最重要的。因此，我们可以使用[滑动窗口技术](https://levelup.gitconnected.com/understanding-the-sliding-window-technique-in-algorithms-c6c3bf8226da)在每个字符串中搜索。\n\
  \n- 使用两个变量，一个用于跟踪查询字符串的字符，另一个用于跟踪字符串中上一次搜索的位置。\n- 从字符串中选取第一个字符，并从上次搜索位置获取其在字符串中的索引，如果字符存在，则将上次搜索位置更新为当前位置并继续检查。\n\
  - 如果任何字符不存在，则返回 false，否则返回 true。\n\n```javascript\nconst fuzzySearch = function(str,\
  \ query) {\n  // 转换查询和字符串\n  // 以忽略大小写\n  str = str.toLowerCase();\n  query = query.toLowerCase();\n\
  \  // 使用两个变量来跟踪\n  // 当前\n  // 和上一次搜索的位置\n  let i = 0, lastSearched = -1, current\
  \ = query[i];\n  while (current) {\n    // 如果字符不存在\n    // 返回 false\n    if (~lastSearched\
  \ = str.indexOf(current, lastSearched + 1)) {\n      return false;\n    }\n    current\
  \ = query[++i];\n  }\n  // 如果搜索完成\n  // 返回 true\n  return true;\n};\n\n// 通过此函数过滤数组中的所有字符串并返回通过的项\n\
  const search = function(arr, query) {\n  return arr.filter((e) => fuzzySearch(e,\
  \ query));\n};\n```\n\n**测试用例**\n**输入:**\n```javascript\nconst arr = [\n  'Doomsayer',\
  \ 'Doomguard', 'Doomhamer', 'Bane of Doom',\n  'Fearsome Doomguard', 'Dr. Boom',\
  \ 'Majordomo',\n  'Shadowbomber', 'Shadowform', 'Goldshire footman'\n];\nconsole.log(search(arr,\
  \ 'sh'));\n```\n**输出:**\n```json\n[\"Shadowbomber\", \"Shadowform\", \"Goldshire\
  \ footman\"]\n```\n\n---\n\n### 取消 API 请求\n**问题描述**\n解释一种取消正在进行的 API 请求的方法。\n\n\
  **解释**\nJavaScript web API 有一个名为 [AbortController](https://developers.mozilla.org/en-US/docs/Web/API/AbortController/AbortController)\
  \ 的方法。这个 AbortController 有一个名为 [signal](https://developer.mozilla.org/en-US/docs/Web/API/AbortController/signal)\
  \ 的属性，允许我们创建一个与 Fetch API 关联的 AbortSignal，从而提供取消 API 请求的选项。\n\n该 signal 作为参数传递给\
  \ Fetch API。\n\n\n\n\n为了实现这一功能，我们将创建一个 `AbortController()` 构造函数并获取它的 `signal` 属性。将此\
  \ `signal` 属性作为参数传递给 `fetch` API，并在我们想要取消 API 请求时调用该 `constructor` 的 `abort()` 方法。\n\
  \n当 `abort()` 被调用时，`fetch()` 承诺将以 `AbortError` 拒绝。在下面的示例中，我们创建了两个按钮：`download` 和\
  \ `abort`。点击 `download` 时，将发出一个 API 请求；点击 `abort` 时，请求将被中止。\n\n### HTML:\n```html\n\
  <div>\n  <button class=\"download\">Download</button>\n  <button class=\"abort\"\
  >Abort</button>\n</div>\n```\n\n### JavaScript:\n```javascript\n// create abort\
  \ controller\nconst controller = new AbortController();\nconst signal = controller.signal;\n\
  \n// get the buttons\nconst downloadBtn = document.querySelector(\".download\");\n\
  const abortBtn = document.querySelector(\".abort\");\n\n// download event\ndownloadBtn.addEventListener(\"\
  click\", makeCall);\n\n// abort event\nabortBtn.addEventListener(\"click\", () =>\
  \ {\n  controller.abort();\n  console.log(\"Download aborted\");\n});\n\n// helper\
  \ method to make api call\nfunction makeCall() {\n  fetch('https://jsonplaceholder.typicode.com/photos',\
  \ { signal })\n    .then((response) => {\n      console.log(\"complete\", response);\n\
  \    })\n    .catch((err) => {\n      console.error(`error: ${err.message}`);\n\
  \    });\n}\n```\n在开发者工具中限制为慢速 2G 网速并点击下载按钮，稍后点击中止，API 调用将以 abort 错误终止。\n\n# 高亮字符串中的单词\n\
  \n### 问题陈述\n给定一个字符串和一个关键词数组，高亮字符串中属于关键词数组的单词。\n\n## 示例\n```javascript\nconst str\
  \ = \"Ultimate JavaScript / FrontEnd Guide\";\nconst words = ['Front', 'End', 'JavaScript'];\n\
  highlight(str, words);\n// // \"Ultimate <strong>JavaScript</strong> / <strong>FrontEnd</strong>\
  \ Guide\"\n```\n如果两个单词重叠或相邻，请将它们合并。正如你在上面的示例所示，有两个不同的单词 `Front` 和 `End`，但它们被在一起高亮。\n\
  \n为了实现此函数，我们需要处理两种不同的情况：\n1. 检查字符串中的任何单词是否存在于 `keywords` 数组中，并对其高亮。\n2. 否则，将每个单词拆分为两个子单词，并检查每个子单词是否存在。如果任何部分存在，则单独高亮；如果两个部分都存在，则将一起高亮。\n\
  \n```javascript\nfunction highlight(str, keywords) {\n  // 关键词的唯一集合\n  const uniqueKeywords\
  \ = new Set(keywords);\n  // 将字符串拆分为单词\n  let words = str.split(\" \");\n  // 遍历每个单词\n\
  \  const result = words.map(word => {\n    // 用于跟踪输出\n    let output = '';\n   \
  \ // 如果在关键词集中找到了单词\n    // 则进行高亮\n    if (uniqueKeywords.has(word)) {\n      output\
  \ = `<strong>${word}</strong>`;\n    }\n    // 否则检查单词的子字符串是否在关键词集中\n    else {\n\
  \      for (let i = 0; i < word.length; i++) {\n        // 将单词拆分为两部分\n        const\
  \ prefix = word.slice(0, i + 1);\n        const suffix = word.slice(i + 1);\n  \
  \      // 如果两个部分都在关键词中\n        // 将它们合并嵌入\n        if (uniqueKeywords.has(prefix)\
  \ && uniqueKeywords.has(suffix)) {\n          output = `<strong>${prefix}${suffix}</strong>`;\n\
  \          break;\n        }\n        // 否则如果只有前缀存在\n        // 对其高亮\n        else\
  \ if (uniqueKeywords.has(prefix) && !uniqueKeywords.has(suffix)) {\n          output\
  \ = `<strong>${prefix}</strong>${suffix}`;\n        }\n        // 否则如果只有后缀存在\n \
  \       // 对其高亮\n        else if (!uniqueKeywords.has(prefix) && uniqueKeywords.has(suffix))\
  \ {\n          output = `${prefix}<strong>${suffix}</strong>`;\n        }\n    \
  \  }\n    }\n    // 如果没有发生嵌入\n    // 返回原始单词\n    return output !== '' ? output :\
  \ word;\n  });\n  // 转回字符串\n  return result.join(\" \");\n}\n```\n\n### 测试用例\n**输入：**\n\
  ```javascript\nconst str = \"Ultimate JavaScript / FrontEnd Guide\";\nconst words\
  \ = ['Front', 'End', 'JavaScript'];\nconsole.log(highlight(str, words));\n```\n\
  **输出：**\n```javascript\n// // \"Ultimate <strong>JavaScript</strong> / <strong>FrontEnd</strong>\
  \ Guide\"\n```\n\n# Reactjs 问题\n\n## usePrevious() hook\n在 React 中创建一个可以记住上一个值的钩（hook）。\n\
  \n```javascript\nimport { useState, useEffect, useRef } from \"react\";\n\nconst\
  \ usePrevious = (value) => {\n  const ref = useRef();\n  useEffect(() => {\n   \
  \ ref.current = value;\n  }, [value]);\n  return ref.current;\n};\n\nconst Example\
  \ = () => {\n  const [count, setCount] = useState(0);\n  // 获取传入上一次渲染的值\n  const\
  \ prevCount = usePrevious(count);\n  // 显示当前和上一个值\n  return (\n    <div>\n     \
  \ <h1>Now: {count}, before: {prevCount}</h1>\n      <button onClick={() => setCount(count\
  \ - 1)}>Decrement</button>\n    </div>\n  );\n};\n\nexport default Example;\n```\n\
  \n## useIdle() hook\n在 React 中创建一个 `useIdle()` 钩，它根据用户在定义时间后的活跃或非活跃状态返回布尔值。\n\n\
  我们将 `delay` 作为 `useIdle(delay)` 的输入，如果用户没有执行任何操作，则他被视为 `Idle`（空闲）。\n\n\n\n实现逻辑非常直观，我们将使用\
  \ `useState()` 来监控用户的活跃状态，并使用 `useEffect()` 在窗口对象以及文档上分配事件监听器，并在清理期间移除这些监听器。\n\n\
  我们将使用 `useRef()` 来跟踪一个 `setTimeout`，如果用户在输入的持续时间内没有执行任何操作，该超时将改变状态；否则清除计时器并重新开始一个新的超时。\n\
  \n```javascript\nimport { useState, useEffect, useRef } from \"react\";\n\nconst\
  \ useIdle = (delay) => {\n  const [isIdle, setIsIdle] = useState(false);\n  // 创建一个新的引用来跟踪计时器\n\
  \  const timeoutId = useRef();\n\n  // 绑定和移除监听器\n  useEffect(() => {\n    setup();\n\
  \    return () => {\n      cleanUp();\n    };\n  });\n\n  const startTimer = ()\
  \ => {\n    // 在调用 goInactive 前等待 delay 时间\n    timeoutId.current = setTimeout(goInactive,\
  \ delay);\n  };\n\n  const resetTimer = () => {\n    // 重置计时器并让用户处于活跃状态\n    clearTimeout(timeoutId.current);\n\
  \    goActive();\n  };\n\n  const goInactive = () => {\n    setIsIdle(true);\n \
  \ };\n\n  const goActive = () => {\n    setIsIdle(false);\n    // 计时器以跟踪空闲状态\n \
  \   startTimer();\n  };\n\n  const setup = () => {\n    document.addEventListener(\"\
  mousemove\", resetTimer, false);\n    document.addEventListener(\"mousedown\", resetTimer,\
  \ false);\n    document.addEventListener(\"keypress\", resetTimer, false);\n   \
  \ document.addEventListener(\"DOMMouseScroll\", resetTimer, false);\n    document.addEventListener(\"\
  mousewheel\", resetTimer, false);\n    document.addEventListener(\"touchmove\",\
  \ resetTimer, false);\n    document.addEventListener(\"MSPointerMove\", resetTimer,\
  \ false);\n    // 边缘情况\n    // 如果标签页或失去焦点\n    window.addEventListener(\"blur\"\
  , startTimer, false);\n    window.addEventListener(\"focus\", resetTimer, false);\n\
  \  };\n\n  const cleanUp = () => {\n    document.removeEventListener(\"mousemove\"\
  , resetTimer);\n    document.removeEventListener(\"mousedown\", resetTimer);\n \
  \   document.removeEventListener(\"keypress\", resetTimer);\n    document.removeEventListener(\"\
  DOMMouseScroll\", resetTimer);\n    document.removeEventListener(\"mousewheel\"\
  , resetTimer);\n    document.removeEventListener(\"touchmove\", resetTimer);\n \
  \   document.removeEventListener(\"MSPointerMove\", resetTimer);\n    // 边缘情况\n\
  \    // 如果标签页切换或失去焦点\n    window.removeEventListener(\"blur\", startTimer);\n  \
  \  window.removeEventListener(\"focus\", resetTimer);\n    // 内存泄漏\n    clearTimeout(timeoutId.current);\n\
  \  };\n\n  // 返回上一个值（发生在上面 useEffect 的更新之前）\n  return isIdle;\n};\n```\n\n### 测试用例\n\
  输入：\n```javascript\nconst Example = () => {\n  const isIdle = useIdle(2000);\n \
  \ return (\n    <div>\n      <h1>IsIdle: {isIdle ? \"true\" : \"false\"}</h1>\n\
  \    </div>\n  );\n};\n```\n输出：\nIsIdle: false\nIsIdle: true\n// 2 秒后\n\n---\n\n\
  ## useAsync() hook\n\n`useAsync(asyncFn, immediate)` 接收一个异步函数和一个 `immediate` 标记作为输入，它将为\
  \ React 中的完整异步操作（API 调用）提供抽象，作为返回，它将提供状态、`value`、`error` 和 `refetch`。\n\n- `state`:\
  \ 它根据 `asyncFn` 的当前状态拥有 `[\"idle\", \"pending\", \"success\", \"error\"]` 四个值之一。\n\
  - `value`: 如果状态成功，则它将包含 `asyncFn` 返回的值。\n- `error`: 如果状态错误，则它将包含 `asyncFn` 返回的错误。\n\
  - `refetch()`：此函数可用于再次调用函数并重新获取数据。\n\n根据输入和输出，让我们来实现 `useAsync()` hook。我们将使用 `useState()`\
  \ 来监控状态、`value` 和 `error`，并使用 `useCallback()` 创建一个记忆化的 `refetch()` 函数。`useCallback()`\
  \ 返回的是一个记忆化的回调版本，只有当其中一个依赖项发生变化时，它才会改变。为了避免不必要的渲染，这在将回调传递给依赖于引用等效性的优化子组件时非常有帮助。\n\
  \n最后，我们将输入的输入的 `immediate` 标记传递给 `useEffect()` hook，如果 `immediate` 标记的值改变且为 true，则它将触发重新获取。\n\
  \n```javascript\nconst useAsync = (asyncFn, immediate = false) => {\n  // 四种状态选择\
  \ [\"idle\", \"pending\", \"success\", \"error\"]\n  const [state, setState] = useState({\n\
  \    status: \"idle\",\n    value: null,\n    error: null,\n  });\n\n  // 返回记忆化的函数\n\
  \  // useCallback 确保下面的 useEffect 不会在每次渲染时被调用\n  // 只有在 asyncFunction 变化时才调用\n \
  \ const refetch = useCallback(() => {\n    // 在调用前重置状态\n    setState({\n      status:\
  \ \"pending\",\n      value: null,\n      error: null,\n    });\n    return asyncFn().then((response)\
  \ => {\n      setState({\n        status: \"success\",\n        value: response,\n\
  \        error: null,\n      });\n    }).catch((error) => {\n      setState({\n\
  \        status: \"error\",\n        value: null,\n        error: error,\n     \
  \ });\n    });\n  }, [asyncFn]);\n\n  // 执行函数\n  // 如果要求立即执行\n  useEffect(() =>\
  \ {\n    if (immediate) {\n      refetch();\n    }\n  }, [refetch, immediate]);\n\
  \n  //状态值\n  const { status, value, error } = state;\n  return { refetch, status,\
  \ value, error };\n};\n```\n\n### 测试用例\n输入：\n```javascript\n// 模拟 API 调用\nconst\
  \ fakeApiCall = () => {\n  return new Promise((resolve, reject) => {\n    setTimeout(()\
  \ => {\n      const rnd = Math.random() * 10;\n      rnd <= 5 ? resolve(\"Success\"\
  ) : reject(\"Error\");\n    }, 1000);\n  });\n};\n\nconst Example = () => {\n  const\
  \ { status, value, error } = useAsync(fakeApiCall, true);\n  return (\n    <div>\n\
  \      <div>Status: {status}</div>\n      <div>Value: {value}</div>\n      <div>error:\
  \ {error}</div>\n    </div>\n  );\n};\n```\n输出：\nStatus: success\nValue: Success\n\
  \n---\n\n## useDebounce() hook\n\n防抖（Debouncing）是一种方法或方式，用于在确保在给定时间内没有重复事件被触发时执行函数。我们已经看到过如何实现普通防抖和带有立即执行标记的防抖。\n\
  \n在 React 中创建一个带有 `immediate` 标记的 `useDebounce()` hook，它将根据标记表现得像正常一样。我们将使用 `useRef()`\
  \ 来跟踪 `setTimeout` 的 `timerId`，以便在后续进行完整调用时可以重置它。此外，我们将逻辑封装在 `useCallback()` 中，以避免不必要的重新渲染，因为回调函数返回一个记忆化的函数，该函数仅在其中一个依赖项变化时才会改变。\n\
  \n```javascript\nconst useDebounce = (fn, delay, immediate = false) => {\n  // 引用计时器\n\
  \  const timerId = useRef();\n\n  // 创建一个记忆化的防抖\n  const debounce = useCallback(function()\
  \ {\n    // 为 setTimeout 上下文和参数\n    let context = this, args = arguments;\n   \
  \ // 现在应该调用函数吗？如果 immediate 为 true\n    // 且已不在超时中，那么答案是：是\n    const callNow =\
  \ immediate && !timerId.current;\n    // 基础情况\n    // 清除超时以分配新的超时。\n    clearTimeout(timerId.current);\n\
  \    // 设置新的超时\n    timerId.current = setTimeout(function() {\n      // 在超时函数内部，清除超时变量\n\
  \      // 这将在在 'immediate' 模式下允许下次执行运行\n      timerId.current = null;\n      //\
  \ 检查函数是否已带有 immediate 标记运行过\n      if (!immediate) {\n        fn.apply(context,\
  \ args);\n      }\n    }, delay);\n    if (callNow) {\n      fn.apply(context, args);\n\
  \    }\n  }, [fn, delay, immediate]);\n\n  return debounce;\n};\n```\n\n\n\n\n```javascript\n\
  // call the original function with apply\n\nfn.apply(context, args);\n\n}\n\n},\
  \ delay);\n\n// immediate mode and no wait timer? Execute\n\nthe function immediately\n\
  \nif\n\n(callNow) fn.apply(context, args);\n\n},\n\n[fn, delay, immediate]\n);\n\
  \nreturn\n\ndebounce;\n\n};\n```### 测试用例 1：不带 immediate 标记\n\n**输入：**\n```javascript\n\
  const Example = () => {\n  const print = () => {\n    console.log(\"hello\");\n\
  \  };\n  const debounced = useDebounce(print, 500);\n  useEffect(() => {\n    window.addEventListener(\"\
  mousemove\", debounced, false);\n    return () => {\n      window.removeEventListener(\"\
  mousemove\", debounced, false);\n    };\n  });\n  return <></>;\n};\n```\n\n**输出：**\n\
  `\"hello\"` // 当用户停止移动鼠标 500 毫秒后\n\n### 测试用例 2：带有 immediate 标记\n\n**输入：**\n```javascript\n\
  const Example = () => {\n  const print = () => {\n    console.log(\"hello\");\n\
  \  };\n  // immediate\n  const debounced = useDebounce(print, 500, true);\n  useEffect(()\
  \ => {\n    window.addEventListener(\"mousemove\", debounced, false);\n    return\
  \ () => {\n      window.removeEventListener(\"mousemove\", debounced, false);\n\
  \    };\n  });\n  return <></>;\n};\n```\n\n**输出：**\n`\"hello\"` // 在鼠标停止移动前立即执行一次\n\
  `\"hello\"` // 在鼠标停止移动后再次立即执行一次\n\n### useThrottle() 钩子\n\n节流（Throttling）是一种限制函数执行/调用次数的方法/技术。例如，考虑一个抽奖号码生成器，我们希望只在特定的时间间隔后获取一个数字。\n\
  \nJavaScript 应用中过度的函数调用会严重影响性能。为了优化应用程序，我们需要正确地处理这个问题。\n\n在某些场景下，我们可能会在不需要的时候调用函数。例如，考虑一个在点击按钮时向服务器调用\
  \ API 的场景。如果用户疯狂点击，这将导致每次点击触发一次 API 调用。\n\n这并不是我们想要的，我们希望限制可以进行的 API 调用次数。下一次调用只会在指定的时间间隔后发生。\n\
  \n我们已经看到过如何实现节流函数。\n\n在 React 中创建一个带有领先（leading）和尾随（trailing）标记的 `useThrottle()`\
  \ 钩子。当 `leading` 开启时，第一个函数将将立即执行，然后在指定的延迟后执行；而当 `trailing` 开启时，第一个函数将在延迟后执行，依此类推。\n\
  \n我们将使用 `useRef()` 来跟踪 `setTimeout` 的 `timerId`，以便我们可以根据需要重置它以及之前的参数。此外，我们将逻辑封装在\
  \ `useCallback()` 内部，以避免不必要的重新渲染，因为回调函数返回一个记忆化的函数，该函数只有在依赖项之一发生变化时才会改变。\n\n```javascript\n\
  const useThrottle = (fn, wait, option = { leading: true, trailing: true }) => {\n\
  \  const timerId = useRef();\n  // 跟踪定时器\n  const lastArgs = useRef();\n  // 跟踪参数\n\
  \  // 创建一个记忆化的节流\n  const throttle = useCallback(\n    function (...args) {\n  \
  \    const { trailing, leading } = option;\n      // 延迟调用的函数\n      const waitFunc\
  \ = () => {\n        // 如果开启 trailing，调用函数并重新启动定时器\n        if (trailing && lastArgs.current)\
  \ {\n          fn.apply(this, lastArgs.current);\n          lastArgs.current = null;\n\
  \          timerId.current = setTimeout(waitFunc, wait);\n        } else {\n   \
  \       // 否则重置定时器\n          timerId.current = null;\n        }\n      };\n   \
  \   // 如果开启 leading，立即执行\n      if (!timerId.current && leading) {\n        fn.apply(this,\
  \ args);\n      }\n      // 否则存储参数\n      else {\n        lastArgs.current = args;\n\
  \      }\n      // 执行延迟调用\n      if (!timerId.current) {\n        timerId.current\
  \ = setTimeout(waitFunc, wait);\n      }\n    },\n    [fn, wait, option]\n  );\n\
  \  return throttle;\n};\n```\n\n### 测试用例 1：带有 leading 标记\n\n**输入：**\n```javascript\n\
  const Example = () => {\n  const print = () => {\n    console.log(\"hello\");\n\
  \  };\n  const throttled = useThrottle(print, 2500, { leading: true, trailing: false\
  \ });\n  return <button onClick={throttled}>click me</button>;\n};\n```\n\n**输出：**\n\
  `\"hello\"` // 立即执行\n`\"hello\"` // 上一次调用 2500 毫秒后\n`\"hello\"` // 上一次调用 2500 毫秒后\n\
  \n### 测试用例 2：带有 trailing 标记\n\n**输入：**\n```javascript\nconst Example = () => {\n\
  \  const print = () => {\n    console.log(\"hello\");\n  };\n  const throttled =\
  \ useThrottle(print, 2500, { leading: false, trailing: true });\n  return <button\
  \ onClick={throttled}>click me</button>;\n};\n```\n\n**输出：**\n`\"hello\"` // 2500\
  \ 毫秒后\n`\"hello\"` // 上一次调用 2500 毫秒后\n`\"hello\"` // 上一次调用 2500 毫秒后\n\n### useResponsive()\
  \ 钩子\n\n在 React 中创建 `useResponsive()` 钩子，它将根据窗口宽度返回设备类型（`isMobile`、`isTablet`、`isDesktop`）。很多时候我们需要根据设备条件渲染组件，而不是通过\
  \ CSS 隐藏和显示，可以使用此钩子。\n\n为此，我们将为 [window](https://developer.mozilla.org/en-US/docs/Web/API/Window)\
  \ 对象分配一个事件监听器，并在 `onResizeHandler()` 函数上监听 resize 事件，每当用户调整屏幕大小时时，该函数就会更新状态。\n\n\
  分配和移除事件监听器被封装在两个函数 `Setup()` 和 `Cleanup()` 中，并在 `useEffect()` 钩子中调用，我们还调用了 `onResizeHandler()`\
  \ 来初始化值。\n\n```javascript\nconst useResponsive = () => {\n  // 屏幕分辨率\n  const [state,\
  \ setState] = useState({\n    isMobile: false,\n    isTablet: false,\n    isDesktop:\
  \ false,\n  });\n  useEffect(() => {\n    // 在初始加载时更新状态\n    onResizeHandler();\n\
  \    // 分配事件\n    Setup();\n    return () => {\n      // 移除事件\n      Cleanup();\n\
  \    };\n  }, []);\n\n  // 在窗口调整大小时更新状态\n  const onResizeHandler = () => {\n   \
  \ const isMobile = window.innerWidth <= 768;\n    const isTablet = window.innerWidth\
  \ >= 768 && window.innerWidth <= 990;\n    const isDesktop = window.innerWidth >\
  \ 990;\n    setState({ isMobile, isTablet, isDesktop });\n  };\n  // 防抖处理调用\n  const\
  \ debouncedCall = useDebounce(onResizeHandler, 500);\n  // 添加监听器\n  const Setup\
  \ = () => {\n    window.addEventListener(\"resize\", debouncedCall, false);\n  };\n\
  \  // 移除监听器\n  const Cleanup = () => {\n    window.removeEventListener(\"resize\"\
  , debouncedCall, false);\n  };\n  return state;\n};\n```\n\n`onResizeHandler()`\
  \ 函数使用了 useDebounce() 钩子进行防抖处理，因为我们不想在用户持续调整大小时产生连续的状态更新，而是要在用户调整完成后更新一次。\n\n###\
  \ 测试用例\n\n**输入：**\n```javascript\nconst Example = () => {\n  const { isMobile, isTablet,\
  \ isDesktop } = useResponsive();\n  console.log(isMobile, isTablet, isDesktop);\n\
  \  return <></>;\n};\n```\n\n**输出：**\n`false, false, true`\n\n### useWhyDidYouUpdate()\
  \ 钩子\n\n性能优化是使任何 Web 应用健壮的关键，尤其是在现在前端变得越来越复杂的。在 React 中实现这一点的一种方法是避免不必要的重新渲染，为了跟踪这一点，我们需要监控组件内部\
  \ props 或状态的变化。\n\n通过 `useWhyDidYouUpdate()` 钩子，我们可以确定触发重新渲染的变化是什么。原理很简单：我们将扩展 usePrevious()\
  \ 钩子，并将旧值与新值进行比较，查看它们是否发生了变化。\n\n```javascript\nfunction useWhyDidYouUpdate(name,\
  \ props) {\n  // 创建一个跟踪之前数据的引用\n```\n\n\n\n\n\n```javascript\nconst previousProps\
  \ = useRef();\n\nuseEffect(() => {\n  if (previousProps.current) {\n    // 合并之前的和当前数据的键\n\
  \    const keys = Object.keys({ ...previousProps.current, ...props });\n    // 存储发生的变化\n\
  \    const changesObj = {};\n    // 检查之前的和当前键之间哪些值发生了\n    keys.forEach((key) =>\
  \ {\n      // 如果两者都是对象\n      if (typeof props[key] === \"object\" && typeof previousProps.current[key]\
  \ === \"object\") {\n        if (JSON.stringify(previousProps.current[key]) !==\
  \ JSON.stringify(props[key])) {\n          // 添加到 changesObj\n          changesObj[key]\
  \ = {\n            from: previousProps.current[key],\n            to: props[key],\n\
  \          };\n        }\n      } else {\n        // 如果两者都非对象\n        if (previousProps.current[key]\
  \ !== props[key]) {\n          // 添加到 changesObj\n          changesObj[key] = {\n\
  \            from: previousProps.current[key],\n            to: props[key],\n  \
  \        };\n        }\n      }\n    });\n    // 如果 changesObj 不空，打印原因\n    if (Object.keys(changesObj).length)\
  \ {\n      console.log(\"This is causing re-renders\", name, changesObj);\n    }\n\
  \  }\n  // 用当前的更新之前的 props\n  previousProps.current = props;\n});\n```\n\n### 测试用例\n\
  Input:\n```javascript\nimport React, { useEffect, useRef, useState } from \"react\"\
  ;\n\nconst Counter = React.memo((props) => {\n  useWhyDidYouUpdate(\"Counter\",\
  \ props);\n  return (\n    <div style={props.style}>\n      {props.count}\n    </div>\n\
  \  );\n});\n\nexport default function App() {\n  const [count, setCount] = useState(0);\n\
  \  const [testCase, setTestCase] = useState(null);\n\n  const counterStyle = {\n\
  \    fontSize: \"3rem\",\n    color: \"red\",\n  };\n\n  return (\n    <div>\n \
  \     <div className=\"counter\">\n        <Counter\n          count={count}\n \
  \         style={counterStyle}\n          testCaseWithArray={testCase}\n       \
  \   function={() => console.log(count)}\n        />\n        <button onClick={()\
  \ => {\n          setCount(count + 1);\n          setTestCase([count + 1]);\n  \
  \      }}>\n          Increment\n        </button>\n      </div>\n    </div>\n \
  \ );\n}\n```\nOutput:\n```text\nThis is causing re-renders Counter\n{count: {...},\
  \ testCaseWithArray: {...}, function: {...}}\ncount:\nfrom: 0\nto: 1\nfunction:\n\
  from: () => console.log(count) // 0\nto: () => console.log(count) // 1\ntestCaseWithArray:\n\
  from: null\nto: [1]\n```\n\n## useOnScreen() hook\n跟踪组件的可见性在许多场景下都非常有用，特别是在性能优化方面，当你只想在组件进入视口或可见时才加载媒体文件（如图片、视频、音频等）。\n\
  \n另一种情况是你是你想要跟踪用户活动，例如当用户正在收藏某个产品时（此时产品在视口内），这样你可以将这些数据用于推荐。\n\n为此，我们可以创建一个 `useOnScreen()`\
  \ hook，如果组件在视口内，它将返回一个布尔值。\n\n有两种实现方式：\n1. 使用 [Intersection Observer.](https://developer.mozilla.org/en-US/docs/Web/API/Intersection_Observer_API)\n\
  2. 使用 [getBoundingClientRect().](https://developer.mozilla.org/en-US/docs/Web/API/Element/getBoundingClientRect)\n\
  \n#### 使用 Intersection Observer\n通过 `useRef()` 我们将为想要跟踪的 DOM 元素创建一个引用，然后将其传递给 `useOnScreen()`\
  \ hook。\n\n`useOnScreen()` hook 会会在组件挂载时为 `ref` 设置观察。这将在 `useEffect()` 中完成，创建一个\
  \ `IntersectionObserver` 实例，并且如果条目处于交互状态，则将状态更新为 `true`（表示可见），否则为 `false`。\n\n在组件即将卸载时，在\
  \ `useEffect()` 中断开观察。\n\n```javascript\nfunction useOnScreen(ref) {\n  const [isIntersecting,\
  \ setIntersecting] = useState(false);\n  // 监控交互\n  const observer = new IntersectionObserver(([entry])\
  \ => {\n    // 在交互变化时更新状态\n    setIntersecting(entry.isIntersecting);\n  });\n \
  \ useEffect(() => {\n    // 分配观察者\n    observer.observe(ref.current);\n    // 组件卸载时立即移除观察者\n\
  \    return () => {\n      observer.disconnect();\n    };\n  }, []);\n  return isIntersecting;\n\
  }\n```\n\n### 测试用例\n```javascript\nconst Element = ({ number }) => {\n  const ref\
  \ = useRef();\n  const isVisible = useOnScreen(ref);\n  return (\n    <div ref={ref}\
  \ className=\"box\">\n      {isVisible ? \"on screen\" : \"invisible\"}\n    </div>\n\
  \  );\n};\n\nconst DummyComponent = () => {\n  const arr = [];\n  for (let i = 0;\
  \ i < 20; i++) {\n    arr.push(<Element key={i} number={i} />);\n  }\n  return arr;\n\
  };\n```\n\n#### 使用 getBoundingClientRect()\n与 Intersection Observer 不同，在这里我们必须执行一个简单的计算，以判断元素是否在视口内。即\
  \ `top` 大于零但小于 `window.innerHeight`。\n\n```javascript\nfunction useOnScreen2(ref)\
  \ {\n  const [isIntersecting, setIntersecting] = useState(false);\n  // 确定元素是否可见\n\
  \  const observer = () => {\n    const top = ref.current.getBoundingClientRect().top;\n\
  \    setIntersecting(top >= 0 && top <= window.innerHeight);\n  };\n  useEffect(()\
  \ => {\n    // 首次检查\n    observer();\n    // 分配监听器\n    window.addEventListener(\"\
  scroll\", observer);\n    // 移除监听器\n    return () => {\n      window.removeEventListener(\"\
  scroll\", observer);\n    };\n  }, []);\n  return isIntersecting;\n}\n```\n\n###\
  \ 测试用例\n```javascript\nconst Element = ({ number }) => {\n  const ref = useRef();\n\
  \  const isVisible = useOnScreen2(ref);\n  return (\n    <div ref={ref} className=\"\
  box\">\n      {isVisible ? \"on screen\" : \"invisible\"}\n    </div>\n  );\n};\n\
  \nconst DummyComponent = () => {\n  const arr = [];\n  for (let i = 0; i < 20; i++)\
  \ {\n    arr.push(<Element key={i} number={i} />);\n  }\n  return arr;\n};\n```\n\
  \n### useScript() hook\n有些脚本我们不需要在应用初始加载时加载，而是在某些组件或地方需要。例如，Google Adsense 脚本，我们可以在应用程序就绪且显示广告的组件挂载后加载它。\n\
  \n在这些情况下，我们可以使用 `useScript()` hook 来异步注入脚本。其非常简单：将脚本源传递给 `useScript()` hook，它将检查是否已经注入了具有该源的脚本；如果存在，则返回\
  \ 'ready' 状态。否则创建一个带有该源的新脚本并将其注入到 `body` 的末尾。在该脚本标签上分配事件监听器，在成功加载时更新状态为 'ready'，出错时更新为\
  \ 'error'。\n\n```javascript\nfunction useScript(src) {\n  // 跟踪脚本状态 (\"idle\", \"\
  loading\", \"ready\", \"error\")\n  const [status, setStatus] = useState(src ? \"\
  loading\" : \"idle\");\n  useEffect(() => {\n    // 如果未提供 url，将状态设置为 idle\n    if\
  \ (!src) {\n      setStatus(\"idle\");\n      return;\n    }\n    // 获取脚本以检查其是否已经源源\n\
  \    let script = document.querySelector(`script[src=\"${src}\"]`);\n    if (script)\
  \ {\n      // 如果脚本已经加载，获取其状态并更新\n      setStatus(script.getAttribute(\"data-status\"\
  ));\n    } else {\n      // 创建脚本\n      script = document.createElement(\"script\"\
  );\n      script.src = src;\n      script.async = true;\n      script.setAttribute(\"\
  data-status\", \"loading\");\n      // 将脚本注入到 body 的末尾\n      document.body.appendChild(script);\n\
  \    }\n    script.onload = () => setStatus(\"ready\");\n    script.onerror = ()\
  \ => setStatus(\"error\");\n  }, [src]);\n  return status;\n}\n```\n\n\n\n\n\n```javascript\n\
  .body.appendChild(script);\n\n// 在自定义属性中设置脚本状态\n\nconst setAttributeFromEvent =\
  \ (event) => {\n  script.setAttribute(\n    \"data-status\",\n    event.type ===\
  \ \"load\" ? \"ready\" : \"error\"\n  );\n};\n\n// 绑定事件监听器以监控脚本是否正确加载\nscript.addEventListener(\"\
  load\", setAttributeFromEvent);\nscript.addEventListener(\"error\", setAttributeFromEvent);\n\
  \n}\n\n// 更新脚本状态的辅助函数\nconst setStateFromEvent = (event) => {\n  setStatus(event.type\
  \ === \"load\" ? \"ready\" : \"error\");\n};\n\n// 初始化\nscript.addEventListener(\"\
  load\", setStateFromEvent);\nscript.addEventListener(\"error\", setStateFromEvent);\n\
  // 清理\nreturn () => {\n  if (script) {\n    script.removeEventListener(\"load\"\
  , setStateFromEvent);\n    script.removeEventListener(\"error\", setStateFromEvent);\n\
  \  }\n};\n}, [src]);\n\nreturn status;\n}\n```\n\n© JavaScript Interview Guide |\
