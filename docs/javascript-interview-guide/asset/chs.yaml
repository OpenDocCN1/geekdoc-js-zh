  \ }\n      // 继续进入 Trie 的下一深度。\n      node = node.children[word[i]];\n      // 最后，检查是否是单词的最后一个。\n\
  \      if (i == word.length - 1) {\n        // 如果是，将结束标记设置为 true。\n        node.end\
  \ = true;\n      }\n    }\n  };\n  // 检查是否包含一个完整的单词。\n  this.contains = function(word)\
  \ {\n    let node = this.root;\n    // 遍历单词中的每一个字符\n    for (let i = 0; i < word.length;\
  \ i++) {\n      // 检查 children 中是否存在字符节点。\n      if (node.children[word[i]]) {\n\
  \        // 如果存在，继续进入 Trie 的下一深度。\n        node = node.children[word[i]];\n    \
  \  } else {\n        // 不存在，返回 false，因为它不是一个有效的单词。\n        return false;\n    \
  \  }\n    }\n    // 我们已经遍历完了所有的字符，但它是一个完整的单词吗？\n    return node.end;\n  };\n  //\
  \ 返回所有带有给定前缀的单词\n  this.find = function(prefix) {\n    let node = this.root;\n \
  \   let output = [];\n    // 遍历前缀中的每一个字符\n    for (let i = 0; i < prefix.length;\
