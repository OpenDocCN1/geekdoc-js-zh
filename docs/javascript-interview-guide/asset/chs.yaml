  \ 在 JavaScript 中创建分析 SDK\n\n## 题目描述\n\n实现一个暴露日志事件的分析 SDK，它接收事件并将其进行队，然后开始发送这些事件。\n\
  \n\n\n\n\n- 在延迟 1 秒后发送每个事件，并且此日志每 `n % 5` 次失败一次。\n- 仅在上一个事件解析（resolve）后发送下一个事件。\n\
  - 当发生失败时，尝试重试。\n\n## Example\n\n### 输入:\n```javascript\nconst sdk = new SDK();\n\
  sdk.logEvent(\"event 1\");\nsdk.logEvent(\"event 2\");\nsdk.logEvent(\"event 3\"\
  );\nsdk.logEvent(\"event 4\");\nsdk.logEvent(\"event 5\");\nsdk.logEvent(\"event\
  \ 6\");\nsdk.logEvent(\"event 7\");\nsdk.logEvent(\"event 8\");\nsdk.logEvent(\"\
  event 9\");\nsdk.logEvent(\"event 10\");\nsdk.send();\n```\n\n### 输出:\n```\n\"Analytics\
  \ sent event 1\"\n\"Analytics sent event 2\"\n\"Analytics sent event 3\"\n\"Analytics\
  \ sent event 4\"\n\"-----------------------\"\n\"Failed to send event 5\"\n\"Retrying\
  \ sending event 5\"\n\"-----------------------\"\n\"Analytics sent event 5\"\n\"\
  Analytics sent event 6\"\n\"Analytics sent event 7\"\n\"Analytics sent event 8\"\
  \n\"-----------------------\"\n\"Failed to send event 9\"\n\"Retrying sending event\
  \ 9\"\n\"-----------------------\"\n\"Analytics sent event 9\"\n\"Analytics sent\
  \ event 10\"\n```\n\n# 将问题陈述分解为子问题\n我们可以分三个步骤创建这个 `SDK`。\n\n### 延迟函数\n该函数最重要的部分是事件将在延迟\
  \ 1 秒后发送，并失败 `n%5` 次。我们可以通过扩展 `sleep` 函数来实现相同的操作。创建一个新的 `Promise`，并在其内部运行一个 `setTimeout`，它将在延迟后解析该\
  \ promise。同样地，添加一个额外的条件来检查当前执行次数是否为 `n%5`，如果是则拒绝（reject），否则解析（resolve）。\n\n```javascript\n\
  // 延迟执行的函数\nwait = () => new Promise((resolve, reject) => {\n  setTimeout(() =>\
  \ {\n    // 每 n % 5 次拒绝\n    if (this.count % 5 === 0) {\n      reject();\n    }\
  \ else {\n      resolve();\n    }\n  }, 1000);\n});\n```\n\n### 队列事件\n我们需要存储事件以便逐个发送。我们还需要一个跟踪器，以便在每次第\
  \ `n%5` 次调用时进行拒绝。我们可以创建一个 `class` 并在 `constructor` 中初始化这些内容。\n\n```javascript\n\
  class SDK {\n  constructor() {\n    // 存放事件\n    this.queue = [];\n    // 跟踪计数\n\
  \    this.count = 1;\n  }\n  // 将事件推入队列\n  logEvent(ev) {\n    this.queue.push(ev);\n\
  \  }\n}\n```\n\n### 发送事件\n最后部分是发送事件，为此，我们可以创建一个辅助函数，它将递归地调用自己并每次继续发送一个事件。这是一个 `async`\
  \ 函数，在每次调用中，从队列中获取第一个元素并尝试 `wait()`，如果它解析，则打印日志或执行任何其他操作；如果失败，则将事件推回队列进行重试。最后，递归地调用相同函数进行下次操作。如果队列中没有更多事件，则添加一个基础情况来停止执行。同时，在每次调用中跟踪计数。\n\
  \n```javascript\n// 发送分析\n// 递归发送事件\nsendAnalytics = async function() {\n  // 如果队列中没有事件\n\
  \  // 停止执行\n  if (this.queue.length === 0) {\n    return;\n  }\n  // 从队列中获取第一个元素\n\
  \  const current = this.queue.shift();\n  try {\n    // 延迟\n    await this.wait();\n\
  \    // 打印事件\n    // 也可以执行任何其他操作\n    // 如调用 api\n    console.log(\"Analytics sent\
  \ \" + current);\n    // 增加计数\n    this.count++;\n  } catch (e) {\n    // 如果执行失败\n\
  \    console.log(\"-----------------------\");\n    console.log(\"Failed to send\
  \ \" + current);\n    console.log(\"Retrying sending \" + current);\n    console.log(\"\
  -----------------------\");\n    // 重置计数\n    this.count = 1;\n    // 将事件推回队列\n\
  \    this.queue.unshift(current);\n  } finally {\n    // 递归调用相同函数\n    // 发送剩余事件\n\
  \    this.sendAnalytics();\n  }\n}\n\n// 开始执行\nsend = async function() {\n  this.sendAnalytics();\n\
  }\n```\n\n# 整合一切\n```javascript\nclass SDK {\n  constructor() {\n    // 存放事件\n \
  \   this.queue = [];\n    // 跟踪计数\n    this.count = 1;\n  }\n  // 将事件推入队列\n  logEvent(ev)\
  \ {\n    this.queue.push(ev);\n  }\n  // 延迟执行的函数\n  wait = () => new Promise((resolve,\
  \ reject) => {\n    setTimeout(() => {\n      // 每 n % 5 次拒绝\n      if (this.count\
  \ % 5 === 0) {\n        reject();\n      } else {\n        resolve();\n      }\n\
  \    }, 1000);\n  });\n  // 发送分析\n  // 递归发送事件\n  sendAnalytics = async function()\
  \ {\n    // 如果队列中没有事件\n    // 停止执行\n    if (this.queue.length === 0) {\n      return;\n\
  \    }\n    // 从队列中获取第一个元素\n    const current = this.queue.shift();\n    try {\n\
  \      // 延迟\n      await this.wait();\n      // 打印事件\n      // 也可以执行任何其他操作\n  \
  \    // 如调用 api\n      console.log(\"Analytics sent \" + current);\n      // 增加计数\n\
  \      this.count++;\n    } catch (e) {\n      // 如果执行失败\n      console.log(\"-----------------------\"\
  );\n      console.log(\"Failed to send \" + current);\n      console.log(\"Retrying\
  \ sending \" + current);\n      console.log(\"-----------------------\");\n    \
  \  // 重置计数\n      this.count = 1;\n      // 将事件推回队列\n      this.queue.unshift(current);\n\
  \    } finally {\n      // 递归调用相同函数\n      // 发送剩余事件\n      this.sendAnalytics();\n\
  \    }\n  };\n  // 开始执行\n  send = async function() {\n    this.sendAnalytics();\n\
  \  }\n}\n```\n\n### 测试用例\n### 输入:\n```javascript\nconst sdk = new SDK();\nsdk.logEvent(\"\
  event 1\");\nsdk.logEvent(\"event 2\");\nsdk.logEvent(\"event 3\");\nsdk.logEvent(\"\
  event 4\");\nsdk.logEvent(\"event 5\");\nsdk.logEvent(\"event 6\");\nsdk.logEvent(\"\
  event 7\");\nsdk.logEvent(\"event 8\");\nsdk.logEvent(\"event 9\");\nsdk.logEvent(\"\
  event 10\");\nsdk.send();\n```\n\n### 输出:\n```\n\"Analytics sent event 1\"\n\"Analytics\
  \ sent event 2\"\n\"Analytics sent event 3\"\n\"Analytics sent event 4\"\n\"-----------------------\"\
  \n\"Failed to send event 5\"\n\"Retrying sending event 5\"\n\"-----------------------\"\
  \n\"Analytics sent event 5\"\n\"Analytics sent event 6\"\n\"Analytics sent event\
  \ 7\"\n\"Analytics sent event 8\"\n\"-----------------------\"\n\"Failed to send\
  \ event 9\"\n\"Retrying sending event 9\"\n\"-----------------------\"\n\"Analytics\
  \ sent event 9\"\n\"Analytics sent event 10\"\n```\n\n## 检查定的二叉树是否为完全二叉树\n### 问题陈述\n\
  给定一个二叉树，检查它是否为完全二叉树。\n完全二叉树定义为所有节点均具有零个或两个两个子节点的二叉树。或者我们可以说，完全二叉树中不存在只有一个子节点的节点。\n\
  \n## 示例\n输入:\n```\n1\n/ \\\n2\n3\n/ \\\n4\n5\n```\n输出: 是\n\n输入:\n```\n1\n/ \\\n\
  2\n3\n/\n4\n```\n输出: 否\n\n### 递归方法\n- 创建一个递归调用自己的函数，用以检查每个节点是否具有 0 或 2 个子节点。\n\n\
  \n\n\n\n- 如果给定的节点为空，则它是一个满二叉树。\n- 如果给定的节点没有子节点，那么它也是满的。\n- 如果它既有左孩子又有右孩子，那么它就是满的。\n\
  - 否则，它不是满二叉树。\n\n© JavaScript 面试指南 | learnersbucket.com | 360\n\n### 递归方法\n\n```javascript\n\
  const isFullTreeRecursive = (root) => {\n  // 如果树为空\n  if (root == null) {\n   \
  \ return true;\n  }\n  // 如果是叶子节点\n  if (root.left === null && root.right === null)\
  \ {\n    return true;\n  }\n  // 如果左右子树都不为空\n  // 它们是满的\n  if ((root.left !== null)\
  \ && (root.right !== null)) {\n    return (isFullTreeRecursive(root.left) && isFullTreeRecursive(root.right));\n\
  \  }\n  // 如果以上都不满足\n  return false;\n}\n```\n\n### 测试用例\n输入:\n```javascript\nfunction\
  \ Node(val) {\n  this.val = val;\n  this.left = null;\n  this.right = null;\n}\n\
  let tree = new Node(10);\ntree.left = new Node(20);\ntree.right = new Node(30);\n\
  tree.left.right = new Node(40);\nconsole.log(isFullTreeRecursive(tree));\n```\n\
  输出: `false`\n\n© JavaScript 面试指南 | learnersbucket.com | 361\n\n### 迭代方法\n\n我们可以使用\
  \ `queue`（队列）通过迭代来实现上述递归解决方案。\n- 将根节点加入队列。\n- 只要队列不为空就继续迭代。\n- 在每次迭代中，从队列获取第一个值，并检查它是否有\
  \ 0 个或 2 个子节点，如果是则继续；否则返回 false。\n- 将这些子节点重新加入队列以检查它们的子节点，以此此类推。\n\n```javascript\n\
  const isFullTreeIterative = (root) => {\n  if (root === null) {\n    return true;\n\
  \  }\n  const q = [];\n  //初始将根节点加入队列\n  q.unshift(root);\n// 遍历二叉树的所有节点\n  // 逐层遍历直到队列为空\n\
  \  while (q.length) {\n    const node = q.pop();\n    // 如果是叶子节点则继续\n    if (node.left\
  \ === null && node.right === null) {\n      continue;\n    }\n    // 如果其中一个子节点为空而另一个不为空\n\
  \    // 则二叉树不是\n    // 满二叉树\n    if (node.left === null || node.right === null)\
  \ {\n      return false;\n    }\n    // 将 'node' 的左右子节点\n    // 放入队列 'q' 中\n   \
  \ q.unshift(node.left);\n    q.unshift(node.right);\n  }\n  // 二叉树是满二叉树\n  return\
  \ true;\n}\n```\n\n### 测试用例\n输入:\n```javascript\nfunction Node(val) {\n  this.val\
  \ = val;\n  this.left = null;\n  this.right = null;\n}\nlet tree = new Node(10);\n\
  tree.left = new Node(20);\ntree.right = new Node(30);\ntree.left.right = new Node(40);\n\
  tree.left.left = new Node(50);\nconsole.log(isFullTreeIterative(tree));\n```\n输出:\
  \ `true`\n\n© JavaScript 面试指南 | learnersbucket.com | 363\n\n# 查找二叉树的高度和宽度\n\n##\
  \ 题目描述 -\n给定一个二叉树，编写两个程序来分别查找它的每个高度和宽度。\n\n## 示例\n输入:\n```\n    1\n   / \\\n  2\
  \   3\n / \\ / \\\n4  5 6  7\n```\n输出:\n`Height = 3`, `Width = 4`\n\n### 二叉树的高度\n\
  二叉树的高度是树的最大深度。为了找到树的深度，我们需要执行以下操作。我们将递归地找到左子树和右子树的深度。然后获取这两个深度的最大值并返回。\n\n```javascript\n\
  const btHeight = (node) => {\n  // 如果为空返回 0\n  if (node === null) {\n    return\
  \ 0;\n  }\n  // 获取左子树高度\n  const leftHeight = btHeight(node.left);\n  // 获取右子树高度\n\
  \  const rightHeight = btHeight(node.right);\n  // 返回它们中的最大值\n  return leftHeight\
  \ > rightHeight ? leftHeight + 1 : rightHeight + 1;\n}\n```\n\n### 测试用例\n输入:\n```javascript\n\
  function Node(val) {\n  this.val = val;\n  this.left = null;\n  this.right = null;\n\
  }\nlet tree = new Node(10);\ntree.left = new Node(20);\ntree.right = new Node(30);\n\
  tree.left.right = new Node(40);\ntree.left.left = new Node(50);\ntree.right.right\
  \ = new Node(70);\ntree.right.left = new Node(60);\nconsole.log(btHeight(tree));\n\
  ```\n输出: `3`\n\n### 二叉树的宽度\n二叉树的宽度是给定层上存在的节点数量。我们将首先找到树的高度，然后通过递归查找查找宽度。\n\n```javascript\n\
  const helper = (node, level) => {\n  // 如果为空返回 0\n  if (node === null) {\n    return\
  \ 0;\n  }\n  // 如果是目标层，返回 1\n  if (level === 0) {\n    return 1;\n  }\n  // 递归查找左右子树的下一层\n\
  \  return helper(node.left, level - 1) + helper(node.right, level - 1);\n};\n\n\
  const btWidth = (root) => {\n  let maxWidth = 0;\n  let height = btHeight(root);\n\
  \  // 遍历每一层\n  for (let i = 0; i < height; i++) {\n    // 计算当前层的宽度\n    let width\
  \ = helper(root, i);\n    if (width > maxWidth) {\n      maxWidth = width;\n   \
  \ }\n  }\n  return maxWidth;\n};\n```\n\n### 测试用例\n输入:\n```javascript\nfunction\
  \ Node(val) {\n  this.val = val;\n  this.left = null;\n  this.right = null;\n}\n\
  let tree = new Node(10);\ntree.left = new Node(20);\ntree.right = new Node(30);\n\
  tree.left.right = new Node(40);\ntree.left.left = new Node(50);\ntree.right.right\
  \ = new Node(70);\ntree.right.left = new Node(60);\nconsole.log(btWidth(tree));\n\
  ```\n输出: `4`\n\n\n\n\n\n```javascript\n'static'\n\n};\n\n// 子类\nfunction Student()\
  \ {\n  this.name = \"pqr\";\n}\n\n// sayHello\n// 这在扩展后将替换父类方法\nStudent.prototype.sayHello\
  \ = function() {\n  console.log('hi, I am a student');\n}\n\n// 添加 sayGoodBye 方法\n\
  Student.prototype.sayGoodBye = function() {\n  console.log('goodBye');\n}\n\nconst\
  \ Extend = myExtends(Person, Student);\nconst student1 = new Student();\nstudent1.sayHello();\n\
  student1.walk();\nstudent1.sayGoodBye();\nStudent.staticSuper();\nconsole.log(student1.name);\n\
  \n// 检查继承\nconsole.log(student1 instanceof Person);\nconsole.log(student1 instanceof\
  \ Student);\n```\n\n输出:\n```\n\"hi, I am a student\"\n\"pqr, I am walking!\"\n\"\
  goodBye\"\n\"static\"\n\"pqr\"\ntrue\ntrue\n```\n\n# 顺序动画元素\n\n## 问题描述\n- 实现一个在\
  \ 3 秒内从 0% 动画到 100% 的进度条。\n- 点击按钮时启动进度条动画。\n- 如果多次点击按钮，则对进度条进行排序。当进度条 `N-1` 完成动画后，进度条\
  \ `N` 开始动画。\n- 扩展：在 `N-1` 条完成一半（50%）后开始加载 `N` 条。\n\n让我们开始吧，我们可以逐个解决子问题。\n\n## 带有动画的进度条\n\
  通过 JavaScript 动态创建一个 div。\n\n```javascript\nconst loadingBar = document.createElement(\"\
  div\");\n```\n\n为该元素应用动态动画关键帧。\n\n```javascript\nlet styleSheet = null;\nconst dynamicAnimation\
  \ = (name, styles) => {\n  //创建一个样式表\n  if (!styleSheet) {\n    styleSheet = document.createElement(\"\
  style\");\n    styleSheet.type = \"text/css\";\n    document.head.appendChild(styleSheet);\n\
  \  }\n  // 插入新的关键帧\n  styleSheet.sheet.insertRule(`@keyframes ${name} {${styles}}`,\
  \ styleSheet.length);\n};\n```\n\n使用此函数我们可以动态添加动画的关键帧，然后将这些动画应用到任何元素。\n\n```javascript\n\
  dynamicAnimation(\"loadingBar\", `0%{width: 0%;} 100%{width: 100%;}` );\nloadingBar.style.height\
  \ = \"10px\";\nloadingBar.style.backgroundColor = \"Red\";\nloadingBar.style.width\
  \ = \"0\";\nloadingBar.style.animation = \"loadingBar 3s forwards\";\n```\n\n我们已经完成了进度条的创建，只需要将其添加到\
  \ DOM 中即可动画，我们将获取一个元素并将其追加其中。\n\n```javascript\nconst entry = document.getElementById(\"\
  entry\");\nentry.appendChild(loadingBar);\n```\n\n将所有内容封装在一个函数中并调用它来生成进度条。你还可以将持续时间（动画运行多久）以及关键帧本身传递给此函数。\n\
  \n```javascript\nconst generateLoadingBar = () => {\n  //创建一个 div\n  const loadingBar\
  \ = document.createElement(\"div\");\n  //应用样式\n  dynamicAnimation(\"loadingBar\"\
  , `0%{width: 0%;} 100%{width: 100%;}` );\n  loadingBar.style.height = \"10px\";\n\
  \  loadingBar.style.backgroundColor = \"Red\";\n  loadingBar.style.width = \"0\"\
  ;\n  loadingBar.style.marginBottom = \"10px\";\n  loadingBar.style.animation = \"\
  loadingBar 3s forwards\";\n  //追加 div\n  const entry = document.getElementById(\"\
  entry\");\n  entry.appendChild(loadingBar);\n};\n```\n\n## 点击按钮时启动进度条动画\n创建一个按钮，并在其点击时调用上面的函数，这样它就会生成进度条，并在添加到\
  \ DOM 后开始动画。\n\n```javascript\n// 按钮被点击时，生成进度条\ndocument.getElementById(\"btn\"\
  ).addEventListener(\"click\", (e) => {\n  generateLoadingBar();\n});\n```\n\n##\
  \ 多次点击按钮时对进度条进行排序\n该问题的最后一部分是在多次点击按钮时对进度条进行排序，并让它们一个接一个顺序执行动画。\n\n创建一个全局变量 `count`，每次点击按钮时将其值加\
  \ 1，反之，当进度条执行动画时将其值减 1。\n\n```javascript\n// 用于跟踪进度条数量的全局变量\nlet count = 0;\n//\
  \ 更新计数的函数\nconst updateCount = (val) => {\n  count += val;\n  document.getElementById(\"\
  queueCount\").innerText = count;\n};\n```\n\n为了从队列中生成下一个进度条，我们需要在上一个进度条动画完成后递归地调用同一个函数（即生成进度条的函数）。坦率地说，我们有一个相应的事件：`animationend`，它会在元素上的动画结束时触发一次，这也是我选择\
  \ CSS 动画而不是 JavaScript 计时器来制作动画的原因。\n\n当 `animationend` 触发时，递归调用相同函数来生成进度条并更新队列计数。\n\
  \n```javascript\n// 动画结束时\nloadingBar.addEventListener(\"animationend\", () => {\n\
  \  // 减少计数\n  updateCount(-1);\n  if (count > 0) {\n    // 生成进度条\n    generateLoadingBar();\n\
  \  }\n});\n```\n\n我们还需要更新按钮点击时的代码，只有当计数为零时才调用 `generateLoadingBar` 函数，因为所有其他后续调用将通过递归触发。此外，每次点击时更新计数。\n\
  \n```javascript\n// 按钮被点击时，生成进度条\ndocument.getElementById(\"btn\").addEventListener(\"\
  click\", (e) => {\n  // 触发动画\n  if (count === 0) {\n    generateLoadingBar();\n\
  \  }\n  // 更新计数\n  updateCount(1);\n});\n```\n\n## 整合在一起\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0\" />\n  <title>顺序动画元素</title>\n\
  </head>\n<body>\n  <div id=\"entry\"></div>\n  <p><span>队列中：</span><span id=\"queueCount\"\
  >0</p></p>\n  <button id=\"btn\">添加动画</button>\n  <script>\n    // 动态添加关键帧的函数\n\
  \    let styleSheet = null;\n    const dynamicAnimation = (name, styles) => {\n\
  \      // 创建样式表\n      if (!styleSheet) {\n        styleSheet = document.createElement(\"\
  style\");\n        styleSheet.type = \"text/css\";\n        document.head.appendChild(styleSheet);\n\
  \      }\n      // 插入新的关键帧\n      styleSheet.sheet.insertRule(`@keyframes ${name}\
  \ {${styles}}`, styleSheet.length);\n    };\n    // 用于跟踪进度条数量的全局变量\n    let count\
  \ = 0;\n    // 更新计数的函数\n    const updateCount = (val) => {\n      count += val;\n\
  \      document.getElementById(\"queueCount\").innerText = count;\n    };\n    //\
  \ 生成进度条\n    const generateLoadingBar = () => {\n      // 创建 div 元素\n      const\
  \ loadingBar = document.createElement(\"div\");\n      // 应用样式\n      // 动画关键帧\n\
  \      dynamicAnimation(\"loadingBar\", `0%{width: 0%;} 100%{width: 100%;}` );\n\
  \      loadingBar.style.height = \"10px\";\n      loadingBar.style.backgroundColor\
  \ = \"Red\";\n      loadingBar.style.width = \"0\";\n      loadingBar.style.marginBottom\
  \ = \"10px\";\n      loadingBar.style.animation = \"loadingBar 3s forwards\";\n\
  \      // 追加进度条\n      const entry = document.getElementById(\"entry\");\n     \
  \ entry.appendChild(loadingBar);\n      // 动画结束时\n      loadingBar.addEventListener(\"\
  animationend\", () => {\n        // 减少计数\n        updateCount(-1);\n        if (count\
  \ > 0) {\n          // 生成进度条\n          generateLoadingBar();\n        }\n     \
  \ });\n      // 移除监听器\n      loadingBar.removeEventListener(\"animationend\", ()\
  \ => {});\n    };\n    // 按钮被点击时，生成进度条\n    document.getElementById(\"btn\").addEventListener(\"\
  click\", (e) => {\n      // 触发动画\n      if (count === 0) {\n        generateLoadingBar();\n\
  \      }\n      // 更新计数\n      updateCount(1);\n    });\n  </script>\n</body>\n\
  </html>\n```\n\n\n\n\n在后续步骤中，我们必须在 `N-1th` 个进度条完成一半时，开始启动 `Nth` 个进度条的动画。\n\n遗憾的是，与动画相关的事件只有四个。\n\
  \n© JavaScript Interview Guide | learnersbucket.com\n378\n\n● `animationstart` :-\
  \ 动画开始时。\n● `animationend` :- 动画结束时。\n● `animationcancel` :- 动画意外中止且未触发 `animationend`\
  \ 事件。\n● `animationiteration` :- 动画的一次迭代结束且下一次迭代开始时。此事件不会与 `animationend` 事件同时触发。\n\
  \n没有办法可以确定动画已经完成了多少。\n\n为了解决这个问题，我们使用了一种黑科技（hack），一种变通方案：我们同时对两个元素进行动画，其中一个按正常持续时间运行，另一个则在必须触发下一个动画的持续时间内运行。\n\
  \n例如，当第一个加载条完成 `50%` 时，应该触发下一个动画。因此，假设我们的原始加载条将在 `3 seconds` 内完成 `100%` 的动画，这意味着当它在\
  \ `1.5 seconds`（一半时间）完成 `50%` 时，应该触发下一个动画。我们将在此持续时间内并行地动画另一个元素，并在它的 `animationend`\
  \ 时触发下一次渲染。\n\n```javascript\n//generate loading bars\nconst generateLoadingBar\
  \ = () => {\n  //fragment\n  const fragment = document.createDocumentFragment();\n\
  \  //create a div elm\n  const loadingBar = document.createElement(\"div\");\n \
  \ //apply styles\n  //animation keyframes\n  dynamicAnimation(\"loadingBar\", `\n\
  0%{\nwidth: 0%;\n}\n100%{\nwidth: 100%;\n}\n`);\n  loadingBar.style.height = \"\
  10px\";\n  loadingBar.style.backgroundColor = \"Red\";\n  loadingBar.style.width\
  \ = \"0\";\n  loadingBar.style.marginBottom = \"10px\";\n  loadingBar.style.animation\
  \ = \"loadingBar 3s forwards\";\n  //create shadow loading bar\n  const shadowLoadingBar\
  \ = document.createElement(\"div\");\n  //apply styles\n  //animation keyframes\n\
  \  dynamicAnimation(\"shadowLoadingBar\", `\n0%{\nwidth: 0%;\n}\n100%{\nwidth: 50%;\n\
  }\n`);\n  //it will be hidden\n  shadowLoadingBar.style.height = \"5px\";\n  shadowLoadingBar.style.backgroundColor\
  \ = \"green\";\n  shadowLoadingBar.style.width = \"0\";\n  shadowLoadingBar.style.marginBottom\
  \ = \"10px\";\n  shadowLoadingBar.style.animation = \"shadowLoadingBar 1.5s forwards\"\
  ;\n  //add the both the bars to the fragment\n  fragment.appendChild(loadingBar);\n\
  \  fragment.appendChild(shadowLoadingBar);\n  //append the loading bar\n  const\
  \ entry = document.getElementById(\"entry\");\n  entry.appendChild(fragment);\n\
  \  //on animation end on shadow bar\n  shadowLoadingBar.addEventListener(\"animationend\"\
  , () => {\n    //decrease the count\n    updateCount(-1);\n    if (count > 0) {\n\
  \      //generate the loading bar\n      generateLoadingBar();\n    }\n  });\n \
  \ //remove listener\n  shadowLoadingBar.removeEventListener(\"animationend\", ()\
  \ => {});\n};\n```\n\n你会发现，我们创建了两个加载条并将它们添加到文档碎片（fragments）中，并且硬编码了影子加载条的持续时间 `1.5`\
  \ 和宽度为 `50%`。你可以通过简单的数学计算使其变为动态。此外，我们保持了影子加载条的背景为绿色，它目前是可见的（仅为了演示效果），但你可以隐藏它。其他部分保持不变。\n\
  \n© JavaScript Interview Guide | learnersbucket.com\n379\n380\n![](img/index-381_1.png)\n\
  \n### 带有过期时间的 Localstorage\n\n## 问题描述\n扩展本地存储以接受过期时间，并在该时间之后使条目过期。\n\n## 示例\n```javascript\n\
  // 在 'foo' 上设置 'bar'，它将在 1000 毫秒后过期\nmyLocalStorage.setItem('foo', 'bar', 1000);\n\
  // 2 秒后\nconsole.log(myLocalStorage.getItem('foo'));\n// null\n```\n\n实现这一点，我们将重写现有的本地存储方法。在添加条目时，我们将接受毫秒级的过期日期（默认为\
  \ 30 天）。将过期日期设置为当前日期加上值，并与值一起存储在原始的本地存储中。\n\n```javascript\n// 添加一个条目\n// 默认过期时间为\
  \ 30 天毫秒\nsetItem(key, value, maxAge = 30 * 60 * 60 * 1000) {\n  // 将值存储为对象\n  //\
  \ 包含过期日期\n  let result = {\n    data : value\n  }\n  if (maxAge) {\n    // 设置过期时间\n\
  \    // 从当前日期开始\n    result.expireTime = Date.now() + maxAge;\n  }\n  // 将结果序列化\n\
  \  // 并存储在原始存储中\n  window.localStorage.setItem(key, JSON.stringify(result));\n}\n\
  ```\n\n同样，在获取条目时，检查键是否有关联的值，如果存在且未过期，则返回该值，否则返回 null。\n\n```javascript\ngetItem(key)\
  \ {\n  // 获取解析后的值\n  let result = JSON.parse(window.localStorage.getItem(key));\n\
  \  // 如果 key 有值\n  if (result) {\n    // 如果条目过期\n    // 移除条目并返回 null\n    if (result.expireTime\
  \ <= Date.now()) {\n      window.localStorage.removeItem(key);\n      return null;\n\
  \    }\n    // 否则返回值\n    return result.data;\n  }\n  // 如果 key 没有值\n  return null;\n\
  }\n```\n\n© JavaScript Interview Guide | learnersbucket.com\n381\n382\n383\n384\n\
  \n### 测试用例\n输入：\n```javascript\nmyLocalStorage.setItem('foo', 'bar', 1000);\n```\n\
  输出：\n```javascript\nnull\n```\n\n\n\n\n在获取 cookie 时，获取 map 中的所有条目并检查每个条目是否已过期。如果过期，则删除该条目。将剩余的条目作为冒号分隔的字符串发送。\n\
  \n为了解析输入并分离数据和选项，我们将使用一个辅助函数。\n\n```javascript\n// 用于解析\n// 键值对的辅助函数\nfunction parseCookieString(str)\
  \ {\n  // 按 ; 分割字符串\n  // 分离数据和选项\n  const [nameValue, ...rest] = str.split(';');\n\
  \  // 获取从数据中分离的键值\n  const [key, value] = separateKeyValue(nameValue);\n  // 解析所有选项并存储\n\
  \  // 形如 max-age\n  const options = {};\n  for (const option of rest) {\n    const\
  \ [key, value] = separateKeyValue(option);\n    options[key] = value;\n  }\n  return\
  \ {\n    key,\n    value,\n    options,\n  };\n}\n\n// 用于分离\n// 键和值的辅助函数\nfunction\
  \ separateKeyValue(str) {\n  return str.split('=').map(s => s.trim());\n}\n```\n\
  \n对于主逻辑，我们可以使用 `Object.defineProperty()` 扩展 document 对象。\n\n```javascript\n// 启用\
  \ myCookie\nfunction useCustomCookie() {\n  // 存储每个 cookie\n  // 的键值\n  const store\
  \ = new Map();\n  Object.defineProperty(document, 'myCookie', {\n    configurable:\
  \ true,\n    get() {\n      const cookies = [];\n      const time = Date.now();\n\
  \      // 从 store 中获取所有条目\n      for (const [name, { value, expires }] of store)\
  \ {\n        // 如果条目过期\n        // 将其从 store 中删除\n        if (expires <= time) {\n\
  \          store.delete(name);\n        }\n        // 否则将键值对推入 cookies\n       \
  \ else {\n          cookies.push(`${name}=${value}`);\n        }\n      }\n    \
  \  // 将所有键值对作为字符串返回\n      return cookies.join('; ');\n    },\n    set(val) {\n\
  \      // 从字符串中获取数据\n      // 和选项的键值\n      const { key, value, options } = parseCookieString(val);\n\
  \      // 如果选项有 max-age\n      // 设置过期日期\n      let expires = Infinity;\n      if\
  \ (options[\"max-age\"]) {\n        expires = Date.now() + Number(options[\"max-age\"\
  ]) * 1000;\n      }\n      // 将条目添加到 store 中\n      store.set(key, { value, expires\
  \ });\n    }\n  });\n}\n```\n\n### 测试用例\n输入：\n```javascript\nuseCustomCookie();\n\
  document.myCookie = \"blog=learnersbucket\";\n// 这将在 1 秒后过期\ndocument.myCookie =\
  \ \"name=prashant;max-age=1\";\nconsole.log(document.myCookie);\nsetTimeout(() =>\
  \ {\n  console.log(document.myCookie);\n}, 1500);\n```\n输出：\n```\n\"blog=learnersbucket;\
  \ name=prashant\"\n\"blog=learnersbucket\"\n```\n\n---\n\n# 创建一个不可变性辅助函数 - 部分 1\n\
  \n## 问题描述\n实现一个简单的不可变性辅助函数，允许一组特定操作更新冻结的输入对象。输入对象只能通过此函数更新，且返回的值也是冻结的。\n注意 - 为了简单起见，一次只允许一种操作。\n\
  \n## 动作\n\n### `_push_`: 数组 – 将目标数组推入输入数组中。\n```javascript\nconst inputArr = [1,\
  \ 2, 3, 4];\nconst outputArr = update(inputArr, {_push_: [5, 6, 7]});\nconsole.log(outputArr);\n\
  // [1,2,3,4,5,6,7]\n```\n\n### `_replace_`: 对象 |数组 – 替换输入对象中的目标值。\n```javascript\n\
  const state = {\n  a: {\n    b: {\n      c: 1\n    }\n  },\n  d: 2\n};\nconst newState\
  \ = update(state, {a: {b: {c: {_replace_: 3}}}}});\nconsole.log(newState);\n/*\n\
  {\n  \"a\": {\n    \"b\": {\n      \"c\": 3\n    }\n  },\n  \"d\": 2\n}\n*/\n```\n\
  ```javascript\nconst inputArr = [1, 2, 3, 4];\nconst outputArr = update(inputArr,\
  \ {1: {_replace_: 10}}});\nconsole.log(outputArr);\n// [1,10,3,4]\n```\n\n### `_merge_`:\
  \ 对象 – 合并输入对象中的目标值。\n```javascript\nconst state = {\n  a: {\n    b: {\n      c:\
  \ 1\n    }\n  },\n  d: 2\n};\nconst newState = update(state, {a: {b: {_merge_: {e:\
  \ 5}}}});\nconsole.log(newState);\n/*\n{\n  \"a\": {\n    \"b\": {\n      \"c\"\
  : 1,\n      \"e\": 5\n    }\n  },\n  \"d\": 2\n}\n*/\n```\n\n### `_transform_`:\
  \ 对象 |数组 – 通过将目标值传递此函数来转换目标值。\n```javascript\nconst inputArr = {a: {b: 2}};\nconst\
  \ outputArr = update(inputArr, {a: {b: {_transform_: (item) => item * 2}}});\nconsole.log(outputArr);\n\
  /*\n{\n  \"a\": {\n    \"b\": 4\n  }\n}\n*/\n```\n\n我们可以创建一个接受两个参数（`data`, `action`）的辅助函数，`action`\
  \ 始终是一个 `Object`。我们可以递归地遍历对象，并在每次调用中检查当前键是否为任何操作之一，然后相应执行操作。否则，根据输入是数组还是对象，递归地调用相同函数传入当前值进行更新。将此辅助函数封装在另一个父函数内部。由于输入对象是冻结的，我们无法直接更新它，因此我们将创建一个它的克隆。将克隆通过辅助函数进行更新，并在最后返回之前对其进行冻结。\n\
  \n```javascript\n// 用于深度冻结的函数\nfunction deepFreeze(object) {\n  // 获取在对象上定义的属性名\n\
  \  let propNames = Object.getOwnPropertyNames(object);\n  // 递归冻结所有属性\n  for (let\
  \ name of propNames) {\n    let value = object[name];\n    object[name] = value\
  \ && typeof value === \"object\" ? deepFreeze(value) : value;\n  }\n  return Object.freeze(object);\n\
  }\n\n// 用于执行操作的函数\nfunction update(inputObj, action) {\n  const clone = JSON.parse(JSON.stringify(inputObj));\n\
  \  function helper(target, action) {\n    // 遍历 action 的条目\n    for (const [key,\
  \ value] of Object.entries(action)) {\n      // 如果键是操作类型，则执行操作\n      switch (key)\
  \ {\n        // 添加新值\n        case '_push_':\n          return [...target, ...value];\n\
  \        // 替换条目\n        case '_replace_':\n          return value;\n        //\
  \ 合并值\n        case '_merge_':\n          if (!(target instanceof Object)) {\n \
  \           throw Error(\"bad merge\");\n          }\n          return {...target,\
  \ ...value};\n        // 添加转换后的值\n        case '_transform_':\n          return\
  \ value(target);\n        // 对于普通值\n        default:\n          // 如果是数组\n     \
  \     if (target instanceof Array) {\n            // 创建副本\n            const res\
  \ = [...target];\n            // 更新值\n            res[key] = value;\n          \
  \  // 更新后返回\n            return res;\n          }\n          // 如果是对象\n        \
  \  else {\n            // 递归调用相同函数\n            // 并更新值\n            return {\n\
  \              ...target,\n              [key]: update(target[key], value)\n   \
  \         };\n          }\n      }\n    }\n  }\n  // 执行操作\n  const output = helper(clone,\
  \ action);\n  // 冻结输出\n  deepFreeze(output);\n  // 返回它\n  return output;\n};\n```\n\
