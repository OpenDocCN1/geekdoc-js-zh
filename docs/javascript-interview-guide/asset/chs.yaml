  \ text and\n  // the copy function\n  const [copiedText, copy] = useCopy();\n\n\
  \  return (\n    <button onClick={() => copy(\"Hello World!\")}>\n      \"copiedText\"\
  \ : {copiedText}\n    </button>\n  );\n}\n\nexport default Example;\n```\n\n###\
