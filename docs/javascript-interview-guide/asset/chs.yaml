  ```\n\n© JavaScript Interview Guide | learnersbucket.com\n467\n\n## useLockedBody()\
  \ hook\n\n在 React 中实现 `useLockedBody()` hook，该 hook 将锁定 body 防止进一步滚动。\n\n`useLockedBody()`\
  \ hook 将接收一个父元素的引用（ref），并返回锁定状态以及切换锁定状态的方法。\n\n为了锁定 body，我们需要从 body 中移除 `overflow`\
  \ 属性，以防止其内部的所有内容滚动，并隐藏滚动条。\n\n为了隐藏滚动条，获取被引用元素的 `scrollWidth`，并在 body 上添加相同尺寸的右内边距（right\
  \ padding）以覆盖间隙。\n\n整个处理过程将在 `useLayoutEffect()` hook 完成，因为该副作用涉及 DOM。使用一个状态来监控切换，并根据切换状态来锁定或解锁\
  \ body。\n\n```javascript\nconst useLockedBody = (ref, initiallyLocked = false) =>\
  \ {\n  const [locked, setLocked] = useState(initiallyLocked);\n\n  // 在渲染前处理副作用\n\
  \  useLayoutEffect(() => {\n    if (!locked) {\n      return;\n    }\n    // 保存原始\
  \ body 样式\n    const originalOverflow = document.body.style.overflow;\n    const\
  \ originalPaddingRight = document.body.style.paddingRight;\n\n    // 锁定 body 滚动\n\
  \    document.body.style.overflow = \"hidden\";\n\n    // 获取滚动条宽度\n    const root\
  \ = ref.current;\n    // 或者 root\n    const scrollBarWidth = root ? root.offsetWidth\
  \ - root.scrollWidth : 0;\n\n    // 防止宽度重流\n    if (scrollBarWidth) {\n      document.body.style.paddingRight\
  \ = `${scrollBarWidth}px`;\n    }\n\n    // 清理\n    return () => {\n      document.body.style.overflow\
  \ = originalOverflow;\n      if (scrollBarWidth) {\n        document.body.style.paddingRight\
  \ = originalPaddingRight;\n      }\n    };\n  }, [locked]);\n\n  // 当依赖项变化时更新状态\n\
  \  useEffect(() => {\n    if (locked !== initiallyLocked) {\n      setLocked(initiallyLocked);\n\
  \    }\n  }, [initiallyLocked]);\n\n  return [locked, setLocked];\n};\n```\n\n###\
  \ Test Case\n\n### 输入:\n```javascript\nconst Example = () => {\n  const ref = useRef();\n\
  \  // 调用 hook，返回当前值和\n  // 切换函数\n  const [locked, setLocked] = useLockedBody(ref);\n\
  \n  return (\n    <div style={{ height: \"200vh\" }} id=\"abc\" ref={ref}>\n   \
  \   <button onClick={()() => setLocked(!locked)}>\n        {locked ? \"unlock scroll\"\
  \ : \"lock scroll\"}\n      </button>\n    </div>\n  );\n};\n\n// 点击按钮锁定和解锁 body\
  \ 锁定\n```\n\n© JavaScript Interview Guide | learnersbucket.com\n470\n\n## 数字递增计数器\n\
