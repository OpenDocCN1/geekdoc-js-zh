  // \"prashant runs MDN\"\n```\n\n### JavaScript 问题\n### 定义\n\n根据 MDN –\n\n`Promise.all()`\
  \ 接收一个 Promise 数组并返回一个，当数组中所有的 Promise 都已完成（fulfilled）或可迭代对象不包含 Promise 时，该 Promise\
  \ 将解析。它以第一个被拒绝（rejected）的 Promise 的原因被拒绝。\n\n\n在阅读 `Promise.all()` 的定义后，我们可以将问题分解为子问题并逐一解决。\n\
