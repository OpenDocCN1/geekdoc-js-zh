  © JavaScript Interview Guide | learnersbucket.com\n459\n\n### useOnClickOutside()\
  \ hook\n\n检查用户是否点击了组件外部。在 React 中创建一个 `useOnClickOutside()` 的 hook，可以帮助我们检测这种行为。\n\
  \n`useOnClickOutside(ref, callback)` 将接受组件/元素引用和回调函数，并在点击引用外部时调用该回调函数。\n\n我们需要做的只是监听如\
  \ `mousedown`、`touchstart` 等鼠标和触摸事件，并在事件触发时检查 `event.target` 是否不是引用的后代，如果是则调用回调。\n\
  \n将此逻辑封装在 `useEffect()` hook 内部，以便我们可以分配和移除监听器。\n\n```javascript\nfunction useOnClickOutside(ref,\
  \ callback) {\n  useEffect(() => {\n    const listener = (event) => {\n      //\
  \ 如果引用不存在\n      // 或者目标是引用的后代\n      // 返回\n      if (!ref.current || ref.current.contains(event.target))\
  \ {\n        return;\n      }\n      // 调用回调\n      callback(event);\n    };\n \
  \   document.addEventListener(\"mousedown\", listener);\n    document.addEventListener(\"\
  touchstart\", listener);\n    return () => {\n      document.removeEventListener(\"\
  mousedown\", listener);\n      document.removeEventListener(\"touchstart\", listener);\n\
  \    };\n  },\n  // 将 ref 和 callback 添加到 effect 依赖项\n  [ref, callback]\n);\n}\n\
  ```\n\n© JavaScript Interview Guide | learnersbucket.com\n460\n\n### 测试用例\n\n**输入：**\n\
  \n```javascript\nfunction Example() {\n  const ref = useRef();\n  useOnClickOutside(ref,\
  \ () => {\n    console.log(\"Clicked\");\n  });\n  return (\n    <div>\n      <p>Outside\
  \ Click me!</p>\n      <p ref={ref}>Click me!</p>\n    </div>\n  );\n}\n```\n\n\
  **输出：**\n```\n\"Clicked\" // 当点击 Outside Click me! 时\n```\n\n© JavaScript Interview\
  \ Guide | learnersbucket.com\n461\n\n### useHasFocus() hook\n\n在 react 中实现一个 hook，帮助判断应用程序是否处于聚焦状态。这有助于在用户未聚焦或未在该标签页时停止后台处理。\n\
  \n要创建 `useHasFocus()`，我们需要在 `window` 上监听聚焦（focus）和失去焦点（blur）事件。\n\n使用 `useState()`\
  \ 持久状态并使用 `useEffect()` 分配和移除事件监听器。\n\n当窗口失去焦点时，将焦点状态设置为 `false`；否则当窗口聚焦时，将状态更新为\
  \ `true`。\n\n使用 `[document.hasFocus()](https://developer.mozilla.org/en-US/docs/Web/API/Document/hasFocus)\
  \ 获取初始状态。\n\n```javascript\nimport { useState, useEffect } from \"react\";\n\nconst\
  \ useHasFocus = () => {\n  // 获取初始状态\n  const [focus, setFocus] = useState(document.hasFocus());\n\
  \  useEffect(() => {\n    // 更新状态的辅助函数\n    const onFocus = () => setFocus(true);\n\
  \    const onBlur = () => setFocus(false);\n    // 分配监听器\n    // 在事件发生时更新状态\n  \
  \  window.addEventListener(\"focus\", onFocus);\n    window.addEventListener(\"\
  blur\", onBlur);\n    // 移除监听器\n    return () => {\n      window.removeEventListener(\"\
  focus\", onFocus);\n      window.removeEventListener(\"blur\", onBlur);\n    };\n\
  \  }, []);\n  // 返回状态\n  return focus;\n};\n```\n\n© JavaScript Interview Guide\
  \ | learnersbucket.com\n462\n\n### 测试用例\n\n**输入：**\n\n```javascript\nconst Example\
  \ = () => {\n  const focus = useHasFocus();\n  console.log(focus);\n  return <></>;\n\
  };\n```\n\n**输出：**\n```\ntrue\nfalse // 切换标签\ntrue // 回到标签\n```\n\n© JavaScript\
  \ Interview Guide | learnersbucket.com\n463\n\n### useToggle() hook\n\n在 React 中实现\
  \ `useToggle()` hook，它接受一个值数组和起始索引，并切换数组中的下一个值。如果索引达到了数组的最后一个索引，则重置索引。\n\n该 hook\
  \ 将返回当前值和一个 `toggle()` 方法，通过该方法我们可以切换值。\n\n要创建这个 hook，我们只需要跟踪索引，并可以使用索引从数组中返回值；因此，使用\
  \ `useState()` hook 来持久化和跟踪索引，然后使用 `useCallback()` hook 创建切换函数。\n\n通过使用 `useCallback()`\
  \ hook，我们可以记忆切换方法，以便将其向下传递给组件。\n\n```javascript\nimport { useCallback, useState\
  \ } from \"react\";\n\nconst useToggle = (values, startIndex = 0) => {\n  // 跟踪索引\n\
  \  const [index, setIndex] = useState(startIndex);\n  // 定义并记忆化切换函数，以防\n  // 我们将其传递给组件，\n\
  \  // 这会将索引移动到下一个级别\n  // 如果如果超出限制则重置它。\n  const toggle = useCallback(\n    () =>\
  \ setIndex((prevIndex) => (prevIndex >= values.length - 1 ? 0 : prevIndex + 1)),\n\
  \    [values]\n  );\n  // 返回值和切换函数\n  return [values[index], toggle];\n};\n```\n\
  \n© JavaScript Interview Guide | learnersbucket.com\n464\n\n### 测试用例\n\n**输入：**\n\
  \n```javascript\nfunction Example() {\n  // 调用 hook 获取当前值\n  // 和切换函数\n  const [currentValue,\
  \ toggleValue] = useToggle([\"a\", \"b\", \"c\", \"d\"], 2);\n  return (\n    <button\
  \ onClick={toggleValue}>\n      \"currentValue\": {currentValue}\n    </button>\n\
  \  );\n}\n\nexport default Example;\n```\n\n**输出：**\n```\ncurrentValue: c // 初始\n\
  currentValue: d // onClick\ncurrentValue: a // onClick\ncurrentValue: b // onClick\n\
  currentValue: c // onClick\n```\n\n© JavaScript Interview Guide | learnersbucket.com\n\
  465\n\n### useCopy() hook\n\n在 React 中实现一个 `useCopy()` hook，将给定文本复制到剪贴板。\n\n`useCopy()`\
  \ 方法返回一个 `copy(text)` 方法，该方法接受文本作为输入并复制该文本以及返回复制后的文本。\n\n为了实现此函数，我们将使用浏览器内置的允许复制\
  \ [navigator.clipboard](https://developer.mozilla.org/en-US/docs/Web/API/Navigator/clipboard)\
  \ 。\n\n`navigator.clipboard` 有两个方法：\n\n- `writeText(text)` – 用于复制任何给定的文本。\n- `readText()`\
  \ – 用于读取复制的文本。\n\n这两个操作都是异步的并返回 promise。对于我们的用途，我们将使用 `writeText(text)` 并将其封装在 `try...catch`\
  \ 块中。\n\n我们还将使用 `useState()` hook 来持久化复制的文本。如果 promise 完成，则用文本更新状态，否则将状态设置为 `null`。\n\
  \n此操作将在 `copy()` 函数内部进行，该函数接受文本作为输入并尝试复制该文本。\n\n```javascript\nimport { useState\
  \ } from \"react\";\n\nconst useCopy = () => {\n  const [copiedText, setCopiedText]\
  \ = useState();\n  const copy = async (text) => {\n    if (!navigator?.clipboard)\
  \ {\n      console.warn(\"不支持剪贴板\");\n      return false;\n    }\n    // 尝试保存到剪贴板，如果成功则将其保存到\n\
  \    // 状态中\n    try {\n      await navigator.clipboard.writeText(text);\n     \
  \ setCopiedText(text);\n    } catch (error) {\n      console.error(`复制文本 ${text}\
  \ 失败`, error);\n      setCopiedText(null);\n    }\n  };\n  return copy;\n};\n```\n\
  \n\n\n\n\n```javascript\n[copiedText, copy];\n\n};\n```\n\n### Test Case\n\n###\
