  # 防抖（Debouncing）和节流（Throttling）之间的区别是什么？\n\n- **防抖 (Debouncing)** :- 它用于在特定时间内没有发生任何操作时，才调用/触发/执行函数。\n\
  \n例如：当用户停止在搜索框中输入时，调用搜索函数来获取结果。如果用户继续输入，则重置该函数。\n\n- **节流 (Throttling)** :- 它用于限制函数被调用/触发/执行的次数。例如：在用户点击时向服务器发送\
