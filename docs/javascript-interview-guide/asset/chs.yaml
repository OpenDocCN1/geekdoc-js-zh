  \n如果你像我一样是一个喜欢尝试常用开发者，你首先想到的方法就是使用 `setInterval`。使用 `setInterval` 来此非常简单，例如使用 `setInterval`\
  \ 函数来递增计数器。\n\n现在有两种方法可以在 React 中实现它：\n1. 使用状态 (state)\n2. 使用 Ref\n\n### CountMethods.js\n\
  ```javascript\nimport React, { useEffect, useState, useRef } from \"react\";\n\n\
  const CountSetInterval = (props) => {\n  const intervalRef = useRef();\n  const\
  \ countRef = useRef();\n  // 来自组件的数字\n  const { number, duration } = props;\n  //\
  \ 组件展示的数字\n  const [count, setCount] = useState(\"0\");\n  // 计算计算所需的时间\n  const\
  \ [timeTaken, setTimeTaken] = useState(Date.now());\n\n  useEffect(() => {\n   \
  \ let start = 0;\n    // 来自 props 的第一个数字\n    const end = parseInt(number);\n  \
  \  // 如果为 0，则返回\n    if (start === end) return;\n    // 找到每次递增的时长\n    const totalMilSecDur\
  \ = parseInt(duration);\n    let incrementTime = (totalMilSecDur / end) * 1000;\n\
  \n    // 定计时器增加计数器\n    // 然后更新 count\n    let timer = setInterval(() => {\n   \
  \   start += 1;\n      // 使用状态更新\n      setCount(String(start));\n      // 使用 ref\
  \ 更新\n      // countRef.current = start;\n      // 如果 start 达到 end 则结束\n      if\
  \ (start === end) {\n        clearInterval(timer);\n        const diff = Date.now()\
  \ - timeTaken;\n        setTimeTaken(diff / 1000);\n        // 使用 ref 时取消此注释\n \
  \       // setCount(String(start));\n      }\n    }, incrementTime);\n    // 依赖数组\n\
  \  }, [number, duration]);\n\n  return (\n    <>\n      <span ref={countRef} className=\"\
  Count\">\n        {count}\n      </span>\n      {\" \"}\n      {\" \"}\n      {number\
  \ === count && (\n        <span>\n          | Took : <b>{timeTaken}</b> seconds\
  \ to complete\n        </span>\n      )}\n    </>\n  );\n};\n```\n\n\n\n\n```javascript\n\
  //If any input changes reset\nconst basicReset = () => {\n  setStart(false);\n};\n\
