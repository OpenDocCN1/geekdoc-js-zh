  # Promise.any() Polyfill\n\n`Promise.any()` 接收一个 Promise 对象的迭代器。它返回一个单一 promise，只要迭代器中的任何一个\
  \ promise 成功，该 promise 就会解析，并取值为该成功 promise 的值。如果迭代器中没有 promise 成功（即所有给定的 promise\
  \ 都被拒绝），则返回的 promise 将被 `AggregateError` 拒绝，它是 `Error` 的新子类，用于将各个错误组合在一起。\n\n简单来说，`Promise.any()`\
  \ 就是 `Promise.all()` 的相反。\n\n阅读定义，我们可以将问题陈述分解为多个子问题，然后逐一处理以实现 polyfill。\n\n\n###\
  \ 实现\n\n```javascript\nconst any = function(promisesArray) {\n  const promiseErrors\
  \ = new Array(promisesArray.length);\n  let counter = 0;\n      Promise.resolve(promise)\n\
  \        .then(resolve) // 当任何输入 promise 解析时解析\n        .catch(error => {\n    \
  \      promiseErrors[counter] = error;\n          counter = counter + 1;\n     \
  \     if (counter === promisesArray.length) {\n            // 所有 promise 都被拒绝，拒绝外部\
  \ promise\n    })\n  });\n};\n```\n\n### 测试用例 1\n输入：\n});\nconst test2 = new Promise(function(resolve,\
