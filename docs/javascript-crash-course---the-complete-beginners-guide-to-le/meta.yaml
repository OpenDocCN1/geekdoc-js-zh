- img_proc: true
  md: '# Data Types


    When working with Javascript and other programming languages you will have several
    different components that you an work with. Here are a list of some of them and
    what they do.


    Numbers, eg. 123, 120.50 etc.


    Strings of text e.g. “This text string” etc.


    Boolean e.g. true or false.


    Writing variables


    Variables are placeholders when it comes to programming. As you saw in the example
    we created several different variables to contain the information for our users.


    ```

    var myList

    ```


    variables are defined with the var statement in front of them. So var myAddress
    or var myValue are all acceptable. When writing variables you can have pretty
    much anything you want but you will want to keep to what is known as a naming
    convention.


    A naming convention is a standard way of doing things. When you practice naming
    conventions you write your code the same way throughout the program. If you write
    a variable with a $ in front of it then you need to do this for all of your variables.
    If you write a variable with camel case which is myAddress then you will want
    to keep this throughout.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Keeping your code readable


    When you are writing your code you want to keep it as readable as possible. This
    is needed so that anyone that reads your colide will know what you are doing and
    how the flow of your program will go. If you start to design messy code and and
    don’t comment on what you are doing going back to fix a bug or if another programmer
    needs to go back and edit your code it will be very hard for them to know what
    is going on if your code is all jumbled, uncommented and just crap.


    When it comes to programming Javascript or any other langage for that matter you
    will need to develop your very own programming style. This style will soon become
    your unique signature and like stated earlier you will be the envy of the development
    community.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Using libraries and prewritten code


    Earlier I stated that you should not use libraries and prewritten code until you
    have a basic understanding of how javascript works. Now that you have a basic
    understanding you can go and find cool libraries and other programming examples
    and see what people are doing and how how they write their code.


    When looking at their code you will want to take noes on their programming style.
    You will want to see how they comment their code, what variables they use, how
    they structure their functions. Learning from others is a great way to learn.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Showing off your code


    When learning to program you will want to show off your code as much as possible.
    When it comes to programming there really isn''t a big secret in how programs
    are made at least at your level of development.


    When you show off your code you can get feedback and suggestions on how to tighten
    up your code and make it more functional and user friendly. Don’t be afraid of
    comments and suggestions. This is a learning experience and something that you
    should take full advantage of.'
  merge: -1
  pgno: 25
