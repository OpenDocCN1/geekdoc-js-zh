  mdcn: "\n输入类型（type）指的是你正在操作的表单上的项目。在这个示例中，你看到的 `type='text'` 指的是文本框。这可以是你想要的任何内容，例如复选框、单选按钮或你可能需要的任何控件。`type=\"\
    submit\"` 指的是你将点击的提交按钮。“value”（值）一词指的是你将在按钮上看到的文本。\n\n`onclick` 是你希望用户执行的操作。因此，当按钮被点击时（点击按钮时），执行以下操作，即运行函数中的所有内容。例如\
    \ `onclick=\"subs()\"`，这就是函数的名称。\n\n涉及到编程时，这只是了解你的程序流程、你希望用户做什么、当用户执行操作时会发生什么，以及当出现问题时可以采取哪些错误保护措施简单简单。\n\
    \n# 数据类型 (Data Types)\n\n在使用 Javascript 和其他编程语言时，你会有几个不同的组件可以操作。以下是其中一些组件的列表及其功能。\n\
    \n- 数字（Numbers），例如 123，120.50 等。\n- 字符串（Strings），例如“This text string”等。\n- 布尔值（Boolean），例如\
    \ true 或 false。\n\n## 变量 (Writing variables)\n\n在编程中，变量是占位符。正如你在示例所示，我们创建了几个不同的变量来包含用户的信息。\n\
    \n```\nvar myList\n```\n\n变量是通过在它们前面的 `var` 语句定义的。因此，`var myAddress` 或 `var myValue`\
    \ 都是可以的。在编写变量时，你可以使用几乎任何名称，但你会希望遵循所谓的“命名规范”（naming convention）。\n\n命名规范是处理事务的一种标准方式。当你练习命名规范时，你在整个程序中都会以相同的方式编写代码。如果你在变量前面加一个\
    \ `$`，那么你需要对所有的变量都这么做。如果你使用驼峰命名法（camel case）编写变量，例如 `myAddress`，那么你希望始终保持这种风格。\n\
    \n# 保持代码的可读性 (Keeping your code readable)\n\n当你编写代码时，你希望尽可能保持它的易读。这是为了让任何阅读你代码的人都知道你在做什么，以及你的程序流程将如何进行。如果你开始设计杂乱的代码并且不对你所做的事情注释，那么当需要回来修复\
    \ bug 或另一个程序员需要回来编辑你的代码时，如果你的代码完全混乱、没有注释且只是一堆垃圾，他们将将很难知道发生了什么。\n\n涉及到编程 Javascript\
    \ 或任何其他语言，你需要开发属于你自己的编程风格。这种风格将很快成为你独特的签名，正如之前提到的，你将成为开发社区的羡慕对象。\n\n# 使用库和预写代码\
    \ (Using libraries and prewritten code)\n\n之前我提到过，在你对 Javascript 如何工作有基本的了解之前，不要使用库和预写代码。现在你已经有了基本的了解，可以去寻找酷的库和其他编程示例，看看人们在做什么以及他们是如何编写代码的。\n\
    \n在查看他们的代码时，你会希望对他们的编程风格做笔记。你会查看他们如何注释代码、使用哪些变量、如何构建他们的函数。从他人身上学习是一个很好的方法。\n\n\
    # 展示你的代码 (Showing off your code)\n\n在学习编程时，你会希望尽可能地展示你的代码。在编程方面，程序的制作并没有什么大秘密，至少在你目前的开发水平上是。\n\
    \n当你展示代码时，你可以获得关于如何紧凑代码使其更具功能且更易于使用的反馈和建议。不要害怕注释和建议。这是一个学习过程，是你应该充分利用的。\n\n# 为你的代码添加注释\
    \ (Commenting your code)\n\n现在你已经看到了程序的结构，以及当你将代码与函数、变量和调用组合时会发生什么，你将开始构建相当大的程序。\n\
    你需要做的一件事是为你的代码添加注释。出于某些原因，注释非常重要。\n\n首先，你可以跟踪你想添加到程序中的笔记，例如功能、函数等。在某个时刻，你可能想尝试不同的代码块，但不要删除你已经写的内容，因此添加注释或注释掉该代码块将非常有帮助。\n\
    \n当你写注释时，网络浏览器不会读取它。所有注释对于你查看代码时都是很好的参考点。在编写注释时，你有几种不同的选择。\n\n第一种是块注释（block comment）。块注释会屏蔽块内的所有文本。要创建一个块注释，你将编写以下代码\
    \ `/* */`。之间的所有内容都将是注释。所以你的注释看起来像这样：\n\n```\n/* 这是我的注释文本\n\n我希望你喜欢我对这本书的注释\n\n\
    今天能为你书写代码是我的荣幸\n*/\n```\n\n你在这些括号内编写的所有内容将仅供自己查看。通过这种类型的注释，你可以在多行上编写代码，这是制作可读文本的极佳方法。\n\
    \n// 这用于单行注释\n\n涉及到短注释时，你希望在注释的开头使用 `//`。这适用于短的且适合放在单行的注释。如果你有超过一行的注释，你将希望使用块注释。\n\
    \n我应该在哪里给代码加注释？\n\n涉及到给代码注释时，你希望在特定的关键区域对代码进行注释。例如，你永远不想在正在写的代码前面写注释。如果你要在代码之前写注释，你希望将其放在代码上方，而不是与代码在同一行。这里有一个例子：\n\
    \n```javascript\n/*\n这是一个程序，将跟踪\n*/\n```\n\n```html\n<!doctype html>\n<html lang=\"\
    en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Test</title>\n<script type=\"\
    text/javascript\">\nfunction subs() {\n  var myValue = document.getElementById('TextBox').value;\n\
    \n  if (myValue.length == 0) {\n    alert('Please enter a value!');\n    return;\n\
    \  }\n  var myTitle = document.getElementById('title');\n  myTitle.innerHTML =\
    \ myValue;\n}\n</script>\n</head>\n<body>\n<h1 id=\"title\">Test</h1>\n\n<input\
    \ type=\"text\" id=\"TextBox\" />\n<input type=\"submit\" value=\"Click Me\" onclick=\"\
    subs()\" />\n</body>\n</html>\n```\n\n你需要做的一件事是像这样注释代码：\n// myTitle.innerHTML\
    \ = myValue\n涉及到短注释时，你希望在注释的开头使用 // ... 但请记住，如果你这样注释，它不会被编译器读取。\n"
