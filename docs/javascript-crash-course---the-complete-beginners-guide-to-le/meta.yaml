- md: "\n# Chapter 2 – Javascript101\n\nNow that you have the basic understanding\
    \ of what a programming language is and what you can do in order to start writing\
    \ your own we are going to jump into Javascript and start developing your very\
    \ own programs.\n\nBefore we jump in to coding I want to get you set up with a\
    \ few things. I want you to go http://www.brackets.io and download their software.\
    \ This software will be our programming editor we will use in this book.\n\nIf\
    \ you have a text editor or another program that you feel comfortable using and\
    \ it will work with Javascript then go ahead and use it. If you don't then look\
    \ at brackets.io and follow along in the book.\n\nNext I don't want you to look\
    \ at any types of javascript libraries or other prewritten code. One mistake people\
    \ make is going out and getting these libraries and think they can build a program.\n\
    \nWell you can do this but you need to have the foundation first in order to build\
    \ off these libraries. So libraries are great but don't look at them, think about\
    \ them or focus on them until you have completed this book and tried some of the\
    \ exercises that I discuss here.\n\n## Setting up our working environment\n\n\
    Okay lets get started. The first thing that I want you to do is right mouse click\
    \ on your desktop and go to New and create a new folder. I want you to name this\
    \ folder “Exercises” or something along those lines in order to keep all of your\
