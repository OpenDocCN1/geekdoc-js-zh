  md: '# Functions and Variables


    The next thing that I want to talk to you about functions and variables. When
    you are programming in any language you will want to use variables and functions
    in order to separate your code as well as define specific items in your code.
    If you don''t use functions and variables you will have very unusable code and
    your programs will have very little functionality.


    # Variables


    Variables are words and phrases that relate to something else. For example $StreetName
    is a variable that you can use to collect information about a street. $FirstName
    is another variable that you can use to collect the first name of someone on your
    web site.


    Variables can be anything you want them to be. You however want to create variables
    that make sense to the programmer. Creating a variable named apple when you are
    talking about the amount of money in a budget doesn''t make sense. So when naming
    your variables keep them uniform to what you are creating.


    # Functions


    Functions are small blocks of code that will execute when a given set of conditions
    are met. For example if you have a function for adding files to a database you
    will want to name your function something like “DataAdd”. When you are performing
    a task that needs to use the code that is contained within the function you do
    a function call which will execute the code and return your desired results. Here
    is an example of functions and variables.


    Open your template file and save it as exercise2.html. Make sure that the document
    type is set to all files. Save the file and make the following changes.'
