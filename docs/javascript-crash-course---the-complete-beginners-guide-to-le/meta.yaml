- img_proc: true
  md: 'Input type refers to the items on the form you are working on. In this example
    you see the type=''text'' which refers to a text box. This can be anything that
    you want such as a checkbox, radio button or any other control you may need. The
    type="submit" refers to the submit button that you will click. The word "value"
    refers to the text that you will see on the button.


    Onclick is the action that you want the user to perform. So when the button is
    clicked (on clicking the button) perform the following action which is to run
    everything in the function. So onclick="subs()" which is the name of the function.


    When it comes to programing it is a simple matter of knowing the flow of your
    program, what you want the user to do, what will happen when the user performs
    an action and what error protection you can put into place when something goes
    wrong.'
  merge: -1
