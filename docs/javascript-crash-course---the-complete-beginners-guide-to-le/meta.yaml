- md: "\nInput type refers to the items on the form you are working on. In this example\
    \ you see the type='text' which refers to a text box. This can be anything that\
    \ you want such as a checkbox, radio button or any other control you may need.\
    \ The type=\"submit\" refers to the submit button that you will click. The word\
