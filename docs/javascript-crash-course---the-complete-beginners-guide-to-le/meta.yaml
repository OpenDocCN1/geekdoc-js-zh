  md: '# Chapter 1 – An Introduction to Programming


    Before we get into Javascript and web development lets get some basics and foundation.
    When it comes to learning a new language be a spoken language or a computer language
    you need to understand how it is used in the real world. When it comes to computer
    languages they all work basically the same.


    They are a grouping of text files with different extension on them to tell the
    other files that are on your computer how to access and interpret them.


    So for example if you have a file such as index.html your web browser program
    will understand through its set of files that it is the first file it should look
    for when visiting a web site.


    The same goes for programming languages. When you have a grouping of files the
    program known as the compiler will read the listing of files looking for a specific
    one.


    Then when it finds that file will look for specific instructions or lines of code
    to do specific tasks according to your input or through different sets of code
    it discovers.


    In simpler terms if you have a list of groceries and you are at the store. You
    will start at the top of your list and go to that item.


    Then when you have that item you will look at the list again and jump to the next
    closest item on your list until you come to the end of the list and end up at
    the checkout.


    I hope you can see the picture and the pattern of what I am talking about. The
    same set of rules applies to a computer language. You have a set of or list in
    the grocery store.


    Depending on the choices that you make from that list will determine how you interact
    in the store.


    The same applies to programing. What choices the user makes as they go through
    your program will result in different responses from your program.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# How do we write programs?


    It is very simple to write programs. You can write a program in any language using
    a program like notepad. You don''t want to use programs such as Microsoft Word
    since these programs put in their own codes and information and will not create
    a clean file.


    If you like a visual interface most programming languages have what is known as
    a GII or Graphical User Interface. These programs make developing a program much
    easier and cleaner.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# What can I make in a program?


    You can make anything you can think of in a program. The main areas that you need
    to know is what you want to make, where you want to start, what you want your
    user to do and what the end result will be. For example many programmers start
    out with the “Hello World” example.


    If you have been programming for any length of time you will see this example
    used all over the place.


    This is a very useless program in itself but it does show you the basics and the
    foundation of programming and does allow you to see a program function in the
    language of your choice.


    When it comes to developing programs however some languages are designed and developed
    to perform specific functions.


    Javascript for example is designed for web applications and functionality on the
    web. Visual Basic on the other hand is more designed for office and desktop applications.


    You can do web applications with Visual Basic but there is a lot of tasks that
    you will need to perform just as if you were to use Javascript in a desktop application
    you would have to do a lot of major programming to get something to work. This
    is just because they were not meant to work in the others environment.


    This is why there are so many different languages for you to choose from. The
    great thing is though if you learn the basic foundation of one you will be able
    to see and recognize similarities in multiple languages and pick them up easily.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Planning your programs


    When you get into programming you will want to plan out your programs from start
    to finish. Now you will be able to change things around and can move away from
    your original plan but if you have a basic idea and a path you you wish to follow
    then your programming efforts will have greater results.


    # Reuse code


    When you start programming for a long period of time you will soon realize that
    you will be using a lot of the same code in your programs. When you start developing
    it will be a good idea to start building up your own database of code files that
    you can reuse in other projects. This is a good programming habit and practice
    to get into. You don''t want to reinvent the wheel every time you write something.


    # Avoid Yellow Code


    A term in the programming community is yellow code. This is code that is sloppy
    and just filled with bugs. We call it yellow code for the color of pee since that
    is all it is good for. When writing your programs follow a logical path and think
    out problems before you start coding. It will save you time and headache in the
    long run.


    # Document your code


    One of the biggest mistakes people make when writing code is not to document their
    code. When you start writing a lot of code will start to bled in together and
    you will not know when one function ends or where another procedure begins.


    When you document your code you are doing it for yourself. You can use comments
    in your code anywhere you want and when you need to make a change or fix a problem
    you will easily know where to go, where you ended up and what ideas you wanted
    to implement. So comment everything!


    # Develop your own style


    Programming is an art form. When you code you are writing the same thing that
    others are writing but are doing it in your own style.


    When you develop awesome programs other programmers will look at your code and
    drool over how clean and efficient it is. I know it sounds goofy and dumb t.but
    it is a fact. You can be famous for the way you write your code.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Always Improve


    No matter what you do or what you write you can always improve on it. When new
    technology is developed and new foundations in the language are developed you
    will want to use these to improve on your existing work to make it cleaner and
    more efficient.


    This is the basics of programming. The rest is just learning how to read and write
    the language. In the next chapter we will start to talk about Javascript, what
    you can do with it and get you started making your first set of programs.'
