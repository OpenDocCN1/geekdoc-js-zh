- md: "\n# JAVASCRIPT\nJava\n\nCRASH COURSE - THE COMPLETE BEGINNERS GUIDE TO LEARNING\
    \ JAVASCRIPT PROGRAMMING IN NO TIME!\n\nNATHANIEL HILL\n\n# Javascript:\n\n##\
    \ Crash Course - The Complete Beginners Guide To Learning JavaScript Programming\
    \ In No Time!\n\n# Table of contents\n\n# Introduction\n\n# Chapter 1 – An Introduction\
    \ to Programming\n\n- How do we write programs?\n- What can I make in a program?\n\
    - Planning your programs\n    - Reuse code\n    - Avoid Yellow Code\n    - Document\
    \ your code\n    - Develop your own style\n    - Always Improve\n\n# Chapter 2\
    \ – Javascript 101\n\n- Setting up your working environment\n- Functions and Variables\n\
    \    - Variables\n    - Functions\n- Data Types\n- Keeping your code readable\n\
    - Using libraries and prewritten code\n- Showing off your code\n- Commenting your\
    \ code\n- Resources\n\n# Conclusion\n\n## Introduction\n\nThe Internet is built\
    \ on a core set of fundamental programming languages. These languages help to\
    \ drive functionality and feature-rich content to users all over the world. Some\
    \ of the languages that are used are PHP, Perl, MySQL, Ruby on Rails, Java and\
    \ the language that we are going to talk about today which is Javascript.\n\n\
    If you are someone who has never programmed before or if you are just looking\
    \ to try this is the book for you. I am a programmer myself and I know how difficult\
    \ it is sometimes to go through some of these books and learn a language.\n\n\
    Since I am a developer myself I am going to approach this book in a simple, easy\
    \ to understand step-by-step manner. At the end of the book you will have the\
    \ foundation and the knowledge to advance your skills and actually start developing\
    \ your very own applications using Javascript as well as other programming languages.\n\
    \n## Chapter 1 – An Introduction to Programming\n\nBefore we get into Javascript\
    \ and web development let's get some basics and foundation. When it comes to learning\
    \ a new language, be a spoken language or a computer language, you need to understand\
    \ how it is used in the real world. When it comes to computer languages they all\
    \ work basically the same.\n\nThey are a grouping of text files with different\
    \ extensions on them to tell the other files that are on your computer how to\
    \ access and interpret them.\n\nSo for example if you have a file such as index.html\
    \ your web browser program will understand through its set of files that it is\
    \ the first file it should look for when visiting a website.\n\nThe same goes\
    \ for programming languages. When you have a grouping of files the program known\
    \ as the compiler will read the listing of files looking for a specific one.\n\
    \nThen when it finds that file it will look for specific instructions or lines\
    \ of code to do specific tasks according to your input or through different sets\
    \ of code it discovers.\n\nIn simpler terms if you have a list of groceries and\
    \ you are at the store. You will start at the top of your list and go to that\
    \ item.\n\nThen when you have that item you will look at the list again and jump\
    \ to the next closest item on your list until you come to the end of the list\
    \ and end up at the checkout.\n\nI hope you can see the picture and the pattern\
    \ of what I am talking about. The same set of rules applies to a computer language.\
    \ You have a set of or a list like in the grocery store.\n\nDepending on the choices\
    \ that you make from that list will determine how you interact in the store.\n\
    \nThe same applies to programming. What choices the user makes as they go through\
    \ your program will result in different responses from your program.\n\n### How\
    \ do we write programs?\n\nIt is very simple to write programs. You can write\
    \ a program in any language using a program like notepad. You don't want to use\
    \ programs such as Microsoft Word since these programs put in their own codes\
    \ and information and will not create a clean file.\n\nIf you like a visual interface\
    \ most programming languages have what is known as a GUI or Graphical User Interface.\
    \ These programs make developing a program much easier and cleaner.\n\n### What\
    \ can I make in a program?\n\nYou can make anything you can think of in a program.\
    \ The main areas that you need to know is what you want to make, where you want\
    \ to start, what you want your user to do and what the end result will be. For\
    \ example many programmers start out with the “Hello World” example.\n\nIf you\
    \ have been programming for any length of time you will see this example used\
    \ all over the place.\n\nThis is a very useless program in itself but it does\
    \ show you the basics and the foundation of programming and does allow you to\
    \ see a program function in the language of your choice.\n\nWhen it comes to developing\
    \ programs however some languages are designed and developed to perform specific\
    \ functions.\n\nJavascript for example is designed for web applications and functionality\
    \ on the web. Visual Basic on the other hand is more designed for office and desktop\
    \ applications.\n\nYou can do web applications with Visual Basic but there is\
    \ a lot of tasks that you will need to perform just as if you were to use Javascript\
    \ in a desktop application you would have to do a lot of major programming to\
    \ get something to work. This is just because they were not meant to work in the\
    \ others environment.\n\nThis is why there are so many different languages for\
    \ you to choose from. The great thing is though if you learn the basic foundation\
    \ of one you will be able to see and recognize similarities in multiple languages\
    \ and pick them up easily.\n\n### Planning your programs\n\nWhen you get into\
    \ programming you will want to plan out your programs from start to finish. Now\
    \ you will be able to change things around and can move away from your original\
    \ plan but if you have a basic idea and a path you wish to follow then your programming\
    \ efforts will have greater results.\n\n### Reuse code\n\nWhen you start programming\
    \ for a long period of time you will soon realize that you will be using a lot\
    \ of the same code in your programs. When you start developing it will be a good\
    \ idea to start building up your own database of code files that you can reuse\
    \ in other projects. This is a good programming habit and practice to get into.\
    \ You don't want to reinvent the wheel every time you write something.\n\n###\
    \ Avoid Yellow Code\n\nA term in the programming community is yellow code. This\
    \ is code that is sloppy and just filled with bugs. We call it yellow code for\
    \ the color of pee since that is all it is good for. When writing your programs\
    \ follow a logical path and think out problems before you start coding. It will\
    \ save you time and headache in the long run.\n\n### Document your code\n\nOne\
    \ of the biggest mistakes people make when writing code is not to document their\
    \ code. When you start writing a lot of code it will start to bleed together and\
    \ you will not know when one function ends or where another procedure begins.\n\
    \nWhen you document your code you are doing it for yourself. You can use comments\
    \ in your code anywhere you want and when you need to make a change or fix a problem\
    \ you will easily know where to go, where you ended up and what ideas you wanted\
    \ to implement. So comment everything!\n\n### Develop your own style\n\nProgramming\
    \ is an art form. When you code you are writing the same thing that others are\
    \ writing but are doing it in your own style.\n\nWhen you develop awesome programs\
    \ other programmers will look at your code and drool over how clean and efficient\
    \ it is. I know it sounds goofy and dumb but it is a fact. You can be famous for\
    \ the way you write your code.\n\n### Always Improve\n\nNo matter what you do\
    \ or what you write you can always improve on it. When new technology is developed\
    \ and new foundations in the language are developed you will want to use these\
    \ to improve on your existing work to make it cleaner and more efficient.\n\n\
    This is the basics of programming. The rest is just learning how to read and write\
    \ the language. In the next chapter we will start to talk about Javascript, what\
    \ you can do with it and get you started making your first set of programs.\n"
  mdcn: "\n\n# JAVASCRIPT\nJava\n\n快速入门教程 - 零基础快速上手 JavaScript 编程的终极指南！\n\nNATHANIEL\
    \ HILL\n\n# Javascript:\n\n## 快速入门教程 - 零基础快速上手 JavaScript 编程的终极指南！\n\n# 目录\n\n\
    # 引言\n\n# 第一章 – 编程简介\n\n- 我们是如何编写程序的？\n- 我可以在程序中制作什么？\n- 规划你的程序\n    - 代码复用代码\n\
    \    - 避免“黄色代码”（垃圾代码）\n    - 为你的代码编写注释\n    - 开发你自己的风格\n    - 持续改进\n\n# 第二章 –\
    \ Javascript 基础101\n\n- 设置你的工作环境\n- 函数与变量\n    - 变量\n    - 函数\n- 数据类型\n- 保持代码的可读性\n\
    - 使用库和预写代码\n- 展示你的代码\n- 为你的代码编写注释\n- 资源\n\n# 结\n\n## 引言\n\n互联网是建立在核心基础编程语言之上的。这些语言帮助为全球用户驱动功能并提供丰富的内容。所使用的某些语言包括\
    \ PHP、Perl、MySQL、Ruby on Rails、Java 以及我们今天将要讨论的语言 JavaScript。\n\n如果你是一个从未编写过程序的人，或者你只是想尝试，那么这本书就是适合你的。我自己也是一名程序员，我知道有时通过这些书籍来学习一门语言是多么困难的。\n\
    \n由于我自己也是一名开发者，我将以一种简单、易懂且循序渐进的方式介绍这本书。在书结束时，你将拥有基础和知识来提升你的技能，并开始使用 JavaScript\
    \ 以及其他编程语言开发你自己的应用程序。\n\n## 第一章 – 编程简介\n\n在我们进入 JavaScript 和 Web 开发之前，让我们先学习一些基础知识。在学习一种新语言时（无论是口语还是计算机语言），你都需要理解它在现实世界中是如何使用的。对于计算机语言，它们的工作原理基本上都是相同的。\n\
    \n它们是一组具有不同扩展名的文本文件，用于告诉你计算机上的其他文件如何访问和解释它们。\n\n例如，如果你有一个像 `index.html` 这样的文件，你的网络浏览器程序将通过其文件集识别出，它是访问网站时应该查找的第一个文件。\n\
    \n编程语言也是如此。当你拥有一组文件时，被称为“编译器”的程序会读取文件列表并寻找特定的文件。\n\n当它找到该文件时，它会寻找特定的指令或代码行，根据你的输入或通过它发现的不同代码集来执行特定任务。\n\
    \n简单来说，如果你有一份购物清单并且你正在商店里。你会从列表的顶部开始并找到那个物品。\n\n当你拿到那个物品后，你会再次查看列表，并跳转到列表上下一个最近的物品，直到你到达列表末尾并来到收银台。\n\
    \n我希望你能看清我所描述的图景和模式。同样的规则也适用于计算机语言。你有一组规则或一个像杂货店那样的列表。根据你从该列表做出的选择，将决定你在商店里的交互互动方式。\n\
    \n编程也是如此。用户在运行你的程序时所做出的选择将导致你的程序产生不同的响应。\n\n### 我们是如何编写程序的？\n\n编写程序非常简单。你可以使用任何语言，并使用如记事本（notepad）之类的程序来编写程序。你不想使用像\
    \ Microsoft Word 这样的程序，因为这些程序会加入自己的代码和信息，无法创建一个干净的文件。\n\n如果你喜欢视觉化界面，大多数编程语言都有所谓的\
    \ GUI 或图形用户界面。这些程序让开发程序变得更加简单和简洁。\n\n### 我可以在程序中制作什么？\n\n你可以在程序中制作你能想象到的任何东西。你需要了解的主要领域是：你想制作什么、你想从哪里开始、你想让用户做什么以及最终结果会是什么。例如，许多程序员都是从“Hello\
    \ World”示例开始的。\n\n如果你已经编写了一段时间的程序，你会发现这个例子随处可见。\n\n这个程序本身是一个非常没用的程序，但它向你展示了编程的基础和根基，并让你能够用你选择的语言看到程序是如何函数的。\n\
    \n然而，在开发程序时，某些语言被设计和开发用于执行特定功能。\n\n例如，JavaScript 是为 Web 应用程序和 Web 功能设计的。相反，Visual\
    \ Basic 更多是为办公和桌面应用程序设计的。\n\n你可以用 Visual Basic 开发 Web 应用程序，但有很多任务是你必须完成，就像你在桌面应用程序中使用\
    \ JavaScript 一样，你必须进行大量的底层编程才能让东西运行。这仅仅是因为它们的设计初衷并不是在另一种环境中运行。\n\n这就是为什么有这么多不同的语言供你选择。很棒的一是，如果你学习了其中一种语言的基础，你就能看到并识别出多种语言之间的相似之处，并轻松学会它们。\n\
    \n### 规划你的程序\n\n当你进入编程时，你会想要从头到尾规划你的程序。现在你可以对事物进行更改，但如果你有一个基本的想法和一个想要遵循的路径，你的编程努力将获得更大的成果。\n\
    \n### 代码复用\n\n当你编写一段时间的程序后，你很快就会发现你在程序中使用大量相同的代码。当你开始开发时，一个主意是建立自己的代码数据库，可以在其他项目中复用。这是一个良好的编程习惯和实践。你不希望每次写东西都重新发明轮子。\n\
    \n### 避免黄色代码\n\n编程社区中的一个术语是“黄色代码”。这是那些杂乱且充满 Bug 的代码。我们称之为黄色代码，是因为它的用途就像尿液一样。在编写程序时，遵循逻辑路径并在编码之前考虑问题。从长期来看，这将节省你的时间和和麻烦。\n\
    \n### 为你的代码编写注释\n\n人们在编写代码时犯的最大错误之一是不为代码编写注释。当你开始编写大量代码时，它们会开始混合在一起，你不知道一个函数何时结束，另一个过程何时开始。\n\
    \n当你为代码编写注释时，你是是为了自己。你可以在代码的任何地方使用注释，当你需要更改或修复问题时，你会很容易知道该去哪里、你结束在哪里以及你想要实现什么想法。所以，注释一切！\n\
    \n### 开发你自己的风格\n\n编程是一种艺术形式。当你编写代码时，你正在编写别人也在写的内容，但你是用自己的风格来写的。\n\n当你开发出出色的程序时，其他程序员会查看你的代码，并对其简洁和高效赞不绝口。我知道这听起来很滑很蠢，但这是一个事实。你可以因为你编写代码的方式而闻名。\n\
    \n### 持续改进\n\n无论你做什么或写了什么，你都可以改进它。当开发出新技术以及语言中开发出新的基础时，你会想要使用这些来改进现有的工作，使其更简洁、更高效。\n\
    \n这就是编程的基础。剩下的只是学习如何阅读和编写这种语言。在下一章中，我们将开始讨论 JavaScript，你可以用它做什么，并让你开始编写第一组程序。\n\
    \n"
