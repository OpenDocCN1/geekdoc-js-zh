  md: "# Commenting your code\n\nNow that you see how a program is structured and\
    \ what will happen when you put code\ntogether with functions, variables and calls\
    \ you will begin to build fairly large programs.\nOne thing that you will need\
    \ to do is comment your code. Commenting is very important\nfor reasons.\n\nFirst\
    \ of all you can keep track of notes that you want to add to your program such\
    \ as\nfeatures, functions and more. You will at some point want to try different\
    \ blocks of code\n and don't delete what you already written so adding comments\
    \ or\ncommenting out that block of code will be of great use.\n\nWhen you write\
    \ a comment is not read by the web browser. All comments are good for\na your\
    \ reference points when looking over your code. When writing a comment you\nseveral\
    \ different options.\n\nThe first is the block comment. The block comment will\
    \ block out all the text that is\nwithin the block. To create a block comment\
    \ you will write the following code /* */\nEverything in between will be your\
    \ comment. So your comment would look like this.\n\n/* This is my commented text\n\
    \nI hope you like my comments on this book\n\nIt is a pleasure to write code for\
    \ you today\n\n/*\n\nEverything that you write within these brackets will be for\
    \ your eyes only. With this type\nof commenting your code you can write on multiple\
    \ lines which is a great way to make readable text.\n// This is used for one line\
    \ commenting\n\nWhen it comes to short comments you will want to use the // at\
    \ the start of your comment.\nThis will work for comments that are short and fit\
    \ on one line. If you have comments\nt go over more than one line you will want\
    \ to use the block comment.\n\nWhere do I comment my code?\n\nWhen it comes to\
    \ commenting code you want to comment your code in specific key areas.\nFor example\
    \ you never to comment in front of the code you are writing. If you are\ngoing\
    \ to write comments before code you want to do it above your code and not on the\n\
    same line as your code. Here is an example\n\n/*\n\nThis is a program will keep\
    \ track of my diet and my families diet. It was written on\nOctober 1st 1999 and\
    \ was written by John Doe\n\n/*\n\n```\n<doctype html>\n```"
