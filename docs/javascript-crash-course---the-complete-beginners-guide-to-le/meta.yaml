  md: '# Conclusion


    Well there you go. This is a basic outline and look at the Javascript programming
    language. As you can see form the example that we talked about and the way that
    we have written our code there is a lot that we can do to create some great functionality
    and features in our software.


    From this point forward it will be your job to practice writing code, seeing what
    results you get and what cool things you can create. When starting to program
    it is highly suggested that you start small and develop small pieces and parts
    as you go.


    Don''t jump into the Javascript language or any language for that matter and expect
    to build the next million dollar application. If you think like that then you
    will not achieve anything. You want to start small, develop small pockets of reusable
    code and build off features and functions that others are using.


    Learning to program in Javascript may seem like a daunting task. It is true that
    there will be a learning curve and there will be times that you get frustrated
    and just don''t know what it is you want to do or why things don''t work. This
    is why going slow and commenting your code every step of the way is vital to your
    success.


    And finally don''t be afraid to experiment with code. You want to see what you
    can do and what you can''t. You want to see what others have done and try to reproduce
    their results and make it better. Each time you find code that works you will
    want to keep it stored away in your code library. This library will be your friend
    and greatest asset in your career.


    I hope that you have enjoyed this book and you found the information useful. If
    you like the book please leave a review so that others can read your book and
    gain the knowledge that you have gained. And as always take the time to learn
    something new every day.


    To your success!'
  merge: -1
