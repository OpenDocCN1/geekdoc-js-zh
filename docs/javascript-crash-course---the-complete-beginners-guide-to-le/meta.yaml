    \ in the function. So onclick=\"subs()\" which is the name of the function.\n\n\
    When it comes to programming it is a simple matter of knowing the flow of your\
    \ program, what you want the user to do, what will happen when the user performs\
    \ an action and what error protection you can put into place when something goes\
    \ wrong.\n\n# Data Types\n\nWhen working with Javascript and other programming\
    \ languages you will have several different components that you can work with.\
    \ Here are a list of some of them and what they do.\n\n- Numbers, eg. 123, 120.50\
    \ etc.\n- Strings of text e.g. “This text string” etc.\n- Boolean e.g. true or\
    \ false.\n\n## Writing variables\n\nVariables are placeholders when it comes to\
    \ programming. As you saw in the example we created several different variables\
    \ to contain the information for our users.\n\n```\nvar myList\n```\n\nvariables\
    \ are defined with the var statement in front of them. So var myAddress or var\
    \ myValue are all acceptable. When writing variables you can have pretty much\
    \ anything you want but you will want to keep to what is known as a naming convention.\n\
    \nA naming convention is a standard way of doing things. When you practice naming\
    \ conventions you write your code the same way throughout the program. If you\
    \ write a variable with a $ in front of it then you need to do this for all of\
    \ your variables. If you write a variable with camel case which is myAddress then\
    \ you will want to keep this throughout.\n\n# Keeping your code readable\n\nWhen\
    \ you are writing your code you want to keep it as readable as possible. This\
    \ is needed so that anyone that reads your code will know what you are doing and\
    \ how the flow of your program will go. If you start to design messy code and\
    \ don’t comment on what you are doing going back to fix a bug or if another programmer\
    \ needs to go back and edit your code it will be very hard for them to know what\
    \ is going on if your code is all jumbled, uncommented and just crap.\n\nWhen\
    \ it comes to programming Javascript or any other language for that matter you\
    \ will need to develop your very own programming style. This style will soon become\
    \ your unique signature and like stated earlier you will be the envy of the development\
    \ community.\n\n# Using libraries and prewritten code\n\nEarlier I stated that\
    \ you should not use libraries and prewritten code until you have a basic understanding\
    \ of how javascript works. Now that you have a basic understanding you can go\
    \ and find cool libraries and other programming examples and see what people are\
    \ doing and how they write their code.\n\nWhen looking at their code you will\
    \ want to take notes on their programming style. You will want to see how they\
    \ comment their code, what variables they use, how they structure their functions.\
    \ Learning from others is a great way to learn.\n\n# Showing off your code\n\n\
    When learning to program you will want to show off your code as much as possible.\
    \ When it comes to programming there really isn't a big secret in how programs\
    \ are made at least at your level of development.\n\nWhen you show off your code\
    \ you can get feedback and suggestions on how to tighten up your code and make\
    \ it more functional and user friendly. Don’t be afraid of comments and suggestions.\
    \ This is a learning experience and something that you should take full advantage\
    \ of.\n\n# Commenting your code\n\nNow that you see how a program is structured\
    \ and what will happen when you put code together with functions, variables and\
    \ calls you will begin to build fairly large programs.\nOne thing that you will\
    \ need to do is comment your code. Commenting is very important for reasons.\n\
    \nFirst of all you can keep track of notes that you want to add to your program\
    \ such as features, functions and more. You will at some point want to try different\
    \ blocks of code and don't delete what you already written so adding comments\
    \ or commenting out that block of code will be of great use.\n\nWhen you write\
    \ a comment is not read by the web browser. All comments are good for your reference\
    \ points when looking over your code. When writing a comment you have several\
    \ different options.\n\nThe first is the block comment. The block comment will\
    \ block out all the text that is within the block. To create a block comment you\
    \ will write the following code `/* */`. Everything in between will be your comment.\
    \ So your comment would look like this.\n\n```\n/* This is my commented text\n\
    \nI hope you like my comments on this book\n\nIt is a pleasure to write code for\
    \ you today\n*/\n```\n\nEverything that you write within these brackets will be\
    \ for your eyes only. With this type of commenting your code you can write on\
    \ multiple lines which is a great way to make readable text. \n\n// This is used\
    \ for one line commenting\n\nWhen it comes to short comments you will want to\
    \ use the `//` at the start of your comment. This will work for comments that\
    \ are short and fit on one line. If you have comments to go over more than one\
    \ line you will want to use the block comment.\n\nWhere do I comment my code?\n\
    \nWhen it comes to commenting code you want to comment your code in specific key\
    \ areas. For example you never want to comment in front of the code you are writing.\
    \ If you are going to write comments before code you want to do it above your\
    \ code and not on the same line as your code. Here is an example:\n\n```javascript\n\
    /*\nThis is a program will keep track of\n*/\n```\n\n```html\n<!doctype html>\n\
    <html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Test</title>\n<script\
    \ type=\"text/javascript\">\nfunction subs() {\n  var myValue = document.getElementById('TextBox').value;\n\
    \n  if (myValue.length == 0) {\n    alert('Please enter a value!');\n    return;\n\
    \  }\n  var myTitle = document.getElementById('title');\n  myTitle.innerHTML =\
    \ myValue;\n}\n</script>\n</head>\n<body>\n<h1 id=\"title\">Test</h1>\n\n<input\
    \ type=\"text\" id=\"TextBox\" />\n<input type=\"submit\" value=\"Click Me\" onclick=\"\
    subs()\" />\n</body>\n</html>\n```\n\nOne thing that you will need to do is comment\
    \ like this:\n// myTitle.innerHTML = myValue\nWhen it comes to short comments\
    \ you will want to use the //... you are trying out something new but just remember\
