    tuple. But you can remove the entire tuple using del statement.


    >>> tuple 1 = ( 1 , "HI " , 2 , 45.6 5 )


    >>>


    >>> de l tuple1


    >>> tuple1


    Traceback (most recent call last):


      File "<stdin>" , line 1 , in <module>


    NameErro r : name ''tuple1'' is not defined


    Observe the output, an exception raised; this is because after deletion, tuple
    does not exist any more.


    # Python: Class Vs Instance variables


    Class variables are associated with class and available to all the instances (objects)
    of the class, where as instance variables are unique to objects, used to uniquely
    identify the object.


    Employee.py


    class Employee :


      """ Blue print for all employees """


      # Class level variables


    noOfEmployees = 0


    organization = "abcde corporation"


      def __init__ ( self , id =- 1 , firstName = "Nil" , lastName = "Nil" ):


      self . id = - 1


      self . firstName = firstName


      self . lastName = lastName


      Employee . noOfEmployees += 1


      def displayEmployee ( self ):


      print ( self . id, self . firstName, self . lastName)


    emp1 = Employee( id = 1 , firstName = "Hari Krishna" , lastName = "Gurram" )


    emp1 . displayEmployee()


    print ( "Total Employees : " , Employe e . noOfEmployees)


    print ( "Organization : " , Employe e . organization)


    emp2 = Employee( id = 3 , firstName = "PTR" )


    emp2 . displayEmployee()


    print ( "Total Employees : " , Employe e . noOfEmployees)


    print ( "Organization : " , Employe e . organization)


    $ python3 Employee.py


    -1 Hari Krishna Gurram


    Total Employees :  1


    Organization :  abcde corporation


    -1 PTR Nil


    Total Employees :  2


    Organization :  abcde corporation


    # Python: Inheritance


    Inheritance is the concept of re usability.


    Object of one class can get the properties and methods of object of another class
    by using inheritance.


    Syntax


    class DerivedClassName (BaseClassName1, BaseClassName2 ... BaseClassNameN):


        < statement - 1 >


        .


        .


        .


        < statement - N >


    inheritance.py


    class Parent :


      def printLastName ( self ):


      print ( "Gurram" )


      def printPermAddress ( self ):


      print ( "State : Andhra Pradesh" )


      print ( "Country : India" )


    class Child (Parent):


      def printName ( self ):


      print ( "Hari Krishna Gurram" )


    child1 = Child()


    child1 . printName()


    child1 . printLastName()


    child1 . printPermAddress()


    $ python3 inheritance.py


    Hari Krishna Gurram


    Gurram


    State : Andhra Pradesh


    Country : India


    Observe above program, two classes parent and child are defined. Parent class
    defines two methods printLastName, printPermAddress.


    Child class defines one method printName.


    Child class inheriting the methods printLastName, printPermAddress from parent
    class.


    Overriding the methods of Parent class


    You can override the properties, methods of parent class in child class.


    For example, following application overrides ‘printPermAddress’ method of Parent
    class.


    inheritance.py


    class Parent :


      def printLastName ( self ):


      print ( "Gurram" )


      def printPermAddress ( self ):


      print ( "State : Andhra Pradesh" )


      print ( "Country : India" )


    class Child (Parent):


      def printName ( self ):


      print ( "Hari Krishna" )


      def printPermAddress ( self ):


      print ( "City : Bangalore" )


      print ( "State : Karnataka" )


      print ( "Country : India" )


    child1 = Child()


    child1 . printName()


    child1 . printLastName()


    child1 . printPermAddress()


    $ python3 inheritance.py


    Hari Krishna


    Gurram


    City : Bangalore


    State : Karnataka


    Country : India


    # Python: Exceptions


    Exception is an event that disrupts the normal flow of execution.


    Even though statements in your program are syntactically correct, they may cause
    an error.


    >>> 10 / 0


    Traceback (most recent call last):


      File "<stdin>" , line 1 , in <module>


    ZeroDivisionErro r : division by zero


    >>>


    >>> tempLis t = []


    >>> tempList [ 2 0 ]


    Traceback (most recent call last):


      File "<stdin>" , line 1 , in <module>


    IndexErro r : list index out of range


    Observer above snippet, ‘10/0’ causes ZeroDivisionError. When program tries to
    access 20 th  element of tempList it causes IndexError.


    # Python: Handling Exceptions


    Python provide keywords try, except to handle exceptions.


    test.py


    while True :


      try :


      x = int ( input ( "Enter input " ))


      print (x)


      break ;


      except ValueError :


      print ( "Please enter valid number" )


    $ python3 test.py


    Enter input an


    Please enter valid number


    Enter input ana


    Please enter valid number


    Enter input ptr


    Please enter valid number


    Enter input 10


    10


    Try block can be followed by multiple except clauses


    test.py


    while True :


      try :


      x = int ( input ( "Enter divisor " ))


      y = int ( input ( "Enter dividend " ))


      print (x / y)


      break ;


      except ValueError :


      print ( "Please enter valid number" )


      except ZeroDivisionError :


      print ( "y should be non zero" )


    $ python3 test.py


    Enter divisor 2


    Enter dividend 0


    y should be non zero


    Enter divisor 4


    Enter dividend 0


    y should be non zero


    Enter divisor 4


    Enter dividend 2


    2.0


    Handling multiple exceptions in single except clause


    An except clause can catch more than one exception.


    For example ‘except (ValueError, ZeroDivisionError)’ can handle both ValueError
    and ZeroDivisionError.


    test.py


    while True :


      try :


      x = int ( input ( "Enter divisor " ))


      y = int ( input ( "Enter dividend " ))


      print (x / y)


      break ;


      except ( ValueError , ZeroDivisionError ):'
