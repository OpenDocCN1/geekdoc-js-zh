    \ arra1 = str.split('');\n  var result = '';\n  var ctr = 0;\n  for (var x = 0;\
    \ x < arra1.length; x++) {\n    ctr = 0;\n    for (var y = 0; y < arra1.length;\
    \ y++) {\n      if (arra1[x] === arra1[y]) {\n        ctr+= 1;\n      }\n    }\n\
    \    if (ctr < 2) {\n      result = arra1[x];\n      break;\n    }\n  }\n  return\
