    # LEARN PYTHON QUICKLY

    ## CODING FOR BEGINNERS WITH HANDS ON PROJECTS

    BY J J TAM


    Well is almost 5 years I started my career, I love to work in Java, and explore
    source packages. Now day I felt bored to work in same language so want learn new
    language, one my friend suggested me to learn python. Immediately thought, why
    should learn python? Following are some of the reasons that forced me to learn:


    a. Python is open source and available on Windows, Mac OS, and Unix systems. You
    can download and work with python for free.

    b. Python is fun to experiment and easy learn. Python provides interpreter that
    can be used interactively, which makes it easy to experiment with features of
    the language.

    c. You can extend the python interpreter with new functions and data types implemented
    in C or C++.

    d. Python improves developer productivity many times compared to C, C++ and Java.

    e. No need to compile python program, it runs immediately after development.

    f. We can easily port python project from one platform to another (Of course Java
    also provides this feature).

    g. Rich in library. Many third party source libraries are available for logging,
    web development (Django — the popular open source web application framework written
    in Python), networking, database access etc.

    h. Python has very great community, whatever the problem you faced in python,
    you will get help.


    # Python: Hello World program

    Open any text editor and copy the statement `print (''hello world'')` and save
    the file name as `hello.py`.


    ```python

    print (''hello world'')

    ```


    Open terminal (or command prompt), use the command `python3 hello.py` to run the
    file `hello.py`. You will get output like below:


    ```

    $ python3 hello.py

    hello world

    ```


    ### What happens when you instruct python to run your script?

    Python first compiles your source code to byte code and sends it to python virtual
    machine (`PVM`). Byte code is the platform independent representation of your
    source code. PVM reads the byte code one by one and execute them.


    ![](https://2.blogspot.com/-4SrPn1e0H1A/VmFSCiufP1I/AAAAAAAACtw/bnSNuricpw/s400/python%2Bexecution%2Bprocess.png](Image00000.jpg)


    **Note:** Byte code is not machine understandable code, it is python specific
    representation.


    # Python interactive command line

    Open command prompt (or terminal) and type `python3` command. It opens python
    interactive session.


    ```

    $ python3

    Python 3.5.0 (v3.5.0:374f501f467, Sep 12 2015, 11:00:19)

    GCC 4.2.1 (Apple Inc. build 5666) (dot 3) on darwin

    ```


    Type `help`, `copyright`, `credits` or `license` for more information.


    ### How to exit from python interpreter

    On Windows, a `Ctrl-Z` gets you out of this session; on Unix, try `Ctrl-D` instead.
    Another way is simply call the `quit()` function to quit from python.


    ```

    $ python3

    Python 3.5.0 (v3.5.0:374f501f467, Sep 12 2015, 11:00:19)

    GCC 4.2.1 (Apple Inc. build 5666) (dot 3) on darwin

    >>> quit()

    ```


    You can type any statement (or) expressions in python interpreter, interpreter
    execute those statements and gives you the result.


    ```

    >>> 10+20

    30

    >>> 20*20

    400

    >>> print(''Hello World'')

    Hello World

    ```


    **Note:** On Unix, the Python 3.x interpreter is not installed by default with
    name `python`, so that it does not conflict with other installed Python 2.x executable.


    # Python: Operators

    An operator is a symbol, which perform an operation. Following are the operators
    that python supports:

    - Arithmetic Operators

    - Relational Operators

    - Assignment Operators

    - Logical Operators

    - Bitwise Operators

    - Membership Operators

    - Identity Operators


    # Arithmetic Operators in python

    Following are the arithmetic operators supported by python.


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | + | Addition | `2+3` |

    | - | Subtraction | `2-3` |

    | * | Multiplication | `2*3` |

    | / | Division always returns a float value. To get only integer result use `//`.
    | `2/3` returns `0.6666666666666666` |

    | // | Floor division discards the fractional part | `2//3` returns `0` |

    | % | Returns the remainder of the division. | `2%3` |

    | ** | Power | `2**3` returns `2 power 3 = 8` |

