    \ 列表\n\n 列表是用逗号分隔的值组。\n```python\n>>> primes = [ 2 , 3 , 5 , 7 , 11 , 13 , 17\
    \ , 19 , 23 ]\n>>> [2, 3, 5, 7, 11, 13, 17, 19, 23]\n```\n`primes` 是包含质数的列表。\n\
    ```python\n>>> students = [ \"Hari \" , \"Krishna \" , \"Ravi \" ]\n>>> ['Hari',\
    \ 'Krishna', 'Ravi']\n```\n`students` 是包含所有名字的列表。\n```python\n>>> objects = [\
    \ 1 , 3 , \"Hello\" , 10 , 23 ]\n>>> [1, 3, 'Hello', 10, 23]\n```\n列表可以包含任何类型的数据。\n\
    ```python\n>>> numbers = [ 1 , 3 , 'Hello' , 10 , 23 ]\n>>> [1, 3, 'Hello', 10,\
    \ 23]\n```\n使用索引访问列表元素。\n```python\n>>> objects = [ 1 , 3 , 'Hello' , 10 , 23\
    \ ]\n>>> [1, 3, 'Hello', 10, 23]\n>>> objects[ 0 ]\n1\n>>> objects[ 1 ]\n3\n```\n\
    `objects[0]` 返回列表的第一个元素。`objects[1]` 返回列表的第二个元素。负索引也用于访问列表元素。\n```python\n>>>\
    \ objects = [ 1 , 3 , 'Hello' , 10 , 23 ]\n>>> [1, 3, 'Hello', 10, 23]\n>>> objects[\
    \ -1 ]\n23\n>>> objects[ -3 ]\n3\n```\n\n### 切片\n切片用于获取子列表。\n\n| 示例 | 描述 |\n|\
    \ :--- | :--- |\n| `list[start:end]` | 返回从 `start`（包含）到 `end`（不包含）的子列表。 |\n| `list[:end]`\
    \ | 返回从索引 0（包含）到 `end`（不包含）的子列表。 |\n| `list[start:]` | 返回从 `start` 到结束的子列表。 |\n\
    | `list[-2:]` | 返回倒第二个到结束的列表。 |\n\n```python\n>>> objects = [ 1 , 3 , 'Hello'\
    \ , 10 , 23 ]\n>>> [1, 3, 'Hello', 10, 23]\n>>> objects[ -1 ]\n23\n>>> objects[\
    \ -3 ]\n[1, 3, 'Hello', 10, 23]\n>>> objects[:]\n[1, 3, 'Hello', 10, 23]\n>>>\
    \ objects[ 2 :]\n['Hello', 10, 23]\n>>> objects[ : 3 ]\n[1, 3, 'Hello']\n```\n\
    \n### 合并两个列表\n`+` 运算符用于合并两个列表。\n```python\n>>> even = [ 2 , 4 , 6 , 8 , 10 ]\n\
    >>> odd = [ 1 , 3 , 5 , 7 , 9 ]\n>>> numbers = even + odd\n>>> [2, 4, 6, 8, 10,\
    \ 1, 3, 5, 7, 9]\n```\n列表是可变的，你可以更改列表的值。\n```python\n>>> numbers = [ 2 , 4 , 6\
    \ , 8 , 10 , 1 , 3 , 5 , 7 , 9 ]\n>>> numbers[ 0 ] = 12\n>>> numbers[ 1 ] = 14\n\
    >>> [12, 14, 6, 8, 10, 1, 3, 5, 7, 9]\n```\n\n### 向列表末尾添加元素\n列表提供了 `append` 方法向列表末尾添加新元素。\n\
    ```python\n>>> numbers = [ 12 , 14 , 6 , 8 , 10 , 1 , 3 , 5 , 7 , 9 ]\n>>> numbers.append(\
    \ 11 )\n>>> numbers.append( 13 )\n>>> [12, 14, 6, 8, 10, 1, 3, 5, 7, 9, 11, 13]\n\
    ```\n\n### 切片赋值\n如果你想替换列表中的元素序列，可以使用切片符号。\n```python\nnumbers[2:5] = [21, 22,\
    \ 23]\n```\n上述语句将索引 2, 3, 4 处的元素替换为 21, 22, 23。\n```python\nnumbers[:] = []\n\
    ```\n上述语句通过将所有元素替换为空列表来清空列表。\n```python\n>>> numbers = [ 12 , 14 , 6 , 8 , 10\
    \ , 1 , 3 , 5 , 7 , 9 ]\n>>> numbers[2:5] = [21, 22, 23]\n>>> [12, 14, 21, 22,\
    \ 23, 1, 3, 5, 7, 9]\n>>> numbers[:] = []\n>>> []\n```\n\n### 获取列表长度\n使用 `len`\
    \ 函数可以获取列表的长度。\n```python\n>>> vowels = ['a', 'e', 'i', 'o', 'u']\n>>> len(vowels)\n\
    5\n```\n\n### 嵌套列表\n列表可以嵌套在其他列表中。例如，在下面的示例中，`numbers` 包含 3 个列表，第一个列表表示奇数，第二个列表表示偶数，第三个列表表示质数。\n\
    ```python\n>>> numbers = [ [ 1 , 3 , 5 , 7 ], [ 2 , 4 , 6 , 8 ], [ 2 , 3 , 5 ,\
    \ 7 , 11 ]]\n>>> [[1, 3, 5, 7], [2, 4, 6, 8], [2, 3, 5, 7, 11]]\n>>> numbers[\
    \ 0 ]\n[1, 3, 5, 7]\n>>> numbers[ 1 ]\n[2, 4, 6, 8]\n>>> numbers[ 2 ]\n[2, 3,\
    \ 5, 7, 11]\n>>> len(numbers)\n3\n>>> len(numbers[ 0 ])\n4\n>>> len(numbers[ 1\
    \ ])\n4\n>>> len(numbers[ 2 ])\n5\n>>> numbers[ 0 ] [ 1 ] = 9\n>>> numbers[ 1\
    \ ] [ 1 : 4 ] = [ 10 , 12 , 14 ]\n>>> [[1, 9, 5, 7], [2, 10, 12, 14], [2, 3, 5,\
    \ 7, 11]]\n```\n\n"
- fmt: "\n# Differences between tuple and list\n\n- `List` is mutable, whereas `tuple`\
    \ is immutable.\n- `Tuple` can contain heterogeneous data, whereas `list` usually\
    \ contains homogeneous data.\n\n`test.py`\n```python\nemployee e = ( 1 , \"Hari\
    \ Krihsna \", \"Gurram \", 12345.678 )\nprint(employee)\nprint(employee[0])\n\
    print(employee[1])\nprint(employee[2])\nprint(employee[3])\n```\n```bash\n$ python3\
    \ test.py\n(1, 'Hari Krihsna', 'Gurram', 12345.678)\n1\nHari Krihsna\nGurram\n\
    12345.678\n```\n\nAs you observe the above example, elements in `tuple` are enclosed\
    \ in parenthesis. Even though tuples are immutable, you can create tuples which\
    \ contain mutable objects, such as lists.\n\n`test.py`\n```python\nemployee e\
    \ = ( 1 , [])\nprint(employee)\nemployee[1].append(2)\nemployee[1].append(4)\n\
    employee[1].append(6)\nprint(employee)\n```\n```bash\n$ python3 test.py\n(1, [])\n\
    (1, [2, 4, 6])\n```\n\n# Packing and unpacking\n\nYou can define tuples without\
    \ using parenthesis.\nFor example:\n```python\nemployee=1, \"Hari Krihsna\", \"\
    Gurram\", 12345.678\n```\nThe above one is an example of tuple packing.\n\n```python\n\
    id, firstName, lastName, salary = employee\n```\nThe above one is an example of\
    \ tuple unpacking. Sequence unpacking requires that there are as many variables\
    \ on the left side of the equals sign as there are elements in the sequence.\n\
    \n`test.py`\n```python\nemployee e = 1 , \"Hari Krihsna \", \"Gurram \", 12345.678\n\
    id, firstName, lastName, salary = employee\nprint(id)\nprint(firstName)\nprint(lastName)\n\
    print(salary)\n```\n```bash\n$ python3 test.py\n1\nHari Krihsna\nGurram\n12345.678\n\
    ```\n\n# Concatenate tuples\n\nThe `+` operator is used to concatenate tuples.\n\
    \n```python\n>>> tuple_1 = ( 1 , \"HI \", 2 , 45.65 )\n>>> tuple_2 = ( \"abcdef\
    \ \", 54 , 67 )\n>>> tuple_3 = tuple_1 + tuple_2\n>>> tuple_3\n( 1 , 'HI' , 2\
    \ , 45.65 , 'abcdef' , 54 , 67 )\n```\n\n# Slicing\n\nJust like lists, you can\
    \ access tuples using slice notation.\n\n| Example | Description |\n| :--- | :---\
    \ |\n| `tuple[start:end]` | Returns `tuple` from index `start` (included) to end\
    \ index (excluded). |\n| `tuple[:end]` | Returns `tuple` from index 0 (included)\
    \ to end index (excluded). |\n| `tuple[start:]` | Return `tuple` from index `start`\
    \ to till end. |\n| `tuple[-2:]` | Return elements from 2nd last to end. |\n\n\
    ```python\n>>> tuple1\n(1, 'HI', 2, 45.65)\n>>> tuple1[0:]\n(1, 'HI', 2, 45.65)\n\
    >>> tuple1[:]\n(1, 'HI', 2, 45.65)\n>>> tuple1[:3]\n(1, 'HI', 2)\n>>> tuple1[2:5]\n\
    (2, 45.65)\n```\n\n# Repeat tuple elements\n\n`*` operator is used to repeat the\
    \ elements of `tuple`.\n\n```python\n>>> tuple1\n(1, 'HI', 2, 45.65)\n>>> tuple1\
    \ * 3\n(1, 'HI', 2, 45.65, 1, 'HI', 2, 45.65, 1, 'HI', 2, 45.65)\n```\n\n# Remove\
    \ tuple elements\n\nAs I said, tuples are immutable so it is not possible to remove\
    \ elements from `tuple`. But you can remove the entire tuple using the `del` statement.\n\
    \n```python\n>>> tuple1 = ( 1 , \"HI \", 2 , 45.65 )\n>>> del tuple1\nTraceback\
    \ (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nNameError:\
    \ 'tuple1' is not defined\n```\nObserve the output, an exception raised because\
    \ after deletion, `tuple1` does not exist anymore.\n\n# Python: Class Vs Instance\
    \ variables\n\nClass variables are associated with class and available to all\
    \ instances (objects) of the class, whereas instance variables are unique to objects\
    \ used to identify the object.\n\n`Employee.py`\n```python\nclass Employee :\n\
    \    \"\"\" Class for all employees \"\"\"\n    noOfEmployees = 0\n    organization\
    \ = \"abc corporation\"\n\n    def __init__( self , id , firstName , lastName\
    \ ):\n        self.id = id\n        self.firstName = firstName\n        self.lastName\
    \ = lastName\n        Employee.noOfEmployees += 1\n\n    def displayEmployee (\
    \ self ):\n        print ( self.id, self.firstName, self.lastName)\n\nemp1 = Employee(\
    \ 1 , \"Hari Krishna\", \"Gurram\" )\nemp1.displayEmployee()\nprint (\"Total Employees\
    \ \", Employee.noOfEmployees)\nprint (\"Organization \", Employee.organization)\n\
    \nemp2 = Employee( 3 , \"PTR\", \"Nil\" )\nemp2.displayEmployee()\nprint (\"Total\
    \ Employees \", Employee.noOfEmployees)\nprint (\"Organization \", Employee.organization)\n\
    ```\n```bash\n$ python3 Employee.py\n1 Hari Krishna Gurram\nTotal Employees :\
    \ 1\nOrganization : abc corporation\n3 PTR Nil\nTotal Employees : 2\nOrganization\
    \ : abc corporation\n```\n\n# Python: Inheritance\n\nInheritance is the concept\
    \ of reusability. Object of one class can get the properties and methods of object\
    \ of another class using inheritance.\n\n### Syntax\n```python\nclass DerivedClassName\
    \ (BaseClassName1, BaseClassName2 ... BaseClassNameN):\n```\n\n`inheritance.py`\n\
    ```python\nclass Parent :\n    def printLastName ( self ):\n        print ( \"\
    Gurram\" )\n    def printPermAddress ( self ):\n        print ( \"State : Andhra\
    \ Pradesh\" )\n        print ( \"Country : India\" )\n\nclass Child (Parent):\n\
    \    def printName ( self ):\n        print ( \"Hari Krishna Gurram\" )\n\nchild1\
    \ = Child()\nchild1.printName()\nchild1.printLastName()\nchild1.printPermAddress()\n\
    ```\n```bash\n$ python3 inheritance.py\nHari Krishna Gurram\nGurram\nState : Andhra\
    \ Pradesh\nCountry : India\n```\nObserve the above program, two classes `parent`\
    \ and `child` are defined. `Parent` class defines two methods `printLastName`,\
    \ `printPermAddress`. `Child` class defines one method `printName`. `Child` class\
    \ inheriting the methods `printLastName`, `printPermAddress` from `parent` class.\n\
    \n# Overriding the methods of Parent class\n\nYou can override the properties,\
    \ methods of `parent` class in `child` class. For example, the following application\
    \ overrides `printPermAddress` method of `Parent` class.\n\n`inheritance.py`\n\
    ```python\nclass Parent :\n    def printLastName ( self ):\n        print ( \"\
    Gurram\" )\n    def printPermAddress ( self ):\n        print ( \"State : Andhra\
    \ Pradesh\" )\n        print ( \"Country : India\" )\n\nclass Child (Parent):\n\
    \    def printName ( self ):\n        print ( \"Hari Krishna\" )\n    def printPermAddress\
    \ ( self ):\n        print ( \"City : Bangalore\" )\n        print ( \"State :\
    \ Karnataka\" )\n        print ( \"Country : India\" )\n\nchild1 = Child()\nchild1.printName()\n\
    child1.printLastName()\nchild1.printPermAddress()\n```\n```bash\n$ python3 inheritance.py\n\
    Hari Krishna\nGurram\nCity : Bangalore\nState : Karnataka\nCountry : India\n```\n\
    \n# Python: Exceptions\n\nException is an event that disrupts the normal flow\
    \ of execution. Even though statements in your program are syntactically correct,\
    \ they may cause an error.\n\n```python\n>>> 10 / 0\nTraceback (most recent call\
    \ last):\n  File \"<stdin>\", line 1, in <module>\nZeroDivisionError: division\
    \ by zero\n\n>>> tempList = []\n>>> tempList[20]\nTraceback (most recent call\
    \ last):\n  File \"<stdin>\", line 1, in <module>\nIndexError: list index out\
    \ of range\n```\nObserve the above snippet, `10/0` causes `ZeroDivisionError`.\
    \ When program tries to access 20th element of `tempList` it causes `IndexError`.\n\
    \n# Python: Handling Exceptions\n\nPython provide keywords `try`, `except` to\
    \ handle exceptions.\n\n`test.py`\n```python\nwhile True :\n    try :\n      \
    \  x = int ( input ( \"Enter input \" ))\n        print(x)\n        break ;\n\
    \    except ValueError :\n        print (\"Please enter valid number\")\n```\n\
    ```bash\n$ python3 test.py\nEnter input an\nPlease enter valid number\nEnter input\
    \ ana\nPlease enter valid number\nEnter input ptr\nPlease enter valid number\n\
    Enter input 10\n10\n```\n\n`try` block can be followed by multiple `except` clauses.\n\
    \n`test.py`\n```python\nwhile True :\n    try :\n        x = int ( input ( \"\
    Enter divisor \" ))\n        y = int ( input ( \"Enter dividend \" ))\n      \
    \  print(x / y)\n        break ;\n    except ValueError :\n        print (\"Please\
    \ enter valid number\")\n    except ZeroDivisionError :\n        print (\"y should\
    \ be non zero\")\n```\n```bash\n$ python3 test.py\nEnter divisor 2\nEnter dividend\
    \ 0\ny should be non zero\nEnter divisor 4\nEnter dividend 0\ny should be non\
    \ zero\nEnter divisor 4\nEnter dividend 2\n2.0\n```\n\n# Handling multiple exceptions\
    \ in single except clause\n\nAn `except` clause can catch more than one exception.\
    \ For example `except (ValueError, ZeroDivisionError)` can handle both `ValueError`\
    \ and `ZeroDivisionError`.\n\n`test.py`\n```python\nwhile True :\n    try :\n\
    \        x = int ( input ( \"Enter divisor \" ))\n        y = int ( input ( \"\
    Enter dividend \" ))\n        print(x / y)\n        break ;\n    except ( ValueError\
    \ , ZeroDivisionError ):\n```\n"
