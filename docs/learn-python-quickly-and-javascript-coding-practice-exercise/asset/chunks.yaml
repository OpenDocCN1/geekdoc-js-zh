    function find_longest_word(str) {\n  var array1 = str.match(/\\w[a-z]{0,}/gi);\n\
    \  var result = array1[0];\n  for(var x = 1 ; x < array1.length ; x++) {\n   \
    \ if(result.length < array1[x].length) {\n      result = array1[x];\n    }\n \
    \ }\n  return result;\n}\nconsole.log(find_longest_word('Web Development Tutorial'));\n\
    ```\nOUTPUT: Development\n\n#### Explanation\nAssume that `str` equals `@Web Production\
    \ #Tutorial`. When a string is matched against a regular expression, the `match()`\
    \ method is used to obtain the matches. As a result of `str.match(/w[a-z]0,/gi)`,\
    \ `[\"Web\", \"Development\", \"Tutorial\"]` will be returned. The `for` loop\
    \ compares the length of each array element to the previous one and returns the\
    \ longest string. The `length` property is a 32-bit unsigned integer that is always\
    \ numerically greater than the array's highest index.\nSyntax -> `arr.length`\n\
    \n### JavaScript: Counts the number of vowels within a string\n\nExample string:\
    \ `'The quick brown fox'`\nExpected Output: `5`\n\n```javascript\nfunction vowel_count(str1)\
    \ {\n  var vowel_list = 'aeiouAEIOU';\n  var vcount = 0;\n  for(var x = 0; x <\
    \ str1.length ; x++) {\n    if (vowel_list.indexOf(str1[x]) !== -1) {\n      vcount\
    \ += 1;\n    }\n  }\n  return vcount;\n}\nconsole.log(vowel_count(\"The quick\
    \ brown fox\"));\n```\nOUTPUT: 5\n"
