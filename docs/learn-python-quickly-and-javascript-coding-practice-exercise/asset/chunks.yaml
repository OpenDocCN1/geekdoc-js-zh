    - 身份运算符


    # Python 中的算术运算符

    以下是 Python 支持的算术运算符。


    | 运算符 |  | 示例 |

    | :--- | :--- | :--- |

    | + | 加法 | `2+3` |

    | - | 减法 | `2-3` |

    | * | 乘法 | `2*3` |

    | / | 除法始终返回浮点值。要获取整数结果请使用 `//`。 | `2/3` 返回 `0.6666666666666666` |

    | // | 整除丢弃小数部分 | `2//3` 返回 `0` |

    | % | 返回除法的余数。 | `2%3` |

    | ** | 幂 | `2**3` 返回 `2 的 3 次方 = 8` |


