    \n### JavaScript：获取数据类型\n创建一个 JavaScript 函数，接收参数并返回其类型。可能的值：object、boolean、number、string\
    \ 或 undefined。\n\n#### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>检测数据类型</title>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n#### JavaScript 代码\n```javascript\nfunction detect_data_type(value) {\n\
    \  var dtypes = [Function, RegExp, Number, String, Object], x, len;\n  if (typeof\
    \ value === \"object\" || typeof value === \"function\") {\n    for (x = 0, len\
    \ = dtypes.length; x < len; x++) {\n      if (value instanceof dtypes[x]) {\n\
    \        return dtypes[x];\n      }\n    }\n  }\n  return typeof value;\n}\nconsole.log(detect_data_type(12));\n\
    console.log(detect_data_type('w3'));\nconsole.log(detect_data_type(false));\n\
    ```\n\n#### 输出\nnumber\nstring\nBoolean\n\n### JavaScript：获取数组中的第二小和第二大\n\n####\
    \ HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n\
    <title>从数组中获取第二小和第二数字</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n####\
    \ JavaScript 代码\n```javascript\nfunction Second_Greatest_Lowest(arr_num) {\n \
    \ arr_num.sort(function(x, y) {\n    return x - y;\n  });\n  var uniqa = [arr_num[0]];\n\
    \  var result = [];\n  for (var j = 1; j < arr_num.length; j++) {\n    if (arr_num[j\
    \ - 1] !== arr_num[j]) {\n      uniqa.push(arr_num[j]);\n    }\n  }\n  result.push(uniqa[1],\
    \ uniqa[uniqa.length - 2]);\n  return result.join(',');\n}\nconsole.log(Second_Greatest_Lowest([1,\
    \ 2, 3, 4, 5]));\n```\n\n#### 输出\n2,4\n\n### 流程图\n![](img/Image0007.jpg)\n\n###\
