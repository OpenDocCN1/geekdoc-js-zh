  trans: "\n\n# 元组（tuple）与列表（list）的区别\n\n- `List` 是变的，而 `tuple` 是不可变的。\n- `Tuple`\
    \ 可以包含异构数据，而 `list` 通常包含同质数据。\n\n`test.py`\n```python\nemployee e = ( 1 , \"Hari\
    \ Krihsna \", \"Gurram \", 12345.678 )\nprint(employee)\nprint(employee[0])\n\
    print(employee[1])\nprint(employee[2])\nprint(employee[3])\n```\n```bash\n$ python3\
    \ test.py\n(1, 'Hari Krihsna', 'Gurram', 12345.678)\n1\nHari Krihsna\nGurram\n\
    12345.678\n```\n\n通过观察上面的示例，`tuple` 中的元素包含在括号内。尽管元组是不可变的，但你可以创建包含可变对象的元组，例如列表。\n\
    \n`test.py`\n```python\nemployee e = ( 1 , [])\nprint(employee)\nemployee[1].append(2)\n\
    employee[1].append(4)\nemployee[1].append(6)\nprint(employee)\n```\n```bash\n\
    $ python3 test.py\n(1, [])\n(1, [2, 4, 6])\n```\n\n# 打包（Packing）与解包（Unpacking）\n\
    \n你可以在不使用括号定义元组。\n例如：\n```python\nemployee=1, \"Hari Krihsna\", \"Gurram\", 12345.678\n\
    ```\n上面是元组打包的示例。\n\n```python\nid, firstName, lastName, salary = employee\n```\n\
    上面是元组解包的示例。序列解包要求等号左侧的变量数量与序列中的元素数量一致。\n\n`test.py`\n```python\nemployee e = 1\
    \ , \"Hari Krihsna \", \"Gurram \", 12345.678\nid, firstName, lastName, salary\
    \ = employee\nprint(id)\nprint(firstName)\nprint(lastName)\nprint(salary)\n```\n\
    ```bash\n$ python3 test.py\n1\nHari Krihsna\nGurram\n12345.678\n```\n\n# 合并元组（Concatenate\
    \ tuples）\n\n`+` 运算符用于合并元组。\n\n```python\n>>> tuple_1 = ( 1 , \"HI \", 2 , 45.65\
    \ )\n>>> tuple_2 = ( \"abcdef \", 54 , 67 )\n>>> tuple_3 = tuple_1 + tuple_2\n\
    >>> tuple_3\n( 1 , 'HI' , 2 , 45.65 , 'abcdef' , 54 , 67 )\n```\n\n# 切片（Slicing）\n\
    \n和列表一样，你可以使用切片语法访问元组。\n\n| 示例 | 描述 |\n| :--- | :--- |\n| `tuple[start:end]` |\
    \ 返回从索引 `start`（包含）到结束索引（不包含）的 `tuple` |\n| `tuple[:end]` | 返回从索引 0（包含）到结束索引（不包含）的\
    \ `tuple` |\n| `tuple[start:]` | 返回从索引 `start` 到末尾的 `tuple` |\n| `tuple[-2:]`\
    \ | 返回从倒数第二个到末尾的元素 |\n\n```python\n>>> tuple1\n(1, 'HI', 2, 45.65)\n>>> tuple1[0:]\n\
    (1, 'HI', 2, 45.65)\n>>> tuple1[:]\n(1, 'HI', 2, 45.65)\n>>> tuple1[:3]\n(1, 'HI',\
    \ 2)\n>>> tuple1[2:5]\n(2, 45.65)\n```\n\n# 重复元组元素（Repeat tuple elements）\n\n\
    `*` 运算符用于重复 `tuple` 中的元素。\n\n```python\n>>> tuple1\n(1, 'HI', 2, 45.65)\n>>> tuple1\
    \ * 3\n(1, 'HI', 2, 45.65, 1, 'HI', 2, 45.65, 1, 'HI', 2, 45.65)\n```\n\n# 删除元组元素（Remove\
    \ tuple elements）\n\n正如我所说，元组是不可变的，因此无法从 `tuple` 中删除元素。但你可以使用 `del` 语句删除整个元组。\n\
    \n```python\n>>> tuple1 = ( 1 , \"HI \", 2 , 45.65 )\n>>> del tuple1\nTraceback\
    \ (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nNameError:\
    \ 'tuple1' is not defined\n```\n观察输出，引发异常是因为在删除后，`tuple1` 不再存在了。\n\n# Python：类变量与实例变量（Class\
    \ Vs Instance variables）\n\n类变量与类相关，并对类的所有实例（对象）可用，而实例变量是对象唯一的，用于标识该对象。\n\n`Employee.py`\n\
    ```python\nclass Employee :\n    \"\"\" 用于所有员工的类 \"\"\"\n    noOfEmployees = 0\n\
    \    organization = \"abc corporation\"\n\n    def __init__( self , id , firstName\
    \ , lastName ):\n        self.id = id\n        self.firstName = firstName\n  \
    \      self.lastName = lastName\n        Employee.noOfEmployees += 1\n\n    def\
    \ displayEmployee ( self ):\n        print ( self.id, self.firstName, self.lastName)\n\
    \nemp1 = Employee( 1 , \"Hari Krishna\", \"Gurram\" )\nemp1.displayEmployee()\n\
    print (\"Total Employees \", Employee.noOfEmployees)\n```\n\n"
