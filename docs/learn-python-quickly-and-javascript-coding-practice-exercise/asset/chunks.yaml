    \ |\n\n```python\n>>> a = 10\n>>> b = 12\n>>> a == b\nFalse\n>>> a != b\nTrue\n\
    >>> a > b\nFalse\n>>> a >= b\nFalse\n>>> a < b\nTrue\n>>> a <= b\nTrue\n```\n\n\
    # Assignment operators in python\n\nAssignment operators are used to assign value\
    \ to a variable. Following are the assignment operators provided by python.\n\n\
    | Operator | Description |\n| :--- | :--- |\n| `=` | `a=10` assigns `10` to variable\
    \ `a` |\n| `+=` | `a+=10` is same as `a=a+10` |\n| `-=` | `a-=10` is same as `a=a-10`\
    \ |\n| `*=` | `a*=10` is same as `a=a*10` |\n| `/=` | `a/=10` is same as `a=a/10`\
    \ |\n| `//=` | `a//=10` is same as `a=a//10` |\n| `%=%` | `a%=10` is same as `a=a%10`\
    \ |\n| `**=` | `a**=10` is same as `a=a**10` |\n\n```python\n>>> a = 10\n>>> a\n\
    10\n>>> a += 10\n>>> a\n20\n>>> a -= 10\n>>> a\n10\n>>> a *= 10\n>>> a\n100\n\
    >>> a /= 10\n>>> a\n10.0\n>>> a //= 10\n>>> a\n1.0\n>>> a **= 10\n>>> a\n1.0\n\
    ```\n\n## Multiple Assignments\n\nYou can assign values to multiple variables\
    \ simultaneously.\n\n```python\n>>> a, b, c = 10 , 'hello ', 12.345\n>>> a\n10\n\
    >>> b\n'hello'\n>>> c\n12.345\n```\n\n# Logical Operators in python\n\nFollowing\
    \ are the logical operators supported by python.\n\n| Operator | Description |\n\
    | :--- | :--- |\n| `and` | `'a and b'` returns true if both `a`, `b` are true.\
    \ Else false. |\n| `or` | `'a or b'` return false, if both `a` and `b` are false,\
    \ else true. |\n| `not` | `'not a'` Returns True if `a` is false, true otherwise\
    \ |\n\n```python\n>>> a = bool(0)\n>>> b = bool(1)\n>>> a\nFalse\n>>> b\nTrue\n\
    >>> a and b\nFalse\n>>> a or b\nTrue\n>>> not a\nTrue\n>>> not (a and b)\nTrue\n\
    >>> not (a or b)\nFalse\n```\n\n# Bitwise Operators in python\n\nPython supports\
    \ following bitwise operators, to perform wise operations on integers.\n\n| Operator\
    \ | Description |\n| :--- | :--- |\n| `>>` | bitwise right shift |\n| `<<` | bitwise\
    \ left shift |\n| `&` | bitwise and |\n| `^` | Bitwise XOR |\n| `|` | bitwise\
    \ or |\n| `~` | bitwise not |\n\nFollowing, explains bitwise operators clearly.\n\
    \n```python\n>>> a = 2\n>>> a >> 1\n1\n>>> a << 1\n4\n>>> a & 3\n2\n>>> a | 3\n\
    3\n>>> ~ a\n-3\n```\n\n# Membership operators in python\n\nMembership operators\
    \ are used to test whether a value or variable is found in a sequence (string,\
    \ list, tuple, set and dictionary).\n\n| Operator | Description |\n| :--- | :---\
    \ |\n| `in` | Return true if value/variable found in the sequence, else false.\
    \ |\n| `not in` | Return True if value/variable is not found in the sequence,\
