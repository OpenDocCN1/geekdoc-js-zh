    ### 当你指示 Python 运行脚本时发生了什么？

    Python 首先将你的源代码编译为字节码（bytecode），并将其发送到 Python 虚拟机 (`PVM`)。字节码是源代码的平台无关的表示。PVM
    逐个读取字节码并执行它们。


