  \ 应该大于 0\nEnter divisor aa\n请输入有效数字（或）y 应该大于 0\nEnter divisor 2\nEnter dividend\
  \ 4\n0.5\n```\n\n最后一个 `except` 子句可以省略异常名称。它被用作全局异常处理器。\n\n`test.py`\n```python\n\
  while True :\n  try :\n    tempList = []\n    print (tempList[ 10 ])\n    break\n\
  \  except ValueError :\n  print ( \"请输入有效数字\" )\n  except ZeroDivisionError :\n\
  \  print ( \"y 应该不为零\" )\n  except Exception as inst:\n  print ( \"全局处理器\" , inst)\n\
  \  break\n```\n\n```\n$ python3 test.py\nGlobal handler list index out of range\n\
  ```\n\n### try…except…else 子句\n\n`try…except` 语句可以有一个可选的 `else` 子句，它跟在 `except`\
  \ 子句之后。如果 `try` 块没有抛出任何异常，将执行 `else` 子句。\n\n`test.py`\n```python\nwhile True :\n\
  \  try :\n    x = int ( input ( \"输入除数 \" ))\n    y = int ( input ( \"输入被除数 \" ))\n\
  \    print (x / y)\n  except ValueError :\n  print ( \"请输入有效数字\" )\n  except ZeroDivisionError\
  \ :\n  print ( \"y 应该不为零\" )\n  else :\n  print ( \"程序执行成功\" )\n  break\n```\n\n\
  ```\n$ python3 test.py\nEnter divisor 4\nEnter dividend 2\n2.0\nProgram executed\
  \ successfully\n```\n\n### 异常参数\n\n每发生异常时，它都会与一个名为异常参数的变量关联。\n\n`test.py`\n```python\n\
  while True :\n  try :\n    x = int ( input ( \"输入除数 \" ))\n    y = int ( input (\
  \ \"输入被除数 \" ))\n    print (x / y)\n  except ValueError as inst:\n  print(inst)\n\
  \  except ZeroDivisionError as inst:\n  print(inst)\n  else :\n  print ( \"程序执行成功\"\
  \ )\n  break\n```\n\n```\n$ python3 test.py\nEnter divisor qwerty\ninvalid literal\
  \ for int() with base 10: 'qwerty'\nEnter divisor 4\nEnter dividend 0\ndivision\
  \ by zero\nEnter divisor 2\nEnter dividend 4\n0.5\nProgram executed successfully\n\
  ```\n\n`except` 子句可以在异常名称后指定一个变量。该变量将绑定到异常实例，其参数存储在 `instance.args` 中。\n\n`test.py`\n\
  ```python\nwhile True :\n  try :\n    x = int ( input ( \"输入除数 \" ))\n    y = int\
  \ ( input ( \"输入被除数 \" ))\n    if y == 0 :\n      raise Exception (x, y)\n    print\
  \ ( \"x/y = \" ,x / y)\n    break\n  except Exception as inst:\n  arg1, arg2 = inst\
  \ . args\n  print ( \"arg1=\" , arg1)\n  print ( \"arg2=\" , arg2)\n```\n\n```\n\
  $ python3 test.py\nEnter divisor 2\nEnter dividend 0\narg1= 2\narg2= 0\nEnter divisor\
  \ 2\nEnter dividend 4\nx/y =  0.5\n```\n\n如果异常与其关联有参数，这些参数将作为异常消息的最后部分被打印。\n\n`test.py`\n\
  ```python\nwhile True :\n  try :\n    x = int ( input ( \"输入除数 \" ))\n    y = int\
  \ ( input ( \"输入被除数 \" ))\n    if y == 0 :\n      raise Exception (x, y)\n    print\
  \ ( \"x/y = \" ,x / y)\n    break\n  except Exception as inst:\n  print (inst)\n\
  ```\n\n```\n$ python3 test.py\nEnter divisor 2\nEnter dividend 0\n(2, 0)\nEnter\
  \ divisor 2\nEnter dividend 4\nx/y =  0.5\n```\n\n## Python global 关键字\n\n`global`\
  \ 关键字用于从局部上下文中创建/修改全局变量（你也可以在其中声明函数、类等）。\n\n`test.py`\n```python\ndef function1\
  \ ():\n  global data\ndata = \"Hello World\"\n\ndef function2 ():\n  print (data)\n\
  \nfunction1()\nfunction2()\n```\n\n```\n$ python3 test.py\nHello World\n```\n\n\
  观察 `test.py`，尽管 `data` 在 `function1` 中声明，但它被 `function2` 访问。这是因为 `data` 在全局作用域中声明的。\n\
  \n## Python: 获取变量类型\n\n你可以使用 `type()` 函数或 `__class__` 属性获取变量的类型。\n\n```python\n\
  >>> data = [ 1 , 2 , 3 , 4 ]\n>>> type(data)\n<class 'list'>\n>>> data . __class__\n\
  <class 'list'>\n>>>\n>>> data = { 1 : \"hari \" , 2 : \"Krishna \" }\n>>> type(data)\n\
  <class 'dict'>\n>>> data . __class__\n<class 'dict'>\n>>>\n```\n\n### 使用 if 语句检查类型\n\
  \n`data = { 1 : \"hari \" , 2 : \"Krishna \" }`\n\n#### 方法 1\n```python\nif (data\
  \ . __class__ . __name__ == 'dict' ):\n    pass\n```\n\n#### 方法 2\n```python\nif\
  \ type(data) == dict:\n    pass\n```\n\n#### 方法 3\n```python\nif isinstance(data,\
  \ dict):\n    pass\n```\n\n\n\n\n## indexOf() 方法\n\n`indexOf()` 方法返回调用的 `String`\
  \ 对象中指定值第一次出现的索引。如果找不到该值，则返回 `-1`。\n\n语法：\n`str.indexOf(searchValue[, fromIndex])`\n\
  \n参数包括：\n- `searchValue`：要查找的字符串。\n- `fromIndex`（可选）：开始搜索的索引。可以是任何整数。\n\n如果满足 `str.indexOf(searchValue)\
  \ !== -1` 条件，该字符将被计数。\n\n### 流程图\n![](img/Image0003.jpg)\n\n### JavaScript：判断一个数字是否为质数\n\
  \n#### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\"\
  >\n<title>判断数字是否为质数的 JavaScript 程序</title>\n</head>\n<body>\n<form>\n第一个数字：<input\
  \ type=\"text\" id=\"firstNumber\" /><br>\n第二个数字：<input type=\"text\" id=\"secondNumber\"\
