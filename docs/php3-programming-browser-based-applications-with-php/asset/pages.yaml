  md: '# Variables


    # 39


    If you have programmed in Visual Basic, you need to be especially careful when
    naming variables. Just remember that *all scalars begin with a $*, not just strings,
    and the $ starts the name; it doesn''t end it.


    # Tip


    Let''s jump right in and look at some variable names:


    +   *int_page_number*—holds the current page number.


    +   *str_magazine_title*—holds the title of a magazine.


    +   *0-bad variable name. Variable names can''t start with a numeric character.


    I like to use descriptive variable names. To me, *$int_book_number* is better
    than *$booknum* because it is more descriptive. It is generally a good idea to
    stay away from short variable names because longer variable names aid in understanding
    programs. You don''t have a practical limit to the length of a PHP variable, but
    I like to keep them under twenty characters. Anything longer than that increases
    the chances of spelling errors.


    Use descriptive variable names: *int_book_number* is better than *booknum*.


    Now that you know what scalar variable names look like, it''s time to look at
    assigning values to them. Assigning values to a variable is done with the equals
    (=) sign as shown in Listing 3.3.


    # Listing 3.3 *assign_scal.php3*—Using the assignment operator


    ```

    //PHP

    // Assign a value of 46 to a variable

    // called $int_page_number.

    $int_page_number = 46;


    // Assign a string value to a variable

    // called $str_magazine_title.

    $str_magazine_title = ''PHP is good!'';

    ?>

    ```


    This code assigns literal values to the variables. When assigning text literals,
    use single-quoted strings because they are more efficient.


    PHP uses two slashes (//) to begin comments. Any characters after the "//" notation
    is ignored.


    # Note'
