  md: '# Databases and SQL


    Databases store information in a structured format. SQL is a language used to
    define database tables and columns, query databases for information, and update
    information. Together, they make application development possible.'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'The topic of databases is large. You could read about them for a year and still
    not cover all of their facets. Fortunately, you don''t need to be an expert on
    databases in order to use them. This chapter aims to give you just enough information
    to get started.


    Databases are semi-magical programs which let you store information and later
    retrieve that information in a variety of ways. They are semi-magical because
    they save so much time during development. And they seem to be infinitely flexible
    in how data can be defined and queried.


    Note If you haven''t guessed by that last paragraph, I am a huge fan of databases.
    Never attempt to create an Internet application without one.


    It''s interesting that the real complexity of SQL lies in selecting information
    from the database. Specifying which information gets retrieved and how that information
    is presented can be quite convoluted. Fortunately, this chapter looks at the relatively
    simple aspects of SQL. The tricky parts of SQL are saved for Chapter 14, “Real-World
    SQL."


    What kind of information gets stored in databases? Debates still rage about the
    appropriateness of storing large amounts of binary data (like graphic images)
    into databases. Other than that, all types of information are stored—from a list
    of browser types to a hierarchical list of categories.


    # How is Information Different from Data?


    The difference between data and information is that data is disorganized while
    information is organized. Take a look at this example of data:


    Johnson

    David Wilson

    Andrew


    Is this a list of first names? of last names? Is it already sorted? Without organizing
    the data, these and other questions can''t be answered with any sense of authority.


    Here is the same list with a bit of organization applied to it:'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Moving from Information to Databases


    | First Name | Last Name |

    | Andrew Johnson |

    | David Wilson |


    The most obvious change is that columns have been added to indicate the kinds
    of names. Additionally, the names have been sorted alphabetically. We now have
    the answers to all of our questions.


    # Moving from Information to Databases


    Before information can be stored, it needs to be described. Without a description,
    database engines can''t determine the best way of storing the information and,
    more important, they won''t know how to extract information when needed.


    So let''s describe the information used in the previous section. First, we need
    a descriptive term that describes all of the information:


    patient_names


    This moves us from the specific (that is, the names) to the general (all of the
    information). The next step describes the information associated with each patient:


    name_first char(40)

    name_last char(40)


    Each piece of information is called a column, or *field*, in database terminology.
    Therefore, each patient is associated with two column names, name_first and name_last.
    All of the columns, taken together, are a record. And all of the records, taken
    together, are a table:


    | Table: | Patient''s Names |

    | Field 1: | Field 2: |

    | First Name | Last Name |

    | Record 1: | Johnson |

    | Record 2: | Andrew |

    | Record 3: | David | Wilson |'
