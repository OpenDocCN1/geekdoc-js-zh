  md: "# The continue Keyword\n\nThe continue keyword aborts the current iteration\
    \ of a loop and immediately starts the next iteration. In the case of for loops,\
    \ the next iteration starts at the operation expression. Listing 4.4 shows the\
    \ continue keyword in action.\n\n# Listing 4.4 continue.php3—Using the continue\
    \ keyword\n\n```\n<?php\nfor ($index = 0; $index < 5; $index++) {\n    if ($index\
    \ == 3) {\n        continue;\n    }\n    echo \"$index<br>\";\n}\n>\n```\n\nThis\
    \ script displays\n\n+   0\n1\n2\n4\n\nNotice that 3 does not display. The if\
    \ statement within the statement block causes the statement block to be stopped\
    \ and restarted at the operation clause of the for loop. Thus, the echo statement\
    \ is bypassed for the third iteration of the loop.\n\nYou can use an expression\
    \ in the continue statement when working with nested loops, as shown in Listing\
    \ 4.5.\n\n# Listing 4.5 nested_continue.php3—Using the continue statement when\
    \ working with nested loops\n\n```\n<?php\nfor ($row = 0; $row < 3; $row++) {\n\
    \    for ($col = 0; $col < 3; $col++) {\n        if ($col == 2) {\n          \
    \  continue;\n        }\n        echo \"[$row,$col]<br>\";\n    }\n    echo \"\
