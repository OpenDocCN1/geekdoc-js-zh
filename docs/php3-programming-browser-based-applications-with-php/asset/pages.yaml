    Regular expressions describe the text you need to find. All of the matching abilities
    of patterns are based on the concept of metacharacters. Metacharacters are characters
    that have an additional meaning above and beyond their literal meaning. For example,
    the metaning of the period character is to match any character in the target string
    except for the newline character.


    You learned that patterns can have atoms, branches, and bracket expressions. Atoms
    are individual items that need to be matched. Atoms can be followed by *, +, ?,
    or a bound to form'
