    | Variable Name | Description |

    |---|---|

    | AUTH_TYPE | Optionally provides the authentication protocol used to access your
    script if the local Web server supports authentication and if authentication was
    used to access your script. |

    | CONTENT_LENGTH | Optionally provides the length, in bytes, of the content provided
    to the script by the Web server. PHP programmers should never need this variable
    because they can use the `$HTTP_POST_VARS` array. |

    | CONTENT_TYPE | Optionally provides the type of content available from the STDIN
    file handler. This is used for the POST method of form processing. Most of the
    time this variable will be blank and you can assume a value of `application/octet-stream`.
    This is another variable you should be able to ignore. |

    | DOCUMENT_ROOT | Holds the root directory name of the Web document tree. On normal
    Apache installations, this value is `/usr/local/apache/htdocs`. |

    | GATEWAY_INTERFACE | Provides the version of CGI supported by the local Web server.
    Most of the time, the version is CGI/1.1. |

    | HTTP_ACCEPT | Provides a comma-separated list of MIME types the browser accepts.
    You might check this environmental variable to see if the client will accept a
    certain kind of graphic file. An example is image/gif, image/x-bitmap, image/jpeg.
    |

    | HTTP_USER_AGENT | Provides the type and version of the user''s Web browser.
    For example, the Netscape Web browser is called Mozilla. |


