  md: 'This looks like a marvelously simple way for DTD developer to make things as
    easy as possible for document authors—and so is it. It also ensures that a “conforming”
    document’s structure will be completely unpredictable, and therefore undermines
    the whole point of using a DTD in the first place. In practice, you will probably
    encounter the ANY keyword only in DTDs that are under development or in special
    cases where the structure truly is unpredictable. (And, of course, you may also
    encounter it in a DTD whose developer hasn''t thought through or her application
    very carefully.)


    # ATTLIST Keyword


    ATTLISTs are where the DTD designer specifies the attributes of the elements that
    may include. The general form of an ATTLIST is:


    ```

    <!ATTLIST elename attribname attributevalueinfo [...]>

    ```


    The elename and attribname are, unsurprisingly, the name of the element to which
    this attribute may be applied and the name of the attribute itself, respectively.
    The [...] simply means that an ATTLIST can include definitions for as many attributes
    to this element as the designer wants, by adding more attribname attributevalueinfo
    pairs.


    What’s in the attributevalueinfo defines what sorts of values the attribute may
    take. These specifications follow this general pattern:


    ```

    attribype attribdefault

    ```


    We''ll look at each of these separately. Be aware that in the discussion that
    follows space does not permit describing all possible options, caveats, and restrictions.


    # Attribute Type Specification


    Attribute values can be any of three types: enumerated, string, or tokenized.
    The enumerated attribute value type simply lays out all the possible values the
    attribute may have, using a format something-thing like an element’s content model.
    For instance (omitting for now the attribute default specification):


    ```

    <!ATTLIST person gender (male | female | unknown)>

    ```'
