  md: '# Field Definitions, Revisited


    Before leaving the topic of databases and SQL to develop a list maintenance application,
    we have a few miscellaneous topics to cover related to fields.


    # Using Indexes, or Key Fields, to Speed Up Queries


    Most databases support the concept of indexes to reduce the amount of time a query
    takes to run. An index essentially presort one or more fields so that the database
    doesn''t need to scan every record in order to find the information query requests.


    Even though indexes are very important, computers are so fast that tables need
    thousands of records before any increase of speed is noticed. So, at least for
    now, don''t worry about creating indexes for your database tables. Find a more
    advanced book or tutorial that covers indexes in depth and add them as needed,
    using the alter table command. For example, the following SQL statement creates
    an index for the int_age field in the select0 table.


    ```

    ALTER TABLE

    select0

    CHANGE COLUMN

    int_age

    int_age INTEGER PRIMARY KEY;

    ```


    # Using AUTO_INCREMENT to Create Keys


    In the previous section of this chapter, “Creating Unique Records, I mention that
    every record should be unique. If, however, two records are identical, several
    questions immediately arise:


    Is one of a duplicate and therefore be deleted?


    Are there two people or inventory items (or whatever) that are the same?


    When two records are the same, confusion is the inevitable result. The easiest
    method for creating unique records is to keep track of how many records have been
    created, and assign the count plus one to the next record that created. Many databases
    (including MySQL) provide a way to automate this technique.


    With MySQL you can create an automatically incrementing field using a statement
    that looks like this:'
  merge: -1
  pgno: 162
