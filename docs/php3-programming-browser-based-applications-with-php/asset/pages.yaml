    It''s probably worth mentioning that some classes contain only information and
    not methods. As far as as I know, however, there is no special terminology to
    reflect this. These information-only classes may serve as adjunct or helper classes.


    # **Encapsulation, or Code and Data Belong Together**


    There''s not much that I need to say about *encapsulation*. Keeping the methods
    in the same place as the information they affect seems common sense. It wasn''t
    done using earlier languages mostly because the programming tools were not available.
    The extra work required to manually perform encapsulation outweighed the benefits
    that would be gained.


    One big advantage of encapsulation is that it makes using information for unintended
    purposes more difficult, and this reduces logic errors. For example, if pens were
    sold in lots of 100, the `change_qty_on_hand` function could reflect this. Changing
    the quantity by only one would not be possible. This enforcement of business rules
    is one of the biggest attractions of object-oriented programming.'
