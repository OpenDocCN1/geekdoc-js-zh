    # Summary


    This chapter introduced you to the concept of literals, variables, constants,
    and operators. Literals are values that are placed directly into your source code
    and never changed by the program. Variables are places in computer memory that
    are used to hold values as your program runs. They are called variables because
    you can assign different values to them as needed. Constants are essentially named
    literals (like pi) that are useful for documentation and making code more manageable.
    Operators tell the computer what to do.


    Literals are sometimes referred to as hard-coded values. You read about numeric
    literals and the three different bases that can be used to represent them—decimal,
    octal, and hexadecimal. Very large or small numbers can also be described using
    scientific notation.


    Strings are a bit more involuted. Single-, double-, and back-quoted strings are
    used to hold a series of characters. Back-quoted strings have an additional purpose.
    They tell PHP to send the string to the operating system for execution.


    Escape sequences are used to represent characters that are difficult to enter
    through the keyboard or have more than one purpose. For example, using a double
    quote inside a double-quoted string ends the string before you really intend.
    The backslash character was introduced to escape the double quote and change its
    meaning.


    You read about two types of variables: scalars and arrays. Scalar variables hold
    a single number or text string. Array variables hold a series of scalar values.
    Each entry in an array has an associated key. Therefore, arrays are a way to hold
    key-value pairs of data. Multidimensional arrays or hashes are used when one'
