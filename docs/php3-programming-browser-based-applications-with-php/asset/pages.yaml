    # MySQL''s Operators


    Like computer languages, MySQL understands many opera-

    tors. The following list summarizes them:


    # Table C.1 MySQL''s operators


    | Operator | Type | Description |

    | ( expr ) | Grouping | Groups operators and operands together to affect their
    order of precedence. |

    | - expr | Mathematical | Changes the sign of expr. |

    | expr1 + expr2 | Arithmetic | Adds two operands. |

    | expr1 - expr2 | Arithmetic | Subtracts two operands. |

    | expr1 * expr2 | Arithmetic | Multiplies two operands. |

    | expr1 / expr2 | Arithmetic | Divides two operands. |


    (cont''d)'
  merge: -1
