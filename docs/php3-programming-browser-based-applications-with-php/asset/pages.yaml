    ```


    Although dynamic variable names are somewhat interesting to play with, I''ve never
    found a need for them in my twenty years of programming. The flexibility of arrays
    should be enough to solve most problems that might otherwise need dynamic variable
    names.


    # Constants


    Constants help you add documentation to your programs in a painless way. It is
    much easier to understand a program that refers to BUFFER_SIZE than one that refers
    to 1024. Additionally, because most constants are defined at the beginning of
    a program file, changes are easy to make.


    You can define both constant numbers and constant strings. The following example
    shows how:


    ```

    <?php

