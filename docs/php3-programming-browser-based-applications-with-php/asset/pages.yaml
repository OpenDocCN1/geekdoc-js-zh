  md: "I'm not ashamed to admit that first, last, and probably forever I'm a programmer.\
    \ I think in terms of statements and for loops. Therefore, when I am forced to\
    \ drop out of whatever programming language I'm using into HTML tags, the transition\
    \ is a bit awkward. To me, it's much easier to comprehend the following at a glance:\n\
    \n```\n<php\necho '<table border=\"0\">';\nfor ($index = 0; $index < 10; $index++)\
    \ {\n    echo '<tr><td>Cell ' . $index . '</td></tr>';\n}\necho '</table>';\n\
    ?>\n```\n\nthan this:\n\n```\n<table border=\"0\">\n<?php for ($index = 0; $index\
    \ < 10; $index++) { ?>\n<tr><td>Cell <?php echo $index; ?></td></tr>\n<?php }\n\
    </table>\n```\n\nCan you pick out the <?php .. ?> pairs? How tough would this\
    \ type of code be to debug and maintain?\nUnfortunately, using correct HTML requires\
    \ double quotes. And double quotes use single quotes inside echo statements because\
    \ you can't always use single-quoted strings when you need variable interpolation.\
    \ I've attempted to alleviate this problem by developing a PHP class for HTML.\n\
    \n# Goals of the HTML Class\n\nOne of the more important steps to complete before\
    \ starting to write code is to figure out what your code should accomplish. So,\
    \ what should an HTML class do?\n\n+   - Eliminate the need to use echo statements\
    \ to generate HTML PHP code easier to understand because double quotes won't need\
    \ to be escaped.\n- Follow Java's user interface model. Simply put, elements are\
    \ defined and then added to larger elements."
