    Connects to the iODBC directory.


    +   2. ./configure \

    --prefix=/usr/local/iodbc \

    --with-odbc-inidir=/usr/local/etc

    Runs the configuration program and forces it to set up the installation so that
    iODBC is installed to /usr/local/iodbc. Additionally, make sure that the odbc
    initialization file is called /etc/odbc.ini.


    +   3. make


    +   4. make install

    Libraries are copied into /usr/local/iodbc/lib, and include files are copied into
    /usr/local/iodbc/include.


    +   5. cd /usr/local/src/myodbc-2.50.24

    Connects to the MyODBC directory.


    +   6. ./configure \

    --prefix=/usr/local/myodbc \

