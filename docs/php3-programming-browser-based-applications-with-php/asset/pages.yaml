    In order to determine the value of the key_autoi field, use the last_insert_id()
    function:


    ```

    SELECT DISTINCT

    last_insert_id()

    FROM

    autoi:

    ```


    Resulting Set of Records:


    +----------------------+

    |  last_insert_id()    |

    +----------------------+

    |           2            |

    +----------------------+-


    The **distinct** keyword is needed so that only one value is returned. If it is
    not used, MySQL returns one record for each record in the table. Without the **distinct**
    keyword, the resulting set of records is:


    +----------------------+

    |  last_insert_id()    |

