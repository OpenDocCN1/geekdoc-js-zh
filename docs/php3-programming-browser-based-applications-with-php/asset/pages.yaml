  md: '# Chapter 10 / Object Orientation


    Many programmers are curious about object-oriented programming (OOP). But few,
    from a statistical point of view, actually take the plunge to learn the terminology
    and techniques of object-oriented programming. However, incorporating object-oriented
    ideas into your everyday programming provides benefits—such as ease of maintenance
    and better reusability of code.


    What are objects? The book you are reading is an object. The knife and fork you
    eat with are objects. In short, your life is filled with them. The question that
    really needs to be asked, “What are classes?” You see, the real work in object-oriented
    programming is performed by classes. Classes are a combination of variables and
    functions designed to emulate an object. Unfortunately, OOP has its own unique
    terminology:


    Properties—Variables used inside a class.


    Methods—Functions used inside a class.


    Inheritance—Classes can inherit properties and methods from one or more parent
    classes. Later in the chapter, you''ll see how information about a general class
    called inventory_item can be used as the parent of a more specific class called
    pen.


    Abstraction—Information about an object (its properties) can be accessed in a
    manner that isolates how data is stored from how it is accessed and used. Later,
    you''ll read about get and set accessor functions for class properties.


    Encapsulation—Information about an object and functions that manipulate the information
    (its methods) are stored together. The class keyword is used to group properties
    and methods.


    Polymorphism—A child class can redefine a method already defined in the parent
    class. In PHP3, once a parent''s function is overridden by a child, it can no
    longer be used. So this technique isn''t quite as useful as it should be. It is
    rumored that PHP4 will provide better support for polymorphism.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Learning about Classes


    Before looking at specific examples of object-oriented PHP code


    Classes are used to group and describe object types. Remember the character classes
    from the pattern-matching chapter? A class in the object-oriented world is essentially
    the same thing. Let’s create some classes for an inventory system for a pen and
    pencil vendor. Start with a pen object. How could you describe a pen from an inventory
    point of view?


    First, the pen probably has a part number, and you need to know how many of them
    are there. The color of the pen might also be important. What about the level
    of ink in the cartridge—is that important? Probably not to an inventory system
    because all the pens will be new and therefore full.


    The thought process embodied in the previous paragraph is called modeling. Modeling
    is the process of deciding what information goes into your objects. In essence,
    you create a model of the world out of objects.


    > The terms object and class are pretty interchangeable. The difference is that
    a class is considered an object described in computer language, whereas an object
    is just an object.


    How you approach designing your classes depends on your project. The description
    of an object—and its class—changes according to what needs to be done. If you
    were attempting to design a school course scheduling program, for example, your
    objects would be very different than if you were designing a statistics program.'
