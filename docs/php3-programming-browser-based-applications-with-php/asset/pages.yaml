- img_proc: true
  md: '# Table C.1 MySQL''s operators (cont’d)


    | Operator | Type | Description |

    | --- | --- | --- |

    | expr1 | expr2 | Bit | Does a bitwise OR of two operands. |

    | expr1 & expr2 | Bit | Does a bitwise AND of two operands. |

    | expr1 << expr2 | Bit | Shifts a longlong (BIGINT) number to the left. |

    | expr1 >> expr2 | Bit | Shifts a longtime (BIGINT) number to the right. |

    | expr1 = expr2 | Comparison | Does a comparison of two operands. Returns true
    if both operands are equal. Otherwise false. |

    | expr1 <> expr2 | Comparison | Does a comparison of two operands. Returns true
    if the operands are unequal. Otherwise false. You can use != instead of <>. |

    | expr1 <= expr2 | Comparison | Does a comparison of two operands. Returns true
    if the left-hand operand is less than or equal to the right-hand operand. |

    | expr1 < expr2 | Comparison | Does a comparison of two operands. Returns true
    if the left-hand operand is less than the right-hand operand. |

    | expr1 >= expr2 | Comparison | Does a comparison of two operands. Returns true
    if the left-hand operand is greater than or equal to the right-hand operand. |

    | expr1 > expr2 | Comparison | Does a comparison of two operands. Returns true
    if the left-hand operand is greater than the right-hand operand. |'
  merge: -1
  pgno: 477
- img_proc: true
  md: '# Table C.1 MySQL''s operators (cont''d)


    | Operator | Type | Description |

    |---|---|---||

    | expr1 <=> expr2 | Comparison | Does a NULL-safe comparison of two operands.
    If you need to use NULL values, read section 7.3.5 of the MySQL manual. |

    | expr1 AND expr2 | Bit | Does an AND of two operands. Returns true if both operands
    are true. Otherwise false. You can use && instead of AND. |

    | expr BETWEEN min AND max | Comparison | Returns true if expr is greater than
    min and less than max. |

    | BINARY expr | Cast | Converts expr into a binary string. |

    | BIT_COUNT(n) | Bit | Returns the number of bits in n. |

    | expr IN (value_list) | Comparison | Returns true if expr matches any values
    of the comma-separated value_list. You can also use NOT IN. |

    | INTERVAL(n, number_list) | Comparison | Returns the index of the nth value larger
    than n. Each consecutive value in the number list must be greater than the previous
    one. |

    | ISNULL(expr) | Comparison | Returns true if expr is null. Otherwise falsewise.
    |

    | NOT or ! | Bit | Returns the opposite of expr. If expr is true, it returns false.
    And vice versa. |

    | OR or || | Bit | Does an OR of two operands. Returns true if either operand
    is true. Otherwise false. |'
