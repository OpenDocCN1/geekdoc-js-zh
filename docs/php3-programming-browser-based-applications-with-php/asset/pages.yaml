  md: '# Inheritance, or Knowing Your Parents


    We''ve talked about pens and their colors and other identifying features; in object
    talk, these features are called properties. Figure 10.1 shows how the pen class
    looks at this stage of the discussion.


    | Class Name: |

    | cls_pen |

    | Properties: |

    | part_number |

    | quantity_on_hand |

    | ink_color |


    Figure 10.1 The cls_pen class and its properties.

    Now that you have a class, it''s time to generalize. Some people generalize first;
    I like to look at the details first and then extract the common information. Of
    course, usually you''ll need several classes before any common features appear,
    but because I''ve already thought this example through, I can cheat a little.


    It''s pretty obvious that all inventory items need a part number and each has
    its own quantity-on-hand value. Therefore, you can create a more general class
    than pen-pen. Let''s call it inventory_item. Figure 10.2 shows this new class.


    | Class Name: |

    | cls_inventory_item |

    | Properties: |

    | part_number |

    | qty_on_hand |


    Figure 10.2 The cls_inventory_item class and its properties.


    Figure 10.2 The cls_inventory_item class and its properties. Because some of the
    properties of cls_pen are also now in cls_inventory_item, you need some mechanism
    or technique to avoid repetition of information. This is where inheritance comes
    into play. The inventory_item class becomes the parent of the pen class. Figure
    10.3 shows how the two classes are now related.'
