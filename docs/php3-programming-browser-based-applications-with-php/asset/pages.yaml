  md: '# Installing PHP


    This chapter shows you how to compile and install the gcc C compiler, the MySQL
    database, and the Apache Web server with the PHP module. If you’re not sure which
    components you need on your computer, install them all.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'The installation instructions in this chapter are based on brand-new Red Hat
    Linux v5.2 and v6.0. Because the C compiler installed with v5.2 wasn''t new enough
    to perform all of the compilations needed to get PHP to work, I downloaded gcc
    v2.8.1 from the Internet and included compilation instructions for that in this
    chapter as well.


    This chapter is available at http://www.mtolive.com/phpbook/.Using cut and paste
    techniques should prevent some typing mistakes.


    # Note


