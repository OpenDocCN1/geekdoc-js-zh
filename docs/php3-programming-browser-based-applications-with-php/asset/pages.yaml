  md: '# # Interlude Three: Creating an HTML Module


    One aspect of PHP—or any Web page scripting language—that''s not very pretty is
    how HTML and the scripting language interact. The necessity of moving from scripting
    mode to HTML mode and back again breaks the smooth flow of PHP code, which makes
    scripts hard to follow. This chapter explores how to stay in PHP mode and still
    generate HTML tags.'
