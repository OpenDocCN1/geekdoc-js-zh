  md: '# Text Literals


    Text literals are groups of characters surrounded by quotes so that they can be
    used as a single datum. Actually, PHP is a little lax regarding quotes—you can
    use single words as strings without quoting them. But please don''t. Text literals
    are sometimes called strings because they consist of a series of characters string
    together. They are frequently used in programs to identify filenames, display
    messages, and prompt for input. PHP distinguishes between single quotes (''''),
    double quotes (""), and back quotes (\`'').


    # Single-quoted Strings


    Single-quoted strings are fairly straightforward; simply surround the text you
    need to use with single quotes. For example:


    > ''Men at Arms by Terry Pratchett''

    <P>This is an HTML paragraph.</P>


    The real utility of single-quoted strings won''t become apparent until you read
    the "Variable Interpolation" section later in this chapter.


    Life gets slightly more complicated if you need to use a single quote inside a
    single-quoted string. For example, the following does not work because the second
    quote ends the string:


    > ''Terry''s book is highly enjoyable.''


    This type of problem is known as a syntax, or parse, error. The PHP compiler doesn''t
    know how to handle the text that follows the second single quote.


    Here is a corrected example:


    > ''Terry\s book is highly enjoyable.''


    The backslash (\) character indicates that the normal function of the single quote—ending
    a text literal—should be ignored.


    The backslash character is also called an escape character—perhaps it lets the
    next character escape from its normal interpretation.'
