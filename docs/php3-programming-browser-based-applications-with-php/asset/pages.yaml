- img_proc: true
  md: 'Literal values don''t change while your program runs because you represent
    them in your source code exactly as they should be used. Most of the time, however,
    you need to change the values your program uses as it runs. To do this, you need
    to set aside pieces of computer memory to hold the changeable values. And you
    need to keep track of where all these little areas of memory are so you can refer
    to them while your program runs. PHP, like all other computer languages, uses
    variables to keep track of the usage of computer memory. Every time you need to
    store a new piece of information, you assign it to a variable. Constant values
    are literal values with a name assigned to them. The classic example of a constant
    value is the mathematical value, pi.


    This chapter shows how you can use literal values, variables, and constants with
    PHP. First, let''s talk about literal values.


    # Literal Values


    Literals are values represented “as is” or hard-coded. For instance, when you
    see a number like 12.5 in the source code of a program, it refers to twelve and
    a half, not the four characters “1”, “2”, “5”. In a similar fashion, you can represent
    them. For example, “Rolf D’Barno” (notice the double-quotes) represents a string
    of twelve characters. Because the twelve characters are surrounded by double-quotes,
    they count as a single literal value.


    PHP uses two types of literals:


    +   - Numeric—the most basic data type.

    - Text—a series of characters handled by a single unit.


    # Numeric Literals


    Numeric literals are frequently used in PHP. They represent a number that your
    program needs in order to perform some task. Most of the time you’ll use numbers
    in base ten—the most commonly used. However, you can also use base 8 (octal) or
    base 16 (hexadecimal) numbers with PHP.


    If you work with very large or very small numbers, you probably find scientific
    notation to be useful. Ive forgotten most of the math I learned in high school;
    however, scientific notation has always stuck with me. Perhaps because I like
    moving decimal points around. Scientific notation looks like 10.23E+4, which is'
  merge: -1
