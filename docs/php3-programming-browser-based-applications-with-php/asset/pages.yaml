  md: '# Why XML? 381


    Internet users numbering in the tens of millions, the Web must be clicking pretty
    smoothly. Aside from needing occasional interface enhancements, new tags, and
    so on, you’d think that HTML didn’t really need any help, right?


    Well, no. HTML is unsuitable for robust document and data-management work for
    four main reasons:


    +   - It mixes structural and display elements into unseemly stew

    - It allows too much leeway for interpretation by browser vendors

    - It’s ill-suited for use in other media, particularly print

    - And it’s all but useless as a medium of data interchange


    As shown in the next few sections, XML addresses all of these shortcomings.


    # Mixed Structure and Display


    What, exactly, is a “paragraph”? Ask a grammarian this question and you get one
    answer; ask a typesetter and you get another. Within either of these disparate
    answers, though, lies a host of implicit assumptions, masking myriad further questions.
    Is an introductory paragraph the same as a paragraph in the middle of a document
    or one in the summary? Is a paragraph of dialogue in a novel the same as a paragraph
    in a cookbook? Is the definition of a word as it appears in a dictionary? Suppose
    I copy-and-paste a paragraph from a popular magazine article to a technical reference
    book I’m writing; is it still the same type of “paragraph”?


    One of the beauties of HTML—and one of its drawbacks—is that it flattens all meanings
    into a single tag, `<p>`. By default, a browser renders a given HTML paragraph
    in the same way as any other. This is beautiful because it is simple. It’s also
    woefully inadequate for any but the most generic real-world applications, which
    have to allow for answers to all those nigging little questions.


    The proprietors of HTML—the World Wide Web Consortium, or W3C—have over the years
    addressed this problem with a variety of devices. They’ve supplied other tags,
    like `<div>` and `block-quote`, that perform some of the same functions as paragraphs
    but in subtly different ways. And they’ve come up with a mechanism,'
  merge: -1
  pgno: 402
- img_proc: true
  md: 'style sheets, that allows (for example) a paragraph in a sidebar to be rendered
    different from one in the body of a Web page.


    But the root of the problem remains: an HTML “paragraph” is a unit both of structure
    and display, and both its structural and display characteristics are completely
    generic.


    # Note


    By the way, the problem is not at all restricted to paragraphs. Look at any Web
    page with the View Source window and you''ll see the same thing, even if it includes
    no <p> tags: a hodgeodge of structural elements encrusted with display characteristics,
    like barnacles.


    # Browser Variations


    Because generic HTML markup is *generic*, it doesn''t insist, for example, that
    the first line of each paragraph be indented and/or double-spaced after the last
    line of the preceding paragraph. When you specify that an image or table is to
    be left-justified, a browser vendor is free to decide whether “the left edge”
    of the page is exactly at the left edge of the window or indented by a few pixels.


    As a developer, these loose ends do not mean much to you. The Web is no longer
    a place where loose ends can be ignored. Large companies pay advertising firms
    and Web designers large sums of money to ensure that the company logo, for example,
    doesn''t overlap the company name, but appears offset by exactly one unit of space
    (two units simply won''t!). The designers, perhaps spoiled by decades of experience
    with print media—which do allow such fine placement of page elements—don''t want
    to tell you that it''s not possible, let alone it''s not important.


    Note that even if a designer uses style sheets to say that all paragraphs display
    display characteristics, these characteristics may sometimes conflict with those
    inherent in a given browser''s rendering of a given tag. How a browser should
    resolve these conflicts is not mandated by the W3C or anyone else.


    Worse, HTML has over time acquired all sorts of “legal” extensions—kludges, really—as
    the browser vendors experimented with solutions to designer and user needs. These
    range from the dreaded Netscape <blink> tag, used to make text flash on and off
    to the use of plug-ins, which work in one browser but not another.'
