    # Perl-Style Functions


    Perl seems to have the most flexible set of pattern matching functions. And starting
    with PHP v3.0.9, many of Perl''s features have been duplicated.


    # Pattern Delimiters


    Rather than simply using the pattern as a parameter, the functions require the
    parameters to be enclosed by pattern delimiters. The standard delimiter for Perl-style
    patterns is the / character. However, you can use alternative pattern delimiters.
    This feature is especially useful when working with filenames. A delimiter marks
    the beginning and end of a given pattern. In the following pattern:


    ```

    //

    ```


    you see two of the standard delimiters—the slashes (//). However, you can use
    any character as the delimiter. This feature is useful if you want to use the
    slash character inside your pattern. For instance, to match a file you will normally
    use:


    ```

    //root/home/random.dat/

    ```


    This match statement is hard to read because all the slashes seem to run together
    (some programmers say they look like tees). If you use an alternate delimiter,
    it might look like this:


    ```

    !/root/home/random.dat!

    ```


    In this example, the / character no longer acts like a metacharacter because the
    delimiters have changed. Therefore, the escape character of \ is no longer needed.'
