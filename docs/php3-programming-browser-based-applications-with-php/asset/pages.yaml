  md: '# Manipulating Data within PHP


    This chapter focuses on data internal to your PHP programs. Internal data include
    literal values, variables, and constants. The data inside programs is manipulated
    using operators. Operators tell PHP what to do (add, subtract, and the like) with
    the internal data. Data external to your programs include text files and databases.
    See Chapter 6, “Databases and SQL,” for more information about external data.'
