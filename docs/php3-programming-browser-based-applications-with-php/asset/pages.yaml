    # Operators


    Operators tell the computer which actions to perform. Try thinking about operators
    in the same way you would give instructions to the driver of a car: You might
    say “turn left” or “turn right,” for example. These commands could be directional
    operators in the same way that plus and minus mathematical operators that say
    “add this” or “subtract this” are. If, on the other hand, you yell “stop” while
    the car is moving, it should supersede the other commands. This means that “stop”
    has precedence over “turn left” and “turn right.”


    All operators cause actions to be performed on operands. An operand can be anything
    that you perform an operation on. In practical terms, any particular operand will
    be a literal, a variable, or an expression. You’ve already been introduced to
    literals and variables earlier in this chapter. Expressions are combinations of
    operators and operands that are evaluated as a unit.


    Operands are recursive in nature. In PHP, the expression 4 / 2—two operands and
    a division operator—can be considered as one operand with a value of 2. Another
    example is (5 + 9) - 7, an expression that consists of two operands subtracted
    from each other. The first operand is (5 + 9) and the second operand is 7.


