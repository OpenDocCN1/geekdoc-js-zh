  md: '# Why XML?


    HTML is optimized specifically for use in viewing on a computer monitor, within
    the context of a graphical user interface. The built-in assumptions behind this
    targeted medium include, for example, that if a document is too long for display
    at a given monitor resolution, a scroll bar will viewing the rest—there’s no inherent
    “turn to the next page” mechanism, as in print. When a user prints a Web page,
    they get hard copy rendering not just of the page’s true contents but also of
    the graphic and navigational elements such as buttons, menus, and other “chrome.”
    Bandwidth considerations require single long documents to be broken up into multiple
    “pages” (actually separate HTML documents) for use on the Web, which in turn makes
    them as a single unit tedious or impossible. And so on.


    # Impracticality for Data Interchange


    Say you’re a manufacturer of computer components. You retail your products on
    the Web for consumers and via catalog for those who prefer that format. You also
    sell wholesale to Value-added Resellers (or VARs) and purchase your own materials
    and subassemblies from dozens of suppliers; all these other links in the supply
    chain use their own technologies—from open-source through “industry standard”
    and on into proprietary—to store and manipulate their corporate data. And on top
    of this, of course, is that different organizations within your corporation may
    use different tools: Microsoft Access, IBM DB2, Oracle, Java, Perl, and comma-delimited
    flat files, and so on.


    Why should you keep all of this data, for scores of different purposes, in scores
    of different formats? Wouldn’t it be nice if you used some simple, easily processed
    common format for them ... something like, say, HTML?


    If you try this, be prepared for your audience to run screaming from the conference
    room. When you put your product name into one cell of a table and your retail
    price, wholesale price, item number, and so on into others, you’ve stripped the
    data of any meaning: it’s all marked up with the old <table> (for “table data”)
    tag. Your HTML-only “strategy” will cost you not only the respect of your customers
    and suppliers, but also their business.'
