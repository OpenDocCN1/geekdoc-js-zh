- img_proc: true
  md: '# Chapter 12 / What is CGI?


    The GET method appends all of the form data to the end of the URL used to invoke
    CGI script. A question mark is used to separate the original URL (specified by
    the ACTION modifier in the <FORM> tag) and the form information. The server software
    puts this information into the QUERY_STRING environment variable for use in the
    CGI script that will process the form.


    The GET method can''t be used for larger forms because some Web servers limit
    the length of the URL portion of a request. (Check the documentation on your particular
    server.) This means that larger forms might blow up if submitted using the GET
    method. For larger forms, the POST method is the answer.


    The POST method sends all of the form information to the CGI program using the
    STDIN filehandle. The Web server will set the CONTENT_LENGTH environment variable
    to indicate how much data the CGI program needs to read.


    As a PHP programmer, you don''t need to know the details of how form information
    is passed into CGI programs because the PHP engine makes the information available
    to you through the $HTTP_GET_VARS and $HTTP_POST_VARS arrays and through PHP variables.
    For example, if you have a field called age, the form information is available
    as $age and $HTTP_POST_VARS[''age'']—assuming your form method="post".


