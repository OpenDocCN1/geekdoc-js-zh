  md: 'Chapter 4, "Controlling Your Programs," the concept of expressions and how
    simple expressions can be combined to form larger expressions. This concept of
    small items combining to form larger items is applicable to patterns.


    Atoms are individual items that need to be matched. Like expressions, atoms can
    be combined with each other to form larger atoms. Atoms can be followed by the
    following modifying characters to form *pieces:*


    An asterisk—The * character matches if the atom appears zero or more times in
    the target string. Please be careful when using asterisks in your patterns. Because
    the atom is found if zero times, a pattern like "a*" always matches. Normally,
    the * modifier is used in more complex patterns. For example, "ab*c" matches "ac",
    "abc", "abcd", and any other number of b''s surrounded by a and c.


    A plus sign—The + matches if the atom appears one or more times.


    A question mark—The ? character matches if the atom appears zero or one time.


    A bound—Bound notation comes in three flavors. (n) means that an atom must be
    matched exactly n times. (n,) means an atom must be matched at least n times.
    And (n, m) means that an atom must be matched at least n times and not more than
    m times.


    Branches are used when matching one or more patterns. For example, two pieces
    ("a+" and "z+") can be combined ("a+\|z+") to match strings containing one or
    more a or one more z characters. Like many definitions in computing, branches
    can be confusing because the term can refer to a single piece ("a+") or to combinations
    of pieces ("a+\|z+").


    # Bracket Expressions


    Bracket expressions are sequences of characters surrounded by square brackets.
    Each bracket expression normally matches a single character in the target string.
    If the first character in the bracket sequence is ^, the bracket expression matches
    all characters except those in the sequence. Bracket expressions can also contain
    charac'
