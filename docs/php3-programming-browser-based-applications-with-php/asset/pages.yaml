- img_proc: true
  md: 'AuthType—This directive specifies the protocol to be used for authentication.
    *Basic* authentication passes the username and password unencrypted (that is,
    in clear text) to the Web server. This is not the most secure form of authentication,
    hence its name. *Digest* is another form of authentication. It uses MD5 encryption
    to provide greater password security. However, Digest authentication is not supported
    by older versions of browsers. It limits its use in large Internet sites. To use
    Digest authentication, set up the Web server as you would for Basic authentication
    except you need to use `AuthType Digest` and `AuthDigestFile` instead of `AuthUserFile`.


    +   - UserFile (or AuthDigestFile)—This directive specifies the path to the user
    database file. This is the file created using `htpasswd` earlier.


    +   - require—This directive specifies which of the users in the user database
    file will have access to the protected directory. In the example above, all valid
    users have access to the restricted area. To restrict access to specific users
    you would modify the require directive to look like this:


    ```

    require user gerry

    ```


    This permits the user *gerry* to access this realm with his username and password
    and denies all others, even if they have a valid username and password in the
    user database file.


    A user file is for small numbers of users; however, when number increases it can
    become unmanageable. Categorizing users into groups greatly simplifies the management
    of moderate numbers of users since you can assign access privileges to many users
    at once on a group file.


    Groups are defined in the group file that is referenced in the .htaccess file
    or `<Directory>` directive with the following format:

    AuthGroupFile /etc/httpd/groups


    The group file contains one group definition per line, starting with the group
    name followed by a space-separated list of users in the group. If the line of
    users becomes too long, you can continue'
