    The NULL value for the `key_authors` associated with *Playgrounds of the Mind*
    is automatically created by MySQL. If you want to select records with only null
    values, use `IS NULL` notation because using `= NULL` is not guaranteed to work:


    ```

    SELECT

    books.book_title

    FROM

    books LEFT JOIN books_authors

    ON books.key_authors = books_authors.key_books

    WHERE

    books_authors.key_authors is NULL

    ORDER BY

    books.book_title

    ```


    You can intentionally create a NULL value. For example, if you find out that the
    publisher of “Eric” is incorrect, but don’t know the correct information:


    ```

    UPDATE

    books

    SET

    key_publishers = NULL

    WHERE

    book_title = ''Eric''

    ```


    One last thought before moving onto a new topic. NULL values aren''t equal to
    any value except NULL. And they aren''t unequal either. Unless you specifically
    use NULL in your SQL statements, the value (and perhaps the record, by extension)
    is ignored.'
