  md: '# MySQL


    +   - % —The percent sign matches any number of characters, even no characters.
    This means ''D%%'' matches ''D'', ''Da'', ''Dav'', and an infinite number of other
    strings.


    +   - _The underscore character matches exactly one character.


    Using the LIKE operator is straightforward, especially when compared to the Perl-style
    patterns you read about previously in this chapter. The following example matches
    all text that begins with an “r":


    ```

    SELECT

    FROM

    table

    WHERE UPPER(field) LIKE ''R%''

    ```


    The underscore metastachar is useful if you need to match a specific number of
    characters. The next example matches fields that begin with a “1” and are three
    characters long. In other words, numbers from 101 to 199.


    ```

    SELECT

    FROM

    table

    WHERE field LIKE ''1__''

    ```


    Normally the \ character is used to escape the metastacters their normal meanings
    are needed. However, SQL provides an ESCAPE keyword to add flexibility to its
    statements. For example, this example shows how to use an exclamation point as
    an escape character. Even though the % and _ characters aren''t used in the pattern,
    the ESCAPE keyword is still handy to avoid having to use the back character.


    ```

    SELECT

    FROM

    table

    WHERE field LIKE ''\autoexec.bat'' ESCAPE ''!''

    ```'
