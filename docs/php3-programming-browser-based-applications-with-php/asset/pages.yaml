    # Multidimensional Arrays


    For many programs, a simple list of values is not complex

    enough. For example, suppose you need to store both the number

    of pages and the publisher''s name for a series of books. Keeping

    track of two lists, lst_number_of_pages and lst_publisher_names,

    becomes unwieldy when you need to add and edit information.

    And keeping the two lists in sync is a potential source of bugs.


    Multidimensional arrays provide a data structure that is quite

    flexible. Each array element can contain another array. Unfortu-

    nately


