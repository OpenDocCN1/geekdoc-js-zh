    Because HTTP is a stateless protocol—it doesn''t remember

    information from one request to the next—most applications com-

    bine authentication with some form of session management. Ses-

    sions begin when a user connects to your Web server and end after

    a certain period of time (anywhere from one to four hours, usu-\ally). Each time
    the user requests a Web page, the timer is reset to

    zero. Some type of user id representing the session is stored on

    tuser''s computer (using cookies) or passed over the URL.


    # Note


    If you use the PHPLIB module, as described in chapter 15,"Interlude

    Four: Managing Concurrent Access," all of the session details are

