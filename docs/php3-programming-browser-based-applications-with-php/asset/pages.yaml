    \ object.\n$item = new cls_inventory_item();\n```\n\nThe **class** keyword starts\
    \ the definition. The syntax is\n\n```\nclass class_name {\n    // php statements\n\
    }\n```\n\nAfter the **class** keyword, the `$props` variable declarations should\
    \ always be made before the method declarations. This variable becomes the heart\
    \ of the object—an array that contains all properties of the object. Using an\
    \ array to hold the properties lets you create functions that process the properties\
    \ of an object without worrying about how many properties exists or what types\
    \ they are. For example, you might want to write a function that validates Boolean\
    \ properties. If the entries for all Boolean properties begin with \"bln\", a\
    \ simple loop over the `$prop array with a regular expression, `\"bln.+\\` and\
    \ an if statement provides the tools for the task.\n\nFollowing the variable declarations\
    \ are the class methods. This class has only one method, and it's rather special\
    \ because it has the same name as the class itself. When a class method has the\
    \ name of the class it is called a **constructor** function. Although not required,\
    \ it is generally a good idea to provide a constructor function to initialize\
    \ the properties."
