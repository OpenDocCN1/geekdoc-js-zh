    the space in “David Medinet.”


    To clear up the ambiguity, the URL encoding scheme was created. Any spaces are
    converted into plus (+) signs to avoid semantic ambiguities. In addition, special
    characters or 8-bit values are converted into their hexadecimal equivalents and
    prefixed with a percent sign (%). For example, the string David Jones <dj@mtolive.com>'
