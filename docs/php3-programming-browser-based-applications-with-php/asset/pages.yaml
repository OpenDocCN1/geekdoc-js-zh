  md: '# The Document Type Definition (DTD)


    HTML, all elements, attributes, and other markup components are case-sensitive.
    A tag as <Street> is completely different from one like <STREET>, <street>, and
    so on.)


    As for contentmodel , it defines which kinds of content may appear within a given
    occurrence of this element in a conforming document. A common content model says,
    “This element may contain plain text,” and is specified using the reserved term
    #PCDATA, as in this example:


    ```

    <ELEMENT street (#PCDATA) >

    ```


    Under this definition, the following would be all valid XML fragments:


    ```

    <street>123 W. Park Avenue</street>

    <street>MAIN</street>

    <street>123 W. Park Avenue

    Apartment B</street>

    ```


    > CDATA/marked sections may appear anywhere in #PCDATA element contents.

    Other than plain text, elements may contain other elements—each of which must
    have their own definitions in the DTD. For example, consider these element definitions:


    ```

    <ELEMENT streetaddress (housenumber, street, streetype) >n<ELEMENT housenumber
    (#PCDATA) >n<ELEMENT street (#PCDATA) >n<ELEMENT streetype (#PCDATA) >

    ```


    The content model of the streetaddress element says that it must contain a housenumber
    element, a street element, and a streetype element, in that order, as in this
    example:


    ```

    <streetaddress>

    <housenumber>123</housenumber>

    <street>W. Park</street>

    <streetype>Avenue</streetype>

    </streetaddress>

    ```'
