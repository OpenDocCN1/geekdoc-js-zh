    |---|---|n| op1 << op2 | The shift left operator moves the bits to the left, discards
    the far left bit, and assigns the right-most bit a value of 0. Each move to the
    left effectively multiplies op1 by 2. |

    | op1 >> op2 | The shift right operator moves the bits to the right, discards
    the far right bit, and assigns the left-most bit a value of 0. Each move to the
    right effectively divides op1 in half. |

    | op1 & op2 | The and operator compares two bits and generates a result of 1 if
    both bits are 1; otherwise, it returns 0. |

    | op1 | op2 | The or operator compares two bits and generates a result of 1 if
    the bits are complementary; otherwise, it returns 0. |

    | op1 ^ op2 | The exclusive or operator compares two bits and generates a result
    of 1 if either or both bits are 1; otherwise, return 0. |


    The right-most bit of a value is lost when the bits are shifted right. You can
    see this in the following example, which divides by 8 using the >> operator:


    ```

    $int_a = 129;

    $int_b = $int_a >> 3;

    echo $int_b<br>";

    ```


    The program produces the following output:


    16


    Because the bit value of 16 is 00010000, you can tell the right-most bit has disappeared.
    Here''s a quick example using the << operator. We''ll multiply 128 by 8:


    ```

    $int_a = 128;

    $int_b = $int_a << 3;

    echo $int_b<br>";

    ```


    The program produces the following output:


    1024'
