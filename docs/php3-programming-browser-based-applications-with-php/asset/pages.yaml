  md: '# Referential Integrity


    Being aware of referential integrity issues is absolutely critical to designing
    applications. Referential integrity is a set of rules that ensure that relationships
    between tables remain valid. For example, if an author’s record is deleted while
    a books_authors record still refers to it, your database suddenly has broken links.
    And broken links mean your application is unstable—your SQL is liable to return
    unpredictable results.


    You’ve already learned most terminology associated with referential integrity,
    but here''s an overview:


    +   - Primary table—Primary, or parent, tables contain links to other tables.
    Tables can be considered both primary and related at the same time.


    +   - Related table—Related tables are referred to by other tables. Sometimes,
    you can think of them as reference, or child, tables.


    +   - Primary key—Key fields in primary tables.


    +   - Foreign key—Foreign keys are those fields in the primary table that point
    to other tables.


    At least three conditions must be met before referential integrity can be implemented:


    +   - More than one table must be used.


    +   - All related key fields must have the same data type.


    +   - Each key field must have a unique value (typically generated by some auto-numbering
    technique).


    Referential integrity prevents the following:


    +   - Deleting a related record when a primary record refers to it. This means
    you can’t delete an author’s record if a book’s record already points to it.


    +   - Inserting a primary record without related records already existing. This
    means you must create authors records before creating books records, assuming
    that a new author is needed for the books record.'
  merge: -1
  pgno: 367
- img_proc: true
  md: 'Changing the key value of a related record. Changing key values is a very big
    no-no. And if you always use auto-generated integers there is never a reason to
    change key values.


    Many database engines let you define table relationships in the database itself.
    This lets the engine enforce integrity by rejecting SQL that breaks the rules.
    See Section 5.3.5.1 of the MySQL manual for the reasons why MySQL doesn''t let
    you define relationships inside the database.


    I prefer to build referential integrity into my application rather than into the
    database engine. This is a controversial viewpoint, but I like the control that
    it provides, especially in situations where database responsibility is split between
    the application development staff and database administrators.


    On professional projects, I devote a separate code module to each database table.
    Inside the module I insert, delete, and update functions. Every delete function
    has an associated delete confirm question so that accidental deletions are reduced.
    And every delete function checks for referential integrity before going ahead
    with the deletion.


    All of my insert forms have buttons so that related information can be created
    as needed. And related information is always presented using drop-down lists to
    ensure that only valid data can be entered.


    # Summary


    Real-world SQL as a topic has filled many books. And I encourage you to read as
    much as possible so that you can learn from other people''s triumphs and mistakes.


    This chapter started by examining how information can be split into multiple tables
    with each table possibly holding more detailed information than the original table.
    Since multiple tables exist, so must there relationships between them exist. Most
    databases recognize three types of relationships:


    +   - one to one—books can have only one publisher.


    +   - one to many—books can have more than one author.


    +   - many to many—publishers can work with more than one author and author can
    work with more than one publisher.'
