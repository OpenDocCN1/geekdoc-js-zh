  md: '# Designing the Solution


    Now that the technique for storing user information (in the form of locks) has
    been decided, what else needs to be done?


    +   - When a user loads the Web page, they need to be logged in and assigned a
    session—PHPLIB can handle this.

    - When a record is edited, the locks table needs to be updated—this code needs
    to be written.

    - The edit and delete options (for record currently being edited) need to be removed—this
    code needs to be written.

    - A logout option is needed—this code needs to be written.

    - Locks older than 15 minutes need to be removed—this code needs to be written.


