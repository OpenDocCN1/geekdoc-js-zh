    The bitwise shift operators, listed in table 3.5, are used to move all of the
    bits in the operand left or right a given number of times. They come in quite
    handy when you need to divide or multiply integer values. For example, the value
    3 is also 11 in binary notation or (1 * 2) + 1). Each character in binary notation
    represents a bit, which is the smallest piece of a computer''s memory that you
    can modify.


