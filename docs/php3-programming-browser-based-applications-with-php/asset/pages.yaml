    Runs the configuration program and forces it to set up the installation so that
    MySQL is installed to /usr/local/mysql.


    +   3. make

    Compiles MySQL.


    +   4. make install

    Installs MySQL.


    +   5. echo "/usr/local/mysql/lib/mysql" >> /etc/ld.so.conf

    Appends the MySQL library to the configuration file of the ldconfig command. The
    directories in this configuration file are searched (for library files) when Linux
    starts or the ldconfig command is run.


    +   6. ldconfig -v | grep libmysqlclient

    The ldconfig command reads the directories listed in the /etc/ld.so.conf and caches
    all of the libraries found. The grep searches the large amount of output from
    the ldconfig command for the MySQL library and limits the text displayed to something
    like libmysqlclient.so.6 => lib-mysqlclient.so.6.o.o.


    +   7. echo "/usr/local/mysql/bin/safe_mysqld > /dev/null 2>&1" >> /etc/rc.d/rc.local

    Appends the MySQL startup command to the /etc/rc.d/rc.local file so that MySQL
    is automatically started when Linux starts.'
