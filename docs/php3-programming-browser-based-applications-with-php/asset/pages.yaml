    # How Are Cookies Created and Read?


    Cookies are set using a Set-Cookie: HTTP header with five pos-

    sible fields separated by a semicolon and a space. These fields are:


    +   - cookie-name=cookie-value;name of the cookie and its value.

    The name and the value combined must be less than four kilo-

    bytes in length.


    +   - expires=expiration-date;the date the cookie will be deleted

    from the cookie file. You can delete a previously set cookie

    ahead of schedule by creating a second cookie with the same

    name, path, and domain, but with an expiration date in the

    past.


    +   - path=cookie-path;combines with the domain name to deter-

    mine when a browser should show the cookie to the server.


    +   - domain=server-domain;used to determine when a browser

    should show the cookie to the server. Usually, cookies are created

    with the Web server''s name without the www. For example,

    .foo.net instead of www.foo.net. Notice that the leading period

    is retained.


    +   - secure=ensures the cookie is only sent back to the server

    when a secure HTTP connection is established.


    When all of these elements are put together they look like this:


    ```

    Set-Cookie: user_addr=pppl1.dialin.iupui.edu;

    expires=Wednesday, 09-Nov-99 00:00:00 GMT; path=/cgi-bin/;

    domain=engr.iupui.edu; secure

    ```


    Web servers pass cookie information to CGI programs using thenHTTP_COOKIE environment
    variable. The cookie fields are delimited by a

    sicolon and a space, and the name-value pairs are separated by equal signs. Fortunately,

    You''re using PHP! PHP automatically parses the HTTP_COOKIE variable-

    acing the results into the $HTTP_COOKIE_VARS array and also

    into normal PHP variables. If you have a cookie called "user," you

    can access its value using $user.'
