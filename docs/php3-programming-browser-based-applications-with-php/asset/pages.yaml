  md: "# Objects and PHP\n\nArmed with the OOP terminology discussed in the first\
    \ half of this chapter, you're ready to see how the inventory class is defined:\n\
    \n```\n// Begin the class definition.\nclass cls_inventory_item {\n    // Declare\
