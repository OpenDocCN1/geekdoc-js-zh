  md: '# IDREF- and IDREFS-Type Attributes


    These attributes are meant to be used in conjunction with ID-type attributes,
    as a sort of built-in intra-document cross-reference or link. In HTML, as you
    know, the <a> tag''s href attribute can point to a location within the document
    where the <a> tag appears, using the #location format. (The target location itself
    must be marked with an <a name="location"> tag.) This is directly analogous using
    an IDREF/IDREFS attribute to point to an ID attribute.


    The value of an ID attribute must be the value of an ID attribute somewhere in
    the document; an IDREFS attribute takes as its values (plural), separated by spaces,
    of one or more ID attributes in the document.


    Consider an XML application for describing a company to potential job applicants
    and customers. We might find something like the following ATTLIST declarations
    in this application''s DTD:


    ```

    <ATTLIST contacttype ID >

    <!ATTLIST appinfo hrcontact IDREF >

    <!ATTLIST custinfo officecontacts IDREFS >

    ```


    A document based on this DTD might then include the following fragments:


    ```

    <contact contacttype="hr">

    <contact contacttype="main">

    <contact contacttype="northamerica">

    <contact contacttype="europe">

    ```


    Each contacttype element, presumably, includes address, phone, email, and fax
    information for getting in touch with the given office. Elsewhere in the document,
    we might find something like:


    ```

    <appinfo hrcontact="hr">Looking for a job?</appinfo>

    <custinfo officecontacts="main northamerica europe">

    Contact our sales offices

    </custinfo>

    ```


    Note that it''s up to an application to actually navigate through or provide any
    other processing of IDs and corresponding IDREF/IDREFS attributes; there''s no
    processing built into XML to do so. Also note that there''s no way to specify
    that an IDREF/IDREFS attribute''s value must come from a particular ID'
