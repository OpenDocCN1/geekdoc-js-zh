  md: '# Configuring the Application for a New Database Table


    How would you go about converting the application to support maintenance to a
    table other than english_month_names? Without going into too much detail, I''d
    recommend the following:


    +   - Copy the five .php3 and .inc files so that the new files have a prefix equal
    to the new database table name.


    +   - Modify the initialization section of (table_name).php3. Specifically the
    $table_name and sort variables that need to be changed.


    +   - Modify the actions file. You will need to change the end of the get_record_info
    function to account for different field names. The form displayed by display_form
    and its parameters also need to be changed. The clone_record and edit_record actions
    both call display_form and, therefore, need modification. The rest of the changes
    are simply a matter of updating the dynamic SQL statements to reflect the new
    fields.


    +   - Modify (table_name)_dsp_i1_rec_hdr.inc to use additional td tags as needed.


    +   - Modify (table_name)_dsp_i1_rec.inc to use additional td tags as needed.


    +   - And last, modify (table_name)_insert_form.inc to let users enter information
    for the new table.


    After a bit of practice, it should take less than 15 minutes to make all of these
    changes.


    # Summary


    This chapter showed how applications can be created organically, one piece flowing
    into another. If it helps, think of each file and function as Lego blocks. Try
    to recapture the joy of building solid, yet flexible structures.


    We discussed the guiding principles behind creating applications include using
    variables as much as possible. Hard-coding table names and field names should
    be avoided if possible.'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'Remember that each place that a table name or field name appears is another
    place that needs changing when converting the applicatio to a new table.


    Another guiding principle we talked about was “reuse, reuse, reuse.” Whenever
    it makes sense, functions should be used to make code self-documenting and to
    hide complexity.


    You might be wondering, what if everything was variable? Does that mean that the
    list application would never need conver-sion again? If all aspects of list maintenance
    used variables (table names, field names, sort orders), you would have the ultimate
    administration tool! Well, such a tool exists (it''s called phpMyAdmin) and is
    described in the next chapter.


    Unfortunately, a generic tool such as phpMyAdmin is not accept-able for end-users
    (as opposed to developers) to use. It is too pow-erful. And because it shows all
    tables and all fields, it might show too much information to the user.


    To conclude, even though a tool like phpMyAdmin does exist, you''ll still find
    yourself making custom list applications, if for no other reason than to use corporate
    logos and frames so that appli-cation navigation is easier.'
