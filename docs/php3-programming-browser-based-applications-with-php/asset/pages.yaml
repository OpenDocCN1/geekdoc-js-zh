  md: '# 392

    Chapter 16 / XML


    As previously mentioned, XML allows you to use the first choice. This is tedious
    (and the result is difficult to read) when there are many such characters; unfortunately,
    because XML dialects have no built-in tags, you cannot then turn to the second
    choice.



    The XML specification gets around this problem by providing a special form of
    markup to delimit what are called marked sections. A marked section begins with
    the characters


    ```

    <![CDATA[

    terminates with the characters

    ```


    These special characters tell an XML processor, “Don’t interpret as markup anything
    in here that just happens to look like markup. A simple example of a marked section
    might be


    ```

    <![CDATA(1 + 1) < (2 * 5) > 4]]

    ```


    # Processing Instructions


    Processing instructions (PIs for short), as the name suggests, provide commands,
    parameters, or other instructions that might be used by some application other
    than the XML parser itself. Their exact contents can’t be defined by the XML specification
    because this downstream application might not even be XML-aware. The general form
    of all PIs is the same, though:


    ```

    <?target pseudoattributes ?>

    ```


    The target is the specific “signal” that a downstream application is geared to
    anticipate; the pseudoattributes (which look like normal attribute-value pairs)
    are one or more commands, properties, and so on, that have meaning in the context
    of application. For example, suppose the XML is to be digested and processed by
    an XML-aware word processor. A PI for a hypothetical application might look something
    like this:


    ```

    <xml pagebreak="yes" header="no" ?>

    ```


    Again, this is simply a hypothetical example; the exact form that a PI may take
    is determined by the downstream application’s requirements.'
