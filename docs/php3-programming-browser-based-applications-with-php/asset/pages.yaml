  md: '# Perl-Style Functions


    The limit parameter is useful if you need to extract a specific number of items
    from a target string. The following code shows how to extract the first word in
    a sentence:


    ```

    $target = "Quickly, the lazy fox jumped.";

    $arr_words = split(/[[:space:]]/, $target, 1);

