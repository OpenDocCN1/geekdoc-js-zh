  md: "# Functions\n\nIf auto-increment operations inside the one() function affected\
    \ the $a variable, you would expect the echo function to display a=11. However,\
    \ it doesn't. Instead, this example displays a=10.\n\nDesigning functions that\
    \ modify their parameters is not usually a good idea. To explain why that means\
    \ that we have to delve into a bit of programming philosophy. When two pieces\
    \ of code share information, they are said to be tightly coupled. When one piece\
    \ of code is changed—perhaps to add features—typically the other also needs changes.\
    \ Because both pieces of code need to be changed at the same time, the change\
    \ you create lightly coupled code, the changes are isolated and the incidence\
    \ of errors is reduced. On the gripping hand, sometimes functions need to change\
    \ the value of their parameters.\n\nWhen functions must change their parameters,\
    \ those parameters need to be passed by reference. Giving functions variable references\
    \ provides them with a memory address where the variable's value is stored. The\
    \ following code shows the one function changed so that it accepts variable references:\n\
    \n```\nfunction one(&$parameter) {\n  $parameter++;\n}\n\n$a = 10;\none($a);\n\
    echo \"a=$a<br>\";\n```\n\nThis short program displays a=11; showing that one()\
    \ function changed the $a variable. Notice that the only change needed to accept\
    \ variable references is the addition of an ampersand before the parameter name\
    \ in the function definition.\n\nIf you use functions provided by another programmer,\
    \ you may not have the luxury of changing the function definitions. In that situation,\
    \ you can add an ampersand before the parameter in the function call like this:\n\
    \n```\none(&$a);\n```\n\nBefore leaving the topic of parameter passing, it's worth\
