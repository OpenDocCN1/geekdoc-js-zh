    # MySQL''s Utilities


    The MySQL distribution contains many useful utilities (in/usr/local/mysql/bin).
    The following list ensures that you are aware of them:


    +   - comp_err—This program generates language-specific message files.

    - isamchk—This program describes, checks, and repairs ISAM tables. It is also
    used to optimize your tables.


    # Listing C.1 The edited results of isamchk-help


    ```

    Usage: ./isamchk [OPTIONS] tables[.ISM]

    -a, --analyze     Analyze distribution of keys. Will make some joins in MySQL
    faster.

    -#, --debug=      Output debug log. Often this is ''d:t:filename''

    -d, --description Prints some information about table. Check the table VERY thoroughly.

    n-e, --extend-check One need this use only in extreme cases as isamchk should
    normally find all errors even without this switch.

    -f, --force       Overwrite old temporary files. If one uses -f when checking
    tables (running -r), isamchk without will automatically restart with -r on any
    wrong table.

    -?, --help        Display this help and exit.

    -i, --information Print statistics information about the table.

    ```'
