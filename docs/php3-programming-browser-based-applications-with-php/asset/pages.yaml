  md: '# The XML Answer


    In many ways, XML overturns the rickety HTML applecart. Because there are no built-in
    tags under the XML standard, a browser can''t make any decisions on the user''s
    behalf that a given tag is to be rendered, by default, in a certain way. The tags
    in an XML document must appear in a structured way, fully nested within or following
    other tags, and since none of these tags has any inherent display characteristics,
    the document is all about structure (the relationships among the tags and tag
    pairs) and contents (the text appearing within the tag pairs).


    And finally—most importantly—because there are no built-in tags, the developer
    of a class of XML documents is free to construct meaningful tags, simplifying
    enormously the task of exchanging data with other applications.


    # Differences between HTML and XML


    It may be useful, before proceeding into the specifics, to look at some of the
    general ways in which XML is obviously not the same beast as HTML. Here’s a brief
    list:


    +   Balanced tags—Web browsers are notoriously casual about the nesting of HTML
    tags. If an opening `<b>` tag is followed by an opening `<i>`, but the closing
    `</b>` occurs before the closing `<i>`, the browser happily ignores the overlapping
    scopes of the two tags. XML processors, by contrast, reject this out of hand.


    +   No insignificant whitespace—HTML flattens successive occurrences of whitespace
    (blanks, tabs, newlines) into a single blank. XML starts with the presumption
    that the document author intended to put whitespace where it is, and therefore
    treats it all as “meaningful.” (XML processors vary in their insistence on this
    point, and there is also a way to override this formal requirement as explained
    later in this chapter).


    +   Case-sensitivity—In a standard HTML-based Web page, you can code your markup
    in uppercase, lowercase, or mixed case, depending on your owns tastes and affinity
    for using the Shift key. XML on the other hand, sees a tag like `<shopkeeper>`
    as a completely different tag from `<ShopKeeper>`, `<SHOPKEEPER>`, and so on.'
  merge: -1
  pgno: 405
- img_proc: true
  md: '+   Unicode—This may not seem like a big deal to you if you''re a developer
    in the United States, the United Kingdom, or Australia, but it''s a very big deal
    elsewhere. Not only the document contents, even the markup itself, can now be
    based on any language encoding available under the complete Unicode standard.
    While the punctuation used in markup—<, =, >, and so on—remains standard, XML
    developers can use Cyrillic, Kanji, Hebrew, and virtually all the rest of the
    world''s character sets in their tag and attribute names.


    # The Role of the XML Parser


    The XML specification makes heavy use of the term “XML processor” as a synonym
    for a specific kind of software, software which reads XML documents, interprets
    the legitimacy of the tag nesting, perhaps normalizes whitespace, and so on: in
    short, a parser. (Note that in this chapter, “XML processor” is used somewhat
    loosely.)


    HTML software uses parsers, too, of course. But because of the looseness of the
    HTML specification, these are damnably difficult to code; they''ve got to allow
    for all possible variations of improperly nested or unbalanced tags, for instance.
    One legendary goal of the XML spec''s authors, by contrast, is that an XML parser
    should require no more than a few days work by a graduate student.


    Things haven''t worked out quite so neatly in the real world, but it remains true
    that XML''s tighter rules greatly simplify the life of the software developer.

    When a parser runs, assuming the markup is clean, it returns one of two kinds
    of data to the higher-level processor. First, it can fire off a serialized chain
    of events: “Book tag has a value of ‘1999’ . . Chapter tag begins ... Section
    tag begins ... Content tag begins ... content of the Content tag is: ‘Jack and
    Jill’ . . ” and so on. This is a highly efficient way of processing XML (or any
    other structured text). On the other hand, it requires more work on the part of
    the higher-level processor, which typically needs to process entire branches of
    the document tree at one time, rather than the serialized minutiae that make up
    the branches.'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'More recent parsers take advantage of a related specification, the Document
    Object Model (DOM), to address this issue. A DOM parser returns to the calling
    program a complete tree, or a branch of it, which may be manipulated as a discrete
    but complete object. The drawback of using a DOM parser tends to be the large
    memory requirements of processing multiple, perhaps quite large, objects at one
    time.


    In either case, parsers are fundamental and largely indivisible chunks of software.
    Periodically, a newbie to an XML-related mailing list will assert that he or she
    is looking for (say) a parser to “display XML” in a certain way, causing a nearly
    audible groan from the list''s old-timers. Parsers only read and parse XML, they
    don''t process it or display the data that it contains. Now you know better!


    # Core XML


    In the preceding pages, you may have noticed the word “document” used quite a
    bit, as a way of characterizing a single unit of XML. This isn''t meant to imply
    that XML is simply a document-management or desktop-publishing tool (although
    it can be those things). Rather, the term “document” is a holdover from SGML—which
    was meant to serve those two purposes. In practice, what was referred to as an
    XML document can be anything from the traditional “document” to a database.


    So, then: What can you find in one of these XML “documents”?


    # Markup and Text


    At the greatest level of analysis—simply assessed by eyeball—a document contains
    text and only text. Of course, this is true of HTML (and SGML) as well. All the
    glittery images, multimedia, and other window dressing in a Web page are not actually
    in the document itself; rather, they''re pointed at by specially-formatted text—that
    is, special. These tags and other elements of markup (all the stuff''s not document
    content per se) fall into six broad categories, most (but not all) of which will
    be familiar to you from HTML. (A seventh category, notations, will be covered
    in the section detailing the document type definition.)'
