    // match at least one non-word character.

    $space = ''\W+'';


    // match any number of anything except newlines.

    $string = ''.*'';


    $pattern = "/^\($word) $space ($word) $space ($string)/x";

    preg_match($pattern, $target, $matches);

    $one = $matches[1];

    $two = $matches[2];

    $rest = $matches[3];

    ```


