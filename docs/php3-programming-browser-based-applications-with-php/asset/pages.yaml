  md: '# phpMyAdmin: An Open Source Front End To MySQL


    The author of phpMyAdmin, Tobias Ratschiller, was kind enough to write most of
    this chapter. phpMyAdmin is one of the few browser-based user interfaces to MySQL.
    And I think installing and using phpMyAdmin is critical if you want to be highly
    productive.'
  merge: -1
