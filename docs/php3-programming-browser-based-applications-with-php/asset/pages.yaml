  md: '# XML


    XML is like HTML on steroids. Instead of describing a Web page (like HTML does),
    XML describes information. Each use of XML is controlled by a Document Type Declaration
    (DTD) and therein lies much of its power to change the world. John E. Simpson,
    author of Just XML, contributed significantly to this chapter.'
