    # Debugging CGI Programs


    One of the main reasons to use CGI program is to generate HTML documents. When
    something goes wrong, the most common error message is "500 Server Error." This
    most unhelpful message can be caused by several things. For example, the first
    line of output was an invalid HTTP header, there might not be a blank line after
    the HTTP header, or you could simply have a syntax error.


    # Sending Output to the Server''s Log File


    Keeping track of your error messages in the server log file is a quick and easy
    way to debug. Additionally, you''ll always know where the messages are, which
    helps if you''re working with a team of programmers.


    PHP provides the `error_log` to send with error messages to the Web server''s
    log file, to an email address, and other places. We''ll concentrate on the log
    file option in this section. Listing 12.3 adds two messages to the Web server''s
    log file using the `error_log` function.


    **Listing 12.3** *server_log.php3*—The *error_log* function sends messages to
    the Web server''s log file


    ```

    <?php // server_log.php3

    header("Content-type: text/plain\n");

    echo "This is line one.\n";

    error_log("GOOD Status\n");

    error_log("BAD Status\n");

    echo "This is line two.\n";

    ?>

    ```


    This script displays the following lines in the Web browser:


    This is line one.

    This is line two.'
