  md: 'XML tag, the attribute (preceding the equals sign) and its value

    following the equals sign) are in boldface:


    ```

    <customer id="ab647389">...</customer>

    ```


    Aside from the required single-valued form of attributes familiar

    to you HTML, XML attributes may also be multi-valued

    (separated by spaces). For instance:


    ```

    <customers id="ab6473 f13450 pd0993">...</customers>

    ```


    What value(s) a given attribute may contain, and whether supplying

    an attribute is required, and whether there''s a default value may

    be by the developer of this class of document in a set of

    rules called a document type definition (DTD). (DTDs are covered

    det later in this chapter). At this time, a DTD cannot

    constrain an attribute''s value in more sophisticated ways, such as

    by data type or numeric range.


    Every XML document, whether or not it is based on a DTD, can

    include either or of two built-in attributes to any element:

    xml:lang and xml:space. Both of these attributes are interesting in

    the effects "trickle down" to any elements contained by the\lement to which they
    are assigned.


    The xml:lang attribute identifies the language (human, not

    machine!) in which the element''s content is expressed. The value of

    the xml:lang attribute must be one of the standard two-character

    ISO for languages, such as “EN” for English and “DE"

    for German. Here are a couple examples of xml:lang use in a

    hotothetical xml dialect:


    ```

    <socialtalk xml:lang="EN">

    <greeting>Hello</greeting>

    <closing xml:lang="IT">Arrivederci</closing>

    </socialtalk>

    ```


    In this example, the first xml:lang says that any element content\within the scope
    of the socialtalk element is to be considered as

    English, unless explicitly overridden. Because the greeting element\does not include
    an xml:lang attribute, the processor assumes its

    content to be in English. The second xml:lang overrides this

    default—only within the scope of this closing element—to indicate

    that its contents are in Italian.'
