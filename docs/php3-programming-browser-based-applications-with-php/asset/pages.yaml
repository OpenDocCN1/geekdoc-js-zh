  md: 'This allows for a wide range of possible documents for scheduling an appointment,
    including varying amounts of specificity about a date, a locale, and attendees.


    # Special Case #1: Empty Elements


    The DTD''s designer can specify that an element include nothing in its content
    model with the special keyword EMPTY. For instance:


    ```

    <!ELEMENT website (EMPTY) >

    ```


    says that a document, including a Web site element, cannot have any text or other
    elements between the starting <website> and the closing </website> tags. (Or,
    of course, the document can simply use the <website/> syntax.)


    # Special Case #2: Mixed Content


    Sometimes, it may be desirable that an element contain either text content or
    content element, intermingled. The most common example of this from HTML is the
    <p> tag; in a paragraph you can have plain text, italicized text, boldface text,
    strong or emphasized text, anchor ("href") tags, and so on, and they can appear
    in any order. To define such an element, the DTD''s designer uses what''s called
    a mixed content model, as in the following:


    ```

    <!ELEMENT review (#PCDATA | emph | uri | linebreak )* >

    ```


    In a mixed content model, the list of elements must be delimited by the | symbol,
    and the list must follow the #PCDATA keyword. Note that omitting the asterisk
    after the content model would mean that only one of the choices may be included
    and it may occur any number of times.


    # Special Case #3: ANY Content


    In rare cases, you may come upon an element definition such as the following:


    ```

    <!ELEMENT hodgepodge ANY >

    ```


    In this hypothetical case, a <hodgepodge> tag may legally contain any content
    at all (although it contains other elements, they must also be defined in the
    DTD).'
