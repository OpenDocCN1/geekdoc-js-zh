    ORDER BY

    int_age;

    ```


    # Resulting Set of Records:


    | item |

    | <option value="64">Florence Henderson</option> |

    | <option value="86">Florence Alexander</option> |


    The AS keyword is very useful when using calculated columns. It is also useful
    when processing result sets from more than one table when the field names aren''t
    the same. For example:


    ```

    SELECT

    fname as str_name_first

    FROM

    table01;


    SELECT

    str_name_first

    FROM

    table01;

    ```


    You can use the same PHP code to process the result sets from these statements
    because the field names are identical, thanks to the AS keyword.'
