- img_proc: true
  md: '# Perl-Style Functions


    # Description


    preg_replace searches the TARGET parameter for matches to PATTERN, replacing any
    matching text with REPLACEMENT.


    The data types of the parameters are mixed because every parameter to preg_replace
    can be either a scalar or an array. And its behavior changes slightly depending
    on the data type of the parameters. Using scalar PATTERN and array REPLACEMENT
    parameters is not valid.


    If TARGET is an array, then preg_replace performs its magic on each element of
    the array. If PATTERN is an array, the search and replace task is performed once
    for each element in the PATTERN array. If both PATTERN and REPLACEMENT are arrays,
    then elements from each are paired in order to perform the search and replace
    task. If not enough replacement entries are supplied, empty strings are used.


    Patterns can contain parenthesized substrings, like the preg_match function. However,
    their use is slightly different. You can refer to each matching substring using
    \n notation, where n refers to the mth parenthesized substring. Up to 99 substrings
    can be used. The special notation \0 refers to the text matches by the entire
    pattern.


    # Return Value


    Returns the changed string(s) or the original string(s) if no changes were made.
    The data type of the return value corresponds to the data type of TARGET.


    # Example


    The following example show the different combinations of data types. First, all
    numbers in a scalar target string are replaced with plus signs:


    ```

    $target = "12AB 13ABB 14ABBB";

    $pattern = "\d+\+";

    $replacement = "+";

    $result = preg_replace($pattern, $replacement, $target);

    echo "\$result<br>";

    ```


    This code displays


    +AB +ABB +ABBB'
