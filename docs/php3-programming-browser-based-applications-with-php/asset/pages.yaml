  md: '# An Introduction to SQL


    Notice that the field alias can be used in the having clause, making the query
    much easier to understand.


    This query is not a good example of the having clause because it is inefficient.
    As it currently reads, all five records in the database are aggregated, which
    results in the having clause examining two records—the oldest Charles and the
    oldest Florence. Since the having clause examines a person''s age, it is more
    efficient to use a where clause that filters records before the aggregation is
    done. The following SQL statement uses a where clause to filter out of the five
    records in the table; thus the group by and the having clauses must examine only
    one record. Obviously, this results in a much faster query if you imagine it run
    against a table with thousands of records.


    ```

    SELECT

    str_name_first

    ,MAX(int_age) AS OLDEST_PERSON

    FROM

    select0

    WHERE

    int_age > 65

    GROUP BY

    str_name_first;

    ```


    # Resulting Set of Records:


    +----------------+----------------++

    | str_name_first | OLDEST_PERSON |

    +----------------+----------------++

    | Florence        | 86             |

    +----------------+----------------+


    A better use of a having clause would involve filtering based on the summation
    of a set of records. For example, let''s say you need the sum of all rent paid
    from January to March (the first quarter of the year) and want to filter out records
    whose sum is greater than zero this example is better than using the maximum because
    you are filtering based on the calculated field instead of an actual field, which
    results in fewer records being compared to find the maximum value. And comparing
    fewer records means your SQL statement executes faster.'
