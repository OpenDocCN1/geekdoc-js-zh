  md: '# Accessing HTML Form Information


    When the mysql_connect function is called and the connection fails, the mysql_connect
    function normally displays:


    Warning: MySQL Connection Failed: Access denied for user: `codebits@localhost`
    (Using password: YES)


    Most applications need to precisely control what is displayed, especially applications
    that are highly graphical. Using an at sign (@) in front of the mysql_connect
    function causes error messages to be suppressed.


    Notice the action attribute of the form statement specifies the connect.php file
    to be executed when the submit button is clicked. This is an example of recursive
    programming, that is having the php file call itself.


    I use recursive programming techniques to keep all code related to a single "topic"
    in the same file. Deciding to combine functionality into one file or split your
    code into several files takes a bit of experience. My rule of thumb is to create
    a separate file when the code implements a specific function goes over 100 lines
    of code or so.


    # Accessing HTML Form Information


    If you enter a password and click Connect to Database, the connection still fails
    because connect.php doesn''t use the values entered into the form when making
    its database connection.


    The PHP engine plants each form field into an array called `$_POST_VARS`. In the
    case of our example, the array has two entries: `username` and `password`. Inside
    your script, you can access the form information via `$_POST_VARS[''username'']`
    and `$_POST_VARS[''password'']`.


    Using `$_POST_VARS[''password'']` to access form information seems simple, but
    you''ll find some hidden "gotchas". The first is checking to see if the name of
    the field (''password'') in this instance is uppercase, lowercase, or mixed-case.


    A second "gotcha" involves a topic not directly related to our example. Besides
    being run via forms, PHP scripts can also be run using an URL. For example:


    ```

    http://...connect.php?username=root&password=password

    ```'
  merge: -1
  pgno: 130
- img_proc: true
  md: "You can see that the username and password information is being passed on the\
    \ URL. The question mark character (?) starts the field information and the ampersand\
    \ (&) character delimits the fields. Fortunately, the PHP engine parses the URL\
    \ line automatically. The results of the parse are placed into the `$HTTP_GET_VARS`\
    \ array.\n\nThe \"gotcha\" (if you want to consider it) is that your script can\
    \ get its information from more than one location—either the `$HTTP_GET_VARS`\
    \ or `$HTTP_POST_VARS` array.\n\nMy solution to these (and other) gotchas is to\
    \ create an `$arr_request` array that gets initialized with information from both\
    \ `$HTTP` arrays. I use the following code in `common.inc` to initialize your\
    \ `$arr_request` array:\n\n```\n// declare the request array which holds both\n\
    // url-based (get) and form-based (post) parameters.\n$arr_request = array();\n\
    \n// move the url and form parameters into the\n// request array. Form parameters\
    \ supercede url\n// parameters. Additionally, all keys are converted\n// to lower-case.\n\
    if (count($HTTP_GET_VARS)) {\n    while (list($key, $value) = each($HTTP_GET_VARS))\
    \ {\n        $arr_request[strtolower($key)] = $value;\n    }\n}\nif (count($HTTP_POST_VARS))\
    \ {\n    while (list($key, $value) = each($HTTP_POST_VARS)) {\n        $arr_request[strtolower($key)]\
    \ = $value;\n    }\n}\n```\n\nIf you include the `common.inc` file in all of your\
    \ PHP scripts, it won't matter how your script was run. All the information passed\
    \ winds up in the `$arr_request` array with lowercase keys. This means that the\
    \ username information can be accessed with `$arr_request['username']`.\n\nPHP\
    \ provides an alternative to the `$HTTP_GET_VARS` and `$HTTP_POST_VARS` arrays.\
    \ HTML form and URL-based information is also accessible directly as the PHP variable.\
    \ For example, form information from a field defined as `<input type=\"input\"\
    \ name=\"last_name\">` can be accessed using `$last_name` in your PHP"
