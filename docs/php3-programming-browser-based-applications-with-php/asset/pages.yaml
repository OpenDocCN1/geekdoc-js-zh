  md: "Another option involves using a generic function to set and get values:\n\n\
    ```\nfunction get($property) {\n  return($this->props[$property]);\n}\n```\n\n\
    ```\nfunction set($property, $value) {\n  $this->props[$property] = $value;\n\
    }\n```\n\nThese functions are called like this:\n\n```\n$pen->set('ink_color',\
    \ 'purple');\necho $pen->get('ink_color');\n```\n\nThis approach may seem like\
    \ a good idea at first, especially because you only need to define these two functions\
    \ in your parent class and let them be inherited. However, deeper thought shows\
    \ some potential problems:\n\n+   - Having generic accessor functions means you\
    \ can't property-based validity checking. For example, it doesn't make sense for\
    \ the qty_on_hand property to ever go negative. But what if you want your set_qty_on_hand\
    \ function to display a warning, send email, or otherwise handle a negative quantity\
    \ value?\n- Having generic accessor functions also means you can't any property-based\
    \ security. For example, if you have a situation in which you want to let Bob\
    \ know the names of employers but not their salaries, you couldn't do that with\
    \ this approach.\n\nHowever, the most important reason is to eliminate a source\
    \ of bugs. It is quite easy to make a mistake when typing a property name. When\
    \ using generic accessor functions, PHP can't catch this error and very subtle,\
    \ hard-to-find bug infect your program. For example, the following code is wrong:\n\
    \n```\n$pen->set('ink_clr', 'green');\n```\n\nIf you made the same type of typing\
    \ error with specific accessor functions, the PHP engine reports the error because\
    \ the set_ink_colr function isn't found:\n\n```\n$pen->set('ink_colr('green');\
    \ <- run-time error!\n```"
