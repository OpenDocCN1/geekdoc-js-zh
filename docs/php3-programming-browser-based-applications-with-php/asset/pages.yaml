- img_proc: true
  md: 'Finally, there is a special type of entity—the parameter entity—reserved for
    use only within a DTD. Let''s say that most of the attributes in the DTD are of
    type CDATA, with a default specification of #IMPLIED (a very common situation).
    Rather than spelling that out in all the ATTLIST declarations, the DTD author
    can define a parameter entity for using this format (note the “%” sign):


    ```

    <!ENTITY % genattrib "CDATA #IMPLIED" >

    ```


    ATTLIST declarations can then use this entity, as in the following:


    ```

    <ATTLIST colorspec rgb %genAttrib;

    <ATTLIST colorspec cmyk %genAttrib;

    ```


    and so on.


    # NOTATION KEY


    Notations are a holdover from SGML. Basically, their purpose is to define classes
    of non-XML—particularly binary—content that may need to be “included” in a document.
    (The “included” is sort of theoretical, of course, since only text can appear
    in an XML document.) This is a somewhat bizarre notion to HTML-aware developers,
    accustomed as they are to using simple hyperlink and <img> tags, for example,
    to achieve the same purpose. Nevertheless, you should be aware that you may encounter
    them at some point.


    The general format for a notation declaration is


    ```

    <!NOTATION notationname externalID >

    ```


    To repeat: notations do not define specific non-XML content such as “logo.gif”
    or “soundtrack.mp3,” but rather, classes of non-XML content such as “gif” or “mp3”.
    The externalID portion of the declaration points to some external resource which
    “knows about” this particular class of content. At least, spatially, the most
    familiar form of the externalID uses the SYSTEM keyword and an URL, like:


    ```

    <!NOTATION realaudio SYSTEM "http://www.real.com" >

    ```


    The problem is that there''s not really anything specific at that URL to process
    RealAudio files; there''s to be sure, in compressed form—but it needs to be downloaded
    and installed.'
  merge: -1
  pgno: 427
- img_proc: true
  md: '# XML Applications


    So you could assume that the program has been installed, and use something like
    this:


    ```

    <INOTATION SYSTEM

    "file:///C:\Program Files\Real\rplayer.exe" >

    ```


    That falls down, of course, as soon as someone installs the program to a different
    folder, let alone if they''re using a non-Microsoft file system.


    (Alternatively, the DTD may replace the SYSTEM keyword with PUBLIC, and the URL
    with a standard "catalog name" for the media type. Although this has one advantage—it
    ducks the whole question of what, exactly, the URL is to point to—it also has
    a major drawback: Few non-SGML dieards, or even know how to use, these PUBLIC
    identifiers.


    Again, it''s unlikely (for all the above reasons) that you''ll actually encounter
    notations in XML documents for the foreseeable future. If you do, you''ll find
    them used in concert with a special form of entity, the external binary entity.
    These are declared using this syntax:


    ```

    <ENTITY entname SYSTEM "url" NDATA notationname >

    ```


    The notationname must match the name of a notation declared previously in the
    DTD, for instance, in this entity declaration:


    ```

    <ENTITY corplogo SYSTEM "images/logo.jpg" NDATA jpg >

    ```


    where the notation named "jpg" must have been defined earlier. Working together
    in this way, the entity and notation declarations tell the downstream application
    both what specific external resource to retrieve and how to process it, respectively.


    # XML Applications


    With all the hype surrounding XML as the tool for solving e-commerce problems,
    search engine problems, and so on, you''d expect to find plenty of existing applications.
    And so are there. We''ll take a brief look at two here: DocBook and SMIL.'
  merge: -1
  pgno: 428
- img_proc: true
  md: '# DocBook


    DocBook has been around since the early 1990s, developed by a consortium that
    represented such vendors as the publisher O''Reilly and Associates, Sun, Novell,
    Hewlett-Packard, and others. It is currently maintained by the non-profit OASIS
    (The Organization for the Advancement of Structured Information Systems). It''s
    in wide use among organizations publishing any kind of technical documentation,
    including the founders of the original pre-OASIS version. There''s nothing in
    particular about it that restricts its use to technical books and papers, though.


    # Note


    The PHP documentation uses the DocBook DTD.


    (As you might guess from the date in the preceding paragraph, "official" DocBook
    predates the XML standard and is pure SGML. However, an unofficial XML version
    is, as of this writing, up to version 3.1.)


    The DocBook DTD (actually a cluster of DTDs, assembled into a "virtual DTD" through
    use of parameter entities) is enormous and quite complex. In general, a DocBook
    document includes expected tags such as `<book>` and `<chapter>`, but may also
    include such esoteric items as `<colophon>`, `<seeIE>` (a "See, for example entry
    in an index), and so on.


    # Synchronized Multimedia Integration Language (SMIL)


    SMIL is a standard proposed by RealNetworks and other vendors and formally accepted
    as a W3C Recommendation in June 1998. SMIL documents are used to specify the layout,
    sequencing, and timing of streaming-media presentations. For example, you can
    construct a repeating slide show consisting of text (closed captions, perhaps)
    synchronized with a film and or audio clip. (At this time, only one of them—RealNetworks''
    own G2 RealPlayer—is sufficiently popular that it''s worth paying attention to.)
    Each SMIL document consists of tags marking the heading, layout, and actual content.
    Here''s an example, taken from the RealNetworks "DevZone" Web site:'
  merge: -1
