    # Using HTML Form Information


    Now that you can easily access form information from your PHP scripts, it''s time
    to use that information to make the database connection. The first step is to
    examine the code that makes the connection.


    ```

    $id_link = @mysql_connect(''localhost'', ''affy'', ''affy'');

    ```


    In this line of code, the username and password are string literals. In order
    to make use of the form information, this line needs to be changed to variables:


    ```

    $id_link = @mysql_connect(''localhost'');

    $username;

    $password);

    ```


    Now that variables are being used, they need to be initialized. The following
    lines of code perform the initialization:


    ```

    if ( count($arr_request) {

    $username = $arr_request[''username''];

    $password = $arr_request[''password''];

    }

    else {

    $username = ''phpuser'';

    $password = ''phpuser'';

    }

    ```'
