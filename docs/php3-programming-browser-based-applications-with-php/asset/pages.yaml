    > Even though you won''t know about methods at this point in the chapter, you
    need to know some important tips about inheritance and methods. First, methods
    are inherited just like properties. Second, using inherited methods helps to create
    your program quicker because you are using functionality that is already working.
    Therefore—at least in theory—your programs will be easier to create.


    # Abstraction, or Thinking about Thinking


    In order to discuss abstraction, you need a working definition of the term model.
    How about, “A Model is a representation of something.” Let''s say you build a
    physical model of a car; some of the items in the original car are going to be
    missing from the model, such as spark plugs, for example. If you build a model
    house, you''re not going to include the actual plumbing. Similarly, the computer
    models you build are somewhat abstract: the details don''t matter, just the form.


    Abstraction in object-oriented programming works in the same way. As you present
    the model of your objects to other programmers in the form of an interface. Actually,
    the interface tells others how to interact with any of your classes. Nobody needs
    to know what your classes really do. It''s enough to say that the file object
    stores the filename'
  merge: -1
