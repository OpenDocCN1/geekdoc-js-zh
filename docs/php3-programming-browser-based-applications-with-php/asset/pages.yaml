  md: 'size and presents the information in English. Whether the internal format of
    the information is compressed, Russian, or stored in memory or on the hard drive
    is immaterial to the user of your classes.


    I recommend that as you design an object or class, you occasionally distance yourself
    from the work. Try to view the resulting system through the eyes of another programmer
    to check for inconsistencies and relationships that aren''t needed.


    You’ve learned about abstraction in abstract terms so far. Now let''s use the
    pen class that you created previously to see a concrete example of abstraction.
    The pen class had only one property of its own (the rest were inherited). For
    the sake of argument, the ink color can be “blue,” “black,” or “red.” When a pen
    object is created (the mechanism of creation is unpleasant at the moment), a specific
    color is assigned to it. Let’s use “blue” for the moment. Here is a line of code
    to create the object:


    ```

    $pen = new cls_pen("blue");

    ```


    Now the pen object has been created. Do you care if the internal format of the
    ink color is the string “blue” or the number 1? What if, because you expect to
    use millions of objects, the internal format changes from a string to a number
    to save computer memory? As long as the interface does not change, the program
    that uses the class does not need to change.


    By keeping the external interface of the class fixed, an abstraction is being
    used. This reduces the amount of time spent retrofitting programs each time a
    change is made to a class that the program is using.


    # Polymorphism, or Overriding Methods


    Polymorphism is a bit more complicated than inheritance because it involves methods.
    Let''s make up some methods that belong in an inventory program. How about a method
    to print the properties for debugging purposes or a method to change the quantity-on-hand
    amount? Figure 10.4 shows the inventory_item class with these two functions.'
