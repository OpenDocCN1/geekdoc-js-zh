    # Table 9.1 POSIX character classes


    | Character Class | Description |

    | --- | --- |

    | alpha | Matches all alphanumeric characters. In order words, from zero to nine
    and from a to z. |

    | blank | Matches Space and Tab characters. |

    | cntrl | Matches all characters whose ASCII values are less than 32. See Appendix
    B, “The ASCII Table,” for information about these characters. |

    | lower | Matches all lowercase characters. |

    | space | Matches Space, Tab, newline, linefeed, and formfeed characters. See
    Appendix B, “The ASCII Table,” for information about these characters. |

    | upper | Matches all uppercase characters. |

    | xdigit | Matches all digits in hexadecimal numbers. |


    You can find more detailed information about bracket expressions at http://ftpsearch.lycos.com/help/regexp-manpage.html.


