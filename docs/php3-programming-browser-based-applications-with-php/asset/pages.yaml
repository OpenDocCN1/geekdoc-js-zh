    This is the home page of MySQL. Here you''ll find news, documentation, and the
    latest version available for downloading. You can find many mirrors of this site
    including http://www.buoy.com/mysql.


    # PHPBuilder.com


    ```

    http://www.phpbuilder.com/

    ```


    Next to the PHP home page, this site is probably the most valuable to new PHP
    programmers. Its value lies in the many articles available to peruse. These articles
    include “Learning to Use Regular Expressions by Example,” “Installing Apache,”
    and “Image Creation with PHP.”


    # phpwizard.net


    ```

