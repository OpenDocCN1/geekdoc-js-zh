- img_proc: true
  md: '# Form Processing


    HTML tags are not case-sensitive. For example, <TITLE> is the same as <title>.However,
    using all uppercase letters in the HTML tags make HTML documents easier to understand
    because you can pick out the tags more readily.


    # Tip


    After the document header, you need to have a set of <body>..</</body> tags. Inside
    the document''s body, you specify text headings by using a set of <h1>../</H1>
    tags. Changing the number after the H changes the heading level. For example,
    <H1> is the first level. <H2> is the second level, and so on.


    You can use the <P> tag to indicate paragraph endings or use the <BR> to indicate
    a line break. The <B>...</B> and <I>..</I> tags are used to indicate bold and
    italic text.


    The text and tags of the entire HTML document must be surrounded by a set of <HTML>..</HTML>
    tags. For example:


    ```

    <HTML>

    <HEAD><TITLE>This is the Title</TITLE></HEAD>

    <body>

    <H1>This is a level one header</H1>

    <P>This is the first paragraph.</P>

    <P>This is the 2nd paragraph, it has <I>italic</I> text.

    <H2>This is a level two header</H2>

    <P>This is the 3rd paragraph, it has <B>bold</B> text.</P>

    </body>

    </html>

    ```


    Most of the time, you will be inserting or modifying text inside the <BODY>..</BODY>
    tags.


    # HTML Forms


    HTML forms are designed to let a Web page designer interact with users by letting
    them fill out a form. The form can be composed of elements such as input boxes,
    buttons, checkboxes, radio buttons, and selection lists. All of the form elements
    are specified using HTML tags surrounded by a set of <FORM>...</FORM> tags. You
    can have more than one form per HTML document.


    There are several modifiers or options used with the <FORM> tag. The two most
    important are METHOD and ACTION:'
