- img_proc: true
  md: '# htaccess Authentication


    created using the htpasswd program. The following command creates a new user file
    and adds the user “eugene":


    ```

    htpasswd -c /usr/local/apache/users eugene

    ```


    - -c flag tells htpasswd to create a new user database file or overwrite an existing
    file of the same name. The next argument shows the user file being created/overwritten
    and the final argument, which is the user being added. After entering this command,
    you are prompted to provide a password for the user you are adding. You are also
    prompted to confirm that the password is correct. To add a user to an existing
    file, omit the -c flag.


    An example user file might look like this:


    ```

    eugene:Q/VS9x1vmwHHo

    gerry:ZeconDDJcyrOw

    ```


    # Apache Configuration


    Now that you''ve created the user file, the Web server must be configured to permit
    access to specific files or directories. This is achieved by creating a realm.
    After a user successfully authenticates with the realm, he will not have to enter
    his username and password again until closes his browser or tries to enter a realm
    that has not successfully authenticated with. A realm usually consists of a directory
    and all subdirectories beneath it, although it is possible to have unrelated directories
    in the same realm. The Web server can be configured to permit access to all or
    some of the users in the user file.


    You have two ways to configure the Web server. The directives to create the realm
    can be placed in a .htaccess file in the directory to be protected or within the
    Apache configuration file (/usr/local/apache/conf/httpd.conf) in a <Directory>
    section. An example .htaccess file is shown below:


    ```

    AuthName "Admin site"

    AuthType Basic

    UserFile /etc/httpd/users

    require valid-user

    ```


    +   * AuthName—This directive specifies the realm name. This typically describes
    what you are trying to protect, that is, the administration part of a site or
    a development area, and so forth.'
