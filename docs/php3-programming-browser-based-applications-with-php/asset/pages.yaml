  md: '# One of the most common uses of the update statement involves increasing a
    field in a record, which might look like this:


    ```

    mysql> create table test (a integer);

    mysql> insert into test (a) values (134);

    mysql> insert into test (a) values (100);

    mysql> select * from test;

    +------+

    | a |

    +------+

    | 134 |

    | 100 |

    +------+

    mysql> update test set a = a + 1;

    Query OK, 2 rows affected (0.00 sec)

    Rows matched: 2 Changed: 2 Warnings: 0

    mysql> select * from test;

    +------+

    | a |

    +------+

    | 135 |

    | 101 |

    +------+

    ```


    Notice that both records are changed by the single update statement. In fact,
    that update statement is designed to update every record in the table. This behavior
    is useful when you need to perform a global update. For example, when giving 15%
    raises to all employees:


    ```

    update employees set salary = salary * 1.15;

    ```


    Of course, you won''t be able to afford to give everyone a raise every year. For
    those lean years, you need an update statement with a where clause.


    ```

    update employees

    set salary = salary * 1.15

    where last_name = ''medinets'';

    ```


    > You must surround string literals with single quotes when using SQL update statements.


    MySQL has a large variety of functions, all of which can be used in the expression
    part of the update statement. For example, you'
