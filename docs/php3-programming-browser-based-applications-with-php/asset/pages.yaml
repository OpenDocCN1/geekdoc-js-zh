  md: '# Introduction


    This book, like all of my books, is based on the learn-by-doing principle because
    I believe simply reading about a subject is not the best way to learn. After all,
    you don''t read about putting together a jigsaw puzzle, you put the puzzle yourself
    yourself same way. You must actually run some programs in order to really understand
    the concepts.


    PHP shows how to create applications organically. In this book, you start with
    simple programs and gradually add features.


    The technical topics are covered in a straightforward, non-technical manner which
    allows you to quickly understand the fundamental principles. After the main topic
    of each chapter is introduced, subtopics are explored in their own sections. Each
    section has its own PHP examples.


    The Interlude chapters that are sprinkled throughout the books should appeal to
    hard-core programmers. The goal for the Interlude chapters is to show code use,
    even if all the functions used were not explained in detail in the chapter text.


    # Who Should Use This Book?


    If you''re new to programming, this book is perfect for you. Chapters 4 and 5
    provide an introduction to the PHP language. And Chapter 7 provides an introduction
    to databases. After reading those chapters, feel free to pick from the rest—your
    knowledge base will be broad enough to understand any other topics we cover in
    this book.


    Experienced programmers will want to concentrate on the more complex chapters.
    For example, Chapter 9 covers pattern matching, which frequently confuses even
    advanced programmers.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'The approach used in this book is designed to serve a broad range of readers
    from novice to advanced. If you''ve never been programmed before, the learn-by-doing
    approach will help you move quickly and easily though this book. If you have programming
    experience, you will find plenty of material to refine and enhance what you already
    know, and to give you a solid understanding of how PHP works.


    # # What Do I Need?


    You need a computer running Linux; everything else can be found on the CD-ROM
    that comes with this book.


    # # How to Use This Book


    You have several ways that you can use this book. One obvious method is to begin
    at the first page and proceed in sequential order until the last. Most beginning
    programmers will probably want to use this method, and the book is specifically
    designed so that each chapter builds on the last. Alternatively, you can focus
    on the chapters and skip back to the technical chapters when you come across unfamiliar
    concepts.


    > > Tip It is critical to read through the PHP Function List (Appendix D) at least
    once before starting any major project. Otherwise, you could spend hours developing
    a function that already exists.


    # # Code Listings


    Many readers prefer to type in most of the example code by hand; this helps focus
    on the code one line at a time. Another good approach is to work through an example
    in a chapter, close the book, and enter it by hand from memory. The struggle that
    you experience helps to deepen your understanding. Remember, getting lost can
    help you learn to find your way.


    If you''re lazy, can''t type fast, or are prone to wrist pains like some of my
    friends, you can copy the listings from the CD-ROM that is included at the back
    of this book. Each listing on the CD-ROM has a listing header like this:'
  merge: -1
