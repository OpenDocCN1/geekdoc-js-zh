  md: '# # Installing phpMyAdmin


    To install phpMyAdmin, follow these steps:


    +   Place the phpMyAdmin tar file into `/usr/local/apache/htdocs`

    You can download the current version from `http://phpmyadmin.net/phpMyAdmin/`
    or copy it from the CD that comes with this book. Keep in mind, however, that
    the CD tar file is not guaranteed to be the latest version.


    +   2. cd /usr/local/apache/htdocs

    Moves to the directory with the tar file.


    +   3. tar xvzf phpMyAdmin_x.x.x_tar.gz

    Extracts the files from the tar file. A subdirectory called phpMyAdmin is created.


    +   4. cd phpMyAdmin

    Moves to the phpMyAdmin directory.


    +   5. Edit the `/usr/local/apache/htdocs/phpMyAdmin/config.inc.php3` file.


    +   Search for the following line in the configuration file, and replace the empty
    string in the following line with the password you choose for MySQL. You can change
    the userid and password used to access MySQL at any time by changing them in `config.inc.php3`.


    ```

    $cfgServers[1][''password''] = '''';

    ```


    +   7. Search for the following line in the configuration file, and replace “german”
    with the language you prefer to use. Your options are “catalata," "chinese_big5,"
    "chinese_gb," "danish," "english," "french," "german," "italian," "norwegian,"
    "russian_koi8," "russian-win1251," and "spanish"


    ```

    require("german.inc.php3");

    ```


    +   8. Save the changes and close the editor.


    All of the configuration directives in `config.inc.php3` are explained in the
    Documentation.html file.'
