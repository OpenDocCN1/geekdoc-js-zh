  md: '# Form Processing


    This HTML line specifies an input field with a default value of Waldo. The input
    box will be 25 characters long, although the user can enter up to 50 characters.


    At times, you may want the user to be able to enter text without that text being
    readable. For example, passwords need to be protected so that people passing behind
    the user can''t secretly steal them. In order to create a protected field, use
    the password type: <INPUT TYPE=password NAME=password SIZE=10>


    The password input option still sends the text through the Internet. In other
    words, the data is still sent as clear text. The sole function of the password
    input option is to ensure that the password input is not visible on the screen
    at the time of entry.


    # Caution


    The <INPUT> tag is also used to define two possible buttons—submit and reset buttons.
    The submit button sends the form data to a specified URL; in other words, to a
    CGI program. The reset button restores the input fields on the form to their default
    states. Any information the user had entered is lost. Frequently, the VALUE modifier
    is used to change the text that appears on the buttons. For example:


    ```

    <INPUT TYPE="submit" VALUE="Process Information">

    ```


    Hidden fields are frequently used as sneaky ways to pass information into a CGI
    program. Even though the fields are hidden, the field name and value are still
    sent to the CGI program when the submit button is clicked. For example, if your
    script generated an email form, you might include a list of email addresses that
    will be carbon-copied when the message is sent. Since the form user doesn''t need
    to see the list, the field can be hidden. When the submit button is clicked, the
    hidden fields are still sent to the CGI program along with the rest of the information.


    > Hidden fields are visible if visitors use the View Source option available in
    many browsers. Therefore, never put sensitive information (like passwords) into
    hidden fields.


    # Caution'
