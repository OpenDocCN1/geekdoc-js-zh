  md: '# MySQL’s SQL Statements


    MySQL has several unique extensions to SQL. And it''s always important to know
    the full range of syntax that is available to you.


    # ALTER TABLE


    ALTER [IGNORE] TABLE tbl_name alter_spec [, [alter_spec ...]


    alter_specification:

    ADD [COLUMN] create_definition FIRST | AFTER column_name ]

    or ADD INDEX [index_name] (index_col_name,...)

    or ADD PRIMARY KEY (index_col_name,...)

    or ADD UNIQUE [index_name] (index_col_name,...)

    or ALTER [COLUMN] col_name (SET DEFAULT literal | DROP DEFAULT)

    or CHANGE [COLUMN] old_col_name create_definition

    or MODIFY [COLUMN] create_definition

    or DROP [COLUMN] col_name

    or DROP PRIMARY KEY

    or DROP INDEX key_name

    or RENAME [AS] new_tbl_name

    or table_option [table_option]


    # CREATE DATABASE


    CREATE DATABASE db_name


    # CREATE FUNCTION


    CREATE FUNCTION function_name RETURNS (STRING|REAL|INTEGER)

    SONAME shared_library_name


    # CREATE INDEX


    CREATE [UNIQUE] INDEX index_name ON tbl_name

    (col_name[length]),...)


    # CREATE TABLE


    CREATE TABLE [IF NOT EXISTS] tbl_name

    (create_definition,...) [table_options]

    [select_statement]


    create_definition:

    col_name type [NOT NULL | NULL] [DEFAULT default_value]

    [AUTO_INCREMENT] [PRIMARY KEY] [reference_definition]

    or PRIMARY KEY (index_col_name,...)

    or KEY [index_name] KEY(index_col_name,...)

    or INDEX [index_name] (index_col_name,...)'
