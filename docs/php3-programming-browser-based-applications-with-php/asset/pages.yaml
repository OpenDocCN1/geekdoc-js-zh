- img_proc: true
  md: 'The ability to process text in flexible ways is one of the hallmarks of a sophisticated
    computer language. Languages should give you the ability to parse text or, in
    other words, find the parts of a string that you''re interested in. You should,
    for example, be able to extract a person''s first name from their full name or
    the area code from a telephone number. Someday you might need to search an array
    for the letters "R" or "S," These requirements and much more are met by PHP.


    You''ll find two uses for pattern matching. You can search for a pattern. Or you
    can search for a pattern and replace the matching text with text of your choosing.
    PHP has two sets of matching functions, one based on POSIX-style regular expressions
    and another based on Perl-style regular expressions. The Perl-style functions
    were added to PHP in version 3.0.9; if you''re working with an older version,
    concentrate on the POSIX-style functions (or upgrade!).


    MySQL also provides a regex function used for pattern matching. The regex function
    is discussed in the following "MySQL regex function"


    # Regular Expressions Defined


    Regular expressions describe the text you need to find. Instead of searching for
    "Alice," "Allison," and "Andy," you can search for "all first names that begin
    with the letter a." All of the matching patterns are based on the concept of characters.
    For example, the period character can have two meanings in a pattern. First, it
    can be used to match a period character in the searched string—this is its literal
    meaning. And second, it can be used to match any character in the searched string
    except for the newline character—this is its metameaning.


    When creating patterns, the metameaning is the default. If you intend to match
    the literal character, you need to prefix the metacharacter with a backslash.
    (You may recall that the backslash is used to create an escape sequence).


    Patterns can have atoms, branches, and bracket expressions. You can combine these
    components as needed, which gives you the ability to match nearly any type of
    string. You may recall from


    Metacharacters that have additional meaning above and beyond their literal meaning.'
