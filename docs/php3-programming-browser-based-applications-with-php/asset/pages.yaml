  md: "PHP provides a special variable called $this so that you can refer to the current\
    \ object from within the current object. Since the constructor is called by the\
    \ new keyword, the object hasn't been assigned to any variable. Therefore, a special\
    \ variable whose name is always known to exist. The $this variable lets you access\
    \ both the nascent object's properties and methods.\n\nBesides a variable that\
    \ exists for every object, $this is also special in its data type. It is a reference\
    \ instead of a scalar or array variable. Reference variables use the -> notation\
    \ (see the \"Value of Pointer is my Data\" section later in this chapter for more\
    \ information). For example, the following line of code accesses the class $props\
    \ array:\n\n```\n$this->props['part_num'] = '';\n```\n\nExcept for the exceptional\
    \ \"$this->\", specifying the array element is normal PHP syntax. You can take\
    \ advantage of PHP's ability to define default values in your class constructors.\
    \ For example:\n\n```\nfunction cls_inventory_item(\n$part_num = 'Unknown',\n\
    $qty_on_hand = '0'\n {\n  $this->props['part_num'] = $part_num;\n  $this->props['qty_on_hand']\
    \ = $qty_on_hand;\n}\n```\n\nIn order to create an object with different properties,\
    \ use the new keyword and add parameters to the constructor call:\n\n```\n// Create\
    \ an item with 10 quantity\n$item1 = new cls_inventory_item(\"ID1233\", \"10\"\
    );\n```\n\n```\n// Create an item with 23 quantity\n$item2 = new cls_inventory_item(\"\
    ID7053\", \"23\");\n```\n\n# Using Named Parameters\n\nThe concept of programmers\
    \ named parameters has been quickly accepted by programmers. I was first introduced\
    \ to it while working with the scripting language for Microsoft Word. Named parameters\
    \ involves passing a single array to a function instead of individual parameters:"
