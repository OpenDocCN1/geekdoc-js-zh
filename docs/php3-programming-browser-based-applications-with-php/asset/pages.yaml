    # POSIX Style Functions


    POSIX is an acronym that means Portable Operating System Interface for UNIX. It
    is a series of IEEE and ISO standards that defines interfaces between programs
    and operating systems. Using these standards helps programmers create programs
    that can be ported to most varieties of UNIXIX, as well as some versions of Windows.
    The official Web site for POSIX is


    http://anubis.dkuug.dk/JTC1/SC22/WG15/. POSIX standards are developed by the Portable
    Applications Standards Committee (PASC), which has a Web site at http://www.pasc.org.


    PHP has six functions related to pattern matching:


    +   * ereg—This function returns true if its pattern parameter is matched, false
    otherwise.


    +   * egeri—This function is identical to ereg except case distinctions are ignored.


    +   * preg_replace—This function replaces text matching a pattern.


    +   * egeri_replace—This function is identical to ereg_replace except case distinctions
    are ignored.


    +   * split—This function separates a string into parts according to its delimiter
    parameter.'
