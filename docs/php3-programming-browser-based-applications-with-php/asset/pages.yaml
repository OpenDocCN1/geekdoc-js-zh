    # ereg and eregi


    # Syntax


    ```

    int ereg(string PATTERN, string TARGET, [array MATCHES]);

    ent eregi(string PATTERN, string TARGET, [array MATCHES]);

    ```


    # Description


    ereg searches the TARGET parameter for matches to PATTERN.

    eregi performs the same search, but ignores case distinctions.

    If a third parameter is supplied, the text is placed into its first element and
    accessed using `$matches[0]$. Matches of parenthesized pieces are stored as elements
    of the specified array. The first matched substring is placed in `$matches[1]`.
    The second matched substring is placed in `$matches[2]`. And so on. You, of course,
    use any array name as the third parameter; `$matches` is simply my preference.


    # Return Value


    Returns true if PAT is found inside TARGET, false otherwise. If an error occurs,
    the function returns false.


    # Example


    The following example code parses a phone number into its three components (that
    is, is area code, exchange, and number) and displays the whole number, the area
    code, and the exchange. Separate variables hold the patterns that recognize the
    components. These variables are used to make understanding of the pattern easier.


    ```

    $target = "David Medinets,973-927-7670";


    // match the area code as three digits in a row.

    $pat_area = ''([0-9][0-9][0-9])'';

    ```'
