    # Double-quoted Strings


    Double-quoted strings are similar to single-quoted strings, but are a bit more
    complex. With double-quoted strings, you can use the backslash to add escape sequences
    or metacharacters to your string. You can also use variable interpolation, but
    that topic is covered a little later and we don''t want to get ahead of ourselves.


    Double-quoted strings are text surrounded by double quotes ("").'
