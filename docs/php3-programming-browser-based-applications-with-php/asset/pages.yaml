    # Providing a Field Name Alias


    You can use the AS keyword to provide an alias for a field. The following example,
    which generates option HTML tags for all people in the table over 60 years old,
    shows how this is done:


    ```

    SELECT

    CONCAT(CONCAT(CONCAT(CONCAT(CONCAT(

    ''<option value="'', int_age

    '''')

    str_name_first)

    '')

    str_name_last)

    ''</option>'') AS item <- the alias is created!

    FROM

