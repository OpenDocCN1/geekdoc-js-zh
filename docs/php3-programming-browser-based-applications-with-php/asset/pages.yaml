  md: '# Basic Concepts


    Usenet newsgroups (reachable via http://www.dejanews.com) to get help about how
    to solve the problem. However, the best help comes from the PHP mailing lists
    at http://www.php.net.


    Before beginning the compilations, let''s talk about how to recover from mistakes.
    After getting help regarding the problem, use the following commands to reinitialize
    the source directories:


    **rm config.cache**—Nearly all Linux applications use a command called `configure`
    to examine your system looking for information about how to tailor the compilation
    process. The results of the examination are stored in a file called `config.cache`.
    By removing this file, you force the configure program to start from scratch examining
    your system.


    **make distclean**—All Linux applications written with the C programming language
    are compiled using the make program. The make program looks at each source file
    and decides whether it needs to be compiled or if it has already been compiled.


    **make distclean** command—“resets” all of the source files so that they can be
    recompiled.


    **make clean**—Some applications do not support the **make distclean** command;
    instead they provide a **make clean** command. The **make clean** command also
    “resets” the source files so that they can be recompiled.


    Some of the programs you''re installing may not support each of these commands,
    but trying them causes no harm.


    Red Hat v5.2 uses the glibc library. If you download other programs or updates
    of the ones you install in this chapter from the Internet, you''ll need to know
    this piece of information. You can find out which version of the glibc library
    you have installed using the `rpm -q glibc` command. On your system, this command
    displays `glibc-2.0.7.29`.


    Note


    # Basic Concepts


    If you''ve never compiled a Linux application before, you''ll want to familiarize
