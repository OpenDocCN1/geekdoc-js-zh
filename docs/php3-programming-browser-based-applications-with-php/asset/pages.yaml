  md: '# Summary


    +   - No echo statements

    - Follow Java''s user interface model

    - Provide default attributes for HTML tags

    - Save HTML text into a database


    After defining the goals, we examined the domain space of the problem, in this
    case means the HTML language. The common denominator for all tags seemed to be
    a start tag or without attributes, contained information, and an end tag.


    Starting with a `htmlbase` and a `html` class, the initial module was developed.
    Working with this module, these classes showed that it is possible to meet two
    of the goals: to have no echo statements and to follow Java''s user interface
    model.


    Then in rapid succession, support for head, body, title, and comment was provided.
    We learned that each tag requires a change to the html class. The head tag requires
    a change so that contained elements are generated. The body tag requires support
    to attributes. The title tag requires non-objects (such as literal text) to be
    contained. And the comment tag differs needs start and end tags.


    We went over a methodology conversion to generic objects using only the htmlbase
    class, but several issues arose—such as the inability to perform validation—that
    ultimately lead us to continue using more precise objects.


    Next, the goal of default attributes was addressed. This goal was reached by using
    the ability of PHP to create object copies using the assignment operator. An object
    with the required attributes and class was created and then used as a template
    to create copies. The new copies were modified and added into the larger HTML
    element.


    Finally, we learned how to save HTML text into a database. In the next step we
    created a suitable database (using phpMyAdmin or the mysql create table statement).
    Then, an HTML text string was generated and saved using an insert statement. When
    the concept was proven to work (that is, the return code from the insert statement
    was successful), we developed a function to check the database and return the
    cached HTML text if'
