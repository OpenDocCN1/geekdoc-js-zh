    # Compiling gcc, the C Compiler


    The first program you should compile and install is the C compiler. The C compiler
    that comes with Red Hat v5.2 is gcc v2.7.2.3, which is not current enough to compile
    PHP correctly. However, gcc v2.7.2.3 can be used to compile gcc v2.8.1, which
    is current enough. To compile the new version of gcc.


    +   1. cd /usr/local/src/gcc-2.8.1

    Connects to the top level gcc directory.


    +   2. ./configure --prefix=/usr/local/gcc

    Runs the configuration program and forces it to set up the installation so that
    gcc is installed to /usr/local/gcc.


    +   3. make bootstrap LANGUAGES="c c++" BOOT_FLAGS="-g -02"

    Compiles the new C and C++ compilers.


    +   4. make install LANGUAGES="c c++" BOOT_FLAGS="-g -02"

    Installs the new C and C++ compilers.


    +   5. mv /usr/local/gcc/bin/gcc /usr/local/gcc/bin/gcc-2.8.1

    Renames the new gcc compile to include the version number in its name.


    +   6. ln -s \n/usr/local/gcc/bin/gcc-2.8.1 \n/usr/bin/gcc-

    nCreates a symbolic link from /usr/bin/gcc to the newly compiled gcc executable.'
