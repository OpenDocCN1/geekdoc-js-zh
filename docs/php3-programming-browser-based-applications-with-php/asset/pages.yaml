  md: "# Objects and PHP\n\nPolymorphic Functions\nPolymorphism, although a big word,\
    \ is a simple concept. It means that methods defined in the base class override\
    \ methods defined in the parent classes. The following example clarifies this\
    \ concept. Let's say you have two classes, A and B, and B is the child of A. If\
    \ a function is not found in the B class, PHP looks for that function in A. Some\
    \ code that illustrates this principle:\n\n```\nclass A {\n    function A() {\n\
    \    }\n\n    function dspTwo() {\n        echo \"A: Two<br>\";\n    }\n}\n\n\
    class B extends A {\n    function B() {\n        $this->A();\n    }\n}\n\n$object\
    \ = new B();\n$object->dspTwo();\n```\n\nThis code displays\nA: Two\n\n> Because\
    \ the A: Two text is displayed, it's obvious that the dspTwo function in the A\
    \ class is being called. If you create a second dspTwo function inside the B class,\
    \ PHP calls that function instead:\n\n```\nclass A {\n    function A() {\n   \
    \ }\n\n    function dspTwo() {\n        echo \"A: Two<br>\";\n    }\n}\n\nclass\
    \ B extends A {\n    function B() {\n        $this->A();\n    }\n}\n```"
