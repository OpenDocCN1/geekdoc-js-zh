    # Summary


    Forging a solution to a set of goals using only computer language statements provides
    a feeling of satisfaction, if only for a short time. The feeling lasts until you
    think of the next set of features to add. And then the next.


    The HTML module created in this chapter is by no means complete. Nor, perhaps,
    was the design the best possible. However, it was “good enough for the job at
    hand.” It doesn’t make sense to spend four days writing a script to save two days
    of execution time.


    Every project starts with an idea. In this case, the idea was create an HTML module
    using classes that eliminates the echo statement. Then the idea was refined to
    four goals:'
