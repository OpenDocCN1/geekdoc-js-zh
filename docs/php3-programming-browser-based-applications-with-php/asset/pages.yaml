  md: "# Problem: One User Can Overwrite Another’s Change\n\nThe problem with concurrent\
    \ editing of information is that one person’s changes overwrites another’s. This\
    \ section demonstrates the problem so that it can be corrected.\n\nFirst, a simple\
    \ database table is created. Then, an application is developed to input and edit\
    \ the information in the table. Finally, two browsers (Netscape and Microsoft)\
    \ are used to simulate two users editing the same record.\n\n# Creating the Concurrent\
    \ Database\n\nFor the purpose of this chapter, a very simple table is needed.\
    \ The SQL shown below suffices to create a table with two significant fields—name\
    \ and phone. The other fields are only there for administrative purposes.\n\n\
    ```\nCREATE TABLE\nconcurrent\n(\n  key_concurrent INT (5) not null AUTO_INCREMENT,\n\
    \  name VARCHAR (50) not null\n  phone VARCHAR (50) not null\n  dte_created datetime\
    \ DEFAULT '0000-00-00 00:00:00' NOT NULL\n  _dte_updated datetime DEFAULT '0000-00-00\
    \ 00:00:00' NOT NULL\n  ,PRIMARY KEY (key_concurrent)\n)\n```\n\n# An Illustrative\
