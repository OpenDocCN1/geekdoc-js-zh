  md: '# Forming Virtual Tables through Joins


    In order two tables to be related, they need some field in common. For example,
    suppose you had a database table containing information about states (such as
    population, square miles, and so forth) and another containing information about
    companies (such as their address, stock symbol, and so on). Using a common field
    (state name), those two tables could be joined together to answer questions like:
    “What is the population of the home state of Red Hat Software, Inc.? The SQL to
    answer this question might look like


    ```

    SELECT

    population

    FROM

    states, businesses

    WHERE

    states.state_name = businesses.state_name

    AND businesses.business_name = ''Red Hat Software, Inc.''

    ```


    The two tables, states and businesses, are joined by the WHERE clause. Each record
    in states is joined with each record in businesses where the state_names values
    are the same.


    Let''s return to our books example. Because a naming convention was used to name
    the key field, key(tablename), writing the SQL to join the three tables is:


    ```

    SELECT

    books.book_title

    authors.author_name

    publishers.publisher_name

    FROM

    books

    authors

    publishers

    WHERE

    books.key_authors = authors.key_authors

    AND books.key_publishers = publishers.key_publishers

    ```


    > Note The fields being compared to form the virtual table must be the same data
    type. The key fields in this example are all int(5).'
