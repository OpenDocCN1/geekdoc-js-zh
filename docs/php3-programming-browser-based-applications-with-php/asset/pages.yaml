    Prickett,Almira Sessions,Ruthelma Stevens,Minerva Ureal,William

    Val,Dick Wessel,Sam Wolfe


    # Summary


    This chapter showed how to use the parser that can be compiled

    into PHP to read XML files and extract useful information. First,

    t XML input was parsed so that tags, attributes, and data was

    displayed. Then, a second script was created that extracted three

    types of information—the movie title, the movie year, and the

    names of the actors who starred in it.


    And now, this book is complete. However, your journey as

    anapplication developer could be starting. Throughout the book

    I tried to give you a glimpse into the step-by-step approach that

    I take when designing and programming applications. You''ve also

    seen the wide range of techniques that must be mastered and tech-

    nologies that need tandem.


    I hope you enjoyed reading this book. Writing it was fun and

    and developing good examples was a challenge. At this point, I

    have only one more thing to say . . . Happy Programming!'
