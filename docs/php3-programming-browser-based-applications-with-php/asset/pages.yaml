- img_proc: true
  md: 'The CGI standard does not exist in isolation; it is dependent on the HTML and
    HTTP standards. HTML is the standard that lets Web browsers understand document
    content. HTTP is the communication protocol that, among other things, lets Web
    servers talk with Web browsers. Many of the protocols on which the Internet depends
    are detailed in RFC (Request for Comments) documents. These documents can be found
    at http://www.ietf.org.


    Don''t confuse the CGI standard with the capability of PHP to be run both as a
    CGI-capable program and as an Apache module that also understands CGI standards.
    This book exclusively focuses on using PHP as an Apache module.


    Almost anyone can throw some HTML and hang a home page out on the Web. But most
    sites are, quite frankly, boring. Why? Most sites are built as a simple series
    of HTML documents that never change; consequently they are completely static.
    No one is likely to visit a static page more than once or twice. Think the sites
    you visit most often. They probably have some interesting content, certainly,
    but more importantly, they have dynamic content.


    So what''s a Webmaster to do? No Webmaster has the time to update their Web site
    by hand every day. Fortunately, the people who developed the Web protocol thought
    of this problem and gave us CGI. CGI gives you a way to make Web sites dynamic
    and interactive.


    Each word in the acronym “CGI” helps to understand the interface:


    +   - **Common**—interacts with many different operating systems


    +   - **Gateway**—provides users with a way to gain access to different programs,
    such as databases or picture generators


    +   - **Interface**—uses a well-defined method to interact with a Web server


    CGI applications can perform nearly any task your imagination can think of. For
    example, you can create Web pages on-the-fly,'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# CGI Apps versus Java Applets


    access databases, hold Telnet sessions, generate graphics, and com-pile statistics.


    The basic concept behind CGI is pretty simple; however, actually creating CGI
    applications is not that. That requires real programming skills. You need to be
    able to debug programs and make logical connections between one idea and another.
    You also need to have the ability to visualize the application you''d like to
    create. This chapter gets you started with CGI programming.


    # CGI Apps versus Java Applets


    CGI and Java are two totally different animals. CGI is a specification that can
    be used by any programming language. CGI applications are run on a Web server.
    Java applets are executed on the client side inside a Web browser.


    CGI applications should be designed to take advantage of the centralized nature
    of a Web server. They are great for searching databases, processing HTML form
    data, and other applications that require limited interaction with a user.


    Java applets, on the other hand, are good when you need a high degree of interaction
    with users; for example, games or animation. These applets need to be kept relatively
    small because they are transmitted through the Internet to the client. CGI applications
    on the other hand can be as large as needed because they reside and are executed
    on the Web server.


    You can design your Web site using both Java and CGI applications. For example,
    you might want to use Java on the client side to display information in graphs
    (see http://www.netcharts.com). Java applets can reside side-by-side with HTML
    forms.


    # CGI Apps versus JavaScript


    CGI and JavaScript are two totally different animals. CGI programs execute on
    the server, and JavaScript programs execute on the client, inside a Web browser.
    Your CGI program can generate the JavaScript lines of code, including initializing
    variables. Using CGI programs to initialize JavaScript variables provides you
    with a crude method of passing information between the two environments.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Home Brew or Off-the-Shelf Scripts?


    I encourage you to use any and all pre-written scripts you can find. For example,
    the PHPLIB modules are widely used. However, many programmers find such modules
    overkill for some CGI applications. Another thought to consider is unless the
    scripts are well-supported or have been around for a while, you''ll find yourself
    in the unenviable position of debugging another programmer''s code—and you won''t
    be getting paid either.


    In this chapter, I have purposely used only home-brewed scripts. It is important
    you understand the mechanisms behind the protocols. This will make debugging applications
    easier because you''ll have a better idea of what the modules are doing behind
    the scenes. You will also be able to make better use of pre-existing modules if
    you can make educated guesses about what a poorly documented function does.


    # How Does CGI Work?


    CGI programs are always placed on a disk that the Web server has access to. This
    means that if you are using a dial-up account to maintain your Web site, you need
    to upload your CGI programs to the server before they can run.


    > If you run Linux, Apache, MySQL, and PHP on a local machine, then you can test
    scripts on that machine. In this situation, you''d only upload your scripts after
    they are debugged.


    Web servers are generally configured so that CGI applications can only be executed
    in specified directories. These restrictions help improve security and reduce
    maintenance headaches. Web servers may have aliases so that “virtual directories”
    exist. Each user might have their own CGI directory to use. The directory location
    is totally under the control of your Web site administrator.


    # Calling Your CGI Program


    The easiest way to run a CGI program is to type in the URL of the program into
    your Web browser. The Web server should recognize'
