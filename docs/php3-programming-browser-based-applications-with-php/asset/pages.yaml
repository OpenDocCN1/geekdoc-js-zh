  md: '# The Using Option


    Another method of eliminating where clauses is the left join ... using () option.
    Here is an example:


    ```

    SELECT

    books.book_title

    ,COUNT(books_authors.key_authors) AS number_of_authors

    FROM

    books_authors LEFT JOIN books USING (key_books)

    GROUP BY

    books.book_title

    HAVING

    number_of_authors > 1

    ```


    # Working with Nothing (NULL Values)


    A field with a NULL value means no value was ever assigned to the field. You may
    recall the following SQL statement from earlier in this chapter:


    ```

    INSERT INTO books (book_title)

    VALUES (''Playgrounds of the Mind'')

    ```


    At first glance, you might conclude that a NULL value was created for the key_publishers
    field. In fact, MySQL assigned a 0 to the field because of how the field was defined
    during table creation:


    ```

    ,key_publishers int(5) DEFAULT ''0'' NOT NULL

    ```


    Notice the DEFAULT ''0''. This ensures NULL values are never assigned to this
    field. If default values are provided for all fields (and there are few reasons
    why they shouldn''t), you won''t need to worry about NULL values when selecting
    from one table.


    You are more likely to encounter NULL values when joining tables. These NULL values
    are created automatically by the data-engine to fill fields in virtual tables.
    For example, if you joined the books and books_authors tables using this statement:


    ```

    SELECT

    books.book_title

    ,books_authors.key_authors

    FROM

    books LEFT JOIN books_authors

    ON books.key_books = books_authors.key_authors

    ORDER BY

    books.book_title

    ```'
