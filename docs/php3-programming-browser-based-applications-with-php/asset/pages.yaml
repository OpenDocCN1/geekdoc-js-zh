  md: '# Internet Resources


    If you read this book, you have a fairly good understanding of PHP. This appendix
    introduces you to some resources that can take you to the next level of understanding.
    You can see where to find PHP scripts that you can copy and modify for your own
    use, and other useful information.'
  merge: -1
  pgno: 448
- img_proc: true
  md: 'Several ways to learn more about PHP include


    +   - IRC

    - Mailing Lists

    - Web Sites


    The following sections discuss each method.


    # IRC


    The Internet Relay Chat service is a powerful tool. If you''re lucky, you can
    connect with very knowledgeable people who will answer your questions; often you''ll
    find Rasmus Lierdorf, the creator of PHP, on the #php channel. The advantage of
    IRC is that you can hold a real-time conversation with other people. You ask a
    question, they respond. You can then ask for clarification or actually try the
    advice. If you still have a problem, you can ask for more advice.


    Several networks have arisen to support IRC: EfNet, Undernet, and DALnet. The
    PHP gurus hang out on EfNet. The #php IRC channel is a good place to go for general
    PHP questions. You might even see me—my nickname is WasWaldo.


    # Mailing Lists


    Responses to questions are usually quick if your subject lines are well thought-out
    and descriptive.


    # Web Sites


    The following sites are good places to visit to build up your library. In addition,
    these sites begin to give you an idea of exactly what already exists that you
    can use or modify for your own use. You will be amazed at what is available that
    is either freeware or shareware.


    If you are new to programming with PHP, visit each of these sites listed in this
    chapter. Doing this gives you a good understanding of what is available to help
    you become a great programmer. As you visit the sites, keep track of useful files
    that can be downloaded that interest you, including their version and the date.
    You may'
  merge: -1
  pgno: 449
- img_proc: true
  md: '# Appendix A


    also want to bookmark the site in your Web browser. When you are done visiting
    all the sites, you will know where to access the most recent of the tools, and
    you can begin to download and build your own development library.


    I''ve tried to select sites that cover a wide range of technologies including
    PHP, JavaScript, XML, databases, and general programming issues.


    # PHP: Hypertext Preprocessor


    ```

    http://www.php.php/

