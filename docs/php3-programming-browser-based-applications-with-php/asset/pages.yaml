  md: '# Statements


    The operation expression modifies the variables used in the condition expression
    (the loop variables) in some fashion each time the code block is executed.


    One of the most basic uses of the for statement is to count from zero to some
    number. For example:


    ```

    for ($loop_variable = 0;

    $loop_variable < 100;

    $loop_variable++) {

    echo "Inside Loop: $loop_variable = $loop_variable";

    }

    ```


    This statement displays the numbers from 0 through 99:


    ```

    Inside Loop: loop_variable = 0

    Inside Loop: loop_variable = 1

    ...

    Inside Loop: loop_variable = 98

    Inside Loop: loop_variable = 99

    ```


    When the loop is over, the $loop_variable has the value of 100. This value doesn''t
    display because after 99 prints, the operation execution ceases causing the increase
    in value to 100. Then the condition expression evaluates to false, and the loop
    ends.


    > It is vital that the operation expression (or code inside the statement block)
    changes the value of the loop variable or uses the break keyword discussed later
    in this chapter. Otherwise, the loop never terminates; instead it becomes an infinite
    loop.


    For loops can also count backward by causing the operation expression to decrement
    the loop variable:


    ```

    for ($loop_variable = 100;

    $loop_variable > 0;

    $loop_variable--) {

    echo "Inside Loop: $loop_variable = $loop_variable";

    }

    ```


    This statement displays the numbers from 100 through 1:


    ```

    Inside Loop: loop_variable = 100

    Inside Loop: loop_variable = 99

    ...

    Inside Loop: loop_variable = 2

    Inside Loop: loop_variable = 1

    ```'
