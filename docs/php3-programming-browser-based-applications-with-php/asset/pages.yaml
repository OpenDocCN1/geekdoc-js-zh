    Of course, the commented pattern is much longer, but they take the same amount
    of time to execute. In addition, maintaining the commented pattern is much easier
    because each component is explained. When you know what each component is doing
    in relation to the rest of the pattern, it becomes easy to modify its behavior
    when the need arises.


    Extensions also let you change the order of evaluation without affecting pattern
    memory. For example:


    ```

    $pattern = "/(?:[a-b])+";

    ```


    matches the a or b characters repeated one or more times in any order. The pattern
    memory is not be affected.


    At times, you might like to include a pattern component in your pattern without
    including it in the array that holds the matched strings. The technical term for
    this is a zero-width positive lookahead assertion. You can use this to ensure
    that the string following the matched component is correct without affecting the
    matched value. For example, if you have some data that look like this


    ```

    $data[0] = ''David Veterinarian 56'';

    $data[1] = ''Jackie Orthopedist 34'';

    $data[2] = ''Karen Veterinarian 28'';

    ```'
