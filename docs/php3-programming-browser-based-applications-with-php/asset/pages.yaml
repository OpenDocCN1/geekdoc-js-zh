  md: "As you can see, parsing XML is relatively easy. James Clark, the person who\
    \ wrote the XML parser that PHP uses, has done all the hard work. All you have\
    \ to do is write the callback functions. The next section shows how to move from\
    \ the simple callback functions used above to moving the XML data into PHP variables.\n\
    \n# From XML to PHP\n\nSo far, the XML data has simply passed through the PHP\
    \ script. The XML came from the Web server, was parsed, and the tags and data\
    \ were sent to the Web browser. The PHP script had no concept of what kind of\
    \ data was parsed. In fact, the script used previously works for every XML file.\n\
    \nAfter the basic parsing is done, the XML information is processed depends on\
    \ what you need to do. The script shown in Listing 17.3 on page 422 initializes\
