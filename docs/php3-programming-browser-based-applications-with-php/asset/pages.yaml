  md: '![](img/60cf9e8f697416e18e3ca18e3d4f7f4e_211_0.png)


    **Figure 8.4** *phpMyAdmin in Russian.*


    What''s the big deal in creating a Web application in two or more languages? You
    could just copy the entire project and replace all the text in it with your translation.
    But what if you''d like to change the layout of the application? What if you find
    a bug? You''d have to modify every single copy. This might not be much hassle
    with 2 languages, but again, it becomes a real pain with 10. So again, we need
    to find a way to separate application logic (the code) from layout (HTML). The
    method you will really use depends on your situation: how sophisticated your application
    is, how often strings are changed, if you need to switch to different languages
    dynamically. A simple way (phpMyAdmin uses this) is to write all strings used
    by your applications into a separate text file and to reference those string variables
    within your application instead of outputting text directly. A language file from
    phpMyAdmin looks like this:


    ```

    $strPrimaryKey = "A primary key has been added on ";

    $strAccessDenied = "Access denied";

    $strAction = "Action":

    $strAddNewField = "Add new field";

    ```'
