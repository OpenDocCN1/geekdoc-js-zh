  md: '# The Document Type Definition (DTD)


    This says that the gender attribute to the person element may have any one of
    three values: male, female, or unknown. Any person element with any other value
    for the gender attribute will be rejected as invalid.


    The string attribute value types simply that the attribute''s value can consist
    of any text characters. The keyword CDATA in the attributype position (like the
    use of this keyword in a marked section of an XML document) declares that this
    is the case for this attribute, as in


    ```

    <ATLIST website href CDATA >

    ```


    (Again, the default specification is omitted.) Anything that looks like markup
    in a CDATA attribute, as well as all other text—even blanks—is passed to a downstream
    application, unaltered, by XML parser.


    Finally, the tokenized attribute type is specified with one of these keywords:
    ID, IDREF, IDREFS, ENTITY, ENTITIES, NMTOKEN, and NMTOKENS. Each of these keywords
    constrains the attribute''s value in ways requiring knowledge either of the document
    in which they appear or of the rest of the DTD.


    # ID-Type Attributes


    An ID attribute''s value must be unique among all ID attribute values for that
    element in the given document. It cannot be purely numeric, but must begin with
    at least one alphabetic character.(Also, by convention, ID-type attributes are
    actually named “ID” or “id,” although this isn''t a requirement.) A sample declaration
    looks like this:


    ```

    <ATLIST person id ID >

    ```


    And could be used in a document as follows:


    ```

    <person id="dm2349">

    ```


    An important point is that an ID-type attribute doesn’t “identify” (in this case)
    a person; it “identifies” a particular occurrence of the person element. ID-type
    attributes are intended primarily for use with IDREF/IDREFS attributes, as described
    next.'
