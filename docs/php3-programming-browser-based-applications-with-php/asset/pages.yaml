    # The SQL Alter Table Statement


    The SQL alter table statement, which lets you manipulate columns in a database
    table, has the following basic forms:


    ```

    alter table (table_name) add column (field_name) (field_data_type);

    ```


    ```

    alter table (table_name) change column (existing_name) (new_field_name) (new_field_data_type);

    ```


    ```

    alter table (table_name) drop column (existing_name);

    ```


    Each of these statements is discussed in the following sections.


    # Using Add Column Option


    Using the alter table statement to add a column called temp_field to the email_messages
    table looks like this:


    ```

    $ # Connect to the mysql program.

