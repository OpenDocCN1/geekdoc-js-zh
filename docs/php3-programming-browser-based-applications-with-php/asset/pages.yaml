  md: '# An Introduction to SQL


    The following example shows how to create a table with NOT NULL fields:


    ```

    $ # Connect to the php_book database.

    $ mysql -u root -password php_book

    mysql> create table test (

    -> a VARCHAR(10)

    -> -b VARCHAR(10) NOT NULL

    ->);

    ```


    mysql> describe test;


    | Field | Type | Null | Key | Default | Extra |

    |---|---|---|---|---||

    | a | varchar(10) | YES | | NULL | |

    | b | varchar(10) | | | | |


    Notice that the Null column is empty when a NOT NULL column is being described.
    When an insert is attempted without specifying the b field, MySQL provides a default
    value. However, information for a field is missing, no default value is provided.
    Instead, a NULL value is used.


    ```

    mysql> insert into test (a,b) values (''aaa'', ''bbb'');

    mysql> insert into test (a) values (''aaa'');

    mysql> insert into test (b) values (''bbb'');

    mysql> select * from test;

    ```


    | a | b | |

    |---|---|--|

    | aaa | bbb | <-- record one.

    | aaa | | <-- record two.

    | NULL | bbb | <-- record three.


    The first insert statement (record one) specified information for both fields.
    As expected, both fields contain information when displayed. The second insert
    statement doesn''t provide a value for field b. However, since field b was created
    as a NOT NULL field, MySQL provided a default value—in this case an empty string.
    You can prove the field is empty using the following SQL:'
