  md: '# Introduction


    # **Listing 0.1** example.php—This is a sample listing header


    ```

    // This is a sample program line.

    ```


    After each example, experiment a little and see what happens. Change a few things,
    or add a couple, and change the code a bit. This will help you enjoy the learning
    experience more. The most important attribute of a successful learning experience
    is fun. If it is fun and you enjoy it, you will stay with it longer.


    # Conventions


    The following conventions are used in this book:


    +   - Code line, functions, variable names, and any text you see onscreen in a
    special `monospace` typeface.


    +   - Filenames are also set in a `monospace` typeface.


    +   - New terms are set in *italic*.


    +   - Case is very important in PHP programming. Always pay attention to uppercase
    and lowercase in variable and function names.


    +   - If you are required to type text, the text you must will appear in **boldface**.
    For example, "Type /mysqlshow." Usually, however, the line is set off by itself
    in a monospace typeface, as shown in the following example:


    ```

    ./mysqlshow

    ```


    +   - Commands and keywords are set in **boldface**.


    # Overview


    Chapter 1, "What Is PHP?" provides a description of PHP, how it integrates into
    the Apache Web server, and which tasks it can perform. Chapter 2, "Installing
    PHP," shows to compile the MySQL database and PHP as an Apache Web server module
    with support for ODBC, XML, pattern matching, and MySQL.


    The next two chapters concentrate on the technical details of the PHP programming
    language. Chapter 3, "Manipulating Data",'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'within PHP,” covers variables, literal values, and the operators that affect
    them. Chapter 4, “Controlling Your Programs,” discusses expressions, statements,
    and functions.


    Chapter 5, “Interlude One: Connecting to a Database,” puts the PHP language into
    perspective by using PHP to connect to the MySQL database. This chapter is the
    precursor for information found in Chapter 6, “Databases and SQL.” Basic database
    concepts, such as tables and records are introduced in Chapter 6. Additionally,
    a data definition and data manipulation language called SQL (Structured Query
    Language) is discussed.


    Chapter 7, “Interlude Two: Maintaining a List,” shows how to integrate PHP and
    SQL to maintain a database table of month names. And Chapter 8, “phpMyAdmin: An
    Open Source Front End to MySQL,” looks at an open source application that provides
    the ability to examine and change any MySQL database.


    Chapters 9, “Pattern Matching,” and “Object Orientation,” and 10, cover further
    technical details about the PHP language. Pattern matching is the ability to find,
    and optionally replace, text. Objectoriented programming lets data and functions
    be stored together. Actually, object-oriented programming is more involved than
    simple definition, but you can read Chapter 10 for the details.


    Chapter 11, “Interlude Three: Creating an HTML Module,” offers a break from technical
    terms by developing a method to display HTML from inside PHP scripts.


    The next several chapters return to more of a teaching mode. Chapter 12, “What
    is CGI?” looks at the underpinnings of the Web server’s relationship to programs
    that are executed in response to Web browser requests. Even PHP (in this book)
    is an integral part of the Apache Web server, it follows CGI rules.


    Chapter 13, “Authentication,” shows how to know Web visitors a little better.
    The basic techniques available to challenge users with userid and passwords are
    covered.


    Chapter 14, “Real-World SQL,” talks about SQL in more depth. The deeper relationships
    between tables are covered, as well as the concept of Referential Integrity. Chapter
    15, “Interlude Four: Managing Concurrent Access,” uses the PHPLIB module to authenticate
    users and prevent more than one user from changing a record at a time.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Introduction


    Chapters 16 and 17 look at XML. First, Chapter 16, “XML,” provides insight about
    the differences and similarities of XML and HTML. The topic of Document Type Definitions
    (or DTDs) is covered. Chapter 17, “Processing XML with PHP,” shows how to parse
    XML (that is, read and understand its tags) and move the information from within
    XML into PHP variables.


    Appendix A, “Internet Resources,” lists several types of resources available through
    the Internet, including mailing lists and Web sites. Appendix B, “The ASCII Table,”
    shows you all of the ASCII codes and their corresponding characters. Appendix
    C, “SQL Reference,” provides a quick list of SQL statements, operators, and functions.
    Appendix D, “PHP Function List,” contains a list of the many functions of PHP
    in alphabetical order. Appendix E, “What’s on the CD-ROM?”, describes the contents
    of the CD.'
