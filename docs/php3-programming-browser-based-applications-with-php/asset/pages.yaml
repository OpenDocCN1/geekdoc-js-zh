  md: 'The majority of implementations of authentication use one of two main methods
    (and sometimes a combination of both); HTTP authentication headers and database
    authentication.


    HTTP headers are used to communicate between clients and servers. When authentication
    is needed to access a resource (like a Web page), the web server sends a 401 response
    header. This response includes a realm name. The realm name represents the resource
    being protected and also helps the user to remember which username and password
    to use.


    Since HTTP is a stateless protocol—it doesn''t remember information from one request
    to the next—most applications combine authentication with some form of session
    management. Sessions begin when a user connects to your Web server and end after
    a period of time (anywhere from one to four hours, usually). Each time the user
    requests a Web page, the timer is reset to zero. Some type of user id representing
    the session is stored on the user''s computer (using cookies) or passed on the
    URL.


    htaccess authentication is enforced by the Web server. A list of usernames and
    passwords are stored in a file created by the **htpasswd command**. Then, directives
    are placed into `.htaccess` files in each directory or into the Apache configuration
    file



    ```

    (/usr/local/apache/conf/httpd.conf)

    ```


    For larger Web sites, authentication can be implemented through the use of database
    tables. This technique allows for advanced user tracking and simplifies maintaining
    a user''s information.


    The next chapter, “Real-World SQL,” shows how to relate multiple database tables
    to other.


