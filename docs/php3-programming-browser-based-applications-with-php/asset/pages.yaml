  md: '# Regular Expressions Defined 199


    # Table 9.2 Metacharacters for patterns (cont''d)


    | Metacharacter | Metameaning |

    | $ | This metacharacter matches the end of a string. It is one of two pattern
    anchors—the other anchor is the ^. |

    | | | This metacharacter—called alternation—lets you specify two values that can
    cause the match to succeed. For instance, "/a|b/" means the target parameter must
    contain the "a" or "b" character for the match to succeed. The atoms on either
    side of the alternation character are called branches. |

    | * | This metacharacter indicates that the atom immediately to the left should
    be matched zero or more times in order to be evaluated as true. |

    | + | This metacharacter indicates that the atom immediately to the left should
    be matched one or more times in order to be evaluated as true. |

    | ? | This metacharacter indicates that the atom immediately to the left should
    be matched zero or one time in order to be evaluated as true. |

    | (n, m) | The curly braces bounds, or how many times the atom immediately to
    the left should be matched. (n) means that it should be matched exactly n times.
    (n,) means it must be matched at least n times. (n, m) means that it must be matched
    at least n times and not more than m times. |

    | [char_sequence] | Bracket expression matches a sequence of characters against
    individual characters in the target string. For instance, "[abc]" evaluates to
    true if any "a", "b", or "c" is contained in the target string. Bracket expressions
    are a more readable alternative to the alternation metacharacter. |


    (cont''d)'
