    |

    | CHAR_LENGTH | | See LENGTH. |

    | CHARACTER_LENGTH | | See LENGTH. |

    | COS(expr) | Mathematic | Returns the cosine of expr, where expr is given in
    radians. |

    | CONV(N, from_base, to_base) | String | Converts numbers between dif-erent bases.
    |

    | CONCAT(expr_list) | String | Returns a string consisting of all expressions
    in the list joined together. |

    | COT(expr) | Mathematic | Returns the cotangent of expr. |

    | COUNT(expr) | Group By | Used in group by clauses to count the number of non-NULL
    rows retrieved by a SELECT statement. |

    | CURRENT_DATE() | Date/Time | Returns today''s date as a value in ''YYYY-MM-DD''
    or YYYYMMDD format, depend-ing on whether the function is used in a string or
    numeric con-text. You can use CURDATE instead of CURRENT_DATE. See CURRENT_TIME,
