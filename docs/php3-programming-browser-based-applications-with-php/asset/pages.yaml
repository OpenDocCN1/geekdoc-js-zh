    Now let''s look at the bit patterns of the variables before and after the shift
    operation. First, $int_a is assigned 128 (in decimal) or 10000000 (binary). The
    value in $int_a is then shifted left by two places. So the new value is 00100000
    or 32, which is assigned to $int_b.'
