  md: "# Another example of alternative delimiters is\n\n\"/root/home/random.dat{\"\
    \n\nNote that the same character has been used for the ending delimiter in this\
    \ example. I emphasize this point because Perl uses the } character to end patterns\
    \ beginning with (.\n\nThe main purpose of using alternative delimiters is to\
    \ avoid the unsightly sprinkling of escape characters in front of metacharacters\
    \ that are used for their non-meta meaning. You might think that placing a variable\
    \ inside the pattern and then using variable interpolation would solve this problem.\
    \ Unfortunately not, at least as of PHP v3.0.9.\n\n```\n$target = '/home/medined/readme.txt';\n\
    $pattern = '/medined/';\nif (preg_match(\"/pattern/\", $target) {\n    echo 'found';\n\
    }\n```\n\nThe above code results in the following error:\n\nWarning: Unknown option\
    \ 'e' in (file) on line (number)\n\nIf you change $pattern to '\\/medined/', the\
    \ error is eliminated and the pattern. If you choose the single quote as your\
    \ delimiter character, then no variable interpolation is performed on the pattern.\
    \ However, you still need to use the backslash character to escape any of the\
    \ metacharacters discussed in the \"How to Create Patterns\" section of this chapter.\n\
    \nTip\n\nI tend to avoid delimiters that might be confused with characters in\
    \ the pattern. For example, using the plus sign as a delimiter, '+abc+' does not\
    \ help program readability. A casual reader might think that you intend to add\
    \ two expressions instead of matching them.\n\n# Pattern Options\n\nWith the support\
    \ of pattern delimiters, it becomes possible to add pattern options which are\
    \ placed after the ending delimiter. Table 9.3 shows the available options and\
