    # Attribute Default Specification


    The portion of an ATLIST declaration which follows its type is used to declare
    whether a default is provided by the DTD, whether a value must be provided by
    the document, and so on. Together, these are referred to as the attribute''s default
    specification.


    The simplest kind of default specification is for the DTD author to assign a specific
    default, as here:


    ```

    <ATLIST person gender

    (male | female | unknown) "unknown" >

    ```


    This says that if a particular occurrence in a document of the person element
    has no gender attribute, the application should assume the value to be "unknown".


    A DTD may also assert that the attribute must be assigned some value in the document,
    without providing a default, by using the special #REQUIRED keyword. For instance:


    ```

    <ATLIST website url CDATA #REQUIRED>

    ```


    In this case, in order to be valid, any document containing a website element
    must provide an url attribute for it.


    If the DTD''s author doesn''t care to constrain the attribute''s value in any
    particular way aside from whatever restrictions may have been placed on it by
    the type specification, he or she can use the #IMPLIED keyword, as in the following:


    ```

    <ATLIST person name CDATA #IMPLIED >

    ```


    If a particular person element has no associated name attribute in this case,
    no default is assumed by the XML processor.


    Finally, there''s a somewhat odd default specification, indicated by the #FIXED
    keyword and a value in quotes. For example:


    ```

    <ATLIST doc version NMTOKEN #FIXED "1.0">

    ```'
