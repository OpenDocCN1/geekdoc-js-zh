    # Functions


    Functions help you to organize your code into pieces that are easy to understand
    and work with. They let you build your program step by step, testing the code
    along the way.


    After you get an idea for a program, you need to develop a program outline, either
    in your head or on paper. Each step in the outline might be one function in your
    program. This is called modular programming, a technique that lets you hide programming
    details so that readers of your source code can understand the overall aim of
    your program.


    For instance, if your program has a function that calculates the area of a circle,
    the following line of code might be used to call it:


    ```

    $flt_area_of_circle = area_of_circle(5);

    ```


    By looking at the function call, the reader knows what the program is doing. Detailed
    understanding of the actual function is not needed.


    > Well thought-out function and variable names help people to understand your
    program. If the line of code was $areaFC-areaCirc($fRad); its meaning would not
    be clear.


    > Calling a function means that PHP stops executing the current series of program
    lines. Program flow jumps into the program code within the function. When the
    function is finished, PHP jumps back to the point at which the function call was
    made. Program execution continues from that point onward.'
