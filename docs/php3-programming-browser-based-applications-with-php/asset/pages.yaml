  md: '# POSIX Style Functions


    ```

    string eregi_replace(

    string PATTERN,

    string REPLACEMENT,

    string TARGET

    );

    ```


    # Description


    ereg_replace searches the TARGET parameter for matches to PATTERN, replacing any
    matching text with REPLACEMENT. eregi_replace performs the same task, but ignores
    case distinctions.


    Patterns can contain parenthesized substrings, like the ereg function. However,
    their use is slightly different. You can refer to each matching substring using
    \n notation, where n refers to the nth parenthesized substring. Up to nine substrings
    can be used.


    # Return Value


    Returns the changed string or the original string if no changes are made.


    # Example


    The following example code replaces a 201 area code with a 973 area code. Additionally,
    it converts from dashes as the delimiters to using periods.


    ```

    $target = "David Medinet,201-927-7670"


    $pat_area = ''([0-9][0-9][0-9])'';

    $pat_exchange = ''([0-9]{3})'';

    $pat_number = ''([[:digit:]]{4})'';


    // Combine the three patterns into one

    $pattern = "$pat_area-$pat_exchange-$pat_number";


    $buffer = ereg_replace($pattern, "973\\2\\\\3", $target);


    echo "Old: $target<br>";

    echo "New: $buffer<br>";

    ```


    # This code displays


    Old: David Medinets,201-927-7670

    New: David Medinets,973.927.7670


    Notice that the $pat_number variable has changed; it now uses parentheses so that
    it can be referred to as \3 in the replacement parameter.'
