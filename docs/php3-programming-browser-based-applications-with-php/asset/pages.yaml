  md: '# What Does XML Look Like?


    Deluged with all this information about the nuts and bolts of XML, you might be
    wondering if you can view it in a plain old Web browser. A couple of things make
    answering this question more complicated than it should be.


    First, although as of this writing the core XML specification is 18 months old,
    a lot of important related standards (as XLink and XPPointer, which will provide
    a kind of hyperlinking-on-steroids functionality) have not firmed up. Second,
    think about the issue of separating content from display characteristics—ostensibly
    one of XML''s strengths: If a browser doesn''t know in advance which tags it will
    need to display, how will it know how to display them?


    The answer, as intimated earlier, is that everything in the XML document that
    is desired to be displayed must have its display defined in an external style
    sheet. There''s one additional catch: The browser must be a version 5 or greater.
    Internet Explorer 5 by Microsoft comes with a default style built in. With IE5,
    an XML file displays by default an expandable/collapsible tree of elements, nested
    one inside another, as seen in Figure 16.2.


    ![](img/60cf9e8f697416e18e3ca18e3d4f7f4e_431_0.png)


    Figure 16.2 Microsoft''s Internet Explorer 5 shows XML files as a tree of elements
    by default.'
  merge: -1
  pgno: 431
- img_proc: true
  md: '# What Does XML Look?


    This is functional but rather dull, and because it displays the markup as well
    as any contained content, it can be confusing to users. A better option is to
    enhance the XML using a CSS style sheet. It hides the tags and furthermore is
    compatible with both IE5 and Netscape''s Mozilla browser. (Although this may go
    without saying, note that the CSS selectors use XML tags, not those familiar to
    you from HTML.) Figure 16.3 shows the Mozilla browser''s view of a CSS-enhanced
    document.


    ![](img/60cf9e8f697416e18e3ca18e3d4f7f4e_432_0.png)


    **Figure 16.3** Netscape''s Mozilla needs a style sheet to display XML files.


    An even better alternative than using CSS style sheets alone is to use the Xtensible
    Style Language, or XSL, in tandem with CSS. XSL, as of which this writing is not
    yet a finalized spec, differs from CSS in several ways, most obviously in that
    its syntax is pure XML. It consists of two parts: a transformation language and
    a formatting language for controlling the document. The latter is not yet implemented
    by any mainstream browser or software, hence the need now to combine the former
    with CSS.'
  merge: -1
  pgno: 432
- img_proc: true
  md: 'As for the transformation language—XSLT, for short—its purpose (as you might
    guess) is to transform the tree provided by the element structure of the source
    document into a different tree. The most common use of XSLT as of this writing
    is to transform XML into well-formed HTML, and then (optionally) linking the result
    to a CSS style sheet. The Mozilla project has-to-date refrained from implementing
    any XSLT functionality—an understandable caution, since the XSLT spec still has
    not attained final formal W3C approval—but Microsoft has built into IE5 an XSLT
    processor (with, characteristically, some Microsoft-specific extensions).


    Various freeware, shareware, open-source, and other XSLT processors have made
    their tentative vais into the marketplace. Few of these actually display the result
    tree, however; most are straight command-line or GUI-based converters.


    # For Further Study...


    This chapter barely scratches the surface of XML''s capabilities and the breadth
    of options, applications, and software available. Aside from further general reading,
    checking the Web (particularly the W3C site, http://www.w3.org/) for information
    on the following areas of particular interest, all of which bear directly on XML:


    +   - The Document Object Model (DOM)—As discussed briefly in this chapter, the
    DOM is an API which permits manipulation of document trees and portions thereof.


    +   - Namespaces in XML—A namespace is functionally equivalent to a particular
    XML application or dialect—that is, the “universe” in which a particular tag or
    attribute has a particular meaning. What happens if, through one operation or
    another, for one reason or another, fragments of XML from two different namespaces
    end up in the same document and they share identical element names with different
    meanings? The namespaces in XML specification describes a mechanism for resolving
    these clashes.


    +   - Resource Description Framework (RDF)—The RDF spec describes a class of metadata
    that goes beyond HTML’s'
