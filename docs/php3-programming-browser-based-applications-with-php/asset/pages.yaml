  md: '# Chapter 17 / Processing XML with PHP


    This chapter reads the XML output from the World Wide Web Wrapper Factory and
    parses it into information understandable to a PHP program. First, information
    about movies is parsed followed by the information about companies. You can use
    the techniques developed in this chapter (and at the World Wide Web Wrapper Factory)
    to retrieve information from any Web site.


    # Getting Movie Information


    The Internet Movie Database (http://www.imdb.com) has information about nearly
    every movie ever made. If you_re designing an intranet site for a video store,
    it probably doesn_t make sense to spend money compiling statistics about movies
    when imdb.com has already done so.


    Using the following URL as a template (the three lines comprise one URL), you
    can retrieve information about any movie:


    ```

    http://db.cis.upenn.edu/cgi-bin/serveXML?

    SERVICE=IMDB

    &URL=http://us.imdb.com/Movie/Title?(title_reference)

    ```


    Admittedly, determining the title_reference (either IMDb''S record key or the
    movie name and release year) might not be the easiest task. But, gathering that
    information is many times easier than developing the movie database.


    Listing 17.1 shows the results for the movie, Harvey, which has a record key of
    0042546. (Note that for the sake of brevity, all of the lines are not shown).


