  md: '# MySQL''s Functions


    Much of MySQL flexibility comes from the many functions that it supports:


    **Table C.2** MySQL’s functions


    | Function | Type | Description |

    | --- | --- | --- |

    | ABS(expr) | Mathematic | Returns the absolute value of expr. |

    | ACOS(expr) | Mathematic | Returns the arc cosine of expr. |

    | ASCII(expr) | String | Returns the ASCII value of the firstst character of expr.
    |

    | ASIN(expr) | Mathematic | Returns the arc sine of expr. |

    | ATAN(expr) | Mathematic | Returns the arc tangent of expr. |

    | ATAN2(expr1, expr2) | Mathematic | Returns the arc tangent of expr1 and expr2.
    |

    | AVG(expr) | Group By | Used in group by clauses to calculate the average value
    of expr. |

    | BENCHMARK(count, expr) | Miscellaneous | Executes expr count times. Always returns
    zero. |

    | BIN(expr) | String | Returns a string representation of the binary value of
    expr. |

    | BIT_AND(expr) | Group By | Used in group by clauses to find the bitwise AND
    of all bits in expr. |

    | BIT_OR(expr) | Group By | Used in group by clauses to find the bitwise OR of
    all bits in expr. |

    | CEILING(expr) | Mathematic | Returns the smallest integer value not less than
    expr. |'
  merge: -1
