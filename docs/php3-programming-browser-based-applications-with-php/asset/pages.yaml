  md: '# Interlude Two: Maintaining a List


    It is useful to be able to maintain a list using your computer. The contents of
    the list is immaterial. Both email addresses and grocery items are the same from
    the point of view of a list. Importance should be placed on a consistent interface
    and a complete set of functions.'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'This chapter creates a list maintenance application that you can quickly adapt
    to your varying needs. Over the 20 years I''ve been developing computer applications,
    I have needed to maintain innumerable lists, from default values to month names
    to employee names. If you have a list maintenance program already working that
    can be easily configured, your efficiency as a programmer will be greatly enhanced.


    # The List Maintenance Specifications


    Before starting any project, my friend Tobe suggests that a set of specifications
    should be created. If nothing else, a bulleted list of requirements will suffice.
    Here is my list of specifications, along with some implementation comments:


    +   * Add code to automatically connect to the database in common—This change
    lets you forget about the database connection part of the application and concentrate
    on functionality.


    +   * Support a “insert record” feature—This feature should present the user with
    a form and a submit button.


    +   * Support a “display record” feature—This feature should call a display routine
    that can be easily modified to account for different tables. For example, a table
    of month names might need only a month_name field, whereas a table of grocery
    items needs need the name of the item and the number of items to buy, at the very
    least.


    +   * Support a “delete record” feature—The application should set a deleted field
    only in the record to be deleted. The application should also be able to undo
    records.


    +   * Support a “edit record” feature—This feature, like the display feature,
    should call an edit routine that can be easily modified to account for different
    tables.


    +   * Support a “clone record” feature—This feature copies information from an
    existing record and lets the user modify the new record as needed.'
