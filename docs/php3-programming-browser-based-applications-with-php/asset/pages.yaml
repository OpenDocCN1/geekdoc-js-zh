- img_proc: true
  md: 'Linux, Apache, MySQL, and PHP (LAMP) have become the facto standard for database-driven
    Web applications over the last several years. MySQL is well-known as an easy to
    set up, fast, and reliable database system; nevertheless, the standard distribution
    comes with command-line administration tools only. Until now, a powerful, comfortable,
    and platform-independent user interface was missing.


    phpMyAdmin was created—like most open source projects—because the author had a
    personal need for it. Good Old tradition encourages making such tools available
    to a wider audience for free; the community contributes bug-fixes, new features,
    and tips in return. Some of the most useful parts of phpMyAdmin were not created
    by the author himself, but by users who realized these additions on their own.
    You too are invited to contribute to it.


    Using phpMyAdmin and a Web browser, a Web developer can fulfill most of a database
    administrator''s tasks without having to worry about the syntax of SQL statements.
    Aside from standard tasks such as creating databases or managing keys, and editing
    table contents, phpMyAdmin has some interesting features. It can create tables
    or databases, import and export text files with Comma Separated Values (or CSV),
    and it supports over 10 languages.


    You''ll probably want to add your email address to the mailing list at http://phpwizard.net/
    so that you will be notified whenever a new version comes out (which happens once
    in a month or so).


    # phpMyAdmin''s Features


    Now that I''ve hyped the tool, I''m sure you''d like to know what it can really
    do. Here is a brief list of its abilities:


    +   - create and drop databases

    - create, copy, drop, and alter tables

    - delete, edit, and add fields

    - execute any SQL statement, even batch queries

    - manage keys on fields

    - load text files into tables

    - create and read dumps of tables

    - export and import CSV data'
