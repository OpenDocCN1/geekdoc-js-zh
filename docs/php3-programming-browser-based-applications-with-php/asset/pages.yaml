  md: '# The Unary Operators


    The unary operators act on a single operand. They are used to change an operand''s
    sign, to increment or decrement an operand''s value. Incrementing a value means
    to add one to its value. Decrementing a value means to subtract one from its value.
    Table 3.4 lists the unary operators found in PHP.


    | Operator | Description |

    | --- | --- |

    | +op1 | Changes the sign of an operand to positive |

    | -op1 | Changes the sign of an operand to negative |

    | !op1 | Performs a logical not of the operand |

    | ~op1 | Inverts the bits of the operand |

    | ++op1 | Increments operand by one before it''s used |

    | --op1 | Decrement operand by one before it''s used |

    | op1++ | Increments operand by one after it''s used |

    | op1-- | Decrements operand by one after it''s used |


    Operators can start to get complicated when unary operators are introduced because
    adding negative numbers can be awkward. Few people write a mathematics statement
    like: 345 +-23. However, in PHP you could use 354 + $int_gas_bill, where $int_gas_bill
    represents a $23.00 debit; in other words, a negative number.


    Using the unary plus operator does nothing, and PHP the unary negative operator,
    changes the meaning of a value from positive to negative or vice versa. For instance,
    if you had a variable called $int_first equal to 34. Then when printing, -$int_first
    would display -34.


    The logical not (!) is used to convert logical true values to logical false values.
    For example, !34 is zero and !0 is true.


    True has a value of 1. And false has a value of 0.'
