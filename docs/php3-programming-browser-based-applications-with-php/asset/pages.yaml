  md: '# Moving toward the Future


    The generate method places the doctype tag into a buffer, and then appends the
    start and end tags. In a later section "Adding Head Support," the generate method
    is expanded to also append the contained elements to the buffer.


    The htmlspecialchars function converts characters like ''<'' into HTML entities
    like &lt; so that browsers can display them. With this step, the browser sees
    and interprets the HTML, which means that you only see the Web page that results
    from the HTML, not the HTML itself.


    And finally, the echo function is used to send the HTML buffer back to the client
    browser.


