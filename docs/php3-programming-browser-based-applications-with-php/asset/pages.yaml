    # Simple Expressions with Side Effects


    Expressions can have side effects beyond whatever their obvious task is. Side
    effects come about when one or more variables have their value changed and the
    change is not the result of an assignment operator. For example, a called function
    can set page-scoped variables are specified inside functions using the global
    keyword, or an auto-increment operator can change the value of a variable. Side
    effects tend to make programs harder to understand, so one of your goals in programming
    should be to reduce side effects as much as possible.


    Avoiding side effects is a good reason not to use the global keyword.


    Take a look at these examples of expressions with side effects:


    +   * $int_total_glasses = ++int_number_of_glasses—The $int_number_of_glasses
    variable is incremented in addition to a value assigned to $int_total_glasses.


    +   * function one() global $str_directory_name; $str_directory_name = ''/dos_data'';—When
    the one() function is used, a page-scoped variable is changed.


    # Complex Expressions


    Complex expressions can use any number of literals, variables, operators and functions
    in any sequence. Here are some examples:


    +   * ((10 + 2) / count_fishes) * 114—a complex expression with three operators
    and a function call.


    +   * initialize_count(20 - ($int_page_number - 1) * 2)—a simple function call
    with a complex expression as its parameter.


    > Sometimes it is difficult to tell whether you have enough parentheses for all
    of your opening parentheses. Starting at the left, count each open parenthesis,
    and when you find a closing parenthesis, subtract one from the total. If you reach
    zero at the end of the expression, the parentheses are balanced.


