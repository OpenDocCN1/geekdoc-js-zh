  md: 'If you can picture the List Maintenance application as a string of commands,
    the above five steps were spliced in at precise intervals to add functionality.
    Step 1 updated the SQL statement used to select the records to display. Step 2
    updated the include file used to display the HTML table. Step 3 added code to
    initialize variables based on the user''s requests. Step 4 and 5 cause the currently
    sorted column name to be displayed in red.


    Each line of code in this book needs to be 60 characters or fewer to avoid wrapping
    around the next line. This forces the use of temporary variables as in Step 2.
    Specifically, I''m referring to the


    ```

    $act = "action=set_sort_field";

    $sort = "sort_field=str_month_name";

    $asc = "sort_direction=ASC";

    echo "<a href=\$PHP_SELF?\$act=$sort&$asc="></a>";

    ```


    When PHP processes URL requests that like file.php?variable1=valuevariable2=value,
    those variables are placed in the $HTTP_GET_VARS array. The common.inc script,
    in turn, copies these elements into the $arr_request array. Chapter 5 provides
    the reasoning behind this technique.


    # Displaying Records Five at a Time


    Limiting the number of records that display on Web pages is generally a good idea
    because 10,000 records on a page can take a long time to display. What does it
    take to implement this feature?


    +   * Variables to hold the initial record to display and how many records to
    display on each page.

    * Initialization code to copy URL information into the variable mentioned above.

    * Variables to track both the number of records in the database and the number
    of records displayed on the page. If the Web page tries to display 5 records,
    the database table only holds 4, or if the database table holds 12 records and
    we''re displaying page 3, then fewer than 5 records will be displayed.

    * Code to calculate which record starts the previous set of five records and code
    to calculate which record starts the next set of five records.'
