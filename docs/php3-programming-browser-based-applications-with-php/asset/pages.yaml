  md: 'The end result of this compilation is a version of Apache with PHP built in.
    To compile PHP, use the following commands:


    +   1. `cd /usr/local/src/expat`nConnects to the expat directory.


    +   2. `make`nCompiles the expat source files.


    +   3. Append the following lines to the Makefile file. Make sure that you use
    the Tab key before entering the ar and ranlib lines.

    ```

    libexpat.a: $(OBJS)

    ar -rc $(OBJS)

    ranlib $@

    ```


    +   4. `make libexpat.a`

    Combines the expat object files into a library file.


    +   5. `mv libexpat.a /usr/local/lib`

    The PHP configuration program knows to look for the libexp-pat.a file in the /usr/local/lib
    directory. Moving the file to a known location saves you trouble later.


    +   6. `cd /usr/local/src/php-3.0.11`

    Connects to the top-level PHP directory.


    +   7. `mkdir /usr/local/include/xml`

    Make sure the /usr/local/include/xml directory exists.


    +   8. `ln -s /usr/local/src/expat/xmltok.h /usr/local/include/xmltok.h`

    Why copy when you can create a symbolic link?


    +   9. `ln -s /usr/local/src/expat/xmlparse.h /usr/local/include/xmlparse.h`

    This is another header file that PHP needs in order to compile correctly.'
