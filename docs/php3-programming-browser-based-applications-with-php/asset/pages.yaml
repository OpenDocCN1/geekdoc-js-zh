- img_proc: true
  md: 'You now know the basic terminology needed to work with databases:


    **Columns**—Also known as fields, columns are individual pieces of information.
    For the most part, fields are atomic; that is, they can''t be split up into smaller
    chunks. For example, a person''s name is not atomic, but a person''s first name
    is.


    **Records**—a collection of related fields that make up a record. For example,
    all fields needed to describe the paperback book, *Lord of the Rings*, could be
    a single record. The fields could hold specific data, such as the book''s title,
    year of publication, number of pages, and publisher.


    **Tables**—a collection of homogeneous records. All records in a table contain
    the same set of fields. Typically, tables are names using a plural. For example,
    *paperback_books* and *patient_names* are both good names for a database table.


    # Creating Unique Records


    Without going into too much detail, each record in a table should be unique so
    that it can be easily retrieved when needed. The value used to retrieve the record
    is called the *key*. This key is exactly analogous to the key used to access PHP
    array variables.


    When designing database tables, it''s a good idea to create a field called `[table_name]`
    to hold the key value. For example, if the table is called `patient_names`, the
    key field would be called `key_patient_names`. The value in this field starts
    at one, when the first record is added to the table, and is incremented each time
    a record is added.


    # Important Fields for Each Record


    In addition to the key field, all tables that I use in a production environment
    (as opposed to a research or development environment) have `dte_created` and `dte_modified`
    fields. Most of the time these fields aren''t used. However, when needed, they
    are critical for auditing and archiving processes.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# A Word or Two about Field Data Types


    Most databases have a plethora of data types to choose from when designing fields.
    Unfortunately, it seems that few databases agree on what to call each data type.
    For the sake of simplicity, I usually use integer, numeric (for floating point
    numbers), and varchar (for string data).


    > Using the variable-length varchar data type makes your database much more space-efficient
    than using fixed-length char data type. If your field is defined as char(100),
    the database ensures that all data placed into that field is 100 characters long.
    If the datum for that field is only 15 characters, then 85 spaces are appended
    to its end to make up the difference.


    Note


    > If you use the char data type, use PHP''s trim function to remove any extra
    spaces from the end of the datum.


    Tip


    # Designing Fields to Store Email Messages


    Before creating a database table, you need to determine the kind of information
    it will contain. Most database tables contain information that describes real-world
    objects—things that can be described as nouns. For example, tables might hold
    information about people, cars, pens, visitors to a Web site, inventory items,
    and many other things far too numerous to mention.


    Let''s build a database table to hold email messages. What data is associated
    with email? For the purposes of this book, the following fields of information
    are assumed to be all that is needed:


    **Date**—All data is stored using this format: YYYY-MM-DD HH:MM:SS. In other words,
    year-month-day hour-second. The time is stored in 24-hour format. All told, 19
    characters are needed to represent a specific date and time. As you''ll see later,
    this format provides for quick sorting and comparison.


    **From**—The email address of the person (or entity) who sent the message. I don''t
    know the maximum length of an email'
