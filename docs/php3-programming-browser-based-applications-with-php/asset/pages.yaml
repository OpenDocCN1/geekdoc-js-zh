  md: '# What is CGI?


    CGI, or Common Gateway Interface, is the standard programming interface between
    Web servers and external programs. PHP hides most of the complexity from you,
    but knowing the fundamentals is critical to intelligent application design and
    debugging.'
  merge: -1
