  md: '# Literal Values


    For those of you who are not familiar with non-decimal numbering systems, here
    is a short explanation.


    In decimal notation—base ten—when you see the value 15, it signifies (1 * 10)
    + 5 or 15₁₀. The subscript indicates which base is being used.


    In octal notation—base eight—when you see the value 15, it signifies (1 * 8) +
    5 or 13₈.


    In hexadecimal notation—or base sixteen—when you see the value 15, it signifies
    (1 * 16) + 5 or 21₁₆. Base 16 uses 6 characters in addition to 0 through 9 so
    that each position can have a total of 16 values. The letters A-F are used to
    represent. So the value BD₁₆ is equal to (B * 16) + (D * 10) which is 176.


    equivalent to 102,300. You can also represent small numbers if you use a negative
    sign. For example, 10.23E-4 is .00123. Simply move the decimal point to the right
    if the exponent is positive and to the left if the exponent is negative.


    Let''s take a look at some different types of numbers that you can use in your
    program code. First, here are some integers.


    +   * 123—integer using decimal notation.

    * 043—integer using octal notation. Numbers starting with zero are interpreted
    as octal.

    * 0x23—integer using hexadecimal notation. Numbers starting with “0x” are interpreted
    as hexadecimal.


    Numbers that have fractional components are called floating point numbers. You
    frequently see these values referred to as floats for simplicity''s sake.


    +   * 100.5—A float with a value in the tenths place. You can say 100 and 5/₁₀.

    * 54.534—A float with fractional values to the thousandths place. You can also
    say 54 and 534/₁₀₀₀₀.

    * .000034—A very small float value. You can represent this in scientific notation
    as 3.4E-5.'
