  md: '# Core XML


    # Elements


    An element is simply everything contained within a tag or between a pair of matching
    opening and closing tags. This can include either plain text and any of the other
    types of markup. If any other elements are contained within the scope of a given
    element, they must be fully contained. That is, consider the following HTML fragment:


    ```

    <b>This is bold text, and <i>this is italic.</i></b>

    ```


    Note that the closing tags cause the elements to be improperly nested; the render-italic
    one, starts out within the scope of the render-in-bold one, but closes outside
    the scope of the render-bold tag (signed by the closing </b>). As mentioned above,
    HTML browsers accept this; XML processors, however, complain loudly and reject
    the document.


    XML also introduces the notion of an empty element or tag. Such an element contains
    nothing between its start and stop tags; its “contents” might be said to be built
    into the tag itself. Examples from HTML that are analogous to XML empty tags are
    <br> (the line-break tag) and <img> (containing a link to a graphic). In XML,
    you can code an empty tag in one of two ways:


    ```

    <tagname></tagname>

    ```


    or


    ```

    <tagname/>

    ```


    Therefore, if a specific flavor of XML has an <img> tag, it can appear in a document
    either as


    ```

    <img ...></img>

    ```


    or as


    ```

    <img .../>

    ```


    The special "/>" form to terminate an empty element is unique to XML.


    # Attributes


    As in HTML, tags can include attributes—name/value pairs that assign properties
    to a given occurrence of the tag. In the following'
