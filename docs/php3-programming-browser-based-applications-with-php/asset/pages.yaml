  md: '```

    NULL

    dte_updated datetime DEFAULT ''0000-00-00 00:00:00'' NOT

    NULL

    PRIMARY KEY (key_conconcurrent)

    )

    ```


    Then, whenever a user requested the right to edit a record, this field could be
    checked. If it''s empty, the edit form could be displayed, and if not, the record
    would just be viewed.

    Can you see any drawbacks to this technique?

    You are correct if you said this technique requires every protected table to be
    changed. Obviously, changing tables is not desirable. Aside from the extra work
    involved, it''s not needed. Instead, a new database table called locks can be
    created:


    ```

    CREATE TABLE

    locks (

    key_locks INT (5) not null AUTO_INCREMENT

    table_name VARCHAR (50) not null

    user_name VARCHAR (50) not null

    record_key INT (5) not null

    dte_created datetime DEFAULT ''0000-00-00 00:00:00'' NOT NULL

    PRIMARY KEY (key_locks)

    )

    ```


    This table is flexible enough to keep track of any number of tables. Each time
    a user edits a record, their username, the name of the table, and the key value
    of the edited record are stored. The lock record is deleted when the edited record
    is saved.

    Can you see any drawbacks to this technique—It''s always important to play devil''s
    advocate—looking for weak spots is a necessary activity when designing applications.
    In this case, a problem arises if the user editing the record decides to go home
    before saving the record (which causes the lock to be deleted).


    You can code around this problem by checking the dte_created field. If the lock
    is older than 15 minutes (or some other time interval you select), it can be deleted
    and the edit form displayed.'
