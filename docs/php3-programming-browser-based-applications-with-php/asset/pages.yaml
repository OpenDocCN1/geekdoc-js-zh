  md: '# What is PHP?


    PHP is a combination of programming language and application server. The programming
    language is similar to many others in that it has variables to store temporary
    values and operands to manipulate the variables. The real value of PHP lies in
    its role as an application server.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'When I refer to an application server, I''m talking about a program that pulls
    together several technologies into one package. These technologies include:


    +   - A robust programming language

    - Access to databases for permanent storage of data

    - Support of Internet protocols, especially email and HTTP


    An application server can have many other features, but this list is the bare
    essentials.


    By providing a front end to these diverse technologies, PHP makes your job easier.

    The rest of this chapter is a hedge-podge of observations about PHP and its role
    in application development.


    # Origins


    PHP was created by Rasmus Lerdorf. It was originally a simple program written
    in Perl that tracked visitors to his online resume. Then it was rewritten in C
    and its scope was expanded to include access to databases. Around this time, people
    began asking for copies of the program for their own use. Rasmus wrote some documentation
    and released PHP v1.0. More and more people used PHP, and they clam for additional
    features such as loop statements and array variables. By this time, other programmers
    were contributing code (Zeev Suraski and Andi Gutmans were major contributors),
    and it became apparent that PHP needed to be rewritten from the ground up. And
    thus, PHP v3.0 was born.


    # Features


    PHP''s features include:


    +   - Open source—all of PHP''s source code is available. In fact, it''s contained
    on the CD-ROM that comes with this book.

    - No cost implementation—PHP is free.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '+   Server-side—Because PHP runs on the Web server, PHP programs can be large
    and complex without slowing down clients.


    +   Cross-platform—PHP programs can be run on UNIX, Linux, or Windows computers,
    although this book focuses on Linux.


    +   HTML embedded—Because the PHP language is embedded in HTML, it is easy to
    learn.


    +   Simple language—Unlike Java or C++, the PHP language sticks to the basics,
    yet it is powerful enough to support any size Web site.


    +   Efficiency—PHP consumes very few system resources in comparison to other interpreted
    languages. When built as part of the Apache server, execution of code doesn''t
    require calls to an external binary—the server interprets the scripts with no
    overhead.


    +   XML parsing—You can build a version of PHP that can read XML-based information.


    +   Database modules—You can use PHP to access Oracle, Sybase, MS SQL, Adabase
    D, MySQL, PostgreSQL, dBase, FilePro, Solid, Unix dbm, Informix/Illustra, and
    any database that supports the ODBC standard.


    +   File I/O—PHP has many functions to handle any file processing need.


    +   Text processing—PHP has many functions to process text, including the ability
    to pattern match.


    +   Complex variables—PHP supports scalar, array, and associative array variables.
    This provides you with a solid foundation to support advanced data structures.


    +   Image processing—You can use PHP to dynamically create images.


    +   And much more!'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# How Much Does PHP Cost?


    PHP is free. The full source code and documentation are free to copy, compile,
    print, and give away. Any programs you write in PHP are yours to do with as you
    please; there are no royalties to pay and no restrictions on distributing them
    as far as PHP is concerned.


    It''s not completely “public domain,” though, and for very good reason. If the
    source were completely public domain, it would be possible for someone to make
    minor alterations to it, compile it, and sell it it—in other words, to rip off
    its creator. On the other hand, without distributing the source code, it''s hard
    to make sure that everyone wants to use it.


    The GNU General Public License is one way to distribute free software without
    danger of someone taking advantage of you. Under this type of license, source
    code may be distributed freely and used by anybody, but any programs derived using
    such code must be released under the same type of license. In other words, if
    you derive any of your source code from GNU-licensed source code, you have to
    release your source code to anyone who wants it.


    # The PHP Language Is Embedded in HTML


    When programming with “classic” languages, like C or Pascal, all source code is
    compiled into an executable file. And then that executable file is run to produce
    HTML tags for remote Web browsers to display. PHP, on the other hand, doesn''t
    get compiled (at least not into executable files). You can intermingle your PHP
    code with HTML. For example, the following code displays “Hello, world!” The code
    is shown in bold text.


    ```

    <HTML>

    <HEAD>

    <TITLE>Test</TITLE>

    </HEAD>

    <BODY>

    <?php $string = ''world!''; ?>

    <h1>Hello, <?php echo $string; ?></h1>

    </BODY>

    </HTML>

    ```


    The PHP application server (for the purposes of this book) is tightly integrated
    into the Apache Web server—you might even call them one program. When a Web browser
    requests a PHP Web'
  merge: -1
  pgno: 25
- img_proc: true
  md: "# The PHP Language Executes on the Web Server\n\npage, the PHP part of the\
    \ Web server is called into play. It looks through the requested Web page looking\
    \ for <?PHP ... ?> tags and executes any that are found.\n\nAny output generated\
    \ by the PHP code replaces the <?PHP ... ?> tag that generates it. For example,\
    \ after the PHP code is executed, the preceding Web page looks like this:\n\n\
    ```\n<HTML>\n<HEAD>\n  <TITLE>Test</TITLE>\n</HEAD>\n<BODY>\n  <H1>Hello, world!</H1>\n\
    </BODY>\n</HTML>\n```\n\nNotice that all of the PHP code is gone, and only HTML\
    \ remains.\nThe HTML produced by the PHP code is shown in bold text.\n\n# The\
    \ PHP Language Executes on the Web Server\n\nWhen developing Internet applications,\
    \ it is very important to know where your programs are executed. PHP always, executes\
    \ on the Web server. Don't laugh about my stressing this point. Sometimes in the\
    \ future, when thinking about the features of some application that's being designed,\
    \ someone will make the mistake of not knowing where PHP executes. Don't let that\
    \ someone be you.\n\nPHP cannot be directly compared to Java applets, ActiveX,\
    \ or JavaScript because they are all executed by the client's Web browser. You\
    \ can combine all of these languages with your PHP applications quite easily.\
    \ Simply use PHP to generate whatever HTML is needed to activate the applet or\
    \ ActiveX control, or in the case of JavaScript, you can dynamically generate\
    \ the JavaScript statements. If you're new to Internet application development,\
    \ this might not make sense. Hopefully, it will be clear after you finish reading\
    \ this book.\n\n# PHP is Ubiquitous\n\nUbiquitous may be an enthusiastic word\
    \ to use, but as of July 1999, there were nearly 600,000 Web sites using PHP.\
    \ The flood of news during the summer of 1999 regarding Linux and the Open Source"
  merge: -1
  pgno: 26
- img_proc: true
  md: 'movement seem to have jump-started the PHP community. You can see a graph showing
    the trend at http://www.php.net/usage.php3.


    Additionally, the PHP mailing list receives roughly 80 messages a day or 2,500
    messages a month. This indicates a thriving developer community. And companies
    that use PHP include Mitsubishi Motors, Volvo, Red Hot Software, E*Trade, First
    USA Bank, the San Francisco Giants, and the San Diego Zoo.


    # Is PHP Similar to C or Java?


    PHP programs bear a passing resemblance to C programs because PHP is derived from
    C, Perl, and Java. Some of the burdens of C—the string handling techniques—have
    been lifted through the Perl-like approach of PHP. And the some of the object-based
    nature of Java has rubbed off onto PHP.


    PHP can handle low-level tasks quite well. And if you need some of your code to
    execute especially fast, you can write your own C-based modules for PHP relatively
    easily.


    # Is PHP better than ColdFusion, Active Server Pages, or Java Server Pages?


    In true consultant fashion, I’ll answer this question, “yes and no.” The answer
    is “yes” because of its cost (free) and worldwide support network available through
    mailing lists and IRC. And PHP is constantly being improved. If you''d like a
    certain feature that isn''t available today, wait a few months. Someone might
    be programming that feature right now.


    The answer is “no” because no commercial software has more features than PHP.
    For example, Allaire’s ColdFusion has a Verity search engine packaged with it.
    Microsoft’s Active Server Pages technology provides the ability to integrate with
    Outlook, an email and workgroup program. And Java Server Pages lets you take advantage
    of the very large body of open source modules available through the Internet.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Summary


    Descriptions of PHP abound on the Internet and this chapter only briefly mentions
    some of the features of PHP and the reasons why PHP is considered one of the best
    tools to use when designing Internet applications.


    The next chapter, “Installing PHP,” takes you step-by-step through the processing
    of compiling, installing, and testing PHP.'
  merge: -1
