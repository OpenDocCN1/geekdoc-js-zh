    evaluates to either true or false, depending on your programming need. PHP has
    three keywords for controlling loop programs. These are the for, while, and do
    keywords, each handles a slightly different type of loop; but for each, expressions
    are used to determine when the loop stops. The for loop is the most complex, so
    let''s look at it first.


    # The for Keyword


    The syntax of the for statement consists of three expressions and a statement
    block. It looks like this:


    ```

    for (INITIALIZATION; CONDITION; OPERATION) (

    // statement block

    ```


    The initialization expression is executed first—before the loop starts. It can
    be used to initialize any variables, but most programmers only initialize those
    variables actually used inside the loop''s statement block. The initialization
    can also be performed immediately before the for statement, but using the initialization
    expression inside the for statement aids in creating self-documenting programs.


    > Initialization expressions are generally assignment expressions. Make sure not
    to confuse the equality operator (== with the assignment operator (=) when creating
    initialization assignments. Otherwise, this could be a source of subtle bugs in
    your program. For example, $index == 0 is incorrect. The correct expression is
    $index = 0.


    The condition expression is used to control whether the loop continues to loop
    or stops. When the condition expression evaluates to false (also known as zero),
    the loop ends.'
