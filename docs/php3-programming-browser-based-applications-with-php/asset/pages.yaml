    ```


    > Note In PHP, you never have to declare, define, or allocate simple data types
    (scalar or arrays). Using a variable name is equivalent to defining it.


    # Array Variables


    An array is a series of numbers and strings handled as a unit. Each piece of information
    in the array is considered an element of the array. You can also think of an array
    as a list. You could, for example, use an array to hold all the lines in a file
    or a list of addresses.


    You don''t need to worry about the rules for naming array variables as long as
    you never start a variable name with a number and remember to use only numbers,
    letters, and underscores to create the names.


    Array elements are given initial values in three ways. You can assign a value
    to each element individually:


    ```

    $arr_zoo[''pelican''] = ''Bird with a big beak.'';

    $arr_zoo[''cheetah''] = ''Fast cat.'';

    $arr_zoo[''horse''] = ''Four-legged animal.''

    ```


    You can use the following notation to assign more than one element at a time:


    ```

    $arr_zoo = array(

    ''pelican'' => ''Bird with a big beak.'',

    ''cheetah'' => ''Fast cat.'',

    ''horse'' => ''Four-legged animal.''

    );

    ```'
