  md: '# Summary


    simple <meta> tags in its ability to describe a document''s content and context.


    +   XML Schema—XML DTDs provide a satisfactory migration path from SGML''s version
    of them. There are a couple of drawbacks to DTDs, though. First, their syntax
    is rather inscrutable to someone who''s immersed in HTML and XML. Second, they
    don''t provide enough; they provide no data typing, for instance. XML Schema will
    address both of these limitations.


    # Summary


    XML is based on tags that impose a structure on data. Tags can convey information
    themselves (<customer id="1233">) or they can mark the start and end of information
    (<customer><id>1233</id></customer>).


    SGML is, more or less, the parent of XML. However, the SGML is enormous—much too
    large for everyday use. XML by way of contrast is described in 20 pages. It''s
    designed so that parsers can be written quickly and applications even quicker.


    It''s important to remember that XML is a standard that describes how to build
    dialects. XML itself has no tags. If necessary, think of it as a metanguage. Examples
    of XML dialects are SMIL and DocBook.


    HTML is not suitable for document-management or data-management because it mixes
    structural and display elements; browsers determine how tags are displayed, not
    developers, and it doesn''t take into account non-display factors such as page
    length.


    XML is different from HTML because it needs balanced tags, keeps whitespace intact
    (if needed), keeps case for tag names, and understands Unicode.


    In order to process XML, a parser program is needed. Parsers examine tags and
    either start specific functions based on each tag, invoke functions based on events
    (like start of tag or end of tag), or return a tree of elements in the XML document.


    Just like HTML, XML consists of tags and attributes. Two attributes that can be
    used with any tag are xml:lang and xml:space. These attributes specify which human
    language is being used and whether whitespace is significant.'
  merge: -1
  pgno: 434
- img_proc: true
  md: 'Also, just like HTML, XML understands entities—character strings that represent
    something else. &#252; represents the German umlauted u &gt; represents the greater
    than sign.


    The cdata tag is used avoiding processing information and can be used to hold
    HTML inside of XML. For example, <para> bold lines in HTML, can look like this:
    <![CDATA[<b>]]>.


    Processing instructions (PIs) can be used in any XML document. If the XML processor
    does not know about a particular instruction, it is ignored. PHP uses the <?php
    ... ?> processor instruction.


    XML can optionally contain a prologue that can contain comments, processing instructions,
    an XML declaration, and a document type declaration (DTD). The XML declaration
    specifies which XML version is being used (“1.0” for now), the character encoding
    scheme, whether or not the document is standalone. The DTD tag specifies whether
    DTD is needed to process the XML document.


    DTD construction is too complex to summarize in a paragraph or two. However, the
    idea behind DTD is not. DTDs tell the parser (or processor) program how the XML
    should look—which tags and attributes are allowed and in what order.


    The next chapter, “Processing XML with PHP,” looks at the tools PHP provides for
    processing XML.


