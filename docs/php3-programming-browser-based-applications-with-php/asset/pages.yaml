    # # Form Processing


    No chapter covering CGI would be complete without some mention of HTML forms.
    Even though you have already used HTML forms earlier in this book (see Chapter
    5, Interlude One: Connecting to a Database), this chapter provides more in-depth
    information. When errors occur in your scripts, knowing something about the interactions
    between HTML forms and Web servers is a great aid in debugging.


    # **A Brief Overview of HTML**


    HTML, or Hypertext Markup Language, is used by programmers to describe the contents
    of a Web page. It is not a programming language. You simply use HTML to indicate
    what a certain chunk of text is, such as a paragraph, a heading, or specially
    formatted text. All HTML directives are specified using matched sets of angle
    brackets and are usually called tags. For example, `<B>` means that the following
    text should be displayed in bold. To stop the bold, use the `</B>` directive.
    Most HTML directives come in pairs and surround the affected text.


    HTML documents need to have certain tags in order to be considered "correct".
    The `<HEAD>...</HEAD>` set of tags surround the header information for each document.
    Inside the header, you can specify a document title with the `<TITLE>...</TITLE>`
    tags.'
