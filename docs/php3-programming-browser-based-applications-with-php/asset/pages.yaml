  md: '# Summary


    This chapter covered PHP expressions, statements, and functions; which is a lot
    of ground to cover. However, this basic information is needed before the more
    exciting work of application development can be started.


    We learned that expressions are any combination of operands and operators. Operands
    can be any variable, literal, or function call. Some expressions with the auto-increment
    or auto-decrement operators can have side effects. As seen in the statement sections
    of the chapters, expressions are used to control decision, loop, and jump statements.


    Statements can be as simple as an expression with a semicolon after it. For example,
    $n = 5; is an assignment statement. Statements can also be much more complex.
    There are decision, loop, and jump statements.


    Both the if and switch statements are considered decision statements. Each statement
    evaluates an expression and executes a statement block depending on the value
    of the expression.


    Loop statements include the for, while, and do loops. Their purpose is to execute
    a statement block multiple times. For loops are the most complex—they have initialize,
    condition, and operation clauses. When the condition statement block, the for
    loop ends. When the condition expression is false, the for loop starts. After
    each iteration of the statement block, the operation expression is executed. While
    loops may never execute their statement block because their condition expression
    is evaluated first. Do loops, on the other hand, always execute their statement
    block—the condition expression is evaluated afterward.


    Functions are used to parcel your program into manageable pieces. They can accept
    multiple parameters and even assign default values to parameters. Variables used
    inside a function can only be accessed from inside that function. The global keyword
    is used when you need to access a variable defined by a Web page.


    When dealing with arrays or some mathematical concepts, you might need recursive
    functions. A recursive function calls itself. Remember that all recursive functions
    need a way to exit without recursion.'
  merge: -1
