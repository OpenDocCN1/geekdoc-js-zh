  md: '# Adding Comment Support


    If the sixth.php file is reloaded, it now displays


    ```

    <!DOCTYPE PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">

    <html>

    <head><title>PHP Module</title></head>

    <body></body>

