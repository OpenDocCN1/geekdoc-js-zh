  md: '# Avoiding the Web Spiders


    Be sure to protect the phpMyAdmin directory. By default, it is not protected in
    any way. It shouldn''t be readable by anyone and especially not by search engines.
    Although I''ve added a “nofollow” directive on every page, there might be search
    engines disregard it and still follow the links on the page. Think of the possible
    ramifications of say, AltaVista following a link named “Drop Database!”


    You can get an overview of Apache’s authentication methods at http://www.apache.com/features/userauth.Another
    tutorial is located at http://deepthought.texsci.edu/protected_dirs.html.


    Many search engines look for a file called robots.txt in the Web server home directory.
    If you haven''t already created this file (per-haps from the installation steps
    in Chapter 2), then create a file called /usr/local/apache/htdocs/robots.txt containing
    the lines in Listing 8.1.


    **Listing 8.1** robots.txt—This file stops many search engines poking into private
    directories


    ```

    #robots.txt for (hostname)

    User-agent *

    Disallow: /phpMyAdmin/

    ```


    Add another Disallow line for each directory you need to keep private.


    The robots.txt file does not not add password protection. It only stops some search
    engines from looking in the specified directories.


    # Password Protecting the phpMyAdmin Directory


    Assuming that you’ll be the only user accessing phpMyAdmin, you’re advised to
    create a .htaccess file to protect the phpMyAdmin directory. Most of the time,
    it is not a good idea to have such a powerful, system-level tool accessible by
    your visitors.'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'HTTP “Basic” authentication (see Chapter 13, “Authentication,” for information
    about authentication) provides a simple way to add password-protection to any
    directory on your Web site. The Web server takes care of the details; you need
    only be concerned with maintaining a list of users and creating .htaccess files
    in each directory that needs protecting.


    The list of authenticatable users is maintained through a utility (bundled with
    Apache) called htpasswd. If you start htpasswd with the -c option, it creates
    a new user in an encrypted file. For example, the following command creates a
    user called phpMyAdmin in a user list called /usr/local/apache/phpMyAdmin.users.
    Notice the file is above the Web server’s document root to enhance security. If
    a file isn''t in the document root or below, Web browsers cannot see it. Here''s
    the command that creates a user called phpMyAdmin:


    ```

    htpasswd -c /usr/local/apache/phpMyAdmin.users phpMyAdmin

    ```


    The program then prompts you to specify a password.


    You can create as many user list files as needed. However, most Web sites need
    only one.


    After you''ve created the new htpasswd user, you need to create a control file
    called /usr/local/apache/htdocs/phpMyAdmin/.htaccess with the following contents:


    ```

    AuthName "phpMyAdmin"

    AuthType Basic

    AuthUserFile /usr/local/apache/phpMyAdmin.users

    require user phpMyAdmin

    ```


    That''s. You should now be able to launch phpMyAdmin by opening http://localhost/phpMyAdmin/
    with your Web browser. Before anything else happens, your Web browser, of course,
    asks for the username and password that you just created. If you''re now looking
    at the welcome screen of phpMyAdmin, everything went fine and you''re ready to
    use phpMyAdmin.'
