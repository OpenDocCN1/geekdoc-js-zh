    \ class object; it is a reference to the newly created object. This distinction\
    \ and the strangeness of the set_ink_color function is the next topic we discuss.\n\
    \n# References, and the Value of My Pointer is My Data\n\nReferences are scalar\
    \ variables that don't directly hold data; they point to memory locations that\
    \ hold data. This is why the -> notation is needed. The right side of the -> operator\
    \ specifies the property or method you need to use.\n\nPHP doesn't completely\
    \ support objects. For example, you can't execute the parent version of an overridden\
    \ function using polymorphism. Another consequence of this incomplete support\
    \ is that you'll never have two references to a single object. When you assign\
    \ a reference to a second variable, a copy of the object is created and the new\
