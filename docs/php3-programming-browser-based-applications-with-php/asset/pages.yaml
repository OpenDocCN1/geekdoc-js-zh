  md: '# Core XML


    The xml:space attribute is used to tell the XML processor not to normalize whitespace
    (blanks, tabs, newlines) within the element’s content. (HTML normalizes all occurrences
    of whitespace to single blanks.) This attribute may take either of two values,
    “default” (meaning, “Treat all whitespace as you normally would”) and “preserve”
    (meaning, “Whatever you normally do, for this element leave the whitespace exactly
    as it is). For instance:


    ```

    <poetry xml:space="preserve">I think that I shall never see a poem lovely as a
    tree.</poetry>

    ```


    This instructs the XML processor to leave in place both the newline after see,
    and the blanks at the start of the second line.


    Note that xml:space="default" really has meaning only if used within the context
    of some other element for which xml:space="preserve" has been specified. In our
    poetry example, for instance, a prose epigraph enclosed within the poetry element
    might look something like this:


    ```

    <poetry xml:space="preserve">

    <epigraph xml:space="default">Nearly everyone

    recognizes the opening lines of Joyce

    Kilmer’s most famous poem.</epigraph>

    I think that I shall never see

    a poem lovely as a tree.</poetry>

    ```


    Although there’s a newline after the word everyone in the epigraph, the XML processor
    may (because of the xml:space="default") either honor the newline or ignore it,
    depending on its normal behavior.


    # Entities


    Entities in an XML document provide a way to refer to certain things outside the
    scope of the document itself. Since a document consists of characters, for example,
    any character in some Unicode character set other than that of the document itself
    must be represented by an entity. Entire blocks of text, even entire documents
    or files containing boilerplate text, may be incorporated into a document by using
    an entity reference which “points” to them.


    You’re probably familiar with the concept of entities from HTML (for example,
    the &amp; entity represents an ampersand, and in an XML document they’re marked
    up the same way as'
  merge: -1
  pgno: 410
- img_proc: true
  md: 'ampersand, followed by an entity name or a string of digits representing a
    particular character in the Unicode character set and concluding with a semicolon.


    If a document has a DTD, all entity names must be defined therein. If there is
    no DTD, the XML specification provides five built-in named entities by default:
    &amp; (representing an ampersand); &apos; (the apostrophe or single quotation
    mark); &gt; (the greater-than or left angle bracket); &lt; (the less-than or right
    angle bracket); &quot; (the double quotation mark). These characters were selected
    as built-in because of their potential for confusing XML processors in one way
    or another. As a practical matter, most XML processors won''t choke on anything
    literal ampersands (otherwise thought by the processor to indicate the start of
    an entity reference) and left angle brackets (which signal the start of a new
    element name).


    If a document includes many of these special characters, its text may include
    one or more marked sections, explained in a moment, to simplify data entry and
    enhance readability.


    As in HTML, an XML document can also contain single characters whose representation
