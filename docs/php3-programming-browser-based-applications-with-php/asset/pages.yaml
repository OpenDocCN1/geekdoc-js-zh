  md: '# Chapter 05 / Interlude One: Connecting to a Database


    When form information is available, the result of the count function is greater
    than 1, making the if statement execute the true clause, which in turn pulls the
    username and password information from the $arr_request array.


    When no form information exists, the username and password are still initialized
    using string literals.


    A third possibility exists aside having a form with these two fields and having
    no form information. What if connect.php3 is called by a form without the username
    and password fields? If so, this code will fail. You could make this code more
    robust (that is, able to handle failures in the environment) by checking directly
    for the form fields instead of relying on the number of elements in the arr_request
    array. For example:


    ```

    $username = $arr_request[''username''];

    $password = $arr_request[''password''];

    ```


    ```

    if (empty($username)) $username = ''phpuser'';

    if (empty($password)) $password = ''phpuser'';

    ```


    Because PHP returns an empty string for uninitialized array elements, the code
    above is very streamlined. Copy the values from the $arr_request into the individual
    variables. Working with scalar variables is easier to read and somewhat more efficient
    than using array variables. Then, if either of those variables are empty—meaning
    that no values are provided by the form—default values are provided.


    Listing 5.3 shows the connect.php3 file with these two changes so that you can
    see them in the context.


    # Listing 5.3 connect.php3 revised


    ```

    <?php require(''common.inc''); ?>

