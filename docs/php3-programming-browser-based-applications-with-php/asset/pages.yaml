  md: '# Chapter 06 / Databases and SQL


    # The From Clause


    The from clause lists all tables that provide information for a query. For now,
    we''ll only choose information from one table. Chapter 14, “Real-World SQL,” shows
    how to choose data from multiple tables.


    # The Where Clause


    When you need to be more refined than ''choose all records'', use a where clause.
    For example:


    ```

    SELECT

    str_name_first

    int_age

    FROM

    select01

    WHERE

    UPPER(str_name_first) LIKE ''F%''

    ```


    # Resulting Set of Records:


    + str_name_first | int_age |

    |+----------------+----------+

    | Florence       | 86       |

    +----------------+----------+-


    This statement chooses all records whose str_name_first field starts with the
    letter “F.” Notice that the UPPER function is used. When used in this manner,
    all data coming from the database is converted into uppercase characters before
    the LIKE operator is evaluated.


    > When filtering records, the UPPER function should be used most of the time.
    This technique lets you ignore the actual case of the data and assume all data
    is uppercase. Some databases perform the LIKE operation so that it is not case
    sensitive, but I like portable SQL statements. If you use the UPPER function,
    you can ignore this issue.


    SQL lets you combine as many expressions as needed to form your clause. For example,
    to find all persons whose first name starts with an “F” or a “G,” use the following
    statement:'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# An Introduction to SQL


    ```

    SELECT

    str_name_first

    int_age

    FROM

    select01

    WHERE

    UPPER(str_name_first) LIKE ''F%%''

    OR UPPER(str_name_first) LIKE ''G%%'';",

    ```


    # Resulting Set of Records:


    | str_name_first | int_age |

    | Florence | 86 |


    You can also use the AND operator to connect expressions. For example, to find
    all persons whose first name starts with F and who are over 65:


    ```

    SELECT

    str_name_first

    int_age

    FROM

    select01

    WHERE

    UPPER(str_name_first) LIKE ''F%%''

    AND int_age > 65;

    ```


    # Resulting Set of Records:


    | str_name_first | int_age |

    | Florence | 86 |


    The following shows the formal syntax of a where clause:

    where_clause = expr (and | or) expr—A where clause consists of one or more expressions
    connected by the AND or OR operators.


    expr = field_name | >= | = | <> | <= | < (field_name | literal)—An expression
    can be any field connected to any field or a literal by the greater than, greater
    than equal to, equals, doesn equal, less than or equal to, or less than operators.'
