  md: '# Operators


    decide which operators belong together. For instance, the unary minus operator
    has an associativity of right to left because it affects the operand immediately
    to its right. You may not realize it, but even the square brackets used when accessing
    array elements are operators. Table 3.2 includes these operators for completeness,
    but you don''t need to worry about their order of precedence. With experience,
    you''ll find operator precedence only comes into play for the arithmetic and logical
    operators.


    Table 3.2 is a list of operators and how they rank in terms of precedence—the
    higher the level, the higher precedence. Operators at the same level have the
    same precedence and are evaluated from left to right. Otherwise, higher precedence
    levels are evaluated first. Using parentheses lets you precisely control the evaluation
    order; anything inside parentheses gets evaluated first.


    # Table 3.2 The order of precedence and associativity for operators


    | Level | Operator | Description | Associativity |

    |---|---|---|---|

    | 15 | => | Links keys to values in array definitions | Left to right |

    | 14 | -> | Class operator | Left to right |

    | 13 | ? : | Ternary operator | Left to right |

    | 12 | <, <=, >, >= | Less than, less than equal to, greater than, greater than
    or equal to | None |

    | 11 | ==, !=, <> | Is equal to, is not equal to, is not equal to | None |

    | 10 | +, -, !, ~ | Unary plus, unary minus, logical not, bitwise inversion |
    Right to left |

    | 09 | ++, -- | Auto-increment, auto-decrement | Left to right |

    | 08 | <<, >> | Shift left, shift right | Left to right |

    | 07 | /, *, % | Division, multiplication, modulus | Left to right |'
