    \ gets evaluated, and the resulting values are used as operands for the && operator.\n\
    \nThe || operator determines whether either of its operands are true. Table 3.8\
    \ shows the results of using the || operator on the four sets of true/false values.\n\
    \n# Table 3.8 The || result table\n\n| Op1 | Op2 | Op1 || Op2 |\n|---|---|---|\n\
    | 0 | 0 | 0 |\n| 1 | 0 | 1 |\n| 0 | 1 | 1 |\n| 1 | 1 | 1 |\n\nThe following code\
    \ shows the || operator in use:\n\n```\nif ($int_a == 10 || $int_a == 11) {\n\
    \    echo \"Error\";\n}\n```\n\nIf either of the || operations evaluate true,\
    \ then the echo command is run.\n\nBoth the logical and logical or operators have\
    \ a short-circuit feature. The goal of the logical and operator is to determine\
    \ whether both of its operands are true. If PHP determines that the first operand\
    \ is false, the second operand does not need to be evaluated. The goal of the\
    \ logical or operator is to determine whether either of its operands are true.\
    \ If the first operand is true, the second operand does not need to be evaluated."
