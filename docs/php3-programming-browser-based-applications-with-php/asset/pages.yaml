  md: 'expr = field_name like (field_name | literal)—An expression can be any field
    connected to any field or a literal by the LIKE operator. The LIKE operator is
    a simple pattern match operator.


    expr = field_name is null—An expression can check if the value of a field is null.


    expr = field_name is not null—An expression can check if the value of a field
    is not null.


    expr = (where_clause)—Parentheses can be used to override the default operator
    order of precedence.


    # The Order By Clause


    The order by clause lets you sort the results of the select statement on a field-based
    basis, either in ascending or descending order. For example, the following SQL
    statement sorts by first name, in ascending order from A to Z:


    ```

    SELECT

    str_name_first

    ,int_age

    FROM

    select01

    ORDER BY

    str_name_first;

    ```


    # Resulting Set of Records:


    | +-++-----------+ |

    | str_name_first | int_age |

    | Charles | 1 |

    | Florence | 86 |

    | +-+-----------+ |


    The DESC keyword (short for descending) can be used to sort from Z to A, as shown
    below:


    ```

    SELECT

    str_name_first

    ,int_age

    FROM

    select01

    ORDER BY

    str_name_first DESC;

    ```'
