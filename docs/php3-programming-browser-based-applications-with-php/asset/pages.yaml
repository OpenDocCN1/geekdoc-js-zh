    # Extended Pattern Notation


    When the /x pattern option is specified, additional notation becomes available
    for use. By using (?n...) as a base notation, the extended notation significantly
    adds to the power of patterns with adding a list of metacharacters to those already
    in existence.


    Currently, there are five extensions. These vary widely in functionality—from
    adding comments to setting options. Table 9.5 lists the extensions and gives a
    short description of each.'
