  md: '# Summary


    # 349


    After link tables were discussed, an example of aggregation (the group by clause)
    and aggregation filtering (the having clause) was presented. The count function
    was used to show how many authors wrote each book.


    MySQL (and other database engines) support several types of joins. Since few are
    supported by all database engines, I recommend listing the table names in the
    SQL from clause and using where expressions to manually specify the joins.


    NULL values are important, especially if you are performing statistical tasks.
    But I''ve rarely found a need for them in the Internet applications I''ve created.
    Most of the time, NULL equates to empty strings.


    Referential integrity is absolutely crucial. You must control the order in which
    records get inserted and how they are deleted. Deleting a record while it is still
    referred to by a link table is simply asking for trouble—corrupted data follows
    soon after.


    The next chapter, “Interlude Four: Managing Concurrent Access,” starts you along
    the referential integrity path. The first step is knowing which user changes which
    record and ensuring that one user can''t overwrite another person''s changes willy-nilly.'
