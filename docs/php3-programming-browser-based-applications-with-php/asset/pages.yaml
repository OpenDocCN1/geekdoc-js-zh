  md: '# An Introduction to SQL


    # The SQL Insert Statement


    The insert statement adds records into a table. Its basic syntax is


    ```

    insert into

    (table_name)

    (column_list)

    values

    (value_list )

    ```


    All string literals specified in insert statements must be rounded by single quotes.
    The number of values in the value_list section must equal the number of columns
    in the column_list section.


    Here is an example of the insert statement in action:


    ```

    mysql> create table test (

    -> a integer,b VARCHAR(10)

    ->);

    mysql> insert into test

    -> (a, b)

    -> values

    -> (134, ''aaa'');

    ```


    A more advanced form of the insert statement has this syntax:


    ```

    insert into (table_name)

    (column_list )

    (select_statement)

    ```


    This syntax lets you select information from one or more tables and insert into
    a new table in one statement. However, we''ll talk about the select statement
    in more detail in Chapter 14, "Real-World SQL."


    # The SQL Update Statement


    The update statement changes information in a table. Its basic syntax is


    ```

    update (table_name)

    set (column_name) = (expressssion)...

    where (where_clause)

    ```'
