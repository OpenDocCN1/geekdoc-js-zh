    This output is correct. By the way, in the order in which objects are created
    and added to each other is important. The correct order is


    ```

    $html = new cls_html();

    $head = new cls_head();

    $body = new cls_body();

    $title = new cls_title();

    $title->add("PHP Module");

    $head->add($title);

    $html->add($head);

    $html->add($body);

    ```


    If you add the title object to the head before adding the text string, the resulting
    HTML will be incorrect. This happens because PHP copies objects when making object
    assignments. Therefore, any changes to an object after the assignment are not
    reflected in the copy.


    # Adding Comment Support


    | The code for this section can be found in the ch11/07 directory. | Note |


    Unfortunately, not every HTML ending tag is the same as the start tag. Take, for
    instance, the HTML comment tag which starts with <!-- and ends with -->. Supporting
    for this tag means modification or two to the htmlbase class.


    First, start_tag and end_tag properties need to be added to the $defaults array.
    Then, both properties need to be initialized (set equal to the tag_name property)
    if no values are supplied to the constructor. And finally, the htmlbase_generate
    method needs to use the start_tag and end_tag properties instead of the tag_name
    property when generating HTML. The changes are detailed below, shown in bold text.'
