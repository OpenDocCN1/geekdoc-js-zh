  md: '# tar


    tar, or tape archiver, combines multiple files into one and optionally compresses
    files to reduce their size. It was originally intended to create backups that
    could be stored on tape. When files are compressed, they have an extension of
    .gz; otherwise their extension is .tar.


    # gcc


    gcc is the C compiler from GNU. Its job is to compile source code (human-readable)
    files into object (machine-readable) files. C source files typically have a .c
    extension. Object files typically have an .o extension. If the compiler doesn''t
    work, you run into compile-time, or syntax, errors. Most of the time, incomplete
    files are caused by the compiler not being able to find one or more header files.
    Header files have an .h extension and are used to define various system-specific
    information and collect information used by multiple .c files into one location.


    # make


    make is a utility program that aids in compiling. Its job is to compile only those
    source files that haven''t yet been compiled. Compiling a .c file results in the
    creation of an .o file. If the .c file is newer than the .o file—that is, it has
    been edited since the last compilation—then make recompiles .c file. make typically
    looks for a Makefile from which to read its instructions. Makefiles can contain
    one or more targets that can be executed. For example, make clean tells make that
    you want to execute the clean target.


    # ld


    ld is the linker from GNU. Its job is to stitch together all of the object files
    and libraries to create a single executable. Hopefully, you''ll never have to
    run this program manually because the Makefile will take care of all of the compilation
    details.


    # ldconfig


    ldconfig searches the various library directories (as specified in /etc/ld.so.conf)
    for shared libraries used by more than one application and have .so somewhere
    in their filenames. For example, libqt.so.1.42 is a shared library. After every'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'compilation, you might need to append a directory to the /etc/ld.so.conf file
    and run the ldconfig -v command.


    # /configure


    configure searches your computer looking for key information such as which C compiler
    is installed and where your header files are located. It then modifies Makefiles
    as needed to target your computer configuration. con is nearly always executed
    using ./ so you can run the executable from the current directory instead of accidentally
    running it from some other directory located in your $PATH environment variable.


    # Symbolic Links


    Symbolic links let you refer to an existing file by a different name. For example,
    you might want to refer to libqt.so.1.42 as libqt.so.1. A symbolic link essentially
    lets you copy a file to a different directory and name without really doing the
    copy. second points to the first instance. You''ll find at least two advantages
    gained by using symbolic links; the first is that symbolic links take up less
    disk space—perhaps as little as 16 bytes. The second is a bit more subtle. Let''s
    say that you have a symbolic link called libqt.so.1 points to libqt.so.1.42. What
    if you need to upgrade to libqt.so.1.88? Could you change the symbolic link so
    that libqt.so.1 points to libqt.so.1.88 instead of libqt.so.1.42. This means that
    programs that reference libqt.so.1.42 automatically start to use the newer version
    of the library. By convention, symbolic links are used for whole number releases.
    In other words, libqt.so.1.88 and libqt.so.2.32 would have different symbolic
    links (libqt.so.1 and libqt.so.2, respectively).


    # Preparation for Compilation


