    # Controlling Variable Scope


    The scope of a variable refers to which parts of your program can see and use
    it. PHP recognizes two scopes—page and function. The *page* scope encompasses
    a single Web page whereas the *function* scope encompasses a single function.
    Normally, PHP variables are only visible in the scope that they are defined.


    When you need to make page-scoped variables visible inside a function, use the
    **global** keyword as shown below:


    ```

    function one() ) {

    global $a;

    $a++;

    }

    ```


    ```

    $a = 10;

    one($a);

    echo "a=$a<br>";

    ```


