  md: '# Summary


    This chapter introduced you to both databases (a way to organize data) and SQL
    (a way to manipulate data). Databases let you turn data into information through
    the imposition of order. After data is described, it can be queried and used to
    answer questions.


    One aspect of organizing data is determining its atomic elements or fields. Each
    field, like str_name_first or str_name_last, contains a single datum. Creating
    fields is very subject to debate. For example, a phone number one, two, or three
    fields? The answer depends, to a large extent, on how the information will be
    used. If, for example, for demographic purposes, you''ll need at least two fields
    to hold phone numbers.


    When fields are grouped together, they form a record. All information in a record
    relates to one “thing,” which might be a car or a person or even a concept. For
    example, a record could hold information about a concept as “How many secretaries
    between the ages 25 and 45 have been employed for more than five years?


    In order to tell one record from another, each record should be unique. If a record
    isn''t unique, how can you tell one record relating to John Doe from another?
    The simplest technique to creating unique records involves maintaining a counter.
    Every time a record is added to the database, a counter is incremented and the
    new number is used as a key field. Key fields are always unique among records.


    When related records are grouped together, they form a table. Tables hold information
    about a series of “things.” For example, one table might hold information about
    customers who visit your Web site, another table might hold a list of Web browsers.


    Related tables are grouped to form databases. People can create databases related
    to a business function (such as an accounting database) or a problem that needs
    solving (as in the combustible gas tank engines).


    Most database engines (including PHP) provide a large variety of data types to
    choose from. However, I suggest using a minimal number of data types to avoid
    confusing yourself when returning to a project after time has passed. I recommend
    using the VARCHAR,'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'INTEGER, and DATE data types. If your project involves a large number of records
    (over 500,000) or has specialized performance needs, then you''ll need to research
    the topic of field types more carefully.


    After we covered database basics, SQL was discussed. SQL stands for Structured
    Query Language and can be used for a variety of tasks. You can create, delete,
    and modify both tables and records.


    The SQL select statement is, in my experience, the most used statement. Its six
    different clauses (select, from, where, group by, order by, and having) make it
    the most complex as:


    +   * The select clause specifies which fields are returned by the query. Additionally,
    you can use expressions to create virtual or calculated fields.


    +   * The from clause specifies which tables the query looks at.


    +   * The optional where clause specifies which records information is taken from.
    For example, if your query only concerns houses, any records related to cars are
    ignored.


    +   * The optional group clause specifies how to aggregate the returned records.
    If you aggregate by a gender field, the resultquery will have a maximum of two
    records (assuming your tables refer to Homo sapiens).


    +   * The optional order clause specifies how to sort the returned set of records.


    +   * The optional having clause lets you filter based on the aggregation done
    by the group clause.


    And finally, the chapter discussed using indexes and auto-increment fields. Auto-increment
    fields are used to easily create unique fields (or keys).


    The next chapter, “Interlude Two: Maintaining a List,” shows many of the previously
    discussed SQL statements in action. You''ll see how HTML, PHP, and SQL interact
    to create a browser-based application.'
