  md: "# Appendix C\n\n-k, --keys-used=# Used with '-r'. Tell ISAM to update only\
    \ the first # keys. This can be used to get faster inserts!\n\n-l, --no-symlinks\
    \ Do not follow symbolic links when repairing. Normally isamchk repairs the table\
    \ a symlink points at.\n\n-q, --quick Used with '-r to get a faster repair. (The\
    \ data file isn't touched.) One can give a '-q' to force isamchk to modify the\
    \ original datafile.\n\n-r, --recover Can fix almost anything except unique keys\
    \ that aren't unique.\n\n-o, --safe-recover Uses old recovery method; slower than\
    \ '-r' but can handle a couple of cases that '-r' cannot handle.\n\n-O, --set-variable\
    \ var=option Change the value of a variable.\n\n-s, --silent Only print errors.\
    \ One can use two -s to make isamchk very silent.\n\n-S, --sort-index Sort index\
