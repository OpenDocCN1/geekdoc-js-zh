- img_proc: true
  md: '# Table 12.1 A list of selected HTTP headers


    | Response Type | HTTP Headers |

    | --- | --- |

    | Text | Content Type: text/plain |

    | HTML page | Content Type: text/html |

    | GIF Graphic | Content Type: image/gif |

    | Redirection to anther Web page | Location: http://www.foobar.com |

    | Cookie | Set-cookie: ... |

    | Error Message | Status: 402 |


    PHP provides the header function so that you don''t need to worry about formatting
    HTTP headers. Simply do this:


    ```

    header(''Content Type: text/html'');

    ```


    Underneath the covers, PHP is doing something that looks like:

    echo "Content Type: text/html\n\n";


    Notice that the HTTP header is followed by two newline characters. This is very
    important. All HTTP headers must be followed by a blank line.


    If you have installed any helper applications for Netscape or are familiar with
    MIME types, you already recognize the text/plain and text/html parts of the Content
    header. They tell the remote Web browser which type of information you are sending.
    The two most common MIME types to use are text/plain and text/html.


    The Location header is used to redirect the client Web browser to another Web
    page. For example, let''s say that your CGI script is designed to randomly choose
    from many ten different URLs to order to determine which Web page to display next.
    When the new Web page is chosen, your program outputs it like this:


    ```

    echo "Location: $nextPage\n\n";

    ```


    Once the Location header has been printed, nothing else should be printed. That
    is all the information that the client Web browser needs.'
