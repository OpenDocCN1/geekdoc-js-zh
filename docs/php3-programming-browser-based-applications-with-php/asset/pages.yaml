    In its configuration file (config.inc.php3), phpMyAdmin defines which language
    to use, but it would be fairly easy to make this configurable at runtime. For
    example, to associate the language to a button on an HTML form so that the button
    is clicked, the language used by phpMyAdmin changes. Another advantage is that
    the language files can contain any encoding, such as Simplified Chinese or Russian
    Koi-8. If you''re running the application on an English system, you may need to
    add a directive (an HTML meta tag) to your HTML files to tell the browser the
    encoding page is in. Using Simplified Chinese, you add


    ```

    <meta

    equ="Content-Type"

    content="text/html; charset=gb_2312-80">

    ```


    Of course, this can also be set programmatically with the HTTP Header:


    ```

    header("Content-Type: text/html; charset=gb_2312-80");

    ```


    This approach requires much self-discipline but works pretty well for small to
    medium applications. However, it becomes impractical to use on Web sites with
    much text. In that situation, defining HTML templates is much more effective.
    Templates are plain text files containing placeholders for any language-dependent
    strings; a template for an ordinary HTML page could look like this:


    ```

    <HTML>

    <HEAD><TITLE>(PAGE_TITLE)</TITLE></HEAD>

    <BODY BGCOLOR=BLACK TEXT=WHITE>

    <<h1>(PAGE_TITLE)</h1>

    <P>(PAGE_CONTENT)</P>

    </BODY>

    </HTML>

    ```


    This is a more elegant method than the previous one because we have a stricter
    separation: PHP code is used only in the backend to replace the placeholders with
    actual data, but not in the template.'
