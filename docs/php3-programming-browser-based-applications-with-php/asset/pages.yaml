- img_proc: true
  md: 'METHOD—Specifies the manner in which form information is passed to the CGI
    scripts. The normal values are either GET or POST.


    ACTION—Specifies the URL of the CGI script that will be invoked when the submit
    button is clicked. You could also specify an email address by using the mailto:
    notation. For example, sending mail would be accomplished by ACTION="mailto:medinedmtolive.com"
    and invoking a CGI script would be accomplished by ACTION="/cgi-bin/feedback.php".


    Most form elements are defined using the <INPUT> tag. Like the <FORM> tag, <INPUT>
    has several modifiers. The most important are:


    +   CHECKED—Specifies that the checkbox or radio button being is selected. This
    modifier should only be used when the element type is checkbox or radio.


    +   NAME—Specifies the name of a form element. Most form elements need to have
    unique names.


    +   SIZE—Specifies the size of an input field.


    +   MAXLENGTH—Specifies the maximum number of characters that the user can enter
    into a form element. If the MAX-LENGTH attribute is larger than the SIZE attribute,
    the user can scroll to access text that is not visible.


    +   TYPE—Specifies the type of input field. The most important field types are
    checkbox, hidden, password, radio, reset, submit, and text.


    +   VALUE—Specifies the default value for a field. The VALUE modifier is required
    for radio buttons.


    Let’s look at how to specify a plain text field:


    ```

    <INPUT

    TYPE="text"

    NAME="nickname"

    VALUE="WasWaldo"

    SIZE="25"

    MAXLENGTH="50"

    ```'
