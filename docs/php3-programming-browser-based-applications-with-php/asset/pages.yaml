  md: 'The last two input types are checkboxes and radio buttons. Checkboxes let the
    user indicate either of two responses. Either the box on the form is checked or
    it is not. The meaning behind the checkbox depends entirely on the text that you
    place adjacent to it. Checkboxes are used when users can check off as many items
    as they''d like. For example:


    ```

    <INPUT TYPE="checkbox" NAME="orange" CHECKED>

    Do you like the color?

    <INPUT TYPE="checkbox" NAME="blue" CHECKED>

    ```


    Radio buttons force the user to select only one of a list of options. Using radio
    buttons for a large number of items (say, over five) is not recommended because
    they take too much room on a Web page. The <SELECT> tag should be used instead.
    Group of radio buttons must have the same name but different values. For example:


    ```

    Operating System:<BR>

    <INPUT TYPE="radio" NAME="os" VALUE="Win95">Windows 95

    <INPUT TYPE="radio" NAME="os" VALUE="WinNT">Windows NT

    <INPUT TYPE="radio" NAME="os" VALUE="UNIX">UNIX

    <INPUT TYPE="radio" NAME="os" VALUE="OS2">OS2/2

    CPU Type:<BR>

    <INPUT TYPE="radio" NAME="cpu" VALUE="Pentium">Intel Pentium

    <INPUT TYPE="radio" NAME="cpu" VALUE="Alpha" CHECKED>DEC Alpha

    <INPUT TYPE="radio" NAME="cpu" VALUE="Unknown">Unknown

    ```


    You should always provide a default value for radio buttons because it is assumed
    that one of them must be selected. Quite, it is appropriate to provide a “none”
    or “unknown” radio button (like the CPU Type in the above example) so that the
    user won''t be forced to pick an item at random.


    Another useful form element is the drop-down list input field specified by the
    <SELECT>...</SELECT> tags. This element provides a compact way to let the user
    choose one item from a list. The options are placed inside the <SELECT>...</SELECT>
    tags. For example:'
