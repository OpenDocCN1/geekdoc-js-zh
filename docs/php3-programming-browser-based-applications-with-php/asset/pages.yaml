  md: 'Like HTML, the eXtensible Markup Language (XML), is based on

    tags that enable it to work its magic. A tag is simply a text marker—nusually
    a pair of markers—that signals to a downstream application

    at it may or must perform some action at a particular point in

    document (or over a range of points, in the case of a tag pair). These

    tags are set off from the surrounding text with special characters,

    angle brackets (the < and > characters). For instance, in HTML the

    <br> tags, “Insert a line break here,” and the <i> and </i> tags

    pairs to render everything between those two tags in italics.


    XML is derived from the decades-old Standard Generalized

    Markup Language (SGML). SGML is an enormous, complex ISO

    standard commonly used in the publishing, defense, and other large

    industries; its very enormity and complexity, making adopting

    SGML as the standard for a smaller enterprise practically imposs-

    able. (Another factor that makes SGML impractical for smaller

    companies is that most SGML software—editors, browsers, and so

    on—is quite expensive, typically running to five or six figures).


    XML is intended to resolve some problems inherent in HTML,

    as we see in a moment, by stripping the SGML standard all

    but the most commonly used and easily implemented features. The

    standard reference work on SGML runs over 500 pages in length;

    by contrast, the complete XML specification is only about 20 pages.


    Most important, XML is like SGML (and unlike HTML) in that

    it is not really a single markup language. It includes no-built

    tags. Instead, it lays out the rules by which users may define their

    special-purpose markup languages (variously referred to as

    “XML applications,” “XML dialects,” and the

    like). The XML FAQ, in an imaginative riff on this notion, there-

    fore lists “music, chemistry, electronics, hill-walking, surfing,

    petroleum geology, linguistics, cooking, knitting, stellar

    cartography, history, engineering, rabbit-keeping, mathematics,

    et.” as possible customized XML applications.


    # Why XML?


    The easiest way to answer the “Why XML?” question is to recast it

    as “Why not HTML?” This may seem like an odd question; with

    hundreds of thousands of Web pages being added each year, with'
