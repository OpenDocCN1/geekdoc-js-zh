  md: '# Variables


    Literal values only account for part of the internal data you can use inside your
    programs. When you need to hold data values and change them during the course
    of running a program, you need variables. PHP has three types of variables:


    Scalars—Hold one number or string value at a time. I frequently start my scalar
    variable names with scl\_ If the variable only holds one type of value, I prefix
    their names with either int\_ or str.


    Arrays—Hold a list of values. The values can be numbers, strings, or even another
    array. I frequently start my array variable name with arr\_


    Objects—Hold both variable information and functions. See Chapter 10, "Object
    Orientation," for more information. I frequently start my object variable names
    with obj\_


    > I recommend against using identical variable names for different data types
    unless you have a very good reason to do so. And if you do need to use the same
    name, try using the plural of it for the array variable. For example, use $name
    for the scalar variable name and $names for the array variable name. This might
    avoid some confusion about what your code does in the future.


    > Variable names in PHP are case-sensitive. This means that $scl\_varname, $scl\_VarName,
    $scl\_varName, and $scl\_VARNAME all refer to different variables.


    Each variable type is discussed in its own section below. You''ll see how to name
    variables and set their values, as well as some of their uses.


    # Scalar Variables


    Scalar variables are used to track single pieces of information. For example,
    the name of a client or the amount of a sale. You can use about any name imaginable
    for a scalar variable as long as it begins with a $ and the second character is
    alphabetic or an underscore.'
