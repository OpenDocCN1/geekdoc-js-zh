  md: '# Solution: Preventing Multi-User Editing


    Since you don''t want visitors to enter a userid and password for every Web page,
    you need a way to save information as the visitor travels from page to page. For
    example, if your visitor has just performed a search, your Web site would be easier
    to use if you let the user drill-down to detailed information and then re-view
    the search results. However, performing the same search twice is inefficient.
    If you had a way to “attach” the search results to the visitor, the second search
    could be avoided. Sessions allow you to perform this “attaching” of data.


    I recommend using the PHPLIB module (installed in Chapter 2) to control session
    information. A session is started the first time a visitor loads a page and lasts
    for a specific number of minutes. Each time a session-capable page is loaded,
    the session timer is reset. So, if a visitor to your server hits at 4 p.m. and
    your sessions times out at 6 p.m. If that same visitor pokes around your site
    for 30 minutes, then the session times out at 6:30 p.m. Sessions usually last
    for several hours so that visitors can leave your site (perhaps they need to step
    out for lunch) and return without losing their session.


    The type of data that can be tracked is unlimited: it can range from a list of
    clicks accrued as various pages are read to how long the visitor has stayed on
    your site to create card information.


    One of the biggest advantages of the PHPLIB module is that you don''t need to
    know how sessions are actually implemented. And, if you get curious, the PHPLIB
    is open source.


    > Note


    # Tracking the Editing Session


    One method of letting one user at a time edit a record is to stick the name of
    the editor into the record being edited. For example, the concurrent table could
    be changed to


    ```

    CREATE TABLE

    concurrent

    (

    key_concurrent INT (5) not null AUTO_INCREMENT

    ,editor VARCHAR (50) not null

    ,name VARCHAR (50) not null

    ,phone VARCHAR (50) not null

    te_created datetime DEFAULT ''0000-00-00 00:00:00'' NOT

    ```'
