  md: '# 316 Chapter 13 / Authentication


    Authentication is an integral part of most large-scale Web applications in production
    on the Internet today. The need for security has prompted developers to devise
    ways to validate their client base. The methods available to implement authentication
    range from the simple to the complex. These include


    +   * htaccess—Protects documents and directories in a hierarchical fashion. This
    technique is implemented by the Web server; you only need to specify usernames
    and decide which directories to protect.


    +   * database tables—Protects any type of resource using any kind of authentication
    system you design. In this chapter, simple username and password protection is
    shown.


    These forms of authentication can be used individually or, in some cases, in conjunction
    with each other. The code used in this chapter is very simple. You''ll need to
    modify it for use in production environments.


    We won''t go into the uses of authentication, which are fairly obvious to everyone
    who has spent any time browsing the Internet and been confronted with login screens
    or dialog boxes requesting usernames and passwords.


    We will talk about implementation details, but first, it is important to understand
    HTTP headers and how they relate to authentication.


    # HTTP Authentication


    The HTTP authentication specification defines a simple challenge response scheme
    for the Web server to validate the authorization of a user. If a user tries to
    access a protected resource, the Web server is required to return a 401 HTTP status
    response header (meaning, "this is unauthorized”). This response contains the
    authentication scheme (either Basic or Digest) and the realm name. Basic authentication
    involves essentially unencrypted passwords whereas Digest authentication encrypts
    them. The realm name represents the resource being protected and also helps the
    user to remember which username and password to use. Upon receipt of the 401 error,
    the browser then presents the user with a dialog box'
