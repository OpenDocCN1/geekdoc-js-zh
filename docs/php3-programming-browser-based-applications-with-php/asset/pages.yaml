  md: '# Useful Class Functions


    For brevity''s sake, the following two functions have been left out of the examples
    in this chapter. However, they should be defined for all classes:


    +   * get_class_name—This function simply returns the name of its class. It''s
    useful when functions need to determine which class one of its parameters belongs
    to.


    +   * dsp_properties—This function is good for debugging. When called, it displays
    the class name, each property, and its value.


    # Summary


    This chapter is an introduction to objects. It does not intend to turn you into
    an overnight object guru. enough information is presented so that you have an
    understanding of object terminology and can read other people''s programs. You
    can also create your own methods and properties. However, if you need to create
    more than a few small objects, consider reading a book devoted specifically to
    object-oriented programming. I give this advice because the relationships between
    objects can quickly become complex when more than a few objects are involved.


    You learned early in the chapter that object-oriented programming has its own
    terminology. This terminology lets you think of objects in a computer language-independent
    manner. After describing the object class as a set of properties (information)
    and methods (functions), the class can be programmed using PHP, C++, Perl, or
    Delphi. The programming language is relegated to the role of an implementation
    detail.


    The four big concepts in object-oriented programming are abstraction, encapsulation,
    inheritance, and polymorphism. Abstraction means to isolate the access of a property
    from how it''s stored. Encapsulation means that properties and the methods that
    act on them are defined together. Inheritance means that one class (the child)
    can be derived from another (the parent), and the child class will have all the
    properties and methods defined in the parent. Polymorphism means that the child
    class can override properties'
  merge: -1
  pgno: 276
