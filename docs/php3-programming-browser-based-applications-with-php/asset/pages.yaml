    \ that the module about developed was not designed for a production environment\
    \ with significant amount of visitors. The module was never load-tested for efficiency.\
    \ Rather,It was developed as a “thought experiment.”That being said, I do use\
    \ the module for my Web sites. Your mileage (as they say) may differ.\n\n# Forming\
    \ a Base Class\n\nThe code for this section can be found in the ch11/01 directory.\n\
    \nNow that our goals have been clarified, we need to pick a starting point. The\
    \ basis of HTML is a tag name and a list of attributes. Any tag may have an associated\
    \ end tag. And most tags are containers—they contain other tags. With so these\
    \ details in mind, let’s form a class that describes a generic tag. Listing 11.1\
    \ adapts the object framework from the last page. Two classes are defined. The\
    \ htmlbase class provides the support for properties (in the constructor) and\
    \ a generate method. The generate method combines the tag name with attributes\
    \ to form HTML inside a buffer variable, and that buffer is returned to the caller.\
    \ Since an HTML string is returned to the caller, the class places no limitations\
    \ on the HTML is used—it can be echoed back to the client browser, stored into\
    \ a database, or combined with other HTML elements.\n\n# Listing 11.1 first.php3—Supporting\
    \ the HTML tag\n\n```\n<?php\nclass cls_htmlbase {\n    var $props;\n```"
