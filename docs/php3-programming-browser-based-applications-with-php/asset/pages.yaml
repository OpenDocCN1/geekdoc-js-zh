  md: 'You can also find out the maximum age of each first name:


    ```

    SELECT

    str_name_first

    ,MAX(int_age) AS OLDEST_PERSON

    FROM

    select01

    GROUP BY

    str_name_first;

    ```


    Resulting Set of Records:


    | str_name_first | OLDEST_PERSON |

    | Charles | 10 |

    | Florence | 86 |


    # The Having Clause


    The having clause lets you filter the returned records based on results of the
    aggregate function. It only comes into play after the records have been aggregated
    and all virtual columns have been calculated.


    In the previous section you saw a query that determined the maximum age of each
    first name group. That query showed that the oldest Charles is 10 and the oldest
    Florence is 86. If you need to further refine the query to only list maximum ages
    over 65, it might look like this:


    ```

    SELECT

    str_name_first

    ,MAX(int_age) AS OLDEST_PERSON

    FROM

    select01

    GROUP BY

    str_name_first

    HAVING

    OLDEST_PERSON > 65;

    ```


    Resulting Set of Records:


    | str_name_first | OLDEST_PERSON |

    | Florence | 86 |'
