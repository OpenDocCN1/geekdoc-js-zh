  md: "# The SQL Delete Statement\n\nThe delete command removes records from a table.\
    \ Its syntax is\n\n```\nDELETE\nFROM\n  (table_name)\nWHERE\n  (where_clause);\n\
    ```\n\nThe delete command is very dangerous. Records that are deleted cannot be\
    \ recovered. And if no where clause is provided, all records are deleted. So,\
    \ if you want to delete specific records, the where clause should definitely be\
    \ used. For example, the following statement deletes all persons named Charles\
    \ from the select01:\n\n```\nDELETE\nFROM\n  select01\nWHERE\n  UPPER(str_name_first)\
    \ = 'Charles';\",\n```\n\nIf you need to verify that the records were actually\
    \ deleted, use the identical where clause in a select statement:\n\n```\nSELECT\n\
    \  COUNT(*)\nFROM\n  select01\nWHERE\n  UPPER(str_name_first) = 'Charles';\n```\n\
    \nResulting Set of Records:\n\n+------++\n| COUNT(*) | |\n+------++\n|  0   |\n\
    +------++\",\n\nThe result of zero records found shows that the records have been\
    \ deleted."
