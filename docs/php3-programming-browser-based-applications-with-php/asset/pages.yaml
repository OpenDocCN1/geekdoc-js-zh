    # The SQL Select Statement


    The select command chooses records from a table. Its basic syn-tax is


    ```

    select (field_list)

    from (table_list) <- filters

    where (where_clause) <- aggregates

    group by (column_list) <- sorts

    order by (column_list) <- sorts

    having (having_clause) <- filters after aggregation

    ```


    The select statement is, by far, the most complicated in SQL.

    However, it can also be quite simple because the where, group by,

    order by, and having clauses are optional.


    # The Field List


    The most basic form of the select statement is


    ```

    SELECT

    *

    FROM

    select01;

    ```


    Resulting Set of Records:


    |------------------------------------------------------+

    | str_name_first | str_name_last | int_age |

    |+----------------+----------------+---------+

    | Florence | Alexander | 86 |

    | Charles | Berlowitz | 1 |

    |+----------------+----------------+---------+


    This statement chooses all fields from all records in the test

    table. The asterisk tells the database to return information from all

    fields. If you only need specific fields, the select statement might

    look like this:


    ```

    SELECT

    str_name_first

    ,int_age

    FROM

    select01;

    ```'
