- img_proc: true
  md: 'Although it’s tempting to call this chapter “Advanced SQL,” the truth is that
    few people (myself included) can handle truly advanced SQL. Doing so requires
    a solid grasp of set theory and mathematics. Fortunately, you won’t need to use
    advanced SQL to write Internet applications. You only need to learn how to relate
    database tables to each other and select information from more than one database
    table at the same time.


    Chapter 6 “Databases and SQL,” introduces the concepts of fields, records, and
    tables. The seven SQL statements (insert, update, delete, create, alter, and drop)
    are also discussed. However, that chapter only deals with SQL statements that
    involve one table at a time. If you think about it, limiting SQL statements to
    only one table is not realistic. For example, in a real-world scenario, you might
    need one database table to hold customer names and another to hold the items purchased
    by the customer.


    # Table Relations


    Before attempting to understand how SQL can select information from more than
    one database table, we need to think about the different ways database tables
    can be related. Let’s look at a real-world example of information. Books are a
    favorite topic of mine, so let’s use them. What information pertains to a book?


    +   - Title

    - Author

    - Number of Pages

    - Publisher

    - ISBN


    Some of this information is intrinsic to the book itself, such as the number of
    pages. Other information, like the author’s name and publisher, might be shared
    by more than one book.


    If you think about how books are used, other ways to categorize them become clear.
    In a library setting, the author’s name is important for sorting and grouping.
    To a book agent, the author’s name'
  merge: -1
  pgno: 351
- img_proc: true
  md: 'must be accompanied by more information, such as the author’s address and phone
    number.


    Can you see how the book information might be split into three database tables?


    +   - books—Each record in this table holds the title, number of pages, ISBN,
    and the author and publisher of each book.


    +   - authors—Each record in this table holds the author’s name, address, and
    phone number.


    +   - publishers—Each record in this table holds the publisher’s name, address,
    and phone number. Additionally, if the editor or another constant name is known,
    that information is stored here also.


    How are these tables related to one another?


    +   - one to one—Books can have only one publisher.


    +   - one to many—Books can have more than one author.


    +   - many to many—Publishers can work with more than one author and author can
    work with more than one publisher.


    Now the time to determine exactly how tables become related at hand. You recall
    from earlier chapters that each record should be unique, and the easiest method
    of ensuring uniqueness is to have a key column. Those columns are about to play
    a critical role in relating database tables to each other.


    Do books have authors or do authors write books? Obviously, the two relationships
    are reciprocal. From an information point of view, the relationship you choose
    to represent through your database tables is irrelevant. However, the question
    have some real-world implications. If your business is a writer’s agency, your
    focus is authors and therefore the relationship is “authors write books.” If you
    are a library, your focus is books; therefore the relationship is “books have
    authors.” Always remember to stay focused on what information the application
    user needs to see. Let your database design reflect what’s most important to your
    clients (be they internal or external).'
