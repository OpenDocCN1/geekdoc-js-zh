  md: '# The Document Type Definition (DTD)


    value—only that it must come from some ID, somewhere in the document.


    ENTITY-/ENTITIES-Type Attributes


    We haven''t seen how entities are defined in a DTD. In general, though, the value
    of an ENTITY-type attribute must be the name of an entity defined in the DTD;
    the name used in the attribute doesn''t include the ampersand and semicolon used
    to refer to the entity otherwise. (ENTITY-type attributes must have as their values
    a list of one or more entity names, delimited by a blank.)


    The catch is that an entity name used in these attributes must be the name of
    a special kind of entity, an external binary entity. This is a non-parsed (that
    is, non-XML) resource somewhere outside both the DTD and the document itself,
    such as an image or other multimedia file. For instance, suppose the DTD defines
    an entity called logo which identifies the location of a company’s graphic symbol.
    An ATTLIST-type attribute in the DTD might be defined as:


    ```

    <!ATTLIST corpsymbol img ENTITY >

    ```


    and the document might contain:


    ```

    <corpsymbol img="logo"/>

    ```


    Be aware that few XML applications as of this writing actually support the use
    of external binary entities. See the section on the NOTATION keyword, below, for
    more information.


    NMTOKEN-/NMTOK-Type Attributes


    These are similar to the string-type (CDATA) attribute, except that they narrow
    the range of characters that can be included in an attribute’s value: NMTOKENS(S)-type
    attributes can have string values which consist only of alphabetic and numeric
    characters, periods, and hyphens.


    Given the following declaration


    ```

    <!ATTLIST spreadsheet type NMTOKENS >

    ```


    a valid XML document might include the following fragment:


    ```

    <spreadsheet type="Excel VisiCalc 1-2-3">

    ```'
