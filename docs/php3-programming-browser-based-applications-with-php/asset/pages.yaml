  md: '# Perl-Style Metacharacters


    In addition to the metacharacters defined earlier, the Perl-style functions also
    support the metacharacters shown in Table 9.4


    **Table 9.4** Options for Perl-style patterns


    | Option Character | Description |

    | --- | --- |

    | ? | When this metacharacter follows a piece (for example, "b+"), it indicates
    that a non-greedy match should be performed. A non-greedy match for the pattern
    "/b+/?" in the string "abbc" results in the text "b" being found instead of "bbb"
    |

    | \a | This metasequ matches the alarm character (which has an ASCII value of
    7)|

    | \A | This metasequ is the equivalent of the caret. It anchors the pattern to
    the beginning of the target string |

    | \b | This metasequ matches a non-word boundary. A word boundary is the spot
    between word (\w) and non-word(\W) characters. Perl assumes that the \W metasequ
    matches the imaginary characters of the ends of the string |

    | \B | This metasequ matches a non-word boundary |

    | \cn | This metasequ matches any control character |

    | \d | This metasequ matches a single digit character |

    | \D | This metasequ matches a single non-digit character |

    | \e | This metasequ matches the escape character (which has an ASCII value of
    27). This character is frequently used when sending commands to printers and terminals
    |

    | \f | This metasequ matches the formfeed character (which has an ASCII value
    of 12). This character is frequently used when sending commands to printers |

    | \n | This metasequ matches the newline character (which has an ASCII value of
    10) |'
