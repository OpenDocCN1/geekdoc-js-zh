- img_proc: true
  md: '# Table 9.3 Options for Perl-style patterns


    | Option Character | Description |

    | --- | --- |

    | A | This option forces the pattern to match only at the beginning of the target
    string. |

    | E | This option lets the $ anchor metacharacter match only at the end of the
    target string. Normally, the $ character also matches immediately before the final
    character if it is a newline. This option is ignored if the m option is used.
    |

    | S | This option studies a pattern to attempt to increase the speed of searching.
    At present, studying a pattern is useful only for non-anchored patterns that do
    not have a single starting character. |

    | U | This option forces a non-greedy search. Normally, searches are greedy—they
    look for the longest possible matching text. For example, the pattern "/a+/U"
    matches "aaa" in the pattern "baaac". The non-greedy pattern "/a+" matches "a".
    |

    | X | This feature is reserved for future use. When used, any backslash used with
    a non-metacharacter causes an error. |

    | i | This option forces matches to be case-insensitive. |

    | m | This option treats the string as multiple lines instead of one line. When
    this option is used, the ^ and $ anchor metacharacters match any newline character
    in the string, as well as the beginning and end of the string. |

    | s | This option forces the period metacharacter to also match newlines. |

    | x | This option forces PHP to ignore whitespace that''s not escaped with a backslash
    or within a character class. I highly recommend this option so that you can use
    spaces to make your regular expressions more readable. |'
  merge: -1
