- img_proc: true
  md: '# Table 9.5 Extended pattern notation is possible with the /x option


    | Extension | Description |

    |---|---|

    | (?# comment) | This extension lets you add comments to your regular expression.
    The comment is ignored. |

    | (:pattern) | This extension lets you add parentheses to your regular expression
    without causing a pattern memory position to be used. |

    | (!!pattern) | This extension lets you specify what should not follow your pattern.
    For instance, /blue(??!bird)/ means that "blue-" and "bluesy" will be matched
    but not "blue-bird". Note that the text matching pattern is not stored in the
    array of matching text. |

    | (?n) | This extension specifies a pattern option inside the pattern rather than
    after the ending delimiter. This is useful if you are storing patterns in variables
    and using variable interpolation to do the matching. For example, "/b(?i)/" performs
    a case-insensitive match. |


    By far the most useful feature of extended mode, in my opinion, is the ability
    to add comments directly inside your patterns. For example, you would rather see
    a pattern that looks like this:


    ```

    # Match a string with two words. $matches[1][0]

    # will be the first word. $matches[1][1] will

    # will be the second word.

    $pattern = "^\s*(\w+)\W+(\w+)\s*$";

    ```


    or one that looks like this:


    ```

    $pattern = "/\n(?# This pattern matches any string with two

    (?# and only two words in it. The matched words)

    (?# will be available in $matches[1][0] and)

    (?# matches[1][0] if the match works.)

    ^

    (?# Anchor this match to the beginning)

    (?# of the string)

    \s*

    (?# skip over any whitespace characters)

    (?# use the * because there may be none)

    "

    ```'
