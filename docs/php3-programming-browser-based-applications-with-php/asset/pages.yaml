  md: '# The most comprehensive collection of PHP programming tools for creating dynamic
    Web pages available anywhere


    As the essence of the Web resides more and more in databases, UNIX programmers
    need a complete set of tools that work well together, as well as a platform for
    building dynamic content. In this first-of-its-kind book/CD-ROM package, programmers
    are provided with an expansive set of support tools to develop deate-of-the-art,
    dynamic web applications and databases


    Written in a clear and precise manner by well-known author David Medinet, this
    book will teach you how to use the power of award-winning PHP and SQL web tools
    to program browser-based applications. Programming languages, an open source database
    engine, and the Red Hat Linux operating system are fully explored, giving you
    a clear understanding of this thriving, explosive technology.


    Plus, the accompanying CD-ROM contains the PHP programming language, the SQL database
    engine, the Red Hat Linux 5.2 operating system, sample applications and code listings,
    and all the software documentation found in the book.


    # About the Author


    David Medinet, the author or co-author of twelve books, including Perl 5 by Example
    (published by Que), has been working on UNIX systems since 1980. He is the founder
    and president of Eclectic Consulting.


    P/N 135340-2 part of ISBN 0-07-135342-9


    +   - UNIX Administrator''s Complete Programming Toolkit

    - PHP Fundamentals

    - Database Fundamentals

    - Advanced PHP

    - Application Fundamentals

    - Application Examples

    - Extending PHP


