  md: "This short-circuit feature can be a source of bugs if you are not careful.\
    \ For instance, in the following code fragment $int_b variable will not be incremented\
    \ if $int_a++ evaluates to true.\n\n```\nif ($int_a++ || $int_b++) {\n  echo \"\
    true<br>\";\n  echo \"a=$int_a b=$int_b<br>\";\n}\n```\n\nYou may be tempted to\
    \ try the following to determine if $int_a is equal to either 9 or 10. Don't do\
    \ it.\n\n```\nif ($int_a - (9 || 10)) {\n  echo \"Error!<br>\";\n}\n```\n\nPHP\
    \ doesn't work this way. The correct method for testing $int_a is to explicitly\
    \ state each sub-condition that needs to be met in order to return true. The correct\
    \ way is:\n\n```\nif ($int_a - 9 || $int_a - 10) {\n  echo \"Error!<br>\";\n}\n\
    ```\n\nThe and, or, or xor precedence logical operators perform the same operations\
    \ as their higher precedence counterparts. However, their low precedence nature\
    \ makes them ideal when you need to conditionally execute some code, but don't\
    \ need the overhead of an if statement. Unfortunately, most situations where the\
    \ low precedence logical operators are used involve functions, a topic that hasn't\
    \ been covered. Without going into too many details about functions, let's take\
    \ a look at an example of the or operator.\n\nEvery PHP function returns a value,\
    \ and that can be used as an operand. Therefore, the short-circuit nature of the\
    \ operators can be used to control program flow. If the first operand of the or\
    \ operator evaluates to true, the second operator is not evaluated. However, the\
    \ converse also holds; if the first operand is false, the second operand is evaluated.\
    \ Most functions return false when an error occurs. Thus the or operator can be\
    \ used to execute code only when an error occurs. Thus for example:\n\n```\n0\
    \ or die('Problem connecting to printer.<br>');\necho 'Program Over.<br>';\n```\n\
    \n# **Caution**"
