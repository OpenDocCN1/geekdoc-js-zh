  md: 'Interestingly enough, you can pass information to your CGI program by adding
    extra information to the standard URL. If your CGI program is used for searching
    your site, for example, you can pass some information to specify which directory
    to search. The following HTML hyperlink invokes a search script and tells it to
    search the (/root/document directory):


    ```

    <A HREF="cgi-bin/search.php?root/document">

    Search the Document Directory

    </>

    ```


    This extra path information can be accessed through the PATH_INFO environment
    variable. Environment variables are discussed in the "CGI and Environment Variables"
    section later in this chapter.


    You can also use a question mark to pass information to a CGI program.


    ```

    <A HREF="cgi-bin/search.php32=Wine+1993">

    Search for 1993 Wines

    </>

    ```


    The information that follows the question mark is available to CGI programs through
    the QUERY_STRING environment variable. Using either of these approaches lets you
    created cann CGI requests. By creating these requests ahead of time, you can reduce
    the amount of typing errors your users might otherwise have made. Later in this
    chapter, the "CGI and Environment Variables" section discusses all of the environment
    variables you can use inside CGI programs.


    Generally speaking, visitors to your Web site should never have to type in the
    URL for a CGI program. A hypertext link should always be provided to start the
    program.


    # HTTP Headers


    The first line of output for CGI programs must be an HTTP header telling the client
    Web browser what type of output is being sent back to it. Only scripts called
    from a server-side are exempt from this requirement. Table 12.1 shows a list of
    selected HTTP headers.


    Note'
