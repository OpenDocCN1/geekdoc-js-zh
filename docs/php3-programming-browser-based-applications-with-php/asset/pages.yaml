    # The String Concatenation Operator


    The string concatenation operator joins two strings together. If you have a numeric
    value as one of the two operands, it is automatically converted into a string.
    The following example shows the automatic conversion:


    ```

    $str_a = "This box can hold " . 55 . " items";

    echo "$str_a<br>";

    ```


    This code displays the following output:


    This box can hold 55 items.


    The number 55 is automatically converted to a string and then combined with the
    other strings. Notice that the string literals have spaces in them so that when
    the final string is created, the number is surrounded by spaces, which makes the
    sentence readable.


    You can also use variables as operands with the concatenation operator like this:


    ```

    $str_a = ''AAA'';

    $str_b = ''BBB'';

    $str_c = $str_a . $str_b;

    echo "$str_c<br>";

    ```


    This code displays the following output:


    AAABBB


    Notice that the strings are concatenated without adding any spaces or other separating
    characters. If you want a space between the string after they are concatenated,
    you must ensure that one of original strings has the space character, either at
    the end of the first string or the start of the second.


