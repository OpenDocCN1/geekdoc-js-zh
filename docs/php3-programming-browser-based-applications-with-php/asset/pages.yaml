    # Action Statements


    Action statements use expressions to perform some task. They can increment or
    decrement a variable. Or they can call a function. They are possibly the most
    frequently used statement type.


    # Assignment Statements


    Assignment statements are not complicated. They assign a value to a variable.
    You read about the assignment operators in the previous chapter, “Manipulating
    Data within PHP,” so I won''t use up precious space reiterating the same information
    here.


    # Decision Statements


    Decision statements use the **if** and **switch** keywords to either execute a
    statement based on the evaluation of an expression or to choose between executing
    one of two blocks based on the evaluation of an expression. For example, if a
    check being processed is over $1,000, then one code section is executed; if it''s
    under $1,000, another section of code is executed.'
