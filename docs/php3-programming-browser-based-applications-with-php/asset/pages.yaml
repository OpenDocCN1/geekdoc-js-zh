    # Cookies


    Webmasters want to track the progress of a user from page to page as they click
    about the site. Unfortunately, HTTP is a stateless protocol. Stateless protocols
    have no memory; they understand only the current command. This makes tracking
    a visitor through a site difficult at best. A user could visit a site, leave and
    come back a day or a minute later, possibly from a different IP address, and the
    site maintainer has no way of knowing if it is the same visitor or not.


    One answer to this dilemma is to use cookies in your programs. Cookies provide
    a way to maintain information from one HTTP request to the next. (Remember the
    concept of persistent information?) A cookie is a small chunk of data stored on
    the visitor''s local hard drive by the Web server. It can be used to track your
    path through a Web site and develop a visitor''s profile for marketing or informational
    purposes. Cookies can also be used to hold information such as account numbers
    and purchase decisions so that shopping applications can be created.


    # Cookie Security


    There has been controversy about whether cookies are secure. Although the cookie
    mechanism provides a way for a Web server to write data to your hard disk, the
    limitations are very strict. A client may only hold a maximum of 300 cookies at
    a time and a single server may only give 20 cookies to it. Cookies can only be
    4 kilobytes each, including the name and data, and at most a visitor''s hard disk
    may have 1.2 megabytes of hard disk being used to store cookies. In addition,
    cookie data may be written to only one file, usually called cookies.txt.


    During a browsing session, Netscape stores cookies in memory, but when the browser
    is exited, cookies are written into a file called cookies.txt—assuming that they
    haven''t expired by the time'
