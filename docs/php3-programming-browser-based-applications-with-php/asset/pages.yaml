    <SELECT NAME=weekday>

    <OPTION SELECTED>Monday

    <OPTION>Tuesday

    <OPTION>Wednesday

    <OPTION>Thursday

    <OPTION>Friday

    </SELECT>

    ```


    You can use the SELECTED modifier to make one of the options the default. Drop-down
    lists are very useful when you have three or more options to choose from. If you
    have less, consider using radio buttons. The <SELECT> tag has additional options
    that provide you with even more flexibility.


    The last form element we should talk about is the text box. You can create a multi-line
    input field or text box using the <TEXTAREA>..</TEXTAREA> set of tags. The <TEXTAREA>
    tag requires both ROWS and COLS. You may change any default text for the text
    box inside the <textarea>..</textarea> tags.


    ```

    <TEXTAREA NAME="comments" ROWS="3" COLS="60">

    text inside text box.

    </TEXTAREA>

    ```


    The user''s web browser automatically provides scroll bars as needed. However,
    the text box does not word-wrap unless the WRAP attribute is set to "virtual".
    For example,


    ```

    <TEXTAREA NAME="comments" ROWS="3" COLS="60" WRAP="virtual">

    ```


    If the WRAP attribute is not used, the user must press the Enter key to start
    new lines. The WRAP attribute has other options (like "physical") that can be
    used. Any good HTML book can provide more information.


    # Handling Form Information


    There are two ways for your form to receive form information—the GET method and
    the POST method. The transfer mechanism is specified in the <FORM> tag using the
    METHOD modifier. For example, the following HTML line tells the client browser
    to send the form information back to the server using the GET method:


    ```

    <FORM METHOD="get" ACTION="cgi-bin/getbook.php3">

    ```'
