    Now that we''ve described the HTTP headers, let''s talk about

    how Web servers use them in conjunction with .htaccess files.


    # htaccess Authentication


    Two steps are involved in setting up htaccess authentication; first, a

    file containing usernames and passwords must be created. Second,

    the Web server must be configured to restrict access to particular

    resources based on valid usernames and passwords.


    # User File


    The user file contains username and password combinations

    are which used by the Web server to determine the validity of the

    username/password combination it has received. This file can be

    located anywhere, although it is strongly suggested that you do not

    place it in a publicly accessible directory, such as the Web server''s

    root directory, /usr/local/apache/htdocs. A safe place to keep

    this file is in /usr/local/apache.


    The user database is a simple text file. Each line of the file con-

    tains a username followed by a colon and encrypted password. It is'
