    # The Conditional Operators


    These operators let you test the relationship of one variable (or literal) to
    another. For example, is 5 GREATER THAN 12? The result of evaluating a conditional
    operator and its operands is always true (a value of 1) or false (a value of 0).
    Table 3.3 shows the conditional operators in PHP.


    **Table 3.3** Conditional operators in PHP


    | Operator | Description |

    |---|---|

    | *The Equality Operators* | |

    | op1 == op2 | Returns true if op1 is equal to op2. For example, 6 == 6 is true.
    |

    | op1 != op2 | Returns true if op1 is not equal to op2. For example, 6 != 7 is
    true. |

    | op1 <> op2 | Returns true if op1 is not equal to op2. For example, 6 <> 7 is
    true. |

    | *The Comparison Operators* | |

    | op1 < op2 | Returns true if op1 is less than op2. For example, 6 < 7 is true.
    |

    | op1 <= op2 | Returns true if op1 is less than or equal to op2. For example,
    7 <= 7 is true. |

    | op1 > op2 | Returns true if op1 is greater than op2. For example, 6 > 5 is true.
    |

    | op1 >= op2 | Returns true if op1 is greater than or equal to op2. For example,
    7 >= 7 is true. |


    > It is important to realize that the equality operator is a pair of equals sign
    and not just one. Quite a few bugs are introduced into programs because people
    forget this rule and use a single equals sign when testing conditions.


    Note'
