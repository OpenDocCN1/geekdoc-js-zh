  md: '# Using Link Tables


    This statement results in the following virtual table:


    | book_title author_name publisher_name |

    | Eric Terry Pratchett Penguin Group |

    | Men At Arms Terry Pratchett HarperPaperbacks |

    | Gnome Man''s Land Esther Friesner Ace Books |

    | Inside-Outside Philip Jose Farmer Berkeley Pub... |


    When joining multiple tables together, it is a good idea to explicitly specify
    which table each field belongs to using the `table.field` notation. The number
    of tables you can join together is limited only by the database engine you use.
    I''ve seen 60 tables joined together using Oracle. This small example is sufficient
    to show an advantage of linking tables. If the information in the authors table
    were stored directly in the books table, the information about Terry Pratchett
    would be duplicated. So using joins reduce the physical storage requirements for
    information.


    # Using Link Tables


    Database design is frequently an iterative process. After the design is completed,
    additional requirements are discovered or some requirement was overlooked. For
    example, in the three-table design used so far in this chapter, how could multiple
    author books be handled?


    If you said, “They can''t,” you''re quite perceptive. Even though “What if a book
    has more than one author?” is discussed near the beginning of this chapter, when
    designing the tables, that requirement was overlooked.


    You have several ways to support multiple authors. You could have two fields in
    the books table:


    ```

    books.key_authors1

    books.key_authors2

    ```


    Each of these fields could point to a record in the authors table. However, if
    you need three authors for a book, an additional field must be created. This technique
    wastes space. If 90% of books'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'have a single author, then 90% of the records have one or more wasted fields.


    Another technique involves using a comma-delimited list. Your key_authors field
    might hold 3, 2, 4, which are the keys into the authors table. Unfortunately,
    SQL doesn''t know how to join tables based on lists of key values.


    The correct solution to associating books with multiple authors requires creating
    a link table using this SQL statement:


    ```

    CREATE TABLE

    books_authors

    (

    key_books_authors INT(5) not null AUTO_INCREMENT

    key_books INT(5) not null

    key_authors INT(5) not null

    PRIMARY KEY (key_books_authors)

    )

    ```


    # Note


    This link table contains data, the key values of the tables being linked. At times,
    it makes sense for link tables to contain information. For example, the following
    SQL creates a spouses table that links one spouse to another. It also stores the
    year the marriage took place. Since that piece of information is intrinsic to
    the relationship between spouses, it makes sense to store it in the link table.


    ```

    CREATE TABLE

    spouses

    (

    key_spouses INT(5) not null AUTO_INCREMENT

    key_spousal INT(5) not null

    key_spouse2 INT(5) not null

    year_married YEAR not null

    PRIMARY KEY (key_books_authors)

    )

    ```


    The books_authors table has become the primary table in our universe of three
    tables because it links the books and authors together. The books table still
    has primacy over the publisher table, however.


