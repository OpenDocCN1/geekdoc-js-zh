  md: "# Displaying Records\n\nThe method used to display records can either be very\
    \ simple (one line per record) or more involved (multiple lines per record). However,\
    \ the code developed in this section is flexible enough to handle both situations.\n\
    \nLet's start by displaying one record per line. The following-code can be added\
    \ to english_month_names.php immediately after the code that displays the number\
    \ of records in the table:\n\n```\n<ul>\n<table border=\"1\" cellpadding=\"3\"\
    \ cellspacing=\"0\">\n<?php\nrequire($table_name . '_dsp_1_rec.inc');\nfor ($i\
    \ = 0; $i < $number_of_rows; $i++) {\n  $record = @mysql_fetch_object($result);\n\
    \  require($table_name . '_dsp_1_rec.inc');\n}\n?>\n</table>\n</ul>\n```\n\nA\
    \ mix of HTML and PHP is needed to get the display job done. First, HTML is used\
    \ to start a table tag. Then the header display code is included using the require\
    \ function. The records returned by the select statement are iterated using the\
    \ for statement. Each record is displayed, one per HTML table row, by the code\
    \ in the ...dsp_1_rec file. Finally, the HTML table is closed.\n\nThe topic of\
    \ classes and objects won't be covered until Chapter 10, \"Object Orientation.\\\
    \ However, O-O techniques can be used without fully understanding what they do.\
    \ The record variable is similar to an array. Each field in the database table\
    \ is an element of $record. In order to access a field value, use the $record->field_name\
    \ notation. The value of str_month_name is $record->str_month_name.\n\nListing\
    \ 7.4 holds the tags used to display the HTML table header row."
