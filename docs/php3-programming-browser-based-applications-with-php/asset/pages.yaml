  md: '# The Document Type Definition (DTD)


    This requires that the value of the version attribute to the doc element always
    be “1.0,\ whether supplied in the document or not.


    # ENTITY Keyword


    In order to use an entity in a valid XML document, a DTD must have defined the
    entity. The form of each entity’s definition is


    ```

    <ENTITY name entityinfo >

    ```


    The simplest entities are those used for substitution of commonly used or boilerplate
    text, such as


    ```

    <ENTITY firstpart "The Party of the First Part" >

    ```


    A reference in an XML document to this entity, &entitypart;, will cause the parser
    to expand in-place to the text string "The Party of the First Part."


    Aside from general replacement text like this, a considerate DTD author—especially
    one working in an international environment—can also provide entity declarations
    for individual characters that lie outside the character set in which conforming
    documents are expected to be authored. If this character set consists mostly of
    US-ASCII characters but may have occasional French characters, for instance, the
    DTD might include such entity declarations as this, representing the "lowercase
    c-with-cedilla" character, ç:


    ```

    <ENTITY ccedilla "&#231;" >

    ```


    A document’s author can then include something like the following fragment in
    the document:


    ```

    ... Fran&ccedilla:ois ...

    ```


    which, while ungaily, is a lot easier to remember than the corresponding ISO decimal
    or hexadecimal value, especially for occasional usage.


    An entity can also point to a resource—“replacement text,” as it were—outside
    both the DTD and a given document which references it. In this case, the DTD must
    define the entity using a format such as


    ```

    <ENTITY boilerplate SYSTEM "url" >

    ```


    substituting the URL of the desired resource.'
  merge: -1
