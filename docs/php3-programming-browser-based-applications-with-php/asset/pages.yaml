    # Natural Left Joins


    If you are committed to MySQL, then using some of its join terminology makes sense.
    The natural left join option joins tables on all commonly named fields. Reworking
    the “count the authors” example from earlier, the new SQL looks like this:


    ```

    SELECT

    books.book_title

    COUNT(books_authors.key_authors) AS number_of_authors

    FROM

    books_authors NATURAL LEFT JOIN books

    GROUP BY

    books.book_title

    HAVING

    number_of_authors > 1

    ```


    As you can see, the WHERE clause is no longer needed. Care must be taken when
    using this option to ensure that fields are named appropriately.'
