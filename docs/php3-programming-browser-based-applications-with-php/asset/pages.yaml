  md: '# Perl-Style Functions


    There are many ways of matching any value. If the first method you try doesn''t
    work, try breaking the value into smaller components and match each boundary.
    If else fails, you can always ask for help on the PHP mailing list (found at http://php.net).


    Tip


    # preg_match


    # Syntax


    int preg_match(string PATTERN, string TARGET, [array MATCHES]);


    # Description


    preg_match searches TARGET for PATTERN. If a third parameter is supplied, the
    Medinet is placed into its first element and accessed using $matches[0]. Matches
    of parenthesized pieces are stored as elements of the specified array. The first
    matched substring is placed in $matches[1]. The second matched substring is placed
    in $matches[2]. And so on. You can, of course, use any array as the name title,
    $matches is simply my preference.


    # Return Value


    Returns true if the pattern is found in the target string, otherwise false is
    returned. False is also returned if an error—such as an incorrect pattern ('''')—occurs.
    If the pattern parameter evaluates to an empty string (''''), the return value
    is always true. By the way, this behavior is different from Perl. Perl uses the
    last valid pattern when presented with an empty pattern.


    # Example


    The following example code parses a phone number into its three components (area
    code, exchange, and number) and displays the entire phone number, the area code,
    and the exchange. Separate variables hold the patterns that recognize the components.
    These variables are used to make understanding the pattern easier.


    ```

    $target = "David Medinet,973-927-7670";


    // match the area code as three digits in a row.

    $pat_area = ''\d\d\d'';


    // match the exchange and number using a bound.

    $pat_exchange = ''\d(3)'';

    $pat_number == ''\d(4)'';

    ```'
