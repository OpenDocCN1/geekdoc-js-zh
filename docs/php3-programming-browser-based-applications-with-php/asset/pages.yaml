    # The Group By Clause


    The group by clause is used when aggregate functions are needed. Aggregate functions
    (like min and max) evaluate more one record at a time. In order to meaningfully
    discuss them, the select01 table must have more than two records. For the following
    examples, I have added three records. The full record set now looks like this
    (added records are in bold text):


    | str_name_first | str_name_last | int_age |

    | Florence | Alexander | 86 |

    | Charles | Berlowitz | 1 |

    | Charles | Brown | 10 |

    | Florence | Longstein | 8 |

    | Florence | Henderson | 64 |


    The MySQL manual does a good job of describing the aggregate functions, so I won''t
    list them here. However, some examples will clarify the concept of aggregation.
    First, let''s find out how many people have the same first name:


    ```

    SELECT

    str_name_first

    ,count(*)

    FROM

    select01

    GROUP BY

    str_name_first:

    ```


    # Resulting Set of Records:


    | str_name_first | count(*) |

    | Charles | 2 |

    | Florence | 3 |'
