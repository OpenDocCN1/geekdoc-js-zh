  md: '# About the Author


    David Medinets has been programming since 1980, when he started with a TRS-80
    Model 1. He is still fondly remembers the days when he could cross-wire the keyboard
    to create funny-looking characters on the display monitor. Since those days, he
    has spent time debugging Emacs on UNIX machines, working on VAXen, and messing
    around with DOS microcomputers. David is married to Kathryn and lives in northwest
    New Jersey. He runs Eclectic Consulting and is the author of several books including
    Perl 5 by Example and UNIX Shell Programming Tools. David can be reached at medined@mtolive.com.'
