  md: 'Note that the comma is used in a content model to denote sequence.

    The pipe/vertical bar character, |, may be used instead;

    functions as an OR operator. For example:


    ```

    <!ELEMENT autobody (sedan | coupe | wagon | minivan) >

    ```


    Thus a given autobody element may contain either a sedan, or a coupe, or a wagon,
    or a minivan element, but only one of these four choices.


    Beyond simply listing specific elements in a content model, the DTD developer
    can specify various alternate content models as in the following:


    ```

    <!ELEMENT cityregion ((cityName, state) | (cityName, province)) >

    ```


    This says that a cityregion element consists of either a cityName followed by
    a state or a cityName followed by a province.

    In the basic form of the ELEMENT definition above, note that there''s also an
    occurrences flag. This is an optional one-character indicator of how many times
    the indicated content model may appear and can be one of the following:


    +   - +Optional; may appear one or more times

    - ?Optional; if appears at all, may do so once

    - *Optional; may appear any number of times


    Each of these occurrences flag values may also be applied to individual parts
    of the content model (except #CDATA). If there is no occurrences flag at all,
    the number of valid occurrences is one and only one.

    Together with the sequence (comma) and optionality (pipe/vertical bar) operators,
    and using parentheses to group parts of the content model, the occurrences flag
    makes quite elaborate content models possible. For example:


    ```

    <!ELEMENT appointment ((dayofweek?, month?, day?, year?, time?))+, place, (attendee)*
    >

    ```'
