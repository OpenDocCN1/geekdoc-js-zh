  md: '# Valid versus Well-Formed Documents


    This is a very important concept in XML, representing a break with both SGML and
    HTML. A well-formed XML document adheres to the general principles laid out in
    the XML specification, such as all tags must be properly nested within one another.
    A valid document is well-formed; however, it also adheres to the specific principles
    laid out in an associated DTD. You already know how to associate a DTD with a
    document (see the previous discussion of the document type declaration); what''s
    in a DTD is the subject of the next section.


    # The Document Type Definition (DTD)


    A DTD, like a typical XML document, is just a text file. Its contents look something
    like XML, there are plenty of < and > signs. A DTD isn''t really XML. All it contains
    is a set of formal rules for the structure and, to some extent, the contents of
    XML documents in a particular dialect.


    Entire books have been written on how to create and interpret DTDs, so it won''t
    be possible here to give you all the details. What we can do, though, is look
    at some basic principles.


    # General Form


    A DTD consists of a series of rules, in this general form:


    ```

    <!keyword constraints>

    ```


    where keyword is one of ELEMENT, ATTLIST, ENTITY, or NOTATION (corresponding to
    rules for elements, attributes, entities, and notations, respectively). What goes
    in the constraints varies depending on the keyword.


    # Element Keyword


    Each element—each tag—in a valid XML document must have a corresponding <!ELEMENT...>
    definition in the document''s DTD. The general format of an element definition
    is


    ```

    <ELEMENT elementname (contentmodel)occurrencesflag >

    ```


    The elementname is the tag, sans < and > characters, as it may appear in a conforming
    document. (Note that in XML, unlike'
