  md: '# Functions


    Let''s look at the function call a little closer. The first thing on the line
    is a scalar variable and an assignment operator. You already know this means the
    value on the right of the assignment operator is assigned to $fl_area_of_circle.
    But what exactly is on the right?


    The first thing you see is the function name: area_of_circle(). The parentheses
    directly to the right indicates this is a function call. Inside the parentheses
    is a list of parameters or values passed to the function. You can think of a parameter
    just like a football. When passed, the receiver (for example, the function) has
    several options: run (modify it in some way), pass (call other routines), fumble
    (call the error handler).


    The syntax for defining a function is


    ```

    functionName ( parameterList ) (

    // lines of code

    )

    ```


    Function names have few restrictions placed on them—the most important of which
    are that they can''t begin with a number or container. The parameter list is optional
    and provides specific values that the function''s code can work with.


    # Returning Values from Functions


    Every PHP function can return a value back to its caller. After all, if you create
    a function that calculates the area of a circle, it makes sense that you''d need
    to assign that value to a variable as some point. Listing 4.6 shows a short program
    that calls and defines the area_of_circle() function.


    # Listing 4.6 area_of_circle.php3—Calculating the area of a circle


    ```

    <?php

    function area_of_circle($fl_radius) {

    return(3.1415 * ($fl_radius * $fl_radius));

    }


    $fl_area_of_circle = area_of_circle(5);


    echo "The area is $fl_area_of_circle.<br>";

    ?>

    ```


    This program displays


    The area is 78.5375.'
