  md: '# Summary


    pieces. Bounds let you match atoms a precise number of times. When matching two
    or more pieces, use the alternation, |, meta-character. Bracket expressions match
    one character but let you specify more than one possibility. [abc] matches any
    single a, b, or c. Character classes, like the POSIX [:space:] class, match all
    a type of character. The [:upper:] class matches all uppercase letters. Table
    9.2 is a list of the most basic metacharacters.


    PHP POSIX-style functions do an adequate job of pattern matching. Both ereg and
    eregi are used for basic text searching. ereg_replace and eregi_replace are used
    for replacing matched text. The eregi functions are case-insensitive. The last
    function, split, breaks text into components based upon a specified delimiter.


    Perl-style functions require a beginning and ending pattern delimiter. However,
    you can use any character in its place. This feature is useful if the pattern
    contains the slash character. The Perl-style functions understand nine options,
    which are added, if needed, the ending delimiter. The A and E options are alternatives
    to the anchor metacharacters. The S option lets PHP the specified pattern to hopefully
    decrease the time it takes to search. Non-greedy searches are performed using
    the U option, x, ignores non-escaped whitespace and lets you use extended pattern
    notation. The X option is reserved for future use. You can create case-insensitive
    patterns with the i option and force the period metacharacter to match newlines
    (as well as everything else) with the s option. The last option, ignores non-escaped
    whitespace.


    The next section presented numerous examples of how to use regular expressions
    to accomplish specific goals. Each situation is described, and a pattern that
    matches that situation is shown. The last section mentions the SQL LIKE and RLIKE
    operators. MySQL supports these operators, they may not be supported by other
    databases—so read the database documentation. The LIKE operator performs primitive
    matching with only two metacharacters (% and _). The percent sign matches any
    number of characters and the underscore matches any single character. The RLIKE
    operator supports all of the pattern features discussed in the “Regular Expressions
    Defined” section of this chapter.


