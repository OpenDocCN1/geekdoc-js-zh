  md: '# Learning about Classes


    | Class Name: |

    | cls_inventory_item |

    | Methods: |

    | print_properties

    | change_qty_on_hand |

    | Properties: |

    | part_number

    | qty_on_hand |


    **Figure 10.4 The cls_inventory_item class with methods.**


    These new functions are automatically inherited by the pen class. However, you
    run into a problem because the `print_properties` function will not print the
    ink color. You have three choices:


    +   **Change the function in the `inventory_item` class**—This is a bad choice
    because the generic inventory item should not know any unique information about
    inventory objects, just general or common information.


    +   **Create a new function in the pen class called `print_pen_properties`**—This
    is another bad choice. By solving the problem this way, every class will have
    its own print functions and keeping track of the function names would be a nightmare.


    +   **Create a new function in the pen class called `print_properties()` to override
    the definition from `inventory_item`**—This is a good solution. In fact, this
    is the way that polymorphism works.


    If the current class has not defined the method you''re trying to call, PHP looks
    in the parent class. If the method is still not found, PHP continues to search
    the parent. And so on. In other words, the class `hierarchy` is searched. A hierarchy
    is an organized tree of information. In our examples so far, you have a hierarchy
    with two levels. It''s possible to have class hierarchies many levels deep. In
    fact, it''s quite common. Figure 10.5 shows a class hierarchy with more than one
    level.'
