  抽象类不打算被实例化；毕竟，它缺失了部分实现。实例化它将导致运行时错误；具体来说，将抛出一个 `AbstractClassInstantiationError`。Dart\
  \ 分析器也会发出警告。\n\n点击此处查看代码图片\n\n```dart\nnew Pair();\n// Static warning: attempting\
  \ to instantiate an abstract class\n// Throws an AbstractClassInstantiationError\n\
  ```\n\n对于运行时而言，抽象方法根本不存在。毕竟，没有可以运行的实现。调用此类方法的处理方式与没有该方法声明完全相同。\n\n只包含抽象方法的类在定义接口时非常有用，正如下一节所描述的。\n\
  \n## 2.8 接口\n\n每个类都隐式地定义了一个 `interface`（接口），描述了在其实例上可用的方法。Dart 没有像许多其他语言那样的有正式的接口声明。这些是不必要的，因为人们总是可以定义一个抽象类来描述所需的接口。\n\
  \n点击此处查看代码图片\n\n```dart\nabstract class CartesianPoint {\n  get x;\n  get y;\n}\n\
  \nabstract class PolarPoint {\n  get rho;\n  get theta;\n}\n```\n\n尽管缺少接口声明，类也可以断言其实例实现了特定的接口\n\
  \n点击此处查看代码图片\n\n```dart\nclass Point implements CartesianPoint, PolarPoint {\n \
  \ // 常的 Point 实现放在这里\n}\n```\n\n`Point` 并不是 `CartesianPoint` 的子类；它没有从 `CartesianPoint`\
  \ 继承任何成员（`PolarPoint` 也是如此）。`implements` 子句的目的是建立接口之间一种预期的关系，而不是共享实现。\n\n可以在运行时测试对象是否符合某个接口：\n\
  \n点击此处查看代码图片\n\n```dart\n5 is int; // true\n'x' is String; // true\n[] is Point;\
  \ // false\naPoint.toString() is String; // true\nnew Point(0,0) is String; // false\n\
  aPoint is CartesianPoint; // true\n```\n\n注意，`is` 测试并不检查对象是否实际上是给定类或其子类的实例。相反，`is`\
  \ 测试检查的是对象的类是否显式地实现了某个接口（直接或间接地）。换句话说，我们并不关心对象的实现是什么，只关心它预期支持的接口。这与大多数支持此类构造的语言相比，是一个关键区别。如果一个类想要模拟另一个类的接口，它并不限于共享实现。这种模拟对于客户端来说（在忽略反射(7)\
  \ 的情况下）应该是不可区分的。当我们详细检查类型时，我们将在第 5 章 中详细介绍 `is`。\n\n接口之间的继承关系非常像类。一个类的隐式接口继承自其父类的隐式接口，还继承自该类实现的任何接口。与类一样，实例的方法会覆盖父类的方法。再次，某些覆盖可能是非法的，因为覆盖方法和被覆盖方法的参数数量不兼容，或者试图用普通方法覆盖\
  \ getter 或 setter，反之亦然。此外，由于接口有多个父类，不同的父类之间可能会产生冲突。假设一个方法出现在多个父类中，且不同的父类对该方法的参数数量不一致。如果一个父类定义了\
  \ getter 而另一个定义了普通方法。在这种情况下，冲突方法的版本没有被继承——正如我们在第 5 章 中看到的，这些情况也会引起各种警告。\n\n## 2.9\
  \ 对象的生命\n\nDart 中的计算围绕对象展开。因为 Dart 是一种纯面向对象的语言，即使是最微不足道的 Dart 程序也涉及对象的创建。例如，书开头所示的“Hello\
  \ World”程序涉及字符串对象的创建。\n\n某些对象，如字符串‘Hello World’、布尔值 `true` 或数字 `91` 是 `literals`（字面量）。它们由于在运行程序中被提及而存在。然而大多数对象是显式使用实例化表达式创建的，例如\
  \ `new Point(0,1)`。这样的表达式调用了一个构造函数——在这种情况下是 `Point()`。每个类至少有一个构造函数。构造函数的名称总是以我们要构造的类的名称开头。构造函数可以由程序员显式声明，也可以隐式生成。在没有声明显式构造函数时会生成隐式构造函数；它们不接受参数也没有方法体。例如\n\
  \n```dart\nclass Box {\n  var contents;\n}\n```\n\n等同于\n\n```dart\nclass Box {\n\
  \  var contents;\n  Box();\n}\n```\n\n这本身等同于\n\n```dart\nclass Box {\n  var contents;\n\
  \  Box(){}\n}\n```\n\n我们在使用 `Point` 的示例中已经见过了一些构造函数的变体。我们假设最简单的那个：\n\n```dart\n\
  Point(a, b){x = a; y = b;};\n```\n\n\n\n评估实例表达式的第一步是评估构造函数的参数。在 `new Point(0,1)`\
  \ 中，参数是字面量整数 `0` 和 `1`。与任何函数调用一样，参数被设置为相应的实参。因此，我们将 `a` 设置为 `0`，将 `b` 设置为 `1`。现在，我们可以为\
  \ `Point` 类分配一个新实例，该实例将为两个字段 `x` 和 `y` 提供存储空间。初始情况下，这些字段将由系统设置为 `null`。这确保了用户代码永远不会遇到未初始化的内存。\n\
  \n现在我们可以执行构造函数的体，这涉及分别对 `x` 和 `y` 进行赋值。如你现在所知的，这些赋值实际上是 setter 方法（set 方法）的调用。正是这些隐式定义的\
  \ setter 预期将字段 `x` 和 `y` 的值设置为 `0` 和 `1`。在此时，构造函数返回一个指向新分配实例的引用，这就是 `new` 表达式的最终结果。\n\
  \n现在，让我们考虑一个表示三维点的类。该类具有坐标 `x`、`y` 和 `z`，并且自然地可以声明为 `Point` 的子类。\n\n点击此处查看代码\n\n\
  ```dart\nclass Point3D extends Point {\n  var z;\n  Point3D(a, b, c): super(a,b)\
  \ {z = c;}\n}\n```\n\n可以通过编写 `new Point3D(1,2,3)` 来创建一个 `Point3D` 实例。评估过程类似，但稍微复杂一些。我们仍然从评估参数和分配对象开始——这次有三个字段——从\
  \ `Point` 继承的两个字段 `x`、`y`，以及在 `Point3D` 中声明的 `z` 字段。所有三个字段将被再次设置为 `null`。然而，在执行\
  \ `Point3D` 构造函数的体之前，我们必须先执行 `Point` 构造函数的体，否则字段 `x` 和 `y` 将无法被正确初始化。\n\n通常情况下，Dart\
  \ 编译器无法确定应该向父构造函数传递哪些参数。在某种情况下这似乎是显而易见的，但并不总是如此简单。在所有最简单的情形（即没有参数）之外，我们需要一个显式的 `super-constructor\
  \ call`（父构造函数调用）来引导我们。在我们的示例中，那就是 `super(a,b)`。在父构造函数调用中，`super` 是父类名称的代符，因此 `Point3D(x1,\
  \ y1, z1)` 在执行自己的体之前会先调用 `Point(x1, y1)`。\n\n上面的描述有些简单了，正如我们很快将看到的。对象创建是面向对象编程语言中复杂的方面之一，特别是在涉及继承时。为了进一步深化我们的理解，我们将再次查看更改点表示方式的问题。这次，假设点是不可变的，但使用极坐标表示。\n\
  \n由于点是不可变的，`rho` 和 `theta` 是 `final` 的。我们不能在声明处初始化实例变量，因为我们需要访问构造函数参数。我们不能像这样使用初始化形式参数（initializing\
  \ formals），如 `.rho`，因为 `rho` 和 `theta` 的值都是 `x` 和 `y` 的函数。我们不能在构造函数体内赋值字段，因为没有为它们定义任何\
  \ setter。Dart 通过 `initializer lists`（初始化列表）来解决这个问题，该列表旨在在普通代码运行之前初始化实例变量。\n\n点击此处查看代码\n\
  \n```dart\nclass Point {\n  final rho, theta;\n  Point(a, b) : rho = sqrt(a * a\
  \ + b * b), theta = atan(a/b);\n  get x => rho * cos(theta);\n  get y => rho * sin(theta);\n\
  \  scale(factor) => new Point(rho * factor, theta);\n  operator +(p) => new Point(x\
  \ + p.x, y + p.y);\n  static distance(p1, p2) {\n    var dx = p1.x - p2.x;\n   \
  \ var dy = p1.y - p2.y;\n    return sqrt(dx * dx + dy * dy);\n  }\n}\n```\n\n这里的初始化列表从\
  \ `Point(a, b)` 之后的冒号开始，一直持续到行尾的分号：`: rho = sqrt(a * a + b * b), theta = atan(a/b)`。它包含两个初始化器，一个用于\
  \ `rho`，一个用于 `theta`。初始化器用逗号分隔，并从左到右执行。除了实例变量的初始化器外，初始化列表还可能包含一个父构造函数调用。我们在 `Point3D()`\
  \ 中看到了这一点，那里我们有初始化列表 `: super(a,b)`。注意，如果初始化列表中没有显式出现父构造函数调用，则会将一个形式为 `super()`\
  \ 的隐式父构造函数调用添加到列表中。\n\n我们已经看到了了初始化实例变量的几种方法。让我们再次回顾一遍。可以在声明处初始化实例变量：\n\n```dart\n\
  class Point {\n  var x = 0, y = 0;\n}\n```\n\n或者通过构造函数中的初始化形式参数：\n\n```dart\nclass\
  \ Point {\n  var x, y;\n  Point(this.x, this.y);\n}\n```\n\n或者在初始化列表中：\n\n```dart\n\
  class Point {\n  var x, y;\n  Point(a, b) : x = a, y = b;\n}\n```\n\n或者在构造函数体内：\n\
  \n```dart\nclass Point {\n  var x, y;\n  Point(a, b) {\n    x = a;\n    y = b;\n\
  \  }\n}\n```\n\n对于普通实例变量，可以选择上述方法中的任何一种、多个或多个。对于 `final` 变量，最后一种方法不可用，因为它使用了 setter\
  \ 方法，而 final 变量没有 setter。`final` 实例变量只能初始化一次，因此必须选择前三种方法之一。\n\n现在我们可以完整描述实例创建过程。假设\
  \ `Point3D` 定义如上，且 `Point` 有如下构造函数：\n\n```dart\nPoint(a, b) : x = a, y = b;\n```\n\
  \n实例创建过程如下，执行遵循箭头方向：\n\n![Image]\n\n通过 `new Point3D(7,8,9)` 创建一个新的 `Point3D` 实例开始于计算实际参数，在本例中这些参数为\
  \ 7、8 和 9。然后调用构造函数 `Point3D()`。下一步是分配一个新的 `Point3D` 实例。所有实例变量都将被设置为 `null`。接着我们执行\
  \ `Point3D` 的初始化列表。这导致了父初始化器的执行，从而导致了 `Point` 初始化列表的执行。这将设置实例变量 `x` 和 `y`，然后执行 `Point`\
  \ 初始化列表末尾添加的隐式父初始化器。这将调用 `Object` 的初始化列表，它什么都不做（结尾甚至没有父初始化器）。所有这些步骤如图所示。\n\n遍历完父类链中所有的初始化列表后，下一步是执行构造函数体。在图中，这对应于箭头的转向。\n\
  \n构造函数体总是隐式地运行父构造函数体。传递给父构造函数的参数与初始化列表中给出的父构造函数调用使用的参数相同。它们不会被重新计算。因此在我们的情况下，我们将开始运行\
  \ `Point3D()` 的体，它开始运行 `Point()` 的体，后者开始运行 `Object()` 的体，而后者什么都不做。由于 `Point()` 没有指定体，我们返回\
  \ `Point3D()` 的体，在那里初始化 `z`，之后返回新分配的对象。该过程对应于我们图图的右侧。\n\n### 2.9.1 重定向构造函数\n\n\n\
  \n有时候，用一个构造函数来定义另一个构造函数是有用的。再次考虑从笛卡尔点转换为极点的情况。我们之前的工作仅允许笛卡尔坐标创建点。鉴于我们的实际表示形式是极坐标，这显得有点奇怪。当然，我们可以直接修改构造函数以使其接收极坐标，但我们知道这样做是有问题的，因为我们有依赖笛卡尔接口的现有用户。我们应该保留旧的构造函数，但也要添加一个接受极坐标的新构造函数。为了这个目的，我们将定义一个新的命名构造函数\
  \ `Point.polar()`，并修改现有的构造函数，将其传入的笛卡尔坐标转换为极坐标，并将调用转发给 `Point.polar()`。\n\n点击此处查看代码图像\n\
  \n```dart\nclass Point {\n  var rho, theta;\n  Point.polar(this.rho, this.theta);\n\
  \  Point(a, b) : this.polar( sqrt(a * a + b * b), atan(a/b));\n  get x => rho *\
  \ cos(theta);\n  set x(newX) {\n    rho = sqrt(newX * newX + y * y);\n    theta\
  \ = acos(newX/rho);\n  }\n  set y(newY) {\n    rho = sqrt(x * x + newY * newY);\n\
  \    theta = asin(newY/rho);\n  }\n  get y => rho * sin(theta);\n  scale(factor)\
  \ => new Point.polar(rho * factor, theta);\n  operator +(p) => new Point(x + p.x,\
  \ y + p.y);\n  static distance(p1, p2) {\n    var dx = p1.x - p2.x;\n    var dy\
  \ = p1.y - p2.y;\n    return sqrt(dx * dx + dy * dy);\n  }\n}\n```\n\n`Point()`\
  \ 现在是一个重定向构造函数。重定向构造函数的目的正如你所猜测的，是将执行重定向到另一个构造函数，在这种情况下是 `Point.polar()`。在重定向构造函数中，参数列表后面跟着一个冒号和一个形式如\
  \ `this.id(..)` 的调用，它指定了重定向到哪个构造函数。\n\n到此时，我们成功地在保留类原始 API 的同时转换了点的表示。我们使用命名构造函数\
  \ `Point.polar()` 使用新的表示来制造点，允许我们保留旧的构造函数。我们将旧构造函数转换为重定向构造函数，以便它生成我们修改后的点。我们还使用\
  \ getter 和 setter 来保留点实例的原始 API。\n\n### 2.9.2 工厂函数 (Factories)\n\n现在假设我们想避免过多的点分配。与其在每次请求时生成一个新点，我们希望维护一个点的缓存。当有人尝试分配点时，我们想要检查缓存，查看那里是否存在等效的点，并返回那一个。\n\
  \n传统上，构造函数使这变得困难。在大多数语言中，构造函数总是像我们描述的那样分配一个新实例。如果你想使用缓存，你需要提前考虑这一点，并确保你的点是通过方法调用分配的，这种方法通常被称为工厂方法。\n\
  \n遗憾的是，程序员被剥夺了完美预见的天赋，偶尔可能无法提前预判对缓存的需求。但在 Dart 中，任何构造函数都可以替换为工厂方法，且这种方式对客户端来说是完全透明的。我们通过工厂构造函数来实现这一点。\n\
  \n工厂构造函数以单词 `factory` 为前。它们看起来像普通的构造函数，区别在于它们不能有初始化列表或初始化形式参数。相反，它们必须有一个返回对象的函数体。工厂方法可以返回缓存中的对象，也可以根据其选择分配一个新实例。它甚至可以分配不同类的实例（或在缓存或其他任何数据结构中查找它们）。只要生成的对象符合类的接口，一切就都是顺利的。\n\
  \n通过这种方式，Dart 解决了传统构造函数的一些经典弱点。\n\n### 2.10 noSuchMethod()\n\nDart 中的计算围绕调用对象上的方法展开。如果调用了一个不存在的方法，默认行为是抛出\
  \ `NoSuchMethodError`。然而，情况并不总是如此。\n\n当在一个实例上调用不存在的方法时，Dart 运行时会调用该对象上的 `noSuchMethod()`\
  \ 方法。由于 `Object` 中 `noSuchMethod()` 的实现抛出 `NoSuchMethodError`，我们通常会看到熟悉的行为。\n\n\
  这种方案的妙之处在于 `noSuchMethod()` 可以被重写。例如，如果你正在为另一个对象实现代理，你可以定义代理的 `noSuchMethod()` 将所有调用转发到代理的目标。\n\
  \n点击此处查看代码图像\n\n```dart\nclass Proxy {\n  final forwardee;\n  Proxy(this.forwardee);\n\
  \  noSuchMethod(inv) { return runMethod(forwardee, inv);}\n}\n```\n\n`noSuchMethod()`\
  \ 的参数是 `Invocation` 实例，它是在核心库中定义的一种特殊类型，用于描述方法调用。`Invocation` 反映了原始调用，描述了我们尝试调用的方法名称是什么、参数是什么，以及其他一些细节。\n\
  \n为了实际上将每次调用都转发给 `forwardee`，我们对 `noSuchMethod()` 的实现使用了一个辅助函数 `runMethod()`，它接收一个接收对象和一个调用。一个健壮的代理实现比上面的代码稍微复杂一点。微妙之处在于\
  \ `Object` 中定义的方法不会导致 `noSuchMethod()` 被调用。即使有这些复杂性，Proxy 的完整实现也是直直的。在书的后面，一旦我们学习了更多技巧，我们将展示一个\
  \ `Proxy` 的完整版本。\n\n### 2.11 常量对象与字段 (Constant Objects and Fields)\n\n有些对象是在编译时计算的常量。许多这些是显而易见的：字面量数字\
  \ `3.14159`、字面量字符串 `'Hello World'` 等。我们将在第 6.1.4 节](#part014.html_ch6lev4）详细介绍常量表达式。\n\
  \nDart 也支持自定义常量对象，这些是这里的重点。让我们看看是否可以制作常量点\n\n点击此处查看代码图像\n\n```dart\nclass Point\
  \ {\n  final x, y;\n  const Point(this.x, this.y);\n  ... usual\n}\n\nconst origin\
  \ = const Point(0,0);\n```\n\n在适当条件下，我们可以产生一个表示点的常量 `Point` 对象。`origin` 变量被声明为常量。我们只能给它分配常量对象。常量对象使用\
  \ `const` 而不是 `new` 创建。就像 `new` 表达式一样，`const` 表达式调用构造函数，但该构造函数必须是常量构造函数，且构造函数的参数本身也是常量。事实上，Dart\
  \ 要求参数也仅限于数字、布尔值或字符串。幸运的是，数字字面量如 `0` 总是常量。\n\n我们将 `Point` 的构造函数声明为常量的。这对类以及构造函数本身施加了相当严格的限制。我们需要一个状态不可变的类。幸运的是，不可变点是非常自然的。\n\
  \n此外，常量构造函数不能有函数体。它可以有一个初始化列表，只要它只计算常量（假设参数是已知常量）。在我们的情况下，不需要计算。\n\n我们在整本书中看到 `noSuchMethod()`\
  \ 的几种有趣用法。\n\n\n\n遗憾的是，我们无法像 `Point.polar()` 那样定义一个常量构造函数，因为它使用了诸如 `sqrt()` 等函数，而这些函数的结果不被视为常量。`Point`\
  \ 拥有这样的构造函数是可以接受的——我们只是不能使用 `const` 来调用它。因此，任何使用此构造函数创建的点都不会是常量。\n\n我们并不总是需要创建常量点。事实上，我们仍然可以使用\
  \ `new` 调用常量构造函数。如果这样做，对我们传递的参数没有限制，但结果将不会是常量。\n\n常量可以预先计算一次，而不需要重新计算。常量是规范一化的（canonicalized）——在\
  \ Dart 程序中，给定的值只会创建一个常量。\n\n## 2.12 类方法\n\n类方法是不绑定到特定实例的方法。在讨论类变量时，我们之前已经遇到过一些此类方法。由类变量引发的访问器（accessors）就是类方法。我们可以称之为类访问器（class\
  \ getters）或类设置器（class setters）。除了自动生成的类访问器外，程序员也可以显式地定义此类访问器。事实上，人们也可以按类为基准定义普通方法。\n\
  \n我们在第 1 章中见过这样的示例。在 `Point` 类中，我们有：\n\n点击此处查看代码图像\n\n```\nstatic distance(p1, p2)\
  \ {\n  var dx = p1.x() - p2.x();\n  var dy = p1.y() - p2.y();\n  return sqrt(dx\
  \ * dx + dy * dy);\n}\n```\n\n与类变量访问器一样，用户定义的类方法的名称在声明它的类内部是的。在类外部，只有当这些方法以其所属类的类名前缀时才能被访问，例如，`Point.distance(aPoint,\
  \ anotherPoint)`。\n\n在类方法中使用 `this` 会导致编译错误。由于类方法不属于任何特定实例，因此 `this` 在类方法内部是未定义的。\n\
  \n如果你尝试调用一个不存在的类方法，将得到一个运行时错误：\n\n点击此处查看代码图像\n\n```\nPoint.distant(aPoint, anotherPoint);\
  \ // NoSuchMethodError!\n```\n\n这种行为凸显了一个有趣的设计问题。由于这是一个静态调用，Dart 编译器可以在编译时检测到 `Point`\
  \ 类中没有 `distant()` 类方法。为什么不当场给出编译错误呢？毕竟，我们确切地知道这段代码在运行时会失败。\n\n然而，Dart 设计初衷是尽可能不阻碍程序员。在开发过程中，可能会出于实验精神编写并测试不完整的代码片段。程序员可能倾向于测试代码中的某条路径，而完全清楚地知道另一条路径尚未实现功能。\n\
  \n在坚持要求完整定义的系统中，开发者通过定义存根方法（stubs）来绕过这些要求。这些存根会在运行时导致错误的结果或失败，它们的唯一目的是通过让过度热情的编译器沉默来允许开发继续进行。\n\
  \n当然，编译器的热忱并非完全无理由。未定义的方法可能仅仅是一个拼写错误：\n\n点击此处查看代码图像\n\n```\nPont.distance(aPoint,\
  \ anotherPoint); // NoSuchMethodError!\n```\n\n未定义的类 `Pont` 与预期的类 `Point` 之间的区别对人类来说可能很难察觉，程序员可能会花费大量且令人沮丧的时间来尝试理解失败的原因。更糟糕的是，失败可能不在经过测试的代码路径上，导致生产环境中的崩溃。\n\
  \n幸运的是，Dart 在这些情况下会给出静态警告，但仍会编译并运行代码。这提供了动态系统的灵活性，同时具有传统类型系统提供的大部分保障。\n\n重要的一点是，类成员是永远不会被继承的\n\
  \n点击此处查看代码图像\n\n```\nclass ExtendedPoint extends Point {\n  var origin = new Point(0,0);\n\
  \  get distanceFromOrigin => distance(origin, this);\n  // sorry, NoSuchMethodError!\n\
  }\n```\n\nget 方法 `distanceFromOrigin` 无法使用 `distance` 这个名称。我们可以在 `Point` 本身中定义 `distanceFromOrigin`（假设我们也定义了\
  \ `origin`），但 `distance` 在 `Point` 的任何子类中都不在范围内。为了让其工作，我们必须写成\n\n点击此处查看代码图像\n\n\
  ```\nget distanceFromOrigin => Point.distance(origin, this); // ok\n```\n\n由于类方法从不被继承，因此声明抽象类方法是没有意义的。如果你尝试这样做，是走不远的，因为这在语法上甚至是无效的。\n\
  \n## 2.13 实例、它们的类与元类（Metaclasses）\n\n每个对象都是类的实例。由于万物皆对象，因此类也是对象，由于类是对象，它们本身也是某个类的实例。类的类通常被称为“元类”（metaclass）。Dart\
  \ 语言规定类的类型为 `Type`，但没有指定它们属于哪个类。\n\n在典型的实现中，类可能是 `Type` 的实例。那么 `Type` 的类是什么呢？通常会是\
  \ `Type`，它是它自身的实例。情况如下图所示：\n\n![Image](img/00006.jpeg)\n\n可靠地发现对象类的唯一方法是通过反射，我们将在第\
  \ 7 章中详细讨论。对象支持 `runtimeType` 访问器，它默认返回对象的类。然而，子类可以自由覆盖 `runtimeType`。回顾我们上面的 `Proxy`\
  \ 示例。代理对象必须与真实对象不可区分。\n\n更广泛地说，关于对象唯一重要的是其行为的原则很容易被违反。另一方面，某些代码可能确实需要发现对象的实际类。IDE\
  \ 或调试器预期显示真实准确的信息。这种机制就是反射。\n\n最后，是一个令人不安的异常。人们很容易混淆调用类方法与在类型字面量上调用实例方法\n\n点击此处查看代码图像\n\
  \n```\nType.runtimeType; // Ouch! NoSuchMethodError\n(Type).runtimeType; // works\n\
  ```\n\n第一行是调用一个不存在的类方法；`Type` 类没有 `runtimeType` 类方法。第二行是在类型字面量 `Type` 上调用为所有对象定义的\
  \ `runtimeType` 方法。我们可以通过将类方法视为相应 `Type` 对象的实例方法来解决这个问题，但目前并非如此。\n\n## 2.14 Object\
  \ 及其方法\n\n每个`Object` 类的接口非常小。事实上，我们已经遇到了它几乎所有的方法。我们在第 2.5 节中遇到了运算符方法 `==` 以及 `hashCode`\
  \ 访问器。第 2.10 节围绕 `noSuchMethod()` 展开。我们在紧接上一节中看到了 `runtimeType`。也许最常用的方法是 `toString()`。该方法返回一个表示对象的字符串。默认版本通常会打印类似‘An\
  \ Instance of C’的内容，其中 C 是对象的类的名称。通常建议覆盖它以获得更有意义的内容。\n\n\n\n\n总而言，只有五个方法构成了所有对象共享的接口。`Object`\
  \ 类的概要如下：\n\n点击此处查看代码图片\n\n```\nclass Object {\n  bool operator == (another) { ...\
  \ }\n  int get hashCode { ... }\n  String toString(){ ... }\n  noSuchMethod(Invocation\
  \ im) { ... }\n  Type get runtimeType{ ... }\n}\n```\n\n你会注意到，类型首次在我们的代码中出现。Dart\
  \ 代码可以带有类型注解，而 Dart 核心库几乎总是如此。正如你所预期的那样，等性比较产生一个布尔值结果，哈希码是一个整数，`toString()` 返回一个字符串，而运行时类型则是……嗯，是一个\
  \ `Type`。如上文所述，`noSuchMethod()` 接收一个 `Invocation`。这种语法对大多数程序员来说应该是是熟悉的。\n\n我们省略了方法的函数体。事实上，如果你查看源代码，你会发现一些相似但又不同的内容：\n\
  \n点击此处查看代码图片\n\n```\nclass Object {\n  bool operator == (other)=> identical(this,\
  \ other);\n  external int get hashCode;\n  external String toString();\n  external\
  \ noSuchMethod(Invocation im);\n  external Type get runtimeType;\n}\n```\n\n除了我们之前推导出的实现方法的\
  \ `==` 之外，所有其他方法都是由 Dart 实现提供的，而不是直接在 Dart 代码中实现的。它们被标记为 `external`，表示它们的实是在别处提供的。`external`\
  \ 机制对于声明实现来自外部的代码非常有用。有多种方法可以提供此类代码——通过外部函数接口、作为底层实现的原型（在此处所示），甚至可能是动态生成的实现。在这些场景中，第一种对于大多数程序员来说是最可能的场景。\n\
  \n### 2.15 Mixins（混入）\n\n有时，单继承可能相当具有局限性。一个经典的现实例子出现在实现 GUI 框架时。你会发现你需要一个将多个小组件组合在一起的复合组件。将这个复合组件视为一个集合是非常自然且方便的。集合具有一些有用的共享功能，因此你希望定义\
  \ `CompoundWidget` 继承自 `Collection`。这里只有一个小麻烦：你还希望 `CompoundWidget` 继承自 `Widget`，因为它是一个组件，而且那里也有许多有用的功能。\n\
  \n一种方法是允许类拥有多个父类。经验表明，这种做法得不不完失。相反，Dart 使用了*基于 mixin 的继承*。\n\n为了理解基于 mixin 的继承，我们将检查一个简化的集合类：\n\
  \n点击此处查看代码图片\n\n```\nabstract class Collection {\n  forEach(f); // 在集合的每个元素上执行函数\
  \ f\n  where(f) ...\n  map(f) ...\n}\n```\n\n我们真正想要从 `Collection` 中得到的是它的函数体——大括号之间的内容。函数体包含了类声明本身贡献的功能。它是\
  \ `Collection` 与其父类之间的区别。我们称这种区别为 *mixin*（混入）。\n\n![Image](img/00007.jpeg)\n\n我们希望将此功能“混合”到\
  \ `CompoundWidget` 中，如下所示。\n\n![Image](img/00008.jpeg)\n\n我们可以通过将 `Collection` 的内容拷贝到新类\
  \ `WidgetCollection` 中来实现目标：\n\n点击此处查看代码图片\n\n```\nabstract class WidgetCollection\
  \ extends Widget {\n  forEach(f); // 在集合的每个元素上执行函数 f\n  where(f) ...\n  map(f) ....\n\
  }\n```\n\n但每当 `Collection` 发生变化时，我们需要更新 `WidgetCollection`。通常情况下，这种复制/粘贴的代码可能会导致各种问题——维护、类型检查、法律问题等。幸运的是，我们可以使用\
  \ mixins 来解决这个问题。\n\n每个 Dart 类都有一个 mixin。正如所提到的，mixin 是在类体中定义的特定于类功能。因此，我们可以通过图示的方式描绘每个具有父类\
  \ `S` 的类 `C`：\n\n![Image](img/00009.jpeg)\n\n看待 mixin 的一种方式是将其视为一个函数，它接收一个父类 `S`\
  \ 并创建一个具有特定函数体的 `S` 的新子类：\n\n点击此处查看代码图片\n\n```\nmixinCollection(S) { // 非法：仅为示例说明\n\
  \  return class Collection extends S {\n    forEach(f); // 在集合的每个元素上执行函数 f\n   \
  \ where(f) ...\n    map(f) ....\n  }\n}\n```\n\n将此类函数应用到给定类的每次操作都会产生一个新的子类。因此，我们称*mixin\
  \ 应用*（mixin application）为使用 mixin 和父类派生类的类的操作。我们用 `S` 配合 `M` 表示将 mixin `M` 应用于父类\
  \ `S`。显然，`S` 必须是一个类名，但我们如何给 mixin 命名呢？通过给 mixin 命名，层级结构现在如下：\n\n![Image](img/0010.jpeg)\n\
  \n在编写期间，作为 mixin 使用的类不能显构造函数。违反此限制会导致编译错误。该限制在未来可能会放宽。\n\n#### 2.15.1 示例：表达式问题\n\
  \n在本节中，我们将考虑一个被称为“表达式问题”（expression problem）的经典设计挑战，并看看 mixins 如何提供优雅的解决方案。表达式问题之所以这样命名，是因为使用的具体示例是表达式的实现。然而，表达式带来的问题是更广泛编程示例的特征。\n\
  \n考虑以下表达式语言：\n\n*Expression* → *Expression* + *Expression*|*Expression* − *Expression*|*Number*\
  \ 此语言的 AST（抽象语法树）形式可能如下\n\n点击此处查看代码图片\n\n```\nclass Expression {}\nclass Addition\
  \ extends Expression {\n  var operand1, operand2;\n}\nclass Subtraction extends\
  \ Expression {\n  var operand1, operand2;\n}\nclass Number extends Expression {\
  \ int val;}\n```\n\n现在，假设你想为这种语言定义一个评估器。你可以通过经典的面向风格在上述每个叶子类中添加 `eval` 方法来定义：\n\n\
  点击此处查看代码图片\n\n```\nget eval => operand1.eval + operand2.eval; // 在 Addition 中\n\
  get eval => operand1.eval - operand2.eval; // 在 Subtraction 中\nget eval => val;\
  \ // 在 Number 中\n```\n\n然而，这是有问题的。当你想要将此类表达式转换为字符串时，你需要向原始层级结构添加另一个方法。存在无限数量的类似函数，你的类会迅速变得臃肿。此外，并不是每个想要定义新功能的人都能访问原始源代码。\n\
  \n另一种方案是在 AST 类之外定义评估器函数。你必须测试传入的表达式以查看它是什么类型，然后采取相应的行动。这种做法是乏味且低效的，因此人们通常会改用访问者模式（visitor\
  \ pattern）。无论如何，这种组织方式都有一个双重问题：虽然添加函数很容易，但添加新类型很难。\n\n这种困境如下表所示：\n\n![Image](img/00011.jpeg)\n\
  \n\n\n类型对应于表格中的行，函数对应于列。面向对象的风格便于添加行，但添加列具有侵入性。函数式风格则相反——添加列很容易，但添加行具有侵入性。\n\n我们真正需要的是一种能够独立向表格添加单个条目的的方法。这个问题可以通过混入（mixins）很好地解决。下面的\
  \ Dart 代码展示了如何实现。我们从三个初始数据类型开始，但我们将它们定义为抽象类，因为这些并不是我们实际实例化的类型。它们的作用是定义类型的结构及其构造函数。\n\
  \n点击此处查看代码图像\n\n```dart\nlibrary abstract expressions;\n\nabstract class AbstractExpression{};\n\
  \nabstract class AbstractAddition {\n  var operand1, operand2;\n  AbstractAddition(this.operand1,\
  \ this.operand2);\n}\n\nabstract class AbstractSubtraction {\n  var operand1, operand2;\n\
  \  AbstractSubtraction(this.operand1, this.operand2);\n}\n\nabstract class AbstractNumber\
  \ {\n  var val;\n  AbstractNumber(this.val);\n}\n```\n\n现在让我们定义第一个函数：评估器（evaluator）。我们将通过一组混入类来实现。\n\
  \n点击此处查看代码图像\n\n```dart\nlibrary evaluator;\n\nabstract class ExpressionWithEval\
  \ {\n  get eval;\n}\n\nabstract class AdditionWithEval {\n  get operand1;\n  get\
  \ operand2;\n  get eval => operand1.eval + operand2.eval;\n}\n\nabstract class SubtractionWithEval\
  \ {\n  get operand1;\n  get operand2;\n  get eval => operand1.eval - operand2.eval;\n\
  }\n\nabstract class NumberWithEval {\n  get val;\n  get eval => val;\n}\n```\n\n\
  上面的评估器完全独立于类型层次结构；注意，我们没有导入任何一个依赖项。\n\n客户端应该使用的实际类型是分单独定义的\n\n点击此处查看代码图像\n\n```dart\n\
  library expressions;\n\nimport 'abstractExpressions.dart';\nimport 'evaluator.dart';\n\
  \nabstract class Expression = AbstractExpression with ExpressionWithEval;\n\nclass\
  \ Addition = AbstractAddition with AdditionWithEval implements Expression;\n\nclass\
  \ Subtraction = AbstractSubtraction with SubtractionWithEval\n                 \
  \                                  implements Expression;\n\nclass Number = AbstractNumber\
  \ with NumberWithEval implements Expression;\n```\n\n每个具体的 AST 类型都被定义为混入的应用，通过相应的评估器混入来扩展相应的抽象数据类型。\n\
  \n我们可以在 `expressions` 中添加一个 `main()` 函数来构建一个简单的表达式树。这是可能的，因为各种 AST 节点类已经根据其父类的构造函数隐式地定义了合成构造函数。\n\
  \n点击此处查看代码图像\n\n```dart\nmain(){\n  var e = new Addition(new Addition(new Number(4),\
  \ new Number(2)),\n                       new Subtraction(new Number(10), new Number(7))\n\
  \             );\n}\n```\n\n抽象类型和具体类型分离的意义是什么？`expressions` 的作用是通过混入应用连接其各个组件来定义我们的整个系统。`abstractExpressions`\
  \ 的作用是定义我们 AST 节点的形状。将它们保持分离允许我们通过修改 `expressions` 来扩展系统，而不触碰我们的数据类型表示。\n\n通用模式是，每个具体类都基于扩展定义其数据表示的抽象类，并配有一系列代表该数据类型所有函数的混入。这种方法之所以有效，是因为我们为每种函数和类型的组合定义了单独的混入。例如，上面的每个\
  \ `eval` 方法都定义在自己的混入类中。\n\n如果我们想添加一个类型，可以独立地完成。我们将添加一个用于乘法的 AST 节点：\n\n点击此处查看代码图像\n\
  \n```dart\nlibrary multiplication;\n\nabstract class AbstractMultiplication {\n\
  \  var operand1, operand2;\n  AbstractMultiplication(this.operand1, this.operand2);\n\
  }\n```\n\n再次，这种添加完全独立于原始类层次结构和任何函数。在这个阶段，我们还必须定义如何评估乘法。我们可以将其定义为一个单独库\n\n点击此处查看代码图像\n\
  \n```dart\nlibrary multiplication evaluator;\n\nabstract class MultiplicationWithEval\
  \ {\n  get operand1;\n  get operand2;\n  get eval => operand1.eval * operand2.eval;\n\
  }\n```\n\n这同样是完全独立的。我们确实需要在 `expressions` 中创建相应的类。\n\n点击此处查看代码图像\n\n```dart\nclass\
  \ Multiplication = AbstractMultiplication with MultiplicationWithEval\n```\n\n等等，我需要根据提供的文本流进行重新对齐。文本说“我们需要向\
  \ `expressions` 添加以下内容”：\n\n点击此处查看代码图像\n\n```dart\nimport 'multiplication.dart';\n\
  ```\n\n实际上，查看提供的源文本，代码片段是碎片化的。让我们根据提供的文本重构逻辑。\n\n文本说：“我们需要向 `expressions` 添加以下内容”：\n\
  \n点击此处查看代码图像\n\n```dart\nlibrary string;\n\nabstract class ExpressionWithStringConversion\
  \ {\n  toString();\n}\n\nabstract class AdditionWithStringConversion {\n  get operand1;\n\
  \  get operand2;\n  toString() => '($operand1 + $operand2)';\n}\n\nabstract class\
  \ SubtractionWithStringConversion {\n  get operand1;\n  get operand2;\n  toString()\
  \ => '($operand1 - $operand2)';\n}\n\nabstract class NumberWithStringConversion\
  \ {\n  get val;\n  toString() => '$val';\n}\n\nabstract class MultiplicationWithStringConversion\
  \ {\n  get operand1;\n  get operand2;\n  toString() => '($operand1 * $operand2)';\n\
  }\n```\n\n再次，我们遵循每个方法/类型组合定义混入的公式。这次，我们知道层次结构涉及乘法，并在与其他相同的库中定义了相应的情况。同样，我们希望完善 `expressions`\
  \ 以集成新功能。\n\n点击此处查看代码图像\n\n```dart\nlibrary expressions;\n\nimport 'abstractExpressions.dart';\n\
  import 'evaluator.dart';\nimport 'multiplication.dart';\nimport 'multiplicationEvaluator.dart';\n\
  import 'stringConverter.dart';\n\nabstract class Expression = AbstractExpression\
  \ with\n  ExpressionWithEval, ExpressionWithStringConversion;\n\nclass Addition\
  \ = AbstractAddition with\n  AdditionWithEval, AdditionWithStringConversion implements\
  \ Expression;\n\nclass Subtraction = AbstractSubtraction with\n  SubtractionWithEval,\
  \ SubtractionWithStringConversion implements Expression;\n\nclass Number = AbstractNumber\
  \ with\n  NumberWithEval, NumberWithStringConversion implements Expression;\n\n\
  class Multiplication =\n  AbstractMultiplication with MultiplicationWithEval,\n\
  \  MultiplicationWithStringConversion implements Expression;\n```\n\n我们的 `main`\
  \ 函数保持不变，但它现在会打印出树的美好描述：\n\n((4 + 2) * (10 - 7)) = 18\n\n\n\n\n人们可以根据需要继续扩展过程。你可以根据需要添加任意数量的类型和函数。你只需要像上面所示，定义你将用作\
  \ mixin（混入）应用程序的类型的最终形式即可。对于每个类型，每个函数的对应情况都由一个单独的 mixin 类定义。添加新函数确实需要修改这些 mixin\
  \ 应用，但这实际上更像是调整你的 make 文件以包含额外的函数和/或类型。如果新类型和新函数是独立定义的，我们始终可以单独定义一个 mixin，它添加将新函数应用到新类型的逻辑，并将其混合进来。\n\
  \n在表格方面，每个 mixin 代表一个单独的条目，而每个 mixin 应用构成了表格的一行。\n\n当我们讨论第 5 章中的类型时，我们将再次回到这一设计。\n\
  \n## 2.16 相关工作\n\n正如引言中所，Dart 的对象模型深受 Smalltalk [1] 的深度影响。Smalltalk 是第一种纯面向对象的语言，这里的许多想法都与其直接相关。元类层次结构的循环引用源于此，尽管与\
  \ Smalltalk 相比，Dart 的元类层次结构相当简单。与 Smalltalk 不同，实例实例化是通过构造函数而不是方法处理的，遵循了 C++ 建立的传统。然而，我们解决了经典构造函数的主要缺陷：它们无法产生并非由其类新分配的对象。\n\
  \n`noSuchMethod()` 的使用紧密模仿了 Smalltalk 的 `doesNotUnderstand:`。\n\n表示独立性的概念可以追溯到 `Self`\
  \ 语言。然而，由于 Javascript 和 C 风格语法的影响，Dart 并不遵循统一引用原则。\n\nMixins 起源于某些 Lisp 方言中的一种惯用法。这里使用的\
  \ mixins 语言模型由 William Cook 和作者在 1990 年引入 [4]，并首次在 Strongtalk [5]、[6] 中中实现，Strongtalk\
  \ 是一种创新的 Smalltalk 系统，对 Dart 具有特别深远的影响。在 Newspeak、Scala（在 Scala 中它们被称为 traits/特性）和\
  \ Ruby 等语言中也存在密切相关的结构。\n\n“表达式问题”（expression problem）这一名称源于 Philip Wadler。表达式问题在文献中被广泛讨论\
  \ ([7], [8], [9]）。提出的解决方案取决于所涉及的语言和需求。\n\n## 2.17 总结\n\nDart 是一种纯面向对象的、基于类的语言，这意味着所有运行时值都是对象，且每个对象都是某个类的实例。\n\
  \n对象具有状态和行为。状态仅可以通过特殊的访问方法——getters 和 setters 可用。这确保了 Dart 对象上的所有计算都是通过过程化接口完成的。\n\
  \n类在运行时是具体化的，因此它们本身必须是对象。因此，每个类都是类型为 `Type` 的元类的实例。每个类至少有一个构造函数；构造函数用于创建对象。有些对象是常量，这意味着它们可以在编译时进行预计算。\n\
  \n每个 Dart 类都有一个唯一的父类，类层次结构的最根节点 `Object` 除外。所有的 Dart 对象都从 `Object` 继承共同的行为。\n\n\
  Dart 支持基于 mixin 的继承：每个类都会引入一个 mixin，捕获其对类层次结构的独特贡献。Mixins 允许类的代码以模块化的方式重用，独立于其在类层次结构中的位置。\n\
  \n# 第 3 章 库 (Libraries)\n\nDart 程序组织成称为库（libraries）的模块化单元。我们在第 1 章 中看到了第一个库。你可能认为这就是该章节末尾显示的\
  \ `points` 库，但实际上，它是我们的“Hello World”程序。这也许是一个微不足道的库，但它毕竟是一个库。这里再次出现：\n\n```dart\n\
  main(){\n  print('Hello World');\n}\n```\n\n如你所示，不需要像我们在 `points` 中看到的那种显式库声明。大多数库都有这样的声明，这对于我们在下面将说明的各种原因很有用。然而，对于快速简单的任务，能够直接写一个函数并运行它是很方便的。在\
  \ Dart 中，我们总是寻求以最少的麻烦对语言进行实验，同时为良好的软件工程实践提供支持。\n\n### 3.1 顶层 (The Top Level)\n\n\
  在我们的示例中，库由单个顶层函数 `main()` 组成。通常，一个库由若干个顶层声明组成。这些声明可以定义函数、变量和类型。\n\n这是一个稍微大一点但仍然微不足道的示例——一个实现栈的库。这是你可能在入门编程课上看到的这类枯燥练习，这很好是的，因为我们可以关注语言结构而不是复杂的程序逻辑。\n\
  \n点击此处查看代码图像\n\n```dart\nlibrary stack1;\n\nfinal _contents = [];\n\nget isEmpty\
  \ => contents.isEmpty;\n\nget top => isEmpty ? throw 'Cannot get top of empty stack'\
  \ : contents.last;\n\nget pop => isEmpty? throw 'Cannot pop empty stack' : _contents.removeLast();\n\
  \npush(e) {\n  _contents.add(e);\n  return e;\n}\n```\n\n如你所示，不需要像我们在 `points` 中看到的那种显式库声明。大多数库都有这样的声明，这对于我们在下面将说明的各种原因很有用。然而，对于快速简单的任务，能够直接写一个函数并运行它是很方便的。在\
  \ Dart 中，我们总是寻求以最少的麻烦对语言进行实验，同时为良好的软件工程实践提供支持。\n\n等待，抱歉，我在上面的手动思考过程中重复了一个段落。让我从\
  \ 3.1 节开始提供修正后的版本：\n\n[content]\n在我们的示例中，库由单个顶层函数 `main()` 组成。通常，一个库由若干个顶层声明组成。这些声明可以定义函数、变量和类型。\n\
  \n这是一个稍微大一点但仍然微不足道的示例——一个实现栈的库。这是你可能在入门编程课上看到的这类枯燥练习，这很好是的，因为我们可以关注语言结构而不是复杂的程序逻辑。\n\
  \n点击此处查看代码图像\n\n```dart\nlibrary stack1;\n\nfinal _contents = [];\n\nget isEmpty\
  \ => contents.isEmpty;\n\nget top => isEmpty ? throw 'Cannot get top of empty stack'\
  \ : contents.last;\n\nget pop => isEmpty? throw 'Cannot pop empty stack' : _contents.removeLast();\n\
  \npush(e) {\n  _contents.add(e);\n  return e;\n}\n```\n\n我们有一个顶层变量 `contents`，它被初始化为空列表。顶层变量产生隐式访问器，就像类字段一样。再次，用户代码并不直接访问变量。\n\
  \n顶层变量和类变量共同成了静态变量范类。两者的区别在于作用域——它们可以通过名称引用。虽然类变量名被限制在声明它们的类的作用范围内（甚至子类也看不到它们），但顶层变量名（也称为库变量）在声明它们的整个库作用范围内都是有效的。库的作用域通常包含多个类和函数。\n\
  \n与类变量一样，顶层变量可以是 `final`，在这种情况下为它们没有定义 setter，且它们必须在声明处初始化。也可以将一个静态变量（无论是类变量还是库变量）声明为常量，在这种情况下，它只能被赋值编译时常量并被视为常量（第\
  \ 2.11 节,6.1.4）。\n\n顶层函数（通常称为库方法）的作用域规则与顶层变量相同；一个顶层函数在整个库的作用范围内都是有效的。可以定义普通函数、getters\
  \ 和 setters。在每情况下，函数体可以使用短形式给出，使用 `=>` 后跟单个表达式（如 `isEmpty`、`top`、`pop`），或使用大括号之间的语句序列（如\
  \ `push()`）。\n\n除了顶层函数和变量外，我们还有顶层类声明。Dart 中的所有类声明都是顶层的，因为 Dart 不支持嵌套类。\n\n### 3.2\
  \ 脚本 (Scripts)\n\n“Hello World”程序是一个脚本示例，它是一个可以直接执行的 Dart 库。脚本从它的 `main()` 函数开始执行。如果一个库没有\
  \ `main()` 函数，那么根据定义，它不是脚本，并且不能独立运行。\n\n\n\n脚本还有一个特殊之处。脚本的第一行可以以字符 `#` 开头，其后可以跟任意文本，直到行尾。这在许多环境中非常有用，这些环境能够根据文件头部以\
  \ `#` 为前缀指令，对不同的文件运行不同的解释器。\n\n### 3.3 封装有性\n\n库是 Dart 的封装单元。以下划线（`_`）开头的名称对于库来说是私有的。我们在上面看到一个例子，库变量\
  \ `_contents`。将 `_contents` 设为私有有助于维护由 `stack1` 引入的栈抽象的完整性。因为只有 `stack1` 内部的代码可以访问\
  \ `_contents`，我们确保了没有其他代码会篡改栈的底层表示。\n\n另一个例子，请考虑\n\n点击此处查看代码图像\n\n```dart\nclass\
  \ CachingClass {\n   var _cache;\n\n   operator [](i) {\n     if (_cache[i] == null)\
  \ { _cache[i]= complicatedFunction(i);}\n     return _cache[i];\n   }\n}\n```\n\n\
  定义 `CachingClass` 的库之外，没有人可以获取 `_cache` 字段。\n\n这种方案允许你（以及编译器或任何工具）识别某个内容是否是私有的，而无需查找其声明。\n\
  \n私有性不应与安全性混淆。Dart 中私有性的目的是支持软件工程需求，而不是安全性需求。唯一的安全边界是隔离器（isolates）之间的边界，我们将在第 8\
  \ 章中详细检查它们。在隔离器内部，没有安全保证。\n\n### 3.4 导入\n\n读者无疑熟悉编程中的导入（imports）概念。例如，如果我们想在应用程序中使用\
  \ `stack1`，我们可能会写：\n\n```dart\nimport 'stack1.dart';\n\nmain() {\n  push('gently');\n\
  \  push('harder');\n  print(pop);\n  print(top);\n}\n```\n\n这为我们的 `main()` 函数提供了访问\
  \ `stack1` 的 `push()` 和 `pop()` 方法的权限。脚本将打印 `harder` 然后打印 `gently`。只要库 `stack1`\
  \ 存储在与我们的主脚本相同目录下的 `stack1.dart` 文件中，此代码即可工作。然而，如果 `stack1` 存储在其他地方，比如网络上的 [`http://staxRUs/stack1.dart`](http://staxRUs/stack1.dart)\
  \ 呢？\n\n我们可以导入替换为：\n\n点击此处查看代码图像\n\n```dart\nimport 'http://staxRUs/stack1.dart';\n\
  ```\n\nDart 导入支持任意 URI（通用资源标识符）。然而，上述两个 URI 都不特别建议，因为这会让你的代码对导入库位置的任何更改变得敏感。使用此类\
  \ URI 对于快速且粗略的实验很有用，但严肃的代码需要更强的自律。通常，人们会写：\n\n```dart\nimport 'package:stack1.dart';\n\
  ```\n\n`package:` 方案用于调用常驻的包管理器，该管理器封装了关于代码所在位置的知识。Dart 环境通常带有一个包管理器，但细节超出了本书的范围。\n\
  \n对于作为 Dart 平台一部分的库，无需使用 `package:` 方案。这些库通过 `dart:` 方案访问，例如：\n\n```dart\nimport\
  \ 'dart:io';\n```\n\n其他示例包括 `dart:html`、`dart:json` 以及许多其他。\n\n无论你使用哪种方案，URI 最好引用一个实际库，否则会发生编译错误。URI\
  \ 还需要是一个常量字符串字面量 (6.1.1.4)，并且可能涉及插值。\n\n库内部可用的名称是它声明的名称，以及通过导入其他库引入库作用域的名称。`dart:core`\
  \ 定义的名称是隐式导入的。\n\n库向其客户端提供的名称集与内部可用的名称不同。首先，库导入的名称不会传递性地提供给导入该库的客户端。此外，库的私有成员对导入它们的其他库是不可见的。我们很快就会看到其他的差异。因此，谈论库的导出命名空间（exported\
  \ namespace）是有用的。\n\n假设我们在库 `stack2` 中有另一个种备选的栈实现。我们可能会编写一些用于测试这两种实现的代码。我们可以从这样草拟我们的脚本开始：\n\
  \n```dart\nimport 'package:stack1.dart';\nimport 'package:stack2.dart';\n\nmain()\
  \ {}\n```\n\n到目前为止，一切正常。你可以无任何问题地编译这段代码。然而，一旦我们尝试用使用导入的代码填充 `main()` 的主体，我们就会遇到一个障碍。\n\
  \n点击此处查看代码图像\n\n```dart\nimport 'package:stack1.dart';\nimport 'package:stack2.dart';\n\
  \nmain() {\n  // testing stack1\n  push('gently'); // 静态警告\n  push('harder'); //\
  \ 静态警告\n  print(pop); // 静态警告\n  print(top); // 静态警告\n\n  // testing stack2\n  push('gently');\n\
  \  push('harder');\n  print(pop);\n  print(top);\n}\n```\n\n你能区分使用 `stack1` 的代码和使用\
  \ `stack2` 的代码吗？当然不能，`stack2` 的方法与 `stack1` 的方法相同，将它们都导入到同一个作用域是完全歧义的。\n\nDart 编译器会对每个使用歧义名称的地方发出警告。注意，导入冲突名称本身不会引起警告——只有当你尝试使用歧义名称时才会发出。这符合\
  \ Dart 的“不干扰”哲学。如果我们忽略警告并尝试运行代码，第一次调用 `push()` 将导致运行时错误。具体来说，将抛出 `NoSuchMethodError`，因为\
  \ `push()` 未定义。读者可能会问为什么允许？为什么不将这些情况标记为错误并拒绝编译程序？请记住，歧义名称的使用可能位于并不执行的分支中。我们是否应该在消除歧义之前阻止开发者测试另一个分支？我们认为不必；我们不想对程序员施加特定的工作流。相反，我们乐意通知程序员有关问题，并由他们来解决。\n\
  \n克服上述类型歧义的一种良好方法是为每组导入的名称提供不同的前缀以区分它们。\n\n点击此处查看代码图像\n\n```dart\nimport 'package:stack1.dart'\
  \ as stack1;\nimport 'package:stack2.dart' as stack2;\n\nmain() {\n  // testing\
  \ stack1\n  stack1.push('gently');\n  stack1.push('harder');\n  print(stack1.pop);\n\
  \  print(stack1.top);\n\n  // testing stack2\n  stack2.push('gently');\n  stack2.push('harder');\n\
  \  print(stack2.pop);\n  print(stack2.top);\n}\n```\n\nDart 优先考虑库内部的声明而非任何导入，因此向导入的库中添加顶层名称并不像想象中那样有害。然而，问题仍然可能发生如果你从一个导入中访问一个名称，而另一个导入库后来添加了相同的名称，可能会对你的代码产生问题。此外，新导入的名称可能会覆盖继承的名称。\n\
  \n为所有导入添加前缀可以确保当导入的库添加顶层成员时，未来永远不会对导入者造成破坏。\n\n\n\n前缀可能与闭包库中的任何其他顶层声明冲突。编译器会将此类冲突标记为错误。由于本地名称的优先级高于任何导入，前缀将遮蔽（shadow）任何未带前缀导入的同名声明。\n\
  \n在多个导入中使用相同的前缀是允许的。如果这些导入引入的带前缀名称发生冲突，则适用上述规则：除非使用了冲突的名称，否则没有问题；如果使用了，编译时会发出警告，并在运行时因\
  \ `NoSuchMethod` 导致执行失败。\n\n重要的一点是，Dart 只有在名称指向不同的声明时，才会认为它们存在冲突。如果我们从同一个库中导入了两次\
  \ `push()`，那么在编译时或运行时都不会出现问题。\n\nDart 提供了额外的机制来控制哪些名称被导入到库中：命名空间组合符*（namespace combinators）`show`\
  \ 和 `hide`。*命名空间*（namespace）是从名称到声明的映射。例如，考虑由 `stack1` 定义的命名空间。它包含了 `contents`、`isEmpty`、`top`、`pop`\
  \ 和 `push`。当我们导入 `stack1` 时，我们看不到 `contents`，因为它是私有的；它不是 `stack1` 导出命名空间的一部分。通常，导入会允许导入者访问被导入库的导出命名空间。前缀化和命名空间组合符都允许我们操作被导入的命名空间。\n\
  \n`hide` 组合符接收一个命名空间和一个标识符列表，生成一个新的命名空间，其中列出的标识符已被丢弃。如果我们在库中包含以下导入：\n\n点击此处查看代码图片\n\
  \n```dart\nlibrary lib1;\n\nimport 'stack1.dart' hide isEmpty, top;\n```\n\n在 `lib1`\
  \ 中将只有 `pop` 和 `push` 可用，因为正在导入的命名空间不再是 `stack1` 完整的导出命名空间。`hide` 操作符作用于导出命名空间，消除了\
  \ `isEmpty` 和 `top`。实际上提供给导入者作用域内的是 `hide` 应用的结果。\n\n`show` 组合符与之类似，不同之处在于生成的命名空间中只保留了列出的标识符。我们可以使用\
  \ `show` 来达到与上例相同的效果：\n\n点击此处查看代码图片\n\n```dart\nlibrary lib1;\n\nimport 'stack1.dart'\
  \ show pop, push;\n```\n\n相比之下，让我们\n\n点击此处查看代码图片\n\n```dart\nlibrary lib1;\n\nimport\
  \ 'stack1.dart' show isEmpty, top;\n```\n\n在这里，`lib1` 只提供了 `isEmpty` 和 `top`，而没有提供\
  \ `pop` 和 `push`。这个例子也可以表示为：\n\n点击此处查看代码图片\n\n```dart\nlibrary lib1;\n\nimport 'stack1.dart'\
  \ hide pop, push;\n```\n\n什么时候应该用 `show`，什么时候应该用 `hide`？如果你正在导入一个大型库，而你只想使用其中的少数成员，你可能会发现\
  \ `show` 更方便。相反，如果你正尝试解决库之间的一两个冲突，你可能会选择使用 `hide`，但可能最好使用 `as` 配合前缀以确保永远不会发生冲突。然而，正如我们在稍后讨论导出时看到的，`hide`\
  \ 还有额外的用途。\n\n如果你真的想让你的库变得健壮，你应该将前缀与 `show` 结合，只导入你实际使用的元素：\n\n点击此处查看代码图片\n\n```dart\n\
  library lib1;\n\nimport 'stack1.dart' as stack1 show pop, push;\n```\n\n这样，你只需扫一眼库的顶部就能确切地知道你依赖哪些成员。大多数程序员可能觉得这种纪律性有点乏味，但良好的开发工具应该能够为你自动维护此类导入。\n\
  \n有些人认为通过前缀访问导入过于冗长。另一种风格坚持始终使用 `show`，但不使用前缀。使用 `show` 将防止导入的任何新成员引起无意中冲突。然而，你可能仍然需要解决来自不同导入的成员之间的冲突，并注意导入与继承成员之间的冲突。\n\
  \n### 3.5 将库拆分为部分\n\n有时，一个库太大了，不方便保存在单个文件中。Dart 允许你将库拆分为较小的组件，称为*部分*（parts）。假设我们有一个实现\
  \ Dart 交互式开发环境（IDE）的 Dart 库。该 IDE 类浏览器、对象检查器、调试器，以及对单元测试、包管理和版本控制的集成支持。这是一个大型程序，我们绝对不希望用一个巨大的文件装载所有内容。同时，由于紧密集成，我们可能希望\
  \ IDE 是一个单一的库，其私有状态可以在子系统间共享。我们可以这样结构化它：\n\n点击此处查看代码图片\n\n```dart\nlibrary ide;\n\
  \nimport 'dart:io' as io;\n\nimport 'dart:mirrors' as mirrors;\n\nimport 'dart:async'\
  \ as async;\n\n// 更多：UI 等。\n\npart 'browsing.dart';\n\npart 'inspecting.dart';\n\
  \npart 'debugging.dart';\n\npart 'unitTest.dart';\n\npart 'packages.dart';\n\npart\
  \ 'vcs.dart';\n```\n\n每个子系统位于自己的文件中，库通过使用 `part` 指令来引用它们。每个 `part` 指令给出了可以找到部分的\
  \ URI。部分共享相同的作用域——库的内部命名空间，包括任何导入。\n\n`part` 似乎类似于 C 语言的 `#include` 指，但并非如此。部分是结构化的。每个部分必须以*部分头部*（part\
  \ header）开头，指定它属于哪个库。例如，‘browsing.dart’可能开头为\n\n```dart\npart of ide;\n\n// 顶层声明\n\
  class ClassBrowser ...\n```\n\n部分头部使用库的名称引用。并不是所有库都有名称，但如果通过部分构建库，则必须给它命名。部分应该是良好的分组，而不是任意的代码块。\n\
  \n如果部分从另一个库引用怎么办？例如，假设 `packages.dart` 读取：\n\n```dart\npart of packageManager;\n\
  \n// 顶层声明\nclass Package ...\n```\n\n这种错误确实会发生，并引起 Dart 编译器的警告。Dart 通常试图避免阻止执行的完全编译错误。你可能发现像\
  \ `packages.dart` 这样的部分在原始库之外的上下文中很有用。从长远来看，这可能是一个坏主意，因为 `packages.dart` 的更新可能会与你对\
  \ `ide` 库的计划冲突。然而，作为启动的临时措施，它可能非常方便。它可以被编译和运行，Dart 不会阻碍你。\n\n另一个可能的问题是 `packages.dart`\
  \ 实际上不是一个部分：\n\n```dart\nlibrary packages;\n\n// 顶层声明\nclass Package ...\n```\n\n\
  这段代码将导致编译错误，因为在这种情况下编译器无法进行任何合理的操作。通用规则是：如果库引用某个 URI 的部分，而该 URI 内容不是部分，则是编译错误；如果部分没有引用回同一个库，则是警告。与导入（以及接下来我们将看到的导出）一样，如果\
  \ URI 不是常量字符串或涉及字符串插值，也是编译时错误。\n\n### 3.6 导出\n\n\n\n\n让我们再次考虑我们的 IDE 示例。IDE 不一定得是数百万行代码的庞然建筑，但它们完全可以是。我们的项目可能会超出我们最狂野的预期，此时我们确实需要将其拆分为多个库。此外，我们也可能想为第三方提供一个\
  \ IDE 的 API。\n\n当然，人们可以根据需要导入 IDE 的各种组件库。然而，这些 API 可能非常庞大且复杂，我们可能希望提供一个更易于管理的子集。当我们不想让用户负担大量子库的导入时，这也很有用。此外，我们可能不想暴露项目内部的库结构。\n\
  \n#### 我们如何从一系列库中组合出一个易于管理的 API？\n\n点击此处查看代码图像\n\n```dart\nlibrary ideAPI;\n\nexport\
  \ 'browsing.dart'\n  show AbstractBrowser, LibraryBrowser, ClassBrowser;\n\nexport\
  \ 'inspecting.dart' show ObjectInspector;\n\nexport 'debugging.dart' show ThreadBrowser,\
  \ ActivationBrowser;\n\nexport 'unitTestIntegration.dart' show TestBrowser, TestSuite;\n\
  \nexport 'packages.dart' show PackageBrowser;\n\nexport 'vcs.dart' show RepositoryBrowser;\n\
  ```\n\n`export` 指令允许库从其他命名空间引入额外的名称来增强其导出的命名空间。在像 `ideAPI` 这样的情况下，库的整个目的是以一种方便消费的形式聚合并封装其他库的功能。它通过从几个库的导出命名空间构建一个\
  \ API，并使用 `show` 和 `hide` 进行适当的过滤来实现这一目标。虽然我们的示例只使用了 `show`，但在我们需要导出大型 API 但又想避免与另一个导出库发生冲突的场景下，`hide`\
  \ 将非常有用。\n\n然而，使用 `hide` 有一个缺点：如果导出的库中添加了新成员，可能会导致冲突。另一方面，`hide` 的优势是，我们不需要显式地更新导出语句，就能让导出的库中的新增内容对客户端可用。\n\
  \n注意，`ideAPI` 并没有导入任何内容。导出（export）与导入（import）是完全独立的。即使你没有在库未使用某个库，也可以导出它。这正是让像 `ideAPI`\
  \ 这样的库能够聚合（部分）多个 API 的原因。\n\n导出规则与导入和部分（parts）的规则一致：导出中使用的 URI 必须引用一个库，并且必须是不涉及插值的常量字符串字面量。如果违反了任何这些要求，编译器将报告错误。如果一个库通过多个导出语句导出同一个名称，也是编译错误。这种情况在本质上是模糊的——我们实际上在导出哪个实体？\n\
  \n### 3.7 菱形导入 (Diamond Imports)\n\n在导入多个此类聚合 API 时，最终可能会通过多个路径导入同一个实体。这种情况被称为*菱形导入*（diamond\
  \ import），如下所示。\n\n![图像](img/00012.jpeg)\n\n点击此处查看代码图像\n\n```dart\nlibrary food;\n\
  \nclass Escargot {...}\n\nclass Caviar {...}\n\nclass Pasta {...}\n\nclass IceCream\
  \ {...}\n\nclass IceCreamCone {\n  fill(contents){ ...}\n}\n\nlibrary cooking;\n\
  \nimport 'package:food.dart' as food\n  show Escargot, Caviar, Pasta, IceCream,\
  \ IceCreamCone;\n\nexport 'package:food.dart'\n  show Escargot, Caviar, Pasta, IceCream,\
  \ IceCreamCone;\n\nclass CoqAuVin {...}\n\nclass SeaBassInBaroloSauce {...}\n\n\
  class PeaSoup {...}\n\nclass RabbitBrainsWithAnemone {...}\n\nclass SpaghettiBolognese\
  \ {...}\n\nlibrary containers;\n\nexport 'package:food.dart' show IceCreamCone;\n\
  \nclass Plate {...}\n\nclass Cup {...}\n\nclass Bowl {...}\n\nlibrary kitchen;\n\
  \nimport 'package:containers.dart';\n\nimport 'package:food.dart';\n\nmakeIceCream()\
  \ {\n  new IceCreamCone().fill(new IceCream());\n}\n```\n\n`kitchen` 库同时导入了 `cooking`\
  \ 和 `containers`。它们在导出命名空间中都包含了 `IceCreamCone`。Dart 会对这种情况发出警告；但它不被视为错误，因为它们都是从\
  \ `food` 获取 `IceCreamCone` 并简单地重新导出。\n\n考虑一下如果 `containers` 决定替换 `food` 中的 `IceCreamCone`\
  \ 版本（例如通过声明自己的版本，或从另一个提供者获取 `IceCreamCone`）会发生什么。`containers` 库保持了其公共 API 不变，因此客户端不应遇到任何困难。然而，这种变化会使上面的代码突然非法。\n\
  \n这是不可接受的，因此我们发出警告。然而，在典型的 Dart 风格中，我们并不阻止编译，因为没有真正的歧义。该警告是有用的，这样程序员就不会忽略潜在的冲突。它鼓励最佳实践，即始终避免歧义。\n\
  \n### 3.8 延迟加载 (Deferred Loading)\n\n有时有必要延迟加载某个库。原因各不相同。通常，我们只是为了让应用程序快速启动，尽可能保持初始下载尽可能小。在功能丰富的大型应用程序中可能会出现另一种情况：某些功能并非所有用户都会使用，因此实现该功能的库并不总是需要的。不加载未使用的库有助于减少内存占用。\n\
  \nDart 使用*延迟导入*（deferred imports）来支持这些场景。\n\n点击此处查看代码图像\n\n```dart\nimport 'rarely.dart'\
  \ deferred as rarelyUsed;\n```\n\n延迟导入必须提供一个前缀。该前缀在开发期间不能被其他导入使用。违反这些规则会导致编译错误。\n\
  \n当我们真正需要使用该延迟库（例如用户选择了一个需要它的菜单项）时，我们可以对 `rarelyUsed` 调用 `loadLibrary()` 方法。\n\n\
  点击此处查看代码图像\n\n```dart\nrarelyUsed.loadLibrary().then(onLoad);\n```\n\n其中 `onLoad`\
  \ 定义为：\n\n点击此处查看代码图像\n\n```dart\nonLoad(loadSucceeded) => loadSucceeded ? doStuff()\
  \ : makeExcuses();\n```\n\n`loadLibrary()` 调用是异步的。它启动加载，但立即返回，而不是等待加载完成。`loadLibrary()`\
  \ 的结果是一个*未来*（future）——一个对未来某个可用值的占位符。Future 将将在第 8 章](#part0016.html_ch08) 中详细描述。现在，我们知道的是\
  \ future 支持 `then()` 方法，该方法接受一个函数作为参数。当 future 代表的值最终可用时，该函数将被调用。\n\n在我们的案例中，`loadLibrary()`\
  \ 返回的 future 是一个指示加载是否成功的布尔占位符。在加载过程完成（无论成功失败）后，函数 `onLoad()` 将调用。它的参数 `loadSucceeded`\
  \ 将绑定到上述布尔值，告诉我们库是否已加载。然后我们相应地采取行动。\n\n在确定库已加载之前，避免访问 `rarelyUsed` 是关重要的。如果我们在加载完成之前尝试访问，将得到运行时错误。我们可能会选择仅在\
  \ `doStuff()` 内部引用 `rarelyUsed`，从而降低过早访问的风险。我们仍然面临 `doStuff()` 在 `rarelyUsed` 加载之前在别处被调用的风险。\n\
  \n\nDart 的导入（imports）遵循惯例，不同在于它们依赖 URI 而不是像大多数旧语言那样的内置标识符。导入的传统优缺点也适用于 Dart。例如，在同一个地址空间内，无法针对不同的依赖绑定同一个库的多个拷贝。Dart\
  \ 对隔离（isolates）的支持可能会某种程度上缓解这个问题。另一方面，导入是具体的，并且被大多数程序员理解。\n\n菱形导入（Diamond import）与菱形继承问题有关但不不同（[10],\
  \ [11]）。\n\nDart 对隐私的处理是原创的。它偏离了 C++、Java 和 C# 中长期基于类的隐私传统。它也不同于 Smalltalk 的基于对象的隐私模型，以及基于抽象数据类型（ADT）的隐私模型（如用于\
  \ CLU、Ada、Modula 和 Oberon 等许多语言）。\n\n这种方法是务实的。它能很好地处理多个类之间的交互，而不需要依赖类型系统。在缺乏强制静态类型系统的情况下，基于类的封装需要昂贵的动态检查，因此动态类型对象化语言倾向于基于对象的封装，或者将一切都公开。前者被认为是一种严苛的准则，而后者不适合一种为严肃的软件工程设计的语言。\n\
  \n命名空间组合器 `show` 和 `hide` 遵循了长久的传统。示例包括 [12] 中的模块组合器、[13] 对特征（traits）的操作、Racket\
  \ 中 [14] 对单位（units）的操作，无疑还有。\n\n## 3.10 总结\n\nDart 程序由库（libraries）组成。库聚合了类/类型、函数和变量。Dart\
  \ 库是隐私单元而非安全单元。\n\nDart 程序的执行始终从其脚本的 `main()` 函数开始。库可以拆分为多个部分。Dart 库通过导入连接到它们的依赖项，并通过调用命名空间组合器和使用前缀来区分导入，从而从其他库选择性导入名称。库还可以利用命名空间组合器重新导出其他库或其子集。库加载可以在运行时延迟以提高启动速度并/或减少内存占用。\n\
  \n# 第 4 章 函数\n\n函数是 Dart 的主体工作。实际计算内容的是函数。我们泛指使用*函数*（functions）一词来涵盖所有语法形式的函数和方法，无论它们是否表现为数学函数。\n\
  \nDart 中的函数是一等类值，可以存储在变量中、作为参数传递并作为结果。与 Dart 中所有的运行时值一样，函数也是对象。\n\n我们已经遇到了各种函数：顶层函数、实例方法和类方法（无论是\
  \ getter、setter、运算符还是普通方法）以及构造函数。正如我们将看到的，还有局部函数和函数字面量。它们都共享共同结构，我们将在这里进行说明。\n\n\
  ### 4.1 参数\n\n函数始终有一有一个*形式参数*（formal parameters）列表，尽管参数列表可能为空，且对于 getter 方法它是省略的。参数要么是*位置的*（positional），要么是*命名的*（named）。\n\
  \n#### 4.1.1 位置参数\n\n参数可以是 `required`（必需的）或 `optional`（可选的）。以下是一些带有必需参数的函数：\n\n\
  点击此处查看代码图像\n\n```\nzero() => 0; // 一个没有参数的函数；技术上，它有 0 个参数\n\nget zero => 0; // 同一内容的另一个版本\n\
  \nid(x) => x; // 恒等函数\n\nidentity(x) { return x;} // 一个更冗长的恒等函数\n\nadd(a, b) =>\
  \ a + b; // 一个带有两个必需参数的函数\n```\n\n可选参数必须一起列在参数列表末尾的方括号内。任何必需参数必须在可选参数之前。可选参数可以赋予默认值，这些值必须是编译时常量。\n\
  \n点击此处查看代码图像\n\n```\nincrement(x, [step = 1]) => x + step; // step 是可选的，默认值为 1\n\
  ```\n\n我们可以用一个或两个参数调用 `increment()`。\n\n点击此处查看代码图像\n\n```\nincrement(1); // 求结果为\
  \ 2\n\nincrement(2, 4); // 求结果为 6\n\nincrement(); // 运行时错误\n\nincrement(2, 3, 4);\
  \ // 运行时错误\n```\n\n第一次调用将 `x` 绑定到 `1`；由于未提供第二个参数，`step` 绑定到它的默认值 1，产生 `1 + 1 = 2`。第二次调用显然产生\
  \ `2 + 4 = 6`。第三次调用在执行时抛出 `NoSuchMethodError`。尽管我们在作用范围内有一个名为 `increment` 的函数，但我们没有接受零参数的版本，因此抛出了异常。最后一次调用的情况类似；没有接受三个参数的\
  \ `increment()` 版本。\n\n#### 4.1.2 命名参数\n\n参数可以是位置的也可以是命名的。我们已经看到了许多位置参数的示例。命名参数在编程语言中并不常见，这就是为什么我们一直没有立即引入它们。命名参数声明在任何位置参数之后，位于大括号之间。\n\
  \n这里是一个完全依赖命名参数的示例：\n\n点击此处查看代码图像\n\n```\naddressLetter({name: '', street: '', number,\
  \ city, zip}) {\n  var addr = Address();\n  addr.street = street;\n  addr.number\
  \ = number;\n  addr.city = city;\n  addr.zip = zip;\n  addr.country = country;\n\
  \  return addr;\n}\n\naddressLetter(street: \"Downing\", number: 10);\n\naddressLetter(street:\
  \ \"Wall\", city: \"New York\", country: \"USA\");\n\naddressLetter(city: \"Paris\"\
  , country: \"France\");\n\naddressLetter(name: \"Alice\", country: \"Wonderland\"\
  );\n\naddressLetter();\n\naddressLetter(name: \"room\", number: 101, country: \"\
  Oceania\");\n```\n\n代码所示，可以使用命名参数的任何组合调用 `addressLetter()`。\n\n以下示例展示了必需参数和命名参数混合的情况。\n\
  \n点击此处查看代码图像\n\n```\nvar map = Map();\n\nfail() => throw('Key not found');\n\nlookup(key,\
  \ {ifMissing: fail}) {\n  var result = map[key];\n  if (result == null) {return\
  \ ifMissing();}\n  return result;\n}\n```\n\n通常，回调函数（例如错误处理器）通过命名参数指定，而其他形式参数通过位置给出。\n\
  \n点击此处查看代码图像\n\n```\nlookup(\"anything\"); // 抛出异常\n\nlookup(\"anything\", ifMissing:\
  \ () => map[\"anything\"] = 42); // 42\n```\n\n如果我们想提供更好的错误信息，可能想写成\n\n点击此处查看代码图像\n\
  \n```\nvar map = Map();\n\nlookup(key, {ifMissing}) {\n  var result = map[key];\n\
  \  if (result != null) {return result;}\n  return ifMissing == null? throw '$key\
  \ not found' : ifMissing();\n}\n```\n\n在这种变体中，我们利用了这样一个事实：如果为可选参数指定默认值，它将默认为 `null`。\n\
  \n命名参数总是可选的。换句话说，参数作为必需/可选的分类与它们作为位置/命名的分类并不是正交的。你不能将可选位置参数与命名参数混合——你要么使用其中一种。\n\
  \n形式参数不是 `final` 的。它们可以像任何其他变量一样被修改；但从良好的风格角度，应该避免这样做。应该尽量减少可变变量的使用；变异使得代码更难理解和推理。\n\
  \n### 4.2 函数体\n\n\n\n\n\n函数包含一个体，其中包含函数执行时要评估的代码。函数体紧跟签名之后，可以采取我们过的过的形式出现：\n\n1.\
  \ 封装在花括号中的语句列表（可能为空）。\n2. 紧跟在标记 `=>` 之后的单个表达式。\n\n在第一种形式中，执行从体中的第一条语句开始，直到发生以下任一情况为止：函数中的最后一个语句已成功执行、执行了\
  \ `return` 语句，或者抛出了在函数内部未被捕获的异常。\n\nDart 中的每个函数要么返回一个值，要么抛出一个异常。\n\n如果我们完成了最后一条语句且它不是\
  \ `return`，则我们从函数返回 `null`。例如\n\n点击此处查看代码图片\n\n```dart\nsideEffect(){\n  print(\"\
  I don't have a return and I don't throw an exception\");\n  print(\"What is my value?\"\
  );\n}\n\nsideEffect(); // 打印然后求值为 null\n```\n\n构造函数是用于创建类实例的特殊函数。构造函数包括工厂函数（factories，被赋予特殊角色的普通函数）和生成构造函数（generative\
  \ constructors）。生成构造函数的区别在于，它们总是返回一个新的实例或抛出一个异常。因此，在没有显式 `return` 语句的情况下，生成构造函数不会返回\
  \ `null`。事实上，生成构造函数不能返回任意表达式。只有当该语句没有关联的表达式时，它才能包含 `return` 语句。\n\n## 4.3 函数声明\n\
  \n到目前为止看到的大多数函数都是函数声明引入的。例外是构造函数、获取器（getters）和设置器（setters）。函数声明有一个名称，后面跟着参数列表和函数体。\n\
  \n抽象方法由函数签名组成，但不提供函数体。抽象方法在技术上并不是函数声明。它们仅作为声明，有助于引导静态分析器。\n\n函数声明可以在顶层（例如 `main()`）或作为方法出现，我们已经遇到过许多示例。然而，函数也可以是`local\
  \ functions`（局部函数）。局部函数是嵌套在其他函数内部的定义。\n\n这是一个简单的示例——在计算斐比那契数列时定义一个嵌套的辅助函数：\n\n点击此处查看代码图片\n\
  \n```dart\nfib(n) {\n  lastTwo(n) {\n    if (n < 1) { return [0, 1]; }\n    else\
  \ {\n      var p = lastTwo(n-1);\n      return [p[1], p[0]+p[1]];\n    }\n  }\n\
  \  return lastTwo(n)[1];\n}\n```\n\n这不是计算第 *n* 个斐比那契数的最佳方法，但它避免了简单递归版本的浪费。由于 `lastTwo()`\
  \ 只是 `fib()` 的实现细节，最好将 `lastTwo()` 嵌套在 `fib()` 内部，避免用额外的函数名污染周围的命名空间。\n\n## 4.4\
  \ 闭包\n\n函数可以内联定义为表达式的一部分。这些被称为 `function literals`（函数字面量）或更泛地称为 `closures`（闭包）。与函数声明不同，闭包没有名称。然而，它们和任何其他函数一样拥有参数列表和函数体。\n\
  \n点击此处查看代码图片\n\n```dart\n(x) => x; // 另一个恒等函数\n\n(x) {return x;} // 另一个\n\n(x, [step\
  \ = 1]) => x + step; // 带有可选参数的闭包\n\n(a, b) => a + b; // 带有两个必需参数的闭包\n```\n\n孤立看这些示例，可能无法立即看出闭包有多用。它们看起来完全就是没有名称的函数声明。真正的好处在于将它们作为较大表达式的一部分使用。\n\
  \n考虑求列表元素和的问题。人们完全可以写一个 `for` 循环来实现，但那是一种相当原始的方法。精通 Dart 的程序员会写成：\n\n点击此处查看代码图片\n\
  \n```dart\nsum(nums) => nums.reduce( (a, b) => a + b);\n```\n\n`reduce()` 方法为 Dart\
  \ 中的列表以及许多其他类型定义。任何实现 `Iterable` 的类型都应该有一个可用的 `reduce()` 方法。该方法接受一个二元函数（我们将之称为 `combiner`）作为参数。调用时，`reduce`\
  \ 遍历其接收者。处理从获取前两个元素并将它们传递给 `combiner` 开始。在随后的每次迭代中，上一次调用 `combiner` 的结果将作为第一个参数传递给下一次\
  \ `combiner` 的调用，同时带有接收者的下一个元素。如果 `combiner()` 将其参数相加，效果就是加上接收者的前两个元素，然后将结果加到第三个元素上，以此此类推，产生和。\n\
  \n我们当然可以在不用闭包的情况下写 sum\n\n```dart\nsum(nums) { // 糟糕 get\n  plus(a,b) => a + b;\n\
  \  nums.reduce(plus);\n}\n```\n\n这稍微冗长一些，并且我们需要为加法函数命名。在加法的情况下，名称是显而易见的，但在类似下面的示例中，声明并命名函数会变得越来越麻烦：\n\
  \n点击此处查看代码图片\n\n```dart\ncountry.cities.where((city) => city.population > 100000);\n\
  ```\n\n这可能找到了 `country` 中人口超过百万的所有城市。此代码段使用了 `where()` 方法，这是 `Iterable` 的另一个接受函数参数的方法。在这种情况下，参数必须是一个元谓词，`where()`\
  \ 将返回符合谓词的元素。\n\n## 4.5 调用方法和函数\n\n函数可以通过标准方式调用，即在函数后带有圆括号参数列表，例如 `print('Hello,\
  \ brave world')`。\n\n某些函数（获取器）可以在没有参数列表的情况下调用：\n\n`true.runtimeType`\n\n正如我们之前讨论过的，获取器和设置器的统一使用为我们提供了表示无关性的属性。然而应该注意，与某些支持表示无关性的语言不同，Dart\
  \ 并没有完全遵循统一引用原则。在 Dart 中，人们并不通过统一语法引用方法和字段。虽然获取器和字段被对待方式确保了表示无关性，但获取器和方法是通过不同的语法访问。因此，Dart\
  \ 程序员需要注意函数是声明为获取器还是无参方法。设置器的情况类似。\n\n### 4.5.1 级联\n\n除了正常使用点运算符进行成员选择外，Dart 还支持使用双点运算符进行\
  \ `method cascades（方法级联）。当我们需要对给定对象执行一系列操作时，级联非常有用。\n\n级联的评估与普通方法调用一样，不同在于它的结果不是方法返回的值，而是方法的接收者。\n\
  \n点击此处查看代码图片\n\n```dart\n\"Hello\".length.toString(); // 求值为 '5'\n\"Hello\"..length.toString();\
  \ // 求值为 \"Hello\"\n```\n\n因此，而不是\n\n点击此处查看代码图片\n\n```dart\nvar address = new Address.of(\"\
  Freddy Krueger\");\naddress.setStreet(\"Elm\", \"13a\");\naddress.city = \"Carthage\"\
  ;\naddress.state = \"Eurasia\";\naddress.zipCode(66666, extend: 66666);\naddress;\n\
  ```\n\n我们可以写一个单一表达式\n\n点击此处查看代码图片\n\n```dart\nnew Address.of(\"Freddy Krueger\"\
  )\n  ..setStreet(\"Elm\", \"13a\")\n  ..city = \"Carthage\"\n  ..state = \"Eurasia\"\
  \n  ..zipCode(66666, extend: 66666);\n```\n\n\n\n\n级联（Cascades）不仅仅是为了节省几次击键。它们允许在不预先规划的情况下创建流畅的\
  \ API。在没有级联的情况下，方法必须设计为始终返回接收者（receiver），以便进行链式调用。有了级联，我们可以在独立于 API 中单个方法的返回值的情况下，实现链链的效果。\n\
  \n仔细格式化级联非常重要，以确保代码的可读性。不应该通过在单行放置一系列级联或过度嵌套来滥用级联语法。\n\n在处理所谓的构建器 API（builder APIs）时级联非常有用，在这种情况下，描述符是分步创建的，但被描述的对象在构建过程结束时一次性创建。\n\
  \n级联的另一个用途是当我们想要调用对象的某个方法并获取原始目标，但该方法返回了其他结果时。如果我们写：\n\n```\nvar sortedColors =\
  \ ['red', 'green', 'blue', 'orange', 'pink'].sublist(1, 3).sort();\n```\n\n我们会发现\
  \ `sortedColors` 是 `null`，因为 `sort()` 是 void 类型。我们可以重新排列代码：\n\n```\nvar colors =\
  \ ['red', 'green', 'blue', 'orange', 'pink'].sublist(1, 3);\ncolors.sort();\n```\n\
  \n但直接使用级联要好得多：\n\n```\nvar sortedColors = ['red', 'green', 'blue', 'orange', 'pink'].sublist(1,\
  \ 3)..sort();\n```\n\n### 4.5.2 赋值\n\n这可能并不明显，但 Dart 中的赋值通常是函数调用，因为对字段的赋值是调用 setter\
  \ 方法的语法糖（sugar）。\n\n像 `v = e` 这样的赋值的精确含义取决于 `v` 的声明。如果 `v` 是局部变量或参数，它只是旧式的赋值。否则，赋值是调用名为\
  \ `v=` 的 setter 的语法糖。\n\n赋值是否有效取决于 setter `v` 是否定义，或者变量 `v` 是否为 `final`。`final`\
  \ 变量不能重新赋值，且不会产生 setter。\n\n复合赋值（如 `i += 2`）根据普通赋值定义。更多细节请参见第 6.1.6 节。\n\n### 4.5.3\
  \ 使用运算符\n\nDart 支持用户运算符，例如为 `Point` 定义的 `+` 运算符。Dart 中的用户定义运算符实际上是使用特殊名称且在用时具有特殊语法的实例方法。此类方法的声明必须带有内置标识符\
  \ `operator` 前缀。\n\n除了语法之外，所有适用于实例方法的规则适用于运算符。允许的运算符集合是：`<`, `>`, `<=`, `>=`, `==`,\
  \ `-`, `+`, `/`, `~/`, `*`, `%`, `|`, `^`, `&`, `<<`, `>>`, `[]=`, `[]`, `~`。\n\n\
  此外，还有许多不能由程序员定义的固定运算符。这些是 `&&`、`||` 以及增减运算符 `++` 和 `--`（包括前缀和后缀）。\n\n赋值在这些目的上不被视为运算符，尽管复合赋值在语义上依赖于运算符。\n\
  \n标识性（Identity）在 Dart 中也不是运算符。相反，Dart 提供了预定义函数 `identical()`。\n\n运算符的优先级规则是固定的，并遵循既定约定。它们的元（arity）也是如此。大多数运算符是二元的。显著的例外是一元减和\
  \ `[]=`。后者用于类似于向数组或映射（或任何索引集合）赋值的情况，并需要两个参数：一个索引和一个新值。`-` 的情况是特殊的，因为我们同时支持二元和一元减操作。\n\
  \n### 4.6 函数类\n\n`Function` 是一个抽象类，作为所有函数的通用父类接口。`Function` 没有声明任何实例方法。但它确实声明了类方法\
  \ `apply()`，该方法接收一个函数和一个参数列表，并使用提供的参数调用该命名的函数。\n\n`apply()` 的签名如下：\n\n```dart\n\
  static apply(Function function,\n  List positionalArguments,\n  [Map<Symbol, dynamic>\
  \ namedArguments]\n);\n```\n\n你会注意到 `apply()` 的形式参数带有类型注解。它需要一个要调用的函数和一个位置参数列表（可能是空的）。命名参数可以通过一个从名称到实际参数的映射（map）提供，这些参数可以是任何类型的对象。最后一个参数是可选的。大多数函数不接受任何命名参数，因此如果不需要提供它们，将很方便。\n\
  \n`apply()` 方法提供了一种使用动态确定参数列表调用函数的机制。通过这种方式，我们可以处理在编译时未知元数的参数列表。\n\n#### 4.6.1 模拟函数\n\
  \n如前所述，面向对象编程的一个核心原则是，重要的是对象的行为而不是它的出处。理想情况下，任何对象都应该模拟任何其他对象。例如，`Proxy` 的实例被设计为模拟任意对象的行为。由于函数是对象，我们也应该能够模拟它们的行为。我们如何用\
  \ `Proxy` 模拟函数呢？函数最常见且重要的行为是它被调用时的行为，但调用是一个内置操作。我们希望能够写：\n\n```\nvar p = new Proxy((x)\
  \ => x*2);\np(1); // 我们想要 2\n```\n\n幸运的是，上面的代码按预期工作，尽管我们到为止讨论的内容都没有解释为什么。\n\n事实证明函数应用翻译为对名为\
  \ `call()` 的特殊方法的调用。所有真函数都隐含地支持 `call()` 方法，其签名与声明的函数相同，其效果是执行函数。在示例中，`p(1)` 实际上是\
  \ `p.call(1)`。当然，我们不能将 `p.call(1)` 视为 `p.call.call(1)`，否则会无限递归。\n\n由于 `Proxy` 没有\
  \ `call` 方法，将调用 `noSuchMethod()`，并将调用转发给代理的目标，后者由于是函数，拥有自己的 `call()` 方法。\n\n任何声明了\
  \ `call()` 方法的类都被认为隐含实现了 `Function`。\n\n注意 `Function` 没有声明 `call()` 方法。原因是没有一个它可以声明的特定签名：`call()`\
  \ 可以有不同的元，并且可能带有可选参数（无论是位置还是命名的）以及不同的默认值。因此，`Function` 中确实没有可以列出的通用 `call()` 。相反，`call()`\
  \ 方法被语言特殊对待。\n\n### 4.7 作为对象的函数\n\nDart 是纯面向对象的语言，因此 Dart 中的所有运行时值都是对象，包括函数。除了上一节描述的\
  \ `call()` 方法外，函数还支持 `Object` 中声明的方法。\n\n大多数情况下，函数原样继承 `Object` 的方法。函数在 `toString()`\
  \ 的实现方面具有某些自由度。它们通常会产生函数的合理描述，可能包括其签名。\n\n由于 `==` 和 `hashCode` 的实现通常是继承的，两个函数只有在它们完全相同时才被认为是相等的。做到这一点很难，因为函数之间通用语义相等的概念是不可判定的。\n\
  \n我们如何知道两个函数是相同的？让我们来看一些例子。\n\n```dart\ncomputeIdentityFunction() {\n  return (x)\
  \ => x;\n}\n```\n\n\n\n我们是否假设 `computeIdentityFunction()` 的两次不同调用会产生相同的结果？答案是否定的。虽然在这种情况下函数是相同的似乎是“显而易见”的，但实际上，每次评估函数表达式时都可能分配一个不同的函数对象。同样，局部函数声明会在包含它的每个动态作用域中引入一个新的对象。例如，考虑下面代码中的局部函数\
  \ `increment`。\n\n```dart\nmakeCounter() {\n  var counter = 0;\n  increment() =>\
  \ ++counter;\n  return increment;\n}\n```\n\n每次调用 `makeCounter()` 都会返回一个不同的 `increment`\
  \ 函数。在这种情况下，显然我们不想要同一个函数对象，因为每个对象都绑定到了不同的 `counter` 变量。\n\n顶层或静态函数声明可以被命名，且该名称始终指向同一个对象。\n\
  \n然而，在某些情况下，我们可以做得更好。Dart 特殊地处理通过属性提取（property extraction）得到的闭包。如果（且仅当！）两个表达式 `o[1]`\
  \ 和 `o[2]` 评估为同一个对象（即 `o[1]` 和 `o[2]` 是恒等的），那么 Dart 将确保对于给定的标识符 `m`，如果 `o[1].m`\
  \ 是合法的，则 `o[1].m == o[2].m`。\n\n作为一个示例，考虑向 DOM 注册监听器函数的典型 UI 代码。我们希望在注册一个函数后能够取消注册该函数。如果我们注册一个普通闭包作为监听器：\n\
  \n```dart\nmyElement.onClick.listen((event) => listener(event));\n```\n\n我们稍后无法通过如下的调用来注销它：\n\
  \n```dart\nmyElement.removeEventListener('onClick', (event) => listener(event));\n\
  ```\n\n因为我们传递给 `removeEventListener()` 的闭包与我们注册的那个不是同一个。尽管它们看起来一样，但每一个都是一个不同的对象，而且没有通用的方法可以判断两个不同的函数对象是否相等。我们必须存储监听器，以便稍后使用它来注销。然而，使用属性提取：\n\
  \n```dart\nmyElement.onClick.listen(myObject.listener);\n```\n\n注销将按预期工作：\n\n```dart\n\
  myElement.removeEventListener('onClick', myObject.listener);\n```\n\n`noSuchMethod()`\
  \ 的实现继承自 `Object`，`runtimeType` 也是如此。在 Dart 运行时可以使用各种类来表示函数。所有这些类都实现了 `Function`，但人们无法可靠地期望不同函数的运行时类型之间保持等效性或标识性。\n\
  \n```dart\nf(x) { return (x) => x;}\n\ng() {\n  h() => 42;\n  h.runtimeType is Function;\
  \ // true\n  h.runtimeType == (() => 42).runtimeType; // 不要依赖于这个\n  g.runtimeType\
  \ == h.runtimeType; // 或者依赖这个\n  (() => 42).runtimeType == (() => 42).runtimeType;\
  \ // 甚至是这个！\n}\n\nmain(){\n  f.runtimeType is Function; // true\n  f(3).runtimeType\
  \ is Function; // true\n  g.runtimeType is Function; // true\n  f(2).runtimeType\
  \ == f.runtimeType; // 可能也许也可能不\n  f.runtimeType == g.runtimeType; // 不可能，因为参数个数不同，但不\n\
  }\n```\n\n如上面的代码所示，无法确定任何两个函数的运行时类型是否相同。人们可以依赖的是它们都实现了 `Function`。当然，相等的函数具有相同的运行时类型。\n\
  \n```dart\nf(x) { return (x) => x;}\ng() {\n  h() => 42;\n  h.runtimeType == h.runtimeType;\
  \ // true\n  var x = (() => 42);\n  x.runtimeType == x.runtimeType; // true\n}\n\
  \nmain(){\n  f.runtimeType == f.runtimeType; // true\n  g.runtimeType == g.runtimeType;\
  \ // true\n}\n```\n\n### 4.8 生成器函数\n\nDart 支持 `generators`（生成器），它们是用于生成集合中值的函数。生成器可以是同步的（`synchronous`）或异步的（`asynchronous`）。同步生成器为产生迭代器提供了语法糖，而异步生成器对流做了相同的工作。在这里我们将关注同步生成器。我们将对异步生成器的讨论推到第\
  \ 8 章，该章将处理所有异步内容。\n\n#### 4.8.1 迭代器与可迭代\n\n`Iterators`（迭代器）是允许按顺序遍历集合的对象，且仅此此。如果人们想要懒性（lazily）产生集合的内容，迭代器会特别方便。支持通过迭代器进行的集合被称为\
  \ `iterables`（可迭代对象）。可迭代对象必须有一个返回迭代器的 `iterator` get 属性。`for-in` 循环可以在任何可迭代对象上操作。\n\
  \n迭代器和可迭代对象的接口分别由 `Iterator` 和 `Iterable` 类规范化。\n\n产生迭代器是公式化的。人们需要定义一个可迭代集合类，特别是必须定义其返回（显然是）迭代器的\
  \ `iterator`  get 属性。这反过来又要求你定义一个迭代器类，其中包含一个 `moveNext()` 方法。例如，这里提供了一种打印到 20 的自然数的一种极其痛苦的方法：\n\
  \n```dart\nclass NaturalsIterable {\n  var n;\n  NaturalsIterable.to(this.n);\n\
  \  get iterator => new NaturalIterator(n);\n}\n\nclass NaturalIterator {\n  var\
  \ n;\n  var current = -1;\n  NaturalIterator(this.n);\n  moveNext() {\n    if (current\
  \ < n) {\n      current++;\n      return true;\n    }\n    return false;\n  }\n\
  }\n\nnaturalsTo(n) => new NaturalsIterable.to(n);\n\nmain() {\n  for (var i in naturalsTo(20))\
  \ {\n    print(i);\n  }\n}\n```\n\n事实上，一个类型良好的示例会实现完整的 `Iterable` 接口，并且会长得多。\n\n\
  #### 4.8.2 同步生成器\n\n为了减少迭代器产生的样板代码，Dart 支持同步生成器。使用同步生成器消除了我们定义最基础迭代器所需的两个类的麻烦。我们可以通过对主体标记\
  \ `sync*` 修饰符来定义同步生成器函数：\n\n```dart\nnaturTo(n) sync* {\n  var k = 0;\n  while (k\
  \ < n) yield k++;\n}\n```\n\n调用时，该函数立即返回一个可迭代对象 `i`，从中获取一个迭代器 `j`。当有人调用 `j.moveNext()`\
  \ 时，函数体开始执行。进入循环后，执行 `yield` 语句，导致 `k` 增加，并将 `k` 的先前值添加到 `i` 中并挂起 `naturalsTo()`\
  \ 的执行。下一次调用 `moveNext()` 时，`naturalsTo()` 的执行从 `yield` 之后恢复。\n\n有更好的方法来实现这个特定的示例；当序列的元素根据自然数计算时，有一个方便的构造函数\
  \ `Iterable.generate()`，它接受一个整数 `n` 和一个函数 `f`，并产生一个表示序列 `f(0)` ... `f(n – 1)` 的可迭代对象：\n\
  \n```dart\nnaturalsTo(n) => new Iterable.generate(n, (x) => x);\n```\n\n然而，我们示例的目的是展示泛情况下定义迭代器所需的所有机制，以及\
  \ `sync*` 方法如何简化这些机制。\n\n理解生成器函数的主体在向其调用者返回结果后执行是非常重要的。人们自然会问 `return` 语句在生成器内部起什么作用？答案是\
  \ `return` 仅仅是终止生成器。\n\n\n\n\n## 2\n\n在某些情况下，`return` 可能不会导致执行终止，因为 `finally` 子句\
  \ (6.2.4) 改变了控制流。\n\n对于任何返回值的处理没有任何疑问。在生成器（generator）中，不能让 `return` 语句返回值；此类语句会被编译器标记为错误。由于值已经返回给了调用者，且调用者已经完成处理并从调用栈中消失，允许此类语句是没有意义的。\n\
  \n尽管函数体在函数向调用者返回结果后仍在运行，但函数体仍与结果相关并与之交互。在同步生成器中，结果始终是一个可迭代对象。生成器始终与该可迭代对象以及其派生的迭代器相关联。\n\
  \n同步生成器内部的 `yield` 语句会将对象附加到关联的可迭代对象上，然后如上所示挂起函数体。函数体的执行和恢复始终通过对关联迭代器调用 `moveNext()`\
  \ 来触发。当 `yield` 挂起函数体时，`moveNext()` 向调用者返回 `true`。当生成器终止时，`moveNext()` 返回 `false`。\n\
  \n### 4.9 相关工作\n\n函数作为一等值在编程语言中拥有悠久且辉煌的历史。探索使用此类函数值作为基础构建组件的函数式语言空间远远超出了本书的范畴。\n\
  \n将函数视为对象的概念可以追溯到 Smalltalk [1]，其块（blocks）是 Dart 闭包的前身。Smalltalk 块最初受到各种限制，但这些限制在现代方言中已被移除。\n\
  \nDart 函数与其在 Smalltalk 语言族中的祖先们之间的一个关键区别在于闭包内部 `return` 的行为。Smalltalk 支持*非本地返回*（non-local\
  \ returns*），这意味着在闭包内执行的 `return` 会退出外围的方法，返回到该方法的调用者。因此，可以将控制结构定义为接受函数作为参数的库函数。这在\
  \ Dart 中是不可能的。由于底层 Web 平台的实现限制，Dart 遗憾地决定避免非本地返回。更多细节请参阅 6.2.8。\n\n值得注意的是，Scala\
  \ [15] 也支持非本地返回。\n\n### 4.10 总结\n\nDart 函数像 Dart 中所有其他运行时值一样都是对象。Dart 函数可以声明为接受位置参数或命名参数。位置参数可以是必需的或可选的。命名参数始终是可选的。\n\
  \n函数始终具有词法作用域并对其环境进行闭包化。然而，由于 `return` 的语义，Dart 函数并不适用于实现用户定义的控制结构。\n\nDart 同时支持函数作为类中的方法以及作为独立结构存在。方法可以与实例关联（实例方法），也可以与类关联（类方法）。独立函数可以在可以在库级别声明（顶层函数）、作为其他函数内部的局部函数声明，或者通过字面量表达式进行声明。\n\
  \n所有内置运算符也是函数，其中大多数被定义为实例方法，并可以被程序员重写。用户定义的类可以通过实现特殊方法 `call` 来定义，使其行为像内置函数类型一样。所有的\
  \ Dart 函数都被视为 `Function` 类型的成员。\n\n# 第 5 章 类型\n\n到目前，我们还没有详细讨论过类型。我们之所以能够将讨论推到现在，是因为\
  \ Dart 是可选类型化的。在这一章中，我们将描述 Dart 的类型，填补我们目前所陈述故事中的许多空白。我们首先解释可选类型，这可能是 Dart 最不寻常的特征。\n\
  \n### 5.1 可选类型\n\n如引言所述，一个语言当且仅当满足以下条件时，它是可选类型的：\n\n- 类型在语法上是可选的。\n- 类型对运行时语义没有影响。\n\
  \n后一点比前一点重要得多。习惯了传统静态类型语言的人起初可能会感到困惑。这一点虽然微妙但至关重要。它是 Dart 设计的基石。\n\n首先，Dart 能够作为动态类型语言使用至关重要的；任何可以用此类语言编写的程序都应该能够在\
  \ Dart 中表达。我们期望代码会随着时间的推移而进化，获得类型注解。如果类型注解改变了 Dart 程序的行为，那么随着类型注解的添加，良好的程序很可能会停止按预期运行。这会阻碍人们使用类型注解，因为程序员会担心良好的代码会发生故障。\n\
  \n此外，Dart 程序通常包含已类型化的部分和未类型化的部分。这意味着人们不能假设类型安全，也不能假设类型注解实际上是正确的。在这种情况下，允许类型注解具有语义意义可能会导致混惑和不稳定。\n\
  \n作为一种运行时行为取决于类型的语言特征的示例，请考虑基于类型的方法重载。重载是静态类型面向对象语言的常见特征。在这样的语言中，人们可能会写出\n\n点击此处查看代码图像\n\
  \n```dart\nclass NotLegalDart {\n  overloaded(List l)=> l.length;\n  overloaded(num\
  \ n) => n*2;\n}\n```\n\n并期望调用根据参数的类型进行解析：\n\n点击此处查看代码图像\n\n```dart\nint x = 3;\n\
  new NotLegalDart().overloaded(x); // 假设为 6\n\nList l = [];\nnew NotLegalDart().overloaded(l);\
  \ // 假设为 0\n```\n\n现在，我们该如何处理\n\n点击此处查看代码图像\n\n1？有些人可能会认为我们应该根据参数的动态类型来选择方法。这种被称为*多方法*（multi-methods）的机制有其自身的问题，超出了讨论范围。\n\
  \n假设我们进一步为 `overloaded` 添加一个“通用”变体：\n\n```dart\nclass NotLegalDart {\n  // ...同上\n\
  \  overloaded(x) => x;\n}\n```\n\n在这种情况下，我们的第二组调用将解析到通用版本，但如果我们决定为变量注解类型，行为就会在我们决定调用处发生改变。\n\
  \n基于类型的重载即使在完全静态类型的情况下也是一个问题。由于类型不影响 Dart 的语义，该语言不支持基于类型的重载。因此，我们展示的所有示例行为将保持相同，即使给它们装饰了类型注解。\n\
  \n作为另一个示例，考虑点击此处查看代码图像\n\n```dart\nclass LazyFields{\n  var _x;\n  get x => _x ==\
  \ null? _x = complicatedFunction() : _x;\n}\n```\n\n在这里我们有一个相当常见的实例延迟初始化场景。现在假设我们决定指定\
  \ `_x` 的类型：\n\n点击此处查看代码图像\n\n```dart\nclass LazyFields{\n  int _x;\n  get x => _x\
  \ == null? _x = complicatedFunction() : _x;\n}\n```\n\n在许多语言中，变量类型会影响其默认值。通常会将整数变量初始化为\
  \ 0。遗憾的是，在这种情况下代码将停止工作。\n\n\n\n\n\n### 5.2 类型概览\n\nDart 变量可能与其关联的类型。类型也可以用于指示方法的返回类型。例如\n\
  \n点击此处查看代码图像\n\n```dart\nint sum(int a, int b) => a + b;\n\nvoid main(){ print(sum(3,4));}\
  \ // 打印 7\n```\n\n当然，正如我们在前面的章节中反复看到的那样，我们可以编写不带类型的代码。这里有一段非常相似的代码，区别在于缺少了类型注解：\n\
  \n点击此处查看代码图像\n\n```dart\nsum(a, b) => a + b;\n\nmain(){ print(sum(3,4));} // 打印\
  \ 7\n```\n\n这两个变体的行为完全相同。人类阅读者从类型注解提供的文档中获益，但运行时并不关心。\n\n开发工具（如交互式开发环境 IDE）可以以多种方式利用类型注解：它们可以对可能的不一致发出警告，可以通过显示可能适用于表达式的方法菜单（名称补全）或通过支持基于类型信息的自动代码重构等方式来帮助程序员。\n\
  \n上面的简单示例没有包含错误，因此很容易看出这两个变体的行为是相同的。假设我们稍微修改一下\n\n点击此处查看代码图像\n\n```dart\nvar i;\n\
  \nvar j = 0;\n\nsum(a, b) => a + b;\n\nmain(){ print(sum(i, j));} // NoSuchMethodError\n\
  ```\n\n由于 `i` 没有被初始化，它的值是 `null`。当我们执行 `sum` 时，我们最终在 `null` 上调用了 `+` 方法。由于 `+` 没有由\
  \ `Null`（即 `null` 的类）定义，我们得到了一个 `NoSuchMethodError`。在某些语言中，你可能会得到空指针错误，但我们知道在 Dart\
  \ 中，`null` 与所有值一样都是对象，因此它可以响应如 `==` 等方法。\n\n下面的带类型版本在运行时的行为完全相同。正如上面讨论的那样，`i` 被标记为\
  \ `int` 事实并没有改变它的初始化方式。\n\n点击此处查看代码图像\n\n```dart\nint i;\n\nint j = 0;\n\nint sum(int\
  \ a, int b) => a + b;\n\nmain(){ print(sum(i, j));} // NoSuchMethodError\n```\n\n\
  代码失败了，尽管它是类型正确的。这在现实中是非常常见的。如果仅仅通过类型检查就能可靠地确保现实程序的正确性，那么真正的静态类型编程语言将具有巨大的经济优势，并且实际上是解决所有软件\
  \ Bug 的“银弹”。\n\n我们最新的变体确实包含错误，但它是类型安全的。让我们来看一个不是类型安全的版本：\n\n点击此处查看代码图像\n\n```dart\n\
  int i;\n\nint j = 0;\n\nObject sum(Object a, Object b) => a + b; // 类型警告：a 没有方法\
  \ '+'\n\nmain(){ print(sum(3, 4));} // 打印 7\n```\n\n这个版本运行良好，就像我们的前两个变体一样。然而，类型警告是完全合理的。根据类型注解，像下面这样的调用\n\
  \n点击此处查看代码图像\n\n```dart\nsum(new Object(), []); // NoSuchMethodError\n```\n\n本应该是有意义的，但显然它不是。`sum`\
  \ 的类型注解是错误的，但实际程序中的逻辑是正确的。由于类型注解无法影响语义，因此可以拥有错误的注解但仍然拥有一个有效的运行程序。\n\n`sum()` 上的类型注解并没有表面看起来那么荒谬。\n\
  \n点击此处查看代码图像\n\n```dart\nsum('ab', 'surd'); // 结果为 'absurd'\n```\n\n事实证明 `sum()`\
  \ 是一个适用于任意数量类型的很有用函数。任何定义了 `+` 方法的对象都是合理的。将参数标记为类型 `Object` 似乎是合适的，因为 `Object` 是所有这些不同类型的共同父类型。正如我们所看到的，事实并非如此。\n\
  \n在这种情况下最佳做法是完全避免在 `sum()` 上使用类型注解。这避免了极端的类型警告。如果程序中的变量没有显式给出类型，则变量的类型为 `dynamic`。`dynamic`\
  \ 类型是一种特殊类型，表示类型检查器不应该对变量的操作或对变量的读写赋值发表意见。\n\n相比之下，显式使用类型 `Object` 意味着我们确实认为任何对象都是变量的有效值。两种情况看似相似，但当我们操作类型为\
  \ `Object` 的表达式时，如果我们尝试使用并非所有对象都支持的方法，将会获得警告。相比之下，使用类型 `dynamic` 实际上完全消除了静态类型检查。它告诉类型检查器我们相信自己知道做什么。这在许多情况下非常有用，当无法确定准确的类型时。\n\
  \n在 `sum()` 上显式使用 `dynamic` 是如其荒谬。这种类型的类型注解没有传递给类型检查器或人类任何信息。\n\n点击此处查看代码图像\n\n\
  ```dart\ndynamic sum(dynamic a, dynamic b) => a + b; // 永远不要这样做！\n```\n\n然而，这种写法是多余且风格很差。它没有向类型检查器或人类传递任何信息。\n\
  \n为了更好地理解类型及其用法，让我们回到我们的老朋友 `Point`：\n\n点击此处查看代码图像\n\n```dart\nclass Point {\n \
  \ num x, y;\n  Point(this.x, this.y);\n  Point scale(num factor) => new Point(x\
  \ * factor, y * factor);\n  Point operator +(Point p) => new Point(x + p.x, y +\
  \ p.y);\n  static num distance(Point p1, Point p2) {\n    num dx = p1.x - p2.x;\n\
  \    num dy = p1.y - p2.y;\n    return sqrt(dx * dx + dy * dy);\n  }\n}\n```\n\n\
  这个版本完全带有类型。注意我们使用了 `num` 而不是 `int` 或 `double`。我们选择 `num` 是它可以处理两种类型（或混合）。\n\n你也可以看到使用初始化形式的简写构造函数没有类型注解。参数的类型源自实例变量声明，因此没有重复。\n\
  \n### 5.3 接口类型\n\nDart 类型是接口类型。它们定义了对象上可用的方法。通常，它们没有告诉我们关于对象的实现的任何信息。再次，这符合基本原则：重要的是对象的行为，而不是血缘。\n\
  \n令人惊讶的是，Dart 没有接口声明的语法。接口是通过类引入的。每个类根据其成员引入一个隐式接口。需要传统接口声明的情况可以通过定义纯抽象类来轻松处理。\n\
  \n任何类都可以实现接口，即使它与定义接口的类没有关系。这就是 Dart 中不需要接口声明的原因。我们在 第 2.7 节 中见过这样一个类 `Pair`。\n\n\
  ```dart\nabstract class Pair {\n  get first;\n  get second;\n}\n```\n\n我们可以声明 `Pair`\
  \ 定义接口的实现\n\n点击此处查看代码图像\n\n```dart\nclass ArrayPair implements Pair {\n  var _rep;\n\
  \  ArrayPair(a, b) {\n    _rep = [a, b];\n  }\n  get first => _rep[0];\n  get second\
  \ => _rep[1];\n}\n```\n\n`ArrayPair` 类实现了 `Pair` 而不是它的子类。`implements` 子句后面跟着该类旨在实现的一个或多个接口名称。\n\
  \n类没有从 `implements` 子句命名的接口继承任何实现。在这个特定的示例中，没有可以继承的实现，但在许多情况下这种区别至关重要。\n\n\n\n\n\
  `implements` 子句的作用是在类与该子句列出的接口之间引发一种显式的子类型关系。这种子类型关系会影响 Dart 类型检查器的行为以及运行时的行为。\n\
  \n为了观察 `implements` 子句诱导的子类型关系的影响，让我们写一个处理对（pairs）的函数：\n\n点击此处查看代码图片\n\n```\nPair\
  \ reversePair(Pair p) => new ArrayPair(p.second, p.first);\n```\n\n我们可以这样使用 `reversePair()`：\n\
  \n点击此处查看代码图片\n\n```\nreversePair(new ArrayPair(3, 4)); // 一个新的 Pair，first = 4，second\
  \ = 3\n```\n\nDart 类型检查器对这段代码非常满意。然而，如果我们省略了 `implements` 子句，类型检查器将不知道 `ArrayPair`\
  \ 是 `Pair` 的子类型。在这种情况下，它将对 `reversePair()` 的定义和使用都报错。在 `reversePair()` 的定义处，它会警告我们返回的类型为\
  \ `ArrayPair`的对象并不是声明的返回类型 `Pair` 的子类型。在调用处也会发出类似的通知，因为实际参数的类型是 `ArrayPair`，而形式参数的类型是\
  \ `Pair`。\n\n类型检查器会在对象从一个变量传递到另一个变量的每个点执行此类检查。这些值传递发生在：\n\n• 执行赋值操作时。\n• 向函数传递实际参数时。\n\
  • 从函数返回结果时。\n\n`implements` 子句提供的每个接口都被视为该类的 `直接父接口`（`direct super-interface`）。在我们的示例中，`Pair`\
  \ 是 `ArrayPair` 的直接父接口。此外，类的直接父类也被认为是该类的直接父接口之一。\n\n一个类型的完整 `父接口`（`superinterfaces`）集合可以通过获取直接父接口集，并递归地计算和添加每个接口的父接口来完成。当无法向集合中添加新元素时，计算即完成。\n\
  \n严格来说，类型检查器在检查值传递时并不强制执行父接口关系。检查的是`赋值性`（`assignability`）。赋值性比子类型更宽松。Dart 认为如果类型在*任意方向*上是子类型，则它们是可赋值的。也就是说，不仅\
  \ `ArrayPair` 可以赋值给 `Pair`（因为 `ArrayPair` 是 `Pair` 的子类型），而且 `Pair` 赋值给 `ArrayPair`。后者的规则可能会让你感到困惑。毕竟，`Pair`\
  \ 可能有许多实现类，而它们通常不具备 `ArrayPair` 的所有成员。为了理解为什么 Dart 采取这样做，让我们来看另一个例子。\n\n点击此处查看代码图片\n\
  \n```\nclass Monster {\n  // 许多怪物特征\n}\n\nclass Vampire extends Monster {\n  get\
  \ bloodType => 'O';\n}\n\nMap<String, Monster> monsters = {\n  'Frankenstein' :\
  \ new Monster(),\n  'Godzilla' : new Monster(),\n  'Dracula' : new Vampire()\n}\n\
  \n...\n\nVampire vamp = monsters['Dracula'];\n```\n\n怪物映射 `monsters` 只保证包含 `Monster`\
  \ 的实例。典型的类型检查器会抱怨上面最后一行的查找结果是 `Monster`，它不是 `Vampire` 的子类型。\n\n在实践中，当我们在怪物映射 `monsters`\
  \ 中查找键 `'Dracula'` 时，我们知道我们将得到 `Vampire`。这种情况经常发生。使用传统的类型检查规则将迫使使用强制转换（casts）。给程序员施加这样的负担与\
  \ Dart 使用类型作为工具来改进开发者体验的哲学背道而驰。相反，Dart 的赋值性规则支持隐式向下转型。\n\n当然，这意味着 Dart 的类型系统是不完备的（unsound）。我们无法保证一个通过类型检查的\
  \ Dart 程序实际上完全没有运行时错误。然而，正如我们在上面的导览中提到的，实际上没有静态类型系统可以做到这一点。通常，类型系统能够强制的属性被定义为其范畴的一部分，而它无法强制的属性则被归到其他地方。一个经典的例子是函数式语言中的模式匹配，它将某些属性的强制定义在静态类型系统之外。\n\
  \n正如我们将在第 5.5 节中将看到的，Dart 类型检查不完备还有其他原因。\n\n### 5.4 运行中的类型：表达式问题，类型化\n\n为了更好地理解\
  \ Dart 中的类型，让我们重新回顾表达式问题（expression problem），这是我们在第 2.15.1 节中首次遇到的。我们想对原始的解决方案进行类型检查。\n\
  \n我们从为评估器添加类型信息开始。在类型检查评估器时，我们需要知道加法和减法的 mixin 具有支持 `int` 值的 `eval()` 方法的字段，因此我们用类型\
  \ `ExpressionWithEval` 标注字段。我们仍然没有依赖其他库（当然除了 `dart:core`）。例如，我们不需要知道 `ExpressionWithEval`\
  \ 是否真的是 `Expression` 的子类型。\n\n我们还想保证数字的 mixin 有一个类型为 `int` 的字段 `val`，并且所有的 `eval`\
  \ 方法返回整数。\n\n点击此处查看代码图片\n\n```\nlibrary evaluator;\n\nabstract class ExpressionWithEval\
  \ {\n  int get eval;\n}\n\nabstract class AdditionWithEval {\n  ExpressionWithEval\
  \ get operand1;\n  ExpressionWithEval get operand2;\n  int get eval => operand1.eval\
  \ + operand2.eval;\n}\n\nabstract class SubtractionWithEval {\n  ExpressionWithEval\
  \ get operand1;\n  ExpressionWithEval get operand2;\n  int get eval => operand1.eval\
  \ - operand2.eval;\n}\n\nabstract class NumberWithEval {\n  int get val;\n  int\
  \ get eval => val;\n}\n```\n\n然而，当为 `multiplication evaluator` 添加类型时，我们发现需要添加导入，因为我们必须访问\
  \ `ExpressionWithEval` 类型。类型代码依赖原始的评估器并不意外，但遗憾的是我们不再能独立编译它们。\n\n点击此处查看代码图片\n\n```\n\
  library multiplication evaluator;\n\nimport 'evaluator.dart' show ExpressionWithEval;\n\
  \nabstract class MultiplicationWithEval {\n  ExpressionWithEval get operand1;\n\
  \  ExpressionWithEval get operand2;\n  int get eval => operand1.eval * operand2.eval;\n\
  }\n```\n\n`string converter` 库的代码标注方式与 `evaluator` 类似：\n\n点击此处查看代码图片\n\n```\nlibrary\
  \ string converter;\n\nabstract class ExpressionWithConversion {\n  String toString();\n\
  }\n\nabstract class AdditionWithConversion {\n  ExpressionWithConversion get operand1;\n\
  \  ExpressionWithConversion get operand2;\n  String toString() => '$operand1 + $operand2';\n\
  }\n\nabstract class SubtractionWithConversion {\n  ExpressionWithConversion get\
  \ operand1;\n  ExpressionWithConversion get operand2;\n  String toString() => '$operand1\
  \ - $operand2';\n}\n\nabstract class NumberWithConversion {\n  int get val;\n  String\
  \ toString() => '$val';\n}\n\nabstract class MultiplicationWithConversion {\n  ExpressionWithConversion\
  \ get operand1;\n  ExpressionWithConversion get operand2;\n  String toString() =>\
  \ '$operand1 * $operand2';\n}\n```\n\n\n\n那些向表达式层级结构引入新函数的库并不依赖于核心类层级结构，这意味着无论我们是否选择为核心类层级结构添加类型注解，都可以为这些库标注类型。因此，喜欢类型检查的程序员即使原始层级结构的设计者完全没有使用类型，也可以向系统添加新函数并对它们进行类型检查。\n\
  \n现在让我们为类层级结构中的字段标注类型。这需要我们导入类型 `Expression`。\n\n点击此处查看代码图像\n\n```dart\nlibrary\
  \ abstract expressions;\n\nimport 'expressions.dart' show Expression;\n\nabstract\
  \ class AbstractExpression{}\n\nabstract class AbstractAddition {\n\n Expression\
  \ operand1, operand2;\n\n AbstractAddition(this.operand1, this.operand2);\n\n}\n\
  \nabstract class AbstractSubtraction {\n\n Expression operand1, operand2;\n\n AbstractSubtraction(this.operand1,\
  \ this.operand2);\n}\n\nabstract class AbstractNumber {\n\n int val;\n\n AbstractNumber(this.val);\n\
  }\n\nlibrary multiplication;\n\nimport 'expressions.dart' show Expression;\n\nabstract\
  \ class AbstractMultiplication {\n\n Expression operand1, operand2;\n\n AbstractMultiplication(this.operand1,\
  \ this.operand2);\n\n}\n```\n\n对 `expressions` 库的依赖比 `multiplication evaluator`\
  \ 对 `evaluator` 的依赖更令人不悦。我们最初完全独立于最终应用程序库定义了我们的核心层级结构。添加类型似乎让我们的代码模块化程度降低了。我们将在下一节讨论泛型时，查看如何在保留类型的同时获得理想的解耦。\n\
  \n最后，让我们为主库添加类型。我们需要做的唯一更改是为局部变量 `e` 标注类型 `Expression`。库的其余部分保持不变。\n\n点击此处查看代码图像\n\
  \n```dart\nmain(){\n\n Expression e = new Multiplication(\n\n                  \
  \             new Addition(new Number(4), new Number(2)),\n\n                  \
  \                   new Subtraction(new Number(10), new Number(7))\n           \
  \  );\n print('$e = ${e.eval}');\n\n}\n```\n\n总来说，为我们的表达式代码添加类型是非常直接的。唯一真正的问题是，所有对\
  \ `Expression` 及其子类的使用都必须根据 mixin 应用中定义的类型进行类型检查。为了解决这个问题，我们需要更复杂的类型：泛型。\n\n###\
  \ 5.5 泛型\n\nDart 类可以是*泛型*——也就是说，它们可以由类型参数化。\n\n泛型类可以赋予实际的类型参数：\n\n```dart\nList<String>\
  \ l;\n\nMap<String, int> m;\n```\n\n这类类型被称为*参数化类型*。\n\n然而，并不要求为泛型类提供类型参数。如果选择使用不带类型参数的泛型类名，类型\
  \ `dynamic` 将隐式地替换所有缺失的类型参数。因此，你可以写：\n\n```dart\nList l;\n\nMap m;\n```\n\n这完全等同于\n\
  \n```dart\nList<dynamic> l;\n\nMap<dynamic, dynamic> m;\n```\n\n显然，更简洁的形式更受青。在代码中填充没有传递新信息的类型是一种是不良好的风格。但在某些情况下，显式编写类型\
  \ `dynamic` 是理想的，例如：\n\n```dart\nMap<String, dynamic> m;\n```\n\n如果提供的类型参数数量错误，所有的类型参数将被忽略。\n\
  \n```dart\nMap<String> m; // Map\n\nList<String, num> // List\n\nObject<int> //\
  \ Object\n```\n\n上述三个示例将分别导致静态警告。除了警告之外，上述内容分别被视为 `Map`、`List` 和 `Object`，如上述所述，它们等同于\
  \ `Map<dynamic, dynamic>`、`List<dynamic>` 和 `Object<dynamic>`。\n\n假设我们有\n\n点击此处查看代码图像\n\
  \n```dart\nclass Fruit {\n\n  var color;\n\n  Fruit(this.color);\n}\n\nclass Apple\
  \ extends Fruit {\n\n  Apple():super('Red');\n}\n\nclass Orange extends Fruit {\n\
  \n  Orange():super('Orange');\n}\n\n// 打印列表中所有水果的颜色\n\nprintColors(List<Fruit> fruits)\
  \ {\n\n  for (Fruit f in fruits) print(f.color);\n}\n\nmain() {\n\n  List<Apple>\
  \ apples = <Apple>[];\n\n  List<Orange> oranges = new List<Orange>();\n\n  apples.add(new\
  \ Apple());\n\n  oranges..add(new Orange())\n         ..add(new Orange());\n\n \
  \ printColors(apples); // 打印一次 Red\n\n  printColors(oranges); // 打印两次 Orange\n}\n\
  ```\n\n有两个类，`Apple` 和 `Orange`，它们都是 `Fruit` 的子类。我们有一个简单的函数 `printColors`，它接收一个 `List<Fruit>`\
  \ 并打印每个成员的颜色。\n\n\n\n```dart\nabstract class MultiplicationWithEval<E extends ExpressionWithEval>\
  \ {\n  E get operand1;\n  E get operand2;\n  int get eval => operand1.eval * operand2.eval;\n\
  }\n```\n\n同样地，字符串转换的 mixins 应该将 `E` 限制 `Expression-WithStringConversion`：\n\n点击此处查看代码\n\
  \n```dart\nlibrary string converter;\n\nabstract class ExpressionWithStringConversion\
  \ {\n  String toString();\n}\n\nabstract class AdditionWithStringConversion<E extends\
  \ ExpressionWithStringConversion> {\n  E get operand1;\n  E get operand2;\n  String\
  \ toString() => '$operand1 + $operand2';\n}\n\nabstract class SubtractionWithStringConversion<E\
  \ extends ExpressionWithStringConversion> {\n  E get operand1;\n  E get operand2;\n\
  \  String toString() => '$operand1 - $operand2';\n}\n\nabstract class NumberWithStringConversion\
  \ {\n  int get val;\n  String toString() => '$val';\n}\n\nabstract class MultiplicationWithStringConversion<E\
  \ extends ExpressionWithStringConversion> {\n  E get operand1;\n  E get operand2;\n\
  \  String toString() => '$operand1 * $operand2';\n}\n```\n\n最后，我们必须修改 `expressions`\
  \ 来实例化所有的泛型类型。\n\n点击此处查看代码\n\n```dart\nlibrary expressions;\n\nimport 'abstractExpressions.dart'\
  \ show\n      AbstractAddition,\n      AbstractExpression,\n      AbstractNumber,\n\
  \      AbstractMultiplication,\n      AbstractSubtraction;\nimport 'evaluator.dart'\
  \ show\n      AdditionWithEval,\n      ExpressionWithEval,\n      MultiplicationWithEval,\n\
  \      NumberWithEval,\n      SubtractionWithEval;\nimport 'multiplication.dart';\n\
  import 'multiplicationEvaluator.dart';\nimport 'stringConverter.dart' show\n   \
  \   AdditionWithStringConversion,\n      ExpressionWithStringConversion,\n     \
  \ MultiplicationWithStringConversion,\n      NumberWithStringConversion,\n     \
  \ SubtractionWithStringConversion;\n\nabstract class Expression = AbstractExpression\
  \ with\n      ExpressionWithEval, ExpressionWithStringConversion;\n\nclass Addition\
  \ = AbstractAddition<Expression> with\n      AdditionWithEval<Expression>,\n   \
  \   AdditionWithStringConversion<Expression>\n      implements Expression;\n\nclass\
  \ Subtraction = AbstractSubtraction<Expression> with\n      SubtractionWithEval<Expression>,\n\
  \      SubtractionWithStringConversion<Expression>\n      implements Expression;\n\
  \nclass Number = AbstractNumber with\n      NumberWithEval, NumberWithStringConversion\n\
  \      implements Expression;\n\nclass Multiplication =\n  AbstractMultiplication<Expression>\
  \ with\n      MultiplicationWithEval<Expression>,\n      MultiplicationWithStringConversion<Expression>\n\
  \      implements Expression;\n```\n\n到此，我们表达式问题（expression problem）的讨论结束。请记住，扩展一组类型变体及其函数的问题是通用的，这里显示的模式对许多与表达式无关的应用程序都有帮助。对于感兴趣深入研究的人，强烈推荐参考\
  \ Torgersen [8] 以及 Zenger 和 Odersky [9] 的论文。\n\n### 5.6 函数类型\n\n函数类型在 Dart 中被特殊处理。所有函数都实现了\
  \ `Function`，但函数类型是根据其结构进行比较的。\n\n函数的类型基于其返回类型以及形式参数的类型。该类型反映了参数是命名的还是位置的、位置参数是否必选，以及命名参数的名字。\n\
  \n在编写本文时，Dart 还没有表示函数类型的语法，因此我们在这里引入一种特殊的表示。在简单的情况下，函数接收 `n` 个位置参数，且所有参数都是必选的。\n\
  \n\n\n\n回想一下，函数类型子类型规则后的直觉是基于对于高阶函数 `h` 的函数值参数 `g`，什么情况下构成一个有效的调用。对于普通（非函数）对象，参数传递受赋值规则限制，该规则允许双向的子类型转换。因此，当使用实际参数调用\
  \ `g` 时，它们的类型只需要可赋值给 `g` 的形式参数即可。任何参数都必须具有可赋值给相应的 `S[i]` 的类型，因此它必须可赋值给 `T[i]`。换句话说，该参数可以是\
  \ `T[i]` 的子类型，也可以是 `T[i]` 的超类型。因此，如果 `T[i]` 是 `S[i]` 的子类型或 `S[i]` 的超类型，都是可以的。我们因此假设，如果\
  \ `T` 可赋值给 `S` 且 `T[i]` 可赋值给 `S[i]`，则 `F[t]` 是 `F[s]` 的子类型。\n\n到目前为止良好。上述规则虽然是不健全的（unsound），但非常宽松。违反该规则的程序员确实可能传递了一个其参数类型与形式参数完全无关的函数。\n\
  \n我们仍然需要考虑到可选和命名参数。\n\n#### 5.6.1 可选位置参数\n\n作为第一步，让我们扩展函数类型的表示法，以适应可选位置参数。一个函数可能有\
  \ `k` 个可选位置参数。我们将它们写在必需参数之后，放在方括号内，反映了函数签名中使用的语法：`(*T[1], . . . , T[n], [T[n][+1],\
  \ . . . , T[n][+]*[k]*]) → T`。\n\n我们可以安全地将一个接受可选参数的函数传递到要求这些参数的上下文中。该函数可以接受它们。相反的情况是不可接受的。一个要求某些参数的函数不能在这些参数被视为可选的上下文中，因为这些参数实际上可能没有提供。子类型必须能够接受至少与超类型相同数量的参数。然而，子类型的参数并不需要都是必需参数；事实上，即使它们中一个不是必需的也是可以的。\n\
  \n这引导我们得到了实际规则：\n\n函数类型 `F[t] = (*T[1], . . . , T[n], [T[n][+1], . . . , T[n][+]*[k]*])\
  \ → T` 是函数类型 `F[s] = (*S[1], . . . , S[j], [S[j][+1], . . . , S[m]]) → S` 的子类型，当仅当：\n\
  \n1. `j n` 且 `m n + k`。\n2. `∀i ! Image 1..m, T[i]` 可赋值给 `S[i]`。\n3. `S` 为 `void`\
  \ 或 `T` 可赋值给 `S`。\n\n子类型要求 `n` 个参数，而超类型有 `j` 个必需参数。当类型为 `F[t]` 的函数 `f[t]` 在需要类型\
  \ `F[s]` 的地方时，它至少会被传递 `j` 个参数。由于 `F[t]` 需要 `n` 个参数，第一项确保了 `j n`，因此 `f[t]` 保证能获得所需的参数数量。可能传递的最大参数数量是\
  \ `m`，即 `F[s]` 的参数总数。函数 `f[t]` 最多接受 `n + k` 个参数——`n` 个必需和 `k` 个可选。只要 `m` 不大于 `n\
  \ + k`，传递的参数数量 `f[t]` 就可以接受。实际参数的类型必须可赋值给 `f[t]` 的形式参数。由于实际上最多只会发送 `m` 个实际参数，我们只需要前\
  \ `m` 个参数类型的赋值性。\n\n最后一项是一个我们迄为止忽略的转折。Dart 允许你识别不打算返回结果的函数。可以使用特殊的返回类型 `void` 进行标记。如果\
  \ `F[s]` 返回 `void`，类型检查器假设结果没有使用，因此它没有意义。\n\n#### 5.6.2 命名参数\n\n命名参数如何？同样，让我们为命名参数函数的类型引入一些表示法。我们在大括号之间描述命名参数，类似于\
  \ Dart 的 map 字面量，同样反映了函数签名中使用的具体语法。命名参数出现在位置参数之后。每个命名参数将由一个类型后跟其名称表示。\n\n作为一个具体的例子，我们将查看\
  \ `Iterable` 的 `firstWhere()` 方法。\n\n点击此处查看代码图片\n\n```\nE firstWhere(bool test(E\
  \ value), {E orElse()});\n```\n\n其类型为 `((*E) → bool, {() → E orElse}) → E`。\n\n\
  `firstWhere()` 方法接受谓词作为参数，就像 `where()` 一样。它不是返回谓词成立的结果集合，`firstWhere()` 只是简单返回第一个这样的元素。\n\
  \n`firstWhere()` 的一个近亲是 `lastWhere()`，它返回谓词成立的最后一个元素。\n\n点击此处查看代码图片\n\n```\nE lastWhere(bool\
  \ test(E value), {E orElse()});\n```\n\n因此，带有命名参数的函数的通用形式是 `(*T[1], . . . , T[n],\
  \ {T[n+1], . . . , T[m]}) → T`。这里我们没有提到可选参数。\n\n函数类型 `F[t] = (*T[1], . . . , T[n],\
  \ {T[n+1], . . . , T[m]}) → T` 是函数类型 `F[s] = (*S[1], . . . , S[j], {S[j+1], . .\
  \ . , S[k]}) → S` 的子类型，当仅当：\n\n1. `S` 为 `void` 或 `T` 可赋值给 `S`。\n2. `∀i ! Image 1..j,\
  \ T[i]` 可赋值给 `S[i]`。\n3. `n ≥ j` 且 `m ≥ k`。\n\n#### 5.6.3 重新回顾 Call()\n\n在第 4.6.1\
  \ 节中，我们提到任何声明特殊方法 `call` 的类都隐含实现了 `Function`。现在我们可以完善对 `call` 的理解。\n\n假设我们定义一个 map\
  \ 类，将其限制为字符串到数字。\n\n点击此处查看代码图片\n\n```\nclass MapFunction implements Map<String,\
  \ num> {\n  MapFunction(this._map);\n  Map<String, num> _map;\n  num operator [](String\
  \ k) => _map[k];\n  void operator []= (String k, num v) { _map[k] = v;}\n\n  //\
  \ 更多 map 函数\n  num call(String key) => _map[key];\n}\n```\n\n`MapFunction` 类的实例通过将\
  \ map 对象传递给类构造函数来创建。该类将 `Map` 接口中的所有调用转发给它封装的 map 对象。此外，`call` 方法接受一个对象，将其作为键查找底层\
  \ map 并返回查找结果。\n\n\n\n\n虽然类型注解在运行时并不存在，但类型的其他方面是存在的。正如我们已经看到的，每个对象都携带了其 `runtime\
  \ type`（运行时类型），可以通过从 `Object` 继承的 `runtimeType` 方法进行动态访问。用户可以自由地重写 `runtimeType`，这意味着通常情况下，对象的实现类型无法通过调用\
  \ `runtimeType` 来观察。\n\n每个类型声明都会引入一个代表 `Type` 类的编译时常量对象，用于表示该类型。这些对象在运行时也是可用的。此外，可以通过动态类型测试和类型转换来测试一个对象是否是某个类型的成员，如下所示。\n\
  \n### 5.7.1 类型测试 (Type Tests)\n\n类型测试是测试对象是否属于某个类型的表达式。\n\n点击此处查看代码图像\n\n```\nvar\
  \ v = [1, 2, 3];\n\nv is List; // true\n\nv is Map; // false\n\nv is Object; //\
  \ 毫无意义：始终为 true\n```\n\n类型测试的通用形式是 `e is T`，其中 `e` 是一个表达式，`T` 是一个类型。类型测试评估 `e` 并测试结果的动态类型与类型\
  \ `T` 是否匹配。上述代码段的最后一行永远不应该出现在正常的 Dart 程序中。它将始终求值为 `true`，因为所有 Dart 值都是对象。\n\n由于\
  \ Dart 类可以实现一个无关的类型，即使对象的类不是 `T` 的子类，对象也可能模拟另一个类型 `T`。然而，对象无法完全隐藏其实现类型，因为人们可以使用类型测试来检测它。这可以说违背了“只有对象的行为才是重要的”这一原则。同样的论点对于下文描述的类型转换也适用。\n\
  \n### 5.7.2 类型转换 (Type Casts)\n\n类型转换也会评估一个表达式并测试结果对象是否属于某个类型，但它们不是谓词。相反，如果测试失败，转换将抛出\
  \ `CastError`；否则将原样返回对象。\n\n点击此处查看代码图像\n\n```\nObject o = [3, 4, 5];\n\no as List;\
  \ // 某种有开销的无操作\n\no as Map; // 抛出异常\n```\n\n转换几乎是下面代码的简写：\n\n点击此处查看代码图像\n\n```\n\
  var t = e;\n\nt is T ? t : throw new CastError();\n```\n\n转换的一个典型用途可能是验证数据。\n\n\
  点击此处查看代码图像\n\n```\nList l = readNextVal() as List;\n\n  // 我确信我会从 readNextVal()\
  \ 得到一个列表\n  // 如果不是，情况就真的糟了，我应该让失败\n  // 接下来，对列表进行操作\n```\n\n人们应该小心不要滥用转换。考虑以下：\n\
  \n点击此处查看代码图像\n\n```\nObject o = [5, 6, 7];\n\n... // 中间存在大量的逻辑\n\no.length; // 可以运行；类型警告：对象并不总是有\
  \ length\n```\n\n许多程序员可能忍不住将代码重写为：\n\n点击此处查看代码图像\n\n```\nObject o = [5, 6, 7];\n\
  \n... // 相同的中间逻辑\n\n(o as List).length; // 糟糕！避免警告的错误方法\n```\n\n转换是在运行时执行的，因此会带来运行时开销。如果你的目标仅仅是让类型检查器安静，只需使用赋值即可：\n\
  \n```\nObject o = [5, 6, 7];\n\n... // 相同的中间逻辑\n\nList l = o;\n\nl.length;\n```\n\
  \n上述代码之所以运行良好，是因为存在赋值规则 (5.3)。有些程序员可能对这种写法有异，因为他们发现很难不断为变量命名。一个简单的解决方案是在变量名后添加转换语法的变体：\n\
  \n```\nObject o = [5, 6, 7];\n\n... // 相同的中间逻辑\n\nList o_as_List = o;\n\nl.length;\n\
  ```\n\n### 5.7.3 检查模式 (Checked Mode)\n\n在开发过程中，验证变量的类型通常非常有用。例如，我们希望确保传入参数或调用返回的对象符合预期。Dart\
  \ 提供了 `checked mode`（检查模式）来实现此目的。在检查模式下，每次值传递都会经过动态检查。这意味着每当传递参数、从方法或函数返回结果以及每次执行赋值时，系统都会自动为你执行动态类型测试。检查模式确保赋值给变量的动态值是该变量静态类型的成员。同样，实际参数的动态类型会与形式参数的静态类型进行测试，函数结果的动态类型也会与函数声明的返回类型进行测试。\n\
  \n点击此处查看代码图像\n\n```\nnum n = 3.0;\n\nint i = n; // 检查模式下的动态错误；运行时正常\n\nnum x = i;\
  \ // 始终允许\n\nint j = null; // 始终允许\n```\n\n上述代码之所以运行良好，是因为赋值规则 (5.3) 允许在两个方向上存在子类型关系。有些程序员可能对这种写法有异，因为他们发现很难不断为变量命名。一个简单的解决方案是在变量名后添加转换语法的变体：\n\
  \n```\nObject o = [5, 6, 7];\n\n... // 相同的中间逻辑\n\nList o_as_List = o;\n\nl.length;\n\
  ```\n\n### 5.7.4 实例化泛型 (Reified Generics)\n\n泛型在运行时是实例化的。当实例化泛型类时，提供的实际类型参数实际上会被传递并存储。因此，使用\
  \ `List<String>` 创建的实例与通过 `List<Object>` 创建的实例实际上不同。\n\n我们可以这样写：\n\n```\nvar l =\
  \ new List<String>();\n\nl is List<String>; // true\n\nl is List<int>; // false\n\
  ```\n\n但必须理解 Dart 中此类测试的局限性。由于类型系统是不安全的（unsound），无法硬性一个声称是 `List<int>` 的对象只包含整数。我们可以确定它是一个列表，并且它它是作为整数列表创建的。然而，随后可能会向其中插入任何类型的对象。\n\
  \n在检查模式下，我们有了更多的信心。任何通过向列表插入不适当对象的尝试都会被拦截。因此，考虑到 `List` 定义了 `operator [int index]=\
  \ (E e)`，当人们写下：\n\n```\nvar l = new List<String>();\n\nl[0] = 'abc'; // 始终允许\n\n\
  l[1] = 42; // 检查模式失败 - 42 是 int，不是 String 的子类型\n```\n\n检查模式将确保泛型实例的使用不会被破坏。\n\n\
  ### 5.7.5 实例化与可选类型 (Reification and Optional Typing)\n\n可选类型是如何与类型实例化相关的？特别是可选类型不应该影响运行时语义，但实例化显然产生了影响。然而，实例化只有在程序显式尝试观察或确定运行时类型结构时才会产生影响。这些情况包括：\n\
  \n\n\n\n\n-   通过类型测试、强制转换或调用 `runtimeType` 来获取对象的类型。\n-   通过向泛型类型的构造函数传递实际类型参数，设置对象的运行时类型。\n\
  -   使用反射来检查或设置变量或函数的类型。\n-   使用检查模式（checked mode）。\n-   通过函数签名上的注解来确定函数对象的具体化类型（reified\
  \ type）。\n\n最后三点都可能受到类型注解的影响，而类型注解通常没有语义影响。在这些点中，最后一点可能是最微妙的。如果逻辑依赖于涉及函数的类型测试，那么它可能会受到类型注解的影响。该函数可以是一个显式定义的闭包，也可以作为提取出的属性。以下代码演示了该问题：\n\
  \n点击此处查看代码图片\n\n```\ntypedef int IntFunction(int);\n\nobserveAnnotations(f) {\n\
   return f is IntFunction;\n}\n\nString id1(String x) => x;\n\nid2(x) => x;\n\nint\
  \ id3(int x) => x;\n\nobserveAnnotations(id1); // false\n\nobserveAnnotations(id2);\
  \ // true\n\nobserveAnnotations(id3); // true\n```\n\n三个函数 `id1`、`id2`、`id3` 除了类型注解外完全相同，但由于使用的类型注解不同，它们在类型测试方面的表现有所不同。当然，我们已经在显式地执行类型测试了，因此在这种情况下类型对行为产生影响并不令人意外。\n\
  \n### 5.7.6 类型与代理\n\n能够为任何类型的对象定义透明代理是一项重要属性。在代理化与类型化之间存在着内在的张力。考虑我们在第 2.10 节中引入的通用代理类\
  \ `Proxy`。\n\n假设代理正在模拟类型 `Point`。我们遇到的第一个困难是当我们使用 `Proxy` 的实例作为类型变量或参数的值时。\n\n点击此处查看代码图片\n\
  \n```\nPoint pointProxy = new Proxy(new Point(0,0)); // warning\n```\n\n由于 `Proxy`\
  \ 既不是 `Point` 的子类型也不是超类型，该代码会导致警告。最佳解决方案是将 `proxyPoint` 声明为动态类型变量。\n\n点击此处查看代码图片\n\
  \n```\nvar pointProxy = new Proxy(new Point(0,0));\n```\n\n当然，到此时我们已经丢失了类型检查的某些优势。如果我们想对对\
  \ `pointProxy` 的使用进行类型检查，我们需要另一种方法。似乎我们只需要添加：\n\n```\nPoint pointImposter = pointProxy;\n\
  ```\n\n但事实证明这是不够的。虽然这消除了静态警告，但我们会在动态类型检查中遇到麻烦。如果我们编写以下任何代码：\n\n点击此处查看代码图片\n\n```\n\
  pointImposter is Point; // false!\n\npointImposter as Point; // exception!\n```\n\
  \n我们对代理对象是点的伪装将被暴露。虽然我们可能选择放弃类型检查并避免这些情况，但在现实中，我们可能不得不将 `pointProxy` 或 `pointImposter`\
  \ 传递给他人编写的、假设其作用于点的代码。在这种情况下，极可能会发生上述的动态测试。此外，在检查模式下运行时，一旦尝试将 `pointProxy` 或 `pointImposter`\
  \ 赋值、传递或返回到标记为类型 `Point` 的环境中，就会发生失败。\n\n点击此处查看代码图片\n\n```\nPoint pointProxy = new\
  \ Proxy(new Point(0,0)); // dies in checked mode\n```\n\n如果我们要进行任何类型的类型检查，我们需要定义一个*特定类型的代理*（type-specific\
  \ proxy）：\n\n点击此处查看代码图片\n\n```\nclass PointProxy extends Proxy implements Point\
  \ {\n  PointProxy(forwardee): super(forwardee);\n}\n```\n\n现在，我们可以可靠地使用我们的代理了：\n\
  \n点击此处查看代码图片\n\n```\nPoint pointProxy = new PointProxy(new Point(0,0));\n\npointProxy\
  \ is Point; // true!\n\npointProxy as Point; // identical to pointProxy\n```\n\n\
  等一下！`PointProxy` 中没有 `x, y, rho, theta, +` 等方法。我们难道不会收到 `PointProxy` 未正确实现 `Point`\
  \ 接口的警告吗？事实恰恰，Dart 有一条特殊规则允许我们抑制此类警告。如果一个类声明了 `noSuchMethod()`，那么就不会对支持接口的缺失成员给出投诉，也不会有关于此类成员签名不错误的警告。\n\
  \n对特定类型代理的需求是令人失望的。在这里，大部分工作由 `Proxy` 完成了，但我们仍然必须为每个接口定义子类。这种解决方案比定义一套详尽的转发方法要容易得多且更易维护（在传统的类型化设置中，你必须这样做），但它没有仅定义一个\
  \ `Proxy` 类那么简单。在完全动态的设置中，单个 `Proxy` 定义就足够了。\n\n我们考虑过几种替代方案。具有类型测试（包括检查模式）和可定义的行为将产生设计团队不愿承担的性能开销。\n\
  \n这个问题在实践中出现在 Dart 的单元测试框架中。框架定义了 `expectAsync()`，它接收一个异步函数并将其封装在代理中使其看起来是同步的。框架需要处理不同数量的函数。\n\
  \n一个务实的解决方案依赖于我们可以将涉及函数的数量限制在一个固定值 `n` 上。为了示例，假设 `n = 5`，但如果不够，可以选择 `n = 10` 或 `n\
  \ = 255`，任何值即可——原理相同。我们将忽略使用命名参数的可能性。在这种情况下，我们可以定义 `call` 接收五个可选参数。这使得我们的代理成为类型(`dynamic`,\
  \ `dynamic`, `dynamic`, `dynamic`, `dynamic`) !dynamic` 的成员，该类型是任何最多五个必需参数且没有命名参数的子类型。结果是代理对象不仅支持与目标相同的合法调用，而且在类型测试、强制转换和检查模式下运行都是安全的。\n\
  \n剩下的定义 `call` 方法中的代码以转发调用。我们的实现需要确定传递的正确参数数量。假设对代理函数的调用是正确的，我们需要确定实际传递了我们多少参数。\n\
  \n为了实现这一点，我们将每个参数的默认值设置为一个特殊的标记对象。由于 Dart 中的默认参数值必须是常量，因此该标记对象是一个编译时常量对象。然后我们可以方便地将参数列表定义为所有形式参数的列表字面量，并使用列表的\
  \ `removeWhere()` 方法过滤掉所有标记值。然后可以使用我们在第 4.6 节中首次看到的 `Function.apply()` 来转发调用。这里是必要的代码\n\
  \n点击此处查看代码图片\n\n```\nclass UnsentArgumentMarker{\n  const UnsentArgumentMarker();\n\
  }\n\nconst NO ARG = const UnsentArgumentMarker();\n```\n\n\n\n\n```\nclass ProxyForFunctionOfArity5\
  \ implements Function {\n\n  Function target;\n\n  ProxyForFunctionOfArity5(this.target);\n\
  \n  call([a0 = NO ARG, a1 = NO ARG, a2 = NO ARG, a3 = NO ARG, a4 = NO ARG]){\n \
  \   List args = [a0, a1, a2, a3, a4]..removeWhere((arg) => arg == NO ARG);\n   \
  \ return Function.apply(target, args);\n  }\n}\n```\n\n单元测试框架中的实际代码包含一些额外的逻辑来处理异步性，但这并不是我们关注的重点。我们可以通过其他方式过滤掉未发送的参数，但这段代码在效率略有牺牲的情况下是既优雅又简洁的。这里需要注意的是，我们如何模拟广泛的函数类型，以及确定哪些参数实际上被传递的技巧。\n\
  \nDart 的类型系统为代理提供了一项特殊的优待。注解 (7.3) `@proxy` 对类型系统具有特殊意义。如果一个类被标记为 `@proxy`，那么当在\
  \ true 类的实例上访问方法时，Dart 分析器将停止发出警告，即使该类在静态上不认为支持该方法。\n\n### 5.8 畸形类型\n\n如果我们用一个不存在的类型标注变量会发生什么？根据我们上面阐述的原则，除了检查模式（checked\
  \ mode）外，代码应该保持不变地运行。\n\n```\nUndefinedType v = 91;\n```\n\n假设 `UndefinedType` 确实未定义，Dart\
  \ 将发出一个警告。在检查模式下，当系统尝试检查 `int` 是否为 `UndefinedType` 的子类型时，对 `v` 的赋值会导致运行时错误。然而\n\n\
  ```\nUndefinedType v = null;\n```\n\n在运行时不会引起任何错误，因为当赋值给变量的值为 `null` 时，不会执行子类型测试。\n\
  \n未定义的类型可能由多种原因引起：拼写错误、遗忘导入或在实际定义类型之前提到了该类型。在某些情况下，类型注解中使用的名称可能表示函数或变量。在任何名称未表示实际类型声明的情况下，我们得到了一个*畸形类型*（malformed\
  \ type）。\n\n未定义的类型是畸形类型的一种特殊形式。歧义类型——由于在同一作用域内导入了同名的不同声明导致其意义不明确的类型——也是畸形的。\n\n\
  泛型也可能导致畸形类型。如果泛型本身是畸形的，那么对该泛型的任何调用都是畸形的：\n\n点击此处查看代码图像\n\n```\nUndefinedGeneric<int>\
  \ ugi; // 畸形\n\nUndefinedGeneric ug; // 畸形\n```\n\n最后，当类型变量在静态成员的声明中引用时，它们被认为是畸形的：\n\
  \n点击此处查看代码图像\n\n```\nclass C<T, S> {\n  static T cantReferToTypeVars; // 警告\n  static\
  \ S alsoCantReferToTypeVars(T t) { // 这里有两个警告\n    S local; // 另一个在这里\n    return\
  \ new Map[T, S](); // 这里的有两个\n  }\n}\n```\n\n类型变量对于泛型类的每个实例具有潜在不同的值。在不涉及实例时，它们没有意义。可以在静态成员声明中简单地将类型变量视为作用域外，但通过将它们视为在作用域内但畸形，Dart\
  \ 可以提供更好的错误信息。\n\n`cantReferToTypeVars` 的声明产生了一个警告，因为 `T` 是畸形的；它只在 `C` 的实例语境下才有意义。方法\
  \ `alsoCantReferToTypeVars` 将产生多个警告：它的返回类型 `S` 是畸形的，其形式参数的类型也是。局部变量 `local` 也引起了警告，而方法最后一条语句中\
  \ `Map` 的实例化为 `S` 和 `T` 产生了单独的警告。一旦对畸形类型的出现处发出了警告，静态类型检查器就会将该出现处替换为 `dynamic`，以防止无意义的次要警告级联。例如，如果我们调用\
  \ `alsoCantReferToTypeVars`，我们不会得到任何警告：\n\n点击此处查看代码图像\n\n```\nint i = C.alsoCantReferToTypeVars('abc');\n\
  ```\n\n向程序员倾倒不可操作的警告是没有意义的。无法通过更改变量 `i` 的类型或参数的类型来使调用正确。问题出在 `C.alsoCantReferToTypeVars`\
  \ 的声明处，而不是任何调用处。\n\n同样，上述 `Map<T, S>` 的实例化引起了 `T` 和 `S` 是畸形的警告，但并没有关于它们是 `Map` 的不适当类型参数的投诉。我们将畸形类型参数替换为\
  \ `dynamic`，从而产生了失败。\n\n点击此处查看代码图像\n\n```\nList<UndefinedType> l = [3]; // 警告\n\n\
  List<int> list = [3]; // 警告\n```\n\n在这里，`l` 的类型被认为是 `List<dynamic>`。在第二行中，情况反过来了。被赋值的对象是\
  \ `List<int>`，因为 `UndefinedType` 被替换为了 `dynamic`。\n\n### 5.9 不安全性\n\n我们现在可以回顾 Dart\
  \ 类型系统中不安全性的各种来源了。这些来源是：\n\n- 泛型的协变（5.3 和 5.5 中讨论了前两点。第三点实际上是前两者的产。函数类型在返回类型上自然是协变的，在参数类型上是逆变的。决定泛型使用协变的逻辑同样适用于函数类型。单此这一点就会让函数子类型成为不安全性的另一个来源。\n\
  \n此外，可赋值规则适用于所有的值传递，包括传递函数参数和返回函数结果，这决定了在第 5.6 节](#part0013.html_ch05lev1sec6) 中讨论的参数类型和返回类型使用可赋值性。\n\
  \nDart 的最后一个不安全来源是我们尚未讨论过的——库级别的 ADT 隐私与基于接口的类型的交互作用。为了理解这种交互作用，让我们看看上一章中栈示例的变体。在这个版本中，我们将实现一个\
  \ `Stack` 类，以便我们可以实例化多个栈：\n\n点击此处查看代码图像\n\n```\nlibrary stack3;\n\nclass Stack {\n\
  \  List _contents = [];\n  get isEmpty => _contents.isEmpty;\n  get top => isEmpty\
  \ ? throw 'Cannot get top of empty stack' : _contents.last;\n  get pop => isEmpty?\
  \ throw 'Cannot pop empty stack' : _contents.removeLast();\n\n  push(e) {\n    _contents.add(e);\n\
  \    return e;\n  }\n}\n\nclone(Stack s) {\n  Stack ns = new Stack();\n  ns. contents\
  \ = new List.from(s. contents);\n  return ns;\n}\n```\n\n\n\n\n\n我们添加了一个 `clone`\
  \ 函数，它接收一个栈并产生另一个内容相同的栈。这并不是一个好主意，但它符合我们此处的目的。一个应该引起警觉的事实是，`clone` 访问了其形式参数 `s`\
  \ 的私有变量 `contents`。在一种围绕抽象数据类型（ADTs）概念设计的语言中，这是非常自然的。在这样的语言中，类型系统确保了任何传入的参数都将是我们定义的\
  \ `Stack` 类的实例，因此也必然具有名为 `_contents` 的字段。\n\n而问题就在于此：Dart 并不是围绕抽象数据类型概念设计的。Dart\
  \ 是围绕接口（interfaces）的概念设计的。Dart 中的类型从不表示某种特定的实现类型。相反，它表示的是该类型的接口。任何人都可以实现 `Stack`\
  \ 类型，而且该实现可以与 `Stack` 类中定义的实现完全不同。特别是，该实现可能没有 `_contents` 字段。\n\n事实上，假设我们决定在另一个库中产生\
  \ `Stack` 的另一种替代实现。\n\n点击此处查看代码图片\n\n```dart\nlibrary stack4;\n\nimport 'stack3.dart'\
  \ as stack show clone, Stack;\n\nclass Stack4 implements stack.Stack {\n  final\
  \ List _array = [];\n\n  get isEmpty => _array.isEmpty;\n\n  get top => isEmpty\
  \ ? throw 'Cannot get top of empty stack' : _array.last;\n\n  get pop => isEmpty?\
  \ throw 'Cannot pop empty stack' : _array.removeLast();\n\n  push(e) {\n    _array.add(e);\n\
  \    return e;\n  }\n}\n\nmain() {\n  stack.clone(new Stack4());\n}\n```\n\n显然，当我们尝试访问传入参数中不存在的\
  \ `_contents` getter 时，`stack.clone()` 的调用将由于 `NoSuchMethodError` 而失败，因为该参数是 `Stack4`\
  \ 的实例，且确实没有这样的 getter。问题是，类型系统是否应该对这段代码报错。\n\n在一个基于 ADT 的系统中，我们可能会抱怨 `Stack4` 没有实现\
  \ `stack.Stack`，因为它缺少 `_contents` 访问器。这引发了几个困难：\n\n- 由于 `_contents` 对 `stack` 是私有的，它的存在绝不应该被其他库感知。特别是，在接口的实现者中生成警告是不可接受的。添加私有成员应该是类的纯粹内部决策。如果向类中添加私有成员会导致该类的实现者产生警告，那么这种操作将是不可能可能的。\n\
  \n- 抛开上述异议不谈，假设我们发布了警告又怎样？开发 `Stack4` 的开发者该做什么呢？在 `Stack4` 中定义 `_contents` 访问器并不能满足需求，因为它对\
  \ `stack4` 是私有的，无法在外部访问。`clone` 内部的调用将以完全相同失败。`stack3` 和 `stack4` 中的 `_contents`\
  \ 成员是不同的。简而言之，在 `stack3.Stack` 之外，没有人能实现一个实现 `stack3` 内部定义的访问器的 `_contents` getter。\n\
  \n另一种方法是在 `clone()` 内部报错。类型为 `Stack` 的变量不能可靠地假设它具有如 `_contents` 这样的私有访问器。遗憾的是，这意味着除了\
  \ `this` 之外，任何对象都永远无法使用私有实例成员。基于对象的封装强制了这种替代方案。正如我们在上一章中所讨论的，Dart 显式地拒绝了基于对象的封装。\n\
  \n事实上，任何地方都没有发出警告，因此系统再次是不完备的（unsound）。这种不完备性直接由于隐私规范是基于 ADT 的，而类型检查纯粹基于接口的。\n\n\
  Dart 为程序员提供了定义抽象数据类型的选项，在这种情况下，他们必须清楚地记录他们所定义的抽象类型不应被他人实现（尽管可以被子类扩展）。人们可以用这种风格定义单个抽象数据类型或若干种协作的类型。\n\
  \n或者，程序员也可以选择在优的基于接口的风格下工作，在这种情况下，私有成员应仅通过 `this` 访问，实际上遵循了基于对象的封装。\n\n### 5.10\
  \ 相关工作\n\n类型系统的僵化性引发了许多放宽它的尝试。在 Scheme 中，人们对软类型（soft-typing）进行了大量研究，这与类型推断相关。Racket\
  \ 中较新的努力混合了类型和未类型代码，但粒度相对粗糙。每个模块要么是有类型的，要么是未类型类型。跨越类型和未类型单元边界的数据会被动态检查。这些检查在某种程度上让人联想起受检模式（checked\
  \ mode）。\n\nDart 的可选类型方案与 Strongtalk [16] 开发的方案最为相关。然而，在 Dart 中，可选类型更紧密地集成在语言中。Strongtalk\
  \ 没有泛型化（reify generics），也没有受检模式。此外，警告是 IDE 的专属领域；编译完全独立于类型检查。最后，Strongtalk 有一个具有泛型声明侧变的完备类型系统。\n\
  \n*可选类型* 术语出现在 Common Lisp 的背景下，但表示的是某种不同的思想。类型被编译器视为有效的断言，编译器利用它们进行优化。然而，这些类型注解没有经过验证，使得系统从本质上是不安全的。Dart\
  \ 要求指针安全，且不允许实现信任类型注解。\n\nDart 混合了不完备泛型（unsound generics）和具体化，这很不寻常。Beta [17] 的影响是显而易见的，Beta\
  \ 中的泛用性也是协变的。然而，Beta 中的泛型并不是特殊特性，而是通过嵌套类型成员进行建模，因此是显式具体化的。相比之下，Java 和 C# 等主流语言使用了包含变声明的完备类型系统。在\
  \ Java 中，泛型不是具体的，变是基于用的；而在 C# 中，泛型是具体的，变是基于声明的。较旧的设计如 C++ 和 Modula-3 使用基于模板的扩展机制。\n\
  \n\n\n\n在 Dart 中，整数可以是任意大小的。然而，使用非常大的整数可能会相对昂贵。在某个特定的边界之外（该边界随实现方式而异），整数将无法直接利用底层的硬件表示。因此，对此类大整数的操作将变得变得昂贵得多。\n\
  \n实现层可以自由地使用各种类的实例来实现整数。唯一的要求是任何此类类都必须实现内置类 `int`。在实践中，可能会根据所表示的整数的大小使用不同的类。\n\n\
  当请求一个整数返回其 `runtimeType` 时，答案总是 `int`，这也就是静态检查器分配给整数字面量的类型。因此，发现整数的底层实现类的唯一方法是通过反射，正如下一章中讨论的那样。\n\
  \n如果两个整数对象表示相同的数学值，则它们被认为是恒等的。\n\n在编译为 JavaScript 的 Dart 实现中，会出现进一步的复杂性。在 JavaScript\
  \ 中，所有数字都表示为 IEEE 双精度浮点数（double）；没有整数。因此，在 JavaScript 之上实现整数语义是非常昂昂的。在这种实现上，当整数位于给定范围（绝对值约为\
  \ 2⁵³）之外时，它们将被近似。\n\n**[1]。** 人只能希望 JavaScript 在未来的某个时候“发现”整数。\n\n你不能定义 `int` 的子类，也不能让另一个类实现\
  \ `int`。这些限制是一种折中，允许 Dart 实现以牺牲“人们应该能够对任何类进行子类或实现”的原则来提供高性能。\n\n### 6.1.1.2 Double\n\
  \nDouble 是根据 IEEE 754 标准实现 64 位浮点数的对象。Double 是 `dart:core` 中 `double` 类的实例。\n\n\
  Double 的恒等规则与相等性规则细有不同。简单来说，如果表示浮点值的底层位模式相同，则两个 double 是恒等的。在大多数情况下，这意味着两个 double\
  \ 恒等且仅当它们相等时，但有两个例外：\n\n1. 双 `-0.0` 和 `0.0` 是相等的但不恒等的。\n2. NaN（非数字）与自身是恒等的，但不相等的。\n\
  \n你不能定义 `double` 的子类，也不能让另一个类实现 `double`。同样的规则也适用于 `num`，它是 `double` 和 `int` 的通用父类型。\n\
  \n### 6.1.1.3 Boolean\n\n恰好有两个布尔对象：`true` 和 `false`。它们是 `bool` 类的成员。\n\n与某些语言不同，不能将任意表达式强制转换为布尔值。如果你尝试写出\n\
  \n```dart\nvar x = someComputation();\n\nif (x) print(x.foo()); // 不要这样做！\n```\n\
  \n并期望语言会将非空值转换为 `true`，那么你会很失望的。记住，Dart 不欢迎内置强制转换。如果 `x` 是 `true`，则打印将如预期般执行。然而，如果\
  \ `x` 是任何其他对象，在生产模式下它将被视为 `false` 且不会打印任何内容。在检查模式下，它会失败。因此，最好的做法是在执行测试时编写正确的谓词：\n\
  \n```dart\nif (x != null) print(x.foo());\n```\n\n这让读者清楚地知道你实际上在测试什么，并且不依赖于可能产生很大问题的强制转换。当然，如果\
  \ `x` 确实是一个布尔值，那么写成完全没问题的：\n\n```dart\nif (x) print(x.foo());\n```\n\n简而言之，`true`\
  \ 是 Dart 中唯一的真理。\n\n你可能会问，鉴于我们对强制转换的公开反感，为什么还允许其他非布尔对象被视为 `false`？如果我们能确保 Dart 始终运行在\
  \ Dart VM 上，我们可能会在所有测试中强制使用布尔值。然而，考虑到编译为 JavaScript 的限制，坚持始终使用真实的布尔值成本太高。这是 Dart\
  \ 进行务实折中的的案例之一。\n\n你不能定义 `bool` 的子类，也不能让另一个类实现 `bool`。\n\n### 6.1.1.4 String\n\n\
  字符串字面量在 Dart 中有多种形式。它们可以用单引号或双引号界定：\n\n```dart\n'我引用: \"用单引号界定的字符串可以包含双引号\"'\n\"\
  我引用: '用双引号界定的字符串可以包含单引号'\"\n```\n\n通常，用户不需要记住使用哪种引号来界定字符串。两种方法都可以，这让语言更容易学习。此外，当字符串中出现引号时，如上面的示例所示，处理它们也更简单。自然地，分隔符必须匹配——例如，你不能用单引号开始字符串并用双引号结束。\n\
  \n```dart\n'一个无效的字符串\" // 非法！无法解析\n\"另一个无效的字符串' // 同样非法\n```\n\n普通字符串仅限于单行。如果你需要一个跨多行的字符串，可以使用多行字符串。多行字符串用三引号界定；同样，这些可以是三组单引号，也可以是三组双引号。\n\
  \n```dart\n\"\"\"我引用:\n\"用单引号界定的字符串\n可以包含双引号\"\n\n\"\"\"我引用:\n'用双引号界定的字符串\n可以包含单引号'\"\
  \"\"\n```\n\n还有另一种选择，即将你的字符串拆分成几部分并将各个部分写在一起：\n\n```dart\n' \"我引用: '用单引号界定的字符串\n\
  ''\n```\n\nDart 会隐式地拼接相邻的字符串。然而，生成的字符串不会跨多行。Dart 支持字符串内的多种转义序列。这些包括\n\n- `\\n` 换行。\n\
  - `\\r` 回车。\n- `\\f` 换页。\n- `\\b` 退格符。\n- `\\t` 制表符。\n- `\\v` 垂直制表符。\n- `\\u{*h*}`，其中\
  \ *h* 是十六进制数字序列，用于由 *h* 表示的 Unicode 标量。\n- `\\u*x[1]*x[2]*x[3]*x[4]}`，其中 *x[1]--*x[4]*\
  \ 是十六进制数字，是 `\\u{*x[1]*x[2]*x[3]*x[4]}` 的简写。\n- `\\x*x[1]*x[2]}`，是 `\\u{*x[1]*x[2]}`\
  \ 的简写。\n\n否则 `\\*k*` 等于 `k`。\n\nDart 字符串支持字符串插值。字符串插值允许在字符串字面量中嵌入 Dart 表达式，例如：\n\
  \n```dart\nprint('的值是 ${twice(2)}');\n```\n\n假设范围内有一个合理的 `twice()` 实现，它将打印 `的值是\
  \ 4`。可以看出，`$` 表示嵌入表达式的出现，它由大括号界定。嵌入表达式会被求值并调用其 `toString()` 方法，结果被插入到表达式所在的位置。如果表达式由单个标识符组成，可以省略大括号：\n\
  \n```dart\nvar roomNumber = 101;\nprint('欢迎来到房间 $roomNumber');\n```\n\n它打印 `欢迎来到房间\
  \ 101`。\n\n此外，Dart 支持原始字符串（raw strings）。原始字符串不支持转义序列；它们包含引号之间的原始内容。原始字符串有单行多行变体。原始字符串以\
  \ `r` 字符为缀。\n\n```dart\nprint(r'原始字符串 \\n'); // 打印: 原始字符串 \\n，没有换行\n```\n\n\n\n\n\
  与整数类似，字符串字面量可以通过各种类来实现，但除非通过反射，否则是无法发现的。对一个字符串字面量请求其运行时类型总是得到 `String`，这与静态检查器赋予字符串字面量的类型也是相同的。`String`\
  \ 类不能被用户代码子类或实现，就像 `int`、`double`、`num` 和 `bool` 一样。\n\nDart 将字符串表示为 UTF-16 代码单元的序列。Dart\
  \ 核心库包含了 `Runes` 类，它可以将字符串转换为 Unicode 表示形式。\n\n### 6.1.1.5 符号 (Symbols)\n\n符号用于表示程序中声明的名称。符号以井号\
  \ `#` 开头，后面跟着一个或多个用点分隔的标识符，或者一个操作符。以下是一些示例：\n\n点击此处查看代码图像\n\n`#MyClass` `#i` `#[]`\
  \ `#com.evil empire.forTheWin`\n\n以下是一些非法的符号：\n\n点击此处查看代码图像\n\n`#. ` `#..` `#++`\
  \ `#=` `#&=` `#||` `#&&` `#!=` `#! `\n\n上述所有都是不可用户定义的操作符。非用户定义操作符的集合包括：`^(2)`\n\n\
  **[2].** 为了创建没有字面量形式的符号，需要显式地调用 `Symbol` 类的构造函数。这些情况通常出现在反射代码中。除了列出的操作符外，还有一个著名的例子是一元减，为了反射目的它的名称为“unary-”。\n\
  \n- 赋值，包括基础赋值运算符和所有复合赋值运算符\n- 点，用于成员选择，以及双点，用于级联操作（cascades）\n- 不等号，它总是根据相等运算符定义的\n\
  - 通过 `!` 进行取反\n- 后置操作符：自增和自减\n- 逻辑布尔操作符\n\n自然而然，符号字面量的静态类型是 `Symbol`。\n\n### 6.1.1.6\
  \ 列表 (Lists)\n\n列表字面量通常写为由方括号分隔的逗号分隔的表达式系列。\n\n所有列表字面量都实现了 `List` 类的接口。将字面量 `[]`\
  \ 认为 `new List()` 的简写是方便的，将 `['a', 2, true]` 认为为以下内容的简写：\n\n```dart\nnew List()\
  \ ..\n      add('a')..\n      add(2)..\n      add(true);\n```\n\n严格来说，上面的解释并不准确，因为\
  \ Dart 的实现并不要求使用 `List` 类的工厂构造函数。然而，作为一种近似，我们并不远。\n\n`List` 是一个泛型类，因此人们可能会合理询问 `[1,\
  \ 2, 3]` 是否创建了一个 `List<int>`？它是否对应于：\n\n```dart\nnew List() ..\n      add(1)..\n\
  \      add(2)..\n      add(3);\n```\n\n或者对应于：\n\n```dart\nnew List<int>() ..\n \
  \     add(1)..\n      add(2)..\n      add(3);\n```\n\n答案（再次，仅作为教学目的近似）是前者。Dart 并不尝试从列表字面量的元素推断出更精确的类型。原因之一是在运行时执行此类类型推断是非常昂贵的。另一个原因是可选类型。\n\
  \n为了获得后版本，我们可以选择通过编写 `<int>[1,2,3]` 来显式提供类型参数。事实上，语法 `[e[1], ... , e[n]]` 确实是 `<dynamic>\
  \ [e[1], ... , e[n]]` 的简写。我们也可以将语法 `< T>[e[1], ... , e[n]]` 视为以下内容的近似：\n\n```dart\n\
  new List<T>() ..\n      add(e[1])..\n      ...\n      add(e[n]);\n```\n\n正如在第 6.1.4\
  \ 节中所示，通过保留字 `const` 前缀可以将列表字面量变为编译时常量。`const` 的使用与类型参数的使用是正交的。因此 `const[e[1], ...\
  \ , e[n]]` 精确是 `const <dynamic> [e[1], ... , e[n]]` 的简写，而 `const < T>[e[1], ...\
  \ , e[n]]` 则是以下内容的近似：\n\n```dart\nconst List<T>() ..\n      add(e[1])..\n      ...\n\
  \      add(e[n]);\n```\n\n### 6.1.1.7 映射 (Maps)\n\n映射字面量写为由大括号分隔的逗号分隔的键值对系列。在每对中，先写键，并用冒号与值隔开。所有映射字面量都实现了\
  \ `Map` 类的接口。将字面量 `{}` 认为 `new Map()` 的简写是方便的，将 `{'a': 2, 'c': true}` 认为为以下内容的简写：\n\
  \n```dart\nnew Map() ..\n      add('a')..\n      add(2)..\n      add(true);\n```\n\
  \n严格来说，上面的解释并不准确，因为 Dart 的实现并不要求使用 `Map` 类的工厂构造函数。然而，作为一种近似，我们并不远。`Map` 是一个泛型类，因此人们可能会合理询问\
  \ `{'a': 1, 'b': 2}` 是否创建了一个 `Map<String, int>`？它是否对应于：\n\n```dart\nnew Map() ..\n\
  \      add('a')..\n      add(1);\n```\n\n或者对应于：\n\n```dart\nnew Map<String, int>()\
  \ ..\n      add('a')..\n      add(1);\n```\n\n答案（再次，仅作为教学目的近似）是前者。Dart 并不尝试从映射字面量的元素推断出更精确的类型。原因之一是在运行时执行此类类型推断是非常昂贵的。另一个原因是可选类型。\n\
  \n为了获得后版本，我们可以选择通过编写 `<int>[1,2,3]` 来显式提供类型参数。事实上，语法 `[e[1], ... , e[n]]` 确实是 `<dynamic>\
  \ [e[1], ... , e[n]]` 的简写。我们也可以将语法 `< T>[e[1], ... , e[n]]` 视为以下内容的近似：\n\n```dart\n\
  new List<T>() ..\n      add(e[1])..\n      ...\n      add(e[n]);\n```\n\n映射字面量可以变为编译时常量，正如在第\
  \ 6.1.4 节中所示，通过在前面加上保留字 `const` 来。`const` 的使用与类型参数的使用是正交的。因此 `const[e[1], ... ,\
  \ e[n]]` 精确是 `const <dynamic> [e[1], ... , e[n]]` 的简写，而 `const < T>[e[1], ... ,\
  \ e[n]]` 则是以下内容的近似：\n\n```dart\nconst List<T>() ..\n      add(e[1])..\n      ...\n\
  \      add(e[n]);\n```\n\n### 6.1.1.8 函数\n\n函数字面量已经在第 4.4 节中讨论过。函数类型的规则在第 5.6 节给出。我们现在给出函数字面量的类型规则。函数字面量没有声明式返回类型的语法，因此函数字面量始终具有\
  \ `dynamic` 返回类型。函数字面量的参数类型以任何其他函数相同的方式确定。如果声明了类型，则使用类型，否则参数类型被视为 `dynamic`。根据参数类型以及它们是必选还是可选、位置还是命名的，可以确定明显的函数签名。示例：\n\
  \n点击此处查看代码图像\n\n```dart\n(x) => 2*x; // (dynamic) -> dynamic\n\n(num a, num b){\
  \ return a*b;} // (num, num) -> dynamic\n\n(String k, [Function f]) => m.putIfAbsent(k,\
  \ f); // (String, [Function]) -> dynamic\n```\n\n#### 6.1.2 标识符\n\nDart 中的标识符与大多数其他语言中的标识符非常相似。标识符可以是字符\
  \ A-Z、a-z 或 $ 开始。后续字符可以是上述任何字符或数字 0-9。\n\n标识符如其名，标识一个声明。它可以标识变量、函数或类型。标识符也可以表示一个库，但这样它不能单独在表达式中使用。\n\
  \n\n\n\n在评估标识符时，第一步是找到它所标识的声明。这涉及一个搜索声明的过程，从紧邻的持续域开始。如果没有找到匹配的声明（即其简单名称为我们正在搜索的标识符的声明），搜索将递归地在外层词法作用域中继续进行，直到到达外层库的顶层。如果我们找到了某个声明，我们对如何处理它就有了一些底绪；但可能没有找到任何声明。\n\
  \n对合适声明的搜索是由编译器静态完成的；一旦编译器知道涉及哪一个声明，它就会生成适当的代码在运行时进行评估。\n\n为了了解它是如何工作的，我们将查看下面这段略显刻意的代码：\n\
  \n点击此处查看代码图像\n\n```dart\nvar global = 0;\n\nvar shadowed = 1;\n\naFunction(x) =>\
  \ x*x + global + shadowed;\n\nclass AClass<T> {\n  static var aClassVariable = 2;\n\
  \  var anInstanceVariable = 3;\n  static var shadowed = 4; // 遮蔽了顶层变量\n\n  static\
  \ aClassMethod() {\n    print(shadowed); // 4\n    print(aClassVariable); // 2\n\
  \    print(anInstanceVariable); // error\n  }\n\n  aMethod(aParameter) {\n    var\
  \ aLocal = 5;\n    var anUnassignedLocal;\n    var shadowed = 6; // 遮蔽了静态变量\n  \
  \  localFunction(x) => 7;\n\n    {\n      var moreLocal = 8;\n      var shadowed\
  \ = 9; // 遮蔽了局部变量\n      moreLocalFunction(y) {\n        return moreLocal;\n   \
  \   }\n      print(global); // 0\n      print(shadowed); // 9\n      print(aFunction);\n\
  \      print(AnotherClass);\n      print(F);\n      print(AClass);\n      print(T);\n\
  \      print(aClassVariable); // 2\n      print(anInstanceVariable); // 3\n    \
  \  print(aMethod);\n      print(anotherMethod);\n      print(aParameter);\n    \
  \  print(localFunction);\n      print(aLocal); // 5\n      print(anUnassignedLocal);\
  \ // null\n      print(moreLocal); // 8\n      print(moreLocalFunction);\n    }\n\
  \    print(shadowed); // 6\n  }\n\n  anotherMethod() => 10;\n}\n\nclass AnotherClass{}\n\
  \ntypedef int F(int x);\n```\n\n最简单的例子是标识符 `moreLocal` 的评估。我们的搜索在紧紧接的外层作用域中找到了一个同名的声明，该声明引入了一个局部变量。标识符的评估结果为评估时存储在局部变量中的值——在我们的案例中，为\
  \ `8`。这显然得令人有些痛苦，但如果想完全理解这些规则，这是必要的。标识符 `aLocal` 的情况几乎完全相同；唯一的区别是我们需要在作用域链上向上爬一层才能找到相关的声明。`anUnasssignedLocal`\
  \ 的情况也一样，只是在后者情况下表达式的值将是 `null`，因为变量尚未被初始化，而前者的表达式评估结果为 `5`。\n\n评估 `aParameter`\
  \ 非常相似。名称 `aParameter` 是在作用域链再往上一层通过形式参数声明声明的，而且形式参数的值无疑会随着每次调用而变化。\n\n如果我们找到的声明并不表示一个变量怎么办？有几种可能性。声明可能表示一个函数；该函数可能是获取（Getter）或普通方法（它不能是赋值（Setter），因为\
  \ setter 的名称总是以 `=` 结尾，因此永远不是标识符）。\n\n如果标识符表示一个 getter，评估的结果就是调用 getter 的结果。如果它是静态或顶层\
  \ getter，我们调用它并返回结果。如果我们有一个实例 getter，我们会在 `this` 上调用该 getter。\n\n以标识符 `shadowed`\
  \ 为例。在 `aMethod` 内部，它首先在最内层的作用域中被评估，因此找到了最内层的声明，该变量的值 `9` 就是结果。在方法的最后阶段，我们在方法的最外层作用域中评估\
  \ `shadowed`，得到 `6` 的值。在类方法 `aClassMethod` 内部，我们再次引用了 `shadowed`。在这里，我们从方法作用域开始，沿着作用域链向上移动，直到到达类的静态作用域，该作用域为类变量\
  \ `shadowed` 定义了一个 getter。调用这个 getter 产生值 `4`。\n\n相比之下，在顶层函数 `aFunction` 内部，`shadowed`\
  \ 评估为 `1`，因为我们从 `aFunction` 的作用域开始搜索声明，向上到其形式参数的作用域，然后到库级作用域，在那里我们找到了一个隐式声明的合适的顶层\
  \ getter。这种情况对于 `global` 也是如此；当我们在 `aMethod` 内部评估 `global` 时，我们的搜索将遍历一系列嵌套作用域，直到到达库作用域。\n\
  \n如果标识符表示的声明是一个实例方法，那么我们将提取一个闭包，该包将在 `this` 的当前值上调用，正如 6.1.7 所示。\n\n库方法、类方法和局部函数都被被相同处理；结果是一个表示该函数/方法的函数对象\
  \ (4.7)。对于库方法或类方法，该对象是固定的；对于局部函数，每当我们进入定义它的作用域时都会创建一个新对象。\n\n另一种可能性是 `id` 指向一个类型声明——可以是类或\
  \ `typedef`。每个类和类型别名在 Dart 中都被具实例化（reified）为一个唯一的对象，这就是该情况下评估的结果。然而，该标识符也可能表示一个类型变量。在这种情况下，结果将是评估时类型变量的值——就像普通变量一样。类型变量的值是接收者的属性；任何给泛类的实例都是通过实际类型参数构造的，例如\
  \ `List<String>`。实际类型参数本身是一个与类型相关的对象（在本例中为 `String`），并成为相应类型参数的值。\n\n当然，情况可能会更复杂，正如我们在第\
  \ 5 章所示。例如，考虑当标识符表示泛类 `List` 时的情况。类型参数的默认值总是 `dynamic`，因此 `List` 表示类 `List<dynamic>`\
  \ 的类型对象。\n\n现在假设我们没有找到任何声明。这在完全正确的代码也会发生；我们可能正在引用自父类的成员。规则是，如果我们不在词法作用域中找到 `id`\
  \ 的声明，我们就像评估表达式 `this.id` 一样评估 `id`。\n\n当我们在 `aClassMethod` 内部引用实例变量 `anInstanceVariable`\
  \ 时可以看到这一点。然而，该变量（以及它的 getter）不在作用域内。该引用随后被解释为对 `this` 的 getter 调用。在实例方法中，这条规则效果良好，允许访问继承的成员。由于在类方法内部访问\
  \ `this` 是非法的，在我们的案例这是一个编译时错误。\n\n##### 6.1.2.1 保留字和内置标识符\n\n当然，标识符不能是保留字。以下代码永远无法正确解析：\n\
  \n```dart\nvar if;\n```\n\n\n\n并不是所有的 Dart 关键字都是保留字。Dart 区分了*保留字*（reserved words，它们永远不能用于为\
  \ Dart 程序中的实体命名）和*内置标识符*（built-in identifiers）。以下是 Dart 的保留字：：`assert`, `break`,\
  \ `case`, `catch`, `class`, `const`, `continue`, `default`, `do`, `else`, `enum`,\
  \ `extends`, `false`, `final`, `finally`, `for`, `if`, `in`, `is`, `new`, `null`,\
  \ `rethrow`, `return`, `super`, `switch`, `this`, `throw`, `true`, `try`, `var`,\
  \ `void`, `while`, `with`。以下是内置标识符：`abstract`, `as`, `deferred`, `dynamic`, `export`,\
  \ `factory`, `get`, `implements`, `import`, `library`, `operator`, `part`, `set`,\
  \ `static`, `typedef`。\n\n在 Dart 的内置标识符方面出现了一些有趣的情况。考虑\n\n点击此处查看代码图像\n\n```\nget\
  \ get => 'get'; // 不要这么做！\n```\n\n上面的代码是完全合法的，尽管这种风格非常糟糕。它定义了一个名为 `get` 的 getter，返回字符串\
  \ `‘get’`。明白了吗？Dart 编译器可以很容易地判断出每个“get”的出现代表什么，但由于人类可能无法判断，因此强烈建议不要这样写代码。保留字与内置标识符之间的区分使得代码从其他语言迁移到\
  \ Dart 变得更容易。特别是，将 JavaScript 代码转换为 Dart 往往出奇地简单。允许在 JavaScript 中合法的标识符在 Dart 中使用（即使\
  \ Dart 对它们有特殊用途），这有助于这种迁移。\n\n内置标识符不能用作类型名。类、`typedefs` 还是类型参数都不能以内置标识符命名。内置标识符（`dynamic`\
  \ 除外）也不能出现在类型注解中。这不允许出现如下情况：\n\n点击此处查看代码图像\n\n```\nget get get => new get(); //\
  \ 编译错误\n```\n\n显然，你作为人类读者可以立即看出意图是定义一个名为 `get` 的 getter，返回类型 `get`，但解析器需要向后看几个标记\
  \ 才能理解发生了什么。这些限制不会影响迁移，因为 JavaScript 程序中没有出现类型。此外，由于惯例，类型以大写字母开头，因此这条规则对 Dart 代码没有产生困难。唯一的缺点是限制了谜题书作者的就业机会。\n\
  \n### 6.1.3 this\n\n保留字 `this` 在作为表达式使用时，指的是当前方法调用的接收者（receiver）。此外，`this` 也可以出现在构造函数的上下文中，表示新创建的对象。在静态方法或库方法中不能引用\
  \ `this`，因为没有对象作为调用的接收者。\n\n注意，在构造函数中，关键字 `this` 可以出现在特殊形式参数的上下文中，在重定向构造函数（redirecting\
  \ constructors）中，它标记对同类其他构造函数的调用。然而，这两种 `this` 的用法都不是独立的表达式。\n\n#### 6.1.4 常量\n\n\
  常量表达式是一个可以在编译时求值的表达式。常量表达式的值永远不会改变。常量包括字面量数字、布尔值、`null`、常量列表和映射、顶层函数、静态方法，以及常量对象和若干部分为常量的特定复合表达式。\n\
  \n常量对象是通过在实例化表达式中将 `new` 替换为 `const` 创建的，如下一节所示。常量对象的创建仅在非常特定的情况下可行。该类必须有一个合法的 `const`\
  \ 构造函数，并且构造函数的参数本身必须是常量。\n\n给定\n\n点击此处查看代码图像\n\n```\nlibrary constants;\n\nconst\
  \ aTopLevelConstant = 99;\n\nthrice(x) => 3*x;\n\nclass Foo {\n  static threeCubed()\
  \ => thrice(thrice(3));\n}\n\nclass Konst {\n  final x;\n  const Konst(this.x);\n\
  }\n```\n\n以下表达式是常量：\n\n点击此处查看代码图像\n\n```\n\"def\" 1 2.5 true false null const[7,\
  \ 8, 9.0] const{}\naTopLevelConstant thrice\nFoo.threeCubed 'abc' 3+4\n1 - 0 6*7\
  \ -1 2 > 3 3 < 3.0 7 >= 3+4\n9 <= -0 17 % ( 2*2*2 + 8) '$aTopLevelConstant'\nconst\
  \ Konst(42);\n```\n\n相比之下，这些表达式不是常量：\n\n```\nthrice(2)\nthreeCubed == 0\n'${ const\
  \ Point(0, 0)}'\nconst Konst(thrice(14));\n```\n\n### 6.1.5 创建对象\n\n对象通过调用构造函数创建，如\
  \ 第 2.9 节 所示。构造函数使用*实例化表达式*（instance creation expressions）调用。最常见的实例化形式是 `new ConstructorName(args)`。示例示例：\n\
  \n点击此处查看代码图像\n\n```\nnew List<int>(); // 带类型参数的调用\nnew Map(); // 不带类型参数的调用\n```\n\
  \n使用 `new` 并不意味着分配了新实例。这取决于调用的构造器。另一种实例化形式是 `const ConstructorName(args)`，用于创建常量对象。在这种情况下，构造器的参数必须是常量对象，否则会导致编译错误。除了\
  \ `new` 和 `const` 之外，调用构造器的唯一方法是在构造函数内部或通过反射调用。在构造函数内部，父类构造器（super constructors）被隐式调用或通过\
  \ `super(args)` 或 `super.*id(args)` 调用。此外，重定向构造函数可以使用 `this(args)` 或 `this.*id(args)`\
  \ 语法调用其他构造函数。重定向工厂可以命名它们将重定向到的构造器。构造器的详细信息见 第 2.9 节。\n\n### 6.1.6 赋值\n\n赋值可以在顶层、类、实例和局部变量上进行。对于顶层、类和实例变量，赋值是调用\
  \ setter 的简写。\n\n对于局部变量，赋值方式与传统语言相同，将赋值右侧表达式的值设置为赋值左侧表达式的结果。\n\n不能为 `final` 变量赋值。\n\
  \nDart 中的赋值包括形式为 `variable = expression` 的简单赋值，以及与运算符等运算符结合的复合赋值。例如 `variable +=\
  \ expression`，它只是 `variable = variable + expression` 的简写。除了 `+=`，我们还有 `-=`、`*=`\
  \ `/=` `~=` `%=` `<<=`、`>>=` `&=` `^=` `|=`。\n\n例如，以下程序打印数字 1, -1, 303 和 10。\n\n\
  点击此处查看代码图像\n\n```\nlibrary another_lib;\n\nvar topLevelVariable = 101;\n\nclass\
  \ SomeClass {\n  static var classVariable = 100;\n}\n\nlibrary my_lib;\n\nimport\
  \ 'anotherLib.dart' as another show topLevelVariable, SomeClass;\n\nvar myTopLevelVariable\
  \ = 0;\n\nclass MyClass {\n  static var myClassVariable = 0;\n}\n\nmain(){\n  myTopLevelVariable\
  \ += 1;\n  MyClass.myClassVariable -= 1;\n  another.topLevelVariable *= 3;\n  another.SomeClass.classVariable\
  \ /= 10;\n  print(myTopLevelVariable);\n  print(MyClass.myClassVariable);\n  print(another.topLevelVariable);\n\
  \  print(another.SomeClass.classVariable);\n}\n```\n\n### 6.1.7 提取属性\n\n\n\n\n偶尔，将方法作为未求值的函数对象使用是方便的。例如，我们可能想在事件循环中注册一个方法作为监听器。假设函数\
  \ `onClick()` 接收一个监听函数作为参数，并在点击事件发生时最终带有一个事件对象对其进行回调。进一步假设我们定义了一个实例方法 `listener()`\
  \ 来响应点击事件。\n\n```\nlistener(ev) => print(ev);\n```\n\n我们可以如下方式调用 `onClick()`：\n\n\
  ```\nonClick(listener);\n```\n\n根据语言的常规规则，上述代码等同于：\n\n```\nonClick(this.listener);\n\
  ```\n\n而这反过来（近似）是针对简写：\n\n点击查看代码图片\n\n```\nonClick((event) => this.listener(event));\n\
  ```\n\n通常情况下，表示法 `e.m` 表示对象 `e` 求值后的方法 `m`。严格来说，`e.m` 是一个与 `m` 具有相同参数的闭包。使用一组定的参数调用此闭包的效果，等同于在\
  \ `e` 的值上使用这些参数调用方法 `m`。如果 `m` 在作用范围内，可以使用标识符 `m` 代替 `this.m`。\n\n属性提取实际上不仅仅是编写闭包的简写。制造出的闭包具有特殊的等效性实现，如\
  \ 第 4.7 节 所示。\n\n无法通过这种方式提取 getter 或 setter 方法。对于 getters，问题在于如果 `g` 是一个 getter，`e.g`\
  \ 表示调用 getter 的结果，因此该表示法无法表示 getter 方法本身。至于 setters，它们的真实名称以 `=` 结尾且不是合法的标识符，因此\
  \ `e.s=` 在语法上是非法的。在所有此类情况下，必须显式地写一个闭包。\n\n### 6.1.8 方法访问\n\n方法访问的形式为 `e.m(args)`，其中\
  \ `e` 是产生对象的表达式，`m` 是成员名称，`args` 是一个可能为空的参数列表。示例：\n\n点击查看代码图片\n\n```\n3.toString();\n\
  {'a':1, 'b': 2}.containsKey('c');\n'abcd'.indexOf('cd', 1);\nmyObject.foo(x, y,\
  \ z);\n```\n\n理解内容的求值顺序非常重要。在成员访问中，首先计算接收者（receiver），然后是方法的参数。与所有函数调用一样，参数是从左到右按顺序进行计算的。通常这并不重要，但可能会遇到顺序产生差异的情况。\n\
  \n点击查看代码图片\n\n```\nString x;\n(x = 'xyz').indexOf(x); // 求值结果为 0\n```\n\n如果我们在计算参数之前没有计算目标表达式\
  \ `(x = 'xyz')`，我们将会传递 `null` 作为参数。根据规则，如果成员访问对求值顺序敏感，说明你的代码中存在问题。\n\n如果你正在访问的方法不存在怎么办？你现在应该已经很清楚了，这将导致对\
  \ `noSuchMethod()` 的调用。事实上，如果你用错误的参数数量调用已存在的方法，也会调用 `noSuchMethod()`。\n\n另一个可能的问题是你引用的是\
  \ getter 而不是普通方法。在这种情况下，实际发生的是表达式 `e.m(args)` 被解释为 `(e.m)(args)`。首先，我们执行属性访问 `e.m`，产生调用\
  \ getter `m` 的结果。接下来，我们在该结果上调用 `call` 方法。如果结果是一个函数对象（或任何支持适当的 `call` 方法的对象），则操作将按预期工作。否则，我们将再次得到一个\
  \ `noSuchMethod()`。\n\n### 6.1.9 使用运算符\n\nDart 中的运算符本质上是具有特殊语法的实例方法。其中一些运算符受到限制，因此在用户代码中不能被重新定义，但大多数运算符被视为普通的实例方法，可以在任何类中声明和/或重写。\n\
  \n运算符集合及其优先级是固定的。用户代码可以定义以下运算符：`<`, `>`, `<=`, `>=`, `==`, `-`, `+`, `/`, `~/`,\
  \ `%`, `^`, `&`, `*`, `<<`, `>>`, `[]=` 和 `~`。\n\n这些大部分都是二元运算符。例外是单元运算符 `~`、同时具有单元和二元版本的\
  \ `-`，以及三元的索引赋值运算符。我们之前已经见过用户定义运算符的示例，从 `Point` 类开始。一个类似的示例是复数：\n\n点击查看代码图片\n\n\
  ```\nclass Complex {\n  final num re, im;\n  Complex(this.re, this.im);\n  Complex.fromScalar(num\
  \ s): this(s, 0);\n  // 重定向构造函数的极佳示例\n  Complex operator + (Complex c) => new Complex(re\
  \ + c.re, im + c.im);\n  Complex operator * (Complex c) =>\n  new Complex(re*c.re,\
  \ im*c.im);\n}\n```\n*(注：原文中 Complex 类块存在一些错误，已为了可读性进行了清理)*\n\n### 6.1.10 Throw\n\
  \n形式为 `throw e` 的表达式会抛出一个异常。抛出的异常是 `e` 的求值结果。与许多语言不同，`throw` 是一个表达式而不是语句。这允许如下的用法：\n\
  \n```\nunsupportedFoo() => throw 'Not supported, you imbecile!';\n```\n\n如果 `throw`\
  \ 是语句，我们就无法使用函数的简写语法，而必须编写更冗长的形式：\n\n点击查看代码图片\n\n```\nunsupportedFoo() {\n  throw\
  \ 'Not supported, you imbecile!';\n}\n```\n\n通常，表达式比语句更容易组合，尽可能将构造定义为表达式。\n\n如示例所示任何对象都可以作为异常抛出。并不要求对象是异常类的类的子类。\n\
  \n### 6.1.11 条件表达式\n\n条件表达式的形式为 `b ? e[1] : e[2]`，其中 `b` 是布尔表达式，`e[1]` 和 `e[2]`\
  \ 是任意表达式。如果 `b` 求值为 **true**，整个表达式的值为 `e[1]` 的值；如果 `b` 求值为 **false**，则条件的值为 `e[2]`\
  \ 的值。\n\n如果 `b` 不是布尔值怎么办？在检查模式下，代码将在运行时失败，一如既常。在生产环境中，任何非布尔值都会被视为 **false**。如果 `b`\
  \ 的静态类型不是 `bool` 或 `dynamic`，类型检查器会发出警告。\n\n条件表达式另一个 `throw` 是表达式这一事实大有用场的场景。\n\n\
  点击查看代码图片\n\n```\nasExpected(x) ? computeNormalResult(x) : throw 'Unexpected input\
  \ $x';\n```\n\n条件表达式的类型是其两个分支类型的最小上界。\n\n\n\n`block`（块）是将多个语句组合在一起的一种方式。块由大括号 `{}`\
  \ 分隔，在其中我们可以列出语句。列表可以是空的，例如 `{}`。块内的语句用分号 `;` 隔开。由于块本身也是语句，因此块可以嵌套。\n\n块中的语句按照它们在源代码中出现的顺序，从左到右、从上到下的顺序执行。\n\
  \n每个块都引入了自己的独立作用域。在块内部引入的声明仅在块内部可用。在块内部，你可以通过名称引用声明，但必须在声明之后引用。换句话说，块不允许互递归声明。\n\
  \n### 6.2.2 If\n\n在整本书中，我们一直见过 `if` 语句。关键字 `if` 后面跟着一个圆括号括起来布尔表达式，接着是一个语句，可选地，还可以跟着一个\
  \ `else` 子句，该 `else` 子句由关键字 `else` 和另一个语句组成。在这两种情况下，该语句都可以是一个简单语句：\n\n点击此处查看代码图像\n\
  \n```\nif (x > 0) print(x);\nif (y < x) print(y); else print(x);\n```\n\n或者是一个块语句，它允许你在单个分支中执行多个语句：\n\
  \n点击此处查看代码图像\n\n```\nif (x > 0) { var y = 'in then branch'; print(x);};\n```\n\n\
  有些人更倾向于始终使用块语句的风格：\n\n点击此处查看代码图像\n\n```\nif (x > 0) {print(x);};\nif (y < x) {print(y);}\
  \ else {print(x);};\n```\n\n这是因为在分支或循环中添加/删除语句时，永远不需要添加或删除分隔符。Dart 对此问题不持立场；这取决于你的决定。\n\
  \nDart 温和地鼓励你在所有测试（包括 `if` 语句）中使用恰当的布尔值。如果你在条件中使用的表达式不是布尔值，你可能会得到类型警告；但只有在我们确信存在问题时才会如此。\n\
  \n例如，下面的代码：\n\n点击此处查看代码图像\n\n```\nString primeBeef(x) => isPrime(x) ? 'DEAD BEEF'\
  \ : null;\nif (primeBeef(23)) {print('Prime');} // warning\n```\n\n这将生成一个警告，因为字符串不是布尔值。然而，为了不干扰你的开发，在生产模式下，如果你的代码没有类型，或者被类型化为\
  \ `Object`，Dart 不会抱怨：\n\n点击此处查看代码图像\n\n```\nprimeBeef(x) => isPrime(x) ? 'DEAD BEEF'\
  \ : null;\nif (primeBeef(23)) {print('Prime');} // 对真正的动态类型代码不任何抱怨\n```\n\n然而，上述代码在检查模式（checked\
  \ mode）下始终会失败。\n\n### 6.2.3 循环\n\nDart 支持几种类型的循环：两种形式的 `for` 循环，以及 `while` 和 `do`\
  \ 循环。\n\n### 6.2.3.1 For 循环\n\nDart 支持经典的 `for` 循环语法和高级的 `for-in` 语法。\n\n后者更不容易出错，因为它消除了\
  \ C 和其他低级语言中常见的“差一错误”（off-by-one errors）风险。`for-in` 语句允许你对 `Iterable` 提供的系列对象执行某个语句。`Iterable`\
  \ 的示例可以是列表：\n\n点击此处查看代码图像\n\n```\nimport 'dart:math' show pow;\nmain() {\n  var\
  \ v;\n  for (v in [1, 2, 4, 8]) print(pow(2, v)); // 打印 2, 4, 16, 256\n}\n```\n\n\
  在这里，我们遍历一个列表，并计算列表中每个元素的 2 次方。我们使用从 `dart:math` 导入的 `pow` 函数来计算幂。循环的每次迭代都会将 `v`\
  \ 绑定到列表提供的另一个元素。\n\n可以在 `for` 语句本身中声明迭代变量，带有或不带类型声明：\n\n点击此处查看代码图像\n\n```\nfor (int\
  \ v in [1, 2, 4, 8]) print(pow(2, v)); // 打印 2, 4, 16, 256\nfor (var v in [1, 2,\
  \ 4, 8]) print(pow(2, v)); // 打印 2, 4, 16, 256\n```\n\n列表，还有其他实现 `Iterable` 接口的类。最重要的是，任何人都可以实现\
  \ `Iterable`，使得其类的实例可以使用 `for-in` 语句。\n\n经典的 `for` 循环有四个部分：初始化、测试、循环变量更新和循环体。初始化通常声明一个迭代变量，但这并不是强制要求的。你可以重用现有的变量，尽管这种做法并不好。在\
  \ `for (initializer; test; update) body` 中，初始化执行一次，在每次迭代前进行测试；如果测试为真，则执行体，然后执行更新。测试会再次进行评估。如果测试为假，循环终止。\n\
  \n（此处省略了重复内容，注：原文在此处存在大量重复的段落，根据指令“不要重复输出原文”，译文仅保留并翻译核心逻辑部分）\n\n\n\n上述行为是非常标准的。Dart\
  \ 中 `try`-`catch` 的不同之处在于它对堆栈跟踪（stack traces）的处理方式。`catch` 子句可选地接受第二个参数，表示堆栈跟踪。只有需要访问堆栈跟踪的代码才应该指定第二个参数。如果没有指定该参数，实现可能会避免填充堆栈跟踪。填充堆栈跟踪是一项昂贵的操作，避免它是一项重要的优化。\n\
  \n点击此处查看代码图像\n\n```\ntry {\n  shootFloor();\n}\n\non PodiatryException catch(e,\
  \ s) {\n  print(s);\n  print('Shot myself in the foot: $e');\n}\n```\n\n堆栈跟踪对象不支持除\
  \ `Object` 中定义之外的任何方法。这些方法中最重要的是 `toString()`，它可以打印出堆栈跟踪。\n\n### 6.2.5 Rethrow（重新抛出）\n\
  \n捕获异常后，经过检查发现本地无法处理，并且应该将异常传播到调用链的更上方，这种情况并不罕见。\n\n`rethrow` 语句通过重新抛出一个正在 `catch`\
  \ 子句中处理的异常，专门用于处理这种情况。\n\n### 6.2.6 Switch（分支）\n\n`switch` 语句提供了一种根据表达式的值在多个选项中选择行动的方法。`switch`\
  \ 处理的每个 `case` 对应于表达式的一个可能值。这些可能值必须提前已知——它们必须是编译时常量。我们还要求各种 `case` 完全相同的类型。\n\n\
  `switch` 的最佳用法是在词分析器或解释器等应用程序中。让我们来看一个极其简单的解释器。该解释器在一个非常简单的指令集上运行：\n\n`constant`\
  \ *n*\n\n`plus`\n\n`minus`\n\n指令集假设有一个隐含的操作数栈。指令 `constant` *n* 将数值型常量 *n* 推入堆栈；`plus`\
  \ 指令弹出操作数栈顶部的两个元素，将它们求和并将结果推回堆栈；`minus` 类似，但执行的是减法而不是加法。\n\n我们可以用多种方式表示这些指令。这里有一种非常直观的方法：\n\
  \n点击此处查看代码图像\n\n```\nclass Instruction {\n  String code;\n  Instruction(this.code);\n\
  }\n\nclass LiteralInstruction extends Instruction {\n  num constantValue;\n  LiteralInstruction(this.constantValue):\
  \ super('constant');\n}\n```\n\n现在假设我们有一个可迭代的指令序列 `instructions`，我们可以使用以下代码执行它：\n\
  \n点击此处查看代码图像\n\n```\nList<num> operandStack = new List<num>();\n\nfor (Instruction\
  \ instruction in instructions) {\n  switch (instruction.code) {\n    case 'plus':\n\
  \      operandStack.add(operandStack.removeLast() + operandStack.removeLast());\n\
  \      break;\n    case 'minus':\n      operandStack.add(operandStack.removeLast()\
  \ - operandStack.removeLast());\n      break;\n    case 'constant':\n      LiteralInstruction\
  \ litInst = instruction;\n      operandStack.add(litInst.constantValue);\n     \
  \ break;\n  }\n}\n\nassert(operandStack.length == 1);\nnum result = operandStack.last;\n\
  ```\n\n我们遍历指令流。在每次迭代中，`switch` 语句使用操作码来适地引导处理。指令的操作数存储在栈 `operandStack` 中。栈初始时为空。一个格式良好的指令流在执行完成后，在栈顶部应该恰好留下一个元素。该元素就是评估的结果。\n\
  \n虽然上面的例子简单且原始，但它捕捉了解释器的精髓。我们可以更高效地编码指令流（通常指令流将由整数，可能是字节，而不是对象组成），而且我们可能会有很多指令，但基本结构不会发生太大。\n\
  \nDart 中 `switch` 语句的工作原理与 C 及其后续语言传统行为相似，但并不完全相同。在大多数语言中，`case` 的执行会“穿透”（fall-through）到下一个\
  \ `case`。这种几十年前为了实现上的方便而做出的决定，一直是无数 bug 的根源，特别是危险的安全漏洞。在 Dart 中，不允许这种穿透。如果发生穿透，将导致立即的运行时错误，从而防止隐藏的\
  \ bug。因此，我们示例中的每个 `case` 都以 `break` 语句结束，以防止穿透。\n\n人们自然会定义语义，使得执行在每个 `case` 结束时终止。这会更清晰简单。然而，我们还希望方便从其他语言将代码迁移到\
  \ Dart。Dart 的规则确保编写正确的 `switch` 语句可以迁移到 Dart 并且极可能按预期工作。依赖于穿透的代码将会失败；这种代码并不常见且容易出错。\n\
  \n可以为 `switch` 语句添加一个特殊的 `default` case。如果没有任何其他 `case` 匹配，将执行此 `case`。我们将在下面看到一个示例。\n\
  \n`switch` 语句有若干要求。各种 `case` 必须都是编译时常量 (2.11, 6.1.4)。这允许高效的编译。此外，这些常量必须：\n\n- 全是\
  \ `int` 的实例，或\n- 全是 `String` 的实例，或\n- 全是完全相同类的实例，且该类必须继承 `Object` 的 `==`。\n\n如果违反了任何这些要求，将产生编译错误。\n\
  \n上述规则有些微妙之处。注意，对必须是相同类的要求并未施加于整数。Dart 实现可能会使用不同的类来实现整数，但以下内容仍然允许的：\n\n点击此处查看代码图像\n\
  \n```\nswitch (guestBalance) {\n  case 0:\n    print('Never darken my doorway again');\n\
  \    break;\n  case 1000000000:\n    print('Welcome; su casa es mi casa');\n   \
  \ break;\n  default: print('Hello');\n}\n```\n\n我们只关心所有的 case 都是 `int`。对于字符串也是如此，实现可能会根据字符串的性质使用多个类。禁止在\
  \ switch 语句中使用这些类型。\n\n### 6.2.7 Assert（断言）\n\n程序员生活在永久的失望中；他们的期望经常被破灭。考虑这个平凡的阶乘函数：\n\
  \n点击此处查看代码图像\n\n```\nfactorial(int x) {\n  return x == 0 ? 1 : x* factorial(x-1);\n\
  }\n```\n\n这种简单的代码可能会出什么问题？事实上，虐态的软件工程师喜欢在面试中问这个问题。人们很容易相信上述代码的正确性。但也很容易评估 `factorial(-1);`\
  \ 并看到函数会递归直到栈尽空间。为了防止这种心碎，良好的做法是在代码中大量散布*断言*来使我们的预期显式化。通过 `assert` 语句来实现此类断言。通常，我们通过将布尔表达式封装在\
  \ `assert` 中编写断言：\n\n点击此处查看代码图像\n\n```\nfactorial(int x) {\n  assert(x >= 0);\n\
  \  return x == 0 ? 1 : x* factorial(x-1);\n}\n```\n\n上面的与下面的非常相似：\n\n点击此处查看代码图像\n\
  \n```\nfactorial(int x) {\n```\n\n\n\n\n```\nif (x >= 0) return x == 0 ? 1 : x*\
  \ factorial(x-1);\nelse throw new AssertionError();\n}\n```\n\n如果条件不成立，则会抛出一个 `AssertionError`。`assert`\
  \ 构造的优势在于在生产环境中它是禁用的，不会增加空间或时间上的开销。它只在检查模式（checked mode）下生效。\n\n当然，这可能不是编写 `factorial`\
  \ 的最佳方式；一旦明确了假设，我们可能想要：\n\n点击此处查看代码图像\n\n```dart\nfactorial(int x) {\n  if (x >=\
  \ 0) return x == 0 ? 1 : x* factorial(x-1);\n  else return 1;\n}\n```\n\n或者更好：\n\
  \n点击此处查看代码图像\n\n```dart\nfactorial(int x) {\n  if (x > 1) return x* factorial(x-1);\n\
  \  else return 1;\n}\n```\n\n关键点在于，人们应该仔细考虑自己所做的假设，然后决定是否验证这些假设，以及如果它们不成立该怎么办。\n\
  \n在 `assert` 内部提供一个谓词也是可能的。在这种情况下，执行 `assert` 语句时会调用该函数。如果它产生 `true`，则断言成功，一切正常。否则，断言失败。这意味着如果函数返回\
  \ `false` 或返回任何非布尔值，断言都会失败。\n\n如果 `assert` 内部的表达式不是以下类型之一：`bool`、`()` → `bool` 或可以赋值给其中之一的类型，Dart\
  \ 类型检查将会报错。可以赋值给 `bool` 的类型只有 `Object` 和 `dynamic`。对于 `()` → `bool`，情况会稍微复杂一些。以下是一些不会引起警告的断言：\n\
  \n点击此处查看代码图像\n\n```dart\nvar x, y;\n... f() => false;\ng() => x > y;\nassert(f);\
  \ // 可以，尽管在检查模式下将始终失败\nassert(g); // 可以\nassert(() => 'error!!'); // 闭包始终具有静态返回类型\
  \ dynamic\nassert(([a, b]) => a > b ); // 可选参数是兼容的\n```\n\n这里是一些会引起警告的示例：\n\n点击此处查看代码图像\n\
  \n```dart\nString f() => 'true';\nassert(f); // String 返回类型与 bool 不兼容\nassert((a,\
  \ b) => a > b ); // 参数个数不兼容\n```\n\n如 第 5 章 所示，检查模式将类型注解视为断言。每个形式为 `T v` = `e` 的检查模式赋值都会被处理为以下生产模式代码：\n\
  \n点击此处查看代码图像\n\n```dart\nT v `= ()` { var v′ `=` e`;` assert`(`null `==` v′ || v′\
  \ is T `);` return v′`;`}();\n```\n\n类似的逻辑也适用于参数传递和从函数返回结果。\n\n### 6.2.8 Return\n\
  \n`return` 语句将控制权从函数转移到其调用者。`return` 有两种变体——一个带关联表达式和一个不带：\n\n```dart\nreturn 42;\n\
  return;\n```\n\n后者本质上是 `return null` 的简写。\n\n执行 `return` 语句将立即控制权转移到封装该 `return`\
  \ 的函数的调用者，位于紧接调用之后的点。当前函数的结果是 `return` 之后表达式的值（如果没有表达式，则为 `null`）。然而，如果 `return`\
  \ 被封装在 `try`-`finally` 语句中，控制将转移到 `finally` 子句。\n\n如果与 `return` 关联的表达式静态类型无法赋值给所属函数的返回类型，Dart\
  \ 类型检查将会警告我们。此外，在检查模式下，如果返回值的类型不是声明的返回类型的子类型，Dart 将停止运行（一如既往`null` 是允许的）。\n\n如果我们在没有表达式的情况下编写\
  \ `return`，类型检查器也会警告，除非周围的函数声明返回类型为 `dynamic` 或 `void`。因此，虽然以下是好的：\n\n```dart\n\
  void postNotice(String n) {\n  print(n);\n  return;\n}\n```\n\n如下也是好的：\n\n```dart\n\
  postNotice(String n) {\n  print(n);\n  return;\n}\n```\n\n但这种不行：\n\n```dart\nString\
  \ postNotice(String n) {\n  print(n);\n  return;\n}\n```\n\n在最后一种变体中，我们可能想要向发送者返回\
  \ `n`，也许作为流式 API 的一部分，这就是我们声明函数返回 `String` 的原因。或者我们根本没打算返回字符串。无论哪，情况不对，Dart 将发出警告。\n\
  \n`return` 语句在（生成式）构造函数中被特殊对待。在生成式构造函数内部不允许 `return` 后面跟一个表达式：\n\n点击此处查看代码图像\n\n\
  ```dart\nclass Point {\n  var x, y;\n  Point(a, b) { return 0; } // 非法 Dart::编译错误!\n\
  }\n```\n\n显然，像 `Point()` 这样的构造函数应该返回 `Point` 的新实例，而不是其他。该实例将由运行时制造并隐式返回，因此返回任何其他值没有任何意义。\n\
  \n在生成式构造函数中，我们允许不带随表达式的 `return`，但将其解释为 `return this` 而不是 `return null`。理论上，我们也可以容忍显式的\
  \ `return this`，但这种特殊处理没有任何意义。\n\n### 6.2.9 Yield and Yield-Each\n\n`yield` 语句用于生成器函数（4.8）向正在生成的集合中添加新结果。`yield`\
  \ 语句的形式为 `yield e;`。\n\n`yield` 总是导致其表达式被求值。通常，产生的值将追加到正在生成的集合中。如果生成器是同步的，结果将追加到迭代器中。如果生成器是异步的，结果将追加到流中。\n\
  \n`yield` 词在 Dart 中不是保留字，甚至不是内置标识符。但在生成器内部它被视为关键字。有时，最好定义一个生成器：\n\n```dart\nnaturalsFrom(n)*\
  \ {\n  if (n > 0) {\n    yield n;\n    for (var i in naturalsFrom(n-1)) {\n    \
  \  yield i;\n    }\n  }\n}\n```\n\n上面的代码功能上是正确的，但隐藏着一个性能漏洞：它以平方级时间运行。为了理解原因，考虑 `naturalsFrom(3)`\
  \ 的追踪：\n\n点击此处查看代码图像\n\n```dart\nnaturalsFrom(3)\n→\n  if (3 > 0) // true\n    yield\
  \ 3;\n    for (var i in naturalsFrom(2))\n      →\n        if (2 > 0) // true\n\
  \          yield 2;\n          for (var i in naturalsFrom(1))\n            →\n \
  \             if (1 > 0) // true\n                yield 1;\n                for\
  \ (var i in naturalsFrom(0))\n                  →\n                    if (0 > 0)\
  \ // false\n                    ← // 返回空序列\n                ← // 序列 1\n        \
  \      yield 1;\n            ← // 序列 2, 1\n        yield 2;\n    yield 1;\n← //\
  \ 序列 3, 2, 1\n```\n\n注意 `yield i;` 对于序列中的第 $n$ 个元素执行了 $n$ - 1 次：在每个递归层执行一次；第一个元素\
  \ 3 仅通过 `yield n;` 语句产生；第二个元素 2 通过 `yield n;` 产生一次，通过 `yield i;` 产生一次。第三个元素 1 通过\
  \ `yield n;` 产生一次，通过 `yield i;` 产生两次。\n\n我们总共有 $n$($n$ - 1) 次 `yield i;` 执行，复杂度为\
  \ $O*($n²$)。\n\n\n\n\nDart 提供了 `yield-each` 语句来解决这个问题。`yield-each` 语句的格式如下：\n\n\
  ```\nyield* e;\n```\n\n表达式 `e` 必须求值为集合（collection），否则将抛出运行时错误；`yield*` 将 `e` 的所有元素添加到与闭包生成器相关的集合中。\n\
  \n我们可以使用 `yield-each` 重新改写代码：\n\n点击此处查看代码图像\n\n```dart\nnaturalsDownFrom(n) sync*\
  \ {\n  if ( n > 0) {\n    yield n;\n    yield* naturalsDownFrom(n-1));\n  }\n}\n\
  ```\n\n后者的版本以线性时间运行。\n\n### 6.2.10 标签（Labels）\n\nDart 允许在代码中使用标签。标签的意图是方便工具进行自动代码生成。在这里提到它们是为了完整性。然而，你永远不要在自己编写的代码中使用标签。它们是一种低级机制，不应该出现在人类编写或旨在人类阅读的代码中。\n\
  \n### 6.2.11 Break 和 Continue\n\n`break` 和 `continue` 语句支持所谓的半结构化控制流。它们是 C 系早期语言的遗产。通常，当深处于控制结构内部需要跳出整个流程时，它们非常有用。\n\
  \n例如，假设我们正在循环中处理消息。我们一直处理消息直到收到消息 `#stop`。处理这种情况的一种方法是使用无限循环并使用 `break` 退出。\n\n\
  点击此处查看代码图像\n\n```dart\nvar msg;\n\nwhile (true) {\n  msg = getMessage();\n  if (msg\
  \ == #stop) break; else processMsg(msg);\n}\n```\n\n解决同一个问题的另一种方法是在循环顶部测试 `#stop`\
  \ 消息：\n\n```dart\nvar msg = getMessage();\nwhile (msg != #stop) {\n  processMsg(msg);\n\
  \  msg = getMessage();\n}\n```\n\n但这可能不够自然。然而，更好的做法是将上述内容封装成一个独立的例程，并使用 `return`\
  \ 来退出：\n\n点击此处查看代码图像\n\n```dart\nprocessMessages() {\n  var msg;\n  while (true)\
  \ {\n    msg = getMessage();\n    if (msg == #stop) return; else processMsg(msg);\n\
  \  }\n}\n```\n\n短方法是良好的编程风格。方法的名称有助于记录代码的用途，而且，短短方法比具有深度嵌套控制结构的长方法更容易阅读和理解。\n\n\
  通常情况下，`break` 语句将跳出最近的闭包循环（无论是 `while`、`do` 还是 `for`）或 `switch` 语句。任何中间的 `finally`\
  \ 子句都将被执行。如果编写了一个没有被循环或 `switch` 包裹的 `break` 语句，将发生编译时错误。\n\n人们还可以将 `break` 语句与标签关联。在这种情况下，必须有一个具有相同标签的闭包语句，控制将跳到该语句。再次，任何中间的\
  \ `finally` 子句都将被执行。如上述第 6.2.10 节\n\n```dart\nimport 'dart:mirrors' show reflectClass,\
  \ ClassMirror;\n\nclass SuperClass {\n  int superField = 0;\n  final superFinalField\
  \ = 1;\n  get superGetter => 2;\n  set superSetter(x) {}\n  int superMethod(x) =\
  \ 4;\n\n  static int superField = 5;\n  static final superFinalField = 6;\n  static\
  \ const superField = 7;\n  static get superGetter => 8;\n  static set superSetter(x)\
  \ {}\n  static int superMethod(x) = 10;\n}\n\nclass SelfPrinting extends SuperClass\
  \ {\n  int aField = 11;\n  final aFinalField = 12;\n  get aGetter => 13;\n  set\
  \ aSetter(x) {}\n  int aMethod(x) = 15;\n}\n\nmain() {\n  ClassMirror cm = reflectClass(SelfPrinting);\n\
  \  for (Symbol memberName in cm.instanceMembers.keys) {\n    print('$memberName');\n\
  \  }\n}\n```\n\n该程序使用 `dart:mirrors` 中定义的顶层函数 `reflectClass()` 来获取 `SelfPrinting`\
  \ 类的镜像。结果是 `ClassMirror` 实例，它支持 `instanceMembers` 方法。在类镜像上调用 `instanceMembers` 会返回一个以反射类的成员名为键的映射。映射的键构成了成员名称的列表，我们可以直接打印它们。\n\
  \n运行此程序应该打印(1)\n\n**1。** 如果你运行并看到类似 `Symbol(“乱码”)` 的输出，请确保禁用混淆，这将在下文第 7.1.1 节中描述。\n\
  \n```\nSymbol(\"==\")\nSymbol(\"hashCode\")\nSymbol(\"toString\")\nSymbol(\"noSuchMethod\"\
  )\nSymbol(\"runtimeType\")\nSymbol(\"superField\")\nSymbol(\"superField=\")\nSymbol(\"\
  superFinalField\")\nSymbol(\"superGetter\")\nSymbol(\"superSetter=\")\nSymbol(\"\
  superMethod\")\nSymbol(\"aField\")\nSymbol(\"aField=\")\nSymbol(\"aFinalField\"\
  )\nSymbol(\"aGetter\")\nSymbol(\"aSetter=\")\nSymbol(\"aMethod\")\n```\n\n打印出的值都是\
  \ `Symbol` 类的实例，它们在 Dart 镜像 API 中用于表示反射实体的名称。我们将在下一节中关于符号符号更多内容。\n\n\n\n\n关于上述列表有几点需要注意。对于\
  \ `superField` 和 `aField` 字段，列出了两个项。一个是 getter（get），另一个（以 `=` 结尾）是 setter（存器）。`instanceMembers`\
  \ 方法旨在为我们提供实例的 API——即可以调用的成员集合。由于在 Dart 中永远不会直接访问字段，因此结果实际上并不包含对字段声明的镜像（mirror）。相反，提供的是对隐式定义的\
  \ getter 和 setter 方法的镜像。这就是为什么 final 字段在列表中只显示了一次：final 字段会产生 getter 但不会产生 setter。\n\
  \n列表包含了继承的成员，以及由 `SelfPrinting` 自身声明的成员。这些包括 `Superclass` 和 `Object` 的成员。同样，`instanceMembers`\
  \ 为我们提供的是 `SelfPrinting` 类实例的 API，其中包含了继承的成员。\n\n由于我们请求的是实例成员，因此静态成员（static members）没有被列出，构造函数也没有。这是合理的，因为这两者都无法通过类的实例来调用。假设我们稍微修改一下\
  \ `for` 循环：\n\n点击此处查看代码图片\n\n```\nfor (Symbol memberName in cm.staticMembers.keys)\
  \ {\n    print('$memberName');\n}\n```\n\n现在我们得到了 `Symbol(\"staticField\")`\n\n\
  `Symbol(\"staticField=\")`\n\n`Symbol(\"staticFinalField\")`\n\n`Symbol(\"staticConstField\"\
  )`\n\n`Symbol(\"staticGetter\")`\n\n`Symbol(\"staticSetter=\")`\n\n`Symbol(\"staticMethod\"\
  )`\n\n再次看，对于像 `staticField` 这样的可变字段，getter 和 setter 是如何被列出来的。`SuperClass` 的静态成员没有这个列表中；静态成员是不被继承的，且无法通过\
  \ `SelfPrinting` 调用。\n\n### 7.1.1 对速度和大小的影响\n\n如果你直接在 Dart 虚拟机上运行代码，你可以假定整个 Dart\
  \ 平台以及你的完整应用程序源码在运行时都是可用的。然而，在许多部署场景中，情况并非如此。\n\n最常见的情况是将 Dart 编译为 Javascript 以部署到\
  \ 浏览器。Dart-to-Javascript 编译器力求减小其生成代码的大小。生成的代码越小，通过网络下载的速度就越快，程序启动时解析源码占用的时间就越少。然而，最小化部署代码大小的过程与反射（reflection）有多种方式相互作用。\n\
  \n#### 7.1.1.1 树摇（Tree Shaking）\n\n编译器会避免生成从未使用过的代码。通过一种名为*树摇*的过程，编译器可以确定某些代码在特定应用程序中是否真的被使用。如果一个应用程序只使用了大型库中的单个函数，那么没有必要生成、下载和解析该库中的所有其他代码。事实上，避免这样做至关重要；想象一下，如果每个使用\
  \ Dart 的网页都要下载整个 Dart 核心库的代码，即使是一个简单的“Hello World”程序也将有几 MB 大小！\n\n反射带来了困难。预测哪些代码正在通过反射调用是非常困难的。某种实现可能会选择保守的做法，假设如果使用了反射，则系统中的所有代码都必须在生成的输出中保留，因为它们可能被反射调用。结果将是任何对反射的使用都会在代码大小上带来沉重代价，并对启动时间和内存占用产生不利影响。在另一个极端，某种实现可能会在进行树摇时忽略反射的使用。遗憾的后果是，在测试和开发期间正常的反射调用在生产环境中可能会失败，因为它们所需的代码并不在那里。\n\
  \n在实践中，目前的实现采用了第一种方法。然而，可以使用元数据注解和 `reflectable` 包来管理这个问题，如第 7.4 节所示。\n\n#### 7.1.1.2\
  \ 混淆（Minification）\n\n*混淆*（minification）一词是指压缩下载到浏览器的源程序中符号的过程。源码中使用的名称被混淆为编译代码中使用的短名称。执行混淆程序的称为混淆器（minifier）。\n\
  \n混淆器不对字符串字面量进行操作；这些字符串通常代表需要保留的用户数据；字符串可能会打印给人类阅读，或作为外部数据库的键，因此无法安全地进行混淆。\n\n混淆对反射产生了不利的后果。使用字符串来表示声明名称是自然的。然而，一旦程序经过了混淆，这些字符串就不再对应程序中实体的实际名称。\n\
  \n为了减轻混淆造成的破坏，Dart 反射使用符号（symbols 2）（6.1.1.5）而不是字符串作为键。符号被混淆器识别，并使用代码中标识符相同的混淆方式进行转换。\n\
  \n**2。** 确实，反射是为 Dart 添加符号字面量（symbol literals）的主要动力。\n\n有时可能必要在符号和可读字符串之间进行映射。我们可能希望上一节中的自打印代码直接打印成员名称，而不是以\
  \ `Symbol(...)` 的形式。在存在混淆的情况下，这尤为关键；混淆后的程序将打印带有混淆名称的符号，这对于人类读者来说可能没用。为了避免此类问题，镜像\
  \ API 支持符号和可读字符串之间的双向转换。`MirrorSystem` 类包含以下方法：\n\n点击此处查看图片\n\n```\nstatic String\
  \ getName(Symbol symbol);\nstatic Symbol getSymbol(String name, [LibraryMirror library])\n\
  ```\n\n要将符号转换为统一的名称，使用 `getName`。反向操作是 `getSymbol`；它将根据可读字符串产生符号。我们可以利用此功能来完善我们的自打印示例。我们在导入语句中加入了\
  \ `MirrorSystem`，并调用 `MirrorSystem.getName()` 进行必要的转换。\n\n点击此处查看图片\n\n```\nimport\
  \ 'dart:mirrors' show ClassMirror, MirrorSystem, reflectClass;\n\nclass SuperClass\
  \ {\n    // 与上上\n}\n\nclass SelfPrinting extends SuperClass {\n    // 同样同上\n}\n\n\
  main() {\n    ClassMirror cm = reflectClass(SelfPrinting);\n    for (Symbol memberName\
  \ in cm.instanceMembers.keys) {\n        print('${MirrorSystem.getName(memberName)}');\n\
  \    }\n}\n```\n\n运行上述代码输出\n\n==\n\nhashCode\ntoString\nnoSuchMethod\nruntimeType\n\
  superField\nsuperField=\nsuperFinalField\nsuperGetter\nsuperSetter=\nsuperMethod\n\
  aField\naField=\naFinalField\naGetter\naSetter=\naMethod\n\n无论是否混淆。然而，自打印代码并不一定是最流行的应用。在建立了基础之后，我们现在将考虑反射更具真实的用途。\n\
  \n### 7.1.2 示例：代理（Proxies）\n\n在第 2.10 节中，我们定义了一个通用代理类 `Proxy`。它的实现依赖于辅助方法 `runMethod()`。我们终于可以展示\
  \ `runMethod()` 的实现了：\n\n点击此处查看代码图片\n\n```\nrunMethod(forwardee, Invocation inv){\n\
  \    InstanceMirror im = reflect(forwardee);\n    im.delegate(inv);\n}\n```\n\n\
  第一步使用 `dart:mirrors` 中的顶层函数 `reflect()` 获取 `forwardee` 的镜像。实例由 `InstanceMirror`\
  \ 类镜像。`InstanceMirror` 支持 `delegate()` 方法，它接收一个 `Invocation` 并根据调用调用提供的参数在反射对象上执行相应的方法。\n\
  \n\n\n\n在现实中，我们希望避免每次调用都分配一个实例镜像（instance mirror）。我们将重写 `Proxy`，将实例镜像缓存在一个私有实例变量中。\n\
  \n点击此处查看代码图像\n\n```dart\nlibrary proxies;\n\nimport 'dart:mirrors' show InstanceMirror,\
  \ reflect;\n\n@proxy class Proxy {\n\n  InstanceMirror _im;\n\n  get forwardee =>\
  \ _im.reflectee;\n\n  Proxy(f){\n    _im = reflect(f);\n  }\n\n  noSuchMethod(inv)\
  \ => _im.delegate(inv);\n}\n```\n\n为了保持原始接口，我们为 `forwardee` 定义了一个 getter。大多数镜像都有一个名为\
  \ `reflectee` 的访问器，返回镜像反射的实体；在这里我们使用 `reflectee` 来实现 `forwardee`。完成后的类带有第 5.7.6\
  \ 节描述的 `@proxy` 注解，以减少不必要的警告。\n\n### 7.1.3 示例：序列化\n\n当我们想要将对象写入外部介质时，我们称之为“对象序列化”（object\
  \ serialization）。同样地，“对象反序列化”（object deserialization）指的是从外部介质读取对象。外部介质可以是持久性存储，也可以是通信通道。如果我们希望持久地保存程序状态，或者我们在对象层面上与远程进程通信，序列化对象是有用的。我们将在第\
  \ 8 章中看到后者的示例。\n\n对象序列化的主题非常丰富，我们在这里不会展现它的完整面貌。我们在这里显示的序列化器/反序列化器必然是简单的；它既不健壮、不完整，也不高效。序列化对象有不同的方法，各有优缺点，我们不会进行讨论。尽管有这些限制，我们仍然选择序列化作为一个说明性示例，它是反射的一个经典应用。\n\
  \n序列化器需要为对象定义一种标准表示。我们将通过对象的类和字段来表示对象。具体来说，我们将存储类名、定义该类的库名以及对象字段的内容。\n\n假设我们想要序列化通过表达式\
  \ `new Point(42, 91)` 创建的对象 `s`。回想 `Point` 是在第 1.4 节中的 `points` 库中。`s` 的序列化形式将是\
  \ `points/Point(42 91)`。\n\n如果我们有如下代码：\n\n点击此处查看代码图像\n\n```dart\nvar shared = new\
  \ Point(42, 91);\n\nvar so = new Pair(shared, shared);\n```\n\n其中 `Pair` 是在第 2.7\
  \ 节中声明的类。建议的格式不再足够。假设 `Pair` 声明在 `pairs` 库中，其序列化形式将是\n\n点击此处查看代码图像\n\n```\npairs/Pair(points/Point(42\
  \ 91) points/Point(42 91))\n```\n\n但这并没有正确捕获结构。`Pair` 对象最终引用了两个不同的 `Point` 实例，而不是单个\
  \ `Point` 对象 `shared`。问题在于源程序始终是树结构，但对象可以形成有向图。我们必须泛化我们的表示以支持此类图。\n\n为了支持共享，我们将使用整数索引来表示对对象的引用。对象的表示即为类的完全限定名，随后是实际的参数列表，其中参数通过整数索引表示。新的\
  \ `Pair(shared, shared)` 的序列化形式将是 `pairs/Pair(1 1)`。\n\n一个对象图的完整序列化形式将是此类序列化对象的列表。整数索引将引用列表的元素。在我们的示例中，图可以写为\
  \ `[pairs/Pair(1 1), points/Point(2 3), 42, 91]`。`Pair` 对象本身位于索引 0，`Point` 的共享实例位于索引\
  \ 1，整数 42 位于索引 2，整数 91 位于索引 3。\n\n这一切引导得出如下定义：\n\n点击此处查看代码图像\n\n```dart\nclass SerializedObject\
  \ {\n\n  final int id;\n\n  final Symbol libName;\n\n  final Symbol className;\n\
  \n  List<int> fields;\n\n  SerializedObject(this.id, this.libName, this.className);\n\
  \n  toString(){\n    String args = (fields.map((a) => a.toString())).fold('', (s,\
  \ e) => '$s $e');\n    return '${MirrorSystem.getName(libName)}/${MirrorSystem.getName(className)}($args)';\n\
  \  }\n}\n```\n\n序列化对象有一个唯一的整数标识符 `id`，并记录其类名和所属库名，以及字段的内容。这些字段表示为它们所包含的对象的整数 ID。（注：此处原文存在大量重复内容，已根据逻辑进行清理）。\n\
  \n### 7.1.3.1 序列化算法\n\n我们现在可以编写我们的序列化器。\n\n点击此处查看代码图像\n\n```dart\nlibrary serializer;\n\
  \nimport 'dart:mirrors' show\n\n  ClassMirror, InstanceMirror, MethodMirror, Mirror,\
  \ MirrorSystem,\n  reflect, VariableMirror;\n\nMap<Object, SerializedObject> sos;\n\
  \n// 序列化的对象\n\nint counter;\n```\n\n\n\n\n点击此处查看代码图像\n\n```\nbool isLiteral(o) {\n\
  \  return o is num || o is bool || o is String || o is Symbol || null == o;\n}\n\
  ```\n\n`superclasses` 函数计算给定类的所有父类。在通过反射方式处理类层次结构时，这是一个经常需要的实用便利方法。然而，它并不是 `dart:mirrors`\
  \ 的一部分，因为我们希望 Dart 的核心尽可能小。\n\n点击此处查看代码图像\n\n```\nList<ClassMirror> superclasses(ClassMirror\
  \ cm) {\n  List<ClassMirror> scs = new List<ClassMirror>();\n  ClassMirror scm =\
  \ cm;\n  while (scm != null) {\n    scs.add(scm);\n    scm = scm.superclass;\n \
  \ }\n  return scs;\n}\n```\n\n该函数的逻辑非常直接：它依赖 `ClassMirror` 的 `superclass` 方法，该方法返回被反射类的父类的镜像。对于\
  \ `Object`，`superclass` 的结果是 `null`。我们需要做的只是沿着父类链并将类添加到结果列表中。在这里我们将父类关系视为反射性的，因此类的父类列表包含了类本身。这种形式在下面的代码中被证明是非常方便的。现在我们可以关注序列化算法。入口函数是\
  \ `serialize`，它接收对象图并对其进行序列化。点击此处查看代码图像\n\n```\nList<String> serialize(o) {\n  counter\
  \ = 0;\n  sos = new Map<Object, SerializedObject>();\n  serializeObject(o);\n  List<String>\
  \ sf = new List<String>(sos.values.length);\n  for (var v in sos.values) {sf[v.id]\
  \ = v.toString();}\n  return sf;\n}\n```\n\n`serialize` 所做的只是初始化 `counter` 和 `sos`，对根对象调用\
  \ `serializeObject`，并将结果按照序列化对象的 ID 封装在列表中。大部分工作由 `serializeObject` 过程完成，它递归地序列化对象及其字段。点击此处查看代码图像\n\
  \n```\nSerializedObject serializeObject(o){\n  SerializedObject current = sos[o];\n\
  \  if (current != null) {\n    return current;\n  }\n  if (isLiteral(o)) { return\
  \ sos[o] = new SerializedLiteral(counter++); }\n  if (o is List) {\n    return sos[o]\
  \ = serializeList(o);\n  }\n  InstanceMirror im = reflect(o);\n  ClassMirror cm\
  \ = im.type;\n  var res = sos[o] = new SerializedObject(counter++, cm.owner.simpleName,\
  \ cm.simpleName);\n  res.fields = serializeFields(cm, im);\n  return res;\n}\n```\n\
  \n我们首先在序列化对象映射 `sos` 中查找对象。如果找到了，说明我们已经遇到了它，可以直接返回它的序列化形式。这确保了我们表示共享，并防止在循环对象图中进入无限递归。\n\
  \n假设我们之前没有遇到过 `o`，我们就检查它是否为字面量；如果是，我们就产生一个 `SerializedLiteral`，将其存储在 `sos` 中并返回。同样，我们检查对象是否为列表，如果是，则使用以下过程创建一个\
  \ `SerializedList`：点击此处查看代码图像\n\n```\nSerializedList serializeList(List l) {\n \
  \ SerializedList sl = new SerializedList(counter++);\n  sl.fields = l.map((e) =>\
  \ serializeObject(e).id).toList();\n  return sl;\n}\n```\n\n否则，我们有一个需要序列化的普通对象 `o`。获取\
  \ `o` 的镜像，然后获取类的镜像。我们可以通过实例镜像使用 `type()` 方法获取对象的类的镜像。与 `runtimeType` 不同，`type` 返回的是底层类的镜像。\n\
  \n`ClassMirror` 通过 `simpleName()` 方法提供类名。我们还可以通过 `owner` 方法获取其所属库的镜像。`owner` 方法返回反射实体的封装声明的镜像。对于类，`owner`\
  \ 总是库；对于方法和函数，`owner` 可能是库、类或另一个函数。关键点在于可以使用 `owner` 遍历声明的词法作用域。\n\n在我们的情况下，我们只需要封装库的名字，我们可以通过\
  \ `owner.simpleName()` 计算。我们本可以直接使用 `qualifiedName()` 获取类的完全限定名，但我们倾向于单独获取并存储名称。正如我们之后看到的，这会让反序列化过程变得简单一些。\n\
  \n我们可以分配一个 `SerializedObject` 实例，使用 `counter` 的值作为其 ID。我们增加 `counter` 以为下一个对象准备，并将新的\
  \ `SerializedObject` 存储在 `sos` 中。然后我们调用 `serializeFields`，它产生对象字段的索引列表，相应设置序列化对象的字段并返回。\n\
  \n剩下的就是展示 `serializeFields` 如何工作。我们使用方便的工具函数遍历父类，并对于每个父类，遍历它声明的成员，只选择实例字段声明。对于每个此类字段，我们使用实例镜像上的\
  \ `getField` 方法反射地提取其值。这返回一个其反射对象（reflectee）为存储在字段中的对象的镜像。我们序列该对象并将其 ID 添加到结果列表中。点击此处查看代码图像\n\
  \n```\nList<int> serializeFields(ClassMirror cm, InstanceMirror im) {\n  List<int>\
  \ fields = new List<int>();\n  for (ClassMirror sc in superclasses(cm)) {\n    for\
  \ (Mirror m in sc.declarations.values) {\n      if (isInstanceField(m)) {\n    \
  \    fields.add(serializeObject(im.getField(m.simpleName).reflectee).id);\n    \
  \  }\n    }\n  }\n  return fields;\n}\n```\n\n注意我们使用的是 `declarations` 方法而不是 `instanceMembers`。虽然\
  \ `instanceMembers` 提供实例支持的接口，但 `declarations` 提供的是类本身声明的成员列表（相对于继承的内容）。而且尽管 `instanceMembers`\
  \ 总是方法的镜像（无论是 getter、setter 还是普通方法），`declarations` 还包含了实际声明的内容：字段以及构造函数。\n\n对于我们目前的目的，我们收集类的实际字段，因为它们定义了对象图。一旦获取了所有相关的声明，我们就使用下方的简单便利函数\
  \ `isInstanceField` 筛选出实例变量。点击此处查看代码图像\n\n```\nbool isInstanceField(Mirror m) =>\
  \ m is VariableMirror && !m.isStatic;\n```\n\n字段总是通过 `VariableMirror` 反射，没有其他种类的成员会被变量镜像反射。因此，我们可以通过测试镜像的类型来测试给定的声明是否为字段。变量镜像支持多种访问器，允许我们查询底层声明的属性。在这里我们使用\
  \ `isStatic` 来确保我们处理的是实例变量。\n\n我们概述的方法存在缺陷。由于历史原因，`getField(fieldName)` 实际上调用的是名为\
  \ `fieldName` 的 getter，而不是直接访问字段。因此，如果字段被同名的另一个字段隐藏，或者其 getter 被重写，就会出现问题。我们预计在不久的将来镜像库中纠正这种情况。\n\
  \n\n\n\n\n### 7.1.3.2 反序列化\n\n反序列化引入了额外的问题。\n\n点击此处查看代码\n\n```dart\nlibrary deserializer;\n\
  \nimport 'serializer.dart' as serializer show isInstanceField, SerializedList,\n\
  \                                            SerializedLiteral, SerializedObject;\n\
  import 'dart:mirrors' show ClassMirror, currentMirrorSystem, InstanceMirror,\n \
  \                                    LibraryMirror, MethodMirror, Mirror, MirrorSystem,\n\
  \                                     VariableMirror;\nimport 'dart:math' as math\
  \ show pow;\nimport '../grammars/CombinatorialParsing.dart' show CombinatorialParser,\n\
  \                                                                    ExecutableGrammar,\
  \ Token;\nMap<int, dynamic> dsos; // 反序列化的对象\nList<String> serializedForm;\n\nCombinatorialParser\
  \ parser = new SerializedObjectParser().serializedObject;\n\nint sid;\n```\n\n我们将反序列化的对象存储在一个名为\
  \ `dsos` 的映射中，并它们在序列化形式中的索引作为键。该映射最初为空。反序列化器简单地遍历序列化器生成的序列化形式，这只是一个字符串列表。我们依次使用\
  \ `deserializeString` 函数反序列化列表中的每个元素：\n\n点击此处查看代码\n\n```dart\ndeserialize(List<String>\
  \ sf) {\n  sid = 0;\n  dsos = {};\n  serializedForm = sf;\n  // 序列化形式是一个字符串列表。依次遍历每一个并\n\
  \  // 进行反序列化\n  for(String s in sf) {\n    deserializeString(s);\n    sid++;\n \
  \ }\n  return dsos;\n}\n\nvoid deserializeString(String s) {\n  if (dsos[sid] ==\
  \ null) {\n    deserializeObject(parser.parse(s));\n  }\n}\n```\n\n相应地，`deserializeString`\
  \ 将单个对象的序列化形式解析为 `SerializedObject`。它会检查当前对象 ID 是否已经解析，以便正确处理共享和循环引用。然后，它解析序列化形式并将其传递给\
  \ `deserializeObject`。该代码依赖于 `parse` 函数。在下一节中，我们将描述一个易于构建解析器的框架。然后我们将使用该框架定义 `parse`。在此期间，你必须相信\
  \ `parse` 能完成它的工作。\n\n理想情况下，我们希望在反序列化期间避免运行任何用户代码（例如构造函数）。然而，我们需要某种方法来创建正在反序列化的对象。在某些系统中，有一种机制可以在不执行构造函数的情况下分配类的原始实例。例如，在\
  \ Smalltalk 家族的语言中，类支持 `basicNew` 方法，在 JVM 上，`new` 字节码的作用也类似。在本文写作期间，Dart 尚未暴露此类功能。\n\
  \n使用 `basicNew` 或其等效方法，可以产生一个处于未初始化状态的实例。这是有问题的，因为它可能导致安全问题。因此，人们必须非常小心如何暴露此类功能。尽管如此，我们认为可以通过结构合理的镜像（mirrors）来暴露这种功能，特别是考虑到\
  \ Dart 镜像不承担任何安全角色。\n\n获得原始实例后，可以使用反射根据序列化对象的描述来设置其所有字段，从而实现对原始对象的精确反序列化。\n\n在没有\
  \ `basicNew` 的情况下，我们如何创建原始实例？我们将玩一个相当“脏”的招数。我们将调用构造函数，但向它传递特殊的代理对象作为参数。这些对象在响应所有方法调用时都会返回自身。\n\
  \n点击此处查看代码\n\n```dart\n@proxy class OmniProxy {\n  noSuchMethod(Invocation) => this;\n\
  }\n```\n\n`OmniProxy` 的实例将处理构造函数直接或间接调用的所有方法调用。当然，生成的对象处于完全不连贯的状态，但我们从 `basicNew`\
  \ 获得的原始对象也是如此。一旦拿到原始对象，我们将使用反射正确地设置其状态。\n\n点击此处查看代码\n\n```dart\ndeserializeObject(serializer.SerializedObject\
  \ so) {\n  if (so is serializer.SerializedList) {\n    return deserializeList(so);\n\
  \  }\n\n  // 查找对象所在的库\n  LibraryMirror lib = currentMirrorSystem.findLibrary(so.className);\n\
  \  if (lib == null) {\n    throw Exception(\"未找到库 ${so.className}\");\n  }\n\n \
  \ // 在库中查找类\n  ClassMirror cm = lib.declarations[so.className] as ClassMirror;\n\
  \  MethodMirror constructor = cm.declarations.values.firstWhere(\n    (d) => d is\
  \ MethodMirror && (d as MethodMirror).isConstructor,\n    orElse: () { throw Exception(\"\
  未找到 ${so.className} 的构造函数\") }\n  );\n\n  // 使用构造函数创建实例\n  List cargs = [];\n  for\
  \ (int i = 0; i < constructor.parameters.length; i++) {\n    cargs.add(new OmniProxy());\n\
  \  }\n\n  InstanceMirror im = cm.newInstance(cargs);\n  dsos[so.id] = im.reflectee;\n\
  \n  // 设置字段\n  Iterable fields = so.fields.map((f) => deserializeIndex(f));\n  setFields(im,\
  \ fields);\n\n  return im.reflectee;\n}\n```\n\n\n\n\n点击此处查看代码图像\n\n```dart\nint\
  \ setFields(InstanceMirror im, ClassMirror cm, Iterable fields) {\n  int fieldIndex\
  \ = 0;\n  // 遍历所有字段，包括超类\n  if (cm.superclass.reflectedType != Object) {\n    fieldIndex\
  \ = setFields(im, cm.superclass, fields);\n  }\n  for (VariableMirror vm in cm.declarations.values.where(serializer.isInstanceField)\
  \ {\n    im.setField(vm.simpleName, fields.elementAt(fieldIndex++));\n  }\n  return\
  \ fieldIndex;\n}\n```\n\n`setFields()` 方法填充通过实例镜像 `im` 指定的对象的字段。类镜像 `cm` 规定了应该填充哪些字段；只有由通过\
  \ `cm` 表示的类及其超类声明的字段才会被填充。字段本身通过一个可迭代对象 `fields` 指定。代码会沿着类链向上递归，直到到达 `Object` 的直接子类。众所周知\
  \ `Object` 不包含任何字段，因此没有必要访问它。对于访问的每个类，我们通过反射遍历实例变量，并使用 `setField` 方法逐个设置每个字段。我们使用\
  \ `fieldIndex` 来跟踪已处理的字段。\n\n我们概述的这种方法本质上是有局限性的。与 Dart 中所有的通用代理方案一样，它在存在类型测试和转换或在检查模式（checked\
  \ mode）下无法正常工作。如果构造函数依赖于副作用（它们不应该这样做），它的效果将大折扣。在某些特殊情况下，依赖参数之间标识性（或缺乏标识性）的构造函数可能也会困难。如果构造函数依赖于任何无法重定义的运算符，情况也是如此。\n\
  \n无论是否使用代理，通过反射设置字段都是问题的，因为 `setField` 实际上调用了 setter 方法，而该方法可能会被重写或隐藏。这与之前讨论过的 `getField`\
  \ 问题类似。最终，Dart 应该支持一种能够实际修改特定实例变量的反射操作。再次，我们这里的目的是教学，因此我们搁置了所有顾虑。\n\n### 7.1.4 示例：解析器组合器\
  \ (Parser Combinators)\n\n作为使用反射以及 Dart 编程的另一个示例，我们将查看解析器组合器。解析器组合器是由其他解析器组合成解析器的操作。例如，考虑一个用于标识符的简单\
  \ EBNF 产生式：\n\n`identifier` → `letter`(`letter`|`digit`)*\n\n我们将借助解析器组合器库 `combinatorialParsing.dart`\
  \ 的帮助在 Dart 中表示这一产生式。使用 `combinatorialParsing`，可以由解析字母的解析器和解析数字的解析器构建出一个用于此类标识符的解析器：\n\
  \n点击此处查看代码图像\n\n```dart\nvar identifier = letter & (letter | digit).star;\n```\n\
  \nDart 代码与 EBNF 规范非常接近。假设 `letter` 是解析单个字母的解析器，而 `digit` 是解析单个数字的解析器。\n\n解析器在其身上定义了几个运算符。其中是\
  \ `|`，它定义了*交替组合器*（alternating combinator）。它接受一个解析器作为输入参数，并返回一个新的解析器，该解析器接受接收者或参数接受的任何内容。因此，`letter`\
  \ | `digit` 将解析单个字母或单个数字。\n\n这里提出的交替解析器对应于 PEG[18] 中的交替运算符。它与 BNF 中的交替不同在于，它总是赋予其左侧操作数优先级。(3)\n\
  \n**3。** 使用 PEG 相比 BNF 的影响远超此本书的范范围。\n\n解析器还支持 `getter` 方法 `star`。在解析器 `p` 上调用 `star`\
  \ 的结果是一个新的解析器，该解析器将接受空字符串或 `p` 接受的任何次数的重复。由此，`(letter` | `digit).star` 解析一个零或多个字母或数字的字符序列。\n\
  \n最后，运算符 `&` 被定义为返回一个新的解析器，该解析器先解析接收者的内容，然后解析其参数解析的内容。`letter & (letter` | `digit).star`\
  \ 的最终效果是产生一个解析器对象，它解析一个字母，然后接受一个（可能是空的）字母或数字序列。\n\n这种方案的优之处在于它像 EBNF 记法一样具有组合性。实际上，我们现在有了一种用于定义解析器的领域特定语言，它非常接近通常用于语法的高级记法。\n\
  \n#### 7.1.4.1 完整的文法\n\n我们可以将整个语法定义为一个类，其中语法的每个产生式都是该类的成员。语法定义为 `ExecutableGrammar`\
  \ 的子类，该类是由 `combinatorialParsing` 提供的。单个解析器的类型均为 `CombinatorialParser`：\n\n点击此处查看代码图像\n\
  \n```dart\nclass ExampleGrammar1 extends ExecutableGrammar {\n  CombinatorialParser\
  \ digit, letter, id, identifier, expression;\n  ExampleGrammar1() {\n    digit =\
  \ charBetween('0', '9');\n    letter = charBetween('a', 'z') | charBetween('A',\
  \ 'Z');\n    id = (letter | digit).star;\n    identifier = tokenFor(id);\n    expression\
  \ = identifier;\n  }\n}\n```\n\n`charBetween()` 方法继承自 `ExecutableGrammar`；它接受两个字符串并产生一个接受该范围内字符的解析器。`tokenFor()`\
  \ 方法也是继承的。它根据输入产生一个标记解析器。标记解析器会忽略空格。因此，框架允许我们处理空格。\n\n##### 7.1.4.2 语法子类与相互递归\n\n\
  让我们扩展我们的语法。好处在于，由于语法是类，我们可以像扩展类一样扩展它们——通过继承：\n\n点击此处查看代码图像\n\n```dart\nclass ExampleGrammar2\
  \ extends ExampleGrammar1 {\n  CombinatorialParser keywordIf, keywordThen, keywordElse,\
  \ keywordReturn, statement;\n  ExampleGrammar2() {\n    keywordIf = tokenFromSymbol('if');\n\
  \    keywordThen = tokenFromSymbol('then');\n    keywordElse = tokenFromSymbol('else');\n\
  \    keywordReturn = tokenFromSymbol('return');\n    returnStatement = keywordReturn\
  \ & expression;\n    ifStatement = keywordIf & expression & keywordThen & statement\
  \ & keywordElse & statement;\n    statement = ifStatement | returnStatement;\n \
  \ }\n}\n```\n\n上述语法的一个有趣特性是它具有相互递归产生式。这在语法中很常见，但它产生了一个问题。当 `ifStatement` 字段初始化时，将调用\
  \ `statement` 的 getter，但它尚未被初始化，因此其值为 `null`。更改声明的顺序没有帮助，因为那时 `statement` 的初始化将尝试调用为\
  \ `null` 的 `ifStatement`。那么，上述代码应该如何工作？\n\n一种方法是不允许前向引用，但这是不可接受的。另一种方法是通过闭包指定产生式。在我们的情况下，只需将\
  \ `ifStatement` 定义为闭包即可。\n\n点击此处查看代码图像\n\n```dart\nifStatement = () => keywordIf\
  \ & expression & keywordThen & statement & keywordElse & statement;\n```\n\n当然，现在标识符\
  \ `ifStatement` 返回的是闭包而不是解析器，必须调用该函数来提取所需的解析器。我们必须更改引用 `ifStatement` 的方式：\n\n\n\n\
  \n\n点击此处查看代码图像\n\n```\nstatement = ifStatement() | returnStatement;\n```\n\n这些更改是有问题的。并不是所有的产生式（productions）都以相同的方式表示，这在引用产生式时会引起困惑。我们可以决定对所有产生式始终使用闭包，但使用闭包在产生式的定义和使用处都会增加样板代码，使得我们的内部\
  \ DSL 变得不那么吸引人。\n\n### 7.1.4.3 使用反射的前向引用解析器\n\n我们可以使用反射来解决这个问题。我们将语法对象的所有字段初始化为特殊的*前向引用解析器*（forward\
  \ reference parsers）。这些解析器将支持普通解析器支持的所有组合器（combinators），因此初始化代码可以顺利运行。当开始实际解析时，向前引用解析器会查找它们所引用的解析器的最新值并据此进行解析。\n\
  \n初始化字段为向前引用解析器的代码是解析器组合器库的一部分。具体而言，`ExecutableGrammar` 的构造函数将语法对象的所有字段设置为适当的前向引用解析器。由于库并不知道实际的语法，我们需要通过反射来发现这些字段并设置它们。\n\
  \n点击此处查看代码图像\n\n```\nabstract class ExecutableGrammar extends CombinatorialParser\
  \ {\n\n   Map forwardReferenceTable = new Map();\n\n   InstanceMirror selfMirror;\n\
  \n   ExecutableGrammar() {\n      selfMirror = reflect(this);\n      setupForwardReferences;\n\
  \n      bindForwardReferences;\n   }\n}\n```\n\n构造函数首先获取它正在创建的实例的镜像（mirror）。该镜像存储在\
  \ `selfMirror` 中，供 `setUpForwardReferences` 使用，该例程会将向前引用解析器分配给 `this` 的所有实例变量。最初，向前引用解析器并不知道它们将转发到哪个解析器；如果我们在创建向前引用解析器时就知道这一点，那么根本就不需要向前引用解析器了。只有在用户定义的语法构造函数设置了所有实例变量后，我们才能真正将每个向前引用解析器绑定到它应该转发的解析器上。\n\
  \n显然，我们需要能够枚举语法所有的产生式，以便以便将向前引用解析器分配给它们对应的实例变量。我们使用一个私有工具方法 `allProductions` 来获取这些产生式。它依赖反射来遍历所有实例变量。\n\
  \n点击此处查看代码图像\n\n```\nList<VariableMirror> get allProductions {\n\n   List<VariableMirror>\
  \ allProductions = new List();\n\n   ClassMirror gc = selfMirror.type;\n\n   while\
  \ (gc.simpleName != #ExecutableGrammar) {\n      allProductions.addAll(gc.declarations.values.where(isInstanceField));\n\
  \      gc = gc.superclass;\n   }\n\n   return allProductions;\n}\n```\n\n镜像库允许我们枚举单个类的声明。我们需要向上爬取类型层级以收集所有的声明。我们沿着类型层级向上爬到\
  \ `ExecutableGrammar`。这允许我们收集框架用户定义的所有字段，并忽略框架自身的不存储解析器的字段。\n\n使用 `_allProductions`，`setupForwardReferences`\
  \ 遍历所有的语法产生式，为每个产生式分配一个新的 `ForwardReferenceParser` 实例。\n\n实际使用的解析器将在子类构造函数的体中定义，该体稍后运行。显然，正如刚才提到的，在这一阶段我们不知道每个\
  \ `ForwardReferenceParser` 将转发到哪个解析器。\n\n当子类构造函数运行时，它将实际的解析器分配给各种实例变量。在分配过程中，它将覆盖每个字段中存储的前向引用解析器。然而，我们之后需要找到这些向前引用解析器，将它们绑定到真实的解析器。因此，每当创建一个\
  \ `ForwardReferenceParser` 时，我们将其存储在映射 `forwardReferenceTable` 中，并以字段名为键。\n\n点击此处查看代码图像\n\
  \n```\nget setupForwardReferences {\n\n   /* 遍历所有实例变量并设置为新的前向引用 */\n   /* 如果这些不对应产生式，它们将被子类覆盖\
  \ */\n   for (VariableMirror slot in _allProductions){\n      Symbol iv = slot.simpleName;\n\
  \      var fref = new ForwardReferenceParser();\n      /* 假设 ExecutableGrammar 子类中定义的所有槽\n\
  \       * 都是产生式。如果它们有其他用途，将被覆盖。\n       * 只有当子类定义了同名的字段时，才会失败。\n       * */\n  \
  \    forwardReferenceTable[iv] = fref;\n      selfMirror.setField(iv, fref);\n \
  \  }\n}\n```\n\n在子类构造函数运行之后，我们希望向前引用解析器绑定到它们的目标。问题是，在那时，`ExecutableGrammar` 的构造函数已经执行完毕，我们没有机会再次遍历这些解析器。\n\
  \n为了克服这个困难，每个向前引用解析器都有一个 `bindingRoutine` 字段，它持有一个闭包。当 `ForwardReferenceParser`\
  \ 第一次被请求时，它会检查自己是否已经绑定到目标；如果没有，它会调用 `bindingRoutine`。\n\n在 `setupForwardReferences`\
  \ 中，我们将所有解析器的 `bindingRoutine` 设置为 `finalForwardReferences`：\n\n点击此处查看代码图像\n\n```\n\
  // 前向引用\nget setupForwardReferences {\n   for (var v in forwardReferenceTable.values)\
  \ {\n      v.bindingRoutine = () => finalForwardReferences;\n   }\n}\n\nget finalForwardReferences\
  \ {\n   forwardReferenceTable.forEach((k, v){\n      var p = getRealField(k);\n\
  \      if (p is CombinatorialParser) {\n         v.bind(p);\n         p.name = MirrorSystem.getName(k);\n\
  \      }\n   });\n}\n```\n\n`finalForwardReferences` 方法实际上绑定了所有的解析器，因此实际上，它只会被第一个需要解析内容的向前引用解析器调用。该方法遍历\
  \ `forwardReferenceTable`，并将向前引用解析器设置为存储在字段中的值。当然，这可行是因为 `finalForwardReferences`\
  \ 在语法完全完成后才被调用。\n\n我们再次使用反射来获取想要绑定的目标解析器。该解析器存储在字段中，该字段名为我们要绑定的向前引用解析器的映射项键。\n\n\
  点击此处查看代码图像\n\n```\nCombinatorialParser getRealField(Symbol k){\n  /*\n   * 如果当前类有\
  \ getter k 但没有字段\n   * 则假设其 getter k 覆盖了存储在父类字段中的产生式\n   * 并带有包装解析器。\n   * */\n\
  \  var p = selfMirror.getField(k).reflectee;\n  if (selfMirror.type.getters.containsKey(k)\
  \ &&\n      selfMirror.type.declarations.values.where(isInstanceField).isEmpty())\n\
  \    return p.parser;\n  else return p;\n}\n```\n\n\n\n\n\n点击此处查看代码图像\n\n```dart\n\
  class SerializedObjectGrammar extends ExecutableGrammar {\n  CombinatorialParser\
  \ comma, decimal, digit, dot, doublequote, id, identifier,\n                   \
  \   integer, lbracket, letter, libName, list, literal, lparen,\n               \
  \       nonliteral, number, rbracket, rparen, serializedObject, slash,\n       \
  \               space, string, stringContent, sym, truth, underscore, untruth;\n\
  \  SerializedObjectGrammar() {\n    comma = token(',');\n    dot = token('.');\n\
  \    doublequote = token('\"');\n    lbracket = token('[');\n    rbracket = token(']');\n\
  \    lparen = token('(');\n    rparen = token(')');\n    slash = token('/');\n \
  \   space = char(' ');\n    underscore = char('_');\n    digit = charBetween('0',\
  \ '9');\n    letter = charBetween('a', 'z') | charBetween('A', 'Z');\n    integer\
  \ = tokenFor(digit.plus);\n    decimal = tokenFor(digit.plus & char('.') & digit.plus);\n\
  \    number = decimal | integer;\n    id = ((letter | underscore) & (letter | digit\
  \ | underscore).star).wrapper(\n          (fst, snd) => '$fst${ new StringBuffer()..writeAll(snd)}'\n\
  \    );\n    identifier = tokenFor(id);\n    truth = token('true');\n    untruth\
  \ = token('false');\n    stringContent = (letter | digit | underscore | space).star;\n\
  \    string = doublequote & stringContent & doublequote;\n    sym = token('Symbol')\
  \ & lparen & doublequote & identifier\n          & doublequote & rparen;\n    literal\
  \ = truth | untruth | number | sym | string;\n    list = lbracket & integer.star\
  \ & rbracket;\n    libName = identifier & (dot & identifier).star;\n    nonliteral\
  \ = libName & slash & identifier & lparen & integer.star & rparen;\n    serializedObject\
  \ = literal | list | nonliteral;\n  }\n}\n```\n\n接下来，我们定义 `SerializedObjectGrammar`\
  \ 的子类来生成 AST。在我们的案例中，AST 非常简单。它由 `SerializedObject` 实例和字面量组成：\n\n点击此处查看代码图像\n\n\
  ```dart\nclass SerializedObjectParser extends SerializedObjectGrammar {\n  _computeIntFrom(List\
  \ ints) {\n    int val = 0;\n    int j = 0;\n    for (int i = ints.length-1; i >=\
  \ 0; i–) {\n      val += int.parse(ints[j++]) * math.pow(10, i);\n    }\n    return\
  \ val;\n  }\n  _computeFractionFrom(List ints) {\n    num val = 0;\n    for (int\
  \ i = 0; i < ints.length; i++) {\n      val += int.parse(ints[i]) / math.pow(10,\
  \ i+1);\n    }\n    return val;\n  }\n  CombinatorialParser get integer {\n    return\
  \ super.integer.wrapper((Token ints) {return computeIntFrom(ints.token});});\n \
  \ }\n  CombinatorialParser get truth => super.truth.wrapper((t) => true);\n  CombinatorialParser\
  \ get untruth => super.untruth.wrapper((f) => false);\n  CombinatorialParser get\
  \ decimal {\n    return super.decimal.wrapper((d){\n              return computeIntFrom(d.token[0])\
  \ + computeFractionFrom(d.token[2]);\n            });\n  }\n  CombinatorialParser\
  \ get string {\n    return super.string.wrapper((lq, s, rq){\n              return\
  \ s.fold('', (String s1, String s2) => s1 + s2);\n            });\n  }\n  CombinatorialParser\
  \ get sym {\n    return super.sym.wrapper((f, lp, ldq, s, rdq, rp){\n          return\
  \ MirrorSystem.getSymbol(s.token);\n        });\n  }\n  CombinatorialParser get\
  \ libName {\n    return super.libName.wrapper((Token hd, List tail) {\n      List\
  \ l = [hd.token];\n      l.addAll(tail.map((List pair) => pair[0].token + pair[1].token));\n\
  \      String ln = l.reduce((String s1, String s2) => s1 + s2);\n      Symbol h\
  \ = MirrorSystem.getSymbol(ln);\n      return h;\n    });\n  }\n  CombinatorialParser\
  \ get nonliteral {\n    return super.nonliteral.wrapper(\n      (Symbol libId, sl,\
  \ Token classId, lp, List ints, rp) {\n        Symbol c = MirrorSystem.getSymbol(classId.token);\n\
  \        var dso = new serializer.SerializedObject(sid, libId, c);\n        dso.fields\
  \ = ints;\n        return dso;\n      });\n  }\n  CombinatorialParser get literal\
  \ {\n    return super.literal.wrapper((l) {\n      return new serializer.SerializedLiteral(sid,\
  \ l);\n    });\n  }\n  CombinatorialParser get list {\n    return super.list.wrapper((lb,\
  \ elems) {\n      serializer.SerializedList res = serializer.SerializedList(sid);\n\
  \      res.fields = elems;\n      return res;\n    });\n  }\n}\n```\n\n### 7.1.4\
  \ 使用 `noSuchMethod` 代替反射\n\n正如在 Section 7.1.1 中提到的，反射会带来显著的开销。是否有其他不需要反射的方法？有的，我们可以利用\
  \ `noSuchMethod`。这种方法在 `RunnableGrammar` 类中所示：\n\n点击此处查看代码图像\n\n```dart\nabstract\
  \ class RunnableGrammar extends CombinatorialParser {\n  Map<Symbol, ForwardReferenceParser>\
  \ forwardTable =\n  // so values have type dynamic\n  Map<Symbol, dynamic> productions\
  \ = new Map<Symbol, dynamic>();\n  // non-parsers 可能通过 noSuchMethod \n  RunnableGrammar();\n\
  \  noSuchMethod(im) {\n    // 如果是 getter，在 productions map 中查找\n    // 如果缺失，则安装一个转发器并返回\n\
  \    if (im.isGetter) {\n      var result;\n      return (result = productions[im.memberName])\
  \ == null ?\n        setupForwardReference(im.memberName) : result;\n    };\n  \
  \  // 如果是 setter，在 productions map 中安装\n    if (im.isSetter) {\n      // 必须小心，因为\
  \ setter 名称和 getter 名称末尾不同！\n      String setterName = MirrorSystem.getName(im.memberName);\n\
  \      Symbol fieldName =\n        new Symbol(setterName.substring(0, setterName.length\
  \ - 1));\n      return productions[fieldName] = im.positionalArguments[0];\n   \
  \ };\n    // 否则调用 super\n    return super.noSuchMethod(im);\n  }\n  ForwardReferenceParser\
  \ setupForwardReference(productionName) {\n    ForwardReferenceParser fref = new\
  \ ForwardReferenceParser();\n    fref.bindingRoutine = () => finalForwardReferences;\n\
  \    return productions[productionName] =\n        forwardTable[productionName]\
  \ = fref;\n  }\n  // 转发\n  get finalForwardReferences {\n    forwardTable.forEach((k,\
  \ v) {\n      var p = productions[k];\n      if (p is CombinatorialParser) {\n \
  \       v.bind(p);\n        p.name = MirrorSystem.getName(k);\n        /* 命名 productions\
  \ 的好地方 */\n      }\n    });\n  }\n}\n```\n\n在这里，过程的核心是 `noSuchMethod`。产生器存储在 `productions`\
  \ map 中，从产生器名称到解析器。任何设置产生器的尝试都会将其值插入 map。当引用产生器时，会在 map 中查找。\n\n```dart\nclass ExampleGrammar3\
  \ extends RunnableGrammar {\n  ExampleGrammar3() {\n    digit = charBetween('0',\
  \ '9');\n    letter = charBetween('a', 'z') | charBetween('A', 'Z');\n    id = letter\
  \ & (letter | digit).star;\n    identifier = tokenFor(id);\n    expression = identifier;\n\
  \  }\n}\n```\n\n我们不再需要依赖反射，这意味着如果我们部署到 JavaScript，我们的下载量会更小。\n\n然而，我们失去了类型检查的优势。此外，实际解析将变慢，因为所有对产生器的访问都通过\
  \ `noSuchMethod` 完成，这比普通的 getter 调用要慢得多。\n\n\n\n\n\n总而言之，在 Dart VM 上使用反射（reflection）可能是更好的选择，但在通过\
  \ Javascript 部署时，使用 `noSuchMethod` 可能会更合适。当然，人们也可以选择完全不同的方法，例如外部 DSL。一个很有前景的替代方案是使用支持代码生成的反射库；我们将在第\
  \ 7.4 节中探讨该选项。\n\n### 7.2 为什么使用镜像（Mirrors）\n\nDart 使用基于镜像的反射。在语言中，处理反射有其他替代方法。为什么\
  \ Dart 选择使用镜像呢？\n\n人们常说，计算中的每一个问题都可以通过增加一层间接层来解决。镜像就是一个很好的例子。\n\n镜像有助于反射性代码和库的部署；通过将反射功能移动到单独的组件中，可以更容易识别是否使用了反射，从而判断反射代码是否需要保留在部署后的代码中。\n\
  \n在分布式系统中进行反射时，镜像是非常有用的。与直接通过处理类等实际实现产物来 get 反射的方法不同，镜像允许同时支持多种不同的实现。特别是，可以支持某些镜像实现，它们作为独立地址空间（无论是另一个\
  \ actor、进程还是远程机器）中代码和对象的代理。\n\n作为独立的对象，镜像充当了反射的“能力”（capabilities），因此与对象-能力安全模型天然契合。\n\
  \n前两个考虑与 Dart 有关；最后一个则不然，因为 Dart 的安全性是基于隔离器（isolates）的。关于镜像的详细讨论，请参见本章末尾的相关工作部分（7.6）。\n\
  \n### 7.3 元数据（Metadata）\n\nDart 中的声明可以使用元数据注解进行装饰。元数据在声明之前给出。元数据注解以 `@` 符号（`@`）开头，后跟对常量变量的引用或对常量构造函数的调用。可以给出多个注解：\n\
  \n点击此处查看代码图像\n\n```dart\n@deprecated prematureOptimization(x) { ... }\n\n@specialToLib1\
  \ @ImportantToLib2(4) class MyClass {\n  @override toString() => 'I am in a class\
  \ of my own';\n}\n```\n\n可以通过反射在运行时访问元数据。`dart:mirrors` 中的 `DeclarationMirror` 类有一个访问器\
  \ `metadata`，它返回一个列表，包含与声明相关的各种注解值的镜像。\n\n如果不是动态访问元数据，那么它不应该产生任何开销；一个良好的实现在被请求元数据之前会忽略它。由于元数据完全由常量组成，其值不依赖于程序状态，因此可以在任何时间进行计算并得到相同的结果。特别是，元数据可以按需求值，从而避免对未使用的注解产生任何开销。\n\
  \n在许多情况下，元数据根本不需要动态访问。工具可以可以静态地、离线地解析代码，并根据需要利用元数据注解。\n\n我们现在来看一个通过反射性地访问元数据以获得某些优势的示例。\n\
  \n## 7.4 通过代码生成反射\n\n如上述，当部署到不支持良好的 Dart 虚拟机的平台（例如 Web 或 iOS）时，使用反射在空间开销上可能是高昂的。在许多情况下，我们可以调整代码来处理这个问题。\n\
  \n为了防止部署应用程序的大小发生爆炸，实现部分需要知道哪些代码正在被反射地访问，以及如何访问。为此，Dart 支持一个替代镜像库 `reflectable`。`reflectable`\
  \ 要求被反射的代码必须带有特定元数据的注解。元数据描述了在反射被注解的代码时必须支持哪些能力。例如，是否应该能够通过反射调用类的成员、或者分析它们的结构、或者遍历类的父类型链等。\n\
  \n我们将使用上面所示的解析器组合库来阐明 `reflectable` 的用法。\n\n理想情况下，一旦所需的注解就绪，部署的代码应该在按预期运行的同时，体积要小得多。在实践中，`reflectable`\
  \ 和 `dart:mirrors` 之间仍然存在不兼容之处。因此，我们必须对代码进行一些微调。\n\n我们的第一步是导入 `reflectable`，并导入它的镜像库而不是标准库。\n\
  \n点击此处查看代码图像\n\n```dart\nimport 'package:reflectable/reflectable.dart' show\n  \
  \  declarationsCapability, instanceInvokeCapability, Reflectable,\n    TypeCapability,\
  \ typeRelationsCapability;\nimport 'package:reflectable/mirrors.dart' show ClassMirror,\
  \ InstanceMirror, Mirror,\n    VariableMirror;\n```\n\n下一步是定义我们需要的反射能力集。例如，我们需要反射地获取语法法实例的类型的能力。`reflectable`\
  \ 为此目的定义了 `TypeCapability` 类。具体来说，`TypeCapability` 的构造函数接受一个常量 `t` 作为参数，并产生一个代表反射地获取\
  \ *t* 实例类型的对象：点击此处查看代码图像\n\n```dart\nconst grammarTypeCapability = TypeCapability(ExecutableGrammar);\n\
  ```\n\n`reflectable` 也为某些能力提供了预定义的常量。这里我们使用了 `declarationsCapability`、`typeRelationsCapability`\
  \ 和 `instanceInvokeCapability`。第一个允许我们访问类的结构，第二个允许我们遍历类型层级，最后一个则允许调用成员。\n\n为了利用这些能力，我们需要创建一个拥有这些能力的能力的镜像系统。`reflectable`\
  \ 的镜像系统是 `Reflectable` 的子类实例。我们将定义 `Grammar` 来描述一个支持这些所需能力的镜像系统：点击此处查看代码图像\n\n```dart\n\
  const grammar = const Grammar();\nclass Grammar extends Reflectable {\n  const Grammar()\
  \ : super(declarationsCapability,\n    instanceInvokeCapability,\n    typeRelationsCapability,\n\
  \    grammarTypeCapability);\n}\n```\n\n我们需要用 `@grammar` 注解语法类，从而让 `reflectable`\
  \ 知道这些类可以通过反射访问，正如 `Grammar`（`grammar` 的类）所指定的样：点击此处查看代码图像\n\n```dart\n@grammar\
  \ abstract class ExecutableGrammar extends CombinatorialParser {...\n```\n\n`dart:mirrors`\
  \ 和 `reflectable` 之间还存在一些 API 不兼容之处。`getField` 和 `setField` 方法命名不当。在 `reflectable`\
  \ 中，这些分别被重命名为 `invokeGetter` 和 `invokeSetter`。我们需要在几处修改代码：4。未来的 `dart:mirrors` 版本将解决这个问题。点击此处查看代码图像\n\
  \n```dart\nCombinatorialParser getRealField(String k){\n  /* 一个为了绕过 Dart 镜像库缺陷的粗略方法。\n\
  \  * 如果当前类有 getter k 但没有字段 k\n  * 那么假设它的 getter k 覆盖了存储在父类字段中的生产 k\n  * 并对字段内容进行了包装解析器。\n\
  \  * */\n  var p = selfMirror.invokeGetter(k);\n  if (selfMirror.type.instanceMembers.containsKey(k)\
  \ &&\n      selfMirror.type.declarations.values.where(isInstanceField).isEmpty)\n\
  \    return p.parser;\n  else return p;\n}\n\nget setupForwardReferences {\n  /*\
  \ 遍历所有非空实例变量并将它们设置为新的前向引用 */\n}\n```\n\n\n\n\n```javascript\n /* If these do not\
  \ correspond to productions, they will be overridden by the subclass */\n\n _allProductions.forEach((VariableMirror\
  \ slot){\n\n   String iv = slot.simpleName;\n\n   var fref = new ForwardReferenceParser();\n\
  \n   forwardReferenceTable[iv] = fref;\n\n   /* set iv to fref */\n\n   selfMirror.invokeSetter(iv,\
  \ fref);\n\n });\n\n}\n```\n\n此外，`reflectable` 使用字符串而非符号来命名声明。由于 `reflectable` 已经处理了部署问题，因此它并不关注针对混淆（minification）的优化。这使得使用更加简单。\n\
  \n点击此处查看代码图片\n\n```dart\nList<VariableMirror> get allProductions {\n   List<VariableMirror>\
  \ allProductions = new List();\n\n   ClassMirror gc = selfMirror.type;\n   while\
  \ (gc.simpleName != 'ExecutableGrammar') {\n     allProductions.addAll(gc.declarations.values.where(isInstanceField));\n\
  \     gc = gc.superclass;\n   }\n   return allProductions;\n}\n```\n\n最后，我们还需要在客户端代码上添加\
  \ `grammar` 注解：^(5)\n\n**5.** 事实上，`reflectable` 有一种可以避免这种情况的方法，但目前尚未实现。\n\n点击此处查看代码图片\n\
  \n```dart\nimport 'parsing.dart' show CombinatorialParser, ExecutableGrammar, grammar;\n\
  \n@grammar class ExampleGrammar1 extends ExecutableGrammar {..}\n```\n\n我们可以像以前一样运行示例。默认情况下，`reflectable`\
  \ 在后台使用 `dart:mirrors`。然而，我们可以根据我们提供的反射能力注解，构建一个针对部署进行了优化的应用程序版本。结果是文件体积大幅减小（对于我们的示例来说，缩小了一个数量级）。压缩又带来了近乎另一个数量级的缩小。^(6)\n\
  \n**6.** 在写本文时，对于我们的解析示例，我们看到翻译后的 JavaScript 代码大小从 2Mb 以上减少到 174Kb，进一步压缩到 30Kb。\n\
  \n一种合理的策略是使用 `dart:mirrors` 开发应用程序，并使用 `reflectable` 进行部署。事实上，`reflectable` 可以直接在\
  \ Dart 运行时使用，在这种情况下它将其工作转发给 `dart:mirrors`。因此，我们可以从一开始就使用 `reflectable` 编写应用程序。缺点是我们需要在流程早期指定反射能力。然而，我们可以在构建应用程序的过程中逐渐指定所需的属性。优点是我们不需要转换应用程序。我们预计，随着\
  \ `reflectable` 包的成熟和完善，使用它将成为一个日益受欢迎的选项。\n\n### 7.5 超越内省\n\n反射最令人兴奋的应用之一是那些涉及反射式变更的应用——即时修改或添加代码。反射式变更的主要用例是在开发期间。一个支持反射式变化的系统让实现实时\
  \ IDE 变得容易得多。\n\nDart 支持反射式变更一直是其意图。在写本文时，只有一个实验性的 Dart 实现（代号 Fletch）支持这一功能。然而，我们预计这将随时间推移而改变。\n\
  \n开发期间反射式变更显而易见的应用是它实现了实时评估器。这些评估器可以像经典的读取-评估-打印循环（REPL），也可以更丰富，例如允许在特定实例作用域内进行评估的对象检查器。反射式变更另一个标准用法是“修复并继续”（fix-and-continue）调试。值得注意的是，真正的实时环境允许修改各种类型的声明，而不仅仅是方法和函数。例如，应该能够添加、删除或重命名字段，并使更改立即在所有现有实例上生效。\n\
  \n在添加或重命名字段时，必须考虑它是如何初始化的。反射式变更机制应该提供更新现有实例的方法，使其不仅具有声明的槽位，而且这些槽位具有适当的值。\n\n在生产环境中使用反射式变更要有争议得多。此类用法的一个例子是程序员定义的动态加载版本。另一个是基于\
  \ `noSuchMethod` 的优化设计，例如代理。可以在第一次调用方法时添加自定义版本的方法，从而避免后续调用中 `noSuchMethod` 用的开销（代价是第一次调用的巨大开销）。最引人注目的是，人们可能会选择在运行时更新已部署的应用程序，而无需重启它们。\n\
  \n然而，在生产环境中支持反射式变更确实引发了问题。你不再能确定应用程序的代码是什么，并且可能存在安全疑虑。反射式变更机制的性能需求也更高。\n\n### 7.6\
  \ 相关工作\n\n面向对象编程中反射的历史根于 Smalltalk。Smalltalk 模型的变体被其他语言采用。CLOS 通过元对象协议（metaobject\
  \ protocol）丰富了它，而 Java 限制了它，C# 也紧随其后。\n\n后来的脚本语言通过故意向程序员暴露结构，以非结构化的方式支持反射。镜像（mirrors）的概念引入于\
  \ Self[19]。Self 模型被引入到基于类的系统中，首先在 Strongtalk 中，后来在 Java 平台的某些部分（如 JDI 和 APT）。最近，Newspeak\
  \ 引入了镜像系统，旨在实现 [20] 中概述的所有优势。Dart 系统是 Newspeak 的后代，但在许多方面有所不同。Dart 的隔离间通信与 Newspeak\
  \ 不同，导致 API 分为本地和隔离间版本。\n\n这里使用的解析组合器库基于 [21] 中首次描述的版本。\n\n数据在 .Net 中流行，随后被引入 Java。Dart\
  \ 元数据的独特之处在于它利用了常量。\n\n### 7.7 总结\n\n镜像将反射功能位于被反射对象之外，相比旧的反射 API 提供了更好的部署、分布和安全支持。Dart\
  \ 镜像目前支持内省和反射执行代码；未来我们希望还能提供修改实时程序的能力。\n\n# 第 8 章 异步与隔离\n\n到目前为止关注的是顺序执行的 Dart 程序。然而，大多数\
  \ Dart 程序都是并发的。\n\n一个 Web 应用程序通常包含两个并发部分——运行在用户设备浏览器中的客户端程序，以及运行在浏览器外的服务器程序（通常在互联网另一端的计算机上）。许多服务器端程序同时为多个客户端。这些是典型场景。\n\
  \n在本章中，我们将关注支持并发和分布的 Dart 特性。 的并发基于隔离（isolates）[8.4]，而隔离又构建在未来（futures）[8.2] 和流（streams）[8.3]之上。\n\
  \n### 8.1 异步\n\n\n\n\n当在 Dart 中调用方法或执行函数时，调用者会等待被调用者求值完毕并返回结果。在被调用者执行期间，调用者会被`blocked`（阻塞）。函数调用非常像电话通话，调用者等待对方接听。调用是一种`synchronous`（同步）通信——调用者和被调用者在时间上同步它们的活动。\n\
  \n相比之下，在`asynchronous`（异步）通信中，调用者发起操作但不等待其完成，而是立即继续执行。异步通信可能合适的场景示例包括输入或输出任务，在这些情况下，请求的操作可能很慢，等待操作完成是不理想的。\n\
  \n异步是 Dart 并发方法的核心。Dart 既支持单个隔离器（isolate）内部的异步，也支持多个隔离器之间的异步。\n\n跨隔离器通信基于异步消息传递。在基本形式中，消息传递是一种“发出去就不不管”的活动。发送者无法确保消息已已接收，也无法确定是否会给予响应。这好比通过旧式邮政寄信。人们可以通过发送消息来启动某些操作，但不知道该操作是否已执行，如果执行了，是否成功。你显然无法得知成功时的结果值是什么，也无法失败时抛出了什么错误。这是不令人满。应用程序需要能够监控并响应它们发起的异步活动。为了满足这一需求，我们使用了\
  \ futures。\n\n### 8.2 Futures（未来）\n\n`future` 是一个对象，代表一个可能尚未发生的计算结果。结果可能在未来的某个时间已知，因此命名为“future”（未来）。Futures\
  \ 在异步计算中非常有用。一旦发起了执行异步计算的请求，就可以立即以同步的方式返回一个 future，并将实际计算调度在稍后的时间执行。future 为请求异步操作的代码提供了一个句柄，即对请求计算的引用。在请求的计算完成后，可以使用\
  \ future 获取结果。我们说该 future `has been completed`（已完成），或者换说，`has been resolved`（已解析）。\n\
  \n在 Dart 中，futures 通过 `dart:async` 库中的 `Future` 类实现。`Future` 是一个泛型类，类型参数 `T` 代表\
  \ future 完成时的值类型。\n\n### 8.2.1 消费 Futures\n\nFutures 拥有一个实例方法 `then()`，它接受一个闭包 `onValue`\
  \ 作为参数。当 future 成功完成时，该闭包将被调用。闭包本身接受一个类型为 `T` 的参数，即 future 所代表的计算类型。因此，当 future\
  \ 完成时，它所代表的值将传递给 `onValue`。\n\n例如，假设我们有一个想要复制的文件。`File` 对象支持用于复制文件的异步 API：\n\n**[1].**\
  \ 这里我们指的是在 `dart:io` 中定义的 `File` 类，而不是在 `dart:html` 中定义的类，后者的 API 完全不同。\n\n[点击此处查看代码图片]\n\
  \n```\nFuture<File> copy(String newPath)\n```\n\n如果我们在 `File` 上调用 `copy()`，我们会得到一个\
  \ future。异步 API 的优势是，人们可以启动大文件的复制，而无需等待复制完成。缺点是，如果我们实际上想对复制的文件做某些事情，情况就会变得复杂一些，因为我们必须与\
  \ futures 交互。\n\n一个简单的测试可以断言：如果我们有一个文件并在 `myPath` 处创建一个副本，结果文件的路径确实是 `myPath`。由于\
  \ `copy()` 的结果是一个关于文件的 future 而不是文件本身，我们不能直接写：\n\n[点击此处查看代码图片]\n\n```\nassert(myFile.copy(myPath).path\
  \ == myPath);\n```\n\n正确的代码是：\n\n[点击此处查看代码图片]\n\n```\nmyFile.copy(myPath).then((f){\
  \ assert(f.path == myPath);});\n```\n\n文件系统完成复制后，`copy()` 返回的 future 将带有一个实际的 `File`\
  \ 对象完成，传递给 `then()` 的闭包将带有该 `File` 实例被调用，从而触发断言。到那时，Dart 的执行早已继续运行。\n\n如果一个 future\
  \ `f1` 代表产生另一个 future `f2` 的计算呢？如果结果本身是一个 future，那么仅仅让 `f1` 完成是不够的。我们会调用 `onValue`，但被迫测试传入的参数是否为\
  \ future，并通过另一个 `then()` 来处理它，以此往复。相反，在这种情况下，`f1` 的完成依赖于 `f2` 的完成。当 `f2` 以一个非 future\
  \ 的值完成时，`f1` 将以相同的值完成。我们说这些 futures 是`chained`（链式的），因为它们形成了一个依赖链。\n\nFutures 也可以代表失败的计算。futures\
  \ 上也定义了 `catchError()` 方法，它同样接受一个闭包作为输入。如果 future 代表的计算抛出异常，则闭包 `onError` 将被调用。\n\
  \n### 8.2.2 Production Futures\n\n原则上，需要向调用者返回 future 的代码必须完成几件事。它必须调度一个计算在稍后的某个时间执行，它必须实例化\
  \ `Future` 实例，并且必须将该实例与调度的计算关联，以便当调度的计算完成后，future 将带有结果完成。必须捕获调度计算抛出的任何异常，并用相应的错误完成\
  \ future。\n\n`Future` 的构造函数为我们管理所有这些记账工作。代码大致如下：\n\n[点击此处查看代码图片]\n\n```\nFuture(Function\
  \ computation){\n  Timer.run(() =>\n    try {\n      _completeWithValue(computation());\n\
  \    }\n    catch (e){\n      _completeWithError(e);\n  });\n}\n```\n\n位于 `dart:async`\
  \ 中的 `Timer` 类有一个静态方法 `run()` 用于调度代码。`Future` 构造函数接受闭包 `computation`，封装用户想要调度的计算。然而，实际调度的任务是一个闭包，旨在捕获\
  \ `computation` 的结果（无论成功失败），并完成相应的 `Future` 实例。完成通过 `completeWithValue()` 等私有方法进行。我们不想将这些方法暴露给\
  \ futures 的消费者；此类消费者不需要也不应该影响返回给它们的 future 的结果。\n\n结果是，Dart 程序员只需编写类似代码：\n\n```\n\
  new Future(myComputation);\n```\n\n### 8.2.3 调度\n\n当我们说代码被调度在未来执行时，指的是什么？Dart 应用程序有一个事件循环，只要有可用的\
  \ `event handlers` 处理进行中的事件，它就会运行。事件处理器针对各种事件——鼠标点击、键盘输入等。我们特别感兴趣的是定时器事件——标记时间流逝的事件。\n\
  \n上一节提到的 `Timer` 类用于定义定时器事件的处理器。我们可以定义一个在给定时间周期通过后触发的处理器。一个重要的特殊情况是该时间周期为零时。在零时间流逝时触发的处理器只是我们想要无条件运行的任务。人们可以使用\
  \ `Timer.run()` 来定义这样的处理器。设置这样的处理器等于调度一个任务在未来执行，在事件循环的下一次迭代中运行。\n\n\n\n\n通过构造函数\
  \ `Future.delayed()`，可以调度一个非零延迟后执行的未来任务。请参考 Dart API 文档获取有关此以及其他几个 futures 构造函数的详细信息。\n\
  \n一旦任务开始，它就会运行到完成；任务永远不会被抢占。任务运行的周期称为 `turn`（轮次）。在一个 `turn` 内调度的所有 futures 都保证只有在该\
  \ `turn` 结束后才会运行——下文描述的微任务（microtasks）除外。\n\n#### 8.2.3.1 微任务\n\n按照原则，我们还必须假设在执行通过\
  \ future 调度的任务之前，可能还会执行其他代码。这些代码可能是：\n\n* 来自另一个 isolate（隔离区）的代码\n* 与鼠标点击等事件关联的事件处理器\n\
  * 与之前调过的 futures 相关的计算\n\n一旦当前 `turn` 结束，事件循环可能会运行上述任何一类任务，且在由当前 `turn` 调度的任何 future\
  \ 运行之前执行。有时，我们确实需要在事件循环恢复之前运行某些异步操作。\n\n有一种机制可以确保 future 在我们我们 `turn` 之外调度的任何代码之前运行。每个\
  \ `turn` 都有自己的 `microtask queue`（微任务队列）。微任务队列上的任务会在 `turn` 结束、将控制权返回给主事件循环之前执行。\n\
  \n我们可以使用构造函数 `Future.microtask()` 来调度在微任务队列上运行的 futures。保持微任务少且短是非常重要的。\n\n####\
  \ 8.3 流 Streams\n\n`stream`（流）是一个长度不定的值列表。它可能是无限的，永远持续下去。它也可能最终结束，但点在于我们不知道流何时结束或是否结束。\n\
  \n流的示例可能是随时间变化的鼠标位置，或者所有质数的列表，或者是通过网络发送给我们的实时视频。\n\n人们可以对流进行 `subscribe`（订阅）或 `listen`（监听），这意味着向流注册一个或多个回调函数。当新数据被追加到流中时，这些函数会被调用。\n\
  \n将流视为一个集合是很自然的。集合上的许多操作也适用于流。人们可以在流上调用 `map()`，从而派导出一个包含计算结果的转换流。例如，我们可以将一对坐标映射到由这些坐标平移的图像，从而构建一个响应鼠标移动并在场景中移动图像的应用程序。\n\
  \n使用 `map()` 派生的流与其派生的原始流是 1:1 的关系。有时，将流中的一个元素替换为多个元素是有用的。作为一种特殊情况，如果这个多个是 0，我们可以过滤掉元素。`expand()`\
  \ 操作（在许多其他语言中被称为 `flatMap()`）允许我们这样做。\n\n可以使用 `expand()` 过滤元素，但使用 `where()` 会更简单。\n\
  \n集合上的某些操作需要遍历整个集合。在流的情况下，我们无法立即这样做，因此这些操作返回 futures。例如，假设我们有一个包含所有质数的流 `primes`，并且我们对它们求和：\n\
  \n点击此处查看代码图像\n\n```\nFuture<int> sisypheanSum = sum(primes);\n\nsisypheanSum.then((s)\
  \ => print(s));\n```\n\n当然，如果我们的质数流真的一直运行下去，那么这是一项相当“西西弗式”的任务。如果我们的流在某处关闭，我们就能得到一个结果。很棒的是，我们在\
  \ 第 4.4 节 中使用的相同 `sum()` 函数可以无需修改地用于流。\n\n### 8.4 Isolates\n\nDart 支持 `actor-style\
  \ concurrency`（actor 模型并发）。一个运行中的 Dart 程序由一个或多个 actor 组成，称为 `isolates`。isolate 是拥有独立内存和独立单线程控制的计算。`isolate`\
  \ 一词源于 isolates 之间存在的隔离性（isolation），因为 isolate 的内存从逻辑上与任何其他 isolate 的内存分离。isolate\
  \ 内部的代码按顺序执行；任何并发都是都是运行多个 isolates 的结果。因此，Dart 中没有共享内存并发，因此不需要锁，也不可能发生竞态条件。\n\n\
  由于 isolates 没有共享内存，isolates 之间通信的唯一方法是通过消息传递。Dart 中的消息传递始终是异步的。\n\n与某些语言不同，isolates\
  \ 没有阻塞接收结构。因此，不会发生死锁。\n\n#### 8.4.1 Ports\n\n一个 isolate 有多个 `ports`（端口）。端口是 Dart\
  \ isolate 间通信的底层基础。端口有两种类型：`send port`（发送端口）和 `receive ports`（接收端口）。\n\n接收端口是传入消息的流\
  \ (8.3)。发送端口允许向 isolate 发送消息；具体地说，它允许将消息发布到接收端口。接收端口可以创建发送端口，并将发送在其上的任何消息发布回其原始接收端口。我们将在下一节中查看它是如何工作的。\n\
  \n#### 8.4.2 Spawning\n\n从一个 isolate 启动另一个 isolate 称为 `spawning`（派生）。isolate 在启动时指定的库的\
  \ `main()` 方法开始执行。该库被称为该 isolate 的 `root library`（根库）。\n\n`Isolate` 类提供了两个用于派生的类方法。第一个是\
  \ `spawnUri()`，它根据通过 URI 提供的库产生 isolate。第二个是 `spawn()`，它根据当前 isolate 的根库产生 isolate。\n\
  \nDart 程序在由 Dart 运行时启动的 `main isolate` 中开始执行。为了创建新的 isolates，主 isolate 必须派生它们。初始消息通常包含一个发送端口。消息是递归定义的：消息可以是空、数字、布尔、字符串、发送端口、消息列表或消息到消息的映射。\n\
  \n调度者如何产生一个发送端口传递给它的派生者？调度者创建自己的接收端口 `r1`，从中提取发送端口 `s1`，并派生一个新的 isolate，传入该发送端口：\n\
  \n点击此处查看代码图像\n\n```\nmain() {\n  ReceivePort r1 = new ReceivePort();\n  SendPort\
  \ s1 = r1.sendPort;\n  Isolate.spawnUri(...), [], s1);\n}\n```\n\n派生者随后创建自己的接收端口\
  \ `r2`，从中提取发送端口 `s2`，通过 `s1` 发回调度者。这种配对舞产生了一对可以相互通信的 isolates：\n\n点击此处查看代码图像\n\n\
  ```\nmain(args, SendPort s1) {\n  ReceivePort r2 = new ReceivePort();\n  SendPort\
  \ s2 = r2.sendPort;\n  s1.send(s2);\n}\n```\n\n上述过程有点繁琐，尽管在每个 isolate 开始时只相当于三行仪式性代码。然而，端口机制足够灵活，可以在其之上构建各种更高级的机制，正如我们很快看到的那样。\n\
  \n#### 8.4.3 安全\n\nIsolates 是 Dart 安全的基础。内存隔离防止一个 isolate 影响另一个 isolate 的状态。因此，语言的隐私构造没有安全影响，仅用于软件工程目的。\n\
  \n一个后果是，可以通过反射 (7) 违反库的隐私性，并且在 isolate 内部反射不受限制的。跨 isolate 反射则是另一回事。\n\n### 8.5\
  \ 示例：客户端-服务器通信\n\n\n\n\n在本节中，我们将展示如何构建一个应用程序，使其独立于特定浏览器的具体机制。我们将应用程序视为一对相互通信的隔离器（isolates），其中一个代表服务器，另一个代表客户端。\n\
  \n我们认为服务器本身就是一个对象，它拥有一组向客户端提供的操作接口。这些操作将是异步的，并返回 `future`。然而，返回的 `future` 将是我们现在要定义的特殊类型，我们称之为\
  \ `promises`。\n\n#### 8.5.1 Promise：更美好的未来\n\n`promise` 的设计是为了减轻与异步代码交互的痛苦。`promise`\
  \ 会自动处理 `future` 回调的模板代码。通过使用 `noSuch-Method()`，`promise` 将在其上的方法调用转换为使用 `then()`\
  \ 的回调。\n\n当方法调用返回一个 `promise` 时，可以立即在该 `promise` 上调用后续方法，几乎就像它是实际结果一样。这缓解了使用 `future`\
  \ 的许多枯燥，因为代码不再充满了深层嵌套的回调声明。\n\n点击此处查看代码图片\n\n```\nlibrary promise;\n\nimport 'dart:async'\
  \ show Completer, Future;\n\nimport 'dart:mirrors' show InstanceMirror, reflect;\n\
  \n@proxy class Promise {\n  Future future;\n  Promise(this. future);\n  noSuchMethod(Invocation\
  \ inv) {\n    onValue(v) {\n      InstanceMirror m = reflect(v);\n      var result\
  \ = m.delegate(inv);\n      return result;\n    }\n    return new Promise( future.then(onValue));\n\
  \  }\n}\n\nclass Resolver {\n  Completer completer = new Completer();\n  Promise\
  \ _promise;\n  get promise {\n    return promise == null ? _promise = new Promise(_completer.future):\
  \ _promise;\n  }\n  resolve(v) {\n    _completer.complete(v);\n  }\n}\n```\n\n###\
  \ 8.5.1.1 局限性：我们无法保留的 Promise\n\n上面的代码存在我们之前在通用代理中看到的相同问题 (5.7.6)。`promise` 与实际值之间的差异将通过动态类型检查检测到——包括显式检查和强制转换（通过\
  \ `is` 和 `as`）以及检查模式下的隐式检查。\n\n当结果需要用于控制结构（如条件语句和循环）或用于输出时，该过程也会中断。对比打印已知值 `v` 与打印\
  \ `v` 的 `promise` `p`：\n\n点击此处查看代码图片\n\n```\nprint(v); // 打印值 v\nprint(p); // 打印类似\
  \ 'An instance of Promise' 的内容\n```\n\n这里的直接问题是 `print()` 依赖于 `toString()`，而它是继承自\
  \ `Object` 的。更彻底的转发机制将覆盖 `Object` 的所有方法，并通过 `then()` 将它们转发给 `future`。然而，这并没有真正解决这种情况下的问题；反而加剧了它。如果\
  \ `print()` 从 `toString()` 得到一个 `Promise` 而不是预期的字符串，它将抛出异常。\n\n更严重的是控制流问题。如果我们有一个异步谓词，我们无法使用其结果在条件语句中做出控制流决策。(2)\n\
  \n**2。** 关于输出和控制流的问题在根本上是相同的。它们本质上是不接受惰性输入的严格函数。\n\n我们可以尝试添加模拟条件语句的方法，本质上是将控制流的决策推迟到\
  \ `promise` 解析（resolved）。然而，这些方法无法妥善地处理 `break`、`continue` 和 `return` 等结构。\n\n最后，对性能存在一些担忧。使用\
  \ `noSuchMethod()` 的调用可能比普通调用慢得多，因此需要注意不要在性能关键型代码中使用它们。对于我们设想的远程隔离器通信场景，这可能不需要担心。一个潜在更严重的担忧是，使用\
  \ `noSuchMethod()` 使代码更难静态分析，这在编译为 JavaScript 时往往会增加代码体积。\n\n尽管存在所有这些问题，`promise`\
  \ 在某些情况下是有用的。在接下来的章节中，我们将将在客户端服务器通信的上下文中使用 `promise`。\n\n### 8.5.2 作为分布式对象的隔离器\n\
  \n我们的下一步是提供将隔离器视为对象的视图。我们需要将服务 API 定义为 Dart 类，编写从客户端运行服务的代码，当然还要实现该服务。最后但同样重要的是，我们还需要构建服务及其客户端使用的基础设施。\n\
  \n#### 8.5.2.1 服务 API\n\n假设我们有一个服务，允许人们向给定地址发送 Cookie。该服务的服务的 API 非常简单，由以下抽象类给出：\n\
  \n点击此处查看代码图片\n\n```\nabstract class CookieService {\n  Receipt sendCookiesTo(recipientAddress,\
  \ customer);\n}\n```\n\n你告诉服务向何处发送 Cookie，并提供你的详细信息以便他们收费。服务在处理请求后会返回收据。\n\n#####\
  \ 序列化\n\n我们的模型依赖于在客户端和服务器之间发送对象，这涉及到对象序列化。我们假设被序列化的对象是连接两端都知的类型的实例。\n\n#### 8.5.2.2\
  \ 运行服务\n\n要运行该服务，我们通过库定义主隔离器：\n\n点击此处查看代码图片\n\n```\nlibrary drive cookie service;\n\
  \nimport 'civilisolates.dart' as isolates show startServiceObject;\n\nmain() {\n\
  \  var cookieService = isolates.startServiceObject(new Uri(path: 'cookie service.dart'));\n\
  \  cookieService.sendCookies(getAddress(), getCustomerDetails());\n}\n```\n\n上面的代码使用\
  \ `startServiceObject` 基于库启动一个服务。`startServiceObject` 的效果是根据传递给它的 `Uri` 启动隔离器，并返回一个允许我们与新隔离器通信的\
  \ `promise`。\n\n接下来，我们在存储在本地变量 `cookieService` 中的 `promise` 上调用 `sendCookies()`。服务隔离器可能甚至还没有启动，但没关系；因为\
  \ `startServiceObject` 返回的是一个 `promise` 而不仅仅是普通的 `future`，我们可以立即在其上调用 `sendCookies()`\
  \ 方法。\n\n客户端需要的是通过 URI 引用服务。之后，它像普通对象一样与服务通信。正如我们将看到的，服务器端的情况也很简单。\n\n##### 8.5.2.3\
  \ 服务实现\n\n为了实现我们的服务，我们如下定义 `cookie service.dart`：\n\n点击此处查看代码图片\n\n```\nlibrary\
  \ cookie service;\n\nimport 'civilisolates.dart' as isolates show serve;\n\nclass\
  \ MyCookieService implements CookieService {\n  Receipt sendCookiesTo(recipientAddress,\
  \ customer){\n    charge(customer); // 首先处理\n    initiatePhysicalShipment(recipientAddress);\n\
  \    return new Receipt(customer);\n  }\n}\n\nmain(args, client) {\n  CookieService\
  \ obj = new MyCookieService();\n  isolates.serve(obj, client);\n}\n```\n\n\n\n再次，我们导入\
  \ `civilisolates` 来提供必要的底层。`cookie service` 库定义了一个 `MyCookieService` 类，它包含一组操作，定义了该库提供的服务的\
  \ API。为了让库以服务的形式运行，我们实例化 `MyCookieService` 并将其传递给 `civilisolates.serve()`。对 `serve()`\
  \ 的调用将使当前运行的隔离（isolate）监听来自 `client` 的消息，将它们转换为对 `service` 的方法调用，并传回序列化后的结果；简而言之，`serve`\
  \ 让当前 isolate 充当由 `obj` 实现的服务。\n\n我们几乎所有的代码都是独立于异步的。我们在普通类中定义了所需的功能。在服务器端，只有 `main()`\
  \ 稍显特殊——但幸运的是它非常短且符合公式。\n\n当然，这幅图有点过于简化了。如果我们有依赖于异步调用结果的复杂控制流，我们的承诺（promises）运行起来就不会那么顺畅。我们确实必须在合适的粒度上设计\
  \ isolate 的 API，以避免这些问题并尽量减少往返次数。但我们避免了大量的模板代码。\n\n#### 8.5.2.4 基础设施\n\n现在，让我们看看我们一直用来定义和启动服务的底层设施。这包括\
  \ `startService` 和 `serve` 的定义。它们都定义在 `civilisolates` 库中。\n\n点击此处查看代码\n\n```\nlibrary\
  \ civilisolates;\n\nimport 'dart:isolate' show Isolate, ReceivePort, SendPort;\n\
  \nimport 'dart:async' show Completer, Future;\n\nimport 'dart:mirrors' show InstanceMirror,\
  \ reflect;\n\nimport 'promise.dart' show Promise, Resolver;\n\nimport 'serializer.dart'\
  \ as serializer show serialize;\n\nimport 'deserializer.dart' as deserializer show\
  \ deserialize;\n\nmsg2Obj(List<String> msg) => deserializer.deserialize(msg);\n\n\
  List<String> obj2Msg(obj) => serializer.serialize(obj);\n```\n\n我们将利用在第 7.1.3 节\
  \ 中引入的序列化器。当然，这些想法的更健壮的实现需要更好的序列化支持，但我们现有的已经足够说明主要思想。\n\n下面，你可以看到 `serve` 如何帮助 isolate\
  \ 将一个对象（`obj`）表示为给给定客户端的服务（通过发送端口 `client` 表示）。它设置了与客户端通信所需的端口。然后它监听任何传入的消息，并使用反射（reflection）将其转发给\
  \ `obj`，并将结果传回客户端：\n\n点击此处查看代码\n\n```dart\nvoid serve(obj, SendPort client) {\n\n\
  \  // 向 client 发送我们的地址\n  ReceivePort rport = new ReceivePort();\n  SendPort selfPort\
  \ = rport.sendPort;\n  client.send(selfPort);\n\n  // 设置监听器响应 client 的发送\n  InstanceMirror\
  \ target = reflect(obj);\n  rport.listen (\n    (msg){\n      var invArgs = msg[0];\n\
  \      SendPort returnAddress = msg[1];\n      // 将调用转发给 obj\n      var result =\
  \ target.invoke(invArgs[0], msg2Obj(invArgs[1]), msg2Obj(invArgs[2]));\n      //\
  \ 提取并序列化结果并传回客户端\n      returnAddress.send(obj2Msg(result.reflectee));\n    }\n\
  \  );\n}\n```\n\n接下来，客户端使用 `startServiceObject` 来设置一个表示服务的对象。该服务将由位于 `uri` 的库实现。我们将使用一个运行我们服务的\
  \ isolate。我们首先处理连接端口和生成服务 isolate 的机制。我们想为 isolate 创建一个代理对象，但 isolate 是异步创建的。我们拥有的只是一个用于\
  \ isolate 的发送端口的 future。因此，我们返回一个关于代理的承诺（promise）。当端口的 future 完成时，它将触发代理的创建：\n\n\
  点击此处查看代码\n\n```dart\nPromise startServiceObject(uri) {\n  ReceivePort rport = new\
  \ ReceivePort();\n  SendPort selfPort = rport.sendPort;\n  // 启动服务 isolate\n  Isolate.spawnUri(uri,\
  \ [], selfPort);\n  // 当我们收到 isolate 的地址时\n  // 我们可以为它设置一个代理对象。在此期间，\n  // 返回一个关于代理的承诺\n\
  \  Future<SendPort> target = rport.elementAt(0);\n  return new Promise(target.then((s)\
  \ => new IsolateProxy(s)));\n}\n```\n\n谜图的最后一块是 isolate 的代理。它的工作方式与我们之前看到的代理类似。区别在于\
  \ `noSuchMethod` 常程的作用。它必须专门创建一个端口来监听答案。作为一种简化，我们选择不处理命名参数。我们的示例不支持它们。相反，我们返回一个关于代理的承诺。\n\
  \n点击此处查看代码\n\n```dart\nclass IsolateProxy {\n  final SendPort _sendPort;\n  IsolateProxy(this._sendPort);\n\
  \n  noSuchMethod(inv) {\n    ReceivePort rport = new ReceivePort();\n    SendPort\
  \ selfPort = rport.sendPort;\n    Resolver resolver = new Resolver();\n    rport.listen((answer){\n\
  \      var a = msg2Obj(answer)[0];\n      resolver.resolve(a);\n      rport.close();\n\
  \    });\n    _sendPort.send([obj2Msg([inv.memberName, inv.positionalArguments]),\
  \ selfPort]);\n    return resolver.promise;\n  }\n}\n```\n\n当然，可以根据 isolate 的发送端口直接创建代理；不必使用\
  \ `startServiceObject`。它仅仅是在首次启动服务时的便利。\n\n遗憾的是，由于上述第 8.5.1.1 节](#part0016.html_ch08lev3sec2)提到的原因，链式承诺（promises）在\
  \ Dart 中的用处有限。为了解决这些限制，Dart 在语言层面提供了对异步的支持，我们接下来将介绍。\n\n### 8.6 异步函数\n\n正如我们看到的，直接与未来（futures）工作可能很尴尬。部分问题在于，我们熟悉的经典控制结构在设计时并没有考虑到异步。一旦发起了异步调用，跟踪调用是否执行、执行是否成功以及结果为何的所有簿记工作都变成了程序员的责任。调度\
  \ future 以及在工作完成后（无论成功失败）调度后续要执行的工作是非常繁琐的。\n\n为了减轻处理异步的痛苦，Dart 为异步函数提供了语言级支持。函数体可以标记\
  \ `async` 修饰符；那么该函数便是一个***异步*** *函数*：\n\n点击此处查看代码\n\n```dart\nFuture<int> foo()\
  \ async => 42;\n```\n\n使用 **async** 函数可以从以下几个方面简化处理 future 和异步的任务：\n\n当调用 **async**\
  \ 函数时，函数的代码不会立即执行。相反，函数中的代码被调度在未来的某个时间执行。那么返回给调用者的是什么呢？一个在函数体完成（无论成功或失败）时将完成的 future。函数会自动制造该\
  \ future 并立即将其返回给调用者。\n\n\n\n显然，这让程序员无需编写相当数量的样板代码，但 `async` 函数的真正价值在于它们可以包含 `await`\
  \ 表达式。\n\n#### 8.6.1 Await\n\n`await` 表达式允许人们几乎像编写同步代码一样编写异步代码。执行 `await` 表达式让我们让我们在等待异步计算完成时挂起周围的函数。\n\
  \n回想我们在第 8.2.1 节](#part0016.html_ch08lev2sec1) 中的示例，当时我们想要测试 `File` 的 `copy()` 方法是否如其描述的那样工作。使用\
  \ `await`，我们可以这样编写断言：\n\n点击此处查看代码图片\n\n```\nassert((await myFile.copy(myPath)).path\
  \ == myPath);\n```\n\n这与我们在 `copy` 是同步方法时本会编写的代码非常相似：\n\n点击此处查看代码图片\n\n```\nassert(myFile.copy(myPath).path\
  \ == myPath);\n```\n\n并且比显式使用 futures 的版本更直接：\n\n点击此处查看代码图片\n\n```\nmyFile.copy(myPath).then((f){\
  \ assert(f.path == myPath);});\n```\n\n`await` 只能在 `async` 函数内部使用。Dart 编译器不会在其他地方接受\
  \ `await`。\n\n在思考 `async` 函数的执行时，需要记住它的体已经独立于其调用者被调度执行，在稍后的某个轮（turn）中执行。因此，当 `async`\
  \ 函数运行时，它的调用者早已离开了。特别是在调试时，没有有意义的调用栈可以参考——也没有调用者可以返回。那么，在 `async` 函数内部的 `return`\
  \ 语句意味着什么呢？`return` 能做的只是用一个值完成与 `async` 函数关联的 future。像往常一样，没有嵌套表达式的 `return` 被视为\
  \ `return null;` 的简写。同样，如果一个 `async` 函数抛出了它未捕获的异常，该函数的 future 将用被抛出的对象完成。\n\n####\
  \ 8.6.2 异步生成器\n\n异步生成器是 Dart 支持的另一种异步函数形式。体标记有 `async` 修饰符的函数充当流（stream）的生成器函数 (4.8)。这个思想通过一个示例说明最为清楚。以下函数产生一个按顺序包含自然数的流：\n\
  \n```\nget naturals async* {\n  int k = 0;\n  while (true) {\n    yield await k++;\n\
  \  }\n}\n```\n\n当调用 `naturals` 时，它会立即返回一个新的流。一旦该流被监听，函数体就会按顺序运行，以生成值来填充流。该函数在无限循环中运行。每次迭代执行一个\
  \ `yield` 语句，该语句内部包含一个 `await`。`await` 增加 `k` 并挂起函数。\n\n随后，函数带有 `k` 的新值恢复，`yield`\
  \ 将该值追加到流中。这个过程在每次迭代中重复，将下一个自然数添加到流中。当然，这不是产生这种序列的好方法；该函数在通过事件循环的每个周期中最多运行一次。\n\n\
  这里有一个更真实的示例，它通过 HTTP 分块获取数据并放入流中。调用函数 `getRepeatedly` 时传入一个 URI `uri` 和一个数字 `n`，后者表示应该访问该\
  \ URI 的次数：\n\n点击此处查看代码图片\n\n```\nStream getRepeatedly(uri, n) async* {\n  for (var\
  \ i = 0; i < n; i++) {\n    var response = await http.get(uri);\n    var nextJson\
  \ = json.convert(response.body);\n    yield nextJson;\n    await new Future.delayed(new\
  \ Duration(seconds: 2));\n  }\n}\n```\n\n流立即返回给调用者。一旦流被监听，`getRepeatedly` 的体将开始运行。它将循环\
  \ `n` 次；每次迭代将使用 `await` 访问提供的 URI 以异步获取响应并挂起。响应准备好后，函数将恢复。响应被转换为 JSON 并发布到返回给调用者的流中。然后函数等待两秒并开始下一次迭代。\n\
  \n### 8.6.3 Await-For 循环\n\n给定一个流，可以对其值进行循环：\n\n点击此处查看代码图片\n\n```\nawait for (var\
  \ i in naturals) { print('event loop $i'); }\n```\n\n每当元素被添加到流时，循环体就会运行。每次迭代后，封装循环的函数都会挂起，直到下一个元素可用或流结束。\n\
  \n就像 `await` 表达式一样，`await-for` 循环只能出现在异步函数内部。两种情况的原因是相同的：这两种构造会导致周围的函数挂起。\n\n###\
  \ 8.7 相关工作\n\nDart 具有独立内存的隔离（isolates）模型是 Hewitt 40 年前提出的 actor 模型的变体[22]。从那时起，许多语言引入了\
  \ actor 模型的变体，特别是 Erlang[23]、E[24]、Newspeak[25] 和 Scala[26]。与 E 和 Newspeak 一样，Dart\
  \ 的消息传递是非阻塞的。\n\n编程中的 future 概念有许多变体，包括 E 的 promises 和 Scala 的 futures。\n\nDart\
  \ 的流深受 Meijer 关于 Rx 工作的影响[27]。\n\n### 8.8 总结\n\nDart 程序由一个或多个隔离组成，每个隔离都是具有独立内存和单线程控制的单元。隔离是\
  \ Dart 的并发和安全单元。隔离通过异步消息传递进行通信。消息发送返回代表预期结果的 future。future 支持回调，在 future 完成（无论成功还是失败）时指定要执行的操作。流为\
  \ Dart 应用提供了更高层次的抽象。最后，`async` 方法使得类似于同步的方式编写异步程序成为可能。\n\n## 9. 结论\n\n通过对 Dart 的全面导览，我们可以得出什么结论？在开发\
  \ Dart 的过程中，我学到了什么可能对你有价值的东西？哪些地方应该做得更好？在这个简短的章节中，我们将回顾现在的 Dart 以及未来可能变成的样子。\n\n\
  ### 9.1 可选类型\n\n可选类型几十年来一直以各种形式被提出。Dart 是第一个从诞生起支持可选类型的主流编程语言。在 Dart 发布后，许多其他语言出现了类似的功能。这些语言并不一定是由\
  \ Dart 直接启发的。然而，非强制性类型系统是一个已经成熟的想法。\n\n较不清楚的是 Dart 是否代表了该领域的最佳方法。Dart 作为语言规范的一部分规定了特定的可选类型系统。此举的优点为\
  \ Dart 程序建立了通用语言。另一方面，可选类型特别是插拔类型（pluggable types）[29] 的灵活性在类型成为语言工具的一部分而非语言本身时将得到最大化。语言工具的演进速度可以比语言本身更快。\n\
  \n\n\n检查模式（Checked mode）已被证明是一把双刃剑。它的用处显而易见，但这是是有代价的。尽管有人认为检查模式仅是一个开发阶段的工具，但它倾向于被视为事实上的运行时类型系统，这违背了类型系统不应影响运行时语义的原则。在本书中，当我们讨论代理（proxies）时，我们已经看到了检查模式这种不理想的影响。\n\
  \n检查模式的另一个弱点是它是“全或全无”的。人们可能希望能够以更细的粒度激活检查模式，也许是每个模块甚至每个函数。\n\n一个健全的（但可选的）静态类型纪律会减少对检查模式的需求。一个具有健全规则但没有检查模式的设计更接近\
  \ `Strongtalk` 原始的可选类型系统，可能是一个很有吸引力的替代方案。可选类型完全可以是健全的。像往常一样，这涉及到权衡。Dart 选择了放弃健全性，以更好地符合程序员的直觉。然而，健全性分析具有重要的益处。我们越贴近真正可选（因此是可插拔的）类型的理念，我们在根据需要选择健全或不健全的方法时就越有灵活性。\n\
  \n可选类型带来的一个有趣且意料之外的影响是用户期望的提高。一旦人们发现程序尽管有类型警告也能正确运行，他们就会要求类型系统具有更高的智能。示例包括流感知类型规则（flow-aware\
  \ type rules）和更好的推断。\n\n总体而言，将类型从语言领域移到工具领域可能更好地服务于用户，允许健全和不健全类型系统进行快速演进的混合，并采用不同的推断方法。\n\
  \n### 9.2 对象面向\n\nDart 是一门纯的面向对象的语言。所有的运行时值都是对象，在大多数情况下，这工作得非常好。\n\n然而，Dart 中的某些东西并不是运行时值，因此它们不是对象。库（Libraries）和前缀（prefixes）是这里明显的“罪祸首”。奇怪的是，库和前缀在底层通常被实现为对象，是语言本身破坏了这种一致性。\n\
  \n将库视为完全对象的后果是深远的。正因为其影响如此深远，这种想法在 Dart 中并没有被追求。它挑战了关于模块系统的传统观念，因此违背了熟悉性的目标。\n\n\
  使用传统的模块化构建的代价是高的，因为传统的模块化构建是极其不充分的。我们遇到了一系列涉及依赖注入、灵活库配置和动态加载的问题。所有这些问题都可以通过更激进的设计来解决，如\
  \ `Newspeak`[30] 所示。\n\n类在 Dart 中是对象，但它们的功能是有限的。将类方法和构造函数视为静态特征的决定，错失了利用纯对象模型统一性的机会。在一个库和类都是对象的世界里，只需要一种方法访问方式（实例），而不是三种（顶层、类和实例）。这种简化贯穿于整个系统，从规范到实现再到工具。\n\
  \n最后，有一种观点认为，纯的面向对象性要求运行的程序/系统本身也是一个对象。这种观点意味着反射（reflection）是面向对象的不可或缺的一部分。Dart\
  \ 支持反射，但没有它本可以做得那么好或那么彻底。下一节将探讨这个主题。\n\n### 9.3 反射\n\nDart 对反射的支持仍在进化中。在目前阶段，它尚未达到理想水平。程序员通常被建议避免使用它，主要由于与部署代码大小相关的务实问题。这些问题在第\
  \ 7 章中讨论过。\n\n诚然，在某些情况下反射被过度使用了。反射在支持依赖注入和用户界面框架的绑定方面被特别过度使用。遗憾的是，Dart 甚至也需要依赖注入。上一节提到的基于一等库的强大模块化技术将使依赖注入框架变得不再必要。\n\
  \n另一方面，这种寻求反射的倾向说明了它在力量和便利方面的价值。正如第 7.4 节所讨论的，以有效的方式支持反射是完全可能的。\n\n超越自省（introspection）到动态演进程序（7.5）是另一个\
  \ Dart 缺乏反射支持的领域。这对 Dart 的整体编程体验产生了巨大影响，正如下一节所示。\n\n### 9.4 工具\n\n编程涉及的不仅仅是编程语言的抽象概念。编程的现实涉及语言、实现、库、工具、文化和社区。\n\
  \nDart 曾雄心将 Smalltalk 的许多优势带给更广泛的受众。正如书中提到的，它深受 Smalltalk 的影响。然而，Dart 在熟悉度和目标实现平台方面的限制往往削弱了这种雄心。\n\
  \n局限性在工具领域尤为显著。有许多 IDE 为 Dart 提供支持。为了保持 Dart 熟悉的感觉，这些 IDE 在设计上都非常传统。它们没有一个能提供与 Smalltalk\
  \ IDE 远程相似体验的。Smalltalk 实时编程（live programming）的理想在近年来经历了复兴，未来的 Dart 开发环境应该纠正这一缺陷。\n\
  \nSmalltalk 的实时感源于元循环工具设计（metacircular tool design）与程序在执行时修改自身的能力的结合。程序随时间改变自身的能力，而不是动态类型，真正让一种编程语言变得动态化。这种动态性可以通过镜像构建器（mirror\
  \ builders）(7.5) 以结构化的方式实现。\n\n如今大多数 Dart IDE 并不是用 Dart 编写的，也没有解决活性（liveness）。无论有多少主题、插件和选项，都无法替代程序员直接根据需求塑造工具并在过程中获得实时反馈的能力。\n\
  \n### 9.5 总结\n\nDart 是一门旨在为主流读者设计的既熟悉又实用的语言，同时仍尝试遵循面向对象的核心原则：对象的唯一重要的是它的行为，每个运行时值都是对象，并且程序的代码本身可以被视为对象并对其进行反射。\n\
  \n在本文写作时，Google 内部有数百万行 Dart 代码，外部也有数百万行。这门语言对许多程序员来说显然是有用的；它显然也是熟悉的。为了保持熟悉，Dart\
  \ 遵循面向对象原则的程度并没有本书作者希望的那么。为了保持实用，它主要关注 Web 编程，这也导致了妥协。\n\n尽管如此，Dart 的成功将随着语言的持续进化而判断。希望它在这个过程中得到改进。\n\
