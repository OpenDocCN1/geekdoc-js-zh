  md: 'Here we have a `select` containing a number of `optgroup` elements, each of
    which


    contains a number of `option` elements. In effect, we have two levels of menus


    here—the user must first find the right option group, then select the desired
    option.


    Why not make it easier on the user by splitting this into two menus, as shown
    in


    Figure 6.3?


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_250_0.png)


    Figure 6.3\. Splitting the single menu into a pair of cascading menus to improve
    usability


    When the user selects an option from the first menu, our JavaScript code will
    swing


    into action, updating the list of options in the second menu. This saves users
    from


    having to scroll through menu choices that aren’t in the group they’re interested
    in.


    Of course, our form must still work when JavaScript is disabled, so we’ll write
    the


    HTML code for our form using the single `select`, then split it into the two menus


    during the initialization of our script. To make our script reusable, however,
    we


    need to make sure that the single menu contains all the information that’s needed


    to produce the two cascaded menus:


    **cascadingmenu.html** ***(excerpt)***


    `<label for="crewselect">`


    `Who is your favorite Star Trek crewmember?`


    `</label>`


    `<select id="crewselect" name="crewselect"`


    `class="cascading"` `**title="Assignments"**``>`


    `<optgroup` `**title="Crew"**` `label="Enterprise NX-01">`


    `<option value="1">Jonathan Archer</option>`


    `<option value="2">T''Pol</option>`


    `<option value="3">Charles Tucker III</option>`


    `<option value="4">Malcolm Reed</option>`


    `<option value="5">Hoshi Sato</option>`


