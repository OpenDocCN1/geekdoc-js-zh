  md: 'As with any use of `innerHTML`, this technique suffers from the disadvantages
    we


    discussed in Chapter 3, but it can certainly be a viable option if your circumstances


    require it.


    **A Word on Screen Readers**


    Until now, we’ve always taken time to make sure our JavaScript enhancements do


    not prevent users of assistive technologies—like screen readers—from using our


    sites. Unfortunately, when you add Ajax to the equation, this goal becomes extremely


    difficult, if not impossible to achieve for screen reader users in particular.


    Most, if not all of the current screen readers are unable to handle in a sensible
    (let


    alone useful) way the on-the-fly page updates that typify Ajax development. Screen


    readers either will not pick up those changes at all, or they’ll pick them up
    at the


    most untimely of moments.


    In some very specific cases, developers have begun to produce experimental solutions


    that start to address these issues, but we’re a long way from having reliable,
    best-


    practice techniques in hand. The prevailing wisdom suggests that any real solution


    will have to be developed at least in part by the screen reader vendors themselves.


    This leaves web developers like you and me with a tough decision: do we abandon


    Ajax and the amazing usability enhancements that it makes possible, or do we shut


    out screen reader users and take full advantage of Ajax? Of course, if you can
    justify


    asking screen reader users to disable JavaScript when visiting your site, you
    can


    offer these users the same fallback experience as other non-JavaScript users,
    which


    can work just fine. But you’ll need to make sure these users can find out enough


    about your site to decide if it’s worth disabling JavaScript to proceed. And consider


    making it even easier—a link that said “Disable user interface features on this
    site


    that are not compatible with screen readers,” for example, would not be out of
    the


    question.


    **Putting Ajax into Action**


    Now you know the basics of Ajax—how to create and use an `XMLHttpRequest` object.


    But it’s probably easier to understand how Ajax fits into a JavaScript program
    if you


    try out a simple example.


    **Simply JavaScript**


    **316**'
