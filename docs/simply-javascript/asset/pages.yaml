    **Exploring Libraries**


    Most of the available JavaScript libraries have little helper functions that can
    help


    you expand the functionality of the DOM. These range from neat little shortcuts
    to


    entirely different ways of finding and manipulating elements.


    **Prototype**


    Prototype was one of the first libraries to swap the painful-to-type


    `document.getElementById` for the ultra-compact `$`.


    The `$` function in Prototype not only acts as a direct substitute for


    `document.getElementById`, it also expands upon it. You can get a reference to
    a


    single element by ID, so this normal code:


    `var money = document.getElementById("money");`


    would become:


    `var money = $("money");`


    But you don’t have stop at getting just one element; you can specify a whole list
    of


    element IDs that you want, and `$` will return them all as part of an array. So
    this


    normal code:


    `var elementArray = [];`


    `elementArray[0] = document.getElementById("kroner");`


    `elementArray[1] = document.getElementById("dollar");`


    `elementArray[2] = document.getElementById("yen");`


    becomes considerably shorter:


