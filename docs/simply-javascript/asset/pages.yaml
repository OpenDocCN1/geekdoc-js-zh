    **Removing a Class**


    When we want to remove a class from an element, we use that same regular expres-


    sion (it’s a pretty handy one, huh?), but with a slightly different twist:


    **core.js** ***(excerpt)***


    `Core.removeClass = function(target, theClass)`


    `{`


    `var pattern = new RegExp("(^| )" + theClass + "( |$)");`


    `target.className = target.className.replace(pattern, "$1");`


    `target.className = target.className.replace(/ $/, "");`


    `};`


    In `Core.removeClass`, instead of using the regular expression to check whether
    or


    not the target element has the class, we assume that it does have the class, and
    in-


    stead use the regular expression to replace the class with an empty string, effectively


    removing it from `className`.


    **91**


