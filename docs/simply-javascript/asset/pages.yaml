  md: 'To do this, we use a built-in string method called `replace`. This method takes
    a


    regular expression and a replacement string, then replaces the occurrences that


    match the regular expression with the replacement string. In this case, we’re
    using


    an empty string as the replacement, so any matches will be erased. If the class
    exists


    inside `className`, it will disappear.


    The second call to `replace` just tidies up `className`, removing any extraneous


    spaces that might be hanging around after the class was removed (some browsers


    will choke if any spaces are present at the start of `className`). Since we assign
    both


    these operations back to `className`, the `target` element’s class will be updated


    with the changes straight away, and we can return from the function without fuss.


    **Example: Making Stripy Tables**


    Earlier in this chapter, we made our first real *function*, `Core.getElementsByClass`,


    but now I think you’re ready to make your first real *program*, and a useful one
    it is


    too!


    In my days as an HTML jockey, there was one task I dreaded more than any other,


    and that was making stripy tables. On static pages, you had to hand code tables
    so


    that every odd row had a special class like `alt`, but I just knew that as soon
    as I


    finished classing 45 different rows my manager was going to come along and tell


    me he wanted to add one more row right at the top. Every odd row would become


    even and every even row would become odd. Then I’d have to remove 45 classes


    and add them to 45 other rows. Argh!


    Of course, that was before I knew about JavaScript. With JavaScript and the magic


    of the `for` loop, you can include one JavaScript file in your page, sit back,
    and


    change tables to your heart’s delight. Obviously we’re going to be using JavaScript


    to add a class to every second row in this example. But it might help to break
    down


    the desired outcome into a series of simple steps again.


    In order to achieve stripy tables, we’ll want to:


    1.


    Find all tables with a class of `dataTable` in the document.


    2.


    For each table, get the table rows.


    3.


    For every second row, add the class `alt`.


    **Simply JavaScript**


    **92**'
