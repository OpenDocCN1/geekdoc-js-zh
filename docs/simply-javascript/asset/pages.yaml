    With those tools tucked in your belt, you should be able track down problems that


    the browser can detect for you. But you might still have occasion to wonder why


    on earth your carefully scripted code (which is perfectly fine, as far as the
    browser


    is concerned) is behaving the way it is. With the right tools, you can track a
    problem


    in your code to its source, even stepping through your JavaScript code a line
    at a


    time if necessary.


    **Nothing Happened!**


    It isn’t very encouraging to spend two hours piecing together the ultimate script


    full of whizz-bang effects only to fire up your browser and have nothing happen;


    but when you’re first writing a new script, that’s usually your first hint that
    some-


    thing has gone wrong—nothing happens.


    The good news is that, if you’ve done your job right, the fact that the JavaScript
    fails


    silently means that your plain HTML/CSS can work on its own, and a user need


    never know that your code isn’t working right. See? The browser’s just looking
    after


    your reputation! This isn’t much help when you’re trying to find out *why* the
    script


    isn’t working, though.


    When you’re working on your JavaScript code, then, you should configure your


    browser of choice to let you know about JavaScript errors when they happen. De-


    pending on which browser you’re dealing with (and of course, you will eventually


    need to test as many as possible), the procedure is different.


    Firefox has a very nice error console that you can access by selecting **Tools**
    > **Error**


    **Console**. This opens the window shown in Figure 7.1\. The console displays
    not only


    JavaScript errors, but errors in your CSS code, and even so-called **chrome errors**


    generated internally by the browser (usually after you’ve installed a buggy browser


    extension).


