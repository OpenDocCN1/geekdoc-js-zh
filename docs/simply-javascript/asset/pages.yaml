    **Calling a Server**


    Once we’ve created an `XMLHttpRequest` object, we must call two separate meth-


    ods—`open` and `send`—in order to get it to retrieve data from a server.


    `open` initializes the connection and takes two required arguments, with several
    op-


    tionals. The first argument is the type of HTTP request you want to send (GET,


    POST, DELETE, etc.); the second is the location from which you want to request


    data. For instance, if we wanted to use a GET request to access **feed.xml** in
    the root


    directory of a web site, we’d initialize the `XMLHttpRequest` object like this:


    `requester.open("GET", "/feed.xml", true);`


    The URL can be either relative or absolute, but due to cross-domain security concerns


    the target must reside on the same domain as the page that’s requesting it.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_333_0.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_333_1.png)


    **HTTP Only**


    Quite a few browsers will only allow `XMLHttpRequest` calls via `http://` and


    `https://` URLs, so if you’re viewing your site locally via a URL beginning with


    `file://`, your `XMLHttpRequest` call may not be allowed.


    The third argument of `open` is a Boolean that specifies whether the request is
    made


    asynchronously (`true`) or synchronously (`false`). A synchronous request will
    freeze


