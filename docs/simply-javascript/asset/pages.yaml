    **Stopping the Timer**


    When `setTimeout` is executed, it creates a timer that “counts down” to the moment


    when the specified code should be executed. The `setTimeout` function returns
    the


    ID of this timer so that you can access it later in your script. So far, we’ve
    been


    calling `setTimeout` without bothering about its return value, but if you ever
    want


    to intervene in a timer’s countdown, you have to pay attention to this value.


    To stop a timer before its countdown has finished, we need to capture the timer’s


    ID inside a variable and pass it to a function called `clearTimeout`. `clearTimeout`


    will immediately cancel the countdown of the associated timer, and the scheduled


    task will never occur:


    `var timer = setTimeout("alert(''This will never appear'')", 3000);`


    `clearTimeout(timer);`


    The alert in the code above will never be displayed, because we stop the `setTimeout`


    call immediately using `clearTimeout`.


