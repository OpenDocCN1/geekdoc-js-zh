    **Exploring Libraries**


    The number of JavaScript libraries available on the Web is gradually being whittled


    down predominantly on the basis of how much they’re used, but their endurance


    is also affected by factors such as functionality, ease of integration, and available


    documentation.


    To my mind, a library can go in two directions—small and light, or big and heavy.


    There are some advantages to keeping a library small—especially on the Web, where


    download time is still an issue, along with client-side processing power and code


    complexity. Libraries such as jQuery^(11) and moo.fx^(12) fill that niche neatly,
    providing


    an efficient pocket knife of JavaScript functions that will help you get the job
    done.


    At the other end of the scale, the big libraries are becoming even bigger. More
    and


    more functionality is being absorbed into their bellies, in an effort to encompass


    any and all types of interaction that can be imagined to take place in a browser.


    These libraries are becoming less like libraries from which you can pick and choose


    the elements you want, and more like frameworks, where the library becomes the


    language, and your programs become distilled into minimalistic lines of API code.


    The various styles of these large frameworks differ. Some try to maintain the
    separ-


    ation of layers that has characterized web development for some time, while others


    attempt to abstract the web layer entirely, by creating a translation between
    server-


    side logic and browser implementation. To cover the specifics of each of these


