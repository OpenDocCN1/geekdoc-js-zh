    may


    or may not be enclosed in parentheses, then one or more groups of numbers. Each


    of these elements may be separated by spaces, dashes, or nothing at all.


    Here’s the expression we’ll need:


    `^(\+\d+)?( |\-)?(\(?\d+\)?)?( |\-)?(\d+( |\-)?)*\d+$`


