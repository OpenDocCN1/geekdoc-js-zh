  md: '**Chapter****4**


    **Events**


    When we started out in Chapter 2, every script that we looked at would be loaded


    by the browser and executed right away. Since then, we’ve learned how to wait


    until the HTML document has finished loading before unleashing the awesome


    power of JavaScript. In every case, however, the script will work its magic (for
    in-


    stance, making the rows of your tables stripy), then fizzle out, leaving behind
    an


    enhanced—but still very static—page.


    You don’t need to suffer with scripts that peak too quickly! With the simple tech-


    niques we’ll explore in this chapter, you’ll learn to take control, write scripts
    that


    last longer, and become a superstar … well, in your favorite JavaScript chat room,


    anyway.


    Don’t get me wrong—scripts that enhance web pages the instant they’re loaded (let’s


    call them “quickies”) have their place, but there are limits to how much they
    can


    improve the user experience of a site. JavaScript *really* gets interesting when
    you


    start to write scripts that are triggered by **events** that occur during the
    user’s inter-


    action with the page, like clicking a hyperlink, scrolling the browser’s viewport,
    or


    typing a value into a form field.'
