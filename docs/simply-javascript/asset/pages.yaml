  md: 'cupied by that listener and the associated DOM nodes will not be released when


    the user navigates to another page. I’ll grant you that this is pretty technical
    stuff,


    but what it comes down to is that certain types of event listeners can cause Internet


    Explorer to leak memory, thereby causing users’ computers to slow down until


    those users are forced to restart their browsers.


    The solution to this issue is to set up a special event listener for the `unload`
    event


    of the global `window` object, which represents the browser window containing
    the


    page. When the user navigates to another page, the `unload` event will occur and
    the


    special event listener will be triggered. Within this event listener, you can
    take the


    opportunity to remove all of the event listeners that you set up in your document,


    thereby preventing them from causing memory leaks.


    While this solution is quite elegant, the JavaScript code to make it happen is
    not.


    For the moment, I’ll spare you the details, because as we’ll see in the next section,


    you shouldn’t have to worry about them.


    **Putting it All Together**


    Have you been keeping track of all the cross-browser compatibility issues that
    we


    need to deal with when using event listeners? That’s okay—I have:


    ■Internet Explorer uses `attachEvent`/`detachEvent` to add and remove event


    listeners, instead of `addEventListener`/`removeEventListener`.


    ■Internet Explorer uses an `"on``*event*``"` naming style for its events, instead
    of just


    `"``*event*``"`.


    ■Internet Explorer uses a global `event` variable instead of passing the event
    object


    to the listener as an argument.


    ■To prevent a default action from taking place, Internet Explorer requires you
    to


    set the event object’s `returnValue` property, instead of calling its `preventDefault`


    method.


    ■Internet Explorer doesn’t support the capture phase of event propagation.


    ■To stop an event from propagating, Internet Explorer requires you to set the
    event


    object’s `cancelBubble` property, instead of calling its `stopPropagation` method.


    **129**


    **Events**'
