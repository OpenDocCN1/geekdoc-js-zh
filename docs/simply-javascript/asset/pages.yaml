    object’s `readyState` property, which specifies the status of the object’s connection,


    and can take any of these values:


    `**0**`


    uninitialized


    `**1**`


    loading


    `**2**`


    loaded


    `**3**`


    interactive


    `**4**`


    complete


    We can monitor changes in the `readyState` property by handling `readystatechange`


    events, which are triggered each time the property’s value changes:


    `requester.onreadystatechange = readystatechangeHandler;`


