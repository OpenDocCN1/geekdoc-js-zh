  md: 'Here are the highlights of this script:


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_203_0.png)


    The initialized variables include a reference to the `div` element we’re modifying,


    as well as two constant properties—  `frameHeight` and `frames`—which tell the


    program that each frame is 150 pixels high, and that there are ten frames in


    total. These values will remain fixed throughout an animation, but by declaring


    them up front, you’ll find it easier to modify the frame dimensions and the


    number of frames later if you need to. If you create your own animation, you


    should modify these variables according to your needs.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_203_1.png)


    The other variable, `Robot.offsetY`, is the only variable we’ll be updating dy-


    namically. It’s set to `0` initially, but it’s used to record the current vertical
    pos-


    ition of the animation image, just so we know which frame we’re up to.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_203_2.png)


    After the `init` method does its thing, we step into our first iteration of


    `Robot.animate`.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_203_3.png)


    If you look to the end of the function, you’ll see that the function calls itself


    with a `setTimeout` delay. This lets you know that we’re setting up a timed,


    repeating task.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_203_4.png)


    The first statement in the function reduces `Robot.offsetY` by the height of one


    frame. What we’re calculating here is the vertical `background-position` re-


    quired to view the next frame. However, our animation graphic isn’t infinitely


    long; if we just kept reducing the value of `Robot.offsetY`, we’d eventually run


    out of frames and end up with an empty box. To avoid this, we need to return


    to the beginning of the strip at the right moment.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_203_5.png)


    Next up is an `if` statement that checks whether the new `Robot.offsetY` value


    is outside the range of our animation strip. If it is, we set it back to `0`.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_203_6.png)


    With our new offset value in hand, we’re ready to update the position of the


    image. To do so, we modify the `div`’s `style.backgroundPosition` property,


    using `Robot.offsetY` for the vertical coordinate and `0` for the horizontal co-


    ordinate (because we don’t need to move the image horizontally at all).


