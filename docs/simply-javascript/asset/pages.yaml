  md: 'This listener works a lot like `changeListener`, which we saw earlier, except
    that


    instead of fetching the updated value from a form field, it needs to calculate
    that


    value on the basis of the mouse pointer’s position in relation to its starting
    location,


    and the original value when the drag operation began:


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_290_0.png)


    We’re responding to a `mousemove` event that has bubbled up to the document


    node, but all the information we need is locked away in the thumb element.


    Thankfully, we stored a reference to that element in the custom `_currentThumb`


    property of the `document` object.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_290_1.png)


    Here, we calculate the slider value corresponding to the current mouse position.


    We start with the value of the slider before the drag started (`thumb._valueori-`


    `gin`), then add to it the difference between the current mouse position


    (`event.clientX`) and the starting mouse position (`thumb._dragorigin`) divided


    by the scale of the slider (`thumb._scale`).


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_290_2.png)


    As with `changeListener`, we limit the value that we just calculated so that it


    falls within the range allowed by the slider.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_290_3.png)


    To produce the illusion that the user is actually dragging the slider thumb, we


    adjust its position based on the value that we have just calculated. Again, this


    code works just like the corresponding code in `changeListener`.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_290_4.png)


    We also update the value of the text field on the fly.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_290_5.png)


    Finally, we prevent the browser from doing anything it might normally do in


    response to the movement of the mouse.


    As the French might say, *le tour est joué!*—we’ve pulled it off! The user can
    now


    click and drag the slider, and see the field’s value update in real time. All
    that’s left


    is to complete the drag operation when the user releases the mouse button:


    **slider.js** ***(excerpt)***


    `mouseupListener: function(event)`


    `{`


    `document._currentThumb = null;`


    `Core.removeEventListener(document, "mousemove",`


    `Slider.mousemoveListener);`


