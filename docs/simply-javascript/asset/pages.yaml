  md: 'specified inside an external style sheet, obtaining the element’s computed
    style will


    let you access that property value.


    Unfortunately, there are differences between the way that Internet Explorer imple-


    ments computed style and the way that other browsers implement it. Internet Ex-


    plorer exposes a `currentStyle` property on every element. This properties has
    ex-


    actly the same properties as `style`, so you could ascertain an element’s computed


    `left` position using `element.currentStyle.left`. Other browsers require you
    to


    retrieve a computed style object using the method


    `document.defaultView.getComputedStyle`. This method takes two arguments—the


    first is the element you require the styles for; the second must always be `null`—then


    returns a style object that has the same structure as Internet Explorer’s `currentStyle`


    property.


    To get around these browser differences, we’ll create a new Core library function


    that will allow us to get a particular computed style property from an element:


    **core.js** ***(excerpt)***


    `Core.getComputedStyle = function(element, styleProperty)`


    `{`


    `var computedStyle = null;`


    `if (typeof element.currentStyle != "undefined")`


    `{`


    `computedStyle = element.currentStyle;`


    `}`


    `else`


    `{`


    `computedStyle =`


    `document.defaultView.getComputedStyle(element, null);`


    `}`


    `return computedStyle[styleProperty];`


    `};`


    `Core.getComputedStyle` does a little object detection to check which way we should


    retrieve the computed style, then passes back the value for the appropriate property.


    Using method, we can get the correct starting point for `SoccerBall.originX` without


    requiring a hard-coded value in our script.


