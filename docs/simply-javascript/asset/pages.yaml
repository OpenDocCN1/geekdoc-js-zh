- img_proc: true
  md: 'that people have never done before. There are countless new ideas to be explored,


    and new pages to be forged.


    Hopefully, all the reading you’ve done so far has made you as excited as I am,
    and


    you’ve got a million and one ideas buzzing around inside your head. You should


    be thinking of all the ways you can use JavaScript on your pages to create a usable


    and fun experience for your users.


    But if, by some strange eventuality, your JavaScript juices aren’t quite flowing
    yet,


    this peek at the future is sure to get them going like the Niagara.


    **Bringing Richness to the Web**


    Maybe you thought Flash brought richness to the Web. It certainly did its bit,


    changing the Internet from a static, page-based paradigm to a morphing, transitioning,


    all-singing, all-dancing “experience.” But it tends to throw out the benefits
    of HTML,


    while introducing some of its own disadvantages.


    JavaScript—with HTML as its foundation—manages to strike a happy medium


    between the interactivity of Flash and the accessibility of HTML, especially if
    you


    follow the tenets of progressive enhancement that we’ve been advocating in this


    book. If you think of JavaScript as an add-on to HTML, it makes the transition
    from


    a page-based development model to a more interactive model much less turbulent.


    Although a lot of the recent focus of interaction design has been placed on Ajax,


    it’s not the only way in which you can create a more usable interface. Sometimes,


    you just need to think about how you can represent your interface in a different


    manner.


    **Easy Exploration**


    Take, for example, the Travelocity site.¹ Its creators recognize that when you’re


    looking for accommodation, there are normally one or two variables that you want


    to use to narrow down your options. To let you get feedback quickly on the effect


    that your choices have made, they implemented the variables as JavaScript sliders,


    1 http://www.travelocity.com/


    **Simply JavaScript**


