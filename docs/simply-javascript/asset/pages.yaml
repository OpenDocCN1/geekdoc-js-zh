    to the end of the value.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_204_2.png)


    Changing the style of the `div` commits the new frame to the browser for the


    user to see. Once that’s done, we have to schedule the next change using


    `setTimeout`. The wait until the next frame change is 75 milliseconds, which


    will produce a frame rate of approximately 13 frames per second. You might


    want to tweak this rate depending on how fast or smooth you want your anim-


    ation to be. The most pleasing results are often reached by trial and error.


    Once the program has made a few passes through `Robot.animate`, you have yourself


    an animation. Since there’s nothing in our code to stop the repeated calls to
    that


    method, the animation will keep going forever. If you wanted to, you could provide


    start and stop buttons as we did previously in this chapter to allow users to
    stop


    and restart the animation. Alternatively, you could limit the number of cycles
    that


    the animation goes through by including a counter variable that’s incremented
    each


    time `Robot.offsetY` returns to `0`.


