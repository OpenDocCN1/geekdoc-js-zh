    of the line is termed an **illegal character**, which is a fancy way of saying
    “Get a


    grip—you’re not even *allowed* to type a backslash here!”


    The problem, of course, is that comments must be preceded by a double slash, not


    a double backslash:


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_311_1.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_311_1.png)


    `10` `**//**` `something happens`


    As you can see, once you’ve figured out where you went wrong, syntax errors are


    easy to fix, but the error messages that the browser displays can often be misleading.


    Usually it comes down to a forgotten character or two, or accidentally using one


    type of bracket when you meant to use another.


    The good news is that the more JavaScript you write, the more familiar you’ll
    become


    with the nitty-gritty details of the language, and the fewer syntax errors you’ll
    be


    likely to run into.


    **Runtime Errors**


    **Runtime errors** occur when a perfectly valid piece of JavaScript code tries
    to do


    something that it’s not allowed to do, or that is flat out impossible. These errors
    are


    so named because they occur while the script is actually running. Unlike syntax


    error messages, the messages produced by runtime errors tend to be right on the


    money. The trick is figuring out why the error occurred.


    **Simply JavaScript**


