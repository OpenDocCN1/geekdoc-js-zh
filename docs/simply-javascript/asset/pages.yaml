  md: '**Default Actions**


    As we’ve just seen, event handlers let you respond to user actions by running
    any


    JavaScript code you like. But often, the browser still gets the last word. Take
    the


    example we just saw: no matter how creative and amazing the code in our event


    handler, when it’s done, the browser will take over and follow the link as normal.


    I don’t know about you, but I call that being a slave to the Man, and I won’t
    take it.


    Browsers take all sorts of actions like this:


    ■They follow links that users click.


    ■They submit forms when users click a **Submit** button, or hit **Enter**.


    ■They move keyboard focus around the page when the user hits **Tab**.


    These are called **default actions**—things the browser *normally* does in response
    to


    events. In most cases you’ll want the browser to do these things, but sometimes


    you’ll want to prevent them from occurring.


    The easiest way to stop the browser from performing a default action in response


    to an event is to create for that event an event handler that returns `false`.
    For ex-


    ample, we can modify the link `click` event handler we created above to ask the


    user for confirmation before the link is followed:


    **clickprompt.js** ***(excerpt)***


    `clickHandler: function()`


    `{`


    `**if (!confirm("Are you sure you want to leave this site?"))**`


    `**{**`


    `**return false;**`


    `**}**`


    `}`


    The `confirm` function used in this code is built into the browser, just like
    `alert`.


    And it displays a message to the user just like `alert` does, except that it offers
    the


    user two buttons to click: **OK** and **Cancel**. If the user clicks **OK**, the
    function returns


    `true`. If the user clicks **Cancel**, the function returns `false`. We then use
    the `!` operator


    introduced in Table 2.1 to reverse that value so that the body of the `if` statement
    is


    executed when the user clicks **Cancel**.


    **111**


