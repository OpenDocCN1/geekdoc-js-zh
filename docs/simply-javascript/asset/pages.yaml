  md: 'It is generally considered best practice, however, to do both—separate statements


    by a semicolon *and* a new line:


    `*Statement one*``;`


    `*Statement 2.0*``;`


    This way, each of your statements will be easy to read, and you’ll have removed


    the potential for any ambiguity that might occur if two statements accidentally
    run


    together.


    There’s a whole bunch of different tasks you can achieve inside each statement;
    the


    first one that we’ll look at shortly is creating variables.


    **Comments: Bite-sized Chunks Just for You**


    If you follow the advice in this book and keep your JavaScript code simple and
    well


    structured, you should be able to get the gist of how it works just by looking
    at it.


    Every once in a while, however, you’ll find yourself crafting a particularly tricky


    segment of code, or some esoteric browser compatibility issue will force you to
    insert


    a statement that might seem like nonsense if you had to come back and work on


    the program later. In situations like these, you may want to insert a comment.


    A **comment** is a note in your code that browsers will ignore completely. Unlike
    the


    rest of the code you write, comments are there to be read by *you* (or other program-


    mers who might later need to work on your code). In general, they explain the
    sur-


    rounding code, making it easier to update the program in future.


    JavaScript supports two types of comments. The first is a single-line comment,


    which begins with two slashes (`//`) and runs to the end of the line:


    `*Statement one*``;` `**// I''m especially proud of this one**`


    `*Statement 2.0*``;`


    As soon as the browser sees two slashes, it closes its eyes and sings a little
    song to


    itself until it reaches the end of the line, after which it continues to read
    the program


    as usual.


    **Simply JavaScript**


