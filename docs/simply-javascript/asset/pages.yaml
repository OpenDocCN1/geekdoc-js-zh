  md: 'ment. It’s with this fact in mind that quite a few people are trying to find
    the most


    viable way of easing the pressure.


    If JavaScript follows the path of most other programming languages—which, judging


    from the rise in libraries, it most likely will—it seems inevitable that popular
    applic-


    ation functionality will become invested in a few frameworks that will help ease


    the burden of the first two points outlined above. It remains to be seen whether
    or


    not the third problem can be solved.


    **Widgets**


    A number of common themes run through the design of a lot of applications. On


    the desktop, these functional commonalities include tasks like file handling and


    window control, and tools such as dialog boxes, toolbars, and menus. You can use


    a range of these standard components to build desktop applications, so you don’t


    have to reinvent the wheel every time you create a new application. By using these


    components, you take advantage of established conventions that aid usability—users


    already know what a menu looks like, how a dialog box works, and what they should


    do with a button.


    Parallels are starting to be drawn in application design on the Web. A few interac-


    tions are now becoming sufficiently common to warrant the creation of reusable


    components, or **widgets**, that, when dropped into a page, *just work*. Whereas
    previ-


    ously these widgets might have been offered piecemeal across a dozen sites spread


    over the Web, now they’re beginning to be aggregated in large libraries, to become


    what you might call **component frameworks**.


    These frameworks don’t provide just a bit of abstracting code that addresses specific


    browser differences; they offer an entirely new mode of development. Instead of


    writing all the HTML, all the styles, and all the JavaScript for a particular
    piece of


    functionality, you can just include a widget—maybe just one line of code—and your


    application will automatically boast the functionality that you once had to write


    hundreds of lines of code to achieve.


    Frameworks don’t just make coding easier, however; they also have an effect upon


    the language itself. If you start substituting one line of Dojo for a hundred
    lines of


    JavaScript, are you writing JavaScript, or are you writing Dojo?


    **355**


    **Looking Forward**'
