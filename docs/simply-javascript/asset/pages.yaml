    `responseXML` data returned by the server. If there was an *unsuccessful* request,
    we


    call `writeError` and give it a suitable error message.


    When `writeUpdate` is called, we know that we’ve got some XML data waiting to
    be


    parsed and added to our HTML. In order to use it, we need to extract particular
    data


    points from the XML, then insert them into appropriate elements in our page.


    When you’re liaising with a custom server-side script, you’ll have to agree on
    a


    format for the XML, so that the server-side script can write it correctly and
    the


    JavaScript can read it correctly. For this example, we’re going to assume that
    the


    XML has a form like this:


