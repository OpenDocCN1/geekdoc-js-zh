    up an


    event handler, but it’s still fairly easy:


    `*element*``.addEventListener("``*event*``",` `*eventListener*``, false);`


    In browsers that support W3C-standard event listeners, the `addEventListener`


    method is available on every object that supports events. This method takes three


    arguments: the name of the event to which you want to assign the listener (e.g.


    `"click"`), the listener function itself, and a Boolean value that you’ll usually
    want


    to set to `false` (more on this last argument in the section called “Event Propagation”).


    To set up an event listener in Internet Explorer, however, you need to use a method


    called `attachEvent`. This method works a lot like `addEventListener`, but it
    takes


    slightly different arguments:


    `*element*``.attachEvent("on``*event*``",` `*eventListener*``);`


    Spot the differences? The first argument—the name of the event you’re interested


    in—must be prefixed with `on` (for example, `"onclick"`), and there is no mysterious


    third argument.


