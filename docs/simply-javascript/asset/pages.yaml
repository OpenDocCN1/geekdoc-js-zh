    But you knew all that, right? This is a JavaScript book, after all, so let’s talk
    about


    the JavaScript that goes into your pages.


    **JavaScript for Behavior**


    As with CSS, you can add JavaScript to your web pages in a number of ways:


    ■You can embed JavaScript code directly in your HTML content:


    `<a href="evil.html"` `**onclick="**``***JavaScript code here***``**"**``>`


    ■You can include JavaScript code at the top of your HTML document in a `<script>`


    tag:


    `<script type="text/javascript"><!--//--><![CDATA[//><!--`


    `***JavaScript code here***`


    `//--><!]]></script>`


