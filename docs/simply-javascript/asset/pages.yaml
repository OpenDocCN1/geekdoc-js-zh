    **Google Web Toolkit**


    The Google Web Toolkit (GWT) uses Java as the basis for its engine.^(14) You never


    have to write JavaScript, HTML, or CSS if you don’t want to. Using GWT’s API,
    you


    can create entire applications in Java. The GWT compiler translates all of the
    Java


    into browser code (HTML, CSS, and JavaScript) for inclusion in your web site.


    This style of framework makes web application development similar to traditional


    application development—all the code is written by the developer, then compiled


    for execution. In GWT’s case, compilation includes the creation of HTML and


    JavaScript files that will help run your application in a browser.


    This framework is radically different from anything we’ve looked at in this book,


    but as an example, this Java class is used to create a page with a button that
    launches


    an alert box saying, “Hello, JavaScript:”


    `public class Hello implements EntryPoint {`


    `public void onModuleLoad() {`


    `Button b = new Button("Click me", new ClickListener() {`


    `public void onClick(Widget sender) {`


    `Window.alert("Hello, JavaScript");`


    `}`


    `});`


    `RootPanel.get().add(b);`


    `}`


    `}`


