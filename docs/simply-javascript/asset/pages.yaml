  md: 'Although quite a few of the JavaScript libraries out there will offer you a
    complete


    “Ajax experience” in a box, there is really no substitute for the freedom that
    comes


    with knowing how it works from the ground up. So let’s dive in!


    `**XMLHttpRequest**`**: Chewing Bite-sized**


    **Chunks of Content**


    The main concept of Ajax is that you’re instructing the browser to fetch small
    pieces


    of content instead of big ones; instead of a page you might request a single paragraph.


    Although cross-browser Ajax-type functionality was hacked together previously


    with `iframe`s, the current Ajax movement was sparked when `XMLHttpRequest` be-


    came available in more than just Internet Explorer.


    `XMLHttpRequest` is a browser feature that allows JavaScript to make a call to
    a


    server without going through the normal browser page-request mechanism. This


    means that JavaScript can make additional server requests behind the scenes while


    a page is being viewed. In effect, this allows us to pull down extra data from
    the


    server, then manipulate the page using the DOM—replacing sections, adding sections,


    or deleting sections depending on the data we receive. The distinction between


    normal and Ajax requests is illustrated in Figure 8.1.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_329_0.png)


    Figure 8.1\. Comparing a normal page request (replacing the whole page) with an
    Ajax request (replacing part of the


    page)


    Communications with the server that don’t use the page-request mechanism are


    called **asynchronous requests**, because they can be made without interrupting
    the


    user’s page interaction. A normal page request is synchronous, in that the browser


    waits for a response from the server before any more interaction is allowed.


    **Simply JavaScript**


    **306**'
