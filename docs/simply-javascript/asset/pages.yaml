  md: '`</tr>`


    ⋮


    `</tbody>`


    `</table>`


    There’s one row in there that we don’t want to be susceptible to striping—the
    row


    inside the `thead`.


    To avoid affecting this row through our row striping shenanigans, we need to get


    only the rows that are inside a `tbody`. This means we must add a step to our


    code—we need to get all of the `tbody` elements in the table (HTML allows more


    than one to exist), then get all the rows inside each `tbody`. This process will
    actually


    require *two* `for` loops—one to step through each of the `table` elements in
    the docu-


    ment, and another *inside* that to step through each of the `tbody` elements—but
    that’s


    fine; it just means more work for the computer. Since the variable name `i` is
    used


    for the counter in the outer `for` loop, we’ll name the counter variable in our
    inner


    `for` loop `j`:


    **stripy_tables.js** ***(excerpt)***


    `for (var i = 0; i < tables.length; i++)`


    `{`


    `var tbodys = tables[i].getElementsByTagName("tbody");`


    `for (var j = 0; j < tbodys.length; j++)`


    `{`


    `var rows = tbodys[j].getElementsByTagName("tr");`


    ⋮


    `}`


    `}`


    The results for both uses of `getElementsByTagName` in the code above will be
    limited


    to the current table, because we’re using it as a method of a particular element,
    not


    the entire document. The variable `rows` now contains a collection of all the
    `tr` ele-


    ments that exist inside a `tbody` element of the current table.


    **95**


