  md: 'Client-side validation takes place in the browser, before the user input is
    submitted


    for processing. The advantage here is that the user doesn’t have to wait for the
    request


    to be transferred to the server, for validation to occur there, and for the response
    to


    come back in the form of a new page. With JavaScript, you can tell the user more


    or less instantly if there is something wrong with the values that are about to
    be


    submitted.


    Of course, the user can always disable JavaScript to circumvent your client-side


    validation, so it’s important that you also have server-side validation in place
    to


    intercept any invalid submissions.


    **Intercepting Form Submissions**


    The key to client-side validation is the `submit` event that I mentioned in Table
    6.3.


    Whenever the user attempts to submit a form (whether by clicking a submit button


    or just by hitting **Enter** in a text field), a `submit` event is triggered on
    the correspond-


    ing `form` element. The default action for that event is to submit the form, but
    as we


    learned in Chapter 4, you can use JavaScript to cancel the default action for
    an event


    if you want to.


    The basic technique for client-side validation, then, is to set up either an event


    handler or an event listener for the form’s `submit` event, and cancel the default
    action


    if the form’s contents are not acceptable. Here’s roughly what this process looks


    like, using an event handler:


    `form.onsubmit = function()`


    `{`


    `if (``*form input is not valid*``)`


    `{`


    `*notify the user*`


    `return false;`


    `}`


    `};`


    Here’s how it looks if you’re using an event listener:


    `Core.addEventListener(form, "submit", function(event)`


    `{`


    `if (``*form input is not valid*``)`


    **Simply JavaScript**


