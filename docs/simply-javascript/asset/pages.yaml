    Figure 9.5\. Yahoo! Pipes’s intuitive and unique interface


    `canvas` and its cousin SVG give designers the ability to create lightweight,
    highly


    adaptable vector graphics for use in web interfaces. Combined with the interactivity


    of JavaScript, these technologies are finally giving web applications the power
    that


    their desktop cousins have enjoyed for so many years, thereby removing one of
    the


    biggest barriers to the proliferation of a totally web-based application system.


    And of course it’s not all business suits and briefcases on the side of JavaScript;


    there’s the potential to let your mind wander and produce some frivolous but fun


