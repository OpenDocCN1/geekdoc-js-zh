    **Rich Internet Applications**


    As you might have noticed as you read the previous section, the introduction of


    JavaScript and other new technologies is promoting a shift in the Web’s focus.
    Pre-


    viously, web sites were largely restricted to storing information, and offered
    very


    little interactivity, apart from the ubiquitous form fields.


    As JavaScript makes more and more desktop-style interactions possible, we’re be-


    ginning to see the Web transformed into an extension of the desktop. And eventually,


    who knows? We may lose the desktop altogether.


    These next-generation web applications are distinguished from their static ancestors


    by the name **Rich Internet Applications** (RIAs). The important distinction here
    is


    made by the term *rich*, which refers to the styles of interaction that are available


    through these applications: expanding/collapsing, seamlessly updating, auto-com-


    pletion, drag-and-drop, customized gestures—the list goes on.


    In RIAs, most user interface actions are driven from the client side, which makes


    them much more responsive and flexible, because no time-consuming communica-


    tion has to be performed with the server to complete these types of operations.
    Ex-


    amples of RIAs include most of Google’s recent applications⁷ (Maps, Mail, Calen-


    7 http://www.google.com/intl/en/options/


    **Simply JavaScript**


    **352**'
