    Figure 7.13\. A runtime error that’s easy to fix


    An “is not defined” error is about as easy an error to fix as there is. Like the
    “is not


    a function” error we saw earlier, it usually results from a simple typing mistake,


    but rather than a misspelled function or method name, “is not defined” indicates


    you’ve tried to use a variable or property that doesn’t exist.


    In this case, the error is really straightforward:


    **runtime.js** ***(excerpt)***


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_315_1.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_315_1.png)


    `12 var links = documents.getElementsByTagName("a");`


    As you can see, the developer has simply misspelled `document` as `documents`.


    Fix this error, and the script will successfully display the alert message, “The
    first


    link has no class assigned to it!”


    **Logic Errors**


    **Logic errors** aren’t so much errors as they are bugs in your script. The code
    runs


    fine as it was written—it just doesn’t behave the way you expected it to when
    you


    wrote it. These kinds of errors can be devilishly difficult to find because as
    far as


    the browser’s concerned the script is working just fine, so you never see an error


    message.


    Since every logic error is different, each one presents a new challenge. Just
    in case


    you’re not entirely clear what a logic error *is*, here’s a script with a few
    logic errors


    in it:


    **Simply JavaScript**


