    `12 links[i], "click", MyScript.doSomething);`


    `13 exampleLinks[exampleLinks.length] = links[i];`


    `14 }`


    `15 }`


    Run this corrected code, and the next thing you’ll discover is that the `click`
    event


    listener is assigned to *every* link in the document. Behind the scenes, the


    `exampleLinks` array is also filled with all the links in the page. What’s causing
    this


    issue?


    The source of this bug is an extremely common mistake made by JavaScript begin-


    ners, who will often confuse the assignment operator (`=`) with the equality operator


    (`==`). See it now?


    **logic.js** ***(excerpt)***


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_318_0.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_318_0.png)


    `9 if (links[i].className = "Example")`


    The condition in this `if` statement is supposed to be checking if the `className`


    property has a value *equal* to `"Example"`, but the developer has mistakenly
    used


    the assignment operator (`=`) here, causing this code to *set* the value of `className`
    to


    `"Example"`. An assignment statement used as a condition like this evaluates to
    the


    assigned value (`"Example"`), and since any non-empty string is considered “true,”


    the `if` statement will execute for every link it processes. The solution, of
    course, is


    to use the correct operator:


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_318_0.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_318_0.png)


    `9 if (links[i].className` `**==**` `"Example")`


    Run this modified code, however, and you’ll suddenly find that the event listener


    isn’t assigned to *any* of the links in the page—not even the first one in this
    paragraph:


