- img_proc: true
  md: '**An Eventful History**


    Thanks to the wide adoption of the Document Object Model (DOM) standard, ac-


    cessing HTML elements in your JavaScript code works very similarly in every


    browser. If only the same could be said for every aspect of JavaScript! As it
    happens,


    running JavaScript code in response to an event stands out as one of the few remain-


    ing features that are implemented in wildly varying ways in current browsers.


    The news isn’t all bad. There is a certain amount of common ground. For as long


    as they’ve supported JavaScript, browsers have had a simple model for dealing
    with


    events—using event handlers—and all current browsers provide compatible support


    for these handlers, despite the fact that a complete standard was never written
    for


    them.¹ As we’ll see, these techniques come with limitations that you’ll want to


    avoid when you can, but they offer a good fallback option.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_129_0.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_129_1.png)


    **DOM Level 0**


    The first version of the W3C DOM specification was called Document Object


    Model Level 1\. Since event handlers (along with a number of other nonstandard


    JavaScript features) predate this specification, developers like to call them
    Docu-


    ment Object Model Level 0.


    Stepping into the 21st century, the World Wide Web Consortium (W3C) has de-


    veloped the DOM Level 2 Events standard,² which provides a more powerful means


    of dealing with events, called event listeners. Almost all browsers now support
    this


    standard, the notable exception being Internet Explorer up to and including IE
    7.0.


    Internet Explorer has its own way of doing things, and though its approach is
    almost


    as powerful, it’s also sufficiently different to force us to write extra code
    to cater for


    this popular browser.


    It’s interesting to note that Microsoft participated in the development of the
    DOM


    Level 2 Events specification within the W3C, but when it came time to release
    IE


    5.5, Microsoft chose not to support the specification in that browser. In the
    two


    1 The HTML 4 specification briefly discusses them under the heading Intrinsic
    Events


    [http://www.w3.org/TR/html4/interact/scripts.html#h-18.2.3].


    2 http://www.w3.org/TR/DOM-Level-2-Events/


    **Simply JavaScript**


    **106**'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'major releases of Internet Explorer since then (IE 6.0 and 7.0), there has
    been no


    sign of Microsoft adding support for this standard.


    Thankfully, we don’t have to wait for Microsoft. The benefits of using event listeners,


    be they the W3C standard version or Internet Explorer’s peculiar alternative,
    are so


    great that legions of dedicated geeks have investigated the incompatibilities
    and


    come up with reasonable solutions. With a little work, we can build these solutions


    into our `Core` library so that we can use event listeners freely, without encountering


    browser compatibility issues.


    **Event Handlers**


    The simplest way to run JavaScript code in response to an event is to use an **event**


    **handler**. Event handlers have been around for as long as browsers have supported


    JavaScript, and predate the DOM standard. An event handler is a JavaScript function


