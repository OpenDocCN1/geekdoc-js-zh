- img_proc: true
  md: 'unless you use the question mark character (explained


    below).


    `**?**` **(question mark)**


    This character makes the preceding character optional.


    If placed after a plus or an asterisk, it instead dictates


    that the match for this preceding symbol will be a


    **minimal match**, including as few characters as pos-


    sible.


    `**^**` **(caret)**


    The caret matches the start of the string. This does


    not include any characters—it considers merely the


    position itself.


    `**$**` **(dollar)**


    A dollar character matches the end of the string. This


    does not include any characters—it considers merely


    the position itself.


    `**|**` **(pipe)**


    The pipe causes the regular expression to match either


    the pattern on the left of the pipe, or the pattern on


    the right.


    `**(**``**…**``**)**` **(round brackets)**


