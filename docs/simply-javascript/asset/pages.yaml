  md: '**Chapter****3**


    **Document Access**


    Without a document, JavaScript would have no way to make its presence felt. It’s


    HTML that creates the tangible interface through which JavaScript can reach its


    users.


    This relationship makes it vital that JavaScript be able to access, create, and
    manip-


    ulate every part of the document. To this end, the W3C created the Document Object


    Model—a system through which scripts can influence the document. This system


    not only allows JavaScript to make changes to the structure of the document, but


    enables it to access a document’s styles and change the way it looks.


    If you want to take control of your interfaces, you’ll first have to master the
    DOM.


    **The Document Object Model:**


    **Mapping your HTML**


    When an HTML document is downloaded to your browser, that browser has to do


    the job of turning what is essentially one long string of characters into a web
    page.


    To do this, the browser decides which parts are paragraphs, which parts are headings,'
  merge: -1
