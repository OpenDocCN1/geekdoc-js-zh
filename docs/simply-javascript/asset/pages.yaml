    changing images


    Adding animation to your interfaces is no different from animating something for


    TV, although it may seem somewhat less artistic. If you want a drop-down menu


    to actually drop *down*, you start it closed, end it open, and include a whole
    bunch


    of intermediate steps that make it look like it moved.


    The faster you want to move it, the fewer steps you put in between the starting
    and


    finishing frames. As it is, a drop-down menu without animation is akin to teleport-


    ation—the menu moves directly from point A to point B, without any steps in


    between. If you add just one step, it’s not quite teleportation, but it’s still
    faster than


    you can blink. Add ten steps and the menu begins to look like it’s moving smoothly.


