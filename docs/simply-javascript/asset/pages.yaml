  md: '**Regular Expressions**


    We use **regular expressions** to search for and replace patterns of text. They’re


    available in many different programming languages and environments, and are es-


    pecially prevalent in web development languages like JavaScript.


    The popularity of regular expressions has everything to do with how useful they


    are, and absolutely nothing to do with how easy they are to use—they’re not easy


    at all. In fact, to most people who encounter them for the first time, regular
    expres-


    sions look like something that might eventuate if you fell asleep with your face
    on


    the keyboard.


    Here, for example, is a relatively simple (yes, really!) regular expression that
    will


    match any string that might be a valid email address:


    `^[\w\.\-]+@([\w\-]+\.)+[a-zA-Z]+$`


    Scary, huh? By the end of this section, you’ll actually be able to make sense
    of that.


    To create a regular expression in JavaScript, use forward slashes (`/`) around
    the ex-


    pression as you would use single or double quotes around a string:


    `var regex =` `**/**``*pattern*``**/**``;`


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_266_0.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_266_1.png)


    **Escape the Forward Slash!**


    To include a forward slash as part of a regular expression, you must escape it
    with


    a preceding backslash (`\/`); otherwise, it will be interpreted as marking the
    end


    of the pattern.


    Alternatively, if you need to build a regular expression dynamically (say, using
    the


    value of a variable), you can use this alternative syntax to create the regular
    expres-


    sion from a string:


    `var regex = new RegExp("``*pat*``" +` `*variable*` `+ "``*tern*``");`


    **243**


    **Form Enhancements**'
