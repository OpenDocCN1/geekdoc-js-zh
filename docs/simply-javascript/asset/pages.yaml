    In the world of CSS, it’s considered bad practice to use inline styles to style
    an


    element’s appearance. Equally, in JavaScript it’s considered bad practice to use
    the


    `style` property as a means of styling an element’s appearance.


    As we discussed in Chapter 1, you want to keep the layers separated, so HTML


    shouldn’t include style information, and JavaScript shouldn’t include style inform-


    ation.


    The best way to change an element’s appearance with JavaScript is to change its


    class. This approach has several advantages:


    ■We don’t mix behavior with style.


    ■We don’t have to hunt through a JavaScript file to change styles.


    ■Style changes can be made by those who make the styles, not the JavaScript


    programmers.


    ■It’s more succinct to write styles in CSS.


    Most of the time, changes to an element’s appearance can be defined as distinct


    changes to its state, as described in its `class`. It’s these state changes that
    you should


    be controlling through JavaScript, not specific properties of its appearance.


