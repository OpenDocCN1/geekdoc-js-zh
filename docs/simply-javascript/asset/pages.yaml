  md: 'Rather than embedding presentation information in your HTML code, you should


    focus on the *reason* for the action—for example, you want a link to be displayed
    in


    a different color. Is the link especially important? Consider surrounding it with
    a


    tag that describes the emphasis you want to give it:


    `<p>Whatever you do,` `**<em>**``<a href="evil.html">don''t click this`


    `link</a>``**</em>**``!</p>`


    Is the link a warning? HTML doesn’t have a tag to describe a warning, but you
    could


    choose a CSS class name that conveys this information:


    `<p>Whatever you do, <a href="evil.html"` `**class="warning"**``>don''t`


    `click this link</a>!</p>`


    You can take this approach too far, of course. Some designers mistake tags like
    `<h1>`


    as presentational, and attempt to remove this presentational code from their HTML:


    `<p class="heading">A heading with an identity crisis</p>`


    Really, the presentational information that you should keep out of your document


    is the font, size, and color in which a heading is to be displayed. The fact that
    a


    piece of text *is* a heading is part of the content, and as such should be reflected
    in


    the HTML code. So this code is perfectly fine:


    `<h1>A heading at peace with itself</h1>`


    In short, your HTML should do everything it can to convey the meaning, or **semantics**


    of the content in the page, while steering clear of describing how it should look.


    Web standards geeks call HTML code that does this **semantic markup**.


    Writing semantic markup allows your HTML files to stand on their own as mean-


    ingful documents. People who, for whatever reason, cannot read these documents


    by viewing them in a typical desktop web browser will be better able to make sense


    of them this way. Visually impaired users, for example, will be able to use assistive


    software like screen readers to listen to the page as it’s read aloud, and the
    more


    clearly your HTML code describes the content’s meaning, the more sense tools like


    these will be able to make of it.


    **7**


    **The Three Layers of the Web**'
