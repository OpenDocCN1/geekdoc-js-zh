    Now be honest: how many of those errors could you have spotted without my help,


    based only on the behavior of the browser? And if you thought spotting logic errors


    in someone *else**’**s* code was difficult, just wait till you’re sitting in front
    of your *own*


    code armed only with the absolute conviction that your code is perfect in every


    way!


    In the absence of error messages, you need a specialized tool to help you track
    down


    logic errors like the ones we’ve just seen.


    **Debugging with Firebug**


    In the past, the most common approach to resolving logic errors in JavaScript
    code


    was liberal use of the `alert` function. If you’re expecting a `for` loop to run
    five


    times, you can stick an `alert` on the first line inside the loop and see if the
    browser


    displays five alert boxes when you load the page. If it does, you move the `alert`


    call somewhere else, to test another theory about why your script might be misbe-


    having.


    Sound tedious? It is.


    At the time of writing, a much more powerful (not to mention sane) approach is
    to


    use a JavaScript debugger, and by far the best debugger around is Firebug. Firebug


    is a free extension for Firefox that adds to the browser a panel containing a
    rich set


    of tools for diagnosing problems with your HTML, CSS, and JavaScript. You can


    download and install it from the Firebug web site,³ shown in Figure 7.15.


    3 http://www.getfirebug.com/


    **Simply JavaScript**


