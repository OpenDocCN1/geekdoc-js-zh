  md: 'animation. Watching *Snow White and the Seven Dwarfs* in 7.3 seconds might
    be


    efficient, but it doesn’t do much for the storyline.


    To create smooth, believable animation we need to be able to control when each


    frame is displayed. In traditional animation, the **frame rate** (that is, the
    number of


    images displayed per second) is fixed. Decisions about how you slice the intervals,


    where you slice them, and what you slice, are all up to you, but they’re displayed


    at the same, measured pace all the time.


    In JavaScript, you can create the same slices and control the same aspects, but
    you’re


    also given control of the pauses—how long it takes for one image to be displayed


    after another. You can vary the pauses however you like, slowing time down,


    speeding it up, or stopping it entirely (though most of the time you’ll want to
    keep


    it steady). We control time in JavaScript using `setTimeout`.


    Instead of allowing your program to execute each statement as quickly as it can,


    `setTimeout` tells your program to wait awhile—to take a breather. The function


    takes two arguments: the statement you want it to run next, and the time that
    the


    program should wait before executing that statement (in milliseconds).


    In order to stop the statement inside the `setTimeout` call from being evaluated
    im-


    mediately, we must make it into a string. So if we wanted to display an alert
    after


    one second, the `setTimeout` call would look like this:


    `setTimeout("alert(''Was it worth the wait?'')", 1000);`


    From the moment this statement is executed, our program will wait 1000 milli-


    seconds (one second) before it executes the code inside the string, and produces


    the popup shown in Figure 5.3.


    Technically speaking, what happens when `setTimeout` is called is that the browser


    adds the statement to a “to-do list” of sorts, while the rest of your program
    continues


    to run without pausing. Once it finishes what it’s currently doing (for instance,
    ex-


    ecuting an event listener), the browser consults its to-do list and executes any
    tasks


    it finds scheduled there.


    **Simply JavaScript**


    **166**'
