    a word, or anything else you want it to hold.


    Even though you don’t have to declare the data type up front, it’s still vital
    to know


    what types of data a variable can store, so that you can use and manipulate them


    properly inside your own programs. In JavaScript, you can work with numbers,


    strings, Booleans, arrays and objects. We’ll take a look at the first four of
