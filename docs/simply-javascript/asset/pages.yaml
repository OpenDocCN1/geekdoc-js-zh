  md: '**Event Propagation**


    Obviously, if you stick a `click` event listener on a hyperlink, then click on
    that link,


    the listener will be executed. But if, instead, you assign the `click` listener
    to the


    paragraph containing the link, or even the document node at the top of the DOM


    tree, clicking the link will still trigger the listener. That’s because events
    don’t just


    affect the target element that generated the event—they travel through the tree


    structure of the DOM. This is known as **event propagation**, and I should warn
    you:


    it’s not sexy or exciting.


    The W3C event model is very specific about how event propagation works. As illus-


    trated in Figure 4.6, an event propagates in three phases:


    1.


    In the **capture phase**, the event travels down through the DOM tree, visiting


    each of the target element’s ancestors on its way to the target element. For ex-


    ample, if the user clicked a hyperlink, that `click` event would pass through


    the document node, the `html` element, the `body` element, and the paragraph


    containing the link.


    At each stop along the way, the browser checks for **capturing event listeners**


    for that type of event, and runs them.


    What’s that? You don’t know what a capturing event listener is? Remember


    when I mentioned the third argument of the `addEventListener` method and I


    told you that you’d usually want to set it to `false`? Well, if you set it to
    `true`,


    you’ll create a capturing event listener.


    You’ll also recall that Internet Explorer’s `attachEvent` method doesn’t support


    a third argument. That’s because Internet Explorer’s event model doesn’t have


    a capture phase. Consequently, most developers avoid using capturing event


    listeners.


    2.


    In the **target phase**, the browser looks for event listeners that have been
    assigned


    to the target of the event, and runs them. The target is the DOM node on which


    the event is focused. For example, if the user clicks a hyperlink, the target
    node


    is the hyperlink.⁷


    7 This is the case except in Safari, where the target is actually the text node
    *inside* the hyperlink. The


