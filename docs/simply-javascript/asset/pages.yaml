    **Variables: Storing Data for your Program**


    It’s possible to write a program that defines the value of every single piece
    of data


    it uses, but that’s like driving a ski lift—you don’t really get to choose where
    you’re


    going. If you want your program to be able to take user input, and adapt to different


    pages and situations, you have to have some way of working with values that you


    don’t know in advance.


    As with most programming concepts, it’s very useful at this point to think of
    your


    computer as a BGC (Big, Giant Calculator). You know where you are with a calcu-


    lator, so it makes programming a bit easier to understand.


    Now, we could write a program for a calculator that said:


    `4 + 2`


    But every time we run that program, we’re going to get exactly the same answer.


    There’s no way that we can substitute the values in the equation for something


    else—values from another calculation, data from a file, or even user input.


    If we want the program to be a bit more flexible, we need to abstract some of
    its


    components. Take a look at the equation above and ask yourself, “What does it


    really do?”


