  md: '`var elementArray = $("kroner", "dollar", "yen");`


    Earlier in this chapter we created our own library function to get elements by
    class.


    Prototype has a similar function, which is slightly more powerful. It creates
    an ex-


    tension to the document node, called `getElementsByClassName`. Like our function


    `Core.getElementsByClass`, this method allows us to retrieve an array of elements


    that have a particular class:


    `var tables = document.getElementsByClassName("dataTable");`


    It also takes an optional second argument, which allows us to specify a parent
    ele-


    ment under which to search. Only elements that are descendants of the specified


    element, and have a particular class, will be included in the array:


    `var tables =`


    `document.getElementsByClassName("dataTable", $("content"));`


    The variable `tables` will now be an array containing elements that are descendants


    of the element with ID `content`, and that have a class of `dataTable`.


    Prototype also replicates all of the class functions that we created for our own
    library.


    These functions take exactly the same arguments that ours did, but the functions


    themselves are methods of Prototype’s `Element` object. So Prototype offers


    `Element.hasClassName`, `Element.addClassName`, and `Element.removeClassName`:


    `var body = document.getElementsByTagName("body")[0];`


    `Element.addClassName(body, "unreadable");`


    `if (Element.hasClassName(body, "unreadable"))`


    `{`


    `Element.removeClassName(body, "unreadable");`


    `}`


