  md: 'In order to submit the form’s contents using Ajax, we need to do a couple of
    things:


    1.


    Override the default form submission behavior.


    2.


    Get the form data.


    3.


    Submit the form data to the server.


    4.


    Check for the success or failure of submission.


    We’ll create this functionality inside an object called `ContactForm`. The only
    thing


    we need to do when we initialize the object is to override the form’s default
    submis-


    sion action. This can easily be done by intercepting the form’s `submit` event
    with


    an event listener:


    **contact_form.js** ***(excerpt)***


    `var ContactForm =`


    `{`


    `init: function()`


    `{`


    `var contactForm = document.getElementById("contactForm");`


    `Core.addEventListener(contactForm, "submit",`


    `ContactForm.submitListener);`


    `},`


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_354_0.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_354_1.png)


    **Ajax and Form Validation**


    Adding multiple event listeners to a given element for a given event can be risky


    business, because you have no control over the order in which they will be in-


    voked. Thus, it isn’t safe to assign an Ajax form submitter and a client-side
    form


    validator separately. If you do so, the submitter may be executed before the valid-


    ator, and you might end up sending invalid data to the server. Link your validator


    and your submitter together to ensure that validation takes place before the form


    is submitted.


    Now, before the form is submitted, the `submitListener` method will be run. It’s


    inside this function that we collect the form data, send off an Ajax request,
    and


    cancel the normal form submission:


    **331**


    **Ajax**'
