    The JavaScript techniques we used to animate our digital film reel can be applied


    whenever you want to make a series of progressive changes to the display over
    time.


    All you have to do is replace `background-position` with the attribute you want
    to


    modify: color, width, height, position, opacity—anything you can think of.


    In our next example, we’re going to look at moving an HTML element along a linear


    path. So, instead of changing the `background-position` of the target element,
    we


    change its actual position.


    In cases where you want to move an element, you usually know where it is now


    (that is, its starting location), and where you want it to be (its end location),
    as Fig-


