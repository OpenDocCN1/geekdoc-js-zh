    Most of the variables we saw in this chapter weren’t declared inside a function,
    and


    therefore reside in what’s known as global scope. Variables declared in **global
    scope**


    may be accessed from any other JavaScript code running in the current web page.


    This mightn’t sound too bad, and it often won’t be a problem … until you start
    using


    common variable names inside your functions.


    Take a look at this program:


    `function countWiis()`


    `{`


    `stock = 5;`


    `sales = 3;`


    `return stock - sales;`


    `}`


    `stock = 0;`


    `wiis = countWiis();`


    What will be the value of `stock` after this code has run?


    You’d probably expect it still to be `0`, which is what we set it to be before
    calling


    `countWiis`. However, `countWiis` *also* uses a variable called `stock`. But because
    the


    function doesn’t use `var` to declare this variable, JavaScript will go looking
    *outside*


    the function—in the global scope—to see whether or not that variable already exists.


    Indeed it does, so JavaScript will assign the value `5` to that global variable.


    What we really intended was for `countWiis` to use its own *separate* `stock`
    variable.


    To achieve this, we need to declare that variable with **local scope**. A variable
    with


    local scope exists only within the confines of the function in which it was created.


    It also takes precedence over variables with global scope—if a local variable
    and a


    global variable both have the same name, a function will always use the local
    vari-


    able, leaving the global variable untouched.


