    `**if (Core.hasClass(fold, "expanded"))**`


    `**{**`


    `**clearTimeout(fold._accordionContent._timer);**`


    `**Accordion.collapseAnimate(fold._accordionContent);**`


    `**}**`


    `**else**`


    `**{**`


    `Core.addClass(fold, "collapsed");`


    `**}**`


    `},`


    For the `collapse` method, we have to move the class changes into the animation


    method because we need the item to remain expanded until the animation has fin-


    ished (otherwise it will disappear immediately, before the animation has had a


    chance to take place). To kick off the animation, we check whether the current
    item


    has the class `expanded`, and if it does, we send the browser off to execute


    `collapseAnimate`, but not before we cancel any expansion animation that’s currently


    taking place. If we didn’t cancel the expansion first, the collapsing animation
    might


    coincide with an expansion animation that was already in progress, in which case


    we’d end up with a stuck accordion (never a pretty sight—or sound).


    If an element doesn’t have the `expanded` class on it when a collapse is initiated,
    we


    simply add the `collapsed` class and forego the animation. This takes care of
    the


    circumstance in which the page first loads and we need to hide all the menu items.


