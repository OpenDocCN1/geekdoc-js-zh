  md: 'It also takes care of automatically cleaning up the listener when the document


    is unloaded, so that it does not cause memory leaks in Internet Explorer.


    `**Core.removeEventListener**`


    This method removes an event listener that was previously added to an element.


    It works just like the standard `removeEventListener` method, except that we


    pass the element as the first argument of the method, and like


    `Core.addEventListener`, it takes no final Boolean argument:


    `Core.removeEventListener(``*element*``, "``*event*``",` `*eventListener*``);`


    `**Core.preventDefault**`


    This method prevents the default action associated with an event from occurring.


    It works just like the standard `preventDefault` method, except that we pass the


    event object as an argument of the method:


    `Core.preventDefault(``*event*``);`


    `**Core.stopPropagation**`


    This method stops the event from propagating further, and potentially triggering


    event listeners assigned to ancestors of the element to which the current event


    listener is assigned:


    `Core.stopPropagation(``*event*``);`


    And just like that, all your event listener compatibility headaches vanish! Through


    the rest of this book, whenever we deal with event listeners, we’ll use these
    methods.


