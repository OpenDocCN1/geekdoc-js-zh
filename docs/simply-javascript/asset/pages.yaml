  md: 'That said, the two other types of form enhancements that we’ve looked at in
    this


    chapter—client-side validation and custom controls—are well served by one library


    or another.


    **Form Validation**


    One of the Dojo library’s main strengths is its library of widgets, many of which
    are


    enhanced versions of the basic HTML form controls. Some of these widgets provide


    built-in validation features. For example, with Dojo loaded, you can create a
    text


    field that only accepts whole numbers (integers) like this:


    `<input type="text" name="``*name*``"` `**class="dojo-IntegerTextbox"**` `/>`


    This code invokes Dojo’s `IntegerTextbox` widget, which automatically displays
    an


    error message when the user types anything that isn’t a whole number into the
    field.


    As of this writing, however, Dojo’s validation widgets aren’t well documented,
    and


    the requirement that all the fields of a form are valid before the user is allowed
    to


    submit the form still necessitates your writing some JavaScript code of your own.


    In short, figuring out just how to use Dojo to automate your form validation can


    take a lot longer than writing your own validation library, as we did in this
    chapter.


    That said, if you’re willing to look beyond the major JavaScript libraries, you’ll
    find


    a couple of well-developed mini-libraries that do client-side validation very
    well


    indeed.


    wForms is an actively-developed library that works very much like the reusable


    form validation script that we developed in this chapter.⁵ Like our library, it
    applies


    reusable validation rules to your form fields based on the `class` attribute.
    Here’s a


    list of the class names that it recognizes, and the corresponding checks that
    it carries


    out:


    `**required**`


    The field cannot be left empty. By setting this


    class name on an element that contains a number


    of form fields, you can require the user to fill in


    *at least one* of those fields.


    5 http://www.formassembly.com/wForms/


    **Simply JavaScript**


    **272**'
