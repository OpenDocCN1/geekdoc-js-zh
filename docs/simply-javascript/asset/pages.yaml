  md: '![](img/59e689d797f11aa539b5ad8ad6b1fc1d_302_0.png)


    Figure 7.1\. The Firefox Error Console


    As you can see, the Firefox error console displays more than just errors:


    **Errors**


    problems with your code that prevented the browser from continuing


    to run the script


    **Warnings**


    problems with your code that the browser was able to work around,


    but which may indicate that the script isn’t doing what you expect it


    to


    **Messages**


    notes from your code that tell you what it’s doing, usually only used


    as a debugging tool by browser extension developers—you won’t see


    many of these


    For each entry in the console, the specific file and line number that generated
    the


    notification will be displayed. Depending on the nature of the entry, the error
    console


    may even show you the line in question, with a little arrow pointing to the exact


    code that generated the entry.


    When you’re trying to track down a problem in your code, you’ll usually start
    by


    opening the error console and clicking the **Clear** button to empty out the backlog
    of


    entries that may be displayed. Then you can reload the page in your main browser


    window and note the notifications that appear in the error console. If there are
    a


    lot of notifications, you might start by clicking the **Errors** button to see
    only the most


    severe errors, and concentrate on fixing them first, before returning to the **All**
    view


    to fix the less serious issues.


    **279**


    **Errors and Debugging**'
