    comparing it. The main thing we have to be careful about here is to not overwrite


    an element’s existing classes. Also, to make it easy to remove a class, we shouldn’t


    add a class to an element that already has that class. To make sure we don’t,
    we’ll


    use `Core.hasClass` inside `Core.addClass`:


    **core.js** ***(excerpt)***


    `Core.addClass = function(target, theClass)`


    `{`


    `if (!Core.hasClass(target, theClass))`


    `{`


    `if (target.className == "")`


    `{`


    `target.className = theClass;`


    `}`


    `else`


    `{`


    `target.className += " " + theClass;`


    `}`


    `}`


    `};`


    The first conditional statement inside `Core.addClass` uses `Core.hasClass` to
    check


    whether or not the `target` element already has the class we’re trying to add.
    If it


    does, there’s no need to add the class again.


    If the `target` *doesn**’**t* have the class, we have to check whether that element
    has


    *any* classes at all. If it has none (that is, the `className` is an empty string),
    it’s safe


    to assign `theClass` directly to `target.className`. But if the element has some


    preexisting classes, we have to follow the syntax for multiple classes, whereby
    each


    class is separated by a space. Thus, we add a space to the end of `className`,
    followed


    by `theClass`. Then we’re done.


    Now that `Core.addClass` performs all these checks for us, it’s easy to use it


    whenever we want to add a new class to an element:


    **89**


