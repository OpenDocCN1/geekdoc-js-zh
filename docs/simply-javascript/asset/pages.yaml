- img_proc: true
  md: 'Essentially, a regular expression represents a pattern specified with ordinary
    and


    special characters. For instance, if you wanted a pattern that matched the string


    “JavaScript,” your regular expression pattern could be:


    `JavaScript`


    However, by including special characters, your pattern could also be:


    `^Java.*`


    The caret (`^`), the dot (`.`), and the asterisk (`*`) are all special characters
    that have a


    specific meaning inside a regular expression. Specifically, the caret means “the
    start


    of the string,” the dot means “any character,” and the asterisk means “zero or
    more


    of the preceding character.”


    Therefore, the pattern `^Java.*` matches not only the string “JavaScript,” but


    “Javascript,”  “JavaHouse,”  “Java, the most populous island in the world,” and
    any


    other string beginning with “Java.”


    Here are some of the most commonly used regular expression special characters


    (try not to lose too much sleep attempting to memorize these):


    `**.**` **(dot)**


    This is the wildcard character. It matches any single


    character except line break characters (`\r` and `\n`).


    `*****` **(asterisk)**


    An asterisk requires that the preceding character ap-


    pear zero or more times.


    When matching, the asterisk will be **greedy**, including


    as many characters as possible. For example, for the


    string “a word here, a word there,” the pattern


    `"a.*word"` will match “a word here, a word.” In order


    to make a minimal match (just “a word”), use the


    question mark character (explained below).


    `**+**` **(plus)**


    This character requires that the preceding character


    appears one or more times. When matching, the plus


    will be greedy (just like the asterisk, described above)


    **Simply JavaScript**


    **244**'
  merge: -1
