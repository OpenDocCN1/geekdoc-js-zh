- img_proc: true
  md: '**HTML for Content**


    Everything that’s needed to read and understand the content of a web page belongs


    in the HTML code for that page—nothing more, nothing less. It’s that simple. Web


    designers get into trouble when they forget the K.I.S.S. principle,³ and cram
    non-


    content information into their HTML code, or alternatively move some of the page’s


    content into the CSS or JavaScript code for the page.


