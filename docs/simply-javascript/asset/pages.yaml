  md: '![](img/59e689d797f11aa539b5ad8ad6b1fc1d_33_0.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_33_1.png)


    **CDATA?**


    If you’re wondering what all that gobbledygook is following the `<script>`


    tag and preceding the `</script>` tag, that’s what it takes to legitimately embed


    JavaScript in an XHTML document without confusing web browsers that don’t


    understand XHTML (like Internet Explorer).


    If you write your page with HTML instead of XHTML, you can get away with


    this much simpler syntax:


    `<script type="text/javascript">`


    `*JavaScript code here*`


    `</script>`


    ■You can put your JavaScript code in a separate file, then link to that file from
    as


    many HTML documents as you like:


    `<script type="text/javascript" src="script.js"></script>`


    ⋮


    `<a href="evil.html"` `**class="warning"**``>`


    **script.js** ***(excerpt)***


    `***JavaScript code here***`


    Guess which method you should use.


    Writing JavaScript that enhances usability without cluttering up the HTML docu-


    ment(s) it is applied to, without locking out users that have JavaScript disabled
    in


    their browsers, and without interfering with *other* JavaScript code that might
    be


    applied to the same page, is called **unobtrusive scripting**.


    Unfortunately, while many professional web developers have clued in to the benefits


    of keeping their CSS code in separate files, there is still a lot of JavaScript
    code


    mixed into HTML out there. By showing you the *right* way to use JavaScript in
    this


    book, we hope to help change that.


