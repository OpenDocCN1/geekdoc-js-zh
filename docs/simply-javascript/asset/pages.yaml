  md: 'The most serious problem in the script is the infinite loop, which is just
    about as


    bad a problem as you’ll ever create with a logic error. Older browsers would become


    completely unresponsive, and would have to be forcibly terminated by the user
    in


    the event of an infinite loop. These days, browsers will detect when a script
    has


    been running for a long time, and will display a message like the one shown in


    Figure 7.14, which offers to stop the script and return control to the user.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_317_0.png)


    Figure 7.14\. The prompt an infinite loop will produce (eventually)


    Let’s start by fixing this problem. Here’s the code responsible for the infinite
    loop:


    **logic.js** ***(excerpt)***


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_317_1.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_317_1.png)


    `12 exampleLinks[exampleLinks.length] = links[i];`


    `13 i--;`


    When the script has discovered a link that it wants to add to the `exampleLinks`
    array,


    it does so with the first of these two statements. Unfortunately, the developer
    seems


    to have suffered a brain fart, and assumed that adding a reference to the link
    to the


    end of the `exampleLinks` array would remove it from the node list stored in `links`.


    In an effort to compensate for this imagined loss of an item from `links`, the
    developer


    has decremented the counter variable with the second statement (`i--;`).


    In fact, the link remains in the `links` node list, and all the decrementing `i`
    achieves


    is to cause the `for` loop to process the same link over and over again—our infinite


    loop.


    We can avoid the infinite loop simply by removing the second statement:


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_317_1.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_317_1.png)
    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_317_1.png)


    `7 for (var i = 0; i != links.length; i++)`


    `8 {`


    `9 if (links[i].className = "Example")`


    **Simply JavaScript**


    **294**'
