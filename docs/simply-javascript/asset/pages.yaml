    of


    the string that was matched by the first parenthesized portion of the regular


    expression (in this case, the space before the class name, if any). The third


    element in the array (array index `2`) contains the portion of the string matched


    by the second parenthesized portion of the expression, which in this case is


    the actual class name—exactly what we’re after!


