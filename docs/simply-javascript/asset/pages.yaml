  md: '**The Right Way**


    So, how much does all this stuff really matter? After all, people have been building


    web sites with HTML, CSS, and JavaScript mixed together for years, and for the


    majority of people browsing the Web, those sites have worked.


    Well, as you come to learn JavaScript, it’s arguably more important to get it
    right


    than ever before. JavaScript is by far the most powerful of the three languages
    that


    you’ll use to design web sites, and as such it gives you unprecedented freedom
    to


    completely mess things up.


    As an example, if you really, really like JavaScript, you could go so far as to
    put


    everything—content, presentation, and behavior—into your JavaScript code. I’ve


    actually seen this done, and it’s not pretty—especially when a browser with Java-


    Script disabled comes along.


    Even more telling is the fact that JavaScript is the only one of these three languages


    that has the ability to hang the browser, making it unresponsive to the user.⁴


    Therefore, through the rest of this book, we’ll do our darnedest to show you the


    right way to use JavaScript, not just because it keeps your code tidy, but because
    it


    helps to keep the Web working the way it’s meant to—by making content accessible


    to as many people as possible, no matter which web browser they choose to use.


