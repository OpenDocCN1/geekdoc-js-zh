  md: '**Chapter****6**


    **Form Enhancements**


    HTML hasn’t changed much in the past ten years. Since browsers implemented the


    changes in HTML 4 around 1997, the collection of tags and attributes that we use


    on the web has essentially stayed the same. Thanks to ongoing improvements to


    CSS support in browsers, we have been able to create richer, more intricate designs


    with that limited markup. Like the designer fashions that are paraded down the


    runway each season, the styles are always fresh and new, even if the models under-


    neath look eerily alike.


    But there is one aspect of web design for which CSS can’t hide the stagnation
    of


    HTML: forms. No matter how we dress them up, HTML has for the past decade


    supported only this limited set of form controls:


    ■text input fields


    ■checkboxes


    ■radio buttons


    ■drop-down menus and lists


    ■multi-line text areas


    ■buttons'
