  md: '![](img/59e689d797f11aa539b5ad8ad6b1fc1d_313_0.png)


    Figure 7.11\. A runtime error … how novel!


    As a newcomer to JavaScript, you’ll probably see this message a lot—especially
    if


    you aren’t used to the case-sensitive nature of JavaScript. Attempting to call
    `Alert`


    instead of `alert`, for example, will produce this error message. But it can happen


    in more subtle cases too, like calling a string method like `toLowerCase` on a
    text


    node (which isn’t a string), rather than the `nodeValue` of the text node (which
    is).


    In this example, the cause is far simpler: the developer has tried to call a method


    called `getElementsById` when there is no such method. The method the developer


    was probably thinking of is `getElementById` (without the “s”). Since you can
    only


    have one element with a given ID in a document, it wouldn’t make sense for there


    to be a method called `getElementsById`.


    The fix in this case is trivial:


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_313_1.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_313_1.png)


    `5 var example = document.``**getElementById**``("example");`


    But it turns out that fixing this problem actually causes another runtime error,
    shown


    in Figure 7.12.


    A “has no properties” error means that you’re trying to treat something that isn’t


    an object as if it were an object, by trying to access a property or method on
    some-


    thing that has neither.


    The most common cause of this error is a method that normally returns an object


    (like `getElementById`) returning `null`, JavaScript’s special “no object” value.
    If your


    code assumes that an object would be returned and treats the returned value as


    such, you’ll end up with an error like this.


    **Simply JavaScript**


    **290**'
