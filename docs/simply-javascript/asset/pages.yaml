    A truth that many JavaScript books won’t tell you is that JavaScript is a tough
    lan-


    guage to get right the first time.


    By now you should have a fairly solid feel for JavaScript as a language, and how
    to


    use things like event listeners and the DOM API to enrich the web sites you build.


    But if you’ve actually tried to write an original script of your own, chances
    are that


    you came away feeling humbled, and maybe even a little angry.


    That frustration’s probably due, in part at least, to the fact that JavaScript,
    like all


    languages that run in the browser, is designed to fail silently by default. When
    things


    go wrong in the code you write, there’s no point in shouting about it to your
    hapless


    visitors, so browsers just quietly set aside broken scripts and ignore them. The
    in-


    structions in this chapter will show you how to get the browser to speak up, so
    you


    can find out about JavaScript errors as they happen.


    However, even once you can *see* the error messages, you’ll likely find that most


    JavaScript errors aren’t all that helpful—especially if you’re new to the language.


    Most of them are written in “programmer-ese,” or complain about a perfectly good


    part of the code when the problem is actually elsewhere. So we’ll spend some time'
