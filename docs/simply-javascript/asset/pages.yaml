    (`SoccerBall.targetX` `–` `SoccerBall.originX`) and dividing it by the total


    number of frames in the animation (`SoccerBall.duration *`


    `SoccerBall.frameRate`). Calculating this figure during initialization—rather


    than inside the actual animating function—reduces the number of calculations


    that we’ll have to complete for each step of the animation.


