    **Finding Elements by Class Name**


    It’s quite often very handy to find elements based on a class rather than a tag
    name.


    Although we’re stuck with the same 91 HTML elements wherever we go, we can


    readily customize our classes to create easily referenced groups of elements that


    suit our purposes.


    Compared to searching by tag name, using a class as a selector can be a more gran-


    ular way to find elements (as it lets you get a subset of a particular tag name
    group)


    as well as a broader way to find elements (as it lets you select a group of elements


    that have a range of tag names).


    Unfortunately, no built-in DOM function lets you get elements by class, so I think


    it’s time we created our first real function! Once that’s done, we can add the
    function


    to our custom JavaScript library and call it whenever we want to get all elements


    with a particular class.


    **Starting your First Function**


    When you’re writing a function or a program, your first step should be to define


    clearly in plain English what you want it to do. If you’re tackling a relatively
    simple


    problem, you might be able to translate that description straight into JavaScript,
    but


    usually you’ll need to break the task down into simple steps.


    The full description of what we want to do here could be something like, “find
    all


    elements with a particular class in the document.”


    That sounds deceptively simple; let’s break it down into more logical steps:


    1.


    Look at each element in the document.


    2.


    For each element, perform a check that compares its class against the one we’re


    looking for.


    3.


    If the classes match, add the element to our group of elements.


    **Simply JavaScript**


