    One of the most important parts of the `submitForm` method is the variable


    `parameters`. This variable is used to store the **serialized** contents of the


    form—all of the field names and values combined into one long string that’s


    suitable for sending in a POST request. We start this string off with the value


    `"submitby=ajax"`, which effectively adds to the form a variable named `submitby`


    with a value of `ajax`. The server can use this variable to identify form submis-


    sions that are transmitted via Ajax—as opposed to a standard form submis-


    sion—and respond differently to them (for example, by sending the response


    in XML format rather than as a full HTML page).


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_357_4.png)


    A form can contain a number of different elements, and we have to deal with


    all of them in order to produce a properly serialized version of the form’s


    contents. There are three essential element types—`input`, `select`, and


    `textarea`—but `input` elements can have different types with different behaviors,


    so we have to cater for those as well. In order to minimize code repetition, we


    use the DOM to get node lists of each of the three element types, then we


    combine them into one big array—`formElements`—through which we can iterate


    in one fell swoop.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_357_5.png)


    All of the `textarea`s and `select`s can be added to `formElements` straight away,


    because those elements are always of the same type.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_357_6.png)


    When it comes to `input` elements, we have to distinguish between text `input`s,


    hidden `input`s, checkboxes, and radio buttons. Text `input`s and hidden `input`s


    can always be submitted with the form, because they don’t have an on/off


