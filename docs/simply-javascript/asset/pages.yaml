  md: '**Stopping** `**setInterval**`


    Just like `setTimeout`, `setInterval` returns a timer ID. To stop `setInterval`
    from


    executing any more scheduled code, we pass this ID to `clearInterval`:


    `var timer = setInterval("alert(''Do this over and over!'')", 3000);`


    `clearInterval(timer);`


    Done! No more timer.


    **Revisiting Rich Tooltips**


    It’s probably easiest to get a feel for working with `setTimeout` if we start


    simply—using it to put in a short delay on an action. I’ll demonstrate this by


    modifying the Rich Tooltips script from Chapter 4, so that the tooltips behave
    more


    like regular tooltips and appear after the user has hovered the mouse over the
    element


    for a moment. We won’t need to change much of the program—just the two event


    listeners that handle the `mouseover`/`focus` and `mouseout`/`blur` events.


    Let’s think about how the delay should work. We want the tooltip to pop up about


    500 milliseconds after the `mouseover` or `focus` event occurs. In our original
    script,


