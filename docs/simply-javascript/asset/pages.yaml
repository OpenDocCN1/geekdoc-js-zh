  md: 'provides a good illustration of what’s involved in controlling timers via user
    inter-


    action; we’ll look at how it can be used in a more complex interface later in
    this


    chapter.


    **Creating a Repeating Timer**


    There’s another timing function that’s very similar to `setTimeout`, but which
    allows


    you to schedule a repeating piece of code. This function is called `setInterval`.


    `setInterval` takes exactly the same arguments as `setTimeout`, and when it’s
    ex-


    ecuted, it waits in exactly the same way. But the fun doesn’t stop once the scheduled


    code has finished executing—`setInterval` schedules the code again, and again,


    and again, and again, until you tell it to stop. If you tell it to wait 1,000
    milliseconds,


    `setInterval` will schedule the code to run once every 1,000 milliseconds.


    Each interval is scheduled as a separate task, so if a particular occurrence of
    the


    scheduled code takes longer to run than the interval time, the next occurrence
    will


    execute immediately after it finishes, as the browser scrambles to catch up.


    At the start of this chapter I mentioned that there were really one and a half
    functions


    that could be used to control time in JavaScript. That’s because `setInterval`
    isn’t


    used very often.


    As `setInterval` relentlessly schedules tasks at the specified interval no matter
    how


    long those tasks actually take, long-running tasks can generate an undesirable


    backlog that causes fast-running tasks to run instantly, with no pause between
    them.


    In an animation, this can be disastrous, as the pause between each frame is crucial


    to generating that illusion of motion.


    When it comes to animation, it’s usually best to rely on chained `setTimeout`
    calls,


    including at the end of your scheduled code a `setTimeout` call to that same piece


    of code. This approach ensures that you only have one task scheduled at any one


    time, and that the crucial pauses between frames are maintained throughout the


    animation. You’ll see examples of this technique in each of the animation programs


    we write in this chapter.


    **Simply JavaScript**


    **174**'
