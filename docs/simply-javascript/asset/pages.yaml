  md: '**Custom Controls**


    As I mentioned earlier, one of the main areas of focus for the Dojo library has
    been


    the creation of rich widgets to supplement the user interface elements that plain


    HTML has to offer. Among these is an extensive collection of Form Widgets that


    work in the same way as the slider control that we developed in this chapter,


    providing a rich, JavaScript-powered user interface that sits atop a standard
    HTML


    form field.


    Here’s a quick list of some of Dojo’s Form Widgets:


    **Button**


    an advanced version of the HTML `button` element


    **Checkbox**


    like a standard HTML checkbox, but uses customizable


    images for the checkbox


    **ColorPalette**


    displays a grid of color swatches from which the user can


    choose


    **ComboBox**


    like a standard text field, but pops up a list of suggested


    values in response to user input


    **DatePicker**


    displays an interactive calendar for selecting a date


    **TimePicker**


    displays a rich interface for selecting a time of day


    **Editor2 (RichText)**


    a WYSIWYG HTML editor that lets the user input and


    format rich text that’s submitted as HTML


    **HslColorPicker**


    displays a rich interface for selecting a color value


    **Select**


    an advanced version of the HTML `select` element


    **Slider**


    a graphical slider control, much like the one we built in


    this chapter


    **Spinner**


    an input field that lets you select a number by clicking


    up and down arrows to adjust the value


    Again, as of this writing, Dojo’s widgets are sparsely documented, so trying to
    use


    them without advanced JavaScript experience can be frustrating.


    **Simply JavaScript**


    **274**'
