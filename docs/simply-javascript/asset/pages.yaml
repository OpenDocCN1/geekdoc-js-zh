    Now that you can *see* JavaScript error messages, you need to learn how to interpret


    them.


    **Common Errors**


    Every browser has its own particular dialect for JavaScript error messages. Almost


    invariably, Firefox produces the most sensible and helpful messages of current


    browsers, so your best bet when faced with a confusing message is to open your


    page in Firefox to see what its error console says.


