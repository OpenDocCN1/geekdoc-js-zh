    **Statements: Bite-sized Chunks**


    **for your Browser**


    So now you know how to tell the browser that it needs to run some JavaScript,
    but


    you don’t know any JavaScript for it to run. We’d better fix that!


    Earlier, we were talking about reducing a problem into steps that a computer can


    understand. Each small step you take in a program is called a **statement**, and
    it tells


    the browser to perform an action. By building up a series of these actions, we
    create


    a **program**. Statements are to programs as sentences are to books.


    In JavaScript each statement has to be separated by a new line or a semicolon.
    So,


    two statements could be written like this:


    `*Statement one*`


    `*Statement 2.0*`


    Or they could be written like this:


    `*Statement one*``;``*Statement 2.0*``;`


