    This sort of interface enhancement is a great example of how JavaScript can improve


    the user experience on a page that works just fine without it. Making such enhance-


    ments work smoothly not just for mouse users, but for visitors who navigate using


    the keyboard (not to mention users of assistive technologies like screen readers),


    requires careful thought, and extensive use of event listeners.


