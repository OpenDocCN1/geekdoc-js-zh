    `**Content-Type**` **Required**


    Opera requires you to set the `Content-Type` header of a POST request using the


    `setRequestHeader` method. Other browsers don’t require it, but it’s the safest


    approach to take to allow for all browsers.


    To simulate a form submission using a GET request, you need to hard-code the


    names and values into the `open` URL, then execute `send` with a `null` value:


    `requester.open("GET",`


    `"query.php?name=Clark&email=superman@justiceleague.xmp", true);`


