  md: '**Seamless Form Submission with Ajax**


    As we saw in Chapter 6, forms are integral to the user experience provided by
    most


    web sites. One of the things Ajax allows us to do is to streamline the form submission


    process by transmitting the contents of a form to the server without having to
    load


    an entirely new page into the browser.


    It’s fairly simple to extend the Ajax code that we used in the previous example
    so


    that it can submit a form. Consider the contact form pictured in Figure 8.5, which


    uses this code:


    **contact_form.html** ***(excerpt)***


    `<form id="contactForm" action="form_mailer.php" method="POST">`


    `<fieldset>`


    `<legend>`


    `Contact Form`


    `</legend>`


    `<label for="contactName">`


    `Name`


    `</label>`


    `<input id="contactName" name="contactName" type="text" />`


    `<label for="contactEmail">`


    `Email Address`


    `</label>`


    `<input id="contactEmail" name="contactEmail" type="text" />`


    `<label for="contactType">`


    `Message Type`


    `</label>`


    `<select id="contactType" name="contactType">`


    `<option value="1">Enquiry</option>`


    `<option value="2">Spam</option>`


    `<option value="3">Wedding proposal</option>`


    `</select>`


    `<label for="contactMessage">`


    `Message`


    `</label>`


    `<textarea id="contactMessage" name="contactMessage"></textarea>`


    `<input id="contactNewsletter" name="contactNewsletter"`


    `type="checkbox" value="1" />`


    `<label for="contactNewsletter">`


    `I''d like to receive your hourly newsletter`


    `</label>`


    **329**


