    **Dojo**


    We’ve taken a decent look at Dojo throughout this book, but only as a library,
    not


    a framework.^(13) Dojo offers more than just helper functions to shortcut common


    scripting actions—it actually provides an entire system for developing interfaces


    using common widgets.


    The widgets currently available in Dojo number well over a hundred and include


    such items as accordion menus, combo boxes, date pickers, fish-eye lists, progress


    bars, sliders, and tree menus. The framework also has its own layout system, which


    allows you to create panes with related dimensions (such as equal heights) and


    adjustable dimensions—something that’s quite common in desktop application


    design.


    We can implement widgets in Dojo in two ways: structurally and programmatically.


    If you use the structural method, you must modify the HTML structure of your page


    in order to include the Dojo widgets you want to use. To achieve this, you tack
    non-


    standard attributes onto particular HTML elements—a big no-no if web standards


    are an important consideration to you.


    The programmatic creation of Dojo widgets is most useful when you want to create


    new interface elements on the fly, or you don’t want to dirty your HTML with attrib-


    utes that aren’t meant to be there. You create the new widget inside your JavaScript,


    then include it on the page via the DOM.


    Following the tenets of progressive enhancement, a lot of Dojo widgets try to
    use


    HTML elements that provide the same functionality, then transform them into more


    complex objects. For example, a `select` box can be turned into a combo box (a
    box


    that allows you to type and receive suggestions) with the addition of some extra


    attributes:


    `<select dojoType="ComboBox" dataUrl="example.php" name="state">`


    `</select>`


    13 http://dojotoolkit.org/


    **Simply JavaScript**


    **358**'
