  md: 'The Yahoo! UI Library (YUI) offers a less extensive collection of controls,⁷
    but those


    that it does provide are richly documented with plenty of beginner-friendly ex-


    amples. Here’s a list of the form-related YUI Controls as of this writing:


    **AutoComplete**


    a text field that can pop up a list of suggested values in response


    to user input


    **Calendar**


    a rich interface for selecting a date


    **Slider**


    a graphical slider control, much like the one we built in this


    chapter


    By all means, take some time to play with these widget libraries, and pay special


    attention to how well (or how badly, as is more often the case) they handle issues


    like keyboard navigation, screen reader accessibility, and semantically meaningful


    HTML code. While it can be tempting to trust these widget libraries implicitly,
    I


    believe you’ll find there is definitely still a lot of value in the do-it-yourself
    option.


    Whatever you decide, it’s important to go in with your eyes open, and by under-


    standing—at least in principle—how to build custom form controls yourself, you’ll


    be better equipped to evaluate prepackaged options like these.


    **Summary**


    Back when JavaScript support was first added to web browsers, practically the
    only


    thing anyone could think to use it for was to enhance HTML forms. The tasks we’ve


    seen in this chapter—interlinking form fields, performing client-side validation
    of


    form submissions, and creating new types of form controls—are the things JavaScript


    does best, if only because it has been doing them for such a long time.


    Although these form enhancements may not be as shiny and new as some of the


    other examples in this book, the techniques we’ve used to implement them—pro-


    gressive enhancement, DOM manipulation, and unobtrusive scripting—certainly


    are. If the JavaScript pioneers that first set out to enhance HTML forms had had


    these techniques at their disposal, the JavaScript-enhanced forms that appear
    all


    over the Web today would work a lot better than they do.


    7 http://developer.yahoo.com/yui/#elements


    **275**


    **Form Enhancements**'
