    Exceptions**


    option is checked in the menu, as shown in Figure 7.5, then click **Show JavaScript**


    **Console** to bring up the error console shown in Figure 7.6.


    You’ll note that, of the four browsers we’ve discussed in this section, Safari
    provides


    the tersest and least helpful error messages. It generally gets the file name
    and line


