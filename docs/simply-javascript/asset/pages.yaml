  md: 'The main function in jQuery is also called `$`, but because it uses CSS selectors,
    this


    function is much more powerful than Prototype’s version, and manages to roll a


    number of Prototype’s functions into one.³


    If you wanted to use jQuery to get an element by ID, you’d type the following:


    `var money = $("#money");`


    `#` indicates an ID selector in CSS, so `$("#money")` is the equivalent of typing


    `document.getElementById("money")`.


    To get a group of elements by tag name, you’d pass `$` a CSS element type selector:


    `var paragraphs = $("p");`


    And to get a group of elements by class, you’d use a class selector:


    `var tables = $(".dataTable");`


    And, as with CSS, you can combine all these simple selector types in, say, a des-


    cendant selector:


    `var tables = $("#content table.dataTable");`


    `tables` is now an array of table elements that are descendants of the element
    with


    ID `content`, and that have a class of `dataTable`.


    The CSS rule parsing in jQuery is really quite spectacular, and it supports the
    ma-


    jority of selectors from CSS1, CSS2, and CSS3, as well as XPath.⁴ This makes it


    possible for us to use selectors like this:


    `var complex = $("form > fieldset:only-child input[@type=radio]");`


    3 In fact, based on the popularity of this feature in jQuery, Prototype went on
    to include similar function-


    ality in a function named `$$`.


    4 XPath is a zany language for selecting nodes from XML documents (including XHTML
    documents).


    While XPath is extremely powerful, the process of learning it is likely to give
    you a facial tick.


    **101**


    **Document Access**'
