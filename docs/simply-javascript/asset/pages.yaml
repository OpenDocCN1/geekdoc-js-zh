    **XMLHttpRequest is Non-recyclable**


    Even though an `XMLHttpRequest` object allows you to call the `open` method


    multiple times, each object can effectively only be used for one call, as the


    `readystatechange` event refuses to fire again once `readyState` changes to `4`


    (in Mozilla browsers). Therefore, you will have to create a new `XMLHttpRequest`


    object every time you want to retrieve new data from the server.


    **Dealing with Data**


    If you’ve made a successful request, the next logical step is to read the server’s
    re-


    sponse. Two properties of the `XMLHttpRequest` object can be used for this purpose:


    `**responseXML**`


    This property stores a DOM tree representing the retrieved data,


    but only if the server indicated a `content-type` of `text/xml` for


    the response. This DOM tree can be explored and modified using


    the standard JavaScript DOM access methods and properties we


    explored in Chapter 3, such as `getElementsByTagName`,


    `childNodes`, and `parentNode`.


    `**responseText**`


    This property stores the response data as a single string. If the


    `content-type` of the data supplied by the server was `text/plain`


    or `text/html`, this is the only property that will contain data. In


    the case of a `text/xml` response, this property will also contain


    the XML code as a text string, providing an alternative to


    `responseXML`.


    In simple cases, plain text works perfectly well as a means of transmitting and


    handling the response, so the `XMLHttpRequest` object doesn’t exactly live up
    to its


    name. When we’re dealing with more complex data structures, however, XML can


    provide a convenient way to express those structures:


    `<?xml version="1.0" ?>`


    `<user>`


    `<name>Doctor Who</name>`


