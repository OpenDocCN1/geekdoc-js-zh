  md: '■It describes the *content* of the page.


    ■It specifies the *presentation* of that content.


    ■It controls the *behavior* of that content.


    They also realized that keeping these three types of code separate, as depicted
    in


    Figure 1.1, made their jobs easier, and helped them to make web pages that work


    better under adverse conditions, such as when users have JavaScript disabled in


    their browsers.


    Computer geeks have known about this for years, and have even given this principle


    a geeky name: the **separation of concerns**.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_26_0.png)


    Figure 1.1\. Separation of concerns


    Now, realizing this is one thing, but actually *doing* it is another—especially
    if you’re


    not a computer geek. I *am* a computer geek, and I’m tempted to do the wrong thing


    all the time.


    I’ll be happily editing the HTML code that describes a web page’s content, when


    suddenly I’ll find myself thinking how nice that text would look if it were in
    a


    slightly different shade of gray, if it were nudged a little to the left, and
    if it had that


    hee-larious photocopy of my face I made at the last SitePoint office party in
    the


    background. Prone to distraction as I am, I want to make those changes right away.


    **3**


    **The Three Layers of the Web**'
