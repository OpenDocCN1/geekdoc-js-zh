  md: 'By now, glancing at that list should cause a few key ideas to spring to mind.
    On the


    programming structure side of the equation, you should be thinking about loops,


    and plenty of them. But on the DOM side you should be thinking about


    `getElementsByTagName`, `className`, and maybe even our own custom function,


    `Core.getElementsByClass`. If you found yourself muttering any of those names


    under your breath while you read through the steps in that list, give yourself
    a pat


    on the back.


    **Finding All Tables with Class** `**dataTable**`


    This first step’s pretty simple, since we did most of the related work mid-chapter.


    We don’t want to apply striping to every table in the document (just in case


    someone’s been naughty and used one for layout), so we’ll apply it only to the
    tables


    marked with a class of `dataTable`. To do this, all we have to do is dust off


    `Core.getElementsByClass`—it will be able to go and find all the `dataTable` elements:


    **stripy_tables.js** ***(excerpt)***


    `var tables = Core.getElementsByClass("dataTable");`


    Done. You can’t beat your own custom library!


