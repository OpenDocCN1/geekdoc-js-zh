    **Exploring Libraries**


    Quite a few of the main JavaScript libraries don’t tackle animation; instead,
    they


    focus on core tasks like DOM manipulation and styling. However, around these


    have sprung up a number of little libraries devoted to animation tasks, and they
    do


    the job quite well.


    The animation libraries are a lot more generalized than the scripts we’ve written


    here, so it’s possible to use them to apply a range of effects to almost any element,


    depending on how adventurous you’re feeling.


    **script.aculo.us**


    script.aculo.us is probably the most well-known effects library available. It’s
    actually


    an add-on to Prototype, which it uses for its DOM access and architecture capabil-


    ities, so if you want to run script.aculo.us, you’ll also need to include Prototype.


    script.aculo.us comes with a host of effects that have become popular in the so-


    called Web 2.0 age: fading, highlighting, shrinking, and many other transitions.
    It


    has also more recently included larger pieces of functionality such as drag-and-drop


    and slider widgets. Here, we’ll focus on the effects.


    All of the effects in script.aculo.us are available through the `Effect` object,
    which


    will be available in your programs if you include the **scriptaculous.js** file
    on your


    page.


    Let’s imagine that we have a paragraph of text that we want to highlight:


