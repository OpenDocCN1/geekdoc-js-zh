  md: 'It adds two numbers.


    If we’re getting those numbers when we *run* the program, we don’t know what


    they’ll be when we *write* the program, so we need some way of referring to them


    without using actual numbers. How about we give them names? Say …  “x” and “y.”


    Using those names, we could rewrite the program as:


    `x + y`


    Then, when we get our data values from some faraway place, we just need to make


    sure it’s called `x` and `y`. Once we’ve done that, we’ve got **variables**.


    Variables allow us to give a piece of data a name, then reference that data by
    its


    name further along in our program. This way, we can reuse a piece of data without


    having to remember what its actual value was; all we have to do is remember a


    variable name.


    In JavaScript, we create a variable by using the keyword `var` and specifying
    the


    name we want to use:


    `var chameleon;`


    This is called **declaring** a variable.


    Having been declared, `chameleon` is ready to have some data assigned to it. We
    can


    do this using the **assignment operator** (`=`), placing the variable name on
    the left and


    the data on the right:


    `var chameleon;`


    `**chameleon = "blue";**`


    This whole process can be shortened by declaring and assigning the variable in
    one


    go:


    `var chameleon = "blue";`


    **Simply JavaScript**


