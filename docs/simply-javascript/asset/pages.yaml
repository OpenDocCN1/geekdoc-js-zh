  md: '**Chapter****8**


    **Ajax**


    It’s probably not an understatement to say that Ajax has revitalized the Web.
    It’s


    certainly one of the reasons for a resurgent interest in JavaScript and it might
    even


    be the reason that you’re reading this book.


    Irrespective of the hyperbole surrounding Ajax, the technology has dramatically


    affected the way in which people can interact with a web page. The ability to
    update


    individual parts of a page with information from a remote server mightn’t sound


    like a revolutionary change, but it has facilitated a seamless type of interaction
    that


    has been missing from HTML documents since their inception.


    This ability to create a fluidly updating web page has captured the imaginations
    of


    developers and interaction designers alike; they’ve flocked to Ajax in droves,
    using


    it to create the next generation of web applications, as well as annoy the heck
    out


    of the average user. As with any new technology, there’s a temptation to overuse


    Ajax; but when it’s used sensibly, it can definitely create more helpful, more
    respons-


    ive, and more enjoyable interfaces for users to explore.'
