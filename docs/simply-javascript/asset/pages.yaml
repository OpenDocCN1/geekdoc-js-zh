    Once the requested city has been identified, we begin our Ajax connection.


    For this example we’re using a GET request, and the server-side script we’re


    trying to access is at `ajax_weather.php`. Since we’re using GET, the request


    variables have to be encoded directly into the URL. To do so, we append a


    question mark (`?`) to the script location, followed by the variables specified
    as


    `*name*``=``*value*` pairs. If you want to pass multiple variables (we don’t in
    this case),


    each pair must be separated by an ampersand (`&`).


    In this example, we’re passing the city as a request variable called `city`; its


    value is the city name we extracted from the link. The actual value is generated


    by the built-in `escapeURIComponent` function, which will encode values so


    that they don’t cause errors when being used as part of a URL. You should en-


    code any string values that you attach to a URL this way.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_344_1.png)


    Once the `requester` object has been initialized with `requester.open`, we set


    up our `readystatechange` event handler as an anonymous inline function.


    The code inside this handler is almost identical to the template that we outlined


    earlier in this chapter, except that we have filled in the actions that are to
    be


    taken for successful and unsuccessful requests. You should also note that once


    a response has been received from the server, a `clearTimeout` call is executed


    to cancel the `setTimeout` call we made earlier. This ensures that the user won’t


    receive an error message about the server timing out when it hasn’t actually


    done so.


