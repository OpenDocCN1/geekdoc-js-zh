    play something *new*, however—to dynamically add content to the page on the fly—is


    a very different trick.


    There are two ways to modify the HTML content of a page using JavaScript:


    ■via the DOM API


    ■through the nonstandard `innerHTML` property


    In this book, we’ll only use the first option. As we learned in Chapter 3, the
    DOM


    API is a W3C standard that is likely to be supported in all web browsers for the


    foreseeable future, and its document modification features are up to almost any


    task. The `innerHTML` property, by contrast, is not described in any standard,
    and


    indeed browsers like Firefox have on occasion struggled to implement it consistently


    in combination with new standards like XHTML. That said, there is an argument


    to be made for `innerHTML`, and if you’re curious you can read more about this
    altern-


    ative in The `innerHTML` Option, at the end of this section.


    In Chapter 3, we concentrated on how to access and modify existing elements in


    an HTML document, but the DOM also lets us create and add new content to the


