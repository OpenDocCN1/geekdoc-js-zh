  md: '**Chapter****9**


    **Looking Forward**


    When you first picked up this book, you were undoubtedly aware of JavaScript’s


    meteoric rise in (or return to) popularity over the past couple of years. Interest
    in


    JavaScript—and its usage on the Web—is now at its highest point ever, and it’s
    only


    going to keep rising.


    However, for all its popularity, JavaScript is still very immature—a truth that
    applies


    to many aspects of the Web. New things are being learned about JavaScript each


    day, and new ideas are springing up from every corner of the globe. JavaScript
    is a


    language that’s yet to reach its full potential.


    It wasn’t so long ago that developers could forget about being unobtrusive! *Everything*


    was obtrusive: we used inline event handlers in our HTML, content was being in-


    serted with `document.write`, and we had to provide a different version of our
    code


    for every browser. How quickly we’ve moved on, created new rules, and almost


    invented a new language. The JavaScript you’ve learned in this book looks very


    different from the JavaScript that was written only a few years ago.


    Some people might see this immaturity as a bad thing, but I embrace it. Why? Be-


    cause it’s exciting. JavaScript is on the edge. With JavaScript, you can do things'
  merge: -1
