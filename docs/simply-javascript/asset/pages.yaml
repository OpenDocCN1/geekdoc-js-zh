    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_347_2.png)


    If you have a sharp eye, you’ll have noticed the peculiar text that we specified


    for the contents of `paragraph`. What the heck does `"°C"` mean, anyway?


    In fact, that will be displayed as °C (as in “It’s a lovely 20°C outside”). The


    code `°` is a JavaScript character code for Unicode character number 00B0,


    which is the degree symbol (°).


    In an HTML document, you could just type the ° character verbatim, assuming


    you’re hip to the whole Unicode thing and your HTML is written in UTF-8, or


    you could use the HTML character entity `&deg;`. JavaScript strings, on the


    other hand, only support Latin-1 (ISO-8859-1) characters in older browsers,


    and they don’t support HTML character entities at all.


    So whenever you need to include in a JavaScript string a character that you


    can’t easily type on an English keyboard (which means it may not be within


    the Latin-1 character set), your best bet is to look up its Unicode character


    number (using a tool like Character Map, which is built into Windows, or Mac


    OS X’s Character Palette) and replace it with a `�``*XXXX*` code.


