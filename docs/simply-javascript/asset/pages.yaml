    Programming is all about speaking the language of computers. If you’re a robot,
    this


    should be pretty easy for you, but if you’re unlucky enough to be a human, it
    might


    take a bit of adjustment.


    If you want to learn how to program, there are really two things you have to get


    your head around. First, you have to think about reducing one big problem into


    small, digestible chunks that are just right for a computer to crunch. Second,
    you


    have to know how to translate those chunks into a language that the computer un-


    derstands.


    I find that the second part—the **syntax**—gradually becomes second nature (much


    like when you learn a *real* second language), and experienced programmers have


    very little trouble switching between different languages (like JavaScript, PHP,
    Ruby,


    or Algol 60). Most of the thought in programming is focused on the first


    part—thinking about how you can break down a problem so that the computer can


    solve it.


    By the time you’ve finished this book, you’ll understand most of the syntax that


    JavaScript has to offer, but you’ll continue learning new ways to solve programming'
