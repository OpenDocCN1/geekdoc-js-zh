    **The** `**this**` **Keyword**


    Earlier in this chapter, we grappled with the problem of how to write a single
    event


    handler that could be applied to many different elements. We learned that we could


    use `this` to reference the element to which the handler was assigned, and retrieve


    from it information that we could use to control how the handler would respond.


    It would be nice if we could do the same with our event listeners … so, can we?


    Keep in mind that the value of `this` within a JavaScript function is determined
    by


    the way in which a function is called. If it’s called as a method of an object,
    `this`


    refers to that object. If it’s called as a standalone function, `this` refers
    to the global


    object that contains all global variables and functions. The question is, how
    are


    event listeners called by the browser?


    Surprisingly, the W3C event model standard has nothing to say on the subject,
    so


    it’s left up to each browser to decide which object `this` refers to when it’s
    used


    within an event listener. Thankfully, every browser that supports the W3C event


    model calls an event listener as a method of the element to which it was assigned,


    so `this` refers to that element, just like it does in an event handler.


    Less surprisingly, Internet Explorer went a different way with its event listeners:


    Internet Explorer event listeners are called as standalone functions, so `this`
    points


    to the relatively useless global object.


    So far, we’ve been able to deal with every incompatibility between the two event


    listener models by using simple object detection to run the code required by each


