    **Whitespace May Produce Text Nodes**


    As well as visible characters, text nodes contain invisible characters such as
    new


    lines and tabs. If you indent your code to make it more readable (as we do in
    this


    book), each of the lines and tabs that you use to separate any tags or text will
    be


    included in a text node.


    This means you may end up with text nodes in between adjacent elements, or


    with extra white space at the beginning or end of a text node. Browsers handle


    these **whitespace nodes** differently, and this variability in DOM parsing is
    the


    reason why you have to be very careful when relying upon the number or order


    of nodes in the DOM.


    **Attribute Nodes**


    With tags and text covered by element and text nodes, the only pieces of information


    that remain to be accounted for in the DOM are attributes. At first glance, attributes


    would appear to be part of an element—and they are, in a way—but they still occupy


    their own type of nodes, handily called **attribute nodes**.


