    but we


    don’t perceive each picture individually—we see them as one continuous, moving


    image. Animation differs from live TV only in the way it is produced. The actual


    display techniques are identical—a series of rapidly displayed images that fools


    our brains into seeing continuous movement.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_187_0.png)


