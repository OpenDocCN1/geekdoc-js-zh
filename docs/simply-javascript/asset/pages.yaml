    `^-?\d+$`


    How about decimal numbers like `12.345`? Easy enough:


    `^-?\d+(\.\d+)?$`


    This pattern allows for an optional decimal point (`\.`) followed by one or more
    digits.


    Let’s get a little trickier and check for a valid phone number. Phone number formats


    vary from country to country, but in general they consist of an optional country


