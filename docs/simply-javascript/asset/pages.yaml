  md: '**Adding the Class** `**alt**` **to Every Second Row**


    “For every” is equivalent to “for each” here, so we know that we’re going to use
    yet


    another `for` loop. It will be a slightly different `for` loop though, because
    we only


    want to modify every second row.


    To do this, we’ll start the counter on the *second* index of the collection and
    increment


    it by two, not one:


    **stripy_tables.js** ***(excerpt)***


    `for (var i = 0; i < tables.length; i++)`


    `{`


    `var tbodys = tables[i].getElementsByTagName("tbody");`


    `for (var j = 0; j < tbodys.length; j++)`


    `{`


    `var rows = tbodys[j].getElementsByTagName("tr");`


    `**for (var k = 1; k < rows.length; k += 2)**`


    `**{**`


    `**Core.addClass(rows[k], "alt");**`


    `**}**`


    `}`


    `}`


    We’re already using the variables `i` and `j` as the counters for the outer `for`
    loops,


    and we don’t want to overwrite their values, so we create a new counter variable


    called `k`. `k` starts at 1 (the second index), and for every execution of this
    inner loop


    we increase its value by 2.


    The conditional code for this inner loop is just one line that uses our pre-rolled


    `Core.addClass` function to add the class `alt` to the current row. Once the inner
    `for`


    loop finishes, every second row will be marked with this class, and once the outer


    `for` loops finish, every data table will be stripy.


    **Putting it All Together**


    The main code for our function is now complete; we just have to wrap it inside
    a


    self-contained object:


    **Simply JavaScript**


    **96**'
