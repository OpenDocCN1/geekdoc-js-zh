    There are tools that can make it a little easier,¹ but because most JavaScript
    problems


    will affect *all* browsers, you’re usually better off doing your JavaScript development


    in a different browser, and using Internet Explorer’s JavaScript error reporting
    as a


    last resort for problems specific to that browser.


    To access Safari’s error console, you need to enable a hidden feature of that
    browser.


    Open a Terminal window and type:


    `**defaults write com.apple.Safari IncludeDebugMenu 1**`


    Press **Enter**, then quit the Terminal application. When you next launch Safari,
