  md: 'In practice, this is what most JavaScript programmers do—declare a variable


    whenever that variable is first assigned some data.


    If you’ve never referenced a particular variable name before, you can actually
    assign


    that variable without declaring it using `var`:


    `chameleon = "blue";`


    The JavaScript interpreter will detect that this variable hasn’t been declared
    before,


    and will automatically declare it when you try to assign a value to it. At first
    glance,


    this statement seems to do exactly the same thing as using the `var` keyword;
    however,


    the variable that it declares is actually quite different, as we’ll see later
    in this chapter


    when we discuss functions and scoping. For now, take it from me—it’s always safest


    to use `var`.


