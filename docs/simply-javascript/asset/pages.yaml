    The main problem with RIAs is that they’re extremely complex to develop—probably


    even more complex than their desktop equivalents. This complexity is the result


    of three factors, which have a lot to do with the nature of the Web itself:


    ■The interface is subject to display in a browser, which entails all the browser


    quirks and incompatibilities that are normally associated with web development.


