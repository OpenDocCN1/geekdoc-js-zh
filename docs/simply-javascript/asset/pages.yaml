    **Not All Events Bubble**


    All events go through the capture and target phases, but certain events skip the


    bubbling phase. Specifically, `focus` and `blur` events, which occur when keyboard


    focus is given to and removed from an element, respectively, do not bubble. In


    most cases, this isn’t a detail you need to lose much sleep over, but as we’ll
    see


    a big difference, since an event listener that’s assigned to the hyperlink itself
    will still be triggered in


    the bubbling phase.


