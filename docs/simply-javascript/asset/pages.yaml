- img_proc: true
  md: 'which parts are text, and so on. In order to save poor JavaScript programmers
    from


    having to do the exact same work, the browser stores its interpretation of the
    HTML


    code as a structure of JavaScript objects, called the **Document Object Model**,
    or


    **DOM**.


    Within this model, each element in the HTML document becomes an object, as do


    all the attributes and text. JavaScript can access each of these objects independently,


    using built-in functions that make it easy to find and change what we want on
    the


    fly.


    As a result of the way in which HTML is written—as a hierarchy of nested elements


    marked with start and end tags—the DOM creates a different object for each element,


    but links each element object to its enclosing (or parent) element. This creates
    an


    explicit parent-child relationship between elements, and lends the visualization
    of


    the DOM most readily to a tree structure.


    Take, for example, this HTML:


    `<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"`


    `"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">`


    `<html xmlns="http://www.w3.org/1999/xhtml" lang="en-US">`


    `<head>`


    `<title>DOMinating JavaScript</title>`


    `<meta http-equiv="Content-Type"`


    `content="text/html; charset=utf-8" />`


