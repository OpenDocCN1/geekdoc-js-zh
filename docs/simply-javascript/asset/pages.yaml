    Obviously, then, we also need to record the mouse pointer’s starting position.


    The `clientX` property of the `event` object for any event gives you the horizontal


    position of the pointer within the browser window when that event occurred.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_288_8.png)


    As we’ll see in a moment, we’ll also need a convenient way to access the thumb


