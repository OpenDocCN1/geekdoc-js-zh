  md: '■Internet Explorer calls event listeners as standalone functions, rather than
    as


    methods, requiring the developer to jump through hoops to get a reference to


    the target element, instead of just using `this`.


    ■When using event listeners in a certain way, Internet Explorer leaks memory


    unless you go to great lengths to clean up all of your event listeners.


    … and that’s without even getting into the differences when it comes to retrieving


    the details of keyboard and mouse events.⁸


    These problems have led some developers to throw in the towel and just use event


    handlers. In fact, some experts have gone so far as to write their own event listener


    systems using event handlers as a foundation.⁹ While there is certainly a case
    to be


    made for such an approach, I believe in embracing the support for event listeners


    that’s built into most browsers, and saving the complex code for the browser that


    really needs it—Internet Explorer.


    To that end, the **core.js** library that you’ll find in the code archive for
    this book in-


    cludes four methods that enable you to use event listeners without worrying about


    any of the issues I listed above. Here’s how they work:


    `**Core.addEventListener**`


    This method sets up an event listener function for a particular event type on
    a


    particular element. It works just like the standard `addEventListener` method,


    except that we pass the element as the first argument of the method. It doesn’t


    support the creation of capturing event listeners, and therefore doesn’t take
    a


    final Boolean argument:


    `Core.addEventListener(``*element*``, "``*event*``",` `*eventListener*``);`


    In Internet Explorer, this method sets up the event listener so that the event


    object is passed to the listener function as an argument (just as it is in the


    standard event model), and so that the listener is called as a method of the ele-


    ment to which it is assigned (so that we can use `this` to refer to that element).


    8 For complete coverage of these headaches, and some of the solutions that are
