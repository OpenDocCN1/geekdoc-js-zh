  md: 'This method takes as an argument a reference to the accordion element you want


    to collapse completely, so logically the very first thing we want to do is get
    a list of


    the children of that element—the `li` elements of the list that represent the
    folds of


    the accordion.


    This code uses a new trick in the DOM access department: the `if` statement that


    checks the `nodeType` property of each of those list items. We need to do this
    because


    there’s no guarantee that all the child nodes of the list will be element nodes
    (that


    is, list items). Depending on the browser in which our accordion is being used,^(13)


    the whitespace between the list items in our code may be represented as text nodes,


    which will be listed as children of the `ul` element as well. The `nodeType` property


    of a node tells you whether you’re dealing with an element node, a text node,
    or an


    attribute node. Since we’re only interested in elements (the list items in the
    list),


    we check for a `nodeType` value of `1`.


    Other than this new trick, the method is fairly straightforward. It gets a list
    of all


    the folds in the accordion, then calls `Accordion.collapse` to collapse each one.


    We now have what we need to write our `expand` method:


