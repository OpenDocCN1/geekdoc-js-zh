    **Form Validation**


    Usability tweaks like those we’ve seen so far in this chapter are all well and
    good,


    but by far the most common use of JavaScript when dealing with forms is client-


    side validation.


    Now let me make one thing clear: every web site that accepts user input of any
    kind


    needs a program on the receiving end—the server side—to make sure that input is


    provided in the expected format, and is safe to use. That’s **server-side validation**,


    and it’s an absolute must, no matter what you do with JavaScript in the browser.


    **Client-side validation**, on the other hand, is merely an early warning system.
    It does


    the same job as server-side validation—and does it much faster—but you can’t rely


    on it to work every time.


    **239**


    **Form Enhancements**'
