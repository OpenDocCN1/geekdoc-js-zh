  md: 'toggle. However, we need to test whether checkboxes and radio buttons are


    `checked` or not before we add them to the list of submitted elements. We don’t


    want to submit a value for a checkbox that wasn’t checked, or for the wrong


    radio button in a group.


    Inside the `for` loop that iterates over the `inputs` node list, we use a combination


    of each `input`’s `type` and its `checked` property to determine whether it should


    be added to `formElements`. The `if` statement uses a number of OR conditions


    to perform this check, and the logic reads like this:


    1.


    IF the `type` of the `input` is `null` (it will be a text `input` by default)


    2.


    OR the `type` of the input is `text`


    3.


    OR the `type` of the input is `hidden`


    4.


    OR the `input`’s `checked` property exists AND it is `true`


    5.


    THEN add the `input` to `formElements`


    The fourth point above catches both checkboxes *and* radio buttons. Any


    checkbox that’s checked should have its value submitted, and only one radio


    button in a radio button group will ever have `checked` set to `true`, so it’s
    safe


    to submit that one as well.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_358_0.png)


    Once all the valid elements have been added to `formElements`, we have to


    write out their name/value pairs in a serialized fashion. This process is


    identical for all form element types, which is why we can minimize code repe-


    tition by building the `formElements` array in advance.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_358_1.png)


    As we add each form element to the serialized string, we have to check


    whether a `name` is assigned to it.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_358_2.png)


    If it *does* have a name, we’ll want to send its value to the server, so we take
    the


    `name`, followed by `"="`, followed by the `value`, and add the whole thing to
    the


    end of `parameters`. Each of the name/value pairs in `parameters` is separated


    by an ampersand (`"&"`).


    **335**


