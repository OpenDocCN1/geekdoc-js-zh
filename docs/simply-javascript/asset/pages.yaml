  md: 'Because the browser gives up on trying to make sense of your script when it
    runs


    into a syntax error, you’ll only ever be notified about the first syntax error
    in a given


    script. As you can see, the error message in this case is “missing ( before formal


    parameters,” and the browser ran into this error when it hit the opening brace
    (`{`)


    on line four of **syntax.js**.


    Looking back at the script, it may not be immediately obvious to you what the


    problem is. The brace is certainly in the right place, and is required to mark
    the


    start of the `init` method’s body, so why is the browser complaining about it?
    And


    what are “formal parameters” anyway?


    The real problem here occurs on the previous line: the parentheses that must follow


    the `function` keyword were left out! These parentheses enclose the list of arguments


    for the function (also known as **formal parameters**), and are required. Here’s
    what


    the corrected code looks like:


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_308_0.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_308_0.png)
    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_308_0.png)


    `3 init: function``**()**`


    `4 {`


    `5 MyScript.doSomething();`


    It turns out that most syntax errors occur when the browser was expecting one
    thing,


    but ran into something else instead. In this case, it was expecting an opening
    paren-


    thesis (`(`), and encountered an opening brace (`{`) instead. That’s why the error
    mes-


    sage points to the innocent-looking brace.


    Usually, the error message will tell you what the browser expected to find instead


    (in this case, it complains about the “missing `(`”), but if the message doesn’t
    make


    sense to you, a good tactic is to look at what immediately precedes the place
    in your


    code where the error occurred, and try to identify what you might’ve left out.


    If you fix this error and reload the page, you’ll have an excellent opportunity
    to try


    out this technique when you see the error message shown in Figure 7.8.


    Can you find the problem? Again, the browser is complaining about a missing


    character—in this case a closing brace (`}`)—but if you look at the line before
    the error,


    there’s a closing brace there already!


    **285**


