  md: '`XMLHttpRequest` is really the only aspect of Ajax that’s truly new. Every
    other part


    of an Ajax interaction—the event listener that triggers it, the DOM manipulation


    that updates the page, and so on—has been covered in previous chapters of this


    book already. So, once you know how to make an asynchronous request, you’re


    ready to go.


    **Creating an** `**XMLHttpRequest**` **Object**


    Internet Explorer 5 and 6 were the first browsers to implement `XMLHttpRequest`,


    and they did so using an ActiveX object:¹


    `var requester = new ActiveXObject("Microsoft.XMLHTTP");`


    Every other browser that supports `XMLHttpRequest` (including Internet Explorer
    7)


    does so without using ActiveX. A request object for these browsers looks like
    this:


    `var requester = new XMLHttpRequest();`


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_330_0.png) ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_330_1.png)


    **ActiveX is Unreliable**


    The way that `XMLHttpRequest` is implemented in Internet Explorer 6 and earlier


    means that if a user has disabled *trusted* ActiveX controls, `XMLHttpRequest`
    will


    be unavailable to you even if JavaScript is enabled. Many people disable *untrusted*


    ActiveX controls, but disabling trusted ActiveX controls is less common.


    We can easily reconcile the differences between the two methods of object creation


    using a `try-catch` statement, which will automatically detect the correct way
    to


    create an `XMLHttpRequest` object:


    **try-catch_test.js** ***(excerpt)***


    `try`


    `{`


    `var requester = new XMLHttpRequest();`


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_330_2.png)


    `}`


    1 An ActiveX object is Microsoft’s term for a reusable software component that
    provides encapsulated,


    reusable functionality. In Internet Explorer, such objects normally give client-side
    scripting access to


    operating system facilities like the file system, or in the case of `XMLHttpRequest`,
    the network layer.


    **307**


