  md: 'Best of all, however, semantic markup lets you apply new styles (presentation)
    and


    interactive features (behavior) without having to make many (or, in some cases,


    any!) changes to your HTML code.


    **CSS for Presentation**


    Obviously, if the content of a page should be entirely contained within its HTML


    code, its style—or presentation—should be fully described in the CSS code that’s


    applied to the page.


    With all the work you’ve done to keep your HTML free of presentational code and


    rich with semantics, it would be a shame to mess up that file by filling it with


    snippets of CSS.


    As you probably know, CSS styles can be applied to your pages in three ways:


    **inline styles**


    `<a href="evil.html"` `**style="color: red;"**``>`


    Inline styles are tempting for the reasons I explained earlier: you can apply


    styles to your content as you create it, without having to switch gears and edit


    a separate style sheet. But as we saw in the previous section, you’ll want to


    avoid inline styles like the plague if you want to keep your HTML code mean-


    ingful to those who cannot see the styles.


    **embedded styles**


    `<style type="text/css">`


    `**.warning {**`


    `**color: red;**`


    `**}**`


    `</style>`


    ⋮


    `<a href="evil.html"` `**class="warning"**``>`


    Embedded styles keep your markup clean, but tie your styles to a single docu-


    ment. In most cases, you’ll want to share your styles across multiple pages on


    your site, so it’s best to steer clear of this approach as well.


    **Simply JavaScript**


