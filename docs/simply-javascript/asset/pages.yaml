    script.aculo.us also has a nice little event model that allows you to trigger
    functions


    while effects are happening, or after they have finished. These events are again


    specified as parameters in the object literal, and take a function name as a value.


    That function will be called when the event is fired:


    `function effectFinished()`


    `{`


    `alert("The introduction has been effected");`


    `}`


    `new Effect.Highlight("introduction",`


    `{afterFinish: effectFinished});`


    That code pops up an alert dialog once the fade has finished, to tell us it’s
    done.


    script.aculo.us is certainly a powerful and flexible effects library. Its popularity
    has


    largely been fueled by its ease of integration and execution. In case these benefits


    weren’t already apparent, I’ll leave you with this nugget: using script.aculo.us,
