  md: '■The behaviors required to perform much of the interaction don’t natively exist


    on the Web or in a browser; they have to be created from the ground up using


    JavaScript. So if you want drag-and-drop capabilities, you’ll have to include
    a


    script that creates this functionality.


    ■The Web was designed to be stateless, yet this clashes with the way a lot of
    ap-


    plications are designed to work. Applications often rely upon a certain sequence


    of events occurring in a given order, but this order can’t be guaranteed on the


    Web—a place where users can jump in or out at any point they choose, and can


    modify data without the server knowing.


    One fundamental issue underlies all of these problems: the Web wasn’t designed


    to support applications.


    This fact is highlighted by the way that current accessibility technology handles


    RIAs: badly. Since assistive technology has been designed to work with a page-based


    model, the new micro-updates that lie at the heart of an RIA throw tools like
    screen


    readers into confusion—they don’t know when the page has been updated, and


    even if they did, they wouldn’t know how best to alert a user to those updates.


    The blame can’t be laid solely on the screen reader manufacturers, though. The


    structure that they’re trying to translate has some inherent accessibility flaws
    when


    it comes to describing applications—flaws that can’t just be patched. The thing
    is,


    browsers that render HTML have become so ubiquitous that it makes sense to create


    applications that take advantage of them. We just have to hack our way around
    all


    the challenges somehow. At least, that’s one point of view. The other is to remodel


    or even recreate HTML with more application-oriented functionality.


    `canvas` is one of the first steps in this direction. Introduced by the Web Hypertext


    Application Technology Working Group (WhatWG)—a community organized towards


    the development of a more coherent web application standard—`canvas` is just a


    small part of a greater plan that aims to create a developer-friendly, user-advantage-


    ous system of application delivery. However, its full potential is yet to be realized,


    and even after all the standards have been locked in, the standard’s roll-out
    to a


    majority of browsers will take time.


    For the moment, it looks like we’re stuck using the sometimes clunky, always


    complex combination of HTML, CSS, and JavaScript for web application develop-


    **Simply JavaScript**


