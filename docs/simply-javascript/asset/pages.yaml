    However, this explanation highlights a flaw in the way that this widget uses pro-


    gressive enhancement.


    When using a `select` box, users without JavaScript would expect to click on the


    box, and receive a number of `option`s from which they can choose. The only way


    that this can be done is if all the `option`s are included in the HTML. One of
    the


    aims of the `ComboBox` is to *reduce* the amount of data transferred between client
    and


    server by only retrieving the data that matches what the user is typing. However,


    leaving the `select` box empty initially renders it useless to users who don’t
    have


    JavaScript enabled. This is not progressive enhancement. Then again, if we included


    all the `option`s for the `select` box in the HTML, we’d be removing one of the
    main


