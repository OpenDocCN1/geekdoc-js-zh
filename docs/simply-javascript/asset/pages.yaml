    entirely new controls of your own!


    Creating fully realized user interface elements using only the capabilities of
    HTML,


    CSS, and JavaScript is a tall order. The built-in form controls have a lot of
    subtle


    features that are difficult, if not impossible to achieve using JavaScript. Consider


    the right-click menu—not to mention all the keyboard shortcuts—that even a basic


    text field supports!


    However, by setting realistic goals, and by taking advantage of the existing form


    controls where appropriate, you can produce some truly useful user interface ele-


    ments. Let’s look at one, shall we?


