  md: 'But whether your new creation has the graceful stride of a runway model, or
    the


    shuffling gait of Dr. Frankenstein’s monster, depends as much on the quality of
    its


    HTML and CSS origins as it does on the JavaScript code that brought it to life.


    Before we learn to work miracles, therefore, let’s take a little time to review
    how to


    build web sites that look good both inside *and* out, and see how JavaScript fits
    into


    the picture.


    **Keep** **’****em Separated**


    Not so long ago, professional web designers would gleefully pile HTML, CSS, and


    JavaScript code into a single file, name it **index.html**,² and call it a web
    page. You


    can still do this today, but be prepared for your peers to call it something rather
    less


    polite.


    ![](img/59e689d797f11aa539b5ad8ad6b1fc1d_25_0.png)


    Somewhere along the way, web designers realized that the code they write when


    putting together a web page does three fundamental things:


