  md: '**Getting the Table Rows for Each Table**


    There’s that phrase “for each” again. Inside the variable `tables` we have the
    collec-


    tion of tables waiting to be striped—we just need to iterate through each of them


    using a `for` loop.


    Every time we move through the `for` loop, we’ll want to get the rows for that
    partic-


    ular table. This sounds okay, but it’s not that simple. Let’s look at the markup
    for a


