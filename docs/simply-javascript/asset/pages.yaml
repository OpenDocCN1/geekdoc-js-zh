    **The** `**innerHTML**` **Option**


    Although it’s not a part of any W3C standard, every major browser supports an


    `innerHTML` on every DOM element node. The value of this property is the HTML


    code of the content that it currently contains, and by changing that value, you
    can


    change the content of that element.


    The biggest advantage offered by `innerHTML` is performance. If you’re creating


    or modifying complex document structures, it can be a lot quicker for the browser


    to make document modifications in bulk using `innerHTML` than by stepping


    through a series of separate DOM modifications. In some cases, very complex


    JavaScript applications *must* use `innerHTML` to achieve reasonable performance.


    Additionally, many developers quickly tire of writing the verbose JavaScript code


    that DOM manipulation requires, and the “one stop shop” that `innerHTML` offers


    is a tempting alternative. As a result, most of the major JavaScript libraries
    contain


    utilities for making DOM manipulation more convenient, and a number of mini-


