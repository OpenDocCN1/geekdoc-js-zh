- fmt: '

    ## Text Editors

    Any of these text editors will work nicely. I don’t recommend simple text editors
    since all you can do with those things is type up words. The editors mentioned
    above double up as source code editors'' features, which means they autocorrect
    (and autocomplete) your programming code syntax. I’ll be displaying code using
    `Notepad++` in this book, which is a text and source code editor that is free
    and easy to download. You can download `Notepad++` by [clicking here](https://notepad-plus-plus.org/downloads/).
    Downloading and installing it on your computer takes less than a minute. Remember
    that JavaScript is a scripting language, which means it can’t run programs on
    its own. In this setup, you type the program code in the text editor and it is
    your browser’s job to interpret and run the code. JavaScript is also a very portable
    language since it runs in any operating system including Windows, iOS, Android,
    Mac, and Linux among others.


    ### Tags

    Now, here’s a new concept that some readers will learn for the first time. Parts
    of your code will be enclosed in an opening and closing tag. Here’s an example:
    `<script>` and `</script>`. The first one is `<script>` which shows you where
    the code begins or where the tag begins and the second one, which is `</script>`,
    shows you where the tag ends. You use those two tags to tell the browser that
    whatever is in between those two tags is a form of a script—in the case of our
    little activity here we’re using JavaScript.


    Yes, there are other scripting languages as well such as Ruby, Python, Perl, and
    PHP among others. If you have played around with bb-codes used in forums, it’s
    pretty much the same concept. For instance, you use the `[b]` and `[/b]` tag so
    that the text inside the script is displayed in bold typeface. So, for example,
    when you write the following in an online forum post:“Hi! My name is [b]Jeff [/b].”
    It will be displayed in the forums as “Hi! My name is Jeff .” As you can see,
    the word Jeff is in bold characters.


    Now, I hope that you have downloaded `Notepad++` or some other source code editor.
    If you haven’t, then it’s time to download one now and install it on your computer.
    After installing one (remember I’m using `Notepad++` coz it’s free), type the
    following in that code editor:

    ![](Image00004.jpg)


    Here are a few things that you should notice about the sample code above. First
    off, the first line says `<html>` which means that this is an HTML program; HTML
    stands for HyperText Markup Language, which is the main language used for building
    web pages. As it was mentioned earlier, you will learn a few things about that
    programming language.


    ### Start Tags and End Tags

    If you go over our example earlier, you will see that the entire code begins with
    `<html>` and is paired at the bottom by another tag which is `</html>`. The former
    is called the start tag and the latter is called the end tag. The same is true
    with JavaScript. Your JavaScript code also has a start tag and an end tag. Other
    start and end tag pairs in our example above are `<title>` and `</title>`, `<head>`
    and `</head>`, `<script>` and `</script>`, and `<body>` and `</body>`. Note that
    the majority of the tags in our first example are HTML. The JavaScript actually
    begins with `<script type="text/javascript">` and ends with `</script>`. Now,
    take note that this script format works for HTML, not HTML5, which is different.


    Here’s another example, and I want you to identify the different start and end
    tags:

    ![](Image00005.jpg)


    After identifying the different tags, here are a few things that you need to note:


    *   The code begins with the `<html>` tag and ends with the `</html>` tag.

    *   The `<head>` and `</head>` tags indicate the metadata. This is called the
    `<head>` element and it is not displayed on your browser or device screen. This
    serves as the title of your HTML document—or title of your program as it were.

    *   The `<h1>` and `</h1>` tags are the headers. Think of these as paragraph titles
    or headings of chapters in a book.

    *   The `<p>` and `</p>` tags indicate the paragraph elements. They tell the browser
    where a paragraph begins and ends.

    *   The `<i>` and `</i>` tags display text in italics and the `<u>` and `</u>`
    tags display text in underlined texts.

    *   The `<body>` and `</body>` tags identify the body element or the body of the
    document—earlier we have a head element and now we have a body element. Observe
    that the body element should always be in between the `<html>` and `<body>` tags.


    We will learn more about the interplay of HTML and JavaScript as we go along with
    the chapters of this book. If you run the code in our second example, it would
    display something like this on your browser.

    ![](Image00006.jpg)


    ### More Than Just Displaying Text

    JavaScript does more than just display text on your screen. It is that part of
    your website that makes it more interactive. Create a new file on `Notepad++`
    and type the following:

    ![](Image00007.jpg)


    ### Working with Just the Basics

    If you don’t want to bother with all the HTML code mentioned earlier and just
    want to learn the fundamentals of JavaScript just remember that all you need is
    this basic skeleton tag format:

    ![](Image00008.jpg)


    Those are the only four tags that you need and all you have to do is to insert
    your JavaScript code (or scripts for short) in between the script tags (i.e. where
    the ellipses are). But if you want to add some text elements you are free to use
    content within `<p>` and `<h1>`, and `<h2>` tags. Your scripts will still work
    even if you have those text elements.


    ### Saving Your Work as HTML

    The next thing you need to do is to click `File > Save As` and then in the window
    that comes up click `Desktop` in the panel on the left so you save your work on
    the desktop. You can choose a different folder if you like. After that, click
    on `Save as Type` and select `HyperText Markup Language File` from the drop-down,
    and under file name write `Welcome to JavaScript`. You will see a new file on
    your desktop (or your selected folder) called “Welcome to JavaScript” and it will
    have the icon of your default browser—mine is Google Chrome so I see a new Chrome
    file on my desktop. Double click on that file and your default browser will open
    it. On your browser you will see the following displayed:

    ![](Image00009.jpg)


    Notice that there is a button there as well. The welcome message is in bold typeface
    and is in the style of a header, which is because of the `<h2>` tags. Now, click
    on the button. You will see that the current date and time in your place will
    be displayed on the screen. As you can see, JavaScript makes the page more interactive
    rather than just display text on the screen.

