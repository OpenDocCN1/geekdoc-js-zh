    \    - [Dynamically Typed](#)\n    - [Numbers](#)\n    - [BigInt](#)\n    - [Strings](#)\n\
    \    - [Boolean Data Type](#)\n    - [Null](#)\n    - [Undefined](#)\n    - [Object\
    \ Data Type](#)\n    - [Symbols](#)\n    - [Pop Quiz](#)\n- [Chapter 8: Interacting\
