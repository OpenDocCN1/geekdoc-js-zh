    \nThere are also special numbers that can also be used in JavaScript such as `infinity`\
    \ or `∞`, and `NaN`. Add this line to the previous exercise code earlier and see\
    \ the output:\n\n```\nalert ( 1 / 0 );\n```\n\n`NaN` on the other hand is the\
