    you will notice that the coded message part of the language is pretty easy to
    figure out .Now, let’s go in a bit deeper.When you say high-level language, we’re
    looking at a programming language where you don’t need to bother with the other
    technical details going on behind the scenes. For example, when you tell the computer
    to display the letter “A” on the browser or the screen, you don’t see exactly
    how the program is telling the computer or mobile device (like your phone for
    instance) just how to do that.Here are a few things that you don’t get to see
    happening. First off, one of the things that go on in the background is that your
    program (any program, it doesn’t have to be JavaScript) is telling the computer
    to use a certain part of its random access memory.It will also tell the computer
    to activate certain pixels on the screen. It also tells the computer which part
    of the screen will be used to display the letter A. Your program also tells the
    computer what color to use. It also tells the computer which pixels should be
    used to create that specific display.All of that is already handled in the background.
    All you ever did is type one command or line of code that says “display the letter
    A” on the screen.A high-level computer language allows you to focus on the code.
    It does the rest of the dirty work for you .An Interpreted Dynamic LanguageRemember
    that JavaScript resembles English more than Matrix-like code (i.e. machine code)
    – yes, continuing the pun right there. The thing about that is the fact that machines
    don’t understand English. They don’t talk that way—they use binary code, a series
    of ones, and zeroes (or on and off switches).No, you don’t need to learn binary
    code to program in JavaScript. But just remember this important tidbit—you need
    to translate your computer program from a high-level language to a low-level language
    or machine code.There is usually a go-between or a translator if you will between
    high-level programming languages and machine-readable language. This “translation”
    in programming is called compilation.The code that you wrote in any programming
    language needs to be compiled (i.e. translated) so that the computer (or phone
    or any device) can follow the instructions that you have written.In certain programming
    languages, you need to go through this step first before your computer can execute
    the instructions. These languages are called static languages. There should be
    a compile-time first before the execution.That is not the case with JavaScript
    .It’s called an “interpreted language” because there is no need for a translation
    process in between.The code you write in this programming language is “translated”
    on the fly, as it were, or as the code is read. It’s that fast. There is no need
    to pause anything first so the code can be compiled. That is why it is called
    a dynamic language.Now, this offers a few advantages, such as:


    *   Closures


    *   Object runtime alternation


    *   Functional programming


    *   Reflection


    *   Late binding


    *   Dynamic typing'
