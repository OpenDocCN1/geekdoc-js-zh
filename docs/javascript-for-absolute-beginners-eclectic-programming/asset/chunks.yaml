    尝试以下代码并在浏览器中查看输出：![](img/Image00022.jpg)


    JavaScript 中还存在一些可以使用的特殊数字，例如 `infinity` 或 `∞`，以及 `NaN`。将此行添加到之前的练习代码中，并查看输出：


    ```

    alert ( 1 / 0 );

    ```


    另一方面，`NaN` 是当你进行计算错误时产生的输出。要尝试一下这个，请将此行添加到之前的练习代码中：


    ```

    alert ( "not a number" / 2 ) ;

    ```


    注意，此语句将返回“NaN”。如果你在它之后添加更多计算，它仍然会返回 `NaN`。请注意，JavaScript 中的数字包括正数和负数。


    ### BigInt

    请注意，JavaScript 中使用的数字范围存在技术性限制。`number` 数据类型的范围从 `-(2⁵³ - 1)` 到 `(2⁵³ - 1)`。正数不能大于
    `9,007,199,254,740,991`（负数也是同样的数字）。


    如果你需要一个比这更大的数字，那么你就需要将数字转换为 `BigInt` 数据类型。要做到这一点，只需在你打算使用的巨大数字末尾添加一个“n”，就像这一个：`9,007,199,254,740,990,321,456n`。


    ### 字符串

    JavaScript 中的字符串指的是字符，它们通常被放在单引号或双引号之间，例如“Hello”或 ''This is an example of a string.''。


    请注意，如果你将数字放在引号内，那么像“12345”这样的数字将被视为字符串或字符集，而不是数字。


    如果你想在输出到屏幕时将变量嵌入字符串中，你需要使用反引号 `` ` ` 并在这种类型的括号 `${…}` 中包含表达式。尝试这段示例代码来查看反引号是如何工作的：![](img/Image00023.jpg)


    请注意，你只能使用反引号嵌入数字或数学表达式。如果你更改上一个示例中的反引号并使用单引号或双引号，你将无法嵌入表达式或数学公式，它们将被视为文本。


    ### 布尔数据类型

    除了数字和字符串，另一个实用的数据类型是 `Boolean`。你可以使用此数据类型来测试某些表达式的逻辑。它有助于决策语句。布尔数据可以是 `true`（真）或
    `false`（假）。


    将以下代码嵌入 HTML 文件并在浏览器中打开它：


    ```

    let isGreater = 5 > 1 ;

    alert ( isGreater );

    ```


    注意，此脚本的输出是“true”。变量 `isGreater` 被赋值为 `true` 是因为 `5` 大于 `1`。我们使用像 `>`（大于）、`<`（小于）、`!=`（不等于）和等于（==`）这样的比较运算符来进行这些逻辑测试。


    另一个逻辑运算符是 `||`，它的意思是“或”。如果所比较的两个项目中任一个为真，或运算符将始终返回 `true`。只有当比较的两个项目均为假时，它才会返回
    `false`。


    另一个你应该熟悉的运算符是 `&&`（与）运算符。记住，在用 1 和 0 交流的计算机的世界里，数字 `1` 是真，0 是假。从技术上讲，任何正数都是真，零是假。


    所以这意味着一个值为 `1` 的变量在逻辑测试时将返回 `true`。如果它的值为 0，那么它返回 `false`。


    回到 `&&` 运算符，这里有一个示例表达式：


    ```

    alert ( 1 && 0 ); // 0

    ```


    `&&` 运算符先求值左侧的操作，然后是右侧的。在这个例子中，`&&` 运算符将返回零或假。为什么？因为它会寻找第一个假值，这就是为什么上面的 alert
    语句将显示假或零。


    查看下一个示例：


    ```

    alert ( 1 && 5 ); // 5

    ```


    注意，`&&` 运算符返回 `5` 或真。它所做的是左到右评估所有的操作数（即先是 `1` 然后是 `5`）。在这种情况下，没有零，所以没有假值。如果是这样，那么它将返回最后一个真值（即
    `5`）。


    ### Null

    `null` 值为变量分配一个空值或未知值。这是初始化变量的一种极佳方法，可以确保它们不包含来自内存的垃圾数据。你可以这样给变量分配一个 `null` 值：


    ```

    let score = null ;

    ```


    ### 未定义 (Undefined)

    如果你忘记给变量赋值并尝试在数学表达式、逻辑比较中使用它，或者只是将其显示在屏幕上，浏览器会自动返回“undefined”，这意味着该变量没有分配值。


