    \ As you can see, this is already a bit of code and can be confusing at times.\
    \ JavaScript has the conditional operator `?` that you can use to simplify such\
    \ long-else statements. Try the following sample code:![](Image0032.jpg) Take\
    \ note that this example with the question mark operator gives you the same result\
