    \ the previous exercise code:\n\n```\nalert ( \"not a number\" / 2 ) ;\n```\n\n\
    Notice that this statement will return “NaN”. If you try to add more computations\
    \ after it, it will still return `NaN`. Note that the numbers in JavaScript cover\
    \ both positive and negative numbers.\n\n### BigInt\nNote that there is a technical\
    \ limitation to the range of numbers that can be used in JavaScript. The `number`\
    \ data type ranges from `-(2^53 - 1)` to `(2^53 - 1)`. The positive numbers can’t\
    \ be larger than `9,007,199,254,740,991` (same figures in the negative).\n\nIf\
    \ you need a number that is more than that, then you need to convert your number\
    \ to a `BigInt` data type. To do that, just add an “n” at the end of the huge\
    \ number you intend to use, like this one: `9,007,199,254,740,990,321,456n`.\n\
    \n### Strings\nStrings in JavaScript refer to the characters and they are often\
    \ placed in between single or double quotes, like “Hello” or 'This is an example\
    \ of a string.'\n\nNote that if you place numbers inside quotes, then numbers\
    \ like “12345” will be treated as a string or set of characters instead of numbers.\n\
    \nIf you want to embed a variable into a string when you output it to the screen,\
    \ you need to use backticks ` ` and ` and enclose the expression inside this type\
    \ of bracket `${…}`. Try this sample code to see how backticks work:![](Image00023.jpg)\n\
    \nNote that you can only embed numbers or mathematical expressions using backticks.\
    \ If you change the backticks in the previous sample and use single or double\
    \ quotes, you can’t embed either the expression or the mathematical formula and\
    \ they will be treated as text.\n\n### Boolean Data Type\nOther than numbers and\
    \ strings, another useful data type is `Boolean`. You can use this data type for\
    \ testing the logic of certain expressions. It helps in decision-making statements.\
    \ Boolean data can either be `true` or `false`.\n\nEmbed the following code in\
    \ an HTML file and open it in a browser:\n\n```\nlet isGreater = 5 > 1 ;\nalert\
    \ ( isGreater );\n```\n\nNotice that the output of this script is “true”. The\
    \ variable `isGreater` is assigned a value of `true` because `5` is greater than\
    \ `1`. We use comparison operators like `>` (greater than), `<` (less than), `!=`\
    \ (not equal to) and equal to (`==`) to make these logical tests.\n\nAnother logical\
    \ operator is `||` which means “or”. The or-operator will always return `true`\
    \ if either of the two items being compared is true. It will only return `false`\
    \ if both items being compared are false.\n\nAnother operator that you should\
    \ become familiar with is the `&&` (And) operator. Remember that in the world\
    \ of computers which speak in ones and zeroes, the number `1` is true and zero\
    \ is false. Well, technically, any positive number is true and zero is false.\n\
    \nSo, that means a variable that has a value of `1`, when tested logically will\
    \ return `true`. If it has a value of zero, then it returns `false`.\n\nGoing\
    \ back to the `&&` operator, here is a sample expression:\n\n```\nalert ( 1 &&\
    \ 0 ); // 0\n```\n\nThe `&&` operator evaluates the operand at the left and then\
    \ the one at the right. In this example, the `&&` operator will return a zero\
    \ or false. Why? This is because it will look for the first false value, which\
    \ is why the alert statement above will display false or zero.\n\nCheck out this\
    \ next example:\n\n```\nalert ( 1 && 5 ); // 5\n```\n\nNotice that the `&&` operator\
    \ returns a `5` or true. What it does is that it evaluates all the operands from\
    \ left to right (i.e. `1` and then `5`). In this case, there is no zero so there\
    \ no false value. If that is the case then it will return the last true value\
    \ (i.e. `5`).\n\n### Null\nThe `null` value assigns an empty value to a variable\
    \ or value unknown. This is a great way to initialize variables to make sure they\
    \ don’t contain garbage data from memory. You can assign a `null` value to a variable\
    \ like this:\n\n```\nlet score = null ;\n```\n\n### Undefined d\nIf you forget\
    \ to assign a value to a variable and try to use it in math expressions, logical\
    \ comparisons, or just display it to the screen, your browser will automatically\
    \ return “undefined”, which means that there is no value assigned to that variable.\n\
    \nTry the following code and see what output you get:![](Image00024.jpg)\n\n###\
    \ Object Data Type\nWe will only introduce the object data type here. All of the\
    \ data types that you have seen so far only contain one value. These data types\
    \ are called primitive data types.\n\nA more advanced data type that is used in\
    \ JavaScript and other programming languages is an `object`, and this type of\
    \ data can contain more than one value. Think of this way, you can create a variable\
    \ that can represent different customer records. The record can contain several\
