    \n# Chapter 9: Conditional Statements\nSometimes your program code needs to perform\
    \ different actions depending on certain conditions. For example, your system\
    \ may have to decide which content a user should be given access to depending\
    \ on restrictions. If it’s a premium user then they should be given access to\
    \ most of the site. If it’s just a site visitor then they can only be given access\
    \ a few of the pages and given a link to the signup page. If it is a site administrator\
    \ then they should be given access to all the content including the backend settings\
    \ of the website.\n\n### If Statement\nTo facilitate this decision making and\
    \ action branching, you need to use the `if`-statement. Consider the following\
