    # 编程练习


    在本节中，在我们进入本书的第 2 章之前，你将学习更多一些可以添加到你所构建的网页中的交互式功能。请记住，我们将只关注 JavaScript 的核心，并且只会顺带提及
    HTML 和 CSS。我们将特定于浏览器的命令降到最低。这意味着我们不会处理该语言的某些特性，如文档、事件和接口。我们可能会顺带提到它们并提供一些示例，但我们不会重点介绍它们。


    请记住，这本书是关于为初学者提供的 JavaScript 基础知识。我们只关注你作为一名通用编程初学者所需要的基础工作。回到本小节的主题，我们将通过几个程序示例，向你展示这种编程语言的交互式功能。


    ## 插入 <script> 标签和弹出窗口


    请记住，你可以使用 `<script>` 标签在 HTML 代码的几乎任何位置插入 JavaScript 代码。在 Notepad++ 中输入以下代码并将其保存为
    HTML。


    ![](img/Image00010.jpg)


    你可以随心为它命名。使用你的浏览器打开该 HTML 文件。注意，当你打开它时，你会看到一个显示消息“This is a pop-up”（这是一个弹出窗口）的弹出窗口。点击
    OK 按钮，然后你会在浏览器窗口上看到一些文本。


    如果你检查你编写的代码，JavaScript 代码被插入在两行 HTML 编程代码之间——即显示 script 之前和 script 之后的代码行（第 6
    行和第 12 行）。这只是演示了你如何在 HTML 之间插入 JavaScript。注意，我们示例代码中的第 9 行包含 `alert`，这是一个特定于浏览器的命令。我们使用该命令来显示文本。注意它的语法。你可以使用单引号或双引号来表示要显示的文本。


    我们将在本书的第 3 章中介绍语法规则。


    ## 修改 HTML 内容


    这是你使用 JavaScript 可以做的另一个交互式操作：更改网页上的内容。在 Notepad++ 上创建一个新文件并输入以下代码。注意按钮元素的语法。我们稍后后会介绍该元素的各个部分。现在，我们将关注
    JavaScript 的这一功能。


    ![](img/Image00011.jpg)


    将你的工作保存为 HTML 文件，并使用你喜欢的任何名称。双击该文件，它将用你的默认浏览器打开。注意，你将看到顶部的标题（即 `<h2>` 标签中的文本）。下方是一行文本，后面跟着一个“click
    me”（点击我）按钮。当你点击按钮时，注意文本变成了按钮点击指定的文本。


    ## 修改 HTML 样式


    你编写的 HTML 代码具有某些样式。这些样式显示了网页内容将如何呈现给访问者。JavaScript 可以更改页面呈现的样式。


    这是一个你可以尝试的示例。将以下内容复制到 Notepad++ 的新文档中，保存为 HTML 文件，并在浏览器中打开该文档。


    ![](img/Image00012.jpg)


    观察你点击按钮的情况。在你点击后，文本的字体大小发生了变化。


    ## 随堂测试


    这是我们的第一次随堂测试。随着本书课程的进行，你还会遇到更多此类测试。问题将在这里给出，你可以在下一页找到答案。


    ### 任务

    创建一个网页文档，显示消息“I’m JavaScript!”（我是 JavaScript!）。请使用目前为止提供的信息以及我们提供的示例中的小知识。将你的工作保存为
    HTML 文件，并在浏览器中打开你的文件。


    ### 随堂测试答案

    ![](img/Image00013.jpg)


    # 第 3 章：深入研究语法


    在上一节中，我们已经过了一些关于 JavaScript 语法的基础知识。我们将在本章中更多地关注这一点。注意，与许多其他编程语言相比，这种语言使用的语法相当简单。


    当我们说语法时，我们指的是 JavaScript 中单词和符号应该如何排列的规则。如果你正确地形成或排列了这些语言元素，你编写的程序代码将由浏览器正确解释，并完全按照你指示的方式执行执行。


    然而，如果你在语法上犯了错误，就会产生错误。好消息是，我们需要涵盖的语法规则很少。作为初学者，你只需要学习语法的五个标题，包括以下：


    *   大小写敏感

    *   空白字符

    *   标识符

    *   字面量

    *   注释

    *   分号


