    ### 对象数据类型

    我们在这里只介绍对象数据类型。到目前为止你看到的所有数据类型只包含一个值。这些数据类型被称为原始数据类型。


    JavaScript 和其他编程语言中使用的更高级的数据类型是 `object`（对象），这种数据类型可以包含多个值。你可以这样想，你可以创建一个代表不同值的变量。这种记录可以包含多个位信息，例如姓名、电话号码、邮箱、社交媒体账号和交易。


    ### 符号 (Symbols)

    最后一个我们要介绍的类型类型是 `Symbol`（符号）。它被用于创建标识符。


