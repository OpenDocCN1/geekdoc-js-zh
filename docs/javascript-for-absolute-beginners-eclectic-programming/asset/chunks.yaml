    Don’t worry about all those terms for now. You will learn them later as we go
    along with the lessons in JavaScript programming. We’ll work on the related jargon
    as we go through the different chapters.


    ## Dynamic Variable Typing


    Do you remember variables in math? I’m referring to algebra to be specific. As
    a quick review: a variable is something that holds or contains a value. Like sometimes
    we assign `x = 10` for example. The variable `x` contains an integer value. An
    integer is a number that doesn’t contain a fractional part—like `0.5` or `0.75`
    for example.


    So, in this example, `x` only contains the value of `10` – no decimal points whatsoever.
    Once you assign something else to the variable `x` then it changes. So, let’s
    say we add a `0.5` to `x` then it becomes a real number since its value is `10.5`.


    In certain programming languages, like `Pascal`, `Basic`, `C`, or `C++` for instance,
    if you assign a variable a specific type (like an integer for instance, which
    follows our previous explanation) that variable can only contain whole numbers
    or integers.


    If you try to change that along the way then it will produce an error and the
    program fails. That means if you assign the value of `10` to the variable `x`
    then this variable can’t contain any fractional or decimal parts.


    You will have to create a different variable for the real number, which is the
    case for many static programming languages.


    But that is not the case with JavaScript. You can assign `10` at the beginning
    of your code and then add the `0.3` later on and it will not create any problems.
    This is called dynamic typing. It is a convenient way to work with variables and
    also to reduce run time errors when a computer, phone, or some other device runs
    your program.


    ## Not a Strict Teacher


    As you can see so far, JavaScript is not as we say a strict programming language.
    The usual restrictive rules that are present in other languages have been done
    away with here. This allows learners beginners in programming to make the usual
    “mistakes” in programming.


    You get to focus on the foundational concepts of programming without having to
    worry about a lot of rules about program structure where this part of the code
    goes where or which thing goes where.


    It is very beginner-friendly, which is why JavaScript is a great choice for beginners
    who want to learn web programming.


    **NOTE**: take note that JavaScript is a different programming language compared
    to `Java`. They sound the same and the naming convention is a truly bad practice
    but we can’t do anything about it. Everyone just has to live with that. Just remember
    that we’re learning JavaScript and not the other full-blown computer programming
    language called `Java`.


    ## Client-Side Language


    This scripting language is also referred to as a client-side language. This means
    that a lot of its features are to be used for the benefit of the computer user.
    In contrast with that, a server-side language is more concerned about what happens
    in the background of a website—particularly on the servers where these sites are
    contained. There are other client-side and server-side languages out there as
    well.


    In the case of JavaScript, this programming language is often used for improving
    the interaction between a website and the users that visit them. The program code
    that you will make from this language will make things more interactive.


    That is why it is used in other places as well other than just websites. It is
    used in mobile application development and games as well. The apps and games on
    your phone and other mobile devices need to be interactive and JavaScript is a
    powerful way to help you do that.


    ## Quick History Lesson


    Let’s get over this part quickly so we can move on to the actual code writing.
    Here’s a quick overview of the history of this programming language:


    * It was developed in 1995 by Brendan Eich

    * It was originally called LiveScript but was later changed to JavaScript

    * A lot of the syntax of JavaScript was taken from or influenced by the `C` programming
    language

    * Today it has been developed to run not just on computers but you will find many
    embedded applications, web browser applications, TV apps, and of course mobile
    apps.


    If you want to delve deeper into the history of this programming language, then
    you should look for it other sources. There is plenty of history and language
    development information elsewhere.


    Now, let’s get into the nitty-gritty stuff, shall we?

    See you in chapter 2.


    ## Chapter 2: Writing Your First JavaScript Program


    In this chapter, we will go over and write your first JavaScript program—or programs,
    since you will be working on several exercises at the end of this chapter. Here
    you will learn a few basic but really important concepts. In this chapter, we
    will go over what you need to write and run your JavaScript programs and the first
    few elements of the JavaScript syntax.


    ### How to Write Your First JavaScript Program


    I always say that the best way to learn something new is to simply just jump into
    it get things done. And that is what we’re going to do right now—make you write
    your first JavaScript program and see what happens. So, what do you need to run
    a JavaScript program?

    You will need two things to run JavaScript, which are the following:


    1. A text editor such as `Atom`, `Sublime Text`, `Visual Studio Code`, and `Notepad++`.

    2. A browser like `Chrome`, `Safari`, `Firefox`, and `Microsoft Edge`

