    \ information in an `object` and you can create one for every customer. That way\
    \ you can organize data and easily locate the information for each customer as\
    \ it becomes needful.\n\n### Symbols\nThe last data type we will go over is called\
    \ a `symbol`. This one is used to create identifiers for objects.\n\n### Pop Quiz\n\
    Try to guess the output of each line on this script:![](Image00025.jpg) After\
    \ guessing, embed that script in an HTML file and see the result if you have answered\
    \ correctly.\n\n# Chapter 8: Interacting with Your Users\nEarly on in this book,\
    \ we mentioned that JavaScript makes websites and web applications more interactive.\
