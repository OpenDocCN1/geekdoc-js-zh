    \n# Chapter 10: Looping Statements\nOne of the functions that we mentioned and\
    \ described in chapter 5 when we discussed the different statements in JavaScript\
    \ is looping statements. Two of the statements that we described in that chapter\
    \ are the `while`- and `for`-loops. We will go over these two loops.\n\n### What\
    \ is a Loop?\nEarlier, we described a loop as something that repeats. In programming,\
    \ a block that is composed of several lines can be repeated over and over if they\
    \ are placed within a loop. This way you don’t have to repeat them over over if\
    \ all you need is to repeat the same action.\n\n### While Loop\nAs was described\
    \ earlier, a `while` loop tests a condition first and then performs a block of\
    \ code as long as the condition remains true. Here is the syntax for this loop:\n\
    \n```\nwhile ( condition ) {\n  // code\n  // so-called loop body\n}\n```\nHere’s\
    \ an example of a while loop:![](Image0036.jpg) Try that code and open it in your\
    \ browser. The `while`-loop on line 6 will test the value of the variable `i`.\
    \ If its value is less than 3 then the statements inside the `{ }` will be executed\
    \ (the loop body). Inside the loop the body has two statements. The first one\
    \ displays the value of the variable `i` and the second statement increases the\
    \ value of the variable `i` by 1. That is what is meant by `++`. Take note that\
    \ the `++` operator will increment the value of an integer by 1. When the value\
    \ of `i` is no longer less than 3, then the loop breaks and moves on to the next\
    \ line in the program code. Note that if the `++` operator increments by one,\
    \ the `--` operator on the other hand decrements number values by 1. Try this\
    \ next code that uses the `--` operator to decrement the value of the number:![](Image0037.jpg)\
    \ Notice that in this example we use the statement `while (i)`. This is a short\
    \ way of writing `while(i != 0`. This is because in the world of computers and\
    \ programming the number 1 denotes true and zero denotes false.\n\nSingle Statement\
    \ Loops\nNote that if your loop only has one statement inside it, you don’t need\
    \ to enclose it in curly braces `{}`. See the following example:\n\n```\nlet i\
    \ = 3 ;\nwhile ( i ) alert ( i -- );\n```\n\n Endless Loop\nBe careful when writing\
    \ the conditions for the `while` loop. You should also make sure that there is\
    \ a way to break the loop or else you will be stuck in an endless cycle. Well,\
    \ technically not endless—that is only until the computer runs out of RAM to be\
    \ exact. In our previous example of the `while` loop in action (i.e. the one that\
    \ uses `i++`), if you remove the `++` on line 8, the value of the variable `i`\
    \ won’t change at all, and the loop will cycle on continuously (in theory, that\
    \ is).\n\n### Do…While Loop\nAs was explained earlier, this loop is the opposite\
    \ of the `while` loop. The loop body is executed first and then the logical test\
    \ is performed after. It has the following syntax:\n\n```\ndo {\n  // loop body\n\
    } while ( condition ) ;\n```\nTry this sample code in Notepad++ to see how it\
    \ works:![](Image0038.jpg) Notice, from the example above, given the logic of\
    \ the `do…while` loop, the statements in the loop body will be performed at least\
    \ once. If the value of `i` was initially 3 then the loop terminates after displaying\
    \ its value once on the screen.\n\n### For-Loop\nWith the `for`-loop, the number\
    \ of repetitions will be indicated at the beginning of the loop so you will already\
    \ know how many times the statement in the loop body will be repeated. This loop\
    \ statement has the following syntax:\n\n```javascript\nfor ( begin ; conditional\
    \ test ; step ) {\n  // ... body of the loop...\n}\n```\nNote that this loop is\
    \ more complex than the other two that we have tried. However, since this type\
    \ of loop provides a lot more control, it is one of the most used looping methods\
    \ in JavaScript and other languages as well. Here’s an example of the `for`-loop\
    \ in action:![](Image0039.jpg) Let’s go over this loop step by step so you will\
    \ understand what’s on. The loop begins on line 5. What it does is that it assigns\
    \ the value of zero to the variable `x`. It then makes a logical test for the\
    \ value of `x < 3`. If it returns true (which is correct at the beginning the\
    \ loop), then the loop body is executed. If it returns false, then the for-loop\
    \ terminates. At the end of line 5 the value of `x` is incremented by 1 via `x++`.\n\
    \nInline Variables\nNote that in the case of these loops, the counting variable\
    \ we used such as `i` and `x`, were created within the loop. As such they only\
    \ exist inside the loop. If you use them outside of the loop then it will produce\
    \ an error. These local variables that exist within the body are called inline\
    \ variable. They are local variables and they only work inside the statement.\
    \ To test that, run the following code in your browser. Notice that it will produce\
    \ an error.![](Image0040.jpg) As you can see from the example above, line 8 will\
    \ generate an error. It uses the inline variable `i` that only exists the for-loop.\n\
    \nGlobal and Local Variables\nOne way to avoid this is to just declare the variable\
    \ outside of the loop and then use that global variable, which can be used inside\
    \ a loop. Remember that there are global and local variables. You can use global\
    \ variables pretty anywhere in your code but local variables can only be used\
    \ within the statement where they were made. Here’s a quick solution to the problematic\
    \ code in the previous example![](Image0041.jpg) In this solution, the variable\
    \ `i` is declared in line 4 before the loop was started in line 6, making it a\
    \ global variable that can be used anywhere. Its value changes as the loop iterates\
    \ since the for-loop uses it as a counter.\n\n### Break and Continue Statements\n\
    In chapter 5 we described the `break` statements as code that you can put within\
    \ the loop to skip iterations. The `break` statement stops the loop completely\
    \ while a `continue` statement will only skip one iteration. To demonstrate the\
    \ difference between these two, try the following example:![](Image0042.jpg) The\
    \ `break` statement in line 9 will stop the loop completely. This next example\
    \ is `continue` statement:![](Image0043.jpg) Notice that when the condition in\
    \ line 7 is fulfilled that iteration is skipped, which means the alert statement\
    \ in line 9 is not performed for time.\n\n**Pop Quiz**\nTask 1: You can rewrite\
    \ code using one loop for another. The sample code below uses for-loop. I want\
    \ you to edit the code and this time use a while-loop instead. You should come\
    \ up with the same results though you used different loop.![](Image0044.jpg)\n\
    Task 2: Write a script that continuously prompts the user to enter a number that\
    \ is higher than 100. The loop will only terminate if the user enters a number\
    \ higher than 100.\n\nAnswer to Pop Quiz Task 1![](Image0045.jpg)\nAnswer to Pop\
    \ Quiz Task 2![](Image0046.jpg)\n\n# Chapter 11: Functions\nYou have been using\
    \ functions in your scripts so far like `alert`, `prompt`, and `confirm`. JavaScript\
    \ allows you to create functions. Remember, as defined earlier, a function is\
    \ a collection of statements and these statements are designed to perform a specific\
    \ task. These functions that you will write are called user-defined functions.\
    \ Here’s an example of one that adds numbers![](Image0047.jpg) From this example,\
    \ you can see that the function declaration is on line 4 using the keyword `function`.\
    \ Again, isn’t a creative way to name things—we create functions using `function`—but\
    \ that’s what we’ve got so just have to use it. Okay, moving on, the syntax of\
    \ a function declaration goes like this:\n\n```\nfunction ( parameters ) {\n \
    \ ... body\n}\n```\nGoing back to our example, the name of the function is `sum`.\
    \ It is followed by certain parameters or arguments, which can change the output\
    \ of a function as was explained in an earlier chapter. The body of the function,\
    \ just like a loop body, is found between the curly brackets `{}`. This setup\
    \ looks familiar because you’ve been doing it for a bit now when worked on the\
    \ looping statements earlier. The big difference here is that a function does\
    \ more than just repeat steps or statements. They perform a certain function (told\
    \ you it’s a bad naming convention). In the case of our example above, the `sum`\
    \ function that we created adds up the values of `a` and `b`. Notice on line 5\
    \ we have what is called a return statement. It can be placed anywhere in the\
    \ function body. What it does is that it takes the value of that expression and\
    \ produces the output of the function you created. In the case of the example\
    \ above, it returns the sum of the two numbers that were entered as arguments\
    \ to the function called `sum`. You can use variables in those two arguments and\
    \ you can ask users to enter the values for those arguments. You can also just\
    \ compute the values of those arguments. There are lots of possibilities you can\
    \ go for in the design of your own functions.\n\n### Local Variables\nAgain, just\
    \ like what we have already mentioned in the previous chapter, you can declare\
    \ variables inside functions, which will be considered as local variables. Remember\
    \ that these variables only exist within the body of the function that you create.\
    \ If you use them outside of the function body then it will cause a bug or error.\
    \ You can mitigate against this by using global variables.\n\n**Pop Quiz**\nTask:\
    \ Let’s assume that we are designing a video streaming site, just like Netflix.\
    \ However, we want to check whether the user who is signing up for a subscription\
    \ is old enough since there are age restrictions for these sites. Create a script\
    \ that will prompt users to enter their age. In that script, write a function\
    \ that will evaluate whether a user is 18 years old or below. If the user is age\
    \ 18 and above then output a message that says “Access granted” if not then send\
    \ out a message that says “Access denied”.\n\nConclusion Thank you once again\
    \ for downloading this book. After learning all the subjects that have been discussed\
    \ and working on the different exercises and quizzes provided here, you should\
    \ have some preliminary knowledge about JavaScript programming. Remember that\
    \ we have only touched on the core basics of this scripting language. There is\
    \ a lot more that it can do. This book was designed for absolute beginners and\
    \ at this point, you are no longer one. You have dipped your proverbial toes in\
    \ the wonderful world of web coding and computer programming in general. If you\
    \ find that writing code is absolutely fun, then you can venture further into\
    \ JavaScript learning more intermediate and advanced subjects such as objects,\
    \ code style, debugging, automated testing, object references, JSON methods, arrays,\
    \ prototypal inheritances, error handling, UI events, and document and resource\
    \ loading among many other things. The possibilities are endless and JavaScript\
    \ is just one of many other languages thus far. I would also recommend that you\
    \ should master HTML and CSS since you’ve dabbled in them slightly as you went\
    \ along with the exercises in this book. Another programming language that is\
    \ also pretty easy to learn is Python, which has a plethora of applications as\
    \ well. If you like you can also move forward to more advanced and stricter languages\
