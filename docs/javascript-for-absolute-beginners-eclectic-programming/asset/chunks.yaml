    \ This small popup is also known as a modal window. When we say modal, it means\
    \ that it is something that the user can interact with.\n\nIn the case of the\
    \ `alert` statement, all that a user can do is click the “ok” button. To make\
    \ things more interactive, you can ask the user to enter certain information.\
    \ We now introduce you to the `prompt` function. Don’t worry too much about what\
