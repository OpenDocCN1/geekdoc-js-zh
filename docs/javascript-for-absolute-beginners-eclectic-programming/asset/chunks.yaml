    ## 文本编辑器

    任何这些文本编辑器都可以很好地工作。我不推荐简单的文本编辑器，因为使用那些工具只能打字。上述提到的编辑器兼具源代码编辑器的功能，这意味着它们可以自动纠正（并自动补全）你的编程代码语法。我在本书中将使用
    `Notepad++` 显示代码，这是一款免费且易于下载的文本和源代码编辑器。你可以通过[点击此处](https://notepad-plus-plus.org/downloads/)
    下载 `Notepad++`。在你的电脑上下载并安装它只需不到一分钟。请记住，JavaScript 是一种脚本语言，这意味着它不能独立运行程序。在这种设置下，你在文本编辑器中输入程序代码，而由你的浏览器负责解释并运行代码。JavaScript
    也是一种非常可移植的语言，因为它可以在包括 Windows、iOS、Android、Mac 和 Linux 在内的任何操作系统上运行。


    ### 标签

    现在，这里有一个某些读者将第一次学习的新概念。你的代码部分将被包含起始标签和结束标签之间。这里有一个例子：`<script>` 和 `</script>`。第一个是
    `<script>`，显示代码从哪里开始或标签从哪里开始；第二个是 `</script>`，显示标签在哪里结束。你使用这两个标签来告诉浏览器，这两个标签之间的任何内容都是脚本的形式——在我们这里的这个小活动中，我们使用的是
    JavaScript。


    是的，还有其他脚本语言，例如 Ruby、Python、Perl 和 PHP 等。如果你玩过论坛中使用的 bb-codes，那么概念基本上是一样的。例如，你使用
    `[b]` 和 `[/b]` 标签，使得脚本中的文本以**粗体**字体显示。例如，当你在在线论坛帖子中写以下内容时：“Hi! My name is [b]Jeff
    [/b]。” 它在论坛中将显示为“Hi! My name is Jeff .”如你所看到的，单词 Jeff 是粗体字符。


    现在，我希望你已经下载了 `Notepad++` 或其他源代码编辑器。如果你还没有，那么现在是时候下载一个并安装到你的电脑上了。在安装好之后（记住我使用 `Notepad++`
    是因为它是免费的），在代码编辑器中输入以下内容：

    ![](img/Image00004.jpg)


    关于上面的示例代码，你应该注意以下几点。首先，第一行说是 `<html>`，这意味着这是一个 HTML 程序；HTML 代表超文本标记语言，它是用于构建网页的主要语言。正如之前提到的，你将学习关于该编程语言的一些知识。


    ### 起始标签和结束标签

    如果你回看我们之前的示例，你会发现整个代码以 `<html>` 开始，并在底部由另一个标签 `</html>` 配对。前者被称为起始标签，后者被称为结束标签。JavaScript
    也是如此。你的 JavaScript 代码也有起始标签和结束标签。在我们上面的示例中，其他的起始和结束标签对有 `<title>` 和 `</title>`、`<head>`
    和 `</head>`、`<script>` 和 `</script>` 以及 `<body>` 和 `</body>`。注意，我们第一个示例中的大多数标签都是
    HTML。JavaScript 实际上是以 `<script type="text/javascript">` 开始并以 `</script>` 结束的。现在请注意，这种脚本格式适用于
    HTML，而不是 HTML5，后者是不同的。


    这是另一个例子，我想让你识别不同的起始标签和结束标签：

    ![](img/Image00005.jpg)


    在识别不同的标签后，这里有你需要注意的几点：


    *   代码以 `<html>` 标签开始，以 `</html>` 标签结束。

    *   `<head>` 和 `</head>` 标签表示元数据。这被称为 `<head>` 元素，它不会显示在你的浏览器或设备屏幕上。它作为你的 HTML
    文档的标题——或者说是你程序的标题。

    *   `<h1>` 和 `</h1>` 标签是标题。将这些视为段落标题或书中的章节标题。

    *   `<p>` 和 `</p>` 标签表示段落元素。它们告诉浏览器段落从哪里开始和结束。

    *   `<i>` 和 `</i>` 标签以*斜体*显示文本，`<u>` 和 `</u>` 标签以下划线显示文本。

    *   `<body>` 和 `</body>` 标签识别主体元素或文档主体——之前我们有一个 head 元素，现在我们有一个 body 元素。观察，body
    元素应该始终位于 `<html>` 和 `<body>` 标签之间。


    随着本书章节的推进，我们将学习更多 HTML 和 JavaScript 之间的相互作用。如果你运行我们第二个示例中的代码，它将在你的浏览器上显示类似如下的内容。

    ![](img/Image00006.jpg)


    ### 不仅仅显示文本

    JavaScript 不仅仅是在你的屏幕上显示文本。它是你网站中使其更具交互性的部分。在 `Notepad++` 上创建一个新文件并输入以下内容：

    ![](img/Image00007.jpg)


    ### 仅使用基础知识

    如果你不想费心处理上述所有 HTML 代码，只想学习 JavaScript 的基础知识，请记住你只需要这个基础的骨架标签格式：

    ![](img/Image00008.jpg)


    这些是你需要的全部四个标签，你所做的是将你的 JavaScript 代码（或简称为脚本）插入脚本标签之间（即省略号所在的地方）。但如果你想添加一些文本元素，你可以自由地使用
    `<p>`、`<h1>` 和 `<h2>` 标签内的内容。即使你有这些文本元素，你的脚本仍然可以正常工作。


    ### 将你的工作保存为 HTML

    你接下来需要做的另一件事是点击 `File > Save As`，然后在弹出的窗口中点击左面板上的 `Desktop`，这样将你的工作保存到桌面上。如果你喜欢，可以选择不同的文件夹。之后，点击
    `Save as Type` 并从下拉菜单中选择 `HyperText Markup Language`，并将文件名写入 `Welcome to JavaScript`。你将在桌面（或你选择的文件夹）上看到一个名为“Welcome
    to JavaScript”的新文件，它将具有你默认浏览器的图标——我的是 Google Chrome，所以我我在桌面上看到一个新的 Chrome 文件。双击该文件，你的默认浏览器将打开它。在你的浏览器上，你将看到显示的内容：

    ![](img/Image00009.jpg)


    注意那里还有一个按钮。欢迎消息是**粗体**字体并是标题样式，这是因为使用了 `<h2>` 标签。现在，点击该按钮。你将看到你所在地区的当前日期和时间显示在屏幕上。如你所看到的，JavaScript
    让页面更具交互性，而不仅仅是在屏幕上显示文本。


