    1. What is a statement?

    2. What is a loop?

    3. Give examples of looping statements

    4. How do you temporarily disable parts of your code?

    5. What’s the difference between single-line comments and multiline comments?


    # Chapter 6: Variables and Constants


    We have touched on variables in the previous chapter and we will go over them
    in detail in this one. If you remember, there are variables in JavaScript just
    like we do in algebra and all those other wonderful math subjects. However, the
    big difference here is that the variables in JavaScript don’t only contain numbers.
    They can contain other types of data like letters, symbols, and more.


    ## Const versus Let


    One rule you have to remember is that before you can use any variable (or any
    other type of element in your JavaScript) you need to declare it first. Declaring
    it means that you are setting a memory allocation in your computer’s RAM that
    will be used for that part of your program. There are two statements that you
    will need to remember:


    * `const`

    * `let`


    We have gone over statements in the previous chapter and we have described some
    of the statements or commands that you will likely use when you write your scripts
    or program code. Let’s cover the difference between these two statements and how
    you can use them to create variables.


    Here’s an example of how you can use `const` and `let` to assign values to variables:


    ```

    const pi = 3.1416 ;

    let message = ''Hello'' ;

    ```


    You use the equal sign (also known as the assignment operator) to assign a value
    to each of these variables. In the case of `const` in the example above, it assigns
    the value `3.1416` to `pi` and `let` assigns a string of characters to the variable
    called `message`. Actually, in this example, `pi` is not a variable but it is
    called a constant.


    ### What’s the difference?


    When you use `const` the value of the variable is not allowed to change, which
    is why it’s called a constant, to begin with. On the other hand, when you use
    the `let`-statement, the value can be changed.


    Here’s a quick exercise. Type the following code, save it, and open it in your
    browser.![](Image00019.jpg)


    As you can see, the `alert` statement displays the content of the variable called
    `message`. Remember that you don’t enclose a variable in quotation marks if you
    use them as arguments in an `alert` statement.


    ### Declaring Multiple Variables


    Let’s say you want to declare multiple variables. You don’t need to write a lot
    of `let` statements to do that. You can just declare everything using one line,
    like this:


    ```

    let user = ''Mary'' , age = 18 , message = ''You’re late for class!'' ;

    ```


    Separate each variable declaration using a comma. Now, you can also declare them
    in separate lines, like so:


    ```

    let user = ''Mary'' ,age = 18 ,message = ''You’re late for class!'' ;

    ```


    ## Pop Quiz


    **Question**: What do you think is the output of the following code?![](Image00020.jpg)


    **Answer**: Two different texts will be displayed even though only one variable
    was used. Two different values were assigned to the variable and then they were
    displayed on the screen. Case in point: the values of variables can be changed
    or manipulated—meaning you can add, subtract, and edit or alter the contents of
    a variable.


    ### Two Lets Produces an Error


    Try the following code. Type it in Notepad++, save it as HTML, and then open it
    using a browser.![](Image00021.jpg)


    What is displayed on the screen? If you answered nothing, then you are correct.
    Why do you think that nothing was displayed even though we had an `alert` statement
    there? It is because you can’t declare the same variable twice. If you want to
    change the value of a variable just declare it once and then use the assignment
    operator or equal sign to change the value of the variable.


    ### Rules for Naming Variables


    There are only two rules that you should remember when it comes to giving names
    to the variables that you create in JavaScript:


    1. The first character should not be a number.

    2. You can only use the letters of the alphabet, numbers `0` to `9`, and the symbols
    `_` and `$`.


    As it was mentioned before, JavaScript is case-sensitive. Another thing is that
    when you use long variable names that have more than one word in them, the usual
    convention is to use camel case names, like this one:


    ```

    let userName ;

    ```


    You can capitalize the first letter of the next word. Note that non-English letters
    are also allowed in JavaScript but it is not recommended. Here’s an example:


    ```

    let имя;

    ```


    **Reminder**: choose variable names that describe the value that they store. When
    we name a variable as “password” it should contain passwords. If we name a variable
    as “monthlySales” then it should contain numbers and the sales figures for the
    month.


    ### Reserved Words


    There are reserved words in JavaScript and you can’t use them as variable or constant
    names. Using them produces an error in your code. Here’s the list of reserved
    words (also known as keywords) in this programming language:


    `break`, `case`, `yield`, `function`, `with`, `catch`, `class`, `while`, `void`,
    `const`, `continue`, `var`, `typeof`, `debugger`, `default`, `try`, `this`, `throw`,
    `delete`, `do`, `super`, `switch`, `new`, `return`, `else`, `export`, `in`, `instanceof`,
    `extends`, `finally`, `if`, `import`, `for`


    These keywords already perform a function in JavaScript, which is why you can’t
    use them as user-generated variable names.


    # Chapter 7: Data Types and Operators


    Variables can contain different types of data. Some are numeric, some are text,
    and in JavaScript, there are 8 different types of data that you can work with.
    We will also go over the different operators that you can use to modify the values
    contained inside the variables.


    ## Dynamically Typed


    As it was mentioned early in this book, JavaScript is dynamically typed. That
    means we can assign numeric values to our variables at the beginning and then
    assign numbers at a later portion of the code and there won’t be any problems.
    Programming languages that have this property are called dynamically typed.


    ### Numbers


    Numbers in JavaScript can be whole numbers like `100` or `7`. They can also be
    floating-point numbers like `3.1416` or `12.325`. You can use the following operators
    for numeric data:


    * `+` (addition)

    * `-` (subtraction)

    * `/` (division)

    * `*` (multiplication)

    '
