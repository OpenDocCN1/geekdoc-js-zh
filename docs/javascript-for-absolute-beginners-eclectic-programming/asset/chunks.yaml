    \ syntax of the `prompt` function goes like this: `prompt ( title , [ default\
    \ ]);`\n\nThe keyword `prompt` is followed by an opening and closing parenthesis\
    \ `(` and `)`. Inside it are two arguments. An argument is a programming term\
    \ that means that it is a value that can affect the behavior of a function. In\
    \ this case, the `title` is the text that you use to tell the user what to enter.\
    \ The `[default]` part is the default value that will be displayed. Note that\
