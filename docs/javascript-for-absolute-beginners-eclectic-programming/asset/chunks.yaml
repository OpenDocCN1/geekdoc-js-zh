    # 第 6 章：变量与常量


    我们在上一章中提到了变量，在本章中将对它们进行详细介绍。如果你还记得，JavaScript 中的变量就像我们在代数和其他所有奇妙数学学科中的变量一样。然而，巨大的区别在于，JavaScript
    中的变量并不仅包含数字，它们还可以包含其他类型的数据，如字母、符号等。


    ## Const 与 Let


    你必须记住的一个规则是：在运行任何变量（或 JavaScript 中的任何其他类型元素）之前，你必须先对其进行声明。声明意味着你正在计算机的 RAM 中设置一个内存分配，该内存将用于你程序的这部分。你需要记住有两种语句：


    * `const`

    * `let`


    我们在上一章中已经学习了语句，并描述了一些你在编写脚本或程序代码时可能会用语句或命令。让我们来看看这两个语句之间的区别，以及你如何使用它们来创建变量。


    以下是如何使用 `const` 和 `let` 给变量赋值的示例：


    ```

    const pi = 3.1416 ;

    let message = ''Hello'' ;

    ```


    你使用等号（也称为赋值运算符）为这些变量中的每一个赋值。在上面的 `const` 示例中，它将 `3.1416` 赋值给 `pi`，而 `let` 将一个字符串赋值给名为
    `message` 的变量。实际上，在这个示例中，`pi` 并不是变量，它被로常量。


    ### 有什么区别？


    当你使用 `const` 时，变量的值是不允许改变的，这就是为什么它从初被称为常量的原因。另一方面，当你使用 `let` 语句时，值是可以改变的。


    这是一个快速练习。输入以下代码，保存它，并在浏览器中打开。![](img/Image00019.jpg)


    如你所示，`alert` 语句显示了名为 `message` 的变量的内容。记住，如果你在 `alert` 语句中使用变量作为参数，不要将变量包含在引号中。


    ### 声明多个变量


    假设你想声明多个变量。你不需要写很多 `let` 语句来实现这一点。你只需要用一行声明所有内容，如下：


    ```

    let user = ''Mary'' , age = 18 , message = ''You’re late for class!'' ;

    ```


    使用逗号分隔每个变量声明。现在，你也可以分行声明它们，如下所示：


    ```

    let user = ''Mary'' ,age = 18 ,message = ''You’re late for class!'' ;

    ```


    ## 堂测


    **问题**：你认为以下代码的输出是什么？！[](Image00020.jpg)


    **答案**：即使只使用了一个变量也会显示两个不同的文本。变量被赋予了两个值，然后显示在屏幕上。例如：变量的值可以被改变或操作——这意味着你可以添加、删除以及编辑或更改变量的内容。


    ### 两个 Lets 会产生错误


    尝试以下代码。在 Notepad++ 中输入，将其保存为 HTML，然后使用浏览器打开。![](img/Image00021.jpg)


    屏幕上显示了什么？如果你回答“什么都没有”，那么你是正确的。为什么你认为尽管那里有一个 `alert` 语句，但什么都没有显示？这是因为你不能两次声明同一个变量。如果你想更改变量的值，只需声明一次，然后使用赋值运算符或等号来更改变量的值。


    ### 变量命名规则


    在为 JavaScript 中创建的变量命名时，你只需要记住两个规则：


    1. 第一个字符不能是数字。

    2. 你只能使用字母表字母、数字 `0` 到 `9` 以及符号 `_` 和 `$`。


    如前提到的，JavaScript 是大小敏感的。另外一点是，当你使用多个单词的长变量名时，通常的做法是使用驼峰命名法（camel case），例如：


    ```

    let userName ;

    ```


    你可以将下一个单词的首字母大写。注意，JavaScript 也允许非英语字母，但不建议这样做。这里有一个例子：


    ```

    let имя;

    ```


    **提醒**：选择描述其所存储值的变量名。当我们把变量命名为“password”时，它应该包含密码。如果我们把变量命名为“monthlySales”，那么它应该包含该月的数字和销售数据。


    ### 保留字


    JavaScript 中有很多保留字，你不能将它们作为变量或常量名。使用它们会导致代码产生错误。以下是该编程语言中保留字（也称为关键字）的列表：


    `break`, `case`, `yield`, `function`, `with`, `catch`, `class`, `while`, `void`,
    `const`, `continue`, `var`, `typeof`, `debugger`, `default`, `try`, `this`, `throw`,
    `delete`, `do`, `super`, `switch`, `new`, `return`, `else`, `export`, `in`, `instanceof`,
    `extends`, `finally`, `if`, `import`, `for`


    这些关键字在 JavaScript 中已经具有功能，这就是为什么你不能将它们作为用户生成的变量名。


    # 第 7 章：数据类型与运算符


    变量可以包含不同类型。有些是数字，有些是文本，在 JavaScript 中，有 8 种你可以处理的数据类型。我们还将概述用于修改变量内部包含值的各种运算符。


    ## 动态类型


    正如本书早期提到的，JavaScript 是动态类型的。这意味着我们可以在开始为变量分配数值，然后在代码的后续部分分配数字，而不会出现任何问题。具有这种属性的编程语言被称为动态类型语言。


    ### 数字


    JavaScript 中的数字可以是像 `100` 或 `7` 这样的整数，也可以是像 `3.1416` 或 `12.325` 这样的浮点数。你可以对数值数据使用以下运算符：


    * `+`（加法）

    * `-`（减法）

    * `/`（除法）

    * `*`（乘法）


