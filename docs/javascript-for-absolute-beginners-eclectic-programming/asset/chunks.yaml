    让我们从最简单的主题开始：大小写敏感。


    ### 大写敏感

    `JavaScript` 是一种对大小写敏感的语言。这意味着当你使用单词时，字母的大小写方式会起作用。例如，假设你想将网站用户输入的密码保存到一个名为变量的东西（稍后会详细介绍）中，并将此密码命名为
    `Password`。那么它在你的整个程序中应该是这样显示的。如果你在程序代码中出于某种原因使用了 `password`，它会被视为与 `Password`不同的内容。记住，`password`
    会被视为与 `Password`不同的内容。大写字母和小写字母会区分你代码中的不同内容。


    ### 空格

    空白指的是你在任何文档中输入内容时所产生的空格、换行符和制表符。我们通常在输入的每个单词后只使用一个空格。例如，如果我们在 MS Word 中输入内容时输入了两个空格，拼写检查器就会提示你犯了那个拼写错误。然而，在
    `JavaScript` 中，这些空格和制表符并不重要。这就是为什么你可以随意输入任意数量的空格而不会引起任何错误。在理论上，你可以添加任意数量的这些元素而不会出现问题。


    在实践中，程序员之间存在一种不成文的规定或习惯，关于如何格式化你编写的每一段代码。我们寻找的是整洁的代码，以提高其可读性。你不希望你的代码看起来像所有部分都向所有可能的方向延伸。考虑我们之前的第一个示例代码，你可以在这里看到![](img/Image00004.jpg)


    正如你所见，从这个示例可以看出，所有内容都是左对齐的。如果元素嵌套在另一个元素中，则对其缩进。例如，看上面的示例代码，你会看到`<head>` 元素之后的所有内容都缩进了一个制表符。代码的第
    3 到 6 行都是缩进的。这意味着它们位于 `<head>` 元素内部。对齐回到第 7 行。现在，看代码的第 5 行。你会看到 `alert("Hello
    World!");` 嵌套在`<script>` 标签内部。你已经在第 2 章中见过这个语句。在实践中，你应该对嵌套在另一个元素中的内容缩进，这有助于寻找特定的代码元素。这种做法也让你更容易发现程序中的错误。在我们编写代码时，都会犯错。


    ### 标识符

    标识符是程序员提供的单词或字符。本质上，它们是你赋予程序中不同部分的名称。


    回到早早的示例，假设你想让网站访问者输入密码（就像 Facebook 或其他网站一样）。假设我们要把密码存储在变量中，我们称为 `Password`。这是标识符的一个例子，就像代数一样。`JavaScript`
    中的标识符可以是字母。你也可以使用像 `x` 或 `y` 这样的单个字符。再次，你的标识符可以以任何字母开头，也可以以下划线 `_` 开头。所以，假设我们使用
    `_Password` 来存储用户提供的密码。某些标识符以 `$` 符号开头，但注意我们在 `JavaScript` 中使用 `$` 符号来引用元素。


    ### 字面量

    我们将介绍 `JavaScript` 中的字面量语法规则。之前我们提到过 `JavaScript` 中的变量用于存储网站访问者提供的密码。字面量是赋值给变量的实际值。假设我们将变量
    `Password` 赋值为 `"12345678"`。字面量是不需要编号的。它们可以是字母或数字的组合。


    ### 注释

    查看以下代码并尝试寻找注释。(Image00014.jpg) 正如你从上面的代码中所看到的，在第 6 行有一个注释。注意，这些注释不会被视为编程代码。注释是为作者编写的说明。


    ### 分号

    回到上面代码的第 5 行，在注释之前。代码如下：

    ```

    alert("Hello World!");

    ```

    如果你猜这行告诉浏览器在屏幕上显示 "Hello World!"，那么你是的。记住，在 `JavaScript` 中编写的每一行代码应该以分号结束。我们的示例中的
    HTML 部分不需要分号，但如果你在写 JavaScript 时，则会导致错误。


    ### 第 4 章：现代标记和外部脚本

    我们介绍了 `JavaScript` 中使用的语法细节，以及 HTML 部分。为什么我们仍然坚持旧的规则？这是因为旧的网站还没有更新。`<script>`
    标签今天仍然使用的某些旧的属性已经不再适用了。


    #### Type 属性

    在我们使用的示例之一（第一个）中，使用了 `type` 属性。这是示例代码：(Image00004.jpg) 在第 4 行插入这一行：`type="text/javascript"`。注意在现代标记语言如
    `JavaScript` 中，这个属性不再需要了，因为浏览器已经更新并使这些功能废弃。`type` 属性不再有意义。


    #### 如何判断你正在查看旧脚本

    如果你从事网页开发，你可能被要求编辑旧代码。有时你的任务会涉及新旧代码的结合。在 `JavaScript` 中，一种简单的方法是看脚本前后的注释。我们在第
    3 章讨论过注释，记得吗？程序员曾在脚本前后添加注释：

    ```

    <script type="text/javascript">

    ...

    </script>

    ```


    #### 注释的作用是什么？

    记住，浏览器不将注释视为代码，因此它们不会像指令一样执行。过去，程序员使用注释来隐藏脚本，以免旧浏览器出现问题。现在不再有这个问题了，所以你不需要“隐藏”你的
    `JavaScript`。这意味着如果你被要求编辑代码，只需删除这些注释即可查看脚本。


    #### 外部脚本

    假设你有很多脚本，并且从一个页面到另一个页面使用相同的脚本。重复编写所有代码会很无聊吧？好消息有一种方法保存经常使用的 JavaScript 代码，你就不需要重新输入或复制粘贴一遍。你需要的是将脚本保存在外部文件中。


    #### 创建 JavaScript 文件

    要创建 JavaScript 文件，你只需像往常一样输入脚本代码。我们不将其保存为 HTML 文件，而是保存为 JavaScript 文件。它将具有 `.js`
    扩展。你可以将它们保存在创建 HTML 文件相同的本地目录中，也可以使用它们所在的目录路径或文件夹引用它们。如果你将它们保存在网站服务器上，那么你应该使用服务器上目录的
    URL。引用你创建的 JavaScript 文件使用 `src` 属性。这是一个示例：

    ```

    <script src="/path/to/script.js"></script>

    ```

    在这个示例中，`/path/to/` 部分是脚本文件所在的目录路径或文件夹，`script.js` 是保存的 JavaScript 文件名。当然，可以使用不同的目录路径和文件名。现在，假设你的脚本文件和
    HTML 代码保存在同一个目录。你不需要编写整个目录路径。所以，在我们的示例中，你不需要 `src` 属性中包含 `/path/to/`。你可以这样写引用：

    ```

    <script src="script.js"></script>

    ```

    这意味着你创建的脚本文件保存在活动目录中。现在有一个 `src` 属性引用服务器上实际文件的示例：

    ```

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.11/lodash.js"></script>

    ```

    如果你想在代码中使用多个脚本文件，那么使用独立的 `src` 语句引用每一个。这是一个示例：

    ```

    <script src="/myfiles/script1.js"></script>

    <script src="/myfiles/script2.js"></script>

    ```

    在上面的示例中，脚本文件存在 `myfiles` 文件夹中。脚本的名字是 `script1.js` 和 `script2.js`。


    流行测验

    任务：创建一个使用 `alert` 语句的脚本文件并显示它。


