    \ `confirm()` 函数\n- 第 9 章：条件语句\n    - `if` 语句\n    - `else` 子句\n    - `else if`\
    \ 子句\n    - `?` 条件运算符\n    - 随堂测试\n- 第 10 章：循环语句\n    - 什么是循环?\n    - `while`\
    \ 循环\n    - 单语句循环\n    - 死循环\n    - `do...while` 循环\n    - `for` 循环\n    - 内联变量\n\
    \    - 全局变量和局部变量\n    - Break 和 Continue 语句\n    - 随堂测试\n- 第 11 章：函数\n    - 提醒：局部变量和全局变量\n\
    \    - 随堂测试\n- 总结\n\n## 引言\n对于没有编程背景的初学者来说，JavaScript 是容易学习的语言之一。这是本书的核心假设——读者对编程一无所知。\n\
    \n书中还假设你至少知道如何在使用 `MS Word`（例如 Microsoft Word）之类的文字处理器上打字和组合单词。同时也假设你知道如何安装应用程序，以及编辑屏幕上输入的任何内容——在完成书中的练习和测试时，你将进行大量操作。\n\
    \n本书作者还假设你已经知道如何使用网络浏览器，并对万维网有良好的理解。某些读者可能对 `HTML`（超文本标记语言）和 `CSS`（层叠样式表）有一定的了解，那是好事。但如果你不知道，别担心。我们将在学习过程中介绍一些基本的\
    \ `HTML` 和其他相关概念。这意味着你也将学习一些基础的 `HTML` 编程（仅是基础知识，没有会吓到非编程人员的大内容）。\n\n如果你对学习用 JavaScript\
    \ 编程感兴趣，也应该花时间学习 `HTML` 和 `CSS`，因为这两种编程语言是相辅相成的。JavaScript 是初学者编程语言的绝佳选择。有些人将其与\
    \ Python 相比，后者也是另一种非常适合初者的语言。在我看来（IMHO），Python 对初学者非常友好，在学习了一两个 JavaScript 后，你可能也想了解它。\n\
    \n那么，为什么要学习 JavaScript 呢？\n无论你不信，你每天都能看到它。当你用笔记本电脑的浏览器查看网站时，它就在那里。当你使用手机时，也会体验到它。当你与网页交互时，你可能正在看到\
    \ JavaScript 在工作。当你使用运行在互联网上的应用程序时，你已经在亲身体验这种编程语言了。\n\n如果你的工作恰好涉及任何网站的服务器端——也许你在发布博客、更新公司在线商店的项目，或者你在公司网站上做的任何事情——那么意味着你可能已经在以\
    \ JavaScript 的风格处理一些东西了。\n\n"
