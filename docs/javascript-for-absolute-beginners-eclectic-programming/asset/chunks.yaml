    \ Functions](#)\n    - [REMINDER: Local and Global Variables](#)\n    - [Pop Quiz](#)\n\
    - [Conclusion](#)\n\n## Introduction\nJavaScript is one of the easiest languages\
    \ to learn for beginners who do not necessarily have any programming background.\
    \ That is the main assumption of this book—the reader has zero know-how about\
    \ programming.\n\nIt is also assumed that you at least know how to type and compose\
    \ words on a word processor like `MS Word` (i.e. Microsoft Word) for instance.\
    \ It is also assumed that you know how to install applications and also edit whatever\
    \ you type on the screen—you will be doing a lot when you work on the exercises\
    \ and quizzes in this book.\n\nThe author of this book also assumes that you already\
    \ know how to use web browsers and have a good understanding of the World Wide\
    \ Web. Some readers may have some idea about `HTML` (Hypertext Markup Language)\
    \ and `CSS` (Cascading Style Sheets)—and that would be a good thing. But if you\
    \ don’t, well, don’t worry about it. We’ll go over some essential `HTML` and other\
    \ related concepts as we go along. That means you will learn some fundamental\
    \ `HTML` programming as well (just the basics, nothing big that will scare non-programmers).\n\
    \nIf you’re interested in learning how to program in JavaScript, you should also\
    \ take the time to learn `HTML` and `CSS` because both these programming languages\
    \ work hand in hand. JavaScript is a great choice for a beginner programming language.\
    \ Some people compare it to Python, which is another excellent language for beginners.\
    \ IMHO, Python is absolutely beginner-friendly and maybe you would want to learn\
    \ about that too after you’ve learned a thing or two on JavaScript.\n\nSo, why\
    \ learn JavaScript?\nWell, believe it or not, you see it every day. It’s there\
    \ when you look at websites on your laptop’s browser. You also experience it when\
    \ you use your phone. When you interact with the web, you are most likely looking\
    \ at JavaScript at work. When you use applications that run on the internet, you’re\
    \ already experiencing this programming language first-hand.\n\nIf your job happens\
    \ to involve something about the server-side of any website—maybe you’re posting\
    \ blogs, updating items on your company’s online store, or it can be anything\
    \ that you do on your company’s website—then that means you may already be fiddling\
    \ with a few things JavaScript style.\n"
