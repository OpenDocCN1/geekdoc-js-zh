- fmt: "\nLet’s start with the easiest subject, case sensitivity.\n\n### Case Sensitivity\n\
    `JavaScript` is a case-sensitive language. This means that when you use words,\
    \ the way you capitalize letters will count. For instance, let’s say you want\
    \ to save the passwords that website users enter into something called a variable\
    \ (more on that later) and you call this password `Password`. That is how it should\
    \ appear throughout your program. If you used `password` for any reason in your\
    \ program code, it will be seen as something different from `Password`. Remember\
    \ that `password` will be treated as something different from `Password`. The\
    \ upper case and lower case letters will differentiate things in your code.\n\n\
    ### White Space\nWhite space refers to the spaces, line breaks, and tab stops\
    \ that you make when you type something in any document. We usually just use one\
    \ space after each word that you type. If we put in two spaces when we type things\
    \ in MS Word, for instance, then the spell checker will prompt you that you have\
    \ made that typographical error. Well, in `JavaScript`, those spaces and tabs\
    \ don’t matter. That is why you can type as many spaces as you like and it won’t\
    \ cause any errors. In theory, you can add as many of these elements as you like\
    \ and it won’t be a problem.\n\nIn practice, there is an unwritten law or practice\
    \ if you will amongst programmers as to how you will format every code that you\
    \ will write. What we’re looking for is an organized looking code to make it more\
    \ readable. You don’t want your code to look like all the parts are headed in\
    \ every direction possible. Consider our first sample code earlier, which you\
    \ will see here:![](Image00004.jpg)\n\nAs you can see from this example, everything\
    \ is aligned to the left. If an element is nested within another element you indent\
    \ it. For example, look at the sample code above. You will see that after the\
    \ `<head>` element, everything is indented 1 tab space. Lines 3 to 6 in the code\
    \ above are indented. That means they are found within the `<head>` element. Everything\
    \ goes back to the left alignment in line 7 where the `</head>` tag is located.\n\
    \nNow, look at line 5 of the code above. You will see that the line `alert(\"\
    Hello World!\");` is nested inside the `<script>` tags. You’ve seen this statement\
    \ before in chapter 2. Here’s what you need to remember—in practice, you are supposed\
    \ to indent or nest everything that belongs inside another element. Doing that\
    \ makes finding specific code elements a lot easier. This practice also makes\
    \ it easier for you to spot bugs in your program. By bugs, we refer to errors\
    \ in our code. Don’t worry; it happens to the best of us. We all make mistakes\
    \ when we write our code.\n\n### Identifiers\nAn identifier is a word or character\
    \ that you, the programmer, will supply. These are characters and words that you\
    \ will use to identify different elements of a program. In essence, they are the\
    \ names that you give to different parts of a program.\n\nGoing back to an earlier\
    \ example, let’s say that you want website visitors to enter a password when they\
    \ use your site (just like what Facebook or other web portals do). Let’s say that\
    \ we want to store the password in a variable which we will call simply as `Password`.\
    \ That is one example of an identifier and this one is called a variable, which\
    \ is a program element that stores certain values—yes, just like in algebra.\n\
    \nAn identifier in `JavaScript` can be a string of letters. You can also use only\
    \ one character like `x` or `y`—yes, just like math again. Your identifiers can\
    \ start with any letter and it can also start with an underscore. So let’s say\
    \ we use `_Password` to store the passwords supplied by users, then that identifier\
    \ is perfectly legal in the syntactical rules of `JavaScript`.\n\nSome identifiers\
    \ start with a `$` sign. However, do take note that we use the `$` sign in `JavaScript`\
    \ to reference DOM elements. We’ll cover DOM elements in a later chapter of this\
    \ book.\n\n### Literals\nThe next syntax rules that we will go over are for literals\
    \ in `JavaScript`. Earlier we mentioned that there are variables in `JavaScript`.\
    \ Our previous example is the variable which we called `Password`. This variable\
    \ is the one that we will use to store the passwords supplied by website visitors.\n\
    \nLiterals are the actual values that will be assigned to variables. Let’s say\
    \ we have assigned the variable `Password` to contain `\"12345678\"` as the default\
    \ password. The value `\"12345678\"` is called a literal. It is the value that\
    \ we assign to these variables and other program elements. Literals don’t need\
    \ to be numbered. It can be letters or a combination of letters and numbers.\n\
    \n### Comments\nCheck out the following code and try to look for the comments.(Image00014.jpg)\
    \ As you can see from the code above, there is a comment on line 5 and another\
    \ in line 6. Note that these comments will not be treated as programming code.\
    \ A comment is a description or note that is intended for the author.\n\n### Semicolon\n\
    Go back to line 5 of our code above, the one before the comment. The code goes\
    \ like this:\n```\nalert(\"Hello World!\");\n```\nIf you guessed that this line\
    \ tells the browser to display \"Hello World!\" on the screen, then you’re right.\
    \ That is what `alert` does—we’ll cover that later. Remember that every line of\
    \ program code that you write in `JavaScript` should end with a semicolon. The\
    \ rest of the code in our example is HTML and doesn’t require a semicolon. But\
    \ if you’re writing the JavaScript part, then you must end with a semicolon or\
    \ it will cause an error.\n\n### Chapter 4: Modern Markups and External Scripts\n\
    We went over the details of the syntax used in `JavaScript` and also for HTML\
    \ as well. A bit of the discussion, you should know that there are old rules and\
    \ there are modern ones. Why do we still stick with the old stuff? Well, this\
    \ is because of old websites that haven’t been updated yet—or maybe. The `<script>`\
    \ tag, which we still use today, has some old attributes which are no longer applicable.\n\
    \n#### Type Attribute\nIn one of the examples we used (the very first one), we\
    \ used `type` attribute. Here’s the sample code that used:(Image00004.jpg) It\
    \ is in line 4 you insert this line in the `<script>` tag: `type=\"text/javascript\"\
    `. Note that this attribute is no longer required in modern markup languages like\
    \ `JavaScript`. This is because browsers have been updated and made those features\
    \ obsolete. That `type` attribute no longer makes sense because what it does is\
    \ tell your browser that the type of script used in your HTML is JavaScript.\n\
    \n#### How to Know If You’re Looking at an Old Script\nIf you pursue a career\
    \ in web development you may be tasked with editing old code. Sometimes your tasks\
    \ will involve updating websites that have a combination of old and new code.\
    \ There are ways to determine if you’re working on old code. In the case of `JavaScript`,\
    \ one of the easy ways to find out is when you see comments before and after the\
    \ script. We talked about comments in chapter 3, remember? Programmers used to\
    \ add comments before and after scripts:\n```\n<script type=\"text/javascript\"\
    >\n...\n</script>\n```\n\n#### What are comments used for?\nRemember that browsers\
    \ do not treat comments as programming code so they are not executed like regular\
    \ instructions. Back in the day, programmers used comments to hide scripts so\
    \ that older browsers wont any trouble. Well, nowadays no longer have that problem\
    \ so you don’t need to \"hide\" your JavaScript. That means if ever you are tasked\
    \ to edit code you can just remove those comments to see what the script is.\n\
    \n#### External Scripts\nLet’s say you have lots of scripts and you use the same\
    \ scripts from one page to the next. It will be quite repetitive to write all\
    \ that code over again, right? The good news is that there is a way to save the\
    \ JavaScript code you use regularly and you just reference them in your new page\
    \ so you don’t have to retype or copy-paste everything over over. What you need\
    \ to do is to save your scripts in external files.\n\n Creating JavaScript Files\n\
    To create your JavaScript files, you just type your script codes as usual, the\
    \ same way you’ve been doing. Instead of saving them as an HTML file, we save\
    \ them as a JavaScript file. It will have a `.js` extension instead. You can save\
    \ them in the same local directory as the HTML files you create or you can reference\
    \ them using the directory path or folder where they are saved. If you save them\
    \ in your site’s server, then you should use the URL of the directory on your\
    \ server. To reference the JavaScript files that you create use the `src` attribute.\
    \ Here’s an example:\n```\n<script src=\"/path/to/script.js\"></script>\n```\n\
    In this example, the part that goes `/path/to/` is the directory path or folder\
    \ where your script file is located and `script.js` is the name that was given\
    \ to the JavaScript file you saved. Of course, you can use a different directory\
    \ path and file name. Now, let’s say that your script file and your HTML code\
    \ are saved in the same directory. You don’t need to write the entire directory\
    \ path. So, in the case of our example, you don’t need to include `/path/to/`\
    \ in the `src` attribute. You can write your reference as:\n```\n<script src=\"\
    script.js\"></script>\n```\nThis means that the script file you created is saved\
    \ in the active directory. Now, here’s an example of `src` attribute referencing\
    \ an actual file in a server:\n```\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.11/lodash.js\"\
    ></script>\n```\nIf you want to use several script files in your code, then reference\
    \ each one of them using separate `src` statements. Here’s an example:\n```\n\
    <script src=\"/myfiles/script1.js\"></script>\n<script src=\"/myfiles/script2.js\"\
    ></script>\n```\nIn the example above, the script files are saved in the `myfiles`\
    \ folder. The names of the scripts are `script1.js` and `script2.js`.\n\n### Benefits\
    \ of Using External Scripts\nThe rule of thumb here is that you should only write\
    \ the short and simple JavaScripts on the actual code for each web page. The longer\
    \ and more complex scripts should be saved in separate JavaScript files. You will\
    \ reference them in your code only when you need them. This helps to keep your\
    \ web page code shorter. There is another benefit to using external scripts—it\
    \ makes web pages load a lot faster. How does it do that? Whenever someone opens\
    \ your web page or website, that user’s browser will automatically download the\
    \ scripts and save them in the browser cache. That means the scripts are already\
    \ loaded in their browser every time they visit your site. They no longer need\
    \ to download the entire file for your site thus making page loads a lot faster.\
    \ If the same script is going to be used on another web page, then the browser\
    \ doesn’t need to download it again since it is already saved in the cache.\n\n\
    Pop Quiz\nTask: Create a script file that will use the `alert` statement and display\
    \ it.\n"
