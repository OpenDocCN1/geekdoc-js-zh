    user’s browser will automatically download the scripts and save them in the browser
    cache. That means the scripts are already loaded in their browser every time they
    visit your site.They no longer need to download the entire file for your site
    thus making page loads a lot faster. If the same script is going to be used on
    another web page, then the browser doesn’t need to download it again since it
    is already saved in the cache.Pop QuizTaskCreate a script file that will use the
    alert statement and display the text “I’m JavaScript!”Remember to save it as a
    JavaScript file instead of an HTML file. HINT: you can use the same file you created
    from our first pop quiz earlier. After saving it, create another script but this
    time save it as an HTML file. Reference the script file that you created in the
    previous step.Open the new file using your browser.You will find the answer on
    the next page.Answer to Pop QuizThis is the answer for the JavaScript file, which
    is saved with the file name alert.js:![](Image00015.jpg)This file is saved in
    the same active directory as the HTML file that we will create later on that will
    reference this script.Here is the answer for the script that references the file
    above:![](Image00016.jpg)Chapter 5: Working with StatementsYou have been introduced
    to and have used two statements so far, namely the alert and src statements. In
    this chapter, we will cover the statements used in JavaScript and how they will
    affect your web pages.What is a Statement in JavaScript?To answer this question,
    try to go back to how the alert and src statements behave in the scripts that
    you have written so far. The alert statement displays text while the src statement
    will reference or make use of code saved in external JavaScript files.What is
    common about these two? If you answered that they perform actions then you are
    correct. A statement in JavaScript is a line of code that makes a browser to perform
    certain actions.In short, statements are commands.You can tell that a line of
    code is a statement by the semicolon at the end. The semicolons separate one statement
    from another. Statements are translated by a browser one line at a time .The following
    are some of the most common JavaScript statements that you ought to know as a
    beginner. We will go over these statements again as we discuss the different programming
    elements later on.If Else StatementThis is a conditional statement. It will test
    a certain logical condition if it is true or not. For example, if a user wants
    to log into their account on your website, they will need to enter the correct
    password for that account.After entering their password, your script can test
    if what they entered matches the password that is stored on your website. If it
    is a match then they are allowed access or else they will be prompted to try again
    and enter the right password.While StatementThis is a type of looping statement.
    A loop is a programming construct that repeats a statement or a block of statements
    over and over as long as a given logical test remains true. If the logical test
    returns false on the outset, then no block or actions are repeated .Do While StatementThis
    is similar to a while statement except that the statement (or block of code) contained
    in it will be performed at least once. The logical test is performed after the
    execution of the program block (i.e. loop) contained in the do-while statement
    whereas the while statement performs the test first before performing the loop.For
    StatementThis is another loop statement. It is also known as the for-loop. With
    this statement, the number of repetitions will be indicated in the code so you
    will already know how many times the loop block will be repeated.For In StatementThis
    type of loop is just like the for-statement with one slight difference. Instead
    of the number of loops being indicated numerically, the number of repetitions
    will be determined by the properties of the object being tested.For example, you
    want to repeat certain actions according to the number of colors there are in
    the rainbow. You can use a for-in statement to perform the actions for every color
    that is found in a rainbow programming object.Continue StatementA continue statement
    works in tandem with the different looping statements mentioned earlier. What
    this statement does is that it tells the browser to skip the remaining commands
    after it and start the loop all over again.Break StatementA break statement is
    also used with the loop statements mentioned earlier. It’s like the continue statement
    except that instead of making the browser repeat the loop, it makes the browser
    skip all the repetitions and proceed with executing the statements after the loop—essentially
    breaking out of the loop cycle.Function StatementThe function statement is used
    to create a program function (I know, it’s not a very creative way to name things
    but we just can’t do anything about it). A function in the world of programming
    is a group of statements that are designed to perform a specific action or produce
    a certain result.An example of this is a block or group of codes that test whether
    a user has paid for a product or not. Once you declare a function, it can be used
    in any part of the program that you have written thereby you don’t have to write
    the same lines of code over and over again.Return StatementThe return statement
    is used to return the value that is produced by a function.Var StatementThis statement
    is used to create a variable.There are other statements that you will learn as
    you gain more experience programming with JavaScript. We will cover the above-mentioned
    statements in detail in the next chapters of this book .Multiline Comments in
    JavaScriptIn a previous chapter you were shown what comments were and that they
    are ignored by the browser and not treated as programming code. We also understand
    that they are used as annotations for the people who read the code.Another way
    to use comments is to place them in parts of your programming code or scripts
    that you want the browser to ignore. To change a statement into a comment all
    you have to do is to put two forward slashes // to the left of the beginning of
    the statement. Voila, you have part of the code disabled.Here’s an example of
    how that is done:![](Image00017.jpg)However, what if you have multiple lines of
    code that you want the browser to ignore? Does that mean you need to put comment
    marks in front of every single one of them? The answer is no. There is another
    version of comments in JavaScript called multiline comments and they span multiple
    lines of code as the name implies.Take a look at the following example:![](Image00018.jpg)The
    multiline comment tags are /* … */” and anything you place in between them will
    be ignored by the browser. The only rule that you need to remember about multiline
    comments is that you can’t nest them inside one another.For example, this one
    is not allowed:/*  /* this is a nested comment  */*/alert ( ''The example above
    is not allowed'' );If you put these lines of code and try to make a browser interpret
    them it will produce an error message like “Syntax Error: Unexpected token” or
    something like that.Pop QuizQuestions:'
