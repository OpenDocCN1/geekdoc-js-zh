    现在不用担心所有这些术语。随着 JavaScript 编程课程的进行，你以后会学习它们。在学习不同章节时，我们会逐步处理相关的术语。


    ## 动态变量类型


    你还记得数学中的变量吗？具体来说我指的是代数。简单回顾一下：变量是持有或包含一个值的东西。例如，我们有时会赋值 `x = 10`。变量 `x` 包含一个整数值。整数是一个不包含小数部分的数字——例如
    `0.5` 或 `0.75`。


    所以，在这个例子中，`x` 只包含 `10` 这一值——完全没有小数点。一旦你给变量 `x` 赋值了其他内容，它就会改变。所以，假设我们给 `x` 加上 `0.5`，它就会变成一个实数，因为它的值变成了
    `10.5`。


    在某些编程语言中，例如 `Pascal`、`Basic`、`C` 或 `C++`，如果你给变量指定了一个特定的类型（例如，根据我们之前的解释的整数），那么该变量只能包含整数。


    如果你在过程中尝试更改它，程序将会产生错误并失败。这意味着如果你将值 `10` 赋值给变量 `x`，那么这个变量不能包含任何分数或小数部分。


    你必须为实数创建一个不同的变量，这在许多静态编程语言中都是如此。


    但 JavaScript 则不然。你可以在代码开头分配 `10`，稍后加上 `0.3`，这不会产生任何问题。这被称为**动态类型**。这是一种处理变量的方便方法，并且当计算机、手机或其他设备运行你的程序时减少运行时错误。


    ## 不是严厉的老师


    正如你目前所见，JavaScript 并不是我们所说那种“严格”的编程语言。其他语言中常见的限制性规则在这里都被消除了。这允许编程初学者在编程时犯下常见的“错误”。


    你可以专注于编程的基础概念，而无需担心许多关于程序结构的规则，即代码的某部分应该放在哪里或者哪个东西应该放在哪里。


    它对初非常友好，这就是为什么 JavaScript 是想要学习网页编程的初者的绝佳选择。


    **注意**：请注意 JavaScript 与 `Java` 是两种不同的编程语言。它们听起来一样，而且命名约定是非常糟糕的做法，但我们对此无能为力。每个人只能接受事实。只需记住我们正在学习的是
    JavaScript，而不是名为 `Java` 的另一种全功能计算机编程语言。


    ## 客户端语言


    这种脚本语言也被称为客户端语言。这意味着它的许多功能都是为了计算机用户的利益。相比之下，服务器端语言更关注网站后台发生的情况——特别是包含这些网站的服务器上。世界上还有其他的客户端和服务器端语言。


    在 JavaScript 的情况下，这种编程语言通常用于改进网站与访问网站的用户之间的交互。你用这种语言编写程序代码将使事情更具互动性。


    这就是为什么它除了网站之外还被用于其他地方。它被用于移动应用开发和游戏。你手机和其他移动设备上的应用和游戏需要交互性，而 JavaScript 是帮助你实现这一点的强大方式。


    ## 快速历史课


    让我们快速通过这部分，这样我们就可以进入实际的代码编写。以下是该编程语言历史的快速概述：


    * 它由 Brendan Eich 在 1995 年开发

    * 它最初被称为 LiveScript，但后来更名为 JavaScript

    * JavaScript 的许多语法取自或受 `C` 编程语言的影响

    * 今天，它已经发展到不仅可以在计算机上运行，你还会在许多嵌入式应用、浏览器应用程序、电视应用，当然还有移动应用中找到它


    如果你想深入研究这种编程语言的历史，你应该去其他来源查找。其他地方有大量的历史和语言发展信息。


    现在，让我们进入细节吧，好吗？

    第 2 章见。


    ## 第 2 章：编写你的第一个 JavaScript 程序


    在本章中，我们将学习并编写你的第一个 JavaScript 程序——或者多个程序，因为你将在本章末尾完成几个练习。在这里，你将学习一些基础但非常重要的概念。在本章中，我们将介绍编写和运行
    JavaScript 程序所需要的内容，以及 JavaScript 语法的前几个元素。


    ### 如何编写你的第一个 JavaScript 程序


    我总是说，学习新事物的最好方法就是直接投入并完成任务。这正是我们现在要做做的——让你编写你的第一个 JavaScript 程序并看看会发生什么。那么，运行
    JavaScript 程序需要什么？

    运行 JavaScript 需要两样东西，如下：


    1. 一个文本编辑器，如 `Atom`、`Sublime Text`、`Visual Studio Code` 和 `Notepad++`。

    2. 一个浏览器，如 `Chrome`、`Safari`、`Firefox` 和 `Microsoft Edge`。


