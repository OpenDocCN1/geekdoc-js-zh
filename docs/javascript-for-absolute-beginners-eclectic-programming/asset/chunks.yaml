    # Programming Exercises


    In this section, before we jump into chapter 2 of this book, you will learn a
    bit more of the interactive features that can be added to the web pages that you
    will build. Remember that we will only focus on the core of JavaScript and we
    will only mention HTML and also CSS in passing. We will keep the browser-specific
    commands to a bare minimum. This means we will not deal with features of this
    language such as documents, events, and interfaces. We may mention them in passing
    and provide some examples but we’re not going to focus on them.


    Remember that this book is about JavaScript basics for beginners. We focus only
    on the fundamental groundwork that you will need as someone new to programming
    in general. Going back to the subject of this subsection, we will go over a few
    more program examples that will show you the interactive features of this programming
    language.


    ## Inserting the <script> Tag and Pop-Ups


    Remember that you can insert your JavaScript code almost anywhere in an HTML code
    using the `<script>` tag. Enter the following code in Notepad++ and save it as
    HTML.


    ![](Image00010.jpg)


    You can name it any way you want. Open the HTML file using your browser. Notice
    that when you open it, you will see a pop-up with the message “This is a pop-up”.
    Click the OK button and then you will see some text displayed on your browser
    window.


    If you inspect the code that you wrote, the JavaScript code was inserted in between
    two HTML programming lines—the ones that say before the script and after the script
    (lines 6 and 12). This is just a demonstration of how you can insert JavaScript
    in between HTML. Notice, line 9 in our sample code has `alert` in it, which is
    a browser-specific command. We use that command to display text. Pay attention
    to its syntax. You can use single quotes or double quotes for the text that will
    be displayed.


    We will go over the rules on syntax in chapter 3 of this book.


    ## Changing HTML Content


    Here’s another interactive thing that you can do with JavaScript: change the content
    on a webpage. Create a new file on Notepad++ and enter the following code. Pay
    attention to the syntax for the button element. We will go over the elements of
    that element later. For now, we will focus on this feature of JavaScript.


    ![](Image00011.jpg)


    Save your work as an HTML file and use whatever name you want to. Open that file
    by double-clicking it and it will open up your default browser. Note that you
    will see the header at the top (i.e. the text in the `<h2>` tag). Underneath that
    is a line of text followed by a “click me” button. When you click the button,
    notice that the text is changed to the one specified on the button click.


    ## Changing the Style of HTML


    The HTML code that you write has certain styles. These styles show how the content
    of the web page will be presented to the site visitor. JavaScript can change the
    styles on how a page is presented.


    Here’s an example that you can try. Copy the following in a new document in Notepad++,
    save it as an HTML file, and open the document in your browser.


    ![](Image00012.jpg)


    Watch when you click the button. The font size of the text changes after you click
    it.


    ## Pop Quiz


    This is our first pop quiz. You will get a few more of these as we go along with
    the lessons in this book. The question will be provided here and you will find
    the answer on the next page.


    ### Task

    Create a web page document that will display the message “I’m JavaScript!” Use
    the information provided so far and also the tidbits from the examples that we
    have provided. Save your work as an HTML file and open your file in your browser.


    ### Answer to Pop Quiz

    ![](Image00013.jpg)


    # Chapter 3: Digging Into the Syntax


    We have gone through some of the basics about the syntax of JavaScript in the
    previous chapter. We will concentrate on that a little bit more in this chapter.
    Note that compared to a lot of other programming languages out there, the syntax
    used in this one is rather simple.


    When we say syntax, we are referring to the rules on how words and symbols are
    supposed to be arranged in JavaScript. If you form or arrange these linguistic
    elements correctly then the program code that you wrote will be interpreted correctly
    by the browser and it will perform exactly as you have instructed.


    However, if you made a mistake in the syntax, it will produce an error. The good
    news is that there are only a few syntactical rules that we need to cover. There
    are only five headings on syntax that you need to learn as a beginner, which includes
    the following:


    * Case sensitivity

    * White space

    * Identifiers

    * Literals

    * Comments

    * Semicolons

    '
