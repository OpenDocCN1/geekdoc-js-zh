    \ 中，有三种创建数组的方法：\n1. 数组字面量\n2. 直接（`new` 关键字）\n3. 数组构造函数\n\n### 1) 数组字面量\n\n双引号用于构建字符串字面量。以下是使用数组字面量创建数组的语法：\n\
    \n```javascript\nvar arrayname=[\"value1\",\"value2\"...valueN];\n```\n\n**示例**\n\
    \n```html\n<script>\n  var emp=[\"Sonoo\",\"Vimal\",\"Ratan\"];\n  for(i=0;i<emp.length;i++){\n\
    \    document.write(emp[i]+\"<br>\");\n  }\n</script>\n```\n**输出:**\nSonoo\nVimal\n\
    Ratan\n\n### 2) 直接创建数组\n\n`new` 关键字用于创建数组实例。以下是直接创建数组的语法：\n\n```javascript\nvar\
    \ arrayname=new Array();\n```\n\n**示例**\n\n```html\n<script>\n  var emp=new Array();\n\
    \  emp[0]=\"Arun\";\n  emp[1]=\"Varun\";\n  emp[2]=\"John\";\n  for(i=0;i<emp.length;i++){\n\
    \    document.write(emp[i]+\"<br>\");\n  }\n</script>\n```\n**输出:****\n\n### 3)\
    \ 数组构造函数\n\n为了不需要显式提供值，你必须通过向函数 `Array() { [native code] }` 传递参数来创建数组实例。\n\n```javascript\n\
    var emp=new Array(\"value1\",\"value2\",\"value3\");\n```\n\n**示例**\n\n```html\n\
    <script>\n  var emp=new Array(\"Jai\",\"Vijay\",\"Smith\");\n  for(i=0;i<emp.length;i++){\n\
    \    document.write(emp[i]+\"<br>\");\n  }\n</script>\n```\n**输出:**\nJai\nVijay\n\
    Smith\n\n## JavaScript 数组方法\n\n![](img/image00148.jpeg)\n![](img/image00149.jpeg)\n\
    ![](img/image00150.jpeg)\n![](img/image00151.jpeg)\n![](img/image00152.jpeg)\n\
    \n# JavaScript 字符串\n\nJavaScript 字符串是表示字符字符串的对象。在 JavaScript 中，有两种方法字符串：\n1. 字符串字面量\n\
    2. 字符串对象（使用 `new` 关键字）\n\n### 1) 字符串字面量\n\n双引号用于构建字符串字面量。以下是使用字符串字面量创建字符串的语法：\n\
    \n```javascript\nvar stringname=\"string value\";\n```\n\n**示例**\n\n```html\n\
    <script>\n  var str=\"This is string literal\";\n  document.write(str);\n</script>\n\
    ```\n**输出:**\nThis is string literal\n\n### 2) 字符串对象（使用 `new` 关键字）\n\n以下是使用 `new`\
    \ 关键字创建字符串对象的语法：\n\n```javascript\nvar stringname=new String(\"string literal\"\
    );\n```\n\n**示例**\n\n```html\n<script>\n  var stringname=new String(\"hello javascript\
    \ string\");\n  document.write(stringname);\n</script>\n```\n**输出:**\nhello javascript\
    \ string\n\n## JavaScript 字符串方法\n\n![](img/image00153.jpeg)\n![](img/image00154.jpeg)\n\
    ![](img/image00155.jpeg)\n\n# JavaScript Date 对象\n\n你可以使用 JavaScript Date 对象获取年份、月份和日期。JavaScript\
