    # JavaScript Switch


    The JavaScript switch statement is used to combine numerous expressions into a
    single code. It''s the same as the else if statement we learnt on the previous
    page. It is, however, more useful than if..else..if because it may be used with
    integers, characters, and other variables.


    The JavaScript switch statement''s signature is shown below.


    1.  switch(expression){  


