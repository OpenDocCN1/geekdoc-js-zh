    # JavaScript 编码与 JavaScript 练习

    零基础入门教程

    快速学习编程的循步指南

    J NEWMAN


    ## 学习 JavaScript


    JavaScript 是一种轻量级、跨平台的基于对象的脚本语言。


    JavaScript 是一种翻译型语言，而不是编译型语言。JavaScript 解析器（内置在浏览器中）负责为网络浏览器翻译 JavaScript 代码。


    JavaScript (`js`) 是一种轻量级的面向对象的编程语言，被许多网站用于编写网页。


    当应用于 HTML 文档时，它是一种解释型的、功能齐全编程语言，能够实现网站的动态交互。它首次发布于 1995 年，允许用户在 Netscape Navigator
    浏览器的网页中添加程序。


    从那时起，所有其他图形浏览器都接纳了它。用户可以使用 JavaScript 创建现代 Web 应用，实现实时交互，而无需每次都重新加载页面。`Js` 用于标准网站以提供各种交互性和简易性。另一方面，JavaScript
    与 Java 语言没有关系。


    ## JavaScript 的特性


    由于内置了环境，所有流行的网络浏览器都支持 JavaScript。


    JavaScript 的语法和结构基于 C 语言语言。因此它归类为结构化编程语言。JavaScript 是一种弱类型语言，对某些类型具有隐式转换（取决于操作）。JavaScript
    是一种通过原型而非类进行继承的面向对象的编程语言。它是一种简单的解释型语言。该语言区分大小写。JavaScript 支持 Windows、macOS 和 Linux
    在内的多种操作系统。它赋予了用户对浏览器的完全控制。


    ![](img/image0126.jpeg)


    ### JavaScript 示例

    ```javascript

    <script>

    document.write("Hello by JavaScript");

    </script>

    ```


    # JavaScript 注释


    JavaScript 注释是传递信息的有效手段。它用于包含代码相关信息，例如警告或建议，以便终端用户理解。内置在浏览器中的 JavaScript 引擎忽略注释。


    #### 优点 - JavaScript 注释


    为了使其更易理解，它可以用于解释代码以便让终端用户理解。为了避免编写不必要的代码，它还可以防止代码运行。我们有时会添加代码来执行某些操作，但过一段时间后可能需要禁用这些代码。在这种情况下，利用注释是更好的。


    ## JavaScript 注释 - 类型


    1. 单行注释

    2. 多行注释


    ### 单行注释


    双斜杠 (`//`) 用于指示此类注释。在语句之前之后使用它都是适当的。让我们来看单行注释的示例，即放置在语句之前的注释。


    ```javascript

    <script>

    //这是单行注释

    document.write("javascript");

    </script>

    ```


    示例

    ```javascript

    <script>

    var a=10;

    var b=20;

    var c=a+b;//加上 a 和 b 的值

    document.write(c);//打印 10 和 20 的和

    </script>

    ```


    ### 多行注释


    它可以用于创建单行和多行注释。因此它更实用。它的符号是正斜杠后跟星号，然后是另一个正斜杠。它可能出现在语句之前、之后或中间。


    ```javascript

    <script>

    /*这是多行注释。

    这些内容不会被显示*/

    document.write("example of javascript multiline comment");

    </script>

    ```


    # JavaScript 变量


    JavaScript 变量仅仅是存储位置的名称。在 JavaScript 中，有两种变量：局部变量和全局变量。在声明 JavaScript 变量时，有一些需要遵循的指南（也称为标识符）。


    名称必须以字母（a 到 z 或 A 到 Z）、下划线 (`_`) 或美元符号 (`$`)开头。我们可以在初始字母后放置数字（0 到 9），例如 `value1`。JavaScript
    中的变量区分大小写，所以 `x` 和 `X` 是两个独立的变量。


    ## 正确的 JavaScript 变量

    ```javascript

    var x = 10;

    var _value="sonoo";

    ```


    ## 错误的 JavaScript 变量

    ```javascript

    var 123=30;

    var *aa=320;

    ```


    ### 示例 - JavaScript 变量

    ```javascript

    <script>

    var x = 10;

    var y = 20;

    var z=x+y;

    document.write(z);

    </script>

    ```

    #### 输出

    30


    ## JavaScript 局部变量


    JavaScript 中的局部变量在块或函数内部。只能从函数或块内部访问。考虑以下场景：


    ```javascript

    <script>

    function abc(){

    var x=10;//局部变量

    }

    </script>

    ```

    或者，

    ```javascript

    <script>

    If(10<13){

    var y=20;//JavaScript 局部变量

    }

    </script>

    ```


    ## JavaScript 全局变量


    JavaScript 中的全局变量可以从任何函数访问。全局变量是在函数外部或使用 window 对象声明的变量。考虑以下场景：


    ```javascript

    <script>

    var data=200;//全局变量

    function a(){

    document.writeln(data);

    }

    function b(){

    document.writeln(data);

    }

    a();//调用 JavaScript 函数

    b();

    </script>

    ```


