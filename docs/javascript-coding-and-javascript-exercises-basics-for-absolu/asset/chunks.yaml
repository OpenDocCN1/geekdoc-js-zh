  trans: "\n\nJavaScript 中的全局变量是在函数外部声明的，或者通过 `window` 对象声明。你可以从任何函数访问它。\n\n让我们来看一个简单的全局变量\
    \ JavaScript 示例。\n\n```javascript\n<script>  \n  var value=50;//全局变量  \n  function\
    \ a(){  \n  alert(value);  \n  }  \n  function b(){  \n  alert(value);  \n  }\
    \  \n</script>\n```\n\n### 在 JavaScript 函数内部声明全局变量\n\n你必须利用 `window` 对象在函数内部声明\
    \ JavaScript 全局变量。考虑以下场景：\n\n1.  `window.value=90;`\n\n现在它可以在任何函数内部声明，并从任何函数内部访问。考虑以下场景：\n\
    \n```javascript\nfunction m(){  \n  window.value=100;//通过 window 对象声明全局变量  \n\
    }  \nfunction n(){  \n  alert(window.value);//从其他函数访问全局变量  \n} \n```\n\n### 在\
    \ JavaScript 中，全局变量的内部机制\n\n当你在函数外部声明变量时，它会被添加到 `window` 对象中。你也可以使用 `window` 对象来访问它。考虑以下场景：\n\
    \n```javascript\nvar value=50;  \nfunction a(){  \n  alert(window.value);//访问全局变量\
    \  \n} \n```\n\n# JavaScript 数据类型\n\nJavaScript 提供了不同的数据类型来存储各种类型的值。在 JavaScript\
    \ 中，有两种数据类型。\n\n1. 原始数据类型（Primitive data type）\n2. 非原始（引用）数据类型\n\nJavaScript 是一种动态类型语言，这意味着你不需要指定变量的类型，因为\
    \ JavaScript 引擎动态地使用它。要指定数据类型，必须使用 `var`。它可以存储任何类型的值，包括数字、字符串等。考虑以下场景：\n\n```javascript\n\
    var a=40;//存储数字  \nvar b=\"Rahul\";//存储字符串  \n```\n\n![](img/image00127.jpeg)\n\
    ![](img/image00128.jpeg)\n\n# JavaScript 运算符\n\nJavaScript 中的运算符是用于对操作数执行操作的符号。考虑以下场景：\n\
    \n```javascript\nvar sum=10+20;  \n```\n\n在这里，`+` 是算术运算符\n\n而 `=` 是赋值运算符。\n\n\
    JavaScript 中运算符的类型。\n\n1. 算术运算符\n2. 比较（关系）运算符\n3. 位运算符\n4. 逻辑运算符\n5. 赋值运算符\n6.\
    \ 特殊运算符\n\n## JavaScript 算术运算符\n\n为了对操作数进行算术操作，使用了算术运算符。JavaScript 算术运算符是下面列出的运算符。\n\
    \n![](img/image00129.jpeg)\n\n## JavaScript 比较运算符\n\nJavaScript 中的比较运算符比较两个操作数。以下是比较运算符：\n\
    \n![](img/image00130.jpeg)\n\n## JavaScript 位运算符\n\n在操作数上，位运算符执行按位操作。以下是位运算符：\n\
    \n![](img/image00131.jpeg)\n\n## JavaScript 逻辑运算符\n\nJavaScript 逻辑运算符是下面列出的运算符。\n\
    \n![](img/image00132.jpeg)\n\n## JavaScript 赋值运算符\n\n![](img/image00133.jpeg)\n\
    \n## JavaScript 特殊运算符\n\n![](img/image00134.jpeg)\n\n# JavaScript If-else\n\n\
    ![](img/image00135.jpeg)\n\n### JavaScript If 语句\n\n只有当 if 表达式为真时，它才会评估内容。JavaScript\
    \ 中的 `if` 语句具有以下签名。\n\n```javascript\nif(expression){  \n//要评估的内容  \n}  \n```\n\
    \n![](img/image00136.jpeg)\n\n示例\n\n```javascript\n<script>  \n  var a=20;  \n\
    \  if(a>10){  \n  document.write(\"value of a is greater than 10\");  \n  }  \n\
    </script>\n```\n输出\nvalue of a is greater than 10\n\n### JavaScript If...else\
    \ 语句\n\n它通过评估内容来确定条件是真是假。JavaScript 中 `if-else` 语句的语法所示：\n\n```javascript\nif(expression){\
    \  \n//如果条件为真，则评估的内容  \n}  \nelse{  \n//如果条件为假，则评估的内容  \n}  \n```\n\n![](img/image00137.jpeg)\n\
    示例\n\n```javascript\n<script>  \n  var a=20;  \n  if(a%2==0){  \n  document.write(\"\
    a is even number\");  \n  }  \n  else{  \n  document.write(\"a is odd number\"\
    );  \n  }  \n</script>\n```\n输出\na is even\n\n### If...else 语句 – 在 Javascript\
    \ 中\n\n当一个或多个表达式为真时，它会分析内容。JavaScript 中的 `else if` 语句具有以下签名。\n\n```javascript\n\
    if(expression1){  \n//如果 expression1 为真，则评估的内容  \n}  \nelse if(expression2){ \
    \ \n//如果 expression2 为真，则评估的内容  \n}  \nelse if(expression3){  \n//如果 expression3\
    \ 为真，则评估的内容  \n}  \nelse{  \n// 如果没有表达式为真，则评估的内容  \n}  \n```\n\n示例\n\n```javascript\n\
    <script>  \n  var a=20;  \n  if(a==10){  \n  document.write(\"a is equal to 10\"\
    );  \n  }  \n  else if(a==15){  \n  document.write(\"a is equal to 15\");  \n\
    \  }  \n  else if(a==20){  \n  document.write(\"a is equal to 20\");  \n  }  \n\
    \  else{  \n  document.write(\"a is not equal to 10, 15 or 20\");  \n  }  \n</script>\n\
    ```\n输出\na is equal to 20\n\n# JavaScript Switch\n\n`switch` 语句用于将多个表达式组合到一起代码中。它与我们在上一页学过的\
    \ `else if` 语句相同。然而，它比 `if..else..if` 更用，因为它可以用于整数、字符和其他变量。\n\n`switch` 语句的签名所示：\n\
    \n```javascript\nswitch(expression){  \n  case value1:  \n  要执行的代码;  \n  break;\
    \  \n  case value2:  \n  要执行的代码;  \n  break;  \n  ......\n  default:  \n  如果上述值都不匹配，则执行的代码；\
    \  \n}  \n```\n\n简单示例 - switch 语句 - javascript。\n\n```javascript\n<script>  \n\
    \  var grade='B';  \n  var result;  \n  switch(grade){  \n    case 'A': result=\"\
    A Grade\";  \n    break;  \n    case 'B': result=\"B Grade\";  \n    break;  \n\
    \    case 'C': result=\"C Grade\";  \n    break;  \n    default:  \n    result=\"\
    No Grade\";  \n  }  \n  document.write(result);  \n</script>\n```\n输出\nB Grade\n\
    \nswitch 语句的行为\n\n```javascript\n<script>  \n  var grade='B';  \n  var result;\
    \  \n  switch(grade){  \n    case 'A':  \n    result+=\"A Grade\";  \n    case\
    \ 'B':  \n    result+=\"B Grade\";  \n    case 'C':  \n    result+=\"C Grade\"\
    ;  \n    default:  \n    result+=\"No Grade\";  \n  }  \n  document.write(result);\
    \  \n</script>\n```\n输出\nundefined B Grade No Grade\n\n# JavaScript 循环\n\n`for`、`while`、`do\
    \ while` 和 `for-in` 循环用于在 JavaScript 中迭代代码段。它减少了代码的大小。它们最出现在数组中。\n\n1. for 循环\n\
    2. while 循环\n3. do-while 循环\n4. for-in 循环\n\n## 1) JavaScript For 循环\n\nJavaScript\
    \ 中的 `for` 循环按照指定的次数迭代组件。如果迭代次数已知，则应该使用它。`for` 循环的语法所示：\n\n```javascript\nfor(initialization;\
    \ condition; increment) {  \n  要执行的代码  \n} \n```\n\n示例\n\n```javascript\n<script>\
    \  \n  for (i=1; i<=5; i++) {  \n  document.write(i + \"<br/>\")  \n  }  \n</script>\n\
    ```\n输出：\n1\n2\n3\n4\n5\n\n## 2) JavaScript while 循环\n\nJavaScript 中的 `while`\
    \ 循环无限次迭代组件。如果迭代次数未知，则应该使用它。`while` 循环的语法所示：\n\n```javascript\nwhile(condition)\
    \ {  \n  要执行的代码  \n} \n```\n\n示例\n\n```javascript\n<script>  \n  var i=11;  \n\
    \  while (i<=15) {  \n  document.write(i + \"<br/>\");  \n  i++;  \n  }  \n</script>\n\
    ```\n输出\n11\n12\n13\n14\n15\n\n## 3) Do while 循环\n\nJavaScript `do while` 循环与\
    \ `while` 循环一样，无限迭代元素。无论条件是真是假，代码都至少执行一次。以下是 `do while` 循环的语法：\n\n```javascript\n\
    do{\n  要执行的代码\n} \n```\n\n"
- fmt: "\n```javascript\n}while (condition);\n```\n\n### EXAMPLE\n\n```html\n<script>\n\
    \  var i=21;\n  do{\n    document.write(i + \"<br/>\");\n    i++;\n  }while (i<=25);\n\
    </script>\n```\n\n**Output:**\n21\n22\n23\n24\n25\n\n## 4) JavaScript for in loop\n\
    \nThe JavaScript `for in` loop is used to cycle through an object's properties.\n\
    \n# JavaScript Functions\n\nTo conduct operations, JavaScript functions are needed.\
    \ To reuse the code, we can call the JavaScript function many times.\n\n### Benefits\
    \ of Using JavaScript\n\nJavaScript functions have primarily two advantages:\n\
    \n- **Reusability of code**: Because we can call a function multiple times, we\
    \ can save time coding.\n- **Less coding**: Less coding means our program is more\
    \ compact. To accomplish a common task, we don't need to write many lines of code\
    \ each time.\n\n## JavaScript Function Syntax\n\n```javascript\nfunction functionName([arg1,\
    \ arg2, ...argN]){\n  //code to be executed\n}\n```\n\n### EXAMPLE\n\n```html\n\
    <script>\n  function msg(){\n    alert(\"hello! this is message\");\n  }\n</script>\n\
    <input type=\"button\" onclick=\"msg()\" value=\"call function\"/>\n```\n\n##\
    \ JavaScript Function Arguments\n\n```html\n<script>\n  function getcube(number){\n\
    \    alert(number*number*number);\n  }\n</script>\n<form>\n  <input type=\"button\"\
    \ value=\"click\" onclick=\"getcube(4)\"/>\n</form>\n```\n\n## Function with Return\
    \ Value\n\nWe can use a function that returns a value in our program by calling\
    \ it. Let's look at a function that returns a value as an example.\n\n```html\n\
    <script>\n  function getInfo(){\n    return \"hello javatpoint! How r u?\";\n\
    \  }\n</script>\n<script>\n  document.write(getInfo());\n</script>\n```\n\n**OUTPUT**\n\
    hello javatpoint! How r u?\n\n## JavaScript Function Object\n\nThe `Function Object()\
    \ { [native code] }` in JavaScript is used to generate a new `Function` object.\
    \ It runs the code on a global scale. When we call the function `Object() { [native\
    \ code] }` directly, however, a function is constructed dynamically but insecurely.\n\
    \n### Syntax\n\n```javascript\nnew Function ([arg1[, arg2[, ....argn]],] functionBody)\n\
    ```\n\n![](Images/image00138.jpeg)\n![](Images/image00139.jpeg)\n\n## JavaScript\
    \ Function Object\n\n### Example\n\n```html\n<script>\n  var add=new Function(\"\
