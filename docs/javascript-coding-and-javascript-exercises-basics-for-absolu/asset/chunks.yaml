    ![](Images/image00160.jpeg)\n\n### JavaScript Date Example\n\n1. Current Date\
    \ and Time: <span id=\"txt\"></span>\n\n2. <script>\n```javascript\nvar today=new\
    \ Date();\ndocument.getElementById('txt').innerHTML=today;\n```\n</script>\n\n\
