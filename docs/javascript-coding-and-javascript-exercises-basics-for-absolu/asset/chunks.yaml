- fmt: "\nTo generate a date object, you can use a variety of `Date` constructors.\
    \ It has methods for retrieving and setting the day, month, year, hour, minute,\
    \ and second.\n\n## Constructor\n\n4 variant of `Date` constructor:\n\n1. `Date()`\n\
    2. `Date(milliseconds)`\n3. `Date(dateString)`\n4. `Date(year, month, day, hours,\
