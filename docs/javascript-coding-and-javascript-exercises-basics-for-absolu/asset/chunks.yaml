    # JAVCRIPT CODING AND JAVASCRIPT EXERCISES

    BASICS FOR ABSOLUTE BEGINNERS

    STEP BY STEP GUIDE TO LEARN CODING QUICKLY

    J NEWMAN


    ## Learn JavaScript


    JavaScript is a lightweight, cross-platform object-based scripting language.


    JavaScript is a translated language, not a compiled language. The JavaScript Translator
    (which is built within the browser) is in charge of translating JavaScript code
    for web browsers.


    JavaScript (`js`) is a lightweight object-oriented programming language that is
    used to script webpages by a number of websites.


    When applied to an HTML document, it is an interpreted, full-featured programming
    language that enables dynamic interactivity on websites. It was first released
    in 1995 to allow users to add programs to webpages in the Netscape Navigator browser.


    Since then, all other graphical web browsers have embraced it. Users can use JavaScript
    to create modern web applications that interact immediately without having to
    reload the page every time. `Js` is used on a standard website to provide many
    sorts of interactivity and simplicity. JavaScript, on the other hand, has no connection
    to the Java language.


    ## Features of JavaScript


    Because they have built-in environments, all popular web browsers support JavaScript.


    The grammar and structure of JavaScript are based on the C programming language.
    As a result, it is classified as structured programming language. JavaScript is
    weakly typed language with implicit casting of certain types (depending on the
    operation). JavaScript is an object-oriented programming language that inherits
    through prototypes rather than classes. It''s a simple and interpretable language.
    The language is case-sensitive. JavaScript is compatible with a variety of operating
    systems, including Windows, macOS, and Linux. It gives consumers complete control
    over their browsers.


    ![](Images/image0126.jpeg)


    ### JavaScript Example

    ```javascript

    <script>

    document.write("Hello by JavaScript");

    </script>

    ```


    # JavaScript Comment


    JavaScript comments are an effective means of conveying information. It''s used
    to include code-related information, such as warnings or suggestions, so that
    the end user can understand it. The JavaScript engine, which is incorporated in
    the browser, ignores the comment.


    #### Advantages - JavaScript comments


    To make more understandable it can be used to explain the code so that the end
    user can understand it. To avoid having to write unneeded code it can also be
    used to prevent the code from running. We sometimes add code to do a certain action.
    However, the code may need to be disabled after some time. It is preferable to
    utilise comments in this situation.


    ## JavaScript Comments - Types


    1. Single-line Comment

    2. Multi-line Comment


    ### Single line Comment


    Double slashes (`//`) are used to indicate it. It''s appropriate to use it both
    before and after the sentence. Let''s look at an example of a single-line comment,
    which is one that is placed before the statement.


    ```javascript

    <script>

    //is single line comment

    document.write("javascript");

    </script>

    ```


    EXAMPLE

    ```javascript

    <script>

    var a=10;

    var b=20;

    var c=a+b;//adds values of a and b

    document.write(c);//prints sum of 10 and 20

    </script>

    ```


    ### Multi line Comment


    It can be used to create both single and multi-line comments. As result it is
    more practical. It''s symbolised by a forward slash followed by an asterisk, then
    another forward slash. It might appear before, after, or in the middle of a statement.


    ```javascript

    <script>

    /*is multi line comment.

    It will not be displayed*/

    document.write("example of javascript multiline comment");

    </script>

    ```


    # JavaScript Variable


    A JavaScript variable is nothing more than a storage location''s name. In JavaScript,
    there are two sorts of variables: local variables and global variables. When declaring
    a JavaScript variable, there are some guidelines to follow (also known as identifiers).


    A letter (a to z or A to Z), underscore (`_`), or dollar (`$`) sign must begin
    the name. We can put numerals (0 to 9) after the initial letter, for example `value1`.
    Variables in JavaScript are case sensitive, so `x` and `X` are two separate variables.


    ## Correct JavaScript variables

    ```javascript

    var x = 10;

    var _value="sonoo";

    ```


    ## Incorrect JavaScript variables

    ```javascript

    var 123=30;

    var *aa=320;

    ```


    ### Example - JavaScript variable

    ```javascript

    <script>

    var x = 10;

    var y = 20;

    var z=x+y;

    document.write(z);

    </script>

    ```

    #### Output

    30


    ## JavaScript local variable


    A local variable in JavaScript is declared within a block or function. It can
    only be accessed from within the function or block. Consider the following scenario:


    ```javascript

    <script>

    function abc(){

    var x=10;//local variable

    }

    </script>

    ```

    Or,

    ```javascript

    <script>

    If(10<13){

    var y=20;//JavaScript local variable

    }

    </script>

    ```


    ## JavaScript global variable


    A global variable in JavaScript can be accessed from any function. A global variable
    is one that is declared outside of the function or with the window object. Consider
    the following scenario:


    ```javascript

    <script>

    var data=200;//gloabal variable

    function a(){

    document.writeln(data);

    }

    function b(){

    document.writeln(data);

    }

    a();//calling JavaScript function

    b();

    </script>

    ```

