    \ Time)\n\nEXAMPLE 2\n\n1. <script>\n```javascript\nvar date=new Date();\nvar\
    \ day=date.getDate();\nvar month=date.getMonth()+1;\nvar year=date.getFullYear();\n\
    document.write(\"<br>Date is: \"+day+\"/\"+month+\"/\"+year);\n```\n</script>\n\
    \n### JavaScript Current Time Example\n\n1. Current Time: <span id=\"txt\"></span>\n\
    \n2. <script>\n```javascript\nvar today=new Date();\nvar h=today.getHours();\n\
    var m=today.getMinutes();\nvar s=today.getSeconds();\ndocument.getElementById('txt').innerHTML=h+\"\
    :\"+m+\":\"+s;\n```\n</script>\n\n### Digital Clock Example\n\nLet's look at a\
    \ simple example of using the JavaScript date object to display a digital clock.\n\
    \nIn JavaScript, you can specify interval using the `setTimeout()` or `setInterval()`\
    \ methods.\n\nEXAMPLE\n\n1. Current Time: <span id=\"txt\"></span>\n\n2. <script>\n\
    ```javascript\nwindow.onload=function(){getTime()}\nfunction getTime(){\n  var\
    \ today=new Date();\n  var h=today.getHours();\n  var m=today.getMinutes();\n\
    \  var s=today.getSeconds();\n  // add a zero in front of numbers<10\n  m=checkTime(m);\n\
