    \ to 20\");  \n  }  \n  else{  \n  document.write(\"a is not equal to 10, 15 or\
    \ 20\");  \n  }  \n</script>\n```\nOUTPUT\na is equal to 20\n\n# JavaScript Switch\n\
    \nThe `switch` statement is used to combine numerous expressions into a single\
    \ code. It's the same as `else if` statement we learnt on the previous page. It\
    \ is, however, more useful than `if..else..if` because it may be used with integers,\
    \ characters, and other variables.\n\nThe `switch` statement's signature is shown\
    \ below.\n\n```javascript\nswitch(expression){  \n  case value1:  \n  code to\
    \ be executed;  \n  break;  \n  case value2:  \n  code to be executed;  \n  break;\
    \  \n  ......\n  default:  \n  code to be executed if above values are not matched;\
    \  \n}  \n```\n\nSimple example - switch statement - javascript.\n\n```javascript\n\
    <script>  \n  var grade='B';  \n  var result;  \n  switch(grade){  \n    case\
    \ 'A': result=\"A Grade\";  \n    break;  \n    case 'B': result=\"B Grade\";\
    \  \n    break;  \n    case 'C': result=\"C Grade\";  \n    break;  \n    default:\
    \  \n    result=\"No Grade\";  \n  }  \n  document.write(result);  \n</script>\n\
    ```\nOUTPUT\nB Grade\n\nBehaviour of switch statement\n\n```javascript\n<script>\
    \  \n  var grade='B';  \n  var result;  \n  switch(grade){  \n    case 'A':  \n\
    \    result+=\"A Grade\";  \n    case 'B':  \n    result+=\"B Grade\";  \n   \
    \ case 'C':  \n    result+=\"C Grade\";  \n    default:  \n    result+=\"No Grade\"\
    ;  \n  }  \n  document.write(result);  \n</script>\n```\nOUTPUT\nundefined B Grade\
    \ No Grade\n\n# JavaScript Loops\n\nThe `for`, `while`, `do while`, and `for-in`\
    \ loops are used to iterate the piece of code in JavaScript. It reduces the size\
    \ of the code. It's most commonly found in arrays.\n\n1. for loop\n2. while loop\n\
    3. do-while loop\n4. for-in loop\n\n## 1) JavaScript For loop\n\nThe `for` loop\
    \ in JavaScript iterates the components for a set number of times. If the number\
    \ of iterations is known, it should be used. The `for` loop's syntax is seen below.\n\
    \n```javascript\nfor(initialization; condition; increment) {  \n  code to be executed\
    \  \n} \n```\n\nEXAMPLE\n\n```javascript\n<script>  \n  for (i=1; i<=5; i++) {\
    \  \n  document.write(i + \"<br/>\")  \n  }  \n</script>\n```\nOutput:\n1\n2\n\
    3\n4\n5\n\n## 2) JavaScript while loop\n\nThe `while` loop in JavaScript iterates\
    \ the components an infinite amount of times. If the number of iterations is unknown,\
    \ it should be utilised. The `while` loop's syntax is seen below.\n\n```javascript\n\
    while(condition) {  \n  code to be executed  \n} \n```\n\nEXAMPLE\n\n```javascript\n\
    <script>  \n  var i=11;  \n  while (i<=15) {  \n  document.write(i + \"<br/>\"\
    );  \n  i++;  \n  }  \n</script>\n```\nOutput:\n11\n12\n13\n14\n15\n\n## 3) Do\
    \ while loop\n\nThe JavaScript `do while` loop, like the `while` loop, iterates\
    \ the elements indefinitely. Regardless of whether the condition is true or false,\
    \ the code is performed at least once. The following is the syntax for the `do\
    \ while` loop.\n\n```javascript\ndo{\n  code to be executed\n} \n```\n"
