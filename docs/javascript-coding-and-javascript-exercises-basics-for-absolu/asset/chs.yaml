  \n# JavaScript Date 对象\n\n你可以使用 JavaScript Date 对象获取年份、月份和日期。JavaScript Date 对象可以在网页上显示计时器。\n\
  \n\n\n\n要生成日期对象（date object），你可以使用多种 `Date` 构造函数。它具有获取和设置日、月、年、小时、分钟和秒的方法。\n\n##\
  \ 构造函数\n\n4 种 `Date` 构造函数的变体：\n\n1. `Date()`\n2. `Date(milliseconds)`\n3. `Date(dateString)`\n\
  4. `Date(year, month, day, hours, minutes, seconds, milliseconds)`\n\n## JavaScript\
  \ Date 方法\n\n![](img/image00156.jpeg)\n![](img/image00157.jpeg)\n![](img/image00158.jpeg)\n\
  ![](img/image00159.jpeg)\n![](img/image00160.jpeg)\n\n### JavaScript Date \n\n1.\
  \ 当前日期和时间：<span id=\"txt\"></span>\n\n2. <script>\n```javascript\nvar today=new\
  \ Date();\ndocument.getElementById('txt').innerHTML=today;\n```\n</script>\n\n输出\n\
  \nCurrent Date and Time: Sat Feb 12 2022 23:47:52 GMT+0530 (India Standard Time)\n\
  \n示例 2\n\n1. <script>\n```javascript\nvar date=new Date();\nvar day=date.getDate();\n\
  var month=date.getMonth()+1;\nvar year=date.getFullYear();\ndocument.write(\"<br>Date\
  \ is: \"+day+\"/\"+month+\"/\"+year);\n```\n</script>\n\n### JavaScript 当前时间示例\n\
  \n1. 当前时间：<span id=\"txt\"></span>\n\n2. <script>\n```javascript\nvar today=new\
  \ Date();\nvar h=today.getHours();\nvar m=today.getMinutes();\nvar s=today.getSeconds();\n\
  document.getElementById('txt').innerHTML=h+\":\"+m+\":\"+s;\n```\n</script>\n\n\
  ### 数字钟示例\n\n让我们来看一个使用 JavaScript 日期对象显示数字钟的简单示例。\n\n在 JavaScript 中，你可以使用 `setTimeout()`\
  \ 或 `setInterval()` 方法指定间隔时间。\n\n示例\n\n1. 当前时间：<span id=\"txt\"></span>\n\n2. <script>\n\
  ```javascript\nwindow.onload=function(){getTime()}\nfunction getTime(){\n  var today=new\
  \ Date();\n  var h=today.getHours();\n  var m=today.getMinutes();\n  var s=today.getSeconds();\n\
  \  // 在数字小于 10 时前面加一个零\n  m=checkTime(m);\n  s=checkTime(s);\n  document.getElementById('txt').innerHTML=h+\"\
  :\"+m+\":\"+s;\n  setTimeout(function(){getTime()},1000);\n}\n//setInterval(\"getTime()\"\
  ,1000);//另一种方法\nfunction checkTime(i){\n  if (i<10){\n    i=\"0\" + i;\n  }\n  return\
  \ i;\n}\n```\n</script>\n\n### JavaScript Math\n\n为了进行数学运算，JavaScript `math` 对象提供了各种常量和方法。与日期对象不同，它没有构造函数。\n\
