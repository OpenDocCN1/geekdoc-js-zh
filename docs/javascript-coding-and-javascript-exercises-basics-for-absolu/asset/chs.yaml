  ```\n</script>\n\n输出：\n\n3 的 4 次方是：81\n\n### Math.floor(n)\n\n`math.floor(n)` 方法返回数的最小整数。例如，3.7\
  \ 返回 3，5.9 返回 5，以此类推。\n\n1. 4.6 的向下取整是：<span id=\"p4\"></span>\n\n2. <script>\n\
  ```javascript\ndocument.getElementById('p4').innerHTML=Math.floor(4.6);\n```\n</script>\n\
  \n输出：\n\n4.6 的向下取整是：4\n\n### Math.ceil(n)\n\nJavaScript 中的 `math.ceil(n)` 方法返回给定值的最大整数。例如，3.7\
  \ 返回 4，5.9 返回 6，以此类推。\n\n1. 4.6 的向上取整是：<span id=\"p5\"></span>\n\n2. <script>\n\
  ```javascript\ndocument.getElementById('p5').innerHTML=Math.ceil(4.6);\n```\n</script>\n\
  \n输出：\n\n4.6 的向上取整是：5\n\n### Math.round(n)\n\nJavaScript 中的数学运算。`round(n)` 方法为提供的数字提供最近的舍入整数。如果小数部分等于或大于\
  \ 0.5，则赋值为较大的值 1；否则，赋值为较小的值 0。例如，3.7 返回 4，3.3 返回 3，5.9 返回 6，以此类推。\n\n1. 4.3 的四舍五入是：<span\
  \ id=\"p6\"></span>\n2. 4.7 的四舍五入是：<span id=\"p7\"></span>\n\n3. <script>\n```javascript\n\
  document.getElementById('p6').innerHTML=Math.round(4.3);\ndocument.getElementById('p7').innerHTML=Math.round(4.7);\n\
  ```\n</script>\n\n输出：\n\n4.3 的四舍五入是：4\n4.7 的四舍五入是：5\n\n### JavaScript Number\n\n\
  `Number` 对象表示整数或浮点数。它用于转换和解析字符串表达式。`Number()` 构造函数返回指定参数的数值。如果参数无法转换为数字，则返回 `NaN`。\n\
  \n`isNaN()` 方法判断值是否为 `NaN`。`Number.isFinite()` 方法判断值是否为有限数字。`Number.isInteger()`\
  \ 方法判断值是否为整数。`Number.parseInt()` 和 `Number.parseFloat()` 方法分别将字符串解析为整数和浮点数。\n\n\
  `Number.toString()` 方法返回数字的字符串表示。`Number.toFixed()` 方法返回带有小数点后指定数字数的数字字符串。\n\n`Number.prototype.toPrecision()`\
  \ 和 `toExponential()` 方法用于格式化数字。`Number.MAX_VALUE` 和 `Number.MIN_VALUE` 常量代表最大和最小的数值。`Number.MAX_SAFE_INTEGER`\
  \ 和 `Number.MIN_SAFE_INTEGER` 常量代表安全整数的范围。\n\n`Number.PI` 常量提供圆周长与直径比的值。`Number.E`\
  \ 常量提供欧数的值。\n\n`Number.Object()` 用于创建 `Number` 对象。`Number.from()` 用于从数组或迭代对象创建数字。`Number.reverse()`\
  \ 用于反转数组。`Number.sort()` 用于排序数组。`Number.map()` 用于映射数组。`Number.filter()` 用于过滤数组。`Number.reduce()`\
  \ 用于归约数组到单个值。`Number.find()` 用于查找数组元素。`Number.findIndex()` 用于查找数组元素的索引。`Number.some()`\
  \ 用于检查数组是否至少有一个元素通过测试。`Number.every()` 用于检查数组是否所有元素都通过测试。`Number.slice()` 用于提取数组部分。`Number.splice()`\
  \ 用于修改数组。`Number.push()` 用于向数组添加元素。`Number.pop()` 用于移除最后一个元素。`Number.shift()` 用于移除第一个元素。`Number.unshift()`\
  \ 用于在数组开头添加元素。`Number.concat()` 用于合并数组。`Number.join()` 用于将数组连接成字符串。\n\n（注：原文后续部分存在大量重复的描述，翻译时已根据要求进行处理并保留核心逻辑）\n\
