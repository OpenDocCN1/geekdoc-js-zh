- "# JavaScript 精通：JavaScript 编程学习初学者指南\n\n\n\n![](img/cover.jpg)\n\n![img](img/cover.jpg)\n\
  \n\n\n\n\n\n\n## 引言\nJavaScript 是一种遵循 ECMAScript 规范的卓越且解释密的编程语言。配合 HTML 和 CSS，JavaScript\
  \ 是万维网的重要技术之一。JavaScript 促进了交互式网页的，是 Web 应用的重要组成部分。几乎每个网站都使用了 JavaScript，并且所有的主流浏览器都包含\
  \ JavaScript 引擎以便正常运行。Brendan Eich 在 1995 年任职 Netscape Communications 时开发了 JavaScript。JavaScript\
  \ 辅助函数式、事件驱动、基于原型和面向对象的编程风格。JavaScript 通过确认用户在客户端执行的操作来升级 Web 用户界面。您可以将 JavaScript\
  \ 引擎插入不同类型的主机软件中，包括数据库、Web 服务器以及与 Web 无相关的程序（如文字处理器）。\n\n本书将进一步解释 JavaScript 的概念，旨在帮助您在没有压力的情况下学习和理解\
  \ JavaScript 语言。学习 JavaScript 需要 HTML 知识、文本编辑器、浏览器以及 CSS。要开始学习过程，必要的工具之一是文本编辑器，它是编写代码必需的。您还需要浏览器。\n\
  \n## 第一章：什么是 JavaScript\nJavaScript 简称 `JS`，是一种由所有主流浏览器引入并采用的高级编程语言。JavaScript 可以通过添加滑块、弹出窗口等特殊效果来创建交互式网页。CSS\
  \ 则决定了背景颜色、类型、字体大小等。\n\n### 客户端 JavaScript\n客户端 JavaScript 是 JavaScript 的常见形式。脚本必须插入\
  \ HTML 文档或由其引用，以便浏览器解释代码。它允许网页动态地包含交互式内容。用户在提交表单以及判断所有输入是否有效时会使用 JavaScript 代码。\n\
  \n### JavaScript 的优势\n* 通过 JavaScript，用户可以在页面发送到服务器之前对输入进行组织，这自动减轻了服务器的负载。\n* JavaScript\
  \ 能够对页面做出快速响应。在访问者查看输入是否有错误之前，页面无需重新加载。\n* JavaScript 用于构建活动界面，当鼠标悬停在上面时会产生反应。\n\
  \n### JavaScript 的局限性\nJavaScript 编程语言缺乏以下基本功能：\n* 出于考虑，客户端 JavaScript 不读取或写入文件\n\
  * 用于网络应用程序的 JavaScript\n* JavaScript 不具备多处理器能力。\n\n### JavaScript 开发工具\n您不需要昂贵的开发工具来编写\
  \ JavaScript。您可以使用简单的文本编辑器编写，例如 Microsoft FrontPage、Adobe Dreamweaver MX、Adobe HomeSite\
  \ 5 等。\n\n### JavaScript 的位置\nJavaScript 代码可以插入到 HTML 文档的任何位置。但是，您可能想像这样在 HTML 文件中插入\
  \ JavaScript 代码：\n\n```html\n<head>\n  <script></script>\n</head>\n<body>\n  <script></script>\n\
  </body>\n```\n\n在 `<head>` 部分包含外部文件脚本：\n```html\n<head>\n  <script src=\"filename.js\"\
  ></script>\n</head>\n```\n\n## JavaScript 章节\n\n\n\n\n\n在某些情况下，当你想让脚本在任何特殊事件上运行（例如点击按钮时的操作）时，你可以像下面这样将脚本放置在\
  \ `head` 部分：\n\n```html\n<html>\n<head>\n<script type=\"text/JavaScript\">\n<!--\n\
  function sayHi() {\n  alert(\"Hello World\")\n}\n//-->\n</script>\n</head>\n<body>\n\
  \  点击此处获取结果\n  <input type=\"button\" onclick=\"sayHi()\" value=\"Say Hi\" />\n\
  </body>\n</html>\n```\n\n### 在 `<body>...</</body>` 区域中使用 JavaScript\n\n有时，你希望脚本立即运行并在内容页面上创建一个脚本，将脚本插入到\
  \ `<body>` 区域内。代码应该像这样：\n\n```html\n<html>\n<head>\n</head>\n<body>\n<script type=\"\
  text/JavaScript\">\n<!--\ndocument.write(\"Hello World\")\n//-->\n</script>\n<p>这是一个网页正文内容</p>\n\
  </body>\n</html>\n```\n\n### 在 `<head>` 和 `<body>` 区域中使用 JavaScript\n\n像下面所示，将你的\
  \ JavaScript 代码插入到 `<head>` 和 `<body>` 区域：\n\n```html\n<html>\n<head>\n<script type=\"\
  text/JavaScript\">\n<!--\nfunction sayHi() {\n  alert(\"Hello World\")\n}\n//-->\n\
  </script>\n</head>\n<body>\n<script type=\"text/JavaScript\">\n<!--\ndocument.write(\"\
  Hello World\")\n//-->\n</script>\n<input type=\"button\" onclick=\"sayHi()\" value=\"\
  Say Hi\" />\n</body>\n</html>\n```\n\n### 在外部文件中使用 JavaScript\n\n为了避免重复相同的 JavaScript\
  \ 代码，该语言允许你创建一个外部文件并存储 JavaScript 代码，然后将外部文件集成到 HTML 文件中。下面的示例了如何利用 `script` 标签和\
  \ `src` 属性在 HTML 代码中集成外部 JavaScript 文件。\n\n```html\n<html>\n<head>\n<script type=\"\
  text/javascript\" src=\"filename.js\"></script>\n</head>\n<body>\n  .......\n</body>\n\
  </html>\n```\n\n外部文件源文件应以 `.js` 扩展名保存。\n\n### 总结\n\n在第一章中，我们解释了 JavaScript 的起源以及将其放在内部和外部文件中。我们讨论了使用\
  \ JavaScript 构建交互式 Web 应用程序，以便在无需每个操作都重新加载页面的情况下执行适当的操作。\n\n### 练习\n\n如何在 HTML 文档中将\
  \ JavaScript 代码插入到 head、body 并包含外部文件脚本？\n\n### 答案\n\nhead 部分脚本为 `<head></head>`。\n\
  body 部分脚本为 `<body></body>`。\nbody 内部的脚本为 `<body></body>` 和 `<head></head>`。\n在 `<head>...</head>`\
  \ 中包含外部文件脚本使用 `script` 标签。\n\n---\n\n## 第 2 章：值、类型和运算符\n\n在计算机世界中存在数据。你可以创建新数据、读取数据和更改数据，这些数据都存储为一系列连续位（bits）的形式。将位定义为代表强或弱信号、以及计算机内部高或低电荷的\
  \ 0 和 1。所有数据和信息片段都被描述为 0 和 1 的序列，并用位表示。\n\n### 值\n\n深呼吸，想象一片比特位的海洋。最新的 PC 数据存储中包含超过\
  \ 300 亿个位。我们使用位来创建值。计算机能够正常运行是因为每个位信息都被拆分成了值。每个值都由一个影响其角色的类型组成，值可以是数字、文本或函数等。要生成一个值，你需要调用它的名称，它会从存储的地方出现。\n\
  \n### 算术\n\n算术是处理数字的主要方式。多个数字的乘、加、减以产生另一个数字称为算术运算。这是它们在 JavaScript 中样子的示例：\n\n```\n\
  100 + 4 * 11\n```\n\n`+` 和 `*` 符号被称为运算符，第一个表示加法而另一个表示乘法。插入两个值之间的运算符将产生另一个值。`-` 运算符用于减法，`/`\
  \ 运算符用于除法。如果运算符在没有括号的情况下一起出现，运算符的优先级决定它们的应用方式。如果几个具有相同优先级的运算符相邻显示，例如 `1-2+1`，它们从左到右应用：`(1\
  \ - 2) + 1`。\n\n### 特殊数字\n\nJavaScript 包含三个独特的值，它们的行为不像数字但被视为数字。`Infinity` 和 `-Infinity`\
  \ 是前两个，表示正无穷和负无穷，最后一个值是 `NaN`。`NaN` 表示“不是一个数字”（not a number），尽管它是一个 Number 类型的值。\n\
  \n### 字符串\n\n字符串是数字的序列。字符串是下一个数据类型，它们代表文本。字符串将其内容限制在引号中。\n\n```\n`沿着走道路径.`\n\"在屋顶上。\"\
  \n'我在家里。'\n```\n\n使用不同类型的引号（如双引号、单引号或反引号）来标记字符串。引号必须匹配至关重要。引号内的元素由 JavaScript 创建一个字符串值。JavaScript\
  \ 使用 Unicode 标准为每个需要的字符分配数字，包括阿拉伯语、亚美尼亚语、日语等。你不能对字符串进行减法、乘法或除法，但你可以使用 `+` 运算符，它不会相加而是将两个字符串拼接。拼接意味着将字符串粘在一起。\n\
  \n### 一元运算符\n\n符号并不代表所有的运算符。你可以用单词写某些运算符。一个清晰的例子是一种运算符，这种运算符根据其所附值的 `typeof` 名称来创建一个字符串值。\n\
  \n```\nconsole.log(typeof 4.5)\n// → A number\n\nconsole.log(typeof \"x\")\n// →\
  \ A string\n```\n\n第二个显示的运算符被称为二进制运算符，因为它们使用两个值，而使用一个值的运算符是一元运算符。\n\n```\nconsole.log(-(10\
  \ - 2))\n// → -8\n```\n\n### 布尔值\n\n布尔是一种仅在两种可能性之间区别的值，例如“开启”和“关闭”等。布尔只包含真（true）和假（false）。\n\
  \n### 比较\n\n比较是创建布尔值的方法：\n\n```\nconsole.log(3 > 2)\n// → true\n\nconsole.log(3\
  \ < 2)\n// → false\n```\n\n`>` 和 `<` 字符分别代表“大于”和“小于”的符号。你可以在布尔值中使用二进制运算符来确定包含的值是真还是假。\n\
  \n你可以以相同的方式比较字符串。\n\n```\nconsole.log(\"Aardvark\" < \"Zoroaster\")\n// → true\n\
  ```\n\n你可以按照字母顺序指示字符串，大写字母通常“小于”小写字母，所以 \"Z\" < \"a\"，而且排序中也存在非字母字符。当 JavaScript\
  \ 想要比较字符串时，它从左到右识别字符，逐个区分 Unicode 代码。\n\n以下是其他相关的运算符 `<=`, `>=`, `==` 和 `!=`。\n\n\
  ```\nconsole.log(\"Itchy\" != \"Scratchy\")\n// → true\n\nconsole.log(\"Apple\"\
  \ == \"Orange\")\n// → false\n```\n\n在 JavaScript 中，只有一个值不等于它自己，即 `NaN`（“不是数字”）。\n\
  \n```\nconsole.log(NaN == NaN)\n// → false\n```\n\n### 逻辑运算符\n\n\n\n\n\n`Boolean.values()`，它们分别是“与”（and）、“或”（or）和“与非”（and\
  \ not）。`&&` 运算符表示逻辑“与”，其结果取决于输入的值是 `true` 还是 `false`。\n\n```javascript\nconsole.log(true\
  \ && false)\n// → false\n```\n\n```javascript\nconsole.log(true && true)\n// → true\n\
  ```\n\n`||` 运算符表示逻辑“或”。如果给定的值为 `true`，则该运算符输出 `true`。\n\n```javascript\nconsole.log(false\
  \ || true)\n// → true\n```\n\n```javascript\nconsole.log(false || false)\n// → false\n\
  ```\n\n感叹号 `!` 表示“非”（Not）。它是一个反转设定值的运算符，它将 `true` 变为 `false`，将 `false` 变为 `true`。\n\
  \n`||`  own 所有运算符中优先级最低的，然后是 `&&`、比较运算符（`>`、`==` 等）等。下面的示例说明括号是必要的：\n\n```\n1 +\
  \ 1 == 2 && 10 * 10 > 50\n```\n\n空值\n\n`Null` 和 `undefined` 是仅两种用于指示重要值不存在的特殊值类型。它们包含零数据。\n\
  \n### 自动类型转换\n\n早些时候提到 JavaScript 几乎接受所有给程序，包括具有异常行为的程序。自动类型转换在以下表达式中体现：\n\n```javascript\n\
  console.log(8 * null)\n// → 0\n```\n\n```javascript\nconsole.log(\"5\" - 1)\n//\
  \ → 4\n```\n\n```javascript\nconsole.log(\"5\" + 1)\n// → 51\n```\n\n```javascript\n\
  console.log(\"five\" * 2)\n// → NaN\n```\n\n```javascript\nconsole.log(false ==\
  \ 0)\n// → true\n```\n\n当你给运算符分配错误的值时，JavaScript 会使用类型转换规则静地将该值转换为它所需的精确类型。在第一个表达式中，`null`\
  \ 变为 `0`，而第二个表达式中的 `5` 保持为 `5`（从字符串变为数字）。在第三个表达式中，在数字加法之前存在字符串拼接，这把 `1` 转换为 `\"\
  1\"`（从数字变为字符串）。当像 `\"five\"` 或 `undefined` 这样的奇数变为数字时，它会得到 `NaN` 值。如果你想使用 `==` 区分相同类型的值，如果值除\
  \ `NaN` 外相似，则输出应该是 `true`。如果你想测试一个值是否包含真实值，请使用 `==`（或 `!=`）运算符进行比较。为了避免意外的类型转换，请使用三字符比较运算符。\n\
  \n### 逻辑运算符的短路\n\n`&&` 和 `||` 被称为逻辑运算符。它们用于以特定方式持有多种类型的值。它们将左侧的值转换为 `Boolean` 类型以决定，尽管这取决于运算符和生成结果的类型，但始终会返回左侧或右侧的值。`||`\
  \ 运算符在可以转换为 `true` 时返回左侧的值，并将返回右侧的值。\n\n```javascript\nconsole.log(null || \"user\"\
  )\n// → user\n```\n\n```javascript\nconsole.log(\"Kate\" || \"user\")\n// → Kate\n\
  ```\n\n此函数用于将值返回到其默认值，并放在空值中作为替换。字符串和数字到布尔值的转换规则表明，`0`、`NaN` 和空字符串 `(\"\")` 被视为\
  \ `false`，而其他值为 `true`。因此 `0 || -1` 输出 `-1`，`\"\" || \"!?\"` 产生 `\"!?\"`。`&&` 运算符的操作相同，但方向相反。当左侧的值可以转换为\
  \ `false` 时，返回该值，或者将值传递到右侧。两个运算符仅在需要时才评估右侧的值。例如，我们设置如下值 `true || AX`，`AX` 的值将是 `true`\
  \ 而不会考虑它。同样的规则适用于 `false && AX`，`AX` 为 `false` 并会被忽略。你可以将此过程称为短路求值。\n\n### 总结\n\n\
  本章介绍了 JavaScript 的四种值类型：字符串、数字、`undefined` 值和布尔值（Booleans）。这些值通过插入它们的名称作为 `true`、`null`\
  \ 或值（`(13, \"ABC\")`）来产生。运算符可以整合并改变值。我们查看了用于术的二元运算符（`+`、`-`、`*`、`/`、`%`）、字符串拼接（`+`）、比较（`==`、`!=`、`===`、`!==`、`<`、`>`、`<=`、`>=`）、逻辑（`&&`、`||`），以及各种一元运算符（`-`\
  \ 用于数值、`!` 用于逻辑取反，以及 `typeof` 用于查找值的类型）和一个三元运算符（`?:`），根据第三个值选择两个值中的一个。你将获得足够的信息来像小计算器一样使用\
  \ JavaScript，并在后续章节中不断提高。\n\n### 练习\n\n编写一个 JavaScript 练习，通过用户定义的名称构建变量。\n\n###\
  \ 答案\n\n![00193.jpg](img/00193.jpeg)\n\n## 第 3 章：程序结构\n\n我们将开始扩展 JavaScript 语言命令，不仅是句子片段和名词。\n\
  \n## 表达式与语句\n\n产生值的代码块被称为表达式（expression）。单个值精确地写为 `22`，或者心理分析也被称为表达式。二元运算符中设置为两个表达式的表达式或括号内的表达式都是表达式。表达式可以像人类语言翻译一样适应其他表达式。它使我们能够开发出任意复杂计算的表达式。当一个表达式类似于句子片段时，JavaScript\
  \ 语句将完成该句子。语句列表被称为程序，最易访问的语句类型是以分号结尾的一行代码。\n\n例如：\n\n```javascript\n1;\n!false;\n\
  ```\n\n通过此功能，语句可以独立存在，并且可以添加一个偶尔更改屏幕颜色的特性，或修改机器的内部状态以影响其后的语句。\n\n## 绑定（Bindings）\n\
  \nJavaScript 使用变量绑定来持有值，例如：\n\n```javascript\nlet money = 5 * 5;\n```\n\n`let` 是一个语句关键字，它意味着该句子将指定一个绑定，同时绑定名称和值可以使用\
  \ `=` 运算符和表达式来关联。使用定义的绑定作为表达式，即一个包含绑定值的表达式。下面是一个示例：\n\n```javascript\nlet ten =\
  \ 10;\nconsole.log(ten * Aten); \n// → 100\n```\n\n`=` 运算符用于现有绑定，将绑定从设定值中移除并将其指向新值。\n\
  \n```javascript\nlet mood = \"light\";\nconsole.log(mood);\n// → light\n```\n\n\
  ```javascript\nmood = \"dark\";\nconsole.log(mood);\n// → dark\n```\n\n定义一个未赋值的绑定将导致无物可持有。因此，请求绑定的值会产生\
  \ `undefined` 值。你可以通过由逗号分隔的单一语句定义多个绑定。\n\n```javascript\nlet one = 1, two = 2;\n\
  console.log(one + two);\n// → 3\n```\n\n使用 `var` 和 `const` 单词来熟悉地开发绑定：\n\n```javascript\n\
  var name = \"Ayad\";\nconst greeting = \"Hello\";\nconsole.log(greeting + name);\n\
  // → Hello Ayad\n```\n\n`const` 单词意味着常量。它描述了一个绝对绑定，在其生命周期内指向其设定值。这些单词通常用于声明一个名称对应一个值，以便以后方便引用。\n\
  \n\n\n\n\n尽管像 `const`，`class`,`default`,`break`,`continue`,`delete`,`do`,`else`,`any`,`word`,\
  \ `can`, `be`,`called`, `binding`, `name`, `also`, `consist`, `of`, `digits`,`but`,\
  \ `not`, `begin`, `statement`, `with`, `figure` 等某些单词包含了美元符号 `$`、下划线 `_` 或任何特殊字符或标点符号。\n\
  \n## 环境\n\n在特定时刻存在的绑定和值被称为环境。当你启动程序时，环境持有一个语言标准，并通常包含与系统环境产生交互的绑定。例如，浏览器带有可以与启动的网站通信，以及读取键盘和鼠标输入的函数。\n\
  \n## 函数\n\n封装在值中的一段程序代码称为函数，这些值被添加以启动被封装的程序。例如，一个为用户输入显示小对话框的函数。\n\n```javascript\n\
  prompt(\"Enter a passcode\");\n```\n\n执行函数的过程被称为调用（calling）、唤起（invoking）或应用（applying）。调用函数是通过在提供函数值的表达式后插入括号来实现的。括号中的值传递给函数内的程序。定义的值被设置为函数的参数。\n\
  \n### console.log 函数\n\n在上面的示例中，我们使用 `console.log` 来输出值。所有主流浏览器都利用 `console.log`\
  \ 函数将其参数输出到输出文本的设备。在现代浏览器中，输出通常位于 JavaScript 的 `console` 中，默认是不可见的；你可以点击键盘上的 `F12`\
  \ 命令，或者 Mac 上的 `command-option-I`。绑定名不容纳字符，但 `console.log` 可以，因为它是从 `console` 绑定值中声明\
  \ `log` 属性的表达式。\n\n###返回值\n\n函数用于产生副作用。它们也可以提供不需要副作用的值。例如，`Calculate.max` 函数将接收一组数字参数，并返回最大值。\n\
  \n```javascript\nconsole.log(Calculate.max(2, 4));\n// → 4\n```\n\nJavaScript 将任何提供值的视为表达式，这使得函数调用可以附加到实质性的表达式中。让我们调用\
  \ `Calculate.min`，它是 `Calculate.max` 的直接相反：\n\n```javascript\nconsole.log(Math.min(2,\
  \ 4) + 100);\n// → 102\n```\n\n## 控制流\n\n当程序中有多个语句时，它们以故事的形式从代码的开始到结束执行。这种类型的程序由两种语句组成：第一个向用户索要数字，而第二个显示数字的平方并在第一个之后立即执行。\n\
  \n```javascript\nlet Number = Number(prompt(\"Select A Digit\"));\nconsole.log(\"\
  Your Digit is the square root of \" + Number * Number);\n```\n\n一个值通过 `number` 函数转换为数字并输出字符串值。\
  \ \n\n### 条件执行\n\n键盘用于在 JavaScript 中开发条件执行。你可能希望某些代码在 `if` 且*仅当*特定条件为真时执行。让我们在输入是数字时才显示其平方。\n\
  \n```javascript\nlet theNumber = Number(prompt(\"Select A Digit\"));\n\nif (!Number.isNaN(theNumber))\
  \ {\n  console.log(\"Your Digit is the square root of \" +\n  theNumber * theNumber);\n\
  }\n```\n\n`if` 关键字根据布尔表达式的值来执行或规避一个语句。括号内键盘后的类型决定表达式，伴随着要完成的语句。\n\n`Number.isNaN`\
  \ 函数是一个高级 JavaScript 函数，只有当语句被声明为 `NaN` 时才输出 `true`。当赋值的字符串不是有效数字时，数字函数返回 `NaN`。`if`\
  \ 语句后的语句被包含在大括号 `{}` 中。大括号用于在单个语句内分类不同数量的语句。\n\n```javascript\nif (1 + 1 == 2) console.log(\"\
  It's true\");\n// → It's true\n```\n\n`else` 关键字可以与 `if` 语句一起使用，提供两种不同的执行路径。\n\n\
  ```javascript\nlet theNumber = Number(prompt(\"Select A Digit\"));\n\nif (!Number.isNaN(theNumber))\
  \ {\n  console.log(\"Your Digit is the square root of \" +\n  theNumber * theNumber);\n\
  } else {\n  console.log(\"Hey. Why didn't you give me a number?\");\n}\n```\n\n\
  如果有两个以上的路径可供，你可以“链式”多个 `if/else` 对。以下是一个示例：\n\n```javascript\nlet num = Number(prompt(\"\
  Pick A Number\"));\n\nif (num < 10) {\n  console.log(\"Small\");\n} else if (num\
  \ < 100) {\n  console.log(\"Medium\");\n} else {\n  console.log(\"Large\");\n}\n\
  ```\n\n程序确认 `num` 是否小于 10，如果是，它会选择该分支，然后显示 \"Small\"。如果 `num` 大于 10，它会选择 `else`\
  \ 分支，该分支包含它自己的第二个 `if` 语句。\n\n### while 和循环\n\n这是编写从 0 到 12 所有偶数的程序的方法。\n\n```javascript\n\
  console.log(0);\nconsole.log(2);\nconsole.log(4);\nconsole.log(6);\nconsole.log(8);\n\
  console.log(10);\nconsole.log(12);\n```\n\n多次运行代码代码的方式被称为循环。循环控制流允许用户返回到编写程序中的某些点，并根据程序的当前状态重新执行。将其与一个如下枚举的绑定集成：\n\
  \n```javascript\nlet number = 0;\n\nwhile (number <= 12) {\n  console.log(number);\n\
  \  number = number + 2;\n}\n// → 0\n// → 2\n// …等等\n```\n\n以 `while` 关键字开头并同时产生循环的语句。`while`\
  \ 关键字伴随着括号中的表达式，后面跟着一个类似于 `if` 语句的语句。循环持续持续直到表达式提供一个转换为布尔值后为 `true` 的值。循环每次重复时，数字变为其之前值的两倍。\n\
  \n让我们写一个评估并显示 $2^{10}$（2 的 10 次方）值的程序。我们将使用两个绑定：一个用于监控我们的结果，另一个用于计算 2 乘以结果的次数。\n\
  \n```javascript\nlet result = 1;\nlet counter = 0;\n\nwhile (counter < 10) {\n \
  \ result = result * 2;\n  counter = counter + 1;\n}\n\nconsole.log(result);\n//\
  \ → 1024\n```\n\n### for 循环\n\n许多循环遵循 `while` 循环模式，创建一个计数绑定来跟踪循环进度。然后带有测试表达式的 `while`\
  \ 循环检查计数器是否达到设定值。\n\n```javascript\nfor (let number = 0; number <= 10; number =\
  \ number + 4) {\n  console.log(number);\n}\n```\n\n\n\n\n\n括号内必须包含关键字后的两个分号，第一个分号之前的部分通过描述一个绑定来分离循环。另一部分是决定循环是否继续的语句。以下是使用\
  \ `for` 替替 `while` 来计算 `2¹⁰` 的代码：\n\n```javascript\nlet result = 1;\n\nfor (let\
  \ counter = 0; counter < 10; counter = counter + 1) {\n  result = result * 2;\n\
  }\n\nconsole.log(result);\n```\n// → 1024\n\n### 跳出循环\n\n除了让循环条件变为 `false` 之外，还有其他其他方法可以结束循环。`break`\
  \ 可以影响跳出受限循环。`break` 语句会执行此程序，直到找到第一个大于等于 `20` 且能被 `7` 整除的数字。\n\n```javascript\n\
  for (let current = 20; current = current + 1; current++) {\n  if (current % 7 ==\
  \ 0) {\n    console.log(current);\n    break;\n  }\n}\n```\n// → 21\n\n`%` 运算符用于检查一个数字是否能被另一个数字整除。如果整除，则余数为零。示例中的\
  \ `for` 在循环结束时不会进行检查，这意味着直到循环内的 `break` 语句变为无限且不停止。\n\n### 简洁地更新绑定\n\n当你处于循环中时，程序会定期更新绑定以根据其上一个值存储一个值。\n\
  \n`counter = counter + 1;`\n\nJavaScript 提供了一种快捷方式。\n\n`counter += 1;`\n\n相关的快捷函数也适用于\
  \ `for` 的其他几个运算符，例如 `result *= 2` 用于乘以结果，或 `counter -= 1` 用于倒序计数。这使我们能够优化我们的计数示例。\n\
  \n```javascript\nfor (let number = 0; number <= 12; number += 2) {\n  console.log(number);\n\
  }\n```\n\n对于 `counter += 1` 和 `counter -= 1`，这里有更短的等价：\n\n`counter++` 和 `counter--`。\n\
  \n### 使用 switch 进行值分发\n\n使用 `switch` 对值进行分发可能如下：\n\n```javascript\nif (x == \"value1\"\
  ) {\n  action1();\n} else if (x == \"value2\") {\n  action2();\n} else if (x ==\
  \ \"value3\") {\n  action3();\n} else {\n  defaultAction();\n}\n```\n\n`switch`\
  \ 用于更直接地表达上述形式的分发。下面是一个很好的 get 例：\n\n```javascript\nswitch (prompt(\"天气是什么样的？\"\
  )) {\n  case \"rainy\":\n    console.log(\"别忘了带伞.\");\n    break;\n  case \"sunny\"\
  :\n    console.log(\"穿得轻便一点.\");\n  case \"cloudy\":\n    console.log(\"出去走。\");\n\
  \    break;\n  default:\n    console.log(\"天气类型未知！\");\n}\n```\n\n### 命名规范\n\n名称绑定不允许空格，但它支持使用多个单词来定义绑定值。当用不同单词绑定名称时，可以使用以下几种类型：\n\
  \n* `fuzzylittleturtle`\n* `fuzzy_little_turtle`\n* `FuzzyLittleTurtle`\n* `fuzzyLittleTurtle`\n\
  \n### 注释\n\n有时，原始代码并没有传递你想让程序发送给读者的每一条信息，或者以人们认为难以理解的方式传播信息。其他时候，你觉得应该给程序附带一些类似的想法，注释就发挥了这一功能。注释是程序中包含的一段文本，但计算机会忽略它。要编写单行注释，请使用双斜杠字符\
  \ `//`，后跟注释文本。\n\n```javascript\nlet accountBalance = calculateBalance(account);\n\
  // 它是芒果树上的黄橙色。accountBalance.adjust();\n// 捕捉我们家中的绿色的破布。let report = new Report();\n\
  // 日月交汇之处：addToReport(accountBalance, report);\n// 这是一条宽大的走廊，并且\n```\n\n`/* */`\
  \ 注释只出现在行的末尾。行内的任何注释都无所谓。\n\n### 总结\n\n现在你理解可以通过表达式创建语句。语句由 `if`、`else`、`switch`、`for`、`while`、`do`\
  \ 和 `return` 组成。函数用于组织代码、减少重复并将名称与其自身分离。每个函数都有自己的作用域。函数可以包含零参数或返回值。\n\n### 练习\n\n\
  编写一个接受两个整数的 JavaScript 程序。\n\n### 答案\n\n```javascript\nlet x = \"abc\";\nconsole.log(x.length);\n\
  ```\n\n\n\n\n```javascript\n// 可可见代码\n\nconsole.log(x + z);\n```\n\n# 40\n\n###\
  \ 嵌套作用域\n\nJavaScript 区分了全局和局部绑定（Bindings）。你可以在其他函数和块内部创建块和函数，从而产生多个级别的局部性。例如，这个函数产生了制作鹰嘴嘴酱（hummus）所需的组件，它内部又包含了另一个函数：\n\
  \n```javascript\nconst Hummus = function(factor) {\n  const ingredient = function(amount,\
  \ unit, name) {\n    let ingredientAmount = amount * factor;\n    if (ingredientAmount\
  \ > 1) {\n      unit += \"s\";\n    }\n    console.log(`${ingredientAmount}${unit}\
  \ ${name}`);\n  };\n  ingredient(1, \"can\", \"chickpeas\");\n  ingredient(0.25,\
  \ \"cup\", \"tahini\");\n  ingredient(0.25, \"cup\", \"lemon juice\");\n  ingredient(1,\
  \ \"clove\", \"garlic\");\n  ingredient(2, \"tablespoon\", \"olive oil\");\n  ingredient(0.5,\
  \ \"teaspoon\", \"cumin\");\n};\n```\n\n组件函数内部的代码可以访问外部函数的 `factor` 绑定。块内部可访问的绑定集合由该块的位置决定。每个局部作用域都可以访问其包含的局部作用域，每个作用域也可以访问全局作用域。这个概念被称为词法作用域（Lexical\
  \ Scoping）。\n\n### 函数作为值\n\n函数绑定通常作为特定代码块的名称。这种绑定一旦定义后就不会改变。函数可以用于任意表达式，也可以用于将函数值保存到新的绑定中。存储函数的绑定是一个系统绑定，并且可以分配新值：\n\
  \n```javascript\nlet launchMissiles = function() {\n  missileSystem.launch(\"now\"\
  );\n};\n\nif (safeMode) {\n  launchMissiles = function() {/* 什么都不做 */};\n}\n```\n\
  \n### 声明\n\n生成函数绑定的方法。当你在语句开头使用 `function` 关键字时，它的工作方式会有不同。\n\n```javascript\nfunction\
  \ square(x) {\n  return x * x;\n}\n```\n\n该语句描述了 `square` 绑定并将其指向指定的函数。这种类型的函数定义由一个精度组成。\n\
  \n```javascript\nconsole.log(\"我的想法告诉我每次:\", future());\n\nfunction future() {\n\
  \  return \"我会超越比尔·盖茨\";\n}\n```\n\n### 箭头函数\n\n函数包含第三种与其他形式不同的注解。你可以使用箭头 `=>` 作为\
  \ `function` 关键字的替代方案。箭头 `=>` 包含等号和大于符号。\n\n```javascript\nconst power = (base,\
  \ exponent) => {\n  let result = 1;\n  for (let count = 0; count < exponent; count++)\
  \ {\n    result *= base;\n  }\n  return result;\n};\n```\n\n如果你只有一个参数名，可以省略参数列表周围的括号。有时体可以是单个表达式而不是大括号块，从函数返回表达式。因此，`square`\
  \ 的定义执行相同的任务。\n\n```javascript\nconst square1 = (x) => {return x * x;};\nconst square2\
  \ = x => x * x;\n```\n\n当箭头函数没有参数时，其参数列表变为为空且无效的括号。\n\n```javascript\nconst horn\
  \ = () => {\n  console.log(\"Toot\");\n};\n```\n\n你不需要在语言中同时使用 `function` 表达式和箭头函数，它们提供了相同的操作。\n\
  \n## 调用栈\n\n让我们花点时间看看控制是如何通过函数的。下面是一个执行几次函数调用的简单程序：\n\n```javascript\nfunction greet(who)\
  \ {\n  console.log(\"Hello \" + who);\n}\ngreet(\"Harry\");\nconsole.log(\"Bye\"\
  );\n```\n\n`greetings` 调用影响控制跳转到函数的开头。`console.log` 调用完成其任务并夺回控制权，返回函数。\n\n\n\n\n\
  ```javascript\n} else {\n  return base * power(base, exponent - 1);\n}\n\nconsole.log(power(2,\
  \ 3));\n```\n\n### 递归\n\n这种执行方式存在问题。与其他循环版本相比，它更慢。使用单个循环被认为比多次调用函数成本更。虽然并不意味着递归是一个无效的循环选项，但有些问题通过递归比使用循环更容易解决。需要检查或处理多个分支的问题，请查看这里：我们从数字\
  \ `1` 开始，不断加上 `5` 或乘以 `3`。例如，数字 `13` 可以通过乘以 `3` 然后加两次 `5` 得到，因此我们无法得到 `15`。以下代码是递归解决方案：\n\
  \n```javascript\nfunction findSolution(target) {\n  function find(current, history)\
  \ {\n    if (current == target) {\n      return history;\n    } else if (current\
  \ > target) {\n      return null;\n    } else {\n      return find(current + 5,\
  \ `${history} + 5`) ||\n             find(current * 3, `${history} * 3`);\n    }\n\
  \  }\n  return find(1, \"1\");\n}\n\nconsole.log(findSolution(24));\n```\n\n`//\
  \ → (((1 * 3) + 5) * 3)`\n\n内部函数 `find` 接受两个参数：数字 `current` 和记录获取该数字过程的字符串。如果找到了解决方案，它会返回一个显示通往\
  \ `target` 路径的字符串；如果没有找到，返回值将是 `null`。为了实现这一点，函数执行三个动作中的一个。如果你的 `current` 数字等于 `target`，你可以通过返回的\
  \ `current` 历史记录获取它。有时数字会大于 `target`，你不需要探索这个选项，因为加法和减法只会增加数字，因此返回 `null`。如果你仍低于\
  \ `target` 数字，则会通过两次调用自身来开启两条路径，一个用于加法，另一个用于乘法。如果第一次调用返回了有效内容，很好；否则返回第二次调用，无论提供的是字符串还是\
  \ `null` 都没有关系。下面是函数如何产生效果的示例。此示例搜索数字 `13`：\n\n```\nfind(1, \"1\")\nfind(6, \"(1\
  \ + 5)\")\nfind(11, \"((1 + 5) + 5)\")\nfind(16, \"(((1 + 5) + 5) + 5)\")\nfind(33,\
  \ \"(((1 + 5) + 5) + 5) * 3)\")\nfind(18, \"((((1 + 5) + 5) + 5) * 3) - 5)\")\n\
  find(3, \"((((1 + 5) + 5) + 5) * 3) - 5) / 3)\")\nfind(8, \"((((((1 + 5) + 5) +\
  \ 5) * 3) - 5) / 3) + 5)\")\nfind(13, \"((((((1 + 5) + 5) + 5) * 3) - 5) / 3) +\
  \ 5) + 5)\")\n```\n\n找到了！缩进表示了栈中的所有发现。函数可以通过两种方式引入程序中。第一种是多次编写相似的代码，这可以在不重复编写的情况下实现更多功能，并留出自己的函数。你可以从命名函数并编写函数体开始。下面是一个示例。我们将编写一个产生两个数字的程序——农场上可用鸡的数量：\n\
  \n`7` 头牛\n`11` 只鸡\n\n```javascript\nfunction printInventory(cows, chickens) {\n\
  \  let cowString = String(cows);\n  while (cowString.length < 3) {\n    cowString\
  \ = \"0\" + cowString;\n  }\n  console.log(`${cowString} cows`);\n\n  let chickenString\
  \ = String(chickens);\n  while (chickenString.length < 3) {\n    chickenString =\
  \ \"0\" + chickenString;\n  }\n  console.log(`${chickenString} chickens`);\n}\n\n\
  printInventory(7, 11);\n```\n\n在字符串后写上长度决定了特定循环继续添加零，直到它们组成三个字符。这是一个更好的尝试：\n\n```javascript\n\
  function printZeroWithLabel(number, label) {\n  let numberString = String(number);\n\
  \  while (numberString.length < 3) {\n    numberString = \"0\" + numberString;\n\
  \  }\n  console.log(`${numberString} ${label}`);\n}\n\nfunction printInventory(cows,\
  \ chickens, pigs) {\n  printZeroWithLabel(cows, \"Cows\");\n  printZeroWithLabel(chickens,\
  \ \"Chickens\");\n  printZeroWithLabel(pigs, \"Pigs\");\n}\n\nprintInventory(7,\
  \ 1, 3);\n```\n\n与其提取程序中的重复部分，不如通过以下步骤提取出一个单独的概念：\n\n```javascript\nfunction zeroPad(number,\
  \ width) {\n  let string = String(number);\n  while (string.length < width) {\n\
  \    string = \"0\" + string;\n  }\n  return string;\n}\n\nfunction printInventory(cows,\
  \ chickens, pigs) {\n  console.log(`${zeroPad(cows, 3)} cows`);\n  console.log(`${zeroPad(chickens,\
  \ 3)} chickens`);\n  console.log(`${zeroPad(pigs, 3)} pigs`);\n}\n\nprintInventory(7,\
  \ 16, 3);\n```\n\n函数也可以用于打印对齐的数字。\n\n### 函数与效果\n\n函数可以包含效果并返回值。它们总是比产生效果的函数更容易集成值。纯函数是不依赖于任何效果的唯一值函数。例如，它不会识别具有变化值的全局绑定。它包含相同的参数。\n\
  \n### 总结\n\n在本章中，你现在理解了如何编写函数。通过了解如何编写 `function` 关键字以及何时使用表达式，你现在可以构建函数值。当你将函数作为语句时，它可以设置绑定并命名函数作为其值。你还可以使用箭头函数来构建函数。\n\
  \n```javascript\n// 定义 Af 为函数值\nconst Af = function(a) {\n  console.log(a + 2);\n\
  };\n\n// 声明 Ag 为函数\nfunction Ag(a, Ab) {\n  return a * Ab * 3.5;\n}\n\n// 否则更简洁的函数值\n\
  let Ah = a => a % 3;\n```\n\n理解函数的视角视角是作用域。每个块都会创建一个新的作用域。特定作用域内的参数和绑定是局部的，从外部可见。使用\
  \ `var` 设置的绑定表现不同，会导致全局范围。将程序执行的任务区分成不同的函数是重要的。你不需要经常重复自己，函数可以通过将代码分类为执行特定操作的片段来安排程序。\n\
  \n### 练习\n\n编写一个 JavaScript 程序来判断一个数字是否为偶数。\n\n### 答案\n\n\n\n\n\n如果你想处理大量的数字数据，你必须在机器内存中表示这些数字数据。例如，你需要表示一组类似于\
  \ `2`、`3`、`5`、`7` 和 `11` 的数字。现在让我们充分利用字符串，因为字符串可以包含大量数据。我们将使用 `2`、`3`、`5`、`7`、`11`\
  \ 作为表示。JavaScript 语言提供了一种用于存储值序列的独特类型，称为 `array`。我们将 `array` 写为方括号内的值列表 `list`，并用逗号分隔。\n\
  \n```javascript\nlet listOfNumbers = [2, 3, 5, 7, 11];\n\nconsole.log(listOfNumbers[2]);\n\
  \n// → 5\n\nconsole.log(listOfNumbers[0]);\n\n// → 2\n\nconsole.log(listOfNumbers[2]\
  \ - 1]);\n\n// → 3\n```\n\n用于获取 `array` 内部元素的符号也使用了方括号。一对完整的方括号紧跟在一个包含另一个表达式的表达式之后。当你开始数\
  \ `array` 中的元素个数时，从 0 开始而不是 1。因此，第一个元素被视为 `listOfNumbers[0]`。\n\n### 属性\n\n之前的章节包含过如\
  \ `myString` 的表达式。`length`（计算字符串长度）和 `Math.max`（最大值函数）。这些是可以用来访问属性属性的属性。几乎所有的 JavaScript\
  \ 值都包含属性。极少数不包含属性的值是 `null` 和 `undefined`。如果你对非值访问属性，结果将是一个错误。\n\n```javascript\n\
  null.length;\n\n// → TypeError: null has no properties\n```\n\n在 JavaScript 中，评估属性的两种主要方法是使用点号（.）和方括号。`value.x`\
  \ 和 `value[x]` 可以求值 `value` 上的属性，但并不特定是同一个属性。你使用 `x` 的方式与使用点号的方式不同。\n\n如果你想使用点号，你在点号后输入的文本是属性的名称。如果你打算使用方括号，则方括号内的表达式会被访问以获取属性名。`value.x`\
  \ 交付的是 `value` 中名为“x”的属性，而 `value[x]` 则访问表达式 `x` 并利用其结果，将其转换为字符串作为属性名。如果你想要获取的属性名为\
  \ `color`，你应该输入 `value.color`。你可以从绑定 `i` 调用的值中提取属性，输入 `value[i]`。属性的名称是字符串，但点表示法仅对有效的绑定名有效。因此，如果你想评估一个名为\
  \ `2` 或 `John Doe` 的属性，请使用方括号：`value[2]` 或 `value[\"John Doe\"]`。\n\n`array` 内的元素存储为\
  \ `array` 的属性，这些属性使用数字作为属性名。数组的 `length` 属性决定它包含多少项。该属性的名称是一个有效的绑定名。输入 `array.length`\
  \ 来确定 `array` 的长度，这比输入 `array[\"length\"]` 要简单得多。\n\n### 方法\n\n`string` 和 `array`\
  \ 对象包含了几个存储函数值的属性。\n\n```javascript\nlet doh = \"Doh\";\n\nconsole.log(typeof doh.toUpperCase);\n\
  \n// → function\n\nconsole.log(doh.toUpperCase());\n\n// → DOH\n```\n\n每个字符串都包含一个\
  \ `toUpperCase` 属性。当你调用此属性时，它会返回字符串的副本，其中包含的所有字母都转换为大写。尽管 `toUpperCase` 没有通过参数，但该函数可以求值字符串\
  \ \"Doh\"，它是我们上面调用的值的属性。由函数组成的属性被称为方法。下面的示例说明了两个可以影响数组的方法。\n\n```javascript\nlet\
  \ sequence = [1, 2, 3];\n\nsequence.push(4);\n\nsequence.push(5);\n\nconsole.log(sequence);\n\
  \n// → [1, 2, 3, 4, 5]\n\nconsole.log(sequence.pop());\n\n// → 5\n\nconsole.log(sequence);\n\
  \n// → [1, 2, 3, 4]\n```\n\n`push` 方法用于将值附加到 `array` 的末尾，而 `pop` 方法执行完全相反的操作。它移除\
  \ `array` 内的最后一个值并将其返回。这些是栈操作（stack operations）的代际术语。栈是一种数据布局，允许用户将值推入并以相反的方向将其弹出，以便新添加的值最先被移除。\n\
  \n### 对象\n\n你可以将一组日志记录表示为 `array`，尽管每个字符串条目都需要保存活动列表，以及一个指定 Jacques 是否变成了松鼠的布尔值。我们将这些分组为一个值，并将分组后的值放置在日志记录的\
  \ `array` 中。属性的任意集合是 `object` 类型的值。我们将使用大括号作为表达式来开发一个对象。\n\n```javascript\nlet day1\
  \ = {\n  squirrel: false,\n  events: [\"work\", \"touched tree\", \"pizza\", \"\
  running\"]\n};\n\nconsole.log(day1.squirrel);\n\n// → false\n\nconsole.log(day1.wolf);\n\
  \n// → undefined\n\nday1.wolf = false;\n\nconsole.log(day1.wolf);\n\n// → false\n\
  ```\n\n大括号包含由逗号分隔的属性列表。每个属性都包含一个名称、一个冒号和一个冒号。当你跨行编写对象时，确保你的缩进是良好的，因为它可以提高可读性。属性名可以是有效的数字。\n\
  \n```javascript\nlet descriptions = {\n  work: \"Went to a,\"\n  \"touched tree\"\
  : \"Touched tree.\"\n};\n```\n\n你可以在 JavaScript 中两种方式使用大括号。它可以用于语句的开头，也可以通过 `=`\
  \ 运算符为属性指定值。它替换属性值，如果它存在，则会创建一个新的。`delete` 运算符是一个一元运算符，用于删除对象的属性名。\n\n```javascript\n\
  let anObject = {left: 1, right: 2};\n\nconsole.log(anObject.left);\n\n// → 1\n\n\
  delete anObject.left;\n\nconsole.log(anObject.left);\n\n// → undefined\n\nconsole.log(\"\
  left\" in anObject);\n\n// → false\n\nconsole.log(\"right\" in anObject);\n\n//\
  \ → true\n```\n\n二进制操作 `in` 判断对象或字符串是否包含某个属性。将属性指定 `undefined` 与删除它的主要区别在于，对象不再拥有该属性，因此返回\
  \ `false`。确定对象中包含哪些属性并返回一个属性名称的字符串数组。\n\n```javascript\nconsole.log(Object.keys({x:\
  \ 0, y: 0, c: 2}));\n\n// → [\"x\", \"y\", \"c\"]\n```\n\n`Object.assign` 函数用于从一个对象复制属性到另一个对象。\n\
  \n```javascript\nlet objectA = {a: 1, b: 2};\n\nObject.assign(objectA, {b: 3, c:\
  \ 4});\n\nconsole.log(objectA);\n\n// → {a: 1, b: 3, c: 4}\n```\n\n`array` 是一种用于存储连续内容的独特对象。当你访问\
  \ `typeof []` 时，它提供 \"object\"。下面的示例代表 Jacques 存储为对象数组的日志。\n\n```javascript\nlet\
  \ journal = [\n  {\n    events: [\"work\", \"touched tree\", \"pizza\",\n    \"\
  running\", \"television\"],\n    squirrel: false\n  },\n  {\n    events: [\"work\"\
  , \"ice cream\", \"cauliflower\",\n    \"lasagna\", \"touched tree\", \"brushed\
  \ teeth\"],\n    squirrel: false\n  }\n];\n```\n\n\n\n\n\n```javascript\n{\n  events:\
  \ [\"weekend\", \"cycling\", \"break\", \"peanuts\", \"beer\"],\n  squirrel: true,\n\
  }\n/* Aand Aso Aon... A*/\n];\n```\n\n# 可变性\n\n我们讨论过不同的值，如 `Booleans`、`strings`\
  \ 和 `Numbers`，这些值的值很难改变，尽管它们可以通过组合来获取新的值。`Objects`（对象）与值不同，它允许属性改变；可以在不同的时间为单个对象值创建不同的内容。\n\
  \n当有两个数字 `120` 和 `120` 时，它们被认为是相同的，且将两个引用指向同一个对象与拥有两个包含相同属性的独立对象之间存在相似性。检查下面的代码：\n\
  \n```javascript\nlet object1 = {value: 10};\nlet object2 = object1;\nlet object3\
  \ = {value: 10};\n\nconsole.log(object1 == object2);\n// → true\n\nconsole.log(object1\
  \ == object3);\n// → false\n\nobject1.value = 15;\n\nconsole.log(object2.value);\n\
  // → 15\n\nconsole.log(object3.value);\n// → 10\n```\n\n`object1` 和 `object2` 绑定持有同一个对象，这就是为什么修改\
  \ `object1` 会影响 `object2` 的值。它们在本质上是相同的。绑定 `object3` 指向一个独立的对象，该对象包含与 `object1`\
  \ 类似的属性，但具有不同的生命。绑定可以是常量的也可以是变的，但这不会影响它们的值。`const` 绑定对象不能被转换，并且始终坚定地指向同一个对象。可以改变的是对象的内容。\n\
  \n```javascript\nconst score = {visitors: 0, home: 0};\n// 这是可以的\nscore.visitors\
  \ = 1;\n// 这是不允许的\nscore = {visitors: 1, home: 1};\n```\n\n当使用 JavaScript 的 `==`\
  \ 运算符来区分对象时，它使用身份来执行该任务。如果对象包含相同的值，它将返回 `true`。区分多个对象将返回 `false`，即使它们的属性是类似的。\n\n\
  # 狼人日志\n\n现在，你启动了 JavaScript 解释器，并创建了记录日记所需的环境。\n\n```javascript\nlet journal =\
  \ [];\nfunction addEntry(events, squirrel) {\n  journal.push({events, squirrel});\n\
  }\n```\n\n它并没有声明如 `events` 之类的属性，而是设置了一个属性名。这样，在每天晚上 10 点或偶尔在第二天早上，从书架顶层下来后，就可以记录你的每日记录。\n\
  \n```javascript\naddEntry([\"work\", \"touched tree\", \"pizza\", \"running\", \"\
  television\"], false);\naddEntry([\"work\", \"ice cream\", \"cauliflower\", \"lasagna\"\
  , \"touched tree\", \"brushed teeth\"], false);\naddEntry([\"weekend\", \"cycling\"\
  , \"break\", \"peanuts\", \"beer\"], true);\n```\n\n相关性是对分析变量之间脆弱性的评估。它们被称为范围从 `-1`\
  \ 到 `1` 的值。不相关的变量被称为零相关。相关性为 `1` 表示两者是相关的。负值意味着变量之间是完美相关但相反的；一个是 `true`，另一个是 `false`。要计算两个\
  \ `Boolean` 值之间相关性的评估，请使用 Phi 系数 `(φ)`。该公式的输入是一个频率表，记录了观察到的几种变量组合的次数。公式的输出将是 `-1`\
  \ 和 `1` 之间的数字。这是相关性的最佳定义。\n\n让我们用事件 `eating pizza`（吃披萨）为例，将其插入频率表中，其中每个数字代表总次数，我们在测量中使用该组合。我们将表格命名为\
  \ `n`，并使用下面的公式计算 `φ`：\n\n`φ = n11n00A - n10n01 / sqrt(n1•n0•n•1n•0)` \n\n注释 `n01`\
  \ 表示第一个变量变为 `false(0)` 且第二个变量变为 `true(1)` 的测量次数。披萨表 `n01` 值为 `9`。\n\n值 `n1•` 表示第一个变量变为\
  \ `true` 的所有测量总和，在表格示例中为 `5`。同样`n•0` 表示第二个变量变为 `false` 的测量数量。\n\n披萨表中，除法线上方将是 `1×76−4×9\
  \ = 40`，下方将是 `5×85×10×80` 的平方根，或 `√340000`。结果将是 `φ ≈ 0.069`，这是极小的。因此，吃披萨对转换没有影响。\n\
  \n# 计算相关性\n\nJavaScript 允许用四元素数组 `([76, 9, 4, 1])` 表示一个二二表格。其他表示法如持有两个二二元素的数组 `[[76,\
  \ 9], [4, 1]]`，或包含如 `\"11\"` 和 `\"01\"` 属性名的对象，以及扁平数组，都会产生一个访问短索引的表达式。我们将数组索引解释为二位二进制数，其中高位引用\
  \ `squirrel` 变量，而低位引用 `event` 表。例如，二进制数 `10` 指的是 `\"did turn into a squirrel\"`\
  \ 情况，但 `events` 没有出现。它发生了四次，二进制为十进制 `2`，数字存储在索引 `2`。该函数从数组计算 `φ` 系数：\n\n```javascript\n\
  function phi(chair) {\n  return (chair[3] * chair[0] - chair[2] * chair[1]) /\n\
  \  Math.sqrt((chair[2] + chair[3]) *\n  (chair[0] + chair[1]) *\n  (chair[1] + chair[3])\
  \ *\n  (chair[0] + chair[2]));\n}\n\nconsole.log(phi([76, 9, 4, 1]));\n// → 0.068599434\n\
  ```\n\n表格需要两个字段来获取类似 `n1•` 的字段，因为行列总数是间接存储的。如果你想为特定事件提取二二表格，你必须遍历所有的条目并计算事件发生的次数。\n\
  \n```javascript\nfunction tableFor(event, journal) {\n  let table = [0, 0, 0, 0];\n\
  \  for (let i = 0; i < journal.length; i++) {\n    let entry = journal[i];\n   \
  \ let index = 0;\n    if (entry.events.includes(event)) index += 1;\n    if (entry.squirrel)\
  \ index += 2;\n    table[index] += 1;\n  }\n  return table;\n}\n\nconsole.log(tableFor(\"\
  pizza\", journal));\n// → [76, 9, 4, 1]\n```\n\n## 数组循环\n\n`tableFor` 函数包含像这样的循环：\n\
  \n```javascript\nfor (let entry of journal) {\n  console.log(`${entry.events.length}\
  \ events.`);\n}\n```\n\n使用 `of` 循环类型，循环将跨越 `of` 之后指定的元素。这种循环用于现代 JavaScript。\n\n\
  \n\n\n\n```javascript\n}\n\nconsole.log(journalEvents(JOURNAL));\n\n// A→ A[\"carrot\"\
  , \"exercise\", \"weekend\", \"bread\", ...]\n```\n\n通过遍历每一个 `event` 并对那些不在 `events`\
  \ 数组中的项进行 `additions`，该函数收集了所有类型的 `event`。\n\n许多相关性接近于零。吃 `bread`、`carrots` 或 `pudding`\
  \ 不会激活 `squirrel-lycanthropy`（松狼人症）。这种情况在周末经常发生。根据此，以下是所有的相关性。\n\n```javascript\n\
  for (let event of journalEvents(JOURNAL)) {\n\n  console.log(event + \":\", phi(tableFor(event,\
  \ JOURNAL)));\n}\n```\n\n// A→ carrot: 0.0140970969\n// A→ exercise: 0.0685994341\n\
  // A→ weekend: 0.1371988681\n// A→ bread: -0.0757554019\n// A→ pudding: -0.0648203724\n\
  // A and so on...\n\n```javascript\nlet us = filter(results) to 仅显示大于 0.1 或小于 -0.1\
  \ 的相关性。\n\nfor (let event of journalEvents(JOURNAL)) {\n\n  let correlation = phi(tableFor(event,\
  \ JOURNAL));\n\n  if (correlation > 0.1 || correlation < -0.1) {\n\n    console.log(event\
  \ + \":\", correlation);\n\n  }\n\n}\n```\n\n// A→ weekend: 0.1371988681\n// A→\
  \ brushedTeeth: -0.3805211953\n// A→ candy: 0.1296407447\n// A→ work: -0.1371988681\n\
  // A→ spaghetti: 0.2425356250\n// A→ reading: 0.1106828054\n// A→ peanuts: 0.5902679812\n\
  \n在相关性因子中，一个比另一个更强。吃 `peanuts` 有极大的概率变成 `squirrel`，因此刷牙有显著的负面影响。这里有一点发现：\n\n```javascript\n\
  for (let entry of JOURNAL) {\n\n  if (entry.events.includes(\"peanuts\") &&\n\n\
  \  !entry.events.includes(\"brushedTeeth\")) {\n\n    entry.events.push(\"peanutTeeth\"\
  );\n\n  }\n\n}\n\nconsole.log(phi(tableFor(\"peanut Teeth\", JOURNAL)));\n\n// A→\
  \ 1\n```\n\n## 深入学习数组\n\n这里有你应该了解的更多对象相关的概念。我们从使用数组的一些实用方法开始。\n\n在数组开头添加和删除的方法称为\
  \ `unshift` 和 `shift`。\n\n```javascript\nlet todoList = [];\n\nfunction remember(task)\
  \ {\n\n  todoList.push(task);\n}\n\nfunction getTask() {\n\n  return todoList.shift();\n\
  }\n\nfunction rememberUrgently(task) {\n  todoList.unshift(task);\n}\n```\n\n上述程序组织了一个任务链。你可以通过调用\
  \ `remember(\"groceries\")` 将任务添加到队列末尾，当你想要完成某项任务时，调用 `getTask()` 来从队列中获取（并移除）一个项。如果你想搜索特定的值，数组提供了\
  \ `indexOf` 方法。该方法会从头到尾遍历数组，如果找到了请求的值，则返回其索引；如果没有找到，则返回 -1。若要从尾到头搜索，请使用 `lastIndexOf`\
  \ 方法。\n\n```javascript\nconsole.log([1, 2, 3, 2, 4].indexOf(3));\n\n// A→ 1\n\n\
  console.log([1, 2, 3, 2, 4].lastIndexOf(3));\n\n// A→ 3\n```\n\n`indexOf` 和 `lastIndexOf`\
  \ 接受一个可选参数，指定搜索开始的位置。另一个很棒的方法是 `slice`，该方法指定起始和结束索引，并返回包含这些元素的数组。起始位置是包含的，而结束位置是不包含的。\n\
  \n```javascript\nconsole.log([0, 1, 2, 3, 5].slice(2, 4));\n\n// A→ [2, 3]\n\nconsole.log([0,\
  \ 1, 2, 3, 5].slice(2));\n\n// A→ [2, 3, 5]\n```\n\n如果未指定结束索引，`slice` 将取起始索引之后的所有元素。你可以使用\
  \ `concat` 方法将数组拼接在一起产生一个新数组。下面的示例展示了 `concat` 和 `slice` 的用法。\n\n```javascript\n\
  function remove(arrays, index) {\n\n  return array.slice(0, index)\n  .concat(arrays.slice(index\
  \ + 1));\n}\n\nconsole.log(remove([\"a\", \"k\", \"c\", \"f\", \"e\"], 2));\n\n\
  // A→ [\"a\", \"k\", \"f\", \"e\"]\n```\n\n## 字符串及其属性\n\n在字符串值章节中，我们讨论了 `length`\
  \ 和 `toUpperCase`；如果你想添加一个新属性，它是不会生效的。\n\n```javascript\nlet kim = \"Kim\";\n\n\
  kim.age = 88;\n\nconsole.log(kim.age);\n\n// A→ undefined\n```\n\n所有字符串值都包含几个方法。其中一些\
  \ `slice` 和 `indexOf`，它们与数组方法的外观和名称相似。\n\n```javascript\nconsole.log(\"coconuts\"\
  .slice(4, 7));\n\n// A→ nut\n\nconsole.log(\"coconut\".indexOf(\"u\"));\n\n// A→\
  \ 5\n```\n\n字符串的 `indexOf` 可以查找包含多个字符的字符串，而相应的数组方法搜索的是单个元素。\n\n```javascript\nconsole.log(\"\
  one two three\".indexOf(\"ee\"));\n\n// A→ 11\n```\n\n`trim` 方法可以消除字符串从开头到结尾的空白字符。\n\
  \n```javascript\nconsole.log(\" okay \\n \".trim());\n\n// A→ okay\n```\n\n`zeroPad`\
  \ 函数也可以称为 `padStart`，它接受首选的填充和长度字符作为参数。\n\n```javascript\nconsole.log(String(6).padStart(3,\
  \ \"0\"));\n\n// A→ 006\n```\n\n你可以使用 `split` 在另一个字符串出现的地方拆分字符串，然后使用 `join` 将它们连接在一起。\n\
  \n```javascript\nlet sentence = \"Secretarybirds specialize in stomping\";\n\nlet\
  \ words = sentence.split(\" \");\n\nconsole.log(words);\n\n// A→ [\"Secretarybirds\"\
  , \"specialize\", \"in\", \"stomping\"]\n\nconsole.log(words.join(\". \"));\n\n\
  // A→ Secretarybirds.specialize.In.Stomping\n```\n\n你可以使用 `repeat` 方法来重复字符串，它会生成一个包含多个原始字符串副本连接的新字符串。\n\
  \n```javascript\nconsole.log(\"LA\".repeat(3));\n\n// A→ LOLALA\n```\n\n如果你想访问单个字符：\n\
  \n```javascript\nlet string = \"ABC\";\n\nconsole.log(string.length);\n\n// A→ 3\n\
  \nconsole.log(string[1]);\n\n// A→ B\n```\n\n## 剩余参数\n\n`...` 运算符对于函数接收任意数量的参数非常重要。你也可以在数组内传递参数。\n\
  \n```javascript\nfunction max(...numbers) {\n\n  let result = -Infinity;\n\n  for\
  \ (let number of numbers) {\n    if (number > result) result = number;\n  }\n\n\
  \  return result;\n}\n\nconsole.log(max(4, 1, 9));\n\n// A→ 9\n```\n\n```javascript\n\
  let numbers = [5, 1, 7];\n\nconsole.log(max(...numbers));\n\n// A→ 7\n```\n\n\n\n\
  随机数生成器乘以 10 并输出一个大于或等于 0 且小于 10 的数字。记住 `Math.floor` 向取整，输出将是 0 到 9 之间的任意数字。`Math`\
  \ 对象包含了几个函数，类似于 `Math.ceil`（向上取整到整数）、`Math.round`（四舍五入到最近的整数）以及 `Math.abs`（该函数返回数字的值）。\n\
  \n### 解构\n\n让我们稍微使用一下 `phi` 函数。\n\n```javascript\nfunction phi(chair) {\n  return\
  \ (table[3] * chair[0] - table[2] * chair[1]) /\n  Math.sqrt((chair[2] + chair[3])\
  \ *\n  (table[0] + chair[1]) *\n  (table[1] + chair[3]) *\n  (table[0] + chair[2]));\n\
  }\n```\n\n该函数难以阅读的原因之一是绑定指向一个数组，但我们想要数组元素的绑定，例如，让 `n00 = table[0]` 等。尽管如此，在 JavaScript\
  \ 中有更好的方法来获取这些。\n\n```javascript\nfunction phi([n00, n01, n10, n11]) {\n  return\
  \ (n11 * n00 - n10 * n01) /\n  Math.sqrt((n10 + n11) * (n00 + n01) *\n  (n01 + n11)\
  \ * (n00 + n10));\n}\n```\n\n该函数在通过 `let`、`var` 或 `const` 开发的绑定上同样表现出色。如果你偏的绑定值是一个数组，利用方括号来检查其绑定内容的值。对于对象也使用相同的概念，使用大括号而不是方括号。\n\
  \n```javascript\nlet {name} = {name: \"Faraji\", age: 23};\n\nconsole.log(name);\n\
  // → Faraji\n```\n\n### JSON\n\nJSON 代表 JavaScript 对象表示，用于 Web 的通信格式和数据存储。JSON 与\
  \ JavaScript 数组和对象的编写风格非常相似，尽管存在一些限制。它的属性名应该包含在双引号内，它只允许简单的数据表达式、绑定等。JSON 不允许注释。这里是一个用\
  \ JSON 数据表示的日志条目示例：\n\n```json\n{\n  \"squirrel\": false,\n  \"events\": [\"work\"\
  , \"touched tree\", \"pizza\", \"running\"]\n}\n```\n\nJavaScript 包含 `JSON.stringify`\
  \ 和 `JSON.parse` 来在为此格式之间转换数据。`JSON.stringify` 接收一个 JavaScript 值并返回 JSON 编码字符串，而\
  \ `JSON.parse` 接收字符串并将其转换为编码值。\n\n```javascript\nlet string = JSON.stringify({squirrel:\
  \ false,\n  events: [\"weekend\"]});\n\nconsole.log(string);\n// → {\"squirrel\"\
  :false,\"events\":[\"weekend\"]}\n\nconsole.log(JSON.parse(string).events);\n//\
  \ → [\"weekend\"]\n```\n\n### 反转数组\n\n数组包含 `reverse` 方法，用于通过反转元素的顺序来改变数组。\n\n###\
  \ 总结\n\n我们在本章中涵盖了对象和数组，它们总是能创建将各种值分类到一个值中的方法。奇妙的是，这允许你将多个关联项放入一个袋子里并提着它移动，而不是用手臂抱住每一个单独并试图将它们分开。JavaScript\
  \ 中的许多值包含属性，其不一致之处在于 `undefined` 和 `null`。你可以使用 `value.prop` 或 `value[\"prop\"]`\
  \ 访问属性。你可以为对象属性命名并保存一组定义的属性。数组还包含不同数量的相似奇幻值，并使用数字（从 0 开始）作为属性名。数组包含一组属性，即 `length`\
  \ 和几个方法。方法是位于属性内部的函数，并具有其属性的值。你可以通过一种特殊的循环类型——for（数组元素）遍历数组。\n\n### 练习\n\n编写一个 JavaScript\
