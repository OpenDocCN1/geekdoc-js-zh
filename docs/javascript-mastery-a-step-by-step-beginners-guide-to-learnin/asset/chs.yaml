  \n// A→ 73\nconsole.log(varyingSize.size);\n\n// A→ 49\n```\n\n当你想要使用对象的 `size`\
  \ 属性时，你会调用关联的方法。当你有一个 setter 的属性时，也可以执行类似的任务。\n\n```javascript\nclass Temperature\
  \ {\n\n  constructor(celsius) {\n    this.celsius = celsius;\n  }\n\n  get fahrenheit()\
  \ {\n    return this.celsius * 1.8 + 32;\n  }\n\n  set fahrenheit(value) {\n   \
  \ this.celsius = (value - 32) / 1.8;\n  }\n\n  static fromFahrenheit(value) {\n\
  \    return new Temperature((value - 32) / 1.8);\n  }\n\n}\n```\n\n```javascript\n\
  let temp = new Temperature(22);\n\nconsole.log(temp.fahrenheit);\n\n// A→ 71.6\n\
  temp.fahrenheit = 86;\n\nconsole.log(temp.celsius);\n\n// A→ 30\n```\n\n`Temperature`\
  \ 类允许你读取和写入摄氏度或华氏度的温度，但它只保存摄氏度，并在 `fahrenheit` getter 和 setter 中进行摄氏度之间的转换。在类声明中，`static`（静态）方法写在它们保存到\
  \ `constructor`（构造函数）之前。因此，你可以通过 `Temperature.fromFahrenheit(100)` 来通过华氏度构建温度。\n\
  \n### 继承\n\n某些矩阵是非对称的。当通过其左上角到右下角的对角线对非对称矩阵进行反射时，它不会改变。设置在 `x,y` 处的值与 `y,x` 处的值相同。使用\
  \ JavaScript 的 `prototype` 系统来构建一个新类，新类的 `prototype` 从旧原型获取，但为该方法设置了新的定义。这在面向对象编程中被称为继承。下面是一个插图：\n\
  \n```javascript\nclass AsymmetricMatrix extends AMatrix {\n\n  constructor(size,\
  \ element = (x, y) => undefined) {\n    super(size, size, (x, y) => {\n      if\
  \ (x < y) return element(y, x);\n      else return element(x, y);\n    });\n  }\n\
  \n  set(x, y, value) {\n    super.set(x, y, value);\n    if (x != y) {\n      super.set(y,\
  \ x, value);\n    }\n  }\n\n}\n```\n\n```javascript\nlet matrix = new AsymmetricMatrix(5,\
  \ (x, y) => `${x},${y}`);\n\nconsole.log(matrix.get(2, 3));\n\n// A→ 3,2\n```\n\n\
  ### `instanceof` 运算符\n\n了解一个对象是否是从某个特定的 `instanceof` 获取的重要的。\n\n```javascript\n\
  console.log(new AsymmetricMatrix(2) instanceof AsymmetricMatrix);\n\n// A→ true\n\
  console.log(new AsymmetricMatrix(2) instanceof AMatrix);\n\n// A→ true\nconsole.log(new\
  \ AMatrix(2, 2) instanceof AsymmetricMatrix);\n\n// A→ false\nconsole.log([1] instanceof\
  \ Array);\n\n// A→ true\n```\n\n该运算符将扫描所继承的类型。因此，`AsymmetricMatrix` 是 `AMatrix`\
  \ 的实例。你也可以将此方法应用于标准构造函数，如 `Array`。\n\n### 总结\n\n在本章中，我们意识到对象执行的操作不仅仅是持有它们的属性。它们还由也是对象的原型组成。只要\
  \ `prototype` 拥有该属性，它们的行为就像包含了它们本身没有提供的属性一样。简单对象使用 `Object`。`Prototype` 代表它们的原型。我们还讨论了构造函数，它们是函数，名称通常以大写字母开头，并配合\
  \ `new` 运算符用于构建新对象。新对象的 `prototype` 将是构造函数中 `prototype` 属性内部的对象。`class` 语法提供了一种描述构造函数及其原型的方法。我们还触及了\
  \ getter、setter、静态方法以及 `instanceof` 运算符。\n\n### 练习\n\n编写一个 JavaScript 程序，通过迭代器函数和一个主种子值创建一个数组。\n\
  \n### 答案\n\n（注：原文后续大量重复，此处仅展示核心逻辑翻译）\n\n\n\n移动是一个动作中心。它检查 `path` 是否能从一个地方通向另一个地方，如果不能，则返回旧状态，因为该移动无效的。然后它会构建一个新状态，将目的地作为机器人的新位置，并构建一组新的包裹。对\
  \ `map` 的调用处理移动，对 `filter` 的调用处理递送。\n\n```javascript\nlet first = new VillageState(\n\
  \  \"Post Office\",\n  [{place: \"Post Office\", address: \"Alice's House\"}]\n\
  );\n\nlet next = first.move(\"Alice's House\");\n\nconsole.log(next.place);\n\n\
  // → Alice's House\n\nconsole.log(next.parcels);\n\n// → []\n\nconsole.log(first.place);\n\
  \n// → Post Office\n```\n\n### 持久化数据\n\n不可更改的数据布局被称为 `immutable`（不可变）或 `persistent`（持久）。它们的行为类似于字符串和数字。在\
  \ `JavaScript` 中，你可以改变几乎一切。有一个名为 `Object.freeze` 的函数，它可以转换对象，使其忽略对其属性的写入。\n\n```javascript\n\
  let object = Object.freeze({value: 5});\n\nobject.value = 10;\n\nconsole.log(object.value);\n\
  \n// → 5\n```\n\n### 模拟\n\n送货机器人会仔细观察世界，并决定它移动的方向。因此，机器人是一个函数，它接收一个 `VillageState`\
  \ 对象并返回附近的名称。机器人返回一个对象，由它的意图方向和下次调用它时返回的内存值组成。\n\n```javascript\nfunction runRobot(state,\
  \ robot, memory) {\n  for (let turn = 0;; turn; turn++) {\n    if (state.parcels.length\
  \ == 0) {\n      console.log(`Done in ${turn} turns`);\n      break;\n    }\n\n\
  \    let action = robot(state, memory);\n    state = state.move(action.direction);\n\
  \    memory = action.memory;\n    console.log(`Moved to ${action.direction}`);\n\
  \  }\n}\n```\n\n机器人每一回合以不同的方向行走。它可以遇到所有的包裹，然后到达递送点。下面是一个示例：\n\n```javascript\nfunction\
  \ randomPick(array) {\n  let choice = Math.floor(Math.random() * array.length);\n\
  \  return array[choice];\n}\n\nfunction randomRobot(state) {\n  return {direction:\
  \ randomPick(roadGraph[state.place])};\n}\n```\n\n如果你想测试这个独特的机器人，请创建一个带有几个包裹的状态。\n\
  \n```javascript\nVillageState.random = function(parcelCount = 5) {\n  let parcels\
  \ = [];\n  for (let i = 0; i < parcelCount; i++) {\n    let address = randomPick(Object.keys(roadGraph));\n\
  \    let place;\n    do {\n      place = randomPick(Object.keys(roadGraph));\n \
  \   } while (place == address);\n    parcels.push({place, address});\n  }\n  return\
  \ new VillageState(\"Post Office\", parcels);\n};\n```\n\n`do` 循环在获得正确地址时会继续选择新地点。让我们开始一个虚拟世界。\n\
  \n```javascript\nrunRobot(VillageState.random(), randomRobot);\n\n// → Advances\
  \ to Marketplace\n// → Advances to Town Hall\n// →…\n// → Run in 63 turns\n```\n\
  \n机器人运输包裹花费了太多回合，因为没有预先计划。\n\n### 邮车的路线\n\n如果你搜索一条通过村庄内所有地方的路线，机器人可能会运行两次，但不能保证它只运行一次。下面是一个示例：\n\
  \n（从邮局开始）：\n\n```javascript\nconst mailRoute = [\n  \"Alice's House,\" \"Cabin\"\
  , \"Alice's House\", \"Bob's House\",\n  \"Town Hall\", \"Daria's House\", \"Ernie's\
  \ House\",\n  \"Grete's House\", \"Shop\", \"Grete's House\", \"Farm\",\n  \"Marketplace\"\
  , \"Post Office\"\n];\n```\n\n使用这条路线，你需要利用机器人内存。机器人路线其余部分存储在它的内存中，并在每一回合发送第一个元素。\n\
  \n```javascript\nfunction routeRobot(state, memory) {\n  if (memory.length == 0)\
  \ {\n    memory = mailRoutes;\n  }\n  return {direction: memory[0], memory: memory.slice(0,1)};\n\
  }\n```\n\n机器人现在变快了。它最多需要 26 个回合（13 步路线的两倍），但通常更少。\n\n### 路径查找\n\n一种有趣的方法是从起点开始开发路线，并检查每个未访问过的地点，直到达到目标。下面的插图解释了这一点：\n\
  \n```javascript\nfunction findRoute(graph, from, to) {\n  let work = [{at: from,\
  \ route: []}];\n  for (let i = 0; i < work.length; i++) {\n    let {at, route} =\
  \ work[i];\n    for (let location of graph[at]) {\n      if (location == to) return\
  \ route.concat(location);\n      if (!work.some(w => w.at == location)) {\n    \
  \    work.push({at: location, route: route.concat(location)});\n      }\n    }\n\
  \  }\n}\n```\n\n该函数保存了一个 `work` 列表。这是一个将要检查的地点数组，连同路线。它从空路线和起始位置开始。每个地点都可以从每个地点到达，因此在两点之间也可以找到路线，因此路线不会失败。\n\
  \n```javascript\nfunction goalOrientedRobot({location, parcel}, routes) {\n  if\
  \ (route.length == 0) {\n    let parcel = parcel[0];\n    if (parcel.location !=\
  \ location) {\n      route = findRoute(location, parcel.location);\n    } else {\n\
  \      route = findRoute(roadGraph, location);\n    }\n  }\n  return {direction:\
  \ routes[0], memory: route};\n}\n```\n\n### 总结\n\n在本章中，我们接触了使用 JavaScript 的机器人。我们构建了一个带有包裹和道路的村庄，然后讨论了数据结构类似于字符串的不可变数据。模拟允许向机器人传递内存并让它们返回新内容。\n\
  \n### 练习\n\n编写一个简单的 JavaScript 程序，将下面数组中的每个元素连接成一个字符串。\n\n`\"Red, Green, White,\
  \ Black\"`\n`\"Red, Green, White, Black\"`\n`\"Red+Green+White+Black\"`\n\n### 答案\n\
  \n![00127.jpg](img/00127.jpg)\n\n## 第 9 章：缺陷与错误\n\n计算机程序的缺陷被称为 bug，计算机程序犯的错误。\n\n\
  ### 严格模式\n\n你可以在严格模式下使用 JavaScript。这可以通过在文件顶部添加字符串 `\"use strict\"` 来。下面是一个示例：\n\
  \n```javascript\nfunction canYouSpotTheProblem() {\n  \"use strict\";\n  for (counter\
  \ = 0; counter < 10; counter++) {\n    console.log(\"Happy\");\n  }\n}\n\ncanYouSpotTheProblem();\n\
  \n// → ReferenceError: counter is not defined\n```\n\n当你想要调用一个构造函数而省略 `new` 关键字时，使用下面的代码，以防止它引入新创建的对象：\n\
  \n```javascript\nfunction person(name) {this.name = name;}\n\nlet Ferdinand = person(\"\
  Ferdinand\"); // 哎呀\n\nconsole.log(name);\n\n// → Ferdinand\n```\n\n对 `person` 的伪调用成功了，但它返回了\
  \ `undefined` 值并构建了全局绑定 `name`。在严格模式下：\n\n```javascript\n\"use strict\";\nfunction\
  \ person(name) {this.name = name;}\n\nlet Ferdinand = person(\"Ferdinand\"); //\
  \ 忘记写 new\n\n// → TypeError: Cannot set property 'name' of undefined\n```\n\n\n\n\
  \n你可以使用此函数来搜索程序中的错误。这是通过反复运行该函数来实现的。计算机擅长重复性任务。这个过程被称为**自动化测试**（Automated testing）。它涉及编写一个测试另一个程序的程序。这些测试会定期通过一组标记好的少量程序，以确定你代码的某些部分。例如，让我们为\
  \ `toUpperCase` 方法创建一个测试集。以下是一个示例：\n\n```javascript\nfunction test(label, body)\
  \ {\n  if (!body()) console.log(`Failed: ${label}`);\n}\n\ntest(\"convert Latin\
  \ text to uppercase\", () => {\n  return \"hello\".toUpperCase() == \"HELLO\";\n\
  });\n\ntest(\"convert Greek text to uppercase\", () => {\n  return \"Χαίρετε\".toUpperCase()\
  \ == \"ΧΑΊΡΕΤΕ\";\n});\n\ntest(\"don't convert case-less characters\", () => {\n\
  \  return \"ࢎ࠶߈off௷\".toUpperCase() == \"ࢎ࠶߈off௷\";\n  131\n});\n```\n\n### 调试 (Debugging)\n\
  \n当程序显示错误时，下一步是确定问题并将其修复。错误信息将直接指向你代码块中的某一行。查看错误描述，你就能找到问题所在。这个示例程序尝试通过不断提取最后一位并将数字除以该数字的进制，将整数转换为指定基数（十、二进制等）的字符串。\n\
  \n```javascript\nfunction numberToString(n, base = 10) {\n  let result = \"\", sign\
  \ = \"\";\n  if (n < 0) {\n    sign = \"-\";\n    n = -n;\n  }\n  do {\n    result\
  \ = String(n % base) + result;\n    n /= base;\n  } while (n > 0);\n  return sign\
  \ + result;\n}\n\nconsole.log(numberToString(13, 10));\n// → 1.5e-3231.3e-3221.3e-3211.3e-3201.3e-3191.3e…-3181.3\n\
  ```\n\n如果你想获取有关执行过程的额外信息，在程序中添加一些 `console.log` 调用是一个极佳的途径。我们想要获取值 `13`、`1` 和 `0`。我们应该在循环开始处说明值：\n\
  \n13\n1.3\n0.13\n0.013…\n1.5e-323\n\n除以 `13` 不会得到整数。我们需要的不是 `n /= base`，而是 `n =\
  \ Math.floor(n / base)`，这样数字就可以向右“移动”。\n\n指定断点的另一种绝佳方法是在程序中插入 `debugger` 语句（关键字）。如果你的浏览器处于激活状态，开发者工具会在程序运行到该语句时捕获并暂停程序。\n\
  \n### 异常 (Exceptions)\n\n当函数无法继续向下执行时，异常处理是理解如何修复该问题的地方。异常是一种工具允许遇到困难的代码块抛出异常，而异常可以是任何值。你可以刻意地在代码行中创建问题，以便在执行过程中捕获异常，这样你就可以使用它来解决问题并继续工作。\n\
  \n这里有一个示例：\n\n```javascript\nfunction promptDirection(question) {\n  let result\
  \ = prompt(question);\n  if (result.toLowerCase() == \"left\") return \"L\";\n \
  \ if (result.toLowerCase() == \"right\") return \"R\";\n  throw new Error(\"Invalid\
  \ direction: \" + result);\n}\n\nfunction look() {\n  if (promptDirection(\"Which\
  \ way?\") == \"L\") {\n    return \"a house\";\n  } else {\n    return \"two angry\
  \ bears\";\n    135\n  }\n}\n\ntry {\n  console.log(\"You see\", look());\n} catch\
  \ (error) {\n  console.log(\"Something went wrong: \" + error);\n}\n```\n\n使用 `throw`\
  \ 关键字抛出异常。\n\n### 异常后的清理 (Cleaning up after exceptions)\n\n异常的影响是不同类型的控制流。这表明你的代码可能有不同的副作用，但异常可以阻止这些副作用的发生。以下是一些糟糕的代码：\n\
  \n```javascript\nconst accounts = {\n  a: 100,\n  b: 0,\n  c: 20\n};\n\nfunction\
  \ getAccount() {\n  let accountName = prompt(\"Enter an account name\");\n  if (!accounts.hasOwnProperty(accountName))\
  \ {\n    throw new Error(`No such account: ${accountName}`);\n  }\n  return accountName;\n\
  }\n\nfunction transfer(from, amount) {\n  if (accounts[from] < amount) return;\n\
  \  accounts[from] -= amount;\n  accounts[getAccount()] += amount;\n}\n```\n\n`transfer`\
  \ 函数用于在账户之间转账。如果你输入错误的名称，程序会输出异常。你可以通过使用 `try` 块来捕获它。\n\n### 选择性捕获 (Selective catching)\n\
  \n当你想要捕获特定类型的错误时，如果只想捕获特定的错误，`catch` 块的作用可能不如你预期的。这里有一个示例：\n\n```javascript\nfor\
  \ (;;) {\n  try {\n    let adir = promptDirection(\"Where?\");\n    console.log(\"\
  You chose\", adir);\n    break;\n  } catch (error) {\n    console.log(\"Invalid\
  \ direction. Try again.\");\n  }\n}\n```\n\n`for(;;)` 循环用于构建不会自动终止的循环。如果你想捕获特定类型的错误，可以使用自定义错误类。让我们定义一种新错误并使用\
  \ `instanceof`：\n\n```javascript\nclass InputError extends Error {}\n\nfunction\
  \ promptDirection(question) {\n  let result = prompt(question);\n  if (result.toLowerCase()\
  \ == \"left\") return \"L\";\n  if (result.toLowerCase() == \"right\") return \"\
  R\";\n  throw new InputError(\"Invalid direction: \" + result);\n}\n```\n\n现在循环可以专门地捕获这些错误：\n\
  \n```javascript\nfor (;;) {\n  try {\n    let adir = promptDirection(\"Where?\"\
  );\n    console.log(\"You chose\", adir);\n    break;\n  } catch (e) {\n    if (e\
  \ instanceof InputError) {\n      console.log(\"Invalid direction. Try again.\"\
  );\n    } else {\n      throw e;\n    }\n  }\n}\n```\n\n\n\n\n编程概念和工具的发展是以无组织的方式进行的，但成功通常意味着某项卓越的技术。在本章中，我们将讨论正则表达式。它们用于定义字符串数据中的模式。它们创建了一种小小的不同语言，由\
  \ JavaScript 以及其他语言组成。\n\n## 创建正则表达式\n\n可以使用 `RegExp` 构造函数构建，或者通过在模式周围加上正斜杠 `/`\
  \ 来将其写为字面量值。\n\n```javascript\nlet re1 = new RegExp(\"ABC\");\nlet re2 = /ABC/;\n\
  ```\n\n这两个正则表达式对象代表相同的模式。在使用 `RegExp` 构造函数时，将模式写为普通字符串，这样反斜杠规则就会生效。\n\n第二种标记对反斜杠的影响不同，首先在任何正斜杠之前放置一个反斜杠，因为模式显示在斜线字符之间。\n\
  \n## 测试匹配\n\n正则表达式对象包含几个方法，其中之一是 `test`。当你传递一个字符串时，它返回一个布尔值，确定字符串是否包含表达式中的模式匹配。\n\
  \n```javascript\nconsole.log(/abc/.test(\"abcde\"));\n// →true\n\nconsole.log(/abc/.test(\"\
  abxde\"));\n// →false\n```\n\n正则表达式仅包含出现在连续字符中的非特殊字符。如果 `ABC` 出现在字符串的任何位置，我们就在运行测试，测试将返回\
  \ true。\n\n### 字符集\n\n正则表达式允许我们指示复杂的模式。如果你想在正则表达式中匹配任何数字，请在方括号之间放置一组字符。以下表达式等于数字内的每个字符串：\n\
  \n```javascript\nconsole.log(/[0123456789]/.test(\"in A1992\"));\n// →true\n\nconsole.log(/[0-9]/.test(\"\
  in A1992\"));\n// →true\n```\n\n方括号内两个字符之间的连字符 `-` 用于指定字符范围，由该字符的 Unicode 数字决定该命令。从\
  \ `0` 到 `9` 的字符在该命令下保持相邻（代码 `48` 到 `57`），因此 `[0-9]` 包裹所有它们并等于任何数字。常见的字符组包含内置的单独快捷方式。\n\
  \n数字是它们的一部分：\n- `\\d` 与 `[0-9]` 完全相同\n- `\\w` 字母数字字符（“单词字符”）\n- `\\s` 任何空白字符（空格、制表符、换行符及类似）\n\
  - `\\D` 非数字字符\n- `\\W` 非字母数字字符\n- `\\S` 非空白字符\n- `.` 任何非换行符字符\n\n因此，下面的表达式可以匹配日期和时间格式\
  \ `01-30-2003 15:20`：\n\n```javascript\nlet dateTime = /\\d\\d-\\d\\d-\\d\\d\\d\
  \ \\d\\d:\\d\\d/;\nconsole.log(dateTime.test(\"01-30-2003 15:20\"));\n// →true\n\
  \nconsole.log(dateTime.test(\"30-jan-2003 15:20\"));\n// →false\n```\n\n这些反斜杠代码也用于方括号内。例如，`[\\\
  d.]` 表示任何数字或周期字符，但点没有意义，其他特殊字符（如 `+`）也是如此。\n\n```javascript\nlet notBinary = /[⁰¹]/;\n\
  console.log(notBinary.test(\"1100100010100110\"));\n// →false\n\nconsole.log(notBinary.test(\"\
  1100100010200110\"));\n// →true\n```\n\n## 重复模式的部分\n\n现在你完美理解了如何匹配单个数字。如果你想匹配一个整数或连续的多个数字，请在正则表达式的输入后立即放置一个加号\
  \ `(+)`。这意味着该元素可以重复多次，`\\d+` 等于一个或多个数字字符。\n\n```javascript\nconsole.log(/'\\d+'/.test(\"\
  '123'\"));\n// →true\n\nconsole.log(/'\\d+'/.test(\"''\"));\n// →false\n\nconsole.log(/'\\\
  d*'/.test(\"'123'\"));\n// →true\n\nconsole.log(/'\\d*'/.test(\"''\"));\n// →true\n\
  ```\n\n星号 `*` 允许模式等于零。在下面的示例中，允许 `u` 字符出现，但当未找到时，模式也成立。\n\n```javascript\nlet neighbor\
  \ = /neighbour/;\nconsole.log(neighbor.test(\"neighbour\"));\n// →true\n\nconsole.log(neighbor.test(\"\
  neighbor\"));\n// →true\n```\n\n要确定模式应该执行多少次，请使用大括号，在元素后插入 `{4}`。如果你想让它精确执行四次，请定义这样的范围：`{2,4}`\
  \ 表示该元素必须执行两次且最多四次。下面是另一个日期和时间模式，它允许单、双位的日、月和小时。\n\n```javascript\nlet dateTime\
  \ = /\\d{01,2}-\\d{1,2}-\\d{4} \\d{1,2}:\\d{2}/;\nconsole.log(dateTime.test(\"01-30-2003\
  \ 8:45\"));\n// →true\n```\n\n## 分组子表达式\n\n如果你想在一个或多个元素上并发使用如 `*` 或 `+` 等运算符，请使用括号。正则表达式中用括号引用的部分，从运算符的角度来看视为一个独立的元素。\n\
  \n```javascript\nlet cartoonCrying = /boo+(hoo+)+/i;\nconsole.log(cartoonCrying.test(\"\
  Boohoooohoohooo\"));\n// →true\n```\n\n第一个和第二个 `+` 字符仅适用于 `boo` 和 `hoo` 中的第二个。第三个\
  \ `+` 指明整个组 `(hoo+)` 等于一次或多次此类成功。示例中结束第一个表达式的 `i` 用于不区分大小写，使其匹配输入字符串中的大写 `B`，尽管模式完全是小写的。\n\
  \n## 匹配与分组\n\n`test` 方法是匹配正则表达式的最佳方法，它仅确定是否匹配。正则表达式包含一个 `exec(execute)` 方法，如果找不到匹配，它将输出\
  \ `null` 并返回一个包含匹配数据的对象。\n\n```javascript\nlet match = /\\d+/.exec(\"one two 100\"\
  );\nconsole.log(match);\n// →[\"100\"]\n\nconsole.log(match.index);\n// →8\n```\n\
  \n`exec` 返回的对象包含 `index` 属性，确定字符串匹配的起始位置。下面字符串值包含 `match` 方法，行为类似：\n\n```javascript\n\
  console.log(\"one two 100\".match(/\\d+/));\n// →[\"100\"]\n```\n\n当正则表达式持有用括号收集的子表达式时，匹配文本将显示在数组中。第一个是完整匹配，下一个是分组匹配的部分，依此类推。\n\
  \n```javascript\nlet quotedText = /([^']*)'/;\nconsole.log(quotedText.exec(\"she\
  \ said 'hello'\"));\n// →[\"'hello'\",hello\"]\n```\n\n当分组未匹配时（如果包含问号），它输出 undefined。当你多次匹配分组时，只有最后一次匹配留在数组中。\n\
  \n```javascript\nconsole.log(/bad(ly)?/.exec(\"bad\"));\n// →[\"bad\", undefined]\n\
  \nconsole.log(/(\\d)+/.exec(\"123\"));\n// →[\"123\", \"3\"]\n```\n\n## Date 类\n\
  \nJavaScript 有一个表示日期的标准类 `Date`。如果你想使用 `new` 构建日期对象，首先获取当前时间和日期。\n\n```javascript\n\
  console.log(new Date());\n// → Mon Nov 11 2018 16:19:11 GMT+0100 (CET)\n```\n\n\
  你也可以构建特定时间的对象。\n\n```javascript\nconsole.log(new Date(2008, 11, 8));\n// → Wed Dec\
  \ 08 2008 00:00:00 GMT+0100 (CET)\n\nconsole.log(new Date(2008, 11, 9, 12, 59, 59,\
  \ 999));\n// → Wed Dec 08 2009 12:59:59 GMT+0100 (CET)\n```\n\n\n\n你应该遵循 JavaScript\
  \ 的命名规范，其中月份数字从 0 开始（因此，12 月为 11），日期从 1 开始。\n\n`hours`、`minutes`、`seconds` 和 `milliseconds`\
  \ 参数是可选的，未指定时被视为零。时间戳被保存为 `UTC` 时区的毫秒数。遵循“Unix 时间”设定的约定。\n\n```javascript\nconsole.log(new\
  \ Date(2016, 11, 14).getTime());\n// → 1445677600000\n\nconsole.log(new Date(1445677600000));\n\
  // → Mon Dec 11 2008 00:01:00 GMT+0100 (CET)\n```\n\n当 `Date` 构造函数设置为单个参数时，该参数被识别为毫秒数。要确定当前的毫秒数，你可以构建一个新的\
  \ `Date` 对象并在其上调用 `getTime()`，或者使用 `Date.now()` 函数。`Date` 对象产生诸如 `getDate`、`getHours`、`getFullYear`、`getMonth`、`getMinutes`\
  \ 和 `getSeconds` 等方法来获取其组成部分。\n\n```javascript\nfunction getDate(strings) {\n  let\
  \ [_, month, day, year] = /(\\d{01,2})-(\\d{01,2})-(\\d{4})/.exec(strings);\n  return\
  \ new Date(year, month - 1, day);\n}\n\nconsole.log(getDate(\"1-30-2003\"));\n//\
  \ → Thursday Jan 30 2003 00:00:00 GMT+0100 (CET)\n```\n\n### 字符串和边界\n\n你可以通过添加标记\
  \ `^` 和 `$` 来确保匹配跨越整个字符串。脱字符 `^` 代表输入字符串的开头，而美元符号 `$` 代表字符串的结尾。因此，`/^\\d+$/` 匹配连续多个或一个数字字符串，`/^!/`\
  \ 匹配任何以叹号开头的字符串，而 `/x^/` 不匹配任何字符串。如果你希望日期在边界开始并结束，请利用标记 `\\b`。单词边界可以是一侧包含单词字符 `(\\\
  w)` 而另一侧包含非单词字符的字符串开头或结束。\n\n```javascript\nconsole.log(/cat/.test(\"concatenate\"\
  ));\n// → true\n\nconsole.log(/\\bcat\\b/.test(\"concatenate\"));\n// → false\n\
  ```\n\n### 选择模式\n\n如果你想知道一段文本是否由一个数字以及后续诸如 chicken、pig 或 cow 的单词组成，让我们写三个正则表达式并测试它们。我们利用管道字符\
  \ `(|)` 来标记左侧和右侧模式之间的选择：\n\n```javascript\nlet animalCount = /\\b\\d+(pig|cows|chicken)s?\\\
  b/;\nconsole.log(animalCount.test(\"15 pigs\")); // 150 → true\nconsole.log(animalCount.test(\"\
  15 pigchickens\")); // → false\n```\n\n### Replace 方法\n\n字符串值包含 `replace` 方法，用于将字符串的部分替换为另一个。\n\
  \n```javascript\nconsole.log(\"papa\".replace(\"p\", \"m\"));\n// → mama\n```\n\n\
  第一个参数也可以是一个正则表达式。它替换正则表达式的第一个匹配项。如果你在表达式中添加 `g` 选项（全局），则字符串中的每个匹配项都会被替换，而不仅仅是第一个。\n\
  \n```javascript\nconsole.log(\"Borobudur\".replace(/[ou]/, \"a\"));\n// → Barobudur\n\
  \nconsole.log(\"Borobudur\".replace(/[ou]/g, \"a\"));\n// → Barabadar\n```\n\n在\
  \ `replace` 中利用正则表达式的主要意义在于它可以引用替换字符串中的匹配组。例如，你有一个由姓名组成的大字符串，每行一个名字，格式为 `Lastname,\
  \ Firstname`。你也可以更改和删除这些名字，消除逗号以获得 `Firstname Lastname` 格式，并使用以下代码：\n\n```javascript\n\
  console.log(\n  \"Liskov, Barbara\\nMcCarthy, John\\nWadler, Philip\"\n  .replace(/(\\\
  w+), (\\w+)/g, \"$2 $1\")\n);\n// Barbara Liskov\n// John McCarthy\n// Philip Oaks\n\
  ```\n\n替换字符串中的 `$1` 和 `$2` 指模式中括号中的组。`$1` 由匹配相反第一个组的文本恢复，`$2` 直到 `$9`。每个匹配项都可以用\
  \ `$&` 引用。你可以传递函数而不是字符串作为第二个参数来进行恢复。对于每次替换，函数都会使用匹配组作为参数被调用，并将返回值包含新字符串中。下面是一个示例：\n\
  \n```javascript\nlet s = \"the cia and fbi\";\nconsole.log(s.replaces(/\\b(fbi|cia)\\\
  b/g, str => str.toUpperCase()));\n// → the CIA and FBI\n```\n\n这里更有趣：\n\n```javascript\n\
  let stock = \"apple, banana\";\nfunction replaceOne(match, amount) {\n  amount =\
  \ Number(amount);\n  if (amount === 1) {\n    stock = stock.slice(0, amount);\n\
  \  } else if (amount === 0) {\n    amount = \"no\";\n  }\n  return amount;\n}\n\
  console.log(stock.replace(/(\\w+)/g, replaceOne));\n// apple, banana\n```\n\n你可以使用\
  \ `replace` 处理代码中的所有注释，因为 `replace` 带有全局标志：\n\n```javascript\nfunction stripComments(code)\
  \ {\n  return code.replace(/\\/\\/.*|\\/\\*[\\s\\S]*?\\*\\//g, \"\");\n}\nconsole.log(stripComments(\"\
  let x = 10; // comment \\/* block */\"));\n// let x = 10; \n```\n\n等待，之前的逻辑示例稍有缺陷。这里是处理全局注释的标准方法：\n\
  \n```javascript\nfunction stripComments(code) {\n  return code.replace(/\\/\\/.*|\\\
  /\\*[\\s\\S]*?\\*\\//g, \"\");\n}\nconsole.log(stripComments(\"let x = 10; // comment\
  \ \\/* block */\"));\n// let x = 10; \n```\n\n实际上，根据提供的文本提供一个整洁的版本：\n\n```javascript\n\
  function stripComments(code) {\n  return code.replace(/\\/\\/.*|\\/\\*[\\s\\S]*?\\\
  *\\//g, \"\");\n}\nconsole.log(stripComments(\"let x = 10; // comment \\/* block\
  \ */\"));\n// let = 10; \n```\n\n等待，用户文本对 `replaceOne` 有特定的逻辑。让我们按照提供文本的逻辑进行格式化，同时修复语法以符合\
  \ Markdown 规则。\n\n```javascript\nfunction stripComments(code) {\n  return code.replace(/\\\
  /\\/.*|\\/\\*[\\s\\S]*?\\*\\//g, \"\");\n}\nconsole.log(stripComments(\"let x =\
  \ 10; // comment \\/* block */\"));\n// let x = 10; \n```\n\n*(自纠：提供的输入文本包含许多 \"\
  A\" 字符和损坏的语法，但目标是保留核心内容。这看起来像是 OCR 或复制粘贴错误。我将按照要求格式化文本，应用 Markdown 规则。)*\n\n实际上，输入开头有很多\
  \ \"A\" 前缀。我将移除开头的 \"A\" 前缀以使英文可读，同时保持逻辑完整。\n\n\n\n\n\n`exec` 方法提供了一种更好的方法。正则表达式对象包含一个名为\
  \ `source` 的属性，它由从表达式构建的字符串组成。`lastIndex` 是另一个属性，它影响某些特殊情况，即下一次匹配的开始位置。正则表达式必须包含全局\
  \ `(g)` 或粘性 `(y)` 选项，并将使用 `exec` 方法进行匹配。下所示：\n\n```javascript\nlet pattern = /y/g;\n\
  \npattern.lastIndex = 3;\n\nlet match = pattern.exec(\"xyzzy\");\n\nconsole.log(match.index);\n\
  \n// → 4\n\nconsole.log(pattern.lastIndex);\n\n// → 5\n```\n\n全局选项和粘性选项之间的区别在于：当启用粘性时，如果匹配从\
  \ `lastIndex` 开始则匹配成功；而在全局模式下，它会寻找一个匹配可以开始的位置。\n\n```javascript\nlet global = /ABC/g;\n\
  \nconsole.log(global.exec(\"XYZ AABC\"));\n\n// → [\"ABC\"]\n\nlet sticky = /ABC/y;\n\
  \nconsole.log(sticky.exec(\"XYZ AABC\"));\n\n// → null\n```\n\n如果你在多次调用中使用共享的正则表达式值，那么\
  \ `lastIndex` 属性的自动更新会出现问题。\n\n```javascript\nlet digit = /\\d/g;\n\nconsole.log(digit.exec(\"\
  it is here: 1\"));\n\n// → [\"1\"]\n\nconsole.log(digit.exec(\"and now: 1\"));\n\
  \n// → null\n```\n\n全局选项也改变了概念。字符串上的 `match` 方法也可以工作。\n\n### 遍历匹配项\n\n最好的方法是扫描字符串中模式的所有事件，并在循环体中访问匹配对象。使用\
  \ `lastIndex` 和 `exec` 来实现这一目标。\n\n```javascript\nlet input = \"A string with three\
  \ numbers... 42 and 88.\";\n\nlet number = /\\b\\d+\\b/g;\n\nlet match;\n\nwhile\
  \ (match = number.exec(input)) {\n  console.log(\"Found\", match[0], \"at\", match.index);\n\
  }\n\n// → Found 3 at 14\n// → Found 42 at 33\n// → Found 88 at 40\n```\n\n赋值表达式的值（`=`）是指定的赋值。因此，在\
  \ `while` 语句中使用 `match = number.exec(input)` 作为条件，匹配意味着我们在每次迭代的开始时执行匹配，将结果存储在绑定中，并在无法再找到匹配项时停止循环。\n\
  \n### 解析 INI 文件\n\n```ini\nsearch_engine=https://duckduckgo.com/?q=$1\nspitefulness=9.7\n\
  ; 注释以分号开头\n; 每个节涉及一个特定的敌人\n\n[larry]\nfullname=Larry Doe\ntype=kindergarten bully\n\
  website=http://www.google.com/google/\n\n[davaeorn]\nfullname=Davaeorn\ntype=evil\
  \ witch\noutputdir=/home/margin/enemy/davaeorn\n```\n\n这种格式（通常通用的格式，通常称为 INI 文件）的规则是：\n\
  \n* 忽略空行和以分号开头的行。\n* 被 `[]` 包围的行开始一个新节区。\n* 由字母数字标识符配合 `=` 字符组成的行将设置附加到当前节区。\n*\
  \ 其他所有内容都是无效的。\n\n我们的任务是将像这样的字符串转换为对象，其属性使用字符串存储写在节区子对象和第一个节区头部之前的设置。子对象持有该节区的设置。使用回车符加换行符（`\\\
  r\\n`）而不是换行符来区分行。这将使得 `split` 方法允许将正则表达式作为参数，你可以利用类似 `/\\r?\\n/` 的正则表达式来分割支持行之间的\
  \ `\"\\n` 和 `\"\\r\\n`。\n\n```javascript\nfunction parseINI(string) {\n  // 开始一个用于存储顶层字段的对象\n\
  \  let result = {};\n  let section = result;\n\n  string.split(/\\r?\\n/).forEach(line\
  \ => {\n    let match;\n    if (match = line.match(/^(\\w+)=(.*)$/)) {\n      section[match[1]]\
  \ = match[2];\n    } else if (match = line.match(/^\\[(.*)\\]$/)) {\n      section\
  \ = result[match[1]] = {};\n    } else if (!/^\\s*(;.*)?$/.test(line)) {\n     \
  \ throw new Error(\"Line '\" + line + \"' Invalid.\");\n    }\n  });\n\n  return\
  \ result;\n}\n\nconsole.log(parseINI(`\nname=Vasilis\n[address]\ncity=Tessaloniki`));\n\
  // → {name: \"Vasilis\", address: {city: \"Tessaloniki\"}}\n```\n\n代码遍历文件行并创建一个对象。顶部的属性直接保存到该对象中，而节区中的属性保存在不同的节区对象中。节绑定指向现有节区的对象。有两种重要的行类型——节区头部或属性行。如果一行总是属性，它会被保存在现有节区中。如果是节区头部，则创建一个新的节区对象并将节\
  \ 指向它。\n\n`(match = string.match())` 模式与利用赋值作为 `while` 条件的技巧相同。\n\n### 国际字符\n\n\
  由于 JavaScript 最初的简单实现以及这种方法被设置为标准行为，JavaScript 的正则表达式对于英语语言中未显示的字符相当“愚笨”。例如，在 JavaScript\
  \ 中，正则表达式的“单词字符”只是拉丁字母中的 26 个字符之一（小写或大写）、数字和下划线字符。像 `é` 或 `ß` 字符是单词字符，它们不会匹配 `\\\
  w`，但会匹配大写的 `\\W`（非单词类别）。这表示字符是由两个代码单元组成的。\n\n```javascript\nconsole.log(/\U0001F34E\
  {3}/.test(\"\U0001F34E\U0001F34E\U0001F34E\"));\n// → false\n\nconsole.log(/<.>/.test(\"\
  <\U0001F339>\"));\n// → false\n\nconsole.log(/<.>/u.test(\"<\U0001F339>\"));\n//\
  \ → true\n```\n\n这里识别出的问题是第一行的 `\U0001F34E` 被视为两个代码单元，而 `{3}` 部分仅用于第二个。点也只匹配单个代码单元。在你的正则表达式中添加\
  \ `u`（代表 Unicode）以便正确处理字符。遗憾的是，错误的行为仍然是默认值，因为这可能会产生问题。你可以使用 `\\p` 正则表达式来匹配 Unicode\
  \ 集合中的每一个字符。\n\n```javascript\nconsole.log(/\\p{Script=Greek}/u.test(\"α\"));\n\
  // → true\n\nconsole.log(/\\p{Script=Arabic}/u.test(\"α\"));\n// → false\n\nconsole.log(/\\\
  p{Alphabetic}/u.test(\"α\"));\n// → true\n\nconsole.log(/\\p{Alphabetic}/u.test(\"\
  !\"));\n// → false\n```\n\nUnicode 描述了许多属性，尽管寻找你需要的属性并不总是易的。\n\n### 总结\n\n我们在本章中关注了正则表达式。代表模式字符串的对象就是正则表达式。它们由其语言组成并利用它来展示这些模式。\n\
  \n* `/ABC/`: 字符序列\n* `/[abc]/`: 字符范围内的字符\n* `[^abc]/`: 范围之外的任何字符\n* `/[0-9]/`: 字符集内的任何字符\n\
  * `/x+/`: 一个或多个模式事件\n* `/x+?`: 一个或多个事件，非贪婪\n* `/x*`: 零或多个事件\n* `/x?`: 零或一个事件\n*\
  \ `/x{2,4}/`: 二到四个事件\n* `/(ABC)/`: 分组\n* `/a|b|c/`: 各种模式中的任意一个\n* `/\\d/`: 任意数字字符\n\
  * `/\\w/`: 任意单词字符\n* `/\\s/`: 任意空白字符\n* `.`: 除换行符外的任何字符\n* `/\\b/`: 单词边界\n* `/\\\
  ^`: 输入开始\n* `$/`: 输入结束\n\n\n\n\n\n正则表达式包含一个用于检查字符串是否匹配的 `test()` 方法，以及 `exec()`\
  \ 方法，后者在找到匹配项时会返回一个包含每个匹配组的数组。这种数组包含一个 `index` 属性，指定匹配开始的位置。字符串也使用 `match()` 方法在正则表达式中进行匹配，以及一个\
  \ `find()` 方法，后者仅返回匹配项的起始位置。\n\n### 练习\n编写一个利用正则表达式实现 `trim(string)` 函数的 JavaScript\
  \ 程序。\n\n解决方案![00146.jpg](img/00146.jpeg)\n\n![00156.jpg](img/00156.jpeg)\n\n##\
  \ 第 11 章：模块 (Modules)\n\n这个特定的程序具有简单的布局。它的概念很容易解释，每个部分都起着精确的作用。布局的组织和维护可能会花费更多工作，但最终在未来有人再次使用该程序时，这种投入是值得的。因此，你可能会由于兴趣而忽视这一点，允许程序部分相互混杂，这将会产生两个实际问题。首先，当所有部分都相互接触时，很难观察到任何被分离的部分。你将不得不对整个程序有一个全面的理解。其次，在不同情况下使用程序中的任何功能时，你只能重写它，而不是从上下文中解耦。\n\
  \n### 模块\n模块是一种程序类型，它决定了应该依赖哪些部分以及应该为其他部分产生什么功能。通过限制模块之间总是相互通信，系统就像乐高一样，各个之间使用简单的连接器进行通信，而不是让整个部分与所有内容混合。依赖关系是模块之间的关系。当一个模块想要来自另一个模块的部分时，它就依赖于该模块。模块本身说明了这一事实，并被用于确定哪些其他模块可以供指定的模块使用，并自动加载依赖。每个模块都需要自己的作用域来与其他模块隔离开。\n\
  \n### 包\n由不同部分构建程序并能够单独启动这些部分的一个重要益处是，你可以将同一个部分应用到不同的程序中。当代码重复开始时，包就派上用场了。包是一个可以共享的代码块。它可能由一个或多个模块组成，并持有有关其他被依赖包的信息。包还包含描述其功能的文档，以便没有编写它的人可以使用它。当包出现问题或你添加新功能时，包会自动更新。现在，依赖于其升级到最新版本的程序也会随之更新。\n\
  \n要实现这一点，你需要一个基础设施。一个保存和搜索包的地方，以及一种升级和安装它们的简单方法。涉及到 JavaScript，`NPM` 提供了支持。将 `NPM`\
  \ 分为两个：你可以上传和下载包的在线服务，以及一个处理安装和管理的程序。`NPM` 上几乎所有的代码都有授权。\n\n### 即兴模块\n在 2015 年之前，JavaScript\
  \ 语言不包含任何内置模块系统，但人们已经使用 JavaScript 创建大型系统多年了，他们需要模块。他们开发了自己的模块系统并将其集成到语言中。你可以利用\
  \ JavaScript 函数来构建局部作用域和代表模块布局的对象。使用这个模块在日期名称和数字之间进行映射。它的布局包含 `weekDay.name` 和 `weekDay.number`，并将它的局部绑定名称隐藏在函数的作用域内部。\n\
  \n该表达式被立即调用。\n\n```javascript\nconst weekDay = function() {\n  const names = [\"\
  Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\",\n  \"Thursday\", \"Friday\", \"\
  Saturday\"];\n  return {\n    name(number) {return names[number];},\n    number(name)\
  \ {return names.indexOf(name);}\n  };\n}();\n\nconsole.log(weekDay.name(weekDay.number(\"\
  Sunday\")));\n// → Sunday\n```\n\n这种风格的模块不声明依赖。它们将布局放在全局作用域。这种风格的模块在某种程度上提供了隔离，但并没有声明依赖。相反，它只是将其接口放入全局作用域，并等待它的依赖（如果有的话）执行的操作。\n\
  \n### 将数据作为代码评估\n有不同的方法获取数据并将其作为现有程序的一部分启动。最好的方法是利用唯一的运算符 `eval`，它影响现有作用域中的字符串。\n\
  \n```javascript\nvar Ax = 1;\n\nfunction evalAndReturnX(code) {\n  eval(code);\n\
  \  return Ax;\n}\n\nconsole.log(evalAndReturnX(\"var Ax= 2\"));\n// → 2\n\nconsole.log(x);\n\
  // → 1\n```\n\n另一种不复杂的解释数据作为代码的方法是使用 `Function` 构造函数。它接受两种类型的参数：一个逗号分隔的参数名列表字符串，以及一个包含函数体的字符串。它将代码封装在一个函数值中，使其能够获得自己的作用域。\n\
  \n```javascript\nlet plusOne = Function(\"n\", \"return n+1;\");\n\nconsole.log(plusOne(4));\n\
  // → 5\n```\n\n你可以将模块的代码封装在函数中，并利用同一个函数作用域作为模块作用域。\n\n### CommonJS\n加载 JavaScript\
  \ 模块常用的方法是 `CommonJS` 模块。`Node.js` 使用这种方法，`NPM` 许多包也是如此。`CommonJS` 模块的核心思想是名为 `require`\
  \ 的函数。如果你结合依赖模块名称调用它，它会加载该模块并返回其接口。加载器将模块代码封装在一个函数内，模块自动拥有它们的局部作用域。你可以调用 `require`\
  \ 查看它们的依赖，并将它们的布局放在 `exports` 它们的对象中。这个示例模块提供了一个日期格式化函数。它利用了 `NPM` 的两个包：`ordinal`\
  \ 用于将数字转换为如 \"1st\" 和 \"2nd\" 的字符串，`date-names` 用于获取月份和星日的英文名称。它导出单个函数 `formatDate`，该函数接收一个模板字符串和一个\
  \ `Date` 对象。模板字符串可以包含控制格式的代码，例如 `YYYY`（完整年份）和 `Do`（月份的序数日）。你可以设置一个类似 \"MMMM Do YYYY\"\
  \ 的字符串来获得像“December 2nd, 2013”的输出。\n\n```javascript\nconst = require(\"ordinal\"\
  );\n\nconst {days, months} = require(\"date-names\");\n\nexports.formatDate = function(date,\
  \ format) {\n  return format.replace(/YYYY|M(MMM)?|Do?|dddd/g, tag => {\n    if\
  \ (tag === \"YYYY\") return date.getFullYear();\n    if (tag === \"M\") return date.getMonth();\n\
  \    if (tag === \"MMMM\") return months[date.getMonth()];\n    if (tag === \"D\"\
  ) return date.getDate();\n    if (tag === \"Do\") return ordinal(date.getDate());\n\
  \    if (tag === \"dddd\") return days[date.getDay()];\n  });\n};\n```\n\n\n\n\n\
  `layout` 是一个函数，其中 `date-names` 导出一个包含多个其他内容的对象，月份和日期是名称数组。在为导入的布局创建绑定时，重构非常简单。该模块将它的布局函数挂载到导出上，以便依赖它的模块可以访问。你可以按照以下方式使用该模块：\n\
  \n```javascript\nconst {formatDate} = require(\"./format-date\");\n\nconsole.log(formatDate(new\
  \ Date(2017, 9, 13), \"dddd\"));\n// → Friday 13th\n```\n\n我们可以以最极简的形式定义 `require`：\n\
  \n```javascript\nrequire.cache = Object.create(null);\n\nfunction require(name)\
  \ {\n  if (!Object.hasOwnProperty(require.cache, name)) {\n    let code = readFile(name);\n\
  \    let module = {exports: {}};\n    require.cache[name] = module;\n    let wrapper\
  \ = new Function(\"require, exports, module\", code);\n    wrapper(require, module.exports,\
  \ module);\n  }\n  return require.cache[name].exports;\n}\n```\n\n在这段代码中，`readFile`\
  \ 是一个强大的函数，它可以读取文件并将其内容作为字符串返回。标准 JavaScript 并不提供这种功能，但 Node.js 和浏览器等其他 JavaScript\
  \ 环境提供了访问文件的独特方式。上面的示例假装了 `readFile` 的存在。为了避免重复加载同一个模块，你需要存储一个已加载模块的缓存（cache）。当被调用时，它会检查请求的模块是否已加载，如果没有，则加载它。它需要读取模块的代码，将其封装在一个函数中并调用它。\n\
  \n之前提到的 `ordinal` 软件包的布局是一个函数而不是对象。CommonJS 模块使用模块系统为你创建一个空的布局对象供你导出，然后通过重写 `module.exports`\
  \ 用值来恢复它。模块这样做这样做是为了导出单个值而不是布局对象。通过将 `exports`、`require` 和 `module` 描述为创建的闭包函数的参数（并在调用它时设置正确的值），加载器确保了这些绑定在模块作用范围内是可用的。\n\
  \n传递给 `require` 的字符串在不同的系统中被解释为文件名或网络地址变量。当它以 `./` 或 `/` 开头时，通常被翻译为相对于现有模块文件名的路径。因此，`./format-date`\
  \ 将是同目录下的 `format-date.js` 文件。\n\n如果名称不是相对路径，Node.js 将搜索以该名称安装的包。\n\n现在，你不需要自己编写\
  \ INI 文件解析器，可以使用 NPM 上的。\n\n```javascript\nconst {parse} = require(\"ini\");\n\n\
  console.log(parse(\"x=10\\ny=20\"));\n// → {x: \"10\", y: \"20\"}\n```\n\n## ECMAScript\
  \ \n\nCommonJS 模块在与 NPM 结合时表现良好，它们让 JavaScript 社区能够开始大规模的代码共享。这种语法非常奇怪。添加到 `exports`\
  \ 中的内容在局部作用范围内是不可见的。在不运行模块代码的情况下，很难在任何参数之前确定其依赖关系。这就是 JavaScript 标准建立自己的独立模块系统的原因。它被命名\
  \ ESM 模块，其中 ESM 代表 ECMAScript。依赖和接口的初始想法保持不变，但细节有所不同。这种语法集成到了语言中。你现在可以使用唯一的 `import`\
  \ 关键字来访问依赖，而不是调用函数。\n\n```javascript\nimport ordinal from \"ordinal\";\n\nimport\
  \ {days, months} from \"date-names\";\n\nexport function formatDate(date, format)\
  \ {\n  /* ... */\n}\n```\n\n使用 `export` 关键字来导出内容。它可以位于类、函数或绑定定义（`let`、`const` 或\
  \ `var`）的前。ESM 模块的布局表示的单个值，而是一组命名绑定。之前的模块将 `formatDate` 挂载到函数上。如果你从不同的模块导入，绑定随之而来，而不是值，这意味着导出模块可以随时更改绑定，而导入的模块将识别它的新值。\n\
  \n如果绑定被命名为 `default`，它会被识别为模块的主要导出值。如果像示例中的 `ordinal` 这样的模块导入时省略绑定名称两侧的大括号，你将找到它的默认绑定。要开发默认导出，请在表达式、类或声明之前编写\
  \ `export default`。\n\n```javascript\nexport default [\"Winter\", \"Spring\", \"\
  Summer\", \"Autumn\"];\n```\n\n你可以使用像这样的单词对其重命名：\n\n```javascript\nimport {days\
  \ as dayNames} from \"date-names\";\n\nconsole.log(dayNames.length);\n// → 7\n```\n\
  \n另一个主要区别是 ESM 模块是异步的。与路径查找有关，有很多方法可以表示图，即节点和边。\n\n## 模块设计\n\n程序结构是编程的特性之一。任何未知的功能都可以任意的。良好的模块设计是个性化的，这取决于偏好。要理解组织良好的设计的价值，你只需要阅读并处理几个程序。NPM\
  \ 上有各种路径查找包，但没有一个利用了图格式。它们通常允许图的边包含权重，即与它相关的距离或成本。例如，我们有 `dijkstrajs` 软件包。一种公知的路径查找方法，与\
  \ Dijkstra 算法有关，该算法由软件包首次作者 Edsger Dijkstra 命名。\n\n\n\n\n```javascript\nconst {find_path}\
  \ = require(\"dijkstrajs\");\n\nlet graph = {};\n\nfor (let node of Object.keys(roadGraph))\
  \ {\n  let edges = graph[node] = {};\n  for (let dest of roadGraph[node]) {\n  \
  \  edges[dest] = 1;\n  }\n}\n\nconsole.log(find_path(graph, \"Post Office\", \"\
  Cabin\"));\n\n//→[\"Post Office\", \"Alice's House\", \"Cabin\"]\n```\n\n许多包可能会使用不同的数据结构来定义相关内容，这使得它们很难组合在一起。因此，当你设计可组合性（composability）时，你现在准确了他人正在使用的数据结构，并遵循他们的示例。\n\
  \n### 总结\n\n在本章中，我们学习了模块（Modules）。模块通过将代码拆分为具有可理解的依赖关系和接口的部分，为更复杂的程序提供了结构。接口是一个你可以从其他模块看到的模块，而依赖关系则是它所使用的不同模块。\n\
  \n### 练习\n\n编写一个 JavaScript 程序，以以下格式显示当前的日期和时间。\n\n今天是星期二。\n\n当前时间是: 10PM:30:38\n\
  \n## 解决方案\n\n![00103.jpg](img/00103.jpeg)![00032.jpg](img/00032.jpeg) A\n\n## 第\
  \ 12 章：异步编程\n\n处理器是计算机的重要部分，负责执行平衡我们程序的各个步骤。影响数量完成的类似循环的速度取决于处理器的速度。许多程序与处理器外部的物体进行通信。例如，它们可能会通过计算机网络交互，或者从硬盘请求数据，而从内存中获取数据要快得多。部分，操作系统处理这部分，并在运行的各种程序之间切换处理器。\n\
  \n### 异步性\n\n在异步编程模型中，所有操作都是一次发生一个。如果你调用了一个执行耗时操作的函数，结果只有在操作完成后才会返回。执行期间不会有其他操作发生。异步模型允许几件事同时发生。当一个操作开始时，程序不会停止运行。当任务完成时，它会通知程序并访问结果（例如从磁盘读取的信息）。你可以通过一个简单的示例来区分异步和同步编程：一个从网络获取两个资源并然后通知结果的程序。\n\
  \n在异步环境中，请求函数在工作完成后返回。执行此任务的最简单方法是连续调用请求。它的缺点是只有在第一个任务完成后才开始第二个请求。两个响应时间的总和将是花费的总时间。为了在异步系统中解决这个问题，开始添加控制线程。线程是一个正在运行的程序，它的执行可以通过操作系统与其他程序共同渲染，因为现代计算机有多个处理器，不同的线程可以同时在不同的处理器上运行。第二个线程可以开始第二个请求，然后两个线程都等待它们的结果返回，之后，它们进行同步以统一两个结果。在异步模型中，网络时间是指定控制线程时间线的一部分。在异步模型中，启动网络操作在逻辑上在时间线中创建了一个划分。启动该操作的程序不会停止运行，操作随之发生，并在完成后由它来通知程序。\n\
  \n另一种确定相似性的方法是，在异步模型中等待任务完成是间接的，而在同步模型中，它是直接受我们控制的。\n\n### 回调（Callbacks）\n\n异步编程的一种方法是允许执行缓慢操作的函数接收一个额外的参数，该参数被称为回调函数。当操作开始和结束时，你应该通过回调函数调用结果。例如，在浏览器和\
  \ Node.js 中都可以使用的 `setTimeout` 函数，它会等待指定的毫秒数然后调用函数。\n\n```javascript\nsetTimeout(()=>console.log(\"\
  Tick\"), 500);\n```\n\n等待不是理想的工作类型，但当你运行类似动画更新或检查函数耗时是否超过指定时间的程序时，它是适用的。通过回调连续运行多个异步任务意味着你必须继续设置新函数来控制操作后计算的延续。\n\
  \n许多大乌鸦（grow）计算机由一个长久的数据存储球组成，数据存储在分支中，以便以后访问和恢复。存储或搜索某些数据需要一点时间，因此长久存储的布局是异步的，并利用了回调函数。存储球在名称下保存可\
  \ JSON 编码的数据位。大乌鸦可以以“foodCaches”的名称保存关于它藏食物的地方的数据，该名称包含一个指向其他数据片段的名称数组，定义了缓存。为了在大橡树巢穴（Big\
  \ Oak nest）的存储球中搜索食物缓存，大乌鸦可以运行如下代码：\n\n```javascript\nimport {bigOak} from \".crow-tech\"\
  ;\nbigOak.readStorage(\"foodCaches\", caches => {\n  let firstCache = caches[0];\n\
  \  bigOak.readStorage(firstCache, info => {\n    console.log(info);\n  });\n});\n\
  ```\n\n这种编程风格是可行的，但缩进级别会随着每个异步操作而扩展，因为它会导致另一个函数。并发执行多个异步任务可能会变得奇怪。大乌鸦计算机的设计是为了通过请求-响应对进行交互。这意味着一个巢向另一个发送消息，另一个立即返回消息，并在消息上附回复。每条消息都标记有一个类型，该类型决定了如何控制它。你的代码可以为某些请求类型描述处理程序，当请求到达时，调用处理程序以提供回复。`.crow-tech`\
  \ 模块生成的布局生成了基于回调的交互函数。巢包含一个 `send` 方法来发送请求。它等待请求类型、目标巢名称和请求内容作为前三个参数，并期望接受一个函数作为第四个也是最后一个参数。\n\
  \n```javascript\nbigOak.send(\"Cow Pasture\", \"note\", \"Let's cow loudly at 7PM\"\
  , () => console.log(\"Note Delivered.\"));\n```\n\n但为了确保巢可以接收该请求，你必须指定一个名为“note”的请求类型。控制需要运行的请求的代码以及在所有巢中都可以接收此类类型消息的代码。让我们假设一只大乌鸦飞过并在所有巢上安装了我们的处理程序代码。\n\
  \n```javascript\nimport {defineRequestType} from \".crow-tech\";\n\ndefineRequestType(\"\
  note\", (nest, content, source, done) => {\n  console.log(`${nest.name} Received\
  \ Note: ${content}`);\n});\n```\n\n\n\n\n```javascript\ndone();\n\n});\n```\n\n\
  `defineRequestType` 函数描述了一种新类型的 `request`。示例添加了对“note”请求的支持，该请求向指定的 nest（嵌套节点）发送笔记。我们的实现调用了\
  \ `console.log`，以便我们可以检查请求是否到达。Nest 包含一个 `name` 属性，该属性持有其 `name`。\n\n传递给 `handler`\
  \ 的第四个参数 `done` 是回调函数，它在任务完成时被调用。如果你将 `handler` 的返回值作为 `response` 的值，这意味着 `request.handler`\
  \ 无法无法执行异步操作。执行异步操作的函数会在任务完成之前返回，并准备好一个回调函数，在任务结束时调用。在某种程度上，异步性是传染的。一个调用了异步执行函数的函数本身也是异步的，它必须利用回调来传递其结果。调用回调容易出错的，而且比简单地返回一个值要复杂得多。\n\
  \n## Promises\n\n当方法中存在值时，处理抽象方法会变得更简单。在异步操作的情况下，与其为函数在未来某个时间点被调用做准备工作，不如返回一个代表未来事件的对象。Promise（承诺）是一种可以在某个点完成并提供值的异步操作。当它的值可用时，它可以通知任何感兴趣的人。\n\
  \n构建 promise 最简单的方法是调用 `Promise.resolve()`。此函数保证你设置的值被封装在了一个 promise 中。如果它已经是一个\
  \ promise，则直接返回。否则，将立即创建一个新的 promise，并将你的值作为结果。\n\n```javascript\nlet fifteen =\
  \ Promise.resolve(15);\n\nfifteen.then(value => console.log(`Got ${value}`));\n\n\
  // → Got 15\n```\n\n为了实现 promise 的结果，请利用它的成员方法 `.then()`。它指示了一个当 promise 解析并提供值时要执行的回调函数。你可以为单个\
  \ promise 挂载多个回调函数，所有的回调都会被执行，即使它们是在 promise 已完成后才挂载的。`then` 方法还会返回另一个 promise，该\
  \ promise 将解析为 `handler` 函数返回的值。将 promise 视为一种将值转换为异步现实的设备是非常重要的。被承诺的值是一个在未来某个点可能存在或可能显示的值。以\
  \ promise 术语描述的计算是在是在在封装的值上运行的，并在值可用时异步执行。\n\n要构建一个 promise，请使用 `Promise` 作为构造函数。它包含一种特殊的布局，构造函数期望一个函数作为参数，它会立即调用该函数并传递一个可以用于解决\
  \ promise 的函数。这就是为读取存储函数构建基于 promise 的布局：\n\n```javascript\nfunction storage(nest,\
  \ name) {\n  return new Promise(resolve => {\n    nest.readStorage(name, result\
  \ => resolve(result));\n  });\n}\n\nstorage(bigOak, \"enemies\")\n  .then(value\
  \ => console.log(\"Got\", value));\n```\n\n这个异步函数返回了一个重要的值。\n\n## Failure\n\nJavaScript\
  \ 计算可能会通过输出异常而失败。网络请求可能会失败，或者某些异步代码计算产生异常。异步编程回调风格最常见的问题是，它很难确保失败能正确地暴露给回调函数。\n\n\
  一种通用方法是：回调的第一个参数用于指定失败的操作，第二个参数是操作完成时提供的值。此类回调函数总是检查它们是否获取了异常，并确保任何出现的问题（包括它们调用的函数输出的异常）都传递给正确的函数。它们可以在成功时执行减少，在失败时执行拒绝。\n\
  \n`call` 的 reduce 仅在任务成功完成时处理处理器，并自动在返回的新 promise 上执行拒绝。当 `handler` 输出异常时，这会自动触发其最近调用提供的\
  \ promise 的拒绝。\n\n当异步操作链中的某个元素失败时，整个链的输出都会拒绝，没有任何成功处理器会调用失败点之后的代码。就像解决 promise 会产生一个值，拒绝（reject）也会提供一个值，通常被称为拒绝原因（rejection\
  \ reason）。如果 `handler` 函数中的异常创建了拒绝，请使用 `exception` 值作为原因。\n\n相应的，当 `handler` 返回一个被拒绝的\
  \ promise 时，该拒绝将进入下一个 promise。有一个 `reject()` 函数，它会产生一个新的、立即被拒绝的 promise。如果 `catch`\
  \ 处理器输了错误，新的 promise 同样会被拒绝。简而言之，`then` 也接受一个拒绝 `handler` 作为第二个参数，因此你应该在单个方法调用中安装两种类型的处理器。\n\
  \n`Promise` 构造函数接受第二个参数（与 `resolve` 函数一起），它可以使用它来拒绝新的 promise。通过调用 `then` 开发的 `Promise`\
  \ 值链被视为流水线，异步值或失败在其中移动。由于这些链链是通过注册处理器构建的，因此每个链接都由一个成功 `handler` 或与其相关的拒绝 `handler`\
  \ 组成。与输出类型不匹配的处理器会被丢弃。但匹配的处理器会被调用，它们的输出决定了下一个值的类型：当返回非 promise 值时是成功，当输出异常时是拒绝，当返回其中之一时是该\
  \ promise 的结果。\n\n```javascript\nnew Promise((_, reject) => reject(new Error(\"\
  Fail\")))\n  .then(value => console.log(\"Handler A1\"))\n  .catch(reason => {\n\
  \    console.log(\"Caught Failure \" + reason);\n    return \"nothing\";\n  })\n\
  \  .then(value => console.log(\"Handler A2\", value));\n\n// → Handler A1 (因为失败了未被调用)\n\
  // → Caught Failure Error: Fail\n// → Handler A2 nothing\n```\n\n\n\n\n定期，跨越镜像系统前方总会有微光，用以传达信号正阻塞了信号的路径。信号本可以传输但被拦截或拒绝。通常，传输失败是意外事故，例如汽车大灯遮挡了光信号，而重新发送请求可能会使其成功。因此，让我们创建请求函数，并在停止之前尝试重试一次请求。而且，由于我们已经确定承诺（promises）是良好的，我们还将确保我们的请求函数返回一个\
  \ promise。在它们能指示的内容方面，promise 和回调（callbacks）是等价。基于回调的函数被封装以揭示基于 promise 的布局，反之亦然。即使请求和其回复成功传达，回复也可能指定失败，例如，如果请求尝试使用未描述的请求类型，或者处理程序输出了错误。为了辅助这一点，并定义\
  \ `defineRequestType` 以遵循之前声明的约定，发送给回调的第一个参数是失败的原因（如果有），第二个参数是确定的结果。我们的包装器会将它们解释为\
  \ promise 的解析成功（resolution）和拒绝（rejection）。\n\n```javascript\nclass Timeout extends\
  \ Error{}\n\nfunction request(nest, target, type, content) {\n  return new Promise((resolve,\
  \ reject) => {\n    let done = false;\n    function attempt(n) {\n      nest.send(target,\
  \ type, content, (failed, value) => {\n        done = true;\n        if (failed)\
  \ reject(failed);\n        else resolve(value);\n      });\n      setTimeout(()\
  \ => {\n        if (done) return;\n        else if (n < 3) attempt(n + 1);\n   \
  \     else reject(new Timeout(\"Timed Out\"));\n      }, 250);\n    }\n    attempt(1);\n\
  \  });\n}\n```\n\n因为 promise 只能被接受或拒绝一次，所以它可以工作。第一次调用 `resolve` 或 `reject` 决定了 promise\
  \ 的结果，任何其他调用都会被忽略。为了创建重试的异步循环，请使用递归函数，高效的循环不允许停止并等待异步操作。`attempt` 函数创建了传输请求的单尝试。它还指定了一个超时，如果在\
  \ 250 毫秒后有响应，则开始下一次尝试；或者如果是第四次尝试，则以 `Timeout` 实例作为原因拒绝 promise。每四分之一秒重试一次并在一秒后无响应时停止，如果请求出现这无疑是任意的，但处理程序传输请求几次可能需要更长时间。请在考虑这个问题时创建您的处理程序，耦合的消息并无害。为了完全将我们与回调分离，为\
  \ `defineRequestType` 定义一个封装，使处理程序函数能够返回 promise 或简单值，并连接为我们执行回调的代码。\n\n```javascript\n\
  function requestType(name, handler) {\n  defineRequestType(name, (nest, content,\
  \ source, callback) => {\n    try {\n      Promise.resolve(handler(nest, content,\
  \ source))\n        .then(response => callback(null, response),\n        failure\
  \ => callback(failure));\n    } catch (exception) {\n      callback(exception);\n\
  \    }\n  });\n}\n```\n\n`Promise.resolve` 用于将 `handler` 返回的值转换为 promise，如果它尚未就绪。\n\
  \n### Promise 集合\n\n每个巢穴（nest）计算机在其邻居的属性中存储一个传输距离内的其他巢穴的数组。要检查哪些是可用的，编写一个函数尝试向它们所有发送一个\
  \ \"ping\" 请求（要求响应的请求），并检查哪些返回了响应。如果你正在处理一组同时运行的 promise，`Promise.all` 函数非常重要。它返回一个\
  \ promise，等待数组中所有 promise 达成一致，然后稳定为这些 promise 提供的值的数组。如果任何 promise 被拒绝，`Promise.all`\
  \ 的结果也会被拒绝。\n\n```javascript\nrequestType(\"ping\", () => \"pong\");\n\nfunction\
  \ availableNeighbors(nest) {\n  let requests = nest.neighbors.map(neighbor => {\n\
  \    return request(nest, neighbor, \"ping\")\n      .then(() => true, () => false);\n\
  \  });\n  return Promise.all(requests).then(result => {\n    return nest.neighbors.filter((_,\
  \ i) => result[i]);\n  });\n}\n```\n\n### 网络泛洪\n\n巢穴只能与其邻居通信，这极大地影响了该网络的重要性。要向整个网络广播信息，解决方案是创建一种自动发送给邻居的请求类型。这些邻居随后将其发送给它们的邻居，直到整个网络都收集到消息。\n\
  \n```javascript\nimport {everywhere} from \"./a/crow-tech\";\n\neverywhere(nest\
  \ => {\n  nest.state.gossip = [];\n});\n\nfunction sendGossip(nest, message, exceptFor\
  \ = null) {\n  nest.state.gossip.push(message);\n  for (let neighbor of nest.neighbors)\
  \ {\n    if (neighbor == exceptFor) continue;\n    request(nest, neighbor, \"gossip\"\
  , message);\n  }\n}\n\nrequestType(\"gossip\", (nest, message, source) => {\n  if\
  \ (nest.state.gossip.include(message)) return;\n  console.log(`${nest.name} receive\
  \ Gossip '${message}' from ${source}`);\n  sendGossip(nest, message, source);\n\
  });\n```\n\n你可以避免在网络中永远传输相似的消息，每个巢穴都会保存它见过的 gossip 字符串数组。为了描述此数组，使用 `everywhere`\
  \ 函数，它在每个巢穴上运行代码，为巢穴的 `state` 对象附加属性。\n\n### 消息路由\n\n如果一个节点想要与另一个节点通信。最好的方法是构建一条路径，让消息从节点跳转到节点直到到达目的地。你需要理解网络的接口。要向远处的巢穴发送请求，知道哪个邻居巢穴可以完成工作是重要的。每个巢穴只知道其直接邻居，它无法计算路由，因为它缺乏信息。你必须理解如何将关于这些连接的信息传播到每个巢穴，以便在创建新巢穴时能够随时间发生转换。现在你可以使用泛洪，但不是检查消息是否被收集，而是检查给定巢穴的新邻居集是否与当前集合相似。\n\
  \n```javascript\nrequestType(\"connections\", (nest, {name, neighbors}, source)\
  \ => {\n  let connections = nest.state.connections;\n  if (JSON.stringify(connections.get(name))\
  \ == JSON.stringify(neighbors)) return;\n  connections.set(name, neighbors);\n \
  \ broadcastConnections(nest, name, source);\n});\n\nfunction broadcastConnections(nest,\
  \ name, exceptFor = null) {\n  for (let neighbor of nest.neighbors) {\n    if (neighbor\
  \ == exceptFor) continue;\n    request(nest, neighbor, \"connections\", {\n    \
  \  name,\n      neighbors: nest.state.connections.get(name)\n    });\n  }\n}\n\n\
  everywhere(nest => {\n  nest.state.connections = new Map();\n  nest.state.connection.set(nest.name,\
  \ nest.neighbors);\n  broadcastConnections(nest, nest.names);\n});\n```\n\n\n\n\
  Acomparison 工具利用了 `JSON.stringify`，因为对对象或数组使用 `==` 只有在两个者的 `value` 相同时才会返回 `true`。区分\
  \ `JSON` 字符串是比较它们内容非常有效的方法。节点会立即开始传输它们的连接（无法到达的嵌套除外），这为它们提供了现有网络图的地图。`findRoute`\
  \ 函数找到通往网络中每个节点的路径。但它不是返回整个路由，而是只返回下一步。下一个巢将使用其关于网络的现有信息，决定它将消息传输到哪里。\n\n```javascript\n\
  function findRoute(from, Ato, connections) {\n  let work = [{at: from, via: null}];\n\
  \  for (let i = 0; i < work.length; i++) {\n    let {at, via} = work[i];\n    for\
  \ (let next of connections.get(at) || []) {\n      if (next == Ato) return via;\n\
  \      if (!work.some(w => w.at == next)) {\n        work.push({at: next, via: via\
  \ || next});\n      }\n    }\n  }\n  return null;\n}\n```\n\n现在你可以创建一个可以跨距离发送消息的函数。如果消息附加到直接邻居，它将像常一样传递。如果不是，它将被封装在一个对象中，并通过一种“路由”请求类型传输到更接近目标的邻居，这会让该邻居重复相同的字符。\n\
  \n```javascript\nfunction routeRequest(nest, target, types, content) {\n  if (nest.neighbors.includes(target))\
  \ {\n    return request(nest, target, types, content);\n  } else {\n    let via\
  \ = findRoute(nest.name, target, nest.state.connections);\n    if (!via) throw new\
  \ Error(`No routes to A${target}`);\n    return request(nest, via, \"route\", {target,\
  \ type, content});\n  }\n}\n\nrequestType(\"route\", (nest, {target, type, content})\
  \ => {\n  return routeRequest(nest, target, type, content);\n});\n```\n\n我们在主通信系统的顶部创建了不同层的功能，以便方便使用。这是计算机网络工作的简化模型。\n\
  \n### 异步函数\n\n为了保存大量信息，行使用了去重方法，它们在各个巢之间进行复制。这样，当一只鸟拆除一个巢时，信息就不会丢失。为了恢复某个没有存储球的特定信息，巢计算机会与网络中随机其他巢通信，直到找到拥有该信息的巢为止。\n\
  \n```javascript\nrequestType(\"storage\", (nest, name) => storage(nest, name));\n\
  \nfunction findInStorage(nest, name) {\n  return storage(nest, name).then(found\
  \ => {\n    if (found != null) return found;\n    else return findInRemoteStorage(nest,\
  \ name);\n  });\n}\n\nfunction network(nest) {\n  return Array.from(nest.state.connections.keys());\n\
  }\n\nfunction findInRemoteStorage(nest, name) {\n  let sources = network(nest).filter(n\
  \ => n != nest.name);\n  function next() {\n    if (sources.length == 0) {\n   \
  \   return Promise.reject(new Error(\"Not Found\"));\n    } else {\n      let source\
  \ = sources[Math.floor(Math.random() * sources.length)];\n      sources = sources.filter(n\
  \ => n != source);\n      return routeRequest(nest, source, \"storage\", name)\n\
  \        .then(value => value != null ? value : next(), next);\n    }\n  }\n  return\
  \ next();\n}\n```\n\n`Object.keys` 无法作用于 `connections`，因为它是一个 `Map`。它包含一个 `key`\
  \ 方法，但它返回的是迭代器而不是数组。迭代器可以使用 `Array.from` 函数转换为数组。各种异步操作以不明确的方式结合在一起。现在你需要一个递归函数来模拟跨越巢的循环。在异步编程模型中，这很容易表达。JavaScript\
  \ 还允许你编写伪同步代码来定义异步计算。`async` 函数是一个完全返回 `Promise` 的函数，并且可以以异步方式 `await` 其他承诺。像这样重写\
  \ `findInStorage`：\n\n```javascript\nasync function findInStorage(nest, name) {\n\
  \  let local = await storage(nest, name);\n  if (local != null) return local;\n\
  \  let sources = network(nest).filter(n => n != nest.name);\n  while (sources.length\
  \ > 0) {\n    let source = sources[Math.floor(Math.random() * sources.length)];\n\
  \    sources = sources.filter(n => n != source);\n    try {\n      let found = await\
  \ routeRequest(nest, source, \"storage\", name);\n      if (found != null) return\
  \ found;\n    } catch (_) {}\n  }\n  throw new Error(\"Not Found\");\n}\n```\n\n\
  `async` 函数也用 `async` 关键字标记。当你调用一个 `async` 函数时，它返回一个 `Promise`。当你 `await` 一个表达式时，该承诺会被决议并返回结果。如果函数输出异常，该承诺会被拒绝。`await`\
  \ 关键字只能在 `async` 函数内部使用。\n\n### 生成器\n\n`Async` 函数不使用 `yield` 关键字。生成器类似，但它们不包含承诺。当你调用一个带有星号\
  \ `*` 名的函数时，它返回一个迭代器。\n\n```javascript\nfunction* powers(n) {\n  for (let current\
  \ = 1; current <= n; current *= n) {\n    yield current;\n  }\n}\n\nfor (let power\
  \ of powers(3)) {\n  if (power > 50) break;\n  console.log(power);\n}\n// → 3\n\
  // → 9\n// → 27\n```\n\n通常，如果你调用一个生成器，函数会从开始运行。每当你对迭代器调用 `next()` 时，函数将运行到遇到 `yield`\
  \ 表达式，这会暂停执行并返回提供给迭代器的值。当函数返回时，迭代器完成。利用生成器函数编写迭代器非常简单。使用这个生成器为 `Group` 类编写迭代器：\n\
  \n```javascript\nGroup.prototype[Symbol.iterator] = function*() {\n  for (let i\
  \ = 0; i < this.members.length; i++) {\n    yield this.members[i];\n  }\n};\n```\n\
  \n\n\n异步程序一个接一个地执行。每一个动作都会开始并安排一段代码来执行，直到该动作完成或失败。\n\n在 `these` `pieces` `之间`，`program`\
  \ 会执行 `anything`，`awaiting` 下 `next` `action`。因此，你无法通过 `arranged` 它们的 `code` 来调用\
  \ `callbacks`。如果你在 `function` `inside` 调用 `setTimeout`，那么该 `function` 在 `callback`\
  \ `function` 被调用之前就已经返回了。`Asynchronous` `character` 发生在它空的 `function` `stack`（调用栈）上。由于每个\
  \ `callback` 都开始于一个空的 `stack`，因此当 `exception` 运行时，你的 `catch` `handlers` 将不会在 `stack`\
  \ 上。\n\n```javascript\ntry {\n  setTimeout(() => {\n    throw new Error(\"Woosh\"\
  );\n  }, 20);\n} catch (_) {\n  // This will Not Arun\n  console.log(\"Caught!\"\
  );\n}\n```\n\n无论超时或传入请求等事件如何发生，`JavaScript` 环境一次只运行一个程序。当有事情要做时，`loop` 会停止。但随着事件进入，它们会被附加到\
  \ `queue` 中，它们的 `code` 一个接一个地执行。因为两个事情不会同时运行，长时间的 `code` 可能会阻塞其他事件的 `handling`。下面的示例设置了一个\
  \ `timeout`，但也持续到了 `timeout` 固定时间点之后，导致 `timeout` 变晚。\n\n```javascript\nlet start\
  \ = Date.now();\nsetTimeout(() => {\n  console.log(\"Timeout At\", Date.now() -\
  \ start);\n}, 20);\n\nwhile (Date.now() < start + 50) {}\n\nconsole.log(\"Wasted\
  \ time until\", Date.now() - start);\n// → Wasted time until 50\n// → Timeout at\
  \ 55\n```\n\n`Promises.resolve` 或 `decline` 是一个新的 `event`。即使一个 `promise` 已经解析完成，`awaiting`\
  \ 它会让你的 `callback` 在现有 `script` 完成后运行，而不是立即运行。\n\n```javascript\nPromise.resolve(\"\
  Done\").then(console.log);\nconsole.log(\"Me first!\");\n// → Me first!\n// → Done\n\
  ```\n\n### 异步 Bug\n\n当你异步运行你的程序时，除了程序本身发生的转换之外，没有给定的转换。但当你运行一个异步程序时，这是另一种情况。它们在执行期间可能包含其他代码可以利用的间隙。下面是一个说明。我们乌鸦最喜欢的之一是列举每年村子里孵化的\
  \ `chicks` 数量。巢在它们的存储球泡中保存此计数。下面的代码尝试计算某一年每个巢的计数：\n\n```javascript\nfunction anyStorage(nest,\
  \ source, name) {\n  if (source == Nest.names) return storage(nest, name);\n  else\
  \ return routeRequest(nest, source, \"storage\", name);\n}\n\nasync function chicks(nest,\
  \ year) {\n  let list = \"\";\n  await Promise.all(network(nest).map(async name\
  \ => {\n    list += `${name}: ${\n      await anyStorage(nest, names, `chicks in\
  \ ${year}`)\n    }\\n`;\n  }));\n  return list;\n}\n```\n\n`async` 名字 `=>` 显示箭头函数通过在它们前面放置\
  \ `async` 单词也变为了 `async`。这段代码跨越整个巢集合绘制 `async` 箭头函数，构建一个 promise 数组，并利用 `Promise.all`\
  \ 在返回它们创建的列表之前进行 `await`。但它是坏的。它会返回单行输出，列出响应最慢的巢。你知道为什么吗？\n\n问题出在 `+=` 运算符上，它在语句开始执行时获取\
  \ list 的当前值，而当 `await` 结束时，它将 list 绑定设置为加上添加字符串后的值。但在语句的开始和结束之间，存在一个异步间隙。`map` 表达式是在你向列表添加任何内容之前运行的，因此每个\
  \ `+=` 运算符都从空值开始。\n\n```javascript\nasync function chicks(nest, year) {\n  let lines\
  \ = network(nest).map(async name => {\n    return name + await anyStorage(nest,\
  \ names, `chicks in ${year}`);\n  });\n  return await Promise.all(lines).join(\"\
  \\n\");\n}\n```\n\n### 总结\n\n我们在这一章中学习了关于异步编程的所有知识。异步编程允许表达式在等待的情况下等待动作。JavaScript\
  \ 环境通常使用这种风格的回调，即动作结束时执行的函数。一个事件循环一个一个创建一个以避免重叠。\n\n### 练习\n\n编写一个 JavaScript 程序将一个异步函数转换为返回\
  \ promise。\n\n### 答案\n\n![0164.jpg](img/0164.jpeg)\n\n## 第 13 章：解析\n\n\n\n\n语言的一致性意味着\
  \ JavaScript 中的操作符（如 `>`）在本文语言中被称为绑定（bindings），其用法与其他函数类似。此外，语法包含一个“零块”概念，因此需要一种结构来表示连续运行多个项。解析器利用数据布局来定义一个包含表达式对象的程序。每个对象都包含一个\
  \ `type` 属性来表示表达式类型，以及其他几个属性来确定其内容。类型为 `\"value\"` 的表达式表示字符串或数字。它们的 `value` 属性由它们所代表的字符串或数字组成。类型为\
  \ `\"word\"` 的表达式用于标识符（名称）。这类类型的对象包含一个 `name` 属性，以字符串形式持有标识符的标题。而 `\"apply\"` 表达式表示应用。它们包含一个\
  \ `operator` 属性，用于引用被调用的表达式，以及一个 `args` 属性，该属性包含一个参数表达式的数组。\n\n新程序中的 `> (x, 5)`\
  \ 部分如下：\n\n```javascript\n{\n  type: \"apply\",\n  operator: {type: \"word\", name:\
  \ \">\"},\n  args: [\n    {type: \"word\", name: \"x\"},\n    {type: \"value\",\
  \ value: 5}\n  ]\n}\n```\n\n我们描述了一个函数 `parseExpression`，它识别字符串作为输入并返回一个对象，该对象包含字符串开头表达式的数据布局，以及解析该表达式后剩余的字符串部分。当你解析子表达式时，可以再次调用此函数，并将剩余文本传递给参数表达式。这段文本可能包含更多参数，或者是结束参数列表的右括号。\n\
  \n以下是解析器的第一部分：\n\n```javascript\nfunction parseExpression(program) {\n  program\
  \ = skipSpace(program);\n  let match, expr;\n\n  if (match = /^\"([^\"]*)\"/.exec(program))\
  \ {\n    expr = {type: \"value\", value: match[1]};\n  } else if (match = /^\\d+\\\
  b/.exec(program)) {\n    expr = {type: \"value\", value: Number(match[0])};\n  }\
  \ else if (match = /^[^\\s(),#\"]+/.exec(program)) {\n    expr = {type: \"word\"\
  , name: match[0]};\n  } else {\n    throw new SyntaxError(\"Unexpected Syntax: \"\
  \ + program);\n  }\n\n  return parseApply(expr, program.slice(match[0].length));\n\
  }\n\nfunction skipSpace(string) {\n  let first = string.search(/\\S/);\n  if (first\
  \ == -1) return \"\";\n  return string.slice(first);\n}\n```\n\n### 求值器 (The Evaluator)\n\
  \n求值器用于运行程序的语法树。它包含语法树和一个将名称与值关联的作用域对象（scope object），它将访问树所代表的表达式并返回其提供的值。\n\n```javascript\n\
  const specialForms = Object.create(null);\n\nfunction evaluate(expr, scope) {\n\
  \  if (expr.type == \"value\") {\n    return expr.value;\n  } else if (expr.type\
  \ == \"word\") {\n    if (expr.name in scope) {\n      return scope[expr.name];\n\
  \    } else {\n      throw new ReferenceError(`Undefined Binding: ${expr.name}`);\n\
  \    }\n  } else if (expr.type == \"apply\") {\n    let {operator, args} = expr;\n\
  \    if (operator.type == \"word\" && operator.name in specialForms) {\n      return\
  \ specialFormsoperator.name;\n    } else {\n      let op = evaluate(operator, scope);\n\
  \      if (typeof op == \"function\") {\n        return op(...args.map(arg => evaluate(arg,\
  \ scope)));\n      } else {\n        throw new TypeError(\"Applying a Anon-function.\"\
  );\n      }\n    }\n  }\n}\n```\n\n求值器包含了每个表达式类型的代码。字面量值表达式提供其值。对于绑定，检查它是否在作用域中被描述，如果是，获取绑定的值。如果它包含一个不访问任何内容的特殊形式，并将参数表达式连同作用域传递给影响该形式的函数。如果调用是非典型的，访问操作符，确定它是否为函数，并使用可用的参数调用它。利用通用的\
  \ JavaScript 函数 `valuesTo` 来代表 Egg 函数的值。求值的递归布局与解析器的布局相似，两者都镜像了语言的结构。你可以在解析时将解析器与求值器以及\
  \ `evaluate` 结合，但将它们分离可以提供更清晰的程序视图。这就是组合 Egg 所需的一切。\n\n### 特殊形式 (Special Forms)\n\
  \n`specialForms` 对象描述了 Egg 中独特的语法。它将单词与此类形式的形式关联起来。目前它是空的。让我们插入一个：\n\n```javascript\n\
  specialForms.if = (args, scope) => {\n  if (args.length != 3) {\n    throw new SyntaxError(\"\
  Wrong number of arguments\");\n  } else if (evaluate(args[0], scope) !== false)\
  \ {\n    return evaluate(args[1], scope);\n  } else {\n    return evaluate(args[2],\
  \ scope);\n  }\n};\n```\n\n三元运算符 `?` 期望三个参数。它将访问第一个，如果值不是 false，则返回第二个；否则返回第三个。这看起来像\
  \ JavaScript 的 `?:` 运算符，但 Egg 是一个表达式。\n\n```javascript\nspecialForms.? = (args,\
  \ scope) => {\n  if (args.length != 3) {\n    throw new SyntaxError(\"Wrong number\
  \ of arguments\");\n  } else if (evaluate(args[0], scope) !== false) {\n    return\
  \ evaluate(args[1], scope);\n  } else {\n    return evaluate(args[2], scope);\n\
  \  }\n};\n```\n\n`if` 结构期望两个参数。如果条件不是 false，则返回该值，否则返回 false。\n\n```javascript\n\
  specialForms.if = (args, scope) => {\n  if (args.length != 2) {\n    throw new SyntaxError(\"\
  Wrong number of arguments\");\n  } else if (evaluate(args[0], scope) !== false)\
  \ {\n    return evaluate(args[1], scope);\n  } else {\n    return false;\n  }\n\
  };\n```\n\n`do` 块从上到下执行参数。提供的值是最后一个参数。\n\n```javascript\nspecialForms.do = (args,\
  \ scope) => {\n  let value = false;\n  for (let arg of args) {\n    value = evaluate(arg,\
  \ scope);\n  }\n  return value;\n};\n```\n\n为了构建绑定并设置新值，你应该构建一个名为 `define` 的形式。它等待两个参数：要的名称和提供值的表达式。由于\
  \ `define` 是一个表达式，它必须返回被设置的值。\n\n```javascript\nspecialForms.define = (args, scope)\
  \ => {\n  if (args.length !== 2 || args[0].type !== \"word\") {\n    throw new SyntaxError(\"\
  Incorrect use of define\");\n  }\n  let value = evaluate(args[1], scope);\n  scope[args[0].name]\
  \ = value;\n  return value;\n};\n```\n\n### 环境 (The Environment)\n\n环境是一个包含少量属性的对象，其名称被绑定到值。为了能够利用前面的布尔值，你所做的就是将两个名称绑定到\
  \ `true` 和 `false` 值。\n\n```javascript\nconst topScope = Object.create(null);\n\
  topScope.true = true;\ntopScope.false = false;\n```\n\n\n\n\n为了提供基础的算术运算符和比较运算符，我们将函数值加入一个作用域。我们将在循环中对几个运算符函数使用函数，而不是逐个声明它们。\n\
  \n```javascript\nfor (let op of [\"+\", \"-\", \"*\", \"/\", \"==\", \"<\", \">\"\
  ]) {\n  topScope[op] = Function(\"a, b\", `return a ${op} b;`);\n}\n```\n\n我们将 `console.log`\
  \ 封装在一个函数中输出值，并将其命名为 `print`。\n\n```javascript\ntopScope.print = value => {\n  console.log(value);\n\
  \  return value;\n};\n```\n\n这为编写简单的程序、在新的作用域中分析和运行程序提供了充足的底层工具：\n\n```javascript\n\
  function run(program) {\n  return evaluate(parse(program), Object.create(topScope));\n\
  }\n```\n\n`object prototype` 链将代表嵌套作用域，允许在不改变高层作用域的情况下添加绑定。\n\n```javascript\nrun(`\n\
  do(define(total, 0),\ndefine(count, 1),\nwhile(<(count, 11),\ndo(define(total, +(total,\
  \ count)),\ndefine(count, +(count, 1)))),\nprint(total))\n`);\n```\n\n// → 55\n\n\
  这个概念解释了从 1 到 10 的数字和，正如蛋里所示的那样。\n\n### Functions\n\n一个没有函数的编程语言是非常糟糕的，尽管插入一个使用最后一个参数作为函数体的函数是很容易的。它利用在此之前的每个参数用作函数的参数名。\n\
  \n```javascript\nspecialForms.fun = (args, scope) => {\n  if (!args.length) {\n\
  \    throw new SyntaxError(\"Functions need a body\");\n  }\n  let body = args[args.length\
  \ - 1];\n  let param = args.slice(0, args.length - 1).map(expr => {\n    if (expr.type\
  \ != \"word\") {\n      throw new SyntaxError(\"Parameter names must be words\"\
  );\n    }\n    return expr.name;\n  });\n\n  return function() {\n    if (arguments.length\
  \ != param.length) {\n      throw new TypeError(\"Wrong number of arguments\");\n\
  \    }\n    let localScope = Object.create(scope);\n    for (let i = 0; i < arguments.length;\
  \ i++) {\n      localScope[param[i]] = arguments[i];\n    }\n    return evaluate(body,\
  \ localScope);\n  };\n};\n```\n\n`egg functions` 有它们自己的局部作用域。由 `fun` 形式提供的函数构建了这个局部作用域并将参数绑定到其上。它随后在该作用域中访问函数体并返回结果。\n\
  \n```javascript\nrun(`\ndo(define(plusOne, fun(a, +(a, 1))),\nprint(plusOne(10)))\n\
  `);\n```\n\n// → 11\n\n```javascript\nrun(`\ndo(define(pow, fun(base, exp,\nif(==(exp,\
  \ 0),\n1,\n*(base, pow(base, -(exp, 1)))))),\nprint(pow(2, 10)))\n`);\n```\n\n//\
  \ → 1024\n\n### Summary\n\n我们在本章中涵盖了解析、函数、特殊形式和评估器。符号或语法是编程的每一个重要方面。`parser` 读取文本并提供一种显示文本中程序布局的数据结构。如果文本创建了无效程序，`parser`\
  \ 将指示错误。\n\n### Exercise\n\n编写一个 JavaScript 函数来计算正整数的因数。\n\n### Solution\n\n![00114.jpg](img/00114.jpeg)![00112.jpg](img/00112.jpeg)\n\
