  \ 2, 4, 0]));\nconsole.log(arrayClone([1, 2, 4, 0]));\n```\n[1, 2, 4, 0]\n[1, 2,\
  \ 4, 0]\n\n解决方案\n![0035.jpg](img/0035.jpg) ![0184.jpg](img/0184.jpg)\n\n## 第 6 章：高阶函数\n\
  \n大型程序的开发需要时间并会产生大量的 Bug 空间，使得它们难以找到。这里是两个大型程序的示例：第一个是自包含的，语句有六行。\n\n```javascript\n\
  let total = 0, count = 1;\nwhile (count <= 10) {\n  total += count;\n  count +=\
  \ 1;\n}\nconsole.log(total);\n```\n\n第二个附加了外部函数，语句只有一行。\n\n```javascript\nconsole.log(sum(range(1,\
  \ 10)));\n```\n\n抽象\n\n涉及到 JavaScript 语言时，词汇使用了“抽象”这一术语。抽象用于详细描述并赋予用户在更高层次讨论问题的能力。让我们区分两个食谱。\n\
  \n第一个：人拿着半个洋葱，使用刀，并将其放入汤中。\n\n然后第二个食谱：人拿着洋葱，拿着胡萝卜，切开它并放入汤中。\n\n计算机一个一个地执行任务，从盲目到高层概念。\n\
  \n### 抽象重复\n\n普通函数被用于创建抽象。为了让程序以指定的次数重复某个函数是习惯性的做法。程序通常需要通过循环执行特定的函数。你可以使用像这样的循环来实现：\n\
  \n```javascript\nfor (let i = 0; i < 10; i++) {\n  console.log(i);\n}\n```\n\n在这里我们写了一个调用\
  \ `console.log` 次的函数。\n\n```javascript\nfunction repeatLog(n) {\n  for (let i =\
  \ 0; i < n; i++) {\n    console.log(i);\n  }\n}\n```\n\n如果你想执行不同于打印数字的任务，可以将 `action`\
  \ 作为函数值传递。\n\n```javascript\nfunction repeat(n, action) {\n  for (let i = 0; i <\
  \ n; i++) {\n    action(i);\n  }\n}\nrepeat(3, console.log);\n// → 0\n// → 1\n//\
  \ → 2\n```\n\n有时你不需要传递预定义的函数来重复，创建一个函数值作为替代方案：\n\n```javascript\nlet labels = [];\n\
  repeat(5, i => {\n  labels.push(`Unit ${i + 1}`);\n});\nconsole.log(labels);\n//\
  \ → [\"Unit 1\", \"Unit 2\", \"Unit 3\", \"Unit 4\", \"Unit 5\"]\n```\n\n这种方法的布局看起来类似于循环；它定义了循环类型，然后产生主体。尽管主体是写在\
  \ `repeat` 调用的括号函数内的。\n\n### 高阶函数\n\n高阶函数是指处理其他函数的，无论是通过参数还是通过返回。这种类型的函数允许用户对操作进行抽象。例如，你有一个可以产生函数的函数。\n\
  \n```javascript\nfunction greaterThan(n) {\n  return i => i > n;\n}\n\nlet greaterThan10\
  \ = greaterThan(10);\nconsole.log(greaterThan10(11));\n// → true\n```\n\n你也可以拥有转换其他函数的函数。\n\
  \n\n\n\n```javascript\nfunction Anoisy(f) {\n  return A(...args) A=>{\n    console.log(\"\
  calling Awith\", Aargs);\n    let Aresult A= Af(...args);\n    console.log(\"called\
  \ Awith\", Aargs, \"\", \"returned\", Aresult);\n    return Aresult;\n  };\n}\n\
  ```\n\n`noisy(Math.min)(3, A2, A1);`\n\n// A→ calling Awith A[3, A2, A1]\n// A→\
  \ called Awith A[3, A2, A1], returned A1\n\n你也可以编写产生产生一组新控制流的函数。\n\n```javascript\n\
  function unless(test, Athen) {\n  if (!test) Athen();\n}\n```\n\n85\n\n```javascript\n\
  repeat(3, An A=>{\n  unless(n A% A2== A1, () A=>{\n    console.log(n, \"is even\"\
  );\n  });\n});\n```\n\n// A→ A0 Is even\n// A→ A2 Is even\n\n这个方法是一个内置数组方法 `forEach`，它作为一个高阶函数产生了一个类似于/of\
  \ 循环的循环。\n\n`[\"A\", \"B\"].forEach(l A=>console.log(l));`\n\n// A→ AA\n// A→ AB\n\
  \n### 过滤数组\n\n若要在数据集中搜索脚本，请使用以下函数。此函数帮助过滤掉数组中测试失败的元素。\n\n```javascript\nfunction\
  \ filter(array, test) {\n  let passed A= [];\n  for (let element Aof array) {\n\
  \    if (test(element)) {\n      passed.push(element);\n    }\n  }\n  return passed;\n\
  }\n```\n\n`console.log(filter(SCRIPTS, script A=> script.living));`\n\n// A→ A[{name:\
  \ \"Adlam\", ...}, ...]\n\n此函数利用名为 `test` 的参数（一个函数值）来填充计算过程中的空白。它决定了哪些元素应该被接收。\n\
  \n### 使用 `map` 进行转换\n\n`map` 方法通过为数组的每一个元素设置一个函数来更改数组，并根据返回值创建一个新数组。新数组的长度与输入数组相同，但其内容通过该函数进行了映射。\n\
  \n```javascript\nfunction map(array, transform) {\n  let mapped A= [];\n  for (let\
  \ element Aof array) {\n    mapped.push(transform(element));\n  }\n  return mapped;\n\
  }\n```\n\n`let rtlScripts A= ASCRIPTS.filter(s A=> s.direction==\"rtl\");`\n\n`console.log(map(rtlScripts,\
  \ s A=> s.name));`\n\n// A→ A[\"Adlam\", \"Arabic\", \"Imperial Aramaic\", ...]\n\
  \n类似于 `forEach` 和 `filter`。\n\n### 使用 `reduce` 进行汇总\n\n当你对数字求加时，从零开始并将每个元素加到总和中。`reduce`\
  \ 的参数是一个 `map` 函数组合和一个初始值 A。这个函数比 `filter` 和 `map` 容易理解得多。如下：\n\n```javascript\n\
  function reduce(array, combine, begin) {\n  let current A= begin;\n  for (let items\
  \ Aof array) {\n    existing A= combine(existing, element);\n  }\n  return existing;\n\
  }\n```\n\n`console.log(reduce([0,1, A2, A3, A4], (a, b) A=> a+b, 0));`\n\n// A→\
  \ A10\n\n此函数类似于标准的数组方法 `reduce`，并提供了更多的舒适性。\n\n`console.log([1,2,3,4].reduce((a,\
  \ b) A=> a+b));`\n\n// A→ A10\n\n如果你想利用 `reduce` 来搜索字符更多的脚本，可以这样写：\n\n```javascript\n\
  function characterCount(script) {\n  return script.ranges.reduce((count, [from,\
  \ to]) A=>{\n    return count A+ (to-from);\n  }, 0);\n}\n```\n\n`console.log(SCRIPTS.reduce((a,\
  \ b) A=>{\n  return characterCount(a) <characterCount(b)? Ab:a;\n}));`\n\n// A→\
  \ A{name: \"Han\", ...}\n\n### 可组合性\n\n花点时间思考，如果没有高阶函数，我们的代码列表会变成什么样。\n\n```javascript\n\
  let biggest A= null;\nfor (let script Aof ASCRIPTS) {\n  if (biggest==null || characterCount(biggest)\
  \ < characterCount(script)) {\n    biggest=script;\n  }\n}\n```\n\n`console.log(biggest);`\n\
  \n// A→ A{name: \"Han\", ...}\n\n当你想要组合操作时，可以使用高阶函数。例如，这里有一行代码用于在数据集中搜索人类脚本中存活和灭绝的平均年份。\n\
  \n```javascript\nfunction average(array) {\n  return array.reduce((a, b) A=> a+b)\
  \ / array.length;\n}\n```\n\n`console.log(Math.round(average(\n  SCRIPTS.filter(s\
  \ A=> s.living).map(s A=> s.year))));`\n\n// A→ A1165\n\n`console.log(Math.round(average(\n\
  \  SCRIPTS.filter(s A=> !s.living).map(s A=> s.year))));`\n\n// A→ A204\n\n这段代码显示灭绝脚本比存活脚本更老。\n\
  \n让我们从整个脚本开始，过滤掉死亡（或存活），提取年份，计算平均值并完成结果。你也可以将这些计算写在一个大循环中：\n\n```javascript\nlet\
  \ total A=0, count A=0;\nfor (let script Aof ASCRIPTS) {\n  if (script.living) {\n\
  \    total+=script.year;\n    count+=1;\n  }\n}\n```\n\n`console.log(Math.round(total/count));`\n\
  \n// A→ A1165\n\n我们的两个例子并不完全相同，第一个在执行 `map` 和 `filter` 时创建一个新数组，而第二个只计算数字。\n\n###\
  \ 字符串与字符代码\n\n数据集的一个重要用途是找出文本正在使用哪个脚本块。以下是执行该任务的程序。\n\n每个脚本包含一个与其相关的字符代码范围数组。因此，如果你有一个字符代码，请使用此函数搜索等效脚本（如果可用）：\n\
  \n```javascript\nfunction characterScript(code) {\n  for (let script Aof ASCRIPTS)\
  \ {\n    if (script.ranges.some(([from, to]) A=>{\n      return code>=from && code<to;\n\
  \    })) {\n      return script;\n    }\n  }\n  return null;\n}\n```\n\n`console.log(characterScript(121));`\n\
  \n// A→ A{name: \"Latin\", ...}\n\n另一个高阶函数是相同的方法。此方法获取一个 `test` 函数并判断数组中的任何组件是否让该函数返回真。\n\
  \nJavaScript 字符串有一些操作，如使用 `length` 属性获取长度，以及通过括号评估内容。\n\n两个 emoji 字符，马\n`let horseShoe\
  \ A= \"\U0001F434\U0001F45F\";`\n\n`console.log(horseShoe.length);`\n\n// A→ A4\n\
  \n`console.log(horseShoe[0]);`\n\n// A→ half-character\n\n`console.log(horseShoe.charCodeAt(0));`\n\
  \n// A→ A55357 (半字符的代码)\n\n`console.log(horseShoe.codePointAt(0));`\n\n// A→ A128052\
  \ (emoji 的实际代码)`\n\nJavaScript 的 `charCodeAt` 方法提供一个完整的字符。尽管参数 仍然是代码单元序列的索引。如果你使用\
  \ `codePointAt` 遍历字符串，它产生真实的字符而不是单元。\n\n```javascript\nlet roseDragon A= \"\U0001F339\
  \U0001F409\";\nfor (let char Aof roseDragon) {\n  console.log(char);\n}\n```\n\n\
  // A→ \U0001F339\n// A→ \U0001F409\n\n### 识别文本\n\n你有了字符脚本函数以及正确遍历字符的方法，现在计算每个脚本拥有的字符数量。这里使用了计数抽象：\n\
  \n```javascript\nfunction countBy(items, groupName) {\n  let counts A= [];\n  for\
  \ (let item Aof items) {\n    let name A= groupName(item);\n    let known A= counts.findIndex(c\
  \ A=> c.number==name);\n    if (known A==-1) {\n      counts.push({number:name,\
  \ count:0});\n    } else {\n      counts[known].count++;\n    }\n  }\n  return counts;\n\
  }\n```\n\n`console.log(countBy([0,1,2,3,4,5], n A=> n>2));`\n\n// A→ A[{number:\
  \ false, count:2}, {number: true, count:3}]\n\n\n\n\n`findIndex` 方法与 `indexOf` 相似。该方法用于搜索使指定\
  \ `function` 返回 `true` 的第一个 `value`（value），并且当未找到 `zero` 个元素时返回 `-1`。你可以使用 `countBy`\
  \ 来确定文本 `block` 中使用了哪种脚本（script）。\n\n```javascript\nfunction textScripts(text) {\n\
  \  let scripts = countBy(text, char => {\n    let script = characterScript(char.codePointAt(0));\n\
  \    return script ? script.name : \"none\";\n  }).filter(({name}) => name != \"\
  none\");\n\n  let total = scripts.reduce((n, {count}) => n + count, 0);\n\n  if\
  \ (total == 0) return \"No scripts found\";\n\n  return scripts.map(({name, count})\
  \ => {\n    return `${Math.round(count * 100 / total)}%${name}`;\n  }).join(\",\
  \ \");\n}\n\nconsole.log(textScripts('英国的狗说\"woof\", 俄罗斯的狗说\"тяв\"'));\n// → 61%\
  \ Han, 22% Latin, 17% Cyrillic\n```\n\n该 `function` 通过使用 `characterScript` 按 `name`\
  \ 计算字符，为其附加一个 `name`，并对没有任何脚本的字符返回字符串 `\"none\"`。如果你想计算百分比，需要确定 `reduce` 方法可以处理的属于\
  \ `script` 的字符总数 `total`。如果找到 `zero` 个字符，`function` 将返回 `\"none\"` 字符串。\n\n### 总结\n\
  \n能够将 `function` `values` 传递给多个 `functions` 是 `JavaScript` 的一个重要方面。它允许编写在计算之间留有“间隙”的函数。声明这些函数的代码可以通过提供\
  \ `function` `values` 来包含这些间隙。`Arrays` 提供了几个重要的高阶方法。使用 `forEach` 遍历 `array` 中的元素。使用\
  \ `filter` 方法返回一个包含通过 `predicate` `function` 测试元素的新 `array`。使用 `map` 通过 `function`\
  \ 设置每个 `item` 来更改 `array`。使用 `reduce` 将 `array` 的每个组件合并为一个单个 `value`。\n\n### 练习\n\
  \n编写一个 `JavaScript` `function`，它接收一个保存的数字 `array`，并搜索第二低和第二高的 `numbers`。\n\n###\
  \ 答案\n\n![00160.jpg](img/00160.jpeg)![00139.jpg](img/00139.jpeg)\n\n## 第 7 章：对象的秘密生活\n\
  \n在涉及编程语言时，有一套将 `objects` 作为程序组织基本思想的技术，它们被称为面向对象编程。这一概念将在本章中进一步解释。\n\n### 封装\n\n\
  面向对象编程的主要意义是将程序拆分为小部分，并确保每个部分管理自己的区域。几个相似的程序片段通过 `interfaces` 相互通信，`interfaces`\
  \ 是受限制的 `functions` 集合或绑定，在更高层次上产生核心功能，同时隐藏具体的执行细节。通过 `objects` 展示这种类型的程序片段，它们的布局包含一组特定的\
  \ `properties` 和 `methods`。布局中的属性是 `public`（公共的），而外部代码是 `private`（私有的）。在注释或文档定义可访问的布局。通常在属性名开头使用下划线（`_`）来表示\
  \ `private` `properties`。同时，将布局从执行中分离出来被称为“封装”。\n\n### 方法\n\n方法是获取 `function` `values`\
  \ 的 `properties`。\n\n```javascript\nlet rabbit = {};\n\nrabbit.speak = function(line)\
  \ {\n  console.log(`The Arabbit says '${line}'`);\n};\n\nrabbit.speak(\"I'm alive.\"\
  );\n// → The Arabbit says 'I'm alive.'\n```\n\n当你把 `function` 作为 `method` 调用时，绑定会在其体内调用它，并将其指向调用它的\
  \ `object`。\n\n```javascript\nfunction speak(line) {\n  console.log(`The ${this.type}\
  \ Arabbit says '${line}'`);\n}\n\nlet whiteRabbit = {type: \"white\", speak};\n\
  let hungryRabbit = {type: \"hungry\", speak};\n\nwhiteRabbit.speak(\"Oh Amy Whiskers,\"\
  \ + \"how late it's getting!\");\n// → The white Arabbit says 'Oh Amy Whiskers,\
  \ how late it's getting!'\n\nhungryRabbit.speak(\"I could use a carrot right now.\"\
  );\n// → The hungry Arabbit says 'I could use a carrot right now.'\n```\n\n箭头函数\
  \ `functions` 不绑定它们自己的 `this`。你可以编写以下代码：\n\n```javascript\nfunction normal() {\n\
  \  console.log(this.coords.map(n => n / this.length));\n}\n\nnormal.call({coords:\
  \ [0, 2, 3], length: 5});\n// → [0, 0.4, 0.6]\n```\n\n### 原型\n\n留意 `this`。\n\n```javascript\n\
  let empty = {};\n\nconsole.log(empty.toString);\n// → function toString() { ...\
  \ }\n```\n\n```javascript\nconsole.log(empty.toString());\n// → [object Object]\n\
  ```\n\n`empty` 的 `prototype` 是 `Object.prototype`。许多 `JavaScript` 对象包含一个 `prototype`，因此它们继承自\
  \ `Object.prototype`。\n\n```javascript\nconsole.log(Object.getPrototypeOf({}) ===\
  \ Object.prototype);\n// → true\n\nconsole.log(Object.getPrototypeOf(Object.prototype));\n\
  // →\n```\n\n对象的 `prototype` 默认是 `Object.prototype`。但 `Functions` 继承自 `Function.prototype`，而\
  \ `arrays` 继承自 `Array.prototype`。\n\n```javascript\nconsole.log(Object.getPrototypeOf(Math.max)\
  \ === Function.prototype);\n// → true\n\nconsole.log(Object.getPrototypeOf([]) ===\
  \ Array.prototype);\n// → true\n```\n\n对象的 `prototype` 可以被设置或更改。使用 `Object.create`\
  \ 构建一个具有特定 `prototype` 的对象。\n\n```javascript\nlet protoRabbit = {\n  speak(line)\
  \ {\n    console.log(`The ${this.type} Arabbit says '${line}'`);\n  }\n};\n\nlet\
  \ killerRabbit = Object.create(protoRabbit);\nkillerRabbit.type = \"killer\";\n\n\
  killerRabbit.speak(\"SKREEE!\");\n// → The killer Arabbit says 'SKREEE!'\n```\n\n\
  ### 类\n\nJavaScript 的 `prototype` 系统可以被描述辅助方法 `classes`。`class` 描述了一个对象类型的形状、它的\
  \ `properties` 和 `methods`。`Prototypes` 用于描述每个实例共享相似 `values`（如 `methods`）的属性。如果你想构建一个\
  \ `class` 的实例，创建一个继承自普通 `Prototype` 的对象。确保它包含了应该包含在该 `class` 实例中的 `properties`。以下是\
  \ `constructor` 函数。\n\n```javascript\nfunction Rabbit(type) {\n  this.type = type;\n\
  }\n\nRabbit.prototype.speak = function(line) {\n  console.log(`The ${this.type}\
  \ Arabbit says '${line}'`);\n};\n\nlet weirdRabbit = new Rabbit(\"weird\");\n```\n\
  \n\n\n\n`Function.prototype` 拥有 `constructor`、`name`、`length`、`prototype`、`util`、`for`、`instances`、`built`\
  \ 和 `through`。\n\n```javascript\nconsole.log(Object.getPrototypeOf(Rabbit) == Function.prototype);\n\
  // A→ true\n\nconsole.log(Object.getPrototypeOf(weirdRabbit) == Rabbit.prototype);\n\
  // A→ true\n```\n\n### 类注解\n\nJavaScript `classes` 是带有 `prototype` 属性的 `constructor`\
  \ 函数。以下是一个示例：\n\n```javascript\nclass Rabbit {\n  constructor(type) {\n    this.type\
  \ = type;\n  }\n  speak(line) {\n    console.log(`The ${this.type} Rabbit says '${line}'`);\n\
  \  }\n}\n```\n\n`let killerRabbit = new Rabbit(\"killer\");`\n`let blackRabbit =\
  \ new Rabbit(\"black\");`\n\n`class` 关键字以类声明开始，允许你可以在特定位置描述 `constructor` 和一组方法。`Class`\
  \ 声明允许将方法、可以作为函数调用的属性以及函数包含在 `prototype` 中。当你使用表达式时，它并不描述一个绑定，而是提供 `constructor`\
  \ 作为值。你可以从表达式中排除类名。\n\n```javascript\nlet object = new class {\n  getWord() {\n\
  \    return \"hello\";\n  }\n};\nconsole.log(object.getWord());\n// A→ hello\n```\n\
  \n### 覆盖派生属性\n\n当属性被添加到 `object` 时（无论该属性在 `prototype` 中是否可用），该属性都会被添加到 `object`\
  \ 中。如果 `prototype` 中存在具有相似名称的赋值属性，它不会影响该 `object`。\n\n```javascript\nRabbit.prototype.teeth\
  \ = \"small\";\nconsole.log(killerRabbit.teeth);\n// A→ small\n\nkillerRabbit.teeth\
  \ = \"long, sharp, and bloody\";\nconsole.log(killerRabbit.teeth);\n// A→ long,\
  \ sharp, and bloody\n\nconsole.log(blackRabbit.teeth);\n// A→ small\n\nconsole.log(Rabbit.prototype.teeth);\n\
  // A→ small\n```\n\n覆盖属性用于将标准函数和数组原型存储为单独的 `toString` 方法。\n\n```javascript\nconsole.log(Array.prototype.toString\
  \ == Object.prototype.toString);\n// A→ false\n\nconsole.log([1, 3].toString());\n\
  // A→ 1,3\n```\n\n在数组上调用 `toString` 会得到一个与对它调用 `join(\",\")` 关联的结果。它在数组包含的值之间放置一个逗号。如果你在数组上调用\
  \ `Object.prototype.toString`，它将提供一个单独的字符串。\n\n```javascript\nconsole.log(Object.prototype.toString.call([1,\
  \ 3]));\n// A→ [object Array]\n```\n\n字体 映射 (Maps)\n\n`map` 是一种将值与其他值连接起来的数据布局。如果你想将名称映射到年龄，可以这样写你的代码：\n\
  \n```javascript\nlet ages = {\n  Boris: 39,\n  Liang: 22,\n  Júlia: 62\n};\nconsole.log(`Julia\
  \ is ${ages[\"Julia\"]}`);\n// A→ Julia is 62\n\nconsole.log(\"Is Jack's age known?\"\
  , \"Jack\" in ages); // A→ Is Jack's age known? false\n\nconsole.log(\"Is toString's\
  \ age known?\", \"toString\" in ages); // A→ Is toString's age known? true\n```\n\
  \n`Object` 属性名应该是字符串。如果你想要一个键不能转换为字符串的映射，请不要使用 `object` 作为映射。JavaScript 包含一个名为 `Map`\
  \ 的类。它保存映射关系并允许不同类型的键。\n\n```javascript\nlet ages = new Map();\nages.set(\"Boris\"\
  , 39);\nages.set(\"Liang\", 22);\nages.set(\"Júlia\", 62);\nconsole.log(`Júlia is\
  \ ${ages.get(\"Júlia\")}`);\n// A→ Júlia is 62\n\nconsole.log(\"Is Jack's age known?\"\
  , ages.has(\"Jack\")); // A→ Is Jack's age known? false\n\nconsole.log(ages.has(\"\
  toString\")); // A→ false\n```\n\n`get`、`set` 和 `has` 方法是 `map` 对象布局的主体。`Object.keys`\
  \ 仅返回对象的自身的键。你可以使用 `hasOwnProperty` 方法作为选项。\n\n```javascript\nconsole.log({x: 1}.hasOwnProperty(\"\
  x\")); // A→ true\n\nconsole.log({x: 1}.hasOwnProperty(\"toString\")); // A→ false\n\
  ```\n\n### 多态 (Polymorphism)\n\n当在 `object` 上调用字符串函数时，会调用该对象上的 `toString` 方法以从其构建有意义的字符串。你可以定义自己的\
  \ `toString` 版本，以便它们可以构建出比“[[object Object]]”包含更多重要数据的字符串。以下是一个示例：\n\n```javascript\n\
  Rabbit.prototype.toString = function() {\n  return `a ${this.type} Rabbit`;\n};\n\
