  trans: "\n\n尽管像 `const`，`class`,`default`,`break`,`continue`,`delete`,`do`,`else`,`any`,`word`,\
    \ `can`, `be`,`called`, `binding`, `name`, `also`, `consist`, `of`, `digits`,`but`,\
    \ `not`, `begin`, `statement`, `with`, `figure` 等某些单词包含了美元符号 `$`、下划线 `_` 或任何特殊字符或标点符号。\n\
    \n## 环境\n\n在特定时刻存在的绑定和值被称为环境。当你启动程序时，环境持有一个语言标准，并通常包含与系统环境产生交互的绑定。例如，浏览器带有可以与启动的网站通信，以及读取键盘和鼠标输入的函数。\n\
    \n## 函数\n\n封装在值中的一段程序代码称为函数，这些值被添加以启动被封装的程序。例如，一个为用户输入显示小对话框的函数。\n\n```javascript\n\
    prompt(\"Enter a passcode\");\n```\n\n执行函数的过程被称为调用（calling）、唤起（invoking）或应用（applying）。调用函数是通过在提供函数值的表达式后插入括号来实现的。括号中的值传递给函数内的程序。定义的值被设置为函数的参数。\n\
    \n### console.log 函数\n\n在上面的示例中，我们使用 `console.log` 来输出值。所有主流浏览器都利用 `console.log`\
    \ 函数将其参数输出到输出文本的设备。在现代浏览器中，输出通常位于 JavaScript 的 `console` 中，默认是不可见的；你可以点击键盘上的 `F12`\
    \ 命令，或者 Mac 上的 `command-option-I`。绑定名不容纳字符，但 `console.log` 可以，因为它是从 `console`\
    \ 绑定值中声明 `log` 属性的表达式。\n\n###返回值\n\n函数用于产生副作用。它们也可以提供不需要副作用的值。例如，`Calculate.max`\
    \ 函数将接收一组数字参数，并返回最大值。\n\n```javascript\nconsole.log(Calculate.max(2, 4));\n//\
    \ → 4\n```\n\nJavaScript 将任何提供值的视为表达式，这使得函数调用可以附加到实质性的表达式中。让我们调用 `Calculate.min`，它是\
    \ `Calculate.max` 的直接相反：\n\n```javascript\nconsole.log(Math.min(2, 4) + 100);\n\
    // → 102\n```\n\n## 控制流\n\n当程序中有多个语句时，它们以故事的形式从代码的开始到结束执行。这种类型的程序由两种语句组成：第一个向用户索要数字，而第二个显示数字的平方并在第一个之后立即执行。\n\
    \n```javascript\nlet Number = Number(prompt(\"Select A Digit\"));\nconsole.log(\"\
    Your Digit is the square root of \" + Number * Number);\n```\n\n一个值通过 `number`\
    \ 函数转换为数字并输出字符串值。 \n\n### 条件执行\n\n键盘用于在 JavaScript 中开发条件执行。你可能希望某些代码在 `if` 且*仅当*特定条件为真时执行。让我们在输入是数字时才显示其平方。\n\
    \n```javascript\nlet theNumber = Number(prompt(\"Select A Digit\"));\n\nif (!Number.isNaN(theNumber))\
    \ {\n  console.log(\"Your Digit is the square root of \" +\n  theNumber * theNumber);\n\
    }\n```\n\n`if` 关键字根据布尔表达式的值来执行或规避一个语句。括号内键盘后的类型决定表达式，伴随着要完成的语句。\n\n`Number.isNaN`\
    \ 函数是一个高级 JavaScript 函数，只有当语句被声明为 `NaN` 时才输出 `true`。当赋值的字符串不是有效数字时，数字函数返回 `NaN`。`if`\
    \ 语句后的语句被包含在大括号 `{}` 中。大括号用于在单个语句内分类不同数量的语句。\n\n```javascript\nif (1 + 1 == 2)\
    \ console.log(\"It's true\");\n// → It's true\n```\n\n`else` 关键字可以与 `if` 语句一起使用，提供两种不同的执行路径。\n\
    \n```javascript\nlet theNumber = Number(prompt(\"Select A Digit\"));\n\nif (!Number.isNaN(theNumber))\
    \ {\n  console.log(\"Your Digit is the square root of \" +\n  theNumber * theNumber);\n\
    } else {\n  console.log(\"Hey. Why didn't you give me a number?\");\n}\n```\n\n\
    如果有两个以上的路径可供，你可以“链式”多个 `if/else` 对。以下是一个示例：\n\n```javascript\nlet num = Number(prompt(\"\
    Pick A Number\"));\n\nif (num < 10) {\n  console.log(\"Small\");\n} else if (num\
    \ < 100) {\n  console.log(\"Medium\");\n} else {\n  console.log(\"Large\");\n\
    }\n```\n\n程序确认 `num` 是否小于 10，如果是，它会选择该分支，然后显示 \"Small\"。如果 `num` 大于 10，它会选择 `else`\
    \ 分支，该分支包含它自己的第二个 `if` 语句。\n\n### while 和循环\n\n这是编写从 0 到 12 所有偶数的程序的方法。\n\n```javascript\n\
    console.log(0);\nconsole.log(2);\nconsole.log(4);\nconsole.log(6);\nconsole.log(8);\n\
    console.log(10);\nconsole.log(12);\n```\n\n多次运行代码代码的方式被称为循环。循环控制流允许用户返回到编写程序中的某些点，并根据程序的当前状态重新执行。将其与一个如下枚举的绑定集成：\n\
    \n```javascript\nlet number = 0;\n\nwhile (number <= 12) {\n  console.log(number);\n\
    \  number = number + 2;\n}\n// → 0\n// → 2\n// …等等\n```\n\n以 `while` 关键字开头并同时产生循环的语句。`while`\
    \ 关键字伴随着括号中的表达式，后面跟着一个类似于 `if` 语句的语句。循环持续持续直到表达式提供一个转换为布尔值后为 `true` 的值。循环每次重复时，数字变为其之前值的两倍。\n\
    \n让我们写一个评估并显示 $2^{10}$（2 的 10 次方）值的程序。我们将使用两个绑定：一个用于监控我们的结果，另一个用于计算 2 乘以结果的次数。\n\
    \n```javascript\nlet result = 1;\nlet counter = 0;\n\nwhile (counter < 10) {\n\
    \  result = result * 2;\n  counter = counter + 1;\n}\n\nconsole.log(result);\n\
    // → 1024\n```\n\n### for 循环\n\n许多循环遵循 `while` 循环模式，创建一个计数绑定来跟踪循环进度。然后带有测试表达式的\
    \ `while` 循环检查计数器是否达到设定值。\n\n```javascript\nfor (let number = 0; number <= 10;\
    \ number = number + 4) {\n  console.log(number);\n}\n```\n\n"
- fmt: "\nThe parentheses must consist of two semicolons after the keyword, the first\
    \ part that is before the first semicolon separates the loop by describing a binding.\
    \ The other part is the statement that determines if the loop should continue.\
    \ Here is the code that evaluates `210` using `for` instead of `while`:\n\n```javascript\n\
    let result = 1;\n\nfor (let counter = 0; counter < 10; counter = counter + 1)\
    \ {\n  result = result * 2;\n}\n\nconsole.log(result);\n```\n// → 1024\n\n###\
    \ Breaking Out of a Loop\n\nThere are other ways to end a loop other than making\
    \ a looping condition give `false`. A `break` can influence a jumping out of the\
    \ confined loop. The `break` statement evaluates this program if the first number,\
    \ which is both greater than or equal to `20`, and can be divided by `7`.\n\n\
    ```javascript\nfor (let current = 20; current = current + 1; current++) {\n  if\
    \ (current % 7 == 0) {\n    console.log(current);\n    break;\n  }\n}\n```\n//\
    \ → 21\n\nThe `%` operator is used to check if a number can be divided by another\
    \ number. If it can be divided, then the remaining division is zero. The `for`\
    \ in the example is not checked at the end of the loop, which means until the\
    \ `break` statement inside the loop becomes infinite and never stops.\n\n### Updating\
    \ Bindings Succinctly\n\nWhen you are in a loop, programs will update a binding\
    \ regularly to store a value based on its previous value.\n\n`counter = counter\
    \ + 1;`\n\nJavaScript offers a shortcut.\n\n`counter += 1;`\n\nRelated shortcuts\
    \ function for `for` for several other operators, like `result *= 2` to multiply\
    \ result or `counter -= 1` to count in descending order. This enables us to maximize\
    \ our counting example.\n\n```javascript\nfor (let number = 0; number <= 12; number\
    \ += 2) {\n  console.log(number);\n}\n```\n\nFor `counter += 1` and `counter -=\
    \ 1`, here are shorter equivalents:\n\n`counter++` and `counter--`.\n\n### Dispatching\
    \ on a value with switch\n\nDispatching on a value with `switch` codes can look\
    \ like this:\n\n```javascript\nif (x == \"value1\") {\n  action1();\n} else if\
    \ (x == \"value2\") {\n  action2();\n} else if (x == \"value3\") {\n  action3();\n\
    } else {\n  defaultAction();\n}\n```\n\nThe `switch` is used to express the above\
    \ form of dispatch straightforwardly. Below is a good example:\n\n```javascript\n\
    switch (prompt(\"What is the atmosphere alike?\")) {\n  case \"rainy\":\n    console.log(\"\
    Do not forget to come with an umbrella.\");\n    break;\n  case \"sunny\":\n \
    \   console.log(\"Be light with your dressing.\");\n  case \"cloudy\":\n    console.log(\"\
    Move out.\");\n    break;\n  default:\n    console.log(\"Weather type Unknown!\"\
    );\n}\n```\n\n######izationization\n\nNames binding do not allow spaces, but it\
    \ supports the usage of several words to define the binding values. Here are a\
    \ few types that can be utilized when binding names with different words:\n\n\
    * `fuzzylittleturtle`\n* `fuzzy_little_turtle`\n* `FuzzyLittleTurtle`\n* `fuzzyLittleTurtle`\n\
    \n### Comments\n\nSometimes raw code does not transmit every single piece of information\
    \ that you want the program to send to readers or spreads the message in a away\
    \ people will find it hard to decipher. Other times you feel like you should attach\
    \ some similar thoughts to your program, the comment performs this function. A\
    \ comment is a bit chunk of text contained in a program, but the computer ignores\
    \ it. To code a single line comment, use the two slash characters `//`, followed\
    \ by the comment text.\n\n```javascript\nlet accountBalance = calculateBalance(account);\n\
    // It's a yellow-orange on the mango tree. accountBalance.adjust();\n// Catching\
    \ green tatters in our home. let report = new Report();\n// Where the sun and\
    \ the moon meets: addToReport(accountBalance, report);\n// It's a large hallway,\
    \ and\n```\n\nA `/* */` comment appears only at the end of a line. Any comment\
    \ that is inside a line, and it doesn't matter.\n\n### Summary\n\nNow you understand\
    \ that you can create statements through expressions. Statements consist of `if`,\
    \ `else`, `switch`, `for`, `while`, `do`, and `return`. Functions are used to\
    \ organize code, minimize repetition, and separate names from themselves. Every\
    \ function has its own scope. A function can contain zero parameters or return\
    \ values.\n\n### Exercise\n\nWrite a JavaScript program that accepts double integers.\n\
    \n### Solution\n\n```javascript\nlet x = \"abc\";\nconsole.log(x.length);\n```\n"
