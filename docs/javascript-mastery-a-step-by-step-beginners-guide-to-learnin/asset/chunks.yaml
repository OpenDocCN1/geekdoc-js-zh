    x=10\\ny=20\"));\n// → {x: \"10\", y: \"20\"}\n```\n\n## ECMAScript modules\n\n\
    CommonJS modules perform well while combining with NPM, and they enable the JavaScript\
    \ community to begin code sharing on a substantial scale. The notation is quite\
