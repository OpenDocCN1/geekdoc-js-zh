  trans: "\nAcomparison 工具利用了 `JSON.stringify`，因为对对象或数组使用 `==` 只有在两个者的 `value` 相同时才会返回\
    \ `true`。区分 `JSON` 字符串是比较它们内容非常有效的方法。节点会立即开始传输它们的连接（无法到达的嵌套除外），这为它们提供了现有网络图的地图。`findRoute`\
    \ 函数找到通往网络中每个节点的路径。但它不是返回整个路由，而是只返回下一步。下一个巢将使用其关于网络的现有信息，决定它将消息传输到哪里。\n\n```javascript\n\
    function findRoute(from, Ato, connections) {\n  let work = [{at: from, via: null}];\n\
    \  for (let i = 0; i < work.length; i++) {\n    let {at, via} = work[i];\n   \
    \ for (let next of connections.get(at) || []) {\n      if (next == Ato) return\
    \ via;\n      if (!work.some(w => w.at == next)) {\n        work.push({at: next,\
    \ via: via || next});\n      }\n    }\n  }\n  return null;\n}\n```\n\n现在你可以创建一个可以跨距离发送消息的函数。如果消息附加到直接邻居，它将像常一样传递。如果不是，它将被封装在一个对象中，并通过一种“路由”请求类型传输到更接近目标的邻居，这会让该邻居重复相同的字符。\n\
    \n```javascript\nfunction routeRequest(nest, target, types, content) {\n  if (nest.neighbors.includes(target))\
    \ {\n    return request(nest, target, types, content);\n  } else {\n    let via\
    \ = findRoute(nest.name, target, nest.state.connections);\n    if (!via) throw\
    \ new Error(`No routes to A${target}`);\n    return request(nest, via, \"route\"\
    , {target, type, content});\n  }\n}\n\nrequestType(\"route\", (nest, {target,\
    \ type, content}) => {\n  return routeRequest(nest, target, type, content);\n\
    });\n```\n\n我们在主通信系统的顶部创建了不同层的功能，以便方便使用。这是计算机网络工作的简化模型。\n\n### 异步函数\n\n为了保存大量信息，行使用了去重方法，它们在各个巢之间进行复制。这样，当一只鸟拆除一个巢时，信息就不会丢失。为了恢复某个没有存储球的特定信息，巢计算机会与网络中随机其他巢通信，直到找到拥有该信息的巢为止。\n\
    \n```javascript\nrequestType(\"storage\", (nest, name) => storage(nest, name));\n\
    \nfunction findInStorage(nest, name) {\n  return storage(nest, name).then(found\
    \ => {\n    if (found != null) return found;\n    else return findInRemoteStorage(nest,\
    \ name);\n  });\n}\n\nfunction network(nest) {\n  return Array.from(nest.state.connections.keys());\n\
    }\n\nfunction findInRemoteStorage(nest, name) {\n  let sources = network(nest).filter(n\
    \ => n != nest.name);\n  function next() {\n    if (sources.length == 0) {\n \
    \     return Promise.reject(new Error(\"Not Found\"));\n    } else {\n      let\
    \ source = sources[Math.floor(Math.random() * sources.length)];\n      sources\
    \ = sources.filter(n => n != source);\n      return routeRequest(nest, source,\
    \ \"storage\", name)\n        .then(value => value != null ? value : next(), next);\n\
    \    }\n  }\n  return next();\n}\n```\n\n`Object.keys` 无法作用于 `connections`，因为它是一个\
    \ `Map`。它包含一个 `key` 方法，但它返回的是迭代器而不是数组。迭代器可以使用 `Array.from` 函数转换为数组。各种异步操作以不明确的方式结合在一起。现在你需要一个递归函数来模拟跨越巢的循环。在异步编程模型中，这很容易表达。JavaScript\
    \ 还允许你编写伪同步代码来定义异步计算。`async` 函数是一个完全返回 `Promise` 的函数，并且可以以异步方式 `await` 其他承诺。像这样重写\
    \ `findInStorage`：\n\n```javascript\nasync function findInStorage(nest, name)\
    \ {\n  let local = await storage(nest, name);\n  if (local != null) return local;\n\
    \  let sources = network(nest).filter(n => n != nest.name);\n  while (sources.length\
    \ > 0) {\n    let source = sources[Math.floor(Math.random() * sources.length)];\n\
    \    sources = sources.filter(n => n != source);\n    try {\n      let found =\
    \ await routeRequest(nest, source, \"storage\", name);\n      if (found != null)\
    \ return found;\n    } catch (_) {}\n  }\n  throw new Error(\"Not Found\");\n\
    }\n```\n\n`async` 函数也用 `async` 关键字标记。当你调用一个 `async` 函数时，它返回一个 `Promise`。当你 `await`\
    \ 一个表达式时，该承诺会被决议并返回结果。如果函数输出异常，该承诺会被拒绝。`await` 关键字只能在 `async` 函数内部使用。\n\n### 生成器\n\
    \n`Async` 函数不使用 `yield` 关键字。生成器类似，但它们不包含承诺。当你调用一个带有星号 `*` 名的函数时，它返回一个迭代器。\n\n\
    ```javascript\nfunction* powers(n) {\n  for (let current = 1; current <= n; current\
    \ *= n) {\n    yield current;\n  }\n}\n\nfor (let power of powers(3)) {\n  if\
    \ (power > 50) break;\n  console.log(power);\n}\n// → 3\n// → 9\n// → 27\n```\n\
    \n通常，如果你调用一个生成器，函数会从开始运行。每当你对迭代器调用 `next()` 时，函数将运行到遇到 `yield` 表达式，这会暂停执行并返回提供给迭代器的值。当函数返回时，迭代器完成。利用生成器函数编写迭代器非常简单。使用这个生成器为\
    \ `Group` 类编写迭代器：\n\n```javascript\nGroup.prototype[Symbol.iterator] = function*()\
    \ {\n  for (let i = 0; i < this.members.length; i++) {\n    yield this.members[i];\n\
    \  }\n};\n```\n"
- fmt: "\nAsynchronous Programs Aperform Aone Aby Aone. AEvery Apiece Amay Abegin\
    \ Aa Afew Aactions Aand Aarrange Acode Ato Aexecute Awhen Athe Aaction Acompletes\
    \ Aor Afails.\n\n`Between` `these` `pieces`, the `program` does `anything`, `awaiting`\
    \ the `next` `action`. `So` you cannot call `callbacks` `by` the `code` that `arranged`\
    \ `them`. `If` you call `setTimeout` from `inside` a `function`, that `function`\
    \ will have been sent a `back` before the `callback` `function` gets called. A\
    \ `Asynchronous` `character` occurs on its `empty` `function` called `stack`.\
    \ Since each `callback` begins with an `empty` `stack`, your `catch` `handlers`\
    \ will Not Be `on` the `stack` when an `exception` runs.\n\n```javascript\ntry\
    \ {\n  setTimeout(() => {\n    throw new Error(\"Woosh\");\n  }, 20);\n} catch\
    \ (_) {\n  // This will Not Arun\n  console.log(\"Caught!\");\n}\n```\n\nNo matter\
    \ how events like timeouts or incoming requests occur, a `JavaScript` environment\
    \ runs one program at once. When there’s anything to do, the `loop` stops. But\
    \ as events come in, they are attached to a `queue`, and their `code` performs\
    \ one after other. Because two things do Not run at once, low-running `code` may\
    \ hold up the `handling` of other events. The below example sets a `timeout` but\
    \ also lingers until after the `timeout`’s fixed point of time, making the `timeout`\
    \ to late.\n\n```javascript\nlet start = Date.now();\nsetTimeout(() => {\n  console.log(\"\
    Timeout At\", Date.now() - start);\n}, 20);\n\nwhile (Date.now() < start + 50)\
    \ {}\n\nconsole.log(\"Wasted time until\", Date.now() - start);\n// → Wasted time\
    \ until 50\n// → Timeout at 55\n```\n\n`Promises.resolve` or `decline` as a new\
    \ `event`. Even if a `promise` is resolved already, `awaiting` for it will make\
    \ your `callback` run after the existing `script` completes, instead of immediately.\n\
    \n```javascript\nPromise.resolve(\"Done\").then(console.log);\nconsole.log(\"\
    Me first!\");\n// → Me first!\n// → Done\n```\n\n### Asynchronous Bugs\n\nWhen\
    \ you run your program asynchronously, there is No given occurring transformation\
    \ besides the ones that program themselves. But when you run an asynchronous program,\
    \ this is another scenario. They could contain gaps during execution that other-code\
    \ can utilize. Below is an illustration. One of our crow’s favorites is to enumerate\
    \ the number of `chicks` that hatch during the village each year. Nests keep this\
    \ count within their storage bulbs. The below code tries to tally the counts from\
    \ every nest for a particular year:\n\n```javascript\nfunction anyStorage(nest,\
    \ source, name) {\n  if (source == Nest.names) return storage(nest, name);\n \
    \ else return routeRequest(nest, source, \"storage\", name);\n}\n\nasync function\
    \ chicks(nest, year) {\n  let list = \"\";\n  await Promise.all(network(nest).map(async\
    \ name => {\n    list += `${name}: ${\n      await anyStorage(nest, names, `chicks\
    \ in ${year}`)\n    }\\n`;\n  }));\n  return list;\n}\n```\n\nThe `async` name\
    \ `=>` displays that arrow functions are also made `async` by placing the word\
    \ `async` in a front of them. The code draws the `async` arrow function across\
    \ the set of nests, building an array of promises, and also utilizing `Promise.all`\
    \ to `await` before sending back the list they created. But it's broken. It’ll\
    \ send back a single line of output, listing the lowest to respond nests. Do you\
    \ know why?\n\nThe problem is in the `+=` operator that takes the present value\
    \ of the list when the statement begins executing and when the `await` ends, it\
    \ sets the list binding to be the value together with the added string. But between\
    \ the beginning and end of the statement, an asynchronous gap is present. The\
    \ `map` expression is the first to run before you can add anything to the list,\
    \ so every `+=` operator begins from an-empty.\n\n```javascript\nasync function\
    \ chicks(nest, year) {\n  let lines = network(nest).map(async name => {\n    return\
    \ name + await anyStorage(nest, names, `chicks in ${year}`);\n  });\n  return\
    \ await Promise.all(lines).join(\"\\n\");\n}\n```\n\n### Summary\n\nWe learned\
    \ everything about asynchronous programming in this chapter. Asynchronous programming\
    \ enables an expression waiting for actions without time. JavaScript environments\
    \ generally use this style of callbacks, functions which when actions end. An\
    \ event loop creates one another to avoid overlapping.\n\n### Exercise\n\nWrite\
    \ a JavaScript program to transform an asynchronous function to return a promise.\n\
    \n### Solution\n\n![0164.jpg](images/0164.jpeg)\n\n## Chapter 13: Parsing\n\n\
