  trans: "\n语言的一致性意味着 JavaScript 中的操作符（如 `>`）在本文语言中被称为绑定（bindings），其用法与其他函数类似。此外，语法包含一个“零块”概念，因此需要一种结构来表示连续运行多个项。解析器利用数据布局来定义一个包含表达式对象的程序。每个对象都包含一个\
    \ `type` 属性来表示表达式类型，以及其他几个属性来确定其内容。类型为 `\"value\"` 的表达式表示字符串或数字。它们的 `value` 属性由它们所代表的字符串或数字组成。类型为\
    \ `\"word\"` 的表达式用于标识符（名称）。这类类型的对象包含一个 `name` 属性，以字符串形式持有标识符的标题。而 `\"apply\"`\
    \ 表达式表示应用。它们包含一个 `operator` 属性，用于引用被调用的表达式，以及一个 `args` 属性，该属性包含一个参数表达式的数组。\n\n\
    新程序中的 `> (x, 5)` 部分如下：\n\n```javascript\n{\n  type: \"apply\",\n  operator: {type:\
    \ \"word\", name: \">\"},\n  args: [\n    {type: \"word\", name: \"x\"},\n   \
    \ {type: \"value\", value: 5}\n  ]\n}\n```\n\n我们描述了一个函数 `parseExpression`，它识别字符串作为输入并返回一个对象，该对象包含字符串开头表达式的数据布局，以及解析该表达式后剩余的字符串部分。当你解析子表达式时，可以再次调用此函数，并将剩余文本传递给参数表达式。这段文本可能包含更多参数，或者是结束参数列表的右括号。\n\
    \n以下是解析器的第一部分：\n\n```javascript\nfunction parseExpression(program) {\n  program\
    \ = skipSpace(program);\n  let match, expr;\n\n  if (match = /^\"([^\"]*)\"/.exec(program))\
    \ {\n    expr = {type: \"value\", value: match[1]};\n  } else if (match = /^\\\
    d+\\b/.exec(program)) {\n    expr = {type: \"value\", value: Number(match[0])};\n\
    \  } else if (match = /^[^\\s(),#\"]+/.exec(program)) {\n    expr = {type: \"\
    word\", name: match[0]};\n  } else {\n    throw new SyntaxError(\"Unexpected Syntax:\
    \ \" + program);\n  }\n\n  return parseApply(expr, program.slice(match[0].length));\n\
    }\n\nfunction skipSpace(string) {\n  let first = string.search(/\\S/);\n  if (first\
    \ == -1) return \"\";\n  return string.slice(first);\n}\n```\n\n### 求值器 (The Evaluator)\n\
    \n求值器用于运行程序的语法树。它包含语法树和一个将名称与值关联的作用域对象（scope object），它将访问树所代表的表达式并返回其提供的值。\n\n\
    ```javascript\nconst specialForms = Object.create(null);\n\nfunction evaluate(expr,\
    \ scope) {\n  if (expr.type == \"value\") {\n    return expr.value;\n  } else\
    \ if (expr.type == \"word\") {\n    if (expr.name in scope) {\n      return scope[expr.name];\n\
    \    } else {\n      throw new ReferenceError(`Undefined Binding: ${expr.name}`);\n\
    \    }\n  } else if (expr.type == \"apply\") {\n    let {operator, args} = expr;\n\
    \    if (operator.type == \"word\" && operator.name in specialForms) {\n     \
    \ return specialFormsoperator.name;\n    } else {\n      let op = evaluate(operator,\
    \ scope);\n      if (typeof op == \"function\") {\n        return op(...args.map(arg\
    \ => evaluate(arg, scope)));\n      } else {\n        throw new TypeError(\"Applying\
    \ a Anon-function.\");\n      }\n    }\n  }\n}\n```\n\n求值器包含了每个表达式类型的代码。字面量值表达式提供其值。对于绑定，检查它是否在作用域中被描述，如果是，获取绑定的值。如果它包含一个不访问任何内容的特殊形式，并将参数表达式连同作用域传递给影响该形式的函数。如果调用是非典型的，访问操作符，确定它是否为函数，并使用可用的参数调用它。利用通用的\
    \ JavaScript 函数 `valuesTo` 来代表 Egg 函数的值。求值的递归布局与解析器的布局相似，两者都镜像了语言的结构。你可以在解析时将解析器与求值器以及\
    \ `evaluate` 结合，但将它们分离可以提供更清晰的程序视图。这就是组合 Egg 所需的一切。\n\n### 特殊形式 (Special Forms)\n\
    \n`specialForms` 对象描述了 Egg 中独特的语法。它将单词与此类形式的形式关联起来。目前它是空的。让我们插入一个：\n\n```javascript\n\
    specialForms.if = (args, scope) => {\n  if (args.length != 3) {\n    throw new\
    \ SyntaxError(\"Wrong number of arguments\");\n  } else if (evaluate(args[0],\
    \ scope) !== false) {\n    return evaluate(args[1], scope);\n  } else {\n    return\
    \ evaluate(args[2], scope);\n  }\n};\n```\n\n三元运算符 `?` 期望三个参数。它将访问第一个，如果值不是 false，则返回第二个；否则返回第三个。这看起来像\
    \ JavaScript 的 `?:` 运算符，但 Egg 是一个表达式。\n\n```javascript\nspecialForms.? = (args,\
    \ scope) => {\n  if (args.length != 3) {\n    throw new SyntaxError(\"Wrong number\
    \ of arguments\");\n  } else if (evaluate(args[0], scope) !== false) {\n    return\
    \ evaluate(args[1], scope);\n  } else {\n    return evaluate(args[2], scope);\n\
    \  }\n};\n```\n\n`if` 结构期望两个参数。如果条件不是 false，则返回该值，否则返回 false。\n\n```javascript\n\
    specialForms.if = (args, scope) => {\n  if (args.length != 2) {\n    throw new\
    \ SyntaxError(\"Wrong number of arguments\");\n  } else if (evaluate(args[0],\
    \ scope) !== false) {\n    return evaluate(args[1], scope);\n  } else {\n    return\
    \ false;\n  }\n};\n```\n\n`do` 块从上到下执行参数。提供的值是最后一个参数。\n\n```javascript\nspecialForms.do\
    \ = (args, scope) => {\n  let value = false;\n  for (let arg of args) {\n    value\
    \ = evaluate(arg, scope);\n  }\n  return value;\n};\n```\n\n为了构建绑定并设置新值，你应该构建一个名为\
    \ `define` 的形式。它等待两个参数：要的名称和提供值的表达式。由于 `define` 是一个表达式，它必须返回被设置的值。\n\n```javascript\n\
    specialForms.define = (args, scope) => {\n  if (args.length !== 2 || args[0].type\
    \ !== \"word\") {\n    throw new SyntaxError(\"Incorrect use of define\");\n \
    \ }\n  let value = evaluate(args[1], scope);\n  scope[args[0].name] = value;\n\
    \  return value;\n};\n```\n\n### 环境 (The Environment)\n\n环境是一个包含少量属性的对象，其名称被绑定到值。为了能够利用前面的布尔值，你所做的就是将两个名称绑定到\
    \ `true` 和 `false` 值。\n\n```javascript\nconst topScope = Object.create(null);\n\
    topScope.true = true;\ntopScope.false = false;\n```\n"
- fmt: "\nTo provide a fundamental arithmetic as well as comparison operators, let\
    \ us include function values to a scope. We will use a function on a few operator\
    \ functions within a loop, and not stating them one by one.\n\n```javascript\n\
    for (let op of [\"+\", \"-\", \"*\", \"/\", \"==\", \"<\", \">\"]) {\n  topScope[op]\
    \ = Function(\"a, b\", `return a ${op} b;`);\n}\n```\n\nwe will enclose `console.log`\
    \ in a function to output the values and call it `print`.\n\n```javascript\ntopScope.print\
    \ = value => {\n  console.log(value);\n  return value;\n};\n```\n\nThat provides\
    \ adequate elementary tools to code easy program, analyze and run it in a new\
    \ scope:\n\n```javascript\nfunction run(program) {\n  return evaluate(parse(program),\
    \ Object.create(topScope));\n}\n```\n\nThe chain of the `object prototype` will\
    \ stand for nested scopes to enable add bindings without altering the high-level\
    \ scope.\n\n```javascript\nrun(`\ndo(define(total, 0),\ndefine(count, 1),\nwhile(<(count,\
    \ 11),\ndo(define(total, +(total, count)),\ndefine(count, +(count, 1)))),\nprint(total))\n\
    `);\n```\n\n// → 55\n\nThis concept explains the total numbers from 1 to 10, as\
    \ indicated in a egg.\n\n### Functions\n\nA programming language that has no functions\
    \ is really bad one, although it is easy to insert a function that uses its last\
    \ argument as the function’s body. It also utilizes every argument before that\
    \ as the function’s parameters names. \n\n```javascript\nspecialForms.fun = (args,\
    \ scope) => {\n  if (!args.length) {\n    throw new SyntaxError(\"Functions need\
    \ a body\");\n  }\n  let body = args[args.length - 1];\n  let param = args.slice(0,\
    \ args.length - 1).map(expr => {\n    if (expr.type != \"word\") {\n      throw\
    \ new SyntaxError(\"Parameter names must be words\");\n    }\n    return expr.name;\n\
    \  });\n\n  return function() {\n    if (arguments.length != param.length) {\n\
    \      throw new TypeError(\"Wrong number of arguments\");\n    }\n    let localScope\
    \ = Object.create(scope);\n    for (let i = 0; i < arguments.length; i++) {\n\
    \      localScope[param[i]] = arguments[i];\n    }\n    return evaluate(body,\
    \ localScope);\n  };\n};\n```\n\nThe `egg functions` have their own local scope.\
    \ The function provided by the `fun` form builds this local scope and attaches\
    \ the argument bindings to it. It then accesses the function body in this scope\
    \ and gives back the result.\n\n```javascript\nrun(`\ndo(define(plusOne, fun(a,\
    \ +(a, 1))),\nprint(plusOne(10)))\n`);\n```\n\n// → 11\n\n```javascript\nrun(`\n\
    do(define(pow, fun(base, exp,\nif(==(exp, 0),\n1,\n*(base, pow(base, -(exp, 1)))))),\n\
    print(pow(2, 10)))\n`);\n```\n\n// → 1024\n\n### Summary\n\nWe covered the parsing,\
    \ functions, special forms, and the evaluator in this chapter. Notation or syntax\
    \ is every important aspect of programming. A `parser` reads a text and offers\
    \ a data layout that shows the program layout in the text. If the text creates\
    \ an invalid program, the `parser` would signify an error.\n\n### Exercise\n\n\
    Write a JavaScript function to calculate the factors of a positive integer.\n\n\
    ### Solution\n\n![00114.jpg](images/00114.jpeg)![00112.jpg](images/00112.jpeg)\n\
    \n## Conclusion\n\nThis book consists of important information connected to the\
    \ JavaScript programming language. The information in this book will help you\
    \ understand and practice the several JavaScript operators, loops and a conditional\
    \ statements, functions, the scope of variables, types, and so on. While edging\
    \ towards the end of the course, you will have an excellent understanding of the\
    \ JavaScript language as you will have learned JavaScript and forms, you will\
    \ understand the basics of jQuery, frames and debugging scripts. The best advice\
    \ to give a programmer is to keep practicing because that is the only way you\
    \ can master what you have learned.\n"
