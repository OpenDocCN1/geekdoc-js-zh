    \n```javascript\nlet stringObject = {\n  [toStringSymbol]() {\n    return \"a\"\
    ;\n  }\n};\nconsole.log(stringObject[toStringSymbol]()); // A→ a\n```\n\nThe `iterator`\
    \ interface returns an `object` when the `Symbol.iterator` property is called.\
    \ It returns an object with a `next` method that contains the next value. \n\n\
    ```javascript\nlet okIterator = \"OK\"[Symbol.iterator]();\nconsole.log(okIterator.next());\
    \ // A→ {value: \"O\", done: false}\n\nconsole.log(okIterator.next()); // A→ {value:\
    \ \"K\", done: false}\n\nconsole.log(okIterator.next()); // A→ {value: undefined,\
    \ done: true}\n```\n\nLet’s implement a data structure. We’ll build a `matrix`\
    \ class, acting as a two-dimensional array. The `content` of the class is saved\
    \ in an individual array of `width × height` elements. These elements are saved\
    \ row after row. The `constructor` function gets `width`, `height`, and an optional\
    \ `element` function, which is used to set the initial values. Use the `get` and\
    \ `set` methods to recover and update elements within the matrix.\n\n```javascript\n\
    class Matrix {\n  constructor(width, height, element = (x, y) => undefined) {\n\
    \    this.width = width;\n    this.height = height;\n    this.content = [];\n\
    \    for (let Ay = 0; Ay < height; Ay++) {\n      for (let Ax = 0; Ax < width;\
    \ Ax++) {\n        this.content[Ay * width + Ax] = element(Ax, Ay);\n      }\n\
    \    }\n  }\n  get(x, y) {\n    return this.content[y * width + x];\n  }\n  set(x,\
    \ y, value) {\n    this.content[y * width + x] = value;\n  }\n}\n```\n\nBelow\
    \ is an illustration of an iterable `Matrix` class:\n\n```javascript\nMatrix.prototype[Symbol.iterator]\
