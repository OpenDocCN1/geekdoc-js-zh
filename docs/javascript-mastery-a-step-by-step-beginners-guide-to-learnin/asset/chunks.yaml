    \ contents. Use the same concept for objects, utilize braces and not square brackets.\
    \ \n\n```javascript\nlet {name} = {name: \"Faraji\", age: 23};\n\nconsole.log(name);\n\
    // → Faraji\n```\n\n### JSON\n\nJSON represents a JavaScript Object Notation and\
    \ is utilized as a communication format and data storage for the web. JSON is\
