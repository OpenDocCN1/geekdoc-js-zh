    \nconsole.log([1, 2][toStringSymbol]()); // A→ 2 cm of yarn\n```\n\n`iterator`\
    \ 接口在调用 `Symbol.iterator` 属性时返回一个 `object`。它返回一个包含下一个值的 `next` 方法。\n\n```javascript\n\
    let okIterator = \"OK\"[Symbol.iterator]();\nconsole.log(okIterator.next()); //\
    \ A→ {value: \"O\", done: false}\n\nconsole.log(okIterator.next()); // A→ {value:\
    \ \"K\", done: false}\n\nconsole.log(okIterator.next()); // A→ {value: undefined,\
    \ done: true}\n```\n\n让我们实现一个数据结构。我们将构建一个 `matrix` 类，作为一个二维数组。类的 `content` 存储在一个包含\
