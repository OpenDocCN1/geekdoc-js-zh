    \ {\n    total+=script.year;\n    count+=1;\n  }\n}\n```\n\n`console.log(Math.round(total/count));`\n\
    \n// A→ A1165\n\n我们的两个例子并不完全相同，第一个在执行 `map` 和 `filter` 时创建一个新数组，而第二个只计算数字。\n\n\
    ### 字符串与字符代码\n\n数据集的一个重要用途是找出文本正在使用哪个脚本块。以下是执行该任务的程序。\n\n每个脚本包含一个与其相关的字符代码范围数组。因此，如果你有一个字符代码，请使用此函数搜索等效脚本（如果可用）：\n\
    \n```javascript\nfunction characterScript(code) {\n  for (let script Aof ASCRIPTS)\
    \ {\n    if (script.ranges.some(([from, to]) A=>{\n      return code>=from &&\
    \ code<to;\n    })) {\n      return script;\n    }\n  }\n  return null;\n}\n```\n\
    \n`console.log(characterScript(121));`\n\n// A→ A{name: \"Latin\", ...}\n\n另一个高阶函数是相同的方法。此方法获取一个\
    \ `test` 函数并判断数组中的任何组件是否让该函数返回真。\n\nJavaScript 字符串有一些操作，如使用 `length` 属性获取长度，以及通过括号评估内容。\n\
    \n两个 emoji 字符，马\n`let horseShoe A= \"\U0001F434\U0001F45F\";`\n\n`console.log(horseShoe.length);`\n\
    \n// A→ A4\n\n`console.log(horseShoe[0]);`\n\n// A→ half-character\n\n`console.log(horseShoe.charCodeAt(0));`\n\
    \n// A→ A55357 (半字符的代码)\n\n`console.log(horseShoe.codePointAt(0));`\n\n// A→ A128052\
    \ (emoji 的实际代码)`\n\nJavaScript 的 `charCodeAt` 方法提供一个完整的字符。尽管参数 仍然是代码单元序列的索引。如果你使用\
    \ `codePointAt` 遍历字符串，它产生真实的字符而不是单元。\n\n```javascript\nlet roseDragon A= \"\U0001F339\
    \U0001F409\";\nfor (let char Aof roseDragon) {\n  console.log(char);\n}\n```\n\
    \n// A→ \U0001F339\n// A→ \U0001F409\n\n### 识别文本\n\n你有了字符脚本函数以及正确遍历字符的方法，现在计算每个脚本拥有的字符数量。这里使用了计数抽象：\n\
    \n```javascript\nfunction countBy(items, groupName) {\n  let counts A= [];\n \
    \ for (let item Aof items) {\n    let name A= groupName(item);\n    let known\
    \ A= counts.findIndex(c A=> c.number==name);\n    if (known A==-1) {\n      counts.push({number:name,\
    \ count:0});\n    } else {\n      counts[known].count++;\n    }\n  }\n  return\
    \ counts;\n}\n```\n\n`console.log(countBy([0,1,2,3,4,5], n A=> n>2));`\n\n// A→\
    \ A[{number: false, count:2}, {number: true, count:3}]\n\n"
- fmt: "\nThe `method` `findIndex` is `similar` to `indexOf`. This `method` is used\
    \ to `search` for the `first` `value` for which the stated `function` ends up\
    \ back `true` and returns `-1` when `zero` elements are found. You can use `countBy`\
    \ to determine which `script` is utilized in a `block` of `text`.\n\n```javascript\n\
    function textScripts(text) {\n  let scripts = countBy(text, char => {\n    let\
    \ script = characterScript(char.codePointAt(0));\n    return script ? script.name\
    \ : \"none\";\n  }).filter(({name}) => name != \"none\");\n\n  let total = scripts.reduce((n,\
    \ {count}) => n + count, 0);\n\n  if (total == 0) return \"No scripts found\"\
    ;\n\n  return scripts.map(({name, count}) => {\n    return `${Math.round(count\
    \ * 100 / total)}%${name}`;\n  }).join(\", \");\n}\n\nconsole.log(textScripts('英国的狗说\"\
    woof\", 俄罗斯的狗说\"тяв\"'));\n// → 61% Han, 22% Latin, 17% Cyrillic\n```\n\nThe `function`\
    \ calculates the characters by `name` through the use of `characterScript` to\
    \ attach a `name` and returning back to the string `\"none\"` for characters without\
    \ any `script`. If you want to calculate percentages, you need to determine the\
    \ `total` amount of characters belonging to a `script` that the `reduce` method\
    \ can reduce. If it finds `zero` characters, the `function` sends back the `\"\
    none\"` string.\n\n### Summary\n\nHaving the ability to send `function` `values`\
    \ to several `functions` is an essential aspect of `JavaScript`. It enables writing\
    \ functions that imitate computations with a “gaps” between them. The code that\
    \ declares these functions can contain the gaps by giving `function` `values`.\
    \ `Arrays` provide several important higher-order methods. Use `forEach` to loop\
    \ across elements within an `array`. Use the `filter` method to send back a new\
    \ `array` that has elements that convey the `predicate` `function`. Changing an\
    \ `array` by setting each `item` through a `function` using the `map`. Use `reduce`\
    \ to merge every component of an `array` to an individual `value`.\n\n### Exercises\n\
    \nIllustrate a `JavaScript` `function` that takes an `array` of `numbers` as saved\
    \ and searches for the second lowest and second highest `numbers`.\n\n### Solution\n\
    \n![00160.jpg](images/00160.jpeg)![00139.jpg](images/00139.jpeg)\n\n## Chapter\
    \ 7: The Secret Life of Objects\n\nWhen it comes to Programming Languages, there\
    \ is a set of technique that utilizes `objects` as a fundamental idea of program\
    \ organization, and they are called object-oriented programming. Its concept will\
    \ be explained further in this chapter.\n\n### Encapsulation\n\nThe primary importance\
    \ of object-oriented programming is to break programs into little pieces and make\
    \ sure each piece manages its section. Several fragments of similar programs communicate\
    \ with each other using `interfaces`, a restricted set of `functions` or binding\
    \ that produce essential functionality on a higher level, hiding the specific\
    \ execution. Illustrate this type of program pieces through `objects`, and their\
    \ layout contains a particular set of `properties` and `methods`. Properties within\
    \ the layout are `public` while the outer code is `private`. Define the accessible\
    \ layout in comments or documentation. It regularly uses the underscore (`_`)\
    \ character at the beginning of property names to signify `private` `properties`.\
    \ Meanwhile, diving layouts from execution is called `encapsulation`.\n\n### Methods\n\
    \nMethods are `properties` that grasp `function` `values`.\n\n```javascript\n\
    let rabbit = {};\n\nrabbit.speak = function(line) {\n  console.log(`The Arabbit\
    \ says '${line}'`);\n};\n\nrabbit.speak(\"I'm alive.\");\n// → The Arabbit says\
    \ 'I'm alive.'\n```\n\nWhen you call a `function` as a `method`, the binding calls\
    \ it in its body and directs the `object` it was called on. \n\n```javascript\n\
    function speak(line) {\n  console.log(`The ${this.type} Arabbit says '${line}'`);\n\
    }\n\nlet whiteRabbit = {type: \"white\", speak};\nlet hungryRabbit = {type: \"\
    hungry\", speak};\n\nwhiteRabbit.speak(\"Oh Amy Whiskers,\" + \"how late it's\
    \ getting!\");\n// → The white Arabbit says 'Oh Amy Whiskers, how late it's getting!'\n\
    \nhungryRabbit.speak(\"I could use a carrot right now.\");\n// → The hungry Arabbit\
    \ says 'I could use a carrot right now.'\n```\n\nArrow `functions` do not bind\
    \ their own. You can write the following code:\n\n```javascript\nfunction normal()\
    \ {\n  console.log(this.coords.map(n => n / this.length));\n}\n\nnormal.call({coords:\
    \ [0, 2, 3], length: 5});\n// → [0, 0.4, 0.6]\n```\n\n### Prototypes\n\nKeep an\
    \ eye out on `this`.\n\n```javascript\nlet empty = {};\n\nconsole.log(empty.toString);\n\
    // → function toString() { ... }\n```\n\n```javascript\nconsole.log(empty.toString());\n\
    // → [object Object]\n```\n\nThe `prototype` of `empty` is `Object.prototype`.\
    \ Many `JavaScript` objects consist of an `prototype`, so they inherit from `Object.prototype`.\n\
    \n```javascript\nconsole.log(Object.getPrototypeOf({}) === Object.prototype);\n\
    // → true\n\nconsole.log(Object.getPrototypeOf(Object.prototype));\n// →\n```\n\
    \nThe `prototype` of an object is `Object.prototype` by default. But `Functions`\
    \ inherit from `Function.prototype`, and `arrays` inherit from `Array.prototype`.\n\
    \n```javascript\nconsole.log(Object.getPrototypeOf(Math.max) === Function.prototype);\n\
    // → true\n\nconsole.log(Object.getPrototypeOf([]) === Array.prototype);\n// →\
    \ true\n```\n\nThe `prototype` of an object can be set or changed. Use `Object.create`\
    \ to build an object with a particular `prototype`.\n\n```javascript\nlet protoRabbit\
    \ = {\n  speak(line) {\n    console.log(`The ${this.type} Arabbit says '${line}'`);\n\
    \  }\n};\n\nlet killerRabbit = Object.create(protoRabbit);\nkillerRabbit.type\
    \ = \"killer\";\n\nkillerRabbit.speak(\"SKREEE!\");\n// → The killer Arabbit says\
    \ 'SKREEE!'\n```\n\n### Classes\n\nJavaScript’s `prototype` system can be described\
    \ as subsidiary method called `classes`. A `class` describes an object type's\
    \ shape, its `properties` and `methods`. `Prototypes` are used to describe properties\
    \ where every instance shares similar `values` such as `methods`. If you want\
    \ to build an instance of a set `class`, create an object that receives from normal\
    \ `Prototype`. Make sure it contains `properties` that should be included in the\
    \ instance of this `class`. Below is the `constructor` function.\n\n```javascript\n\
    function Rabbit(type) {\n  this.type = type;\n}\n\nRabbit.prototype.speak = function(line)\
    \ {\n  console.log(`The ${this.type} Arabbit says '${line}'`);\n};\n\nlet weirdRabbit\
    \ = new Rabbit(\"weird\");\n```\n"
