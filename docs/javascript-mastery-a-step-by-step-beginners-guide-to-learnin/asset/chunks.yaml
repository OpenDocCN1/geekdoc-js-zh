    \nconsole.log(power(2, 3));\n```\n\n### Recursion\n\nThere is a problem with this\
    \ execution. It is slower compared to other looping versions. Utilizing a single\
    \ loop is considered lower cost than multiple calling of functions. Although that\
    \ does not make recursion an ineffective option of looping, a few problems are\
    \ solved with recursion easier than with the use of loops. Problems that need\
    \ inspecting or processing several branches Check this out: we begin from number\
    \ `1` and continuously add `5` or multiply by `3`. For instance, the number `13`\
    \ can be obtained by multiplying `3` and the addition of `5` twice, thereby we\
    \ cannot attain the `15`. The code is the recursive solution:\n\n```javascript\n\
    function findSolution(target) {\n  function find(current, history) {\n    if (current\
    \ == target) {\n      return history;\n    } else if (current > target) {\n  \
    \    return null;\n    } else {\n      return find(current + 5, `${history} +\
    \ 5`) ||\n             find(current * 3, `${history} * 3`);\n    }\n  }\n  return\
    \ find(1, \"1\");\n}\n\nconsole.log(findSolution(24));\n```\n\n`// → (((1 * 3)\
    \ + 5) * 3)`\n\nThe inner function `find` takes two arguments, the `current` number\
    \ and a string that documents the process of attaining this number. If a solution\
    \ is found, it sends back a string that displays the route to the `target` and\
    \ if no solution is found, the returned value will be `null`. To achieve this,\
    \ the function executes one of three actions. If your `current` number is the\
    \ `target`, you can attain that using the `current` history so sent back. Sometimes\
    \ the number is larger than the `target`, you do not need to explore this option\
    \ because addition and subtraction can only increase the number so sent back as\
    \ `null`. If you remain beneath the `target` number, both paths that begin by\
    \ calling itself twice, one to add and the other to multiply. If the first call\
    \ sends something valid back then good, if not return the second call, it does\
    \ not matter whether a string or `null` is provided. Below is an illustration\
    \ of how functions provide effects. This example searches for number `13`:\n\n\
    ```\nfind(1, \"1\")\nfind(6, \"(1 + 5)\")\nfind(11, \"((1 + 5) + 5)\")\nfind(16,\
