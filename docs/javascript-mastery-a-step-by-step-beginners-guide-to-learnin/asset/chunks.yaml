  trans: "\n\n```javascript\n{\n  events: [\"weekend\", \"cycling\", \"break\", \"\
    peanuts\", \"beer\"],\n  squirrel: true,\n}\n/* Aand Aso Aon... A*/\n];\n```\n\
    \n# 可变性\n\n我们讨论过不同的值，如 `Booleans`、`strings` 和 `Numbers`，这些值的值很难改变，尽管它们可以通过组合来获取新的值。`Objects`（对象）与值不同，它允许属性改变；可以在不同的时间为单个对象值创建不同的内容。\n\
    \n当有两个数字 `120` 和 `120` 时，它们被认为是相同的，且将两个引用指向同一个对象与拥有两个包含相同属性的独立对象之间存在相似性。检查下面的代码：\n\
    \n```javascript\nlet object1 = {value: 10};\nlet object2 = object1;\nlet object3\
    \ = {value: 10};\n\nconsole.log(object1 == object2);\n// → true\n\nconsole.log(object1\
    \ == object3);\n// → false\n\nobject1.value = 15;\n\nconsole.log(object2.value);\n\
    // → 15\n\nconsole.log(object3.value);\n// → 10\n```\n\n`object1` 和 `object2`\
    \ 绑定持有同一个对象，这就是为什么修改 `object1` 会影响 `object2` 的值。它们在本质上是相同的。绑定 `object3` 指向一个独立的对象，该对象包含与\
    \ `object1` 类似的属性，但具有不同的生命。绑定可以是常量的也可以是变的，但这不会影响它们的值。`const` 绑定对象不能被转换，并且始终坚定地指向同一个对象。可以改变的是对象的内容。\n\
    \n```javascript\nconst score = {visitors: 0, home: 0};\n// 这是可以的\nscore.visitors\
    \ = 1;\n// 这是不允许的\nscore = {visitors: 1, home: 1};\n```\n\n当使用 JavaScript 的 `==`\
    \ 运算符来区分对象时，它使用身份来执行该任务。如果对象包含相同的值，它将返回 `true`。区分多个对象将返回 `false`，即使它们的属性是类似的。\n\
    \n# 狼人日志\n\n现在，你启动了 JavaScript 解释器，并创建了记录日记所需的环境。\n\n```javascript\nlet journal\
    \ = [];\nfunction addEntry(events, squirrel) {\n  journal.push({events, squirrel});\n\
    }\n```\n\n它并没有声明如 `events` 之类的属性，而是设置了一个属性名。这样，在每天晚上 10 点或偶尔在第二天早上，从书架顶层下来后，就可以记录你的每日记录。\n\
    \n```javascript\naddEntry([\"work\", \"touched tree\", \"pizza\", \"running\"\
    , \"television\"], false);\naddEntry([\"work\", \"ice cream\", \"cauliflower\"\
    , \"lasagna\", \"touched tree\", \"brushed teeth\"], false);\naddEntry([\"weekend\"\
    , \"cycling\", \"break\", \"peanuts\", \"beer\"], true);\n```\n\n相关性是对分析变量之间脆弱性的评估。它们被称为范围从\
    \ `-1` 到 `1` 的值。不相关的变量被称为零相关。相关性为 `1` 表示两者是相关的。负值意味着变量之间是完美相关但相反的；一个是 `true`，另一个是\
    \ `false`。要计算两个 `Boolean` 值之间相关性的评估，请使用 Phi 系数 `(φ)`。该公式的输入是一个频率表，记录了观察到的几种变量组合的次数。公式的输出将是\
    \ `-1` 和 `1` 之间的数字。这是相关性的最佳定义。\n\n让我们用事件 `eating pizza`（吃披萨）为例，将其插入频率表中，其中每个数字代表总次数，我们在测量中使用该组合。我们将表格命名为\
    \ `n`，并使用下面的公式计算 `φ`：\n\n`φ = n11n00A - n10n01 / sqrt(n1•n0•n•1n•0)` \n\n注释 `n01`\
    \ 表示第一个变量变为 `false(0)` 且第二个变量变为 `true(1)` 的测量次数。披萨表 `n01` 值为 `9`。\n\n值 `n1•` 表示第一个变量变为\
    \ `true` 的所有测量总和，在表格示例中为 `5`。同样`n•0` 表示第二个变量变为 `false` 的测量数量。\n\n披萨表中，除法线上方将是\
    \ `1×76−4×9 = 40`，下方将是 `5×85×10×80` 的平方根，或 `√340000`。结果将是 `φ ≈ 0.069`，这是极小的。因此，吃披萨对转换没有影响。\n\
    \n# 计算相关性\n\nJavaScript 允许用四元素数组 `([76, 9, 4, 1])` 表示一个二二表格。其他表示法如持有两个二二元素的数组\
    \ `[[76, 9], [4, 1]]`，或包含如 `\"11\"` 和 `\"01\"` 属性名的对象，以及扁平数组，都会产生一个访问短索引的表达式。我们将数组索引解释为二位二进制数，其中高位引用\
    \ `squirrel` 变量，而低位引用 `event` 表。例如，二进制数 `10` 指的是 `\"did turn into a squirrel\"\
    ` 情况，但 `events` 没有出现。它发生了四次，二进制为十进制 `2`，数字存储在索引 `2`。该函数从数组计算 `φ` 系数：\n\n```javascript\n\
    function phi(chair) {\n  return (chair[3] * chair[0] - chair[2] * chair[1]) /\n\
    \  Math.sqrt((chair[2] + chair[3]) *\n  (chair[0] + chair[1]) *\n  (chair[1] +\
    \ chair[3]) *\n  (chair[0] + chair[2]));\n}\n\nconsole.log(phi([76, 9, 4, 1]));\n\
    // → 0.068599434\n```\n\n表格需要两个字段来获取类似 `n1•` 的字段，因为行列总数是间接存储的。如果你想为特定事件提取二二表格，你必须遍历所有的条目并计算事件发生的次数。\n\
    \n```javascript\nfunction tableFor(event, journal) {\n  let table = [0, 0, 0,\
    \ 0];\n  for (let i = 0; i < journal.length; i++) {\n    let entry = journal[i];\n\
    \    let index = 0;\n    if (entry.events.includes(event)) index += 1;\n    if\
    \ (entry.squirrel) index += 2;\n    table[index] += 1;\n  }\n  return table;\n\
    }\n\nconsole.log(tableFor(\"pizza\", journal));\n// → [76, 9, 4, 1]\n```\n\n#\
    \ 数组循环\n\n`tableFor` 函数包含像这样的循环：\n\n```javascript\nfor (let entry of journal)\
    \ {\n  console.log(`${entry.events.length} events.`);\n}\n```\n\n使用 `of` 循环类型，循环将跨越\
    \ `of` 之后指定的元素。这种循环用于现代 JavaScript。\n\n"
- fmt: "\n```javascript\n}\n\nconsole.log(journalEvents(JOURNAL));\n\n// A→ A[\"carrot\"\
    , \"exercise\", \"weekend\", \"bread\", ...]\n```\n\nBy moving `A` across every\
    \ `event` and making `additions` to those that are not in the `events` array,\
    \ this function gathers all the type of `event`.\n\nA lot of correlations appear\
    \ lie close to zero. Eating `bread`, `carrots` or `pudding` does not activate\
    \ `squirrel-lycanthropy`. It happens often during the weekends. Using that, below\
    \ are all the correlations.\n\n```javascript\nfor (let event of journalEvents(JOURNAL))\
    \ {\n\n  console.log(event + \":\", phi(tableFor(event, JOURNAL)));\n}\n```\n\n\
    // A→ carrot: 0.0140970969\n// A→ exercise: 0.0685994341\n// A→ weekend: 0.1371988681\n\
    // A→ bread: -0.0757554019\n// A→ pudding: -0.0648203724\n// A and so on...\n\n\
    ```javascript\nlet us = filter(results) to display only correlations that are\
    \ greater than 0.1 or less than -0.1.\n\nfor (let event of journalEvents(JOURNAL))\
    \ {\n\n  let correlation = phi(tableFor(event, JOURNAL));\n\n  if (correlation\
    \ > 0.1 || correlation < -0.1) {\n\n    console.log(event + \":\", correlation);\n\
    \n  }\n\n}\n```\n\n// A→ weekend: 0.1371988681\n// A→ brushedTeeth: -0.3805211953\n\
    // A→ candy: 0.1296407447\n// A→ work: -0.1371988681\n// A→ spaghetti: 0.2425356250\n\
    // A→ reading: 0.1106828054\n// A→ peanuts: 0.5902679812\n\nIn a correlation factors,\
    \ one is stronger than the other. Eating `peanuts` has a powerful chance of transforming\
    \ into a `squirrel`, thereby brushing the teeth has a notable negative effect.\
    \ Here's something:\n\n```javascript\nfor (let entry of JOURNAL) {\n\n  if (entry.events.includes(\"\
    peanuts\") &&\n\n  !entry.events.includes(\"brushedTeeth\")) {\n\n    entry.events.push(\"\
    peanutTeeth\");\n\n  }\n\n}\n\nconsole.log(phi(tableFor(\"peanut Teeth\", JOURNAL)));\n\
    \n// A→ 1\n```\n\n# Further arrayology\n\nHere are a few more object-related concepts\
    \ you should know. We begin with the use of some useful methods of an array.\n\
    \nThe adding and removing of methods things at the beginning of an array are called\
    \ `unshift` and `shift`.\n\n```javascript\nlet todoList = [];\n\nfunction remember(task)\
    \ {\n\n  todoList.push(task);\n}\n\nfunction getTask() {\n\n  return todoList.shift();\n\
    }\n\nfunction rememberUrgently(task) {\n  todoList.unshift(task);\n}\n```\n\n\
    The above program organizes a chain of tasks. You can add tasks to the end of\
    \ the queue by calling `remember(\"groceries\")`, and when you want to get something\
    \ done, call `getTask()` to get (and remove) an item from the queue. If you want\
    \ to search for a particular value, arrays supply an `indexOf` method. The method\
    \ finds its away through the array from the beginning to the end and sends back\
    \ the index of the value requested, if it was found it returns—or -1 if it wasn’t\
    \ found. To search from the beginning to the end, use the `lastIndexOf` method.\n\
    \n```javascript\nconsole.log([1, 2, 3, 2, 4].indexOf(3));\n\n// A→ 1\n\nconsole.log([1,\
    \ 2, 3, 2, 4].lastIndexOf(3));\n\n// A→ 3\n```\n\n`indexOf` and `lastIndexOf`\
    \ take a voluntary argument that specifies where the search begins. Another great\
    \ method is `slice`, this method begins and ends the indices and sends back an\
    \ array containing three elements. The beginning is inclusive while the end is\
    \ exclusive.\n\n```javascript\nconsole.log([0, 1, 2, 3, 5].slice(2, 4));\n\n//\
    \ A→ [2, 3]\n\nconsole.log([0, 1, 2, 3, 5].slice(2));\n\n// A→ [2, 3, 5]\n```\n\
    \nIf the end index is not stated, `slice` takes all the elements after the start\
    \ index. You can use the `concat` method to glue arrays together to produce a\
    \ new array. The below example displays `concat` and `slice` in action.\n\n```javascript\n\
    function remove(arrays, index) {\n\n  return array.slice(0, index)\n  .concat(arrays.slice(index\
    \ + 1));\n}\n\nconsole.log(remove([\"a\", \"k\", \"c\", \"f\", \"e\"], 2));\n\n\
    // A→ [\"a\", \"k\", \"f\", \"e\"]\n```\n\n# Strings and their properties\n\n\
    During the string value chapter, we discussed `length` and `toUpperCase` if you\
    \ want to add a new property, it does not stick.\n\n```javascript\nlet kim = \"\
    Kim\";\n\nkim.age = 88;\n\nconsole.log(kim.age);\n\n// A→ undefined\n```\n\nAll\
    \ strings value contains a few methods. Some are `slice` and `indexOf` which have\
    \ a similar appearance of array methods as well as the name.\n\n```javascript\n\
    console.log(\"coconuts\".slice(4, 7));\n\n// A→ nut\n\nconsole.log(\"coconut\"\
    .indexOf(\"u\"));\n\n// A→ 5\n```\n\nA string’s `indexOf` can look for a string\
    \ holding more than one character, while the corresponding array method search\
    \ for a single element.\n\n```javascript\nconsole.log(\"one two three\".indexOf(\"\
    ee\"));\n\n// A→ 11\n```\n\nThe `trim` method eradicates whitespace from the beginning\
    \ to the end of a string.\n\n```javascript\nconsole.log(\" okay \\n \".trim());\n\
    \n// A→ okay\n```\n\nThe `zeroPad` function can also be called a `padStart`, it\
    \ takes the preferred padding and length character as arguments.\n\n```javascript\n\
    console.log(String(6).padStart(3, \"0\"));\n\n// A→ 006\n```\n\nYou can break\
    \ a string on every development of another string with `split` and then join them\
    \ together with a `join`.\n\n```javascript\nlet sentence = \"Secretarybirds specialize\
    \ in stomping\";\n\nlet words = sentence.split(\" \");\n\nconsole.log(words);\n\
    \n// A→ [\"Secretarybirds\", \"specialize\", \"in\", \"stomping\"]\n\nconsole.log(words.join(\"\
    . \"));\n\n// A→ Secretarybirds.specialize.In.Stomping\n```\n\nYou can use the\
    \ `repeat` method to repeat a string, which develops a new string holding several\
    \ copies of the original string attached together.\n\n```javascript\nconsole.log(\"\
    LA\".repeat(3));\n\n// A→ LOLALA\n```\n\nIf you want to access individual characters:\n\
    \n```javascript\nlet string = \"ABC\";\n\nconsole.log(string.length);\n\n// A→\
    \ 3\n\nconsole.log(string[1]);\n\n// A→ B\n```\n\n# Rest parameters\n\nThe `...`\
    \ operator is important for functions to receive any number of arguments. You\
    \ can also pass arguments within an array.\n\n```javascript\nfunction max(...numbers)\
    \ {\n\n  let result = -Infinity;\n\n  for (let number of numbers) {\n    if (number\
    \ > result) result = number;\n  }\n\n  return result;\n}\n\nconsole.log(max(4,\
    \ 1, 9));\n\n// A→ 9\n\n```javascript\nlet numbers = [5, 1, 7];\n\nconsole.log(max(...numbers));\n\
    \n// A→ 7\n```\n"
