    \ precise and uniform syntax. Everything included in `Egg` is an expression. An\
    \ expression could be a binding name, number, string, or application. Utilize\
    \ applications for function calls and as well as constructs like `if` or `while`.\n\
    \nTo keep the simple parser, strings within `Egg` do not support backslash escapes.\
    \ A string is a sequence of characters that are not double quotes, enclosed in\
    \ double-quotes. Name binding can contain any character that isn't whitespace\
    \ and that do not contain a unique meaning in the syntax.\n"
