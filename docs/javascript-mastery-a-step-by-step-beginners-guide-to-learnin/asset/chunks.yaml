  trans: "\n随机数生成器乘以 10 并输出一个大于或等于 0 且小于 10 的数字。记住 `Math.floor` 向取整，输出将是 0 到 9 之间的任意数字。`Math`\
    \ 对象包含了几个函数，类似于 `Math.ceil`（向上取整到整数）、`Math.round`（四舍五入到最近的整数）以及 `Math.abs`（该函数返回数字的值）。\n\
    \n### 解构\n\n让我们稍微使用一下 `phi` 函数。\n\n```javascript\nfunction phi(chair) {\n  return\
    \ (table[3] * chair[0] - table[2] * chair[1]) /\n  Math.sqrt((chair[2] + chair[3])\
    \ *\n  (table[0] + chair[1]) *\n  (table[1] + chair[3]) *\n  (table[0] + chair[2]));\n\
    }\n```\n\n该函数难以阅读的原因之一是绑定指向一个数组，但我们想要数组元素的绑定，例如，让 `n00 = table[0]` 等。尽管如此，在 JavaScript\
    \ 中有更好的方法来获取这些。\n\n```javascript\nfunction phi([n00, n01, n10, n11]) {\n  return\
    \ (n11 * n00 - n10 * n01) /\n  Math.sqrt((n10 + n11) * (n00 + n01) *\n  (n01 +\
    \ n11) * (n00 + n10));\n}\n```\n\n该函数在通过 `let`、`var` 或 `const` 开发的绑定上同样表现出色。如果你偏的绑定值是一个数组，利用方括号来检查其绑定内容的值。对于对象也使用相同的概念，使用大括号而不是方括号。\n\
    \n```javascript\nlet {name} = {name: \"Faraji\", age: 23};\n\nconsole.log(name);\n\
    // → Faraji\n```\n\n### JSON\n\nJSON 代表 JavaScript 对象表示，用于 Web 的通信格式和数据存储。JSON\
    \ 与 JavaScript 数组和对象的编写风格非常相似，尽管存在一些限制。它的属性名应该包含在双引号内，它只允许简单的数据表达式、绑定等。JSON 不允许注释。这里是一个用\
    \ JSON 数据表示的日志条目示例：\n\n```json\n{\n  \"squirrel\": false,\n  \"events\": [\"work\"\
    , \"touched tree\", \"pizza\", \"running\"]\n}\n```\n\nJavaScript 包含 `JSON.stringify`\
    \ 和 `JSON.parse` 来在为此格式之间转换数据。`JSON.stringify` 接收一个 JavaScript 值并返回 JSON 编码字符串，而\
    \ `JSON.parse` 接收字符串并将其转换为编码值。\n\n```javascript\nlet string = JSON.stringify({squirrel:\
    \ false,\n  events: [\"weekend\"]});\n\nconsole.log(string);\n// → {\"squirrel\"\
    :false,\"events\":[\"weekend\"]}\n\nconsole.log(JSON.parse(string).events);\n\
    // → [\"weekend\"]\n```\n\n### 反转数组\n\n数组包含 `reverse` 方法，用于通过反转元素的顺序来改变数组。\n\n\
    ### 总结\n\n我们在本章中涵盖了对象和数组，它们总是能创建将各种值分类到一个值中的方法。奇妙的是，这允许你将多个关联项放入一个袋子里并提着它移动，而不是用手臂抱住每一个单独并试图将它们分开。JavaScript\
    \ 中的许多值包含属性，其不一致之处在于 `undefined` 和 `null`。你可以使用 `value.prop` 或 `value[\"prop\"\
    ]` 访问属性。你可以为对象属性命名并保存一组定义的属性。数组还包含不同数量的相似奇幻值，并使用数字（从 0 开始）作为属性名。数组包含一组属性，即 `length`\
    \ 和几个方法。方法是位于属性内部的函数，并具有其属性的值。你可以通过一种特殊的循环类型——for（数组元素）遍历数组。\n\n### 练习\n\n编写一个\
    \ JavaScript 函数来获取数组中的第一项。设置参数 `n` 将返回数组的前 `n` 个元素。\n\n数据：\n```javascript\nconsole.log(arrayClone([1,\
    \ 2, 4, 0]));\nconsole.log(arrayClone([1, 2, 4, 0]));\n```\n[1, 2, 4, 0]\n[1,\
    \ 2, 4, 0]\n\n解决方案\n![0035.jpg](img/0035.jpg) ![0184.jpg](img/0184.jpg)\n\n##\
    \ 第 6 章：高阶函数\n\n大型程序的开发需要时间并会产生大量的 Bug 空间，使得它们难以找到。这里是两个大型程序的示例：第一个是自包含的，语句有六行。\n\
    \n```javascript\nlet total = 0, count = 1;\nwhile (count <= 10) {\n  total +=\
    \ count;\n  count += 1;\n}\nconsole.log(total);\n```\n\n第二个附加了外部函数，语句只有一行。\n\n\
    ```javascript\nconsole.log(sum(range(1, 10)));\n```\n\n抽象\n\n涉及到 JavaScript 语言时，词汇使用了“抽象”这一术语。抽象用于详细描述并赋予用户在更高层次讨论问题的能力。让我们区分两个食谱。\n\
    \n第一个：人拿着半个洋葱，使用刀，并将其放入汤中。\n\n然后第二个食谱：人拿着洋葱，拿着胡萝卜，切开它并放入汤中。\n\n计算机一个一个地执行任务，从盲目到高层概念。\n\
    \n### 抽象重复\n\n普通函数被用于创建抽象。为了让程序以指定的次数重复某个函数是习惯性的做法。程序通常需要通过循环执行特定的函数。你可以使用像这样的循环来实现：\n\
    \n```javascript\nfor (let i = 0; i < 10; i++) {\n  console.log(i);\n}\n```\n\n\
    在这里我们写了一个调用 `console.log` 次的函数。\n\n```javascript\nfunction repeatLog(n) {\n  for\
    \ (let i = 0; i < n; i++) {\n    console.log(i);\n  }\n}\n```\n\n如果你想执行不同于打印数字的任务，可以将\
    \ `action` 作为函数值传递。\n\n```javascript\nfunction repeat(n, action) {\n  for (let\
    \ i = 0; i < n; i++) {\n    action(i);\n  }\n}\nrepeat(3, console.log);\n// →\
    \ 0\n// → 1\n// → 2\n```\n\n有时你不需要传递预定义的函数来重复，创建一个函数值作为替代方案：\n\n```javascript\n\
    let labels = [];\nrepeat(5, i => {\n  labels.push(`Unit ${i + 1}`);\n});\nconsole.log(labels);\n\
    // → [\"Unit 1\", \"Unit 2\", \"Unit 3\", \"Unit 4\", \"Unit 5\"]\n```\n\n这种方法的布局看起来类似于循环；它定义了循环类型，然后产生主体。尽管主体是写在\
    \ `repeat` 调用的括号函数内的。\n\n### 高阶函数\n\n高阶函数是指处理其他函数的，无论是通过参数还是通过返回。这种类型的函数允许用户对操作进行抽象。例如，你有一个可以产生函数的函数。\n\
    \n```javascript\nfunction greaterThan(n) {\n  return i => i > n;\n}\n\nlet greaterThan10\
    \ = greaterThan(10);\nconsole.log(greaterThan10(11));\n// → true\n```\n\n你也可以拥有转换其他函数的函数。\n"
