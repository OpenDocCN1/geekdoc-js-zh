  trans: "\n`findIndex` 方法与 `indexOf` 相似。该方法用于搜索使指定 `function` 返回 `true` 的第一个 `value`（value），并且当未找到\
    \ `zero` 个元素时返回 `-1`。你可以使用 `countBy` 来确定文本 `block` 中使用了哪种脚本（script）。\n\n```javascript\n\
    function textScripts(text) {\n  let scripts = countBy(text, char => {\n    let\
    \ script = characterScript(char.codePointAt(0));\n    return script ? script.name\
    \ : \"none\";\n  }).filter(({name}) => name != \"none\");\n\n  let total = scripts.reduce((n,\
    \ {count}) => n + count, 0);\n\n  if (total == 0) return \"No scripts found\"\
    ;\n\n  return scripts.map(({name, count}) => {\n    return `${Math.round(count\
    \ * 100 / total)}%${name}`;\n  }).join(\", \");\n}\n\nconsole.log(textScripts('英国的狗说\"\
    woof\", 俄罗斯的狗说\"тяв\"'));\n// → 61% Han, 22% Latin, 17% Cyrillic\n```\n\n该 `function`\
    \ 通过使用 `characterScript` 按 `name` 计算字符，为其附加一个 `name`，并对没有任何脚本的字符返回字符串 `\"none\"\
    `。如果你想计算百分比，需要确定 `reduce` 方法可以处理的属于 `script` 的字符总数 `total`。如果找到 `zero` 个字符，`function`\
    \ 将返回 `\"none\"` 字符串。\n\n### 总结\n\n能够将 `function` `values` 传递给多个 `functions` 是\
    \ `JavaScript` 的一个重要方面。它允许编写在计算之间留有“间隙”的函数。声明这些函数的代码可以通过提供 `function` `values`\
    \ 来包含这些间隙。`Arrays` 提供了几个重要的高阶方法。使用 `forEach` 遍历 `array` 中的元素。使用 `filter` 方法返回一个包含通过\
    \ `predicate` `function` 测试元素的新 `array`。使用 `map` 通过 `function` 设置每个 `item` 来更改\
    \ `array`。使用 `reduce` 将 `array` 的每个组件合并为一个单个 `value`。\n\n### 练习\n\n编写一个 `JavaScript`\
    \ `function`，它接收一个保存的数字 `array`，并搜索第二低和第二高的 `numbers`。\n\n### 答案\n\n![00160.jpg](img/00160.jpeg)![00139.jpg](img/00139.jpeg)\n\
    \n## 第 7 章：对象的秘密生活\n\n在涉及编程语言时，有一套将 `objects` 作为程序组织基本思想的技术，它们被称为面向对象编程。这一概念将在本章中进一步解释。\n\
    \n### 封装\n\n面向对象编程的主要意义是将程序拆分为小部分，并确保每个部分管理自己的区域。几个相似的程序片段通过 `interfaces` 相互通信，`interfaces`\
    \ 是受限制的 `functions` 集合或绑定，在更高层次上产生核心功能，同时隐藏具体的执行细节。通过 `objects` 展示这种类型的程序片段，它们的布局包含一组特定的\
    \ `properties` 和 `methods`。布局中的属性是 `public`（公共的），而外部代码是 `private`（私有的）。在注释或文档定义可访问的布局。通常在属性名开头使用下划线（`_`）来表示\
    \ `private` `properties`。同时，将布局从执行中分离出来被称为“封装”。\n\n### 方法\n\n方法是获取 `function`\
    \ `values` 的 `properties`。\n\n```javascript\nlet rabbit = {};\n\nrabbit.speak\
    \ = function(line) {\n  console.log(`The Arabbit says '${line}'`);\n};\n\nrabbit.speak(\"\
    I'm alive.\");\n// → The Arabbit says 'I'm alive.'\n```\n\n当你把 `function` 作为 `method`\
    \ 调用时，绑定会在其体内调用它，并将其指向调用它的 `object`。\n\n```javascript\nfunction speak(line) {\n\
    \  console.log(`The ${this.type} Arabbit says '${line}'`);\n}\n\nlet whiteRabbit\
    \ = {type: \"white\", speak};\nlet hungryRabbit = {type: \"hungry\", speak};\n\
    \nwhiteRabbit.speak(\"Oh Amy Whiskers,\" + \"how late it's getting!\");\n// →\
    \ The white Arabbit says 'Oh Amy Whiskers, how late it's getting!'\n\nhungryRabbit.speak(\"\
    I could use a carrot right now.\");\n// → The hungry Arabbit says 'I could use\
    \ a carrot right now.'\n```\n\n箭头函数 `functions` 不绑定它们自己的 `this`。你可以编写以下代码：\n\n\
    ```javascript\nfunction normal() {\n  console.log(this.coords.map(n => n / this.length));\n\
    }\n\nnormal.call({coords: [0, 2, 3], length: 5});\n// → [0, 0.4, 0.6]\n```\n\n\
    ### 原型\n\n留意 `this`。\n\n```javascript\nlet empty = {};\n\nconsole.log(empty.toString);\n\
    // → function toString() { ... }\n```\n\n```javascript\nconsole.log(empty.toString());\n\
    // → [object Object]\n```\n\n`empty` 的 `prototype` 是 `Object.prototype`。许多 `JavaScript`\
    \ 对象包含一个 `prototype`，因此它们继承自 `Object.prototype`。\n\n```javascript\nconsole.log(Object.getPrototypeOf({})\
    \ === Object.prototype);\n// → true\n\nconsole.log(Object.getPrototypeOf(Object.prototype));\n\
    // →\n```\n\n对象的 `prototype` 默认是 `Object.prototype`。但 `Functions` 继承自 `Function.prototype`，而\
    \ `arrays` 继承自 `Array.prototype`。\n\n```javascript\nconsole.log(Object.getPrototypeOf(Math.max)\
    \ === Function.prototype);\n// → true\n\nconsole.log(Object.getPrototypeOf([])\
    \ === Array.prototype);\n// → true\n```\n\n对象的 `prototype` 可以被设置或更改。使用 `Object.create`\
    \ 构建一个具有特定 `prototype` 的对象。\n\n```javascript\nlet protoRabbit = {\n  speak(line)\
    \ {\n    console.log(`The ${this.type} Arabbit says '${line}'`);\n  }\n};\n\n\
    let killerRabbit = Object.create(protoRabbit);\nkillerRabbit.type = \"killer\"\
    ;\n\nkillerRabbit.speak(\"SKREEE!\");\n// → The killer Arabbit says 'SKREEE!'\n\
    ```\n\n### 类\n\nJavaScript 的 `prototype` 系统可以被描述辅助方法 `classes`。`class` 描述了一个对象类型的形状、它的\
    \ `properties` 和 `methods`。`Prototypes` 用于描述每个实例共享相似 `values`（如 `methods`）的属性。如果你想构建一个\
    \ `class` 的实例，创建一个继承自普通 `Prototype` 的对象。确保它包含了应该包含在该 `class` 实例中的 `properties`。以下是\
    \ `constructor` 函数。\n\n```javascript\nfunction Rabbit(type) {\n  this.type = type;\n\
    }\n\nRabbit.prototype.speak = function(line) {\n  console.log(`The ${this.type}\
    \ Arabbit says '${line}'`);\n};\n\nlet weirdRabbit = new Rabbit(\"weird\");\n\
    ```\n"
