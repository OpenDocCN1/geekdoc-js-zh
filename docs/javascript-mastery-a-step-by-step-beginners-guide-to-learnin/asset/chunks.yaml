    \ a new type of `request`. The example attaches support for \"note\" requests\
    \ that sends a note to a stated nest. Our implementation calls `console.log` so\
    \ that we can check if the request has arrived. Nests consist of a `name` property\
    \ that holds its `name`.\n\nThe fourth argument stated to the `handler`, `done`,\
    \ is a callback function that calls when it has completed the task. If you use\
    \ the `handler`’s return value as the value of the `response`, that means that\
    \ the `request.handler` can’t execute asynchronous actions itself. A function\
    \ performing asynchronous actions returns before the task completes, having a\
    \ callback ready to be called upon when it finishes. In a way, asynchronicity\
    \ is contagious. A function that calls a function that performs asynchronously\
    \ must be asynchronous itself, utilizing a callback to deliver its result. Calling\
    \ a callback is error-prone and more involved than simply sending back a value.\n\
    \n# Promises\n\nWorking with abstract methods is simpler when values are present\
    \ in the methods. In the case of asynchronous actions, instead of making preparations\
    \ for a function to be called at a certain point in the future, send back an object\
    \ that stands for the future event. A promise is an asynchronous action that can\
    \ finish at some point and provide a value. It can notify anyone interested when\
    \ its value is available.\n\nThe simplest way to build a promise is by calling\
    \ `Promise.resolve()`. This function guarantees that the value you set encloses\
    \ in a promise. If it is a promise already, it returns. Otherwise, a new promise\
    \ will be created instantly with your value as a result.\n\n```javascript\nlet\
    \ fifteen = Promise.resolve(15);\n\nfifteen.then(value => console.log(`Got ${value}`));\n\
    \n// → Got 15\n```\n\nTo achieve the result of a promise, utilize its former method\
    \ `.then()`. It indicates an intended callback function when the promise resolves\
    \ and provides a value. You can attach several callbacks to an individual promise,\
    \ and they will all all the callbacks, even if they were attached when the promise\
    \ has been completed. The `then` method also sends back another promise that resolves\
    \ to the value that the `handler` function returns. It is important to see promises\
    \ as a device to turn values into an asynchronous reality. A promised value is\
    \ a value that could be there or could display at a certain point in the future.\
    \ Computations described in terms of promises work on enclosed values and are\
    \ performed asynchronously as the values become available.\n\nTo build a promise,\
    \ use `Promise` as a constructor. It contains an odd layout, and the constructor\
    \ expects a function as an argument, which it calls instantly, sending it a function\
    \ that can be used to solve the promise. It is how to build a promise-based layout\
    \ for the read storage function:\n\n```javascript\nfunction storage(nest, name)\
    \ {\n  return new Promise(resolve => {\n    nest.readStorage(name, result => resolve(result));\n\
    \  });\n}\n\nstorage(bigOak, \"enemies\")\n  .then(value => console.log(\"Got\"\
    , value));\n```\n\nThis asynchronous function returns a significant value.\n\n\
    # Failure\n\nJavaScript computing can fail by outputting an exception. A network\
    \ request could fail, or some asynchronous code computation could bring an exception.\
    \ Asynchronous programming callback style most consistent issues are that it makes\
    \ it very hard to ensure failures are revealed correctly to the callbacks.\n\n\
    A generally used method is that the first argument to the callback is used to\
    \ specify the failed action, and the second has the value provided by the action\
    \ when it completes. Such callback functions always check if they obtain an exception\
    \ and ensure that any uprising problems, including exceptions output by functions\
    \ they call, are given to the correct function. They can reduce when it completes\
    \ successfully or decline when it fails.\n\nA `call` reduce handlers it only when\
    \ the task completes successfully and declines automatically generated to the\
    \ returned new promise. And when a `handler` outputs an exception, this automatically\
    \ triggers the promise provided by its recent call declines.\n\nWhen an element\
    \ in a chain of asynchronous actions fails, the output of the whole chain declines\
    \ and no success handlers call past the failing point. Much alike solving a promise\
    \ produces a value, rejecting one also provide provide one, often called the rejection\
    \ reason. If an exception in a `handler` function creates a rejection, use the\
    \ `exception` value as the reason.\n\nComparably, when a `handler` sends back\
    \ a rejected promise, that rejection goes into the next promise. There’s a promise.\
    \ `reject()` function that develops a new, instantly declined promise. If a `catch`\
    \ handler output an error, the new promise is equally declined. In shorthand,\
    \ then also take a decline `handler` as a second argument, so you should install\
    \ two types of handlers in an individual method call.\n\nThe `Promise` constructor\
    \ accepts a second argument, together with the `resolve` function, which it can\
    \ use to decline the new promise. The chains of `Promise` values developed by\
    \ calls to `then` are recognized as a pipeline as asynchronous values or failures\
    \ move through. Because those chains built by registering handlers, every link\
    \ consists of either both a success `handler` or a rejection `handler` related\
    \ to it. Handlers that do not match the type of output declined. But those that\
    \ match get called, and their output decides what type of value comes next: success\
    \ when it sends back a non-promise value, rejection when it outputs an exception,\
    \ and the result of a promise when it sends back one of those.\n\n```javascript\n\
    new Promise((_, reject) => reject(new Error(\"Fail\")))\n  .then(value => console.log(\"\
    Handler A1\"))\n  .catch(reason => {\n    console.log(\"Caught Failure \" + reason);\n\
    \    return \"nothing\";\n  })\n  .then(value => console.log(\"Handler A2\", value));\n\
    \n// → Handler A1 (not called because it failed)\n// → Caught Failure Error: Fail\n\
    // → Handler A2 nothing\n```\n"
