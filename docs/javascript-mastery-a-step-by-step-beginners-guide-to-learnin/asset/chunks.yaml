    \ 1, day);\n}\n\nconsole.log(getDate(\"1-30-2003\"));\n// → Thursday Jan 30 2003\
    \ 00:00:00 GMT+0100 (CET)\n```\n\n### String and Word Boundaries\n\nYou can ensure\
    \ that the match spans the entire string by adding the markers `^` and `$`. The\
