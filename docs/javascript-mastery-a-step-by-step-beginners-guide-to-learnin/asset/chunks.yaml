  trans: "\n\n为了提供基础的算术运算符和比较运算符，我们将函数值加入一个作用域。我们将在循环中对几个运算符函数使用函数，而不是逐个声明它们。\n\n\
    ```javascript\nfor (let op of [\"+\", \"-\", \"*\", \"/\", \"==\", \"<\", \">\"\
    ]) {\n  topScope[op] = Function(\"a, b\", `return a ${op} b;`);\n}\n```\n\n我们将\
    \ `console.log` 封装在一个函数中输出值，并将其命名为 `print`。\n\n```javascript\ntopScope.print =\
    \ value => {\n  console.log(value);\n  return value;\n};\n```\n\n这为编写简单的程序、在新的作用域中分析和运行程序提供了充足的底层工具：\n\
    \n```javascript\nfunction run(program) {\n  return evaluate(parse(program), Object.create(topScope));\n\
    }\n```\n\n`object prototype` 链将代表嵌套作用域，允许在不改变高层作用域的情况下添加绑定。\n\n```javascript\n\
    run(`\ndo(define(total, 0),\ndefine(count, 1),\nwhile(<(count, 11),\ndo(define(total,\
    \ +(total, count)),\ndefine(count, +(count, 1)))),\nprint(total))\n`);\n```\n\n\
    // → 55\n\n这个概念解释了从 1 到 10 的数字和，正如蛋里所示的那样。\n\n### Functions\n\n一个没有函数的编程语言是非常糟糕的，尽管插入一个使用最后一个参数作为函数体的函数是很容易的。它利用在此之前的每个参数用作函数的参数名。\n\
    \n```javascript\nspecialForms.fun = (args, scope) => {\n  if (!args.length) {\n\
    \    throw new SyntaxError(\"Functions need a body\");\n  }\n  let body = args[args.length\
    \ - 1];\n  let param = args.slice(0, args.length - 1).map(expr => {\n    if (expr.type\
    \ != \"word\") {\n      throw new SyntaxError(\"Parameter names must be words\"\
    );\n    }\n    return expr.name;\n  });\n\n  return function() {\n    if (arguments.length\
    \ != param.length) {\n      throw new TypeError(\"Wrong number of arguments\"\
    );\n    }\n    let localScope = Object.create(scope);\n    for (let i = 0; i <\
    \ arguments.length; i++) {\n      localScope[param[i]] = arguments[i];\n    }\n\
    \    return evaluate(body, localScope);\n  };\n};\n```\n\n`egg functions` 有它们自己的局部作用域。由\
    \ `fun` 形式提供的函数构建了这个局部作用域并将参数绑定到其上。它随后在该作用域中访问函数体并返回结果。\n\n```javascript\nrun(`\n\
    do(define(plusOne, fun(a, +(a, 1))),\nprint(plusOne(10)))\n`);\n```\n\n// → 11\n\
    \n```javascript\nrun(`\ndo(define(pow, fun(base, exp,\nif(==(exp, 0),\n1,\n*(base,\
    \ pow(base, -(exp, 1)))))),\nprint(pow(2, 10)))\n`);\n```\n\n// → 1024\n\n###\
    \ Summary\n\n我们在本章中涵盖了解析、函数、特殊形式和评估器。符号或语法是编程的每一个重要方面。`parser` 读取文本并提供一种显示文本中程序布局的数据结构。如果文本创建了无效程序，`parser`\
    \ 将指示错误。\n\n### Exercise\n\n编写一个 JavaScript 函数来计算正整数的因数。\n\n### Solution\n\n![00114.jpg](img/00114.jpeg)![00112.jpg](img/00112.jpeg)\n\
    \n## Conclusion\n\n本书包含了与 JavaScript 编程语言相关的重要信息。书中的信息将帮助你理解和练习各种 JavaScript 运算符、循环、条件语句、函数、变量作用域、类型等。随着课程接近尾声，你将对\
    \ JavaScript 语言有良好的理解，因为你已经学习了 JavaScript 和形式，你将理解 jQuery、框架和调试脚本的基础。给程序员的最好建议就是坚持练习，因为那是掌握所学知识的唯一途径。\n\
    \n"
