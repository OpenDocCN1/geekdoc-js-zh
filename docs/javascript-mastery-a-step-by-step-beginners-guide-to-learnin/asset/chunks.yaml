    \ 0,0\n// A→ 1 0 value 1,0\n// A→ 0 1 value 0,1\n// A→ 1 1 value 1,1\n\n### Statics,\
    \ Getters, and Setters\n\nLayouts consist of methods, but you can also attach\
    \ properties that store values with no function like a `Map` or `object` containing\
    \ a `size` property that determines how many keys are saved in them. An assessed\
    \ property can hide a method call. Those methods are called getters, and you can\
    \ describe them by writing a \"get\" at the beginning of the method name in a\
    \ class declaration or an object expression.\n\n```javascript\nlet varyingSize\
    \ = {\n\n  get size() {\n\n    return Math.floor(Math.random() * 100);\n\n  }\n\
    \n};\n\nconsole.log(varyingSize.size);\n\n// A→ 73\nconsole.log(varyingSize.size);\n\
    \n// A→ 49\n```\n\nWhen you want to use an object’s size property, you call the\
    \ associated method. You can perform a similar task when you have a property using\
    \ a setter.\n\n```javascript\nclass Temperature {\n\n  constructor(celsius) {\n\
    \    this.celsius = celsius;\n  }\n\n  get fahrenheit() {\n    return this.celsius\
    \ * 1.8 + 32;\n  }\n\n  set fahrenheit(value) {\n    this.celsius = (value - 32)\
    \ / 1.8;\n  }\n\n  static fromFahrenheit(value) {\n    return new Temperature((value\
    \ - 32) / 1.8);\n  }\n\n}\n```\n\n```javascript\nlet temp = new Temperature(22);\n\
    \nconsole.log(temp.fahrenheit);\n\n// A→ 71.6\ntemp.fahrenheit = 86;\n\nconsole.log(temp.celsius);\n\
    \n// A→ 30\n```\n\nThe `Temperature` class enables you to read and write the temperature\
    \ in degrees Celsius or degrees Fahrenheit, but it saves only Celsius and transforms\
    \ to and from Celsius in the `fahrenheit` getter and setter. Within a class declaration,\
    \ methods that are `static` are written before their names are saved on the `constructor`.\
    \ So, you can write `Temperature.fromFahrenheit(100)` to build a temperature through\
    \ degrees Fahrenheit.\n\n### Inheritance\n\nSome matrices are asymmetric. When\
    \ you reflect an asymmetric matrix through its top-left-to-bottom-right diagonal,\
    \ it does not change. The value set at `x,y` remains the same as the one at `y,x`.\
    \ Use JavaScript’s `prototype` system to build a new class, the `prototype` for\
    \ the new class is acquired from the old prototype but sets a new definition for\
    \ the method. This is called inheritance in object-oriented programming. Below\
    \ is an illustration:\n\n```javascript\nclass AsymmetricMatrix extends AMatrix\
    \ {\n\n  constructor(size, element = (x, y) => undefined) {\n    super(size, size,\
    \ (x, y) => {\n      if (x < y) return element(y, x);\n      else return element(x,\
    \ y);\n    });\n  }\n\n  set(x, y, value) {\n    super.set(x, y, value);\n   \
    \ if (x != y) {\n      super.set(y, x, value);\n    }\n  }\n\n}\n```\n\n```javascript\n\
    let matrix = new AsymmetricMatrix(5, (x, y) => `${x},${y}`);\n\nconsole.log(matrix.get(2,\
    \ 3));\n\n// A→ 3,2\n```\n\n### The `instanceof` operator\n\nIt is important to\
    \ know if an object was gotten from a particular `instanceof`.\n\n```javascript\n\
    console.log(new AsymmetricMatrix(2) instanceof AsymmetricMatrix);\n\n// A→ true\n\
    console.log(new AsymmetricMatrix(2) instanceof AMatrix);\n\n// A→ true\nconsole.log(new\
    \ AMatrix(2, 2) instanceof AsymmetricMatrix);\n\n// A→ false\nconsole.log([1]\
    \ instanceof Array);\n\n// A→ true\n```\n\nThe operator will scan through the\
    \ types that were inherited. Therefore, an `AsymmetricMatrix` is an instance of\
    \ `AMatrix`. You can also apply this method to standard constructors like `Array`.\n\
    \n### Summary\n\nIn this chapter, we realize that objects can perform more than\
    \ holding their properties. They consist of prototypes that are objects as well.\
    \ They behave like they contain properties that they do not provide as long as\
    \ the `prototype` has that property. Simple objects use the `Object`. A `Prototype`\
    \ to are represents their prototype. We talked about constructors too, and they\
    \ are functions that their names often begin with a capital letter, and are used\
    \ with the `new` operator to build new objects. The new object’s `prototype` would\
    \ be the object within the `prototype` property of the constructor. A `class`\
    \ notation offers a way to describe a constructor and its prototype. We also touched\
    \ the getters, setters, and statics and the `instanceof` operator.\n\n### Exercise\n\
    \nWrite a JavaScript program to create an array, through an iterator function\
    \ and a primary seed value.\n\n### Solution\n\n![00194.jpg](images/00194.jpeg)\n\
    \n## Chapter 8: A Robot\n\nIn this chapter, there will be work on a robot program,\
    \ a short program that executes a task in a virtual world. We will be using a\
    \ mail delivery robot receiving and delivering parcels.\n\n#### Meadow field\n\
    \nThe Meadow field village is a small one consisting of 14 roads and 11 places.\
    \ Below is an illustration with an array of roads:\n\n```javascript\nconst roads\
    \ = [\n  \"Alice's House-Bob's House\", \"Alice's House-Cabin\",\n  \"Alice's\
    \ House-Post Office\", \"Bob's House-Town Hall\",\n  \"Daria's House-Ernie's House\"\
    , \"Daria's House-Town Hall\",\n  \"Ernie's House-Grete's House\", \"Grete's House-Farm\"\
    ,\n  \"Grete's House-Shop\", \"Marketplace-Farm\",\n  \"Marketplace-Post Office\"\
    , \"Marketplace-Shop\",\n  \"Marketplace-Town Hall\", \"Shop-Town Hall\"\n]\n\
    ```\n\nThe village `roads` create a graph. A graph is a group of points (village\
    \ places) with lines dividing them (roads). The graph is the world where our robot\
    \ walks through. Now let us transform our list to a data layout that each place\
    \ decides where you can.\n\n```javascript\nfunction buildGraph(border) {\n  let\
    \ graph = Object.create(Null);\n\n  function addEdge(from, to) {\n    if (graph[from]\
    \ == null) {\n      graph[from] = [to];\n    } else {\n      graph[from].push(to);\n\
    \    }\n  }\n\n  for (let [from, to] of border.map(r => r.split(\"-\"))) {\n \
    \   addEdge(from, to);\n    addEdge(to, from);\n  }\n\n  return graph;\n}\n\n\
    const roadGraph = buildGraph(roads);\n```\n\nGiven an array of edges, `buildGraph`\
    \ creates a map object that, for each node, saves an connected node. It utilizes\
    \ the `split` method to go through the road strings, that contains the form \"\
    Start-End\", two-element arrays within the start and end as different strings.\n\
    \n### The Task\n\nOur robot will walk across the village. There are different\
    \ parcels in several places. The robot receives a parcel when it arrives and delivers\
    \ them when it gets to their destination. When all tasks have all been executed,\
    \ all parcels must be delivered. If you want to replicate this process, describe\
    \ a virtual world that can define it. This method reveals the robot location as\
    \ well as the parcels. Let us bring down the village's state to a specific set\
    \ of values that describes it.\n\n```javascript\nclass VillageState {\n\n  constructor(place,\
    \ parcels) {\n    this.place = place;\n    this.parcels = parcels;\n  }\n\n  move(destination)\
    \ {\n    if (!roadGraph[this.place].includes(destination)) {\n      return this;\n\
    \    } else {\n      let parcels = this.parcels.map(p => {\n        if (p.place\
    \ != this.place) return p;\n        return { place: destination, address: p.address\
    \ };\n      }).filter(p => p.place != p.address);\n      return new VillageState(destination,\
    \ parcels);\n    }\n  }\n\n}\n\n}\n```\n"
