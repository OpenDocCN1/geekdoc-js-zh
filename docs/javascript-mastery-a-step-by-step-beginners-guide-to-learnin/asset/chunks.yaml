    \ known?\", ages.has(\"Jack\")); // A→ Is Jack's age known? false\n\nconsole.log(ages.has(\"\
    toString\")); // A→ false\n```\n\n`get`、`set` 和 `has` 方法是 `map` 对象布局的主体。`Object.keys`\
    \ 仅返回对象的自身的键。你可以使用 `hasOwnProperty` 方法作为选项。\n\n```javascript\nconsole.log({x:\
    \ 1}.hasOwnProperty(\"x\")); // A→ true\n\nconsole.log({x: 1}.hasOwnProperty(\"\
    toString\")); // A→ false\n```\n\n### 多态 (Polymorphism)\n\n当在 `object` 上调用字符串函数时，会调用该对象上的\
    \ `toString` 方法以从其构建有意义的字符串。你可以定义自己的 `toString` 版本，以便它们可以构建出比“[[object Object]]”包含更多重要数据的字符串。以下是一个示例：\n\
    \n```javascript\nRabbit.prototype.toString = function() {\n  return `a ${this.type}\
