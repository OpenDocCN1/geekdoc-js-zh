  trans: "\n\n`exec` 方法提供了一种更好的方法。正则表达式对象包含一个名为 `source` 的属性，它由从表达式构建的字符串组成。`lastIndex`\
    \ 是另一个属性，它影响某些特殊情况，即下一次匹配的开始位置。正则表达式必须包含全局 `(g)` 或粘性 `(y)` 选项，并将使用 `exec` 方法进行匹配。下所示：\n\
    \n```javascript\nlet pattern = /y/g;\n\npattern.lastIndex = 3;\n\nlet match =\
    \ pattern.exec(\"xyzzy\");\n\nconsole.log(match.index);\n\n// → 4\n\nconsole.log(pattern.lastIndex);\n\
    \n// → 5\n```\n\n全局选项和粘性选项之间的区别在于：当启用粘性时，如果匹配从 `lastIndex` 开始则匹配成功；而在全局模式下，它会寻找一个匹配可以开始的位置。\n\
    \n```javascript\nlet global = /ABC/g;\n\nconsole.log(global.exec(\"XYZ AABC\"\
    ));\n\n// → [\"ABC\"]\n\nlet sticky = /ABC/y;\n\nconsole.log(sticky.exec(\"XYZ\
    \ AABC\"));\n\n// → null\n```\n\n如果你在多次调用中使用共享的正则表达式值，那么 `lastIndex` 属性的自动更新会出现问题。\n\
    \n```javascript\nlet digit = /\\d/g;\n\nconsole.log(digit.exec(\"it is here: 1\"\
    ));\n\n// → [\"1\"]\n\nconsole.log(digit.exec(\"and now: 1\"));\n\n// → null\n\
    ```\n\n全局选项也改变了概念。字符串上的 `match` 方法也可以工作。\n\n### 遍历匹配项\n\n最好的方法是扫描字符串中模式的所有事件，并在循环体中访问匹配对象。使用\
    \ `lastIndex` 和 `exec` 来实现这一目标。\n\n```javascript\nlet input = \"A string with\
    \ three numbers... 42 and 88.\";\n\nlet number = /\\b\\d+\\b/g;\n\nlet match;\n\
    \nwhile (match = number.exec(input)) {\n  console.log(\"Found\", match[0], \"\
    at\", match.index);\n}\n\n// → Found 3 at 14\n// → Found 42 at 33\n// → Found\
    \ 88 at 40\n```\n\n赋值表达式的值（`=`）是指定的赋值。因此，在 `while` 语句中使用 `match = number.exec(input)`\
    \ 作为条件，匹配意味着我们在每次迭代的开始时执行匹配，将结果存储在绑定中，并在无法再找到匹配项时停止循环。\n\n### 解析 INI 文件\n\n```ini\n\
    search_engine=https://duckduckgo.com/?q=$1\nspitefulness=9.7\n; 注释以分号开头\n; 每个节涉及一个特定的敌人\n\
    \n[larry]\nfullname=Larry Doe\ntype=kindergarten bully\nwebsite=http://www.google.com/google/\n\
    \n[davaeorn]\nfullname=Davaeorn\ntype=evil witch\noutputdir=/home/margin/enemy/davaeorn\n\
    ```\n\n这种格式（通常通用的格式，通常称为 INI 文件）的规则是：\n\n* 忽略空行和以分号开头的行。\n* 被 `[]` 包围的行开始一个新节区。\n\
    * 由字母数字标识符配合 `=` 字符组成的行将设置附加到当前节区。\n* 其他所有内容都是无效的。\n\n我们的任务是将像这样的字符串转换为对象，其属性使用字符串存储写在节区子对象和第一个节区头部之前的设置。子对象持有该节区的设置。使用回车符加换行符（`\\\
    r\\n`）而不是换行符来区分行。这将使得 `split` 方法允许将正则表达式作为参数，你可以利用类似 `/\\r?\\n/` 的正则表达式来分割支持行之间的\
    \ `\"\\n` 和 `\"\\r\\n`。\n\n```javascript\nfunction parseINI(string) {\n  // 开始一个用于存储顶层字段的对象\n\
    \  let result = {};\n  let section = result;\n\n  string.split(/\\r?\\n/).forEach(line\
    \ => {\n    let match;\n    if (match = line.match(/^(\\w+)=(.*)$/)) {\n     \
    \ section[match[1]] = match[2];\n    } else if (match = line.match(/^\\[(.*)\\\
    ]$/)) {\n      section = result[match[1]] = {};\n    } else if (!/^\\s*(;.*)?$/.test(line))\
    \ {\n      throw new Error(\"Line '\" + line + \"' Invalid.\");\n    }\n  });\n\
    \n  return result;\n}\n\nconsole.log(parseINI(`\nname=Vasilis\n[address]\ncity=Tessaloniki`));\n\
    // → {name: \"Vasilis\", address: {city: \"Tessaloniki\"}}\n```\n\n代码遍历文件行并创建一个对象。顶部的属性直接保存到该对象中，而节区中的属性保存在不同的节区对象中。节绑定指向现有节区的对象。有两种重要的行类型——节区头部或属性行。如果一行总是属性，它会被保存在现有节区中。如果是节区头部，则创建一个新的节区对象并将节\
    \ 指向它。\n\n`(match = string.match())` 模式与利用赋值作为 `while` 条件的技巧相同。\n\n### 国际字符\n\n\
    由于 JavaScript 最初的简单实现以及这种方法被设置为标准行为，JavaScript 的正则表达式对于英语语言中未显示的字符相当“愚笨”。例如，在\
    \ JavaScript 中，正则表达式的“单词字符”只是拉丁字母中的 26 个字符之一（小写或大写）、数字和下划线字符。像 `é` 或 `ß` 字符是单词字符，它们不会匹配\
    \ `\\w`，但会匹配大写的 `\\W`（非单词类别）。这表示字符是由两个代码单元组成的。\n\n```javascript\nconsole.log(/\U0001F34E\
    {3}/.test(\"\U0001F34E\U0001F34E\U0001F34E\"));\n// → false\n\nconsole.log(/<.>/.test(\"\
    <\U0001F339>\"));\n// → false\n\nconsole.log(/<.>/u.test(\"<\U0001F339>\"));\n\
    // → true\n```\n\n这里识别出的问题是第一行的 `\U0001F34E` 被视为两个代码单元，而 `{3}` 部分仅用于第二个。点也只匹配单个代码单元。在你的正则表达式中添加\
    \ `u`（代表 Unicode）以便正确处理字符。遗憾的是，错误的行为仍然是默认值，因为这可能会产生问题。你可以使用 `\\p` 正则表达式来匹配 Unicode\
    \ 集合中的每一个字符。\n\n```javascript\nconsole.log(/\\p{Script=Greek}/u.test(\"α\"));\n\
    // → true\n\nconsole.log(/\\p{Script=Arabic}/u.test(\"α\"));\n// → false\n\nconsole.log(/\\\
    p{Alphabetic}/u.test(\"α\"));\n// → true\n\nconsole.log(/\\p{Alphabetic}/u.test(\"\
    !\"));\n// → false\n```\n\nUnicode 描述了许多属性，尽管寻找你需要的属性并不总是易的。\n\n### 总结\n\n我们在本章中关注了正则表达式。代表模式字符串的对象就是正则表达式。它们由其语言组成并利用它来展示这些模式。\n\
    \n* `/ABC/`: 字符序列\n* `/[abc]/`: 字符范围内的字符\n* `[^abc]/`: 范围之外的任何字符\n* `/[0-9]/`:\
    \ 字符集内的任何字符\n* `/x+/`: 一个或多个模式事件\n* `/x+?`: 一个或多个事件，非贪婪\n* `/x*`: 零或多个事件\n* `/x?`:\
    \ 零或一个事件\n* `/x{2,4}/`: 二到四个事件\n* `/(ABC)/`: 分组\n* `/a|b|c/`: 各种模式中的任意一个\n* `/\\\
    d/`: 任意数字字符\n* `/\\w/`: 任意单词字符\n* `/\\s/`: 任意空白字符\n* `.`: 除换行符外的任何字符\n* `/\\b/`:\
    \ 单词边界\n* `/\\^`: 输入开始\n* `$/`: 输入结束\n\n"
- fmt: "\nA regular expression consists of a method `test()` to check if a string\
    \ matches, an `exec()` method where it finds match sends back an array having\
    \ every matched group. This type of array contains an `index` property that specifies\
    \ where the match started. Strings use a matching method `match()` to match them\
    \ in a regular expression as well as a search method `find()` returning only the\
    \ beginning position of the match.\n\n### Exercise\nWrite a JavaScript program\
    \ working as a `trim(string)` function utilizing regular expression.\n\nSolution![00146.jpg](images/00146.jpeg)\n\
    \n![00156.jpg](images/00156.jpeg)\n\n## Chapter 11: Modules\n\nThis particular\
    \ program has a simple layout. It is easy to explain its concept, and every part\
    \ plays a precise role. The organizing and maintaining of the layout can be much\
    \ more work, but it eventually pays off the next time someone uses the program\
    \ in the future. Therefore, you can be intrigued to neglect and enable the program\
    \ parts to become intermixed, which will create two practical issues. First, when\
    \ everything touches everything else, it is hard to look at any set piece of separation.\
    \ You will have to create a comprehensive understanding of the full program. Second,\
    \ using any of the functionality from the program in different situations, you\
    \ can rewrite it instead of disengaging from the context.\n\n### Modules\nA module\
    \ is a type of program that determines which pieces it should depend on and what\
    \ functionality it should produce for other pieces to utilize. By putting a limit\
    \ on always modules communicate with one another, the system is identical to LEGO,\
    \ where pieces communicate using straightforward connectors, and not unlike the\
    \ entire pieces mix with everything. Dependencies are the relationships between\
    \ modules. When a module wants a piece from another module, it depends on that\
    \ module. The module itself illustrates this fact, and it is used to determine\
    \ which other modules should be available to use a stated module and to load dependencies\
    \ automatically. Every module needs its scope to separate itself from other modules.\n\
    \n### Packages\nOne significant benefit of building a program out of different\
    \ pieces, and being able to launch those pieces individually, is that you can\
    \ apply the same piece in separate programs. When the duplication of code begins,\
    \ the package comes into play. A package is a block of code that can be shared.\
    \ It may consist of one or more modules and holds information about the other\
    \ depending packages. Packages also contain documentation describing its functions\
    \ so that people who didn’t write it can utilize it. When a problem occurs in\
    \ a package, or you add a new feature, the package updates automatically. Now\
    \ programs depending on its upgrades to the latest version.\n\nWorking alike this,\
    \ you need an infrastructure. A place to save and search for packages and an easy\
    \ way to upgrade and install them. When it comes to JavaScript, `NPM` provides\
    \ support. Divide `NPM` into two things: an online service where you can upload\
    \ and download packages and a program that handles the installation and management.\
    \ Almost every code on `NPM` is licensed.\n\n### Improvised modules\nBefore the\
    \ year 2015, the JavaScript language did not contain any built-in module system,\
    \ but people have been creating large systems using JavaScript for over a decade\
    \ now, and they required modules. They developed their module systems and integrated\
    \ them into the language. You can utilize JavaScript functions to build local\
    \ scopes and objects to stand for module layouts. Use this module to map between\
    \ day names and numbers. Its layout contains `weekDay.name` and `weekDay.number`,\
    \ and it hides its local binding names inside the scope of a function.\n\nThe\
    \ expression is called upon immediately.\n\n```javascript\nconst weekDay = function()\
    \ {\n  const names = [\"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\",\n  \"\
    Thursday\", \"Friday\", \"Saturday\"];\n  return {\n    name(number) {return names[number];},\n\
    \    number(name) {return names.indexOf(name);}\n  };\n}();\n\nconsole.log(weekDay.name(weekDay.number(\"\
    Sunday\")));\n// → Sunday\n```\n\nThis style of modules does not proclaim dependencies.\
    \ They place the layout into the global scope. This style of modules provides\
    \ isolation to a certain degree, but it does not declare dependencies. Instead,\
    \ it just puts its interface into the global scope and awaits its dependencies,\
    \ if there is any, to do the same.\n\n### Evaluating data as code\nThere are different\
    \ types of ways to take data and launch it as apart part of the existing program.\
    \ The best away is to utilize the unique operator `eval`, which affects a string\
    \ in the existing scope.\n\n```javascript\nvar Ax = 1;\n\nfunction evalAndReturnX(code)\
    \ {\n  eval(code);\n  return Ax;\n}\n\nconsole.log(evalAndReturnX(\"var Ax= 2\"\
    ));\n// → 2\n\nconsole.log(x);\n// → 1\n```\n\nA less complicated way to explain\
    \ data as code is using the `Function` constructor. It takes two types of argument,\
    \ a string with a comma, divided list of argument names and a string with the\
    \ body function. It encloses the code in a function value to enable it to get\
    \ its own scope.\n\n```javascript\nlet plusOne = Function(\"n\", \"return n+1;\"\
    );\n\nconsole.log(plusOne(4));\n// → 5\n```\n\nYou can enclose the module's code\
    \ in a function and utilize that same function scope as a module scope.\n\n###\
    \ CommonJS\nThe common approach used to gobble on JavaScript modules is `CommonJS`\
    \ modules. `Node.js` uses this approach as well as a lot of packages on `NPM`.\
    \ The major idea in `CommonJS` modules is the function named `require`. If you\
    \ call this together with the dependency's module name, it loads the module and\
    \ sends back its interface. The loader covers the module code within a function,\
    \ and modules have their local scope automatically. You can call `require` to\
    \ see their dependencies and place their layout in the object that `exports` them.\
    \ This example module gives a date-formatting function. It utilizes two packages\
    \ from `NPM`, `ordinal` to transform numbers to strings like \"1st\" and \"2nd\"\
    , and `date-names` to obtain the English names for months and weekdays. It exports\
    \ a single function, `formatDate`, that takes a template string and a `Date` object.\
    \ The template string could contain codes that control the format, such as `YYYY`\
    \ (the full year) and `Do` (for the ordinal day of the month). You can set a string\
    \ like \"MMMM Do YYYY\" to get output like “December 2nd, 2013”.\n\n```javascript\n\
    const = require(\"ordinal\");\n\nconst {days, months} = require(\"date-names\"\
    );\n\nexports.formatDate = function(date, format) {\n  return format.replace(/YYYY|M(MMM)?|Do?|dddd/g,\
    \ tag => {\n    if (tag === \"YYYY\") return date.getFullYear();\n    if (tag\
    \ === \"M\") return date.getMonth();\n    if (tag === \"MMMM\") return months[date.getMonth()];\n\
    \    if (tag === \"D\") return date.getDate();\n    if (tag === \"Do\") return\
    \ ordinal(date.getDate());\n    if (tag === \"dddd\") return days[date.getDay()];\n\
    \  });\n};\n```\n"
