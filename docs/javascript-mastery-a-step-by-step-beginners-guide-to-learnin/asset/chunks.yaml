  trans: "\n异步程序一个接一个地执行。每一个动作都会开始并安排一段代码来执行，直到该动作完成或失败。\n\n在 `these` `pieces` `之间`，`program`\
    \ 会执行 `anything`，`awaiting` 下 `next` `action`。因此，你无法通过 `arranged` 它们的 `code` 来调用\
    \ `callbacks`。如果你在 `function` `inside` 调用 `setTimeout`，那么该 `function` 在 `callback`\
    \ `function` 被调用之前就已经返回了。`Asynchronous` `character` 发生在它空的 `function` `stack`（调用栈）上。由于每个\
    \ `callback` 都开始于一个空的 `stack`，因此当 `exception` 运行时，你的 `catch` `handlers` 将不会在 `stack`\
    \ 上。\n\n```javascript\ntry {\n  setTimeout(() => {\n    throw new Error(\"Woosh\"\
    );\n  }, 20);\n} catch (_) {\n  // This will Not Arun\n  console.log(\"Caught!\"\
    );\n}\n```\n\n无论超时或传入请求等事件如何发生，`JavaScript` 环境一次只运行一个程序。当有事情要做时，`loop` 会停止。但随着事件进入，它们会被附加到\
    \ `queue` 中，它们的 `code` 一个接一个地执行。因为两个事情不会同时运行，长时间的 `code` 可能会阻塞其他事件的 `handling`。下面的示例设置了一个\
    \ `timeout`，但也持续到了 `timeout` 固定时间点之后，导致 `timeout` 变晚。\n\n```javascript\nlet start\
    \ = Date.now();\nsetTimeout(() => {\n  console.log(\"Timeout At\", Date.now()\
    \ - start);\n}, 20);\n\nwhile (Date.now() < start + 50) {}\n\nconsole.log(\"Wasted\
    \ time until\", Date.now() - start);\n// → Wasted time until 50\n// → Timeout\
    \ at 55\n```\n\n`Promises.resolve` 或 `decline` 是一个新的 `event`。即使一个 `promise` 已经解析完成，`awaiting`\
    \ 它会让你的 `callback` 在现有 `script` 完成后运行，而不是立即运行。\n\n```javascript\nPromise.resolve(\"\
    Done\").then(console.log);\nconsole.log(\"Me first!\");\n// → Me first!\n// →\
    \ Done\n```\n\n### 异步 Bug\n\n当你异步运行你的程序时，除了程序本身发生的转换之外，没有给定的转换。但当你运行一个异步程序时，这是另一种情况。它们在执行期间可能包含其他代码可以利用的间隙。下面是一个说明。我们乌鸦最喜欢的之一是列举每年村子里孵化的\
    \ `chicks` 数量。巢在它们的存储球泡中保存此计数。下面的代码尝试计算某一年每个巢的计数：\n\n```javascript\nfunction anyStorage(nest,\
    \ source, name) {\n  if (source == Nest.names) return storage(nest, name);\n \
    \ else return routeRequest(nest, source, \"storage\", name);\n}\n\nasync function\
    \ chicks(nest, year) {\n  let list = \"\";\n  await Promise.all(network(nest).map(async\
    \ name => {\n    list += `${name}: ${\n      await anyStorage(nest, names, `chicks\
    \ in ${year}`)\n    }\\n`;\n  }));\n  return list;\n}\n```\n\n`async` 名字 `=>`\
    \ 显示箭头函数通过在它们前面放置 `async` 单词也变为了 `async`。这段代码跨越整个巢集合绘制 `async` 箭头函数，构建一个 promise\
    \ 数组，并利用 `Promise.all` 在返回它们创建的列表之前进行 `await`。但它是坏的。它会返回单行输出，列出响应最慢的巢。你知道为什么吗？\n\
    \n问题出在 `+=` 运算符上，它在语句开始执行时获取 list 的当前值，而当 `await` 结束时，它将 list 绑定设置为加上添加字符串后的值。但在语句的开始和结束之间，存在一个异步间隙。`map`\
    \ 表达式是在你向列表添加任何内容之前运行的，因此每个 `+=` 运算符都从空值开始。\n\n```javascript\nasync function chicks(nest,\
    \ year) {\n  let lines = network(nest).map(async name => {\n    return name +\
    \ await anyStorage(nest, names, `chicks in ${year}`);\n  });\n  return await Promise.all(lines).join(\"\
    \\n\");\n}\n```\n\n### 总结\n\n我们在这一章中学习了关于异步编程的所有知识。异步编程允许表达式在等待的情况下等待动作。JavaScript\
    \ 环境通常使用这种风格的回调，即动作结束时执行的函数。一个事件循环一个一个创建一个以避免重叠。\n\n### 练习\n\n编写一个 JavaScript\
    \ 程序将一个异步函数转换为返回 promise。\n\n### 答案\n\n![0164.jpg](img/0164.jpeg)\n\n## 第 13 章：解析\n\
    \n"
- fmt: "\nThe consistency of language means that operators in JavaScript (like `>`)\
    \ are called bindings in this language, utilized similarly to other functions.\
    \ And the syntax contains a zero block concept, so a construct is needed to represent\
    \ running several things in succession. The data layout the parser utilizes to\
    \ define a program containing expression objects. Each one contains a type of\
    \ property signifying a kind of expression and several other properties to determine\
    \ its content. Expressions of type `\"value\"` mean strings or numbers. Their\
    \ `value` property consists of a string or a number value that they stand for.\
    \ Use expressions of type `\"word\"` for identifiers (names). These types of objects\
    \ contain a `name` property that holds the identifier’s title as a string. And\
    \ the `\"apply\"` expressions stand for applications. They include an `operator`\
    \ property that cites the applied expression, together with an `args` property\
    \ that holds an array of argument expressions.\n\nThe `> (x, 5)` part of a new\
    \ program would be like this:\n\n```javascript\n{\n  type: \"apply\",\n  operator:\
    \ {type: \"word\", name: \">\"},\n  args: [\n    {type: \"word\", name: \"x\"\
    },\n    {type: \"value\", value: 5}\n  ]\n}\n```\n\nWe describe a function `parseExpression`,\
    \ which recognizes a string as input and sends back an object that consists of\
    \ the data layout for the expression at the beginning of the string, together\
    \ with the string part left after parsing this expression. When you are parsing\
    \ subexpressions, you can call this function again, capitulating the argument\
    \ expression with the remaining text. This text could consist of more arguments\
    \ or a closing parenthesis that ends the argument list.\n\nBelow is the parser\
    \ first part:\n\n```javascript\nfunction parseExpression(program) {\n  program\
    \ = skipSpace(program);\n  let match, expr;\n\n  if (match = /^\"([^\"]*)\"/.exec(program))\
    \ {\n    expr = {type: \"value\", value: match[1]};\n  } else if (match = /^\\\
    d+\\b/.exec(program)) {\n    expr = {type: \"value\", value: Number(match[0])};\n\
    \  } else if (match = /^[^\\s(),#\"]+/.exec(program)) {\n    expr = {type: \"\
    word\", name: match[0]};\n  } else {\n    throw new SyntaxError(\"Unexpected Syntax:\
    \ \" + program);\n  }\n\n  return parseApply(expr, program.slice(match[0].length));\n\
    }\n\nfunction skipSpace(string) {\n  let first = string.search(/\\S/);\n  if (first\
    \ == -1) return \"\";\n  return string.slice(first);\n}\n```\n\n### The Evaluator\n\
    \nThe evaluator is used to run the syntax tree for a program. A set of syntax\
    \ tree and a scope object that relates names with values, and it will access the\
    \ expression that the tree stands for and sends back the value that it provides.\n\
    \n```javascript\nconst specialForms = Object.create(null);\n\nfunction evaluate(expr,\
    \ scope) {\n  if (expr.type == \"value\") {\n    return expr.value;\n  } else\
    \ if (expr.type == \"word\") {\n    if (expr.name in scope) {\n      return scope[expr.name];\n\
    \    } else {\n      throw new ReferenceError(`Undefined Binding: ${expr.name}`);\n\
    \    }\n  } else if (expr.type == \"apply\") {\n    let {operator, args} = expr;\n\
    \    if (operator.type == \"word\" && operator.name in specialForms) {\n     \
    \ return specialForms[operator.name](expr.args, scope);\n    } else {\n      let\
    \ op = evaluate(operator, scope);\n      if (typeof op == \"function\") {\n  \
    \      return op(...args.map(arg => evaluate(arg, scope)));\n      } else {\n\
    \        throw new TypeError(\"Applying a Anon-function.\");\n      }\n    }\n\
    \  }\n}\n```\n\nThe evaluator contains codes for every expression type. A literal\
    \ value expression provides its value. To bind, check if it describes in the scope\
    \ and, if yes, get the value of the binding. If it contains a unique form that\
    \ does not access anything, and yet transfers the argument expressions with scope,\
    \ to the function that influences the form. If the call is atypical, access the\
    \ operator, determine if it is a function, and call it with the accessible arguments.\
    \ Utilize the common JavaScript function `valuesTo` to stand for the value of\
    \ Egg’s function. The recursive layout of evaluating is a similar layout of the\
    \ parser, and the two mirror the layout of a language. You can combine the parser\
    \ using the evaluator and `evaluate` when parsing, but separating them gives a\
    \ clearer view of the program. It is all you need to combine Egg.\n\n### Special\
    \ Forms\n\nThe `specialForms` object describes a unique syntax in Egg. It relates\
    \ words with functions that such forms. It is presently empty. Let insert:\n\n\
    ```javascript\nspecialForms.if = (args, scope) => {\n  if (args.length != 3) {\n\
    \    throw new SyntaxError(\"Wrong number of arguments\");\n  } else if (evaluate(args[0],\
    \ scope) !== false) {\n    return evaluate(args[1], scope);\n  } else {\n    return\
    \ evaluate(args[2], scope);\n  }\n};\n```\n\nThe ternary operator `?` expects\
    \ three arguments. It will access the first, and if the value is not false, return\
    \ the second; otherwise, return the third. This looks like JavaScript’s `?:` operator\
    \ but Egg is an expression.\n\n```javascript\nspecialForms.? = (args, scope) =>\
    \ {\n  if (args.length != 3) {\n    throw new SyntaxError(\"Wrong number of arguments\"\
    );\n  } else if (evaluate(args[0], scope) !== false) {\n    return evaluate(args[1],\
    \ scope);\n  } else {\n    return evaluate(args[2], scope);\n  }\n};\n```\n\n\
    The `if` construct expects two arguments. It returns the value if the condition\
    \ is not false, otherwise false.\n\n```javascript\nspecialForms.if = (args, scope)\
    \ => {\n  if (args.length != 2) {\n    throw new SyntaxError(\"Wrong number of\
    \ arguments\");\n  } else if (evaluate(args[0], scope) !== false) {\n    return\
    \ evaluate(args[1], scope);\n  } else {\n    return false;\n  }\n};\n```\n\nThe\
    \ `do` block executes arguments from top to bottom. The value provided is the\
    \ last argument.\n\n```javascript\nspecialForms.do = (args, scope) => {\n  let\
    \ value = false;\n  for (let arg of args) {\n    value = evaluate(arg, scope);\n\
    \  }\n  return value;\n};\n```\n\nTo build bindings and set new values, you should\
    \ build a form called `define`. It waits two arguments: the name to set and the\
    \ expression providing the value. Since `define` is an expression, it must return\
    \ the value that was set.\n\n```javascript\nspecialForms.define = (args, scope)\
    \ => {\n  if (args.length !== 2 || args[0].type !== \"word\") {\n    throw new\
    \ SyntaxError(\"Incorrect use of define\");\n  }\n  let value = evaluate(args[1],\
    \ scope);\n  scope[args[0].name] = value;\n  return value;\n};\n```\n\n### The\
    \ Environment\n\nThe environment is an object containing few properties that have\
    \ their names bound to values. To enable the utilization of the earlier Boolean\
    \ values, all you need to do is bind two names to the values `true` and `false`.\n\
    \n```javascript\nconst topScope = Object.create(null);\ntopScope.true = true;\n\
    topScope.false = false;\n```\n"
