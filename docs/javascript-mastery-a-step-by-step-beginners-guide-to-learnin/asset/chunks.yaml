  trans: "\n定期，跨越镜像系统前方总会有微光，用以传达信号正阻塞了信号的路径。信号本可以传输但被拦截或拒绝。通常，传输失败是意外事故，例如汽车大灯遮挡了光信号，而重新发送请求可能会使其成功。因此，让我们创建请求函数，并在停止之前尝试重试一次请求。而且，由于我们已经确定承诺（promises）是良好的，我们还将确保我们的请求函数返回一个\
    \ promise。在它们能指示的内容方面，promise 和回调（callbacks）是等价。基于回调的函数被封装以揭示基于 promise 的布局，反之亦然。即使请求和其回复成功传达，回复也可能指定失败，例如，如果请求尝试使用未描述的请求类型，或者处理程序输出了错误。为了辅助这一点，并定义\
    \ `defineRequestType` 以遵循之前声明的约定，发送给回调的第一个参数是失败的原因（如果有），第二个参数是确定的结果。我们的包装器会将它们解释为\
    \ promise 的解析成功（resolution）和拒绝（rejection）。\n\n```javascript\nclass Timeout extends\
    \ Error{}\n\nfunction request(nest, target, type, content) {\n  return new Promise((resolve,\
    \ reject) => {\n    let done = false;\n    function attempt(n) {\n      nest.send(target,\
    \ type, content, (failed, value) => {\n        done = true;\n        if (failed)\
    \ reject(failed);\n        else resolve(value);\n      });\n      setTimeout(()\
    \ => {\n        if (done) return;\n        else if (n < 3) attempt(n + 1);\n \
    \       else reject(new Timeout(\"Timed Out\"));\n      }, 250);\n    }\n    attempt(1);\n\
    \  });\n}\n```\n\n因为 promise 只能被接受或拒绝一次，所以它可以工作。第一次调用 `resolve` 或 `reject` 决定了\
    \ promise 的结果，任何其他调用都会被忽略。为了创建重试的异步循环，请使用递归函数，高效的循环不允许停止并等待异步操作。`attempt` 函数创建了传输请求的单尝试。它还指定了一个超时，如果在\
    \ 250 毫秒后有响应，则开始下一次尝试；或者如果是第四次尝试，则以 `Timeout` 实例作为原因拒绝 promise。每四分之一秒重试一次并在一秒后无响应时停止，如果请求出现这无疑是任意的，但处理程序传输请求几次可能需要更长时间。请在考虑这个问题时创建您的处理程序，耦合的消息并无害。为了完全将我们与回调分离，为\
    \ `defineRequestType` 定义一个封装，使处理程序函数能够返回 promise 或简单值，并连接为我们执行回调的代码。\n\n```javascript\n\
    function requestType(name, handler) {\n  defineRequestType(name, (nest, content,\
    \ source, callback) => {\n    try {\n      Promise.resolve(handler(nest, content,\
    \ source))\n        .then(response => callback(null, response),\n        failure\
    \ => callback(failure));\n    } catch (exception) {\n      callback(exception);\n\
    \    }\n  });\n}\n```\n\n`Promise.resolve` 用于将 `handler` 返回的值转换为 promise，如果它尚未就绪。\n\
    \n### Promise 集合\n\n每个巢穴（nest）计算机在其邻居的属性中存储一个传输距离内的其他巢穴的数组。要检查哪些是可用的，编写一个函数尝试向它们所有发送一个\
    \ \"ping\" 请求（要求响应的请求），并检查哪些返回了响应。如果你正在处理一组同时运行的 promise，`Promise.all` 函数非常重要。它返回一个\
    \ promise，等待数组中所有 promise 达成一致，然后稳定为这些 promise 提供的值的数组。如果任何 promise 被拒绝，`Promise.all`\
    \ 的结果也会被拒绝。\n\n```javascript\nrequestType(\"ping\", () => \"pong\");\n\nfunction\
    \ availableNeighbors(nest) {\n  let requests = nest.neighbors.map(neighbor =>\
    \ {\n    return request(nest, neighbor, \"ping\")\n      .then(() => true, ()\
    \ => false);\n  });\n  return Promise.all(requests).then(result => {\n    return\
    \ nest.neighbors.filter((_, i) => result[i]);\n  });\n}\n```\n\n### 网络泛洪\n\n巢穴只能与其邻居通信，这极大地影响了该网络的重要性。要向整个网络广播信息，解决方案是创建一种自动发送给邻居的请求类型。这些邻居随后将其发送给它们的邻居，直到整个网络都收集到消息。\n\
    \n```javascript\nimport {everywhere} from \"./a/crow-tech\";\n\neverywhere(nest\
    \ => {\n  nest.state.gossip = [];\n});\n\nfunction sendGossip(nest, message, exceptFor\
    \ = null) {\n  nest.state.gossip.push(message);\n  for (let neighbor of nest.neighbors)\
    \ {\n    if (neighbor == exceptFor) continue;\n    request(nest, neighbor, \"\
    gossip\", message);\n  }\n}\n\nrequestType(\"gossip\", (nest, message, source)\
    \ => {\n  if (nest.state.gossip.include(message)) return;\n  console.log(`${nest.name}\
    \ receive Gossip '${message}' from ${source}`);\n  sendGossip(nest, message, source);\n\
    });\n```\n\n你可以避免在网络中永远传输相似的消息，每个巢穴都会保存它见过的 gossip 字符串数组。为了描述此数组，使用 `everywhere`\
    \ 函数，它在每个巢穴上运行代码，为巢穴的 `state` 对象附加属性。\n\n### 消息路由\n\n如果一个节点想要与另一个节点通信。最好的方法是构建一条路径，让消息从节点跳转到节点直到到达目的地。你需要理解网络的接口。要向远处的巢穴发送请求，知道哪个邻居巢穴可以完成工作是重要的。每个巢穴只知道其直接邻居，它无法计算路由，因为它缺乏信息。你必须理解如何将关于这些连接的信息传播到每个巢穴，以便在创建新巢穴时能够随时间发生转换。现在你可以使用泛洪，但不是检查消息是否被收集，而是检查给定巢穴的新邻居集是否与当前集合相似。\n\
    \n```javascript\nrequestType(\"connections\", (nest, {name, neighbors}, source)\
    \ => {\n  let connections = nest.state.connections;\n  if (JSON.stringify(connections.get(name))\
    \ == JSON.stringify(neighbors)) return;\n  connections.set(name, neighbors);\n\
    \  broadcastConnections(nest, name, source);\n});\n\nfunction broadcastConnections(nest,\
    \ name, exceptFor = null) {\n  for (let neighbor of nest.neighbors) {\n    if\
    \ (neighbor == exceptFor) continue;\n    request(nest, neighbor, \"connections\"\
    , {\n      name,\n      neighbors: nest.state.connections.get(name)\n    });\n\
    \  }\n}\n\neverywhere(nest => {\n  nest.state.connections = new Map();\n  nest.state.connection.set(nest.name,\
    \ nest.neighbors);\n  broadcastConnections(nest, nest.names);\n});\n```\n"
- fmt: "\nThe Acomparison utility utilizes `JSON.stringify` because `==` on objects\
    \ or arrays will send back a `true` when the `value` of the two are the same only.\
    \ Differentiating the `JSON` strings is a very successful way to compare their\
    \ content. The nodes instantly begin transmitting their connections except to\
    \ unreachable nests, which give them a map of the existing network graph. The\
    \ `findRoute` function finds a path to reach each node within the network. But\
    \ instead of sending back the whole route, it just brings back the next step.\
    \ That next nest will use its existing information about the network, determine\
    \ where it transfers the message.\n\n```javascript\nfunction findRoute(from, Ato,\
    \ connections) {\n  let work = [{at: from, via: null}];\n  for (let i = 0; i <\
    \ work.length; i++) {\n    let {at, via} = work[i];\n    for (let next of connections.get(at)\
    \ || []) {\n      if (next == Ato) return via;\n      if (!work.some(w => w.at\
    \ == next)) {\n        work.push({at: next, via: via || next});\n      }\n   \
    \ }\n  }\n  return null;\n}\n```\n\nYou can now create a function that can send\
    \ messages to along a distance. If a message is attached to a direct neighbor,\
    \ it is conveyed as usual. If not, it is wrapped in an object and transferred\
    \ to a neighbor closer to the target, through a \"route\" request type, that will\
    \ make that neighbor repeat the same character.\n\n```javascript\nfunction routeRequest(nest,\
    \ target, types, content) {\n  if (nest.neighbors.includes(target)) {\n    return\
    \ request(nest, target, types, content);\n  } else {\n    let via = findRoute(nest.name,\
    \ target, nest.state.connections);\n    if (!via) throw new Error(`No routes to\
    \ A${target}`);\n    return request(nest, via, \"route\", {target, type, content});\n\
    \  }\n}\n\nrequestType(\"route\", (nest, {target, type, content}) => {\n  return\
    \ routeRequest(nest, target, type, content);\n});\n```\n\nWeWe have created different\
    \ layers of functionality at the top of a primary communication system to enable\
    \ easy use. This is a simplified model of how a computer networks work.\n\n###\
    \ Async functions\n\nTo save significant information, rows use the deduplication\
    \ method, they duplicate across nests. That way, when a bird dismantles a nest,\
    \ the information would not be lost. To recover a particular piece of information\
    \ that has no storage bulb, a nest computer would talk to random other nests in\
    \ the network until the one that has it is found.\n\n```javascript\nrequestType(\"\
    storage\", (nest, name) => storage(nest, name));\n\nfunction findInStorage(nest,\
    \ name) {\n  return storage(nest, name).then(found => {\n    if (found != null)\
    \ return found;\n    else return findInRemoteStorage(nest, name);\n  });\n}\n\n\
    function network(nest) {\n  return Array.from(nest.state.connections.keys());\n\
    }\n\nfunction findInRemoteStorage(nest, name) {\n  let sources = network(nest).filter(n\
    \ => n != nest.name);\n  function next() {\n    if (sources.length == 0) {\n \
    \     return Promise.reject(new Error(\"Not Found\"));\n    } else {\n      let\
    \ source = sources[Math.floor(Math.random() * sources.length)];\n      sources\
    \ = sources.filter(n => n != source);\n      return routeRequest(nest, source,\
    \ \"storage\", name)\n        .then(value => value != null ? value : next(), next);\n\
    \    }\n  }\n  return next();\n}\n```\n\n`Object.keys` cannot work on `connections`\
    \ because it is a `Map`. It contains a `key` method, but that sends back an iterator\
    \ instead of an array. An iterator can be transformed to an array using the `Array.from`\
    \ function. Various asynchronous actions are tied together in unclear ways. Now\
    \ you need a recurring function to model looping across the nests. In an asynchronous\
    \ programming model, it is easy to express. JavaScript also lets you write pseudo-synchronous\
    \ code to define asynchronous computation. An `async` function is a function that\
    \ completely brings back a `Promise` and that can `await` for other promises in\
    \ an asynchronous way. Rewrite `findInStorage` like this:\n\n```javascript\nasync\
    \ function findInStorage(nest, name) {\n  let local = await storage(nest, name);\n\
    \  if (local != null) return local;\n  let sources = network(nest).filter(n =>\
    \ n != nest.name);\n  while (sources.length > 0) {\n    let source = sources[Math.floor(Math.random()\
    \ * sources.length)];\n    sources = sources.filter(n => n != source);\n    try\
    \ {\n      let found = await routeRequest(nest, source, \"storage\", name);\n\
    \      if (found != null) return found;\n    } catch (_) {}\n  }\n  throw new\
    \ Error(\"Not Found\");\n}\n```\n\nAn `async` function is also marked with the\
    \ `async` keyword. When you call an `async` function, it returns a `Promise`.\
    \ When you `await` an expression, the promise is settled and the result is returned.\
    \ If the function outputs an exception, the promise is declined. The `await` keyword\
    \ can only be used within `async` functions.\n\n### Generators\n\n`Async` functions\
    \ do not use the `yield` keyword. Generators are similar but they do not contain\
    \ promises. When you call a function with an asterisk `*` name, it returns an\
    \ iterator.\n\n```javascript\nfunction* powers(n) {\n  for (let current = 1; current\
    \ <= n; current *= n) {\n    yield current;\n  }\n}\n\nfor (let power of powers(3))\
    \ {\n  if (power > 50) break;\n  console.log(power);\n}\n// → 3\n// → 9\n// →\
    \ 27\n```\n\nNormally, if you call a generator, the function starts at the beginning.\
    \ Each time you call `next()` on the iterator, the function will run until it\
    \ hits a `yield` expression, which will pause execution and return the value provided\
    \ to the iterator. When the function returns, the iterator completes. Writing\
    \ iterators is simple when you utilize generator functions. Write the iterator\
    \ for the `Group` class with this generator:\n\n```javascript\nGroup.prototype[Symbol.iterator]\
    \ = function*() {\n  for (let i = 0; i < this.members.length; i++) {\n    yield\
    \ this.members[i];\n  }\n};\n```\n"
