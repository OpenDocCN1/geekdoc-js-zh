    Programming concepts and tools advances in a disorganized way, but success indicates
    an excellent piece of technology. In this chapter, we will discuss regular expressions.
    They are used to define patterns within a string data. They create a small, different
    language that consists of JavaScript as well as other languages.


    ## Creating a regular expression


    A regular expression is constructed with the `RegExp` constructor or written as
    a literal value by surrounding a pattern in forward-slash `/` characters.


    ```javascript

    let re1 = new RegExp("ABC");

    let re2 = /ABC/;

    ```


    These two regular expression objects stand for the same pattern. When utilizing
    the `RegExp` constructor, write the pattern as a normal string so that the rules
    apply for backslashes.


    The second annotation influence backslashes differently, first put a backslash
    before any forward slash because the pattern displays between slash characters.


    ## Testing for matches


    Regular expression objects contain several methods, one of which is the `test`.
    When you pass a string, it returns a Boolean determining if string contains a
    match of the pattern in the expression.


    ```javascript

    console.log(/abc/.test("abcde"));

    // →true


    console.log(/abc/.test("abxde"));

    // →false

    ```


    A regular expression contains only non-special characters that are present in
    a succession of characters. If `ABC` appears anywhere in the string, we are running
    a test, the test will return true.


    ### Sets of characters


    Regular expressions enable us to indicate difficult patterns. If you want to equal
    any number in a regular expression, place a set of characters between square brackets.
    The following expressions equal every string within a digit:


    ```javascript

    console.log(/[0123456789]/.test("in A1992"));

    // →true


    console.log(/[0-9]/.test("in A1992"));

    // →true

    ```


    A hyphen `-` between two characters inside square brackets is used to specify
    a scope of characters that the character’s Unicode Numbers decide the command.
    Characters from `0` to `9` stay next to each other this command (codes `48` to
    `57`), so `[0-9]` wrapping them all and equals any digit. Common character groups
    contain individual shortcuts built-in.


    Digits are apart of them:

    - `\d` means the exact thing as `[0-9]`

    - `\w` an alphanumeric character (`“word character”`)

    - `\s` any whitespace character (space, tab, newline, and similar)

    - `\D` a character which is Not a digit

    - `\W` a nonalphanumeric character

    - `\S` a nonwhitespace character

    - `.` any character without a newline


    So, a match a date and time format alike `01-30-2003 15:20` with the expression
    below:


    ```javascript

    let dateTime = /\d\d-\d\d-\d\d\d \d\d:\d\d/;

    console.log(dateTime.test("01-30-2003 15:20"));

    // →true


    console.log(dateTime.test("30-jan-2003 15:20"));

    // →false

    ```


    These backslash codes are also utilized within the square brackets. For instance,
    `[\d.]` indicates any digit or periodic character but the period has no meaning
    as well as other unique characters, like `+`.


    ```javascript

    let notBinary = /[^01]/;

    console.log(notBinary.test("1100100010100110"));

    // →false


    console.log(notBinary.test("1100100010200110"));

    // →true

    ```


    ## Repeating parts of a pattern


    Now you have a perfect understanding of how to equal single digits. If you want
    to match a whole number or a succession of more digits, place a plus sign `(+)`
    immediately after a input in a regular expression. This signifies that the element
    could repeat more than once, `\d+` equals one or more-digit characters.


    ```javascript

    console.log(/''\d+''/.test("''123''"));

    // →true


    console.log(/''\d+''/.test("''''"));

    // →false


    console.log(/''\d*''/.test("''123''"));

    // →true


    console.log(/''\d*''/.test("''''"));

    // →true

    ```


    The star `*` enables the pattern to equal zero. In the below example, the `u`
    character is permitted to arise, but the pattern is also equal when it is Not
    found.


    ```javascript

    let neighbor = /neighbour/;

    console.log(neighbor.test("neighbour"));

    // →true


    console.log(neighbor.test("neighbor"));

    // →true

    ```


    To determine if a pattern should execute a certain number of times, utilize the
    braces, inserting `{4}` after a element. If you want it to execute precisely four
    times, define a range like this: `{2,4}` signifies that the element must execute
    twice and at most four times. Below is another pattern of the date and time pattern,
    which enables both single and double-digit days, months and hours.


    ```javascript

    let dateTime = /\d{01,2}-\d{1,2}-\d{4} \d{1,2}:\d{2}/;

    console.log(dateTime.test("01-30-2003 8:45"));

    // →true

    ```


    ## Grouping subexpressions


    If you want to Utilize an operator like `*` or `+` on one or more element concurrently,
    use the parentheses. Some parts of a regular expression, which is cited in parentheses,
    counts as an individual element as along as the operators are concerned.


    ```javascript

    let cartoonCrying = /boo+(hoo+)+/i;

    console.log(cartoonCrying.test("Boohoooohoohooo"));

    // →true

    ```


    The first and second `+` characters only apply to the second in `boo` and `hoo`.
    The third `+` indicates to the entire group `(hoo+)`, equaling one or more successes
    like that. The `i` ending the first expression in the example is used for case
    insensitive, enabling it to equal the uppercase `B` in the input string, although
    the pattern is entirely lowercase.


    ## Matches and groups


    The `test` method is the best Away to equal a regular expression, it determines
    if it matches only. Regular expressions contain a `exec(execute)` method, which
    will output `null` if it could find a match and sends back object containing data
    about the match.


    ```javascript

    let match = /\d+/.exec("one two 100");

    console.log(match);

    // →["100"]


    console.log(match.index);

    // →8

    ```


    A sent object from `exec` contains `index` property, which determines what part
    of the string match starts. Below is the succession of digits needed: String values
    contain `match` method that behaves similarly.


    ```javascript

    console.log("one two 100".match(/\d+/));

    // →["100"]

    ```


    When a regular expression holds subexpressions collected with parentheses, the
    matching text will display in array. The whole match is first, the next is matched
    part by group, and following group, etc.


    ```javascript

    let quotedText = /([^'']*)''/;

    console.log(quotedText.exec("she said ''hello''"));

    // →["''hello''",hello"]

    ```


    When a group was not matched (if it contains a question), it outputs undefined.
    When you match a group several times, only the last match finishes in array.


    ```javascript

    console.log(/bad(ly)?/.exec("bad"));

    // →["bad", undefined]


    console.log(/(\d)+/.exec("123"));

    // →["123", "3"]

    ```


    ## The Date classes


    JavaScript consists of a standard class that represents dates; it is called `Date`.
    If you want to build a date object utilizing `new`, first get the current time
    and date.


    ```javascript

    console.log(new Date());

    // → Mon Nov 11 2018 16:19:11 GMT+0100 (CET)

    ```


    You can as well build a object for a particular time.


    ```javascript

    console.log(new Date(2008, 11, 8));

    // → Wed Dec 08 2008 00:00:00 GMT+0100 (CET)


    console.log(new Date(2008, 11, 9, 12, 59, 59, 999));

    // → Wed Dec 08 2009 12:59:59 GMT+0100 (CET)

    ```'
