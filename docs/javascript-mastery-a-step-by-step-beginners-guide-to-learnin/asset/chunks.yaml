  trans: "\n移动是一个动作中心。它检查 `path` 是否能从一个地方通向另一个地方，如果不能，则返回旧状态，因为该移动无效的。然后它会构建一个新状态，将目的地作为机器人的新位置，并构建一组新的包裹。对\
    \ `map` 的调用处理移动，对 `filter` 的调用处理递送。\n\n```javascript\nlet first = new VillageState(\n\
    \  \"Post Office\",\n  [{place: \"Post Office\", address: \"Alice's House\"}]\n\
    );\n\nlet next = first.move(\"Alice's House\");\n\nconsole.log(next.place);\n\n\
    // → Alice's House\n\nconsole.log(next.parcels);\n\n// → []\n\nconsole.log(first.place);\n\
    \n// → Post Office\n```\n\n### 持久化数据\n\n不可更改的数据布局被称为 `immutable`（不可变）或 `persistent`（持久）。它们的行为类似于字符串和数字。在\
    \ `JavaScript` 中，你可以改变几乎一切。有一个名为 `Object.freeze` 的函数，它可以转换对象，使其忽略对其属性的写入。\n\n\
    ```javascript\nlet object = Object.freeze({value: 5});\n\nobject.value = 10;\n\
    \nconsole.log(object.value);\n\n// → 5\n```\n\n### 模拟\n\n送货机器人会仔细观察世界，并决定它移动的方向。因此，机器人是一个函数，它接收一个\
    \ `VillageState` 对象并返回附近的名称。机器人返回一个对象，由它的意图方向和下次调用它时返回的内存值组成。\n\n```javascript\n\
    function runRobot(state, robot, memory) {\n  for (let turn = 0;; turn; turn++)\
    \ {\n    if (state.parcels.length == 0) {\n      console.log(`Done in ${turn}\
    \ turns`);\n      break;\n    }\n\n    let action = robot(state, memory);\n  \
    \  state = state.move(action.direction);\n    memory = action.memory;\n    console.log(`Moved\
    \ to ${action.direction}`);\n  }\n}\n```\n\n机器人每一回合以不同的方向行走。它可以遇到所有的包裹，然后到达递送点。下面是一个示例：\n\
    \n```javascript\nfunction randomPick(array) {\n  let choice = Math.floor(Math.random()\
    \ * array.length);\n  return array[choice];\n}\n\nfunction randomRobot(state)\
    \ {\n  return {direction: randomPick(roadGraph[state.place])};\n}\n```\n\n如果你想测试这个独特的机器人，请创建一个带有几个包裹的状态。\n\
    \n```javascript\nVillageState.random = function(parcelCount = 5) {\n  let parcels\
    \ = [];\n  for (let i = 0; i < parcelCount; i++) {\n    let address = randomPick(Object.keys(roadGraph));\n\
    \    let place;\n    do {\n      place = randomPick(Object.keys(roadGraph));\n\
    \    } while (place == address);\n    parcels.push({place, address});\n  }\n \
    \ return new VillageState(\"Post Office\", parcels);\n};\n```\n\n`do` 循环在获得正确地址时会继续选择新地点。让我们开始一个虚拟世界。\n\
    \n```javascript\nrunRobot(VillageState.random(), randomRobot);\n\n// → Advances\
    \ to Marketplace\n// → Advances to Town Hall\n// →…\n// → Run in 63 turns\n```\n\
    \n机器人运输包裹花费了太多回合，因为没有预先计划。\n\n### 邮车的路线\n\n如果你搜索一条通过村庄内所有地方的路线，机器人可能会运行两次，但不能保证它只运行一次。下面是一个示例：\n\
    \n（从邮局开始）：\n\n```javascript\nconst mailRoute = [\n  \"Alice's House,\" \"Cabin\"\
    , \"Alice's House\", \"Bob's House\",\n  \"Town Hall\", \"Daria's House\", \"\
    Ernie's House\",\n  \"Grete's House\", \"Shop\", \"Grete's House\", \"Farm\",\n\
    \  \"Marketplace\", \"Post Office\"\n];\n```\n\n使用这条路线，你需要利用机器人内存。机器人路线其余部分存储在它的内存中，并在每一回合发送第一个元素。\n\
    \n```javascript\nfunction routeRobot(state, memory) {\n  if (memory.length ==\
    \ 0) {\n    memory = mailRoutes;\n  }\n  return {direction: memory[0], memory:\
    \ memory.slice(0,1)};\n}\n```\n\n机器人现在变快了。它最多需要 26 个回合（13 步路线的两倍），但通常更少。\n\n###\
    \ 路径查找\n\n一种有趣的方法是从起点开始开发路线，并检查每个未访问过的地点，直到达到目标。下面的插图解释了这一点：\n\n```javascript\n\
    function findRoute(graph, from, to) {\n  let work = [{at: from, route: []}];\n\
    \  for (let i = 0; i < work.length; i++) {\n    let {at, route} = work[i];\n \
    \   for (let location of graph[at]) {\n      if (location == to) return route.concat(location);\n\
    \      if (!work.some(w => w.at == location)) {\n        work.push({at: location,\
    \ route: route.concat(location)});\n      }\n    }\n  }\n}\n```\n\n该函数保存了一个 `work`\
    \ 列表。这是一个将要检查的地点数组，连同路线。它从空路线和起始位置开始。每个地点都可以从每个地点到达，因此在两点之间也可以找到路线，因此路线不会失败。\n\
    \n```javascript\nfunction goalOrientedRobot({location, parcel}, routes) {\n  if\
    \ (route.length == 0) {\n    let parcel = parcel[0];\n    if (parcel.location\
    \ != location) {\n      route = findRoute(location, parcel.location);\n    } else\
    \ {\n      route = findRoute(roadGraph, location);\n    }\n  }\n  return {direction:\
    \ routes[0], memory: route};\n}\n```\n\n### 总结\n\n在本章中，我们接触了使用 JavaScript 的机器人。我们构建了一个带有包裹和道路的村庄，然后讨论了数据结构类似于字符串的不可变数据。模拟允许向机器人传递内存并让它们返回新内容。\n\
    \n### 练习\n\n编写一个简单的 JavaScript 程序，将下面数组中的每个元素连接成一个字符串。\n\n`\"Red, Green, White,\
    \ Black\"`\n`\"Red, Green, White, Black\"`\n`\"Red+Green+White+Black\"`\n\n###\
    \ 答案\n\n![00127.jpg](img/00127.jpg)\n\n## 第 9 章：缺陷与错误\n\n计算机程序的缺陷被称为 bug，计算机程序犯的错误。\n\
    \n### 严格模式\n\n你可以在严格模式下使用 JavaScript。这可以通过在文件顶部添加字符串 `\"use strict\"` 来。下面是一个示例：\n\
    \n```javascript\nfunction canYouSpotTheProblem() {\n  \"use strict\";\n  for (counter\
    \ = 0; counter < 10; counter++) {\n    console.log(\"Happy\");\n  }\n}\n\ncanYouSpotTheProblem();\n\
    \n// → ReferenceError: counter is not defined\n```\n\n当你想要调用一个构造函数而省略 `new` 关键字时，使用下面的代码，以防止它引入新创建的对象：\n\
    \n```javascript\nfunction person(name) {this.name = name;}\n\nlet Ferdinand =\
    \ person(\"Ferdinand\"); // 哎呀\n\nconsole.log(name);\n\n// → Ferdinand\n```\n\n\
    对 `person` 的伪调用成功了，但它返回了 `undefined` 值并构建了全局绑定 `name`。在严格模式下：\n\n```javascript\n\
    \"use strict\";\nfunction person(name) {this.name = name;}\n\nlet Ferdinand =\
    \ person(\"Ferdinand\"); // 忘记写 new\n\n// → TypeError: Cannot set property 'name'\
    \ of undefined\n```\n"
- fmt: "\nYou can use this function to search for mistakes in a program. It is achieved\
    \ by running it over and over again. The computer is excellent at repetitive tasks.\
    \ This process is called Automated testing. It entails writing a program that\
    \ tests another program. These tests regularly go through a small set of labeled\
    \ programs that determine some part of your code. For instance, let us create\
    \ a set of tests for the `toUpperCase` method. Below is an illustration:\n\n```javascript\n\
    function test(label, body) {\n  if (!body()) console.log(`Failed: ${label}`);\n\
    }\n\ntest(\"convert Latin text to uppercase\", () => {\n  return \"hello\".toUpperCase()\
    \ == \"HELLO\";\n});\n\ntest(\"convert Greek text to uppercase\", () => {\n  return\
    \ \"Χαίρετε\".toUpperCase() == \"ΧΑΊΡΕΤΕ\";\n});\n\ntest(\"don't convert case-less\
    \ characters\", () => {\n  return \"ࢎ࠶߈ఆ௷\".toUpperCase() == \"ࢎ࠶߈ఆ௷\";\n  131\n\
    });\n```\n\n### Debugging\n\nWhen a program displays an error, the next thing\
    \ is to determine the problem and get it fixed. The error message will point directly\
    \ at a particular line in your block of code. Take a look at the error description,\
    \ and you will find the problematic line. This example program tries to transform\
    \ a whole number into a string within set base (decimal, binary, and so on) by\
    \ continuously selecting out the last digit and dividing the number by radix of\
    \ the digit.\n\n```javascript\nfunction numberToString(n, base = 10) {\n  let\
    \ result = \"\", sign = \"\";\n  if (n < 0) {\n    sign = \"-\";\n    n = -n;\n\
    \  }\n  do {\n    result = String(n % base) + result;\n    n /= base;\n  } while\
    \ (n > 0);\n  return sign + result;\n}\n\nconsole.log(numberToString(13, 10));\n\
    // → 1.5e-3231.3e-3221.3e-3211.3e-3201.3e-3191.3e…-3181.3\n```\n\nAdding some\
    \ `console.log` calls into the program is an excellent path to take if you want\
    \ to acquire additional information about the execution. We want to get the values\
    \ `13`, `1`, and `0`. We should state the value at the beginning of the loop:\n\
    \n13\n1.3\n0.13\n0.013…\n1.5e-323\n\nDividing `13` by will not provide a whole\
    \ number. Instead of an `n /= base`, what we want is `n = Math.floor(n / base)`\
    \ so that the number can be “shifted” to the right.\n\nAnother great way to specify\
    \ a breakpoint is to insert a `debugger` statement (keyword) into your program.\
    \ If the developer tools will pick it up and pause the program anytime it gets\
    \ to that statement if your browser is active.\n\n### Exceptions\n\nWhen a function\
    \ cannot go further, the exception handling is the place that understands how\
    \ to fix that problem. Exceptions are a tool that enables a block of code that\
    \ runs into difficulties to throw an exception, and an exception could be any\
    \ value. You can intentionally create problems within your line of code to catch\
    \ the exception during its zooming down the process so that you can use it to\
    \ solve the problem and continue your work.\n\nHere’s an example:\n\n```javascript\n\
    function promptDirection(question) {\n  let result = prompt(question);\n  if (result.toLowerCase()\
    \ == \"left\") return \"L\";\n  if (result.toLowerCase() == \"right\") return\
    \ \"R\";\n  throw new Error(\"Invalid direction: \" + result);\n}\n\nfunction\
    \ look() {\n  if (promptDirection(\"Which way?\") == \"L\") {\n    return \"a\
    \ house\";\n  } else {\n    return \"two angry bears\";\n    135\n  }\n}\n\ntry\
    \ {\n  console.log(\"You see\", look());\n} catch (error) {\n  console.log(\"\
    Something went wrong: \" + error);\n}\n```\n\nRaise an exception by using the\
    \ `throw` keyword.\n\n### Cleaning up after exceptions\n\nAn exception’s effect\
    \ is a different type of control flow. This indicates that your code can have\
    \ different side effects, but an exception could stop them from happening. Below\
    \ is some bad code:\n\n```javascript\nconst accounts = {\n  a: 100,\n  b: 0,\n\
    \  c: 20\n};\n\nfunction getAccount() {\n  let accountName = prompt(\"Enter an\
    \ account name\");\n  if (!accounts.hasOwnProperty(accountName)) {\n    throw\
    \ new Error(`No such account: ${accountName}`);\n  }\n  return accountName;\n\
    }\n\nfunction transfer(from, amount) {\n  if (accounts[from] < amount) return;\n\
    \  accounts[from] -= amount;\n  accounts[getAccount()] += amount;\n}\n```\n\n\
    The `transfer` function is used to transfer money between accounts. If you input\
    \ a wrong name, the program outputs an exception. You can catch this by using\
    \ a `try` block.\n\n### Selective catching\n\nWhen you want to catch a specific\
    \ type of error, the `catch` block does not work as you expect if you want to\
    \ catch a specific error. Here is an example:\n\n```javascript\nfor (;;) {\n \
    \ try {\n    let adir = promptDirection(\"Where?\");\n    console.log(\"You chose\"\
    , adir);\n    break;\n  } catch (error) {\n    console.log(\"Invalid direction.\
    \ Try again.\");\n  }\n}\n```\n\nThe `for(;;)` loop is used to build a loop that\
    \ is not terminated on its own. If you want to catch a specific type of error,\
    \ you can use a custom error class. Let's define a new kind of error and use `instanceof`:\n\
    \n```javascript\nclass InputError extends Error {}\n\nfunction promptDirection(question)\
    \ {\n  let result = prompt(question);\n  if (result.toLowerCase() == \"left\"\
    ) return \"L\";\n  if (result.toLowerCase() == \"right\") return \"R\";\n  throw\
    \ new InputError(\"Invalid direction: \" + result);\n}\n```\n\nNow the loop can\
    \ catch these specifically:\n\n```javascript\nfor (;;) {\n  try {\n    let adir\
    \ = promptDirection(\"Where?\");\n    console.log(\"You chose\", adir);\n    break;\n\
    \  } catch (e) {\n    if (e instanceof InputError) {\n      console.log(\"Invalid\
    \ direction. Try again.\");\n  } else {\n      throw e;\n    }\n  }\n}\n```\n"
