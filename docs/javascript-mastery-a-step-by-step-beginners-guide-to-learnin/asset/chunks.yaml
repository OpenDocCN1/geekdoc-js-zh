    \ Here is a sample of a journal entry represented as JSON data:\n\n```json\n{\n\
    \  \"squirrel\": false,\n  \"events\": [\"work\", \"touched tree\", \"pizza\"\
    , \"running\"]\n}\n```\n\nJavaScript consists of `JSON.stringify` and `JSON.parse`\
    \ to transform data to and from this format. `JSON.stringify` takes a JavaScript\
    \ value and sends back a JSON-encoded string while `JSON.parse` takes a string\
    \ and transforms it to its encoded value.\n\n```javascript\nlet string = JSON.stringify({squirrel:\
    \ false,\n  events: [\"weekend\"]});\n\nconsole.log(string);\n// → {\"squirrel\"\
    :false,\"events\":[\"weekend\"]}\n\nconsole.log(JSON.parse(string).events);\n\
    // → [\"weekend\"]\n```\n\n### Reversing an array\n\nArrays consist of the `reverse`\
    \ method, which is used to change an array by reversing the order that its elements\
    \ display.\n\n### Summary\n\nWe covered the objects and arrays in this chapter,\
    \ and they always create ways to categorize various values in a single value.\
    \ Fantifully, this enables you to insert several associated items in a bag and\
    \ move about with the bag, rather than enclosing your arms around every singular\
    \ thing and trying to keep them differently. A lot of values in JavaScript contain\
    \ properties, the inconsistency being `undefined` and `null`. You can access properties\
    \ using the `value.prop` or `value[\"prop\"]`. You can use names for objects properties\
    \ and save a defined set of them. Arrays, as well contain different amounts of\
    \ similar fanciful values and utilize the numbers (beginning from 0) as the property’s\
    \ names. Arrays contain a few sets of properties, which are the `length` and several\
    \ methods. Methods are functions that reside within properties and have a value\
    \ they are its property. You can loop across arrays through a unique type of loop—for\
    \ (the element of array).\n\n### Exercise\n\nWrite a JavaScript function to obtain\
    \ the first item in an array. Setting a parameter `n` will send back the first\
    \ `n` elements of the array.\n\nData:\n```javascript\nconsole.log(arrayClone([1,\
    \ 2, 4, 0]));\nconsole.log(arrayClone([1, 2, 4, 0]));\n```\n[1, 2, 4, 0]\n[1,\
    \ 2, 4, 0]\n\nSolutions\n![0035.jpg](images/0035.jpg) ![0184.jpg](images/0184.jpg)\n\
    \n## Chapter 6: Higher-Order Functions\n\nA large program takes time to develop\
    \ and produces a lot of space for bugs, which makes them hard to find. Here are\
    \ examples of two large programs: The first is self-contained and the statement\
    \ is six lines.\n\n```javascript\nlet total = 0, count = 1;\nwhile (count <= 10)\
    \ {\n  total += count;\n  count += 1;\n}\nconsole.log(total);\n```\n\nThe second\
    \ appends external functions, and the statement is one line.\n\n```javascript\n\
    console.log(sum(range(1, 10)));\n```\n\nAbstraction\n\nWhen it comes to JavaScript\
    \ language, vocabulary uses the term abstraction. Abstraction is used to detail\
    \ and give the user the ability to talk about problems on a higher level. Let\
    \ us differentiate two recipes for a soup.\n\nFirst: Per person holds half of\
    \ an onion, using a knife, and puts it into the soup, let for 4 soups.\n\nThen\
    \ the second recipe: Per person: Half an onion, talks of a carrot, splits it,\
    \ and dips it into the soup for 4 soups, attaches and slices vegetables.\n\nThe\
    \ computer performs tasks one by one, from blind to high-level concepts.\n\n###\
    \ Abstracting Repetition\n\nPlain functions are used to create abstractions. It\
    \ is habitual for a program to repeat a particular function a specified amount\
    \ of time. You can achieve that with a loop like this:\n\n```javascript\nfor (let\
    \ i = 0; i < 10; i++) {\n  console.log(i);\n}\n```\n\nHere we write a function\
    \ that calls `console.log` times.\n\n```javascript\nfunction repeatLog(n) {\n\
    \  for (let i = 0; i < n; i++) {\n    console.log(i);\n  }\n}\n```\n\nIf you want\
    \ to perform a task different from logging numbers, you can roll `action` as a\
    \ function value.\n\n```javascript\nfunction repeat(n, action) {\n  for (let i\
    \ = 0; i < n; i++) {\n    action(i);\n  }\n}\nrepeat(3, console.log);\n// → 0\n\
    // → 1\n// → 2\n```\n\nSometimes you do not need to roll a pre-defined function\
    \ to repeat in a loop, create a function value as an alternative:\n\n```javascript\n\
    let labels = [];\nrepeat(5, i => {\n  labels.push(`Unit ${i + 1}`);\n});\nconsole.log(labels);\n\
    // → [\"Unit 1\", \"Unit 2\", \"Unit 3\", \"Unit 4\", \"Unit 5\"]\n```\n\nThis\
    \ method layout looks similar to a loop; it defines the type of loop and then\
    \ produces a body. Although the body is written in a function enclosed in parentheses\
    \ of the call to `repeat`.\n\n### Higher-order functions\n\nHigher-order functions\
    \ are functions that work on other functions whether by arguments or by sending\
    \ them back. This type of function enables the user to abstract over actions.\
    \ For instance, you have a function that can produce functions\n\n```javascript\n\
    function greaterThan(n) {\n  return i => i > n;\n}\n\nlet greaterThan10 = greaterThan(10);\n\
    console.log(greaterThan10(11));\n// → true\n```\n\nYou can also have functions\
    \ that can transform other functions.\n"
