  trans: "\n\n`Boolean.values()`，它们分别是“与”（and）、“或”（or）和“与非”（and not）。`&&` 运算符表示逻辑“与”，其结果取决于输入的值是\
    \ `true` 还是 `false`。\n\n```javascript\nconsole.log(true && false)\n// → false\n\
    ```\n\n```javascript\nconsole.log(true && true)\n// → true\n```\n\n`||` 运算符表示逻辑“或”。如果给定的值为\
    \ `true`，则该运算符输出 `true`。\n\n```javascript\nconsole.log(false || true)\n// → true\n\
    ```\n\n```javascript\nconsole.log(false || false)\n// → false\n```\n\n感叹号 `!`\
    \ 表示“非”（Not）。它是一个反转设定值的运算符，它将 `true` 变为 `false`，将 `false` 变为 `true`。\n\n`||` \
    \ own 所有运算符中优先级最低的，然后是 `&&`、比较运算符（`>`、`==` 等）等。下面的示例说明括号是必要的：\n\n```\n1 + 1 ==\
    \ 2 && 10 * 10 > 50\n```\n\n空值\n\n`Null` 和 `undefined` 是仅两种用于指示重要值不存在的特殊值类型。它们包含零数据。\n\
    \n### 自动类型转换\n\n早些时候提到 JavaScript 几乎接受所有给程序，包括具有异常行为的程序。自动类型转换在以下表达式中体现：\n\n```javascript\n\
    console.log(8 * null)\n// → 0\n```\n\n```javascript\nconsole.log(\"5\" - 1)\n\
    // → 4\n```\n\n```javascript\nconsole.log(\"5\" + 1)\n// → 51\n```\n\n```javascript\n\
    console.log(\"five\" * 2)\n// → NaN\n```\n\n```javascript\nconsole.log(false ==\
    \ 0)\n// → true\n```\n\n当你给运算符分配错误的值时，JavaScript 会使用类型转换规则静地将该值转换为它所需的精确类型。在第一个表达式中，`null`\
    \ 变为 `0`，而第二个表达式中的 `5` 保持为 `5`（从字符串变为数字）。在第三个表达式中，在数字加法之前存在字符串拼接，这把 `1` 转换为 `\"\
    1\"`（从数字变为字符串）。当像 `\"five\"` 或 `undefined` 这样的奇数变为数字时，它会得到 `NaN` 值。如果你想使用 `==`\
    \ 区分相同类型的值，如果值除 `NaN` 外相似，则输出应该是 `true`。如果你想测试一个值是否包含真实值，请使用 `==`（或 `!=`）运算符进行比较。为了避免意外的类型转换，请使用三字符比较运算符。\n\
    \n### 逻辑运算符的短路\n\n`&&` 和 `||` 被称为逻辑运算符。它们用于以特定方式持有多种类型的值。它们将左侧的值转换为 `Boolean`\
    \ 类型以决定，尽管这取决于运算符和生成结果的类型，但始终会返回左侧或右侧的值。`||` 运算符在可以转换为 `true` 时返回左侧的值，并将返回右侧的值。\n\
    \n```javascript\nconsole.log(null || \"user\")\n// → user\n```\n\n```javascript\n\
    console.log(\"Kate\" || \"user\")\n// → Kate\n```\n\n此函数用于将值返回到其默认值，并放在空值中作为替换。字符串和数字到布尔值的转换规则表明，`0`、`NaN`\
    \ 和空字符串 `(\"\")` 被视为 `false`，而其他值为 `true`。因此 `0 || -1` 输出 `-1`，`\"\" || \"!?\"\
    ` 产生 `\"!?\"`。`&&` 运算符的操作相同，但方向相反。当左侧的值可以转换为 `false` 时，返回该值，或者将值传递到右侧。两个运算符仅在需要时才评估右侧的值。例如，我们设置如下值\
    \ `true || AX`，`AX` 的值将是 `true` 而不会考虑它。同样的规则适用于 `false && AX`，`AX` 为 `false` 并会被忽略。你可以将此过程称为短路求值。\n\
    \n### 总结\n\n本章介绍了 JavaScript 的四种值类型：字符串、数字、`undefined` 值和布尔值（Booleans）。这些值通过插入它们的名称作为\
    \ `true`、`null` 或值（`(13, \"ABC\")`）来产生。运算符可以整合并改变值。我们查看了用于术的二元运算符（`+`、`-`、`*`、`/`、`%`）、字符串拼接（`+`）、比较（`==`、`!=`、`===`、`!==`、`<`、`>`、`<=`、`>=`）、逻辑（`&&`、`||`），以及各种一元运算符（`-`\
    \ 用于数值、`!` 用于逻辑取反，以及 `typeof` 用于查找值的类型）和一个三元运算符（`?:`），根据第三个值选择两个值中的一个。你将获得足够的信息来像小计算器一样使用\
    \ JavaScript，并在后续章节中不断提高。\n\n### 练习\n\n编写一个 JavaScript 练习，通过用户定义的名称构建变量。\n\n###\
    \ 答案\n\n![00193.jpg](img/00193.jpeg)\n\n# 第 3 章：程序结构\n\n我们将开始扩展 JavaScript 语言命令，不仅是句子片段和名词。\n\
    \n## 表达式与语句\n\n产生值的代码块被称为表达式（expression）。单个值精确地写为 `22`，或者心理分析也被称为表达式。二元运算符中设置为两个表达式的表达式或括号内的表达式都是表达式。表达式可以像人类语言翻译一样适应其他表达式。它使我们能够开发出任意复杂计算的表达式。当一个表达式类似于句子片段时，JavaScript\
    \ 语句将完成该句子。语句列表被称为程序，最易访问的语句类型是以分号结尾的一行代码。\n\n例如：\n\n```javascript\n1;\n!false;\n\
    ```\n\n通过此功能，语句可以独立存在，并且可以添加一个偶尔更改屏幕颜色的特性，或修改机器的内部状态以影响其后的语句。\n\n## 绑定（Bindings）\n\
    \nJavaScript 使用变量绑定来持有值，例如：\n\n```javascript\nlet money = 5 * 5;\n```\n\n`let`\
    \ 是一个语句关键字，它意味着该句子将指定一个绑定，同时绑定名称和值可以使用 `=` 运算符和表达式来关联。使用定义的绑定作为表达式，即一个包含绑定值的表达式。下面是一个示例：\n\
    \n```javascript\nlet ten = 10;\nconsole.log(ten * Aten); \n// → 100\n```\n\n`=`\
    \ 运算符用于现有绑定，将绑定从设定值中移除并将其指向新值。\n\n```javascript\nlet mood = \"light\";\nconsole.log(mood);\n\
    // → light\n```\n\n```javascript\nmood = \"dark\";\nconsole.log(mood);\n// → dark\n\
    ```\n\n定义一个未赋值的绑定将导致无物可持有。因此，请求绑定的值会产生 `undefined` 值。你可以通过由逗号分隔的单一语句定义多个绑定。\n\n\
    ```javascript\nlet one = 1, two = 2;\nconsole.log(one + two);\n// → 3\n```\n\n\
    使用 `var` 和 `const` 单词来熟悉地开发绑定：\n\n```javascript\nvar name = \"Ayad\";\nconst greeting\
    \ = \"Hello\";\nconsole.log(greeting + name);\n// → Hello Ayad\n```\n\n`const`\
    \ 单词意味着常量。它描述了一个绝对绑定，在其生命周期内指向其设定值。这些单词通常用于声明一个名称对应一个值，以便以后方便引用。\n\n"
- fmt: "\nAlthough some words alike like `const`, `class`, `default`, `break`, `continue`,\
    \ `delete`, `do`, `else`, `any`, `word`, `can`, `be`, `called`, `binding`, `name`,\
    \ `also`, `consist`, `of`, `digits`, `but`, `not`, `begin`, `statement`, `with`,\
    \ `figure` contain dollar signs `$`, underscores `_`, or any other special characters\
    \ or punctuation.\n\n## The environment\n\nA group of bindings and values existing\
    \ at a stipulated time is known as the environment. When you launch a program,\
    \ the environment holds a language standard and often contains the binding that\
    \ creates interaction with system surroundings. For instance, a browser carries\
    \ functions that communicate with the launched website as well as read the keyboard\
    \ and mouse input.\n\n## Functions\n\nA bit of a program enclosed in a value is\
    \ called a function, and these values are added to launch the wrapped program.\
    \ For instance, a function that displays a small dialog box for user input.\n\n\
    ```javascript\nprompt(\"Enter a passcode\");\n```\n\nThe process of effecting\
    \ a function is described as calling, invoking, or applying. A call a function\
    \ is by inserting parentheses following an expression that provides a function\
    \ value. The set of the parenthesis value to the program within the function.\
    \ The define values set to functions as arguments.\n\n### The console.log function\n\
    \nIn the above samples, we used `console.log` to output values. All major browsers\
    \ utilize the `console.log` function to output its arguments to the device that\
    \ outputs text. In modern browsers, the output is often in the JavaScript `console`\
    \ that is invisible by default; you can tap the `F12` command on your keyboard\
    \ or the `command-option-I` on Mac. Binding names do not accommodate characters,\
    \ but `console.log` does because it is an expression that claims the log property\
    \ from the console binding value.\n\n### Return values\n\nFunctions are used to\
    \ produce aside. They can also provide values that do not need effects. For instance,\
    \ the function `Calculate.max` will take a sum of number arguments and returns\
    \ the greatest.\n\n```javascript\nconsole.log(Calculate.max(2, 4));\n// → 4\n\
    ```\n\nJavaScript regards anything that provides a value as an expression, which\
    \ enables function calls to attach into a substantial expression. Let’s call the\
    \ `Calculate.min`, which is a direct opposite to `Calculate.max`:\n\n```javascript\n\
    console.log(Math.min(2, 4) + 100);\n// → 102\n```\n\n## Control flow\n\nWhen more\
    \ than one statement is within a program, they execute in a story form from the\
    \ beginning of the code to the end. This type of program consists of two types\
    \ of statement: the first demands numbers from the user while the second displays\
    \ a square of a number and executes immediately after the first.\n\n```javascript\n\
    let Number = Number(prompt(\"Select A Digit\"));\nconsole.log(\"Your Digit is\
    \ the square root of \" + Number * Number);\n```\n\nA value is changed to a number\
    \ by the function `number` and outputs a string value. \n\n### Conditional execution\n\
    \nThe keyboard is used to develop conditional executions in JavaScript. You may\
    \ want some code to execute `if`, and `only if`, a specific condition is positive.\
    \ Let us display the square of the input if only it is a number.\n\n```javascript\n\
    let theNumber = Number(prompt(\"Select A Digit\"));\n\nif (!Number.isNaN(theNumber))\
    \ {\n  console.log(\"Your Digit is the square root of \" +\n  theNumber * theNumber);\n\
    }\n```\n\nThe `if` keyword performs or evades a statement determined by the Boolean\
    \ expression value. The type determining expression after the keyboard within\
    \ the parentheses accompanied by the statement to accomplish.\n\nThe `Number.isNaN`\
    \ function is a high-level JavaScript function that outputs only `true` if the\
    \ statement is declared as `NaN`. The number function returns `NaN` when an assigned\
    \ string is not a valid number. Statements after the `if` statement are enclosed\
    \ in braces `{}`. Braces are used to categorize different numbers of a statement\
    \ within an individual statement.\n\n```javascript\nif (1 + 1 == 2) console.log(\"\
    It's true\");\n// → It's true\n```\n\nThe `else` keyword can be utilized together\
    \ with the `if` statement to provide two different execution paths.\n\n```javascript\n\
    let theNumber = Number(prompt(\"Select A Digit\"));\n\nif (!Number.isNaN(theNumber))\
    \ {\n  console.log(\"Your Digit is the square root of \" +\n  theNumber * theNumber);\n\
    } else {\n  console.log(\"Hey. Why didn't you give me a number?\");\n}\n```\n\n\
    If there are more than two paths to choose from, you can “chain” multiple `if/else`\
    \ pairs. Below is an example:\n\n```javascript\nlet num = Number(prompt(\"Pick\
    \ A Number\"));\n\nif (num < 10) {\n  console.log(\"Small\");\n} else if (num\
    \ < 100) {\n  console.log(\"Medium\");\n} else {\n  console.log(\"Large\");\n\
    }\n```\n\nThe program confirms if the `num` is less than 10, and if it is, it\
    \ selects that branch, and then it displays \"Small\". But if the `num` is greater\
    \ than 10, it selects the `else` branch which consists of a second `if` statement\
    \ of its own.\n\n### while and loops\n\nThis is the way to write a program that\
    \ displays all the even numbers from 0 to 12.\n\n```javascript\nconsole.log(0);\n\
    console.log(2);\nconsole.log(4);\nconsole.log(6);\nconsole.log(8);\nconsole.log(10);\n\
    console.log(12);\n```\n\nA way to run a clock of code multiple times is described\
    \ as a loop. The looping control flow enables the user to return to certain points\
    \ in written programs and redo it with the current state of the program. Integrate\
    \ this with a binding that enumerates as follows:\n\n```javascript\nlet number\
    \ = 0;\n\nwhile (number <= 12) {\n  console.log(number);\n  number = number +\
    \ 2;\n}\n// → 0\n// → 2\n// …etc\n```\n\nA statement that begins with the keyword\
    \ `while` and at the same time producing a loop. The keyword `while` is accompanied\
    \ by an expression in parentheses followed by a statement like the `if` statement.\
    \ The loop becomes continuous until the expression provides a value that states\
    \ `true` when translated to Boolean. Each time the loop repeats, numbers adopt\
    \ a number twice of their previous value.\n\nLet us write a program that evaluates\
    \ and display the value of 210 (2 raised to the power of 10). We will utilize\
    \ two bindings: one to keep an eye on our result and the other to calculate how\
    \ times the value of two multiplied by the result.\n\n```javascript\nlet result\
    \ = 1;\nlet counter = 0;\n\nwhile (counter < 10) {\n  result = result * 2;\n \
    \ counter = counter + 1;\n}\n\nconsole.log(result);\n// → 1024\n```\n\n### for\
    \ loops\n\nA lot of loops follow the `while` loop pattern, creating a counter\
    \ binding to track the loop's progress. Then a `while` loop with a test expression\
    \ to see if the counter reaches the set value.\n\n```javascript\nfor (let number\
    \ = 0; number <= 10; number = number + 4) {\n  console.log(number);\n}\n```\n"
