    `let blackRabbit = new Rabbit(\"black\");`\n\nThe `class` keyword begins with\
    \ a `class` declaration, which enables you to describe a `constructor` and a set\
    \ of methods in a particular place. `Class` declarations enable methods, properties\
    \ that access as functions, and functions to be included in the `prototype`. When\
