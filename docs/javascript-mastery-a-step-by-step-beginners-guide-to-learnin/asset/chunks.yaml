  trans: "\n\n括号内必须包含关键字后的两个分号，第一个分号之前的部分通过描述一个绑定来分离循环。另一部分是决定循环是否继续的语句。以下是使用 `for`\
    \ 替替 `while` 来计算 `2¹⁰` 的代码：\n\n```javascript\nlet result = 1;\n\nfor (let counter\
    \ = 0; counter < 10; counter = counter + 1) {\n  result = result * 2;\n}\n\nconsole.log(result);\n\
    ```\n// → 1024\n\n### 跳出循环\n\n除了让循环条件变为 `false` 之外，还有其他其他方法可以结束循环。`break` 可以影响跳出受限循环。`break`\
    \ 语句会执行此程序，直到找到第一个大于等于 `20` 且能被 `7` 整除的数字。\n\n```javascript\nfor (let current\
    \ = 20; current = current + 1; current++) {\n  if (current % 7 == 0) {\n    console.log(current);\n\
    \    break;\n  }\n}\n```\n// → 21\n\n`%` 运算符用于检查一个数字是否能被另一个数字整除。如果整除，则余数为零。示例中的\
    \ `for` 在循环结束时不会进行检查，这意味着直到循环内的 `break` 语句变为无限且不停止。\n\n### 简洁地更新绑定\n\n当你处于循环中时，程序会定期更新绑定以根据其上一个值存储一个值。\n\
    \n`counter = counter + 1;`\n\nJavaScript 提供了一种快捷方式。\n\n`counter += 1;`\n\n相关的快捷函数也适用于\
    \ `for` 的其他几个运算符，例如 `result *= 2` 用于乘以结果，或 `counter -= 1` 用于倒序计数。这使我们能够优化我们的计数示例。\n\
    \n```javascript\nfor (let number = 0; number <= 12; number += 2) {\n  console.log(number);\n\
    }\n```\n\n对于 `counter += 1` 和 `counter -= 1`，这里有更短的等价：\n\n`counter++` 和 `counter--`。\n\
    \n### 使用 switch 进行值分发\n\n使用 `switch` 对值进行分发可能如下：\n\n```javascript\nif (x == \"\
    value1\") {\n  action1();\n} else if (x == \"value2\") {\n  action2();\n} else\
    \ if (x == \"value3\") {\n  action3();\n} else {\n  defaultAction();\n}\n```\n\
    \n`switch` 用于更直接地表达上述形式的分发。下面是一个很好的 get 例：\n\n```javascript\nswitch (prompt(\"\
    天气是什么样的？\")) {\n  case \"rainy\":\n    console.log(\"别忘了带伞.\");\n    break;\n\
    \  case \"sunny\":\n    console.log(\"穿得轻便一点.\");\n  case \"cloudy\":\n    console.log(\"\
    出去走。\");\n    break;\n  default:\n    console.log(\"天气类型未知！\");\n}\n```\n\n######\
    \ 命名规范\n\n名称绑定不允许空格，但它支持使用多个单词来定义绑定值。当用不同单词绑定名称时，可以使用以下几种类型：\n\n* `fuzzylittleturtle`\n\
    * `fuzzy_little_turtle`\n* `FuzzyLittleTurtle`\n* `fuzzyLittleTurtle`\n\n### 注释\n\
    \n有时，原始代码并没有传递你想让程序发送给读者的每一条信息，或者以人们认为难以理解的方式传播信息。其他时候，你觉得应该给程序附带一些类似的想法，注释就发挥了这一功能。注释是程序中包含的一段文本，但计算机会忽略它。要编写单行注释，请使用双斜杠字符\
    \ `//`，后跟注释文本。\n\n```javascript\nlet accountBalance = calculateBalance(account);\n\
    // 它是芒果树上的黄橙色。accountBalance.adjust();\n// 捕捉我们家中的绿色的破布。let report = new Report();\n\
    // 日月交汇之处：addToReport(accountBalance, report);\n// 这是一条宽大的走廊，并且\n```\n\n`/* */`\
    \ 注释只出现在行的末尾。行内的任何注释都无所谓。\n\n### 总结\n\n现在你理解可以通过表达式创建语句。语句由 `if`、`else`、`switch`、`for`、`while`、`do`\
    \ 和 `return` 组成。函数用于组织代码、减少重复并将名称与其自身分离。每个函数都有自己的作用域。函数可以包含零参数或返回值。\n\n### 练习\n\
    \n编写一个接受两个整数的 JavaScript 程序。\n\n### 答案\n\n```javascript\nlet x = \"abc\";\nconsole.log(x.length);\n\
    ```\n\n"
