  trans: "\n\n`Function.prototype` 拥有 `constructor`、`name`、`length`、`prototype`、`util`、`for`、`instances`、`built`\
    \ 和 `through`。\n\n```javascript\nconsole.log(Object.getPrototypeOf(Rabbit) ==\
    \ Function.prototype);\n// A→ true\n\nconsole.log(Object.getPrototypeOf(weirdRabbit)\
    \ == Rabbit.prototype);\n// A→ true\n```\n\n### 类注解\n\nJavaScript `classes` 是带有\
    \ `prototype` 属性的 `constructor` 函数。以下是一个示例：\n\n```javascript\nclass Rabbit {\n\
    \  constructor(type) {\n    this.type = type;\n  }\n  speak(line) {\n    console.log(`The\
    \ ${this.type} Rabbit says '${line}'`);\n  }\n}\n```\n\n`let killerRabbit = new\
    \ Rabbit(\"killer\");`\n`let blackRabbit = new Rabbit(\"black\");`\n\n`class`\
    \ 关键字以类声明开始，允许你可以在特定位置描述 `constructor` 和一组方法。`Class` 声明允许将方法、可以作为函数调用的属性以及函数包含在\
    \ `prototype` 中。当你使用表达式时，它并不描述一个绑定，而是提供 `constructor` 作为值。你可以从表达式中排除类名。\n\n```javascript\n\
    let object = new class {\n  getWord() {\n    return \"hello\";\n  }\n};\nconsole.log(object.getWord());\n\
    // A→ hello\n```\n\n### 覆盖派生属性\n\n当属性被添加到 `object` 时（无论该属性在 `prototype` 中是否可用），该属性都会被添加到\
    \ `object` 中。如果 `prototype` 中存在具有相似名称的赋值属性，它不会影响该 `object`。\n\n```javascript\n\
    Rabbit.prototype.teeth = \"small\";\nconsole.log(killerRabbit.teeth);\n// A→ small\n\
    \nkillerRabbit.teeth = \"long, sharp, and bloody\";\nconsole.log(killerRabbit.teeth);\n\
    // A→ long, sharp, and bloody\n\nconsole.log(blackRabbit.teeth);\n// A→ small\n\
    \nconsole.log(Rabbit.prototype.teeth);\n// A→ small\n```\n\n覆盖属性用于将标准函数和数组原型存储为单独的\
    \ `toString` 方法。\n\n```javascript\nconsole.log(Array.prototype.toString == Object.prototype.toString);\n\
    // A→ false\n\nconsole.log([1, 3].toString());\n// A→ 1,3\n```\n\n在数组上调用 `toString`\
    \ 会得到一个与对它调用 `join(\",\")` 关联的结果。它在数组包含的值之间放置一个逗号。如果你在数组上调用 `Object.prototype.toString`，它将提供一个单独的字符串。\n\
    \n```javascript\nconsole.log(Object.prototype.toString.call([1, 3]));\n// A→ [object\
    \ Array]\n```\n\n字体 映射 (Maps)\n\n`map` 是一种将值与其他值连接起来的数据布局。如果你想将名称映射到年龄，可以这样写你的代码：\n\
    \n```javascript\nlet ages = {\n  Boris: 39,\n  Liang: 22,\n  Júlia: 62\n};\nconsole.log(`Julia\
    \ is ${ages[\"Julia\"]}`);\n// A→ Julia is 62\n\nconsole.log(\"Is Jack's age known?\"\
    , \"Jack\" in ages); // A→ Is Jack's age known? false\n\nconsole.log(\"Is toString's\
    \ age known?\", \"toString\" in ages); // A→ Is toString's age known? true\n```\n\
    \n`Object` 属性名应该是字符串。如果你想要一个键不能转换为字符串的映射，请不要使用 `object` 作为映射。JavaScript 包含一个名为\
    \ `Map` 的类。它保存映射关系并允许不同类型的键。\n\n```javascript\nlet ages = new Map();\nages.set(\"\
