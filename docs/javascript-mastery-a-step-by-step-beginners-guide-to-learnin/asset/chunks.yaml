  trans: "\n\n```javascript\n} else {\n  return base * power(base, exponent - 1);\n\
    }\n\nconsole.log(power(2, 3));\n```\n\n### 递归\n\n这种执行方式存在问题。与其他循环版本相比，它更慢。使用单个循环被认为比多次调用函数成本更。虽然并不意味着递归是一个无效的循环选项，但有些问题通过递归比使用循环更容易解决。需要检查或处理多个分支的问题，请查看这里：我们从数字\
    \ `1` 开始，不断加上 `5` 或乘以 `3`。例如，数字 `13` 可以通过乘以 `3` 然后加两次 `5` 得到，因此我们无法得到 `15`。以下代码是递归解决方案：\n\
    \n```javascript\nfunction findSolution(target) {\n  function find(current, history)\
    \ {\n    if (current == target) {\n      return history;\n    } else if (current\
    \ > target) {\n      return null;\n    } else {\n      return find(current + 5,\
    \ `${history} + 5`) ||\n             find(current * 3, `${history} * 3`);\n  \
    \  }\n  }\n  return find(1, \"1\");\n}\n\nconsole.log(findSolution(24));\n```\n\
    \n`// → (((1 * 3) + 5) * 3)`\n\n内部函数 `find` 接受两个参数：数字 `current` 和记录获取该数字过程的字符串。如果找到了解决方案，它会返回一个显示通往\
    \ `target` 路径的字符串；如果没有找到，返回值将是 `null`。为了实现这一点，函数执行三个动作中的一个。如果你的 `current` 数字等于\
    \ `target`，你可以通过返回的 `current` 历史记录获取它。有时数字会大于 `target`，你不需要探索这个选项，因为加法和减法只会增加数字，因此返回\
    \ `null`。如果你仍低于 `target` 数字，则会通过两次调用自身来开启两条路径，一个用于加法，另一个用于乘法。如果第一次调用返回了有效内容，很好；否则返回第二次调用，无论提供的是字符串还是\
    \ `null` 都没有关系。下面是函数如何产生效果的示例。此示例搜索数字 `13`：\n\n```\nfind(1, \"1\")\nfind(6, \"\
    (1 + 5)\")\nfind(11, \"((1 + 5) + 5)\")\nfind(16, \"(((1 + 5) + 5) + 5)\")\nfind(33,\
    \ \"(((1 + 5) + 5) + 5) * 3)\")\nfind(18, \"((((1 + 5) + 5) + 5) * 3) - 5)\")\n\
    find(3, \"((((1 + 5) + 5) + 5) * 3) - 5) / 3)\")\nfind(8, \"((((((1 + 5) + 5)\
    \ + 5) * 3) - 5) / 3) + 5)\")\nfind(13, \"((((((1 + 5) + 5) + 5) * 3) - 5) / 3)\
    \ + 5) + 5)\")\n```\n\n找到了！缩进表示了栈中的所有发现。函数可以通过两种方式引入程序中。第一种是多次编写相似的代码，这可以在不重复编写的情况下实现更多功能，并留出自己的函数。你可以从命名函数并编写函数体开始。下面是一个示例。我们将编写一个产生两个数字的程序——农场上可用鸡的数量：\n\
    \n`7` 头牛\n`11` 只鸡\n\n```javascript\nfunction printInventory(cows, chickens) {\n\
    \  let cowString = String(cows);\n  while (cowString.length < 3) {\n    cowString\
    \ = \"0\" + cowString;\n  }\n  console.log(`${cowString} cows`);\n\n  let chickenString\
    \ = String(chickens);\n  while (chickenString.length < 3) {\n    chickenString\
    \ = \"0\" + chickenString;\n  }\n  console.log(`${chickenString} chickens`);\n\
    }\n\nprintInventory(7, 11);\n```\n\n在字符串后写上长度决定了特定循环继续添加零，直到它们组成三个字符。这是一个更好的尝试：\n\
    \n```javascript\nfunction printZeroWithLabel(number, label) {\n  let numberString\
    \ = String(number);\n  while (numberString.length < 3) {\n    numberString = \"\
    0\" + numberString;\n  }\n  console.log(`${numberString} ${label}`);\n}\n\nfunction\
    \ printInventory(cows, chickens, pigs) {\n  printZeroWithLabel(cows, \"Cows\"\
    );\n  printZeroWithLabel(chickens, \"Chickens\");\n  printZeroWithLabel(pigs,\
    \ \"Pigs\");\n}\n\nprintInventory(7, 1, 3);\n```\n\n与其提取程序中的重复部分，不如通过以下步骤提取出一个单独的概念：\n\
    \n```javascript\nfunction zeroPad(number, width) {\n  let string = String(number);\n\
    \  while (string.length < width) {\n    string = \"0\" + string;\n  }\n  return\
    \ string;\n}\n\nfunction printInventory(cows, chickens, pigs) {\n  console.log(`${zeroPad(cows,\
    \ 3)} cows`);\n  console.log(`${zeroPad(chickens, 3)} chickens`);\n  console.log(`${zeroPad(pigs,\
    \ 3)} pigs`);\n}\n\nprintInventory(7, 16, 3);\n```\n\n函数也可以用于打印对齐的数字。\n\n### 函数与效果\n\
    \n函数可以包含效果并返回值。它们总是比产生效果的函数更容易集成值。纯函数是不依赖于任何效果的唯一值函数。例如，它不会识别具有变化值的全局绑定。它包含相同的参数。\n\
    \n### 总结\n\n在本章中，你现在理解了如何编写函数。通过了解如何编写 `function` 关键字以及何时使用表达式，你现在可以构建函数值。当你将函数作为语句时，它可以设置绑定并命名函数作为其值。你还可以使用箭头函数来构建函数。\n\
    \n```javascript\n// 定义 Af 为函数值\nconst Af = function(a) {\n  console.log(a + 2);\n\
    };\n\n// 声明 Ag 为函数\nfunction Ag(a, Ab) {\n  return a * Ab * 3.5;\n}\n\n// 否则更简洁的函数值\n\
    let Ah = a => a % 3;\n```\n\n理解函数的视角视角是作用域。每个块都会创建一个新的作用域。特定作用域内的参数和绑定是局部的，从外部可见。使用\
    \ `var` 设置的绑定表现不同，会导致全局范围。将程序执行的任务区分成不同的函数是重要的。你不需要经常重复自己，函数可以通过将代码分类为执行特定操作的片段来安排程序。\n\
    \n### 练习\n\n编写一个 JavaScript 程序来判断一个数字是否为偶数。\n\n### 答案\n\n"
- fmt: "\nIf you want to work with a lot of digital data, you must represent the digital\
    \ data in a machine memory. For an instance, you need to represent a group of\
    \ numbers alike `2`, `3`, `5`, `7`, and `11`. Now let’s get prolific with our\
    \ use of strings as strings can contain quite a lot of data. We will use `2`,\
    \ `3`, `5`, `7`, `11` as the representation. A JavaScript programming language\
    \ offers a unique data type for saving sequences of values, which is is called\
    \ an `array`. We write an `array` as a `list` of values within between square\
    \ brackets, differentiated by commas.\n\n```javascript\nlet listOfNumbers = [2,\
    \ 3, 5, 7, 11];\n\nconsole.log(listOfNumbers[2]);\n\n// → 5\n\nconsole.log(listOfNumbers[0]);\n\
    \n// → 2\n\nconsole.log(listOfNumbers[2] - 1]);\n\n// → 3\n```\n\nThe notation\
    \ used to get elements within an `array` also utilizes the square brackets. A\
    \ complete square brackets pair right after an expression that contains another\
    \ expression within. When you start counting elements in an `array`, you begin\
    \ from zero and not one. Therefore, the first element is deemed with `listOfNumbers[0]`.\n\
    \n### Properties\n\nThe previous chapters have contained expressions like the\
    \ `myString`. `length` (to calculate the length of a string) and `Math.max` (the\
    \ maximum function). These are properties that can approach the property values.\
    \ Virtually all JavaScript values contain properties. The few values that do not\
    \ contain properties are `null` and `undefined`. If you access a property with\
    \ a nonvalue, the result will be an error.\n\n```javascript\nnull.length;\n\n\
    // → TypeError: null has no properties\n```\n\nIn JavaScript, the two major ways\
    \ to evaluate properties are with a dot and square brackets. The `value.x` and\
    \ `value[x]` can evaluate the property on `value`, not particularly the same property.\
    \ How you use `x` as is different from how you use a dot.\n\nIf you want to use\
    \ the dot, the text you input after the dot is the name of the property. And if\
    \ you're going to use the square brackets, the expression within the brackets\
    \ is accessed to redeem the property name. `value.x` delivers the property of\
    \ `value` called “x,” while `value[x]` accesses the expression `x` and utilize\
    \ the result, transformed into a string as the name of the property. If the property\
    \ you want is named `color`, you should type `value.color`. You can withdraw the\
    \ property that the value called within the binding `i`, type `value[i]`. The\
    \ name of the properties are strings, but the dot notation performs with only\
    \ valid binding names. Therefore if you want to evaluate a property named `2`\
    \ or `John Doe`, use the square brackets: `value[2]` or `value[\"John Doe\"]`.\n\
    \nThe elements within an `array` save as the properties of an `array` that utilize\
    \ numbers as property names. An array's `length` property determines how many\
    \ items it contains. The name of that property is a valid, binding name. Type\
    \ `array.length` to determine the length of an `array`, it is much easier to type\
    \ than `array[\"length\"]`.\n\n### Methods\n\nThe `string` and `array` objects\
    \ accommodate several properties that store function values.\n\n```javascript\n\
    let doh = \"Doh\";\n\nconsole.log(typeof doh.toUpperCase);\n\n// → function\n\n\
    console.log(doh.toUpperCase());\n\n// → DOH\n```\n\nEach string consists of a\
    \ `toUpperCase` property. When you call this property, it sends back a copy of\
    \ the string whereby all the containing letters transform into uppercase. Although\
    \ the `toUpperCase` do not go through an argument, the function can evaluate the\
    \ string \"Doh,\" which is the property of the value we called above. Properties\
    \ that consist of functions are known as methods. The below example illustrates\
    \ two methods that can be used to influence arrays.\n\n```javascript\nlet sequence\
    \ = [1, 2, 3];\n\nsequence.push(4);\n\nsequence.push(5);\n\nconsole.log(sequence);\n\
    \n// → [1, 2, 3, 4, 5]\n\nconsole.log(sequence.pop());\n\n// → 5\n\nconsole.log(sequence);\n\
    \n// → [1, 2, 3, 4]\n```\n\nThe `push` method is used to attach a value to the\
    \ end of an `array` while the `pop` method does the direct opposite. It eradicates\
    \ the last value within an `array` and sends it back. These are generational terms\
    \ of operations on a stack. A stack is a data layout that enables users to push\
    \ values in and pop them out in the opposite direction so that the added value\
    \ will remove first.\n\n### Objects\n\nYou can represent a group of log entries\
    \ as an `array` although each string entry is required to save a list of activities\
    \ as well as a Boolean value that specifies if Jacques is transformed to a squirrel\
    \ or not. We will group this into a single value and place the grouped values\
    \ within an `array` of log entries. Arbitrary collections of properties are the\
    \ value of the type `object`. We will develop an object utilizing braces as an\
    \ expression.\n\n```javascript\nlet day1 = {\n  squirrel: false,\n  events: [\"\
    work\", \"touched tree\", \"pizza\", \"running\"]\n};\n\nconsole.log(day1.squirrel);\n\
    \n// → false\n\nconsole.log(day1.wolf);\n\n// → undefined\n\nday1.wolf = false;\n\
    \nconsole.log(day1.wolf);\n\n// → false\n```\n\nThe braces contain a list of properties\
    \ divided by commas. Every property contains a name accompanied by a value and\
    \ a colon. When you write an object over several lines, make sure your indenting\
    \ is good because it enables better readability. A quote invalid binding names\
    \ properties or valid numbers should.\n\n```javascript\nlet descriptions = {\n\
    \  work: \"Went to a work,\"\n  \"touched tree\": \"Touched Aa tree.\"\n};\n```\n\
    \nYou can use braces in two different ways in JavaScript. It is used at the beginning\
    \ of a statement and can also be utilized to begin a block of statements. You\
    \ can specify a value to a property expression using the `=` operator. It takes\
    \ the place of the property value, and if it is in existence, it develops a new\
    \ one. The `delete` operator is a unary operator that eradicates the property\
    \ name of an object. Below is an illustration:\n\n```javascript\nlet anObject\
    \ = {left: 1, right: 2};\n\nconsole.log(anObject.left);\n\n// → 1\n\ndelete anObject.left;\n\
    \nconsole.log(anObject.left);\n\n// → undefined\n\nconsole.log(\"left\" in anObject);\n\
    \n// → false\n\nconsole.log(\"right\" in anObject);\n\n// → true\n```\n\nThe binary\
    \ `in` operation determines if an object or string contains a property. The major\
    \ differentiation between specifying a property to `undefined` and deleting it\
    \ is that the object does not possess the property, so the value returns `false`.\
    \ To determine what properties contained in an object and sends back an array\
    \ of strings with property names of the object.\n\n```javascript\nconsole.log(Object.key({x:\
    \ 0, y: 0, c: 2}));\n\n// → [\"x\", \"y\", \"c\"]\n```\n\nThe `Object.assign`\
    \ function is used to copy properties from one object to another.\n\n```javascript\n\
    let objectA = {a: 1, b: 2};\n\nObject.assign(objectA, {b: 3, c: 4});\n\nconsole.log(objectA);\n\
    \n// → {a: 1, b: 3, c: 4}\n```\n\nAn `array` is a unique object used for saving\
    \ succession of things. When you access `typeof []`, it provides \"object.\" The\
    \ below illustration stands for the journal that Jacques stores as an array of\
    \ objects.\n\n```javascript\nlet journal = [\n  {\n    events: [\"work\", \"touched\
    \ tree\", \"pizza\",\n    \"running\", \"television\"],\n    squirrel: false\n\
    \  },\n  {\n    events: [\"work\", \"ice cream\", \"cauliflower\",\n    \"lasagna\"\
    , \"touched tree\", \"brushed teeth\"],\n    squirrel: false\n  }\n];\n```\n"
