    `Boolean.values()`, they are `and`, `or`, `and` not. The `&&` operator signifies
    a logical `and` and its results depend on where the values imputed are `true`
    or `false`.


    ```javascript

    console.log(true && false)

    // → false

    ```


    ```javascript

    console.log(true && true)

    // → true

    ```


    The `||` operator indicates a logical `or`. This operator outputs `true` if the
    given value is `true`.


    ```javascript

    console.log(false || true)

    // → true

    ```


    ```javascript

    console.log(false || false)

    // → false

    ```


    An exclamation mark `!` indicates `Not`. It is an operator that overturns the
    set value, and it changes from `true` to `false` and `false` to `true`.


    The `||` consists of the lowest precedence of all operators, then `&&`, the comparison
    operators (`>`, `==`, etc.), and so on. The example below states that parentheses
    are necessary:


    ```

    1 + 1 == 2 && 10 * 10 > 50

    ```


    Empty values


    `Null` and `undefined` are the only two types of special values that are used
    to indicate the non-appearance of an important value. They contain zero data.


    ### Automatic type conversion


    Earlier I said that JavaScript accepts practically all given programs, including
    programs with odd behaviors. Automatic type conversion illustrates in the following
    expressions:


    ```javascript

    console.log(8 * null)

    // → 0

    ```


    ```javascript

    console.log("5" - 1)

    // → 4

    ```


    ```javascript

    console.log("5" + 1)

    // → 51

    ```


    ```javascript

    console.log("five" * 2)

    // → NaN

    ```


    ```javascript

    console.log(false == 0)

    // → true

    ```


    When you assign an operator the wrong value, JavaScript silently returns that
    value to the exact type it requires using the type coercion rule. In the first
    expression, `null` turns to `0`, and the `5` in the second remains `5` (from string
    to number). In the third expression, there was a string concatenation before the
    numeric addition, which converts the `1` to `1` (from number to string). When
    odd numbers such as `"five"` or `undefined` changes to the number, it gets the
    value of `NaN`. If you want to differentiate between values of the same type using
    `==`, the output should be `true` if the values are similar except `NaN`. If you
    want to test if a value contains a real value, use the `==` (or `!=`) operator
    to compare. To avert unexpected type conversions, use the three-character comparison
    operators.


    ### Short-circuiting of logical operators


    `&&` and `||` are called the logical operators. They are used to hold several
    types of values in a specific way. They change the values contained in the left
    aside to a `Boolean` type to decide, although it depends on the operators and
    the type of generated result, but will always reinstate the left or right-hand
    value. The `||` operator sends back value to the left when it can be changed to
    `true` and will reinstate the value to the right.


    ```javascript

    console.log(null || "user")

    // → user

    ```


    ```javascript

    console.log("Kate" || "user")

    // → Kate

    ```


    This function is used to return values to its default value and placed within
    an empty value as a replacement. Strings and numbers to a Boolean value conversion
    rules indicate that `0`, `NaN`, and empty string `("")` count as `false` while
    other values are `true`. Therefore `0 || -1` outputs `-1`, and `"" || "!?"` yields
    `"!?"`. The `&&` operator operates identically but the other away around. When
    values to the left can be changed to `false`, return the value, or it sends the
    value to the right. Both operators evaluate the value to the right only when it
    is required. For example, we have the following values set as `true || AX`, the
    value of `AX` will be `true` and will not consider it. The same rule applies to
    `false && AX`, which `AX` is `false` and will overlook it. You can call this process
    the Short-circuit evaluation.


    ### Summary


    This chapter looks at the four types of JavaScript values, which are strings,
    numbers, `undefined` values and `Booleans`. These values are developed by inserting
    their names as `true`, `null` or value `(13, "ABC")`. Operators can integrate
    and change values. We looked at binary operators for arithmetic (`+`, `-`, `*`,
    `/`, `%`), string concatenation (`+`), comparison (`==`, `!=`, `===`, `!==`, `<`,
    `>`, `<=`, `>=`), and logic (`&&`, `||`), and also various unary operators (`-`
    to nullify an number, `!` to nullify logically, and `type` of `of` to search for
    a value’s type) and a ternary operator (`?:`)`) to choose one of two values depending
    on a third value. You will get sufficient information to use JavaScript alike
    as a small calculator, and you will improve in the following chapters.


    ### Exercise


