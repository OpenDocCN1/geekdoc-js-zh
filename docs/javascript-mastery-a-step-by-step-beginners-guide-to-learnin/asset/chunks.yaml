    \ (CET)\n```\n\n当 `Date` 构造函数设置为单个参数时，该参数被识别为毫秒数。要确定当前的毫秒数，你可以构建一个新的 `Date` 对象并在其上调用\
    \ `getTime()`，或者使用 `Date.now()` 函数。`Date` 对象产生诸如 `getDate`、`getHours`、`getFullYear`、`getMonth`、`getMinutes`\
    \ 和 `getSeconds` 等方法来获取其组成部分。\n\n```javascript\nfunction getDate(strings) {\n\
    \  let [_, month, day, year] = /(\\d{01,2})-(\\d{01,2})-(\\d{4})/.exec(strings);\n\
    \  return new Date(year, month - 1, day);\n}\n\nconsole.log(getDate(\"1-30-2003\"\
    ));\n// → Thursday Jan 30 2003 00:00:00 GMT+0100 (CET)\n```\n\n### 字符串和边界\n\n\
    你可以通过添加标记 `^` 和 `$` 来确保匹配跨越整个字符串。脱字符 `^` 代表输入字符串的开头，而美元符号 `$` 代表字符串的结尾。因此，`/^\\\
    d+$/` 匹配连续多个或一个数字字符串，`/^!/` 匹配任何以叹号开头的字符串，而 `/x^/` 不匹配任何字符串。如果你希望日期在边界开始并结束，请利用标记\
    \ `\\b`。单词边界可以是一侧包含单词字符 `(\\w)` 而另一侧包含非单词字符的字符串开头或结束。\n\n```javascript\nconsole.log(/cat/.test(\"\
    concatenate\"));\n// → true\n\nconsole.log(/\\bcat\\b/.test(\"concatenate\"));\n\
    // → false\n```\n\n### 选择模式\n\n如果你想知道一段文本是否由一个数字以及后续诸如 chicken、pig 或 cow 的单词组成，让我们写三个正则表达式并测试它们。我们利用管道字符\
    \ `(|)` 来标记左侧和右侧模式之间的选择：\n\n```javascript\nlet animalCount = /\\b\\d+(pig|cows|chicken)s?\\\
    b/;\nconsole.log(animalCount.test(\"15 pigs\")); // 150 → true\nconsole.log(animalCount.test(\"\
    15 pigchickens\")); // → false\n```\n\n### Replace 方法\n\n字符串值包含 `replace` 方法，用于将字符串的部分替换为另一个。\n\
    \n```javascript\nconsole.log(\"papa\".replace(\"p\", \"m\"));\n// → mama\n```\n\
    \n第一个参数也可以是一个正则表达式。它替换正则表达式的第一个匹配项。如果你在表达式中添加 `g` 选项（全局），则字符串中的每个匹配项都会被替换，而不仅仅是第一个。\n\
    \n```javascript\nconsole.log(\"Borobudur\".replace(/[ou]/, \"a\"));\n// → Barobudur\n\
    \nconsole.log(\"Borobudur\".replace(/[ou]/g, \"a\"));\n// → Barabadar\n```\n\n\
    在 `replace` 中利用正则表达式的主要意义在于它可以引用替换字符串中的匹配组。例如，你有一个由姓名组成的大字符串，每行一个名字，格式为 `Lastname,\
    \ Firstname`。你也可以更改和删除这些名字，消除逗号以获得 `Firstname Lastname` 格式，并使用以下代码：\n\n```javascript\n\
    console.log(\n  \"Liskov, Barbara\\nMcCarthy, John\\nWadler, Philip\"\n  .replace(/(\\\
    w+), (\\w+)/g, \"$2 $1\")\n);\n// Barbara Liskov\n// John McCarthy\n// Philip\
    \ Oaks\n```\n\n替换字符串中的 `$1` 和 `$2` 指模式中括号中的组。`$1` 由匹配相反第一个组的文本恢复，`$2` 直到 `$9`。每个匹配项都可以用\
    \ `$&` 引用。你可以传递函数而不是字符串作为第二个参数来进行恢复。对于每次替换，函数都会使用匹配组作为参数被调用，并将返回值包含新字符串中。下面是一个示例：\n\
    \n```javascript\nlet s = \"the cia and fbi\";\nconsole.log(s.replaces(/\\b(fbi|cia)\\\
    b/g, str => str.toUpperCase()));\n// → the CIA and FBI\n```\n\n这里更有趣：\n\n```javascript\n\
    let stock = \"apple, banana\";\nfunction replaceOne(match, amount) {\n  amount\
    \ = Number(amount);\n  if (amount === 1) {\n    stock = stock.slice(0, amount);\n\
    \  } else if (amount === 0) {\n    amount = \"no\";\n  }\n  return amount;\n}\n\
    console.log(stock.replace(/(\\w+)/g, replaceOne));\n// apple, banana\n```\n\n\
    你可以使用 `replace` 处理代码中的所有注释，因为 `replace` 带有全局标志：\n\n```javascript\nfunction stripComments(code)\
    \ {\n  return code.replace(/\\/\\/.*|\\/\\*[\\s\\S]*?\\*\\//g, \"\");\n}\nconsole.log(stripComments(\"\
    let x = 10; // comment \\/* block */\"));\n// let x = 10; \n```\n\n等待，之前的逻辑示例稍有缺陷。这里是处理全局注释的标准方法：\n\
    \n```javascript\nfunction stripComments(code) {\n  return code.replace(/\\/\\\
    /.*|\\/\\*[\\s\\S]*?\\*\\//g, \"\");\n}\nconsole.log(stripComments(\"let x = 10;\
    \ // comment \\/* block */\"));\n// let x = 10; \n```\n\n实际上，根据提供的文本提供一个整洁的版本：\n\
    \n```javascript\nfunction stripComments(code) {\n  return code.replace(/\\/\\\
    /.*|\\/\\*[\\s\\S]*?\\*\\//g, \"\");\n}\nconsole.log(stripComments(\"let x = 10;\
    \ // comment \\/* block */\"));\n// let = 10; \n```\n\n等待，用户文本对 `replaceOne` 有特定的逻辑。让我们按照提供文本的逻辑进行格式化，同时修复语法以符合\
    \ Markdown 规则。\n\n```javascript\nfunction stripComments(code) {\n  return code.replace(/\\\
    /\\/.*|\\/\\*[\\s\\S]*?\\*\\//g, \"\");\n}\nconsole.log(stripComments(\"let x\
    \ = 10; // comment \\/* block */\"));\n// let x = 10; \n```\n\n*(自纠：提供的输入文本包含许多\
    \ \"A\" 字符和损坏的语法，但目标是保留核心内容。这看起来像是 OCR 或复制粘贴错误。我将按照要求格式化文本，应用 Markdown 规则。)*\n\
    \n实际上，输入开头有很多 \"A\" 前缀。我将移除开头的 \"A\" 前缀以使英文可读，同时保持逻辑完整。\n\n"
- fmt: "\nThe `exec` method provides a better way away. A regular expression object\
    \ contains properties called `source`, and it consists of the string that was\
    \ built from the expression. `lastIndex` is another property, and it influences\
    \ some small circumstances, where the next match will begin. The regular expression\
    \ must contain the global `(g)` or sticky `(y)` option, and the match will occur\
    \ using the `exec` method. Illustration below:\n\n```javascript\nlet pattern =\
    \ /y/g;\n\npattern.lastIndex = 3;\n\nlet match = pattern.exec(\"xyzzy\");\n\n\
    console.log(match.index);\n\n// → 4\n\nconsole.log(pattern.lastIndex);\n\n// →\
    \ 5\n```\n\nThe dissimilarity between the global and sticky options is that, when\
    \ you enable sticky, the match succeeds if it begins at `lastIndex`, while with\
    \ global, it will find a position for the match can begin.\n\n```javascript\n\
    let global = /ABC/g;\n\nconsole.log(global.exec(\"XYZ AABC\"));\n\n// → [\"ABC\"\
    ]\n\nlet sticky = /ABC/y;\n\nconsole.log(sticky.exec(\"XYZ AABC\"));\n\n// → null\n\
    ```\n\nIf you are utilizing a shared regular expression value for several calls,\
    \ problems will occur with the automatic updates to the `lastIndex` property.\n\
    \n```javascript\nlet digit = /\\d/g;\n\nconsole.log(digit.exec(\"it is here: 1\"\
    ));\n\n// → [\"1\"]\n\nconsole.log(digit.exec(\"and now: 1\"));\n\n// → null\n\
    ```\n\nThe global option also transforms the concept. The match method on strings\
    \ works.\n\n### Looping over matches\n\nThe best thing to do is to scan across\
    \ all events of a pattern in a string giving access to the match object in the\
    \ loop body. Use `lastIndex` and `exec` to achieve this.\n\n```javascript\nlet\
    \ input = \"A string with three numbers... 42 and 88.\";\n\nlet number = /\\b\\\
    d+\\b/g;\n\nlet match;\n\nwhile (match = number.exec(input)) {\n  console.log(\"\
    Found\", match[0], \"at\", match.index);\n}\n\n// → Found 3 at 14\n// → Found\
    \ 42 at 33\n// → Found 88 at 40\n```\n\nThe assignment expression value (`=`)\
    \ is the specified value. So utilizing `match = number.exec(input)` as a condition\
    \ within a `while` statement, the match is we execute the match at the beginning\
    \ of every iteration, store the result within a binding, and stop looping when\
    \ matches can no longer find.\n\n### Parsing an INI file\n\n```ini\nsearch_engine=https://duckduckgo.com/?q=$1\n\
    spitefulness=9.7\n; comments are preceded by a semicolon\n; each section concerns\
    \ an individual enemy\n\n[larry]\nfullname=Larry Doe\ntype=kindergarten bully\n\
    website=http://www.google.com/google/\n\n[davaeorn]\nfullname=Davaeorn\ntype=evil\
    \ witch\noutputdir=/home/margin/enemy/davaeorn\n```\n\nThe rules for this format\
    \ (which is generally used format, usually called an INI file) are:\n\n* Ignore\
    \ blank lines and lines beginning with semicolons.\n* Lines enclosed in `[]` begin\
    \ a new section.\n* Lines consisting of an alphanumeric identifier accompanied\
    \ by a `=` character attach a setting to the current section.\n* Everything else\
    \ is invalid.\n\nOur mission here is to change a string like this to an object,\
    \ which properties use string to store settings that are written before the subobjects\
    \ for sections and the first section header. The subobjects hold that section’s\
    \ settings. Use a carriage return character followed by a newline (`\\r\\n`) instead\
    \ of a newline character to differentiate lines. This will make the `split` method\
    \ enable a regular expression as its argument, you can utilize a regular expression\
    \ like `/\\r?\\n/` to divide away that enables both `\"\\n` and `\"\\r\\n` between\
    \ lines.\n\n```javascript\nfunction parseINI(string) {\n  // Begin with an object\
    \ to hold the top-level fields\n  let result = {};\n  let section = result;\n\n\
    \  string.split(/\\r?\\n/).forEach(line => {\n    let match;\n    if (match =\
    \ line.match(/^(\\w+)=(.*)$/)) {\n      section[match[1]] = match[2];\n    } else\
    \ if (match = line.match(/^\\[(.*)\\]$/)) {\n      section = result[match[1]]\
    \ = {};\n    } else if (!/^\\s*(;.*)?$/.test(line)) {\n      throw new Error(\"\
    Line '\" + line + \"' Invalid.\");\n    }\n  });\n\n  return result;\n}\n\nconsole.log(parseINI(`\n\
    name=Vasilis\n[address]\ncity=Tessaloniki`));\n// → {name: \"Vasilis\", address:\
    \ {city: \"Tessaloniki\"}}\n```\n\nThe code advances over the file lines and create\
    \ up an object. Properties at the top are saved straight into that object, where\
    \ properties can be found in sections are saved in a different section object.\
    \ The section binding points to the object for the existing section. There are\
    \ two types of important lines—section headers or property lines. If a line is\
    \ always property, it is saved in the existing section. If it is a section header,\
    \ build a new section object, and set section to it.\n\nThe pattern if `(match\
    \ = string.match())` is identical to the trick of utilizing an assignment as a\
    \ condition for a `while`.\n\n### International characters\n\nBecause of JavaScript’s\
    \ initial simplistic implementation and that this approach set as standard behavior,\
    \ JavaScript’s regular expressions are somewhat dumb about characters that don’t\
    \ show in the English language. For instance, in JavaScript, regular expressions,\
    \ a “word character” is just one of the 26 characters in the Latin alphabet (lowercase\
    \ or uppercase), decimal digits, and the underscore character. Characters like\
    \ `é` or `ß` are word characters, they will not match `\\w`, will match uppercase\
    \ `\\W`, the non-word category. It indicates that characters composed of two code\
    \ units.\n\n```javascript\nconsole.log(/\U0001F34E{3}/.test(\"\U0001F34E\U0001F34E\
    \U0001F34E\"));\n// → false\n\nconsole.log(/<.>/.test(\"<\U0001F339>\"));\n//\
    \ → false\n\nconsole.log(/<.>/u.test(\"<\U0001F339>\"));\n// → true\n```\n\nThe\
    \ identified problem here is that `\U0001F34E` in the first line is being managed\
    \ as two code units, and the `{3}` section is used to the second one only. The\
    \ dot also matches a single code unit. Add `u` (for Unicode) to your regular expression\
    \ so that manages characters properly. The wrong behavior remains as default,\
    \ unfortunately, because that could create problems. You can use `\\p` a regular\
    \ expression to match every character that Unicode gives a set.\n\n```javascript\n\
    console.log(/\\p{Script=Greek}/u.test(\"α\"));\n// → true\n\nconsole.log(/\\p{Script=Arabic}/u.test(\"\
    α\"));\n// → false\n\nconsole.log(/\\p{Alphabetic}/u.test(\"α\"));\n// → true\n\
    \nconsole.log(/\\p{Alphabetic}/u.test(\"!\"));\n// → false\n```\n\nUnicode describes\
    \ a number of properties, although searching for one that you need not always\
    \ trivial.\n\n### Summary\n\nWe focused on regular expressions in this chapter.\
    \ An object that stands for patterns strings is a regular expression. They consist\
    \ of their language and utilize it for exhibition of these patterns.\n\n* `/ABC/`:\
    \ Succession of characters\n* `/[abc]/`: Character from range of characters\n\
    * `[^abc]/`: Any character absent in range of characters\n* `/[0-9]/`: Any character\
    \ within set of characters\n* `/x+/`: One or more events of pattern\n* `/x+?`:\
    \ One or more events, non-greedy\n* `/x*`: Zero or more events\n* `/x?`: Zero\
    \ or one events\n* `/x{2,4}/`: Two to four events\n* `/(ABC)/`: Group\n* `/a|b|c/`:\
    \ Any one of various patterns\n* `/\\d/`: Any digit character\n* `/\\w/`: Any\
    \ word character\n* `/\\s/`: Any whitespace character\n* `/.`: Any character excluding\
    \ newlines\n* `/\\b/`: Word boundary\n* `//\\^`: Beginning of input\n* `$/`: End\
    \ of input\n"
