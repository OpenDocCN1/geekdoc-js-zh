    // A→ hello\n```\n\n### Overriding derived properties\n\nWhen a property is added\
    \ to an `object`, either available in the `prototype` or not, the property adds\
    \ to the `object`. If there was an assigned property with similar names in the\
    \ `prototype`, it does not influence the `object`.\n\n```javascript\nRabbit.prototype.teeth\
    \ = \"small\";\nconsole.log(killerRabbit.teeth);\n// A→ small\n\nkillerRabbit.teeth\
    \ = \"long, sharp, and bloody\";\nconsole.log(killerRabbit.teeth);\n// A→ long,\
    \ sharp, and bloody\n\nconsole.log(blackRabbit.teeth);\n// A→ small\n\nconsole.log(Rabbit.prototype.teeth);\n\
    // A→ small\n```\n\nOverriding properties is used to store a standard function\
    \ and array prototypes as a separate `toString` method.\n\n```javascript\nconsole.log(Array.prototype.toString\
    \ == Object.prototype.toString);\n// A→ false\n\nconsole.log([1, 3].toString());\n\
    // A→ 1,3\n```\n\nCalling `toString` on an array bestows a result that is linked\
    \ to calling `join(\",\")` on it. It places a comma between the values contained\
    \ in the array. If you call `Object.prototype.toString` on an array, it provides\
    \ a separate string.\n\n```javascript\nconsole.log(Object.prototype.toString.call([1,\
    \ 3]));\n// A→ [object Array]\n```\n\n### Maps\n\nA `map` is a data layout that\
    \ connects values with other values. If you want to map names to ages, write your\
    \ code like this:\n\n```javascript\nlet ages = {\n  Boris: 39,\n  Liang: 22,\n\
    \  Júlia: 62\n};\nconsole.log(`Julia is ${ages[\"Julia\"]}`);\n// A→ Julia is\
    \ 62\n\nconsole.log(\"Is Jack's age known?\", \"Jack\" in ages); // A→ Is Jack's\
    \ age known? false\n\nconsole.log(\"Is toString's age known?\", \"toString\" in\
    \ ages); // A→ Is toString's age known? true\n```\n\n`Object` property names should\
    \ be strings. If you want a map that the keys cannot be transformed to strings,\
    \ do not use `object` as a map. JavaScript contains a class called `Map`. It saves\
    \ a mapping and enables different types of keys.\n\n```javascript\nlet ages =\
    \ new Map();\nages.set(\"Boris\", 39);\nages.set(\"Liang\", 22);\nages.set(\"\
    Júlia\", 62);\nconsole.log(`Júlia is ${ages.get(\"Júlia\")}`);\n// A→ Júlia is\
    \ 62\n\nconsole.log(\"Is Jack's age known?\", ages.has(\"Jack\")); // A→ Is Jack's\
    \ age known? false\n\nconsole.log(ages.has(\"toString\")); // A→ false\n```\n\n\
    The methods `get`, `set`, and `has` are bodies of the layout of the `map` object.\
    \ The `Object.keys` sends back an object’s own keys only. You can use the `hasOwnProperty`\
    \ method as an option.\n\n```javascript\nconsole.log({x: 1}.hasOwnProperty(\"\
    x\")); // A→ true\n\nconsole.log({x: 1}.hasOwnProperty(\"toString\")); // A→ false\n\
    ```\n\n### Polymorphism\n\nWhen a string function is called on an `object`, the\
    \ `toString` method is called on that object in order to build a significant string\
    \ from it. You can define your own version of `toString` so that they can build\
    \ a string that consists of more important data than the \"[[object Object]\"\
    . Below is an illustration:\n\n```javascript\nRabbit.prototype.toString = function()\
    \ {\n  return `a ${this.type} Rabbit`;\n};\nconsole.log(String(blackRabbit));\n\
    // A→ a black Rabbit\n```\n\n`Symbols` are unique values built with the `Symbol`\
    \ function which cannot be built twice.\n\n```javascript\nlet sym = Symbol(\"\
    name\");\nconsole.log(sym == Symbol(\"name\")); // A→ false\n\nRabbit.prototype[sym]\
    \ = 55;\nconsole.log(blackRabbit[sym]); // A→ 55\n```\n\nThe string passed to\
    \ the `Symbol` is attached when you transform it to a string. They are distinctive\
    \ and function as property names.\n\n```javascript\nconst toStringSymbol = Symbol(\"\
    toString\");\nArray.prototype[toStringSymbol] = function() {\n  return `${this.length}\
    \ cm of blue yarn`;\n};\nconsole.log([1, 2].toString()); // A→ 1,2\n\nconsole.log([1,\
    \ 2][toStringSymbol]()); // A→ 2 cm of blue yarn\n```\n\nYou can attach `Symbol`\
    \ properties to `object` classes and expressions through the use of square brackets\
