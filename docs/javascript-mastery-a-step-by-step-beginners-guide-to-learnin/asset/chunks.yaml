    # Chapter 3: Program Structure


    We will begin the expansion of the JavaScript programming language commands beyond
    sentence fragments and nouns.


    ## Expressions and statements


    A block of code that manufactures a value is called an expression. A single value
    is written precisely as `22`, or psychoanalysis is called an expression. An expression
    within a binary operator set to two expressions or within parentheses is an expression.
    An expression that can accommodate other expressions comparably how a human language
    translates. It enables us to develop expressions that narr arbitrarily complex
    computations. When an expression is comparable to a sentence fragment, the JavaScript
    statement will complete the sentence. A list of statements is called a program,
    and the most accessible type of statement is a line of code with a semicolon ending.


    For instance:


    ```javascript

    1;

    !false;

    ```


    With this function, a statement can stand independently, and it can add a feature
    that changes colors occasionally to screen or modify the inner state of the machine
    influencing the following statements after it.


    ## Bindings


    JavaScript uses a binding of variables to hold values, for instance:


    ```javascript

    let money = 5 * 5;

    ```


    `let` is the keyword A statement, and it means that the sentence will specify
    a binding together with the binding name and value can be attached using `=` operator
    and an expression. Use a defined binding as an expression, an expression containing
    the binding value. Here is an example below:


    ```javascript

    let ten = 10;

    console.log(ten * Aten);

    // → 100

    ```


    The `=` operator is used on existing bindings to remove the binding from a set
    value and point them to a new one.


    ```javascript

    let mood = "light";

    console.log(mood);

    // → light

    ```


    ```javascript

    mood = "dark";

    console.log(mood);

    // → dark

    ```


    Defining a binding without assigning a value will result in nothing to hold. Therefore,
    asking for the value of a binding produce `undefined` value. You can define multiple
    binding by a single statement divided by commas.


    ```javascript

    let one = 1, two = 2;

    console.log(one + two);

    // → 3

    ```


    Use `var` and `const` words to develop bindings familiarly:


    ```javascript

    var name = "Ayad";

    const greeting = "Hello";

    console.log(greeting + name);

    // → Hello Ayad

    ```


    The word `const` means constant. It describes a absolute binding, which points
    to its set value for its lifetime. These words are often used to declare a name
    to a value to enable easy reference later on.

