    \n```javascript\nconst {formatDate} = require(\"./format-date\");\n\nconsole.log(formatDate(new\
    \ Date(2017, 9, 13), \"dddd\"));\n// → Friday 13th\n```\n\n我们可以以最极简的形式定义 `require`：\n\
    \n```javascript\nrequire.cache = Object.create(null);\n\nfunction require(name)\
