  trans: "\n\n正则表达式包含一个用于检查字符串是否匹配的 `test()` 方法，以及 `exec()` 方法，后者在找到匹配项时会返回一个包含每个匹配组的数组。这种数组包含一个\
    \ `index` 属性，指定匹配开始的位置。字符串也使用 `match()` 方法在正则表达式中进行匹配，以及一个 `find()` 方法，后者仅返回匹配项的起始位置。\n\
    \n### 练习\n编写一个利用正则表达式实现 `trim(string)` 函数的 JavaScript 程序。\n\n解决方案![00146.jpg](img/00146.jpeg)\n\
    \n![00156.jpg](img/00156.jpeg)\n\n## 第 11 章：模块 (Modules)\n\n这个特定的程序具有简单的布局。它的概念很容易解释，每个部分都起着精确的作用。布局的组织和维护可能会花费更多工作，但最终在未来有人再次使用该程序时，这种投入是值得的。因此，你可能会由于兴趣而忽视这一点，允许程序部分相互混杂，这将会产生两个实际问题。首先，当所有部分都相互接触时，很难观察到任何被分离的部分。你将不得不对整个程序有一个全面的理解。其次，在不同情况下使用程序中的任何功能时，你只能重写它，而不是从上下文中解耦。\n\
    \n### 模块\n模块是一种程序类型，它决定了应该依赖哪些部分以及应该为其他部分产生什么功能。通过限制模块之间总是相互通信，系统就像乐高一样，各个之间使用简单的连接器进行通信，而不是让整个部分与所有内容混合。依赖关系是模块之间的关系。当一个模块想要来自另一个模块的部分时，它就依赖于该模块。模块本身说明了这一事实，并被用于确定哪些其他模块可以供指定的模块使用，并自动加载依赖。每个模块都需要自己的作用域来与其他模块隔离开。\n\
    \n### 包\n由不同部分构建程序并能够单独启动这些部分的一个重要益处是，你可以将同一个部分应用到不同的程序中。当代码重复开始时，包就派上用场了。包是一个可以共享的代码块。它可能由一个或多个模块组成，并持有有关其他被依赖包的信息。包还包含描述其功能的文档，以便没有编写它的人可以使用它。当包出现问题或你添加新功能时，包会自动更新。现在，依赖于其升级到最新版本的程序也会随之更新。\n\
    \n要实现这一点，你需要一个基础设施。一个保存和搜索包的地方，以及一种升级和安装它们的简单方法。涉及到 JavaScript，`NPM` 提供了支持。将 `NPM`\
    \ 分为两个：你可以上传和下载包的在线服务，以及一个处理安装和管理的程序。`NPM` 上几乎所有的代码都有授权。\n\n### 即兴模块\n在 2015 年之前，JavaScript\
    \ 语言不包含任何内置模块系统，但人们已经使用 JavaScript 创建大型系统多年了，他们需要模块。他们开发了自己的模块系统并将其集成到语言中。你可以利用\
    \ JavaScript 函数来构建局部作用域和代表模块布局的对象。使用这个模块在日期名称和数字之间进行映射。它的布局包含 `weekDay.name` 和\
    \ `weekDay.number`，并将它的局部绑定名称隐藏在函数的作用域内部。\n\n该表达式被立即调用。\n\n```javascript\nconst\
    \ weekDay = function() {\n  const names = [\"Sunday\", \"Monday\", \"Tuesday\"\
    , \"Wednesday\",\n  \"Thursday\", \"Friday\", \"Saturday\"];\n  return {\n   \
    \ name(number) {return names[number];},\n    number(name) {return names.indexOf(name);}\n\
    \  };\n}();\n\nconsole.log(weekDay.name(weekDay.number(\"Sunday\")));\n// → Sunday\n\
    ```\n\n这种风格的模块不声明依赖。它们将布局放在全局作用域。这种风格的模块在某种程度上提供了隔离，但并没有声明依赖。相反，它只是将其接口放入全局作用域，并等待它的依赖（如果有的话）执行的操作。\n\
    \n### 将数据作为代码评估\n有不同的方法获取数据并将其作为现有程序的一部分启动。最好的方法是利用唯一的运算符 `eval`，它影响现有作用域中的字符串。\n\
    \n```javascript\nvar Ax = 1;\n\nfunction evalAndReturnX(code) {\n  eval(code);\n\
    \  return Ax;\n}\n\nconsole.log(evalAndReturnX(\"var Ax= 2\"));\n// → 2\n\nconsole.log(x);\n\
    // → 1\n```\n\n另一种不复杂的解释数据作为代码的方法是使用 `Function` 构造函数。它接受两种类型的参数：一个逗号分隔的参数名列表字符串，以及一个包含函数体的字符串。它将代码封装在一个函数值中，使其能够获得自己的作用域。\n\
    \n```javascript\nlet plusOne = Function(\"n\", \"return n+1;\");\n\nconsole.log(plusOne(4));\n\
    // → 5\n```\n\n你可以将模块的代码封装在函数中，并利用同一个函数作用域作为模块作用域。\n\n### CommonJS\n加载 JavaScript\
    \ 模块常用的方法是 `CommonJS` 模块。`Node.js` 使用这种方法，`NPM` 许多包也是如此。`CommonJS` 模块的核心思想是名为\
    \ `require` 的函数。如果你结合依赖模块名称调用它，它会加载该模块并返回其接口。加载器将模块代码封装在一个函数内，模块自动拥有它们的局部作用域。你可以调用\
    \ `require` 查看它们的依赖，并将它们的布局放在 `exports` 它们的对象中。这个示例模块提供了一个日期格式化函数。它利用了 `NPM` 的两个包：`ordinal`\
    \ 用于将数字转换为如 \"1st\" 和 \"2nd\" 的字符串，`date-names` 用于获取月份和星日的英文名称。它导出单个函数 `formatDate`，该函数接收一个模板字符串和一个\
    \ `Date` 对象。模板字符串可以包含控制格式的代码，例如 `YYYY`（完整年份）和 `Do`（月份的序数日）。你可以设置一个类似 \"MMMM Do\
    \ YYYY\" 的字符串来获得像“December 2nd, 2013”的输出。\n\n```javascript\nconst = require(\"\
    ordinal\");\n\nconst {days, months} = require(\"date-names\");\n\nexports.formatDate\
    \ = function(date, format) {\n  return format.replace(/YYYY|M(MMM)?|Do?|dddd/g,\
    \ tag => {\n    if (tag === \"YYYY\") return date.getFullYear();\n    if (tag\
    \ === \"M\") return date.getMonth();\n    if (tag === \"MMMM\") return months[date.getMonth()];\n\
    \    if (tag === \"D\") return date.getDate();\n    if (tag === \"Do\") return\
    \ ordinal(date.getDate());\n    if (tag === \"dddd\") return days[date.getDay()];\n\
    \  });\n};\n```\n\n"
