  trans: "\n\n在某些情况下，当你想让脚本在任何特殊事件上运行（例如点击按钮时的操作）时，你可以像下面这样将脚本放置在 `head` 部分：\n\n```html\n\
    <html>\n<head>\n<script type=\"text/JavaScript\">\n<!--\nfunction sayHi() {\n\
    \  alert(\"Hello World\")\n}\n//-->\n</script>\n</head>\n<body>\n  点击此处获取结果\n\
    \  <input type=\"button\" onclick=\"sayHi()\" value=\"Say Hi\" />\n</body>\n</html>\n\
    ```\n\n### 在 `<body>...</</body>` 区域中使用 JavaScript\n\n有时，你希望脚本立即运行并在内容页面上创建一个脚本，将脚本插入到\
    \ `<body>` 区域内。代码应该像这样：\n\n```html\n<html>\n<head>\n</head>\n<body>\n<script type=\"\
    text/JavaScript\">\n<!--\ndocument.write(\"Hello World\")\n//-->\n</script>\n\
    <p>这是一个网页正文内容</p>\n</body>\n</html>\n```\n\n### 在 `<head>` 和 `<body>` 区域中使用 JavaScript\n\
    \n像下面所示，将你的 JavaScript 代码插入到 `<head>` 和 `<body>` 区域：\n\n```html\n<html>\n<head>\n\
    <script type=\"text/JavaScript\">\n<!--\nfunction sayHi() {\n  alert(\"Hello World\"\
    )\n}\n//-->\n</script>\n</head>\n<body>\n<script type=\"text/JavaScript\">\n<!--\n\
    document.write(\"Hello World\")\n//-->\n</script>\n<input type=\"button\" onclick=\"\
    sayHi()\" value=\"Say Hi\" />\n</body>\n</html>\n```\n\n### 在外部文件中使用 JavaScript\n\
    \n为了避免重复相同的 JavaScript 代码，该语言允许你创建一个外部文件并存储 JavaScript 代码，然后将外部文件集成到 HTML 文件中。下面的示例了如何利用\
    \ `script` 标签和 `src` 属性在 HTML 代码中集成外部 JavaScript 文件。\n\n```html\n<html>\n<head>\n\
    <script type=\"text/javascript\" src=\"filename.js\"></script>\n</head>\n<body>\n\
    \  .......\n</body>\n</html>\n```\n\n外部文件源文件应以 `.js` 扩展名保存。\n\n#### 总结\n\n在第一章中，我们解释了\
    \ JavaScript 的起源以及将其放在内部和外部文件中。我们讨论了使用 JavaScript 构建交互式 Web 应用程序，以便在无需每个操作都重新加载页面的情况下执行适当的操作。\n\
    \n#### 练习\n\n如何在 HTML 文档中将 JavaScript 代码插入到 head、body 并包含外部文件脚本？\n\n#### 答案\n\n\
    head 部分脚本为 `<head></head>`。\nbody 部分脚本为 `<body></body>`。\nbody 内部的脚本为 `<body></body>`\
    \ 和 `<head></head>`。\n在 `<head>...</head>` 中包含外部文件脚本使用 `script` 标签。\n\n---\n\n\
    ## 第 2 章：值、类型和运算符\n\n在计算机世界中存在数据。你可以创建新数据、读取数据和更改数据，这些数据都存储为一系列连续位（bits）的形式。将位定义为代表强或弱信号、以及计算机内部高或低电荷的\
    \ 0 和 1。所有数据和信息片段都被描述为 0 和 1 的序列，并用位表示。\n\n### 值\n\n深呼吸，想象一片比特位的海洋。最新的 PC 数据存储中包含超过\
    \ 300 亿个位。我们使用位来创建值。计算机能够正常运行是因为每个位信息都被拆分成了值。每个值都由一个影响其角色的类型组成，值可以是数字、文本或函数等。要生成一个值，你需要调用它的名称，它会从存储的地方出现。\n\
    \n### 算术\n\n算术是处理数字的主要方式。多个数字的乘、加、减以产生另一个数字称为算术运算。这是它们在 JavaScript 中样子的示例：\n\n\
    ```\n100 + 4 * 11\n```\n\n`+` 和 `*` 符号被称为运算符，第一个表示加法而另一个表示乘法。插入两个值之间的运算符将产生另一个值。`-`\
    \ 运算符用于减法，`/` 运算符用于除法。如果运算符在没有括号的情况下一起出现，运算符的优先级决定它们的应用方式。如果几个具有相同优先级的运算符相邻显示，例如\
    \ `1-2+1`，它们从左到右应用：`(1 - 2) + 1`。\n\n### 特殊数字\n\nJavaScript 包含三个独特的值，它们的行为不像数字但被视为数字。`Infinity`\
    \ 和 `-Infinity` 是前两个，表示正无穷和负无穷，最后一个值是 `NaN`。`NaN` 表示“不是一个数字”（not a number），尽管它是一个\
    \ Number 类型的值。\n\n### 字符串\n\n字符串是数字的序列。字符串是下一个数据类型，它们代表文本。字符串将其内容限制在引号中。\n\n```\n\
    `沿着走道路径.`\n\"在屋顶上。\"\n'我在家里。'\n```\n\n使用不同类型的引号（如双引号、单引号或反引号）来标记字符串。引号必须匹配至关重要。引号内的元素由\
    \ JavaScript 创建一个字符串值。JavaScript 使用 Unicode 标准为每个需要的字符分配数字，包括阿拉伯语、亚美尼亚语、日语等。你不能对字符串进行减法、乘法或除法，但你可以使用\
    \ `+` 运算符，它不会相加而是将两个字符串拼接。拼接意味着将字符串粘在一起。\n\n### 一元运算符\n\n符号并不代表所有的运算符。你可以用单词写某些运算符。一个清晰的例子是一种运算符，这种运算符根据其所附值的\
    \ `typeof` 名称来创建一个字符串值。\n\n```\nconsole.log(typeof 4.5)\n// → A number\n\nconsole.log(typeof\
    \ \"x\")\n// → A string\n```\n\n第二个显示的运算符被称为二进制运算符，因为它们使用两个值，而使用一个值的运算符是一元运算符。\n\
    \n```\nconsole.log(-(10 - 2))\n// → -8\n```\n\n### 布尔值\n\n布尔是一种仅在两种可能性之间区别的值，例如“开启”和“关闭”等。布尔只包含真（true）和假（false）。\n\
    \n### 比较\n\n比较是创建布尔值的方法：\n\n```\nconsole.log(3 > 2)\n// → true\n\nconsole.log(3\
    \ < 2)\n// → false\n```\n\n`>` 和 `<` 字符分别代表“大于”和“小于”的符号。你可以在布尔值中使用二进制运算符来确定包含的值是真还是假。\n\
    \n你可以以相同的方式比较字符串。\n\n```\nconsole.log(\"Aardvark\" < \"Zoroaster\")\n// → true\n\
    ```\n\n你可以按照字母顺序指示字符串，大写字母通常“小于”小写字母，所以 \"Z\" < \"a\"，而且排序中也存在非字母字符。当 JavaScript\
    \ 想要比较字符串时，它从左到右识别字符，逐个区分 Unicode 代码。\n\n以下是其他相关的运算符 `<=`, `>=`, `==` 和 `!=`。\n\
    \n```\nconsole.log(\"Itchy\" != \"Scratchy\")\n// → true\n\nconsole.log(\"Apple\"\
    \ == \"Orange\")\n// → false\n```\n\n在 JavaScript 中，只有一个值不等于它自己，即 `NaN`（“不是数字”）。\n\
    \n```\nconsole.log(NaN == NaN)\n// → false\n```\n\n### 逻辑运算符\n\n"
