  trans: "\n\n如果你想处理大量的数字数据，你必须在机器内存中表示这些数字数据。例如，你需要表示一组类似于 `2`、`3`、`5`、`7` 和 `11`\
    \ 的数字。现在让我们充分利用字符串，因为字符串可以包含大量数据。我们将使用 `2`、`3`、`5`、`7`、`11` 作为表示。JavaScript 语言提供了一种用于存储值序列的独特类型，称为\
    \ `array`。我们将 `array` 写为方括号内的值列表 `list`，并用逗号分隔。\n\n```javascript\nlet listOfNumbers\
    \ = [2, 3, 5, 7, 11];\n\nconsole.log(listOfNumbers[2]);\n\n// → 5\n\nconsole.log(listOfNumbers[0]);\n\
    \n// → 2\n\nconsole.log(listOfNumbers[2] - 1]);\n\n// → 3\n```\n\n用于获取 `array`\
    \ 内部元素的符号也使用了方括号。一对完整的方括号紧跟在一个包含另一个表达式的表达式之后。当你开始数 `array` 中的元素个数时，从 0 开始而不是 1。因此，第一个元素被视为\
    \ `listOfNumbers[0]`。\n\n### 属性\n\n之前的章节包含过如 `myString` 的表达式。`length`（计算字符串长度）和\
    \ `Math.max`（最大值函数）。这些是可以用来访问属性属性的属性。几乎所有的 JavaScript 值都包含属性。极少数不包含属性的值是 `null`\
    \ 和 `undefined`。如果你对非值访问属性，结果将是一个错误。\n\n```javascript\nnull.length;\n\n// → TypeError:\
    \ null has no properties\n```\n\n在 JavaScript 中，评估属性的两种主要方法是使用点号（.）和方括号。`value.x`\
    \ 和 `value[x]` 可以求值 `value` 上的属性，但并不特定是同一个属性。你使用 `x` 的方式与使用点号的方式不同。\n\n如果你想使用点号，你在点号后输入的文本是属性的名称。如果你打算使用方括号，则方括号内的表达式会被访问以获取属性名。`value.x`\
    \ 交付的是 `value` 中名为“x”的属性，而 `value[x]` 则访问表达式 `x` 并利用其结果，将其转换为字符串作为属性名。如果你想要获取的属性名为\
    \ `color`，你应该输入 `value.color`。你可以从绑定 `i` 调用的值中提取属性，输入 `value[i]`。属性的名称是字符串，但点表示法仅对有效的绑定名有效。因此，如果你想评估一个名为\
    \ `2` 或 `John Doe` 的属性，请使用方括号：`value[2]` 或 `value[\"John Doe\"]`。\n\n`array` 内的元素存储为\
    \ `array` 的属性，这些属性使用数字作为属性名。数组的 `length` 属性决定它包含多少项。该属性的名称是一个有效的绑定名。输入 `array.length`\
    \ 来确定 `array` 的长度，这比输入 `array[\"length\"]` 要简单得多。\n\n### 方法\n\n`string` 和 `array`\
    \ 对象包含了几个存储函数值的属性。\n\n```javascript\nlet doh = \"Doh\";\n\nconsole.log(typeof\
    \ doh.toUpperCase);\n\n// → function\n\nconsole.log(doh.toUpperCase());\n\n//\
    \ → DOH\n```\n\n每个字符串都包含一个 `toUpperCase` 属性。当你调用此属性时，它会返回字符串的副本，其中包含的所有字母都转换为大写。尽管\
    \ `toUpperCase` 没有通过参数，但该函数可以求值字符串 \"Doh\"，它是我们上面调用的值的属性。由函数组成的属性被称为方法。下面的示例说明了两个可以影响数组的方法。\n\
    \n```javascript\nlet sequence = [1, 2, 3];\n\nsequence.push(4);\n\nsequence.push(5);\n\
    \nconsole.log(sequence);\n\n// → [1, 2, 3, 4, 5]\n\nconsole.log(sequence.pop());\n\
    \n// → 5\n\nconsole.log(sequence);\n\n// → [1, 2, 3, 4]\n```\n\n`push` 方法用于将值附加到\
    \ `array` 的末尾，而 `pop` 方法执行完全相反的操作。它移除 `array` 内的最后一个值并将其返回。这些是栈操作（stack operations）的代际术语。栈是一种数据布局，允许用户将值推入并以相反的方向将其弹出，以便新添加的值最先被移除。\n\
    \n### 对象\n\n你可以将一组日志记录表示为 `array`，尽管每个字符串条目都需要保存活动列表，以及一个指定 Jacques 是否变成了松鼠的布尔值。我们将这些分组为一个值，并将分组后的值放置在日志记录的\
    \ `array` 中。属性的任意集合是 `object` 类型的值。我们将使用大括号作为表达式来开发一个对象。\n\n```javascript\nlet\
    \ day1 = {\n  squirrel: false,\n  events: [\"work\", \"touched tree\", \"pizza\"\
    , \"running\"]\n};\n\nconsole.log(day1.squirrel);\n\n// → false\n\nconsole.log(day1.wolf);\n\
    \n// → undefined\n\nday1.wolf = false;\n\nconsole.log(day1.wolf);\n\n// → false\n\
    ```\n\n大括号包含由逗号分隔的属性列表。每个属性都包含一个名称、一个冒号和一个冒号。当你跨行编写对象时，确保你的缩进是良好的，因为它可以提高可读性。属性名可以是有效的数字。\n\
    \n```javascript\nlet descriptions = {\n  work: \"Went to a,\"\n  \"touched tree\"\
    : \"Touched tree.\"\n};\n```\n\n你可以在 JavaScript 中两种方式使用大括号。它可以用于语句的开头，也可以通过 `=`\
    \ 运算符为属性指定值。它替换属性值，如果它存在，则会创建一个新的。`delete` 运算符是一个一元运算符，用于删除对象的属性名。\n\n```javascript\n\
    let anObject = {left: 1, right: 2};\n\nconsole.log(anObject.left);\n\n// → 1\n\
    \ndelete anObject.left;\n\nconsole.log(anObject.left);\n\n// → undefined\n\nconsole.log(\"\
    left\" in anObject);\n\n// → false\n\nconsole.log(\"right\" in anObject);\n\n\
    // → true\n```\n\n二进制操作 `in` 判断对象或字符串是否包含某个属性。将属性指定 `undefined` 与删除它的主要区别在于，对象不再拥有该属性，因此返回\
    \ `false`。确定对象中包含哪些属性并返回一个属性名称的字符串数组。\n\n```javascript\nconsole.log(Object.keys({x:\
    \ 0, y: 0, c: 2}));\n\n// → [\"x\", \"y\", \"c\"]\n```\n\n`Object.assign` 函数用于从一个对象复制属性到另一个对象。\n\
    \n```javascript\nlet objectA = {a: 1, b: 2};\n\nObject.assign(objectA, {b: 3,\
    \ c: 4});\n\nconsole.log(objectA);\n\n// → {a: 1, b: 3, c: 4}\n```\n\n`array`\
    \ 是一种用于存储连续内容的独特对象。当你访问 `typeof []` 时，它提供 \"object\"。下面的示例代表 Jacques 存储为对象数组的日志。\n\
    \n```javascript\nlet journal = [\n  {\n    events: [\"work\", \"touched tree\"\
    , \"pizza\",\n    \"running\", \"television\"],\n    squirrel: false\n  },\n \
    \ {\n    events: [\"work\", \"ice cream\", \"cauliflower\",\n    \"lasagna\",\
    \ \"touched tree\", \"brushed teeth\"],\n    squirrel: false\n  }\n];\n```\n\n"
- fmt: "\n```javascript\n{\n  events: [\"weekend\", \"cycling\", \"break\", \"peanuts\"\
    , \"beer\"],\n  squirrel: true,\n}\n/* Aand Aso Aon... A*/\n];\n```\n\n# Mutability\n\
    \nWe have discussed different values such as `Booleans`, `strings`, and `Numbers`\
    \ whose values are difficult to change, although they can be combined to acquire\
    \ new values from them. `Objects` are different from values, and it enables a\
    \ property changing; they can create a different content for a single object value\
    \ at different times.\n\nWhen there are two numbers, `120` and `120`, they are\
    \ considered the same, and there is a similarity between setting two references\
    \ to one object and possessing two separate objects containing the same properties.\
    \ Check the below code:\n\n```javascript\nlet object1 = {value: 10};\nlet object2\
    \ = object1;\nlet object3 = {value: 10};\n\nconsole.log(object1 == object2);\n\
    // → true\n\nconsole.log(object1 == object3);\n// → false\n\nobject1.value = 15;\n\
    \nconsole.log(object2.value);\n// → 15\n\nconsole.log(object3.value);\n// → 10\n\
    ```\n\nThe `object1` and `object2` bindings hold the same object, and that is\
    \ why altering `object1` one influences the value of `object2`. They are identical\
    \ by nature. The binding `object3` points to a separate object that consists of\
    \ similar properties as `object1` but has a different life. Bindings can be constant\
    \ or changeable, but it does not influence their values. A `const` binding an\
    \ object cannot be transformed and relentlessly pointing to the same object. It\
    \ is the object contents that that can be changed. \n\n```javascript\nconst score\
    \ = {visitors: 0, home: 0};\n// This is an okay\nscore.visitors = 1;\n// This\
    \ isn't allowed\nscore = {visitors: 1, home: 1};\n```\n\nWhen JavaScript’s `==`\
    \ operator is used to differentiate objects, it uses the identity to perform that\
    \ task. It will translate `true` if the objects contain the same value. Differentiating\
    \ several objects will return `false`, even if their properties are similar.\n\
    \n# The Lycanthrope's Log\n\nSo, you begin your JavaScript interpreter and creates\
    \ the environment you need to keep your journal.\n\n```javascript\nlet journal\
    \ = [];\nfunction addEntry(events, squirrel) {\n  journal.push({events, squirrel});\n\
    }\n```\n\nInstead of proclaiming properties such as `events`, it sets a property\
    \ name. So then, at 10 p.m. every evening or occasionally in the following morning,\
    \ after getting down from the top shelf of your bookcase, your daily records.\n\
    \n```javascript\naddEntry([\"work\", \"touched tree\", \"pizza\", \"running\"\
    , \"television\"], false);\naddEntry([\"work\", \"ice cream\", \"cauliflower\"\
    , \"lasagna\", \"touched tree\", \"brushed teeth\"], false);\naddEntry([\"weekend\"\
    , \"cycling\", \"break\", \"peanuts\", \"beer\"], true);\n```\n\nCorrelation is\
    \ an evaluation of vulnerability between analytical variables. They are known\
    \ as values that span from `-1` to `1`. An unrelated variable is called a zero-correlation.\
    \ A correlation of `1` signifies that the two are related. Negative means that\
    \ the variables are related perfectly but opposites to each other; one is `true`,\
    \ and the other is `false`. To calculate the evaluation of the correlation between\
    \ two `Boolean` values, utilize the phi coefficient `(φ)`. This formula input\
    \ is a frequency table holding a number of times it notices several mixtures of\
    \ the variables. The formula's output will be a number between `-1` and `1`. That\
    \ is the best definition of a correlation.\n\nLet us use the event `eating pizza`\
    \ as an example and insert it into a frequency table whereby every number signifies\
    \ the total of times, and we used the combination in our measurements. We name\
    \ the table `n`, and we calculate `φ` with the below formula:\n\n`φ = n11n00A\
    \ - n10n01 / sqrt(n1•n0•n•1n•0)` \n\nThe annotation `n01` signifies the number\
    \ of measurements where the first variable turns `false(0)`, and the second variable\
    \ becomes `true(1)`. The pizza table, `n01`, is `9`.\n\nThe value `n1•` indicates\
    \ the sum of all measurements where the first variable turns `true`, that is `5`\
    \ in the table example. As well as `n•0` suggests the quantity of the measurements\
    \ where the second variable becomes `false`.\n\nThe pizza table, the top of the\
    \ division line would be `1×76−4×9 = 40`, and the below apart would be the square\
    \ root of `5×85×10×80`, or `√340000`. The result will be `φ ≈ 0.069`, which is\
    \ tiny. Therefore, eating pizza had no impact on transformations.\n\n# Computing\
    \ Correlation\n\nJavaScript enables the representation of a two-by-two table with\
    \ four-element arrays `([76, 9, 4, 1])`. Other representations such as an array\
    \ holding two-two element `[[76, 9], [4, 1]]` or an object containing property\
    \ names such as `\"11\"` and `\"01\"`, and the flat array, which produces an expression\
    \ that access the chair short. We will explain the indices to the array as two-bit\
    \ binary numbers, where the most significant digit refers to the `squirrel` variable\
    \ while the least significant refers to the `event` table. For instance, the binary\
    \ number `10` refers to the `\"Jacques did turn into a squirrel\"` case but the\
    \ `events` didn’t appear. It occurred four times and binary is `2` in decimal,\
    \ the number is stored as an index `2` of the array. This function calculates\
    \ the `φ` coefficient from an array:\n\n```javascript\nfunction phi(chair) {\n\
    \  return (chair[3] * chair[0] - chair[2] * chair[1]) /\n  Math.sqrt((chair[2]\
    \ + chair[3]) *\n  (chair[0] + chair[1]) *\n  (chair[1] + chair[3]) *\n  (chair[0]\
    \ + chair[2]));\n}\n\nconsole.log(phi([76, 9, 4, 1]));\n// → 0.068599434\n```\n\
    \nThe table requires two fields to acquire fields alike `n1•` because the total\
    \ number of rows and columns are stored indirectly. If you want to extract a two-by-two\
    \ table for a particular event, you must loop across all entries and calculate\
    \ the number of times event happened.\n\n```javascript\nfunction tableFor(event,\
    \ journal) {\n  let table = [0, 0, 0, 0];\n  for (let i = 0; i < journal.length;\
    \ i++) {\n    let entry = journal[i];\n    let index = 0;\n    if (entry.events.includes(event))\
    \ index += 1;\n    if (entry.squirrel) index += 2;\n    table[index] += 1;\n \
    \ }\n  return table;\n}\n\nconsole.log(tableFor(\"pizza\", journal));\n// → [76,\
    \ 9, 4, 1]\n```\n\n# Array Loops\n\nThe `tableFor` function contains a loop like\
    \ this:\n\n```javascript\nfor (let entry of journal) {\n  console.log(`${entry.events.length}\
    \ events.`);\n}\n```\n\nWith a type of loop, the loop continues across the elements\
    \ specified after `of`. This loop is used in modern JavaScript.\n"
