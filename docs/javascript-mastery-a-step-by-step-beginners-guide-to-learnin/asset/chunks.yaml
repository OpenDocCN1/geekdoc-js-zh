  trans: "\n\n```javascript\ndone();\n\n});\n```\n\n`defineRequestType` 函数描述了一种新类型的\
    \ `request`。示例添加了对“note”请求的支持，该请求向指定的 nest（嵌套节点）发送笔记。我们的实现调用了 `console.log`，以便我们可以检查请求是否到达。Nest\
    \ 包含一个 `name` 属性，该属性持有其 `name`。\n\n传递给 `handler` 的第四个参数 `done` 是回调函数，它在任务完成时被调用。如果你将\
    \ `handler` 的返回值作为 `response` 的值，这意味着 `request.handler` 无法无法执行异步操作。执行异步操作的函数会在任务完成之前返回，并准备好一个回调函数，在任务结束时调用。在某种程度上，异步性是传染的。一个调用了异步执行函数的函数本身也是异步的，它必须利用回调来传递其结果。调用回调容易出错的，而且比简单地返回一个值要复杂得多。\n\
    \n# Promises\n\n当方法中存在值时，处理抽象方法会变得更简单。在异步操作的情况下，与其为函数在未来某个时间点被调用做准备工作，不如返回一个代表未来事件的对象。Promise（承诺）是一种可以在某个点完成并提供值的异步操作。当它的值可用时，它可以通知任何感兴趣的人。\n\
    \n构建 promise 最简单的方法是调用 `Promise.resolve()`。此函数保证你设置的值被封装在了一个 promise 中。如果它已经是一个\
    \ promise，则直接返回。否则，将立即创建一个新的 promise，并将你的值作为结果。\n\n```javascript\nlet fifteen\
    \ = Promise.resolve(15);\n\nfifteen.then(value => console.log(`Got ${value}`));\n\
    \n// → Got 15\n```\n\n为了实现 promise 的结果，请利用它的成员方法 `.then()`。它指示了一个当 promise 解析并提供值时要执行的回调函数。你可以为单个\
    \ promise 挂载多个回调函数，所有的回调都会被执行，即使它们是在 promise 已完成后才挂载的。`then` 方法还会返回另一个 promise，该\
    \ promise 将解析为 `handler` 函数返回的值。将 promise 视为一种将值转换为异步现实的设备是非常重要的。被承诺的值是一个在未来某个点可能存在或可能显示的值。以\
    \ promise 术语描述的计算是在是在在封装的值上运行的，并在值可用时异步执行。\n\n要构建一个 promise，请使用 `Promise` 作为构造函数。它包含一种特殊的布局，构造函数期望一个函数作为参数，它会立即调用该函数并传递一个可以用于解决\
    \ promise 的函数。这就是为读取存储函数构建基于 promise 的布局：\n\n```javascript\nfunction storage(nest,\
    \ name) {\n  return new Promise(resolve => {\n    nest.readStorage(name, result\
    \ => resolve(result));\n  });\n}\n\nstorage(bigOak, \"enemies\")\n  .then(value\
    \ => console.log(\"Got\", value));\n```\n\n这个异步函数返回了一个重要的值。\n\n# Failure\n\nJavaScript\
    \ 计算可能会通过输出异常而失败。网络请求可能会失败，或者某些异步代码计算产生异常。异步编程回调风格最常见的问题是，它很难确保失败能正确地暴露给回调函数。\n\
    \n一种通用方法是：回调的第一个参数用于指定失败的操作，第二个参数是操作完成时提供的值。此类回调函数总是检查它们是否获取了异常，并确保任何出现的问题（包括它们调用的函数输出的异常）都传递给正确的函数。它们可以在成功时执行减少，在失败时执行拒绝。\n\
    \n`call` 的 reduce 仅在任务成功完成时处理处理器，并自动在返回的新 promise 上执行拒绝。当 `handler` 输出异常时，这会自动触发其最近调用提供的\
    \ promise 的拒绝。\n\n当异步操作链中的某个元素失败时，整个链的输出都会拒绝，没有任何成功处理器会调用失败点之后的代码。就像解决 promise\
    \ 会产生一个值，拒绝（reject）也会提供一个值，通常被称为拒绝原因（rejection reason）。如果 `handler` 函数中的异常创建了拒绝，请使用\
    \ `exception` 值作为原因。\n\n相应的，当 `handler` 返回一个被拒绝的 promise 时，该拒绝将进入下一个 promise。有一个\
    \ `reject()` 函数，它会产生一个新的、立即被拒绝的 promise。如果 `catch` 处理器输了错误，新的 promise 同样会被拒绝。简而言之，`then`\
    \ 也接受一个拒绝 `handler` 作为第二个参数，因此你应该在单个方法调用中安装两种类型的处理器。\n\n`Promise` 构造函数接受第二个参数（与\
    \ `resolve` 函数一起），它可以使用它来拒绝新的 promise。通过调用 `then` 开发的 `Promise` 值链被视为流水线，异步值或失败在其中移动。由于这些链链是通过注册处理器构建的，因此每个链接都由一个成功\
    \ `handler` 或与其相关的拒绝 `handler` 组成。与输出类型不匹配的处理器会被丢弃。但匹配的处理器会被调用，它们的输出决定了下一个值的类型：当返回非\
    \ promise 值时是成功，当输出异常时是拒绝，当返回其中之一时是该 promise 的结果。\n\n```javascript\nnew Promise((_,\
    \ reject) => reject(new Error(\"Fail\")))\n  .then(value => console.log(\"Handler\
    \ A1\"))\n  .catch(reason => {\n    console.log(\"Caught Failure \" + reason);\n\
    \    return \"nothing\";\n  })\n  .then(value => console.log(\"Handler A2\", value));\n\
    \n// → Handler A1 (因为失败了未被调用)\n// → Caught Failure Error: Fail\n// → Handler A2\
    \ nothing\n```\n\n"
- fmt: "\nPeriodically, there's always a little light ahead for the across’ mirror\
    \ systems to convey a signal is obstructing the way of the the signal. It is available\
    \ for a signal to be transferred but got or declined. Often, a transmission failures\
    \ are unexpected accidents, like a car’s aheadlight obstructing the light signals,\
    \ and resending the request could make it succeed. So, let’s create our request\
    \ function, and consequently retry the sending of the request one more time before\
    \ it stops. And, since we have established that promises are good, we’ll also\
    \ ensure our request function sends back a promise. When it comes to what they\
    \ can indicate, promises and callbacks are equal. A callback-based functions are\
    \ enclosed to uncover a promise-based layout and vice versa. Even when a request\
    \ and its reply convey successfully, the reply could specify a failure, for instance,\
    \ if the request tries to utilize a request type that has not been described or\
    \ the handler output an error. To aid this, send and define `defineRequestType`\
    \ to follow the convention declared earlier, where the first argument sent to\
    \ callbacks is the reason for failure if any, and the second is the definite result.\
    \ They are interpreted to promise resolution and rejection by our wrapper.\n\n\
    ```javascript\nclass Timeout extends Error{}\n\nfunction request(nest, target,\
    \ type, content) {\n  return new Promise((resolve, reject) => {\n    let done\
    \ = false;\n    function attempt(n) {\n      nest.send(target, type, content,\
    \ (failed, value) => {\n        done = true;\n        if (failed) reject(failed);\n\
    \        else resolve(value);\n      });\n      setTimeout(() => {\n        if\
    \ (done) return;\n        else if (n < 3) attempt(n + 1);\n        else reject(new\
    \ Timeout(\"Timed Out\"));\n      }, 250);\n    }\n    attempt(1);\n  });\n}\n\
    ```\n\nBecause promises can be accepted or declined once only, it will work. The\
    \ first time `resolve` or `reject` call decides the result of the promise, and\
    \ any other calls are disregarded. To create an asynchronous loop, for the retries,\
    \ use a recursive function, an efficient loop does not allow us to stop and wait\
    \ for an asynchronous action. The `attempt` function creates a single attempt\
    \ to transfer a request. It also specifies a timeout that, if there is a comeback\
    \ response after 250 milliseconds, begins the next attempt or, if it is the fourth\
    \ try, declines the promise with an instance of `Timeout` being the reason. Retrying\
    \ each quarter-second and stops when there is no response after a second is certainly\
    \ arbitrary if the request shows up, but the handler takes longer for requests\
    \ to transfer several times. Create your handlers with that problem in mind, and\
    \ coupled messages are not harmful. To segregate ourselves from callbacks totally,\
    \ define a cover for `defineRequestType` that enables the handler function to\
    \ send back a promise or simple value and wires that do the callback for us. \n\
    \n```javascript\nfunction requestType(name, handler) {\n  defineRequestType(name,\
    \ (nest, content, source, callback) => {\n    try {\n      Promise.resolve(handler(nest,\
    \ content, source))\n        .then(response => callback(null, response),\n   \
    \     failure => callback(failure));\n    } catch (exception) {\n      callback(exception);\n\
    \    }\n  });\n}\n```\n\n`Promise.resolve` is used to transform the returned value\
    \ by the `handler` to a promise if it is not ready.\n\n### Collections of Promises\n\
    \nEvery nest computer stores an array of other nests inside transmission distance\
    \ in its neighbor’s property. To examine which is reachable, write a function\
    \ that tries to transfer a \"ping\" request (request that demands a response)\
    \ to all of them and check for which ones come back. If you're working with a\
    \ group of promises running at once, the `Promise.all` function is very important.\
    \ It sends back a promise that holds on for all of the promises in the array to\
    \ reconcile and then settle to an array of the values these promises provided.\
    \ If any promise is declined, the result of `Promise.all` is also declined.\n\n\
    ```javascript\nrequestType(\"ping\", () => \"pong\");\n\nfunction availableNeighbors(nest)\
    \ {\n  let requests = nest.neighbors.map(neighbor => {\n    return request(nest,\
    \ neighbor, \"ping\")\n      .then(() => true, () => false);\n  });\n  return\
    \ Promise.all(requests).then(result => {\n    return nest.neighbors.filter((_,\
    \ i) => result[i]);\n  });\n}\n```\n\n### Network Flooding\n\nNests can communicate\
    \ with their neighbors only and that greatly affects the significance of this\
    \ network. To broadcast information to the entire network, a solution is to create\
    \ a type of request that is sent automatically to neighbors. These neighbors then\
    \ send it to their neighbors until the entire network has collected the message.\n\
    \n```javascript\nimport {everywhere} from \"./a/crow-tech\";\n\neverywhere(nest\
    \ => {\n  nest.state.gossip = [];\n});\n\nfunction sendGossip(nest, message, exceptFor\
    \ = null) {\n  nest.state.gossip.push(message);\n  for (let neighbor of nest.neighbors)\
    \ {\n    if (neighbor == exceptFor) continue;\n    request(nest, neighbor, \"\
    gossip\", message);\n  }\n}\n\nrequestType(\"gossip\", (nest, message, source)\
    \ => {\n  if (nest.state.gossip.include(message)) return;\n  console.log(`${nest.name}\
    \ receive Gossip '${message}' from ${source}`);\n  sendGossip(nest, message, source);\n\
    });\n```\n\nYou can avoid transferring the similar message across the network\
    \ forever, every nest saves an array of gossip strings that it has seen. To describe\
    \ this array, use the `everywhere` function that runs code on each nest to attach\
    \ a property to the nest’s `state` object.\n\n### Message Routing\n\nIf a set\
    \ node wants to communicate with a single other node. The best approach is to\
    \ build a path for messages to jump from node to node until they get to their\
    \ destination. You need to understand the interface of the network. To send a\
    \ request to a nest at distance, it is important to know which neighboring nest\
    \ can get the job done. Every nest knows about its direct neighbors only, it cannot\
    \ compute a route, it lacks the information. You must understand how to spread\
    \ the information about these connections to every nest in enables it to transform\
    \ with time, when new nests are created. Now you can use flooding, but instead\
    \ of checking whether a message has been collected, check if the new set of neighbors\
    \ for a given nest is similar to the current set.\n\n```javascript\nrequestType(\"\
    connections\", (nest, {name, neighbors}, source) => {\n  let connections = nest.state.connections;\n\
    \  if (JSON.stringify(connections.get(name)) == JSON.stringify(neighbors)) return;\n\
    \  connections.set(name, neighbors);\n  broadcastConnections(nest, name, source);\n\
    });\n\nfunction broadcastConnections(nest, name, exceptFor = null) {\n  for (let\
    \ neighbor of nest.neighbors) {\n    if (neighbor == exceptFor) continue;\n  \
    \  request(nest, neighbor, \"connections\", {\n      name,\n      neighbors: nest.state.connections.get(name)\n\
    \    });\n  }\n}\n\neverywhere(nest => {\n  nest.state.connections = new Map();\n\
    \  nest.state.connection.set(nest.name, nest.neighbors);\n  broadcastConnections(nest,\
    \ nest.names);\n});\n```\n"
