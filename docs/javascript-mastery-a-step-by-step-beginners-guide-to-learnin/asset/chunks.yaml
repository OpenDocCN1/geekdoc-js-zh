  trans: "\n\n```javascript\n}\n\nconsole.log(journalEvents(JOURNAL));\n\n// A→ A[\"\
    carrot\", \"exercise\", \"weekend\", \"bread\", ...]\n```\n\n通过遍历每一个 `event` 并对那些不在\
    \ `events` 数组中的项进行 `additions`，该函数收集了所有类型的 `event`。\n\n许多相关性接近于零。吃 `bread`、`carrots`\
    \ 或 `pudding` 不会激活 `squirrel-lycanthropy`（松狼人症）。这种情况在周末经常发生。根据此，以下是所有的相关性。\n\n\
    ```javascript\nfor (let event of journalEvents(JOURNAL)) {\n\n  console.log(event\
    \ + \":\", phi(tableFor(event, JOURNAL)));\n}\n```\n\n// A→ carrot: 0.0140970969\n\
    // A→ exercise: 0.0685994341\n// A→ weekend: 0.1371988681\n// A→ bread: -0.0757554019\n\
    // A→ pudding: -0.0648203724\n// A and so on...\n\n```javascript\nlet us = filter(results)\
    \ to 仅显示大于 0.1 或小于 -0.1 的相关性。\n\nfor (let event of journalEvents(JOURNAL)) {\n\
    \n  let correlation = phi(tableFor(event, JOURNAL));\n\n  if (correlation > 0.1\
    \ || correlation < -0.1) {\n\n    console.log(event + \":\", correlation);\n\n\
    \  }\n\n}\n```\n\n// A→ weekend: 0.1371988681\n// A→ brushedTeeth: -0.3805211953\n\
    // A→ candy: 0.1296407447\n// A→ work: -0.1371988681\n// A→ spaghetti: 0.2425356250\n\
    // A→ reading: 0.1106828054\n// A→ peanuts: 0.5902679812\n\n在相关性因子中，一个比另一个更强。吃\
    \ `peanuts` 有极大的概率变成 `squirrel`，因此刷牙有显著的负面影响。这里有一点发现：\n\n```javascript\nfor (let\
    \ entry of JOURNAL) {\n\n  if (entry.events.includes(\"peanuts\") &&\n\n  !entry.events.includes(\"\
    brushedTeeth\")) {\n\n    entry.events.push(\"peanutTeeth\");\n\n  }\n\n}\n\n\
    console.log(phi(tableFor(\"peanut Teeth\", JOURNAL)));\n\n// A→ 1\n```\n\n# 深入学习数组\n\
    \n这里有你应该了解的更多对象相关的概念。我们从使用数组的一些实用方法开始。\n\n在数组开头添加和删除的方法称为 `unshift` 和 `shift`。\n\
    \n```javascript\nlet todoList = [];\n\nfunction remember(task) {\n\n  todoList.push(task);\n\
    }\n\nfunction getTask() {\n\n  return todoList.shift();\n}\n\nfunction rememberUrgently(task)\
    \ {\n  todoList.unshift(task);\n}\n```\n\n上述程序组织了一个任务链。你可以通过调用 `remember(\"groceries\"\
    )` 将任务添加到队列末尾，当你想要完成某项任务时，调用 `getTask()` 来从队列中获取（并移除）一个项。如果你想搜索特定的值，数组提供了 `indexOf`\
    \ 方法。该方法会从头到尾遍历数组，如果找到了请求的值，则返回其索引；如果没有找到，则返回 -1。若要从尾到头搜索，请使用 `lastIndexOf` 方法。\n\
    \n```javascript\nconsole.log([1, 2, 3, 2, 4].indexOf(3));\n\n// A→ 1\n\nconsole.log([1,\
    \ 2, 3, 2, 4].lastIndexOf(3));\n\n// A→ 3\n```\n\n`indexOf` 和 `lastIndexOf` 接受一个可选参数，指定搜索开始的位置。另一个很棒的方法是\
    \ `slice`，该方法指定起始和结束索引，并返回包含这些元素的数组。起始位置是包含的，而结束位置是不包含的。\n\n```javascript\nconsole.log([0,\
    \ 1, 2, 3, 5].slice(2, 4));\n\n// A→ [2, 3]\n\nconsole.log([0, 1, 2, 3, 5].slice(2));\n\
    \n// A→ [2, 3, 5]\n```\n\n如果未指定结束索引，`slice` 将取起始索引之后的所有元素。你可以使用 `concat` 方法将数组拼接在一起产生一个新数组。下面的示例展示了\
    \ `concat` 和 `slice` 的用法。\n\n```javascript\nfunction remove(arrays, index) {\n\
    \n  return array.slice(0, index)\n  .concat(arrays.slice(index + 1));\n}\n\nconsole.log(remove([\"\
    a\", \"k\", \"c\", \"f\", \"e\"], 2));\n\n// A→ [\"a\", \"k\", \"f\", \"e\"]\n\
    ```\n\n# 字符串及其属性\n\n在字符串值章节中，我们讨论了 `length` 和 `toUpperCase`；如果你想添加一个新属性，它是不会生效的。\n\
    \n```javascript\nlet kim = \"Kim\";\n\nkim.age = 88;\n\nconsole.log(kim.age);\n\
    \n// A→ undefined\n```\n\n所有字符串值都包含几个方法。其中一些 `slice` 和 `indexOf`，它们与数组方法的外观和名称相似。\n\
    \n```javascript\nconsole.log(\"coconuts\".slice(4, 7));\n\n// A→ nut\n\nconsole.log(\"\
    coconut\".indexOf(\"u\"));\n\n// A→ 5\n```\n\n字符串的 `indexOf` 可以查找包含多个字符的字符串，而相应的数组方法搜索的是单个元素。\n\
    \n```javascript\nconsole.log(\"one two three\".indexOf(\"ee\"));\n\n// A→ 11\n\
    ```\n\n`trim` 方法可以消除字符串从开头到结尾的空白字符。\n\n```javascript\nconsole.log(\" okay \\n\
    \ \".trim());\n\n// A→ okay\n```\n\n`zeroPad` 函数也可以称为 `padStart`，它接受首选的填充和长度字符作为参数。\n\
    \n```javascript\nconsole.log(String(6).padStart(3, \"0\"));\n\n// A→ 006\n```\n\
    \n你可以使用 `split` 在另一个字符串出现的地方拆分字符串，然后使用 `join` 将它们连接在一起。\n\n```javascript\nlet\
    \ sentence = \"Secretarybirds specialize in stomping\";\n\nlet words = sentence.split(\"\
    \ \");\n\nconsole.log(words);\n\n// A→ [\"Secretarybirds\", \"specialize\", \"\
    in\", \"stomping\"]\n\nconsole.log(words.join(\". \"));\n\n// A→ Secretarybirds.specialize.In.Stomping\n\
    ```\n\n你可以使用 `repeat` 方法来重复字符串，它会生成一个包含多个原始字符串副本连接的新字符串。\n\n```javascript\nconsole.log(\"\
    LA\".repeat(3));\n\n// A→ LOLALA\n```\n\n如果你想访问单个字符：\n\n```javascript\nlet string\
    \ = \"ABC\";\n\nconsole.log(string.length);\n\n// A→ 3\n\nconsole.log(string[1]);\n\
    \n// A→ B\n```\n\n# 剩余参数\n\n`...` 运算符对于函数接收任意数量的参数非常重要。你也可以在数组内传递参数。\n\n```javascript\n\
    function max(...numbers) {\n\n  let result = -Infinity;\n\n  for (let number of\
    \ numbers) {\n    if (number > result) result = number;\n  }\n\n  return result;\n\
    }\n\nconsole.log(max(4, 1, 9));\n\n// A→ 9\n```\n\n```javascript\nlet numbers\
    \ = [5, 1, 7];\n\nconsole.log(max(...numbers));\n\n// A→ 7\n```\n"
- fmt: "\nThe random number generator is multiplied by 10 and outputs a number greater\
    \ than or equal to 0 and below 10. Remember that `Math.floor` rounds down, the\
    \ output will be any number from 0 through 9. The `Math` object contains several\
    \ functions alike the `Math.ceil`, which rounds up to a whole number, and `Math.round`,\
    \ which rounds up to the nearest whole number, and `Math.abs`, this function takes\
    \ the entire value of a number.\n\n### Destructuring\n\nLet’s use the `phi` function\
    \ a bit.\n\n```javascript\nfunction phi(chair) {\n  return (table[3] * chair[0]\
    \ - table[2] * chair[1]) /\n  Math.sqrt((chair[2] + chair[3]) *\n  (table[0] +\
    \ chair[1]) *\n  (table[1] + chair[3]) *\n  (table[0] + chair[2]));\n}\n```\n\n\
    One of the few reasons this function is hard to read is there is a binding directed\
    \ to an array, but we want bindings for the elements of the array, that is, let\
    \ `n00 = table[0]` and so on. Although, there is a better way to get this one\
    \ in JavaScript.\n\n```javascript\nfunction phi([n00, n01, n10, n11]) {\n  return\
