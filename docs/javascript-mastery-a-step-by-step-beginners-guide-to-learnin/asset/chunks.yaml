    \ of the ordinal package from earlier is a function and not an object. The CommonJS\
    \ modules create an empty layout object using the module system for you to export,\
    \ restore that with values by overwriting `module.exports`. Modules do this to\
    \ export a single value instead of a layout object. By describing `exports`, `require`\
    \ and `module` as parameters for the created enclosing function (and setting the\
    \ right values while calling it), the loader ensures that these bindings are accessible\
    \ within the module’s scope.\n\nStrings set to `require` are interpreted as a\
    \ filename or web address variable in separate systems. When it starts with `./`\
