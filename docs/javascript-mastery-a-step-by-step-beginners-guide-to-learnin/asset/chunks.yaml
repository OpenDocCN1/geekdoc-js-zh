  trans: "\n\n你可以使用此函数来搜索程序中的错误。这是通过反复运行该函数来实现的。计算机擅长重复性任务。这个过程被称为**自动化测试**（Automated\
    \ testing）。它涉及编写一个测试另一个程序的程序。这些测试会定期通过一组标记好的少量程序，以确定你代码的某些部分。例如，让我们为 `toUpperCase`\
    \ 方法创建一个测试集。以下是一个示例：\n\n```javascript\nfunction test(label, body) {\n  if (!body())\
    \ console.log(`Failed: ${label}`);\n}\n\ntest(\"convert Latin text to uppercase\"\
    , () => {\n  return \"hello\".toUpperCase() == \"HELLO\";\n});\n\ntest(\"convert\
    \ Greek text to uppercase\", () => {\n  return \"Χαίρετε\".toUpperCase() == \"\
    ΧΑΊΡΕΤΕ\";\n});\n\ntest(\"don't convert case-less characters\", () => {\n  return\
    \ \"ࢎ࠶߈off௷\".toUpperCase() == \"ࢎ࠶߈off௷\";\n  131\n});\n```\n\n### 调试 (Debugging)\n\
    \n当程序显示错误时，下一步是确定问题并将其修复。错误信息将直接指向你代码块中的某一行。查看错误描述，你就能找到问题所在。这个示例程序尝试通过不断提取最后一位并将数字除以该数字的进制，将整数转换为指定基数（十、二进制等）的字符串。\n\
    \n```javascript\nfunction numberToString(n, base = 10) {\n  let result = \"\"\
    , sign = \"\";\n  if (n < 0) {\n    sign = \"-\";\n    n = -n;\n  }\n  do {\n\
    \    result = String(n % base) + result;\n    n /= base;\n  } while (n > 0);\n\
    \  return sign + result;\n}\n\nconsole.log(numberToString(13, 10));\n// → 1.5e-3231.3e-3221.3e-3211.3e-3201.3e-3191.3e…-3181.3\n\
    ```\n\n如果你想获取有关执行过程的额外信息，在程序中添加一些 `console.log` 调用是一个极佳的途径。我们想要获取值 `13`、`1` 和\
    \ `0`。我们应该在循环开始处说明值：\n\n13\n1.3\n0.13\n0.013…\n1.5e-323\n\n除以 `13` 不会得到整数。我们需要的不是\
    \ `n /= base`，而是 `n = Math.floor(n / base)`，这样数字就可以向右“移动”。\n\n指定断点的另一种绝佳方法是在程序中插入\
    \ `debugger` 语句（关键字）。如果你的浏览器处于激活状态，开发者工具会在程序运行到该语句时捕获并暂停程序。\n\n### 异常 (Exceptions)\n\
    \n当函数无法继续向下执行时，异常处理是理解如何修复该问题的地方。异常是一种工具允许遇到困难的代码块抛出异常，而异常可以是任何值。你可以刻意地在代码行中创建问题，以便在执行过程中捕获异常，这样你就可以使用它来解决问题并继续工作。\n\
    \n这里有一个示例：\n\n```javascript\nfunction promptDirection(question) {\n  let result\
    \ = prompt(question);\n  if (result.toLowerCase() == \"left\") return \"L\";\n\
    \  if (result.toLowerCase() == \"right\") return \"R\";\n  throw new Error(\"\
    Invalid direction: \" + result);\n}\n\nfunction look() {\n  if (promptDirection(\"\
    Which way?\") == \"L\") {\n    return \"a house\";\n  } else {\n    return \"\
    two angry bears\";\n    135\n  }\n}\n\ntry {\n  console.log(\"You see\", look());\n\
    } catch (error) {\n  console.log(\"Something went wrong: \" + error);\n}\n```\n\
    \n使用 `throw` 关键字抛出异常。\n\n### 异常后的清理 (Cleaning up after exceptions)\n\n异常的影响是不同类型的控制流。这表明你的代码可能有不同的副作用，但异常可以阻止这些副作用的发生。以下是一些糟糕的代码：\n\
    \n```javascript\nconst accounts = {\n  a: 100,\n  b: 0,\n  c: 20\n};\n\nfunction\
    \ getAccount() {\n  let accountName = prompt(\"Enter an account name\");\n  if\
    \ (!accounts.hasOwnProperty(accountName)) {\n    throw new Error(`No such account:\
    \ ${accountName}`);\n  }\n  return accountName;\n}\n\nfunction transfer(from,\
    \ amount) {\n  if (accounts[from] < amount) return;\n  accounts[from] -= amount;\n\
    \  accounts[getAccount()] += amount;\n}\n```\n\n`transfer` 函数用于在账户之间转账。如果你输入错误的名称，程序会输出异常。你可以通过使用\
    \ `try` 块来捕获它。\n\n### 选择性捕获 (Selective catching)\n\n当你想要捕获特定类型的错误时，如果只想捕获特定的错误，`catch`\
    \ 块的作用可能不如你预期的。这里有一个示例：\n\n```javascript\nfor (;;) {\n  try {\n    let adir =\
    \ promptDirection(\"Where?\");\n    console.log(\"You chose\", adir);\n    break;\n\
    \  } catch (error) {\n    console.log(\"Invalid direction. Try again.\");\n  }\n\
    }\n```\n\n`for(;;)` 循环用于构建不会自动终止的循环。如果你想捕获特定类型的错误，可以使用自定义错误类。让我们定义一种新错误并使用 `instanceof`：\n\
    \n```javascript\nclass InputError extends Error {}\n\nfunction promptDirection(question)\
    \ {\n  let result = prompt(question);\n  if (result.toLowerCase() == \"left\"\
    ) return \"L\";\n  if (result.toLowerCase() == \"right\") return \"R\";\n  throw\
    \ new InputError(\"Invalid direction: \" + result);\n}\n```\n\n现在循环可以专门地捕获这些错误：\n\
    \n```javascript\nfor (;;) {\n  try {\n    let adir = promptDirection(\"Where?\"\
    );\n    console.log(\"You chose\", adir);\n    break;\n  } catch (e) {\n    if\
    \ (e instanceof InputError) {\n      console.log(\"Invalid direction. Try again.\"\
    );\n    } else {\n      throw e;\n    }\n  }\n}\n```\n\n"
