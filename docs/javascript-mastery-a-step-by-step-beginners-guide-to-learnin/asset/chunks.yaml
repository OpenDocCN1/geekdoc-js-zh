    \n法律声明：\n本书受版权保护。它仅供个人使用。未经作者或出版者的同意，您不得修改、分发、销售、使用、引用或转述本书的任何部分或内容。\n\n免责声明：\n\
    请注意，本文档中包含的信息仅供教育和娱乐之用。我们已尽力提供准确、最新、可靠且完整的信息。不声明或暗示任何形式的保证。读者承认，作者不提供法律、财务、医疗或专业建议。\n\
    \n## 引言\nJavaScript 是一种遵循 ECMAScript 规范的卓越且解释密的编程语言。配合 HTML 和 CSS，JavaScript 是万维网的重要技术之一。JavaScript\
    \ 促进了交互式网页的，是 Web 应用的重要组成部分。几乎每个网站都使用了 JavaScript，并且所有的主流浏览器都包含 JavaScript 引擎以便正常运行。Brendan\
    \ Eich 在 1995 年任职 Netscape Communications 时开发了 JavaScript。JavaScript 辅助函数式、事件驱动、基于原型和面向对象的编程风格。JavaScript\
    \ 通过确认用户在客户端执行的操作来升级 Web 用户界面。您可以将 JavaScript 引擎插入不同类型的主机软件中，包括数据库、Web 服务器以及与\
    \ Web 无相关的程序（如文字处理器）。\n\n本书将进一步解释 JavaScript 的概念，旨在帮助您在没有压力的情况下学习和理解 JavaScript\
    \ 语言。学习 JavaScript 需要 HTML 知识、文本编辑器、浏览器以及 CSS。要开始学习过程，必要的工具之一是文本编辑器，它是编写代码必需的。您还需要浏览器。\n\
    \n## 第一章：什么是 JavaScript\nJavaScript 简称 `JS`，是一种由所有主流浏览器引入并采用的高级编程语言。JavaScript\
    \ 可以通过添加滑块、弹出窗口等特殊效果来创建交互式网页。CSS 则决定了背景颜色、类型、字体大小等。\n\n### 客户端 JavaScript\n客户端\
    \ JavaScript 是 JavaScript 的常见形式。脚本必须插入 HTML 文档或由其引用，以便浏览器解释代码。它允许网页动态地包含交互式内容。用户在提交表单以及判断所有输入是否有效时会使用\
    \ JavaScript 代码。\n\n### JavaScript 的优势\n* 通过 JavaScript，用户可以在页面发送到服务器之前对输入进行组织，这自动减轻了服务器的负载。\n\
    * JavaScript 能够对页面做出快速响应。在访问者查看输入是否有错误之前，页面无需重新加载。\n* JavaScript 用于构建活动界面，当鼠标悬停在上面时会产生反应。\n\
    \n### JavaScript 的局限性\nJavaScript 编程语言缺乏以下基本功能：\n* 出于考虑，客户端 JavaScript 不读取或写入文件\n\
    * 用于网络应用程序的 JavaScript\n* JavaScript 不具备多处理器能力。\n\n### JavaScript 开发工具\n您不需要昂贵的开发工具来编写\
    \ JavaScript。您可以使用简单的文本编辑器编写，例如 Microsoft FrontPage、Adobe Dreamweaver MX、Adobe\
    \ HomeSite 5 等。\n\n### JavaScript 的位置\nJavaScript 代码可以插入到 HTML 文档的任何位置。但是，您可能想像这样在\
    \ HTML 文件中插入 JavaScript 代码：\n\n```html\n<head>\n  <script></script>\n</head>\n\
    <body>\n  <script></script>\n</body>\n```\n\n在 `<head>` 部分包含外部文件脚本：\n```html\n\
    <head>\n  <script src=\"filename.js\"></script>\n</head>\n```\n\n## JavaScript\
    \ 章节\n\n"
- fmt: "\nIn some cases, when you want a script to run on any special event, such\
    \ as an action when a button is clicked, you place the script in the head section\
    \ alike like this:\n\n```html\n<html>\n<head>\n<script type=\"text/JavaScript\"\
    >\n<!--\nfunction sayHi() {\n  alert(\"Hello World\")\n}\n//-->\n</script>\n</head>\n\
    <body>\n  Tap here for result\n  <input type=\"button\" onclick=\"sayHi()\" value=\"\
    Say Hi\" />\n</body>\n</html>\n```\n\n### JavaScript In a `<body>...</body>` Section\n\
    \nSometimes you want a script to run immediately and to create a script on the\
    \ content page, inserting the script within the `<body>` section. This is what\
    \ the code should look like:\n\n```html\n<html>\n<head>\n</head>\n<body>\n<script\
    \ type=\"text/JavaScript\">\n<!--\ndocument.write(\"Hello World\")\n//-->\n</script>\n\
    <p>This Is A web page body </p>\n</body>\n</html>\n```\n\n### JavaScript In A\
    \ `<head>` and `<body>` Sections\n\nInsert your JavaScript code in `<head>` and\
    \ `<body>` section alike alike this:\n\n```html\n<html>\n<head>\n<script type=\"\
    text/JavaScript\">\n<!--\nfunction sayHi() {\n  alert(\"Hello World\")\n}\n//-->\n\
    </script>\n</head>\n<body>\n<script type=\"text/JavaScript\">\n<!--\ndocument.write(\"\
    Hello World\")\n//-->\n</script>\n<input type=\"button\" onclick=\"sayHi()\" value=\"\
    Say Hi\" />\n</body>\n</html>\n```\n\n### JavaScript In External Files\n\nTo avoid\
    \ the use of identical JavaScript code repetition, the language enables you to\
    \ create an external file and store JavaScript codes and then integrate the external\
    \ file into the HTML files. The sample below displays how to integrate an external\
    \ JavaScript file within the HTML code utilizing the `script` tag and `src` attribute.\n\
    \n```html\n<html>\n<head>\n<script type=\"text/javascript\" src=\"filename.js\"\
    ></script>\n</head>\n<body>\n  .......\n</body>\n</html>\n```\n\nThe external\
    \ file source file should be saved with an extension `.js`.\n\n#### Summary\n\n\
    In this first chapter, we explained the origination of JavaScript and its placement\
    \ into internal and external files. We discussed the use of JavaScript to build\
    \ interactive web applications to perform appropriately without having to reload\
    \ every page per-action.\n\n#### Exercise\n\nHow do you insert JavaScript code\
    \ into the head, body and include external file script in an HTML document?\n\n\
    #### Solution\n\nThe script for the head apart is `<head></head>`.\nThe script\
    \ for the body apart is `<body></body>`.\nThe script within the body is `<body></body>`\
    \ and `<head></head>`.\nThe script to include external file script in the `<head>...</head>`.\n\
    \n---\n\n## Chapter 2: Values, Types, and Operators\n\nIn the world of computers,\
    \ there is data. You can create new data, read data and change data, which are\
    \ all stored as a look-alike along succession of bits. Define bits as zeros and\
    \ ones that take a strong or weak signal, and a high or low electrical charge\
    \ from inside the computer. All data and pieces of information are described as\
    \ a succession of zeros and ones and are represented in bits.\n\n### Values\n\n\
    Take a deep breath and think of an ocean of bits. The latest PC contains more\
    \ than 30 billion bits in its data storage. We use bits to create values. The\
    \ computer can function correctly because every bit of information is split into\
    \ values. Every value consists of a type that influences its role, and values\
    \ can be numbers, text or functions, etc. To generate a value, you need to invoke\
    \ its name, and it appears from where it was stored.\n\n### Arithmetic\n\nArithmetic\
    \ is a major thing to do with numbers. The multiplication, addition, and subtraction\
    \ of more than one number to produce another number is an arithmetic operation.\
    \ This is an example of what they look alike in JavaScript:\n\n```\n100 + 4 *\
    \ 11\n```\n\nThe `+` and `*` symbols are called operators, the first means addition\
    \ while the other means multiplication. An operator inserted between two values\
    \ will produce another value. The `-` operator is for subtraction and the `/`\
    \ operator is for the division. If operators show together without parentheses,\
    \ the precedence of the operators decides the way they are applied. If several\
    \ operators with the same precedence show right next to each other alike `1-2+1`,\
    \ they apply them left to right: `(1 - 2) + 1`.\n\n### Special Numbers\n\nJavaScript\
    \ consists of three unique values that do not act like numbers but are regarded\
    \ as numbers. `Infinity` and `-Infinity` are the first two, which mean the positive\
    \ and negative infinities, and the last value is `NaN`. `NaN` says “not a number,”\
    \ although it is a value of the Number type.\n\n### Strings\n\nA string is a succession\
    \ of numbers. The string is the next data type, and they represent text. Strings\
    \ confine their content in quotes.\n\n```\n`Down the walkway path.`\n\"On Top\
    \ of the roof.\"\n'I am at home.'\n```\n\nQuotes are used in different types alike\
    \ double quotes, single quotes, or the backticks to mark strings. It is essential\
    \ that the strings match. The elements within the quotes create a string value\
    \ by JavaScript. JavaScript uses the Unicode standard to assign a number to every\
    \ character needed, including Arabic, Armenian, Japanese, etc. You cannot subtract,\
    \ multiply, or divide strings but you can use the `+` operator, which will not\
    \ add but concatenates two strings together. Concatenation means to glue strings\
    \ together.\n\n### Unary operators\n\nSymbols do not represent all the operators.\
    \ You can write some operators in words. A clear example is a type of operator,\
    \ and this operator creates a string value with the name of the `typeof` its attached\
    \ value.\n\n```\nconsole.log(typeof 4.5)\n// → A number\n\nconsole.log(typeof\
    \ \"x\")\n// → A string\n```\n\nThe second displayed operator is called the binary\
    \ operator because they use two values, while operators that use one value are\
    \ the unary operator.\n\n```\nconsole.log(-(10 - 2))\n// → -8\n```\n\n### Boolean\
    \ values\n\nBoolean is a value that differs only between two possibilities such\
    \ as “on” and “off” and so on. The Boolean consists of only true and false.\n\n\
    ### Comparison\n\nComparison is a way to create Boolean values:\n\n```\nconsole.log(3\
    \ > 2)\n// → true\n\nconsole.log(3 < 2)\n// → false\n```\n\nThe `>` and `<` characters\
    \ are signs that represent “is greater than” and “is less than,” accordingly.\
    \ You can use binary operators in a Boolean value that determines if the contained\
    \ value is true or false.\n\nYou can compare strings in the same manner.\n\n```\n\
    console.log(\"Aardvark\" < \"Zoroaster\")\n// → true\n```\n\nYou can instruct\
    \ strings in alphabetical order, uppercase letters are often “less” than lowercase,\
    \ so \"Z\" < \"a\", and non-alphabetic characters are also present in the ordering.\
    \ When JavaScript wants to compare strings, it recognizes characters from left\
    \ to right, differentiating the Unicode codes individually.\n\nHere are other\
    \ related operators `<=`, `>=`, `==`, and `!=`.\n\n```\nconsole.log(\"Itchy\"\
    \ != \"Scratchy\")\n// → true\n\nconsole.log(\"Apple\" == \"Orange\")\n// → false\n\
    ```\n\nIn JavaScript, there is only one value that is not equal to itself, which\
    \ is `NaN` (“not a number”).\n\n```\nconsole.log(NaN == NaN)\n// → false\n```\n\
    \n### Logical operator\n"
