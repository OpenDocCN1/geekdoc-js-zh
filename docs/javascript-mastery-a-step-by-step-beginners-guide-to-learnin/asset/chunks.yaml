- fmt: "\nThe Amove Amethod Ais Athe Aaction Acenter. It examines if a `path` leads\
    \ from one place to another, if not the old state is returned because the move\
    \ is not valid. Then it builds a new state with the destination as a robot’s new\
    \ place as well as building a new set of parcels. The call to `map` handles the\
    \ movement and the call to `filter` handles deivering.\n\n```javascript\nlet first\
    \ = new VillageState(\n  \"Post Office\",\n  [{place: \"Post Office\", address:\
    \ \"Alice's House\"}]\n);\n\nlet next = first.move(\"Alice's House\");\n\nconsole.log(next.place);\n\
    \n// → Alice's House\n\nconsole.log(next.parcels);\n\n// → []\n\nconsole.log(first.place);\n\
    \n// → Post Office\n```\n\n### Persistent Data\n\nUnchangeable data layouts are\
    \ called `immutable` or `persistent`. They act like strings and An numbers. In\
    \ `JavaScript`, you can change almost everything. There is a function named `Object.freeze`\
    \ that transforms an object so that it disregards writing to its properties.\n\
    \n```javascript\nlet object = Object.freeze({value: 5});\n\nobject.value = 10;\n\
    \nconsole.log(object.value);\n\n// → 5\n```\n\n### Simulation\n\nA delivery robot\
    \ takes a good glance at the world and determines what direction it moves to.\
    \ Therefore, a robot is a function which takes a `VillageState` object and sends\
    \ back the name of an nearby place. The robot sends back an object consisting\
    \ of its intended direction and a memory value returned the next time you call\
    \ it.\n\n```javascript\nfunction runRobot(state, robot, memory) {\n  for (let\
    \ turn = 0;; turn; turn++) {\n    if (state.parcels.length == 0) {\n      console.log(`Done\
    \ in ${turn} turns`);\n      break;\n    }\n\n    let action = robot(state, memory);\n\
    \    state = state.move(action.direction);\n    memory = action.memory;\n    console.log(`Moved\
    \ to ${action.direction}`);\n  }\n}\n```\n\nThe robot can walk through in different\
    \ directions at every turn. It can run into all parcels and then get to its delivery\
    \ point. Below is an example:\n\n```javascript\nfunction randomPick(array) {\n\
    \  let choice = Math.floor(Math.random() * array.length);\n  return array[choice];\n\
    }\n\nfunction randomRobot(state) {\n  return {direction: randomPick(roadGraph[state.place])};\n\
    }\n```\n\nIf you want to test this unique robot, create a new state with a few\
    \ parcels.\n\n```javascript\nVillageState.random = function(parcelCount = 5) {\n\
    \  let parcels = [];\n  for (let i = 0; i < parcelCount; i++) {\n    let address\
    \ = randomPick(Object.keys(roadGraph));\n    let place;\n    do {\n      place\
    \ = randomPick(Object.keys(roadGraph));\n    } while (place == address);\n   \
    \ parcels.push({place, address});\n  }\n  return new VillageState(\"Post Office\"\
    , parcels);\n};\n```\n\nThe do loop continues to select new places when it gets\
    \ a correct address. Let’s start up a virtual world.\n\n```javascript\nrunRobot(VillageState.random(),\
    \ randomRobot);\n\n// → Advances to Marketplace\n// → Advances to Town Hall\n\
    // →…\n// → Run in 63 turns\n```\n\nIt takes the robot too many turns to transport\
    \ the parcels because there was no plan ahead.\n\n### The mail truck's route\n\
    \nIf you search for a route that goes through all the places in the village, that\
    \ could run twice by the robot, but there is no guarantee it will run it once.\
    \ Below is an example:\n\n(starting from the Post office):\n\n```javascript\n\
    const mailRoute = [\n  \"Alice's House,\" \"Cabin\", \"Alice's House\", \"Bob's\
    \ House\",\n  \"Town Hall\", \"Daria's House\", \"Ernie's House\",\n  \"Grete's\
    \ House\", \"Shop\", \"Grete's House\", \"Farm\",\n  \"Marketplace\", \"Post Office\"\
    \n];\n```\n\nTo use the route, you need to utilize the robot memory. The rest\
    \ of the robot route is stored in its memory and dispatches the first element\
    \ at every turn.\n\n```javascript\nfunction routeRobot(state, memory) {\n  if\
    \ (memory.length == 0) {\n    memory = mailRoutes;\n  }\n  return {direction:\
    \ memory[0], memory: memory.slice(0,1)};\n}\n```\n\nThe robot is faster now. It\
    \ takes a maximum of 26 turns (twice the 13-step route) but more often less.\n\
    \n### Pathfinding\n\nAn interesting approach is to develop routes from the starting\
    \ point, and inspect every available place that has not been visited until it\
    \ attains its goal. The below illustration explains that:\n\n```javascript\nfunction\
    \ findRoute(graph, from, to) {\n  let work = [{at: from, route: []}];\n  for (let\
    \ i = 0; i < work.length; i++) {\n    let {at, route} = work[i];\n    for (let\
    \ location of graph[at]) {\n      if (location == to) return route.concat(location);\n\
    \      if (!work.some(w => w.at == location)) {\n        work.push({at: location,\
    \ route: route.concat(location)});\n      }\n    }\n  }\n}\n```\n\nThe function\
    \ saves a `work` list. This is an array of places that will be inspected next,\
    \ together with the route. It begins with an empty route and the start position.\
    \ Every location can be touched from every location, Aa a route can also be found\
    \ between two points therefore the route will not fail.\n\n```javascript\nfunction\
    \ goalOrientedRobot({location, parcel}, routes) {\n  if (route.length == 0) {\n\
    \    let parcel = parcel[0];\n    if (parcel.location != location) {\n      route\
    \ = findRoute(location, parcel.location);\n    } else {\n      route = findRoute(roadGraph,\
    \ location);\n    }\n  }\n  return {direction: routes[0], memory: route};\n}\n\
    ```\n\n### Summary\n\nIn this chapter we touched on robots using JavaScript. We\
    \ built a village with parcels and roads, then we talked about immutable data\
    \ where data structures act like strings. Simulation allows you to pass memory\
    \ to robots and let them send back new.\n\n### Exercise\n\nWrite a straightforward\
    \ JavaScript program to connect every element in the below array into a string.\n\
    \n`\"Red, Green, White, Black\"`\n`\"Red, Green, White, Black\"`\n`\"Red+Green+White+Black\"\
    `\n\n### Solution\n\n![00127.jpg](images/00127.jpg)\n\n## Chapter 9: Bugs and\
    \ Errors\n\nComputer program flaws are called bugs, mistakes made by a computer\
    \ program.\n\n### Strict Mode\n\nYou can utilize JavaScript in strict mode. This\
    \ can be achieved by adding the string `\"use strict\"` at the top of a file.\
    \ Below is an illustration:\n\n```javascript\nfunction canYouSpotTheProblem()\
    \ {\n  \"use strict\";\n  for (counter = 0; counter < 10; counter++) {\n    console.log(\"\
    Happy\");\n  }\n}\n\ncanYouSpotTheProblem();\n\n// → ReferenceError: counter is\
    \ not defined\n```\n\nUse the below code when you want to call a constructor function\
    \ omitting the `new` keyword so it doesn’t introduce a newly created object:\n\
    \n```javascript\nfunction person(name) {this.name = name;}\n\nlet Ferdinand =\
    \ person(\"Ferdinand\"); // Oops\n\nconsole.log(name);\n\n// → Ferdinand\n```\n\
    \nThe fake call to `person` flourished but sends back an `undefined` value and\
    \ builds the global binding `name`. In strict mode:\n\n```javascript\n\"use strict\"\
    ;\nfunction person(name) {this.name = name;}\n\nlet Ferdinand = person(\"Ferdinand\"\
    ); // Forgot new\n\n// → TypeError: Cannot set property 'name' of undefined\n\
    ```\n"
