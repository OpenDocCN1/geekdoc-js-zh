  trans: "\n\n![](img/cover.jpg)\n\n![img](img/cover.jpg)\n\n# JavaScript 精通\n学习 JavaScript\
    \ 编程的一步入门指南\n\n## 目录\n* 引言\n* 第一章：什么是 JavaScript\n* 第二章：值、类型与运算符\n* 第三章：程序结构\n\
    * for 循环\n* 第四章：函数\n* 第五章：数据结构：对象与数组\n* 第六章：高阶函数\n* 第七章：对象的秘密生活\n* 第八章：机器人\n*\
    \ 第九章：Bug 与错误\n* 第十章章：正则表达式\n* 第 11 章：模块\n* 第 12 章：异步编程\n* 第 13 章：解析\n* 结语\n\n\
