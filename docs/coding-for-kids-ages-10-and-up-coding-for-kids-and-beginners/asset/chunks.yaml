    # KeyPress Example 2


    ![image](d2d_images/chapter_title_below.png)


    In the below program, we create 5 different functions that places a small ball
    at 5 different parts of the canvas; based on which key is pressed on the keyboard.
    If the user presses “space” the program runs `centerballposition()` which places
    the ball in the center of the canvas.


    If the user presses “right” the program runs `rightballposition()` which places
    the ball in the top right corner of the canvas.


    If the user presses “left” the program runs `leftballposition()` which places
    the ball in the left top corner of the canvas.


    If the user presses “down” the program runs `downballposition()` which places
    the ball in the bottom right corner of the canvas.


    If the user presses “escape” the program runs `downleftballposition()` which places
    the ball in the bottom left corner of the canvas.


