    determine the x and y co-ordinates of where Tim is hidden in this picture.


    mousec(event) is the function that runs when the mouse is clicked. Inside the
    function event.offsetX gives the x co-ordinate of the click and event.offsetY
    gives the y-coordinate of the click. ctr is a counter that counts the number of
    clicks and increments by 1 inside the mousec function.


    The program then uses Pythagros theorem to find the distance between Tim and the
    mouseclick and prints the distance as an alert.


