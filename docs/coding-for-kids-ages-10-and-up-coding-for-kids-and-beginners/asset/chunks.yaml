    # Pong Game


    ![image](d2d_images/chapter_title_below.png)


    The Pong game is a fun game that builds on the “Bouncing Ball” game on Page 215
    of this book. So, the program has a ball bouncing around the canvas. We add a
    bat in the LH corner of the screen that moves up and down. The bat of length 15
    pixels is drawn using `clearRect()` and `fillRect()`. It is set to a constant
    `xlocation` of 10 and the `ylocation` is defined by a variable called `yrect`.
    `yrect` is defined in functions `movedown()` and `moveup()`. `Moveup()` is activated
    when up button is pressed and it decreases `yrect` by 30 pixels, which moves the
    bat up. `Movedown()` is activated when down button is pressed and it increases
    `yrect` by 30 pixels, which moves the bat down.


    Also, the function `press(event)` detects the presence of keys pressed and activates
    `moveup()` and `movedown()` when up and down button are pressed respectively.


    And we finally have the `frame()` function. It is a function that checks if the
    ball is next to the top, bottom and right walls. If the x-coordinate of the ball
    gets close to 500, then it is close to the right wall. Then we change the direction
    of x-motion to create a bounce back. We do the same thing if the y-coordinate
    is 0 or 500 (it reaches top/bottom wall), so we change direction of y-motion for
    the bounce.


    And finally, we have a check to see if the ball touches the bat. We calculate
    the distance `dist` between bat location and ball location using Pythagros theorem.
    If the distance (`dist`) is less than 75 pixels, then we change the direction
    of x-motion.


