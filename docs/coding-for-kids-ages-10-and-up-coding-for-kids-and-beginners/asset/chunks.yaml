    在这个程序中，我们编写了一个测验，询问用户世界上某个随机国家的首都，并检查答案是否正确。


    程序中，一个按钮运行 `worldquiz()` 函数。在该函数中，我们声明了两个数组。一个数组包含世界上所有国家；另一个包含所有首都。


