    IF 循环来看一下。


    ![image](img/image075.png)


    上面的 HTML 表单允许用户输入两个年龄，其 id 分别为`age1`和`age2`。JavaScript 变量`a1`和`a2`存储这些变量的值。IF
    语句检查两个年龄之和是否大于 15。如果大于 15，保险费用为 300 美元；否则为 600 美元。最后，我们输出保险费用的值。以下是输出结果。


