- fmt: '

    While html is used to create a web page structure and css is for web page style,
    JavaScript is used to make the web page more interactive with the user. It allows
    different html elements to interact with each other, performs calculations, animations
    etc. In other words, it makes web page programming fun.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Using JavaScript with html


    ![image](d2d_images/chapter_title_below.png)


    There are two ways to use JavaScript in a html web page. The first way is to just
    add the code within script tags in html. This is shown in the blue portion of
    the code below.


    ```html

    <html>

    <head><title>Test file 1</title>

    </head>

    <body>

    <script>

    //Enter JavaScript code here

    </script>

    </body>

    </html>

    ```


    The 2^(nd) way is to create an external JavaScript file that contains the code
