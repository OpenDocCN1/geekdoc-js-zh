    # 什么是 html？


    ![image](img/chapter_title_below.png)


    html 代表超文本标记语言（Hyper Text Markup Language）。


    它是我们通过网页与互联网交互所使用的编程语言。所有网页的基本结构都由 html 定义。


    它足够简单，初学者程序员也能快速掌握。


    大多数 html 编程是通过称为标签（tags）的元素完成的。这些标签以 `<>` 开头，以 `</>` 结尾。例如，一个常见的标签是段落标签，它以 `<p>`
    开头，以 `</p>` 结尾。


