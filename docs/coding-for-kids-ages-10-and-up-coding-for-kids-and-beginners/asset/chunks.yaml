    # 鼠标点击 – 捉迷藏


    ![image](img/chapter_title_below.png)


    在下面的示例中，我们上传一个 HTML 图像，并在图像上选择一个随机位置作为我们捉迷藏游戏中“Tim”的位置。


    现在，我们点击图像上的不同位置。程序使用勾股定理计算点击位置与 Tim 之间的距离。你可以使用下面的链接获取图像，或者使用你自己的图像。


    捉迷藏图片链接：[`drive.google.com/file/d/1gmPI4Z2Rm9iAA9vEBi7LWehe-uNE2UQ4/view?usp=sharing`](https://drive.google.com/file/d/1gmPI4Z2Rm9iAA9vEBi7LWehe-uNE2UQ4/view?usp=sharing)


    在下面的代码中，`timx` 和 `timy` 是介于 0 和 500 之间的两个随机数，用于确定 Tim 隐藏在该图片中的 x 和 y 坐标。


    `mousec(event)` 是鼠标点击时运行的函数。在函数内部，`event.offsetX` 给出点击的 x 坐标，`event.offsetY` 给出点击的
    y 坐标。`ctr` 是一个计数器，用于计算点击次数，并在 `mousec` 函数内部每次增加 1。


