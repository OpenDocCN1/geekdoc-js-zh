    # What is a Canvas?


    ![image](d2d_images/chapter_title_below.png)


    A canvas is a html element allows that allows the user to draw graphics, shapes,
    images and run animations using JavaScript. It is a rectangular area on the html
    page, the size of which we can define.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Canvas Example


    ![image](d2d_images/chapter_title_below.png)


    The size of a canvas is defined in the unit of pixels. A pixel is the smallest
    unit of illumination on a computer screen. The most used computer size is 1366
    pixels width by 768 pixels height.


    Below is the sample canvas, which has a width of 500 pixels and height of 500
    pixels. It has a visible border of 2 pixels around the canvas.


    ![image](d2d_images/image100.png)


    Output:


    ![image](d2d_images/image198.png)


    Drawing (with measurements):


    Below is the drawing with the canvas size relative to the regular computer monitor
    screen. The green measurements are the size of the computer screen, and the black
    measurements are the size of the canvas. One can only draw on the canvas and not
    on the rest of the screen.


    ![image](d2d_images/image180.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Creating a Circle on the Canvas


    ![image](d2d_images/chapter_title_below.png)


    A circle in JavaScript is created using 5 steps. That’s what we do in the code
    below.


    The first step is to convert the html element to a JavaScript variable using `document.getElementByID`.
    Then it is converted to a 2D drawing element variable using `getContext("2d")`.
    In the below example, variable `c2x` is the drawing element.


    We can start any drawing in JavaScript with `beginPath()` and then clear the canvas
    using `clearRect`. Here’s how `clearRect` works, as in the below example:


    `clearRect(a,b,c,d)` means that the top left corner of the rectangle starts at
    an x-coordinate of a and y-cooridnate of b; it has a width of c and a height of
    d. So, we start at (a,b), and clear a canvas of width c and height d. In the example
    below, we start at (0,0), and clear the entire canvas of width 500 pixels and
    height 500 pixels. This makes the entire canvas blanks and ready to draw.


    Next, we draw the circle using the arc function. So, let’s see how that works:


    `arc(a,b,c,d,e)` is how we draw the circle. (a,b) is the center of the circle;
    a being the x-coordinate and b being the y-coordinate. c is the radius of the
    circle. d is the starting part of the arc of the circle. e is the ending part
    of the arc.


    d and e are measured in radians. For a full circle, d and e would be 0 and 2π
    respectively. For a half-circle d and e would be between 0 and π.


    In the below example, Circle 1 center is at (50,50) and has a radius of 20 pixels.
    Circle 2 is at a center point of (250,250) and has a larger radius of 70. Circle
    3 is actually a semi-circle as it goes from 0 to π radians. It is closer to the
    bottom right hand corner at (350,350) and has a radius of 50 pixels.


    In the final step we draw the circles using `stroke()`. If we want to fill the
    circles, we do so using `fill()`. And we can change the color using `fillStyle()`.


    ![image](d2d_images/image185.png)


    Output:


    ![image](d2d_images/image109.png)


    Drawing (Measurements):


    Here’s Circle 2 (blue circle) measuring using the canvas co-ordinates, just to
    show an example.


    ![image](d2d_images/image016.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Creating a Rectangle on the Canvas


    ![image](d2d_images/chapter_title_below.png)


    The drawing of a rectangle begins the same way as of a circle; with the canvas
    and 2D context variables. Again, we use `beginPath()` and `clearRect()` to start
    the process. Then we use a function known as `fillRect()` which is shown below:


    `fillRect(a,b,c,d)` means that the top left corner of the rectangle starts at
    an x-coordinate of a and y-cooridnate of b; it has a width of c and a height of
    d. So, we start at (a,b), and clear a canvas of width c and height d. In the example
    below, we start at (0,0), and creates a rectangle of width 50 pixels and height
    100 pixels. It is a red triangle (since `fillRect` is red).


    There is a second `fillRect()` which creates a square of width 75 pixels (as both
    width and height are set to the same value of 75). The top left corner of the
    square starts at (150,150).


    In both cases, `fillRect()` automatically draws and fills the rectangle with the
    assigned color.


    ![image](d2d_images/image036.png)


    Output:


    ![image](d2d_images/image000.png)


    Drawing (Rectangle 2):


    ![image](d2d_images/image107.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Creating a Smiley Face


    ![image](d2d_images/chapter_title_below.png)


    In the below example, we use our knowledge of circles and semi-circles to create
    a smiley face.


    First, we do a yellow circle of 75 pixel radius in the center of the screen, which
    is the face. We then draw 2 small black circles of 10 pixels each which serve
    as the eyes.


    And finally, we do a semi-circle filled with black color of radius 30 pixels.
    This is the smile.


    Pretty cute, huh? You can get creative and make any face you want.


    ![image](d2d_images/image072.png)


    Output:


    ![image](d2d_images/image132.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Practice Problems


    ![image](d2d_images/chapter_title_below.png)


    ›  Create a canvas of 700 pixels by 500 pixels. Draw 4 circles on the 4 different
    corners of the canvas. And then draw a 5^(th) circle right on the centre of the
    canvas. All circles are of different colors. This is a good canvas to get you
    comfortable with positioning shapes on the screen.


    ›  Create a canvas of 600 pixels by 600 pixels. Draw different emoticons on the
    screen. Draw a smiley face at the center of the canvas. Then, do a frowny face
    right on top of it. Third, do a scared emoticon (with closed eyes and straight
    mouth) at the right of center. And finally, do an emoticon of your choice to the
    left.


    ›  Create a canvas of 600 pixels by 600 pixels. Draw a square right at the center
    of side 100 pixels. Then draw a second square of 80 pixels. Third, draw a square
    of 60 pixels.... And so on, tell it can’t get any smaller. This is an example
    of concentric squares. (Hint: A square is just a rectangle with all equal sides).


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Timer and Animations


    ![image](d2d_images/chapter_title_below.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    ## What is a Timer?


    ![image](d2d_images/chapter_title_below.png)


    A timer in Javascript is used to time Javascript code. It allows the user to execute
    different portions of the code at different time intervals.


    `setTimeOut()` and `setTimeInterval()` functions are used to set the timer. `setTimeOut()`
    allows a fixed break before executing a code; `settimeinterval()` allows the code
    to be executed multiple times with a fixed interval between each execution. For
    example:


    `setTimeOut(a, 1000)` executes the function a after 1000 ms (1 second).


    `setTimeInterval(a, 1000)` keeps executing the function with a break of 1000 ms
    (1 second) between runs.

