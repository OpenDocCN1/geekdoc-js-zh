    # 弹跳的小球


    ![image](img/chapter_title_below.png)


    在这个示例中，我们将小球移向画布边缘，当小球碰到画布边缘时，它会反弹回来。


    这是通过修改决定小球 x 位置和 y 位置的方程来实现的。


    首先，在这种情况下，我们同时移动小球的 x 和 y 位置。因此，我们有两个独立的变量：`locationx` 和 `locationy`。还有另外两个变量决定小球的移动方向：`snx`
    和 `sny`。如果 `snx` 为正，则向右移动；如果 `snx` 为负，则向左移动。因此，`locationx` 和 `locationy` 的方程如下：


    `locationx = locationx + snx * 5`


    `locationy = locationy + sny * 5`


    因此，我们每次沿 x 方向移动 5 像素（向左或向右），沿 y 方向移动 5 像素（向上或向下）。


    如果小球到达画布的侧边缘（`locationy = 500` 或 `locationx = 0`），则改变 x 方向的运动方向（`snx = snx * -1`）。


    如果小球到达画布的上/下边缘（`locationy = 500` 或 `locationy = 0`），则改变 y 方向的运动方向（`sny = sny *
    -1`）。


    这种方向的改变就产生了我们在屏幕上看到的弹跳效果。


