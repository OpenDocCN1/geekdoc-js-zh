    # Loops


    ![image](d2d_images/chapter_title_below.png)


    Loops in coding are a sequence of instructions that are repeated a certain number
    of times.


    Think of a loop like an escalator. The steps run in a direction again and again
    till someone pushes the stop button.


    There are 3 types of loops based on the conditions of execution. They are:


    - IF Loops: IF loops contain a sequence of instructions that are executed if a
    certain condition is met. If the conditions are not met, the loop is not executed.

    - FOR Loops: FOR loops contain a sequence of instructions that are executed for
    a certain number of times. For example, a FOR loop from 1 to 10 executes the code
    inside the loop 10 times.

    - WHILE Loops: WHILE loops is a sequence of instructions that are executed till
    a certain condition is met.


    Now, let’s look at the elevator example through each of these loops.


    Let’s say we want the elevator to run only when there are more than 1000 people
    in the building. Then we use an IF loop that checks the number of people in the
    building and then runs the elevator function if that is the case.


    The IF Loop Example:


    ```

    if(people>1000)

    {

    Runelevator();

    }

    ```


    Now, if we want to do a 1000 run test on the elevator to see if it can hold a
    certain weight; we use a FOR loop. The FOR loop below starts at 0 and ends at
    999, thus running the elevator a 1000 times.


    ```

    for (i=0;i<1000;i++)

    {

    Runelevator();

    }

    ```


    Finally, if we want to keep running the elevator till 6 PM, we use a WHILE loop.


    ```

    While (checktime!=18:00)

    {

    Runelevator();

    }

    ```


    These are simple examples of the 3 loops to explain the concepts of loops. This
    concept is very important in coding.


    Now, let’s do some examples in JavaScript.


