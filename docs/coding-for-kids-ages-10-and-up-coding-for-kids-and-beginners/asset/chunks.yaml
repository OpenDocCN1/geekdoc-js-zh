  raw: 'The story of Rob and others inspired me to write the next Javascript book.
    While Rob might seem to be struggling, he needs to be commended for his effort.
    Too many of us give up at the first sight of difficulty. We move on from activity
    to activity with the mindset of a kitten playing with a ball of yarn. The truth
    is that there is no movement forward in any activity without a little bit of effort
    and pain. Rob just needs that little bit more, and that’s contained in this book.


    This book starts off with some of the basics to ensure that you have the basic
    knowledge needed to more forward. We’ll talk about setting up your workspace and
    doing basic programming and testing. However, this book does have a strong emphasis
    on coding games, activities and puzzles. These are meant to embed a deeper love
    for what programming can accomplish. We realize how important these kind of coding
    games are to the learning process. It imbibes a sense of fun and curiosity which
    is very exciting for everyone involved. There is also a very important section
    on the softer side of programming. This chapter talks about how to improve your
    coding through self-discovery, teamwork, self-discipline and healthy habits. These
    are the soft skills that would really help Rob move forward in programming.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Soft Skills of Coding


    ![image](d2d_images/chapter_title_below.png)


    My experiences with teaching kids coding, and also from hearing from Rob have
    convinced me that soft skills are just as important as technical knowledge in
    coding. These soft skills also help you with all other aspects of life moving
    forward. So, it’s a win-win all the way around.


    So, what exactly are soft skills? Soft skills relate more to how people work.
    This is different from hard technical skills which focus on what people work on.
    Soft skills relate to how people deal with mental, physical and interpersonal
    problems. In combination with good technical knowledge, soft skills can take your
    performance to a higher level. Here are some of the skills that I am talking about:


    *   Focus and Concentration: Ability to focus on a single task at hand is a tough
    skill to master in a world dominated by social media and other distractions. Multi-tasking
    may seem cool; but in the long run it takes away from quality work and quality
    education.


    ›  A new tool to help you focus is something called isochronic tones. This is
    specific music that gets your mind in the right frame and helps you focus. You
    can check out these tones for free by searching ‘isochronic tones’ on Youtube
    or Google.


    ›  Another tool is daily meditation. Meditation for 5 minutes at the start of
    the day can help you build focus over time.


    ›  And finally, breaking your work down into periods of 20-30 minutes can make
    a big difference. Take a 5-10 minute walk between each session and come back refreshed.


    *   Perseverance: The ability to persist and learn from failures is very important
    in coding. It’s common practice among programmers to try to break the code (or
    make the code fail) so they can learn the weak points in a program, and make it
    improve. You can do the same for your program and for your programming skill.


    *   Teamwork: Going at coding alone is necessary when starting off; but will hold
    you back in the long run. You can learn a lot faster from the mistakes of others;
    than from your own mistakes. You can join a local programming club in your own
    city; hire a programming tutor; join relevant facebook coding groups; post on
    redditt threads and learn from Github code. It’s important to be active on these
    groups and recognized as a positive contributor.


    *   Physical Health: This is a very underrated and undervalued trait by many programmers.
    But in the long run, it really hurts people in the industry. Back problems, obesity,
    carpal tunnel syndrome are common health issues that programmers encounter after
    working in the industry for 5-10 years or more. Here’s a few ways to take better
    care of your health.


    ›  Maintain a good sitting posture: Sit upright. Make sure your laptop is close
    to eye level, so you don’t have to bend your neck down. Make sure your feet are
    in line with your knees.


    ›  Take frequent breaks: I recommend taking breaks every 20-30 minutes. Take a
    walk in between periods.


    ›  Diet: Maintain a healthy diet high in good fats, protein and complex carbs.
    Minimize simple carbs and sugar.


    ›  Exercise: Maintain a regular exercise regime or play a sport. It’s important
    to exercise at least 3-4 times a week (maybe more).


    ›  Sleep: Get at least 7-8 hours of sleep every night. If you’re unable to sleep,
    ask a qualified doctor how you can improve your sleep.


    One can write entire books on each of the above topics; but this is a coding book,
    so I will leave it there. Just remember that the above soft skills are very important
    and you can work on them while you are coding as well.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Setting Up Your Workspace


    ![image](d2d_images/chapter_title_below.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # What You Need


    ![image](d2d_images/chapter_title_below.png)


    You need a laptop/desktop with an internet connection, and a web browser installed.
    I recommend using Mozilla Firefox or Google Chrome.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Download/Install Text Editing software


    ![image](d2d_images/chapter_title_below.png)


    Download the latest version of a text editing software. I recommend downloading
    NotePad++. Once you download, double click the Setup.exe file and follow the installation
    prompts.


    [https://notepad-plus-plus.org/downloads/](https://notepad-plus-plus.org/downloads/)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Start using NotePad++


    ![image](d2d_images/chapter_title_below.png)


    Open Notepad++ from your Desktop or Start Menu


    ![image](d2d_images/image082.png)


    Now, click File>New to open a New File.


    ![image](d2d_images/image061.png)


    ![image](d2d_images/image103.png)


    Now, choose File>Save As and choose .html as the file type![image](d2d_images/image030.png)


    ![image](d2d_images/image092.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Test Program


    ![image](d2d_images/chapter_title_below.png)


    Now, let’s test if the program connects with the browser.


    Just type in random text in your file. In my file, I’ve typed “This is a Test
    Message.”


    Now File>Save.


    After that, click Run>Launch in Firefox/Chrome/IE depending on which browser you
    are using.


    If it is working, the text that you typed in should show in the browser window.


    ![image](d2d_images/image177.png)


    ![image](d2d_images/image005.png)


    ![image](d2d_images/image002.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Result:


    ![image](d2d_images/chapter_title_below.png)


    ![image](d2d_images/image045.png)


    This is a great simple way to ensure that your program is working before moving
    forward.


