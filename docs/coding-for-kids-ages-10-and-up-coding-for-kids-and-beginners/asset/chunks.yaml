    # 什么是画布？


    ![image](img/chapter_title_below.png)


    画布是一个 HTML 元素，允许用户使用 JavaScript 绘制图形、形状、图像以及运行动画。它是 HTML 页面上的一个矩形区域，我们可以定义其大小。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # 画布示例


    ![image](img/chapter_title_below.png)


    画布的大小以像素为单位定义。像素是计算机屏幕上最小的发光单元。最常用的计算机尺寸是 1366 像素宽、768 像素高。


    下面是一个示例画布，宽度为 500 像素，高度为 500 像素。画布周围有一个 2 像素的可见边框。


    ![image](img/image100.png)


    输出：


