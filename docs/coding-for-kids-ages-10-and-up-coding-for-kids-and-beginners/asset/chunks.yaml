    # 什么是 CSS？


    ![image](img/chapter_title_below.png)


    CSS 是层叠样式表（Cascading Style Sheets）的缩写。它允许用户设置和修改 HTML 网站的样式。“样式”一词指的是字体类型、字体颜色、背景颜色、阴影等。CSS
    元素可以通过 HTML 和 JavaScript 访问。


