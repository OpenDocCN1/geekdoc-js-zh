    # 常见的 html 标签


    ![image](img/chapter_title_below.png)


    `<html>` - 此标签用于每个网页的开头，表示 html 代码的开始


    `<head>` - 这段 html 代码在程序其余部分之前执行


    `<title>` - 此标签用于为网页设置标题。它将文本写入网页顶部的标签栏。


    `<body>` - 这是网页主体上的信息。


    `<h1>` - 用于表示标题标签。这是最大尺寸的标题标签。


    `<h2>`、`<h3>`、`<h4>`、`<h5>`、`<h6>` - 用于表示尺寸递减的子标题。


    `<p>` - 用于表示文本段落


    `<img>` - 在网页上显示图像。此图像可以链接到外部网页或内部文件。


    `<strong>` - 用于使文本加粗


    `<ul>` - 用于无序列表。例如，以项目符号形式列出的项目列表。


    `<li>` - 向无序列表添加一个项目符号项。


    `<ol>` - 用于有序列表，例如从 1,2,3... 开始的编号列表。


    `<div>` - 用于表示较大的文本块，其中包含多个段落。


    `<a>` - 用于将网页中的项目链接到另一个网页。


    `<br>` - 在代码中添加一个换行符，并移动到下一行。


