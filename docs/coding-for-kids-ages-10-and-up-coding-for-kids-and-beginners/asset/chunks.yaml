    # Example 2


    ![image](d2d_images/chapter_title_below.png)


    In the below example, we simulate a game of dice between 6 players.


    Basically, a game of dice is played 10 times; and points are added to the players
    depending on where the dice falls between 1-6. For example, if it falls on 1,
    a point is added to Player 1. If it falls on 2, a point is added to Player 2 and
    so on. The value of the dice is simulated between 1 and 6 using `Math.Random()`
    function.


    At the start of the program, an object `gameplayer` is declared. The property
    is the name of the player, and the value is the number of points obtained.


    In the function `dicegame()`, there is a `FOR` loop that runs `gamecalc()` 10
    times. In `gamecalc()` a random number between 1 and 6 is chosen, which simulates
    the rolling of the dice. Depending on what value the dice falls on, a player’s
    property value is increased by 10.


    At the end of the `FOR` loop, we print out the points obtained by each player
    below.


    The code is below with a sample output.


