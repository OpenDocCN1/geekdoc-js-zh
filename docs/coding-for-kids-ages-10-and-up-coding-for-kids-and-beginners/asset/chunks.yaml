    # 增长的正方形


    ![image](img/chapter_title_below.png)


    我们使用 `setInterval` 和 `fillRect` 函数编写一个让正方形扩大的程序。点击按钮时，会运行增长正方形函数。在增长正方形函数中，我们执行一个
    `setInterval`，每 10 毫秒（0.01 秒）运行一次 `frame()` 函数。我们将变量 `size` 声明为 10 像素，`size` 表示正方形的边长。


    在 `frame` 函数中，首先使用 `clearRect()` 清除整个画布。然后从 (0,0) 开始绘制一个边长为 `size` 的矩形。每次执行函数时，`size`
    增加 5。一旦 `size` 大于 500，就将其重置为 10。这确保了当正方形超出画布时，它会从较小的尺寸重新开始增长。


    ![image](img/image004.png)


