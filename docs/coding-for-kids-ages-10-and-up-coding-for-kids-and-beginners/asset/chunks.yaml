    # 字符串变量


    ![image](img/chapter_title_below.png)


    在 JavaScript 编程中，字符串变量用于存储一组字符。


    例如：


    `var x="awe3t5"`


    `x`是一个字符串变量，存储了`"awe3t5"`的值。


    它是一个长度为 6 的字符串变量。当我们访问字符串时，请记住索引从 0 开始，而不是 1。例如，`x[0]`返回`a`，`x[1]`返回`w`，以此类推。


    字符串在处理文本信息（如姓名、地址等）时非常有用。


    以下是一些可用于处理字符串的实用函数列表。


    - `length` – 返回字符串的长度。在上面的例子中，`x.length`返回 6。

    - `charAt(y)` – 返回字符串中位置`y`处的字符。例如，在字符串`x`中，如果我们想要第 5 个字符，可以执行`x.charAt(5)`，返回`t`。

    - `indexOf(y)` – 检查字符`y`在字符串中的索引。例如，`x.indexOf(''a'')`返回 0。

    - `lastIndexOf(y)` – 检查字符`y`在字符串中的最后一个索引。例如，`x.lastIndexOf(''e'')`返回 3。这仅在同一个字符串出现多次时有用。

    - `.concat(b)` – 将字符串`b`连接到前一个字符串。例如，如果字符串`a = "xyz"`，字符串`b = "lmn"`，则`a.concat(b)`得到`"xyzlmn"`。

    - `includes(y)` – 检查字符串中是否包含字符串`y`，并返回 true 或 false 值。例如，如果字符串`x = "Hi Peter"`，则`x.includes("Hi")`返回
    true，但`x.includes("Home")`返回 false。

    - `replace(x,a)` – 将字符串中所有`x`的实例替换为字符串`a`。例如，如果字符串`str = "Hi Peter"`，则`str.replace("Hi","Hello")`使`str`变为`"Hello
    Peter"`。

    - `startswith(y)` – 检查字符串是否以字符串`y`开头。它返回一个布尔值 true 或 false。在上面的例子中，`str.startswith("Hi")`返回
    true，而`str.startswith("Hello")`返回 false。

    - `toUpper()` – 将整个字符串转换为大写。在上面的例子中，`str.toUpper()`变为`"HI PETER"`。

    - `toLower()` – 将整个字符串转换为小写。在上面的例子中，`str.Lower()`变为`"hi peter"`。


