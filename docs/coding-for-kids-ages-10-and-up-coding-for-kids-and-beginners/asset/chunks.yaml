    ![image](img/image040.png)


    上面两行是名字和姓氏的文本框。类型设置为“text”，因为名字是一种文本形式。id “frstname” 和 “lname” 将在以后需要时用于引用代码。大小设置为“20”，表示可以接受
    20 个字符。你可以根据需要将其改为更大或更小。


    ![image](img/image183.png)


    上面的元素是地址的文本域。它有 5 行（`rows="5"`），每行 40 个字符（`cols="40"`）。它被标记为“tstr2”。


    ![image](img/image143.png)


    上面的元素是用于选择国家的选择选项元素。它允许你从包含 4 个选项的下拉菜单中选择：美国、墨西哥、加拿大和澳大利亚。它被标记为“country”（`id="country"`）。


    ![image](img/image102.png)


