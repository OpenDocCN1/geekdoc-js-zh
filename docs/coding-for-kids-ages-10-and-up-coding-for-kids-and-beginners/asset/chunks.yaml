    我们使用 `setInterval` 和 `arc` 函数编写一个让圆形扩大的程序。点击按钮时，会运行增长圆形函数。在增长圆形函数中，我们执行一个 `setInterval`，每
    50 毫秒（0.05 秒）运行一次 `frame()` 函数。我们将变量 `size` 声明为 10 像素，`size` 表示圆的半径。


    在 `frame` 函数中，首先使用 `clearRect()` 清除整个画布。然后从中心点 (250,250) 开始绘制一个半径为 `size` 的圆。每次执行循环时，`size`
    增加 5。一旦 `size` 大于 350，就将其重置为 10。这确保了当圆超出画布时，它会从较小的尺寸重新开始增长。


