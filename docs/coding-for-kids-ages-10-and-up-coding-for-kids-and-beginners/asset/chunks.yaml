    One issue that some students have encountered is that the run browser option sometimes
    does not work and gives an error. This is because the path is not set right. If,
    for some reason, it doesn’t work, you can still run the program.


    * Just save the Notepad++ as a html document.

    * Close the Notepad++ file.

    * Go the folder where the html document is.

    * Double click on the html file and it should work.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # What is html?


    ![image](d2d_images/chapter_title_below.png)


    html stands for Hyper Text Markup Language.


    It is the programming language that we use to interact with the internet through
    web pages. The basic structure of all web pages is defined by html.


    It is simple enough for beginner programmers to grasp quickly.


    Most html programming is done by items called tags. These tags start with `<>`
    and end with `</>`. For example, a common tag is the paragraph tag which begins
    with `<p>` and ends with `</p>`.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Common html Tags


    ![image](d2d_images/chapter_title_below.png)


    `<html>` - This tag is used at the start of every webpage to denote the start
    of html code


    `<head>` - This piece of html code is executed before the rest of the program


    `<title>` - This tag is used the title the web page. It writes the text on to
    the top ribbon of the webpage.


    `<body>` - This is the information on the body of the web page.


    `<h1>` - Used to denote a heading tag. This is the largest size heading tag.


    `<h2>`, `<h3>`, `<h4>`, `<h5>`, `<h6>` - Used to denote subheadings of decreasing
    size.


    `<p>` - Used to denote paragraphs of text


    `<img>` - This shows an image on the web page. This image either links to an external
    web page or to an internal file.


    `<strong>` - Added to make text bold


    `<ul>` - This is for an unordered list. An example of this would be a list of
    items in bullet form.


    `<li>` - Adds a bullet item to an unordered list.


    `<ol>` - This is for ordered lists such as numbered lists from 1,2,3....


    `<div>` - Used to denote larger sections of text; that contain several paragraphs..


    `<a>` - Used to link items in a web page to another web page.


    `<br>` - Adds a line break to the code and moves to the next line.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Example of html code


    ![image](d2d_images/chapter_title_below.png)


    Below is an example of basic html code. It has examples of all the above html
    codes. You can type these out or copy paste the example below that.


    ![image](d2d_images/image206.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Copy Paste Version of html code


    ![image](d2d_images/chapter_title_below.png)


    You can copy and paste below code into your html browser to see if it works


    ```html

    <html>


    <head>


    <title>My first html website......</title>


    </head>


    <body>


    <h1>Welcome to Programming in Javascript (this is a h1 tag)</h1>


    <h2>Let''s get started (this is a h2 tag)</h2>


    <h3>This is the start of bigger things (this is a h3 tag)</h3>


    <p>We''re going over a few basic html tags here but you can feel free to play
    around them and experiment.


    There are 1000''s of html tags that you can learn in the long run. Here''s a list
    of topics you can learn below (This is a paragraph tag)</p>


    <ul> Below is the example of an unordered bulleted list


    <li>Basics of html</li>


    <li>CSS</li>


    <li>JavaScript</li>


    <li>Loops</li>


    <li>Arrays</li>


    <li>Canvas</li>


    </ul>


    <a href="https://www.google.com">Example of hyperlink to Google</a><br>


