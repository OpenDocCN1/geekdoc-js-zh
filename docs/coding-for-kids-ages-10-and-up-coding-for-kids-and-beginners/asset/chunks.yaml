    # 乒乓球游戏


    ![image](img/chapter_title_below.png)


    乒乓球游戏是一个有趣的游戏，它基于本书第 215 页的“弹跳球”游戏。因此，程序中有一个球在画布上弹跳。我们在屏幕的左下角添加了一个上下移动的球拍。长度为
    15 像素的球拍使用`clearRect()`和`fillRect()`绘制。它的`xlocation`固定为 10，而`ylocation`由一个名为`yrect`的变量定义。`yrect`在函数`movedown()`和`moveup()`中定义。当按下上键时，`Moveup()`被激活，它将`yrect`减少
    30 像素，从而使球拍向上移动。当按下下键时，`Movedown()`被激活，它将`yrect`增加 30 像素，从而使球拍向下移动。


    此外，函数`press(event)`检测按键事件，并在按下上键和下键时分别激活`moveup()`和`movedown()`。


    最后，我们还有`frame()`函数。该函数检查球是否靠近顶部、底部和右侧墙壁。如果球的 x 坐标接近 500，则它靠近右侧墙壁。然后我们改变 x 方向的速度以产生反弹。如果
    y 坐标为 0 或 500（到达顶部/底部墙壁），我们也做同样的处理，改变 y 方向的速度以实现反弹。


    最后，我们检查球是否碰到球拍。我们使用勾股定理计算球拍位置与球位置之间的距离`dist`。如果距离（`dist`）小于 75 像素，则改变 x 方向的速度。


