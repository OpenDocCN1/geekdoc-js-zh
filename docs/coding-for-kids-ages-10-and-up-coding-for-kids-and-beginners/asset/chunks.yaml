    The variable `remletters` is the number of remaining letters to be guessed. A
    `while` loop is created to accept user guesses as long as `remletters > 0`.


    Using `prompt`, we accept a single letter input from the user. If there is more
    than one letter input, we set an error message and ask the user to enter only
    one letter. Once the user enters a letter, we enter a loop that checks each letter
    of the random animal against the user letter. Each time there is a match, we subtract
    `remletters` by 1 and update the relevant part of `answerArray` with the matched
    letters. At the end of the `while` loop, the user has guessed the animal, and
    we print out a congratulatory note with the name of the animal.


    At any point within the `while` loop, if the user doesn’t enter a letter and tries
    to proceed, we exit the program loop and print out the animal name.


