    # 对象


    ![image](img/chapter_title_below.png)


    编程中的对象是一个属性的集合，每个属性都有对应的值。这些属性不必是相同的变量类型。例如，我们可以有一个同时包含字符串和数值属性的对象。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # 示例 1


    ![image](img/chapter_title_below.png)


    在下面的示例中，我们为汽车创建了一个对象。它有 4 个不同的属性：名称、型号、价格、车牌。这些属性通过表单的用户输入来接收。


    它们在 `entercar()` 函数中作为输入被接收，然后在 `printcars()` 函数中被赋值给一个对象。在 `printcars()` 函数中，用户通过表单输入的内容被赋值给
    4 个独立的变量。


    这些变量被赋值给对象 `car`，如下所示。属性和值之间用 `:` 分隔，不同的属性/值之间用逗号（`,`）分隔。


    在下面的示例中，`type`、`model`、`license` 和 `price` 是属性；而 `carname`、`carmodel`、`carnumber`
    和 `carprice` 是相应属性的值。下面的 4 个值来自用户表单。


    ![image](img/image167.png)


    要访问对象的值，我们使用点（`.`）运算符放在属性之前。例如，`car.type` 会返回对象 `car` 的属性 `type` 所赋的值。


    因此，我们通过访问对象属性值来打印出汽车类型和价格。


    以下是带有输出的代码。


    ![image](img/image089.png)


    输出 1：


    ![image](img/image165.png)


    点击“检查”按钮后，我们得到：


    ![image](img/image077.png)


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


