    # Example 1


    ![image](d2d_images/chapter_title_below.png)


    In the example below, we create an object for a car. It has 4 different properties,
    one for name, one for model, one for price, one for license plate. These are accepted
    through user input via forms.


    They are accepted as input in the `entercar()` function and then assigned to an
    object in `printcars()` function. In the `printcars()` functions, the user inputs
    via forms are assigned to 4 separate variables.


    These variables are assigned to the object `car` as shown below. The property
    and value are separated from one another using `:` and the different property/values
    are separated using a comma (`,`).


    In the below example, `type`, `model`, `license` and `price` are properties; while
    `carname`, `carmodel`, `carnumber` and `carprice` are the values of the respective
    properties. The 4 values below are the ones that are from the user form.


