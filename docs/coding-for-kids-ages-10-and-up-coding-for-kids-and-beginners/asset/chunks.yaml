    # Code Explained


    ![image](d2d_images/chapter_title_below.png)


    ```

    <img id="myImage" src="DayImage.jpg" style="width:200px">

    ```


    The above html element is an image tag. It has 3 elements; `id`, `src` and `style`.


    `id` is a label for the image. In this case, it is labelled as “myImage”. The
    `id` is used to reference the image throughout the program.


    `src` is the source of the image the tag loads. The image “DayImage.jpg” is in
    the same folder as the html file.


    ```

    <button onclick="document.getElementById(''myImage'').src=''DayImage.jpg''">Day</button>

    ```


    The above element is a button element. It has a parameter called `onclick` which
    describes what action is done when clicking the button.


    `document.getElementById` obtains the element with id ‘myImage’. So it displays
    ‘DayImage.jpg’ on ‘myImage’ when you click the button.


    ‘Day’ is the text written on the button.


    ```

