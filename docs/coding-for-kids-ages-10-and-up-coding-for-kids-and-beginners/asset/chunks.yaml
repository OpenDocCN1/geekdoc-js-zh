    ## 什么是定时器？


    ![image](img/chapter_title_below.png)


    JavaScript 中的定时器用于对 JavaScript 代码进行计时。它允许用户在不同的时间间隔执行代码的不同部分。


    `setTimeOut()` 和 `setTimeInterval()` 函数用于设置定时器。`setTimeOut()` 允许在执行代码前有一个固定的延迟；`setTimeInterval()`
    允许代码以固定的间隔重复执行。例如：


    `setTimeOut(a, 1000)` 在 1000 毫秒（1 秒）后执行函数 a。


    `setTimeInterval(a, 1000)` 以 1000 毫秒（1 秒）的间隔重复执行函数 a。


