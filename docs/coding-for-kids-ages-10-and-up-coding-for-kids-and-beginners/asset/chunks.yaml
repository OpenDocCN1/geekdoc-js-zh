    # JavaScript Elements


    ![image](d2d_images/chapter_title_below.png)


    With that basic knowledge, let’s have a look at some basic JavaScript elements.


    functions


    A function in JavaScript is a set of lines of code that performs a certain task.


    It is defined in JavaScript within the script tags as:


    ```javascript

    function afunc()

    {

    //Enter function code here

    }

    ```


    The name of the function is `afunc` and the code within the curly brackets is
    executed each time `afunc` is called on.


    It is useful to have functions when we want to perform the same task several times
    in the same program. We can just call on the function instead of writing the same
    lines of code several times.


    Variables


    A variable in JavaScript is a placeholder that takes on a certain value. The value
    can be changed throughout the program and can be used in other parts of the code.
    Let’s take an example:


    `var x=5;`


    `x` is the variable defined. It starts with a value of 5.


    Later on, in the program, it can be changed to a different value, as in:


    `x=10;`


    Now, `x` has a value of 10\. And, if we do:


    `x=x-1;`


    Then `x` becomes 9\. What we just showed is an integer variable. We can also have
    string variables used to store text values, as in:


    `var b=”abcd”`


    `b` is a variable that holds the value `abcd`.


    And finally, we can have Boolean variables that holds only true/false values.
    For example:


    ```javascript

    var c = true;

    var d = (7>5);

    var e = (7<6);

    ```


    Variables `c`, `d` and `e` are all Boolean variables. Variable `c` is assigned
    to `true`. Variable `d` is `true` (because 7 is greater than 5). Variable `e`
    is `false` (because 7 is not less than 6).


    `document.write()`


    `document.write()` is used to print elements on the web page. Anything that is
    within the brackets is printed on the web page. For example:


    `document.write(“Example print”);`


    The above line prints the words “Example print” on the screen.


    We can also print variables on the screen. For example,


    ```javascript

    var a=7;

    document.write(a)

    ```


    Above line prints 7 on the screen.


    And, we can combine different elements also using “+” operator. For example:


    ```javascript

    var a=7;

    document.write(“The number printed is “+a);

    ```


    The above line prints “The number printed is 7”.


    `alert()`


    Alert puts a pop-up on the screen with a particular message. For example,


    `alert(“Hello”)`


    The above message has a pop-up message that says “Hello”


    ![image](d2d_images/image205.png)


    `prompt()`


    `prompt` has the same popup but what a textbox that allows user input. The user
    input can be stored in a variable. For example:


    `var name = prompt(“What is your name”);`


    It shows a pop-up. Once the user enters his name and says ok, it stores the value
    in the variable `name`.


    ![image](d2d_images/image047.png)


    `document.getElementById().value`


    `Document.getElementById().value` is used to get html elements into JavaScript
    variables. So, we need to use the id of the html element and put it in between
    brackets. Let’s look at an example.


    Let’s look at below html element:


    `Enter number: <input name=”x” type=”number” id=”test” size=”20”><br>`


    JavaScript code:


    `var testv=document.getElementById(“test”).value;`


    The html element is a form textbox that accepts a number from the user.


    In Javascript, the number that the user assigns is set to the variable `testv`.


