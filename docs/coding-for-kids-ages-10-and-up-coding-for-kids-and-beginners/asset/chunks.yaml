    虽然 HTML 用于创建网页结构，CSS 用于定义网页样式，但 JavaScript 则用于让网页与用户进行更多交互。它允许不同的 HTML 元素相互交互、执行计算、动画等。换句话说，它让网页编程变得有趣。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # 在 HTML 中使用 JavaScript


    ![image](img/chapter_title_below.png)


    在 HTML 网页中使用 JavaScript 有两种方式。第一种是直接在 HTML 的 `<script>` 标签内添加代码。如下方代码的蓝色部分所示。


    ```html

    <html>

    <head><title>测试文件 1</title>

    </head>

    <body>

    <script>

    // 在此处输入 JavaScript 代码

    </script>

    </body>

    </html>

    ```


    第二种方式是创建一个包含代码的外部 JavaScript 文件，并将其保存为 `.js` 文件。然后你可以将该文件链接到 HTML 内容中。例如，假设你创建了一个名为
    `test.js` 的文件。你可以通过下方代码的蓝色部分进行链接：


    ```html

    <html>

    <head><title>测试文件 2</title>

    </head>

    <body>

    <script src=" test.js"></script>

    </body>

    </html>

    ```


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # JavaScript 元素


    ![image](img/chapter_title_below.png)


    有了这些基础知识，让我们来看一些基本的 JavaScript 元素。


    函数


    JavaScript 中的函数是一组执行特定任务的代码行。


    它在 JavaScript 中定义在 `<script>` 标签内，如下所示：


    ```javascript

    function afunc()

    {

    // 在此处输入函数代码

    }

    ```


    函数的名称为 `afunc`，每次调用 `afunc` 时，都会执行花括号内的代码。


    当我们需要在同一个程序中多次执行相同任务时，使用函数非常有用。我们可以直接调用函数，而不必多次编写相同的代码行。


    变量


    JavaScript 中的变量是一个占位符，用于存储某个值。该值可以在程序运行过程中改变，并可在代码的其他部分使用。我们来看一个例子：


    `var x=5;`


    `x` 是定义的变量，初始值为 5。


    之后在程序中，它可以被更改为其他值，例如：


    `x=10;`


    现在，`x` 的值为 10。如果我们执行：


    `x=x-1;`


    那么 `x` 变为 9。我们刚才展示的是一个整数变量。我们也可以使用字符串变量来存储文本值，例如：


    `var b=”abcd”`


    `b` 是一个变量，其值为 `abcd`。


    最后，我们还可以使用布尔变量，它只存储 true/false 值。例如：


    ```javascript

    var c = true;

    var d = (7>5);

    var e = (7<6);

    ```


    变量 `c`、`d` 和 `e` 都是布尔变量。变量 `c` 被赋值为 `true`。变量 `d` 为 `true`（因为 7 大于 5）。变量 `e` 为
    `false`（因为 7 不小于 6）。


    `document.write()`


    `document.write()` 用于在网页上打印元素。括号内的任何内容都会打印在网页上。例如：


    `document.write(“示例打印”);`


    上面的代码会在屏幕上打印出“示例打印”这几个字。


    我们也可以打印变量。例如：


    ```javascript

    var a=7;

    document.write(a)

    ```


    上面的代码会在屏幕上打印出 7。


    我们还可以使用“+”运算符组合不同的元素。例如：


    ```javascript

    var a=7;

    document.write(“打印的数字是 “+a);

    ```


    上面的代码会打印出“打印的数字是 7”。


    `alert()`


    Alert 会在屏幕上弹出一个包含特定消息的对话框。例如：


    `alert(“你好”)`


    上面的代码会弹出一个显示“你好”的对话框。


    ![image](img/image205.png)


    `prompt()`


    `prompt` 具有相同的弹出框，但带有一个允许用户输入的文本框。用户输入可以存储在一个变量中。例如：


    `var name = prompt(“你叫什么名字”);`


    它会显示一个弹出框。用户输入姓名并点击确定后，该值会存储在变量 `name` 中。


    ![image](img/image047.png)


    `document.getElementById().value`


    `Document.getElementById().value` 用于将 HTML 元素的值获取到 JavaScript 变量中。因此，我们需要使用 HTML
    元素的 id，并将其放在括号内。让我们看一个例子。


    请看下面的 HTML 元素：


    `输入数字： <input name=”x” type=”number” id=”test” size=”20”><br>`


    JavaScript 代码：


    `var testv=document.getElementById(“test”).value;`


    该 HTML 元素是一个表单文本框，用于接收用户输入的数字。


    在 JavaScript 中，用户输入的数字被赋值给变量 `testv`。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # 如何添加注释


    ![image](img/chapter_title_below.png)


    注释是你添加到代码中用于记录或解释代码的内容。注释不会被执行，也不会影响程序。在 JavaScript 中，注释通过在注释内容前添加两个反斜杠（“//”）来添加。


    ![image](img/image171.png)


    下面是一个注释示例。注释部分为绿色，并用红色圆圈标出。


