  trans: '


    变量 `remletters` 是剩余待猜字母的数量。创建了一个 `while` 循环，只要 `remletters > 0`，就接受用户的猜测。


    使用 `prompt`，我们接受用户输入的单个字母。如果输入的字母超过一个，我们会设置一条错误消息，并要求用户只输入一个字母。一旦用户输入了一个字母，我们就进入一个循环，检查随机动物的每个字母是否与用户输入的字母匹配。每次匹配时，我们将
    `remletters` 减 1，并用匹配的字母更新 `answerArray` 的相应部分。在 `while` 循环结束时，用户已经猜出了动物，我们会打印一条祝贺消息，并显示动物的名称。


    在 `while` 循环中的任何时刻，如果用户没有输入字母并试图继续，我们会退出程序循环并打印出动物名称。


    游戏结束时，用户可以选择使用“主页”按钮重新启动程序。以下是带有一些示例的代码。


    ![image](img/image044.png)


    ![image](img/image083.png)


    输出 #1


    ![image](img/image163.png)


    以下是显示答案长度的起始点。


    ![image](img/image070.png)


    猜第一个字母。用户输入 ''t''


    ![image](img/image186.png)


    没有 ''t''。所以我们再试一次。


    ![image](img/image007.png)


    用户输入 ''k''


    ![image](img/image008.png)


    答案中没有 ''k''。仍然没有猜对。


    ![image](img/image024.png)


    现在，用户输入 ''o''


    ![image](img/image122.png)


    终于，用户猜对了。单词以 ''o'' 结尾，我们在更新后的答案中看到了这一点。


    ![image](img/image058.png)


    所以，再猜几次后，我们得到了下面的答案。只差一个字母了。


    ![image](img/image170.png)


    用户猜 ''n''。


    ![image](img/image020.png)


    猜对了。整个单词是 flamingo。


    ![image](img/image193.png)


    然后，程序在下方显示正确答案。


    ![image](img/image031.png)


