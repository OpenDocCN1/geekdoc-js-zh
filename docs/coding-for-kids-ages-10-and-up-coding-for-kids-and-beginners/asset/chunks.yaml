    # 练习题


    ![image](img/chapter_title_below.png)


    › 创建一个简历程序，通过表单接收多个候选人，并将他们存储在单独的数组中。一个数组存放姓名，一个存放城市，一个存放大学，一个存放 GPA。打印出所有位于特定城市的姓名。


    › 编写一个关于美国总统的问答程序。创建一个包含所有美国总统的数组。再创建另一个数组，其中包含每位总统的一个著名事实。程序随机选择一个事实呈现给用户，用户猜测是哪位总统。


    › 编写一个程序，列出经销商库存中的所有汽车，存放在一个数组中。另一个对应的数组存放这些汽车的价格；第三个数组存放制造年份。程序接收用户输入的车型年份，并打印出所有年份比该年份更新的汽车及其价格。


    › 编写一个程序，玩体育版猜词游戏。选择一项运动，然后选择该运动中你最喜欢的 20 名运动员。将这些运动员放入一个大小为 20 的数组中，让用户像玩猜词游戏一样猜测字母。


