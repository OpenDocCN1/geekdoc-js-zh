    # 不同方向移动的小球


    ![image](img/chapter_title_below.png)


    在下面的示例中，我们使用定时器和球体函数，通过四个按钮让小球向四个不同方向移动。每个按钮运行一个函数，使小球朝特定方向移动。


    例如，如果按下“向下”按钮，它会通过 `MoveDown()` 函数使小球向下移动。一旦小球到达画布底部，它会从顶部重新开始。


    在每个函数中，我们设置一个位置变量来表示小球的起始点。在 `MoveUp()` 和 `MoveDown()` 中，我们分别将 y 位置设置为 500 和 0。使用
    `setInterval` 函数，每 50 毫秒（0.05 秒）将位置变量增加或减少 5 像素，从而移动小球。并且，我们使用 `if` 函数检查小球是否到达画布边缘，如果是，则将其重置回原始位置。


