  trans: "\n\n罗布和其他人的故事激励我写了下一本 JavaScript 书。虽然罗布看起来可能有些挣扎，但他的努力值得称赞。我们中有太多人一遇到困难就放弃。我们像玩毛线球的小猫一样，从一个活动跳到另一个活动。事实是，没有哪项活动能不经努力和痛苦就取得进步。罗布只是需要再多一点努力，而这正是本书所包含的内容。\n\
    \n本书从一些基础知识开始，确保你具备继续前进所需的基本知识。我们将讨论如何设置工作区、进行基本编程和测试。然而，本书的重点在于编写游戏、活动和谜题。这些内容旨在让你对编程所能实现的目标产生更深的热爱。我们深知这类编程游戏对学习过程的重要性。它们能激发乐趣和好奇心，让每个参与者都感到兴奋。书中还有一个非常重要的章节，关于编程中“软技能”的一面。这一章将讨论如何通过自我发现、团队合作、自律和健康习惯来提升你的编程能力。这些软技能才能真正帮助罗布在编程道路上不断前进。\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 编程的软技能\n\n![image](img/chapter_title_below.png)\n\
    \n我在教孩子们编程的经历，以及从罗布那里听到的反馈，让我确信软技能和编程技术知识同样重要。这些软技能还能帮助你在生活的其他方面不断进步。所以，这完全是双赢。\n\
    \n那么，软技能到底是什么？软技能更多地与人们如何工作相关。这与硬技术技能不同，后者关注的是人们做什么工作。软技能涉及人们如何处理心理、身体和人际问题。结合良好的技术知识，软技能可以将你的表现提升到一个更高的水平。以下是我所谈论的一些技能：\n\
    \n*   **专注与集中：** 在一个被社交媒体和其他干扰主导的世界里，专注于手头单一任务的能力是一项难以掌握的技能。多任务处理可能看起来很酷，但从长远来看，它会损害工作质量和教育质量。\n\
    \n    › 一个帮助你集中注意力的新工具叫做等时音。这是一种特定的音乐，能让你的大脑进入正确的状态，帮助你集中注意力。你可以通过在 YouTube 或谷歌上搜索“isochronic\
    \ tones”免费试听这些音调。\n\n    › 另一个工具是每日冥想。每天开始时冥想 5 分钟，可以帮助你逐渐建立专注力。\n\n    › 最后，将工作分解成\
    \ 20-30 分钟的时间段可以带来很大的不同。在每个时间段之间散步 5-10 分钟，然后精神焕发地回来。\n\n*   **毅力：** 坚持不懈并从失败中学习的能力在编程中非常重要。程序员们通常会尝试破坏代码（或让代码失败），以便了解程序的弱点并加以改进。你也可以对你的程序和你的编程技能做同样的事情。\n\
    \n*   **团队合作：** 刚开始时独自编程是必要的，但从长远来看会限制你的发展。从别人的错误中学习比从自己的错误中学习要快得多。你可以加入你所在城市的本地编程俱乐部；聘请编程导师；加入相关的\
    \ Facebook 编程群组；在 Reddit 帖子上发帖；从 GitHub 代码中学习。积极参与这些群体并被认可为积极的贡献者非常重要。\n\n*  \
    \ **身体健康：** 这是许多程序员非常低估和忽视的特质。但从长远来看，这确实会伤害行业中的从业者。背部问题、肥胖、腕管综合症是程序员在行业工作 5-10\
    \ 年或更长时间后常见的健康问题。以下是一些更好地照顾健康的方法。\n\n    › 保持良好的坐姿：坐直。确保笔记本电脑与眼睛水平，这样你就不必低头。确保你的脚与膝盖对齐。\n\
    \n    › 经常休息：我建议每 20-30 分钟休息一次。在休息期间散步。\n\n    › 饮食：保持健康的饮食，富含优质脂肪、蛋白质和复合碳水化合物。尽量减少简单碳水化合物和糖的摄入。\n\
    \n    › 锻炼：保持规律的锻炼计划或进行一项运动。每周至少锻炼 3-4 次（可能更多）很重要。\n\n    › 睡眠：每晚至少睡 7-8 小时。如果你无法入睡，请咨询合格的医生如何改善睡眠。\n\
    \n以上每个主题都可以写成整本书，但这是一本编程书，所以我就不多说了。只需记住，上述软技能非常重要，你可以在编程的同时培养它们。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 设置你的工作区\n\n![image](img/chapter_title_below.png)\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 你需要什么\n\n![image](img/chapter_title_below.png)\n\n你需要一台联网的笔记本电脑/台式机，并安装一个网页浏览器。我推荐使用\
    \ Mozilla Firefox 或 Google Chrome。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 下载/安装文本编辑软件\n\n![image](img/chapter_title_below.png)\n\n下载最新版本的文本编辑软件。我推荐下载\
    \ NotePad++。下载后，双击`Setup.exe`文件并按照安装提示操作。\n\n[`notepad-plus-plus.org/downloads/`](https://notepad-plus-plus.org/downloads/)\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 开始使用 NotePad++\n\n![image](img/chapter_title_below.png)\n\
    \n从桌面或开始菜单打开 Notepad++\n\n![image](img/image082.png)\n\n现在，点击`文件>新建`打开一个新文件。\n\
    \n![image](img/image061.png)\n\n![image](img/image103.png)\n\n现在，选择`文件>另存为`，并选择`.html`作为文件类型![image](img/image030.png)\n\
    \n![image](img/image092.png)\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 测试程序\n\n![image](img/chapter_title_below.png)\n\n现在，让我们测试程序是否与浏览器连接。\n\n只需在文件中输入随机文本。在我的文件中，我输入了“这是一个测试消息。”\n\
    \n现在`文件>保存`。\n\n之后，根据你使用的浏览器，点击`运行>在 Firefox/Chrome/IE 中启动`。\n\n如果一切正常，你输入的文本应该会显示在浏览器窗口中。\n\
    \n![image](img/image177.png)\n\n![image](img/image005.png)\n\n![image](img/image002.png)\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 结果：\n\n![image](img/chapter_title_below.png)\n\
    \n![image](img/image045.png)\n\n这是一个简单有效的方法，确保你的程序在继续前进之前能够正常工作。\n\n附注：\n\n"
