    # 鼠标点击示例


    ![image](img/chapter_title_below.png)


    在下面的示例中，用户检查鼠标是否在画布上被点击。它使用以下代码检查点击：


    `$(“#canvas”).click(mousec)`


    `canvas` 是 HTML 画布的名称，`mousec` 是点击鼠标时运行的函数名称。在函数内部，用户写入鼠标已被点击。


