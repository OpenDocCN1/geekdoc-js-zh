    # 增长的径向圆形


    ![image](img/chapter_title_below.png)


    径向圆形与普通圆形非常相似。径向圆形可以控制圆的颜色、背景，还可以在圆与背景之间的边界上添加额外的颜色。在下面的示例中，我们创建了一个红色径向圆形，背景为蓝色，并且红色球体有一个黄色边界，类似于一个圆环。


    在下面的示例中，使用 `createRadialGradient()` 来创建圆形。其工作原理如下：


    `createRadialGradient(a,b,c,d,e,f)` 创建一个内圆，圆心为 (a,b)，半径为 c。第二个圆创建一个圆心为 (d,e)、半径为
    f 的圆。如果想要一个环形圆，则应将它们置于同一圆心，即 (a,b) = (d,e)。


    在下面的示例中，我们有一个内圆和一个外圆，圆心都在画布中心 (250,250)。外圆的半径始终比内圆大 20 像素。


    内圆颜色通过 `addColorStop(0,"red")` 设置为红色，背景通过 `addColorStop(1,"blue")` 设置为蓝色。最后，外圆颜色通过
    `addColorStop(0.5,"yellow")` 设置为黄色。


    径向圆形每 50 毫秒（0.5 秒）增长 5 像素。如果圆的尺寸超出画布，则将其重置为 10 像素。


