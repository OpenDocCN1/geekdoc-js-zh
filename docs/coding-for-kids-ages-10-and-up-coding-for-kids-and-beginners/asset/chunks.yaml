    # 引言


    ![image](img/chapter_title_below.png)


    罗布已经在电脑前坐了几个小时。他正在编写他的 JavaScript 游戏的下一个版本。在过去一个月取得很大进展后，他现在卡住了。他尝试了很多不同的方法，但就是无法让它工作。这是编程中常见的问题。学习编程的基础知识是一个好的开始。罗布几个月前读了我的第一本编程书，他非常兴奋。他不仅很好地掌握了基础知识，成功完成了所有练习，还实现了一些自己的程序和有趣的编程游戏。他热爱编程，并且上了瘾。


    然而，几个月后，罗布卡住了。他感到疲惫和无聊。他一遍又一遍地做着类似的程序。他在更高级的主题上挣扎。罗布的故事与美国乃至全世界成千上万的孩子相似。这些孩子有资源和金钱来继续前进。他们中的一些父母花了一个月的工资（有时甚至更多）给孩子买了一台笔记本电脑来编程。然而，父母和孩子们都意识到他们需要更多才能继续前进。缺少了一些东西。一些难以量化的东西。


    '
- fmt: "\nThe story of Rob and others inspired me to write the next Javascript book.\
    \ While Rob might seem to be struggling, he needs to be commended for his effort.\
    \ Too many of us give up at the first sight of difficulty. We move on from activity\
    \ to activity with the mindset of a kitten playing with a ball of yarn. The truth\
    \ is that there is no movement forward in any activity without a little bit of\
    \ effort and pain. Rob just needs that little bit more, and that’s contained in\
    \ this book.\n\nThis book starts off with some of the basics to ensure that you\
    \ have the basic knowledge needed to more forward. We’ll talk about setting up\
    \ your workspace and doing basic programming and testing. However, this book does\
    \ have a strong emphasis on coding games, activities and puzzles. These are meant\
    \ to embed a deeper love for what programming can accomplish. We realize how important\
    \ these kind of coding games are to the learning process. It imbibes a sense of\
    \ fun and curiosity which is very exciting for everyone involved. There is also\
    \ a very important section on the softer side of programming. This chapter talks\
    \ about how to improve your coding through self-discovery, teamwork, self-discipline\
    \ and healthy habits. These are the soft skills that would really help Rob move\
    \ forward in programming.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Soft Skills of Coding\n\n![image](d2d_images/chapter_title_below.png)\n\n\
    My experiences with teaching kids coding, and also from hearing from Rob have\
    \ convinced me that soft skills are just as important as technical knowledge in\
    \ coding. These soft skills also help you with all other aspects of life moving\
    \ forward. So, it’s a win-win all the way around.\n\nSo, what exactly are soft\
    \ skills? Soft skills relate more to how people work. This is different from hard\
    \ technical skills which focus on what people work on. Soft skills relate to how\
    \ people deal with mental, physical and interpersonal problems. In combination\
    \ with good technical knowledge, soft skills can take your performance to a higher\
    \ level. Here are some of the skills that I am talking about:\n\n*   **Focus and\
    \ Concentration:** Ability to focus on a single task at hand is a tough skill\
    \ to master in a world dominated by social media and other distractions. Multi-tasking\
    \ may seem cool; but in the long run it takes away from quality work and quality\
    \ education.\n\n    › A new tool to help you focus is something called isochronic\
    \ tones. This is specific music that gets your mind in the right frame and helps\
    \ you focus. You can check out these tones for free by searching ‘isochronic tones’\
    \ on Youtube or Google.\n\n    › Another tool is daily meditation. Meditation\
    \ for 5 minutes at the start of the day can help you build focus over time.\n\n\
    \    › And finally, breaking your work down into periods of 20-30 minutes can\
    \ make a big difference. Take a 5-10 minute walk between each session and come\
    \ back refreshed.\n\n*   **Perseverance:** The ability to persist and learn from\
    \ failures is very important in coding. It’s common practice among programmers\
    \ to try to break the code (or make the code fail) so they can learn the weak\
    \ points in a program, and make it improve. You can do the same for your program\
    \ and for your programming skill.\n\n*   **Teamwork:** Going at coding alone is\
    \ necessary when starting off; but will hold you back in the long run. You can\
    \ learn a lot faster from the mistakes of others; than from your own mistakes.\
    \ You can join a local programming club in your own city; hire a programming tutor;\
    \ join relevant facebook coding groups; post on redditt threads and learn from\
    \ Github code. It’s important to be active on these groups and recognized as a\
    \ positive contributor.\n\n*   **Physical Health:** This is a very underrated\
    \ and undervalued trait by many programmers. But in the long run, it really hurts\
    \ people in the industry. Back problems, obesity, carpal tunnel syndrome are common\
    \ health issues that programmers encounter after working in the industry for 5-10\
    \ years or more. Here’s a few ways to take better care of your health.\n\n   \
    \ › Maintain a good sitting posture: Sit upright. Make sure your laptop is close\
    \ to eye level, so you don’t have to bend your neck down. Make sure your feet\
    \ are in line with your knees.\n\n    › Take frequent breaks: I recommend taking\
    \ breaks every 20-30 minutes. Take a walk in between periods.\n\n    › Diet: Maintain\
    \ a healthy diet high in good fats, protein and complex carbs. Minimize simple\
    \ carbs and sugar.\n\n    › Exercise: Maintain a regular exercise regime or play\
    \ a sport. It’s important to exercise at least 3-4 times a week (maybe more).\n\
    \n    › Sleep: Get at least 7-8 hours of sleep every night. If you’re unable to\
    \ sleep, ask a qualified doctor how you can improve your sleep.\n\nOne can write\
    \ entire books on each of the above topics; but this is a coding book, so I will\
    \ leave it there. Just remember that the above soft skills are very important\
    \ and you can work on them while you are coding as well.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Setting Up Your Workspace\n\n![image](d2d_images/chapter_title_below.png)\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# What You Need\n\n![image](d2d_images/chapter_title_below.png)\n\
