    # 代码解释


    ![image](img/chapter_title_below.png)


    我们首先定义代码的 html 和 body。文本被转换为大写并居中。在蓝色背景上显示为白色。距离顶部边距 50 像素。字体为 25 像素、正常粗细、无衬线的
