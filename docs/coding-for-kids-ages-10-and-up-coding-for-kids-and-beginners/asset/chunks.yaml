    # 在画布上创建圆形


    ![image](img/chapter_title_below.png)


    在 JavaScript 中，创建圆形需要 5 个步骤。下面的代码展示了这一过程。


    第一步是使用 `document.getElementByID` 将 HTML 元素转换为 JavaScript 变量。然后使用 `getContext("2d")`
    将其转换为 2D 绘图元素变量。在下面的示例中，变量 `c2x` 就是绘图元素。


    在 JavaScript 中，我们可以用 `beginPath()` 开始任何绘图，然后用 `clearRect` 清除画布。`clearRect` 的工作原理如下例所示：


    `clearRect(a,b,c,d)` 表示矩形的左上角起始于 x 坐标 a 和 y 坐标 b；其宽度为 c，高度为 d。因此，我们从 (a,b) 开始，清除宽度为
    c、高度为 d 的画布区域。在下面的示例中，我们从 (0,0) 开始，清除整个宽度为 500 像素、高度为 500 像素的画布。这使得整个画布变为空白，准备绘图。


    接下来，我们使用 arc 函数绘制圆形。那么，让我们看看它是如何工作的：


    `arc(a,b,c,d,e)` 是我们绘制圆形的方式。(a,b) 是圆心；a 为 x 坐标，b 为 y 坐标。c 是圆的半径。d 是圆弧的起始部分。e 是圆弧的结束部分。


    d 和 e 以弧度为单位。对于一个完整的圆，d 和 e 分别为 0 和 2π。对于一个半圆，d 和 e 在 0 到 π 之间。


    在下面的示例中，圆 1 的圆心在 (50,50)，半径为 20 像素。圆 2 的圆心在 (250,250)，半径较大，为 70。圆 3 实际上是一个半圆，因为它从
    0 弧度到 π 弧度。它靠近右下角，位于 (350,350)，半径为 50 像素。


    最后一步，我们使用 `stroke()` 绘制圆形。如果要填充圆形，则使用 `fill()`。我们可以通过 `fillStyle()` 更改颜色。


