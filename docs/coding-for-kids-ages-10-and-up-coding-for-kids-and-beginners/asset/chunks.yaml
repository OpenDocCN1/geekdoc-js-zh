    # IF 循环示例 2


    ![image](img/chapter_title_below.png)


    我们再举一个例子。假设你想选择加入哪个健身房。你希望加入距离在 5 英里以内且月费低于 60 美元的健身房。因此，你需要两个 IF 循环来分别检查每个条件。这两个循环是嵌套的，称为嵌套循环。下面我们来看一下。


    ![image](img/image116.png)


    上面的 HTML 表单允许用户输入健身房名称（id=`gname`）、距离（id=`dist`）和月费（id=`memc`）。JavaScript 变量`name`、`gymdistance`和`memberprice`存储用户输入的值。第一个
    IF 语句检查`gymdistance`是否小于 5。如果大于 5，则健身房不合适。如果小于 5，则使用另一个 IF 检查月费是否低于 60 美元。如果是，则这是一个可能的健身房；否则不合适。以下是几个示例输出。


    输出 #1：


