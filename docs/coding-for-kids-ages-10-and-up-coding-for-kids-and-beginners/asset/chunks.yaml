    # 循环


    ![image](img/chapter_title_below.png)


    编程中的循环是一组重复执行一定次数的指令序列。


    可以把循环想象成自动扶梯。扶梯的台阶会朝着一个方向反复运行，直到有人按下停止按钮。


    根据执行条件的不同，循环分为 3 种类型。它们是：


    - **IF 循环**：IF 循环包含一组指令，当满足特定条件时执行。如果条件不满足，则不执行循环。

    - **FOR 循环**：FOR 循环包含一组指令，按指定次数执行。例如，从 1 到 10 的 FOR 循环会执行循环内的代码 10 次。

    - **WHILE 循环**：WHILE 循环是一组指令，会一直执行直到满足特定条件。


    现在，我们通过每种循环来看看电梯的例子。


    假设我们希望电梯仅在楼内人数超过 1000 时运行。那么我们可以使用 IF 循环来检查楼内人数，如果满足条件则运行电梯函数。


    IF 循环示例：


    ```

    if(people>1000)

    {

    Runelevator();

    }

    ```


    现在，如果我们想对电梯进行 1000 次运行测试，以检查它是否能承受一定重量，我们可以使用 FOR 循环。下面的 FOR 循环从 0 开始，到 999 结束，因此电梯会运行
    1000 次。


    ```

    for (i=0;i<1000;i++)

    {

    Runelevator();

    }

    ```


    最后，如果我们希望电梯一直运行到下午 6 点，我们可以使用 WHILE 循环。


    ```

    While (checktime!=18:00)

    {

    Runelevator();

    }

    ```


    以上是三种循环的简单示例，用于解释循环的概念。这个概念在编程中非常重要。


    现在，让我们用 JavaScript 做一些示例。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


