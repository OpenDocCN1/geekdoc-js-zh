    # 代码解释


    ![image](img/chapter_title_below.png)


    ```

    <img id="myImage" src="DayImage.jpg" style="width:200px">

    ```


    上面的 HTML 元素是一个图片标签。它包含三个属性：`id`、`src` 和 `style`。


    `id` 是图片的标识符。在这个例子中，它被标记为“myImage”。`id` 用于在整个程序中引用该图片。


    `src` 是标签加载的图片源。图片“DayImage.jpg”与 HTML 文件位于同一文件夹中。


    ```

    <button onclick="document.getElementById(''myImage'').src=''DayImage.jpg''">Day</button>

    ```


    上面的元素是一个按钮元素。它有一个名为 `onclick` 的参数，描述了点击按钮时执行的操作。


    `document.getElementById` 获取 id 为“myImage”的元素。因此，当你点击按钮时，它会在“myImage”上显示“DayImage.jpg”。


    “Day”是按钮上显示的文本。


    ```

    <buttononclick="document.getElementById(''myImage'').src=''NightImage.jpg''>Night</button>

    ```


    `document.getElementById` 获取 id 为“myImage”的元素。因此，当按钮被点击时，它会在“MyImage”上显示“NightImage.jpg”。


    “Night”是按钮上显示的文本。


