    # 示例 2


    ![image](img/chapter_title_below.png)


    在下面的示例中，我们模拟了 6 名玩家之间的掷骰子游戏。


    基本上，掷骰子游戏进行 10 次；根据骰子落在 1 到 6 之间的哪个数字，玩家获得相应的分数。例如，如果骰子落在 1 上，玩家 1 加一分；如果落在 2
    上，玩家 2 加一分，以此类推。骰子的值通过 `Math.Random()` 函数在 1 到 6 之间模拟。


    程序开始时，声明了一个对象 `gameplayer`。属性是玩家的名字，值是获得的分数。


    在函数 `dicegame()` 中，有一个 `FOR` 循环，运行 `gamecalc()` 10 次。在 `gamecalc()` 中，随机选择一个 1
    到 6 之间的数字，模拟掷骰子。根据骰子落在哪个数字上，对应玩家的属性值增加 10。


    在 `FOR` 循环结束时，我们在下方打印出每位玩家获得的分数。


