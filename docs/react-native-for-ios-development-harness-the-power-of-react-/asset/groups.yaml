    ## 第一章


    ## 基础知识：React 快速概览


    > “千里之行，始于足下。”

    —— 老子


    在开启你的 React Native 之旅之前，你必须稍微了解一下 React（也称为 JS 或 React.js）。在本章中，你将快速浏览 React 的核心概念，这些概念将帮助你学习
    React Native。React 与大多数流行的 Web 技术不同，随着本章内容的的进行，你将了解到其中的原因。如果你在传统框架上花费了大量时间，那么它的核心概念将真正打开你的思维，让你用全新的思考方式；这种新的思维方式有时被称为“React
    思维”。你可能听过“编写一次，随处运行”这句话。哇，但由于各种因素（网页、移动端、平板电脑）的激增，人们认为这几乎是不可能的。React 看起来非常不同且令人自由。你将从
    React 的快速概览开始第一章，这将帮助你为 React Native 做好准备。如果你已经具备 React 的基础知识，可以跳过本章直接进入第二章。


    React 是一个用于构建用户界面的 JavaScript 库。它由 Facebook 和 Instagram 团队共同开发。React 于 2013 年首次引入世界，并迅速风靡，获得了社区的广泛认可，并受益于它是
    Facebook 核心技术。根据官方文档，某些人将 React 视为 MVC 中的 V，因为 React Native 对所使用的其他技术栈不作任何假设。你可以使用任何你需要的技术，并使用
    React Native 创建应用程序的某一个部分；你也可以方便地对已创建的应用程序进行更改。


    ## 为什么选择 React？


    在充满 JS 库和框架的世界里，我们还需要另一个 JavaScript 库吗？几乎没有哪一个月没有新 JS 框架的问世。


    React 的出现是因为它的创造者面临着一个重大问题：如何构建数据频繁变化的大型应用程序。这个问题出现在几乎任何现实应用中，而 React 的创建从底层开始就是为了解决这个问题的。如你所知，许多像
    MVC 或 MVVM 这样的流行框架是为了供使用和迭代而存在的：React 并不是 MVVM。它只是一个用于构建可组合用户界面的库，用于处理随时间发生变化的
    UI 组件。React 通过将 UI 拆分为许多组件来构建用户界面。仅仅此而已。这意味着 React 使用编程语言的完整特性来构建和渲染视图。


    以下是为你的项目选择 React 的一些优势：


    -   React 广泛使用 JavaScript：传统上，HTML 中的视图与 JavaScript 中的功能是分离的。在 React 中，组件被创建出来，并且有一个单一的区域，JavaScript
    对你的 HTML 有深入的了解。

    -   可扩展且易于维护：组件由统一的标记及其视图逻辑组成，这实际上使得 UI 易于扩展和维护。

    -   虚拟 DOM：React 运行极快。这归功于虚拟 DOM 及其差异算法（diffing algorithm）。

    -   单向数据流：双向绑定是一个很好的主意，但在现实应用中，它带来的痛苦多于收益。双向绑定的一个常见缺点是，你不知道数据是如何更新的。通过单向数据流，事情变得简单了：你确切知道数据在哪里发生了变动，这使得维护和测试应用程序变得更容易。


    为了对新技术建立坚实的基础，理解其核心概念是必要的。在下一节中，你将探索 React 的几个独特概念，这将让你离理解这项技术更近。


    ## 虚拟 DOM


    在所有应用程序中，应用面临的最昂贵操作之一就是修改 DOM。为了解决这个问题，React 维护了 DOM 的虚拟表示（如图 1-1 所示），被称为虚拟 DOM
    或 VDOM。配合差异算法，React 能够与实际 DOM 竞争，并仅更新变化的 DOM 部分。因此，变化量更少，从而导致了极快的运行速度。你可能看不到，但随着你的项目膨胀到惊人的复杂程度（这通常发生在现实应用中），你将开始看到用户体验流畅体验带来的益处。


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_14_0.png)


    图 1-1 虚拟 DOM 和差异算法操作


    手动操作 DOM 是混乱的，而且跟踪 DOM 的上状态是非常困难的。如图 1-1 所示，React 通过保留两个虚拟 DOM 副本来解决这个问题。接下来，在这两个虚拟
    DOM 上应用差异算法，它本质上是检查发生的变化并返回一系列 DOM 操作。这些 DOM 操作会被应用到真实的浏览器 DOM 上。


    现在让我们从组件的角度来理解虚拟 DOM 是如何工作的。在 React 中，每个组件都有状态（state）；这个状态是可观测的。每当状态发生变化时，React
    本质上就知道这需要重新渲染。因此，当应用程序状态更改时，它会生成一个新的 VTree；再次，差异算法共享了所需变化的 DOM 路径，如图 1-2 所示。这使得手动
    DOM 操作减少到最低。


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_15_0.png)


    图 1-2 带有虚拟 DOM 的组件


    虚拟 DOM 的这一特性不仅重要，而且是杀手锏。DOM 访问非常缓慢，谦率地说，世界由于操作 DOM 而变得更糟糕。为了让你的应用程序运行快速，你应该尽可能少地触碰
    DOM，这通过虚拟 DOM 的实现得到了优雅的处理。在小型应用中你可能不会注意到这一点，但一旦你的应用增长到拥有数千个元素，React 将不会让你的性能受到影响。


    ## 单向数据流


    React 是 MVC 模式中主要的 V，在深入 React 的单向数据流概念之前，你必须理解 MVC 的挑战。MVC 框架最大的挑战之一是管理视图。如你所知，MVC
    框架的视图组件主要是 DOM 的表示。当你编写与 DOM 交互的代码时，它是简单的，但对于 React 处理各种 DOM 操作来说非常复杂。


    传统的 MVC 视图通常包含大量的 UI，当数据即使为了一个微小元素变化时，它最终会再次渲染应用程序，循环继续。这种现象是因为通常大多数此类 MVC 框架遵循双向绑定（见图
    1-3）。


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_16_0.png)


    图 1-3 双向绑定


    在 JavaScript 中，数据在内存中变化并绑定到 UI 中的视图，这意味着当修改 JavaScript 中的数据时，UI 中的数据也会随之改变。反之，当
    UI（即 DOM）中的数据通过点击按钮或其他任何事件变化时，内存也会相应的更新，保持两者同步。理论上，这完美无缺，这个想法是完美的。然而，在现实应用中，当你拥有一个多个视图表示其中一个模型数据的相当复杂且大型应用程序时，问题就会出现。随着你添加更多的模型和视图，这种双向绑定会随着加入数据的数据的变化而变成一团乱麻（spaghetti），有时会导致无限事件循环，其中一个视图更新模型，模型反过来更新视图，以此此类推，如图
    1-4 所示。


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_16_1.png)


    图 1-4 不受欢迎的意大利面式关系


    '
