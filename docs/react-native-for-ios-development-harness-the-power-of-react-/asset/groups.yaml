    - React JSiddle: https://jsfiddle.net/react-js/5vjqab3/


    Another way is to download the complete kit to even work offline: http://facebook.github.io/react/downloads/react-0.13.3.zip


    You may also install react-tools using npm: npm install -g react-tools.'
