    # MVC Pattern


    Historically, the MVC pattern separates code into three distinct parts: model,
    view, and controller. The main purpose of this pattern is to isolate the representation
    of information from user interaction. Let''s understand each of these parts individually:


    +   - Model: Manages the behavior and data of application

    - View: Representation layer of the model in the user interface

    - Controller: Takes user input and makes necessary manipulations to the model,
    causing the view to get updated


    # MVC Problem


    MVC is a very popular pattern to design applications, but it comes with its own
    set of problems. The more complex your source code becomes, the more complex things
    get. Figure 4-1 shows the simplest implementation of MVC, which works pretty well
    with small applications. But as our application grows, it demands new features,
    so there should be room to accommodate more models and views.


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_85_0.png)


    Figure 4-1. Basic MVC implementation'
