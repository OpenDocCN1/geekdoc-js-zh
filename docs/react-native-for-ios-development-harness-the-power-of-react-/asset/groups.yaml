- md: "\n## CHAPTER 3: Canvas, Brush, and Paint: Working with the User Interface\n\
    \n```javascript\ntopBox: {\n  flex: 1,\n  backgroundColor: '#CCE5FF',\n}\nbottomBox:\
    \ {\n  flex: 1,\n  backgroundColor: '#FFFFCC'\n}\n```\n\nRefresh the view to see\
    \ the changes, as shown in Figure 3-9.\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_62_0.png)\n\
    \nFigure 3-9. View in ratio of 1:1:1\n\nWe can see that now the screen is divided\
    \ in a ratio of 1:1:1, since the flex values of the views are in a ratio of 1:1:1.\
    \ With Flexbox, it is easy to create layouts that can resize according to screen\
    \ size and orientation. This is just introduction to Flexbox; we will explain\
    \ more properties throughout the book as and needed. You can also find more options\
    \ at https://facebook.github.io/react-native/docs/flexbox.html.\n\n## Adding Images\n\
    \nReact has a built-in component, Image, which will help us to display images,\
    \ including network images, temporary local images, and also images from local\
    \ disk, such as the camera roll. To start, we will display place local images.\n\
    \nOpen the Image.xcassets file in Xcode (see Figure 3-10). Click on the + button\
    \ at the bottom.\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_63_0.png)\n\nFigure\
    \ 3-10. Image.xcassets in Xcode\n\nName the image set “home” and drag the home\
    \ images to the boxes on the screen (see Figure 3-11).\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_64_0.png)\n\
    \nFigure 3-11. Image set “home”\n\nThe use of xassets is the new standard after\
    \ iOS 7. The asset catalog manages your app’s images; iOS has different image\
    \ resolutions and groups them together. When building, Xcode compiles this image\
    \ catalog into the most efficient bundle for distribution.\n\nNow that we have\
    \ added an image to our project, let's add it to our component. First, we add\
    \ it to our list of components:\n\n```javascript\nvar {\n  AppRegistry,\n  Stylesheet,\n\
    \  Text,\n  View,\n  NavigatorIOS,\n  Image\n} = React;\n```\n\nLet's now add\
    \ the image to our view:\n\n```javascript\nvar home = React.createClass({\n  render:\
    \ function() {\n    return (\n      <View style={styles.container}>\n        <View\
    \ style={styles.topBox}>\n          <View />\n        </View>\n      </View>\n\
    \    );\n  }\n});\n```\n\n```javascript\n<View style={styles.bottomBox}>\n  <Image\
    \ source={require('./image/home')} style={styles.image}/>\n</View>\n<View style={styles.topBox}>\n\
    </View>\n</View>\n);\n```\n\nrequire('./image/home') is pointing to the asset\
    \ catalog of the image with the name home.\nLet's also specify the width and height\
    \ for this image:\n\n```javascript\nimage: {\n  width: 70,\n  height: 70\n},\n\
    ```\n\nSince we have made changes in Xcode, we have to restart the simulator.\
    \ Stop the application and rebuild the code. We can see that the house image is\
    \ shown on the screen (see Figure 3-12).\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_65_0.png)\n\
    \nFigure 3-12. Now we have a house image\n\nNow, let's add some styling to it\
    \ by updating bottomBox with the following style:\n\n```javascript\nbottomBox:\
    \ {\n  flex: 1,\n  backgroundColor: '#FFFFCC',\n  alignItems: 'center',\n  justifyContent:\
    \ 'center'\n}\n```\n\nalignItems and justifyContent define the default behavior\
    \ for flex items are laid out along the cross axis and main axis respectively.\
    \ Since we want to show this in the center, we have updated these values to center.\n\
    \nRefresh the screen, and you will find that the house image is centered in the\
    \ view (Figure 3-13).\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_66_0.png)\n\n\
    **Figure 3-13.** The house is now centered\n\nWe can also give any server image\
    \ URL as the source, and the Image component will take care of loading it from\
    \ the network. We will do this in a later part of this chapter.\n\n## TouchableHighlight\n\
    \nTouch is a fundamental way to interact with an iOS application. TouchableHighlight\
    \ is a React Native component that helps us create buttons that give a proper\
    \ response in the event of touch. These are not actually buttons, but the React\
    \ Native team decided that it easier to construct buttons directly instead of\
    \ UIButton. The buttons in your app use TouchableHighlight, which is not a button\
    \ but works like a button. Let us understand this with an example.\n\nLet's add\
