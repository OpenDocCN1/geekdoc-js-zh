    CHAPTER 1: Learning the Basics: A Whistle-Stop Tour of React


    # # Why React?


    But do we need another JavaScript library in a world full of js libraries and
    frameworks? There is hardly a month that goes by without a new js framework introduced.


    React came into existence because its creators were faced with a significant problem:
    how to build large applications where data changes frequently. This problem occurs
    in almost any real-world application and React was created from the ground up
    to solve it. As you know, many popular frameworks like MVC or MV'' are here points
    to be used and re-iterated: React is not MV''. It''s just a library for building
    composable user interfaces for UI components whose change over time. React builds
    user interfaces by breaking the UI into many components. That''s-nothing else.
    This means React uses the full features of programming languages to build and
    render views.


    The following are some of the advantages of choosing React for your project:


    +   - React uses JavaScript extensively: Traditionally the views in HTML are separated
    from the functionality in JavaScript. With React, components are created and there
    is one monolithic section where JavaScript has intimate knowledge of your HTML.


    +   - Extendable and maintainable: Components are formed by a unified markup with
    its view logic, which actually makes the UI easy to extend and maintain.


    +   - Virtual DOM: React applications are blazing fast. The credit for this goes
    to the virtual DOM and its diffing algorithm.


    +   - One-way data flow: Two-way data binding is a great idea, but in real-world
    applications it produces more pain than benefits. One of the common drawbacks
    with two-way data binding is that you have no idea how your data gets updated.
    With one-way data flow, things are simple: you know exactly where data is mutating,
    which makes it easier to maintain and test your app.


    In order to have a strong foundation of a new technology, it''s necessary to understand
    its core concepts. In the next section, you will explore a few unique concepts
    of React, which will take you one step closer to understanding this technology.


    # # Virtual DOM


    In all applications one of the most expensive operations from an app suffers is
    mutating the DOM. To solve this problem, React maintains a virtual representation
    of the DOM (as shown in Figure 1-1), which is called Virtual DOM or VDOM. Along
    with a diffing algorithm, React is able to compete against the actual DOM and
    only update the part of the DOM that is changed. The amount of change is therefore
    less, which leads to a blazing fashion. You might not see it, but as your project
    balloons to insane complexity (which usually happens in real-world apps) you will
    begin to see the benefits of a snappy experience for users.'
