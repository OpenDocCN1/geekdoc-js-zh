- md: "\n## Fetch\n\nFetch is a popular networking API. It was created by a standard\
    \ committee and has well-defined requests, responses, and the process to bind\
    \ them. The following is an example of a post request with fetch:\n\n```javascript\n\
    fetch('https://example.com/endpoint/', {\n  method: 'POST',\n  headers: {\n  \
    \  'Accept': 'application/json',\n    'Content-Type': 'application/json',\n  },\n\
    \  body: JSON.stringify({\n    firstParam: 'yourValue',\n    secondParam: 'otherValue',\n\
    \  })\n});\n```\n\nFetch returns a promise, which is processed using then and\
    \ catch.\n\n```javascript\nfetch('https://example.com/endpoint')\n  .then((response)\
