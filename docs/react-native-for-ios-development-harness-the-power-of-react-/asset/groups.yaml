    # CHAPTER 1: Learning the Basics: A Whistle-Stop Tour of React


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_16_0.png)


    Figure 1-3. Two-way data binding


    In JavaScript, data changes in memory and it is bound to a view in the UI, which
    means that when data is modified in JavaScript, which is in memory, the data will
    be changed in the UI as well. In return, when data changes in the UI (that is,
    the DOM) by clicking a button or any other event, it gets updated in memory also,
    keeping the two in sync. In theory, this works flawlessly and the idea is romant
    perfect. However, in real-world applications, problems arise when you have a fairly
    complex and large application with multiple views representing data in one of
    your models. As you add more models and views this two-way data binding ends up
    as spaghetti with every change in data added to the pot, which sometimes ends
    up in an infinite event loop where one view updates a model, which in turn updates
    a view, and so on, as shown in Figure 1-4.


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_16_1.png)


