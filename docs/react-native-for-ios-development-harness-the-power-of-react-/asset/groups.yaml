    \n完成后，刷新界面以查看图 5-9 所示的结果。\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_119_0.png)\n\
    \n**图 5-9.** 来自异步存储机制的文本\n\n这一次，“Text from local storage”下方的文本来自我们已经设置好的异步存储机制。\n\
    \n## 审查 AsyncStorage 代码\n\n在这个示例中，我们将 AsyncStorage 默认组件包含在了用于此应用程序的组件列表列表中。\n\n\
    ```javascript\nvar React = require('react-native');\nvar {\nAppRegistry,\nStyleSheet,\n\
    Text,\nView,\nTextInput,\nTouchableHighlight,\nAsyncStorage\n} = React;\n\nvar\
    \ STORAGE_KEY = '@AsyncStorageExample:someKey';\n```\n\n我们将在 AsyncStorage 组件中使用此\
    \ AsyncStorage React 组件。在上面，我们还指定了一个键，我们将它用于我们的 AsyncStorage。\n\n在我们的 AsyncStorageExample\
    \ 组件内部，我们设置了 `getInitialState` 和 `componentDidMount` 方法，并且创建了 `addMessage` 和 `updateStorage`。让我们一个一个讨论它们。\n\
    \n```javascript\ngetInitialState: function() {\n  return {\n    messages: '',\n\
