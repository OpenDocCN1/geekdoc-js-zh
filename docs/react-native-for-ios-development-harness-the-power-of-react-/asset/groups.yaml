    written in index.js and also a program added by the React Native framework.


    # Debugging


    Debugging with React Native is in line with how we debug web apps; in short, it''s
    really simple. To access debugging options, press Command + D with the loaded
    application from the iOS simulator. This will open a menu that provides several
    debugging options, as shown in Figure 2-7.'
