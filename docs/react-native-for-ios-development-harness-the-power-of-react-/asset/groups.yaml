    \ style={styles.navigator} \n        initialRoute={{\n          title: 'House\
    \ Share',\n          component: Home\n        }}\n      />\n    );\n  }\n});\n\
    ```\n\nWe have used barTintColor and titleTextColor to add colors to our navigation\
    \ bar (see Figure 3-2).\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_54_0.png)\n\
    \n**Figure 3-2.** Our toolbar now has color\n\nWe have done a little bit of styling\
