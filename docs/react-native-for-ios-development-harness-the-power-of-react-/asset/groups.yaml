    AppRegistry.registerComponent('AnimationExample', () => AnimationExample);\n\n\
    Lastly, we have some styling and register our AnimationExample component.\nAs\
    \ discussed earlier, React Native have two Animated and layout. We have gone in\
    \ details, as an exercise, explore layout with the same example.\n\n# Summary\n\
    \nIn this chapter, we learned about capabilities of your device beyond just user\
    \ interface. We learned how to use Geolocation and maps for your app, AsyncStorage\
    \ to persist data, alerts to share important info in your app, WebView to load\
    \ HTML content and lastly.\n\nIn next chapter we will learn how to interact with\
    \ a backend because no real world application is complete without connecting to\
    \ a backend.\n\n# Chapter 6: Communicating with Servers\n\n> \"Communication is\
    \ panacea for everything.\" —Tom Peters\n\nAfter learning about the powers of\
    \ device via multiple examples, it’s time to get back to your application. So\
    \ far, you have been populating your app locally with some dummy data, but no\
    \ application can survive without communicating with a server. In this chapter,\
    \ you will learn how to interact with network APIs. You will explore the following\
    \ topics:\n\n- XMLHttpRequest\n- WebSocket\n- Fetch\n- Getting data from a server\n\
    - Posting data to a server\n\nEarlier you were getting all the data from dummy,\
    \ which was static within your application. Any production application will entirely\
    \ work with static data. Fortunately, React Native provides many ways to interact\
    \ with network APIs. The following sections cover the network stack is supported\
    \ in React Native.\n\nXMLHttpRequest\n\nXMLHttpRequest is an API that provides\
    \ the ability to transfer data between a client and a server. It provides an easy\
    \ way to retrieve data from a URL without having to do a full-page refresh. In\
    \ React Native, the XMLHttpRequest API is applied on top of the iOS networking\
    \ APIs. A notable difference from the Web is the security model; you can read\
    \ from any website on the Internet there no concept of CORS.\n\n```javascript\n\
    var xhttp = new XMLHttpRequest();\nxhttp.onreadystatechange = (e) => {\n  if (xhttp.readyState\
    \ !== 4) {\n    return;\n  }\n\n  if (xhttp.status === 200) {\n    console.log('success',\
    \ xhttp.responseText);\n  } else {\n    console.warn('error');\n  }\n};\n```\n\
    \n```javascript\nxhttp.open('GET', 'https://example.com/myendpoint.php');\nxhttp.send();\n\
    ```\n\nUsing XMLHttpRequest is quite tedious. Since it is compatible with the\
    \ browser API, it lets you use third-party libraries directly from npm like Parse.\
    \ For more information on this API, please refer to its documentation https://developer.mozilla.org/en-US/docs/Web/API/XMLHttpRequest\n\
    \n# WebSocket\n\nWebSocket is a protocol that provides full-duplex communication\
    \ channels over a TCP connection.\n\n```javascript\nvar ws = new WebSocket('ws://example.com/path/');\n\
    ```\n\n```javascript\nws.on('open', function() {\n  // connection opened\n  ws.send('example\
    \ data');\n});\n```\n\n```javascript\nws.on('message', function(e) {\n  // a message\
    \ received\n  console.log(e.data);\n});\n```\n\n```javascript\nws.on('error',\
    \ function(e) {\n  // an error occurred\n  console.log(e.message);\n});\n```\n\
    \n```javascript\nws.on('close', function(e) {\n  // connection closed\n  console.log(e.code,\
    \ e.reason);\n});\n```\n"
