    stores manage the application state for a particular domain within the application.


    As mentioned earlier, a store registers itself with the dispatcher and provides
    it with a callback. Within the store''s registered callback, a switch statement
    based on the action''s type is used to interpret the action and to provide the
    proper hooks into the store''s internal methods. This allows an action to result
    in an update to the state of the store, via the dispatcher. After the stores are
    updated, they can broadcast an event declaring that their state has changed, which
    the views may query the new state and update themselves.


    # Actions


    When new data enters the system, whether through a person interacting with the
    application or through a web API, that data is packed into an action—an object
    containing the new fields of data and a specific action type. We create a library
    of helper methods called action creators that do not create the action object,
    but also pass the action to the dispatcher.


    Different actions are identified by a type attribute. They typically use this
    attribute to determine if and how they should respond to it. In a Flux application,
    both stores and views control themselves; external objects do not act upon them.
    Actions flow into the stores through the callbacks they define and register, not
    through setter methods.'
  - "[PAGE 90]\n\n# CHAPTER 4: Flux: Solving Problems Differently 81\n\nLetting the\
    \ stores update themselves eliminate many entanglements typically found in MVC\
    \ applications, where cascading updates between models can lead to unstable state\
    \ and make accurate testing very difficult. The objects within a Flux application\
    \ are highly decoupled and adhere strongly to the Law of Demeter, the principle\
    \ that each object within a system should know as little as possible about the\
    \ other objects in the system. This results in software that is more maintainable,\
    \ adaptable, testable, and easier for new engineering team members to understand.\n\
