    # Debugging in Chrome


    This is one of the best and most used options for debug your JavaScript code in
    React Native. With web apps, you can debug your React application in Chrome. When
    you click "Debug in Chrome" it opens http://localhost:8081/debugger-ui (Figure
    2-8).


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_44_0.png)


    Figure 2-8. Debugging Chrome


    Install the React Developer Tools, which is a Chrome extension for debugging both
    your React application and React Native code. It allows you to inspect the React
    Native component hierarchies in the Chrome Developer Tools. To install it, please
    visit the Chrome webstore or go to the URL: https://chrome.google.com/webstore/detail/react-developer-tools/fmkadmapgadofolip1jbfkadkoelniij?hl=en.


    Once the extension is installed, press Command + Option + j or select View ► Developer
    Tools from your Chrome browser to access the developer tools console.


    You will get a new tab called React in your Chrome DevTools. This shows you that
    your React components have been rendered on the page, as well as the subcomponents
    they ended up rendering. You can also see props, state, components, and event
    listeners, as shown in Figure 2-9.


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_44_1.png)


    Figure 2-9. Debugging in Chrome DevTools'
