    图 4-2 显示了当模型和视图增加时发生的情况。


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_86_0.png)


    **图 4-2.** 箭头的爆炸


    当有这么多模型和视图相互作用时，当我们追踪一个模型，它会触发一个视图，而视图又触发另一个模型，这种现象会像乱麻一样持续，很多时候会导致无限循环。最糟糕的是，在这种情况下调试代码非常困难，最终导致系统变得脆弱。嗯，Facebook
    也面临过类似的挫折，并通过一种名为 Flux 的新模式解决了这个问题！


    ## Flux


    Flux 用单向数据流取代了 MVC。Flux 运行良好，因为单向数据流使得应用程序在增长和变得复杂时易于理解和修改。早些，我们发现双向数据绑定会导致级联更新，一个数据模型的变化会导致另一个数据模型的变化，这使得很难预测单个用户交互的结果会发生什么变化。如图
    4-3 所示，Flux 应用包含三个主要部分：分发器（dispatcher）、存储器（stores）和视图（views，我们在其中使用 React Native
    组件）。这些不应与 MVC 模式中的模型视图控制器元素相比。


    ## 第 4 章：Flux：不同的方式解决问题


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_87_0.png)


    **图 4-3.** Flux 的三个主要组件


    图片来源：https://github.com/facebook/blob/master/docs/img/flux-diagram-white-background.png


    虽然 Flux 应用中存在控制器，但它们是控制器视图（controller views），其中视图位于层次结构的顶端，从存储器中检索数据并将其转发给子级。查看图
    4-4，Flux 架构中最重要的部分是分发器，它是一个单例，负责引导数据流并确保更新不会发生级联。


    ## FLUX


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_87_1.png)


    **图 4-4.** 分发器引导数据流


    随着应用程序的增长，分发器变得愈关重要，因为它通过按特定顺序调用注册的回调来管理存储器之间的依赖关系。


    当用户与 React Native 视图交互时，视图通过分发器看到一个操作（通常表示为带有某些字段的 JavaScript 对象），分发器会通知持有应用程序数据和业务逻辑的各种存储器。当存储器状态改变时，它们会通知视图某些内容已更新，通过
    React Native 的声明式模型，这允许存储器在不指定如何在状态之间切换视图的情况下发送更新。


    简而言之，Flux 提供了以下优势：


    - 提高数据一致性

    - 使 bug 更容易定位

    - 提供更具意义的单元测试；由于模块的所有状态都在同一个地方，我们可以独立地测试一个模块

    - 包含可预测的代码


    ## Flux 的成功


    Facebook 最受欢迎的功能之一是聊天。然而，它 Bug 非常多，并收到了负面用户反馈。Facebook 实现的新聊天系统使用了 Flux，现在它拥有无缝的体验；你可以在以下
    URL 的 Facebook React Native Example 中查看示例代码：


    https://github.com/facebook/flux/tree/master/examples/flux-chat.


    ## Flux 深度解析


    在本节中，我们将更仔细地查看 Flux 的核心概念。


    ## 分发器


    分发器是管理 Flux 应用中所有数据流的中央枢纽。它本质上是存储器的回调注册表，本身没有真正的智能；它只是将操作分发到存储器的简单机制。每个存储器注册自己并提供一个回调。当执行者带新操作创建分发器时，应用程序中的任何操作、存储器都会通过注册中的回调接收操作。分发器还像交通警察一样。如果它在数据层仍在处理时收到操作，它可以拒绝该操作，这是一个很好的约束。这保证了你会知道执行者何时开始以及它对数据层做了哪些更改，因为之间会累积级联效应——你完全控制着你的系统。


    ## 分发器的需求 [dispatch() 和 waitFor()]


    随着应用程序的增长，不同存储器之间的依赖关系也会增加。想象一种情况：存储器 A 需要存储器 B 首先更新，以便它自己知道如何更新。我们需要分发器调用存储器
    B 的回调并完成该回调，然后继续处理 A。为了断这种依赖关系，存储器 A 需要与分发器通信，以便首先完成更新存储器 B的操作。分发器通过 `waitFor()`
    方法提供此功能。


    `dispatch()` 方法对回调进行简单的同步迭代，逐一调用每个。当在其中一个回调中遇到 `waitFor()` 时，该回调的执行停止，`waitFor()`
    为我们提供了一个新的依赖项迭代周期。在满足整组依赖项后，原始回调继续执行。


    此外，`waitFor()` 方法可以在同一个存储器的回调中针对不同的操作以不同的方式使用。一种情况下，存储器 A 可能需要等待存储器 B。在另一种情况下，存储器
    B 可能需要等待 C。如果存在循环依赖，就会出现问题，但 `waitFor` 方法允许我们解决这个问题。


    ## 存储器


    存储器包含应用程序状态。它们的角色与 MVC 中的模型相似，但它们管理状态和逻辑。如前，存储器并不直接链接视图。相反，它们通过分发器接收操作。当存储器更改时，它们会通知视图。


    ## 操作


    操作是描述应用程序发生了某些事情的对象。它们由视图或其他存储器触发并发送到分发器，然后分发器将其广播给所有存储器。每个操作都有一个类型和一些关联数据。


