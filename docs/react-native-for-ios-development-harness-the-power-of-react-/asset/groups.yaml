    # Starting Profiling


    *Profiling* is used to measure performance. The profiling session provides insight
    into which parts of the code you used most, how much time it takes, and which
    sections of your code you should improve. You can also find the time spent in
    each method from the number of times the profiler stopped on a method.


    The following URL links to a very nice blog post that will give you a good overview
    of how to use profiling with Xcode: www.raywenderlich.com/23037/how-to-use-instruments-in-xcode.'
