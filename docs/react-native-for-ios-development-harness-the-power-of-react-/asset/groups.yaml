    \n图 7-1. Reflux 单向流\n\n## 与 Flux 的区别\n\nReflux 实际上重构了 Flux，使其更接近函数反应式编程（FRP）。以下是\
    \ Reflux 和 Flux 之间的区别：\n\n- 不存在单例调度器（dispatcher），让每个操作都像调度器一样。\n- 因为 actions 是可以监听的，所以\
