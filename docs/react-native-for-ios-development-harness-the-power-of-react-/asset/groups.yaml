  - '[PAGE 173]


    # Popular Modules for React Native


    The React Native community may be young, but it has already started to flourish.
    Like any other framework, lists of open-source projects have been created, which
    helps developers to avoid re-inventing features already developed. You can find
    hundreds of such node modules on GitHub; we are listing a few that can help you
    quickly build and deliver your React Native application.


    # react-native-fbsdk


    React Native FBSDK is a wrapper for iOS Facebook SDK that helps Facebook integration
    with React Native apps. Documented JavaScript modules help native components like
    login, sharing, and share using three npm modules. Packages: react-native-fbsdkore,
    react-native-fbsdkshare, and react-native-fbsdklogin-that''s.


    For complete documentation or to make a contribution to this project, you may
    visit the following: https://github.com/facebook/react-native-fbsdk.


    # react-native-scrollable-tab-view


    Fluid animations really need adding to any feature in your application. React
    Native animations API are getting robust very rapidly; creating animations for
    scrolling within tabs is a problem solved by the react-native-scrollable-tab-view
    npm package. It''s a very JavaScript-only implementation for React Native.


    For complete documentation or to make a contribution to this project, you may
    visit the following: https://github.com/brentvatne/react-native-scrollable-tab-view.


    # react-native-webpack-server


    react-native-webpack-server allows you to use the webpack ecosystem with React
    Native. It is a developer server that uses Webpack Dev Server and the React Packager
    to enable building React JavaScript bundles with webpack.


    For complete documentation or to make a contribution to this project, you may
    visit the following: https://github.com/mjohnston/react-native-webpack-server.


    # react-native-side-menu


    A simple implementation of an expandable side menu, this package adds you a side
    menu that scrolls from either the left or right side with an easy swipe gesture.


    For complete documentation or to make a contribution to this project, you may
    visit the following: https://github.com/react-native-fellowship/react-native-side-menu#component-props.'
