    # Canvas, Brush, and Paint: Working with the User Interface


    > “User interface is the process of shifting from chaotic complexity to elegant
    simplicity.”

    —Akshat Paul


    In the previous chapter, we were introduced to React Native and created our first
    Native application. Now that we have a blank skeleton for our project, we will
    fill it with a stunning user interface. In this chapter, we will cover the following
    topics:


    +   - NavigatorIOS

    - Flexbox

    - Image

    - TouchableHighlight

    - Routing to a new component

    - ListView

    - ScrollView


    Any experienced software will agree—the success of an app depends on the fact
    that it not only works flawlessly, but also looks great. Therefore, a great user
    interface makes a huge difference in the success of your app.'
- md: "\nThe layout system is a fundamental concept that needs to be mastered in order\
    \ to create great applications. Let's begin by understanding how to navigate within\
    \ an iOS application using React Native.\n\n## NavigatorIOS\n\nNavigatorIOS is\
    \ a React Native component for creating navigation. It wraps UIKit navigation\
    \ and allows you to add a back-swipe feature to your app. NavigatorIOS manages\
    \ a stack of view controllers as to provide a drill-down interface for hierarchical\
    \ content. Now that we know what NavigatorIOS does, let's implement it in our\
    \ project.\n\nFirst, add NavigatorIOS in the list of components in the index.ios\
    \ file:\n\n```\nvar {\n  AppRegistry,\n  StyleSheet,\n  Text,\n  View,\n  NavigatorIOS,\n\
    } = React;\n```\n\nLet's create a component that has NavigatorIOS and call it\
    \ mainView, and then let's load another component within mainView, which we will\
    \ call Home:\n\n```\nvar mainView = React.createClass({\n  render: function()\
    \ {\n    return (\n      <NavigatorIOS\n        style={styles.navigator} initialRoute={{\n\
    \          title: 'House Share',\n          component: Home\n        }}/>\n  \
    \  );\n  }\n});\n```\n\nHome component will be like home page of our application.\n\
    \nNavigatorIOS is a React Native component; we have also provided a title (House\
    \ Share) and component name (Home) for the page using initialRoute. There are\
    \ other options available, which are documented at https://facebook.github.io/react-native/docs/navigators.html.\n\
    \nNavigatorIOS uses the most basic iOS routing. A route is an object that describes\
    \ each view in the navigator. First, the route is provided to NavigatorIOS. In\
    \ the previous code, we called component Home from our mainView. Let's add an\
    \ empty Home component:\n\n```\nvar Home = React.createClass({\n  render: function()\
    \ {\n    return (\n      <View>\n    </View>\n  );\n  }\n});\n```\n\nLet's also\
    \ add some styles to our mainView component:\n\n```\nvar styles = StyleSheet.create({\n\
    \  container: {\n    flex: 1,\n    justifyContent: 'center',\n    alignItems:\
    \ 'center'\n  },\n  welcome: {\n    fontSize: 25,\n    textAlign: 'center'\n \
    \ },\n  navigator: {\n    flex: 1\n  }\n});\n```\n\nLet's now update the entry\
    \ point for our application to mainView:\n\n```\nAppRegistry.registerComponent('HouseShare',\
    \ () => mainView);\n```\n\nLet's build our application with Xcode and see the\
