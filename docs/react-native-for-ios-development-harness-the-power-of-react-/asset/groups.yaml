  mdcn: "\n\n## Fetch\n\nFetch 是一个流行的网络 API。它由一个标准委员会创建，具有定义良好的请求、响应以及绑定它们的流程。以下是一个使用\
    \ fetch 进行 post 请求的示例：\n\n```javascript\nfetch('https://example.com/endpoint/',\
    \ {\n  method: 'POST',\n  headers: {\n    'Accept': 'application/json',\n    'Content-Type':\
    \ 'application/json',\n  },\n  body: JSON.stringify({\n    firstParam: 'yourValue',\n\
    \    secondParam: 'otherValue',\n  })\n});\n```\n\nFetch 返回一个 promise，通过 `then`\
    \ 和 `catch` 进行处理。\n\n```javascript\nfetch('https://example.com/endpoint')\n  .then((response)\
    \ => response.text())\n  .then((responseText) => {\n    console.log(responseText);\n\
