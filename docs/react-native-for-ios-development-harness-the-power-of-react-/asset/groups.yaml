  mdcn: "\n\n在这里，我们必须将 localhost 替换为我们机器的 IP 地址。这样做可以允许我们的应用程序在设备上正常加载和运行（见图 7-8）。\n\
    \n![](img/44d9b147332295d6833a2b7d5f0c7aa8_170_0.png)\n\n**图 7-8.** 应用程序正在正常运行\n\
    \n要访问开发者菜单，只需摇晃你的设备——菜单将从视图底部出现（见图 7-9）。\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_171_0.png)\n\
    \n**图 7-9.** 开发者菜单现在可见\n\n我们可以启用热重载（live reload），就像 iOS 模拟器一样，所有更改也会自动反映在设备上。点击\
    \ Chrome 中的 Debug 即可查看图 7-10 所示的结果。\n\n# 第 7 章：React Native 补充内容\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_172_0.png)\n\
    \n**图 7-10.** WebSocket 错误消息\n\n然而，我们遇到了另一个错误。为了解决这个错误，我们需要回到代码并进行一些更改。为此，我们需要进入\
    \ RCTWebSocketExecutor.m，它位于 React Native node 节点，路径为 `/your-project-name/node_module/react-native/Libraries/WebSocket/RCTWebSocketExecutor.m`，然后我们仍然需要在以下代码部分将我们的\
    \ localhost 更改为机器的 IP 地址：\n\n从\n\n```objectivec\n+   - (instype)init\n  return\
    \ [self initWithURL:[RCTConvert NSURL:@\"http://localhost:8081/debugger-proxy\"\
    ]];\n}\n```\n\n改为\n\n```objectivec\n+   - (instype)init\n  {\n    return [self\
    \ initWithURL:[RCTConvert NSURL:@\"http://your-machine-ip-address:8081/debugger-proxy\"\
    ]];\n  }\n```\n\n通过此更改，我们就可以像之前使用模拟器一样调试我们的应用程序了。\n\n## React Native 常用模块\n\n\
    React Native 社区可能还年轻，但它已经开始繁荣。与任何其他框架一样，这里已经创建了开源项目列表，这有助于开发者避免重复发明已经开发的功能。你可以在\
    \ GitHub 上找到数百个这样的 node modules；我们列出了一些可以帮助你快速构建和交付 React Native 应用程序的模块。\n\n\
    ## react-native-fbsdk\n\nReact Native FBSDK 是 iOS Facebook SDK 的封装，有助于 Facebook\
    \ 与 React Native 应用的集成。文档说明的 JavaScript 模块通过三个 npm 模块帮助登录、分享和使用分享等原生组件。包包括：react-native-fbsdkore、react-native-fbsdkshare\
    \ 和 react-native-fbsdklogin-thats'。\n\n要查看完整文档或为此项目做出贡献，你可以访问：https://github.com/facebook/react-native-fbsdk。\n\
    \n## react-native-scrollable-tab-view\n\n流畅的动画确实需要添加到应用程序的任何功能中。React Native 动画\
    \ API 正变得非常健壮；创建标签页内滚动动画的问题通过 `react-native-scrollable-tab-view` npm 包得到了解决。它是针对\
    \ React Native 的一个纯 JavaScript 实现。\n\n要查看完整文档或为此项目做出贡献，你可以访问：https://github.com/brentvatne/react-native-scrollable-tab-view。\n\
    \n## react-native-webpack-server\n\nreact-native-webpack-server 允许你在 React Native\
    \ 中使用 webpack 生态。它是一个开发者服务器，使用 Webpack Dev Server 和 React Packager 来启用使用 webpack\
    \ 构建 React JavaScript 数据包。\n\n要查看完整文档或为此项目做出贡献，你可以访问：https://github.com/mjohnston/react-native-webpack-server。\n\
    \n## react-native-side-menu\n\n这是一个可展开侧边菜单的简单实现，该包为你添加了一个从左侧或右侧通过简单滑动手势滑出的侧边菜单。\n\
    \n要查看完整文档或为此项目做出贡献，你可以访问：https://github.com/react-native-fellowship/react-native-side-menu#component-props。\n\
    \n这里是其他值得提及的：\n\n- react-native-vector-icons\n- react-native-facebook-login\n\
    - react-native-google-places-autocomplete\n- react-native-sqlite-storage\n- react-native-tableview\n\
    - react-native-background-geolocation\n\n## 从此以后\n\n恭喜。你学习了许多关于 React Native 框架的知识。这只是开始，因为\
    \ React Native 社区和生态系统每天都在快速扩展。新的开发、创新的变化和尖端特征不断加入框架——简单之，每天都有新东西要学。对于大胆的人来说，这是一个蓬勃发展的机会。显而易见的问题是，*接下来是什么？*答案是有很多。\n\
    \n如果你正在寻找已经构建并可用的 React Native 组件，可以访问 react.parts，那里有可用重用模块的详细列表；参见 https://react.parts/native。\n\
    \n对于任何查询，你可以使用带有 react-native 标签的 stackoverflow。对于来自开发者的非常快速的问题，你随时可以加入 freenode.net\
    \  #reactnative IRC 频道。你也可以使用 discord https://discord.com/invite/OzcbPK5JWmW 与\
    \ React Native 社区聊天（React Native 社区酷到足以使用玩家使用的平台）。\n\nReact Native 是一个非常年轻的框架，在你对其工作时，你会有有助于该框架的建议。React\
    \ Native 社区欢迎建议；如果你有任何建议，可以在 https://discuss.reactjs.org/ 开启一个主题。这个讨论页面也是从他人和线程中学习最佳实践的绝佳地方。此外，它也是让专家解决你问题的好地方。更好，你可能会获得一些工作机会。\n\
    \n最后，精通 React Native 没有比构建应用程序更好的方法了。但只要通过解决现实问题来“弄脏点手”，React Native 社区仍处于婴儿阶段，通过创建自己的模块来学习和分享是一个极佳的机会，这可以帮助社区的其他部分，是一个额外的益处。我们希望你喜欢这本书，并成长为一名\
    \ React Native 开发者。期待看到你的作品在 iOS 和 React Native 世界中留下印记。\n\n"
