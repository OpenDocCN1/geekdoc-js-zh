    \          <Text> Maps </Text>\n        </View>\n        <MapView\n          style={styles.map}\n\
    \          region={this.state.region}\n        />\n      </View>\n    );\n  }\n\
    });\n```\n\n```\nvar styles = StyleSheet.create({\n  container: {\n    flex: 1,\n\
    \    flexDirection: 'column',\n    backgroundColor: '#F5FCFF',\n    alignItems:\
    \ 'stretch'\n  },\n\n  desc: {\n    flex: 1,\n    alignItems: 'center',\n    justifyContent:\
    \ 'center'\n  },\n  map: {\n    flex: 5,\n  }\n});\n```\n\nAppRegistry.registerComponent('GeolocationMap',\
    \ () => GeoLocationMap);"
- md: "\nNow build your application in Xcode for the first time to see the results\
    \ shown in Figure 5-1.\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_105_0.png)\n\
    \n**Figure 5-1.** GeoLocationMap\n\n## Reviewing the GeoLocationMap Code\n\nLet's\
    \ now understand what we have done in this part of our program.\n\n```javascript\n\
    var {\n  AppRegistry,\n  StyleSheet,\n  Text,\n  View,\n  MapView\n} = React;\n\
    ```\n\n# CHAPTER 5: Device Capabilities\n\nHere we are first including the React\
    \ Native component MapView.\n\n```javascript\nvar GeolocationMap = React.createClass({\n\
    \  getInitialState: function() {\n  return {\n    region: {\n      latitude: 40.712784,\n\
    \      longitude: -74.005941,\n      latitudeDelta: 10,\n      longitudeDelta:\
    \ 10,\n    },\n  },\n  render: function() {\n  return (\n    <View style={styles.container}>\n\
    \      <View style={styles.desc}>\n        <Text> Maps</Text>\n      </View>\n\
    \      <MapView\n        style={styles.map}\n        region={this.state.region}\n\
    \      />\n    </View>\n  );\n  }\n});\n```\n\nHere, we have set the initial state\
    \ for the region with certain latitude and longitude parameters, which will be\
    \ later set when we render the function with the MapView component. In the MapView\
    \ component, we are using the region prop, which is supplied with latitude, longitude,\
    \ longitudeDelta and latitudeDelta. These should always be numbers (integer or\
    \ float) and help us plot a specific region on the map. Finally we have added\
    \ some style with Flex and registered our component.\n\n# Adding Annotation on\
    \ Map\n\nNext, let's add annotations to our application, and update getInitialState\
    \ with the new state annotations, having parameters like latitude, longitude,\
    \ title and subtitle:\n\n```javascript\ngetInitialState: function() {\n  return\
    \ {\n    region: {\n      latitude: 40.712784,\n      longitude: -74.005941,\n\
    \      latitudeDelta: 10,\n      longitudeDelta: 10,\n    },\n  }\n```\n\n```javascript\n\
    annotations: {\n  latitude: 40.72052634,\n  longitude: -73.9768958312988,\n  title:\
    \ 'New York',\n  subtitle: 'This is cool!'\n};\n```\n\nupdate the MapView component\
    \ with the new prop called annotations:\n\n```javascript\n<MapView\n  style={styles.map}\n\
    \  region={this.state.region}\n  annotations={this.state.annotations}\n/>\n```\n\
    \nBesides the mentioned values, the annotations prop can have the following additional\
    \ parameters:\n\n```javascript\nannotations [{latitude: number, longitude: number,\
    \ animatedDrop: bool, title: string, subtitle: string, hasLeftCallout: bool, hasRightCallout:\
    \ bool, onLeftCalloutPress: function, onRightCalloutPress: function, id: string}]\n\
    ```\n\nLet's refresh and see the changes shown in Figure 5-2.\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_108_0.png)\n\
    \nFigure 5-2. MapView with added parameters\n\n# Displaying the Latitude and Longitude\
    \ of the Present Location\n\nIn this final part of our Geolocation application,\
    \ we will display our present latitude and longitude on the view. In the previous\
    \ example, we had a constant location; in this part, we will fly to our current\
    \ location in real-time. Now that sounds like something exciting, so let's start\
    \ building. There are two ways to check for the current location on our maps.\
    \ One is to simply add `showsUserLocation={true}` to your MapView component.\n\
    \nAnother way is to use CLLocationWhenInUseDescription geolocation. We will need\
    \ to update info.plist to add this key, but it is enabled by default when you\
    \ create a project with react-native init.\n\nReplace your index.js with the following\
    \ code:\n\n```javascript\n'use strict';\n\nvar React = require('react-native');\n\
    var {\n  AppRegistry,\n  StyleSheet,\n  Text,\n  View,\n  MapView\n} = React;\n\
    ```\n\n```javascript\nvar GeoLocationMap = React.createClass({\n  getInitialState:\
    \ function() {\n    return {\n      region: {\n        latitude: 40.712784,\n\
    \        longitude: -74.005941,\n        latitudeDelta: 10,\n        longitudeDelta:\
    \ 10,\n      },\n      annotations: [{\n        latitude: 40.72052634,\n     \
    \   longitude: -73.9768958312988,\n        title: 'New York',\n        subtitle:\
    \ 'This is cool!'\n      }]\n    };\n  },\n  componentDidMount: function() {\n\
    \    navigator.geolocation.getCurrentPosition(\n      (initialPosition) => this.setState((initialPosition)),\n\
    \      (error) => alert(error.message),\n      {enableHighAccuracy: true, timeout:\
    \ 20000, maximumAge: 1000}\n    );\n    this.watchID = navigator.geolocation.watchPosition((lastPosition)\
    \ => {\n      this.setState({latitude: lastPosition.coords.latitude});\n     \
    \ this.setState({longitude: lastPosition.coords.longitude});\n      var newRegion\
    \ = {\n        latitude: lastPosition.coords.latitude,\n        longitude: lastPosition.coords.longitude,\n\
    \        latitudeDelta: 10,\n        longitudeDelta: 10\n      };\n      this.setState({\
    \ region: newRegion});\n\n      this.setState({ annotations: [{\n        latitude:\
    \ lastPosition.coords.latitude,\n        longitude: lastPosition.coords.longitude,\n\
    \        title: 'Current Location',\n        subtitle: 'You are here'\n      ]});\n\
    \    });\n  },\n  componentWillUnmount: function() {\n    navigator.geolocation.clearWatch(this.watchID);\n\
    \  },\n  render: function() {\n    return (\n      <View style={styles.container}>\n\
    \        <View style={styles.desc}>\n        <Text>latitude: {this.state.latitude}</Text>\n\
    \        <Text>longitude: {this.state.longitude}</Text>\n      </View>\n     \
    \ <MapView\n        style={styles.map}\n        region={this.state.region}\n \
    \       annotations={this.state.annotations}\n      />\n    </View>\n  );\n  }\n\
    });\n\nvar styles = StyleSheet.create({\n  container: {\n    flex: 1,\n    flexDirection:\
    \ 'column',\n    backgroundColor: '#F5FCFF',\n    alignItems: 'stretch'\n  },\n\
    \  desc: {\n    flex: 1,\n    alignItems: 'center',\n    justifyContent: 'center'\n\
    \  },\n  map: {\n    flex: 1,\n  }\n});\n\nAppRegistry.registerComponent('GeoLocationMap',\
    \ () => GeoLocationMap);\n\nNow build our application to load it on the iOS simulator\
    \ shown in Figure 5-3.\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_111_0.png)\n\
    \nFigure 5-3. Access location prompt\n\nIf we allow this request, we will fly\
    \ to the location we mentioned in our code; in this case it's California (Figure\
    \ 5-4).\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_112_0.png)\n\nFigure 5-4.\
    \ Fly to a specified location in the code\n\n# CHAPTER 5: Device Capabilities\n\
    \nThere is one extra step when you debug a GeoLocation application. As mentioned,\
    \ in this example we will fly to our present location. We have saved that requirement\
    \ so it can be accomplished now. Open the Debug menu using Ctrl + Command + Z\
    \ and select the “Debug in Chrome” option as shown in Figure 5-5.\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_113_0.png)\n\
    \nFigure 5-5. Select debug in chrome option\n\nOnce you click “Debug in Chrome”\
    \ you will get a popup to allow your location to be served to the iOS simulator\
    \ as shown in Figure 5-6.\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_113_1.png)\n\
    \nFigure 5-6. Allow the present location to be shared with the iOS simulator\n\
    \nOnce you allow this, you will move to your current location in the app (Figure\
    \ 5-7).\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_114_0.png)\n\n**Figure 5-7.**\
    \ Current location is now shown\n\n## Reviewing the GeoLocation Code for the Present\
    \ Location\n\nLet's review what we have programmed in this example.\n\n```javascript\n\
    componentDidMount: function() {\n  navigator.geolocation.getCurrentPosition(\n\
    \    (initialPosition) => this.setState({initialPosition}),\n    (error) => alert(error.message),\n\
    \    enableHighAccuracy: true, timeout: 20000, maximumAge: 1000\n  );\n  this.watchID\
    \ = navigator.geolocation.watchPosition((lastPosition) => {\n    this.setState({latitude:\
    \ lastPosition.coords.latitude});\n    this.setState({longitude: lastPosition.coords.longitude});\n\
    \    var newRegion = {\n      latitude: lastPosition.coords.latitude,\n      longitude:\
    \ lastPosition.coords.longitude,\n      latitudeDelta: 10,\n      longitudeDelta:\
    \ 10,\n    }\n  })\n```\n\nHere, in componentDidMount, we first get the current\
    \ position; by default, the iOS simulator gives us a default value which you can\
    \ change using debug location. If navigator.geolocation.getCurrentPosition gets\
    \ the value, then we set various states and parameters. In this example, we have\
    \ latitude and longitude description which are at the top of the view and are\
    \ set using this.setState({latitude}) and this.setState({longitude}). And the\
    \ map below it is plotted with newRegion.\n"
  mdcn: "\n现在首次在 Xcode 中构建你的应用程序，查看图 5-1 所示的结果。\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_105_0.png)\n\
    \n**图 5-1。** GeoLocationMap\n\n## 审查 GeoLocationMap 代码\n\n现在让我们理解一下我们在程序的这部分做了什么。\n\
    \n```javascript\nvar {\n  AppRegistry,\n  StyleSheet,\n  Text,\n  View,\n  MapView\n\
    } = React;\n```\n\n# 第 5 章：设备能力\n\n在这里，我们首先包含了 React Native 的组件 MapView。\n\n```javascript\n\
    var GeolocationMap = React.createClass({\n  getInitialState: function() {\n  return\
    \ {\n    region: {\n      latitude: 40.712784,\n      longitude: -74.005941,\n\
    \      latitudeDelta: 10,\n      longitudeDelta: 10,\n    },\n  },\n  render:\
    \ function() {\n  return (\n    <View style={styles.container}>\n      <View style={styles.desc}>\n\
    \        <Text> Maps</Text>\n      </View>\n      <MapView\n        style={styles.map}\n\
    \        region={this.state.region}\n      />\n    </View>\n  );\n  }\n});\n```\n\
    \n在这里，我们为具有特定纬经度参数的区域设置了初始状态，这些参数将在稍后渲染带有 MapView 组件的函数时进行设置。在 MapView 组件中，我们使用了\
    \ `region` 属性，它提供了纬度、经度、longitudeDelta 和 latitudeDelta。这些值始终应该是数字（整数或浮点数），并帮助我们在地图上绘制特定区域。最后，我们使用\
    \ Flex 添加了一些样式，并注册了我们的组件。\n\n# 在地图上添加标注\n\n接下来，让我们为应用程序添加标注，并使用新的状态标注更新 `getInitialState`，包含纬度、经度、标题（title）和副标题（subtitle）等参数：\n\
    \n```javascript\ngetInitialState: function() {\n  return {\n    region: {\n  \
    \    latitude: 40.712784,\n      longitude: -74.005941,\n      latitudeDelta:\
    \ 10,\n      longitudeDelta: 10,\n    },\n  }\n```\n\n```javascript\nannotations:\
    \ {\n  latitude: 40.72052634,\n  longitude: -73.9768958312988,\n  title: 'New\
    \ York',\n  subtitle: 'This is cool!'\n};\n```\n\n使用名为 `annotations` 的新属性更新 MapView\
    \ 组件：\n\n```javascript\n<MapView\n  style={styles.map}\n  region={this.state.region}\n\
    \  annotations={this.state.annotations}\n/>\n```\n\n除了提到的值之外，`annotations` 属性还可以包含以下额外的参数：\n\
    \n```javascript\nannotations [{latitude: number, longitude: number, animatedDrop:\
    \ bool, title: string, subtitle: string, hasLeftCallout: bool, hasRightCallout:\
    \ bool, onLeftCalloutPress: function, onRightCalloutPress: function, id: string}]\n\
    ```\n\n让我们刷新并查看图 5-2 所示的变化。\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_108_0.png)\n\
    \n图 5-2. 添加了参数的 MapView\n\n# 显示当前位置的纬度和经度\n\n在我们 Geolocation 应用的最后部分，我们将在视图上显示当前的纬度和经度。在上一个示例中，我们有一个常量位置；在这一部分，我们将实时“飞行”到当前位置。这听起来很令人，让我们开始构建吧。检查地图上当前位置有两种。一种是简单地在你的\
    \ MapView 组件中添加 `showsUserLocation={true}`。\n\n另一种方法是使用 `CLLocationWhenInUseDescription`\
    \ 地位。我们需要更新 `info.plist` 来添加此键，但当你使用 `react-native init` 创建项目时，它是默认启用的。\n\n将你的\
    \ `index.js` 替换为以下代码：\n\n```javascript\n'use strict';\n\nvar React = require('react-native');\n\
    var {\n  AppRegistry,\n  StyleSheet,\n  Text,\n  View,\n  MapView\n} = React;\n\
    ```\n\n```javascript\nvar GeoLocationMap = React.createClass({\n  getInitialState:\
    \ function() {\n    return {\n      region: {\n        latitude: 40.712784,\n\
    \        longitude: -74.005941,\n        latitudeDelta: 10,\n        longitudeDelta:\
    \ 10,\n      },\n      annotations: [{\n        latitude: 40.72052634,\n     \
    \   longitude: -73.9768958312988,\n        title: 'New York',\n        subtitle:\
    \ 'This is cool!'\n      }]\n    };\n  },\n  componentDidMount: function() {\n\
    \    navigator.geolocation.getCurrentPosition(\n      (initialPosition) => this.setState((initialPosition)),\n\
    \      (error) => alert(error.message),\n      {enableHighAccuracy: true, timeout:\
    \ 20000, maximumAge: 1000}\n    );\n    this.watchID = navigator.geolocation.watchPosition((lastPosition)\
    \ => {\n      this.setState({latitude: lastPosition.coords.latitude});\n     \
    \ this.setState({longitude: lastPosition.coords.longitude});\n      var newRegion\
    \ = {\n        latitude: lastPosition.coords.latitude,\n        longitude: lastPosition.coords.longitude,\n\
    \        latitudeDelta: 10,\n        longitudeDelta: 10,\n      };\n      this.setState({region:\
    \ newRegion});\n\n      this.setState({annotations: [{\n        latitude: lastPosition.coords.latitude,\n\
    \        longitude: lastPosition.coords.longitude,\n        title: 'Current Location',\n\
    \        subtitle: 'You are here'\n      ]});\n    });\n  },\n  componentWillUnmount:\
    \ function() {\n    navigator.geolocation.clearWatch(this.watchID);\n  },\n  render:\
    \ function() {\n    return (\n      <View style={styles.container}>\n        <View\
    \ style={styles.desc}>\n          <Text> Latitude: {this.state.latitude}</Text>\n\
    \          <Text> Longitude: {this.state.longitude}</Text>\n        </View>\n\
    \        <MapView\n          style={styles.map}\n          region={this.state.region}\n\
    \          annotations={this.state.annotations}\n        />\n      </View>\n \
    \   );\n  }\n});\n\nvar styles = StyleSheet.create({\n  container: {\n    flex:\
    \ 1,\n    flexDirection: 'column',\n    backgroundColor: '#F5FCFF',\n  },\n  desc:\
    \ {\n    flex: 1,\n    alignItems: 'center',\n    justifyContent: 'center',\n\
    \  },\n  map: {\n    flex: 1,\n  }\n});\n\nAppRegistry.registerComponent('GeoLocationMap',\
    \ () => GeoLocationMap);\n\n现在在 Xcode 中首次构建你的应用程序，查看图 5-3 所示的结果。\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_111_0.png)\n\
    \n图 5-3. 访问位置\n\n如果我们允许此请求，我们将移动到代码中提到的位置（见图 5-4）。\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_112_0.png)\n\
    \n图 5-4. 飞行到特定位置\n\n# 第 5 章：设备能力\n\n在调试 Geoolocation 应用时，有一个额外的步骤。使用 `Ctrl + Command\
    \ + Z` 打开调试菜单并选择“Debug Chrome”选项，如图 5-5 所示。\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_113_0.png)\n\
    \n图 5-5. 选择 chrome 选项\n\n当你点击“Debug Chrome”时，将弹出一个窗口允许你的位置共享给 iOS 模拟器（见图 5-6）。\n\
    \n![](img/44d9b147332295d6833a2b7d5f0c7aa8_113_1.png)\n\n图 5-6. 将当前位置共享给 iOS 模拟器\n\
    \n一旦你允许，应用程序将移动到你的当前位置（见图 5-7）。\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_114_0.png)\n\
    \n**图 5-7。** 显示当前位置\n\n## 审查当前位置的 GeoLocation 代码\n\n让我们回顾一下在这个示例中编写的内容。\n\n```javascript\n\
    componentDidMount: function() {\n  navigator.geolocation.getCurrentPosition(\n\
    \    (initialPosition) => this.setState({initialPosition}),\n    (error) => alert(error.message),\n\
    \    enableHighAccuracy: true, timeout: 20000, maximumAge: 1000\n  );\n  this.watchID\
    \ = navigator.geolocation.watchPosition((lastPosition) => {\n    this.setState({latitude:\
    \ lastPosition.coords.latitude});\n    this.setState({longitude: lastPosition.coords.longitude});\n\
    \    var newRegion = {\n      latitude: lastPosition.coords.latitude,\n      longitude:\
    \ lastPosition.coords.longitude,\n      latitudeDelta: 10,\n      longitudeDelta:\
    \ 10,\n    }\n  })\n```\n\n在这里，在 `componentDidMount` 中，我们首先获取当前位置；默认情况下，iOS 模拟器会给我们一个默认值，你可以通过调试位置进行更改。如果\
    \ `navigator.geolocation.getCurrentPosition` 获取了值，我们就会设置各种状态和参数。在这个示例中，我们在视图顶部设置了纬度和经度描述，它们通过\
    \ `this.setState({latitude})` 和 `this.setState({longitude})` 进行设置。下方的地图使用 `newRegion`\
    \ 进行绘制。\n"
