  - '[PAGE 40]


    # CHAPTER 2: The Simplest Program: Hello World with React Native


    Apps created using these strategies have performance issues. WebView-based apps
    are slow because they use the DOM, and DOM manipulations are expensive, which
    leads to performance issues. As stated in one of the blog posts at Flipboard (http://engineering.flipboard.com/2015/02/mobile-web/),
    you cannot build a 60fps scrolling list with DOM. This is one of the fundamental
    problems with apps developed through this technique: development time may be quick,
    you end up with a sluggish experience.


    The other strategy, where the framework imitates JavaScript and HTML, and converts
    them to native code, has other challenges. Although the final app is native in
    nature, there is a basic issue during this conversion from JavaScript to native:
    it runs on the main thread. In these apps, you interface directly with native
    objects all the time, which leads to once again a slow and sluggish experience.


    React Native is fundamentally different from these two approaches. It runs all
    layouts on separate threads, and its main thread is free to update the UI, which
    makes the animation and UI rendering smooth, just like 100% native apps.


    React Native uses the JavaScript framework to run JavaScript. In iOS 7, Apple
    introduced a native Objective-C API for JavaScriptCore. This framework allows
    JavaScript and Objective-C to talk to each other. This means you can create and
    call JavaScript functions from Objective-C or call back to Objective-C from JavaScript.
    It works like a charm.


    React Native is different in one more aspect. As seen in your Hello World example,
    you write a component in JavaScript just like you would do with React, except
    that of using an HTML div, you use tags View and Text. In the case of an iOS application,
    a View is basically a UIView.


