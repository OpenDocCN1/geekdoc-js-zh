- md: "\nRefresh to test this functionality. The result is shown in Figure 6-2.\n\n\
    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_153_0.png)\n\n**Figure 6-2.** Form to\
    \ submit record\n\nNext, add some values and post it to our server (Figure 6-3).\n\
    \n![](img/44d9b147332295d6833a2b7d5f0c7aa8_153_1.png)\n\n**Figure 6-3.** Values\
    \ are added to the server.\n\nWhen this data is saved, you get an alert box as\
    \ confirmation, as shown in Figure 6-4.\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_154_0.png)\n\
    \nLet's update the ListProperty.js component with a URL that can fetch the user-added\
    \ property list. Update the following variable in ListProperties.js:\n\n```javascript\n\
    var REQUEST_URL = 'http://www.akshatpaul.com/list-properties'\n```\n\nIf you curl\
    \ this URL, you will get JSON of user added properties:\n\n```bash\n$curl 'http://www.akshatpaul.com/list-properties'\n\
    {\n  name: \"Mr. Paul's Mansion\",\n  address: \"11, Golden View, San Francisco\"\
    ,\n  images: {\n    thumbnail: \"http://hmp.me/ol7\"\n  }\n}\n```\n\n> Note: This\
    \ API shows data submitted by various readers of this book. Your data set may\
    \ differ.\n\nRefresh the app and go to the “List of Properties” section (Figure\
    \ 6-5).\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_155_0.png)\n\n**Figure 6-5.**\
    \ Output showing Mr. Paul's Mansion address\n\nNow add a URL for post requests:\n\
    \n```javascript\nvar REQUEST_URL = 'http://www.akshatpaul.com/properties';\n```\n\
    \nNext, modify the onPressButtonPOST function:\n\n```javascript\nonPressButtonPOST:\
    \ function() {\n  fetch(REQUEST_URL, {method: \"POST\", body: JSON.stringify({property:\n\
    \    name: this.state.name, address: this.state.address})})\n  .then((responseData)\
    \ => {\n    Alert.alert(\n      \"Created\"\n    )\n  })\n  .done();\n}\n```\n\
    \nHere, make a post request using fetch and serialize JSON, which returns a promise\
    \ and, upon success, issues an alert box with a “Created” message.\n\n## Summary\n\
    \nIn this chapter, you learned about various network APIs that are reimplemented\
    \ from the ground up by the React Native. You learned various options like XMLHttpRequest,\
    \ WebSocket, and Fetch. Since no application is complete without making server\
    \ calls, you added this capacity into your housing application and learned how\
    \ to get data from a server, add new records, and save them to a server.\n\nIn\
    \ the final chapter of this book, you will learn about popular Node packages that\
    \ you can use with React Native, specifically awesome React libraries like Reflux\
    \ and Redux, which make development slightly simpler and faster.\n\n# Chapter\
    \ 7: React Native Supplements\n\n> \"A good way to stay flexible is to write less\
    \ code.\"\n— Pragmatic Programmer\n\nBy now, you should be comfortable building\
    \ apps using React Native and have become accustomed to all the basics as well\
    \ as many advanced features of the React Native framework. In this final chapter,\
    \ we will learn about a few supplements, which may not be necessary but are very\
    \ useful in certain situations and reduce our work significantly. In this chapter\
    \ we will cover the following topics:\n\n- Reflux\n- Redux\n- Debugging on a device\n\
    - Popular node modules\n- Where to go from here\n\n## Reflux\n\nWe learned about\
    \ Flux architecture in Chapter 4. We have some other ways to implement unidirectional\
    \ data flow, including a lean approach to flux Reflux. It's a simple library for\
    \ unidirectional data flow inspired by React's Flux. As shown in Figure 7-1, a\
    \ Reflux pattern has actions and stores. Actions initiate new data, which is passed\
    \ through data stores, which are then passed to view components and in turn passed\
    \ back to actions. If a view component has an event that makes changes to data\
    \ stores, it needs to send a signal to the stores via the actions.\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_157_0.png)\n\
    \nFigure 7-1. Reflux unidirectional flow\n\n## Differences from Flux\n\nReflux\
    \ has actually refactored Flux to be closer to Functional Reactive Programming\
    \ (FRP). The following are a few differences between Reflux and Flux:\n\n- The\
    \ singleton dispatcher is not present, letting every act like a dispatcher instead.\n\
    - Because actions are listenable, the stores listen to them. Stores don't need\
    \ to have big switch statements that do static type checking (of action types)\
    \ with strings.\n- Stores can listen to other stores; it is possible to create\
    \ stores that can aggregate data further, similar to a map/reduce.\n- Action creators\
    \ are not needed, because Reflux actions are functions that will pass on the payload.\n\
    \nTo understand Reflux, let's create a simple structure.\n\n### 1. Actions\nOpen\
    \ Actions/TodoActions.js:\n\n```javascript\n'use strict';\nvar Reflux = require('reflux');\n\
