  - "[PAGE 134]\n\n# Animations\n\nFluid, meaningful animations are essential in creating\
    \ a stunning user experience. In this section, we will achieve this using React\
    \ Native animation APIs. Animations with React Native revolve around two complementary\
    \ systems: LayoutAnimation for animating global layout transactions, and Animated\
    \ for more granular control over specific properties.\n\nThe Animated library\
    \ is designed in a way to make a variety of amazing animations and interactions\
    \ with your app with simplicity and high performance. The Animated library focuses\
    \ on configurable transforms in between, having declarative relationships between\
    \ input and output, and easy start-stop methods, which control animations based\
    \ on time.\n\nLet's understand this library with an example by creating an AnimationExample\
