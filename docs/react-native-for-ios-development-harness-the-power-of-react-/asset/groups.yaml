    # CHAPTER 1: Learning the Basics: A Whistle-Stop Tour of React


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_14_0.png)


    Figure 1-1. Virtual DOM and diffing algorithm operations


    Manual DOM manipulation is messy, and keeping track of the previous state of the
    DOM is very hard. As shown in Figure 1-1, React solves this problem by keeping
    two copies of a virtual DOM. Next, a diffing algorithm is applied on these two
    virtual DOMs, which essentially checks for the changes that occurred and returns
    a stream of DOM operations. These DOM operations are then applied to the actual
    browser DOM.


    Let''s now understand in terms of components how a virtual DOM works. In React,
    every component has a state; this state is observable. Whenever there is a change
    in state, React essentially knows that this requires a re-render. So when the
    application state changes, it generates a new VTree; once again the diff algorithm
    shared the DOM paths for required changes, as shown in Figure 1-2. This results
    in keeping manual DOM manipulation to the minimum.


