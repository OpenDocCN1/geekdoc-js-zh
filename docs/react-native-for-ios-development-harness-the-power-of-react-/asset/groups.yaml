    # Chapter 2


    # # The Simplest Program: Hello World with React Native


    > “Big things have small beginnings.”


    —Prometheus


    In the last chapter, you got a good overview of the React ecosystem. Now it''s
    time to get your hands dirty with React Native. In this chapter, you will set
    up your environment by installing the prerequisites and then you will create your
    first React Native application.


    The best way to learn is through practical examples. Continuing this theme throughout
    the book, you will follow examples to learn React Native by programming to understand
    the concepts.


    In this chapter, you will explore the following topics:


    +   * An introduction to React Native

    * The essentials of React Native

    * The installation of React Native

    * Your first application

    * The anatomy of a React Native application

    * How to debug your application


    Note You might face a situation where different projects work on different Node
    versions. Therefore, it''s recommended you install NVM (node version manager)
    to help keep multiple node versions that can be switched between projects.'
- md: '

    # What Is React Native?


    React Native is an open source platform for developing native mobile applications;
    it was developed largely by a team at Facebook. The cool part of working with
    React Native is that your program uses standard web technologies like JavaScript
    (JSX), CSS, and HTML, yet your application is fully native. In other words, your
    application is blazing fast and smooth, and it is equivalent to any application
    built using traditional iOS technologies like Objective-C and Swift. React Native
    does not compromise in terms of performance and overall experience, like popular
    hybrid frameworks that use technologies to build apps.


    React Native aims to bring the power of React, which was explained in Chapter
    1, to mobile development. In the words of the React team, "once learn, write anywhere."
    Working with React and React Native, you will see how many of your components
    built for the Web can be easily ported to your React Native iOS apps with little
    or no modification. React Native introduces a highly functional approach to constructing
    user interfaces, which is very different from the traditional iOS development
    approach.


    Although React Native was built by Facebook developers, it''s an open source project.
    The code is available at https://github.com/facebook/reactnative-native.


    # React Native Prerequisites


    Before starting the installation, let''s first review the prerequisites for React
    Native:


    - iOS apps can be developed on only an Apple Mac with OSX installed. You need
    OSX version 10.10 or above.

    - You need Xcode 6 or above, which includes the iOS SDK and simulators. React
    Native only supports iOS7 or above. Xcode can be downloaded from the Apple App
    Store.

    - It''s helpful if you are enrolled in the Apple iOS Developer Program. If you''re
    not in the iOS Developer Program, you won''t be able to:

    - Test applications on actual devices.

    - Access beta OS releases.

    - Test flight for beta testing.

    - Submit your app to the App Store.


    # Installation


    Let''s do a quick, one-time setup of React Native. React Native is an assortment
    of JavaScript and Objective-C code, so you need tools to create, run, and debug
    your native application written in JavaScript. Let''s go one by one.


    # Installing Node and npm


    Node.js is an open source platform built on Chrome''s JavaScript runtime; it offers
    a way to easily build fast, scalable programs. Node.js allows you to run JavaScript
    in Terminal, and helps create modules. Install Nodejs by running the following
    command in Terminal: $brew install node.


    Homebrew is the recommended way to install Node. You can also download the installer
    from https://nodejs.org and install it manually.


    npm is the package manager for Node.js. If you''re from the iOS world, it''s similar
    to CocoaPods.


    Check your Node installation by running the following command in Terminal:


    ```

    > node -v

    v4.2.1

    ```


    ```

    > npm -v

    2.13.1

    ```


    # Installing Watchman


    Watchman observes your files and records when they change. It can also trigger
    actions (such as rebuilding assets) when matching files change. For more details,
    visit https://facebook.github.io/watchman/


    You can install Watchman by running the following command:


    $brew install watchman


    # Installing the React Native Package


    React Native comes as an npm package, so use the following code to install the
    React Native-cli module:


    ```

    npm install -g react-native-cli

    ```


    # Updating React Native


    Both React Native and iOS are fast-moving frameworks. It is recommended to update
    every time a new release is available. Upgrading React Native is simple. Run the
    following command in Terminal:


    ```

    npm update -g react-native-cli

    ```


    # Your First App


    Now that you are all charged up React Native and have your system set up, it''s
    time to create your first application. To keep things simple, in the beginning
    just follow along. Sometimes you might feel disconnected by monotonously typing
    in the code, but going along is enough for now. Remember that mimicry is a powerful
    form of learning; it''s how we learned most of our skills, such as talking, reading,
    writing, and it is how you will learn to program with React Native. As you proceed,
    this method will help you understand deeply why you authored certain pieces of
    code.


    Throughout the book, you will create one application and take it from Hello World
    to a full-blown, distribution-level application, except in some places where we
    need to digress to explore a concept independently. Before you set it up, let''s
    talk about the problem you plan to solve. The app you will create during the course
    of this book plans to solve a few housing problems; it will be a very primitive
    version of any property search application.


    Let''s call it HouseShare. It will have some rudimentary features like listings,
    creating an entry, geolocating a property, and many more. As you move along, you
    will see how React Native features fit with your application.


    That''s quite a lot, but in this chapter you will create the basic structure for
    your project using React Native and some Hello World code.


    # Creating a Basic Skeleton


    Fire up Terminal and type in the following command:


    ```

    react-native init HouseShare

    ```


    This code uses the CLI tool to construct a React Native project that is ready
    to build and run as-is. This command creates the basic folder structure for your
    React Native iOS project. Next, let''s get into this directory:


    ```

    cd HouseShare/

    ```


    Now, click HouseShare.xcodeproj. This is an Xcode project file and will open up
    your project in Xcode. Next, let''s load your application in the iOS simulator.
    To build your application and load it in the simulator, simply click the Run button
    at the top (Figure 2).


    # The Simplest Program: Hello World


    Figure 2-1. Building by clicking the button


    Figure 2-2. Using the simulator


    Figure 2-3. The packager is ready


    Figure 2-4. Refreshing the screen

