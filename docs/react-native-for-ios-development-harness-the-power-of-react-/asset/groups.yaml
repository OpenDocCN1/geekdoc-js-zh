  - "[PAGE 145]\n\n# Fetch\n\nFetch is a popular networking API. It was created by\
    \ a standard committee and has well-defined requests, responses, and the process\
    \ to bind them. The following is an example of a post request with fetch:\n\n\
    ```\nfetch('https://example.com/endpoint/', {\n  method: 'POST',\n  headers: {\n\
    \    'Accept': 'application/json',\n    'Content-Type': 'application/json',\n\
    \  },\n  body: JSON.stringify({\n    firstParam: 'yourValue',\n    secondParam:\
    \ 'otherValue',\n  })\n});\n```\n\nFetch returns a promise, which is processed\
    \ using then and catch.\n\n```\nfetch('https://example.com/endpoint')\n  .then((response)\
    \ => response.text())\n  .then((responseText) => {\n    console.log(responseText);\n\
    \  })\n  .catch((error) => {\n    console.warn(error);\n  });\n```\n\nNow that\
    \ you know how to interact with network APIs, let's use one of the options, fetch,\
