    # Chapter 6


    # Communicating with Servers


    > "Communication is everyone’s panacea for everything."


    —Tom Peters


    After learning about the powers of device capabilities via multiple examples,
    it’s time to get back to your housing application. So far, you have been populating
    your app locally with some dummy data, but no application can survive without
    communicating with a server. In this chapter, you will learn how to interact with
    network APIs. You will explore the following topics:


    +   * XMLHttpRequest

    * WebSocket

    * Fetch

    * Getting data from a server

    * Posting data to a server


    Earlier you were getting all the data from a dummy data, which was static within
    your application. It’s a rare chance any production application will entirely
    work with static data. Happily, React Native provides many ways to interact with
    network APIs. The following sections cover the network stack is supported in React
    Native.


    # XMLHttpRequest


    XMLHttpRequest is an API that provides the ability to transfer data between a
    client and a server. It provides an easy way to retrieve data from a URL without
    having to do a full-page refresh. In React Native, the XMLHttpRequest API is applied
    on top of the iOS networking APIs. A notable difference from the Web is the security
    model; you can read from any website on the Internet there is no concept of CORS.'
