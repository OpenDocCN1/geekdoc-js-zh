    \ 'http://imp.me/ol16'}},\n  {name: 'Mr. Nalways Villa', address: '11, Heights,\
    \ Oceania', images: {thumbnail: 'http://imp.me/ol17'}}\n];\n```\n\nIn this code\
    \ we added more entries in order to create a scrollable view. Now, let's look\
    \ at the changes we make in our ListProperty component:\n\n```javascript\nvar\
    \ ListProperty = React.createClass({\n  getInitialState: function() {\n    var\
    \ ds = new ListView.DataSource({rowChanged: (r1, r2) => r1 !== r2});\n    return\
    \ {\n      dataSource: ds.cloneWithRows(MOCK_DATA),\n    }\n  },\n  render: function()\
    \ {\n    return (\n      <ListView\n        dataSource={this.state.dataSource}\n\
    \        renderRow={this.renderProperty}\n        style={styles.list} />\n   \
    \ );\n  },\n  renderProperty: function(property) {\n    return (\n      <View\
    \ style={styles.container}>\n        <Image\n          source={{uri: property.images.thumbnail}}\n\
    \          style={styles.thumbnail} />\n        <View style={styles.rightContainer}>\n\
    \          <Text style={styles.name}>{property.name}</Text>\n          <Text style={styles.address}>{property.address}</Text>\n\
    \        </View>\n      </View>\n    );\n  }\n});\n```\n\nHere, we set the component\
    \ specification of getInitialState:\n\n```javascript\ngetInitialState: function()\
    \ {\n  var ds = new ListView.DataSource({rowHasChanged: (r1, r2) => r1 != r2});\n\
    \  return {\n    dataSource: ds.cloneWithRows(MOCK_DATA),\n  };\n};\n```\n\ngetInitialState\
    \ is invoked only once before the component is mounted. The return value will\
    \ be used as the initial value of this.state.\n\nNext, we updated the render function:\n\
