    \ and again we need to change our localhost to the machine's IP address in the\
    \ following section of code:\n\nFrom\n\n```objectivec\n+   - (instype)init\n \
    \ return [self initWithURL:[RCTConvert NSURL:@\"http://localhost:8081/debugger-proxy\"\
    ]];\n}\n```\n\nto\n\n```objectivec\n+   - (instype)init\n  {\n    return [self\
    \ initWithURL:[RCTConvert NSURL:@\"http://your-machine-ip-address:8081/debugger-proxy\"\
    ]];\n  }\n```\n\nWith this change, we can debug our application just like we have\
    \ so far using the simulator.\n\n## Popular Modules for React Native\n\nThe React\
    \ Native community may be young, but it has already started to flourish. Like\
    \ any other framework, lists of open-source projects have been created, which\
    \ helps developers to avoid re-inventing features already developed. You can find\
    \ hundreds of such node modules on GitHub; we are listing a few that can help\
    \ you quickly build and deliver your React Native application.\n\n## react-native-fbsdk\n\
    \nReact Native FBSDK is a wrapper for iOS Facebook SDK that helps Facebook integration\
    \ with React Native apps. Documented JavaScript modules help native components\
    \ like login, sharing, and share using three npm modules. Packages: react-native-fbsdkore,\
    \ react-native-fbsdkshare, and react-native-fbsdklogin-that's.\n\nFor complete\
    \ documentation or to make a contribution to this project, you may visit the following:\
    \ https://github.com/facebook/react-native-fbsdk.\n\n## react-native-scrollable-tab-view\n\
    \nFluid animations really need adding to any feature in your application. React\
    \ Native animations API are getting robust very rapidly; creating animations for\
    \ scrolling within tabs is a problem solved by the react-native-scrollable-tab-view\
    \ npm package. It's a very JavaScript-only implementation for React Native.\n\n\
    For complete documentation or to make a contribution to this project, you may\
    \ visit the following: https://github.com/brentvatne/react-native-scrollable-tab-view.\n\
    \n## react-native-webpack-server\n\nreact-native-webpack-server allows you to\
    \ use the webpack ecosystem with React Native. It is a developer server that uses\
    \ Webpack Dev Server and the React Packager to enable building React JavaScript\
    \ bundles with webpack.\n\nFor complete documentation or to make a contribution\
    \ to this project, you may visit the following: https://github.com/mjohnston/react-native-webpack-server.\n\
    \n## react-native-side-menu\n\nA simple implementation of an expandable side menu,\
    \ this package adds you a side menu that scrolls from either the left or right\
    \ side with an easy swipe gesture.\n\nFor complete documentation or to make a\
    \ contribution to this project, you may visit the following: https://github.com/react-native-fellowship/react-native-side-menu#component-props.\n\
    \nHere are some other notable mentions:\n\n- react-native-vector-icons\n- react-native-facebook-login\n\
    - react-native-google-places-autocomplete\n- react-native-sqlite-storage\n- react-native-tableview\n\
    - react-native-background-geolocation\n\n## Where to Go from Here\n\nCongratulations.\
    \ You have learned a lot about the React Native framework. It's just the beginning,\
    \ as the React Native community and ecosystem is expanding rapidly every day.\
