    # Summary


    In this chapter, you were introduced to React Native. You set up the React Native
    development environment and you wrote your first application. You also learned
    about the folder structure of React Native applications and how to debug. You
    are now all set to take a deep dive into creating a user interface with React
    Native for your iOS application.


    In the next chapter, you will learn how to create stunning user interfaces by
    mastering Flexbox. You''ll see how to navigate from one component to another,
    how to add images to your unembellished application, and how to create a ListView
    and ScrollView using React Native.'
