    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_86_0.png)


    **Figure 4-2.** An explosion of arrows


    With so many models and views interacting with each other, when we track a model
    it triggers a view, and the view triggers another model, and this goes on spaghetti,
    which many times ends up in an infinite loop. The worst part is that it''s really
    difficult to debug code in such a situation, which eventually makes the system
    fragile. Well, Facebook faced similar setbacks and solved this problem with a
    new pattern called Flux!


    ## Flux


    Flux replaces MVC in a unidirectional data flow. Flux works well, since the single-direction
    data flow makes it easy to understand and modify an application as it grows and
    becomes more complicated. Earlier, we found that two-way data bindings lead to
    cascading updates, where change in one data model leads to another data model,
    making it very difficult to predict what would change as the result of a single
    user interaction. As shown in Figure 4-3, Flux applications have three major parts:
    the dispatcher, the stores, and the views (where we use React Native components).
    These should not be compared with the Model View Controller elements of the MVC
    pattern.


    ## CHAPTER 4: Flux: Solving Problems Differently


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_87_0.png)


    **Figure 4-3.** Three major components of Flux


    Image source: https://github.com/facebook/blob/master/docs/img/flux-diagram-white-background.png


    Though controllers exist in a Flux application, they are controller views, where
    views are found at the top of the hierarchy that retrieves data from the stores
    and forwards it to their children. Looking at Figure 4-4, the most important part
    of the Flux architecture is the dispatcher, which is a singleton that directs
    the flow of data and ensures that updates do not cascade.


    ## FLUX


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_87_1.png)


    **Figure 4-4.** Dispatcher directs the flow of data


    As an application grows, the dispatcher becomes more vital, as it is responsible
    for managing dependencies between stores by invoking the registered callbacks
    in a specific order.


    When a user interacts with a React Native view, the view sees an action (usually
    represented as a JavaScript object with some fields) through the dispatcher, which
    notifies the various stores that hold the application''s data and business logic.
    When the stores change state, they notify the views that something has been updated,
    well with React Native''s declarative model, which allows the stores to send updates
    without specifying how to transition views between states.


    In short, Flux offers the following benefits:


    - Improves data consistency

    - Makes it easier to pinpoint the bugs

    - Offers more meaningful unit tests; since all the states of a module are in the
    same place, we can test a module independently

    - Contains predictable code


    ## Success of Flux


    One of Facebook''s most popular features was chat. However, it was extremely buggy
    and had the negative user feedback. The new chat system that Facebook implemented
    uses Flux, and it now has a seamless experience; you can look at example code
    in Facebook React Native Example at the following URL:


    https://github.com/facebook/flux/tree/master/examples/flux-chat.


    ## Flux Deep Dive


    In this section, we''ll take a closer look at Flux''s core concepts.


    ## The Dispatcher


    The dispatcher is the central hub that manages all data flow in a Flux application.
    It is essentially a registry of callbacks into the stores and has no real intelligence
    of its own; it is a simple mechanism for distributing the actions to the stores.
    Each store registers itself and provides a callback. When an actor creates the
    dispatcher with a new action, any action, stores in the application receive the
    action via the callbacks in registry. Dispatcher also acts like a traffic controller.
    If it gets an action while the data layer is still processing, it can reject the
    action, which is a good constraint to have. It is a guarantee that you will know
    when your actor starts and what changes it makes to the data layer, as there are
    cascading effects that build up in between—you are in full control of your system.


    ## The Need for Dispatcher [dispatch() and waitFor()]


    As an application grows, dependencies across different stores also increase. Imagine
    a situation where store A needs store B to update first, so that it can itself
    know how to update. We need the dispatcher to invoke the callback for store B,
    and finish that callback, moving forward with store A. To assert this dependency,
    store A needs to communicate with the dispatcher to first complete the action
    updating store B. The dispatcher provides this functionality through the waitFor()
    method.


    The dispatch() method provides a simple, synchronous iteration through the callbacks,
    invoking each in turn. When waitFor() is encountered within one of the callbacks,
    execution of that callback stops and waitFor() provides us with a new iteration
    cycle over the dependencies. After the entire set of dependencies has been fulfilled,
    the original callback continues to execute.


    Further, the waitFor() method may be used in different ways for different actions,
    within the same store''s callback. In one case, store A might need to wait for
    store B. In another case, store B might need to wait for C. Problems arise if
    we have circular dependencies, but the waitFor method allows us to resolve this.


    ## Stores


    Stores contain the application state. Their role is somewhat similar to models
    in MVC, but they manage the state and logic. As mentioned earlier, stores are
    not directly linked to views. Instead, they receive actions through the dispatcher.
    When a store changes, it notifies the views.


    ## Actions


    Actions are objects that describe something happened in the application. They
    are triggered by views or other stores and are sent to the dispatcher, which then
    broadcasts them to all stores. Each action has a type and some associated data.

