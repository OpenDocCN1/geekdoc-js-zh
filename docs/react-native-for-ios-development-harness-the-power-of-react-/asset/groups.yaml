    var {\n  Image,\n  Stylesheet,\n  Text,\n  View,\n  ListView\n} = React;\n```\n\
    \nWe have once again specified what all components will be used for this section.\
    \ There is a new component added—ListView. If you have seen React Native documentation\
    \ besides ListView to implement simple functionality, it may be ScrollView. ListView\
    \ is, however, much better than simply rendering all of these elements or putting\
    \ them in a ScrollView. This is because, despite React Native being fast, rendering\
    \ a very big list of elements could be few. Similar to TableView, ListView implements\
    \ the rendering list of elements that you only display the ones on screen; already\
    \ rendered but that are off screen are removed from the native-view hierarchy,\
    \ which makes the rendering smooth and fast.\n\nMoving forward, we have updated\
    \ our MOCK_DATA:\n\n```javascript\nvar MOCK_DATA = [\n  {name: 'Mr. John Conch\
    \ house', address: '12th Street, Neverland', images: {thumbnail: 'http://imp.me/ol15'}},\n\
    \  {name: 'Mr. Paul Mansion', address: '625, Sec-5, Ingsoc', images: {thumbnail:\
