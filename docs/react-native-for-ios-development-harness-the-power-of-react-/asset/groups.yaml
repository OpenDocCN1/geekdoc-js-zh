    # About the Authors


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_8_0.png)


    Akshat Paul is a developer and author of the book "RubyMotion iOS Development
    Essentials". He has extensive experience of mobile and web development and has
    delivered many enterprise and consumer applications over the years.


    In other avatars, Akshat frequently speaks at conferences and meetups on various
    technologies. He has given talks at RubyConf India, RubyMotion #Inspect conference
    in Brussels and was keynote speaker at technology leadership events in Bangkok.
    Besides writing code, Akshat spends time with his family, is an avid reader and
    obsessive about healthy eating.


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_8_1.png)


    Abhishek Nalway is an author of the book, "RubyMotion iOS Development Essentials".
    He is a Ruby enthusiast and loves to participate regularly at Ruby and Ruby on
    Rails meetup groups. He works for a management consulting firm. He has spoken
    at many conferences, meetups like RubyConf India and the RubyMotion #inspect conference.
    Besides programming, Abhishek loves to run a few miles and cook healthy food.


    # About the Technical Reviewer


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_9_0.png)


    Bruce Wade is the founder of Warply Designed Inc. (www.warplydesigned.com), a
    company specializing in using game technology for real-world applications. He
    has more than 16 years of software development experience with a strong focus
    on 2D/3D animation and interactive applications, primarily using Apple technology.


    # Acknowledgments


    We would like to thank our families and friends, who saw us through this book,
    provided support, talked things over, read, wrote, and offered comments, without
    which conceiving this book wouldn''t been possible.


    Also, we would like to thank Melissa, Louise, James, the entire team at Apress,
    and especially Jeffrey Pepper who allowed us to quote their remarks and assisted
    in the editing, proofreading, and design of this book. Writing a book is a long
    and arduous journey, but you all made it so easy for us.


    # Introduction


    As the title suggests, this is an introduction to React Native. React has become
    a leading technology for building fast, responsive native apps.


    You will begin by understanding the path breaking concepts of React, which makes
    it distinctive. React is a JavaScript library for creating user interfaces and
    yet is much more. You will set up React Native and begin exploring the anatomy
    of React Native apps. You will learn about the React "way of thinking" and "write
    once and everywhere" and how that works. You will learn how React offers an incredible
    and simple solution in Virtual DOM to speed up large app and you''ll learn about
    flux architecture, how it differs from MVC, and how you will learn to create stunning
    user interfaces and interact with the various capabilities of your project to
    solve problems differently and efficiently. You will then boost your development
    capabilities by including some popular packages already developed by the React
    Native community that helps you write less but do more. Finally, you''ll learn
    how to write test cases and submit your application to App Store. Using real-world
    examples with an example-driven approach, you will learn by doing and having a
    running app at the end of each chapter.


    In all, we hope that you will find this a useful and quick read that you will
    get started creating responsive and efficient apps.


