  mdcn: "\n布局系统是创建优秀应用必须掌握的基础概念。让我们先了解如何使用 React Native 在 iOS 应用程序中进行导航。\n\n## NavigatorIOS\n\
    \nNavigatorIOS 是用于创建导航的 React Native 组件。它封装了 UIKit 导航，并允许你为应用添加侧滑返回功能。NavigatorIOS\
    \ 管理视图控制器栈，以为分级内容提供钻取式（drill-down）界面。现在我们已经知道了 NavigatorIOS 的作用，让我们在项目中实现它。\n\n\
    首先，在 `index.ios` 文件的组件列表中添加 NavigatorIOS：\n\n```\nvar {\n  AppRegistry,\n  StyleSheet,\n\
    \  Text,\n  View,\n  NavigatorIOS,\n} = React;\n```\n\n让我们创建一个包含 NavigatorIOS\
    \ 的组件并命名为 `mainView`，然后在 `mainView` 中加载另一个组件，我们将其命名为 `Home`：\n\n```\nvar mainView\
    \ = React.createClass({\n  render: function() {\n    return (\n      <NavigatorIOS\n\
    \        style={styles.navigator} initialRoute={{\n          title: 'House Share',\n\
    \          component: Home\n        }}/>\n    );\n  }\n});\n```\n\n`Home` 组件将作为我们应用的主页。\n\
    \nNavigatorIOS 是一个 React Native 组件；我们还通过 `initialRoute` 为页面提供了标题（House Share）和组件名称（Home）。还有其他可用选项，文档可以在\
    \ https://facebook.github.io/react-native/docs/navigators.html 中查阅。\n\nNavigatorIOS\
    \ 使用最基础的 iOS 路由。路由（route）是一个描述导航器中每个视图的对象。首先，将路由提供给 NavigatorIOS。在之前的代码中，我们从 `mainView`\
    \ 中调用了 `Home` 组件。让我们添加一个空的 `Home` 组件：\n\n```\nvar Home = React.createClass({\n\
    \  render: function() {\n    return (\n      <View>\n    </View>\n  );\n  }\n\
    });\n```\n\n让我们也为 `mainView` 组件添加一些样式：\n\n```\nvar styles = StyleSheet.create({\n\
    \  container: {\n    flex: 1,\n    justifyContent: 'center',\n    alignItems:\
    \ 'center'\n  },\n  welcome: {\n    fontSize: 25,\n    textAlign: 'center'\n \
    \ },\n  navigator: {\n    flex: 1\n  }\n});\n```\n\n现在将应用的入口点更新为 `mainView`：\n\
    \n```\nAppRegistry.registerComponent('HouseShare', () => mainView);\n```\n\n使用\
    \ Xcode 构建我们的应用并查看结果，如图 3-1 所示。\n\n## 第 3 章：画布、画笔与绘画：用户界面交互\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_53_0.png)\n\
    \n**图 3-1.** 我们的应用，顶部有更新后的导航栏\n\n太棒了——我们可以在顶部看到更新后的导航栏。给这个导航栏添加一些颜色，让我们的更改更加明显：\n\
    \n```\nvar mainView = React.createClass({\n  render: function() {\n    return\
    \ (\n      <NavigatorIOS \n        barTintColor='#48BBEC' \n        titleColor=\"\
    #FFFFFF\" \n        style={styles.navigator} \n        initialRoute={{\n     \
    \     title: 'House Share',\n          component: Home\n        }}\n      />\n\
    \    );\n  }\n});\n```\n\n我们使用了 `barTintColor` 和 `titleTextColor` 为导航栏添加颜色（见图\
    \ 3-2）。\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_54_0.png)\n\n**图 3-2.** 我们的工具栏现在有了颜色\n\
    \n我们在这一节中进行了一些样式处理，如果你来自网格布局背景，这可能是你的新知识。React Native 使用 Flexbox 进行样式设置，我们将在下一节详细讨论。\n\
    \n## Flexbox\n\n在之前的示例中创建布局时，你一定看到了故事中提到的 `flex` 属性。这是因为 React Native 应用使用了 Flexbox\
    \ 布局模型。\n\nReact Native 的布局模型灵感来自 CSS3 中的 CSS Flex Layout。React Native 团队专门为 iOS\
    \ 重写了这一功能。Flexbox 的核心思想是可以在不担心不同屏幕尺寸或设备方向的情况下创建布局。Flex 容器会扩展项目以填充可用空空间，或收缩它们以防止溢出。让我们获取一些\
    \ Flexbox 的基础知识以加速我们的布局开发。首先，更新视图：\n\n```\nvar Home = React.createClass({\n  render:\
    \ function() {\n    return (\n      <View style={styles.container}>\n        <View\
    \ style={styles.topBox} />\n        <View style={styles.bottomBox} />\n      </View>\n\
    \    );\n  }\n});\n```\n\n我们创建了一个带有 `container` 样式的主视图，以及两个带有 `topBox` 和 `bottomBox`\
    \ 样式的子视图。现在，创建样式：\n\n```\nvar styles = StyleSheet.create({\n  container: {\n \
    \   flex: 1,\n    flexDirection: 'column'\n  },\n  welcome: {\n    fontSize: 25,\n\
    \    textAlign: 'center'\n  },\n  navigator: {\n    flex: 1\n  },\n  topBox: {\n\
    \    flex: 2,\n    backgroundColor: '#CCE5FF',\n  },\n  bottomBox: {\n    flex:\
    \ 1,\n    backgroundColor: '#FFFFCC'\n  }\n});\n```\n"
