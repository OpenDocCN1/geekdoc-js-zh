- md: "\nFinally, we render our components on the view with the latitude and longitude\
    \ description having its respective style and the updated MapView component with\
    \ its respective style, region mapping and annotations.\n\n## AsyncStorage\n\n\
    AsyncStorage is a key-value based storage system. It can be easily implemented\
    \ and is globally available to the app. This persistence system is simple and\
    \ asynchronous, and also a recommended way way to store data.\n\nLet's create\
    \ an AsyncStorage example application; to do so, execute the following command:\n\
    \n```bash\n$react-native init AsyncStorage\n```\n\nGreat now lets add the following\
    \ code in our index.ios.\n\n```javascript\n'use strict';\n\nvar React = require('react-native');\n\
    var {\n  AppRegistry,\n  StyleSheet,\n  Text,\n  View,\n  TextInput,\n  TouchableHighlight,\n\
    \  AsyncStorage\n} = React;\n\nvar STORAGE_KEY = '@AsyncStorageExample:someKey';\n\
    \nvar AsyncStorageExample = React.createClass({\n  getInitialState: function()\
    \ {\n    return {\n      messages: \"\",\n      inputTextMessage: \"\"\n    };\n\
    \  },\n  componentDidMount() {\n    AsyncStorage.getItem(STORAGE_KEY).then((value)\
    \ => {\n      this.addMessage(value);\n    }).done();\n  },\n\n  addMessage(message)\
    \ {\n    this.setState({messages: message});\n  },\n});\n```\n\n## CHAPTER 5:\
    \ Device Capabilities\n\n```javascript\nupdateStorage () {\n  AsyncStorage.setItem(STORAGE_KEY,\
    \ this.state.textInputMessage);\n  AsyncStorage.getItem(STORAGE_KEY).then((value)\
    \ => {\n    this.addMessage(value);\n  }}done();\n}\n```,\n\n```javascript\nrender()\
    \ {\n  return (\n    <View style={styles.container}>\n      <View style={styles.form}>\n\
    \        <TextInput\n          style={styles.textField}\n          onChangeText={(textMessage)\
    \ => this.setState({value:this.state.textInputMessage})}\n        />\n       \
    \ <TouchableHighlight style={styles.button} onPress={this.updateStorage}>\n  \
    \        <Text>Update Storage</Text>\n        </TouchableHighlight>\n      </View>\n\
    \      <View style={styles.message}>\n        <Text>Text from local storage:</Text>\n\
    \        <Text>{this.state.messages}</Text>\n      </View>\n    </View>\n  );\n\
    }\n});\n```\n\n```javascript\nvar styles = StyleSheet.create({\n  container: {\n\
    \    flex: 1,\n    justifyContent: 'center',\n    alignItems: 'center',\n    backgroundColor:\
    \ '#F5FCFF',\n  },\n  form: {\n    flex: 1,\n    justifyContent: 'center',\n \
    \   alignItems: 'center',\n  },\n  textfield: {\n    height: 40,\n    borderColor:\
    \ 'gray',\n    borderWidth: 1,\n    width: 180,\n  },\n  message: {\n    flex:\
    \ 1,\n    alignItems: 'center'\n  }\n});\n```\n\n```javascript\nbutton: {\n  backgroundColor:\
    \ '#05A5D1',\n  marginTop: 10,\n  height: 40,\n  width: 180,\n  alignItems: 'center',\n\
    \  justifyContent: 'center'\n}\n);\nAppRegistry.registerComponent('AsyncStorage',\
    \ () => AsyncStorageExample);\n```\n\nLet's build our application in Xcode to\
    \ see the results. You can enter the text in a text box as shown in Figure 5-8\
    \ and then click \"Update Storage.\"\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_118_0.png)\n\
    \nFigure 5-8. Storage is updated\n\nOnce that is done refresh for the result shown\
    \ in Figure 5-9.\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_119_0.png)\n\n**Figure\
    \ 5-9.** Text from the async storage mechanism\n\nThis time the text below “Text\
    \ from local storage” is coming from the async storage mechanism, which we have\
    \ set in place.\n\n## Reviewing the AsyncStorage Code\n\nIn this example, we have\
    \ included the AsyncStorage default component in our list of components to be\
    \ used for this app.\n\n```javascript\nvar React = require('react-native');\n\
    var {\nAppRegistry,\nStyleSheet,\nText,\nView,\nTextInput,\nTouchableHighlight,\n\
    AsyncStorage\n} = React;\n\nvar STORAGE_KEY = '@AsyncStorageExample:someKey';\n\
    \nWe will be using this AsyncStorage React component within our AsyncStorage component.\
    \ Above, we have also specified a key, which we will use, with our AsyncStorage.\n\
    \nInside our AsyncStorageExample component we have set up getInitialState and\
    \ componentDidMount methods and also, created addMessage & updateStorage. Let's\
    \ discuss them one by one.\n\n```javascript\ngetInitialState: function() {\n \
    \ return {\n    messages: '',\n    inputTextMessage: ''\n  };\n}\n```\n\nIn getInitialState\
    \ we have specified blank values for messages & inputTextMessages, we will keep\
    \ updating as and when their state changes.\n\n```javascript\ncomponentDidMount()\
    \ {\n  AsyncStorage.getItem(STORAGE_KEY).then((value) => {\n    this.addMessage(value);\n\
    \  });\n}\n```\n\nWith componentDidMount we have specified blank values for messages\
    \ & inputTextMessages, the state.\n\n```javascript\naddMessage(message) {\n  this.setState({messages:\
    \ message});\n}\n```\n\nWith addMessage we set up the state.\n\n```javascript\n\
    updateStorage() {\n  AsyncStorage.setItem(STORAGE_KEY, this.state.textInputMessage);\n\
    \  AsyncStorage.getItem(STORAGE_KEY).then((value) => {\n    this.addMessage(value);\n\
    \  });\n}\n```\n\nWith updateStorage we set up the state.\n\n## Native Alert\n\
    \nAlerts are used to give important information to application users. In the case\
    \ of iOS, only after selecting the option in the alert, we can proceed to use\
    \ the app. Optionally, we can provide a list of buttons. Tapping any button will\
    \ fire the respective callback and dismiss the alert. By default, there is only\
    \ one button.\n\nLet's create a project to understand more about native alert:\n\
    \n```bash\n$react-native init NativeAlert\n```\n\nReact Native provides a component\
    \ IOS for creating Alert boxes. Let's create a Button that will open an alert\
    \ box when clicked.\n\nUpdate index.js with the following code:\n\n```javascript\n\
    'use strict';\n\nvar React = require('react-native');\nvar {\n  AppRegistry,\n\
    \  StyleSheet,\n  Text,\n  View,\n  TouchableHighlight,\n  AlertIOS\n} = React;\n\
    \nvar NativeAlert = React.createClass({\n  render: function() {\n  return (\n\
    \    <View style={styles.container}>\n      <TouchableHighlight style={styles.wrapper}\n\
    \        onPress={() => AlertIOS.alert(\n        'Alert Title',\n        'Alert\
    \ Message'\n      )}>\n        <View style={styles.button}>\n          <Text style={styles.buttonText}>Click\
    \ me !!</Text>\n        </View>\n      </TouchableHighlight>\n    </View>\n  );\n\
    \  }\n});\n\nvar styles = StyleSheet.create({\n  container: {\n    flex: 1,\n\
    \    justifyContent: 'center',\n    alignItems: 'center',\n    backgroundColor:\
    \ '#FFFFFF',\n  },\n  button: {\n    backgroundColor: '#659EC7',\n    padding:\
    \ 10,\n    margin: 10\n  },\n  buttonText: {\n    color: '#FFFFFF'\n  }\n});\n\
    \nAppRegistry.registerComponent('NativeAlert', () => NativeAlert);\n```\n"
  mdcn: "\n最后，我们在视图上渲染了组件，其中纬度和经度描述具有各自的样式，更新后的 MapView 组件也具有其相应的样式、区域映射和注释。\n\n##\
    \ AsyncStorage\n\nAsyncStorage 是一个基于键值的存储系统。它可以被轻松实现，并且对应用程序全局可用。这个持久化系统简单且异步，也是存储数据的一种推荐方式。\n\
    \n让我们创建一个 AsyncStorage 示例应用程序；为此，请执行以下命令：\n\n```bash\n$react-native init AsyncStorage\n\
