  - '[PAGE 17]


    Another issue with this system is making changes comes at a very high cost. When
    you introduce a new developer to an application that is this complex, it''s tough
    to understand the impact one change might cause in this abyss of spaghetti relationships.


    React follows one-way data flow to keep things simple, as shown in Figure 1-5.
    It is based on the concept of separation of concerns (SoC). This is a design principle
    in computer science where each application or program is divided into distinct
    sections, each addressing a single or specific concern. The value of this design
    principle is that it simplifies development to create a maintainable and scalable
    application. This leads to modularized code where an individual section can be
    reused, developed, and modified independently. This makes so much sense and is
    indeed an element of intelligent thinking.


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_17_0.png)


    Figure 1-5. React Native''s one-way data flow


