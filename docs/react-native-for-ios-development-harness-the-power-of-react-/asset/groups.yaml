    # Chapter 7


    # React Native Supplements


    > "A good way to stay flexible is to write less code."

    —Pragmatic Programmer


    By now, you should be comfortable building apps using React Native and have become
    accustomed to all the basics as well as many advanced features of the React Native
    framework. In this final chapter, we will learn about a few supplements, which
    may not be necessary but are very useful in certain situations and reduce our
    work significantly. In this chapter we will cover the following topics:


    +   - Reflux

    - Redux

    - Debugging on a device

    - Popular node modules

    - Where to go from here


    # Reflux


    We learned about Flux architecture in Chapter 4. We have some other ways to implement
    unidirectional data flow, including a lean approach to flux Reflux. It''s a simple
    library for unidirectional data flow inspired by React''s Flux. As shown in Figure
    7-1, a Reflux pattern has actions and stores. Actions initiate new data, which
    is passed through data stores, which are then passed to view components and in
    turn passed back to actions. If a view component has an event that makes changes
    to data stores, it needs to send a signal to the stores via the actions.'
  - '[PAGE 157]


    # CHAPTER 7: React Native Supplements


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_157_0.png)


    Figure 7-1. Reflux unidirectional flow


    # Differences from Flux


    Reflux has actually refactored Flux to be closer to Functional Reactive Programming
    (FRP). The following are a few differences between Reflux and Flux:


    +   - The singleton dispatcher is not present, letting every act like a dispatcher
    instead.


    +   - Because actions are listenable, the stores listen to them. Stores don''t
    need to have big switch statements that do static type checking (of action types)
    with strings.


    +   - Stores can listen to other stores; it is possible to create stores that
    can aggregate data further, similar to a map/reduce.


    +   - Action creators are not needed, because Reflux actions are functions that
    will pass on the payload they receive to listening to them.


    +   - waitFor is replaced to handle serial and parallel data flows. Aggregate
    data stores may listen to other stores in serial and to joins for joining listeners
    in parallel.


    In order to understand Reflux, let''s create a simple ToDo application just like
    we did earlier in Chapter 4. Let''s generate a React Native application:


    ```

    $ react-native init RefluxTodo

    ```


    Our basic project structure is now ready. Let''s add a Reflux node module to our
    project:


    ```

    $ cd RefluxTodo

    $ npm install --save-dev

    ```


    Now that we have Reflux added to our project, let''s create a structure that we
    can use with Reflux. First, create a root folder named Apps that contains the
    subfolders Actions, Components, and Stores, which hold the files shown in Figure
    7-2.'
