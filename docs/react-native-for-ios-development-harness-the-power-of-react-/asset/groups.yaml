    \  functionType: React.PropTypes.func,\n  objectType: React.PropTypes.object,\n\
    \  //if a value of a prop is necessary\n  numberType: React.PropTypes.number.isRequired\n\
    }\n```\n\nThere is also a default type in properties via the keyword getDefaultProps.\
    \ For in your component, you can mention default types for your message and age\
    \ properties:\n\n```javascript\ngetDefaultProps: function() {\n  return {\n  \
    \  message: 'Default value of message',\n    age: 0\n  };\n}\n```\n\n## State\n\
    \nIn the last section, you learned about properties, which are static values that\
