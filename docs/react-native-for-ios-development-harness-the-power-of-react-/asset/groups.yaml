    # CHAPTER 2: The Simplest Program: Hello World with React Native 33


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_43_0.png)


    **Figure 2-7.** Debugging options


    You must disable this menu for the final build because your end user should not
    see these options. To disable it, open the project in Xcode and select: Product
    > Scheme > Edit Scheme (or press Command + <). Then select Run from the menu on
    the left and change Configuration to Release.


    Let''s review each of the options in Figure 2-7.


    # Reload


    The reload option refreshes the screen in the simulator with the latest React
    Native code without compiling the project again. This can be done in two ways:
    one, by clicking the Reload option in the menu, as shown in Figure 2-7, or by
    pressing Command + R. This will reload all the changes made in the JavaScript
    code.


    Any changes made in your Swift or Objective-C files will not be reflected since
    these changes require recompilation. Also, if you add any assets like images,
    the app needs to be restarted.


