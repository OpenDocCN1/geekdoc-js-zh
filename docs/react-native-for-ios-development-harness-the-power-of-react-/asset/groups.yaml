    \ the id of 'container'. You can access this prop in JSX via interpolation in\
    \ the following way. Let's create a component App:\n\n```\nvar App = React.createClass({\n\
    \  render: function() {\n    var txt = this.props.txt\n    return (\n    <div>\n\
    \      <h1>{myProp}</h1>\n    </div\n  );\n  }\n});\n```\n\n```\nReact.render(<App\
    \ myProp=\"Hi from prop\" />, document.getElementById('container'));\n```\n\n\
    If you refresh your browser, you will see a message from the property for your\
    \ inner HTML. Please use the following code for your HTML file (the results are\
    \ shown in Figure 1-9):\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n</head>\n\
    <body>\n<div id=\"container\"></div>\n</body>\n<script src=\"http://fb.me/react-0.13.3.js\"\
    ></script>\n<script src=\"http://fb.me/JSXTransformer-0.13.3.js\"></script>\n\
    <script src=\"dist/bundle.js\"></script>\n</html>\n```\n\n![](img/44d9b147332295d6833a2b7d5f0c7aa8_24_0.png)\n\
    \n**Figure 1-9. Refreshing your browser produces this message**\n\nAs your application\
    \ grows, you need to make sure your components are correctly created in the first\
    \ place. In the case of a property, you can specify a kind of property with a\
    \ range of validators. This ensures and validates the kind of data received. Let's\
    \ look at some of them with an example:\n\n```javascript\nvar App = React.createClass({\n\
    \  propTypes: {\n    message: React.PropTypes.string,\n    age: React.PropTypes.number\n\
    \  },\n  render: function() {\n    // keeping props in a variable to use often\n\
    \    var message = this.props.message,\n    age = this.props.age\n    return (\n\
    \      <div>\n        <h1>{message}</h1>\n        <p>My age is {age}</p>\n   \
    \   </div>\n    );\n  }\n});\n\nReact.render(<App age={5} message=\"Hi from prop\"\
    \ />, document.getElementById('container'));\n```\n\nHere, the propType keyword\
    \ signifies a hash of prop names and their types. There are two propTypes in your\
    \ example: string and number for the message and age properties, respectively.\n\
    \nThere are many other property types. Note that you can add isRequired to the\
