    # Single Source of Truth


    The store of your application is stored in an object tree within a single store.
    A single-state tree has all the state changes done. This makes it easy to create
    universal apps, since we know all actions the client app has performed are done.
    It also makes debugging easier, since we can track all of the state changes.


    # State Is Read-only


    The only way to change the state is to emit an action-an object describing what
    happened. Thus, we can''t directly update state; it can only be updated through
    actions. View and network calls can''t update the state directly.


    # Mutations Are Written as Pure Functions


    To specify how the state tree is transformed by actions, you write pure reducers.
    Reducers will take old state and actions and return a new state. Reducers are
    normal JavaScript functions. It is important to understand that reducers do not
    update the state, they just return the new state.


    # Debug on Device


    So far we have been debugging and testing our application on an iOS simulator,
    which works perfectly most of the times, but in real-world projects we would need
    to load our application time and again on an iOS device to test and debug.


    To debug your iOS device, simply plug in your device (or in case it''s an iPad).
    Open Xcode and select your device instead of the simulator (see Figure 7-6).


