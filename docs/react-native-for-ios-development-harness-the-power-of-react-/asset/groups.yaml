    \n## Native Alert\n\nAlert 用于向用户提供重要信息。在 iOS 的情况下，只有在选择 alert 选项后我们才能继续使用应用程序。可选，我们可以提供按钮列表。点击任何按钮都会触发相应的回调并关闭\
