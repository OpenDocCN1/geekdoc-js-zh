    # # Summary


    In this chapter, we learned about capabilities of your iOS device beyond just
    user interface. We learned how to use Geolocation and loading maps for your app,
    AsyncStorage to persist data, Native alerts to share important info in your app,
    WebView to load HTML5 content and lastly animations.


    In next chapter we will learn how to interact with a backend server because probably
    no real world application is complete without connecting to a backend.'
