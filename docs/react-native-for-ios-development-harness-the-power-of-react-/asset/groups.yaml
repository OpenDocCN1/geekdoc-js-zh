- md: "\nThe result is the following bundle.js file:\n\n```\nvar App = React.createClass({\n\
    \  displayName: \"App\",\n  render: function render() {\n    return React.DOM.hi(null,\
    \ \"Hello Past\");\n  }\n});\nReact.render(App(), document.body);\n```\n\nAlthough\
    \ JSX is not required explicitly with React, it is preferred. It lets you create\
    \ JavaScript objects using HTML syntax. Components serve two purposes: template\
    \ and display logic. Therefore, markup and code are intimately tied. Display logic\
    \ is often quite complex and to express it using template languages become difficult.\
    \ The best way to solve this problem is to generate HTML and components from JavaScript\
    \ itself. JX solves these problems with its HTML-type syntax by creating React\
    \ nodes.\n\nYou can keep JSX source code intact for maintainability; just keep\
    \ it in a separate folder of JSX files. To convert JSX to normal JavaScript, use\
    \ the JSX compiler (http://facebook.github.io/react/jsx-compiler.html) either\
    \ manually or via a build script. It is possible to serve JSX files in your production\
    \ environment, but React will give you console about reduced performance.\n\n\
    ## Deep-Dive Into Components\n\nIn next section, you will explore the vital concepts\
