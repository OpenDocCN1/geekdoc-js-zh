  md: 'We are using our RefluxTodo application for this section, but you can use any
    React Native project you have built so far. Build the application to load it on
    the device. The application icon should appear, but we will get the error shown
    in Figure 7-7.


    ```

    Could not connect to development server.


    Ensure the following:

    - Node server is running - on the same network - run ''npm start'' from react-native-root

    - Node server URL is correctly set in AppDelegate


    URL: http://localhost:8081/index.ios.bundle/

    platform=ios&dev=true


    Could not connect to the server.


    Dismiss (ESC)          Reload JS (⌘R)

    ```


    Figure 7-7. "Unable to connect" error message


    The reason for this error is that our application is not able to connect to the
    development server. Let''s fix this by getting into our application code. Go to
    the AppDelegate.m file, which is usually placed in project-name/project-name/AppDelegate.m,
    and change the following lines:


    ```

    jsCodeLocation = [NSURLWithString:@"http://localhost:8081/index.ios.bundle?platform=ios&dev=true"];

    ```


    to:


    ```

    jsCodeLocation = [NSURLWithString:@"http://machine-ip-address:8081/index.ios.bundle?platform=ios&dev=true\];

    ```'
