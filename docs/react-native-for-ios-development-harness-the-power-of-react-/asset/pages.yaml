  md: '# CHAPTER 4: Flux: Solving Problems Differently 79


    well with React Native''s declarative model, which allows the stores to send updates
    without

    sifying how to transition views between states.


    In short, Flux offers the following benefits:


    +   - Improves data consistency

    - Makes it easier to pinpoint the bugs

    - Offers more meaningful unit tests; since all the states of a module are

    in there same place, we can test a module independently

    - Contains predictable code


    # Success of Flux


    One of Facebook''s most popular features was chat. However, it was extremely buggy
    and

    had the negative user feedback. The new chat system that Facebook implemented\uses
    Flux, and it now has a seamless experience; you can look at example code in

    Facebook React Native Example at the following URL:


    https://github.com/facebook/flux/tree/master/examples/flux-chat.


    # Flux Deep Dive


    In this section, we''ll take a closer look at Flux''s core concepts.


    # The Dispatcher


    The dispatcher is the central hub that manages all data flow in a Flux application.
    It is

    essentially a registry of callbacks into the stores and has no real intelligence
    of its own; it is

    a simple mechanism for distributing the actions to the stores. Each store registers
    itself andnprovides a callback. When an actor creates the dispatcher with a new
    action, any action,

    stores in the application receive the action via the callbacks in registry. Dispatcher
    also\acts like a traffic controller. If it gets an action while the data layer
    is still processing, it can

    reject the action, which is a good constraint to have. It is a guarantee that
    you will know

    when your actor starts and what changes it makes to the data layer, as there are
    cascading\effects that build up in between—you are in full control of your system.


    # The Need for Dispatcher [dispatch() and waitFor()]


    As an application grows, dependencies across different stores also increase. Imagine
    we

    a situation where store A needs store B to update first, so that it can itself
    know

    h to update. We need the dispatcher to invoke the callback for store B, and finish
    that

    callback, moving forward with store A. To assert this dependency, store A needs

    to communicate with the dispatcher to first complete the action updating store
    B. The

    dispatcher provides this functionality through the waitFor() method.


    www.it-ebooks.info'
