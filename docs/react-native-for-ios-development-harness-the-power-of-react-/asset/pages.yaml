  md: "# CHAPTER 1: Learning the Basics: A Whistle-Stop Tour of React\n\n```\n<body>\n\
    <div id=\"intro\"></div>\n<script type=\"text/jsx\">\nReact.render(\n  <h1>Hello,\
    \ world</h1>, document.getElementById('intro')\n);\n</script>\n</body>\n</html>\n\
    ```\n\nThat was simple. Your code is residing in HTML tags. Javascriptes in script\
    \ tags. You do see something different here in 'text/jsx'; which is JSX which\
    \ we will explain in detail in upcoming sections. We also see a keyword 'React'\
    \ which is the entry point into the React library. Inside of which there are H1\
    \ tags with the required text, along with the target where the text appears (in\
    \ this case, document.getElementById(intro)). Also, this React code can live in\
    \ a separate file and be referenced in the HTML. Let's create a separate file\
    \ named src/helloworld.js.\n\n```\nReact.render(\n<h1>Hello, world</h1>,\ndocument.getElementById(\"\
    intro\")\\);\n```\n\nAnd now's reference it in your hello_world.html file:\n\n\
