  md: '# MVC Pattern


    Historically, the MVC pattern separates code into three distinct parts: model,
    view, and controller. The main purpose of this pattern is to isolate the representation
    of information from user interaction. Let''s understand each of these parts individually:


    +   - Model: Manages the behavior and data of application

    - View: Representation layer of the model in the user interface

    - Controller: Takes user input and makes necessary manipulations to the model,
    causing the view to get updated


    # MVC Problem


    MVC is a very popular pattern to design applications, but it comes with its own
    set of problems. The more complex your source code becomes, the more complex things
    get. Figure 4-1 shows the simplest implementation of MVC, which works pretty well
    with small applications. But as our application grows, it demands new features,
    so there should be room to accommodate more models and views.


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_85_0.png)


    Figure 4-1. Basic MVC implementation'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'Figure 4-2 shows what happens when the models and views increase.


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_86_0.png)


    **Figure 4-2.** An explosion of arrows


    With so many models and views interacting with each other, when we track a model
    it triggers a view, and the view triggers another model, and this goes on spaghetti,
    which many times ends up in an infinite loop. The worst part is that it''s really
    difficult to debug code in such a situation, which eventually makes the system
    fragile. Well, Facebook faced similar setbacks and solved this problem with a
    new pattern called Flux!


    # # Flux


    Flux abures MVC in a unidirectional data flow. Flux works well, since the single-direction
    data flow makes it easy to understand and modify an application as it grows and
    becomes more complicated. Earlier, we found that two-way data bindings lead to
    cascading updates, where change in one data model leads to to another data model,
    making it very difficult to predict what would change as the result of a single
    user interaction. As shown in Figure 4-3, Flux applications have three major parts:
    the dispatcher, the stores, and the views (where we use React Native components).
    These should not be compared with the Model View Controller elements of the MVC
    pattern.'
  merge: -1
