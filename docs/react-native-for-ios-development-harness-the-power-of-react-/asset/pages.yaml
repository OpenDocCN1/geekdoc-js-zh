  md: '# CHAPTER 4: Flux: Solving Problems Differently


    The dispatch() method provides a simple, synchronous iteration through the callbacks,
    invoking each in turn. When waitFor() is encountered within one of the callbacks,
    execution of that callback stops and waitFor() provides us with a new iteration
    cycle over the dependencies. After the entire set of dependencies has been fulfilled,
    the original callback continues to execute.


    Further, the waitFor() method may be used in different ways for different actions,
    within the same store''s callback. In one case, store A might need to wait for
    store B. But in another case, it might need to wait for store C. Using waitFor()
    within the code block that is specific to an action allows us to have fine-grained
    control of these dependencies.


    Problems arise, if we have circular dependencies. If store A needs to wait for
    store B, and store B needs to wait for store A, we could wind up in an endless
    loop. The dispatcher may not available in the Flux repo protects against this
    by throwing an informative error to alert the developer that the problem has occurred.
    The developer can then create a third store and resolve the circular dependency.


    # Stores


    Stores contain the application state and logic. Their role is somewhat similar
    to that of a model in a traditional MVC, but they do not represent a single record
    of data like ORM models. More than simply managing a collection of ORM-style stores,
    stores manage the application state for a particular domain within the application.


    As mentioned earlier, a store registers itself with the dispatcher and provides
    it with a callback. Within the store''s registered callback, a switch statement
    based on the action''s type is used to interpret the action and to provide the
    proper hooks into the store''s internal methods. This allows an action to result
    in an update to the state of the store, via the dispatcher. After the stores are
    updated, they can broadcast an event declaring that their state has changed, which
    the views may query the new state and update themselves.


    # Actions


    When new data enters the system, whether through a person interacting with the
    application or through a web API, that data is packed into an action—an object
    containing the new fields of data and a specific action type. We create a library
    of helper methods called action creators that do not create the action object,
    but also pass the action to the dispatcher.


    Different actions are identified by a type attribute. They typically use this
    attribute to determine if and how they should respond to it. In a Flux application,
    both stores and views control themselves; external objects do not act upon them.
    Actions flow into the stores through the callbacks they define and register, not
    through setter methods.'
