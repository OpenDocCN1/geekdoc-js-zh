  md: "# CHAPTER 1: Learning the Basics: A Whistle-Stop Tour of React\n\nAnother useful\
    \ instrument to boost your productivity with React Native Developer Tools, which\
    \ is a very useful Chrome extension that allows you to inspect React component\
    \ hierarchy in the Chrome browser:\n\nhttps://chrome.google.com/webstore/detail/react-developer-tools/fmkadmapofagpljbfkapdoijkenihi\n\
    \nFor convenience, you will be using the following setup for your examples in\
    \ this chapter: Facebook cdn for both React Native and JSX transformer.\n\nreact.js:\
    \ http://fb.me/react-0.13.3.js\n\nJSX transformer: http://fb.me/JSXTransformer-0.13.3.js\n\
    \nSimply refer to them in your code. Next, you will install the node packages\
    \ browserify, watchify, and babel, which will help you maintain and keep your\
    \ JSX in appropriate js files:\n\n```\n$ npm install react browserify watchify\
    \ babel --save-dev\n$ watchify -t babelify ./your-jsx-file.jsx -o ./final-js-file.js\n\
    ```\n\nThat's great! To create the application, you will be using the simple python\
    \ server (SimpleHTTPServer) in the root of the project folder via the following\
    \ command:\n\n```\n$ python -m SimpleHTTPServer\n```\n\nSimple python server will\
    \ serve your examples by default on the 8000 port.\n\nNow that you are done with\
    \ your setup, you can quickly start to understand the concepts of React.\n\n#\
    \ Introduction to Components\n\nReact is all about components. Anything and everything\
    \ you do in React is based on reusable components. In other words, with React\
    \ you only do one thing, and that is build components. In previous sections, we\
    \ discussed separation of concerns. The whole concept of these components is that\
    \ they are completely encapsulated, making them easy to test and reuse.\n\nCreating\
    \ reusable components is an art and React Native provides many features for you.\
    \ You will do a deep dive into it soon, but first let's create a simple “Hello\
    \ World” component.\n\nCreate a hello_world.html file and paste the following\
    \ code into it:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <script src=\"http://fb.me/react-0.13.3.js\"\
    ></script>\n  <script src=\"http://fb.me/JSXTransformer-0.13.3.js\"></script>\n\
    </head>\n```"
