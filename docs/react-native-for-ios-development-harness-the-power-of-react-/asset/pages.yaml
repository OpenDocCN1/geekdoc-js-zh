  md: '# Introduction


    As the title suggests, this is an introduction to React Native. React has become
    a leading technology for building fast, responsive native iOS apps.


    You will begin by understanding the path breaking concepts of React, which makes
    it distinctive. React is a JavaScript library for creating user interfaces and
    yet is much more. You will set up React Native and begin exploring the anatomy
    of React Native apps. You will learn about the React "way of thinking" and "write
    once and everywhere" and how that works. You will learn how React offers an incredible
    and simple solution in Virtual DOM to speed up large app and you''ll learn about
    flux architecture, how it differs from MVC, and how you will learn to create stunning
    user interfaces and interact with the various capabilities of your project to
    solve problems differently and efficiently. You will then boost your development
    capabilities by including some popular packages already developed by the React
    Native community that helps you write less but do more. Finally, you''ll learn
    how to write test cases and submit your application to App Store. Using real-world
    examples with an example-driven approach, you will learn by doing and having a
    running app at the end of each chapter.


    In all, we hope that you will find this a useful and quick read that you will
    get started creating responsive and efficient apps.


    # Programming Code


    The programming code for the examples in this book are located in a zip file that
    may be updated from time to time. This file may be found in the Source Code/Errata
    tab on the book''s page at Apress.com/9781484213964.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Chapter 1


    # Learning the Basics: A Whistle-Stop Tour of React


    > "The journey of a thousand miles begins with one step."

    —Lao Tzu


    Before you embark on your React Native journey, you must know a little bit about
    React(also known asJS or React.js). In this chapter, you will quickly look at
    the core concepts of React, which will help you to work on React Native. React
    is different from most popular web technologies, and you will learn why as you
    move forward in this chapter. Its core concepts will really open up your mind
    to a new way of thinking if you have spent a considerable amount of time with
    traditional frameworks; this new way of thinking is sometimes called the React
    of thinking. You may have heard the phrase “learn once, run anywhere.". Wow, but
    dismissed it as nearly impossible due to the proliferation of factors (web, mobile,
    tablets). React seems quite different, and liberating. You''ll begin this first
    chapter with a quick tour of React, which will help you get ready for React Native.
    If you have an elementary knowledge of React, you may skip this chapter and move
    on to Chapter 2.


    React is a JavaScript library for creating user interfaces. It was built in a
    combined effort by Facebook and Instagram teams. React was first introduced to
    the world in 2013, and has been taken by storm, with community-wide acceptance
    and the benefit of being the technology at the heart of Facebook. According to
    official documentation, some consider React as the V in MVC because React Native
    makes no assumptions about rest of the technology stack used. You may use whatever
    technology you wish and can create a single section of your app with React Native;
    you may also conveniently make changes in an already created application.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'CHAPTER 1: Learning the Basics: A Whistle-Stop Tour of React


    # # Why React?


    But do we need another JavaScript library in a world full of js libraries and
    frameworks? There is hardly a month that goes by without a new js framework introduced.


    React came into existence because its creators were faced with a significant problem:
    how to build large applications where data changes frequently. This problem occurs
    in almost any real-world application and React was created from the ground up
    to solve it. As you know, many popular frameworks like MVC or MV'' are here points
    to be used and re-iterated: React is not MV''. It''s just a library for building
    composable user interfaces for UI components whose change over time. React builds
    user interfaces by breaking the UI into many components. That''s-nothing else.
    This means React uses the full features of programming languages to build and
    render views.


    The following are some of the advantages of choosing React for your project:


    +   - React uses JavaScript extensively: Traditionally the views in HTML are separated
    from the functionality in JavaScript. With React, components are created and there
    is one monolithic section where JavaScript has intimate knowledge of your HTML.


    +   - Extendable and maintainable: Components are formed by a unified markup with
    its view logic, which actually makes the UI easy to extend and maintain.


    +   - Virtual DOM: React applications are blazing fast. The credit for this goes
    to the virtual DOM and its diffing algorithm.


    +   - One-way data flow: Two-way data binding is a great idea, but in real-world
    applications it produces more pain than benefits. One of the common drawbacks
    with two-way data binding is that you have no idea how your data gets updated.
    With one-way data flow, things are simple: you know exactly where data is mutating,
    which makes it easier to maintain and test your app.


    In order to have a strong foundation of a new technology, it''s necessary to understand
    its core concepts. In the next section, you will explore a few unique concepts
    of React, which will take you one step closer to understanding this technology.


    # # Virtual DOM


    In all applications one of the most expensive operations from an app suffers is
    mutating the DOM. To solve this problem, React maintains a virtual representation
    of the DOM (as shown in Figure 1-1), which is called Virtual DOM or VDOM. Along
    with a diffing algorithm, React is able to compete against the actual DOM and
    only update the part of the DOM that is changed. The amount of change is therefore
    less, which leads to a blazing fashion. You might not see it, but as your project
    balloons to insane complexity (which usually happens in real-world apps) you will
    begin to see the benefits of a snappy experience for users.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# CHAPTER 1: Learning the Basics: A Whistle-Stop Tour of React


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_14_0.png)


    Figure 1-1. Virtual DOM and diffing algorithm operations


    Manual DOM manipulation is messy, and keeping track of the previous state of the
    DOM is very hard. As shown in Figure 1-1, React solves this problem by keeping
    two copies of a virtual DOM. Next, a diffing algorithm is applied on these two
    virtual DOMs, which essentially checks for the changes that occurred and returns
    a stream of DOM operations. These DOM operations are then applied to the actual
    browser DOM.


    Let''s now understand in terms of components how a virtual DOM works. In React,
    every component has a state; this state is observable. Whenever there is a change
    in state, React essentially knows that this requires a re-render. So when the
    application state changes, it generates a new VTree; once again the diff algorithm
    shared the DOM paths for required changes, as shown in Figure 1-2. This results
    in keeping manual DOM manipulation to the minimum.


    www.it-ebooks.info'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# CHAPTER 1: Learning the Basics: A Whistle-Stop Tour of React


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_15_0.png)


    Figure 1-2. Components with virtual DOM


    This feature of virtual DOM is not just important but a killer feature of React.
    DOM access is super slow, and humbly speaking, the world has made worse by hitting
    the DOM again and again in most of the applications. To make your application
    fast, you should touch the DOM as little as possible, and which is beautifully
    handled by the implementation of virtual DOM. You won''t notice this with a small
    and trivial application, but once your app grows to having thousands of DOM elements
    all trying to get updated, React will not let your performance feel the impact.


    # One-Way Data Flow


    React is the primary V in a MVC pattern before you dive into the idea of one-way
    data flow in React, you must understand the challenges of MVC frameworks. One
    of the biggest challenges of a MVC framework is managing the view. As you know,
    the view component of the MVC framework is mainly the DOM representation. It is
    simple when you write code that interacts with the DOM, but it is very complicated
    for React to handle various DOM manipulations.


    Traditional MVC views generally encompass a lot of heavy UI, and as the data changes
    even for a tiny element, it eventually re-renders the app again, and the cycle
    continues. The reason for this is that typically follow most of these MVC frameworks
    follow two-way data binding (see Figure 1-3).'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# CHAPTER 1: Learning the Basics: A Whistle-Stop Tour of React


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_16_0.png)


    Figure 1-3. Two-way data binding


    In JavaScript, data changes in memory and it is bound to a view in the UI, which
    means that when data is modified in JavaScript, which is in memory, the data will
    be changed in the UI as well. In return, when data changes in the UI (that is,
    the DOM) by clicking a button or any other event, it gets updated in memory also,
    keeping the two in sync. In theory, this works flawlessly and the idea is romant
    perfect. However, in real-world applications, problems arise when you have a fairly
    complex and large application with multiple views representing data in one of
    your models. As you add more models and views this two-way data binding ends up
    as spaghetti with every change in data added to the pot, which sometimes ends
    up in an infinite event loop where one view updates a model, which in turn updates
    a view, and so on, as shown in Figure 1-4.


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_16_1.png)


    Figure 1-4. Unwanted spaghetti relationship'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Another issue with this system is making changes comes at a very high cost.
    When you introduce a new developer to an application that is this complex, it''s
    tough to understand the impact one change might cause in this abyss of spaghetti
    relationships.


    React follows one-way data flow to keep things simple, as shown in Figure 1-5.
    It is based on the concept of separation of concerns (SoC). This is a design principle
    in computer science where each application or program is divided into distinct
    sections, each addressing a single or specific concern. The value of this design
    principle is that it simplifies development to create a maintainable and scalable
    application. This leads to modularized code where an individual section can be
    reused, developed, and modified independently. This makes so much sense and is
    indeed an element of intelligent thinking.


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_17_0.png)


    Figure 1-5. React Native''s one-way data flow


    # Installation and Setup


    In order to understand practical examples, you must first set up your environment
    to run your React examples. The easiest way to start working with React is using
    JSFiddle.


    +   - React JSiddle with JX (you will learn about JX shortly): https://jsfiddle.net/react-js/69zz2wepo/

    - React JSiddle: https://jsfiddle.net/react-js/5vjqab3/


    Another way is to download the complete kit to even work offline: http://facebook.github.io/react/downloads/react-0.13.3.zip


    You may also install react-tools using npm: npm install -g react-tools.'
  merge: -1
