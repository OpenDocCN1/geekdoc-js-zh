  md: '# Installing Node and npm


    Node.js is an open source platform built on Chrome''s JavaScript runtime; it offers
    a way to easily build fast, scalable programs. Node.js allows you to run JavaScript
    in Terminal, and helps create modules. Install Nodejs by running the following
    command in Terminal: $brew install node.


    Homebrew is the recommended way to install Node. You can also download the installer
    from https://nodejs.org and install it manually.


    npm is the package manager for Node.js. If you''re from the iOS world, it''s similar
    to CocoaPods.


    Check your Node installation by running the following command in Terminal:


    ```

    > node -v

    v4.2.1

    ```


    ```

    > npm -v

    2.13.1

    ```


    # Installing Watchman


    Watchman observes your files and records when they change. It can also trigger
    actions (such as rebuilding assets) when matching files change. For more details,
    visit https://facebook.github.io/watchman/


    You can install Watchman by running the following command:


    $brew install watchman


    # Installing the React Native Package


    React Native comes as an npm package, so use the following code to install the
    React Native-cli module:


    ```

    npm install -g react-native-cli

    ```


    # Updating React Native


    Both React Native and iOS are fast-moving frameworks. It is recommended to update
    every time a new release is available. Upgrading React Native is simple. Run the
    following command in Terminal:


    ```

    npm update -g react-native-cli

    ```'
