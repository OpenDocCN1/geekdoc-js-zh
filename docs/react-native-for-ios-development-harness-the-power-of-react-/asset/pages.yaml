  md: '# CHAPTER 4: Flux: Solving Problems Differently


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_87_0.png)


    **Figure 4-3.** Three major components of Flux


    Image source: https://github.com/facebook/blob/master/docs/img/flux-diagram-white-background.png


    Though controllers exist in a Flux application, they are controller views, where
    views are found at the top of the hierarchy that retrieves data from the stores
    and forwards it to their children. Looking at Figure 4-4, the most important part
    of the Flux architecture is the dispatcher, which is a singleton that directs
    the flow of data and ensures that updates do not cascade.


    # FLUX


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_87_1.png)


    **Figure 4-4.** Dispatcher directs the flow of data


    As an application grows, the dispatcher becomes more vital, as it is responsible
    for managing dependencies between stores by invoking the registered callbacks
    in a specific order.


    When a user interacts with a React Native view, the view sees an action (usually
    represented as a JavaScript object with some fields) through the dispatcher, which
    notifies the various stores that hold the application''s data and business logic.
    When the stores change state, they notify the views that something has been updated.'
