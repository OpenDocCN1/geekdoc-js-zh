  md: "# Fetch\n\nFetch is a popular networking API. It was created by a standard\
    \ committee and has well-defined requests, responses, and the process to bind\
    \ them. The following is an example of a post request with fetch:\n\n```\nfetch('https://example.com/endpoint/',\
