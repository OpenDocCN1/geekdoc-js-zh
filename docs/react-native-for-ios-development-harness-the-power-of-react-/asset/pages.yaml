  md: "The layout system is a fundamental concept that needs to be mastered in order\
    \ to create great applications. Let's begin by understanding how to navigate within\
    \ an iOS application using React Native.\n\n# NavigatorIOS\n\nNavigatorIOS is\
    \ a React Native component for creating navigation. It wraps UIKit navigation\
    \ and allows you to add a back-swipe feature to your app. NavigatorIOS manages\
    \ a stack of view controllers as to provide a drill-down interface for hierarchical\
    \ content. Now that we know what NavigatorIOS does, let's implement it in our\
    \ project.\n\nFirst, add NavigatorIOS in the list of components in the index.ios\
