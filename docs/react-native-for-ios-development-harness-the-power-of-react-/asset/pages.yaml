  md: "# TouchableHighlight\n\nTouch is a fundamental way to interact with an iOS\
    \ application. TouchableHighlight is a React Native component that helps us create\
    \ buttons that give a proper response in the event of touch. These are not actually\
    \ buttons, but the React Native team decided that it easier to construct buttons\
    \ directly in JavaScript instead of UIButton. The buttons in your app use TouchableHighlight,\
    \ which is not a button but works like a button. Let us understand this with an\
    \ example.\n\nLet's add the TouchableHighlight component to our code:\n\n```\n\
    var {\nAppRegistry,\nStyleSheet,\nText,\nView,\nNavigatorIOS,\nTouchableHighlight\n\
    } = React;\n```\n\nUpdate the view and add two TouchableHighlight buttons:\n\n\
    ```\nvar Home = React.createClass({\n  render: function() {\n  return (\n    <View\
    \ style={styles.container}>\n      <View style={styles.topbox} />\n      <View\
    \ style={styles.bottombox} />\n\n      <View style={styles.topBox}>\n        <TouchableHighlight\
    \ style={styles.button}>\n          underColor='#99d9f4'\n          <Text style={styles.buttonText}>Show\
    \ Houses</Text>\n        </TouchableHighlight>\n        <TouchableHighlight style={styles.button}>\n\
    \          underColor='#99d9f4'\n          <Text style={styles.buttonText}>Add\
    \ House</Text>\n        </TouchableHighlight>\n      </View>\n    </View>\n  )\n\
    }\n});\n```\n\nAnd of course we need stylesheets for our buttons:\n\n```\nbutton:\
