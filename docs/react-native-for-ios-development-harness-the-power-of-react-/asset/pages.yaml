  md: '# CHAPTER 7: React Native Supplements


    ![](img/44d9b147332295d6833a2b7d5f0c7aa8_167_0.png)


    Figure 7-5. Two items have been marked as done


    # # Redux


    Redux is a predictable-state container for JavaScript apps, and it has become
    very popular, especially in the React community. Though you can use the Redux
    concept in React, AngularJS, or any framework. Redux is open source, Dan Abramov
    as its lead developer. Redux makes mutations predictable by imposing certain controls
    on how and when updates can be made.


    Now until, we have seen that state is used a lot in React Native apps, and the
    state value is always changing. Our actual app grows, handling these state changes
    can become unpredictable. Utilizing React with Flux is a good method by which
    to solve issues using mutation and synchronicity, as React has removed as from
    the view-layer and direct-DOM manipulation. However, managing the state of data
    is left up to the developer. Redux has solved the problem of managing state using
    three principles:


    +   - Single source of truth

    - State is read-only

    - Mutations are written as pure functions


    www.it-ebooks.info'
  merge: -1
