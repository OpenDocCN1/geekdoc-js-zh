    # Enabling Live Reload


    Another cool feature of React Native is live reload. It reloads your application
    view inside the iOS simulator moment there is a change. To activate this option,
    you need to access the developer menu from the application opened in the IOS simulator
    by pressing Ctrl + Command - Z and select the Enable Reload option. Now any change
    made in your JavaScript code will cause your app to reload automatically.


    # Why Is React Native Different?


    Before you dive further into the React Native world, you must understand why there
    was a need for another framework to build mobile apps. We already live in a world
    full of frameworks and tool chains that are capable of building mobile apps. Prior
    to the inception of React Native, building mobile apps using web technologies
    was possible via two strategies:


    +   - WebView-based:** These frameworks use common technologies like HTML and
    JavaScript, and use WebView to load the application. An example is the popular
    framework Phonegap.

    - **Native apps using web technologies:** These frameworks again use common technologies
    like HTML and JavaScript (to be precise, they imitate using JavaScript and HTML)
    to create native apps. An example is the popular framework Titanium Appcelerator.


    www.it-ebooks.info'
