    your React application and React Native code. It allows you to inspect the React
    Native component hierarchies in the Chrome Developer Tools. To install it, please
    visit the Chrome webstore or go to the URL: https://chrome.google.com/webstore/detail/react-developer-tools/fmkadmapgadofolip1jbfkadkoelniij?hl=en.


    Once the extension is installed, press Command + Option + j or select View ► Developer
    Tools from your Chrome browser to access the developer tools console.


