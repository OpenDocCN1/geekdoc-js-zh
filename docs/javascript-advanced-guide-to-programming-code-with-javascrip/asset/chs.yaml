  \ 6, 2, 7);\nvar result2 = sumValues(12, 20);\nalert(result1);\nalert(result2);\n\
  </script>\n</head>\n<body>\n<p>Nothing to show here.</p>\n</body>\n</html>\n```\n\
  \n# 第 4 章：作为参数传递的函数\n\nJavaScript 中的函数是一等阶对象，而不仅仅是仅能调用的不可变代码块。相反，每个声明的函数都会变成一个对象，拥有它自己的方法和属性，这些对象可以像任何其他对象一样被传递。\n\
  \n查看以下示例，了解函数如何作为另一个函数的参数使用：\n\n## 示例：\n\n```javascript\n//让我们创建一个包含 5 个值的数组\nvar\
  \ values = [5, 2, 11, -7, 1];\n\n//这个函数将相加 'a' 和 'b' 的值并返回和\nfunction add(a, b)\
  \ {\n  return a+b;\n}\n//这个函数将乘以 'a' 的值乘以 'b' 并返回结果\nfunction multiply(a, b) {\n\
  \  return a*b;\n}\n/* 第 1 个传递的参数是数字（在这种情况下，是 values 数组）\n* 第 2 个传递的参数是初始值（可以是 0,\
  \ 1 或任何值）\n* 第 3 个传递的参数是操作 - 它将是上面声明的函数之一（add 或 subtract）\n*/\nfunction combineAll(nums,\
  \ initialValue, operation) {\n  //让我们用传递的 initialValue 初始化局部变量 'runningResult'\n\
  \  var runningResult = initialValue;\n  // 遍历 nums 数组\n  for (var i=0; i < nums.length;\
  \ i++) {\n    /* 每次迭代，调用函数（可以是 add 或 multiply）并传递 2 个参数\n    * 在第一次迭代中，runningResult\
  \ 是 initialValue；之后，是 operation(runningResult, nums[i]) 返回的值\n    * nums[i] 指迭代中的当前数字；第一个是\
  \ 5，然后是 2，依此类推。\n    */\n    runningResult = operation(runningResult, nums[i]);\n\
  \  }\n  return runningResult;\n}\n//注意第 3 个参数传递了 \"add\" 函数 - 你可以将一个函数传递到另一个函数！\n\
  var sum = combineAll(values, 0, add);\n//注意第 3 个参数传递了 \"multiply\" 函数 - 你可以将一个函数传递到另一个函数！\n\
  var product = combineAll(values, 1, multiply);\nalert(\"Sum: \" + sum); // 应该是 12:\
  \ 5+2+11+(-7)+1\nalert(\"Product: \" + product); // 应该是 -770: 5x2x11x-7x1\n```\n\
  \n你可能在想这个函数的意思是什么 - `var sum = combineAll(values, 0, add);`。在上面的示例中，函数 `add` 被作为参数三传递给\
  \ `combineAll`。此时，我们并不会调用 `add`，只是传递了一个引用。你发现 `add` 后面没有使用括号了吗？这应该是一个小提示，说明我们没有调用任何函数。\n\
  \n调用 `add` 的代码行是：\n\n```javascript\nrunningResult = operation(runningResult, nums[i]);\n\
  ```\n\n这行代码接收了对 `operation` 参数 `add` 的引用，并且当调用 `operation` 时，你会看到 `add` 正在被调用，并返回传递给它的两个和的值。\n\
  \n这是一项至关的技术，我们经常调用 `combineAll` 函数来归约（reduce）。花些时间查看代码并运行它，直到你熟悉它为止。我们将在接下来的章节中使用它，所以你需要理解它。\n\
  \n## 匿名函数\n\n回看我们之前使用的示例，`add` 和 `multiply` 函数只被引用了一次，在调用 `combineAll` 的时候。如果你坚持那种模式，你将为你每个想要的新组合（例如拼接）创建一个新函数，以便你能将其传递给\
  \ `combineAll`。这看起来不是很麻烦吗？你会很高兴地发现，在 JavaScript 中你甚至不需要为它们命名。事实上，这种语法非常简单：\n\n```javascript\n\
  function (arg1, arg2) {\n  //这里是语句\n}\n```\n\n因为这些函数没有命名，我们可以在需要的地方创建匿名函数。让我们回到之前的示例，使用这些匿名函数来代替原本的函数：\n\
  \n# 第 5 章：嵌套函数\n\n由于 JavaScript 函数是另一种类型的 JavaScript 对象，我们能够创建一个位于另一个内部的函数。我们称这些嵌套函数，有时称为内部函数。查看以下示例，它展示了如何创建一个函数并在另一个函数中使用它：\n\
  \n## 示例：\n\n```javascript\nvar values = [5, 2, 11, -7, 1];\n\nfunction combineAll(nums,\
  \ initialValue, operator) {\n  var runningResult = initialValue;\n  for (var i=0;\
  \ i < nums.length; i++) {\n    runningResult = calculate(nums[i]);\n  }\n  return\
  \ runningResult;\n\n  function calculate(num) {\n    switch (operator.toLowerCase())\
  \ {\n      case \"+\" :\n        return runningResult + num;\n      case \"x\" :\n\
  \        return runningResult * num;\n      case \"*\" :\n        return runningResult\
  \ * num;\n      case \"a\" :\n        return runningResult + \", \" + num;\n   \
  \ }\n  }\n}\n\nvar sum = combineAll(values, 0, \"+\");\nvar product = combineAll(values,\
  \ 1, \"x\");\nvar list = combineAll(values, 1, \"a\");\n\nalert(\"Sum: \" + sum);\n\
  alert(\"Product: \" + product);\nalert(\"Number List: \" + list);\n```\n\n\n\n\n\
  JavaScript 变量使用 `var` 关键字进行声明，它们可以是局部作用域或全局作用域。要成为全局作用域，变量必须满足以下条件之一：\n\n- 变量在函数外部声明\n\
  - 变量在声明时没有使用 `var` 关键字的情况下被使用\n\n要成为局部作用域，变量必须在另一个函数中使用 `var` 关键字进行声明。\n\n全局变量可以在\
  \ JavaScript 代码的任何地方访问：\n\n示例：\n\n```javascript\nvar maxNum; //global\n\nfunction\
  \ prepare() {\n  var maxNum = 5; //local to function\n  // 让我们忘记在 \"for\" 声明中写 \"\
  var\"\n  for (i=0; i <= maxNum; ++i) { //没有 var，所以 i 将是全局的\n    //执行某些操作\n  }\n\
  }\n\nprepare();\n\nalert(maxNum); //undefined\nalert(i); //6 (因为它是全局作用域)\n```\n\n\
  注意 `maxNum` 是一个全局声明的变量，但还没有给它赋值。它在 `prepare()` 函数内部被声明并赋予了值 5。\n\n看看 `prepare()`\
  \ 调用后 `maxNum` 的值。它的值被留为了 `undefined`。这是是因为全局变量正在被读取，而我们无法从函数外部访问函数变量。\n\n然而，我们可以访问变量\
  \ `i`，仅仅是因为我们在函数内部在没有使用 `var` 声明的情况下给它赋了值。\n\n由于 JavaScript 中没有块级作用域，变量永远不会是 `for`\
  \ 循环或 `if` 语句的局部变量。\n\n# 第 7 章：观察和捕获事件\n\n你可能更习惯使用 HTML 事件处理器（例如“on”属性）作为捕获事件的方法——参见下例示例：\n\
  \n示例：\n\n```html\n<ul>\n  <li onclick=\"document.bgColor='red';\">Red</li>\n  <li\
  \ onclick=\"document.bgColor='orange';\">Orange</li>\n  <li onclick=\"document.bgColor='green';\"\
  >Green</li>\n  <li onclick=\"document.bgColor='blue';\">Blue</li>\n</ul>\n```\n\n\
  然而，将 HTML 和 JavaScript 分开要好得多。\n\n## `eval()` 函数\n\n我们为什么在这里讨论这个函数？仅仅是为了承认它的存在，并告诉你**不要**使用它。我会告诉你原因，但在那之前你需要知道它是做什么的。\n\
  \n`eval` 用于编译字符串并执行它，该字符串将包含 JavaScript 代码，它可以是非常简单的内容，例如像“2 + 3”这样的表达式，也可以是一个更长、更复杂的脚本，其中包含各种函数和其他内容。\n\
  \n看下面的示例：这类似于你可以在互联网实时网站上看到的内容：\n\n示例：\n\n```javascript\nfunction getProperty(objectName,\
  \ propertyName) {\n  //表达式将是：document.title\n  var expression = objectName + \"\
  .\" + propertyName;\n  console.log(expression);\n  // eval() 函数会评估表达式，所以 document.title\
  \ 为我们提供了文档的标题\n  var propertyValue = eval(expression);\n  return propertyValue;\n\
  }\n\nvar prop = \"title\"; //假设这是由用户提供的\nalert(getProperty(\"document\", prop));\n\
  ```\n\n该函数通过获取一个对象名称并将其与点以及属性名称连接来生成表达式。然后它使用 `eval()` 评估该表达式。虽然这是一个非常强大的函数，但它也具有巨大的危险性，而且效率并不高。为什么它是危险的呢？因为它通常被用作评估用户输入的方法，而这并不总是最安全的做法。效率低的问题源于每次调用\
  \ `eval()` 都会启动一个 JavaScript 编译器。\n\n正常使用该函数通常表明开发者缺乏相关知识。在上面的示例中，我们本可以采用使用 `[]`\
  \ 属性访问器的路径。我们可以通过通过 alert(window[prop]);` 得到相同的结果，而不需要仅仅为了获取属性值就启动编译器。\n\n记住：尽可能避免使用\
  \ `eval`，因为它只会给你的代码带来问题。\n\n# 第 8 章：错误处理\n\n无论你把代码写得有多仔细，错误总是会出现的。大多数情况下，它们是由于你无法预测的事情而引起的运行时错误。其他时候，它们是\
  \ bug 或你的代码行为不符合预期。幸运的是，JavaScript 为你提供了处理这两类错误所需的工具，这正是我们在本章中要讨论的内容。\n\n## 运行时错误\n\
  \n网页浏览器可能是极其敌对的地方，几乎可以肯定你将永远在处理运行时错误。用户以你完全没想过可能的方式输入错误的内容。浏览器的新版本可能会改变工作方式，Ajax\
  \ 调用可能会因为许多不同的原因而失败。\n\n很多时候，你无能为运行时错误做什么，但有方法可以处理它们，让用户的体验不那么痛苦。\n\n### 未处理的错误\n\
  \n看看这个示例，它看起来很平凡：\n\n示例：\n\n```javascript\nfunction getInput() {\n  var name = prompt('输入你的名字');\n\
  \  alert('你的名字有 ' + name.length + ' 个字母。');\n}\n\ngetInput();\n```\n\n仔细看代码；起初可能并不明显，但这是一个即将发生的\
  \ bug。如果用户点击或按下 ESC 或取消，`prompt()` 函数将返回 `null`，这将导致下一行出现空引用错误并使其执行失败。\n\n如果开发者对此不做任何处理，终端用户将收到一条对他们完全没有任何意义的浏览器消息。取决于用户如何配置设置或浏览器，他们可能得不到屏幕消息；它可能会显示为状态栏中的一个小图标，这个图标很容易被忽略，导致用户认为程序只是没有响应。\n\
  \n### 全局处理的错误\n\nwindow 对象中有一个名为 `onerror` 的事件，每当页面上出现未处理的错误时，它就可能被调用。例如：\n\n```javascript\n\
  window.onerror = function (message, url, lineNo) {\n  alert(\n    '错误: ' + message\
  \ +\n    '\\n URL: ' + url +\n    '\\n 行号: ' + lineNo);\n  return true;\n}\n\nfunction\
  \ getInput() {\n  var name = prompt('输入你的名字');\n  alert('你的名字有 ' + name.length +\
  \ ' 个字母。');\n}\n\ngetInput();\n```\n\n如你从这个示例所示，事件向函数传递了三个参数。第一个是错误信息，第二个是包含错误的文件的\
  \ URL（如果是外部 .js 文件则非常有用），第三个是错误所在的行号。\n\n`return true` 告诉浏览器开发者已经处理了这个问题；如果返回 `false`，浏览器将此视为未处理的错误，屏幕或状态栏消息将显示在用户上。\n\
  \n## 结构化错误处理\n\n对于任何事情，处理错误的最好的方法是在尽可能靠近发生的地方检测它。这将让你更容易知道如何处理它。JavaScript 使用 `try...catch...finally`\
  \ 块来实现结构化错误处理：\n\n```javascript\ntry {\n  // try 语句\n} catch (error) {\n  // catch\
  \ 语句\n} finally {\n  // finally 语句\n}\n```\n\n这是一个非常简单的原理；如果错误发生在 `try` 块中的语句中，则执行\
  \ `catch` 块中的语句，并将错误直接传递给 `error` 变量。`finally` 块是可选的，如果使用，无论是否有错误，它都会最后执行。\n\n我们可以做什么来让代码捕获错误？\n\
  \n示例：\n\n```javascript\nwindow.onerror = function (message, url, lineNo) {\n  alert(\n\
  \    '错误: ' + message +\n    '\\n URL: ' + url +\n    '\\n 行号: ' + lineNo);\n  return\
  \ true;\n}\n\nfunction getInput() {\n  try {\n    var name = window.prompt('输入你的名字');\n\
  \    alert('你的名字有 ' + name.length + ' 个字母。');\n  } catch (error) {\n    alert('错误类型为:\
  \ ' + error.name +\n    '\\n 错误消息为: ' + error.message);\n  } finally {\n    //执行清理工作\n\
  \  }\n}\n\ngetInput();\n```\n\n\n\n\n错误对象中有两个重要的属性：`message` 和 `name`。`message`\
  \ 包含我们已经知道的错误信息，而 `name` 包含关于错误类型的信息。我们使用这些信息来决定如何处理该错误。\n\n对任何程序员来说，一个很好的建议是：只有当你\
  \ 100% 确定知道错误是什么以及确切知道如何修复它时，才在现场处理错误，而不是将其抑制。为了更好地针对性地处理代码，可以将其更改为仅处理名为 `TypeError`\
  \ 的错误——这是为该 识别出的错误名称：\n\n示例：\n\n```javascript\nwindow.onerror = function (message,\
  \ url, lineNo) {\n  alert(\n    'Error: ' + message +\n    '\\n Url: ' + url +\n\
  \    '\\n Line Number: ' + lineNo);\n  return true;\n}\n\nfunction getInput() {\n\
  \  try {\n    var name = window.prompt('Type your name');\n    alert('Your name\
  \ has ' + name.length + ' letters.');\n  } catch (error) {\n    if (error.name ==\
  \ 'TypeError') {\n      alert('Please try again.');\n      getInput();\n    } else\
  \ {\n      throw error;\n    }\n  } finally {\n    //do cleanup\n  }\n}\n\ngetInput();\n\
  ```\n\n如果发生了不同的错误（在这个简单的示例中不太可能发生），它将不会被处理。`throw` 语句将发送错误，就好像我们没有使用 `try...catch...finally`\
  \ 块一样。错误将稍后出现。\n\n### 抛出自定义错误\n\n`throw` 语句可以用于抛出自定义错误，这里只有一个建议——错误对象必须具有 `name`\
  \ 和 `message` 属性，且要与内置处理方法一致。看这个示例：\n\n```javascript\nthrow {\n  name: 'InvalidColorError',\n\
  \  message: 'The given color is not a valid color value.'\n};\n```\n\n# 第 9 章：‘delete’运算符\n\
  \n我们使用 `delete` 运算符作为删除对象属性和数组元素的方法。请明确这一点——删除与将值设置为 `null` 不同。删除会移除元素或属性，使其变为 `undefined`，而将值设置为\
  \ `null` 则会保留元素或对象，同时将其值设为 `null`。看这个示例作为说明：\n\n示例：\n\n```html\n<!DOCTYPE HTML>\n\
  <html\n<head>\n<meta charset=\"UTF-8\">\n<script type=\"text/javascript\">\nvar\
  \ colors = [];\ncolors[\"red\"] = \"#f00\";\ncolors[\"green\"] = \"#060\";\ncolors[\"\
  blue\"] = \"#00f\";\ncolors[\"yellow\"] = \"#ff0\";\ncolors[\"orange\"] = \"#0ff\"\
  ;\n\nfunction deleteItem() {\n  delete colors[\"blue\"];\n  showArray();\n  revealArray();\n\
  }\n\nfunction setToNull() {\n  colors[\"blue\"] = null;\n  showArray();\n  revealArray();\n\
  }\n\nfunction showArray() {\n  var output = document.getElementById(\"colors\");\n\
  \  var strOutput = \"<ol>\";\n  for (var i in colors) {\n    strOutput += \"<li\
  \ style='color:\" + colors[i] + \";'>\" + i + \"</li>\";\n  }\n  strOutput += \"\
  </ol>\";\n  output.innerHTML=strOutput;\n}\n\nfunction revealArray() {\n  var colorsCode\
  \ = document.getElementById(\"colors-code\");\n  var strOutput = \"&lt;ol&gt;\"\
  ;\n  for (var i in colors) {\n    strOutput+=\"\\n\\t&lt;li style='color:\" + colors[i]\
  \ + \";'&gt;\" + i + \"&lt;/li&gt;\";\n  }\n  strOutput += \"\\n&lt;/ol&gt;\";\n\
  \  colorsCode.innerHTML=strOutput;\n}\n</script>\n<title>Delete vs. Setting to NULL</title>\n\
  </head>\n<body onload=\"showArray();revealArray();\">\n<button id=\"set-to-null\"\
  \ onclick=\"setToNull();\">Set Blue to Null</button>\n<button id=\"del\" onclick=\"\
  deleteItem();\">Delete Blue</button>\n<output id=\"colors\"></output>\n<pre id=\"\
  colors-code\"></pre>\n</body>\n</html>\n```\n\n现在先忘记 `showArray()` 和 `revealArray()`\
  \ 函数。但请注意，当点击“Set Blue to Null”的按钮时，数组元素将留在原地，但它将是一个无效的颜色 `null`。当点击“Delete Blue”按钮时，数组元素将被删除。\n\
  \n## 正则表达式\n\n这是对接下来几章的简单介绍，在这些章节中我们将介绍正则表达式。它们用于模式匹配，这在表单验证时非常有帮助。例如，你可以使用正则表达式来检查输入到表单字段的电子邮件地址在语法上是否正确。在\
  \ JavaScript 中，你有两种方式创建正则表达式：\n\n字面量语法：\n`var reExample = /pattern/;`\n\n`RegExp()`\
  \ 构造函数：\n`var reExample = new RegExp(\"pattern\");`\n\n如果你已经知道要使用的模式，这两者没有没有区别。但如果你不知道将使用哪种模式，最简单的方法是使用\
  \ `RegExp()` 构造函数。\n\n# 第 10 章：正则表达式 – 方法\n\nJavaScript 正则表达式包含两个主要的字符串测试方法：`test()`\
  \ 和 `exec()`。\n\n## `exec()` 方法\n\n该方法接收一个参数（字符串）并进行测试。如果找到了匹配项，将返回一个数组。如果没有匹配，则返回\
  \ `null`。\n\n## `test()` 方法\n\n该方法接收一个参数（字符串）并检查字符串中的匹配项。如果匹配，则返回 `true`；如果不匹配，则返回\
  \ `false`。这在表单验证中非常有用。\n\n示例：`RegularExpressions/SsnChecker.html`\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>ssn Checker</title>\n\
  <script type=\"text/javascript\">\nvar reSSN = /^[0-9]{3}-[0-9]{4}$/;\n\nfunction\
  \ checkSsn(ssn){\n  if (reSSN.test(ssn)) {\n    alert(\"VALID SSN\");\n  } else\
  \ {\n    alert(\"INVALID SSN\");\n  }\n}\n</script>\n</head>\n<body>\n<form onsubmit=\"\
  return false;\">\n<input type=\"text\" name=\"ssn\" size=\"20\">\n<input type=\"\
  button\" value=\"Check\" onclick=\"checkSsn(this.form.ssn.value);\">\n</form>\n\
  </body>\n</html>\n```\n\n看一下代码。首先，我们定义了一个包含正则表达式的变量。其次，我们创建了一个函数 `checkSsn()`。该函数接收参数\
  \ `ssn` 并将其传递给正则表达式以检查是否存在匹配。这里使用了 `test()` 方法。如果匹配，函数将弹出“VALID SSN”。如果没有匹配，则弹出“INVALID\
  \ SSN”。最后，页面上的表单提供了一个输入社会安全号码的字段，以及一个将该号码传递给函数的按钮。\n\n## 标志\n\n如果标志出现在斜杠后面，它将修改正则表达式的作用。`i`\
  \ 标志将使正则表达式不区分大小写。例如，`/aeiou/i` 会匹配大写和小写的元音。\n\n`g` 标志指定全局匹配，这意味着将返回所有模式匹配项。\n\n\
  ## 字符串方法\n\n许多字符串方法接受正则表达式作为参数：\n\n`search()` 方法\n该方法仅接受一个参数——正则表达式。返回匹配正则表达式的子字符串起始索引。如果没有匹配，则返回\
  \ `-1`。\n\n`split()` 方法\n该方法也接受正则表达式并将其作为分隔符将一个字符串拆分为数组。\n\n`replace()` 方法\n该方法接收两个参数——正则表达式和字符串。第一个正则表达式匹配项将被替换为字符串，如果表达式使用了\
  \ `g` 标志，所有字符串匹配项都将被替换。\n\n`match()` 方法\n`match()` 方法接收正则表达式作为参数并返回每个与正则表达式模式匹配的子字符串。\n\
  \n# 第 11 章：正则表达式 – 语法\n\n正则表达式是用于指定字符列表的模式。在本章中，我们将查看用于指定字符的语法：\n\n起始和结束 ( `^$`\
  \ )\n\n\n\n\n* 如果正则表达式的开头有一个脱字符（`^`），它表示正在搜索的字符串必须以此模式开头。\n* 你在 `“food”` 中可以找到模式\
  \ `^`，但在 `“barfood”` 中找不到。\n* 如果正则表达式的末尾有一个美元符号（`$ `），它表示正在搜索的字符串必须以此模式结尾。\n* 你在\
  \ `“curfoo”` 中可以找到模式 `foo$`，但在 `“food”` 中找不到。\n\n## 出现次数 (`?` `*` `{}`)\n\n这些符号会影响前一个字符（或如果你使用括号，一组字符）出现的次数：`?`、`*`、`+`、`}`}`\n\
  \n* 问号 (`?`）表示前面的字符在模式中出现 0 次或 1 次。\n* 你在 `“fod”` 和 `“food”` 中可以找到模式 `foo?`，但在 `“faod”`\
  \ 中没有。\n* 加号 (`+`）表示前面的字符在模式中至少出现一次。\n* 你在 `“food”`、`“fod”` 和 `“foood”` 中可以找到模式\
  \ `fo+`，但在 `“fd”` 中找不到。\n* 星号 (`*`）表示前面的字符在模式中至少出现 0 次。\n* 你在 `“fd”`、`“food”` 和\
  \ `“fod”` 中可以找到模式 `fo*d`。\n* 大括号 (`{}`）带有一个单个参数 `{n}` 时，表示前面的字符在模式中恰好出现 `n` 次。\n\
  * 你在 `“foood”` 中可以找到模式 `fo{3}d`，但在 `“fooood”` 或 `“food”` 中找不到。\n* 带有两个参数的大括号 `{n1,\
  \ n2}` 表示前面的字符在模式中出现的次数在 `n1` 到 `n2` 之间。\n* 你在 `“fooood”`、`“foood”` 和 `“food”` 中可以找到模式\
  \ `fo{2,4}`，但在 `“foooood”` 中找不到。\n* 带有一个参数且第二个为空的大括号 `{n}` 表示前面的字符在模式中至少出现 `n` 次。\n\
  * 你在 `“foooood”` 和 `“food”` 中可以找到模式 `fo{2}`，但在 `“fod”` 中找不到。\n\n* 普通字符 (`.` `\\\
  d` `\\D` `\\w` `\\W` `\\s` `\\S`)\n\n* 点（`.`）代表换行符以外的任何字符。\n* 你在 `“foad”`、`“food”`、`“fo*f”`\
  \ 和 `“fo9d”` 中可以找到模式 `fo.d`。\n* 反斜杠 d (`\\d`）代表任何数字，等于 `[0-9]`。\n* 你在 `“fo1d”`、`“fo0d”`、`“fo4d”`\
  \ 中可以找到模式 `fo\\dd`，但在 `“fodd”` 或 `“food”` 中找不到。\n* 反斜杠 D (`\\D`）代表任何数字的字符，等于 `[⁰-9]`。\n\
  * 你在 `“foad”` 和 `“food”` 中可以找到模式 `fo\\D`，但在 `“fo4d”` 中找不到。\n* 反斜杠 w (`\\w`）代表任何单词字符，如数字、字母和下划线\
  \ (`_`）。\n* 你在 `“fo_d”`、`“food”` 和 `“fo4d”` 中可以找到模式 `fo\\w`，但在 `“fo*d”` 中找不到。\n\
  * 反斜杠 W (`\\W`）代表任何不是单词字符的字符。\n* 你可以在 `“fo&d”`、`“fo*d”` 和 `“fo.d”` 中找到模式 `fo\\Wd`，但在\
  \ `“fo d”` 中找不到。\n* 反斜杠 s (`\\s`）代表任何空白字符，如制表符、空格、换行符等。\n* 你在 `“fo d”` 中可以找到模式 `fo\\\
  sd`，但在 `“food)” 中找不到。\n* 反斜杠 S (`\\S`）代表除空白以外的任何字符。\n* 你可以在 `“food”`、`“fo*d”` 和\
  \ `“fo4d”` 中找到模式 `fo\\Sd`，但在 `“fo d”` 中找不到。\n\n## 分组 (`[]`)\n\n我们使用方括号 (`[]`）作为将选项分组的方法：\n\
  \n* 你在 `“fed”` 和 `“fad”` 中可以找到模式 `f[aeiou]`，但在 `“food\"`、`“faed\"` 或 `“fd”` 中找不到。\n\
  * 模式 `[aeiou]` 将匹配 `\"a\"`、`\"e\"`、`\"i\"`、`\"o\"` 或 `\"u\"`。\n* 你在 `\"faed\"` 和\
  \ `\"feod\"` 中可以找到模式 `f[aeiou]{2}d`，但在 `\"fod\"`、`\"fed\"` 或 `\"fd\"` 中找不到。\n* 你在\
  \ `\"Webucator, Inc.\"` 中可以找到模式 `[A-Za-z]+`，但在 `\"13078\"` 中找不到。\n* 模式 `[A-Za-z]`\
  \ 将匹配任何字母，无论其是大写还是小写。\n* 模式 `[A-Z]` 将匹配任何大写字母。\n* 模式 `[a-z]` 将匹配任何小写字母。\n\n## 否定\
  \ (`^`)\n\n当脱字符 (`^`) 用于方括号内部且作为第一个字符时，它表示否定。\n\n* 你在 `\"fqd\"` 和 `\"f4d\"` 中可以找到模式\
  \ `f[^aeiou]d`，但在其他地方找不到。\n\n## 子模式 (`()`)\n\n我们使用括号 (`()`) 来捕获子模式。\n\n* 你在 `\"\
  food\"` 和 `\"foob\"` 中可以找到模式 `f(oo)d`。\n\n## 备选项 (`|`)\n\n我们使用管道符号 (`|`) 作为创建备选项的方法。\n\
  \n* 你在 `\"foo\"` 和 `\"bar\"` 中可以找到模式 `foo|bar`。\n\n## 转义字符 (`\\`)\n\n我们使用反斜杠 (`\\\
  `) 作为转义特殊字符的方法。\n\n* 模式 `\\.` 匹配字面点。\n\n# 第 12 章：正则表达式 – 表单验证\n\n当你使用正则表达式时，你可以创建一些强大的验证函数。让我们来看这个例子：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Login</title>\n\
  <script>\nfunction validate(form){\n    var email = form.Email.value;\n    var password\
  \ = form.Password.value;\n    var errors = [];\n\n    var reEmail = /^(\\w+\\.)*\\\
  w+@(\\w+\\.)+[A-Za-z]+$/;\n    var rePassword = /^[A-Za-z\\d]{6,8}$/;\n\n    if\
  \ (!reEmail.test(email)){\n        errors.push(\"You must enter a valid email address.\"\
  );\n    }\n    if (!rePassword.test(password)){\n        errors.push(\"Password\
  \ must be between 6 and 8 characters and can only contain letters and digits.\"\
  );\n    }}\n\n    if (errors.length > 0){\n        var msg = \"There were some problems:\\\
  n\";\n        for (var i = 0; i<errors.length; i++){\n            msg += \"\\n\"\
  \ + (i + 1) + \". \" + errors[i];\n        }\n        alert(msg);\n        return\
  \ false;\n    }\n    return true;\n}\n</script>\n</head>\n<body>\n\n<h1>Login</h1>\n\
  <form method=\"post\" action=\"Process.html\" onsubmit=\"return validate(this);\"\
  >\nEmail: <input type=\"text\" name=\"Email\" size=\"25\"><br/>\nPassword: <input\
  \ type=\"password\" name=\"Password\" size=\"10\"><br/>\n<input type=\"submit\"\
  \ value=\"Submit\">\n<input type=\"reset\" value=\"Reset Form\">\n</form>\n</body>\n\
  </html>\n```\n\n\n\n\n-   在你的编辑器中打开 `RegularExpressions/Exercises/FormValidation.js`。\n\
  \n现在编写正确的正则表达式（额外的），用于检查以下内容：\n\n1. 专有名称 (Proper name)\n   - 以大写字母开头\n   - 后面至少跟一个字母或撇点号（apostrophe）\n\
  \   - 它可以是多个单词，例如“New Mexico”\n2. 缩字母 (Initial)\n   - 包含 0 个或 1 个大写字母\n3. 州名 (State)\n\
  \   - 包含两个大写字母\n4. 美国邮编 (US Postal Code)\n   - 由五位数字组成\n   - 后面可以跟一个连字符和另外四位数字\n\
  5. 用户名 (Username)\n   - 不于 6 位且不超过 15 位数字或字母\n\n## 第二练习\n\n-   在你的编辑器中打开 `RegularExpressions/Exercises/Register.html`。\n\
  \n添加正确的验证逻辑来检查这些字段：\n- 名字 (first name)\n- 中间首字母 (middle initial)\n- 姓 (last name)\n\
  - 城市 (city)\n- 州 (state)\n- 邮编 (zip)\n- 用户名 (username)\n\n在浏览器中测试你的解决方案\n\n## 挑战\n\
  \n添加正确的正则表达式来测试英国和加拿大的邮政编码：\n- 英国邮编为两个字母、一个或两个数字、一个空格、一个数字和两个字母——例如 WC12 3XY\n-\
  \ 加拿大邮编为一个字母、一个数字、一个字母、一个空格、一个数字、一个字母和一个数字——例如 M1A 2B3\n\n 接下来，对 `Register.html`\
  \ 进行修改，以这些正则表达式以及美国邮编的正则表达式来检查邮编。\n\n### 解决方案：`RegularExpressions/Solutions/FormValidation.js`\n\
  \n```javascript\n//Regular Expressions\nvar reEmail = /^(\\w+[\\-\\.])*\\w+@(\\\
  w+\\.)+[A-Za-z]+$/;\nvar rePassword = /^[A-Za-z\\d]{6,8}$/;\nvar reProperName =\
  \ /^([A-Z][A-Za-z']+ )*[A-Z][A-Za-z']+$/;\nvar reInitial = /^[A-Z]$/;\nvar reState\
  \ = /^[A-Z]{2}$/;\nvar rePostalUS = /^\\d{5}(\\-\\d{4})?$/;\nvar reUsername = /^[A-Za-z\\\
  d]{6,15}$/;\n```\n\n### 解决方案：`Register.html`\n\n```html\n<!DOCTYPE HTML>\n<html\n\
  <head>\n<meta charset=\"UTF-8\">\n<title>Registration Form</title>\n<script type=\"\
  text/javascript\" src=\"FormValidation.js\"></script>\n<script type=\"text/javascript\"\
  >\nfunction validate(form){\nvar firstName = form.FirstName.value;\nvar midInitial\
  \ = form.MidInit.value;\nvar lastName = form.LastName.value;\nvar city = form.City.value;\n\
  var state = form.State.value;\nvar zipCode = form.Zip.value;\nvar email = form.Email.value;\n\
  var userName = form.Username.value;\nvar password1 = form.Password1.value;\nvar\
  \ password2 = form.Password2.value;\nvar errors = [];\n\nif (!reProperName.test(firstName))\
  \ {\nerrors[errors.length] = \"You must enter a valid first name.\";\n}\nif (!reInitial.test(midInitial))\
  \ {\nerrors[errors.length] = \"You must enter a one-letter middle initial.\";\n\
  }\nif (!reProperName.test(lastName)) {\nerrors[errors.length] = \"You must enter\
  \ a valid last name.\";\n}\nif (!reProperName.test(city)) {\nerrors[errors.length]\
  \ = \"You must enter a valid city.\";\n}\nif (!reState.test(state)) {\nerrors[errors.length]\
  \ = \"You must enter a valid state.\";\n}\nif (!rePostalUS.test(zipCode)) {\nerrors[errors.length]\
  \ = \"You must enter a valid zip code.\";\n}\nif (!reUsername.test(userName)) {\n\
  errors[errors.length] = \"You must enter a valid username.\";\n}\nreturn true;\n\
  }\n</script>\n```\n\n### 挑战解决方案：`RegularExpressions/Solutions/FormValidation-challenge.js`\n\
  \n```javascript\n//Regular Expressions\nvar rePostalUS = /^\\d{5}(\\-\\d{4})?$/;\n\
  var rePostalCA = /^[A-Z]\\d[A-Z] \\d[A-Z]\\d$/;\nvar rePostalUK = /^[A-Z]{2}[0-9]{1,2}\
  \ ?[0-9]{1}[A-Z]{2}$/;\n```\n\n### 挑战解决方案：`Register-challenge.html`\n\n```html\n\
  <!DOCTYPE HTML>\n<html\n<head>\n<meta charset=\"UTF-8\">\n<title>Registration Form</title>\n\
  <script type=\"text/javascript\" src=\"FormValidation-challenge.js\"></script>\n\
  <script type=\"text/javascript\">\nfunction validate(form){\nif (!rePostalUS.test(zipCode)\n\
  && !rePostalCA.test(zipCode)\n&& !rePostalUK.test(zipCode))\n{\nerrors[errors.length]\
  \ = \"You must enter a valid postal code.\";\n}\nreturn true;\n}\n</script>\n```\n\
  \n# 第 13 章：清理表单输入\n\n有时候，在用户输入时立即清理用户输入是很好的，我们可以通过结合字符串对象的 `replace()` 方法和正则表达式来实现这一点。\n\
  \n## 重新回顾 `replace()` 方法\n\n我们已经查看过此方法以及如何使用它将正则表达式替换为字符串，但我们也可以结合反向引用来替换匹配的模式的新字符串。下面的示例展示了这一点：\n\
  \n```html\n<!DOCTYPE HTML>\n<html\n<head>\n<meta charset=\"UTF-8\">\n<title>Registration\
  \ Form</title>\n<script type=\"text/javascript\" src=\"FormValidation.js\"></script>\n\
  <script type=\"text/javascript\">\nfunction validate(form){\nvar firstName = form.FirstName.value;\n\
  var midInitial = form.MidInit.value;\nvar lastName = form.LastName.value;\nvar city\
  \ = form.City.value;\nvar state = form.State.value;\nvar zipCode = form.Zip.value;\n\
  var email = form.Email.value;\nvar userName = form.Username.value;\nvar password1\
  \ = form.Password1.value;\nvar password2 = form.Password2.value;\nvar errors = [];\n\
  \nif (!reProperName.test(firstName)) {\nerrors[errors.length] = \"You must enter\
  \ a valid first name.\";\n}\nif (!reInitial.test(midInitial)) {\nerrors[errors.length]\
  \ = \"You must enter a one-letter middle initial.\";\n}\nif (!reProperName.test(lastName))\
  \ {\nerrors[errors.length] = \"You must enter a valid last name.\";\n}\nif (!reProperName.test(city))\
  \ {\nerrors[errors.length] = \"You must enter a valid city.\";\n}\nif (!reState.test(state))\
  \ {\nerrors[errors.length] = \"You must enter a valid state.\";\n}\nif (!rePostalUS.test(zipCode))\
  \ {\nerrors[errors.length] = \"You must enter a valid zip code.\";\n}\nif (!reUsername.test(userName))\
  \ {\nerrors[errors.length] = \"You must enter a valid username.\";\n}\nreturn true;\n\
  }\n</script>\n```\n\n我们使用 `replace()` 方法来清理社会安全号码。在正则表达式 `reSSN = /^(\\d{3})(\\\
  d{2})?(\\d{4})$/` 中，有三个捕获组：`(\\d{3})`、`(\\d{2})` 和 `(\\d{4})`。这些可以分别被引用为 `$1`、`$2`\
  \ 和 `$3`。下面的示例展示了这一点：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"\
  UTF-8\">\n<title>Cleaner</title>\n<script type=\"text/javascript\">\nvar reSSN =\
  \ /^(\\d{3})(\\d{2})?(\\d{4})$/;\nfunction cleanSsn(ssn){\nif (reSSN.test(ssn))\
  \ {\nvar cleanedSsn = ssn.replace(reSSN, \"$1-$2-$3\");\nreturn cleanedSsn;\n} else\
  \ {\nalert(\"INVALID SSN\");\nreturn ssn;\n}\n}\n</script>\n</head>\n<body>\n<form\
  \ onsubmit=\"return false;\">\n<input type=\"text\" name=\"ssn\" size=\"20\">\n\
  <input type=\"button\" value=\"Clean SSN\"\nonclick=\"this.form.ssn.value = cleanSsn(this.form.ssn.value);\"\
  >\n</form>\n</body>\n</html>\n```\n\n## 清理表单输入\n\n-   在你的编辑器中打开 `RegularExpressions/Exercises/PhoneCleaner.html`。\n\
  -   这个练习大约需要你 15 到 20 分钟。\n\n## 挑战\n\n你有时发现电话号码是数字和字母的组合，并且带有额外的字符。你的挑战是添加一个名为 `convertPhone()`\
  \ 的函数：\n- 过滤掉所有非字母非数字的字符\n- 根据以下列表将字母转换为数字\n  - `ABC` -> 2\n  - `DEF` -> 3\n  -\
  \ `GHI` -> 4\n  - `JKL` -> 5\n  - `MNO` -> 6\n  - `PQRS` -> 7\n  - `TUV` -> 8\n\
  \  - `WXYZ` -> 9\n- 它必须将初始字符串传递给函数并返回结果\n\n### 解决方案：`PhoneCleaner.html`\n\n```html\n\
  <!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Phone Cleaner</title>\n\
  <script type=\"text/javascript\">\nvar rePhone = /^\\([2-9]\\d{2}\\)?[\\. ]?([2-9]\\\
  d{2})[\\. ]?(\\d{4})$/;\nfunction cleanPhone(phone){\nif (rePhone.test(phone)) {\n\
  var cleanedPhone = phone.replace(rePhone, \"($1) $2-$3\");\nreturn cleanedPhone;\n\
  } else {\nalert(\"INVALID PHONE\");\nreturn phone;\n}\n}\n</script>\n</head>\n<body>\n\
  <form onsubmit=\"return false;\">\n<input type=\"text\" name=\"Phone\" size=\"20\"\
  >\n<input type=\"button\" value=\"Convert Phone\"\nonclick=\"this.form.Phone.value\
  \ = cleanPhone(this.form.Phone.value);\">\n</form>\n</body>\n</html>\n```\n\n###\
  \ 挑战解决方案：`convertPhone.js`\n\n```javascript\nfunction convertPhone(phone){\nvar\
  \ convertedPhone;\nconvertedPhone = phone.replace(/[^A-Za-z\\d]/g, \"\");\nconvertedPhone\
  \ = convertedPhone.replace(/[ABC]/gi, \"2\");\nconvertedPhone = convertedPhone.replace(/[DEF]/gi,\
  \ \"3\");\nconvertedPhone = convertedPhone.replace(/[GHI]/gi, \"4\");\nconvertedPhone\
  \ = convertedPhone.replace(/[JKL]/gi, \"5\");\nconvertedPhone = convertedPhone.replace(/[MNO]/gi,\
  \ \"6\");\nconvertedPhone = convertedPhone.replace(/[PQRS]/gi, \"7\");\nconvertedPhone\
  \ = convertedPhone.replace(/[TUV]/gi, \"8\");\nconvertedPhone = convertedPhone.replace(/[WXYZ]/gi,\
  \ \"9\");\nreturn convertedPhone;\n}\n```\n\n\n\n\n\n```javascript\nconvertedPhone\
  \ = convertedPhone.replace(/[MNO]/gi, \"6\");\nconvertedPhone = convertedPhone.replace(/[PQRS]/gi,\
  \ \"7\");\nconvertedPhone = convertedPhone.replace(/[TUV]/gi, \"8\");\nconvertedPhone\
  \ = convertedPhone.replace(/[WXYZ]/gi, \"9\");\n\nreturn cleanPhone(convertedPhone.substr(0,\
  \ 10));\n}\n```\n</script>\n</head>\n<body>\n<form onsubmit=\"return false;\">\n\
  <input type=\"text\" name=\"Phone\" size=\"20\">\n<input type=\"button\" value=\"\
  Convert Phone\"\nonclick=\"this.form.Phone.value = convertPhone(this.form.Phone.value);\"\
  >\n</form>\n</body>\n</html>\n\n# 进阶章节：使用 AJAX\n\nAJAX 是异步 JavaScript 和 XML（Asynchronous\
  \ JavaScript and XML）的缩写，它是一组相关的技术，例如 `DOM`、`JavaScript`、`HTML`、`XML` 和 `CSS`。AJAX\
  \ 允许你异步发送和接收数据，无需重新加载网页，这使得它非常快。\n\nAJAX 还允许你只向 Web 服务器发送最重要的信息，而不是整个页面，因此只有有价值的数据会被路由到客户端。这使得你构建和使用的任何应用程序运行更快、交互性更强。AJAX\
  \ 被应用于大量的 Web 应用程序，包括 Facebook、Gmail、Google Maps、Twitter 等更多数不胜尽的应用。\n\n## AJAX\
  \ 是如何工作的？\n\n当你使用传统的 `JavaScript` 代码并想要从服务器文件或数据库中获取某些信息，或者如果你想向服务器发送某些信息时，你需要创建一个\
  \ `HTML` 表单，并使用 `POST` 或 `GET` 向数据发送或接收数据。终端用户需要点击写有 `SUBMIT`（提交）的按钮来发送或获取答案；他们必须等待服务器响应，加载一个新页面来显示结果。\n\
  \n每当用户提交一次输入时，服务器都会返回一个新页面，因此某些 Web 应用程序运行得非常缓慢，而且并不总是对用户友好。当你使用 AJAX 时，`JavaScript`\
  \ 将通过 JavaScript 对象 `XMLHttpRequest` 直接服务器对话。\n\n通过使用 `HTTP` 请求，网页可以请求并接收 Web 服务器的响应，而无需重新加载页面。用户留在同一个页面，不会察觉到脚本正在请求页面或向服务器发送数据，因为这些操作都在后台运行。\n\
  \n用户发送一个请求，该请求将执行一个操作。该操作的响应将显示在一个通过 `ID` 标识的层中，而无需页面经过完全重加载。这是一个页面 ID 的示例：\n\n\
  ```html\n<div id=\"ajaxResponse\"></div>\n```\n\n接下来，我们将简要查看如何创建 `XMLHttpRequest`\
  \ 对象并从服务器获取响应：\n\n### 第 1 步：创建 XMLHttpRequest 对象。不同的浏览器将使用不同的方法来创建此对象；Internet Explorer\
  \ 使用 `ActiveXObject`，而其他某些浏览器使用 `XMLHttpRequest`（当然这是 `JavaScript` 中的内置对象）。\n\n\
  为了创建对象并处理所有不同的浏览器，我们将使用一种称为“捕获与尝试”（catch and try）的语句。\n\n```javascript\nfunction\
  \ ajaxFunction()\n{\nvar xmlHttp;\ntry\n{\n// Firefox, Opera 8.0+, Safari\nxmlHttp=new\
  \ XMLHttpRequest();\n}\ncatch (e)\n{\n// Internet Explorer\ntry\n{\nxmlHttp=new\
  \ ActiveXObject(\"Msxml2.XMLHTTP\");\n}\ncatch (e)\n{\ntry\n{\nxmlHttp=new ActiveXObject(\"\
  Microsoft.XMLHTTP\");\n}\ncatch (e)\n{\nalert(\"您的浏览器不支持 AJAX!\");\nreturn false;\n\
  }\n}\n}\n\n```\n\n### 第 2 步：向服务器发送请求\n\n要向服务器发送请求，我们将使用 `open()` 和 `send()` 方法。\n\
  \n第一个方法接受三个参数——第一个用于定义发送 `GET` 或 `POST` 请求时使用的方法，第二个用于指定服务器端脚本的 URL，第三个指定请求必须被异步处理。第二个方法用于将请求发送到服务器。\n\
  \n```javascript\nxmlHttp.open(\"GET\",\"time.asp\",true);\nxmlHttp.send(null);\n\
  ```\n\n### 第 3 步：编写服务器端脚本\n\n`responseText` 将存储从服务器返回的任何数据，我们想将当前时间发送回去。为了这一点，我们将使用\
  \ `time.asp`，代码看起来如下：\n\n```asp\n<%\nresponse.expires=-1\nresponse.write(time)\n\
  ```\n\n### 第 4 步：处理响应\n\n下一步是处理返回的任何响应，并将其显示给终端用户：\n\n```javascript\nxmlHttp.onreadystatechange=function()\n\
  {\nif(xmlHttp.readyState==4)\n{\ndocument.myForm.time.value=xmlHttp.responseText;\n\
  }\n}\nxmlHttp.open(\"GET\",\"time.asp\",true);\nxmlHttp.send(null);\n}\n```\n\n\
  ### 第 5 步：完成代码\n\n最后一步是确定我们何时执行 AJAX 函数。每当用户在用户名文本框中输入内容时，它都将在后台运行，整个代码看起来如下：\n\n\
  ```html\n<html>\n<body>\n<script type=\"text/javascript\">\nfunction ajaxFunction()\n\
  {\nvar xmlHttp;\ntry\n{\n// Firefox, Opera 8.0+, Safari\nxmlHttp=new XMLHttpRequest();\n\
  }\ncatch (e)\n{\n// Internet Explorer\ntry\n{\nxmlHttp=new ActiveXObject(\"Msxml2.XMLHTTP\"\
  );\n}\ncatch (e)\n{\ntry\n{\nxmlHttp=new ActiveXObject(\"Microsoft.XMLHTTP\");\n\
  }\ncatch (e)\n{\nalert(\"您的浏览器不支持 AJAX!\");\nreturn false;\n}\n}\n}\nxmlHttp.onreadystatechange=function()\n\
  {\nif(xmlHttp.readyState==4)\n{\ndocument.myForm.time.value=xmlHttp.responseText;\n\
  }\n}\nxmlHttp.open(\"GET\",\"time.asp\",true);\nxmlHttp.send(null);\n}\n</script>\n\
  <form name=\"myForm\">\nName: <input type=\"text\" onkeyup=\"ajaxFunction();\" name=\"\
  username\" />\nTime: <input type=\"text\" name=\"time\" />\n</form>\n</body>\n</html>\n\
  ```\n\n这就是对 AJAX 如何工作以及它能做什么的简单介绍。互联网上有很多大量信息供你进一步研究，但请务必确保你先熟悉高级 `JavaScript`。\n\
  \n## 结语\n\n再次感谢阅读本书！\n\n我希望这本书能够帮助你理解并掌握 JavaScript 中一些更高级的技术，并希望你发现这些练习很有用——它们被设计用于测试你的知识，并帮助你学得更快。从实践示例中学习总是好的，特别是对于计算机编程语言，而不是仅仅是阅读并尝试吸收。\n\
  \n下一步是练习。无论你现在已经读了多少或到目前为止学了多少，只要你不练习，很快就会忘记。计算机编程的本质是事物会经常变化。保持你的学习，否则你将不得不回到基础！\n\
  \n最后，如果这本书带给你价值并在任何方面对你有所帮助，那么我想请你个忙，如果你愿意在 Amazon 上为这本书留个评论？我将不胜感激！\n\n感谢并祝你好运！\n\
  \n查看我的其他书籍：\n\n在下方你可以找到我的其他一些在 Amazon 和 Kindle 上同样流行的 Java 书籍。只需点击下面的链接即可查看它们。\n\
  \n或者，你可以访问我在 Amazon 上的作者页面来查看我的其他作品。\n\n[JavaScript: Tips and Tricks to Programming\
  \ Code with JavaScript](http://a.co/iiFdxVR)\n\n[JavaScript: Beginner's Guide to\
  \ Programming Code with JavaScript](http://a.co/fjoFfof)\n\n注意：如果链接由于某种原因无法使用，你只需在\
  \ Amazon 网站上搜索这些标题即可找到它们。\n\n《JavaScript: Best Practices to Programming Code with\
  \ JavaScript》预览\n\n最佳 JavaScript 技巧\n\n针对初学者\n\n无论你是否喜不喜欢，作为一名程序员或 Web 或/App 开发者，你都需要学习\
  \ JavaScript。它被认为是未来的计算机语言，仅仅是因为它是 Web 和应用开发不可或缺的一部分。\n\n\n\n\n\n当然，要涵盖每一个技巧来帮助你学习\
  \ JavaScript 的最佳实践几乎是不可能的。相反，我们希望侧重于你在学习编码时会遇到的一些主要属性。在接下来的章节中，我们将为你提供一些较简单的最佳实践，帮助你走上正确的道路。请记住，关于编程的学习永无止境。\n\
  \n这是一个极佳的开始！\n\n-   不要声明布尔对象、字符串或数字\n-   要初始化任何变量\n-   不要使用 `newObject()`\n-   要使用参数默认值\n\
  -   不要使用自动类型转换\n-   要使用“计时”来优化代码\n-   不要向 \"SetTimeOut\" 或 \"SetInterval\" 传递字符串\n\
  -   要使用 \"For in\" 语句\n-   不要使用 \"With\" 语句\n\n## 1. 不要声明布尔对象、字符串或数字\n\n在编写代码时，将你的布尔值、字符串和数字视为原始值是非常重要的。你不会希望将它们视为对象。如果你将这些代码中的任何一个定义为对象，可能会产生糟糕的副作用，并减慢你的执行速度。\n\
  \n这是一个简单的示例：\n\n```javascript\nvar x= \"Joe\";\nvar y= new String (\"Joe\");\n(x\
  \ ===y)\n```\n\n-   如你所示，结果将为 `false`，因为 `x` 是字符串而 `y` 是对象。它会抛出错误，而这是你可以避免的！\n\n\
  ## 2. 初始化任何变量\n\n无论你是在学习编码，还是只是想提高技能，在声明变量时初始化它们都是非常好的习惯。当你这样做时，它可以帮助避免 `undefined`\
  \ 值，为你提供一个统一的初始化位置，并帮助让你的代码更整洁。\n\n## 3. 不要使用 `newObject()`\n\n虽然我们之前稍微提到过这一点，但记住它非常重要。这里有一个快速备查表，帮助你记住应该使用哪个代码以及与其相似的代码。通过保持良好的组织，你可以保持代码的整洁。\n\
  \n-   使用：`{}` 不要使用：`new Object()`\n-   使用：`0` 不要使用：`new Number()`\n-   使用：`\" \"\
  ` 不要使用：`new String()`\n-   使用：`false` 不要使用：`new Boolean()`\n-   使用：`function ()\
  \ {}` 不要使用：`new Function()`\n-   使用：`/()/` 不要使用：`new RegExp()`\n-   使用：`[]` 不要使用：`new\
  \ Array()`\n\n## 4. 使用参数默认值\n\n我们邀请你花一点时间问问自己：我记得关于函数的什么？当你的函数缺少参数时，你称它为什么什么？没错！那个缺失参数的值将被称为\
  \ `undefined`。如果你以前没有意识到，这些 `undefined` 值可以并且将会破坏你的代码。为了打破这个习惯，请尽尝试自动为你的参数赋值。\n\n\
  这里是一个示例：\n\n```javascript\nfunction myFunction (x, y) {\n  if ( x === undefined)\
  \ {\n    x= 1;\n  }\n}\n```\n\n## 5. 不要使用自动类型转换\n\n在编写代码时，你可能需要注意可能会转换为 `NaN` 或字符串的数字。如果你需要复习一下，`NaN`\
  \ 代表“Not a Number”（不是数字）。由于 JavaScript 是弱类型语言，这种情况可能会自动发生。你代码中的变量可以改变数据类型，还可以包含几种不同类型的数据。\n\
  \n这是一个简单的示例：\n\n```javascript\nvar x = \"Hey\";\n```\n\n-   在这种情况下，`x` 是字符串，但如果你继续：\n\
  `x= 4;`\n-   那么，这会将你的 `x` 变为数字。你可以看到这会在你的代码中哪里导致错误。\n\n你还应该意识到，如果你在进行数学计算，JavaScript\
  \ 会将数字转换为字符串。如果你输入方式不对，它会给你一个答案，但可能不是你想要的那个。这里有一个简单的示例：\n\n-   在这个示例中，`typeof x`\
  \ 是一个数字\n```javascript\nvar x = 5+ 7; // x.valueOf() 将是 12\n```\n-   在下一个示例中，`typeof\
  \ x` 是一个字符串\n```javascript\nvar x = 5+ \"7\"; // x.valueOf() 将是 57\n```\n\n在另一种情况下，你可以尝试使用你的函数从一个字符串中减去另一个字符串。在这种情况下，它将返回\
  \ `NaN`。\n\n使用这个示例：\n\n```javascript\n\"Goodbye\" – \"Love\" // 这将会返回 NaN\n```\n\
  \n## 6. 使用“计时”来优化代码\n\n这种做法非常简单。是否曾经需要一种快速的方法来确切你的操作到底需要多长时间？幸运的是，Firebug 有一个“计时器”功能可以为你记录结果！有时，使用一些小技巧对你的编码很有帮助。\n\
  \n这是该功能的代码：\n\n```javascript\nfunction TimeTracker () {\n  console.time (\"MyTimer\"\
  );\n  for (x=4000; x > 0; x--) {}\n  console.timeEnd (\"MyTimer\");\n}\n```\n\n\
  ## 7. 不要向 \"SetTimeOut\" 或 \"SetInterval\" 传递字符串\n\n记得我们告诉过你不要使用 `eval` 函数吗？这段代码的功能相同。这就是为什么我们建议永远不要向\
  \ `SetTimeOut` 或 `SetInterval` 传递字符串。不幸的是，这段代码的效率非常低。\n\n而不是这段代码：\n\n```javascript\n\
  setInterval (\n  \"document.getElementById('container').innerHTML _+= 'The New Number:\
  \ ' + I\" , 2000\n);\n```\n\n使用这个：\n\n```javascript\nsetInterval(someFunction, 2000);\n\
  ```\n\n## 8. 使用 \"For in\" 语句\n\n有时在循环对象中的项时，你可能会注意到同时也获取了方法函数。如果你不希望这种情况发生，你可以用\
  \ `if` 语句包裹你的代码。这样，它就会过滤你的信息。\n\n这里是一个示例：\n\n```javascript\nfor (key in object)\
  \ {\n  if(object. hasOwnProperty(key)) {\n    //…做一些事情…\n  }\n}\n```\n\n## 9. 不要使用\
  \ \"With\" 语句\n\n这个编码技巧是有争议的。一方面，`with` 语句听起来确实是一个好主意。回顾来说，`with` 语句可以作为简写，用于访问代码中可能深度嵌套的任何对象。\n\
  \n这里是一个示例：\n\n```javascript\nwith (person.woman.bodyparts) {\n  hand = true;\n \
  \ foot= true;\n}\n```\n\n-   正如我们提到的，你应该使用这些语句：\n`person.woman.bodyparts.hand= true;`\n\
  `person.woman.bodyparts.foot= true;`\n\n在经过测试后，发现这些代码表现糟糕，特别是在设置新成员时。与其使用 `with`，你可以使用\
  \ `var` 并获得正确的结果。\n\n[点击此处在亚马逊查看更多 JavaScript: Best Practices](http://a.co/d75md5p)\n\
