    \ colors = [];\ncolors[\"red\"] = \"#f00\";\ncolors[\"green\"] = \"#060\";\ncolors[\"\
    blue\"] = \"#00f\";\ncolors[\"yellow\"] = \"#ff0\";\ncolors[\"orange\"] = \"#0ff\"\
    ;\n\nfunction deleteItem() {\n  delete colors[\"blue\"];\n  showArray();\n  revealArray();\n\
    }\n\nfunction setToNull() {\n  colors[\"blue\"] = null;\n  showArray();\n  revealArray();\n\
    }\n\nfunction showArray() {\n  var output = document.getElementById(\"colors\"\
    );\n  var strOutput = \"<ol>\";\n  for (var i in colors) {\n    strOutput += \"\
    <li style='color:\" + colors[i] + \";'>\" + i + \"</li>\";\n  }\n  strOutput +=\
    \ \"</ol>\";\n  output.innerHTML=strOutput;\n}\n\nfunction revealArray() {\n \
    \ var colorsCode = document.getElementById(\"colors-code\");\n  var strOutput\
    \ = \"&lt;ol&gt;\";\n  for (var i in colors) {\n    strOutput+=\"\\n\\t&lt;li\
    \ style='color:\" + colors[i] + \";'&gt;\" + i + \"&lt;/li&gt;\";\n  }\n  strOutput\
    \ += \"\\n&lt;/ol&gt;\";\n  colorsCode.innerHTML=strOutput;\n}\n</script>\n<title>Delete\
    \ vs. Setting to NULL</title>\n</head>\n<body onload=\"showArray();revealArray();\"\
