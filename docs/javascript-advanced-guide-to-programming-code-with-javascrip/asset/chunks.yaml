  trans: "\n当你在布尔语文中使用非布尔表达式时（例如 `if` 条件），这些表达式将被隐式地转换为布尔值，这个过程被称为类型转换。例如，如果你有表达式\
    \ `if (1) {alert('Hi’)}`，`1` 将被解释为 `true`，这意味着提示框将会出现。值 `1` 被称为真值（truthy），而值 `0`\
    \ 被称为假值（falsy）。\n\n当我们在期望布尔值的语境中使用它时，你可以使用任何 JavaScript 表达式：\n\n示例：\n\n```javascript\n\
    var truthies = [\n  \"false\",\n  \"0\",\n  -1,\n  \"null\",\n  \"undefined\"\
    ,\n  \"NaN\",\n  5/0,\n  Infinity\n];\n\nvar foo;\nvar falsies = [\n  null,\n\
    \  undefined,\n  foo,\n  0,\n  NaN,\n  \"\"\n];\n\nfor (var t=0; t<truthies.length;\
    \ t++) {\n  document.write(\"<li>\" + truthies[t] + \" : \" + Boolean(truthies[t])\
    \ + \"</li>\");\n}\n\nfor (var f=0; f<falsies.length; f++) {\n  document.write(\"\
    <li>\" + falsies[f] + \" : \" + Boolean(falsies[f]) + \"</li>\");\n}\n```\n\n\
    进入浏览器并打开上面的页面；你看到了什么？你会注意到所有不同的值在被隐式转换为布尔值时是如何评估的。\n\n以下是不同值的转换规则列表：\n\n| 值 |\
    \ 真值或假值 | 解释 |\n| :--- | :--- | :--- |\n| `0` | 假值 | `0` 总是假值 |\n| `\"0”` | 真值\
    \ | 所有非零字符串总是真值 |\n| `-1` | 真值 | 任何不是 `0` 的数字都是真值 |\n| `null` | 假值 | `null` 总是假值\
    \ |\n| `\"null”` | 真值 | 另一个非零字符串，因此是真值 |\n| `undefined` | 假值 | `undefined` 总是假值\
    \ |\n| `\"undefined”` | 真值 | 非零字符串，真值 |\n| `NaN` | 假值 | `NaN` 总是假值 |\n| `\"NaN”`\
    \ | 真值 | 非零字符串 |\n| `Infinity` | 真值 | 预留关键字且非零 |\n| `5/0` | 真值 | 评估为 `Infinity`\
    \ |\n| `\"\"` | 假值 | (空字符串) 零字符串总是假值 |\n| `\"false”` | 真值 | 非零字符串 |\n\n我们之所以有严格的\
    \ `===` 比较运算符是因为类型转换。`==`（普通等等运算符）会应用类型转换，有时你的比较结果不会得到你预期的结果。看这个示例：\n\n示例：\n\n\
    ```javascript\nvar num = 0;\nif (num == \"\") {\n  alert('Hey, I did not expect\
    \ this.');\n}\nif (num === \"\") {\n  alert('This will not displayed.');\n}\n\
    ```\n\n我们在条件判断中比较了两个假值，它们都会通过类型转换解析为 `false`。这使得比较结果为 `true`，这很可能不是这段代码的意图。为了检测类型之间的差异（即字符串和数字之间的差异），你应该使用\
    \ `===` 运算符，正如你在第二个语句中看到的 true。\n\n### 类型转换\n\n这是一个给你的练习，大约需要 5-10 分钟完成。你将调试一个简单的脚本并修复它：\n\
    \n- 在你的编辑器中，打开此页面：`Techniques/type-coercion.html`\n- 找出代码中的错误\n- 测试你的解决方案\n\n\
    解决方案：\n\n这是你应该得到的：\n\n```javascript\nvar answer = prompt(\"What is 0?\", \"\"\
    );\nif (answer === \"0\") {\n  alert(\"Right!\");\n} else {\n  alert(\"Wrong!\"\
    );\n}\n```\n\n你可能发现这比你想象的要难。在原始代码中，如果用户在不输入任何内容的情况下按确定，提示将是“Right!”。这是因为空字符串——记住，空字符串和\
    \ `0` 都是假值。所以你需要做什么？最初的想法可能只是将 `==` 改为 `===` 来区分类型，但如果你这样做并进行测试，即使使用了 `0`，提示框也会一直显示“Wrong!”。这里的问题在于，提示中的值实际上是一个字符串，而\
    \ `\"0\"` 并不严格等于数字。\n\n### 第 3 章：默认运算符\n\n`&&` 和 `||` 是布尔运算符，使用真值和假值将操作数解析为布尔值。如果你用过其他编程语言，你可能会认为运算符的结果总是\
    \ true 或 false。在 JavaScript 中，事实并非如此。在 JavaScript 语言中，操作结果始终是决定结果的那个特定操作数的值。让我解释得更清楚一点：\n\
    \n示例：\n\n```javascript\nvar a = 0, b = NaN, c = 1, d = \"hi\";\nvar result = (\
    \ a || b || c || d );\nalert(\"Result: \" + result);\nresult = ( d && c && b &&\
    \ a );\nalert(\"Result: \" + result);\n```\n\n`(a || b || c || d)` 是第一个布尔表达式，它将从左到右评估直到得出结论。`||`\
    \ 是或运算符，它遇到第一个真值就会停止。在上面的例子中：\n- `a = 0` 是假值，继续评估。\n- `b = NaN` 是假值，继续评估。\n- `c\
    \ = 1` 是真值，评估停止，结果为 `1`。\n\n`(d && c && b && a)` 是第一个布尔表达式，它将从左到右评估直到遇到第一个假值。\n\
    - `d = \"hi\"` 是真值，继续评估。\n- `c = 1` 是真值，继续评估。\n- `b = NaN` 是假值，评估停止，结果为 `NaN`。\n"
- fmt: "\nThe function `calculatePrice()` is using the default operator as a way setting\
    \ a default tax of `1`. The problem arises when `0` is passed as the tax value.\
    \ Your intent with the code is an indication of no tax but, as `0` is falsy, `tax\
    \ = tax || .1` will evaluate to `.1`.\n\nThis can be fixed by changing `tax =\
    \ tax || .1` to `tax = (tax === 0) ? 0 : tax || .1;`.\n\n## Applying Defaults\
    \ to Function Parameters\n\nThis exercise should take you about 5 to 15 minutes\
    \ to complete. We are going to go back to an example we used earlier and use `||`\
    \ as a way of handling optional parameters.\n\n*   Open `AdvancedTechniques/Exercises/sumAll-defaults.html`\
    \ in your editor\n*   Edit the `sumValues()` to make use of the `||` operator\
    \ instead of using `if` blocks\n\n### Example:\n\n```html\n<!DOCTYPE HTML>\n<html>\n\
    <head>\n<meta charset=\"UTF-8\">\n<title>Sum all numbers, default operator</title>\n\
    <script type=\"text/javascript\">\nfunction sumValues(val1, val2, val3) {\nif\
    \ (val1 === undefined) {\nval1 = 0;\n}\nif (val2 === undefined) {\nval2 = 0;\n\
    }\nif (val3 === undefined) {\nval3 = 0;\n}\nreturn val1 + val2 + val3;\n}\nvar\
    \ result1 = sumValues(3, 5, 6, 2, 7);\nvar result2 = sumValues(12, 20);\nalert(result1);\n\
    alert(result2);\n</script>\n</head>\n<body>\n<p>Nothing to show here.</p>\n</body>\n\
    </html>\n```\n\n### The Solution:\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
    <meta charset=\"UTF-8\">\n<title>Sum all numbers, default operator</title>\n<script\
    \ type=\"text/javascript\">\nfunction sumValues(val1, val2, val3) {\nval1 = val1\
    \ || 0;\nval2 = val2 || 0;\nval3 = val3 || 0;\nreturn val1 + val2 + val3;\n}\n\
    var result1 = sumValues(3, 5, 6, 2, 7);\nvar result2 = sumValues(12, 20);\nalert(result1);\n\
    alert(result2);\n</script>\n</head>\n<body>\n<p>Nothing to show here.</p>\n</body>\n\
    </html>\n```\n\n# Chapter 4: Functions Passed as Arguments\n\nFunctions in JavaScript\
    \ are first-class objects, not just a block of immutable code that is only able\
    \ to be invoked. Instead, every function that is declared then becomes an object,\
    \ complete with its own methods and properties, and these can be passed in the\
    \ same way as any object can.\n\nHave a look at the following example to see how\
    \ a function can be used as a parameter to another function:\n\n### Example:\n\
    \n```javascript\n//let's make an array that contains 5 values\nvar values = [5,\
    \ 2, 11, -7, 1];\n\n//this function will add the values of 'a' and 'b' and will\
    \ return the sum\nfunction add(a, b) {\n  return a+b;\n}\n//this function will\
    \ multiply the value of 'a' times 'b' and will return the result\nfunction multiply(a,\
    \ b) {\n  return a*b;\n}\n/* the 1st param passed is the numbers (in this case,\
    \ the array of values)\n* the 2nd param passed is the initial Value (could be\
    \ 0, 1, or whatever)\n* the 3rd param passed is the operation - which will be\
    \ one of the functions that is declared above (add or subtract)\n*/\nfunction\
    \ combineAll(nums, initialValue, operation) {\n  //let's initialize the local\
    \ variable 'runningResult' with the initialValue passed to it\n  var runningResult\
    \ = initialValue;\n  //loop the nums array\n  for (var i=0; i < nums.length; i++)\
    \ {\n    /* for each iteration, call the function (which can be add or multiply)\
    \ passing the 2 params\n    * on the first iteration, runningResult is the initialValue;\
    \ after that, value returned from operation(runningResult, nums[i])\n    * nums[i]\
    \ refers to the current number in the iteration; the 1st is 5, then 2, and so\
    \ on.\n    */\n    runningResult = operation(runningResult, nums[i]);\n  }\n \
    \ return runningResult;\n}\n//notice the 3rd param passes the \"add\" function\
    \ - you can pass a function into another function!\nvar sum = combineAll(values,\
    \ 0, add);\n//notice the 3rd param passes the \"multiply\" function - you can\
    \ pass a function into another function!\nvar product = combineAll(values, 1,\
    \ multiply);\nalert(\"Sum: \" + sum); //should be 12: 5+2+11+(-7)+1\nalert(\"\
    Product: \" + product); //should be -770: 5x2x11x-7x1\n```\n\nYou might be wondering\
    \ what this function means - `var sum = combineAll(values, 0, add);`. In the above\
    \ example, the function `add` is being passed as parameter three of `combineAll`.\
    \ At this moment, we are not going to invoke `add`, merely pass a reference. Did\
    \ you spot that the parentheses were not used after `add`? That should be a little\
    \ tip that we are not invoking any function.\n\nThe code line that will invoke\
    \ `add` reads:\n\n```javascript\nrunningResult = operation(runningResult, nums[i]);\n\
    ```\n\nA reference to `add` the operation parameter was received by this and,\
    \ when the operation is invoked, you will see that `add` is being called and it\
    \ returns the value of both of the sums that were passed to it.\n\nThis is a vital\
    \ technique and we often call the `combineAll` function to reduce. Take some time\
    \ to look over the code and run it until you are comfortable with it. We are going\
    \ to be using this in the following chapters so you need to understand it.\n\n\
    ## Anonymous Functions\n\nLooking back at the example we used before, the `add`\
    \ and `multiply` functions were only referred to on one occasion, in the call\
    \ to `combineAll`. If you were to stick with that pattern, you would need to make\
    \ a new function for every new combination desire that you wanted, for example,\
    \ concatenation, just so you could pass it to `combineAll`. Doesn’t that seem\
    \ like rather a complicated way of doing something that is actually quite simple?\n\
    \nYou will be pleased to learn that you don’t have to declare each function. In\
    \ fact, you don’t even need to come up with any names for them. In JavaScript,\
    \ we can create functions on the fly, whenever you need one that is only going\
    \ to be used in that one location. Even better, the syntax used is quite simple:\n\
    \n```javascript\nfunction (arg1, arg2) {\n  //function statements here\n}\n```\n\
    \nBecause these functions are not named, we call them anonymous functions.\n\n\
    Let’s go back to a previous example and use these anonymous functions to take\
    \ the place of the single-use functions:\n\n### Example:\n\n```javascript\nvar\
    \ values = [5, 2, 11, -7, 1];\n\nfunction combineAll(nums, initialValue, operation)\
    \ {\n  var runningResult = initialValue;\n  for (var i=0; i < nums.length; i++)\
    \ {\n    runningResult = operation(runningResult, nums[i]);\n  }\n  return runningResult;\n\
