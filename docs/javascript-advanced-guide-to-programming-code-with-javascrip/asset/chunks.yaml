    \n**法律声明：**\n本书受版权保护。本书仅供个人使用。未经作者同意，您不能修改、分发、销售、使用、引用或转述本书中的任何部分或内容。\n\n**免责声明：**\n\
    请注意，本文档包含的信息仅供教育和娱乐目的。我们已尽力提供准确、最新、可靠的完整信息。不表示也不暗示任何形式的保证。读者承认，作者并非在提供法律、财务、医疗或专业建议。本书的内容来源于各种来源。在尝试此书中概述的任何技术之前，请咨询执业的专业人士。\n\
    \n通过阅读本文，读者同意在任何情况下，作者对因使用本文包含的信息而导致的任何直接或间接损失均不负责，包括但不限于——错误、遗漏或不准确之处。\n\n# 引言\n\
    \n感谢你并祝贺你拥有我的书籍《JavaScript：JavaScript 编程进阶指南》。\n\n本书包含了一系列经过验证的步骤和策略，帮助你学习更高级的\
    \ JavaScript 代码。我必须在这里强调“高级”这个词——如果你还没有学习 JavaScript 的基础知识，那么这本书并不适合你；它针对那些具有先知识和经验，希望进一步增加知识并成为更好的\
    \ JavaScript 程序员的人。\n\n仅仅通过基础知识，你可以在 JavaScript 中走得很远，但如果你想充分利用 JavaScript 为你提供的力量，你需要学习更多高级的概念和技术。这些技术旨在帮助你编写更具表现力且可重用的代码。这些模式定义了一些你可能在其他计算机编程语言中找不到的特征，而这正是它成为一种独特且强大的语言的原因。\n\
    \n这是你的第一门计算机编程语言，你可能会发现某些模式有点奇怪，但通过我提供的解释和示例，以及供你做的练习（附带答案！），你很快就会熟悉。你会发现书中的某些章节非常短，而另一些则较长。我尽量保持所有内容的简洁，以便你更好地吸收。每一章中也不会有冗长的介绍；你现在的水平应该让我可以直接进入主题并边解释边介绍了！\n\
    \n再次感谢阅读我的书籍；我真心希望你发现它很有用，并祝你在学习这些高级 JavaScript 技术时好运。\n\n# 第一章：可选函数参数\n\n当在 JavaScript\
    \ 中声明函数时，函数通常预期包含一个参数列表：\n\n示例：\n\n代码：\n```javascript\nfunction sumValues(val1,\
    \ val2, val3) {\n  return val1 + val2 + val3;\n}\n```\n\n遗憾的是，这不能保证你的函数每次被调用时都有三个参数。向函数传递比定义的更少或更多的参数是可以的，但结果可能出乎意料。\n\
    \n示例：\n\n```javascript\nfunction sumValues(val1, val2, val3) {\n  return val1\
    \ + val2 + val3;\n}\n```\n\n如果我们调用 `sumValues(1, 2, 3)`，结果是 `6`。但如果我们调用 `sumValues(1,\
    \ 2)`，`val3` 为 `undefined`，而 `1 + 2 + undefined` 的结果是 `NaN`。\n\n为了修复这个问题，我们可以检查参数是否已定义：\n\
    \n```javascript\nfunction sumValues(val1, val2, val3) {\n  if (val1 === undefined)\
    \ { val1 = 0; }\n  if (val2 === undefined) { val2 = 0; }\n  if (val3 === undefined)\
    \ { val3 = 0; }\n  return val1 + val2 + val3;\n}\n```\n\n然而，处理可选参数更现代的方法是使用默认参数值：\n\
    \n```javascript\nfunction sumValues(val1 = 0, val2 = 0, val3 = 0) {\n  return\
    \ val1 + val2 + val3;\n}\n```\n\n# 第 2 章：真值与假值\n\n正如你所知的，JavaScript 包含布尔（Boolean）数据类型。这种类型只有两个值——true\
    \ 或 false。布尔表达式，例如 `a == b`，也会评估为布尔值，但并不是你需要的全部。在 JavaScript 中，每个值在布尔上下文中（如 `if`\
    \ 语句）中要么是“真值”（truthy），要么是“假值”（falsy）。\n\n以下值是假值：\n- `false`\n- `0`\n- `-0`\n-\
    \ `\"\"`（空字符串）\n- `null`\n- `undefined`\n- `NaN`\n\n其他所有值均为真值。\n\n"
- fmt: "\nWhen you use a non-Boolean expression in a Boolean context, for example,\
    \ an `if` condition, those expressions will implicitly convert to Booleans, in\
    \ a process called type coercion. For example, if you have the expression `if\
    \ (1) {alert('Hi’)}`, `1` would be interpreted as `true`, meaning that the alert\
    \ will appear. Value `1` is known as truthy while value `0` is falsy.\n\nWhen\
    \ we use that in a context that is expecting a Boolean value, you can use any\
    \ JavaScript expression:\n\nExample:\n\n```javascript\nvar truthies = [\n  \"\
    false\",\n  \"0\",\n  -1,\n  \"null\",\n  \"undefined\",\n  \"NaN\",\n  5/0,\n\
    \  Infinity\n];\n\nvar foo;\nvar falsies = [\n  null,\n  undefined,\n  foo,\n\
    \  0,\n  NaN,\n  \"\"\n];\n\nfor (var t=0; t<truthies.length; t++) {\n  document.write(\"\
    <li>\" + truthies[t] + \" : \" + Boolean(truthies[t]) + \"</li>\");\n}\n\nfor\
    \ (var f=0; f<falsies.length; f++) {\n  document.write(\"<li>\" + falsies[f] +\
    \ \" : \" + Boolean(falsies[f]) + \"</li>\");\n}\n```\n\nGo to a browser and open\
    \ that page above; what do you see? You will notice how all the different values\
    \ are evaluated when they are implicitly converted into Booleans.\n\nBelow is\
    \ a list of how the different values will be converted:\n\n| Value | Truthy or\
    \ Falsy | Explanation |\n| :--- | :--- | :--- |\n| `0` | falsy | `0` is always\
    \ falsy |\n| `\"0”` | truthy | all non-zero strings are always truthy |\n| `-1`\
    \ | truthy | any number that is not `0` is truthy |\n| `null` | falsy | `null`\
    \ is always falsy |\n| `\"null”` | truthy | another non-zero string, therefore\
    \ truthy |\n| `undefined` | falsy | `undefined` is always falsy |\n| `\"undefined”`\
    \ | truthy | non-zero string, truthy |\n| `NaN` | falsy | `NaN` is always falsy\
    \ |\n| `\"NaN”` | truthy | non-zero string |\n| `Infinity` | truthy | a reserved\
    \ keyword and non-zero |\n| `5/0` | truthy | evaluates to `Infinity` |\n| `\"\"\
    ` | falsy | (empty string) Zero strings are always falsy |\n| `\"false”` | truthy\
    \ | Non-zero string |\n\nThe reason we have strictly `===` comparison operator\
    \ is type coercion. `==`, which is the regular equality operator, will apply type\
    \ coercion and, on occasion, your comparisons will not give you the result that\
    \ you expect. Have look at this example:\n\nExample:\n\n```javascript\nvar num\
    \ = 0;\nif (num == \"\") {\n  alert('Hey, I did not expect this.');\n}\nif (num\
    \ === \"\") {\n  alert('This will not displayed.');\n}\n```\n\nWe have compared\
    \ two falsy values in conditional and they will both be resolved, through type\
    \ coercion, to `false`. This makes the comparison result as `true`, most likely\
    \ not the intent of this code. In order to detect the differences in type, i.e.\
    \ between string and number, you would use `===` operator, as you can see in the\
    \ second statement.\n\n### Type Coercion\n\nThis is an exercise for you, it should\
    \ take about 5-10 minutes to complete. You are going to debug a simple script\
    \ and fix it:\n\n- In your editor, open this page: `Techniques/type-coercion.html`\n\
    - Work out what is wrong with the code\n- Test your solution\n\nSolution:\n\n\
    This is what you should have got:\n\n```javascript\nvar answer = prompt(\"What\
    \ is 0?\", \"\");\nif (answer === \"0\") {\n  alert(\"Right!\");\n} else {\n \
    \ alert(\"Wrong!\");\n}\n```\n\nYou probably found that bit harder than you would\
    \ be. In the original code, if the user were to press OK without inputting anything,\
    \ the alert would be “Right!”. This is because an empty string – remember, empty\
    \ strings and `0` are both falsy. So what do you need to do? Initial thoughts\
    \ might be that you just change `==` to `===` as a way of differentiating between\
    \ types but if you were to do that and test it, the alert will always read “Wrong!”\
    \ even if you used `0`. The problem here is that the value in the prompt is actually\
    \ a string and `\"0\"` doesn’t strictly equal to number.\n\n### Chapter 3: Default\
    \ Operators\n\n`&&` and `||` are Boolean operators that use truthy and falsy to\
    \ resolve the operands to Boolean values. If you have used other programming languages,\
    \ you will probably be thinking that operator results are always true or false.\
    \ In JavaScript, that isn’t true. With the JavaScript language, operation results\
    \ are always the value of the particular operand that was the determining factor\
    \ in the result. Let me make that a little clearer:\n\nExample:\n\n```javascript\n\
    var a = 0, b = NaN, c = 1, d = \"hi\";\nvar result = ( a || b || c || d );\nalert(\"\
    Result: \" + result);\nresult = ( d && c && b && a );\nalert(\"Result: \" + result);\n\
    ```\n\n`(a || b || c || d)` is the first Boolean and it will be evaluated left\
    \ to right until it reaches a conclusion. `||` is a Boolean OR operator and this\
    \ only requires that one operand is truthy for the entire result to be true. In\
    \ the case of the example above:\n\n- `a = 0` and zero is always falsy. The valuation\
    \ will continue with the rest of the operands because falsy isn’t determining\
    \ anything. Only one truthy value is required for the entire statement.\n- `b\
    \ is NaN`, which is also falsy. The same situation occurs and we must continue\
    \ to evaluate.\n- `c is 1` and this is truthy. From here on, we have no need to\
    \ evaluate any more operands because the expression is going to result in true.\n\
    \nThere is a catch though – have you worked it out? Instead of a strictly true\
    \ result, we will get a truthy value that stopped the evaluation, in the case\
    \ of this example, `c`. the displayed message will read “Result: 1”.\n\nYou may\
    \ already expect that the `&&` operator works in pretty much the same way using\
    \ opposite conditions. This operator will return the value of the last operand\
    \ that was evaluated and that will be either the first falsy or, where all the\
    \ operands are truthy, the final one in the expression. Let’s say that we follow\
    \ the sequence for the expression `(d && c && b && a)` that we did in the case\
    \ of the OR operator. You will see that both `d` and `c` are truthy so you must\
    \ keep on going; when you get to `b`, a falsy, the evaluation will halt and the\
    \ return will be `b` with the displayed message reading “Result: NaN”.\n\nYou\
    \ might be sitting there thinking, what use is any of this? The behavior you have\
    \ seen here, the return of the first value that is conclusive, is a very handy\
    \ behavior to ensure the initialization of a variable. Look at the example of\
    \ a function below:\n\n```javascript\nfunction checkLength(text, min, max){\n\
    \  min = min || 1;\n  max = max || 10000;\n  if (text.length < min || text.length\
    \ > max) {\n    return false;\n  }\n  return true;\n}\n```\n\nIn line one and\
    \ two of the example, we have made sure that a valid value is always assigned\
    \ to `min` and `max`. Because of this, the function can be called like `checkLength(\"\
    abc\")`. The parameters for both the `min` and `max` will start with the value\
    \ `undefined`.\n\nWhen we get to `min = min || 1;`, all we are doing is assigning\
    \ a value of `1` to `min`, just to make sure that it will override `undefined`,\
    \ In the same way, `max` is assigned a value of `10000`.\n\nWere we to have passed\
    \ the real values for the parameters, as in the example `checkLength(\"abc\",\
    \ 2, 10)`, these values would have been retained as they are truthy. When we use\
    \ the `||` operator, we are, in effect giving default values to the parameters\
    \ and that is why we call the operator the default operator, at least in this\
    \ context.\n\nNote: do be careful when you use this operator with a variable that\
    \ accepts falsy values. Look at this code example to see where the danger lies:\n\
    \nExample:\n\n```javascript\nfunction calculatePrice(basePrice, tax) {\n  basePrice\
    \ = basePrice || 0;\n  tax = tax || .1; //default tax is 10%\n  var price = (basePrice\
    \ * (1 + tax)).toFixed(2);\n  alert(\"The price including tax is \" + price);\n\
    }\n\ncalculatePrice(100, 0); //no tax\n```\n"
  raw: 'When you use a non-Boolean expression in a Boolean context, for example, an
    if condition, those expressions will implicitly convert to Booleans, in a process
    called type coercion. For example, if you have the expressionif (1) {alert(‘Hi’)},1
    would be interpreted as true, meaning that the alert will appear. Value 1 is known
    as truthy while value 0 is falsy.


    When we use that in a context that is expecting a Boolean value, you can use any
    JavaScript expression:


    Example:


    var truthies = [


    "false",


    "0",


    -1,


    "null",


    "undefined",


    "NaN",


    5/0,


    Infinity


    ];


    var foo;


    var falsies = [


    null,


    undefined,


    foo,


    0,


    NaN,


    ""


    ];


    for (var t=0; t<truthies.length; t++) {


    document.write("<li>" + truthies[t] + " : " + Boolean(truthies[t]) + "</li>");


    }


    for (var f=0; f<falsies.length; f++) {


    document.write("<li>" + falsies[f] + " : " + Boolean(falsies[f]) + "</li>");


    }


    Go to a browser and open that page above; what do you see? You will notice ow
    all the different values are evaluated when they are implicitly converted into
    Booleans.


    Below is a list of how the different values will be converted:


    ValueTruthy or FalsyExplanation


    0falsy0 is always falsy


    “0”truthyall non-sera strings are always truthy


    -1truthyany number that is not 0 is truthy


    nullfalsynull is always falsy


    “null”truthyanother non-zero string, therefore truthy


    undefined falsyundefined is always falsy


    “undefined”truthynon-zero string, truthy


    NaNfalsyNaN is always falsy


    “NaN”truthynon-zero string


    Infinitytruthya reserved keyword and non-zero


    5/0truthyevaluates to Infinity


    ““(empty string)falsyZero strings are always falsy


    “false”truthyNon-zero string


    The reason we have the strictly or triple = (===) comparison operator is type
    coercion. ==, which is the regular equality operator, will apply type coercion
    and, on occasion, your comparisons will not give you the result that you expect.
    Have a look at this example:


    Example:


    var num = 0;


    if (num == "") {


    alert(''Hey, I did not expect to see this.'');


    }


    if (num === "") {


    alert(''This will not be displayed.'');


    }


    We have compared two falsy values in conditional one and they will both be resolved,
    through type coercion, to false. This makes the comparison result as true, most
    likely not what the intent of this code was.


    In order to detect the differences in type, i.e. between string and number, you
    would use the === operator, as you can see in the second if statement.


    Type Coercion


    This is an exercise for you, it should take about 5 to 10 minutes to complete.
    You are going to debug a simple script and fix it:


    *   In your editor, open this page: AdvancedTechniques/Exercises/type-coercion.html


    *   Work out what is wrong with the code


    *   Make the required fixes


    *   Test your solution in your browser


    Solution:


    This is what you should have got:


    var answer = prompt("What is 10-10?","");


    if (answer === "0") {


    alert("Right!");


    } else {


    alert("Wrong!");


    }


    You probably found that a bit harder than you thought it would be, In the original
    code, if the user were to press on OK on their prompt without inputting anything,
    the alert would be “Right!”. This is because it is an empty string – remember,
    empty strings and 0 are both falsy.


    So what do you need to do? Initial thoughts might be that you just change == to
    === as a way of differentiating between types but if you were to do that and test
    it, the alert will always read “Wrong!” even if you used 0.


    The problem here is that the value in the prompt is actually a string and string
    “0” doesn’t strictly equal to number 0\. The answer is to change the condition
    so that it saysanswer===”0”.


    Chapter 3:


    Default Operators


    && and || are Boolean operators that use truthy and falsy to resolve the operands
    to Boolean values. If you have used other programming languages, you will probably
    be thinking that Boolean operator results are always true or false. In JavaScript,
    that isn’t strictly true.


    With the JavaScript language, Boolean operation results are always the value of
    the particular operand that was the determining factor in the operation result.
    Let me make that a little clearer:


    Example:


    var a = 0, b = NaN, c = 1, d = "hi";


    var result = ( a || b || c || d );


    alert("Result: " + result);


    result = ( d && c && b && a );


    alert("Result: " + result);


    ( a || b || c || d ) is the first Boolean expression and it will be evaluated
    left to right until it reaches a conclusion. || is a Boolean OR operator and this
    only requires that one operand is a truthy for the entire result to be true. In
    the case of the example above:


    *   a = 0 and zero is always falsy. The valuation will continue with the rest
    of the operands because falsy isn’t yet determining anything. Only one truthy
    value is required for the entire statement to be true


    *   b is Nan, which is also falsy. The same situation occurs and we must continue
    to evaluate


    *   c is 1 and this is truthy. From here on, we have no need to evaluate any more
    operands because the expression is going to result in true.


    There is a catch though – have you worked it out? Instead of a strictly true result,
    we will get a truthy value that stopped the evaluation, in the case of this example,
    c. the displayed message will read “Result: 1”


    You may already expect that the And operator, && works in pretty much the same
    way but using opposite conditions. This operator will return the value of the
    last operand that was evaluated and that will be either the first falsy or, where
    all the operands are truthy, the final one in the expression. Let’s say that we
    follow the sequence for the expression( d && c && b && a )that we did in the case
    of the OR operator. You will see that both d and c are truthy so you must keep
    on going; when you get to b, a falsy, the evaluation will halt and the return
    will be b with the displayed message reading “Result: NaN”.


    You might be sitting there thinking, what use is any of this? The behavior you
    have seen here, the return of the first value that is conclusive, is a very handy
    behavior to ensure the initialization of a variable.


    Look at the example of a function below:


    function checkLength(text, min, max){


    min = min || 1;


    max = max || 10000;


    if (text.length < min || text.length > max) {


    return false;


    }


    return true;


    }


    In line one and two of the example, we have made sure that a valid value is always
    assigned to min and max. Because of this, the function can be called like checkValue("abc").
    The parameters for both the min and max will start with the value undefined.


    When we get to  min = min || 1;  all we are doing is assigning a value of 1 to
    min, just to make sure that it will override undefined, In the same way, max is
    assigned a value of 10000.


    Were we to have passed the real values for the parameters, as in the examplecheckLength("abc",
    2, 10) these values would have been retained as they are truthy.


    When we use the || operator, we are, in effect giving default values to the parameters
    and that is why we call the operator the default operator, at least in this context.
    The operator is used to replace longer code like:


    if (min === undefined) {


    min = 1;


    }


    To become:


    min = min || 1;


    Have a look at another example of how to use the default operator to shorten your
    code. This code


    var contactInfo;


    if (email) {


    contactInfo = email;


    } else if (phone) {


    contactInfo = phone;


    } else if (streetAddress) {


    contactInfo = streetAddress;


    }


    Can be significantly shortened to:


    var contactInfo = email || phone || streetAddress;


    Note: do be careful when you use this operator with a variable that accepts falsy
    values. Look at this code example to see where the danger lies:


    Example:


    function calculatePrice(basePrice, tax) {


    basePrice = basePrice || 0;


    tax = tax || .1; //default tax is 10%


    var price = (basePrice * (1 + tax)).toFixed(2);


    alert("The price including tax is " + price);


    }


    calculatePrice(100, 0); //no tax'
