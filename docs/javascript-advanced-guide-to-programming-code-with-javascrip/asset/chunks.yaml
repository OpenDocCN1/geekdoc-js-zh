    \ {\n  return a*b;\n}\n/* 第 1 个传递的参数是数字（在这种情况下，是 values 数组）\n* 第 2 个传递的参数是初始值（可以是\
    \ 0, 1 或任何值）\n* 第 3 个传递的参数是操作 - 它将是上面声明的函数之一（add 或 subtract）\n*/\nfunction combineAll(nums,\
    \ initialValue, operation) {\n  //让我们用传递的 initialValue 初始化局部变量 'runningResult'\n\
    \  var runningResult = initialValue;\n  // 遍历 nums 数组\n  for (var i=0; i < nums.length;\
    \ i++) {\n    /* 每次迭代，调用函数（可以是 add 或 multiply）并传递 2 个参数\n    * 在第一次迭代中，runningResult\
    \ 是 initialValue；之后，是 operation(runningResult, nums[i]) 返回的值\n    * nums[i] 指迭代中的当前数字；第一个是\
    \ 5，然后是 2，依此类推。\n    */\n    runningResult = operation(runningResult, nums[i]);\n\
    \  }\n  return runningResult;\n}\n//注意第 3 个参数传递了 \"add\" 函数 - 你可以将一个函数传递到另一个函数！\n\
    var sum = combineAll(values, 0, add);\n//注意第 3 个参数传递了 \"multiply\" 函数 - 你可以将一个函数传递到另一个函数！\n\
    var product = combineAll(values, 1, multiply);\nalert(\"Sum: \" + sum); // 应该是\
    \ 12: 5+2+11+(-7)+1\nalert(\"Product: \" + product); // 应该是 -770: 5x2x11x-7x1\n\
    ```\n\n你可能在想这个函数的意思是什么 - `var sum = combineAll(values, 0, add);`。在上面的示例中，函数 `add`\
    \ 被作为参数三传递给 `combineAll`。此时，我们并不会调用 `add`，只是传递了一个引用。你发现 `add` 后面没有使用括号了吗？这应该是一个小提示，说明我们没有调用任何函数。\n\
    \n调用 `add` 的代码行是：\n\n```javascript\nrunningResult = operation(runningResult, nums[i]);\n\
    ```\n\n这行代码接收了对 `operation` 参数 `add` 的引用，并且当调用 `operation` 时，你会看到 `add` 正在被调用，并返回传递给它的两个和的值。\n\
    \n这是一项至关的技术，我们经常调用 `combineAll` 函数来归约（reduce）。花些时间查看代码并运行它，直到你熟悉它为止。我们将在接下来的章节中使用它，所以你需要理解它。\n\
    \n## 匿名函数\n\n回看我们之前使用的示例，`add` 和 `multiply` 函数只被引用了一次，在调用 `combineAll` 的时候。如果你坚持那种模式，你将为你每个想要的新组合（例如拼接）创建一个新函数，以便你能将其传递给\
    \ `combineAll`。这看起来不是很麻烦吗？你会很高兴地发现，在 JavaScript 中你甚至不需要为它们命名。事实上，这种语法非常简单：\n\n\
    ```javascript\nfunction (arg1, arg2) {\n  //这里是语句\n}\n```\n\n因为这些函数没有命名，我们可以在需要的地方创建匿名函数。让我们回到之前的示例，使用这些匿名函数来代替原本的函数：\n\
    \n# 第 5 章：嵌套函数\n\n由于 JavaScript 函数是另一种类型的 JavaScript 对象，我们能够创建一个位于另一个内部的函数。我们称这些嵌套函数，有时称为内部函数。查看以下示例，它展示了如何创建一个函数并在另一个函数中使用它：\n\
    \n### 示例：\n\n```javascript\nvar values = [5, 2, 11, -7, 1];\n\nfunction combineAll(nums,\
    \ initialValue, operator) {\n  var runningResult = initialValue;\n  for (var i=0;\
    \ i < nums.length; i++) {\n    runningResult = calculate(nums[i]);\n  }\n  return\
    \ runningResult;\n\n  function calculate(num) {\n    switch (operator.toLowerCase())\
    \ {\n      case \"+\" :\n        return runningResult + num;\n      case \"x\"\
    \ :\n        return runningResult * num;\n      case \"*\" :\n        return runningResult\
    \ * num;\n      case \"a\" :\n        return runningResult + \", \" + num;\n \
    \   }\n  }\n}\n\nvar sum = combineAll(values, 0, \"+\");\nvar product = combineAll(values,\
    \ 1, \"x\");\nvar list = combineAll(values, 1, \"a\");\n\nalert(\"Sum: \" + sum);\n\
    alert(\"Product: \" + product);\nalert(\"Number List: \" + list);\n```\n"
- fmt: "\nJavaScript variables are declared with the use of the `var` keyword and\
    \ they will be either locally or globally scoped. To be globally scoped, a variable\
    \ must meet any of the following conditions:\n\n- The variable has been declared\
    \ outside a function\n- The variable has been used without the use of the `var`\
    \ keyword to declare it\n\nTo be locally scoped, a variable has to be declared\
    \ in another function with the `var` keyword.\n\nGlobal variables can be accessed\
    \ from anywhere in the JavaScript code:\n\nExample:\n\n```javascript\nvar maxNum;\
    \ //global\n\nfunction prepare() {\n  var maxNum = 5; //local to function\n  //let's\
    \ forget the \"var\" in the \"for\" declaration\n  for (i=0; i <= maxNum; ++i)\
    \ { //no var, so i will be global\n    //do something\n  }\n}\n\nprepare();\n\n\
    alert(maxNum); //undefined\nalert(i); //6 (because it is globally scoped)\n```\n\
    \nNote that `maxNum` is a globally declared variable but has not got a value assigned\
    \ to it. It has been declared inside the `prepare()` function and has been given\
    \ a value of 5.\n\nHave a look at the `maxNum` value after `prepare()`, has been\
    \ called. The value has been left as undefined. The reason for this is because\
    \ the global variable is being rea and we can’t have access to the function variable\
    \ from the outside of the function.\n\nWe can, however, access variable `i`, simply\
    \ because we gave it a value inside the function without using `var` to declare\
    \ it.\n\nBecause there is no block scope within JavaScript, variables will never\
    \ be local to a for loop or an if statement.\n\n# Chapter 7: Observing and Capturing\
    \ Events\n\nMost likely you are more used to using HTML event handlers, such as\
    \ “on” attributes, as a way of capturing events – see the example below:\n\nExample:\n\
    \n```html\n<ul>\n  <li onclick=\"document.bgColor='red';\">Red</li>\n  <li onclick=\"\
    document.bgColor='orange';\">Orange</li>\n  <li onclick=\"document.bgColor='green';\"\
    >Green</li>\n  <li onclick=\"document.bgColor='blue';\">Blue</li>\n</ul>\n```\n\
    \nHowever, it is far better to keep HTML and JavaScript separate from one another.\n\
    \n## The `eval()` Function\n\nWhy are we talking about this function here? It\
    \ is to simply acknowledge that it exists and to tell you NOT to use it. I will\
    \ tell you why but first you need to know what it does.\n\n`eval` is used to compile\
    \ a string and execute it, the string will contain JavaScript code and it can\
    \ be something very simple, an expression like “2 + 3” or it can be a longer more\
    \ complex script, with all sorts of functions and other things in it.\n\nLook\
    \ at the following example: this is similar to what you might find on the internet\
    \ in live web sites:\n\nExample:\n\n```javascript\nfunction getProperty(objectName,\
    \ propertyName) {\n  //expression will be: document.title\n  var expression =\
    \ objectName + \".\" + propertyName;\n  console.log(expression);\n  //the eval()\
    \ function will evaluate the expression, so document.title gives us the title\
    \ of the document\n  var propertyValue = eval(expression);\n  return propertyValue;\n\
    }\n\nvar prop = \"title\"; //assume that this was given by the user\nalert(getProperty(\"\
    document\", prop));\n```\n\nThis function will come up with an expression by taking\
    \ an object name and concatenating it with a dot and the name of a property. It\
    \ then evaluates the expression using `eval()`. While it is an incredibly powerful\
    \ function, it also has the potential to be very dangerous and is not terribly\
    \ efficient. Why is it dangerous? Because it usually used as way of evaluating\
    \ input from a user and this isn’t always the safest thing to do. The inefficiency\
    \ side comes from the fact that every call to `eval()` will start a JavaScript\
    \ compiler.\n\nUsing the function normally indicates a real lack of knowledge\
    \ on the part of the developer. In the above example, we could have gone down\
    \ the route of using the `[]` property accessor. We would have got the same from\
    \ `alert(window[prop]);` without the need to start the compiler just to get the\
    \ value of the property.\n\nRemember: avoid using `eval` as much as you possibly\
    \ can because it will only cause problems in your code.\n\n# Chapter 8: Error\
    \ Handling\n\nIt doesn’t matter how carefully you write your code, errors will\
    \ always appear. Mostly, they will be runtime errors that arise from things you\
    \ can’t predict. Other times, they will be bugs or your code not behaving as it\
    \ is supposed to be. Fortunately, JavaScript provides you with the tools you need\
    \ to deal with both types of error and that is what we are going to talk about\
    \ in this chapter.\n\n## Runtime Errors\n\nWeb browsers can be incredibly hostile\
    \ places and it is pretty much guaranteed that you will be forever dealing with\
    \ runtime errors. Users put in wrong inputs in ways you truly didn’t think was\
    \ possible. A new version of the browser can change the way things work and Ajax\
    \ calls could fail for many different reasons.\n\nMuch of the time, there is nothing\
    \ you can do to stop a runtime error but there are ways to deal with them to make\
    \ things a little less traumatic for the user.\n\n### Unhandled Errors\n\nHave\
    \ a look at this example, it seems trivial:\n\nExample:\n\n```javascript\nfunction\
    \ getInput() {\n  var name = prompt('Type your name');\n  alert('Your name has\
    \ ' + name.length + ' letters.');\n}\n\ngetInput();\n```\n\nLook at the code properly;\
    \ it might not be that obvious to begin with but this is a bug waiting to happen.\
    \ If a user were to click or press ESC or Cancel, a null will be returned by the\
    \ `prompt()` function and this will give the net line a null reference error and\
    \ make it fail.\n\nIf the developer doesn’t do anything about this, the end user\
    \ will get a browser message that means absolutely nothing to them. Depending\
    \ on how the user has configured their settings or browser, they may not get an\
    \ on-screen message; it might show up as a small icon in the status bar, an icon\
    \ which could be missed easily and leave users believing that the application\
    \ is just not responding.\n\n### Globally Handled Errors\n\nThere is an event\
    \ known as `onerror` in a window object and this might be invoked whenever an\
    \ unhandled error shows up on the page. For example:\n\n```javascript\nwindow.onerror\
    \ = function (message, url, lineNo) {\n  alert(\n    'Error: ' + message +\n \
    \   '\\n Url: ' + url +\n    '\\n Line Number: ' + lineNo);\n  return true;\n\
    }\n\nfunction getInput() {\n  var name = prompt('Type your name');\n  alert('Your\
    \ name has ' + name.length + ' letters.');\n}\n\ngetInput();\n```\n\nAs you can\
    \ see from this example, the event passes three arguments to the function. The\
    \ first is the error message, the second is the URL of the file that has the error\
    \ in it, very useful if this is an external `.js` file, and the third shows the\
    \ line number that the error is on in that specific file.\n\n`return true` is\
    \ telling the browser that the developer has dealt with this; if false were returned,\
    \ the browser would treat this as an unhandled error and the on-screen or status\
    \ bar message would show up on the user’s screen.\n\n## Structured Error Handling\n\
    \nAs with anything, the very best way to deal with an error is to detect it as\
    \ near to where it occurs as you can. This will make it easier for you to know\
    \ what to do with it. JavaScript will use `try...catch...finally` block to implement\
    \ structured error handling:\n\n```javascript\ntry {\n  //try statements\n} catch\
    \ (error) {\n  //catch statements\n} finally {\n  //finally statements\n}\n```\n\
    \nThis is a very simple premise; if the error occurs in statements that are in\
    \ the `try` block, the statements in the `catch` block are executed and the error\
    \ is passed straight to the `error` variable. The `finally` block is an optional\
    \ one and, if used, it will always be executed last whether there is an error\
    \ or not.\n\nWhat can we do to make our code catch the error?\n\nExample:\n\n\
    ```javascript\nwindow.onerror = function (message, url, lineNo) {\n  alert(\n\
    \    'Error: ' + message +\n    '\\n Url: ' + url +\n    '\\n Line Number: ' +\
    \ lineNo);\n  return true;\n}\n\nfunction getInput() {\n  try {\n    var name\
    \ = window.prompt('Type your name');\n    alert('Your name has ' + name.length\
    \ + ' letters.');\n  } catch (error) {\n    alert('The error was: ' + error.name\
    \ +\n    '\\n The error message was: ' + error.message);\n  } finally {\n    //do\
    \ cleanup\n  }\n}\n\ngetInput();\n```\n"
  raw: 'JavaScript variables are declared with the use of the var keyword and they
    will be either locally or globally scoped. To be globally scoped, a variable must
    meet any of the following conditions:


    *   The variable has been declared outside a function


    *   The variable has been used without the use of the var keyword to declare it


    To be locally scoped, a variable has to be declared in another function with the
    var keyword.


    Global variables can be accessed from anywhere in the JavaScript code:


    Example:


    var maxNum; //global


    function prepare() {


    var maxNum = 5; //local to function


    //let''s forget the "var" in the "for" declaration


    for (i=0; i <= maxNum; ++i) { //no var, so i will be global


    //do something


    }


    }


    prepare();


    alert(maxNum); //undefined


    alert(i); //6 (because it is globally scoped)


    Note thatmaxNum is  a globally declared variable but has not got a value assigned
    to it. It has been declared inside theprepare() function and has been given a
    value of 5.


    Have a look at the maxNum value afterprepare(), has been called. The value has
    been left as undefined. The reason for this is because the global variable is
    being rea and we can’t have access to the function variable from the outside of
    the function.


    We can, however, access variable i, simply because we gave it a value inside the
    function without using var to declare it.


    Because there is no block scope within JavaScript, variables will never be local
    to a for loop or an if statement.


    Chapter 7:


    Observing and Capturing Events


    Most likely you are more used to using HTML event handlers, such as “on” attributes,
    as a way of capturing events – see the example below:


    Example:


    <ul>


    <li onclick="document.bgColor=''red'';">Red</li>


    <li onclick="document.bgColor=''orange'';">Orange</li>


    <li onclick="document.bgColor=''green'';">Green</li>


    <li onclick="document.bgColor=''blue'';">Blue</li>


    </ul>


    However, it is far better to keep HTML and JavaScript separate from one another.


    The eval() Function


    Why are we talking about this function here? It is to simply acknowledge that
    it exists and to tell you NOT to use it. I will tell you why but first you need
    to know what it does.


    eval is used to compile a string and execute it, the string will contain JavaScript
    code and it can be something very simple, an expression like “2 + 3” or it can
    be a longer more complex script, with all sorts of functions and other things
    in it.


    Look at the following example: this is similar to what you might find on the internet
    in live web sites:


    Example:


    function getProperty(objectName, propertyName) {


    //expression will be: document.title


    var expression = objectName + "." + propertyName;


    console.log(expression);


    //the eval() function will evaluate the expression, so document.title gives us
    the title of the document


    var propertyValue = eval(expression);


    return propertyValue;


    }


    var prop = "title"; //assume that this was given by the user


    alert(getProperty("document", prop));


    This function will come up with an expression by taking an object name and concatenating
    it with a dot and the name of a property. It then evaluates the expression usingeval().
    While it is an incredibly powerful function, it also has the potential to be very
    dangerous and is not terribly efficient. Why is it dangerous? Because it usually
    used as way of evaluating input from a user and this isn’t always the safest thing
    to do. The inefficiency side comes from the fact that every call toeval() will
    start a JavaScript compiler.


    Using the function normally indicates a real lack of knowledge on the part of
    the developer. In the above example, we could have gone down the route of using
    the [] property accessor. We would have got the same from alert(window[prop]);
    without the need to start the compiler just to get the value of the property.


    Remember: avoid using eval as much as you possibly can because it will only cause
    problems in your code.


    # Chapter 8:


    Error Handling


    It doesn’t matter how carefully you write your code, errors will always appear.
    Mostly, they will be runtime errors that arise from things you can’t predict.
    Other times, they are bugs or your code not behaving as it is supposed to. Fortunately,
    JavaScript provides you with the tools you need to deal with both types of error
    and that is what we are going to talk about in this chapter.


    Runtime Errors


    Web browsers can be incredibly hostile places and it is pretty much guaranteed
    that you will be forever dealing with runtime errors. Users put in wrong inputs
    in ways you truly didn’t think was possible. A new version of the browser can
    change the way things work and Ajax calls could fail for many different reasons.


    Much of the time, there is nothing you can do to stop a runtime error but there
    are ways to deal with them to make things a little less traumatic for the user.


    Unhandled Errors:


    Have a look at this example, it seems trivial:


    Example:


    function getInput() {


    var name = prompt(''Type your name'');


    alert(''Your name has '' + name.length + '' letters.'');


    }


    getInput();


    Look at the code properly; it might not be that obvious to begin with but this
    is a bug waiting to happen. If a user were to click or press ESC or Cancel, a
    null will be returned by the prompt() function and this will give the net line
    a null reference error and make it fail.


    If the developer doesn’t do anything about this, the end user will get a browser
    message that means absolutely nothing to them. Depending on how the user has configured
    their settings or browser, they may not get an on-screen message; it might show
    up as a small icon in the status bar, an icon which could be missed easily and
    leave users believing that the application is just not responding.


    Globally Handed Errors:


    There is an event known as on error in a window object and this might be invoked
    whenever an unhandled error shows up on the page. For example:


    Example:


    window.onerror = function (message, url, lineNo) {


    alert(


    ''Error: '' + message +


    ''\n Url: '' + url +


    ''\n Line Number: '' + lineNo);


    return true;


    }


    function getInput() {


    var name = prompt(''Type your name'');


    alert(''Your name has '' + name.length + '' letters.'');


    }


    getInput();


    As you can see from this example, the event passes three arguments to the function.
    The first is the error message, the second is the URL of the file that has the
    error in it, very useful if this is an external .js file, and the third shows
    the line number that the error is on in that specific file.


    The return true is telling the browser that the developer has dealt with this;
    if false were returned, the browser would treat this as an unhandled error and
    the on-screen or status bar message would show up on the user’s screen.


    Structured Error Handling


    As with anything, the very best way to deal with an error is to detect it as near
    to where it occurs as you can. This will make it easier for you to know what to
    do with it. JavaScript will use try…catch…finally block  to implement structured
    error handling:


    try {


    //try statements


    } catch (error) {


    //catch statements


    } finally {


    //finally statements


    }


    This is a very simple premise; if the error occurs in statements that are in the
    try block, the statements in the catch block are executed and the error is passed
    straight to the error variable. The finally block is an optional one and, if it
    used, it will always be executed last whether there is an error or not.


    What can we do to make our code catch the error?


    Example:


    window.onerror = function (message, url, lineNo) {


    alert(


    ''Error: '' + message +


    ''\n Url: '' + url +


    ''\n Line Number: '' + lineNo);


    return true;


    }


    function getInput() {


    try {


    var name = window.prompt(''Type your name'');


    alert(''Your name has '' + name.length + '' letters.'');


    } catch (error) {


    alert(''The error was: '' + error.name +


    ''\n The error message was: '' + error.message);


    } finally {


    //do cleanup


    }


    }


    getInput();'
