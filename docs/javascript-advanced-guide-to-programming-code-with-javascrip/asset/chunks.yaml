    \ of Occurrences (`?` `*` `{}`)\n\nThese symbols will affect how many occurrences\
    \ there are of the preceding character or, if you use parenthesis, characters\
    \ - `?`, `*`, `+`, `{}`.\n\n* The question mark (`?`) is an indication that the\
    \ preceding character must appear 0 or 1 times in the pattern.\n* You will find\
    \ pattern `foo?` in `“fod”` and `“food”` but not in `“faod”`.\n* The plus sign\
    \ (`+`) is an indication that the preceding character will appear at least once\
    \ in the pattern.\n* You will find pattern `fo+` in `“food”`, `“fod”` and `“foood”`\
    \ but you won’t find it in `“fd”`.\n* The asterisk (`*`) is an indicator that\
    \ the preceding character has to appear at least 0 times in the pattern.\n* You\
    \ will find pattern `fo*d` in `“fd”`, `“food”` and `“fod”`.\n* The curly brackets\
    \ (`{}`), with a single parameter `{n}` is an indicator that the preceding character\
    \ must appear in the pattern exactly `n` times.\n* You will find pattern `fo{3}d`\
    \ in `“foood”` but you won’t find it in `“fooood”` or in `“food”`.\n* The curly\
    \ brackets with two parameters `{n1, n2}` is an indicator that the previous character\
    \ should appear in the pattern between `n1` and `n2` times.\n* You will find pattern\
    \ `fo{2,4}` in `“fooood”`, `“foood”` and in `“food”` but you won’t find it in\
    \ `“foooood”`.\n* Curly brackets that have one parameter with a second empty one\
    \ `{n}` is an indicator that the previous character must appear in the pattern\
    \ at least `n` times.\n* You will find pattern `fo{2}` in `“foooood”` and in `“food”`\
    \ but you won’t find it in `“fod”`.\n\n# Common Characters (`.` `\\d` `\\D` `\\\
    w` `\\W` `\\s` `\\S`)\n\n* A period (`.`) is representative of any character except\
    \ for a newline.\n* You will find pattern `fo.d` in `“foad”`, `“food”`, `“fo*f”`\
    \ and in `“fo9d”`.\n* The backslash-d (`\\d`) is representative of any digit and\
