  raw: 'The function calculatePrice() is using the default operator as a way setting
    a default tax of 1\. The problem arises when 0 is passed as the tax value. Your
    intent with the code is an indication of no tax but, as 0 is falsy, tax = tax
    || .1 will evaluate to .1.


    This can be fixed by changing tax = tax || .1 to tax = (tax === 0) ? 0 : tax ||
    .1;.


    Applying Defaults to Function Parameters


    This exercise should take you about 5 to 15 minutes to complete. We are going
    to go back to an example we used earlier and use || as a way of handling optional
    parameters.


    *   Open AdvancedTechniques/Exercises/sumAll-defaults.html in your editor


    *   Edit the sumValues()  to make use of the || operator instead of using if blocks


    Example:


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta charset="UTF-8">


    <title>Sum all numbers, default operator</title>


    <script type="text/javascript">


    function sumValues(val1, val2, val3) {


    if (val1 === undefined) {


    val1 = 0;


    }


    if (val2 === undefined) {


    val2 = 0;


    }


    if (val3 === undefined) {


    val3 = 0;


    }


    return val1 + val2 + val3;


    }


    var result1 = sumValues(3, 5, 6, 2, 7);


    var result2 = sumValues(12, 20);


    alert(result1);


    alert(result2);


    </script>


    </head>


    <body>


    <p>Nothing to show here.</p>


    </body>


    </html>


    The Solution:


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta charset="UTF-8">


    <title>Sum all numbers, default operator</title>


    <script type="text/javascript">


    function sumValues(val1, val2, val3) {


    val1 = val1 || 0;


    val2 = val2 || 0;


    val3 = val3 || 0;


    return val1 + val2 + val3;


    }


    var result1 = sumValues(3, 5, 6, 2, 7);


    var result2 = sumValues(12, 20);


    alert(result1);


    alert(result2);


    </script>


    </head>


    <body>


    <p>Nothing to show here.</p>


    </body>


    </html>


    # Chapter 4:


    Functions Passed as Arguments


    Functions in JavaScript are first-class objects, not just a block of immutable
    code that is only able to be invoked. Instead, every function that is declared
    then becomes an object, complete with its own methods and properties, and these
    can be passed in the same way as any object can.


    Have a look at the following example to see how a function can be used as a parameter
    to another function:


    Example:


    //let''s make an array that contains 5 values


    var values = [5, 2, 11, -7, 1];


    //this function will add the values of ''a'' and ''b'' and will return the sum


    function add(a, b) {


    return a+b;


    }


    //this function will multiply the value of ''a'' times ''b'' and will return the
    result                           


    function multiply(a, b) {


    return a*b;


    }


    /* the 1st param passed is the numbers (in this case, the array of values)


    * the 2nd param passed is the initial Value (could be 0, 1, or whatever)


    * the 3rd param passed is the operation - which will be one of the functions that
    is declared above (add or subtract)


    */


    function combineAll(nums, initialValue, operation) {


    //let''s initialize the local variable ''runningResult'' with the initialValue
    passed to it


    var runningResult = initialValue;


    //loop the nums array


    for (var i=0; i < nums.length; i++) {


    /* for each iteration, call the function (which can be add or multiply) passing
    the 2 params


    * on the first iteration, runningResult is the initialValue; after that, value
    returned from operation(runningResult, nums[i])


    * nums[i] refers to the current number in the iteration; the 1st is 5, then 2,
    and so on.


    */


    runningResult = operation(runningResult, nums[i]);


    }


    return runningResult;


    }


    //notice the 3rd param passes the "add" function - you can pass a function into
    another function!


    var sum = combineAll(values, 0, add);


    //notice the 3rd param passes the "multiply" function - you can pass a function
    into another function!


    var product = combineAll(values, 1, multiply);


    alert("Sum: " + sum); //should be 12: 5+2+11+(-7)+1


    alert("Product: " + product); //should be -770: 5x2x11x-7x1


    You might be wondering what this function means -var sum = combineAll(values,
    0, add);.In the above example, the function add is being passed as parameter three
    ofcombineAll.  At this moment, we are not going to invoke add, merely pass a reference.
    Did you spot that the parentheses were not used after add? That should be a little
    tip that we are not invoking any function.


    The code line that will invoke add reads:


    runningResult = operation(runningResult, nums[i]);


    A reference to add the operation parameter was received by this and, when the
    operation is invoked, you will see that add is being called and it returns the
    value of both of the sums that were passed to it.


    This is a vital technique and we often call the  combineAll function to reduce.
    Take some time to look over the code and run it until you are comfortable with
    it. We are going to be using this in the following chapters so you need to understand
    it.


    Anonymous Functions


    Looking back at the example we used before, the add and multiply functions were
    only referred to on one occasion, in the call tocombineAll. If you were to stick
    with that pattern, you would need to make a new function for every new combination
    desire that you wanted, for example, concatenation, just so you could pass it
    to combineAll. Doesn’t that seem like rather a complicated way of doing something
    that is actually quite simple?


    You will be pleased to learn that you don’t have to declare each function. In
    fact, you don’t even need to come up with any names for them. In JavaScript, we
    can create functions on the fly, whenever you need one that is only going to be
    used in that one location. Even better, the syntax used is quite simple:


    function (arg1, arg2) {


    //function statements here


    }


    Because these functions are not named, we call them anonymous functions.


    Let’s go back to a previous example and use these anonymous functions to take
    the place of the single-use functions:


    Example:


    var values = [5, 2, 11, -7, 1];


    function combineAll(nums, initialValue, operation) {


    var runningResult = initialValue;


    for (var i=0; i < nums.length; i++) {


    runningResult = operation(runningResult, nums[i]);


    }


    return runningResult;


    }


    var sum = combineAll(values, 0, function (a, b) {


    return a+b;


    });


    var product = combineAll(values, 1, function (a, b) {


    return a*b;


    });


    var list = combineAll(values, 1, function (a, b) {


    return a + ", " + b;


    });


    alert("Sum: " + sum);


    alert("Product: " + product);


    alert("Number List: " + list);


    There are three anonymous functions in here; the first and second ones replace
    where the add and multiply functions used to be defined and the third is used
    as a way of concatenating integers into a list, each separated by a comma.


    # Chapter 5:


    Nested Functions


    As JavaScript functions are another type of JavaScript object, we are able to
    make a function that is inside another function. We call these nested functions,
    sometimes known as inner functions. Have a look at the example that shows you
    how to create one function and then use it inside another function:


    Example:


    var values = [5, 2, 11, -7, 1];


    function combineAll(nums, initialValue, operator) {


    var runningResult = initialValue;


    for (var i=0; i < nums.length; i++) {


    runningResult = calculate(nums[i]);


    }


    return runningResult;


    function calculate(num) {


    switch (operator.toLowerCase()) {


    case "+" :


    return runningResult + num;


    case "x" :


    return runningResult * num;


    case "*" :


    return runningResult * num;


    case "a" :


    return runningResult + ", " + num;


    }


    }


    }


    var sum = combineAll(values, 0, "+");


    var product = combineAll(values, 1, "x");


    var list = combineAll(values, 1, "a");


    alert("Sum: " + sum);


    alert("Product: " + product);


    alert("Number List: " + list);


    You are going to see more of these but, for now, take note of the way in whichcalculate() accesses
    both operator andrunningResult, both of which have been scoped to the function,
     combineAll().


    # Chapter 6:


    Variable Scope'
