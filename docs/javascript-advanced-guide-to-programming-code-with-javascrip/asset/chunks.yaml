    # Bonus Chapter: Working with AJAX


    AJAX stands for Asynchronous JavaScript and XML and it is a group of technologies,
    such as `DOM`, `JavaScript`, `HTML`, `XML` and `CSS`, that are all inter-related.
    AJAX lets you send data and receive it asynchronously without having to reload
    your web page, making it incredibly fast.


    AJAX also allows you to send only the most important information to the web server
    and not the whole page so only the valuable data will be routed over to the client
    side. This makes any application you build and use a good deal faster and more
    interactive. AJAX is used on a very large number of web applications, including
    Facebook, Gmail, Google Maps, Twitter, and too many more to mention.


    ## How Does AJAX Work?


    When you use the traditional `JavaScript` code and you want to get some information
    out of a server file or a database, or if you wanted to send some information
    over to a server, you would make an `HTML` form and you would use `POST` or `GET`
    to send or receive data to and from a data. End users would need to click a button
    that says `SUBMIT` to send or get the answer; they would then have to wait while
    the server responded and then a new page would load up with their results.


    Each time input is submitted by a user, a new page is returned by the server and,
    because of this, some web applications run quite slowly and are not always very
    user-friendly. When you use AJAX, `JavaScript` will talk straight to the server
    via the JavaScript object `XMLHttpRequest`.


    By using an `HTTP` request, web pages can request and receive a response form
    web servers without the need to reload the page. The users stay on the same page
    and will not have a clue that there are scripts sending requests for pages or
    sending data to a server as this will be working away in the background.


    The user will send a request that will, in turn, execute an action. The response
    to this action will be shown into a layer, identified via an `ID` and all without
    the page having to go through a full reload. This is an example of a page ID:


    ```html

    <div id="ajaxResponse"></div>

    ```


    Next, we are going to look briefly at how to create the `XMLHttpRequest` object
    and get responses from the server:


    ### Step 1: Create the objectXMLHttpRequest.


    Every different browser will use a different method to create this object; Internet
    Explorer makes use of `ActiveXObject` while some of the other browsers use `XMLHttpRequest`,
    which is, of course, the built-in object in `JavaScript`.


    To create the object and to deal with all the different browsers, we are going
    to make use of a statement called “catch and try”


    ```javascript

    function ajaxFunction()

    {

    var xmlHttp;

    try

    {

    // Firefox, Opera 8.0+, Safari

    xmlHttp=new XMLHttpRequest();

    }

    catch (e)

    {

    // Internet Explorer

    try

    {

    xmlHttp=new ActiveXObject("Msxml2.XMLHTTP");

    }

    catch (e)

    {

    try

    {

    xmlHttp=new ActiveXObject("Microsoft.XMLHTTP");

    }

    catch (e)

    {

