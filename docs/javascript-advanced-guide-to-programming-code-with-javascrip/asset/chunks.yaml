    \ 运算符作为删除对象属性和数组元素的方法。请明确这一点——删除与将值设置为 `null` 不同。删除会移除元素或属性，使其变为 `undefined`，而将值设置为\
    \ `null` 则会保留元素或对象，同时将其值设为 `null`。看这个示例作为说明：\n\n示例：\n\n```html\n<!DOCTYPE HTML>\n\
