    \n## 目录\n\n- 引言\n- 第一章：可选函数参数\n- 第 2 章：真值与假值\n- 第 3 章：默认运算符\n- 第 4 章：作为参数传递的函数\n\
    - 第 5 章：嵌套函数\n- 第 6 章：变量作用域\n- 第 7 章：观察与捕获事件\n- 第 8 章：错误处理\n- 第 9 章：“delete”运算符\n\
