    One piece of good advice for any programmer is to handle an error on the spot
    only if you are 100% certain you know what it is and that you know exactly how
    to fix it, rather than suppressing it. To target the handling code better, it
    can be changed just to handle errors that are called TypeError – this is the name
    of the error that has been identified for the bug:


    Example:


    window.onerror = function (message, url, lineNo) {


    alert(


    ''Error: '' + message +


    ''\n Url: '' + url +


    ''\n Line Number: '' + lineNo);


    return true;


    }


    function getInput() {


    try {


    var name = window.prompt(''Type your name'');


    alert(''Your name has '' + name.length + '' letters.'');


    } catch (error) {


    if (error.name == ''TypeError'') {


    alert(''Please try again.'');


    getInput();


    } else{


    throw error;


    }


    } finally {


    //do cleanup


    }


    }


    getInput();


    If a different error were to occur, not likely in this simple example, it would
    not be handled. The throw statement will send the error on just as though we hadn’t
    used try…catch…finally block. The error will appear later on down the line.


    Throwing Custom Errors


    Th throw statement can be used to throw up custom errors and there is only one
    recommendation here – the error object must have name and message properties that
    are consistent with the built-in handling method. Look at this example:


    throw {


    name: ''InvalidColorError'',


    message: ''The given color is not a valid color value.''


    };


    # Chapter 9:


    ‘delete’ Operator


    We use the ‘delete’ operator as way of deleting object properties and array elements.
    Be very clear on this – deleting is not the same as setting a value to null. Deleting
    removes the element or property, making it undefined, while setting as value as
    null will retain the element or object while setting it a value of null. Have
    a look at this example as an illustration:


    Example:


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta charset="UTF-8">


    <script type="text/javascript">


    var colors = [];


    colors["red"] = "#f00";


    colors["green"] = "#060";


    colors["blue"] = "#00f";


    colors["yellow"] = "#ff0";


    colors["orange"] = "#0ff";


    function deleteItem() {


    delete colors["blue"];


    showArray();


    revealArray();


    }


    function setToNull() {


    colors["blue"] = null;


    showArray();


    revealArray();


    }


    function showArray() {


    var output = document.getElementById("colors");


    var strOutput = "<ol>";


    for (var i in colors) {


    strOutput += "<li style=''color:" + colors[i] + ";''>" + i + "</li>";


    }


    strOutput += "</ol>";


    output.innerHTML=strOutput;


    }


    function revealArray() {


    var colorsCode = document.getElementById("colors-code");


    var strOutput = "&lt;ol&gt;";


    for (var i in colors) {


    strOutput+="\n\t&lt;li style=''color:" + colors[i] + ";''&gt;" + i + "&lt;/li&gt;";


    }


    strOutput += "\n&lt;/ol&gt;";


    colorsCode.innerHTML=strOutput;


    }


    </script>


    <title>Delete vs. Setting to NULL</title>


    </head>


    <body onload="showArray();revealArray();">


    <button id="set-to-null" onclick="setToNull();">Set Blue to Null</button>


    <button id="del" onclick="deleteItem();">Delete Blue</button>


    <output id="colors"></output>


    <pre id="colors-code"></pre>


    </body>


    </html>


    Forget about the functions showArray() and revealArray() for now. Do note however
    that when the button for Set Blue to Null is clicked, the array element will stay
    put but will be an invalid color of null. When Delete Blue button is clicked,
    the array element will be deleted.


    Regular Expressions


    This is a quick introduction to the next few chapters, where we go over regular
    expressions. These are used for pattern matching and this can be very helpful
    when it comes to form validation. For example, you can use a regular expression
    to check that an email address that has been input into a form filed is correct
    in terms of syntax. You can create regular expressions in two ways in JavaScript:


    Literal Syntax:


    var reExample = /pattern/;


    RegExp() Constructor


    var reExample = new RegExp("pattern");


    If you already know the pattern you are going to use, there isn’t any real difference
    between these. However, if you don’t know which patter you are going to use, the
    easiest one is theRegExp() constructor.


    # Chapter 10:


    Regular Expressions – Methods


    The JavaScript regular expression method contains two main methods for string
    testing:  test() and exec().


    Theexec() Method


    This method takes an argument and a string and checks to see if there are one
    or more matches in the string to a pattern that is specified in the regular expressions.
    If the matches are found, a result array is returned by the method showing the
    starting point of each match. If there are no matches, null is returned.


    Thetest() Method


    This method will also take a string and an argument and check the string for pattern
    matches. If there is a match, true will be returned; if not, false is returned.
    This is incredibly useful in form validations scripts.


    The following example show how to use this to test a social security number. Ignore
    the regular expression syntax for now, we will be looking at that in the next
    chapter:


    Example:


    RegularExpressions/Demos/SsnChecker.html


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta charset="UTF-8">


    <title>ssn Checker</title>


    <script type="text/javascript">


    var reSSN = /^[0-9]{3}[\- ]?[0-9]{2}[\- ]?[0-9]{4}$/;


    function checkSsn(ssn){


    if (reSSN.test(ssn)) {


    alert("VALID SSN");


    } else {


    alert("INVALID SSN");


    }


    }


    </script>


    </head>


    <body>


    <form onsubmit="return false;">


    <input type="text" name="ssn" size="20">


    <input type="button" value="Check"


    onclick="checkSsn(this.form.ssn.value);">


    </form>


    </body>


    </html>


    Let’s take a closer look at the code.


    First, we have declared a variable that contains a regular expression object relating
    to a social security number


    Second, we have created a function calledcheckSsn(). This function takes an argument,
    ssn, which is also a string, and passes it to the regular expression to see if
    there is a match. For this, thetest() method is used. If there is a match, the
    function will alert “VALID SSN”. If there is no match, “INVALID SSN” is alerted
    instead.


    Lastly, a form inserted in the page body provides a field for a user to input
    a social security number along with a button that will pass the number to thecheckSsn() function.


    Flags


    If a flag appears after the end slash it will modify the way the regular expression
    works. The i flag will turn the case of a regular expression insensitive. For
    example, /aeiou/i will match both uppercase and lowercase vowels.


    The g flag will specify a global match and that means that all matches of the
    pattern that has been specified are to be returned.


    String Methods


    A number of String methods will take a regular expression as an argument:


    Thesearch() Method


    This method will take just one argument – a regular expression. The return is
    the index of the initial character of the substring that matches the regular expression.
    If there is no match, -1 is returned.


    Thesplit()  Method


    This method also take a regular expression and uses it as a delimiter to split
    one string into an array.


    Thereplace() Method


    This method will take two arguments – the regular expression and the string. The
    first regular expression match is replaced with the string and, if the g flag
    is used in the expression, all string matches will be replaced.


    Thematch() Method


    The match() method takes the regular expression as an argument and returns each
    of the substrings that are a match to the pattern of the regular expression.


    # Chapter 11:


    Regular Expressions – Syntax


    Regular expressions are patterns that are used to specify a list of characters.
    In this chapter, we are going to look the syntax used to specify the characters:


