    \ but it may not be the one you wanted. Here is a quick example:\n\n- In this\
    \ example, `typeof x` will be a number\n```javascript\nvar x = 5+ 7; // x.valueOf()\
    \ will be 12\n```\n- In this next example, the `typeof x` will be a string\n```javascript\n\
    var x = 5+ \"7\"; // x.valueOf() will be 57\n```\n\nIn a different case, you could\
    \ try to use your function to subtract one string from another string. In this\
    \ case, it will return as `NaN`.\n\nUse this example:\n\n```javascript\n\"Goodbye\"\
    \ – \"Love\" // This will return as NaN\n```\n\n## 6. DO use \"Timer\" to Optimize\
    \ Code\n\nThis practice is super simple. Are there ever times that you need a\
    \ quick way to determine exactly how long your operation will take? Luckily, Firebug\
    \ has a \"timer\" feature that will log the results for you! Sometimes it helps\
    \ to have some tricks on the side to help your coding along.\n\nHere is the code\
    \ for that:\n\n```javascript\nfunction TimeTracker () {\n  console.time (\"MyTimer\"\
    );\n  for (x=4000; x > 0; x--) {}\n  console.timeEnd (\"MyTimer\");\n}\n```\n\n\
    ## 7. DO NOT Pass String to \"SetTimeOut\" or \"SetInterval\"\n\nRemember when\
    \ we told you not to use the `eval` function? This code will function the same\
    \ way. This is why we suggest never passing the string to `SetTimeOut` or `SetInterval`.\
    \ Unfortunately, this code is super inefficient.\n\nInstead of this code:\n\n\
    ```javascript\nsetInterval (\n  \"document.getElementById('container').innerHTML\
    \ _+= 'The New Number: ' + I\" , 2000\n);\n```\n\nUse this one:\n\n```javascript\n\
    setInterval(someFunction, 2000);\n```\n\n## 8. DO use \"For in\" Statements\n\n\
    Sometimes when you loop items in an object, you may have noticed that at the same\
    \ time, you retrieve the method functions as well. If you do not want this to\
    \ happen, there is a way you can wrap your code as an `if` statement. This way,\
    \ it will filter your information.\n\nHere is an example:\n\n```javascript\nfor\
    \ (key in object) {\n  if(object. hasOwnProperty(key)) {\n    //…do something…\n\
    \  }\n}\n```\n\n## 9. DO NOT use \"With\" Statements\n\nNow, this coding tip is\
    \ up for debate. On the one hand, `with` statements truly sound like a good idea\
    \ to use. In retrospect, a `with` statement should be able to be used as a shorthand\
    \ to access any objects that could be deeply nested in your code.\n\nHere is an\
    \ example:\n\n```javascript\nwith (person.woman.bodyparts) {\n  hand = true;\n\
    \  foot= true;\n}\n```\n\n- As we noted, you would use these statements instead:\n\
    `person.woman.bodyparts.hand= true;`\n`person.woman.bodyparts.foot= true;`\n\n\
    After some tests, it was found that these codes behaved badly, especially when\
    \ setting up new members. Instead of using `with` you can use `var` and get the\
    \ proper results.\n\n[Click here to check out the rest of 'JavaScript: Best Practices'\
    \ on Amazon.](http://a.co/d75md5p)\n\n### About the Author\n\nCharlie Masterson\
    \ is a computer programmer and instructor who have developed several applications\
    \ and computer programs.\n\nAs a computer science student, he got interested in\
    \ programming early but got frustrated learning the highly complex subject matter.\n\
    \nCharlie wanted a teaching method that he could easily learn from and develop\
    \ his programming skills. He soon discovered a teaching series that made him learn\
    \ faster and better.\n\nApplying the same approach, Charlie successfully learned\
    \ different programming languages and is now teaching the subject matter through\
    \ writing books.\n\nWith the books that he writes on computer programming, he\
    \ hopes to provide great value and help readers interested to learn computer-related\
    \ topics.\n"
  raw: 'Of course, it would be next to impossible to cover every trick to help you
    learn the best practices for JavaScript. Instead, we want to focus on the main
    attributes you will come across as you learn to code. In the chapter to follow,
    we will provide you with some of the simpler best practices to get you on the
    right path. Remember that there is always more information to learn about coding.


    This is just an excellent start!


    DO NOT declare Boolean Objects, Strings, or Numbers


    DO Initialize Any Variables


    DO NOT use newObject ()


    DO use Parameter Defaults


    DO NOT use Automatic Type Conversions


    DO use "Timer" to Optimize Code


    DO NOT Pass String to "SetTimeOut" or "SetInterval"


    DO use "For in" Statements


    DO NOT use "With" Statements


    1.DO NOT declare Boolean Objects, Strings, or Numbers


    While you are coding, it is very important that you treat your Booleans, strings,
    and numbers as primitive values. You will not want to see these as objects. If
    you define any of these codes as objects, it could produce bad side effects and
    will just slow down the speed of your execution.


    Here is a quick example:


    var x= "Joe";


    var y= new String ("Joe");


    (x ===y)


    •As you can see, this will be false due to the fact that x is a string while y
    is an object. It will throw an error, and this is something you can avoid!


    2.DO Initialize Any Variables


    Whether you are learning code, or are just looking to fix your skills, it is great
    practice to initialize your variables as you declare them. When you do this, it
    will help avoid undefined values, it will provide you with a single place to do
    this, and it will help give you a cleaner code.


    3.DO NOT use newObject()


    While this is something we touched on a bit earlier, it is important to remember.
    Here is a quick cheat sheet to help you remember which code to use compared to
    its similar code. By being organized, you can keep your code clean.


    •DO USE: {} DO NOT USE: new Object()


    •DO USE 0 DO NOT USE new Number()


    •DO USE " " DO NOT USE new String()


    •DO USE false DO NOT USE new Boolean()


    •DO USE function () {} DO NOT USE new Function()


    •DO USE /()/ DO NOT USE new RegExp()


    •DO USE [] DO NOT USE new Array()


    4.DO use Parameter Defaults


    We invite you to ask a moment to ask yourself, what do I remember about functions?
    What do you call it when your function is missing an argument? That''s right!
    The value of that missing argument will be called undefined. If you weren''t already
    aware, these undefined values can and will break your code. To break this habit,
    try your best to assign values to your arguments automatically.


    Here is an example:


    function myFunction (x, y) {


    if ( x === undefined) {


    x= 1;


      }


    }


    5.DO NOT use Automatic Type Conversions


    While you are coding, you will want to be aware of the numbers that could be converted
    to NaN or strings. If you need a refresher, NaN stands for Not a Number. This
    is something that can happen automatically due to the fact that JavaScript is
    typed loosely. The variables in your code can change the data type as well as
    contain a few different types of data.


    Here is a quick example:


    var x = "Hey";


    •In this case, x is a string but if you were to continue;


    x= 4;


    •Then, this changes your x to a number. You can see where this could cause errors
    in your code.


    You also should be aware that your JavaScript will convert numbers into strings
    if you are doing mathematical problems. If you type it the wrong way, it will
    give you an answer, but it may not be the one you wanted. Here is a quick example:


    •In this example, typeof x will be a number


    var x = 5+ 7;  // x.valueOf() will be 12


    •In this next example, the typeof x will be a string


    var x = 5+ "7"; // x.valueOf() will be 57


    In a different case, you could try to use your function to subtract one string
    from another string. In this case, it will return as NaN.


    Use this example:


    •"Goodbye" – "Love" // This will return as NaN


    6.DO use "Timer" to Optimize Code


    This practice is super simple. Are there ever times that you need a quick way
    to determine exactly how long your operation will take? Luckily, Firebug has a
    "timer" feature that will log the results for you! Sometimes it helps to have
    some tricks on the side to help your coding along.


    Here is the code for that:


    function TimeTracker () {


       console.time ("MyTimer");


        for (x=4000; x > 0; x--) {}


       console.timeEnd ("MyTimer");


    }


    7.DO NOT Pass String to "SetTimeOut" or "SetInterval"


    Remember when we told you not to use the "eval" function? This code will function
    the same way. This is why we suggest never passing the string to SetTimeOut or
    SetInterval. Unfortunately, this code is super inefficient.


    Instead of this code:


    setInterval (


    "document.getElementById(''container'').innerHTML _+= ''The New Number: '' + I"
    , 2000


    );


    Use this one:


    setInterval(someFunction, 2000);


    8.DO use "For in" Statements


    Sometimes when you loop items in an object, you may have noticed that at the same
    time, you retrieve the method functions as well. If you do not want this to happen,
    there is a way you can wrap your code as an if statement. This way, it will filter
    your information.


    Here is an example:


    for (key in object) {


    if(object. hasOwnProperty(key)) {


    //…do something…


        }


    }


    9.DO NOT use "With" Statements


    Now, this coding tip is up for debate. On the one hand, "with" statements truly
    sound like a good idea to use. In retrospect, a "with" statement should be able
    to be used as a shorthand to access any objects that could be deeply nested in
    your code.


    Here is an example:


    with (person.woman.bodyparts) {


    hand = true;


    foot= true;


    }


    •As we noted, you would use these statements instead:


    person.woman.bodyparts.hand= true;


    person.woman.bodyparts.foot= true;


    After some tests, it was found that these codes behaved badly, especially when
    setting up new members. Instead of using "with" you can use "var" and get the
    proper results.


    [Click here to check out the rest of ''JavaScript: Best Practices'' on Amazon.](http://a.co/d75md5p)


    About the Author


    Charlie Masterson is a computer programmer and instructor who have developed several
    applications and computer programs.


    As a computer science student, he got interested in programming early but got
    frustrated learning the highly complex subject matter.


    Charlie wanted a teaching method that he could easily learn from and develop his
    programming skills. He soon discovered a teaching series that made him learn faster
    and better.


    Applying the same approach, Charlie successfully learned different programming
    languages and is now teaching the subject matter through writing books.


    With the books that he writes on computer programming, he hopes to provide great
    value and help readers interested to learn computer-related topics.'
