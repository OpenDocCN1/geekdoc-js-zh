  trans: "\n\n* 如果正则表达式的开头有一个脱字符（`^`），它表示正在搜索的字符串必须以此模式开头。\n* 你在 `“food”` 中可以找到模式\
    \ `^`，但在 `“barfood”` 中找不到。\n* 如果正则表达式的末尾有一个美元符号（`$ `），它表示正在搜索的字符串必须以此模式结尾。\n*\
    \ 你在 `“curfoo”` 中可以找到模式 `foo$`，但在 `“food”` 中找不到。\n\n# 出现次数 (`?` `*` `{}`)\n\n\
    这些符号会影响前一个字符（或如果你使用括号，一组字符）出现的次数：`?`、`*`、`+`、`}`}`\n\n* 问号 (`?`）表示前面的字符在模式中出现\
    \ 0 次或 1 次。\n* 你在 `“fod”` 和 `“food”` 中可以找到模式 `foo?`，但在 `“faod”` 中没有。\n* 加号 (`+`）表示前面的字符在模式中至少出现一次。\n\
    * 你在 `“food”`、`“fod”` 和 `“foood”` 中可以找到模式 `fo+`，但在 `“fd”` 中找不到。\n* 星号 (`*`）表示前面的字符在模式中至少出现\
    \ 0 次。\n* 你在 `“fd”`、`“food”` 和 `“fod”` 中可以找到模式 `fo*d`。\n* 大括号 (`{}`）带有一个单个参数 `{n}`\
    \ 时，表示前面的字符在模式中恰好出现 `n` 次。\n* 你在 `“foood”` 中可以找到模式 `fo{3}d`，但在 `“fooood”` 或 `“food”`\
    \ 中找不到。\n* 带有两个参数的大括号 `{n1, n2}` 表示前面的字符在模式中出现的次数在 `n1` 到 `n2` 之间。\n* 你在 `“fooood”`、`“foood”`\
    \ 和 `“food”` 中可以找到模式 `fo{2,4}`，但在 `“foooood”` 中找不到。\n* 带有一个参数且第二个为空的大括号 `{n}`\
    \ 表示前面的字符在模式中至少出现 `n` 次。\n* 你在 `“foooood”` 和 `“food”` 中可以找到模式 `fo{2}`，但在 `“fod”`\
    \ 中找不到。\n\n* 普通字符 (`.` `\\d` `\\D` `\\w` `\\W` `\\s` `\\S`)\n\n* 点（`.`）代表换行符以外的任何字符。\n\
    * 你在 `“foad”`、`“food”`、`“fo*f”` 和 `“fo9d”` 中可以找到模式 `fo.d`。\n* 反斜杠 d (`\\d`）代表任何数字，等于\
    \ `[0-9]`。\n* 你在 `“fo1d”`、`“fo0d”`、`“fo4d”` 中可以找到模式 `fo\\dd`，但在 `“fodd”` 或 `“food”`\
    \ 中找不到。\n* 反斜杠 D (`\\D`）代表任何数字的字符，等于 `[⁰-9]`。\n* 你在 `“foad”` 和 `“food”` 中可以找到模式\
    \ `fo\\D`，但在 `“fo4d”` 中找不到。\n* 反斜杠 w (`\\w`）代表任何单词字符，如数字、字母和下划线 (`_`）。\n* 你在 `“fo_d”`、`“food”`\
    \ 和 `“fo4d”` 中可以找到模式 `fo\\w`，但在 `“fo*d”` 中找不到。\n* 反斜杠 W (`\\W`）代表任何不是单词字符的字符。\n\
    * 你可以在 `“fo&d”`、`“fo*d”` 和 `“fo.d”` 中找到模式 `fo\\Wd`，但在 `“fo d”` 中找不到。\n* 反斜杠 s\
    \ (`\\s`）代表任何空白字符，如制表符、空格、换行符等。\n* 你在 `“fo d”` 中可以找到模式 `fo\\sd`，但在 `“food)” 中找不到。\n\
    * 反斜杠 S (`\\S`）代表除空白以外的任何字符。\n* 你可以在 `“food”`、`“fo*d”` 和 `“fo4d”` 中找到模式 `fo\\\
    Sd`，但在 `“fo d”` 中找不到。\n\n# 分组 (`[]`)\n\n我们使用方括号 (`[]`）作为将选项分组的方法：\n\n* 你在 `“fed”`\
    \ 和 `“fad”` 中可以找到模式 `f[aeiou]`，但在 `“food\"`、`“faed\"` 或 `“fd”` 中找不到。\n* 模式 `[aeiou]`\
    \ 将匹配 `\"a\"`、`\"e\"`、`\"i\"`、`\"o\"` 或 `\"u\"`。\n* 你在 `\"faed\"` 和 `\"feod\"\
    ` 中可以找到模式 `f[aeiou]{2}d`，但在 `\"fod\"`、`\"fed\"` 或 `\"fd\"` 中找不到。\n* 你在 `\"Webucator,\
    \ Inc.\"` 中可以找到模式 `[A-Za-z]+`，但在 `\"13078\"` 中找不到。\n* 模式 `[A-Za-z]` 将匹配任何字母，无论其是大写还是小写。\n\
    * 模式 `[A-Z]` 将匹配任何大写字母。\n* 模式 `[a-z]` 将匹配任何小写字母。\n\n# 否定 (`^`)\n\n当脱字符 (`^`) 用于方括号内部且作为第一个字符时，它表示否定。\n\
    \n* 你在 `\"fqd\"` 和 `\"f4d\"` 中可以找到模式 `f[^aeiou]d`，但在其他地方找不到。\n\n# 子模式 (`()`)\n\
    \n我们使用括号 (`()`) 来捕获子模式。\n\n* 你在 `\"food\"` 和 `\"foob\"` 中可以找到模式 `f(oo)d`。\n\n\
    # 备选项 (`|`)\n\n我们使用管道符号 (`|`) 作为创建备选项的方法。\n\n* 你在 `\"foo\"` 和 `\"bar\"` 中可以找到模式\
    \ `foo|bar`。\n\n# 转义字符 (`\\`)\n\n我们使用反斜杠 (`\\`) 作为转义特殊字符的方法。\n\n* 模式 `\\.` 匹配字面点。\n\
    \n# 第 12 章：正则表达式 – 表单验证\n\n当你使用正则表达式时，你可以创建一些强大的验证函数。让我们来看这个例子：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Login</title>\n<script>\n\
    function validate(form){\n    var email = form.Email.value;\n    var password\
    \ = form.Password.value;\n    var errors = [];\n\n    var reEmail = /^(\\w+\\\
    .)*\\w+@(\\w+\\.)+[A-Za-z]+$/;\n    var rePassword = /^[A-Za-z\\d]{6,8}$/;\n\n\
    \    if (!reEmail.test(email)){\n        errors.push(\"You must enter a valid\
    \ email address.\");\n    }\n    if (!rePassword.test(password)){\n        errors.push(\"\
    Password must be between 6 and 8 characters and can only contain letters and digits.\"\
    );\n    }}\n\n    if (errors.length > 0){\n        var msg = \"There were some\
    \ problems:\\n\";\n        for (var i = 0; i<errors.length; i++){\n          \
    \  msg += \"\\n\" + (i + 1) + \". \" + errors[i];\n        }\n        alert(msg);\n\
    \        return false;\n    }\n    return true;\n}\n</script>\n</head>\n<body>\n\
    \n<h1>Login</h1>\n<form method=\"post\" action=\"Process.html\" onsubmit=\"return\
    \ validate(this);\">\nEmail: <input type=\"text\" name=\"Email\" size=\"25\"><br/>\n\
    Password: <input type=\"password\" name=\"Password\" size=\"10\"><br/>\n<input\
    \ type=\"submit\" value=\"Submit\">\n<input type=\"reset\" value=\"Reset Form\"\
    >\n</form>\n</body>\n</html>\n```\n"
- fmt: "\n- Open `RegularExpressions/Exercises/FormValidation.js` in your editor.\n\
    \nNow write the correct regular expressions (additional ones) that will check\
    \ for:\n\n1. The proper name\n   - That it begins with a capital letter\n   -\
    \ That it is followed by at least one letter or apostrophe\n   - It may be more\
    \ than one word, for example, “New Mexico”\n2. Initial\n   - That it has either\
    \ 0 or 1 capital letter\n3. State\n   - That it has two capital letters\n4. US\
    \ Postal Code\n   - That it is made up of five digits\n   - May be followed with\
    \ a dash and a further four digits\n5. Username\n   - That it is no less than\
    \ 6 and no more than 15 digits or letters\n\n## Second Exercise\n\n- Open `RegularExpressions/Exercises/Register.html`\
    \ in your editor.\n\nAdd the correct validation for checking these fields:\n-\
    \ first name\n- middle initial\n- last name\n- city\n- state\n- zip\n- username\n\
    \nTest out your solution in your browser\n\n## A Challenge\n\nAdd in the correct\
    \ regular expressions to test United Kingdom and Canadian postcodes:\n- United\
    \ Kingdom postcodes are two letters, one or two numbers, a whitespace, one number\
    \ and two letters – for example WC12 3XY\n- Canadian postcodes are one letter,\
    \ one digit, one letter, a white pace, one digit, one letter and one digit – for\
    \ example, M1A 2B3\n\nNext make a modification to `Register.html` to check a postcode\
    \ against these regular expressions as well as that of the US postcode.\n\n###\
    \ Solution: `RegularExpressions/Solutions/FormValidation.js`\n\n```javascript\n\
    //Regular Expressions\nvar reEmail = /^(\\w+[\\-\\.])*\\w+@(\\w+\\.)+[A-Za-z]+$/;\n\
    var rePassword = /^[A-Za-z\\d]{6,8}$/;\nvar reProperName = /^([A-Z][A-Za-z']+\
    \ )*[A-Z][A-Za-z']+$/;\nvar reInitial = /^[A-Z]$/;\nvar reState = /^[A-Z]{2}$/;\n\
    var rePostalUS = /^\\d{5}(\\-\\d{4})?$/;\nvar reUsername = /^[A-Za-z\\d]{6,15}$/;\n\
    ```\n\n### Solution: `Register.html`\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
    <meta charset=\"UTF-8\">\n<title>Registration Form</title>\n<script type=\"text/javascript\"\
    \ src=\"FormValidation.js\"></script>\n<script type=\"text/javascript\">\nfunction\
    \ validate(form){\nvar firstName = form.FirstName.value;\nvar midInitial = form.MidInit.value;\n\
    var lastName = form.LastName.value;\nvar city = form.City.value;\nvar state =\
    \ form.State.value;\nvar zipCode = form.Zip.value;\nvar email = form.Email.value;\n\
    var userName = form.Username.value;\nvar password1 = form.Password1.value;\nvar\
    \ password2 = form.Password2.value;\nvar errors = [];\n\nif (!reProperName.test(firstName))\
    \ {\nerrors[errors.length] = \"You must enter a valid first name.\";\n}\nif (!reInitial.test(midInitial))\
    \ {\nerrors[errors.length] = \"You must enter a one-letter middle initial.\";\n\
    }\nif (!reProperName.test(lastName)) {\nerrors[errors.length] = \"You must enter\
    \ a valid last name.\";\n}\nif (!reProperName.test(city)) {\nerrors[errors.length]\
    \ = \"You must enter a valid city.\";\n}\nif (!reState.test(state)) {\nerrors[errors.length]\
    \ = \"You must enter a valid state.\";\n}\nif (!rePostalUS.test(zipCode)) {\n\
    errors[errors.length] = \"You must enter a valid zip code.\";\n}\nif (!reUsername.test(userName))\
    \ {\nerrors[errors.length] = \"You must enter a valid username.\";\n}\nreturn\
    \ true;\n}\n</script>\n```\n\n### Challenge Solution: `RegularExpressions/Solutions/FormValidation-challenge.js`\n\
    \n```javascript\n//Regular Expressions\nvar rePostalUS = /^\\d{5}(\\-\\d{4})?$/;\n\
    var rePostalCA = /^[A-Z]\\d[A-Z] \\d[A-Z]\\d$/;\nvar rePostalUK = /^[A-Z]{2}[0-9]{1,2}\
    \ ?[0-9]{1}[A-Z]{2}$/;\n```\n\n### Challenge Solution: `Register-challenge.html`\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Registration\
    \ Form</title>\n<script type=\"text/javascript\" src=\"FormValidation-challenge.js\"\
    ></script>\n<script type=\"text/javascript\">\nfunction validate(form){\nif (!rePostalUS.test(zipCode)\n\
    && !rePostalCA.test(zipCode)\n&& !rePostalUK.test(zipCode))\n{\nerrors[errors.length]\
    \ = \"You must enter a valid postal code.\";\n}\nreturn true;\n}\n</script>\n\
    ```\n\n# Chapter 13: Cleaning Up Form Entries\n\nSometimes it is nice to clean\
    \ user entries as soon as they are input and we can do this by using a combination\
    \ of the `replace()` method of string objects and regular expressions.\n\n## The\
    \ `replace()` Method Revisited\n\nWe already looked at this method and how to\
    \ use it to replace a regular expression match with a string but we can also use\
    \ it together with backreferences and replace a pattern that has been matched\
    \ with a brand-new string that is made from substrings of that pattern. The following\
    \ example shows you this:\n\n### Example:\n\n```html\n<!DOCTYPE HTML>\n<html>\n\
    <head>\n<meta charset=\"UTF-8\">\n<title>ssn Cleaner</title>\n<script type=\"\
    text/javascript\">\nvar reSSN = /^(\\d{3})[\\- ]?(\\d{2})[\\- ]?(\\d{4})$/;\n\
    function cleanSsn(ssn){\nif (reSSN.test(ssn)) {\nvar cleanedSsn = ssn.replace(reSSN,\
    \ \"$1-$2-$3\");\nreturn cleanedSsn;\n} else {\nalert(\"INVALID SSN\");\nreturn\
    \ ssn;\n}\n}\n</script>\n</head>\n<body>\n<form onsubmit=\"return false;\">\n\
    <input type=\"text\" name=\"ssn\" size=\"20\">\n<input type=\"button\" value=\"\
    Clean SSN\"\nonclick=\"this.form.ssn.value = cleanSsn(this.form.ssn.value);\"\
    >\n</form>\n</body>\n</html>\n```\n\nWe use the `cleanSsn()` function to clean\
    \ a social security number in this example. In `reSSN`, `/(\\d{3})[\\- ]?(\\d{2})[\\\
    - ]?(\\d{4})$`, the regular expression has three subexpressions: `(\\d{3})`, `(\\\
    d{2})`, and `(\\d{4})`. These can be referenced as `$1`, `$2`, and `$3`, respectively\
    \ in `replace()` method. `var cleanedSsn = ssn.replace(reSSN, \"$1-$2-$3\");`\
    \ shows this.\n\n## Cleaning Up Form Entries\n\n- Open `RegularExpressions/Exercises/PhoneCleaner.html`\
    \ in your editor.\n- This exercise should take you about 15 to 20 minutes.\n\n\
    ## A Challenge\n\nYou sometimes find a phone number is combination of numbers\
    \ and letters and some of these have an extra character. Your challenge is to\
    \ add a function named `convertPhone()` that:\n- Strip out every character that\
    \ is not a letter or number\n- Convert every letter to a number as per the following\
    \ list:\n  - `ABC` -> 2\n  - `DEF` -> 3\n  - `GHI` -> 4\n  - `JKL` -> 5\n  - `MNO`\
    \ -> 6\n  - `PQRS` -> 7\n  - `TUV` -> 8\n  - `WXYZ` -> 9\n- It must also pass\
    \ the initial string to the function and return the result\n\n### Solution: `PhoneCleaner.html`\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Phone\
    \ Cleaner</title>\n<script type=\"text/javascript\">\nvar rePhone = /^\\(?([2-9]\\\
    d\\d)\\)?[\\. ]?([2-9]\\d\\d)[\\. ]?(\\d{4})$/;\nfunction cleanPhone(phone){\n\
    if (rePhone.test(phone)) {\nvar cleanedPhone = phone.replace(rePhone, \"($1) $2-$3\"\
    );\nreturn cleanedPhone;\n} else {\nalert(\"INVALID PHONE\");\nreturn phone;\n\
    }\n}\n</script>\n</head>\n<body>\n<form onsubmit=\"return false;\">\n<input type=\"\
    text\" name=\"Phone\" size=\"20\">\n<input type=\"button\" value=\"Convert Phone\"\
    \nonclick=\"this.form.Phone.value = cleanPhone(this.form.Phone.value);\">\n</form>\n\
    </body>\n</html>\n```\n\n### Challenge Solution: `convertPhone.js`\n\n```javascript\n\
    function convertPhone(phone){\nvar convertedPhone;\nconvertedPhone = phone.replace(/[^A-Za-z\\\
    d]/g, \"\");\nconvertedPhone = convertedPhone.replace(/[ABC]/gi, \"2\");\nconvertedPhone\
