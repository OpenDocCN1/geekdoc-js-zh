    <button id=\"del\" onclick=\"deleteItem();\">Delete Blue</button>\n<output id=\"\
    colors\"></output>\n<pre id=\"colors-code\"></pre>\n</body>\n</html>\n```\n\n\
    现在先忘记 `showArray()` 和 `revealArray()` 函数。但请注意，当点击“Set Blue to Null”的按钮时，数组元素将留在原地，但它将是一个无效的颜色\
    \ `null`。当点击“Delete Blue”按钮时，数组元素将被删除。\n\n### 正则表达式\n\n这是对接下来几章的简单介绍，在这些章节中我们将介绍正则表达式。它们用于模式匹配，这在表单验证时非常有帮助。例如，你可以使用正则表达式来检查输入到表单字段的电子邮件地址在语法上是否正确。在\
    \ JavaScript 中，你有两种方式创建正则表达式：\n\n字面量语法：\n`var reExample = /pattern/;`\n\n`RegExp()`\
    \ 构造函数：\n`var reExample = new RegExp(\"pattern\");`\n\n如果你已经知道要使用的模式，这两者没有没有区别。但如果你不知道将使用哪种模式，最简单的方法是使用\
    \ `RegExp()` 构造函数。\n\n# 第 10 章：正则表达式 – 方法\n\nJavaScript 正则表达式包含两个主要的字符串测试方法：`test()`\
    \ 和 `exec()`。\n\n### `exec()` 方法\n\n该方法接收一个参数（字符串）并进行测试。如果找到了匹配项，将返回一个数组。如果没有匹配，则返回\
    \ `null`。\n\n### `test()` 方法\n\n该方法接收一个参数（字符串）并检查字符串中的匹配项。如果匹配，则返回 `true`；如果不匹配，则返回\
    \ `false`。这在表单验证中非常有用。\n\n示例：`RegularExpressions/SsnChecker.html`\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>ssn Checker</title>\n\
    <script type=\"text/javascript\">\nvar reSSN = /^[0-9]{3}-[0-9]{4}$/;\n\nfunction\
    \ checkSsn(ssn){\n  if (reSSN.test(ssn)) {\n    alert(\"VALID SSN\");\n  } else\
    \ {\n    alert(\"INVALID SSN\");\n  }\n}\n</script>\n</head>\n<body>\n<form onsubmit=\"\
    return false;\">\n<input type=\"text\" name=\"ssn\" size=\"20\">\n<input type=\"\
    button\" value=\"Check\" onclick=\"checkSsn(this.form.ssn.value);\">\n</form>\n\
    </body>\n</html>\n```\n\n看一下代码。首先，我们定义了一个包含正则表达式的变量。其次，我们创建了一个函数 `checkSsn()`。该函数接收参数\
    \ `ssn` 并将其传递给正则表达式以检查是否存在匹配。这里使用了 `test()` 方法。如果匹配，函数将弹出“VALID SSN”。如果没有匹配，则弹出“INVALID\
    \ SSN”。最后，页面上的表单提供了一个输入社会安全号码的字段，以及一个将该号码传递给函数的按钮。\n\n### 标志\n\n如果标志出现在斜杠后面，它将修改正则表达式的作用。`i`\
    \ 标志将使正则表达式不区分大小写。例如，`/aeiou/i` 会匹配大写和小写的元音。\n\n`g` 标志指定全局匹配，这意味着将返回所有模式匹配项。\n\
    \n### 字符串方法\n\n许多字符串方法接受正则表达式作为参数：\n\n`search()` 方法\n该方法仅接受一个参数——正则表达式。返回匹配正则表达式的子字符串起始索引。如果没有匹配，则返回\
    \ `-1`。\n\n`split()` 方法\n该方法也接受正则表达式并将其作为分隔符将一个字符串拆分为数组。\n\n`replace()` 方法\n该方法接收两个参数——正则表达式和字符串。第一个正则表达式匹配项将被替换为字符串，如果表达式使用了\
    \ `g` 标志，所有字符串匹配项都将被替换。\n\n`match()` 方法\n`match()` 方法接收正则表达式作为参数并返回每个与正则表达式模式匹配的子字符串。\n\
    \n# 第 11 章：正则表达式 – 语法\n\n正则表达式是用于指定字符列表的模式。在本章中，我们将查看用于指定字符的语法：\n\n起始和结束 ( `^$`\
    \ )\n"
