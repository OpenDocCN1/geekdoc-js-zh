    *   The curly brackets ({}), with a single parameter {n} is an indicator that
    the preceding character must appear in the pattern exactly n times


    *   You will find pattern fo{3}d in “foood” but you won’t find it in “fooood”
    or in “food”


    *   The curly brackets with two parameters {n1, n2} is an indicator that the previous
    character should appear in the pattern between n1 and n2 times


    *   You will find pattern fo{2,4} in “fooood”, “foood” and in “food” but you won’t
    find it in “foooood”


    *   Curly brackets that have one parameter with a second empty one {n} is an indicator
    that the previous character must appear in the pattern at least n times.


    *   You will find pattern fo{2} in “foooood” and in “food” but you won’t find
    it in “fod”


    Common Characters ( . \d \D \w \W \s \S )


    *   A period (.) is representative of any character except for a newline


    *   You will find pattern fo.d in “foad”, “food”, “fo*f” and in “fo9d”


    *   The backslash-d (\d) is representative of any digit and is equivalent to [0-9]


    *   You will find the pattern fo\dd in “fo1d”, fo0d”, fo4d” but you won’t find
    it in “fodd” or in “food”


    *   The backslash-D (\D) is representative of any character with the exception
    of a digit and is the equivalent of [^0-9]


    *   You will find the pattern fo\D is “foad” and in “food” but you won’t find
    it in “fo4d”


    *   The backslash-w is representative of any word character, such as digits, letters
    and underscore (_).


    *   You will find the pattern fo\w in “fo_d”, “food” and in “fo4d” but you won’t
    find it in “fo*d”


    *   The backslash-W (\W) is representative of any character that isn’t a word
    character.


    *   “You can find the pattern fo\Wd in “fo&d”, in “fo*d) and in “fo.d” but you
    won’t find it in “fo d”


    *   The backslash-s (\s) character is representative of any whitespace character,
    such as tab, space, newline, etc.


    *   You will find pattern fo\sd in “fo d” but you won’t find it in “food)


    *   The backslash-S (\S) is representative of any character except for a whitespace


    *   You can find the pattern fo\Sd in “food”, in “fo*d” and in “fo4d” but you
    won’t find it in “fo d”


    Grouping ( [] )


    We use square brackets ([]) as a way of grouping options together:


    *   You will find the pattern f[aeiou] in “fed” and “fad” but you won’t find it
    in “food", "faed" or "fd".


    *   The pattern [aeiou] will match with "a", "e", "i", "o", or "u"


    *   You will find pattern f[aeiou]{2}d  in "faed" and in "feod", but you won’t
    find it in in "fod", "fed" or "fd".


    *   You will find the pattern [A-Za-z]+ in "Webucator, Inc.", but you won’t find
    it in "13078".


    *   The pattern [A-Za-z] will match with any letter, regardless of whether it
    is upper or lowercase


    *   The pattern [A-Z] will match any letter that is uppercase


    *   The pattern [a-z] will match any letter that is lowercase


    Negation ( ^ )


    When the caret (^) is used within square brackets and is the first character,
    it is indicative of negation


    *   You will find pattern f[^aeiou]d  in "fqd" and "f4d", but you won’t find it
    in "fad" or "fed".


    Subpatterns ( () )


    We use parentheses () to capture subpatterns


    *   You will find pattern f(oo)?d  in "food" and "fd", but you won’t find it in
    "fod".


    Alternatives ( | )


    We use the pipe (|) as a way of creating optional patterns


    *   You will find pattern foo$|^bar  in "foo" and "bar", but you won’t find it
    in "foobar".


    Escape Character ( \ )


    We use the backslash ( \ ) as a way of escaping special characters.


    *   You will find pattern fo\.d  in "fo.d", but you won’t find it in "food" or
    "fo4d".


    # Chapter 12:


    Regular Expressions – Form Validation


    When you use regular expressions, you can create some incredibly powerful functions
    that are for form validation. Have a look at this example:


    Example:


    RegularExpressions/Demos/Login.html


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta charset="UTF-8">


    <title>Login</title>


    <script type="text/javascript">


    var reEmail = /^(\w+[\-\.])*\w+@(\w+\.)+[A-Za-z]+$/;


    var rePassword = /^[A-Za-z\d]{6,8}$/;


    function validate(form){


    var email = form.Email.value;


    var password = form.Password.value;


    var errors = [];


    if (!reEmail.test(email)) {


    errors[errors.length] = "You must enter a valid email address.";


    }


    if (!rePassword.test(password)) {


    errors[errors.length] = "You must enter a valid password.";


    }


    if (errors.length > 0) {


    reportErrors(errors);


    return false;


    }


    return true;


    }


    function reportErrors(errors){


    var msg = "There were some problems...\n";


    for (var i = 0; i<errors.length; i++) {


    var numError = i + 1;


    msg += "\n" + numError + ". " + errors[i];


    }


    alert(msg);


    }


    </script>


    </head>


    <body>


    <h1>Login Form</h1>


    <form method="post" action="Process.html" onsubmit="return validate(this);">


    Email: <input type="text" name="Email" size="25"><br/>


    Password: <input type="password" name="Password" size="10"><br/>


    *Password must be between 6 and 10 characters and


    can only contain letters and digits.<br/>


    <input type="submit" value="Submit">


    <input type="reset" value="Reset Form">


    </p>


    </form>


    </body>


    </html>


    The code example start with the definition of a regular expression for an email
    address and one for a password as well so let’s look at each one in turn:


    var reEmail = /^(\w+\.)*\w+@(\w+\.)+[A-Za-z]+$/;


    *   The caret (^) indicates that we should start at the beginning and this stops
    a user from inputting any invalid characters at the start of the email address.


    *   The pattern (\w+[\-\.])* indicates an allowance for a sequence of characters
    (word) that are followed by a dash or a dot. * is used as an indicator that the
    pattern may be repeated 0 times or more and successful patters will include: "ndunn.",
    "ndunn-", "nat.s.", and "nat-s-".


    *   The pattern \w+ will allow for a minimum of one word character


    *   @ will allow for one @ symbol.


    *   The pattern (\w+\.)+ will allow for a sequence of characters (word) that are
    followed by a dot. + is indicative of the pattern being repeated at least once
    or more and this is the domain name minus the last bit, for example, .com


    *   The pattern [A-Za-z]+ will allow for at least one letter and is indicative
    of the last bit, for example, .com


    *   The dollar sign ($) indicates that you should end here. This stops a user
    from inputting invalid characters at the end of their email address


    var rePassword = /^[A-Za-z\d]{6,8}$/;


    *   Same as above. The starting caret stops a user from inputting invalid characters
    at the start of the password


    *   The pattern [A-Za-z\d]{6,8} will allow for a sequence of digits and letter
    that is 6 to 8 characters’ long


    *   Same as above, the dollar sign at the end stops a user from inputting an invalid
    character at the end of a password


    Advanced Form Validation


    This exercise should take you in the region of 25 to 40 minutes.


