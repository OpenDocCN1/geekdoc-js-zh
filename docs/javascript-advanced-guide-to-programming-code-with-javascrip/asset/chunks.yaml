  trans: "\n\nJavaScript 变量使用 `var` 关键字进行声明，它们可以是局部作用域或全局作用域。要成为全局作用域，变量必须满足以下条件之一：\n\
    \n- 变量在函数外部声明\n- 变量在声明时没有使用 `var` 关键字的情况下被使用\n\n要成为局部作用域，变量必须在另一个函数中使用 `var` 关键字进行声明。\n\
    \n全局变量可以在 JavaScript 代码的任何地方访问：\n\n示例：\n\n```javascript\nvar maxNum; //global\n\
    \nfunction prepare() {\n  var maxNum = 5; //local to function\n  // 让我们忘记在 \"\
    for\" 声明中写 \"var\"\n  for (i=0; i <= maxNum; ++i) { //没有 var，所以 i 将是全局的\n    //执行某些操作\n\
    \  }\n}\n\nprepare();\n\nalert(maxNum); //undefined\nalert(i); //6 (因为它是全局作用域)\n\
    ```\n\n注意 `maxNum` 是一个全局声明的变量，但还没有给它赋值。它在 `prepare()` 函数内部被声明并赋予了值 5。\n\n看看 `prepare()`\
    \ 调用后 `maxNum` 的值。它的值被留为了 `undefined`。这是是因为全局变量正在被读取，而我们无法从函数外部访问函数变量。\n\n然而，我们可以访问变量\
    \ `i`，仅仅是因为我们在函数内部在没有使用 `var` 声明的情况下给它赋了值。\n\n由于 JavaScript 中没有块级作用域，变量永远不会是 `for`\
    \ 循环或 `if` 语句的局部变量。\n\n# 第 7 章：观察和捕获事件\n\n你可能更习惯使用 HTML 事件处理器（例如“on”属性）作为捕获事件的方法——参见下例示例：\n\
    \n示例：\n\n```html\n<ul>\n  <li onclick=\"document.bgColor='red';\">Red</li>\n \
    \ <li onclick=\"document.bgColor='orange';\">Orange</li>\n  <li onclick=\"document.bgColor='green';\"\
    >Green</li>\n  <li onclick=\"document.bgColor='blue';\">Blue</li>\n</ul>\n```\n\
    \n然而，将 HTML 和 JavaScript 分开要好得多。\n\n## `eval()` 函数\n\n我们为什么在这里讨论这个函数？仅仅是为了承认它的存在，并告诉你**不要**使用它。我会告诉你原因，但在那之前你需要知道它是做什么的。\n\
    \n`eval` 用于编译字符串并执行它，该字符串将包含 JavaScript 代码，它可以是非常简单的内容，例如像“2 + 3”这样的表达式，也可以是一个更长、更复杂的脚本，其中包含各种函数和其他内容。\n\
    \n看下面的示例：这类似于你可以在互联网实时网站上看到的内容：\n\n示例：\n\n```javascript\nfunction getProperty(objectName,\
    \ propertyName) {\n  //表达式将是：document.title\n  var expression = objectName + \"\
    .\" + propertyName;\n  console.log(expression);\n  // eval() 函数会评估表达式，所以 document.title\
    \ 为我们提供了文档的标题\n  var propertyValue = eval(expression);\n  return propertyValue;\n\
    }\n\nvar prop = \"title\"; //假设这是由用户提供的\nalert(getProperty(\"document\", prop));\n\
    ```\n\n该函数通过获取一个对象名称并将其与点以及属性名称连接来生成表达式。然后它使用 `eval()` 评估该表达式。虽然这是一个非常强大的函数，但它也具有巨大的危险性，而且效率并不高。为什么它是危险的呢？因为它通常被用作评估用户输入的方法，而这并不总是最安全的做法。效率低的问题源于每次调用\
    \ `eval()` 都会启动一个 JavaScript 编译器。\n\n正常使用该函数通常表明开发者缺乏相关知识。在上面的示例中，我们本可以采用使用 `[]`\
    \ 属性访问器的路径。我们可以通过通过 alert(window[prop]);` 得到相同的结果，而不需要仅仅为了获取属性值就启动编译器。\n\n记住：尽可能避免使用\
    \ `eval`，因为它只会给你的代码带来问题。\n\n# 第 8 章：错误处理\n\n无论你把代码写得有多仔细，错误总是会出现的。大多数情况下，它们是由于你无法预测的事情而引起的运行时错误。其他时候，它们是\
    \ bug 或你的代码行为不符合预期。幸运的是，JavaScript 为你提供了处理这两类错误所需的工具，这正是我们在本章中要讨论的内容。\n\n## 运行时错误\n\
    \n网页浏览器可能是极其敌对的地方，几乎可以肯定你将永远在处理运行时错误。用户以你完全没想过可能的方式输入错误的内容。浏览器的新版本可能会改变工作方式，Ajax\
    \ 调用可能会因为许多不同的原因而失败。\n\n很多时候，你无能为运行时错误做什么，但有方法可以处理它们，让用户的体验不那么痛苦。\n\n### 未处理的错误\n\
    \n看看这个示例，它看起来很平凡：\n\n示例：\n\n```javascript\nfunction getInput() {\n  var name =\
    \ prompt('输入你的名字');\n  alert('你的名字有 ' + name.length + ' 个字母。');\n}\n\ngetInput();\n\
    ```\n\n仔细看代码；起初可能并不明显，但这是一个即将发生的 bug。如果用户点击或按下 ESC 或取消，`prompt()` 函数将返回 `null`，这将导致下一行出现空引用错误并使其执行失败。\n\
    \n如果开发者对此不做任何处理，终端用户将收到一条对他们完全没有任何意义的浏览器消息。取决于用户如何配置设置或浏览器，他们可能得不到屏幕消息；它可能会显示为状态栏中的一个小图标，这个图标很容易被忽略，导致用户认为程序只是没有响应。\n\
    \n### 全局处理的错误\n\nwindow 对象中有一个名为 `onerror` 的事件，每当页面上出现未处理的错误时，它就可能被调用。例如：\n\n\
    ```javascript\nwindow.onerror = function (message, url, lineNo) {\n  alert(\n\
    \    '错误: ' + message +\n    '\\n URL: ' + url +\n    '\\n 行号: ' + lineNo);\n\
    \  return true;\n}\n\nfunction getInput() {\n  var name = prompt('输入你的名字');\n\
    \  alert('你的名字有 ' + name.length + ' 个字母。');\n}\n\ngetInput();\n```\n\n如你从这个示例所示，事件向函数传递了三个参数。第一个是错误信息，第二个是包含错误的文件的\
    \ URL（如果是外部 .js 文件则非常有用），第三个是错误所在的行号。\n\n`return true` 告诉浏览器开发者已经处理了这个问题；如果返回\
    \ `false`，浏览器将此视为未处理的错误，屏幕或状态栏消息将显示在用户上。\n\n## 结构化错误处理\n\n对于任何事情，处理错误的最好的方法是在尽可能靠近发生的地方检测它。这将让你更容易知道如何处理它。JavaScript\
    \ 使用 `try...catch...finally` 块来实现结构化错误处理：\n\n```javascript\ntry {\n  // try 语句\n\
    } catch (error) {\n  // catch 语句\n} finally {\n  // finally 语句\n}\n```\n\n这是一个非常简单的原理；如果错误发生在\
    \ `try` 块中的语句中，则执行 `catch` 块中的语句，并将错误直接传递给 `error` 变量。`finally` 块是可选的，如果使用，无论是否有错误，它都会最后执行。\n\
    \n我们可以做什么来让代码捕获错误？\n\n示例：\n\n```javascript\nwindow.onerror = function (message,\
    \ url, lineNo) {\n  alert(\n    '错误: ' + message +\n    '\\n URL: ' + url +\n\
    \    '\\n 行号: ' + lineNo);\n  return true;\n}\n\nfunction getInput() {\n  try\
    \ {\n    var name = window.prompt('输入你的名字');\n    alert('你的名字有 ' + name.length\
    \ + ' 个字母。');\n  } catch (error) {\n    alert('错误类型为: ' + error.name +\n    '\\\
    n 错误消息为: ' + error.message);\n  } finally {\n    //执行清理工作\n  }\n}\n\ngetInput();\n\
    ```\n\n"
- fmt: "\nThere are two important properties in the error object – `message` and `name`.\
    \ `message` has the error message that we already know about while `name` contains\
    \ information about what type of error it was. We use this information to determine\
    \ what to do about the error.\n\nOne piece of good advice for any programmer is\
    \ to handle an error on the spot only if you are 100% certain you know what it\
    \ is and that you know exactly how to fix it, rather than suppressing it. To target\
    \ the handling code better, it can be changed just to handle errors that are called\
    \ `TypeError` – this is the name of the error that has been identified for the\
    \ bug:\n\nExample:\n\n```javascript\nwindow.onerror = function (message, url,\
    \ lineNo) {\n  alert(\n    'Error: ' + message +\n    '\\n Url: ' + url +\n  \
    \  '\\n Line Number: ' + lineNo);\n  return true;\n}\n\nfunction getInput() {\n\
    \  try {\n    var name = window.prompt('Type your name');\n    alert('Your name\
    \ has ' + name.length + ' letters.');\n  } catch (error) {\n    if (error.name\
    \ == 'TypeError') {\n      alert('Please try again.');\n      getInput();\n  \
    \  } else {\n      throw error;\n    }\n  } finally {\n    //do cleanup\n  }\n\
    }\n\ngetInput();\n```\n\nIf a different error were to occur, not likely in this\
    \ simple example, it would not be handled. The `throw` statement will send the\
    \ error on just as though we hadn’t used `try...catch...finally` block. The error\
    \ will appear later on down the line.\n\n### Throwing Custom Errors\n\nThe `throw`\
    \ statement can be used to throw up custom errors and there is only one recommendation\
    \ here – the error object must have `name` and `message` properties that are consistent\
    \ with the built-in handling method. Look at this example:\n\n```javascript\n\
    throw {\n  name: 'InvalidColorError',\n  message: 'The given color is not a valid\
    \ color value.'\n};\n```\n\n# Chapter 9: ‘delete’ Operator\n\nWe use the `delete`\
    \ operator as way of deleting object properties and array elements. Be very clear\
    \ on this – deleting is not the same as setting a value to `null`. Deleting removes\
    \ the element or property, making it `undefined`, while setting as value as `null`\
    \ will retain the element or object while setting it a value of `null`. Have a\
    \ look at this example as an illustration:\n\nExample:\n\n```html\n<!DOCTYPE HTML>\n\
    <html>\n<head>\n<meta charset=\"UTF-8\">\n<script type=\"text/javascript\">\n\
    var colors = [];\ncolors[\"red\"] = \"#f00\";\ncolors[\"green\"] = \"#060\";\n\
    colors[\"blue\"] = \"#00f\";\ncolors[\"yellow\"] = \"#ff0\";\ncolors[\"orange\"\
    ] = \"#0ff\";\n\nfunction deleteItem() {\n  delete colors[\"blue\"];\n  showArray();\n\
    \  revealArray();\n}\n\nfunction setToNull() {\n  colors[\"blue\"] = null;\n \
    \ showArray();\n  revealArray();\n}\n\nfunction showArray() {\n  var output =\
    \ document.getElementById(\"colors\");\n  var strOutput = \"<ol>\";\n  for (var\
    \ i in colors) {\n    strOutput += \"<li style='color:\" + colors[i] + \";'>\"\
    \ + i + \"</li>\";\n  }\n  strOutput += \"</ol>\";\n  output.innerHTML=strOutput;\n\
    }\n\nfunction revealArray() {\n  var colorsCode = document.getElementById(\"colors-code\"\
    );\n  var strOutput = \"&lt;ol&gt;\";\n  for (var i in colors) {\n    strOutput+=\"\
    \\n\\t&lt;li style='color:\" + colors[i] + \";'&gt;\" + i + \"&lt;/li&gt;\";\n\
    \  }\n  strOutput += \"\\n&lt;/ol&gt;\";\n  colorsCode.innerHTML=strOutput;\n\
    }\n</script>\n<title>Delete vs. Setting to NULL</title>\n</head>\n<body onload=\"\
    showArray();revealArray();\">\n<button id=\"set-to-null\" onclick=\"setToNull();\"\
    >Set Blue to Null</button>\n<button id=\"del\" onclick=\"deleteItem();\">Delete\
    \ Blue</button>\n<output id=\"colors\"></output>\n<pre id=\"colors-code\"></pre>\n\
    </body>\n</html>\n```\n\nForget about the functions `showArray()` and `revealArray()`\
    \ for now. Do note however that when the button for Set Blue to Null is clicked,\
    \ the array element will stay put but will be an invalid color of null. When Delete\
    \ Blue button is clicked, the array element will be deleted.\n\n### Regular Expressions\n\
    \nThis is a quick introduction to the next few chapters, where we go over regular\
    \ expressions. These are used for pattern matching and this can be very helpful\
    \ when it comes to form validation. For example, you can use a regular expression\
    \ to check that an email address that has been input into a form filed is correct\
    \ in terms of syntax. You can create regular expressions in two ways in JavaScript:\n\
    \nLiteral Syntax:\n`var reExample = /pattern/;`\n\n`RegExp()` Constructor:\n`var\
    \ reExample = new RegExp(\"pattern\");`\n\nIf you already know the pattern you\
    \ are going to use, there isn’t any real difference between these. However, if\
    \ you don’t know which patter you are going to use, the easiest one is the `RegExp()`\
    \ constructor.\n\n# Chapter 10: Regular Expressions – Methods\n\nThe JavaScript\
    \ regular expression method contains two main methods for string testing: `test()`\
    \ and `exec()`.\n\n### The `exec()` Method\n\nThis method takes an argument and\
    \ a string and checks to see if there are one or more matches in the string to\
    \ a pattern that is specified in the regular expressions. If the matches are found,\
    \ a result array is returned by the method showing the starting point of each\
    \ match. If there are no matches, `null` is returned.\n\n### The `test()` Method\n\
    \nThis method will also take a string and an argument and check the string for\
    \ pattern matches. If there is a match, `true` will be returned; if not, `false`\
    \ is returned. This is incredibly useful in form validations scripts.\n\nThe following\
    \ example show how to use this to test a social security number. Ignore the regular\
    \ expression syntax for now, we will be looking at that in the next chapter:\n\
    \nExample: `RegularExpressions/Demos/SsnChecker.html`\n\n```html\n<!DOCTYPE HTML>\n\
    <html>\n<head>\n<meta charset=\"UTF-8\">\n<title>ssn Checker</title>\n<script\
    \ type=\"text/javascript\">\nvar reSSN = /^[0-9]{3}[\\- ]?[0-9]{2}[\\- ]?[0-9]{4}$/;\n\
    \nfunction checkSsn(ssn){\n  if (reSSN.test(ssn)) {\n    alert(\"VALID SSN\");\n\
    \  } else {\n    alert(\"INVALID SSN\");\n  }\n}\n</script>\n</head>\n<body>\n\
    <form onsubmit=\"return false;\">\n<input type=\"text\" name=\"ssn\" size=\"20\"\
    >\n<input type=\"button\" value=\"Check\" onclick=\"checkSsn(this.form.ssn.value);\"\
    >\n</form>\n</body>\n</html>\n```\n\nLet’s take a closer look at the code. First,\
    \ we have declared a variable that contains a regular expression relating to a\
    \ social security number. Second, we have created a function `checkSsn()`. This\
    \ function takes an argument, `ssn`, which is also a string, and passes it to\
    \ the regular expression to see if there is a match. For this, `test()` method\
    \ is used. If there is a match, the function will alert “VALID SSN”. If there\
    \ is no match, “INVALID SSN” is alerted instead. Lastly, a form inserted in the\
    \ page provides a field for a user to input a social security number along with\
    \ a button that will pass the number to the `checkSsn()` function.\n\n### Flags\n\
    \nIf a flag appears after the end slash it will modify the way the regular expression\
    \ works. The `i` flag will turn the case of a regular expression insensitive.\
    \ For example, `/aeiou/i` will match both uppercase and lowercase vowels.\n\n\
    The `g` flag will specify a global match and that means that all matches of the\
    \ pattern that has been specified are to be returned.\n\n### String Methods\n\n\
    A number of String methods will take a regular expression as an argument:\n\n\
    The `search()` Method\nThis method will take just one argument – a regular expression.\
    \ The return is the index of the initial character of the substring that matches\
    \ the regular expression. If there is no match, `-1` is returned.\n\nThe `split()`\
    \ Method\nThis method also take a regular expression and uses it as a delimiter\
    \ to split one string into an array.\n\nThe `replace()` Method\nThis method will\
    \ take two arguments – the regular expression and the string. The first regular\
    \ expression match is replaced with the string and, if the `g` flag is used in\
    \ the expression, all string matches will be replaced.\n\nThe `match()` Method\n\
    The `match()` method takes the regular expression as an argument and returns each\
    \ of the substrings that are a match to the pattern of the regular expression.\n\
    \n# Chapter 11: Regular Expressions – Syntax\n\nRegular expressions are patterns\
    \ that are used to specify a list of characters. In this chapter, we are going\
    \ to look the syntax used to specify the characters:\n\nStart and End ( `^$` )\n"
