    \n对任何程序员来说，一个很好的建议是：只有当你 100% 确定知道错误是什么以及确切知道如何修复它时，才在现场处理错误，而不是将其抑制。为了更好地针对性地处理代码，可以将其更改为仅处理名为\
    \ `TypeError` 的错误——这是为该 识别出的错误名称：\n\n示例：\n\n```javascript\nwindow.onerror = function\
    \ (message, url, lineNo) {\n  alert(\n    'Error: ' + message +\n    '\\n Url:\
    \ ' + url +\n    '\\n Line Number: ' + lineNo);\n  return true;\n}\n\nfunction\
    \ getInput() {\n  try {\n    var name = window.prompt('Type your name');\n   \
    \ alert('Your name has ' + name.length + ' letters.');\n  } catch (error) {\n\
    \    if (error.name == 'TypeError') {\n      alert('Please try again.');\n   \
    \   getInput();\n    } else {\n      throw error;\n    }\n  } finally {\n    //do\
    \ cleanup\n  }\n}\n\ngetInput();\n```\n\n如果发生了不同的错误（在这个简单的示例中不太可能发生），它将不会被处理。`throw`\
    \ 语句将发送错误，就好像我们没有使用 `try...catch...finally` 块一样。错误将稍后出现。\n\n### 抛出自定义错误\n\n`throw`\
    \ 语句可以用于抛出自定义错误，这里只有一个建议——错误对象必须具有 `name` 和 `message` 属性，且要与内置处理方法一致。看这个示例：\n\n\
    ```javascript\nthrow {\n  name: 'InvalidColorError',\n  message: 'The given color\
