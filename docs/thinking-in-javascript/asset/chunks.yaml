    We can also create an array by entering the items directly within the `new Array`
    constructor. The following code snippet will show how it works:


    ```javascript

    var animals = new Array("cat", "dog", "mouse");

    ```


    We can also define an array without using the `new Array` constructor.


    ```javascript

    var animals = ["cat", "dog", "mouse"];

    ```


    The index position of an array starts with 0. The index feature helps us in accessing
    the data stored in the array. Let''s say we define the array as follows:


    ```javascript

    var animals = ["cat", "dog", "mouse"];

    ```


    If we want to retrieve the third item in the array, we need to specify its index
    position.


    Let''s have a look at the following code to understand how it works:


    ```html

    <html>

    <head>

    <title> Index in Arrays </title>

    </head>

    <body>

    <script type="text/javascript">

    var animals = ["cat", "dog", "mouse"];

    var x = animals[2];

    document.write(x);

    </script>

    </body>

    </html>

    ```


    The output of the following code would be as follows:


    ![Arrays](images/00012.jpg)


    An array has inbuilt properties and methods. For example, `length` is a property
    of arrays. Let''s have a look at the following code to see how it works:


    ```html

    <html>

    <head>

    <title> Index in Arrays </title>

    </head>

    <body>

    <script type="text/javascript">

    var animals = ["cat", "dog", "mouse"];

    y=animals.length;

    document.write(y);

    </script>

    </body>

    </html>

    ```


    The output of the code would be `3`.


    In brief, let''s look at the various properties and methods of arrays:


    *   **push**: To add an item at the end of the array

    *   **pop**: To remove an item at the end of the array

    *   **reverse**: To reverse the order of elements in the array

    *   **toString**: To convert an array to a string

    *   **sort**: To sort items alphabetically or numerically in an ascending or descending
    order


    # An overview on jQuery – the need of the hour


    jQuery, a multi-browser JavaScript library, was invented by John Resig. It is
    an open source library. Modern complex websites that have a lot of animation and
    navigation can be developed with ease using jQuery. `jQuery mobile` (`JQM`) is
    also an offshoot of jQuery. With the advent of smartphones and tablets, responsive
    web design is the trend today. Responsive web design can be achieved with the
    use of jQuery.


    ## Adding jQuery to the web page


    jQuery can be added to the website in the following ways:


    *   Including jQuery locally by downloading a copy of the library

    *   Including a hosted copy of jQuery


    Let''s have a look at both the procedures in the next sections.


    ### Including jQuery locally by downloading a copy of the library


    When we visit the jQuery website at [http://jquery.com/](http://jquery.com/) to
    download the copy of the library, we can view two different versions. The first
    version in the download section is the Minified Production jQuery version, whereas
    the second version is the Uncompressed Development version. There is a difference
    between the two.


    The Uncompressed Development version is readable and has lots of whitespaces and
    comments to understand the code better. Hence, it is recommended you use the Uncompressed
    Development version when you are learning jQuery or are in the development stage.


    The Minified Production version is precise and does not have the whitespaces as
    in the Uncompressed Development version. Moreover, the variables are given short
    names and the comments removed along with other compression tricks to reduce the
    size of the file as much as possible. Hence, during deployment, it is advisable
    to use the Minified version, as a shorter file has to be downloaded on loading
    the page. Let''s see how we add the jQuery file locally.


    When we go to the website, we can view the Minified Production and Uncompressed
    Development versions. Click on the version of your choice and it will be loaded
    in the browser as shown in the following figure.


    In our case, we will download the Minified version:


    ![Including jQuery locally by downloading a copy of the library](images/00013.jpg)


    Copy the contents of the file and save it in a text file giving it an extension
    `.js`. In our case, we will save it as `latestjquery.js`. Make sure you are saving
    the file in the same directory as your project so that we can call it directly.
    The following code snippet displays the way we include jQuery in our website:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Including jQuery</title>

    <script type="text/javascript" src="latestjquery.js"></script>

    <script type="text/javascript" src="ourjavascriptpage.js"></script>

    </head>

    <body>

    <p>jQuery: an amazing JavaScript library</p>

    </body>

    </html>

    ```


    In the preceding code, we have invoked `latestjquery.js` (our jQuery file) prior
    to any JavaScript code for example, (`ourjavascriptpage.js`). Hence, it is quite
    evident that we need to include jQuery first as our code needs to find jQuery
    fully loaded before we use it. It is good practice to include the jQuery file
    in our `<head>` section as it has to be loaded completely. Let''s now have a look
    at the second way of including jQuery to our website.


    ### Including a hosted copy of jQuery


    We can use the `Content Delivery Network` (`CDN`) of Google or Microsoft to host
    the jQuery file. Let''s have a look at the following code to see how it works:


    ```html

    <script src="//ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    ```


    ```html

    <script src="http://ajax.aspnetcdn.com/ajax/jquery/1.9.0/jquery.min.js"></script>

    ```


    ## Using the document ready feature


    Before we understand the document ready feature, let''s look at the following
    code:


    ```html

    <html>

    <head>

    <title> Index in Arrays </title>

    <script src="http://ajax.aspnetcdn.com/ajax/jquery/1.9.0.js"></script>

    <script type="text/javascript">

    $("p").click(function() {

    alert("Welcome to Packt Publishing");

    });

    </script>

    </head>

    <body>

    <p>Click here to understand the document ready feature</p>

    </body>

    </html>

    ```


    On execution, we can see the following output:


    ![Using the document ready feature](images/00014.jpg)


    According to the code, when we click on the text, an alert box is displayed that
    reads `Welcome to Packt Publishing`.


    However, we do not see any alert box. This is because the events must be fired,
    or should perform the desired action, before the page loads. If you observe the
    code, the alert box is not displayed as the `click` event takes place. By using
    the document ready feature, we can solve this issue. Let''s tweak the code a bit
    and include the document ready feature.


    ```html

    <html>

    <head>

    <title> Index in Arrays </title>

    <script src="http://ajax.aspnetcdn.com/ajax/jquery/1.9.0.js"></script>

    <script type="text/javascript">

    $(document).ready(function() {

    $("p").click(function() {

    alert("Welcome to Packt Publishing");

    });

    });

    </script>

    </head>

    <body>

    <p>Click here to understand the document ready feature</p>

    </body>

    </html>

    ```


    The code on execution will display the following output:


    ![Using the document ready feature](images/00015.jpg)


    However, the difference here is that on clicking the text in the output, the following
    alert box gets displayed:


    ![Using the document ready feature](images/00016.jpg)


    Hence, it is a good practice to include the document ready feature in jQuery.
    We have to use the following syntax to implement the document ready feature:

