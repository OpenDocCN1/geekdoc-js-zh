    我们也可以通过在 `new Array` 构造函数直接输入项来创建一个数组。下面的代码段将展示它的工作原理：


    ```javascript

    var animals = new Array("cat", "dog", "mouse");

    ```


    我们还可以不使用 `new Array` 构造函数来定义数组。


    ```javascript

    var animals = ["cat", "dog", "mouse"];

    ```


    数组的索引位置从 0 开始。索引功能帮助我们访问存储在数组中的数据。假设我们这样定义数组：


    ```javascript

    var animals = ["cat", "dog", "mouse"];

    ```


    如果我们想获取数组中的第三元素，我们需要指定它的索引位置。


    让我们来看下面的代码以理解它的工作原理：


    ```html

    <<html>

    <head>

    <title> Index in Arrays </title>

    </head>

    <body>

    <script type="text/javascript">

    var animals = ["cat", "dog", "mouse"];

    var x = animals[2];

    document.write(x);

    </script>

    </body>

    </html>

    ```


    以下代码的输出将如下：


    ![Arrays](img/00012.jpg)


    数组具有内置的属性和方法。例如，`length` 是数组的一个属性。让我们来看下面的代码看看它是如何工作的：


    ```html

    <<html>

    <head>

    <title> Index in Arrays </title>

    </head>

    <body>

    <script type="text/javascript">

    var animals = ["cat", "dog", "mouse"];

    y=animals.length;

    document.write(y);

    </script>

    </body>

    </html>

    ```


    代码的输出将是 `3`。


    简而言之，让我们来看数组的各种属性和方法：


    *   **push**: 在数组末尾添加项

    *   **pop**: 从数组末尾删除项

    *   **reverse**: 反转数组中元素的顺序

    *   **toString**: 将数组转换为字符串

    *   **sort**: 按字母顺序或数字按升序或降序对项目进行排序


    # jQuery 概览 – 时代之需


    jQuery 是一个多浏览器 JavaScript 库，由 John Resig 发明。它是一个开源库。具有大量动画和导航的现代复杂网站可以使用 jQuery
    轻松开发。`jQuery mobile` (`JQM`) 也是 jQuery 的一个衍生产品。随着智能手机和平板电脑的出现，响应式网页设计是当今趋势。使用
    jQuery 可以实现响应式网页设计。


    ## 将 jQuery 添加到网页中


    可以通过以下方式将 jQuery 添加到网站：


    *   通过下载库副本在本地引入 jQuery

    *   引入托管的 jQuery 副本


    让我们在接下来的章节中查看这两种方法。


    ### 通过下载库副本在本地引入 jQuery


    当我们访问 [`jquery.com/`](http://jquery.com/) jQuery 官网下载库副本时，我们可以看到两个不同的版本。下载部分的第一个版本是精简生产版
    jQuery（Minified Production jQuery version），而第二个版本是未压缩的开发版本（Uncompressed Development
    version）。两者之间存在差异。


    未压缩的开发版本具有可读性，并有大量的空格和注释，以便更好地理解代码。因此，当您学习 jQuery 或处于开发阶段时，建议使用未压缩的开发版本。


    精简生产版非常精确，没有像未压缩版本那样的空格。此外，变量被赋予了短名称，并删除了注释，还结合了其他压缩技巧，以尽可能地减小文件大小。因此，在部署期间建议使用精简版，因为在加载页面时必须下载更短的文件。让我们看看如何在本地添加
    jQuery 文件。


    当我们进入该网站时，可以看到精简生产版和未压缩的开发版本。点击您选择的版本，它将如如下图所示加载到浏览器中。


    在我们的案例中，我们将下载精简版：


    ![通过下载库副本在本地引入 jQuery](img/00013.jpg)


    复制文件内容并将其保存为扩展名为 `.js` 的文本文件。在我们的案例中，我们将其保存为 `latestjquery.js`。确保您将文件保存在项目相同的目录下，这样我们就可以直接调用它。下面的代码段显示了我们在网站中引入
    jQuery 的方法：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Including jQuery</title>

    <script type="text/javascript" src="latestjquery.js"></script>

    <script type="text/javascript" src="ourjavascriptpage.js"></script>

    </head>

    <body>

    <p>jQuery: an amazing JavaScript library</p>

    </body>

    </html>

    ```


    在前面的代码中，我们在调用任何 JavaScript 代码（例如 `ourjavascriptpage.js`）之前调用了 `latestjquery.js`（我们的
    jQuery 文件）。因此，显而易见，我们需要先引入 jQuery，因为我们的代码在使用它之前需要找到 jQuery 已完全加载。将 jQuery 文件包含在我们的
    `<head>` 部分是一个良好的做法，因为它必须被完全加载。现在让我们来看向网站引入 jQuery 的第二种方法。


    ### 引入托管的 jQuery 副本


    我们可以使用 Google 或 Microsoft 的`内容分发网络` (`CDN`) 来托管 jQuery 文件。让我们来看下面的代码看看它是如何工作的：


    ```html

    <script src="//ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    ```


    ```html

    <script src="http://ajax.aspnetcdn.com/ajax/jquery/1.9.0/jquery.min.js"></script>

    ```


    ## 使用 document ready 功能


    在理解 document ready 功能之前，让我们来看下面的代码：


    ```html

    <html>

    <head>

    <title> Index in Arrays </title>

    </head>

    <body>

    <script src="http://ajax.aspnetcdn.com/ajax/jquery/1.9.0/jquery.min.js"></script>

    <script type="text/javascript">

    $("p").click(function() {

    alert("Welcome to Packt Publishing");

    });

    </script>

    </head>

    <body>

    <p>Click here to understand the document ready feature</p>

    </body>

    </html>

    ```


    执行后，我们可以看到如下输出：


    ![使用 document ready 功能](img/00014.jpg)


    根据代码，当我们点击文本时，会显示显示 `Welcome to Packt Publishing` 的对话框。


    然而，我们没有看到任何对话框。这是因为事件必须在页面加载之前触发或执行操作。如果你观察代码，当 `click` 事件发生时对话框并未显示。通过使用 document
    ready 功能，我们可以解决这个问题。让我们稍微调整代码并引入 document ready 功能。


    ```html

    <html>

    <head>

    <title> Index in Arrays </title>

    <script src="http://ajax.aspnetcdn.com/ajax/jquery/1.9.0/jquery.min.js"></script>

    <script type="text/javascript">

    $(document).ready(function() {

    $("p").click(function() {

    alert("Welcome to Packt Publishing");

    });

    });

    </script>

    </head>

    <body>

    <p>Click here to understand the document ready feature</p>

    </body>

    </html>

    ```


    代码执行后将显示如下输出：


    ![使用 document ready 功能](img/00015.jpg)


    然而，这里的不同在于，在点击输出中的文本时，会显示以下对话框：


    ![使用 document ready 功能](img/00016.jpg)


    因此，在 jQuery 中包含 document ready 功能是一个良好的做法。我们必须使用以下语法来来实现 document ready 功能：


