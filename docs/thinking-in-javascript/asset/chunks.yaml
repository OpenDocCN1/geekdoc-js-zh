- fmt: "\n```javascript\n$(document).ready(function()\n```\n\nIf we observe the code\
    \ snippet, the function is the callback function that has to be executed once\
    \ the document gets ready for implementing jQuery. We can also observe a `$` sign.\
    \ The `$` sign is the synonym for the `jQuery()` function. Instead of writing\
    \ `jQuery` before the tag name, tag id, or class, we can use `$`. It simplifies\
    \ and shows that it is a jQuery code snippet. Using the appropriate syntax makes\
    \ up for cleaner and shorter code; this is of prime importance when the page loads.\n\
    \n## Accessing DOM elements using jQuery\n\nSimilar to CSS, we can access elements\
    \ in the `Document Object Model` (`DOM`) using jQuery. In JavaScript, we use the\
    \ `getElementByID` function to access elements in the DOM by using their ID. However,\
    \ we can do that in jQuery in a much shorter code.\n\n### Using the ID\n\nLet's\
    \ have a look at the following code snippet to see how we access the elements\
    \ by their IDs:\n\n```javascript\n$(document).ready(function()\n {\n   var x =\
    \ $(\"#packt\");\n});\n```\n\nFor an element with an ID `packt`, we can refer\
    \ to it using the `#` operator similar to the way it is done in CSS. We need to\
    \ remember that the ID has to be preceded by a `#` and should be enclosed in double\
    \ quotes.\n\n### Using the class\n\nLet's have a look at the following code snippet\
    \ to see how we access the elements by their class:\n\n```javascript\n$(document).ready(function()\n\
    \ {\n   var y = $(\".pubman\");\n});\n```\n\nFor an element defined with a class\
    \ `pubman`, we can refer it using the dot (`.`) operator. The class has to be\
    \ preceded by a dot (`.`) operator similar to the way it is done in CSS. However,\
    \ the class has to be enclosed in double quotes.\n\n### Using the tag\n\nLet's\
    \ have a look at the following code snippet to see how we access the elements\
    \ by their tag name:\n\n```javascript\n$(document).ready(function)\n {\n   var\
    \ links = $(\"a\");\n});\n```\n\nThe elements can be accessed by their tag name\
    \ in jQuery by referring to the tag enclosed in double quotes.\n\n## Anonymous\
    \ functions\n\nLet's have a look at the way we use anonymous functions in jQuery.\n\
    \nThe following code will give us an idea about its functionality:\n\n```javascript\n\
    $(document).ready(function()\n {\n   $('#packt').click(function()\n     {\n  \
    \     $('div').remove();\n     });\n});\n```\n\nLet's understand the meaning of\
    \ the code.\n\nThe document ready feature has already been explained. Then we\
    \ query the DOM for the element with the ID `packt` and we assign a `click` event\
    \ to it. Inside the function, we have included the `remove` method, which will\
    \ remove all `<div>` elements.\n\n### Note\n\nFor the various methods used in\
    \ jQuery, we can have a look at books such as *jQuery for Designers: Beginner's\
    \ Guide*, which are on the Packt website at [www.packtpub.com](http://www.packtpub.com).\
    \ Alternatively, we can refer to the Packt online library at [http://packtlib.packtpub.com/](http://packtlib.packtpub.com/).\n\
    \njQuery is widely used for animation. We will now have a look at the following\
    \ code where we hide and show elements on the web page:\n\n```html\n<html>\n<head>\n\
    <title>jQuery Animation</title>\n<script src=\"http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.js\"\
    ></script>\n<script type=\"text/javascript\">\n  $(document).ready(function()\
    \ {\n     $(\"#packt\").click(function () {\n       $(\".pubman\").show( 2000);\n\
    \     });\n     $(\"#packtpub\").click(function () {\n        $(\".pubman\").hide(\
    \ 3500 );\n     });\n  });\n</script>\n<style>\n.pubman{ margin:5px;padding:7px;\n\
    \     border:3px dashed navy;\n     color:lime;\n     width:110px;\n     height:40px;\n\
    \     display:inline;\n         }\n</style>\n</head>\n<body>\n<br>\n<div class=\"\
    pubman\">\nPackt Publishing\n</div>\n<input id=\"packtpub\" type=\"button\" value=\"\
    Click here to Hide\" />\n<input id=\"packt\" type=\"button\" value=\"Click here\
    \ to Display\" />\n</body>\n</html>\n```\n\nLet's have a look at the output of\
    \ the code on execution:\n\n![Anonymous functions](images/00017.jpg)\n\nWhen we\
    \ click on **Click here to Hide**, the box containing **Packt Publishing** vanishes.\
    \ When we click on **Click here to Display**, the box appears again. We have used\
    \ the `show()` method as well as the `hide()` method in the jQuery code. We have\
    \ also specified the time in milliseconds for the transition to take place.\n\n\
    Hence, we can see how easy it is to create animations using jQuery. There are\
    \ various other methods such as `toggle` and `fade`, to mention a few, but we\
    \ cannot cover everything that jQuery has to offer in this book.\n\njQuery is\
    \ a vast subject and the book will only look at a certain aspect of it. Packt\
    \ has a lot of books on jQuery such as *jQuery for Designers: Beginner's Guide*,\
    \ Packt Publishing, and you can visit our web page at [http://www.packtpub.com/books?keys=jquery](http://www.packtpub.com/books?keys=jquery)\
    \ to see the various books on jQuery customized for your needs.\n\nCoding gets\
    \ better with practice. We would really appreciate if you copy the code mentioned\
    \ in this book on an editor such as Notepad or Notepad++ and practice it. When\
    \ you implement the things you have learned in this book in real life, you will\
    \ realize how interesting it is to work on JavaScript practically. We have covered\
    \ objects and arrays in this book. There are different kinds of objects such as\
    \ the `Math` object and `Date` object, to mention a few. However, everything cannot\
    \ be covered here.\n"
