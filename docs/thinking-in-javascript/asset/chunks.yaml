    \ the code on execution would be as follows:\n\n![Conditions and Loops](images/00006.jpg)\n\
    \n# Functions\n\nFunctions are an integral part of JavaScript. Let's understand\
    \ the concept of functions. We know that the imperative purpose of JavaScript\
    \ is to add functionality to the web page. Say, we want to add certain functionality\
    \ in JavaScript. Suppose we need to implement it on different pages of the website\
    \ or different places on the same web page. Instead of adding functionality each\
    \ time, we can use the concept of functions where we can declare the function\
    \ once. From there on, we can use it multiple times on multiple web pages or at\
    \ different places on the website.\n\nThere are many inbuilt functions in JavaScript.\
    \ We can also craft our own functions in JavaScript and customize them according\
    \ to our needs. Let's look at the following code to understand how the functions\
    \ work:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title> Java Script in a\
    \ nutshell </title>\n<h1> Functions in JavaScript </h1>\n<p> Click on \"Click\
    \ Here\" to execute the code in the function </p>\n<script type=\"text/javascript\"\
    >\n  function PacktPub()\n     {\n       var x = prompt(\"Hey\", \"\");\n    \
    \   alert(\"Welcome to Packt, \" + x);\n     }\n</script>\n</head>\n<body>\n<a\
    \ href=\"javascript:PacktPub()\">Click Here</a>\n</body>\n</html>\n```\n\nThe\
    \ execution of the code will give us the following output:\n\n![Functions](images/00007.jpg)\n\
    \nOn clicking the `Click Here` link, we can see the following output:\n\n![Functions](images/00008.jpg)\n\
    \nWe get a prompt box that requests for an input. Say we enter the name `Joe`\
    \ and click on `OK`. We will get the following alert box as defined in the code.\n\
    \n![Functions](images/00009.jpg)\n\nLet's now understand how the code works. We\
    \ have used two inbuilt functions in the code:\n\n- `alert`\n- `prompt`\n\n`alert`\
    \ and `prompt` are inbuilt functions in JavaScript.\n\n### Note\n\nJavaScript\
    \ is case-sensitive; hence, we must use lowercase for `alert` and `prompt`, otherwise\
    \ the code will not work.\n\nThe `alert` and `prompt` functions are commonly used\
    \ in JavaScript. An alert box is used when we need to inform the user about some\
    \ development. It is also used when we want to give the user some information\
    \ prior to clicking on a link or surfing the website. Similarly, a `prompt` box\
    \ is used when we want an input from the user before he accesses the page.\n\n\
    If you observe the code, it is quite evident that the `PacktPub()` function was\
    \ declared prior to calling it. In the `PacktPub()` function, we have used the\
    \ `prompt` and `alert` functions. The `prompt` command on execution will prompt\
    \ the user for an input. The double quotes `\"\"` after `Hey` are for the default\
    \ string that has to be entered as the input. In the code, `x` is a variable that\
    \ is assigned a `prompt` function. Again, `x` is used in the `alert` command in\
    \ the very next line Once we enter the name `Joe`, we get an alert: `Welcome to\
    \ Packt, Joe`.\n\nThe concept of functions must be clear by now. Functions are\
    \ used extensively in JavaScript and are widely used to return a value in real-world\
    \ programming. Hence, functions are imperative part of JavaScript.\n\n# Objects\
    \ and their role in JavaScript\n\nJavaScript is an object-oriented language. We\
    \ have inbuilt objects such as `Math`, `Date`, and `Document`, to mention a few.\
    \ However, we can also create our objects and customize them to suit our needs.\n\
    \nAn object has properties and methods to define it. These are attributes that\
    \ give meaning to the object-oriented concept in JavaScript. A `property` is an\
    \ attribute that defines values for the object. Methods define the action that\
    \ can be implemented on the objects. Let's have a look at the following code to\
    \ understand how properties define values for an object:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script>\n  var animal=new Object();\n  animal.species=\"\
    Dog\";\n  animal.nickname=\"Monster\";\n  animal.age=10;\n  animal.eyecolor=\"\
    brown\";\n  document.write(animal.nickname + \" is a dog that has \" + animal.eyecolor);\n\
    </script>\n</body>\n</html>\n```\n\nThe output of the code would be as follows:\n\
    \n![Objects and their role in JavaScript](images/00010.jpg)\n\nThus, we have defined\
    \ properties for a dog called `Monster`. If you observe the code and the output,\
    \ we can see that we have connected the properties using string values connected\
    \ by an operator known as the concatenation operator. One point to remember is\
    \ that the empty space in the string is taken into consideration. Observe how\
    \ we have a space preceding and following the `\" is a dog that has \"` string\
    \ and how it reflects in the output. Coming back to objects, we have defined the\
    \ dog by specifying its name, age, and eye color. In JavaScript, all the user-defined\
    \ objects and the inbuilt objects belong to an object called `Object`. Let's understand\
    \ the concept of the `new` operator and the constructor function. In the earlier\
    \ code, there is a line of code `var animal=new Object();`. Hence, it is evident\
    \ that the `new` operator is used to create an instance of the object. The constructor\
    \ used in this case is `Object()`. The `new` operator is always followed by a\
    \ constructor method. That explains the code structure to create a new object.\
    \ Instead of the inbuilt functions, we can also use user-defined functions. Let's\
    \ have a look at the following code to understand how it works:\n\n```html\n<html>\n\
    <head>\n<script type=\"text/javascript\">\n  function rate(cost){\n    this.sellingPrice\
    \ = cost;\n  }\n  function prose(name, company){\n    this.name= name;\n    this.company\
    \ = company;\n    this.rate = rate;\n  }\n</script>\n</head>\n<body>\n<script\
    \ type=\"text/javascript\">\n  var y = new prose(\"JavaScript\", \"Packt Publishing\"\
    );\n  y.rate(50);\n  document.write(\"The name of the book is \" + y.name+ \"\
    <br>\");\n  document.write(\"The name of the publishing company is : \" + y.company\
    \ + \"<br>\");\n  document.write(\"The cost of the book is $\" + y.sellingPrice+\
    \ \"<br>\");\n</script>\n</body>\n</html>\n```\n\nThe output of the code would\
    \ be as follows:\n\n![Objects and their role in JavaScript](images/00011.jpg)\n\
    \nWe need to understand that a function and method are very similar. The only\
    \ difference is that a `function` is a standalone bunch of statements whereas\
    \ a `method` belongs to an object and can be referenced by the `this` keyword.\
    \ In the code, we have defined the `rate` function that will act as the method;\
    \ then we assign the `rate` method as a property in the function `prose`. Hence,\
    \ we have seen the concept of properties and methods in JavaScript objects.\n\n\
    As we mentioned, JavaScript is an object-oriented language. As with any object-oriented\
    \ language, the OOP concept applies to JavaScript as well. `Encapsulation`, `Inheritance`,\
    \ `Abstraction`, and `Polymorphism` are features of OOP that can be applied to\
    \ JavaScript.\n"
