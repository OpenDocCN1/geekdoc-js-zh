    # About the Author


    **Aravind Shenoy** is an in-house author at Packt Publishing. An engineering graduate
    from the Manipal Institute of Technology, his core interests include technical
    writing, web designing, and software testing. He is a native of Mumbai, India,
    and currently resides there. He has penned down books such as *Hadoop: A Big Data
    Initiative* and *Thinking in CSS*. He has also authored the bestselling book:
    *HTML5 and CSS3 Transition, Transformation, and Animation, Packt Publishing*,
    ([http://www.packtpub.com/html5-and-css3-for-transition-transformation-animation/book](http://www.packtpub.com/html5-and-css3-for-transition-transformation-animation/book)).
    He is a music buff with *The Doors*, *Oasis*, and *R.E.M* ruling his playlists.


    # www.PacktPub.com


    At [www.PacktPub.com](http://www.PacktPub.com), you can read a collection of free
    technical articles, sign up for a range of free newsletters and receive exclusive
    discounts and offers on Packt books and eBooks.


    ![www.PacktPub.com](images/00001.jpg)


    [http://PacktLib.PacktPub.com](http://PacktLib.PacktPub.com)


    Do you need instant solutions to your IT questions? PacktLib is Packt''s online
    digital book library. Here, you can access, read and search across Packt''s entire
    library of books. 


    # Why Subscribe?


    *   Fully searchable across every book published by Packt


    *   Copy and paste, print and bookmark content


    *   On demand and accessible via web browser


    # Free Access for Packt account holders


    If you have an account with Packt at [www.PacktPub.com](http://www.PacktPub.com),
    you can use this to access PacktLib today and view nine entirely free books. Simply
    use your login credentials for immediate access.


    # Overview


    Instead of wandering through loads of theory, we have used practical examples
    in this book. The examples in this book are compatible with almost every browser.
    Instead of using the verbatim code, you can modify the code and see the change
    in the output thereby understanding the subtle nuances of JavaScript.


    By the end of the book, with practice, you can achieve better things and get more
    acquainted with JavaScript.


    # Chapter 1. Thinking in JavaScript


    JavaScript is a scripting language for the Web. Before we delve into the intricacies
    of JavaScript, we need to know why it is used. While HTML tells your browser how
    the page will look, JavaScript will be used for dynamic content and to add functionality.


    The prerequisites for getting started with JavaScript are as follows:


    *   Prior knowledge of HTML


    *   A text editor such as Notepad


    *   JavaScript enabled on your web browser


    JavaScript does not require a compiler to execute the code. JavaScript can be
    embedded within the HTML code. The web browser interprets the JavaScript while
    the page loads.


    In this book, we are going to use a practical approach so that we can gain more
    insight into JavaScript. By the end of the book, we should be able to understand
    the concepts of JavaScript so that we can implement it in our real-life applications.


    # Applying JavaScript


    Instead of beating around the bush and wandering through loads of theory, we will
    start with a simple code right away.


    Let''s look at the following code to understand how JavaScript is applied to a
    web page:


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<title> Introduction to JavaScript </title>`


    `<script type="text/javascript">`


    `  alert(" Welcome to Packt ");`


    `</script>`


    `</head>`


    `</html>`


    When we look at this code, we can see that we have included a line: `script type="text/javascript"`
    in the `<head>` section. The `script` tag and its `type attribute` tell the browser
    that we have introduced a JavaScript in the HTML code. We can also see that there
    is an `alert` command in the code. We will talk about the `alert` command later
    in this book. On executing the code, we can see the following output on the screen:


    ![Applying JavaScript](images/00002.jpg)


    We can see that the JavaScript code must be inserted between the `<script>` and
    `</script>` tags.'
