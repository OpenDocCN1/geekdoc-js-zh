  raw: 'Our JavaScript code can be kept in the `<head>` or `<body>` tags. It is a
    matter of choice and depends on the web page. If there are a lot of styles and
    videos, it is preferable to keep the JavaScript code in the `<body>` tag. This
    ensures that the web page and its resources have been loaded completely before
    JavaScript comes into the picture. Another reason is that any resource, except
    for a JavaScript file, loads asynchronously. However, when a JavaScript file is
    being loaded, it happens one at a time. This hampers the performance.


    We must understand that if there is a lot of code to be written, it is always
    systematic to keep the JavaScript code separate from the HTML code. In this book,
    we will embed JavaScript in the HTML between the `<script>` tags for the sake
    of convenience. However, in real-world situations, it is good practice to keep
    the JavaScript code as a standalone. For that, we need to create a standalone
    JavaScript file and save it with a `.js` extension. The JavaScript code must be
    written in this separate `.js` file. Suppose we create a JavaScript file called
    `main.js`. We then invoke the `main.js` file in our HTML code. Let''s have a look
    at a code example to view the procedure:


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<title> Introduction to JavaScript </title>`


    **`<script type="text/javascript" src="main.js"></script>`**


    `</head>`


    `</html>`


    In the `.js` file, we need to write the following code snippet:


    `alert(" Welcome to Packt ");`


    When we execute the code, we will get the same output as shown in the earlier
    example. As we can see, we have invoked the `main.js` file by using the following
    code in our HTML file:


    `<script type="text/javascript" src="main.js"></script>`


    Here, the `main.js` file should be on the same path as the HTML file. If it is
    in a different folder, we need to specify the entire path.


    Thereby, we have seen the procedure to applying JavaScript in our code.


    # Variables


    In JavaScript, we need containers that will store data and values for processing
    purposes. Hence, we use variables in JavaScript. We can assign a numeric or a
    string value to a variable. A string needs to be enclosed in quotes. We also have
    the concept of constants. A **constant** is assigned a value that is permanent
    in the script, unlike variables where the values can be changed.


    Let''s have a look at the way we declare variables and constants in JavaScript:


    `var amount;`


    `var amount=5;`


    `const a;`


    It is quite evident that the variable should be preceded by the `var` keyword
    whereas constants must be preceded by the `const` keyword. We can also see that
    the value can be assigned to a variable at the time of declaring it.


    ### Note


    `const` is compatible with modern versions of all browsers except Internet Explorer.


    A variable can be either local or global. Let''s look at how we differentiate
    between local and global variables.


    ### Note


    Remember that JavaScript is case-sensitive. Hence "myAttribute" is *not* the same
    as "myattribute". One more point to note is that every statement ends with a semicolon.
    Spaces inside the quotes will be reflected in the output.


    ## Global and local variables


    **Global variables** can be accessed from any location in the script, whereas
    **local variables** can be accessed only within the function.


    Let''s have a look at the following code to understand it better:


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<title> Introduction to JavaScript </title>`


    `</head>`


    `<body>`


    `<h1> Variables in JavaScript </h1>`


    `<script type="text/javascript">`


    `  function subtraction(a, b)`


    `    {`


    `      var c;`


    `      c = a-b;`


    `      return c;`


    `    }`


    `  var z = subtraction(10, 7);`


    `  document.write("After subtraction, the difference is " + z);`


    `</script>`


    `</body>`


    `</html>`


    In the code, `a` as well as `b` have been passed as arguments to the function.
    `a` and `b` are local variables that can be accessed only within the function,
    as they exist in the function. However, `z` is declared outside the function and
    hence is a global variable.


    We can see the output of the executed code in the following screenshot:


    ![Global and local variables](images/00003.jpg)


    Functions will be explained under the heading *Functions* in this book, so let''s
    stick to variables as of now.


    To understand the scope and concept of variables better, let''s have a look at
    the following code:


    `<html>`


    `<head>`


    `<title> Scope of variables </title>`


    `</head>`


    `<body>`


    `<script type="text/javascript">`


    `  var a = "Packt publishes Books on Technology";`


    `  var b = "Welcome to Packt";`


    `  function Packt()`


    `    {`


    `      var a = "Packt Publishing has an online book library";`


    `      alert(a);`


    `      alert(b);`


    `    }  `


    `  Packt();`


    `  alert(a);`


    `</script>`


    `</body>`


    `</html>`


    On execution, we see three alerts in the following order :


    *   Packt Publishing has an online book library


    *   Welcome to Packt


    *   Packt publishes Books on Technology


    From the output, it is quite evident that the function can access the local variable
    (hence the first alert) as well as the global variable (hence the second alert).
    However, anything outside a specific function cannot access the variables inside
    that function (hence the third alert). That clears the concept of global and local
    variables.


    # Operators


    The three types of commonly used operators in JavaScript are as follows:


    *   Arithmetic operators


    *   Logical operators


    *   Comparison operators


    ## Arithmetic operators


    The following table displays the various kinds of Arithmetic operators:


    ![Arithmetic operators](images/00004.jpg)


    The operators mentioned in the table are used for Arithmetic operations.


    The **Addition**, **Subtraction**, **Multiplication**, and **Division** operators
    are self explanatory. The **Modular** operator (%) is used for the remnant left
    after division (we call this the modulus). Increment operators are used to increase
    the value by one whereas the decrement operator is used to decrease the value
    by one.


    For example, `x=x+1` can also be written as `x++` whereas `y=y-1` can be written
    as `y--`.


    ## Logical operators


    The following table displays the different types of logical operators:


    ![Logical operators](images/00005.jpg)


    The **AND** operator is used when all the conditions must be satisfied. For example,
    `X>5 && y=5` means that `x` should be greater than 5 and `y` must be equal to
    5 for the condition to be true.


    The **OR** operator is used when one of the conditions must be true. For example,
    `x=5 || y<3` means that the condition is true when `x` is equal to 5 or `y` is
    less than 3.


    The **NOT** operator is used when the antithesis is true. For example, `!(x>5)`
    is true when `x` is equal to or less than 5.


    # Conditions and Loops


    The main purpose of JavaScript is to add dynamic functionality. In order to execute
    a lot of actions and iterations, we have the concept of conditions and loops in
    JavaScript. The `if-else` statement is primarily used for various conditions.
    The structure of the `If-else` statement is as follows:


    `if (condition)`


    `  {`


    `    JavaScript statements to be executed`


    `  }`


    `else`


    `  {`


    `    JavaScript statements to be executed`


    `  }`


    For example, consider the following code snippet:


    `If (i>5)`


    `  {`


    `    x=50;`


    `  }`


    `else`


    `  {`


    `    x=100;`


    `  }`


    The interpretation of this code is simple. If the value of `i` is greater than
    5, the value of `x` will be `50`. If the value of `i` is not greater than `5`,
    then the value of `x` will be `100`.


    At times, we know the number of iterations to be performed. Suppose we need to
    execute the code and get the output, say 10 times. At that time, we use loops
    to perform multiple iterations as we know the number of times the loop will be
    repeated. We will see an example of the `for` loop in this chapter.


    The structure of the `for` loop is as follows:


    `for (initialization;condition;increment)`


    `  {`


    `    JavaScript statements`


    `  }`'
