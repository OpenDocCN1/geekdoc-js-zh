    \ 中，我们使用 `getElementByID` 函数通过 ID 访问 DOM 中的元素。然而，在 jQuery 中我们可以用更短的代码来实现这一点。\n\
    \n### 使用 ID\n\n让我们看看下面的代码段，看看我们如何通过 ID 访问元素：\n\n```javascript\n$(document).ready(function()\n\
    \ {\n   var x = $(\"#packt\");\n});\n```\n\n对于 ID 为 `packt` 的元素，我们可以像 CSS 那样使用\
    \ `#` 运算符来引用它。我们需要记住，ID 之前必须有一个 `#` 并且应该包含在双引号中。\n\n### 使用类\n\n让我们看看下面的代码段，看看如何通过类访问元素：\n\
    \n```javascript\n$(document).ready(function()\n {\n   var y = $(\".pubman\");\n\
    });\n```\n\n对于定义为类 `pubman` 的元素，我们可以使用点（`.`）运算符来引用它。类之前必须有一个点（`.`）运算符，类似于 CSS\
    \ 中的写法。然而，类必须包含在双引号中。\n\n### 使用标签\n\n让我们看看下面的代码段，看看我们如何通过标签名访问元素：\n\n```javascript\n\
    $(document).ready(function)\n {\n   var links = $(\"a\");\n});\n```\n\n在 jQuery\
    \ 中，可以通过引用包含双引号的标签来通过标签名访问元素。\n\n## 匿名函数\n\n让我们来看看如何在 jQuery 中使用匿名函数。\n\n下面的代码将让我们对它的功能有一个直观的理解：\n\
    \n```javascript\n$(document).ready(function()\n {\n   $('#packt').click(function()\n\
    \     {\n       $('div').remove();\n     });\n});\n```\n\n让我们来理解这段代码的含义。\n\ndocument\
    \ ready 功能已经解释过了。然后我们查询 DOM 以查找 ID 为 `packt` 的元素，并为其分配一个 `click` 事件。在函数内部，我们包含了\
    \ `remove` 方法，它将移除所有的 `<div>` 元素。\n\n### 注意\n\n对于 jQuery 中使用的各种方法，我们可以参考诸如 *jQuery\
    \ for Designers: Beginner's Guide* 等书籍，这些书籍可以在 Packt 网站 [www.packtpub.com](http://www.packtpub.com)\
    \ 上。或者，我们可以参考 Packt 在线库 [`packtlib.packtpub.com/`](http://packtlib.packtpub.com/)。\n\
    \njQuery 被广泛用于动画。我们现在来看看下面的代码，代码中我们在网页上隐藏和显示元素：\n\n```html\n<<html>\n<head>\n\
    <title>jQuery Animation</title>\n<script src=\"http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.js\"\
    ></script>\n<script type=\"text/javascript\">\n  $(document).ready(function()\
    \ {\n     $(\"#packt\").click(function () {\n       $(\".pubman\").show( 2000);\n\
    \     });\n     $(\"#packtpub\").click(function () {\n        $(\".pubman\").hide(\
    \ 3500 );\n     });\n  });\n</script>\n<style>\n.pubman{ margin:5px;padding:7px;\n\
    \     border:3px dashed navy;\n     color:lime;\n     width:110px;\n     height:40px;\n\
    \     display:inline;\n         }\n</style>\n</head>\n<body>\n<br>\n<div class=\"\
    pubman\">\nPackt Publishing\n</div>\n<input id=\"packtpub\" type=\"button\" value=\"\
    Click here to Hide\" />\n<input id=\"packt\" type=\"button\" value=\"Click here\
    \ to Display\" />\n</body>\n</html>\n```\n\n让我们来看看代码执行后的输出：\n\n![Anonymous functions](img/00017.jpg)\n\
    \n当我们点击 **Click here to Hide** 时，包含 **Packt Publishing** 的框消失了。当我们点击 **Click here\
    \ to Display** 时，框再次出现。我们在 jQuery 代码中使用了 `show()` 方法和 `hide()` 方法。我们还指定了过渡发生的毫秒时间。\n\
    \n因此，我们可以看到使用 jQuery 创建动画是多么简单。还有许多其他方法，例如 `toggle` 和 `fade`（仅列举几项），但我们无法在书中涵盖\
    \ jQuery 所提供的所有功能。\n\njQuery 是一个庞杂的主题，这本书将只关注它的某一方面。Packt 有许多关于 jQuery 的书籍，例如\
    \ *jQuery for Designers: Beginner's Guide*（Packt Publishing），你可以访问我们的网页 [`www.packtpub.com/books?keys=jquery`](http://www.packtpub.com/books?keys=jquery)\
    \ 来查看针对你的需求定制的各种 jQuery 书籍。\n\n编程会随着练习变得更好。如果你能将书中提到的代码复制到记事本或 Notepad++ 等编辑器中练习，我们将不胜感激。当你在现实生活中实现书中学到的内容时，你将发现实际操作\
    \ JavaScript 是多么有趣的事情。我们在书中涵盖了对象和数组。还有不同类型的对象，例如 `Math` 对象和 `Date` 对象等（等等）。然而，这里无法涵盖所有内容。\n\
