    \ Transition, Transformation, and Animation*。他是一个音乐爱好者，歌单里充满了 *The Doors*、*Oasis*\
    \ 和 *R.E.*。\n\n## www.PacktPub.com\n\n在 `www.PacktPub.com`，你可以阅读到系列免费技术文章，订阅一系列新闻邮件，并接收\
    \ Packt 书籍和电子书的专属折扣和优惠。\n\n![www.PacktPub.com](img/00001.jpg)\n\n你需要为你的 IT 问题寻求即时解决方案吗？PacktLib\
    \ 是 Packt 的在线数字图书馆。在这里，你可以访问、阅读并搜索 Packt 的整个书库。\n\n### 为什么要订阅？\n\n- 可对 Packt 出版的每本书进行全文搜索\n\
    - 允许复制和粘贴、打印和标记内容\n- 按需提供并可通过网络浏览器访问\n\n### Packt 账户持有者的免费访问\n\n如果你在 `www.PacktPub.com`\
    \ 拥有 Packt 账户，你现在就可以用它访问 PacktLib 查看完全免费的书。只需使用你的登录凭据即可立即访问。\n\n## 概述\n\n我们没有在海量的理论中徘徊，而是在书中使用了实践示例。书中的示例兼容几乎所有的浏览器。你不需要逐封地使用代码，可以修改代码并观察输出的变化，从而理解\
    \ JavaScript 的细微差别。在书结束时，通过练习，你可以取得更好的成就并更熟悉 JavaScript。\n\n## 第 1 章. JavaScript\
    \ 思维\n\nJavaScript 是一种用于 Web 的脚本语言。在我们开始深入研究 JavaScript 的复杂性之前，我们需要知道为什么要使用它。HTML\
    \ 告诉浏览器页面看起来什么样，而 JavaScript 将用于动态内容和添加功能。\n\n开始学习 JavaScript 的前提条件如下：\n- 之前的\
    \ HTML 知识\n- 文本编辑器（如记事本）\n- 你的网络浏览器已启用 JavaScript\n\nJavaScript 执行代码不需要编译器。JavaScript\
    \ 可以嵌入到 HTML 代码中。网络浏览器在页面加载时解释 JavaScript。\n\n在本书中，我们将采用实践方法，以便对 JavaScript 有更深入的了解。在书结束时，我们应该能够理解\
    \ JavaScript 的概念，以便我们可以在现实应用中实现它。\n\n### 应用 JavaScript\n\n我们不再绕圈子或在海量的理论中徘徊，而是直接从一段简单的代码开始。让我们来看下面的代码，理解\
    \ JavaScript 是如何应用于网页的：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title> JavaScript\
    \ 简介 </title>\n<script type=\"text/javascript\">\n  alert(\" Welcome to Packt\
    \ \");\n</script>\n</head>\n</html>\n```\n\n当我们看这段代码时，可以看到我们在 `<head>` 部分包含了一行：`script\
    \ type=\"text/javascript\"`。`script` 标签及其 `type 属性` 告诉浏览器我们已在 HTML 代码中引入了 JavaScript。我们还可以看到代码中有一个\
    \ `alert` 命令。我们将在本书的稍后部分讨论 `alert` 命令。在执行代码时，我们可以在屏幕上看到以下输出：\n\n![应用 JavaScript](img/00002.jpg)\n\
    \n我们可以看到 JavaScript 代码必须插入在 `<script>` 和 `</script>` 标签之间。\n\n"
- fmt: "\nOur JavaScript code can be kept in the `<head>` or `<body>` tags. It is\
    \ a matter of choice and depends on the web page. If there are a lot of styles\
    \ and videos, it is preferable to keep the JavaScript code in the `<body>` tag.\
    \ This ensures that the web page and its resources have been loaded completely\
    \ before JavaScript comes into the picture. Another reason is that any resource,\
    \ except for a JavaScript file, loads asynchronously. However, when a JavaScript\
    \ file is being loaded, it happens one at a time. This hampers the performance.\n\
    \nWe must understand that if there is a lot of code to be written, it is always\
    \ systematic to keep the JavaScript code separate from the HTML code. In this\
    \ book, we will embed JavaScript in the HTML between the `<script>` tags for the\
    \ sake of convenience. However, in real-world situations, it is good practice\
    \ to keep the JavaScript code as a standalone. For that, we need to create a standalone\
    \ JavaScript file and save it with a `.js` extension. The JavaScript code must\
    \ be written in this separate `.js` file. Suppose we create a JavaScript file\
    \ called `main.js`. We then invoke the `main.js` file in our HTML code. Let's\
    \ have a look at a code example to view the procedure:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title> Introduction to JavaScript </title>\n<script type=\"text/javascript\"\
    \ src=\"main.js\"></script>\n</head>\n</html>\n```\n\nIn the .js file, we need\
    \ to write the following code snippet:\n\n```javascript\nalert(\" Welcome to Packt\
    \ \");\n```\n\nWhen we execute the code, we will get the same output as shown\
    \ in the earlier example. As we can see, we have invoked the `main.js` file by\
    \ using the following code in our HTML file:\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"main.js\"></script>\n```\n\nHere, the `main.js` file should be on the\
    \ same path as the HTML file. If it is in a different folder, we need to specify\
    \ the entire path.\n\nThereby, we have seen the procedure to applying JavaScript\
    \ in our code.\n\n# Variables\n\nIn JavaScript, we need containers that will store\
    \ data and values for processing purposes. Hence, we use variables in JavaScript.\
    \ We can assign a numeric or a string value to a variable. A string needs to be\
    \ enclosed in quotes. We also have the concept of constants. A `constant` is assigned\
    \ a value that is permanent in the script, unlike variables where the values can\
    \ be changed.\n\nLet's have a look at the way we declare variables and constants\
    \ in JavaScript:\n\n```javascript\nvar amount;\nvar amount=5;\nconst a;\n```\n\
    \nIt is quite evident that the variable should be preceded by the `var` keyword\
    \ whereas constants must be preceded by the `const` keyword. We can also see that\
    \ the value can be assigned to a variable at the time of declaring it.\n\n###\
    \ Note\n\n`const` is compatible with modern versions of all browsers except Internet\
    \ Explorer.\n\nA variable can be either local or global. Let's look at how we\
    \ differentiate between local and global variables.\n\n### Note\n\nRemember that\
    \ JavaScript is case-sensitive. Hence \"myAttribute\" is not the same as \"myattribute\"\
    . One more point to note is that every statement ends with a semicolon. Spaces\
    \ inside the quotes will be reflected in the output.\n\n## Global and local variables\n\
    \n`Global variables` can be accessed from any location in the script, whereas\
    \ `local variables` can be accessed only within the function.\n\nLet's have a\
    \ look at the following code to understand it better:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title> Introduction to JavaScript </title>\n</head>\n<body>\n\
