    `</script>`


    `</head>`


    `<body>`


    `<a href="javascript:PacktPub()">Click Here</a>`


    `</body>`


    `</html>`


    The execution of the code will give us the following output:


    ![Functions](images/00007.jpg)


    On clicking the **Click Here** link, we can see the following output:


    ![Functions](images/00008.jpg)


    We get a prompt box that requests for an input. Say we enter the name **Joe**
    and click on **OK**. We will get the following alert box as defined in the code.


    ![Functions](images/00009.jpg)


    Let''s now understand how the code works. We have used two inbuilt functions in
    the code:


    *   `alert`


    *   `prompt`


    `alert` and `prompt` are inbuilt functions in JavaScript.


    ### Note


    JavaScript is case-sensitive; hence, we must use lowercase for `alert` and `prompt`,
    otherwise the code will not work.


    The `alert` and `prompt` functions are commonly used in JavaScript. An alert box
    is used when we need to inform the user about some development. It is also used
    when we want to give the user some information prior to clicking on a link or
    surfing the website. Similarly, a prompt box is used when we want an input from
    the user before he accesses the page.


    If you observe the code, it is quite evident that the `PacktPub()` function was
    declared prior to calling it. In the `PacktPub()` function, we have used the `prompt`
    and `alert` functions. The `prompt` command on execution will prompt the user
    for an input. The double quotes (`""`) after `Hey` are for the default string
    that has to be entered as the input. In the code, `x` is a variable that is assigned
    a `prompt` function. Again, `x` is used in the `alert` command in the very next
    line.


    Once we enter the name `Joe`, we get an alert: `Welcome to Packt, Joe`.


    The concept of functions must be clear by now. Functions are used extensively
    in JavaScript and are widely used to return a value in real-world programming.
    Hence, functions are an imperative part of JavaScript.


    # Objects and their role in JavaScript


    JavaScript is an object-oriented language. We have inbuilt objects such as `Math`,
    `Date`, and `Document`, to mention a few. However, we can also create our own
    objects and customize them to suit our needs.


    An object has properties and methods to define it. These are attributes that give
    meaning to the object-oriented concept in JavaScript. A **property** is an attribute
    that defines values for the object. Methods define the action that can be implemented
    on the objects.


    Let''s have a look at the following code to understand how properties define values
    for an object:


    `<!DOCTYPE html>`


    `<html>`


    `<body>`


    `<script>`


    `  var animal=new Object();`


    `  animal.species="Dog";`


    `  animal.nickname="Monster";`


    `  animal.age=10;`


    `  animal.eyecolor="brown";`


    `  document.write(animal.nickname + " is a dog that has " + animal.eyecolor +
    " eyes");`


    `</script>`


    `</body>`


    `</html>`


    The output of the code would be as follows:


    ![Objects and their role in JavaScript](images/00010.jpg)


    Thus, we have defined properties for a dog called Monster. If you observe the
    code and the output, we can see that we have connected the properties using string
    values connected by an operator known as the concatenation operator. The concatenation
    operator is used to connect several pieces of text together. One point to remember
    is that the empty space in the string is taken into consideration. Observe how
    we have a space preceding and following the " is a dog that has " string and how
    it reflects in the output. Coming back to objects, we have defined the properties
    for the dog by specifying its name, age, and eye color.


    In JavaScript, all the user-defined objects and the inbuilt objects belong to
    an object called `Object`. Let''s understand the concept of the `new` operator
    and the constructor function. In the earlier code, there is a line of code `var
    animal=new Object();`. Hence, it is evident that the `new` operator is used to
    create an instance of the object. The constructor used in this case is `Object()`.
    The `new` operator is always followed by a constructor method. That explains the
    code structure to create a new object.


    Instead of the inbuilt functions, we can also use user-defined functions. Let''s
    have a look at the following code to understand how it works:


    `<html>`


    `<head>`


    `<script type="text/javascript">`


    `  function rate(cost){`


    `    this.sellingPrice = cost;`


    `  }`


    `  function prose(name, company){`


    `    this.name= name;`


    `    this.company  = company;`


    `    this.rate = rate;`


    `  }`


    `</script>`


    `</head>`


    `<body>`


    `<script type="text/javascript">`


    `  var y = new prose("JavaScript", "Packt Publishing");`


    `  y.rate(50);`


    `  document.write("The name of the book is " + y.name+ "<br>");`


    `  document.write("The name of the publishing company is : " + y.company + "<br>");`


    `  document.write("The cost of the book is $" + y.sellingPrice+ "<br>");`


    `</script>`


    `</body>`


    `</html>`


    The output of the code would be as follows:


    ![Objects and their role in JavaScript](images/00011.jpg)


    We need to understand that a function and method are very similar. The only difference
    is that a **function** is a standalone bunch of statements whereas a **method**
    belongs to an object and can be referenced by the `this` keyword. In the code,
    we have defined the `rate` function that will act as the method; then we assign
    the `rate` method as a property in the function prose. Hence, we have seen the
    concept of properties and methods in JavaScript objects.


    As we mentioned, JavaScript is an object-oriented language. As with any object-oriented
    language, the OOP concept applies to JavaScript as well. **Encapsulation**, **Inheritance**,
    **Abstraction**, and **Polymorphism** are features of OOP that can be applied
    to JavaScript.


    # Arrays


    In many programming languages such as C++, Java, and PHP to mention a few, we
    use the concept of arrays. Similarly, we use the concept of arrays in JavaScript
    too. Objects in JavaScript store and allow manipulation of data. So far, we have
    seen variables that are restricted to a single piece of data. However, in an array,
    we can store multiple items and retrieve them with ease.


    Arrays can be created in different ways. Let''s have a look at the following code
    snippet to understand it better:


    `var animals = new Array();`


    `animals[0]="cat";`


    `animals[1]="dog";`


    `animals[2]="mouse";`'
