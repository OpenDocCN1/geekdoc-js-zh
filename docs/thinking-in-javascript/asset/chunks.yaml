    \ has also authored *HTML5 and CSS3 Transition, Transformation, and Animation*.\
    \ He is a music buff with *The Doors*, *Oasis*, and *R.E.* ruling his playlists.\n\
    \n## www.PacktPub.com\n\nAt `www.PacktPub.com`, you can read a collection of free\
    \ technical articles, sign up for a range of newsletters and receive exclusive\
    \ discounts and offers on Packt books and eBooks.\n\n![www.PacktPub.com](images/00001.jpg)\n\
    \nDo you need instant solutions to your IT questions? PacktLib is Packt's online\
    \ digital library. Here, you can access, read and search across Packt's entire\
    \ library of books.\n\n### Why Subscribe?\n\n- Fully searchable across every book\
    \ published by Packt\n- Copy and paste, print and bookmark content\n- On demand\
    \ and accessible via web browser\n\n### Free Access for Packt account holders\n\
    \nIf you have an account with Packt at `www.PacktPub.com`, you can use this to\
    \ access PacktLib today and view entirely free books. Simply use your login credentials\
    \ for immediate access.\n\n## Overview\n\nInstead of wandering through loads of\
    \ theory, we have used practical examples in this book. The examples in this book\
    \ are compatible with almost every browser. Instead of using the verbatim code,\
    \ you can modify the code and see the change in the output thereby understanding\
    \ the subtle nuances of JavaScript. By the end of the book, with practice, you\
    \ can achieve better things and get more acquainted with JavaScript.\n\n## Chapter\
    \ 1. Thinking in JavaScript\n\nJavaScript is a scripting language for the Web.\
    \ Before we delve into the intricacies of JavaScript, we need to know why it is\
    \ used. While HTML tells your browser how the page will look, JavaScript will\
    \ be used for dynamic content and to add functionality.\n\nThe prerequisites for\
    \ getting started with JavaScript are as follows:\n- Prior knowledge of HTML\n\
    - A text editor such as Notepad\n- JavaScript enabled on your web browser\n\n\
    JavaScript does not require a compiler to execute the code. JavaScript can be\
    \ embedded within the HTML code. The web browser interprets the JavaScript while\
    \ the page loads.\n\nIn this book, we are going to use a practical approach so\
    \ that we can gain more insight into JavaScript. By the end of the book, we should\
    \ be able to understand the concepts of JavaScript so that we can implement it\
    \ in our real-life applications.\n\n### Applying JavaScript\n\nInstead of beating\
    \ around the bush and wandering through loads of theory, we will start with a\
    \ simple code right away. Let's look at the following code to understand how JavaScript\
    \ is applied to a web page:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>\
    \ Introduction to JavaScript </title>\n<script type=\"text/javascript\">\n  alert(\"\
    \ Welcome to Packt \");\n</script>\n</head>\n</html>\n```\n\nWhen we look at this\
    \ code, we can see that we have included a line: `script type=\"text/javascript\"\
    ` in the `<head>` section. The `script` tag and its `type attribute` tell the\
    \ browser that we have introduced a JavaScript in the HTML code. We can also see\
    \ that there is an `alert` command in the code. We will talk about the `alert`\
    \ command later in this book. On executing the code, we can see the following\
    \ output on the screen:\n\n![Applying JavaScript](images/00002.jpg)\n\nWe can\
    \ see that the JavaScript code must be inserted between the `<script>` and `</script>`\
    \ tags.\n"
