  md: 'So that''s division.


    Now I''ve got a bonus for ya!


    Let''s say you want to increment a number by one.


    So... of course... you can type something like that... :


    ```

    var num1 = 4;

    document.write(num1 + 1);

    ```


    But! If you are a lazy person like myself, you can shorthand and do that : !


    ```

    var num1 = 4;

    document.write(num1++);

    ```


    Or something like that if we want a number to be decreased:


    ```

    var num1 = 4;

    document.write(num1--);

    ```


    The plus plus (++) sign (and also the minus minus), will increment or ... decrement?
    (Can we say decrement?!) your number by one. It''s short and dandy, and we will
    also see that a lot in our future, when we will encounter more complex stuff on
    Javascript!'
