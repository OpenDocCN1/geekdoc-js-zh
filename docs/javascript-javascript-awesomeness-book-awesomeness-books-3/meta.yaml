    \ curtainNumber + \", You have won \" + prize);\n}\n```\n\n现在我们将为按钮添加不同的窗帘编号，这样参数就知道如何设置了。\n\
    \n`onclick=\"1, 'a shiny brand new tooth pick!'\"`\n\n但参数的顺序非常重要，如果 `curtainNumber`\
    \ 是第一个参数，我们也必须先设置它……\n\n好了，让我们测试一下窗帘！\n\n运行成功了！\n\n万岁！\n\n## 第 14 章\n**返回语句 (Return\
    \ Statement)**\n\n在之前的课程中，我们讨论了函数，而我们的函数只是执行了某些操作，对吧？\n我们在屏幕上打印内容，点击一个按钮弹出一个消息，诸此类……\n\
    但在某些情况下，你希望函数返回某个值，以便以后使用。\n这就是为什么我们有 `return` 语句。\n\n来看这个例子：\n\n写一个名为 `BasicAddition`\
    \ 的函数，请求两个参数 `num1` 和 `num2`。它将返回两者的和。\n\n```\nfunction BasicAddition(num1,num2){\n\
    \  return num1 + num2;\n}\n```\n\n现在我们将调用该函数并传入参数 1 和 2。我们预期得到数字 3，对吧？\n\n`BasicAddition(1,\
    \ 2);`\n\n如果我们现在运行它，什么都不会显示。\n这是因为我们没有告诉函数对结果进行什么处理。它既没有打印，也没有存储在任何地方。\n\n创建一个新变量名为\
    \ `result`。从 `BasicAddition` 函数中获取结果。然后将 `result` 打印到页面上。\n\n```\nvar result =\
    \ BasicAddition(1, 2);\ndocument.write(result);\n```\n\n保存并刷新……砰！搞定了！\n\n我们返回了相加数字的结果，将其存储在名为\
    \ `result` 的变量中，然后使用该变量将其打印在页面上。\n\n## 第 15 章\n**从另一个函数调用 (Calling from another\
    \ function)**\n\n好了，你已经知道如何写函数，如何为这个写写参数，甚至是多个参数，甚至……（保佑上帝！）为这个函数写返回语句！\n\n现在我要向你展示一个有一天派上用场的小技巧……\n\
    \n你实际上可以在……**函数内部调用函数**！\n\n让我们试一下，创建一个 `GoodNight` 函数，以及另一个名为 `GoodMorning` 的函数。它们都不接受任何参数。\n\
    \n在 `GoodNight` 函数内部我们将使用 `document.write` 并说“Good night！”；在 `GoodMorning` 函数中，你猜得没错，我们将输入“Good\
    \ morning！”。\n\n```\nfunction GoodNight(){\n    document.write(\"Good Night!\"\
    );\n}\n```\n\n```\nfunction GoodMorning(){\n    document.write(\"Good Morning!\"\
    );\n}\n```\n\n现在我们有了另一个名为 `Start` 的函数，我们从 `Start` 函数中调用这两个函数。\n\n```javascript\n\
    function Start(){\n    GoodMorning();\n    GoodNight();\n}\n```\n\n现在如果我们刷新页面，什么都不会发生，因为虽然我们调用了\
