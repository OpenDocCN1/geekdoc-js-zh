    \n让我们这样做！\n\n`Start();`\n\n看到了吗？当我们启动 `Start` 函数时，我们也运行了它内部的两个函数。\n\n现在让我们尝试让浏览器崩溃。（千万不要在家里尝试！）不……开玩笑的。你可以试的！\n\
    \n我们将 `GoodMorning` 函数放在 `GoodNight` 函数内部，反之亦然，然后通过告诉它调用 `GoodMorning` 来启动 `start`。（为了可读性，在每个\
    \ write 语句中添加 `<br>` 标签。）\n\n我们预期浏览器会进入 `GoodMorning` 并说 good morning，然后进入 `GoodNight`\
