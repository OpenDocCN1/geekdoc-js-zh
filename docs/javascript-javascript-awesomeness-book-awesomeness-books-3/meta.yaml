    So to declare variable, the lazy javascript people just shorthand the word variable
    into just "var"... so you should always write "var" first, and then , you can
    come up with name for your variable, any name you can think of... I''ll write
    my name for example, "gilad"

    Then, you should write an equal sign, and then what you want to assign your variable
    to.

    Let''s say we want to print the number 9.


    And we will close it with a semicolon like always.


    ```

    var gilad = 9;

    ```


    Right now you already know how to print stuff to your page, remember our fluffy
    red goat?


    ```

    document.write("I''m printing fluffy red goat... ");

