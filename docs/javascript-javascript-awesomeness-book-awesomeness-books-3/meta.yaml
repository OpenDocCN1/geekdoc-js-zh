    \nJavascript 函数参数？？还有活生生的羊驼？！老师还有什么可要求的呢？！\n\n## 第 13 章\n**多参数 (Multiple Parameters)**\n\
    \n有时候，你可以拥有包含参数的函数，但你还需要添加另一个参数。\n\n在上次的例子中，我们有一个参数用于请求奖金，并有一条消息告诉用户他中了什么奖品。但如果我们想添加其他信息，比如用户刚刚打开的是第几号窗帘呢？\n\
    \n如果我们想实现这类任务，可以在括号中添加另一个参数。只需添加一个逗号，然后输入你想添加的额外参数名称即可。\n\n例如，为了让我们的消息更酷，我们将添加另一个名为\
    \ `curtainNumber` 的参数，并在消息中提示“你打开了第 XX 号窗帘”，然后像上一个例子一样继续显示他中奖奖品：\n\n```\nfunction\
