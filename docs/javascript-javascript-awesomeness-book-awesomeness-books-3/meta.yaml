  md: '# # Chapter 8

    Variable types


    Do you remember when you were a baby, you had this weird game of shapes, and you
    were supposed to sort those shapes and put every shape into its place?


    Just like that game, Javascript has different types of variables. And they cannot
    fit everywhere...


    Let me explain it to you first writing it down in our text editor:


    I will write var , name, equals to 9:


    ```

    var name = 9;

    ```


    ```

    document.write(name);

    ```


    That''s what we''ve done in the last lecture, right?


    We have a variable named name, and it''s equal to the number 9.


    But, my name is not nine, right? (I swear it doesn''t!)


    Let''s try to erase the number nine, and place my name instead.


    ```

    var name = gilad;

    ```


    ```

    document.write(name);

    ```


    Save it, refresh it, and let''s see what we have here...


    ah! Nothing shows! What happened?


    The difference between 9 and a gilad, is that "gilad" is a text (or as Javascript
    to call to it: "string”). And 9 is a number.


    The thing is, javascript could easily think that gilad may be just another variable,
    and because it could be a variable, it''s trying to look for it in the entire
    page, and when it couldn''t find it, it just says... "Oh Well, alright... I did
    my best, I cannot find it anywhere... I''ll just do nothing and relax... " (giving
    up early, huh?)


    To explicitly to Javascript that we have a string here, we need to wrap our text
    inside of quotation mark.


    Let''s do that:


    ```

    var name = "gilad";

    ```


    ```

    document.write(name);

    ```'
