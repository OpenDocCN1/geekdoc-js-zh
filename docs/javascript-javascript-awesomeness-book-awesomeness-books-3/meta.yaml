  md: 'OK Ill ... Now we want to warn everybody, before we are printing our goats,
    to watch out! Fluffy red goats are on the loose! Preferably with annoying pop
    up on the screen!


    So we will write down alert, and then we will open parentheses, and inside our
    paragraphs, we will have double quotation marks as well, and then we will write
    “watch out! Red fluffy goats are on their way!”


    And we will close our statement with a semicolon, as usual.


    alert(“watch out! Red Fluffy goats are on their way! ”);


    Now save your document and refresh the page, and... oh! I am very impressed by
    your sort-a-road-sign thingy, warning everybody about what could be... the end
    of time!


    By the way, did you see that we place our alert before the document.write, and
    refreshed the page, the alert showed first, but you didn’t see the any of the
    text on your document just yet.


    That’s because javascript is operate as a queue. First in the first statement,
    then the second one... And so so on!


    Now you know all about writing and printing in your document, and all about annoying
    popups! As well as all about fluffy red goats.


    In the next chapter I’ll show you how to write comments.'
