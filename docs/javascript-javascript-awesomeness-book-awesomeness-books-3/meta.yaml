    ## 第 7 章

    变量


    你还记得在学校时，你的老师说过类似……X = 98


    然后她说：“丹尼刚刚吃了 X 个苹果”，


    你们都明白……你们都知道她指的是丹尼刚刚吞了 98 个苹果，对吧？变量就是这样工作的。


    变量就像存储数据的占位符。要使用变量，你需要声明并给它赋值。


    例如：


    ```javascript

    var x = 98;

    ```


    如果你想打印变量，使用：


    ```javascript

    document.write(x);

    ```


    如果你想使用字符串，必须用引号括起来：


    ```javascript

    var name = "gilad";

    document.write(name);

    ```


    记住，JavaScript 是区分大小写的。这意味着 `name` 和 `Name` 被认为是不同的变量。


    ## 第 8 章

    变量类型


    你还记得当你还是婴儿时，有这个形状的游戏，你需要对这些形状进行分类，并将每个形状放在合适的位置吗？就像那个游戏一样，JavaScript 有不同类型的变量。最常见的类型有：


    - 数字（Number）：用于像 9 这样的数值。

    - 字符串（String）：用于像 "gilad" 这样的文本。

    - 布尔值（Boolean）：用于真假值。


    当你声明一个变量时，你实际上是在为该数据创建一个容器。


    ```javascript

    var count = 9;

    var name = "gilad";

    var isHappy = true;

    ```

