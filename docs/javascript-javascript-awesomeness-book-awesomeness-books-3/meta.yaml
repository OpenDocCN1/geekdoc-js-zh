    ## Chapter 6

    Comments


    Ssshhh!!! I have to tell you a secret.


    Yesterday, I went to a fortune teller!


    I sat on the chair, and then she approaches me and said;


    “awauw… My dearly beloved almighty, awomely humble Gilad… I have to tell you something
    about your students...”


    And you know me, I care a big deal about my young padawans, so I asked... “what?”


    So she told me; "In the near future, they will be working on a project... as web
    developers!”


    And I was shocked! I said “WHAT??? Are you SURE? My students???


    So she said: “Wa… Wait, I didn’t get to the point yet!”. And I was like “oh… Yeah…
    well... Carry on”


    > …In the near future, they will be working on a project… As web developers… And
    be working with other web developers as well!!! “


    “Other web developers??? Other??? Are you sure??? Indeed.”


    So I ran quickly to my office and prepared this lecture.


    If you are about to work with other web developers, you will have to communicate
    with them properly, and there is no better option to do so, but with comments!


    Comments are for your own sole purpose, and for your colleagues as well.


    You see, Comments are not being rendered on the page, so you can write whatever
    you want, like “hey Jeff, don’t mention yesterday, I was really hungry..... your
    computer was the only thing that tastes like chicken! P.S, this line of code is
    getting everything from the database.


    So now you know why you need comments, but how can we do that?


    Simply write inside of your script tag two forward slash, and starting typing!


    Like that:


    ```

    // Hey Jeff!.... Sorry about your tasty chicken computer

    ```


    Save it, Refresh it, and.... It’s a christmas miracle! Just like we’ve expected:
    nothing renders

    Now me and my colleague Jeff would know about our little incident.


    But what about if I want to leave Jeff multi-line comment about what I ate for
    dinner… the list of things I’m allergic to... and why I always laugh like a crazy
    person when it rains?


    So in that case we would have one forward slash, followed by star. We write whatever
    we want to write, and then close it with star, and... another forward slash.


    ```

    /* Hey Jeff,

    Thanks for the present for christmas,

    however I feel like We are not in that phase

    of our relationship to sending each other

    Parking tickets.


    P.S. : This code is not working.


    P.S.S : we are out of milk. So get one one. thanks! */

    ```


    Hopefully, you would not work with Jeff, because he is a handful...


    But if you would or wouldn’t, at least now you know how to write Javascript comments.


    ## Chapter 7

    Variables


    Do you remember back in school when your teacher said something along the lines
    of... X = 98


    And then she said something like: "Danny just eat X apples",


    You all know... You all know she''s talking about Danny, that just swallowed 98
    apples, right? That''s exactly how variables work.


    Variables are like placeholders that store data. To use a variable, you need to
    declare it and assign it a value.


    For example:


    ```javascript

    var x = 98;

    ```


    If you want to print the variable, you use:


    ```javascript

    document.write(x);

    ```


    If you want to use a string, you must wrap it in quotation marks:


    ```javascript

    var name = "gilad";

    document.write(name);

    ```


    Remember, JavaScript is case-sensitive. This means `name` and `Name` are considered
    two different variables.


    ## Chapter 8

    Variable types


    Do you remember when you were a baby, you had this game of shapes, and you were
    supposed to sort those shapes and put every shape into its place? Just like that
    game, JavaScript has different types of variables. The most common types are:


    - Numbers: For numerical values like 9.

    - Strings: For text values like "gilad".

    - Booleans: For true or false values.


    When you declare a variable, you are creating a container for that data.


    ```javascript

    var count = 9;

    var name = "gilad";

    var isHappy = true;

    ```

