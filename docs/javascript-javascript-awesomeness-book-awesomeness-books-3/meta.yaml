  md: "# # Chapter 19\nFor loop\n\nBack in the days, and still in the Simpson's episodes,\
    \ there was a widespread punishment for naughty students. Writing like a gazillion\
    \ times what they did... For example... “I must not talk in class” or “I won’t\
    \ forget to do my homework again”... And stuff like that.\n\nSo today we will\
    \ break all the naughty students free, with our shiny new Machine, that write\
    \ lines for you!\n\nSo first of all let's make our document looks like chalkboard...\n\
    \n```\n<style>\nbody{background-color: #333333; color: #f0f0f0;}\n</style>\n```\n\
    \nAlright, first thing first, let’s see how we can repeat the same stuff over\
    \ and again...\n\nAnd to make that happen, we will use our brother-from-another-mother,\
    \ the “for loop”.\n\nThe for loop is a technique that lets loop through any code,\
    \ until you hit some sort of a counter... Let's write it down and I'll explain\
    \ it further:\n\n```\nfor(i=0; i < 10 ; i++) {\n  ##... CODE... \n}\n```\n\nAlright,\
    \ so to create a for loop, you have to write the word for, and open parenthesis().\
    \ Inside the parenthesis you have 3 sections divided by semicolons, the first\
    \ section you suppose to reset your counter. Because the for loop is running until\
    \ you hit that counter. The first section is to reset your counter, and you call\
    \ whatever you like, I named it i, that's short enough, and reset it to zero.\n\
    \nRight after, we have the second section. It all about telling the for loop “if\
    \ your condition is true... Well… just keep looping! will ya!” I wrote “i < 10\
    \ , which is in english: “as our counter ‘i’ is under 10, don’t mention it, just\
    \ keep looping…\n\nAnd in the last section, is the counter increment. Every after\
    \ loop, the do-plus-thing, which if you are remember, means “increment yourself\
    \ by one!”, so if your counter i is 0, after one loop will change to 1 , and then\
    \ to 2, and to 3 so on...\n\nAnd every time our middle section is satisfied, our\
    \ code here will keep on running.\n\nAlright, let's combine a lil’ bit of for\
    \ loops and functions, and create ourselves a Writing Line Machine!\n\n![](img/81eaa03c19eb495528381306284d8000_61_0.png)"
