  md: "# # Chapter 14\nReturn Statement\n\nIn the previous lectures we talked about\
    \ functions and our functions just did something, right?\nWe print things on the\
    \ screen, press one button and a message popped out, stuff like that...\nBut in\
    \ some cases you want your function to return some value, so you could use it\
    \ later.\nThat's why we have our return statement.\n\nLet's have an example:\n\
    \nWrite a function called BasicAddition, request 2 parameters, num1 and num2 .\
    \ It will return the addition of both of them.\n\n```\nfunction BasicAddition(num1,num2){\n\
    \  return num1 + num2;\n}\n```\n\nNow we will call the function, and we will place\
    \ the parameters 1 and 2. And we will expect to get the number 3 be out, right?\n\
    \nBasicAddition(1, 2);\n\nIf we will run it right now, nothing will shows.\nAnd\
    \ this is because we didn't tell our function to do anything with it. It didn't\
    \ print, and didn't even store it anywhere.\n\nLet's make a new variable, called\
    \ result . And we will get the result out of our BasicAddition function. And then,\
    \ we will print result to the page.\n\n```\nvar result = BasicAddition(1, 2);\n\
    document.write(result);\n```\n\nLet's save it and refresh it, and... bam! We've\
    \ got it!\n\nWe return the result of the number we added, we stored it on a variable\
    \ called result, and then, we used the variable called result, and print it on\
    \ the page."
