  md: '# Chapter 20

    Array


    So now we will learn Arrays.


    Sometimes you will want to list stuff on your Javascript, like a list of your
    user names, or

    dates, or whatever.


    In order to do that, you can surely declare a variable for every one of them,
    like var1

    , var2, var3, and so on... But it will be completely inefficient. (especially
    on bigger

    bigger, ...)


    So for that kind of task, we have Arrays.


    Arrays will store a list, but on just one variable.


    Let me show you what I mean, I will create an array of names. All you need to
    do is type

    " new " and then " Array \ and the Array word is something you have to type ,
    you cannot

    type whatever you want, that''s reserved name...


    You open parenthesis, and inside of those parentheses you write your variables
    , I will type an

    of string names as I said earlier.


    Big Tony, Amazing Bob, Cool Jeff, and Awesome Jane.


    ```

    var names = new Array("Big Tony", "Amazing Bob", "Cool Jeff", "Awesome Jane");

    ```


    Now let''s say I want to print on the screen the name Amazing Bob, what do I do
    ?


    I will write document.write, and then inside of our parenthesis I will write name,
    because

    that''s variable of our array, and then we want to access Bob.


    What we don''t know is that each every one of that array, has a secret index number,
    and

    instead of one, it starts with zero.


    So Big Tony will be indexed zero, Amazing Bob will be indexed one, Cool Jeff will
    be

    indexed as two, and Awesome Jane will be three.


    So to accessing Bob, we need to type index one, right?


    So to make that happened, we will open square brackets, and type 1.


    Let''s try it.


    ```

    document.write(names[1]);

    ```


    And here we go, we have Amazing Bob right there.


    And if we wanted to... get Awesome Jane printed on the screen... Let''s see what''s
    her index

    number... 0, 1, 2, 3.'
