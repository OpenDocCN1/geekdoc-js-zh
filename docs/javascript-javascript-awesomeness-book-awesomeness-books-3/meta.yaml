  mdcn: "\n\n与其在最后才调用，我们可以在按钮被点击时调用它。\n\n所以，为每个按钮添加一个 \"onclick\" 属性并将其设置为你的函数。记住，我们的函数需要一个奖品（prize）参数，因此将其设置为你想要的奖品。由于我们已经在\
