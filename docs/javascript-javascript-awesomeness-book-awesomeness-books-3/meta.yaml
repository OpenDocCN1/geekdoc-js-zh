  md: '# # Chapter 7

    Variables


    Do you remember back in school when your teacher said something along the lines
    of...

    X = 98


    And then she said something like:


    "Danny just eat X apples",


    You all know... You all know she''s talking about Danny, that just swallowed 98
    apples, right?

    That''s exactly how variables works on Javascript.


    Javascript Variables are like little placeholders, they store your data, and then
    if you want to use that data later, you will just call the variable name, and
