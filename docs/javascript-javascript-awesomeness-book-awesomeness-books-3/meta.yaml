    保存，刷新，然后……没错，宝贝！我们还很棒！


    现在我们知道我们有两种不同类型的变量。数字和字符串。它们之间的区别就在于那个小引号。


    在 javascript 中我们还有其他类型的变量，我们将在稍后的课程中介绍它们。


    ## 第 9 章

    使用不同类型的 `var`


    你知道 Javascript 可以帮你做家庭作业吗？


    如果我早早知道，，我会在 5 岁时就开始学 Javascript 了！


    这里有一个例子：


    ```javascript

    document.write(3 + 3);

    ```


    这在一年级可能会派上用场，你不觉得吗？


    嗯……让我们试试看……


    我将声明两个变量，第一个命名为 `num1` 并将其设置为 4，然后第二个将命名为 `num2`，并将其设置为数字 2。


    现在在 `document.write` 中，我将 `3+ 3` 替换为 `num1 + num2`，然后运行它。


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 + num2);

    ```


    好了……我们得到了 6。太棒了！我们学了新东西！我们实际上可以把变量加在一起！想象一下这些可能性！


    但我在想，如果我把……比方……4 改成 "4"，你知道的，作为一个字符串……会发生什么呢……


    好了，让我们戴上疯狂科学家的眼镜来试一下：


    ```javascript

    var num1 = "4";

    var num2 = 2;

    document.write(num1 + num2);

    ```


    噢，这太奇怪了……42？


    我的意思是，我知道生命、宇宙和万物的终极是 42，但是……我并没有在问那个……


    让我们看看发生了什么：


    首先，我们输入了 `num1` 等于 4。但由于我们在 4 周围加了引号，它会被认为一个“字符串”而不是数字。所以我们的浏览器在屏幕上打印了 4。然后，我们加上了
    2。但由于我们的 4 只是一个字符串，我们的浏览器并没有认为这是一道数学题，而是原封不动地把它到了屏幕上……


    所以我们可以轻松地把 4 替换为“我爱你”


    而且如果我们刷新页面，就能看到你的浏览器很爱你。


    浏览器！！！你这个傻瓜……


    ## 第 10 章

    数学运算符


    在数学中，我们有 4 种可以进行的各种基础运算。加、减、乘、除。


    在上一节课中，我们已经看到可以在 javascript 中相加数字。


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 + num2);

    ```


    除了基础加法外，我们在 Javascript 中还有另一种数学运算。让我们来看看剩下的。


    我们有减法：


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 - num2);

    ```


    你只需要写一个减号即可。


    如果你想乘乘数字，不要写字母 `x` 之类的，直接用星号代替：


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 * num2);

    ```


    那是乘法。


    我们也可以除法数字。你只需要输入一个正斜杠 `/`。


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 / num2);

    ```


    这就是除法。


    现在我给你们准备了一个额外奖励！假设你想让一个数字加 1。那么……当然……你可以输入像这样的代码：


    ```javascript

    var num1 = 4;

    document.write(num1 + 1);

    ```


    但是！如果你是一个像我一样的懒人，你可以使用简写来这样做：！


    ```javascript

    var num1 = 4;

    document.write(num1++);

    ```


    或者如果我们想让一个数字减少，可以这样：


    ```javascript

    var num1 = 4;

    document.write(num1--);

    ```


    加加号 `++` 符号（还有减减号 `--`）会将你的数字增加或……减少吗？（我们可以说是减少吗？）增加 1。它既短又好，我们以后在遇到更复杂的内容时，也会看到它！


    ## 第 11 章

    函数


    这是一个真实故事：当我第一次离开父母家时，我有一个……呃……小小的……真的……问题。好吧，你懂吗？我讨厌打扫卫生，当我第一次离开父母家时，没有人帮我打扫了（啊！）。所以过了一两天，我的水槽里堆满了脏碗，床上一到处是脏衣服，地板完全是一团糟，我的猫也没帮上什么忙（喵！）。


    所以我所做的第一件事就是找来那些机器人。

