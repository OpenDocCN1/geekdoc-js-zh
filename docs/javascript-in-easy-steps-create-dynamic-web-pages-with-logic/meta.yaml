  md: '# Controlling location


    The window.location object contains the full URL address of the document that
    is currently loaded in the browser.


    It stores the actual full URL in the window.location.href property and assigning
    a new value to this, or to the window.location object itself, will load the specified
    URL into the browser.


    A typical URL address may comprise these parts:


    ```

    protocol: // host / pathname ? # hash

    ```


    Each part of the URL address stored in the window.location object may be addressed
    individually using the appropriate location property – as demonstrated in this
    example:


    ```

    // assign each part of the current URL to Variables

    var locn = "Href : " + window.location.href;

    var prot = "Protocol : " + window.location.host;

    var host = "Host : " + window.location.host;

    var path = "Path : " + window.location.pathname;

    var hash = "Hash : " + window.location.hash;


    // display the variable values

    alert(locn+"\n"+prot+"\n"+host+"\n"+path+"\n"+hash+"\n")

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_103_0.png)


    > **Hot tip**

    Assigning a new value to location.hash will move the browser to the given location
    in the page.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_103_1.png)'
  merge: -1
  pgno: 103
- img_proc: true
  md: "# ...cont'd\n\nThe window.history property contains an array of the URL addresses\
    \ previously visited during a browser session. For security reasons these are\
    \ not directly readable but they are used to navigate back to previous pages.\n\
    \nThe back() and forward() methods of the window.history object emulate the browser's\
    \ Back and Forward buttons.\n\nMore flexible navigation is often provided by the\
    \ window.history.go() method that takes a single argument to specify the location\
    \ by relative position. For instance, an argument value of -1 will revert the\
    \ previous page and a value of -2 reopens the page before.\n\nIn a similar manner\
    \ window.history.go(1) goes forward to the next page in the history array of visited\
    \ URLs.\n\nCalling window.history.go(0) causes the browser to reload the current\
    \ document.\n\nThe function in this example returns the user to the previous page.\
    \ In this case the function is called from the onclick attribute of a button form\
    \ input in the HTML document.\n\n```\n// a function to load the previous page\n\
    function go_back() {\n  window.history.go(-1);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_104_0.png)\n\
    \nhistory-2.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_104_1.png)"
