    \n# 识别时区\n\nJavaScript 可以使用 `Date.getTimezoneOffset()` 方法确定用户所在的时区。\n\n该方法从 `Date`\
    \ 对象获取本地时间并将其与 UTC 时间进行比较。返回值是以分钟为单位的差，因为某些国家的时区不是常规的一小时一个间隔。\n\n在下面的示例中，`Date.getTimezoneOffset()`\
