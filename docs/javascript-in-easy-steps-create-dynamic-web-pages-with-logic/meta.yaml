- img_proc: true
  md: '# Getting the date and time


    Date and time are often used in JavaScript to customize the performance of a web
    page. For example, a script might welcome a user with a greeting appropriate to
    the current time:


    ![](img/9706759b347c5727cfdd3d09614f8c1f_59_0.png)


    The script for this application is contained in the example shown on page 60.


    The date and time that are used in JavaScript are taken from the clock and calendar
    in the host system that is running the browser application in which the script
    is loaded.


    To access the system clock information the script must first create a Date object.
    This is achieved in the same manner in which an Array object is created, using
    the JavaScript new keyword, but now with the JavaScript Date() constructor function.
    The example below creates and displays a new Date object:


    ```

    // create a new Date object

    var now = new Date();

    ```


    ```

    // display the Date object''s date and time information

    alert(now);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_59_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_59_2.png)'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Extracting date components


    The Date object has special methods that may be used to retrieve individual parts
    of the date information.


    Some methods return the date information as an index number that often needs to
    be converted by the script.


    The Date.getDay() method returns the day of the week as an index value from 0
    (Sunday) to 6 (Saturday).


    Also the Date.getMonth() method returns the month of the year as an index value
    from 0 (January) to 11 (December).


    The example below illustrates the Date object and uses two arrays to display the
    correct day and month names:


    ```

    // create an array of day names and month names

    var days = new Array("Sun", "Mon", "Tue", "Wed",

    Thu", "Fri", "Sat");


    var months = new Array("Jan", "Feb", "Mar", "Apr",

    "May", "Jun", "Jul", "Sep", "Oct", "Nov", "Dec");


    var now = new Date(); // create a new Date object

    var yy = now.getFullYear();

    if(yy < 2000) yy -= 1900; // adjust year for Mozilla

    var mm = now.getMonth(); // get the month no.

    mm = months[mm];

    var dd = now.getDate(); // get day. in the month

    var dy = now.getDay(); // get day. in the week

    days = days[dy]; // convert day no. to name

    ```


    ```

    // display the extracted date and date information

    alert("date " + " " + mm + " " + dd + " " + yy);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_60_0.png)


    Beware indexing starts at 0, zero not - so the index number for March is 2 not3.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_60_1.png)


    date.js


    ![](img/9706759b347c5727cfdd3d09614f8c1f_60_2.png)


    Hot tip Mozilla browsers report the year as the number of years elapsed since
    1900 - so in this case line of script adds 1900 to the reported date.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_60_3.png)'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Extracting time components


    The Date object has special methods to access the time information that it contains.
    The example below gets the current hours, minutes, seconds and milliseconds from
    the host clock and displays a welcome message appropriate for the time of day:


    ```

    // create a new Date object

    var now = new Date();


    // extract the time information

    var hh = now.getHours();

    var mn = now.getMinutes();

    var ss = now.getSeconds();

    var ms = now.getMilliseconds();


    // default welcome message

    var hi = "Good Morning";

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_61_0.png)


    ```

    // welcome message if after noon

    if( hh > 11 ) hi = "Good Afternoon";

    ```


    ```

    // welcome message if after 6 p.m.

    if( hh > 17 ) hi = "Good Evening";

    ```


    ```

    // display welcome message and the current time

    tvar tim = hi + "Hours: " +hh + "\n";

    tim += "Minutes: " +mn + "\n";

    tim += "Seconds: " +ss + "." +ms+\;

    alert(tim);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_61_1.png)


    The hours are returned as numbers 0-23 in 24-hour format.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_61_2.png)'
  merge: -1
