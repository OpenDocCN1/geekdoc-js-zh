    \nstyle.js\n\n...续\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_162_0.png)\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_162_1.png)\n\n## 切换可见性\n\n`style` 对象有一个\
    \ `visibility` 属性，可以用 JavaScript 来判断浏览器是否应该显示该对象。将对象属性赋值为 `hidden` 会使对象不可见，而将\
