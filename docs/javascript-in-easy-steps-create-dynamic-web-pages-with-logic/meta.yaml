  md: "# Continue statement\n\nThe JavaScript continue keyword is used to break the\
    \ current iteration of a loop.\n\nJust like the break keyword, the continue keyword\
    \ is situated inside the statement block containing the code that the loop should\
    \ execute, preceded by a conditional test.\n\nWhen the continue condition is met\
    \ the continue keyword immediately stops the current iteration of the loop, but\
    \ further iterations will be made until the loop ends.\n\nIn the example below\
    \ the test condition is met when the counter value reaches three so the string\
    \ concatenation in iteration is not applied but the loop continues on:\n\n```\n\
    var i = 0, str = \"\"\\n// loop until the counter hits 5\nwhile(i < 5)\n  i++;\n\
    \  if(i == 3)continue;\n  str += i + \" \";\n```\n\n// display final value and\
    \ all series numbers\\nalert(\"CONTINUE\\n\\nLoop stopped:\" + i + \"\\n\\nSeries:\"\
    \ + str);\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_46_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_46_1.png)\n\
    \nThe loop counter should be incremented before the continue condition is tested\
    \ to avoid creating an infinite loop."
  merge: -1
