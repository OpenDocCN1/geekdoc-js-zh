  md: "# ...cont'd\n\nJavaScript functions may contain multiple arguments if they\
    \ are separated by commas.\n\nThe number of arguments defined when the function\
    \ is declared must be exactly matched by the number of arguments contained in\
    \ any call to that function.\n\nThis example declares a function containing two\
    \ arguments – so any call to it must contain three argument values:\n\n```\n//\
    \ create three variables\nvar a, b, c;\n\n// a function to display three concatenated\
    \ arguments\nfunction call_alert(str1, str2, str3) {\n  a = str1;\nb = str2;\n\
    c = str3;\n  alert(a + b + c);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_20_0.png)\n\
    \nThe caller passes three strings to the function although the value of the second\
    \ string is merely a space:\n\n```\n<body onload = \"call_alert('Great', '', 'JavaScript')\"\
    >\n```\n\nThe function assigns the argument values to three global variables and\
    \ then calls alert() to display the global values as a single concatenated string.\n\
    \n> Hot tip\nThe Var keyword can be used to declare multiple variables by separating\
    \ the variable names with commas.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_20_1.png)"
