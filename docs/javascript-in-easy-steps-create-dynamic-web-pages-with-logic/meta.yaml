    # Data types


    JavaScript is a loosely typed language so its variables can store numbers, text
    strings or boolean values (i.e. true or false).


    This is unlike other programming languages such as C++ and Java where you need
    to declare variables of a specific data type and can only store the data of the
    declared type.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_15_0.png)


    ```

    // initialize a number variable

    var a = 0.06;


    // initialize a string

    var b = "JavaScript in easy steps";


    // initialize a boolean variable

    var c = false;


    // display the data type of each variable

    alert( typeof a + "\n" + typeof b + "\n" + typeof c);

    ```


    The example above creates variables with initial values of the three different
    data types supported by JavaScript.


    These three values are first passed to the alert() function; then the JavaScript
    keyword typeof is used to return their data types for display in the alert dialog
    box shown below.


    The code + "\n" + inside the parentheses just displays the output for each value
    on a new line in the alert dialog box.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_15_1.png)


    Hot tip

    Notice that JavaScript makes no distinction between integer numbers and floating-point
    numbers.'
  - '[PAGE 16]


    # Escape sequences


    When a character in a string is preceded by the \ backslash character there is
    a special effect on the character immediately following the backslash. This is
    known as an escape sequence as it allows the character to escape recognition as
    part of the JavaScript syntax.


    The table below lists more escape sequences:


    | b | Backspace |

    | \f | Form feed |

    | \n | New line |

    | \r | Carriage return |

    | \'' | Single quote |

    | \" | Double quote |

    | \\ | Single backslash character |


    > Hot tip

    The code example on the facing page uses the \n newline escape.


    The escape sequence \" is useful to incorporate quotation marks within a string
    without the string itself becoming terminated, as in this example:


    ```

    // display the string with escaped quotes

    alert("We all say \"JavaScript is great!\" " ");

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_16_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_16_1.png)'
- md: "\n## Functions\n\nA function is a piece of JavaScript code that can be executed\
    \ once or many times by the JavaScript application. Functions and variables form\
    \ the basis of all JavaScript programming.\n\nThis is how a function looks:\n\n\
    ```javascript\n// a function to display a message in an alert dialog\nfunction\
    \ call_alert()\n{\n  alert(\"My First JavaScript Function\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_17_0.png)\n\
    \nCreate a new function using the JavaScript function followed by a given identifier\
    \ name. The name must be unique within the script and adhere to the same naming\
    \ conventions that apply to the naming of variables.\n\nAlways try to give meaningful\
    \ names to functions and variables, describing their purpose.\n\nThe name is always\
    \ followed by a pair of parentheses (), and then a pair of curly braces { } containing\
    \ the code to be executed.\n\nIn the example, the function has been named call_alert()\
    \ and the code to be executed will call the JavaScript alert() function to display\
    \ an alert dialog box containing a message.\n\nThe function can be called from\
    \ anywhere in the JavaScript file or in the HTML document to execute the statement\
    \ that it contains.\n\nFor the instance, the onload attribute of the HTML body\
    \ tag can be used to call the function when the document is loaded into the browser,\
    \ like this:\n\n```html\n<body onload = \"call_alert()\">\n```\n\n> Don't forget\n\
    Remember to include the parentheses () when referring to a function.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_17_1.png)\n\
    \nJavaScript functions may call other functions during the execution of their\
    \ code in just the same way that the previous examples called the JavaScript alert()\
    \ function.\n\nThe following example demonstrates the use of multiple functions\
    \ calling other functions:\n\n```javascript\n// a function to call a second function\n\
    function first_function()\n{\n  second_function();\n}\n```\n\n```javascript\n\
    // a function to call a third function\nfunction second_function()\n{\n  third_function();\n\
    }\n```\n\n```javascript\n// a function to display a message\nfunction third_function()\n\
    {\n  alert(\"Easy multiple functions\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_18_0.png)\n\
    \nThe first function is called when the page loads. This calls upon the second\
    \ function that, in turn, calls upon the third function to display a simple alert\
    \ dialog message:\n\n```html\n<body onload = \"first_function()\">\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_18_1.png)\n\
    \n## Function arguments\n\nThe parentheses ( ) that follow the names of all functions\
    \ may be used to contain data for use in the code to be executed, just as the\
    \ parentheses of the JavaScript alert() function contain the string to be displayed\
    \ in the alert dialog box it creates.\n\nThe data contained within the parentheses\
    \ is known as the function's \"argument\".\n\nIn the example below the function\
    \ call passes a text string to the argument named str in the call_alert() function\
    \ for use in the code that is to be executed:\n\n```javascript\n// a function\
    \ to display the value of a passed\n// argument\nfunction call_alert( str )\n\
    {\n  alert( str);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_19_0.png)\n\
    \nIt is important to note that the string contained inside the call to this function\
    \ is enclosed in single quotes to differentiate it from the double quotes used\
    \ to contain the entire call:\n\n```html\n<body onload = \"call_alert('Passed\
    \ Value')\">\n```\n\nUsing double quotes for both would mean that the onload attribute\
    \ value would be \"call_alert\" because the string is terminated by the second\
    \ double quote. This would create a browser error and the function would not be\
    \ executed.\n\nThe use of single and double quotes in this manner appears throughout\
    \ JavaScript programming in several ways.\n\n> Hot tip\nstr is often used in JavaScript\
    \ as a variable name for strings.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_19_1.png)\n\
    \n## ...cont'd\n\nJavaScript functions may contain multiple arguments if they\
    \ are separated by commas.\n\nThe number of arguments defined when the function\
    \ is declared must be exactly matched by the number of arguments contained in\
    \ any call to that function.\n\nThis example declares a function containing two\
    \ arguments – so any call to it must contain three argument values:\n\n```javascript\n\
    // create three variables\nvar a, b, c;\n\n// a function to display three concatenated\
    \ arguments\nfunction call_alert(str1, str2, str3) {\n  a = str1;\n  b = str2;\n\
    \  c = str3;\n  alert(a + b + c);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_20_0.png)\n\
    \nThe caller passes three strings to the function although the value of the second\
    \ string is merely a space:\n\n```html\n<body onload = \"call_alert('Great', '',\
    \ 'JavaScript')\">\n```\n\nThe function assigns the argument values to three global\
    \ variables.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_20_1.png)\n\n## Variable\
    \ scope\n\nThe extent to which a variable is accessible is called scope and is\
    \ determined by where it is declared.\n\nA variable declared inside a function\
    \ block is only accessible by code within that function – this is known as “local”.\n\
    \nThe example below shows function blocks that contain local variables:\n\n```javascript\n\
    // a function to display the value of a passed argument\nfunction call_alert(str)\n\
    {\n  var str = \"Hello\";\n  alert(str);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_21_0.png)\n\
    \nA variable declared outside a function block is accessible to all functions\
    \ within the script – this is known as “global”.\n\n## Summary\n\n- JavaScript\
    \ is a programming language whose code is interpreted by the JavaScript engine\
    \ within a web browser.\n- JavaScript code can be contained within a <script>\
    \ block in an HTML document, or in a separate JavaScript file.\n- Calling the\
    \ intrinsic alert() function will open an alert dialog box in the browser – displaying\
    \ the argument specified within its parentheses.\n- JavaScript is a case-sensitive\
    \ language that recognizes “ALERT”, “Alert” and “alert” as entirely different\
    \ words.\n- Single-line comments can be added to a script after // and multi-line\
    \ comments can be added between /* and */.\n- Keywords cannot be used to name\
    \ variables, functions or labels.\n- The JavaScript var keyword is used to create\
    \ a new variable to store any data type – string, number or boolean value.\n-\
    \ Escape sequences are useful to insert characters that are not to be interpreted\
    \ by the JavaScript engine.\n- The JavaScript function keyword is used to create\
    \ a new function that can be called at any time to execute its statements.\n-\
    \ A function block may contain statements that call other functions.\n- The statement\
    \ calling a function may specify one or more values to be passed to the function\
    \ as arguments within its parentheses.\n- Local variables are declared inside\
    \ a function block and are only accessible by code within that function.\n- Global\
    \ variables are declared outside function blocks and are accessible to all functions\
    \ within the script.\n"
  mdcn: "\n\n## Functions\n\n函数是一段 JavaScript 代码，可以被 JavaScript 应用执行一次或多次。函数和变量是所有\
    \ JavaScript 编程的基础。\n\n函数的格式如下：\n\n```javascript\n// 一个在警报对话框中显示消息的函数\nfunction\
    \ call_alert()\n{\n  alert(\"My First JavaScript Function\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_17_0.png)\n\
    \n使用 JavaScript `function` 关键字加上给定的标识符名称来创建一个新函数。该名称在脚本中必须是唯一的，并遵循与变量命名相同的命名规范。\n\
    \n始终尝试为函数和变量起有意义的名字，以描述它们的用途。\n\n名称后面总是跟着一对括号 `()`，然后是一对包含要执行代码的大括号 `{ }`。\n\n\
    在在示例中，该函数被命名为 `call_alert()`，要执行的代码将调用 JavaScript 的 `alert()` 函数来显示一个包含消息的警报对话框。\n\
    \n可以在 JavaScript 文件或 HTML 文档的任何地方调用该函数以执行其包含的语句。\n\n例如，可以使用 HTML body 标签的 `onload`\
    \ 属性在文档加载到浏览器时调用该函数，如下：\n\n```html\n<body onload = \"call_alert()\">\n```\n\n\
    > 别忘记\n记住在引用函数时要包含括号 `()`。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_17_1.png)\n\
    \nJavaScript 函数在执行其代码期间可以调用其他函数，就就像之前的示例调用 JavaScript `alert()` 函数的方式一样。\n\n下面的示例演示了多个函数调用其他函数的用法：\n\
    \n```javascript\n// 一个调用第二个函数的函数\nfunction first_function()\n{\n  second_function();\n\
    }\n```\n\n```javascript\n// 一个调用第三个函数的函数\nfunction second_function()\n{\n  third_function();\n\
    }\n```\n\n```javascript\n// 一个显示消息的函数\nfunction third_function()\n{\n  alert(\"\
    Easy multiple functions\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_18_0.png)\n\
    \n第一个函数在页面加载时被调用。这调用了第二个函数，而第二个函数又调用了第三个函数来显示简单的警报对话框消息：\n\n```html\n<body onload\
    \ = \"first_function()\">\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_18_1.png)\n\
    \n## Function arguments\n\n所有函数名称后的括号 `()` 可用于用于待执行代码的数据，就像 JavaScript `alert()`\
    \ 函数的括号包含了要在其创建的警报对话框中显示的字符串一样。\n\n括号内的数据被称为函数的“参数”（argument）。\n\n在下面的示例中，函数调用将一个文本字符串传递给\
    \ `call_alert()` 函数中名为 `str` 的参数，用于供待执行的代码：\n\n```javascript\n// 一个显示传递的\n// 参数值的函数\n\
    function call_alert( str )\n{\n  alert( str);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_19_0.png)\n\
    \n需要注意的是，调用此函数内部的字符串被单引号包裹，以区别于用于包含整个调用的双引号：\n\n```html\n<body onload = \"call_alert('Passed\
    \ Value')\">\n```\n\n如果对两处都使用双引号，则意味着 `onload` 属性的值将是 `\"call_alert\"`，因为字符串会被第二个双引号终止。这将导致浏览器错误且函数将不会被执行。\n\
    \n这种方式的单引号和双引号的使用在 JavaScript 编程中以多种方式出现。\n\n> 小贴士\n`str` 在 JavaScript 中经常用作字符串的变量名。\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_19_1.png)\n\n## ...cont'd\n\n如果参数之间用逗号分隔，JavaScript\
    \ 函数可以包含多个参数。\n\n在声明函数时定义的参数数量必须与该函数的任何调用包含的参数数量完全匹配。\n\n此示例声明了一个包含两个参数的函数——因此对它的任何调用必须包含三个参数值：\n\
    \n```javascript\n// 创建三个变量\nvar a, b, c;\n\n// 一个显示三个连接参数的函数\nfunction call_alert(str1,\
    \ str2, str3) {\n  a = str1;\n  b = str2;\n  c = str3;\n  alert(a + b + c);\n\
    }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_20_0.png)\n\n调用者向函数传递了三个字符串，尽管第二个字符串仅仅是一个空格：\n\
    \n```html\n<body onload = \"call_alert('Great', '', 'JavaScript')\">\n```\n\n\
    函数将参数值分配给三个全局变量。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_20_1.png)\n\n## Variable\
    \ scope\n\n变量可访问的范围被称为作用域（scope），由它的声明位置决定。\n\n在函数块内部声明的变量仅供该函数内部的代码——这被称为“局部”（local）。\n\
    \n下面的示例显示了包含局部变量的函数块：\n\n```javascript\n// 一个显示传递的参数值的函数\nfunction call_alert(str)\n\
    {\n  var str = \"Hello\";\n  alert(str);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_21_0.png)\n\
    \n在函数块外部声明的变量对脚本中的所有函数都是可见的——这被称为“全局”（global）。\n\n## Summary\n\n- JavaScript 是一种编程语言，其代码由\
    \ Web浏览器内的 JavaScript 引擎解释。\n- JavaScript 代码可以包含在 HTML 文档的 `<script>` 块中，也可以包含在单独的\
    \ JavaScript 文件中。\n- 调用内置的 `alert()` 函数将在浏览器中打开一个警报对话框——显示其括号内指定的参数。\n- JavaScript\
    \ 是一种区分大小写的语言，它将“ALERT”、“Alert”和“alert”识别为完全不同的单词。\n- 可以在 `//` 之后添加单行注释，可以在 `/*`\
    \ 和 `*/` 之间添加多行注释。\n- 关键字不能用于命名变量、函数或标签。\n- JavaScript `var` 关键字用于创建一个新变量以存储任何数据类型——字符串、数字或布尔值。\n\
    - 转义序列用于插入不被 JavaScript 引擎解释的字符。\n- JavaScript `function` 关键字用于创建一个新函数，该函数可以随时调用以执行其语句。\n\
    - 函数块可以包含调用其他函数的语句。\n- 调用函数的语句可以在其括号内指定一个或多个值作为参数传递给函数。\n- 局部变量声明在函数块内部，仅供该函数内部可见。\n\
    - 全局变量声明在函数块外部，对脚本中的所有函数均可见。\n\n"
