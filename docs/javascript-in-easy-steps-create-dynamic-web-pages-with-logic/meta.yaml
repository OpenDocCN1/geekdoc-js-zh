  md: '# JavaScript Terms


    Script block


    All the JavaScript code and comments between HTML <script> and </script> tags


    Variable


    A container used in JavaScript code to store a number, text string, character
    or boolean value (true/false)


    Initialize


    Assign an initial value to a JavaScript variable – either upon its declaration
    or later in the script


    Call


    Invoke a JavaScript function by citing the function''s name within a script


    Function


    A piece of JavaScript code that is defined once in a script block but may be called
    many times


    Argument


    Value that can be passed to a function by a caller for use in the code to be executed


    Expression


    Code that combines variable or literal values with one or more JavaScript operators
    to produce a result


    Statement


    A single complete JavaScript instruction that is always terminated by a semicolon


    Statement block


    The JavaScript statements that are to be executed by a function whenever it is
    called


    For loop


    Statement that repeatedly executes some JavaScript code for a given number of
    times


    While loop


    Statement that repeatedly executes some code in JavaScript while a test condition
    is satisfied


    Conditional branching


    A statement that will only execute a piece of code if a test condition is satisfied,
    or an alternative piece of code otherwise


    Multi-way branching


    Statement that evaluates an expression and then executes a piece of code associated
    with that result, or default code


    Return


    The final result of statements executed in a JavaScript function and passed back
    to the caller


    DHTML


    An acronym for Dynamic HTML – technique of using JavaScript to manipulate the
    size, position and appearance of HTML elements


    AJAX


    An acronym for Asynchronous JavaScript And XML – the technique of using JavaScript
    alongside other technologies to enable web page components to be dynamically updated


    Visit www.ineasystems.com to download source code of the examples in this book
    and to discover any essential updates.'
