  md: '# # Calculating string length


    A string in JavaScript is simply zero or more characters enclosed within quotes,
    those are all strings:


    ```

    var str1 = "My First String";

    var str2 = "";

    var str3 = "2";

    var str4 = "null";

    ```


    The empty quotes in str2 define the variable as being a string type regardless
    of the string value. The numeric value assigned to str3 is automatically converted
    to a string type when enclosed in quotes, and the JavaScript null keyword is just
    a string literal when enclosed by quotes.


    > **Don''t forget**nA space is counted as a character too.


    Essentially a string is a collection of characters, each character containing
    its own data, just like elements in a defined array.


    It is logical to regard a string as an array of characters and apply array characteristics
    when using strings.


    The example below parallels the Array.length property with the String.length property:


    ```

    // create and initialize a string variable

    var a = "JavaScript Strings";


    // display the length of the string

    alert("String length is " + a.length);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_81_0.png)


    string-length.js


    ![](img/9706759b347c5727cfdd3d09614f8c1f_81_1.png)'
