  md: "# # Discovering Unicode values\n\nAll characters can be returned for each individual\
    \ character in a string with the String.charCodeAt() method. This method requires\
    \ the index of the character within the string as its argument. Conversely characters\
    \ can be obtained from Unicode using the JavaScript String.fromCharCode() function,\
    \ which takes the Unicode value as its argument.\n\nThe example below first loops\
    \ through a string and makes a comma-delimited string of its Unicode character\
    \ values. An array of these Unicode numerical values is created for the second\
    \ loop to return the character for each number:\n\n```\n// create and initialize\
    \ three strings\nvar str = \"Code Fun\", enc = \"\", unc = \"\";\n\n// get the\
    \ String numbers, comma delimited\nfor(var i = 0; i < str.length; i++) {\n  enc\
    \ += str.charCodeAt(i) + \",\";\n}\n\n// split the list of the numbers into array\
    \ elements\nvar ss = enc.split(\".\");\n\n// convert the Unicode values back to\
    \ characters\nfor(var i = 0; i < ss.length; i++) {\n  unc += String.fromCharCode(ss[i]);\n\
    }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_88_0.png)\n\nunicode.js\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_88_1.png)\n\nNotice that the charCodeFrom\
    \ function is a property of the String() constructor and is not a string object\
    \ method. See the next chapter for more about objects in JavaScript.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_88_2.png)\n\
    \nalert(\"Encoded : \" +enc + \"\\nUnencoded : \" +unc);"
  merge: -1
