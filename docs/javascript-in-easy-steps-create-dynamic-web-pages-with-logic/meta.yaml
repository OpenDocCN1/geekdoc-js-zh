    # Performing operations


    All the common JavaScript operators are detailed in this chapter.


    - 24 Arithmetical operators

    - 26 Logical operators

    - 28 Assignment operators

    - 30 Comparison operators

    - 32 Conditional operator

    - 34 Summary


    # Arithmetical operators


    The arithmetical operators commonly used in JavaScript are listed in the table
    below with the operations they perform:


    | Operator | Operation |

    |---|---|

    | + | Addition (and concatenates strings) |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus |

    | ++ | Increment |

    | -- | Decrement |


    Notice that the + operator has two types of operation depending on the given operands.
    It will add together two numeric values and give the result of the addition. It
    will also join two string values and return the concatenated string, as in the
    example on the facing page.


    The % modulus operator will divide the first given number by the second number
    and return the remainder. This is most useful to determine whether a number has
    an odd or an even value.


    The ++ increment and -- decrement operators alter the given value by 1 and return
    the new value. These are most commonly used to count iterations in a loop.


    All the other operators act as you would expect but care should be taken to bracket
    expressions where more than one operator is used, to clarify the operations:


    ```

    a = b * c - d % e / f; // This is unclear

    a = (b * c) - ((d % e) / f); // This is clearer

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_25_0.png)


    Code using the modulus operator to test for odd or even values can be found in
    the if statement example on page 36.


    # ...cont''d


    ```

    var addnum = 20 + 30; // add

    var addstr = "I love " + "JavaScript"; // concatenate

    var sub = 35.75 - 28.25; // subtract

    var mul = 8 * 50; // multiply

    var mod = 65 % 2; // modulus

    var inc = 5 ; inc = ++inc; // increment

    var dec = 5 ; dec = --dec; // decrement

    var result = "Addnum is " + addnum + "\n";

    result += "Addstr is " + addstr + "\n";

    result += "Sub is " + sub + "\n";

    result += "Mul is " + mul + "\n";

    result += "Mod is " + mod + "\n";

    result += "Inc is " + inc + "\n";

    result += "Dec is " + dec + "\n";

    alert ( result );

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_26_0.png)


    > Beware

    > The increment and decrement operators may also be used following the operand.
    Note that in those cases they will perform the operation but only return the unoperated
    value.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_26_1.png)


    # Logical operators


    The three logical operators that can be used in JavaScript are listed in the table
    below:


    | Operator | Operation |

    |---|---|

    | && | Logical AND |

    | || | Logical OR |

    | ! | Logical NOT |


    The logical operators are used with operands that have the boolean values of true
    or false – values that can convert to true or false.


    The logical && operator will evaluate two operands and return true only if both
    operands themselves are true. Otherwise the && operator will return false.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_27_0.png)


    There is an example of conditional branching in the section about the conditional
    operator on page 32.


    Unlike the && operator, which needs both operands to be true, the || operator
    will evaluate its two operands and return true if one of the operands itself returns
    true. If neither operand returns true || will return false. This is useful in
    a JavaScript application to perform a certain action if one of two conditions
    has been met.


    The third logical operator, !, is a unary operator that is used before a single
    operand. It returns the inverse value of the given operand, so if a variable has
    a value of true then ! would have a value of false. It is useful in JavaScript
    applications to toggle the value of a variable in successive iterations with a
    statement like a++. This will ensure that on each pass the value is changed –
    like a light switch on and off.


    # ...cont''d


    ```

    // assign two values

    var a = true;

    var b = false;


    // store both current values

    var result = "a = " + a + " b = " + b;

    ```


    ```

    // test if both values are true

    var both_test = (a && b);

    // and store the result

    result += "\nAre values true? " + both_test;

    ```


    ```

    // test if either operand is true

    var either_test = (a || b);

    // and store the result

    result += "\nis either value true? " + either_test;

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_28_0.png)


    ```

    // toggle both values

    a = !a;

    b = !b;


    // store the new current values

    result += "\na = " + a + " b = " + b;

    ```


    # Hot tip

    The += operator, used here to add more characters to the result string, is explained
    on the next page.


    ```

    // display the stored information

    alert( result );

    ```


    # Hot tip

    Use a newline escape, and spaces, to format the displayed output.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_28_1.png)


    # Assignment operators


    The operators that are commonly used in JavaScript to assign values are all listed
    in the table below. All except the simple assignment operator are shorthand forms
    of longer expressions equivalent is also given for clarity.


    | Operator | Example | Equivalent |

    | --- | --- | --- |

    | = | a = b | a = b |

    | += | a += b | a = (a + b) |

    | -= | a -= b | a = (a - b) |

    | *= | a *= b | a = (a * b) |

    | /= | a /= b | a = (a / b) |

    | %= | a %= b | a = (a % b) |


    It is important to think of = operator as “assign” rather than “equals” to avoid
    confusion with the == operator.


    In the example in the table the variable a is assigned the value that is contained
    in the variable b to become its new value.


    The += operator is most useful and has been used in earlier examples to add a
    second string to an existing string. In the table example the += operator adds
    the value contained in the variable a to the value contained in variable b and
    then assigns the result to become the new value contained in variable a.


    All other operators work in the same way as by performing the arithmetical operation
    between the two values first, and then assigning the result to the first variable
    to become its new value.


    # ...cont''d


    ```

    var a = "JavaScript", b = "Code"; // assign

    a += b; // concatenate and assign to a

    var c = 8, d = 4; // assign integer values

    c += d; // add and assign result to c

    var e = 7.5, f = 2.25; // assign floating-point

    e -= f; // subtract and assign result to e

    var g = 8, h = 4; // assign integers

    g *= h; // multiply and assign result to g

    var i = 8, j = 4; // assign integers

    i /= j; // divide and assign result to i

    var k = 8, l = 4; // assign integers

    k %= 1; // divide and assign remainder to k

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_30_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_30_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_30_2.png)


    The results are displayed using the alert() function, as before, but that part
    of the code has been omitted to save space.


    # Comparison operators


    The operators that are commonly used in JavaScript to compare two values are all
    listed in the table below:


    | Operator | Operation |

    | --- | --- |

    | == | Equality |

    | != | Inequality |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    The == equality operator compares two operands and will return true if they are
    equal in value. If both are the same number they are equal, and if both are strings
    containing the same characters in the same positions they are equal. Boolean operands
    that are both true, or both false, are equal.


    Conversely, the != operator returns true if two operands are not equal using the
    same rules as the ==.


    Equality and inequality operators are useful in testing the state of two variables
    to perform conditional branching.


    The > greater than operator compares two operands and will return true if the
    first is greater in value than the second.


    The < less than operator makes the same comparison but will return true if the
    first operand is less in value than the second.

