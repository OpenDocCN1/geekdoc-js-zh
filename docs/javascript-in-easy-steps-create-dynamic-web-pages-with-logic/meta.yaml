- img_proc: true
  md: "# ...cont'd\n\nThe viewer of the site containing the previous script would\
    \ doubtless feel aggrieved at the constant alert box messages. It may be better\
    \ to show the message only a couple of times and then stop calling the `timeout()`\
    \ function. The `window.setTimeout()` method can be cancelled using the `window.clearTimeout()`\
    \ method. In order to clear the timer correctly it is necessary to assign the\
    \ original `window.setTimeout()` call to a variable – so that the variable can\
    \ be passed to the `window.clearTimeout()` call argument.\n\nThe following example\
    \ displays a message twice, and then displays a final message when the timer is\
    \ cleared:\n\n```\n// create a counter variable and a timer variable\nvar num\
    \ = 0, tim;\n\nfunction timeout() {\n{\n  num++;\n  if(num == 3) {\n    alert(\"\
    OK - I told you twice\");\n    window.clearTimeout(tim); // cancel the timer\n\
    \  }\n  else {\n    alert(\"This is 10-Second Message No : \" + num);\n    tim\
    \ = window.setTimeout(\"timeout\", 10000);\n  }\n}\nntimeout();\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_68_0.png)\n\
    \ntwo-times.js\n\n> Hot tip\n\nThe variable name tim is often used to name the\
    \ timer variable.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_68_1.png)"
