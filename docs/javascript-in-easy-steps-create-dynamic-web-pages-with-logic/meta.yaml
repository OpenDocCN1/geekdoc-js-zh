    \ nums[i];\n  nums[i] = nums[rand];\n  nums[rand] = temp;\n}\n\n// 将前六元素添加到字符串中\n\
    str = \"您的六个幸运数字是：\\n\\n\"\nfor(i = 1; i < 7; i++) {\n\n  str += nums[i];\n  if(i\
    \ != 6) str += \" -\";\n}\n\n// 显示字符串\nalert(str);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_78_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_78_1.png)\n\n# 总结\n\n- JavaScript 包含一系列常量，方便引用常用的数学常值，例如使用\
    \ `Math.PI` 的 pi 值\n- 常量名称始终使用大写字母\n- 内置的 `Math` 对象提供了执行数学运算的方法，例如使用 `Math.sqrt()`\
    \ 计算平方根\n- `Math.max()` 和 `Math.min()` 方法用于比较两个数字并返回较大或较小的值\n- 使用 `Math.pow()`\
    \ 可以轻松地计算幂值\n- 浮点数可以使用 `Math.round()` 方法四舍入到最近的整数\n- `Math.round()` 方法也可以用于将长浮点数转换为保留两位小数\n\
    - 可以使用 `Math.ceil()` 方法对数字进行特定的向上舍入，或者使用 `Math.floor()` 进行特定的向下舍入\n- `Math.random()`\
    \ 方法返回一个 0.0 到 1.0 之间的浮点值\n- 将 `Math.random()` 返回的值相乘，创建一个零 到 n 范围内的随机数\n- 使用\
    \ `Math.ceil()` 方法将随机值向上舍入，提供 1 到 n 范围内的整数\n\n# 7 处理字符串\n\n本章解释了字符串的特征，并通过示例演示了如何使用\
    \ JavaScript 代码处理文本字符串。\n\n- 80 计算字符串长度\n- 81 合并字符串\n- 82 查找字符\n- 83 改变大小\n- 84\
    \ 拆分字符串\n- 85 创建子字符串\n- 86 转换为字符串\n- 87 发现 Unicode 值\n- 88 提取字符串数字\n- 89 在字符串中插入变量\n\
    - 90 总结\n\n## 计算字符串长度\n\nJavaScript 中的字符串简单来说是在引号内的零或多个字符，这些都是字符串：\n\n```\nvar\
    \ str1 = \"My First String\";\nvar str2 = \"\";\nvar str3 = \"2\";\nvar str4 =\
    \ \"null\";\n```\n\n`str2` 中的空引号定义该变量为字符串类型，无论字符串值是什么。赋值给 `str3` 的数值在包含在引号内会自动转换为字符串类型，而\
    \ JavaScript 的 `null` 关键字在包含在引号内只是一个字符串字面量。\n\n> **不要忘记** 空格也被视为一个字符。\n\n本质上，字符串是字符的集合，每个字符都包含自己的数据，就像定义数组中的元素一样。\n\
    \n将字符串视为字符数组并在使用字符串时应用数组特性是符合逻辑的。\n\n下面的示例将 `Array.length` 属性与 `String.length`\
    \ 属性并列对比：\n\n```\n// 创建并初始化字符串变量\nvar a = \"JavaScript Strings\";\n\n// 显示字符串的长度\n\
    alert(\"String length is \" + a.length);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_81_0.png)\n\
    \nstring-length.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_81_1.png)\n\n#\
    \ 合并字符串\n\n`+` 运算符用于拼接字符串，并在本书提供的示例代码中被广泛使用。\n\n会创建一个新字符串，它由第一个字符串紧随第二个字符串组成。\n\
    \n下面的示例将多个变量值合并到一个字符串中，无论它们原始的数据类型如何——因为 JavaScript 执行了自动的数据类型转换：\n\n```\n// 创建并初始化一个整数变量\n\
    var num = 99;\n\n// 创建并初始化一个浮点数变量\nvar flt = 98.6;\n\n// 创建并初始化一个布尔变量\nvar bool\
    \ = true;\n\n// 创建并初始化几个字符串变量\nvar str1 = \"Although \";\nvar str2 = \" F is cited\
    \ as body temperature\\\";\nvar str3 = \"\\nthe \";\nvar str4 = \" range is from\
    \ about 97 to \";\nvar str5 = \" F.\";\n\n// 显示拼接后的字符串\nalert(str1 + flt + str3\
    \ + str4 + num + str5);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_82_0.png)\n\
    \n> **不要忘记** 空格也被计为一个字符\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_82_1.png)\n\
    \n# 查找字符\n\n字符串就像是数组，其字符可以以数组的方式被找到。使用 `charAt()` 方法查找字符，该方法接收索引作为唯一参数。\n\n下面的示例演示了如何通过这种方式来查找字符：\n\
    \n```\n// 创建并初始化字符串变量\nvar str = \"abcdefghij\", newstr = \"\";\n\n// 获取字符串的第一个字符\n\
    var a = \"First : \" + str.charAt(0);\nvar z = \"\";\n\n// 遍历字符串每个字符并复制到 newstr\n\
    for(var i = 0; i < str.length; i++) {\n    if (str.charAt(i) != \" \") newstr\
    \ += str.charAt(i);\n    else newstr += \" \";\n}\n\n// 显示 newstr 和最后一个字符\nvar\
    \ result = \"STRINGS\\n\";\nresult += \"New : \" + a + \"\\n\";\nalert(result\
    \ + z);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_83_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_83_1.png)\n\
    \n# 改变大小\n\n字符串的大小写可以使用 `toUpperCase()` 或 `toLowerCase()` 方法来强制转换为大写或小写。这些方法在比较用户输入时非常有用。\n\
    \n在下面的示例中，当用户点击按钮时转换字符串的大小写：\n\n```html\n<input type=\"button\" value=\"Check\
    \ Input\" onclick=\"check_input()\">\n```\n\n```javascript\nfunction check_input()\
    \ {\n// 从表单获取输入\nvar entry = document.forms[0].textfield.value;\n\n// 比较输入并显示相应消息\n\
    if(entry.toLowerCase() == \"castle\")\n alert(\"Accepted\");\nelse alert(\"Refused\"\
    );\n}\n```\n\n> **不要忘记** 在使用这些方法时确保观察大小写正确。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_84_0.png)\n\
    \ncase.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_84_1.png)\n\n# 拆分字符串\n\n\
    字符串的内容可以使用 JavaScript 的 `split()` 方法进行拆分。\n\n单个参数应指定一个字符作为分隔符，以定义字符串拆分的位置。最常见的是空格字符，将具有正常间的短语拆分成单词数组。每个单词都可以使用拆分字符串数组的索引号进行引用，与其他数组一样。\n\
    \n下面的示例说明了 `split()` 方法的另一个用法，数据库中的项可能使用 `|` 管道字符作为分隔符：\n\n```\n// 创建并初始化字符串变量\n\
    var str = \"JavaScript in easy steps\";\n\n// 按空格拆分为数组元素\nvar ss = str.split(\"\
    \ \");\n\n// 创建并初始化另一个字符串变量\nvar bk = \"JavaScript in easy steps|Mike McGrath\"\
    ;\n// 按管道符拆分为数组元素\nvar bks = bk.split(\"|\");\n\n// 显示一些元素\nvar res = \"Topic\
    \ : \" + ss[0];\nres += \"\\nTitle : \" + bks[0];\nres += \"\\nAuthor : \" + bks[1];\n\
    alert(res);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_85_0.png)\n\n> **热提示**\
    \ 数据通常以逗号分隔的字符串形式存储。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_85_1.png)\n\n"
