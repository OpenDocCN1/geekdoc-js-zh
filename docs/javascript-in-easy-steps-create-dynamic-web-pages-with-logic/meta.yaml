  md: "# Using XML response data\n\nWhen an XMLHttpRequest successfully requests XML\
    \ data the response is automatically stored in the object's responseXML property.\
    \ JavaScript can access this data via the XML elements using the window.document.getElementsByTagName()\
    \ method.\n\nThis example requests the file \"data.xml\", listed on the facing\
    \ page, and loads its data into the responseXML property. When the user selects\
    \ an item from the dropdown list its onchange event occurs upon the second function,\
    \ passing its selectedIndex value is reduced by one (because array index begins\
    \ at zero) and is used to select corresponding data from the array of XML elements\
    \ of a given name. The data is then dynamically assigned to a table component\
    \ of the page with the \"cell\":\n\n```\nwindow.onload=make_request // LOAD event-handler\n\
    var http_request = false; // for XMLHttpRequest object\n\nfunction make_request()\
    \ {\n if (window.XMLHttpRequest) {\\ // IE7, Mozilla\n  http_request = new XMLHttpRequest();\n\
    \ } else if (window.ActiveObject) {\\ // IE6\n  http_request =\n    new ActiveX(\"\
    Microsoft.XMLHTTP\");\n } else false;\n  http_request.open(\"GET\", \"data.xml\"\
    , true);\n  http_request.send(null);\n}\n\nfunction reveal(n) {\n if((http_request.readyState\
    \ == 4) &&\n  (http_request.status == 200) && (n != 0)) {\n  var obj = http_request.responseXML;\n\
    \  var fname =\n  obj.getElementsByTagName(\"name\")[n-1].firstChild.data;\n \
    \ var sname =\n  obj.getElementsByTagName(\"fmlly\")[n-1].firstChild.data;\n \
    \ window.document.getElementById(\"cell\").innerHTML =\n    n + \" \" + fname\
    \ + \" \" + sname;\n }\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_179_0.png)\n\
    \n> Hot tip\n\nAn array of all XML elements with the given name argument is formed\
    \ by the getElementsByTagName method - text content within the corresponding array\
    \ element is addressed by itsfirstChild.data property."
