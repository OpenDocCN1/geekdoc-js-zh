  mdcn: "\n\n## 识别鼠标移动\n\n当用户将光标置于网页上的对象上时，会发生 MouseOver 事件；当光标移出该对象时，会发生 MouseOut\
    \ 事件。\n\n通常，这些事件在 JavaScript 中用于提供图像切换的“悬停”效果。可以使用 `<img>` 标签配合 `onmouseover`\
    \ 和 `onclick` 属性来指定事件处理器，如下所示：\n\n```html\n<img src = \"off.gif\" onmouseover\
    \ = \"swap(this, 1)\" id = \"rollover\" onmouseout = \"swap(this, 0)\">\n```\n\
    \n在这种情况下，发生 MouseOver 和 MouseOut 事件时，事件处理器会接收两个参数——一个是通过 `this` 关键字的图像对象的引用，以及一个整数。事件处理器更改所引用图像对象的源，并在状态栏消息中确认所提供的整数值：\n\
    \n```javascript\n// 一个用于响应 MOUSEOVER 和 MOUSEOUT 的函数\nfunction swap(pic,n) {\n\
    \  if(n == 1)\n    pic.src = \"on.gif\"; window.status = \"MouseOver\"\n  if(n\
    \ == 0)\n    pic.src = \"off.gif\"; window.status = \"MouseOut\";\n}\n```\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_137_0.png)\n\n脚本可以通过 id 来指定目标元素，但传递引用参数会更高效。\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_137_1.png)\n\nmouse-overout.js\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_137_2.png)\n\n## ...续\n\n当用户移动鼠标时，MouseMove\
    \ 属性会将数值值传递给 MouseEvent 对象的 `pageX` 和 `pageY` 属性。这些数字是光标在浏览器窗口中的 X 和 Y 坐标。\n\n\
    此示例在光标移动时在文本输入框中显示坐标，并将 MouseEvent 对象作为参数传递给指定的 MouseMove 事件处理器。Internet Explorer\
    \ 将这些值存储在其事件对象的 `x` 和 `y` 属性中，可以直接访问，因此脚本会进行分支处理：\n\n```javascript\n// 指定一个 MOUSE\
    \ 事件处理器\nwindow.document.onmousemove=showcoords;\n\nfunction showcoords(e) {\n\
    \  var xpos, ypos;\n  if(navigator.appName == \"Microsoft Internet Explorer\"\
    )\n    xpos = event.x; ypos = event.y;\n  else\n    xpos = e.pageX; ypos = e.pageY;\n\
    \  // 显示坐标\n  document.getElementById(\"txt\").value =\n    \"X: \" +xpos+\" Y:\
    \ \" +ypos ;\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_138_0.png)\n\n\
    > **热提示** 许多令人兴奋的动态 HTML (XMLHttpRequest) 利用了这种跟踪鼠标坐标的能力。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_138_1.png)\n\
    \n## 识别焦点和大小\n\n当用户将光标移动到网页的某个组件上时（聚焦于该组件），会发生 Focus 事件。相反，当用户将光标移出该组件时（将焦点移到其他处），会发生\
    \ Blur 事件。\n\n表单元素通过其 HTML 的 `focus` 和 `onblur` 属性为 Focus 和 Blur 事件创建事件处理器，如下所示：\n\
    \n```html\n<input type = \"text\" value = \"Enter a quantity\"\nonfocus=\"wipe(this)\"\
    \ onblur=\"check(this,'quantity')\">\n```\n\n在这种情况下，当用户聚焦于该文本框时，Focus 事件处理器会移除文本字段中的初始值。当用户将光标离开文本框时，Blur\
    \ 事件处理器会检查是否已输入值，如果没有输入，则显示警报框：\n\n```javascript\n// 一个用于响应 FOCUS 事件的函数\nfunction\
    \ wipe(box) {\n  box.value = \"\"\n\n// 一个用于响应 BLUR 事件的函数\nfunction check(box,\
    \ str) {\n  if(box.value == \"\") alert(\"Enter a \" + str);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_139_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_139_1.png)\n\n**热提示**  \n注意 \"this\"\
    \ 关键字参数是如何将表单组件的引用传递给事件处理器的。\n\n...续\n\n当用户更改浏览器窗口大，会发生 Resize 事件，onresize 事件处理器可以指定一个函数，使页面适应新的窗口大小。\n\
    \n这在重新定位 HTML 组件时最有用，如下例所示，它在加载时以及每当窗口大小发生变化时将 HTML `<div>` 元素居中显示：\n\n```javascript\n\
    // 指定 LOAD 事件处理器\nwindow.onload=set_pos;\n\n// 指定 RESIZE 事件处理器\nwindow.onresize=set_pos;\n\
    \n// 一个用于响应 LOAD 事件的函数\nfunction set_pos() {\n  // 获取窗口宽度\n  var width = document.body.clientWidth;\n\
    \n  // 计算宽度的一半\n  var left_pos = parseInt(width / 2);\n\n  // 设置左侧位置\n  document.getElementById(\"\
    layer\").style.left = left_pos+\"px\";\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_140_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_140_1.png)\n\n> **热提示**  \n有关 DHTML\
    \ 的更多信息，请参阅第 13 章\n\n## 总结\n\n- 当用户将光标移动到网页组件上时，发生 Focus 事件。\n- 当用户将光标移出组件时，发生\
    \ Blur 事件。\n- 当用户更改浏览器窗口大时，发生 Resize 事件。\n- onresize 事件处理器可以指定一个函数，使页面适应新的窗口大小。\n\
    - MouseMove 属性将数值值传递给 `pageX` 和 `pageY` 属性。\n- Internet Explorer 将这些值存储在其事件对象的\
    \ `x` 和 `y` 属性中。\n- Focus 事件处理器移除文本框中的初始值。\n- Blur 事件处理器检查是否已输入值。\n- \"this\"\
    \ 关键字参数将表单组件的引用传递给事件处理器。\n\n"
