  md: '# Comparing numbers


    The Math object has two methods that allow comparison of two numbers and return
    the higher or the lower value.


    Math.max() accepts the two values for comparison as arguments and will return
    the higher of the two values.


    The Math.min() method works in precisely the same way but returns the lower of
    the given values.


    In the example the Math.pow() method is used to create square and cube values
    that are then compared with Math.max() and Math.min().


    The Math.pow() method requires two arguments to specify the number and the power
    by which to raise that number:


    ```

    var sq = Math.pow( 5, 2 );nvar cb = Math.pow( 3, 3 );nvar hi = "Largest positive
    : " + Math.max( sq, cb );nvar lo = "Smallest positive : " + Math.min( sq, cb );nvar
    ng = "Largest negative : " + Math.max(-5, -4.75);

    alert("MAXMIN\n\n" + hi + "\n" + lo + "\n" + ng");

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_74_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_74_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_74_2.png)'
