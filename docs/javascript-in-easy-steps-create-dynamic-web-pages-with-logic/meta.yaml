    # Summary


    +   - AJAX is an acronym for “Asynchronous JavaScript And XML"


    +   - AJAX is a technique using a number of existing technologies to create Rich
    Internet Applications (RIAs) that have similar responsiveness to that of desktop
    applications


    +   - An AJAX engine is an intermediary, written in JavaScript, between the web
    server and the web browser


    +   - Asynchronous communication with the server does not interrupt the user''s
    interaction with an AJAX application


    +   - Internet Explorer 7, Mozilla and Safari web browsers support the window.XMLHttpRequest
    object


    +   - An XMLHttpRequest is specified using its open() method and sent to the server
    using its send() method


    +   - When the response is received from the web server the XMLHttpRequest object''s
    readystatechange event occurs


    +   - An event-handler to process a response can be nominated using the XMLHttpRequest
    object''s onreadystatechange property


    +   - The readyState and status properties are assigned values describing the
    current status of an XMLHttpRequest


    +   - A text response to an XMLHttpRequest is automatically assigned to its responseText
    property


    +   - An XML data response to an XMLHttpRequest is automatically assigned to its
    responseXML property


    +   - The getElementsByTagName() method can be used to create an array of XML
    object elements of a specified name


    +   - Text within an XML object element is contained within firstChild.data property'
