    \nOther attributes are accessible as properties of element – illustrated by this\
    \ example:\n\n```\nfunction element_info() {\n var msg = \"Element Type: \" +\
    \ document.forms.btn1.type; // element type\nmsg += \"\\nElement Value: \" + document.forms.btn1.value;\
    \ // element value\nmsg += \"\\nOnclick: \" + document.forms.btn1.onclick; //\
    \ onclick value\nalert(msg);}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_144_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_144_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_144_2.png)"
