    表格主体中的空白色单元格为 n0-n14，行合计单元格为 rt1-rt13，列合计单元格为 ct1-ct3，右下角的总计单元格 id 为 gt。\n\n```javascript\n\
    window.onload=make_request;\nvar obj, http_request = false; // 全局变量\n\nfunction\
    \ make_request() {\n  if (window.XMLHttpRequest) {\n    http_request = new XMLHttpRequest();\
    \ // IE7\n  } else if (window.ActiveXObject) { // IE6\n    http_request =\n  \
    \    new ActiveXObject(\"Microsoft.XMLHTTP\");\n  }\n  else return false;\n  http_request.onreadystatechange\
    \ = create_ria;\n  http_request.open('GET', 'ajax.xml', true);\n  http_request.send(null);\
    \ // 发送请求\n```\n\n（部分）\najax.js\n\n# ...继续\n\n```javascript\nfunction create_ria()\
    \ {\n  if (http_request.readyState == 4) { // 完成\n    if (http_request.status\
    \ == 200) { // OK\n      obj = http_request.responseXML; // XML 对象\n      populate_cells();\
    \ // 填充单元格\n    } else alert(\"HTTP 请求失败\");\n  }\n}\n\nfunction populate_cells()\
    \ {\n  for (i = 0; i < obj.getElementsByTagName(\"num\").length; i++) {\n    document.getElementById(\"\
    n\"+i).innerHTML = obj.getElementsByTagName(\"num\")[i].firstChild.data;\n  }\n\
    }\ntotalize(); // 调用函数计算单元格合计\n```\n\n> 提示\najax.xml 文档中的 15 个数据元素被称为 \"num\"\
    。该函数遍历这些元素并将数据应用到每个空单元格。\n\n> 请记住\n`populate_cells()` 函数结束时会调用另一个函数来计算合计——位于下一页。\n\
    \n# 编写 RIA\n\n一旦空白色表格单元格填充了来自 XML 文档的数据，自定义的 `totalize()` 函数就可以计算行合计和总合计。该函数使用循环通过\
    \ `window.document.getElementsByTagName(\"name\")` 方法结合 \"num\" 与循环迭代次数来访问 XML\
    \ 对象元素的值。然后将计算出的合计动态赋值给相关的 `window.document.getElementById(id)`：\n\n```javascript\n\
    // 计算行和列合计的函数\nfunction totalize() {\n  var sum = 0; // 运行总计变量\n  var row_number\
    \ = 1; // 行数\n  var col_number = 0; // 列数\n  // 遍历所有 <num> 元素\n  for (i = 0; i\
    \ < obj.getElementsByTagName(\"num\").length; i++) {\n    sum += eval(obj.getElementsByTagName(\"\
    num\")[i].firstChild.data); // 相加所有\n  }\n  // 然后显示总计\n  document.getElementById(\"\
    gt\").innerHTML = sum;\n  // 遍历所有 <num> 元素\n  for(i = 0; i < obj.getElementsByTagName(\"\
    num\").length; i++) {\n    sum += eval(obj.getElementsByTagName(\"num\")[i].firstChild.data);\
    \ // 相加行单元格\n    if((i+1) % 5 == 0) {\n      document.getElementById(\"rt\"+row_number).innerHTML\
    \ = sum;\n      sum = 0; // 并置零\n      row_number++; // 开始下一行\n    }\n  }\n}\n\
    ```\n\n> 注意\n注意 `getElementsByTagName` 方法使用了 \"element\" 的复数形式，而 `getElementById`\
    \ 方法使用了单数形式。\n\n"
