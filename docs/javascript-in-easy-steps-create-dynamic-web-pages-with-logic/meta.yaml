  md: "# Addressing elements directly\n\nThe technique of addressing document components\
    \ with the window.document arrays, as illustrated in the previous example, can\
    \ be avoided in modern browsers that comply with the Document Object Model (DOM)\
    \ specification laid down by the World Wide Web Consortium (W3C).\n\nThe W3C DOM\
    \ places emphasis on the inclusion of a unique id attribute in HTML elements so\
    \ that they can be addressed directly by the window.document.getElementById method.\
    \ It is useful to test initially for the existence of this method to ensure the\
    \ user has a modern browser compliant with the W3C DOM.\n\nThe example below addresses\
    \ an element with the id attribute value=\"engine-1\", like in the HTML document\
    \ on page 116. It first checks that the browser is W3C DOM compliant before retrieving\
    \ the element's other attribute values.\n\n```\nfunction show_attribs() {\n  //\
    \ test for modern browser\n  if (!window.document.getElementById) {\n    alert(\"\
    Not W3C DOM browser!\"); return;\n  }\n  // get attribute values using element\
    \ id\n  var attribs = \"\";\n  attribs += \"Link name: \" + window.document.getElementById(\"\
    engine-1\").name;\n  attribs += \"\\nTarget: \" + window.document.getElementById(\"\
    engine-1\").href;\n  alert(attribs);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_119_0.png)\n\
    \n> Don't forget: Because the window object is the top level it can optionally\
    \ be omitted from the address – so you can just use document.getElementById().\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_119_1.png)"
  merge: -1
  pgno: 119
- img_proc: true
  md: "Another useful method introduced in W3C DOM compliant browsers allows JavaScript\
    \ to create an array of all elements of a specific tag by stating the tag name\
    \ as the argument to the window.document.getElementsByTagName() Notice that this\
    \ will be the actual name of the tag – not the value assigned to a “name” attribute.\n\
    \nThe tags are assigned to the array in the order in which they appear in the\
    \ document so the tag appearing first is element zero. Each element in the array\
    \ can then be addressed using the array name and its index number.\n\nThe example\
    \ below checks for the W3C DOM and creates an array of the <img> tags in an HTML\
    \ document, like those listed on page 116. The final value assigned to each <img>\
    \ tag’s “alt” attribute is displayed in an alert dialog:\n\n```\nfunction show_attribs({\n\
    \  // check for W3C DOM\n  if (!window.document.getElementById) {\n    alert(\"\
    Not W3C DOM browser!\"); return;\n  }\n\n  // create an array of <img> tags\n\
    \  var pics = \n    window.document.getElementsByTagName(\"img\");\n  alert(pics[0].alt\
    \ + \"\\n\" + pics[1].alt);\n}\n```\n\n> Remember that there is an “s” in this\
    \ method, as you get multiple elements with getElementsByTagName() – but just\
    \ one element with getElementById(no “s”).\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_120_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_120_1.png)"
