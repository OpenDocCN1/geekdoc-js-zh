  md: '# Summary


    +   - A custom object can contain properties and methods in the same way as an
    intrinsic JavaScript object does – just as the Array object has an Array.length
    property and an Array.sort() method


    +   - Use the JavaScript new keyword together with the Object constructor to create
    a single new object


    +   - Address a property or method by appending its name after the object name
    using the dot \." operator – for instance car.color and methods


    +   - Use the JavaScript this to assign values to properties and methods in a
    custom constructor function


    +   - Use the JavaScript new together with a custom constructor to create a new
    instance of an object


    +   - Instances of an object automatically inherit the properties and methods
    of the object from which they are derived


    +   - The navigator object contains information about the web browser


    +   - Use the navigator.appName property to reveal the browser name or use navigator.userAgent
    to reveal a description of the browser, its version and its environment


    +   - You can discover which operating system the user is running with the navigator.platform
    property


    +   - Use the navigator.javaEnabled() method to discover if the browser is able
    to execute Java applets


    +   - The navigator.plugins property holds an array containing details of installed
    plugins – one plugin per element


    +   - Use the name property of a navigator.plugins element to reveal its name,
    or the description property of the element for details'
