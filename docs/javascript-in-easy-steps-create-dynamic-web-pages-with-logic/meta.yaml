  - '[PAGE 109]


    # Advising status messages


    The window.status property can display a message in the browser''s status bar
    until another document feature sets a different message, or the status is returned
    to its default state. A default message to display can be specified with the window.defaultStatus
    property.


    To display a message when the user places the cursor over a hyperlink the HTMLmouseover
    attribute should specify the message to display. It must also return true to prevent
    the link URL appearing in the status bar as it would normally.


    This example, using JavaScript within HTML tags, specifies a default message and
    adds anmouseover attribute to the link. This displays another message while the
    cursor rests over the link:


    ```

    <body onload = "window.defaultStatus = ''Status Demo'';">

    <p><a href="nextpage.html" onmouseover="window.status=''Click Here'';return true">Hypertext
    Link</a></p>

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_109_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_109_1.png)


    Some versions of the Firefox browser disable status bar messages by default -
    to enable them, enter about:config in the address field and then, from the list
    that appears, dom.disable_window.status_change to false.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_109_2.png)'
