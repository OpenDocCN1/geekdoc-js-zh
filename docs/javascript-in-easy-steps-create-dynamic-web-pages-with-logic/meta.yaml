  md: "# Acknowledging key actions\n\nKeyDown event occurs when the user presses a\
    \ keyboard key and aKeyUp event occurs when it is released. Typically these are\
    \ used together, so pressing and releasing a key will activate two event-handlers.\n\
    \nThis example swaps an image and changes the value of a text box when a keyboard\
    \ key is pressed reverts both to their original states when the key is released:\n\
    \n```\n// specify KEYDOWN and KEYUP event-handlers\nwindow.document.onkeydown\
    \ = iskeydown;\nwindow.document.onkeyup = isup;\n\n// a function to react to KEYDOWN\
    \ events\nfunction iskeydown() {\n    document.getElementById(\"bulb\").src=\"\
    on.gif\";n    document.getElementById(\"txt\").value = \"Key is Down\";\n}\n```\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_135_0.png)\n\nThis code deliberately\
    \ omits the optional \"window.\" part of the window.document address.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_135_1.png)\n\
    \n```\n// a function to react to KEYUP events\nfunction isup() {\n    document.getElementById(\"\
    bulb\").src=\"off.gif\";n    document.getElementById(\"txt\").value = \"Key is\
    \ Up\";\n}\n```\n\n| Key & KeyDown |\n|---||\n| ⬅ | key-keydown |\n| + | KeyUp\
    \ & KeyDown |\n| \U0001F4A1 | Key is Up |\n| Done\n\n| KeyUp & KeyDown |\n|---||\n\
    | ➡ | key-keyup |\n| + | KeyUp & KeyDown |\n| \U0001F4A1 | Key is Down |\n| Done"
  merge: -1
  pgno: 135
- img_proc: true
  md: "# ...cont'd\n\nWhen a user presses a key, the KeyDown event passes a numeric\
    \ value to the keyCode property of the KeyboardEvent object. The number is the\
    \ Unicode character number of that key and can be used in JavaScript to discover\
    \ which key has been pressed.\n\nThis example shows the Y and N character codes\
    \ in both upper and lower case. The KeyboardEvent object is passed as the argument\
    \ to the specified Key event handler. Internet Explorer stores the value in its\
    \ event object whose keyCode property can be addressed directly, so the script\
    \ branches to:\n\n```\n// specify a KEYDOWN event-handler\nwindow.document.keydown=showkey;\n\
    \n// a function to react to the KEYDOWN event\n// passing the KeyboardEvent object\
    \ as its argument\nfunction showkey(e) {\n  var obj = (navigator.appName =\n \
    \   \"Microsoft Internet Explorer\") ? event : e;\n  // consider the keyCode property\
    \ value\n  if(obj.keyCode == 89 || obj.keyCode == 121)\n    alert(\"Y pressed\"\
    );\n  if(obj.keyCode == 78 || obj.keyCode == 110)\n    alert(\"N pressed\");\n\
    }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_136_0.png)\n\nkeycode.js\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_136_1.png)\n\nUnicode values for common\
    \ characters are the same as ASCII codes where lower-case a-z are 65–90 and upper-case\
    \ A-Z are 97–122. In this example Y=89, N=78, y=121 and n=110."
  merge: -1
  pgno: 136
- img_proc: true
  md: "# Recognizing mouse moves\n\nMouseOver event occurs when the user places the\
    \ cursor over an object on a web page, and a MouseOut event occurs when the cursor\
    \ moves off the object.\n\nTypically these events are used in JavaScript to provide\
    \ an image swap \"rollover\" effect. Event handlers can be specified using the\
    \ <img> tag withmouseover and onclick attributes like this:\n\n```\n<img src =\
    \ \"off.gif\" onmouseover = \"swap(this, 1)\" id = \"rollover\" onmouseout = \"\
    swap(this, 0)\">\n```\n\nIn this case the MouseOver and MouseOut events occur\
    \ the event-handler is passed two arguments – a reference to the image object,\
    \ with this keyword, and an integer. The event-handler changes the source of the\
    \ referenced image object and a status bar message acknowledging the supplied\
    \ integer value:\n\n```\n// a function to react to MOUSEOVER and MOUSEOUT\nevents\n\
    function swap(pic,n)\n  if(n == 1)\n    pic.src = \"on.gif\"; window.status =\
    \ \"MouseOver\"\n  if(n == 0)\n    pic.src = \"off.gif\"; window.status = \"MouseOut\"\
    ;\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_137_0.png)\n\nThe script could\
    \ specify the target element by its id but passing a reference argument is more\
    \ efficient.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_137_1.png)\n\nmouse-overout.js\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_137_2.png)"
  merge: -1
  pgno: 137
- img_proc: true
  md: "# ...cont'd\n\nWhen a user moves the mouse MouseMove properties passes numeric\
    \ values to the pageX and pageY properties of a MouseEvent object. These numbers\
    \ are the X and Y coordinates of the cursor in the browser window.\n\nThis example\
    \ displays the coordinates in a text input as the cursor moves and the MouseEvent\
    \ object is passed as the argument to the specified MouseMove event-handler. Internet\
    \ Explorer stores the values in the x and y properties of its event object, which\
    \ can be addressed directly, so the script branches to suit:\n\n```\n// specify\
    \ a MOUSE event-handler\nwindow.document.onmousemove=showcoords;\n\n// a function\
    \ to react to the MOUSEMOVE event\nfunction showcoords(e)\n{\n  var xpos, ypos;\n\
    \  if(navigator.appName == \"Microsoft Internet Explorer\")\n    xpos = event.x;\
    \ ypos = event.y;\n  else\n    xpos = e.pageX; ypos = e.pageY;\n  // display the\
    \ coordinates\n  document.getElementById(\"txt\").value =\n    \"X: \" +xpos+\"\
    \ Y: \" +ypos ;\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_138_0.png)\n\
    \n> Hot tip Many exciting Dynamic HTML (XMLHttpRequest) effects make use of this\
    \ ability to track the mouse coordinates.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_138_1.png)"
  merge: -1
  pgno: 138
- img_proc: true
  md: "# Identifying focus and size\n\nThe Focus event occurs when the user moves\
    \ the cursor onto a component of the web page – focusing upon that component.\
    \ Conversely, the Blur event occurs when the user moves the cursor off the component\
    \ – moving focus elsewhere.\n\nForm elements create event-handlers for the Focus\
    \ and Blur events with their HTML focus and onblur attributes like this:\n\n```\n\
    <input type = \"text\" value = \"Enter a quantity\"\nonfocus=\"wipe(this)\" onblur=\"\
    check(this,'quantity')\">\n```\n\nIn this case the Focus event-handler removes\
    \ the initial value from the text field when the user focuses on that text box.\
    \ When the user moves the cursor away from the text box the Blur event-handler\
    \ checks to see if a value has been entered and displays an alert dialog if no\
    \ entry was:\n\n```\n// a function to react to the FOCUS event\nfunction wipe(box)\n\
    \  box.value = \"\"\n\n// a function to react to the BLUR event\nfunction check(box,\
    \ str)\n  if(box.value == \"\") alert(\"Enter a \" + str);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_139_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_139_1.png)\n\nHot tip\nNotice how \"\
    this\" keyword argument passes a reference for the form component to the event-handler."
  merge: -1
  pgno: 139
- img_proc: true
  md: "...cont'd\n\nThe Resize event occurs when the user changes the size of the\
    \ browser window and the onresize event-handler can specify a function to make\
    \ the page appropriate for the new window size.\n\nThis is most useful to reposition\
    \ HTML components as illustrated in the example below, which centers an HTML `<div>`\
    \ element upon loading and whenever the window size changes:\n\n```\n// specify\
    \ the LOAD event handler\nwindow.onload=set_pos;\n\n// specify the RESIZE event-handler\n\
    window.onresize=set_pos;\n\n// a function to react to the LOAD and RESIZE event\n\
    function set_pos() {\n  // get the current window width\n  var width = document.body.clientWidth;\n\
    \n  // calculate half window width minus half div width\n  var left_pos = parseInt(width\
    \ / 2) - 50;\n  // set the left position of the <div> element\n  document.getElementById(\"\
    layer\").style.left = (left_pos+\"px\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_140_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_140_1.png)\n\n> Hot tip\nFor more on\
    \ DHTML effects with JavaScript, see chapter 13."
  merge: -1
  pgno: 140
