  md: '# Data types


    JavaScript is a loosely typed language so its variables can store numbers, text
    strings or boolean values (i.e. true or false).


    This is unlike other programming languages such as C++ and Java where you need
    to declare variables of a specific data type and can only store the data of the
    declared type.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_15_0.png)


    ```

    // initialize a number variable

    var a = 0.06;


    // initialize a string

    var b = "JavaScript in easy steps";


    // initialize a boolean variable

    var c = false;


    // display the data type of each variable

    alert( typeof a + "\n" + typeof b + "\n" + typeof c);

    ```


    The example above creates variables with initial values of the three different
    data types supported by JavaScript.


    These three values are first passed to the alert() function; then the JavaScript
    keyword typeof is used to return their data types for display in the alert dialog
    box shown below.


    The code + "\n" + inside the parentheses just displays the output for each value
    on a new line in the alert dialog box.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_15_1.png)


    Hot tip

    Notice that JavaScript makes no distinction between integer numbers and floating-point
    numbers.'
