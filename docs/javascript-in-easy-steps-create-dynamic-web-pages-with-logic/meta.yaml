  md: "# Choosing options\n\nThe <option> items in an HTML <select> list have a text\
    \ property for each displayed string label and an associated value property. These\
    \ are equivalent to the HTML name and value attributes of <option> element in\
    \ the <select> list.\n\nThis name=value pair is sent to the server when the form\
    \ is submitted.\n\nAll menu items are stored in the <select> object's options[]\
    \ array and both the text label and its associated value may be dynamically written\
    \ by JavaScript.\n\nThis example dynamically sets the text label and the associated\
    \ value of all three option in a drop-down list. The form has the simple id of\
    \ \"f\" and the <select> element has the id \"menu\".\n\n```\n// a function to\
    \ set the label and values of options\nfunction set_options() {\n  with(window.document.forms.f.menu)\
    \ {\n    options[0].text = \"One\"; options[0].value = \"1\";\n    options[1].text\
    \ = \"Two\"; options[1].value = \"2\";\n    options[2].text = \"Three\"; options[2].value\
    \ = \"3\";\n  }\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_149_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_149_1.png)\n\nThe options[] elements\
    \ must be initially created by the HTML code.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_149_2.png)"
