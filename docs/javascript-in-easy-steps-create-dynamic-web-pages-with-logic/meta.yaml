  - '[PAGE 92]


    # 8 Understanding objects


    This chapter demonstrates how to construct new custom objects and how they inherit
    properties and methods.


    +   92 Constructing objects

    94 Inheriting object features

    96 Querying the browser

    98 Discovering what is enabled

    100 Summary'
  - '[PAGE 93]


    # Constructing objects


    The JavaScript syntax to address object properties and methods uses the object
    name followed by a period and then the property name. For instance, Array.length
    addresses the length property of an array object.


    Previous example code in this book has used intrinsic JavaScript objects with
    pre-defined methods.


    New custom objects can easily be created by the JavaScript new keyword with the
    Object() constructor.


    Properties may then be allocated to the new custom object by declaring a property
    name and assigning a value to it.


    The example below creates a new object called car and then gives it three properties
    with assigned values:


    ![](img/9706759b347c5727cfdd3d09614f8c1f_93_0.png)


    ```

    // create a new "car" object

    var car = new Object();


    // create and initialize a "maker" property...

    car.maker = "Dodge";n

    // create and initialize a "model" property...

    car.model = "Viper";n

    // create and initialize a "color" property...

    car.color = "Silver";

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_93_1.png)


    To declare a property, use both the object name and the given property name.


    ```

    // display all the car object properties...

    alert(car.color + " " + car.maker + " " + car.model);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_93_2.png)'
  - "[PAGE 94]\n\nMethods can also be added to custom objects in much the same way\
    \ as properties. The statements to be executed when the method is called upon\
    \ should be defined in a regular function block using a given name. That function's\
    \ name can then be assigned to an object to create an object method.\n\nIt is\
    \ sensible to keep the same name for the object method and the function that it\
    \ calls. For instance, the example below adds a method called startup to the car\
    \ object, created on the opposite page, that calls a function of the same name:\n\
    \n```\n// define the startup method...\nfunction startup() {\n  alert(\"... the\
    \ motor is now running!\");\n}\n\n// add a method to the car object...\ncar.startup\
    \ = startup;\n\n// call the car object's startup method...\ncar.startup();\n```\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_94_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_94_1.png)\n\
    \nBeware Note that trailing parentheses are not used in the assignment – just\
    \ the function name.\n\nIn tree view the custom car object now looks like this:\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_94_2.png)"
  - "[PAGE 95]\n\n# Inheriting object features\n\nA custom constructor is easily created\
    \ by writing a function with arguments to set the values of its properties. Values\
    \ passed to the function can be assigned to its properties using the JavaScript\
    \ this keyword to specify the name of the object property. Alternative default\
    \ values can be specified using the || OR operator for when a property is not\
    \ specified by the caller.\n\nThe example below uses this technique to recreate\
    \ the previous example using a custom constructor. The function caller simply\
    \ creates an instance of the car object without specifying any property values\
    \ - so the object inherits the default values:\n\n```\n// create a car constructor\
    \ function\nfunction car(maker, model, color)\n{\n  this.maker = maker || \"Dodge\"\
    ;\n  this.model = model || \"Viper\";\n  this.color = color || \"Silver\";\n \
    \ this.startup = startup;\n}\n```\n\n```\n// define the startup function\nfunction\
    \ startup()\n{\n  alert(\"... the motor is now running!\");\n}\n```\n\n```\n//\
    \ create an instance of the car object...\nvar viper = new car();\nalert( viper.color+\"\
    \ +viper.marker+\" + viper.model );\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_95_0.png)\n\
    \nAn instance of the object in the previous example can be created by stating\
    \ its name as the argument to the Object() constructor - for example: var van\
    \ = new Object(car).\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_95_1.png)"
  - "[PAGE 96]\n\n# ...cont'd\n\nAnother instance of the car object can be created\
    \ with new property values specified by the caller arguments like this:\n\n```\n\
    function car(maker, model, color) {\n  this.maker = maker || \"Dodge\";\n  this.model\
    \ = model || \"Viper\";\n  this.color = color || \"Silver\";\n  this.startup =\
    \ startup;\n}\n\nfunction startup() {\n  alert(\"... the motor is now running!\"\
    );\n}\n\n// create an instance of the car object...\nvar vette = new car(\"Chevrolet\"\
    , \"Corvette\", \"Red\");\n\n// display the instance values\nalert(vette.color+\"\
    +vette.maker+\"+vette.model );\nvette.startup();\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_96_0.png)\n\
    \ninherit.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_96_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_96_2.png)\n\
    \nIn this example properties receive new values – but the default method is inherited\
    \ from the constructor.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_96_3.png)"
  - '[PAGE 97]


    # Querying the browser


    The intrinsic JavaScript navigator object has properties to provide information
    about the browser being used to view a document.


    The browser name is revealed by the navigator.appName property, a description
    of that particular property is available from the navigator.userAgent property.


    In addition to the release number the navigator.userAgent property contains other
    details, such as the host platform type.


    In the example below the navigator.userAgent property reveals the browsers to
    be Internet Explorer 7.0 (MSIE 7.0) and Firefox 1.5 running on a Windows XP platform
    (NT5.1):


    ```

    // get the browser name

    var browser = navigator.appName;


    // get the browser description

    var description = navigator.userAgent;


    // display the browser name and version

    alert(browser + "\n\n" + description);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_97_0.png)


    Windows Internet Explorer

    Microsoft Internet Explorer

    Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 5.1)

    OK


    [JavaScript Application]

    Netscape

    Mozilla/5.0 (Windows; U; Windows NT 5.1; en-US; rv:1.8) Gecko/20050111 Firefox/1.5

    OK'
  - "[PAGE 98]\n\n...cont'd\n\nOther properties of the navigator object provide specific\
    \ details about the user's operating system and browser. These are useful to tailor\
    \ JavaScript applications to specific browsers and platforms.\n\nThe example below\
    \ uses indexOf() method to search the navigator.platform property string in order\
    \ to identify the user's operating system and to generate an appropriate message:\n\
    \n```\n// get the operating system...\nvar platform;\nif(navigator.platform.indexOf(\"\
    Linux\") != -1)\n  platform = \"Linux\";\nif(navigator.platform.indexOf(\"Win\"\
    ) != -1)\n  platform = \"Windows\";\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_98_0.png)\n\
    \nalert(\"Welcome \" + platform + \" user\\nYour system is: \" + navigator.platform\
    \ + \" - \" + navigator.appCode\n + \" - - \" + navigator.appVersion\");\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_98_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_98_2.png)"
  - "[PAGE 99]\n\n# Discovering what is enabled\n\nA browser can be assessed to discover\
    \ whether Java is enabled using the navigator.javaEnabled() method. This returns\
    \ true or false, depending on the result. The navigator.javaEnabled() method can\
    \ be used to display a warning if a page containing a Java applet is being loaded\
    \ in the browser:\n\n```\n// test if Java is enabled in the browser\nif ( !navigator.javaEnabled())\
    \ {\n\nvar warning = \n\"It appears Java is not enabled in your browser.\\\nSome\
    \ items on this page cannot run without Java\";\nalert(warning);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_99_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_99_1.png)\n\nEnabling Java in the browser\
    \ settings allows the page to load without displaying any warning:\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_99_2.png)"
  - "[PAGE 100]\n\n# ...cont'd\n\nMozilla browsers JavaScript can reveal information\
    \ about any installed plugins with the navigator.plugins array. Each plugin is\
    \ added as an element in the navigator.plugins array. For instance, the Macromedia\
    \ Shockwave plugin is installed there is a navigator.plugins[\"Shockwave Flash\"\
    ] element.\n\nThe plugin element has a name property, storing the name and version\
    \ of that plugin, and a description property that contains information about the\
    \ plugin.\n\nIn the following example a loop displays each name property in the\
    \ navigator.plugins array, list all the installed plugins:\n\n```\n// list installed\
    \ Mozilla plugins...\nif(navigator.appName == \"Netscape\") {\n  var str = \"\"\
    ;n  for(var i = 0; i < navigator.plugins.length; i++) {\n    str += navigator.plugins[i].name\
    \ + \"\\n\";\n}\nalert(str);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_100_0.png)\n\
    \nnavigator.plugins exists in Internet Explorer but it's not implemented.\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_100_1.png)\n\nplugins.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_100_2.png)\n\
    \nMozilla browsers identify with the Netscape name.\n\n# [JavaScript Application]\n\
    \n+   Mozilla Default Plug-in\nQuickTime Plug-in 7.0.3\nShockwave Flash\nAdobe\
    \ Acrobat\nRealPlayer(tm) G2 LiveConnect-Enabled Plug-In (32-bit)\nRealPlayer\
    \ Version Plugin\nJava(TM) 2 Platform Standard Edition 5.0 Update 6\nMicrosoft®\
    \ DRM\nWindows Media Player Plug-in Dynamic Link Library\nMicrosoft® DRM\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_100_3.png)\n\
    \nThe output from this script will vary according to the plugins installed on\
    \ your browser."
- md: "\n# Summary\n\n- A custom object can contain properties and methods in the\
    \ same way as an intrinsic JavaScript object does – just as the Array object has\
    \ an Array.length property and an Array.sort() method\n\n- Use the JavaScript\
    \ new keyword together with the Object constructor to create a single new object\n\
    \n- Address a property or method by appending its name after the object name using\
    \ the dot (.) – for instance car.color and methods\n\n- Use the JavaScript this\
    \ to assign values to properties and methods in a custom constructor function\n\
    \n- Use the JavaScript new together with a custom constructor to create a new\
    \ instance of an object\n\n- Instances of an object automatically inherit the\
    \ properties and methods of the object from which they are derived\n\n- The navigator\
    \ object contains information about the web browser\n\n- Use the navigator.appName\
    \ property to reveal the browser name or use navigator.userAgent to reveal a description\
    \ of the browser, its version and its environment\n\n- You can discover which\
    \ operating system the user is running with the navigator.platform property\n\n\
    - Use the navigator.javaEnabled() method to discover if the browser is able to\
    \ execute Java applets\n\n- The navigator.plugins property holds an array containing\
    \ details of installed plugins – one plugin per element\n\n- Use the name property\
    \ of a navigator.plugins element to reveal its name, or the description property\
    \ of the element for details\n\n## #9 Exploring the window object\n\nThis chapter\
    \ demonstrates how JavaScript can use properties and methods of the \"window\"\
    \ object to modify aspects of the browser window.\n\n- 102 Controlling location\n\
    - 104 Getting monitor settings\n- 105 Recognizing frames\n- 106 Addressing frames\n\
    - 108 Advising status messages\n- 109 Scrolling and moving\n- 110 Seeking confirmation\n\
    - 111 Prompting for input\n- 112 Opening new windows\n- 114 Summary\n\n## Controlling\
    \ location\n\nThe window.location object contains the full URL address of the\
    \ document that is currently loaded in the browser.\n\nIt stores the actual full\
    \ URL in the window.location.href property and assigning a new value to this,\
    \ or to the window.location object itself, will load the specified URL into the\
    \ browser.\n\nA typical URL address may comprise these parts:\n\n```\nprotocol:\
    \ // host / pathname ? # hash\n```\n\nEach part of the URL address stored in the\
    \ window.location object may be addressed individually using the appropriate location\
    \ property – as demonstrated in this example:\n\n```\n// assign each part of the\
    \ current URL to Variables\nvar locn = \"Href : \" + window.location.href;\nvar\
    \ prot = \"Protocol : \" + window.location.host;\nvar host = \"Host : \" + window.location.host;\n\
    var path = \"Path : \" + window.location.pathname;\nvar hash = \"Hash : \" + window.location.hash;\n\
    \n// display the variable values\nalert(locn+\"\\n\"+prot+\"\\n\"+host+\"\\n\"\
    +path+\"\\n\"+hash+\"\\n\")\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_103_0.png)\n\
    \n> **Hot tip**\nAssigning a new value to location.hash will move the browser\
    \ to the given location in the page.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_103_1.png)\n\
    \n## ...cont'd\n\nThe window.history property contains an array of the URL addresses\
    \ previously visited during a browser session. For security reasons these are\
    \ not directly readable but they are used to navigate back to previous pages.\n\
    \nThe back() and forward() methods of the window.history object emulate the browser's\
    \ Back and Forward buttons.\n\nMore flexible navigation is often provided by the\
    \ window.history.go() method that takes a single argument to specify the location\
    \ by relative position. For instance, an argument value of -1 will revert the\
    \ previous page and a value of -2 reopens the page before.\n\nIn a similar manner\
    \ window.history.go(1) goes forward to the next page in the history array of visited\
    \ URLs.\n\nCalling window.history.go(0) causes the browser to reload the current\
    \ document.\n\nThe function in this example returns the user to the previous page.\
    \ In this case, the function is called from the onclick attribute of a button\
    \ form input in the HTML document.\n\n```\n// a function to load the previous\
    \ page\nfunction go_back() {\n  window.history.go(-1);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_104_0.png)\n\
    \nhistory-2.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_104_1.png)\n\n## Getting\
    \ monitor settings\n\nIt is sometimes useful to have JavaScript get the user's\
    \ screen resolution from the width and height properties of the window.screen\
    \ object. You can also determine the available screen size, without the taskbar,\
    \ using availWidth and availHeight properties.\n\nThe current color setting can\
    \ also be retrieved as the bits-per-pixel value stored in the window.screen.colorDepth\
    \ property.\n\nIn the example below, screen dimensions are retrieved from the\
    \ appropriate window.screen property:\n\n```\n// get screen size\nvar w = window.screen.width;\n\
    var h = window.screen.height;\n\n// get available size\nvar aw = window.screen.availWidth;\n\
    var ah = window.screen.availHeight;\n\n// get color depth\nvar depth = window.screen.colorDepth;\n\
    \n// display the settings\nvar res = \"Resolution: \" + w + \" x \" + h;\nvar\
    \ col = \"Colors: \" + depth;\nvar avl = \"Available screen: \" + aw + \" x \"\
    \ + ah;\nalert(res + \"\\n\" + col + \"\\n\" + avl);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_105_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_105_1.png)\n\n## Recognizing frames\n\
    \nThe window.frames object contains an array of all the frames in a window that\
    \ has been defined in <frameset> tags. JavaScript can access these from within\
    \ frame.\n\nThe script below is included in an HTML frame. It finds the total\
    \ number of frames and reads each of their names:\n\n```\n// find the total number\
    \ of frames\nvar framenums = \"No. frames: \" + parent.frames.length;\n\n// retrieve\
    \ the name of each frame\nvar framenames = \"\\nframe 1: \" + parent.frames[0].name;\n\
    framenames += \"\\nframe 2: \" + parent.frames[1].name;\nframenames += \"\\nframe\
    \ 3: \" + parent.frames[2].name;\n\nalert(framenums + framenames);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_106_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_106_1.png)\n\n> **Hot tip** Always\
    \ name HTML elements to be used by JavaScript, so as to produce code that is comprehensible.\n\
    \n## Addressing frames\n\nThe example on the previous page allows access to different\
    \ frames within a framed window, and because the browser's object model is hierarchical\
    \ the objects and properties within any frame are also accessible.\n\nThis means\
    \ that JavaScript can assign values to these object properties and use their methods\
    \ just as with an unframed window.\n\nTypically a navigation frame on the left\
    \ side of the window will have navigation buttons, when pushed, assign new URL\
    \ locations to a main frame on the right side of the screen.\n\nThis example includes\
    \ an HTML form button in the navigation \"Menu\" frame. When the button is pushed\
    \ the HTML onclick attribute of the button calls the next() function to change\
    \ the locations of both the other frames, \"Page\" and \"Banner\":\n\n```\n//\
    \ function to load new documents into frames 2 and 3\nfunction next() {\n  parent.frames.Page.window.location\
    \ = \"nextpage.html\";\n  parent.frames.Banner.window.location = \"nextbanner.html\"\
    ;\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_107_0.png)\n\nAlthough a\
    \ single click of this button appears to change the contents of both frames simultaneously\
    \ it is worth noting that the browser is actually implementing two separate actions.\
    \ Clicking the browser's Back button illustrates this as it unloads only one frame\
    \ with the first click and the other frame with the second click.\n"
  mdcn: "\n\n# 总结\n\n- 自定义对象可以像内置 JavaScript 对象一样包含属性和方法——就像 `Array` 对象拥有 `Array.length`\
    \ 属性和 `Array.sort()` 方法一样。\n\n- 使用 JavaScript 的 `new` 关键字配合 `Object` 构造函数来创建一个新对象。\n\
    \n- 通过点号 (.) 在对象名后附加其名称来访问属性或方法——例如 `car.color` 和方法。\n\n- 使用 JavaScript 的 `this`\
    \ 在自定义构造函数中为属性和方法赋值。\n\n- 使用 JavaScript 的 `new` 关键字配合自定义构造函数来创建对象的新实例。\n\n- 对象的实例会自动继承其源自对象的属性和方法。\n\
    \n- `navigator` 对象包含有关网络浏览器的信息。\n\n- 使用 `navigator.appName` 属性显示浏览器名称，或使用 `navigator.userAgent`\
    \ 显示浏览器的描述、版本及其环境。\n\n- 你可以通过 `navigator.platform` 属性发现用户运行的是什么操作系统。\n\n- 使用 `navigator.javaEnabled()`\
    \ 方法发现浏览器是否能够执行 Java Applet。\n\n- `navigator.plugins` 属性包含一个包含已插件详情的数组——每个元素代表一个插件。\n\
    \n- 使用 `navigator.plugins` 元素的 `name` 属性显示其名称，或使用该元素的 `description` 属性获取详情。\n\n\
    ## #9 探索 window 对象\n\n本章演示了 JavaScript 如何使用 \"window\" 对象的属性和方法来修改浏览器窗口的不同方面。\n\
    \n- 102 控制位置\n- 104 获取显示器设置\n- 105 识别帧\n- 106 访问帧\n- 108 建议状态消息\n- 109 滚动与移动\n\
    - 110 寻求确认\n- 111 提示输入\n- 112 打开新窗口\n- 114 总结\n\n## 控制位置\n\n`window.location`\
    \ 对象包含当前在浏览器中加载的文档的完整 URL 地址。\n\n它将完整的 URL 存储在 `window.location.href` 属性中，为该属性赋新值或为\
    \ `window.location` 对象本身赋值，会将指定的 URL 加载到浏览器中。\n\n一个典型的 URL 地址可能包含以下部分：\n\n```\n\
    protocol: // host / pathname ? # hash\n```\n\n存储在 `window.location` 对象中的 URL 地址的每个部分都可以使用适当的\
    \ `location` 属性单独访问——如示例所示：\n\n```\n// 将当前 URL 的每个部分赋值给变量\nvar locn = \"Href :\
    \ \" + window.location.href;\nvar prot = \"Protocol : \" + window.location.host;\n\
    var host = \"Host : \" + window.location.host;\nvar path = \"Path : \" + window.location.pathname;\n\
    var hash = \"Hash : \" + window.location.hash;\n\n// 显示变量值\nalert(locn+\"\\n\"\
    +prot+\"\\n\"+host+\"\\n\"+path+\"\\n\"+hash+\"\\n\")\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_103_0.png)\n\
    \n> **热点**\n为 `location.hash` 赋新值将浏览器跳转到页面中指定的地点。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_103_1.png)\n\
    \n## ... 续\n\n`window.history` 属性包含一个浏览器会话期间之前访问过的 URL 地址数组。出于安全考虑，这些地址无法直接读取，但它们被用于导航回之前的页面。\n\
    \n`window.history` 对象的 `back()` 和 `forward()` 方法模拟了浏览器的“后退”和“前进”按钮。\n\n`window.history.go()`\
    \ 方法通常提供更灵活的导航，它接受一个参数来通过相对位置指定目标位置。例如，参数值 `-1` 将返回上一个页面，而值 `-2` 将重新打开在此之前的页面。\n\
    \n同样地，`window.history.go(1)` 会前进到访问过的 URL 历史数组中的下一页。\n\n调用 `window.history.go(0)`会导致浏览器重新加载当前文档。\n\
    \n示例中的函数将用户带到上一个页面。在这种情况下，该函数是从 HTML 文档中按钮表单单元的 `onclick` 属性调用的。\n\n```\n// 加载上一个页面的函数\n\
    function go_back() {\n  window.history.go(-1);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_104_0.png)\n\
    \nhistory-2.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_104_1.png)\n\n## 获取显示器设置\n\
    \n有时让 JavaScript 从 `window.screen` 对象的 `width` 和 `height` 属性获取用户的屏幕分辨率是有用的。你还可以使用\
    \ `availWidth` 和 `availHeight` 属性确定排除任务栏后的可用屏幕尺寸。\n\n当前的颜色设置也可以作为存储在 `window.screen.colorDepth`\
    \ 属性中的每像素位值来获取。\n\n在下面的示例中，从相应的 `window.screen` 属性获取屏幕尺寸：\n\n```\n// 获取屏幕尺寸\n\
    var w = window.screen.width;\nvar h = window.screen.height;\n\n// 获取可用尺寸\nvar\
    \ aw = window.screen.availWidth;\nvar ah = window.screen.availHeight;\n\n// 获取颜色深度\n\
    var depth = window.screen.colorDepth;\n\n// 显示设置\nvar res = \"Resolution: \" +\
    \ w + \" x \" + h;\nvar col = \"Colors: \" + depth;\nvar avl = \"Available screen:\
    \ \" + aw + \" x \" + ah;\nalert(res + \"\\n\" + col + \"\\n\" + avl);\n```\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_105_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_105_1.png)\n\
    \n## 识别帧\n\n`window.frames` 对象包含了在 `<frameset>` 标签定义的所有帧的数组。JavaScript 可以在帧内部访问这些帧。\n\
    \n下面的脚本包含在一个 帧中。它查找帧的总数并读取每个帧的名字：\n\n```\n// 查找帧的总数\nvar framenums = \"No. frames:\
    \ \" + parent.frames.length;\n\n// 获取每个帧的名字\nvar framenames = \"\\nframe 1: \"\
    \ + parent.frames[0].name;\nframenames += \"\\nframe 2: \" + parent.frames[1].name;\n\
    framenames += \"\\nframe 3: \" + parent.frames[2].name;\n\nalert(framenums + framenames);\n\
    ```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_106_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_106_1.png)\n\
    \n> **热点** 始终为供 JavaScript 使用的 HTML元素命名，以便产生易理解的代码。\n\n## 访问帧\n\n上一页的示例允许访问窗口中的不同帧，由于浏览器的对象模型是分层的，任何帧内部的对象和属性也是可见的。\n\
    \n这意味着 JavaScript 可以为这些属性赋值并使用它们的方法，就像在没有框架窗口中一样。\n\n通常，窗口左侧的导航帧会有导航按钮，点击时会为屏幕右侧的主帧分配新的\
    \ URL 位置。\n\n此示例在导航“Menu”帧中包含了一个 HTML 表单按钮。当按钮被按下时，按钮的 HTML `onclick` 属性调用 `next()`\
    \ 函数来更改另外两个帧“Page”和“Banner”的位置：\n\n```\n// 为帧2和帧3加载新文档的函数\nfunction next() {\n\
    \  parent.frames.Page.window.location = \"nextpage.html\";\n  parent.frames.Banner.window.location\
    \ = \"nextbanner.html\";\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_107_0.png)\n\
    \n虽然点击此按钮似乎同时更改了两个帧的内容，但值得注意的是，浏览器实际上在执行两个独立的操作。点击浏览器的“后退”按钮说明了这一点，因为它第一次点击只卸载一个帧，第二次点击卸载另一个。\n\
    \n"
