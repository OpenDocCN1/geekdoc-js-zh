- img_proc: true
  md: "# Looping to fill elements\n\nAll types of loops can be used to easily fill\
    \ the elements of an array with a large number of data values. This is one of\
    \ the major attractions of arrays and it is achieved with very little code.\n\n\
    The example below first creates an array and then, on each iteration, the for\
    \ loop fills each of the array elements with a string value to which is added\
    \ the current counter value.\n\nEach element is concatenated in the variable named\
    \ str before finally being displayed in the alert() box:\n\n```\nvar str = \"\
    FILL ELEMENTS LOOP\\n\";\n// create a new array\nvar arr = new Array();\n\n//\
    \ fill five elements\nfor(var i = 0; i < 5; i++) {\n  arr[i] = \"Number is \"\
    \ + i + \"\\n\";\n  str += arr[i];\n}\n\n// display the value stored in each array\
    \ element\nalert(str);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_51_0.png)\n\
    \n> Hot tip\nThis code could just easily be used to fill 100 elements by making\
    \ the conditional value of 5 into 100.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_51_1.png)"
  merge: -1
  pgno: 51
- img_proc: true
  md: "# Adding more elements\n\nAdditional elements can be added to an array, without\
    \ specifying an actual index number, by using the Array.length property to find\
    \ the next available empty element.\n\nBecause the Array.length value exceeds\
    \ the last index number by 1 it will always specify the next free element when\
    \ it is used as the index number – between the square brackets.\n\nThe example\
    \ below illustrates this when assigning the integer 4 to the next free element\
    \ in the array named a.\n\nThe b array elements are initialized; then the for\
    \ loop successively assigns each b array element value to each free element in\
    \ the array.\n\nFinally all array elements are displayed by the alert() function\
    \ as a comma-separated list of values.\n\n```\nvar a = new Array(1, 2, 3);\n\n\
    // insert an integer into the next empty element\na[a.length] = 4; // a.length\
    \ is 3\n\nvar b = new Array(5, 6, 7);\n\n// copy each b element value into the\
    \ empty a elements\nfor(var i = 0; i < b.length; i++) {\n  a[a.length] = b[i];\n\
    }\n\n// display all a element values\nalert( a);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_52_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_52_1.png)"
  merge: -1
