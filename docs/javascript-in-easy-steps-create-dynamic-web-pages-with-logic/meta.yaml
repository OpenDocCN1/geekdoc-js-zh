  md: "# Reacting to changes\n\nThe Change event occurs when the value of a form input\
    \ is changed, for example when the user selects an item in an options list. The\
    \ onchange event-handler can call a JavaScript function to execute some code whenever\
    \ the Change occurs.\n\nThe example below sets the initial selected option to\
    \ Green and then assigns an event-handler that displays the associated value in\
    \ a text box whenever the selection is changed:\n\n```\n// specify a LOAD event-handler\n\
    window.onload = init;\n\n// a function to react to the LOAD event\nfunction init()\
    \ {\n  window.document.forms.f.s.options[1].selected=true;\n  // specify a CHANGE\
    \ event-handler\n  window.document.forms.f.s.onchange = show_selected;\n}\n\n\
    // a function to react to the CHANGE event\nfunction show_selected() {\n  var\
    \ num = window.document.forms.f.s.selectedIndex;\n  window.document.forms.f.txt.value\
    \ = \n  window.document.forms.f.s.options[num].value;\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_151_0.png)\n\
    \nThis example relates to a <select> element with an id of \"s\" in a <form> with\
    \ the id \"f\".\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_151_1.png)"
  merge: -1
  pgno: 151
- img_proc: true
  md: "# ...cont'd\n\nThe Reset event occurs when the user pushes a form's HTML reset\
    \ button and a JavaScript window.onerror property can specify an event-handler\
    \ to call when the Reset event occurs.\n\nIn this example the Reset event-handler\
    \ simply opens an alert dialog advising the user that the form has reset:\n\n\
    ```\n// specify a LOAD event-handler\nwindow.onload = init;\n// specify a RESET\
    \ event-handler\nfunction init()\n{\n  window.document.forms.f.onreset = advise;\n\
    }\n```\n\n```\n// a function to react to the RESET event\nfunction advise()\n\
    {\n  alert(\"Form has been reset\\nPlease select a color\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_152_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_152_1.png)\n\n> Don't forget\n\nThe\
    \ checked radio button only gets cleared after the user pushes the OK button in\
    \ the alert dialog."
