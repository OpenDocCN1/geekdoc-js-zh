    # Getting the date and time


    Date and time are often used in JavaScript to customize the performance of a web
    page. For example, a script might welcome a user with a greeting appropriate to
    the current time:


    ![](img/9706759b347c5727cfdd3d09614f8c1f_59_0.png)


    The script for this application is contained in the example shown on page 60.


    The date and time that are used in JavaScript are taken from the clock and calendar
    in the host system that is running the browser application in which the script
    is loaded.


    To access the system clock information the script must first create a Date object.
    This is achieved in the same manner in which an Array object is created, using
    the JavaScript new keyword, but now with the JavaScript Date() constructor function.
    The example below creates and displays a new Date object:


    ```

    // create a new Date object

    var now = new Date();

    ```


    ```

    // display the Date object''s date and time information

    alert(now);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_59_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_59_2.png)'
