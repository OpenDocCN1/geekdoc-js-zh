  md: '# Getting monitor settings


    It is sometimes useful to have JavaScript get the user''s screen resolution from
    the width and height properties of the window.screen object. You can also determine
    the available screen size, without the taskbar, using availWidth and availHeight
    properties.


    The current color setting can also be retrieved as the bits-per-pixel value stored
    in the window.screen.colorDepth property.


    In the example below, screen dimensions are retrieved from the appropriate window.screen
    property:


    ```

    // get screen size

    var w = window.screen.width;

    var h = window.screen.height;


    // get available screen size

    var aw = window.screen.availWidth;

    var ah = window.screen.availHeight;


    // get color settings

    var depth = window.screen.colorDepth;


    // display the settings information

    var res = "Resolution: " +w + " x " +h;

    var col = "Colors: " + depth + " bit";

    var avl = "Available screen : " +aw + " x " +ah;\n

    alert(res + "\n" + col + "\n" + avl);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_105_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_105_1.png)'
  merge: -1
