  md: '# Escape sequences


    When a character in a string is preceded by the \ backslash character there is
    a special effect on the character immediately following the backslash. This is
    known as an escape sequence as it allows the character to escape recognition as
    part of the JavaScript syntax.


    The table below lists more escape sequences:


    | b | Backspace |

    | \f | Form feed |

    | \n | New line |

    | \r | Carriage return |

    | \'' | Single quote |

    | \" | Double quote |

    | \\ | Single backslash character |


    > Hot tip

    The code example on the facing page uses the \n newline escape.


    The escape sequence \" is useful to incorporate quotation marks within a string
    without the string itself becoming terminated, as in this example:


    ```

    // display the string with escaped quotes

    alert("We all say \"JavaScript is great!\" " ");

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_16_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_16_1.png)'
