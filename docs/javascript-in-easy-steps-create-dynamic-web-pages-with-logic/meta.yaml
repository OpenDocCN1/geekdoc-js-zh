    # Sorting Array elements sequentially


    The JavaScript Array.sort() method allows string element values to be arranged
    in alphabetical order.


    This is sometimes desirable so that the output can be presented alphabetically.


    Integer and floating-point numeric values will be arranged in ascending order
    – as seen in the following example:


    ```

    // create an array of integers

    var integers = new Array(3, 8, 1, 9, 7, 5, 4, 2, 6);

    // sort the integer array numerically

    integers.sort();


    // create an array of floating-point numbers

    var floats = new Array(0.5, 0.125, 0.75, 0.25);

    // sort the floats array numerically

    floats.sort();


    // create an array of strings

    var strings = new Array("Michael", "Andrew", "David");

    // sort the strings array alphabetically

    strings.sort();


    // separate the elements with a hyphen

    var str = "Integers array: " + integers.join(" - ");

    str += "\nFloats array: " + floats.join(" - ");

    str += "\nStrings array: " + strings.join(" - ");


    // display all three sorted arrays

    alert(str);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_56_0.png)


    > Negative numeric values are arranged as -1, -2, -3, etc.


