    \ | 93.50 |\n\n单元格编辑器\n行 [] 列 新值: [] 更新\n\n## 执行 RIA\n\n此 AJAX 程序的最后部分提供了一个函数，当用户点击表单按钮时会被调用。它首先检查用户是否正确输入了行、列和值；然后用新值以及修订后的行、、列和总计动态地更新相关的表格单元格：\n\
    \n```javascript\n// 用于编辑和更新单元格内容的函数...\nfunction update() {\n  var row = document.getElementById(\"\
    rownum\").options.selectedIndex; // 获取选定的行\n  var col = document.getElementById(\"\
    column\").options.selectedIndex; // 获取选定的列\n\n  // 获取用户输入的新值\n  var new_value\
    \ = parseFloat(document.getElementById(\"new_value\").value);\n\n  // 确保用户输入了列、行和值\n\
    \  if(row == 0) {\n    alert(\"请选择行号\");\n  }\n  if(col == 0) {\n    alert(\"\
    请选择列号\");\n  }\n  if(!new_value) {\n    alert(\"请输入新值\");\n  }\n\n  // 计算目标单元格\n\
    \  var target = ((row - 1) * 5) + col-1;\n\n  // 将新值赋值给 XML 对象元素\n  obj.getElementsByTagName(\"\
    num\")[target].firstChild.data = new_value;\n  populate_cells(); // 显示修订后的单元格值\n\
    \  totalize(); // 并计算新的总计\n\n  // 最后重置所有单元格表单输入...\n  window.document.getElementById(\"\
    rownum\").options[0].selected=true;\n  window.document.getElementById(\"column\"\
    ).options[0].selected=false;\n  window.document.getElementById(\"new_value\").value=\"\
    \";\n}\n```\n\n## 提示\n\n表单包含名为 \"rownum\" 和 \"column\" 的输入，以及一个名为 \"new value\"\
    \ 的文本输入。\n\n## 总结\n\n- AJAX 是 “Asynchronous JavaScript And XML”（异步 JavaScript\
    \ 和 XML）的缩写\n- AJAX 是一种使用多种现有技术创建富有互联网应用（RIA）的技术，其响应性与桌面应用程序相似\n- AJAX 引擎是使用 JavaScript\
    \ 编写的 Web 服务器和 浏览器之间的中间件\n- 与服务器的异步通信不会中断用户与 AJAX 程序的交互\n- Internet Explorer 7、Mozilla\
    \ 和 Safari 浏览器支持 window.XMLHttpRequest 对象\n- XMLHttpRequest 使用其 `open()` 方法指定并使用其\
    \ `send()` 方法发送到服务器\n- 当从 Web 服务器接收响应时，XMLHttpRequest 对象的 `onreadystatechange`\
