  md: "# Finding a character\n\nStrings are just arrays where each element is a character\
    \ and can be referenced in the same way as regular array elements.\n\nSo just\
    \ as in arrays the first character is element 0 (zero).\n\nThe characters can\
    \ be found using the `String.charAt()` method, which takes the element index number\
    \ as its sole argument.\n\nThe example below reads the characters in a string\
    \ and makes changes to the character found:\n\n```\n// create and initialize two\
    \ string variables\nvar str = \"linger in\", newstr = \"\";\n\n// get the first\
    \ and last letters of the string variable\nvar a = \"First letter : \" + str.charAt(0);\n\
    var z = \"Final letter : \" + str.charAt(str.length-1);\n\n// loop through each\
    \ character and copy into into newstr\nunless it's an i - then copy o into newstr\n\
    for(var i = 0; i < str.length; i++) {\n    if (str.charAt(i) != \"i\") newstr\
    \ += str.charAt(i);\n    else newstr += \"o\";\n}\n\n// display newstr and the\
    \ first and last letters of str\nvar result = \"STRINGS\\n\\n\";\nresult += \"\
    New string : \" + newstr + \"\\n\";\nalert( result + a + \"\\n\" + z );\",\n```\n\
