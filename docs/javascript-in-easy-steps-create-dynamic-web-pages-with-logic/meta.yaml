    \ 对象包含许多存储其位置和外观信息的属性。JavaScript 可以动态地更改这些属性，以改变其位置和外观，从而创建交互效果。这种技术通常被称为动态 HTML\
    \ (DHTML)。\n\n在 HTML 中使用的 `<div>` 元素最重要的样式属性可能是 `id`、`top`、`left`、`z-index`、`visibility`、`color`\
