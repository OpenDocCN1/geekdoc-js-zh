  md: '# Why choose JavaScript in easy steps?


    ![](img/9706759b347c5727cfdd3d09614f8c1f_195_0.png)


    JavaScript in easy steps teaches you how to add functionality (logic) and dynamic
    effects (HTML5) to web pages. It contains separate chapters on all major features
    of the JavaScript language. There are code examples and browser screenshots illustrating
    each aspect of JavaScript.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_195_1.png)


    This popular title has been updated for the Document Object Model used by modern
    browsers and includes showing how to develop Rich Internet Applications (RIAs)
    using the latest techniques employing Asynchronous JavaScript And XML (AJAX).


    ![](img/9706759b347c5727cfdd3d09614f8c1f_195_2.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_195_3.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_195_4.png)


    | Polling radio buttons | Polling checkboxes |

    |---|---|

    | Radio buttons are used when the user selects one item from a set of options.
    | Checkboxes are used when the user can select one or more options from a list.
    |

    | When one radio button is selected, others in the same group are deselected.
    | When a checkbox is selected, it remains selected until deselected.|


    ![](img/9706759b347c5727cfdd3d09614f8c1f_195_5.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_195_6.png)


