  - '[PAGE 115]


    # Summary


    +   - The href property of the window.location objects stores the full URL address
    of the current document, and individual parts can be found in protocol, host,
    pathname and hash properties


    +   - Assigning a full URL to window.location loads that document


    +   - The back() and forward() methods of the window.history object emulate the
    browser''s Back and Forward buttons


    +   - Assign a positive or negative numeric argument to the window.history.go()
    method to determine which step to reload


    +   - The window.screen object stores monitor information in its width, height,
    availWidth, availHeight, and colorDepth properties


    +   - The window.frames object is an array of all current frames


    +   - You can access the frameset of a frame with the parent keyword and each
    frame by its array index number, or by its given name


    +   - A message can be shown in the status bar with the window.status property
    or a default message specified by the window.defaultStatus property


    +   - The window.moveBy() and window.moveTo() adjust the position of the window
    within the screen


    +   - The window.scrollBy() and window.scrollTo() methods adjust the position
    of the focus within the browser window


    +   - You can get user input using the window.prompt() and window.confirm() methods


    +   - JavaScript can open and close pop-ups with the window.open() and window.close()
    methods


    +   - Properties and methods of the window object can be addressed without the
    window part of their name – so the window.alert() method can be addressed simply
    as alert()'
- md: "\n# 10 Discovering the document object\n\nThis chapter explores the window.document\
    \ object that allows JavaScript to address components of the document loaded in\
    \ the browser.\n\n- 116 Addressing array components\n- 118 Addressing elements\
    \ directly\n- 120 Using cookies\n- 122 Writing with JavaScript\n- 124 Extracting\
    \ document info\n- 126 Creating new components\n- 128 Summary\n\n## Addressing\
    \ array components\n\nThe window.document object has many properties and methods\
    \ that JavaScript can address to manipulate the loaded document. When the document\
    \ is loaded, information about its component features is stored in the anchors,\
    \ forms, images and links array properties of the window.document object. As all\
    \ other arrays the length can be used to discover the size of any component array\
    \ and individual elements can be addressed using their index numbers.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_117_0.png)\n\
    \nThe following example reveals the names and numbers of the HTML components from\
    \ the window.document object arrays:\n\n```\n<a name=\"top_of_page\" id=\"fragment\"\
    >\nSelect a search engine...</a>\n<a href=\"http://www.google.com\" name=\"google_link\"\
    >\n<img src=\"google.gif\" alt=\"google_graphic\">\n</a>\n<a href=\"http://www.yahoo.com\"\
    \ name=\"yahoo_link\">\n<img src=\"yahoo.gif\" id=\"engine-2\" alt=\"Yahoo_graphic\"\
    >\n</a>\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_117_1.png)\n\n```\n<form\
    \ id=\"form-1\" action=\"\">\n<p><input type=\"button\" value=\"Click Me\" onclick=\"\
    show_parts()\" /></p>\n</form>\n```\n\n```javascript\nfunction show_parts() {\n\
    \  var parts = \"Anchors: \" + document.anchors.length;\n  parts+=\"\\nlist anchor\
    \ name: \" + document.anchors[0].name;\n  parts+=\"\\nForms: \" + document.forms.length;\n\
    \  parts+=\"\\nlist form id: \" + document.forms[0].id;\n  parts+=\"\\nImages:\
    \ \" + document.images.length;\n  parts+=\"\\nlist image id: \" + document.images[0].id;\n\
    \  parts+=\"\\n2nd image id: \" + document.images[1].id;\n  parts+=\"\\nLinks:\
    \ \" + document.links.length;\n  parts+=\"\\nlist link name: \" + document.links[0].name;\n\
    \  parts+=\"\\n2nd link name: \" + document.links[1].name;\n  alert(parts);\n\
    }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_117_2.png)\n\n...cont'd\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_118_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_118_1.png)\n\
    \n> Don't forget\n> Fragment anchors are included in the anchors array, but not\
    \ in the links array.\n\n## Addressing elements directly\n\nThe technique of addressing\
    \ document components with the window.document arrays, as illustrated in the previous\
    \ example, can be avoided in modern browsers that comply with the Document Object\
    \ Model (DOM) specification laid down by the World Wide Web Consortium (W3C).\n\
    \nThe W3C DOM places emphasis on the inclusion of a unique id attribute in HTML\
    \ elements so that they can be addressed directly by the window.document.getElementById\
    \ method. It is useful to test initially for the existence of this method to ensure\
    \ the user has a modern browser compliant with the W3C DOM.\n\nThe example below\
    \ addresses an element with the id attribute value=\"engine-1\", like in the HTML\
    \ document on page 116. It first checks that the browser is W3C DOM compliant\
    \ before retrieving the element's other attribute values.\n\n```javascript\nfunction\
    \ show_attribs() {\n  // test for modern browser\n  if (!window.document.getElementById)\
    \ {\n    alert(\"Not W3C DOM browser!\");\n    return;\n  }\n  // get attribute\
    \ values using id\n  var attribs = \"\";\n  attribs += \"Link name: \" + window.document.getElementById(\"\
    engine-1\").name;\n  attribs += \"\\nTarget: \" + window.document.getElementById(\"\
    engine-1\").href;\n  alert(attribs);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_119_0.png)\n\
    \n> Don't forget:\n> Because the window object is the top level it can be omitted\
    \ from the address so you can just use document.getElementById().\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_119_1.png)\n\
    \nAnother useful method introduced in W3C compliant browsers allows JavaScript\
    \ to create an array of all elements of a specific tag by stating the tag name\
    \ as the argument to window.document.getElementsByTagName(). Notice that this\
    \ will be the actual name of the tag – not the value assigned to an attribute.\n\
    \nThe tags are assigned to the array in the order in which they appear in the\
    \ document so the tag appearing first is zero. Each element in the array can then\
    \ be addressed using the array name and its index.\n\nThe example below checks\
    \ for the W3C DOM and creates an array of the <img> tags, like those on page 116.\
    \ The final value assigned to each <img> tag’s \"alt\" attribute is displayed\
    \ in an alert:\n\n```javascript\nfunction show_attribs() {\n  // check for W3C\
    \ DOM\n  if (!window.document.getElementById) {\n    alert(\"Not W3C DOM browser!\"\
    );\n    return;\n  }\n\n  // create an array of <img> tags\n  var pics = window.document.getElementsByTagName(\"\
    img\");\n  alert(pics[0].alt + \"\\n\" + pics[1].alt);\n}\n```\n\n> Remember:\n\
    > There is an \"s\" in this method, as you get multiple elements with getTagName()\
    \ – but just one element with getElementById().\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_120_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_120_1.png)\n\n## Using cookies\n\n\
    Cookies are tiny files that can be written by JavaScript to store small amounts\
    \ of data on the local hard drive. There are limitations to the use of cookies\
    \ that restrict their size to 4 kilobytes, and web browsers are not required to\
    \ retain more than 20 cookies per web server. Typically a cookie may often retain\
    \ data for use across web pages or on subsequent visits to a website.\n\nThe cookie\
    \ data is held in the window.document.cookie object as a name=value pair – the\
    \ value may not contain any semicolons, commas or whitespace. Multiple name=value\
    \ pairs may be stored by making assignments to window.document.cookie.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_121_0.png)\n\
    \nThe lifespan of a cookie is limited to the current browser session unless an\
    \ expiry date is specified when the cookie is first set.\n\nExpiration is assigned\
    \ to a key name \"expires\" by amending a current Date object to the desired future\
    \ date.\n\nDates of expiry should be expressed in GMT string format by converting\
    \ the Date object using the Date.toGMTString() method.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_121_1.png)\n\
    \nThe calculation in the example below illustrates how days, hours, minutes, seconds\
    \ and milliseconds are used to increment a Date object by exactly one week.\n\n\
    This example stores the user's name and account number in a cookie with a lifespan\
    \ of 7 days:\n\n```javascript\n// the data to be stored in the cookie\nvar user\
    \ = \"Mike McGrath,000456\";\n\n// create a new Date object\nvar expiry = new\
    \ Date();\n\n// set the expiry for 7 days' time\nexpiry.setTime(expiry.getTime()\
    \ + (7*24*60*60*1000));\n\n// create the cookie\nwindow.document.cookie = \"cookie=\"\
    \ + escape(user) + \":\" + \"expires=\" + expiry.toGMTString() + \":\";\n```\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_121_2.png)\n\nIf a cookie is set the\
    \ window.document.cookie object will return true, so JavaScript can test for the\
    \ presence of cookies. When a cookie is located the window.document.cookie object\
    \ returns the stored data string.\n\nParts of the data may be retrieved from the\
    \ stored string using the regular string manipulation methods covered earlier\
    \ in this book.\n\nWhen the script below runs, it first seeks the cookie set by\
    \ the previous example on the opposite page; then it extracts the data values\
    \ to display the cookie content:\n\n```javascript\n// find any cookies\nif(window.document.cookie)\
    \ {\n  // unescape the cookie data\n  var cookiedata = unescape(window.document.cookie);\n\
    \  // split the name=value pairs\n  var userdata = cookiedata.split(\"=\");\n\
    \  // if the cookie is called cookie\n  if(userdata[0] == \"cookie\") {\n    //\
    \ split the comma delimited values\n    var data = userdata[1].split(\". \");\n\
    \    var user = data[0];\n    var acct = data[1];\n    // display the data retrieved\
    \ from the cookie\n    alert(\"Welcome \" + user + \"\\Account number: \" + acct);\n\
    \  }\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_122_0.png)\n\nUnescape\
    \ any escaped data when retrieving cookies.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_122_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_122_2.png)\n\nMultiple name=value pairs\
    \ will automatically be returned with a semicolon separating each pair. Use string.indexOf()\
    \ to identify the required pair.\n"
  mdcn: "\n\n# 10 探索文档对象\n\n本章探索了 `window.document` 对象，它允许 JavaScript 访问浏览器中加载的文档的组件。\n\
    \n- 116 访问数组组件\n- 118 直接访问元素\n- 120 使用 Cookie\n- 122 使用 JavaScript 写入内容\n- 124\
    \ 提取文档信息\n- 126 创建新组件\n- 128 总结\n\n## 访问数组组件\n\n`window.document` 对象具有许多属性和方法，JavaScript\
    \ 可以通过访问这些内容来操作加载的文档。当文档加载时，关于其组件特征的信息会存储在 `window.document` 对象的 `anchors`（锚点）、`forms`（表单）、`images`（图像）和\
    \ `links`（链接）数组属性中。与所有其他数组一样，可以使用 `length` 来发现任何组件数组的大小，并可以使用索引数字访问单个元素。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_117_0.png)\n\
    \n以下示例展示了从 `window.document` 数组获取 HTML 组件的名称和数字：\n\n```\n<a name=\"top_of_page\"\
    \ id=\"fragment\">\nSelect a search engine...</a>\n<a href=\"http://www.google.com\"\
    \ name=\"google_link\">\n<img src=\"google.gif\" alt=\"google_graphic\">\n</a>\n\
    <a href=\"http://www.yahoo.com\" name=\"yahoo_link\">\n<img src=\"yahoo.gif\"\
    \ id=\"engine-2\" alt=\"Yahoo_graphic\">\n</a>\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_117_1.png)\n\
    \n```\n<form id=\"form-1\" action=\"\">\n<p><input type=\"button\" value=\"Click\
    \ Me\" onclick=\"show_parts()\" /></p>\n</form>\n```\n\n```javascript\nfunction\
    \ show_parts() {\n  var parts = \"Anchors: \" + document.anchors.length;\n  parts+=\"\
    \\nlist anchor name: \" + document.anchors[0].name;\n  parts+=\"\\nForms: \" +\
    \ document.forms.length;\n  parts+=\"\\nlist form id: \" + document.forms[0].id;\n\
    \  parts+=\"\\nImages: \" + document.images.length;\n  parts+=\"\\nlist image\
    \ id: \" + document.images[0].id;\n  parts+=\"\\n2nd image id: \" + document.images[1].id;\n\
    \  parts+=\"\\nLinks: \" + document.links.length;\n  parts+=\"\\nlist link name:\
    \ \" + document.links[0].name;\n  parts+=\"\\n2nd link name: \" + document.links[1].name;\n\
    \  alert(parts);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_117_2.png)\n\
    \n...持续\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_118_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_118_1.png)\n\
    \n> 别忘了\n> 分段锚点包含在 `anchors` 数组中，但不在 `links` 数组中。\n\n## 直接访问元素\n\n在上一个示例中，通过 `window.document`\
    \ 数组访问文档组件的技术，在符合世界维网联盟（W3C）制定的文档对象模型（DOM）规范的现代浏览器中是可以避免的。\n\nW3C DOM 强调在 HTML\
    \ 元素中包含唯一的 `id` 属性，以便可以通过 `window.document.getElementById` 方法直接对其进行访问。在最初测试该方法是否存在是有用的，以确保用户拥有的是符合\
    \ W3C DOM 的现代浏览器。\n\n下面的示例访问了 `id` 属性值为 \"engine-1\" 的元素，如第 116 页的 HTML 文档所示。在获取元素的其他属性值之前，它首先检查浏览器是否符合\
    \ W3C DOM。\n\n```javascript\nfunction show_attribs() {\n  // 测试现代浏览器\n  if (!window.document.getElementById)\
    \ {\n    alert(\"Not W3C DOM browser!\");\n    return;\n  }\n  // 使用 id 获取属性值\n\
    \  var attribs = \"\";\n  attribs += \"Link name: \" + window.document.getElementById(\"\
    engine-1\").name;\n  attribs += \"\\nTarget: \" + window.document.getElementById(\"\
    engine-1\").href;\n  alert(attribs);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_119_0.png)\n\
    \n> 别忘了：\n> 因为 `window` 对象是顶层，因此可以从地址中省略，你可以直接使用 `document.getElementById()`。\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_119_1.png)\n\n符合 W3C 的浏览器中引入的另一个实用方法允许\
    \ JavaScript 通过将标签名称作为 `window.document.getElementsByTagName()` 的参数，创建一个特定标签所有元素的数组。注意，这将是标签的实际名称——而不是分配给属性的值。\n\
    \n标签按照它们在文档中出现的顺序分配给数组，因此第一个出现的标签索引为 0。然后可以使用数组名称和其索引来访问数组中的每个元素。\n\n下面的示例检查了\
    \ W3C DOM 并创建了 `<img>` 标签的数组，如第 116 页所示。最后分配给每个 `<img>` 标签的 \"alt\" 属性的值将显示在警报框中：\n\
    \n```javascript\nfunction show_attribs() {\n  // 检查 W3C DOM\n  if (!window.document.getElementById)\
    \ {\n    alert(\"Not W3C DOM browser!\");\n    return;\n  }\n\n  // 创建 <img> 标签数组\n\
    \  var pics = window.document.getElementsByTagName(\"img\");\n  alert(pics[0].alt\
    \ + \"\\n\" + pics[1].alt);\n}\n```\n\n> 记住：\n> 这个方法中有一个 \"s\"，因为你通过 `getTagName()`\
    \ 获取多个元素——而通过 `getElementById()` 只获取一个元素。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_120.png)\n\
    \n## 使用 Cookie\n\nCookie 是 JavaScript 写入本地硬盘以存储少量数据的微型文件。Cookie 的大小限制为 4KB，且浏览器通常允许存储多个\
    \ Cookie。\n\nCookie 数据在 `window.document.cookie` 对象中以 `name=value` 对的形式存储。在后续访问期间，`window.document.cookie`\
    \ 会返回这些 `name=value` 对。\n\n`window.document.cookie` 返回的 `name=value` 对是以分号分隔的。\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_121_0.png)\n\n除非指定了过期时间（expires），否则\
    \ Cookie 的生命周期取决于浏览器会话。\n\n通过 `toGMTString()` 方法以 GMT 格式表示过期时间。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_121_1.png)\n\
    \n下面的示例说明了如何使用天、小时、分钟和毫秒来增加 Date 对象。\n\n此示例在 Cookie 中存储了一周的用户名和账号：\n\n```javascript\n\
    // 要存储在 Cookie 中的数据\nvar user = \"Mike McGrath,00456\";\n\n// 创建一个新的 Date 对象\n\
    var expiry = new Date();\n\n// 设置 7 天后的时间\nexpiry.setTime(expiry.getTime() + 7*24*60*60*1000);\n\
    \n// 创建 Cookie\nwindow.document.cookie = \"cookie=\" + escape(user) + \":expires=\"\
    \ + expiry.toGMTString() + \":\";\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_121_2.png)\n\
    \n如果设置了 Cookie，`window.document.cookie` 对象将返回 true，因此 JavaScript 可以测试 Cookie 是否存在。定位\
    \ Cookie 时，`window.document.cookie` 返回存储的字符串。可以使用本书之前过的字符串处理方法从存储的字符串中提取数据。当下面的脚本运行时，它首先寻找之前设置的\
    \ Cookie；然后提取值显示 Cookie 内容：\n\n```javascript\n// 查找任何 Cookie\nif(window.document.cookie)\
    \ {\n  // 解码 Cookie 数据\n  var cookiedata = unescape(window.document.cookie);\n\
    \  // 分割 name=value 对\n  var userdata = cookiedata.split(\"=\");\n  // 如果 Cookie\
    \ 名为 cookie\n  if(userdata[0] == \"cookie\") {\n    // 分割逗分隔的值\n    var data =\
    \ userdata[1].split(\". \");\n    var user = data[0];\n    var acct = data[1];\n\
    \    // 显示从 Cookie 获取的数据\n    alert(\"Welcome \" + user + \"\\Account number:\
    \ \" + acct);\n  }\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_122_0.png)\n\
    \n在检索 Cookie 时，解码任何转义的数据。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_122_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_122_2.png)\n\n多个 `name=value` 对将自动以分号分隔每个对的形式返回。使用\
    \ `string.indexOf()` 来识别所需的对。\n\n"
