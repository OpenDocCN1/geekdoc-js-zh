  md: "# Using response text\n\nWhen an AJAX engine makes a successful server request\
    \ for text content, using an XMLHttpRequest object, the response is automatically\
    \ stored in the object's responseText property. This means that JavaScript can\
    \ easily assign the returned text to a page component, to display the text without\
    \ reloading the entire page.\n\nTo demonstrate this ability the following example\
    \ builds upon the previous one by more requesting the server to open the file\
    \ called \"data.txt\". The XMLHttpRequest object's onreadystatechange property\
    \ nominates an event-handler that first confirms that the request succeeded by\
    \ checking the object's status and readyState values. If the request was found\
    \ to be successful the text stored in the XMLHttpRequest response property is\
    \ dynamically assigned to a table cell component of the page with the id \"cell\"\
    :\n\n```\nvar http_request = false; // for HttpRequest\nfunction make_request()\
    \ {\n  if (window.XMLHttpRequest) { // IE7, Mozilla\n    http_request = new XMLHttpRequest();\n\
    \  } else if (window.ActiveObject) { // IE6\n    http_request = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n  } else return false;\n\n  http_request.open(\"GET\",\
    \ \"data.txt\", true);\n  http_request.send(null);\n  http_request.onreadystatechange\
    \ = show_text;\n}\n```\n\n```\nfunction show_text() {\n  if (http_request.readyState\
    \ == 4) {\n    if (http_request.status == 200) {\n      window.document.getElementById(\"\
    cell\").innerHTML = http_request.responseText;\n    }\n  }\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_177_0.png)\n\
    \nAJAX applications can confuse the browser's Back button – provide page links\
    \ for navigation."
