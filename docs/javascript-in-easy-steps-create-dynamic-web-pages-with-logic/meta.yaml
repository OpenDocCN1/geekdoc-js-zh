- img_proc: true
  md: "...cont'd\n\nMouseDown event occurs when the user presses a mouse\nbutton and\
    \ a MouseUp event occurs when it is released.\n\nTypically are used together so\
    \ that a single mouse click will\nactivate two event-handlers, like this:\n\n\
    ```\n<input type=\"button\" value=\"Light Switch\">\nonmousedown = \"light(1)\"\
    onmouseup = \"light(0)\"/>\n```\n\nThis example swaps image and changes the value\
    \ of a text box\nwhen the cursor is over the image and a mouse button is pressed.\n\
    It reverts both to their original states when the button is released:\n\n```\n\
    // a function to react to MOUSEDOWN and MOUSEUP events\nfunction light(n) {\n\
    \  var pic = window.document.getElementById(\"bulb\");\n  var box = window.document.getElementById(\"\
    txt\");\n  if(n == 1) {\n    pic.src = \"on.gif\"; box.value = \"Button Down\"\
    ;\n  } else {\n    pic.src = \"off.gif\"; box.value = \"Button is Up\";\n  }\n\
    }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_134_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_134_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_134_2.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_134_3.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_134_4.png)\n\nThe document, link,\\\
    img and button HTML\nelements all support\ntnonmousedown and\nonmouseup attributes."
