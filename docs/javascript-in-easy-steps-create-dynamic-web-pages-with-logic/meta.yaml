  md: '# Summary


    +   - An if statement evaluates a test expression and executes the statements
    within its code block when the result is true


    +   - The JavaScript prompt() function launches a prompt dialog inputting from
    the user


    +   - The else keyword allows alternative statements to be executed when an if
    statement evaluates a test expression as false


    +   - Each switch statement evaluates a single expression and seeks a label matching
    its result – statements associated with the matching case label are then executed,
    or default statements executed if there is no match


    +   - Each loop begins with an initializer, a test expression, and an incrementer
    or decrementar


    +   - Any loop will continue iterating until the test expression becomes false
    – the loop then ends


    +   - A for-in loop is useful to enumerate all properties within an object


    +   - The statement block in a while loop must contain an incrementer or decrementar
    to avoid being an infinite loop


    +   - A while loop may not execute a single iteration if the test expression at
    the beginning is found to be false


    +   - A do-while loop will always execute its statements once because the test
    expression follows the statement block


    +   - The break keyword can be used to terminate a statement statement and terminate
    a loop when a test expression is true


    +   - The continue keyword can be used to end the current iteration of a loop
    when a test expression is true – allowing the loop to execute the next iteration'
