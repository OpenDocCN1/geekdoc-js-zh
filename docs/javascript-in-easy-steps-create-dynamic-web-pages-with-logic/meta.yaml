  md: "# Addressing frames\n\nThe example on the previous page allows access to different\
    \ frames within a framed window, and because the browser's object model is hierarchical\
    \ the objects and properties within any frame are also accessible.\n\nThis means\
    \ that JavaScript can assign values to these object properties and use their methods\
    \ just as with an unframed window.\n\nTypically a navigation frame on the left\
    \ side of the window will have navigation buttons, when pushed, assign new URL\
    \ locations to a main frame on the right side of the screen.\n\nThis example includes\
    \ an HTML form button in the navigation \"Menu\" frame. When the button is pushed\
    \ the HTML onclick attribute of the button calls the next() function to change\
    \ the locations of both the other frames, \"Page\" and \"Banner\":\n\n```\n//\
    \ function to load new documents into frames 2 and 3\nfunction next() {\n  parent.frames.Page.window.location\
    \ = \"nextpage.html\";\n  parent.frames.Banner.window.location = \"nextbanner.html\"\
    ;\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_107_0.png)\n\nAlthough a\
    \ single click of this button appears to change the contents of both frames simultaneously\
    \ it is worth noting that the browser is actually implementing two separate actions.\
    \ Clicking the browser's Back button illustrates this as it unloads only one frame\
    \ with the first click and the other frame with the second click."
