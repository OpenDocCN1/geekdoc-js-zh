    # 算术运算符


    JavaScript 中常用的算术运算符列如下表所示，并列出了它们所执行的操作：


    | 运算符 | 操作 |

    |---|---|

    | + | 加法（并拼接字符串） |

    | - | 减法 |

    | * | 乘法 |

    | / | 除法 |

    | % | 取模 |

    | ++ | 增增 |

    | -- | 减减 |


    注意，+ 运算符根据给定的操作数有两种操作类型。它将两个数值值相加并给出加法结果。它还可以连接两个字符串值并返回拼接后的字符串，如对页上的示例所示。


    % 取模运算符会将第一个给定的数字除以第二个数字并返回余数。这在判断一个数字是奇数还是偶数时最有用。


    ++ 增增运算符和 -- 减减运算符将给定的值改变 1 并返回新值。它们最常用于计算循环中的迭代次数。


    所有其他运算符的作用都如你预期的那样，但在使用多个运算符的表达式中，应注意使用括号，以明确操作顺序：


    ```

    a = b * c - d % e / f; // 这不清晰

    a = (b * c) - ((d % e) / f); // 这更清晰

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_25_0.png)


    使用取模运算符测试奇值或偶值的代码可以在第 36 页的 if 语句示例中找到。


    # ...续上


    ```

    var addnum = 20 + 30; // 加法

    var addstr = "I love " + "JavaScript"; // 拼接

    var sub = 35.75 - 28.25; // 减法

    var mul = 8 * 50; // 乘法

    var mod = 65 % 2; // 取模

    var inc = 5 ; inc = ++inc; // 增增

    var dec = 5 ; dec = --dec; // 减减

    var result = "Addnum is " + addnum + "\n";

    result += "Addstr is " + addstr + "\n";

    result += "Sub is " + sub + "\n";

    result += "Mul is " + mul + "\n";

    result += "Mod is " + mod + "\n";

    result += "Inc is " + inc + "\n";

    result += "Dec is " + dec + "\n";

    alert ( result );

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_26_0.png)


    > 注意

    > 增增和减减运算符也可以用在操作数之后。注意，在这些情况下，它们会执行操作，但只返回未操作之前的值。


    ![](img/9706759b347c5727cfdd3d09614f8c1f_26_1.png)


    # 逻辑运算符


    JavaScript 中可使用的三个逻辑运算符列如下表：


    | 运算符 | 操作 |

    |---|---|

    | && | 逻辑与 |

    | || | 逻辑或 |

    | ! | 逻辑非 |


    逻辑运算符用于具有布尔值 true 或 false 的操作数——即可以转换为 true 或 false 的值。


    逻辑 && 运算符将评估两个操作数，只有当两个操作数本身都为 true时才返回 true。否则，&& 运算符将返回 false。


    ![](img/9706759b347c5727cfdd3d09614f8c1f_27_0.png)


    在第 32 页关于条件运算符的章节有一个条件分支的示例。


    与需要两个操作数都为 true 的 && 运算符不同，|| 运算符会评估它的两个操作数，如果其中一个操作数返回 true 则返回 true。如果两个都不返回
    true，|| 则返回 false。这在 JavaScript 应用中用于在两个条件之一满足时执行特定操作。


    第三个逻辑运算符 ! 是一个单目运算符，用在单个操作数之前。它返回给定操作数的反值，因此如果变量的值为 true，那么 ! 的值就是 false。这在 JavaScript
    应用中用于通过像 a++ 这样的语句在连续迭代中切换变量的值。这将确保在每次通过时值发生变化——就像灯的开启和关闭一样。


