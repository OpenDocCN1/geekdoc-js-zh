  - "[PAGE 62]\n\n# Calculating elapsed time\n\nThe JavaScript Date.getTime() method\
    \ can be used to compare two date objects numerically.\n\nThe method returns a\
    \ number that is the difference in milliseconds between the date value and midnight\
    \ on January 1, 1970 (sometimes referred to as \"the epoch\").\n\nThe example\
    \ below creates a Date object both before and after running a loop, and then compares\
    \ the values returned by Date.getTime() method to calculate the actual time taken\
    \ to execute the loop:\n\n```\n// create a new Date object then get the current\
    \ time\nvar start = new Date();\nvar msec1 = start.getTime();\n\n// run a loop\
    \ counting up to 250,000\nvar num = 0;\nfor( var i = 0; i < 250000; i++ )\n num++;\n\
    \n// get another Date object and get the time now\nvar stop = new Date();\nvar\
    \ msec2 = stop.getTime();\n\n// subtract the start time from the stop time to\n\
    // discover the amount of time between the two points\nvar diff = ( msec2 - msec1\
    \ ) / 1000;\n\n// display the elapsed time\nalert(\"Time elapsed: \" +diff+\"\
    \ seconds\");\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_62_0.png)\n\n>\
    \ Hot tip\nAdjust the number that the loop counts up according to your browser\
    \ and platform.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_62_1.png)"
  - '[PAGE 63]


    # Utilizing universal time


    Universal Time is the standard world time clock that runs at Greenwich Mean Time.


    Date object methods used in the previous examples all return the local system
    time but sometimes it is preferable to use the standard of Universal Time.


    For this Date object has a series of methods that convert the time and date information
    from local time to universal.


    The example below calls local and universal time information on a PC running at
    Eastern European Time:


    ```

    // create a new Date object

    var now = new Date();


    // get the local time in hours

    var hh = now.getHours();


    // get the universal time in hours

    var utc_hh = now.getUTCHours();


    // get minutes and seconds

    var mn = now.getMinutes();

    var ss = now.getSeconds();


    // ensure there are two digits for the minute value

    if (mn < 9) mn = "0" +mn;


    // display both times

    var eet = "Athens time: " +hh+":" +mn+":" +ss+"\n";

    var utc = "Universal time: " +utc_hh+":" +mn+":" +ss";

    alert(eet + " " + utc);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_63_0.png)


    > Don''t forget

    If the minutes value is less than 10 this script adds a leading zero to it.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_63_1.png)'
  - '[PAGE 64]


    # Recognizing time zones


    JavaScript can determine which time zone the user is in using the Date.getTimezoneOffset()
    method.


    The method gets the local time from the Date object and compares it to the UTC
    time. The return value is the difference stated in minutes because some countries
    have time zones at other than regular one-hour intervals.


    In the example below the Date.getTimezoneOffset() method decides in which U.S.
    time zone, if any, the user is located:


    ```

    // create a new Date object

    var now = new Date();


    // get the number of minutes offset from UTC

    var offset = now.getTimezoneOffset();


    // create an empty variable

    var msg;


    // assign an appropriate message

    switch(offset) {

    case 300 : msg = "East Coast"; break;

    case 360 : msg = "Central"; break;

    case 420 : msg = "Mountain"; break;

    case 480 : msg = "Pacific"; break;

    default : msg = "all";

    }


    // display the message

    alert("Welcome to " + msg + " visitors.");

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_64_0.png)


    > Hot tip

    This method can easily be used to redirect users to a local web page.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_64_1.png)'
  - '[PAGE 65]


    # Setting the date and time


    The JavaScript code may manipulate the Date object information using a variety
    of Date.set() methods.


    These mirror the range Date.get() methods for extracting parts of the Date object
    information, but are instead to set new values.


    In the example below the initial Date objects are stored in the variable name
    orig. then various Date.set() methods apply new values to the Date object information:


    ![](img/9706759b347c5727cfdd3d09614f8c1f_65_0.png)


    ```

    // create a new Date object

    var now = new Date();


    // store the original date and time information

    var orig = "Original \n" + now.toString()+".\n\n"


    // set new date and time details

    now.setDate(21);

    now.setMonth(11);

    now.setHours(12);

    now.setMinutes(30);

    now.setSeconds(15);

    now.setFullYear(2009);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_65_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_65_2.png)


    The toString() method used here returns the string values of JavaScript objects
    and has many uses.


    ```

    // store the modified date and time information

    var mod = "Modified \n" + now;


    // display original and modified dates

    alert(orig + mod);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_65_3.png)'
  - '[PAGE 66]


    # Creating date strings


    In many instances the Date object information must be converted into a string
    in order to store or use that information.


    The Date.toString() method on the facing page does this but it is often preferable
    to store this information in standard UTC time.


    JavaScript provides the Date.toGMTString() method that both converts the information
    to a string and converts it to the GMT (UTC) time zone.


    Using this method of storing date information avoids time zone confusion and is
    commonly used as the standard when setting the life span of cookie files.


    This simple example illustrates the Date.toGMTString() method performing its conversions
    in a browser in Tokyo, Japan:


    ```

    // create a new Date Object

    var now = new Date();


    // store local time

    var jpn = "Tokyo Time:\n" + now.toString() + "\n\n";


    // store GMT time

    var gmt = "UTC Time:\n" + now.toGMTString();


    // display local time and GMT time

    alert(jpn + gmt);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_66_0.png)


    A complete example setting cookies using this method can be found on page 120.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_66_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_66_2.png)'
