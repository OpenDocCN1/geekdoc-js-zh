  md: '# Summary


    +   - Use the JavaScript new keyword together with the intrinsic Date() constructor
    to create a Date object


    +   - Each Date object has special methods getDate(), getUTCDate(), getMonth(),
    and getYear(), which return numerical values representing individual calendar
    components of date


    +   - Each Date object has special methods getHours(), getMinutes(), getSeconds(),
    and getMilliseconds(), which return individual time components of date


    +   - The combined time part of a Date object can be retrieved using the special
    getTime() method


    +   - Subtract one combined time from another to discover the difference between
    two times


    +   - The Date object''s getHours() method returns local time but the getUTCHours()
    method returns Universal Time at GMT


    +   - Comparing local system time with Universal Time, using the Date object''s
    getTimezoneOffset() method, reveals the user''s time zone


    +   - The components can be set in a date object using setDate(), setMonth(),
    setHours(), setMinutes(), setSeconds() and setFullYear() methods


    +   - Information in a Date object can be converted to a string type using the
    toString() method — it can be converted to a string in Universal Time using the
    toGMTString() method


    +   - The window.setTimeout() method creates a timer and requires two arguments
    stating the name of a function to call and the interval at which it should be
    called


    +   - A timer can be stopped by using the window.clearTimeout() method'
