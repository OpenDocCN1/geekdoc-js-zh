    \n# 利用通用时间\n\n通用时间（Universal Time）是按照格林尼治标准时间运行的标准世界时钟。\n\n之前示例中使用的 `Date` 对象方法都返回本地系统时间，但有时使用通用时间标准更为理想。\n\
