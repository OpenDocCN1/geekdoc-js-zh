  md: "# ...cont'd\n\nThe document.forms[].elements object contains an array of all\
    \ the elements within a form, indexed in the order in which they appear in the\
    \ HTML code. With a name \"f\" for instance, document.forms.elements[0] addresses\
    \ the first element that appears in that form.\n\nIf the id attribute of the element\
    \ has been assigned a value then the element can be addressed by that value. So\
    \ the element with id \"btn1\" in this form \"f\" can be addressed as document.forms.f.btn1:\n\
    \n```\n<form id=\"f\" method=\"post\" action=\"\">\n<input type=\"button\" id=\"\
