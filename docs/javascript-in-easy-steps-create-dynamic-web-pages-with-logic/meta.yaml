- md: "\n# Calculating elapsed time\n\nThe JavaScript Date.getTime() method can be\
    \ used to compare two date objects numerically.\n\nThe method returns a number\
    \ that is the difference in milliseconds between the date value and midnight on\
    \ January 1, 1970 (sometimes referred to as \"the epoch\").\n\nThe example below\
    \ creates a Date object both before and after running a loop, and then compares\
    \ the values returned by Date.getTime() method to calculate the actual time taken\
    \ to execute the loop:\n\n```javascript\n// create a new Date object then get\
    \ the current time\nvar start = new Date();\nvar msec1 = start.getTime();\n\n\
    // run a loop counting up to 250,000\nvar num = 0;\nfor( var i = 0; i < 250000;\
    \ i++ )\n num++;\n\n// get another Date object and get the time now\nvar stop\
    \ = new Date();\nvar msec2 = stop.getTime();\n\n// subtract the start time from\
    \ the stop time to\n// discover the amount of time between the two points\nvar\
    \ diff = ( msec2 - msec1 ) / 1000;\n\n// display the elapsed time\nalert(\"Time\
    \ elapsed: \" +diff+\" seconds\");\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_62_0.png)\n\
    \n> Hot tip\n> Adjust the number that the loop counts up according to your browser\
    \ and platform.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_62_1.png)\n\n# Utilizing\
    \ universal time\n\nUniversal Time is the standard world time clock that runs\
    \ at Greenwich Mean Time.\n\nDate object methods used in the previous examples\
    \ all return the local system time but sometimes it is preferable to use the standard\
    \ of Universal Time.\n\nFor this Date object has a series of methods that convert\
    \ the time and date information from local time to universal.\n\nThe example below\
    \ calls local and universal time information on a PC running at Eastern European\
    \ Time:\n\n```javascript\n// create a new Date object\nvar now = new Date();\n\
    \n// get the local time in hours\nvar hh = now.getHours();\n\n// get the universal\
    \ time in hours\nvar utc_hh = now.getUTCHours();\n\n// get minutes and seconds\n\
    var mn = now.getMinutes();\nvar ss = now.getSeconds();\n\n// ensure there are\
    \ two digits for the minute value\nif (mn < 9) mn = \"0\" +mn;\n\n// display both\
    \ times\nvar eet = \"Athens time: \" +hh+\":\" +mn+\":\" +ss+\"\\n\";\nvar utc\
    \ = \"Universal time: \" +utc_hh+\":\" +mn+\":\" +ss;\nalert(eet + \" \" + utc);\n\
    ```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_63_0.png)\n\n> Don't forget\n\
    > If the minutes value is less than 10 this script adds a leading zero to it.\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_63_1.png)\n\n# Recognizing time zones\n\
    \nJavaScript can determine which time zone the user is in using the Date.getTimezoneOffset()\
    \ method.\n\nThe method gets the local time from the Date object and compares\
    \ it to the UTC time. The return value is the difference stated in minutes because\
    \ some countries have time zones at other than regular one-hour intervals.\n\n\
    In the example below the Date.getTimezoneOffset() method decides in which U.S.\
    \ time zone, if any, the user is located:\n\n```javascript\n// create a new Date\
    \ object\nvar now = new Date();\n\n// get the number of minutes offset from UTC\n\
    var offset = now.getTimezoneOffset();\n\n// create an empty variable\nvar msg;\n\
    \n// assign an appropriate message\nswitch(offset) {\ncase 300 : msg = \"East\
    \ Coast\"; break;\ncase 360 : msg = \"Central\"; break;\ncase 420 : msg = \"Mountain\"\
    ; break;\ncase 480 : msg = \"Pacific\"; break;\ndefault : msg = \"all\";\n}\n\n\
    // display the message\nalert(\"Welcome to \" + msg + \" visitors.\");\n```\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_64_0.png)\n\n> Hot tip\n> This method\
    \ can easily be used to redirect users to a local web page.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_64_1.png)\n\
    \n# Setting the date and time\n\nThe JavaScript code may manipulate the Date object\
    \ using a variety of Date.set() methods. These mirror the Date.get() methods for\
    \ extracting parts of the Date information, but instead to set new values.\n\n\
    In the example below the initial Date objects are stored in variable orig. then\
    \ various Date.set() methods apply new values to the Date information:\n\n```javascript\n\
    // create a new Date object\nvar now = new Date();\n\n// store the original date\
    \ and time\nvar orig = \"Original \" + now.toString()+\".\\n\"\n\n// set new date\
    \ and time details\nnow.setDate(21);\nnow.setMonth(11);\nnow.setHours(12);\nnow.setMinutes(30);\n\
    now.setSeconds(15);\nnow.setFullYear(2009);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_65_0.png)\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_65_1.png)\n\nThe toString() method used\
    \ here returns the string values of JavaScript objects and has many uses.\n\n\
    ```javascript\n// store the modified date and time\nvar mod = \"Modified \" +\
    \ now;\n\n// display original and modified dates\nalert(orig + mod);\n```\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_65_2.png)\n\n# Creating date strings\n\
    \nIn many instances the Date object information must be converted into a string\
    \ in order to store or use that.\n\nThe Date.toString() method on the page does\
    \ this but it is often preferable to store this information in standard UTC.\n\
    \nJavaScript provides the Date.toGMTString() method that both converts the information\
    \ to a string and converts it the GMT (UTC) time zone. Using this method of storing\
    \ date information avoids time zone confusion and is commonly used as the standard\
    \ when setting cookie files.\n\nThis simple example illustrates the Date.toGMTString()\
    \ method performing its conversions in a browser in Tokyo, Japan:\n\n```javascript\n\
    // create a new Date Object\nvar now = new Date();\n\n// store local time\nvar\
    \ jpn = \"Tokyo Time:\\n\" + now.toString() + \"\\n\\n\";\n\n// store GMT time\n\
    var gmt = \"UTC Time:\\n\" + now.toGMTString();\n\n// display local time and GMT\
    \ time\nalert(jpn + gmt);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_66_0.png)\n\
    \nA complete example setting cookies using this method can be found on page 120.\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_66_1.png)\n![](img/9706759b347c5727cfdd3d09614f8c1f_66_2.png)\n\
    \n# Making a system timer\n\nWhen JavaScript code is needed to perform an action\
    \ repeatedly in a web browser, the system clock can be used with the JavaScript\
    \ setTimeout() method of the window object.\n\nThe window.setTimeout() method\
    \ can run a function after a specified interval. Two arguments are required: the\
    \ name of the function to call and the required interval time in milliseconds.\
    \ This method is often used at the end of a function to call the same function\
    \ recursively, setting a delay.\n\n> Hot tip\n> There is a slide-show script on\
    \ page 166 using this method.\n\nMany uses can be found for this method in creating\
    \ dynamic effects – for instance, in slide-show scripts where the function displays\
    \ successive images at given intervals.\n\nThe example here uses the window.setTimeout()\
    \ method to display an alert dialog box at 10-second intervals:\n\n```javascript\n\
    // create and initialize a counter variable\nvar num = 0;\n\n// a recursive function\
    \ to display a message\nfunction timeout() {\n    num++;\n    // increment the\
    \ counter\n    // display the message\n    alert(\"This is 10-Second Message No:\
    \ \" + num);\n    // set interval before calling this function again\n    window.setTimeout(\"\
    timeout\", 10000);\n}\n\n// call the function to start the routine\ntimeout();\n\
