- img_proc: true
  md: "# Reversing element order\n\nArrays can be used to contain a file name or a\
    \ complete URL in each element use for dynamic features in web pages.\n\nOne such\
    \ popular use is with JavaScript slide shows that rotate a series of images with\
    \ a specified interval between each one.\n\nAn array is used to hold the URL of\
    \ each image in its elements so that the script can easily reference them by array\
    \ index.\n\nIf the slide show is required to reverse after displaying the final\
    \ image, rather than start over at the first image, this can be achieved by reversing\
    \ the element order inside the array.\n\nThe following example creates an initial\
    \ array of three images whose order will be reversed after the final image is\
    \ displayed and the rev variable is set to true:\n\n```\n// create a new array\
    \ of image URLs\nvar imgs = new Array(\"img1.gif\",\"img2.gif\",\"img3.gif\");\n\
    \n// create a control variable\nvar rev = false;\n\n// when the slide show displays\
    \ the final image\nrev = true;\n\nif( rev == true ) {\n  imgs.reverse();\n}\n\n\
    // display the reversed element order\nalert(imgs.join(\" - \"));\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_54_0.png)\n\
    \nHot tip A complete slide show script is given on pages 166-167.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_54_1.png)\n\
    \nreverse.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_54_2.png)\n\nHot tip\
    \ The evaluation (rev == true) can be abbreviated to a simple (rev)."
  merge: -1
