  md: '# Using the javascript: protocol


    The HTML "href" attribute in a hyperlink usually contains a URL to load when the
    user clicks that link, but can be made to execute JavaScript code instead by using
    the javascript: protocol.


    The javascript: protocol allows short snippets of JavaScript code, of up to 512
    bytes, to be included directly in the <a> anchor element in an HTML document and
    can be useful to create dynamic effects.


    The string containing the JavaScript code should be enclosed within double quotes,
    so strings within the code should be enclosed within single quotes to avoid confusing
    the browser.


    In the example below the javascript: protocol is used to create an alert dialog
    – single quotes surround a text string that is concatenated with an object property:


    ```

    <p>

    a href="javascript:alert(''You are browsing with\n'' + navigator.appName)">Show
    browser name</a>

    </p>

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_159_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_159_1.png)


    Using the javascript: protocol is frowned upon by many but is included here for
    completeness.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_159_2.png)'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# ...cont''d


    Executing JavaScript code snippets with the javascript protocol can offer alternatives
    for browsers where JavaScript is disabled by returning a boolean false to the
    browser.


    This is illustrated in the example below that calls upon the window.open() method,
    where JavaScript is enabled, to load a specified HTML document in a popup window.
    The snippet returns a false value to the browser it ignores the "href" attribute
    and does not load page into the current window.


    Conversely, in browsers that do not have JavaScript enabled, the onclick attribute
    is ignored the HTML document specified by the "href" attribute does not load in
    the current window.


    ```

    <p>

    <a href="more.html"

    onclick="javascript:window.open(

    ''more.html'',''.width=350,height=100'');return false">\nTell me more</a>

    </p>

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_160_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_160_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_160_2.png)


    Tell me more


    ![](img/9706759b347c5727cfdd3d09614f8c1f_160_3.png)


    Beware Returning a true value with this example, instead of false, would load
    the page into both windows in browsers where JavaScript is enabled.'
