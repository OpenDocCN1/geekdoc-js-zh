    # 介绍 AJAX


    最近的创新使得多种 Web 技术能够和谐工作，从而创建富互联网应用程序（RIA），其响应性与桌面应用程序相似。这些组合技术统称为“AJAX”（异步 JavaScript
    XML），它包含了：


    - 基于标准的呈现 —— 使用 HTML

    - 动态交互 —— 使用 DOM

    - 数据交换 —— 使用 XML

    - 异步数据处理 —— 使用 JavaScript


    理解 AJAX 并不是一种特定的技术，而是一种技术。为了充分理解 AJAX 的优势，首先要意识到它并不是一种技术，而是一种技术。AJAX 允许用户在不等待页面加载的情况下与服务器进行交互。当服务器返回响应时，AJAX
    引擎会处理这些：


    ![](img/9706759b347c5727cfdd3d09614f8c1f_173_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_173_1.png)


    AJAX 引擎的核心是一个特殊的 `XMLHttpRequest` 对象，它提供了从 Web 服务器检索 XML 和数据的方法。在 Internet Explorer
    7、Safari 和 Mozilla 浏览器中，其完整地址是 `window.XMLHttpRequest`，可以使用 关键字创建该对象的实例。在早期的 Internet
    Explorer 中，可以使用 `new ActiveX("Microsoft.XMLHTTP")` 创建实例。


    请求的性质通过 `XMLHttpRequest` 对象的 `open()` 方法的三个参数定义，指定检索方法、URL 以及一个用于异步请求的布尔值。


    然后可以使用 `XMLHttpRequest` 对象的 `send()` 方法将请求发送到服务器 —— 将要发送到服务器的文本作为参数，或使用 `null`
    关键字。


    最后，`readystatechange` 属性可以指定在接收到服务器响应时调用的事件处理器。此时，`XMLHttpRequest` 对象的 `readyState`
