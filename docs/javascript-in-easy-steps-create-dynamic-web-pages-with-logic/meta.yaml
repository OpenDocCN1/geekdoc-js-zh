  md: "# Conditional if\n\nThe if keyword is used to perform the conditional JavaScript\
    \ test to evaluate an expression for a boolean value. The statement following\
    \ the evaluation will only be executed when the expression is true. The syntax\
    \ for the if statement looks like this:\n\n```\nif (test expression) statement-to-execute-when-true\
    \ :\n```\n\nThe code to be executed may contain multiple statements if they are\
    \ enclosed within a pair of curly braces to form a statement block.\n\nIn the\
    \ example below the expression to be tested uses the modulus operator to determine\
    \ if the value contained in the variable named is exactly divisible by 2. The\
    \ statement block has two statements - one to assign a string value to a variable\
    \ and another to call a JavaScript function.\n\n```\n// create two variables\n\
    var msg, num;\num = 7;\n// test if the number is not exactly divisible by 2\n\
    if (num % 2 != 0) {\n  msg = num + \" is an odd number.\";\n  alert(msg);\n}\n\
    ```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_37_0.png)\n\n> Hot tip\nThe expression\
    \ could alternatively have used (num % 2 == 1) to detect an odd number.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_37_1.png)"
  merge: -1
  pgno: 37
- img_proc: true
  md: "# If-prompt statement prompt() function\n\nThis example calls the JavaScript\
    \ prompt() function, which needs two arguments to be supplied by the caller. The\
    \ first argument is the message to be displayed and the second is a default entry\
    \ in the input field – in this case an empty string.\n\nThe user input is assigned\
    \ to the username variable and is displayed by the alert() function if the string\
    \ is not still empty.\n\n```\n// initialize a variable with a null value\nvar\
    \ username = null;\nif (username == null) {\n  // ask the user for their name\n\
    username = prompt(\"Please Enter Your Name\", \"\");\n  // ... and then greet\
    \ the user by name\n  if (username != \"\") {\n    alert(\"Welcome \" + username);\n\
    \  }\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_38_0.png)\n\n> > Beware\n\
    nThe prompt dialog will open with an empty input field but is shown here after\
    \ user input.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_38_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_38_2.png)"
  merge: -1
