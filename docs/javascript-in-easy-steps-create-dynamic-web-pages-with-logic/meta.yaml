  md: "# Inserting content\n\nJavaScript can dynamically insert content into a document\
    \ element using its innerHTML property. This allows a script to determine what\
    \ text, or other content, should be contained in the element.\n\nUtilizing the\
    \ Date object along a timer to create a display that updates every second to produce\
    \ a clock. The current time can then be displayed by inserting a text string into\
    \ an element with its innerHTML property.\n\nThe example below displays the local\
    \ time dynamically in an HTML <div> element which has the id \"clock\". The function\
    \ is initially started by a window.onload event-handler and is then called recursively:\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_165_0.png)\n\n```\n// a function to\
    \ dynamically display the local time\nfunction tick() {\n  // create a new Date\
    \ object\n  var now = new Date();\n\n  // extract the current hours, minutes and\
    \ seconds\n  var hh = now.getHours();\n  var mn = now.getMinutes();\n  var ss\
    \ = now.getSeconds();\n\n  // ensure each component has two digits\n  if(hh <=\
    \ 9) hh = \"0\" + hh;\n  if(mn <= 9) mn = \"0\" + mn;\n  if(ss <= 9) ss = \"0\"\
    \ + ss;\n\n  // assign the current time string to the div\n  window.document.getElementById(\"\
    clock\").innerHTML = hh + \": \" + mn + \": \" + ss;\n\n  // set the interval\
