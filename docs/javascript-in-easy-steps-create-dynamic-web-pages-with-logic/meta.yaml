- md: "\n# Writing with JavaScript\n\nThe write() method of the window.document object\
    \ is a tremendously powerful feature that allows JavaScript to create content\
    \ dynamically when loading a web page. The method takes a single string argument\
    \ containing the content to be written into the page, and this may include HTML\
    \ tags to format the content.\n\nTypically the window.document.write() method\
    \ adds content within the <body> section of an HTML document and will write selected\
    \ content following a conditional test.\n\nIt should be noted that calling this\
    \ method at runtime will cause the specified content to be written into a new\
    \ blank document, or replacing the current page.\n\nVariable values may also be\
    \ concatenated with a string argument in order to introduce a variable value into\
    \ the content of a web page.\n\nThis example first generates a random number and\
    \ then tests to determine whether the number is odd or even. Selected content\
    \ is added to the page depending on the result of this test:\n\n```javascript\n\
    // get a random integer between 1 - 100\nvar n = Math.ceil(Math.random() * 100);\n\
    \n// determine whether the number is odd or even\nvar ntype = (n % 2 == 0) ? \"\
    Even\" : \"Odd\";\n\n// write a description of the number\ndocument.write(\"<h1>Number\
    \ \"+n+\" is \"+ntype+\"</h1>\");\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_123_0.png)\n\
    \nDon't forget The \"window\" part of the address can optionally be omitted –\
    \ simply use document.write().\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_123_1.png)\n\
    \nwrite.js\n\n# ...cont'd\n\nThe window.document.open() method opens a new HTML\
    \ document, which can be written to by using the window.document.write() method\
    \ to create dynamic content. When the content has been written the document stream\
    \ should be closed by the window.document.close() method. The example below builds\
    \ on the pop-up window example in the previous chapter by writing the content\
    \ from JavaScript instead of simply loading an existing HTML document:\n\n> Hot\
    \ tip\n> Pass an empty string as the URL argument to open an empty window.\n\n\
    ```javascript\n// a function to create a dynamic popup window\nfunction popup()\
    \ {\n// create the popup window\nvar popwindow = window.open(\"\", \"\", \"top=40,left=30,width=250,height=125\"\
    );\n// open the pop-up window HTML document\npopwindow.document.open();\n// write\
