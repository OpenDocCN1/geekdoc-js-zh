  md: '# Prompting for input


    The other window object method that produces a dialog box when called is the window.prompt()
    method that was introduced in previous examples as its shortened prompt() form.
    This method gets keyboard input from the user through a dialog box containing
    a text field with OK and Cancel buttons. It requires two string arguments, to
    specify a message to display and a default text field value. The dialog box returns
    the value of the text field when the user presses the OK button. This example
    takes the user input to create an appropriate message:


    ```

    // request the user to select a menu item

    var dest = window.prompt("Please choose a destination... 1. France 2. Spain",
    "");


    // and display an appropriate message

    dest = (dest == "2") ? "Spain" : "France"

    window.alert("Welcome to " + dest);

    ```


