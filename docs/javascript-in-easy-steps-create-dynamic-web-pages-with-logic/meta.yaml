- img_proc: true
  md: "# While loops\n\nAnother kind of loop uses the JavaScript while keyword followed\
    \ by an expression to be evaluated for a boolean value.\n\nIf the evaluation returns\
    \ true then the code in the statement block will be executed. After the code has\
    \ executed the test expression will be evaluated again and the loop will continue\
    \ until the evaluation returns false.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_43_0.png)\n\
    \nThe statement block must feature code that will affect the test expression in\
    \ order to change the evaluation result to return false – otherwise an infinite\
    \ loop will be created.\n\nAn infinite loop will lock the script and crash the\
    \ browser.\n\nIt is important to note that if the test expression returns false\
    \ when it is first evaluated the code in the statement block is never executed.\n\
    \nThis example decrements a variable value on each iteration of the loop. The\
    \ counter increments until the evaluation returns false and it reaches 10 when\
    \ the loop ends.\n\n```\nvar i = 0; num = 50;\n// loop until the counter hits\
    \ 10\nwhile(i < 10 )\n{\n  num--;\n  i++;\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_43_1.png)\n\
    \nwhile.js\n\n// display the final counter and number values\nalert(\"Loop stopped\
    \ at \" + i + \"\\nnum is now \" + num);\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_43_2.png)"
  merge: -1
  pgno: 43
- img_proc: true
  md: "# The do-while loop\n\nThe JavaScript keyword is used to denote the start of\
    \ a do-while loop and is followed by a statement block containing the code to\
    \ be executed by the loop.\n\nThe statement code is followed by the JavaScript\
    \ while and an expression to be evaluated for a boolean value of true or false.\n\
    \nIf the evaluation returns true the loop restarts at the do keyword and will\
    \ continue until the evaluation returns false.\n\nIt is important to note that,\
    \ unlike with the simple while loop, the statement code will always be executed\
    \ at least once by the do-while loop because the test expression is not encountered\
    \ until the end of the loop.\n\nThe following example will never loop because\
    \ the counter value is incremented to 1 in the first execution of the statement\
    \ code so the first test evaluation will return false:\n\n```\nvar i = 0, num\
    \ = 50;\n\n// loop until the counter hits 1\ndo {\n\n num--;\n i++;\n} while (i\
    \ < 1);\n```\n\n// display the final counter and number values\nalert(\"Loop stopped\
    \ at \" + i + \"\\nnum is now \" + num);\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_44_0.png)\n\
    \n> Hot tip\n\nA while loop is often more suitable than a do-while loop.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_44_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_44_2.png)"
  merge: -1
  pgno: 44
- img_proc: true
  md: "# Break statement\n\nThe JavaScript break keyword is used to terminate the\
    \ execution of a loop prematurely.\n\nThe break keyword is situated inside the\
    \ statement block containing the code that the loop should execute and is preceded\
    \ by a conditional test.\n\nWhen the test condition is met the break statement\
    \ immediately terminates the loop and no further iterations are made.\n\nNotice\
    \ in the alert() output below that the counter value is still 3 because the increment\
    \ in the final iteration is not applied.\n\nIn the following example the conditional\
    \ test will return true when the counter value reaches 3:\n\n```\nvar i = 0;\n\
    // loop until the counter hits 6\nwhile(i < 6 )\n{\n  if( i == 3 ) break;\n  i++;\n\
    }\n\n// display the final counter value\nalert(\"BREAK\\n\\nLoop stopped at \"\
    \ + i);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_45_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_45_1.png)\n\
