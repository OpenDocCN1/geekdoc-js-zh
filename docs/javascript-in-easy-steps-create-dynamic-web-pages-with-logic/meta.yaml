  md: '# Opening new windows


    JavaScript can open a new browser window to display a specified document using
    the window.open() method. These so-called “pop-up” windows are invariably smaller
    than the original window and have many uses including the display of large images
    selected from a set of thumbnail-sized versions.


    The window.open() method takes three arguments, which specify the URL to load
    in a pop-up window, a name for that window, and its desired dimensions and features
    using these keywords:


    | Feature | Description |

    | --- | --- |

    | directories | adds the links bar |

    | height | sets height in pixels of the document area |

    | left | the screen X coordinate of the window |

    | location | adds the address bar |

    | menubar | adds the standard menu bar |

    | resizable | permits the window to be resized |

    | scrollbars | enables scrollbars when needed |

    | status | adds the status bar |

    | toolbar | adds the button bar with forward and back buttons |

    | top | the screen Y coordinate of the window |

    | width | sets the width in pixels of the document area |


    ![](img/9706759b347c5727cfdd3d09614f8c1f_113_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_113_1.png)


    Inclusion of any spaces in the features list will create an error.


    All the required features of the third argument must be stated as a single comma-separated
    list without any spaces.


    The window.open() method works by creating a window object that can be assigned
    to a variable. The window.close() method can be called to close that pop-up window
    and its window.print() method can be called to print out its contents.


    In the example opposite a global variable is initialized with a null value. The
    first function assigns it a window.object and opens a pop-up window containing
    the specified “pop.html” document. The second function closes the pop-up window
    and reassigns a null value to the global variable. This technique ensures that
    only one instance of the pop-up window can exist at any given time.


    112'
