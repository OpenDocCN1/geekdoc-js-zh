  - "[PAGE 117]\n\n# Addressing array components\n\nThe window.document object has\
    \ many properties and methods that JavaScript can address to manipulate the loaded\
    \ document. When the document is loaded, information about its component features\
    \ is stored in the anchors, forms, images and links array properties of the window.document\
    \ object. As all other arrays the length can be used to discover the size of any\
    \ component array and individual elements can be addressed using their index numbers.\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_117_0.png)\n\nThe following example\
    \ reveals the names and numbers of the HTML components from the window.document\
    \ object arrays:\n\n```\n<a name=\"top_of_page\" id=\"fragment\">\nSelect a search\
    \ engine...</a>\n<a href=\"http://www.google.com\" name=\"google_link\">\n<img\
    \ src=\"google.gif\" alt=\"google_graphic\">\n</a>\n<a href=\"http://www.yahoo.com\"\
    \ name=\"yahoo_link\">\n<img src=\"yahoo.gif\" id=\"engine-2\" alt=\"Yaho_graphic\"\
    >\n</a>\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_117_1.png)\n\n```\n<form\
    \ id=\"form-1\" action=\"\">\n<p><input type=\"button\" value=\"Click Me\" onclick=\"\
    show_parts()\" /></p>\n</form>\n```\n\n```\nfunction show_parts() {\n  var parts\
    \ = \"Anchors: \" + document.anchors.length;\n  parts+=\"\\nlist anchor name:\
    \ \" + document.anchors[0].name;\n  parts+=\"\\nForms: \" + document.forms.length;\n\
    \  parts+=\"\\nlist form id: \" + document.forms[0].id;\n  parts+=\"\\nImages:\
    \ \" + document.images.length;\n  parts+=\"\\nlist image id: \" + document.images[0].id;\n\
    \  parts+=\"\\n2nd image id: \" + document.images[1].id;\n  parts+=\"\\nLinks:\
    \ \" + document.links.length;\n  parts+=\"\\nlist link name: \" + document.links[0].name;\n\
    \  parts+=\"\\n2nd link name: \" + document.links[1].name;\n  alert(parts);\n\
    }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_117_2.png)"
