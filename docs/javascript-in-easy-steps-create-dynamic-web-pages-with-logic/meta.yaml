  - '[PAGE 29]


    # Assignment operators


    The operators that are commonly used in JavaScript to assign values are all listed
    in the table below. All except the simple = assignment operator are shorthand
    forms of longer expressions each equivalent is also given for clarity.


    | Operator | Example | Equivalent |

    | --- | --- | --- |

    | = | a = b | a = b |

    | += | a += b | a = (a + b) |

    | -= | a -= b | a = (a - b) |

    | *= | a *= b | a = (a *) |

    | /= | a /= b | a = (a / b) |

    | %= | a %= b | a = (a % b) |


    It is important to think of the = operator as “assign” rather than “equals” to
    avoid confusion with the == equality operator.


    In the example in the table the variable a is assigned the value that is contained
    in the variable b to become its new value.


    The += operator is most useful and has been used in earlier examples to add a
    second string to an existing string. In the table example the += operator adds
    the value contained in the variable a to the value contained in the variable b
    and then assigns the result to become the new value contained in variable a.


    All other operators work in the same way as by performing the arithmetical operation
    between the two values first, and then assigning the result to the first variable
    to become its new value.'
