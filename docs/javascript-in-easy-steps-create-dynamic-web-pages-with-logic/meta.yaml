  md: "# Submitting forms\n\nJavaScript can reset the components of a form to their\
    \ original state by calling the form's reset() method or send its contents to\
    \ the web server by calling its submit() method.\n\nIdeally, the values of form\
    \ elements can be validated before the form is submitted by specifying an event-handler\
    \ to the form's onsubmit attribute – to be called by the form's Submit event.\n\
    \nIn the following example JavaScript tests the format of an input string for\
    \ the presence of @ and dot characters and will only submit the form if the email\
    \ address validation appears correct:\n\n```\n// a function to validate basic\
    \ email address format\nfunction send_if_valid() {\n    // seek an @ and . character\
    \ in the address\n    if(document.forms.f.email.value.indexOf(\"@\") == -1\n \
    \   || document.forms.f.email.value.indexOf(\".\") == -1) {\n        // if absent\
    \ display a message\n        alert(\"Email address is absent or incorrect\");\n\
    \        return false; // ...and do not submit the form\n    }\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_153_0.png)\n\
    \nonSubmit.js\n\nThe onsubmit event-handler is not invoked by use of the form's\
    \ submit() method in JavaScript.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_153_1.png)"
  merge: -1
  pgno: 153
- img_proc: true
  md: "# Aborting image downloads\n\nInternet Explorer allows an event-handler to\
    \ be specified for the Abort event that occurs when the user cancels the download\
    \ of an image — usually by pushing the stop button on the browser's toolbar. The\
    \ onload event-handler may call a JavaScript function when an image download is\
    \ cancelled.\n\nTo identify an image name must be given to its id attribute in\
    \ the HTML <img> element, like this:\n\n```\n<img id=\"big pic\" src=\"bigpic.jpg\"\
    \nonabort=\"abort_msg()\" alt=\"\">\n```\n\nAn event-handler is assigned to that\
    \ image element's onabort attribute. In this example the event-handler creates\
    \ an alert() message confirming cancellation:\n\n```\n// a function to display\
    \ an abort confirmation message\n// for users of Internet Explorer\nfunction abort_msg()\
    \ {\n if (navigator.appName == \"Microsoft Internet Explorer\")\nalert(\"Image\
    \ Download Has Been Aborted\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_0.png)\n\
    \nBeware\nThe onabort attribute is supported by Internet Explorer but is not compliant\
    \ with recent W3C standards.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_1.png)\n\
    \nabort.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_2.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_3.png)\n\
    \nHot tip\nThis feature is useful to switch the image source to a low-resolution\
    \ version.\n\n153"
  merge: -1
