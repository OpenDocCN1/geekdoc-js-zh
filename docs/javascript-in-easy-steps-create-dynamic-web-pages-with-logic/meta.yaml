  md: '# Constructing objects


    The JavaScript syntax to address object properties and methods uses the object
    name followed by a period and then the property name. For instance, Array.length
    addresses the length property of an array object.


    Previous example code in this book has used intrinsic JavaScript objects with
    pre-defined methods.


    New custom objects can easily be created by the JavaScript new keyword with the
    Object() constructor.


    Properties may then be allocated to the new custom object by declaring a property
    name and assigning a value to it.


    The example below creates a new object called car and then gives it three properties
    with assigned values:


    ![](img/9706759b347c5727cfdd3d09614f8c1f_93_0.png)


    ```

    // create a new "car" object

    var car = new Object();


    // create and initialize a "maker" property...

    car.maker = "Dodge";n

    // create and initialize a "model" property...

    car.model = "Viper";n

    // create and initialize a "color" property...

    car.color = "Silver";

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_93_1.png)


    To declare a property, use both the object name and the given property name.


    ```

    // display all the car object properties...

    alert(car.color + " " + car.maker + " " + car.model);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_93_2.png)'
