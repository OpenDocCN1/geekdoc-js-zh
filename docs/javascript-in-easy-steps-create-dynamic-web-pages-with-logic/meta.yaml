  md: '# Summary


    +   - The href property of the window.location objects stores the full URL address
    of the current document, and individual parts can be found in protocol, host,
    pathname and hash properties


    +   - Assigning a full URL to window.location loads that document


    +   - The back() and forward() methods of the window.history object emulate the
    browser''s Back and Forward buttons


    +   - Assign a positive or negative numeric argument to the window.history.go()
    method to determine which step to reload


    +   - The window.screen object stores monitor information in its width, height,
    availWidth, availHeight, and colorDepth properties


    +   - The window.frames object is an array of all current frames


    +   - You can access the frameset of a frame with the parent keyword and each
    frame by its array index number, or by its given name


    +   - A message can be shown in the status bar with the window.status property
    or a default message specified by the window.defaultStatus property


    +   - The window.moveBy() and window.moveTo() adjust the position of the window
    within the screen


    +   - The window.scrollBy() and window.scrollTo() methods adjust the position
    of the focus within the browser window


    +   - You can get user input using the window.prompt() and window.confirm() methods


    +   - JavaScript can open and close pop-ups with the window.open() and window.close()
    methods


    +   - Properties and methods of the window object can be addressed without the
    window part of their name – so the window.alert() method can be addressed simply
    as alert()'
