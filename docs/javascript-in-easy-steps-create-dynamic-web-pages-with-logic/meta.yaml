    # Summary


    - “Dynamic HTML” (DHTML) describes JavaScript’s ability to alter web page component
    properties in response to user actions

    - The “Document Object Model” (DOM) defines the hierarchical relationship of web
    page components

    - A page component property can be addressed using the DOM hierarchy or by the
    `window.document.getElementById()` method

    - The `javascript:` protocol allows short snippets of JavaScript code to be included
    directly in an HTML document

    - Most web page components have a `style` object that has properties controlling
    their size, position and appearance

    - JavaScript can assign a new value to any property of web page component''s `style`
    object to create DHTML effects

    - The top, `left` and `zIndex` properties of web page component''s `style` property
    can be dynamically altered to its position

    - The colors of web page component can be dynamically altered by changing the
    `color` and `backgroundColor` properties of its `style` object

    - Content can be dynamically inserted into web page using its `innerHTML` property

    - A web page slide show can be created by using recursive calls to the `window.setTimeout()`
    method to change the source of an image

    - Animation effects can be created by making recursive calls to the `window.setTimeout()`
    method


    # Producing rich internet applications


    This chapter describes how JavaScript can be used together with other modern technologies
    to create interactive applications.


    - Introducing AJAX

    - Making an HTTP request

    - Using response text

    - Using XML data

    - Creating RIA

    - Programming the RIA

    - Executing the RIA


    # Introducing AJAX


    Recent innovation has enabled several web technologies to be used in harmony to
    create Rich Internet Applications (RIA), which have similar responsiveness to
    of desktop applications. These combined techniques are collectively referred to
    as "AJAX" (Asynchronous JavaScript XML), which incorporates:


    - Standards-based presentation – using HTML and CSS

    - Dynamic display and interaction – using the DOM

    - Data interchange and manipulation – using XML

    - Asynchronous data retrieval – using XMLHttpRequest

    - JavaScript functionality – to control the whole process


    It''s important to recognize that AJAX is not a technology itself but simply describes
    a technique. To fully appreciate its advantages first need to understand the relationship
    between the web browser and the server. Typically a user action in the browser
    will send an HTTP request to the server. The server will then process the request,
    calling upon server-side scripts and databases as required, and send a response
    of HTML and CSS back to the browser:


    ![](img/9706759b347c5727cfdd3d09614f8c1f_173_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_173_1.png)


    The time taken for the web server to process an HTTP request, and return its response
    to the browser, can be lengthy and doesn''t make for a great user experience.
    An AJAX application eradicates the need to wait for web server responses by introducing
    an intermediary – AJAX engine:


    ![](img/9706759b347c5727cfdd3d09614f8c1f_174_0.png)


    The AJAX engine, written in JavaScript, is loaded when the web page is first opened
    by the browser. Most importantly, the AJAX engine allows the user to interact
    with the application asynchronously – dynamically updating the interface without
    further communication to the server. Every user action that would normally generate
    an HTTP request to the server now takes the form of a JavaScript call to the AJAX
    engine instead. Responses that do not require contact with the server, such as
    data validation or editing data in memory, can be fulfilled internally by the
    AJAX engine. Other responses that do require contact with the server, such as
    submitting data for processing or retrieving new data, are made asynchronously
    without interrupting the user’s interaction with the application.


    > Hot tip

    > Google Maps is an AJAX application.


    # Making an HTTP request


    At the core of any AJAX engine is a special XMLHttpRequest object that provides
    methods to retrieve XML and text data from a web server. In Internet Explorer
    7, Safari and Mozilla browsers its full address is `window.XMLHttpRequest` and
    a new instance of the object can be created using the JavaScript keyword. In earlier
    versions of Internet Explorer an instance of the object can be created using `new
    ActiveX("Microsoft.XMLHTTP")`.


    The nature of request is defined by three arguments to the `open()` method of
    the XMLHttpRequest object to specify the retrieve method, a URL, and a boolean
    value to make the request asynchronously.


    The request can then be sent to the server using the XMLHttpRequest object''s
    `send()` method – supplying any text to be sent to the server as its argument,
    or using the `null` keyword.


    Finally the `onreadystatechange` property can specify an event-handler to call
    when the server''s response has been received. At this time the XMLHttpRequest
    object''s `readyState` property assigns the value 4 when the response is complete,
    and its `status` property gets assigned the code 200 if the response was OK.


    In the example an XMLHttpRequest object is created using the appropriate method
    for the browser view. It then sends a request to the server using the "GET" method
    to open a plain file named "data.txt" and retrieves its contents.


    The second function is nominated as the event-handler to respond to the XMLHttpRequest
    object''s `onreadystatechange` event. This is called when the response from the
    server is complete.


    In this example the event-handler assigns the values of the XMLHttpRequest object''s
    `readyState` and `status` properties to form input elements, displaying them on
    the web page.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_175_0.png)


    Although the object is called XMLHttpRequest, it can be used to handle both XML
    data and plain text.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_175_1.png)


    Be sure to capitalize this object name, its methods and its properties exactly
    as described here to avoid errors.

