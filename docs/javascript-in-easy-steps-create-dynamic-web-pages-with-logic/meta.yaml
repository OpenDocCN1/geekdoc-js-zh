    \n# 条件运算符\n\nJavaScript 开发者最喜欢的比较运算符可能是 `?:` 条件运算符。它首先评估一个表达式以得到真或假值，然后根据评估结果执行两个给定语句中的一个。\n\
    \n条件运算符的语法如下：\n\n```\n( expression ) ? if-true-do- : if-false-do-do :\n```\n\n\
    该运算符通常用于在执行浏览器识别程序后，运行针对特定网络浏览器的脚本函数。下面的示例是根据浏览器类型显示欢迎消息：\n\n```javascript\n//\
    \ 浏览器是 Internet Explorer 吗？\nvar is_ie = browser_id();\n```\n\n```javascript\n\
    // 显示适当问候\n( is_ie ) ? greet_ie() : greet_other();\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_33_0.png)\n\
