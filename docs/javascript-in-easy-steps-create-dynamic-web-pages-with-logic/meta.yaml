  - '[PAGE 105]


    # Getting monitor settings


    It is sometimes useful to have JavaScript get the user''s screen resolution from
    the width and height properties of the window.screen object. You can also determine
    the available screen size, without the taskbar, using availWidth and availHeight
    properties.


    The current color setting can also be retrieved as the bits-per-pixel value stored
    in the window.screen.colorDepth property.


    In the example below, screen dimensions are retrieved from the appropriate window.screen
    property:


    ```

    // get screen size

    var w = window.screen.width;

    var h = window.screen.height;


    // get available screen size

    var aw = window.screen.availWidth;

    var ah = window.screen.availHeight;


    // get color settings

    var depth = window.screen.colorDepth;


    // display the settings information

    var res = "Resolution: " +w + " x " +h;

    var col = "Colors: " + depth + " bit";

    var avl = "Available screen : " +aw + " x " +ah;\n

    alert(res + "\n" + col + "\n" + avl);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_105_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_105_1.png)'
  - '[PAGE 106]


    # Recognizing frames


    The window.frames object contains an array of all the frames in a window that
    has been defined in the HTML <frameset> tags.


    JavaScript can address these from within any frame using the parent.window.frames[]
    array syntax.


    Individual frames can be addressed using their index number in the array, or by
    the value assigned to the name attribute in the HTML frame tag. So a frame named
    “main” can be addressed from within another frame as parent.window.frames["main"],
    or more simply as parent.window.frames.main.


    The script below is included in an HTML frame document. It finds the total number
    of frames in that frameset and reads each of their names from the parent frame-holder
    document:


    ```

    // find the total number of frames

    var framenums = "No. frames : " + parent.window.frames.length;


    // retrieve the name of each frame

    var framenames = "\nframe 1 : " + parent.window.frames[0].name;

    framenames += "\nframe 2 : " + parent.window.frames[1].name;

    framenames += "\nframe 3 : " + parent.window.frames[2].name;


    alert(framenums + framenames);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_106_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_106_1.png)


    > Hot tip Always name HTML elements to be used by JavaScript, so as to produce
    code that is more comprehensible.'
  - "[PAGE 107]\n\n# Addressing frames\n\nThe example on the previous page allows\
    \ access to different frames within a framed window, and because the browser's\
    \ object model is hierarchical the objects and properties within any frame are\
    \ also accessible.\n\nThis means that JavaScript can assign values to these object\
    \ properties and use their methods just as with an unframed window.\n\nTypically\
    \ a navigation frame on the left side of the window will have navigation buttons,\
    \ when pushed, assign new URL locations to a main frame on the right side of the\
    \ screen.\n\nThis example includes an HTML form button in the navigation \"Menu\"\
    \ frame. When the button is pushed the HTML onclick attribute of the button calls\
    \ the next() function to change the locations of both the other frames, \"Page\"\
    \ and \"Banner\":\n\n```\n// function to load new documents into frames 2 and\
    \ 3\nfunction next() {\n  parent.frames.Page.window.location = \"nextpage.html\"\
    ;\n  parent.frames.Banner.window.location = \"nextbanner.html\";\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_107_0.png)\n\
    \nAlthough a single click of this button appears to change the contents of both\
    \ frames simultaneously it is worth noting that the browser is actually implementing\
    \ two separate actions. Clicking the browser's Back button illustrates this as\
    \ it unloads only one frame with the first click and the other frame with the\
    \ second click."
- md: "\n...cont’d\n\n# Advising status messages\n\nThe window.status property can\
    \ display a message in the browser's status bar until another document feature\
    \ sets a different message, or the status is returned to its default state. A\
    \ default message to display can be specified with the window.defaultStatus property.\n\
    \nTo display a message when the user places the cursor over a hyperlink the HTML\
    \ onmouseover attribute should specify the message to display. It must also return\
    \ true to prevent the link URL appearing in the status bar as it would normally.\n\
    \nThis example, using JavaScript within HTML tags, specifies a default message\
    \ and adds an onmouseover attribute to the link. This displays another message\
    \ while the cursor rests over the link:\n\n```html\n<body onload = \"window.defaultStatus\
    \ = 'Status Demo';\">\n<p><a href=\"nextpage.html\" onmouseover=\"window.status='Click\
    \ Here';return true\">Hypertext Link</a></p>\n```\n\nSome versions of the Firefox\
    \ browser disable status bar messages by default - to enable them, enter about:config\
    \ in the address field and then, from the list that appears, dom.disable_window.status_change\
    \ to false.\n\n# Scrolling and moving\n\nScrolling within a document can be adjusted\
    \ with the JavaScript window.scrollBy() and window.scrollTo() methods. Each needs\
    \ two numeric arguments stating how many pixels to shift along the X and Y axes.\
    \ Similarly the window position can be adjusted on the screen with the window.moveTo()\
    \ and window.move() methods, which also require two arguments for X and Y coordinates.\
    \ The example below calls the window.scrollBy() method to shift 100 pixels along\
    \ the X axis when the user pushes a button:\n\n```html\n<input type=\"button\"\
    \ value=\"Scroll\" onclick=\"window.scrollBy(100,0)\">\n```\n\n# Seeking confirmation\n\
    \nThe alert() function is used extensively throughout this book is actually a\
    \ window object method, so may be correctly addressed as window.alert().\n\nAs\
    \ the window object is the top-level object in the Document Object Model its properties\
    \ and methods can optionally leave off \"window.\" from the address - so \"window.alert()\"\
    \ is recognized by just \"alert\".\n\nThe window.confirm() method is the first\
    \ of two other window methods that produce dialog boxes when It is used to get\
    \ user confirmation from a dialog box containing an OK button that returns true\
    \ to the script and a Cancel button returns false to the script. A single argument\
    \ should be passed to the method as a text string containing the question to ask\
    \ the user.\n\nThis example demonstrates the window.confirm() method performing\
    \ conditional branching to determine which message to display - depending upon\
    \ which button the user pushes:\n\n```javascript\n// create a variable to store\
    \ a dialog response\nvar ask = window.confirm(\"Do you wish to proceed ?\");\n\
    \n// display an appropriate reply message\n( ask ) ? window.alert(\"OK button\
    \ was pushed\") : \nwindow.alert(\"Cancel button was pushed\");\n```\n\n# Prompting\
    \ for input\n\nThe other window object method that produces a dialog box when\
    \ called is the window.prompt() method that was introduced in previous examples\
    \ as its shortened prompt() form. This method gets keyboard input from the user\
    \ through a dialog box containing a text field with OK and Cancel buttons. It\
    \ requires two arguments, to specify a message to display and a default text value.\
    \ The dialog box returns the value of the text field when the user presses the\
    \ OK button. This example takes the user input to create an appropriate message:\n\
    \n```javascript\n// request the user to select a menu\nvar dest = window.prompt(\"\
    Please choose a destination... 1. France 2. Spain\", \"\");\n\n// and display\
    \ an appropriate message\ndest = (dest == \"2\") ? \"Spain\" : \"France\"\nwindow.alert(\"\
    Welcome to \" + dest);\n```\n\n# Opening new windows\n\nJavaScript can open a\
    \ new browser window to display a specified document using the window.open() method.\
    \ These so-called “pop-up” windows are invariably smaller than the original window\
    \ and have many uses including the display of images from a set of thumbnail-sized\
    \ versions. The window.open() method takes three arguments, which specify the\
    \ URL to load in pop-up window, a name for that window, and its desired dimensions\
    \ using these keywords:\n\n| Feature | Description |\n| :--- | :--- |\n| directories\
    \ | adds the links |\n| height | sets height in pixels of the document area |\n\
    | left | the screen X coordinate of the window |\n| location | adds the address\
    \ bar |\n| menubar | adds the standard menu bar |\n| resizable | permits the window\
    \ to be resized |\n| scrollbars | enables scrollbars when needed |\n| status |\
    \ adds the status bar |\n| toolbar | adds the button bar with forward and back\
    \ buttons |\n| top | the screen Y coordinate of the window |\n| width | sets the\
    \ width in pixels of the document area |\n\nInclusion of any spaces in the features\
    \ list will create an error. All the required features of the third argument must\
    \ be stated as a single comma-separated list without spaces.\n\nThe window.open()\
    \ method works by creating a window object that can be assigned to a variable.\
    \ The window.close() method can be called to close that pop-up window and its\
    \ window.print() method can be called to print out its contents. In the example\
    \ a global variable is initialized with a null value. The first function assigns\
    \ it a window.object and opens a pop-up window containing the specified “pop.html”\
    \ document. The second function closes the pop-up window and reassigns a null\
    \ value to the global variable. This technique ensures that only one instance\
    \ of the pop-up window can exist at any given time.\n\n// empty variable to store\
    \ a window object\nvar popwin = null;\n\n// a function to open a pop-up window\n\
    function open_popwin() {\n```javascript\nif(popwin == null) // check it does NOT\
    \ yet exist\n// then create a window object and open the popup\npopwin = window.open(\"\
    popup.html\", \"\",\n  \"top=100,left=80,width=250,height=100,status\");\n}\n\n\
    // function to close a pop-up window\nfunction close_popwin() {\n```javascript\n\
    if(popwin != null) // check it does already exist\n// then close the popup and\
    \ delete the window object\npopwin.close(); popwin = null;\n}\n```\n\n# Don't\
    \ forget\n\nThe second argument to the window.open() method must be an empty string\
    \ if no name is being given to the pop-up window - as seen here.\n\n# Summary\n\
    \n- The href property of the window.location objects stores the full URL address\
    \ of the current document, and individual parts can be found in protocol, host,\
    \ pathname and hash properties.\n- Assigning a full URL to window.location loads\
    \ that document.\n- The back() and forward() methods of the window.history object\
    \ emulate the browser's Back and Forward buttons.\n- A positive or negative numeric\
    \ argument to the window.history.go() method to determine which step to reload.\n\
    - The window.screen object stores monitor information in its width, height, availWidth,\
    \ availHeight, and colorDepth properties.\n- The window.frames object is an array\
    \ of all current frames.\n- You can access the frameset of a frame with the parent\
    \ keyword and each frame by its array index number, or by its given name.\n- A\
    \ message can be shown in the status bar with the window.status property or a\
    \ default message specified by the window.defaultStatus property.\n- The window.moveBy()\
    \ and window.moveTo() adjust the position of the window within the screen.\n-\
    \ The window.scrollBy() and window.scrollTo() methods adjust the position of the\
    \ focus within the browser window.\n- You can get user input using the window.prompt()\
    \ and window.confirm() methods.\n- JavaScript can open and close pop-ups with\
    \ the window.open() and window.close() methods.\n- Properties and methods of the\
    \ window object can be addressed without the window part of their name – so the\
    \ window.alert() method can be addressed simply as alert()\n"
  mdcn: "\n\n...（上上）\n\n# 提示状态消息\n\n`window.status` 属性可以在浏览器的状态栏中显示消息，直到另一个文档特性设置了不同的消息，或者状态恢复到默认状态。可以使用\
    \ `window.defaultStatus` 属性指定要显示的默认消息。\n\n若要在用户将光标悬停在超链接上时显示消息，应该用 HTML 的 `onmouseover`\
    \ 属性指定要显示的消息。它还必须返回 `true`，以防止链接 URL 像通常那样出现在状态栏中。\n\n此示例在 HTML 标签内使用 JavaScript，指定了一个默认消息并为链接添加了\
    \ `onmouseover` 属性。这会在光标悬停在链接上时显示另一条消息：\n\n\n\n```html\n<body onload = \"window.defaultStatus\
    \ = 'Status Demo';\">\n<p><a href=\"nextpage.html\" onmouseover=\"window.status='Click\
    \ Here';return true\">超文本链接</a></p>\n```\n\n某些版本的 Firefox 浏览器默认禁用了状态栏消息——要启用它们，请在地址栏中输入\
    \ `about:config`，然后从出现的列表中将 `dom.disable_window.status_change` 设置为 `false`。\n\n\
    # 滚动与移动\n\n可以使用 JavaScript 的 `window.scrollBy()` 和 `window.scrollTo()` 方法调整文档内的滚动。每个方法都需要两个数值参数，说明沿\
    \ X 轴和 Y 轴移动多少像素。同样地，可以使用 `window.moveTo()` 和 `window.move()` 方法调整屏幕上的窗口位置，这些方法也需要两个\
    \ X 和 Y 坐标的参数。下面的示例调用了 `window.scrollBy()` 方法，在用户按下按钮时沿 X 轴移动 100 像素：\n\n```html\n\
    <input type=\"button\" value=\"Scroll\" onclick=\"window.scrollBy(100,0)\">\n\
    ```\n\n# 寻求确认\n\n`alert()` 函数在本书中被广泛使用，它实际上是一个 `window` 对象的方法，因此可以正确地写为 `window.alert()`。\n\
    \n由于 `window` 对象是文档对象模型（DOM）中的顶层对象，它的属性和方法可以选择省略地址中的 \"window.\"——所以 \"window.alert()\"\
    \ 可以被识别为仅 \"alert\"。\n\n`window.confirm()` 方法是另外两个产生对话框的窗口方法中的第一个。当它用于从包含 OK 按钮的对话框中获取用户确认时，OK\
    \ 按钮向脚本返回 `true`，Cancel 按钮向脚本返回 `false`。应向该方法传递一个文本字符串参数，包含要询问用户的的问题。\n\n此示例演示了\
    \ `window.confirm()` 方法执行条件分支以确定显示哪条消息——取决于用户点击了哪个按钮：\n\n```javascript\n// 创建一个变量来存储对话响应\n\
    var ask = window.confirm(\"你确定要继续吗？\");\n\n// 显示相应的回复消息\n( ask ) ? window.alert(\"\
    点击了 OK 按钮\") : \nwindow.alert(\"点击了取消 按钮\");\n```\n\n# 提示输入\n\n另一个在调用时会产生对话框的窗口对象方法是\
    \ `window.prompt()` 方法，它在之前的示例中以简写形式 `prompt()` 引入过。该方法通过包含文本字段以及 OK 和取消按钮的对话框，从用户处获取键盘输入。它需要两个参数，用于指定要显示的消息和默认文本值。当用户按下\
    \ OK 按钮时，对话框返回文本字段的值。此示例获取用户输入以创建一个合适的消息：\n\n```javascript\n// 请求用户选择菜单\nvar dest\
    \ = window.prompt(\"请选择一个目的地... 1. 法国 2. 西班牙\", \"\");\n\n// 显示相应的消息\ndest = (dest\
    \ == \"2\") ? \"西班牙\" : \"法国\"\nwindow.alert(\"欢迎来到 \" + dest);\n```\n\n# 打开新窗口\n\
    \nJavaScript 可以 `window.open()` 方法打开新的浏览器窗口来显示指定的文档。这些所谓的“弹出”窗口总是比原始窗口小，并且有许多用途，包括显示一组缩略图尺寸的图像。`window.open()`\
    \ 方法接受三个参数，分别指定在弹出窗口中加载的 URL、该窗口的名称以及使用以下关键字指定的所需的尺寸：\n\n| 特性 | 描述 |\n| :--- |\
    \ :--- |\n| directories | 添加目录（链接） |\n| height | 设置文档区域的高度（像素） |\n| left | 窗口在屏幕上的\
    \ X 坐标 |\n| location | 添加地址栏 |\n| menubar | 添加标准菜单栏 |\n| resizable | 允许调整窗口大小\
    \ |\n| scrollbars | 需要时启用滚动条 |\n| status | 添加状态栏 |\n| toolbar | 添加带有前进和后退按钮的工具栏\
    \ |\n| top | 窗口在屏幕上的 Y 坐标 |\n| width | 设置文档区域的宽度（像素） |\n\n在特性列表中包含任何空格都会导致错误。第三参数中的所有必要特性必须作为一个由逗号分隔的列表列出，且不能有空格。\n\
    \n`window.open()` 方法的工作原理是创建一个可以赋值给变量的窗口对象。可以调用 `window.close()` 方法关闭该弹出窗口，并调用\
    \ `window.print()` 方法打印其内容。在示例中，全局变量被初始化为 `null` 值。第一个函数为其分配了一个 `window` 对象并打开一个包含指定“pop.html”文档的弹出窗口。第二个函数关闭弹出窗口并为全局变量重新赋值为\
    \ `null`。这种技术确保了在任何时刻只能存在一个弹出窗口实例。\n\n```javascript\n// 用于存储窗口对象的空变量\nvar popwin\
    \ = null;\n\n// 打开弹出窗口的函数\nfunction open_popwin() {\n```javascript\nif(popwin\
    \ == null) // 检查它是否不存在\n// 然后创建一个窗口对象并打开弹出窗口\npopwin = window.open(\"popup.html\"\
    , \"\",\n  \"top=100,left=80,width=250,height=100,status\");\n}\n\n// 关闭弹出窗口的函数\n\
    function close_popwin() {\n```javascript\nif(popwin != null) // 检查它是否已存在\n// 然后关闭弹出并删除窗口对象\n\
    popwin.close(); popwin = null;\n}\n```\n\n# 不要忘记\n\n如果未为弹出窗口指定名称，`window.open()`\
    \ 方法的第二个参数必须为空字符串——如此处所示。\n\n# 总结\n\n- `window.location` 对象的 `href` 属性存储当前文档的完整\
    \ URL 地址，可以通过 `protocol`、`host`、`pathname` 和 `hash` 属性找到。\n- 为 `location` 赋值完整\
    \ URL 会加载该文档。\n- `window.history` 对象的 `back()` 和 `forward()` 方法模拟浏览器的后按钮。\n- 向\
    \ `window.history.go()` 方法传递正或负数值参数以确定加载的步数。\n- `window.screen` 对象通过其 `width`、`height`、`availWidth`、`availHeight`\
    \ 和 `colorDepth` 属性存储显示器信息。\n- `window.frames` 对象是所有帧的数组。\n- 可以使用 `parent` 关键字访问帧集，并通过数组索引数字或给定的名称访问每个帧。\n\
    - 可以 `window.status` 属性在状态栏中显示消息，或通过 `window.defaultStatus` 属性指定默认消息。\n- `window.moveBy()`\
    \ 和 `window.moveTo()` 窗口在屏幕上的位置。\n- `window.scrollBy()` 和 `window.scrollTo()`\
    \ 方法调整浏览器窗口内的焦点位置。\n- 可以 `window.prompt()` 和 `window.confirm()` 方法获取用户输入。\n- JavaScript\
    \ 使用 `window.open()` 和 `window.close()` 方法打开和关闭弹出窗口。\n\n"
