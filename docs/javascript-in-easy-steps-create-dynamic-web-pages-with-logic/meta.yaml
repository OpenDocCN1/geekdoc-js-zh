  md: '# Math constants


    The intrinsic JavaScript object contains a number of standard mathematical constant
    values for easy reference.


    Upper case is always used to refer to the constant values, which are all listed
    in the following table:


    | Math.E | The constant e, base of the natural logarithm, with a value of approximately
    2.71828 |

    | Math.LN2 | The natural logarithm of 2, approximately 0.6931471805994528623 |

    | Math.LN10 | The natural logarithm of 10, approximately 2.302585092994049011
    |

    | Math.LOG2E | The base-2 logarithm of e, approximately 1.442695040888963387 |

    | Math.LOG10E | The base-10 logarithm of e, approximately 0.4342944819032518677
    |

    | Math.PI | The constant pi, approximately 3.14159265358979 |

    | Math.SQRT1_2 | The reciprocal of the square root of 2, approximately 0.707106781186547
    |

    | Math.SQRT2 | The square root of 2, approximately 1.414213562373095 |


    The Math constants can be used anywhere within a script.


    Most of the Math constants are used only in JavaScript applications that have
    a particular mathematical purpose but the list is given above for completeness.


    The Math.PI constant is used in the example opposite to calculate the circumference
    and area of a circle from a given radius.'
