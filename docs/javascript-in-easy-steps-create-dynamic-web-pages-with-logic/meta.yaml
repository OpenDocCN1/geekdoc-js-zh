  md: '# Extracting document info


    The window.document object has several properties that store information about
    the currently loaded document. Its domain property contains the domain part of
    the URL address and the complete address is stored in the window.document.URL
    property.


    When a web page is loaded in the browser as a result of following a hyperlink
    the window.document.referrer property contains the URL of the page supplying the
    link. The current document''s title, as defined in the HTML <title> element, is
    stored in the window.document.title property.


    In the simple HTML document listed below a script is called to write the list
    items dynamically in an unordered list detailing the properties of that document,
    after it has been loaded by a hyperlink:


    ```

    <html>

    <head>

    <title>Document Properties</title>

    </head>

    <body>

    <ul>

    <script type="text/javascript" src="props.js"></script>

    </ul>

    </body>

    </html>

    ```


    ```

    // write properties...


    window.document.write(

    ("liDomain: " + window.document.domain);


    window.document.write(

    ("liReferrer: " + window.document.referrer);


    window.document.write(

    ("liTitle: " + window.document.title);


    window.document.write(

    ("liURL: " + window.document.URL););

    ```


