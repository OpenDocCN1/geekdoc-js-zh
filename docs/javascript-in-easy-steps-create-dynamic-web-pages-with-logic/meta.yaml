    \ the id \"f\".\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_151_1.png)"
- md: "\n# ...cont'd\n\nThe Reset event occurs when the user pushes a form's HTML\
    \ reset button and a JavaScript window.onerror property can specify an event-handler\
    \ to call when the Reset event occurs.\n\nIn this example the Reset event-handler\
    \ simply opens an alert dialog advising the user that the form has reset:\n\n\
    ```javascript\n// specify a LOAD event-handler\nwindow.onload = init;\n// specify\
    \ a RESET event-handler\nfunction init()\n{\n  window.document.forms.f.onreset\
    \ = advise;\n}\n```\n\n```javascript\n// a function to react to the RESET event\n\
    function advise()\n{\n  alert(\"Form has been reset\\nPlease select a color\"\
    );\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_152_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_152_1.png)\n\
    \n> Don't forget\n> The checked radio button only gets cleared after the user\
    \ pushes the OK button in the alert dialog.\n\n# Submitting forms\n\nJavaScript\
    \ can reset the components of a form to their original state by calling the form's\
    \ reset() method or send its contents to the web server by calling its submit()\
    \ method.\n\nIdeally, the values of form elements can be validated before the\
    \ form is submitted by specifying an event-handler to the form's onsubmit attribute\
    \ – to be called by the form's Submit event.\n\nIn the following example JavaScript\
    \ tests the format of an input string for the presence of @ and dot characters\
    \ and will only submit the form if the email address validation appears correct:\n\
    \n```javascript\n// a function to validate basic email address format\nfunction\
    \ send_if_valid() {\n    // seek an @ and . character in the address\n    if(document.forms.f.email.value.indexOf(\"\
    @\") == -1\n    || document.forms.f.email.value.indexOf(\".\") == -1) {\n    \
    \    // if absent display a message\n        alert(\"Email address is absent or\
    \ incorrect\");\n        return false; // ...and do not submit the form\n    }\n\
    }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_153_0.png)\n\nonSubmit.js\n\
    \nThe onsubmit event-handler is not invoked by use of the form's submit() method\
    \ in JavaScript.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_153_1.png)\n\n# Aborting\
    \ image downloads\n\nInternet Explorer allows an event-handler to be specified\
    \ for the Abort event that occurs when the user cancels the download of an image\
    \ — usually by pushing the stop button on the browser's toolbar. The onload event-handler\
    \ may call a JavaScript function when an image download is cancelled.\n\nTo identify\
    \ an image name must be given to its id attribute in the HTML \\img> element,\
    \ like this:\n\n```html\n<img id=\"big pic\" src=\"bigpic.jpg\" onabort=\"abort_msg()\"\
    \ alt=\"\">\n```\n\nAn event-handler is assigned to that image element's onabort\
    \ attribute. In this example the event-handler creates an alert() message confirming\
    \ cancellation:\n\n```javascript\n// a function to display an abort confirmation\
    \ message\n// for users of Internet Explorer\nfunction abort_msg() {\n if (navigator.appName\
    \ == \"Microsoft Internet Explorer\")\nalert(\"Image Download Has Been Aborted\"\
    );\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_0.png)\n\nBeware\n\
    > The onabort attribute is supported by Internet Explorer but is not compliant\
    \ with recent W3C standards.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_1.png)\n\
    \nabort.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_2.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_3.png)\n\
    \nHot tip\n> This feature is useful to switch the image source to a low-resolution\
    \ version.\n\n# Summary\n\n- The window.document.forms object contains an array\
    \ of all the forms on the web page in the order they appear. Each form may be\
    \ addressed using its forms array index number, as window.document.forms[0], or\
    \ by using the value assigned to its HTML id attribute, as \"f\" in window.document.forms.f\n\
    - The window.document.forms.elements object contains an array of all the elements\
    \ in a form in the order in which they appear. Each element within a form may\
    \ be addressed using its elements array index number, e.g. the first element by\
    \ window.document.forms.elements[0], or by using its id, e.g. \"btn1\" with window.document.forms.f.btn1\n\
    - JavaScript can assign a string to a form component using its value property\n\
    - A loop can examine the checked property of radio buttons or checkboxes to discover\
    \ those that the user has checked\n- The options property of an HTML <select>\
    \ element contains an array of its nested <option> elements. Each element of the\
    \ array has a text property, storing a string label, and a value property storing\
    \ its associated value\n- The selectedIndex property of an options array stores\
    \ the options index number of the currently selected option\n- When a form's value\
    \ is changed the Change event occurs and its onchange event-handler is called.\
    \ The Reset event occurs when the user pushes a form reset button and the onreset\
    \ event-handler is called\n- JavaScript can reset a form using its reset() method\
    \ and submit it to the server using its submit() method\n- In Internet Explorer\
    \ the Abort event occurs when the user pushes the browser stop, and the onabort()\
    \ event-handler is then called\n\n# 13 Creating dynamic effects\n\nThis chapter\
    \ demonstrates how the Document Object Model (DOM) allows JavaScript to address\
    \ any element within an HTML document.\n\n- 156 Introducing the DOM\n- 158 Using\
    \ the javascript: protocol\n- 160 Manipulating style attributes\n- 162 Toggling\
    \ visibility\n- 164 Inserting content\n- 166 Producing a slide\n- 168 Tacking\n\
    - 170 Summary\n\n# Introducing the DOM\n\nThe chart below illustrates the important\
    \ parts of the Document Object Model (DOM) and how page components are related:\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_157_0.png)\n\nThe items shown are all\
    \ different types of elements. ...'d\n\nUnderstanding the hierarchical DOM makes\
    \ it easy to address properties in JavaScript \"f\".\n\n> Don't forget\n> The\
    \ first and final statements are line-wrapped here because of space.\n\n```javascript\n\
    function modify() { // 3 ways to address\nwindow.document.forms[0].elements[1].selected\
    \ = true;\nwindow.document.forms.f.checked = true;\nwindow.document.getElementById(\"\
    txt\").value = \"Modified\";\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_158_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_158_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_158_2.png)\n\
    \n# Using the javascript: protocol\n\nThe HTML \"href\" attribute in a hyperlink\
    \ usually contains a URL to load when the user clicks that link, but can be made\
    \ to execute JavaScript code instead by using the javascript: protocol.\n\nThe\
    \ javascript: protocol allows short snippets of JavaScript code, of up to 512\
    \ bytes, to be included directly in the <a> element in an HTML document and can\
    \ be useful to create dynamic effects.\n\nThe string containing the JavaScript\
    \ code should be enclosed within double quotes, so strings within the code should\
    \ be enclosed within single quotes to avoid confusing the browser.\n\nIn the example\
    \ below the javascript: protocol is used to create an alert dialog – single quotes\
    \ surround a text string that is concatenated with an object property:\n\n```html\n\
    <p>\n<a href=\"javascript:alert('You are browsing with\\n' + navigator.appName)\"\
    >Show browser name</a>\n</p>\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_159_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_159_1.png)\n\nUsing the javascript:\
    \ protocol is frowned upon by many but is included here for completeness.\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_159_2.png)\n"
  mdcn: "\n\n# ...续\n\n当用户点击表单的 HTML 重置按钮时，会发生 Reset 事件，JavaScript `window.onerror`\
    \ 属性可以指定一个在 Reset 事件发生时调用的事件处理器。\n\n在本例示例中，Reset 事件处理器简单地打开一个警告对话框，告知用户表单已重置：\n\
    \n```javascript\n// 指定一个 LOAD 事件处理器\nwindow.onload = init;\n// 指定一个 RESET 事件处理器\n\
    function init()\n{\n  window.document.forms.f.onreset = advise;\n}\n```\n\n```javascript\n\
    // 一个用于响应 RESET 事件的函数\nfunction advise()\n{\n  alert(\"Form has been reset\\nPlease\
    \ select a color\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_152_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_152_1.png)\n\n> 注意\n> 只有在用户点击警告对话框中的\
    \ OK 按钮后，选中的单选按钮会被清除。\n\n# 提交表单\n\nJavaScript 可以通过调用表单的 `reset()` 方法将表单组件恢复到原始状态，或者通过调用\
    \ `submit()` 方法将其内容发送到 Web 服务器。\n\n理想情况下，可以在提交表单之前，通过为表单的 `onSubmit` 属性指定事件处理器来验证表单的值——该处理器由表单的\
    \ Submit 事件调用。\n\n在以下示例中，JavaScript 测试输入字符串格式是否包含 @ 和点 字符，并且只有当电子邮件地址验证看起来正确时才会提交表单：\n\
    \n```javascript\n// 一个验证基本电子邮件地址格式的函数\nfunction send_if_valid() {\n    // 在地址中寻找\
    \ @ 和 . 字符\n    if(document.forms.f.email.value.indexOf(\"@\") == -1\n    || document.forms.f.email.value.indexOf(\"\
    .\") == -1) {\n        // 如果不存在则显示消息\n        alert(\"Email address is absent\
    \ or incorrect\");\n        return false; // ...并且不提交表单\n    }\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_153_0.png)\n\
    \nonSubmit.js\n\n使用 JavaScript 的表单 `submit()` 方法不会触发 `onSubmit` 事件处理器。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_153_1.png)\n\
    \n# 中止图像下载\n\nInternet Explorer 允许为 Abort 事件指定事件处理器，该事件在用户取消图像下载时发生——通常是通过点击浏览器工具栏上的停止按钮。当图像下载被取消时，`onload`\
    \ 事件处理器可以调用 JavaScript 函数。\n\n为了识别图像名称，必须在 HTML `<img>` 元素的 `id` 属性中赋予名称，如下：\n\
    \n```html\n<img id=\"big pic\" src=\"bigpic.jpg\" onabort=\"abort_msg()\" alt=\"\
    \">\n```\n\n将事件处理器分配给该图像元素的 `onabort` 属性。在本例中，事件处理器创建了一个 `alert()` 消息来确认取消：\n\n\
    ```javascript\n// 一个为 Internet Explorer 用户显示取消确认消息的函数\nfunction abort_msg() {\n\
    \ if (navigator.appName == \"Microsoft Internet Explorer\")\nalert(\"Image Download\
    \ Has Been Aborted\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_0.png)\n\
    \n注意\n> `onabort` 属性被 Internet Explorer 支持，但不符合最近的 W3C 标准。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_1.png)\n\
    \nabort.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_2.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_154_3.png)\n\
    \n小贴士\n> 此功能用于将图像源切换到低分辨率版本。\n\n# 总结\n\n- `window.document.forms` 对象包含网页上所有表单的数组，按它们出现的顺序排列。每个表单可以通过其\
    \ `forms` 数组索引访问，例如 `window.document.forms[0]`，或者通过使用分配给其 HTML `id` 属性的值访问，例如\
    \ `window.document.forms.f`。\n- `window.document.forms.elements` 对象包含表单中所有元素的数组，按它们出现的顺序排列。表单中的每个元素都可以通过其\
    \ `elements` 数组索引访问，例如，第一个元素通过 `window.document.forms.elements[0]`，或者通过其 `id`\
    \ 访问，例如 `window.document.forms.f.btn1`。\n- JavaScript 可以使用表单组件的 `value` 属性为其赋值一个字符串。\n\
    - 循环可以检查单选按钮或复选框的 `checked` 属性，以发现用户选中的项。\n- HTML `<select>` 元素的 `options` 属性包含其嵌套\
    \ `<option>` 元素的数组。数组中的每个元素都有一个 `text` 属性（存储字符串标签）和一个 `value` 属性（存储其关联的值）。\n-\
    \ `options` 数组的 `selectedIndex` 属性存储当前选中选项的索引号。\n- 当表单的值发生变化时，会发生 Change 事件并调用其\
    \ `onchange` 事件处理器。当用户点击表单重置按钮时，会发生 Reset 事件并调用 `onreset` 事件处理器。\n- JavaScript\
    \ 可以使用 `reset()` 方法重置表单并使用 `submit()` 方法将其提交到服务器。\n- 在 Internet Explorer 中，当用户点击浏览器停止时，会发生\
    \ Abort 事件，然后调用 `onabort()` 事件处理器。\n\n# 13 创建动态效果\n\n本章演示了文档对象模型 (DOM) 如何允许 JavaScript\
    \ 访问 HTML 文档中的任何元素。\n\n- 156 介绍 DOM\n- 158 使用 javascript: 协议\n- 160 操作样式属性\n-\
    \ 162 切换可见性\n- 164 插入内容\n- 166 制作滑动效果\n- 168 跟踪\n- 170 总结\n\n# 介绍 DOM\n\n下表说明了文档对象模型\
    \ (DOM) 的重要部分以及页面组件之间的关系：\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_157_0.png)\n\
    \n所示项目都是不同类型的元素。\n\n理解层级 DOM 使得在 JavaScript 中访问属性“f”变得简单。\n\n> 注意\n> 因为空格的原因，第一条语句在这里被换行了。\n\
    \n```javascript\nfunction modify() { // 3 种方式\nwindow.document.forms[0].elements[1].selected\
    \ = true;\nwindow.document.forms.f.checked = true;\nwindow.document.getElementById(\"\
    txt\").value = \"Modified\";\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_158_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_158_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_158_2.png)\n\
    \n# 使用 javascript: 协议\n\n超链接中的 HTML `href` 属性通常包含用户点击链接时加载的 URL，但通过使用 `javascript:`\
    \ 协议可以改为执行 JavaScript 代码。\n\n`javascript:` 协议允许将最多 512 字节的短 JavaScript 代码直接包含在\
    \ HTML 文档的 `<a>` 元素中，适用于创建动态效果。\n\n包含 JavaScript 代码的字符串应包含双引号，因此代码内部的字符串应包含单引号，以避免混淆浏览器。\n\
    \n在下面的示例中，使用 `javascript:` 协议创建一个警告对话框——单引号包裹一个文本字符串，该字符串与对象属性进行拼接：\n\n```html\n\
    <p>\n<a href=\"javascript:alert('You are browsing with\\n' + navigator.appName)\"\
    >Show browser name</a>\n</p>\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_159_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_159_1.png)\n\n使用 `javascript:` 协议受到许多人的反对，但为了完整性将其在此包含。\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_159_2.png)\n\n"
