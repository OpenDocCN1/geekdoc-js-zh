  - '[PAGE 141]


    # Summary


    +   - The Load event occurs immediately after all the page components have loaded
    in the browser, and an event-handler can be specified in JavaScript via the window.onload
    property


    +   - When the user moves to another page, or closes the browser, the Unload event
    occurs and window.onunload is called


    +   - The window.onerror property should appear at the start of the script to
    specify an event-handler for the Error event


    +   - Both Click and DblClick events can have event-handlers, specified with onclick
    and ondblclick, to respond to clicks


    +   - A MouseDown event occurs when the user presses a mouse button and a MouseUp
    event occurs when it is released


    +   - A KeyDown event occurs when the user presses a keyboard key and a KeyUp
    event occurs when it is released


    +   - The Unicode value of a pressed key is stored in the keyCode property of
    the Keyboard event object. In Internet Explorer the value is stored in the event.keyCode
    property; other browsers pass the Keyboard object to the event-handler


    +   - A MouseOver event occurs when the cursor is placed on a page component and
    a MouseOut event occurs when it is moved off that component


    +   - Mouse movement can be tracked by specifying an event-handler to the window.document.onmousemove


    +   - Microsoft Internet Explorer stores mouse coordinates in event.x and event.y
    properties; other browsers pass the MouseEvent object to the event-handler and
    coordinates are stored in pageX and pageY properties


    +   - The Focus and Blur events respond to cursor position and the Resize event
    occurs when browser window size is'
