    \ 函数。该函数传递一个字符串参数（即要操作的元素的 `id` 值）以及一个数值（用于判断该元素是否应该是可见的）。如果传递的值为 \"1\"，`toggle()`\
    \ 将将相应对象的 `visibility` 样式设置为“visible”。\n\n将光标移出图像映射的活动区域会触发 `mouseout` 事件再次调用\
