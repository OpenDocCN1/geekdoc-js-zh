  md: '# ...cont''d


    The window.document.open() method opens a new HTML document, which can be written
    to by using the window.document.write() method to create dynamic content. When
    the content has been written the document stream should be closed by the window.document.close()
    method. The example below builds on the pop-up window example in the previous
    chapter by writing the content from JavaScript instead of simply loading an existing
    HTML document:


    > Hot tip

    Pass an empty string as the URL argument to open an empty window.


    ```

    // a function to create a dynamic popup window

    function popup() {

    // create the popup window

    var popwindow = window.open("", "", "top=40,left=30,width=250,height=125");

    // open the pop-up window HTML document

    popwindow.document.open();

    // write content in the pop-up window

    popwindow.document.write("<title>Pop-up</title>");

    popwindow.document.write("<Dynamic Pop-up Page<br/>");

    popwindow.document.write("<img src=''dex.gif''>");

    popwindow.document.close(); // close HTML document

    }

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_124_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_124_1.png)


    > Don''t forget

    Remember to use single quotes inside double quotes.'
