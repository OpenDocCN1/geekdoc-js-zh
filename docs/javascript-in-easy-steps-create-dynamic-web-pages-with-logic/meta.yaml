  mdcn: "\n## 创建子字符串\n\n可以使用 `String.substring()` 方法从现有字符串中提取子字符串，该方法需要两个参数来指定所需子字符串在主字符串中的起始和结束位置。\n\
    \n起始位置的字符将是返回子字符串的第一个字符。子字符串的最后一个字符将是给定参数位置的前一个字符。\n\n从字符串中提取子字符串的另一种方法是使用 `String.substr()`\
    \ 方法，同样需要两个参数。第一个参数指定子字符串的起始位置，第二个参数指定要返回的子字符串的长度。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_86_0.png)\n\
    \n`substr()` 方法通常更容易使用。\n\n下面的示例演示了两种子字符串方法：\n\n```javascript\n// create and initialize\
    \ a string variable\nvar str = \"JavaScript in easy steps\";\n\n// get two substrings\
    \ with the substring() method\nvar sub1 = str.substring(14,19) + str.substring(0,11);\n\
    \n// get two substrings with the substr() method\nvar sub2 = str.substr(14,5)\
    \ + str.substr(0,10);\n\n// display all the substrings\nvar res = \"Substr method\
    \ : \" +sub1;\nres += \"\\nSubstr method : \" +sub2;\nalert(res);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_86_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_86_2.png)\n\n## 转换为字符串\n\n通过调用 `Object.toString()`\
    \ 方法，可以手动调用将其他数据类型转换为字符串的 JavaScript 函数。这是一个非常的 JavaScript 函数，旨在返回所查询对象的字符串表示，即使该对象本身不是字符串。\n\
    \n在这个示例中，首先是两个整数的简单加法，然后是字符串与整数的拼接，其中整数被转换为字符串值。\n\n最后，通过不同的数据类型演示了 `Object.toString()`\
    \ 方法，以说明生成的输出将揭示对象的类型。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_87_0.png)\n\
    \n```javascript\n// create an integer variable and add another integer\nvar num\
    \ = 9;\nvar nostr = num + 9;\n\n// create a string version of the num integer\
    \ variable\n// then concatenate a second value to it\nvar adstr = num.toString()\
    \ + 9;\n\n// create a new Image object\nvar img = new Image();\n\n// display string\
    \ values of the variables\nvar res = \"No strings : \" + nostr;\nres += \"\\nAdded\
    \ strings : \" + adstr;\nres += \"\\nImage : \" + img.toString();\nalert(res);\n\
    ```\n\n`toString()` 方法可以用于 JavaScript 中的任何地方，揭示任何对象的字符串信息。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_87_1.png)\n\
    \n## 发现 Unicode 值\n\n可以使用 `String.charCodeAt()` 方法返回字符串中每个单独字符的 Unicode 值。该方法需要字符在字符串中的索引作为参数。相反，可以使用\
    \ JavaScript `String.fromCharCode()` 函数从 Unicode 获取字符，该函数将 Unicode 值作为参数。\n\n\
    下面的示例首先遍历字符串，并将其 Unicode 字符值创建一个用逗号分隔的字符串。创建了一个包含这些 Unicode 数值的数组，用于第二个循环，以返回每个数字对应的字符：\n\
    \n```javascript\n// create and initialize three strings\nvar str = \"Code Fun\"\
    , enc = \"\", unc = \"\";\n\n// get the String numbers, comma delimited\nfor(var\
    \ i = 0; i < str.length; i++) {\n  enc += str.charCodeAt(i) + \",\";\n}\n\n//\
    \ split the list of the numbers into array elements\nvar ss = enc.split(\",\"\
    );\n\n// convert the Unicode values back to characters\nfor(var i = 0; i < ss.length;\
    \ i++) {\n  unc += String.fromCharCode(ss[i]);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_88_0.png)\n\
    \nunicode.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_88_1.png)\n\n注意 `charCodeFrom`\
    \ 函数是 `String()` 构造函数的属性，而不是字符串对象的方法。关于 JavaScript 中对象的更多信息，请参见下一章。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_88_2.png)\n\
    \nalert(\"Encoded : \" +enc + \"\\nUnencoded : \" +unc);\n\n## 提取字符串数字\n\n可以使用\
    \ `parseInt()` 和 `parseFloat()` 方法从字符串开头提取数字。\n\n`parseInt()` 方法解析字符串并返回找到的第一个整数。`parseFloat()`\
    \ 方法的工作相同，但返回的是浮点值。\n"
