    \n> Don't forget\n> Remember to use single quotes inside double quotes.\n\n# Extracting\
    \ document info\n\nThe window.document object has several properties that store\
    \ information about the currently loaded document. Its domain property contains\
    \ the domain part of the URL address and the complete address is stored in the\
    \ window.document.URL property.\n\nWhen a web page is loaded in the browser as\
    \ a result of following a hyperlink the window.document.referrer property contains\
    \ the URL of the page supplying the link. The current document's title, as defined\
    \ in the HTML <title> element, is stored in the window.document.title property.\n\
    \nIn the simple HTML document listed below a script is called to write the list\
    \ items dynamically in an unordered list detailing the properties of that document,\
    \ after it has been loaded by a hyperlink:\n\n```html\n<<html>\n<head>\n<title>Document\
    \ Properties</title>\n</head>\n<body>\n<ul>\n<script type=\"text/javascript\"\
    \ src=\"props.js\"></script>\n</ul>\n</body>\n</html>\n```\n\n```javascript\n\
    // write properties...\n\nwindow.document.write(\n(\"liDomain: \" + window.document.domain));\n\
    \nwindow.document.write(\n(\"liReferrer: \" + window.document.referrer));\n\n\
    window.document.write(\n(\"liTitle: \" + window.document.title));\n\nwindow.document.write(\n\
    (\"liURL: \" + window.document.URL));\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_125_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_125_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_125_2.png)\n\
    \nNotice that the URL property is named in upper case.\n\nprops.html\nprops.js\n\
    ...cont'd (Wait, the OCR has some messy de-ordering here, let's re-align)\n\n\
    # Creating new components\n\nIn modern browsers, compliant with the W3C DOM, JavaScript\
    \ can dynamically create a new HTML element using the window.document.createElement().\
    \ An attribute can be added to the HTML element by stating an attribute name and\
    \ value as the arguments to setAttribute() method. For HTML elements that surround\
    \ text, a string can be specified with the window.document.createTextNodeNode()\n\
    \nOnce created in the script an HTML element can be inserted into the document\
    \ using the appendChild() method of a specified element. In this example the target\
    \ element is specified by the window.document.getElementById() method to identify\
    \ an element with <p id=\"para\"> that initially contains some text but no nested\
    \ children:\n\n```javascript\nvar pic, tag, target; // declare global variables\n\
    function append() {\n  if (!pic) // create a new img element\n    pic = window.document.createElement(\"\
    img\");\n    pic.setAttribute(\"src\", \"dex.gif\");\n  \n  if (!tag) // create\
    \ a new span element\n    tag = window.document.createElement(\"span\");\n   \
    \ tag.appendChild(window.document.createTextNode(\"Hi!\"));\n  \n  if (!target)\
    \ // specify an existing element to append elements to\n  target = window.document.getElementById(\"\
    para\");\n  target.appendChild(pic);\n  target.appendChild(tag);\n}\n\nfunction\
    \ remove() {\n  if (target.hasChildNodes()) // if nested elements\n    target.removeChild(pic);\n\
    \    target.removeChild(tag);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_127_0.png)\n\
    \nYou can also discover the value assigned to an attribute using the getAttribute()\
    \ method.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_127_1.png)\n\nNote that\
    \ the if statements to see if the elements have already been created by a previous\
    \ call to the function.\n\nThe second function tests to see if the specified <p>\
    \ element has nested elements with its hasChildNodes() method – when true calls\
    \ upon its removeChild() method to remove them.\n\n> Note that the removeChild()\
    \ method does not actually destroy the HTML elements – a subsequent call to the\
    \ first function will append them once more.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_128_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_128_1.png)\n\n# Summary\n\n- Document\
    \ details are stored in the anchors, forms, images and links array properties\
    \ of the window.document object.\n- The W3C DOM introduced a means to address\
    \ elements directly with the window.document.getElementById() method.\n- You can\
    \ create an array of all elements of a specific tag name using the window.document.getElementsByTagName()\
    \ method.\n- Cookie data is stored in the window.document.cookie object as a name=value\
    \ pair.\n- The window.document.write() method allows JavaScript to create content\
    \ dynamically.\n- Use the window.document.open() method to open a new HTML document\
    \ for writing to – remember to close it upon completion with the window.document.close()\
    \ method.\n- Information about the document location is stored in the domain,\
    \ referrer, title and URL properties of the window.document object.\n- The window.document.createElement()\
    \ method can be used to create a new HTML element object.\n- Add an attribute\
    \ to an HTML element object by stating a name and a value as arguments to its\
    \ setAttribute() method.\n- Use the window.document.createTextNodeNode() method\
    \ to specify text content for an HTML element object.\n- Add text content to an\
    \ HTML element object using its appendChild() method.\n- You can test if a specified\
    \ element has nested elements with its hasNodes() method and remove nested elements\
    \ with its removeChild() method.\n"
  mdcn: "\n\n# 使用 JavaScript 写入\n\n`window.document` 对象的 `write()` 方法是一个极其强大的功能，它允许\
    \ JavaScript 在加载网页时动态创建内容。该方法接受一个字符串参数，其中包含要写入页面的内容，该内容可能包含用于格式化内容的 HTML 标签。\n\
    \n通常情况下，`window.document.write()` 方法会在 HTML 文档的 `<body>` 部分内添加内容，并根据条件测试的结果写入选定的内容。\n\
    \n需要注意的是，在运行时调用此方法将导致指定的内容写入新的空白文档，或者替换当前页面。\n\n变量值也可以与字符串参数拼接，以便将变量值引入网页内容中。\n\
    \n此示例首先生成一个随机数，然后测试以确定该数字是奇数还是偶数。根据测试结果，将选定的内容添加到页面中：\n\n```javascript\n// 获取一个\
    \ 1 - 100 之间的随机整数\nvar n = Math.ceil(Math.random() * 100);\n\n// 判断数字是奇数还是偶数\n\
    var ntype = (n % 2 == 0) ? \"Even\" : \"Odd\";\n\n// 写入数字的描述\ndocument.write(\"\
    <h1>Number \"+n+\" is \"+ntype+\"</h1>\");\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_123_0.png)\n\
    \n别忘记地址中的“window”部分可以省略——直接使用 `document.write()` 即可。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_123_1.png)\n\
    \nwrite.js\n\n# ...续\n\n`window.document.open()` 方法打开一个新的 HTML 文档，可以使用 `window.document.write()`\
    \ 方法向其写入以创建动态内容。当内容写入后，应该通过 `window.document.close()` 方法关闭文档流。下面的示例在上一章弹出窗口示例的基础上，通过从\
    \ JavaScript 写入内容而不是简单地加载现有的 HTML 文档：\n\n> 小贴士\n> 传递空字符串作为 URL 参数可以打开一个空窗口。\n\n\
    ```javascript\n// 一个创建动态弹出窗口的函数\nfunction popup() {\n// 创建弹出窗口\nvar popwindow\
    \ = window.open(\"\", \"\", \"top=40,left=30,width=250,height=125\");\n// 打开弹出窗口\
    \ HTML 文档\npopwindow.document.open();\n// 在弹出窗口中写入内容\npopwindow.document.write(\"\
    <title>Pop-up</title>\");\npopwindow.document.write(\"<Dynamic Pop-up Page<br/>\"\
    );\npopwindow.document.write(\"<img src='dex.gif'>\");\npopwindow.document.close();\
    \ // 关闭 HTML 文档\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_124_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_124_1.png)\n\n> 别忘记\n> 记住在双引号内部使用单引号。\n\
    \n# 提取文档信息\n\n`window.document` 对象有多个属性，存储有关当前加载文档的信息。其 `domain` 属性包含 URL 地址的域名部分，完整地址存储在\
    \ `window.document.URL` 属性中。\n\n当在浏览器中通过超链接加载网页时，`window.document.referrer` 属性包含提供链接的页面\
    \ URL。当前文档的标题（由 HTML `<title>` 元素定义）存储在 `window.document.title` 属性中。\n\n在下方列出的简单\
    \ HTML 文档中，调用了一个脚本来在无序列表中动态写入列表项，详细列出该文档的属性，该文档是在通过超链接加载的：\n\n```html\n<<html\n\
    <head>\n<title>Document Properties</title>\n</head>\n<body>\n<ul>\n<script type=\"\
    text/javascript\" src=\"props.js\"></script>\n</ul>\n</body>\n</html>\n```\n\n\
    ```javascript\n// 写入属性...\n\nwindow.document.write(\n(\"liDomain: \" + window.document.domain));\n\
    \nwindow.document.write(\n(\"liReferrer: \" + window.document.referrer));\n\n\
    window.document.write(\n(\"liTitle: \" + window.document.title));\n\nwindow.document.write(\n\
    (\"liURL: \" + window.document.URL));\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_125_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_125_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_125_2.png)\n\
    \n注意 `URL` 属性名是大大写的。\n\nprops.html\nprops.js\n...续（等等，OCR 在这里的排序有些混乱，让我们重新重新对齐）\n\
    \n# 创建新组件\n\n在现代浏览器中，符合 W3C DOM 的 JavaScript 可以使用 `window.document.createElement()`\
    \ 动态创建一个新的 HTML 元素。通过指明属性名称和值作为 `setAttribute()` 方法的参数，可以向 HTML 元素添加属性。对于包裹文本的\
    \ HTML 元素，可以使用 `window.document.createTextNodeNode()` 指定一个字符串。\n\n一旦在脚本中创建了 HTML\
    \ 元素，就可以使用指定元素的 `appendChild()` 方法将其插入文档中。在本示例中，目标元素通过 `window.document.getElementById()`\
    \ 方法指定，以识别带有 `<p id=\"para\">` 的元素，该元素最初包含一些文本但没有嵌套子元素：\n\n```javascript\nvar\
    \ pic, tag, target; // 声明全局变量\nfunction append() {\n  if (!pic) // 创建一个新的 img元素\n\
    \    pic = window.document.createElement(\"img\");\n    pic.setAttribute(\"src\"\
    , \"dex.gif\");\n  \n  if (!tag) // 创建一个新的 span 元素\n    tag = window.document.createElement(\"\
    span\");\n    tag.appendChild(window.document.createTextNode(\"Hi!\"));\n  \n\
    \  if (!target) // 指定一个现有元素来附加元素\n  target = window.document.getElementById(\"\
    para\");\n  target.appendChild(pic);\n  target.appendChild(tag);\n}\n\nfunction\
    \ remove() {\n  if (target.hasChildNodes()) // 如果有子节点\n    target.removeChild(pic);\n\
    \    target.removeChild(tag);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_127_0.png)\n\
    \n可以使用 `getAttribute()` 方法发现赋值给属性的值。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_127_1.png)\n\
    \n注意使用 `if` 语句检查元素是否已通过之前的调用创建。\n\n第二个函数测试指定的 `<p>` 元素是否具有嵌套元素，如果是，则调用其 `removeChild()`\
    \ 方法将其移除。\n\n> 注意 `removeChild()` 方法并不会销毁 HTML 元素——后续调用第一个函数会再次附加它们。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_128_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_128_1.png)\n\n# 总结\n\n- 文档详情存储在 `window.document`\
    \ 对象的 `anchors`、`forms`、`images` 和 `links` 属性中。\n- W3C DOM 引入了通过 `window.document.getElementById()`\
    \ 方法直接访问元素的方法。\n- 使用 `window.document.getElementsByTagName()` 创建特定标签元素的数组。\n-\
    \ Cookie 数据以键值对的形式存储在 `window.document.cookie` 对象中。\n- `window.document.write()`\
    \ 方法允许 JavaScript 动态创建内容。\n- 使用 `window.document.open()` 方法打开一个新的 HTML 文档以便写入——记得完成后使用\
    \ `window.document.close()` 方法关闭它。\n- 关于文档位置的信息存储在 `window.document` 对象的 `domain`、`referrer`、`title`\
    \ 和 `URL` 属性中。\n- 可以使用 `createElement()` 创建 HTML 元素。\n- 通过将名称和值作为 `setAttribute()`\
    \ 方法的参数，为 HTML 元素添加属性。\n- 使用 `window.document.createTextNodeNode()` 方法为 HTML 元素指定文本内容。\n\
    - 使用其 `appendChild()` 方法向 HTML 元素添加文本内容。\n- 你可以使用 `hasChildNodes()` 方法测试指定元素是否具有嵌套元素，并使用其\
    \ `removeChild()` 方法移除嵌套元素。\n\n"
