    # Extracting date components


    The Date object has special methods that may be used to retrieve individual parts
    of the date information.


    Some methods return the date information as an index number that often needs to
    be converted by the script.


    The Date.getDay() method returns the day of the week as an index value from 0
    (Sunday) to 6 (Saturday).


    Also the Date.getMonth() method returns the month of the year as an index value
    from 0 (January) to 11 (December).


    The example below illustrates the Date object and uses two arrays to display the
    correct day and month names:


    ```

    // create an array of day names and month names

    var days = new Array("Sun", "Mon", "Tue", "Wed",

    Thu", "Fri", "Sat");


    var months = new Array("Jan", "Feb", "Mar", "Apr",

    "May", "Jun", "Jul", "Sep", "Oct", "Nov", "Dec");


    var now = new Date(); // create a new Date object

    var yy = now.getFullYear();

    if(yy < 2000) yy -= 1900; // adjust year for Mozilla

    var mm = now.getMonth(); // get the month no.

    mm = months[mm];

    var dd = now.getDate(); // get day. in the month

    var dy = now.getDay(); // get day. in the week

    days = days[dy]; // convert day no. to name

    ```


    ```

    // display the extracted date and date information

    alert("date " + " " + mm + " " + dd + " " + yy);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_60_0.png)


    Beware indexing starts at 0, zero not - so the index number for March is 2 not3.


