  md: '# # Summary


    +   - Document details are stored in the anchors, forms, images and links array
    properties of the window.document object


    +   - The W3C DOM introduced a means to address elements directly with the window.document.getElementById()
    method


    +   - You can create an array of all elements of a specific tag name using the
    window.document.getElementsByTagName() method


    +   - Cookie data is stored in the window.document.cookie object as a name=value
    pair


    +   - The window.document.write() method allows JavaScript to create content dynamically


    +   - Use the window.document.open() method to open a new HTML document for writing
    to – remember to close it upon completion with the window.document.close() method


    +   - Information about the document location is stored in the domain, referrer,
    title and URL properties of the window.document object


    +   - The window.document.createElement() method can be used to create a new HTML
    element object


    +   - Add an attribute to an HTML element object by stating a name and a value
    as arguments to its setAttribute() method


    +   - Use the window.document.createTextNodeNode() method to specify text content
    for an HTML element object


    +   - Add text content to an HTML element object using its appendChild() method


    +   - You can test if a specified element has nested elements with its hasNodes()
    method and remove nested elements with its removeChild() method'
