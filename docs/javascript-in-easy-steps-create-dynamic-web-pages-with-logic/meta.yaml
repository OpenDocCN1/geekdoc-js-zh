    # Slicing elements into pieces


    The JavaScript Array.slice() method is useful to make a new array from an existing
    array using some of the existing element values.


    This method takes two arguments to specify the index numbers of elements in the
    original array where the new array elements start and end.


    The second argument may have a negative value to indicate the element position
    from the end of the array.


    If only a single argument is specified it will be used as the first element index
    number and the method will return a new array with all elements from this position
    onwards.


    These examples illustrate the different ways in which the Array.slice() method
    can be used:


    ```javascript

    // create and initialize a new array

    var nums = new Array(1, 2, 3, 4, 5, 6, 7, 8 );


    // get elements #2 up to #4

    var str = "Slice A: " + nums.slice( 2, 4 ) + "\n";


    // get elements #1 to one before the final element

    str += "Slice B: " + nums.slice( 1, -1 ) + "\n";


    // get elements #3 to end

    str += "Slice C: " + nums.slice( 3 ) + "\n";


    // display all three slices

    alert(str);

    ```


    > Beware

    The array elements are taken up to, but not including, the second argument index.


    # Sorting Array elements sequentially


    The JavaScript Array.sort() method allows string element values to be arranged
    in alphabetical order.


    This is sometimes desirable so that the output can be presented alphabetically.


    Integer and floating-point numeric values will be arranged in ascending order
    – as seen in the following example:


    ```javascript

    // create an array of integers

    var integers = new Array(3, 8, 1, 9, 7, 5, 4, 2, 6);

    // sort the integer array numerically

    integers.sort();


    // create an array of floating-point numbers

    var floats = new Array(0.5, 0.125, 0.75, 0.25);

    // sort the floats array numerically

    floats.sort();


    // create an array of strings

    var strings = new Array("Michael", "Andrew", "David");

    // sort the strings array alphabetically

    strings.sort();


    // separate the elements with a hyphen

    var str = "Integers array: " + integers.join(" - ");

    str += "\nFloats array: " + floats.join(" - ");

    str += "\nStrings array: " + strings.join(" - ");


    // display all three sorted arrays

    alert(str);

    ```


    > Negative numeric values are arranged as -1, -2, -3, etc.


    # Summary


    - An array is a variable that can contain multiple values

    - Each value held in an array is contained in an array element

    - The JavaScript Array() constructor is used to create an array

    - Small arrays can initialize element values by specifying a comma-separated list
    of arguments to the Array() constructor

    - Optionally the size of an array can be specified as a single integer argument
    to the Array() constructor

    - Loops can be used to easily fill array elements with values

    - An array''s length property can be used to add extra elements at the end of
    the array

    - The array join() method can be used to concatenate all element values into a
    single string

    - Optionally a separator can be specified as an argument to the join() method
    to be inserted between the element values

    - Arrays can fully store a series of file names or URLs

    - The array reverse() method can be used to reverse the order of an array''s elements

    - A specific range of array elements can be addressed by starting and end index
    numbers as arguments to the slice() method

    - Stating a single index number argument to the slice() method will address all
    elements from that position up to the final element

    - The array sort() method arranges elements sequentially in ascending order numerically
    or alphabetically


    # Telling the time


    This chapter describes how to use date and time information. The Date object and
    Universal Time are explained along with the JavaScript timer.


    - Getting the date and time

    - Extracting date components

    - Calculating elapsed time

    - Utilizing universal time

    - Recognizing time zones

    - Setting the date and time

    - Creating date strings


    # Getting the date and time


    Date and time are often used in JavaScript to customize the performance of a web
    page. For example, a script might welcome a user with a greeting appropriate to
    the current time: The script for this application is contained in the example
    shown on page. The date and time that are used are taken from the clock system
    that is running the browser in which the script is loaded. To access the system
    clock information the script must first create a Date object. This is achieved
    in the same manner in which an Array is created, using the JavaScript Date() function.
    The example below creates and displays a Date object:


    ```javascript

    // create a Date object

    var now = new Date();


    // display the Date object''s date and time

    alert(now);

    ```


    # Extracting date components


    The Date object has special methods that may be used to retrieve individual parts
    of the date. Some methods return the date information as an index number that
    needs to be converted by the script. The Date.getDay() method returns the day
    of the week as an index value from 0 (Sunday) to 6 (Saturday). Also the Date.getMonth()
    method returns the month of the year as an index value from 0 (January) to 11
    (December). The example below illustrates the Date object and uses two arrays
    to display the correct day and month names:


    ```javascript

    // create an array of day names and month names

    var days = new Array("Sun", "Mon", "Tue", "Wed", "Fri", "Sat");


    var months = new Array("Jan", "Feb", "Mar", "Apr", "May", "Jun", "Sep", "Oct",
    "Nov", "Dec");


    var now = new Date(); // create a new Date object

    var yy = now.getFullYear();

    if(yy < 2000) yy -= 1900; // adjust year for Mozilla

    var mm = now.getMonth(); // get the month no.

    mm = months[mm];

    var dd = now.getDate(); // get day. in the month

    var dy = now.getDay(); // get day. in the week

    days = days[dy]; // convert day no. to name


    // display the extracted date and date information

    alert("date " + mm + " " + dd + " " + yy);

    ```


    Beware indexing starts at 0, zero not so the index number for March is 2 not 3.


    Hot tip Mozilla browsers report the year as the number of years elapsed since
    1900 - so in this case line of script adds 1900 to the reported date.


    # Extracting time components


    The Date object has special methods to access the time information that it contains.
    The example below gets the current hours, minutes, seconds and milliseconds from
    the host clock and displays a welcome message appropriate for the time of day:


    ```javascript

    // create a new Date object

    var now = new Date();


    // extract the time information

    var hh = now.getHours();

    var mn = now.getMinutes();

    var ss = now.getSeconds();

    var ms = now.getMilliseconds();


    // default welcome message

    var hi = "Good Morning";

    ```


    ```javascript

    // welcome message if after noon

    if( hh > 11 ) hi = "Good Afternoon";

    ```


    ```javascript

    // welcome message if after 6 p.m.

    if( hh > 17 ) hi = "Good Evening";

    ```


    ```javascript

    // display welcome message and the current time

    var tim = hi + "Hours: " + hh + "\n";

    tim += "Minutes: " + mn + "\n";

    tim += "Seconds: " + ss + "." + ms;

    alert(tim);

    ```


    The hours are returned as numbers 0-23 in 24-hour format.

