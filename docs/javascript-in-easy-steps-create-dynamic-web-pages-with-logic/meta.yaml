  md: "# Polling checkboxes\n\nUnlike radio buttons a checkbox operates independently\
    \ from other checkboxes and so all checkboxes should be uniquely identified by\
    \ their name attribute in the HTML code.\n\nEach checkbox creates a window.document.forms\
    \ object with its given name and, like a radio button, each has a checked property.\n\
    \nIn this example a JavaScript loop examines three checkboxes named \"chk1\",\
    \ \"chk2\", and \"chk3\", to discover which ones are checked. It uses the eval()\
