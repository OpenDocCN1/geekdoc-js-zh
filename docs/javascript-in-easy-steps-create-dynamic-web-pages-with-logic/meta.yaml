  md: "# Manipulating style attributes\n\nThe style object of a web page component\
    \ contains many properties that store information about its position and appearance.\
    \ JavaScript can dynamically change these properties to alter its position and\
    \ appearance to create interactive effects. This technique is commonly known as\
    \ Dynamic HTML (DHTML).\n\nProbably the most important style attributes of a <div>\
    \ element to be used in HTML are id, top, left, z-index, visibility, color and\
    \ background-color. These style attributes can be dynamically changed by assigning\
    \ new values to them with JavaScript.\n\nThe first function in this example is\
    \ called by the window.onload event-handler to display style properties of a <div>\
    \ element. Its onclick attribute is assigned the second function, so that some\
    \ of its style properties get changed when a user clicks on that element and the\
    \ new style property values are displayed:\n\n```\nwindow.onload=get_styles;\n\
    \nfunction get_styles() {\n  var obj = window.document.getElementById(\"lyr\"\
    );\n  var str = \"ID: \" + obj.id + \"\\n\";\n  str += \"Top: \" + obj.style.top\
    \ + \"\\n\";\n  str += \"Left: \" + obj.style.left + \"\\n\";\n  str += \"Z-Index:\
    \ \" + obj.style.zIndex + \"\\n\";\n  str += \"Visibility: \" + obj.style.visibility\
    \ + \"\\n\";\n  str += \"Background:\"+obj.style.backgroundColor+\"\\n\";\n  str\
    \ += \"Foreground: \" + obj.style.color+\"\\n\";\n  alert(str);\n}\n\nfunction\
    \ restyle() {\n  var obj = window.document.getElementById(\"lyr\");\n  obj.style.top\
    \ = \"150px\";\n  obj.style.left = \"20px\";\n  obj.style.zIndex = \"20\";\n \
    \ obj.style.backgroundColor = \"lime\";\n  obj.style.color = \"blue\";\n  get_styles();\n\
    }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_161_0.png)\n\nstyle.js"
