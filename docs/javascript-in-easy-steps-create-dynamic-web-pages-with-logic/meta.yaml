  - "[PAGE 21]\n\n# # Variable scope\n\nThe extent to which a variable is accessible\
    \ script functions is called the variable’s “scope” and is determined by where\
    \ the variable is declared.\n\nA variable declared in a function block is only\
    \ accessible by code within that function block – this is known as a “local” variable.\n\
    \nThe example below has three function blocks that each contain one local variable:\n\
    \n```\n// a function to display two local variables\nfunction call_alert() {\n\
    \    var str = \"\";\n    str = str + first_var();\n    str = str + second_var();\n\
    \    alert(str);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_21_0.png)\n\
    \n```\n// a function to return a stored string\nfunction first_var() {\n    var\
    \ local_var = \"Fantastic \";\n    return local_var;\n}\n```\n\nAs local variables\
    \ are only visible within the function block where they are declared, you can\
    \ use the same variable name in multiple function blocks without conflict.\n\n\
    ```\n// another function to return a stored string\nfunction second_var() {\n\
    \    var local_var = \"JavaScript!\";\n    return local_var;\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_21_1.png)"
  - "[PAGE 22]\n\n# ...cont'd\n\nThe scope of a variable can be extended by declaring\
    \ the variable outside a function block to make it accessible by any function\
    \ in the script – in this case it is known as a “global” variable.\n\nThe example\
    \ below has two function blocks that access one global variable:\n\n```\n// create\
    \ a global variable\nstored_num;\n\n// a function to call a second function\n\
    // and display a returned result\nfunction call_alert( num )\n{\n  stored_num\
    \ = num;\n  make_triple(\"The Value Is \" + stored_num);\n}\n\n// a function to\
    \ triple a value\n// and return the result to the caller\nfunction make_triple()\n\
    {\n  stored_num = stored_num + stored_num + stored_num;\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_22_0.png)\n\
    \n> Hot tip\nAll variables may simply be declared without being initialized with\
    \ a value.\n\nThe example passes the argument onload to a global variable:\n\n\
    ```\n<body onload=\"call_alert( 5 )\">\n```\n\nThe second function manipulates\
    \ the value of the global variable before calling alert() to display the new value.\n\
    \n> Beware\nGlobal variables are visible to all functions and must have a unique\
    \ name to avoid conflict.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_22_1.png)"
