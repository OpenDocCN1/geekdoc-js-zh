- md: "\n# 11 Handling events\n\nThis chapter describes the browser events that are\
    \ caused by user actions and demonstrates how JavaScript can respond.\n\n- 130\
    \ Reacting to window events\n- 132 Responding to clicks\n- 134 Acknowledging key\
    \ actions\n- 136 Recognizing mouse moves\n- 138 Identifying focus and size\n-\
    \ 140 Summary\n\n## Reacting to window events\n\nThe Load event occurs when all\
    \ the HTML elements on a web page have completely loaded. This means that the\
    \ window.onload event-handler is only activated after all the elements are present.\
    \ Typically the window.onload event-handler will call a JavaScript function, often\
    \ named \"init\", to initialize a number of values.\n\nConversely, the Unload\
    \ event occurs when the user moves to another web page, or closes the browser,\
    \ and the window.onunload event-handler is activated.\n\nThis example sets an\
    \ initial value in a form text box and displays a final alert dialog message when\
    \ the user leaves the page:\n\n```javascript\n// specify the onload and unload\
    \ event-handlers\nwindow.onload = init;\nwindow.onunload = term;\n\n// a function\
    \ to react to the LOAD event\nfunction init() {\n    document.getElementById(\"\
    box-1\").value = \n    \"The Page Is Loaded\";\n}\n\n// a function to react to\
    \ the UNLOAD event\nfunction term() {\n    alert(\"Thanks for visiting\\nCome\
    \ back soon\");\n}\n```\n\nAn HTML event-handler assigned to the onload attribute\
    \ of the <body> tag could replace that assigned in the script.\n\nAn Error event\
    \ occurs when a runtime error is encountered, and the window.onerror event-handler\
    \ is activated to determine how to handle the error. The window.onerror event\
    \ handler can call upon a JavaScript function to handle the error; otherwise the\
    \ browser will handle the error itself by opening an error dialog box.\n\nOnce\
    \ the error has been notified a true value is returned to the browser to indicate\
    \ that the error has been dealt with. To avoid all error dialogs a custom error-handler\
    \ function only return true when an error is encountered.\n\nUsefully the browser\
    \ will pass three arguments to the error-handler containing information on the\
    \ nature of the error, the URL of the file that contains the error, and the actual\
    \ line number in that file where the error exists.\n\nIn the example below each\
    \ piece of error information passed to the error-handling function by the browser\
    \ is displayed for the user:\n\n```javascript\n// specify an onerror error-handler\n\
    window.onerror = errorhandler;\n\n// a function to react to the ERROR event\n\
    function errorhandler( msg, url, ln ) {\n    alert(\"Error: \" + msg + \" \\nIn\
    \ File: \" + url + \" \\nAt Line: \" + ln);\n    return true; // tell the browser\
    \ it's been handled\n}\n\n// A deliberate mistake - this item does not exist\n\
    document.getElementById(\"btn\").value = \"myButton\";\n```\n\nThe error-handler\
    \ must be specified at the top of the script to catch all possible errors.\n\n\
    ## Responding to clicks\n\nThe most common interactive event is the Click event,\
    \ created when a user presses the left mouse button on a web page to activate\
    \ its onclick-handler — typically an HTML form button. An onclick event-handler\
    \ is often assigned in the button's HTML <input> type to onclick attribute, like\
    \ this:\n\n```html\n<input type = \"button\" value = \"Do Click\"\nonclick = \"\
    dbl_click('Button Pressed') />\n```\n\nSimilarly, the DblClick event occurs when\
    \ the user double-clicks the left mouse button to activate the ondblclick event-handler.\n\
    \nThis example specifies an event-handler to \"listen\" for the DblClick event\
    \ in the window and a function to handle a button's component event.\n\n```javascript\n\
    // specify a DBLCLICK event-handler\nwindow.ondblclick=do_dblclick;\n\n// a function\
    \ to react to a button CLICK event\nfunction do_click(str) { \n    alert(str);\n\
    }\n\n// a function to react to the DBLCLICK event\nfunction do_dblclick() { \n\
    \    alert(\"Double Clicked\"); \n}\n```\n\nMouseDown event occurs when the user\
    \ presses a mouse button and MouseUp event occurs when it is released. Typically\
    \ these are used together that a single mouse click will activate two event-handlers,\
    \ like this:\n\n```html\n<input type=\"button\" value=\"Light Switch\" onmousedown=\"\
    light(1)\" onmouseup=\"light(0)\">\n```\n\nThis example swaps image and changes\
    \ the value of a text box when the cursor is over the image and a mouse button\
    \ is pressed. It reverts both to their original states when the button is released:\n\
    \n```javascript\n// a function to react to MOUSEDOWN and MOUSEUP events\nfunction\
    \ light(n) {\n  var pic = document.getElementById(\"bulb\");\n  var box = document.getElementById(\"\
    txt\");\n  if(n == 1) {\n    pic.src = \"on.gif\";\n    box.value = \"Button Down\"\
    ;\n  } else {\n    pic.src = \"off.gif\";\n    box.value = \"Button Up\";\n  }\n\
    }\n```\n\nThe document, link and button HTML elements all support onmousedown\
    \ and onmouseup attributes.\n\n## Acknowledging key actions\n\nKeyDown event occurs\
    \ when the user presses a keyboard key andKeyUp occurs when it is released. Typically\
    \ these are used together, so pressing and releasing a key will activate two event-handlers.\
    \ This example swaps an image and changes the value of a text box when a keyboard\
    \ key is pressed reverts both to their original states when the key is released:\n\
    \n```javascript\n// specify KEYDOWN and KEYUP event-handlers\nwindow.document.onkeydown\
    \ = iskeydown;\nwindow.document.onkeyup = isup;\n\n// a function to react to KEYDOWN\
    \ events\nfunction iskeydown() {\n    document.getElementById(\"bulb\").src=\"\
    on.gif\";\n    document.getElementById(\"txt\").value = \"Key Down\";\n}\n```\n\
    \nThis code deliberately omits the \"window.\" part of the window.document address.\n\
    \n```javascript\n// a function to react to KEYUP events\nfunction isup() {\n \
    \   document.getElementById(\"bulb\").src=\"off.gif\";\n    document.getElementById(\"\
    txt\").value = \"Key Up\";\n}\n```\n\n| Key & KeyDown | |\n| :--- | :--- |\n|\
    \ ⬅ | key-keydown |\n| + | KeyUp & KeyDown |\n| \U0001F4A1 | Key is Up |\n| Done\
    \ | |\n\n| KeyUp & KeyDown | |\n| :--- | :--- |\n| ➡ | key-keyup |\n| + | KeyUp\
    \ & KeyDown |\n| \U0001F4A1 | Key is Down |\n| Done | |\n\nWhen a user presses\
    \ a key, the KeyDown event passes a numeric value to the keyCode property of the\
    \ KeyboardEvent object. The number is the Unicode character number of that key\
    \ and can be used in JavaScript to discover which key has been pressed.\n\nThis\
    \ example shows the Y and N character codes in both upper and lower case. The\
    \ KeyboardEvent object is passed as the argument to the specified Key event handler.\
    \ Internet Explorer stores the value in its event object whose keyCode property\
    \ can be addressed directly, so the script branches to:\n\n```javascript\n// specify\
    \ a KEYDOWN event-handler\nwindow.document.keydown=showkey;\n\n// a function to\
    \ react to the KEYDOWN event\n// passing the KeyboardEvent object as its argument\n\
    function showkey(e) {\n  var obj = (navigator.appName == \"Microsoft Internet\
    \ Explorer\") ? event : e;\n  // consider the keyCode property value\n  if(obj.keyCode\
    \ == 89 || obj.keyCode == 121)\n    alert(\"Y pressed\");\n  if(obj.keyCode ==\
    \ 78 || obj.keyCode == 110)\n    alert(\"N pressed\");\n}\n```\n"
  mdcn: "\n[content]\n\n# 11 处理事件\n\n本章描述了由用户操作引起的浏览器事件，并演示了 JavaScript 如何做出响应。\n\n\
    - 130 响应窗口事件\n- 132 响应点击\n- 134 确认按键动作\n- 136 识别鼠标移动\n- 138 识别焦点和大小\n- 140 总结\n\
    \n## 响应窗口事件\n\n当网页上的所有 HTML 元素完全加载时，会触发 Load 事件。这意味着 `window.onload` 事件处理器只有在所有元素存在后才会被激活。通常，`window.onload`\
    \ 事件处理器会调用一个 JavaScript 函数（通常命名为 \"init\"）来初始化多个值。\n\n相反，Unload 事件在用户移动到另一个网页或关闭浏览器时发生，此时\
    \ `window.onunload` 事件处理器会被激活。\n\n此示例在表单文本框中设置了一个初始值，并在用户离开页面时显示一个最终的警报对话框消息：\n\
    \n```javascript\n// 指定 onload 和 unload 事件处理器\nwindow.onload = init;\nwindow.onunload\
    \ = term;\n\n//  用于响应 LOAD 事件的函数\nfunction init() {\n    document.getElementById(\"\
    box-1\").value = \n    \"The Page Is Loaded\";\n}\n\n// 用于响应 UNLOAD 事件的函数\nfunction\
    \ term() {\n    alert(\"感谢访问\\n欢迎经常光临\");\n}\n```\n\n分配给 <body> 标签 `onload` 属性的\
    \ HTML 事件处理器可以替换脚本中分配的那个句柄。\n\n当遇到运行时错误时，会发生 Error 事件，此时 `window.onerror` 事件处理器会被激活以确定如何处理错误。`window.onerror`\
    \ 事件处理器可以调用 JavaScript 函数来处理错误；否则浏览器将通过打开错误对话框来自行处理错误。\n\n一旦通知了错误，将向浏览器返回一个 `true`\
    \ 值，表示错误已处理。为了避免出现所有错误对话框，自定义的错误处理器函数仅在遇到错误时才返回 `true`。\n\n有用的是，浏览器将向错误处理器传递三个参数，其中包含错误性质的信息、包含错误的文件的\
    \ URL，以及该文件中错误实际的实际行号。\n\n在下面的示例中，浏览器传递给错误处理函数的每个错误信息都将显示给用户：\n\n```javascript\n\
    // 指定 onerror 错误处理器\nwindow.onerror = errorhandler;\n\n// 用于响应 ERROR 事件的函数\nfunction\
    \ errorhandler( msg, url, ln ) {\n    alert(\"Error: \" + msg + \" \\nIn File:\
    \ \" + url + \" \\nAt Line: \" + ln);\n    return true; // 告诉浏览器已已处理\n}\n\n//\
    \ 一个故意制造的错误 - 此项不存在\ndocument.getElementById(\"btn\").value = \"myButton\";\n\
    ```\n\n必须在脚本顶部指定错误处理器，以捕获所有可能的错误。\n\n## 响应点击\n\n最常见的交互事件是 Click 事件，当用户在网页上按下鼠标左键时创建，以激活其\
    \ `onclick` 处理器——通常是一个 HTML 表单按钮。`onclick` 事件处理器通常被分配在按钮的 HTML `<input>` 类型的 `onclick`\
    \ 属性中，如下：\n\n```html\n<input type = \"button\" value = \"Do Click\"\nonclick =\
    \ \"dbl_click('Button Pressed') />\n```\n\n同样，当用户双击鼠标左键以激活 `ondblclick` 事件处理器时，会发生\
    \ DblClick 事件。\n\n此示例指定了一个事件处理器来“监听”窗口中的 DblClick 事件，以及一个处理按钮组件事件的函数。\n\n```javascript\n\
    // 指定一个 DBLCLICK 事件处理器\nwindow.ondblclick=do_dblclick;\n\n// 用于响应按钮 CLICK 事件的函数\n\
    function do_click(str) { \n    alert(str);\n}\n\n// 用于响应 DBLCLICK 事件的函数\nfunction\
    \ do_dblclick() { \n    alert(\"Double Clicked\"); \n}\n```\n\nMouseDown 事件在用户按下鼠标键时发生，MouseUp\
    \ 事件在释放鼠标键时发生。通常这些会被一起使用，使得单个鼠标点击将激活两个事件处理器，如下：\n\n```html\n<input type=\"button\"\
    \ value=\"Light Switch\" onmousedown=\"light(1)\" onmouseup=\"light(0)\">\n```\n\
    \n此示例在光标悬停在图像上并按下鼠标键时，交换图像并更改文本框的值。当释放按钮时，两者都会恢复到原始状态：\n\n```javascript\n// 用于响应\
    \ MOUSEDOWN 和 MOUSEUP 事件的函数\nfunction light(n) {\n  var pic = document.getElementById(\"\
    bulb\");\n  var box = document.getElementById(\"txt\");\n  if(n == 1) {\n    pic.src\
    \ = \"on.gif\";\n    box.value = \"Button Down\";\n  } else {\n    pic.src = \"\
    off.gif\";\n    box.value = \"Button Up\";\n  }\n}\n```\n\ndocument、link 和 button\
    \ HTML 元素都支持 `onmousedown` 和 `onmouseup` 属性。\n\n## 确认按键动作\n\n当用户按下键盘按键时发生 KeyDown\
    \ 事件，释放时发生KeyUp 事件。通常这些会被一起使用，因此按下和释放按键将激活两个事件处理器。此示例在按下键盘按键时交换图像并更改文本框的值，当释放按键时，两者都会恢复到原始状态：\n\
    \n```javascript\n// 指定 KEYDOWN 和 KEYUP 事件处理器\nwindow.document.onkeydown = iskeydown;\n\
    window.document.onkeyup = isup;\n\n// 用于响应 KEYDOWN 事件的函数\nfunction iskeydown()\
    \ {\n    document.getElementById(\"bulb\").src=\"on.gif\";\n    document.getElementById(\"\
    txt\").value = \"Key Down\";\n}\n```\n\n此代码故意遗漏了 `window.document` 地址中的 `window.`\
    \ 部分。\n\n```javascript\n// 用于响应 KEYUP 事件的函数\nfunction isup() {\n    document.getElementById(\"\
    bulb\").src=\"off.gif\";\n    document.getElementById(\"txt\").value = \"Key Up\"\
    ;\n}\n```\n\n| Key & KeyDown | |\n| :--- | :--- |\n| ⬅ | key-keydown |\n| + |\
    \ KeyUp & KeyDown |\n| \U0001F4A1 | Key is Up |\n| Done | |\n\n| KeyUp & KeyDown\
    \ | |\n| :--- | :--- |\n| ➡ | key-keyup |\n| + | KeyUp & KeyDown |\n| \U0001F4A1\
    \ | Key is Down |\n| Done | |\n\n当用户按下按键时，KeyDown 事件会将一个数值传递给 KeyboardEvent 对象的\
    \ `keyCode` 属性。该数字是按键的 Unicode 字符编号，可以使用 JavaScript 发现按下了哪个键。\n\n此示例显示了大小写的字符代码。KeyboardEvent\
    \ 对象作为参数传递给指定的 Key 事件处理器。Internet Explorer 将值存储在它的事件对象中，可以直接访问其 `keyCode` 属性，因此脚本分支到：\n\
    \n```javascript\n// 指定一个 KEYDOWN 事件处理器\nwindow.document.keydown=showkey;\n\n//\
    \ 用于响应 KEYDOWN 事件的函数\n// 将 KeyboardEvent 对象作为参数\nfunction showkey(e) {\n  var\
    \ obj = (navigator.appName == \"Microsoft Internet Explorer\") ? event : e;\n\
    \  // 考虑 keyCode 属性值\n  if(obj.keyCode == 89 || obj.keyCode == 121)\n    alert(\"\
    Y pressed\");\n  if(obj.keyCode == 78 || obj.keyCode == 110)\n    alert(\"N pressed\"\
    );\n}\n```\n\n[/content]\n"
