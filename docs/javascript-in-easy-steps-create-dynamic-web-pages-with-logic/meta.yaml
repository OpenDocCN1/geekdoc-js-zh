    \ get chosen row\n  var col = document.getElementById(\"column\").options.selectedIndex;\
    \ // get chosen column\n\n  // get new value entered by the user\n  var new_value\
    \ = parseFloat(document.getElementById(\"new_value\").value);\n\n  // ensure the\
    \ user has input a column, row, and value\n  if(row == 0) {\n    alert(\"Please\
    \ select a row number\");\n  }\n  if(col == 0) {\n    alert(\"Please select a\
    \ column number\");\n  }\n  if(!new_value) {\n    alert(\"Please enter a new value\"\
    );\n  }\n\n  // calculate the target cell\n  var target = ((row - 1) * 5) + col-1;\n\
    \n  // assign new value to the XML object element\n  obj.getElementsByTagName(\"\
    num\")[target].firstChild.data = new_value;\n  populate_cells(); // display revised\
    \ cell values\n  totalize(); // and calculate new totals\n\n  // finally reset\
    \ all cell form inputs...\n  window.document.getElementById(\"rownum\").options[0].selected=true;\n\
    \  window.document.getElementById(\"column\").options[0].selected=false;\n  window.document.getElementById(\"\
    new_value\").value=\"\"\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_185_0.png)\n\
    \n# Hot tip\n\nThe form has inputs called \"rownum\" and \"column\" together with\
    \ a text input called \"new value\"."
