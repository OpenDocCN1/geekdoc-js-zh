  md: "# Making a system timer\n\nWhen JavaScript code is needed to perform an action\
    \ repeatedly in a web browser, the system clock can be used with the JavaScript\
    \ setTimeout() method of the window object.\n\nThe window.setTimeout() method\
    \ can run a function after a specified interval. Two arguments are required, the\
    \ name of the function to call and the required interval time in milliseconds.\
    \ This method is often used at the end of a function to call the same function\
    \ recursively, setting a delay.\n\n> Hot tip\nThere is a slide-show script on\
    \ page 166 using this method.\n\nMany uses can be found for this method in creating\
    \ dynamic effects – for instance, in slide-show scripts where the function displays\
    \ successive images at given intervals.\n\nThe example here uses the window.setTimeout()\
    \ method to display an alert dialog box at 10-second intervals:\n\n```\n// create\
    \ and initialize a counter variable\nvar num = 0;\n\n// a recursive function to\
    \ display a message\nfunction timeout() {\n    num++;\n    // increment the counter\n\
    \    // display the message\n    alert(\"This is 10-Second Message No: \" + num);\n\
    \    // set interval before calling this function again\n    window.setTimeout(\"\
    timeout\", 10000);\n}\n\n// call the function to start the routine\ntimeout();\n\
    ```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_67_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_67_1.png)"
  merge: -1
