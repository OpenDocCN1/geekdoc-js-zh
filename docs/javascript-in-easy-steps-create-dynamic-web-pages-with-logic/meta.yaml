  md: "# # Toggling visibility\n\nThe style object has a visibility property that\
    \ can be used by JavaScript to determine whether the browser should display the\
    \ object or not. Assigning an object property value of `hidden` makes object invisible\
    \ while assigning a visibility property value of `visible` displays that object.\n\
    \nThis property is used in the following example to control the visibility of\
    \ two `<div>`. When the cursor is over either of the two faces in the image a\
    \ JavaScript function is called from an image map to display another element using\
    \ an appropriate speech bubble graphic. Both of these `<div>` elements are created\
    \ in the HTML code with their visibility style property set to `hidden` – so they\
    \ are not initially visible.\n\nPlacing the cursor over an active area of the\
    \ image map causes the mouseover event to call the `toggle()` function. The function\
    \ passes a string argument that is the id value of the element to be manipulated,\
    \ and a numeric value to determine whether that element should be visible. The\
    \ toggle() sets the visibility style of the appropriate object to “visible” if\
    \ the passed value is “1\"\n\nMoving the cursor over an active area of the image\
    \ map causes the mouseout event to call the `toggle()` function, again passing\
    \ a string identifier and a numeric value. The `toggle()` function sets the visibility\
    \ style of the appropriate object to “hidden” if the passed value is “0”.\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_163_0.png)\n\nAvoid creating adjacent\
    \ active areas – always leave a small gap to allow time for mouseevents to fire\
    \ before starting another mouseover event. The areas in this example cover the\
    \ face in the image.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_163_1.png)\n\n\
    popup-layers.html (image map)\n\n```\n<img src=\"couple.jpg\" usemap=\"#couple\"\
    \ />\n<map id=\"couple\" name=\"couple\">\n<area shape=\"rect\" coords=\"41.26.138,143\"\
    \nmouseover=\"toggle('sal', 1)\"\nonmouseout=\"toggle('sal', 0)\" />\n<area shape=\"\
    poly\" coords=\"244.69,208.132,202, \n185.227,205,298.171,318.110,247,65\"\nmouseover=\"\
    toggle('har', 1)\"\nonmouseout=\"toggle('har', 0)\" />\n</map>\n```"
  merge: -1
  pgno: 163
- img_proc: true
  md: "# ...cont'd\n\n```\n// a function to toggle visibility\nfunction toggle(str,\
    \ n)\n{\n  // a variable to store the object\n  var obj;\n  // get the appropriate\
    \ div layer by id\n  obj = window.document.getElementById(str);\n  // set the\
    \ layer's visibility status\n  obj.style.visibility = (n == 1) ? \"visible\" :\
    \ \"hidden\";\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_164_0.png)\n\
    \n> Don't forget\n\nMake the layers' z-index values different if the layers overlap.\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_164_1.png)\n\n> Hot tip\n\nThis type\
    \ of dynamic script can be used to great effect with navigation menu item rollovers."
  merge: -1
