  - "[PAGE 43]\n\n# While loops\n\nAnother kind of loop uses the JavaScript while\
    \ keyword followed by an expression to be evaluated for a boolean value.\n\nIf\
    \ the evaluation returns true then the code in the statement block will be executed.\
    \ After the code has executed the test expression will be evaluated again and\
    \ the loop will continue until the evaluation returns false.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_43_0.png)\n\
    \nThe statement block must feature code that will affect the test expression in\
    \ order to change the evaluation result to return false – otherwise an infinite\
    \ loop will be created.\n\nAn infinite loop will lock the script and crash the\
    \ browser.\n\nIt is important to note that if the test expression returns false\
    \ when it is first evaluated the code in the statement block is never executed.\n\
    \nThis example decrements a variable value on each iteration of the loop. The\
    \ counter increments until the evaluation returns false and it reaches 10 when\
    \ the loop ends.\n\n```\nvar i = 0; num = 50;\n// loop until the counter hits\
    \ 10\nwhile(i < 10 )\n{\n  num--;\n  i++;\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_43_1.png)\n\
    \nwhile.js\n\n// display the final counter and number values\nalert(\"Loop stopped\
    \ at \" + i + \"\\nnum is now \" + num);\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_43_2.png)"
  - "[PAGE 44]\n\n# The do-while loop\n\nThe JavaScript keyword is used to denote\
    \ the start of a do-while loop and is followed by a statement block containing\
    \ the code to be executed by the loop.\n\nThe statement code is followed by the\
    \ JavaScript while and an expression to be evaluated for a boolean value of true\
    \ or false.\n\nIf the evaluation returns true the loop restarts at the do keyword\
    \ and will continue until the evaluation returns false.\n\nIt is important to\
    \ note that, unlike with the simple while loop, the statement code will always\
    \ be executed at least once by the do-while loop because the test expression is\
    \ not encountered until the end of the loop.\n\nThe following example will never\
    \ loop because the counter value is incremented to 1 in the first execution of\
    \ the statement code so the first test evaluation will return false:\n\n```\n\
    var i = 0, num = 50;\n\n// loop until the counter hits 1\ndo {\n\n num--;\n i++;\n\
    } while (i < 1);\n```\n\n// display the final counter and number values\nalert(\"\
    Loop stopped at \" + i + \"\\nnum is now \" + num);\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_44_0.png)\n\
    \n> Hot tip\n\nA while loop is often more suitable than a do-while loop.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_44_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_44_2.png)"
  - "[PAGE 45]\n\n# Break statement\n\nThe JavaScript break keyword is used to terminate\
    \ the execution of a loop prematurely.\n\nThe break keyword is situated inside\
    \ the statement block containing the code that the loop should execute and is\
    \ preceded by a conditional test.\n\nWhen the test condition is met the break\
    \ statement immediately terminates the loop and no further iterations are made.\n\
    \nNotice in the alert() output below that the counter value is still 3 because\
    \ the increment in the final iteration is not applied.\n\nIn the following example\
    \ the conditional test will return true when the counter value reaches 3:\n\n\
    ```\nvar i = 0;\n// loop until the counter hits 6\nwhile(i < 6 )\n{\n  if( i ==\
    \ 3 ) break;\n  i++;\n}\n\n// display the final counter value\nalert(\"BREAK\\\
    n\\nLoop stopped at \" + i);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_45_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_45_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_45_2.png)"
  - "[PAGE 46]\n\n# Continue statement\n\nThe JavaScript continue keyword is used\
    \ to break the current iteration of a loop.\n\nJust like the break keyword, the\
    \ continue keyword is situated inside the statement block containing the code\
    \ that the loop should execute, preceded by a conditional test.\n\nWhen the continue\
    \ condition is met the continue keyword immediately stops the current iteration\
    \ of the loop, but further iterations will be made until the loop ends.\n\nIn\
    \ the example below the test condition is met when the counter value reaches three\
    \ so the string concatenation in iteration is not applied but the loop continues\
    \ on:\n\n```\nvar i = 0, str = \"\"\\n// loop until the counter hits 5\nwhile(i\
    \ < 5)\n  i++;\n  if(i == 3)continue;\n  str += i + \" \";\n```\n\n// display\
    \ final value and all series numbers\\nalert(\"CONTINUE\\n\\nLoop stopped:\" +\
    \ i + \"\\n\\nSeries:\" + str);\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_46_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_46_1.png)\n\nThe loop counter should\
    \ be incremented before the continue condition is tested to avoid creating an\
    \ infinite loop."
- md: "\n# Summary\n\n- An if statement evaluates a test expression and executes the\
    \ statements within its code block when the result is true\n- The JavaScript prompt()\
    \ function launches a prompt dialog inputting from the user\n- The else keyword\
    \ allows alternative statements to be executed when an if statement evaluates\
    \ a test expression as false\n- Each switch statement evaluates a single expression\
    \ and seeks a label matching its result – statements associated with the matching\
    \ case label are then executed, or default statements executed if there is no\
    \ match\n- Each loop begins with an initializer, a test expression, and an incrementer\
    \ or decrementar\n- Any loop will continue iterating until the test expression\
    \ becomes false – the loop then ends\n- A for-in loop is useful to enumerate all\
    \ properties within an object\n- The statement block in a while loop must contain\
    \ an incrementer or decrementar to avoid being an infinite loop\n- A while loop\
    \ may not execute a single iteration if the test expression at the beginning is\
    \ found to be false\n- A do-while loop will always execute its statements once\
    \ because the test expression follows the statement block\n- The break keyword\
    \ can be used to terminate a loop when a test expression is true\n- The continue\
    \ keyword can be used to end the current iteration of a loop when a test expression\
    \ is true – allowing the loop to execute the next iteration\n\n# 4 Using arrays\n\
    \nThis chapter deals exclusively with the topic of arrays.\nIt illustrates by\
    \ example how to store and retrieve data in arrays and how to manipulate their\
    \ elements.\n\n- 48 Creating an array\n- 50 Looping to fill elements\n- 51 Adding\
    \ more elements\n- 52 Joining elements together\n- 53 Reversing element order\n\
    - 54 Slicing elements into pieces\n- 55 Sorting elements sequentially\n- 56 Summary\n\
    \n## Creating an array\n\nAn array is like a variable that can contain multiple\
    \ values – unlike a regular variable that may only contain a single value.\n\n\
    A variable is given array status using the JavaScript keyword along with the JavaScript\
    \ Array() constructor function.\n\nMultiple data can be assigned to the array\
    \ using the array name together with an index number, starting at zero, placed\
    \ inside square brackets, as in this example:\n\n```javascript\n// create a new\
    \ array\nvar a = new Array();\n\n// assign values to the first three array elements\n\
    a[0] = \"First\";\na[1] = \"JavaScript\";\na[2] = \"Array\";\n```\n\nThe array\
    \ values can now be used just like regular variables.\n\nFor small arrays it is\
    \ often more convenient to initialize the array values as arguments in the Array()\
    \ constructor. This is illustrated in the example below, which creates three arrays:\n\
    \n```javascript\n// create and initialize three arrays\nvar a = new Array(\"Jan\"\
    , \"Feb\", \"Mar\");\nvar b = new Array(\"21\", \"22\", \"23\");\nvar c = new\
    \ Array(\"2006\", \"2007\", \"2008\");\n\n// concatenate and display an element\
    \ from each array\nalert(a[0] + b[1] + c[2]);\n```\n\nEach value held in an array\
    \ is called an array element.\n\nWhen a variable is given array status using the\
    \ new Array() constructor it also gets properties and methods that can be used\
    \ to manipulate the elements contained in the array.\n\nOne of the most useful\
    \ of these is the length property that may be used to report the number of elements\
    \ in the array currently contains.\n\nThe syntax to a property or method just\
    \ takes a period and the name onto the object. Array.length references the length\
    \ property of the array object.\n\nNotice that an array containing three values\
    \ will have a length of 3, but because indexing starts at zero the last element\
    \ in the array will have an index number of only 2.\n\nThe example below demonstrates\
    \ this point:\n\n```javascript\n// create a new array\nvar a = new Array();\n\
    a[0] = \"JAVASCRIPT \";\na[1] = \"ARRAY \";\na[2] = \"LENGTH\";\n\n// get the\
    \ array length\nvar arraysize = a.length;\n\n// display each array element and\
    \ the array length\nalert(a[0] + a[1] + a[2] + \n  \"\\nNo.of elements is \" +\
    \ arraysize );\n```\n\n## Looping to fill elements\n\nAll types of loops can be\
    \ used to easily fill the elements of an array with a large number of data values.\
    \ This is one of the major attractions of arrays and it is achieved with very\
    \ little code.\n\nThe example below first creates an array and then, on each iteration,\
    \ the for loop fills each of the array elements with a string value which is added\
    \ the current counter. Each element is concatenated in the variable named str\
    \ before finally being displayed in the alert() box:\n\n```javascript\nvar str\
    \ = \"FILL ELEMENTS\\n\";\n// create a new array\nvar arr = new Array();\n\n//\
    \ fill five elements\nfor(var i = 0; i < 5; i++) {\n  arr[i] = \"Number is \"\
    \ + i + \"\\n\";\n  str += arr[i];\n}\n\n// display the value stored in each array\n\
    alert(str);\n```\n\n> Hot tip This code could just be used to fill 100 elements\
    \ by making the value of 5 into 100.\n\n## Adding more elements\n\nAdditional\
    \ elements can be added to an array without specifying an actual index number\
    \ by using the Array.length property to find the next empty element. Because the\
    \ Array.length value exceeds the last index by 1 it will always specify the next\
    \ free element when it is used as the index number between the square brackets.\n\
    \nThe example below illustrates this when assigning the integer 4 to the next\
    \ free element in the array. The b array elements are initialized; then the for\
    \ loop assigns each b array value to each free element in the array. Finally all\
    \ array elements are displayed by the alert() function:\n\n```javascript\nvar\
    \ a = new Array(1, 2, 3);\n\n// insert an integer into the next empty element\n\
    a[a.length] = 4; // a.length is 3\n\nvar b = new Array(5, 6, 7);\n\n// copy each\
    \ b element value into the empty a\nfor(var i = 0; i < b.length; i++) {\n  a[a.length]\
    \ = b[i];\n}\n\n// display all a element values\nalert(a);\n```\n\n## Joining\
    \ elements together\n\nThe JavaScript Array.join() method will convert all array\
    \ elements to strings and concatenate them. Used without arguments this will return\
    \ a list of all the element values separated by commas, as in the example on previous\
    \ page.\n\nBut the Array.join() method can accept an optional argument to specify\
    \ an alternative separator to the default comma separator. Usefully this can be\
    \ a space so that the result of the Array.join() method will be a single string\
    \ with space separators, as illustrated in the example below:\n\n```javascript\n\
    var a = new Array();\n\n// put a word in seven array elements\na[0] = \"It\";\n\
    a[1] = \"isn't\";\na[2] = \"rocket\";\na[3] = \"science -\";\na[4] = \"it's\"\
    ;\na[5] = \"just\";\na[6] = \"JavaScript\";\n\n// display all words in the array\n\
    // - separated by a space\nalert(a.join(\" \"));\n```\n\n## Reversing element\
    \ order\n\nArrays can be used to contain a file name or a complete URL in each\
    \ element for dynamic features in web pages. One such popular use is with JavaScript\
    \ slide shows that rotate a series of images with a specified interval between\
    \ each one.\n\nAn array is used to hold the URL of each image in its elements\
    \ so that the script can easily reference them by array index.\n\nIf the slide\
    \ show is required to reverse after displaying the final image, rather than start\
    \ over at the first image, this can be achieved by reversing the element order\
    \ inside the array.\n\nThe following example creates an initial array of three\
    \ images whose order will be reversed after the final image is displayed and the\
    \ rev variable is set to true:\n\n```javascript\n// create a new array of image\
    \ URLs\nvar imgs = new Array(\"img1.gif\",\"img2.gif\",\"img3.gif\");\n\n// create\
    \ a control variable\nvar rev = false;\n\n// when the slide show displays the\
    \ final image\nrev = true;\n\nif( rev == true ) {\n  imgs.reverse();\n}\n\n//\
    \ display the reversed element order\nalert(imgs.join(\" - \"));\n```\n\n> Hot\
    \ tip A complete slide show script is given on pages 166-167.\n\n> Hot tip The\
    \ evaluation (rev == true) can be abbreviated to a simple (rev).\n"
  mdcn: "\n\n# 摘要\n\n- `if` 语句评估一个测试表达式，并在结果为真时执行其代码块中的语句。\n- JavaScript `prompt()`\
    \ 函数会启动一个提示对话框以获取用户输入。\n- `else` 关键字允许在 `if` 语句评估测试表达式为假时执行备选语句。\n- 每个 `switch`\
    \ 语句评估单个表达式并寻找与其结果匹配的标签——随后执行与匹配的 `case` 标签关联的语句；如果没有匹配，则执行 `default` 语句。\n- 每个循环都从初始化器、测试表达式以及一个递增器或递减器开始。\n\
    - 任何循环都会持续迭代，直到测试表达式变为为假——此时循环结束。\n- `for-in` 循环用于枚举对象中的所有属性。\n- `while` 循环中的语句块必须包含一个递增器或递减器，以避免死循环。\n\
    - 如果开始时的测试表达式为假，则 `while` 循环可能不会执行迭代。\n- `do-while` 循环将始终执行一次语句，因为测试表达式位于语句块之后。\n\
    - `break` 关键字可用于在测试表达式为真时终止循环。\n- `continue` 关键字可用于在测试表达式为真时结束循环的当前迭代——允许循环执行下次迭代。\n\
    \n# 4 使用数组\n\n本章专门讨论数组主题。\n它通过示例说明了如何在数组中存储和检索数据，以及如何操作它们的元素。\n\n- 48 创建数组\n-\
    \ 50  使用循环填充元素\n- 51 添加更多元素\n- 52 合并元素\n- 53 反转元素顺序\n- 54 将元素切分为切片\n- 55 按顺序排序元素\n\
    - 56 总结\n\n## 创建数组\n\n数组就像一个可以包含多个值的变量——这与可能只包含单个值的普通变量不同。\n\n使用 JavaScript 关键字配合\
    \ JavaScript `Array()` 构造函数可以为变量赋予数组状态。\n\n可以使用数组名称配合从零开始的索引号（放在方括号 `[]` 中）向数组分配多个数据数据，如下例所示：\n\
    \n```javascript\n// 创建一个新数组\nvar a = new Array();\n\n// 给数组的前三个元素赋值\na[0] = \"\
    First\";\na[1] = \"JavaScript\";\na[2] = \"Array\";\n```\n\n现在可以像普通变量一样使用数组值。\n\
    \n对于小型数组，在 `Array()` 构造函数中作为参数初始化数组值通常更方便。下面的示例说明了，它创建了三个数组：\n\n```javascript\n\
    // 创建并初始化三个数组\nvar a = new Array(\"Jan\", \"Feb\", \"Mar\");\nvar b = new Array(\"\
    21\", \"22\", \"23\");\nvar c = new Array(\"2006\", \"2007\", \"2008\");\n\n//\
    \ 合并并显示每个数组中的一个元素\nalert(a[0] + b[1] + c[2]);\n```\n\n数组中提供的每个值被称为数组元素。\n\n当使用\
    \ `new Array()` 构造函数为变量赋予数组状态时，它还会获得可以用于操作数组所包含元素的属性和方法。\n\n其中最有用的属性之一是 `length`\
    \ 属性，它可以报告数组当前包含的元素数量。\n\n属性或方法的语法仅需在对象后加上一个句号 `.` 和名称。`Array.length` 引用数组对象的\
    \ `length` 属性。\n\n注意，包含三个值的数组其长度为 3，但由于索引从零开始，数组中的最后一个元素的索引号仅为 2。\n\n下面的示例演示了这一点：\n\
    \n```javascript\n// 创建一个新数组\nvar a = new Array();\na[0] = \"JAVASCRIPT \";\na[1]\
    \ = \"ARRAY \";\na[2] = \"LENGTH\";\n\n// 获取数组长度\nvar arraysize = a.length;\n\n\
    // 显示每个数组元素和数组长度\nalert(a[0] + a[1] + a[2] + \n  \"\\nNo.of elements is \" + arraysize\
    \ );\n```\n\n## 使用循环填充元素\n\n所有类型的循环都可以轻松地用大量数据值填充数组元素。这是数组的主要吸引力之一，而且只需极少的代码即可实现。\n\
    \n下面的示例首先创建一个数组，然后在每次迭代中，`for` 循环将每个数组元素填充为一个带有当前计数器的字符串值，该值会被累加到变量中。每个元素在名为 `str`\
    \ 的变量中进行拼接，最后在 `alert()` 框中显示：\n\n```javascript\nvar str = \"FILL ELEMENTS\\n\"\
    ;\n// 创建一个新数组\nvar arr = new Array();\n\n// 填充五个元素\nfor(var i = 0; i < 5; i++)\
    \ {\n  arr[i] = \"Number is \" + i + \"\\n\";\n  str += arr[i];\n}\n\n// 显示存储在每个数组中的值\n\
    alert(str);\n```\n\n> 小提示 通过将 5 的值改为 100，这段代码就可以用于填充 100 个元素。\n\n## 添加更多元素\n\n\
    可以使用 `Array.length` 属性找到下一个空元素，在不指定实际索引号的情况下向数组添加额外元素。由于 `Array.length` 值比最后一个索引大\
    \ 1，当它被用作方括号内的索引号时，它始终指向下一个空闲元素。\n\n下面的示例说明了将整数 4 分配给数组中下一个空元素的情况。数组 `b` 已初始化；然后\
    \ `for` 循环将每个 `b` 数组值分配给数组中的每个空元素。最后，通过 `alert()` 函数显示所有数组元素：\n\n```javascript\n\
    var a = new Array(1, 2, 3);\n\n// 将 4 赋值到数组的下一个空元素中\n\n// a.length 是 3\na[a.length]\
    \ = 4;\n\nvar b = new Array(5, 6, 7);\n\n// 将每个 b 元素复制到空 a 中\nfor(var i = 0; i\
    \ < b.length; i++) {\n  a[a.length] = b[i];\n}\n\n// 显示所有 a 元素\nalert(a);\n```\n\
    \n## 合并元素\n\nJavaScript `join()` 方法将所有数组元素转换为字符串并将它们拼接。如果不带参数，它将返回由逗号分隔的元素值（见首页）。\n\
    \n但 `join()` 方法可以接受一个可选参数作为默认逗号分隔符的替代方案。通常这是一个空格，这样 `join()` 方法的结果将是用空格分隔的字符串，如下例所示：\n\
    \n```javascript\nvar a = new Array();\n\n// 在七个数组元素放入单词\na[0] = \"It\";\na[1]\
    \ = \"isn't\";\na[2] = \"rocket\";\na[3] = \"science -\";\na[4] = \"it's\";\n\
    a[5] = \"just\";\na[6] = \"JavaScript\";\n\n// 显示数组中的所有单词\n// - 用空格分隔\nalert(a.join(\"\
    \ \"));\n```\n\n## 反转元素顺序\n\n数组可以在其每个元素中包含文件名或完整的 URL，用于网页的动态功能。其中一种流行的用法是 JavaScript\
    \ 轮灯片，它在每个图像之间指定的间隔旋转一系列图像。\n\n数组用于存储每个图像的 URL，以便脚本可以通过数组索引轻松引用它们。\n\n如果轮灯片在显示最后一张图像后反转，而不是从第一张开始，可以通过反转数组内部元素顺序来实现。\n\
    \n下面的示例创建了一个三个图像的初始数组，当显示最后图像且 `rev` 变量设置为真时，其顺序将被反转：\n\n```javascript\n// 创建一个图像\
    \ URL 新数组\nvar imgs = new Array(\"img1.gif\",\"img2.gif\",\"img3.gif\");\n\n//\
    \ 创建一个控制变量\nvar rev = false;\n\n// 当轮灯片显示最后图像时\nrev = true;\n\nif( rev == true\
    \ ) {\n  imgs.reverse();\n}\n\n// 显示反转后的元素顺序\nalert(imgs.join(\" - \"));\n```\n\
    \n"
