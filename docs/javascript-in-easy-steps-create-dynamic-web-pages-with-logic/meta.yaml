  md: "# Function arguments\n\nThe parentheses ( ) that follow the names of all functions\
    \ may be used to contain data for use in the code to be executed, just as the\
    \ parentheses of the JavaScript alert() function contain the string to be displayed\
    \ in the alert dialog box it creates.\n\nThe data contained within the parentheses\
    \ is known as the function's \"argument\".\n\nIn the example below the function\
    \ call passes a text string to the argument named str in the call_alert() function\
    \ for use in the code that is to be executed:\n\n```\n// a function to display\
    \ the value of a passed\n// argument\nfunction call_alert( str )\n{\n  alert(\
    \ str);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_19_0.png)\n\nIt is\
    \ important to note that the string contained inside the call to this function\
    \ is enclosed in single quotes to differentiate it from the double quotes used\
    \ to contain the entire call:\n\n```\n<body onload = \"call_alert('Passed Value')\"\
    >\n```\n\nUsing double quotes for both would mean that the onload attribute value\
    \ would be \"call_alert\" because the string is terminated by the second double\
    \ quote. This would create a browser error and the function would not be executed.\n\
    \nThe use of single and double quotes in this manner appears throughout JavaScript\
    \ programming in several ways.\n\n> Hot tip\nstr is often used in JavaScript as\
    \ a variable name for strings.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_19_1.png)"
