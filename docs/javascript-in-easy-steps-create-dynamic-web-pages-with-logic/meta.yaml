  md: '# Scrolling and moving


    within a document can be adjusted with the JavaScript window.scrollBy() and window.scrollTo()
    methods. Each needs two numeric arguments stating how many pixels to shift along
    the X and Y axes. Similarly the window position can be adjusted on the screen
    with the window.moveTo() and window.moveTo() methods, which also require two arguments
    for X and Y coordinates. The example below calls the window.scrollBy() method
    to shift 100 pixels along the X axis when the user pushes a button:


    ```

    <input type="button" value="Scroll" onclick="window.scrollBy(100,0)">

    ```


