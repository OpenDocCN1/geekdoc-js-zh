  md: "# Polling radio buttons\n\nA group of radio buttons that will only allow one\
    \ of the group to be checked at any time should all have the same name assigned\
    \ to their name attribute in the HTML <input> tag.\n\nIn the browser DOM the radio-button\
    \ creates a window.document.forms object with that given name.\n\nThis object\
    \ contains an array of the radio buttons in the group, indexed in the order in\
    \ which they appear in the HTML code.\n\nJavaScript can address each radio button\
    \ using the array name and index number. In the example below a JavaScript explores\
    \ the checked property of each radio button named \"rad\" to discover which one\
    \ is checked. The value of that button's HTML value attribute is then assigned\
    \ to set the document's background color:\n\n```\nfunction radio_poll() {\nfor(\
    \ var i = 0; i < window.document.forms.f.rad.length; i++) {\n    if( window.document.forms.f.rad[i].checked\
    \ ) {\n      window.document.body.style.background = window.document.forms.f.rad[i].value;\n\
    \    }\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_147_0.png)\n\nJavaScript\
    \ if(checked). is shorthand for if(checked=true)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_147_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_147_2.png)\n\nHere the form background\
    \ remains orange but the surrounding document background changes to the checked\
    \ color.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_147_3.png)"
  merge: -1
  pgno: 147
