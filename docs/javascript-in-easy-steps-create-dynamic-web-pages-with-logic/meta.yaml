- img_proc: true
  md: "# # If-else statement\n\nThe JavaScript else keyword can be used with an if\
    \ statement to provide alternative code to execute, in the event that the test\
    \ expression returns false.\n\nThis is known as conditional branching and it has\
    \ this syntax:\n\n```\nif (test expression) do-this : else do-this :\n```\n\n\
    Several expressions may be tested until a true value is found, when the code following\
    \ the true expression will be executed. It is important to note that any further\
    \ code contained in the if-else statement is ignored.\n\nSo in the following example\
    \ any code after the call to the alert() function by the third test will be ignored:\n\
    \n```\nvar num = 2, bool = false;\n// is the number 1 and the boolean value true\n\
    if(num == 1 && bool == 1)\n  alert(\"TEST1: \" + bool);\nelse\n// is the number\
    \ 2 and the boolean value true\nif(num == 2 && bool == 1)\n  alert(\"TEST2: \"\
    \ + bool);\nelse\n// is the number 2 and the boolean value false\nif(num == 2\
    \ && bool == 0)\n  alert(\"TEST3: \" + bool);\nelse\n// is the number 3 and the\
    \ boolean value false\nif(num == 3 && bool == 0)\n  alert(\"TEST4: \" + bool);\n\
    ```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_39_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_39_1.png)\n\
    \nBoolean values in JavaScript can also be represented numerically as 1 (true)\
    \ and 0 (false).\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_39_2.png)"
  merge: -1
  pgno: 39
- img_proc: true
  md: "# Switch statement\n\nConditional branching using the if-else statement may\
    \ be efficiently performed using a switch statement when a test expression evaluates\
    \ the value of just one variable.\n\nThe switch statement works in an unusual\
    \ way – first it evaluates a given expression, and then it seeks a label to match\
    \ the resulting value. The code associated with the matching label will be executed\
    \ or, if no match is found, the statement will execute any default code.\n\nThe\
    \ JavaScript case keyword is used to denote a label and the default keyword denotes\
    \ the code. All label code must be terminated by a break statement using the break\
    \ keyword.\n\nThe labels may be numbers, strings or booleans but must be all of\
    \ the same type, as in this example they are all numbers:\n\n```\nvar num = 2;\n\
    witch(num)\n{\n  // is the number 1 ?\n  case 1 : alert(\"This is case 1 code\"\
    ); break;\n\n  // is the number 2 ?\n  case 2 : alert(\"This is case 2 code\"\
    ); break;\n\n  // is the number 3 ?\n  case 3 : alert(\"This is case 3 code\"\
    ); break;\n\n  // if it is none of those numbers, do this...\n  default : alert(\"\
    This is default code\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_40_0.png)\n\
    \nFor more detail on the break statement see page 44.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_40_1.png)\n\
    \nswitch.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_40_2.png)\n\nOmitting\
    \ the break keywords at the ends of the cases will allow execution of all other\
    \ code in the switch statement.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_40_3.png)"
  merge: -1
  pgno: 40
- img_proc: true
  md: "# For loops\n\nThe for loop is probably the most frequently used type of loop\
    \ in JavaScript and has this syntax:\n\n```\nfor ( initializer , test , increment\
    \ ) statement/ :\n```\n\nThe initializer is used to set the start value for the\
    \ counter of the number of loop iterations. A variable may be declared here for\
    \ this purpose and it is traditional to name it i.\n\nAt each pass of the loop\
    \ a boolean condition is tested and the next iteration of the loop will only run\
    \ if the condition is true. If the test returns false then the loop will end.\n\
    \nWith every iteration the counter is incremented and then the loop will execute\
    \ the code in the statement. Multiple statements can be executed if they are contained\
    \ by curly braces in a statement block.\n\nThe following example makes five iterations\
    \ and changes the assigned values of two variables at each pass:\n\n```\nvar a\
    \ = 0, b = 0;\n// initialize counter at 0; then loop until it hits 5\nfor (var\
    \ i = 0; i < 5; i++) {\n  // increment variable values on each iteration\n  a\
    \ += 10; b += 5;\n}\n\n// display the final values after the loop ends...\nalert(\"\
    FOR LOOP\\n A is \" + a + \"... B is \" + b);\",\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_41_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_41_1.png)\n\nA for loop can also count\
    \ down decrementing the counter at each iteration.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_41_2.png)"
  merge: -1
  pgno: 41
