    # Summary


    - Use the JavaScript new keyword together with the intrinsic Date() constructor
    to create a Date object


    - Each Date object has special methods getDate(), getUTCDate(), getMonth(), and
    getYear(), which return numerical values representing individual calendar components
    of date


    - Each Date object has special methods getHours(), getMinutes(), getSeconds(),
    and getMilliseconds(), which return individual time components of date


    - The combined time part of a Date object can be retrieved using the special getTime()
    method


    - Subtract one combined time from another to discover the difference between two
    times


    - The Date object''s getHours() method returns local time but the getUTCHours()
    method returns Universal Time at GMT


    - Comparing local system time with Universal Time, using the Date object''s getTimezoneOffset()
    method, reveals the user''s time zone


    - The components can be set in a date object using setDate(), setMonth(), setHours(),
    setMinutes(), setSeconds() and setFullYear() methods


    - Information in a Date object can be converted to a string type using the toString()
    method — it can be converted to a string in Universal Time using the toGMTString()
    method


    - The window.setTimeout() method creates a timer and requires two arguments stating
    the name of a function to call and the interval at which it should be called


    - A timer can be stopped by using the window.clearTimeout() method


    ## 6 Doing mathematics


    This chapter is devoted to the JavaScript Math object and describes the constant
    values and methods that are available.


    - 70 Math constants

    - 72 Math methods

    - 73 Comparing numbers

    - 74 Rounding floats

    - 76 Generating random numbers

    - 78 Summary


    ## Math constants


    The intrinsic JavaScript object contains a number of standard mathematical constant
    values for easy reference.


    Upper case is always used to refer to the constant values, which are all listed
    in the following table:


    | Math.E | Description |

    | Math.E | The constant e, base of the natural logarithm, with a value of approximately
    2.71828 |

    | Math.LN2 | The natural logarithm of 2, approximately 0.6931471805994528623 |

    | Math.LN10 | The natural logarithm of 10, approximately 2.302585092994049011
    |

    | Math.LOG2E | The base-2 logarithm of e, approximately 1.442695040888963387 |

    | Math.LOG10E | The base-10 logarithm of e, approximately 0.4342944819032518677
    |

    | Math.PI | The constant pi, approximately 3.14159265358979 |

    | Math.SQRT1_2 | The reciprocal of the square root of 2, approximately 0.707106781186547
    |

    | Math.SQRT2 | The square root of 2, approximately 1.414213562373095 |


    The Math constants can be used anywhere within a script.


    Most of the Math constants are used only in JavaScript applications that have
    a particular mathematical purpose but the list is given above for completeness.


    The Math.PI constant is used in the example opposite to calculate the circumference
    and area of a circle from a given radius.


    ```javascript

    // request the user enter a radius size

    var rad = prompt("Please enter radius size...");

    // calculate the circle area using πr2

    var area = Math.PI * (rad * rad);


    // calculate the circumference using 2πr

    var circ = 2 * (Math.PI * rad);


    // display the results

    alert("Area: " + area + "\nCircumference: " + circ);

    ```


    ## Math methods


    The JavaScript Math object has many methods. All of them are listed in the table
    below:


    | Method | Description |

    | :--- | :--- |

    | Math.abs() | return an absolute value |

    | Math.acos() | return an arc cosine |

    | Math.asin() | return an arc sine |

    | Math.atan() | return an arc tangent |

    | Math.atan2() | return angle from an X-axis position |

    | Math.ceil() | round a number up |

    | Math.cos() | return a cosine value |

    | Math.exp() | return an exponent of constant |

    | Math.floor() | round a natural logarithm |

    | Math.log() | return a natural logarithm |

    | Math.max() | return the larger of two numbers |

    | Math.min() | return the smaller of two numbers |

    | Math.pow() | return the power value |

    | Math.random() | return a random number |

    | Math.round() | round to the nearest integer |

    | Math.sin() | return a sine value |

    | Math.sqrt() | return the square root |

    | Math.tan() | return a tangent value |


    The Math methods most commonly used from above list are examined in more detail
    on the following pages.


    ## Comparing numbers


    The Math object has two methods that allow comparison of two numbers and return
    the higher or lower value.


    Math.max() accepts the two values for comparison and will return the higher of
    the two.


    Math.min() method works in the same way but returns the lower of the given values.


    In the example the Math.pow() method is used to create square and cube values
    that are then compared with Math.max() and Math.min(). The Math.pow() method requires
    two arguments to specify the number and the power by which raise that:


    ```javascript

    var sq = Math.pow(5, 2);

    var cb = Math.pow(3, 3);

    var hi = "Largest positive : " + Math.max(sq, cb);

    var lo = "Smallest positive : " + Math.min(sq, cb);

    var ng = "Largest negative : " + Math.max(-5, -4.75);

    alert("MAX\n" + hi + "\n" + lo + "\n" + ng);

    ```


    ## Rounding floats


    The Math.round() method in JavaScript is useful both to round floating-point numbers
    to the nearest integer and to round floating-point numbers to shorter versions.
    Commonly this will be used to reduce a long floating-point number to two decimal
    places.


    If the floating-point value given is exactly halfway between two integers the
    method will round up to the nearest integer. The example below illustrates the
    way that the Math.round() method handles rounding of positive and negative halfway
    values and shows how it may be used to round a long floating-point number to just
    two places:


    ```javascript

    var a = 7.5;

    a = Math.round(a);

    a = "Rounded Positive : " + a + "\n";


    var b = -7.5;

    b = Math.round(b);

    b = "Rounded Negative : " + b + "\n";


    var c = 3.76438467915;

    c = c * 100; // take it up two places

    c = Math.round(c); // do the round

    c /= 100; // take it back to 2 places

    c = "Rounded Long Float : " + c;

    alert(a + b + c);

    ```


    > Beware Rounding -7.5 does not give the result -8.0 because that would be a higher
    negative number, and so would be rounding down.


    As an alternative to using the Math.round() method detailed on the previous page
    script may require that the float be selectively forced to the nearest integer,
    above or below.


    JavaScript provides the Math.ceil() method to force rounding up to the nearest
    integer and the Math.floor() method to round down to the nearest integer. The
    example below illustrates both methods in action with positive and negative values:


    ```javascript

    var a = 7.5;

    var a1 = "a1: " + Math.ceil(a);

    var a2 = "a2: " + Math.floor(a);

    var b = -7.5;

    var b1 = "b1: " + Math.ceil(b);

    var b2 = "b2: " + Math.floor(b);

    var rup = "ROUNDING UP\n" + a1 + "\n" + b1 + "\n\n";

    var rdn = "ROUNDING DOWN\n" + a2 + "\n" + b2;

    alert(rup + rdn);

    ```


    Rounding up of negative values returns the nearest integer towards zero.


    ## Generating random numbers


    Random numbers can be generated using the Math.random() method to return a floating-point
    value between 0.0 and 1.0. This method can be used to create a series of random
    number selections, like a lottery draw, and is popular for producing random effects
    within web pages.


    Multiplying the random number will specify a wider range so, for example, a multiplier
    of 10 will create a random number between 0.0 and 10.0.


    To make the randomly generated number more useful it is generally best to round
    the returned float so that the range will become integer values. The Math.ceil()
    method will be used to round the number up to an integer between 1 and 10. The
    code below illustrates this technique:


    ```javascript

    // get a random number from 0.0 to 1.0

    var rand1 = Math.random();

    // multiply by 10 to make it between 0.0 and 10.0

    var rand2 = rand1 * 10;

    // round it up to make it between 1 and 10

    var rand3 = Math.ceil(rand2);

    ```


    ```javascript

    // add each part to a string

    var str = "Random float [rand1]: " + rand1 + "\n";

    str += "Specify range [rand2]: " + rand2 + "\n";

    str += "Random integer [rand3]: " + rand3;

    ```


    ```javascript

    // display the string

    alert(str);

    ```


