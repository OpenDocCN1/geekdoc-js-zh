  md: '# Comparison operators


    The operators that are commonly used in JavaScript to compare two values are all
    listed in the table below:


    | Operator | Operation |

    | --- | --- |

    | == | Equality |

    | != | Inequality |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    The == equality operator compares two operands and will return true if they are
    equal in value. If both are the same number they are equal, and if both are strings
    containing the same characters in the same positions they are equal. Boolean operands
    that are both true, or both false, are equal.


    Conversely, the != operator returns true if two operands are not equal using the
    same rules as the ==.


    Equality and inequality operators are useful in testing the state of two variables
    to perform conditional branching.


    The > greater than operator compares two operands and will return true if the
    first is greater in value than the second.


    The < less than operator makes the same comparison but will return true if the
    first operand is less in value than the second.


    Adding the = character after a > greater operator or a < less operator makes it
    also return true if the two operands are exactly equal in value.


    The > greater than operator is frequently used to test the value of a countdown
    variable in a loop.'
  merge: -1
