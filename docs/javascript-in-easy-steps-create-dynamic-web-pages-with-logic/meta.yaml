  - "[PAGE 158]\n\n...cont'd\n\nUnderstanding the hierarchical DOM arrangement of\
    \ page components makes it easy to address their properties in JavaScript. The\
    \ function below changes three properties in form \"f\". Its first statement addresses\
    \ the first element in the form (a \\<select&gt;) using index numbers - and selects\
    \ its second option. The second statement uses id values to address the form's\
    \ checkbox \"box\" - and checks it. Both statements address the elements hierarchically\
    \ but the final statement uses getElementById() method of the document object\
    \ instead of address text field \"txt\" directly - and insert a text string.\n\
    \n> Don't forget\nThe first and final statements are line-wrapped here because\
    \ of space limitations - they are single unbroken lines in the actual script.\n\
