    \  for(var i=1; i<4; i++) {\n    // if the checkbox is checked, add its value\n\
    \    if(eval(\"document.forms.chk\"\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_148_0.png)\n\
    \ncheckbox-poll.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_148_1.png)\n\n\
    > Hot tip Use the eval() function to combine form property names and numbers."
