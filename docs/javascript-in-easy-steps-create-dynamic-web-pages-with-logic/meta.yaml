  md: "# Assigning text values\n\nThe text displayed in an HTML <input> is easily\
    \ changed by JavaScript simply by assigning a new string to the value property\
    \ of that element.\n\nHistorically, text boxes were restricted to displaying text\
    \ in just one fixed font, but modern browsers allow a choice of font, size and\
    \ color.\n\nThe example below displays a string in a text box and adds style characteristics\
    \ for font, foreground-color and background-color:\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_145_0.png)\n\
    \n```\n// a function to set the text in a form text field\nfunction set_text()\
    \ {\n  // for text field txtl in form f\n  with(window.document.forms.f.txtl)\
    \ {\n    // set the text value\n    value = \"JavaScript in easy steps\";\n  \
