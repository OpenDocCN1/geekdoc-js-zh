    \ `Date.set()` 方法对日期信息应用新值：\n\n```javascript\n// 创建一个新的 Date 对象\nvar now = new\
    \ Date();\n\n// 存储原始日期和时间\nvar orig = \"Original \" + now.toString()+\".\\n\"\n\
    \n// 设置新的日期和时间细节\nnow.setDate(21);\nnow.setMonth(11);\nnow.setHours(12);\nnow.setMinutes(30);\n\
