  md: '# Responding to clicks


    The most common interactive event is the Click event, created when a user presses
    the left mouse button on a web page to activate its onclick-handler — typically
    an HTML form button. An onclick event-handler is often assigned in the button''s
    HTML <input> type to onclick attribute, like this:


    ```

    <input type = "button" value = "Do Click"

    onclick = "dbl_click(''Button Pressed") />

    ```


    Similarly, the DblClick event occurs when the user double-clicks the left mouse
    button to activate the ondblclick event-handler.


    This example specifies an event-handler to "listen" for the DblClick event in
    the window and a function to handle a button''s component event.


    ```

    // specify a DBLCLICK event-handler

    window.ondblclick=do_dblclick;


    // a function to react to a button CLICK event

    function do_click(str)

    { alert(str);


    // a function to react to the DBLCLICK event

    function do_dblclick()

    { alert("Double Clicked"); }

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_133_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_133_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_133_2.png)'
