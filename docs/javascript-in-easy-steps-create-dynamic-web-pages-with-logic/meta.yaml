  md: '# Creating an array


    An array is like a variable that can contain multiple values – unlike a regular
    variable that may only contain a single value.


    A variable is given array status using the JavaScript keyword along with the JavaScript
    Array() constructor function.


    Multiple data can be assigned to the array using the array name together with
    an index number, starting at zero, placed inside square brackets, as in this example:


    ```

    // create a new array

    var a = new Array();


    // assign values to the first three array elements

    a[0] = "First";

    a[1] = "JavaScript";

    a[2] = "Array";

    ```


    The array values can now be used just like regular variables.


    For small arrays it is often more convenient to initialize the array values as
    arguments in the Array() constructor. This is illustrated in the example below,
    which creates three arrays:


    ```

    // create and initialize three arrays

    var a = new Array("Jan", "Feb", "Mar");

    var b = new Array("21", "22", "23");

    var c = new Array("2006", "2007", "2008");


    // concatenate and display an element from each array

    alert(a[0] + b[1] + c[2]);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_49_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_49_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_49_2.png)'
  merge: -1
  pgno: 49
- img_proc: true
  md: "# ...cont'd\n\nEach value held in an array is called an array element.\n\n\
    When a variable is given array status using the new Array() constructor it also\
    \ gets properties and methods that can be used to manipulate the elements contained\
    \ in the array.\n\nOne of the most useful of these is the length property that\
    \ may be used to report the number of elements in the array currently contains.\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_50_0.png)\n\nThe syntax to a property\
    \ or method just takes a period and the name onto the object. Array.length references\
    \ the length property of the array object.\n\nNotice that an array containing\
    \ three values will have a length of 3, but because indexing starts at zero the\
    \ last element in the array will have an index number of only 2.\n\nThe example\
    \ below demonstrates this point:\n\n```\n// create a new array\nvar a = new Array();na[0]\
    \ = \"JAVASCRIPT \";na[1] = \"ARRAY \";na[2] = \"LENGTH\"\n\n// get the array\
    \ length\nvar arraysize = a.length;\n\n// display each array element and the array\
    \ length\nalert(a[0] + a[1] + a[2] + \n  \"\\nNo.of elements is \" + arraysize\
    \ );\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_50_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_50_2.png)"
  merge: -1
