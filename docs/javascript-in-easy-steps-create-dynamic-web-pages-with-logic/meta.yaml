    # Creating substrings


    A substring may be extracted from an existing string using the String.substring()
    method which must have two arguments to specify the start and end positions of
    the required substring within the main string.


    The character at the start argument position will be the first character in the
    returned substring. The last character in the substring will be the character
    preceding the given argument position.


    An alternative way to extract a substring from a string is available with the
    String.substr() method which also requires two arguments. While the first argument
    specifies the start position of the substring, the second will specify the length
    of the substring to be returned.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_86_0.png)


    The substr() method will invariably be the easier to use.


    The example below demonstrates both substring methods:


    ```

    // create and initialize a string variable

    var str = "JavaScript in easy steps";


    // get two substrings with the substring() method

    var sub1 = str.substring(14,19) + str.substring(0,11);


    // get two substrings with the substr() method

    var sub2 = str.substr(14,5) + str.substr(0,10);


    // display all the substrings

    var res = "Substr method : " +sub1;

    res += "\nSubstr method : " +sub2;

    alert(res);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_86_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_86_2.png)'
  - '[PAGE 87]


    # Converting to strings


    It is possible to manually call the JavaScript function that is to convert other
    data types to strings by calling the Object.toString() method. This is an essential
    JavaScript function and is designed to return a string representation of the object
    that is being queried, even if it is not itself string.


    In this example there is firstly a straightforward addition of two integers, followed
    by a concatenation of a string with an integer where the integer is converted
    to a string value.


    Finally the Object.toString() method is demonstrated with a different data type
    to illustrate that the generated output will reveal the object type.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_87_0.png)


    ```

    // create an integer variable and add another integer

    var num = 9;

    var nostr = num + 9;


    // create a string version of the num integer variable

    // then concatenate a second value to it

    var adstr = num.toString() + 9;


    // create a new Image object

    var img = new Image();


    // display string values of the variables

    var res = "No strings : " + nostr;

    res += "\nAdded strings : " + adstr;

    res += "\nImage : " + img.toString();

    alert(res);

    ```


    The toString() method can be used anywhere in JavaScript to reveal string information
    about any object.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_87_1.png)'
  - "[PAGE 88]\n\n# # Discovering Unicode values\n\nAll characters can be returned\
    \ for each individual character in a string with the String.charCodeAt() method.\
    \ This method requires the index of the character within the string as its argument.\
    \ Conversely characters can be obtained from Unicode using the JavaScript String.fromCharCode()\
    \ function, which takes the Unicode value as its argument.\n\nThe example below\
    \ first loops through a string and makes a comma-delimited string of its Unicode\
    \ character values. An array of these Unicode numerical values is created for\
    \ the second loop to return the character for each number:\n\n```\n// create and\
    \ initialize three strings\nvar str = \"Code Fun\", enc = \"\", unc = \"\";\n\n\
    // get the String numbers, comma delimited\nfor(var i = 0; i < str.length; i++)\
    \ {\n  enc += str.charCodeAt(i) + \",\";\n}\n\n// split the list of the numbers\
    \ into array elements\nvar ss = enc.split(\".\");\n\n// convert the Unicode values\
    \ back to characters\nfor(var i = 0; i < ss.length; i++) {\n  unc += String.fromCharCode(ss[i]);\n\
    }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_88_0.png)\n\nunicode.js\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_88_1.png)\n\nNotice that the charCodeFrom\
    \ function is a property of the String() constructor and is not a string object\
    \ method. See the next chapter for more about objects in JavaScript.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_88_2.png)\n\
    \nalert(\"Encoded : \" +enc + \"\\nUnencoded : \" +unc);"
  - '[PAGE 89]


    # Extracting string numbers


    A number can be extracted from the beginning of a string with the parseInt() and
    parseFloat() methods.


    The parseInt() method parses the string and returns the first integer value that
    is located. The parseFloat() method works in the same way but returns a floating-point
    number.


    If the parser finds any non-numeric character before returning a number then it
    will return the special NaN value that is used to denote "Not-a-Number".


    This example demonstrates both the parseFloat() and parseInt() methods and illustrates
    the JavaScript isNaN() function, used when testing for a NaN value:


    ```

    // create a string beginning with a number.

    var str = "66.6% PASS RATE";

    // extract the initial integer value

    var res = "Integer: " + parseInt(str);

    // extract the initial float value

    res += "\nFloat: " + parseFloat(str);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_89_0.png)


    ```

    // create a string beginning with a letter

    var badstr = "PASS RATE 66.6";

    // attempt to extract an initial integer value

    res += "\nNon-numeric : " + parseInt(badstr);

    res += "\nFound : ";


    isNaN(parseInt(badstr)) ? "Character": "Number":

    alert(res);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_89_1.png)


    The NaN value cannot be tested with the == equality operator.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_89_2.png)'
  - '[PAGE 90]


    # # Inserting variables in strings


    The JavaScript eval() function accepts an argument containing JavaScript code,
    which it evaluates. It returns the resulting value.


    If the code string contains statements they will be executed by the eval() function,
    and the final value will be returned. While this function is a powerful feature
    of the JavaScript language, it is most often used to simply introduce variable
    values into a string.


    In the example below the script assigns a string value to be displayed in a text
    field within a form. The HTML <input> element has been named "textfield". The
    box name and the display string are stored in variables that are evaluated by
    the eval() function.


    ```

    // store the text input name

    var fname = "textfield";


    // store the string to assign

    var ftext = "\JavaScript Text\";n

    // evaluate the assignment expression

    eval("document.forms[0]." + fname + ".value=" + ftext);

    ```


    Now the string is displayed in the text field because the expression evaluates
    to:


    ```

    document.forms[0].textfield.value = "JavaScript Text";

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_90_0.png)


    The <script> element to include this JavaScript must appear in the HTML document
    after the form elements - so the text field is created before the script can assign
    a value to it.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_90_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_90_2.png)


    Remember to escape the quotes inside a string to avoid error messages.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_90_3.png)'
  - '[PAGE 91]


    # Summary


    +   - A string is an array of characters and spaces

    - The size of a string can be revealed using its length property

    - Strings can be joined together with the + operator

    - Occurrences of a specific character can be found in a string using the charAt()
    method

    - The toUpperCase() and toLowerCase() methods are able to change the capitalization
    of a string

    - Supply a delimiter as the argument to the split() method to determine the point
    at which a string should be separated

    - The substring() method requires two arguments specifying the start and ends
    in a string to extract a substring

    - The substr() method requires two arguments specifying the start position and
    length of a required substring

    - Any data type can be converted to a string using the toString() method

    - Each character has a unique numerical Unicode value that can be revealed using
    the charCodeAt() method

    - Characters can be translated from their Unicode values with the String.fromCharCode()
    method

    - The parseInt() and parseFloat() methods are useful for extracting numerical
    values from within string

    - A value can be tested to see whether or not it is numerical with the NaN() method

    - Variable values can be introduced into a string by the eval() method'
- md: "\n# 8 Understanding objects\n\nThis chapter demonstrates how to construct new\
    \ custom objects and how they inherit properties and methods.\n\n- 92 Constructing\
    \ objects\n- 94 Inheriting object features\n- 96 Querying the browser\n- 98 Discovering\
    \ what is enabled\n- 100 Summary\n\n## Constructing objects\n\nThe JavaScript\
    \ syntax to address object properties and methods uses the object name followed\
    \ by a period and then the property name. For instance, Array.length addresses\
    \ the length property of an array object.\n\nPrevious example code in this book\
    \ has used intrinsic JavaScript objects with pre-defined methods.\n\nNew custom\
    \ objects can easily be created by the JavaScript new keyword with the Object()\
    \ constructor.\n\nProperties may then be allocated to the new custom object by\
    \ declaring a property name and assigning a value to it.\n\nThe example below\
    \ creates a new object called car and then gives it three properties with assigned\
    \ values:\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_93_0.png)\n\n```javascript\n\
    // create a new \"car\" object\nvar car = new Object();\n\n// create and initialize\
    \ a \"maker\" property...\ncar.maker = \"Dodge\";\n// create and initialize a\
    \ \"model\" property...\ncar.model = \"Viper\";\n// create and initialize a \"\
    color\" property...\ncar.color = \"Silver\";\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_93_1.png)\n\
    \nTo declare a property, use both the object name and the given property name.\n\
    \n```javascript\n// display all the car object properties...\nalert(car.color\
    \ + \" \" + car.maker + \" \" + car.model);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_93_2.png)\n\
    \nMethods can also be added to custom objects in much the same way as properties.\
    \ The statements to be executed when the method is called upon should be defined\
    \ in a regular function block using a given name. That function's name can then\
    \ be assigned to an object to create an object method.\n\nIt is sensible to keep\
    \ the same name for the object method and the function that it calls. For instance,\
    \ the example below adds a method called startup to the car object, created on\
    \ the opposite page, that calls a function of the same name:\n\n```javascript\n\
    // define the startup method...\nfunction startup() {\n  alert(\"... the motor\
    \ is now running!\");\n}\n\n// add a method to the car object...\ncar.startup\
    \ = startup;\n\n// call the car object's startup method...\ncar.startup();\n```\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_94_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_94_1.png)\n\
    \n**Beware:** Note that trailing parentheses are not used in the assignment –\
    \ just the function name.\n\nIn tree view the custom car object now looks like\
    \ this:\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_94_2.png)\n\n## Inheriting\
    \ object features\n\nA custom constructor is easily created by writing a function\
    \ with arguments to set the values of its properties. Values passed to the function\
    \ can be assigned to its properties using the JavaScript this keyword to specify\
    \ the name of the object property. Alternative default values can be specified\
    \ using the || OR operator for when a property is not specified by the caller.\n\
    \nThe example below uses this technique to recreate the previous example using\
    \ a custom constructor. The function caller simply creates an instance of the\
    \ car object without specifying any property values - so the object inherits the\
    \ default values:\n\n```javascript\n// create a car constructor function\nfunction\
    \ car(maker, model, color)\n{\n  this.maker = maker || \"Dodge\";\n  this.model\
    \ = model || \"Viper\";\n  this.color = color || \"Silver\";\n  this.startup =\
    \ startup;\n}\n```\n\n```javascript\n// define the startup function\nfunction\
    \ startup()\n{\n  alert(\"... the motor is now running!\");\n}\n```\n\n```javascript\n\
    // create an instance of the car object...\nvar viper = new car();\nalert( viper.color\
    \ + \" \" + viper.maker + \" \" + viper.model );\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_95_0.png)\n\
    \nAn instance of the object in the previous example can be created by stating\
    \ its name as the argument to the Object() constructor - for example: var van\
    \ = new Object(car).\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_95_1.png)\n\n\
    Another instance of the car object can be created with new property values specified\
    \ by the caller arguments like this:\n\n```javascript\nfunction car(maker, model,\
    \ color) {\n  this.maker = maker || \"Dodge\";\n  this.model = model || \"Viper\"\
    ;\n  this.color = color || \"Silver\";\n  this.startup = startup;\n}\n\nfunction\
    \ startup() {\n  alert(\"... the motor is now running!\");\n}\n\n// create an\
    \ instance of the car object...\nvar vette = new car(\"Chevrolet\", \"Corvette\"\
    , \"Red\");\n\n// display the instance values\nalert(vette.color + \" \" + vette.maker\
    \ + \" \" + vette.model);\nvette.startup();\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_96_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_96_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_96_2.png)\n\
    \nIn this example properties receive new values – but the default is inherited\
    \ from the constructor.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_96_3.png)\n\
    \n## Querying the browser\n\nThe intrinsic navigator object has properties to\
    \ provide information about the browser used to view a document. The browser name\
    \ is revealed by the navigator.appName, a description of that particular property\
    \ is available from the navigator.userAgent.\n\nIn addition to the release number\
    \ the navigator.userAgent property contains other details such as the host platform.\
    \ In the example below the navigator.userAgent property reveals the browsers to\
    \ be Internet Explorer 7.0 (MSIE 7.0) and Firefox 1.5 running on a Windows platform\
    \ (NT5.1):\n\n```javascript\n// get the browser name\nvar browser = navigator.appName;\n\
    \n// get the browser description\nvar description = navigator.userAgent;\n\n//\
    \ display the browser name and version\nalert(browser + \"\\n\" + description);\n\
    ```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_97_0.png)\n\nWindows Internet\
    \ Explorer\nMicrosoft Internet Explorer\nMozilla/4.0 (compatible; MSIE 7.0; Windows\
    \ NT 5.1)\nOK\n\n[JavaScript Application]\nNetscape\nMozilla/5.0 (Windows; NT\
    \ 5.1; en-US; rv:1.8) Gecko/20050111 Firefox/1.5\nOK\n\nOther properties of the\
    \ navigator object provide specific details about the user's operating system\
    \ and browser. These are useful to tailor JavaScript applications to specific\
    \ browsers and platforms. The example below uses indexOf() method to search the\
    \ navigator.platform string in order to identify the user's operating system and\
    \ to generate an appropriate message:\n\n```javascript\n// get the operating system...\n\
    var platform;\nif(navigator.platform.indexOf(\"Linux\") != -1)\n  platform = \"\
    Linux\";\nif(navigator.platform.indexOf(\"Win\") != -1)\n  platform = \"Windows\"\
    ;\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_98_0.png)\n\nalert(\"Welcome\
    \ \" + platform + \" user\\nYour system is: \" + navigator.platform + \" - \"\
    \ + navigator.appCode + \" - \" + navigator.appVersion);\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_98_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_98_2.png)\n\n## Discovering what is\
    \ enabled\n\nA browser can be assessed to discover whether Java is enabled using\
    \ the navigator.javaEnabled() method. This returns true or false, depending on\
    \ the result. The navigator.javaEnabled() method can be used to display a warning\
    \ if a page containing a Java applet is being loaded in the browser:\n\n```javascript\n\
    // test if Java is enabled in the browser\nif (!navigator.javaEnabled()) {\n \
    \ var warning =\n  \"It appears Java is not enabled in your browser.\\\n  Some\
    \ items on this page cannot run without Java\";\n  alert(warning);\n}\n```\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_99_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_99_1.png)\n\
    \nEnabling Java in the browser settings allows the page to load without displaying\
    \ any warning:\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_99_2.png)\n\nMozilla\
    \ browsers JavaScript can reveal information about any installed plugins with\
    \ the navigator.plugins array. Each plugin is added as an element in the navigator.plugins\
    \ array. For instance, the Macromedia Shockwave plugin is installed there is a\
    \ navigator.plugins[\"Shockwave Flash\"] element.\n\nThe plugin element has a\
    \ name property, storing the name and version of that plugin, and a description\
    \ property that contains information about the plugin.\n\nIn the following example\
    \ a loop displays each name property in the navigator.plugins array, list all\
    \ the installed plugins:\n\n```javascript\n// list installed Mozilla plugins...\n\
    if(navigator.appName == \"Netscape\") {\n  var str = \"\";\n  for(var i = 0; i\
    \ < navigator.plugins.length; i++) {\n    str += navigator.plugins[i].name + \"\
    \\n\";\n  }\n  alert(str);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_100_0.png)\n\
    \nnavigator.plugins exists in Internet Explorer but it's not implemented.\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_100_1.png)\n\nplugins.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_100_2.png)\n\
    \nMozilla browsers identify with the Netscape name.\n\n| Plugin Name |\n| :---\
    \ |\n| Mozilla Default Plug-in |\n| QuickTime Plug-in 7.0.3 |\n| Shockwave Flash\
    \ |\n| Adobe Acrobat |\n| RealPlayer(tm) G2 LiveConnect-Enabled Plug-In (32-bit)\
    \ |\n| RealPlayer Version Plugin |\n| Java(TM) 2 Platform Standard Edition 5.0\
    \ Update 6 |\n| Microsoft® DRM |\n| Windows Media Player Plug-in Dynamic Link\
    \ Library |\n| Microsoft® DRM |\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_100_3.png)\n\
    \nThe output from this script will vary according to the plugins installed on\
    \ your browser.\n"
  mdcn: "\n\n# 8 理解对象\n\n本章演示了如何构建新的自定义对象以及它们如何继承属性和方法。\n\n- 92 构建对象\n- 94 继承对象特性\n\
    - 96 查询浏览器\n- 98 发现已启用的功能\n- 100 总结\n\n## 构建对象\n\n访问对象属性和方法的 JavaScript 语法使用对象名后跟点，然后是属性名。例如，`Array.length`\
    \ 访问数组对象的长度属性。\n\n书中之前的示例代码使用了具有预定义方法的 JavaScript 固有内置对象。\n\n可以使用 JavaScript 的\
    \ `new` 关键字配合 `Object()` 构造函数轻松地创建新的自定义对象。\n\n可以通过声明属性名并为其赋值，来为新的自定义对象分配属性。\n\n\
    下面的示例创建了一个名为 `car` 的新对象，然后为它提供了三个带有赋值值的属性：\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_93_0.png)\n\
    \n```javascript\n// 创建一个新的 \"car\" 对象\nvar car = new Object();\n\n// 创建并初始化 \"\
    maker\" 属性...\ncar.maker = \"Dodge\";\n// 创建并初始化 \"model\" 属性...\ncar.model =\
    \ \"Viper\";\n// 创建并初始化 \"color\" 属性...\ncar.color = \"Silver\";\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_93_1.png)\n\
    \n要声明属性，请同时使用对象名和给定的属性名。\n\n```javascript\n// 显示 car 对象的所有属性...\nalert(car.color\
    \ + \" \" + car.maker + \" \" + car.model);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_93_2.png)\n\
    \n方法也可以以与属性非常的方式添加到自定义对象中。在调用方法时需要执行的语句应该在普通函数块中使用给定的名称进行定义。然后，可以将该函数的名称赋值给对象，从而创建一个对象方法。\n\
    \n让对象方法与它调用的函数保持相同的名称是合理的。例如，下面的示例为在相反页创建的 `car` 对象添加了一个名为 `startup` 的方法，该方法调用一个同名的函数：\n\
    \n```javascript\n// 定义 startup 方法...\nfunction startup() {\n  alert(\"... 动机现在正在运行!\"\
    );\n}\n\n// 为 car 对象添加方法...\ncar.startup = startup;\n\n// 调用 car 对象的 startup 方法...\n\
    car.startup();\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_94_0.png)\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_94_1.png)\n\n**注意：** 注意赋值时不使用末尾的括号——只需函数名。\n\
    \n在树形视图中，自定义的 car 对象现在如下：\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_94_2.png)\n\
    \n## 继承对象特性\n\n通过编写一个带有参数的函数来设置其属性值，可以轻松创建自定义构造函数。传递给函数的值可以使用 JavaScript 的 `this`\
    \ 关键字指定对象属性名来分配给属性。当调用者未指定属性时，可以使用 `||` OR 运算符指定默认值。\n\n下面的示例使用这种技术通过自定义构造函数重新创建了之前的示例。函数调用者只需创建\
    \ `car` 对象的实例而不指定任何属性值——因此对象继承了默认值：\n\n```javascript\n// 创建一个 car 构造函数\nfunction\
    \ car(maker, model, color)\n{\n  this.maker = maker || \"Dodge\";\n  this.model\
    \ = model || \"Viper\";\n  this.color = color || \"Silver\";\n  this.startup =\
    \ startup;\n}\n```\n\n```javascript\n// 定义 startup 函数\nfunction startup()\n{\n\
    \  alert(\"... 动机现在正在运行!\");\n}\n```\n\n```javascript\n// 创建 car 对象的实例...\nvar\
    \ viper = new car();\nalert( viper.color + \" \" + viper.maker + \" \" + viper.model\
    \ );\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_95_0.png)\n\n可以通过将其名称作为\
    \ `Object()` 构造器的参数来创建上一个示例对象的实例——例如：`var van = new Object(car)`。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_95_1.png)\n\
    \n可以这样通过调用者参数指定新的属性值来创建另一个 car 对象实例：\n\n```javascript\nfunction car(maker, model,\
    \ color) {\n  this.maker = maker || \"Dodge\";\n  this.model = model || \"Viper\"\
    ;\n  this.color = color || \"Silver\";\n  this.startup = startup;\n}\n\nfunction\
    \ startup() {\n  alert(\"... 动机现在正在运行!\");\n}\n\n// 创建 car 对象的实例...\nvar vette\
    \ = new car(\"Chevrolet\", \"Corvette\", \"Red\");\n\n// 显示实例值\nalert(vette.color\
    \ + \" \" + vette.maker + \" \" + vette.model);\nvette.startup();\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_96_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_96_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_96_2.png)\n\
    \n在此示例中，属性接收了新值——但默认继承自构造函数。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_96_3.png)\n\
    \n## 查询浏览器\n\n固有 `navigator` 对象具有有关浏览器的属性。浏览器名称由 `navigator.appName` 显示，描述可以通过\
    \ `navigator.userAgent` 获取。\n\n除了发行号外，`navigator.userAgent` 属性包含主机平台等详细信息。在下面的示例中，`navigator.userAgent`\
    \ 属性显示浏览器为在 Windows 平台 (NT5.1) 上运行的 Internet Explorer 7.0 (MSIE 7.0) 和 Firefox\
    \ 1.5：\n\n```javascript\n// 获取浏览器名称\nvar browser = navigator.appName;\n\n// 获取浏览器描述\n\
    var description = navigator.userAgent;\n\n// 显示浏览器名称和版本\nalert(browser + \"\\\
    n\" + description);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_97_0.png)\n\
    \nWindows Internet Explorer\nMicrosoft Internet Explorer\nMozilla/4.0 (compatible;\
    \ MSIE 7.0; Windows 5.1)\nOK\n\n[JavaScript Application]\nNetscape\nMozilla/5.0\
    \ (Windows; NT 5.1; en-US; rv:1.8) Gecko/2005011 Firefox/1.5\nOK\n\n`navigator`\
    \ 对象的其他属性提供了有关操作系统和浏览器的特定信息。这些属性为特定浏览器定制 JavaScript 应用非常有用。下面的示例使用 `indexOf()`\
    \ 方法搜索 `navigator.platform` 字符串以识别并生成相应的消息：\n\n```javascript\n// 获取操作系统...\nvar\
    \ platform;\nif(navigator.platform.indexOf(\"Linux\") != -1)\n  platform = \"\
    Linux\";\nif(navigator.platform.indexOf(\"Win\") != -1)\n  platform = \"Windows\"\
    ;\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_98_0.png)\n\nalert(\"Welcome\
    \ \" + platform + \" user\\nYour system is: \" + navigator.platform + \" \" +\
    \ navigator.appCode + \" \" + navigator.appVersion);\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_98_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_98_2.png)\n\n## 发现已启用的功能\n\n可以使用 `navigator.javaEnabled()`\
    \ 方法评估浏览器以发现是否启用了 Java。根据结果返回 `true` 或 `false`。如果浏览器中加载了包含 Java 小程序的页面，可以使用 `navigator.javaEnabled()`\
    \ 方法显示警告：\n\n```javascript\n// 测试浏览器中是否启用了 Java\nif (!navigator.javaEnabled())\
    \ {\n  var warning =\n  \"您的浏览器似乎未启用 Java。\\n  此页面上的某些项目在没有 Java 的情况下运行\";\n \
    \ alert(warning);\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_99_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_99_1.png)\n\n在浏览器设置中启用 Java 允许页面在不显示任何警告的情况下加载：\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_99_2.png)\n\nMozilla 浏览器可以使用 `navigator.plugins`\
    \ 数组显示任何已安装插件的信息。每个插件都作为 `navigator.plugins` 数组中的一个元素添加。例如，如果安装了 Macromedia Shockwave\
    \ 插件，则有一个 `navigator.plugins[\"Shockwave Flash\"]` 元素。\n\n插件元素有一个 `name` 属性，存储该插件的名称和版本，以及一个包含插件信息的\
    \ `description` 属性。\n\n在下面的示例中，循环显示 `navigator.plugins` 数组中的每个 `name` 属性，列出所有已安装的插件：\n\
    \n```javascript\n// 列出已安装的 Mozilla 插件...\nif(navigator.appName == \"Netscape\"\
    ) {\n  var str = \"\";\n  for(var i = 0; i < navigator.plugins.length; i++) {\n\
    \    str += navigator.plugins[i].name + \"\\n\";\n  }\n  alert(str);\n}\n```\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_100_0.png)\n\n`navigator.plugins` 在\
    \ Internet Explorer 中存在但尚未实现。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_100_1.png)\n\
    \nplugins.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_100_2.png)\n\nMozilla\
    \ 浏览器以 Netscape 名称标识。\n\n| 插件名称 |\n| :--- |\n| Mozilla Default Plug-in |\n| QuickTime\
    \ Plug-in 7.0.3 |\n| Shockwave Flash |\n| Adobe Acrobat |\n| RealPlayer(tm) G2\
    \ LiveConnect-Enabled Plug-In (32-bit) |\n| RealPlayer Version Plugin |\n| Java(TM)\
    \ 2 Platform Standard Edition 5.0 Update 6 |\n| Microsoft® DRM |\n| Windows Media\
    \ Player Plug-in Dynamic Link Library |\n| Microsoft® DRM |\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_100_3.png)\n\
    \n此脚本的输出将根据浏览器中安装的插件而不同。\n\n"
