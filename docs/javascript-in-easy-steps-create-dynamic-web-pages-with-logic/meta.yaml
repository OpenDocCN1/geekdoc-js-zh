  - '[PAGE 143]


    # Setting form attributes


    The window.document.forms object contains an array of all the forms in the HTML
    document, indexed in the order which they appear in the HTML document. For instance,
    window.document.forms[0] addresses the first form to appear in the HTML code of
    a web page.


    If the <form> element has been assigned a value then the form can be addressed
    by value. So the id of "f" can be addressed as document.forms.f.


    All other attributes assigned to the <form> tag are also accessible as properties
    of that form object. For this form ...


    ```

    <form id = "f" method = "post"

    action = "mailto:a@b.com" enctype = "text/plain">

    ```


    ... the following JavaScript function can be called from the HTML <body> tag''s
    onload attribute to reveal the form properties:


    ```

    function form_info() {

    // get the form name

    var msg = "Name: " + document.forms.f.id;

    // get the form method, action and encoding type

    msg += "\nMethod: " + document.forms.f.method;

    msg += "\nAction: " + document.forms.f.action;

    msg += "\nEnctype: " + document.forms.f.encoding;

    alert(msg);

    }

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_143_0.png)


    form-properties.js


    ![](img/9706759b347c5727cfdd3d09614f8c1f_143_1.png)


    The form in this example could alternatively be addressed in the W3C DOM using
    document.getElementById("f").'
- md: "\n# ...cont'd\n\nThe document.forms[] elements object contains an array of\
    \ all the elements within a form, indexed in the order in which they appear in\
    \ the HTML code. With a name \"f\" for instance, document.forms.elements[0] addresses\
    \ the first element that appears in that form.\n\nIf the id attribute of the element\
    \ has been assigned a value then the element can be addressed by that value. So\
    \ the element with id \"btn1\" in this form \"f\" can be addressed as document.forms.f.btn1:\n\
    \n```html\n<form id=\"f\" method=\"post\" action=\"\">\n<input type=\"button\"\
    \ id=\"btn1\" value=\"Click Me\" onclick=\"alert('Hi - I am a button')\"></form>\n\
    ```\n\nOther attributes are accessible as properties of element – illustrated\
    \ by this example:\n\n```javascript\nfunction element_info() {\n  var msg = \"\
    Element Type: \" + document.forms.btn1.type; // element type\n  msg += \"\\nElement\
    \ Value: \" + document.forms.btn1.value; // element value\n  msg += \"\\nOnclick:\
    \ \" + document.forms.btn1.onclick; // onclick value\n  alert(msg);\n}\n```\n\n\
    ## Assigning text values\n\nThe text displayed in an HTML <input> is easily changed\
    \ by JavaScript simply by assigning a new string to the value property of that\
    \ element.\n\nHistorically, text boxes were restricted to displaying text in just\
    \ one fixed font, but modern browsers allow a choice of font, size and color.\n\
    \nThe example below displays a string in a text box and adds style characteristics\
    \ for font, foreground-color and background-color:\n\n```javascript\n// a function\
    \ to set the text in a form text field\nfunction set_text() {\n  // for text field\
    \ txtl in form f\n  with(window.document.forms.f.txtl) {\n    // set the text\
    \ value\n    value = \"JavaScript in easy steps\";\n    // set the style characteristics\n\
    \    style.fontFamily = \"comic sans ms\";\n    style.fontSize = \"16pt\";\n \
    \   style.color = \"yellow\";\n    style.background = \"red\";\n  }\n}\n```\n\n\
    | Text Field | |\n|---|---|\n| text-field.html | |\n| Text Field | |\n| JavaScript\
    \ in easy steps | |\n\n...cont'd\nHTML <textarea> element is rather like a large\
    \ scrolling text input whose value can be read and written by JavaScript.\n\n\
    The example wrote contents to a text area by assigning a string to its value property\
    \ after the document is loaded.\n\nThe function to assign the string is designated\
    \ as the document's onload event-handler by the script.\n\nCare is needed when\
    \ using this approach - if the script is included in the <head> section of the\
    \ HTML document an onload attribute in the <body> tag may overwrite it.\n\na function\
    \ to write text content in a text area function write_text()\n\n```javascript\n\
    // assign a string to the textarea field\nwindow.document.forms.f.textarea.value\
    \ = \n\"Computers in the future may perhaps weigh 1.5 tons. (Popular Mechanics\
    \ forecasting the development of computer technology, 1949)\";\n\n// define the\
    \ onload function\nwindow.onload = write_text;\n```\n\n## Polling radio buttons\n\
    \nA group of radio buttons that will only allow one of the group to be checked\
    \ at any time should all have the same name assigned to their name attribute in\
    \ the HTML <input> tag.\n\nIn the browser DOM the radio-button creates a window.document.forms\
    \ object with that given name.\n\nThis object contains an array of the radio buttons\
    \ in the group, indexed in the order in which they appear in the HTML code.\n\n\
    JavaScript can address each radio button using the array name and index number.\
    \ In the example below a JavaScript explores the checked property of each radio\
    \ button named \"rad\" to discover which one is checked. The value of that button's\
    \ HTML value attribute is then assigned to set the document's background color:\n\
    \n```javascript\nfunction radio_poll() {\n  for( var i = 0; i < window.document.forms.f.rad.length;\
    \ i++) {\n    if( window.document.forms.f.rad[i].checked ) {\n      window.document.body.style.background\
    \ = window.document.forms.f.rad[i].value;\n    }\n  }\n}\n```\n\n## Polling checkboxes\n\
    \nUnlike radio buttons a checkbox operates independently from other checkboxes\
    \ so all checkboxes should be uniquely identified by their name attribute in the\
    \ HTML code.\n\nEach checkbox creates a window.document.forms object with its\
    \ given name and, like a radio button, each has a checked property.\n\nIn this\
    \ example a JavaScript examines three checkboxes named \"chk1\", \"chk2\", and\
    \ \"chk3\" to discover which ones are checked. It uses the eval() function to\
    \ concatenate the property and pass number. The values of those that are checked\
    \ are added to a string for display in alert() dialog box:\n\n```javascript\n\
    function checkbox_poll() {\n  var str = \"Choice is \";\n  for(var i=1; i<4; i++)\
    \ {\n    // if the checkbox is checked, add its value\n    if(eval(\"document.forms.chk\"\
    \ + i).checked) {\n      str += eval(\"document.forms.chk\" + i).value;\n    }\n\
    \  }\n  alert(str);\n}\n```\n> Hot tip Use the eval() function to combine property\
    \ names and numbers.\n\n## Choosing options\n\nThe <option> items in an HTML <select>\
    \ list have a text property for each displayed label and an associated value property.\
    \ These are equivalent to the HTML name and value attributes of <option> element\
    \ in the <select> list.\n\nThis name=value pair is sent to the server when the\
    \ form is submitted.\n\nAll menu items are stored in the <select> object's options[]\
    \ array and both the text label and its associated value may be dynamically written\
    \ by JavaScript.\n\nThis example dynamically sets the text label and the associated\
    \ value of all three options in a drop-down list. The form has the id \"f\" and\
    \ the <select> element has the id \"menu\".\n\n```javascript\n// a function to\
    \ set the label and values of options\nfunction set_options() {\n  with(window.document.forms.f.menu)\
    \ {\n    options[0].text = \"One\"; options[0].value = \"1\";\n    options[1].text\
    \ = \"Two\"; options[1].value = \"2\";\n    options[2].text = \"Three\"; options[2].value\
    \ = \"3\";\n  }\n}\n```\n\nThe options[] elements must be initially created by\
    \ the HTML code.\n\n...cont'd\n\noptions[] has a property called selectedIndex\
    \ that contains the index number of the item currently selected.\n\nJavaScript\
    \ can fully retrieve the value of the current selection for dynamic effects.\n\
    \nThis example extracts the value of the current selection for display in a text\
    \ box. The form has the id \"f\" and the <select> element has the id \"city\"\
    . The function is called by the onclick attribute of the button when the user\
    \ clicks it.\n\n```javascript\n// a function to get the selected item in a list\n\
    function get_selected() {\n  // a variable to store the selected index number\n\
    \  var pick = window.document.forms.f.city.selectedIndex;\n\n  // assign the value\
    \ of the selected element\n  // to a text field with the id of \"txt1\"\n  window.document.forms.f.txt1.value\
    \ = \n  window.document.forms.f.city.options[pick].value;\n}\n```\n> Hot tip This\
    \ example could use \"with\" statement to make the script more concise, as in\
    \ the example on the facing page.\n\n## Reacting to changes\n\nThe Change event\
    \ occurs when the value of a form input is changed, for example when the user\
    \ selects an item in an options list. The onchange event-handler can call a JavaScript\
    \ function to execute some code whenever the Change occurs.\n\nThe example below\
    \ sets the initial selected option to Green and then assigns an event-handler\
    \ that displays the associated value in a text box whenever the selection is changed:\n\
    \n```javascript\n// specify a LOAD event-handler\nwindow.onload = init;\n\n//\
    \ a function to react to the LOAD event\nfunction init() {\n  window.document.forms.f.s.options[1].selected=true;\n\
    \  // specify a CHANGE event-handler\n  window.document.forms.f.s.onchange = show_selected;\n\
    }\n\n// a function to react to the CHANGE event\nfunction show_selected() {\n\
    \  var num = window.document.forms.f.s.selectedIndex;\n  window.document.forms.f.txt.value\
    \ = \n  window.document.forms.f.s.options[num].value;\n}\n```\n"
  mdcn: "\n\n# ...接上\n\n`document.forms[]` 元素对象包含表单内所有元素的数组，并按照它们在 HTML 代码中出现的顺序进行索引。例如，对于名称为\
    \ \"f\" 的表单，`document.forms.elements[0]` 指向该表单中出现的第一个元素。\n\n如果元素的 `id` 属性已分配了值，则可以通过该值来访问该元素。因此，表单\
    \ \"f\" 中 id 为 \"btn1\" 的元素可以通过 `document.forms.f.btn1` 进行访问：\n\n```html\n<form\
    \ id=\"f\" method=\"post\" action=\"\">\n<input type=\"button\" id=\"btn1\" value=\"\
    Click Me\" onclick=\"alert('Hi - I am a button')\"></form>\n```\n\n其他属性可以作为元素的属性进行访问——此示例所示：\n\
    \n```javascript\nfunction element_info() {\n  var msg = \"Element Type: \" + document.forms.btn1.type;\
    \ // 元素类型\n  msg += \"\\nElement Value: \" + document.forms.btn1.value; // 元素值\n\
    \  msg += \"\\nOnclick: \" + document.forms.btn1.onclick; // onclick 值\n  alert(msg);\n\
    }\n```\n\n## 赋值文本值\n\nHTML <input> 中显示的文本可以通过 JavaScript 简单地通过为该元素的 `value` 属性分配一个新字符串来更改。\n\
    \n在历史上，文本框被限制只能显示一种固定字体的文本，但现代浏览器允许对字体、大小和颜色进行选择。\n\n下面的示例在文本框中显示一个字符串，并为字体、前景颜色和背景颜色添加样式特征：\n\
    \n```javascript\n//一个设置表单文本字段文本的函数\nfunction set_text() {\n  // 针对表单 f 中的文本字段\
    \ txtl\n  with(window.document.forms.f.txtl) {\n    // 设置文本值\n    value = \"JavaScript\
    \ in easy steps\";\n    // 设置样式特征\n    style.fontFamily = \"comic sans ms\";\n\
    \    style.fontSize = \"16pt\";\n    style.color = \"yellow\";\n    style.background\
    \ = \"red\";\n  }\n}\n```\n\n| 文本字段 | |\n|---|---|\n| text-field.html | |\n| 文本字段\
    \ | |\n| JavaScript in easy steps | |\n\n...接上\n\nHTML <textarea> 元素类似于一个大型滚动文本输入框，其值可以被\
    \ JavaScript 读取和写入。\n\n示例在文档加载后，通过向其 `value` 属性分配字符串来向文本区域写入内容。\n\n分配该字符串的函数被脚本指定为文档的\
    \ `onload` 事件处理器。\n\n使用这种方法时需要小心——如果脚本包含在 HTML 文档的 `<head>` 部分，`<body>` 标签中的 `onload`\
    \ 属性可能会覆盖它。\n\n一个在文本区域写入文本内容的函数 function write_text()\n\n```javascript\n//为 textarea\
    \ 字段分配字符串\nwindow.document.forms.f.textarea.value = \n\"Computers in the future\
    \ may perhaps weigh 1.5 tons. (Popular Mechanics forecasting the development of\
    \ computer technology, 1949)\";\n\n//定义 onload 函数\nwindow.onload = write_text;\n\
    ```\n\n## 轮询单选按钮\n\n一组在任何时候只允许其中一个被选中的单选按钮，应该在 HTML <input> 标签的 `name` 属性中被分配相同的\
    \ `name`。\n\n在浏览器 DOM 中，单选按钮会根据给定的名称创建一个 `window.document.forms` 对象。\n\n该对象包含该组内单选按钮的数组，按照它们在\
    \ HTML 代码中出现的顺序进行索引。\n\nJavaScript 可以使用数组名和索引号来访问每个单选按钮。在下面的示例中，JavaScript 遍历每个名为\
    \ \"rad\" 的单选按钮的 `checked` 属性，以发现哪一个被选中。然后将该按钮的 HTML `value` 属性的值赋值给设置文档的背景颜色：\n\
    \n```javascript\nfunction radio_poll() {\n  for( var i = 0; i < window.document.forms.f.rad.length;\
    \ i++) {\n    if( window.document.forms.f.rad[i].checked ) {\n      window.document.body.style.background\
    \ = window.document.forms.f.rad[i].value;\n    }\n  }\n}\n```\n\n## 轮询复选框\n\n\
    与单选按钮不同，复选框与其他复选框独立运行，因此所有复选框都应通过其 HTML 代码中的 `name` 属性唯一标识。\n\n每个复选框都会根据其给定的名称创建一个\
    \ `window.document.forms` 对象，并且像单选按钮一样，每个都有一个 `checked` 属性。\n\n在此示例中，JavaScript\
    \ 检查名为 \"chk1\"、chk2\" 和 \"chk3\" 的三个复选框，以发现哪些被选中。它使用 `eval()` 函数来拼接属性名和数字。被选中的项的值被加到一个字符串中以便在\
    \ `alert()` 对话框中显示：\n\n```javascript\nfunction checkbox_poll() {\n  var str =\
    \ \"Choice is \";\n  for(var i=1; i<4; i++) {\n    // 如果复选框被选中，则添加其值\n    if(eval(\"\
    document.forms.chk\" + i).checked) {\n      str += eval(\"document.forms.chk\"\
    \ + i).value;\n    }\n  }\n  alert(str);\n}\n```\n> 提示提示 使用 eval() 函数来组合属性名和数字。\n\
    \n## 选择选项\n\nHTML <select> 列表中的 <option> 项为每个显示的标签都有一个 `text` 属性和一个关联的 `value`\
    \ 属性。这些等同于 <select> 列表中 <option> 元素的 HTML `name` 和 `value` 属性。\n\n这种 name=value\
    \ 对在表单提交时发送到服务器。\n\n所有菜单项存储在 <select> 对象的 `options[]` 数组中，其标签和关联值可以由 JavaScript\
    \ 动态设置。\n\n此示例在下拉列表中动态设置选项标签和值。表单 id 为 \"f\"，<select> 元素 id 为 \"menu\"。\n\n```javascript\n\
    //一个设置选项标签和值的函数\nfunction set_options() {\n  with(window.document.forms.f) {\n\
    \    options[0].text = \"One\"; options[0].value = \"1\";\n    options[1].text\
    \ = \"Two\"; options[1].value = \"2\";\n    options[2].text = \"Three\"; options[2].value\
    \ = \"3\";\n  }\n}\n```\n\noptions[] 元素必须由 HTML 代码初始创建。\n\n...接上\n\noptions[]\
    \ 有一个名为 `selectedIndex` 的属性，包含当前选中项的索引号。\n\nJavaScript 可以获取当前选择的值来实现动态效果。\n\n\
    此示例在文本框中提取当前选择的值。表单 id 为 \"f\"，<select> 元素 id 为 \"city\"。当用户点击按钮时通过其 onclick 属性调用函数。\n\
    \n```javascript\n//获取选中项的函数\nfunction get_selected() {\n  //存储索引号的变量\n  var pick\
    \ = window.document.forms.f.city.selectedIndex;\n\n  //将选中元素的值赋值给 id 为 \"txt1\"\
    \ 的文本字段\n  window.document.forms.f.txt1.value = \n  window.document.forms.f.city.options[pick].value;\n\
    }\n```\n> 提示此示例可以使用 with 语句使其更简洁，正如对面页面示例所示。\n\n## 响应变化\n\n当表单输入发生变化时会触发 Change\
    \ 事件，例如用户在选项列表中选择一个项时。onchange 事件处理器可以调用 JavaScript 函数在每次 Change 发生时执行某些代码。\n\n\
    下面的示例将初始选中选项设置为绿色，然后分配一个事件处理器，每当选择更改时在文本框中显示关联的值：\n\n```javascript\n//指定 onload\
    \ 事件处理器\nwindow.onload = init;\n\n//响应 LOAD 事件的函数\nfunction init() {\n  window.document.forms.f.s.options[1].selected=true;\n\
    \  //指定 CHANGE 事件处理器\n  window.document.forms.f.s.onchange = show_selected;\n\
    }\n\n//响应 CHANGE 事件的函数\nfunction show_selected() {\n  var num = window.document.forms.f.s.selectedIndex;\n\
    \  window.document.forms.f.txt.value = \n  window.document.forms.f.s.options[num].value;\n\
    }\n```\n\n"
