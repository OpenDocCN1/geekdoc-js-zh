    # 获取日期和时间


    日期和时间经常用于 JavaScript 中自定义网页的性能。例如，脚本可能会根据当前时间用问候语欢迎用户：此应用程序的脚本包含在所示示例中。所使用的日期和时间来自加载脚本的浏览器运行系统系统。要访问时钟信息，脚本必须先创建一个
    `Date` 对象。这与创建数组的方式相同，使用 JavaScript 的 `Date()` 函数。下面的示例创建并显示了一个 `Date` 对象：


    ```javascript

    // 创建一个 Date 对象

    var now = new Date();


    // 显示 Date 对象的日期和时间

    alert(now);

    ```


    # 提取日期组件


    `Date` 对象具有特殊方法，可检索日期的各个部分。某些方法以索引值返回日期信息，需要脚本进行转换。`Date.getDay()` 方法返回从 0（星期日）到
    6（星期六）的索引值星期几。同样，`Date.getMonth()` 方法返回从 0（一月）到 11（十二月）的索引值月份。下面的示例说明了 `Date`
    对象并使用两个数组显示正确的星期和月份名称：


    ```javascript

    // 创建星期名称和月份名称数组

    var days = new Array("Sun", "Mon", "Tue", "Wed", "Fri", "Sat");


    var months = new Array("Jan", "Feb", "Mar", "Apr", "May", "Jun", "Sep", "Oct",
    "Nov", "Dec");


    var now = new Date(); // 创建一个新的 Date 对象

    var yy = now.getFullYear();

    if(yy < 2000) yy -= 1900; // 为 Mozilla 调整年份

    var mm = now.getMonth(); // 获取月份数字

    mm = months[mm];

    var dd = now.getDate(); // 获取月份中的几

    var dy = now.getDay(); // 获取星期中的几

    days = days[dy]; // 将星期数字转换为名称


    // 显示提取的日期信息

    alert("date " + mm + " " + dd + " " + yy);

    ```


    注意索引从 0 开始，所以月份的索引值是 2 而 3。


    提示：Mozilla 浏览器报告的是自 1900 年以来的年份 - 因此在这种情况下脚本将年份加上 1900。


    # 提取时间组件


    `Date` 对象具有特殊方法来访问它包含的时间信息。下面的示例从主机时钟获取当前的时、分、秒和毫秒，并显示适用于当天时间的问候语：


    ```javascript

    // 创建一个新的 Date 对象

    var now = new Date();


    // 提取时间信息

    var hh = now.getHours();

    var mn = now.getMinutes();

    var ss = now.getSeconds();

    var ms = now.getMilliseconds();


    // 默认问候语

    var hi = "Good Morning";

    ```


    ```javascript

    // 中午后的问候语

    if( hh > 11 ) hi = "Good Afternoon";

    ```


    ```javascript

    // 晚上 6 点以后的问候语

    if( hh > 17 ) hi = "Good Evening";

    ```


    ```javascript

    // 显示问候语和当前时间

    var tim = hi + "Hours: " + hh + "\n";

    tim += "Minutes: " + mn + "\n";

    tim += "Seconds: " + ss + "." + ms;

    alert(tim);

    ```


    小时以 24 小时格式的 0-23 数字返回。


