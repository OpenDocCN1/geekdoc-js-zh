  md: "# Seeking confirmation\n\nThe alert() function is used extensively throughout\
    \ this book is actually a window object method, so may be correctly addressed\
    \ as window.alert().\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_111_0.png)\n\n\
    As the window object is the top-level object in the Document Object Model its\
    \ properties and methods can optionally leave off \"window.\" from the address\
    \ - so \"window.alert()\" is recognized by just \"alert\".\n\nThe window.confirm()\
    \ method is the first of two other window methods that produce dialog boxes when\
    \ It is used to get user confirmation from a dialog box containing an OK button\
    \ that returns true to the script and a Cancel button returns false to the script.\
    \ A single argument should be passed to the method as a text string containing\
    \ the question to ask the user.\n\nThis example demonstrates the window.confirm()\
    \ method performing conditional branching to determine which message to display\
    \ - depending upon which button the user pushes:\n\n```\n// create a variable\
    \ to store a dialog response\nvar ask = window.confirm(\"Do you wish to proceed\
    \ ?\");\n\n// display an appropriate reply message\n( ask ) ? window.alert(\"\
    OK button was pushed\") : \nwindow.alert(\"Cancel button was pushed\");\n```\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_111_1.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_111_2.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_111_3.png)"
