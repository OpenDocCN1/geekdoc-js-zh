  - '[PAGE 9]


    # Introduction


    JavaScript is an interpreted programming language whose interpreter is embedded
    inside web browser software, such as Microsoft Internet Explorer and Netscape
    Navigator.


    This means that scripts contained in web documents can be read by the browser''s
    JavaScript engine whenever the document is loaded into the browser window.


    In this way, web documents can be made to respond to the user''s actions and produce
    dynamic visual effects.


    JavaScript should not be confused with the compiled programming language called
    Java from Sun Microsystems, although bearing some resemblance to it, is, a completely
    different language.


    JavaScript appeared in December 1995 and was initially called LiveScript, although
    the name was soon changed for marketing reasons.


    The JavaScript language contains many impressive features for security reasons
    it cannot read or write files, with the exception of cookie files that store a
    small amount of data.


    This book is concerned with the core and client-side features of JavaScript that
    are most useful in the creation of interactive web pages.


    It is important to learn the basics – so the mechanics of the language are covered
    first in chapters that explain, by example, how to write JavaScript programs.


    Then the browser Document Object Model (DOM) is introduced to illustrate how all
    web pages contain objects with properties that can be manipulated by JavaScript.
    Combining JavaScript with knowledge of the DOM allows the creation of powerful
    Dynamic HTML (DTHTML) effects.


    The final part of this book contains examples of JavaScript in use with more mature
    technologies illustrating the powerful technique of Asynchronous JavaScript and
    XML (AJAX). This provides the ability to create web-based applications with similar
    responsiveness to that of desktop applications.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_9_0.png)


    The JavaScript interpreter is an integral part of the browser software so scripts
    are parsed without delay.'
- md: "\n## Including JavaScript in HTML\n\nIn order to include JavaScript in a web\
    \ document a script block can be defined within the HTML code.\n\nThe script block\
    \ may be defined anywhere within the HTML code but the usual place is inside the\
    \ head section of the document, between the `<head>` and `</head>` tags.\n\nWhen\
    \ a browser loads the document it reads (parses) the code sequentially. So placing\
    \ the script block in the head of the document ensures that the JavaScript code\
    \ is parsed before the rest of the HTML code and the document's body content.\n\
    \nA script block looks like this:\n\n```\n<script type = \"text/javascript\">\n\
    </script>\n```\n\nThe actual code would be added between the HTML `<script>` and\
    \ `</script>` tags.\n\nAlternatively, JavaScript code may be separated from the\
    \ HTML code by writing all the JavaScript code inside a JavaScript file. This\
    \ is simply a text document, that is saved with a .js file extension, and contains\
    \ no HTML tags whatsoever.\n\nThe script reference should still be placed in the\
    \ document head section with an added src attribute pointing the browser to the\
    \ URL of the JavaScript file, as in this example:\n\n```\n<script type = \"text/javascript\"\
    \ src=\"mycode.js\">\n</script>\n```\n\nThis is a better method than writing the\
    \ code in a script block within the HTML document as it makes the code easier\
    \ to maintain, avoids conflicts between JavaScript and XML, and allows the JavaScript\
    \ code to be accessible to several HTML documents.\n\nMost JavaScript examples\
    \ listed in this book are written in JavaScript files that are named as their\
    \ HTML counterparts. For instance, hello.html calls upon the JavaScript code in\
    \ hello.js.\n\n> Don't forget Notice that the </script> closing tag is still required.\n\
    \n## Hello World\n\nTo make a JavaScript alert dialog box appear is just a matter\
    \ of calling the intrinsic JavaScript alert() function, like this:\n\n```\nalert(\"\
    Hello World\");\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_11_0.png)\n\n\
    This script can now be included in an HTML document by adding a <script> element\
    \ specifying its type and URL address:\n\n```\n<head>\n  <title>Hello World</title>\n\
    \  <script type=\"text/javascript\" src=\"hello-alert.js\">\n  </script>\n</head>\n\
    ```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_11_1.png)\n\nWhen this document\
    \ is loaded into the web browser the JavaScript engine implements the instructions\
    \ contained in the JavaScript code.\n\nIn this case, the JavaScript code causes\
    \ the browser to open an alert() dialog box bearing the message contained within\
    \ the quotation marks inside the parentheses.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_11_2.png)\n\
    \nThis same method of including JavaScript files in an HTML document is used by\
    \ all the examples in this book.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_11_3.png)\n\
    \nThe dialog's title bar may contain a different title – but this is not controlled\
    \ by JavaScript.\n\nThe quotation marks inside the parentheses do not actually\
    \ appear as part of the message because they are used by JavaScript to denote\
    \ a string of characters that is the text content of the message itself.\n\nAll\
    \ text strings in JavaScript are contained in this way.\n\n## Syntax rules\n\n\
    Notice that there is a semicolon character at the end of the JavaScript statement\
    \ on the facing page to comply with the required JavaScript language syntax rules.\n\
    \nThis must be added at the end of every JavaScript statement – in the same way\
    \ that a period is used to terminate a sentence in the English language syntax\
    \ rules.\n\nMost importantly, JavaScript is a case-sensitive language where \"\
    ALERT\", \"Alert\" and \"alert\" are seen as three different words.\n\nAll JavaScript\
    \ keywords are in lower case only, using ALERT(\"Hello World\") or Alert(\"Hello\
    \ World\") in the previous example would not call the JavaScript alert() function.\n\
    \nSpaces, tabs and new lines are collectively known as whitespace and are completely\
    \ ignored by JavaScript, so the code may be formatted and indented to make its\
    \ appearance more easily human-readable.\n\nIt is often useful to add comments\
    \ to JavaScript code as explanation. The parser sees any text between // and the\
    \ end of that line as a single-line comment, which it ignores. Also any text,\
    \ on one or more lines, between /* and * / is ignored.\n\n```\n/* Here is an introduction\n\
    to this script code that\nuses a multi-line comment */\n\n// This is a single-line\
    \ comment\n\n// Display a greeting\nalert(\"Hello World\");\n```\n\nExcessive\
    \ commenting is best avoided – this can dramatically increase the size of a JavaScript\
    \ file.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_12_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_12_1.png)\n\
    \n## Keywords\n\nThe following table contains keywords that are part of the JavaScript\
    \ language syntax. These may not be used when choosing identifier names for variables,\
    \ functions or labels:\n\n| break | export | new | var |\n|---|---|---|---|\n\
    | case | false | null | void |\n| continue | for | return | while |\n| default\
    \ | function | switch | with |\n| delete | if | | |\n| do | import | true | |\n\
    | else | in | typeof | | |\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_13_0.png)\n\
    \nAdditionally, JavaScript reserves the words listed in the table below for future\
    \ use in the syntax:\n\n| abstract | enum | super |\n|---|---|---|\n| boolean\
    \ | extends | long |\n| catch | finally | package |\n| class | goto | protected\
    \ |\n| const | instanceof | short |\n| debugger | interface | throw |\n| double\
    \ | int | static |\n\n## Variables\n\nA variable is a place in which to store\
    \ data. When naming variables any combination of letters, digits and underscore\
    \ is valid but they cannot begin with a digit.\n\n> Hot tip\nChoose meaningful\
    \ names for variables.\n\n```javascript\n// create a variable\nvar message = \"\
    First Variable\";\n```\n\nThe string is stored in the message.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_14_0.png)\n\
    \nThe alert() function opens the dialog box.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_14_1.png)\n\
    \n## Data types\n\nJavaScript is a loosely typed language so its variables can\
    \ store numbers, strings or boolean values. This is unlike other languages such\
    \ as C++ and Java where you need to declare variables of a specific type.\n\n\
    ```javascript\n// initialize a number\nvar a = 0;\n\n// initialize a string\n\
    var b = \"JavaScript\";\n\n// initialize a boolean variable\nvar c = false;\n\n\
    // display the data type of each\nalert(typeof a + \"\\n\" + typeof b + \"\\n\"\
    \ + typeof c);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_15_0.png)\n\n\
    The example above creates variables with the three data types supported by JavaScript.\
    \ These three values are first passed to the alert() function; then the JavaScript\
    \ keyword typeof is used to return their data types for display in the alert box.\n\
    \nThe code + \"\\n\" inside the parentheses just displays the output for each\
    \ value on a new line in the alert box.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_15_1.png)\n\
    \nHot tip\nNotice that JavaScript makes no distinction between integer numbers\
    \ and floating-point numbers.\n\n## Escape sequences\n\nWhen a character in a\
    \ string is preceded by the \\ back character there is a special effect on the\
    \ character immediately following the backslash. This is known as an escape sequence\
    \ as it allows the character to escape recognition as part of the JavaScript syntax.\n\
    \nThe table below lists more escape sequences:\n\n| b | Backspace |\n| \\f | Form\
    \ feed |\n| \\n | New line |\n| \\r | Carriage return |\n| \\' | Single quote\
    \ |\n| \\\" | Double quote |\n| \\\\ | Single backslash character |\n\n> Hot tip\n\
    The code example on the facing page uses the \\n newline escape.\n\nThe escape\
    \ sequence \\\" is useful to incorporate quotation marks within a string without\
    \ the string itself becoming terminated, as in this example:\n\n```javascript\n\
    // display the string with escaped quotes\nalert(\"We all say \\\"JavaScript is\
    \ great!\\\"\");\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_16_0.png)\n"
  mdcn: "\n\n## 在 HTML 中引入 JavaScript\n\n为了在 Web 文档包含 JavaScript，可以在 HTML 代码中定义一个脚本（script）块。\n\
    \n脚本块可以定义在 HTML 代码的任何位置，但通常的位置是文档的 `head` 部分，即 `<head>` 标签和 `</head>` 标签之间。\n\n\
    当浏览器加载文档时，它会按顺序读取（解析）代码。因此，将脚本块放在文档的头部部分可以确保 JavaScript 代码在其余 HTML 代码和文档正文内容之前被解析。\n\
    \n脚本块的形式如下：\n\n```\n<script type = \"text/javascript\">\n</script>\n```\n\n实际代码会被添加到\
    \ HTML 的 `<script>` 和 `</script>` 标签之间。\n\n或者，也可以通过将所有 JavaScript 代码写在一个 JavaScript\
    \ 文件中，将其与 HTML 代码分离。这仅仅是一个文本文档，以 .js 扩展名保存，且不包含任何 HTML 标签。\n\n脚本引用仍然应该放置在文档的 `head`\
    \ 部分，并添加 `src` 属性以引导浏览器指向 JavaScript 文件的 URL，如下例所示：\n\n```\n<script type = \"\
    text/javascript\" src=\"mycode.js\">\n</script>\n```\n\n这种方法比在 HTML 文档的脚本块中编写代码更好，因为它使代码更易维护，避免了\
    \ JavaScript 与 XML 之间的冲突，并允许 JavaScript 代码被多个 HTML 文档访问。\n\n书中列出的大多数 JavaScript\
    \ 示例都是写在与其 HTML 对应同名的 JavaScript 文件中的。例如，hello.html 调用了 hello.js 中的 JavaScript\
    \ 代码。\n\n> 注意，注意 `</script>` 结束标签仍然是需要的。\n\n## Hello World\n\n让 JavaScript 警告对话框出现只需调用内生的\
    \ JavaScript `alert()` 函数，如下：\n\n```\nalert(\"Hello World\");\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_11_0.png)\n\
    \n现在可以通过添加一个指定其类型和 URL 地址的 `<script>` 元素将此脚本包含在 HTML 文档中：\n\n```\n<head>\n  <title>Hello\
    \ World</title>\n  <script type=\"text/javascript\" src=\"hello-alert.js\">\n\
    \  </script>\n</head>\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_11_1.png)\n\
    \n当此文档加载到 浏览器时，JavaScript 引擎会执行 JavaScript 代码中包含的指令。\n\n在这种情况下，JavaScript 代码会导致浏览器打开一个带有括号内引号消息的\
    \ `alert()` 对话框。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_11_2.png)\n\n书中所有的示例都使用了这种将\
    \ JavaScript 文件包含在 HTML 文档的方法。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_11_3.png)\n\
    \n对话框的标题栏可能包含不同的标题——但这不受 JavaScript 控制。\n\n括号内的引号实际上不会作为消息的一部分出现，因为它们被 JavaScript\
    \ 用来表示字符字符串，该字符串就是消息本身的文本内容。\n\nJavaScript 中的所有文本字符串都是这样包含的。\n\n## 语法规则\n\n注意，对应页的\
    \ JavaScript 语句末有一个分号字符，以符合要求的 JavaScript 语言语法规则。\n\n这必须添加到每个 JavaScript 语句的末尾——就像英语语法规则中使用句号来结束句子一样。\n\
    \n最重要的是，JavaScript 是一种区分大小写的语言，其中 \"ALERT\"、Alert\" 和 \"alert\" 被视为三个不同的单词。\n\n\
    所有的 JavaScript 关键字仅全小写，在之前的示例中使用 ALERT(\"Hello World\") 或 Alert(\"Hello World\"\
    ) 不会调用 JavaScript `alert()` 函数。\n\n空格、制表符和换行符统称为空白字符，JavaScript 会完全忽略它们，因此可以对代码进行格式化和缩进，使其外观更易人类阅读。\n\
    \n在 JavaScript 代码中添加注释作为解释通常很有用。解析器将 `//` 到该行结束之间的任何文本视为单行注释，并会忽略它。同样，`/*` 和 `*/`\
    \ 之间的一个行或多行的任何文本都会被忽略。\n\n```\n/* 这里是对此脚本代码的介绍\n它使用了多行注释 */\n\n// 这是一个单行注释\n\n\
    // 显示问候\nalert(\"Hello World\");\n```\n\n最好避免过过多的注释——这会显著增加 JavaScript 文件的大小。\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_12_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_12_1.png)\n\
    \n## 关键字\n\n下表包含了 JavaScript 语言语法的一部分的关键字。在为变量、函数或标签选择标识符名称时，不能使用这些：\n\n| break\
    \ | export | new | var |\n|---|---|---|---|\n| case | false | null | void |\n\
    | continue | for | return | while |\n| default | function | switch | with |\n\
    | delete | if | | |\n| do | import | true | | |\n| else | in | typeof | |\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_13_0.png)\n\n此外，JavaScript 保留了下表列出的单词供未来使用：\n\
    \n| abstract | enum | super |\n|---|---|---|\n| boolean | extends | long |\n|\
    \ catch | finally | package |\n| class | goto | protected |\n| const | instanceof\
    \ | short |\n| debugger | interface | throw |\n| double | int | static |\n\n##\
    \ 变量\n\n变量是存储数据的地方。在命名变量时，字母、数字和下划线的任何组合都是合法的，但不能以数字开头。\n\n> 提示：为变量选择有意义的名字。\n\
    \n```javascript\n// 创建变量\nvar message = \"First\";\n```\n\n字符串存储在 message 中。\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_14_0.png)\n\n`alert()` 函数打开对话框。\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_14_1.png)\n\n## 数据类型\n\nJavaScript 是一种松类型语言，因此变量可以存储数字、字符串或布尔值。这不像\
    \ C++ 和 Java 等语言，那些语言需要声明特定变量。\n\n```javascript\n// 初始化数字\nvar a = 0;\n\n// 初始化字符串\n\
    var b = \"JavaScript\";\n\n// 初始化布尔变量\nvar c = false;\n\n// 显示每个数据的类型\nalert(typeof\
    \ a + \"\\n\" + typeof b + \"\\n\" + typeof c);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_15_0.png)\n\
    \n上面的示例创建了 JavaScript 支持的三种数据类型。这三个值首先传递给 `alert()` 函数；然后使用 JavaScript 关键字 `typeof`\
    \ 返回它们的数据类型以便在对话框中显示。\n\n括号内的 `+ \"\\n\"` 代码在对话框中换行显示每个值的输出。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_15_1.png)\n\
    \n> 提示：注意 JavaScript 不区分整数和浮点数。\n\n## 转义序列\n\n当字符串中的字符前面有一个 `\\` 反斜杠字符时，会对紧随其后的字符产生特殊影响。这被称为转义序列，因为它允许该字符逃逸对\
    \ JavaScript 语法的识别。\n\n下表列出了更多的转义序列：\n\n| b | 退 (Backspace) |\n| \\f | 换页 (Form\
    \ feed) |\n| \\n | 换行 (New line) |\n| \\r | 回车 (Carriage return) |\n| \\' | 单引号\
    \ |\n| \\\" | 双引号 |\n| \\\\ | 单反斜杠字符 |\n\n>对应页的代码示例使用了 `\\n` 换行转义。\n\n转义序列 `\\\
    \"` 有助于在字符串内部包含引号而不会导致字符串本身终止，如下例所示：\n\n```javascript\n// 显示带有转义引号的字符串\nalert(\"\
    We all say \\\"JavaScript is great!\\\"\");\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_16_0.png)\n\
    \n"
