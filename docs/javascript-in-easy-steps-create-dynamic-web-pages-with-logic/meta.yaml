  - '[PAGE 77]


    # Generating random numbers


    Random numbers can be generated using the Math.random() method to return a floating-point
    value between 0.0 and 1.0. This method can be used to create a series of random
    number selections, like a lottery draw, and is popular for producing random effects
    within web pages.


    Multiplying the random number will specify a wider range so, for example, a multiplier
    of 10 will create a random number between 0.0 and 10.0.


    To make the randomly generated number more useful it is generally best to round
    up the returned float so that the range will become two integer values. The Math.ceil()
    method will be used to round the number up to an integer between 1 and 10 inclusive.
    The code below illustrates this technique:


    ```

    // get a random number from 0.0 to 1.0

    var rand1 = Math.random();

    // multiply by 10 to make it between 0.0 and 10.0

    var rand2 = rand1 * 10;

    // round it up to make it between 1 and 10

    var rand3 = Math.ceil( rand3 );

    ```


    ```

    // add each part to a string

    var str = "Random float [rand1]: " + rand1 + "\n";

    str += "Specify range [rand2]: " + rand2 + "\n";

    str += "Random integer [rand3]: " + rand3;

    ```


    ```

    // display the string

    alert(str);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_77_0.png)


