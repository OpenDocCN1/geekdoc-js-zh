  md: "# Reacting to window events\n\nThe Load event occurs when all the HTML elements\
    \ on a web page have completely loaded. This means that the window.onload event-handler\
    \ is only activated after all the elements are present. Typically the window.onload\
    \ event-handler will call a JavaScript function, often named \"init\", to initialize\
    \ a number of values.\n\nConversely, the Unload event occurs when the user moves\
    \ to another web page, or closes the browser, and the window.onunload event-handler\
    \ is activated.\n\nThis example sets an initial value in a form text box and displays\
    \ a final alert dialog message when the user leaves the page:\n\n```\n// specify\
    \ the onload and unload event-handlers\nwindow.onload = init;\nwindow.onunload\
    \ = term;\n\n// a function to react to the LOAD event\nfunction init() {\n   \
    \ document.getElementById(\"box-1\").value = \n    \"The Page Is Loaded\";\n}\n\
    \n// a function to react to the UNLOAD event\nfunction term() {\n    alert(\"\
    Thanks for visiting\\nCome back soon\");\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_131_0.png)\n\
    \nAn HTML event-handler assigned to the onload attribute of the <body> tag could\
    \ replace that assigned in the script.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_131_1.png)"
  merge: -1
  pgno: 131
- img_proc: true
  md: '# ...cont''d


    An Error event occurs when a runtime error is encountered, and the window.onerror
    event-handler is activated to determine how to handle the error. The window.onerror
    event handler can call upon a JavaScript function to handle the error; otherwise
    the browser will handle the error itself by opening an error dialog box.


    Once the error has been notified a true value is returned to the browser to indicate
    that the error has been dealt with. To avoid all error dialogs a custom error-handler
    function only return true when an error is encountered.


    Usefully the browser will pass three arguments to the error-handler containing
    information on the nature of the error, the URL of the file that contains the
    error, and the actual line number in that file where the error exists.


    In the example below each piece of error information passed to the error-handling
    function by the browser is displayed for the user:


    ```

    // specify an onerror error-handler

    window.onerror = errorhandler;


    // a function to react to the ERROR event

    function errorhandler( msg, url, ln ) {


    alert("Error: " + msg + " \nIn File: " + url + " \nAt Line: " + ln + ");


    return true; // tell the browser it''s been handled

    }


    // A deliberate mistake - this item does not exist

    document.getElementById("btn").value = "myButton";

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_132_0.png)


    The error-handler must be specified at the top of the script to catch all possible
    errors.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_132_1.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_132_2.png)'
  merge: -1
