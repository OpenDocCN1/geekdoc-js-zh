  - "[PAGE 39]\n\n# # If-else statement\n\nThe JavaScript else keyword can be used\
    \ with an if statement to provide alternative code to execute, in the event that\
    \ the test expression returns false.\n\nThis is known as conditional branching\
    \ and it has this syntax:\n\n```\nif (test expression) do-this : else do-this\
    \ :\n```\n\nSeveral expressions may be tested until a true value is found, when\
    \ the code following the true expression will be executed. It is important to\
    \ note that any further code contained in the if-else statement is ignored.\n\n\
    So in the following example any code after the call to the alert() function by\
    \ the third test will be ignored:\n\n```\nvar num = 2, bool = false;\n// is the\
    \ number 1 and the boolean value true\nif(num == 1 && bool == 1)\n  alert(\"TEST1:\
    \ \" + bool);\nelse\n// is the number 2 and the boolean value true\nif(num ==\
    \ 2 && bool == 1)\n  alert(\"TEST2: \" + bool);\nelse\n// is the number 2 and\
    \ the boolean value false\nif(num == 2 && bool == 0)\n  alert(\"TEST3: \" + bool);\n\
    else\n// is the number 3 and the boolean value false\nif(num == 3 && bool == 0)\n\
    \  alert(\"TEST4: \" + bool);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_39_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_39_1.png)\n\nBoolean values in JavaScript\
    \ can also be represented numerically as 1 (true) and 0 (false).\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_39_2.png)"
- md: "\n# Switch statement\n\nConditional branching using the if-else statement may\
    \ be efficiently performed using a switch statement when a test expression evaluates\
    \ the value of just one variable.\n\nThe switch statement works in an unusual\
    \ way – first it evaluates a given expression, and then it seeks a label to match\
    \ the resulting value. The code associated with the matching label will be executed\
    \ or, if no match is found, the statement will execute any default code.\n\nThe\
    \ JavaScript case keyword is used to denote a label and the default keyword denotes\
    \ the code. All label code must be terminated by a break statement using the break\
    \ keyword.\n\nThe labels may be numbers, strings or booleans but must be all of\
    \ the same type, as in this example they are all numbers:\n\n```javascript\nvar\
    \ num = 2;\nswitch(num)\n{\n  // is the number 1 ?\n  case 1 : alert(\"This is\
    \ case 1 code\"); break;\n\n  // is the number 2 ?\n  case 2 : alert(\"This is\
    \ case 2 code\"); break;\n\n  // is the number 3 ?\n  case 3 : alert(\"This is\
    \ case 3 code\"); break;\n\n  // if it is none of those numbers, do this...\n\
    \  default : alert(\"This is default code\");\n}\n```\n\nFor more detail on the\
    \ break statement see page 44.\n\nswitch.js\n\nOmitting the break keywords at\
    \ the ends of the cases will allow execution of all other code in the switch statement.\n\
    \n# For loops\n\nThe for loop is probably the most frequently used type of loop\
    \ in JavaScript and has this syntax:\n\n```javascript\nfor ( initializer , test\
    \ , increment ) statement :\n```\n\nThe initializer is used to set the start value\
    \ for the counter of the number of loop iterations. A variable may be declared\
    \ here for this purpose and it is traditional to name it i.\n\nAt each pass of\
    \ the loop a boolean condition is tested and the next iteration of the loop will\
    \ only run if the condition is true. If the test returns false then the loop will\
    \ end.\n\nWith every iteration the counter is incremented and then the loop will\
    \ execute the code in the statement. Multiple statements can be executed if they\
    \ are contained by curly braces in a statement block.\n\nThe following example\
    \ makes five iterations and changes the assigned values of two variables at each\
    \ pass:\n\n```javascript\nvar a = 0, b = 0;\n// initialize counter at 0; then\
    \ loop until it hits 5\nfor (var i = 0; i < 5; i++) {\n  // increment variable\
    \ values on each iteration\n  a += 10; b += 5;\n}\n\n// display the final values\
    \ after the loop ends...\nalert(\"FOR LOOP\\n A is \" + a + \"... B is \" + b);\n\
    ```\n\nA for loop can also count down decrementing the counter at each iteration.\n\
    \n# The for-in loop\n\nThe for-in loop has a special use to enumerate all the\
    \ variables or properties contained within an object. This loop is seldom used\
    \ in regular JavaScript but is included here because it can reveal the properties\
    \ available for manipulation within a web browser. The following example reveals\
    \ a tantalizing glimpse of the properties available within the window object of\
    \ a web browser:\n\n```javascript\nvar i = 0; a = \"\";\n\n// list all window\
    \ properties in a variable\nfor ( property in window )\n{ a += property + \"...\"\
    ; }\n\n// display the window properties properties list\nalert( a );\n```\n\n\
    > Don't forget\n> The properties revealed will vary depending on the browser and\
    \ its version.\n\n# While loops\n\nAnother kind of loop uses the JavaScript while\
    \ keyword followed by an expression to be evaluated for a boolean value.\n\nIf\
    \ the evaluation returns true then the code in the statement block will be executed.\
    \ After the code has executed the test expression will be evaluated again and\
    \ the loop will continue until the evaluation returns false.\n\nThe statement\
    \ block must feature code that will affect the test expression in order to change\
    \ the evaluation to return false – otherwise an infinite loop will be created.\n\
    \nAn infinite loop will lock the script and crash the browser.\n\nIt is important\
    \ to note that if the test expression returns false when it is first evaluated\
    \ the code in the statement block is never executed.\n\nThis example decrements\
    \ a variable value on each iteration of the loop. The counter increments until\
    \ the evaluation returns false and reaches 10 when the loop ends.\n\n```javascript\n\
    var i = 0; num = 50;\n// loop until the counter hits 10\nwhile(i < 10 )\n{\n \
    \ num--;\n  i++;\n}\n```\n\nwhile.js\n// display the final counter and number\n\
    alert(\"Loop stopped at \" + i + \"\\nnum is now \" + num);\n\n# The do-while\
    \ loop\n\nThe JavaScript keyword is used to denote the start of a do-while loop\
    \ and is followed by a statement block containing the code to be executed by the\
    \ loop. The statement code is followed by while and an expression to be evaluated\
    \ for a boolean value of true or false.\n\nIf the evaluation returns true the\
    \ loop restarts at do and will continue until the evaluation returns false.\n\n\
    It is important to note that, unlike the simple while loop, the statement code\
    \ will be executed at least once by the do-while loop because the test expression\
    \ is not encountered until the end of the loop.\n\nThe following example will\
    \ never loop because the counter value is incremented to 1 in the first execution\
    \ of the statement code so the first evaluation will return false:\n\n```javascript\n\
    var i = 0, num = 50;\n// loop until the counter hits 1\ndo {\n  num--;\n  i++;\n\
    } while (i < 1);\n```\n\n// display the final counter and number values\nalert(\"\
    Loop stopped at \" + i + \"\\nnum is now \" + num);\n\n> Hot tip\n> A while loop\
    \ is often more suitable than a do-while loop.\n\n# Break statement\n\nThe JavaScript\
    \ break keyword is used to terminate the execution of a loop prematurely. The\
    \ break keyword is situated inside the statement block containing the code that\
    \ the loop should execute and is preceded by a conditional test.\n\nWhen the test\
    \ condition is met the break statement immediately terminates the loop and no\
    \ further iterations are made.\n\nNotice in the alert() output that the counter\
    \ value is still 3 because the increment in the final iteration is not applied.\n\
    \nIn the following example the conditional test will return true when the counter\
    \ value reaches 3:\n\n```javascript\nvar i = 0;\n// loop until the counter hits\
    \ 6\nwhile(i < 6 )\n{\n  if( i == 3 ) break;\n  i++;\n}\n\n// display the final\
    \ counter value\nalert(\"BREAK\\n\\nLoop stopped at \" + i);\n```\n\n# Continue\
    \ statement\n\nThe JavaScript continue keyword is used to break the current iteration\
    \ of a loop. Just like the break keyword, the continue keyword is situated inside\
    \ the statement block containing the code that the loop should execute, preceded\
    \ by a conditional test.\n\nWhen the continue condition is met the continue keyword\
    \ immediately stops the current iteration of the loop, but further iterations\
    \ will be made until the loop ends.\n\nIn the example below the test condition\
    \ is met when the counter value reaches three so the string concatenation in iteration\
    \ is not applied but the loop continues on:\n\n```javascript\nvar i = 0, str =\
    \ \"\";\n// loop until the counter hits 5\nwhile(i < 5) {\n  i++;\n  if(i == 3)\
    \ continue;\n  str += i + \" \";\n}\n```\n\n// display final value and all series\
    \ numbers\nalert(\"CONTINUE\\n\\nLoop stopped:\" + i + \"\\n\\nSeries:\" + str);\n\
    \nThe loop counter should be incremented before the continue condition is tested\
    \ to avoid creating an infinite loop.\n"
  mdcn: "\n\n# switch 语句\n\n当测试表达式仅评估一个变量的值时，使用 `switch` 语句可以比 `if-else` 语句条件分支更高效。\n\
    \n`switch` 语句的工作方式独特——它首先评估给定的表达式，然后寻找与结果值匹配的标签。与匹配标签关联的代码将被执行；或者如果没有找到匹配项，则该语句将执行任何默认代码。\n\
    \nJavaScript 中的 `case` 关键字用于表示标签，`default` 关键字表示默认代码。所有标签代码都必须使用 `break` 关键字的\
    \ `break` 语句来终止。\n\n标签可以是数字、字符串或布尔值，但类型必须相同，例如在本例中，它们都是数字：\n\n```javascript\n\
    var num = 2;\nswitch(num)\n{\n  // 是数字 1 吗？\n  case 1 : alert(\"This is case 1\
    \ code\"); break;\n\n  // 是数字 2 吗？\n  case 2 : alert(\"This is case 2 code\");\
    \ break;\n\n  // 是数字 3 吗？\n  case 3 : alert(\"This is case 3 code\"); break;\n\
    \n  // 如果不是这些数字中的任何一个，则执行此\n  default : alert(\"This is default code\");\n}\n\
    ```\n\n关于 `break` 语句的更多细节，请参阅第 44 页。\n\nswitch.js\n\n在 `case` 末尾省略 `break` 关键字将允许执行\
    \ `switch` 语句中的所有其他代码。\n\n# for 循环\n\n`for` 循环可能是 JavaScript 中最常用的循环类型，其语法如下：\n\
    \n```javascript\nfor ( initializer , test , increment ) statement :\n```\n\n初始化器用于设置循环迭代次数计数器的起始值。可以在此处声明一个变量用于此目的，传统上将其命名为\
    \ `i`。\n\n在循环的每次通过中，都会测试一个布尔条件，只有当条件为真时，循环的下次迭代才会运行。如果测试返回 `false`，则循环结束。\n\n\
    每次迭代时计数器都会增加，然后循环将执行语句中的代码。如果多个语句被包含在大括号的语句块中，则可以执行多条语句。\n\n以下示例执行五次迭代，并在每次通过时更改两个变量的赋值：\n\
    \n```javascript\nvar a = 0, b = 0;\n// 初始化计数器为 0；然后循环直到达到 5\nfor (var i = 0; i\
    \ < 5; i++) {\n  // 每次迭代增加变量值\n  a += 10; b += 5;\n}\n\n// 在循环结束后显示最终值...\nalert(\"\
    FOR LOOP\\n A is \" + a + \"... B is \" + b);\n```\n\n`for` 循环也可以通过在每次迭代时减少计数器来倒计时。\n\
    \n# for-in 循环\n\n`for-in` 循环有一个特殊用途，用于枚举对象中包含的所有变量或属性。这种循环在常规 JavaScript 中很少使用，但包含在这里是因为它可以揭示\
    \ Web 浏览器中可以操作的属性。以下示例展示了 Web 浏览器 `window` 对象中可用属性的预览：\n\n```javascript\nvar i\
    \ = 0; a = \"\";\n\n// 在变量中列出所有 window 属性\nfor ( property in window )\n{ a +=\
    \ property + \"...\"; }\n\n// 显示 window 属性列表\nalert( a );\n```\n\n> 注意\n> 揭的属性将根据浏览器及其版本而异。\n\
    \n# while 循环\n\n另一种循环使用 JavaScript `while` 关键字，后跟一个要评估为布尔值的表达式。\n\n如果评估返回 `true`，则将执行语句块中的代码。代码执行后，将再次评估测试表达式，循环将持续直到评估返回\
    \ `false`。\n\n语句块必须包含能够影响测试表达式的代码，以便将评估结果改为返回 `false`——否则将创建死循环。\n\n死循环将锁定脚本并导致浏览器崩溃。\n\
    \n注意的是，如果测试表达式在首次评估时返回 `false`，则语句块中的代码将永远不会执行。\n\n此示例在循环的每次迭代中递减变量值。计数器一直增加直到评估返回\
    \ `false`，并在循环结束时达到 10。\n\n```javascript\nvar i = 0; num = 50;\n// 循环直到计数器达到 10\n\
    while(i < 10 )\n{\n  num--;\n  i++;\n}\n```\n\nwhile.js\n// 显示最终计数器和数字\nalert(\"\
    Loop stopped at \" + i + \"\\nnum is now \" + num);\n\n# do-while 循环\n\nJavaScript\
    \ 关键字用于表示 `do-while` 循环的开始，后跟着一个包含循环执行代码的语句块。语句代码后是 `while` 和一个要评估为布尔值 `true`\
    \ 或 `false` 的表达式。\n\n如果评估返回 `true`，循环从 `do` 处重新开始，并持续直到评估返回 `false`。\n\n注意的是，与简单的\
    \ `while` 循环不同，`do-while` 循环至少会执行一次语句代码，因为在循环结束之前不会遇到测试表达式。\n\n以下示例将永远不会循环，因为计数器值在语句代码的第一次执行时增加到了\
    \ 1，所以第一次评估将返回 `false`：\n\n```javascript\nvar i = 0, num = 50;\n// 循环直到计数器达到 1\n\
    do {\n  num--;\n  i++;\n} while (i < 1);\n```\n\n// 显示最终计数器和数字值\nalert(\"Loop\
    \ stopped at \" + i + \"\\nnum is now \" + num);\n\n> 小贴士\n> `while` 循环通常比 `do-while`\
    \ 循环更合适。\n\n# break 语句\n\nJavaScript `break` 关键字用于提前终止循环的执行。`break` 关键字位于包含循环执行代码的语句块内部，并由条件测试引导。\n\
    \n当满足测试条件时，`break` 语句立即终止循环，不再进行后续迭代。\n\n注意 `alert()` 输出中的计数器值仍为 3，因为最后一次迭代没有应用递增。\n\
    \n在以下示例中，当计数器值达到 3 时，条件测试将返回 `true`：\n\n```javascript\nvar i = 0;\n// 循环直到计数器达到\
    \ 6\nwhile(i < 6 )\n{\n  if( i == 3 ) break;\n  i++;\n}\n\n// 显示最终计数器值\nalert(\"\
    BREAK\\n\\nLoop stopped at \" + i);\n```\n\n# continue 语句\n\nJavaScript `continue`\
    \ 关键字用于中断循环的当前迭代。与 `break` 关键字一样，`continue` 关键字位于包含循环执行代码的语句块内部，由条件测试。\n\n当满足条件时，`continue`\
    \ 关键字立即停止循环的当前迭代，但将继续进行迭代直到循环结束。\n\n在下面的示例中，当计数器值达到三时满足测试条件，因此迭代中的字符串拼接没有被应用，但循环会继续：\n\
    \n```javascript\nvar i = 0, str = \"\";\n// 循环直到计数器达到 5\nwhile(i < 5) {\n  i++;\n\
    \  if(i == 3) continue;\n  str += i + \" \";\n}\n```\n\n// 显示最终值和所有序列数字\nalert(\"\
    CONTINUE\\n\\nLoop stopped:\" + i + \"\\n\\nSeries:\" + str);\n\n在测试 `continue`\
    \ 条件之前应该增加循环计数器，以避免创建死循环。\n\n"
