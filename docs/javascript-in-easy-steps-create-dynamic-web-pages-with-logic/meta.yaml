    \n![](img/9706759b347c5727cfdd3d09614f8c1f_33_3.png)\n\n...续\n条件运算符可以很好用地与赋值运算符结合在单个语句中，根据测试表达式的结果分配两个值中的一个。\n\
    \n下面的示例演示了这一点，它根据测试表达式的结果分配两个字符串值之一。当变量值除以 2 没有余数时，该数字必须为偶数；但当变量除以 2 有余数时，该数字为奇数。组合语句在种情况下都分配相应的字符串值。\n\
    \n```javascript\n// 分配两个整数值\nvar a = 4;\nvar b = 7;\n\n// 将存储的值评估为奇数或偶数\nvar al\
    \ = ( a % 2 == 0 ) ? \"EVEN\" : \"ODD\";\nvar bl = ( b % 2 == 0 ) ? \"EVEN\" :\
    \ \"ODD\";\n\n// 显示评估结果\nalert(a + \" is \" + al + \"\\n\\n\" + b + \" is \" +\
    \ bl);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_34_0.png)\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_34_1.png)\n\
    \n# 总结\n\n- JavaScript 有七种算术运算符，用于加法 (+)、减法 (-)、乘法 (*)、除法 (/)、取模 (%),自增 (++) 和自减\
    \ (--)\n- `+` 运算符也用于拼接字符串\n- 当 `++` 或 `--` 运算符放在操作数值之前时，值改变 1 并返回新值\n- 当 `++`\
    \ 或 `--` 运算符放在操作数之后时，先返回值，然后将其值改变 1\n- 逻辑与 (&&) 或逻辑 (||) 运算符评估两个操作数——`&&` 运算符在操作数都为真时返回真，但\
    \ `||` 运算符在任一操作数为真时返回真\n- 逻辑一非 (!) 运算符返回给定操作数的逻辑反反\n- 任何数据类型的值都通过赋值运算符 (=) 分配给变量\n\
    - `+` 运算符可以与算术运算符 `+=`, `-=` 或 `%=` 结合对两个操作数进行简单算术运算并赋值结果\n- 比较运算符评估两个操作数的相等 (==)、不相等\
    \ (!=) 以及大于 (>) 或小于 (<)\n- `>` 和 `<` 运算符可以与 `>=` 或 `<=` 结合，在当每个操作数完全相等时也返回真\n\
    - 条件运算符 (`?:`) 评估测试表达式并根据结果执行两个语句之一\n\n# 编写语句\n\n语句在 JavaScript 中用于推进程序的执行。它们定义了代码中的循环或简单术。本章将检查条件测试和不同类型的循环，并提供它们的用法示例。\n\
    \n- 条件 if\n- If-prompt 语句\n- If-else 语句\n- Switch 语句\n- For 循环\n- for-in 循环\n\
    - While 循环\n- do-while 循环\n- Break 语句\n- Continue 语句\n- 总结\n\n# 条件 if\n\n`if`\
    \ 关键字用于执行条件测试以评估布尔值。当表达式为真时，执行其后的语句。`if` 语句格式如下：\n\n```javascript\nif (test expression)\
    \ do-this\n```\n\n`if` 语句可以包含大括号内的语句。在下面的示例中，使用模运算符来判断变量是否能被 2 整除。组合语句在种情况下都分配一个值。\n\
    \n```javascript\n// 创建两个变量\nvar msg, num = 7;\n// 检查 num 是否为偶数\nif (num % 2 ==\
    \ 0) {\n  msg = num + \" is even\";\n}\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_38_0.png)\n\
    \n> 小提示 表达式也可以使用 `(num == 1)` 来检测偶数。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_37_1.png)\n\
    \n# If-prompt 语句\n\n`prompt()` 语句调用 JavaScript `prompt()` 函数，它需要两个参数。第一个参数是显示的消息，第二个是输入框中的默认字符串（此处为空字符串）。\n\
    \n```javascript\n// 初始化一个空值\nvar username = null;\nif (username == null) {\n \
    \ // 询问用户姓名\n  username = prompt(\"Please Enter Name\", \"\");\n  // 如果用户名不为空\n\
    \  if (username != \"\") {\n    alert(\"Welcome \" + username);\n  }\n}\n```\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_38_2.png)\n\n> 注意 提示框会打开一个空的输入框。\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_38_3.png)\n\n# If-else 语句\n\n`else` 关键字可以与\
    \ `if` 语句配合，在测试表达式返回假时提供备执行代码。这被称为条件分支，其语法如下：\n\n```javascript\nif (test expression)\
    \ do-this else do-this\n```\n\n可以测试多个表达式，直到找到真值，此时执行真表达式后的代码。请注意，`if-else` 语句中的后续代码将被忽略。\n\
    \n因此在下面的示例中，第三次测试调用 `alert()` 函数后的任何代码都将被忽略：\n\n```javascript\nvar num = 2, bool\
    \ = false;\n// 是 1 且布尔值为真\nif(num == 1 && bool == 1)\n  alert(\"TEST1: \" + bool);\n\
    else\n// 是 2 且布尔值为真\nif(num == 2 && bool == 1)\n  alert(\"TEST2: \" + bool);\n\
    else\n// 是 2 且布尔值为假\nif(num == 2 && bool == 0)\n  alert(\"TEST3: \" + bool);\n\
    else\n// 是 3 且布尔值为假\nif(num == 3 && bool == 0)\n  alert(\"TEST4: \" + bool);\n\
    ```\n\n"
