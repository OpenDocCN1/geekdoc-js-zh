    # Summary


    +   JavaScript is a programming language whose code is interpreted when parsed
    by the JavaScript engine within a web browser


    +   JavaScript code can be contained within a <script> block in an HTML document,
    or in a separate JavaScript file


    +   Calling the intrinsic alert() function will open an alert dialog box in the
    browser – displaying the argument specified within its parentheses


    +   JavaScript is a case-sensitive language that recognizes “ALERT”, “Alert” and
    “alert” as entirely different words


    +   Single-line comments can be added to a script after // and multi-line comments
    can be added between /* and */


    +   Keywords cannot be used to name variables, functions or labels


    +   The JavaScript var keyword is used to create a new variable to store any data
    type – string, number or boolean value


    +   Escape sequences are useful to insert characters that are not to be interpreted
    by the JavaScript engine


    +   The JavaScript function keyword is used to create a new function that can
    be called at any time to execute its statements


    +   A function block may contain statements that call other functions


    +   The statement calling a function may specify one or more values to be passed
    to the function as arguments within its parentheses


    +   Local variables are declared inside a function block and are only accessible
    by code within that function


    +   Global variables are declared outside function blocks and are accessible to
    all functions within the script'
