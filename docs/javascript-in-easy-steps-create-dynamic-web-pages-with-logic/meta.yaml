    # 总结


    - 使用 JavaScript 的 `new` 关键字结合内置的 `Date()` 构造函数创建一个 `Date` 对象


    - 每个 `Date` 对象都有特殊方法 `getDate()`、`getUTCDate()`、`getMonth()` 和 `getYear()`，它们返回代表日期各个日历组件的数值


    - 每个 `Date` 对象都有特殊方法 `getHours()`、`getMinutes()`、`getSeconds()` 和 `getMilliseconds()`，它们返回日期各个的时间部分


    - 可以使用特殊的 `getTime()` 方法获取 `Date` 对象的组合时间部分


    - 用一个组合时间减去另一个组合时间，可以发现两个时间之间的差


    - `Date` 对象的 `getHours()` 方法返回本地时间，但 `getUTCHours()` 方法返回 GMT 时的世界时间


    - 使用 `Date` 对象的 `getTimezoneOffset()` 方法将本地系统时间与世界时间比较，可以获取用户的时区


