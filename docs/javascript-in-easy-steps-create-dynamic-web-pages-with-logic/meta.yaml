    # Slicing elements into pieces


    The JavaScript Array.slice() method is useful to make a new array from an existing
    array using some of the existing element values.


    This method takes two arguments to specify the index numbers of elements in the
    original array where the new array elements start and end.


    The second argument may have a negative value to indicate the element position
    from the end of the array.


    If only a single argument is specified it will be used as the first element index
    number and the method will return a new array with all elements from this position
    onwards.


    These examples illustrate the different ways in which the Array.slice() method
    can be used:


    ```

    // create and initialize a new array

    var nums = new Array(1, 2, 3, 4, 5, 6, 7, 8 );


    // get elements #2 up to #4

    var str = "Slice A: " + nums.slice( 2, 4 ) + "\n";


    // get elements #1 to one before the final element

    str += "Slice B: " + nums.slice( 1, -1 ) + "\n";


    // get elements #3 to end

    str += "Slice C: " + nums.slice( 3 ) + "\n";


    // display all three slices

    alert(str);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_55_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_55_1.png)


    > Beware

    The array elements are taken up to, but not including, the second argument index.'
