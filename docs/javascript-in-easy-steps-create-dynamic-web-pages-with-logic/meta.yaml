    - 使用 `toString()` 方法可以将 `Date` 对象中的信息转换为字符串类型——可以使用 `toGMTString()` 方法将其转换为世界时间的字符串


    - `window.setTimeout()` 方法会创建一个定时器，需要两个参数：指定调用的函数名称以及调用它的间隔


    - 可以使用 `window.clearTimeout()` 方法停止定时器


    ## 6 数学运算


    本章专注于 JavaScript 的 `Math` 对象，并描述了可用的常量和方法。


    - 70 个 Math常量

    - 72 个 Math 方法

    - 73 比较数字

    - 74 浮点数舍入

    - 76 生成随机数

    - 78 总结


    ## Math 常量


    内置的 JavaScript 对象包含若干标准数学常量值，方便引用。


    始终使用大写字母来引用常量值，它们都列在下表中：


    | Math.E | 说明 |

    | :--- | :--- |

    | Math.E | 常数 e，自然对数的底，值约为 2.71828 |

    | Math.LN2 | 2 的自然对数，约为 0.6931471805994528623 |

    | Math.LN10 | 10 的自然对数，约为 2.302585092994049011 |

    | Math.LOG2E | e 的以2为底数，约为 1.442695040888963387 |

    | Math.LOG10E | e 的以10为底数，约为 0.4342944819032518677 |

    | Math.PI | 常数 pi，约为 3.14159265358979 |

    | Math.SQRT1_2 | 2 的平方根的倒数，约为 0.707106781186547 |

    | Math.SQRT2 | 2 的平方根，约为 1.414213562373095 |


    Math 常量可以在脚本的任何地方使用。


    大多数 Math 常量仅用于具有特定数学目的 JavaScript 应用程序，但上方列出列表是为了完整性。


    示例中使用了 `Math.PI` 常量来根据给定的半径计算圆的周长和面积。


    ```javascript

    // 请求用户输入半径大小

    var rad = prompt("Please enter radius size...");

    // 使用 πr2 计算圆面积

    var area = Math.PI * (rad * rad);


    // 使用 2πr 计算周长

    var circ = 2 * (Math.PI * rad);


    // 显示结果

    alert("Area: " + area + "\nCircumference: " + circ);

    ```


    ## Math 方法


    JavaScript `Math` 对象有很多方法。所有方法都列在下表中：


    | 方法 | 说明 |

    | :--- | :--- |

    | Math.abs() | 返回绝对值 |

    | Math.acos() | 返回反余弦 |

    | Math.asin() | 返回反正正弦 |

    | Math.atan() | 返回反正正切 |

    | Math.atan2() | 返回来自 X 轴位置的角度 |

    | Math.ceil() | 向上取整数字 |

    | Math.cos() | 返回余弦值 |

    | Math.exp() | 返回常数的指数 |

    | Math.floor() | 对自然对数向下取整 |

    | Math.log() | 返回自然对数 |

    | Math.max() | 返回两个数字中的较大者 |

    | Math.min() | 返回两个数字中的较小者 |

    | Math.pow() | 返回幂值 |

    | Math.random() | 返回随机数 |

    | Math.round() | 四舍五入到整数 |

    | Math.sin() | 返回正弦值 |

    | Math.sqrt() | 返回平方根 |

    | Math.tan() | 返回正切值 |


    上述列表中最常用的 Math 方法将在接下来的页面中进行详细介绍。


    ## 比较数字


    `Math` 对象有两个方法可以比较两个数字并返回较大或较小的值。


    `Math.max()` 接受两个用于比较的值并将返回两者中的较大值。


    `Math.min()` 方法的工作方式相同，但返回给定值中的较小值。


    在示例中，`Math.pow()` 方法被用来创建平方和立方值，然后与 `Math.max()` 和 `Math.min()` 进行比较。`Math.pow()`
    方法需要两个参数来指定数字和它的幂次数：


    ```javascript

    var sq = Math.pow(2, 2);

    var cube = Math.pow(2, 3);

    var max = Math.max(sq, cube); // 8

    var min = Math.min(sq, cube); // 4

    ```


