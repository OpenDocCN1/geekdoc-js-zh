  md: '# Setting form attributes


    The window.document.forms object contains an array of all the forms in the HTML
    document, indexed in the order which they appear in the HTML document. For instance,
    window.document.forms[0] addresses the first form to appear in the HTML code of
    a web page.


    If the <form> element has been assigned a value then the form can be addressed
    by value. So the id of "f" can be addressed as document.forms.f.


    All other attributes assigned to the <form> tag are also accessible as properties
    of that form object. For this form ...


    ```

    <form id = "f" method = "post"

    action = "mailto:a@b.com" enctype = "text/plain">

    ```


    ... the following JavaScript function can be called from the HTML <body> tag''s
    onload attribute to reveal the form properties:


    ```

    function form_info() {

    // get the form name

    var msg = "Name: " + document.forms.f.id;

    // get the form method, action and encoding type

    msg += "\nMethod: " + document.forms.f.method;

    msg += "\nAction: " + document.forms.f.action;

    msg += "\nEnctype: " + document.forms.f.encoding;

    alert(msg);

    }

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_143_0.png)


    form-properties.js


    ![](img/9706759b347c5727cfdd3d09614f8c1f_143_1.png)


    The form in this example could alternatively be addressed in the W3C DOM using
    document.getElementById("f").'
  merge: -1
