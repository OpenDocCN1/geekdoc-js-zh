    \ 样式设置为“hidden”。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_163_0.png)\n\n避免创建相邻的活动区域\
    \ —— 始终留出小间隙，以便让鼠标事件在触发另一个 `mouseover` 事件之前触发。此示例中的区域覆盖了图像中的脸。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_163_1.png)\n\
    \npopup-layers.html (图像映射)\n\n```html\n<img src=\"couple.jpg\" usemap=\"#couple\"\
    \ />\n<map id=\"couple\" name=\"couple\">\n<area shape=\"rect\" coords=\"41.26.138,143\"\
    \nmouseover=\"toggle('sal', 1)\"\nonmouseout=\"toggle('sal', 0)\" />\n<area shape=\"\
    poly\" coords=\"244.69,208.132,202, \n185.227,205,298.171,318.110,247,65\"\nmouseover=\"\
    toggle('har', 1)\"\nonmouseout=\"toggle('har', 0)\" />\n</map>\n```\n\n...续\n\n\
    ```javascript\n// 用于切换的函数\nfunction toggle(str, n) {\n  // 存储对象的变量\n  var obj;\n\
    \  // 获取对应的对象\n  obj = window.document.getElementById(str);\n  // 设置可见性状态\n  obj.style.visibility\
    \ = (n == 1) ? \"visible\" : \"hidden\";\n}\n```\n\n## 插入内容\n\nJavaScript 使用 `innerHTML`\
    \ 属性动态地向元素插入内容。下面的示例通过 `window.onload` 事件在 `<div>` 中显示时间。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_165_0)\n\
    \n```javascript\n// 显示时间的函数\nfunction tick() {\n  // 创建 Date 对象\n  var now = new\
    \ Date();\n\n  // 提取时、分、秒\n  var hh = now.getHours();\n  var mn = now.getMinutes();\n\
    \  var ss = now.getSeconds();\n\n  // 确保是两位\n  if(hh <= 9) hh = \"0\" + hh;\n\
    \  if(mn <= 9) mn = \"0\" + mn;\n  if(ss <= 9) ss = \"0\" + ss;\n\n  // 将当前时间字符串赋值\
    \ div\n  window.getElementById(\"clock\").innerHTML = hh + \": \" + mn + \": \"\
    \ + ss;\n\n  // 设置每秒调用一次此\n  window.setTimeout(\"tick\", 1000);\n}\n\n// 页面加载时启动时钟\n\
    window.onload = tick;\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_166_0.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_166_1.png)\n\n> **注意**：h1 元素中的内容不受动态变化的影响。\n\
    \n## 制作幻灯片\n\nJavaScript 可以旋转图像以创建一个按设定间隔更新当前图片的自动幻灯片。\n\n在此脚本中，预加载程序将所有图像下载到浏览器缓存中以便随时显示。旋转速度（毫秒）由赋值给变量\
    \ `pause` 的值决定。\n\n变量 `n` 是由 `rotate()` 函数增加的计数器，用于显示 `window.imgs[]` 数组中的索引图像。所有图像具有相同的尺寸和较小的文件大小，以避免下载延迟。\n\
    \n> **提示**：只需向 `imgs[]` 数组中添加图像文件名即可扩展幻灯片。\n\n```javascript\n// 将间隔存储在变量中\nvar\
    \ pause = 3000;\n// 创建并初始化计数器\nvar n = 0;\n// 创建文件名数组\nvar imgs = new Array (\"\
    butterfly.gif\", \"globe.gif\", \"fish.gif\", \"clock.gif\");\n\n// 预加载所有图像\n\
    var preload = new Array();\nfor(var i = 1; i < imgs.length; i++) {\n  preload[i]\
    \ = new Image();\n  preload[i].src = imgs[i];\n}\n```\n\n```javascript\n// 按设定间隔显示每个图片的函数\n\
    function rotate() {\n  window.document.imgs.pic.src = imgs[n];\n  ( n == (imgs.length\
    \ - 1) ) ? n = 0 : n++;\n  window.setTimeout(\"rotate\", pause );\n}\n```\n\n\
    // 指定 ONLOAD 事件处理器\nwindow.onload = rotate;\n```\n\n"
