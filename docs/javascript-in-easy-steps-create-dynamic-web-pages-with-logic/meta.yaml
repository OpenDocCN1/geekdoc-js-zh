    \n这个简单的示例说明了 `Date.toGMTString()` 方法在东京浏览器中执行转换：\n\n```javascript\n// 创建一个新的 Date\
    \ 对象\nvar now = new Date();\n\n// 存储本地时间\nvar jpn = \"Tokyo Time:\\n\" + now.toString()\
    \ + \"\\n\";\n\n// 存储 GMT 时间\nvar gmt = \"UTC Time:\\n\" + now.toGMTString();\n\
    \n// 显示本地时间和 GMT 时间\nalert(jpn + gmt);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_66_0.png)\n\
    \n使用此方法设置 cookie 的完整示例可以在第 120 页。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_66_1.png)\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_66_2.png)\n\n# 创建系统计时器\n\n当需要 JavaScript\
    \ 代码在浏览器中重复执行操作时，可以使用 `window` 对象的 `setTimeout()` 方法。\n\n`window.setTimeout()`\
    \ 方法在指定的间隔后运行函数。它需要两个参数：要调用的函数名和以毫秒为单位的间隔时间。此方法通常在函数的末尾递归地调用同一个函数，以设置延迟。\n\n>\
    \ 小贴士\n> 第 166 页有一个使用此方法的幻灯片脚本。\n\n此方法创建动态效果有很多用途——例如在幻灯片脚本中按给定间隔显示图片。\n\n这里的示例使用\
    \ `window.setTimeout()` 方法每 10 秒显示一次警告对话框：\n\n```javascript\n// 创建并初始化计数器变量\n\
    var num = 0;\n\n// 显示消息的递归函数\nfunction timeout() {\n    num++;\n    // 计数增\n \
    \   // 显示消息\n    alert(\"This is 10-Second Message No: \" + num);\n    // 在再次调用此函数之前设置间隔\n\
    \    window.setTimeout(\"timeout\", 10000);\n}\n\n// 调用函数开始例程\ntimeout();\n```\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_67_0.png)\n![](img/9706759b347c5727cfdd3d09614f8c1f_67_1.png)\n\
    \n# ...续\n\n包含上述脚本的网站访问无疑会对不断弹出的警告框消息感到恼。。只显示几次然后停止调用 `timeout()` 函数可能更好。可以使用\
    \ `window.clearTimeout()` 方法取消 `window.setTimeout()`。为了正确清除计时器，有必要将原始的 `window.setTimeout()`\
    \ 调用赋值给变量——这样该变量就可以传递给 `window.clearTimeout()` 调用参数。\n\n下面的示例显示两次消息，然后在计时器清除时显示最后一条消息：\n\
    \n```javascript\n// 创建计数器变量和计时器变量\nvar num = 0, tim;\n\nfunction timeout() {\n\
    \  num++;\n  if(num == 3) {\n    alert(\"OK - I told you twice\");\n    window.clearTimeout(tim);\
    \ // 取消计时器\n  }\n  else {\n    alert(\"This is 10-Second Message No : \" + num);\n\
    \    tim = window.setTimeout(\"timeout\", 10000);\n  }\n}\ntimeout();\n```\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_68_0.png)\n\ntwo-times.js\n\n> 小贴士\n\
    > 变量名 `tim` 常用于命名计时器变量。\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_68_1.png)\n\
    \n"
