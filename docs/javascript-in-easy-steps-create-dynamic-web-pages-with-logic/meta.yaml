  md: '...cont''d

    The conditional operator can usefully be combined with an assignment operator
    in a single statement to assign one of two values according to the result of the
    test expression.


    This is demonstrated in the example below, which assigns one of two string values
    according to the result of the test expression. When there is no remainder after
    dividing the variable value by two the number must be even, but when there is
    a remainder after dividing the variable by two the number must be odd. The combination
    statements assign an appropriate string value in each case.


    ```

    // assign two integer values

    var a = 4;

    var b = 7;


    // evaluate stored values as odd or even numbers

    var al = ( a % 2 == 0 ) : "EVEN" : "ODD" :

    var bl = ( b % 2 == 0 ) : "EVEN" : "ODD" :


    // display the evaluation results

    alert(a + " is " + al + "\n\n" + b + " is " + bl);

    ```


