  md: "# Changing case\n\nThe string character case may be changed using the String.toUpperCase()\
    \ or String.toLowerCase() methods to force all the characters to a common case.\n\
    \nThese methods are useful when comparing user input to ensure that the character\
    \ format agrees with the comparison format.\n\nIn the following example the function\
    \ is called when the user clicks the button by assigning the function name to\
    \ the onclick attribute of the button's HTML element, like this:\n\n```\n<input\
    \ type=\"button\" value=\"Check Input\\nonclick=\"check_input()\" >\n```\n\nThe\
    \ String.toLowerCase() method converts the upper-case entry in the text field\
    \ for comparison with a lower-case string value.\n\n```\nfunction check_input()\
    \ {\n// get user input from text field in form id of f\n var entry = document.forms[0].textfield.value;\n\
    \n// compare input and display an appropriate message\nif(entry.toLowerCase()\
    \ == \"castle\")\n alert(\"Accepted\");\nelse alert(\"Refused\");\n}\n```\n\n\
    > Don't forget\nBe sure to observe correct capitalization when using these methods.\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_84_0.png)\n\ncase.js\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_84_1.png)\n\
