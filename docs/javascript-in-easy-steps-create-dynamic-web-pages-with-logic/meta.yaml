    # Rounding floats


    The Math.round() method in JavaScript is useful both to round floating-point numbers
    to the nearest integer and to commute long floating-point numbers to shorter rounded
    versions. Commonly this will be used to reduce a long floating-point number to
    two decimal places.


    If the floating-point value given is exactly halfway between two integers the
    method will round up to the nearest integer.


    The example given below illustrates the way that the Math.round() method handles
    rounding of positive and negative halfway values and shows how it may be used
    to commute a long floating-point number to just two places:


    ```

    var a = 7.5;

    a = Math.round(a);

    a = "Rounded Positive : "+a+" \n"


    var b = -7.5;

    b = Math.round(b);

    a = "Rounded Negative : "+b+" \n"


    var c = 3.76438467915;

    c = c * 100; // take it up two places

    c = Math.round(c); // do the round

    c /= 100; // take it back to 2 places

    c = "Commuted Long Float : "+c+";

    alnalert(a + b + c);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_75_0.png)


    > Beware

    Rounding -7.5 does not give the result -8.0 because that would be a higher negative
    number, and so that would be rounding down.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_75_1.png)'
