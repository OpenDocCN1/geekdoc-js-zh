    # Summary


    +   An array is a variable that can contain multiple values


    +   Each value held in an array is contained in an array element


    +   The JavaScript Array() constructor is used to create an array


    +   Small arrays can initialize element values by specifying a comma-separated
    list of arguments to the Array() constructor


    +   Optionally the size of an array can be specified as a single integer argument
    to the Array() constructor


    +   Loops can be used to easily fill array elements with values


    +   An array''s length property can be used to add extra elements at the end of
    the array


    +   The array join() method can be used to concatenate all element values into
    a single string


    +   Optionally a separator can be specified as an argument to the join() method
    to be inserted between the element values


    +   Arrays canfully store a series of file names or URLs


    +   The array reverse() method can be used to reverse the order of an array''s
    elements


    +   A specific range of array elements can be addressed by starting and end index
    numbers as arguments to the slice() method


    +   Stating a single index number argument to the slice() method will address
    all elements from that position up to the final element


    +   The array sort() method arranges elements sequentially in ascending order
    numerically or alphabetically'
