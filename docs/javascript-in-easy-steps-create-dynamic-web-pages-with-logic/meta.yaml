  - '[PAGE 27]


    # Logical operators


    The three logical operators that can be used in JavaScript are listed in the table
    below:


    | Operator | Operation |

    |---|---|

    | && | Logical AND |

    | || | Logical OR |

    | ! | Logical NOT |


    The logical operators are used with operands that have the boolean values of true
    or false – values that can convert to true or false.


    The logical && operator will evaluate two operands and return true only if both
    operands themselves are true. Otherwise the && operator will return false.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_27_0.png)


    There is an example of conditional branching in the section about the conditional
    operator on page 32.


    Unlike the && operator, which needs both operands to be true, the || operator
    will evaluate its two operands and return true if one of the operands itself returns
    true. If neither operand returns true || will return false. This is useful in
    a JavaScript application to perform a certain action if one of two conditions
    has been met.


    The third logical operator, !, is a unary operator that is used before a single
    operand. It returns the inverse value of the given operand, so if a variable has
    a value of true then ! would have a value of false. It is useful in JavaScript
    applications to toggle the value of a variable in successive loop iterations with
    a statement like a=!. This will ensure that on each pass the value is changed
    – it’s like flickering a light switch on and off.'
