  md: '# Summary


    +   “Dynamic HTML” (DHTML) describes JavaScript’s ability to alter web page component
    properties in response to user actions


    +   The “Document Object Model” (DOM) defines the hierarchical relationship of
    web page components


    +   A page component property can be addressed using the DOM hierarchy or by the
    `window.document.getElementById()` method


    +   The `javascript:` protocol allows short snippets of JavaScript code to be
    included directly in an HTML document


    +   Most web page components have a `style` object that has properties controlling
    their size, position and appearance


    +   JavaScript can assign a new value to any property of a web page component''s
    `style` object to create DHTML effects


    +   The top, `left` and `zIndex` properties of a web page component''s `style`
    property can be dynamically altered to its position


    +   The colors of a web page component can be dynamically altered by changing
    the `color` and `backgroundColor` properties of its `style` object


    +   Content can be dynamically inserted into a web page object using its `innerHTML`
    property


    +   A web page slide show can be created by using recursive calls to the `window.setTimeout()`
    method to change the source of an image


    +   Animation effects can be created by making recursive calls to the `window.setTimeout()`
    method to reposition a page component'
