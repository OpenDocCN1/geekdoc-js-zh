  md: '# Recognizing frames


    The window.frames object contains an array of all the frames in a window that
    has been defined in the HTML <frameset> tags.


    JavaScript can address these from within any frame using the parent.window.frames[]
    array syntax.


    Individual frames can be addressed using their index number in the array, or by
    the value assigned to the name attribute in the HTML frame tag. So a frame named
    “main” can be addressed from within another frame as parent.window.frames["main"],
    or more simply as parent.window.frames.main.


    The script below is included in an HTML frame document. It finds the total number
    of frames in that frameset and reads each of their names from the parent frame-holder
    document:


    ```

    // find the total number of frames

    var framenums = "No. frames : " + parent.window.frames.length;


    // retrieve the name of each frame

    var framenames = "\nframe 1 : " + parent.window.frames[0].name;

    framenames += "\nframe 2 : " + parent.window.frames[1].name;

    framenames += "\nframe 3 : " + parent.window.frames[2].name;


    alert(framenums + framenames);

    ```


