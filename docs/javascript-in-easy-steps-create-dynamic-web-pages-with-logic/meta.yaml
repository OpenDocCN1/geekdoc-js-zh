    # Splitting strings apart


    The contents of a string may be separated using the JavaScript String.split()
    method.


    A single argument should specify a common character to as a delimiter to define
    the points at which the string will be separated. Most commonly this is a single
    space character that a phrase with normal spacing will be separated into an array
    of single words. Each of the words can then be referenced using the index number
    of the split string array, as in any other array.


    The example below illustrates this use of the String.split() method with another
    instance where items in a database may use a | pipe character as the delimiter:


    ```

    // create and initialize a string variable

    var str = "JavaScript in easy steps";


    // split words into array elements delimited by a space

    var ss = str.split(" ");


    // create and initialize another string variable

    var bk = "JavaScript in easy steps Mike McGrath";n

    // split words into array elements delimited by a pipe

    var bks = bk.split("||");


    // display some element elements

    var res = "Topic : " + ss[0];

    res += "\nTitle : " + bks[0];

    res += "\nAuthor : " + bks[1];

    alert(res);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_85_0.png)


    > Hot tip

    Data is often stored as a comma-delimited string.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_85_1.png)'
- md: "\n## Creating substrings\n\nA substring may be extracted from an existing string\
    \ using the String.substring() method which must have two arguments to specify\
    \ the start and end positions of the required substring within the main string.\n\
    \nThe character at the start argument position will be the first character in\
    \ the returned substring. The last character in the substring will be the character\
    \ preceding the given argument position.\n\nAn alternative way to extract a substring\
    \ from a string is available with the String.substr() method which also requires\
    \ two arguments. While the first argument specifies the start position of the\
    \ substring, the second will specify the length of the substring to be returned.\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_86_0.png)\n\nThe substr() method will\
    \ invariably be the easier to use.\n\nThe example below demonstrates both substring\
    \ methods:\n\n```javascript\n// create and initialize a string variable\nvar str\
    \ = \"JavaScript in easy steps\";\n\n// get two substrings with the substring()\
    \ method\nvar sub1 = str.substring(14,19) + str.substring(0,11);\n\n// get two\
    \ substrings with the substr() method\nvar sub2 = str.substr(14,5) + str.substr(0,10);\n\
    \n// display all the substrings\nvar res = \"Substr method : \" +sub1;\nres +=\
    \ \"\\nSubstr method : \" +sub2;\nalert(res);\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_86_1.png)\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_86_2.png)\n\n## Converting to strings\n\
    \nIt is possible to manually call the JavaScript function that is to convert other\
    \ data types to strings by calling the Object.toString() method. This is an essential\
    \ JavaScript function and is designed to return a string representation of the\
    \ object that is being queried, even if it is not itself string.\n\nIn this example\
    \ there is firstly a straightforward addition of two integers, followed by a concatenation\
    \ of a string with an integer where the integer is converted to a string value.\n\
    \nFinally the Object.toString() method is demonstrated with a different data type\
    \ to illustrate that the generated output will reveal the object type.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_87_0.png)\n\
    \n```javascript\n// create an integer variable and add another integer\nvar num\
    \ = 9;\nvar nostr = num + 9;\n\n// create a string version of the num integer\
    \ variable\n// then concatenate a second value to it\nvar adstr = num.toString()\
    \ + 9;\n\n// create a new Image object\nvar img = new Image();\n\n// display string\
    \ values of the variables\nvar res = \"No strings : \" + nostr;\nres += \"\\nAdded\
    \ strings : \" + adstr;\nres += \"\\nImage : \" + img.toString();\nalert(res);\n\
    ```\n\nThe toString() method can be used anywhere in JavaScript to reveal string\
    \ information about any object.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_87_1.png)\n\
    \n## Discovering Unicode values\n\nAll characters can be returned for each individual\
    \ character in a string with the String.charCodeAt() method. This method requires\
    \ the index of the character within the string as its argument. Conversely characters\
    \ can be obtained from Unicode using the JavaScript String.fromCharCode() function,\
    \ which takes the Unicode value as its argument.\n\nThe example below first loops\
    \ through a string and makes a comma-delimited string of its Unicode character\
    \ values. An array of these Unicode numerical values is created for the second\
    \ loop to return the character for each number:\n\n```javascript\n// create and\
    \ initialize three strings\nvar str = \"Code Fun\", enc = \"\", unc = \"\";\n\n\
    // get the String numbers, comma delimited\nfor(var i = 0; i < str.length; i++)\
    \ {\n  enc += str.charCodeAt(i) + \",\";\n}\n\n// split the list of the numbers\
    \ into array elements\nvar ss = enc.split(\",\");\n\n// convert the Unicode values\
    \ back to characters\nfor(var i = 0; i < ss.length; i++) {\n  unc += String.fromCharCode(ss[i]);\n\
    }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_88_0.png)\n\nunicode.js\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_88_1.png)\n\nNotice that the charCodeFrom\
    \ function is a property of the String() constructor and is not a string object\
    \ method. See the next chapter for more about objects in JavaScript.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_88_2.png)\n\
    \nalert(\"Encoded : \" +enc + \"\\nUnencoded : \" +unc);\n\n## Extracting string\
