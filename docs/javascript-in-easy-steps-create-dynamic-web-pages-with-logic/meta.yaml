  md: '# Summary


    +   - The window.document.forms object contains an array of all the forms on the
    web page in the order they appear. Each form may be addressed using its forms
    array index number, as window.document.forms[0], or by using the value assigned
    to its HTML id attribute, as "f" in window.document.forms.f


    +   - The window.document.forms.elements object contains an array of all the elements
    in a form in the order in which they appear. Each element within a form may be
    addressed using its elements array index number, e.g. the first element by window.document.forms.elements[0],
    or by using its id, e.g. "btn1" with window.document.forms.f.btn1


    +   - JavaScript can assign a string to a form component using its value property


    +   - A loop can examine the checked property of radio buttons or checkboxes to
    discover those that the user has checked


    +   - The options property of an HTML <select> element contains an array of its
    nested <option> elements. Each element of the array has a text property, storing
    a string label, and a value property storing its associated value


    +   - The selectedIndex property of an options array stores the options index
    number of the currently selected option


    +   - When a form''s value is changed the Change event occurs and its onchange
    event-handler is called. The Reset event occurs when the user pushes a form reset
    button and the onreset event-handler is called


    +   - JavaScript can reset a form using its reset() method and submit it to the
    server using its submit() method


    +   - In Internet Explorer the Abort event occurs when the user pushes the browser
    stop, and the onabort() event-handler is then called'
