  md: '# Splitting strings apart


    The contents of a string may be separated using the JavaScript String.split()
    method.


    A single argument should specify a common character to as a delimiter to define
    the points at which the string will be separated. Most commonly this is a single
    space character that a phrase with normal spacing will be separated into an array
    of single words. Each of the words can then be referenced using the index number
    of the split string array, as in any other array.


    The example below illustrates this use of the String.split() method with another
    instance where items in a database may use a | pipe character as the delimiter:


    ```

    // create and initialize a string variable

    var str = "JavaScript in easy steps";


    // split words into array elements delimited by a space

    var ss = str.split(" ");


    // create and initialize another string variable

    var bk = "JavaScript in easy steps Mike McGrath";n

    // split words into array elements delimited by a pipe

    var bks = bk.split("||");


    // display some element elements

    var res = "Topic : " + ss[0];

    res += "\nTitle : " + bks[0];

    res += "\nAuthor : " + bks[1];

    alert(res);

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_85_0.png)


    > Hot tip

    Data is often stored as a comma-delimited string.


    ![](img/9706759b347c5727cfdd3d09614f8c1f_85_1.png)'
