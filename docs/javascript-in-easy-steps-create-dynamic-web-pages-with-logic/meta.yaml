  md: '# Summary


    +   JavaScript has seven arithmetical operators for adding (+),

    subtracting (-), multiplying (*), dividing (/), obtaining the

    modulus (%), incrementing (++) and decrementing (--)


    +   The + operator is also used to concatenate text strings


    +   When the ++ or -- operator is placed before its operand

    value is changed by 1 and the new value is returned


    +   When the ++ or -- operator is placed after an operand

    unoperated value is returned and then its value is changed by 1


    +   The logical AND (&&), or OR (||) operators evaluate

    two operands - the && operator returns true when

    operands are true but the || operator returns true if either

    operand is true


    +   The logical unary NOT (!) operator returns the logical inverse

    value of the given operand


    +   Values of any data type are assigned to variables with the

    assignment operator (=)


    +   The + operator can be combined with arithmetical operators

    as +=, -=, /= or %= to perform simple arithmetic on two

    operands, and then assign the result


    +   Comparison operators evaluate two operands for equality (==),

    inequality (!=), and greater (>) or lesser (<) values


    +   The > and < operators can be combined with the = character

    as >= or <= to also return true when each operand is of exactly

    equal value


    +   The conditional operator (?:) evaluates a test expression and

    then executes one of two statements according to the result'
