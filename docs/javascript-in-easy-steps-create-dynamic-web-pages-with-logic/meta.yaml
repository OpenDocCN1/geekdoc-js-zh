  - "[PAGE 183]\n\n# Programming the RIA\n\nOnce the empty white table cells have\
    \ been populated with the data from the XML document the custom totalize() function\
    \ can calculate the row, column and grand totals. This function uses loops to\
    \ address the value of each XML object element by combining \"num\" with the loop\
    \ iteration number using the window.document.getElementsByTagName(Name) method.\
    \ The calculated totals are then dynamically assigned to the relevant total cell\
    \ with the window.document.getElementById(id):\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_183_0.png)\n\
    \n```\n// a function to calculate row and column totals\nfunction totalize() {\n\
    \  var sum = 0; // variable for running total\n  var row_number = 1; // variable\
    \ for row number\n  var col_number = 0; // variable for column number\n  // loop\
    \ through all <num> elements\n  for (i = 0 < obj.getElementsByTagName(\"num\"\
    ).length; i++) {\n    sum += eval(obj.getElementsByTagName(\"num\")[i].firstChild.data);\
    \ // adding up all\n  }\n  // then display grand total\n  document.getElementById(\"\
    gt\").innerHTML = sum;\n  // loop through all <num> elements\n  for(i = 0 < obj.getElementsByTagName(\"\
    num\").length; i++) {\n    sum += eval(obj.getElementsByTagName(\"num\")[i].firstChild.data);\
    \ // add up row cells\n    if((i+1) % 5 == 0) {\n      document.getElementById(\"\
    rt\"+row_number).innerHTML = sum;\n      sum = 0; // and reset to zero\n     \
    \ row_number++; // and start next row\n    }\n  }\n}\n```\n\n> Beware\nNotice\
    \ how the plural form of the word \"element\" is used in the getElementsByTagName\
    \ method but the singular form is used in the getElementById method."
