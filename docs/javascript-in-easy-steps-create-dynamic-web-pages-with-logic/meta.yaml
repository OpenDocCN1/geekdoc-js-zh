  md: '# Joining elements together


    The JavaScript Array.join() method will convert all array elements to strings
    and concatenate them.


    Used without arguments this will return a list of all the array element values
    separated by commas, as in the example on previous page.


    But the Array.join() method can accept an optional argument to specify an alternative
    separator to the default comma separator.


    Most usefully this can be a space so that the result of the Array.join() method
    will be a single string with space separators, as illustrated in the example below:


    ```

    // create a new array

    var a = new Array();


    // put a word in seven array elements

    a[0] = "It"

    a[1] = "isn\t"

    a[2] = "rocket"

    a[3] = "science -"

    a[4] = "it\''s"

    a[5] = "just"

    a[6] = "JavaScript"


    // display all words in the array

    // - separated by a space

    alert(a.join(" "));

    ```


    ![](img/9706759b347c5727cfdd3d09614f8c1f_53_0.png)


    ![](img/9706759b347c5727cfdd3d09614f8c1f_53_1.png)'
  merge: -1
