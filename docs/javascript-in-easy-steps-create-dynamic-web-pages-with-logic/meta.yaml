    # 将元素切分为片段


    JavaScript 的 `Array.slice()` 方法用于通过现有数组中的某些元素值从现有数组创建一个新数组。


    该方法接受两个参数，用于指定原数组中新数组元素开始和结束的元素索引值。


    第二个参数可以是负值，表示从数组末尾开始计算的元素位置。


    如果只指定一个参数，它将用作第一个元素的索引值，该方法将返回从该位置开始到所有元素的新数组。


    这些示例说明了 `Array.slice()` 方法的各种用法：


    ```javascript

    // 创建并初始化新数组

    var nums = new Array(1, 2, 3, 4, 5, 6, 7, 8 );


    // 获取元素 #2 到 #4

    var str = "Slice A: " + nums.slice( 2, 4 ) + "\n";


    // 获取元素 #1 到最后一个元素之前的一个元素

    str += "Slice B: " + nums.slice( 1, -1 ) + "\n";


    // 获取元素 #3 到结束

    str += "Slice C: " + nums.slice( 3 ) + "\n";


    // 显示所有三个片段

    alert(str);

    ```


    > 注意

    数组元素取值范围包含第二个参数索引，但不包含该索引值。


    # 顺序排序数组元素


    JavaScript 的 `Array.sort()` 方法允许字符串元素值按字母顺序排列。


    这有时是必要的，以便输出结果按字母顺序呈现。


    整数和浮点数值将按升序排列 —— 如下例所示：


    ```javascript

    // 创建一个整数数组

    var integers = new Array(3, 8, 1, 9, 7, 5, 4, 2, 6);

    // 按数值对整数数组进行排序

    integers.sort();


    // 创建一个浮点数数组

    var floats = new Array(0.5, 0.125, 0.75, 0.25);

    // 按数值对浮点数组进行排序

    floats.sort();


    // 创建一个字符串数组

    var strings = new Array("Michael", "Andrew", "David");

    // 按字母顺序对字符串数组进行排序

    strings.sort();


    // 使用连字符分隔元素

    var str = "Integers array: " + integers.join(" - ");

    str += "\nFloats array: " + floats.join(" - ");

    str += "\nStrings array: " + strings.join(" - ");


    // 显示所有三个排序后的数组

    alert(str);

    ```


    > 负数的排列方式为 -1, -2, -3 等。


    # 总结


    - 数组是一个可以包含多个值的变量

    - 数组中存储的每个值包含在数组元素中

    - JavaScript `Array()` 构造函数用于创建数组

    - 小数组可以通过向 `Array()` 构造函数指定逗号分隔的参数列表来初始化元素值

    - 可选，可以通过单个整数参数作为 `Array()` 构造函数的参数指定数组的大小

    - 循环可以轻松为数组元素填充值

    - 数组的 `length` 属性可以向数组末尾添加额外元素

    - 数组的 `join()` 方法可以将所有元素值连接成单个字符串

    - 可选，可以指定分隔符作为 `join()` 方法的参数插入到元素值之间

    - 数组可以完整存储一系列文件名或 URL

    - 数组的 `reverse()` 方法可以反转数组元素的顺序

    - 通过将起始和结束索引作为 `slice()` 方法的参数，可以处理数组元素的特定范围

    - 为 `slice()` 方法提供单个索引值参数将处理从该位置到最后一个元素的所有元素

    - 数组的 `sort()` 方法按数值或字母顺序对元素进行顺序排序


