  md: "# Producing a slide show\n\nJavaScript can rotate images to create an automatic\
    \ slide show that will update the current image after a predetermined interval.\n\
    \nIn this script preload routine downloads all the images into the browser's cache\
    \ to be readily available for display.\n\nRotation speed in milliseconds is specified\
    \ by the value assigned to the variable named pause.\n\nThe variable n is a counter\
    \ that is incremented by the rotate() timer function and is used to display the\
    \ image at index number in the window.document.imgs[] array.\n\nIt is important\
    \ that all the images should have the same dimensions and small file sizes, to\
    \ avoid download delays.\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_167_0.png)\n\
    \n```\n// store an interval in a variable\nvar pause = 3000;\n// create and initialize\
    \ a counter\nvar n = 0;\n// create an array of image file names\nvar imgs = new\
    \ Array (\"butterfly.gif\", \"globe.gif\", \"fish.gif\", \"clock.gif\");\n\n//\
    \ preload all the images\nvar preload = new Array();\nfor(var i = 1; i < imgs.length;\
    \ i++) {\n  preload[i] = new Image();\n  preload[i].src = imgs[i];\n}\n```\n\n\
    ```\n// a function to display each image for a set interval\nfunction rotate()\
    \ {\n  window.document.imgs.pic.src = imgs[n];\n  ( n == (imgs.length - 1) ) ?\
    \ n = 0 : n++;\n  window.setTimeout(\"rotate\", pause );\n}\n```\n\n```\n// specify\
    \ the ONLOAD event-handler\nwindow.onload = rotate;\n```\n\nSimply adding image\
    \ filenames to the imgs[] array will extend the slide show without further coding."
