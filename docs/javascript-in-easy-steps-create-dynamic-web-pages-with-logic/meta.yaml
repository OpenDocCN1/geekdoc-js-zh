  md: "# Creating new components\n\nIn modern browsers, compliant with the W3C DOM,\
    \ JavaScript can dynamically create a new HTML element using the window.document.createElement().\
    \ An attribute can be added to the HTML element object by stating an attribute\
    \ name and value as the two arguments to setAttribute() method. For those HTML\
    \ elements that surround text content, a string can be specified with the window.document.createTextNodeNode()\n\
    \nOnce created in the script an HTML element can be inserted into the document\
    \ using the appendChild() method of a specified existing element. In this example\
    \ the target element is specified by the window.document.getElementById() method\
    \ to identify an element with an <p> id attribute value=\"para\"> that initially\
    \ contains some text but no nested children:\n\n```\nvar pic, tag, target; //\
    \ declare global variables\nfunction append() {\n  if (!pic) // create a new img\
    \ element\n    pic = window.document.createElement(\"img\");\n    pic.setAttribute(\"\
    src\", \"dedee.gif\"); \n  \n  if (!tag) // create a new span element\n    tag\
    \ = window.document.createElement(\"span\");\n    tag.appendChild(window.document.createTextNode(\"\
    Hi Everyone!\"));\n  \n  if (!target) // specify an existing element to append\
    \ elements to\n  target = window.document.getElementById(\"para\");\n  target.appendChild(pic);\n\
    \  target.appendChild(tag);\n}\n\nfunction remove() {\n  if (target.hasChildNodes())\
    \ // if nested elements\n    target.removeChild(pic); target.removeChild(tag);\n\
    \  }\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_127_0.png)\n\nYou can also\
    \ discover the value assigned to an attribute using the getAttribute() method.\n\
    \n![](img/9706759b347c5727cfdd3d09614f8c1f_127_1.png)\n\n(part of) createJs\n\n\
    ![](img/9706759b347c5727cfdd3d09614f8c1f_127_2.png)\n\nNote that the if statements\
    \ to see if the elements have already been created by a previous call to the function."
  merge: -1
