  md: "# Inheriting object features\n\nA custom constructor is easily created by writing\
    \ a function with arguments to set the values of its properties. Values passed\
    \ to the function can be assigned to its properties using the JavaScript this\
    \ keyword to specify the name of the object property. Alternative default values\
    \ can be specified using the || OR operator for when a property is not specified\
    \ by the caller.\n\nThe example below uses this technique to recreate the previous\
    \ example using a custom constructor. The function caller simply creates an instance\
    \ of the car object without specifying any property values - so the object inherits\
    \ the default values:\n\n```\n// create a car constructor function\nfunction car(maker,\
    \ model, color)\n{\n  this.maker = maker || \"Dodge\";\n  this.model = model ||\
    \ \"Viper\";\n  this.color = color || \"Silver\";\n  this.startup = startup;\n\
    }\n```\n\n```\n// define the startup function\nfunction startup()\n{\n  alert(\"\
    ... the motor is now running!\");\n}\n```\n\n```\n// create an instance of the\
    \ car object...\nvar viper = new car();\nalert( viper.color+\" +viper.marker+\"\
    \ + viper.model );\n```\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_95_0.png)\n\
    \nAn instance of the object in the previous example can be created by stating\
    \ its name as the argument to the Object() constructor - for example: var van\
    \ = new Object(car).\n\n![](img/9706759b347c5727cfdd3d09614f8c1f_95_1.png)"
