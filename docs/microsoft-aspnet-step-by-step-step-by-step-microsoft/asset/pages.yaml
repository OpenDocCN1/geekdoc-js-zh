  md: "# Using While...End While Loops\n\nWhile...End While loops essentially do the\
    \ same thing as Do While... loops, letting you execute a set of statements while\
    \ a given condition is true. While... loops are not as flexible as Do... loops\
    \ because they don't offer the Until keyword or allow the condition to be placed\
    \ at the end of the loop rather than the beginning. An advantage of While...End\
    \ While loops is the simpler syntax may be easier for programmers to use more\
    \ consistently. A While... loop that does the same thing as the preceding Do loops\
    \ would look like the following:\n\n```\n```\nWhile...End While syntax:\\Dim i\
    \ as Integer = 1\nWhile i <= 5\n  <font size=\"%i\">Welcome to ASP.NET</font><br>\n\
    \  i = i + 1\nEnd While\n```\n```\n\nMost programs will use a variety of loop\
    \ types. No matter which loop you choose, the important thing is that you use\
    \ it correctly and consistently for a given task. This will make your code easier\
    \ to read and maintain.\n\n# Error Handling\n\nIn any application, one challenge\
    \ faced by developers is dealing with the inevitable errors that pop up. Application\
    \ errors come in three varieties:\n\n+   * Syntax Errors These include misspelled\
    \ or missing keywords (such as a missing If statement), or others relating to\
    \ the syntax of the language you are using. Syntax errors are typically flagged\
    \ by the IDE and may be easily fixed at design time.\n\n+   * Runtime Errors These\
    \ are errors that appear after your code is compiled and running. Runtime errors\
    \ are caused by code that appears correct to the compiler, but that cannot run\
    \ with certain values. For example, code that divides one variable by another\
    \ will appear to be correct to a compiler, but it will cause a runtime error if\
    \ the second variable is zero.\n\n+   * Logic Errors These are errors in a program\
    \ that works correctly under some (or most) circumstances gives unexpected or\
    \ unwanted results based on certain input values. This type of error is extremely\
    \ difficult to track down and fix because it doesn't stop the execution of the\
    \ program."
  merge: -1
