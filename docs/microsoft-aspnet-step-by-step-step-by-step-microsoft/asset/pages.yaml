  md: '# Applying Styles to Controls


    Once you''ve added your controls to the page, eventually you''ll probably want
    to make changes to how those controls are displayed. For example, you may want
    to make the text of a Label control red. Simply set the ForeColor property of
    the control to Red, as follows:


    ```

    <label id="myLabel forecolor="red" runat="server">

    Hi there!

    </label>

    ```


    But if you want to do something more complicated? While controls as the Label
    control expose properties like ForeColor and BackColor, there are times when this
    will not be sufficient. Let''s say you want to apply a Cascading Style Sheet (CSS)
    class defined elsewhere (either in a Style block at the top of the page or in
    a linked style sheet) to a server control. Or maybe you just want to use CSS styles
    directly in your control


    For these occasions, the CssClass and Style properties defined in the WebControl
    base class (and inherited by all WebControl classes) come in handy. With the Css-Class
    property, you can set up a CSS class such as the following:


    ```

    <style type="text/css">

    .mylabel { font-size:24pt; font-weight:bold; color:red; }

    </style>

    ```


    You can use this to format your control as follows:


    ```

    <label id="myLabel" class="mylabel" runat="server">

    Hi there!

    </label>

    ```


    This technique works fine for linked style sheets as well.


    The Style property can be used to specify CSS styles directly as follows:


    ```

    <label id="myLabel"

    style="font-size:24pt; font-weight:bold; color:red; runat="server">

    Hi there!

    </label>

    ```


    Note whether you set the color of a Label control with the ForeColor property
    or use the CssClass or Style properties declaratively, the result is rendered
    as a class or style attribute on the resulting <span> tag, which is the client-side
    representation of the WebControl control.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# note


    Although you can set control properties declaratively by using the property name
    as an attribute of the tag used to declare the control, some compound properties
    (properties that are represented by another class) require that you use a slightly
    different attribute syntax.


    A good example of this is the Font property (defined in the WebControl class),
    which returns an instance of the Fontinfo class. In order to modify the font of
    a control that inherits from WebControl (such as the Label control), you use attributes
    from the form-<propertyName>, as follows:


    ```

    <asp:label id="myLabel" font-name="arial"

    runat="server">

    ```


    You can also access these properties programmatically, using the form <controlname>.Font.<propertyName>,
    as follows:


    ```

    myLabel.Font.Name = "Arial"

    ```


    Finally, you can also apply styles to your controls based on the client-side representation
    of the control. As noted, Label controls are rendered on the client as <span>
    tags, so if you define a style that applies to all <span> elements, your Label
    controls will also use this style. As long as you know the client-side representation
    of a particular control (which you can get by viewing the source of the page from
    the browser), you can create a style sheet to format that control.


    # Additional Web Control Examples


    Web controls are quite easy to use and provide a great deal of flexibility. So
    far, you''ve used only simple examples. This section will look at a more complex
    examples to demonstrate the use of various Web controls. The first example will
    show you how to use server controls to set up a form for sending e-mail from an
    ASP.NET Web Form via the Simple Mail Transport Protocol (SMTP). The second example
    will show you how to use Panel controls to simulate a wizard-style multipage interface
    within a single Web Forms page.


    # Sending Mail


    A common task for Web applications is sending e-mail to customers or visitors.
    Often, this e-mail is generated automatically, without the need for specific data
    entry. But site operators also want a way to send a quick e-mail through the site.
    Web controls, in combination with the .NET SmtpMail and MailMessage classes, can
    make it quick and easy to add this functionality to a Web site.'
