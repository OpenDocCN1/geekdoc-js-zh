- img_proc: true
  md: '# ASP.NET Step by Step


    Each ASP.Net Web Forms page contains a server-side <form> tag that directs the
    page to post back to itself when the form is submitted by the user. Many ASP.NET
    server controls render JavaScript to the client, allowing actions such as selecting
    an item in a drop-down list to cause a postback. The ASP.NET runtime renders a
    hidden field to page that allows the page to maintain its state between requests.


    The postback and hidden field are key, because when the client is interacting
    with the page, there is no code running on the server at all. The postback and
    hidden field allow the page to be reconstituted on the server. Also, they code
    to be executed in response to the event raised by the user action, and based on
    any changes to the form fields. Once the page has been processed and the output
    rendered to the browser, the page and its controls are discarded. The steps in
    this process are as follows:


    +   - The user requests the page from the browser.

    - The page and controls are loaded and initialized.

    - If the page request is the result of a postback, the control state is loaded
    from the viewstate (hidden field), and any changes submitted by the user are applied.
    (Note that both original values in the viewstate and the updated values are available
    to server-side.)

    - Page event handlers and event handlers for events triggered by user actions
    are executed.

    - Control state is saved to viewstate (hidden field).

    - HTML output from the page is rendered to the browser.

    - The page and controls are unloaded.


    It''s important to note that most server controls save their state to viewstate
    automatically, the same is not true for properties that you define in your pages,
    or in user controls or custom server controls. You''ll learn how to use viewstate
    for storing custom control state in Chapter 12.


    # Using Directives


    If you''ve developed a classic ASP page, you''ve worked with directives. There
    were few directives in classic ASP, but they were important. Most prominent were
    the @ Language directive and the #Include directive. The @ Language directive,
    which appeared at the top of every classic ASP page, told the ASP runtime language
    engine to use in interpreting script found in <% %> render blocks in the page.
    The #Include directive told the ASP interpreter to include a particular file inline
    with the current ASP page.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Chapter 9 Creating Web Forms 215


    Directives are simply ways for developers to declaratively determine certain aspects
    of a program will operate. In classic ASP, this was somewhat limited. In fact,
    there were only the following four @ directives in classic ASP, in addition to
    the @ Language directive:


    +   - CodePage Used in globalization to set the code page for an ASP page

    - EnableSessionState Used to disable session state for a page

    - LCID Used to set the locale identifier for a page

    - Transaction Used to specify whether and how the page participates in COM+ transactions


    ASP.NET greatly expands the use of directives, adding a useful directives everything
    for controlling page behavior and configuration to catching page output. In addition,
    directives in ASP.NET have attributes, which increase their power and flexibility.
    The classic ASP directives listed previously are represented in ASP.NET as attributes
    of the @ Page directive, which is described in the next section.


    # @ Page


    The @ Page directive, which is allowed in .aspx files, defines page-specific attributes
    that are used by ASP.NET language compilers and the runtime to determine how the
    page will behave. The default values for a few of these attributes are set in
    the Pages configuration section in Machine.config. Some of the attributes, including
    AutoEventWire, are set or overridden in pages created by Visual Studio .NET. The
    attributes available for the @ Page directive are listed in the following table.


    | Attribute | Values | Purpose |

    | AspCompat | true/false | Provides compatibility with COM components created
    with Visual Basic 6.0 (or earlier) by forcing the page to be run in an STA (Single
    Threaded Apartment). Also provides the component with access to unmanaged instances
    of the ASP intrinsics (Session, Application, Request, etc.). This setting will
    likely degrade performance, so use it only when necessary. |


    (Default is false.)


    ![](img/50a47de1541381ea3363945ae9c22411_234_0.png)'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 216 ASP.NET Step by Step


    | Attribute | Values | Purpose |

    |---|---|--|

    | AutoEventWireup | truelfalse Default is set in the <pages> section of Machine.config
    or Web.config. | Determines whether or not handlers for events such as Page_Load
    are set up automatically. See “Event Handling” on page 240 for more information.
    Default is true. |

    | Buffer | truelfalse Default is set in the <pages> section of Machine.config
    or Web.config. | Determines whether rendered output is buffered before being sent
    to the client or is sent as it is rendered. Default is true. |

    | ClassName | Any valid class name. | Determines the name of the page generated
    by dynamically compiling the page. This attribute works with or without Codebind,
