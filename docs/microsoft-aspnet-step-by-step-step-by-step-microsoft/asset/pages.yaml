  md: '# note


    Although the previous example uses Microsoft Access to demonstrate the ability
    of the OleDbCommand object to connect to non–SQL Server databases, we shouldn''t
    use Access for ASP.NET applications. For initial prototyping and development,
    or for applications with minimal scalability requirements (5–10 concurrent users
    or fewer), MSDE is the better choice.


    MSDE is a SQL Server-compatible database that is available with a number of Microsoft
    products, including SQL Server, Microsoft Office, and Visual Studio. A version
    of MSDE also comes with the .NET Framework SDK, and it''s installed and ready
    to use the SDK samples, if you choose to install them. (Please refer to Chapter
    8 for important guidance about installing sample applications.) MSDE is built
    on the same database engine as SQL Server, but it''s tuned for approximately five
    concurrent users.


    The advantage of using MSDE is that all of your development tasks are then identical
    to developing against SQL Server, without the licensing expense of a full-blown
    SQL Server.(The license to use and distribute MSDE is included in the aforementioned
    products. Check the end-user license agreement to ensure that your use is within
    the terms of the agreement.) And if your application''s needs to grow, you can
    simply move your database to SQL Server for increased performance and scalability,
    with no code or data changes required.


    The CommandText property of the object to the name of the stored procedure that
    you want to execute, and setting the CommandType to CommandType.StoredProcedure.
    If you''re familiar with the execution of stored procedures under classic ADO,
    this isn''t so different from what you would have done with the ADO Command object.


    # Calling Stored Procedures with Parameters


    Calling stored procedures with input or output parameters is a little more involved,
    but it''s still pretty straightforward. You simply create parameters (either SqlParameter
    or OleDbParameter objects); set the appropriate properties, such as ParameterName,
    Direction, type (SqlType or OleDbType), and Value; and then add the parameter
    object to the Parameters collection of the Command object. The following listing
    shows the code required to execute the byroyalty stored procedure in the Pubs
    sample SQL Server database, and it returns a SqlDataReader, which is then bound
    to an ASP.NET DataGrid control. (You''ll learn more about data-binding later in
    this chapter.)'
