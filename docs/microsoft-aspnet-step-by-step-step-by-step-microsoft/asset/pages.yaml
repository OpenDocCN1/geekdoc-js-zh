  md: '# OleDbConnection


    For applications that need to be able to query databases other than SQL Server,
    such as Access or Oracle, the OleDbConnection class is the appropriate choice.
    This class uses a standard OLE DB Provider string to connect to any OLE DB datasource
    through the OLE DB provider for datasource.


    Creating an OleDbConnection is simple and can be defined in one line of code.


    ```

    Dim myOleDbConnection as New OleDbConnection(ConnectionString)

    ```


    This creates a connection called myOleDbConn to the database specified by the
    ConnectionString passed to the constructor of the OleDbConnection class. The ConnectionString
    argument is a standard OLE DB provider string. The following, from the MSDN .NET
    Framework Class Reference, shows some examples of OLE DB Providers for connecting
    to Oracle, MS Access, and SQL Server databases, respectively:


    ```

    Provider=MSDAOORA;Data Source=ORACLE817;User ID=OLEDB;",

    ```


    ```

    Provider=Microsoft.Jet.OLEDB.4.0;

    Data Source=c:\bin\LocalAccess40.mdb;

    ```


    ```

    Provider=SQLOLEDB;Data Source=SqlServer;Integrated Security=SSPI;

    The Provider is required. You can also use other clauses supported by the particular
    OLE DB provider to set other properties for the provider. For example, the InitialCatalog
    clause is used by the SQL Server OLE DB Provider to indicate the database against
    which queries will run.

    ```


    You open the connection by calling the following:


    ```

    myOleDbConn.Open

    ```


    And you close it by calling the following:


    ```

    myOleDbConn.Close

    ```


    > note

    You cannot use the OLE DB Provider for ODBC with the OLE DB .NET Data Provider.
    You can download a separate .NET Data Provider for ODBC from http://msdn.microsoft.com/downloads/.


    Later in this chapter, you''ll see examples of using connections to perform data
    access.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Using Trusted Connections


    As mentioned in Chapter 8, ASP.NET is configured by default to use the unprivileged
    ASPNET account to run ASP.NET worker processes. This means that unlike beta versions
    of ASP.NET, you must now use either of the following two techniques to use a trusted
    connection.


    +   - Use Windows authentication and impersonation to connect to the database
    using the credentials of the logged-in user

    - or

    - Set up the ASPNET account as a SQL Server login


    In this section you''ll learn how to use the latter technique to enable the use
    of trusted connections without the need for Windows authentication.


    > important Setting up the ASPNET account in SQL Server will allow any ASP.NET
    application on the Web server to access the database with whatever privileges
    have been granted to the ASPNET account. For this reason, this technique should
    be used only on development systems or production systems on which you are in
    control of all ASP.NET applications. This technique should generally not be considered
    for shared server applications.


    To set up the ASPNET account to access the Pubs SQL Server sample database using
    SQL Enterprise Manager, follow these steps.


    +   1 Open SQL Enterprise Manager by clicking Start, Programs, Microsoft SQL Server,
    Enterprise Manager.

    2 Expand the tree and locate the desired SQL Server or MSDE instance. Expand this
    instance and locate the Security node.

    3 Expand the Security node, right-click the Logins node, and then select New Login.

    4 On the General tab, select the desired domain (or local machine) from the Domain
    drop-down list, then click the ellipsis (...) next to the Name textbox.

    5 Locate and select the account named ASPNET (aspnet_wp account), click Add, and
    then click OK.

    6 Also on the General tab, change the Database default to pubs. Click the Data-base
    Access tab.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '7 On the Database Access tab, scroll to the database, check the Permit checkbox
    and then add the db_datareader and db_datwriter roles to the ASPNET login account
    by checking the checkboxes for these roles.


    8 Click OK. You can now use a trusted connection to read from and write to the
    pubs sample database.


    To set up the ASPNET account to access the Pubs sample database in the NetSDK
    MSDE database using the oSql command-line tool, follow these steps.


    +   1 Start the oSql command-line utility by entering following a command prompt.
    (If using a SQL Server database other than a local version of the NetSDK MSDE
    database, enter that server or instance name as the -S parameter)


    +   2 When prompted, enter the sa password for the instance indicated by the -S
    parameter. You should see a >>


    +   3 Call the sp_grantlogin stored procedure to grant login access to the ASPNET
    account. The syntax should look like the following, with <domain> replaced by
    your domain or local machine name. The go command entered at the 2> prompt.


    1> sp_grantlogin ''<domain\ASNET''

    2> go


    +   4 Call the sp_defaultdb stored procedure to change the default database for
    the ASPNET account to pubs. The syntax should look like the following, with <domain>
    replaced by your domain or local machine name.


    1> sp_defaultdb ''<domain\ASNET>'', ''pubs''

    2> go


    +   5 Call the sp_adduser stored procedure to add the ASPNET login account to
    the pubs database, passing the db_datareader argument to add the account to the
    db_datwriter role. The syntax should look like the following, with <domain> replaced
    by your domain or local machine name.


    1> sp_adduser ''<domain\ASNET>'', ''ASPNET'', ''db_datareader''

    2> go


    +   6 If desired, call the sp_addrolemember stored procedure to add the ASPNET
    account to the db_datwriter role. In this step, ASPNET is the username added to
    the pubs database in the previous step. The syntax should look like the following,
    with <domain> replaced by your domain or local machine name.


    1> sp_addrolemember ''db_datwriter'', ''ASPNET''

    2> </code>


    +   7 Type exit and press the Enter key to exit the oSql utility.'
