- img_proc: true
  md: '# Understanding WSDL Files


    WSDL is an XML-based standard for documents that describe the services exposed
    by a Web service. You can view the WSDL contract for any of the Web services you
    create with ASP.NET by calling the URL for a Web service in a browser and appending
    WSDL to it.


    WSDL contracts are similar to COM type libraries or .NET metadata in that they
    are used to describe the public members of the Web service, including all publicly
    available methods, the parameters (and datatypes) they expect when called, and
    the return type of any return value. Because this information is encoded in a
    standard XML-based format, any client can read XML and can understand WSDL and
    SOAP should be able to effectively consume the Web application that the WSDL contract
    describes.


    > important The SOAP and WSDL specifications are still in the process of being
    standardized. In the short term, there may be inconsistencies between different
    implementations of WSDL on different platforms, since these implementations may
    be based on different drafts of the proposed standard. Until WSDL become settled
    standards (W3C Recommendations), you may need to tweak your WSDL contracts to
    achieve interoperability between different Web services implementations. This
    should become a nonissue unless these specifications have received approval as
    W3C Recommendations. In the meantime, there is an interesting article on interoperability
    between various Web services implementations on the MSDN Library site at http://msdn.microsoft.com/library/en-us/dn_voices_webservice/html/service08152001.asp.


    # Creating a Proxy Class


    Consuming a Web service via SOAP is a fairly complex affair. It involves creating
    and formatting a SOAP envelope, a set of SOAP headers, and a SOAP body, all with
    the correct elements and attributes for the Web service you are targeting. Fortunately,
    thanks to the built-in support for Web services in the .NET Framework, all of
    the plumbing necessary for accessing a Web service is provided for you. The .NET
    Framework provides another command-line utility, wsdl.exe, to help you by creating
    a .NET proxy class for a Web service described by a WSDL contract.'
  merge: -1
  pgno: 437
- img_proc: true
  md: '# Chapter 13 Creating and Using Web Services 419


    # Using the wsdl.exe Utility


    The wsdl.exe utility generates a proxy class in C#, Visual Basic .NET, or JavaScript
    .NET for a WSDL contract specified by URL or path. This proxy class can be instantiated
    and its methods called by any client, just like any other .NET class.


    The syntax for the wsdl.exe utility is as follows:


    ```

    wsdl [options] {URL | path}

    ```


    Here, options represents one or more command-line options for the utility, and
    URL represents the URL to the WSDL contract. Alternately, a file path to the WSDL
    contract can be passed as the path argument. The options for wsdl.exe utility
    are shown in the following table.


    | Option | Description |

    | --- | --- |

    | /appsettingurl:key or /urlkey:key | Sets the key of the configuration setting
    from which to read the default URL for generating code. |

    | /appsettingurl:baseurl | Sets the base URL to use for calculating relative URLs
    when a URL fragment is specified for the URL argument. |

    | /baseurl:baseurl | |

    | /d:domain or /domain:domain | Sets the domain to use when connecting to a site
    that requires authentication. |

    | /l:language or /language:language | Sets the language to use when generating
    the proxy class. Valid values include CS, VB, JS, or the fully qualified name
    of any class that implements the System.CodeDom.Compiler.CodeDomProvider class.
    Default is CS (C#). |

    | /n:namespace or /namespace:namespace | Sets the namespace to be used when generating
    the proxy class. |

    | /nologo | Prevents the start-up banner from being displayed. |

    | /o:filename or /out:filename | Provides the filename (and path) to use for saved
    output. |

    | /p:password or /password:password | Sets the password to use when connecting
    to a site that requires authentication. |


    (continued)'
