    * Visual Studio .NET


    Now that you''ve learned a little bit about some nifty features of ASP.NET, the
    next question is: how do you take advantage of them? Clearly, you''re going to
    need some development tools. Conveniently enough, that''s precisely what you''re
    going to learn about it in this chapter.


    In the world of Visual Basic 6.0 programming, you had only one development tool:
    the Visual Basic 6 Integrated Development Environment (IDE). You could get it
    as a stand-alone product or as a part of Visual Studio 6.0, but if you wanted
    to develop Visual Basic applications, it was pretty much your choice.


    One distinct advantage of classic ASP was that, because the code was interpreted
    and executed by an ActiveX scripting engine built into Internet Information Services
    (IIS), you didn''t need a compiler or an IDE to create Active Server Pages. All
    you really needed was a text editor.


    What''s the point of all this history? Well, ASP.NET pages can also be created
    with a simple text editor because the language compilers are installed with ASP.NET
    in the .NET Framework SDK. But instead of being interpreted at runtime, ASP.NET
    pages are compiled, which means substantially improved performance.'
