    # Debugging


    In an ideal world, programmers would be sufficiently skilled and attentive to
    detail as to write bug-free code. Unfortunately, we do not live in an ideal world.
    As such, debugging, or tracking down the source of errors and erroneous results
    in your programs, is an important task that all developers need to perform before
    they allow end-users to use their applications. This section will discuss techniques
    for reducing the number of bugs in your code up, as well as the tools and techniques
    in ASP.NET and the .NET platform for debugging applications.


    # Understanding Bug Categories


    There are three broad categories of bugs, with differing characteristics and differing
    levels of difficulty.


    +   - Syntax errors These occur when code breaks the rules of the language you
    are using, as writing a VB Sub statement without a closing End Sub, or forgetting
    a closing brace ()) in C#. These errors are the easiest to locate. The language
    compiler or IDE will alert you to and not allow you to compile your program until
    they are corrected.

    - Semantic errors These occur in code that is correct according to the rules of
    the compiler, but that causes unexpected problems as crashes or hanging on execution.
    A good example is code that executes in a loop but never exits the loop, either
    because the loop depends on a variable value was expected to be something different
    than it actually was or because the programmer forgot to increment the loop counter.
    These bugs are harder to detect and are one type of run-time error.'
  merge: -1
  pgno: 487
- img_proc: true
  md: '# Chapter 16 Tracing Debugging ASP.NET Applications 469


    +   Logic errors These errors are similar to semantic errors in they are run-time
    errors. That is, they occur while the program is running. Unlike semantic errors,
    they do not cause the application to crash or hang. Instead, logic errors result
    in unexpected values or output. This can be due to something as simple as a mistyped
    variable name that has to match any declared variable in the program (an argument
    for descriptive variable names rather than simple ones, for example). This type
    of error can be extremely difficult to track down and eliminate, particularly
    since complex programs it may be difficult (if not impossible) to reproduce a
    logic error reported by a user.


    # Preventing Bugs


    Before we get into the discussion of how to debug the various errors you''re apt
    to run into in your applications, let''s take some time to look at strategies
    for preventing bugs in the first place. Preventing bugs is a much more efficient
    and less expensive way to produce bug-free software.


    The following list contains a few strategies that will help. This is not a comprehensive
    list by any means, but applying these strategies consistently will help you spend
    less time debugging code and more time enjoying the rewards of having written
    it.


    +   Write readable code Choose (or develop) and make consistent use of naming
    and coding standards. It''s not important which standard you use, such as Hungarian
    notation (txtName) vs. Pascal Casing (FirstName), as long as you use one. You
    should also strive for consistency in comments and encourage liberal commenting
    of code. That makes code more readable and easier to understand will help eliminate
    bugs from the get-go.


    +   Create test plans The most effective way to eliminate logic errors is to test
    every path of your application with every possible data value (or representative
    range of data) that could be entered by a user. This is difficult to manage without
    effective planning. Test plans should be created at the same time as the application
    is being designed, and they should be updated as the application design is modified.
    To be effective, the test plans need to describe how to test each piece of functionality
    in the application. Test plans and other design documents can also help highlight
    design problems before they are implemented, preventing a wide area of bugs.


    +   Use a rich IDE You don''t necessarily need to use Visual Studio .NET to develop
    your Web applications since ASP.NET does not require it, but you


    ![](img/50a47de1541381ea3363945ae9c22411_488_0.png)'
  merge: -1
  pgno: 488
- img_proc: true
  md: '# ASP.NET Step by Step


    should consider developing in an IDE that provides syntax checking as you type.
    If you develop with Notepad, it is too easy to amass a number of sync errors that
