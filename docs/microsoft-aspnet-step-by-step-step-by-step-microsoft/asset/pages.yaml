  md: "# Creating a Class\n\nEach custom server control is defined in a class. You\
    \ can have more than one class defined in a single namespace within a file, but\
    \ the class is what defines the boundary of the control. You may put multiple\
    \ controls within a single file, if you want. When you compile this, all of the\
    \ classes (and the controls they represent) are compiled into a single assembly.\
    \ When you have multiple related controls, this can make deploying your controls\
    \ simpler.\n\nYou define classes in Visual Basic .NET and C# as. With namespaces,\
    \ classes in Visual Basic .NET are defined with a Class keyword and an End Class\
    \ keyword that together define the scope of the class.\n\nClass myControl\n'Variables,\
    \ procedures, etc.\nEnd Class\n\nC# uses the class keyword with a pair of curly\
    \ braces to define the scope of the class.\n\n```\nclass myControl\n{\n  //Variables,\
    \ procedures, etc.\n}\n```\n\n# Inheriting from a Base Class\n\nOne of the most\
    \ important steps in creating a custom server control is choosing the class from\
    \ which your control will inherit. This can be a more difficult decision than\
    \ you might think, because there are so many choices.\n\nYou need to consider\
    \ how the control will be used and who will use it. One of the reasons for creating\
    \ custom controls in the first place is to reuse controls that have most (but\
    \ not all) of the functionality you need, you may be tempted to simply jump right\
    \ into inheriting a rich control and get the most for your buck. But you should\
    \ keep in mind that any public property, method, or event exposed by the base\
    \ control will be exposed by a derived control automatically. If you don't plan\
    \ for this, your control may do unexpected, or you may unwittingly introduce bugs\
    \ when someone uses the control in a way that you didn't anticipate.\n\nThis may\
    \ not be a problem if you are creating the control for your own use. If you plan\
    \ to share it with others, however, just remember that people can be very creative\
    \ in finding ways to break software, and developers are more creative than most.\
    \ By making available a lot of public methods that you didn't write, you increase\
    \ the chances that another developer will break your code. To avoid this"
  merge: -1
