    cookie. | Default is /. This to prevent the possibility of missing cookies by
    browser case sensitivity with respect to URL paths and cookies. |

    | | protection | Determines the methods used to protect authentication from being
    compromised. Your choice of which method to use, or whether to use at all, will
    depend on your security needs vs. the amount of resources you''re willing to devote
    to security. Generally, the higher the level of security, the greater the performance
    overhead. | All (default) Both encryption and data validation will be used to
    protect the cookie. This is the recommended setting.

