    # @ Import


    The @ Import directive is used to import either a .NET Framework namespace or
    a custom namespace to a page. Importing a namespace allows you to write code against
    the members of that namespace without explicitly specifying the namespace each
    time. The @ Import directive has only one attribute, Namespace, which specifies
    the namespace to import. Each @ Import directive can have only one Namespace attribute,
    so you must use a separate @ Import directive for each namespace you wish to import.
    For example, to use the .NET Framework SmtpMail and MailMessage classes to send
    e-mail from an ASP.NET page, you would need to add the System.Web.Mail namespace
    to your page, as follows:


    ```

    <% namespace="System.Web.Mail" %>

    ```


    Then, to create an instance of the MailMessage class, you would use the following:


    ```

    Dim myMail As New MailMessage

    ```


    Without the @ Import directive, you would need to use the following:


    ```

    Dim myMail As New System.Web.Mail.MailMessage

    ```'
