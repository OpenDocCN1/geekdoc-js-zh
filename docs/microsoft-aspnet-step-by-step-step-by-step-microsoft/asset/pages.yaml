    # Using DataViews


    The DataView class provides a means for sorting, searching, editing, filtering,
    and navigating DataTables. Dataviews also be data-bound, as you''ll see in later
    examples. Databinding allows ASP.NET server controls to display bound data automatically,
    even when multiple rows or columns of data are contained in the datasource. This
    greatly simplifies the display of data in a table in ASP.NET. You can access an
    unfiltered view of the data in a table in a dataset as follows:


    ```

    myDV As DataView

    myDV = myDS.Tables(0).DefaultView

    ```


    Once you have a reference to the DataView, you can filter it by adding an expression
    to the RowFilter property.


    ```

    myDV.RowFilter = "type=''business''"

    ```


    Search the DataView using the Find method.


    ```

    RowNum As Integer = myDV.Find("BU1032")

    ```'
