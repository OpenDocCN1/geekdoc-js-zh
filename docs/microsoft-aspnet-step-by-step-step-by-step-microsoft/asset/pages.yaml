  md: '# Creating an ASP.NET Web Application


    One of the first things you''re going to do in order to work with ASP.NET in Visual
    Studio .NET create a new project, or in Visual Studio .NET parlance, a Web application.
    Here are the steps necessary to create a new Web application:


    +   1 Open Visual Studio .NET.


    +   2 There are three methods of opening the New Project dialog box:


    +   - Click the New Project link on the Visual Studio .NET Start Page (dis- by
    default when you first open Visual Studio .NET).


    +   - Click the New Project button, located on the toolbar.


    +   - From the File menu, select New, Project.


    +   3 In the New Project dialog box (see the following figure), select the desired
    project language (in this case, Visual Basic), select the appropriate template
    (Web Application), and enter the project name (ASPNETApp1) and location. (For
    local projects, the default of http://machiname/ works fine, or you can use the
    localhost instead.) Click OK. Visual Studio .NET will create a Web application
    along with physical and virtual directories for the project.


    ![](img/50a47de1541381ea3363945ae9c22411_42_0.png)


    That''s it! You''ve created your first ASP.NET Web application. Next we''ll look
    at how to add new pages.


