  pgno: 469
- img_proc: true
  md: '# Chapter 15 Deploying an ASP.NET Application 451


    In addition to automatically loading and caching these values for you at application
    start-up, ASP.NET monitors the Web.config file(s) for changes and dynamically
    reloads the appSettings if changes are detected.


    > important

    Settings provides a storage location for application-specific configuration settings
    that is almost ideal in its ease of use and performance, it should be noted that
    since the values are stored as plain text in a file in the Web space, there is
    some security risk associated with this approach.

    If a vulnerability in the Web server allowed access to the Web.config file, any
    sensitive information stored in appSettings could be compromised. For this reason,
    it is important to avoid storing sensitive information, such as usernames, passwords,
    or credit card account numbers, in the appSettings section of Web.config. For
    items of medium sensitivity, one solution would be to add the items to the appSettings
    of the Machine.config file, which is not located within the Web space, making
    it harder to compromise. Keep in mind, however, that the appSettings stored in
    Machine.config are available to every application on the server, unless they are
    locked down using the <location> tag. (See Chapter 7 for more information on locking
    configuration settings)


    # Deploying a Web Application Manually


    If you''re developing ASP.NET applications against the .NET Framework without
    the benefit of Visual Studio .NET, most (if not all) of your deployment work will
    be manual. The great news is that ASP.NET applications are simple to deploy.


    # Setting Up the Target Deployment Directory


    In order to successfully deploy an ASP.NET application, the need a target directory
    on the server that will host the application. This directory must be set up in
    IIS as an application root if you want to use the automatic loading of assemblies
    in the bin subdirectory or use a Global.asax file, and if you want to have a root
    Web.config file for the application. (Certain configuration sections cannot be
    set below the application level, and they will cause errors if used in a Web.config
    file that resides in a subfolder.)


    # Copying Files to the Target Directory


    Once you''ve set up the target directory in IIS (mapped to a physical folder on
    the host machine), you''re ready to copy all the necessary files to the target
    directory.'
  merge: -1
  pgno: 470
- img_proc: true
  md: 'This can be using any number of commonly available tools, from the XCOPYcommand
    to WebDAV. You can even drag and drop files to and from a network share using
    Windows Explorer.


    If you''re using code-behind in your Web Forms pages and/or user controls, you''ll
    need to decide whether not to deploy the code-behind classes containing your source
    code to the target server. If you''re using the Src attribute of the @ Page or
    @ Control directive to have ASP.NET dynamically compile your code-behind classes,
    you will have to deploy the code-behind classes or the application will not function.
    If you want to avoid deploying the code-behind classes, you will have to use the
    Inherits attribute of the @ Page or @ Control directive instead of the Src attribute.
    Recall from Chapter 9 that using the Inherits attribute requires you to manually
    compile your code-behind classes and put the assemblies in your application''s
    bin subfolder.


    # Deploying Content


    Deploying static content (such as HTML pages and images), Web Forms pages, user
    controls, and code-behind classes is as simple as copying them from the development
    application directory to the deployment target directory. For example, you would
    use the following command to deploy content from a local directory C:\inetpub\wwwroot\MyApp
    to a remote directory for which a mapped drive, X:, has been created:


    ```

    xcopy c:\inetpub\wwwroot\ASPNetApp x:\ /E /K /0

    ```


    The parameters passed to XCOPY are as follows:


    +   /E specifies all subdirectories to be copied, whether empty or not.

    /K specifies that file and directory attributes on the destination will be set
    to match the source.

    /O specifies that ownership and ACL information should be copied to the destination.
    This is useful when using domain accounts to set ACLs.


    You can find out about all of the command-line parameters available with XCOPY
    by executing XCOPY /.


    # Deploying Assemblies


    One of the areas of great improvement in deployment is .NET managed assemblies
    COM components. With classic ASP applications that used COM components, not only
    did you need to copy the component file to the machine on which the application
    was being deployed, but you also needed to register that component in the system
    registry, which was difficult to do remotely.'
  merge: -1
  pgno: 471
- img_proc: true
  md: 'Additionally, registering a component made it available to any application
    on the server, which is not allowed in a shared server environment.


    Because .NET assemblies are self-describing and assemblies are private to an application
    by default, you can simply copy an assembly to the bin subdirectory of an application
    and it will be available for use by the application automatically. Private assemblies
    do not need to be registered to be used, and they are available only to the application
    in whose bin directory they reside.


    # Global Assemblies


    The exception to the rule of XCOPY deployment applies to assemblies that you want
    to make available to more than one application on the server without having multiple
    copies of the assembly (one for each application). These assemblies need to be
    installed in the GAC. Remember that assemblies installed in the GAC must be strongly
    named. This can be done using the al.exe command-line tool. Once you have a strongly
    named assembly, there are several ways to install it into the GAC.


    +   - Windows Installer 2.0 This the preferred method for installing assemblies
    into the GAC because it performs counting and transactional installation, neither
    of which are available with the other options. See the Windows Installer documentation
    for more information on packaging and installing applications with Windows Installer
    2.0.

    - gacutil.exe This command-line utility lets you add assemblies to the GAC, remove
    assemblies from the GAC, and list the contents of the GAC.

    - Windows Explorer The .NET Framework installs a shell extension that lets you
    drag and drop strongly named assemblies into the GAC from any Windows folder.
    The GAC is located at %WinDir%\assembly.


    # Deployment and Assembly Versioning


    One nifty about global assemblies that compensates for the additional overhead
    of installing and removing them from the GAC is that they can contain versioning
    information. This allows two or more versions of the same assembly to be executed
    side-by-side, and it allows client applications to request the version of an assembly
    they want to use, or to accept the latest revision of an assembly.


    # Updating Assemblies


    In addition to the problems of registering COM components, IIS locked any COM
    component as soon as it was called. Because of this, replacing or updating a COM
    component often required stopping the IIS Web service, unregistering the old component,
    copying over the new component, registering the new'
  merge: -1
  pgno: 472
- img_proc: true
  md: 'component, restarting the Web service. For many applications, this meant an
    unacceptable amount of downtime.


    With private assemblies, this is no longer a problem because of the way ASP.NET
    loads assemblies. Unlike IIS classic ASP, which loaded a component into memory
    and locked it on disk until the Web application (or IIS) was shut down, ASP.NET
    first makes a shadow copy of each assembly file and then loads locks the shadow
    file instead of the original. ASP.NET monitors the original file for changes.
    If changes are detected, ASP.NET fulfills any existing requests with the current
    copy of the assembly, and then loads the new assembly and fills new requests using
    the updated assembly, discarding the old assembly. This allows you to easily update
    any private assembly used by your application without needing to shut down the
    Web server, ever temporarily.


    # Setting IIS Permissions for Subdirectories


    Once you''ve copied your content and assemblies to the target directory, it''s
    a good idea to double-check the IIS permissions on subdirectories in the application.
    Unfortunately, ASP.NET actually takes care of one of the most important checks
    for you. It automatically prevents all permissions on the bin directory of the
    application, effectively preventing the contents of the directory being listed,
    read, downloaded, or executed.


    Now, preventing IIS from executing the assemblies on behalf of clients might sound
    like a bad thing, but it''s not. In fact, when a request comes in for a resource
    ASP.NET handles, such as an .aspx, .ascx, or .asmx file, IIS simply handles the
    request over to ASP.NET. ASP.NET alone is responsible for loading assemblies,
    preventing IIS from attempting to execute assemblies is a good thing.


    If you have subdirectories that contain static content, such as images, you could
    ensure that the only permission allowed on these subdirectories is Read.


    Most importantly, if you need to allow users to upload content to your Web application,
    it is absolutely essential that you set up a separate subdirectory for this purpose,
    and set only the Write permission. Read must not be allowed on this subdirectory,
    nor should the Execute permissions be set to anything other than None. Failure
    to follow these guidelines could allow an attacker to upload and execute hostile
    code in your application.'
  merge: -1
  pgno: 473
- img_proc: true
  md: '# Chapter 15 Deploying an ASP.NET Application 455


