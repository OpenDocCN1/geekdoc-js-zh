  md: '# CHAPTER 10


    # Using Server Controls


    +   In this chapter, you will learn about

    * The purposes of the two main types of server controls: HTML controls and Web
    controls

    * How to use specialized Web controls, such as the Calendar control and the Validation
    server controls

    * How to perform data binding on server controls

    * How to manipulate server controls programmatically at runtime

    * How to handle server control events


    Chapter 9 looked at how Web Forms pages are constructed, including some uses of
    server controls. This chapter will take an in-depth look at using server controls
    in your application.


    # Types of Controls


    As discussed briefly in the previous chapter, the built-in server controls in
    ASP.NET are divided into two groups, HTML controls and Web controls, each of which
    is contained in its own namespace. This section will discuss the available controls
    in each group and show examples of when and how to use each type of control. It
    will also discuss some of the specialized Web controls, including the Calendar
    and AdRotator controls, as well as the Validation server controls.


    # HTML Controls


    The HTML controls map 1-to-1 with the standard HTML elements. However, some HTML
    elements do not map directly to a specific HTML control. Why would you want to
    use an HTML control instead of just coding HTML?'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'You do this because you can easily manipulate the look and functionality of
    the page at runtime by changing the control''s attributes programmatically.


    The HTML controls reside in the System.Web.Ui.HtmlControls namespace, which is
    available to Web Forms pages automatically. The HTML elements for which there
    is direct mapping are shown in the following table.


    | HTML Element | Control Type | Purpose |

    | --- | --- | --- |

    | <a> | HtmlAnchor | Allows programmatic access to the HTML anchor element. Expires
    the `ServerClick` event. |

    | <button> | HtmlButton | Allows programmatic access to the HTML button element.
    This element is defined in the HTML 4.0 spec and is only supported by Internet
    Explorer 4.0 and higher. Expires the `ServerClick` event. |

    | <form> | HtmlForm | Allows programmatic access to the HTML form element. Acts
    as a container for other server controls. Any controls that need to participate
    in postbacks should be contained within an HtmlForm control. |

    | <img> | HtmlImage | Allows programmatic access to the HTML image element. |

    | <input type="button"><br><input type="submit"><br><input type="reset"> | HtmlButton
