  md: '# CHAPTER


    351


    # 12


    # Creating Custom Server Controls


    In this chapter, you will learn about


    +   - Choosing a base class for your control

    - Creating a namespace for your control(s)

    - Registering and using your control in a page

    - Extending and aggregating existing controls

    - Maintaining state in custom server controls

    - Handling postbacks

    - Providing “lossless” UI with templated controls


    Custom Server Controls


    Having spent the last two chapters studying ASP.NET, ADO.NET, and data-binding,
    by now you are probably thinking, “These server controls are cool, but I wish
    I could create my own.” Well, wish no! In this chapter, you’ll learn how to create
    ASP.NET server controls.


    There are as many reasons for developing custom server controls as there are developers,
    but generally they fall into three main categories: reuse, specialization, and
    maintenance.


    Creating custom server controls makes reuse easy. You can wrap a bunch of related
    functionality and UI elements into a control, and reuse that control where you
    need that functionality. For example, you could create a server control that encapsulates
    all of the fields and validation controls necessary for user registration. Then,
    instead of rewriting code anytime you need a user registration screen, you simply
    add your control to the page instead.'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'Specialization refers to taking an existing functionality, such as a server
    control, and adding your own customized functionality to it. Specialization in
    ASP.NET server controls is done through either inheritance or composition. You
    specialize in inheritance by inheriting from a class that provides most of the
    functionality you want, and then adding additional functions or overriding existing
    ones and adding your own implementation of those functions. Composition allows
    you to combine the functionality of two or more existing controls into a reusable
    control, adding additional functionality as desired.


    Finally, ASP.NET server controls simplify the maintenance of applications. Once
    a server control has been developed and tested, it can be reused reliably in many
    places. If you find a bug in your control, it can be fixed in a single place (the
    source class for your control), and all you need to do to distribute the fix is
    replace the assembly containing the fixed control. This is a major improvement
    over reuse through include files, or having no reuse at all.


    # Creating Your First Control


    Creating custom server controls with ASP.NET is fairly straightforward. A custom
    ASP.NET server control is any class that inherits from the Control of the System.Web.Ui
    namespace, or one that inherits from any of the controls derived from Control.
    Choosing from which to derive your custom control is largely a matter of how much
    functionality you want to build into your control. You will learn how to choose
    a control to inherit from later in this section.


    All server controls that send output directly to the browser do so by overriding
    the Render method of the control from which they''re derived. Controls that are
    derived from a control with its own UI rendering (like the TextBox server control)
    should also call the Render method on the base class in order to have the base
    control render its own output. That''s where the location in your code that you
    call the Render method of the base class is important. The Render method of the
    sample file TextBox.plus on this book demonstrates this.


    In addition to sending output to the browser directly through the Render method,
    some custom controls (in particular, compositional controls) send output to the
    browser indirectly by overriding the CreateControls method of the base Control
    class, which is used to add controls to a custom control at runtime. Some also
    call the RenderChildren method, which causes all of the child controls of a given
    control to execute their Render methods.'
  merge: -1
  pgno: 371
