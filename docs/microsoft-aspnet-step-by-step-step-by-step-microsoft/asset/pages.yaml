  md: '# # Chapter 16 Tracing and Debugging ASP.NET Applications


    ![](img/50a47de1541381ea3363945ae9c22411_486_0.png)


    # ## Using Trace.Warn


    Another method offered by the TraceContext for writing to the trace output is
    Trace.Warn. The primary difference between the two methods is that output written
    with Trace.Warn appears in the trace output as red text, making it ideal for highlighting
    important entries such as exceptions.


    # ## Understanding the Trace Output


    The trace output for a page contains a great deal of information. The following
    table lists the sections of the trace output and describes the information in
    each.


    | Section | Description |

    | --- | --- |

    | Request Details | Displays request-specific information such as session ID,
    request type, status code, and encoding. |

    | Trace Information | Displays messages relating to stages of page processing,
    as well as execution times for these stages. |

    | Control Tree | Displays a tree representation of all controls on the page, including
    LiteralControls for static HTML text within the source file. Also displays the
    render size and ViewState size of each control. |


    (continued)'
  merge: -1
