  md: '# Too Much Service


    The next important set of decisions comes when you install your operating system
    of choice (Windows 2000, for example), or when you are on services to be used
    by your application (with Windows NT, for which IIS 4.0, Microsoft Transaction
    Server, and ASP are add-ons to the operating system). This choice concerns which
    services will be installed.


    Unused running services can be a significant security risk. For example, if you
    install the FTP or SMTP services and have not protected the ports those services
    use, an attacker could detect the services and attempt to compromise your server
    through various known vulnerabilities. (You can also reduce the risk of compromise
    through diligent application of patches. See “Patching” on page 185 for more information.)


    If you are not using a service, you should avoid installing it, or use Add/Remove
    Programs to remove it. The following steps show how:


    +   1 Click Start, Settings, Control Panel.

    2 Double-click the Add/Remove Programs icon.

    3 In the left side of the window, click the Add/Remove Windows Components button.

    4 Review the list of installed components (shown in the following figure). Of
    particular interest is the IIS node. Select that node and click the Details.


