  md: '# Chapter 16 Tracing and Debugging ASP.NET Applications 475


    # Using Debug.Assert


    As mentioned, you can add Debug.Assert messages to your code to test certain conditions.
    The Assert method is overloaded and takes the following forms:


    ```

    Debug.Assert(condition)

    Debug.Assert(condition, shortmessage)

    Debug.Assert(condition, shortmessage, longmessage)

    ```


    condition is an expression that evaluates to true or false, shortmessage is a
    string containing a brief message to display when condition returns false, and
    longmessage is a string containing a detailed message to display when condition
    returns false. The following figure shows the runtime debugger stepping past an
    statement. Notice that the Output window is displaying the short message defined
    by the Assert statement.


    ![](img/50a47de1541381ea3363945ae9c22411_494_0.png)


    In order to call the Debug class without explicitly including the namespace, you
    need to import the System.Diagnostics namespace using the @ Import directive,
    as shown in the preceding figure.'
