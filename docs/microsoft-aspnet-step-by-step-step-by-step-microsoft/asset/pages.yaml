  md: "# Chapter 12 Creating Custom Server Controls 369\n\nIn this code, ControlName\
    \ represents the name of the control in which the event is defined, and EventName\
    \ represents the name of the event. The syntax is not required, but it's naming\
    \ convention typically followed for event handlers. You can call your event handlers\
    \ whatever you want, but following the naming standard will make your code easier\
    \ to read and maintain.\n\nTo wire the event handler to your control, add an OnEventName\
    \ attribute to the tag in which you declare the control, with the value set to\
    \ the name of the event handler.\n\n```\n<ASPNETSBS:MyControl id=\"MC1\" OnEventName=\"\
    MC1_EventName\"\nrunat=\"server\">\n```\n\nYou'll see a full implementation of\
    \ these principles after the discussion of handling postbacks.\n\n# Overriding\
    \ Inherited Events\n\nYou can override events that are defined on the base control\
    \ from which your control is derived. The standard events that are defined by\
    \ the control class are as follows:\n\n+   * Initialize for the current request\n\
    * Load Perform actions that need to be performed for each once child controls\
    \ have been created and initialized\n* DataBinding Perform actions needed to evaluate\
    \ data-binding expressions associated with a control\n* PreRender Perform any\
    \ modifications to the control or data necessary before rendering the control\n\
    * Unload Perform clean-up tasks before the control is removed from memory\n\n\
    To override an event exposed by an inherited class, you override its associated\
    \ OnEventName method. For example, to override the PreRender event, you would\
    \ use the following code in your control:\n\n```\nProtected Overrides Sub OnPreRender(Source\
    \ As Object, e As EventArgs)\n  'Event handling code\nMyBase.OnPreRender(Source,\
    \ e)\nEnd Sub\n```"
