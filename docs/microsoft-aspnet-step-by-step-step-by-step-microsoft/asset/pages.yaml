  md: "# Chapter 7 Configuring an ASP.NET Application 123\n\nThe <location> tag has\
    \ two attributes: path and allowOverride. The path allows you to specify a path\
    \ to which the settings within the <location> tag pair apply. This attribute allows\
    \ you to use a single configuration file, such as Machine.config, to apply configuration\
    \ settings for multiple applications, virtual directories, or files on the same\
    \ machine. Some settings may only be set at the machine or application level.\
    \ If you attempt to set these at the directory or file level using the path attribute,\
    \ an exception will be thrown.\n\n> note\nWhen're using the path attribute to\
    \ apply configuration settings to multiple locations, use comments to clarify\
    \ the intended purpose of each set of <location> tags. In shared server environments,\
    \ use comments to note the person responsible for a given set of configuration\
    \ settings.\n\nThe allowOverride attribute determines whether the settings within\
    \ the <location> tag pair can be overridden by settings applied in a child configuration\
    \ file. If this attribute is set to false, any attempt to change the specified\
    \ setting in a child configuration file will result in an exception.\n\nTo use\
    \ the <location> tag to lock down configuration settings\n\n+   1 Open the configuration\
    \ file (Web.config or Machine.config) from which you want to lock down a particular\
    \ setting.\n\n+   2 Add the following code within the <configuration> and </configuration>\
    \ tags:\n<location path=\"to lock down\" allowOverride=\"false\">\n  <system.web>\n\
    \  </system.web>\n</location>\n\n+   3 Add the desired configuration elements\
    \ between the <system.web> and </system.web> tags.\n\n# ASP.NET Configuration\
    \ Elements\n\nNow that you've looked at the location and structure of the ASP.NET\
    \ configuration files and how to override the settings of one Web.config file\
    \ with another, look at the individual configuration elements for configuring\
    \ ASP.NET applications. This section lists the syntax for each configuration element\
    \ and describes the attributes and child elements available for that element (where\
    \ applicable)."
  merge: -1
  pgno: 142
- img_proc: true
  md: "# ASP.NET Step by Step\n\nThe names of configuration elements and their attributes\
    \ are case sensitive and are in referred to as camel case. The entire first word\
    \ of a name is lower-case, and the initial letter of each additional word in the\
    \ name is capitalized. For example, the *sessionstate* configuration element becomes\
    \ *sessionState*. Remember to use camel case with both configuration element names\
    \ and attribute names, you'll get an error when you try to access a page in an\
    \ application.\n\n# <trace>\n\n <trace> element allows you to enable or disable\
    \ application-wide tracing (see Chapter 16 for on this useful feature), as well\
    \ as the parameters for the tracing functionality. When tracing is enabled, you\
    \ can review information about requests received by the Web server with the specific\
    \ URL http://<servername>/<appname>/trace.axd. The <trace> element has the following\
    \ syntax:\n\n```\nenabled=\"true|false\"\nlocalOnly=\"true|false\"\npageOutput=\"\
    true|false\"\nrequestLimit=\"integer\"\ntraceMode=\"SortByTime|SortByCategory\"\
    \ / >\n```\n\nFor information about <trace> element attributes, consult the following\
    \ table.\n\n| Attribute | Description | Options |\n| :--- | :--- | :--- |\n| enabled\
    \ | Determines whether application-level tracing is enabled for the application.\
    \ | true Turns on application-level tracing. false Turns off application-level\
    \ tracing. The default is false |\n| localOnly | Determines whether trace information\
    \ is viewable by computers other than the local Web server. | true Trace output\
    \ can be viewed only from the local Web server. false Trace output is viewable\
    \ by any machine. The default is true. |"
  merge: -1
