  md: '# Distinguishing Between Physical Path and URL


    An important distinction to make when discussing deployment is between the physical
    path of an application (that is, the application''s location within the file system
    of its server) and the URL of the application. This distinction becomes important
    when discussing the array of different tools available for deployment, of some
    which (like the DOS XCOPY command) use file or network paths, and of which (like
    FTP and WebDAV) use URLs.


    There is only a single file path for a given application root in IIS. However,
    there may be more than one directory in IIS that maps to a single physical directory
    in the file system. This allows you to set up URLs for both public and private
    access to a given application, with different IIS settings for each. If more than
    one IIS application root points to the same physical directory in the file system,
    IIS application root will have its own IIS-specific settings. It is important
    to note, however, that if the physical directory contains ASPNET-specific configuration
    and start-up files (Web.config and Global.asax), the settings in these files will
    be shared by both IIS applications.


    One important caveat to this sharing is when a subfolder containing a Web.config
    file and/or Global.asax file is defined as an application root in one of the IIS
    applications. In the first case, which is illustrated by the following figure,
    requests to this subfolder will use the Global.asax file for start-up code.


    ![](img/50a47de1541381ea3363945ae9c22411_467_0.png)


    In the second case, illustrated by the following figure, the Global.asax file
    contained within this subfolder will be ignored.'
  merge: -1
  pgno: 467
- img_proc: true
  md: '![](img/50a47de1541381ea3363945ae9c22411_468_0.png)


    You should also note that there are certain settings in the Web.config file that
    are only applicable at the application root level. For example, if the Web.config
    file contained in the Chapter 15 folder illustrated in the preceding figure contains
    an <authentication> section, a configuration error will result because this section
    can only be defined at the machine (Machine.config) or application root level.


    The URL for a specific application root in IIS is a product of the domain name
    (if any) associated with the IP address that is assigned to the IIS Web site and
    the application root. Thus, in the previous figure, the aspnetbs application root
    resides under the default Web site, the URL to reach the Chapter 15 directory
    would be either http://localhost/aspnetbs/Chapter15/ or http://servername/aspnetbs/Chapter15.


    This works because requests for localhost or servername (where server represents
    the name of the Web server) are automatically directed to the default Web site.
    If you wanted to make the content of the Chapter 15 application root available
    on the Internet, you would need to create a new IIS Web site, assign a publicly
    available IP address on machine to the Web site, and then create (or have a DNS
    provider create) a DNS entry that maps your chosen domain name (say, www.aspnetbs.com)
    to that IP address. Then you would create a new application root under the new
    Web site that maps to the Chapter 15 directory in the file system. Then you could
    access this application from the Internet http://www.aspnetbs.com/Chapter15.


    Note that if you have directory browsing disabled (the default), you will need
    to set a default document on the documents tab of the Properties dialog for the
    directory, in case the user does not enter a document name. The name of the'
  merge: -1
  pgno: 468
- img_proc: true
  md: "default document should match the name of a page that exists in the directory.\n\
    This will allow access to content using a URL that does not contain a document\n\
    name, as such the providing URLs. Otherwise, the name of the desired file must\n\
    be appended, or an error will occur.\n\n# Storing Application-Specific Configuration\
    \ Settings\n\nOne of the challenges with deploying most non-trivial Web applications\
    \ in classic\nASP is figuring out to store application-specific configuration\
    \ information.\nIn classic ASP, there were a number of approaches, including using\
    \ custom keys in\nthe system registry, storing configuration information in a\
    \ back-end database,\nreading configuration settings from a custom configuration\
    \ file, and building set-\ntings into components. Each approach has its own set\
    \ of drawbacks that make it\nless ideal.\n\nFor example, storing configuration\
    \ information in the system registry makes\ninformation relatively secure (particularly\
    \ if registry security procedures\nare followed). However, adding information\
    \ to the registry or modifying it\nfrom a remote machine may be difficult, if\
    \ not impossible, due to permission set-\nings to protect the registry from remote\
    \ tampering. Additionally, access-\ning settings within the registry can be expensive\
    \ for a performance standpoint.\n\nNeither storing configuration information in\
    \ a back-end database nor in\ncustom configuration files provides easily repeatable\
    \ procedures for multiple applications.\nThe database solution requires that changes\
    \ to the Web application and the con-\nguration database be synchronized so that\
    \ users always get the correct informa-\ntion. The custom configuration file solution\
    \ requires building logic into pages or\ncomponents to parse and cache the application\
    \ settings, which periodically check-\nto see if settings have been modified and\
    \ loading the new settings they have.\n\nTo simplify this situation, ASP.NET provides\
    \ a special section of the Web.config\nand Machine.config files called appSettings,\
    \ which allows you to store applica-\ntpecific configuration settings as a set\
    \ of key/value pairs.\n\n```\n<appSettings>\n  <add key=\"myConfigKey\" value=\"\
    myConfigValue\" />\n</appSettings>\n```\n\nWhen your application starts up, ASP.NET\
    \ caches the values of the appSettings\nsection in a string collection called\
    \ ConfigurationSettings.AppSettings. These set-\ntings can be accessed by passing\
    \ the desired key to this configuration, as shown here:\nLabel1.Text = ConfigurationSettings.AppSettings(\"\
    myConfigKey\")"
