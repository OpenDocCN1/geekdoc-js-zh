    ```

    </script>

    ```


    You can also handle events exposed by custom HttpModules, which are classes that
    inherit the IModule interface and participate in processing ASP.NET requests.
    Handling events exposed by custom HttpModules is essentially the same as handling
    the application and session events. Events exposed by the Http-Module must use
    the naming pattern modulename_eventname(eventargs).


    # Importing Namespaces in Global.asax


    Importing a namespace into your ASP.NET pages allows you to refer the members
    of that namespace without having to fully qualify the member names. For example,
    you could refer to Color instead of System.Drawing.Color. While it''s easy to
    use the @ Import directive in your individual ASP.NET pages, you can save yourself
    time by using @ Import in Global.asax for namespaces that you use in most or all
    of your pages. For example, if you wanted to be able to call the System.Web.UI
    namespace in any ASP.NET page in your application, you could simply add the following
    line:


    ```

    <@ Imports Namespace="System.Web.UI"

    ```


    There are two things you should keep in mind.


    +   If two or more namespaces you''ve imported contain members with the same names,
    you''ll still need to qualify the names in your code to avoid conflicts.


    +   While it''s useful to avoid having to type extra code (especially in a large
    application), keep in mind that by not importing the namespaces used in each page,
    you make your code somewhat less readable and maintainable. That is, someone who
    hasn''t looked at your Global.asax file may not immediately grasp the names in
    your pages are not fully qualified, and he or she may have more difficulty figuring
    out which namespace particular class or structure comes from.


    # Importing Components in Global.asax


    If there are components that are used throughout your application, you may want
    these components to run in application scope (shared across all users of your
    application) or session scope (shared across all pages in your application for
    a single user). For'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Chapter 5 Creating an ASP.NET Web Application 93


    store information to be shared across user sessions. You can instantiate this
    as a component in Global.asax using the <object runat="server"> tag syntax. The
    syntax can be used with a proid= or classid attribute to instantiate a classic
    COM component, or with a class= attribute to instantiate a .NET component. The
    following example would create an instance of the System.Data.DataSet that could
    be used throughout the application:


    ```

    <object runat="server" class="System.Data.DataSet

    scope="Application">

    ```


    If you omit the scope attribute, the default scope for server-side objects created
    in Global.asax the <object> tag is AppInstance, which means that the object is
    local to Global.asax, but you should always use the scope attribute to explicitly
    control whether the component is given Application, Session, or AppInstance scope.


    The following are some things to keep in mind with components you instantiate
    in Global.asax.


    +   - Limit the number of components you instantiate at Application or Session
    level to those you absolutely need. Remember that these objects will be consuming
    resources (such as memory) for the entire lifetime of the Application (or Session).
    This consumption level can be a problem for applications requiring high scalability.

    - Any components instantiated by the <object> tag should be multithreaded. In
    the .NET world, this isn''t a major difficulty, but you should avoid things like
    like classic COM components written in Visual Basic 6 with this syntax.

    - Components created with the <object> tag syntax are not instantiated immediately,
    but at the time when they’re first called on a page.


    # Creating a Web.config File


    Another optional file you can add to your application is called Web.config. This
    is an XML-based, human- and machine-readable file that contains the configuration
    options for your application. The reason that this Web.config file is optional
    is that if you don''t include it, your application will inherit the settings of
    the machine-level configuration file Machine.config. If you add a Web.config file
    to your application root, the configuration settings contained in that file will
    apply throughout your application. You can override these settings in specific
    areas of your application by setting up child folders in your application that
    contain their own Web.config files. In this way, you can set up a hierarchy of
    configuration settings for your application.


    ![](img/50a47de1541381ea3363945ae9c22411_112_0.png)'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'Among the configuration options that are controlled by Web.config are


    +   - **HttpModules and HttpHandlers** Process specific types of requests and
    are similar to ISAPI filters


    +   - **Session state** Determine whether session state is in process, out-of-process
    (shared across multiple machines), or stored by SQL Server


    +   - **Browser capabilities** Customize the properties returned by the HTTPBrowserCapabilities
    class when it encounters a given browser


    +   - **Security** Determines the settings for authentication, authorization,
    and identity


    +   - **Compilation** Determines the settings used for compiling the code in an
    ASP.NET application, including which external assemblies are included in the compilation
    of the application


    +   - **Trace** Provides configuration settings for ASP.NET application tracing
    (See Chapter 16 for more information on application tracing.)


    Several more areas of configuration are available to the Web.config file. A more
    detailed discussion of ASP.NET configuration can be found in Chapter 7.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# # Chapter 5 Quick Reference


    | To | Do This |

    |---|-|

    | Create a new project in Visual Studio .NET | Click the New Project button, select
    the project language and template, and provide the name and location for the new
    project. Alternatively, you can go to the File menu, select New, and choose Project.
    |

    | Create a Virtual Directory in IIS | Start the Internet Services Manager, right-click
    the Web site you want to add the Virtual Directory to, and then select New and
    choose Virtual Directory. Follow these instructions in the Virtual Directory Creation
    Wizard. |

    | Create a new Web Forms page | Add the @Page directive with a Language= attribute
    to the top of an HTML page and save it with the .asx extension. Add code using
    either <script> blocks with the runat="server" attribute or <% %> render blocks.
    |

    | Handle application and session-level events | Create a Global.asax file in the
    application root with the appropriate event handlers. |

    | Configure application settings | Create a Web.config file with the appropriate
    configuration sections. You can modify configuration settings for sections of
    your application by partitioning it into separate folders and placing a Web.config
    file in each folder that owns its own configuration settings.'
