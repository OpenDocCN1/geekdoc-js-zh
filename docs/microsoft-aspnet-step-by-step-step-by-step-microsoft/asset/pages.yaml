    # Passwords, Please


    One of the most common (dangerous) areas overlooked in Web server security is
    password protection. Problems in this area include weak or nonexistent passwords
    for sensitive information or services, and placing passwords in plain-text files
    as ASP and ASP.NET pages, Global.asa or Global.asax, or configuration files in
    the Web space.


    # Weak or Blank Passwords


    A simple rule of thumb for sensitive information on your Web server is that it
    should be protected by a password, and a strong one. Too often, developers wrongly
    assume that it''s sufficient to put Web pages that are to be accessed only by
    certain authorized users (or other sensitive content) in a directory that is only
    accessible by entering the URL directly. Worse, Web developers who are not sufficiently
    familiar with SQL Server (or its desktop equivalent, MSDE, which is installed
    with the .NET Framework QuickStart samples) may install these databases on a Web
    server or another server on their network without understanding the security ramifications.


    SQL Server and MSDE both contain an extended stored procedure called xp_cmdshell
    which allows command-line commands to be run on the server. Why is this important?
    Because in many cases, people still install SQL Server or MSDE with a blank password
    for the sa (system administrator) account. For a server connected to the Internet,
    this is like begging to be hacked. One webhosting company that hosts a site devoted
    to ASP and ASP.NET articles fell prey to precisely this problem (due to the default
    configuration of MSDE in the Beta 2 .NET Framework QuickStart samples, which included
    a blank password). This highlights the inherent risk of both beta software and
    of samples, which are rarely designed for high security. The result was that some
    malcontents used'
