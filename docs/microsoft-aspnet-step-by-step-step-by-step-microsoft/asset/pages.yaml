    production of this book is long, and I hope that I don''t leave anyone out. If
    I missed anyone, please know that your contributions are appreciated.


    First I would like to thank my mother for her unceasing support and encouragement.
    During the process of writing this book, I made the transition working as a consultant
    for someone else to starting and running my own company, something that my mother
    assured I would eventually have to do. Once, Mom, you were right.


    Several members of the ASP.NET development team provided invaluable support along
    the way. My thanks to Scott Guthrie and Susan Warren, for their willingness to
    take time out of their schedules early and often to share information about this
    exciting new technology with authors and helping us to share it with readers.
    Thanks also to Erik Olson for his assistance in reviewing this book and helping
    me make it better, and especially to Rob Howard, for cheerfully making himself
    available to answer my many questions and for his hard work in making sure that
    authors and developers alike have the best possible information. To the extent
    that this book is successful in helping you learn ASP.NET, they deserve a good
    deal of credit. Any shortcomings of the book are mine alone.


    I appreciate the support and assistance provided by my acquisitions editors, David
    Clark, and the team at Microsoft Press. Writing about beta software is never easy,
