    - Visual Tools for working with Web services, Web Forms server controls, and database
    tools

    - Packaging and deployment services for Web applications

    - Support for multiple languages within a single IDE, including cross-language
    inheritance and debugging


    That''s just a brief list. There''s much more to the tool than can be covered
