- img_proc: true
  md: '# Managing Application State


    +   In this chapter, you will learn about

    * Using application state

    * Using session state

    * Configuring state storage

    * Using client-side cookies for state storage

    * State and scalability

    * ASP.NET server control state


    Most applications of any significance will use pieces of data, or variables, that
    need to be maintained across a series of requests or shared between multiple users
    of an application. This data is referred to as *state*. In a rich client application,
    it''s relatively simple to maintain individual user state simply by allocating
    space in memory of the client machine. In Web applications, managing user and
    application state is more challenging. The primary reason for this is that the
    Hypertext Transfer Protocol (HTTP), the protocol used to send and receive requests
    through a Web browser, is inherently stateless. That is, HTTP doesn''t inherently
    provide a way for the Web server to identify a series of requests as coming from
    the same user, making it difficult for the Web server to maintain state and associate
    it with an individual user.


    In classic ASP, this limitation was overcome through an in-memory collection of
    key-value pairs associated with the *Session* intrinsic object. The *Session*
    collection, however, had a number of important limitations of its own, which are
    discussed later in this chapter.'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'In addition to individual user state, many applications need to store and retrieve
    application-level state information that is global to all users of the Web application.
    Classic ASP exposed a collection similar to that of the Session collection on
    the Application intrinsic object.


    # Using Application State


    Application state refers to any data that you wish to share among multiple users
    of your application. This can include connection string information for databases
    (although this information is often better limited to the business tier of an
    application), shared variables, and cached datasets (although these may be better
    stored using the ASP.NET cache engine, which is discussed in more detail in Chapter
    14). In fact, one of the difficulties in managing application state is choosing
    from the many available options for storing this state.


    Like ASP, ASP.NET provides a collection of key-value pairs that developers can
    use to store values and object instances. This can be accessed in the same way
    as in classic ASP (the slight difference in syntax between VB.NET and # in accessing
    the Application collection).


    ```

    VB.NET

    Application("MyApplicationVar") = "MyValue"

    MyLocationVar = Application("MyApplicationVar")

    ```


    ```

    // C#nApplication["MyApplicationVar"] = "MyValue"

    MyLocationVar = Application["MyApplicationVar"]

    ```


    Application state storage in ASP.NET is supplied by the .NET HttpApplication class,
    an instance of which is exposed as the Application property of the Page class.
    Because every ASP.NET page inherits from the Page class, you can access the Application
    property as if it is an inherent property of the page, as shown in the preceding
    code.


    For backward-compatibility with classic ASP, the ASP.NET Application object exposes
    a Contents property that can be used to access individual values, using the appropriate
    key.


    ```

    VB.NET

    Application.Contents("MyApplicationVar") = "MyValue"

    MyLocationVar = Application.Contents("MyApplicationVar")

    ```'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Chapter 6 Managing Application State 99


    New in ASP.NET is the ability to add items to the Application collection using
    the Add method exposed by the Application object. You can use the Remove method
    (exposed by the Application.Contents collection in classic ASP) to remove items
    from the Application collection.


    ```

    VB.NET

    Application.Add("MyApplicationVar", "MyValue")

    Application.Remove("MyOtherApplicationVar")

    ```


    ```

    // C#

    Application.Add("MyApplicationVar", "MyValue");

    Application.Remove("MyOtherApplicationVar");

    ```


    You can also clear the contents of the Application collection by using the Clear
    method exposed by the Application object (or the RemoveAll method, which is for
    backward-compatibility with classic ASP).


    +   VB.NET

    Either line below will clear the application state

    Application.Clear()

    Application.RemoveAll()


    The Application object exposes several other ways to access and modify the values
