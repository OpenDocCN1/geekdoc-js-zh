  md: "# If Statements\n\nIf statements are the form of conditional logic, also known\
    \ as decision structures, that you will probably use most in your programs. They\
    \ allow you to look for a defined condition in your program and execute a specific\
    \ block of code if that condition is true. The following code checks a Session\
    \ variable for the logged-in username (see the login page) to prevent a user who\
    \ has not logged into your ASP.NET application from viewing pages that require\
    \ a login:\n\n```\nIf Session(\"LoggedIn\") = \"\" Then\n    Response.Redirect(\"\
    Login.aspx\")\nEnd If\n```\n\nIn Visual Basic .NET, an If statement always requires\
    \ an accompanying End If statement to denote the close of the If block. You can\
    \ also provide code that will execute if the defined condition is false by adding\
    \ the Else Select statement, and you can test for more than one condition by using\
    \ one or more `ElseIf` statements. These techniques are shown in the following\
    \ example:\n\n```\nIf Session(\"LoggedInUserName\") = \"\" Then\n    Response.Redirect(\"\
    Login.aspx\")\nElseIf Session(\"LoggedInUserName\") = \"SuperUser\" Then\n   \
    \ Response.Write(\"You are a superuser!\")\nElse\n    Response.Write(\"Hello,\
    \ \" & Session(\"LoggedInUserName\") & \"!\")\nEnd If\n```\n\n> note\nVisual Basic\
    \ .NET supports single-line If statements, such as the following:\nIf 1 < 2 Then\
    \ Response.Write(\"1 is less than 2\")\nThis syntax should only be used for very\
    \ simple If statements, as it is inherently harder to read and debug line statements.\n\
    \n# Select Case Statements\n\nAnother form of conditional logic you'll use frequently\
    \ is the Select Case statement. This is useful in situations where you can reasonably\
    \ expect the defined condition you're testing to evaluate to one of a limited\
    \ number of values (or ranges of values). For example, the following code checks\
    \ to see which item of a listbox was chosen by a user, and then it takes appropriate\
    \ action."
