    \ a copy below the original. Modify the class name to HelloControlProp. The following\
    \ code added to the class creates a private variable and a public Property procedure\
    \ to provide access to the private member variable. It also modifies the Render\
    \ method to use the value of the local variable.\n\n```\nPublic Class HelloControlProp\n\
    \    Inherits Control\n    Dim _name As String = \"World\"\n    Public Property\
    \ Name As String\n        Get\n            Name = _name\n        End Get\n   \
    \     Set(ByVal Value As String)\n            _name = Value\n        End Set\n\
    \    End Property\n    Protected Overrides Sub Render(writer As HtmlTextWriter)\n\
    \        writer.Write(\"Hello, \" & _name & \"!<br>\")\n    End Sub\n```"
