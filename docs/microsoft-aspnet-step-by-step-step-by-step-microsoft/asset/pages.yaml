    # Locating a Web Service with UDDI


    Unlike using a discovery document to locate a Web service, UDDI does not require
    you to know in advance the URL of a document describing the desired Web service.
    Any provider of a UDDI business usually provide a tool for searching their instance
    of the registry for businesses or Web services that meet your needs. The criteria
    you can search on will depend on the organization hosting that. For example, Microsoft’s
    UDDI registry at http://uddi.microsoft.com supports searching by business name,
    business location, discovery URL, keyword, and a variety of other. The following
    shows the list of criteria for searching the Microsoft UDDI registry.


    ![](img/50a47de1541381ea3363945ae9c22411_436_0.png)


    One effective technique for searching for Web services on the http://uddi.microsoft.com
    registry is to search by discovery URL and search for URLs that contain "wsdl".
    These URLs are the most likely to point to live WSDL contracts that you can use
    to access Web services.'
