- img_proc: true
  md: "# Chapter 7 Configuring ASP.NET Application 119\n\nWhen a change is made, all\
    \ new requests for resources within the scope of a given configuration file use\
    \ the new configuration settings automatically.\n\n# Introducing Web.config\n\n\
    Like the Machine.config file, Web.config is XML based. This means that each Web.config\
    \ file is made up of tags and attributes, similar to HTML. (XML is a markup language\
    \ based on Structured Generalized Markup Language or SGML, the same language on\
    \ which HTML was based.) Machine.config, however, most Web.config files will not\
    \ contain elements for every available configuration setting. In fact, an ASP.NET\
    \ application doesn't require a Web.config file in order to function. If Web.config\
    \ is omitted from an application, it simply inherits its configuration settings\
    \ from the master configuration file, Machine.config.\n\nA Web.config file has\
    \ the following basic structure:\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    \ ?>\n<configuration>\n  <system.web>\n    <elementName1>\n      <childElementName1\n\
    \        attributeName1=value\n        attributeName2=value\n        attributeNameN=value\
    \ />\n      </elementName1>\n    <elementName2>\n      attributeName1=value\n\
    \      attributeName2=value\n      attributeNameN=value\n    </elementName2>\n\
    \    <elementNameN>\n      attributeName1=value\n      attributeName2=value\n\
    \      attributeNameN=value />\n  </system.web>\n</configuration>\n```\n\nEach\
    \ Web.config file should begin with the standard XML declaration, though it will\
    \ work without it. The file also contains opening and closing <configuration>\
    \ tags. Nested within these tags are the opening and closing <system.web> tags,\
    \ indicating that the content within is ASP.NET-specific configuration information.\
    \ This configuration information is supplied in tags referred to as elements.\
    \ Each element consists of either an opening and closing tag with one or more\
    \ child\n\n![](img/50a47de1541381ea3363945ae9c22411_138_0.png)"
  merge: -1
  pgno: 138
- img_proc: true
  md: 'elements to provide specific configuration values, or tag pair with one or
    more attributes to provide specific configuration values. If an element doesn''t
    have child elements, you can omit the closing tag by adding the / character at
    the end of the opening tag. (This is standard XML syntax.) You''ll see this format
    in action in “ASP.NET Configuration Elements” on page 123.


    # note


    Many developers found it frustrating that Visual InterDev 6 reformatted code according
    to its preferred style. That feature was difficult, if not impossible, to turn
    off. In Visual Studio .NET, not only can you control how code is validated and
    formatted, but in most cases you can turn off formatting entirely.


    View or change the formatting settings for a given language, from the Tools menu
    select Options, and then click the Text Editor folder. Click for the language
    of your choice (see the following figure). Note that for some languages, the formatting
    settings appear on more than one page. For example, HTML/XML formatting options
    are set on the Format page, the HTML Specific page, and the XML Specific page,
    all under the HTML/XML folder.


    # Editing Configuration Files


    At the time of this writing, the Visual Studio .NET environment''s tools for editing
    configuration files are limited to syntax coloring, XML validation, and code-formatting.
    Because the ASP.NET configuration files are XML-based, you can use your favorite
    XML editor (or text editor) to edit ASP.NET configuration files.


    ![](img/50a47de1541381ea3363945ae9c22411_139_0.png)'
