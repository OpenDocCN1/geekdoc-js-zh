  md: '# note


    To avoid having to explicitly close the connection associated with the command
    used to create either a SqlDataReader or an OleDbDataReader, pass the CommandBehavior.CloseConnection
    argument to the ExecuteReader method of the connection.


    ```

    mySqlReader = mySqlCommand.ExecuteReader(CommandBehavior.CloseConnection)

    ```


    The associated connection will be closed automatically when the Close method of
    the datareader is called. This makes it all the more important to always call
    Close on your datareaders!


    # Data-Binding


    One exciting advance in the move from classic ASP to ASP.NET is the availability
    of server-side data-binding. Data-binding is the process of declaratively tying
    elements of the UI for a page (such as controls) to data in an underlying datastore.
    Data-binding on the client has been available in Internet Explorer for a number
    of years, but it requires all of your users to use the same browser, or else you
    need to do a massive amount of testing to ensure compatibility with different
    browser versions. Server-side data-binding solves this by binding and rendering
    data on the server and returning cross-browser-compatible HTML.


    ASP.NET allows you to bind against a variety of sources, including properties
    and method call results, arrays and collections, and datadources and dataviews.
    Typically, binding is done either declaratively, using the <%expression%> syntax,
    or by programmatically setting the DataSource property of a control to the desired
    datasource. The data is bound by calling the DataBind method, at the Page level
    (which binds all controls on the page) or on the control (which binds the control
    and its child controls). The DataBind method causes the control and its children
    to evaluate any data-binding expression(s) associated with the control and assign
    the resulting values to the appropriate control attribute. Data-binding allows
    controls like the DataGrid control, which can handle over multiple rows and columns,
    and format the data specified by their DataSource property for display.'
