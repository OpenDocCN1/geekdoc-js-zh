  md: '# Creating and Using Web Services


    +   In this chapter, you will learn about

    * What a Web service is

    * How to create a Web service

    * How to advertise & locate a Web service

    * How to consume a Web service


    Previous chapters have focused on the creation of ASP.NET Web Forms, as well as
    the technologies that make ASP.NET development possible and those that make it
    very simple and quick to create robust, feature-rich Web applications. Another
    important and very useful part of ASP.NET that hasn''t been discussed is XML-based
    Web services.


    Today, Web services are not a very well-understood technology. Part of this is
    because of inaccurate reporting from the media, who describe Web services as everything
    from subscription software to a proprietary plot by Microsoft to take over the
    Internet. These stories may sound great in print, but they are based on misunderstandings
    and ignorance of this potentially revolutionary technology.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# Understanding XML-Based Web Services


    For many years, developers have sought ways to reuse the products of their work,
    or to bring together disparate systems that their organizations had already invested
    in to form a cohesive whole. This quest has been fraught with difficulties, ranging
    from disparate platforms and systems with no common standard for communication
    to security measures that prevented potential clients from outside a corporate
    network from being able to use functionality.


    Some of the solutions for these difficulties have included creating Web front-ends
    for existing functionality, or using proprietary communications and/or packaging
    technologies to bridge the gap between systems. The former solution worked well
    in some situations, but the organization hosting the application had to create
    and maintain a UI for the functionality that they made available, as well as creating
    a front-end for any additional functionality added later. Moreover, this UI might
    or not fully meet the needs of their existing and future clients. The use of proprietary
    communications or bridging software typically meant greater expense, reliance
    on a single vendor, and dependence on that vendor’s maintenance and upgrades.
    XML-based Web services address both of these issues squarely, allowing programmatic
    functionality to be exposed without the need for a custom Web-based UI, and without
    the need for properly bridging software.


    Web services are discrete units of programmatic functionality exposed to clients
    via standardized communication protocols and data formats, making HTTP and XML.
    These protocols and formats are both well-understood and widely accepted. (While
    XML is still a relatively immature technology, it has rapidly gained acceptance
    in the industry due to its promise as a bridging technology.)


    By communicating over HTTP, Web services overcome the problem of communicating
    across the Internet and across corporate firewalls without resorting to proprietary
    solutions that require additional communications ports to be opened to external
    access. Because Web services use XML for the formatting of requests and responses,
    they can be exposed and consumed by any platform that can format and parse an
    XML message. This allows XML-based services to bring together disparate pieces
    of functionality, whether existing or new, whether internal or external to an
    organization, into a coherent whole. The following shows how XML-based Web services
    can bring together a variety of applications and platforms. Note that XML Web
    services communicate over standard protocols such as HTTP, they can work over
    firewalls. In addition to the interactions shown, server-to-server Web services
    are also possible.'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# Chapter 13 Creating and Using Web Services


    ![](img/50a47de1541381ea3363945ae9c22411_418_0.png)


    Web services are accessed by calling into a listener that is able to provide a
    contract to describe the Web service, and that also processes requests or passes
    them to other application logic and passes any responses back to the client. The
    following figure shows how a Web service application may be layered. It is also
    possible to use Web services to access legacy logic as well as new application
    logic, or to wrap legacy logic for access by a Web service.


    ![](img/50a47de1541381ea3363945ae9c22411_418_1.png)


    # SOAP and Web Services


    The SOAP protocol is a key enabler of XML-based Web services as a strategy for
    application integration and Internet-based software services. SOAP, which stands
    for Simple Object Access Protocol, is an XML-based messaging protocol that’s being
    standardized by the World Wide Web Consortium (W3C) and has wide'
  merge: -1
  pgno: 418
- img_proc: true
  md: 'support from a variety of vendors. The SOAP specification provides a mandatory

    format for SOAP messages (referred to as SOAP envelopes), as well as optional

    standards for data encoding, request/response processing, and binding of SOAP

    messages to HTTP.


    SOAP and XML-based Web services are too complicated to cover in a single

    chapter. Fortunately, one of the advantages of the ASP.NET programming model

    is that it abstracts the complexity of SOAP messaging from the development of

    Web services.


    # Additional Needs for Web Services


    As mentioned earlier in this chapter, a Web service is nothing more than a way
    to

    provide discrete units of application functionality over Web protocols,

    using a standardized message format. To be truly useful, however, Web services

    also need to provide the following:


    +   - A contract that specifies the parameters and datatypes it expects, as well
    as

    the return types (if any) it sends to callers, and

    - A facility for locating the Web service, or a means of discovering Web

    services offered by a given server or application, and the descriptions of

    these services


    The next several sections will examine creating, advertising, locating, and con-

    suming Web services from the standpoint of an ASP.NET Web developer.


    # Creating a Web Service


    In ASP.NET, the complexities of SOAP messaging and HTTP transport are

    abstracted from developers, creating XML-based Web services are actually quite

    simple. This abstraction is enabled through attributes that tell the common lan-

    gage runtime (runtime) to create a specified class and methods as Web services.

    Based on these attributes, the runtime provides all of the plumbing necessary
