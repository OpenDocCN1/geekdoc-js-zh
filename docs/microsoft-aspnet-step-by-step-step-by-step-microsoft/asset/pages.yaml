    # # Enabling Session State


    Unlike application state, which is always available to Web applications, session
    state must be enabled before you use it. The good news is that the default configuration
    file at the server level (Machine.config) automatically enables session state,
    so you don''t need to take any additional steps to enable it. Nonetheless, you
    should be aware of the settings in the Machine.config configuration file, as well
    as in the Web.config configuration file for your application, determine whether
    session state is enabled or disabled. The pertinent settings are detailed in Chapter
    7.


    If you want to delay the creation of a session until it''s necessary, you can
    add the EnableSessionState attribute to the @ Page directive of all pages not
    requiring session state.


    ```

    <% Page EnableSessionState="False" %>

    ```


    Any attempt to access the Session object from a page on which EnableSessionState
    has been set to False will result in an error. Note that once a session has been
    created for a given user, setting the EnableSessionState attribute to False doesn''t
    result in the destruction of the existing session. It only prevents access to
    the Session object from that.


    You can set the session state to read-only for a given page by setting the EnableSessionState
    attribute to ReadOnly. Any attempts to update values stored in the Session collection
    from that page will be ignored.'
