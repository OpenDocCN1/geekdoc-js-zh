    in Chapter 9, looks like following:


    ```

    <@ Register TagPrefix=<tag prefix> Namespace=<namespace name>

    Assembly=<assembly name> %>%

    ```


    Here, tag prefix is the text that you will use in the tag for your control to
    associate it with your assembly, namespace is the name of the namespace defined
    in the assembly, and assembly name is the name of the compiled assembly (without
    the .dll extension). Once your control is registered in the page, you can declare
    the'
