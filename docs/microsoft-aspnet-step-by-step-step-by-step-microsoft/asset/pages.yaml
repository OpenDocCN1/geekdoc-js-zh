    This leaves the cookie vulnerable to certain types of attacks.

    **Validation** The authentication cookie''s contents will be validated to ensure
    that they haven''t been changed between the browser and the server.

    **None** Neither encryption nor validation are used. Not recommended. |

    | | timeout | Determines the amount of time, in minutes, until the authentication
    cookie expires. | Default is 30. You should set this value to the minimum amount
    that will allow users to use your site effectively. If you use persistent cookies
    with forms authentication, they will not time out. |'
