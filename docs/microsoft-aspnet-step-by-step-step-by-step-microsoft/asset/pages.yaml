  md: '# Afterword


    When I was first exposed to ASP+, which would become ASP.NET, I was immediately
    reminded of the ''80s song by a band called Timbuk 3. The refrain “The future’s
    is so bright, I gotta wear shades.” In the 18 months since then, I think the future
    of Web development, and ASP.NET’s place in it, has only grown brighter.


    In many ways, ASP.NET and the .NET Framework have opened new possibilities to
    developers who have existed solely in the world of Notepad and scripting languages.
    In some development circles, ASP developers have been treated as second-class
    citizens—no more. Whether you use a text editor or a rich IDE like Visual Studio
    .NET, the .NET Framework and ASP.NET offer you the power of fully compiled languages
    and object-oriented programming.


    As with any big step forward, there are costs associated with the move to this
    new platform. The learning curve for some of the technologies used in ASP.NET
    may be a little steeper than classic ASP; but the reward for this learning is
    greater power, greater productivity, and substantially better applications.


    I hope that this book helps developers get up to speed with this great new technology.
    I also hope that you, the reader, will help me by letting me whether I have met
    that goal. I welcome all reader feedback at feedback@aspnetsbs.com.


    G. Andrew Duthie'
