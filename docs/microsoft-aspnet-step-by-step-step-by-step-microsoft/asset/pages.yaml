  md: '# Adding Controls with Visual Studio .NET


    Of course, the easiest way to add ASP.NET server controls to a Web Forms (and
    to discover all the properties available for a control) is to Use the Visual Studio
    .NET Toolbox to add a control to the page. The Web Forms tab of the Toolbox is
    shown in the following figure.


    ![](img/50a47de1541381ea3363945ae9c22411_282_0.png)


    Follow these steps to add a server control to a Web Forms page in Visual Studio
    .NET:


    +   1. Open Visual Studio .NET and open the solution containing the page you want
    to edit.

    2. Open the page to which you wish to add a server control by double-clicking
    it in the Solution Explorer window.

    3. Make sure the page is displayed in Design mode by clicking the Design button
    that appears directly below the text/design editor pane.

    4. Open the Toolbox by moving the mouse pointer over the Toolbox tab in the IDE,
    and select the Web Forms tab of the Toolbox by clicking it.

    5. Double-click the desired server control. The control will be inserted into
    the page at the location of the cursor if the page is in FlowLayout mode, or at
    the top-left corner of the page if the page is in GridLayout mode. In GridLayout
    mode, you can also select a control from the Toolbox and draw it on the form as
    you would a Visual Basic–style control.

    6. Save the page.'
  merge: -1
