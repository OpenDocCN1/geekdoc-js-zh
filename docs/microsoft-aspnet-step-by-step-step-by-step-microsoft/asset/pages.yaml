    the Public, Private, Friend, or Protected keywords. | Public Sub MySub() End Sub
    |\| Modify the accessibility of a variable or procedure in C# | Use the public,
    private, internal, or protected keywords. | public void myProc() } |

    | Use structured exception handling in Visual Basic .NET | Create a Try...Catch...Finally
