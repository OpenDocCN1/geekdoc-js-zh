  md: '# Saving and Browsing Your Page


    Now that you''ve added your Server, go ahead and save the page by clicking the
    Save button on the toolbar. You can also save by selecting <filename> from the
    File menu.


    Because the Web Form you used automatically adds a code-behind module for your
    Web Form, you need to build your project before you can browse the page. (You''ll
    learn more about code-behind in later chapters.) Building is the process of compiling
    all of the code modules in the project so they''ll be available to the pages and
    modules that call them. To build the project, select Build from the Build menu.


    Once you''ve saved the Web Form page and built the application, you can view the
    page in an embedded browser window by right-clicking the page and selecting View
    in Browser. The result should look like the following figure.


    ![](img/50a47de1541381ea3363945ae9c22411_46_0.png)'
