  md: "# Chapter 9 Creating Web Forms\n\n# 229\n\nWhile this flexibility made it very\
    \ easy to create ASP pages, this flexibility made it very easy to create ASP pages,\
    \ it was also a major weakness of classic ASP because it allowed for some sloppy\
    \ coding. It was far too easy to write unmanageable spaghetti code, with some\
    \ code inline, some code in subroutines, etc. In addition, although code in render\
    \ blocks in classic ASP was executed in a linear fashion, arbitrary code (code\
    \ not contained in a subroutine) in a <script> block was not. This often resulted\
    \ in confusion, because sometimes this code was executed out of sequence with\
    \ what developers expected.\n\nASP.NET solves these problems by imposing limitations\
    \ on what types of code may be written, and with classic ASP, there are still\
    \ two ways to write code within a Web Forms page: <script> blocks and <% %> render\
    \ blocks.\n\n# Using <script> Code Declaration Blocks\n\nAs mentioned, in classic\
    \ ASP, you could write pretty any code you wanted (property and method definitions,\
    \ arbitrary code, etc.) in a <script> block using the runat=\"server\" attribute.\
    \ The problem was that you couldn't be sure which arbitrary code in the <script>\
    \ block would execute, relative to the code in the rest of the page. For this\
    \ reason, ASP.NET does not allow you to use arbitrary code within <script> blocks,\
    \ which are now referred to as code declaration blocks, to emphasize their purpose\
    \ of declaring properties and methods.\n\nSo if you want to call Response.Write\
    \ within a code declaration block, you need to wrap that within a method declaration.\
    \ The following code will work:\n\n```\n<script language=\"vb\" runat=\"server\"\
