    # Using Authorization


    After you''ve authenticated the user making the request, the next step is to authorize
    the request. Authorization means deciding whether to permit the user to access
    the requested resource.


    Authorization in ASP.NET takes two major forms: authorization against NTFS Access
    Control Lists (ACLs) and URL-based authorization.'
  merge: -1
  pgno: 218
- img_proc: true
  md: "# Using NTFS ACLs for Authorization\n\nACL-based authorization is useful when\
    \ you’re using Windows-based authentica-\nin ASP.NET. With ACL-based authorization,\
    \ you use tools such as the\nProperties dialog for a file or folder in Windows\
    \ Explorer to set the list of users or\ngroups that are allowed to access a given\
    \ resource, and what rights (read, write,\nexecute, etc) each one. The primary\
    \ advantage of using ACL-based authori-\nwith Windows-based authentication is\
    \ that it does not require any\nsecurity-specific code in ASP.NET application.\
    \ All security settings can be\ntaken care of administratively.\n\nWhen a request\
    \ for a resource (such as an ASP.NET page) comes in, IIS authent-\ncates the request,\
    \ whichever method (basic, digest, integrated Windows) has\nconfigured for the\
    \ application. IIS passes the identity of the logged-in user to\nASP.NET, which\
    \ then impersonates the identity of the user and checks the ACL\nfor the requested\
    \ resource to see if the user has required permission. If so,\nASP.NET fulfills\
    \ the request.\n\nTo take advantage of ACL-based authorization, you need to do\
    \ the following:\n\n+   1 Configure your ASP.NET application to use Windows authentication,\
    \ and to\nimpersonate the logged-in user, by adding the following sections to\
    \ the applica-\ns' Web.config\n2 Using Windows Explorer, right-click a file or\
    \ folder in your application’s physical\ndirectory that you want to restrict access\
    \ to, and select Properties.\n3 Click the Security tab and add remove users or\
    \ groups as defined. Not that\nyou should remove the Everyone group if it is present.\
    \ If you want ASP.NET to be\nable to access a resource when not impersonating,\
    \ the SYSTEM account should\be given access to the resource. When you’re finished\
    \ applying permissions, click\nOK to close the dialog.\n4 Browse the protected\
    \ resource. You should be prompted to log in your\nWindows username and password.\
    \ If you enter credentials for one of the\naccounts configured in step 3, you\
    \ should be able to access the resource.\n\n```\n<authentication mode=\"Windows\"\
    \ />\n<identity impersonate=\"True\" />\n```\n\n# Using URL-Based Authorization\n\
    \nURL-based authorization, which is new in ASP.NET, lets you grant or deny access\n\
    to resources in your application based on their URL (thus the name) using the\n\
    <authorization> tag. Unlike the <authorization> tag, which cannot be used in or\n\
    lied to a subdirectory of an application, the <authorization> tag can be\napplied\
    \ to subdirectories and even individual files, by creating Web.config"
  merge: -1
  pgno: 219
- img_proc: true
  md: "files in the subdirectories or by using the path attribute of the <location>\
    \ tag to specify the URL for the resource to be protected. URL-based authentication\
    \ also allows you to specify the HTTP method for which a particular rule applies.\n\
    \n# Authorizing Users and Roles\n\nThe most basic form of ASP.NET URL-based authorization\
    \ looks like this:\n\n```\n<configuration>\n  <system.web>\n    <authorization>\n\
    \      <allow users=\"Andrew\" />\n      <deny users=\"*\" />\n    </authorization>\n\
    \  </system.web>\n</configuration>\n```\n\nWhen the <authorization> section is\
    \ added to the Web.config for an application, it allows Andrew to access resources\
    \ in the application's root directory, and in any subdirectories that do not have\
    \ conflicting <authorization> permissions set, as well as denying access to all\
    \ other users. The users attribute of the <allow> and <deny> tags allows you to\
    \ specify comma-separated lists of users to be allowed or denied access to the\
    \ URL being protected. (Note that if no path is specified, ASP.NET will apply\
    \ the settings to the directory in which the Web.config contains the settings,\
    \ as well as its children.) ASP.NET provides the following two wildcards for allowing\
    \ and denying access:\n\n+   * This wildcard lets you allow or deny all users\n\
    ? This wildcard lets you allow or deny anonymous users\n\nYou can also specify\
    \ a comma-separated list of roles (equivalent to NT groups) to allow or deny by\
    \ adding the role attribute to an <allow> or <deny> tag:\n<allow roles=\"Administrators,\
    \ Users\">\n\nNote that authorization settings for child directories override\
    \ those of the parent, unless the parent is locked down using the optional allowOverride\
    \ attribute of the <location> tag. To prevent the preceding authentication settings\
    \ from being overriden, you would modify the Web.config file as follows:\n\n```\n\
    <configuration>\n  <location allowOverride=\"false\">\n    <system.web>\n    \
    \  <authorization>\n        <allow users=\"Andrew\" />\n      </authorization>\n\
    \    </system.web>\n  </location>\n</configuration>\n```\n\n![](img/50a47de1541381ea3363945ae9c22411_220_0.png)"
  merge: -1
  pgno: 220
- img_proc: true
  md: '```

    <deny users="*" />

    </authorization>

    </system.web>

    <location>

    </configuration>

    ```


    Note that the <location> tag also has a path attribute that allows you to specify
    the path to the settings contained between the <location> tags apply. This can
    be a convenient way to specify the authorization settings for multiple files or
    directories in an application from a single Web.config file, allowing the developer
    or administrator to decide which settings may or may not be overridden by child
    Web.config files. This is an especially useful feature in shared server or shared
    hosting situations. A server administrator can place master permissions in the
    Machine.config file for the server and use the <location> tag to prevent overriding
    of these permissions.


    # Allowing or Denying Specific HTTP Methods


    In addition to the users attribute, the <allow> and <deny> tags also expose a
    verbs attribute, which allows you to specify the HTTP verb type to allow or deny
    the specified user(s) or role(s). Following the preceding example, you could prevent
    all users from making POST requests, while still allowing them other access, modifying
    your Web.config file as follows:


    ```

    <configuration>

    <location allowOverride="false">

    <system.web>

    <authorization>

    <allow users="Andrew" />

    <deny verbs="POST" users="*" />

    </authorization>

    </system.web>

    </location>

    </configuration>

    ```


    Limiting the request types to those necessary for a page or pages in your application
    can be an important way to prevent hackers from compromising your site. If a hacker
    is unable to make a POST request, it is much more difficult for them to take advantage
    of a vulnerability that requires sending data in an HTTP request body. You can
    restrict HTTP verb access for a page or set of pages by adding the path attribute
    to the <location> tag, as described in the previous section.'
  merge: -1
  pgno: 221
- img_proc: true
  md: "# Using Impersonation\n\nImpersonation is the process by which ASP.NET takes\
    \ the security context of the user making the request. This allows ASP.NET (and\
    \ components called by ASP.NET) to gain access to resources that the user is authorized\
    \ to access.\n\nIn classic ASP, impersonation was used by default. If the user\
    \ making the request had not been authenticated by IIS using basic or NTLM authentication,\
    \ requests ran with the security context of the USR_MACHINENAME built-in account.\
    \ In ASP.NET, impersonation must be turned on explicitly by using the impersonation\
    \ attribute of the <identity> tag. Without impersonation, ASP.NET runs as the\
    \ built-in SYSTEM account. (Although you can use the <processModel> configuration\
    \ section to configure ASP.NET to run as a different account that has fewer privileges,\
    \ such as the MACHINE built-in.)\n\nFor example, you might want to take advantage\
    \ of impersonation to use trusted connections with SQL Server. Trusted connections\
    \ use Windows security to connect to a SQL Server database without the need for\
    \ a SQL Server username and password. As discussed earlier in this chapter, one\
    \ of the challenges facing ASP.NET developers is where to store database login\
    \ information to reduce the risk of being compromised. With trusted connections,\
    \ this is not a problem because the login information is never stored by the application.\n\
    \nTo make a trusted connection to SQL Server work, you must do the following:\n\
    \n+   1. Configure your application to use Windows authentication, as described\
    \ earlier in this chapter.\n2. Add the <identity> tag to your configuration file\
    \ to make ASP.NET impersonate the identity of the client making the request.\n\
    \   <identity impersonate=\"true\">\n3. Add the desired Windows accounts to the\
    \ SQL Server security database, specify\n4. In the connection string used to connect\
    \ to the database, specify Trusted_Connection=yes. The full connection string\
    \ would look something like the following:\n   `server=(local)\\NetSDK;database=pubs;Trusted_Connection=yes`\n\
    5. Using one of the accounts that you added to the SQL Server security database,\
    \ log in to the ASP.NET application. You should be able to access the data on\
    \ the SQL Server database.\n\n![](img/50a47de1541381ea3363945ae9c22411_222_0.png)"
  merge: -1
