    # Other Controls


    In addition to the HTML controls and Web controls that come with the .NET Framework,
    there are also some additional controls that are currently available as separate
    downloads. These are the ASP.NET Mobile controls and the Internet Web controls.


    # ASP.NET Mobile Controls


    The ASP.NET Mobile controls are currently available as the .NET Mobile Internet
    Toolkit. These controls are designed to tailor their output to handheld devices,
    such as cell phones, PocketPCs, and other mobile devices. The Mobile Internet
    Toolkit is currently available at http://download.microsoft.com/download/VisualStudioNET/Install/1/NT4XP/EN-US/MobileT.exe.
    More information about the Mobile Web Toolkit can be found at http://msdn.microsoft.com/studio/nextitenchnology/mobilewebforms.asp.
    At the time of this writing, it''s unclear whether these controls will ship with
    the .NET Framework in the future or continue to be a separate download.


    # Internet Explorer Web Controls


    The Internet Explorer Web controls are a set of ASP.NET server controls that take
    advantage of advanced features of Internet Explorer 5.5 or later, while providing
    cross-browser compatibility by rendering HTML 3.2 output for down-level browsers.
    The controls include the following:


    +   - MultiPage Used with the TabStrip to provide sophisticated tabbed interfaces
    in ASP.NET.


    +   - TabStrip Provides a tabbed interface for navigation.


    +   - Toolbar Provides toolbar functionality for ASP.NET Web Forms pages.


    +   - TreeView Provides the ability to display and navigate hierarchical structures
    or data. It can be used for site navigation, or to provide a Web-based Explorer-style
    interface.


    The Internet Explorer Web controls can be downloaded from http://msdn.microsoft.com/downloads/samples/internet/ASP_DOT_NET_ServerControls/WebControls/default.asp.


    You can read more about the Internet Explorer Web controls and use them at http://msdn.microsoft.com/workshop/webcontrols/overview/overview.asp.


