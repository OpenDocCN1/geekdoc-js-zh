  md: '# Inheriting from WebService


    In this syntax example, there is an Imports statement importing the System.Web.
    namespace. This namespace contains the classes and attributes that provide ASP.NET''s
    built-in support for XML-based Web services. In this case, the class we care about
    is WebService, which is inherited in this example using the Inherits keyword.


    Inheriting from the WebService class is not required in order for a class to function
    as a Web service, but the WebService class provides useful plumbing for Web services.
    This includes access to Application, Session, and other ASP.NET objects, including
    the Context object, which provides access to information about the HTTP request
    that invokes the WebService.


    # Using the <WebService()> Attribute to Specify XML Namespace


    XML uniquely identify the endpoint or listener to which a client sends requests.
    By default, ASP.NET sets the XML namespace for a Web service to http://tempuri.org/.
    If you plan to make your Web service available publicly over the Internet, change
    the default namespace to avoid potential conflicts with other XML-based Web services
    using the same name as your Web service, and which also may use the default namespace.


    You can modify the default namespace for a Web service class by adding the WebService
    metadata attribute to the class definition and setting its Namespace property
    to the desired value for the new namespace. This value can be your unique URI
    that you control, such as your organization''s domain name.


    In Visual Basic .NET, metadata attributes use the syntax <AttributeName(PropertyName=value)>
    and are placed on the same line as the class (class, method, etc.) they modify.
    For readability''s sake, you can use the Visual Basic line-continuation character
    to wrap the class definition on the following:


    ```

    <WebService(Namespace="http://www.aspnetbs.com/webservices/")> _ Public Class
    ClassName

    ```


    In C#, metadata attributes use the syntax [AttributeName(PropertyName=value)]
    and are placed on the line before they modify.


    ```

    [WebService(Namespace="http://www.aspnetbs.com/webservices/")] public class ClassName:
    WebService (

    ```


    In both Visual Basic .NET and C#, multiple properties may be set in an attribute
    declaration and are separated by commas.'
