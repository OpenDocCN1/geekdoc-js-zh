  md: '# Understanding the Structure of ASP.NET Applications


    Although you learned the structure of ASP.NET Web applications in Chapter S, it
    is worthwhile to review this information. Understanding the structure of ASP.NET
    application will make the deployment process smoother, and can help prevent unexpected
    errors and problems in your deployed applications.


    Each ASP.NET application needs to have a corresponding IIS application root to
    function properly. The application root provides the boundary for the application.
    The physical file system directory that maps to the application root is the location
    where the Web.config file for the application, as well as the application''s bin
    directory (which contains all managed assemblies related to the application) and
    the Global.asax file (if you choose to use one), are deployed. If the IIS directory
    that is the root of the application is not configured as an application root,
    certain configuration settings may fail, and the assemblies in the bin directory
    (if present) will not be loaded.


    To determine if a directory in IIS has been configured as an application, the
    following steps:


    +   Open the Internet Services Manager by clicking Start, Programs, Administrative
    Tools, Internet Services Manager.


    +   Navigate to the directory whose configuration you want to check by expanding
    the Web site containing it and expanding other nodes as necessary. If the directory
    is configured as an application root, it will show an icon of a black globe in
    a gray box. If the directory is not configured as an application, it will show
    either a folder icon (for content that resides directly within the path of the
    application root) or a folder icon with a small globe (for content that resides
    elsewhere in the file system). The following figure shows examples of these icons.


    ![](img/50a47de1541381ea3363945ae9c22411_465_0.png)'
  merge: -1
  pgno: 465
- img_proc: true
  md: 'If the directory is not configured as an application, you can create an application
    root at this level. Right-click the directory, select Properties, and then click
    the Create button on the Directory tab (or Virtual Directory tab) of the Properties
    dialog. The Properties dialog for Chapter15 directory is shown here.


    ![](img/50a47de1541381ea3363945ae9c22411_466_0.png)


    Click OK to update the directory with the new setting. The directory should now
    show the icon for an application root, as shown here.


    ![](img/50a47de1541381ea3363945ae9c22411_466_1.png)


    As you can see in these figures, IIS application roots can be nested one beneath
    the other. However, each application root defines its own application boundary.
    One advantage of this is that it allows you to partition your application as necessary.
    For example, you can provide customized configuration settings or use different
    versions of a private assembly with different parts of your application. The most
    important thing to remember, however, is that the application root is where the
    bin directory and Global.asax and Web.config files should be located.'
  merge: -1
