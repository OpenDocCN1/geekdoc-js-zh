  md: '# Chapter 4 Understanding Programming Basics


    this important? Because it means development teams can make better use of the
    existing skill sets of their developers, as well as the company''s existing code
    base. For example, a company with experienced Visual Basic developers (and existing
    code in Visual Basic) can have those developers continue to write in Visual Basic
