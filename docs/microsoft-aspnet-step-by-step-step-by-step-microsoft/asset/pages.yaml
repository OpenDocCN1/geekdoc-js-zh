    \nThe following code will cause an error:\n\n```\n<script language=\"vb\" runat=\"\
    server\">\n  Response.Write(\"Hello, World!\")\n</script>\n```\n\nLikewise, you\
    \ can declare a local member variable in a declaration block, but you may not\
    \ assign it to the outside of a defined method. The following code will work:\n\
    \n```\n<script language=\"vb\" runat=\"server\">\nDim Name As String\nSub SetName\n\
