    | ClientTarget | Any valid UserAgent string. Available values are set in the <clientTarget>
    section of Machine.config or Web.config. | Determines the browser for which server
    controls should render output. The User Agent string should be recognized by the
    server controls being used. |

    | Codebind | File name of codebind class. | This attribute is used in Visual Studio
    .NET to locate code-bind classes to be compiled during a build operation. It is
    not used by the ASP.NET runtime. |

    | CodePage | Any valid code page value. | Same as classic ASP. |

    | CompilerOptions | String containing valid compiler options. | Allows developers
    to pass compiler options for the page to the compiler. For Visual Basic .NET and
    C#, this can be any valid sequence of command-line switches for the compiler.
    |'
