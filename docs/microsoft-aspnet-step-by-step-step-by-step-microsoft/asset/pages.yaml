    The keys to the functionality of the registration wizard are the three Panel controls
    and the Next_Click and Previous_Click event handlers. The Panel controls contain
    Label, TextBox, and Button Web controls (as well as HtmlInput-Button control for
    resetting the form fields), which are formatted using standard HTML table elements.
    When the user clicks the Next or the Previous button (depending on which one is
    enabled for the process), the event handlers hide the currently visible panel,
    show the next (or previous) panel, and update the Label controls that tell the
    user which step in the process they are on.


    Since ASP.NET takes care of maintaining the state of the controls from request
    to request, it is simple to display the data entered by the TextBox on the third
    panel by simply accessing the Text property of the TextBox controls on the other
    panels. Notice that the caption text of the controls on the third panel is set
    declaratively in the tag, and then the text that user entered is appended to this
    text grammatically in the event handler using the &amp; operator. The first page
    of the registration wizard is shown in the following figure.


    ![](img/50a47de1541381ea3363945ae9c22411_300_0.png)


    # Specialty Controls


    In addition to the standard suite of Web controls that provide functionality like
    that of the Visual Basic GUI controls, ASP.NET also offers a set of richer specialty
    controls that reside in the System.Web.Ui, Xml namespace. Currently, these include
    the AdRotator, Calendar, and Xml controls. This section will describe the purposes
    of these controls and show some examples.'
