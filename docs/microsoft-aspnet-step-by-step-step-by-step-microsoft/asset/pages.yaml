  md: "# Caching Web Forms Pages\n\nTo cache output for a Web Forms page, follow these\
    \ steps:\n\n+   Create a new file in a directory that is set up as an application\
    \ in IIS. Name the file OutputCache.aspx.\n\n+   Add appropriate HTML tags and\
    \ @ Page directive to the page.\n\n```\n<%@ Page Language=\"V8\" %>\n<html>\n\
    <head>\n</head>\n<body>\n</body>\n</html>\n```\n\n+   Add an ASP.NET Label control\
    \ and a static text description to the `<body>` section of the page.\n\n```\n\
    <body>\n<asp:Label id=\"Label1\" runat=\"server\"/>\n<p>The text above was rendered\
    \ with an ASP.NET Label Server Control, then the output was cached for 10 seconds.</p>\n\
    </body>\n```\n\n+   Add a `<script>` block to the `<head>` section of the document\
    \ containing a `Page_Load` event handler. In the event handler, set the `Text`\
    \ property of the `Label` control to control the current time/date (using Visual\
    \ Basic Now property).\n\n```\n<head>\n<script runat=\"server\">\nSub Page_Load()\n\
    \    Label1.Text = Now()\nEnd Sub\n</script>\n</head>\n```\n\n+   Save and browse\
    \ the page. The time displayed as the text of the `Label` control should change\
    \ with each request.\n\n+   Add an @ OutputCache directive to the page, with the\
    \ `Duration` attribute set to 10 and the `VaryByParam` attribute set to `None`.\
    \ This directive should appear on the line directly below the @ Page directive.\n\
    \n```\n<%@ OutputCache Duration=\"10\" VaryByParam=\"None\" %>\n```"
