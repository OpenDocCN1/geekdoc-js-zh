  md: '# Accessing and Binding Data


    +   In this chapter, you will learn

    * Namespaces and classes that make up ADO.NET

    * ASP.NET data-bound controls

    * Data-binding against properties, arrays, or ADO.NET


    In the previous two chapters, you learned about creating Web Forms and taking
    advantage of ASP.NET server controls in your Web Forms applications. With that
    overview of these two important technologies under your belt, let''s look at data
    access. The ability to store and access data is central to most Web applications,
    and this is an area that classic ASP made very simple for developers to work with
    the ActiveX Data Objects (ADO) COM components. The .NET platform provides a set
    of classes called ADO.NET that is the logical successor to ADO, although the underlying
    object model has undergone significant changes. ASP.NET, meanwhile, exposes a
    set of data-bound controls (which were touched upon briefly in Chapter 10) that
    integrate seamlessly with ADO.NET to provide data-binding services.


    # important


    ADO.NET is a large enough topic to merit a book of its own, so at best this chapter
    will provide an overview. You''re strongly encouraged to use the available resources,
    such as the ASP.NET and HowTo QuickStart tutorials (installed with the .NET Framework
    SDK samples), which have numerous ADO.NET examples. Other resources include the
    .NET Framework SDK and Visual Studio .NET documentation, and of course other books,
    such as the forthcoming Microsoft Press title Building Web Solutions with ASP.NET
    and ADO.NET by Dino Esposito, a noted expert on ADO and ADO.NET.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Understanding ADO.NET


    In classic ASP, the most common way to access data was through ADO. Developers
    used ADO Connection objects to connect to a database, and then used ADO Command
    and Recordset objects to retrieve, manipulate, and update data. When designing
    applications, particularly those with high scalability requirements or those back-end
    datasource might change at some point, developers need to be careful not to tie
    them in their front-presentation code with their back-end database. Otherwise,
    they''d end up rewriting everything if there was a change in the back-end database.


    The ADO.NET architecture is factored somewhat differently from classic ADO. ADO.NET
    classes are separated into two major categories: datasource-specific and non-datasource-specific.


    # Understanding .NET Data Providers


    Classes that are specific to a particular datasource are said to work with a specific
    .NET Data Provider. A .NET Data Provider is a set of classes that allow managed
    code to interact with a specific datasource to retrieve, update, and manipulate
    data. ADO.NET connects with two .NET Data Providers: the SQL Server .NET Data
    Provider, the OLE DB .NET Data Provider, which provides optimized access to SQL
    Server databases, and lets you connect to any datasource for which you have an
    OLE DB .NET Provider installed.


    > important

    The OLE DB .NET Data Provider does not support the OLE DB 2.5 interfaces. This
    means that the Microsoft OLE DB Provider for Exchange and the Microsoft OLE DB
    Provider for Internet Publishing cannot be used with the OLE DB .NET Data Provider.
    Additionally, the OLE DB Provider for ODBC is incompatible with the OLE DB Provider.
    At the time of this writing, Microsoft is providing a downloadable .NET Data Provider
    for ODBC at http://msdn.microsoft.com/downloads/sample.asp?url=msdn-files/027/001/668/msdncompositedoc.xml.
    It is unclear whether this provider will be a part of the released product.


    The following figure shows the major classes of the SQL Server .NET Provider and
    how they relate to one another.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Chapter 11 Accessing and Binding 299


    | SqlConnection | SqlDataAdapter |

    |---|---|

    | SqlCommand | DeleteCommand |

    | SqlParameterCollection | InsertCommand |

    | SqlDataReader | SelectCommand |

    | | UpdateCommand |

    Database


    The `SqlConnection` class is used to establish a connection to a SQL data-base.
    Unlike the ADO Connection object, the `SqlConnection` class (or its OLE DB equivalent,
    the `OleDbConnection` class) cannot be used to execute SQL statements against
    a datasource. The `SqlConnection` class is used solely for opening connections,
    setting or retrieving properties of a connection, or handling connection-related
    events. You will learn how to use the `SqlConnection` class to connect to a database
    later in this chapter.


    The `SqlCommand` class is used to execute SQL statements or stored procedures
    against a SQL Server database. The `SqlCommand` class (and its OLE DB equivalent,
    the `OleDbCommand` class) can execute statements or stored procedures that do
    not return values, return single values, XML, or datareaders.


    The `SqlDataReader` class provides forward-only, read-only access to a set of
    rows returned from a SQL Server database. Datareaders (including both the `SqlDataReader`
    and `OleDbDataReader`) provide lightweight, high-performance access to read-only
    data and are the best choice for accessing data to be displayed in ASP.NET.


    The `SqlDataAdapter` class is used as a bridge between the `DataSet` class and
    SQL Server. It is used to create a dataset from a given SQL statement or stored
    procedure represented by a `SqlCommand` instance, update the back-end SQL Server
    database based on the contents of a dataset, or insert rows into or delete rows
    from a SQL Server database. The `OleDbAdapter` class performs the same tasks for
    OLE DB databases.'
