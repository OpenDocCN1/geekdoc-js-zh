  md: '# ASP.NET Step by Step


    For examples of the use of the @ Register directive, please see “Creating and
    Using User Controls” on “Using Server Controls” on page 236.


    # @ Assembly


    The @ Assembly directive is used to link an assembly into a page at compilation
    time. This allows developers to use all of the controls, methods, and so forth
    exposed by the assembly as if they were part of the page. The @ Assembly directive''s
    attributes are listed in the following table. Only one of the Name and Src attributes
    of the @ Assembly directive may be used at a time.


    | Attribute | Value | Purpose |

    | --- | --- | --- |

    | Name | Any valid assembly name. | Specifies the name of a compiled assembly
    to be linked to when the page is compiled. |

    | Src | Any valid path to a class source file (.vb, .cs, etc.). | Specifies the
    path to a source file to be dynamically compiled and linked to the current page.


    Note that it is not necessary to use the @ Assembly directive to link in assemblies
    residing in the bin subdirectory of your application. These assemblies are automatically
    linked by default, based on the <assemblies> subsection of the <compilation> section
    of the Machine.config configuration file, which contains the following tag:


    ```

    <add assembly="*">

    ```


    This specifies that ASP.NET should link in all assemblies in the bin subdirectory.
    Note also that any other assemblies specified by an <add> tag in the <assemblies>
    subsection do not require linking with the @ Assembly directive.


    # @ OutputCache


    The @ OutputCache directive is used to specify that the rendered output of the
    page or user control in it appears should be cached, and it specifies the attributes
    that determine the duration of caching, the location of the cached output, and
    the attributes that determine when a client will receive freshly rendered rather
    than the cached content. Output caching in user controls can be especially useful
    when the content of a page is relatively static, but other content is frequently
    updated, making it a poor candidate for caching. In a case like this, you could
    move the static content into a user control and use the @ OutputCache directive
    to cache its content, while leaving the rest of the page to be dynamically generated
    with each request.


    The @ OutputCache directive''s attributes are listed in the following table.'
