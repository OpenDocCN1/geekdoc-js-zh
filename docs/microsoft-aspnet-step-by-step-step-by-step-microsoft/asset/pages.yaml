    This example contains a directive, HTML markup, a <script> code declaration block,
    a server-side form, and several server controls. The following sections describe
    all of these elements, as well as other elements that may be used in a Web Form
    page.


    # Understanding Page Elements


    HelloSimple.aspx (the preceding listing) shows examples of many of the elements
    that may be used in an ASP.NET Web Form. The elements used in HelloSimple.aspx
    include server-side controls, the @ Page directive, static HTML, a server-side
    <script> code-declaration block containing both event handlers and methods, and
    several ASP.NET server controls. The following table describes the elements that
    may be used in an ASP.NET page.


    | ASP.NET Page Elements |

    | Element | Description |

    | Static HTML tags | These standard HTML elements are treated by ASP.NET as literal
    controls, and are rendered to the client browser as represented in the source
    file. |

    | HTML comments | Syntax: <!-- -->, HTML comments allow descriptive text to be
    added to a page. This text is sent to the client but not rendered by the browser.
    |

    | Directives | Directives, such as the @ Page directive, provide the ASP.NET runtime
    with information about how to process the page. Using directives, you can control
    such ASPNET features as session state, wiring up of events, and output caching,
    as well as importing namespaces and registering custom controls for use within
    a page. (continued) |'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# ASP.NET Page Elements (continued)


    | Element | Description |

    | --- | --- |

    | Server-side code | Code can be contained in either server-side <script> code
    blocks or <% %> render blocks. See "Writing Code in Web Forms" on page 228 for
    information using code declaration and render blocks.


    ASP.NET supports server-side code in any language that targets the runtime. |

    | Event handlers | Event handlers are procedures used to contain <script> code
    blocks that handle page or server control events, as Page_Load or control Click
    events. Most ASP.NET code should be written in or called from event handlers,
    rather than being in render blocks. |

    | <script> code declaration blocks | These blocks are used to contain page-level
    procedures and declare variables that are global to the page. Executable code,
    other than global variable declarations in code declaration blocks, must be contained
    within a procedure declaration. Server-side code declaration blocks must have
    the run="server" attribute, as shown in HelloSimple.aspx. |

    | %> render blocks | These blocks are used to contain executable code not contained
    within procedures. Overuse of render blocks can result in code that is difficult
    to read and maintain. |

    | Client-side <script> blocks | These blocks are used to contain script code to
    be executed on the client, usually in response to a client-side event. Choice
    of language (set by the language attribute) is dictated by the languages supported
    by the target browser. JavaScript is the most common choice for cross-browser
    compatibility in client scripts. |

    | Server-side comments | Syntax:<%-- --. Server-side comments allow descriptive
    text to be added to a page. Unlike HTML controls, this text is not sent to the
    client. |

    | User controls | These are custom controls that are defined declaratively in
    files with the .ascx extension. They provide a simple and straightforward mechanism
    for reuse of UI and UI-related code, and can contain most of the same elements
    as Web Forms pages. |'
