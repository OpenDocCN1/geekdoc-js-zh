  md: '9 Save both files, and browse ServerControls_cb.aspx. The output should be
    the same as in the previous figure.


    In this example, you''ve separated the event handling code into a code-behind
    class file. To make this work, you''ve had to take some extra steps. You added
    the Imports statements to the code-behind file to allow you to use the names of
    classes such as Label and Textbox without explicitly adding the namespaces using
    the @ Import directive described earlier in this chapter. One difference is that
    unlike Web Forms pages, code-behind files must explicitly import any of the namespaces
    for classes to be used in the file (unless all class references use the fully
    qualified name for the class).


    You also added the Class statement, to define the class ServerControls, and the
    Inherits statement, which specifies that you want the ServerControls class to
    be derived from the Page class. Then you declared two Public variables, for each
    server control that you want to access in your event-handler variables. Finally,
    you wrapped up the code-behind with an End Class statement to close the class.


    In the Web Form, you associated ServerControls_cb.vb by adding the Src attributes
    to the @ Page directive. The Src attribute tells ASP.NET where to locate the class
    file for the code-behind, and the Inherits attribute tells ASP.NET which class
    (or namespace and class) you want to inherit from in the code-behind file.


    While there are a few more steps involved in creating a page that uses code-behind
    compared to writing all of your code in a Web Form, the resulting code is generally
    much easier to maintain and update. For complicated pages, this alone can make
    it well worthwhile to use code-behind.'
