  md: 'Once''ve set up the ASPNET account as described above, you should be able to
    access the desired database using a trusted connection, as shown in the connection
    strings used in the samples later in this chapter.


    # Reading and Updating Data with Commands


    The Command classes, SqlCommand and OleDbCommand, are the ADO.NET equivalents
    of the ADO Command object. These classes can be used to retrieve read-only data
    through a datader (you''ll see examples of this later in this chapter), execute
    Insert, Update, Delete, and other statements that don''t return records, retrieve
    aggregate results, SqlCommand and OleDbCommands can also be used in conjunction
    with a related datareader to populate a dataset with, or to update a back-end
    database with updated data from a dataset. The SqlCommand and the OleDbCommand
    classes can work with either SQL statements or stored procedures (for-sources
    that support them).


    # SqlCommand


    The SqlCommand is the appropriate class when you want to run commands against
    a SQL Server. Here are the steps to follow when using a SqlCommand object. Each
    step outlines one or more ways to initialize or use the SqlCommand class.


    +   Create the SqlCommand object. Note that the constructor of the SqlCommand
    is overloaded, so you can save steps by passing arguments (such as the query for
    the Command and/or the SqlConnection object to use for the command) to its constructor,
    rather than setting the properties after the object is created.


    ```

    Default constructor

    Dim SqlCommand As New SqlCommand()

    ```


    ```

    Passing in a query

    Dim SqlString = "SELECT au_id FROM authors"

    Dim SqlCommand2 as New SqlCommand(SqlString)

    ```


    ```

    Passing in a query and a connection

    Dim SqlConnection As New _

    SqlConnection("datasource=localhost\pubs;integratedsecurity=true")

    Dim SqlString As String = "SELECT au_id FROM authors"

    Dim SqlCommand3 as New SqlCommand(SqlString, SqlConnection)

    ```'
