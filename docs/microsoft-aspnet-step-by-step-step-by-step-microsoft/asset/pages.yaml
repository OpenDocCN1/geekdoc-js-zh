    # # Using Datasets


    Datasets are one of the two main ways of working with data in ADO.NET (The other
    one is datasets, you''ve been using and will learn about more detail later in
    this chapter.) Datasets provide a database-independent in-memory representation
    of data. This data can be used for display or to update a back-end database through
    the appropriate DataAdapter. A dataset can also read data from and write data
    to an XML file or a Stream object.


    Datasets can be constructed and manipulated programmatically by adding, deleting
    DataTables, DataColumns, and DataRows in the dataset. You can also use datasets
    to update a back-end database (assuming that the schema of the tables you''ve
    constructed is compatible) by using the Update method of the dataset.


    You can work with typed datasets to make your code easier to read and your ADO.NET
    code less error-prone. Also, you can use a DataView filter the contents of a dataset
    for display (such as for data-binding) or calculations.


    # # Using DataAdapters


    DataAdapters allow you to get data from a back-end database into a dataset, and
    to update a back-end database from a dataset. There are two DataAdapters that
    are installed with the .NET Framework, the SqlDataAdapter and the OleDbDataAdapter.
    Each of these DataAdapters uses the appropriate Connection class and Command classes
    to either retrieve or update data.


    The Fill method of the SqlDataAdapter and OleDbAdapter can be used to populate
    a dataset with results from a back-end database, using the Command object specified
    by the SelectCommand property of DataAdapter. The following code creates and opens
    a connection to the database specified by the ConnStr property. Then it creates
    a new SqlDataAdapter and sets its SelectCommand property to a newly created SqlCommand
    object that uses the query specified by the SQL argument. Finally the code creates
    a new dataset, populates it using the Fill method of the SqlAdapter, and closes
    the connection.'
