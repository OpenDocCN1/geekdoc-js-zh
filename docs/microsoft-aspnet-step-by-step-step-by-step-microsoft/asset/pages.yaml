  md: '# important


    You may have noticed in the discussion of the classes that make up the SQL .NET
    Data Provider, the names of the classes start with Sql rather than SQL. This is
    because the names of the classes in the .NET Framework Pascal casing (after the
    style of the Pascal language), in which the first character of each distinct word
    in a given class is capitalized.


    This is important because class and namespace names are case sensitive in a language
    as C#. Using the incorrect case name (for example, SQL Connection instead of Sql/Connection)
    will result in a compiler error. So if you get an error complaining that the type
    isn''t defined or the namespace doesn''t exist, there''s a pretty good chance
    that you''re dealing with a capitalization problem.


    # Understanding Datasets


    The main class specific to a datasource is the DataSet. This is essentially an
    in-memory representation of one or more tables of data. This data may be read
    from an XML file or stream, or may be the result of a query against a datasource.


    One important thing about the DataSet class is that it doesn''t know anything
    about the datasource from which it receives its data, other than what that data
    is and sometimes the types of the data columns. (See the section on typed datasets
    later in this chapter.) The following figure shows the major classes associated
    with the DataSet class and how they relate to one another. Note that the Rows,
    Columns, and Constraints objects are properties of the DataTable class.


    ![](img/50a47de1541381ea3363945ae9c22411_319_0.png)'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'The fact that a dataset knows nothing about the source of its data means it''s
    abstracted from the back-end datasource. This is important because means that
    if you pass a dataset to a component used for data retrieval to your Web Forms
    page neither cares where the data comes from, as long as the dataset structure
    remains the same. The back-end database can be changed without necessitating any
    changes in the Web Forms page. This makes it much easier to maintain a Web application.


    Datasets contain a collection of tables, each of which contains a collection of
    rows, a collection of columns, and a collection of constraints. You can use these
    collections to get information on the objects contained within them, as well as
    to access and update individual data values. The dataset can also contain a collection
    of relationships between the tables it contains, allowing hierarchical data to
    be represented. You''ll learn the DataSet class and related classes in detail
    later in this chapter.


    # XML in ADO.NET


    Unlike classic ADO, in which XML support was added after the initial object model
    had been created, XML support has been designed into the ADO.NET model from the
    ground up. Classes such as SqlCommand, OleDbCommand, and DataSet have built-in
    support for reading and writing XML data. Datasets in particular can be built
    from or saved as XML, making them ideal for transporting data between tiers in
    a multi-tier application, or for temporarily storing data to disk for later retrieval.


    # Creating and Opening Connections


    The first step in accessing data from a database is, of course, creating the connection.
    ADO.NET provides two classes for creating connections to a database: SqlConnection
    and OleDbConnection. Which one you use depends on the type of database you will
    be connecting to and the needs of your application.


    # SqlConnection


    For applications that use SQL Server as the back-end database and are unlikely
    to change to a different database in the future, the SqlConnection class is the
    appropriate choice. This class is optimized for the best performance when connecting
    to a SQL Server database. The SqlConnection class will also provide superior'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'performance when accessing data in an MSDE database, since MSDE uses the same
    database engine and protocols to SQL Server.


    Creating a SqlConnection class is simple and can be done in one line of code.


    Dim MySqlConn as New SqlConnection(ConnectionString)


    This creates a connection mySqlConnectionConn to the SQL Server specified by the
    ConnectionString passed to the constructor of the SqlConnection class. Opening
    the connection is as simple as calling the following:


    mySqlConn.Open


    Closing the connection is just as easy.


    mySqlConn.Close


    > important

    As classic ADO, it is very important that you close any connection you open when
    you are finished with it. Connections are not closed automatically when you go
    out of scope. Open connections are not returned to the connection pool, where
    they would be available to other clients. This can prevent your application from
    effectively handling larger numbers of users without unacceptable-performance
    degradation.


    In addition to setting the connection string by passing it to the constructor
    of the SqlConnection instance, you can also create the SqlConnection instance
    with no constructor argument and set the connection string later through the ConnectionString
    property.


    The connection string for SqlConnection consists of key/value pairs separated
    by semicolons. Values may be delimited by either single or double quotes, but
    both may not be used for the same value (for example, key=''value''s''). All spaces,
    except those appearing in quotes, are ignored.


    > important

    When you''re creating connection strings dynamically based on user input, make
    to validate user input so that additional keys are not unintentionally added to
    the connection string by the user. For example, a user could add the database
    key to his password in an attempt to connect to a different database. Since the
    last key with the same name will be used to set the value for a connection string,
    failure to validate input may result in inappropriate access.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Chapter 11 Accessing and Binding Data 303


    The following table lists the valid keys for a SqlConnection connection string.


    | Key | Description |

    | --- | --- |

    | Application Name | The name of the application from which the connection is
    being made. |

    | AttachDBFileName | The file name and full path to the primary file of an attachable
    data-base. This key requires the Database key to specify the database name. |

    | Connect Timeout | The number of seconds before an attempted connection is aborted
    or an error is raised. The default is 15. |

    | Connection Lifetime | The time, in seconds, that a pooled connection should
    remain alive. When a connection is returned to the connection pool, it is destroyed
    if the current time is more than this many seconds past its creation time. The
    default is 0, meaning that the connection will not destroyed. |

    | Connection Reset | A Boolean value that determines whether the connection state
    is reset when a connection is retrieved from the pool. If set to false, the connection
    state will not be reset, which saves a trip to the server. But the programmer
    must then manually take steps necessary to ensure that the connection state is
    appropriate for the application''s use. The default is true. |

    | Current Language | The SQL Server language name. |

    | Data Source or Server or Address or Addr or Network Address | The server name
    or network address of the SQL Server instance to connect to. |

    | Enlist | Determines whether the connection is automatically enlisted in the
    creator’s transaction context. The default is true. |

    | Initial Catalog or Database | The name of the database to connect to. |


    (continued)'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# SqlConnection Connection String Keys (continued)


    | Key | Description |

    |---|---|

    | Integrated Security or Trusted Connection | Determines whether the connection
    uses the Windows authentication credentials of the caller to authenticate against
    SQL Server. Setting this to true alleviates the need for authenticating user ID
    and password, which means you don''t need to worry about storing these values.
    The default is false. |

    | Max Pool Size | Determines the maximum number of connections to be pooled. The
    default is 100. |

    | Min Pool Size | Determines the minimum number of connections that should be
    in the pool. The network library to use when connecting to the specified SQL Server.
    The default is dbmssocn, which specifies the TCP/IP sockets library. Other valid
    values are dbmnmpntw, dbmsrpcn, dbmsadsn, dbmsgnet, dbbsipcn, dbmsspxn, VIA, IPX/SPX.
    The server must have the appropriate DLL for the specified network library. |

    | Packet Size | Specifies the number of bytes per network packet to use in communicating
    with SQL Server. The default is 8192. |

    | Password or Pwd | Specifies the password to use to log into the SQL Server database.
    |

    | Persist Security Info | If set to false, this key prevents sensitive information,
    such as passwords, from being returned as a part of the connection if the connection
    is open. The default is false. |

    | Pooling | Determines whether pooling is enabled for this connection. When true,
    a requested connection will be pulled from the appropriate pool. If no connections
    are available from the pool, the requested connection is created and then returned
    to the pool when closed. The default is true. |

    | User ID | The name of the SQL Server user account with which to log into the
    server. |

    | Workstation ID | The name of the machine connecting to SQL Server. The default
    is the local machine name. |'
  merge: -1
