- img_proc: true
  md: "# important\n\nUsing ViewState has both performance and security implications,\
    \ because all of the information stored in ViewState is round-tripped to the client\
    \ as a base64 encoding string. The size of the ViewState hidden field can become\
    \ quite large with controls that contain a lot of data, which can have a negative\
    \ impact on performance. You may want to disable ViewState for these controls\
    \ by setting their EnableViewState property to False.\n\nBecause the ViewState\
    \ field is sent as text, you should never use ViewState to store information such\
    \ as connection servers, file paths, credit card information, or other sensitive\
    \ data. Remember that once the ViewState has been sent to the client, it would\
    \ be fairly simple for a hacker to decode the string and retrieve any data contained\
    \ within. Don't count on base64 encoding to protect sensitive data sent to the\
    \ client.\n\nFinally, the State of controls is saved before the firing of the\
    \ PreRender and Render events, so any changes to control state that you want to\
    \ save in ViewState must be made during the PreRender event. Changes to control\
    \ state after the PreRender event will not be saved to ViewState.\n\nFor the previous\
    \ example, you would make the following modifications to the UserName and Password\
    \ property procedures (in addition to eliminating the _UserName and _Password\
    \ local variables):\n\n```\nPublic Property UserName String\nGet\n    Return CType(ViewState(\"\
    UserName\"), String)\nSet\n    Set(ByVal Value As String)\n    ViewState(\"UserName\"\
    ) = Value\n    End Set\nEnd Property\nPublic Property Password String\nGet\n \
    \   Return CType(ViewState(\"Password\"), String)\nSet\n    Set(ByVal Value As\
    \ String)\n    ViewState(\"Password\") = Value\n    End Set\nEnd Property\n```"
  merge: -1
  pgno: 401
- img_proc: true
  md: "# Creating Custom Controls Through Composition\n\nBoth of the previous examples\
    \ in this chapter override the Render method of the Control class to render their\
    \ custom output. This method works fine, but it's not easy to take advantage of\
    \ preexisting controls unless you inherit from them and call the Render method\
    \ of the base class. (See “Extending Existing Controls” on page 390 for more information\
    \ on this technique.)\n\nCompositional controls use another technique to compose\
    \ a custom control out of a number of preexisting or custom controls. These controls\
    \ override the CreateChildControls method exposed by the Control class, and in\
    \ method, they programmatically instantiate and set properties of the constituent\
    \ controls that make up the custom server control. Compositional controls should\
    \ also implement the INamingContainer interface, which provides a new naming scope\
    \ for the constituent controls, to ensure that their names are unique within the\
    \ page.\n\n# Overriding CreateChildControls\n\nThe CreateChildControls method\
    \ is substituted for the Render method in compositional controls. A sample CreateChildControls\
    \ method is as follows:\n\n```\nProtected Overrides Sub CreateChildControls()\n\
    \    Dim MyLabel As New Label()\n    MyLabel.Text = \"Label: \"\n    Me.Controls.Add(MyLabel)\n\
    \    Dim MyText As New TextBox()\n    Me.Controls.Add(MyText)\n    Dim MyButton\
    \ As New Button()\n    Me.Controls.Add(MyButton)\nEnd Sub\n```\n\nIt is not necessary\
    \ in a compositional server control to call the Render method, because all of\
    \ the individual controls added to the Controls collection will take care of rendering\
    \ themselves during the Render stage of page processing.\n\nIf you want to manipulate\
    \ controls after they've been added to the Controls collection, you can access\
    \ them either by their numeric index, as shown here, or by calling the FindControl\
    \ method of the Control class and passing in the ID of the control you want to\
    \ manipulate.\n\n```\nDim MyText As TextBox = Controls(1)\n```"
  merge: -1
  pgno: 402
- img_proc: true
  md: '# Implementing INamingContainer


    Compositional controls should always implement the INamingContainer interface.
    This interface does not contain any property or method declarations. It creates
    a new naming scope for the current control to ensure that the names of child controls
    are unique within the page.


    In the next section, you''ll see examples of both overriding the CreateChild-Controls
    method and implementing INamingContainer.


    # Creating Templated Controls


    Another innovative feature of ASP.NET server controls allows you to separate the
    UI from the implementation of a control through inline templates. Templated controls
    contain no formatting code themselves. Instead, they rely on the consumer of the
    control to add templates that provide the necessary formatting of the control''s
    output.


    To demonstrate templated controls, let''s walk through the process of turning
    your HelloControl into a templated control:


    +   1. Open the file HelloControl.vb, and save a copy as HelloControlTemplated.vb.

    2. Remove the HelloControl and HelloControlPropMeth classes from the file, and
    rename the HelloControlProp class to HelloControlTemplateItem.

    3. Add an implements statement on the line following the INamingContainer interface.
    This sets up a separate naming scope for the controls that are part of your custom
    control.


    ```

    Inherits Control

    Implements INamingContainer

    ```


    +   4. Remove the overridden Render method from the class.

    5. Add a New method to allow the Name property to be passed to the HelloControlTemplateItem
    class when it is created.


    ```

    Public Sub New(Name As String)

    _name = Name

    End Sub

    ```


    Set the default value for the _name variable to "". The completed class should
    look like the following:


    ```

    Public Class HelloControlTemplated

    Inherits Control

    Implements INamingContainer

    ```'
