  md: '# Chapter 9 Creating Web Forms


    245


    # Page Runtime Structure


    As discussed earlier, at runtime ASP.NET combines the code in the page and any
    associated code-behind class into a single class, and then compiles that class
    and executes it on the server. In the process, ASP.NET builds a control tree containing
    all of the controls on the page, including LiteralControl server controls for
    each section of HTML text.


    > important

    When compiling a page, ASP.NET automatically creates controls that represent the
    HTML markup in the page, using the LiteralControl server control class. This allows
    the HTML markup to be easily manipulated by adding controls at runtime, and also
    has greater flexibility. If the page contains <% %> render blocks, however, ASP.NET
    will not create controls to encapsulate the HTML markup. If you want to manipulate
    the markup as LiteralControls, don''t use <% %> render blocks.


    At the top of the control tree is the control that represents the page, which
    has the ID __PAGE. Beneath are any child controls that belong to the page''s Controls
    collection. Each child control, depending on the type of control, may in turn
    have its own Controls collection containing child controls, and so on. This structure
    makes it much easier to find and manipulate controls at runtime.


    # Viewing the Page Control


    The easiest way to view the control tree for a page is to turn on tracing for
    the page. To view the control tree for the ServerControls.aspx page you created
    earlier, follow these steps:


    +   1 Open ServerControls.aspx in a text editor.

    2 Add the Trace attribute to the @ Page directive and set its value to true. The
    completed directive is as follows:

    <% Page Language="vb" Trace="true" %>

    3 Save the file and browse the page. The control tree section of the Server-Controls.aspx
    trace output is shown in the following figure. Notice that where a control has
    been given an explicit ID through its id tag attribute, that ID is used in the
    control tree.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# ASP.NET Step by Step


    ![](img/50a47de1541381ea3363945ae9c22411_265_0.png)


    # Adding and Manipulating Controls at Runtime


    Thanks to the control tree built by ASP.NET at runtime, you can easily add, remove,
    or manipulate controls at runtime, even if you don''t know the name of a control.
    For example, you can use the *Add* method of the page''s *Controls* collection
    to add a new control to the page at runtime.


    Dim MyTextBox As New TextBox

    Page.Controls.Add(MyTextBox)


    If you want to place the new control at a particular position in the control tree,
    you can use the *AddAt* method instead.


    Dim MyTextBox As New TextBox

    Page.Controls.AddAt(2, MyTextBox)


    To remove a control by name, you can use the *Remove* method.

    Page.Controls.Remove(MyTextBox)


    And to remove a control by index, you can use the *RemoveAt*.

    Page.Controls.RemoveAt(2)


    To locate a particular control by ID, you can use the *FindControl* method of
    the page or control containing the control you''re looking for.


    ```

    MyControl = Page.FindControl("TextBox")

    ```


    Note that *FindControl* returns an object of type *Control* (rather than the specific
    type of control used), you will need to cast to the appropriate control type before
    using properties or methods that are specific to that control type.'
  merge: -1
