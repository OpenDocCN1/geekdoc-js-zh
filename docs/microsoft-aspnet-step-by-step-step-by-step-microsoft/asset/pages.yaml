  md: '# Chapter 2 Using ASP.NET Development Tools 21


    Assuming that your Web server is correctly installed and you''ve created your
    virtual directory based on the steps earlier in the chapter, you should see something
    like the following figure.


    ![](img/50a47de1541381ea3363945ae9c22411_40_0.png)


    While this page may not be terribly exciting and doesn''t do much yet, you''ve
    taken the first step toward developing a successful ASP.NET application using
    Notepad.


    > note

    Localhost is a name that is used in URLs to refer to the local Web server. It''s
    equivalent to the Internet Protocol (IP) address 127.0.0.1, which is the default
    loopback address for a machine. You can also browse local HTML, ASP, and ASP.NET
    pages by using the following syntax:

    http://<machine name>/<page name>

    where <machine name> is the name of the computer you''re browsing from, <virtual
    name> is the name of the virtual directory that contains the page you want to
    browse, and <page name> is the name of the page you want to browse. <page name>
    is optional. If <page name> is omitted, the Web server will deliver the default
    page for virtual directory (usually default.htm, index.htm, or variants of these
    with the .asp extension), if a default has been specified.


    Other Text Editors

    Notepad is probably the most common text editor in the Windows world, but it''s
    by no means the only one. In addition to Notepad, there are many third-party text
    editors that offer many features that were once only available in high-end development
    tools. Some of these features include the following:'
