    # Data-Bound Controls


    One of the most significant advances in ASP.NET is in the area of data binding.

    The System.Web.UI.WebControls namespace contains a set of data-bound con-

    trol that offer substantial functionality and flexibility, without the necessity
    of

    tying front-end UI logic into back-end database logic, as was the case with the

    data-bound Design-Time Controls available in classic ASP through the Visual

    InterDev 6.0 development environment. The data-bound controls also allow you

    to provide data binding regardless of the browser that your clients are using.
    This

    is because the controls run on the server and return plain HTML to the client,

    unnike some of the data-binding techniques that were possible with Internet

    Explorer versions 4.0 and later.


    Another major improvement is that the data-bound controls can also use a variety
    of

    sources, not just data from a database. Data-bound controls in ASP.NET can be

    bound to data from an array, an ADO.NET DataSet, a DataView, and any data'
