    # Caching Multiple Versions of Output


    If your page uses either querystring (GET requests) or form fields (POST requests)
    to dynamically generate content, you can still use output caching by adding the
    VaryByParam attribute to the @Cache directive with the values set to the names
    of the parameters by which vary the cache. ASP.NET will cache a copy of the output
    for each unique combination of parameters, so any user who requests the page within
    the period specified by the Duration attribute with the same set of parameters
    as a request will have his request fulfilled from the cache.


    > important

