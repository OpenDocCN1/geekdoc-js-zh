  md: '# Xml


    The Xml control is a specialty control that lets you display XML code within ASP.NET
    Web Forms pages. This is important because raw XML will not be displayed predictably.
    The Xml control can read XML from a string, from a provided URL, or from an object
    of type System.Xml.XmlDocument.


    In addition to simply displaying XML from a given source, the Xml control can
    also apply an XSLTransform document to the XML to perform formatting on the document.
    The XSL Transform can come from a URL, or it can be provided by an object of type
    System.Xml.Xml.XslTransform.


    # Validation Controls


    Another specialized set of controls that reside in the System.Web.UI.Controls
    namespace are the Validation controls, which perform various kinds of validation
    on other controls.


    You can use Validation to do the following:


    +   - Ensure that required fields are filled

    - Ensure that data entered by the user falls within a given range

    - Ensure that data entered by the user matches a specific pattern

    - Compare the values of two controls for a given condition (equality, greater
    than, etc.) or compare the value of a control to a specified value

    - Ensure that all controls on a page are valid before submitting the page


    # Shared Members


    There are number of important properties and methods that all Validation controls
    share. These properties and methods are inherited from the BaseValidator class
    and include the following:


    +   - ControlToValidate This property sets or retrieves a value of type String
    that specifies the input control to validate.

    - Display This property sets or retrieves a value that determines the error message
    for a Validation control will be displayed. The value must be one of the values
    specified by the ValidatorDisplay enumeration. The default is Static.

    - EnableClientScript This property sets or retrieves a boolean value that determines
    whether client-side validation will be performed. Server-side validation is always
    performed with the Validation controls, regardless of the setting. The default
    is true.'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'Enabled This property sets or retrieves a boolean value that determines whether
