  md: '# About the Author


    G. Andrew Duthie is the founder and Principal of Graymad Enterprises, Inc., providing
    training and consulting in Microsoft Web development technologies. Andrew has
    been developing multitier Web applications since the introduction of Active Server
    Pages. He wrote about developing scalable n-tier applications in Microsoft VisualInterDev
    6.0 Developer''s Workshop, also from Microsoft Press.


    Andrew is a frequent speaker at events, including Software Development, the Dev-Connections
    family of conferences, Microsoft DeveloperDays, and most recently, VSLive!


    In addition to his writing, consulting, training, and speaking, Andrew enjoys
    playing music, smoking fine cigars, and most recently, playing Dead or Alive 3
    tag-team matches with his wife, Jennifer, on their new XBOX.


    You can reach Andrew by e-mail at andrew@graymad.com.


