- img_proc: true
  md: '# Limitations of Application State


    Application state has several limitations that you should consider when deciding
    how to manage your state information.


    +   - Durability Application state lasts only as long as the Web application is
    running. If the Web application or Web server is shut down or crashes, any state
    information stored at the application level will be destroyed. Any information
    that needs to persist between application restarts should be stored in a database
    or over persistent storage.


    +   - Web farms Application state is not shared across multiple servers in a Web
    farm (not across multiple processors in a Web garden). If you need to store values
    that must be available to all users in these scenarios, application state is not
    an appropriate choice.


    +   - Memory Any given server has only a limited amount of physical memory available.
    Overuse of application state may result in information being swapped to virtual
    memory (a location on a hard drive used to provide supplemental "memory" storage).
    This can reduce performance significantly.


    > note\Web farms are groups of identically configured servers that share the load
    of serving user requests for a given Web application. Each server can contain
    and fulfill any request. Requests are routed to individual servers by hardware-
    or software-load-balancing algorithm that determines which server is least loaded
    or assigns requests to a given server randomly.

    Web gardens are a new concept in ASP.NET in which an application can be set to
    run on specific processors on a multiprocessor server.


    # Using Session State


    As challenging as it can be to manage application-state information, the statelessness
    of HTTP maintaining state for individual users even more challenging. First, the
    Web server needs to be able to identify a series of requests as coming from a
    single user. Then the Web server must associate these requests with the state
    information for that specific user.


    In classic ASP, these challenges were met with the Session intrinsic object. Each
    user had his or her own session instance, identified by a session ID, which could
    be used to store per-user state information. The session ID, a unique generated'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Chapter 6 Managing Application State


    value for that run of the application, was then stored in a cookie on the client
    machine. It would then be passed back to the server with each subsequent request,
    allowing the server to identify the session associated with that user.


    Unfortunately, session state in classic ASP had several inherent limitations that
    made it less ideal, particularly for applications requiring high scalability.
    These included the following:


    +   * Web farms ** In classic ASP, session state could not be scaled across multiple
    servers in a Web farm, limiting its usefulness in high-scalability situations.


    +   * Durability ** In classic ASP, session state would be destroyed by a server
    restart or crash. This made it a poor choice for such shopping carts, whose contents
    should survive events.


    +   * Cookie reliance ** Classic ASP offered no inherent solution for supporting
    session state with browsers that could or would not accept cookies. Although aftermarket
    solutions were available, they often involved unacceptable performance trade-offs.


    ASP.NET solves each of these limitations, providing per-user state storage that
    is scalable, reliable, and available on browsers that don''t support cookies (or
    for users who do not accept cookies). For more information on the available options
    for ASP.NET session state and how they solve these limitations, see “Configuring
    Session Storage” on page 108.


    As with the ASP.NET Application object, the ASP.NET Session object is exposed
    as a property of the Page class, from which all ASP.NET pages inherit. This allows
    access to the Session object using the Session keyword.


    ```

    * VB.NET

    Session("MySessionVar") = "MyValue"

    MyLocalVar = Session("MySessionVar")

    ```


    ```

    // C#

    Session["MySessionVar"] = "MyValue"

    MyLocalVar = Session["MySessionVar"]

    ```


    > note

    When accessing the Session or Application collections directly using a key, you
    must use square brackets with C#, as shown in the preceding code . When calling
    methods, such as the Add or Remove methods, parentheses are used for VB.NET and
    C#.'
  merge: -1
