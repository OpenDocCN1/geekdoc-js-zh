  md: '# important


    One thing sample code has in common with much of the sample code you will encounter
    (and, unfortunately, some production code) is its use of the sa SQL Server login
    account with a blank password.(This is the default for SQL Server 6.5 and 7.0
    installs. You must explicitly choose a blank password in order to use a blank
    password in SQL 2000.). In practice, the sa account should always be a strong
    password because this account has administrative rights on the SQL Server machine.
    This includes the ability to run operating system commands through a specially
    extended stored procedure. In a production application, never use the sa account
    for accessing data from a page.


    If you cannot use a trusted connection to SQL Server, you should set up one or
    more special user accounts for each Web application with the absolute minimum
    rights to allow access to that application''s data. This will reduce the risk
    of overbroad rights, resulting in data being compromised.


    Another security issue in the sample is the placing of user ID and password information
    directly in the page. In practice, connection string information should be stored
    somewhere secure. In order of increasing security, options include storing it
    as an appSetting in Web.config, storing it as an appSetting in Machine.config
    (not appropriate in a shared server environment), and hard-coding it as a private
    member of a compiled code.


    # Short-Term Migration


    In the short term, your goal may be to simply move your pages to ASP.NET while
    still using most of the existing logic in the page. Keeping in mind that this
    choice has performance implications, it may allow you to make your migration easier
    by letting you do it in stages. Making the code in the previous listing work as
    an ASP.NET page is largely a matter of modifying it to comply with the rules of
    ASP.NET code.


    The first thing you should do is save a copy of the page to be migrated with a
    .aspx extension and try to run it. Although it''s unlikely that pages of any complexity
    will run unaltered, you might be surprised at what will run. More importantly,
    when you attempt to run the page and it fails, ASP.NET will give you information
    about why it failed and which line caused the failure.(Remember'
