    \ option in the Project Properties dialog for the project. This means that you\
    \ will not actually see the Namespace keyword in your class files, a namespace\
    \ will be created when the class is compiled.\n\nIn a Visual C# project, the namespace\
    \ keyword is added to class files and code-behind files automatically.\n\nIn both\
    \ languages, the default name for the namespace is the name of the project."
