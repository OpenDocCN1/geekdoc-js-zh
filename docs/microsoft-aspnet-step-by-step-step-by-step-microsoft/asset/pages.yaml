  md: "# ASP.NET Step by Step\n\ncontrol using a combination of the tag prefix you\
    \ defined and the class name of the control, as you'll see in the next section.\n\
    \n# Using Your Control in a Page\n\nOnce you've registered the control, you can\
    \ use it in a Web Forms page by adding the appropriate tag to the page. The syntax\
    \ for the tag for a custom control is <tagprefix:classname id=\"identifier\" runat=\"\
    server\\>\",\n\nHere, tagprefix is the tag prefix specified in the @ Register\
    \ directive, classname is the name of the class that controls the control, and\
    \ identifier is a unique (to the page) ID that you will use to refer to the control\
    \ in server-side code.\n\n# Adding Controls Programmatically\n\nIn addition to\
    \ adding the control to the page declaratively as shown earlier, you can add custom\
    \ controls to the page programmatically, just as you can with the standard ASP.NET\
    \ server controls. Adding controls programmatically does not require the @ Register\
    \ directive. You may want to add an @ Import directive, however, to avoid the\
    \ need to use the fully qualified name to refer to the controls in your assembly.\n\
    \nAdding a custom control to the page programmatically is essentially the same\
    \ as adding a standard ASP.NET server control to the page programmatically, and\
    \ uses the following syntax:\n\n```\n<@ Import Namespace=<namespace name> %>\n\
    <script runat=\"Load\">\n  Sub MyControl As New ControlClassName()\n    me.Controls.Add(MyControl)\n\
    \  End Sub\n</script>\n```\n\nHere, namespace name is the name of the namespace\
    \ containing the control, and ControlClassName is the name of the control's class.\
    \ In the preceding example, the New keyword is used to create an instance of the\
    \ control class, which is then added to the Controls collection of the page (referenced\
    \ by the me keyword). Once the control has been added to the Controls collection,\
    \ ASP.NET will take care of rendering it for you.\n\nYou'll see examples of both\
    \ declarative and programmatic use of a custom control in the next section."
