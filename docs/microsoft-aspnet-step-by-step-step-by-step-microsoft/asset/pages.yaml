    # Recommendations for Session State


    Session state''s ease of use makes it easy to overuse or abuse. The following
    table lists examples of when you may or not want to store information in session
    state, as well as alternatives for storing such information.


    | State Recommendations | Issues | Alternative |

    |---|---|---|n| User-specific settings | Depending on how frequently these values
    are accessed, session state may not be the most efficient way to store these settings.
    | For infrequently accessed values, consider storing user-specific settings in
    a database. |'
