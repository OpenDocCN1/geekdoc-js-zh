    # Limitations of Session State


    Thanks to a number of new features in ASP.NET, the primary limitation of session
    state in ASP.NET is that of memory. As with application state, session state is
    limited by the memory available on the Web server. Once the available physical
    memory on the Web server has been exhausted, information will be stored in much
    slower virtual memory.


    # State and Scalability


    How and where you choose to store state information for your application can have
    a major impact on how scalable your application is. Scalability refers to the
    ability of an application to service requests from increasing numbers of users
    without any significant decrease in performance or response time.


    Some of the factors affecting application scalability that result from poor decisions
    in state management include the following conditions:


    +   - Failure to disable session state when not used If you''re not using session
    state within your application, disable it by changing the mode attribute of the
    sessionState configuration section of Web.config to "off". For applications that
    limited use of session state, ensure that any pages that don''t use session state
    include the EnableSessionState="false" attribute as a part of the page''s @ Page
    directive.'
