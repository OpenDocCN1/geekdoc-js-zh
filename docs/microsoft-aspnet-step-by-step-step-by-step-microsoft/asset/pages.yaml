  md: 'commands being entered. Validation can help you prevent this problem, as well
    as prevent nuisance problems such users attempting to post profanity in guest
    book or discussion lists built with ASP.NET. In fact, ASP.NET makes it very easy
    to implement robust validation using a set of server controls designed specifically
    for this purpose. These controls are discussed further in Chapter 10.


    The important thing to remember is that you should always treat any input from
    a user as suspect until it has been proven otherwise. Validate the input from
    the user is what you''re expecting before you use, store, or display it.


    # Mind Those Ports!


    Internet applications communicate via the TCP/IP protocol, which is the basis
    for all communication between computers on the Internet. TCP/IP uses two pieces
    of information to find the endpoints for a given communication: the IP address,
    which is a unique number assigned to a machine, and a TCP port number, which for
    most applications is a well-known number used consistently by all applications
    of that type. For example, All servers use port 80 as the default for HTTP (Web)
    communications. The well-known nature of these port numbers and the services found
    on them makes it easier for Web servers and clients to find one another.


    Other well-known ports include File Transfer Protocol (FTP, port 21), Simple Mail
    Transport Protocol (SMTP, port 25), and POP3 (port 110). The full list of well-known
    ports and the services assigned to them can be found at http://www.iana.org/assignments/port-numbers.


    Why is this important to the discovery of security and Web server set-up? Because
    the very ease of discovery that well-known port numbers makes possible also presents
    a security risk for the unwary. For example, in Windows 2000, the ports for services
    such as FTP, SMTP, and POP3 (among others) are left open by default. This gives
    hackers an engraved invitation to probe these ports and the software behind them
    vulnerable to attack. Given the many vulnerabilities discovered in FTP, SMTP,
    and other Internet-based services, it is essential to choose all ports that are
    not use in your application.


    Closing ports can be accomplished in a number of ways, the most common being packet
    filtering (either through firewall software or a hardware router) or using the
    Windows 2000 IPSec Policy Management MMC snap-in. For many applications, the preferred
    solution is to set up a hardware firewall between the Web server and the Internet
    that only allows traffic on port 80 (HTTP), and optionally port 443 (HTTPS) if
    secure sockets Web traffic is required. (See “SSL to Protect Communications” on
    page 188 for more information on Secure Sockets Layer communication.) Then a second
    firewall is added between the Web'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'server and the internal network that only allows traffic on ports necessary
    for the Web server to reach other servers (such as the database server), and that
    blocks ports 80 and 443 (and any other ports open in the other firewall). This
    method places the Web server in what is referred to as a DMZ (demilitarized zone),
    which is designed to prevent direct communication between the Internet and an
    internal network. This protects servers on the internal network from attack.


    # important


    Whichever method you use to close unused ports on your Web server, it is imperative
    that you block traffic to any ports that your application or applications do not
    use. Remember, however, that the ports that remain open are still a security risk.
    Effective logging of server activity, frequent monitoring of logs, and prompt
    patching of vulnerabilities in software operating on the open ports are all important
    means of defending your server(s) from attacks.


    A discussion of packet filtering, routing, and IPSec management is beyond the
    scope of this chapter. Consult the manual for your firewall or router, or the
    Windows 2000 Help files, for more information on implementing these solutions.


    # Patching


    Once your server is set up correctly and securely, you might think you''re free
    home. Not so! Even the design of your application affects security, the most securely
    configured server and securely designed application can be compromised by a lax
    attitude towards ongoing maintenance. One of the most important aspects of ongoing
    maintenance of servers and applications is staying on top of patches released
    by vendors of any software you''re using.


    In an ideal world, the software we use would be perfect from the start. However,
    the reality is that there are few, any programs do not contain vulnerabilities.
    When these vulnerabilities are discovered, typically the vendor of the program
    will issue a patch designed to correct the problem. Unfortunately, many server
    administrators do not apply these patches consistently, leaving servers vulnerable
    to attack.


    This is inexusable. Most patches can be applied easily, and there are many ways
    that you can be notified automatically about new ones for Microsoft software.
    These include the following sources of information about patches.


    +   - The Windows Update site (http://windowsupdate.microsoft.com/) lets you analyze
    the updates available for a given system and determine which of'
