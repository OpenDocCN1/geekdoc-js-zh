- img_proc: true
  md: "# Chapter 4 Understanding Programming Basics\n\nOne thing that all three types\
    \ of errors have in common is that they must all be handled in some fashion, lest\
    \ they provoke dissatisfaction on the part of your users. An important first step\
    \ is prevention. In Visual .NET, two steps you can take to prevent errors using\
    \ Option Explicit and Option Strict in your applications. (They're turned on by\
    \ default in the Visual Studio .IDE.) Using Option Explicit will raise a syntax\
    \ error if you attempt to use a variable before declaring it, which can help greatly\
    \ if you have a habit of missing variable names. Using Option Strict will raise\
    \ a syntax error if you attempt an implicit data type conversion that would result\
    \ in a loss of data. Option Strict also implicitly includes Option Explicit, so\
    \ Option Strict will also raise a syntax error on any attempt to use an undeclared\
    \ variable.\n\nThe following example demonstrates the use of Option Strict:\n\n\
    ```\nDim MyInt As Integer\nDim MyDouble As Double\n```\n\n```\nMyDouble = 3.14159\n\
    MyInt = MyDouble 'This line will cause an error at compile time\n```\n\nBoth Option\
    \ Explicit and Option Strict must come before any other code in the module in\
    \ which they appear.\n\n# Using the Error Statement\n\nOnce you've taken the preventive\
    \ steps using Option Explicit, or better yet, Option Strict, it's time to start\
    \ handling those inevitable errors. Error handling, also known as exception handling,\
    \ is another type of flow control that allows you to execute code that you specify\
    \ when an error or exception occurs. In Visual Basic 6, the only available option\
    \ for error handling was setting up an error-handler using the Error statement.\
    \ That option still exists in Visual Basic .NET.\n\n```\nSub ExampleSub(Arg1,\
    \ Arg2)\n  On Error GoTo ErrorHandler\n  'Code that might cause an error\nErrorHandler:\n\
    \  'Error handling code\n  Resume Next\n Sub\n```\n\nThe Error statement transfers\
    \ execution to the section of code indicated by the ErrorHandler label. Once the\
    \ error-handling code has executed, the Resume\n\n![](img/50a47de1541381ea3363945ae9c22411_90_0.png)"
  merge: -1
