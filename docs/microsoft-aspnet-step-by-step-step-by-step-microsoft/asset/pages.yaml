  md: "# Using Do... Loops\n\nDo... loops allow you to execute a set of statements\
    \ repeatedly for as long as a test condition remains true. Do... loops (also known\
    \ as Do... While loops) come in several variations. The most basic of these is\
    \ shown in the following example:\n\n```\n<%\n'Do While...Loop syntax:\nDim i\
    \ as Integer = 1\nDo While i <= 5\n%\n  <font size=\"<%=%>Welcome to ASP.NET</font><br>\n\
    %\n  i = i + 1\nLoop\n%\n```\n\nThe statements within the loop will be executed\
    \ as long as the variable i is less than or equal to S. If, for whatever reason,\
    \ i is greater than or equal to S the first time the Do statement is executed,\
    \ the statements within the loop will not be executed. If you want to ensure that\
    \ the statements within the loop will execute at least once, you can move the\
    \ While expression to the end of the loop, as follows:\n\n```\n<%\n'Do...Loop\
    \ While syntax:\ni = 0\nDo\n  i = i + 1\n%\n  <font size=\"<%=%>Welcome to ASP.NET</font><br>\n\
    %\nLoop While i < 5\n%\n```\n\nYou can also use the Until in place of While to\
    \ test for a condition, which would give you the opposite result of While.\n\n\
    Ultimately, the only real difference between While and Until is that While will\
    \ loop as long as its test condition evaluates to True, whereas Until will loop\
    \ as long as its test condition evaluates to False."
