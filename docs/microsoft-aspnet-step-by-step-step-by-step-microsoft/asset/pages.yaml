    SqlConn.Close()


    At this point, the data in the dataset can be updated or deleted, new rows can
    be added, or the entire dataset can be passed to another component because it
    no longer has a connection to the back-end database.


    # Reading XML Data


    In addition to populating a dataset from a database using a DataAdapter, you can
    also read the data for a dataset from an XML file or stream using the ReadXml
    method of the dataset. Since you can also save a dataset as XML using the WriteXml
    method, the two techniques together can be a convenient way of serializing and
    deserializing the data in a dataset. The ExecuteXml asp on page 310 shows an example
    of the ReadXml method to populate a dataset with XML data retrieved from SQL Server
    using the FOR XML query syntax.


    # Reading DataTables, DataColumns, and DataRows


    Another way of populating a dataset is to create its tables, columns, rows programmatically.
    This allows you to create a dataset without connecting to a back-end database.
    Assuming the schema of the created table(s) matches your database (which is handled
    in the following code by reading in an XSD schema file, shown on page 327, created
    from the Pubs Title database), you can connect to the database and update it based
    on the row(s) you''ve added to the dataset programmatically.


    The following listing shows the code for adding a new row to the Titles table
    of the Pubs sample SQL Server database. Note that the SelectCommand property of
    the SqlDataAdapter is set by passing the SqlSelect string to the constructor of
    the SqlDataAdapter. This is necessary to allow the UpdateCommand (the command
    that is called when the Update method of the SqlDataAdapter is called) to be built
    automatically, using the SqlCommandBuilder object.'
