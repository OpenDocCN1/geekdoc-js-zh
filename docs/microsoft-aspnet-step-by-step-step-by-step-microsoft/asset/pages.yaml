    and sometimes even a different pair of eyes can help a lot.


    # Compiling Web Forms Pages in Debug Mode


    As mentioned in the introduction to this chapter, ASP.NET provides a great deal
    of information to developers when a bug or error halts execution of an application
    by throwing an exception. Some of this information, as the stack trace, is available
    regardless of how the code was compiled. In the following figure shows the output
    of a page compiled in release mode that divides by zero code to force an exception
    to be thrown.


