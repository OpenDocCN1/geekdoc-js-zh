    # Invalidating the Cache Automatically on Data Change


    One of the biggest challenges in caching in your application is how to get the
    most out of it, even when you''re dealing with data that is either frequently
    updated or must be fresh. Although setting absolute and/or sliding expiration
    times for a cached item may reduce the likelihood of a user getting stale data,
    it''s still possible.


    What you need is a way to notify the ASP.NET cache when a table has been updated,
    or to remove an item from the cache. CacheDependency class and the SQL Server
    Web Assistant make this easy.


