- img_proc: true
  md: 'Each HTML control class is derived from the generic HtmlControl class. This
    class provides methods and properties common to all HTML controls, such as the
    Attributes collection, which provides a collection of name/value pairs for any
    attributes contained in the tag definition (such as id="myControl" or border="1").
    The individual control classes then expose additional methods and properties that
    are specific to the HTML element they represent. For example, the HtmlAnchor control
    exposes an Href property that allows you to practically modify the URL to which
    the anchor tag is linked, as well as a Target property, which allows you to modify
    the target of the anchor tag.


    # important


    Because the HTML controls do not expose a strongly typed control equivalent for
    every HTML element, you can use the Attributes collection to add tag attributes
    to any HTML control programmatically. This allows you to set properties of tags
    that are not exposed declaratively by the HTML controls.


    Many of the HTML controls also expose events to which you can respond (above and
    beyond the standard events inherited from HtmlControl). There are two events exposed
    by HTML controls, ServerClick and ServerChange. The table that begins on page
    252 lists controls support which events.


    # note


    Unlike the server controls in the Web control namespace, which only handle server-side
    events, HTML controls can handle both server-side events and any client-side events
    that exist for the HTML element to they map. For example, the InputButton control
    supports both the server-side ServerClick and the client-side Click event.


    To handle both, you''d use the following tag declaration:


    ```

    <input type="submit" onclick="client_handler"

    serverclick="server_handler" runat="server"/>

    ```


    This allows you to perform actions on the client before the page is posted back
    to the server, if desired.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Chapter 10 Using Server Controls 255


    Because of their close mapping to individual HTML elements, HTML controls provide
    the fastest and easiest path for moving from static HTML to the power of ASP.NET
    server controls.


    # note


    In Web Forms pages, there are three basic rules of the game when it comes to case
    sensitivity.


    +   - Namespaces and class names are case sensitive. For example, namespaces imported
    using the @ Import directive will cause an error if the correct case is not used.
    This is a common cause of errors for those just starting with ASP.NET.


    +   - Tag names and attributes are not sensitive. This also applies to server
    control properties expressed as tag attributes.


    +   - Control names used in <script> blocks or in code-behind classes may or not
    be case sensitive, depending on whether the language you''re using is case sensitive.
    C# is case-sensitive, for example, so using the incorrect case for a control name
    or property in C# code can lead to errors.


    When you''re working with a case-sensitive language, or when you receive errors
    such as "The Namespace or type <namespace> for the Import System.<namespace> cannot
    be found," it''s usually a good idea to check for incorrect case in control, class,
    or case names.


    # HTML Control Examples


    To demonstrate the simplicity and power of HTML controls, let''s take a look at
    some examples. Let''s say you have the following static HTML page:


    ```

    <html>

    <body>

    <font>Hello, World!</font>

    </body>

    </html>

    ```


    By simply adding the runat="server" attribute and an id attribute to the <body>
    and <font> elements, you can turn these elements into HtmlGenericControls.'
  merge: -1
  pgno: 274
