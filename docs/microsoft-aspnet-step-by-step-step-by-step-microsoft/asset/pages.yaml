  md: '# Using DataLists


    DataLists provide an excellent mix of built-in functionality and control over
    display formatting. Unlike the DataGrid control, in which the rows are displayed
    one after the other in a table format, the DataList can display its items in multiple
    columns and can display rows horizontally or vertically.


    Follow these steps to display information from the Title table of the SQL Server
    database:


    +   1. Create a new file and save it as TitlesData1.aspx.


