  md: '# MICROSOFT® ASP.NET STEP BY STEP


    Master ASP.NET with the proven Microsoft Step By Step learning method.


    Active Pages .NET (ASP.NET) provides the most advanced Web-development platform
    to create. Get a solid hand on this revolutionary new programming framework and
    its underlying technologies with this accessible, modular primer.

    You''ll quickly learn to put together the basic blocks to get using ASP.NET and
    find examples drawn from the real-world challenges that both beginning and experienced
    developers face every. Easy-to-grasp instructions help you understand fundamental
    tools and techniques such as the common language runtime, Web Forms, XML Web services,
    and the .NET Framework. Throughout the book, you''ll find insightful tips about
    best practices to follow using ASP.NET to create scalable, high-performance Web
    applications.


    # Topics covered include:


    +   * ASP.NET overview

    * ASP.NET development tools

    * Using ASP.NET development fundamentals

    * Understanding programming basics

    * Creating .NET Web applications

    * Managing application state

    * Configuring ASP.NET applications

    * Security in ASP.NET

    * Creating Forms


    +   * Using server controls

    * Accessing and binding data

    * Creating custom server controls

    * Creating and using XML Web services

    * Deploying ASP.NET applications

    * Tracing and debugging ASP.NET applications


    Includes sample code


    # CD-ROM features:


    +   * Examples of real-world solutions developed with ASP.NET, including sample
    code in Microsoft Visual C#™


    For System Requirements, please see the book''s Introduction.


    # About the Author:


    Andrew Duth is the founder of Graymaid Enterprises, Inc., providing training and
    consulting Microsoft development technologies. Andrew has been developing mult
    Web applications since Active Server Pages. He wrote about developing scalable
    n-tier applications in Microsoft Visual InterDev 6.0 Enterprise Developer''s Workshop,
    from Microsoft Press.


    To see the full line of Microsoft Press developer resources, go to: microsoft.com/mspress/developer


