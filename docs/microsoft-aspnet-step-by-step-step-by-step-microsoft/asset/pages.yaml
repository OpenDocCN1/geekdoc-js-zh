    # Advertising a Web Service


    Once you''ve created a Web service using the techniques in either of the previous
    examples, the Web service is ready to be accessed by clients. The challenge at
    this point is how to give clients the information necessary to allow them to access
    your Web service.


    In an intranet-based scenario, this is relatively simple. You can provide potential
    internal clients with the URL to your Web service directly, either by e-mailing
    it to those who need it or by creating a centrally located Web page that users
    within your organization can browse to find the appropriate URL. In an Internet-based
    scenario, however, you may not know who your potential clients are. This makes
    it much more difficult to ensure that they can find and use your Web services.


    There are two solutions to this dilemma: Web services discovery, and Web services
    directories using Universal Description, Discovery, and Integration (UDDI).'
  merge: -1
  pgno: 430
- img_proc: true
  md: '# Advertising Web Services Through a Discovery Document


    A discovery document is an XML-based document containing references to Web services
    and/or other discovery documents. Through the use of discovery documents, you
    can easily catalog all of the available Web services on a Web server at a single
    location.


    By publishing a discovery document to a publicly available URL, you can make possible
    for clients to easily locate and consume Web services that you have made available.
    Clients can access the discovery document using tools such as wsdl.exe command-line
    utility supplied with the .NET Framework, or with Visual Studio .NET''s Add Web
    Reference dialog, in order to create clients for the Web service. We''ll discuss
    this process in greater detail in “Using a Web Service” on page 415.


    A discovery file uses the extension .disco and contains two types of nodes: contractRef
    nodes and discoveryRef nodes. The contractRef nodes refer to WSDL files that can
    be used to create clients for a Web service, with discoveryRef nodes refer to
    additional discovery documents. The discovery document for the two example Web
    services created in this chapter is shown in the following listing, Chapter13.disco.
    The attribute of the contractRef node contains the URL to the WSDL contract for
    the Web service, in this case generated by ASP.NET by appending the ?WSDL argument
    to the URL for the .asm file that implements the Web service. The docRef attribute
    contains the URL to the documentation for the Web service, in this case simply
    the URL to the .asm file, since ASP.NET automatically generates documentation
    for Web services implemented in an .asm file. The xmlns attributes in the discoveryRef
    and contractRef nodes establish the XML namespaces in which these nodes reside.


    # Chapter13.disco


    ```

    <xml version="1.0" encoding="utf-8" ?>

    <discovery xmlns="http://schemas.xmlsoap.org/disco">

    <contractRef ref="AuthorsService.asmx">

    <docRef="http://schemas.xmlsoap.org/disco/sc1/" />

    <contractRef ref="HelloService.asmx?wsdl">

    <docRef="HelloService.asmx">

    xmlns xmlns="http://schemas.xmlsoap.org/disco/sc1/" />

    </discovery>

    ```


    Note that for sake of readability, relative URLs were used in this listing. Discovery
    documents can contain either relative or absolute URLs. When relative URLs are
    used, they are assumed to be relative to the location of the discovery document.'
  merge: -1
  pgno: 431
- img_proc: true
  md: '# Chapter 13 Creating and Using Web Services 413


    # Advertising Web Services Through UDDI


    Another option for advertising Web services to potential clients UDDI. This is
    a multivendor initiative, spearheaded by Ariba, IBM, and Microsoft, that is designed
    to provide an Internet-based business registry (or registries) in which creators
    of Web services may register their publicly available Web services. The UDDI specification
    describes how Web services may be registered in such a way as to allow clients
    to easily search for the type of Web service desired, or to discover all of the
    Web services offered by a particular partner or company.


    > note While the UDDI initiative is based on Web standards and proposed standards
    such as DNS, HTTP, XML, and SOAP, UDDI itself is not a proposed standard. Rather,
    it''s a multivendor specification, created and maintained by Ariba, IBM, and Microsoft,
    with input from other companies. It is the stated intent of the UDDI specification
    to be transitioned to a standards body eventually.


    The model for UDDI is for multiple identical versions of the UDDI business registry
    to be hosted by multiple participants, providing redundancy and load balancing
    for the registry. Web service providers can register their Web services at any
    node and the information will be replicated to all registries daily, allowing
    potential clients to find these services from any registry.


    Currently, both Microsoft and IBM provide online UDDI registries, and both can
    be reached from http://www.uddi.org/. You can also find a number of white papers
    on UDDI there.


    # Securing a Web Service


    One challenge of implementing a Web service comes when you need to limit who can
    access it. You may wish to limit access to only those clients who have paid a
    subscription fee, for example. Or if your Web service stores and uses data that''s
    specific to individual users, you might want to implement some of login process
    to allow clients to view and modify only data that is specific to them.


    One potential issue with this is the SOAP protocol, on Web services are based,
    does not provide any specifications for securing Web services. This means that
    it''s up to you to choose a means of securing your Web service that provides the
    level of security you need but that''s also relatively easy to implement, both
    for you and your clients. The last thing you want is to make your Web service
    so difficult to use that potential clients elsewhere.'
  merge: -1
  pgno: 432
- img_proc: true
  md: '# Exploring Authentication Options


    The first choice you must make is to authenticate users of your Web service. There
    are a number of options, each with its own advantages and disadvantages.


    ASP.NET does not define any specific authentication and authorization method for
    Web services, you can take advantage of the authentication mechanisms that IIS
    offers. These mechanisms are described in detail in Chapter 8, in the section
    titled “Using Windows-Based Authentication.”


    The advantage of using one of the IIS authentication mechanisms is that the infrastructure
    for them already exists. You do not need to create your own credential store for
    account information. One disadvantage is that each of the methods offered by IIS
    requires the creation of NT accounts for each client of your application. This
    can be difficult to administer, depending on whether your Web server is set up
    in or an NT domain, and so on. Another disadvantage is that the Integrated Windows
    authentication method, while secure, requires the client to belong to the same
    domain (or a trusted domain), making it impractical for Internet use. Basic authentication
    is suitable for Internet use, but it sends username and password as clear text,
    making it easy to be compromised. Use SSL encryption to prevent this problem,
    but this may add an unacceptable performance overhead if user credentials are
    passed with each Web service request.


    Another option for authenticating users is a third-party authentication mechanism
    such as Microsoft Passport. Unfortunately, the developer tool support for Passport
    is still poor at present, and most available tools focus on allowing the use of
    Passport to authenticate users from Web sites, rather than Web services. While
    it is likely that Passport and other third-party authentication mechanisms will
    add support for simple implementation in Web services eventually, today these
    mechanisms will likely require too much effort on the part of your clients.


    Finally, you can “roll your own” Services authentication by implementing a login
    function in one or all of your Web services, with the login method returning a
    unique key (which should be hashed or encrypted) identifying the logged-in user.
    This key is then passed as a parameter of each Web service request, indicating
    that the user is an authenticated user. In order to protect the username and password,
    the login Web service method should be requested over an SSL connection, however,
    so as to avoid the performance overhead of SSL encryption. To reduce the risk
    of a user being impersonated by someone who has intercepted the login key, these
    keys should be stored in such a way that they can be easily expired after a predetermined
    value (in a back-end database, for example).'
  merge: -1
  pgno: 433
- img_proc: true
  md: 'While this authentication method is more difficult to implement and maintain
    than some of the others, it''s the simplest for your clients to use. Once you
    have given a client his account information (username and password), all he needs
    to do is make the request to the login Web service (over an SSL connection) and
    store his login key. With each subsequent request, he passes the key as one of
    the parameters of the Web service he''s calling. If the timeout value expires
    between one request and the next, the user must call the login method again to
    receive a new key. Therefore, the value should be set to provide a balance between
    security and convenience. In addition to the login method, you could also implement
    a logout method in your Web service to explicitly expire the login key.


    ![](img/50a47de1541381ea3363945ae9c22411_434_0.png)


    > important

    In controlling access to a Web service with authentication, you should also consider
    using SSL to encrypt communications if you are passing sensitive data to or from
    the Web service. This includes usernames and passwords sent when authenticating
    users.


    # Using a Web Service


    So now you''ve got a couple of nifty Web services, you''ll probably want to know
    how to use them, beyond testing them by invoking them from a browser. While the
    formatting of SOAP requests and responses necessary to call a Web service can
    be somewhat complicated, the .NET Framework abstracts away much of this complexity.


    Nonetheless, you still need to know how to locate and use a Web service, including
    the following:


    +   - Locating a Web service, using either a discovery document or UDDI

    - Using the WSDL.EXE utility to create a proxy class for the Web service

    - Using the proxy class from an ASP.NET page or console application to access
    the Web service


    # Locating a Web Service


    The first step in using an XML-based Web service is to locate it. If you''re dealing
    with a Web service that you or someone in your organization created, you may already
    know the location of the Web service. If so, you can skip this step.'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# ASP.NET Step by Step


    Locating a Web service is essentially the mirror image of advertising a Web service,
    so there are two techniques for locating a Web service in ASP.NET: discovery documents
    and UDDI.


    # Locating a Web Service with a Discovery Document


    In order to use a discovery document to locate Web services, you need the URL
    for the discovery document that describes the services you''re interested in.
    You might get the URL for the document from a listing on an organization''s public
    Web site, from an e-mail, or from a catalog.


    Once you have the URL for a discovery document, you can use the disco.exe command-line
    utility to generate WSDL contracts for the Web services described in the discovery
    document. The syntax for the disco.exe utility is disco [options] URL


    Here, options represents one or more command-line options for the utility, and
    URL represents the URL to the discovery document. The options for the disco.exe
    utility are shown in the following table.


    | disco.exe Options | Description |

    | /d:domain or /domain:domain | Sets the domain to use when connecting to a site
    that requires authentication. |

    | /nosave | Prevents disco.exe from saving files for the discovered WSDL and discovery
    documents. |

    | /nologo | Prevents the start-up banner from being displayed. |

    | /o:directory or /out:directory | Provides the directory name where output should
    be saved. |

    | /p:password or /password:password | Sets the password to use when connecting
    to a site that requires authentication. |

    | /proxy:url | Sets the proxy to use for HTTP requests. |

    | /pd:domain or /proxdomain:domain | Sets the domain to use when connecting to
    a proxy server that requires authentication. |

    | /pp:password or /proxypassword:password | Sets the password to use when connecting
