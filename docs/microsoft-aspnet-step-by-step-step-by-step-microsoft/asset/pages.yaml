  md: '# Hammer


    Most of the hand tools used today have changed little since the Middle Ages, the
    only major improvement being the use of steel instead of iron for cutting edges.
    The most common hand tools include saws, planes, and chisels, and such miscellaneous
    tools as hammers and screwdrivers, which are used in conjunction with fasteners.
    A hammer is a hand tool consisting of a shaft with a metal head at right angles
    to it, used mainly for driving in nails and beating metal.


    At Microsoft Press, we use tools to illustrate our books for software developers
    and IT professionals. Tools are an elegant symbol of human inventiveness, and
    a powerful metaphor for how people can extend their capabilities, precision, and
    reach. From basic calipers and pliers to digital micrometers and lasers, our stylized
    illustrations of tools give each book a visual identity and each book series a
    personality. With tools and knowledge, there are no limits to creativity and innovation.
    Our tag line says it all: The tools you need to put technology to work.


    * Microsoft Encarta® Reference Library 2002. © 1993–2001 Microsoft Corporation.
    All rights reserved.


    The manuscript for this book was prepared, galleyed, and composed using Adobe
    FrameMaker 6. Pages were composed by TIPS Technical Publishing, Inc., with text
    in Sabon and display type in Syntax. Composed pages were delivered to the printer
    as electronic prepress files.


    Cover Designer: Patricia Bradbury


    Interior Graphic Designer: James D. Kramer


    Principal Compositor: Lorraine B. Elder


    Copy Editor: Sean Medlock


