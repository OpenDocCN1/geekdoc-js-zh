    \ In Visual Basic .NET, you use both the Namespace keyword and a closing End Namespace\
    \ keyword to define the scope of the namespace.\n\nNamespace myNS\n\n+   'Class\
    \ definitions, etc. go inside the namespace\nEnd Namespace\n\nIn C#, you use the\
    \ namespace keyword and a pair of curly braces to define the scope of the namespace.\n\
    \n```\nnamespace myNS\n{\n    //Class definitions, etc.\n}\n```\n\nNote that if\
    \ you are creating your custom control using Visual Studio .NET, the IDE will\
    \ create the namespace for you automatically.\n\n> important\nAlthough Visual\
    \ Studio .NET creates a namespace for each project automatically, this is implemented\
