  md: 'Tabbed documents Designed to simplify the management of multiple files being
    edited simultaneously, the Tabbed Documents interface allows you to see all of
    the files you''re editing at once. This makes it much simpler to switch back and
    forth between editing windows. You can still set up Visual Studio .NET using the
    old method used by Visual 6, however. Just select Options from the Tools menu,
    select the General option in the Environment folder, switch from Tabbed Documents
    to MDI environment, and then click OK. You''ll need to restart Visual Studio .NET
    for this change to take effect.


    Auto-hide My personal favorite, auto-hide works like the feature of the same name
    in the Windows toolbar. To enable auto-hide for a window, click on the pushpin
    icon (shown in the margin) in the window''s title bar. Now the window will hide
    itself at the side of the IDE when the mouse moves away from the window, de docked,
    leaving only a tab with the window title visible. Mousing over the tab will cause
    the window to reappear. This is a great feature for preserving the maximum amount
    of real estate for the code window, and it can make life much easier in managing
    multiple windows in the IDE.


    Improved HTML editor Unlike InterDev before it, the Visual Studio .NET HTML editor
    provides both a design view and an HTML (source) view. Visual Studio .NET has
    done away with the Quick View window provided by Visual InterDev. Instead, you
    preview pages in an embedded browser window, which supports a truer view of how
    a page will really look. The improved editor also supports specifying the HTML
    schema you''re writing for via the targetSchema property. Setting targetSchema
    determines which elements will be made available via the editor''s statement completion
    features and allows the IDE to provide you with feedback on syntax that''s incorrect
    in the context of your chosen schema.


    # New Features


    In addition to the IDE enhancements, there are a number of entirely new features
    in the Visual Studio .NET IDE.


    +   * XML editor This allows you to edit XML data (.xml) and schema (.xsd) files
    in source, data, or schema views, depending on the type of XML file you''re editing.'
