  md: "# Adding Functionality\n\nAs cool as it may be to create and consume a custom\
    \ server control in a grand total of 16 lines of code (including both the control\
    \ and the Web Forms page that consumes it), it provides minimal functionality.\
    \ Clearly, to be truly useful, you need to add to the control.\n\nThe next several\
    \ sections will look at how to add properties and methods to a control, create\
    \ raise and handle events, handle postbacks, maintain state in a control, and\
    \ create templated controls. By the end of this section, you'll be able to add\
    \ a great deal of functionality to what is now a very simple control.\n\n# Adding\
    \ Properties and Methods\n\nTo make the control more functional, you're going\
    \ to provide the ability to change the greeting from Hello, World! to Hello, <somename>!<somename>\
    \ being supplied by a property you'll define in the control. You'll also define\
