  md: '# Putting It All Together: Using a Custom Control


    Let''s put your simple control to work. First practice implementing the control
    declaratively, as follows:


    +   1. Create a new file in your preferred editor and save it as HelloControl_Client.aspx.
    This file should be saved to an IIS application directory, which also contains
    a bin directory to which the compiled assembly containing the custom control has
    been copied.


    +   2. Add the @ Page directive and standard HTML tags to the file.

    <%@ Page Language="VB" %>

    <html>

    <body>

    </body>

    </html>


    +   3. Add next an @ Register tag with the appropriate attributes for the control.

    <%@ Register TagPrefix="ASPNETBS" Namespace="ASPNETBS" Assembly="HelloControl"
    %>


