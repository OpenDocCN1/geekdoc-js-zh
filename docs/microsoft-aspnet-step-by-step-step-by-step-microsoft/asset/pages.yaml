    If you accidentally create a virtual directory when you wanted to create an application
    root, you can turn the virtual directory into an application root with a few simple
    steps.


    +   1 Right-click the virtual directory name in the Tree pane of Internet Services
    Manager, and then choose Properties.


    +   2 On the Virtual Directory tab, shown in the following figure, click the Create
