  md: '# OleDbCommand


    For most purposes, using the OleDbCommand class is effectively the same as using
    the SqlCommand class. Instead of connecting with the SqlConnection class, you
    can just use the OleDbConnection class. One significant difference, however, is
    that the OleDbCommand class does not have an ExecuteXnlReader method.


    Here''s how to use OleDbCommand to execute an aggregate query against the Northwind
    Microsoft Access database and return a result (this example assumes that you have
    the Northwind.mdb database installed locally):


    +   1. Create and open an OleDbCommand with the appropriate connection string
    for connecting to the Northwind database, with <filepath> is the path to Northwind.mdb
    db on your machine.


    ```

    Dim ConnStr As String

    ConnStr = "Provider=Microsoft.Jet.OLEDB.4.0;"

    ConnStr& = "Data Source=<filepath>\northwind.mdb";

    Dim myOleDbConn As New OleDbConnection(ConnStr)

    myOleDbConn.Open

    ```


    +   2. Create a variable to contain the SQL query (note that the query can also
    be passed as a literal string to the constructor of the OleDbCommand class).


    ```

    Dim Sql As String = "SELECT Count(*) FROM products"

    ```


    +   3. Create an OleDbCommand object, passing the SQL query and the connection
    object to the constructor.


    ```

    Dim myOleDbCmd As New OleDbCommand(SQL, myOleDbConn)

    ```


    +   4. Create a variable to receive the return value from the command. This variable
    is declared as type Object because that is the return type of the ExecuteScalar
    method of the OleDbCommand object.


    ```

    Dim Result As Object

    ```


    +   5. Finally call the ExecuteScalar method of the OleDbCommand object, and use
    the returned value. Note that the value must be cast to the correct type before
    using because the returned type is Object. This is especially important if you
    need to use methods of a particular type that are not implemented by Object.


    ```

    Result = myOleDbCmd.ExecuteScalar()

    Value.Text &= CType(Result, String)

    ```


    The following listing shows how you would use this example to display the returned
    result in a Web Forms page.'
