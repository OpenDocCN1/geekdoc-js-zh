  md: '# Using Caching to Improve Performance


    +   In this chapter, you will learn about

    * Taking advantage of caching for output Web Forms pages and user controls

    * Taking advantage of caching for data retrieved from ADO.NET

    * Using the Cache APIs to get fine-grained control over the expiration, dependencies,
    and other properties of cached items


    The good news about ASP.NET is that its improvements, from the use of compiled
    languages rather than interpreted languages to the complete rewrite of the ASP.NET
    execution engine, make it easy to get the performance that many applications need.
    Well-designed applications written in ASP.NET will almost always be faster than
    the equivalent applications written in classic ASP.


    But there is still a class of applications for which these performance improvements
    alone will not be sufficient. These may be applications whose pages are computationally
    intensive (such as pages that use recursive procedures) or access large amounts
    of data, or applications that need to scale to large numbers of concurrent users.


    ASP.NET offers new features for this class of applications, including a simple
    API for output caching and a rich and robust caching engine and API.'
  merge: -1
  pgno: 446
- img_proc: true
  md: '# Understanding Caching


    Caching is the process of temporarily storing resources in memory. These resources
    may be expensive because of the amount of processor time necessary to render them,
    because they reside on disk, or because they reside in a back-end database on
    another machine.


    Pages that are expensive to render can consume much processor time, beyond a certain
    number of users, the Web server becomes unable to fulfill additional requests
    in a timely fashion. Retrieving pages and other content from disk is much slower
    than serving them from memory, and this performance difference is magnified when
    the server needs to fulfill many requests simultaneously. Requests for large amounts
    of data from a back-end database often encounter both disk-based and network-based
    performance delays. (This calls from one server to another substantially more
    expensive than fulfilling a request on the same machine.)


    For these reasons, Web applications that need high performance caching to mitigate
    the performance costs of expensive operations. The output from recent requests,
    or requested data, is cached in memory. Subsequent requests are served from this
    in-memory cache, rather than rendering a page or querying a database. This can
    substantially improve the performance and scalability of an application. Unfortunately,
    in the past this has come with a cost. Developers using classic ASP were limited
    to using the Session and Application intrinsic objects for caching, or to rolling
    their caching engine.


    ASP.NET offers a rich, robust framework for caching both page output and arbitrary
    data that developers can access easily using both declarative and programmatic
    means. ASP.NET caching allows developers to declaratively cache page and user
    control that does not need to change request to request. The cache API provides
    a number of methods that allow developers to add items to the cache, remove items
    from the cache, and set properties that determine the lifetime of items stored
    in the cache.


    # Using Output Caching


    Output caching allows you to cache the rendered output of any ASP.NET Web Forms
    page or user control, and to serve subsequent requests from the cache. This can
    substantially reduce the processor load on the Web server, since the processor'
  merge: -1
  pgno: 447
- img_proc: true
  md: 'isn''t busy rendering pages whose content hasn''t changed. There are two basic
    techniques for enabling output caching: the declarative technique uses the @ OutputCache
    directive and its associated attributes to enable output caching, while the programmatic
    technique uses the Response.Cache property to programmatically set caching parameters.


    # Using the @ OutputCache Directive


    The simplest method to quickly set up output caching for a given page or user
    control is to add the @ OutputCache directive. This directive and its attributes
    allow you to set the length of time the content should be cached, the location
    where it should be cached, and any parameters to be used to cache multiple versions
    of the page. The following table describes the available attributes for the @
    OutputCache directive.


    | Attribute | Description |

    | --- | Sets the number of seconds to cache the content. This attribute is required.
    |

    | Location | Sets the location to be used to cache content. This can be one of
    the following values:

    Any: Content can be cached by any cache-aware application (such as a proxy server)
    in the request stream, by the Web server, or by the client browser.

    Client: Content is cached by the requesting client''s browser.

    Downstream: Content can be cached by any cache-aware application downstream of
    the Web server fulfilling the request.

    Server: Content is cached on the Web server.

    None: No caching.

    Default: Default is Any.

    This attribute may be used with Web Forms pages only. |

    | VaryByControl | Sets the names of properties of a user control by which to vary
    the caching of the user control output. Multiple properties are separated by semicolons.
    This attribute may be used with user controls only. |'
  merge: -1
  pgno: 448
- img_proc: true
  md: '# @ OutputCache Attributes (continued)


    | Attribute | Description |

    | VaryByCustom | Allows varying of cached content by browser user agent, browser
    capabilities, or custom logic. When set to any value other than browser, requires
    that the HttpApplication.GetVaryByCustomString be overridden in Global.asax in
    order to implement the custom logic. |

    | VaryByHeader | Allows varying of cached content based on the value of one or
    more HTTP request headers. Multiple properties are separated by semicolons. This
    attribute may be used with Web Forms pages only. |

    | VaryByParam | Allows varying of cached content based on the value of one or
    more query strings with a GET request, or form fields with a POST request. Multiple
    key or field names are separated by semicolons. You can also set the value of
    this attribute to * vary by all parameters, or to use the same cached page regardless
    of GET/POST parameters. This attribute is required. |


    Among the most important features of the @OutputCache attributes are the VaryBy
    attributes. These attributes make it possible to cache pages and user controls
    even when those pages are dynamically generated by querystring values, field values,
    HTTP header values, or even browser capabilities.


    The Duration attribute allows you limit the length of time that output is cached.
    For pages that are updated periodically, but not as frequently as every request,
    the Duration attribute allows you to fine-tune the output caching so that you
    can maximize the benefit gained by caching while being reasonably sure that users
    will not get stale content. For example, if you had a page that, on average, was
    updated every two hours, you could set the Duration attribute of the @OutputCache
    directive to 15. This would cache the output of the page for 15 minutes from the
    last time the page was requested (subject to the VaryBy... attributes). This would
    ensure that the page would only need to be rendered every 15 minutes, and that
    regardless of how many requests were received for the page, and there would only
    be a 15-minute window in which users could get a cached page rather than updated
    data.


    Finally, the Location attribute determines where the output cache is located.
    Setting certain values for the Location attribute causes ASP.NET to set the If-Modified-Since
    HTTP header to allow caching of page or control output.'
  merge: -1
  pgno: 449
