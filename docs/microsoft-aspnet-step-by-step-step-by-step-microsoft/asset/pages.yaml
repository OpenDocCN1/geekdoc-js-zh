  md: '# important


    The example Web services in this chapter all use the XML namespace http://www.aspnetbs.com/webservices/.
    As with the default http://tempuri.org namespace, if you intend to make your XML-based
    Web services publicly available over the Internet, you should not use http://www.aspnetbs.com/webservices/
    as the namespace for your Web service. Instead, use a URI that you control, and
    one that will allow you to be sure that your Web service can be uniquely identified.


    # Using Primitive DataTypes


    The HelloService does not have any input parameters, and it returns a value of
    type String. But XML-based Web services are not limited to strings and can accept
    input parameters as well as returning values.


    XML-based Web services in ASP.NET use the XML Schema Definition (XSD) draft specification
    to specify the datatypes that are supported by ASP.NET Web services. This includes
    primitive datatypes as string, int, boolean, long, and so on, as well as more
    complex types as classes or structs.


    The definition for a Web service method that adds two numbers and returns the
    result would look like this:


    ```

    <WebMethod()>

    Public Function Add(Num1 As Integer, Num2 As Integer) As Integer

    Return (Num1 + Num2)

    End Function

    ```


    # Accessing Data in a Web Service


    In addition to primitive types, classes, and structs, ASP.NET Web services can
    also return or accept ADO.NET datasets as input parameters. This is possible because
    the DataSet has built-in support for serializing as XML, which can be easily sent
    over an HTTP connection.


    To return a dataset from a Web service, follow these steps:


    +   - Create a new file called AuthService.asmx.

    - Add the @WebService directive to the file, specifying Visual Basic .NET as the
    language and Hello as the name of the class that implements the Web service.\<%@WebService
    Language="VB" Class="Authors" %>'
