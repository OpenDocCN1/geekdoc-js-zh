- img_proc: true
  md: '# note


    If you are unable to use Windows authentication and impersonation in your ASP.NET
    application, you may still be able to take advantage of trusted connections by
    configuring the default ASPNET account (used to run the ASP.NET worker processes)
    as a SQL Server login account. Keep in mind, though, this will allow anyone who
    can access any ASP.NET application to change the database according to the permissions
    you have set up for the ASP.NET account. The process of setting up the ASPNET
    account as a SQL Server login is described in Chapter 11.


    # Understanding Code Access Security


    Another new security feature in ASP.NET is code access security. A full discussion
    of code access security is beyond the scope of this chapter, but here''s an overview.


    Code access security is Microsoft''s answer to the challenge of preventing untrusted
    code from performing actions on your system that might result in the damage or
    compromise of data. Allows ASP.NET developers and/or server administrators to
    specify the level of trust a given application should have, using the `<securityPolicy>`
    and `<trust>` tags in Web.config. (See Chapter 7 for more information on these
    tags). ASP.NET comes preconfigured with a set of code access security templates
    that are mapped to trust levels in Machine.config. Depending on the level of trust
    specified in the `<trust>` tag, the proper set of code access security permissions
    are applied to the application. This can include such permissions as whether the
    application can read from parts of the file system beside its Web space, can write
    to its file space, or is only allowed to execute.


    Like the `<location>` tag that allows the lockdown of configuration settings at
    a machine level, code access security and the templates used to apply its permissions
    are ideal in shared server environments in which you want to allow users to create
    their own ASP.NET applications, but want to be able to choose which actions can
    be taken by code written by different users.


    # Security Resources


    The following are some URLs to keep handy when securing your application.


    +   http://www.microsoft.com/technet/security This is the starting point for finding
    security-related information for Windows, IIS, and other Microsoft products. There
    is a host of good information on improving the security of your servers and applications
    to be found here.'
