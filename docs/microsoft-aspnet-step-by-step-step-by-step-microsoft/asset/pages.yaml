    one of the advantages of the .NET platform, which is improved consistency of operations
    from language to language. This consistency can make it easier for developers
    to work in multiple languages without facing a steep learning curve.


    # note


    When you''re developing controls using Visual Studio .NET, many of the most commonly
    used assemblies are referenced for you automatically by the IDE. This means that
    when you issue a Build command, the IDE does not need to explicitly tell the compiler
    to reference these assemblies. The IDE has taken care of it already. The assemblies
    referenced for a Web Control Library project are System, System.Data, System.Drawing,
    System.Management, System.Web, and System.Xml.


    If you use from other assemblies, you will need to add a reference to the assemblies.
    You can do this by right-clicking the References in the Solution Explorer and
    clicking Add Reference, or by selecting Add Reference from the Project menu. Either
    one opens the Add Reference dialog, which allows you to select .NET or COM components
    or projects to reference and browse to find assemblies or components not listed.
    (Only .NET assemblies that have been placed in the Global Assembly Cache and COM
    components that have been registered are listed.)


    Note that if you add a reference to a COM component, Visual Studio .NET will create
    a Runtime Callable Wrapper (RCW) for the component automatically.


