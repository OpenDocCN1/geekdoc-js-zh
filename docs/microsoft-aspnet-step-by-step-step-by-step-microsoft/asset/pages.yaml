  md: '# Server-Side Forms, Postbacks, and ViewState


    The term postback describes the ability of an ASP.NET page to make an HTTP POST
    request to itself, usually in response to a user clicking a button control or
    interacting with another server control that initiates a postback. Postbacks are
    very useful because they allow a single page to both display UI elements, such
    as form fields for a user to fill in, and process the data entered by the user.
    The page developer can check the page-level IsPostBack property to determine whether
    the current request is of a postback, and then take appropriate action.


    By default, server controls such as the TextBox and DropDownList controls automatically
    save their state from request to request using the viewstate facility built into
    ASP.NET.


    Both postback and viewstate facilities require the use of a server-side <form>
    function. HTML controls and Web controls may be added to Web Forms pages without
    a server-side <form> element wrapping the controls, and the controls will still
    function and can be manipulated programmatically. But these controls will not
    be able to participate in postbacks, nor will they be able to save their state
    in the page''s viewstate. For this reason, when using server controls, most often
    you''ll want to wrap the controls in a server-side <form>.


    # Adding a Custom Server Control to the Page


    Custom server controls use essentially the same tag syntax as user controls, but
    a slightly different form of the @Register directive to make the custom control
    available to the page. Whereas the @Register directive for a user control contains
    TagPrefix and Name attributes to specify the tag that will be used to invoke the
    user control, and an Src attribute that points to the .ascx file containing the
    user control, the @Register directive for a custom server control contains only
    the TagPrefix attribute, while the tag name for the control is supplied by the
    class name of the class that defines the server control. The location of the custom
    server control is supplied by an Assembly attribute containing the name of the
    compiled'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'assembly containing the control definition. This assembly must reside either
    in the Web application''s bin subdirectory or the global assembly cache. The @
    Register directive for a custom server control also requires a Namespace attribute
    with the namespace that contains the custom control.


    Assuming you had a custom server control with a class name of MyControlClass in
    a namespace called MyNS in an assembly called MyControl.dll, the @ Register directive
    for the control would look like the following:


    ```

    <@ Register TagPrefix="MyPrefix" Namespace="MyNS"

    Assembly="MyControl" %>

    ```


    The tag used to invoke the control would look like the following:

    <MyPrefix:MyControl id="MyControlID" runat="server"/>


    For more information on the standard server controls included in ASP.NET, refer
    to Chapter 10. Creating and using custom server controls is covered in much greater
    detail in Chapter 12.


    # Event Handling


    One of the biggest differences between classic ASP and ASP.NET is the execution
    model. In classic ASP, pages were executed in a top-to-bottom fashion. That is,
    with the exception of detours to execute functions in the page, classic ASP pages
    were procedural rather than event-driven, like Visual Basic programs.


    ASP.NET changes that by bringing event-driven programming to Web development through
    server controls and postbacks. At runtime, the code in a Web Form, as well as
    in code-behind class associated with that Web Form, is compiled into an assembly.
    When executed, the code in that assembly fires events that you can handle, both
    exposed by the Page class and those that are fired by server controls that have
    been added to the page.


    Some events, as those fired by the page, are fired automatically as certain stages
    of page processing occur. Others, those associated with server controls, are actually
    triggered on the client (such as a user clicking a button server control) but
    are fired and handled on the server when the page is posted back to the server.
    Because the page is reloaded and the control state is restored with each postback,
    to the client it appears as though the page is throughout the client''s interaction
    with it, and the application appears to operate much like a Visual Basic form-based
    application.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Page Processing Stages


    A Web Forms page goes through the following processing stages:


    +   - *Init* Page and control settings are initialized as necessary for the request.

    -* *LoadViewState* Server control state that was saved to viewstate in an earlier
    request is restored.

    -* *LoadPostData* Any data returned in server form fields is processed, and the
    relevant control properties are updated.

    -* *Load* Controls are created and loaded, and control state matches the data
    entered by the client.

    -* *RaisePostDataChangedEvent* Events are raised in response to changes in data
    from the previous request to the current request.

    -* *RaisePostBackEvent* The event that caused the postback is handled, and the
    appropriate server-side events are raised.

    -* *PreRender* Any changes that need to be made prior to rendering the page are
    processed. Any processing after this point will not be rendered to the page.

    -* *SaveViewState* Server control state is saved back to the page’s viewstate
    prior to tearing down the controls.

    -* *Render* Control and page output is rendered to the client,

    -* *Unload* The page and its constituent controls are removed from memory on the
    server.


    Of these stages, you can add page-level event handlers for the *Init*, *Load*,
    *PreRender*, and *Unload* events. These handlers are typically named *Page_Init*,
    *Page_Load*, *Page_PreRender*, and *Page_Unload*, respectively. For other stages,
    such as the *LoadViewState*, *SaveViewState*, and *Render* stages, you can override
    the appropriate method to customize the processing of these stages. Overriding
    these methods is discussed in Chapter 12.'
  merge: -1
  pgno: 260
