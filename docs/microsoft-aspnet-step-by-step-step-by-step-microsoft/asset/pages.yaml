  md: '# ASP.NET Step by Step


    ![](img/50a47de1541381ea3363945ae9c22411_103_0.png)


    On the third page of the wizard, shown in the following figure, enter or browse
    to the path for the file system folder that will contain the files in the application.
    If this folder doesn''t exist yet, create it now. Content folders for virtual
    directories or application roots under the default Web site are most commonly
    stored in the \NetPub\wwwroot folder, which is usually located on the C: drive.
    While it is possible to put your content anywhere within the file system, keeping
    your content folders under \NetPub\wwwroot makes it easier to keep track of all
