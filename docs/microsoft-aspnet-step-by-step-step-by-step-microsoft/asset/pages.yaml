- img_proc: true
  md: '# Tracing and Debugging ASP.NET Applications


    +   In this chapter, you will learn about

    * Tracing

    * Debugging

    * Using the .NET Framework SDK debugger


    This book has covered a wide variety of topics related to ASP.NET development.
    Hopefully, you''ll be able to avoid too many problems while developing your ASP.NET
    Web applications. Inevitably, however, there will be times when your code doesn''t
    do what you expect it to, or you''ll run into errors or problems that prevent
    your application from working. This final chapter will look at what to do when
    that happens. It''s not intended to make you an expert debugger, but rather to
    give you an overview of the tools available for debugging in ASP.NET.


    To say that classic ASP did not offer developers much support for debugging their
    applications would be a colossal understatement. Despite being a very simple and
    productive development environment, classic ASP left a lot to be desired in terms
    of debugging and error messages.'
  merge: -1
  pgno: 480
- img_proc: true
  md: 'For example, in classic ASP there was no convenient way to access the state
    of the current HTTP request (apart from writing code in each application) to access
    and log, or write to the page, the contents of the Request.Headers or of the other
    collections, such as the QueryString or Forms collections. ASP.NET addresses this
    through a new feature called tracing, which is discussed in the first part of
    this chapter.


    Additionally, classic ASP error messages were often cryptic at best. If you were
    lucky, they told you the line of the ASP page where the error occurred. Unfortunately,
    this information could be misleading. The error might have occurred in a function
    called by that page, but you wouldn''t know from the error message. ASP.NET provides
    much richer error reporting than classic ASP, including a stack trace of the functions
    that led up to an error condition, making it easier to locate the root cause of
    the error.


    The .NET Framework SDK ships comes with its own debugger, so developers who are
    not using Visual Studio .NET can attach it to the process of the ASP.NET application
    and step through the code to find and fix problems. This improved reporting and
    the SDK debugger are discussed in the second half of this chapter.


    # Tracing


    As mentioned, one weakness of classic ASP was the lack of an easy way to get information
    about the current request. Apart from creating reusable files to write out the
    contents of the various collections of the request object, there was no simple
    method of making this information available. ASP.NET provides a solution in the
    form of tracing, which provides a substantial amount of information about requests
    that have been executed, either at the page level or the application level, as
    well as a way to get your own debug information without exposing it to the users
    of your application.


    # Enabling Page-Level Trace Output


    The simplest way to access trace information is through the Trace attribute of
    the @ Page directive. By adding the Trace attribute to any .aspx page, you can
    instruct ASP.NET to append the trace output for that page to the rendered content
    of the page. A portion of the trace output is shown in the following figure.'
  merge: -1
  pgno: 481
- img_proc: true
  md: '# Chapter 16 Tracing and Debugging ASP.NET Applications


    463


    ![](img/50a47de1541381ea3363945ae9c22411_482_0.png)


    The trace output includes such information as the cookies of the forms, cookies,
    and querying collections. Therefore, page-level tracing using the Trace attribute
    of the @ Page directive should be restricted to nonproduction systems because
    the output is visible to any client requesting that page. Although it is possible
    to use one of the configuration options detailed in the next section to ASP.NET
    to provide page-level trace output only for requests from the local system, it
    is probably best to stick to application-level tracing on publicly available applications.


    # Enabling Application-Level Trace Output


    In addition to providing trace output at the page level, ASP.NET can be configured
    to log trace output for a specified number of requests for later review. The primary
    advantages of this approach is that it hides trace output from users of the page,
    and that it allows its use on production or customer-facing systems, and that
    it allows tracing to be enabled for an entire site at once.


    Application-level tracing is enabled by adding the <trace> section to the Web.config
    file for the application and setting its attributes to the desired values. The
    following list shows a <trace> section that enables application-level tracing
    and tells ASP.NET to log the last 40 requests. (Logged requests must be cleared
    manually when the request limit has been reached.) The attributes for the <trace>
    section are detailed in Chapter 7.'
  merge: -1
  pgno: 482
- img_proc: true
  md: "# Web.config Containing a <trace> Section\n\n```\n<configuration>\n  <system.web\
    \ enabled=\"true\">\n    <trace traceMode=\"SortByCategory\"\n      requestLimit=\"\
    40\"\n      pageOutput=\"false\"\n      localOnly=\"true\"/>\n  </system.web>\n\
    </configuration>\n```\n\nTo allow access the logged trace output, ASP.NET provides\
    \ an HttpHandler that is mapped to a special URL called trace.axd. Appending trace.axd\
    \ to the base URL for the application will display the list of currently available\
    \ traces, as shown in the following figure. Clicking the View Details link for\
    \ a particular trace displays its output. Clearing the current trace link clears\
    \ all current entries from the trace log and allows more to be logged.\n\n![](img/50a47de1541381ea3363945ae9c22411_483_0.png)\n\
    \n# Writing to the Trace Output\n\nAt one time or another, most developers who\
    \ have ever tried debugging a classic ASP application have resorted to using Response.\
    \ Write to output the value of variables to the page, or for placing flags within\
    \ their code to determine where the code is breaking by seeing how much of the\
    \ page gets before execution is halted. This was (and still) a very useful technique\
    \ for debugging, it is only useful for development machines that are not accessible\
    \ by users. And many of the aforementioned developers have gotten calls from their\
    \ supervisors"
  merge: -1
  pgno: 483
- img_proc: true
  md: '# Chapter 16 Tracing and Debugging ASP.NET Applications


    they forgot to take the Response.Write statements before migrating a page to a
    production server.


    > important

    The page level setting for trace functionality will override the setting in Web.config.
    So even if you have tracing enabled in Web.config, setting the trace attribute
    of the @ Page directive to False will still disable tracing for that page. Likewise,
    if tracing is disabled at the application level in Web.config, setting the page-level
    trace attribute to True will still enable tracing for that page. For this reason,
    if you use page-level tracing, you should always double-check your pages before
    publishing them to a public server to ensure that the trace attribute for each
    page has been removed or set to False.


    ASP.NET''s trace functionality solves this problem by allowing developers to write
    to the trace output, instead of writing to the page output. Assuming page-level
    trace output has not been enabled, this prevents end-users from seeing the trace
    statements written by the developer.


    > important

    Enabling tracing for a page or for an application does carry some performance
    overhead. Even though the ASP.NET trace functionality makes it possible to leave
    tracing enabled without trace output being viewed by end-users, when performance
    is important, it is a good idea to disable tracing for an application at both
    the page and application level.


    The trace output is exposed to developers via the TraceContext class, which is
    available from the Page.Trace property (which can be accessed within a page simply
    by Trace, since the Page is assumed). There are two methods for writing to the
    trace output, Trace.Write and Trace.Warn.


    # Determining If Tracing Is Enabled


    To keep developers from wasting time attempting to write to the trace output when
    tracing is not enabled, the TraceContext exposes a boolean property IsEnabled,
    which contains the current status of tracing for the page.


    This is especially helpful if you are performing expensive processing or database
    lookups as a part of your trace logging.'
  merge: -1
  pgno: 484
- img_proc: true
  md: "# Using Trace.Write\n\nThe Trace.Write method of the TraceContext class is\
    \ overloaded, and it can be called in one of the following three ways:\n\n```\n\
    Trace.Write(message)\nTrace.Write(category, message)\nTrace.Write(category, message,\
    \ errorInfo)\n```\n\nmessage is a string containing the message to be written\
    \ to the trace output. category is a string containing a description of the message\
    \ (variable, statement, or whatever the developer desires as a category). And\
    \ errorInfo is an exception object, which allows exceptions to be logged to the\
    \ trace output. The category and errorInfo parameters allow developers to set\
    \ up sophisticated application-wide tracing by defining specific categories of\
    \ logged information and using them consistently across an application.\n\nThe\
    \ following listing shows the code for a page that tests if tracing is enabled\
    \ for the page, and then writes a simple message to the trace output.\n\n# Trace.Write.aspx=\"\
    Trace=\"true\" %>\n\n```\n<@ Page Language=\"VB\" Trace=\"true\" %>\n<html>\n\
    <head>\n<script runat=\"server\">\n  Sub Page_IsEnabled()\n    If Trace.IsEnabled\
    \ = True\n      Label1.Text = \"Writing Hello from Page!\" to Trace Log...\"\n\
    \    End If\n    Trace.Write(\"Hello from Page!\")\n  End Sub\n</script>\n</head>\n\
    <body>\n  <asp:label id=\"Label1\" runat=\"server\"/>\n</body>\n</html>\n```\n\
    \nThe following figure shows the output of this page."
  merge: -1
