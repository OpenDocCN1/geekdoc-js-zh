  md: '# ASP.NET Development Overview


    In this chapter, you will learn about about


    +   * The types of ASP.NET applications and how they map to Visual Studio .NET
    projects

    * The file types used in ASP.NET applications and what each one is used for

    * The available languages for developing ASP.NET applications and why you might
    use one over another


    In the last chapter, you learned about using some of the development tools available
    for creating ASP.NET applications. This chapter will delve further into ASP.NET
    development. We''ll also spend some more time looking at Visual Studio .NET and
    identifying its parts and features so you''ll be familiar with them as you read
    later chapters.


    # ASP.NET Project Types


    There are two basic types of ASP.NET applications, each with a distinct purpose.
    For a Web application that will provide its own HTML-based UI, there are ASP.NET
    Web applications. For Web-based functionality that is to be accessed programmatically,
    there are ASP.NET XML Web services. Both of these application types can be developed
    with or without Visual Studio .NET, although the Visual Studio environment makes
    developing each type of application easier and faster. The following figure shows
    the ASP.NET Web application and ASP.NET XML Web service project templates for
    Visual Basic .NET.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# ASP.NET Step by Step


    ![](img/50a47de1541381ea3363945ae9c22411_51_0.png)


    # # ASP.NET Web Applications


    ASP.NET applications, at their simplest, are much like classic ASP applications.
    A simple ASP.NET application consists of the following things:


    +   - A virtual directory in IIS, configured as an application root, to hold the
    files that make up the application and to control access to the files


    +   - One or more .aspx files


    +   - A Global.asax (analogous to the Global.asa file in classic ASP) to deal
    with Session and Application start-up and clean-up logic (optional)


    +   - A Web.config file used to store configuration settings (new in ASP.NET and
    optional)


    For Visual Studio .NET users, the good news is that all of the preceding files
    are created for you when you create a new Web project.


    # ## ASP.NET Web Forms


    Web Forms are an important part of any ASP.NET Web application. Put simply, they
    are ASP.NET pages that use ASP.NET Server Controls. The Web Forms pro-programming
    model makes it possible (and relatively easy!) to develop Web-based applications
    in the same way that today''s Visual Basic programmers develop Windows-based applications
    that have a graphical user interface (GUI).


    Web Forms in Visual Studio .NET allow you to create rich, interactive applications
    simply by dragging and dropping controls onto a page and writing minimal code
    to handle user interaction, events, etc. In addition, the Visual Studio'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Chapter 3 ASP.NET Development Overview 33


    .NET environment lets you work on your pages visually, using the Web Forms Designer,
    or textually, using Visual Studio .NET''s powerful source-code editor.


    The code that you write in your Web Forms can be written in one of two ways: inline
    in the .aspx file (as is typical of a classic ASP page), or using a code-behind
    module. While it''s possible to write your application with the actual .aspx file
    and still take advantage of compiled code and the other improvements of .NET,
    it''s recommended that you get in the habit of using code-behind modules.


    # Code-Behind


    Code-behind is a new feature in ASP.NET that allows developers to truly separate
    the HTML UI code from the code in Visual Basic .NET, C#, or other languages that
    is used to provide user interaction, validation, etc. There are a number of advantages
    to using code-behind modules, including the following features.


    +   - Clean separation of HTML and Code-behind allows HTML designers and developers
    to do what they do independently, while minimizing the possibility of messing
    up one another''s work (something that happens too frequently when developing
    classic ASP applications).

    - Easier reuse Code that isn''t interspersed with HTML in an .aspx page can be
    more easily reused in other projects.

    - Simpler maintenance Because the code is separated from the HTML, your pages
    will be easier to read and maintain.

    - Deployment without source code Visual Studio .NET projects using code-behind
    modules can be deployed as compiled code (in addition to the .aspx pages), allowing
    you to protect your source code if you wish. This can be very useful if you''re
    creating applications for clients but wish to retain control of your intellectual
    property.


    All in all, it''s worthwhile to get into the habit of using code-behind. You''ll
    see examples of the use of code-behind throughout the book. Part IV of the book
    will discuss Web Forms in detail.


    # ASP.NET XML Web Services


    While no one deny that Web applications created with ASP.NET (or even with classic
    ASP) can be very useful, one of the things that has long been missing is an easy
    way to provide programmatic functionality over the Internet or an intranet without
    tying the client to a specific UI. This is where ASP.NET Web services come in.


    An XML Web service, at its simplest, is a chunk of programming code that is accessible
    over the Web. XML Web services are based on the World Wide Web


    ![](img/50a47de1541381ea3363945ae9c22411_52_0.png)'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'Consortium''s (W3C) SOAP specification. This allows computers on varying platforms,
    from Windows servers to UNIX workstations, to offer and consume programmatic services
    over the HTTP protocol.


    > note\ SOAP can use other protocols, such as FTP or SMTP, but HTTP is the most
    common protocol used with SOAP and XML Web services because most firewalls allow
    communication via the HTTP protocol.


    ASP.NET makes it remarkably easy to implement XML Web services. In fact, all it
    takes is adding a declaration to any methods you wish to make available as XML
    Web services. Visual Studio makes it even easier by taking care of all the work
    necessary to make your XML Web service available to potential clients. Part V
    will discuss XML Web services in detail.


    # ASP.NET File Types


    There are a new of file types you''ll see in ASP.NET applications. To avoid any
    confusion, let''s take a minute to go over the ones you''ll see most often and
    discuss how they''re used.


    +   - .aspx The extension you''ll see most often is .aspx. It''s used for Web
    Forms pages, and it is analogous to the .asp extension in classic ASP.

    - .ascx The extension used for Web Forms user controls is .ascx. User controls
    provide one of the many ways available in ASP.NET to reuse code. They''re somewhat
    similar to the include files in classic ASP, in that they can be as simple as
    a few HTML tags or include complex logic that the author might want to reuse in
    many pages. User controls are added to Web Forms using the @ Register directive,
    which is discussed in Part IV.

    - .asmx The extension used for files that implement XML Web services is .asmx.
    XML Web services may be accessed directly through .asmx files, or the .asmx file
    can direct the request to a compiled assembly that implements the Web service.

    - .vb The extension for Visual Basic .NET code modules is .vb. All Web Forms pages
    (.aspx) added to a Visual Studio .NET application that are written in Visual Basic
    .NET will have a corresponding .vb code-behind module with the same name as the
    Web Form page to which it''s related.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Chapter 3 ASP.NET Development Overview 35


    +   - cs The extension for C# modules is .cs Like the .vb extension, Web Forms
    pages (.aspx) added to a C# Studio .NET application will have a corresponding
    .cs code-behind module with the same name as the Web Form page to which it relates.


    +   - Global.asax Like Global.asax in classic ASP, Global.asax is a file used
    to define Application and Session-level variables and start-up procedures. Note
    that while Global.asax can be structured like Global.asax, with start-up procedures
    such as Session_OnStart (Session_Start in ASP.NET) coded directly in the Global.asax
    file in a <script runs="server">- block, Visual Studio implements these procedures
    in a .vb (or .cs) code-behind rather than in the Global.asax file itself.


    In addition to the functionality available in a classic ASP Global file, ASP.NET
    allows you to import namespaces, link to assemblies, and perform other useful
    tasks. You''ll learn more about Global.asax in Chapter 5.


    +   - Web.config is a new file type in ASP.NET. To solve one of the major hassles
    with classic ASP applications: configuration. The Web.config file is a human-
    and machine-readable XML file that stores all of the configuration settings for
    a given application (or segment of an application). Web.config files are interpreted
    hierarchically; that is, a Web.config file in a subdirectory of your application
    will override the settings of the Web.config file(s) in its parent directories.
    The advantage is that configuration settings can be inherited where that is desirable,
    but you also have granular control over configuration.


    # Languages Used in this Book


    Although there are several languages to choose from in the Microsoft .NET Framework
    SDK and Visual Studio .NET, this book will concentrate primarily on Visual Basic
    .NET and C#. Most code samples will be presented in Visual Basic .NET, but alternate
    examples using C# will be presented where there are important differences between
    Visual Basic and C# syntax. This section will help you decide which language is
    best for you.


    # Visual Basic .NET


    If you''ve worked with Visual Basic or Visual Basic Scripting Edition (VBScript)
    but don''t have experience with C, C++, you''ll be most comfortable working in
    Visual Basic .NET. Although there have been substantial changes to the language
    since Visual Basic 6.0, Visual Basic .NET is similar in syntax. This'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# ASP.NET Step by Step


    book isn''t intended to be a language tutorial for Visual Basic .NET, but we''ve
    made the effort to point out where there are significant differences between the
    syntax of Visual Basic .NET and its predecessor.


    Historically, Visual Basic has not been considered an object-oriented or low-level
    language, but its longtime critics will be happy to know that the Visual Studio
    .NET release of the language includes full implementations of inheritance and
    threading. However, in keeping with the tradition of Visual Basic being OS-safe,
    Visual Basic .NET doesn''t allow unsafe operations such as memory manipulation.
    Certainly, hardcore low-level enthusiasts will consider this limiting, but ease
    of use is a good reason to consider this language for most standard applications.


    # C#


    If you''ve worked with C, C++, JavaScript, or Java, you may be most comfortable
    with C#. Like Java, C# is derived from C and C++, so you should have no trouble
    becoming productive in C# in fairly short order. Unlike C and C++ (and, to an
    extent, Java), the C# learning curve isn''t terribly steep, so developers who
    are familiar with Visual Basic wish to take a look at C# as well.


    Unlike Visual Basic .NET, C# does allow you to work with unsafe code (pointers
    and memory manipulation, and so on), although this isn''t recommended for beginners.
    After all, it''s not called unsafe code for nothing! If you need to perform direct
    memory access or work with legacy C or C++ modules, C# will be the bet-ter for
    you.


    # Working with Multiple Languages


    As noted in Chapter 1, an advantage of working within the Microsoft .NET Framework
    is that you''re not limited to a single language. If you want to do things that
    won''t work in your language of choice (or that can be implemented more easily
    in another language), you can always use a different .NET-enabled language to
    get around that limitation.


    For example, let''s say your primary language is Visual Basic .NET, but you need
    to access functionality in a DLL written in C. You can create a class library
    in C# to access the DLL, and then inherit from that class in Visual Basic .NET
    (or just use the class from Visual Basic .NET).'
  merge: -1
