    resides in a compiled class


    ```

    <@ WebService Class="NamespaceName.ClassName,AssemblyName" %>

    ```


    NamespaceName is the name of the namespace in which the class for the Web service
    resides, ClassName is the name of the class that contains the Web service methods,
    and AssemblyName is the name of the assembly that contains the compiled code for
    the Web service. This assembly should reside in the bin directory of the Web application
    in which the .asmx file resides. TheName portion of the Class attribute is optional
    if you not specified a namespace for your class, but it is good practice to always
    specify a namespace for your classes. The AssemblyName portion of the Class attribute
    is also optional, ASP.NET will search the bin directory for the assembly if no
    name is provided. However, you should always provide an assembly name to avoid
    the performance impact of doing the search first time the Web service is accessed.


    > note

    Unlike using code-behind with ASP.NET Web Forms, you cannot use the src attribute
    with a Web service. This means that you must precompile the code-behind class
    that is to be used as the basis for the Web service, either manually using the
    command-line compiler or by building a Visual Studio .NET Web Service application.


