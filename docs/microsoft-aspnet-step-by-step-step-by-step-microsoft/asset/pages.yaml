    # Access Control


    Access control is the process of determining who can access resources on your
    server. This includes both authentication (determining the identity of a user
    making a request) and authorization (determining whether that user has permission
    to take the action requested). For an ASP.NET application, there are several different
    authentication and authorization methods. You''ll learn how to implement authentication
    and authorization in ASP.NET later in this chapter.


    It is important not to forget that access control also includes physical access
    to the machine being secured. The best authentication, authorization, and password
    practices won''t help you bit if someone can gain physical access to a machine
    and circumvent your security barriers, or simply damage the machine beyond repair.
    Any machine that has value to you should be secured physically, as well as software,
    from unauthorized use.


    # Auditing and Logging


    As mentioned earlier in this chapter, even the best security practices and strongest
    passwords cannot provide 100 percent protection against attacks. For this reason,
    it is imperative to enable auditing and logging on exposed servers.


    Auditing is the process of monitoring certain activities, such as login attempts,
    for success or failure, and then logging the results of this monitoring to the
    Windows event log. Auditing (and proper monitoring of the logs) allows you to
    determine when someone is attempting to attack your machine, such as by trying'
