  pgno: 300
- img_proc: true
  md: '# note


    The <style> block that you defined takes care of formatting for the Panel controls
    by defining the desired style for the <div> HTML element. Note that since the
    Panel control is rendered as a <div> on Internet Explorer and as a <table> element
    on Netscape and other non-Internet Explorer browsers, you may need to find other
    way to do the formatting if you want cross-browser compatibility.


    One way to accomplish this is through browser sniffing. The Request object exposed
    by the Page class has a Browser property that provides information on the browser
    making the current request. By querying the Browser property (and its subproperties),
    you can perform a simple if statement that links to one style sheet if the browser
    is IE, and to another style sheet if it is another browser.


    # AdRotator


    The AdRotator control is used to display a random selection from a collection
    of banner advertisements specified in an XML-based advertisement file. The advertisement
    file contains an <Ad> node for each specified advertisement. This node contains
    nodes that configure the path to the image for display the ad, the URL to navigate
    when the ad is clicked, the text to be displayed when/if the image is not available,
    the percentage time the ad should come up in rotation, and any keyword associated
    with the ad. (Keywords can be used to filter ads, allowing the use of a single
    advertisement file with multiple AdRotator controls and providing each control
    content.)


    # note


    The random selection for the AdRotator control will be identical for any AdRotators
    on the page that have identical attributes. You can take advantage of this by
    using the AdRotator control to display a random selection of header/footer information
    that you want to be the same for both header and footer.


    To use this control from a Web Form, follow these steps:


    +   Create a new file and save it as AdRotator.aspx.


    +   Add the @ Page directive, standard HTML elements, and an HtmlForm control
    to the page.


    ```

    <@ Page Language="vb" %>

    <html>

    ```'
