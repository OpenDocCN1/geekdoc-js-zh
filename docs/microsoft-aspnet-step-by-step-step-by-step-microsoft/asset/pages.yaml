  md: '# Chapter 8 Security in ASP.NET 195


    > note

    To download and install the Passport SDK and use Passport authentication on your
    site, you will need to register on http://www.passport.com/business and pay a
    license fee.


    # Using Forms-Based (Cookie) Authentication


    Forms-based authentication (which was called cookie authentication in ASP.NET
    Beta 1) allows developers to easily implement "roll-your-own" security in their
    applications. Whereas in classic ASP you would need to add a file or component
    to every page to look for an authentication cookie, then redirect to a login page
    if the cookie didn''t exist, ASP.NET Forms-based authentication takes care of
    all this for you.


    All you need to do is create the login page, tell ASP.NET where to find it (via
    settings in Web.config), and set the authorization restrictions. In your login
    page, you can verify the username and password credentials entered by the user
    against a database, Windows 2000 Active Directory, or another credential store
    of your choice. Once you''ve verified the user''s credentials, you can use the
    methods exposed by the FormsAuthentication class to remove an authentication cookie,
    redirect the user to the original page requested, or renew the authentication
    cookie.


    > important

    In Forms-based authentication, the username and password are sent as clear text.
    To ensure the security of this information, you should always use an SSL-enabled
    connection for your login page.


    Let take a look at an example. First use the following steps to create a new IIS
    virtual directory and add a test page and a login page to it:


    +   1 Create a new virtual directory called Chapter8 in IIS. (See Chapter 2 for
    directions on how to do this) Leave the Internet Services Manager open for now.

    2 Create two new files in the physical directory associated with the virtual directory:
    test.aspx and login.aspx. The content of both of the files is shown in the following
    listing.'
