- img_proc: true
  md: 'Misuse of Application.Lock() The Application.Lock() method prevents access
    to all application values for any user than the user whose request resulted in
    the call to Application.Lock(). This continues until the Application.Unlock()
    method is called. You should minimize the time that these values are locked by
    calling Application.Lock() immediately prior to updating a value and calling Application.Lock()
    immediately afterward.


    Storing references to single (or apartment) threaded objects Storing references
    to non-free-threaded objects at application or session level can interfere with
    IIS thread management capabilities and can result in scalability problems. Avoid
    storing non-free-threaded objects at application or session level.


    In-process session state In order to scale a Web application beyond a center point,
    it is often necessary to use a Web farm to allow multiple servers to handle requests.
    In-process session state, the default, is not available to all servers on a Web
    farm. To use session state with a Web farm, you should set your application''s
    Session mode to either “StateServer” or “SQLServer” as described in the next section.


    Overuse of session or application state Storing numerous object references or
    large datasets at the application level, and particularly at the session level,
    can rapidly exhaust the physical memory on a Web server, causing it to substitute
    virtual memory for storing additional information. This can have a dramatic effect
    on the performance of an application. You should always ensure that any application
    state (and more importantly, session state) will not exceed the physical memory
    resources available on the Web server. Also remember that other applications will
    be using some of these resources.


    # Configuring Session State


    ASP.NET provides several possibilities for storing session state. Each is designed
    to overcome one or more of the limitations of session state in classic ASP. The
    available settings include the following:


    +   - In-process (InProc) This is the default setting. Its behavior is essentially
    the same as in classic ASP.


    +   - Out-of-process (StateServer) This setting specifies that session state will
    be stored by a server process running the ASP.NET NT service. The state server
    to connect to it is specified by an attribute, as described in the section “Storing
    Session State Out-of-Process.”'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'SQL Server (SQLServer) This setting specifies that session state will be stored
    in a SQL database. The SQL Server to connect to is specified by an attribute,
    as described in the section "Storing Session State in SQL Server" on page 111.


    Cookeless Sessions This setting allows you to maintain session state for users
    whose browsers cannot handle cookies.


    The following sections describe how to configure each of these settings.


    # Storing Session State In-Process


    By default, Web applications, created within Visual Studio .NET or created manually,
    will store session state in-process. As noted, this has several inherent limitations,
    including lack of scalability and durability. For applications requiring neither
    scalability beyond a single server nor durability of state across server restarts
    or crashes, however, this setting may work just fine. And it''s the simplest to
    do because it doesn''t require any changes to the application configuration file.


    # Storing Session State Out-of-Process


    The first solution to the problems of scalability and durability for session state
    is to store session state out-of-process in a dedicated ASP.NET state process
    provided by an NT service. One advantage of this method is that the ASP.NET state
    service can serve requests from multiple servers, making it possible to scale
    session state across a Web farm. Another advantage is that the ASP.NET state service
    runs in a separate process (or even on a separate machine), so state information
    can survive restarts or crashes of a specific Web application process. Note that
    session state information stored by the ASP.NET state service does not survive
    a restart or crash of the machine on which it''s running.


    To store state out-of-process follow these steps:


    +   1. Open the Web configuration file for your application and locate the sessionState
    configuration section.


    +   2. Change the mode attribute from "InProc" to "StateServer".


    +   3. Modify the connectionString attribute so that it reflects the server name
    (or IP address) of the state server and the port that the ASP.NET state service
    is monitoring (by default, it is 42424).'
  merge: -1
  pgno: 128
- img_proc: true
  md: '4 The complete sessionState configuration section that uses the ASP.NET state
    service on the local machine would look like the following code. (Note that the
    sqlConnectionString attribute, which is not used in this example, and the codeless
    and timeout attributes have been omitted. The full list of attributes is available
    in Chapter 7.)


    ```

    <sessionState

    mode="stateserver"

    connectionString="tcpip=127.0.0.1:42424/>

    ```


    5 Start the Services Management Console (MMC) snap-in by clicking Start, Programs,
    Administrative Tools.


    6 Start the ASP.NET state service on the desired server for the Services MMC snap-in.


    ![](img/50a47de1541381ea3363945ae9c22411_129_0.png)


    ASP.NET will automatically connect to the specified state server to store session
    state for your application. If the state service on the specified server is not
    running, you will receive an error message.


    Keep in mind that although storing session state in a dedicated server process
    can improve the overall scalability of your application, there are inherent performance
    implications of moving session state out of process. Retrieving information from
    a different process (and especially from a different machine) is significantly
    more costly than retrieving it from within the same process. You should test the
    impact on the type and amount of session data you plan to store before implementing
    this type of session storage in a production application.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# # Storing Session State in SQL Server


    The second solution to the problems of scalability and durability for session
    state is to store it out-of-process in a SQL Server database. One advantage of
    this method is that the specified SQL Server can receive requests from multiple
    servers, making it possible to scale state across a Web farm. Also, the session
    state is stored in a SQL Server database, so state information can survive restarts
    or crashes of any Web application process, any Web server, or even the SQL Server
    itself.


    To store session state in SQL Server follow these steps:


    +   1. Set up the SQL Server session state database by running the InstallSqlState.sql
    batch (located in the .NET Framework directory, by default %windir\Microsoft.Framework\version%)
    against the SQL Server you plan to use. (For information on running batch statements,
    check with your database administrator or the SQL Server Books Online.).

    2. Open the Web.config configuration file for your application and locate the
    sessionState configuration section.

    3. Change the mode attribute from "InProc" to "SQLServer".

    4. Modify the sqlConnectionString attribute so that it reflects the IP address
    of the desired SQL Server and the user ID and password used to access the SQL
    Server.

    5. The complete sessionState configuration section that uses a SQL Server on the
    local machine would look like the following (note that the stateConnectionString
    attribute and the cookeless and timeout attributes have been omitted).


    ```

    <sessionState

    mode="SQLServer"

    ConnectionString="data source=127.0.0.1;user id=;password="/>

    ```


    > note

    There are security implications to placing the SQL Server user ID and password
    in the connection string in Web.config. A better practice, where possible, is
    to use a trusted connection to SQL Server. Chapter 11 describes the steps necessary
    to use a trusted connection with SQL Server, as well as other connection techniques.
    Chapter 8 further explores the topic of security in ASP.NET, including good practices
    for storing connection string information.'
  merge: -1
