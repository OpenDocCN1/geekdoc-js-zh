  md: "But if you edit several values, and then you realize that you want to roll\
    \ back one or more of the changes? Fortunately, the dataset provides robust support\
    \ for accepting and rejecting changes in its data by maintaining multiple versions\
    \ of the data for each row. Each row contains the following versions.\n\n+   -\
    \ Original This contains the data originally loaded into the row.\n\n+   - Default\
    \ This contains the default values for the row (if specified by the DefaultValue\
    \ property of the row's columns). If no defaults have been specified, this contains\
    \ the same data as Original.\n\n+   - Current This contains updated data for all\
    \ columns that have been updated, and the same data as Original for columns that\
    \ have not been updated.\n\n+   - Proposed After calling BeginEdit on a row and\
    \ before calling the EndEdit or CancelEdit methods of the DataRow, the Proposed\
    \ version contains changes to have not yet been applied to the Current version.\
    \ If CancelEdit is called, the Proposed version is deleted. If EndEdit is called,\
    \ the changes in the Proposed version are applied to the Current version.\n\n\
    You can determine whether or not changes have been made to an item in a row by\
    \ comparing the item's Original or Default version with the Current version.\n\
    \n```\nIf CurrentRow(1, DataRowVersion.Current) Is =\n    CurrentRow(1, DataRowVersion.Proposed)\
    \ Then\n    'Take appropriate action'\nEnd If\n```\n\nYou can accept or reject\
    \ changes to data on a row-by-row basis.\n\n```\nIf CurrentRow(0, DataRowVersion.Current)\
    \ = \"\" Then\n    'Blank field not allowed\n    CurrentRow.RejectChanges()\n\
    Else\n    CurrentRow.AcceptChanges()\nEnd If\n```\n\nFinally you can check the\
    \ current state of a row by checking the row's RowState property.\n\n```\nDim\
    \ CurrentState As String\nCurrentState = CurrentRow.RowState\nIf CurrentState\
    \ = DataRowState.Modified Then\n    'Take appropriate action\nEnd If\n```"
  merge: -1
