  md: '# Trace Output Sections (continued)


    | Section | Description |

    |---|---|

    | Cookies Collection | Displays the name, content, and size of all cookies sent
    as part of the request. |

    | Headers Collection | Displays a list of all HTTP headers sent as a part of the
    request. |

    | Form Collection | Displays a list of the names and values of all form fields
