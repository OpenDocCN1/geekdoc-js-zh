    ![](img/50a47de1541381ea3363945ae9c22411_474_0.png)


    # Deployment Options in Visual Studio .NET


    If you are developing Web applications with Visual Studio .NET, it is still possible
    to manually deploy your applications using XCOPY, WebDAV, etc. However, you will
    probably find that it is more efficient to take advantage of one of the built-in
    deployment features available in the Visual Studio .NET IDE. These include the
    copy project command, which provides a fast and simple method for copying a project
    from one machine to another or from one directory to another on the same machine,
    and the Setup and Deployment Projects type, which provides much more fine-grained
    control over how your application is deployed.


    # Using Copy Project to Deploy a Web Application


    The copy project command, which is accessed by clicking Project, Copy Project,
    allows you to copy just the files needed to run an application (only the .aspx
    files and related assemblies, plus any static content; code-base classes are not
    copied), all of the files in the project, or all of the files in the source project
    folder, whether they are part of the project or not.'
  merge: -1
