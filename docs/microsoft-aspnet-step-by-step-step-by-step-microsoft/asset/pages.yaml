  md: '# # Conventions Used in this Book


    Countless time can be saved when using this book if you take the time to understand
    how instructions, keys, notes, and so on are used *before* you start the first
    chapter. Please take a moment to read the following list, which shows the conventions
    for these and other elements.


    +   - Hands-on exercises for you to follow are given in numbered lists of steps
    (1, 2, and so on).

    - A plus sign between two key names means that you must press those keys at the
    same time. For example, Press Alt+Tab means that you hold down the Alt key while
    pressing the Tab key.

    - Notes labeled NOTE provide additional information or tips about a topic.

    - Notes labeled IMPORTANT alert you to essential information that you should check
    before continuing the chapter.'
  merge: -1
