  md: '# Setting Breakpoints


    Once you''ve loaded the source for a page and attached the necessary processes,
    you can step through your code by setting a breakpoint prior to the line of code
    on which the error occurs (if known) or on the first line of executable. Breakpoints
    halt execution of your code and allow you to check the value of local variables
    and step through your code.


    To set a breakpoint, click on the left border of the editor window next to the
    desired line of code. Alternatively, you can click Debug, New Breakpoint or press
    Ctrl+B to open the New Breakpoint dialog. This allows you to specify additional
    information about the breakpoint, such as conditions under which the break should
