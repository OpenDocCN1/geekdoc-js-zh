    Weak passwords make it much easier for someone trying to guess the password for
    an account. So-called dictionary attacks use a dictionary of common terms or words
    to rapidly attempt to log in to an account. Brute force attacks attempt every
    possible value until they find the correct one. While a strong password won''t
    necessarily eliminate brute force attacks, it can increase the time needed for
    an attack to succeed. In combination with appropriate auditing and logging, this
    can give you time to deal with the attack.


    Strong passwords meet minimum requirements for length and complexity. You can
    require secure passwords using a security template, such as the hisecweb.inf template,
    using the Security Configuration and Analysis tool described earlier in this chapter.
    The hisecweb.inf template sets minimum and maximum password age, enforces password
    history (preventing users from reusing old passwords), sets minimum password length
    to eight characters, and requires passwords to meet minimum complexity requirements,
