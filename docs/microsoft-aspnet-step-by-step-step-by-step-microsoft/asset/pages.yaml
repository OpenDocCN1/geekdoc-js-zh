- img_proc: true
  md: '# ASP.NET Step by Step


    There are five possible row states.


    +   - Added represents a row that has been added to the table prior to AcceptChanges
    being called. Once AcceptChanges is called, this row''s RowState will be set to
    Unchanged.

    - Deleted represents a row whose Delete method has been called.

    - Detached represents a newly created row that has not yet been added to a DataRowCollection,
    or a row that has been removed from a DataRowCollection but not destroyed.

    - Modified represents a row whose data has changed, but whose AcceptChanges method
    has not been called.

    - Unchanged represents a row whose data has not changed since the last call to
    AcceptChanges.


    Once you''ve called AcceptChanges on the dataset, you would call the Update method
    of the DataAdapter to load data into the dataset to update the underlying database
    with the new values. The AddTitle_TypedDS.aspx listing on page 328 for an example
    of using the Update method.


    # Typed Datasets


    One of the coolest features of ADO.NET is the ability to create strongly typed
    datasets. Typed datasets are special classes, generated by the Xsd.exe command-line
    utility, that use an XSD schema to create additional public properties and methods
    that allow you to access the columns of the dataset''s tables by name, rather
    than using either an index or a late-bound key. This can improve runtime performance
    and reduce the likelihood of errors in coding the dataset. Creating a typed dataset
    for the AddTitles example that was shown earlier just a few steps. The following
    example assumes you''ve already created an XSD schema for the table or tables
    in the dataset, which you can do with the WriteXmlSchema method of a dataset that
    has been loaded with data from the table or tables:


    +   - Open a command prompt at the location of the XSD schema file.

    - Create the class for the typed dataset, using the xsd.exe utility. The /d option
    specifies that we want to create a dataset, and the /n option specifies that the
    class should use the namespace AddTitle. AddTitle.xsd is the name of your XSD
    schema file, which is shown in the AddTitle.xsd listing.


    ```

    xsd.exe /d /l:vb AddTitle.xsd /n:AddTitle

    ```'
