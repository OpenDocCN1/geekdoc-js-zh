  md: '# Private vs. Shared Assemblies


    By default, all custom assemblies that you create are private and are made available
    to a Web application by placing them in the bin directory of the application,
    where they are loaded by ASP.NET automatically. Assemblies may also be shared
    across all clients on a machine by placing them in the GAC. Barring any security
    configuration in the assembly that prevents it, assemblies in the GAC may be used
    by any managed application on that machine.


    Private assemblies allow you to limit the use of an assembly to the application
    whose bin subdirectory the assembly resides. Shared assemblies allow you to reuse
    your assemblies in multiple applications without needing to maintain a copy of
    an assembly for each application that uses it.


    To install an assembly into the GAC, you need to give the assembly a strong name
    (signing it with a public key, which you can generate with sn.exe .NET Framework
    utility). Then add it to the GAC either using the gacutil.exe utility or by dragging
    and dropping the assembly into the %windir% folder, which will add the assembly
    to the GAC automatically.


    The GAC supports versioning of assemblies, so you can install multiple versions
    of the same assembly by setting its AssemblyVersionAttribute attribute. Clients
    can then specify which version of an assembly to load at runtime.


    # Registering Your Control


