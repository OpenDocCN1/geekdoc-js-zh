  md: '# note


    If you''re familiar with XML namespaces, you may notice the similarity between
    the tag prefixes used for Web controls, user controls, custom server controls,
    and XML namespaces. This is no coincidence, since the implementation of the tag
    syntax for server controls and user controls is based on XML namespaces.


    Likewise, user control and server control tags must also follow the syntax rules
    for XML tags, which require an opening and closing tag for any tag that contains
    text or child tags, such as the Label control, which allows you to set its Text
    property by placing the desired text between the opening and closing <asp:label>
    tags. A closing / in a single tag may be used for tags that do not contain text
    or child tags, such as the HtmlButton control.


    To add a TextBox control and two Label controls, follow these steps:


    +   Add the following tags to the server-side form of the ServerControls.aspx
    page created in the previous example:


    <asp:Label id="NameLabel" runat="server">Name: </asp:Label>

    <asp:TextBox id="NameTextBox" runat="server"/>


    Add another Label control just below the closing </form> tag. Set the id attribute
    to “HelloLabel”. The finished <body> section of the page should look like the
    following:


    <body>

    <form runat="server">

    <asp:Label id="NameLabel" runat="server">Name: </asp:Label>

    <asp:TextBox id="NameTextBox" runat="server"/>

    <input id="NameButton" type="submit" runat="server"/>

    </form>

    <asp:Label id="HelloLabel" runat="server"/>

    </body>


    +   Save the page, but don''t close it.

    Having this code, you can enter text in the TextBox control and submit the page
    by clicking the button. But you still must add code to process text entered in
    the textbox. See “Event Handling” on page 240 for more information.'
