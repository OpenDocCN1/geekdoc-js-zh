- img_proc: true
  md: '# Chapter 7 Configuring an ASP.NET Application


    In addition to syntax coloring and validation, Visual Studio .NET provides a default
    Web.config file for each new Web project that you create. This default file contains
    the most commonly used elements, as well as comments that explain the available
    options for each element. The default Web.config file is useful as a template
    for any additional Web.config files you want to place in subfolders of your Web
    application. Keep in mind that you''re using configuration files in subfolders
    of your application, it is a good idea to include the elements from the configuration
    settings from the parent file that you want to override. This helps prevent overriding
    a configuration setting by accident, and it may help reduce parsing overhead for
    the configuration of your application.


    # Editing the Master Configuration File


    Not only does the master configuration file, Machine.config, contain the default
    settings for all ASP.NET applications on the machine, but it has machine-wide
    configuration settings as well. Be cautious when editing this file. It is prudent
    to create a backup copy of the file before you edit it. Also keep in mind unless
    you''re the only one who uses the machine on you''re developing, any changes that
    you make to Machine.config will also affect other ASP.NET developers using the
    machine. Unless you dealing with unhappy colleagues, you should discuss any proposed
    changes with them first.


    # Configuring an ASP.NET Application


    At the time of this writing there are no GUI tools available for editing the Web.config
    files and modifying configuration settings. Fortunately, the default Web.config
    file created by Visual Studio .NET Applications, shown in the following figure,
    contains comments specific to the most commonly used settings. These comments
    provide guidance for using the available parameters for a given configuration
    element (although not all configuration elements appear in the default Web.config
    file).


    In addition to the comments found in the Web.config file generated by Visual Studio
    .NET, the Machine.config file also contains comments with specific settings for
    certain elements. These comments can guide you when you make configuration changes.
    These elements and their settings are described in “ASP.NET Configuration Elements”
    on page 123.


    ![](img/50a47de1541381ea3363945ae9c22411_140_0.png)'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# ASP.NET Web by Step


    ![](img/50a47de1541381ea3363945ae9c22411_141_0.png)


    # Overriding Configuration Settings for Subdirectories


    Once you''ve created the application-level Web.config file and modified its settings
    to suit your needs, you may want to modify the configuration settings for a subset
    of your application. For example, you may want to apply more stringent security
    requirements to a particular set of files. In ASP.NET, it''s simple to override
    the application-level configuration settings. It takes only the following three
    steps:


    +   Create a subfolder in your application, and place in it the content to which
    the new configuration settings will apply.


    +   Create a new Web.config file in the new folder.


    +   Add the configuration settings that you want to override to the new Web.config
    file.

    Include only the configuration settings that you want to override in the new Web.config
    file. All other settings are inherited from the Web.config file of the parent
    folder, or if that file does not exist (or doesn''t contain settings for all available
    configuration elements), from the Machine.config file for your server.


    # Locking Down Configuration Settings


    Clearly, there will be times when Web developers or administrators want to configure
    settings for an entire server or site, and prevent them from being overridden.
    This might be desirable in the case of authentication and authorization settings,
    or to prevent the overriding of security policy settings. Fortunately, ASP.NET
    provides the <location> tag for just this purpose.'
  merge: -1
