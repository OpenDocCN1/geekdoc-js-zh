  md: '@ Register or @ Reference directives, as is necessary with user controls (as
    well as with custom server controls, as you''ll see later in this section). This
    means that to use a server control, you need only add the appropriate tag to your
    page.


    # Adding an HTML Control to the Page


    HTML controls use the same syntax as client-side HTML elements, with one addition:
    the runat="server" attribute. So in order to add an HTMLInputButton (a server
    control that maps to the HTML input type="submit"> <input type="button">, or <input
    type="reset"> elements) to a page, follow these steps:


    +   1. Using your favorite text editor, create a new page in the same folder as
    the previous examples. Name the page ServerControls.aspx.


    +   2. Add the following code to the page:


    ```

    <@ Page Language="vb %>

    <html>

    <head>

    </head>

    <body>

    <form runat="server">

    <input id="NameButton" type="submit" runat="server"/>

    </form>

    </body>

    </html>

    ```


    +   3. Save the page, but don''t close it. You''ll use this page for further examples.
    By adding the runat="server" attribute to the HTML <input> element, you created
    a fully-fledged server control that can now be manipulated programmatically through
    server-side code. Note to make it easier to program against your controls, you
    should always give them an id attribute which specifies the name you''ll use to
    identify the control in server-side code. You''ve also added a server-side <form>
    to wrap your server control, which causes the page to be posted back to the server
    when the button is clicked.


    # Adding a Web Control to the Page


    Web controls use a slightly different syntax than HTML controls. It''s similar
    to the syntax used for adding a user control to the page declaratively, except
    that instead of defining your own tag prefix, all Web controls use the prefix
    asp. For example, the tag for adding a TextBox control to the page would be <asp:TextBox
    id="myTextBox runat="server"/>.'
