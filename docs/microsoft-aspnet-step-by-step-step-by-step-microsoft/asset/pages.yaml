    # Enabling Authentication


    As discussed earlier in this chapter, authentication is the process of validating
    the identity of the user making the request. ASP.NET applications work with IIS
    to carry out authentication based on one of several authentication types, which
    are discussed in the following section.


    Authentication and authorization in ASP.NET work hand-in-hand and operate on two
    distinct levels: the operating system/IIS level and the ASP.NET level. The next
    sections will discuss how these levels interact.


    # Selecting an Authentication Type


    There are three basic types of authentication available for ASP.NET applications:
    Windows-based, Passport, and Forms-based authentication. The authentication method
    you choose will depend on the types of clients you''re dealing with, the level
    of control you have over the client browser choice, and a number of other factors.
    The next sections will discuss the available methods, how they''re implemented,
    and why you might choose one particular method over another.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# important


    The interaction between IIS and ASP.NET in terms of authentication and authorization
    may be somewhat confusing If you''re inperienced with these features. Until you
    understand how the various options work, you should practice the techniques and
    procedures discussed in this section on a machine that is not exposed to the Internet
    or other potential sources of compromise.


    Requests for resources in an ASP.NET application go through two distinct levels
    of authentication: the IIS level and the ASP.NET application level. The type of
    authentication you choose determines which of these levels is used to determine
    whether the request is properly authenticated. As mentioned earlier, authorization
    occurs on two levels, so it is important to choose the appropriate authorization
    method for the authentication type you''re using.


    The authentication type is determined by the <authentication> tag in the Web.config
    file for an application. The syntax of the <authentication> tag is explained in
    Chapter 7.


    # Using Windows-Based Authentication


    In Windows-based authentication, ASP.NET relies on IIS to authenticate the incoming
    request using one of its available authentication methods:


    +   - Basic authentication This is compatible with most browsers, the password
    is sent in clear text. Use this only if you can protect the communication with
    SSL encryption.


    +   - Digest authentication This authentication method was introduced as a feature
    of HTTP 1.1, so it may not be supported by all browsers. It sends a hashed value
    instead of a clear-text password, make it more secure than basic authentication.
    This method requires a Windows 2000 Domain Controller. You have to store a clear-text
    version of the password on the Domain Controller used to validate the password,
    so the Domain Controller must be secured from physical and network intrusions.
    If Windows 2000 Domain Controller is available, this option will be unavailable,
    as seen in the Authentication Methods dialog box shown later in this chapter.


    +   - Integrated Windows (NTLM) authentication This is available only with Internet
    Explorer. It''s the most secure method because it never sends the username or
    password over the network. Use this method if you require your clients to use
    Internet Explorer to access your application. Note also that Integrated Windows
    authentication will not work over an HTTP proxy'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Chapter 8 Security in ASP.NET 193


    connection, which may make it impossible for clients on a corporate network using
    a proxy to log in to an application over the Internet. It also requires each person
    that logs on your site to have an NT account either on the Web server or on a
    domain controller trusted by the Web server.


    If more than one authentication type checkbox is checked, Digest and Integrated
    Windows authentication will always take precedence over basic authentication.


    Once IIS has authenticated the user, it passes the authenticated identity to ASP.NET,
    which can then use that information to allow or deny access to resources within
    the application. See “Authorizing Users and Roles” on page 201 for more information
    on this type of authorization.


    To change the authentication method used by IIS, follow these steps:


    +   1 Open Internet Services Manager.

    2 Right-click the site, virtual directory, or file for which you want to modify
    the authentication method. Select Properties.

    3 In the Anonymous access and authentication control section of the Directory
    Security tab (or the File Security tab for files), click the Edit button. This
    will open the Authentication Methods dialog.

    4 In the Authentication Methods dialog, uncheck the Anonymous access checkbox.
    Then check the checkbox for the desired authentication method, as shown in the
    following figure.


    ![](img/50a47de1541381ea3363945ae9c22411_212_0.png)


    +   5 Click OK to close the Authentication Methods dialog, and then click OK to
    close the Properties dialog for the resource you selected in step 2.'
  merge: -1
