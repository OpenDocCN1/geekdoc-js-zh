  md: '# BizTalk Server 2000


    BizTalk Server 2000 is one of the most important of the Enterprise Servers. It
    lets developers rapidly create effective, robust, and highly interoperable business-to-business
    e-commerce applications. The features of BizTalk Server 2000 include


    +   - XML-based document transformation

    - Business process orchestration

    - Document routing and tracking


    BizTalk Server lets you to send and receive documents (such as purchase orders)
    in any format using the XML-based transformation functionality of the BizTalk
    Mapper. The BizTalk Orchestrator lets you quickly and easily draw a business process
    and map each step to scripts or components that will execute that step. Once a
    process has been diagrammed, BizTalk Orchestrator can create an XML-based document
    that describes the business process. This document is then used by the BizTalk
    Orchestrator runtime to execute the process. A distinct advantage of this approach
    is that it allows rapid development and significantly easier modification of business
    processes.


    # Internet Security and Acceleration Server 2000


    Designed as a successor to and extension of Microsoft''s Proxy Server product,
    Internet Security and Acceleration Server 2000 (ISA Server) provides both firewall
    security and caching features that organizations can use to improve the security
    and performance of their Internet-connected networks. New features in ISA Server
    include


    +   - Integrated intrusion detection

    - Ability to create and enforce Internet usage policies

    - Ability to schedule download of content

    - Integrated logging and reporting functionality


    # Application Center 2000


    If you''ve ever built a Web application for a single server and later had to move
    that application to a Web farm to provide greater scalability, you''ll want to
    take a close look at Application Center 2000. It''s designed to simplify the task
    of creating and managing clusters of Web or application servers. Application Center'
