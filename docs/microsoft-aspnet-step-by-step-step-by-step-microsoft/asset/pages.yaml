    # Creating, Raising, and Handling Events


    Another important aspect of creating a custom server control is dealing with events.
    While the event model in ASP.NET is designed to emulate event handling in a desktop
    application, as a Visual Basic forms application, there are significant differences
    in the models.


    The most significant difference is that control events are raised and handled
    only on the server. Only after a Web Forms has been posted back to the server
    can the state of each control be examined and appropriate events raised and handled.


    Another difference is that custom ASP.NET server controls do not handle client
    events, as clicks, mouseovers, and key presses, because these events occur on
    the client. To communicate a client event to the server, the control must initiate
    a postback. ASP.NET supplies a relatively simple method for allowing a control
    to initiate a postback, which is described in "Handling Postbacks" on page 371.


    There are three parts to dealing with events in a custom control: creating the
    event, raising the event, and handling the event. (Handling the event is typically
    done outside the control, but the plumbing for making it work is set up in the
    control.)'
  merge: -1
  pgno: 386
- img_proc: true
  md: "# Creating and Raising Events\n\nEvents in ASP.NET use two classes exposed\
    \ by the System.ComponentModel namespace: EventHandler and EventArgs. The EventHandler\
    \ class is used as the basis for creating a new event, while the EventArgs class\
    \ is used to pass data with an event, or to signify that no event data was passed.\n\
    \nYou create events using the Events keyword as follows:\n\n```\nPublic Event\
    \ EventName As EventHandler\n```\n\n\nEventName is the name of the event being\
    \ created. Next\n\n```\nPublic Overridable Sub RaisePostBackEvent(EventArgs String)\n\
    Implements IPostBackEventHandler.RaisePostBackEvent\n```\n\n```\nIf SomeExpression\
    \ = True Then\nRaiseEvent EventName(Me, EventArgs.Empty)\nEnd If\n```\n\n```\n\
    End Sub\n```\n\nThis code is executed when the RaisePostBackEvent method is called\
    \ during page execution. It tests whether SomeExpression is True, and if it is,\
    \ it raises the EventName event, which is typically handled outside of the control.\
    \ You’ll learn about RaisePostBackEvent in more detail in “Handling Postbacks”\
    \ on page 371.\n\n# Handling Custom Events\n\nOnce you’ve created the event and\
    \ the code to raise it, you (or the developer consuming the event) will need to\
    \ write code to handle the event. This consists of two steps: creating an event\
    \ handler and wiring the event to it.\n\nAn event handler is a page-level procedure\
    \ that accepts two arguments: the source of the event and an EventArgs instance\
    \ representing any data passed with the event. An event handler for the EventName\
    \ would look like the following:\n\n```\nSub ControlName_EventName(Source As Object,\
    \ e As EventArgs)\n  'Event handling code\n```\n\n```\nEnd Sub\n```"
