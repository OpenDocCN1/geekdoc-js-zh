  md: 'You can make one or more of the parameters of your procedure optional (meaning-
    the caller decides whether the parameter will be passed or not) by preceding them
    with the *Optional* keyword.


    ```

    Sub WriteHello(Optional ByVal Name As String = "Bob")

    Response.Write("Hello, " & Name & "!")

    ```


    When you use optional parameters, you must supply a value for each one, as in
    the preceding example. Also, once you''ve declared an optional parameter, all
    subsequent parameters for that procedure must also be optional.


    Finally, you can change the accessibility of *Sub* procedures using the *Public*,
    *Private*, *Friend*, and *Protected* keywords. *Sub* procedures are public by
    default, which means they can be called from anywhere within your application.


    # Function Procedures


    Function procedures in Visual Basic .NET are just like Sub procedures, except
    for one important detail—they can return a value. This allows your procedure to


    +   - Return a numeric value representing an error or success code

    - Return data in the form of an array or an ADO.NET dataset

    - Return True or False to indicate the results of some conditional test


    The following code example takes two string parameters, concatenates them, and
    returns the result to the caller as a string:


    ```

    Function ConcatStrings(ByVal String1 As String,

    ByVal String2 As String) As String

    ConcatStrings = String1 & String2

    End Function

    ```


    Notice that since the *Function procedure itself is declared as a string, you
    don''t need to create a local variable to hold the result of concatenating the
    two strings. Instead, simply assign the result to the function name to return
    it to the caller.


    # Flow Control


    Another important piece of any program is flow control, which allows you to determine
    at runtime which your code will run, and in what order. Flow control statements
    are the foundation of business logic and consist of conditional logic (including
    *If* and *Case* statements, looping structures (*For...* and *Do...* loops), and
    error-handling statements.'
