  md: '# Creating Web Forms


    +   In this chapter, you will learn about

    - Creating Web Forms pages

    - How the various parts of a Web Form work together to produce their magic

    - Automatic handling of postbacks

    - Using code-behind classes to separate executable code from HTML markup and server
    controls tags


    Let’s start from the very beginning, a very good place to start. When you read
    begin with A… B… C… when you…


    No, that won’t do at have to channel Julie Andrews in The Sound of Music to figure
    out Web Forms. And you will start at the beginning… the beginning of the page,
    that is.


    # Anatomy of an ASP.NET Web Form


    In previous chapters, you saw some examples of simple ASP.NET pages, and you’ve
    seen some more complicated examples as well. The simplest ASP.NET page consists
    of plain HTML and is named with the .aspx extension. While it’s perfectly valid,
    it’s also missing a lot of what ASP.NET pages and what makes them Web Forms.


    Web Forms go beyond classic ASP pages offered, adding new directives, new reusability
    options in the form of user controls and server controls, and a new server-side
    data-binding syntax, to name a few. This section will explore how a page is put
    together and how you can use these new features in your Web Forms.'
