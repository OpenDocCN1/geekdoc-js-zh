  md: '# ASP.NET Step by Step


    Many other properties and methods are exposed by the Page class. A substantial
    number of them are inherited from the Control class, from which the Page class
    is derived, the Object class, from which the Control class (and, ultimately, every
    other class) is derived. This is an example of how inheritance allows you to build
    a very rich object model.


    There are two methods by which an ASP.NET page is inherited from the Page class.
    The first is adding the @ Page directive to an .aspx file, which automatically
    makes all of the properties and methods of the Page class available to any code
    written in the page. The second method, which is discussed in more detail later
    in this chapter, inheriting from the Page class in a code-behind that is associated
    with the page by either Src or Inherits attribute. This not only makes all of
    the members of the Page class available to the code-behind, but it also allows
    ASP.NET to combine the code in the Web Form .aspx file with the code-behind class
    into a single compiled class at compile time. This single compiled contains all
    of the methods and properties exposed by the Page class, as well as any methods
    and properties implemented by your code.


    Any of the members of the Page class can be called within code without explicitly
    using the page name. For example, to write text to the browser using the Write
    method of the Response object, you would use the following code:


    ```

    <%

    Response.Write("Hello, World!")

    %>

    ```


    You could also use


    ```

    <%

    Page.Response.Write("Hello, World!")

    %>

    ```


    But it is not necessary to add the Page property because the Response property
    and the other Page members are exposed directly.


    # Writing Code in Web Forms


    One of the strengths of classic ASP was that it gave you a lot of flexibility
    in writing your code. You could write your code inline with the HTML markup, as
    a part of <% %> render blocks. You could write your code in subroutines in render
    blocks. And you could write your code in <script> declaration blocks, either as
    arbitrary code or as subroutines.'
