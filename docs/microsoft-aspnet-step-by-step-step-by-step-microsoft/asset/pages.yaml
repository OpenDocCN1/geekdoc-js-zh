    # Maintaining State


    In the examples, data used by the controls has been stored in local variables.
    For many controls, this may work fine. Unless you explicitly retrieve submitted
    values and populate the member controls with these values, as you did in the LoadPostData
    method of the previous example, the member controls will be blank when the page
    is posted back to the server and the results are returned. In many cases, you
    may want to maintain the state of the controls of your custom server control,
    without explicitly having to write code to test for new values and repopulate
    the member controls with each postback.


    To solve this problem, ASP.NET provides a state-management facility called ViewState.
    This is provided by an instance of the StateBag class of the System.Web.UI namespace.
    You store data in ViewState as key/value pairs, which'
  merge: -1
  pgno: 399
- img_proc: true
  md: 'makes working with it quite similar to working with session state. To add a
    value to ViewState or modify an existing value, you can simply specify the item''s
    key and assign a value as follows:


    +   * Visual Basic .NET

    ViewState("MyKey") = MyValue


    ```

    // C#

    ViewState["MyKey"] = MyValue;

    ```


    > important

    In order to use ViewState, controls must be contained within a <form> block with
    the runat="server" attribute set.


    Note that in C#, you use square brackets around the key rather than parentheses.
    You can also add items to ViewState using the Add method of the StateBag class,
    and remove them using the Remove method. You can clear all ViewState values with
    the Clear method.


    Retrieving values from ViewState is a bit more involved. Since the Item property
    of the StateBag class returns an object, you will need to cast the object to the
    proper type before performing any type-specific actions on it or passing it to
    another procedure that expects a particular type. The syntax for retrieving a
    string value is as follows:


    +   * Visual Basic .NET

    Dim MyString As String

    MyString = CType(ViewState("MyKey"), String)


    ```

    // C#

    string MyString;

    MyString = (string)ViewState["MyKey"];

    ```


    The simplest way to automate the process of saving control state to ViewState
    is to substitute ViewState items for the local member variables for storing the
    values of properties of the control.'
