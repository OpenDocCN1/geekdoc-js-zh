  md: '# Best Practices for Preparing for ASP.NET


    As you can see from this appendix, migrating from classic ASP to ASP.NET does
    not need to be terribly painful. However, a lot depends on how your classic ASP
    code is written in the first place. Code that is written with a great deal of
    intermingled HTML and render blocks will be more difficult to migrate, as code
    that does not follow good coding practices. The following are several coding practices
    you can put in place in your ongoing classic ASP development to make migrating
    it to ASP.NET easier:


    +   - For procedures that take parameters, use ByVal or ByRef to explicitly state
    which type of parameter is desired. This will prevent code that relies on the
    default assumption of ByRef in classic ASP from breaking when migrated to ASP.NET.

    - Write all procedures in <script> code declaration blocks, rather than in render
    blocks.

    - Use render blocks sparsely, particularly when intermingled with HTML tags.

    - Do not rely on default properties. Instead, explicitly name properties such
    as objRS.Value.

    - Do not use multiple languages in server-side <script> blocks. Choose the language
    you''re most comfortable with and use it exclusively on a page basis.'
