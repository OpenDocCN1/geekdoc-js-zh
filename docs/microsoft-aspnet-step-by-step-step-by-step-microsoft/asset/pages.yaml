  md: 'Sample applications are not designed to run on production servers, so typically
    they do not use best practices to prevent servers or applications from being-compromised.
    One example is that samples installed with one version of IIS included a utility
    that allowed users to view the source of ASP pages. Unfortunately, this utility
    was installed on a server containing production applications, it could be used
    to view the source code and make them vulnerable to attack.


    As mentioned earlier, the .NET QuickStart samples install an instance of the MSDE
    database. In the Beta 2 release, this instance was installed with a blank password
    for the account. If these samples were installed on a server that is exposed to
    the Internet, this would result in a major vulnerability.


    Additionally, some applications demonstrate extremely poor practices when it comes
    to security. In earlier versions, the QuickStart samples used the account with
    a blank for database connections. This is an extremely bad practice. Not only
    does it reinforce the habit of having the account with no password, but it also
    uses an account for data access that has much wider permissions than are necessary
    for data access. The good news is that the current versions of the QuickStart
    samples follow the best practice of using an MSDE account created especially for
    the sample applications. This account only has permission to access the databases
    used by the samples, and only


    Although the changes in the .NET Framework QuickStart samples indicate that Microsoft
    is committed to demonstrating better security practices in sample applications,
    they still should not be installed on a production server (or any other server
    that is exposed to the Internet, for that matter) without a very clear understanding
    of the risks entailed, and without undertaking efforts to mitigate those risks.


    # You Need Validation


    Validation is another area that is often overlooked in Web application security.
    For example, developers may include validation code to ensure that users enter
    an e-mail address or phone number in the correct format. But they might not consider
    that other text fields, particularly large text fields or those that may be used
    for display elsewhere in the application, may expose the application to unacceptable
    results.


    The problem with not validating all input by the user is that a malicious user
    can enter text, such as script commands, ASP.NET <% % > render blocks, or other
    text that, in the wrong context, could be allowed to execute rather than being
    treated as plain text to be displayed. Additionally, input fields used to construct
    SQL statements for data access may be vulnerable to unexpected


    ![](img/50a47de1541381ea3363945ae9c22411_202_0.png)'
