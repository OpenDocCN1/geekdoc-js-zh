    action to foil the would-be intruder (such as disabling the account attacked).
    As with many of the other settings discussed in this chapter, the auditing policy
    for a Windows 2000 machine can be set using a security template via the Security
    Configuration and Analysis MMC snap-in.


    Logging is the process of writing information about the activities performed on
    a machine to a known location for later review. For our purposes, the most important
    logging (after the logging of audit information) is IIS for the Web, FTP, and
    SMTP services. Logging is performed at the site level. To enable logging in IIS,
    use the following steps. (They''re for enabling logging for a Web site, but the
    for FTP, SMTP, and other IIS services are similar.)


    +   Open the Internet Services Manager MMC snap-in by clicking Start, Programs,
    Administrative Tools, Internet Services Manager.


    +   Select the server you want to manage, and expand the tree to find the site
    you want to manage. Right-click the desired site and select Properties. The following
    dialog will be displayed.


    ![](img/50a47de1541381ea3363945ae9c22411_206_0.png)


    In the <sitename> Properties dialog, ensure that the Enable Logging checkbox is
    checked.


    You can modify the format of the logs using the Active log format drop-down, and
    you can click the Properties button to modify where logs are kept, frequently
    a new log file is created, and the specific information that is logged.'
  merge: -1
