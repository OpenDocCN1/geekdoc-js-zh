  md: '# Using Code-Behind in Web Forms


    In addition to the changes in <script> blocks and <% %> render blocks in ASP.NET
    that make it easier to write clean code, ASP.NET introduces an entirely new concept
    code-behindind, which allows developers to entirely separate executable code from
    their HTML markup and server control tags.


    A code-behind for a Web Form consists of a file containing a class derived from
    the Page class, and optionally contained within a namespace. The Web Form then
    inherits from the code-behind class at runtime, allowing both the Web Form and
    its code-behind class to be compiled into a single assembly for execution.


    # Separating Code from UI


    To show you this works, let''s use the ServerControls.aspx page one last time.
    To use code-behind with this page, follow these steps:


    +   1 Open ServerControls.aspx in a text editor.

    2 Using a text editor, create two new files, ServerControls.cb.aspx and ServerControls_cb.vb.

    3 Copy all of the text from ServerControls.aspx and paste it into ServerControls_cb.aspx,
    and then close ServerControls.aspx.

    4 Cut all the code contained within the <script> block in ServerControls_cb.aspx
    and paste it into ServerControls_cb.vb, and then remove the <script> tags.

    5 Add Src and Inherits attributes to the @ Page directive in ServerControls_cb.aspx
    to help ASP.NET locate the code-behind class file.


    ```

    <% Language="vb" Src="ServerControls_cb.vb"

    Inherits="ServerControls" %>

    <html>

    <head>

    </head>

    <body>

    <form runat="server">

    <asp:Label id="NameLabel" runat="server">Name:</asp:Label>

    <asp:TextBox id="NameTextBox"

    TextChanged="NameTextBox_TextChanged" runat="server"/>

    <input id="NameButton" type="submit" runat="server"/>

    </form>

    ```'
