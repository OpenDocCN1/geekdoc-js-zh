  md: "# <authentication>\n\nThe <authentication> element controls configuration of\
    \ authentication in ASP.NET. You can choose from one of three authentication methods,\
    \ and you can set appropriate parameters for the method you choose or choose no\
    \ authentication at all. The <authentication> element supports two child elements,\
    \ <forms> and <passport>. Additionally, the <forms> element supports one child\
    \ element, <credentials>, which in turn supports child element, <user>, as shown\
    \ in the following example:\n\n```\n<authentication mode=\"Windows|Forms|Passport|None\"\
    >\n\n<forms>\n    loginUrl=\"url\"\n    name=\"name\"\n    path=\"/\"\n    protection=\"\
    All|None|Encryption|Validation\"\n    timeout=\"number\"\n\n    <credentials passwordFormat=\"\
    Clear|MD5|SHA1\">\n        <user name=\"username\" password=\"password\" />\n\
    \    </credentials>\n</forms>\n\n<passport redirectUrl=\"url\" />\n\n</authentication>\n\
    ```\n\nFor information on <authentication> element attributes, consult the following\
    \ table."
