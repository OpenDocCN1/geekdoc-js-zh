    | `<input type="radio">` | HtmlInputRadioButton | Allows programmatic access to
    the HTML input element for the radio input type. |

    | `<input type="text">`<br><input type="password">` | HtmlInputText | Allows programmatic
    access to the HTML input element for the *text* and *password* input types. <br>Exposes
    the *ServerClick* event. |

    | `<select>` | HtmlSelect | Allows programmatic access to the HTML select element.
    <br>Exposes the *ServerChange* event. |

    | `<table>` | HtmlTable | Allows programmatic access to the HTML table element.
    Note that some subtables (such as `<col>`, `<tbody>`, `<thead>`, and `<tfoot>`)
    are not supported by the *HtmlTable* control. |

    | `<td>` and `<th>` | HtmlTableCellRow | Allows programmatic access to HTML table
    cell elements. |

    | `<tr>` | HtmlTableRow | Allows programmatic access to HTML table row elements.
    |

    | `<textarea>` | HtmlTextArea | Allows programmatic access to the HTML text area
    element. <br>Exposes the *ServerChange* event. |

    | `<body>`, `<div>`, `<span>`,`<br><font>`, `etc.` | HtmlGenericControl | Allows
    programmatic access to any HTML element not specifically represented by its own
    HTML control class. |'
