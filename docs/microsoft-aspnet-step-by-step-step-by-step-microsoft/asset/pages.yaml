  md: '# Using the Cache APIs


    The question that comes to mind is, “How do I remove the dataset from the cache?”
    There are a couple of answers to this question, one simple and one more complex.
    Let''s leave the more complex answer for the next section. The simple answer is
    that you can remove an item from the cache programmatically by calling the Remove
    method of the Cache class and passing it the key of the item to be removed. For
    example, you could add an ASP.NET button to the preceding example, and add the
    following line to the Click event handler for the:


    ```

    Cache.Remove("myDS")

    ```


    This would clear the dataset from the cache and force the page to be rendered
    again using fresh data. (Note that since the Page_Load event fires before the
    Click event for the button, you may need to click the button twice before the
    datagrid and the label are updated.)


    # Understanding Expiration and Scavenging


    The more complex answer to the question of how to remove items from the cache
    is that ASP.NET will actually do it for you. The complex part is that ASP.NET
    decides which items to remove from the cache, and when it does so, you need to
    provide ASP.NET with that information when you add an item to the cache.


    You can do this by using the Add or Insert methods of the Cache class. Both let
    you pass parameters that tell ASP.NET when and/ on what basis to expire your cached
    content, as well as the priority your cached content should have when the ASP.NET
    scavenges the cache for items that can be removed to free memory.


    ASP.NET determines the order in which items are scavenged from the cache based
    on their priority. Over time, if an item is not accessed, ASP.NET will reduce
    its priority periodically. When you set the priority of an item by passing one
    of the values of the CacheItemPriority enumeration when calling the Add or Insert
    method. You can also set the rate at which an item decays by passing one value
    of the CacheItemPriorityDecay enumeration to Add or Insert.


    The following is an example of the Insert method:


    ```

    Cache.Insert("myDS", myDS, Nothing, DateTime.Now.AddMinutes(2), - TimeSpan.Zero,
    CacheItemPriority.High, CacheItemPriorityDecay.Slow, Nothing)

    ```


    This inserts a dataset into the cache with the key "myDS", passing Nothing as
    the CacheDependency parameter, sets the expiration for two minutes from the time
    when the item is added to the cache, sets the SlidingExpiration parameter to'
  merge: -1
  pgno: 459
- img_proc: true
  md: '# Chapter 14 Using Caching to Improve Performance 441


    TimeSpan.Zero (no sliding expiration), sets the cache priority for the item to
    High, sets the priority decay for the item to Slow, and sets the callback function
    for the item to Nothing (no callback function).


    > Note The Add and Insert methods of the Cache class provide essentially the same
    functionality, with two differences. The first difference is that all parameters
    of the Add method are required, even if you are not using a particular parameter,
    you must still pass a placeholder parameter. The Insert method is overloaded,
    which makes this method easier to use when you want to pass some of the possible
    parameters. The second difference is that the Add method returns an object that
    represents the item added to the cache, while the Insert method does not return
    a value.


    You can also call the Insert method passing the Key (String) and Item (Object)
    parameters, passing the Key, Item, and CacheDependency parameters, or passing
    the Key, Item, CacheDependency, AbsoluteExpiration (DateTime), SlidingExpiration,
    and (TimeSpan) parameters.


    # Understanding File and Key Dependencies


    Another parameter that can be passed to the Add or Insert method is the CacheDependency
    parameter, which takes an instance of the CacheDependency class as its value.
    The CacheDependency class allows you to create a dependency for a cached item
    on one or more directories (file dependency), or on one or more other cache items
    (key dependency). The constructor for the CacheDependency class has the following
    three forms:


    +   * Monitor a file or directory for changes

    DimDependency As CacheDependency

    myDependency = New CacheDependency("myfileDirName")


    +   * Monitor an array of file names and/or paths for changes

    DimDependency As CacheDependency

    myDependency = New CacheDependency(myfileDirArray)


    +   * Monitor an array of file names and/or paths, and an array of keys for changes

    DimDependency As CacheDependency

    myDependency = New CacheDependency(myfileDirArray, myKeyArray)'
