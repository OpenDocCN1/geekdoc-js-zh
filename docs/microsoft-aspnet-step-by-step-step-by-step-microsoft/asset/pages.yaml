  md: 'Container is the object that contains the expression to be evaluated (for DataGrid,
    DataList, or Repeater controls, this is always Container.DataListem), EvalExpression
    is the full name of the property or item to be evaluated, and FormatExpression
    is a string formatting expression (such as {0:c}) to be used to format the string
    result. Note that if no expression argument is passed, Binder.Eval will return
    an object instead of a string.


    # important


    Because Binder.Eval uses late binding and reflection (which allows managed code
    to interrogate other managed code at runtime), it may be significantly slower
    than the other data-binding techniques. For this reason, you should only use Binder.Eval
    when you need to, such as for performing string formatting on numeric data.


    # Using the Data-Bound Controls


    Chapter 10 looked at the ASP.NET server controls and mentioned briefly one important
    group of controls. The DataBound controls, which include the DataGrid control
    (and its constituent controls), the DataList control, and the Repeater control,
    allow you to set a datasource programmatically. Then they iterate over datasource
    and display the data based on formatting that you define, either through properties
    of the control or by adding template definitions. The neat thing about this is
    that you define the formatting for a single row, and the data-bound controls take
    care of applying formatting to all rows of data.


    Choosing which control to use rests largely on the format you want your data in
    and how much control you want over the formatting of the data. The DataGrid control
    is the simplest to use and displays data in a table format. The DataList control
    is a little more involved in implementation, but it provides a greater degree
    of control over formatting through the use of templates. Finally, for the control
    freak in all of us, the Repeater control, which has no built-in formatting of
    its own, provides ultimate control over formatting templates.


    # Using DataGrids


    The DataGrid control presents bound data in a tabular format and provides a number
    of properties that you can use to format the data. This control can automatically
    generate all columns in the table from the datasource, or you can use specialized
    column controls to provide additional functionality or formatting for a given
    column or columns.


    At its simplest, there are three basic steps to using a DataGrid control.'
