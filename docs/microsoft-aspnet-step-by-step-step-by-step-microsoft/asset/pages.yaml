    # Validating by Comparison


    Another one of the previous examples with the potential for trouble is the Calendar
    control example. As coded in the example, the Calendar control can be used to
    set a start date that is later than the end date. Clearly, if you''re storing
    these dates or using them to drive some programmatic logic, this is not something
    you want to allow. Frequently, the CompareValidator control can help prevent this
    problem, as illustrated by the following:


