    # Compiling Your Control


    In order for clients to be able to use your custom server control, you need to
    com-pile it into a managed assembly, usually in the form of a library or DLL.
    You do

    is with the appropriate command-line compiler for the language with which

    you''re creating your control, or, if you''re using Visual Studio .NET, by issuing
    the

    Build command (clicking Build on the Build menu).


    The command for compiling a custom control written in Visual Basic .NET looks

    like the following:


    ```

    vbc /t:library <sourcefile> /r:System.Web.dll /r:System.dll

    ```


    Note that sourcefile is the name of the file (with a .vb extension) containing
    thendefinition of your control class. The /t parameter specifies that the compiler

    should create a library (DLL) assembly. The /r parameter (of which there may be

    more than one) specifies assemblies that should be referenced when compiling

    your control class. Each assembly whose types are used within your class must
    be

    referenced using a /r parameter that points to the physical name of the

    assembly. You can also add the /out parameter, which specifies the path and file

    name to use for the compiled assembly. One for this is to direct the compiled

    out to be placed directly in the bin directory of the application that will use
    the

    control, which saves the step of having to copy the assembly there later.


    The command for compiling a control written in C# looks like the following:'
  merge: -1
