  md: '# Understanding ASP.NET Error Messages


    Anyone whos seen the infamous ASP 015 error probably realizes just what a dramatic
    improvement in the information in the previous figure represents. ASP.NET will
    provide descriptive information for both semantic and syntax errors, including
    the type of exception thrown (which allows you to provide effective and specific
    exception handling when you cannot completely prevent the exception) and the stack
    trace for the current request. As mentioned previously, you can also write to
    the trace output, and any trace statements that occur before execution is halted
    by an exception will be shown in the trace output.


    # Invoking the Runtime Debugger


    While the error information provided by ASP.NET at runtime can be useful in locating
    and eliminating syntax errors, most semantic errors and logic errors require a
    debugger. This tool uses the source code for a program and an executable with
    debug symbols to let a developer step through his code by line, set breakpoints,
    and examine the state or values of variables during program execution. You can
    also use the Assert method of the Debug class (part of the System.Diagnostics
    namespace) to test for certain conditions in your code and write messages to the
    output window of the debugger when the assertions fail.


    The .NET Framework SDK comes with its own debugger, which provides rich debugging
    functionality for ASP.NET applications. The debugger is installed in the drivename\Program
    Files\Microsoft.NET\Framework\SDK folder and is named DbgCLR.exe. You can execute
    the runtime debugger by double-clicking this file in Windows Explorer or by entering
    the path and file name in the Run dialog (Start, Run). The following figure shows
    the runtime debugger at start-up.


    ![](img/50a47de1541381ea3363945ae9c22411_491_0.png)'
  merge: -1
  pgno: 491
- img_proc: true
  md: '# Chapter 16 Tracing and Debugging ASP.NET Applications 473


    # Opening a Source File


    In order to debug a Web Forms page, you need to load the source for the page into
    the debugger. To do so, click File, Open, File and browse to the source file for
    the page. Remember that to debug the page, it must be compiled in debug mode,
    either by inserting the Debug attribute in the @ Page directive or by enabling
    debugging in Web.config.


    # Attaching Processes


    Once you''ve loaded the source file for the page, you''ll need to call up the
    page in a browser and attach the debugger to the process of the browser window
    that is requesting the page. But first, you will need to attach to the ASP.NET
    worker process to allow the debugger to break the execution of the code.


    To attach the ASP.NET worker process and the process for your page, follow these
    steps:


    +   1. Open the page to be debugged in a browser.


    +   2. Click Tools, Debug Processes. The Processes window will appear, as shown
    in the following figure.


    ![](img/50a47de1541381ea3363945ae9c22411_492_0.png)


    +   3. Select the aspnet_wp.exe process (on systems with the Beta 2 ASP.NET Premium
    Edition installed, this will be aspnet_ewp.exe) and click Attach.


    +   4. Locate the process of the browser that is requesting the page (the Title
    column can help you locate the correct process), select it, and click Attach.


    +   5. Click Close to close the Processes dialog.'
