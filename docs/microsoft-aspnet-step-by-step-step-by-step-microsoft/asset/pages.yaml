  md: '# Chapter 12 Quick Reference


    | To | Do This |

    |---|-|

    | Create a namespace | Use the Namespace and End Namespace keywords (Visual Basic
    .NET) or the namespace keyword with curly braces (C#). |

    | Inherit from a base class | Visual Basic .NET, add the Inherits keyword on the
    line after the class definition, specifying the name of the class to inherit.
    In C#, add a colon after the name of the class you are creating, followed by the
    name of the class to be inherited. |

    | Render output from a control | Override the Render method of the control class
    from which the custom control is derived. To take advantage of the rendered output
    of controls like TextBox and Label, call the Render method of the base class when
    you are finished rendering custom output. |

    | Handle postbacks | Implement the IPostBackDataHandler and/or IPostBackEventHandler
    interfaces, and implement the methods defined by the interfaces. |

    | Maintain state in a custom control | Store state in and retrieve state from
    the ViewState object in your property procedures. |'
