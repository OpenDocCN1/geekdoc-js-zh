  md: '# 362 ASP.NET Step by Step


    That''s right; just seven lines of code to use the control you created. Just imagine
    how much time you''re going to save by encapsulating frequently used code into
    a custom control!


    Now that you''ve conquered declarative use of your custom control, let''s implement
    the control programmatically, as follows:


    +   1 Create a new file in your preferred editor and save it as HelloControl_Client_Programmatic.aspx.

    This file should be saved to the same location as the previous example.


    +   2 Add the @ Page directive and standard HTML tags.


    +   3 Add the following code to the <head> section of the page:

    ```html

    <script runat="server">

    Sub Page_Load

    Dim myControl As New HelloControl()

    me.Controls.Add(myControl)

    End Sub

    </script>

    ```


    +   4 Save the page and browse it. The output should look the same as the preceding
    figure.


    While the output of both HelloControl_Client.aspx and HelloControl_Programmatic.aspx
    look the same, there is one significant difference: the text Hello, World! In
    the second example appears after the closing </html> tag. This is because when
    you add a control to the page''s Controls collection using the Add method, it
    is added at the end of the collection.


    There are two ways to fix this: use the Add method instead of Add, or use an ASP.NET
    PlaceHolder control. The AddAt method takes both the name of a control and an
    integer representing the location in the collection where the control should be
    inserted. The usefulness of this method is limited because you know by number
    where you want your control to be located, and static HTML content is dynamically
    converted at runtime into ASP.NET Literal controls. The easiest method of precisely
    placing a programmatically created control on the page is with a Placeholder control.
    Add a Placeholder control at the desired location in the page, making sure to
    provide an id attribute for the control.


    ```

    <asp:placeholder id="ph1" runat="server"/>

    ```


    Then, when you create your control, add it to the Controls collection of the Placeholder,
    rather than the page''s Controls collection.


    ph1.Controls.Add(myControl)'
