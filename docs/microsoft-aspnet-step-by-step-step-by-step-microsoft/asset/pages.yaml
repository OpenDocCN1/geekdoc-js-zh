  md: '# Looping Statements


    Looping statements are useful features that allow you to perform actions repeat-ly,
    by either specifying explicitly at design time the number of times the code should
    loop, deciding at runtime how many times to, or looping through a collection of
    objects and taking a specific action on each item. There are several different
    types of looping statements, each of which has its own particular syntax and is
    useful for a different situation. Loop types include


    +   * For... loops

    * Each... loops, a special case of For...

    * Do... loops, which include Do While... and Do Until...

    * While...End While loops


    > note

    Visual 6 supported the While...End syntax for While... loops. In Visual .NET,
    this syntax is no longer supported. You should use the While...End syntax instead.


    # Using For... Loops


    For... loops are useful for repeating a given set of statements a number of times.
    The number of times the statements are executed can be determined either explic-ly
    or by evaluating an expression that returns a numeric value. The following example
    (from the ASP.NET QuickStart Tutorial) uses a For... loop that counts from 1 to
    7 and, for each pass of the loop, outputs a message with font size equal to the
    counter variable:


    ```

    <% i = 0 To 7 %

    <font size="<%=i%%%">Welcome to ASP.NET</font><br>

    % Next %

    ```


    You can also use the Step keyword to loop by steps greater than 1, or even to
    loop backward by specifying a negative number, as follows:


    ```

    <% i = 7 To 0 Step -1 %

    <font size="<%=i%%%">Welcome to ASP.NET</font><br>

    % Next %

    ```'
