    ForeColor This property sets or retrieves a value of type Color that represents
    the color of the error message specified in the ErrorMessage property. The default
    is Color.Red.


    IsValid This property sets or retrieves a boolean value that signifies whether
    the control specified by the ControlToValidate passes validation.


    Validate This method causes the control on which it is called to perform validation,
