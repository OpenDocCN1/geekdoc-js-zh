  md: '# Declaring Variables


    Before you can use variables in your programs, you need to declare them. Variable
    declaration is the process of specifying the characteristics of the variable (data
    type, lifetime, scope, and visibility) so that the runtime system knows how much
    storage to allocate for the variable, which actions to allow on the variable,
    and who can take those actions. A variable declaration takes the following form
    in Visual Basic .NET:


    Dim x Integer Declares a variable of type Integer


    The same declaration in C# would take the following form:


    ```

    int x; // Declares a variable of type int

    ```


    > The examples above use x as the name of the variable. While this is perfectly
    acceptable as far as the language compilers are concerned, you should consider
    giving your variables more meaningful names, such as FirstName (for a string holding
    a first name), LoopCount (for a numeric variable in a loop structure), or Person
    (for a reference to a class representing data on a person). This naming convention
    makes it much easier to remember the purpose of a variable, and it will make your
    code much easier to maintain.


    Both of the preceding declarations specify a variable of type Integer (or int,
    both of which map to the System.Int32 type). In both cases, the variables would
    be accessible only within the module in which the declarations appeared. In addition
    to simple declarations like these, you can use the placement of the declarations,
    as well as Visual Basic .NET and C# keywords, to modify the lifetime, scope, and
    accessibility of your variables.


    # Lifetime


    Lifetime refers to the span of time when the variable is declared to when it is
    destroyed. The lifetime of a variable depends on where it is declared. For example,
    the lifetime of a variable declared inside a procedure is limited to the execution
    of the procedure. Once the procedure has finished execution, the variable is destroyed
    and the memory it occupied is reclaimed. An example is shown here:


    ```

    ''Visual Basic.NET Sub procedure

    Sub HelloWorld()

    ''Declare procedure-level string variable

    Dim HelloString As String

    ```'
