  md: "# Cookieless Sessions\n\nOne ongoing challenge for Web developers using classic\
    \ ASP is how to handle state for users whose browsers can't or won't accept cookies.\
    \ Classic ASP provided no intrinsic for this situation. In ASP.NET, it's relatively\
    \ simple.\n\n+   1 Open the Web.config configuration for your application and\
    \ locate the sessionState configuration section.\n2 Change the cookless attribute\
    \ from \"false\" to \"true\".\n3 The complete sessionState configuration section\
    \ would look like the following (note that the stateConnectionString, sqlConnectionString,\
    \ and timeout attributes have been omitted).\n\n```\n<sessionState\n  cookieless=\"\
    true\">\n```\n\nWhen the cookieless attribute is set to \"true\", ASP.NET will\
    \ automatically embed the SessionID value in the URL for all requests. For best\
    \ results, always use relative URLs for internal links within your application.\
    \ Relative URLs contain only the path and file information for the requested resource,\
    \ and not the protocol domain, which are assumed to be the same as the current\
    \ page.\n\n# Formatting URLs for Cookieless Sessions\n\nASP.NET provides automatic\
    \ embedding of session IDs in the relative URLs within your application, but not\
    \ for absolute URLs, nor for URLs from applications outside yours. If a request\
    \ for a page within an application set up for cookieless sessions is received\
    \ that doesn't contain an embedded session ID, ASP.NET will create a new session\
    \ ID and embed it in the URL for that.\n\nIn order to prevent this problem, you\
    \ can manually format URLs by calling the ApplyPathModifier method of the Response\
    \ object, and passing it a virtual path. The method will return an absolute URL\
    \ containing the embedded SessionID for use with cookieless sessions. An absolute\
    \ URL includes the protocol, domain, path and file name necessary to request a\
    \ given resource. The syntax for this method is as follows:\n\n```\nDim myAbsoluteURL\
    \ = As String\nmyAbsoluteURL = Response.ApplyPathModifier(\"foo.aspx\")\n```"
