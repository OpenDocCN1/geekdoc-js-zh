  md: '# Chapter 15 Deploying ASP.NET Application


    A Web Setup project allows you to specify a variety of options how the application
    will be deployed, ranging from which files to include the name of the deployed
    application, and the location of the deployed files. When built, the Web Setup
    project creates a Windows Installer .msi file that can be copied to the target
    machine and executed to deploy the application.


    You can use the following steps to use a Web Setup project to deploy a Web application.


    +   1. Open an existing Web application solution in Visual Studio .NET.

    2. Right-click the solution name in the Solution Explorer window, and select Add,
    New Project. The Add New Project dialog will appear. (See the figure on page 456.)

    3. Select the Setup and Deployment Projects type, select the Web Setup Project
    template, and then click OK to select the default project name. The File System
    editor for the Web Setup project will appear.

    4. In the Properties window, modify the ProductName property to match the name
    of the Web application project you opened in step 1.

    5. Right-click the Web Application Folder node in the left pane of the File System
    editor, and click Add, Project Output. The Add Project Output Group dialog will
    appear, as shown in the following figure.


    ![](img/50a47de1541381ea3363945ae9c22411_476_0.png)


    +   6. Select both the Primary output and Content Files items from the list. Use
    the Ctrl key to select multiple items. Then click OK.'
