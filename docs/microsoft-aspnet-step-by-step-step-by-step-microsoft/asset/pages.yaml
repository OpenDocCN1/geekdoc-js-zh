  md: '# Control Execution Order


    When you''re handling events, it''s important to understand that the standard
    control events and methods occur in a consistent order, including events and methods
    related to postbacks. This is important if you write code in an event handler
    that occurs before the objects manipulated by that code have been created and
    initialized, the results will be unpredictable at best. The following is the order
    of the standard events and methods for controls.


    +   * **Initialize** During this phase, the *Init* event is raised.

    * **LoadViewState** During this phase, controls use *ViewState* populated with
    data from the hidden __VIEWSTATE field submitted with the request. The *LoadViewState*
    method can be overridden to customize this process.

    * **PostData** During this phase, data posted back with the request is evaluated
    and appropriate action is taken. Override the *LoadPostData* method to write code
    for this phase.

    * **Load** During this phase, the *Load* event is raised.

    * **RaisePostDataChanged** During this phase, change events are raised in response
    to differences between the current state of a control''s members and the values
    submitted with the request. Override the *RaisePostDataChanged* method to write
    code for this phase.

    * **RaisePostBack** During this phase, event handlers for server-side events are
    called. Override the *RaisePostBack* method to write code for this phase.

    * **PreRender** During this phase, any modifications are made. Changes made after
    this phase will not be saved to *ViewState*.

    * **SaveViewState** During this phase, controls use *ViewState* save their data
    to the hidden __VIEWSTATE field. The *ViewState* method can be overridden to customize
    this process.

    * **Render** During this phase, the control and its children are rendered to the
    browser.

    * **Dispose** During this phase, any clean-up of expensive resources such as file
    handles, database connections, etc., is performed. Override the *Dispose* method
    to write code for this phase.'
  merge: -1
  pgno: 389
- img_proc: true
  md: "# Control Execution Order\n\nWhen overriding methods for inherited events (Init,\
    \ Load, PreRender, etc.), it's usually a good idea to call the base implementation\
    \ of the event's method from within your overridden version. This ensures that\
    \ any handlers associated with those events are called. The syntax for calling\
    \ the base handler is as follows:\n\n```\nProtected Overrides Sub Load(e EventArgs)\n\
    \  Event handling code\n  MyBase.OnLoad(e)\nEnd Sub\n```\n\n# Handling Postbacks\n\
    \nAs discussed previously, a postback is the process by which a Web Forms page\
    \ submits an HTTP POST request in response to some user action, such as clicking\
    \ a button. At some point, it is likely that you will want to develop a control\
    \ that handles postback data and/or events. In this section, you'll learn how\
    \ to handle both.\n\nThere are three phases in the execution of an ASP.NET Web\
    \ Forms page during which you have the opportunity to work with postback information:\
    \ the LoadPostData phase, the RaisePostDataChangedEvent phase, and the RaisePostBackEvent\
    \ phase. To work with the associated data or events, override the associated method\
    \ for the desired phase. To override the methods, you need to implement the IPostBackDataHandler\
    \ interface, or IPostBackDataHandler defines the LoadPostData phase and the RaisePostDataChanged\
    \ method. IPostBackEventHandler defines the RaisePostBackEvent method.\n\nYou\
    \ implement interfaces in the fashion specified by the language you are using.\
    \ For Visual Basic .NET, interfaces are implemented using the Implements keyword,\
    \ and you can implement as many interfaces as you'd like. The Implements statement\
    \ should directly follow the Inherits statement for your control. Separate each\
    \ interface name with a comma, as follows:\n\n```\nInherits Control\nImplements\
    \ IPostBackDataHandler, IPostBackEventHandler\n```\n\nIn C#, both the class from\
    \ which the control is derived and any interfaces it implements are named on the\
    \ same line as the class definition."
