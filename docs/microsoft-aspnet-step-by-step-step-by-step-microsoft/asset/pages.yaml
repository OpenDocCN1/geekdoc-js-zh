  md: 'You can also use a For... loop to loop through the elements of an array specifying
    the length of the array as the loop count expression, as follows:


    ```

    <%

    Dim s(5) As String

    s(0) = "A"

    s(1) = "B"

    s(2) = "C"

    s(3) = "D"

    s(4) = "E"

    For i = 0 To s.Length - 1 %%

    <font size="<%=i%%"><%=s(i)%></font><br>

    <% Next %%>

    ```


    > note

    in Visual Basic .NET, all arrays are zero based. Therefore, to use the Length
    property of the array for a looping statement, you should use Length – 1.


    # Using For... Loops


    For Each... loops are a specialization of For... loops that allow you to loop
    through a collection or group of elements and take action on each item. The following
    example demonstrates looping through the items in an array of dates:


    ```

    Dim Dates(2) As Date

    Dim DateItem As Date


    Dates(0) = Now.Date

    Dates(1) = Now.AddDays(7).Date

    Dates(2) = Now.AddYears(1).Date

    ```


    For Each DateItem In Dates

    Response.Write("Date is: " & DateItem.ToString(".<br/>")

    Next


    This code outputs each date to the browser using Response.Write. Note that when
    declaring the Dates array, you use the upper bound of 2, not the number of items
    desired, to size the array.'
