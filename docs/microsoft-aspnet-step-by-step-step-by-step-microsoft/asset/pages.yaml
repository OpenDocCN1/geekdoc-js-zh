  md: '# Deploying an ASP.NET Application


    +   In this chapter, you will learn about

    * The runtime structure of ASP.NET Web applications

    * Storing application-specific configuration settings for easy deployment

    * Steps to set up a target IIS application

    * Methods for copying content, Web Forms pages, Web services, and assemblies

    * Deployment options in Visual Studio .NET


    Deploying applications has been a long-standing bane of many classic ASP developer''s
    existence, and for good reason. While it was easy enough to deploy or replace
    static content and the ASP files themselves, other portions of the applications,
    such as components and application-specific configuration settings, required greater
    effort to deploy and often necessitated a shutdown of the application to replace.


    Deployment is another one of the areas where the improvements in ASP.NET truly
    shine. ASP.NET eliminates many of the deployment shortcomings in classic ASP,
    making possible for the first time to deploy an ASP.NET application simply by
    copying all of the necessary files to the IIS application directory where the
    application will be deployed.


    This chapter will discuss the steps for deploying ASP.NET Web applications, both
    manually and through Visual Studio .NET.'
  merge: -1
  pgno: 464
