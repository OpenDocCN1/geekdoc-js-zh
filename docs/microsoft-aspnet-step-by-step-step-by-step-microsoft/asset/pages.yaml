  md: '# Migrating from ASP to ASP.NET


    Migrating classic ASP code to ASP.NET will be a relatively painless process in
    many cases, particularly if good programming practices were followed in writing
    the code, as separating the code into procedures wherever possible. Because of
    the changes to both the ASP object model and the Visual Basic language, which
    is used in ASP.NET in place of Visual Script Editing, it is likely that you will
    have to make some changes to most (if not all) of your classic ASP pages to make
    them run in ASP.NET. This appendix will look at some the issues you''re likely
    to run into this migration process, show you an example of migrating a page that
    accesses data using ADO, and discuss some programming practices that you can use
    in your ongoing classic ASP development to make the migration process easier.


    # Migration Overview


    Almost all of the issues you''ll encounter in migrating your classic ASP applications
    to ASP.NET fall into two categories: page structure and language changes. The
    next two sections will discuss the types of changes in each of these categories,
    and how you''ll need to update your code to work with them.


    # Page Structure Changes


    The page structure changes from classic ASP to ASP.NET can be further broken down
    into two areas: changes in the structure of code blocks and changes to the syntax
    of page directives.


    # Code Blocks


    As discussed in Chapter 9, there are significant changes between how code could
    be structured in classic ASP and how it can be structured in ASP.NET. These'
  merge: -1
  pgno: 496
- img_proc: true
  md: 'changes, which are designed to make your code more readable and maintainable,

    likely to be the most common issue in migration.


    In classic ASP, server-side code could be written in either render blocks, indicated
    by the syntax <% %>, or code declaration blocks, indicated by the <script runat="server"><script>
    syntax. Either syntax could be used anywhere in the page and contain either statements
    or procedures.


    One problem is that it could be difficult to tell which code would execute,

    leading to unnecessary buys. Another problem is that it was easy to write spaghetti
    code, with render blocks all over a page, mixing procedures and raw states. This
    made the code difficult to read and to maintain. Excessive mixing of HTML and
    render blocks also tended to negatively affect page performance.


    In ASP.NET, the purposes of render blocks and code declaration blocks have been
    narrowed considerably. Render blocks in ASP.NET can contain only executable statements,
    not procedures, while code declaration blocks can contain only global variables
    and/or procedures.


    Another significant difference is that in classic ASP, multiple <script runat="server">
    code declaration blocks could be used on a page, and each one could use a different
    language through the language attribute, which could be set to VBScript or JScript.
    ASP.NET only supports a single language per page, which is Visual Basic .NET by
    default.


    # Top-to-Bottom vs. Event-Driven Programming


    Classic ASP pages using render blocks always executed from top to bottom, with
    code in <% %> render blocks being executed and output to the response stream as
    it was encountered by the ASP interpreter.


    ASP.NET code is compiled into an instance of the Page class, and execution is
    event-based. Rather than placing start-up code in the first render block in a
    page, start-up code in ASP.NET is placed in the Page_Load event handler, which
    is fired when the instance of the Page class that represents the page is loaded
    into memory. Likewise, a Page_UnLoad event is fired just before the page is removed
    from memory and can be used to run any clean-up code that is necessary.


    # Page Directives


    In classic ASP, the primary directive used in pages was the @ Language directive,
    which specified the language to be used for render blocks. Other less commonly
    used directives included @ Codepage, @ EnableSessionState, @ LCID, and @ Transaction.'
  merge: -1
  pgno: 497
- img_proc: true
  md: '# Appendix A Migrating ASP to ASP.NET 479


    In.NET, these directives are attributes of the @ Page directive, which should
    appear at the top of each ASP.NET Web Form page. See Chapter 9 for a full discussion
    of the @ Page directive and its attributes.


    One new attribute of the @ Page directive that is important to discuss in this
    context is the Compat attribute. By default, ASP.NET runs as a multi-threaded
    apartment (MTA) process. This means that components run as single-threaded apartment
    (STA) components, as those written in Visual Basic 6, are not compatible with
    ASP.NET. This includes the ADO components, which are installed to run as STA components
    by default. (You can modify this by running a batch file that changes the registry
    settings for ADO, but that is beyond the scope of this discussion.) Setting the
    Compat attribute to true forces ASP.NET to run in STA mode, making it possible
    to use STA components in ASP.NET pages.


    > important

    Setting Compat to true should be considered a short-term solution in migrating
    from ASP to ASP.NET, because this setting can have a significant negative impact
    on the performance of your application. For best performance, you should rewrite
    components in earlier versions of Visual Basic using Basic .NET, and you should
    migrate existing ADO code to use ADO.NET.


    # Language Changes


    In addition to changes to the structure of pages in ASP.NET, there are significant
    changes to the Visual Basic language that will likely require modifications to
    your code. These include the following:


    +   Set and Let are no longer needed or supported. Object references can be set
    by simple assignment.

    Object1 = Object2


    +   Parens are now required for calling Sub procedures as well as Function procedures
    (including methods that do not have parameters).

    Response.Write("Hello, World!")


    +   The Variant data type does not exist in Visual Basic .NET. The replacement
    is Object.


    +   Default properties are no longer supported. All properties must be called
    explicitly.


    ```

    MyString = TextBox1.Text

    ```'
