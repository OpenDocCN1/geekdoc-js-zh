  md: "# Chapter 10 Using Server Controls 285\n\nFor example, you could query data\
    \ for a series of events and use a Calendar control to display them by adding\
    \ the dates to the calendar's SelectedDates collection. When a user clicks on\
    \ a selected date on the calendar, you could then display additional information\
    \ about the event on that date.\n\nYou could also allow users to specify one or\
    \ more dates for data entry by providing a Calendar control for them to click.\
    \ The Calendar control supports selection of both single dates and date ranges\
    \ (by week or month). Using a Calendar control for date entry instead of a text\
    \ box can help prevent errors in converting the date entered by the user into\
    \ a Date data type for storage or manipulation.\n\nTo create a Web Forms page\
    \ that uses a Calendar for data entry, complete these steps:\n\n+   1 Create a\
    \ new text file and save it as Calendar.aspx.\n\n+   2 Add the @ Page directive,\
    \ standard HTML elements, and an HtmlForm control to the page, as shown in the\
    \ previous example.\n\n+   3 Create the UI by adding three Label controls, two\
    \ RadioButton controls, two boxes, and a Calendar control to the HtmlForm. Note\
    \ that the GroupName property is used to make the radio buttons mutually exclusive.\n\
    \n```\n<font runat=\"server\">\n  <asp:label id=\"title\" text=\"Calendar Example\"\
    \n      font-name=\"Verdana\" font-size=\"18\" runat=\"server\"/>\n  <br/>\n \
    \ <asp:calendar runat=\"server\"/>\n  <asp:radiobutton id=\"Start\" text=\"Start\
    \ Date\"\n      groupname=\"Chooser\" runat=\"server\"/>\n  <asp:radiobutton id=\"\
    End\" text=\"End Date\"\n      groupname=\"Chooser\" runat=\"server\"/>\n  <br/>\n\
    \  <asp:label id=\"StartDateLabel\" text=\"Start Date\"\n      runat=\"server\"\
