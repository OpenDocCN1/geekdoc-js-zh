  md: '# ASP.NET Step by Step


    In addition to storing values in the Application collection, you can instantiate
    and store references to .NET components in application state using the <object
    runat="server"> tag syntax in the Global.asax file (or its associated code-behind
    file), as described in the previous chapter. These objects become part of the
    StaticObjects collection and can be referenced in ASP.NET Web Forms pages by referring
    to the id attribute associated with the object.


    ```

    Global.asax

    <object runat="server" id="MyClassInstance class="MyClassName" scope="Application">

    </object>

    ```


    ```

    Web Forms page

    Response.Write("Value = & MyClassInstance.MyValue)

    ```


    Note that Global.asax (or its associated code-behind file) is the only mechanism
    for creating object instances with Application scope.


    > important

    When you''re using either the Application or Session collections, it''s a good
    idea to initialize the variables you''re using to a default value (such as ""
    for a string or O for a numeric) in the Application_Start and Session_Start event
    handlers in Global.asax. You can then test for the default value as a way of determining
    whether it has been altered.


    # Synchronizing Access to Application State


    One challenge in managing state information that''s shared between multiple users
    is ensuring that no two users attempt to update the state information simultaneously,
    which could lead to corruption of the data stored. Like classic ASP, the ASP.NET
    Application object provides Lock and Unlock methods that developers use to ensure
    that only a single user can update application state information at any given
    time. Developers should call Application.Lock() prior to modifying data stored
    in the Application collection, and call Application.Unlock() once the modification
    is complete. Keep in mind that while the application is locked, no other users
    can modify data stored in the Application collection, which can cause scalability
    problems. For this reason, you should make to keep the application locked for
    the shortest time possible, and perform as little work as possible while the application
    is locked.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Chapter 6 Managing Application State


    # Recommendations for Application State


    Information stored in application state can be easily shared between all users
    of an application. This can make it very tempting to use application state to
    store all manner of data, from application settings such as database connection
    strings to cached datasets frequently used data state. In many cases, there are
    more efficient means of storing this data. The following table shows some examples
    of when you may or may not want to store information in application state, as
    well as alternatives for storing such information.


    | Application State Recommendations | Issues | Alternative |

    | --- | --- | --- |

    | Database connection strings or other application settings | Typically, these
    settings are accessed frequently. Storing this information in application state
    is not very efficient. | Use the Web.config file to store this information, and
    retrieve with the GetConfig object, as discussed.(See Chapter 7.) |

    | Datasets containing frequently read data | Caching frequently used data at the
    application level can be efficient, but there''s little automatic control over
    when the data is refreshed. | Use the ASP.NET cache engine to cache expensive
    or frequently read data. The ASP.NET cache engine provides fine-grained control
    over how and when data is refreshed or purged from the cache.(See Chapter 14 for
    more information.) |

    | Shared application flags or counter variables | Shared values that may be updated
    by multiple users of an application can present major scalability issues, as discussed
    in “State and Scalability” on page 107. | Consider storing shared application
    flags in a database, which will provide finer-grained control over the reading
    and updating of individual values. |

    | References to object instances | Storing references to objects with the wrong
    threading model (such as legacy COM components created with Visual Basic) can
    have a severe impact on the scalability of an application. | If it''s absolutely
    necessary to store a reference to an object instance, ensure that the class from
    which the object is created is thread safe. |'
  merge: -1
