  md: '# Comparing User Controls to Include Files


    User controls perform a similar function to server-side includes in classic ASP,
    but they''re considerably more powerful because of the level of integration with
    the page model. A user control can have its own controls, and it can save the
    viewstate of its controls or its own viewstate. This allows the user control to
    maintain its state across multiple controls without any effort on the part of
    the page containing the user control. User controls can expose both properties
    and methods, making them easy to understand for developers who are used to components.


    Include files are still available in ASP.NET, mainly for backward compatibility
    with classic ASP. For new applications, it makes more sense to use user controls,
    giving their advantages.


    # Using Server Controls


    Like controls, ASP.NET server controls allow developers to reuse functionality.
    ASP.NET comes with a wide variety of built-in server controls that provide a great
    deal of functionality that can reuse in their applications. These include controls
    that provide server-side equivalents of standard HTML controls, more advanced
    controls that mimic Visual Basic-style controls, and validation controls that
    allow powerful and robust validation of data entry. Developers can also create
    custom server controls to provide their own functionality.


    The code for adding a server control to a page is simple and straightforward,
    particularly for the built-in server controls. This section demonstrates how to
    add an HTML control (a server control from the System.Web.HtmlControls namespace),
    a Web control (a server control from the System.Web.WebControls namespace), and
    a custom server control to a page. The differences between HTML controls and Web
    controls are discussed in detail in Chapter 10. The creation of custom server
    controls is discussed in Chapter 12.


    One of the advantages of the built-in server controls is that they are available
    from any Web Forms page. You don''t need to make them available via the


    +   3 Browse HelloReference.aspx. Either type the URL for the virtual directory
    in which you saved the file, plus the file name, into the browser address box,
    as shown in the previous example. The output of the page should be the same as
    in the previous figure.'
