  md: '# Creating a Virtual Directory


    Creating a Virtual Directory in IIS is a relatively simple process.


    +   1. Click Start, Programs, Administrative Tools, Internet Services Manager
    to launch the Microsoft Management Console for IIS. (These instructions are for
    Windows 2000. In Windows NT 4.0, the Internet Service Manager console is located
    in the Windows NT 4.0 Option pack folder).


    +   2. Expand the node for your computer by clicking the + symbol next to the
    computer''s name.


    +   3. Right-click the Default Web site node (you can also right-click the node
    for another Web site if you have one set) and select New, Virtual Directory. You''ll
    see something like the following figure.


    ![](img/50a47de1541381ea3363945ae9c22411_38_0.png)


    +   4. On the first page of the Virtual Directory Creation Wizard, click Next.


    +   5. On the second page, enter an alias (name) for the new virtual directory.
    This name will be used to access the content in the virtual directory from a Web
    browser. For this example, use the name ASPNETTest. Click Next.


    +   6. Enter the path to the directory in the file system where you''d like to
    keep the content for the virtual directory. This can be an existing folder or
    a new folder. If you''re using an existing folder or you''ve already created the
    new folder for the content, you can use the Browse button to find the folder you
    want. For this example, use C:\inetpub\WWWroot\ASPNETTest. Click Next.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# ASP.NET Step by Step


    # note


    In cases, the file system directories for virtual directories of the default Web
    site are stored under the C:\NetPub\WWWRoot folder. InetPub is a special folder
    set up by the IIS installation process, and WWWRoot is a folder set up to the
    root of the Web server content.


    This doesn''t mean that you have to use WWWRoot as the parent folder for your
    Web content folders, but it can be a convenient way of organizing all your content
    in a single easy-to-find location. You should keep in mind, how-ever, by using
    WWWRoot (particularly on the default installation location of the C drive) puts
    all of your applications in a well-known location, which can make easier for hackers
    to deface your sites or locate important information to steal.


    On the Access Permissions page, you can alter the settings that determine how
    users can access the content in your new virtual directory. The default settings
    are fine in this case, so click Next.


    # important


    > Use caution when altering the access permissions for a virtual directory. Allowing
    Write, Execute, and/or Browse permissions on your virtual directory can allow
    unfriendly individuals to alter your content or execute damaging code on your
    server. Only alter these settings if you understand the implications of doing
    so.


    That''s it! Your virtual directory is complete. Click Finish.


    Now that you''ve created your ASPNETTest virtual directory, go ahead and save
    the HTML document listed earlier.


    +   Open Notepad. Click Start, Programs, Accessories, Notepad.


    +   Type in the HTML code shown on page 18.


    +   Save the document to the file system folder that you created to hold the contents
    of your virtual directory. Make the name ASPNETHello.aspx.


    Now that you''ve saved the document, you should be able to view it. Open a Web
    browser and enter the following URL:


    ```

    http://localhost/ASPNETTest/ASPNETHello.aspx.

    ```'
