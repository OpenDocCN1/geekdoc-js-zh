    \ files (*.config) and source files (*.vb and *.cs, for example).\n\nThe <httpHandlers>\
    \ element supports three child elements, <add>, <remove>, and <clear>, and has\
    \ the following syntax:\n\n```\n<httpHandlers>\n<add>\n  path=\"path\"\n  type=\"\
