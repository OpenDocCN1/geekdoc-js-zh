    HelloString = "Hello World!"

    ''Write HelloString to browser

    Response.Write(HelloString)

    ''Lifetime of HelloString will not end after next line

    End Sub

    ```


    # Scope


    Related to the lifetime of a variable is its scope. Scope, also known as visibility,
    refers to the region of which a variable may be accessed. The scope of a variable
    depends on where the variable is declared, and in Visual Basic .NET it can include
    the following levels:


    +   - Block-level Variables declared within an If...Then, For...Next, or Do...Loop
    block. Although the scope of block-level variables is limited to the block in
    which they''re declared, their lifetime is that of the procedure in which the
    block appears.


    +   - Procedure-level Also known as local variables, these are visible only within
    the procedure in which they''re declared.


    +   - Module-level In modules, classes, or structures, any variable declared outside
    of a procedure is referred to as a module-level variable. The accessibility of
    module-level variables is determined by any accessibility keywords used in their
    declaration (see “Accessibility” on page 59).


    +   - Namespace-level Variables declared at module level, but with public accessibility
    (Public or Friend), are referred to as namespace-level variables. They''re available
    to any procedure in the same namespace that contains the module in which the variable
    is declared.


    The important distinction between lifetime and scope is that a variable may be
    out of scope (that is, unavailable) without having reached the end of its lifetime.
    The preceding example of a Static variable declared within a procedure is a good
    example of this. In example, the variable HelloString will continue to exist even
    after the procedure in which it''s declared has completed, but because it has
    procedure-level scope, it''s only accessible within the procedure. Here are some
    good programming practices to follow:


    +   - Limit your variables to the narrowest possible scope that will allow you
    to accomplish your objectives.


    +   - Avoid using the same name for variables of different scope within the same
    module. Using the same name in such situations can lead to confusion and errors.'
