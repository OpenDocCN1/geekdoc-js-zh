    gives it the ID MyHello. It also provides a placeholder in the page for any output
    generated by the user control.

    The last thing you need to do is set the Name property of the user control and
    call its SayHello method, which you''ll do by adding a Page_Load method to the
    page. Note that you can also define a Page_Load method in the user control to
    have the user control take care of setting its property and calling its method.
    To set the property and call the method when your Web Forms page is loaded, follow
    these steps:


    +   1 Add the following code in the <head> section of the HelloContainer.aspx
    page, as shown here:

    <head>

