    # Understanding Object-Oriented Programming Basics


    Something that will probably be new to many Visual Basic programmers, as well
    as those new to programming entirely, object-oriented programming. This section
    will provide an overview of object-oriented programming, particularly as it relates
    to the .NET development platform. Object-oriented programming is a substantial
    topic, so it''s highly recommended that you do some additional reading to supplement
    the material provided here. The Studio documentation contains an entire section
    on object-oriented programming that is a good place to start. There are also many
    books on object-oriented programming and design patterns, a related subject.


    In the simplest terms, an object is an instance of a class in an object-oriented
    language such as C#, and now Visual Basic .NET. Objects typically mirror their
    real-world counterparts: employees, invoices, and purchase orders are all examples
    of real-world entities that can be modeled as objects in your programs. Objects
    typically provide both properties, which describe some attribute of the object
    (for example, an employee might have an EmployeeID property), and methods, which
    allow actions to be taken by the object (for example, an invoice might expose
    a Process method). Properties and methods make it easier for programmers to know
    how to use a given object.


    In addition to properties and methods, object-oriented programming offers three
    helpful features: inheritance, polymorphism, and encapsulation.


    Inheritance is the ability to create new classes that are derived from existing
    classes. A derived class "inherits" all of the properties and methods of the class
    from which it is derived (referred to as the parent class). Programmers can then
    add properties and methods to the derived class, or in some cases override the
    implementation of an existing method inherited from the parent class.


    Polymorphism lets programmers have identically named methods on different classes,
    and it allows the correct method to be executed in the context of the call. For
    example, a programmer could define an Invoice class with a Process method. The
    programmer could then define TimeInvoice and Materials-Invoice classes that are
    derived from the Invoice class, but which might or might not use the same implementation
    of the Process method exposed by the parent class.'
