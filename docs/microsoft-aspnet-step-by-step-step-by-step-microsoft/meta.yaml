  md: "# Cookieless Sessions\n\nOne ongoing challenge for Web developers using classic\
    \ ASP is how to handle session for users whose browsers can't or won't accept\
    \ cookies. Classic ASP provided no intrinsic session for this situation. In ASP.NET,\
    \ it's relatively simple.\n\n+   1 Open the Web.config configuration for your\
    \ application and locate the sessionState configuration section.\n\n+   2 Change\
    \ the cookieless attribute from \"false\" to \"true\".\n\n+   3 The complete sessionState\
    \ configuration section would look like the following (note that the stateConnectionStringString,\
    \ sqlConnectionString, and timeout attributes have been omitted).\n\n```\n<sessionState\n\
    \  cookieless=\"true\"/>\n```\n\nThe cookieless attribute is set to \"true\",\
    \ ASP.NET will automatically embed the SessionID value in the URL for all requests.\
    \ For best results, always use relative URLs for internal links within your application.\
    \ Relative URLs contain only the path and file information for the requested resource,\
    \ and not the protocol, which are assumed to be the same as the current page.\n\
    \n# Formatting URLs for Cookieless Sessions\n\nASP.NET provides automatic embedding\
    \ of session IDs in the relative URLs within your application, but not for absolute\
    \ URLs, nor for URLs from outside yours. If a request for a page within an application\
    \ set up for cookieless sessions is received that doesn't contain an embedded\
    \ session ID, ASP.NET will create a new session ID and embed it in the URL for\
    \ that request.\n\nIn order to prevent this problem, you can manually format URLs\
    \ by calling the ApplyPathModifier method of the Response intrinsic object, and\
    \ passing it a virtual path. The method will return an absolute URL containing\
    \ the embedded SessionID for use with cookieless sessions. An absolute URL includes\
    \ the protocol, domain, path and file name necessary to request a given resource.\
    \ The syntax for this method is as follows:\n\nDim myAbsoluteURL As String\n\n\
    ```\nmyAbsoluteURL = Response.ApplyPathModifier(\"foo.aspx\")\n```"
  merge: -1
  pgno: 131
- img_proc: false
  md: '# Using Client-Side Cookies for State Storage


    A discussion of state management would be incomplete without at least a brief
    mention of another option for storing application state: client-side cookies.
    This method does not work with users whose browsers cannot handle cookies (or
    who have turned off cookies), but it''s the most lightweight method for storing
    certain types of data because it requires no resources on the Web server.


    Follow these steps to store user state in a nonpersistent cookie:


    +   Create a new instance of the HttpCookie class.

    Dim MyCookie As New HttpCookie("MyCookie")


    +   Set the Value property of the cookie to the desired value.

    MyCookie.Value = "MyValue"


    +   Add the cookie to the Cookies collection of the Response object (exposed by
    the Page class).

    Response.Cookies.Add(MyCookie)


    This sets a cookie called "My Cookie" that lasts until the user closes the browser.


    # Using Persistent Cookies


    To store state that will persist across multiple browser sessions, you need to
    use persistent cookies. In order for a cookie to be persistent, its expiration
    must occur in the future. To make the cookie created in the previous example persist
    for two days, add the following line of code, just prior to adding the cookie
    to the Response.Cookies collection:

    MyCookie.Expires = Now.AddDays(2)


    Here are some things to consider about using cookies.


    +   Cookies have a bad reputation due to their misuse by some Web companies to
    track the surfing habits of Web users. It''s a good idea to explain exactly how
    and why you are using persistent cookies, and describe the benefits of accepting
    those cookies.


    +   Keep the expiration of persistent cookies within a reasonable amount of time.
    For most sites, cookie expiration should be measured in hours or days, or at most
    months. Setting your cookie expiration to years in the future is likely to result
    in more users refusing your cookie.'
  merge: -1
  pgno: 132
- img_proc: false
  md: 'Never store user data, such as credit card numbers or other data that could
    be at risk if intercepted or otherwise compromised, in a cookie.


    # important


    Although it may seem obvious to avoid storing information such as credit card
    numbers in cookies, it''s equally important to consider the security implications
    of storing such information on the server side, whether in session state in memory,
    or in a database server. There''s no single right answer to how to store sensitive
    data, here are some guidelines you should follow:


    +   - Store sensitive data only if you must, and then for the minimum length of
    time necessary.


    +   - Encrypt sensitive data to better protect it from being compromised.


    +   - When possible, archive sensitive data on systems that are not connected
    to the Internet (and are thus less vulnerable to being compromised).


    +   - Make sure that you follow good security practices on all of your servers,
    particularly those exposed to the Internet. (We''ll cover security detail in Chapter
    8.5)


    Following these guidelines won''t guarantee that your Web applications will never
    be compromised by crackers, they''ll help you limit the damage.


    # ASP.NET Server Control State


    Finally another kind of state that is managed by ASP.NET is server control state.
    Developers who use classic ASP to create data-driven applications had to figure
    out how to maintain the state of the various HTML form elements on their ASP pages
    from one page to the next, or between submissions of a page to itself. HTML provides
    no built-in mechanism for maintaining the state of individual form elements, so
    developers were to come up with their own methods of maintaining and restoring
    this information.


    ASP.NET provides a solution to this challenge with the server control architecture.
    All ASP.NET server controls are capable of maintaining their own state through
    a mechanism known as ViewState. ViewState is maintained on a page-page basis as
    a hidden form field that contains all of the state information for all of the
    form elements on that page.


    ViewState and server controls are discussed in detail in Chapters 10 and 12.'
  merge: -1
  pgno: 133
- img_proc: false
  md: '# Chapter 6 Managing Application State


    # Chapter 6 Quick Reference


    | To | Do This | Example |

    |---|---|--|

    | Store information in the Application collection | Use either the Application
    object or the Application.Contents collection to add the item to the collection,
    or use the Application.Add method. | Application(key) = value <br><br> Application.Contents(key)
    = value <br><br> Application.Add(key,value) |

    | Modify information in the Application collection | Use the Application object
    to access and modify the item by its key or index, or use the Application.Set
    method to access and modify the item by its key. | Application(key) = newvalue
    <br><br> Application(index) = newvalue <br><br> Application.Set(key,newvalue)
    |

    | Create and store an object in the ApplicationStaticObjects collection | Add
    an <Object> tag in Global.asax with the runat="server" attribute and the scope="application"
