  md: '# ASP.NET Step by Step


    To select Windows authentication as the authentication type used by ASP.NET


    +   Open the Web.config file for the application in your preferred text editor
    or Visual Studio .NET (Note: Visual Studio .NET color-codes configuration files.)


    +   Modify the <authentication> configuration section as follows. (Note: you can
    select the authentication method only at the application or server level. Attempting
    to add the <authentication> tag to a Web.config in a subdirectories will result
    in an error)


    <authentication mode="Windows" />


    +   If desired, you can have ASP.NET impersonate the logged-in user (so that resource
    requests are made in the security context of the logged-in user) by adding an
    <identity> section as follows (see "Using Impersonation" on page 203 for more
    on impersonation):


    <identity impersonate="true"/>


    +   Save and close the Web.config file.


    Once you have set the authentication mode to Windows, you will need to set the
    desired authorization method to protect the desired resources.


    # Using Passport Authentication


    Passport authentication uses the centralized Passport authentication service provided
    by Microsoft. Passport authentication gives users a single login to use with any
    Passport-enabled site. In order to use Passport authentication with ASP.NET, you
    must download and install the Passport SDK, which is available at http://www.passport.com/business.
    ASP.NET provides a wrapper around the Passport authentication service, so you
    can use it by setting the appropriate value for the Web.config <authentication>
    tag.


    To configure ASP.NET to use the Passport authentication method


    +   Open the Web.config file for the application in your preferred text editor
    or Visual Studio .NET (Note: Visual Studio .NET color-codes configuration files.)


    +   Modify the <authentication> configuration section as follows:

    <authentication mode="Passport" />


    +   If desired, you can set up an internal redirect URL for Passport authentication
    by adding a <passport> section as follows:

    <passport redirectUrl="<URL">


    +   Save and close the Web.config file.'
