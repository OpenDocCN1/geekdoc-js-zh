  md: '# Creating a Virtual Directory


    Creating a Virtual Directory in IIS is a relatively simple process.


    +   1 Click Start


    +   2 Expand the node for your computer by clicking the + symbol next to the computer''s
    name.


    +   3 Right-click the Default Site node (you can also right-click the node for
    another Web site if you have one up) and select New, Virtual Directory. You''ll
    see something like the following figure.


    ![](bbox=[0.193, 0.355, 0.715, 0.603])


    +   4 On the first page of the Virtual Directory Creation Wizard, click Next.


    +   5 On the second page, enter an alias (name) for the new virtual directory.
    This name will be used to access the content in the virtual directory from a Web
    browser. For this example, use the name ASPNETTest. Click Next.


    +   6 Enter the path to the directory in the file system where you''d like to
    keep the content for the virtual directory. This can be an existing folder or
    a new folder. If you''re using an existing folder or you''ve already created the
    new folder for the content, you can use the Browse button to find the folder you
    want. For this example, use C:\Innetpub\WWWRoot\ASPNETTest. Click Next.'
  merge: -1
  pgno: 38
- img_proc: false
  md: '# note


    In most cases, the file system directories for virtual directories of the default
    Web site are stored under the C:\NetPub\WWWRoot folder. InetPub is a special folder
    set up by the IIS installation process, and WWWRoot is a folder set up as the
    root of all Web server content.


    This doesn''t mean that you have to use WWWRoot as the parent folder for your
    Web content folders, but it can be a convenient way of organizing all of your
    content in a single easy-to-find location. You should keep in mind, how-ever,
    that using WWWRoot (particularly on the default install location of the C drive)
    puts all of your applications in a well-known location, which can make easier
    for hackers to deface your sites or locate important information to steal.


    On the Access Permissions page, you can alter the settings that determine how
    users can access the content in your new virtual directory. The default settings
    are fine in this case, so click Next.


    # important


    Use caution when altering the access permissions for a virtual directory. Allowing
    Write, Execute, and/or Browse permissions on your virtual directory can allow
    unfriendly individuals to alter your content or execute damaging code on your
    server. Only alter these settings if you understand the implications of doing
    so.


    +   7 That''s it! Your virtual directory is complete. Click Finish.


    Now that you''ve created your ASPNETTest directory, go ahead and save the HTML
