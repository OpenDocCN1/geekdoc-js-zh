  md: '# @ Implements


    The Implements directive is used to implement a defined interface from within
    an ASP.NET page. An interface provides an abstract definition of a set of methods
    and properties. When you implement an interface, you commit to supporting the
    methods and properties defined by the interface, and you must match method and
    property definitions in your .aspx file, using <script> blocks. The @ Implements
    directive cannot be used to implement interfaces in a code-behind file. It has
    one attribute, interface, which specifies the interface being implemented.


    # @ Register


    The @ Register directive is used with both user controls and custom server controls
    to register them for use within a page. The @ Register directive''s attributes
    are listed in the following table.


    | Attribute | Value | Purpose |

    |---|---|---|

    | Assembly | Any valid assembly name. The assembly should not contain a file extension.
    | Specifies the precompiled assembly for a custom server control. Used with the
    Namespace and TagPrefix attributes. The assembly name needs to be available to
    the application, either by being placed in the bin subdirectory of the application
    or by installed in the global assembly cache. |

    | Namespace | Any valid namespace name. | Specifies the namespace to be associated
    with the tag prefix specified by the TagPrefix attribute. |

    | Src | Any valid path to a user control (.ascx) file Accepts either relative
    or absolute URLs. | Specifies the location of a user control associated with a
    TagName/TagPrefix pair. |

    | TagName | Any string (must be valid for XML). | Specifies an alias for a user
    control to be used in implementing the control within the page. Must be used with
    the TagPrefix attribute. |

    | TagPrefix | Any string (must be valid for XML). | Specifies an alias for a tag
    prefix for a user control or custom server control to be used in implementing
    the control within the page. If without the TagName attribute, as with a custom
    server control, the tag name is the same as the class name defined in the server
    control assembly specified by the Assembly and Namespace attributes.|'
