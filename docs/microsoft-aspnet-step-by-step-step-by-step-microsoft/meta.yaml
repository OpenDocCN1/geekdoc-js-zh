  md: '# Access Permissions


    Before you select Execute, Write, or Browse permissions, you should make sure
    that you understand the security implications of each one. These settings can
    make your application vulnerable to attacks by hackers if used improperly. The
    following list explains the purpose of each avail-able access permission and when
    it’s appropriate to use.


    +   - Read Clients can read files with this permission set. This is selected by
    default.

    - Run Scripts This allows scripts in files such as ASP files to be executed, but
    does not allow executables (.exe, .dll) to be run.

    - Execute This allows executable file types such as .exe and .dll applications
    to be executed, as well as Common Gateway Interface (CGI) applications.

    - Write Clients can write to a directory with this permission set. Use this permission
    only when necessary.

    - Browse Clients entering a URL that doesn’t specify a file name or a default
    document (such as index.htm or default.asp) will receive a listing of the files
    in the directory they’re browsing. Because this information can help malicious
    users compromise your application, the Browse permission should be limited to
    situations where browsers-ing the intended behavior.


    Some of these permissions should be used rarely, if at all, on production systems.
    More importantly, you should avoid certain combinations of permissions, such as
    Write and Run scripts or Write and Execute. These combinations could allow a malicious
    user to upload and execute scripts or other executable content that would compromise
    your server or data. If you need to allow Write permissions, always set up a separate
    folder that doesn’t allow Run Scripts or Execute permissions.


    As noted in Chapter 2, all you need to form a valid ASP.NET page is a valid HTML
    file with the extension .aspx. Of course, such a page wouldn’t be especially useful,
    so you probably want to take a few more steps. The first step is choosing a development
    language for the page.'
  merge: -1
  pgno: 106
- img_proc: false
  md: '# 88 ASP.NET Step by Step


    # note


    You might be wondering what the difference is in IIS between a directory and a
    virtual directory. A directory is any file system folder or directory within the
    home directory of your application root or virtual directory. A virtual directory
    allows you to make a file system folder or directory outside your home directory
    so that it appears to clients be residing within the home directory.


    For example, the default home directory for the Web site is C:\InetPub\wwwroot\.
    Content within this folder can be accessed locally via the URL http://localhost/.
    To make content residing in C:\WebApp available via the URL http://localhost/MyWebApp/,
    you would need to create a virtual directory (or an application root, if you wanted
    MyWebApp to define an application boundary) in the default Web site that maps
    the MyWebApp alias to the folder C:\MyWebApp\.


    # Choosing a Page Language


    Unlike developing in Visual Studio .NET, creating your own ASP.NET pages from
    scratch gives you the freedom to write your pages in any .NET language, regardless
    of whether other pages in your Web application use a different language. In all
    likelihood, using multiple languages in the same application will make your code
    more difficult to maintain, but you''re free to do it. Once you''ve chosen the
    language for your page, you can make your choice known to ASP.NET by adding the
    following line to the top of your HTML file:


    ```

    <@ Page Language="languagechoice" %>

    ```


    # note


    Before starting creating pages and other content, take a moment to think about
    how you plan to organize that content. For example, consider using an images folder
    to keep the images for your Web application separate from the rest of your content.


    Something else to consider if you''re planning to use your custom components is
    that, by default, ASP.NET will load any .NET assemblies found in a bin folder
    under your application root. So if you want your ASP.NET pages to be able to locate
    your custom .NET components, you need to create a bin folder and ensure that your
    assemblies are located there.'
  merge: -1
  pgno: 107
- img_proc: false
  md: 'Here, languagechoice is the language you want to develop the page in. If you
    want to develop in Visual Basic .NET, the @ Page declaration would look like the
    following:


    ```

    <@ Page Language="VB" %>

    ```


    In C#, the declaration would be


    ```

    <@ Page Language="C#" %>

    ```


    So a page like the one you looked at in Chapter 2, with the @ Page directive,
    would look like the following code:


    ```

    <@ Page Language="C#" %>

    <html>

    <head>

    <title>First ASP.NET Page!</title>

    </head>

    <body>

    <p>Hello World!</p>

    </body>

    </html>

    ```


    Any code located in either <script> blocks or <% %> render blocks in the preceding
    code will be assumed to be C# code.


    # Code Location Options


    Another important choice to make when creating ASP.NET pages from scratch is whether
    to place the code in the .aspx file itself or a code-behind module. Using code-behind
    modules has the advantage of providing much better separation of code from presentation
    (HTML). This can make it easier to debug your code, and it also makes it easier
    for teams of UI designers and developers to work together without breaking one
    another’s work. Since code-behind allows you to create .aspx files that consist
    solely of HTML tags and tag-based server and user controls, it’s much easier for
    UI designers to work with the .aspx files without breaking the code behind them.'
  merge: -1
  pgno: 108
- img_proc: false
  md: '# note


    While the theoretical benefit of separating code from presentation using code-behind
    modules is substantial, the practical benefit may be limited by the tools used
    by the UI design team. It is reasonable to expect that many, if not most, Web
    design tools will eventually recognize and support custom ASP.NET tags (such as
    those used for server controls and user controls). However, at the time of this
    writing, many of these tools don''t recognize these tags and may respond with
    error messages when you try to edit the files.


    Many Web design and development tools and editors post updated syntax and dictionary
    files on their Web sites. If your development tool doesn''t support ASP.NET server
    control tags out of the box, check its manufacturer''s Web site to see if an update
    is available.


    If you choose to use code-behind for your ASP.NET code, you''ll need to add the
    src attribute to the @ Page directive to tell ASP.NET where to find your code
    module, as follows:


    ```

    <@ Page Language="C# src="filename.cs %>

    ```


    You''ll also need to add the inherits attribute to tell ASP.NET which namespace
    and class the code-behind file exposes.


    ```

    <@ Page Language="C#" src="filename.cs" inherits="MyClass" %>

    ```


    You''ll learn more about code-behind and its use in ASP.NET Web Forms in Chapter
    9.


    # Creating a Global.asax File


    In addition to creating your application root and adding subfolders and content,
    you can also add a file called Global.asax to your Web application. Global.asax
    (which is added to Visual Studio .NET applications by default) is a file that
    is primarily used to provide application and session (per-user) start-up and clean-up
    code, as well as to set options that are to apply to the application as a whole.
    In Global.asax, you can


    +   * Respond to selected application and session events.'
  merge: -1
  pgno: 109
- img_proc: false
  md: "# Chapter 5 Creating an ASP.NET Web Application\n\n+   Register assemblies\
    \ for use in your application using the @ Assembly directive.\n\n+   Create instances\
    \ of application-level objects using the <object runat=\"server\"> tag syntax.\n\
    \n# Using the OnStart and OnEnd Handlers\n\nOne downside of manually adding a\
    \ Global.asax file to your project instead of having it added for you by Visual\
    \ Studio .NET is that you need to add each of the appropriate application and\
    \ session event handlers manually. However, the benefit is that you can selectively\
    \ add only the event handlers you actually use, rather than having handlers for\
    \ all of the available events. The set of events that Visual Studio .NET automatically\
    \ handles in Global.asax as follows:\n\n+   Application_OnStart This event is\
    \ fired when the first request for your .aspx page in your application is received.\
    \ It can be used to initialize application-level variables necessary for your\
    \ application or to execute other start-up code.\n\n+   Session_OnStart This event\
    \ is fired when a request comes from a user who does not have a current session\
    \ in your application. (By default, this is determined by whether a SessionID\
    \ cookie is passed with the request.) It can be used to initialize session-level\
    \ variables or to execute per-user start-up code.\n\n+   Application_BeginRequest\n\
    \n+   Application_EndRequest\n\n+   Session_OnEnd\n\n+   Application_OnEnd\n\n\
    A typical set of Global.asax event handlers in Visual Basic .NET would look like\
    \ the following:\n\n```\n<script language=\"VB\" runat=\"server\">\nSub Application_OnStart()\n\
    \  ' Application start-up code goes here...\nEnd Sub\nSub Session_OnStart()\n\
    \  ' Session start-up code goes here...\nEnd Sub\nSub Session_OnEnd()\n  ' Session\
    \ clean-up code goes here...\nEnd Sub\nSub Application_OnEnd()\n  ' Application\
    \ clean-up code goes here...\nEnd Sub\n```\n\n![](bbox=[0.946, 0.346, 0.98, 0.593])"
