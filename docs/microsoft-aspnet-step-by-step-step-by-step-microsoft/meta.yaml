  md: '# The Page Class


    The Page class provides much of the functionality of an ASP.NET page. Pages can
    take advantage of this functionality because every page derives from the Page
    class and inherits all of the methods and properties that it exposes. Some of
    the more notable members of the Page class, which resides in the System.Web.UI
    namespace, are included in the following list.


    +   - The ASP Intrinsic objects (Application, Session, Request, Response, Server,
    and Context) are implemented in ASP.NET as class instances, which are exposed
    as properties of the page object. For example, the Server functionality is provided
    by a class called HttpServerUtility. Because the instance of HttpServerUtility
    is exposed as the Server property of the Page class, you can call its methods
    (Server.Transfer, for example) as you could in classic ASP.

    - The Controls collection provides access to the collection of controls defined
    for the page. As you''ll see later in this chapter, you can use this collection
    to add or modify controls on a page using this collection.

    - The PostBack property allows you to determine whether the current request is
    a GET request or a POST request resulting from the current page being posted to
    itself. This is very useful in deciding what to do when loading a Web Forms page,
    as you''ll see later in this chapter.

    - The User property provides access to information about the currently logged-in
    user.

    - The Cache property provides access to the ASP.NET cache engine, allowing data
    to be cached for later retrieval.

    - The FindControl method allows you to locate a control contained in the page''s
    Controls collection by specifying its ID property.

    - The ViewState provides access to a state dictionary (based on the StateBag class)
    that allows you to store information in Key/Value pairs. This information is passed
    with each request as a hidden HTML form field.

    - The ClearChildViewState method allows you to delete all viewstate information
    for any child controls on the page. This is useful if you want these controls
    to maintain their state most of the time, but you want to clear the state programmatically
    under specific circumstances.'
  merge: -1
  pgno: 246
- img_proc: false
  md: "# ASP.NET Step by Step\n\nMany other properties and methods are exposed by\
    \ the Page class. A substantial number of these are inherited from the Control\
    \ class, from which the Page class is derived, the Object class, from which the\
    \ Control class (and ultimately, every other class) is derived. This is an example\
    \ of how inheritance allows you to build a very rich object model.\n\nThere are\
    \ two methods by which an ASP.NET page is inherited from the Page class. The first\
    \ is adding the @ Page directive to an .aspx file, which automatically makes all\
    \ of the properties and methods of the Page class available to any code written\
    \ in the page. The second method, which is discussed in more detail later in this\
    \ chapter, inheriting from the Page class in a code-behind class that is associated\
    \ with the page by either the Src or Inherits attribute. This not only makes all\
    \ of the members of the Page class available to the code-behind, but it allows\
    \ ASP.NET to combine the code in the Web Form's .aspx file with the code-behind\
    \ class into a single compiled class at compile time. This single compiled class\
    \ contains all of the methods and properties exposed by the Page class, as well\
    \ as any methods and properties implemented by your code.\n\nAny of the members\
    \ of the Page class can be called within code without explicitly using the page\
    \ name. For example, to write to the browser using the Write method of the Response\
    \ object, you would use the following code:\n\n```\n<%\n  Response.Write(\"Hello,\
    \ World!\")\n%>\n```\n\nYou could also use\n\n```\n<%\n  Page.Response.Write(\"\
    Hello, World!\")\n%>\n```\n\nBut it is not necessary to add the Page property\
    \ because the Response property and the other Page members are exposed directly.\n\
    \n# Writing Code in Web Forms\n\nOne of the strengths of classic ASP was that\
    \ it gave you a lot of flexibility in writing your code. You could write your\
    \ code inline with the HTML markup, as a part of <% % %> render blocks. You could\
    \ write your code in subroutines in render blocks. And you could write your code\
    \ in <script> declaration blocks, either as arbitrary code or as subroutines."
  merge: -1
  pgno: 247
