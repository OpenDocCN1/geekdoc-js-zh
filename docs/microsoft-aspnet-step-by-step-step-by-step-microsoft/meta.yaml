  md: '# Options


    One of the most dramatic areas of improvement in Visual Studio .NET is in the
    area of customization. Much of the customization available in Visual Studio .NET
    is controlled from the Options dialog box, shown in the following figure. As mentioned
    earlier, you can access this dialog by selecting Tools, Options. Not only has
    the number of options increased significantly, but the degree of control over
    particular options has increased as well.


    ![](bbox=[0.166, 0.263, 0.753, 0.542])


    One good example of this increased control is in the area of code formatting.
    Visual InterDev developers will no doubt remember the frustration of having the
    VI editor reformat their ASP code when switching from Design to Source view. Visual
    Studio .NET performs code formatting, but the developer has language-by-language
    control over this formatting (Note that not all languages use auto-formatting,
    so they won''t have these options). Go to the Text Editor option folder, choose
    the language (for example, HTML or CSS), and set the options to your preferred
    setting. This way, you can determine how formatting is applied to your code, or
    for some languages, you can turn off formatting entirely.


    > note

