    | Attribute | Purpose |

    | --- | --- |

    | Duration | Number of seconds. (Required.) | Specifies the time, in seconds,
    for the page or control to be cached. |

    | Location | One of the following: Any Client Downstream Server (Required.) |
    Specifies the location where cached output should be stored. |


    VaryByCustom Any valid text string. Specifies a custom string by which to vary
    the output cache. If browser is used, output caching will vary based on the browser
    name and major version. If you want to vary by HTTP request data other than the
    browser, you will need to override the GetVaryByCustomString method of the HttpClient
    class in Globalasax to implement your custom string.


    VaryByHeader List of valid HTTP headers, separated by semicolons. Specifies one
    or more HTTP headers to vary the output cache. When a request is received with
    a value for the specified HTTP header(s) that does not match that any of the cached
    pages, a new version of the page will be rendered and cached. This attribute may
    not be used with user controls.


    VaryByParam List of querystring keys or form field names, separated by semicolons,
    or one of the following: none * (Required.) Specifies one or more of either querystring
    keys passed with a GET request, or form field names with a POST request to be
    used to vary the output cache. When a request is received with a value for one
    of the specified parameters that does not match that of the cached pages, a new
    version of the page will be rendered and cached. If the value of this attribute
    is set to none, the output cache will not vary based on GET and POST parameters.
    If the value is set to *, the output cache will vary by all GET and POST parameters.


    (continued)'
