    # <globalization>


    The <globalization> element controls globalization settings for ASP.NET applications.
    This includes the encoding used for requests, responses, and files, as well as
    settings for specifying the culture to be associated with Web requests and local
    searches. The <globalization> element has the following syntax:


    ```

    <globalization

    culture="any valid culture string"

    fileEncoding="any valid encoding string"

    requestEncoding="any valid encoding string"

    responseEncoding="any valid encoding string"

    uiCulture="any valid culture string" />

    ```'
