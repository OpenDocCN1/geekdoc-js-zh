    # Mind Those Ports!


    Internet applications communicate via the TCP/IP protocol, which is the basis
    for all communication between computers on the Internet. TCP/IP uses two pieces
    of information to find the endpoints for a given communication: the IP address,
    which is a unique number assigned to a given machine, and a TCP port number, which
    for most applications is a well-known number used consistently by all applications
    of that type. For example, All servers use port 80 as the default for HTTP (Web)
    communications. The well-known nature of these port numbers and the services found
    on them makes it much easier for Web servers and clients to find one another.


    Other well-known ports include File Transfer Protocol (FTP, port 21), Simple Mail
    Transport Protocol (SMTP, port 25), and POP3 (port 110). The full list of well-known
    ports and the services assigned to them can be found at http://www.iana.org/assignments/port-numbers.


    Why is this important to the discovery of security and Web server set-up? Because
    the very easy of discovery that well-known port numbers makes possible also presents
    a security risk for the unwary. For example, on Windows 2000, the ports for services
    such as FTP, SMTP, and POP3 (among others) are left open by default. This gives
    hackers an invitation to probe these ports and the software behind them vulnerable
    to attack. Given the many vulnerabilities discovered in FTP, SMTP, and other Internet-based
    services, it is essential to close all ports that are not use in your application.


    Closing ports can be accomplished in a number of ways, the most common being packet
    filtering (either through firewall software or a hardware router) or using the
    Windows 2000 IPSecurity Policy Management MMC snap-in. For many applications,
    the preferred solution is to set up a hardware firewall between the Web server
    and the Internet that only allows traffic on port 80 (HTTP), and optionally port
    443 (HTTPS) if secure sockets Web traffic is required. (See “SSL to Protect Communications”
    on page 188 for more information on Secure Sockets Layer communication.) Then
    a second firewall is added between the Web'
