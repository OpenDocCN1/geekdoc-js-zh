    # Languages and Visual Tools


    One of the best things about the .NET platform is that, whereas classic ASP restricted
    developers to scripting languages (with their inherent limitations), ASP.NET lets
    you work with any .NET-compliant language. This means that the code you write
    in ASP.NET is compiled for better performance, and you can take full advantage
    of advanced language features.


    For the .NET platform, languages (and the tools with which you''ll use them) are
    one of the most important topics to discuss, and they''re covered throughout this
    book. For now, let''s take a high-level look at some of the languages and tools
    that will be available for developing .NET applications.


    # Notepad “.NET”


    Believe it or not, many developers, particularly ASP developers, still do much
    of their development in Microsoft Notepad, which I used to lovingly refer to as
    “Visual” Notepad. Now I guess I''ll have to change to Notepad “.NET”. While Notepad
    has the substantial advantage of being ubiquitous, it''s not exactly what you''d
    call a robust development environment. That said, if you''re working with the
    .NET Framework SDK (rather than Visual Studio .NET), there''s no reason you cannot
    use Notepad for all of .NET development. The .NET Framework SDK includes command-line
    compilers for Visual Basic .NET, C# (pronounced “C sharp”), and JavaScript .NET.
    So you can create your classes, ASP.NET pages, and so on in Notepad, and then
    you can either compile explicitly using the command-line compilers or, in the
    case of ASP.NET, allow the ASP.NET runtime to dynamically compile the page when
    it''s requested for the first time.


    ![](bbox=[0.933, 0.087, 0.986, 0.315])'
