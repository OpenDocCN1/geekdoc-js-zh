    # Using SSL to Protect Communications


    By default, information sent via HTTP requests and responses is sent as clear
    text. This means that someone could capture the packets that make up these requests
    and then recreate them, including any data from form fields on a submitted page.
    If such a form contained sensitive data, such as passwords or credit card numbers,
    this data could be stolen.


    Encryption is an important tool for keeping this kind of information secure. The
    most commonly used form of encryption in Web applications is the Secureockets
    (Layer) protocol. SSL is used by sites requiring secure communications between
    the Web server and the browser to create and exchange a key to encrypt communications
    between the client and server, which helps protect this information from prying
    eyes. This is typically done by e-commerce sites to protect credit card information,
    for example. SSL can also be useful for protecting other information, including
    SessionID cookies and login information when using basic authentication, or ASP.NET
    Forms-based authentication. (“Enabling Authentication” on page 191 for more information
    on basic authentication.)


    By default, SSL communications occur on port 443 (as opposed to non-SSL communications,
    which are on port 80 by default), using the https:// prefix for URLs that use
    SSL. Enabling SSL for your Web server requires obtaining a certificate and binding
    that certificate to the Web sites on which you want to use SSL. To request a server
    certificate from a certification authority, follow these steps:


    +   1 Internet Services Manager.

    2 Right-click the site you want to protect via SSL and then select Properties.

    3 On the Directory Security tab, shown in the following figure, click the Server
    Certificate button. This will start the Web Server Certificate Wizard.'
