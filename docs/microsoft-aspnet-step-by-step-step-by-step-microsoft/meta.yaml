  md: '# ASP.NET Step by Step


    ![](bbox=[0.166, 0.087, 0.712, 0.381])


    # ASP.NET Web Applications


    ASP.NET applications, at their simplest, are much like classic ASP applications.
    A simple ASP.NET application consists of the following four:


    +   - A virtual directory in IIS, configured as an application root, to hold the
    files that make up the application and to control access to the files

    - One or more .aspx files

    - A Global.asax (analogous to the Global.asa file in classic ASP) to deal with
    Session and Application start-up and clean-up logic (optional)

    - A Web.config file used to store configuration settings (new in ASP.NET and optional)


    For Visual Studio .NET users, the good news is that all of the preceding files
    are created for you when you create a new Web application project.


    # ASP.NET Web Forms


    Web Forms are an important part of any ASP.NET Web application. Put simply, they
    are ASP.NET pages that use ASP.NET Server Controls. The Web Forms programming
    model makes it possible (and relatively easy) to develop Web-based applications
    in the same way that today''s Visual Basic programmers develop Windows-based applications
    that have a graphical user interface (GUI).


    Web Forms in Visual Studio .NET allow you to create rich, interactive applications
    simply by dragging and dropping controls onto a page and writing minimal code
    to handle user interaction, events, etc. In addition, the Visual Studio'
  merge: -1
  pgno: 51
- img_proc: false
  md: '.NET environment lets you work on your pages visually, using the Web Forms
    Designer, or textually, using Visual Studio .NET''spowerful source-code editor.


    The code that you write in Web Forms can be written in one of two ways: inline
    in the .aspx file (as is typical of a classic ASP page), or using a code-behind
    module. While it is possible to write your application with code in the actual
    .aspx file and still take advantage of compiled code and the other improvements
    of .NET, it''s recommended that you get in the habit of using code-behind modules.


    # Code-Behind


    Code-behind is a new feature in ASP.NET that allows developers to truly separate
    the HTML UI code from Visual Basic .NET, C#, or other languages that is used to
    provide user interaction, validation, etc. There are a number of advantages to
    using code-behind modules, including the following features.


    +   - Clean separation of HTML and code Code-behind allows HTML designers and
    developers to do what they do independently, minimizing the possibility of messing
    up one another''s work (something that happens all too frequently when developing
    classic ASP applications).

    - Easier reuse Code that isn''t interspersed with HTML in an .aspx page can be
    more easily reused in other projects.

    - Simpler maintenance Because the code is separated from the HTML, your pages
    will be easier to read and maintain.

    - Deployment without source code Visual Studio .NET projects using code-behind
    modules can be deployed as compiled code (in addition to the .aspx pages), allowing
    you to protect your source code if you wish. This can be very useful if you''re
    creating applications for clients but wish to retain control of your intellectual
    property.


    All in all, it''s worthwhile to get into the habit of using code-behind. You''ll
    see examples of the use of code-behind throughout the book. Part IV of the book
    will discuss Web Forms in detail.


    # ASP.NET XML Web Services


    While no one would deny that Web applications created with ASP.NET (or even with
    classic ASP) can be very useful, the thing that has long been missing is an easy
    way to provide programmatic functionality over the Internet or intranet without
    tying the client to a specific UI. This is where ASP.NET XML services come in.


    An XML Web service, at its simplest, is a chunk of programming code that is accessible
    over the Web. XML Web services are based on the World Wide Web


    ![](bbox=[0.911, 0.611, 0.99, 0.877])'
  merge: -1
  pgno: 52
- img_proc: false
  md: '# 34

    ASP.NET Step by Step


    Consortium''s (W3C) SOAP specification. This allows computers on varying platforms,
    from Windows servers to UNIX workstations, to offer and consume programmatic services
    over the HTTP protocol.


    > note

    AP can use other protocols, such as FTP or SMTP, but HTTP is the most common protocol
    used with SOAP and XML Web services because most firewalls allow communication
    via the HTTP protocol.


    ASP.NET makes it remarkably easy to implement XML Web services. In fact, it takes
    adding a declaration to any methods you wish to make available as XML Web services.
    Visual Studio .NET makes it even easier by taking care of all the work necessary
    to make your XML Web service available to potential clients. Part V will discuss
    XML Web services in detail.


    # ASP.Net File Types


    There are a number of new file types you''ll see in ASP.NET applications. To avoid
    any confusion, let''s take a minute to go over the ones you''ll see most often
    and discuss how they''re used.


    +   - aspx The extension you''ll see most often is .aspx. It''s used for Web Forms
    pages, and it''s analogous to the .asp extension in classic ASP.

    - ascx The extension used for Web Forms controls is .ascx. User controls provide
    one of the many ways available in ASP.NET to reuse code. They''re somewhat similar
    to the include files in classic ASP, in that they can be as simple as a few HTML
    tags or include complex logic that the author might want to reuse in many pages.
    User controls are added to Web Forms using the @ Register directive, which is
    discussed in Part IV.

    - asmx The extension used for files that implement XML Web services is .asmx.
    XML Web services may be accessed directly through .asmx files, or the .asmx file
    can direct the request to a compiled assembly that implements the Web service.

    - vb The extension for Visual Basic .NET modules is .vb. All Web Forms pages (.aspx)
    added to a Visual Studio .NET Web application that are written in Visual Basic
    .NET will have a corresponding .vb code-behind module with the same name as the
    Web Form page to which it''s related.'
  merge: -1
