    to take advantage of some of the multilingual features of the .NET environment,
    you need to limit your use of data types to those supported by the Common Language
    Specification (CLS), a subset of the data types supported by the common language
    runtime. Data types marked with a † are not CLS-compliant. Avoid using them in
    classes that you wish to make available for other .NET languages.


    # Value Types vs. Reference Types


    In .NET development, there are two categories of data types: value types and reference
    types. Although understanding the distinction between these types isn''t'
  merge: -1
