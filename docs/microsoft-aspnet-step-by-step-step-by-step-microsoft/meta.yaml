    # Using Authorization


    After you''ve authenticated the user making the request, the next step is to authorize
    the request. Authorization means deciding whether to permit the user to access
    the requested resource.


    Authorization in ASP.NET takes two major forms: authorization against NTFS Access
    Control Lists (ACLs) and URL-based authorization.'
  merge: -1
  pgno: 218
- img_proc: false
  md: '# Using NTFS ACLs for Authorization


    ACL-based authorization is useful when you''re using Windows-based authentication
    in ASP.NET. With ACL-based authorization, you use tools such as the Properties
    dialog for a file or folder in Windows Explorer to see the list of users or groups
    that are allowed to access a given resource, and what rights (read, write, execute,
    etc) each one. The primary advantage of ACL-based authorization is that it does
    not require writing any security-specific code in ASP.NET application. All security
    settings can be taken care of administratively.


    When a request for a resource (such as an ASP.NET page) comes in, IIS authenticates
    the request, whichever method (basic, digest, integrated Windows) has been configured
    for the application. IIS passes the identity of the logged-in user to ASP.NET,
    which then impersonates the identity of the user and checks the ACL for the requested
    resource to see if the user has required permission. If ASP.NET fulfills the request.


    To take advantage of ACL-based authorization, you need to do the following:


    +   Configure your ASP.NET application to use Windows authentication, and to impersonate
    the logged-in user, by adding the following sections to the application''s Web.config

    ```xml

    <authentication mode="Windows" />

    <identity impersonate="True" />

    ```

    Using Windows Explorer, right-click a file or folder in your application''s physical
    directory that you want to restrict access to, and select Properties.

    Click the Security tab and add users or groups as desired. If you want ASP.NET
    to be able to access a resource when not impersonating, the SYSTEM account should
    be given access to the resource. When you''re finished applying permissions, click
    OK to close.

    Browse the protected resource. You should be prompted to log in using your username
    and password. If you enter credentials for one of the accounts configured in step
    3, you should be able to access the resource.


    # Using URL-Based Authorization


    URL-based authorization, which is new in ASP.NET, lets you grant or deny access
    to resources in your application based on their URL (thus the name) using the
    <authorization> tag. Unlike the <authentication> tag, which cannot be used in
    or applied to a subdirectory of an application, the <authorization> tag can be
    applied to subdirectories and even individual files, by creating Web.config'
  merge: -1
  pgno: 219
- img_proc: false
  md: "files in the subdirectories or by using the *path* attribute of the <location>\
    \ tag to specify the URL for the resource to be protected. URL-based authentication\
    \ also allows you to specify the HTTP method for which a particular rule applies.\n\
    \n# Authorizing Users and Roles\n\nThe most basic form of ASP.NET URL-based authorization\
    \ looks like this:\n\n```\n<configuration>\n  <system.web>\n    <authorization>\n\
    \      <allow users=\"Andrew\" />\n      <deny users=\"*\" />\n    </authorization>\n\
    \  </system.web>\n</configuration>\n```\n\nWhen the <authorization> section is\
    \ added to the Web.config for an application, it allows Andrew to access resources\
    \ in the application's root directory, and in any subdirectories that do not have\
    \ conflicting <authorization> permissions set, as well as denying to all other\
    \ users. The users attribute of the <allow> and <deny> tags allow you to specify\
    \ comma-separated lists of users to be allowed or denied access to the URL being\
    \ protected. (Note that if no path is specified, ASP.NET will apply the settings\
    \ to the directory in which the Web.config contains the settings resides, as well\
    \ as its children.) ASP.NET provides the following two wildcards for allowing\
    \ and denying access:\n\n+   * This wildcard lets you allow or deny all users\n\
    ? This wildcard lets you allow or deny anonymous users\n\nYou can also specify\
    \ a comma-separated list of roles (equivalent to NT groups) to allow or deny by\
    \ adding the role attribute to an <allow> or <deny> tag:\n<allow roles=\"Administrators,\
    \ Users\">\n\nNote that authorization settings for child directories override\
    \ those of the parent, unless the parent settings are locked down using the optional\
    \ *allowOverride* attribute of the <location> tag. To prevent the preceding authentication\
    \ settings from being overridden, you would modify the Web.config file as follows:\n\
    \n```\n<configuration>\n  <location allowOverride=\"false\">\n    <system.web>\n\
    \      <authorization>\n        <allow users=\"Andrew\" />\n      </authorization>\n\
    \    </system.web>\n  </location>\n</configuration>\n```\n\n![](bbox=[0.913, 0.365,\
    \ 0.998, 0.593])"
  merge: -1
  pgno: 220
- img_proc: false
  md: "```\n<deny users=\"*\" />\n</authorization>\n</system.web>\n</location>\n</configuration>\n\
    ```\n\nNote that the <location> tag also has a path attribute that allows you\
    \ to specify the path to the settings contained between the <location> tags apply.\
    \ This can be a very convenient way to specify the authorization settings for\
    \ multiple files or directories in an application from a single Web.config file,\
    \ allowing the developer or administrator to decide which settings may or may\
    \ not be overridden by child.config files. This is an especially useful feature\
    \ in shared server or shared hosting situations. A server administrator can place\
    \ master permissions in the Machine.config file for the server and use the <location>\
    \ tag to prevent overriding of these permissions.\n\n# Allowing or Denying Specific\
    \ HTTP Methods\n\nIn addition to the users attribute, the <allow> and <deny> tags\
    \ also expose a verbs attribute, which allows you to specify the HTTP verb type\
    \ to allow or deny for the specified user(s) or role(s). Following the preceding\
    \ example, you could prevent all users from making POST requests, while still\
    \ allowing them other access, modifying your Web.config file as follows:\n\n```\n\
    <configuration>\n<location allowOverride=\"false\">\n  <system.web>\n    <authorization>\n\
    \      <allow users=\"Andrew\" />\n      <deny verbs=\"POST\" users=\"*\" />\n\
    \    </authorization>\n  </system.web>\n</location>\n</configuration>\n```\n\n\
    Limiting the request types to those necessary for a page or pages in your application\
    \ can be an important way to prevent hackers from compromising your site. If a\
    \ hacker is unable to make a POST request, it is much more difficult for them\
    \ to take advantage of a vulnerability that requires sending data in an HTTP request\
    \ body. You can restrict HTTP verb access for a page or set of pages adding the\
    \ path attribute to the <location> tag, as described in the previous section."
  merge: -1
