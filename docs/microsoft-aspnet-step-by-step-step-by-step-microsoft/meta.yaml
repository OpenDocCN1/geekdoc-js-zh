  md: '# Chapter 9 (continued) Creating Web Forms


    | Element | Description |

    |--- | --- |

    | ASP.NET server controls | This set of built-in controls provides ASP.NET developers
    with a programming model that mimics that of Visual Basic. Controls are added
    to a page, and programmers write code to handle events raised by users'' interaction
    with the controls at runtime. ASP.NET provides two sets of built-in controls:
    HTML controls, which provide a 1-to-1 mapping of server-side controls for most
    HTML elements; and the Web controls, which provide a set of controls that are
    very similar to the Visual UI controls. |


    Custom server controls are another mechanism for reuse in ASP.NET. They''re defined
    in class files (.cs or .vb files) and are precompiled into managed assemblies
    before use.


    # Understanding Page Lifetime


    The goal of the ASP.NET Web Forms programming model is to provide an experience
    similar to that of a Visual Basic rich client event-driven application, in which
    user actions, such as selecting an item from a list or clicking a button, cause
    server-side code to be executed. This is accomplished through postbacks.


    The first time an ASP.NET Web Forms page is executed, the code contained within
    the page (and any code-behind class associated with the page) is compiled into
    a class that inherits from the Page base class. The following figure shows the
    relationship between the page, its code-behind class (if any), and the compiled
    assembly. Once compiled, the class is executed, the resulting HTML is rendered
    to the browser, and the class is removed from memory.


    ![](bbox=[0.157, 0.663, 0.563, 0.843])'
