    | Server-side code | Code can be contained in either server-side <script> code
    blocks or < % %> render blocks. See "Writing Code in Web Forms" on page 228 for
    information using code declaration and render blocks. ASP.NET supports server-side
    code in any language that targets the runtime. |

    | Event handlers | Event handlers are procedures used in <script> code declaration
    blocks that handle page or server controls, such as Page_Load or control Click.
    Most ASP.NET code should be written in or called from event handlers, rather than
    written in render blocks. |

    | <script> code declaration blocks | These are used to contain page-level procedures
    and declare variables that are global to the page. Executable code, other than
    global variable declarations in code declaration blocks, must be contained within
    a procedure declaration. Server-side code declaration blocks must have the run="server"
    attribute, as shown in HelloSimple.aspx. |

    | %> render blocks | These blocks are used to contain code not contained within
    procedures. Overuse of render blocks can result in code that is difficult to read
    and maintain. |

    | Client-side <script> blocks | These are used to contain script code to be executed
    on the client, usually in response to a client-side event. Choice of language
    (set by the language attribute) is dictated by the languages supported by the
    target browser. JavaScript is the most common choice for cross-browser compatibility
    in client scripts. |

    | Server-side comments | Syntax: <%-- -- %>. Server-side comments allow descriptive
    text to be added to a page. Unlike HTML comments, this text is not sent to the
    client. |

    | User controls | These are custom controls that are defined declaratively in
    files with the .ascx extension. They provide a simple and straightforward mechanism
    for reuse of UI and UI-related code, and can contain most of the same elements
    as Web Forms pages. |'
  merge: -1
