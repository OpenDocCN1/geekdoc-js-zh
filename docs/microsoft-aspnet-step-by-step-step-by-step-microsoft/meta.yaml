  md: '# Understanding Programming Basics


    In this chapter, you will learn about


    +   * Expressions, variables, and constants

    * Procedures

    * Flow control

    * Error handling

    * Object-oriented programming


    This chapter is intended for readers who have little or no direct programming
    experience. It''s designed to give a brief overview of some basic programming
    concepts that will help you better understand the examples presented throughout
    the book. Readers with programming experience may wish to skip this chapter and
    move on to Chapter 5.


    While this chapter will provide an overview of basic programming concepts, less
    experienced readers are encouraged to use other resources to supplement this information.
    These resources include books on programming basics, Web sites such as the Microsoft
    Developer Network site (http://msdn.microsoft.com), and newsgroups and mailing
    lists that may be helpful to the inexperienced. (Microsoft maintains a large number
    of newsgroups on development topics related to Microsoft tools at http://news.microsoft.com.
    You can read from and post to these using a reader such as Outlook Express.) Of
    course, one of the best (most overlooked) resources for programming concepts in
    Visual Basic .NET and C# is the MSDN documentation that ships with Visual Studio
    .NET (a subset of which is also available as part of the quarterly MSDN library,'
  merge: -1
