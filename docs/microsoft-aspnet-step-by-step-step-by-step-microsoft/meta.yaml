  md: "# ASP.NET Step by Step\n\nThis is similar to how event handlers are constructed\
    \ in Visual Basic. The second step is to map the event raised by the control to\
    \ the event handler using an attribute of the control's tag.\n\nFor example, if\
    \ you wanted to add an event handler to ServerControls.aspx to handle the Changed\
    \ event of the TextBox server control, you would add the following code to the\
    \ `<script>` block in ServerControls.aspx:\n\n```\nSub NameText_Box_TextChanged(Sender\
    \ Object, E As EventArgs)\n    HelloLabel.Text &= \" This text is different!\"\
    \"\nEnd Sub\n```\n\nAnd then you would add the following attribute to the TextBox\
    \ server control tag:\n`<asp:TextBox id=\"NameTextBox\" OnChanged=\"NameTextBox_TextChanged\"\
    \ runat=\"server'/>`\n\nNotice that we use the `&=` operator to add to the Text\
    \ property of HelloLabel. The `&=` is shorthand for the following:\n\n```\nHelloLabel\
    \ = HelloLabel & \" This text is different!\"\n```\n\nIf you add this code to\
    \ ServerControls.aspx and run it, the output when the text is changed will look\
    \ like the following figure.\n\n![](bbox=[0.166, 0.573, 0.703, 0.733])\n\n# Handling\
    \ Page Errors\n\nWhile structured exception handling may be useful for catching\
    \ exceptions that are expected (see Chapter 4), there are times when you want\
    \ to handle errors at the page level. This is possible through a special handler\
    \ called Page_Error. The Page_Error event is raised whenever a page encounters\
    \ an unhandled exception. Within the Page_Error handler, you can examine the exception\
    \ that occurred using the `Server.GetLastError` method and take appropriate action\
    \ or display a friendly message to the user."
