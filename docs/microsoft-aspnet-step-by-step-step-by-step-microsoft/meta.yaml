    # Setting and Retrieving Custom Application Settings


    The final configuration element is a special one because it allows you to configure
    your own application settings, which can then be easily retrieved from your ASP.NET
    applications.


    # <appSettings>


    The <appSettings> element allows you to create your own configuration settings
    as key/value pairs. You can use this configuration element to store configuration
    information as DSNs for data access, and then retrieve them in your application
    using the following syntax:


    ```

    Dim DSN As String

    DSN = ConfigurationSettings.AppSettings("dsn")

    ```


    This is assuming that you''ve stored the DSN using “dsn” as the key.'
