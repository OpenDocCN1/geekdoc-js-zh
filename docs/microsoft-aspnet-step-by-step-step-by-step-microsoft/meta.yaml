  md: '# Chapter 8 Quick Reference


    | To | Do This |

    |---|---|

    | Enable logging for Web site | Open the Internet Services Manager, navigate to
    the site you want to configure, right-click, and select Properties. In the Properties
    dialog for the site, click the Web Site tab and ensure that the Enabling Logging
    checkbox is checked. |

    | Enable SSL communications for a site | Use the Web Server Certificate Wizard
    to create a certificate request (or follow the procedures recommended by the authority
    of your choice). Once you have received and installed your certificate, open the
    Internet Services Manager, navigate to the site to be configured for SSL, and
    access the Properties dialog for the site. Use the Directory Security tab, click
    the Server Certificate button and use the Assign an existing certificate option
    in the Web Server Certificate Wizard to assign SSL communications by using the
    newly installed certificate to the site. You can require SSL Edit button on the
    Directory Security tab. |

    | Enable ASP.NET to use Windows authentication | Set the mode attribute of the
    <authentication> tag in Web.config to Windows. |

    | Enable ASP.NET to use Passport authentication | Set the mode attribute of the
    <authentication> tag in Web.config to Passport. Install the Passport SDK and follow
    the instructions to configure. |

    | Enable ASP.NET to use Forms authentication | Set the mode attribute of the <authentication>
    tag in Web.config to Forms. Add the <forms> tag with the desired attributes, such
    as loginURL and timeout. |

    | Lock down authorization settings | Wrap the <authentication> tags in a <location>
    tag pair with the allowOverride attribute set to false. |'
