    In the preceding code, you added an event handler for the Page_Load stage of the
    page processing is reached. This event handler is called when the page is loaded.
    In the event handler, you check the page-level property IsPostBack to determine
    if the page has been posted back as a result of a client action (clicking the
    button in this case). If it has, you set the Text property of HelloLabel to the
    desired text, which includes the text the user entered in the textbox. Note that
    you use the Server.HtmlEncode utility method to encode the text entered by the
    user. This helps prevent nasty users from entering <script> tags or other HTML
    content to do something you don''t want them to do. Using the HtmlEncode method
    means that any such content will be written out using HTML equivalents of characters
    such as less (<), greater than (>), and quotation marks.


    > important

    The preceding code assumes that the AutoEventWire attribute of the page has been
    set to true. Normally, you won''t need to set this manually, since this is the
    default setting that is inherited from the <pages> configuration section in Machine.config.
    However, pages created by Visual Studio .NET have the AutoWire attribute at @
    Page to false. This means that all event handlers in these pages must be manually
    wired to the events they are to handle. You''ll learn about manually wiring events
    in Chapter 10.


    # Handling Control Events


    Handling events raised by controls is fairly straightforward. There are two steps.
    The first is similar to the way that you handle page events, only instead of naming
    the event handler Page_eventname, you use the syntax controlname_eventname.'
