    # <securityPolicy>


    <<securityPolicy> element allows you to specify one of several named security
    policies, or a custom policy, for code-access security based on the name and policyFile
    attributes of its <trustLevel> child element. The <trust> element, described in
    the next section, specifies which of the policies is implemented for a given site
    or application. The <securityPolicy> element supports one child element, <trustLevel>,
    with two attributes, and has the following syntax:


    ```

    <securityPolicy>

    <trustLevel

    name="value"

    policyFile="value" />

    </securityPolicy>

    ```


    For information on <securityPolicy> element attributes, consult the following
    table.'
