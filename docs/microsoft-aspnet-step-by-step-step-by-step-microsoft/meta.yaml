  md: '# CHAPTER

    5


    # Creating an ASP.NET Web Application


    +   In this chapter, you will learn how to

    * Create an ASP.NET Web application with Visual Studio .NET

    * Create and configure IIS Virtual Directory

    * Create an ASP.NET Web Form

    * Create Global.asax and Web.config files


    This chapter will walk you through the steps necessary to create an ASP.NET Web
    application, using both the Microsoft .NET Framework SDK and Visual Studio .NET.
    While it''s simple to create a Web application in Visual Studio .NET, it''s also
    a good idea to know how to create a Web application manually if the need arises.


    # Creating a Web Application with Visual Studio .NET


    To create a Web application in Visual Studio .NET follow these steps:


    +   1. Start the Visual Studio .NET IDE by selecting Programs from the Start menu.
    Select Microsoft Visual Studio .NET 7.0 and click on Microsoft Visual Studio 7.0.

    2. From the File menu, select New and then choose Project.'
  merge: -1
  pgno: 100
- img_proc: false
  md: 'In the New Project dialog box, choose a language and project type (in this
    case, Web Application), provide a name and location for the new project, and click
    OK.


    Visual Studio .NET creates all of the necessary files and an Internet Information
    Services (IIS) virtual directory for the project.


    As simple as this process appears, there is a bit of activity behind the scenes.
    The next section will show you how to create a Web application on your own, without
    Visual Studio .NET help.


    # Creating a Web Application with the .NET SDK


    Although the .NET Framework provides everything you need to run an ASP.NET application,
    creating a Web application with the SDK is a bit more involved than it is with
    Visual Studio .NET. Still, creating a new Web application is relatively straightforward.
    The process consists of the following steps:


    +   - Creating an application root

    - Creating subdirectories

    - Creating .aspx pages

    - Creating a Global.asax file

    - Creating a Web.config file


    # Creating an Application Root


    An application root, a special type of virtual directory in IIS, serves as the
    boundary for the Web application, from both a standpoint of files contained within
    the application and from a standpoint of COM+ services your application may use.
    The application root also contains the Global.asax and Web.config files, if your
    application uses these optional files. Additionally, all files and folders within
    the application root are considered a part of the application.


    To create an application root follow these steps:


    +   - Open the IIS management tool by selecting Programs from the Start menu.
    Select Administrative Tools and then choose Internet Services Manager.


    +   - Expand the node representing your machine to display the Web sites and other
    Internet services on your machine. The result will look similar to the following
    figure.'
  merge: -1
  pgno: 101
