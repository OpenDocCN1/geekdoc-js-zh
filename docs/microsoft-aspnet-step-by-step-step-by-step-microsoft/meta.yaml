  md: '# Creating an ASP.NET Web Application


    One of the first things you''re going to do in order to work with ASP.NET in Visual
    Studio .NET is create a new project, or in Visual Studio .NET parlance, a Web
    application. Here are the steps necessary to create a new Web application:


    +   1 Visual Studio .NET.


    +   2 There are three methods of opening the New Project dialog box:

    - Click the Create New Project link on the Visual Studio .NET Start Page (displayed
    by default when you first open Visual Studio .NET).

    - Click the New Project button, located on the toolbar.

    - From the File menu, select New, Project.


    +   3 In the New Project dialog box (see the following figure), select the desired
    project language (in this case, Visual Basic), select the appropriate template
    (Web Application), and enter the desired project name (ASPNETApp1) and location.
    (For local projects, the default of http://machename works fine, or you can use
    the localhost alias instead.) Click OK. Visual Studio .NET will create a new Web
    application along physical and virtual directories for the project.


    ![](bbox=[0.205, 0.485, 0.615, 0.695])


    That''s it! You''ve created your first ASP.NET Web application. Next we''ll look
    at how to add new pages.


    # Creating a New ASP.NET Page (Web Form)


    In your new Web application, you''ll notice that Visual Studio .NET has already
    added a page to the project for you, named WebForm1.aspx, and opened it in the
    editor. However, since one page is rarely enough for most sites, let''s look at
