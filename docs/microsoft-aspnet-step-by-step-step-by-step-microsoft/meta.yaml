  md: '# ASP.NET Step by Step


    Encapsulation allows objects to be treated as "black boxes" in that only the properties
    and methods defined by the programmer as publicly available are visible outside
    of the object. Internal object state and the implementation of the publicly available
    methods are hidden by encapsulation. This visibility lets others freely modify
    the internal state and implementation of their objects, long as they don''t change
    the publicly defined interface used to access the object.


    # Using Classes as Containers for Code


    Classes are the basic unit of an object-oriented application. A class in Visual
    Basic .NET or C# typically contains property and method definitions, as well as
    handlers (a special class of methods). Classes are often grouped into useful collections
    through the use of namespaces. Namespaces contain classes and other namespaces.
    For example, the System.Web namespace defined by the .NET Framework SDK contains
    not only classes such as the HttpRequest, HttpResponse, and HttpServerUtility
    (which provide the equivalent functionality of the ASP Request, Response, and
    Server intrinsics), but also a number of namespaces, including the System.Web.UI,
    System.Web.Caching, and System.Web.SessionState namespaces, each of which also
    contains classes andor namespaces.


    By using classes as containers for code and namespaces, the .NET architecture
    makes it very easy to create a rich, yet intuitive application hierarchy that
    can make your code easier to use, debug, and maintain.


    > When you develop applications in the Visual Studio .NET environment, a root
    namespace will be created with the same name as your project. If you specify additional
    namespaces within your code modules, these will become child namespaces of the
    root namespace. You can change the root namespace, desired, by right-clicking
    your project in the Solution Explorer window and selecting Properties. The Root
    Namespace property appears under Common Properties, General.


    # Using Inheritance


    Now that you know a bit about object-oriented programming, let''s take a look
    at a simple example of how to put it to use. First, let''s define a class based
    on a real-world entity, an animal.'
