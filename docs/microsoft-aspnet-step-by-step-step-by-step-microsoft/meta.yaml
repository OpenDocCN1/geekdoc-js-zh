  md: '# Chapter 8 Security in ASP.NET


    server and the internal network that only allows traffic on ports necessary for
    the Web server to reach other servers (such as the database server), and that
    blocks ports 80 and 443 (and any other ports open in the other firewall). This
    method places the Web server in what is referred to as a DMZ (demilitarized zone),
    which is designed to prevent direct communication between the Internet and an
    internal network. It protects servers on the internal network from attack.


    ![](bbox=[0.166, 0.246, 0.931, 0.413])


    Whichever method you use to close unused ports on your Web server, it is imperative
    that you block traffic to any ports that your application or applications do not
    use. Remember, however, that the ports that remain open are still a security risk.
    Effective logging of server activity, frequent monitoring of logs, and prompt
    patching of vulnerabilities in software operating on the open ports are all important
    means of defending your server(s) from attacks.


    A full discussion of packet filtering, routing, and IPSec management is beyond
    the scope of this chapter. Consult the manual for your firewall or router, or
    of the Windows 2000 Help files, for more information on implementing these solutions.


    # Patching


    Once your server is set up correctly and securely, you''ve considered how the
    design of your application affects security, you might think you''re free home.
    Even the most securely configured server and securely designed application can
    be compromised by a lax attitude towards ongoing maintenance. One of the most
    important aspects of ongoing maintenance of servers and applications is staying
    on top of patches released by vendors of any software you are using.


    In an ideal world, the software we use would be perfect from the start. However,
    the reality is that there are few, if any, programs do not contain vulnerabilities.
    When these vulnerabilities are discovered, typically the vendor of the program
    will issue a patch to correct the problem. Unfortunately, many server administrators
    do not apply these patches consistently, leaving them vulnerable to attack.


    This is unacceptable. Most patches can be applied easily, and there are many ways
    that you can be notified automatically about new ones for Microsoft software.
    These include the following sources of information about patches.


    +   - The Windows Update site (http://windowsupdate.microsoft.com/) lets you analyze
    the updates available for a given system and determine which of'
