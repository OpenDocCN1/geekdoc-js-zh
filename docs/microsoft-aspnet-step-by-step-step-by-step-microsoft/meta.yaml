  md: '# Chapter 4 Understanding Programming Basics


    An expression like this isn''t very useful by itself, however. Unlike people,
    who can easily recognize “one plus” and fill in the blank (“equals two”), computers
    aren''t capable of that kind of leap of logic. In order for the expression to
    be useful, it needs to tell a computer not just to add one and one, but to store
    the result somewhere that we can make use of it (either by displaying it to the
    user or using it in another expression later). This is where variables come in.


    ![](bbox=[0.948, 0.103, 0.981, 0.335])


    # Variables


    As with the preceding example, at some point during the execution of most programs,
    you''ll need to store values of some sort. Examples include the results of mathematical
    operations (as in the preceding example), accepting text input from users, and
    the results of comparisons. Simply put, variables are storage areas for data.
    This data can be numeric, text, or one of number of special types. The kind of
    data that can be stored by a variable is determined by its data type.


    # Data Types


    The data type of a variable defines the type of data that can be stored in it,
    as well as the format in which data is stored (and the amount of memory that the
    system needs to allocate for the variable). The following table lists the data
    types supported by Visual Basic .NET and C#, as well as the .NET Framework SDK
    types to which they map. The data types marked with an asterisk don''t have a
    native representation. You can still access these data types using the appropriate
    System type when declaring the variable.


    The data type of a variable is determined at the time the variable is declared.
    This will be discussed further in the section entitled “Declaring Variables” on
    page 56.


    | Data Type Comparison | C# Data Type | .NET Data Type | Size |

    |---|---|---|---|

    | VB Data Type Boolean | bool | System.Boolean | 1 byte |

    | Byte | byte | System.Byte | 1 byte |

    | * | sbyte | System.SByte † | 1 byte |

    | Char | char | System.Char | 2 bytes |

    | Date | * | System.DateTime | 8 bytes |

    | Decimal | decimal | System.Decimal | 12 bytes |

    | Double | double | System.Double | 8 bytes |


    (continued)'
