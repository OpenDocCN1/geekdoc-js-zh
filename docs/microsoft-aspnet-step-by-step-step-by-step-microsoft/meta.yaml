- img_proc: false
  md: '# Managing Application State


    In this chapter, you will learn about


    +   - Using application state

    - Using session state

    - Configuring state storage

    - Using client-side cookies for state storage

    - State and scalability

    - ASP.NET server control state


    Most applications of any significance will use pieces of data, or variables, that
    need to be maintained across a series of requests or shared between multiple users
    of an application. This data is referred to as state. In a rich client application,
    it''s relatively simple to maintain individual user state simply by allocating
    space in memory of the client machine. In Web applications, managing user and
    application state is more challenging. The primary reason for this is that the
    Hypertext Transfer Protocol (HTTP), the protocol used to send and receive requests
    through a Web browser, is inherently stateless. HTTP doesn''t inherently provide
    a way for the Web server to identify a series of requests as coming from the same
    user, making it difficult for the Web server to maintain state and associate it
    with an individual user.


    In classic ASP, this limitation was overcome through an in-memory collection of
    key-value pairs associated with the Session intrinsic object. The Session collection,
    however, had a number of important limitations of its own, which are discussed
    later in this chapter.'
  merge: -1
  pgno: 116
- img_proc: false
  md: 'In addition to individual user state, many applications need to store and retrieve
    application-level state information that is global to all users of the Web application.
    Classic ASP exposed a collection similar to that of the Session collection on
    the Application intrinsic object.


    # Using Application State


    Application state refers to any data that you wish to share among multiple users
    of your application. This can include connection string information for databases
    (although this information is often better limited to the business tier of an
    application), shared variables, and cached datasets (although this may be better
    stored using the ASP.NET cache engine, which is discussed in more detail in Chapter
    14). In fact, one of the difficulties in managing application state is choosing
    from the many available options for storing such state.


    Like ASP, ASP.NET provides a collection of key-value pairs that developers can
    use to store values and object instances. This can be accessed in the same way
    as in classic ASP (the slight difference in syntax between VB.NET and # in accessing
    the Application collection).


    ```

    '' VB.NET

    Application("MyApplicationVar") = "MyValue"

    MyLocalVar = Application("MyApplicationVar")

    ```


    ```

    // C#

    Application["MyApplicationVar"] = "MyValue"

    MyLocalVar = Application["MyApplicationVar"]

    ```


    Application state storage in ASP.NET is supplied by the .NET HttpClientState class,
    an instance of which is exposed as the Application property of the Page class.
    Because every ASP.NET page inherits from the Page class, you can access the Application
    property as if it is an inherent property of the page, as shown in the preceding
    code.


    For backward-compatibility with classic ASP, the ASP.NET Application object exposes
    a Contents property that can be used to access individual values, using the appropriate
    key.


    +   * VB.NET

    Application.Contents("MyApplicationVar") = "MyValue"

    MyLocalVar = Application.Contents("MyApplicationVar")'
  merge: -1
  pgno: 117
- img_proc: false
  md: '# Chapter 6 Managing Application State


    New in ASP.NET is the ability to add items to the Application collection using
    the Add method exposed by the Application object. You can use the Remove method
    (exposed by the Application.Contents collection in classic ASP) to remove items
    from the Application collection.


    +   * VB.NET

    Application.Add("MyApplicationVar", "MyValue")

    Application.Remove("MyOtherApplicationVar")


    ```

    // C#

    Application.Add("MyApplicationVar", "MyValue");

    Application.Remove("MyOtherApplicationVar");

    ```


    You can also clear the contents of the Application collection by using the Clear
    method exposed by the Application object (or the RemoveAll method, which is provided
    for backward-compatibility with classic ASP).


    +   * VB.NET

    Either line below will clear the application state

    Application.Clear()

    Application.RemoveAll()


    The Application object exposes several ways to access and modify the values stored
    in the Application collection, as shown in the following table.


    | Method or Property | Use |

    |---|---|

    | AllKeys property | Returns a collection of all of the keys by which Application
    collection values can be accessed. |

    | Count property | Returns the number of objects stored in the Application collection.
    |

    | Get method | Returns an item from the Application collection by key or index.
    |

    | Set method | Updates an item in the Application collection by key or index.
    |

    | GetKey method | Returns the key for an item based on a supplied index. |

    | ToString method | Returns a string that represents an item in the Application
    collection. Useful when a string value is required, rather than an object reference.
    |'
  merge: -1
  pgno: 118
- img_proc: false
  md: '# ASP.NET Step by Step


    In addition to storing values in the *Application* collection, you can instantiate
    and store references to .NET components in application state using the `<object
    runat="server">` tag syntax in the Global.asax file (or its associated code-behind
    file), as described in the previous chapter. These objects then become part of
    the StaticObjects collection and can be referenced in ASP.NET Web Forms pages
    by referring to the *id* attribute associated with the object.


    ```

    `Global.asax

    <object runat="server" id="MyClassInstance" class="MyClassName"

    scope="Application">

    </object>

    ```


    *Web Forms page

    Response.Write("Value = " & MyClassInstance.MyValue);


    Note Global.asax (or its associated code-behind file) is the only mechanism for
    creating object instances with *Application* scope.


    > important

    When you''re using either the *Application* or *Session* collections, it''s a
    good idea to initialize the variables you''re using to a default value (such as
    "" for a string or O for a numeric) in the *Application_Start* and *Session_Start*
    event handlers in Global.asax. You can then test for the default value as a way
    of determining whether it has been altered.


    # Synchronizing Access to Application State


    One challenge in managing state information that''s shared between multiple users
    is ensuring that no two users attempt to update the state information simultaneously,
    which could lead to corruption of the data stored. Like classic ASP, the ASP.NET
    *Application* object provides `Lock` and `Unlock` methods that developers can
    use to ensure that only a single user can update application state information
    at any given time. Developers should call `Application.Lock()` prior to modifying
    data stored in the *Application* collection, and call `Application.Unlock()` once
    the modification is complete. Keep in mind that while other users can modify data
    stored in the *Application* collection, which can cause scalability problems.
    For this reason, you should make sure to keep the application locked for the shortest
    time possible, and perform as little as possible while the application is locked.'
  merge: -1
  pgno: 119
- img_proc: false
  md: '# Recommendations for Application State


    Information stored in application state can be easily shared between all users
    of an application. This can make it very tempting to use application state to
    store all manner of data, from application settings such as database connection
    strings to cached datasets frequently using application state. In many cases,
    there are more efficient means of storing this data application state. The following
    table shows some examples of when you may or may not want to store information
    in application state, as well as alternatives for storing such information.


    | State Information | Issues | Alternative |

    |---|---|---|

    | Database connection strings or other application settings | Typically, these
    settings are accessed frequently. Storing this information in application state
    is not very efficient. | Use the Web.config file to store this information, and
    retrieve with the GetConfig object, as discussed (See Chapter 7.). |

    | Datasets containing frequently read data | Caching frequently used data at the
    application level can be efficient, but there''s little automatic control over
    when the data is refreshed. | Use the ASP.NET cache engine to cache expensive
    or frequently read data. The ASP.NET cache engine provides fine-grained control
    over how and when data is refreshed or purged from the cache (See Chapter 14 for
    more.) |

    | Shared application flags or counter variables | Shared values that may be updated
    by multiple users of an application can present major scalability issues, as discussed
    in “State and Scalability” on page 107. | Consider storing shared application
    flags in a database, which will provide finer-grained control over the reading
    and updating of individual values. |

    | References to object instances | Storing references to objects with the wrong
    threading model (such as legacy COM components created with Visual Basic) can
    have a severe impact on the scalability of an application. | If it''s absolutely
    necessary to store a reference to an object instance, ensure that the class from
    which the object is created is thread safe.'
  merge: -1
  pgno: 120
- img_proc: false
  md: '# Limitations of Application State


    Application state has several limitations that you should consider when deciding
    how to manage your state information.


    +   - Durability Application state lasts only as long as the Web application is
    running. If the Web application or Web server is shut down or crashes, any state
    information stored at the application level will be destroyed. Any information
    that needs to persist between restarts should be stored in a database or other
    persistent storage.


    +   - Farms Application state is not shared across multiple servers in a Web farm
    (not across multiple processors in a Web garden). If you need to store values
    that must be available to all users in these scenarios, application state is not
    an appropriate choice.


    +   - Memory Given server has only a limited amount of physical memory available.
    Overuse of application state may result in information being swapped to virtual
    memory (a location on a hard drive used to provide supplemental "memory" storage).
    This can reduce performance significantly.


    > note Web farms are groups of identically configured servers that share the load
    of serving user requests for a given Web application. Each server contains the
    same content and can fulfill any request. Requests are routed to individual servers
    by a hardware- or software-based load-balancing algorithm that determines which
    server is least loaded or assigns requests to a server randomly. Web gardens are
    a new concept in ASP.NET in which an application can be set to run on specific
    processors on a multiprocessor server.


    # Using Session State


    As challenging as it can be to manage application-state information, the statelessness
    of HTTP maintaining state for individual users even more challenging. First, the
    Web server needs to be able to identify a series of requests as coming from a
    single user. Then the Web server needs to associate these requests with the state
    information for that specific user.


    In classic ASP, these challenges were met with the Session intrinsic object. Each
    user had his or her own session instance, identified by a session ID, which could
    be used to store per-user state information. The session ID, a unique generated'
  merge: -1
  pgno: 121
- img_proc: false
  md: '# Chapter 6 Managing Application State 103


    value for that run of the application, was then stored in a cookie on the client
    machine. It would then be passed back to the server with each subsequent request,
    allowing the server to identify the session associated with that user.


    Unfortunately, session state in classic ASP had several inherent limitations that
    made it less ideal, particularly for applications requiring high scalability.
    These included the following:


    +   * Web farms In classic ASP, session state could not be scaled across multiple
    servers in a Web farm, limiting its usefulness in high-scalability situations.

    * Durability In classic ASP, session state would be destroyed by a server restart
    or crash. This made it a poor choice for such shopping carts, whose contents should
    survive such events.

    * Cookie reliance Classic ASP offered no inherent solution for supporting session
    state with browsers that could not or would not accept cookies. Although aftermarket
    solutions were available, they often involved unacceptable performance trade-offs.


    ASP.NET solves each of these limitations, providing per-user state storage that
    is scalable, reliable, and available on browsers that don''t support cookies (or
    for users who choose not to accept cookies). For more information on the available
    options for ASP.NET session state and how they solve these limitations, see “Configuring
    Session Storage” on page 108.


    As the ASP.NET Application object, the ASP.NET Session object is exposed as a
    property of the Page class, from which all ASP.NET pages inherit. This allows
    access to the Session object using the Session keyword.


    ```

    // VB.NET

    Session("MySessionVar") = "MyValue"

    MyLocalVar = Session("MySessionVar")

    ```


    ```

    // C#

    Session["MySessionVar"] = "MyValue"

    MyLocalVar = Session["MySessionVar"]

    ```


    > note

    When accessing the Session or Application collections directly using a key, you
    must use square brackets with C#, as shown in the preceding code . When calling
    methods, such as the Add or Remove methods, parentheses are used for VB.NET and
    C#.


    ![](bbox=[0.933, 0.627, 0.983, 0.873])'
  merge: -1
  pgno: 122
- img_proc: false
  md: 'The Session object functionality is provided by the HttpSessionState, an instance
    of which is created for each user session for which session state has been enabled.


    Like the Application object, the Session object exposes a Contents collection
    for backward-compatibility with classic ASP. Any values stored in the Session
    collection can also be accessed through the Contents alias.


    ```

    VB.NET

    Session.Contents("MySessionVar") = "My"

    MyLocalVar = Session.Contents("MySessionVar")

    ```


    The Session collection can also be used to store references to object instances,
    using similar syntax to that store object references at the application level.
    These objects then part of the session''s StaticObjects collection and can be
    referenced in your ASP.NET Web Form pages by referring to the id attribute associated
    with the object.


    ```

    Global.asax

    <object runat="server" id="MyClassInstance" class="MyClassName" scope="Session">

    </object>

    ```


    ```

    Web Forms page

    Response.Write("Value = " & MyClassInstance.Value)

    ```


    The following table lists some of the additional properties and methods provided
    by the Session object to retrieve and manipulate Session collection values.


    | Method or Property | Use |

    | --- | --- |

    | Keys property | Returns a collection of all the keys by which Session collection
    can be accessed. |

    | Count property | Returns the number of objects stored in the Session collection.
    |

    | SessionID property | Returns a string containing the session ID for the current
    session. |

    | Timeout property | Returns an Int32 value representing the current Session Timeout
    setting. |'
