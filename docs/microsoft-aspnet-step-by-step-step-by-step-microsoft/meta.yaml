  md: '# Configuring an ASP.NET Application


    +   In this chapter, you will learn

    * ASP.NET configuration elements

    * Retrieval of custom configuration settings from ASP.NET pages


    One of the most important new features of ASP.NET, given the advantages it provides
    developers, is the new configuration system it provides ASP.NET. This configuration
    system uses human- and machine-readable XML-based files to store configuration
    information. This chapter will look at how these configuration files work and
    how you can use them in your applications.


    # Understanding ASP.NET Configuration


    Configuration in ASP.NET is based on a series of XML-based files that are hierarchical
    in nature. Each server contains a master (or root) configuration file called Machine.config
    that is stored at the path c:\windows\Microsoft.NET\FrameworkVersion\Machine.config
    (see the following figure). This master configuration file contains the default
    settings for all ASP.NET applications on that server. This file also contains
    settings for machine-wide configuration (such as assembly binding and remoting
    channels), as well as other settings. Use caution when you edit this file, to
    avoid inadvertently making changes that affect other applications.'
  merge: -1
  pgno: 136
- img_proc: false
  md: '# 118 ASP.NET Step by Step


    ![](bbox=[0.165, 0.065, 0.655, 0.335])


    In addition to Machine.config, each ASP.NET Web application may have one or more
    files named Web.config in its folders. Each Web.config file must reside in its
    own folder, and each overrides settings of the configuration files in parent folders.
    Settings in Web.config apply only to the folder within the file resides, and any
    content in child folders. This allows you to set up a hierarchy of configuration
    files that lets you set application-configuration options at the highest levels,
    while still allowing you to override those settings at a lower level. For example,
    if you have a group of files whose access must be restricted, you can place those
    files in a separate folder within your application and then add a Web.config file
    that implements tighter security restrictions. You will see how to do this later
    in this chapter.


    > note

    If you use multiple levels of configuration files within your application, you
    should consider using comments to make it clear where you''re overriding settings
    from parent Web.config files or from Machine.config. This way, those who need
    to maintain the application can understand your intent. Comments in ASP.NET configuration
    files use the same syntax as HTML comments: <!-- -->.

    Keep in mind that many of the settings configured in Web.config and Machine.config
    can also be overridden at the page level using attributes of the Page directive.
    Take care to ensure that all developers on a project (as well as who will maintain
    the application) understand this, to avoid confusion.


    Changes to configuration file settings are detected automatically by the ASP.NET
    runtime and integrated into the cached configuration settings for the application.'
  merge: -1
  pgno: 137
- img_proc: false
  md: "# Chapter 7 Configuring ASP.NET Application 119\n\nWhen a change is made, all\
    \ new requests for resources within the scope of a given configuration file use\
    \ the new configuration settings automatically.\n\n# Introducing Web.config\n\n\
    Like the Machine.config file, Web.config is XML based. This means that each Web.config\
    \ file is made of tags and attributes, similar to HTML. (XML is a markup language\
    \ based on Structured Generalized Markup Language or SGML, the same language on\
    \ which HTML was based.) Machine.config, however, most Web.config files will not\
    \ contain elements for every available configuration setting. In fact, an ASP.NET\
    \ application doesn't actually require a Web.config file in order to function.\
    \ If Web.config is omitted from an application, it simply inherits its settings\
    \ from the master configuration file, Machine.config.\n\nA Web.config file has\
    \ the following basic structure:\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    \ ?>\n<configuration>\n  <system.web>\n    <elementName1>\n      <childElementName1\n\
    \        attributeName1=value\n        attributeName2=value\n        attributeNameN=value\
    \ />\n      </elementName1>\n    <elementName2>\n      attributeName1=value\n\
    \      attributeName2=value\n      attributeNameN=value\n    </elementName2>\n\
    \    <elementNameN\n      attributeName1=value\n      attributeName2=value\n \
    \     attributeNameN=value />\n  </system.web>\n</configuration>\n```\n\nEach\
    \ Web.config file should begin with the standard XML declaration, though it will\
    \ work without it. The file also contains opening and closing <configuration>\
    \ tags. Nested within these tags are the opening and closing <system.web> tags,\
    \ indicating that the content within is ASP.NET-specific configuration information.\
    \ This configuration information is supplied in tags referred to as elements.\
    \ Each element consists of either an opening and closing tag with one or more\
    \ child\n\n![](bbox=[0.94, 0.168, 0.978, 0.315])"
  merge: -1
  pgno: 138
- img_proc: false
  md: 'elements to provide specific configuration values, or a tag pair with one or
    more

    attributes to provide specific configuration values. If an element doesn''t have
    child

    elements, you can omit the closing tag by adding the / character at the end of
    the

    opening tag. (This is standard XML syntax). You''ll see this format in action
    in

    "ASP.NET Configuration Elements" on page 123.


    # note


    Many developers find it frustrating when Visual InterDev 6 reformatted code

    according to its preferred style. That feature was difficult, if not impossible,
    to

    turn off. In Visual Studio .NET, not only can you control how code is validated

    and formatted, but in most cases you can turn off formatting entirely.


    View or change the formatting settings for a given language, from the Tools

    select Options, and then click the Text Editor folder. Click for the folder

    anguage of your choice (see the following figure). Note that for some languages,
    the settings appear on more than one option page. For

    example, HTML/XML formatting options are set on the Format page, the HTML

    Specific page, and the XML Specific page, all under the HTML/XML folder.


    # Editing Configuration Files


    At the time of this writing, the Visual Studio .NET environment''s tools for editing

    configuration files are limited to syntax coloring, XML validation, and code for-formatting.
    Because the ASP.NET configuration files are XML-based, you can use

    your favorite XML editor (or text editor) to edit ASP.NET configuration files.


    ![](bbox=[0.166, 0.636, 0.753, 0.905])'
  merge: -1
  pgno: 139
- img_proc: false
  md: 'In addition to syntax coloring and validation, Visual Studio .NET provides
    a default Web.config file for each new Web application that you create. This default
    file contains the most commonly used elements, as well as comments that explain
    the available options for each element. The default Web.config file is useful
    as a template for any additional Web.config files you want to place in subfolders
    of your Web application. Keep in mind that you''re using configuration files in
    subfolders of your application, it''s a good idea to include the elements for
    the configuration settings from the parent file you want to override. This helps
    prevent overriding a configuration setting by accident, and it may help reduce
    parsing overhead for the configuration of your application.


    # Editing the Master Configuration File


    Not only does the master configuration file, Machine.config, contain the default
    settings for all ASP.NET applications on the machine, but it has machine-wide
    configuration settings as well. Be cautious when editing this file. It is prudent
    to create a backup copy of the file before you edit it. Also keep in mind that
    unless you''re the only one who uses the machine on you''re developing, any changes
    that you make to Machine.config will also affect other ASP.NET developers using
    the machine. Unless dealing with unhappy colleagues, you should discuss any proposed
    changes with them first.


    # Configuring an ASP.NET Application


    At the time of this writing there are no GUI tools available for editing the Web.config
    files and modifying configuration settings. The default Web.config file created
    by Visual Studio .NET Applications, shown in the following figure, contains comments
    specific to the most commonly used settings. These comments provide guidance for
    using the available parameters for a given configuration element (although not
    all configuration elements appear in the default Web.config file).


    In addition to the comments found in the Web.config file generated by Visual Studio
    .NET, the Machine.config file also contains comments with specific settings for
    certain elements. These comments can guide you when you make configuration changes.
    These elements and their settings are described in “ASP.NET Configuration Elements”
    on page 123.'
  merge: -1
  pgno: 140
- img_proc: false
  md: '# ASP.NET Step by Step


    ![](bbox=[0.156, 0.093, 0.742, 0.403])


    # Overriding Configuration Settings for Subdirectories


    Once you''ve created the application-level Web.config file and modified its settings
    to suit your needs, you may want to modify the configuration settings for a subset
    of your application. For example, you may want to apply more stringent security
    requirements to a particular set of files. In ASP.NET, it is simple to override
    the application-level configuration settings. It takes only the following three
    steps:


    +   - Create a subfolder in your application, and place in it the content to which
    the new configuration settings will apply.


    +   - Create a new Web.config file in the new folder.


    +   - Add the configuration settings that you want to override to the new Web.config
    file. Include only the configuration settings that you want to override in the
    new Web.config file. All other settings are inherited from the Web.config file
    of the parent folder, or if that file does not exist (or doesn''t contain settings
    for all configuration elements), from the Machine.config file for your Web server.


    # Locking Down Configuration Settings


    Clearly, there will be times when Web developers or administrators want to configure
    settings for an entire server or site, and prevent them from being overridden.
    This might be desirable in the case of authentication and authorization settings,
    or to prevent the overriding of security policy settings. Fortunately, ASP.NET
    provides the <location> tag for just this purpose.'
  merge: -1
  pgno: 141
- img_proc: false
  md: "# Chapter 7 Configuring an ASP.NET Application\n\nThe <location> tag has two\
    \ attributes: path and allowOverride. The path attribute allows you to specify\
    \ to path which the settings within the <location> tag pair apply. This attribute\
    \ allows you to use a single configuration file, such as Machine.config, apply\
    \ apply settings for multiple applications, virtual directories, or files on the\
    \ same machine. Some settings may only be set at the machine or application level.\
    \ If you attempt to apply these settings at the directory or file level using\
    \ the path attribute, an exception will be thrown.\n\n> **note**\nWhen you're\
    \ using the path attribute to apply configuration settings to multiple locations,\
    \ use comments to clarify the intended purpose of each set of <location> tags.\
    \ In shared server environments, use comments to note the person responsible for\
    \ a given set of configuration settings.\n\nThe allowOverride attribute determines\
    \ whether the settings within the <location> tag pair can be overridden by settings\
    \ applied in a child configuration file. If this attribute is set to false, any\
    \ attempt to change the specified setting in a child configuration file will result\
    \ in an exception.\n\nTo use the <location> tag to lock down configuration settings\n\
    \n+   1 Open the configuration file (Web.config or Machine.config) from which\
    \ you want to lock down a particular setting.\n\n+   2 Add the following code\
    \ within the <configuration> and </configuration> tags:\n<location path=\"to lock\
    \ down\" allowOverride=\"false\">\n  <system.web>\n  </system.web>\n</location>\n\
    \n+   3 Add the desired configuration elements between the <system.web> and </system.web>\
    \ tags.\n\n# ASP.NET Configuration Elements\n\nNow you've looked at the location\
    \ and structure of the ASP.NET configuration files and how to override the settings\
    \ of one Web.config file with another, lets look at the individual configuration\
    \ elements for configuring ASP.NET applications. This section lists the syntax\
    \ for each configuration element and describes the attributes and child elements\
    \ available for that element (where applicable)."
  merge: -1
  pgno: 142
- img_proc: false
  md: "# ASP.NET Step by Step\n\nThe names of configuration elements and their attributes\
    \ are case sensitive and are in referred to as camel case. The entire first word\
    \ of a name is lower-case, and the initial letter of each additional word in the\
    \ name is capitalized. For example, the sessionstate configuration element becomes\
    \ sessionState. Remember to use camel case with both configuration element names\
    \ and attribute names, or you'll get an error when you try to access a page in\
    \ an application.\n\n# <trace>\n\n <trace> element allows you to enable or disable\
    \ application-wide tracing (see Chapter 16 for more on this useful feature), as\
    \ well as the parameters for the tracing functionality. When tracing is enabled,\
    \ you can review information about requests received by the Web server with the\
    \ specific URL http://<servername>/<appname>/trace.axd. The trace element has\
    \ the following syntax:\n\n```\nenabled=\"true|false\"\nlocalOnly=\"true|false\"\
    \npageOutput=\"true|false\"\nrequestLimit=\"integer\"\ntraceMode=\"SortByTime|SortByCategory\"\
    \ / >\n```\n\nFor information on <trace> element attributes, consult the following\
    \ table.\n\n| Attribute | Description | Options |\n| --- | --- | --- |\n| enabled\
    \ | Determines whether application-level tracing is enabled for the application.\
    \ | true\nTurns on application-level tracing.\nfalse\nTurns off application-level\
    \ tracing.\nThe default is false. |\n| localOnly | Determines whether trace information\
    \ is viewable by computers other than the local Web server. | true\nTrace output\
    \ can be viewed only from the local Web server.\nfalse\nTrace output is viewable\
    \ by any machine.\nThe default is true. |"
  merge: -1
