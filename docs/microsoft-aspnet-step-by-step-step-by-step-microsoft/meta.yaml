  md: '# Using While...End While Loops


    While...End While loops essentially do the same thing as Do While... loops, letting
    you execute a given set of statements while a given condition is true. While...
    loops are not as flexible as Do... loops because they offer not the Until keyword
    or allow the condition to be placed at the end of the loop rather than the beginning.
    An advantage of While...End While loops is that the simpler syntax may be easier
    for programmers to use more consistently. A While... loop that does the same as
    the preceding Do... loops would look like the following:


    ```

    <%

    ''While...End While syntax:

    Dim i as Integer = 1

    While i <= 5

    %

    <font size="%i%\>Welcome to ASP.NET</font><br>

    %

    i = i + 1

    End While

    %>

    ```


    Most programs will use a variety of loop types. No matter which loop type you
    choose, the important thing is that you use it correctly and consistently for
    a task. This will make your code easier to read and maintain.


    # Error Handling


    In any application, one challenge faced by developers is dealing with the errors
    that pop up. Application errors come in three varieties:


    +   * Syntax Errors These include misspelled or missing keywords (such as a missing
    If statement), or other mistakes relating to the syntax of the language you''re
    using. Syntax errors are typically flagged by the IDE and may be easily fixed
    at design time.


    +   * Runtime Errors These are errors that appear once your code is compiled and
    running. Runtime errors are caused by code that appears correct to the compiler,
    but cannot run with certain values. For example, code that divides one variable
    by another will appear to be correct to a compiler, but it will cause a runtime
    error if the second variable is zero.


    +   * Logic Errors These are errors in a program that works correctly under some
    (or most) circumstances gives unexpected or unwanted results based on certain
    input values. This type of error is extremely difficult to track down and fix
    because it doesn''t stop the execution of the program.'
