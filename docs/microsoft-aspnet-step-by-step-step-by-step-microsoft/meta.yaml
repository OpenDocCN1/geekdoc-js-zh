  md: '# Chapter 4 Understanding Programming Basics


    ```

    '' ByRef example

    Sub ModifyInt(ByRef myInt As Integer)

    '' Add 42 to myInt

    myInt = myInt + 42

    '' The modified value will be available outside the procedure

    End Sub

    ```


    ```

    '' Implicit ByVal example

    Sub ModifyInt(myInt As Integer)

    '' Add 42 to myInt

    myInt = myInt + 42

    '' If you don''t do anything here, the modified value

    '' will not be available outside the procedure

    End Sub

    ```


    You can pass more than one parameter to a procedure simply by separating each
    parameter with a comma, as in the following example:


    ```

    Sub WriteHello(ByVal Name As String, ByVal Name2 As String)

    Response.Write("Hello to both " & Name & " and " & Name2")

    End Sub

    ```


    > important

    In Visual Basic 6, the default for a parameter definition without the ByVal or
    ByRef keywords is to pass the parameter by reference. Because this behavior is
    the opposite of that in the vast majority of languages, the Visual Basic development
    team has changed this behavior in Visual Basic .NET.

    Visual Basic .NET, parameters defined without the ByVal or ByRef keywords are
    passed by value.

    Whether you''re writing Visual Basic 6 code that may need to be upgraded to Visual
    Basic .NET or writing native Visual Basic .NET code, it''s a good practice to
    always use ByVal and ByRef to explicitly declare how your parameters should be
    passed.


    Note that you explicitly type the parameters by declaring the data type of each
    parameter as String. If any data type other than String is passed to the procedure,
    an exception will be thrown.'
