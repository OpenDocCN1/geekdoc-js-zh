    # Unsafe Storing of Passwords


    Another common problem in Web applications is the storing of passwords or other
    sensitive data in unsafe locations: plain-text files such as ASP and ASP.NET pages,
    Global.asa or Global.asa files, and configuration files in the Web space (those
    that are accessible by HTTP requests to the Web server). The problem usually occurs
    when developers place database login information, including the password, in a
    plain-text file on the Web server. Developers assume that since users are prevented
    from viewing the source of .asp, .aspx, .asa, and .asa files by default, this
    information will be safe.


    Unfortunately, this is true only if the Web server is not compromised by a security
    vulnerability. If a server is compromised, a malicious user may be able to read
    any file in the Web space for an application and gain the password(s) stored there.


    Sensitive information, such as database passwords, can be protected using one
    of the following options:


    +   - If you''re using SQL Server or MSDE, use a trusted connection to connect
    to your database. This method uses the Trusted_Connection attribute of a connection
    string to tell SQL Server to use the current user''s NT login information to log
    in. This is most useful in intranet scenarios where users log in to your application
    via NTLM with an username and password. This method has the advantage of not needing
    to store a password at.


    +   - Store the connection string information in the Machine.config file, which
    is not directly in the Web space of the application, using the appSettings configuration
    section (described in Chapter 15). Although this method is still not ideal because
    password information is still stored in plain text, the fact that the Machine.config
    file is stored outside of the Web space makes it much harder for a malicious user
    to get to this file. For better security with this method, the directory containing
    Machine.config and the directory containing your Web application should reside
    on different drives.


    ![](bbox=[0.928, 0.373, 0.988, 0.626])'
  merge: -1
  pgno: 200
- img_proc: false
  md: 'In addition, you can also use such methods as encryption to make a would-be

    hacker''s job more difficult. The bottom line is that there is really no place
    that you

    store passwords that are 100% secure, but some methods are more secure than

    others. Balance your need for security against other factors when choosing

    and where to store sensitive information.


    # note


    Using a trusted connection with SQL Server requires either Windows

    authentication and impersonation, as described in “Using Impersonation” on

    page 203, or setting up the default ASPNET account (the account used to run

    the ASP.NET worker processes) as a login account in the SQL Server database

    being accessed. This process is described in Chapter 11.


    # Limit Those Accounts


    Account limitations are an important security strategy from the standpoint of

    Windows 2000 accounts, database accounts, and any custom accounts you may

    create for your application. You should configure each account to have only the

    cabilities necessary for the type of user it represents. For example, it is usually
    a

    good idea to set up a database account with read-only access for pages (or com-

    ponents) in your application that only need to read and display data.


    A good example of this practice is Microsoft''s decision to change the default

    account for running ASP.NET worker processes. The default account used to be

    the SYSTEM account, which has numerous privileges and can perform almost

    y action on a machine. Now the default is the ASPNET account (specified by

    the MACHINE value for the username attribute of the <processModel> Belgi-

    ation element in Web.config), which has very few privileges on the system. This

    change makes certain techniques more difficult to use, but also reduces the li-

    hood a single compromised application would compromise an entire system

    or an entire network.


    # No Samples, Thank You


    Another area of danger for the wary IIS administrator or Web developer is

    sample applications. By default, some versions of IIS are installed with a set
    of

    sample applications designed to help developers learn to develop applications
    on

    an IIS server. The .NET Framework SDK also has samples that may be installed to

    help developers learn to develop .NET applications. These and other sample

    applications have their place, but not on a production Web server.'
