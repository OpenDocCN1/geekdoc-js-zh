  md: '# Namespaces


    A namespace is a container used for scoping. Namespaces can contain classes, enumerations,
    interfaces, and delegates. By using namespaces, you can have more than one class
    in a given program with the same name, so long as the classes reside in different
    namespaces.


    Namespaces are declared in Visual Basic .NET using the Namespace...End Namespace
    syntax, where these statements bracket the classes, structures, and so on to contained
    within the namespace. C# uses the namespace / syntax, where the classes and other
    types to be contained within the namespace are bracketed by the curly braces.


    Namespaces can also be nested within other namespaces, forming a hierarchical
    tree. This structure allows you to combine classes in logical groupings, making
    it easier for those using your namespaces to find the classes they''re looking
    for.


    Following these guidelines will make your application more efficient and will
    make maintaining your code easier.


    +   * Since module-level and Static variables all continue to consume memory as
    long as the class or module is running, you should use them only when necessary.


    # Accessibility


    Last important concept in variable declaration is accessibility. The accessibility
    of a variable determines whether it can be accessed from outside the module (or
    application) in which it''s declared. In Visual Basic .NET, accessibility is determined
    through the substitution of one of the following keywords for the Dim keyword.


    +   * Public Variables declared with the Public keyword are accessible anywhere
    in the same module (or class) in which they''re declared, the namespace containing
    that module, and any other applications that refer to the application in which
    they''re declared. They can only be used at the module or class level.


    +   * Friend Variables declared with the Friend keyword are accessible from anywhere
    in the same module (or class) in which they''re declared, as well as the namespace
    containing that module.'
  merge: -1
  pgno: 78
- img_proc: false
  md: 'Protected Variables declared with the Protected keyword are accessible only
    within the class in which they’re declared or a class that inherits from that
    class. (See “Using Inheritance” on page 74.) The Protected keyword can be combined
    with the Friend keyword and can be used only to declare class members.


    Private Variables declared with the Private keyword are accessible only from the
    module, class, or structure in which they’re declared. In classes or modules,
    declaring a variable with Dim or Private has the same effect on the variable''s
    accessibility, but Private makes your intentions more explicit. The Private keyword
    cannot be used within a procedure.


    # note


    In C#, all variables must be declared before they can be used. Failure to declare
    a variable will result in a compiler error. In Visual Basic .NET, it’s possible
    (but not advisable) to use variables without first declaring them. Using variables
    that have not been explicitly declared is a major source of bugs in Visual Basic
    programs and should be avoided.


    The Visual Basic Option Explicit statement (placed at the top of a module or class)
    requires that all variables in that module must be explicitly declared.


    +   - Option Explicit On ''turns Option Explicit on - Option Explicit Off ''turns
    Option Explicit off


    To further protect your code from inadvertent bugs, you can also use the new Option
    Strict statement. When Option Strict is on, conversions between data types that
    would result in data loss are disallowed, as are conversions between strings and
    numeric types.


    +   - Option Strict On ''turns Option Strict on - Option Strict Off ''turns Option
    Strict off


    Following these guidelines can help reduce the number of bugs in your code, and
    more importantly, the time you spend tracking them down.


    The Option Strict statement includes all of the restrictions of Option Explicit,
    so it is not necessary to use both.'
  merge: -1
  pgno: 79
- img_proc: false
  md: '# Constants


    Constants are similar to variables, except for one important detail: Once a constant
    has been declared and initialized, its value may not be modified. Constants are
    very useful when you have a literal value that you want to refer to by name. For
    example, if you''re a fan of Douglas Adams, you might want to create a constant
    to refer to the literal value 42.


    Const TheAnswer As Int = 42


    Anywhere within your program (subject to the same scope, lifetime, and accessibility
    rules) you can use the constant name TheAnswer instead of the literal value 42.


    Constants are particularly handy in place of literal values used as arguments
    to methods of components you may use. For example, in classic ADO (ActiveX Data
    Objects), the types of stored procedure parameters were represented by numeric
    values. Trying to remember all of these values would be unrealistic, as the developers
    of ADO also made it possible to use constants (adInteger, adVar, etc.) in place
    of the literals.


    In other words, constants let you substitute easy-to-remember names for difficult-to-remember
    literal values. This can make your code easier to write and maintain.


    # Procedures


    Procedures are an important tool in ASP.NET development because they allow you
    to determine at the time that you write the code the order in which sections of
    code will run at runtime. Procedures also allow you to better organize your code
    into discrete units by the functionality provided by each one. For example, if
    you write code that multiplies two numbers and returns the result, that code is
    much more useful if it''s wrapped in a procedure. Using a procedure allows the
    code to be called from more than one place in your application as necessary, which
    allows you to reuse the code rather than rewriting it each time you need to multiply
    numbers.


    In Visual Basic .NET, there are two main types of procedures that you''ll use:
    Sub procedures and Function procedures. (C# has functions only.)'
  merge: -1
