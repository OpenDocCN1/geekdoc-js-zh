  md: '# Acknowledgments


    The list of people to whom I am grateful for their assistance and support in the
    production of this book is long, and I hope that I don''t leave anyone out. If
    I missed anyone, please know that your contributions are appreciated.


    First I would like to thank my mother for her unceasing support and encouragement.
    During the process of writing this book, I made the transition from working as
    a consultant for someone else to starting and running my own company, something
    that my mother assured I would eventually have to do. Once, Mom, you were right.


    Several members of the ASP.NET development team provided invaluable support along
    the way. My thanks to Scott Guthrie and Susan Warren, for their willingness to
    take time out of their schedules early and often to share information about this
    exciting new technology with authors and helping us share it with readers. Thanks
    also to Erik Olson for his assistance in reviewing this book and helping me make
    it better, and especially to Rob Howard, for cheerfully making himself available
    to answer my many questions and for his hard work in making sure that authors
    and developers alike have the best possible information. To the extent that this
    book is successful in helping you learn ASP.NET, they deserve a good deal of credit.
    Any shortcomings of the book are mine alone.


    I appreciate the support and assistance provided by my acquisitions editor, David
    Clark, and the team at Microsoft Press. Writing about beta software is never easy,
    but David and the folks at Microsoft Press did everything in their power to make
    it easier, making sure that I always had the latest versions of the software and
    whatever other resources I needed.'
  merge: -1
  pgno: 8
- img_proc: false
  md: 'I''d also like to thank Rob Caron for his assistance and his hard work on documenting
    these technologies. Rob and I worked at the same company while I was writing my
    first book, and I''m glad that even though he''s now 3,000 miles away, we still
    manage to keep in touch from time to time.


    My thanks go to my production team and editors at TIPS Technical Publishing, especially
    Bob and Lynanne. Your efforts and patience did not go unnoticed.


    Finally, I must express my deep and eternal gratitude for the continued support
