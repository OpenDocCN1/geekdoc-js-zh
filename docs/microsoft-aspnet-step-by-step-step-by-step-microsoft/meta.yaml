    Almost as bad as blank passwords are passwords that are weak (easily guessable),

    such as


    +   - Names of places

    - Dates, such as birthdays or anniversaries

    - Words found in a dictionary

    - Short passwords (8 characters or fewer)

    - All letters, all lowercase, uppercase, or all numeric


    Weak passwords make it easier for someone trying to hack a server to guess the
    password for an account. So-called dictionary attacks use a dictionary of common
    terms or rapidly attempt to log in to an account. Brute force attacks attempt
    every possible value until they find the correct one. While a strong password
    won''t necessarily eliminate brute force attacks, it can increase the time needed
    for such attack to succeed. In combination with appropriate auditing and logging,
    this can give you time to deal with the attack.


    Strong passwords meet minimum requirements for length and complexity. You can
    secure passwords using a security template, such as the hispanic.inf template,
    using the Security Configuration and Analysis tool described earlier in this chapter.
    The hispanic template sets minimum and maximum password age, enforces password
    history (preventing users from reusing old passwords), sets minimum password length
    to eight characters, and requires passwords to meet minimum complexity requirements,
    requiring passwords to include three of the following four categories of characters:


