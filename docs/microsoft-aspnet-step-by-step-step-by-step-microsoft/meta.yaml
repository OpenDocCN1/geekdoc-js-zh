    # Be a Policy Maker


    One unheralded feature of the Windows 2000 operating system family is a robust
    set of tools for setting up a machine''s security settings quickly and relatively
    effortlessly. A full discussion of these tools is beyond the scope of this book
    (and could take up a book of its own), but let''s look at a couple of them.


    The Security Templates tool and the Security Configuration and Analysis tool,
    when used together, let you create, edit, and apply templates for defining security
    policies, from minimum password length to file system auditing. Both tools, shown
    in the following figure, are implemented as Microsoft Management Console (MMC)
    snap-ins.'
