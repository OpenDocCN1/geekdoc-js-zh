    # Creating Subdirectories


    If all you need is a subfolder, rather than a virtual directory, you can create
    a new folder in the file system underneath the folder of an existing virtual directory
    and add content to it. Your folder and content will be displayed under your application
    root (or virtual directory) when you refresh the Internet Services Manager window.


    # Creating .aspx Pages


    Once you''ve created your application root and configured the IIS application
    settings as desired, you''ll probably want to start creating some content. If
    you''ve installed the .NET Framework SDK and you''ve created your application
    root correctly, any pages you create with the .aspx extension will be executed
    by the ASP.NET runtime engine.'
