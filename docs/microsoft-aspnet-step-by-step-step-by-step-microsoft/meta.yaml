    # Web Controls


    Web controls the true gem in the crown of ASP.NET. These server controls give
    you an unprecedented level of productivity by providing a rich, event-driven programming
    model, similar to that of Visual Basic. The Web controls reside in the System.UI.WebControls
    namespace, which is available to all Web Forms automatically.


    The Web controls run the gamut of functionality, from simple controls like the
    Button, TextBox, and Label controls, to the richer ListBox and DropDown controls,
    to the even richer Calendar and AdRotator controls. There are even special controls
    that are especially designed for data binding, including the DataGrid, DataList,
    and Repeater controls. You''ll see examples of these types of controls in later
    sections.'
  merge: -1
  pgno: 277
- img_proc: false
  md: 'Although the System.Web.Ui.WebControls and System.Web.Ui.HtmlControls namespaces
    are available to Web Forms pages automatically, the same is not true of code-behind
    pages associated with Web Forms pages. If you want to use controls in either of
    these namespaces without using the fully qualified class name, you need to add
    the appropriate statement (Imports for Visual Basic; using for C#) to your code-behind
    class to import the namespace.


    # Adding Server Controls to a Page


    As you saw in the last chapter, adding server controls to a page is fairly easy.
    There are two different ways to add controls to a page, declaratively and programmatically.
    Either way allows you to set properties of the control as desired, and either
    one can be used to place a control where you want it on the page.


    # Adding Controls Declaratively


    As you saw earlier in this chapter, the ASP.NET HTML controls use essentially
    the same syntax as standard HTML elements, with the exception of the runat attribute,
    which is always set to server. Web controls use a tag-based syntax, but are prefixed
    with as:. So, you would declare an HtmlInput server control with the following
    syntax:


    ```

    <input id="Enter" type="button" value="Enter"

    OnClick="Enter_Click" runat="server">

    ```


    You would declare an ASP:Button server control with the following syntax:


    ```

    <asp:button id="Enter" Text="Enter" OnClick="Enter_Click"

    runat="server" />

    ```


    Notice that in the second example, a / character is added before the > character.
    This is required when you do not use a complete closing tag. Here''s an example
    of a closing tag:


    ```

    <asp:label id="myLabel" runat="server">Hi there!</asp:label>

    ```


    You enclose the literal text Hi there! between an opening and closing tag. The
    literal becomes the Text property of the Label control. The Label control, which
    renders as a <span> on the client side, is one of controls that allow you to include
    literal text for the Text property, or some other property of the control, between
    the opening and closing tags. Other controls include the Literal, Panel, Placeholder,
    and TextBox controls.'
  merge: -1
  pgno: 278
- img_proc: false
  md: '# Choosing the Right Control


    Because there are two distinct sets of server controls to choose from, you may
    wonder how to choose the right control for a given application. In general, if
    you are interested in handling client-side events or convert HTML elements to
    server controls, you should look at the HTML controls. If you''re familiar with
    the Visual Basic programming model, the Web controls provide a model that maps
    very closely to that. The Web controls also provide additional functionality,
    such as validation, and provide a strong basis for customization.


    You could accomplish the same result by using a single-tag syntax.

    <asp:label id="myLabel" text="Hi there! runat="server"/>


    When you add a control to the page declaratively, you are doing two things: giving
    the control enough information to be created and initialized properly, and setting
    the properties for the control. The first is accomplished by the asp: prefix and
    the tag (control) name, plus the id and runat attributes. Only the prefix/tagname
    and runat attributes are required to create a server control, but the id attribute
    is required if you want to refer to the control in server-side code.


    Once you''ve provided this minimum information, you can set additional properties
    by adding attributes to the tag declaration corresponding to the property you
    want to set. For example, if you wanted to set the Visible property of a Label
    control to false by making it visible later in server-side code, you would modify
    the declaration as follows:


    ```

    <asp:label id="myLabel" text="Hi there!" visible="false" runat="server/>

    ```


    Some of the more feature-filled controls, such as the DataGrid, use a combination
    of attributes in the main tag and subtags that declare additional controls or
    set properties (such as the ItemStyle and AlternatingItemStyle tags that can be
    used with the DataGrid or DataList controls) to define the properties for the
    control. You will see examples of these in this chapter.


    # Adding and Manipulating Controls Programmatically


    Although adding controls to the page declaratively is probably the most straightforward
    approach, you can also add controls to the page and manipulate them programmatically.
    This gives you greater control because you can choose how and if to add controls
    at runtime.'
  merge: -1
  pgno: 279
- img_proc: false
  md: '# Chapter 10 Using Server Controls


    Adding a control programmatically is as simple as declaring a new instance of
    the control class and adding it to the page''s Controls collection, as follows:


    ```

    Dim myLabel As New Label

    ''You can also use Controls, but the Page reference makes it

    clear what you intend, which is always a good idea.

    Page.Controls.Add(myLabel)

    myLabel.Text = "Hi here!"

    ```


    The output of this code, when added to the Page_Load event of a Web Forms page,
    the output shown in the following figure.


    ![](bbox=[0.166, 0.323, 0.689, 0.473])


    As you can see, the control successfully creates the Label control and sets its
    text property to Hi here! There’s just one problem. As written, the code adds
    the control to the end of the page''s Controls collection, which is actually after
    the closing <body> and <html> tags, where ASP.NET treats as Literal controls on
    the server. The code that is sent to the browser is here:


    ```

    <html>

    <head>

    </head>

    <body>

    </body>

    </html>

    <span>Hi here!</span>

    ```


    While this HTML syntax will still be rendered in most browsers, it’s not ideal
    because it’s incorrect HTML syntax. This presents even more of a problem when
    you are dealing with both declarative and programmatically created controls. Creating
    controls out of order may produce unintended results. So what do you do?


    One option is to call the AddAt method of the Controls collection, instead of
    Add. AddAt takes two arguments: one representing the location in the collection
    where the control should be added, and the name of the control to add.


    ```

    Page.Controls.AddAt(3, myLabel)

    ```'
  merge: -1
  pgno: 280
- img_proc: false
  md: "The only problem is that in order to render the control where you want it in\
    \ the page, you have to know exactly where the control should appear in the collection.\
    \ This is not always practical.\n\nAn easier way to ensure that programmatically\
    \ created controls appear where you want them is to use a Placeholder control\
    \ to locate the content in the page. The Placeholder control has no UI of its\
    \ own. All of the content within a Placeholder control is rendered based on the\
    \ controls in its Controls collection. So, to make sure that control in the previous\
    \ example is displayed within the body of the HTML document sent to the browser,\
    \ you can use the following code:\n\n```\n<@ Page Language=\"vb\" %>\n<html>\n\
    <head>\n<script runat=\"server\">\n  Sub Page_Load()\n    Dim myLabel As New Label\n\
    \    myPH.Controls.Add(myLabel)\n    myLabel.Text = \"Hi there!\"\n  End Sub\n\
    </script>\n</head>\n<body>\n  <asp:placeholder id=\"myPH\" runat=\"server\" />\n\
    </body>\n</html>\n```\n\nThis produces the following HTML output:\n\n```\n<html>\n\
    <head>\n</head>\n<body>\n  <span>Hi there!</span>\n</body>\n</html>\n```\n\nMultiple\
    \ controls can be added to the same placeholder, and multiple placeholders can\
    \ be used in the same page."
  merge: -1
