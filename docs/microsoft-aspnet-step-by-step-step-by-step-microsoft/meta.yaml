  md: '# Chapter 4 Understanding Programming Basics


    absolutely necessary if you want to develop ASP.NET applications, it may help
    you to better understand how data types operate and how to deal with error messages
    resulting from coding errors. (Not that those ever happen, right?)


    Value types are data types that store their data directly as values in memory.
    They include all the numeric types (int32, short, single, etc.), structures (custom
    data types based on System.ValueType), and enumerations (custom data types that
    represent a defined set of values), as well as boolean, char, and date types.
    Value types are accessed directly, as in the following example:


    ```

    Dim myInt As Integer ''Visual Basic.NET declaration for an int32

    ''Expression to assign the value 123 directly to the variable

    myInt = 123

    ```


    Reference types are data types that store a reference to another memory location
    that contains the data, which is usually based on a class, as the String class
    in the Framework. Reference types include Object (which acts as replacement for
    Visual Basic''s Variant, no longer supported in .NET), String, and all Arrays,
    as well as instances of custom classes. Reference types are accessed through members
    of the class to which the type holds a reference, as in the following example:


    +   * Define a class


    ```

    Class myClass

    Public myInt As Integer

    End Class

    ```


    +   * Create an instance of the class


    ```

    Dim myClassInstance As NewClass()

    ''Expression to assign the value 123 to myClass member myInt

    myClass.myInt = 123

    ```


    > note

    Conversion between value and reference types is accomplished through a process
    called boxing and unboxing. Boxing is the process of creating an instance of the
    reference type object and assigning the value of a value type to the object (as
    well as storing information on the value''s data type). Unboxing is the process
    of assigning the value of the boxed object type to a variable of the appropriate
    type (or a compatible type, such as assigning a boxed int16 to a variable of type
    int32).


    ![](bbox=[0.933, 0.081, 0.991, 0.335])'
