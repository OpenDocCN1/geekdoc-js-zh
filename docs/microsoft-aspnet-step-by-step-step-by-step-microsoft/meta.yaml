  md: "But the following will cause an error:\n\n<script language=\"vb\" runat=\"\
    server\">\nDim Name As String\nName = \"Andrew\"\n</script>\n\nThere is one exception\
    \ to the variable assignment rule. You can initialize the value of a variable\
    \ by assigning a value as part of the variable declaration, as follows:\n\n<script\
    \ language=\"vb\" runat=\"server\">\nDim Name As String = \"Andrew\"\n</script>\n\
    \nThe language attribute of the <script> block is optional. If it is omitted,\
    \ the value will default to the language specified by the @ Page directive's language\
    \ attribute. If no language attribute has been specified for the @ Page directive,\
    \ the value will default to VB.\n\n# Using ASP < % > Code Render Blocks\n\nLike\
    \ <script> blocks, <%> render blocks in classic ASP are pretty much “anything\
    \ goes.” In many cases, this led to sloppy programming habits and hard-maintain\
    \ code. ASP.NET solves these problems by not allowing anything other than inline\
    \ code and expressions in render blocks. This means that you can no longer place\
    \ method definitions in a render block. So the following code will cause a compiler\
    \ error:\n\n```\n<%\nSub SayHello\n  Response.Write(\"Hello, World!\")\nEnd Sub\n\
    %>\n```\n\nWhereas the following code will work fine:\n\n```\n<%\nResponse.Write(\"\
    Hello, World!\")\n%>\n```\n\n# Compatibility with Classic ASP\n\nClearly, one\
    \ of the issues that arises from these changes is that a good deal of code written\
    \ in classic ASP will not be compatible with the restrictions on the use of"
