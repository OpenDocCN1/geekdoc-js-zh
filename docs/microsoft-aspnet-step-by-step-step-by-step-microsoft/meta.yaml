- img_proc: false
  md: 'which can be ordered from http://msdn.microsoft.com/subscription). The MSDN
    documentation contains samples, tutorials, language references, and specifications
    for Visual Basic .NET, C#, managed extensions for C++, JScript .NET.


    This chapter will discuss how these basic programming concepts apply to ASP.NET,
    and how you can use them to create effective ASP.NET applications. Although most
    of concepts aren''t language-specific, there are some subtle differences in how
    they''re implemented in different languages. Where appropriate, we''ll point out
    these differences using code samples in both Visual Basic .NET and C#.


    # note


    In ASP.NET, all code is contained in either Web Forms pages, code-behind modules,
    or modules that make up class libraries that are external to your ASP.NET applications.
    The term module in this sense refers to the .cs or .vb file that contains the
    code, while module as referred by the Visual Basic .NET documentation is a container
    of code that is made available to other classes and modules within the same namespace.
    Unless otherwise specified, the term module in this book has the former meaning
    rather than the latter.


    A class, as you''ll see in "Using Classes as Containers for Code" on page 74,
    is a special type of code container that provides a number of useful features.
    Classes are contained within modules (that is, files with the extension .cs or
    .vb).


    # Expressions, Variables, and Constants


    Expressions, variables, and constants are some of the most basic building blocks
    of computer programs, and you''ll use them all extensively in your ASP.NET applications.


    # Expressions


    Expressions are central to virtually all computer programs. Expressions let you


    +   * Compare values to one another

    * Perform calculations

    * Manipulate text values


    An expression can be as simple as the following:


    ```

    1 + 1

    ```'
