  md: "code declaration and render blocks. For this reason, it is a good idea to examine\
    \ any classic ASP code that you are considering migrating to ASP.NET for these\
    \ incompatibilities, so that you can address them before making the migration.\
    \ (And discovering too late that the code won't work!)\n\n# Creating and Using\
    \ User Controls\n\nUser controls are a new feature of ASP.NET that provides a\
    \ simple and fast method for getting reuse out of your presentation code. User\
    \ controls can also dramatically increase performance when used in conjunction\
    \ with the OutputCache described previously. They are sometimes referred to as\
    \ declarative controls (as opposed to server controls, which are compiled controls).\n\
    \nAt their simplest, user controls consist of HTML markup or ASP.NET code persisted\
    \ in a file with the .ascx file extension. As we saw earlier in this chapter,\
    \ developers of user controls can also add the Control directive to specify aspects\
    \ of how the control will behave. Unlike Web Forms pages, user controls cannot\
    \ be used directly. Instead, they must be used in an existing page.\n\nUser controls\
    \ can contain most, but not all, of the same elements that can be used in Web\
    \ Forms pages. For example, user controls should not contain <html>, <body>, or\
    \ <forms> elements because presumably already exist in the page in which the user\
    \ control is used. It's also a good idea to at least add the Control directive,\
    \ along with its ClassName attribute, as follows:\n\n```\n<% Control ClassName=\"\
    MyClass\" %>\n```\n\nAdding the ClassName allows the user control to be strongly\
    \ typed when added to a page programmatically (as opposed to declaratively).\n\
    \n# Creating a User Control\n\nCreating a user control is fairly straightforward.\n\
    \n+   Using your favorite text editor, create a new file called Hello.asc and\
    \ save it to a folder that is set up as an IIS virtual directory.\n\n+   Add the\
    \ following code to the file:\n\n```\n<% Control ClassName=\"Hello\" %>\n<script\
    \ language=\"vb\" runat=\"server\">\n    Private _name As String =\"\"\n    Public\
    \ Property Name As String\n    Get\n        Return _name\n```"
