  md: "# Chapter 4 Understanding Programming Basics\n\n# 71\n\nOne thing that all\
    \ three types of errors have in common is that they must all be handled in some\
    \ fashion, lest they provoke great dissatisfaction on the part of your users.\
    \ An important first step is prevention. In Visual .NET, two steps you can take\
    \ to prevent errors are Option Explicit and Option Strict in your applications.\
    \ (They’re turned on by default in the Visual Studio IDE.) Using Option Explicit\
    \ will raise a syntax error if you attempt to use a variable before declaring\
    \ it, which can help greatly if you have a habit of missing variable names. Using\
    \ Option Strict will raise a syntax error if you attempt an implicit data type\
    \ conversion that would result in a loss of data. Option Strict also includes\
    \ Option Explicit, so Option Strict will also raise a syntax error on any attempt\
    \ to use an undeclared variable.\n\nThe following example demonstrates the use\
    \ of Option Strict:\n\nOption Strict On\n\n```\nDim MyInt As Integer\nDim MyDouble\
    \ As Double\n\nMyDouble = 3.14159\nMyInt = MyDouble 'This line will cause an error\
    \ at compile time\n```\n\nBoth Option Explicit and Option Strict must come before\
    \ any other code in the module in which they appear.\n\n# Using the On Error Statement\n\
    \nOnce you’ve taken the preventive steps of using Option Explicit, or better yet,\
    \ Option Strict, it’s time to look at handling those inevitable errors. Error\
    \ handling, also known as exception handling, is another type of flow control\
    \ that allows you to execute code when you specify an error or exception occurs.\
    \ In Visual Basic 6, the only available option for error handling was setting\
    \ up an error handler using the On Error statement. That option still exists in\
    \ Visual Basic .NET.\n\n```\nSub Example(Arg1, Arg2)\n  On Error Go ErrorHandler\n\
    \  'Code that might cause an error\nnErrorHandler:\n  'Error handling code\n \
    \ Resume Next\nEnd Sub\n```\n\nThe On Error statement transfers execution to the\
    \ section of code indicated by the ErrorHandler label. Once the error-handling\
    \ code has executed, the Resume\n\n![](bbox=[0.946, 0.095, 0.996, 0.343])"
