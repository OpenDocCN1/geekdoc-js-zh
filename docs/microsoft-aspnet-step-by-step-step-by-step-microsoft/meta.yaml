  md: "# <httpHandlers>\n\nThe <httpHandlers> element allows you to assign requests\
    \ of certain types or for certain resources to specific handler classes. For example,\
    \ in Machine.config, the handling of ASP.NET pages (requests with the .aspx extension)\
    \ is assigned to the System.Web.PageHandlerFactory class. The <httpHandlers> element\
    \ can also be used to prevent HTTP access to certain types of files by assigning\
    \ them to the System.Web.ForbiddenHandler class, as is done by default for configuration\
    \ files (*.config) and source files (*.vb and *.cs, for example).\n\nThe <httpHandlers>\
    \ element supports three child elements, <add>, <remove>, and <clear>, and has\
    \ the following syntax:\n\n```\n<httpHandlers>\n  <add>\n    path=\"path\"\n \
    \   type=\"type, assembly name\"\n    validate=\"true|false\"\n    verb=\"verblist\"\
    \ />\n  <remove>\n    path=\"path\"\n    verb=\"verblist\" />\n  <clear />\n</httpHandlers>\n\
    ```\n\nFor information on <httpHandlers> element attributes, consult the following\
