  md: '# CHAPTER 1


    # ASP.NET Overview


    +   In this chapter, you will learn about

    * The structure and architecture of Microsoft''s .NET platform initiative

    * Which products and languages make up the .NET platform

    * Where ASP.NET fits into the .NET initiative

    * What makes ASP.NET different from earlier versions


    ASP.NET is not just an upgrade—not by a long shot. ASP.NET provides the most advanced
    Web development platform created to date. What''s more, ASP.NET has been rebuilt
    from the ground up to create an entirely new and more flexible infrastructure
    for Web development.


    What makes ASP.NET so revolutionary is it''s based on Microsoft''s new .NET platform,
    or more accurately the .NET Framework. In order to understand clearly when and
    when to use ASP.NET, let''s take some time to go over the .NET platform, the products
    that it comprises, and where ASP.NET fits within Microsoft.NET.


    # Understanding Microsoft .NET


    Microsoft .NET is an umbrella term that describes a number of recently released
    technologies from Microsoft. Taken together, these technologies are the most substantial
    changes to the Microsoft development platform since the transition from 16-bit
    to 32-bit development.'
  merge: -1
  pgno: 22
- img_proc: false
  md: "Microsoft .NET includes the following technology areas:\n\n+   - .NET Framework\n\
    - .NET Enterprise Servers\n- .NET languages and language tools\n\nIn the next\
    \ section, you'll learn about these technologies and how you can use to speed\
    \ up your development of robust, high-performance Web- or Forms-based applications\
    \ on the Microsoft Windows platform.\n\n# .NET Framework\n\n .NET Framework is\
    \ an essential technology for ASP.NET development. It provides the basic system\
    \ services that support ASP.NET, as well as Windows Forms development, the new\
    \ rich client development technology provided by .NET. Much like the Windows NT\
    \ 4.0 Option Pack, was an add-on to Windows NT 4.0 that added Internet Information\
    \ Server 4.0 and Active Server Pages technologies to NT 4.0, the .NET Framework\
    \ is an add-on to Windows 2000, Windows NT 4.0, and Windows 98/ME that adds the\
    \ basic supporting system services for .NET technologies. The framework will also\
    \ be built into newer releases of the Windows server operating system line, including\
    \ the Windows .NET server line.\n\n> important\nWhile Visual Studio .NET will\
    \ be supported on the Windows 9x, Windows NT, Windows 2000, and Windows XP platforms,\
    \ the full framework will be-available on all platforms. Most importantly, while\
    \ other platforms can be used as ASP.NET clients, ASP.NET applications will run\
    \ on only Windows 2000 and later.\n\nThe .NET Framework consists of two main parts:\n\
    \n+   - common language runtime\n- .NET Framework class library\n\n# Common Language\
    \ Runtime\n\nThe common language runtime (runtime) provides a runtime environment\
    \ for the execution of code written in .NET languages. The runtime manages the\
    \ execution of .NET code, including memory and object lifetime management. In\
    \ addition to these management services, the runtime makes it possible for developers\
    \ to perform debugging, exception handling, and inheritance across multiple languages."
  merge: -1
  pgno: 23
- img_proc: false
  md: '# Chapter 1 ASP.NET Overview


    Performing these tasks requires that the language compilers follow the Common
    Language Specification (CLS), which describes the data types supported by the
    runtime that are common to all of the languages used in .NET.


    The individual language compilers compile the code written by developers into
    an intermediate language called Microsoft Intermediate Language (IL or MSIL).
    This IL is then compiled to native code by the runtime at install time or compiled
    Just-In-Time (JIT) at first execution.


    Code that is compiled to IL and managed by the runtime is referred to as managed
    code. It''s called this because the runtime takes responsibility for managing
    execution of the code, including the instantiation of objects, allocation of memory,
    and garbage collection of objects and memory.


    Components written in managed code and executed by the runtime are referred to
    as .NET managed assemblies, or just assemblies for short. Assemblies are the basic
    unit of deployment in the .NET world and are quite similar to COM components.
    The difference is that, a COM component has an associated type library to describe
    how clients interact with it, an assembly contains a manifest, which is the set
    of metadata that describes the contents of the assembly. Among other advantages,
    the self-describing nature of .NET components means that they don''t need to be
    registered on a computer in order to work!


    This metadata also describes the dependencies and version information associated
    with an assembly. Not only does this make it much easier to ensure that all necessary
    dependencies of the same assembly can be run by side on the same computer without
    conflict. This is a major step in resolving "DLL Hell", the bane of many developers''
    existence. Just ask any Web developer who''s worked with more than one version
    of ActiveX Data Objects (ADO), and you''re sure to get an earful about applications
    being broken by a new version of ADO. With .NET, this should be a thing of the
    past. As long as the consuming application knows which version of an assembly
    is designed to use, it can locate the correct version among multiple versions
    querying the assembly''s metadata.


    There''s a great deal more to the runtime, and you''ll learn about it in future
    chapters. If you need more information on the runtime, do a search on "common
    language runtime" in either the .NET Framework SDK documentation or the MSDN Library
    documentation for Visual Studio .NET.


    # .NET Framework Class Library


    The .NET Framework class library is designed to support the efforts of developers
    by providing base classes from whom developers can inherit. A hierarchical set
    of .NET classes that developers can use in their own applications. These


    ![](bbox=[0.943, 0.087, 0.993, 0.339])'
  merge: -1
  pgno: 24
- img_proc: false
  md: 'classes, which are organized by containers referred to as namespaces, provide
    both basic and advanced functionality that developers can easily reuse; include
    classes that support basic common datatypes; classes that provide access to data;
    and classes that support such system services as drawing (which is good news for
    anyone who''s had to use a third-party component for dynamically creating graphics
    in an ASP application), network functionality (including DNS and reverse DNS lookups),
    and many others.


    The library also contains the classes that form the basis of ASP.NET, including
    the Page class (a part of the System.Web.UI namespace) from which all ASP.NET
    pages are derived, and well as many other classes in the System.Web namespace
    and its children. Future chapters will discuss several of these classes.


    > note

    The ASP.NET QuickStart Tutorial (installed with the .NET Framework SDK samples)
    contains a useful Class Browser sample application that can be used to view the
    various classes of the .NET Framework class library.


    # Inheritance


    Inheritance is a central concept in the .NET Framework. It provides a way for
    developers to use existing code in classes. A class can expose both properties
    and methods that clients can use. Classes that are inherited from a particular
    base class are said to be derived from that class. By inheriting from this class,
    a developer can reuse the functionality that it exposes without having to rewrite
    the code.


    In addition (and more importantly), a developer using the inherited class can
    override one or more of the methods exposed by the class in order to provide a
    specialized implementation of that functionality. This capability will come in
    handy when you learn about custom server controls.


    # Windows .NET Server


    In the same way that Microsoft Transaction Server, Microsoft Message Queue Server,
    Internet Information Server, and Internet Explorer were separately installed products
    that were eventually folded into the base operating system, the runtime and the
    .NET Framework class library will become a part of the'
  merge: -1
  pgno: 25
- img_proc: false
  md: '# Chapter 1 ASP.NET Overview


    Windows operating system. At TechEd 2001, Bill Gates announced that the version
    of Windows that will ship with the .NET technologies built in will be Windows
    .NET Server.


    # Enterprise Servers


    The .NET Enterprise Servers are the first step in the evolution of the Microsoft
    development platform. Although the .NET Enterprise Servers don''t explicitly take
    advantage of the runtime and the class library, they do form a solid foundation
    on which you can begin building enterprise-class business solutions.


    > note

    When you''re developing classic ASP applications using the .NET Enterprise Servers,
    you should do so with ASP.NET in mind. For example, the default parameter type
    for Visual Basic. .NET is ByVal, you should write your classic ASP applications
