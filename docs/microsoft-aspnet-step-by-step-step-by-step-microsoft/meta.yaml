    # Recommendations for Session State


    Session state’s ease of use makes it easy to overuse or abuse. The following table
    lists examples of when you may or may not to store information in session state,
    as well as alternatives for storing such information.


    | State Information | Issues | Alternative |

    |---|---|-|

    | User-specific settings | Depending on how frequently these values are accessed,
