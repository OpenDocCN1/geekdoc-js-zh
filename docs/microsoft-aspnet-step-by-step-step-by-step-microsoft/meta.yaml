  md: "Next statement causes execution to return to the statement immediately following\
    \ the line that caused the error. The Exit Sub statement appearing just prior\
    \ to the ErrorHandler label prevents the error handler from running if no error\
    \ occurs.\n\nThe On Error statement is an example of unstructured error handling.\
    \ Applications using unstructured error handling are generally more difficult\
    \ to debug and maintain. Fortunately, Visual Basic .NET now also supports structured\
    \ exception handling using the Try...Catch syntax.\n\n> note\nnYou may see the\
    \ terms error and exception used interchangeably. In .NET, exceptions are unexpected\
    \ events that occur during the execution of your code. They differ from errors\
    \ in that each exception is represented by an instance of an exception class (there\
    \ are many types of exception classes, derived from the base System.Exception\
    \ class), which provides developers with properties and methods that allow them\
    \ to deal with the exception.\n\n# Using Structured Exception Handling: Try...Catch...Finally\n\
    \nThe Try...Catch...Finally form of exception handling, also known as structured\
    \ exception handling, should be familiar to C++ and Java developers. C#, a language\
    \ with origins in C/C++, also supports structured exception handling. This form\
    \ of exception handling is new to Visual Basic developers.\n\nIn Visual Basic\
    \ .NET, the Try...Catch...Finally syntax allows you to enclose code that may cause\
    \ an exception in such a way as to catch and deal with specific exceptions or\
    \ provide generic exception handling. The following code shows a simple Try...Catch\
    \ block:\n\n```\nDim a, b As Integer\nDim c As Single\nTry 'Start monitoring for\
    \ exceptions\n  'Code that may cause an exception\n  a = 1\n  b = 0\n  c = a /\
    \ b\nCatch DivideByException\n  'Code to handle exception\nFinally\n  'Code that\
    \ executes after any code in the Catch block(s)\nEnd Try\n```"
