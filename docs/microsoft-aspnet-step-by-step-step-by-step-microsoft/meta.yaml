  md: '# # Installing the Sample Files


    The CD-ROM inside the back cover of this book contains sample files that you can
    use as you work through the exercises in the book. All of the code necessary to
    work through the exercises is included in the text of the exercise. You may also
    use the sample files to reduce the amount of typing you need to do, or to verify
    your code against the completed sample. With the files and the step-by-step instructions
    in the chapters, you''ll learn by doing, which is an easy and effective way to
    acquire and remember new skills.


    # ## System Requirements


    Before you break the seal on the ASP.NET Step by Step CD-ROM package, be sure
    that you have the correct version of the .NET Framework installed and that your
    operating system meets the minimum requirements for running ASP.NET applications.


    This book was written to work with the Beta 2 or later release of ASP.NET and
    the .NET Framework. If you are using the Beta 1 or earlier release, you will need
    to upgrade in order to make effective use of the examples in the book. The sample
    files require approximately 500 Kb of hard disk space.


    ASP.NET applications can be run only on Windows 2000 or later with Internet Information
    Services installed. The examples in this book were written and tested on Windows
    2000, but they should work without modification on Windows XP Professional or
    Windows .NET Server.'
  merge: -1
  pgno: 14
- img_proc: false
  md: '# Install the Sample Files on Your Computer


    Use the following steps to install the sample files on your computer''s hard disk
    so that you can use them with the exercises in this book:


    +   1 Ensure Internet Information Services is installed and running. You can check
    this by opening the Services applet in Control Panel and looking for the IIS Admin
    and Wide Web Publishing services, both of which should have a status of Started.
    If these services are installed and started, skip to step 3.


    +   2 If Internet Information Services has not been installed, install it using
    the Add/ Remove Windows Components portion of the Panel applet. If one or both
    of the services described in step 1 has not been started, you can start them by
    right-clicking the service and selecting Start. You can set these services to
    start automatically by right-clicking the service, and selecting Properties, changing
    the start-up type to Automatic.


    > **important**nThe default installation of internet information services is not
    configured for secure Internet use. If you are installing Internet Information
    Services for the first time, you should review the information in Chapter 8 and
    the recommended steps to secure your server before connecting it to the Internet.
    Failure to follow this recommendation may result in your server being attacked
    or compromised.


    +   3 Remove the CD-ROM from the back of the book and insert it into your CD-ROM
    drive. If you have an autorun enabled, the starting menu will launch automatically.
    Otherwise, browse to your CD-ROM drive, and find the file StartCDF.exe in the
    root folder andndnd double-click it.


    +   4 The starting menu will provide you with several options. Choose Install
    Sample Files.


    +   5 Follow the instructions for installing the sample files.


    +   6 After you finish through the exercises in this book, you can uninstall the
    sample files to free up hard disk space. To uninstall the sample files, select
    Microsoft ASP.NET SBS Files from Add/Remove Programs in the Control Panel.


    In addition to installing the sample files by using the set-up program, you can
    also browse the files directly. The files are organized by chapter number for
    easy reference.'
  merge: -1
  pgno: 15
- img_proc: false
  md: '# note


    Some of the sample files need to be compiled using the command-line compilers
    for Visual .NET C#. Batch files have been included on the CD to simplify the compilation
    process, but in order to use these batch files you need to add the path to the
    folder containing the command-line compilers to your PATH environment variable.
    By default, the compilers are located in the %windir%\Microsoft.NET\Framework\%version%
    folder, where %windir% is the Windows directory, and %version% is the version
    number of the .NET Framework. To find the actual values for your system, locate
    the Microsoft.NET directory under Windows Explorer, and expand the Microsoft.NET
    node and its Framework child node. The version number should be the name of the
    folder underneath Framework.


    The procedure for adding the path to this folder in Windows 2000 is as follows:


    +   1. Right-click the My Computer icon on the desktop and select Properties.

    2. Select the Advanced tab, then click the Environment Variables button.

    3. In the Environment Variables dialog, scroll down in the System Variables listbox,
    and locate and select the Path variable. Click the Edit button.

    4. Add the path to the folder containing the vbc.exe and csc.exe to the end of
    the string in the Variable Value textbox, preceded by a semicolon.

    5. Click OK, then click OK to close the Environment Variables dialog, and then
    click OK to close the Properties dialog.


    Note, too, that for other command-line tools, such as wsdl.exe, you may also need
    to add other paths to the PATH environment variable. If you have problems running
    any of the command-line tools, you can use the Search facility of Windows 2000
    (found by selecting Start, Search, For Files or Folders...) to search for the
    location of these tools. Then add the path to their location to the PATH environment
    variable.'
  merge: -1
