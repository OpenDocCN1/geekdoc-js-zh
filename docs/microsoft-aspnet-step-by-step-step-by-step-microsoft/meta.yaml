  md: '# # Chapter 9 Quick Reference


    | To | Do This |

    | --- | --- |

    | Modify the runtime behavior of an ASP.NET Web Form | Add the @ Page directive
    to the page and set the desired attributes. |

    | Use classes by name without explicitly specifying their namespace | In a Web
    Form, add the @ Import directive, with the namespace attribute specifying the
    namespace to import.<br>In a Visual Basic .NET code-behind, add the Imports statement
    with the desired namespace.<br>In a C# code-behind file, add the using statement
    with the desired namespace (such as using System.Web). |

    | Make a user control or custom server control available for use on a Web Form
    | Add the @ Register directive to the page, and set the appropriate attributes.
    |

    | Enable output caching | Add the @ OutputCache directive to the page, and set
    the desired attributes. |

    | Create a user control | Create a file with the .ascx extension containing the
    desired HTML markup, server controls and code. User controls should not contain
    <html>, <body>, or <forms> elements.<br>Optionally, add the @ Control directive
    to modify the runtime behavior of the control. |

    | Create server-side functions in a Web Forms page | Create a <script> block with
    the runat="server" attribute and place the functions within it. |

    | Handle page-level events | Add an event handler with the appropriate signature
    (such as Page_event) to the server <script> block. |'
