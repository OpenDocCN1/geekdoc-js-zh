  md: "# @ OutputCache Attributes (continued)\n\n| Attribute | Value |\n| --- | ---\
    \ |\n| VaryByControl | List of properties exposed by a user control, separated\
    \ by semicolons. | Specifies one or more properties exposed by a user control\
    \ to be used to vary the output cache. When a request is received with a value\
    \ that does not match the specified property of any of the cached pages, a new\
    \ version of the page will be rendered and cached. This attribute may only be\
    \ used for output caching with user controls, not with ASP.NET pages |\n\n# Enabling\
    \ Output Caching\n\nFor pages or user controls whose content does not change frequently,\
    \ output caching can provide a simple and powerful way to improve the performance\
    \ of your application. With output caching enabled, requests that match the parameters\
    \ of the cached pages will be served from the cache, which is much faster than\
    \ rendering the page again. Use these steps to enable output caching on Web Forms:\n\
    \n+   1 Open the desired page in a text editor, or in Visual Studio .NET.\n2 Add\
    \ the @OutputCache directive with, minimally, the required Duration, Location,\
    \ and VaryByParam attributes.\n   <%@ OutputCache duration=\"60\" location=\"\
    Any\" VaryParam=\"*\" %>\n3 Save the file. With these values for the attributes,\
    \ the output of the page will be cached for 60 seconds. Any GET/POST requests\
    \ with parameters that do not match an existing cached version of the page will\
    \ be served a freshly rendered version of the page, which will be cached.\n\n\
    For more information on output caching and using the ASP.NET cache engine to store\
    \ arbitrary data, refer to Chapter 14.\n\n# @ Reference\n\nThe @ Reference directive\
    \ allows you to dynamically load user controls by referencing the file name of\
    \ the desired control and then using the Page.LoadControl method to load the control\
    \ at runtime. The @ Reference directive directs the ASP.NET runtime to compile\
    \ and link the specified control to the page in which it is declared. You'll see\
    \ an example of using the @ Reference directive later, when this chapter discusses\
    \ user controls."
