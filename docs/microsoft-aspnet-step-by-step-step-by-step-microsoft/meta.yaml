  md: "# <httpRuntime>\n\nThe <httpRuntime> element controls several aspects of the\
    \ ASP.NET HTTP Runtime engine. The <httpRuntime> element has the following syntax:\n\
    \n```\n<httpRuntime\n  RequestQueueLimit=\"number of requests\"\n  executionTimeout=\"\
    seconds\"\n  maxRequestLength=\"kbytes\"\n  minRequestFreeThreads=\"number of\
    \ threads\"\n  minFreeThreads=\"number of threads\"\n  fullyQualifiedRedirectUrl=\"\
    true|false\" />\n```\n\n# Fully Qualified vs. Relative URLs\n\nThere are two basic\
    \ types of URLs used for creating hyperlinks in Web pages: fully qualified URLs\
    \ and relative URLs. Fully qualified URLs, also known as absolute URLs, contain\
    \ all of the information necessary for the browser (or other client program) to\
    \ locate the resource named in the URL. This includes the protocol moniker being\
    \ (ftp://, http:// https://, etc.), the server's domain name or IP address (on\
    \ local Windows networks, the machine name may also be used), and the path to\
    \ the resource. A typical fully qualified URL would look like the following:\n\
    \n```\nhttp://localhost/quickstart/asplus/default.aspx\n```\n\nRelative URLs provide\
    \ only the information necessary to locate a resource relative to the current\
    \ document (known as document relative) or current server or domain (known as\
    \ root relative). A document relative URL to link to the previously referenced\
    \ page from another page in the same virtual directory would look like the following:\n\
    \n+   - default.aspx\n\nA root relative URL would look like the following:\n/quickstart/asplus/default.aspx\n\
    \nBecause some controls or applications may not know how to use relative URLs,\
    \ there may be times when you need to use a fully qualified URL."
