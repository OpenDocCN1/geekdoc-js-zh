  md: '# Using Server Controls


    +   In this chapter, you will learn about


    Chapter 9 looked at how Web Forms pages are constructed, including some uses of
    server controls. This chapter will take an in-depth look at using server controls
    in your application.


    # Types of Controls


    As discussed briefly in the previous chapter, the built-in server controls in
    ASP.NET are divided into two groups, HTML controls and Web controls, each of which
    is contained in its own namespace. This section will discuss the available controls
    in each group and show examples of when and how to use each type of control. It
    will also discuss some of the specialized Web controls, including the Calendar
    and AdRotator controls, as well as the Validation server controls.


    # HTML Controls


    The HTML controls map 1-to-1 with the standard HTML elements. However, some HTML
    elements do not map directly to a specific HTML control. Why would you want to
    use an HTML control instead of just coding HTML?'
  merge: -1
