  md: "You can make one or more of the parameters of your procedure optional (mean-\n\
    ing the caller decides whether the parameter will be passed or not) by preceding\n\
    them with the Optional keyword.\n\n```\nSub WriteHello(Optional ByVal Name As\
    \ String = \"Bob\")nResponse.Write(\"Hello, \" & Name & \"!\")\n```\n\nWhen you\
    \ use optional parameters, you must supply a value for each one,\nas in the preceding\
    \ example. Also, once you've declared an optional parameter, all\nsubsequent parameters\
    \ for that procedure must also be optional.\n\nFinally, you can change the accessibility\
    \ of Sub procedures using the Public,\nPrivate, Friend, and Protected keywords.\
    \ Sub procedures are public by default,\nwhich means they can be called from anywhere\
    \ within your application.\n\n# Function Procedures\n\nFunction procedures in\
    \ Visual Basic .NET are just like Sub procedures, except for\none important detail—they\
    \ can return a value. This allows your procedure to\n\n+   - Return a numeric\
    \ value representing an error or success code\n- Return data in the form of an\
    \ array or ADO.NET dataset\n- Return True or False to indicate the results of\
    \ some conditional test\n\nThe following code example takes two string parameters,\
    \ concatenates them, and\nthen returns the result to the caller as a string:\n\
    \n```\nFunction ConcatStrings(ByVal String1 As String, \nByVal String2 As String)\
    \ As String\nConcatStrings = String1 & String2\nEnd Function\n```\n\nNotice since\
    \ the Function procedure itself is declared as a string, you don't\need to create\
    \ a local variable to hold the result of concatenating the two strings.\nInstead,\
    \ simply assign the result to the function name to return it to the caller.\n\n\
    # Flow Control\n\nAnother important piece of any program is flow control, which\
    \ allows you to\ndeterm at runtime which code will run, and in what order.\nFlow\
    \ control statements are the foundation of business logic and consist of condi-\n\
    tional logic (including If and Case statements), looping structures (For... and\n\
    Do... loops), and error-handling statements."
