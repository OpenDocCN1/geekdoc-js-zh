    use. | Off Session state is disabled. Inproc Session state is stored in-process
    with the application, as in classic ASP. StateServer Session state is managed
    by an out-of-process NT Service, allowing multiple servers in a Web farm to share
    a single state store. SQLServer Session state is managed by SQL Server database,
    allowing multiple servers in a Web farm to share a single state store. This mode
    has the added advantage of providing persistent state in the event of a Web server
    crash. The default is InProc. |

