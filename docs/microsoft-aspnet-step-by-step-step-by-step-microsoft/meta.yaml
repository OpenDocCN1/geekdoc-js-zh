- img_proc: false
  md: '# Security in ASP.NET


    In this chapter, you will learn about


    +   - The importance of security in Web applications

    - Some security best practices

    - Security features offered by ASP.NET

    - Implementing security in your applications


    In days gone by, there were primarily two types of applications: single-user applications
    in which presentation, business logic, and any necessary data handling all occurred
    on the client machine of the user, and client/server applications, which removed
    much or all of the data handling to a separate database server. Back then, security
    was largely a matter of making sure that in a client/server situation, users only
    made modifications to data that they were authorized to change. Issues such as
    denial of service attacks, port sniffing, and so on were seldom faced by the typical
    application developer.


    The Internet has changed all that forever. Applications that are exposed to the
    Internet are inherently vulnerable to a host of issues, ranging from attempts
    at stealing data to the defacing of Web sites to denial of service attacks. No
    matter what operating system or other software you run, that vulnerability will
    never go away entirely. Software is an imperfect science, and unfortunately, there
    has yet to be an operating system that is invulnerable to attack.'
  merge: -1
  pgno: 186
- img_proc: false
  md: 'The good news is that most software, including Windows 2000, Windows XP,

    and IIS, can be made quite secure if you follow best practices (a recognized set
    of

    recommended procedures and policies) for security, such as keeping track of and

    stalling security patches as soon as they are released. One of the remarkable

    things about security practices in our industry is just how many servers (both

    Microsoft-based and otherwise) are sitting out there exposed to the Internet,

    without patches installed that have been available for months, or even years!


    # The Importance of Security


    Security is one of the first concerns a Web developer thinks about when designing

    and implementing an application (if it''s not, it certainly should be). In many
    ways,

    designing an application without considering security is the same as designing
    an

    application without security. It is much harder to add security to an application

    after the fact than it is to do up front.


    That said, there are different levels and types of security. The type and level
    you

    need for your application will vary depending on what your application does, the

    type and value of data (if any) that you store, the amount of risk you are comfort-

    able, and the amount of time, effort, and money you are willing to expend to

    have a secure application. The security needs of a personal home page, for exam-\ple,
    are very different from those of a corporate intranet site or a retail

    e-commerce site. The following table describes the kinds of threats that are out

    there and the consequences of being underprepared for them.


    > note

    A more complete discussion of this topic is available in the article "Web Secu-

    rity" by William Stallings on Microsoft TechNet (http://www.microsoft.com/

    chnet/security/website/chaptr4.asp), excerpted from Stallings'' book,

    Cryptography and Network Security: Principles and Practice, Second Edition,

    published by Prentice Hall, PTR (1998).'
  merge: -1
  pgno: 187
- img_proc: false
  md: '# Chapter 8 Security in ASP.NET 169


    | Type of Threat | Primary Target | Consequence |

    | --- | --- | --- |

    | Web server compromise | All Web sites | This threat may be embarrassing for
    an individual, but can be costly to a corporation, not only in terms of repairing
    damages, but also in the cost to the company''s reputation of having its site
    defeated, or worse yet, having inaccurate or misleading information posted. Compromised
    systems also be used to mount DDoS attacks on other systems—a potential source
    of liability. |

    | Defacement | | |

    | Substitution of incorrect or misleading information for valid information |
    | |

    | Unauthorized access to internal networks | | |

    | Installation of Trojan or Distributed Denial of Service (DDoS) code | | |


    Denial of Service


    A denial of service attack can prevent users from using your site by flooding
    it with illegitimate requests, among other techniques. These attacks can be difficult
    to prevent.


    Data loss or compromise


    +   - Data compromised through packet sniffing

    - Server data compromised user impersonation or data forgery


    All sites transmitting and receiving sensitive data


    Consequences of not addressing this threat include compromise of credit card or
    other sensitive data, and illicit modification of server data.


    # Security Basics


    With many potential threats against Internet applications, it''s often difficult
    to know where to start in designing a secure application. This section will discuss
    some of the strategies you can use to get started.


    +   - Server set-up and application design Preventing Web server and/or data compromise
    due to insecure server settings and poor application design

    - Patching Preventing Web server compromise due to vulnerabilities in server software

    - Access control Preventing Web server and/or data compromise due to inappropriate
    access settings

    - Auditing and logging Tracking who is hitting your site, what they''re doing,
    and when

    - Using SSL and other cryptographic security tools Preventing data compromise'
  merge: -1
  pgno: 188
- img_proc: false
  md: '# Server Setup and Application Design


    One of the first areas to concentrate on is how you set up your server. Designing
    an application that implements authentication and authorization is futile if someone
    can simply bypass all security through some vulnerability that you have not applied
    the patch for. This section will discuss a number of good practices for server
    set-up and application design, which it''s no substitute for a solid understanding
    of IIS security. You should consider other sources for IIS security, such as the
    Microsoft Technet site (http://www.microsoft.com/technet/) and the security guides
    for Windows 2000 offered by the NSA (which includes a guide to securing IIS 5,
    available at http://msa2.conxin.com/win2k/download.htm). An especially good source
    of information on IIS (and Web application) security are the books of Michael
    Howard, who has a security program manager for Microsoft IIS 4.0 and 5.0 and also
    has been on the Microsoft Windows XP team. His books include Designing Secure
    Web-based Applications for Microsoft Windows-2000 (2000) and the recently released
    Writing Secure Code (2002), both from Microsoft Press.


    # Choosing an OS


    When you''re choosing an operating system, the first thing to ask yourself is
    how much security you need. As with many questions related to the design of a
    Web application, there are trade-offs to be made between security and cost. Although
    client operating systems such as the Windows 9x series may be able to act as Web
    servers through Personal Web Services (PWS), they are not acceptable when security
    is an important factor.


    Workstation or server operating systems, such as Windows NT 4.0 and Windows 2000,
    offer more robust scalability and better security features, including better access
    control (see "Access Control" on page 186), logging, and encryption.


    > important

    One reason to choose Windows NT or Windows 2000 to host a Web application is that
    these server operating systems can use the NTFS file system, where the Windows
    9x series cannot. NTFS allows you to provide robust access control at both the
    file and folder level, and it also provides built-in support for file encryption
    (in Windows 2000). FAT and FAT32 (available in the 9x series) are poor choices
    for Web applications requiring robust security.


    Server operating systems offer the most robust security features, as well as better
    scalability, greater ease of configuration, and better features for developers.'
  merge: -1
  pgno: 189
- img_proc: false
  md: 'Choosing between Windows NT and Windows 2000 is fairly easy for a new application.
    Windows 2000 should be the hands-down choice because of its improved reliability,
    security features, and performance over NT 4.0. If you''re working in an existing
    NT 4.0 environment, however, you may have to take into account when deciding whether
    to continue development on that platform or migrate to Windows 2000 for new projects
    and upgrades of existing Web applications.


    Ultimately, your choice of operating system comes down to the following factors:


    +   - Features (in this case, security features)

    - Cost

    - Existing environment


    Your evaluation should include an analysis of all of these factors, with the goal
    of determining which OS meets your security needs (features), while allowing you
    to work within the constraints of cost and existing environment (if any).


    > important

    Windows 2000 provides a number of major security improvements, including built-in
    support for file system encryption, security policies and templates (discussed
    later in this section), and a Security Configuration and Analysis tool. This tool
    can be very useful in determining whether your system will meet your security
    needs as configured, and can help you easily configure it if it doesn''t. For
    these reasons, Windows 2000 (or later) should be the default choice for secure
    Web applications on the Microsoft platform.


    # Choosing a Purpose


    Another important point to consider when choosing your operating system is the
    purpose of the server. For smaller applications with low scalability requirements,
    it may be acceptable to run your Web server, database server, and components all
    on the same machine. Because IIS and most databases make significant demands on
    both RAM and processor power, this model does not scale particularly for larger
    applications. More importantly, placing a database on a Web server that is exposed
    to the Internet greatly increases security risks to the data stored in that database.
    This can also be true for other server and application software, from mail server
    software to productivity applications such as Microsoft Office. The important
    point is that as you add more purposes to a server, you are also adding more security
    exposure. Keep all of this in mind as you configure your servers and decide the
    purpose for each one.'
  merge: -1
  pgno: 190
- img_proc: false
  md: '# Too Much Service


    The next important set of decisions comes when you install your operating system
    of choice (Windows 2000, for example), or when you add services to be used by
    your application (with Windows NT, for which IIS 4.0, Microsoft Transaction Server,
    and ASP are add-ons to the operating system). This choice concerns which services
    will be installed.


    Unused running services can be a significant security risk. For example, if you
    install the FTP or SMTP services and have protected the ports those services use,
    an attacker could detect the services and attempt to compromise your server through
    various known vulnerabilities. You can also reduce the risk of compromise through
    diligent application of patches. See “Patching” over page 185 for more information.


    If you are not using a service, you should avoid installing, or use Add/Remove
    Programs to remove it. The following steps show how:


    +   Click Start, Settings, Control Panel.

    Double-click the Add/Remove Programs icon.

    In the left side of the window, click the Add/Remove Windows Components button.

    Review the list of installed components (shown in the following figure). Of particular
    interest is the IIS node. Select that node and click the Details.


    ![](bbox=[0.227, 0.577, 0.742, 0.866])'
