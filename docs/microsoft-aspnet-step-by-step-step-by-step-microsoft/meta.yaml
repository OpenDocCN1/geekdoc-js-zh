  md: 'Directives are simply ways for developers to declaratively determine how certain
    aspects of a program will operate. In classic ASP, this was somewhat limited.
    In fact, there were only the following four @ directives in classic ASP, in addition
    to the @ Language directive:


    +   * @Codepage Used in globalization to set the code page for an ASP page

    * @EnableSessionState Used to disable session state for a page

    * @LCID Used to set the locale identifier for a page

    * @Transaction Used to specify whether and how the page participates in COM transactions


    ASP.NET greatly expands the use of directives, adding a number of useful directives
    for everything from controlling page behavior and configuration to caching page
    output. In addition, directives in ASP.NET have attributes, which increase their
    power and flexibility. The classic ASP directives listed previously are represented
    in ASP.NET as attributes of the @ Page directive, which is described in the next
    section.


    # @ Page


    The Page directive, which is allowed in .aspx files only, defines page-specific
    attributes that are used by ASP.NET language compilers and the runtime to determine
    how the page will behave. The default values for a few of these attributes are
    set in the Pages configuration section in Machine.config. Some of the attributes,
    including AutoEventup, are set or overridden in pages created by Visual Studio
    .NET. The attributes available for the @ Page directive are listed in the following
    table.


    | Attribute | Values | Purpose |

    | AspCompat | true/false | Provides compatibility with COM components created
    with Visual Basic 6.0 (or earlier) by forcing the page to run in an STA (Single
    Threaded Apartment). Also provides the component with access to unmanaged instances
    of the ASP intrinsics (Session, Application, Request, etc.). This setting will
    likely degrade performance, so use it only when necessary. |


    Default is false.


    (continued)


    ![](bbox=[0.935, 0.605, 0.996, 0.858])'
  merge: -1
  pgno: 234
- img_proc: false
  md: '# Page Attributes (continued)


    | Attribute | Values | Purpose |

    | --- | --- | --- |

    | AutoEventWireup | trueelfalse<br>Default is set in the &lt;pages&gt; section
    of Machine.config or Web.config. | Determines whether or not handlers for events
    such as *`Page_Load` are set up automatically. See “Event Handling” on page 240
    for more information. Default is true. |

    | Buffer | trueelfalse<br>Default is set in the &lt;pages&gt; section of Machine.config
    or Web.config. | Determines whether rendered output is buffered before being sent
    to the client or is sent as it is rendered. Default is true. |

    | ClassName | Any valid class name. | Determines the name of the page generated
    by dynamically compiling the page. This attribute works with or without Codebind,
    and with either *Src* or *Codebind* attributes. The default behavior if this attribute
    is omitted is for the page name in the form *filename.aspx*. |

    | ClientTarget | Any valid *UserAgent* string.<br>Available values are set in
    the &lt;currentTarget&gt; section of Machine.config or Web.config. | Determines
    the browser for which server controls should render output. The UserAgent string
    should be recognized by the server controls being used. |

    | Codebind | File name of codebind class. | This is used in Visual Studio .NET
    to locate code-bind classes to be compiled during a build operation. It is not
    used by the ASP.NET runtime. |

    | CodePage | Any valid code page value. | Same as in classic ASP. |

    | CompilerOptions | String containing valid compiler options. | Allows developers
    to pass compiler options for the page to the compiler. For Visual Basic .NET and
    C#, this can be any valid sequence of command-line switches for the compiler.
    |'
