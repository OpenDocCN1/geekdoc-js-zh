- img_proc: false
  md: 'Misuse of Application.Lock() The Application.Lock() method prevents access
    to all application values for other than the user whose request resulted in the
    call to Application.Lock(). This continues until the Application.Unlock() method
    is called. You should minimize the time that these values are locked by calling
    Application.Lock() immediately prior to updating a value and calling Application.Lock()
    immediately afterward.


    Storing references to single (or apartment) threaded objects Storing references
    to non-free-threaded objects at application or session level can interfere with
    IIS thread management capabilities and can result in scalability problems. Avoid
    storing non-free-threaded objects at application or session level.


    In-process session state In order to scale a Web application beyond a center point,
    it is often necessary to use a Web farm to allow multiple servers to handle requests.
    In-process session state, the default, is not available to all servers on a Web
    farm. To use session state with a Web farm, you should set your application’s
    Session mode to either “StateServer” or “SQLServer” as described in the next section.


    Overuse of session or application state storing numerous objects or large datasets
    at the application level, and particularly at the session level, can rapidly exhaust
    the physical memory on a Web server, causing it to substitute virtual memory for
    storing additional information. This can have a dramatic effect on the performance
    of an application. You should always ensure that any use of application state
    (and more importantly, session state) will not exceed the physical memory resources
    available on the Web server. Also remember that other applications will be using
    some of these resources.


    # Configuring Session State


    ASP.NET provides several new possibilities for storing session state. Each is
    designed to overcome one or more of the limitations of session state in classic
    ASP. The available settings include the following:


    +   - In-process (InProc) This is the default setting. Its behavior is essentially
    the same as in classic ASP.


    +   - Out-of-process running (StateServer) This setting specifies that session
    state will be stored by a server process running the ASP.NET NT service. The state
    server to connect to is specified by an attribute, as described in the section
    “Session State Out-of-Process.”'
  merge: -1
  pgno: 127
- img_proc: false
  md: 'SQL Server (SQLServer) This setting specifies that session state will be stored
    in a SQL database. The SQL Server to connect to is specified by an attribute,
    as described in the section "Storing Session State in SQL Server" on page 111.


    Cookeless Sessions This setting allows you to maintain session state for users
    whose browsers cannot handle cookies.


    The following sections describe how to configure each of these settings.


    # Storing Session State In-Process


    By default, Web applications, created in Visual Studio .NET or created manually,
    will store session state in-process. As noted, this has several inherent limitations,
    including lack of scalability and durability. For applications requiring neither
    beyond a single server durability of session state across server restarts or crashes,
    however, this setting may work just fine. And it''s the simplest to do because
    it doesn''t require any changes to the application configuration file.


    # Storing Session State Out-of-Process


    The first solution to the problems of scalability and durability for session state
    is to store session state out-of-process in a dedicated ASP.NET state process
    provided by an NT service. One advantage of this method is that the ASP.NET state
    service can serve requests from multiple servers, making it possible to scale
    session state across a Web farm. Another advantage is that the ASP.NET state service
    runs in a separate process (or even on a separate machine), so state information
    can survive restarts or crashes of a specific Web application process. Note that
    session state information stored by the ASP.NET state service does not survive
    a restart or crash of the machine on which it''s running.


    To store session state out-of-process follow these steps:


    +   1. Open the Web config file for your application and locate the sessionState
    configuration section.

    2. Change the mode attribute from "InProc" to "StateServer".

    3. Modify the stateConnectionString attribute so that it reflects the server name
    (or IP address) of the state server and the port that the ASP.NET state service
    is monitoring (by default, this is 42424).'
  merge: -1
  pgno: 128
- img_proc: false
  md: '# 4 The complete sessionState configuration section that uses the ASP.NET state
    service on the local machine would look like the following code. (Note that the
    SqlConnectionString attribute, which is not used in this example, and the cookeless
    and timeout attributes have been omitted. The full list of attributes is available
    in Chapter 7.)


    ```

    <sessionState

    mode="stateserver"

    connectionString="tcpip=127.0.0.1:42424"/>

    ```


    # 5 Start the Services Microsoft Management Console (MMC) snap-in by clicking
    Start, Programs, Administrative Tools.


    # 6 Start the ASP.NET state service on the desired server from the Services MMC
    snap-in.


    ![](bbox=[0.195, 0.365, 0.735, 0.63])


    ASP.NET will automatically connect to the specified state server to store session
    state for your application. If the state service on the specified server is not
    running, you will receive an error message.


    Keep in mind that although storing session state in a dedicated process can improve
    the overall scalability of your application, there are inherent performance implications
    of moving session state out of process. Retrieving information from a different
    process (and especially from a different machine) significantly more costly than
    retrieving it from within the same process. You should test the impact on the
    type and amount of session data you plan to store before implementing this type
    of session storage in a production application.'
  merge: -1
