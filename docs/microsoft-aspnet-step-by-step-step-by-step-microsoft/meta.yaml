    ```\n\n# Receiving Input Parameters\n\nNote that in both the Visual Basic .NET\
    \ Sub procedure and C# Function, the name of the procedure is followed by a set\
    \ of empty parentheses. These parentheses have a purpose other than simply taking\
    \ up space. You can place code between these parentheses to define one or more\
    \ parameters that users must pass when they call the procedure. Parameters can\
    \ be passed either by value (a copy of the value is passed to the procedure) or\
    \ by reference (a reference to the location of the value is passed to the procedure),\
    \ which allows the procedure to modify the original value). You use the keywords\
    \ ByVal or ByRef to specify which way the parameters are to be passed. If no keyword\
    \ is used, the parameters will be passed by value. The following code shows some\
    \ examples:\n\n```\n' ByVal example\nSub ModifyInt(ByVal myInt As Integer)\n \
    \ 'Add 42 to myInt\n  myInt = myInt + 42\n  'If you don't do anything here, the\
    \ modified value\n  'will not be available outside the procedure\nEnd Sub\n```"
