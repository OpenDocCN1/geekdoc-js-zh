  md: '# Chapter 3 ASP.NET Development Overview 35


    .cs The extension for C# code modules is .cs . The .vb extension, Web Forms pages
    (.aspx) added to a C# Studio .NET application will have a corresponding .cs code-behind
    module with the same name as the Web page to which it relates.


    Global.asax Like Global.asax in classic ASP, Global.asax is a file used to define
    Application and Session-level variables and start-up procedures. Note that while
    Global.asax can be structured like Global.asax, with start-up procedures as Session_OnStart
    (Session_Start in ASP.NET) coded directly in the Global.asax file in a <script
    runs="server">-block, Visual Studio implements these procedures in a .vb (or .cs)
    code-behind module rather than in the Global.asax file itself.


    In addition to the functionality available in a classic ASP Global.file, ASP.NET
    allows you to import namespaces, link to assemblies, and perform other useful
    tasks. You''ll learn more about Global.asax in Chapter 5.


    Web.config Web.config is a new file type in ASP.NET. It is used to solve one of
    the major hassles with classic ASP applications: configuration. The Web.config
    file is a human- and machine-readable XML file that stores all of the configuration
    settings for a given application (or segment of an application). Web.config files
    are interpreted hierarchically; that is, a Web.config file in a subdirectory of
    your application will override the settings of the Web.config file(s) in its parent
    directories. The advantage is that configuration settings can be inherited where
    that is desirable, but you also have granular control over over configuration.


    # Languages Used in this Book


    Although there are several languages to choose from in the Microsoft .NET Framework
    SDK and Visual Studio .NET, this book will concentrate primarily on Visual Basic
    .NET and C#. Most code samples will be presented in Visual Basic .NET, but alternate
    examples using C# will be presented where there are important differences between
    Visual Basic and C# syntax. This section will help you decide which language is
    best for you.


    # Visual Basic .NET


    If you''ve worked with Visual Basic or Visual Basic Scripting Edition (VBScript)
    but don''t have experience with C, C++, you''ll likely be most comfortable working
    in Visual Basic .NET. Although there have been substantial changes to the language
    since Visual Basic 6.0, Visual Basic is similar in syntax. This


