    HelloString = "Hello World!"

    ''Write HelloString to browser

    Response.Write(HelloString)

    ''Lifetime of HelloWorld will end after next line

    End Sub


    When this procedure completes, the variable HelloWorld no longer exists. Its lifetime
    has ended. If HelloWorld had been declared outside the procedure, its lifetime
    would be the instance of the class containing it was destroyed.


    ''Declare module-level string variable

    Dim HelloWorld As String


    ```

    HelloWorld()

    HelloWorld = "Hello World!"

    ''Write HelloWorld to browser

    Response.Write(HelloWorld)

    ''Lifetime of HelloWorld will not end after next line

    End Sub

    ```


    > The Visual Basic .NET documentation recommends using whole words when naming
    your variables. You should use mixed case, with the first letter of each word
    capitalized, in HelloWorld. This is one of many possible naming conventions you
    can use for variables and other elements in your programs. Naming conventions
    are simply agreed-upon standards for how elements will be named in a program.
    The particular naming convention you choose isn''t important, but you must choose
    one and use it consistently. Doing so will make it easier for you to maintain
    your code and help others understand what it''s doing.


    You can extend the lifetime of a procedure-level variable through the substitution
    of the Visual Basic .NET Static keyword for the Dim keyword used earlier.(In C#,
    you would use the static modifier.) In the following example, HelloWorld is declared
    within the procedure, but because it''s declared as Static, its lifetime continues
    until the class or module containing the procedure has finished running:


    ```

    HelloWorld()

    ''Declare static string variable

    Static HelloWorld As String

    ```'
