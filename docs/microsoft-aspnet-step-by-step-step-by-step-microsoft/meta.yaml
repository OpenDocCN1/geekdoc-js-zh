  md: '# Visual Basic .NET


    As mentioned earlier, ASP.NET developers are no longer restricted to a watered-down
    version of Visual Basic like VBScript. They can now take advantage of the full
    power of the Visual Basic .NET language. And that power has been increased substantially
    in Visual Basic .NET by adding support for inheritance, structured exception handling,
    and support for multithreaded programming, just to name a few improvements.


    Visual Basic .NET is a managed language, which means the runtime manages the execution
    of Visual Basic .NET code. You no longer need to explicitly destroy your object
    references using Set object = Nothing, as you did when using COM components in
    Visual Basic 6 and earlier. The .NET garbage collector will automatically recover
    the memory used by the component, once no clients are referencing it.


    There are many new features in Visual Basic .NET, but users of VBScript and Visual
    Basic 6.0 should have little trouble once they''re familiar with the .NET programming
    model. There will be plenty of code examples throughout the book to help you get
    started.


    # C#


    A new member of the Visual Studio family, C#, is a descendant of C. It''s like
    C++, but designed with greater simplicity and ease of use in mind. Although C#
    isn''t necessarily as easy to learn as Visual Basic, it''s far easier than C++
    and provides nearly all of the power available to C++ developers. It also doesn''t
    require you to manage the allocation and deallocation of memory, as C++ does.
    Because C#, like Visual Basic .NET, is a managed language, all of the memory management
    is taken care of by the runtime. This is an important advantage because memory
    management is one of the most troublesome areas of C++ development and is responsible
    for many application crashes.


    Developers familiar with C, C++, and Java will quickly become productive using
    C#. This book will have some code examples in C# that will give you a taste of
    this exciting new language.


    # Additional .NET Languages


    In addition to Visual Basic .NET and C# (the two languages used in this book),
    Visual Studio .NET ships with JScript .NET, Visual C++, and the managed extensions
    for Visual C++, which allow C++ developers to target their applications to the
    runtime.


    ![](bbox=[0.925, 0.093, 0.99, 0.345])'
  merge: -1
  pgno: 32
