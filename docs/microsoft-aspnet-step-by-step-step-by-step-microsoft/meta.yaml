  md: '# 142 ASPNET Step by Step


    # <authentication> Element Attributes (continued)


    | Element | Attribute | Description | Options |

    | --- | --- | --- | --- |

    | | path | Determines the path to set for the authentication cookie. | Default
    is /. This is to prevent the possibility of missing cookies by browser case sensitivity
    with respect to URL paths and cookies |

    | | protection | Determines the methods used to protect the authentication cookie
    from being compromised. Your choice of which method to use, or whether to use
    any at all, will depend on your security needs vs. the amount of resources you''re
    willing to devote to security. Generally, the higher the level of security, the
    greater the performance overhead. | All (default) Both encryption and data validation
    will be used to protect the cookie. This is the recommended setting.

    Encryption The authentication cookie will be encrypted, but will not be validated.
    This leaves the cookie vulnerable to certain types of attacks.

    Validation The authentication cookie''s contents will be validated to ensure that
    they haven''t been changed between the browser and the server.

    None Neither encryption nor validation are used. Not recommended. |

    | timeout | Determines the amount of time, in minutes, until the authentication
    cookie expires. | Default is 30. You should set this value to the minimum amount
    that will allow users to use your site effectively. If you use persistent cookies
    with forms authentication, they will not time out.|'
