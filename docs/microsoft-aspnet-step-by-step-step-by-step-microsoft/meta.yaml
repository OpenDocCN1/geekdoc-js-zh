  md: '# Finding Your Best Starting Point


    ASP.NET Step By Step is designed to provide a comprehensive introduction and overview
    of developing Web applications with ASP.NET. The goal of this book is to help
    you become competent at the basic skills necessary for creating and using ASP.NET
    applications. To help you get there as quickly and easily as possible, this book
    has been divided into six parts, each composed of one or more chapters related
    to a specific topic. Over the course of these parts and chapters, you''ll learn
    about the new .NET development platform and the part ASP.NET plays in it. You''ll
    also learn the skills necessary to take advantage of ASP.NET Web Forms, Server
    Controls, and XML-based Web services.


    Depending on the skills and experience you bring to this book, you may wish to
    start with a particular part that is of interest to you or skip over certain parts
    entirely. The following table can help you decide where to start in this book.


    | If you are | Follow these steps |

    |---|---|n| New to programming | Install the sample files as described in "Installing
    the Sample Files" on page three. Learn about the background of the .NET Framework
    and ASP.NET by reading Chapters 1-4. Then work through Part III if you want to
    know more about the technologies underlying ASP.NET, or work through Part IV if
    you want to get straight into the coding.

    | | Work through the rest of the parts and chapters based on your interest in
    their topics. |'
  merge: -1
  pgno: 10
