  md: '# Visual Studio .NET Features


    The previous chapter looked at how to create a Web application using Visual Studio
    .NET but didn''t examine the Visual Studio .NET environment.


    # IDE Enhancements


    Some of the new enhancements you''ll find in the Visual Studio .NET include the
    following features.


    +   - Start Page This is the default page displayed each time you start Visual
    Studio .NET. It allows you to set up your preferences for the IDE, access recent
    and existing projects, and create new projects.


    +   - Multilingual IDE Unlike Visual Studio 6.0, which used different IDEs for
    each language (although Visual InterDev and Visual J++ share an IDE), in Visual
    Studio .NET, all languages share the same IDE. This means that standard features
    like Find and Replace, debugging, and so on work consistently across different
    languages. All alone will be a big productivity enhancer.


    +   - Command window A cross between Visual Basic''s Immediate window and a command
    line, the Command window lets you execute Visual Studio commands or code statements,
    depending on the mode of the window. The following figure shows a Command window
    that''s been switched to immediate mode using the immed command. The Command window
    has two modes:


    +   - Command mode Allows you to execute Visual Studio commands without using
    the menu system, or to execute commands that don''t appear in any menu.


    +   - Immediate mode Used in debugging. Allows you to evaluate expressions, check
    the value of variables, execute program statements and functions, etc.


    ![](bbox=[0.23, 0.706, 0.735, 0.866])'
  merge: -1
  pgno: 56
- img_proc: false
  md: '# ASP.NET Step by Step


    **Tabbed documents** Designed to simplify the management of multiple files being
    edited simultaneously, the Tabbed Documents interface allows you to see all of
    the files you''re editing at once. This makes it much simpler to switch back and
    forth between editing windows. You can still set up Visual Studio .NET using the
    old method used by Visual 6, however. Select Options from the Tools menu, select
    the General option in the Environment folder, switch from Tabbed Documents to
    MDI environment, and then click OK. You will need to restart Visual Studio .NET
    for this change to take effect.


    **Auto-hide** My personal favorite, auto-hide works like the feature of the same
    name in the Windows toolbar. To enable auto-hide for a window, click on the pushpin
    icon (shown in the margin) in the window''s title bar. The window will hide itself
    at the side of the IDE when it''s docked when the mouse moves away from the window,
    leaving only a tab with the window visible. Mousing over the tab will cause the
    window to reappear. This is a great feature for preserving the maximum amount
    real estate for the code window, and it can make life much easier in managing
    multiple windows in the IDE.


    **Improved HTML editor** Like InterDev before it, the Visual Studio .NET HTML
    editor provides both a design view and an HTML (source) view. Visual Studio .NET
    has done away with the Quick View window provided by Visual InterDev. Instead,
    you preview pages in an embedded browser window, which also supports specifying
    the HTML schema you''re writing for via the `targetSchema` property. Setting `targetSchema`
    determines which elements will be made available via the editor''s statement completion
    features and allows the IDE to provide you with feedback on syntax that''s incorrect
    in the context of your chosen schema.


    # New Features


    In addition to the IDE enhancements, there are a number of entirely new features
    in the Visual Studio .NET IDE.


    +   - XML editor This allows you to edit XML (.xml) and schema (.xsd) files in
    source, data, or schema views, depending on the type of XML file you''re editing.'
