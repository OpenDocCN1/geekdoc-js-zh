  md: '# Using Code-Behind in Web Forms


    In addition to the changes in &lt;script&gt; blocks and &lt;% render blocks in
    ASP.NET that make it easier to write clean code, ASP.NET introduces an entirely
    new concept called code-bind, which allows developers to entirely separate executable
    code from their HTML markup and server control tags.


    A code-behind for a Web Form consists of a file containing a class derived from
    the Page class, and optionally contained within a namespace. The Web Form page
    then inherits from the code-behind class at runtime, allowing both the Web Form
    and its code-behind class to be compiled into a single assembly for execution.


    # Separating Code from UI


    To show you this works, let''s use the ServerControls.aspx page one last time.
    To use code-behind with this page, follow these steps:


    +   - Open ServerControls.aspx in a text editor.

    - Using a text editor, create two new files, ServerControls.cb.aspx and ServerControls.cb.vb.

    - Copy all of the text from ServerControls.aspx and paste it into ServerControls.cb.aspx,
    and then close ServerControls.aspx.

    - Cut all the code contained within the &lt;script&gt; block in ServerControls.aspx
    and paste it into ServerControls.cb.vb, and then remove the &lt;script&gt; tags.

    - Add Src and Inherits attributes to the @ Page directive in ServerControls.cb.aspx
    to help ASP.NET locate the code-behind class file.


    ```

    <%@ Page Language="vb" Src="ServerControls.cb.vb"

    Inherits="ServerControls" %>

    <html>

    <head>

    </head>

    <body>

    <form runat="server">

    <asp:Label id="NameLabel" runat="server">Name:</asp:Label>

    <asp:TextBox id="NameTextBox"

    extTextChanged="NameTextBox_TextChanged" runat="server"/>

    <input id="NameButton" type="submit" runat="server"/>

    </form>

    ```


    Save ServerControls.cb.aspx. The final page should look like the following:'
  merge: -1
