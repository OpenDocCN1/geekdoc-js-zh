    # 第 11 章：为互联网准备图像


    希望如果你正在阅读这本书，你对图形设计有一点了解。并且希望你拥有某种图像编辑软件。


    我将使用 Photoshop 向你展示如何为互联网准备图像。


    了解这些知识非常有用，而且通常是你通过试错来学习的。


    ## 72 DPI


    如果你是一名平面设计师，或者来自打印背景，那么你可能对图像分辨率很熟悉。


    通常，在处理为打印准备的图像时，标准分辨率是 `300dpi`。然而，对于互联网来说，大多数图像都是 `72 dpi`。在某些少数情况下，你可能会遇到分辨率在
    90  dpi 以上的图片，而 `72` 是标准。


    你还需要确保使用正确的扩展扩展名保存图像，并针对你所选择的扩展名进行优化。


    ## 最常见的图像扩展名


    在为网络创建（基于像素的）图像时，你最常用的图像扩展名是 `.jpg`、`.gif` 和 `.png`。当然，你还有 `.svg`，它们是“可缩放矢量图形”，但我们暂时不会处理这些。


    每种扩展名在保存特定类型的图像时都有其优缺点。


    对于互联网来说，如何保存图像至关重要。如果你使用不适用于所保存图像的格式保存文件，那么加载时间将会更长。


    ### 何时使用 .JPG


    当你尝试保存的图像本质上是照片时，`.jpg` 是最佳选择。


    我的意思是，如果图像是由成千上万不同颜色和深色的微小像素组成的，那么将其保存为 `.jpg` 将是你最好的选择。


    图 11.1 – 如你所示，这张图片是由成千上万个彩色小方组成的。


    ![](img/00027.jpeg)

    如从上面的图片所示，光是狗额头上那个小点的像素与像素之间的颜色差异就如此，将此图像保存为 `.png` 或 `.gif` 会导致你的网站加载极其缓慢。


    将你的照片保存为 `.jpg` 是很棒，因为在 Photoshop 等照片编辑程序中，它提供了降低图像质量的选项，使文件更小。


    你可以在实际保存文件之前降低图像质量并查看最终图像将受到什么影响，以及图像加载需要多久。


    我喜欢做的是降低图像质量，同时观察图像的预估加载时间。这让我使图像质量达到可以接受的程度，同时加载时间又不过长。


    我取了上面这张图像（它是 `1920x1080` 像素，这对网络图片来说非常大），并使用 Photoshop 中的“存储为 Web 和设备”菜单计算出使用最常见的文件扩展名加载这张相同的图像需要多久。


    图 11.2 – 在下方你可以看到使用不同图像扩展名对这张小狗照片的加载时间预览。


    ![](img/00028.jpeg)

    如你所示，对于完全相同的图像，将此图像保存为 `.png` 会导致该图像在 56.6 Kbps 下需要 402 秒，`.gif` 需要 190 秒，而 100%
    质量的 `.jpg` 需要 114 秒。


    请记住，`.png` 和 `.gif` 可以通过修改来缩短加载时间，但图像质量会严重损害；而 `.jpg` 可以在降低质量的情况下对最终产品影响极小，且仍然加载得极快。


    ### .PNG 和 .GIF


    当所涉及图像基于纯色区域而不是成千上万个不同颜色像素时，`.PNG` 和 `.GIF` 是最佳的。


    图 11.3 – 由于下面的图像是基于纯色块的，因此 `.png` 或 `.gif` 文件扩展名效果最好。


    ![](img/00029.jpeg)

    上面的图片更适合保存为 `.gif` 或 `.png`。如果图像是动画的，它肯定会被保存为 `.gif`，因为 `.gif` 支持动画。


    `.gif` 和 `.png` 都支持透明度。

