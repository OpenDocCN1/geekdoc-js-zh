    As you can see, I''ve created a class called `container` and specified a margin
    of `0 auto`. What this means is that on the top and bottom of this `container`
    there should be a margin of 0 pixels and on the left and right the margin should
    auto regulate.


    This is a great technique however, don''t go thinking that you can center ANY
    object using this technique.


    In order for this technique to work:


    * The object needs to be a block level element (or at least specified to display
    block using CSS)

    * The object needs to have a width specified

    * The object can''t be floated

    * The object can''t have a fixed or absolute position (we''ll cover that next)


    # Chapter 14: Other Types Of Positioning Techniques


    In all honesty, I try to use floats to layout most of my websites. However, there
    are some exceptions that pop up from time to time.


    ## Relative Positioning


    This type of positioning is relative to the object''s original position.


    Basically after you''ve laid out some objects on the page. You may find that a
    particular object is not exactly where it needs to be.


    Using relative positioning, you simply specify that the position of that element
    is `position: relative;` and then you are able to move it based on it''s original
    position. You can say `top: 10px` or whatever the case may be using `top`, `bottom`,
    `right` & `left`.


    ## Absolute Positioning


    Absolute positioning is absolute, however it is based on any parent elements.
    For instance if you want to position an object "absolutely" and that object was
    inside of a div. The position you specify will be relative to that div.


    If the object is not wrapped in other elements it will be relative to the HTML
    page itself.


    Absolutely positioned elements don''t have any effect on other elements. They
    won''t push any other elements out of the way and are basically taken out of the
    general "flow" of the document.


    ## Fixed Positioning


    Fixed positioning is relative to the browser window itself. In other words when
    you open your web browser, depending on your screen size, if the browser is minimized
    or full screen, etc.


    As you scroll a fixed position element won''t move. I''ve used this in the past
    for times when I wanted the background of the page to be a fixed image and I didn''t
    want the image to scroll as the page scrolled.


    I''ve also used this for a social media sharing box which was affixed to the side
    of the browser window.


    Other uses you might have seen before include the arrow at the bottom right of
    the screen that pops up when you''ve scrolled a significant amount. (The button
    that allows you to quickly scroll up to the top of the page.)


    ### Using Positioning


    In order to use this type of positioning you simply have to specify the positioning
    type using CSS.


    One line of CSS will be dedicated to:


    `position: (relative, fixed or absolute);`


    Followed by lines of code which will tell WHERE to position the element based
    on: `top`, `right`, `left`, and `bottom`. You are able to use pixels, points,
    Em’s, etc. as your unit of measure.


    # Chapter 15: Fonts, Fonts, Fonts!


    Alright, so if you have a background in graphic design you would know that a serif
    font is one with tiny pointy things at the tips of the letter. Serif fonts are
    great for print because the serifs seem to blend the words together and are said
    to make it easier for the reader.


    However, on the internet, where everything is made up of pixels, serif fonts are
    not ideal. Not saying you shouldn''t use them, however if you''re going to use
    a serif font it''s better to use them for only headers or special type elements
    rather than body text.


    The reason for this is because pixels are square and when translating tiny squares
    into a serif font, the font''s often get lost in translation. This is where the
    term "web safe fonts" comes into play.


    ## How Declaring Fonts Works


    So, keep in mind that Times New Roman (or equivalent) is the default font unless
    specified otherwise. This means that unless you want to use Times New Roman you''ll
    definitely need to specify which font you''d like to use.


    Fonts get specified by family. To specify which fonts you want to use you start
    off with the CSS declaration `font-family`.


    ![](images/00052.jpeg)As you can see my text editor is trying to provide me with
    a list of suggestions.


    ![](images/00053.jpeg)Above is the typical font declaration. You basically list
    your options separated by a colon. The first on the list is the prioritized font,
    followed by all of your second choices and finally either serif, sans-serif or
    cursive depending on the font family.


    What this does is, no matter what fonts the person has on their computer you will
    have a greater chance of having the type be rendered the way you want it.


    In the above example, if the person has Arial than the computer will render the
    font as Arial. If the person is using a Mac, then they probably don''t have Arial
    and in that case the computer would render the font as Helvetica. And if all else
    fails, the computer would just use the default sans-serif font.


    Most of the default/classic declarations only have 3 options, however you can
    specify as many "fall back" fonts as you''d like.


    ## Other Font Methods


    Obviously, not everyone will want to use "normal" fonts for their web design projects.
    Some people will want to use special fonts because it fits in with their design,
    or company branding, etc.


    There are a few other options for creating websites using special fonts. Of which
    I''ll be covering the one that I use most often.


    ### Google Fonts


    Google has a library of web safe fonts listed at [www.google.com/fonts](http://www.google.com/fonts)
    where you can find a font that you like and use it on your web page.


    Figure 15.1 – Below is the Google web font archive located at www.google.com/fonts.


    ![](images/00054.jpeg)Above is a screen shot of Google''s font website. On here
    you can choose the font you want to use, as well as the weights of the font that
    you want to use. (The weight is the thickness of the font.)


    I will warn you however, the more Google fonts as well as the more weights that
    you choose for your project the longer it will take your website to load.


    In order to use Google fonts, simply choose the font you wish to use. Google will
    give you the link to a CSS stylesheet that you will have to link to in the header
    of your document. Then you will need to use the font-declaration that they give
    you whenever you want to use the font.


    Figure 15.2 – I am able to use as many font weights as I wish. However on the
    right, the page load graphic will tell me how much load time the fonts will add
    to my site.


    ![](images/00055.jpeg)As you can see above once you''ve chosen the font, you can
    choose the font weights you wish to use. Then Google updates the Page Load Tool
    to let you know how much the fonts will effect page load time.


    Once you''re done, scroll down to see...


    ![](images/00056.jpeg)I''m pretty sure I''ve mentioned this but different browsers
    render the EXACT same font DIFFERENTLY. This is important to know because what
    looks great in one browser may look totally weird in another if the font is of
    a slightly different size.


    Let''s check out how the same font renders in Firefox, Google Chrome and Internet
    Explorer. Keep in mind that these fonts are supposedly "Google" fonts. I think
    you''ll be surprised!


    ![](images/00057.jpeg)Above you''ll see Open Sans, rendered in Google Chrome,
    Firefox as well as Internet Explorer. As you can see each font appears slightly
    different. Each line of text is a different length even though each line contains
    the EXACT same characters.


    And the funniest thing...Google Chrome isn''t the best at displaying it''s own
    font. Internet Explorer, the worst browser of all time, is arguably the best at
    displaying fonts.


    ### Google Font Disclaimer


    This is another tip that I''ve learned through experience. Some Google fonts such
    as Oswald will display oddly if you have the font downloaded on your computer.

