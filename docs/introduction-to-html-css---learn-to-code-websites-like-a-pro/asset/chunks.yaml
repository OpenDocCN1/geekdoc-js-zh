- fmt: "\nWhat I've found is that this effect is caused because of what is known as\
    \ “anti-aliased” pixels. When it comes to transparent pixel based pictures. The\
    \ pixels around the outside of the image can't be a solid color. If that were\
    \ the case then the outer edge of the image would look “blocky”.\n\n![](images/00034.jpeg)\n\
    \nThe image to the right illustrates this fact. It's a little hard to create rounded\
    \ edges and beautiful, picturesque photographs using only tiny squares of color.\
    \ So in order to alleviate this problem, anti-aliasing is done and it essentially\
    \ creates half filled in pixels around the edge of the image to create the illusion\
    \ of a smooth edge.\n\nThis causes problems when it comes to saving transparent\
    \ images because if you try to save this image as a `.gif` these anti-aliased\
    \ pixels will have a white background by default.\n\nThis causes the effect that\
    \ you saw above with the white pixels around our cat image. However, when saving\
    \ your transparent images in `.gif` as well as `.png` format you have the option\
    \ to choose a “matte” that is a background color for those anti-aliased pixels.\n\
    \nThat way, if you want to use a transparent image on a red background you can\
    \ specify red as the matte color so the anti-aliased pixels will be less noticeable.\n\
    \nOf course you can skip all this by saving the image as a `.png-24` which has\
    \ superior transparency abilities. However, high quality, transparent `.png`s\
    \ can sometimes take a long time to load.\n\nFor this reason, I use a website\
    \ called [www.tinypng.com](http://www.tinypng.com/) to lower the file size on\
    \ my transparent `.png`s as well as all my `.png`s in general.\n\nFigure 11.7\
    \ – The car image below had an extremely large file size before I used `tinypng.com`\
    \ to compress it.\n\n![](images/00035.jpeg)\n\nTiny PNG is great for when you\
    \ have a `.jpg` quality image that you still want to have superior transparency.\
    \ The car in the above website is fully transparent, including the shadow the\
    \ car is casting as well as the light rays coming from behind the car. Saving\
    \ a transparent image like this will cause the image to take a long time to load.\
    \ However, with image compression software it's a piece of cake!\n\n# Chapter\
    \ 12: Manipulating Placement Of HTML Objects\n\nKnowing how to place objects where\
    \ you want them is extremely important when it comes to designing a website the\
    \ way you want it to look.\n\nIn order to do this however, you must first know\
    \ a little bit about how HTML objects behave. HTML objects are either considered\
    \ to be “inline” or “block” level elements.\n\n## Inline vs. Block Level Elements\n\
    \nIn order to illustrate the difference between an inline element and a block\
    \ level element I'll be creating different HTML elements on a blank page and then\
    \ inspecting them using Google Chrome's element inspect option.\n\nFigure 12.1\
    \ – I clicked “inspect element” on the `H1` tag at the top of the page to show\
    \ you that block level elements take up as much horizontal space as possible.\
    \ Even though the text itself only utilizes about 1/16th of the page it is still\
    \ causing elements below it to be placed on the next line.\n\n![](images/00036.jpeg)\n\
    \nIt is a little hard to tell, but I filled the page with a bunch of block level\
    \ elements and a few inline elements.\n\nThe difference between a block level\
    \ element and an inline element is that a block level element will take up as\
    \ much space as it needs vertically and as much space as it can horizontally.\n\
    \nAs you can see I have inspected the `H1` tag (that's whats known as a heading\
    \ 1) and the blue and pink region illustrate the amount of space that the object\
