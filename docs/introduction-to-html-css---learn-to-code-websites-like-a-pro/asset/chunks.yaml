    # Chapter 6: HTML Structure


    Before you begin to get acquainted with HTML you need to know a bit about the
    structure of HTML elements.


    ## Beginning And Ending HTML Tags


    Any element that can be wrapped around something has a beginning tag and an ending
    tag. The beginning tag will be encapsulated with using “less than” and “greater
    than” symbols (< >) the ending tag will be encapsulated with the same symbols
    with the addition of a forward slash (</ >).


    Examples:


    <body>This is the body tag, it is the body of the HTML document and all HTML elements
    which are to be featured on the page are between the beginning and ending of this
    element.</body>


    <p>This is a paragraph tag.  All text that you wish to be included in this paragraph
    go here.</p>


    ## Self Contained HTML Tags


    Elements that are self contained end themselves using a forward slash located
    right before the ending “>” symbol.


    Below is a “break” tag.  The break tag is used to cause a sentence to go to the
    next line, or free up some space in your document. The break tag can be used just
    like the enter key does when typing in a Microsoft Word document.


    In the past using <br> used to be acceptable, valid HTML however in recent years
    you need to end the tag within itself (as seen below with a space and a forward
    slash). 


    Example:


    <br />


    Below is a “horizontal rule” tag.  This HTML element creates a horizontal line
    on the page.  Since this line cannot be wrapped around any other HTML elements,
    it is self contained.  Below is an example of a horizontal rule.


    Example:


    <hr />


    # Chapter 7: CSS Structure


    CSS can be a little bit more complicated because there are many CSS declarations
    that you can make and each declaration has it''s own set of rules. 


    However, there is a few things that never change when it comes to CSS so I''ll
    share them with you now so that you can have a better understanding before we
    start jumping head first into the subject.


    CSS follows the structure that you see below. CSS is written like this when you
    declare your CSS in the head of the document or in a separate document.


    Figure  7.1 – Below you can see the structure of CSS stylings.


    ![](images/00007.jpeg)Some people like to write their CSS directly in the HTML
    element itself it is known as “inline CSS”. Below is an example. 


    ![](images/00008.jpeg)


    With inline CSS styles there is no question as to the element being targeted so
    the targeting as well as the brackets get omitted.  However the CSS property,
    the colon, the CSS property declarations and the ending semi-colon are all there.


    Best practice with CSS is to keep all your CSS in a separate document and link
    the document to your HTML.  However, as you can see there are a few different
    ways to write your CSS.  To save time and to avoid confusion we will be just covering
    how to write your CSS in a separate document.


    Inline styles are kind of frowned upon because they can increase load times in
    websites and are seen as being amateur-ish.


    ## Targeting An HTML Element


    In order to begin to write a CSS declaration about any element, you must first
    tell the CSS document which element to target.


    ### Broad Example


    If you wanted to target every instance of a particular HTML element you would
    begin your CSS declaration with the name of that element.


    Examples:


    *   body (Targets the body of the HTML document and all elements contained within)


    *   h1 (Targets all h1 header elements in the document)


    *   a (Targets all links)


    ### Targeting An Element by “Class”


    Another way to target elements is to give them classes.  Classes allow you to
    target elements based not on the type of HTML element but by the classes that
    you wish to give those elements. 


    Classes are great because they allow you to style objects with more precision.


    Below is an example of giving an HTML element a class.


    ![](images/00009.jpeg)As you can see, in order to give an element a class you
    must add “class=”, followed by the class name in quotation marks.


    In order to target a class, it''s very similar to targeting an HTML element. 
    Except you use the name of the class with a period in front of it.


    Below is an example of targeting an HTML element by class.


    ### ![](images/00010.jpeg)Targeting An Element By ID


    Classes are cool because you can have as many elements on a page as you want with
    the same class.


    However, there comes a time when maybe there is only one element on the page which
    you want to give a bit of significance to.


    An ID is a way to target an HTML element.  However, there can only be 1 element
    with the same ID per page. 


    Sure you can have multiple elements with the same ID on the same HTML page.  However,
    when you go to validate the document it will show as invalid in an HTML validation
    program, as this is not a valid HTML technique.


    To give an HTML element an ID it is very similar to the class declaration.


    ![](images/00011.jpeg)Giving an HTML element an ID is almost identical to giving
    an HTML element a class.  Except, instead of typing “class =''class name''” you
    simply type “id=''id name''”.'
