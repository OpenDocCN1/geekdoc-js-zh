  trans: "\n使用 CSS 定位元素几乎完全相同。不同在于，你不是在 id 名称前加点号，而是使用井号 (#)。\n\n## CSS 定位\n\n###\
    \ 嵌套 CSS 定位\n\n要定位其他元素内部的元素，只需从大到小的顺序声明元素并用空格分隔。例如，要定位包裹在链接中的图像，你可以使用 `a img`\
    \ 来定位这些元素。请记住，嵌套 CSS 定位的深度可以达到你需要的任何程度。\n\n只要你定位的元素包含在所指定的元素中，你的样式就会作用于该元素。\n\n\
    ### 高级 CSS 定位\n\n随着 CSS3 的出现，有了更多方法来定位 HTML 元素以进行样式化。\n\n例如，在 HTML 中，有几个不同的元素都使用了相同的类名。\n\
    \n如果你正在读这本书，那么你可能已经混淫滚场多年，在互联网上见过各种东西。网站中最常见的元素之一就是 Web 表单。\n\n你这辈子很可能见过几个 Web\
    \ 表单，因为总会有某些广告商或企业希望你填写并提交表单。\n\n“input”元素是一个功能非常多的元素。这一个元素可以作为表单中的文本字段，也可以作为日期字段、电话号码字段以及提交按钮！\n\
    \n这引出了我们的下一个问题：如何在不干扰你不想想要修改的其他元素的情况下，为特定类型的“input”元素设置样式呢？\n\n![](img/00013.jpeg)\n\
    \n你在上面看到的是稍微高级的 CSS 声明。\n\n如你所示，我通过用逗号分隔每个 HTML 元素，使用相同的 CSS 声明定位了多个 HTML 元素。\n\
    \n我还使用括号定位了两种不同类型的输入（type=”text” 和 type=”date”）。\n\n你现在可能还没有完全理解这一点。但是，我正在定位**每一个**\
    \ type 等于“text”的 input，**除了**类名为“s”的那些。我正在使用 `:not(element in question)` 来实现此点。\n\
    \n不过，还有其他几种定位 HTML 元素的高级技术，但我不想让你信息过载。我们只涵盖一些基础构建块来帮助你入门。\n\n### CSS 层级结构\n\n\
    CSS 被称为级联样式表（Cascading Style Sheets），是因为为 CSS 设置的规则会“级联”到文档中的其他元素中。例如，文档中位置较低的\
    \ CSS 样式将覆盖文档中位置较高的样式。例如，第 1 行的样式会被第 365 行针对相同元素的样式所覆盖。这意味着如果你将文档的默认字体族（font-family）声明为\
    \ Arial，然后在文档后部分指定为 Tacoma，那么后者的样式将生效。\n\nCSS 定位更具体的 CSS 样式将覆盖定位更模糊的样式。例如，指向所有段落标签（p\
    \ tags）的 CSS 样式将被指向所有具有你选择的类或 id 的段落标签的 CSS 样式所覆盖。\n\n如果你定位一个 HTML 对象并给该对象提供两个冲突的样式，浏览器将渲染文档中位置较低的样式。例如，如果你给所有标题设置了\
    \ 10 像素的外边距（margin），然后又说所有标题应该有 15 像素的外边距，浏览器将渲染后的样式。\n\n如果 HTML 对象本身具有内联样式（inline\
    \ style），那么在大多数情况下将渲染内联样式。内联样式的示例例如：\n\n```html\n<img src=\"/images/example.jpg\"\
    \ alt=\"This is alternative text\" style=\"float:left;\" />\n```\n\n在大多数情况下，在\
    \ CSS 声明的结束分号之前添加 `!important` 声明，就可以绕过所有这些冲突的样式。\n\n# 第 8 章：常用 HTML 元素及其规则\n\n\
    ## Div\n\ndiv 本质上是一个用于包含其他对象的 HTML 元素。我相信 div 是 division（分区）的缩写。div 对于网站布局至关重要。由于\
    \ div 这个词的描述性不强，HTML5 生成了具有不同名称的新类型 div。这些新的“类 div”元素被称为：header, nav, section,\
    \ aside, article, details, footer 和 summary。\n\n要使用 div，只需使用这个起始和结束标签来包裹你想要组织的元素。div\
    \ 是块级元素（block level elements），你将在书后面的部分学习到。\n\n```html\n<div>这里是 div 内容。</div>\n\
    ```\n\n这种格式与新的 HTML5 元素相同。\n\n```html\n<header>这里是页眉内容。</header>\n```\n\n## 标题\n\
    \n标题顾实其名。它们是文本标题，大小从 H1 到 H6 不等。H1 在搜索引擎眼中最大且最高，而 H6 最小且最不重要。\n\n要使用标题，只需用起始和结束标题标签包裹标题文本。标题是块级元素。这可能显而易见，但不要用错标题的标签。\n\
    \n```html\n<h1>这是一个 H1 标题。</h1>\n```\n\n```html\n<h2>这是一个 H2 标题。</h2>\n```\n\n\
    ...\n\n```html\n<h6>这是一个 H6 标题。</h6>\n```\n\n## 图像\n\n图像也非常自明其义。图像是“内联块”（inline\
    \ block）级元素。为了保持代码有效，请确保你在文档中使用的每个图像都指定了“alt”属性。“alt”属性在图像由于任何原因无法加载时非常重要。alt\
    \ 属性对于视觉受障的网站访问者也很有用。在这两种情况下，图像都会显示描述图像的替代文本，这样他们就能更好地了解网站的主题。\n\n使用图像只需使用以下格式：\n\
    \n```html\n<img src=\"path\" alt=\"替代文本\" />\n```\n\n显然，path 指向图像的位置，alt 应该替换为实际的文本。图像本身不能包裹其他元素，如你所看到的结束符号（>）。注意：如果你留空\
    \ alt 属性，它是有效的，而不是内部的文本。\n\n## 段落、跨 和引用块\n\n段落（paragraph）正如其名……一个段落。我会注意到有些人使用不合规的做法，比如把段落标签当作\
    \ div。段落是块级元素。要使用段落，只需用段落标签包裹文本。\n\n```html\n<p>你的段落文本在这里。</p>\n```\n\nspan 是用于你希望以某种方式特殊处理的一段文本。span\
    \ 是内联元素（inline elements），通常包裹在块级元素中，例如段落。\n\n要使用 span，用 HTML 标签包裹你的 span 文本。\n\
    \n```html\n<span>span 文本在这里。</span>\n```\n\n引用块（blockquote）通常用于引用来源或人物。引用块是块级元素，可以包裹其他块级元素。\n\
    \n要使用引用块，只需用 HTML 标签包裹引用块。\n\n```html\n<blockquote>引用块文本在这里。</blockquote>\n```\n\
    \n## 无序列表和有序列表\n\n如果你用过 Microsoft Word，那么一定遇到过无序列表和有序列表。无序列表是项目列表，有序列表是有编号的列表。它们都是块级元素。\n\
    \n这在你看来可能很奇怪，但大多数人使用极样式化的无序列表作为导航栏。这是因为无序列表是指定用于列表的，而导航栏本质上是一个链接列表。\n\n要使用无序列表，使用以下格式：\n\
    \n```html\n<ul>\n  <li>列表项在这里</li>\n  <li>列表项在这里</li>\n  <li>列表项在这里</li>\n  <li>列表项在这里</li>\n\
    </ul>\n```\n\nUL 代表无序列表，而 LI 代表列表项。\n\n要使用有序列表，使用以下格式：\n\n```html\n<ol>\n  <li>列表项\
    \ 1 在这里</li>\n  <li>列表项 2 在这里</li>\n  <li>列表项 3 在这里</li>\n  <li>列表项 4 在这里</li>\n\
    </ol>\n```\n"
- fmt: "\n`OL` means ordered list while `LI` means list item.\n\n## Links\n\nLinks\
    \ make the internet go around. Links are inline-elements. To use a link use the\
    \ following format.\n\n```html\n<a href=”path”>Text, image, or whatever you wish\
    \ to link to goes here.</a>\n```\n\nObviously keep in mind that the word `path`\
    \ should be replaced with the url which you wish to link to.\n\n## Tables\n\n\
    In the past people would lay out entire websites using tables. Today however,\
    \ that technique is frowned upon. Tables are great for keeping information neat\
    \ and tidy. Tables are block level elements.\n\nTo use a table use the following\
    \ format.\n\n```html\n<table>\n<th>\n   <td>Jill</td>\n   <td>Smith</td>\n   <td>50</td>\n\
    </th>\n<tr>\n   <td>Eve</td>\n   <td>Jackson</td>\n   <td>94</td>\n</tr>\n</table>\n\
    ```\n\n`TH` stands for table header, `TR` stands for table row and `TD` stands\
    \ for table data. Essentially listing the top row as a table header isn't necessary\
    \ as all rows can just be labeled as table rows. However, if you wish to style\
    \ the top row using CSS you may want to utilize the `TH` tag as it will make it\
    \ easier to target the top row.\n\n## Forms\n\nForms are a little beyond the scope\
    \ of this book. Not because forms are difficult to use but because they normally\
    \ require a bit of Javascript or other type of code to work. I won't go on to\
    \ mention much about this. However, I will just give you a quick tip and say that\
    \ in order for a text area to be valid code you must specify a `cols` and `rows`\
    \ attribute. This essentially gives the text area a width and height however you\
    \ can later manipulate these dimensions with CSS if you wish.\n\n# Chapter 9:\
    \ Common CSS Styles And Their Rules\n\nI will go into a few different CSS techniques\
    \ in greater detail later in the book so for now I'll just list a couple of the\
    \ important CSS declarations and their rules.\n\n## Color\n\nThe `color` attribute\
    \ always denotes the color of the text. To use the `color` attribute simply use\
    \ the following format. Black is default when it comes to color, unless you're\
    \ talking about a link.\n\n`color: #000000;`\n\nLater on in the book I'll explain\
    \ how HTML color works and how to use the hexadecimal system for specifying colors.\
    \ You can specify color using the hexadecimal system, `rgb` or even list them\
    \ by name.\n\n## Fonts\n\nThere are a ton of CSS declarations which deal with\
    \ fonts. We're going to briefly touch upon a few.\n\n`font-family: 1st choice,\
    \ 2nd choice, last resort;`\n\nFonts are specified by family. More on this later.\n\
    \n`font-size: 12px;`\n\nFont size can be specified by pixel size, `em`'s, you\
    \ can even specify by using adjectives (large, small, etc.)\n\n`font-weight: bold;`\n\
    \nFont weight can be specified by hundreds (`100`, `200`, `300`, up to `900`).\
    \ `100` being the thinnest and `900` being the thickest. You can also specify\
    \ font weight by using `bold`, `bolder`, `lighter` & `normal`.\n\n`text-transform:\
    \ uppercase;`\n\nUsing `text-transform` you can specify that you want a particular\
    \ block of text to be uppercase or lowercase. The text will then be rendered in\
    \ that specific case regardless of how it's written in the actual HTML document.\n\
    \n`line-height: 14px;`\n\nUsing `line-height` you can specify the height between\
    \ lines of text. You can specify the amount using pixels, `ems`, etc.\n\n## Height\
    \ & Width\n\nYou can specify height and width for various objects. You can use\
    \ pixels, `em`'s, percentages, etc. as the unit of measurement. To use height\
    \ and width use these formats:\n\n`height: 100px;`\n`width: 50%;`\n\n## Borders\n\
    \nThere may come a time when you want to give something a border. You can specify\
    \ all 4 borders at once or you can specify one border at a time. (There may be\
    \ alternative ways to specify the border however, we'll just use the basics for\
    \ now.)\n\n`border: 1px solid #ffffff;`\n\nTo specify a border, begin with the\
    \ border width in pixels, followed by the style (options include: `solid`, `dotted`,\
    \ `dashed`, `thin`, `inset`, etc.), followed by the color. To specify a border\
    \ on a specific side use:\n\n`border-right: 1px solid #ffffff;`\n`border-left:\
    \ 1px solid #ffffff;`\n`border-top: 1px solid #ffffff;`\n`border-bottom: 1px solid\
    \ #ffffff;`\n\n## Margins & Padding\n\nI go into more detail later on in the book.\
    \ However, margins form invisible barriers between objects.\n\nPadding is essentially\
    \ like a margin however it works as an internal barrier for objects inside of\
    \ an HTML element. For example, if you have a `div` with a padding of 10 pixels\
    \ all the way around. Any object inside of the `div` won't be able to get within\
    \ 10 pixels of the edge.\n\nI list out how to use these in detail later in the\
    \ book.\n\n## Floats\n\nSome HTML elements naturally stack on top of each other\
    \ because they use up all the width allotted to them and some do not. In order\
    \ to alleviate this for times when you have two objects that stack and wish to\
    \ have them side by side, you can use floats.\n\nTo float an object use the following\
    \ format:\n\n`float: left;`\n\nYou can either float an object `left`, `right`\
    \ or `none`.\n\nA float basically tells a stack-able HTML element that it should\
    \ only take up as much horizontal space as it actually needs rather than hogging\
    \ up all the horizontal space. Then it tells the element to begin stacking either\
    \ left, right or center.\n\n## Display\n\nYou can use the `display` attribute\
    \ to display a block level element as inline, and inline element as block or not\
    \ at all.\n\nTo use this feature use the following format:\n\n`display: block;`\n\
    \nYour options here include `block`, `inline`, `inline-block`, as well as `none`.\
    \ `display:none;` is for when you don't want to display an object at all.\n\n\
    ## Overflow\n\nThere might come a time when you have a `div` which you have specified\
    \ a width or height for, and you have placed an object inside of the `div` which\
    \ extends past the boundaries of its containing element.\n\nIn this case you have\
    \ an overflow. To style this use the following format:\n\n`overflow: scroll;`\n\
    \nYour options here include: `scroll` (which places scroll bars inside the element),\
    \ `hidden` (which hides the excess) as well as `visible` (this shows the excess).\n\
    \n## Position\n\nLater on I'll give you my technique for laying out a website.\
    \ However, there are a few different positioning declarations.\n\nTo use the `position`\
    \ declaration use the following format:\n\n`position: relative;`\n\n`position`\
    \ has a few options, such as `relative` (relative to it's current position), `fixed`\
    \ (fixed in one position relative to the browser window and doesn't move) and\
    \ `absolute` (this is an absolute position based on any containing elements.)\n\
    \nWhen you use the `position` property you must then specify the position based\
    \ on the distance from either the top, left, right or bottom.\n\nYou do so using\
    \ the following format:\n\n`top: 10px;`\n\nYou can use any combination of `top`,\
    \ `left`, `right` or `bottom` and use any valid unit of measure you wish. IE:\
    \ pixels, points, `ems`, etc.\n\n## Things To Remember\n\nThere are honestly too\
    \ many CSS declarations to mention here. You'll have to learn more as you go along.\
    \ Some other great CSS declarations include `border-radius` which gives you rounded\
    \ corners as well as some of the CSS3 transitions and animations which are a little\
    \ more advanced.\n\nSome things to remember are:\n\n* You can't have more than\
    \ one background image on a particular object\n* HTML objects inherit default\
    \ styles\n* Child elements inherit styles from parent elements\n* Styles that\
    \ are lower in the stylesheet override styles which are higher up in the stylesheet\
    \ (unless `!important` is used directly before the ending semi-colon)\n* You only\
    \ have to specify as much CSS as you need to. For example if an object inherited\
    \ a style that you like, you don't have to redefine the style. Only use as much\
    \ CSS as needed.\n\n# Chapter 10: Getting Started\n\nOk, now that we've gotten\
    \ a few of the lesser boring facts out of the way we can begin to get our hands\
    \ dirty a bit.\n\nAnyone can read a book about coding a website however, it's\
    \ not until you've taken that knowledge and began to apply it that your journey\
    \ actually begins.\n\n## The Mockup\n"
  raw: "OL means ordered list while LI means list item.\n\n### Links\n\nLinks make\
    \ the internet go around.  Links are inline-elements.  To use a link use the following\
    \ format.\n\n<a href=”path”>Text, image, or whatever you wish to link goes here.</a>\n\
    \nObviously keep in mind that the word path should be replaced with the url which\
    \ you wish to link to.\n\n### Tables\n\nIn the past people would lay out entire\
    \ websites using tables.  Today however, that technique is frowned upon.  Tables\
    \ are great for keeping information neat and tidy. Tables are block level elements.\n\
    \nTo use a table use the following format.\n\n<table>\n\n<th>\n\n   <td>Jill</td>\n\
    \n   <td>Smith</td>\n\n   <td>50</td>\n\n</th>\n\n<tr>\n\n   <td>Eve</td>\n\n\
       <td>Jackson</td>\n\n <td>94</td>\n\n  </tr>\n\n</table>\n\nTH stands for table\
    \ header, TR stands for table row and TD stands for table data.  Essentially listing\
    \ the top row as a table header isn't necessary as all rows can just be labeled\
    \ as table rows.  However, if you wish to style the top row using CSS you may\
    \ want to utilize the TH tag as it will make it easier to target the top row.\n\
    \n### Forms\n\nForms are a little beyond the scope of this book.  Not because\
    \ forms are difficult to use but because they normally require a bit of Javascript\
    \ or other type of code to work.  I won't go on to mention much about this.  However,\
    \ I will just give you a quick tip and say that in order for a text area to be\
    \ valid code you must specify a cols and rows attribute.  This essentially gives\
    \ the text area a width and height however you can later manipulate these dimensions\
    \ with CSS if you wish.\n\n# Chapter 9: Common CSS Styles And Their Rules\n\n\
    I will go into a few different CSS techniques in greater detail later in the book\
    \ so for now I'll just list a couple of the important CSS declarations and their\
    \ rules.\n\n### Color\n\nThe color attribute always denotes the color of the text. \
    \ To use the color attribute simply use the following format.  Black is default\
    \ when it comes to color, unless you're talking about a link.\n\ncolor: #000000;\n\
    \nLater on in the book I'll explain how HTML color works and how to use the hexadecimal\
    \ system for specifying colors.  You can specify color using the hexadecimal system,\
    \ rgb or even list them by name.\n\n### Fonts\n\nThere are a ton of CSS declarations\
    \ which deal with fonts.  We're going to briefly touch upon a few.\n\nfont-family:\
    \ 1st choice, 2nd choice, last resort;\n\nFonts are specified by family.  More\
    \ on this later.\n\nfont-size: 12px;\n\nFont size can be specified by pixel size,\
    \ em's, you can even specify by using adjectives (large, small, etc.)\n\nfont-weight:\
    \ bold;\n\nFont weight can be specified by hundreds (100,200,300, up to 900). \
    \ 100 being the thinnest and 900 being the thickest.  You can also specify font\
    \ weight by using bold, bolder, lighter & normal.\n\ntext-transform: uppercase;\n\
    \nUsing text-transform you can specify that you want a particular block of text\
    \ to be uppercase or lowercase.  The text will then be rendered in that specific\
    \ case regardless of how it's written in the actual HTML document.\n\nline-height:\
    \ 14px;\n\nUsing line-height you can specify the height between lines of text.\
    \ You can specify the amount using pixels, ems, etc.\n\n### Height & Width\n\n\
    You can specify height and width for various objects.  You can use pixels, em's,\
    \ percentages, etc. as the unit of measurement. To use height and width use these\
    \ formats:\n\nheight: 100px;\n\nwidth: 50%;\n\n### Borders\n\nThere may come a\
    \ time when you want to give something a border.  You can specify all 4 borders\
    \ at once or you can specify one border at a time. (There may be alternative ways\
    \ to specify the border however, we'll just use the basics for now.)\n\nborder:\
    \ 1px solid #ffffff;\n\nTo specify a border, begin with the border width in pixels,\
    \ followed by the style (options include: solid, dotted, dashed, thin, inset,\
    \ etc.), followed by the color. To specify a border on a specific side use:\n\n\
    border-right: 1px solid #ffffff;\n\nborder-left: 1px solid #ffffff;\n\nborder-top:\
    \ 1px solid #ffffff;\n\nborder-bottom: 1px solid #ffffff;\n\n### Margins & Padding\n\
    \nI go into more detail later on in the book. However, margins form invisible\
    \ barriers between objects.\n\nPadding is essentially like a margin however it\
    \ works as an internal barrier for objects inside of an HTML element.  For example,\
    \ if you have a div with a padding of 10 pixels all the way around.  Any object\
    \ inside of the div won't be able to get within 10 pixels of the edge.\n\nI list\
    \ out how to use these in detail later in the book.\n\n### Floats\n\nSome HTML\
    \ elements naturally stack on top of each other because they use up all the width\
    \ allotted to them and some do not.  In order to alleviate this for times when\
    \ you have two objects that stack and wish to have them side by side, you can\
    \ use floats.\n\nTo float an object use the following format:\n\nfloat: left;\n\
    \nYou can either float an object left, right or none. \n\nA float basically tells\
    \ a stack-able HTML element that it should only take up as much horizontal space\
    \ as it actually needs rather than hogging up all the horizontal space.  Then\
    \ it tells the element to begin stacking either left, right or center.\n\n###\
    \ Display\n\nYou can use the display attribute to display a block level element\
    \ as inline, and inline element as block or not at all.\n\nTo use this feature\
    \ use the following format:\n\ndisplay: block;\n\nYour options here include block,\
    \ inline, inline-block, as well as none.  “Display:none;” is for when you don't\
    \ want to display an object at all.\n\n### Overflow\n\nThere might come a time\
    \ when you have a div which you have specified a width or height for, and you\
    \ have placed an object inside of the div which extends past the boundaries of\
    \ its containing element.\n\nIn this case you have an overflow.  To style this\
    \ use the following format:\n\noverflow: scroll;\n\nYour options here include:\
    \ scroll (which places scroll bars inside the element), hidden (which hides the\
    \ excess) as well as visible (this shows the excess).\n\n### Position\n\nLater\
    \ on I'll give you my technique for laying out a website. However, there are a\
    \ few different positioning declarations.\n\nTo use the position declaration use\
    \ the following format:\n\nposition: relative;\n\nPosition has a few options,\
    \ such as relative (relative to it's current position), fixed (fixed in one position\
    \ relative to the browser window and doesn't move) and absolute (this is an absolute\
    \ position based on any containing elements.)\n\nWhen you use the position property\
    \ you must then specify the position based on the distance from either the top,\
    \ left, right or bottom.\n\nYou do so using the following format:\n\ntop: 10px;\n\
    \nYou can use any combination of top, left, right or bottom and use any valid\
    \ unit of measure you wish. IE: pixels, points, ems, etc.\n\n## Things To Remember\n\
    \nThere are honestly too many CSS declarations to mention here. You'll have to\
    \ learn more as you go along.  Some other great CSS declarations include border-radius\
    \ which gives you rounded corners as well as some of the CSS3 transitions and\
    \ animations which are a little more advanced.\n\nSome things to remember are:\n\
    \n*   You can't have more than one background image on a particular object\n\n\
    *   HTML objects inherit default styles\n\n*   Child elements inherit styles from\
    \ parent elements\n\n*   Styles that are lower in the stylesheet override styles\
    \ which are higher up in the stylesheet (unless !important is used directly before\
    \ the ending semi-colon)\n\n*   You only have to specify as much CSS as you need\
    \ to.  For example if an object inherited a style that you like, you don't have\
    \ to redefine the style.  Only use as much CSS as needed.\n\n# Chapter 10: Getting\
    \ Started\n\nOk, now that we've gotten a few of the lesser boring facts out of\
    \ the way we can begin to get our hands dirty a bit.\n\nAnyone can read a book\
    \ about coding a website however, it's not until you've taken that knowledge and\
    \ began to apply it that your journey actually begins.\n\n## The Mockup"
