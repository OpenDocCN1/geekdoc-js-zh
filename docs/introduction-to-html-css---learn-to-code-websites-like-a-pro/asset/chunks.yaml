    # 第 1 章：从这里开始！


    我知道你在想什么，"哦，又是介绍...跳过！"但是，我建议你不要跳过这个介绍，因为我不会在这里吹嘘我的资历，也不会讲什么感人的故事，说我的 HTML/CSS
    书是如何治愈了一个临终之人的疾病。


    相反，我只是想给这本书一点背景。


    就像生活中的大多数事情一样，从外面看，编写网站似乎非常困难。然而，一旦你知道了这行的诀窍，它就会变得轻而易举。


    如果你在互联网上仔细观察，你可能会注意到网站有许多不同的风格。从居中的单页网站到带有侧边栏导航的网站，再到完全用 Flash 动画构建的网站。


    我提到这一点是因为这引出了一个观点：编写网站有不止一种方法。我们将在本书后面讨论这个问题。


    ## 网站设计历史简介


    免责声明：这个简要历史仅基于我个人的观察。由于这对本书来说不是必需的，我不会浪费时间去查找日期、收集参考资料或核实事实。你只能姑且相信这些内容。


    互联网的出现带来了非常丑陋的网站。最初，网站设计师依赖一种非常过时的技术来布局他们的网站，即使用所谓的"表格"。你可能对表格很熟悉，因为它们在 Microsoft
    Word 中也有使用。


    基本上，表格用于分割页面上的内容，并允许用户使用 2 列和 3 列布局，这种布局至今仍在广泛使用。


    一旦这种对表格的狂热稍微消退，网站设计师就转而使用所谓的"div"来布局他们的网站。div 是另一个 HTML"标签"，它允许用户根据自己的需要分割内容。


    我还应该提到，有一段时间，Flash 变得非常流行。Flash 受到很多人的喜爱，因为它允许设计师无需代码就能将对象放置在任何想要的位置，创建惊人的动画，并实现使用
    HTML、CSS 或 Javascript 根本无法实现的功能。


    这把我们带到了今天。随着 HTML5 和 CSS3（HTML 和 CSS 的最新版本）的出现，网站设计师能够创建出色的动画，并实现过去只有在 Flash 动画或使用
    Javascript 的情况下才可能实现的功能。


    如今，随着移动设备和平板电脑的日益普及，移动网站设计以及自适应网页设计正在成为新的标准，这将把我们带入未来的网站世界。


    ## 我希望通过这本电子书实现的目标


    我希望任何一个不熟悉 HTML/CSS 的人都能拿起这本电子书，并用它来获得使用 HTML 和 CSS 编写网站的坚实理解。


    我想涵盖 HTML/CSS 的所有基础知识，但不会过于深入。请注意，这个主题非常广泛，我将覆盖入门所需的一些必要内容。


    但请注意，我是一个非常啰嗦的人。也就是说，我知道这应该是一本入门书籍，但在过程中我会给你一些必要的知识种子，帮助你进入网站建设的第二阶段。


    那时你将从编写静态页面毕业到完整的响应式网站设计。


    互联网上有很多资源可以帮助你学习如何构建网站。然而，这些资源都不会给你那种只有通过多年经验、长时间的故障排除以及对着电脑屏幕大喊大叫才能获得的优势，我希望把这些传授给你。


    话虽如此，让我们开始吧！


    # 第 2 章：理解 HTML


    他们说，大师和新手的区别在于大师知道这行的诀窍。正是大师所知道的那些微小而微妙的东西让他比新手更有优势。


    你可能不知道，但任何使用过电脑的人（即使没有互联网）可能都使用过和操作过 HTML。


    HTML 代表"超文本标记语言"，顺便说一句。


    如果你使用过 Microsoft Word，那么你很可能接触过大量的 HTML 元素，而你甚至没有意识到。


    这些包括：


    *   标题（标题 1 到标题 6）

    *   表格

    *   有序列表（带有编号的项目符号的列表）

    *   无序列表（这个列表就是一个例子）

    *   链接（你肯定遇到过带有网站链接的 Word 文档）


    我确信还有更多的例子，但这些是我认为大多数人都熟悉的突出元素。


    而且，就像 Word 文档一样，网站可以非常平淡，没有任何样式...或者你可以发挥想象力，使用花哨的字体、彩色文本、图片、背景等来让它变得更有趣！


    图 2.1 - 左边是一个网站，右边是同一个网站但去掉了 CSS。


    ![](img/00001.jpeg)


    CSS 代表"层叠样式表"，当人们提到 CSS 时，他们通常会谈论"样式表"，即包含 CSS 代码的文档。正如你在上面的图 2.1 中看到的，左边是一个由
    HTML 和 CSS 组成的网站。而在右边，你有完全相同的网站，但是我删除了样式表。


    HTML 包含页面上所有的元素，即：图片、文字、链接等，而 CSS 是网站设计师用来指定颜色、方向、字体等的代码。


    正如你所看到的，右边的网站（去掉 CSS 后）看起来非常像你可以在 Microsoft Word 中创建的东西。


    而且，就像 Microsoft Word 的元素一样，每个 HTML 元素都带有预设的样式。


    '
