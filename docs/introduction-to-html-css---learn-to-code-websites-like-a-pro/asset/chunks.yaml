    Targeting the element with CSS is almost identical as well. Except, instead of
    putting a period before the id name you use a hash mark (#).


    ## CSS Targeting


    ### Nested CSS Targeting


    To target elements inside other elements simply declare the elements from biggest
    to smallest separated by a space. For example to target an image wrapped in a
    link you would target those elements by using `a img`. Keep in mind you can get
    as deep as you want with nested CSS targeting.


    As long as the element you are targeting is wrapped in the elements you specified
    your styles will effect the element in question.


    ### Advanced CSS Targeting


    With the advent of CSS3 there has become a few more ways to target HTML elements
    in order to style them.


    For example, in HTML there are a few different elements that all use the same.


    If you''re reading this book than chances are you''ve been around the block a
    few times and seen various things on the internet. One of the most common elements
    in websites is the web form.


    You''ve most likely seen a few web forms in your day because there is always some
    advertiser or business that wants you to fill out and submit a form.


    The “input” element is an extremely versatile element. This one element can be
    used as a text field in a form, as well as a date field, a phone number field
    AND a submit button!


    This brings us to our next question, but how do you style a certain type of “input”
    element whithout disrupting other elements which you don''t want to tamper with?


    ![](images/00013.jpeg)


    What you see above is a little bit of an advanced CSS declaration.


    As you can see I''m targeting multiple HTML elements with the same CSS declaration
    by separating each individual HTML element with a comma.


    I''m also targeting two different types of inputs (type=”text” as well as type=”date”)
    using brackets.


    And you may not fully grasp this yet. However, I''m targeting EVERY input with
    the type equal to “text” EXCEPT ones where the class is “s”. And I''m doing this
    using `:not(element in question)`.


    There are a few other advanced techniques to target HTML elements however, I don''t
    want to overload you. We''ll just cover some of the basic building blocks to get
    you going.


    ### CSS Hierarchy


    CSS is called Cascading Style Sheets because the rules set for CSS “cascade” down
    the document into other elements. For example, CSS styles that are lower in the
    document will over power styles that are higher in the document. A style on line
    1 will be overpowered by a style on line 365 that targets the same element for
    instance. That means if you were to declare the default font-family for the document
    to be be Arial, then later on in the document you specify Tacoma, than the latter
    style would take effect.


    CSS styles that are more specific in their CSS targeting will over power styles
    that are more vague in their targeting. For example a CSS style directed at all
    paragraph tags will be overpowered by a CSS style directed at all paragraph tags
    with a class or id of your choice.


    If you are targeting one HTML object and you give the object two conflicting styles
    the browser will render the style that is lower in the document. For example if
    you give all headings a margin of 10 pixels and then later say that all headings
    should have a margin of 15 pixels, the browser will render the latter style.


    If the HTML object itself has an inline style than in most cases the inline-style
    will be rendered. An example of an inline style would be as follows:


    ```html

    <img src="/images/example.jpg" alt="This is alternative text" style="float:left;"
    />

    ```


    In most cases all of these conflicting styles can be bypassed with a declaration
    of `!important` before the closing semi-colon of the CSS declaration.


    # Chapter 8: Common HTML Elements & Their Rules


    ## Divs


    A div is essentially an HTML element which is used to hold other objects. I believe
    that div is short for division. Divs are important for laying out websites. Since
    the word div is not very descriptive, HTML5 has spawned new kinds of divs with
    different names. These new “div-like” elements are called: header, nav, section,
    aside, article, details, footer, and summary.


    To use a div simply use this beginning and ending tag to wrap around the elements
    you wish to organize. Div''s are block level elements, which you will learn about
    later on in the book.


    ```html

    <div>Div content goes in here.</div>

    ```


    The format is the same with the new HTML5 elements.


    ```html

    <header>Header content goes in here.</header>

    ```


    ## Heading


    Headings are just as they sound. They are text headings which range in size from
    H1-H6. H1 being the largest and most important in the eyes of search engines to
    H6 being the smallest and least important.


    To use a heading simply wrap the heading text with beginning and ending header
    tags. Headings are block level elements. This may be obvious but don''t mismatch
    the tags for the heading.


    ```html

    <h1>This is an H1 heading.</h1>

    ```


    ```html

    <h2>This is an H2 heading.</h2>

    ```


    ...


    ```html

    <h6>This is an H6 heading.</h6>

    ```


    ## Images


    Images are also pretty self explanatory. Images are “inline block” level elements.
    To keep your code valid, make sure every image you use in your document has an
    “alt” specified. The “alt” attribute is important for when your image fails to
    load for any number of reasons. The alt attribute is also useful for visually
    impaired website visitors. In both cases the images would show the alternative
    text which describes the image so they can get a better feel for what the website
    is about.


    To use an image simply use the following format.


    ```html

    <img src="path" alt="Alternative text" />

    ```


    Obviously the path should point to the place where the image is located and the
    alternative text should be replaced with actual alternative text. Since images
    can''t wrap around other elements the image tag ends itself, as you can see with
    the forward slash before the ending “greater than” symbol (>).


    Quick note: your code will still be valid if you leave the alt attribute blank.
    However, this isn''t the best practice. Essentially it is the alt attribute itself
    that makes the image valid and not the text inside.


    ## Paragraphs, Spans & Blockquotes


    A paragraph is exactly that...a paragraph. I will note that some people use unorthodox
    practices such as using a paragraph tag as a div. A paragraph is a block level
    element. To use a paragraph simply wrap the text in the following HTML tags.


    ```html

    <p>Your paragraph text goes here.</p>

    ```


    A span is what you use when you have a piece of text which you wish to make special
    in some way. Spans are inline elements and are normally wrapped in block level
    elements, such as paragraphs for example.


    To use a span, wrap your span text in the following HTML tags.


    ```html

    <span>Span text goes here.</span>

    ```


    A blockquote is normally used when quoting something from another source or a
    person. A blockquote is a block level element and can be wrapped around other
    block level elements.


    To use a blockquote simply wrap your blockquote in the following HTML tags.


    ```html

    <blockquote>Blockquote text goes here.</blockquote>

    ```


    ## Unordered and Ordered Lists


    If you''ve used Microsoft Word than surely you''ve encountered unordered and ordered
    lists. Unordered lists are bulleted lists and ordered lists are numbered. Both
    of which are block level elements.


    This may seem weird to you, however most people use an extremely styled unordered
    list for their navigation bars. This is because an unordered list is specified
    for use with a list and a navigation bar is essentially a list of links.


    To use an unordered list use the following format.


    ```html

    <ul>

    <li>List Item Goes Here</li>

    <li>List Item Goes Here</li>

    <li>List Item Goes Here</li>

    <li>List Item Goes Here</li>

    </ul>

    ```


    UL means unordered list while LI means list item.


    To use an ordered list use the following format.


    ```html

    <ol>

    <li>List Item 1 Goes Here</li>

    <li>List Item 2 Goes Here</li>

    <li>List Item 3 Goes Here</li>

    <li>List Item 4 Goes Here</li>

    </ol>

    ```

