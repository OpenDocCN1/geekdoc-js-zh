  raw: 'What I''ve found is that this effect is caused because of what is known as
    “anti-aliased” pixels.  When it comes to transparent pixel based pictures.  The
    pixels around the outside of the image can''t be a solid color.  If that were
    the case then the outer edge of the image would look “blocky”.


    ![](images/00034.jpeg)The image to the right illustrates this fact.  It''s a little
    hard to create rounded edges and beautiful, picturesque photographs using only
    tiny squares of color.  So in order to alleviate this problem, anti-aliasing is
    done and it essentially creates half filled in pixels around the edge of the image
    to create the illusion of a smooth edge.


    This causes problems when it comes to saving transparent images because if you
    try to save this image as a .gif these anti-aliased pixels will have a white background
    by default. 


    This causes the effect that you saw above with the white pixels around our cat
    image.  However, when saving your transparent images in .gif as well as .png format
    you have the option to choose a “matte” that is a background color for those anti-aliased
    pixels.


    That way, if you want to use a transparent image on a red background you can specify
    red as the matte color so the anti-aliased pixels will be less noticeable.


    Of course you can skip all this by saving the image as a .png-24 which has superior
    transparency abilities.  However, high quality, transparent .png''s can sometimes
    take a long time to load.


    For this reason, I use a website called [www.tinypng.com](http://www.tinypng.com/)
    to lower the file size on my transparent .png''s as well as all my .png''s in
    general.


    Figure 11.7 – The car image below had an extremely large file size before I used
    tinypng.com to compress it.


    ![](images/00035.jpeg)Tiny PNG is great for when you have a .jpg quality image
    that you still want to have superior transparency.  The car in the above website
    is fully transparent, including the shadow the car is casting as well as the light
    rays coming from behind the car.  Saving a transparent image like this will cause
    the image to take a long time to load.  However, with image compression software
    it''s a piece of cake!


    # Chapter 12: Manipulating Placement Of HTML Objects


    Knowing how to place objects where you want them is extremely important when it
    comes to designing a website the way you want it to look.


    In order to do this however, you must first know a little bit about how HTML objects
    behave.


    HTML objects are either considered to be “inline” or “block” level elements.


    ## Inline vs. Block Level Elements


    In order to  illustrate the difference between an inline element and a block level
    element I''ll be creating different HTML elements on a blank page and then inspecting
    them using Google Chrome''s element inspect option.


    Figure 12.1 – I clicked “inspect element” on the Heading 1 tag at the top of the
    page to show you that block level elements take up as much horizontal space as
    possible. Even though the text itself only utilizes about 1/16th of the page it
    is still causing elements below it to be placed on the next line.


    ![](images/00036.jpeg)It is a little hard to tell, but I filled the page with
    a bunch of block level elements and a few inline elements.


    The difference between a block level element and an inline element is that a block
    level element will take up as much space as it needs vertically and as much space
    as it can horizontally.


    As you can see I have inspected the H1 tag (that''s whats known as a heading 1)
    and the blue and pink region illustrate the amount of space that the object takes
    up.  Clearly, the “Heading 1” element is taking up the entire width of the page.


    If I were to put the same H1 tag in a container which spanned only half the width
    of the browser window the H1 tag would still take up as much room as it could
    horizontally.  Except in that case it would be limited by it''s container which
    only allows it to take up half the width of the browser window.


    The page above has mostly block level elements and as you can see they stack on
    top of each other. 


    The very last line however, has 3 different inline elements.  Let''s choose the
    “inspect element” option to learn more about the nature of those inline elements.


    Figure 12.2 – I clicked “inspect element” on a span element. The line with the
    span element contains 3 different span elements.  Notice that they are all on
    the same line.  This is because they are inline elements.


    ![](images/00037.jpeg)The very last line of the document includes 3 “span” tags. 
    A span is a type based element which holds less significance/ importance than
    a paragraph which could be considered the span''s older brother.


    As you can see as I inspected the span element, the element itself takes up only
    as much space as it needs to.  This is the same with all inline elements.


    The relationship between block level and inline level elements is important to
    know because there may come a time where you want to have two block level elements
    directly next to each other.


    Or there may come a time where you want to display an inline element as though
    it were a block level element.


    ## Inline-block Elements


    Inline-block elements are inline elements that have a width and a height, rather
    than only taking up as much space as necessary.  This is something that is encountered
    rarely but is still great to know and another tool in your arsenal.


    ## “Floating” Elements


    Before we get too deep into this I''ll show you basically how people normally
    set up websites.


    I will do so by taking a mockup which I''ve already done and using a yellow outlins
    to show the different dividing boxes which I used to create the layout.


    In modern website development people use what is known as a “div” to separate
    and layout their content.


    A div is a block level HTML element and is very handy for laying out websites
    if you know how to manipulate them.


    Figure 12.3 – I wrapped every div this page contains in a yellow box to illustrate
    laying out a website.


    ![](images/00038.jpeg)If you''re a little confused than that''s great!  It means
    you understand how a block level element works.


    If you''re not confused than basically each of these boxes, based on the way they''re
    supposed to behave should be stacked on top of each other.  In fact they would
    be, if it weren''t for CSS.


    Let''s revisit the picture we saw earlier in the book.


    ![](images/00039.jpeg)As you can see the image on the right is the exact same
    code with the CSS removed. 


    So this tells us is that with CSS we are able to lay out objects the way we want
    them.


    If you want two block level elements to sit side by side then they need to:


    1.  Each element needs to have a specified width. Block level elements usually
    take up as much room as they can horizontally so without a specified width they
    will just stack on top of each other.


    2.  The combined width of all the elements to be placed side by side can not be
    greater than the width of the containing element. Let''s say you''re making a
    website that is 1,000 pixels wide. You can''t create two 600 pixel wide div''s
    and expect them to stack side by side.  Also, you can''t have two 500 pixel wide
    divs with 10 pixel margins and expect them to stack side by side because the combined
    width plus the 10 pixel margins will make the total width of the objects 520 pixels.


    3.  The objects need to be “floated”.  A float, is a CSS style declaration which
    tells the object to basically stack horizontally to either the right or left.
    This is based on whether you specify the object float either right or left.  The
    CSS declaration looks like this.


    Div


    {


                  float:left;


    }


    You can also specify that there be no float by typing (float:none;). This practice
    of floating objects is extremely important for modern website design.  In the
    past people would have to use tables to get the same type of effect.


