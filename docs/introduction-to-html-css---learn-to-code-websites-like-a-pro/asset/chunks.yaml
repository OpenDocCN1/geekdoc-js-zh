    For example if you were to take a word and link it to a website, it becomes blue
    and underlined. If you were to begin typing, the words would begin in the upper
    left portion of the document using a Times New Roman font and utilizing a 12 point
    font.


    The reason why I mention the link and paragraph style attributes in Microsoft
    Word is because they are almost identical to the default appearances of “unstyled”
    HTML elements.


    # Chapter 3: Understanding CSS


    So as I mentioned above CSS stands for Cascading Style Sheets. It''s what you
    will be using as a beginning website designer/ developer to give your websites
    some flavor.


    It''s the tool that you will use to transform a page which resembles the ugliest
    of Word documents into a beautiful and interactive work of art!


    As I mentioned before, HTML elements all have their default styles.


    Links look like this.


    Paragraphs and other unstyled text default to Times New Roman (or Macintosh equivalent)
    16 point font.


    *   Unordered lists

    *   end up looking

    *   like this.


    It will be your responsibility to take these elements and style them to your desire
    utilizing CSS.


    ## Things You Can Do With CSS


    *   Change the background of the page (Many options including tiled image, gradient,
    image/ background color combo, solid color, etc)

    *   Change the orientation/ position of an element

    *   Change fonts, font size, font color

    *   Give elements background images


    In all honesty, there is almost no limit to what you can do visually to a website
    using CSS. And with the advent of CSS3 there is all types of cool things that
    you can do such as creating animations to happen when the user hovers over an
    element, rounded corners on elements, text shadows, etc!


    # Chapter 4: Where to Write Your Code


    Before we go any further on our journey we have to discuss what you will be using
    to code the websites that you design.


    I personally use Dreamweaver to do all of my coding. It''s not what I personally
    recommend. I mostly use it because it came with Adobe Creative Suite, something
    that I personally use because it''s required for my profession.


    However, you can edit almost any type of code using the standard text editor that
    comes with your computer.


    With a Windows based computer you can use `Notepad` to write, view or edit almost
    any type of computer code you could ever wish to manipulate. On a Mac the equivalent
    is `TextEdit`.


    It''s crazy that the simplest program on your computer gives you the ability to
    code the most beautiful websites.


    Essentially, the code editor that you use is irrelevant. If you use a simple code
    editor then you have the potential to become much more proficient in writing code
    because you won''t have any crutches to rely on.


    If you spend your time writing code with a simple text editor, you will most likely
    end up having to reference almost every bit of code that you write or commit the
    code to memory.


    ## Free Code Editors


    Although memorizing code will make you an exceptional website developer the purpose
    of this book isn''t to deter you from getting your feet wet with HTML/CSS.


    Therefore I''ll give you a few options that you can use if you don''t have the
    option to use a paid program.


