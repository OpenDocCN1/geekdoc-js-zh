    Firefox 3D 视图的图片。


    图 5.3 – Firefox 中的 3D 视图选项非常酷！


    ![](img/00006.jpeg)


    # 第 6 章：HTML 结构


    在开始熟悉 HTML 之前，你需要了解一些 HTML 元素的结构。


    ## 开始和结束 HTML 标签


    任何可以包裹内容的元素都有一个开始标签和一个结束标签。开始标签用“小于号”和“大于号”符号（`< >`）包裹，结束标签则用相同的符号加上一个正斜杠（`</
    >`）包裹。


    示例：


    ```

    <body>这是 body 标签，它是 HTML 文档的主体，所有要在页面上显示的 HTML 元素都位于此元素的开始和结束标签之间。</body>

    ```


    ```

    <p>这是一个段落标签。你希望包含在此段落中的所有文本都放在这里。</p>

    ```


    ## 自闭合 HTML 标签


    自闭合元素通过在结束的“>”符号前放置一个正斜杠来结束自身。


    下面是一个“换行”标签。换行标签用于使句子换行，或在文档中腾出一些空间。换行标签的使用方式类似于在 Microsoft Word 文档中按回车键。


    过去使用 `<br>` 曾是有效的 HTML，但近年来，你需要在标签内部自行结束它（如下所示，带有一个空格和一个正斜杠）。


    示例：


    ```

    <br />

    ```


    下面是一个“水平线”标签。这个 HTML 元素在页面上创建一条水平线。由于这条线不能包裹任何其他 HTML 元素，因此它是自闭合的。下面是一个水平线的示例。


    示例：


    ```

    <hr />

    ```


    # 第 7 章：CSS 结构


    CSS 可能会稍微复杂一些，因为你可以进行许多 CSS 声明，每个声明都有自己的一套规则。


    然而，CSS 中有一些东西是永远不会改变的，所以我现在就与你分享，这样在我们开始深入探讨这个主题之前，你就能有一个更好的理解。


    CSS 遵循你下面看到的结构。当你在文档的头部或单独的文档中声明 CSS 时，CSS 就是这样编写的。


    图 7.1 – 下面你可以看到 CSS 样式的结构。


    ![](img/00007.jpeg)有些人喜欢将 CSS 直接写在 HTML 元素中，这被称为“内联 CSS”。下面是一个示例。


    ![](img/00008.jpeg)


    使用内联 CSS 样式时，目标元素是明确的，因此目标选择以及大括号都被省略了。但 CSS 属性、冒号、CSS 属性声明以及结尾的分号都保留着。


    CSS 的最佳实践是将所有 CSS 保存在一个单独的文档中，并将该文档链接到你的 HTML。然而，如你所见，有几种不同的方式可以编写 CSS。为了节省时间并避免混淆，我们将只介绍如何在单独的文档中编写
    CSS。


    内联样式通常不被看好，因为它们可能会增加网站的加载时间，并且被视为业余做法。


    ## 定位 HTML 元素


    要开始编写关于任何元素的 CSS 声明，你必须首先告诉 CSS 文档要定位哪个元素。


    ### 宽泛示例


    如果你想定位某个特定 HTML 元素的每一个实例，你可以以该元素的名称开始你的 CSS 声明。


    示例：


    * `body`（定位 HTML 文档的 body 元素及其包含的所有元素）

    * `h1`（定位文档中的所有 h1 标题元素）

    * `a`（定位所有链接）


    ### 通过“类”定位元素


    另一种定位元素的方法是给它们添加类。类允许你根据你希望赋予这些元素的类来定位元素，而不是根据 HTML 元素的类型。


    类非常棒，因为它们允许你更精确地设置对象的样式。


    下面是一个给 HTML 元素添加类的示例。


    ![](img/00009.jpeg)如你所见，要给一个元素添加类，你必须添加 `class=`，后面跟上引号中的类名。


    要定位一个类，方法与定位 HTML 元素非常相似。只不过你需要在类名前面加上一个点号。


    下面是一个通过类定位 HTML 元素的示例。


    ![](img/00010.jpeg)


    ### 通过 ID 定位元素


    类很酷，因为你可以让一个页面上有任意多个具有相同类的元素。


    然而，有时页面上可能只有一个元素，你想赋予它一些特殊意义。


    ID 是一种定位 HTML 元素的方式。但是，每个页面中只能有一个元素具有相同的 ID。


    当然，你可以在同一个 HTML 页面上有多个具有相同 ID 的元素。但是，当你去验证文档时，它会在 HTML 验证程序中显示为无效，因为这不是一种有效的 HTML
    技术。


    给 HTML 元素添加 ID 与类声明非常相似。


    ![](img/00011.jpeg)给 HTML 元素添加 ID 几乎与给 HTML 元素添加类完全相同。只不过，你不需要输入 `class =''类名''`，而是直接输入
    `id=''ID 名''`。


