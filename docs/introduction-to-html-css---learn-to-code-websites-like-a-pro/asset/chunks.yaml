  trans: "\n\n`OL` 表示有序列表，而 `LI` 表示列表项。\n\n## 链接\n\n链接让互联网运转起来。链接是内联元素。若要使用链接，请使用以下格式。\n\
    \n```html\n<a href=”path”>这里可以放置文本、图像或你想要链接的任何内容。</a>\n```\n\n显而易见，请记住将 `path`\
    \ 单词替换为你想要链接的 URL。\n\n## 表格\n\n在过去，人们会使用表格来布局整个网站。然而在今天，这种技术已不再被青睐。表格对于保持信息整洁有序非常有用。表格是块级元素。\n\
    \n若要使用表格，请使用以下格式。\n\n```html\n<table>\n<th>\n   <td>Jill</td>\n   <td>Smith</td>\n\
    \   <td>50</td>\n</th>\n<tr>\n   <td>Eve</td>\n   <td>Jackson</td>\n   <td>94</td>\n\
    </tr>\n</</table>\n```\n\n`TH` 代表表头，`TR` 代表表格行，`TD` 代表表格数据。本质上，将第一行列为表头并不是必要的，因为所有行都可以直接标记为表格行。然而，如果你想使用\
    \ CSS 为第一行设置样式，你可能想要利用 `TH` 标签，因为它会更容易定位第一行。\n\n## 表单\n\n表单稍微超出了本书的范围。并不是因为表单很难使用，而是因为它们通常需要一些\
    \ JavaScript 或类型的代码才能工作。我不会在此多说这一点。不过，我会给你一个小提示：为了让文本区域（text area）成为有效代码，你必须指定\
    \ `cols` 和 `rows` 属性。这本质上为文本区域提供了宽度和高度，但如果你愿意，可以使用 CSS 操作这些维度。\n\n# 第 9 章：常用 CSS\
    \ 样式及其规则\n\n我将在书的后部分更详细地介绍几种不同的 CSS 技术，所以现在我只列出几个重要的 CSS 声明及其规则。\n\n## 颜色\n\n\
    `color` 属性始终表示文本的颜色。要使用 `color` 属性，只需使用以下格式。颜色的默认值是黑色，除非你在讨论链接。\n\n`color: #000000;`\n\
    \n在书的后面，我将解释 HTML 颜色的工作原理，以及如何使用十六进制系统来指定颜色。你可以使用十六进制系统、`rgb` 甚至通过名称列出颜色。\n\n\
    ## 字体\n\n有大量的处理字体的 CSS 声明。我们将简要介绍其中几个。\n\n`font-family: 1st choice, 2nd choice,\
    \ last resort;`\n\n字体通过族来指定。更多内容将在稍后介绍。\n\n`font-size: 12px;`\n\n字体大小可以通过像素大小、`em`\
    \ 来指定，你甚至可以使用形容词（大、小等）来指定。\n\n`font-weight: bold;`\n\n字体粗细可以通过百位（`100`、`200`、`300`\
    \ 直到 `900`）来指定。`100` 最细，`900` 最粗。你也可以通过 `bold`、`bolder`、`lighter` 和 `normal` 来指定字体权重。\n\
    \n`text-transform: uppercase;`\n\n使用 `text-transform`，你可以指定某个特定的文本块为大写或小写。无论在实际\
    \ HTML 文档中是如何书写的，文本将以那种特定的形式渲染。\n\n`line-height: 14px;`\n\n使用 `line-height`，你可以指定文本行之间的高度。你可以使用像素、`ems`\
    \ 等来指定数值。\n\n## 高与宽\n\n你可以为各种对象指定高度和宽度。你可以使用像素、`em`、百分比等作为测量单位。要使用高度和宽度，请使用这些格式：\n\
    \n`height: 100px;`\n`width: 50%;`\n\n## 边框\n\n可能会有某个时刻你想给某个东西添加边框。你可以一次指定所有 4\
    \ 个边框，也可以一次指定一个。（可能有指定边框的其他方法，但我们现在只使用基础知识。）\n\n`border: 1px solid #ffffff;`\n\
    \n要指定边框，以像素边框宽度开始，然后是样式（选项包括：`solid`、`dotted`、`dashed`、`thin`、`inset` 等），最后是颜色。要指定特定边的边框，使用：\n\
    \n`border-right: 1px solid #ffffff;`\n`border-left: 1px solid #ffffff;`\n`border-top:\
    \ 1px solid #ffffff;`\n`border-bottom: 1px solid #ffffff;`\n\n## 外边距与内边距\n\n我将在书的后部分详细介绍。然而，外边距（margins）在对象之间形成了不可见的屏障。\n\
    \n内边距（padding）本质上像外边距，但它是 HTML 元素内部对象的内部屏障。例如，如果你有一个四周边框为 10 像素的 `div`。`div` 内部的任何对象都无法距离边缘\
    \ 10 像素。\n\n我将在书的后面详细列出如何使用这些。\n\n## 浮动\n\n某些 HTML 元素自然地堆叠在一起，因为它们占据了分配给它们的所有宽度，而有些则没有。为了缓解当你有两个堆叠对象并希望它们并排显示时的情况，可以使用浮动。\n\
    \n要使用浮动，使用以下格式：\n\n`float: left;`\n\n在使用浮动时，你可以指定 `uppercase`。\n\n使用 `text-transform`，你可以指定某个特定的文本块为大写或小写。无论在实际\
    \ HTML 文档中是如何书写的，文本将以那种特定的形式渲染。\n\n`line-height: 14px;`\n\n使用 `line-height`，你可以指定文本行之间的高度。你可以使用像素、`ems`\
    \ 等来指定数值。\n\n## 高与宽\n\n你可以为各种对象指定高度和宽度。你可以使用像素、`em`、百分比等作为测量单位。要使用高度和宽度，请使用这些格式：\n\
    \n`height: 100px;`\n`width: 50%;`\n\n## 边框\n\n可能会有某个时刻你想给某个东西添加边框。你可以一次指定所有 4\
    \ 个边框，也可以一次指定其中一个。（可能有指定边框的其他方法，但我们现在只使用基础知识。）\n\n`border: 1px solid #ffffff;`\n\
    \n要指定边框，以像素边框宽度开始，然后是样式（选项包括：`solid`、`dotted`、`dashed`、`thin`、`inset` 等），最后是颜色。要指定特定边的边框，使用：\n\
    \n`border-right: 1px solid #ffffff;`\n`border-left: 1px solid #ffffff;`\n`border-top:\
    \ 1px solid #ffffff;`\n`border-bottom: 1px solid #ffffff;`\n\n## 外边距与内边距\n\n我将在书的后部分详细介绍。然而，外边距（margins）在对象之间形成了不可见的屏障。\n\
    \n内边距（padding）本质上像外边距，但它是 HTML 元素内部对象的内部屏障。例如，如果你有一个四周边框为 10 像素的 `div`。`div` 内部的任何对象都无法距离边缘\
    \ 10 像素。\n\n我将在书的后面详细列出如何使用这些。\n\n## 浮动\n\n某些 HTML 元素自然地堆叠在一起，因为它们占据了分配给它们的所有宽度，而有些则没有。为了缓解当你有两个堆叠对象并希望它们并排显示时的情况，可以使用浮动。\n\
    \n要使用浮动，使用以下格式：\n\n`float: left;`\n\n"
- fmt: "\n# Building a Website\n\nI begin each website that I build with a mockup.\
    \ A mockup is essentially a Photoshop document of what the home page of your website\
    \ is going to look like.\n\nFigure 10.1 – Below is a mockup I created for a friend's\
    \ website.\n\n![](images/00014.jpeg)As you can see in Figure 10.1 this is an example\
    \ of a mockup. It's a website design that I was messing around with for a friend\
    \ who happens to loves a good bargain.\n\nIt's the website that I will be using\
    \ as an example throughout this e-book because it's just a simple 2 column website.\n\
    \nThe mockup is extremely important because it serves as the blue print to your\
    \ website.\n\nOnce you have a mockup, you are ready to begin coding!\n\n## Setting\
    \ Up Your Website Folder\n\nI'm going to be honest here. When it comes to building\
    \ a website, the sky is the limit.\n\nYou don't have to format the folder that\
    \ holds your website EXACTLY as I say.\n\nYou don't have to format your code the\
    \ way that you see in my examples.\n\nHowever, if you keep your HTML documents\
    \ clean and easy to understand. If you keep your folders clean and organized.\
    \ If you keep all your images in one folder. These are all practices which will\
    \ help you to code in a professional manner.\n\nThat being said, we're going to\
    \ set up a folder for your first HTML/CSS experiments.\n\n1. Create a folder name\
    \ it `website`\n2. In that folder create 2 folders\n   * 1 called `css`\n   *\
    \ 1 called `images`\n\nThe CSS folder will store your CSS files and your Images\
    \ folder will store your image files.\n\n## Setting Up Your HTML & CSS Documents\n\
    \nOnce you're ready to begin, open up your code editor of your choice and create\
    \ two documents.\n\nThe first one will be named `index.html` and the second one\
    \ will be named `style.css`. When it comes to HTML, the “index” usually denotes\
    \ the “home page” and when you upload HTML to a server the server will serve the\
    \ index as the home page.\n\nSave this index file in the root folder that you\
    \ just created, called `website`. The CSS stylesheet will be saved in the CSS\
    \ folder.\n\n### Setting up your HTML Document\n\nSince the advent of HTML5, HTML\
    \ documents have become much more streamlined. Below you'll see the bare minimum\
    \ that you need to have on your page to have a valid HTML document.\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n  \
    \  <title>Here Is Where You Put The Title Of Your Website</title>\n    <!--[if\
    \ lt IE 9]>\n              <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>\n    <![endif]-->\n</head>\n<body>\n</body>\n</html>\n```\n\nOpen up\
    \ your `index.html` and type the above code into your document. This is a barebones\
    \ HTML document and pretty much everything that you see above is required to have\
    \ a valid HTML document. (In the past a valid HTML document would have included\
    \ a lot more declarations.)\n\n* `DOCTYPE` = The document type\n* `HTML LANG`\
    \ = “en” (English) Note that the HTML tag begins at the top of the document and\
    \ ends at the bottom to wrap up the document.\n* `Head` = The place where your\
    \ page title, links to CSS style sheets, Javascript code, and other miscellaneous\
    \ code that is important for your website but isn't necessary for the aesthetics\
    \ of your website.\n* `<!--[if lt IE 9]>` = The code that follows this is to allow\
    \ for HTML5 elements to work in older Internet Explorer browsers. I'm not sure\
    \ that this line of code is necessary to have a valid document, however it doesn't\
    \ hurt to add it. “if lt IE 9” means if later than Internet Explorer 9. The entire\
    \ block of code basically means, if the browser viewing this document is Internet\
    \ Explorer and if it is, if it's older than Internet Explorer than use this document\
    \ linked here.\n* `Body` = In between the opening and closing body tag is where\
    \ your HTML goes.\n\n### Linking Your CSS Stylesheet\n\nUnlike the HTML document\
    \ the CSS document doesn't need as many declarations or requirements. The style\
    \ sheet is basically up to you to style your HTML however you wish. (That's not\
    \ to say that you don't have to use valid CSS.)\n\nIn order for your CSS styles\
    \ to have any effect on your HTML document you need to link the stylesheet to\
    \ it.\n\nGo to your `index.html` and add the line of code which is featured below\
    \ in bold.\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta\
    \ charset=\"utf-8\">\n    <title>Here Is Where You Put The Title Of Your Website</title>\n\
    \    <link href=\"css/style.css\" rel=\"stylesheet\" type=\"text/css\" />\n  \
    \  <!--[if lt IE 9]>\n              <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>\n    <![endif]-->\n</head>\n<body>\n</body>\n</html>\n```\n\nThis line\
    \ of code links the stylesheet to your HTML document. The `href` is the path to\
    \ get to the document you are trying to link.\n\n### Tying It All Together\n\n\
    Now that you have a blank HTML document and a stylesheet linked to it, you're\
    \ ready to rock!\n\nThe best practice when coding a website is to have the HTML\
    \ & CSS documents open in your text editor while you have the website opened in\
    \ a browser.\n\nHaving the website open in a browser is essential because you\
    \ want to be able to refresh the document to see the changes you make take effect.\
    \ You can open the HTML document in a browser by right-clicking the file and going\
    \ to “Open With” and choose the browser of your choice.\n\nOne thing that I like\
    \ to do to make sure the CSS document really is linked to my HTML document is\
    \ to denote a color for the background to see if it takes effect.\n\nGo to your\
    \ stylesheet and type the following.\n\n```css\nbody\n{\n              background-color:#000000;\n\
    }\n```\n\nThen once you've saved the stylesheet document you can refresh your\
    \ browser and check to see that the background of the document has indeed changed.\n\
    \nThe color code #000000 should denote black. Essentially you can put any 6 digit\
    \ combination of letters and numbers there. However, if you make it #ffffff then\
    \ the background will be white and you won't know if your changed actually took\
    \ effect because that is already the default background color.\n\n## Backgrounds\n\
    \nI wasn't sure initially how to structure this e-book. However, I've realized\
    \ that the best way to go about teaching my knowledge of HTML/CSS was to go through\
    \ some of the most useful properties and drop tiny morsels of wisdom along the\
    \ way.\n\nI know I mentioned that you should start each website off with a mockup.\
    \ However, in this case since you're just learning it's not necessary.\n\nIf you've\
    \ been following so far you should have a blank HTML document with a black (or\
    \ possibly other color) background.\n\nGo to your CSS document and make it blank\
    \ again.\n\nWhen it comes to doing anything HTML/CSS related, there are many ways\
    \ to do every task.\n\nThat being said, we're going to cover a few different ways\
    \ to accomplish the same goal, giving our blank website a super cool background!\n\
    \n### Tiled Backgrounds\n\nOne of the most popular background options is your\
    \ standard tiled background.\n\n![](images/00015.jpeg)One of my favorite websites\
    \ for getting cool backgrounds for my projects is [www.subtletepatterns.com](http://www.subtletextures.com/),\
    \ go there and download a background of your choice and save it in your `images`\
    \ folder.\n\nI choose the very first pattern that I saw, called “paisley” and\
    \ you can see the pattern over to your right.\n\nThis pattern is seamless, meaning\
    \ when you tile this pattern it will create a seamless background which is perfect\
    \ for website backgrounds.\n\nIn order to tile this background we will have to\
    \ edit our CSS stylesheet to reflect the changes that we wish to make.\n\nOpen\
    \ up your stylesheet and then add the following code to add your tiled background.\n\
    \n```css\nbody\n{\n              background-image:url(../images/paisley.png);\n\
    }\n```\n\nFigure 10.2 – Below is an HTML document with a tiled background.\n\n\
    ![](images/00016.jpeg)Of course you should change `images` to the title of your\
    \ images folder if you chose to name your folder differently, as well as change\
    \ the name of your actual image file to match the file you have chosen.\n\nAbove\
    \ is the result of my tiled background.\n"
