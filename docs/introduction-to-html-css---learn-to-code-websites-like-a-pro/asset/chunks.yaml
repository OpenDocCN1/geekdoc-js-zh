    up to help me choose a color.


    This is just one example of how the text editor that you choose can help you get
    the job done.


    Essentially, the best text editors can help you to remember tidbits of code, help
    you to keep your code organized and assist you when you forget essential pieces
    of code.


    # Chapter 5: Browsers


    I know you''re eager to start learning about website building however, the topic
    of browsers is one of the most important pieces to the puzzle.


    An internet browser is simply the portal that you choose to help you view the
    abomination which has come to be known as the internet.


    ![](images/00003.jpeg)


    And just as the program you choose to write your code can help you get an edge,
    so can your browser.


    As of today, the most popular internet browsers are Internet Explorer, Firefox,
    Opera, Chrome & Safari.


    ## Why Do Browsers Matter?


    If you are going to be coding websites it''s important to have multiple browsers
    to test your websites in.


    Not every browser displays the same font in the same way and some browsers have
    slightly different protocols for displaying certain objects.


    Just as I mentioned before about how Microsoft Word has certain styles that they
    apply to different objects. Each browser also abides by certain styles for different
    HTML elements.


    And while each browser has almost the same relative styles for each element, there
    are some subtle differences between browsers which can throw off your layout.


    Often times the problem browser will be Internet Explorer. This is because Microsoft
    abides by a different set of rules pertaining to the way it''s browser renders
    certain HTML elements.


    You may think that this isn''t an issue because you personally use Chrome, Firefox
    or Safari.


    In reality, what you don''t know is that a majority of people NEVER upgrade their
    browser from the default one their computer comes with. And since the majority
    of people use Windows, this means that a majority of people not only use Internet
    Explorer but a good chunk of those people have an OUTDATED version of Internet
    Explorer.


    Only in recent years has Internet Explorer caught up with the modern browser world
    and begun to acknowledge modern website design techniques and render the new website
    design features in their own browsers.


    What this means is that a good chunk of internet users world wide are viewing
    websites on a completely outdated and (for lack of a better word) non-compliant
    browser.


    This makes coding HTML/CSS super fun!!! (sarcasm)


    ## What Browsers To Download


    The browsers that I personally recommend to download are:


    *   Internet Explorer

    *   Firefox

    *   Chrome


    If you are a Windows user and are concerned about not having Safari, don''t be.
    Google Chrome is using an open source web browsing system called `WebKit` which
    is what Safari uses. Keep that word WebKit in the back of your head because it
    will come up later when we start coding with CSS.


    If you are a Mac user you should definitely download Internet Explorer so that
    you can make sure your websites perform as intended on Windows.


    Between all of the browsers mentioned above you will have a pretty good idea of
    how your websites will perform for the myriad of internet users out there.

