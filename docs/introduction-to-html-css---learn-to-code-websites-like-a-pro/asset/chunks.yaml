    \ Up Your Website Folder\n\nI'm going to be honest here.  When it comes to building\
    \ a website, the sky is the limit. \n\nYou don't have to format the folder that\
    \ holds your website EXACTLY as I say. \n\nYou don't have to format your code\
    \ the way that you see in my examples. \n\nHowever, if you keep your HTML documents\
    \ clean and easy to understand.  If you keep your folders clean and organized. \
    \ If you keep all your images in one folder.  These are all practices which will\
    \ help you to code in a professional manner. \n\nThat being said, we're going\
    \ to set up a folder for your first HTML/CSS experiments.\n\n1.  Create a folder\
    \ name it “website”\n\n2.  In that folder create 2 folders\n\n*   1 called “css”\n\
    \n*   1 called “images”\n\nThe CSS folder will store your CSS files and your Images\
    \ folder will store your image files.\n\n## Setting Up Your HTML & CSS Documents\n\
    \nOnce you're ready to begin, open up your code editor of your choice and create\
    \ two documents.\n\nThe first one will be named index.html and the second one\
    \ will be named style.css.  When it comes to HTML, the “index” usually denotes\
    \ the “home page” and when you upload HTML to a server the server will serve the\
    \ index as the home page.\n\nSave this index file in the root folder that you\
    \ just created, called “website”. The CSS stylesheet will be saved in the CSS\
    \ folder.\n\n### Setting up your HTML Document\n\nSince the advent of HTML5, HTML\
    \ documents have become much more streamlined.  Below you'll see the bare minimum\
    \ that you need to have on your page to have a valid HTML document.\n\n<!DOCTYPE\
    \ html>\n\n<html lang=\"en\">\n\n<head>\n\n    <meta charset=\"utf-8\"> \n\n   \
    \ <title>Here Is Where You Put The Title Of Your Website</title>\n\n    <!--[if\
    \ lt IE 9]>\n\n              <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>\n\n    <![endif]-->\n\n</head>\n\n<body>\n\n</body>\n\n</html>\n\n\
    Open up your index.html and type the above code into your document.  This is a\
    \ barebones HTML document and pretty much everything that you see above is required\
    \ to have a valid HTML document.  (In the past a valid HTML document would have\
    \ included a lot more declarations.)\n\n*   DOCTYPE = The document type\n\n* \
    \  HTML LANG = “en” (English) Note that the HTML tag begins at the top of the\
    \ document and ends at the bottom to wrap up the document.\n\n*   Head = The place\
    \ where your page title, links to CSS style sheets, Javascript code, and other\
    \ miscellaneous code that is important for your website but isn't necessary for\
    \ the aesthetics of your website.\n\n*   <!--[if lt IE 9]> = The code that follows\
    \ this is to allow for HTML5 elements to work in older Internet Explorer browsers. \
    \ I'm not sure that this line of code is necessary to have a valid document, however\
    \ it doesn't hurt to add it.  “if lt IE 9” means if later than Internet Explorer\
    \ 9.  The entire block of code basically means, if the browser viewing this document\
    \ is Internet Explorer and if it is, if it's older than Internet Explorer than\
    \ use this document linked here.\n\n*   Body = In between the opening and closing\
    \ body tag is where your HTML goes.\n\n### Linking Your CSS Stylesheet\n\nUnlike\
    \ the HTML document the CSS document doesn't need as many declarations or requirements. \
    \ The style sheet is basically up to you to style your HTML however you wish. \
    \ (That's not to say that you don't have to use valid CSS.)\n\nIn order for your\
    \ CSS styles to have any effect on your HTML document you need to link the stylesheet\
    \ to it.\n\nGo to your “index.html” and add the line of code which is featured\
    \ below in bold.\n\n<!DOCTYPE html>\n\n<html lang=\"en\">\n\n<head>\n\n    <meta\
    \ charset=\"utf-8\"> \n\n    <title>Here Is Where You Put The Title Of Your Website</title>\n\
    \n <link href=\"css/style.css\" rel=\"stylesheet\" type=\"text/css\" />\n\n   \
    \ <!--[if lt IE 9]>\n\n              <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>\n\n    <![endif]-->\n\n</head>\n\n<body>\n\n</body>\n\n</html>\n\n\
    This line of code links the stylesheet to your HTML document.  The href is the\
    \ path to get to the document you are trying to link. \n\n### Tying It All Together\n\
    \nNow that you have a blank HTML document and a stylesheet linked to it, you're\
    \ ready to rock!\n\nThe best practice when coding a website is to have the HTML\
    \ & CSS documents open in your text editor while you have the website opened in\
    \ a browser.\n\nHaving the website open in a browser is essential because you\
    \ want to be able to refresh the document to see the changes you make take effect. \
    \ You can open the HTML document in a browser by right-clicking the file and going\
    \ to “Open With” and choose the browser of your choice.\n\nOne thing that I like\
    \ to do to make sure the CSS document really is linked to my HTML document is\
    \ to denote a color for the background to see if it takes effect.\n\nGo to your\
    \ stylesheet and type the following.\n\nbody\n\n{\n\n              background-color:#000000;\n\
    \n}\n\nThen once you've saved the stylesheet document you can refresh your browser\
    \ and check to see that the background of the document has indeed changed.\n\n\
    The color code #000000 should denote black.  Essentially you can put any 6 digit\
    \ combination of letters and numbers there.  However, if you make it #ffffff then\
    \ the background will be white and you won't know if your changed actually took\
    \ effect because that is already the default background color.\n\n# Backgrounds\n\
    \nI wasn't sure initially how to structure this e-book.  However, I've realized\
    \ that the best way to go about  teaching my knowledge of HTML/CSS was to go through\
    \ some of the most useful properties and drop tiny morsels of wisdom along the\
    \ way. \n\nI know I mentioned that you should start each website off with a mockup.\
    \ However, in this case since you're just learning it's not necessary.\n\nIf you've\
    \ been following so far you should have a blank HTML document with a black (or\
    \ possibly other color) background.\n\nGo to your CSS document and make it blank\
    \ again.\n\nWhen it comes to doing anything HTML/CSS related, there are many ways\
    \ to do every task.\n\nThat being said, we're going to cover a few different ways\
    \ to accomplish the same goal, giving our blank website a super cool background!\n\
    \n## Tiled Backgrounds\n\nOne of the most popular background options is your standard\
    \ tiled background.\n\n![](images/00015.jpeg)One of my favorite websites for getting\
    \ cool backgrounds for my projects is [www.subtletepatterns.com](http://www.subtletextures.com/),\
    \ go there and download a background of your choice and save it in your images\
    \ folder.\n\nI choose the very first pattern that I saw, called “paisley” and\
    \ you can see the pattern over to your right.\n\nThis pattern is seamless, meaning\
    \ when you tile this pattern it will create a seamless background which is perfect\
    \ for website backgrounds. \n\nIn order to tile this background we will have to\
    \ edit our CSS stylesheet to reflect the changes that we wish to make.\n\nOpen\
    \ up your stylesheet and then add the following code to add your tiled background.\n\
    \nbody\n\n{\n\n              background-image:url(../images/paisley.png);\n\n\
    }\n\nFigure 10.2 – Below is an HTML document with a tiled background.\n\n![](images/00016.jpeg)Of\
    \ course you should change “images” to the title of your images folder if you\
    \ chose to name your folder differently, as well as change the name of your actual\
    \ image file to match the file you have chosen.\n\nAbove is the result of my tiled\
    \ background."
