    \ only the top half of the font when you are using a medium weight font.\n\nFigure\
    \ 15.3 – Below is a firearms blog which utilizes Oswald in a medium weight. Only\
    \ the top half of the text is displayed.\n\n![](images/00058.jpeg)\n\nIf you happen\
    \ to notice this, you can remedy this by using a different font weight. However,\
    \ just realize that you are noticing this glitch because you have the font downloaded\
    \ on your own computer and that most internet users will not have this problem...unless\
    \ they are also web designers. As of today, I believe this issue happens mostly\
    \ with Firefox.\n\n# Chapter 16: Semantic Code\n\nSemantic code is basically the\
    \ act of making sure that the code that you write is easily understandable to\
    \ anyone who wants to work with it.\n\nIn the past (some people including myself\
    \ still use this today), people would lay out their websites using `div`s and\
    \ give the `div`s classes according to their function. The `div`s would be named\
    \ `header`, `nav`, `sidebar`, `footer`, etc.\n\nHowever, with the advent of HTML5\
    \ new `div`-“like” elements have emerged. These new HTML5 elements basically work\
    \ exactly the same as a `div` however they are more semantic, as they are named\
    \ after their function.\n\nThe new elements are named `header`, `nav`, `aside`,\
    \ `section`, `article`, `summary`, `details` and `footer`. Because older versions\
    \ of Internet Explorer don't recognize these elements people often add the code\
    \ directly beneath this sentence to the `head` of their document to alleviate\
    \ this problem.\n\n```html\n<!--[if lt IE 9]>\n    <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>\n<![endif]-->\n```\n\nYou may remember the above code from the HTML5\
    \ document I had you set up earlier.\n\n## Writing Semantic Code\n\nWhen coding\
    \ websites, I recommend that you always keep the concept of semantic code in the\
    \ back of your mind. You never know when a website that you have worked on in\
    \ the past may need to be worked on by someone else.\n\nIn order to make sure\
    \ that your websites are easily understandable make sure to:\n\n* Use logical\
    \ names when giving classes and `id`'s to HTML elements\n* Use the above mentioned\
    \ HTML5 elements to mark the important sections of your document\n* Use HTML as\
    \ well as CSS comments whenever necessary in order to help people understand what's\
    \ going on in the document\n\n### HTML & CSS Comments\n\nHTML & CSS comments can\
    \ help you to break up the clutter of messy HTML & CSS documents and help you\
    \ to better understand the code.\n\n![](images/00059.jpeg)\n\nThe format for an\
    \ HTML comment is located in the picture below. Above you'll see an extremely\
    \ old fashioned layout. It's an example of a website that was laid out using tables.\n\
    \nHTML techniques have come a long way since these days. However, the format for\
    \ writing an HTML comment is still the same. To write a comment in CSS the format\
    \ is illustrated in the picture below.\n\n![](images/00060.jpeg)\n\nThe CSS comments\
    \ are highlighted in the above picture. I think CSS comments are great when you\
    \ have a specific section of your website that a large chunk of CSS styles correspond\
    \ to. You can place a CSS comment at the beginning and end of the chunk of code\
    \ to let others know what the styles were meant for.\n\n# Chapter 17: Using Color\n\
    \nIn most cases when you need to specify a color, you will be using a hexadecimal\
    \ system. You can see the format for specifying these colors below.\n\n![](images/00061.jpeg)\n\
    \nHexadecimal colors are based off of 6 numbers/ letters as the name suggests.\
    \ The characters used in hexadecimal colors range from `a-z` and `0-9`. Smaller\
    \ numbers indicate darker colors while larger numbers indicate brighter colors.\n\
    \nThis is because computer colors are based off an additive color system. That\
    \ is, a system where color is made by adding light. The more light added of each\
    \ color the brighter the color will be.\n\nIn the image above you can see the\
    \ color code for black. As you can see there is 0 red, 0 green and 0 blue which\
    \ results in a black screen. Whereas full red, full green and full blue would\
    \ result in white.\n\nAlso in the image above you can see that a 6 character color\
    \ code can be converted to a 3 character color code if it is made up of 3 groups\
    \ of matching characters. For example `#330011` can be shortened to `#301`, `#999999`\
    \ can be shortened to `#999` and `#FFFFFF` can be shortened to `#FFF`. However,\
    \ `#030303` or `#996500` cannot be shortened.\n\nEssentially numbers `0-9` indicate\
    \ levels of color from low to high. Equal amounts of red, green and blue create\
    \ either white, black or a shade of gray. `#000000` indicates a color of black\
    \ because it uses equal parts (zero) red, green and blue whereas `#FFFFFF` indicates\
    \ white because it is equal parts (F possibly stands for “full” in this case)\
    \ red, green and blue.\n\nAlso, you can get pure red, green or blue by specifying\
    \ them to be full while the other two colors are specified to be zero. For example,\
    \ to specify red you could say `#FF0000` (or `#F00`) which means full red, 0 green\
    \ and 0 blue. Obviously, there are many more hues of red, green and blue available\
    \ however, this is for when you want to use the purest form of each.\n\n## Hexadecimal\
    \ Color Usage\n\nOne of the most common uses of this hexadecimal color code is\
    \ when you are specifying a font color. You can do this by using the CSS declaration\
    \ `color: #000000;` where `#000000` is the color of your choice.\n\nOther uses\
    \ for specifying color can come in handy when specifying background color (`background-color:\
    \ #000000`). As well as when specifying the color of a border (`border: 1px solid\
    \ #000000;`).\n\n## RGB Color Code\n\nSometimes, you will need to specify color\
    \ using a RGB color system. These instances occur much less frequently than the\
    \ hexadecimal system.\n\nInstances where you would use this happen mostly with\
    \ new CSS3 declarations such as when specifying opacity, you need to use the `RGBA`\
    \ code followed by the opacity using a decimal system. Or when specifying a CSS3\
    \ gradient.\n\nI won't get into specifics on when to use them because you can\
    \ easily find out how to use them when the time arises using a quick Google search.\n\
    \nThe way to specify RGB colors are as follows:\n\n![](images/00062.jpeg)\n\n\
    Each number can be any value from `0-255`. `0` being none and `255` being full.\
    \ Same rules apply as the hexadecimal. For example `rgb(255,0,0)` is pure red\
    \ and `rgb(25,25,25)` is some light shade of gray.\n\n## Opacity: RGBA Color Code\n\
    \nWith HTML5 and CSS3 we now have options for declaring opacity. `RGBA` is essentially\
    \ the same declaration as `RGB` however there is one more object that gets declared\
    \ and that's the opacity. The opacity level goes from `0.0` – `1.0`. `0.0` being\
    \ 0 percent and `1.0` being 100 percent. The format looks like this.\n\n![](images/00063.jpeg)\n\
    \n## Specifying Color By Name\n\nRecently, you have been able to specify colors\
    \ by name. However, this is fairly new to CSS3 and I haven't gotten used to using\
    \ it, nor have I used it.\n\nCorrection, I use it only when specifying a color\
    \ as `transparent` (AKA no-color).\n\nCheck it out and get comfortable with it\
    \ if you wish! As I mentioned earlier, there’s more than one way to skin a cat\
    \ when it comes to HTML/CSS!\n\n### Using The Correct Color From Your Mockup\n\
    \nAfter you've created your mockup in Photoshop, you're going to want to get the\
    \ correct colors to specify in your CSS. Luckily, this is very easy to do.\n\n\
    Simply use the eye-dropper tool to grab the color then double click on the foreground\
    \ color which pops up (this should be the color you chose). The resulting dialogue\
    \ window should have both the hexadecimal color code as well as the levels of\
    \ red, green & blue to use for `rgb` color codes.\n\nFigure 17.1 – In Photoshop,\
    \ you can use the Color Picker window to figure out what hexadecimal or RGB color\
    \ codes to specify in your CSS document.\n\n![](images/00064.jpeg)\n\n# Chapter\
    \ 18: CSS Sprites\n\nThe more images you use as well as the size of the images\
    \ makes for a slow loading website.\n"
