    # Chapter 21: Flash, Javascript & CSS Animations


    In the past, the only way to utilize simple and even some complex animations was
    to use either Flash or Javascript.  However, with the advent of CSS3, now animations
    can be done using CSS alone!


    This is great news because Apple products hate flash and some browsers (especially
    Internet Explorer) tend to block Javascript.


    Keep in mind however that these animations may not have support in older Internet
    Explorer browsers.  However, what else is new.  Internet Explorer tends to not
    work with a lot of cool HTML/CSS features.


    I won''t go into extreme details on how to use CSS animations.  However, just
    keep it in the back of your mind that it is possible to animate the color, position,
    etc of elements using CSS exclusively.


    You can even set time delays, animation speed, and other aspects of the animation
    which were never possible using CSS!


    # Chapter 22: Validation & Troubleshooting


    There comes a time in every web designers life when they have absolutely no idea
    why their code isn''t working.


    Luckily I have a few different solutions for you.


    ## Developer Tools


    One of the first things that I do when faced with problem is to use developer
    tools in the browser that I''m viewing the website in.


    Pretty much every modern browser is equipped with developer tools to help you
    figure out your code.


    Google Chrome happens to be my favorite because you are able to edit the HTML
    and CSS directly in the developer tools window and preview the changes before
    you commit them to your document.


    If you notice that a certain CSS style isn''t working correctly, check your developer
    tools and see if there is something wrong.


    Google Chrome''s developer tools window will put a slash through any CSS style
    that either:


    *   Is written incorrectly


    *   Is meant for a different browser (some CSS styles aren''t global yet so they
    have different prefixes for Mozilla and WebKit based browsers)  Google Chrome
    will put a slash through all Mozilla based styles


    Figure  22.1 –  The Developer Tools window is telling me that the style is not
    taking effect for some reason, the caution symbol next to the style lets me know
    it''s invalid.


    ![](images/00068.jpeg)Above you can see that there is a little caution symbol
    and a slash through the incorrectly defined style.  I tried to define a style
    for links wrapped in images.  I gave them a border 1 pixel wide, with a thin style
    then I purposely spelled turquoise wrong so the style would be invalid.


    Developer tools will also let you know if you forgot to link a file, if the file
    path is invalid, etc.


    ## W3C Validator


    The second way to diagnose your HTML/CSS is to validate it.  W3C stands for World
    Wide Web Consortium and all HTML has standards.


    When you are having a particularly difficult time with your code it helps to validate
    the code and see if it throws any errors.  Sometimes your code isn''t behaving
    properly because it is invalid.


    Simply go to [http://validator.w3.org](http://validator.w3.org/) (or Google W3C
    validator) and there are a few different ways to submit your code.


    You can either submit the entire url, you can submit by file upload or you can
    simply copy your entire HTML document and paste it into the textbox.


    Once W3C validator checks your code they''ll let you know if you have a missing
    tag, if you have a mismatched tag or if you did anything else that is against
    protocol.


    # Chapter 23: Minified HTML/CSS


    Up until this point, I''ve given you a ton of information on writing code as well
    as the ability to inspect other peoples code using web browser developer tools. 
    I felt that it may be necessary to include a little tid-bit on minified HTML/CSS.


    As I mentioned earlier, the formatting of your HTML/CSS is mostly for you and
    other developers that may touch your code.  Neatly formatting your code makes
    it easier to read, understand and edit.


    However, this neat formatting is for humans only.  The browser is a machine and
    that properly formatted code amounts for little to the browser except pesky white
    space surrounding the code that it is trying to read. 


    For this reason, many people tend to minify their HTML and CSS.  What this means
    is they format their code without unnecessary white space.


    Figure 23.1 – Below is minified CSS. Minified CSS takes less time for the browser
    to load.


    ![](images/00069.jpeg)Above you''ll see an image of some minified CSS. As you
    can tell it''s very difficult to read for human eyes however, for an internet
    browser this minified CSS can save load time over a non-minified stylesheet.


    As you become more advanced  in your coding skills you may choose to minify your
    code.  There are plenty of CSS and HTML minifying code generators that make it
    easy by doing all the minifying for you.


    I personally don''t minify my HTML however I use [http://www.cssminifier.com](http://www.cssminifier.com/)
    to minify my CSS stylesheets.


    When minifying code, make sure to keep a non-minified version on file just in
    case any mishaps occur.


    # Chapter 24: Grid Systems


    I wanted to briefly touch on grid systems because when I first started out I used
    to love this grid system known as the 960 grid system.


    My very first websites were all 1,000 pixels wide and I used to have to use my
    best judgment to come up with widths for items in my layouts.  For example if
    I was doing a two column layout, I would probably use an 700 pixel wide content
    area and a 300 pixel wide side bar.


    Then I found the 960 grid system.  The idea behind it was that 960 pixels was
    the perfect balance between older computer monitors which normally maxed out at
    around 1,000 pixels wide and newer computers with full resolution screens.


    Having a container of 960 pixels showed up well on almost all monitors and the
    number 960 is divisible by more numbers than say 1,000 for instance.  That way
    you could have, up to 12 equally sized columns.


    ## Why Grid Systems?


    The reason why I''m mentioning grid systems is for 2 reasons:


    1.  Grid systems make it easier for the website designer for a number of reasons.


    *   They normally come with a Photoshop document based on the dimensions of the
    grid so that you can lay out websites with ease and not have to worry as much
    about the dimensions because they''re already accounted for.


    *   They save time because the website designer doesn''t have to spend as much
    time thinking of how wide particular objects are going to be, thinking of class
    names to name divs of varying sizes, or doing math to get correct dimensions.


    2.  Grid systems paved the way for Bootstrap.  Bootstrap is a responsive grid
    system that is used by many web designers today, including me!


    I will briefly mention that after the popularity of the 960 grid system died off,
    a new grid system emerged for a moment.  This new grid system was based off a
    1,200 pixel wide container.  I believe the reasoning behind this was the fact
    that computer monitors were becoming wider and older computer monitors were being
    phased out.


    If you want to check out the 960 grid system simply visit [http://960.gs](http://960.gs/).


    # Chapter 25: Responsive Web Design


    Once you have a solid grasp on general website design, responsive website design
    will be easy for you to pick up. 


    I recommend messing around with just pages which don''t respond to the width of
    the browser window before you try to incorporate any responsive web design techniques
    in your arsenal however.


    But, I want you to get the most out of this e-book so we''ll touch on a few of
    the cornerstones of responsive web design.


    ## The Viewport'
