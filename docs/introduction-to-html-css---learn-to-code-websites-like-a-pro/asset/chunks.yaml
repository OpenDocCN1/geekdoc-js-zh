    background image include top, bottom or center followed by left or right. You
    can use a combination of two positions when it makes sense. For example, “top
    right” or “bottom left”.


    Keep in mind that if you''re placing a background image in a text element and
    you want the image to be to the left of your text, you will have to use padding
    in order to make sure that your text doesn''t cover the background image. Also,
    if your text isn''t as tall as your image you will have to use padding to make
    sure the background image doesn''t get clipped.


    ![](images/00024.jpeg)

