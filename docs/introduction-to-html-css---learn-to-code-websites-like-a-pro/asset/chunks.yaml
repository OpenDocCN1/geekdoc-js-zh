    ## Advantages To Certain Internet Browsers


    I personally crack open Google Chrome whenever I am going to begin a heavy session
    of coding.


    Figure 5.1 – I right clicked on the broken image and go to inspect element to
    see what''s wrong.


    ![](images/00004.jpeg)This is because Google Chrome has more intuitive and user
    friendly code diagnostic capability.


    In the image above you''ll see that there are 4 broken images in the box labeled
    “Advertise Here”. In Google Chrome, if I see an element that is behaving strange
    all I need to do is right click, followed by Inspect Element.


    Figure 5.2 – Once I click inspect element this window pops up and gives me some
    helpful information.


    ![](images/00005.jpeg)


    Once I click “Inspect Element” then this extremely helpful “Developer Tools” window
    pops up.


    The red “x” with the number in the corner, lets me know when files which the document
