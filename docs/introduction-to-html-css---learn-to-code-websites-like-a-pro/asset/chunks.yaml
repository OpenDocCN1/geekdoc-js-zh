    \ around with just pages which don't respond to the width of the browser window\
    \ before you try to incorporate any responsive web design techniques in your arsenal\
    \ however.\n\nBut, I want you to get the most out of this e-book so we'll touch\
    \ on a few of the cornerstones of responsive web design.\n\n## The Viewport\n"
