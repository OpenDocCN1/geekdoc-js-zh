    # Chapter 11: Preparing Images For The Internet


    So hopefully if you''re reading this book you have a little bit of knowledge of
    graphic design. And hopefully you have some type of image editing software.


    I''ll be using Photoshop to show you how to prepare images for the internet.


    This is extremely handy to know and is normally something that you would learn
    through trial and error.


    ## 72 DPI


    If you''re a graphic designer or come from a print background than you may be
    familiar with image resolution.


    Typically, when working with images that are being prepared for print the standard
    resolution is `300dpi`. However, when it comes to the internet most images are
    `72 dpi`. In some rare instances you may encounter pictures with resolutions which
    are upwards of around 90 something dpi, `72` being the standard.


    You also want to make sure that the images are saved using the correct file extension
    and that you are optimized for the file extension you''ve chosen.


    ## Most Common Image Extensions


    The most common image extensions that you will deal with when it comes to creating
    (pixel based) images for the web are `.jpg`, `.gif` and `.png`. Of course you
    also have `.svg`s which are “Scalable Vector Graphics” however we won''t be dealing
    with those for the time being.


    Each of these extensions have their advantages and disadvantages when it comes
    to saving certain types of images.


    When it comes to the internet, how you save your images matters. If you save your
    file in a format that isn''t optimal for the image you''re saving then it will
    take longer to load.


    ### When To Use A .JPG


    A `.jpg` is best for when the image you are trying to save is photographic in
    nature.


    What I mean by that, is if the image is made from thousands of tiny pixels of
    varying color and shade than saving it as a `.jpg` will be the best option for
    you.


    Figure 11.1 – As you can see this image is made up of thousands of tiny squares
    of color.


    ![](images/00027.jpeg)

    As you can see from the image above, that tiny spot on that dog''s forehead alone
    has so much variance in the color from pixel to pixel that saving this image as
    a `.png` or `.gif` will cause your website to load extremely slow.


    Saving your photographic images as a `.jpg` is great because in photo editing
    programs such as Photoshop, it gives you the option to lower the quality of the
    image so that the file will be smaller.


    You are able to lower the quality of the image and see how the final image will
    be effected, as well as how long the image will take to load BEFORE you actually
    save the file.


    What I like to do is lower the image quality, while watching the estimated load
    time of the image. This allows me to get the image to a point where the image
    quality is acceptable, while the image load time is not excessive.


    I took this same image above (it is `1920x1080` pixels this is very large for
    internet pictures) and using the “Save For Web And Devices” menu in Photoshop
    figured out how long this same image would take to load using the most common
    file extensions.


    Figure 11.2 – Below you can see a preview of the load time on the puppy picture
    using various image extensions.


    ![](images/00028.jpeg)

    As you can see, for the same exact image, saving this image as a `.png` would
    cause this image to take 402 seconds @ 56.6 Kbps, a `.gif` would take 190 seconds
    and a `.jpg` at 100% quality would take 114 seconds.


    Keep in mind the `.png` and `.gif` could be altered to load in less time however
    the image quality would drastically suffer but, the `.jpg` could be lowered in
    quality with minimal difference in the final product and still load extremely
    fast.


    ### .PNG''s And .GIF''s


    .PNG''s and .GIF''s are best used when the image in question is based on areas
    of solid color rather than thousands of pixels of various color.


    Figure 11.3 – Since the image below is based off blocks of solid color a `.png`
    or `.gif` file extension would work best.


    ![](images/00029.jpeg)

    The picture above would be better suited to be saved as either a `.gif` or a `.png`.
    If the image were to be animated it would most certainly be saved as a `.gif`
    because `.gif`s support animation.


    Both `.gif` and `.png` support transparency. (Wait, the source says: "Both .gif
    and png support transparency" is not there. I will just process what is there.)


    *(Wait, I will just provide the final output now.)*


    (Wait, I am overthinking. I will just provide the clean Markdown.)


