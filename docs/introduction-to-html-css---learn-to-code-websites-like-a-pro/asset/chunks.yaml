    ## 某些互联网浏览器的优势


    每当我准备开始一段高强度的编码工作时，我都会打开谷歌浏览器。


    图 5.1 – 我右键点击了损坏的图片，然后选择“检查元素”来查看问题所在。


    ![](img/00004.jpeg)这是因为谷歌浏览器拥有更直观、更友好的代码诊断能力。


    在上图中，你会看到“广告位”框内有 4 张损坏的图片。在谷歌浏览器中，如果我看到一个元素行为异常，我只需右键点击，然后选择“检查元素”。


    图 5.2 – 点击“检查元素”后，这个窗口会弹出并提供一些有用的信息。


    ![](img/00005.jpeg)


    一旦我点击“检查元素”，这个非常有用的“开发者工具”窗口就会弹出。


