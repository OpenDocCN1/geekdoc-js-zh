  trans: "\n\n# 构建网站\n\n我构建每个网站时，都会从模型开始。模型本质上是一个 Photoshop 文档，展示你网站首页的外观。\n\n图 10.1\
    \ – 下面是我为一个朋友的网站创建的模型。\n\n![](img/00014.jpeg)如图 10.1 所示，这是一个模型的示例。这是我为一个喜欢淘便宜货的朋友随手设计的网站布局。\n\
    \n这个网站将作为本书的示例贯穿始终，因为它只是一个简单的两栏网站。\n\n模型极其重要，因为它充当了网站的蓝图。\n\n一旦有了模型，你就可以开始编码了！\n\
    \n## 设置网站文件夹\n\n说实话，在构建网站这件事上，潜力是无限的。\n\n你不必完全按照我说的方式格式化存放网站的文件夹。\n\n你也不必按照我示例中的方式格式化代码。\n\
    \n但是，如果你保持 HTML 文档整洁易懂，保持文件夹整洁有序，将所有图片放在一个文件夹中——这些都是帮助你以专业方式编码的好习惯。\n\n话虽如此，我们将为你的第一个\
    \ HTML/CSS 实验设置一个文件夹。\n\n1. 创建一个文件夹，命名为 `website`\n2. 在该文件夹中创建两个子文件夹\n   * 一个命名为\
    \ `css`\n   * 一个命名为 `images`\n\nCSS 文件夹将存放你的 CSS 文件，Images 文件夹将存放你的图片文件。\n\n##\
    \ 设置 HTML 和 CSS 文档\n\n准备好后，打开你选择的代码编辑器，创建两个文档。\n\n第一个命名为 `index.html`，第二个命名为 `style.css`。在\
    \ HTML 中，“index”通常表示“首页”，当你将 HTML 上传到服务器时，服务器会将 index 作为首页提供。\n\n将这个 index 文件保存在你刚刚创建的根文件夹\
    \ `website` 中。CSS 样式表将保存在 CSS 文件夹中。\n\n### 设置 HTML 文档\n\n自 HTML5 问世以来，HTML 文档变得更加精简。下面是你页面上需要的最基本内容，以构成一个有效的\
    \ HTML 文档。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta\
    \ charset=\"utf-8\">\n    <title>这里放置你网站的标题</title>\n    <!--[if lt IE 9]>\n \
    \             <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>\n    <![endif]-->\n</head>\n<body>\n</body>\n</html>\n```\n\n打开你的 `index.html`，将上述代码输入到文档中。这是一个最基本的\
    \ HTML 文档，上面看到的大部分内容都是构成有效 HTML 文档所必需的。（过去，一个有效的 HTML 文档需要包含更多声明。）\n\n* `DOCTYPE`\
    \ = 文档类型\n* `HTML LANG` = “en”（英语）注意，HTML 标签从文档顶部开始，在底部结束，以包裹整个文档。\n* `Head` =\
    \ 放置页面标题、CSS 样式表链接、JavaScript 代码以及其他对网站重要但非外观必需的杂项代码的地方。\n* `<!--[if lt IE 9]>`\
    \ = 其后跟随的代码是为了让 HTML5 元素在旧版 Internet Explorer 浏览器中正常工作。我不确定这一行代码是否是有效文档所必需的，但加上也无妨。“if\
    \ lt IE 9”表示如果浏览器版本低于 Internet Explorer 9。整个代码块的意思是：如果查看此文档的浏览器是 Internet Explorer，并且版本低于\
    \ Internet Explorer 9，则使用此处链接的文档。\n* `Body` = 在 body 开始和结束标签之间放置你的 HTML 内容。\n\n\
    ### 链接 CSS 样式表\n\n与 HTML 文档不同，CSS 文档不需要那么多声明或要求。样式表基本上由你决定如何样式化你的 HTML。（这并不是说你可以不使用有效的\
    \ CSS。）\n\n为了让 CSS 样式对 HTML 文档生效，你需要将样式表链接到它。\n\n转到你的 `index.html`，添加下面以粗体显示的那行代码。\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\"\
    >\n    <title>这里放置你网站的标题</title>\n    <link href=\"css/style.css\" rel=\"stylesheet\"\
    \ type=\"text/css\" />\n    <!--[if lt IE 9]>\n              <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>\n    <![endif]-->\n</head>\n<body>\n</body>\n</html>\n```\n\n这行代码将样式表链接到你的\
    \ HTML 文档。`href` 是你要链接的文档的路径。\n\n### 整合在一起\n\n现在你有了一个空白的 HTML 文档和一个链接到它的样式表，可以大展身手了！\n\
    \n编码网站的最佳实践是：在文本编辑器中同时打开 HTML 和 CSS 文档，同时在浏览器中打开网站。\n\n在浏览器中打开网站至关重要，因为你需要能够刷新文档以查看你所做的更改是否生效。你可以通过右键单击文件，选择“打开方式”，然后选择你喜欢的浏览器来在浏览器中打开\
    \ HTML 文档。\n\n我喜欢做的一件事是，为了确认 CSS 文档确实链接到了我的 HTML 文档，我会为背景指定一种颜色，看看它是否生效。\n\n转到你的样式表，输入以下内容。\n\
    \n```css\nbody\n{\n              background-color:#000000;\n}\n```\n\n然后保存样式表文档，刷新浏览器，检查文档的背景是否确实发生了变化。\n\
    \n颜色代码 #000000 应该表示黑色。实际上，你可以在这里放置任何六位字母和数字的组合。但是，如果你将其设为 #ffffff，背景将变为白色，你就无法知道更改是否真的生效了，因为那已经是默认的背景颜色。\n\
    \n## 背景\n\n起初我不确定如何组织这本书。但我意识到，传授我 HTML/CSS 知识的最佳方式是介绍一些最实用的属性，并在此过程中穿插一些零碎的小技巧。\n\
    \n我知道我提到过你应该从模型开始每个网站。但在这里，因为你只是学习，所以没有必要。\n\n如果你一直跟着做，现在应该有一个空白的 HTML 文档，背景是黑色（或其他颜色）。\n\
    \n转到你的 CSS 文档，再次将其清空。\n\n在处理任何与 HTML/CSS 相关的事情时，完成每个任务都有多种方法。\n\n话虽如此，我们将介绍几种不同的方法来实现同一个目标：为我们的空白网站添加一个超酷的背景！\n\
    \n### 平铺背景\n\n最流行的背景选项之一是标准的平铺背景。\n\n![](img/00015.jpeg)我最喜欢的获取项目酷炫背景的网站之一是 [www.subtletepatterns.com](http://www.subtletextures.com/)，去那里下载一个你喜欢的背景，并将其保存到你的\
    \ `images` 文件夹中。\n\n我选择了看到的第一个图案，叫做“佩斯利”，你可以在右侧看到这个图案。\n\n这个图案是无缝的，意味着当你平铺这个图案时，它会创建一个无缝的背景，非常适合网站背景。\n\
    \n为了平铺这个背景，我们需要编辑 CSS 样式表以反映我们想要做出的更改。\n\n打开你的样式表，然后添加以下代码来添加你的平铺背景。\n\n```css\n\
    body\n{\n              background-image:url(../images/paisley.png);\n}\n```\n\n\
    图 10.2 – 下面是一个带有平铺背景的 HTML 文档。\n\n![](img/00016.jpeg)当然，如果你选择将文件夹命名为其他名称，你应该将\
    \ `images` 改为你的图片文件夹的名称，同时将实际图片文件的名称改为你选择的文件。\n\n上面是我的平铺背景的结果。\n\n"
- fmt: "\nAs I mentioned before with HTML elements all having default styles applied\
    \ to them, CSS styles have default properties associated with them as well.\n\n\
    For instance having a declaration for a `background-image` always denotes that\
    \ the background image will be tiled unless you declare otherwise.\n\nYou'll see\
    \ in a minute what other background option choices you have at your disposal.\n\
    \nA quick note about declaring paths.\n\nEssentially, because our CSS file and\
    \ our images are in different folders then we have to denote that in the path\
    \ declaration.\n\n```css\nbody\n{\n    background-image:url(../images/paisley.png);\n\
    }\n```\n\nThe `../` in front of the path is there in order to tell the stylesheet\
    \ that the path to the image is not in the same folder but is one folder up relative\
    \ to the CSS folder.\n\nWhen working locally on your computer you will be dealing\
    \ with what's known as \"relative\" path declarations. This means that your paths\
    \ will be based on where they are in relation to the current folder.\n\nWhen you\
    \ begin to upload your files to the internet you will be doing most of the same.\
    \ However, there may come a time when you will need to use an absolute path declaration.\n\
    \nOne example would be the one you witnessed above in the head of the HTML document.\n\
    \n`<script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"></script>`\n\
    \nBecause the Javascript file above is not relative to your website and is located\
    \ on its own url, you will need to declare the path beginning with the url.\n\n\
    Simply put, the path will need to be denoted beginning with `http://www.example.com/the-folder-in-question...`\n\
    \n## Gradient Fun!\n\nOk, as I mentioned above, background images are tiled unless\
    \ you specify otherwise.\n\nFigure 10.3 – Below are two gradient examples. On\
    \ the left is a gradient tiled on the y-axis and on the right is a gradient tiled\
    \ on the x-axis.\n\n![](images/00017.jpeg)You can make a linear gradient in one\
    \ of two ways. I used only a simple black to white gradient to illustrate my point.\
    \ However, you can get as crazy as you wish with your gradient. You can even do\
    \ circular gradients. (I'll show you how after this later)\n\nIn order to accomplish\
    \ the top to bottom gradient you'll need an image to tile on its x-axis (left\
    \ and right). Since it repeats itself left and right the image only needs to be\
    \ 1 pixel wide (you should always be concerned with using as little images as\
    \ possible to save load time!)\n\nChoose your two favorite colors to create a\
    \ gradient. Create a file in Photoshop that is around 400 pixels tall and 1 pixel\
    \ wide and fill the file with your gradient.\n\nFigure 10.4 – Here I am creating\
    \ a 1 pixel wide image which will serve as my gradient.\n\n![](images/00018.jpeg)I\
    \ decided to use black and blue for mine.\n\nSave your image in your images folder\
    \ and be sure to remember the name and the extension.\n\nGo to your stylesheet\
    \ and type:\n\n```css\nbody\n{\n    background-image:url(../images/gradient.png);\n\
    \    background-repeat:repeat-x;\n}\n```\n\nObviously replace `gradient.png` with\
    \ your filename and extension.\n\nThis is the result...\n\nFigure 10.5 – Below\
    \ is the result of my tiled gradient.\n\n![](images/00019.jpeg)Now, I know what\
    \ you're thinking...I messed up. However, I wanted to show you this to illustrate\
    \ my next point.\n\nWe declared a background image and told it to tile on the\
    \ x-axis. It did, however the default for the background is still white and therefore\
    \ there is white showing below where the image was tiled.\n\nIn order to fix this\
    \ we'll have to also specify a background color along with the background image\
    \ so the gradient will look fluid. Let's use our Photoshop eye-dropper tool in\
    \ order to get the color code we need!\n\nFigure 10.6 – Below I'm using the eye\
    \ dropper tool to get to figure out the color at the very bottom of my gradient.\
    \ This will help me to declare a background color and blend my gradient in with\
    \ the page.\n\n![](images/00020.jpeg)\n\nAs you can see above we used the color\
    \ picker tool to find the code for the color that we need. Now we can fix our\
    \ gradient and make it continuous!\n\nGo to your CSS and add:\n\n```css\nbody\n\
    {\n    background-image:url(../images/gradient.png);\n    background-repeat:repeat-x;\n\
    \    background-color:#00aeef;\n}\n```\n\nObviously replace the hexcode number\
    \ with the color which you need.\n\nFigure 10.7 – Below is my new beautiful continuous\
    \ gradient!\n\n![](images/00021.jpeg)And our gradient is now fixed!\n\nUsing the\
    \ above logic we can create a left to right gradient by following the same steps.\
    \ Except in this case we use an image that is 1 pixel tall and \"X\" pixels wide.\
    \ And instead of saying `background-repeat: repeat-x;` we change it to `background-repeat:\
    \ repeat-y`.\n\nNot only do we have control over how the background repeats but\
    \ we also have control over the position. The default position for a background\
    \ is always in the upper left corner.\n\nThis allows for a variety of different\
    \ options.\n\nFigure 10.8 – Getting funky with the gradients. This gradient runs\
    \ along the right side of the browser window!\n\n![](images/00022.jpeg)For example,\
    \ the above gradient would be created with a 1 pixel tall by \"X\" pixels wide\
    \ image which is repeating on the y-axis and the `background-position` is `right`.\n\
    \nThe code would look like this.\n\n```css\nbody\n{\n    background-image:url(../images/gradientexample.png);\n\
    \    background-repeat:repeat-y;\n    background-color:#00aeef;\n    background-position:right;\n\
    }\n```\n\nIf you're worried about memorizing each CSS declaration, don't. Each\
    \ of these things can be Googled at a later date if you forget. The most important\
    \ thing is that you understand the underlying principals and see what is possible\
    \ using HTML/CSS.\n\n## Radial Gradients & Image-less Gradients\n\nThe following\
    \ gradient options have only been available recently. HTML5 and CSS3 have brought\
    \ along many, extremely cool features that were once only available using Javascript\
    \ or extremely image-heavy solutions.\n\nHowever, now we have the ability to create\
    \ radial gradients and image-less gradients using only CSS! The only downside\
    \ to this solution is that it isn't compatible with older versions of Internet\
    \ Explorer. However, as time progresses, the older versions of IE will die off\
    \ and worrying about cross browser compatibility will be a thing of the past.\n\
    \nI personally use this website `http://www.colorzilla.com/gradient-editor/` to\
    \ create my gradients. I found it by Googling \"gradient generator\" and it's\
    \ the first organic search result.\n\nFigure 10.9 – This \"Ultimate CSS Gradient\
    \ Generator\" is awesome for creating image-less gradients of all types!\n\n![](images/00023.jpeg)This\
    \ website is awesome because:\n\n* It allows you to edit the gradient just like\
    \ you would using image editing software\n* You can change the orientation of\
    \ the gradient from vertical, horizontal, diagonal as well as radial\n* The CSS\
    \ is generated for you and they included CSS declarations for the most common\
    \ browsers as well as a backwards compatible solution for older IE browsers\n\
    * They have pre-made gradients\n* Best of all it saves you a ton of time\n\nOnce\
    \ you've created a gradient you're happy with, simply copy the CSS and paste it\
    \ into your style sheet.\n\n## Non-repeating Background Images\n\nAbove I've mentioned\
    \ a few techniques for creating background effects. However, there may come a\
    \ time when you want an element to have just one picture as its background.\n\n\
    You may want the picture to be featured in the bottom right corner. Or you may\
    \ want a heading to have a background image just to the left of the text.\n\n\
    In order to do this you need to give the element a background image as stated\
    \ above. However, we need to state that the background should not repeat.\n"
  raw: "As I mentioned before with HTML elements all having default styles applied\
    \ to them, CSS styles have default properties associated with them as well.\n\n\
    For instance having a declaration for a “background-image” always denotes that\
    \ the background image will be tiled unless you declare otherwise. \n\nYou'll\
    \ see in a minute what other background option choices you have at your disposal.\n\
    \nA quick note about declaring paths.\n\nEssentially, because our CSS file and\
    \ our images are in different folders then we have to denote that in the path\
    \ declaration.\n\nbody\n\n{\n\n              background-image:url(../images/paisley.png);\n\
    \n}\n\nThe “../” in front of the path is there in order to tell the stylesheet\
    \ that the path to the image is not in the same folder but is one folder up relative\
    \ to the CSS folder.\n\nWhen working locally on your computer you will be dealing\
    \ with what's known as “relative” path declarations. This means that your paths\
    \ will be based on where they are in relation to the current folder.\n\nWhen you\
    \ begin to upload your files to the internet you will be doing most of the same. \
    \ However, there may come a time when you will need to use an absolute path declaration.\n\
    \nOne example would be the one you witnessed above in the head of the HTML document.\n\
    \n<script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"></script>\n\
    \nBecause the Javascript file above is not relative to your website and is located\
    \ on it's own url, you will need to declare the path beginning with the url. \n\
    \nSimply put, the path will need to be denoted beginning with “http://www.example.com/the-folder-in-question...”\n\
    \n## Gradient Fun!\n\nOk, as I mentioned above, background images are tiled unless\
    \ you specify otherwise. \n\nFigure 10.3 – Below are two gradient examples. On\
    \ the left is a gradient tiled on the y-axis and on the right is a gradient tiled\
    \ on the x-axis.\n\n![](images/00017.jpeg)You can make a linear gradient in one\
    \ of two ways.  I used only a simple black to white gradient to illustrate my\
    \ point.  However, you can get as crazy as you wish with your gradient.  You can\
    \ even do circular gradients. (I'll show you how after this later)\n\nIn order\
    \ to accomplish to top to bottom gradient you'll need an image to tile on it's\
    \ x-axis (left and right).  Since it repeats itself left and right the image only\
    \ needs to be 1 pixel wide (you should always be concerned with using as little\
    \ images as possible to save load time!)\n\nChoose your two favorite colors to\
    \ create a gradient. Create a file in Photoshop that is around 400 pixels tall\
    \ and 1 pixel wide and fill the file with your gradient.\n\nFigure 10.4 – Here\
    \ I am creating a 1 pixel wide image which will serve as my gradient.\n\n![](images/00018.jpeg)I\
    \ decided to use black and blue for mine.\n\nSave your image in your images folder\
    \ and be sure to remember the name and the extension.\n\nGo to your stylesheet\
    \ and type:\n\nbody\n\n{\n\n              background-image:url(../images/gradient.png);\n\
    \n              background-repeat:repeat-x;\n\n}\n\nObviously replace “gradient.png”\
    \ with your filename and extension. \n\nThis is the result...\n\nFigure 10.5 –\
    \ Below is the result of my tiled gradient.\n\n![](images/00019.jpeg)Now, I know\
    \ what you're thinking...I messed up.  However, I wanted to show you this to illustrate\
    \ my next point.\n\nWe declared a background image and told it to tile on the\
    \ x-axis.  It did, however the default for the background is still white and therefore\
    \ there is white showing below where the image was tiled.\n\nIn order to fix this\
    \ we'll have to also specify a background color along with the background image\
    \ so the gradient will look fluid. Let's use our Photoshop eye-dropper tool in\
    \ order to get the color code we need!\n\nFigure 10.6 – Below I'm using the eye\
    \ dropper tool to get to figure out the color at the very bottom of my gradient. \
    \ This will help me to declare a background color and blend my gradient in with\
    \ the page.\n\n![](images/00020.jpeg)\n\nAs you can see above we used the color\
    \ picker tool to find the code for the color that we need.  Now we can fix our\
    \ gradient and make it continuous!\n\nGo to your CSS and add:\n\nbody\n\n{\n\n\
                  background-image:url(../images/gradient.png);\n\n              background-repeat:repeat-x;\n\
    \n background-color:#00aeef;\n\n}\n\nObviously replace the hexcode number with\
    \ the color which you need.\n\nFigure 10.7 – Below is my new beautiful continuous\
    \ gradient!\n\n![](images/00021.jpeg)And our gradient is now fixed!\n\nUsing the\
    \ above logic we can create a left to right gradient by following the same steps. \
    \ Except in this case we use an image that is 1 pixel tall and “X” pixels wide. \
    \ And instead of saying “background-repeat: repeat-x;” we change it to “background-repeat:\
    \ repeat-y”.\n\nNot only do we have control over how the background repeats but\
    \ we also have control over the position.  The default position for a background\
    \ is always in the upper left corner.\n\nThis allows for a variety of different\
    \ options.\n\nFigure 10.8 – Getting funky with the gradients. This gradient runs\
    \ along the right side of the browser window!\n\n![](images/00022.jpeg)For example,\
    \ the above gradient would be created with a 1 pixel tall by “X” pixels wide image\
    \ which is repeating on the y-axis and the background-position is “right”.\n\n\
    The code would look like this.\n\nbody\n\n{\n\n              background-image:url(../images/gradientexample.png);\n\
    \n              background-repeat:repeat-y;\n\n background-color:#00aeef;\n\n\
    \ background-position:right;\n\n}\n\nIf you're worried about memorizing each CSS\
    \ declaration, don't.  Each of these things can be Googled at a later date if\
    \ you forget.  The most important thing is that you understand the underlying\
    \ principals and see what is possible using HTML/CSS.\n\n## Radial Gradients &\
    \ Image-less Gradients\n\nThe following gradient options have only been available\
    \ recently.  HTML5 and CSS3 have brought along many, extremely cool features that\
    \ were once only available using Javascript or extremely image-heavy solutions. \n\
    \nHowever, now we have the ability to create radial gradients and image-less gradients\
    \ using only CSS!  The only downside to this solution is that it isn't compatible\
    \ with older versions of Internet Explorer.  However, as time progresses, the\
    \ older versions of IE will die off and worrying about cross browser compatibility\
    \ will be a thing of the past.\n\nI personally use this website [http://www.colorzilla.com/gradient-editor/](http://www.colorzilla.com/gradient-editor/)\
    \ to create my gradients.  I found it by Googling “gradient generator” and it's\
    \ the first organic search result.\n\nFigure 10.9 – This “Ultimate CSS Gradient\
    \ Generator” is awesome for creating image-less gradients of all types!.\n\n![](images/00023.jpeg)This\
    \ website is awesome because:\n\n*   It allows you to edit the gradient just like\
    \ you would using image editing software\n\n*   You can change the orientation\
    \ of the gradient from vertical, horizontal, diagonal as well as radial\n\n* \
    \  The CSS is generated for you and they included CSS declarations for the most\
    \ common browsers as well as a backwards compatible solution for older IE browsers\n\
    \n*   They have pre-made gradients\n\n*   Best of all it saves you a ton of time\n\
    \nOnce you've created a gradient you're happy with, simply copy the CSS and paste\
    \ it into your style sheet.\n\n## Non-repeating Background Images\n\nAbove I've\
    \ mentioned a few techniques for creating background effects.  However, there\
    \ may come a time when you want an element to have just one picture as it's background.\n\
    \nYou may want the picture to be featured in the bottom right corner.  Or you\
    \ may want a heading to have a background image just to the left of the text.\n\
    \nIn order to do this you need to give the element a background image as stated\
    \ above. However, we need to state that the background should not repeat."
