    \ 1），蓝色和粉色区域说明了该对象占据的空间。显然，“标题 1”元素占据了整个页面的宽度。\n\n如果我将相同的 `H1` 标签放在一个仅占浏览器窗口宽度一半的容器中，`H1`\
    \ 标签仍然会占据尽可能多的水平空间。只是在这种情况下，它会被其容器限制，容器只允许它占据浏览器窗口的一半宽度。\n\n上面的页面大部分是块级元素，如你所见，它们堆叠在一起。然而，最后一行有\
    \ 3 个不同的行内元素。让我们选择“检查元素”选项来了解更多关于这些行内元素的本质。\n\n图 12.2 —— 我在一个 `span` 元素上点击了“检查元素”。带有\
    \ `span` 元素的行包含 3 个不同的 `span` 元素。注意，它们都在同一行。这是因为它们是行内元素。\n\n![](img/00037.jpeg)\n\
    \n文档的最后一行包含 3 个 `span` 标签。`span` 是一种类型类元素，它的重要性/意义程度小于段落（paragraph），段落可以被认为是 `span`\
    \ 的大哥。\n\n如你所见，当我检查 `span` 元素时，元素本身只占据了它所需的空间。所有行内元素都是如此。\n\n块级元素和行内级元素之间的关系非常重要，因为可能会有某时刻，你希望两个块级元素直接挨在一起。或者可能会有某时刻，你希望将行内元素显示得像块级元素一样。\n\
    \n## 行内块元素 (Inline-block)\n\n行内块元素是具有宽度高度的行内元素，而不是只占据必要的空间。这虽然很少遇到，但了解它仍然很好，也是你武器库中的另一个工具。\n\
    \n## “浮动”元素 (Floating)\n\n在我们深入探讨之前，我将向你展示人们通常是如何设置网站的。我将通过使用我已经完成的布局并使用黄色来展示。\n\
    \n在现代网站开发中，人们使用所谓的 `div` 来分离和布局内容。`div` 是一个块级 HTML 元素，如果你知道如何操作它们，布局网站非常有用。\n\n\
    图 12.3 —— 我将此页面中的每个 `div` 包裹在黄色框中以说明。\n\n![](img/00038.jpeg)\n\n如果你感到有点困惑，那太棒了！这意味着你理解了块级元素是如何工作的。如果你不困惑，那么在没有\
    \ CSS 的情况下，这些框应该是堆叠的。事实上，如果没有 CSS，它们将会是那样。让我们回到之前看到的图片。\n\n![](img/00039.jpeg)\n\
    \n如你所见，去掉 CSS 后右侧的图像完全相同。所以这告诉我们，通过 CSS 我们能够按照我们的方式布局对象。\n\n如果你希望两个块级元素并排，那么它们需要：\n\
    \n1. 每个元素都需要有一个指定的宽度。块级元素通常会占据尽可能多的水平空间，因此如果没有指定的宽度，它们将只是堆叠在一起。\n2. 所有并排元素的宽度之和不能大于容器元素的宽度。假设你正在创建一个宽度为\
    \ 1000 像素的网站。你不能创建两个 600 像素宽的 `div` 并期望它们并排。同样，你不能让两个 500 像素宽且带有 10 像素边距的 `div`\
    \ 并排，因为宽度的总和加上 10 像素的边距将使对象的对象的总宽度达到 520 像素。\n3. 对象需要被“浮动”。float 是一种 CSS 样式声明，告诉对象基本上在水平方向上向右或向左堆叠。这取决于你指定对象浮动到右侧还是左侧。CSS\
    \ 声明如下。\n\n```css\ndiv {\n    float:left;\n}\n```\n\n你也可以通过输入 `float:none;` 来指定不浮动。这种浮动对象的做法对于现代网站设计至关重要。过去，人们必须使用表格来获得相同的效果。\n\
    \n## “清除”元素 (Clearing)\n\n"
