    to 31%.  At 31% quality the image takes 4 seconds to load.  And as you can see,
    lowering the quality of the image has caused the image to suffer greatly.


    If you''ll look at the areas on the image that I have circled you can see subtle
    variances in the color of the individual pixels causing an extremely ugly effect
    to take place.


    This is known as a .jpg “artifact”.


    ### A Word About Transparency


    When I was going to college to learn about website design.  I created a website
    for a school project.  The website had an image with a transparent background
    featured in front of a colored background.


    When I looked closer I noticed that there were tiny pixels around the edge of
    the transparent image which weren''t quite right.


    In order to illustrate the problem, I''ll create a web page with a red background,
    save the image above as a .png as well as a .gif and place the image on the page
    to show you the issue I was having.


    Figure 11.5 – The small amount of white pixels surrounding the picture below is
    an issue of “matting”.


    ![](images/00032.jpeg)This is what happens when you save the image as a .gif. 
    As you can see there are white pixels surrounding the image in certain places.


    Now, let''s try the same thing with a .png.


    Figure 11.6 – Same image saved as a .png.  The .png offers superior transparency
    without having to mess around with “matting”.


    ![](images/00033.jpeg)As you can see the image now doesn''t have those pesky pixels
    there anymore!


    But what caused this?


    In all honesty, this was a problem which effected me for a while when I first
    started web design.  And even when I asked my teacher at the time he seemed to
    be of no help.'
