    我想快速提几点：


    1. 几乎所有现代浏览器都有某种“开发者工具”选项，但我个人认为谷歌浏览器的版本最有用且最容易使用。谷歌浏览器的开发者工具窗口也很酷，因为它允许你直接在开发者工具窗口中编辑
