  trans: "\n默认情况下，字体将是 `Times New Roman`（或 Mac 对应字体）。为了绕过这一点，你可以在样式表的顶部通过针对 `body`\
    \ 设置你选择的 `font-family` 来指定你想要的默认字体。\n\n```css\nbody {\n    font-family: Arial,\
    \ Helvetica, Sans-serif;\n}\n```\n\n# 第 21 章：Flash、Javascript 与 CSS 动画\n\n在过去，利用简单甚至是复杂的动画的唯一方法是使用\
    \ Flash 或 Javascript。然而，随着 CSS3 的出现，现在仅使用 CSS 就能实现动画！\n\n这是一个极好的消息，因为苹果产品讨厌 Flash，而且某些浏览器（尤其是\
    \ Internet Explorer）倾向于阻止 Javascript。\n\n但请记住，这些动画在旧版本的 Internet Explorer 浏览器中可能不支持。不过，这又有什么新鲜的呢。Internet\
    \ Explorer 往往不支持很多酷的 HTML/CSS 特性。\n\n我不会详细介绍如何使用 CSS 动画。但是，请记在心里，你可以完全使用 CSS 来制作元素的颜色、位置等。\n\
    \n你甚至可以设置时间延迟、动画速度以及其他在原生 CSS 中曾经无法实现的动画属性！\n\n# 第 22 章：验证与故障排除\n\n每个网页设计师的生命中总会有那么时刻，他们完全不知道为什么自己的代码不起作用。\n\
    \n幸运的是，我有几种不同的解决方案可以给你。\n\n## 开发者工具\n\n当我面对问题时，我做的第一件事之一是在查看网站的浏览器中使用开发者工具。\n\n\
    几乎每个现代浏览器都配备了开发者工具来帮助你检查代码。\n\nGoogle Chrome 恰好是我最喜欢的，因为你可以在开发者工具窗口中直接编辑 HTML\
    \ 和 CSS，并在将其提交到文档之前预览更改。\n\n如果你发现某个 CSS 样式工作不正常，请检查你的开发者工具，看看是否有问题。\n\nGoogle\
    \ Chrome 的开发者工具窗口会对符合以下任何条件的 CSS 样式上划上斜线：\n\n*   编写错误\n*   为其他浏览器设计的（某些 CSS 样式尚未全局化，因此它们对\
    \ Mozilla 和基于 WebKit 的浏览器有不同的前缀）Google Chrome 会在所有基于 Mozilla 的样式上划上斜线\n\n图 22.1\
    \ – 开发者工具窗口正在告诉我由于某种原因样式未生效，样式旁边的警告符号让我知道它是无效的。\n\n![](img/00068.jpeg)\n上方你可以看到，定义错误的样式上有一个小的警告符号并划了斜线。我尝试为包裹在图像中的链接定义样式。我给它们设置了\
    \ `1` 像素宽的边框，细样式，然后我故意拼错了 turquoise（青松石），导致该样式无效。\n\n开发者工具还会告诉你你是否忘记链接文件、文件路径是否有效等。\n\
    \n## W3C 验证器\n\n诊断你的 HTML/CSS 的第二种方法是对其进行验证。W3C 代表万维网联盟（World Wide Web Consortium），所有的\
    \ HTML 都有标准。\n\n当你编写代码遇到特别困难时，验证代码并查看它是否报错会有帮助。有时你的代码运行不正常是因为它是无效的。\n\n只需访问 [`http://validator.w3.org/](http://validator.w3.org/)（或\
    \ Google W3C 验证器），就有几种不同的提交代码的方法。\n\n你可以提交整个 URL，可以通过文件上传提交，也可以直接复制整个 HTML 文档并粘贴到文本框中。\n\
    \n一旦 W3C 验证器检查了你的代码，它们会让你知道是否缺少标签、标签是否匹配，或者你是否执行了任何其他违反协议的操作。\n\n# 第 23 章：压缩后的\
    \ HTML/CSS\n\n到此为止，我已经为你提供了大量关于编写代码的信息，以及使用 浏览器开发者工具检查他人代码的能力。我觉得有必要稍微介绍一点关于压缩后\
    \ HTML/CSS 的小知识。\n\n正如我之前提到的，你的 HTML/CSS 格式化主要是为了你以及可能接触你代码的其他开发者。整洁地格式化你的代码使其更容易阅读、理解和编辑。\n\
    \n然而，这种整洁的格式化仅对人类有效。浏览器是一台机器，格式化良好的代码对浏览器来说几乎没有意义，除了它试图读取的代码周围那些讨厌的空白之外。\n\n出于这个原因，许多人倾向于压缩他们的\
    \ HTML 和 CSS。这意味着他们在格式化代码时去除了不必要的空白符。\n\n图 23.1 – 下方是压缩后的 CSS。压缩后的 CSS 浏览器加载所需的时间更短。\n\
    \n![](img/00069.jpeg)\n上方你可以看到一些压缩后的 CSS 图像。正如你所看到的，这对人类眼睛来说很难阅读，但对于互联网浏览器来说，这种压缩后的\
    \ CSS 比未压缩的样式表节省加载时间。\n\n随着你编码技能的提高，你可能会选择压缩你的代码。有很多 CSS 和 HTML 压缩代码生成器，它们通过为你完成所有的压缩工作来变得简单。\n\
    \n我个人并不压缩我的 HTML，但我使用 [`http://www.cssminifier.com/](http://www.cssminifier.com/)\
    \ 来压缩我的 CSS 样式表。\n\n在压缩代码时，确保在文件中保留一个未压缩的版本，以防发生任何意外。\n\n# 第 24 章：网格系统\n\n我想简要提到一下网格系统，因为当我刚出道时，我非常喜欢这种被称为\
    \ 960 网格系统的系统。\n\n我的第一批网站都是 1000 像素宽的，我以前通常根据自己的判断来确定各个项目的宽度。例如，如果我正在做一个双栏布局，我可能会使用一个\
    \ 700 像素宽的内容区域和一个 300 像素宽的侧边栏。\n\n然后我发现了 960 网格系统。它背后的理念是，960 像素在最大值为 1000 像素的旧显示器和新的全分辨率屏幕之间达到了完美的平衡。\n\
    \n拥有 960 像素的容器在所有显示器上显示效果良好，而且 960 这个数字比例如 1000 更能被更多的数字整除。这样你就可以拥有 12 个等宽列。\n\
    \n## 为什么使用网格系统？\n\n1. 网格系统由于许多原因让网页设计师的工作变得更容易：\n*   它们通常已经考虑了尺寸，因此设计师不需要再那么担心尺寸。\n\
    *   它们节省了时间，因为网页设计师不需要花费大量时间去思考特定对象有多宽、为不同尺寸的 div 起类名，或者为了正确的尺寸进行计算。\n2. 网格系统为\
    \ Bootstrap 铺平了道路。Bootstrap 是许多网页设计师（包括我在内）使用的响应式网格系统。\n"
