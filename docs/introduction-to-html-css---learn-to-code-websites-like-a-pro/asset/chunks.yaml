  trans: "\n# CSS 雪碧图\n\n为了应对这一现象，一些人使用了一种称为 CSS 雪碧图的概念。CSS 雪碧图是指将多张图片合并成一张图片。这样浏览器就不必加载大量小图片，而是加载一张稍大的图片，从而加快加载速度。通常这些雪碧图采用\
    \ `PNG` 格式，因为 `PNG` 支持出色的透明度。\n\n我喜欢在使用社交媒体图标时使用 CSS 雪碧图。\n\n图 18.1 – 下面是我设置为用作\
    \ CSS 雪碧图的图片。注意标尺是可见的，并且正在使用参考线。这使我更容易在 CSS 声明中使用实际的坐标。\n\n![](img/00065.jpeg)\n\
    \n上图是我创建的 CSS 雪碧图示例。我创建了相同社交媒体图标的黑白版本，以及红色版本，用于用户悬停在图标上时显示。\n\n如你所见，我使用了 Photoshop\
    \ 的参考线，并将标尺设置为像素。这很重要，因为这些坐标稍后对我们很有用。\n\n## 使用 CSS 雪碧图\n\n要使用 CSS 雪碧图，你需要指定图片的高度和宽度，然后必须指定背景图片以及坐标（相对于图片左侧和顶部的坐标）。\n\
    \n```css\n.social\n{\n    height:65px;\n    width:65px;\n    display:block;\n\
    \    float:left;\n    margin:0 5px 10px 0;\n}\n```\n\n如上所示，我将用作社交媒体 CSS 雪碧图的链接添加了一个\
    \ `.social` 类。然后我为每个链接设置了 65 像素的高度和宽度。我说将链接设置为 `block` 显示，因为否则链接将是行内元素。\n\n每个链接将向左浮动，这样它们会从左到右依次排列，然后我指定了外边距。\n\
    \n然后每个单独的图标需要指定背景以及坐标。\n\n```css\n.fbblack\n{\n    background:url(../images/socialsprite.png)\
    \ 0 0;\n}\n```\n\n上图是黑色 Facebook 图标的 CSS。`0 0` 表示图片从左侧 0 像素、顶部 0 像素开始显示。\n\n```css\n\
    .twblack\n{\n    background:url(../images/socialsprite.png) -65px 0;\n}\n```\n\
    \n上图是黑色 Twitter 图标的 CSS。`-65px 0` 表示图片从左侧 65 像素、顶部 0 像素开始显示。\n\n最后，我为每个图标指定了“悬停状态”。我将向你展示我是如何实现的，接下来我们将讨论元素状态！\n\
    \n```css\n.fbblack:hover, .fbwhite:hover\n{\n    background:url(../images/socialsprite.png)\
    \ 0 -130px;\n}\n```\n\n上图是黑色 Facebook 图标和白色 Facebook 图标的悬停状态。我将图形设计成黑白社交媒体图标在悬停时都显示红色，这就是为什么两者使用相同的背景图片和\
    \ CSS 雪碧图坐标。\n\n如上所示，红色悬停状态位于左侧 0 像素、顶部 130 像素处。\n\n这个主题可能对某些人来说是困惑的，所以不要害怕做一些自己的研究和实验来学习更多。我主要想告诉你这个技巧，以便你将它作为你的武器库的一部分。\n\
    \n# 第 19 章：元素状态\n\n交互元素（如链接和输入框（搜索栏、文本框等））具有所谓的不同“状态”。\n\n正因如此，你可以使用 CSS 来设置每个元素的“状态”样式。\n\
    \n在我让你更加困惑之前，我所说的状态包括：\n\n* 激活\n* 悬停\n* 焦点\n* 已访问\n\n图 19.1 – 当你在 Google Chrome\
    \ 的开发者工具窗口中右键点击一个元素时，你可以“强制元素状态”，即使元素表现得好像正在显示你选择的状态。这在尝试为特定元素状态设置样式时非常有用。\n\n\
    ![](img/00066.jpeg)\n\n上图是 Google Chrome 开发者工具的截图，这也是我非常喜欢使用 Chrome 编写网站的原因之一。在对象上右键点击并选择“检查元素”后，你可以在开发者工具窗口中右键点击，然后选择“强制元素状态”，再选择你想查看的状态。\n\
    \n这对测试你的 CSS 非常有用，因为正如我之前提到的，你可以使用 CSS 为所有这些元素状态设置样式。\n\n## 激活\n\n激活指的是活动链接。\n\
    \n## 悬停\n\n悬停指的是用鼠标悬停在一个链接或对象上。\n\n## 焦点\n\n焦点指的是当前处于活动状态的输入元素。例如，当你在填写表单时按下了\
    \ Tab 键。下一个出现闪烁光标的表单字段就是具有“焦点”的字段。\n\n## 已访问\n\n已访问指的是你之前访问过的链接。\n\n### 样式化元素状态\n\
    \n为了为这些元素状态设置样式，你只需要使用类、ID 或其他技术定位 HTML 元素，然后在后面加上冒号和元素状态。\n\n这方面的一个例子可以在 CSS\
    \ 雪碧图章节中找到，我在那里指定了图片的显示区域，用于普通社交媒体图标和用户悬停时的社交媒体图标。\n\n# 第 20 章：值得考虑的实用技巧\n\n有一些\
    \ CSS 样式由于多种原因，我会在我写的每个样式表中加入这些样式。我们现在来了解一下。\n\n## 实用的 Internet Explorer 样式\n\n\
    当你用链接包裹图片时，Firefox 和 Google Chrome 不会有这个问题。然而，出于某种原因，旧版 Internet Explorer 非常喜欢在所有被链接包裹的图片周围放置一个丑陋的蓝色边框。\n\
    \n图 20.1 – 旧版 Internet Explorer 曾在所有被链接包裹的图片周围放置一个丑陋的蓝色边框。使用 Internet Explorer\
    \ 的开发者工具，我能够将页面显示为好像是在旧版 Internet Explorer 中渲染的。红色圆圈圈出的是 Internet Explorer 开发者工具窗口中用于操作显示以反映旧版浏览器版本的区域。\n\
    \n![](img/00067.jpeg)\n\n显然，他们在新版 Internet Explorer 中修复了这个问题。然而，当你按下 `F12` 时可以打开开发者工具窗口。我用该窗口展示了网站在\
    \ Internet Explorer 8 中的外观。\n\n如你所见，图片周围有一个蓝色边框。为了解决这个问题，我在每个样式表中添加以下样式。\n\n```css\n\
    a img\n{\n    border:0 none transparent;\n}\n```\n\n它针对所有被 `a`（链接）包裹的 `img`（图片）。如果你不理解这个\
    \ CSS 声明，定义边框的标准格式是 `border: (宽度 像素) (样式：solid, dotted, dashed) (颜色);`。所以我指定了一个宽度为\
    \ 0 像素、无样式且颜色为 `transparent` 的边框。\n\n## 全局重置\n\n正如之前提到的，每个 HTML 元素都有默认样式。不同的浏览器在决定每个元素应该如何显示方面有一些自由度。\n\
    \n因此，许多人链接到一个称为“reset”的 CSS 样式表。这个样式表基本上以对所有现代浏览器统一的方式为每个元素设置样式。\n\n我觉得这不是必需的。但是我在所有样式表中使用以下样式。\n\
    \n```css\nhtml, body\n{\n    margin:0;\n    padding:0;\n}\n```\n\n有些人喜欢在 `html`\
    \ 和 `body` 后面加上 `*`。星号被称为“通配符”，基本上针对每个元素。然而，我觉得只指定 `html` 和 `body` 元素就足够了。\n\n\
    ## 默认链接悬停样式\n\n当你开始对链接样式进行炫酷设计时，不要忘记设置“悬停”状态。\n\n通常你会完成一个链接，使其看起来像一个超级酷的按钮，然后你去测试它并说...“糟糕，当我悬停在这个按钮上时，文本变成蓝色并出现下划线”。\n\
    \n为了避免这种情况，请确保为悬停状态指定字体颜色，并且如果你不想出现下划线，请指定 `text-decoration: none;`。\n\n## 默认字体\n"
