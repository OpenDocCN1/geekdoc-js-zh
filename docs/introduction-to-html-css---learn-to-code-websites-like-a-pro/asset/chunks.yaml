    \ the 960 grid system. The idea behind it was that 960 pixels was the perfect\
    \ balance between older monitors which normally maxed out at 1,000 pixels and\
    \ newer computers with full resolution screens.\n\nHaving a container of 960 pixels\
    \ showed up well on all monitors and the number 960 is divisible by more numbers\
    \ than say 1,000 for instance. That way you could have up to 12 equally sized\
    \ columns.\n\n## Why Grid Systems?\n\n1. Grid systems make it easier for the website\
    \ designer for a number of reasons:\n*   They normally come with a Photoshop document\
    \ based on the dimensions that not have to worry as much about the dimensions\
    \ because they're already accounted for.\n*   They save time because the website\
    \ designer doesn't have to spend as much time thinking of how wide particular\
    \ objects are going to be, thinking of class names to name divs of varying sizes,\
