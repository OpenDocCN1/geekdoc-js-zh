    ### When To Use A .JPG


    A .jpg is best for when the image you are trying to save is photographic in nature.


    What I mean by that, is if the image is made from thousands of tiny pixels of
    varying color and shade than saving it as a .jpg will be the best option for you.


    Figure 11.1 – As you can see this image is made up of thousands of tiny squares
    of color.


    ![](images/00027.jpeg)


    As you can see from the image above, that tiny spot on that dog''s forehead alone
    has so much variance in the color from pixel to pixel that saving this image as
    a .png or .gif will cause your website to load extremely slow.


    Saving your photographic images as a .jpg is great because in photo editing programs
    such as Photoshop, it gives you the option to lower the quality of the image so
    that the file will be smaller.


    You are able to lower the quality of the image and see how the final image will
    be effected, as well as how long the image will take to load BEFORE you actually
    save the file.


    What I like to do is lower the image quality, while watching the estimated load
    time of the image.  This allows me to get the image to a point where the image
    quality is acceptable, while the image load time is not excessive.


    I took this same image above (it is 1920x1080 pixels this is very large for internet
    pictures) and using the “Save For Web And Devices” menu in Photoshop figured out
