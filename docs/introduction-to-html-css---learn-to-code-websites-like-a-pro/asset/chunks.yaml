    \n在保存透明图像时这会产生问题，因为如果你尝试将此图像保存为 `.gif`，这些抗锯齿像素默认将具有白色背景。\n\n这导致了你在上面看到的效果，即我们猫咪图像周围有白色像素。然而，当你以\
