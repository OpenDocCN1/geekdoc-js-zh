    # Floats and Clears


    Floats and clears go hand in hand. Let''s say that you have two floating objects
    inside of a container object.


    Using CSS you have specified a red background for the container element and the
    two floating objects don''t have any kind of background.


    The container object is wrapped around both objects so what will the background
    of the entire area be? If you''re a logical person than you would assume that
    since the container has a red background that the background of the entire area
    would be red.


    However, since floating objects don''t behave quite like block level elements
    anymore they don''t trigger the container element to wrap completely around both
    floating elements.


    I know it sounds a little confusing so I''ll just illustrate it.


    Figure 12.3 – Below are two divs side by side inside of a container div. I specified
    for the container div to have a red background however there is no background
    color present...what gives???


    ![](images/00040.jpeg)Ok, so above you''ll see the result of what I was talking
    about.


    I created a div with a class of `container`. I said for the div to be 1,000 pixels
    wide and be centered in the middle of the page.


    Within that container div I created two divs which are supposed to have a width
    of 50% and are to be floated left.


    They are stacked side by side however the container isn''t wrapped around them.
    We know this because the container div is supposed to have a red background.


    Let''s use the “inspect element” option to see what happened to our container
    div.


    Figure 12.4 – I clicked “inspect element” on the container div only to see that
    it isn''t wrapped around the elements inside it.


    ![](images/00041.jpeg)As you can see the container is not wrapping around the
    two div''s which are inside of it.


    The reason for this is because the HTML document doesn''t really see floating
    objects as if they were there.


    It''s a little hard to explain so let''s put a block level element after our two
    floating divs and see what happens.


    Figure 12.4 – It''s beginning to look a little better, we can see the red background
    but it isn''t completely covering the elements inside it.


    ![](images/00042.jpeg)I placed a H1 tag after both divs and as you can see the
    container now sees that there is a block level element inside it and wraps around
    it.


    You may be wondering why the H1 tag didn''t go below both of the floating divs.


    This is because, just like we write from left to right. HTML goes from left to
    right. And if you don''t specify otherwise each element will try to go directly
    into the upper left corner of the screen.


    In order for the H1 tag we just placed in the document to go beneath the two floating
    objects, we have to use another CSS property called a “clear”.


    I purposely put half as many objects into the right column div as the left column
    div so it would be shorter. And because there is nothing there to tell the H1
    tag to clear both of those floating elements, it goes to the nearest upper left
    corner that is available.


    The clear property has a few different options. You can either clear objects to
    the left, to the right, or both.


    Now, let me give that H1 tag a class of `clear`. And then I can use CSS to specify
    that any element with a class of `clear` should clear “both”.


    ![](images/00043.jpeg)Above is the HTML as well as the CSS that''s involved. And
    below is the result.


    ![](images/00044.jpeg)As you can see, floats and clears are extremely helpful
    when it comes to laying out websites.


    Next we will learn about margins and padding which will also be helpful when it
    comes to lay outs as well as styling objects the way you want them to look.


    ## Margins and Padding


    Margins and padding are both extremely powerful tools. Both of which do almost
    the same thing with a few minor differences.


    ### Margins


    A margin works to basically serve as a barrier, pushing objects away from other
    objects.


    If you set a margin of 10 pixels to an object that means that no other HTML element
    can get within 10 pixels of that element.


    While margins don''t add to the actual size of the element, they do sort of add
    size to the coverage of the element.


    For example, if you were to have a containing div which you specified to be 1,000
    pixels wide. Then you placed two floating divs inside the container. Each of the
    two floating divs were said to have a width of 500 pixels. Then both divs would
    fit directly side by side with each other in the container.


    However, if you were to give both of the floating divs a margin of 10 pixels,
    they would stack on top of each other because they wouldn''t have enough room
    to fit side by side.


    Figure 13.1 – These two divs are supposed to sit side by side inside of a 1,000
    pixel wide container. Each div is 500 pixels wide. However, now because each div
    has a margin of 10 pixels around, they don''t fit next to each other anymore.


    ![](images/00045.jpeg)Above is the same website from earlier. However instead
    of the containing div having a red background I gave each of the floating divs
    a red background, as well as a margin of 10 pixels around the entire border.


    As you can see, even though the width I specified was 50% they don''t fit side
    by side anymore because of the margins. And as you can see by the “inspect element”
    tool in Google Chrome, it illustrates the margin using that peach type color.


    ### Padding


    Padding is almost identical to margins, except padding works inside the element.
    If you were to specify a 10 pixel padding to an element, the element would grow
    10 pixels on each side. Also, no element would be able to get within 10 pixels
    of the edge of the element.


    In the above example you can see that the text inside each div actually touches
    the edge of the div itself. This isn''t very attractive, so let''s give those
    div''s a padding of 10 pixels so we can see what happens when we do!


    Figure 13.2 – I gave this div a padding of 10 pixels all around and clicked “inspect
    element”.


    ![](images/00046.jpeg)As you can see the text is not touching the edge anymore.
    Google Chrome uses a green color to denote padding however you aren''t able to
    tell in this example because it''s being overpowered out by the red background
    of the divs.


    ### Specifying Margin & Padding


    Specifying margins and padding both work the same way. Keep in mind you can specify
