    system. You can see the format for specifying these colors below.


    ![](images/00061.jpeg)Hexadecimal colors, are based off of 6 numbers/ letters
    as the name suggests.  The characters used in hexadecimal colors range from a-z
    and 0-9.  Smaller numbers indicate darker colors while larger numbers indicate
    brighter colors.


    This is because computer colors are based off an additive color system.  That
    is, a system where color is made by adding light.  The more light added of each
    color the brighter the color will be. 


    In the image above you can see the color code for black.  As you can see there
    is 0 red, 0 green and 0 blue which results in a black screen.  Whereas full red,
    full green and full blue would result in white.


    Also in the image above you can see that a 6 character color code can be converted
    to a 3 character color code if it is made up of 3 groups of  matching characters. 
    For example #330011 can be shortened to #301, #999999 can be shortened to #999
    and #FFFFFF can be shortened to #FFF.  However, #030303 or #996500 cannot be shortened.


    Essentially numbers 0-9 indicate levels of color from low to high.  Equal amounts
    of red, green and blue create either white, black or a shade of gray.  #000000
    indicates a color of black because it uses equal parts (zero) red, green and blue
    whereas #FFFFFF indicates white because it is equal parts (F possibly stands for
    “full” in this case) red, green and blue.


    Also, you can get pure red, green or blue by specifying them to be full while
    the other two colors are specified to be zero.  For example, to specify red you
    could say #FF0000 (or #F00) which means full red, 0 green and 0 blue.  Obviously,
    there are many more hues of red, green and blue available however, this is for
    when you want to use the purest form of each.


    ## Hexadecimal Color Usage


    One of the most common uses of this hexadecimal color code is when you are specifying
    a font color.  You can do this by using the CSS declaration (color: #000000;)
    where #000000 is the color of your choice. 


    Other uses for specifying color can come in handy when specifying background color
    (background-color: #000000).  As well as when specifying the color of a border
    (border: 1px solid #000000;)


    ## RGB Color Code


    Sometimes, you will need to specify color using a RGB color system. These instances
    occur much less frequently than the hexadecimal system.


    Instances where you would use this happen mostly with new CSS3 declarations such
    as when specifying opacity, you need to use the RGBa code followed by the opacity
    using a decimal system.  Or when specifying a CSS3 gradient.


    I won''t get into specifics on when to use them because you can easily find out
    how to use them when the time arises using a quick Google search.


    The way to specify RGB colors are as follows:


    ![](images/00062.jpeg)Each number can be any value from 0-255\. 0 being none and
    255 being full.  Same rules apply as the hexadecimal.  For example rgb(255,0,0)
    is pure red and rgb(25,25,25) is some light shade of gray.


    ## Opacity: RGBA Color Code


    With HTML5 and CSS3 we now have options for declaring opacity.  RGBA is essentially
    the same declaration as RBG however there is one more object that gets declared
    and that''s the opacity.  The opacity level goes from 0.0 – 0.1.  0.0 being 0
    percent and 1.0 being 100 percent. The format looks like this.


    ## ![](images/00063.jpeg)Specifying Color By Name


    Recently, you have been able to specify colors by name.  However, this is fairly
    new to CSS3 and I haven''t gotten used to using it, nor have I used it. 


    Correction, I use it only when specifying a color as “transparent” (AKA no-color).


    Check it out and get comfortable with it if you wish!  As I mentioned earlier,
    there’s more than one way to skin a cat when it comes to HTML/CSS!


    ### Using The Correct Color From Your Mockup


    After you''ve created your mockup in Photoshop, you''re going to want to get the
    correct colors to specify in your CSS.  Luckily, this is very easy to do.


    Simply use the eye-dropper tool to grab the color then double click on the foreground
    color which pops up (this should be the color you chose). The resulting dialogue
    window should have both the hexadecimal color code as well as the levels of red,
    green & blue to use for rgb color codes.


    Figure 17.1 – In Photoshop, you can use the Color Picker window to figure out
    what hexidecimal or RGB color codes to specify in your CSS document.


    # ![](images/00064.jpeg)


    # Chapter 18: CSS Sprites


    The more images you use as well as the size of the images makes for a slow loading
    website.'
