    One difference between static and responsive website design is the fact that with
    responsive design you need to designate that the width of the screen should be
    the width of the website.


    You do this by adding a declaration to the head of the document. Also in this
    declaration you can specify if the user can zoom in as well as how much they can
    zoom.


    ```html

    <meta name="viewport" content="width=device-width, initial-scale=1">

    ```


    Above is an example of one of these declarations.


    ## Specifying Widths


    In static website design, when we create a 2 column layout, we think of how wide
    we want our columns to be in pixels and create them. However, when it comes to
    responsive design, static widths don''t cut it.


    When you want the widths of objects to change with the width of the browser window
    it''s imperative to designate widths in percentages.


    This way your website stays in proportion whether the device is 1,200 pixels wide
    or 350 pixels wide.


    ## Responsive Images


    The width of your images is also important because as the screen gets smaller
    your images obviously can''t be full resolution or else your end user will have
    to scroll on their phone to see the entire picture.


    To alleviate this you need to specify a width or maximum width of 100% or less.
    The height can be auto regulating by simply specifying that the width be “auto”.
    That is, an automatic height relative to the current width.


    ## Responsive Type


    Obviously when your screen is wide all `Heading 1` elements can be large, however
    when you view the same website on a smaller screen that heading will most likely
    take up the entire screen.


    Since this isn''t the most aesthetic way to build a website, some people like
    to specify their font sizes in em''s rather than pixels.


    I for one don''t like to do this so I use the next topic to alleviate this.


    ## Responsive Navigation


    Obviously when your screen reaches a point below 1,000 pixels you can''t have
    a wide navigation bar anymore. At some point the width of the browser will be
    too narrow to support your navigation bar.


    However, don''t fear because there are a variety of responsive navigation solutions
    to choose from. All you have to do is Google it!


    ## Break Points & Media Queries


    These next two topics go hand in hand. I will also mention that if you''re going
    to be doing responsive web design you NEED to download a resolution plugin. That
    is, a plugin that tells you the width of the browser window at any given time.


    The reason for this is when you''re dealing with a responsive website, as you
    make the browser window smaller you need to see exactly WHEN the website begins
    to look weird.


    Then you can say with authority, “ok when the website is less than 1,000 pixels
    wide this object get''s out of place.” This is what''s known as a “break point”.


    You can then specify a “media query” that says, when the browser window is less
    than 1,000 pixels width than do this. Obviously this can be anything you want
    it to be because you will be specifying your will using CSS.


    The way media queries work is you can either say: when the browser is below this
    width do this, when the browser is above this width do this or when the browser
    is between this width and this width do this.


    When the browser is below this width do this.


    ```css

    @media only screen and (max-width : 320px) {

    /* Styles Go In Here */

    }

    ```


    When the browser is above this width do this.


    ```css

    @media only screen and (min-width : 321px) {

    /* Styles Go In Here */

    }

    ```


    When the browser is below this width and above this width do this.


    ```css

    @media only screen and (min-device-width : 768px) and (max-device-width : 1024px){

    /* Styles Go In Heret */

    }

    ```


    ### Something To Remember


    Remember that media queries should go at the end of your CSS document because
    when it comes to CSS the things at the bottom hold more precedence than the things
    at the top of the document.


    As the browser window get''s smaller the media queries that pertain to that browser
    width will begin to take effect and the CSS styles that pertain to wider screens
    fall back.


    If you encounter a particularly difficult CSS style that doesn''t take effect
    and you''ve tried everything and done your “developer tools” research, than you
    can add `!important` just before the semi-colon of the CSS style declaration.
    `!important` gives the CSS style precedence over any other inherited styles.


    ## Chapter 26: The Favicon


    The icing on the cake to your website is the favicon. That is the little 16x16
    pixel image that is associated with your website and gets saved with the title
    of your website when someone adds your site to their favorites.


    To create a favicon, simply create a 16x16 pixel document in Photoshop or the
    image editing software of your choice. Create an icon to represent your website.
    Since you will need to save the file as a `.png`, your favicon can be transparent.


    I then use `http://favicon-generator.org/` to generate my favicon. I save the
    resulting file in the root folder of my website. The favicon extension is `.ico`
    and the favicon generator website also gives you the code that you need to attach
    your favicon to your site. That code goes into the head of your documents.


    Figure 26.1 – This website changed since I first started using it. However, when
    creating your favicon, make sure to select “Generate only 16x16 favicon.ico”.
    This saves you from downloading unnecessary files you don''t need.


    # ![](images/0070.jpeg


    # Conclusion & Next Steps


    I hope you''ve enjoyed my e-book. I sincerely hope that I''ve given you a solid
    foundation of knowledge to build upon. Going forward, there are some amazing resources
    online for learning HTML, CSS as well as Javascript.


    One of my favorite websites, where I learned a majority of my coding knowledge
    was a website called `www.w3chools.com/`. There you''ll find easy tutorials about
    pretty much anything you could want to know related to code. Including your next
    steps which will be to get further acquainted with HTML & CSS as well as learn
    about Bootstrap (widely used responsive grid system) and responsive web design.


    When you are in a bind, don''t forget to use your Google skills. There you''ll
    find resources from a few of my favorite websites. One of which is `www.stackoverflow.com/`.
    This website is basically a forum of experienced code ninjas answering each questions
    pertaining to code.


    Another one of my favorite websites is `www.css-tricks.com/`. There you''ll find
    tons of great resources related to HTML & CSS


    Before I conclude this book. I''m going to give you one of the most important
    tips in this entire book. This is one of the tips which makes me such a fast coder.


    Every time you Google an HTML element or CSS style, if you find yourself looking
    up the same stuff over and over. After a while, try to commit it to memory. The
    more stuff you commit to memory the faster you will be because you can spend less
    time on the internet trying to find out how to write code and more time actually
    writing code.


    Thank you so much for reading!

