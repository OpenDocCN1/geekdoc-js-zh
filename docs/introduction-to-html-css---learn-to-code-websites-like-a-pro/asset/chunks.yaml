    如你所见，我创建了一个名为 `container` 的类并设置了 `0 auto` 外边距。这意味着在 `container` 的顶部和底部应该有 0 像素的外边距，而左右两侧的外边距将自动调节。


    这是一项非常棒的技术，但不要认为你可以使用这种技术来居中**任何**对象。


    为了让这项技术生效：


    *   该对象必须是块级元素（或至少通过 CSS 指定为 `display: block`）

    *   该对象必须指定宽度

    *   该对象不能浮动（float）

    *   该对象不能是固定或绝对定位（我们将在下一节介绍这些）


    # 第 14 章：其他类型的定位技术


    老实说，我尝试使用浮动（floats）来布局我大部分的网站。然而，偶尔也会出现一些例外情况。


    ## 相对定位


    这种定位相对于对象原始位置的。


    基本上，在你在页面上布局了一些对象之后，你可能会发现某个对象并不在它应该在的位置。


    使用相对定位，你只需要指定该元素的位置为 `position: relative;`，然后就可以根据它的原始位置来移动它。你可以使用 `top: 10px`
    或根据情况使用 `top`、`bottom`、`right` 和 `left`。


    ## 绝对定位


    绝对定位是绝对的，但它是基于任何父元素的。例如，如果你想对一个对象进行“绝对”定位，而该对象在一个 div 内部。那么你指定的位置将相对于该 `div`。


    如果对象没有被包含在其他元素中，它将相对于 HTML 页面本身。


    绝对定位的元素对其他元素没有任何影响。它们不会将任何其他元素推开，基本上是从文档的普通“流”中移除了。


    ## 固定定位


    固定定位相对于浏览器窗口本身。换句话说，当你打开网络浏览器时，取决于你的屏幕尺寸，如果浏览器是最小化或全屏等。


    当你滚动页面时，固定定位的元素不会移动。我过去曾将其用于，当我希望页面背景是固定图片且不希望图片随页面滚动而滚动时。


    我还将此用于社交媒体分享框，该框固定在浏览器窗口的侧边。


    你以前可能见过的其他用途包括当你滚动很大距离后出现在屏幕右下角的箭头。（那个允许你快速滚动到页面顶部的按钮。）


    ### 使用定位


    为了使用这种定位，你只需要使用 CSS 指定定位类型。


    有一行 CSS 将专门用于：


    `position: (relative, fixed or absolute);`


    后面跟着代码行，它们将根据 `top`、`right`、`left` 和 `bottom` 告诉你在哪里定位元素。你可以使用像素（pixels）、点（points）、Em
    等作为你的测量单位。


    # 第 15 章：字体、字体、字体！


    好了，如果你有平面设计背景，你就会知道衬线字体（serif font）是指字母末端带有微小尖端装饰的字体。衬线字体非常适合打印，因为这些衬线似乎将单词融合在一起，被认为能让读者更容易阅读。


    然而，在万物皆由像素构成的互联网上，衬线字体并不是理想的。并不是说你不应该使用它们，但如果你打算使用衬线字体，最好只将其用于标题或特殊字体类型元素，而不是正文。


    此原因是因为像素是正方形的，当将微小的正方形转换为衬线字体时，字体往往会在翻译过程中丢失。这就是“网络安全字体”一词发挥作用的地方。


    ## 声明字体是如何工作的


    所以，请记住，除非另有指定，否则 Times New Roman（或同）是默认字体。这意味着除非你想使用 Times New Roman，否则你绝对需要指定你想使用的字体。


    字体通过字体族（family）来指定。要指定你想使用的字体，你先从 CSS 声明 `font-family` 开始。


    ![](img/00052.jpeg)如你所见，我的文本编辑器正试图为我提供建议列表。


    ![](img/00053.jpeg)上方是典型的字体声明。你基本上用冒号列出你的选项。列表中的第一个是优先字体，随后是你的所有第二选择，最后是根据字体族选择衬线（serif）、无衬线（sans-serif）或草书体（cursive）。


    这样做的效果是，无论某人的电脑上安装了什么字体，你都有更大的机会让字体类型以你想要的方式渲染。


    在上面的示例中，如果某人有 Arial，那么计算机将使用 Arial 渲染字体。如果某人使用的是 Mac，那么他们可能没有 Arial，在这种情况下，计算机将字体渲染为
    Helvetica。如果其他一切都失败了，计算机将直接使用默认的无衬线字体。


    大多数默认/经典的声明只有 3 个选项，但你可以根据需要指定任意数量的“回退”（fall back）字体。


    ## 其他字体方法


    显然，并不是每个人都想为他们的网页设计项目使用“普通”字体。有些人想使用特殊字体，因为它们符合他们的设计、公司品牌等。


    使用特殊字体创建网站还有其他几种选项。其中，我将介绍我最常用的一种。


    ### Google Fonts


    Google 拥有一个网络安全字体库，列在 [www.google.com/fonts](http://www.google.com/fonts)，你可以在这里找到并使用喜欢的字体。


    图 15.1 - 下方是位于 www.google.com/fonts 的库。


    ![](img/00054.jpeg)如你所见，上方是 Google 字体网站。在这里你可以选择你想使用的字体，以及你想使用的字重（weights）。（字重是指字体的粗细。）


    但我会警告你，选择的 Google 字体越多、字重越多，你的网站加载时间就越长。


    为了使用 Google Fonts，只需选择你想使用的字体。Google 会给你一个 CSS 表格的链接，你需要将其链接到文档的头部。当你想使用该字体时，使用他们给你的声明。


    ![](img/00055.jpeg)如你所见，上方一旦你选择了字体，就可以选择你想使用的字重。然后 Google 会更新页面加载工具，让你知道字体会增加多少页面加载时间。


    完成后，向下滚动查看……


    ![](img/00056.jpeg)我很确定我提到过，但不同的浏览器渲染完全相同字体的方式是不同的。这一点至关重要，因为在一个浏览器中看起来很好的字体，如果尺寸略有不同，在另一个浏览器中可能看起来非常奇怪。


    让我们看看相同的字体在 Firefox、Google Chrome 和 Internet Explorer 中的渲染情况。请记住，这些字体据说是“Google”字体。我想你会很惊讶的！


    ![](img/00057.jpeg)上方你会看到在 Google Chrome、Firefox 和 Internet Explorer 中渲染的 Open
    Sans。如你所见，每种字体看起来略有不同。尽管每行包含完全相同的字符，但每行的长度也不同。


    最有趣的是……Google Chrome 并不是显示自己字体的最佳浏览器。Internet Explorer，这个最糟糕的浏览器，在显示字体方面可能是最好的。


    ### Google Fonts 免责声明


    这是另一个我通过经验学到的技巧。如果你的电脑上下载了某些 Google 字体（如 Oswald），它们的显示可能会很异常。


