  trans: "\n\n正如我之前提到的，所有的 HTML 元素都应用了默认样式，CSS 样式也有其与之关联的默认属性。\n\n例如，对 `background-image`\
    \ 进行声明，始终意味着背景图像将进行平铺（tiled），除非你另有声明。\n\n稍后你将看到你还有哪些背景选项可可用。\n\n关于声明路径的简要说明。\n\
    \n本质上，由于我们的 CSS 文件和图像位于不同的文件夹中，因此我们必须在路径声明中注明这一点。\n\n```css\nbody\n{\n    background-image:url(../images/paisley.png);\n\
    }\n```\n\n路径前面的 `../` 是为了告诉样式表，图片的路径不在同一个文件夹中，而是在 CSS 文件夹的上一级目录。\n\n在你的计算机上进行本地操作时，你处理的是所谓的“相对”路径声明。这意味着你的路径将基于它们相对于当前文件夹所在的位置。\n\
    \n当你开始将文件上传到互联网时，你进行的大部分操作将是相同的。然而，可能会在某个时刻，你需要使用绝对路径声明。\n\n其中一个例子就是你在上面 HTML\
    \ 文档的 `head` 标签中看到的那个。\n\n`<script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>`\n\n因为上面的 JavaScript 文件并不相对于你的网站，而是位于它自己的 URL 上，因此你需要声明以 URL 开头的路径。\n\
    \n简单来说，路径需要以 `http://www.example.com/the-folder-in-question...` 开头注明。\n\n## 渐变之旅！\n\
    \n好了，正如我上面提到的，除非你进行指定，否则背景图像将平铺。\n\n图 10.3 – 下面是两个渐变示例。左侧是在 y 轴上平铺的渐变，右侧是在 x 轴上平铺的渐变。\n\
    \n![](img/00017.jpeg)你可以通过两种方式创建线性渐变。我只使用了一个简单的黑到白渐变来说明我的观点。然而，你可以随心所欲地对渐变进行任何创作。你甚至可以制作圆形渐变。（稍后我会教你如何做）\n\
    \n为了实现从上到下的渐变，你需要一张可以在 x 轴（左侧和右侧）平铺的图像。由于它在左右重复，因此该图像只需要 1 像素宽（你应该始终尽可能少地使用图像以节省加载时间！）\n\
    \n选择你最喜欢的两种颜色创建一个渐变。在 Photoshop 中创建一个高度约为 400 像素、宽度为 1 像素的文件，并用你的渐变填充该文件。\n\n\
    图 10.4 – 在这里我正在创建一个 1 像素宽的图像，作为我的渐变。\n\n![](img/00018.jpeg)我决定使用黑色和蓝色。\n\n将你的图像保存到\
    \ `images` 文件夹中，并确保记住文件名和扩展名。\n\n进入你的样式表并输入：\n\n```css\nbody\n{\n    background-image:url(../images/gradient.png);\n\
    \    background-repeat:repeat-x;\n}\n```\n\n显然将 `gradient.png` 替换为你的文件名和扩展名。\n\
    \n这就是结果……\n\n图 10.5 – 下面是我平铺渐变的结果。\n\n![](img/00019.jpeg)现在，我知道你在想什么……我搞砸了。然而，我想向你展示这个是为了说明我的下一个观点。\n\
    \n我们声明了一个背景图像并告诉它在 x 轴上平铺。它确实做到了，但背景的默认值仍然是白色，因此在图像平铺下方显示出白色。\n\n为了修复这个问题，我们必须在指定背景图像的同时也指定背景颜色，这样渐变看起来会更流畅。让我们使用\
    \ Photoshop 的吸管工具来获取所需的颜色代码！\n\n图 10.6 – 下面我正在使用吸管工具来确定我渐变最底部的颜色。这将帮助我声明背景颜色，并将我的渐变与页面融合。\n\
    \n![](img/00020.jpeg)\n\n如你上方所见，我们使用了颜色取色工具来找到所需的颜色代码。现在我们可以修复渐变并让它变得连续！\n\n进入你的\
    \ CSS 并添加：\n\n```css\nbody\n{\n    background-image:url(../images/gradient.png);\n\
    \    background-repeat:repeat-x;\n    background-color:#00aeef;\n}\n```\n\n显然将十六进制代码数字替换为你需要的颜色。\n\
    \n图 10.7 – 下面是我崭新的、美丽的连续渐变！\n\n![](img/00021.jpeg)我们的渐变现在已经修复了！\n\n使用上述逻辑，我们可以按照相同的步骤创建一个从左到右的渐变。在这种情况下，我们使用一个高\
    \ 1 像素、宽 \"X\" 像素的图像。我们不再说 `background-repeat: repeat-x;`，而是将其改为 `background-repeat:\
    \ repeat-y`。\n\n我们不仅可以控制背景如何重复，还可以控制位置。背景的默认位置始终在左上角。\n\n这允许有许多不同的选项。\n\n图 10.8\
    \ – 玩转渐变。这个渐变沿着浏览器窗口的右侧运行！\n\n![](img/00022.jpeg)例如，上面的渐变是通过一个高 1 像素、宽 \"X\" 像素的图像创建的，它在\
    \ y 轴上重复，且 `background-position` 为 `right`。\n\n代码如下：\n\n```css\nbody\n{\n    background-image:url(../images/gradientexample.png);\n\
    \    background-repeat:repeat-y;\n    background-color:#00aeef;\n    background-position:right;\n\
    }\n```\n\n如果你担心记住每个 CSS 声明，这些担心。这些以后都可以通过 Google 查询。最重要的是理解原理并看到 HTML/CSS 可以实现的功能。\n\
    \n## 径向渐变与无图像渐变\n\n下面的渐变选项最近可用。HTML5 和 CSS3 带来了许多曾经只能通过 JavaScript 或大量的图像解决方案实现的。\n\
    \n然而，现在我们能够仅使用 CSS 创建径向渐变和无图像渐变！这种解决方案的唯一缺点是不兼容旧版本的 Internet Explorer。但是随着时间的推移，旧版本的\
    \ IE 将消失，担心浏览器兼容性将成为过去。\n\n我个人使用这个网站 `http://www.colorzilla.com/gradient-editor/`\
    \ 来创建渐变。我是通过搜索“gradient generator”发现它的，它是第一个搜索结果。\n\n图 10.9 – 这个“Ultimate CSS\
    \ 渐变器”对于创建各种类型的无图像渐变非常棒！\n\n![](img/00023.jpeg)这个网站很棒：\n\n* 它让你像使用图像编辑软件一样编辑渐变\n\
    * 你可以更改渐变的方向为垂直、水平、对角线以及径向\n* 它会为你生成 CSS，并且包含了常用浏览器的 CSS 声明，以及针对旧版 IE 浏览器的兼容解决方案\n\
    * 他们提供了预制的渐变\n* 最棒的是它为你节省了大量时间\n\n当你创建了满意的渐变后，只需复制 CSS 并将其粘贴到你的样式表中即可。\n\n## 不重复背景图像\n\
    \n上面我提到了一些创建背景效果的技巧。然而，可能会在某个时刻，你希望一个元素只有一张图片作为其背景。\n\n你可能希望图片出现在右下角。或者你可能希望标题在文本左侧有一张背景图像。\n\
    \n为了实现这一点，你需要像上面所述为元素指定一个背景图像。然而，我们需要声明背景不要重复。\n\n"
