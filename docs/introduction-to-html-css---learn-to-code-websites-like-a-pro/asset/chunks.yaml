    ![](images/00066.jpeg)Above is a screenshot of the Google Chrome developer tools
    and this is another reason why I love Chrome so much for coding websites.  After
    you right click and “inspect element” on an object. You can right click in the
    developer tools window and go to “force element state” followed by the state you
    want to see.


    This is great for testing your CSS, because as I mentioned before you can style
    all of these element states using CSS.


    ## Active


    Active refers to an active link.


    ## Hover


    Hover refers to a link or object that is being hovered over with the cursor.


    ## Focus


    Focus refers to an input element which is currently active.  For example when
    you''re filling out a form and you hit the tab button.  The next form field to
    get the blinking cursor in it is the field that has “focus”.


    ## Visited


    Visited refers to a link that you previously visited. 


    ### Styling Element States


    In order to style these element states you simply need to target the HTML element
    using either a class, id or other technique followed by a colon and the element
    state. 


    An example of this would be from the CSS sprite chapter where I specified the
    portion of the image to display for a regular social media icon versus a social
    media icon the user is hovered over.


    # Chapter 20: Handy Things To Consider


    There are a few CSS styles which make it into every stylesheet that I write for
    a number of reasons. We''ll go over those now.


    ## Handy Internet Explorer Style


    When you wrap an image with a link, Firefox and Google Chrome don''t have an issue
    with this.  However, for some reason, older versions of Internet Explorer absolutely
    LOVE to place an ugly blue border around all images wrapped in links.


    Figure 20.1 – Older versions of Internet Explorer used to place an ugly blue border
    around any images that are wrapped in links.  Using developer tools in Internet
    Explorer I was able to display the page as if it was rendered in an older version
    of Internet Explorer.  The red circle is around the area in the developer tools
    window in Internet Explorer where you can manipulate the display to reflect older
    browser versions.


    ![](images/00067.jpeg)Apparently, they fixed this issue in newer versions of Internet
    Explorer.  However when you hit F12 you can open the developer tools window. 
    I used the window to show what the website would look like using Internet Explorer
    8. 


    As you can see there is a blue border around the image.  In order to combat this
    I add the following style to EVERY stylesheet I write.


    a img


    {


                  border:0 none transparent;             


    }


    It targets all img (images) wrapped in an a (link).  In case you don''t understand
    the CSS declaration, the standard protocol for defining a border is “border: (width
    in pixels) (style:solid, dotted, dashed) (color);”.  So I specified a border 0
    pixels wide, no style and the color to be “transparent”.


    ## Global Resets


    So as I mentioned earlier, each HTML element has a default style attached to it. 
    Different browsers have a bit of leeway when deciding how each element should
    be displayed. 


    For this reason many people link to a CSS stylesheet known as a “reset”.  This
    stylesheet basically styles each element in a way which is uniform across all
    modern browsers.


    I don''t feel like this is necessary.  However I do use the following style in
    all my stylesheets.


    html, body


    {


                  margin:0;


                  padding:0;


    }


    Some people like to add “*” along with html and body.  The asterisk is what''s
    known as a “wild-cat” and basically targets EVERY element.  However, I feel that
    just denoting html and the body element is good enough.


    ## Default Link Hover Styles


    When you begin to get fancy with your link styling.  Don''t forget to style the
    “hover” state. 


    Oftentimes you''ll finish making a link look like a super cool button and then
    you''ll go to test it out and say...”oh crap, when I hover over this button the
    text turns blue and get''s an underline”.


    To combat this make sure you specify a font color for the hover state as well
    as specify “text-decoration: none;” if you don''t want there to be an underline.


