    image quality would drastically suffer but, the .jpg could be lowered in quality
    with minimal difference in the final product and still load extremely fast. 


    ### .PNG''s And .GIF''s


    .PNG''s and .GIF''s are best used when the image in question is based on areas
    of solid color rather than thousands of pixels of various color.


    Figure 11.3 – Since the image below is based off blocks of solid color a .png
    or .gif file extension would work best.


    ![](images/00029.jpeg)


    The picture above would be better suited to be saved as either a .gif or a .png. 
    If the image were to be animated it would most certainly be saved as a .gif because
    .gif''s support animation.


    Both .gif and .png support transparent objects, however .png is much better at
    transparency.


    You probably can''t tell by looking at the above picture however it has a transparent
    background.  When you try to save an object with a transparent background as a
    .jpg the transparent part will be turned white.


    Let''s do the same experiment as we did with the dog pictures.


    ![](images/00030.jpeg)As you can see, when trying to save the above image as a
    .jpg at 100% image quality the image will take more than twice the amount of time
    it would have taken the .gif and .png to load.  Not to mention the fact that the
    .gif and the .png will have transparency.


