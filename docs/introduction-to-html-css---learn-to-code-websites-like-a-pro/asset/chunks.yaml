    # Chapter 1: Start Here!


    I know what you''re thinking, “Oh, an introduction...SKIP!” However, I''d advise
    you not to skip this introduction because I''m not going to babble on about my
    qualifications or some heartfelt story about how my HTML/CSS book cured a dying
    man of his ailments.


    Rather, I just wish to give this book a little bit of context.


    As with most things in life, coding a website may seem extremely difficult from
    the outside looking in. However, once you know the tricks of the trade it''ll
    be a piece of cake for you.


    If you''ve taken a good look around on the internet then you may have noticed
    that there are many different styles of website. Everything from centered 1-page
    sites to websites with a sidebar navigation all the way to websites built entirely
    from Flash animations.


    I mention this because this brings up the point that there is more than one way
    to code a website. Which we will get to later in the book.


    ## Brief Intro To Website Design History


    Disclaimer: This brief history is only based on my own observations. Since this
    isn''t essential to the book I won''t waste any time looking up dates, gathering
    references or fact checking. You''ll simply have to take this at face value.


    The advent of the internet brought about very ugly websites. Originally website
    designers would rely on a very outdated technique of laying out their websites
    using what are known as “tables”. You may be familiar with tables because they
    are used in Microsoft Word.


    Essentially the tables would serve to segment content on the page and allow the
    user to have 2 & 3 column layouts which are still very much used today.


    Once this obsession with tables died down a bit, website designers then switched
    to laying out their websites using what are known as “divs”. A div is another
    HTML “tag” which allows users to segment content as they see fit.


    I should also mention that for a while there, Flash became extremely popular.
    Flash was loved by many because it allowed the designer to place objects wherever
    they wanted without code, to create amazing animations, and do things that simply
    weren''t possible using HTML, CSS or Javascript.


    This brings us to today. With the advent of HTML5 and CSS3 (the latest versions
    of HTML & CSS) website designers are able to create awesome animations and do
    things that were never possible in the past without either Flash animations or
    the usage of Javascript.


    Today, with the rising popularity of mobile and tablet devices, mobile website
    design as well as adaptive web design are becoming the new standard which will
    take us into the websites of the future.


    ## What I Hope To Accomplish With This E-book


    It is my hope that someone who is unfamiliar with HTML/CSS can pick up this e-book
    and use it to get a solid understanding of coding a website with HTML & CSS.


    I want to cover all the bases of HTML/CSS without going overboard. Please note
    that this subject is very vast and I will be covering a few of the things that
    are necessary to get started.


    Please note however, that I am extremely long winded. That being said, I know
    that this is supposed to be an introductory book but along the way I will be giving
    you some of the seeds of knowledge necessary to help you towards your second phase
    of website building.


    That''s when you graduate from coding a static page to full fledged responsive
    website design.


    There are many resources on the internet which can help you learn how to build
    a website. However, none of these resources will give you the edge that can only
    be gained by years of experience, hours of troubleshooting as well as yelling
    at your computer screen which I hope to impart on you.


    That being said let''s begin!


    # Chapter 2: Understanding HTML


    So they say that the difference between a master and a novice is that the master
    knows the tricks of the trade. It''s the tiny, subtle things that the master knows
    that gives him the edge over the novice.


    You may not know this, but anyone who has ever used a computer (even one without
    internet) has probably used and manipulated HTML.


    HTML means “HyperText Markup Language” FYI.


    If you have ever used Microsoft Word, then you have most likely come in contact
    with a multitude of HTML elements and you didn''t even realize it.


    These include:


    *   Headings (Heading 1 through Heading 6)

    *   Tables

    *   Ordered Lists (A list with numbered bullet points)

    *   Unordered Lists (This list is an example)

    *   Links (Surely you''ve encountered a Word document with a link to a website)


    I''m sure there are a few more examples but are the stand out elements which I
    knew most people would be familiar with.


    And, just like a Word document, a website can be extremely bland with no styling...or
    you can use your imagination and jazz it up a bit using fancy fonts, colored text,
    images, backgrounds, etc!


    Figure 2.1 – On the left is a website and on the right is the same website minus
    the CSS.


    ![](images/00001.jpeg)


    CSS stands for “Cascading Style Sheet” and when people refer to CSS they will
    often talk about the “stylesheet” which is the document containing the CSS code.
    As you can see above in Figure 2.1, on the left you have a website which consists
    of HTML & CSS. And on the right you have the EXACT SAME WEBSITE, however I deleted
    the stylesheet.


    The HTML includes all of the elements that are on the page IE: the pictures, the
    words, the links, etc. and the CSS is the code that the website designer uses
    to denote the color, orientation, font, etc.


    As you can see the website on the right (minus the CSS) looks very much like something
    you could create in Microsoft Word.


    And much like Microsoft word elements, each HTML element comes preset with styles.

