  trans: "\n我发现，有些谷歌字体，尤其是 Oswald，在使用中等字重时，只会显示字体的上半部分。\n\n图 15.3 – 下面是一个使用中等字重 Oswald\
    \ 字体的枪支博客。文本只显示了上半部分。\n\n![](img/00058.jpeg)\n\n如果你碰巧注意到这个问题，可以通过使用不同的字重来解决。不过，要知道你之所以注意到这个故障，是因为你的电脑上安装了该字体，而大多数互联网用户不会遇到这个问题……除非他们也是网页设计师。截至目前，我认为这个问题主要出现在\
    \ Firefox 浏览器中。\n\n# 第 16 章：语义化代码\n\n语义化代码，本质上就是确保你编写的代码对任何想要使用它的人来说都易于理解。\n\n\
    过去（包括我在内的一些人现在仍在使用这种方法），人们会用 `div` 来布局网站，并根据功能给 `div` 添加类名。这些 `div` 会被命名为 `header`、`nav`、`sidebar`、`footer`\
    \ 等。\n\n然而，随着 HTML5 的出现，新的“类 `div`”元素应运而生。这些新的 HTML5 元素在功能上与 `div` 完全相同，但更具语义化，因为它们是根据功能命名的。\n\
    \n这些新元素包括 `header`、`nav`、`aside`、`section`、`article`、`summary`、`details` 和 `footer`。由于旧版本的\
    \ Internet Explorer 不识别这些元素，人们通常会在文档的 `head` 中添加以下代码来解决这个问题。\n\n```html\n<!--[if\
    \ lt IE 9]>\n    <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>\n<![endif]-->\n```\n\n你可能还记得，之前我让你搭建的 HTML5 文档中就包含了上述代码。\n\n## 编写语义化代码\n\
    \n在编写网站时，我建议你始终将语义化代码的概念牢记在心。你永远不知道，你过去开发的网站将来是否会有其他人接手。\n\n为了确保你的网站易于理解，请务必：\n\
    \n*   在给 HTML 元素分配类名和 `id` 时使用有逻辑的名称\n*   使用上述 HTML5 元素来标记文档的重要部分\n*   在必要时使用\
    \ HTML 和 CSS 注释，以帮助他人理解文档中的内容\n\n### HTML 与 CSS 注释\n\nHTML 和 CSS 注释可以帮助你梳理混乱的\
    \ HTML 和 CSS 文档，并让你更好地理解代码。\n\n![](img/00059.jpeg)\n\nHTML 注释的格式如下图所示。上面你会看到一个非常老式的布局，这是一个用表格布局的网站示例。\n\
    \n自那时起，HTML 技术已经取得了长足的进步。然而，编写 HTML 注释的格式仍然相同。在 CSS 中编写注释的格式如下图所示。\n\n![](img/00060.jpeg)\n\
    \n上图中高亮显示的是 CSS 注释。我认为，当你的网站中有某个特定区域对应了一大块 CSS 样式时，CSS 注释非常有用。你可以在代码块的开头和结尾放置\
    \ CSS 注释，让其他人知道这些样式的用途。\n\n# 第 17 章：使用颜色\n\n大多数情况下，当你需要指定颜色时，会使用十六进制系统。下面可以看到指定这些颜色的格式。\n\
    \n![](img/00061.jpeg)\n\n顾名思义，十六进制颜色基于 6 位数字/字母。十六进制颜色中使用的字符范围是 `a-z` 和 `0-9`。较小的数字表示较暗的颜色，较大的数字表示较亮的颜色。\n\
    \n这是因为计算机颜色基于加色系统。也就是说，颜色是通过添加光来产生的。每种颜色添加的光越多，颜色就越亮。\n\n在上图中，你可以看到黑色的颜色代码。可以看到，红色、绿色和蓝色均为\
    \ 0，结果就是黑色屏幕。而全红、全绿和全蓝则会得到白色。\n\n同样在上图中，你可以看到，如果 6 位颜色代码由三组相同的字符组成，则可以转换为 3 位颜色代码。例如，`#330011`\
    \ 可以简写为 `#301`，`#999999` 可以简写为 `#999`，`#FFFFFF` 可以简写为 `#FFF`。但是，`#030303` 或 `#996500`\
    \ 不能简写。\n\n本质上，数字 `0-9` 表示颜色从低到高的级别。等量的红、绿、蓝会产生白色、黑色或灰色调。`#000000` 表示黑色，因为它使用了等量的（零）红、绿、蓝；而\
    \ `#FFFFFF` 表示白色，因为它使用了等量的（F 在此处可能代表“全”）红、绿、蓝。\n\n此外，你可以通过将一种颜色设为全值，另外两种颜色设为零来获得纯红、纯绿或纯蓝。例如，要指定红色，你可以使用\
    \ `#FF0000`（或 `#F00`），表示全红、0 绿、0 蓝。显然，红、绿、蓝还有更多色调，但这适用于你想使用每种颜色的最纯形式时。\n\n## 十六进制颜色的使用\n\
    \n十六进制颜色代码最常见的用途之一是指定字体颜色。你可以通过 CSS 声明 `color: #000000;` 来实现，其中 `#000000` 是你选择的颜色。\n\
    \n指定颜色的其他用途还包括指定背景颜色（`background-color: #000000`），以及指定边框颜色（`border: 1px solid\
    \ #000000;`）。\n\n## RGB 颜色代码\n\n有时，你需要使用 RGB 颜色系统来指定颜色。这种情况比十六进制系统少得多。\n\n需要使用\
    \ RGB 的情况主要出现在新的 CSS3 声明中，例如指定不透明度时，你需要使用 `RGBA` 代码，后跟使用十进制系统的不透明度值。或者指定 CSS3\
    \ 渐变时。\n\n我不会详细说明何时使用它们，因为当需要时，你可以通过快速谷歌搜索轻松找到使用方法。\n\n指定 RGB 颜色的方式如下：\n\n![](img/00062.jpeg)\n\
    \n每个数字可以是 `0-255` 之间的任意值。`0` 表示无，`255` 表示全值。规则与十六进制相同。例如，`rgb(255,0,0)` 是纯红色，`rgb(25,25,25)`\
    \ 是某种浅灰色。\n\n## 不透明度：RGBA 颜色代码\n\n借助 HTML5 和 CSS3，我们现在有了声明不透明度的选项。`RGBA` 本质上与\
    \ `RGB` 声明相同，但多了一个要声明的对象，即不透明度。不透明度级别从 `0.0` 到 `1.0`。`0.0` 表示 0%，`1.0` 表示 100%。格式如下所示。\n\
    \n![](img/00063.jpeg)\n\n## 按名称指定颜色\n\n最近，你可以按名称指定颜色了。不过，这对 CSS3 来说还比较新，我还没有习惯使用它，也从未用过。\n\
    \n更正一下，我只在将颜色指定为 `transparent`（即无色）时使用它。\n\n如果你愿意，可以试试看并熟悉它！正如我之前提到的，在 HTML/CSS\
    \ 中，解决问题的方法不止一种！\n\n### 从设计稿中获取正确的颜色\n\n在 Photoshop 中创建设计稿后，你需要获取正确的颜色以在 CSS 中指定。幸运的是，这非常容易。\n\
    \n只需使用吸管工具拾取颜色，然后双击弹出的前景色（这应该就是你选择的颜色）。弹出的对话框会同时显示十六进制颜色代码以及用于 `rgb` 颜色代码的红、绿、蓝级别。\n\
    \n图 17.1 – 在 Photoshop 中，你可以使用颜色选择器窗口来确定要在 CSS 文档中指定的十六进制或 RGB 颜色代码。\n\n![](img/00064.jpeg)\n\
    \n# 第 18 章：CSS 精灵\n\n使用的图片越多，图片尺寸越大，网站加载速度就越慢。\n\n"
- fmt: "\n# CSS Sprites\n\nIn order to combat this phenomena, some people utilize\
    \ a concept known as CSS sprites. A CSS sprite is when you have multiple images\
    \ in one image. So rather than loading a bunch of tiny images the browser has\
    \ to load 1 slightly larger image which results in faster load time. Normally\
    \ these sprites are `PNG` format because `PNG`'s support superior transparency\
    \ capabilities.\n\nI love to use CSS sprites when dealing with social media icons.\n\
    \nFigure 18.1 – Below is an image that I setup to be used as a CSS sprite image.\
    \ Notice the rulers are visable and the guides are being used. This makes it easier\
    \ for me to use actual coordinates in my CSS declarations.\n\n![](images/00065.jpeg)\n\
    \nAbove you'll see an example of a CSS sprite image that I created. I created\
    \ black and white versions of the same social media icons as well as red versions\
    \ which would be used when the user hovers over the icons.\n\nAs you'll notice\
    \ I made use of the Photoshop guides and the ruler is set to pixels. This is important\
    \ because these coordinates will be of use to us later.\n\n## Using CSS Sprites\n\
    \nTo use a CSS sprite you need to specify how tall and wide the image will be\
    \ then you must specify the background image plus the coordinates (from the left\
    \ as well as top of the image).\n\n```css\n.social\n{\n    height:65px;\n    width:65px;\n\
    \    display:block;\n    float:left;\n    margin:0 5px 10px 0;\n}\n```\n\nAs you\
    \ can see above, I gave the links which will be my social media CSS sprites a\
    \ class of `.social`. Then I proceeded to give each a height and width of 65 pixels.\
    \ I said for the links to display `block` because otherwise a link would be an\
    \ inline element.\n\nEach link will float left so that they will line up next\
    \ to each other left to right, and then I specified a margin.\n\nThen each individual\
    \ symbol needed to specify the background as well as the coordinates.\n\n```css\n\
    .fbblack\n{\n    background:url(../images/socialsprite.png) 0 0;\n}\n```\n\nAbove\
    \ you'll see the CSS for the black Facebook icon. The `0 0` means that the image\
    \ begins 0 pixels from the left as well as 0 pixels from the top.\n\n```css\n\
    .twblack\n{\n    background:url(../images/socialsprite.png) -65px 0;\n}\n```\n\
    \nAbove you'll see the CSS for the black Twitter icon. The `-65px 0` means that\
    \ the image begins 65 pixels from the left and 0 from the top.\n\nAnd finally\
    \ I specified a “hover state” for each of the icons. I'll show you how I did that\
    \ and we'll talk about element states next!\n\n```css\n.fbblack:hover, .fbwhite:hover\n\
    {\n    background:url(../images/socialsprite.png) 0 -130px;\n}\n```\n\nAbove is\
    \ the hover state for the black Facebook icon as well as the white Facebook icon.\
    \ I made the graphic so that both white and black social media icons would have\
    \ a red hover state, which is why both of these use the same background image\
    \ and CSS sprite coordinates.\n\nAs you can see above, the red hover state is\
    \ 0 pixels from the left and 130 pixels from the top.\n\nThis topic may be confusing\
    \ to some so don't be afraid to do a little bit of your own research as well as\
    \ experimentation to learn more. I mostly wanted to tell you about this technique\
    \ so you'd have it as part of your arsenal.\n\n# Chapter 19: Element States\n\n\
    Interactive elements such as links and inputs (search bars, text boxes, etc) have\
    \ what are known as different “states”.\n\nBecause of this, you are able to style\
    \ the “state” of each element using CSS.\n\nBefore I confuse you any further the\
    \ states I'm referring to are:\n\n* Active\n* Hover\n* Focus\n* Visited\n\nFigure\
    \ 19.1 – When you write click an element inside the Developer Tools window in\
    \ Google Chrome you can “force an element state” that is, cause an element to\
    \ behave as if it is displaying a state of your choice. This is useful when trying\
    \ to style a specific element state.\n\n![](images/00066.jpeg)\n\nAbove is a screenshot\
    \ of the Google Chrome developer tools and this is another reason why I love Chrome\
    \ so much for coding websites. After you right click and “inspect element” on\
    \ an object. You can right click in the developer tools window and go to “force\
    \ element state” followed by the state you want to see.\n\nThis is great for testing\
    \ your CSS, because as I mentioned before you can style all of these element states\
    \ using CSS.\n\n## Active\nActive refers to an active link.\n\n## Hover\nHover\
    \ refers to a link or object that is being hovered over with the cursor.\n\n##\
    \ Focus\nFocus refers to an input element which is currently active. For example\
    \ when you're filling out a form and you hit the tab button. The next form field\
    \ to get the blinking cursor in it is the field that has “focus”.\n\n## Visited\n\
    Visited refers to a link that you previously visited.\n\n### Styling Element States\n\
    \nIn order to style these element states you simply need to target the HTML element\
    \ using either a class, id or other technique followed by a colon and the element\
    \ state.\n\nAn example of this would be from the CSS sprite chapter where I specified\
    \ the portion of the image to display for a regular social media icon versus a\
    \ social media icon the user is hovered over.\n\n# Chapter 20: Handy Things To\
    \ Consider\n\nThere are a few CSS styles which make it into every stylesheet that\
    \ I write for a number of reasons. We'll go over those now.\n\n## Handy Internet\
    \ Explorer Style\n\nWhen you wrap an image with a link, Firefox and Google Chrome\
    \ don't have an issue with this. However, for some reason, older versions of Internet\
    \ Explorer absolutely LOVE to place an ugly blue border around all images wrapped\
    \ in links.\n\nFigure 20.1 – Older versions of Internet Explorer used to place\
    \ an ugly blue border around any images that are wrapped in links. Using developer\
    \ tools in Internet Explorer I was able to display the page as if it was rendered\
    \ in an older version of Internet Explorer. The red circle is around the area\
    \ in the developer tools window in Internet Explorer where you can manipulate\
    \ the display to reflect older browser versions.\n\n![](images/00067.jpeg)\n\n\
    Apparently, they fixed this issue in newer versions of Internet Explorer. However\
    \ when you hit `F12` you can open the developer tools window. I used the window\
    \ to show what the website would look like using Internet Explorer 8.\n\nAs you\
    \ can see there is a blue border around the image. In order to combat this I add\
    \ the following style to EVERY stylesheet I write.\n\n```css\na img\n{\n    border:0\
    \ none transparent;\n}\n```\n\nIt targets all `img` (images) wrapped in an `a`\
    \ (link). In case you don't understand the CSS declaration, the standard protocol\
    \ for defining a border is `border: (width in pixels) (style:solid, dotted, dashed)\
    \ (color);`. So I specified a border 0 pixels wide, no style and the color to\
    \ be `transparent`.\n\n## Global Resets\n\nSo as I mentioned earlier, each HTML\
    \ element has a default style attached to it. Different browsers have a bit of\
    \ leeway when deciding how each element should be displayed.\n\nFor this reason\
    \ many people link to a CSS stylesheet known as a “reset”. This stylesheet basically\
    \ styles each element in a way which is uniform across all modern browsers.\n\n\
    I don't feel like this is necessary. However I do use the following style in all\
    \ my stylesheets.\n\n```css\nhtml, body\n{\n    margin:0;\n    padding:0;\n}\n\
    ```\n\nSome people like to add `*` along with `html` and `body`. The asterisk\
    \ is what's known as a “wild-cat” and basically targets EVERY element. However,\
    \ I feel that just denoting `html` and the `body` element is good enough.\n\n\
    ## Default Link Hover Styles\n\nWhen you begin to get fancy with your link styling.\
    \ Don't forget to style the “hover” state.\n\nOftentimes you'll finish making\
    \ a link look like a super cool button and then you'll go to test it out and say...”oh\
    \ crap, when I hover over this button the text turns blue and get's an underline”.\n\
    \nTo combat this make sure you specify a font color for the hover state as well\
    \ as specify `text-decoration: none;` if you don't want there to be an underline.\n\
    \n## Default Font\n"
