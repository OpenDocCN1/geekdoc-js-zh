    \n# 第 12 章：操控 HTML 对象的布局\n\n在设计一个你想要外观的网站时，知道如何将对象放置在你想要的地方是非常重要的。\n\n然而，为了做到这一点，你必须首先了解一点\
    \ HTML 对象的行为模式。HTML 对象要么被视为“行内”（inline）或“块级”（block）元素。\n\n## 行内元素与块级元素\n\n为了说明行内元素和块级元素之间的区别，我将在空白页面上创建不同的\
    \ HTML 元素，然后使用 Google Chrome 的“检查元素”选项对它们进行检查。\n\n图 12.1 —— 我在页面顶部的 `H1` 标签上点击“检查元素”，向你展示块级元素会占据尽可能多的水平空间。尽管文本本身只利用了页面的\
    \ 1/16，但它仍然导致下方的元素被放置在下一行。\n\n![](img/00036.jpeg)\n\n这很难辨认，但我用块级元素和几个行内元素填充了页面。\n\
