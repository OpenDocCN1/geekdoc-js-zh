    every step of the way.

    *   `Notepad++` - This is a free, open source download that is essentially a simple
    text editor with a few features which will make your life easier.

    *   `TextWrangler` – Similiar to `Notepad++` but is Mac only and not open source.


    ## What Is The Deal With Code Editors???


    If you''re completely new to code. Then you may be asking yourself, “how is the
    code editor that I use important in anyway?”


    Basically, the code editor that you use can make your life easier. And you yourself
    can make your own life easier by paying attention to the tips that I''ll give
    you in the chapter about “semantic” code.


    Back to the topic at hand, the editor that you use can help you in a number of
    ways.


