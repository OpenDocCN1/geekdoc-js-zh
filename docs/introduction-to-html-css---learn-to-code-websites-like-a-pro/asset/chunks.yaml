    静态网站设计与响应式网站设计的一个区别在于，在响应式设计中，你需要指定屏幕宽度应该是网站的宽度。


    你通过在文档的 `head` 部分添加一个声明来实现这一点。在此声明中，你还可以指定用户是否可以缩放以及缩放程度。


    ```html

    <meta name="viewport" content="width=device-width, initial-scale=1">

    ```


    上述是这些声明之一的示例。


    ## 指定宽度


    在静态网站设计中，当我们创建一个 2 列布局时，我们会考虑列的像素宽度是多少并创建它们。然而，当涉及到响应式设计时，静态宽度是不够的。


    当你希望对象的宽度随浏览器窗口的宽度变化时，必须使用百分比来指定宽度。


    这样，无论设备宽度是 1,200 像素还是 350 像素，你的网站都能保持比例。


    ## 响应式图片


    图片的宽度同样重要，因为随着屏幕变小，你的图片显然不能保持全分辨率，否则你的最终用户必须在手机上滚动才能看到整张图片。


    为了缓解这一点，你需要指定 100% 或更小的宽度或最大宽度。高度可以通过简单地指定宽度为“auto”来自动调节。也就是说，相对于当前宽度的自动高度。


    ## 响应式字体


    显然，当屏幕很宽时，所有的 `Heading 1` 元素都可以很大，但当你在较小的屏幕上查看同一个网站时，该标题可能会占据整个屏幕。


    由于这不是构建网站最美观的方式，有些人喜欢使用 `em` 而不是像素来指定字体大小。


    我个人来说并不喜欢这样做，所以我将使用下一个主题来解决这个问题。


    ## 响应式导航


    显然，当你的屏幕宽度达到 1,000 像素以下时，你就不能再拥有宽大的导航栏了。在某个时刻，浏览器的宽度将窄到无法支持你的导航栏。


    然而，不要担心，因为有多种响应式导航解决方案可供选择。你只需要 Google 搜索一下即可！


    ## 断点与媒体查询


    接下来的这两个主题是密不可分的。我还会提到，如果你打算进行响应式 Web 设计，你**需要**下载一个分辨率插件。也就是说，一个能告诉你在任何给定浏览器窗口宽度的插件。


    这是因为当你处理响应式网站时，随着你缩小浏览器窗口，你需要确切知道网站**什么时候**开始看起来很奇怪。


    然后你就可以底气地说：“好的，当网站宽度小于 1,000 像素时，这个对象就会错位。”这就是所谓的“断点”。


    然后你可以指定一个“媒体查询”，它说：当浏览器窗口宽度小于 1,000 像素时，执行此操作。显然，这可以是你想要的任何内容，因为你将使用 CSS 来实现你的意愿。


    媒体查询的工作方式是你可以说：当浏览器低于此宽度时执行此操作，当浏览器高于此宽度时执行此操作，或者当浏览器处于此宽度之间时执行此操作。


    当浏览器低于此宽度时执行此操作。


    ```css

    @media only screen and (max-width : 320px) {

    /* 样式写在这里 */

    }

    ```


    当浏览器高于此宽度时执行此操作。


    ```css

    @media only screen and (min-width : 321px) {

    /* 样式写在这里 */

    }

    ```


    当浏览器低于此宽度且高于此宽度时执行此操作。


    ```css

    @media only screen and (min-device-width : 768px) and (max-device-width : 1024px){

    /* 样式写在这里 */

    }

    ```


    ### 需要记住的


    记住，媒体查询应该放在 CSS 文档的末尾，因为在 CSS 中，底部的内容比文档顶部的内容优先级更高。


    随着浏览器窗口变小，与该浏览器宽度相关的媒体查询将开始生效，而适用于较宽屏幕的 CSS 样式将回退。


    如果你遇到一个特别困难且不起的 CSS 样式，而且你尝试了所有方法并经过了“开发者工具”研究，那么你可以在 CSS 样式声明的分号之前添加 `!important`。`!important`
    让 CSS 样优先级高于任何其他继承样式。


    ## 第 26 章：网站图标 (Favicon)


    网站的锦上添花是网站图标。也就是与你的网站关联的 16x16 像素的小图像，当有人将你的网站添加到收藏夹时，它会随你的网站标题一起保存。


    要创建网站图标，只需在 Photoshop 或你选择的图像编辑软件中创建一个 16x16 像素的文档。创建一个代表你网站的图标。由于你需要将文件保存为 `.png`，因此你的网站图标可以是透明的。


    我随后使用 `http://favicon-generator.org/` 来生成我的网站图标。我将生成的文件保存在网站的根目录下。图标扩展名是 `.ico`，图标生成网站还会提供将图标附加到你网站所需的代码。该代码放在文档的
    `head` 中。


    图 26.1 – 这个网站自我第一次使用它以来发生了变化。然而，在创建网站图标时，请确保选择“Generate only 16x16 favicon.ico”。这可以避免你下载不需要的无。


