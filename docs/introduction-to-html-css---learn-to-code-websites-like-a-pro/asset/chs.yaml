- "# HTML & CSS 入门指南 - 像专业人士一样学习编写网站代码\n\n\n\n![](img/00071.jpeg)\n\n\n\n\n\n# 第 1\
  \ 章：从这里开始！\n\n我知道你在想什么，\"哦，又是介绍...跳过！\"但是，我建议你不要跳过这个介绍，因为我不会在这里吹嘘我的资历，也不会讲什么感人的故事，说我的\
  \ HTML/CSS 书是如何治愈了一个临终之人的疾病。\n\n相反，我只是想给这本书一点背景。\n\n就像生活中的大多数事情一样，从外面看，编写网站似乎非常困难。然而，一旦你知道了这行的诀窍，它就会变得轻而易举。\n\
  \n如果你在互联网上仔细观察，你可能会注意到网站有许多不同的风格。从居中的单页网站到带有侧边栏导航的网站，再到完全用 Flash 动画构建的网站。\n\n我提到这一点是因为这引出了一个观点：编写网站有不止一种方法。我们将在本书后面讨论这个问题。\n\
  \n## 网站设计历史简介\n\n免责声明：这个简要历史仅基于我个人的观察。由于这对本书来说不是必需的，我不会浪费时间去查找日期、收集参考资料或核实事实。你只能姑且相信这些内容。\n\
  \n互联网的出现带来了非常丑陋的网站。最初，网站设计师依赖一种非常过时的技术来布局他们的网站，即使用所谓的\"表格\"。你可能对表格很熟悉，因为它们在 Microsoft\
  \ Word 中也有使用。\n\n基本上，表格用于分割页面上的内容，并允许用户使用 2 列和 3 列布局，这种布局至今仍在广泛使用。\n\n一旦这种对表格的狂热稍微消退，网站设计师就转而使用所谓的\"\
  div\"来布局他们的网站。div 是另一个 HTML\"标签\"，它允许用户根据自己的需要分割内容。\n\n我还应该提到，有一段时间，Flash 变得非常流行。Flash\
  \ 受到很多人的喜爱，因为它允许设计师无需代码就能将对象放置在任何想要的位置，创建惊人的动画，并实现使用 HTML、CSS 或 Javascript 根本无法实现的功能。\n\
  \n这把我们带到了今天。随着 HTML5 和 CSS3（HTML 和 CSS 的最新版本）的出现，网站设计师能够创建出色的动画，并实现过去只有在 Flash 动画或使用\
  \ Javascript 的情况下才可能实现的功能。\n\n如今，随着移动设备和平板电脑的日益普及，移动网站设计以及自适应网页设计正在成为新的标准，这将把我们带入未来的网站世界。\n\
  \n## 我希望通过这本电子书实现的目标\n\n我希望任何一个不熟悉 HTML/CSS 的人都能拿起这本电子书，并用它来获得使用 HTML 和 CSS 编写网站的坚实理解。\n\
  \n我想涵盖 HTML/CSS 的所有基础知识，但不会过于深入。请注意，这个主题非常广泛，我将覆盖入门所需的一些必要内容。\n\n但请注意，我是一个非常啰嗦的人。也就是说，我知道这应该是一本入门书籍，但在过程中我会给你一些必要的知识种子，帮助你进入网站建设的第二阶段。\n\
  \n那时你将从编写静态页面毕业到完整的响应式网站设计。\n\n互联网上有很多资源可以帮助你学习如何构建网站。然而，这些资源都不会给你那种只有通过多年经验、长时间的故障排除以及对着电脑屏幕大喊大叫才能获得的优势，我希望把这些传授给你。\n\
  \n话虽如此，让我们开始吧！\n\n# 第 2 章：理解 HTML\n\n他们说，大师和新手的区别在于大师知道这行的诀窍。正是大师所知道的那些微小而微妙的东西让他比新手更有优势。\n\
  \n你可能不知道，但任何使用过电脑的人（即使没有互联网）可能都使用过和操作过 HTML。\n\nHTML 代表\"超文本标记语言\"，顺便说一句。\n\n如果你使用过\
  \ Microsoft Word，那么你很可能接触过大量的 HTML 元素，而你甚至没有意识到。\n\n这些包括：\n\n*   标题（标题 1 到标题 6）\n\
  *   表格\n*   有序列表（带有编号的项目符号的列表）\n*   无序列表（这个列表就是一个例子）\n*   链接（你肯定遇到过带有网站链接的 Word\
  \ 文档）\n\n我确信还有更多的例子，但这些是我认为大多数人都熟悉的突出元素。\n\n而且，就像 Word 文档一样，网站可以非常平淡，没有任何样式...或者你可以发挥想象力，使用花哨的字体、彩色文本、图片、背景等来让它变得更有趣！\n\
  \n图 2.1 - 左边是一个网站，右边是同一个网站但去掉了 CSS。\n\n![](img/00001.jpeg)\n\nCSS 代表\"层叠样式表\"，当人们提到\
  \ CSS 时，他们通常会谈论\"样式表\"，即包含 CSS 代码的文档。正如你在上面的图 2.1 中看到的，左边是一个由 HTML 和 CSS 组成的网站。而在右边，你有完全相同的网站，但是我删除了样式表。\n\
  \nHTML 包含页面上所有的元素，即：图片、文字、链接等，而 CSS 是网站设计师用来指定颜色、方向、字体等的代码。\n\n正如你所看到的，右边的网站（去掉\
  \ CSS 后）看起来非常像你可以在 Microsoft Word 中创建的东西。\n\n而且，就像 Microsoft Word 的元素一样，每个 HTML\
  \ 元素都带有预设的样式。\n\n\n\n\n例如，如果你选取一个单词并将其链接到网站，它会变成蓝色并带有下划线。如果你开始输入，文字将从文档左上角开始，使用\
  \ Times New Roman 字体并采用 12 字体。\n\n我之所以在 Microsoft Word 中提到链接和段落样式属性，是因为它们与“无样式”HTML\
  \ 元素的默认外观几乎是完全一样的。\n\n# 第 3 章：理解 CSS\n\n正如我上面提到的，CSS 代表层叠样式表（Cascading Style Sheets）。作为一名初级网站设计师/开发者，你将使用它来为你的网站增添一些色彩。\n\
  \n它是你将使用的工具，可以将一个看起来像最丑 Word 文档的页面转变为精美且具有交互性的艺术品！\n\n正如我之前提到的，所有的 HTML 元素都有它们的默认样式。\n\
  \n链接看起来像这样。\n\n段落和其他无样式文本默认使用 Times New Roman（或 Macintosh 的等效字体）16 字体。\n\n*   无序列表\n\
  *   最终看起来像\n*   这样。\n\n你的责任是利用 CSS 按照你的喜好对这些元素进行样式化处理。\n\n## 你用 CSS 可以做什么\n\n* \
  \  更改页面背景（许多选项，包括平铺图像、渐变、图像/背景颜色组合、纯色等）\n*   更改元素的方向/位置\n*   更改字体、字体大小、字体颜色\n* \
  \  为元素提供背景图像\n\n老实说，使用 CSS 在网站上进行视觉化处理所能做的事情几乎没有限制。随着 CSS3 的出现，你还可以做各种酷炫的事情，例如创建用户悬停在元素上时触发的动画、元素的圆角、文本阴影等！\n\
  \n# 第 4 章：在何处编写代码\n\n在我们继续这段旅程之前，我们必须讨论你将使用什么来编写你所设计的网站代码。\n\n我个人使用 Dreamweaver\
  \ 进行我所有的编码。这并不是我个人的建议。我之所以主要使用它是因为它是 Adobe Creative Suite 附带的，而我个人使用它是因为我的职业需要。\n\
  \n然而，你可以使用电脑自带的标准文本编辑器编辑几乎任何种类型的代码。\n\n在基于 Windows 的电脑上，你可以使用 `Notepad` 来编写、查看或编辑几乎任何你想要操作的计算机代码。在\
  \ Mac 上，等效程序是 `TextEdit`。\n\n疯狂的是，你电脑上最简单的程序竟然给了你编写最美观网站的能力。\n\n本质上，你使用的代码编辑器并不重要。如果你使用简单的代码编辑器，那么你就有潜力在编写代码方面变得更加精通，因为你没有任何拐杖可以依靠。\n\
  \n如果你花时间用简单的文本编辑器编写代码，你最终很可能不得不参考你编写的每一行代码，或者将代码背入心心。\n\n## 免费代码编辑器\n\n虽然背诵代码会让你成为一名卓越的网站开发者，但这本书的目的并不是阻碍你开始接触\
  \ HTML/CSS。\n\n因此，如果你没有机会使用付费程序，我会给你提供几个你可以使用的选项。\n\n当然，当你读到这本电子书时，可能会有更多选项，所以不要害怕\
  \ Google 搜索！\n\n*   `Notepad`（Mac 上的 `TextEdit`） - 无装饰的文本编辑器。准备好在每一步都 Google 搜索。\n\
  *   `Notepad++` - 这是一个免费的开源下载程序，本质上是一个带有几个让你的生活变得更简单的功能的简单文本编辑器。\n*   `TextWrangler`\
  \ – 与 `Notepad++` 类似，但仅限 Mac 且不是开源。\n\n## 代码编辑器到底是怎么回事？？？\n\n如果你对代码完全是新手，那么你可能会问自己：“我使用的代码编辑器在任何方面有什么重要？”\n\
  \n基本上，你使用的代码编辑器可以让你的生活变得更轻松。通过我在关于“语义化”代码章节中给你的提示，你自己也可以让自己的生活变得更轻松。\n\n回到当前主题，你使用的编辑器可以从许多方面帮助你。\n\
  \n例如，请查看图 4-1。你正在看的语言是 CSS。你可能看不出来，但我决定针对 HTML 文档的 `body`。然后我决定目标是该 `body` 的 `background-color`。\n\
  \n互联网上的颜色通常基于十六进制系统，每个颜色标记都以一个井号（#）开头。例如，“#ffffff”代表白色。（我们稍后会详细介绍。）\n\n图 4.1 – 我开始指定背景颜色，弹出一个辅助窗口帮助我选择颜色。\n\
  \n![](img/00002.jpeg)\n\n但如你所见，一旦我开始输入井号，一个得力助手就会弹出来帮助我选择颜色。\n\n这只是你所选择的文本编辑器如何帮助你完成工作的一个例子。\n\
  \n本质上，最好的文本编辑器可以帮助你记住代码片段，帮助你保持代码整洁，并在你忘记核心代码部分时提供帮助。\n\n# 第 5 章：浏览器\n\n我知道你急于开始学习构建网站，然而，浏览器这个主题是这个拼图中最重要的部分之一。\n\
  \n网络浏览器简单来说是你选择的门户，帮助你查看被称为“互联网”的奇产物。\n\n![](img/00003.jpeg)\n\n正如你选择的编写代码的程序可以帮助你获得优势一样，你的浏览器也是如此。\n\
  \n截至今天，最流行的浏览器是 Internet Explorer、Firefox、Chrome 和 Safari。\n\n## 为什么浏览器很重要？\n\n\
  如果你将编写网站，在多个浏览器中测试你的网站是非常重要的。\n\n并不是每个浏览器都以相同的方式显示字体，某些浏览器对显示特定对象有不同的协议。\n\n正如我之前提到的\
  \ Microsoft Word 对某些对象有特定的样式。每个浏览器也对不同的 HTML 元素遵循某些样式。\n\n虽然每个浏览器对每个元素的样式几乎相同，但浏览器之间存在细微差异，这会破坏你的布局。\n\
  \n通常问题浏览器会是 Internet Explorer。这是因为 Microsoft 在渲染 HTML 元素的方式上遵循另一套规则。\n\n你可能认为这并不是一个问题，因为你个人使用\
  \ Chrome、Firefox 或 Safari。\n\n在现实中，你并不知道大多数人从不升级电脑自带的默认浏览器。由于大多数人使用 Windows，这意味着大多数人不仅使用\
  \ Internet Explorer，而且其中很大一部分人使用的是过期的 Internet Explorer 版本。\n\n直到最近几年，Internet Explorer\
  \ 才跟上现代浏览器世界，开始承认现代网站设计技术并在自己的浏览器中渲染新的网站设计功能。\n\n这意味着全球很大一部分互联网用户正在使用完全过时的（缺乏更好的词汇）不兼容的浏览器查看网站。\n\
  \n这让编写 HTML/CSS 变得超级有趣！！！（反讽）\n\n## 应该下载哪些浏览器\n\n我个人建议下载的浏览器有：\n\n*   Internet Explorer\n\
  *   Firefox\n*   Chrome\n\n如果你是 Windows 用户并担心没有 Safari，不用担心。Google Chrome 使用一个名为\
  \ `WebKit` 的开源网页浏览系统，这正是 Safari 使用的。把 `WebKit` 这个词记在脑子里，因为当我们开始使用 CSS 编码时会遇到它。\n\
  \n如果你是 Mac 用户，你应该下载 Internet Explorer，以便确保你的网站在 Windows 上按预期运行。\n\n通过上述提到的所有浏览器，你将对你的网站在众多的互联网用户中的表现有一个相当大致的了解。\n\
  \n\n\n\n## 某些互联网浏览器的优势\n\n每当我准备开始一段高强度的编码工作时，我都会打开谷歌浏览器。\n\n图 5.1 – 我右键点击了损坏的图片，然后选择“检查元素”来查看问题所在。\n\
  \n![](img/00004.jpeg)这是因为谷歌浏览器拥有更直观、更友好的代码诊断能力。\n\n在上图中，你会看到“广告位”框内有 4 张损坏的图片。在谷歌浏览器中，如果我看到一个元素行为异常，我只需右键点击，然后选择“检查元素”。\n\
  \n图 5.2 – 点击“检查元素”后，这个窗口会弹出并提供一些有用的信息。\n\n![](img/00005.jpeg)\n\n一旦我点击“检查元素”，这个非常有用的“开发者工具”窗口就会弹出。\n\
  \n角落里的红色“x”和数字让我知道文档中本应附带的文件缺失了。\n\n我可以看到，那些没有显示的图片是由于路径错误导致的。\n\n我想快速提几点：\n\n1.\
  \ 几乎所有现代浏览器都有某种“开发者工具”选项，但我个人认为谷歌浏览器的版本最有用且最容易使用。谷歌浏览器的开发者工具窗口也很酷，因为它允许你直接在开发者工具窗口中编辑\
  \ HTML 和 CSS，这样你就可以在实际应用到网站之前先试验代码。\n\n2. 如你所见，当我“检查元素”时，右侧面板会显示与该元素相关的所有 CSS 样式。如果某个样式我写错了，开发者工具窗口会通过在该\
  \ CSS 规则上划一条斜线来提示我。这让我知道该 CSS 语句当前未被使用，因为写错了。\n\n3. 这些开发者工具选项非常有用，而且它们的功能比我了解的或有时间提及的还要多得多。如果你最终决定认真对待编码，那么你应该有意识地学习更多关于开发者工具能为你提供哪些功能的知识。\n\
  \nFirefox 的一个很酷的功能是 3D 视图选项。我不太确定它有多有用。然而，它可以帮助你理解页面的层级结构，并显示元素被错误地放置在其他元素内部时可能出现的错误。\n\
  \n说实话，当我尝试在自己的电脑上启动 3D 视图时，弹出了一个窗口，提示 3D 视图失败，让我查看 Firefox 网站上的故障排除页面。我怀疑是因为我的显卡问题。不过，这里有一张\
  \ Firefox 3D 视图的图片。\n\n图 5.3 – Firefox 中的 3D 视图选项非常酷！\n\n![](img/00006.jpeg)\n\n\
  # 第 6 章：HTML 结构\n\n在开始熟悉 HTML 之前，你需要了解一些 HTML 元素的结构。\n\n## 开始和结束 HTML 标签\n\n任何可以包裹内容的元素都有一个开始标签和一个结束标签。开始标签用“小于号”和“大于号”符号（`<\
  \ >`）包裹，结束标签则用相同的符号加上一个正斜杠（`</ >`）包裹。\n\n示例：\n\n```\n<body>这是 body 标签，它是 HTML 文档的主体，所有要在页面上显示的\
  \ HTML 元素都位于此元素的开始和结束标签之间。</body>\n```\n\n```\n<p>这是一个段落标签。你希望包含在此段落中的所有文本都放在这里。</p>\n\
  ```\n\n## 自闭合 HTML 标签\n\n自闭合元素通过在结束的“>”符号前放置一个正斜杠来结束自身。\n\n下面是一个“换行”标签。换行标签用于使句子换行，或在文档中腾出一些空间。换行标签的使用方式类似于在\
  \ Microsoft Word 文档中按回车键。\n\n过去使用 `<br>` 曾是有效的 HTML，但近年来，你需要在标签内部自行结束它（如下所示，带有一个空格和一个正斜杠）。\n\
  \n示例：\n\n```\n<br />\n```\n\n下面是一个“水平线”标签。这个 HTML 元素在页面上创建一条水平线。由于这条线不能包裹任何其他 HTML\
  \ 元素，因此它是自闭合的。下面是一个水平线的示例。\n\n示例：\n\n```\n<hr />\n```\n\n# 第 7 章：CSS 结构\n\nCSS 可能会稍微复杂一些，因为你可以进行许多\
  \ CSS 声明，每个声明都有自己的一套规则。\n\n然而，CSS 中有一些东西是永远不会改变的，所以我现在就与你分享，这样在我们开始深入探讨这个主题之前，你就能有一个更好的理解。\n\
  \nCSS 遵循你下面看到的结构。当你在文档的头部或单独的文档中声明 CSS 时，CSS 就是这样编写的。\n\n图 7.1 – 下面你可以看到 CSS 样式的结构。\n\
  \n![](img/00007.jpeg)有些人喜欢将 CSS 直接写在 HTML 元素中，这被称为“内联 CSS”。下面是一个示例。\n\n![](img/00008.jpeg)\n\
  \n使用内联 CSS 样式时，目标元素是明确的，因此目标选择以及大括号都被省略了。但 CSS 属性、冒号、CSS 属性声明以及结尾的分号都保留着。\n\nCSS\
  \ 的最佳实践是将所有 CSS 保存在一个单独的文档中，并将该文档链接到你的 HTML。然而，如你所见，有几种不同的方式可以编写 CSS。为了节省时间并避免混淆，我们将只介绍如何在单独的文档中编写\
  \ CSS。\n\n内联样式通常不被看好，因为它们可能会增加网站的加载时间，并且被视为业余做法。\n\n## 定位 HTML 元素\n\n要开始编写关于任何元素的\
  \ CSS 声明，你必须首先告诉 CSS 文档要定位哪个元素。\n\n### 宽泛示例\n\n如果你想定位某个特定 HTML 元素的每一个实例，你可以以该元素的名称开始你的\
  \ CSS 声明。\n\n示例：\n\n* `body`（定位 HTML 文档的 body 元素及其包含的所有元素）\n* `h1`（定位文档中的所有 h1 标题元素）\n\
  * `a`（定位所有链接）\n\n### 通过“类”定位元素\n\n另一种定位元素的方法是给它们添加类。类允许你根据你希望赋予这些元素的类来定位元素，而不是根据\
  \ HTML 元素的类型。\n\n类非常棒，因为它们允许你更精确地设置对象的样式。\n\n下面是一个给 HTML 元素添加类的示例。\n\n![](img/00009.jpeg)如你所见，要给一个元素添加类，你必须添加\
  \ `class=`，后面跟上引号中的类名。\n\n要定位一个类，方法与定位 HTML 元素非常相似。只不过你需要在类名前面加上一个点号。\n\n下面是一个通过类定位\
  \ HTML 元素的示例。\n\n![](img/00010.jpeg)\n\n### 通过 ID 定位元素\n\n类很酷，因为你可以让一个页面上有任意多个具有相同类的元素。\n\
  \n然而，有时页面上可能只有一个元素，你想赋予它一些特殊意义。\n\nID 是一种定位 HTML 元素的方式。但是，每个页面中只能有一个元素具有相同的 ID。\n\
  \n当然，你可以在同一个 HTML 页面上有多个具有相同 ID 的元素。但是，当你去验证文档时，它会在 HTML 验证程序中显示为无效，因为这不是一种有效的 HTML\
  \ 技术。\n\n给 HTML 元素添加 ID 与类声明非常相似。\n\n![](img/00011.jpeg)给 HTML 元素添加 ID 几乎与给 HTML\
  \ 元素添加类完全相同。只不过，你不需要输入 `class ='类名'`，而是直接输入 `id='ID 名'`。\n\n\n\n\n使用 CSS 定位元素几乎完全相同。不同在于，你不是在\
  \ id 名称前加点号，而是使用井号 (#)。\n\n## CSS 定位\n\n### 嵌套 CSS 定位\n\n要定位其他元素内部的元素，只需从大到小的顺序声明元素并用空格分隔。例如，要定位包裹在链接中的图像，你可以使用\
  \ `a img` 来定位这些元素。请记住，嵌套 CSS 定位的深度可以达到你需要的任何程度。\n\n只要你定位的元素包含在所指定的元素中，你的样式就会作用于该元素。\n\
  \n### 高级 CSS 定位\n\n随着 CSS3 的出现，有了更多方法来定位 HTML 元素以进行样式化。\n\n例如，在 HTML 中，有几个不同的元素都使用了相同的类名。\n\
  \n如果你正在读这本书，那么你可能已经混淫滚场多年，在互联网上见过各种东西。网站中最常见的元素之一就是 Web 表单。\n\n你这辈子很可能见过几个 Web 表单，因为总会有某些广告商或企业希望你填写并提交表单。\n\
  \n“input”元素是一个功能非常多的元素。这一个元素可以作为表单中的文本字段，也可以作为日期字段、电话号码字段以及提交按钮！\n\n这引出了我们的下一个问题：如何在不干扰你不想想要修改的其他元素的情况下，为特定类型的“input”元素设置样式呢？\n\
  \n![](img/00013.jpeg)\n\n你在上面看到的是稍微高级的 CSS 声明。\n\n如你所示，我通过用逗号分隔每个 HTML 元素，使用相同的\
  \ CSS 声明定位了多个 HTML 元素。\n\n我还使用括号定位了两种不同类型的输入（type=”text” 和 type=”date”）。\n\n你现在可能还没有完全理解这一点。但是，我正在定位**每一个**\
  \ type 等于“text”的 input，**除了**类名为“s”的那些。我正在使用 `:not(element in question)` 来实现此点。\n\
  \n不过，还有其他几种定位 HTML 元素的高级技术，但我不想让你信息过载。我们只涵盖一些基础构建块来帮助你入门。\n\n### CSS 层级结构\n\nCSS\
  \ 被称为级联样式表（Cascading Style Sheets），是因为为 CSS 设置的规则会“级联”到文档中的其他元素中。例如，文档中位置较低的 CSS\
  \ 样式将覆盖文档中位置较高的样式。例如，第 1 行的样式会被第 365 行针对相同元素的样式所覆盖。这意味着如果你将文档的默认字体族（font-family）声明为\
  \ Arial，然后在文档后部分指定为 Tacoma，那么后者的样式将生效。\n\nCSS 定位更具体的 CSS 样式将覆盖定位更模糊的样式。例如，指向所有段落标签（p\
  \ tags）的 CSS 样式将被指向所有具有你选择的类或 id 的段落标签的 CSS 样式所覆盖。\n\n如果你定位一个 HTML 对象并给该对象提供两个冲突的样式，浏览器将渲染文档中位置较低的样式。例如，如果你给所有标题设置了\
  \ 10 像素的外边距（margin），然后又说所有标题应该有 15 像素的外边距，浏览器将渲染后的样式。\n\n如果 HTML 对象本身具有内联样式（inline\
  \ style），那么在大多数情况下将渲染内联样式。内联样式的示例例如：\n\n```html\n<img src=\"/images/example.jpg\"\
  \ alt=\"This is alternative text\" style=\"float:left;\" />\n```\n\n在大多数情况下，在 CSS\
  \ 声明的结束分号之前添加 `!important` 声明，就可以绕过所有这些冲突的样式。\n\n# 第 8 章：常用 HTML 元素及其规则\n\n## Div\n\
  \ndiv 本质上是一个用于包含其他对象的 HTML 元素。我相信 div 是 division（分区）的缩写。div 对于网站布局至关重要。由于 div 这个词的描述性不强，HTML5\
  \ 生成了具有不同名称的新类型 div。这些新的“类 div”元素被称为：header, nav, section, aside, article, details,\
  \ footer 和 summary。\n\n要使用 div，只需使用这个起始和结束标签来包裹你想要组织的元素。div 是块级元素（block level elements），你将在书后面的部分学习到。\n\
  \n```html\n<div>这里是 div 内容。</div>\n```\n\n这种格式与新的 HTML5 元素相同。\n\n```html\n<header>这里是页眉内容。</header>\n\
  ```\n\n## 标题\n\n标题顾实其名。它们是文本标题，大小从 H1 到 H6 不等。H1 在搜索引擎眼中最大且最高，而 H6 最小且最不重要。\n\n\
  要使用标题，只需用起始和结束标题标签包裹标题文本。标题是块级元素。这可能显而易见，但不要用错标题的标签。\n\n```html\n<h1>这是一个 H1 标题。</h1>\n\
  ```\n\n```html\n<h2>这是一个 H2 标题。</h2>\n```\n\n...\n\n```html\n<h6>这是一个 H6 标题。</h6>\n\
  ```\n\n## 图像\n\n图像也非常自明其义。图像是“内联块”（inline block）级元素。为了保持代码有效，请确保你在文档中使用的每个图像都指定了“alt”属性。“alt”属性在图像由于任何原因无法加载时非常重要。alt\
  \ 属性对于视觉受障的网站访问者也很有用。在这两种情况下，图像都会显示描述图像的替代文本，这样他们就能更好地了解网站的主题。\n\n使用图像只需使用以下格式：\n\
  \n```html\n<img src=\"path\" alt=\"替代文本\" />\n```\n\n显然，path 指向图像的位置，alt 应该替换为实际的文本。图像本身不能包裹其他元素，如你所看到的结束符号（>）。注意：如果你留空\
  \ alt 属性，它是有效的，而不是内部的文本。\n\n## 段落、跨 和引用块\n\n段落（paragraph）正如其名……一个段落。我会注意到有些人使用不合规的做法，比如把段落标签当作\
  \ div。段落是块级元素。要使用段落，只需用段落标签包裹文本。\n\n```html\n<p>你的段落文本在这里。</p>\n```\n\nspan 是用于你希望以某种方式特殊处理的一段文本。span\
  \ 是内联元素（inline elements），通常包裹在块级元素中，例如段落。\n\n要使用 span，用 HTML 标签包裹你的 span 文本。\n\n\
  ```html\n<span>span 文本在这里。</span>\n```\n\n引用块（blockquote）通常用于引用来源或人物。引用块是块级元素，可以包裹其他块级元素。\n\
  \n要使用引用块，只需用 HTML 标签包裹引用块。\n\n```html\n<blockquote>引用块文本在这里。</blockquote>\n```\n\
  \n## 无序列表和有序列表\n\n如果你用过 Microsoft Word，那么一定遇到过无序列表和有序列表。无序列表是项目列表，有序列表是有编号的列表。它们都是块级元素。\n\
  \n这在你看来可能很奇怪，但大多数人使用极样式化的无序列表作为导航栏。这是因为无序列表是指定用于列表的，而导航栏本质上是一个链接列表。\n\n要使用无序列表，使用以下格式：\n\
  \n```html\n<ul>\n  <li>列表项在这里</li>\n  <li>列表项在这里</li>\n  <li>列表项在这里</li>\n  <li>列表项在这里</li>\n\
  </ul>\n```\n\nUL 代表无序列表，而 LI 代表列表项。\n\n要使用有序列表，使用以下格式：\n\n```html\n<ol>\n  <li>列表项\
  \ 1 在这里</li>\n  <li>列表项 2 在这里</li>\n  <li>列表项 3 在这里</li>\n  <li>列表项 4 在这里</li>\n\
  </ol>\n```\n\n\n\n\n`OL` 表示有序列表，而 `LI` 表示列表项。\n\n## 链接\n\n链接让互联网运转起来。链接是内联元素。若要使用链接，请使用以下格式。\n\
  \n```html\n<a href=”path”>这里可以放置文本、图像或你想要链接的任何内容。</a>\n```\n\n显而易见，请记住将 `path` 单词替换为你想要链接的\
  \ URL。\n\n## 表格\n\n在过去，人们会使用表格来布局整个网站。然而在今天，这种技术已不再被青睐。表格对于保持信息整洁有序非常有用。表格是块级元素。\n\
  \n若要使用表格，请使用以下格式。\n\n```html\n<table>\n<th>\n   <td>Jill</td>\n   <td>Smith</td>\n\
  \   <td>50</td>\n</th>\n<tr>\n   <td>Eve</td>\n   <td>Jackson</td>\n   <td>94</td>\n\
  </tr>\n</</table>\n```\n\n`TH` 代表表头，`TR` 代表表格行，`TD` 代表表格数据。本质上，将第一行列为表头并不是必要的，因为所有行都可以直接标记为表格行。然而，如果你想使用\
  \ CSS 为第一行设置样式，你可能想要利用 `TH` 标签，因为它会更容易定位第一行。\n\n## 表单\n\n表单稍微超出了本书的范围。并不是因为表单很难使用，而是因为它们通常需要一些\
  \ JavaScript 或类型的代码才能工作。我不会在此多说这一点。不过，我会给你一个小提示：为了让文本区域（text area）成为有效代码，你必须指定 `cols`\
  \ 和 `rows` 属性。这本质上为文本区域提供了宽度和高度，但如果你愿意，可以使用 CSS 操作这些维度。\n\n# 第 9 章：常用 CSS 样式及其规则\n\
  \n我将在书的后部分更详细地介绍几种不同的 CSS 技术，所以现在我只列出几个重要的 CSS 声明及其规则。\n\n## 颜色\n\n`color` 属性始终表示文本的颜色。要使用\
  \ `color` 属性，只需使用以下格式。颜色的默认值是黑色，除非你在讨论链接。\n\n`color: #000000;`\n\n在书的后面，我将解释 HTML\
  \ 颜色的工作原理，以及如何使用十六进制系统来指定颜色。你可以使用十六进制系统、`rgb` 甚至通过名称列出颜色。\n\n## 字体\n\n有大量的处理字体的\
  \ CSS 声明。我们将简要介绍其中几个。\n\n`font-family: 1st choice, 2nd choice, last resort;`\n\n\
  字体通过族来指定。更多内容将在稍后介绍。\n\n`font-size: 12px;`\n\n字体大小可以通过像素大小、`em` 来指定，你甚至可以使用形容词（大、小等）来指定。\n\
  \n`font-weight: bold;`\n\n字体粗细可以通过百位（`100`、`200`、`300` 直到 `900`）来指定。`100` 最细，`900`\
  \ 最粗。你也可以通过 `bold`、`bolder`、`lighter` 和 `normal` 来指定字体权重。\n\n`text-transform: uppercase;`\n\
  \n使用 `text-transform`，你可以指定某个特定的文本块为大写或小写。无论在实际 HTML 文档中是如何书写的，文本将以那种特定的形式渲染。\n\n\
  `line-height: 14px;`\n\n使用 `line-height`，你可以指定文本行之间的高度。你可以使用像素、`ems` 等来指定数值。\n\n\
  ## 高与宽\n\n你可以为各种对象指定高度和宽度。你可以使用像素、`em`、百分比等作为测量单位。要使用高度和宽度，请使用这些格式：\n\n`height:\
  \ 100px;`\n`width: 50%;`\n\n## 边框\n\n可能会有某个时刻你想给某个东西添加边框。你可以一次指定所有 4 个边框，也可以一次指定一个。（可能有指定边框的其他方法，但我们现在只使用基础知识。）\n\
  \n`border: 1px solid #ffffff;`\n\n要指定边框，以像素边框宽度开始，然后是样式（选项包括：`solid`、`dotted`、`dashed`、`thin`、`inset`\
  \ 等），最后是颜色。要指定特定边的边框，使用：\n\n`border-right: 1px solid #ffffff;`\n`border-left: 1px\
  \ solid #ffffff;`\n`border-top: 1px solid #ffffff;`\n`border-bottom: 1px solid #ffffff;`\n\
  \n## 外边距与内边距\n\n我将在书的后部分详细介绍。然而，外边距（margins）在对象之间形成了不可见的屏障。\n\n内边距（padding）本质上像外边距，但它是\
  \ HTML 元素内部对象的内部屏障。例如，如果你有一个四周边框为 10 像素的 `div`。`div` 内部的任何对象都无法距离边缘 10 像素。\n\n我将在书的后面详细列出如何使用这些。\n\
  \n## 浮动\n\n某些 HTML 元素自然地堆叠在一起，因为它们占据了分配给它们的所有宽度，而有些则没有。为了缓解当你有两个堆叠对象并希望它们并排显示时的情况，可以使用浮动。\n\
  \n要使用浮动，使用以下格式：\n\n`float: left;`\n\n在使用浮动时，你可以指定 `uppercase`。\n\n使用 `text-transform`，你可以指定某个特定的文本块为大写或小写。无论在实际\
  \ HTML 文档中是如何书写的，文本将以那种特定的形式渲染。\n\n`line-height: 14px;`\n\n使用 `line-height`，你可以指定文本行之间的高度。你可以使用像素、`ems`\
  \ 等来指定数值。\n\n## 高与宽\n\n你可以为各种对象指定高度和宽度。你可以使用像素、`em`、百分比等作为测量单位。要使用高度和宽度，请使用这些格式：\n\
  \n`height: 100px;`\n`width: 50%;`\n\n## 边框\n\n可能会有某个时刻你想给某个东西添加边框。你可以一次指定所有 4 个边框，也可以一次指定其中一个。（可能有指定边框的其他方法，但我们现在只使用基础知识。）\n\
  \n`border: 1px solid #ffffff;`\n\n要指定边框，以像素边框宽度开始，然后是样式（选项包括：`solid`、`dotted`、`dashed`、`thin`、`inset`\
  \ 等），最后是颜色。要指定特定边的边框，使用：\n\n`border-right: 1px solid #ffffff;`\n`border-left: 1px\
  \ solid #ffffff;`\n`border-top: 1px solid #ffffff;`\n`border-bottom: 1px solid #ffffff;`\n\
  \n## 外边距与内边距\n\n我将在书的后部分详细介绍。然而，外边距（margins）在对象之间形成了不可见的屏障。\n\n内边距（padding）本质上像外边距，但它是\
  \ HTML 元素内部对象的内部屏障。例如，如果你有一个四周边框为 10 像素的 `div`。`div` 内部的任何对象都无法距离边缘 10 像素。\n\n我将在书的后面详细列出如何使用这些。\n\
  \n## 浮动\n\n某些 HTML 元素自然地堆叠在一起，因为它们占据了分配给它们的所有宽度，而有些则没有。为了缓解当你有两个堆叠对象并希望它们并排显示时的情况，可以使用浮动。\n\
  \n要使用浮动，使用以下格式：\n\n`float: left;`\n\n\n\n\n\n# 构建网站\n\n我构建每个网站时，都会从模型开始。模型本质上是一个\
  \ Photoshop 文档，展示你网站首页的外观。\n\n图 10.1 – 下面是我为一个朋友的网站创建的模型。\n\n![](img/00014.jpeg)如图\
  \ 10.1 所示，这是一个模型的示例。这是我为一个喜欢淘便宜货的朋友随手设计的网站布局。\n\n这个网站将作为本书的示例贯穿始终，因为它只是一个简单的两栏网站。\n\
  \n模型极其重要，因为它充当了网站的蓝图。\n\n一旦有了模型，你就可以开始编码了！\n\n## 设置网站文件夹\n\n说实话，在构建网站这件事上，潜力是无限的。\n\
  \n你不必完全按照我说的方式格式化存放网站的文件夹。\n\n你也不必按照我示例中的方式格式化代码。\n\n但是，如果你保持 HTML 文档整洁易懂，保持文件夹整洁有序，将所有图片放在一个文件夹中——这些都是帮助你以专业方式编码的好习惯。\n\
  \n话虽如此，我们将为你的第一个 HTML/CSS 实验设置一个文件夹。\n\n1. 创建一个文件夹，命名为 `website`\n2. 在该文件夹中创建两个子文件夹\n\
  \   * 一个命名为 `css`\n   * 一个命名为 `images`\n\nCSS 文件夹将存放你的 CSS 文件，Images 文件夹将存放你的图片文件。\n\
  \n## 设置 HTML 和 CSS 文档\n\n准备好后，打开你选择的代码编辑器，创建两个文档。\n\n第一个命名为 `index.html`，第二个命名为\
  \ `style.css`。在 HTML 中，“index”通常表示“首页”，当你将 HTML 上传到服务器时，服务器会将 index 作为首页提供。\n\n\
  将这个 index 文件保存在你刚刚创建的根文件夹 `website` 中。CSS 样式表将保存在 CSS 文件夹中。\n\n### 设置 HTML 文档\n\n\
  自 HTML5 问世以来，HTML 文档变得更加精简。下面是你页面上需要的最基本内容，以构成一个有效的 HTML 文档。\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>这里放置你网站的标题</title>\n\
  \    <!--[if lt IE 9]>\n              <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
  ></script>\n    <![endif]-->\n</head>\n<body>\n</body>\n</html>\n```\n\n打开你的 `index.html`，将上述代码输入到文档中。这是一个最基本的\
  \ HTML 文档，上面看到的大部分内容都是构成有效 HTML 文档所必需的。（过去，一个有效的 HTML 文档需要包含更多声明。）\n\n* `DOCTYPE`\
  \ = 文档类型\n* `HTML LANG` = “en”（英语）注意，HTML 标签从文档顶部开始，在底部结束，以包裹整个文档。\n* `Head` = 放置页面标题、CSS\
  \ 样式表链接、JavaScript 代码以及其他对网站重要但非外观必需的杂项代码的地方。\n* `<!--[if lt IE 9]>` = 其后跟随的代码是为了让\
  \ HTML5 元素在旧版 Internet Explorer 浏览器中正常工作。我不确定这一行代码是否是有效文档所必需的，但加上也无妨。“if lt IE 9”表示如果浏览器版本低于\
  \ Internet Explorer 9。整个代码块的意思是：如果查看此文档的浏览器是 Internet Explorer，并且版本低于 Internet Explorer\
  \ 9，则使用此处链接的文档。\n* `Body` = 在 body 开始和结束标签之间放置你的 HTML 内容。\n\n### 链接 CSS 样式表\n\n\
  与 HTML 文档不同，CSS 文档不需要那么多声明或要求。样式表基本上由你决定如何样式化你的 HTML。（这并不是说你可以不使用有效的 CSS。）\n\n为了让\
  \ CSS 样式对 HTML 文档生效，你需要将样式表链接到它。\n\n转到你的 `index.html`，添加下面以粗体显示的那行代码。\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>这里放置你网站的标题</title>\n\
  \    <link href=\"css/style.css\" rel=\"stylesheet\" type=\"text/css\" />\n    <!--[if\
  \ lt IE 9]>\n              <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
  ></script>\n    <![endif]-->\n</head>\n<body>\n</body>\n</html>\n```\n\n这行代码将样式表链接到你的\
  \ HTML 文档。`href` 是你要链接的文档的路径。\n\n### 整合在一起\n\n现在你有了一个空白的 HTML 文档和一个链接到它的样式表，可以大展身手了！\n\
  \n编码网站的最佳实践是：在文本编辑器中同时打开 HTML 和 CSS 文档，同时在浏览器中打开网站。\n\n在浏览器中打开网站至关重要，因为你需要能够刷新文档以查看你所做的更改是否生效。你可以通过右键单击文件，选择“打开方式”，然后选择你喜欢的浏览器来在浏览器中打开\
  \ HTML 文档。\n\n我喜欢做的一件事是，为了确认 CSS 文档确实链接到了我的 HTML 文档，我会为背景指定一种颜色，看看它是否生效。\n\n转到你的样式表，输入以下内容。\n\
  \n```css\nbody\n{\n              background-color:#000000;\n}\n```\n\n然后保存样式表文档，刷新浏览器，检查文档的背景是否确实发生了变化。\n\
  \n颜色代码 #000000 应该表示黑色。实际上，你可以在这里放置任何六位字母和数字的组合。但是，如果你将其设为 #ffffff，背景将变为白色，你就无法知道更改是否真的生效了，因为那已经是默认的背景颜色。\n\
  \n## 背景\n\n起初我不确定如何组织这本书。但我意识到，传授我 HTML/CSS 知识的最佳方式是介绍一些最实用的属性，并在此过程中穿插一些零碎的小技巧。\n\
  \n我知道我提到过你应该从模型开始每个网站。但在这里，因为你只是学习，所以没有必要。\n\n如果你一直跟着做，现在应该有一个空白的 HTML 文档，背景是黑色（或其他颜色）。\n\
  \n转到你的 CSS 文档，再次将其清空。\n\n在处理任何与 HTML/CSS 相关的事情时，完成每个任务都有多种方法。\n\n话虽如此，我们将介绍几种不同的方法来实现同一个目标：为我们的空白网站添加一个超酷的背景！\n\
  \n### 平铺背景\n\n最流行的背景选项之一是标准的平铺背景。\n\n![](img/00015.jpeg)我最喜欢的获取项目酷炫背景的网站之一是 [www.subtletepatterns.com](http://www.subtletextures.com/)，去那里下载一个你喜欢的背景，并将其保存到你的\
  \ `images` 文件夹中。\n\n我选择了看到的第一个图案，叫做“佩斯利”，你可以在右侧看到这个图案。\n\n这个图案是无缝的，意味着当你平铺这个图案时，它会创建一个无缝的背景，非常适合网站背景。\n\
  \n为了平铺这个背景，我们需要编辑 CSS 样式表以反映我们想要做出的更改。\n\n打开你的样式表，然后添加以下代码来添加你的平铺背景。\n\n```css\n\
  body\n{\n              background-image:url(../images/paisley.png);\n}\n```\n\n\
  图 10.2 – 下面是一个带有平铺背景的 HTML 文档。\n\n![](img/00016.jpeg)当然，如果你选择将文件夹命名为其他名称，你应该将 `images`\
  \ 改为你的图片文件夹的名称，同时将实际图片文件的名称改为你选择的文件。\n\n上面是我的平铺背景的结果。\n\n\n\n\n\n正如我之前提到的，所有的 HTML\
  \ 元素都应用了默认样式，CSS 样式也有其与之关联的默认属性。\n\n例如，对 `background-image` 进行声明，始终意味着背景图像将进行平铺（tiled），除非你另有声明。\n\
  \n稍后你将看到你还有哪些背景选项可可用。\n\n关于声明路径的简要说明。\n\n本质上，由于我们的 CSS 文件和图像位于不同的文件夹中，因此我们必须在路径声明中注明这一点。\n\
  \n```css\nbody\n{\n    background-image:url(../images/paisley.png);\n}\n```\n\n\
  路径前面的 `../` 是为了告诉样式表，图片的路径不在同一个文件夹中，而是在 CSS 文件夹的上一级目录。\n\n在你的计算机上进行本地操作时，你处理的是所谓的“相对”路径声明。这意味着你的路径将基于它们相对于当前文件夹所在的位置。\n\
  \n当你开始将文件上传到互联网时，你进行的大部分操作将是相同的。然而，可能会在某个时刻，你需要使用绝对路径声明。\n\n其中一个例子就是你在上面 HTML 文档的\
  \ `head` 标签中看到的那个。\n\n`<script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
  ></script>`\n\n因为上面的 JavaScript 文件并不相对于你的网站，而是位于它自己的 URL 上，因此你需要声明以 URL 开头的路径。\n\
  \n简单来说，路径需要以 `http://www.example.com/the-folder-in-question...` 开头注明。\n\n## 渐变之旅！\n\
  \n好了，正如我上面提到的，除非你进行指定，否则背景图像将平铺。\n\n图 10.3 – 下面是两个渐变示例。左侧是在 y 轴上平铺的渐变，右侧是在 x 轴上平铺的渐变。\n\
  \n![](img/00017.jpeg)你可以通过两种方式创建线性渐变。我只使用了一个简单的黑到白渐变来说明我的观点。然而，你可以随心所欲地对渐变进行任何创作。你甚至可以制作圆形渐变。（稍后我会教你如何做）\n\
  \n为了实现从上到下的渐变，你需要一张可以在 x 轴（左侧和右侧）平铺的图像。由于它在左右重复，因此该图像只需要 1 像素宽（你应该始终尽可能少地使用图像以节省加载时间！）\n\
  \n选择你最喜欢的两种颜色创建一个渐变。在 Photoshop 中创建一个高度约为 400 像素、宽度为 1 像素的文件，并用你的渐变填充该文件。\n\n图 10.4\
  \ – 在这里我正在创建一个 1 像素宽的图像，作为我的渐变。\n\n![](img/00018.jpeg)我决定使用黑色和蓝色。\n\n将你的图像保存到 `images`\
  \ 文件夹中，并确保记住文件名和扩展名。\n\n进入你的样式表并输入：\n\n```css\nbody\n{\n    background-image:url(../images/gradient.png);\n\
  \    background-repeat:repeat-x;\n}\n```\n\n显然将 `gradient.png` 替换为你的文件名和扩展名。\n\n\
  这就是结果……\n\n图 10.5 – 下面是我平铺渐变的结果。\n\n![](img/00019.jpeg)现在，我知道你在想什么……我搞砸了。然而，我想向你展示这个是为了说明我的下一个观点。\n\
  \n我们声明了一个背景图像并告诉它在 x 轴上平铺。它确实做到了，但背景的默认值仍然是白色，因此在图像平铺下方显示出白色。\n\n为了修复这个问题，我们必须在指定背景图像的同时也指定背景颜色，这样渐变看起来会更流畅。让我们使用\
  \ Photoshop 的吸管工具来获取所需的颜色代码！\n\n图 10.6 – 下面我正在使用吸管工具来确定我渐变最底部的颜色。这将帮助我声明背景颜色，并将我的渐变与页面融合。\n\
  \n![](img/00020.jpeg)\n\n如你上方所见，我们使用了颜色取色工具来找到所需的颜色代码。现在我们可以修复渐变并让它变得连续！\n\n进入你的\
  \ CSS 并添加：\n\n```css\nbody\n{\n    background-image:url(../images/gradient.png);\n\
  \    background-repeat:repeat-x;\n    background-color:#00aeef;\n}\n```\n\n显然将十六进制代码数字替换为你需要的颜色。\n\
  \n图 10.7 – 下面是我崭新的、美丽的连续渐变！\n\n![](img/00021.jpeg)我们的渐变现在已经修复了！\n\n使用上述逻辑，我们可以按照相同的步骤创建一个从左到右的渐变。在这种情况下，我们使用一个高\
  \ 1 像素、宽 \"X\" 像素的图像。我们不再说 `background-repeat: repeat-x;`，而是将其改为 `background-repeat:\
  \ repeat-y`。\n\n我们不仅可以控制背景如何重复，还可以控制位置。背景的默认位置始终在左上角。\n\n这允许有许多不同的选项。\n\n图 10.8\
  \ – 玩转渐变。这个渐变沿着浏览器窗口的右侧运行！\n\n![](img/00022.jpeg)例如，上面的渐变是通过一个高 1 像素、宽 \"X\" 像素的图像创建的，它在\
  \ y 轴上重复，且 `background-position` 为 `right`。\n\n代码如下：\n\n```css\nbody\n{\n    background-image:url(../images/gradientexample.png);\n\
  \    background-repeat:repeat-y;\n    background-color:#00aeef;\n    background-position:right;\n\
  }\n```\n\n如果你担心记住每个 CSS 声明，这些担心。这些以后都可以通过 Google 查询。最重要的是理解原理并看到 HTML/CSS 可以实现的功能。\n\
  \n## 径向渐变与无图像渐变\n\n下面的渐变选项最近可用。HTML5 和 CSS3 带来了许多曾经只能通过 JavaScript 或大量的图像解决方案实现的。\n\
  \n然而，现在我们能够仅使用 CSS 创建径向渐变和无图像渐变！这种解决方案的唯一缺点是不兼容旧版本的 Internet Explorer。但是随着时间的推移，旧版本的\
  \ IE 将消失，担心浏览器兼容性将成为过去。\n\n我个人使用这个网站 `http://www.colorzilla.com/gradient-editor/`\
  \ 来创建渐变。我是通过搜索“gradient generator”发现它的，它是第一个搜索结果。\n\n图 10.9 – 这个“Ultimate CSS 渐变器”对于创建各种类型的无图像渐变非常棒！\n\
  \n![](img/00023.jpeg)这个网站很棒：\n\n* 它让你像使用图像编辑软件一样编辑渐变\n* 你可以更改渐变的方向为垂直、水平、对角线以及径向\n\
  * 它会为你生成 CSS，并且包含了常用浏览器的 CSS 声明，以及针对旧版 IE 浏览器的兼容解决方案\n* 他们提供了预制的渐变\n* 最棒的是它为你节省了大量时间\n\
  \n当你创建了满意的渐变后，只需复制 CSS 并将其粘贴到你的样式表中即可。\n\n## 不重复背景图像\n\n上面我提到了一些创建背景效果的技巧。然而，可能会在某个时刻，你希望一个元素只有一张图片作为其背景。\n\
  \n你可能希望图片出现在右下角。或者你可能希望标题在文本左侧有一张背景图像。\n\n为了实现这一点，你需要像上面所述为元素指定一个背景图像。然而，我们需要声明背景不要重复。\n\
  \n\n\n\n最后，我们可以为背景指定位置。放置背景图片的选项包括顶部（top）、底部（bottom）或中间（center），后面跟着左侧（left）或右侧（right）。可以使用位置组合，例如，“右上”或“左下”。\n\
  \n请记住，如果你在文本元素中放置背景图片并希望图片位于文本左侧，你将必须使用 `padding`（内边距）来确保文本不会覆盖背景图片。此外，如果你的文本没有图片高，你将需要使用\
  \ `padding` 来确保背景图片不被裁剪。\n\n![](img/00024.jpeg)\n上面是我开始时使用的 CSS，下面是结果。\n\n![](img/00025.jpeg)\n\
  如你所示，我的文字离图片太近了，为了缓解这一点，我必须在左侧留出更多的 `padding`。\n\n![](img/00026.jpeg)\n上面是结果。显然我们可能不想使用\
  \ Times New Roman 字体，但我们将在书的稍后部分学习字体。\n\n# 第 11 章：为互联网准备图像\n\n希望如果你正在阅读这本书，你对图形设计有一点了解。并且希望你拥有某种图像编辑软件。\n\
  \n我将使用 Photoshop 向你展示如何为互联网准备图像。\n\n了解这些知识非常有用，而且通常是你通过试错来学习的。\n\n## 72 DPI\n\n\
  如果你是一名平面设计师，或者来自打印背景，那么你可能对图像分辨率很熟悉。\n\n通常，在处理为打印准备的图像时，标准分辨率是 `300dpi`。然而，对于互联网来说，大多数图像都是\
  \ `72 dpi`。在某些少数情况下，你可能会遇到分辨率在 90  dpi 以上的图片，而 `72` 是标准。\n\n你还需要确保使用正确的扩展扩展名保存图像，并针对你所选择的扩展名进行优化。\n\
  \n## 最常见的图像扩展名\n\n在为网络创建（基于像素的）图像时，你最常用的图像扩展名是 `.jpg`、`.gif` 和 `.png`。当然，你还有 `.svg`，它们是“可缩放矢量图形”，但我们暂时不会处理这些。\n\
  \n每种扩展名在保存特定类型的图像时都有其优缺点。\n\n对于互联网来说，如何保存图像至关重要。如果你使用不适用于所保存图像的格式保存文件，那么加载时间将会更长。\n\
  \n### 何时使用 .JPG\n\n当你尝试保存的图像本质上是照片时，`.jpg` 是最佳选择。\n\n我的意思是，如果图像是由成千上万不同颜色和深色的微小像素组成的，那么将其保存为\
  \ `.jpg` 将是你最好的选择。\n\n图 11.1 – 如你所示，这张图片是由成千上万个彩色小方组成的。\n\n![](img/00027.jpeg)\n\
  如从上面的图片所示，光是狗额头上那个小点的像素与像素之间的颜色差异就如此，将此图像保存为 `.png` 或 `.gif` 会导致你的网站加载极其缓慢。\n\n\
  将你的照片保存为 `.jpg` 是很棒，因为在 Photoshop 等照片编辑程序中，它提供了降低图像质量的选项，使文件更小。\n\n你可以在实际保存文件之前降低图像质量并查看最终图像将受到什么影响，以及图像加载需要多久。\n\
  \n我喜欢做的是降低图像质量，同时观察图像的预估加载时间。这让我使图像质量达到可以接受的程度，同时加载时间又不过长。\n\n我取了上面这张图像（它是 `1920x1080`\
  \ 像素，这对网络图片来说非常大），并使用 Photoshop 中的“存储为 Web 和设备”菜单计算出使用最常见的文件扩展名加载这张相同的图像需要多久。\n\n\
  图 11.2 – 在下方你可以看到使用不同图像扩展名对这张小狗照片的加载时间预览。\n\n![](img/00028.jpeg)\n如你所示，对于完全相同的图像，将此图像保存为\
  \ `.png` 会导致该图像在 56.6 Kbps 下需要 402 秒，`.gif` 需要 190 秒，而 100% 质量的 `.jpg` 需要 114 秒。\n\
  \n请记住，`.png` 和 `.gif` 可以通过修改来缩短加载时间，但图像质量会严重损害；而 `.jpg` 可以在降低质量的情况下对最终产品影响极小，且仍然加载得极快。\n\
  \n### .PNG 和 .GIF\n\n当所涉及图像基于纯色区域而不是成千上万个不同颜色像素时，`.PNG` 和 `.GIF` 是最佳的。\n\n图 11.3\
  \ – 由于下面的图像是基于纯色块的，因此 `.png` 或 `.gif` 文件扩展名效果最好。\n\n![](img/00029.jpeg)\n上面的图片更适合保存为\
  \ `.gif` 或 `.png`。如果图像是动画的，它肯定会被保存为 `.gif`，因为 `.gif` 支持动画。\n\n`.gif` 和 `.png` 都支持透明度。\n\
  \n\n\n\n我发现，这种现象是由于所谓的“抗锯齿”（anti-aliased）像素造成的。在处理基于透明像素的图片时，图像外围的像素不能是纯色。如果是那样，图像的外边缘看起来就会是“块状的”。\n\
  \n![](img/00034.jpeg)\n\n右侧的图片阐说明了这一事实。仅用微小的颜色正方形来创建圆角和美如画作的照片是很困难的。因此，为了缓解这个问题，会进行抗锯齿处理，它本质上是在图像边缘创建了半填充的像素，以营造出平滑边缘的错觉。\n\
  \n在保存透明图像时这会产生问题，因为如果你尝试将此图像保存为 `.gif`，这些抗锯齿像素默认将具有白色背景。\n\n这导致了你在上面看到的效果，即我们猫咪图像周围有白色像素。然而，当你以\
  \ `.gif` 以及 `.png` 格式保存透明图像时，你可以选择一个“色片”（matte），它是作为这些抗锯齿像素的背景颜色。\n\n这样一来，如果你想在红色背景上使用透明图像，可以指定红色为色片颜色，这样抗锯齿像素就不会那么明显。\n\
  \n当然，你可以通过将图像保存为 `.png-24` 来跳过这一切，它具有优越的透明能力。然而，高质量的透明 `.png` 有时加载需要长时间。\n\n出于这个原因，我使用一个名为\
  \ [www.tinypng.com](http://www.tinypng.com/) 的网站来缩小我的透明 `.png` 以及我所有的 `.png` 文件的大小。\n\
  \n图 11.7 —— 下方的汽车图像在我使用 `tinypng.com` 压缩它之前文件大小非常大。\n\n![](img/00035.jpeg)\n\n当你有一个\
  \ `.jpg` 质量的图像但仍然想要卓越的透明度时，Tiny PNG 非常棒。上述网站上的汽车是完全透明的，包括汽车投下的阴影以及从汽车后面射出的光线。保存这样的透明图像会导致图像加载很长时间。但是，使用图像压缩软件，这是轻而易举！\n\
  \n# 第 12 章：操控 HTML 对象的布局\n\n在设计一个你想要外观的网站时，知道如何将对象放置在你想要的地方是非常重要的。\n\n然而，为了做到这一点，你必须首先了解一点\
  \ HTML 对象的行为模式。HTML 对象要么被视为“行内”（inline）或“块级”（block）元素。\n\n## 行内元素与块级元素\n\n为了说明行内元素和块级元素之间的区别，我将在空白页面上创建不同的\
  \ HTML 元素，然后使用 Google Chrome 的“检查元素”选项对它们进行检查。\n\n图 12.1 —— 我在页面顶部的 `H1` 标签上点击“检查元素”，向你展示块级元素会占据尽可能多的水平空间。尽管文本本身只利用了页面的\
  \ 1/16，但它仍然导致下方的元素被放置在下一行。\n\n![](img/00036.jpeg)\n\n这很难辨认，但我用块级元素和几个行内元素填充了页面。\n\
  \n块级元素和行内元素之间的区别在于，块级元素会在垂直方向上占据它所需的空间，并在水平方向上占据尽可能多的空间。\n\n如你所见，我检查了 `H1` 标签（这就是所谓的标题\
  \ 1），蓝色和粉色区域说明了该对象占据的空间。显然，“标题 1”元素占据了整个页面的宽度。\n\n如果我将相同的 `H1` 标签放在一个仅占浏览器窗口宽度一半的容器中，`H1`\
  \ 标签仍然会占据尽可能多的水平空间。只是在这种情况下，它会被其容器限制，容器只允许它占据浏览器窗口的一半宽度。\n\n上面的页面大部分是块级元素，如你所见，它们堆叠在一起。然而，最后一行有\
  \ 3 个不同的行内元素。让我们选择“检查元素”选项来了解更多关于这些行内元素的本质。\n\n图 12.2 —— 我在一个 `span` 元素上点击了“检查元素”。带有\
  \ `span` 元素的行包含 3 个不同的 `span` 元素。注意，它们都在同一行。这是因为它们是行内元素。\n\n![](img/00037.jpeg)\n\
  \n文档的最后一行包含 3 个 `span` 标签。`span` 是一种类型类元素，它的重要性/意义程度小于段落（paragraph），段落可以被认为是 `span`\
  \ 的大哥。\n\n如你所见，当我检查 `span` 元素时，元素本身只占据了它所需的空间。所有行内元素都是如此。\n\n块级元素和行内级元素之间的关系非常重要，因为可能会有某时刻，你希望两个块级元素直接挨在一起。或者可能会有某时刻，你希望将行内元素显示得像块级元素一样。\n\
  \n## 行内块元素 (Inline-block)\n\n行内块元素是具有宽度高度的行内元素，而不是只占据必要的空间。这虽然很少遇到，但了解它仍然很好，也是你武器库中的另一个工具。\n\
  \n## “浮动”元素 (Floating)\n\n在我们深入探讨之前，我将向你展示人们通常是如何设置网站的。我将通过使用我已经完成的布局并使用黄色来展示。\n\
  \n在现代网站开发中，人们使用所谓的 `div` 来分离和布局内容。`div` 是一个块级 HTML 元素，如果你知道如何操作它们，布局网站非常有用。\n\n\
  图 12.3 —— 我将此页面中的每个 `div` 包裹在黄色框中以说明。\n\n![](img/00038.jpeg)\n\n如果你感到有点困惑，那太棒了！这意味着你理解了块级元素是如何工作的。如果你不困惑，那么在没有\
  \ CSS 的情况下，这些框应该是堆叠的。事实上，如果没有 CSS，它们将会是那样。让我们回到之前看到的图片。\n\n![](img/00039.jpeg)\n\
  \n如你所见，去掉 CSS 后右侧的图像完全相同。所以这告诉我们，通过 CSS 我们能够按照我们的方式布局对象。\n\n如果你希望两个块级元素并排，那么它们需要：\n\
  \n1. 每个元素都需要有一个指定的宽度。块级元素通常会占据尽可能多的水平空间，因此如果没有指定的宽度，它们将只是堆叠在一起。\n2. 所有并排元素的宽度之和不能大于容器元素的宽度。假设你正在创建一个宽度为\
  \ 1000 像素的网站。你不能创建两个 600 像素宽的 `div` 并期望它们并排。同样，你不能让两个 500 像素宽且带有 10 像素边距的 `div`\
  \ 并排，因为宽度的总和加上 10 像素的边距将使对象的对象的总宽度达到 520 像素。\n3. 对象需要被“浮动”。float 是一种 CSS 样式声明，告诉对象基本上在水平方向上向右或向左堆叠。这取决于你指定对象浮动到右侧还是左侧。CSS\
  \ 声明如下。\n\n```css\ndiv {\n    float:left;\n}\n```\n\n你也可以通过输入 `float:none;` 来指定不浮动。这种浮动对象的做法对于现代网站设计至关重要。过去，人们必须使用表格来获得相同的效果。\n\
  \n## “清除”元素 (Clearing)\n\n\n\n\n\n# 浮动与清除 (Floats and Clears)\n\n浮动（Float）和清除（Clear）是密不可分的。假设你在容器对象内部有两个浮动对象。\n\
  \n使用 CSS，你为容器元素指定了红色背景，而这两个浮动对象没有任何背景。\n\n容器对象包裹着这两个对象，那么整个区域的背景将会是什么颜色呢？如果你是一个逻辑严密的人，你会认为既然容器是红色背景，那么整个区域的背景应该是红色的。\n\
  \n然而，由于浮动对象的行为不再完全像块级元素那样，它们并不会触发容器元素完全包裹住这两个浮动元素。\n\n我知道这听起来有点困惑，所以我将直接通过图示来说明。\n\
  \n图 12.3 – 下方是一个容器 div 内部并排排列的两个 div。我为容器 div 指定了红色背景，但这里并没有出现背景颜色……这到底是怎么回事？？\n\
  \n![](img/00040.jpeg) 好了，在上面你会看到我所说的内容的结果。\n\n我创建了一个类为 `container` 的 div。我设置该 div\
  \ 的宽度为 1,000 像素，并使其在页面中间居中。\n\n在该容器 div 内部，我创建了两个 div，它们的宽度设定为 50% 且向左浮动（float left）。\n\
  \n它们并排堆叠，但容器并没有包裹它们。我们知道这一点，是因为容器 div 原本应该有红色背景。\n\n让我们使用“检查元素（inspect element）”选项来看看我们的容器\
  \ div 发生了什么。\n\n图 12.4 – 我在容器 div 上点击了“检查元素”，发现它并没有包裹其内部的元素。\n\n![](img/00041.jpeg)\
  \ 如你所见，容器并没有包裹其内部的两个 div。\n\n之所以这样，是因为 HTML 文档并并没有真正把浮动对象看作存在那里。\n\n这解释起来有点困难，所以让我们在两个浮动\
  \ div 之后放置一个块级元素，看看会发生什么。\n\n图 12.4 – 看起来开始好了一点，我们可以看到红色背景，但它并没有完全覆盖内部的元素。\n\n![](img/00042.jpeg)\
  \ 我在两个 div 之后放置了一个 H1 标签，如你所见，容器现在能看到内部有一个块级元素，并包裹了它。\n\n你可能在奇怪为什么 H1 标签没有出现在两个浮动\
  \ div 的下方。\n\n这是因为，就像我们从左到右写一样，HTML 也是从左到右排列的。如果没有特殊指定，每个元素都会尝试直接进入屏幕的左上角。\n\n为了让我们刚刚在文档中放置的\
  \ H1 标签位于两个浮动对象下方，我们必须使用另一个名为“清除（clear）”的 CSS 属性。\n\n我特意在右列 div 中放置的对象数量是左列 div\
  \ 的一半，这样它就会更短。因为那里没有东西告诉 H1 标签去清除那两个浮动元素，它就跳到了最近的可用左上角。\n\n`clear` 属性有几个不同的选项。你可以清除左侧的对象、右侧的对象，或者两都清除。\n\
  \n现在，让我给那个 H1 标签一个类名 `clear`。然后我就可以使用 CSS 指定，任何类名为 `clear` 的元素都应该清除“两侧（both）”。\n\
  \n![](img/00043.jpeg) 上方是相关的 HTML 和 CSS。下方是结果。\n\n![](img/00044.jpeg) 如你所见，在进行网站布局时，浮动和清除非常有帮助。\n\
  \n接下来，我们将学习外边距（margins）和内边距（padding），这对于布局以及按照你想要的方式样式化对象也很有帮助。\n\n## 外边距与内边距 (Margins\
  \ and Padding)\n\n外边距和内边距都是非常强大的工具。它们的作用几乎相同，只有一些细微的区别。\n\n### 外边距 (Margins)\n\n\
  外边距的作用基本上是充当屏障，将对象从其他对象推开。\n\n如果你为一个对象设置 10 像素的外边距，这意味着没有其他 HTML 元素可以进入该元素 10 像素的范围。\n\
  \n虽然外边距不会增加元素的实际尺寸，但它们在某种程度上增加了元素的覆盖范围。\n\n例如，如果你有一个指定宽度为 1,000 像素的容器 div。然后你在容器内放置了两个浮动\
  \ div。这两个浮动 div 的宽度都被设定为 500 像素。那么这两个 div 就能在容器内并排紧齐地排列。\n\n然而，如果你给这两个浮动 div 都设置\
  \ 10 像素的外边距，它们将会堆叠在一起，因为它们没有足够的空间并排排列。\n\n图 13.1 – 这两个 div 本来应该在一个 1,000 像素宽的容器内并排坐。每个\
  \ div 宽为 500 像素。但现在因为每个 div 周都有 10 像素的外边距，它们无法再并排了。\n\n![](img/00045.jpeg) 上方是之前的同一个网站。但现在不是容器\
  \ div 有红色背景，而是我给每个浮动 div 设置了红色背景，并在整个边界周围设置了 10 像素的外边距。\n\n如你所见，尽管我指定的宽度是 50%，但由于外边距的存在，它们不再能并排了。你通过\
  \ Google Chrome 的“检查元素”工具可以看到，它用桃子色标注了外边距。\n\n### 内边距 (Padding)\n\n内边距与外边距几乎相同，不同之处在于它作用于元素内部。\n\
  \n如果你给元素设置 10 像素的内边距，这意味着元素会向内扩展 10 像素。\n\n这解释起来有点困难，所以让我们在两个浮动 div 之后放置一个块级元素，看看会发生什么。\n\
  \n图 13.2 – 我给这个 div 设置了四周 10 像素的内边距并点击了“检查元素”。\n\n![](img/00046.jpeg) 如你所见，文字不再贴近边缘。Google\
  \ Chrome 使用绿色表示内边距，但在这个例子中，它被 div 的红色背景掩盖了。\n\n### 指定外边距与内边距 (Specifying Margin\
  \ & Padding)\n\n外边距和内边距的指定非常相似。请记住，你可以使用单位（如 px, pt, cm 等）来指定外边距。\n\n指定外边距和内边距的最简单方法如下：\n\
  \n![](img/00047.jpeg) 你可以进一步简化。\n\n![](img/00048.jpeg)\n\n你可以再次简化。\n\n![](img/00049.jpeg)\
  \ 当然你还有终极简化的方法。\n\n![](img/00050.jpeg)\n\n### 负外边距 (Negative Margins)\n\n你可能会在某时刻想要定位一个对象但发现没有更好的替代方案。这时你就可以使用负外边距。\n\
  \n在说明如何以及为什么要使用它们之前，我要先说这并不是最专业的选择。然而，我曾被发现偶尔会使用这种“HTML 作弊代码”。\n\n诚地说，在你成为更资深的网站设计师之前，你可能找不到理由来使用这个招数。\n\
  \n而且我想不出任何对于刚接触 HTML/CSS 的人来说易于理解的例子。\n\n### 使用外边距居中对象 (Centering Objects With Margin)\n\
  \n这是最广泛使用的 HTML/CSS 技术之一。我个人在我做的几乎每一个网站中都会使用它。\n\n网站设计师使用它来使网站内容在页面中间居中。\n\n\n\n\
  \n\n如你所见，我创建了一个名为 `container` 的类并设置了 `0 auto` 外边距。这意味着在 `container` 的顶部和底部应该有 0\
  \ 像素的外边距，而左右两侧的外边距将自动调节。\n\n这是一项非常棒的技术，但不要认为你可以使用这种技术来居中**任何**对象。\n\n为了让这项技术生效：\n\
  \n*   该对象必须是块级元素（或至少通过 CSS 指定为 `display: block`）\n*   该对象必须指定宽度\n*   该对象不能浮动（float）\n\
  *   该对象不能是固定或绝对定位（我们将在下一节介绍这些）\n\n# 第 14 章：其他类型的定位技术\n\n老实说，我尝试使用浮动（floats）来布局我大部分的网站。然而，偶尔也会出现一些例外情况。\n\
  \n## 相对定位\n\n这种定位相对于对象原始位置的。\n\n基本上，在你在页面上布局了一些对象之后，你可能会发现某个对象并不在它应该在的位置。\n\n使用相对定位，你只需要指定该元素的位置为\
  \ `position: relative;`，然后就可以根据它的原始位置来移动它。你可以使用 `top: 10px` 或根据情况使用 `top`、`bottom`、`right`\
  \ 和 `left`。\n\n## 绝对定位\n\n绝对定位是绝对的，但它是基于任何父元素的。例如，如果你想对一个对象进行“绝对”定位，而该对象在一个 div\
  \ 内部。那么你指定的位置将相对于该 `div`。\n\n如果对象没有被包含在其他元素中，它将相对于 HTML 页面本身。\n\n绝对定位的元素对其他元素没有任何影响。它们不会将任何其他元素推开，基本上是从文档的普通“流”中移除了。\n\
  \n## 固定定位\n\n固定定位相对于浏览器窗口本身。换句话说，当你打开网络浏览器时，取决于你的屏幕尺寸，如果浏览器是最小化或全屏等。\n\n当你滚动页面时，固定定位的元素不会移动。我过去曾将其用于，当我希望页面背景是固定图片且不希望图片随页面滚动而滚动时。\n\
  \n我还将此用于社交媒体分享框，该框固定在浏览器窗口的侧边。\n\n你以前可能见过的其他用途包括当你滚动很大距离后出现在屏幕右下角的箭头。（那个允许你快速滚动到页面顶部的按钮。）\n\
  \n### 使用定位\n\n为了使用这种定位，你只需要使用 CSS 指定定位类型。\n\n有一行 CSS 将专门用于：\n\n`position: (relative,\
  \ fixed or absolute);`\n\n后面跟着代码行，它们将根据 `top`、`right`、`left` 和 `bottom` 告诉你在哪里定位元素。你可以使用像素（pixels）、点（points）、Em\
  \ 等作为你的测量单位。\n\n# 第 15 章：字体、字体、字体！\n\n好了，如果你有平面设计背景，你就会知道衬线字体（serif font）是指字母末端带有微小尖端装饰的字体。衬线字体非常适合打印，因为这些衬线似乎将单词融合在一起，被认为能让读者更容易阅读。\n\
  \n然而，在万物皆由像素构成的互联网上，衬线字体并不是理想的。并不是说你不应该使用它们，但如果你打算使用衬线字体，最好只将其用于标题或特殊字体类型元素，而不是正文。\n\
  \n此原因是因为像素是正方形的，当将微小的正方形转换为衬线字体时，字体往往会在翻译过程中丢失。这就是“网络安全字体”一词发挥作用的地方。\n\n## 声明字体是如何工作的\n\
  \n所以，请记住，除非另有指定，否则 Times New Roman（或同）是默认字体。这意味着除非你想使用 Times New Roman，否则你绝对需要指定你想使用的字体。\n\
  \n字体通过字体族（family）来指定。要指定你想使用的字体，你先从 CSS 声明 `font-family` 开始。\n\n![](img/00052.jpeg)如你所见，我的文本编辑器正试图为我提供建议列表。\n\
  \n![](img/00053.jpeg)上方是典型的字体声明。你基本上用冒号列出你的选项。列表中的第一个是优先字体，随后是你的所有第二选择，最后是根据字体族选择衬线（serif）、无衬线（sans-serif）或草书体（cursive）。\n\
  \n这样做的效果是，无论某人的电脑上安装了什么字体，你都有更大的机会让字体类型以你想要的方式渲染。\n\n在上面的示例中，如果某人有 Arial，那么计算机将使用\
  \ Arial 渲染字体。如果某人使用的是 Mac，那么他们可能没有 Arial，在这种情况下，计算机将字体渲染为 Helvetica。如果其他一切都失败了，计算机将直接使用默认的无衬线字体。\n\
  \n大多数默认/经典的声明只有 3 个选项，但你可以根据需要指定任意数量的“回退”（fall back）字体。\n\n## 其他字体方法\n\n显然，并不是每个人都想为他们的网页设计项目使用“普通”字体。有些人想使用特殊字体，因为它们符合他们的设计、公司品牌等。\n\
  \n使用特殊字体创建网站还有其他几种选项。其中，我将介绍我最常用的一种。\n\n### Google Fonts\n\nGoogle 拥有一个网络安全字体库，列在\
  \ [www.google.com/fonts](http://www.google.com/fonts)，你可以在这里找到并使用喜欢的字体。\n\n图 15.1\
  \ - 下方是位于 www.google.com/fonts 的库。\n\n![](img/00054.jpeg)如你所见，上方是 Google 字体网站。在这里你可以选择你想使用的字体，以及你想使用的字重（weights）。（字重是指字体的粗细。）\n\
  \n但我会警告你，选择的 Google 字体越多、字重越多，你的网站加载时间就越长。\n\n为了使用 Google Fonts，只需选择你想使用的字体。Google\
  \ 会给你一个 CSS 表格的链接，你需要将其链接到文档的头部。当你想使用该字体时，使用他们给你的声明。\n\n![](img/00055.jpeg)如你所见，上方一旦你选择了字体，就可以选择你想使用的字重。然后\
  \ Google 会更新页面加载工具，让你知道字体会增加多少页面加载时间。\n\n完成后，向下滚动查看……\n\n![](img/00056.jpeg)我很确定我提到过，但不同的浏览器渲染完全相同字体的方式是不同的。这一点至关重要，因为在一个浏览器中看起来很好的字体，如果尺寸略有不同，在另一个浏览器中可能看起来非常奇怪。\n\
  \n让我们看看相同的字体在 Firefox、Google Chrome 和 Internet Explorer 中的渲染情况。请记住，这些字体据说是“Google”字体。我想你会很惊讶的！\n\
  \n![](img/00057.jpeg)上方你会看到在 Google Chrome、Firefox 和 Internet Explorer 中渲染的 Open\
  \ Sans。如你所见，每种字体看起来略有不同。尽管每行包含完全相同的字符，但每行的长度也不同。\n\n最有趣的是……Google Chrome 并不是显示自己字体的最佳浏览器。Internet\
  \ Explorer，这个最糟糕的浏览器，在显示字体方面可能是最好的。\n\n### Google Fonts 免责声明\n\n这是另一个我通过经验学到的技巧。如果你的电脑上下载了某些\
  \ Google 字体（如 Oswald），它们的显示可能会很异常。\n\n\n\n\n我发现，有些谷歌字体，尤其是 Oswald，在使用中等字重时，只会显示字体的上半部分。\n\
  \n图 15.3 – 下面是一个使用中等字重 Oswald 字体的枪支博客。文本只显示了上半部分。\n\n![](img/00058.jpeg)\n\n如果你碰巧注意到这个问题，可以通过使用不同的字重来解决。不过，要知道你之所以注意到这个故障，是因为你的电脑上安装了该字体，而大多数互联网用户不会遇到这个问题……除非他们也是网页设计师。截至目前，我认为这个问题主要出现在\
  \ Firefox 浏览器中。\n\n# 第 16 章：语义化代码\n\n语义化代码，本质上就是确保你编写的代码对任何想要使用它的人来说都易于理解。\n\n过去（包括我在内的一些人现在仍在使用这种方法），人们会用\
  \ `div` 来布局网站，并根据功能给 `div` 添加类名。这些 `div` 会被命名为 `header`、`nav`、`sidebar`、`footer`\
  \ 等。\n\n然而，随着 HTML5 的出现，新的“类 `div`”元素应运而生。这些新的 HTML5 元素在功能上与 `div` 完全相同，但更具语义化，因为它们是根据功能命名的。\n\
  \n这些新元素包括 `header`、`nav`、`aside`、`section`、`article`、`summary`、`details` 和 `footer`。由于旧版本的\
  \ Internet Explorer 不识别这些元素，人们通常会在文档的 `head` 中添加以下代码来解决这个问题。\n\n```html\n<!--[if\
  \ lt IE 9]>\n    <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
  ></script>\n<![endif]-->\n```\n\n你可能还记得，之前我让你搭建的 HTML5 文档中就包含了上述代码。\n\n## 编写语义化代码\n\
  \n在编写网站时，我建议你始终将语义化代码的概念牢记在心。你永远不知道，你过去开发的网站将来是否会有其他人接手。\n\n为了确保你的网站易于理解，请务必：\n\n\
  *   在给 HTML 元素分配类名和 `id` 时使用有逻辑的名称\n*   使用上述 HTML5 元素来标记文档的重要部分\n*   在必要时使用 HTML\
  \ 和 CSS 注释，以帮助他人理解文档中的内容\n\n### HTML 与 CSS 注释\n\nHTML 和 CSS 注释可以帮助你梳理混乱的 HTML 和\
  \ CSS 文档，并让你更好地理解代码。\n\n![](img/00059.jpeg)\n\nHTML 注释的格式如下图所示。上面你会看到一个非常老式的布局，这是一个用表格布局的网站示例。\n\
  \n自那时起，HTML 技术已经取得了长足的进步。然而，编写 HTML 注释的格式仍然相同。在 CSS 中编写注释的格式如下图所示。\n\n![](img/00060.jpeg)\n\
  \n上图中高亮显示的是 CSS 注释。我认为，当你的网站中有某个特定区域对应了一大块 CSS 样式时，CSS 注释非常有用。你可以在代码块的开头和结尾放置 CSS\
  \ 注释，让其他人知道这些样式的用途。\n\n# 第 17 章：使用颜色\n\n大多数情况下，当你需要指定颜色时，会使用十六进制系统。下面可以看到指定这些颜色的格式。\n\
  \n![](img/00061.jpeg)\n\n顾名思义，十六进制颜色基于 6 位数字/字母。十六进制颜色中使用的字符范围是 `a-z` 和 `0-9`。较小的数字表示较暗的颜色，较大的数字表示较亮的颜色。\n\
  \n这是因为计算机颜色基于加色系统。也就是说，颜色是通过添加光来产生的。每种颜色添加的光越多，颜色就越亮。\n\n在上图中，你可以看到黑色的颜色代码。可以看到，红色、绿色和蓝色均为\
  \ 0，结果就是黑色屏幕。而全红、全绿和全蓝则会得到白色。\n\n同样在上图中，你可以看到，如果 6 位颜色代码由三组相同的字符组成，则可以转换为 3 位颜色代码。例如，`#330011`\
  \ 可以简写为 `#301`，`#999999` 可以简写为 `#999`，`#FFFFFF` 可以简写为 `#FFF`。但是，`#030303` 或 `#996500`\
  \ 不能简写。\n\n本质上，数字 `0-9` 表示颜色从低到高的级别。等量的红、绿、蓝会产生白色、黑色或灰色调。`#000000` 表示黑色，因为它使用了等量的（零）红、绿、蓝；而\
  \ `#FFFFFF` 表示白色，因为它使用了等量的（F 在此处可能代表“全”）红、绿、蓝。\n\n此外，你可以通过将一种颜色设为全值，另外两种颜色设为零来获得纯红、纯绿或纯蓝。例如，要指定红色，你可以使用\
  \ `#FF0000`（或 `#F00`），表示全红、0 绿、0 蓝。显然，红、绿、蓝还有更多色调，但这适用于你想使用每种颜色的最纯形式时。\n\n## 十六进制颜色的使用\n\
  \n十六进制颜色代码最常见的用途之一是指定字体颜色。你可以通过 CSS 声明 `color: #000000;` 来实现，其中 `#000000` 是你选择的颜色。\n\
  \n指定颜色的其他用途还包括指定背景颜色（`background-color: #000000`），以及指定边框颜色（`border: 1px solid #000000;`）。\n\
  \n## RGB 颜色代码\n\n有时，你需要使用 RGB 颜色系统来指定颜色。这种情况比十六进制系统少得多。\n\n需要使用 RGB 的情况主要出现在新的 CSS3\
  \ 声明中，例如指定不透明度时，你需要使用 `RGBA` 代码，后跟使用十进制系统的不透明度值。或者指定 CSS3 渐变时。\n\n我不会详细说明何时使用它们，因为当需要时，你可以通过快速谷歌搜索轻松找到使用方法。\n\
  \n指定 RGB 颜色的方式如下：\n\n![](img/00062.jpeg)\n\n每个数字可以是 `0-255` 之间的任意值。`0` 表示无，`255`\
  \ 表示全值。规则与十六进制相同。例如，`rgb(255,0,0)` 是纯红色，`rgb(25,25,25)` 是某种浅灰色。\n\n## 不透明度：RGBA\
  \ 颜色代码\n\n借助 HTML5 和 CSS3，我们现在有了声明不透明度的选项。`RGBA` 本质上与 `RGB` 声明相同，但多了一个要声明的对象，即不透明度。不透明度级别从\
  \ `0.0` 到 `1.0`。`0.0` 表示 0%，`1.0` 表示 100%。格式如下所示。\n\n![](img/00063.jpeg)\n\n## 按名称指定颜色\n\
  \n最近，你可以按名称指定颜色了。不过，这对 CSS3 来说还比较新，我还没有习惯使用它，也从未用过。\n\n更正一下，我只在将颜色指定为 `transparent`（即无色）时使用它。\n\
  \n如果你愿意，可以试试看并熟悉它！正如我之前提到的，在 HTML/CSS 中，解决问题的方法不止一种！\n\n### 从设计稿中获取正确的颜色\n\n在 Photoshop\
  \ 中创建设计稿后，你需要获取正确的颜色以在 CSS 中指定。幸运的是，这非常容易。\n\n只需使用吸管工具拾取颜色，然后双击弹出的前景色（这应该就是你选择的颜色）。弹出的对话框会同时显示十六进制颜色代码以及用于\
  \ `rgb` 颜色代码的红、绿、蓝级别。\n\n图 17.1 – 在 Photoshop 中，你可以使用颜色选择器窗口来确定要在 CSS 文档中指定的十六进制或\
  \ RGB 颜色代码。\n\n![](img/00064.jpeg)\n\n# 第 18 章：CSS 精灵\n\n使用的图片越多，图片尺寸越大，网站加载速度就越慢。\n\
  \n\n\n\n## CSS 雪碧图\n\n为了应对这一现象，一些人使用了一种称为 CSS 雪碧图的概念。CSS 雪碧图是指将多张图片合并成一张图片。这样浏览器就不必加载大量小图片，而是加载一张稍大的图片，从而加快加载速度。通常这些雪碧图采用\
  \ `PNG` 格式，因为 `PNG` 支持出色的透明度。\n\n我喜欢在使用社交媒体图标时使用 CSS 雪碧图。\n\n图 18.1 – 下面是我设置为用作\
  \ CSS 雪碧图的图片。注意标尺是可见的，并且正在使用参考线。这使我更容易在 CSS 声明中使用实际的坐标。\n\n![](img/00065.jpeg)\n\
  \n上图是我创建的 CSS 雪碧图示例。我创建了相同社交媒体图标的黑白版本，以及红色版本，用于用户悬停在图标上时显示。\n\n如你所见，我使用了 Photoshop\
  \ 的参考线，并将标尺设置为像素。这很重要，因为这些坐标稍后对我们很有用。\n\n## 使用 CSS 雪碧图\n\n要使用 CSS 雪碧图，你需要指定图片的高度和宽度，然后必须指定背景图片以及坐标（相对于图片左侧和顶部的坐标）。\n\
  \n```css\n.social\n{\n    height:65px;\n    width:65px;\n    display:block;\n  \
  \  float:left;\n    margin:0 5px 10px 0;\n}\n```\n\n如上所示，我将用作社交媒体 CSS 雪碧图的链接添加了一个\
  \ `.social` 类。然后我为每个链接设置了 65 像素的高度和宽度。我说将链接设置为 `block` 显示，因为否则链接将是行内元素。\n\n每个链接将向左浮动，这样它们会从左到右依次排列，然后我指定了外边距。\n\
  \n然后每个单独的图标需要指定背景以及坐标。\n\n```css\n.fbblack\n{\n    background:url(../images/socialsprite.png)\
  \ 0 0;\n}\n```\n\n上图是黑色 Facebook 图标的 CSS。`0 0` 表示图片从左侧 0 像素、顶部 0 像素开始显示。\n\n```css\n\
  .twblack\n{\n    background:url(../images/socialsprite.png) -65px 0;\n}\n```\n\n\
  上图是黑色 Twitter 图标的 CSS。`-65px 0` 表示图片从左侧 65 像素、顶部 0 像素开始显示。\n\n最后，我为每个图标指定了“悬停状态”。我将向你展示我是如何实现的，接下来我们将讨论元素状态！\n\
  \n```css\n.fbblack:hover, .fbwhite:hover\n{\n    background:url(../images/socialsprite.png)\
  \ 0 -130px;\n}\n```\n\n上图是黑色 Facebook 图标和白色 Facebook 图标的悬停状态。我将图形设计成黑白社交媒体图标在悬停时都显示红色，这就是为什么两者使用相同的背景图片和\
  \ CSS 雪碧图坐标。\n\n如上所示，红色悬停状态位于左侧 0 像素、顶部 130 像素处。\n\n这个主题可能对某些人来说是困惑的，所以不要害怕做一些自己的研究和实验来学习更多。我主要想告诉你这个技巧，以便你将它作为你的武器库的一部分。\n\
  \n# 第 19 章：元素状态\n\n交互元素（如链接和输入框（搜索栏、文本框等））具有所谓的不同“状态”。\n\n正因如此，你可以使用 CSS 来设置每个元素的“状态”样式。\n\
  \n在我让你更加困惑之前，我所说的状态包括：\n\n* 激活\n* 悬停\n* 焦点\n* 已访问\n\n图 19.1 – 当你在 Google Chrome\
  \ 的开发者工具窗口中右键点击一个元素时，你可以“强制元素状态”，即使元素表现得好像正在显示你选择的状态。这在尝试为特定元素状态设置样式时非常有用。\n\n![](img/00066.jpeg)\n\
  \n上图是 Google Chrome 开发者工具的截图，这也是我非常喜欢使用 Chrome 编写网站的原因之一。在对象上右键点击并选择“检查元素”后，你可以在开发者工具窗口中右键点击，然后选择“强制元素状态”，再选择你想查看的状态。\n\
  \n这对测试你的 CSS 非常有用，因为正如我之前提到的，你可以使用 CSS 为所有这些元素状态设置样式。\n\n## 激活\n\n激活指的是活动链接。\n\n\
  ## 悬停\n\n悬停指的是用鼠标悬停在一个链接或对象上。\n\n## 焦点\n\n焦点指的是当前处于活动状态的输入元素。例如，当你在填写表单时按下了 Tab\
  \ 键。下一个出现闪烁光标的表单字段就是具有“焦点”的字段。\n\n## 已访问\n\n已访问指的是你之前访问过的链接。\n\n### 样式化元素状态\n\n\
  为了为这些元素状态设置样式，你只需要使用类、ID 或其他技术定位 HTML 元素，然后在后面加上冒号和元素状态。\n\n这方面的一个例子可以在 CSS 雪碧图章节中找到，我在那里指定了图片的显示区域，用于普通社交媒体图标和用户悬停时的社交媒体图标。\n\
  \n# 第 20 章：值得考虑的实用技巧\n\n有一些 CSS 样式由于多种原因，我会在我写的每个样式表中加入这些样式。我们现在来了解一下。\n\n## 实用的\
  \ Internet Explorer 样式\n\n当你用链接包裹图片时，Firefox 和 Google Chrome 不会有这个问题。然而，出于某种原因，旧版\
  \ Internet Explorer 非常喜欢在所有被链接包裹的图片周围放置一个丑陋的蓝色边框。\n\n图 20.1 – 旧版 Internet Explorer\
  \ 曾在所有被链接包裹的图片周围放置一个丑陋的蓝色边框。使用 Internet Explorer 的开发者工具，我能够将页面显示为好像是在旧版 Internet\
  \ Explorer 中渲染的。红色圆圈圈出的是 Internet Explorer 开发者工具窗口中用于操作显示以反映旧版浏览器版本的区域。\n\n![](img/00067.jpeg)\n\
  \n显然，他们在新版 Internet Explorer 中修复了这个问题。然而，当你按下 `F12` 时可以打开开发者工具窗口。我用该窗口展示了网站在 Internet\
  \ Explorer 8 中的外观。\n\n如你所见，图片周围有一个蓝色边框。为了解决这个问题，我在每个样式表中添加以下样式。\n\n```css\na img\n\
  {\n    border:0 none transparent;\n}\n```\n\n它针对所有被 `a`（链接）包裹的 `img`（图片）。如果你不理解这个\
  \ CSS 声明，定义边框的标准格式是 `border: (宽度 像素) (样式：solid, dotted, dashed) (颜色);`。所以我指定了一个宽度为\
  \ 0 像素、无样式且颜色为 `transparent` 的边框。\n\n## 全局重置\n\n正如之前提到的，每个 HTML 元素都有默认样式。不同的浏览器在决定每个元素应该如何显示方面有一些自由度。\n\
  \n因此，许多人链接到一个称为“reset”的 CSS 样式表。这个样式表基本上以对所有现代浏览器统一的方式为每个元素设置样式。\n\n我觉得这不是必需的。但是我在所有样式表中使用以下样式。\n\
  \n```css\nhtml, body\n{\n    margin:0;\n    padding:0;\n}\n```\n\n有些人喜欢在 `html`\
  \ 和 `body` 后面加上 `*`。星号被称为“通配符”，基本上针对每个元素。然而，我觉得只指定 `html` 和 `body` 元素就足够了。\n\n##\
  \ 默认链接悬停样式\n\n当你开始对链接样式进行炫酷设计时，不要忘记设置“悬停”状态。\n\n通常你会完成一个链接，使其看起来像一个超级酷的按钮，然后你去测试它并说...“糟糕，当我悬停在这个按钮上时，文本变成蓝色并出现下划线”。\n\
  \n为了避免这种情况，请确保为悬停状态指定字体颜色，并且如果你不想出现下划线，请指定 `text-decoration: none;`。\n\n## 默认字体\n\
  \n\n\n默认情况下，字体将是 `Times New Roman`（或 Mac 对应字体）。为了绕过这一点，你可以在样式表的顶部通过针对 `body` 设置你选择的\
  \ `font-family` 来指定你想要的默认字体。\n\n```css\nbody {\n    font-family: Arial, Helvetica,\
  \ Sans-serif;\n}\n```\n\n# 第 21 章：Flash、Javascript 与 CSS 动画\n\n在过去，利用简单甚至是复杂的动画的唯一方法是使用\
  \ Flash 或 Javascript。然而，随着 CSS3 的出现，现在仅使用 CSS 就能实现动画！\n\n这是一个极好的消息，因为苹果产品讨厌 Flash，而且某些浏览器（尤其是\
  \ Internet Explorer）倾向于阻止 Javascript。\n\n但请记住，这些动画在旧版本的 Internet Explorer 浏览器中可能不支持。不过，这又有什么新鲜的呢。Internet\
  \ Explorer 往往不支持很多酷的 HTML/CSS 特性。\n\n我不会详细介绍如何使用 CSS 动画。但是，请记在心里，你可以完全使用 CSS 来制作元素的颜色、位置等。\n\
  \n你甚至可以设置时间延迟、动画速度以及其他在原生 CSS 中曾经无法实现的动画属性！\n\n# 第 22 章：验证与故障排除\n\n每个网页设计师的生命中总会有那么时刻，他们完全不知道为什么自己的代码不起作用。\n\
  \n幸运的是，我有几种不同的解决方案可以给你。\n\n## 开发者工具\n\n当我面对问题时，我做的第一件事之一是在查看网站的浏览器中使用开发者工具。\n\n\
  几乎每个现代浏览器都配备了开发者工具来帮助你检查代码。\n\nGoogle Chrome 恰好是我最喜欢的，因为你可以在开发者工具窗口中直接编辑 HTML 和\
  \ CSS，并在将其提交到文档之前预览更改。\n\n如果你发现某个 CSS 样式工作不正常，请检查你的开发者工具，看看是否有问题。\n\nGoogle Chrome\
  \ 的开发者工具窗口会对符合以下任何条件的 CSS 样式上划上斜线：\n\n*   编写错误\n*   为其他浏览器设计的（某些 CSS 样式尚未全局化，因此它们对\
  \ Mozilla 和基于 WebKit 的浏览器有不同的前缀）Google Chrome 会在所有基于 Mozilla 的样式上划上斜线\n\n图 22.1\
  \ – 开发者工具窗口正在告诉我由于某种原因样式未生效，样式旁边的警告符号让我知道它是无效的。\n\n![](img/00068.jpeg)\n上方你可以看到，定义错误的样式上有一个小的警告符号并划了斜线。我尝试为包裹在图像中的链接定义样式。我给它们设置了\
  \ `1` 像素宽的边框，细样式，然后我故意拼错了 turquoise（青松石），导致该样式无效。\n\n开发者工具还会告诉你你是否忘记链接文件、文件路径是否有效等。\n\
  \n## W3C 验证器\n\n诊断你的 HTML/CSS 的第二种方法是对其进行验证。W3C 代表万维网联盟（World Wide Web Consortium），所有的\
  \ HTML 都有标准。\n\n当你编写代码遇到特别困难时，验证代码并查看它是否报错会有帮助。有时你的代码运行不正常是因为它是无效的。\n\n只需访问 [`http://validator.w3.org/](http://validator.w3.org/)（或\
  \ Google W3C 验证器），就有几种不同的提交代码的方法。\n\n你可以提交整个 URL，可以通过文件上传提交，也可以直接复制整个 HTML 文档并粘贴到文本框中。\n\
  \n一旦 W3C 验证器检查了你的代码，它们会让你知道是否缺少标签、标签是否匹配，或者你是否执行了任何其他违反协议的操作。\n\n# 第 23 章：压缩后的 HTML/CSS\n\
  \n到此为止，我已经为你提供了大量关于编写代码的信息，以及使用 浏览器开发者工具检查他人代码的能力。我觉得有必要稍微介绍一点关于压缩后 HTML/CSS 的小知识。\n\
  \n正如我之前提到的，你的 HTML/CSS 格式化主要是为了你以及可能接触你代码的其他开发者。整洁地格式化你的代码使其更容易阅读、理解和编辑。\n\n然而，这种整洁的格式化仅对人类有效。浏览器是一台机器，格式化良好的代码对浏览器来说几乎没有意义，除了它试图读取的代码周围那些讨厌的空白之外。\n\
  \n出于这个原因，许多人倾向于压缩他们的 HTML 和 CSS。这意味着他们在格式化代码时去除了不必要的空白符。\n\n图 23.1 – 下方是压缩后的 CSS。压缩后的\
  \ CSS 浏览器加载所需的时间更短。\n\n![](img/00069.jpeg)\n上方你可以看到一些压缩后的 CSS 图像。正如你所看到的，这对人类眼睛来说很难阅读，但对于互联网浏览器来说，这种压缩后的\
  \ CSS 比未压缩的样式表节省加载时间。\n\n随着你编码技能的提高，你可能会选择压缩你的代码。有很多 CSS 和 HTML 压缩代码生成器，它们通过为你完成所有的压缩工作来变得简单。\n\
  \n我个人并不压缩我的 HTML，但我使用 [`http://www.cssminifier.com/](http://www.cssminifier.com/)\
  \ 来压缩我的 CSS 样式表。\n\n在压缩代码时，确保在文件中保留一个未压缩的版本，以防发生任何意外。\n\n# 第 24 章：网格系统\n\n我想简要提到一下网格系统，因为当我刚出道时，我非常喜欢这种被称为\
  \ 960 网格系统的系统。\n\n我的第一批网站都是 1000 像素宽的，我以前通常根据自己的判断来确定各个项目的宽度。例如，如果我正在做一个双栏布局，我可能会使用一个\
  \ 700 像素宽的内容区域和一个 300 像素宽的侧边栏。\n\n然后我发现了 960 网格系统。它背后的理念是，960 像素在最大值为 1000 像素的旧显示器和新的全分辨率屏幕之间达到了完美的平衡。\n\
  \n拥有 960 像素的容器在所有显示器上显示效果良好，而且 960 这个数字比例如 1000 更能被更多的数字整除。这样你就可以拥有 12 个等宽列。\n\n\
  ## 为什么使用网格系统？\n\n1. 网格系统由于许多原因让网页设计师的工作变得更容易：\n*   它们通常已经考虑了尺寸，因此设计师不需要再那么担心尺寸。\n\
  *   它们节省了时间，因为网页设计师不需要花费大量时间去思考特定对象有多宽、为不同尺寸的 div 起类名，或者为了正确的尺寸进行计算。\n2. 网格系统为 Bootstrap\
  \ 铺平了道路。Bootstrap 是许多网页设计师（包括我在内）使用的响应式网格系统。\n\n\n\n\n静态网站设计与响应式网站设计的一个区别在于，在响应式设计中，你需要指定屏幕宽度应该是网站的宽度。\n\
  \n你通过在文档的 `head` 部分添加一个声明来实现这一点。在此声明中，你还可以指定用户是否可以缩放以及缩放程度。\n\n```html\n<meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1\">\n```\n\n上述是这些声明之一的示例。\n\
  \n## 指定宽度\n\n在静态网站设计中，当我们创建一个 2 列布局时，我们会考虑列的像素宽度是多少并创建它们。然而，当涉及到响应式设计时，静态宽度是不够的。\n\
  \n当你希望对象的宽度随浏览器窗口的宽度变化时，必须使用百分比来指定宽度。\n\n这样，无论设备宽度是 1,200 像素还是 350 像素，你的网站都能保持比例。\n\
  \n## 响应式图片\n\n图片的宽度同样重要，因为随着屏幕变小，你的图片显然不能保持全分辨率，否则你的最终用户必须在手机上滚动才能看到整张图片。\n\n为了缓解这一点，你需要指定\
  \ 100% 或更小的宽度或最大宽度。高度可以通过简单地指定宽度为“auto”来自动调节。也就是说，相对于当前宽度的自动高度。\n\n## 响应式字体\n\n\
  显然，当屏幕很宽时，所有的 `Heading 1` 元素都可以很大，但当你在较小的屏幕上查看同一个网站时，该标题可能会占据整个屏幕。\n\n由于这不是构建网站最美观的方式，有些人喜欢使用\
  \ `em` 而不是像素来指定字体大小。\n\n我个人来说并不喜欢这样做，所以我将使用下一个主题来解决这个问题。\n\n## 响应式导航\n\n显然，当你的屏幕宽度达到\
  \ 1,000 像素以下时，你就不能再拥有宽大的导航栏了。在某个时刻，浏览器的宽度将窄到无法支持你的导航栏。\n\n然而，不要担心，因为有多种响应式导航解决方案可供选择。你只需要\
  \ Google 搜索一下即可！\n\n## 断点与媒体查询\n\n接下来的这两个主题是密不可分的。我还会提到，如果你打算进行响应式 Web 设计，你**需要**下载一个分辨率插件。也就是说，一个能告诉你在任何给定浏览器窗口宽度的插件。\n\
  \n这是因为当你处理响应式网站时，随着你缩小浏览器窗口，你需要确切知道网站**什么时候**开始看起来很奇怪。\n\n然后你就可以底气地说：“好的，当网站宽度小于\
  \ 1,000 像素时，这个对象就会错位。”这就是所谓的“断点”。\n\n然后你可以指定一个“媒体查询”，它说：当浏览器窗口宽度小于 1,000 像素时，执行此操作。显然，这可以是你想要的任何内容，因为你将使用\
  \ CSS 来实现你的意愿。\n\n媒体查询的工作方式是你可以说：当浏览器低于此宽度时执行此操作，当浏览器高于此宽度时执行此操作，或者当浏览器处于此宽度之间时执行此操作。\n\
  \n当浏览器低于此宽度时执行此操作。\n\n```css\n@media only screen and (max-width : 320px) {\n/* 样式写在这里\
  \ */\n}\n```\n\n当浏览器高于此宽度时执行此操作。\n\n```css\n@media only screen and (min-width :\
  \ 321px) {\n/* 样式写在这里 */\n}\n```\n\n当浏览器低于此宽度且高于此宽度时执行此操作。\n\n```css\n@media only\
  \ screen and (min-device-width : 768px) and (max-device-width : 1024px){\n/* 样式写在这里\
  \ */\n}\n```\n\n### 需要记住的\n\n记住，媒体查询应该放在 CSS 文档的末尾，因为在 CSS 中，底部的内容比文档顶部的内容优先级更高。\n\
  \n随着浏览器窗口变小，与该浏览器宽度相关的媒体查询将开始生效，而适用于较宽屏幕的 CSS 样式将回退。\n\n如果你遇到一个特别困难且不起的 CSS 样式，而且你尝试了所有方法并经过了“开发者工具”研究，那么你可以在\
  \ CSS 样式声明的分号之前添加 `!important`。`!important` 让 CSS 样优先级高于任何其他继承样式。\n\n## 第 26 章：网站图标\
  \ (Favicon)\n\n网站的锦上添花是网站图标。也就是与你的网站关联的 16x16 像素的小图像，当有人将你的网站添加到收藏夹时，它会随你的网站标题一起保存。\n\
  \n要创建网站图标，只需在 Photoshop 或你选择的图像编辑软件中创建一个 16x16 像素的文档。创建一个代表你网站的图标。由于你需要将文件保存为 `.png`，因此你的网站图标可以是透明的。\n\
  \n我随后使用 `http://favicon-generator.org/` 来生成我的网站图标。我将生成的文件保存在网站的根目录下。图标扩展名是 `.ico`，图标生成网站还会提供将图标附加到你网站所需的代码。该代码放在文档的\
  \ `head` 中。\n\n图 26.1 – 这个网站自我第一次使用它以来发生了变化。然而，在创建网站图标时，请确保选择“Generate only 16x16\
  \ favicon.ico”。这可以避免你下载不需要的无。\n\n# ![](images/0070.jpeg\n\n# 结论与后续步骤\n\n我希望你喜欢我的电子书。我真心希望我为你提供了可以建立的坚实知识基础。未来，网上有很多很棒的资源可以学习\
  \ HTML、CSS 以及 Javascript。\n\n我最喜欢的网站之一（我在那里学习了大部分的编程知识）是一个名为 `www.w3chools.com/`\
  \ 的网站。在那里，你将找到关于你可能想知道的代码几乎任何方面的简单教程。包括你的后续步骤，即进一步熟悉 HTML & CSS，并学习 Bootstrap（广泛使用的响应式网格系统）和响应式\
  \ Web 设计。\n\n当你遇到困境时，不要忘记使用你的 Google 。你将在那里找到我几个最喜欢的网站的资源。其中之一是 `www.stackoverflow.com/`。这个网站基本上是一个经验丰富的代码忍者组成的论坛，回答每个与代码相关的问题。\n\
  \n另一个我最喜欢的网站是 `www.css-tricks.com/`。在那里你将找到许多与 HTML & CSS 的绝佳资源。\n\n在我结束这本书之前，我要给你一个整本书中最重要的技巧之一。这是使我成为如此快速的编码员的技巧之一。\n\
  \n每当你 Google 搜索一个 HTML 元素或 CSS 样式时，如果你发现自己反复查找相同的内容，过一段时间，尝试将其记在脑子里。你记住的内容越多，你的速度就越快，因为你可以花更少的时间在互联网上寻找如何编写代码，花更多的时间在实际编写代码上。\n\
  \n非常感谢你的阅读！\n\n"
