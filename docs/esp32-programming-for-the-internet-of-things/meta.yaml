- md: "## 7.8. ESP32 server program for controlling two digital outputs and monitoring\
    \ one digital and one analog input via AJAX\n\n```cpp\nString State2=String(digitalRead(LED2));//Actual\
    \ state of the output\nString State3=String(digitalRead(Din1));\nString State4\
