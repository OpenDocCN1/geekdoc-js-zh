    # **a Mobile Application for ESP32 command using MIT App Inventor**


    We will use the MIT App Inventor online environment to build an Android-based
    client application that allows direct control of the LED_BUILTIN pin on the DOIT
    ESP32 DEVKIT board, following the steps outlined below.


    First, we build the graphical interface as in the example in Figure 3.3.


    From the left column, the User Interface category, two Button elements, and a
    WebViewer element are dragged onto the screen. Their parameters will be changed
    by selecting them in the middle-right column and editing them (colors, sizes,
    texts) in the rightmost column, as in the example in Figure 3.3.


    From the left column, the Layout category, we drag two HorizontalArrangement objects
    and conveniently place them above and below the buttons


    From the left column, from the Connectivity category, drag a WebViewer item. It
    will not be visible directly on the screen of the mobile device but will allow
    you to display the server''s web page just like in a browser.


    To be able to use also the links displayed by the browser created by WebViewer1,
    select this item in the middle right column and check in the right column FollowLinks.'
