    a blue LED on the GPIO2 user pin. There is a reset button (EN) and a boot one
    (only necessary in case of failure to load the program). In the following, the
    examples will use the ESP32 microcontroller, which is the best (about $ 10), but
    the programs shown may be adjusted using minor changes for ESP8266 microcontroller
    (below 5 dollars). Mainly, it would be necessary to replace terms such as "ESP32
    ..." with "ESP8266 ..." and define the used pins, depending on the card used.


    As the integrated development environment, we will use the Arduino IDE, which
    is extremely simple and powerful enough for undemanding applications. The main
    drawback is the lack of Arduino IDE support for debugging; that is why, for more
    complex applications, it is recommended to use more powerful programs such as
    ESP IDF. However, they have the disadvantage of a very long time required for
    the first build.'
  - '[PAGE 13]


    ![](img/bc50e9ed6994305c0caada2236432c8a_13_0.png)


    **Figure** The pinout for ESP32 boards with 30 pins


