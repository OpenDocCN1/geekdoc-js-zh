- md: "**Figure 2.9.** The Android Simulator for the MIT App Inventor program\n\n\
    ## command of a GPIO port via WiFi\n\nVarious commands can be sent, through the\
    \ web page created by the ESP32 server, to the GPIO (General Port Input / Output)\
    \ ports of that board. The computer or mobile device on which the web page is\
    \ running is a server's client that can be read with client.read instructions,\
    \ periodically called in the main loop of the ESP32 board. Depending on the data\
    \ sent by the client, the server program can execute various commands through\
    \ standard C instructions.\n\n## a web page for submitting commands from a browser\n\
    \nIn the following, we will exemplify a WiFi command of the status of an ESP32\
    \ GPIO pin. First, a web page with two hyperlinks will be created to turn ON/OFF\
    \ the LED_BUILTIN (GPIO2 of the DOIT ESP32 DEVKIT V1 board). For this, some modifications\
    \ and additions will be made in the previous program.\n\nIn the declarations section,\
    \ the String request variable is declared, and in the setup section, the programming\
    \ statement pinMode(LED_BUILTIN, OUTPUT) is used.\n\nThe processing of the data\
    \ received from the client is done with the sequence:\n\n```\nrequest = client.readStringUntil('\\\
    r');\nSerial.println(request);\n```\n\n```\nif (request.indexOf(\"ON\")!=-1) digitalWrite(LED_BUILTIN,\
    \ HIGH);\nif (request.indexOf(\"OFF\")!=-1) digitalWrite(LED_BUILTIN, LOW);\n\
    ```\n\nWe may note that a string is being read from the client (CR terminated)\
    \ and then a substring (\"ON\") or another (\"OFF\") is searched in it. Depending\
    \ on the found substring, the respective write instructions change the output\
    \ pin state. If the string is not found, the instruction request.indexOf(\"...\"\
    ) returns the value -1.\n\nIn the part of generation of the web page, two instructions\
    \ for inserting the hyperlinks are used:\n\n```\nclient.print(\"Click <a href=\\\
    \"LED=ON\\\"> here to turn the LED on\");\nclient.print(\"Click <a href=\\\"LED=OFF\\\
    \"> here to turn the LED off\");\n```\n\nNote that standard HTML instructions\
    \ are sent using the client.print() statement as in the previous program.\n\n\
    So, the complete program in Arduino IDE will be as in Figure 3.1\n\n```\n#include\
    \ <WiFi.h>\nconst char* ssid=\"SSID\";\nconst char* pass=\"password\";\nWiFiServer\
    \ server(85);\nvoid setup() {\n  Serial.begin(115200);\n```\n\n```\npinMode(LED_BUILTIN,OUTPUT);\n\
    \    delay(10);\n\n    WiFi.begin(ssid,pass);\n    while(WiFi.status()!=WL_CONNECTED){\n\
    \        delay(500);\n        Serial.print(\".\");\n    }\n    Serial.println(WiFi.localIP());\n\
    \    server.begin();\n}\nvoid loop() {\n    WiFiClient client=server.available();\n\
    \    if (!client) {return;}\n    String request=client.readStringUntil('\\r');\n\
    ```\n\n```\nSerial.println(request);\nif (request.indexOf(\"ON\")!=-1) digitalWrite(LED_BUILTIN,HIGH);\n\
    if (request.indexOf(\"OFF\")!=-1) digitalWrite(LED_BUILTIN,LOW);\n// Return the\
    \ response\nclient.println(\"HTTP/1.1 200 OK\");\nclient.println(\"Content-Type:\
    \ text/html\");\nclient.println(\"\"); // Mandatory in the web page\n```\n\n```\n\
    client.print(\"Click <a href=\\\"LED=ON\\\">here to turn the LED on.\");\nclient.print(\"\
    Click <a href=\\\"LED=OFF\\\">here to turn the LED off.\");\nclient.println(\"\
    </body></html>\");\nclient.println(\"\");\nclient.println(\"© Hyperion\");\nclient.println(\"\
    \");\nclient.flush(); //Mandatory reinitialize\n    delay(1);\n```\n\n```\n}\n\
    ```\n\n## Figure 3.1. Program for controlling a digital output via HTML\n\nAfter\
    \ compiling and loading the program in ESP32, it will connect to the router with\
    \ the specified SSID and Password and receive an IP displayed on the Serial monitor.\
    \ If this IP is reserved in DHCP, and port 80 is forwarded on the router to that\
    \ IP, a browser may access directly to the router's WAN address. The web page\
    \ displayed by the browser will be as in the example in Figure 3.2.\n\nBy clicking\
    \ on the first link, the LED on the ESP32 board will be ON, and with a click on\
    \ the second link, it will turn OFF. Of course, you can change the output pin\
    \ (in this case defined by the LED_BUILTIN constant in the included header \"\
    WiFi.h\"), and you can enter other pins in the ESP32 program using C instructions.\
    \ Other commands in the browser may also be included using HTML instructions,\
    \ and other webpage structures may be sent with client.print() commands.\n\n**Figure\
    \ 3.2.** The web page for a digital command of a pin of the ESP32 module\n\n##\
    \ a Mobile Application for ESP32 command using MIT App Inventor\n\nWe will use\
    \ the MIT App Inventor online environment to build an Android-based client application\
    \ that allows direct control of the LED_BUILTIN pin on the DOIT ESP32 DEVKIT board,\
    \ following the steps outlined below.\n\nFirst, we build the graphical interface\
    \ as in the example in Figure 3.3.\n\nFrom the left column, the User Interface\
    \ category, two Button elements, and a WebViewer element are dragged onto the\
    \ screen. Their parameters will be changed by selecting them in the middle-right\
    \ column and editing them (colors, sizes, texts) in the rightmost column, as in\
    \ the example in Figure 3.3.\n\nFrom the left column, the Layout category, we\
    \ drag two HorizontalArrangement objects and conveniently place them above and\
    \ below the buttons.\n\nFrom the left column, from the Connectivity category,\
    \ drag a WebViewer item. It will not be visible directly on the screen of the\
    \ mobile device but will allow you to display the server's web page just like\
    \ in a browser.\n\nTo be able to use also the links displayed by the browser created\
    \ by WebViewer1, select this item in the middle right column and check in the\
    \ right column FollowLinks.\n\n**Figure 3.3.** MIT App Inventor application for\
    \ a digital command – the graphical interface\n\nBuild the chart of the program\
    \ blocks by clicking the Blocks button on the top right, as in the example in\
    \ Figure 3.4:\n\nFrom the Variables category, drag the element Initialize global\
    \ and insert www and the address (local according to the DHCP, with port 85, or\
    \ external if you have routed it to port 85);\n\nFrom the Screen1 category, drag\
    \ the element WhenScreen1.Initialize;\n\nFrom the Screen1 -> Button1 category,\
    \ drag WhenButton1.Click and similar for Button2.\n\nFrom the category Screen1\
    \ -> WebViewer1 drag WebViewer1.GoToUrl and from the Built-In -> Text category,\
    \ drag the first element (A text string), and use \"global www\". From the category\
    \ Screen1 -> Web1, drag the Web1.Url element to the -> Text category, drag the\
    \ join element to which two strings are attached, forming the address \"global\
    \ www / LED = ON\" as in the example in Figure 3.4.\n\nRepeat previous operations\
    \ for Button2 with address \"global www / LED = OFF\".\n\n**Figure 3.4.** MIT\
    \ App Inventor application for a digital command - the program's blocks\n\nAfter\
    \ launching aiStarter, using the USB mobile device or the emulator, you can run\
    \ the ESP32 control panel application, which will look like in the example in\
    \ Figure 3.5. The command can be made either by buttons or by hyperlinks (due\
    \ to the WebViewer1 element, which can be omitted if there is no need for additional\
    \ browser display).\n\n**Figure 3.5.** MIT App Inventor application for a digital\
    \ command - the Android emulator\n\n## use of a port different from 80\n\nIf the\
    \ router to which ESP32 is to be connected has the port 80 forwarded for another\
    \ device, you may use another port, for example, 85. For this, modify the object\
    \ server() in the Arduino program, as in Figure 2.6. and also edit the Port Forward\
    \ in the WAN menu of the router, as in the example in Figure 3.6. (where we used\
    \ an ASUS RT-N12N + router). Of course, first make a reservation (manual assignment)\
    \ in DHCP for the desired IP for the ESP32 server, as in figure 3.7, or a static\
    \ IP may be used, as in the following chapter.\n\n### LAN - DHCP Server\n\nDHCP\
    \ (Dynamic Host Configuration Protocol) is a protocol for the automatic configuration\
    \ used on IP networks. The DHCP server can assign each client an IP address and\
    \ informs the client of the DNS server IP and default gateway IP. RT-N12+ supports\
    \ up to 253 IP addresses for your local network.\n\n### Basic Config\n\n| Setting\
    \ | Value |\n|---------|-------|\n| Enable the DHCP Server | Yes ● No |\n| RT-N12+'s\
    \ Domain Name | Etaj |\n| IP Pool Starting Address | 192.168.1.64 |\n| IP Pool\
    \ Ending Address | 192.168.1.254 |\n| Lease time | 86400 |\n| Default Gateway\
    \ | 192.168.1.1 |\n\n### DNS and WINS Server Setting\n\n| Setting | Value |\n\
    |---------|-------|\n| DNS Server | |\n| WINS Server | |\n\n### Enable Manual\
    \ Assignment\n\nEnable Manual Assignment: ● Yes No\n\n### Manually Assigned IP\
    \ around the DHCP list (Max Limit : 64)\n\n| Client Name (MAC address) | IP Address\
    \ | Add / Delete |\n|---------------------------|------------|-------------|\n\
    | espressif 24:0A:C4:10:4A:18 | 192.168.1.245 | - |"
  mdcn: "\n**图 2.9.** MIT App Inventor 程序的 Android 模拟器\n\n## 通过 WiFi 控制 GPIO 端口\n\n\
    可以通过 ESP32 服务器创建的网页，向该开发板的 GPIO（通用端口输入/输出）端口发送各种命令。运行网页的计算机或移动设备是服务器的客户端，可以通过\
    \ `client.read` 指令读取，该指令在 ESP32 开发板的主循环中定期调用。根据客户端发送的数据，服务器程序可以通过标准 C 指令执行各种命令。\n\
    \n## 用于从浏览器提交命令的网页\n\n下面，我们将举例说明如何通过 WiFi 控制 ESP32 GPIO 引脚的状态。首先，创建一个包含两个超链接的网页，用于打开/关闭\
    \ LED_BUILTIN（DOIT ESP32 DEVKIT V1 开发板的 GPIO2）。为此，将对之前的程序进行一些修改和补充。\n\n在声明部分，声明\
    \ String 类型的变量 request，在 setup 部分，使用编程语句 `pinMode(LED_BUILTIN, OUTPUT)`。\n\n处理从客户端接收到的数据使用以下代码序列：\n\
    \n```\nrequest = client.readStringUntil('\\r');\nSerial.println(request);\n```\n\
    \n```\nif (request.indexOf(\"ON\")!=-1) digitalWrite(LED_BUILTIN, HIGH);\nif (request.indexOf(\"\
    OFF\")!=-1) digitalWrite(LED_BUILTIN, LOW);\n```\n\n我们可以看到，从客户端读取一个字符串（以 CR 结尾），然后在其中搜索子字符串（\"\
    ON\"）或另一个子字符串（\"OFF\"）。根据找到的子字符串，相应的写入指令改变输出引脚状态。如果未找到该字符串，指令 `request.indexOf(\"\
    ...\")` 返回值 -1。\n\n在生成网页的部分，使用两条插入超链接的指令：\n\n```\nclient.print(\"Click <a href=\\\
    \"LED=ON\\\"> here to turn the LED on\");\nclient.print(\"Click <a href=\\\"LED=OFF\\\
    \"> here to turn the LED off\");\n```\n\n请注意，使用 `client.print()` 语句发送标准 HTML 指令，与之前的程序相同。\n\
    \n因此，Arduino IDE 中的完整程序如图 3.1 所示\n\n```\n#include <WiFi.h>\nconst char* ssid=\"\
    SSID\";\nconst char* pass=\"password\";\nWiFiServer server(85);\nvoid setup()\
    \ {\n  Serial.begin(115200);\n```\n\n```\npinMode(LED_BUILTIN,OUTPUT);\n    delay(10);\n\
    \n    WiFi.begin(ssid,pass);\n    while(WiFi.status()!=WL_CONNECTED){\n      \
    \  delay(500);\n        Serial.print(\".\");\n    }\n    Serial.println(WiFi.localIP());\n\
    \    server.begin();\n}\nvoid loop() {\n    WiFiClient client=server.available();\n\
    \    if (!client) {return;}\n    String request=client.readStringUntil('\\r');\n\
    ```\n\n```\nSerial.println(request);\nif (request.indexOf(\"ON\")!=-1) digitalWrite(LED_BUILTIN,HIGH);\n\
    if (request.indexOf(\"OFF\")!=-1) digitalWrite(LED_BUILTIN,LOW);\n// Return the\
    \ response\nclient.println(\"HTTP/1.1 200 OK\");\nclient.println(\"Content-Type:\
    \ text/html\");\nclient.println(\"\"); // Mandatory in the web page\n```\n\n```\n\
    client.print(\"Click <a href=\\\"LED=ON\\\">here to turn the LED on.\");\nclient.print(\"\
    Click <a href=\\\"LED=OFF\\\">here to turn the LED off.\");\nclient.println(\"\
    </body></html>\");\nclient.println(\"\");\nclient.println(\"© Hyperion\");\nclient.println(\"\
    \");\nclient.flush(); //Mandatory reinitialize\n    delay(1);\n```\n\n```\n}\n\
    ```\n\n## 图 3.1. 通过 HTML 控制数字输出的程序\n\n在 ESP32 中编译并加载程序后，它将使用指定的 SSID 和密码连接到路由器，并在串口监视器上显示接收到的\
    \ IP。如果此 IP 在 DHCP 中保留，并且路由器上的 80 端口转发到该 IP，浏览器就可以直接访问路由器的 WAN 地址。浏览器显示的网页将如图\
    \ 3.2 中的示例所示。\n\n点击第一个链接，ESP32 开发板上的 LED 将点亮，点击第二个链接，LED 将熄灭。当然，你可以更改输出引脚（在本例中由包含的头文件\
    \ \"WiFi.h\" 中定义的 LED_BUILTIN 常量），并且可以使用 C 指令在 ESP32 程序中输入其他引脚。还可以使用 HTML 指令在浏览器中包含其他命令，并且可以使用\
    \ `client.print()` 命令发送其他网页结构。\n\n**图 3.2.** ESP32 模块引脚数字命令的网页\n\n## 使用 MIT App\
    \ Inventor 开发用于 ESP32 控制的移动应用程序\n\n我们将使用 MIT App Inventor 在线环境构建一个基于 Android 的客户端应用程序，允许直接控制\
    \ DOIT ESP32 DEVKIT 开发板上的 LED_BUILTIN 引脚，按照以下概述的步骤进行。\n\n首先，我们构建图形界面，如图 3.3 中的示例所示。\n\
    \n从左栏的\"用户界面\"类别中，将两个**按钮**元素和一个**WebViewer**元素拖到屏幕上。通过在中右栏中选择它们并在最右栏中编辑（颜色、大小、文本）来更改它们的参数，如图\
    \ 3.3 中的示例所示。\n\n从左栏的\"布局\"类别中，拖动两个 **HorizontalArrangement** 对象，并将它们方便地放置在按钮的上方和下方。\n\
    \n从左栏的\"通信连接\"类别中，拖动一个 **WebViewer** 项目。它在移动设备的屏幕上不会直接可见，但可以让你像浏览器一样显示服务器的网页。\n\
    \n为了能够使用 WebViewer1 创建的浏览器显示的超链接，请在中右栏中选择此项，并在右栏中勾选 **FollowLinks**。\n\n**图 3.3.**\
    \ MIT App Inventor 数字命令应用程序——图形界面\n\n通过点击右上角的 **Blocks** 按钮构建程序块图表，如图 3.4 中的示例所示：\n\
    \n从**变量**类别中，拖动 **Initialize global** 元素并插入 www 和地址（根据 DHCP 的本地地址，端口为 85，或者如果已路由到端口\
    \ 85 则为外部地址）；\n\n从 **Screen1** 类别中，拖动 **WhenScreen1.Initialize** 元素；\n\n从 **Screen1\
    \ -> Button1** 类别中，拖动 **WhenButton1.Click**，Button2 类似操作。\n\n从类别 **Screen1 ->\
    \ WebViewer1** 拖动 **WebViewer1.GoToUrl**，从**内置 -> 文本**类别中，拖动第一个元素（文本字符串），并使用 \"\
    global www\"。从类别 **Screen1 -> Web1** 中，将 **Web1.Url** 元素拖动到 -> **文本**类别中，拖动 **join**\
    \ 元素，附加两个字符串，形成地址 \"global www / LED = ON\"，如图 3.4 中的示例所示。\n\n对 Button2 重复上述操作，地址为\
    \ \"global www / LED = OFF\"。\n\n**图 3.4.** MIT App Inventor 数字命令应用程序——程序块\n\n\
    启动 aiStarter 后，使用 USB 移动设备或模拟器，你可以运行 ESP32 控制面板应用程序，其外观将如图 3.5 中的示例所示。命令可以通过按钮或超链接发出（由于\
    \ WebViewer1 元素，如果不需要额外的浏览器显示，可以省略它）。\n\n**图 3.5.** MIT App Inventor 数字命令应用程序——Android\
    \ 模拟器\n\n## 使用 80 以外的端口\n\n如果 ESP32 要连接的路由器已将 80 端口转发给另一台设备，你可以使用另一个端口，例如 85。为此，在\
