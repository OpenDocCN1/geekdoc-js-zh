    **Figure 1.17.** The pinout for ESP32 boards with 36 pins


    **ESP32 / ESP8266 IoT applications by using HTML / JavaScript**'
  - '[PAGE 14]


    Using standard HTML technologies allow much flexibility, as the possible combination
    with other web technologies can achieve any parameters of the GUI. The price is
    a large amount of code that must be done manually, but this criterion is usually
    not prohibitive.


    In the following, for programming the ESP microcontrollers in C, we will use the
    programming environment Arduino IDE, which has the advantage of great simplicity,
    allowing very rapid application development. The main disadvantage is the lack
    of tools for debugging programs, for which it will present later an advanced Integrated
    Development Environment, the ESP-IDF official programming tool.


    # IDE installation for ESP microcontrollers


    +   Preparing for programming ESP32/ESP8266 microcontrollers in Arduino IDE require
    the following steps:

    - Install the latest version of Arduino IDE at https://www.arduino.cc/en/Main/Software

    - Go to File-> Preferences and write in Additional Boards Manager URLs: http://arduino.esp8266.com/stable/package_esp8266com_index.json
    https://dl.espressif.com/dl/package_esp32_index.json separated by a comma.

    - Go to Tools-> Boards-> Boards Manager;

    - At the end of the list, click the cell esp8266 ESP8266 Community and Install.

    - Before the end of the list, click the cell esp32 by Espressif Systems and Install.

    - Insert the ESP8266 or ESP32 board, and install the drivers.'
  - '[PAGE 15]


    # server using the ESP32 board


    For a minimal web site using ESP32 as a server, we proceed as will be shown below.

    Open Arduino IDE, choose the board and serial port and open File-> Examples->
    ESP32 DEVKIT V1-> WiFi-> SimpleWiFiServer;

    Copy the standard statement and initialization portion with the minimum required
    as in the example in Figure 2.2;

    In the loop() enter the instructions for client search and for writing the HTML
    text. This is transmitted with several lines using the client.println("....")
    instruction. An example of the main loop for a web page created by the server
    is in Figure 2.2;'
