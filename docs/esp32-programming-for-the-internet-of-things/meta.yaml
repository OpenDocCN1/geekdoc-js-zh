  md: '# principles of analog and digital transmissions


    An example of a program running on an ESP32 server, able to receive both digital
    values (using buttons) and analog values (using the cursor) from a client, is
    described below.


    For analog values on the outputs, you may use the Pulse Width Modulation technique
    - PWM. The analogWrite() instruction existing in Arduino IDE is implemented so
    far only for the ESP8266 microcontroller (with 10 bits resolution), so for ESP32
    we will use the ledcAttachPin(), and ledcDetachPin() instructions.


    As with other microcontrollers, some GPIO pins of the ESP32 microcontroller can
    generate rectangular PWM pulses. After an integration (thus filtering out the
    alternative components and keeping only the continue component), these pulses
    are converted to continue levels between 0 and 3V when the fill factor varies
    between 0% and 100%. This mode of operation is equivalent to digital-to-analog
    conversion (DAC), without the need for such an integrated converter. Conversion
    voltage resolution is given by the number of steps used by the pulse generator,
    typically between 8 and 16 bits resolution, according to the following general
    relationships.


    For an n-bit resolution of the counter, the number of steps is:


    The voltage resolution is:'
