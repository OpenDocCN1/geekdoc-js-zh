    In order to transmit status information, the server will include in the main loop
    their values, followed by instructions to display them on the web page. In the
    following example, it is assumed that a potentiometer on the Ao input is coupled
    (the second top-left for DOIT ESP32 with 36 pins), which will simulate the input
    of an analog signal similar to those transmitted by the transducers. In addition,
    a button on the input of the GPIO13 that will simulate a logic signal (ON / OFF)
    from a sensor.


    ```

    String buton=String(digitalRead(13));

    ```'
  - '[PAGE 82]


    ```

    String a = String(analogRead(Ao)/41);

    ```


    Since the analog-digital converter of ESP32 has 12 bits, the maximum result of
    the conversion is 4095. To scale in the range 0-100, the result has been divided
    by 41. This somewhat loads the ESP32 microcontroller, the alternative being to
    make scaling in the application on the mobile device, but this would increase
    by 2 the number of characters in the block sent by the server.


    To display the respective values on the page, in the transmitted sequence we will
    insert a header for each status information followed by the string containing
    the information. In the following example, the headers are "But" respectively
    "Pot", the first one followed by a character (0 or 1) and the second by three
    characters (0-100). Such instructions can be entered in the HTML section:


    ```

    client.println("But");

    client.println(button);

    client.println("Pot");

    client.println(a);

    ```'
  - '[PAGE 83]


    Obviously, the states of other analog or digital inputs can also be inserted using
    the same method, depending on the application.


    In the graphical interface of the MIT application, elements of server status display
    should be added. In the following example, a Label element was added for the GPIO13
    logical value, a button with changing color (yellow/blue - depending on this state)
    and a Thumbnail slider to display the analogue value on A0. These will be set
    in the graphical interface of the MIT application according to your preferences.


    In the MIT application, a block must also be added to identify the server''s entry
    state information and to execute the instructions for display at the client.


    First, two global variables will be initialized: "global raspuns" to display digital
    input''s state and "global raspunsAna" to display the analogue information.


    As can be seen in Figure 5.3, from the full "responseContent" text sent by the
    server, the "But" string''s index is searched for, and a "global raspuns" character
    is separated starting from position 5 of this index (there are two characters
    interpreted as space in the full string) - the red ellipse.


    Then modify the text for Label1 using the content of this sub-string and, finally,
    by comparing it with "1", set the color for Button1 - yellow ellipse. Similarly,
    separate and then display on the Slider2 the sub-string indicating the analogue
    value - the blue ellipse.'
