- md: "## 12.9. The ESP32 program for one analog and 3 digital outputs, 4 digital\
    \ inputs and one analog input, MQTT3od1oa4id1ia\n\nIn the application window,\
    \ to display the state of digital inputs, \"Power\" widgets are used, which can\
    \ be entered in HelloIoT, as in the example in Figure 12.10.\n\n![](img/bc50e9ed6994305c0caada2236432c8a_285_0.png)\n\
    \n**Figure 12.10.** The HelloIoT application window for the introduction of a\
    \ Power widget\n\n![](img/bc50e9ed6994305c0caada2236432c8a_286_0.png)\n\n**Figure\
    \ 12.11.** The HelloIoT Application window for the introduction of a Bulb widget\n\
    \nTo display the state of the touch inputs, we chose here Bulb type elements introduced\
    \ as in figure 12.11.\nThe second Numbers unit will have the topic modified in\
    \ code and minimum/maximum values, as in figure 12.12. Observe that some widgets\
    \ were displayed in the Panel window: NumberChart and two types of Gauge. Also,\
    \ to separate digital and analog inputs, two horizontal lines were added at the\
    \ end of the code.\n\n![](img/bc50e9ed6994305c0caada2236432c8a_287_0.png)\n\n\
    **Figure 12.12.** Window for the introduction of monitoring widgets\n\nFigure\
    \ 12.13 shows the graphical interface of the HelloIot application for the [MQTT3odIo4idTia](MQT3odIo4idTia)\
    \ program, which shows various types of input and output widgets, selectable in\
    \ a similar way to the example in Figure 12.7.\n\n![](img/bc50e9ed6994305c0caada2236432c8a_288_0.png)\n\
    \n**Figure 12.13.** Graphical interface of HelloIoT for the MQTT3od1o4id1ia program\n\
    \nExamples of some configuration steps for other MQTT applications are shown in\
    \ Figures 12.14 and 12.15.\n\n![](img/bc50e9ed6994305c0caada2236432c8a_289_0.png)\n\
    \n**Figure 12.14.** Example of a configuration step for the CloudMQTT application\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_290_0.png)\n\n**Figure 12.15.** Example\
    \ of a configuration step for the MQTTlens application\n\n## MQTT communications\
    \ using Node-Red development environment\n\nNode-Red is a development tool for\
    \ visual programming, developed by IBM and designed specifically for IoT applications.\
    \ It is based on Node.js and, through the graphical interconnection of nodes,\
    \ generates internal code for JavaScript functions.\n\nThis environment has the\
    \ advantage that it allows the rapid development of a web page (Figure 13.1) for\
    \ command and monitoring a large number of clients, directly from a browser, without\
    \ the need for an application installed on each client, such as in the examples\
    \ presented before.\n\n![](img/bc50e9ed6994305c0caada2236432c8a_291_0.png)\n\n\
    **Figure 13.1.** Use of a web browser for MQTT monitors and commands\n\nFrom the\
    \ user's point of view, a problem with Nod-Red is that it must be run throughout\
    \ its use. For this, you can use a public broker (with limitations and possible\
    \ costs) or run it on a PC under Windows or another type of system such as a Raspberry\
    \ Pi under Raspbian.\n\n### the Node-Red in Windows\n\nFor Windows, you must first\
    \ download node.js from the official page after which it is installed by executing\
    \ the file. You must restart Windows after installation of node.js.\n\nTo install\
    \ Node-Red, open Command Prompt and give the command:\n\n```\nnpm install -g --unsafe-perm\
    \ node-red\n```\n\nStarting the node-red is done from the Command Prompt:\n\n\
    ```\nC:\\[...]node-red\n```\n\nIt must remain running for the entire duration\
    \ of using Node-Red, both for program development and the use of a program. If\
    \ it is not desired to continuously run it on a PC under Windows, it is advisable\
    \ to use a mini PC, such as Raspberry Pi, as will be shown later.\n\nThe Node-Red\
    \ environment can be used by entering the address in the browser:\n\n![](img/bc50e9ed6994305c0caada2236432c8a_293_0.png)\n\
    \n**Figure 13.2.** Node-RED Page Menu\n\nFor using of widgets, the Dashboard must\
    \ be added. This is done by selecting the Manage palette in the menu (top right,\
    \ figure 13.2). In the Install tab, search for the Dashboard (Figure 13.3) and\
    \ Install. After installation, in the Node-Red page accessed from a browser, the\
    \ Dashboard elements appear at the bottom of the left panel.\n\n![](img/bc50e9ed6994305c0caada2236432c8a_294_0.png)\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_295_0.png)\n\n**Figure 13.3.** Adding\
    \ the Dashboard to the Node-RED page\n\nAdditional details about the use of Node-Red\
    \ can be found on the Internet, for example on the page\n\nhttp://www.iotsharing.com/2018/05/how-to-build-iot-dashboard-using-node-red.html\n\
    \n### mosquitto in Windows\n\nFor using Node-Red in Windows, it is necessary to\
    \ specify a broker. It can be a public one, installed on a cloud, such as or another\
    \ one listed above.\n\nFor the sake of security, you can use a local broker running\
    \ under Windows, such as Mosquitto - which will be further used in examples. However,\
    \ since it has to be running throughout the use of MQTT, it is recommended that\
    \ Node-Red and the broker program be installed on a mini PC made with Raspberry\
    \ Pi or equivalent, which, with low consumption and high safety, may remain in\
    \ operation permanently.\n\nThe installation is done by downloading the file corresponding\
    \ to the Windows version, for example, from the internet page\n\nhttps://mosquitto.org/download/\
    \ . By running it, installation occurs, default to C:\\Program Files\\mosquitto.\n\
    \nStarting the broker can be done manually by running the mosquitto.exe application,\
    \ or it can be set to automatically start it at startup (usually this is by default).\n\
    \n### MQTT communications via Node-Red\n\nTo use Node-Red installed in Windows,\
    \ enter in browser the local or public address of your PC.\n\nThe local address\
    \ can be used only if all ESP32 devices are connected to the same WiFi network\
    \ with PC. This address can be found either in network settings (if DHCP is not\
    \ used) or in the router.\n\nOf course, assigning a static PC address and entry\
    \ from its public IP is more advantageous, allowing client devices to be used\
    \ from anywhere from outside.\n\nAssigning a static address can be done in the\
    \ Network and Sharing Center -> Change adapter settings, where IPv4 will specify\
    \ the desired IP along with the other parameters. It is necessary to pair the\
    \ computer's MAC address with this address to be reserved on the router if DHCP\
    \ is active.\n\nTo access the Node-Red services on the 1880 port, and the Mosquitto\
    \ port on the 1883 port, these ports must be routed to the local IP of the PC,\
    \ as exemplified in figures 2.5 or 3.8. For example, if the local IP of the PC\
    \ is 192.168.1.50, the ports 1880 and 1883 of the router must be forwarded to\
    \ 192.168.1.50, and another device in this LAN may access the page at 192.168.1.50:1880/ui.\n\
    \n```cpp\nSerial.println(topic);\nString s;\nSerial.print(\"payload: \");\nfor\
    \ (int i = 0; i < length; i++) {\n  s+=(char)payload[i];\n}\nSerial.println(s);\n\
    if ((char)topic[0]=='D'){\n  if ((char)topic[10]=='1'){\n    if ((char)payload[0]=='1')digitalWrite(led1,\
