  md: '# type elements designed through CSS


    A widespread element for graphical monitoring of an analog value is the Progressbar
    object. It can be created through HTML/CSS and manipulated by JavaScript, as will
    be exemplified below.


    Although it is possible to use the HTML object "meter" for analog values monitoring
    (as will be exemplified in a later chapter), we will present it here an implementation
    using CSS (Cascading Style Sheets), to familiarize the reader with the style techniques.


