- img_proc: true
  md: '```

    String a = String(analogRead(Ao)/41);

    ```


    Since the analog-digital converter of ESP32 has 12 bits, the maximum result of
    the conversion is 4095. To scale in the range 0-100, the result has been divided
    by 41. This somewhat loads the ESP32 microcontroller, the alternative being to
    make scaling in the application on the mobile device, but this would increase
    by 2 the number of characters in the block sent by the server.


    To display the respective values on the page, in the transmitted sequence we will
    insert a header for each status information followed by the string containing
    the information. In the following example, the headers are "But" respectively
    "Pot", the first one followed by a character (0 or 1) and the second by three
    characters (0-100). Such instructions can be entered in the HTML section:


    ```

    client.println("But");

    client.println(button);

    client.println("Pot");

    client.println(a);

    ```'
