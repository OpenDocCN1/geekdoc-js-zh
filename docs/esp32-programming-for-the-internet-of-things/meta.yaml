  md: 'In the last decades, more and more objects in the industrial, commerce, infrastructure,
    and even consumption sectors have been equipped with various automation, electronics,
    and computer applications. Many of the hotspots of these systems already include
    local artificial intelligence and numerous facilities to assist human intelligence.


    Gradually, in modern factories, more and more subsystems have been interconnected,
    changing information, and greatly improving productivity through such Machine-to-Machine
    (M2M)


    At the same time, the global communications network - the Internet - has grown
    and developed, connecting desktops, laptops, tablets, smartphones, and other human-operated
    devices.


    So, on the one hand, machines were communicating locally and, on the other hand,
    people communicating globally. The next step was, of course, the merger of all
    these exchanges of information into a new level - the Internet of Things - Through
    this, computer-aided devices have gained global access via the Internet, and human
    users have gained access to monitoring and commanding them at any distance.


    The analysis of the two types of information transmission nodes shows a very high
    difference in speed so that the computer devices have many orders of magnitude
    of speed over the human operators. However, it seems that only starting with 2009
    the numerical report has become favorable to the first category so that a very
    large field of Internet connection is still open. It is estimated that the number
    of IoT components will reach 12 in 2030, which will probably generate a fourth
    Industrial Revolution, already called Industry 4.0.


    A huge task, requiring highly qualified specialists, and simple and less costly
    solutions. An important step in this direction was the emergence of the microcontrollers
    with very low-cost WiFi connections produced by Espressif Systems, which allow
    the fast and independent qualification of those who already have'
