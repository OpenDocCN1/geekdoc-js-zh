    \ 12.7).\n\n![](img/bc50e9ed6994305c0caada2236432c8a_274_0.png)\n\n**Figure 12.7.**\
    \ Changes made in the code of some widgets for bringing them in the Panel window\n\
    \nAfter connecting, the Numbers window can be viewed from the upper left menu,\
    \ where you can see different types of widgets corresponding to the type Code.\
    \ From these, SliderSimple was moved into the Panel, as well as the line that\
    \ gives the fill factor chart.\n\n![](img/bc50e9ed6994305c0caada2236432c8a_275_0.png)\n\
    \n**Figure 12.8.** Panel window with a chart element and a slider type one\n\n\
    ## 1. General presentation of the book and hardware modules of digital and analog\
    \ inputs\n\nTo be able to read digital inputs, the inputMode with INPUT_PULLUP\
    \ must be set on the pins, then, in the infinite loop, the DigitalRead instruction\
    \ will be used, followed by publishing the topic and the Boolean payload.\n\n\
    The touch inputs will be read by the touchRead instruction and the value will\
    \ become payload 1 or 0 after comparing with a threshold value (typically between\
    \ 20 and 60, depending on the desired sensitivity.\n\nTo be able to read analog\
    \ inputs on pins that allow this, use the analogRead() instruction in the main\
    \ loop. If there are not many other operations in the loop, you can mediate the\
    \ conversions' results to reduce the noise level. For this, you can make a summation\
    \ of a large number of consecutive samples, after which the result is divided\
    \ by their number and is published using a proper topic and a string type payload.\
    \ Transforming the full value of the conversions average into a string can be\
    \ done with the sprintf() statement, for example.\n\nThe program for ESP32, capable\
    \ of reading two digital inputs, two touch inputs, and an analog input, besides\
    \ the analog and digital commands, presented earlier, is shown in Figure 12.9.\
    \ **We will use this program by default in all the MQTT applications that**\n\n\
