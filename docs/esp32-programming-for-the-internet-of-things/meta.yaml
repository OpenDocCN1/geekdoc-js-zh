  md: 'In the JavaScript part, we define the slid1.oninput function, which displays
    the transmitted value and also calls the ClientToServer function with the parameter


    Also, the ClientToServer function will receive a supplementary substring, displays
    it as the "AnaRec" element, and optionally as the slider position. This option
    is useful to transmit the slider position between several web pages but may introduce
    some wobbling effect because there will always be a delay between the transmitted
    value and the received one.


    In the program run by the server (Figure 9.3), we define LED3 on the output GPIO5,
    as in [figure](https://example.com) We also declare the PWM channel and the variable
    AnOut that will contain the last analog value received.


    In the Setup part, we declare the output mode for the LED3 pin and the PWM parameters:
    2000 Hz and 8-bit resolution.


    The main changes may be noticed in the function server.on("/ClToSe",HTTP_GET,...).


    First, the t_state string obtained by the request->getParam is separated in 3


    +   - int tn is the numerical value of the first character. In our convention,
    if it is 0, this is simply a refresh, if it is 1 a digital command was received
    and if it is 2 an analog command was received.


    +   - int dign is the numerical value of the second character. In our convention,
    if tn is 1 and dign is 1, the first digital output is toggled, and if dign is
    2, the second digital output is toggled


    +   - int anan is the numerical value of the characters 2-4. In our convention,
    if tn is 2 it will be written as a PWM value to LED3, using the ledcWrite() instructions.
    Because the values AnOut are 0...100, we multiplied it by 2.55 to be scaled to
    0...255.


    The analog value received is memorized in the AnOut variable and then transformed
    in the string State7 which will be inserted in the whole State variable sent by
    the server to the clients.'
