    r\"结尾的字符串时，它会分隔包含信息的子字符串并尝试将其转换为数字。\n\n如果得到一个正数，则意味着它是来自滑块的值，因此将引脚附加到PWM通道，并将值传达给ledcWrite()指令。如果未得到正数，我们必须将字符串与ON进行比较，然后与OFF进行比较，将PWM通道从引脚分离，并以数字方式向其写入1或0。\n\
