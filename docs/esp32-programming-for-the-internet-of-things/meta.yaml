    \nindex.h文件将包含用于显示触摸状态的附加元素。我们在此选择使用SVG圆圈，并设置阈值20以改变其颜色：逻辑状态为1时显示黄色，逻辑状态为0时显示灰色。完整的index.h文件如图7.9所示，其中新增/修改的部分已高亮显示。\n\
    \n```cpp\nconst char MAIN_page [] PROGMEM = R\"===(\nhtml>\n```\n\n# AJAX ESP\
