    ![](img/bc50e9ed6994305c0caada2236432c8a_23_0.png)


    **Figure 2.5.** Example of forwarding a port to a local address'
  - '[PAGE 24]


    Start from Tools-> Serial Monitor;

    Compile and load the program in ESP;

    The serial monitor shows the internal IP address of the router to which the server
    is connected.

    You can enter with a browser from a client connected to the same router using
    the internal address, or from an external client using the address of the router.


    **Note:** The default HTTP protocol port is 80 so that this value is automatically
    added to a web address requested by a client. For example, if http://101.102.103.100
    is called, it goes to http://101.102.103.100:80. If the address 80 is already
    used by the router to forward an address, another one can be used for the server
    running here, but in this case, both the LAN and WAN addresses must explicitly
    specify the port. For example, if the server is declared on port 85, with IP 192.168.1.240,
    the LAN address can be written as http://192.168.1.240:85 and the WAN address
    can be written http://101.102.103.100:85 if in the router port 85 has been forwarded
    to LAN address 192.168.1.240.


    Of course, the fourth line of the program will be modified as in figure 2.6 to
    specify the new port.


    It is also necessary that in the case of a static IP, both it and Gateway to be
    in an IP class different from that of the router if it is coupled to another local
    network. Also, to be visible from the outside, the ports involved must be forwarded
    to the higher router''s IP address of the lower router. For example, if the main
    router (coupled to public IP) assigns address 192.168.1.200 and GW 192.168.1.1
    to the secondary one, this secondary router can allocate to the server the IP
    address 192.168.0.180 and GW 192.168.0.1. If the ports used are for example 80
    and 81, both of them must be forwarded to 192.168.1.200 on the first router and
    the second router to'
