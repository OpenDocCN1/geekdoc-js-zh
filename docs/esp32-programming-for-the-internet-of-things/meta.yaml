    Preface for the second edition


    In the two years that followed the first edition, there were some significant
    changes in the IoT technologies that use the ESP32 module in an Arduino IDE environment.
    That is why we decided to test again all the presented programs and modify them
    according to the current characteristics of the IDE. Some drivers, libraries,
    and applications have indeed changed, so we adjusted the codes presented here
    to be fully functional in August 2020.

    We also presented some new solutions, such as the Asynchronous Web Server library
    for ESP32 AJAX bidirectional transfers. As these new libraries are very stable,
    we removed the chapter concerning the coherence in disrupted networks and, instead,
    introduced more graphical elements for IoT web-pages.


