- md: ' SEVER SPÂNULESCU


    # ESP32 programming for the Internet of Things


    Second edition


    JavaScript, AJAX, MQTT and Websockets solutions


    -2020-


    # ESP32 programming for the Internet of Things


    Second edition


    SEVER SPÂNULESCU


    # of boards with ESP microcontrollers


    The ESP8266-01 (Figure 1.10) is the simplest version of the system implementation
    with the ESP8266 microcontroller.


    The main features of the ESP8266 microcontroller are the following:


    - Protocol 802.11 b / g / n

    - 2.4 GHz Wi-Fi with WPA / WPA2 support

    - Reduced dimensions (11.5mm x 11.5mm)

    - 16 GPIO pins

    - Integrated 10-bit ADC

    - + 20dBm output power in 802.11b mode

    - 32-bit microcontroller

    - SDIO 2.0, SPI, UART, I2C


    The ESP8266-01 module contains, besides the microcontroller (with limited access
    to pins, as in Figure 1.11), a 1 MB Flash memory but does not have a programming
    interface. Programming can be done with a USB-serial adapter dedicated to ESP8266-01
    (Figure 1.12).


    ![](img/bc50e9ed6994305c0caada2236432c8a_3_0.png)


    **Figure 1.10.** The ESP8266-01 board


    ![](img/bc50e9ed6994305c0caada2236432c8a_4_0.png)


    Figure 1.11. Pins configuration for the ESP8266-01 board (top view)


    ![](img/bc50e9ed6994305c0caada2236432c8a_4_1.png)


    Figure 1.12. USB-serial converter for programming the


    # ESP8266-01 board


    Programming the ESP8266-01 board is done with the GPIO pin at the ground followed
    by a reset.


    In Arduino IDE choose Tools-> Board "Generic ESP8266 Module", set serial port
    and speed, then compile and program with "Load".


    After switching off the programmer, the CH_PD pin (0-> Power Down, 1 -> Power
    Up) must be coupled to VCC for normal operation.


    Although the microcontroller is powerful enough for a variety of simple applications,
    it is advisable to use it as a WiFi interface for a more complex module with multiple
    peripheral blocks and a sufficient number of pins (for example, Arduino or STM32F4
    Discovery).


    The **NodeMCU 1.0 ESP8266-12E** board (Figure 1.13) is an advanced version of
    system implementation with the ESP8266 microcontroller.


    ![](img/bc50e9ed6994305c0caada2236432c8a_8_0.png)


    **Figure 1.13.** The ESP8266-12 NodeMCU 1.0 board


    Besides the 4 MB ROM, the module also contains the micro-USB programming interface
    and the voltage regulator that supplies the 3.3V voltage. Also, virtually all
    microcontroller pins are accessible (Figures 1.14 and 1.15), which gives it possibilities
    for independent operation for a wider range of applications.


    ![](img/bc50e9ed6994305c0caada2236432c8a_9_0.png)


    **Figure 1.14.** Pin configuration for the ESP8266-12 NodeMCU 1.0 board


    ![](img/bc50e9ed6994305c0caada2236432c8a_10_0.png)


    **Figure 1.15.** Pin functionality for the ESP8266-12 NodeMCU 1.0 board


    The **ESP32 board DOIT DEVKIT** has an ESP32 microcontroller, Flash memory, USB-serial
    converter for programming, and 3.3V voltage regulator (5V supply and communication
    with the PC is achieved via a micro USB connector).


    The ESP32 family of microcontrollers has the following features:


    - Xtensa® single- / dual-core 32-bit microprocessor LX6 (s), up to 600 MIPS (200
    MIPS for ESP32-SoWD, 400 MIPS for ESP32-D2WD)

    - 448 KB ROM

    - 520 KB SRAM

    - RTC

    - 16 KB SRAM QSPI supports the multi-flash / SRAM chips

    - Operating Voltage: 3.3V

    - Internal 8 MHz RC oscillator with oscillator calibration with calibration

    - Internal Clock Speed: 240 MHz

    - 2 MHz-60 MHz External Crystal Oscillator (40 MHz only for Wi-Fi / BT functionality)

    - External 32 kHz crystal oscillator for RTC with calibration

    - Two timer groups, including 2 x 64-bit timers and 1 x main watchdog in each
    group

    - One RTC timer

    - RTC watchdog

    - 34 programmable GPIOs

    - 12-bit SAR ADC up to 18 channels

    - 2 x 8-bit DAC

    - 10 x touch sensors

    - 4 x SPI

    - 2 x I2S

    - 2 x I2C

    - 3 x UART

    - 1 host (SD / eMMC / SDIO)

    - 1 slave (SDIO / SPI)

    - Ethernet MAC with dedicated DMA interface and IEEE 1588 port

    - Wi-Fi: IEEE 802.11 b / g / n / e / i:

    - CAN 2.0

    - IR (TX / RX)

    - PWM for motors drivers

    - PWM for general use, up to 16 channels

    - Hall sensor


    There are many variants to implement modules containing the ESP32 microcontroller,
    from various manufacturers. DOIT Devkit ESP32 has a 30-pin version (figure 1.16)
    and, more recently, a 36-pin version (Figure 1.17). Using the additional 6 pins
    in the second variant may cause some side effects, so they need special attention.


    The board is equipped with a red LED that indicates the presence of voltage and
    a blue LED on the GPIO2 user pin. There is a reset button (EN) and a boot one
    (only necessary in case of failure to load the program). In the following, the
    examples will use the ESP32 microcontroller, which is the best (about $ 10), but
    the programs shown may be adjusted using minor changes for ESP8266 microcontroller
    (below 5 dollars). Mainly, it would be necessary to replace terms such as "ESP32
    ..." with "ESP8266 ..." and define the used pins, depending on the card used.


    As the integrated development environment, we will use the Arduino IDE, which
    is extremely simple and powerful enough for undemanding applications. The main
    drawback is the lack of Arduino IDE support for debugging; that is why, for more
    complex applications, it is recommended to use more powerful programs such as
    ESP IDF. However, they have the disadvantage of a very long time required for
    the first build.


    ![](img/bc50e9ed6994305c0caada2236432c8a_13_0.png)


    **Figure** The pinout for ESP32 boards with 30 pins


    ![](img/bc50e9ed6994305c0caada2236432c8a_13_1.png)


    **Figure 1.17.** The pinout for ESP32 boards with 36 pins


    **ESP32 / ESP8266 IoT applications by using HTML / JavaScript**


    Using standard HTML technologies allow much flexibility, as the possible combination
    with other web technologies can achieve any parameters of the GUI. The price is
    a large amount of code that must be done manually, but this criterion is usually
    not prohibitive.


    In the following, for programming the ESP microcontrollers in C, we will use the
    programming environment Arduino IDE, which has the advantage of great simplicity,
    allowing very rapid application development. The main disadvantage is the lack
    of tools for debugging programs, for which it will present later an advanced Integrated
    Development Environment, the ESP-IDF official programming tool.


    # IDE installation for ESP microcontrollers


    Preparing for programming ESP32/ESP8266 microcontrollers in Arduino IDE require
    the following steps:


    - Install the latest version of Arduino IDE at https://www.arduino.cc/en/Main/Software

    - Go to File-> Preferences and write in Additional Boards Manager URLs: http://arduino.esp8266.com/stable/package_esp8266com_index.json
    https://dl.espressif.com/dl/package_esp32_index.json separated by a comma.

    - Go to Tools-> Boards-> Boards Manager;

    - At the end of the list, click the cell esp8266 ESP8266 Community and Install.

    - Before the end of the list, click the cell esp32 by Espressif Systems and Install.

    - Insert the ESP8266 or ESP32 board, and install the drivers.


    # server using the ESP32 board


    For a minimal web site using ESP32 as a server, we proceed as will be shown below.


    Open Arduino IDE, choose the board and serial port and open File-> Examples->
    ESP32 DEVKIT V1-> WiFi-> SimpleWiFiServer;


    Copy the standard statement and initialization portion with the minimum required
    as in the example in Figure 2.2;


    In the loop() enter the instructions for client search and for writing the HTML
    text. This is transmitted with several lines using the client.println("....")
    instruction. An example of the main loop for a web page created by the server
    is in Figure 2.2;


    By loading the program into ESP32 and running it, the module will connect to the
    router with the SSID and password specified in the program. The DHCP system will
    allocate an available IP, which is displayed on the Arduino IDE Serial Monitor
    (select the speed specified in the program, 115200 bps).


    By accessing the web page from the address of the router to which the WiFi circuit
    is coupled, an image is obtained as in Figure 2.1. Some router settings may be
    necessary, as will be presented further. As an alternative, it can be accessed
    from the local network, at the address assigned by the router, usually in the
    form of 192.168...


    ![](img/bc50e9ed6994305c0caada2236432c8a_16_0.png)


    **Figure 2.1.** Example of a web page created by the ESP32 server'
  mdcn: "\n SEVER SPÂNULESCU\n\n# ESP32 物联网编程\n\n第二版\n\nJavaScript、AJAX、MQTT 和 Websockets\
    \ 解决方案\n\n-2020-\n\n# ESP32 物联网编程\n\n第二版\n\nSEVER SPÂNULESCU\n\n# 搭载 ESP 微控制器的开发板\n\
    \nESP8266-01（图 1.10）是基于 ESP8266 微控制器实现的最简版系统。\n\nESP8266 微控制器的主要特性如下：\n\n- 协议\
    \ 802.11 b / g / n\n- 2.4 GHz Wi-Fi，支持 WPA / WPA2\n- 尺寸小巧（11.5mm x 11.5mm）\n-\
    \ 16 个 GPIO 引脚\n- 集成 10 位 ADC\n- 802.11b 模式下输出功率 + 20dBm\n- 32 位微控制器\n- SDIO 2.0、SPI、UART、I2C\n\
    \nESP8266-01 模块除了包含微控制器（引脚访问有限，如图 1.11 所示）外，还包含 1 MB Flash 存储器，但没有编程接口。可以使用专用于\
    \ ESP8266-01 的 USB 转串口适配器（图 1.12）进行编程。\n\n![](img/bc50e9ed6994305c0caada2236432c8a_3_0.png)\n\
    \n**图 1.10.** ESP8266-01 开发板\n\n![](img/bc50e9ed6994305c0caada2236432c8a_4_0.png)\n\
    \n图 1.11. ESP8266-01 开发板的引脚配置（顶视图）\n\n![](img/bc50e9ed6994305c0caada2236432c8a_4_1.png)\n\
    \n图 1.12. 用于 ESP8266-01 开发板编程的 USB 转串口转换器\n\n# ESP8266-01 开发板的编程\n\n对 ESP8266-01\
    \ 开发板进行编程时，需要先将 GPIO 引脚接地，然后进行复位。\n\n在 Arduino IDE 中，选择 Tools（工具）-> Board（开发板）\"\
    Generic ESP8266 Module\"，设置串口和速率，然后编译并通过 \"Load\"（上传）进行编程。\n\n关闭编程器后，必须将 CH_PD\
    \ 引脚（0-> 掉电，1 -> 上电）连接到 VCC 才能正常工作。\n\n尽管该微控制器对于各种简单应用来说已经足够强大，但建议将其用作更复杂模块的 WiFi\
    \ 接口，该模块具有多个外设模块和足够数量的引脚（例如 Arduino 或 STM32F4 Discovery）。\n\n**NodeMCU 1.0 ESP8266-12E**\
    \ 开发板（图 1.13）是基于 ESP8266 微控制器实现的高级版本系统。\n\n![](img/bc50e9ed6994305c0caada2236432c8a_8_0.png)\n\
    \n**图 1.13.** ESP8266-12 NodeMCU 1.0 开发板\n\n除了 4 MB ROM 之外，该模块还包含 micro-USB 编程接口和提供\
    \ 3.3V 电压的稳压器。此外，几乎所有微控制器引脚都可访问（图 1.14 和图 1.15），使其能够独立运行，应用范围更广。\n\n![](img/bc50e9ed6994305c0caada2236432c8a_9_0.png)\n\
    \n**图 1.14.** ESP8266-12 NodeMCU 1.0 开发板的引脚配置\n\n![](img/bc50e9ed6994305c0caada2236432c8a_10_0.png)\n\
    \n**图 1.15.** ESP8266-12 NodeMCU 1.0 开发板的引脚功能\n\n**ESP32 DOIT DEVKIT 开发板** 搭载\
    \ ESP32 微控制器、Flash 存储器、用于编程的 USB 转串口转换器以及 3.3V 稳压器（通过 micro USB 连接器实现 5V 供电和与\
    \ PC 通信）。\n\nESP32 系列微控制器具有以下特性：\n\n- Xtensa® 单核/双核 32 位 LX6 微处理器，频率最高可达 600 MIPS（ESP32-SoWD\
    \ 为 200 MIPS，ESP32-D2WD 为 400 MIPS）\n- 448 KB ROM\n- 520 KB SRAM\n- RTC\n- 16\
    \ KB SRAM QSPI，支持多 flash / SRAM 芯片\n- 工作电压：3.3V\n- 内部 8 MHz RC 振荡器，带校准\n- 内部时钟频率：240\
    \ MHz\n- 2 MHz-60 MHz 外部晶体振荡器（仅用于 Wi-Fi / BT 功能时为 40 MHz）\n- 外部 32 kHz 晶体振荡器用于\
    \ RTC，带校准\n- 两个定时器组，每组包括 2 个 64 位定时器和 1 个主看门狗\n- 一个 RTC 定时器\n- RTC 看门狗\n- 34 个可编程\
    \ GPIO\n- 12 位 SAR ADC，最多 18 个通道\n- 2 个 8 位 DAC\n- 10 个触摸传感器\n- 4 个 SPI\n- 2 个\
    \ I2S\n- 2 个 I2C\n- 3 个 UART\n- 1 个主机（SD / eMMC / SDIO）\n- 1 个从机（SDIO / SPI）\n\
    - 以太网 MAC，带专用 DMA 接口和 IEEE 1588 端口\n- Wi-Fi：IEEE 802.11 b / g / n / e / i：\n-\
    \ CAN 2.0\n- IR（TX / RX）\n- 用于电机驱动的 PWM\n- 用于通用用途的 PWM，最多 16 个通道\n- 霍尔传感器\n\n\
    有来自不同制造商的许多搭载 ESP32 微控制器的模块实现方案可供选择。DOIT Devkit ESP32 有 30 引脚版本（图 1.16），以及较新的\
    \ 36 引脚版本（图 1.17）。第二种版本增加的 6 个引脚可能会带来一些副作用，因此需要特别留意。\n\n开发板上配备了一个红色 LED 用于指示电压存在，以及一个连接在\
    \ GPIO2 用户引脚上的蓝色 LED。还有一个复位按钮（EN）和一个启动按钮（仅在程序加载失败时需要使用）。在下文中，示例将使用 ESP32 微控制器，它是最优选择（约\
    \ 10 美元），但所展示的程序只需进行少量修改即可用于 ESP8266 微控制器（低于 5 美元）。主要需要将程序中诸如 \"ESP32 ...\" 之类的术语替换为\
    \ \"ESP8266 ...\"，并根据所使用的开发板定义所使用的引脚。\n\n作为集成开发环境，我们将使用 Arduino IDE，它极其简单，且对于要求不高的应用来说功能已经足够强大。其主要缺点是\
    \ Arduino IDE 缺乏调试支持；这就是为什么对于更复杂的应用，建议使用更强大的程序，例如 ESP IDF。然而，这些工具的缺点是首次构建需要非常长的时间。\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_13_0.png)\n\n**图** 30 引脚 ESP32 开发板的引脚分配\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_13_1.png)\n\n**图 1.17.** 36 引脚 ESP32\
    \ 开发板的引脚分配\n\n**使用 HTML / JavaScript 的 ESP32 / ESP8266 物联网应用**\n\n使用标准 HTML 技术可以提供很大的灵活性，因为可以与其他\
    \ Web 技术相结合，从而实现 GUI 的任何参数。其代价是需要手动编写大量代码，但这一要求通常并不构成障碍。\n\n在下文中，对于使用 C 语言对 ESP\
    \ 微控制器进行编程，我们将使用 Arduino IDE 编程环境，其优势在于简单易用，能够实现非常快速的应用程序开发。其主要缺点是缺乏程序调试工具，稍后将介绍一款更高级的集成开发环境——ESP-IDF\
    \ 官方编程工具。\n\n# ESP 微控制器的 IDE 安装\n\n要在 Arduino IDE 中准备 ESP32/ESP8266 微控制器的编程环境，需要执行以下步骤：\n\
    \n- 在 https://www.arduino.cc/en/Main/Software 安装最新版本的 Arduino IDE\n- 进入 File（文件）->\
    \ Preferences（首选项），在 Additional Boards Manager URLs（附加开发板管理器网址）中输入：http://arduino.esp8266.com/stable/package_esp8266com_index.json\
    \ https://dl.espressif.com/dl/package_esp32_index.json ，用逗号分隔。\n- 进入 Tools（工具）->\
    \ Boards（开发板）-> Boards Manager（开发板管理器）；\n- 在列表末尾，单击 esp8266 ESP8266 Community\
    \ 所在的单元格并安装。\n- 在列表接近末尾处，单击 Espressif Systems 的 esp32 所在的单元格并安装。\n- 插入 ESP8266\
    \ 或 ESP32 开发板，并安装驱动程序。\n\n# 使用 ESP32 开发板作为服务器\n\n对于以 ESP32 作为服务器的最小化网站，我们按以下步骤进行。\n\
    \n打开 Arduino IDE，选择开发板和串口，然后打开 File（文件）-> Examples（示例）-> ESP32 DEVKIT V1-> WiFi->\
    \ SimpleWiFiServer；\n\n复制标准的声明和初始化部分，并按图 2.2 示例中所示保留最简内容；\n\n在 loop() 中输入客户端搜索和\
    \ HTML 文本写入的指令。该内容通过 client.println(\"....\") 指令分多行发送。服务器创建网页的主循环示例见图 2.2；\n\n\
    将程序加载到 ESP32 中并运行后，模块将使用程序中指定的 SSID 和密码连接到路由器。DHCP 系统会分配一个可用的 IP 地址，该地址将显示在 Arduino\
    \ IDE 的串口监视器中（选择程序中指定的速率，115200 bps）。\n\n通过从 WiFi 电路所连接路由器的地址访问该网页，可以得到如图 2.1\
    \ 所示的页面。可能需要进行一些路由器设置，稍后将对此进行介绍。作为替代方案，也可以通过路由器分配的地址从局域网访问，通常采用 192.168... 的形式。\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_16_0.png)\n\n**图 2.1.** 由 ESP32 服务器创建的网页示例\n"
