    # inputs using Node-Red and Mosquitto on a Windows computer


    # objectives of the book


    This paper presents some simple and practical solutions for the realization of
    automatic data communication between devices coupled to the Internet. These are
    placed in the category of Internet of Things (IoT) and Machine-to-Machine (M2M),
    whose scope is continuously expanding and raises an increasing interest in both
    industry and consumer goods.'
  merge: -1
  pgno: 323
- img_proc: true
  md: 'It aims at detailing complete applications, starting from intermediate level
    knowledge such as C programming (on environments such as Arduino IDE and ESP-IDF),
    HTML / CSS and JavaScript, which are complemented by modern technologies like
    Ajax, MQTT, Node.js, AngularJS, and WebSockets, presented appropriately for these
    applications.


    The communications between the Internet devices exemplified below will be accomplished
    between a process interface device and a command/monitor device.


    The interface device receives input data from sensors/transducers and generates
    output data to execution elements/actuators. For this purpose, we will use ESP32
    or ESP8266 modules with WiFi connection possibilities, which have several advantages:


    +   - Low volume (Figure 1.1, Figure 1.4, Figure 1.7);

    - Low consumption, with sleep and even battery performance;

    - Low price;

    - Sufficient number of digital and analog input and output channels;

    - Simple programming options using the Arduino IDE environment.


    Other modules can also be used, running programs with identical algorithms to
    those presented here.


    In the first part of the paper, using classic web technologies, the interface
    device generally acts as a server, so he is the one who generates the web page
    and responds to the requests of client applications.'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'In the second part of the paper, using MQTT technologies, a dedicated server
    runs a program for the reception and distribution of messages with various topics
    and content (payload), so that it can create a much more complex network, with
    equivalent clients, each with flexible functions, with or without human intervention.


    In the last part of the paper are presented examples of implementation of the
    WebSockets technology, which provide high-speed client-server bidirectional links.


    The command/monitor device can be a PC, a tablet, or even a smartphone, running
    a dedicated application or the web page created by the server. Examples of graphical
    interfaces are presented in the following pictures, with various complexities
    and technologies (Figures 1.1-1.6).


    ![](img/bc50e9ed6994305c0caada2236432c8a_325_0.png)


    Figure 1.1. Digital Output command (HTML) webpage'
