    下面描述了在 MIT App Inventor 中实现此技术的一个示例（图 4.2）。


    应用程序中将会有三个全局变量，分别对应于三种可能的事件：按下 ON 按钮——“global on”、按下 OFF 按钮——“global off”以及滑块的动作——“global
    slide”，它们在初始化时均被声明为逻辑值“false”。


    当其中某个事件发生时，对应的变量将被置为“true”值，并保持该状态直到定时器到期。此后，该变量将被自动置为“false”。


