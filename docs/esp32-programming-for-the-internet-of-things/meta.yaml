    \n## AJAX 技术\n\n### 前言\n\n在过去几十年中，工业、商业、基础设施甚至消费领域越来越多的设备配备了各种自动化、电子和计算机应用。这些系统中的许多热点已经包含本地人工智能以及众多辅助人类智能的设施。\n\
    \n渐渐地，在现代工厂中，越来越多的子系统相互连接，交换信息，并通过这种机器对机器（**M2M**）方式极大地提高了生产力。\n\n与此同时，全球通信网络——互联网——已经成长和发展，连接了台式机、笔记本电脑、平板电脑、智能手机和其他人类操作的设备。\n\
    \n因此，一方面，机器在本地进行通信；另一方面，人类在全球范围内进行通信。下一步当然是将所有这些**信息Mailbox伪装作为一种武器**，还有多久送达普通用户手里？信息交换合并到一个新的层次——物联网——通过这种方式，计算机辅助设备已通过**互联网**获得全球访问权限，而人类用户已经获得在任何距离监控和指挥它们的权限。\n\
    \n对两种信息传输节点的分析显示出速度上的巨大差异，使得计算机设备的速度比人类操作者高出多个数量级。然而，似乎直到2009年，数量对比才对第一类变得有利，以至于一个非常广阔的互联网连接领域仍然开放。据估计，到2030年，物联网组件的数量将达到12，这可能会引发第四次工业革命，\
    \ already called **Industry 4.0**（工业4.0）。\n\n这是一项艰巨的任务，需要高素质的专家，以及简单且低成本的解决方案。朝着这个方向迈出的重要一步是**Espressif\
    \ Systems**（乐鑫系统）公司生产的具有非常低成本WiFi连接的微控制器的出现，这使得那些已经具备一些经典IT知识并希望参与这一进程的人能够快速独立地获得资质。\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_97_0.png)\n\n图 1.1. 工业4.0的示意图，展示了四个\"\
    工业\n\n本书不打算全面地教你理论，而是以完整程序的形式为你提供实用且功能完备的解决方案。你们中的一些人已经知道很多理论知识，或者可以在许多其他教科书中找到。但这里介绍的程序包含了大量的努力，并遵循编程的基本范式之一：\"\
    Keep i(o)t simple\"（保持简单）而具有许多原创的解决方案。——对于这样一本书来说最重要的事情是——所有程序已经由第三方验证，在本例中是来自**海波龙大学**的学生，他们提供了非常宝贵的反馈。\n\
    \n## AJAX 技术及其对象\n\n如前所述，客户端到服务器命令的传输可以通过**GET**请求完成。服务器读取以\"/r\"结尾的字符字符串，并提取\n\
    \n命令信息，执行适当的例程。原则上，服务器也可以传输状态信息（当前数字和模拟值），但只有在一个或多个网页客户端刷新页面后，更改才会变得可见。\n\n到目前为止，所有介绍的程序都需要刷新整个页面才能显示服务器的当前状态。显示的状态可能与实际状态不同，因为服务器程序或另一个客户端可能会修改它。\n\
    \n当然，服务器可以通过`setInterval`或类似函数定期下令刷新，但重新加载整个页面可能需要大量的数据传输流量，而且在经典浏览器中周期性\"闪烁\"\
    的总体外观令人不快。\n\n这就是为什么开发了一种新技术，可以在不重新加载整个页面的情况下自动更新某些页面元素——**AJAX**（**A**synchronous\
    \ **J**avaScript **A**nd **X**ML，异步JavaScript和XML）。它允许通过将JavaScript指令与通过XML在Internet上进行应用程序间数据传输的可能性相结合，从客户端向服务器发送和读取数据。\n\
    \nAJAX 技术的主要对象是 `XMLHttpRequest`，它取代了旧浏览器中使用的 `ActiveXObject`。它允许与服务器交换数据，使用的语法是：\n\
    \n```\nvar object_name = new XMLHttpRequest();\n```\n\n当事件发生时，客户端创建这样一个对象，并使用\"\
    **GET**\"方法向服务器发送请求。服务器处理此请求并创建响应，将数据发送回客户端。\n\n现在客户端处理响应并更新网页的指定元素。\n\n## 浏览器\n\
