    It can be seen in Windows that the

    C:\msys32\home\USERNAME\esp\ subdirectory was created.

    From the mingw32 terminal we enter the work folder with the command:


    ```

    cd ~/esp

    ```


    Give the esp-idf environment repository the cloning command:


    ```

    git clones-recursive https://github.com/espressif/esp-idf.git

    ```


    At this point, the C:\msys32\home\USERNAME\esp\esp-idf\ subdirectory will appear,
    and the path to it must be set and added to the user profile, hence called IDF_PATH.

    For this, go to the C:\msys32\etc\profile.d\ directory where we must create a
