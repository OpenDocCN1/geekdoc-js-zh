    ## 使用 MIT App Inventor 实现客户端与服务器之间的通信


    服务器与多个客户端之间双向传输系统的总体方案如图 5.1 所示。


    ![](img/bc50e9ed6994305c0caada2236432c8a_77_0.png)


    | 客户端 1（网页） | | |

    |:---|:---|:---|

    | 数字指令（按钮等） | | |

    | 模拟指令（滑块） | | |

    | 以太网 | | |

    | 客户端 2（网页） | 模拟输入（调理放大器、传感器、模拟源等） | |

    | 数字指令（按钮等） | 模拟输入（ADC） | |

