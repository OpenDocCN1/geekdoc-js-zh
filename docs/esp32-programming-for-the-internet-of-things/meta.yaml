- img_proc: true
  md: 'In order to transmit to the client various states on the server, for example
    the logical or analog states of some inputs to which sensors or other signal sources
    are coupled, the client can periodically request the web page to be retransmitted
    using a GET instruction with the server''s URL (for example, 192.168.1.246:85).
    As shown before, this request can also be used to send commands to the server
    by attaching additional strings to the root address (for example, 192.168.1.246:85/ON).


    However, periodic refresh of the entire web page in a normal browser affects the
    page aspect due to blinking, which can be avoided using the AJAX technique, as
    will be presented in a later chapter. If bidirectional communication with an Android
    application is enough, this method can be used very easily through MIT App Inventor.


    # refreshing the web page through MIT App Inventor'
  merge: -1
