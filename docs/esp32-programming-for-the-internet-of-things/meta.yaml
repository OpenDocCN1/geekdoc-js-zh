    # refresh of the web page via AJAX


    # of the automatic refresh


    In the previous programs, a web page sends commands to the server and, based on
    the received information, displays the state of the server. But, until the next
    command, even if the state of the server changes, the web page continues to display
    the same old state. Hence, if another client (browser) sends a command to the
    server, the first client does not automatically display the real state of the
    server. The new state is displayed only when a new command is sent, or when the
    page is refreshed. Also, when the state of the server''s inputs changes, the new
    values will not be visible on the client web-page until it sends a command or
    executes a refresh.


    As mentioned, using standard technologies, there are some methods for automatically
    refreshing the web-page, at certain time intervals, but this increases the traffic
    and may produce unpleasant visual effects.


    AJAX technology, however, allows automatic updating of the required elements only,
    reducing traffic and improving the visual appearance.


    To do this, you can use a setInterval JavaScript function to periodically call
    an AJAX function, which transmits data from the server to clients:'
  - '[PAGE 136]


    ```

    setInterval(function() {


    // Call the function every 2 seconds


    ClientToServer();

    }, 2000); //2000 mSeconds update rate

    ```


    This should be inserted in the script part of the index.h file as in figure 7.1.'
