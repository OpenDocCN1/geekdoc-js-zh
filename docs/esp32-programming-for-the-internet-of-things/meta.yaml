    # control of the outputs of the server


    # 9.1. principles


    As we may see in the general diagram of the client-server communications in some
    applications a web-page client must send analog values that will drive some analog
    outputs of a server


    In chapter 4, we made such a communication, using a slider-type element prefabricated
    and integrated into an MIT application, suitable for an Android mobile device.


    We recall that in the Arduino IDE, the analog output on a pin may be achieved
    using the PWM technique. We may use the ledcAttachPin() and ledcDetachPin() instructions
    to attach and to detach a PWM channel to a pin. The ledcWrite() instruction writes
    the number of pulses to count, which, divided to the maximum number of pulses,
    establish the fill factor, hence the fraction of the Vcc voltage that will be
    continuously found at this output.


    For a web-page client, we may use the same technique and slider-type elements
    created with HTML, CSS, JavaScript, or other technologies for the client-side
    of the program.


    # analog control elements


    The HTML object that can be used as a potentiometer is and its declaration is
    in a division. When declaring them, the initial parameters can be specified, and
    event response functions can be invoked.


    The following example declares a division containing a slider'
