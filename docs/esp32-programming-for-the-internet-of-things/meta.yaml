- md: "**Figure 3.6.** Example selection in the router's DHCP for the desired IP of\
    \ the ESP32\n\n![](img/bc50e9ed6994305c0caada2236432c8a_51_0.png)\n\n## Figure\
    \ 3.7. Example of server port forwarding on the router\n\nIn such cases, the value\
    \ of the external input port should be included in the mobile application too,\
    \ by entering its value preceded by the \":\" character, as in Figure 3.4.\n\n\
    Copyright © 2020 SEVER SPÂNULESCU\n\nAll rights reserved.\n\nThis book or any\
    \ portion thereof may not be reproduced or used in any manner whatsoever without\
    \ the express written permission of the publisher except for the use of brief\
    \ quotations in a book review or scholarly journal.\n\nFirst Printing: 2018\n\n\
    Second edition: 2020\n\n## and digital commands transmission to an ESP32 server\
    \ from an MIT App Inventor application\n\n## principles of analog and digital\
    \ transmissions\n\nAn example of a program running on an ESP32 server, able to\
    \ receive both digital values (using buttons) and analog values (using the cursor)\
    \ from a client, is described below.\n\nFor analog values on the outputs, you\
    \ may use the Pulse Width Modulation technique - PWM. The analogWrite() instruction\
    \ existing in Arduino IDE is implemented so far only for the ESP8266 microcontroller\
    \ (with 10 bits resolution), so for ESP32 we will use the ledcAttachPin(), and\
    \ ledcDetachPin() instructions.\n\nAs with other microcontrollers, some GPIO pins\
    \ of the ESP32 microcontroller can generate rectangular PWM pulses. After an integration\
    \ (thus filtering out the alternative components and keeping only the continue\
    \ component), these pulses are converted to continue levels between 0 and 3V when\
    \ the fill factor varies between 0% and 100%. This mode of operation is equivalent\
    \ to digital-to-analog conversion (DAC), without the need for such an integrated\
    \ converter. Conversion voltage resolution is given by the number of steps used\
    \ by the pulse generator, typically between 8 and 16 bits resolution, according\
    \ to the following general relationships.\n\nFor an n-bit resolution of the counter,\
    \ the number of steps is:\n\nThe voltage resolution is:\n\nThe maximum frequency\
    \ of the pulses, for a clock frequency,\n\nTo facilitate integration, we recommend\
    \ a higher pulses frequency, but this may require a lower resolution, according\
    \ to formulas. Compared to integrated DAC, this technique has the advantage that\
    \ signal amplifiers can work in D-Class, having an 80-95% efficiency. Integrated\
    \ DAC requires A-Class amplifiers, which has an efficiency of less than 50%, implying\
    \ big radiators and high energy consumption. However, the integrated DAC conversion\
    \ has the advantage that the generated frequency is theoretically independent\
    \ of resolution.\n\n## digital-analog conversion via PWM in Arduino IDE\n\nIn\
    \ the Arduino IDE programming environment, the ledcAttachPin() and ledcDetachPin()\
    \ instructions attach and detach a PWM channel to a pin. The ledcWrite() instruction\
    \ writes the number of pulses to count, which, divided to the maximum number of\
    \ pulses, establish the fill factor. For example, for a 10-bit resolution, the\
    \ total number of steps is 1024 so that a ledcWrite(300) instruction will give\
    \ a fill factor of about 30%, so an analog voltage of about 1 V.\n\nIn the next\
    \ program, we first declare the constants and variables, some of which are necessary\
    \ for PWM output. Then the server is connected to a router with known SSID and\
    \ password, using a static IP address. In the example, the address 192.168.1.246\
    \ was used, with port 85 (forwarded from WAN to this LAN address).\n\nIn this\
    \ program, we also illustrate how to set up a static IP for the server. For this,\
    \ the WiFi.config(local_IP, gateway, subnet) instruction is used, preceded by\
    \ IP, gateway, and subnet instructions:\n\n```\n......\nIPAddress local_IP(192,\
    \ 168, 1, //static IP\nIPAddress gateway(192, 168, 1, 1);// net parameters\nIPAddress\
    \ subnet(255, 255, 255, 0);\n```\n\n```\nWiFi.config(local_IP, gateway, subnet);\n\
    WiFi.begin(ssid, password);\n```\n\nTo work in PWM, we have to define a channel\
    \ and declare its parameters with statements of the following type:\n\n```\n....\n\
    int ledChannel=0;//PWM channel for LED\nint frecv=5000;// PWM Parameters for Timer\n\
    int rezolutie=8;//PWM resolution in bits\n```\n\nNotice that when a digital ON\
    \ or OFF command is transmitted, you have to use the ledcDetachPin() instruction.\
    \ It will detach that pin from the PWM channel if you previously used an analog\
    \ PWM command for that pin.\n\nThe client program assumes that a GET request is\
    \ composed of a string of characters like:\nGET /ON HTTP/1.1\\r if the button\
    \ ON has been touched\nGET /OFF HTTP/1.1\\r if the button OFF has been touched\n\
    GET /67 HTTP/1.1\\r if the slider is positioned at the value 67\nGET /111 HTTP/1.1\\\
    r if the slider is positioned at the value 111\netc.\n\nTherefore, the useful\
    \ information is comprised between the first character \"/\" and the \"H\" character,\
    \ being the string \"ON\", \"OFF\" or a numeric value. When a string finished\
    \ with the \"\\r\" is received at the server, it separates the sub-string containing\
    \ the information and tries to transform it into a number.\n\nIf a positive number\
    \ is obtained, it means that it is a value from the slider, so a pin is attached\
    \ to a PWM channel and the value is communicated to the ledcWrite() instruction.\
    \ If a positive number is not obtained, we must compare the string with ON and\
    \ then with OFF, detach the PWM channel from the pin, and digitally write to it\
    \ a 1 or a 0 respectively.\n\nNext, we can generate HTML instructions for a WEB\
    \ page that allows the digital pin control, as in previous programs.\n\nThe full\
    \ source of the program for the Arduino IDE is shown in Figure 4.1. It may be\
    \ accomplished by completing/modifying the previous program (Figure 3.1).\n\n\
    ```\n#include\n```\n\n```\nconst char* ssid = \"NameSSID\";\nconst char* password\
    \ = \"pass1234\";\nWiFiServer server(85);//Service Port\nint num=0;\n```\n\n```\n\
    int ledChannel=0;//PWM channel for the LED\nint frecv=5000;//Timer PWM parameters\n\
    int rezolutie=8;\nString led=\"OFF\";\nvoid setup() {\n  Serial.begin(115200);\n\
    \  delay(250);\nledcSetup(ledChannel,frecv, rezolutie);//start PWM\n  pinMode(LED_BUILTIN,\
    \ OUTPUT);\n  // Connect to WiFi with static IP\n```\n\n```\nIPAddress local_IP(192,\
    \ 168, 1, 246); //Static IP\nIPAddress gateway(192, 168, 1, 1); // network parameters\n\
    IPAddress subnet(255, 255, 255, 0);\nWiFi.config(local_IP, gateway, subnet);\n\
    ```\n\n```\nWiFi.begin(ssid, password);\nwhile (WiFi.status() != WL_CONNECTED)\
    \ {\n  delay(500);\n  Serial.print(\".\");\n}\n// Start server\n```\n\n```\nserver.begin();\n\
    Serial.println(WiFi.localIP());\n}\nvoid loop() {\n```\n\n```\nWiFiClient client\
    \ = server.available();\n```\n\n```\n// Check if a client has connected\nif (!client)\
    \ { return; }\n// Wait until the client sends some data\n```\n\n```\nwhile(!client.available()){\n\
    \  delay(1);\n}\n// Ask for a response (a line) from server\nString request =\
    \ client.readStringUntil('\\r');\n```\n\n```\nSerial.println(request);\n// request\
    \ from client\nint index1 = request.indexOf(\"/\");\nint index2 = request.indexOf(\"\
    H\");\n\nnum=led.toInt();//Transform to number\n//Serial.println(led);\nif (num>0)\n\
    {\n  ledcAttachPin(LED_BUILTIN,ledChannel);  // PWM_0 to pin 2\n  ledcWrite(ledChannel,num-1);\n\
    }\n//Respond to ON/OFF buttons\n  if (led==\"OFF\") {\n    ledcDetachPin(LED_BUILTIN);\n\
    \    digitalWrite(LED_BUILTIN, LOW);\n  }\nif (led==\"ON\") {\n```\n\n```\nledcDetachPin(LED_BUILTIN);\n\
    digitalWrite(LED_BUILTIN,HIGH);\n}\n// Return the response\nclient.println(\"\
    HTTP/1.1 200 OK\");\nclient.println(\"Content-type:text/html\");\nclient.println();\
    \ //mandatory\nclient.println(\"<!DOCTYPE html>\");\nclient.println(\"<html>\"\
    );\nclient.println(\"Click <a href=\\\"/ON\\\">here</a> to turn led on\");\nclient.println(\"\
    <br>\");\nclient.println(\"Click <a href=\\\"/OFF\\\">here</a> to turn led off\"\
    );\nclient.println(\"</html>\");\nclient.flush();//mandatory\ndelay(1);\n}\n```\n\
    \n**Figure 4.1.** The program for the digital control and analog control of an\
    \ output\n\n## command in MIT App Inventor\n\nTransmitting an analogical value\
    \ from the client can be done with a virtual slider that can take integer values\
    \ within a specific range. The current value can be converted into a string, transmitted\
    \ and then converted by the server again in a number.\n\nThe main problem is that\
    \ acting the slider can result in a very rapid succession of data that overloads\
    \ or even blocks the communication. A solution to avoid this phenomenon is to\
    \ transmit the slider values only at certain time intervals (preferably between\
    \ 0.5 and 2 seconds)."
  mdcn: "\n**图3.6.** 路由器DHCP中选择ESP32所需IP的示例\n\n![](img/bc50e9ed6994305c0caada2236432c8a_51_0.png)\n\
    \n## 图3.7. 路由器服务器端口转发示例\n\n在这种情况下，外部输入端口的值也应包含在移动应用程序中，方法是输入其值并在前面加上\":\"字符，如图3.4所示。\n\
    \n版权所有 © 2020 SEVER SPÂNULESCU\n\n保留所有权利。\n\n未经出版商明确书面许可，不得以任何方式复制或使用本书或其任何部分，但书评或学术期刊中简短引用除外。\n\
    \n首次印刷：2018\n\n第二版：2020\n\n## 以及从MIT App Inventor应用程序向ESP32服务器传输数字命令\n\n## 模拟和数字传输的原理\n\
    \n下面描述了一个在ESP32服务器上运行的程序示例，该程序能够接收来自客户端的数字值（使用按钮）和模拟值（使用光标）。\n\n对于输出端的模拟值，您可以使用脉宽调制技术\
    \ - PWM。Arduino IDE中存在的analogWrite()指令目前仅适用于ESP8266微控制器（具有10位分辨率），因此对于ESP32，我们将使用ledcAttachPin()和ledcDetachPin()指令。\n\
    \n与其他微控制器类似，ESP32微控制器的某些GPIO引脚可以生成矩形PWM脉冲。经过积分（从而滤除交流分量，仅保留直流分量）后，当填充因子在0%到100%之间变化时，这些脉冲被转换为0到3V之间的连续电平。这种工作模式等效于数模转换（DAC），而无需使用此类集成转换器。转换电压分辨率由脉冲发生器使用的步数决定，通常根据以下通用关系，具有8到16位的分辨率。\n\
    \n对于n位分辨率的计数器，步数为：\n\n电压分辨率为：\n\n脉冲的最大频率，对于时钟频率，\n\n为了便于积分，我们建议使用较高的脉冲频率，但这可能需要根据公式降低分辨率。与集成DAC相比，这种技术的优点在于信号放大器可以在D类模式下工作，效率达到80-95%。集成DAC需要A类放大器，其效率低于50%，这意味着需要大型散热器和高能耗。然而，集成DAC转换的优点是生成的频率理论上与分辨率无关。\n\
    \n## 在Arduino IDE中通过PWM进行数模转换\n\n在Arduino IDE编程环境中，ledcAttachPin()和ledcDetachPin()指令将PWM通道附加到引脚和从引脚分离。ledcWrite()指令写入要计数的脉冲数，该数除以最大脉冲数即确定填充因子。例如，对于10位分辨率，总步数为1024，因此ledcWrite(300)指令将给出约30%的填充因子，即约1V的模拟电压。\n\
    \n在接下来的程序中，我们首先声明常量和变量，其中一些对于PWM输出是必要的。然后，服务器使用静态IP地址连接到具有已知SSID和密码的路由器。在示例中，使用了地址192.168.1.246，端口85（从WAN转发到此LAN地址）。\n\
    \n在此程序中，我们还说明了如何为服务器设置静态IP。为此，使用WiFi.config(local_IP, gateway, subnet)指令，并在前面加上IP、网关和子网指令：\n\
    \n```\n......\nIPAddress local_IP(192, 168, 1, //static IP\nIPAddress gateway(192,\
