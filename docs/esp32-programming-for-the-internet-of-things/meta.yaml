    # 1. General presentation of the book and hardware modules of digital and analog
    inputs


    To be able to read digital inputs, the inputMode with INPUT_PULLUP must be set
    on the pins, then, in the infinite loop, the DigitalRead instruction will be used,
    followed by publishing the topic and the Boolean payload.


    The touch inputs will be read by the touchRead instruction and the value will
    become payload 1 or 0 after comparing with a threshold value (typically between
    20 and 60, depending on'
  - '[PAGE 276]


    the desired sensitivity.


    To be able to read analog inputs on pins that allow this, use the analogRead()
    instruction in the main loop. If there are not many other operations in the loop,
    you can mediate the conversions'' results to reduce the noise level. For this,
    you can make a summation of a large number of consecutive samples, after which
    the result is divided by their number and is published using a proper topic and
    a string type payload. Transforming the full value of the conversions average
    into a string can be done with the sprint() statement, for example.


