- img_proc: true
  md: 'Notice that when a digital ON or OFF command is transmitted, you have to use
    the ledcDetachPin() instruction. It will detach that pin from the PWM channel
    if you previously used an analog PWM command for that pin.


    The client program assumes that a GET request is composed of a string of characters
    like:

    GET /ON HTTP/1.1\r if the button ON has been touched

    GET /OFF HTTP/1.1\r if the button OFF has been touched

    GET /67 HTTP/1.1\r if the slider is positioned at the value 67

    GET /111 HTTP/1.1\r if the slider is positioned at the value 111

    etc.


    Therefore, the useful information is comprised between the first character "/"
    and the "H" character, being the string "ON", "OFF" or a numeric value. When a
    string finished with the "\r" is received at the server, it separates the sub-string
    containing the information and tries to transform it into a number.


    If a positive number is obtained, it means that it is a value from the slider,
    so a pin is attached to a PWM channel and the value is communicated to the ledcWrite()
    instruction. If a positive number is not obtained, we must compare the string
    with ON and then with OFF, detach the PWM channel from the pin, and digitally
    write to it a 1 or a 0 respectively.


    Next, we can generate HTML instructions for a WEB page that allows the digital
    pin control, as in previous programs.'
