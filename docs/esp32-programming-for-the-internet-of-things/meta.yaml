- img_proc: true
  md: To facilitate integration, we recommend a higher pulses frequency, but this
    may require a lower resolution, according to formulas. Compared to integrated
    DAC, this technique has the advantage that signal amplifiers can work in D-Class,
    having an 80-95% efficiency. Integrated DAC requires A-Class amplifiers, which
    has an efficiency of less than 50%, implying big radiators and high energy consumption.
    However, the integrated DAC conversion has the advantage that the generated frequency
    is theoretically independent of resolution.
