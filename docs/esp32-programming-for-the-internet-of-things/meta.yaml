    To use Node-Red installed in Windows, enter in browser the local or public address
    of your PC.


    The local address can be used only if all ESP32 devices are connected to the same
    WiFi network with PC. This address can be found either in完全 network settings (if
    DHCP is not used) or in the router.


    Of course, assigning a static PC address and entry from its public IP is more
    advantageous, allowing client devices to be used from anywhere from outside.


    Assigning a static address can be done in the Network and Sharing Center -> Change
    adapter settings, where IPv4 will specify the desired IP along with the other
    parameters. It is necessary to pair the computer''s MAC address with this address
    to be reserved on the router if DHCP is active.


    To access the Node-Red services on the 1880 port, and the Mosquitto port on the
    1883 port, these ports must be routed to the local IP of the PC, as exemplified
    in figures 2.5 or 3.8. For example, if the local IP of the PC is 192.168.1.50,
    the ports 1880 and 1883 of the router must be forwarded to 192.168.1.50, and another
    device in this LAN may access the page at 192.168.1.50:1880/ui.'
- md: '# Node-Red


    Creating applications in Node-red is usually done on a PC or other device with
    a large enough screen to see all the elements of the graphical interface simultaneously.
    For this, the following conditions are required:


    1.  The ESP program must specify a valid broker (the server and the port assigned),
    whether public or local, and it must be running, it does not matter on which computer,
    but with access to the WiFi network of the Node-Red and the Mosquitto broker.

    2.  Node-Red must be running on the programming computer or another accessible
    IP device.

    3.  If a local broker is used, this broker (for example, Mosquitto) must run on
    the server device.


    The examples that will be presented below assume that the general program for
    three digital outputs, an analog output, four digital inputs, and one analog input
    with mqttServer is loaded on the ESP32 module and uses the address on which the
    broker is running. Several mqttServer variants were written in the listing: a
    broker on a public server, a broker on a local network (local IP) server, or a
    broker on an own server outside the local network (public IP):


    ```cpp

    const char* mqttServer = "test.mosquitto.org";//Broker public in cloud

    //const char* mqttServer = "192.168.1.119";//IP local on own server

    //const char* mqttServer = "5.2.153.10";//IP public on own server

    ```


    **Note: saving and restoring the Node-Red programs**


    Saving and loading the programs developed in Node-Red is quite different from
    other files. This is because Node-Red may be running on an external device, so
    the related file will form on that remote device.


    If Node-Red is used on a Windows computer, with a localhost broker, exporting
    (saving) a Node-Red program is done in JSON (JavaScript Object Notation) format.
    We may use Menu-> Export-> Library, and the file will appear in C:\Users\ [user]\node-red\lib\flows
    directory.


    Importing (loading) will be done from the directory with Menu-> Import-> Library.


    To use Node-Red on a separate broker the export can be done in the clipboard and
    from there you can copy and save it to a text file on your current computer. For
    import, the text file will be opened, the content copied then Import-> Clipboard,
    and paste the contents of the text file. Following these actions, a new tab containing
    that flow will appear. The old tab can be deleted by double-clicking on it and
    then Delete.


    # Outputs using Node-Red and Mosquitto on a Windows computer


    ## Digital outputs


    In the following, on the ESP32 module the previously presented program, Mqtt\_3od1oa4id1ia.ino
    will be used. As shown by the abbreviations in the name, it handles:


    -   3 digital outputs with the following topics: DigOut/led1, DigOut/led2, respectively
    DigOut/led3;

    -   An analog output with the AnaOut/Ana1 topic;

    -   2 digital inputs on switches, with the following topics: DigIn/Sw1 and DigIn/Sw2;

    -   2 digital touch inputs, with the following topics: DigIn/Touch1 and DigIn/Touch2;

    -   1 analog input with the AnaIn/Ana1 topic;


    The Node-Red programs can be made on a PC, or even on a mobile device (smartphone
    or tablet), running a standard browser.

    In a first variant, both devices (PC and ESP) will be in the same network (with
    the same class of IPs). For example, ESP32 program settings can be:


    ```cpp

    #include

    #include

    #include

    const char* ssid = "myssid";

    const char* password =

    const char* mqttServer = "192.168.1.102";//IP local on own server

    const int mqttPort = 1883;//specific broker Mosquitto

    .

    .

    .

    ```


    If you want to use a local server, you have to find its local IP from the IPV4
    properties of the network adapter, and use it in the ESP32 program (in the above
    example, it is 192.168.1.102). Now, start on PC the Node-Red and mosquitto programs,
    then compile and load the ESP program. The Arduino IDE Serial Monitor will show
    a response of the following type:


    ![](img/bc50e9ed6994305c0caada2236432c8a_302_0.png)


    **Figure 14.1.** Serial messages sent when MQTT connecting


    As shown before, we can enter into the Node-Red programming environment using
    the address localhost:1880 in a browser.


    In the window that appears (figure 14.2), there are the following fields:


    1.  in the left column, the field containing the available nodes;

    2.  in the middle, the graphics programming area;

    3.  in the right column, the settings and commands area.


    To begin with, create a group by selecting the Dashboard -> Layout tab in the
    settings area and clicking on the addition sign (+ group) next to Tab 1.


    ![](img/bc50e9ed6994305c0caada2236432c8a_303_0.png)


    **Figure 14.2.** The main Node-RED window in a local browser


    By clicking on the edit symbol next to Group 1, you can change its name (Figure
    14.3). Update and observe that in the top right, the Deploy field appears in red.
    It means that changes have been made to the chart, and the Deploy command is required.
    It happens whenever a change is made to the chart, requesting saving/updating
    changes.


    ![](img/bc50e9ed6994305c0caada2236432c8a_304_0.png)


    **Figure 14.3.** Editing a group in the dashboard


    Next, you can select a command switch from the nodes column area of the dashboard.
    It will be drag-and-drop copied to the programming area, where it will appear
    with a red triangle in the upper right side, indicating an inappropriate configuration,
    along with a circle indicating the need for Deploy (Figure 14.4).


    ![](img/bc50e9ed6994305c0caada2236432c8a_306_0.png)


    **Figure 14.4.** Adding a command switch


    Also, an Output-> mqtt node from the top of the node field will be copied, and
    will be linked to the mouse as in Figure 14.5 (with Deploy).


    ![](img/bc50e9ed6994305c0caada2236432c8a_307_0.png)


    **Figure 14.5.** Adding a Output-> mqtt node


    Double-click on the switch and then edit it (click on the pencil icon) as in figure
    14.6. Choose the Digital Out group, write the label, the topic (the one corresponding
    to the ESP32 program), and the name. The payload is selected according to the
    ESP32 program - the "numeric" type, value 1 for On and 0 for Off. Editing ends
    with a click on Done, eventually followed by Deploy.


    ![](img/bc50e9ed6994305c0caada2236432c8a_308_0.png)


    **Figure 14.6.** Editing the switch node


    Double click on the “mqtt out” type node, then, in the Server area, select Add
    new mqtt-broker and then go to the edit icon. Give a name to allow a subsequent
    change of selection, and then the server address (Figure 14.7).


    **The MQTT server address must be the same in the ESP program and the Node-Red
    program.**


    For example, if the ESP32 program specifies the local address of the computer
    running mosquitto, here is written "localhost".


    If a public broker is used, the ESP32 program specifies the address of that server,
    and the same address is specified here, eg test.mosquitto.org.


    ![](img/bc50e9ed6994305c0caada2236432c8a_309_0.png)


    **Figure 14.7.** Editing the mqtt out


    Editing the broker ends with the Update command, which returns the edit window
    of the mqtt node. Here the topic declared for the switch is written, and a node-specific
    name is given, then it ends with Done.


    Now it is mandatory to make Deploy (which saves the settings for the previous
    node, if it was not already done).


    If both nodes appear without red triangles or circles that require Deploy, and
    the local broker program is started (as mentioned in Program Files\mosquitto->
    mosquitto.exe), the text "connected" appears as in figure 14.8 below the node,
    and the program can be tested. To do this, click on the link icon at the top right,
    which takes us to the user interface (UI) page, localhost:1880/ui/... This address
    can be accessed, of course, directly from a browser on any device coupled to the
    local network.


