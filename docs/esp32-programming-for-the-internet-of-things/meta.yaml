    #include

    #include

    const char* ssid = "myssid";

    const char* password =

    const char* mqttServer = "192.168.1.102";//IP local on own server

    const int mqttPort = 1883;//specific broker Mosquitto

    .

    .

    .

    ```


    如果要使用本地服务器，必须从网络适配器的 IPv4 属性中找到其本地 IP 地址，并在 ESP32 程序中使用它（在上面的示例中，它是 `192.168.1.102`）。现在，在
    PC 上启动 Node-Red 和 mosquitto 程序，然后编译并加载 ESP 程序。Arduino IDE 串口监视器将显示如下类型的响应：


