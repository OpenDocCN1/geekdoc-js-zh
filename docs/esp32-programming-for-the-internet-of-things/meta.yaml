    ## 服务器输出的控制


    ### 9.1. 原理


    如客户端-服务器通信的一般框图所示，在某些应用中，网页客户端必须发送将驱动服务器某些模拟输出的模拟值


    在第 4 章中，我们使用预制的滑块类型元素进行了这样的通信，并将其集成到 MIT 应用中，适用于 Android 移动设备。


    我们回顾，在 Arduino IDE 中，可以使用 PWM 技术在引脚上实现模拟输出。我们可以使用 ledcAttachPin() 和 ledcDetachPin()
    指令将 PWM 通道附加到引脚和从引脚分离。ledcWrite() 指令写入要计数的脉冲数，该脉冲数除以最大脉冲数，确定填充因子，从而确定在该输出端将持续找到的
    Vcc 电压的分数。


    对于网页客户端，我们可以使用相同的技术以及使用 HTML、CSS、JavaScript 或其他技术为程序客户端端创建的滑块类型元素。


    ## 模拟控制元素


    可用作电位器的 HTML 对象是 <input type="range">，其声明在一个分区中。在声明它们时，可以指定初始参数，并可以调用事件响应函数。


    以下示例声明了一个包含滑块的分区，该滑块具有一个响应事件的函数，具有以下当前参数：this（必需）、slid1（声明标识符）和 value1（在分区中声明用于数字显示的标识符）。


    ```

    <div class="slidecontainer">

    ```


    ```

    输入滑块 1：

    <input type="range" min="0" max="100" value="1" id="slid1">

    ```


    ```

    模拟传输（%）：<span id="AnaTr">0</span>

    ```


    可以从 slid1.value 属性读取滑块的当前值，并将其分配给网页的其他元素。

