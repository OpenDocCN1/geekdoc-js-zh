    Node-Red is a development tool for visual programming, developed by IBM and designed
    specifically for IoT applications. It is based on Node.js and, through the graphical
    interconnection of nodes, generates internal code for JavaScript functions.


    This environment has the advantage that it allows the rapid development of a web
    page (Figure 13.1) for command and monitoring a large number of clients, directly
    from a browser, without the need for an application installed on each client,'
