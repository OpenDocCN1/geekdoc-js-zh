    字段指定定时器间隔（以毫秒为单位），并勾选 TimerEnabled 复选框。


    当定时器事件发生时（例如每 1000 毫秒），会对这些全局变量进行检测。若其中某个变量为“true”，则将其置为“false”，之后将执行与图 4.2 程序中相同的特定动作。


