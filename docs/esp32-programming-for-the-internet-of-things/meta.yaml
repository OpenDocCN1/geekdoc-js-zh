- md: "## Figure 10.2. Example of the programming instance using the ESP-IDF development\
    \ environment in Eclipse\n\n## Part II. IoT communications using MQTT technology\n\
    \n## MQTT - Message Queuing Telemetry Transport technology\n\n## Presentation\
    \ of MQTT technology\n\nMQTT is a standard messaging protocol in a complex network\
    \ of correspondents, with the following favorable features:\n\n-   Traffic is\
    \ minimal, so a message can have from two bytes up to 256 megabytes, allowing\
    \ faster speeds than classic technologies\n-   Clear organization of traffic routes,\
    \ with directions and hierarchy, allowing effortless development of the network\
    \ by adding new nodes\n-   The possibility of confirming and even ensuring the\
    \ delivery of the message by setting the Quality of Service parameter (QoS).\n\
    \nThe main drawback of MQTT technology is the increased volume of hardware involved,\
    \ as there is a need for a messages dispatching server called a broker. This does\
    \ not recommend MQTT for quite simple applications, which require a minimal cost.\
    \ Above a certain level of complexity of the IoT system, the advantages of MQTT\
    \ are becoming relevant, so here we will present some practical solutions for\
    \ the implementation of this technology.\n\nIn organizing an IoT system based\
    \ on MQTT, there may be an arbitrary number of fixed or portable nodes coupled\
    \ to the Internet, capable of sending or receiving messages, referred to as clients.\
    \ A client can be, for example, an ESP32 module that sends messages about the\
    \ status of its entries and receives command messages for some of the outputs.\
    \ Another correspondent client may be an application on a smartphone or tablet,\
    \ or it can be a PC running an application on a web page. Unlike the standard\
    \ client/server model, the two clients mentioned do not communicate directly but\
    \ through the broker server, which takes over and distributes the messages to\
    \ the clients.\n\nWhen a client sends information to the broker, he publishes\
    \ a message that has two parts: **topic** and **payload**. The topic identifies\
    \ the subject of the message, which is part of a list that is common to all correspondents,\
    \ often having a hierarchical structure, including sub-topics, as in figure 11.1.\
    \ The payload contains specific information related to the topic.\n\nFor example,\
    \ the topic published by a client without a specific destination may be as Temperature\
    \ / Camera₁, Temperature / Camera₂, ..., or Pressure / Reactor₈, Pressure / Boiler₅,\
    \ etc. Notice the hierarchy introduced by mentioning a general part of the subject\
    \ separated from the private part by a '/' character. The second part of the message,\
    \ payload, may contain a numeric value or text, for example \"23\", \"23.7°C\"\
    , \"3.2 bar\", \"ON\", \"OFF\" etc.\n\n![](img/bc50e9ed6994305c0caada2236432c8a_237_0.png)\n\
    \n## Figure 11.1. Schema of a portion of an MQTT network\n\nTo receive a message,\
    \ a client must be subscribed to the subject of the message. Thus, the message\
    \ with a certain topic, published by a client, is taken over by the server and\
    \ sent to all clients subscribed to that topic.\n\nIt can be noticed that in this\
    \ way a very logical extension of the network can be made by adding clients and\
    \ topics, the distribution being automatically provided by the broker.\n\nThe\
    \ MQTT protocol also allows cases that can be treated specifically. An example\
    \ is when none of the subscribers to a particular topic is started. In this case,\
    \ the client who publishes a message can request that the message be retained\
    \ on the server to be delivered to a subscriber to that topic when it will be\
    \ started. Also, there may be the possibility that when a client, subscribed to\
    \ a topic, stops, a warning message will be sent to the subscribers of the network\
    \ (Last Will and Testament). Of course, it is forwarded to the broker beforehand,\
    \ and when the broker sees the disconnection, usually ungracefully, the client\
    \ sends it to the other subscribers. There are some recommended practices for\
    \ such special situations that will not be presented here to not interrupt the\
    \ main exposure, but can be consulted on the Internet, for example at the official\
    \ MQTT documentation.\n\nThe broker program can be run by a personal server, as\
    \ will be shown in a later chapter, or it may be a public one, chosen from the\
    \ many variants available on the Internet, as exemplified in Table 11.1.\n\n**Table\
    \ 11.1. Examples of public brokers.**\n\n| Broker Name | Address | Port | Notes\
    \ |\n| :--- | :--- | :--- | :--- |\n| Mosquitto (Eclipse) | test.mosquitto.org\
    \ | 1883 | Test server, no persistence |\n| HiveMQ | broker.hivemq.com | 1883\
    \ | Public test broker |\n| EMQ X | broker.emqx.io | 1883 | Public broker by EMQ\
    \ |\n| Adafruit IO | io.adafruit.com | 1883 | For Adafruit users |\n| CloudMQTT\
    \ | cloudmqtt.com | 1883 | Free plan available |\n| ThingsBoard | demo.thingsboard.io\
    \ | 1883 | For ThingsBoard platform |\n| MQTT.js | broker.hivemq.com | 8884 |\
    \ WebSocket connection |\n\nSince 2009, Nick O'Leary (IBM) has adapted MQTT technology\
    \ to the Arduino-IDE development environment through the PubSubClient library,\
    \ which has made MQTT use of the new ESP32, ESP8266, and other microcontrollers\
    \ to be very accessible. The description of the API functions may be found at\
    \ the library's GitHub page. The following examples of programs use this library,\
    \ and tests have shown good stability and performance at the standard level of\
    \ other implementations.\n\nThe work plan in these chapters is the following:\
    \ PubSubClient is installed, the ESP32 program is written, an MQTT application\
    \ is installed on a PC or mobile device (here HelloIoT is chosen), and a public\
    \ broker is invoked. Subsequently, the MQTT client system will be created on a\
    \ web page using Node-Red technology, and a broker will be installed on a personal\
    \ server using a mini PC (Raspberry Pi or equivalent).\n\n## Installation and\
    \ testing the PubSubClient library\n\nDownloading the current version of the PubSubClient\
    \ library can be made at the GitHub repository. To install it, go to Arduino->\
    \ Sketch-> Include Library-> Add .zip Library and choose the previously downloaded\
    \ pubsubclient-master.zip file.\n\nThe program to be run on the ESP32 client is\
    \ similar to the standard examples that appear after the PubSubClient library\
    \ installation (Arduino IDE: File-> Examples-> PubSubClient).\n\nA minimal program\
    \ that can respond to a topic launched by a client for a user LED ON/OFF command\
    \ on the ESP32 board is the one in Figure 11.2.\n\n```\n#include <WiFi.h>\n#include\
    \ <PubSubClient.h>\n\nconst char* ssid = \"MySSID\";\nconst char* password = \"\
    YourPassword\";\nconst char* mqttServer = \"test.mosquitto.org\";//Public Broker\
    \ in cloud\n//const char* mqttServer = \"broker.hivemq.com\";//another public\
    \ Broker\n//const char* mqttServer = \"192.168.1.119\";// Local IP on your own\
    \ server\n//const char* mqttServer = \"5.12.153.11\";// IP public on your own\
    \ server\nconst int mqttPort = 1883;// Specific to the mosquito broker\nconst\
    \ char led1 = 2;//Blue led on ESP32 DevKit\n#define LED1_TOPIC     \"DigOut/led1\"\
    \nWiFiClient espClient;\nPubSubClient client(espClient);\n//==============================\n\
    void receivedCallback(char* topic, byte* payload, unsigned int length){\n    if(!client.connected()){\n\
    \        // Reconnect logic would be here\n    }\n    Serial.print(\"Message received:\
    \ \");\n```"
  mdcn: "\n## 图 10.2. 在 Eclipse 中使用 ESP-IDF 开发环境进行编程实例的示例\n\n## 第二部分. 使用 MQTT 技术的物联网通信\n\
    \n## MQTT — 消息队列遥测传输技术\n\n## MQTT 技术介绍\n\nMQTT 是一种用于复杂通信网络的标准消息协议，具有以下优良特性：\n\n\
    -   流量极小，因此一条消息可以少至 2 字节，多至 256 兆字节，比传统技术具有更快的传输速度\n-   流量路径组织清晰，具有明确的方向和层次，可轻松通过添加新节点来扩展网络\n\
    -   可通过设置服务质量参数（QoS）来确认甚至确保消息的递送\n\nMQTT 技术的主要缺点是涉及的硬件数量较多，因为需要一台称为代理（broker）的消息调度服务器。这使得\
    \ MQTT 不太适合要求极低成本的简单应用。当物联网系统的复杂程度超过一定水平后，MQTT 的优势才会变得明显，因此这里将介绍一些实施该技术的实际解决方案。\n\
    \n在基于 MQTT 组织物联网系统时，可以有任意数量的固定或便携式节点连接到互联网，能够发送或接收消息，这些节点被称为客户端。例如，一个客户端可以是 ESP32\
    \ 模块，它发送有关其输入状态的消息，并接收某些输出的命令消息。另一个通信客户端可以是智能手机或平板电脑上的应用，也可以是运行网页应用的 PC。与标准的客户端/服务器模型不同，上述两个客户端并不直接通信，而是通过代理服务器进行，代理服务器负责接管并将消息分发给客户端。\n\
    \n当客户端向代理发送信息时，它发布一条包含两部分的消息：**主题（topic）**和**负载（payload）**。主题标识消息的主题，它是所有通信方共有的列表的一部分，通常具有层次结构，包括子主题，如图\
    \ 11.1 所示。负载包含与主题相关的具体信息。\n\n例如，没有特定目的地的客户端发布的主题可能是 Temperature / Camera₁、Temperature\
    \ / Camera₂、……，或者 Pressure / Reactor₈、Pressure / Boiler₅ 等。注意通过使用 '/' 字符分隔主题的通用部分和私有部分来引入的层次结构。消息的第二部分，即负载，可能包含数值或文本，例如\
    \ \"23\"、\"23.7°C\"、\"3.2 bar\"、\"ON\"、\"OFF\" 等。\n\n![](img/bc50e9ed6994305c0caada2236432c8a_237_0.png)\n\
    \n## 图 11.1. MQTT 网络部分架构示意图\n\n要接收消息，客户端必须订阅消息的主题。因此，某个客户端发布的具有特定主题的消息会被服务器接收，并发送给所有订阅了该主题的客户端。\n\
    \n可以发现，通过这种方式可以非常合乎逻辑地扩展网络，只需添加客户端和主题，分发工作由代理自动完成。\n\nMQTT 协议还允许处理一些特殊情况。例如，当某个特定主题的订阅者都没有启动时。在这种情况下，发布消息的客户端可以请求将消息保留在服务器上，以便在该主题的订阅者启动时递送。此外，还存在一种可能：当订阅了(Routing)某个主题的客户端停止时，会向网络中的订阅者发送一条警告消息（遗嘱，Last\
    \ Will and Testament）。当然，这条消息需要事先转发给代理，当代理检测到客户端断开连接（通常是非正常断开）时，会将其发送给其他订阅者。这类特殊情况有一些推荐的做法，此处暂不介绍以免中断主要内容的阐述，但可以在互联网上查阅，例如参考\
    \ MQTT 官方文档。\n\n代理程序可以由个人服务器运行，如后续章节所示；也可以是公共代理，从互联网上众多可用方案中选择，如表 11.1 所示。\n\n\
    **表 11.1. 公共代理示例**\n\n| 代理名称 | 地址 | 端口 | 备注 |\n| :--- | :--- | :--- | :--- |\n\
    | Mosquitto (Eclipse) | test.mosquitto.org | 1883 | 测试服务器，无持久化 |\n| HiveMQ | broker.hivemq.com\
    \ | 1883 | 公共测试代理 |\n| EMQ X | broker.emqx.io | 1883 | EMQ 提供的公共代理 |\n| Adafruit\
    \ IO | io.adafruit.com | 1883 | 面向 Adafruit 用户 |\n| CloudMQTT | cloudmqtt.com\
    \ | 1883 | 提供免费方案 |\n| ThingsBoard | demo.thingsboard.io | 1883 | 面向 ThingsBoard\
    \ 平台 |\n| MQTT.js | broker.hivemq.com | 8884 | WebSocket 连接 |\n\n自 2009 年起，Nick\
    \ O'Leary（IBM）通过 PubSubClient 库将 MQTT 技术适配到 Arduino-IDE 开发环境，这使得在新的 ESP32、ESP8266\
    \ 及其他微控制器上使用 MQTT 变得非常便捷。API 函数的描述可在该库的 GitHub 页面找到。以下程序示例均使用该库，测试表明其在标准水平上具有良好的稳定性和性能，与其他实现相当。\n\
    \n这些章节的工作计划如下：安装 PubSubClient，编写 ESP32 程序，在 PC 或移动设备上安装 MQTT 应用（此处选择 HelloIoT），并调用公共代理。随后，将使用\
    \ Node-Red 技术在网页上创建 MQTT 客户端系统，并在使用迷你 PC（树莓派或同等设备）的个人服务器上安装代理。\n\n## PubSubClient\
    \ 库的安装与测试\n\nPubSubClient 库当前版本可在 GitHub 仓库下载。安装方法：前往 Arduino -> 项目 -> 加载库 ->\
    \ 添加 .zip 库，然后选择之前下载的 pubsubclient-master.zip 文件。\n\n要在 ESP32 客户端上运行的程序类似于 PubSubClient\
    \ 库安装后出现的标准示例（Arduino IDE：文件 -> 示例 -> PubSubClient）。\n\n一个能够响应客户端发布主题的最低限度程序，用于实现\
    \ ESP32 开发板上用户 LED 的开关命令，如图 11.2 所示。\n\n```\n#include <WiFi.h>\n#include <PubSubClient.h>\n\
    \nconst char* ssid = \"MySSID\";\nconst char* password = \"YourPassword\";\nconst\
    \ char* mqttServer = \"test.mosquitto.org\";//Public Broker in cloud\n//const\
    \ char* mqttServer = \"broker.hivemq.com\";//another public Broker\n//const char*\
    \ mqttServer蔬菜 = \"192.168.1.119\";// Local IP on your own server\n//const char*\
    \ mqttServer = \"5.12.153.11\";// IP public on your own server\nconst int mqttPort\
    \ = 1883;// Specific to the mosquito broker\nconst char led1 = 2;//Blue led on\
    \ ESP32 DevKit\n#define LED1_TOPIC     \"DigOut/led1\"\nWiFiClient espClient;\n\
    PubSubClient client(espClient);\n//==============================\nvoid receivedCallback(char*\
    \ topic, byte* payload, unsigned int length){\n    if(!client.connected()){\n\
    \        // Reconnect logic would be here\n    }\n    Serial.print(\"Message received:\
    \ \");\n```\n"
