    \ server\n  Serial.println(\"HTTP server started\");\n}\n//================ LOOP\
    \ ================\nvoid loop(void){\n}\n```\n\nWe may see that two more state\
    \ variables were added to read the touch inputs, and the global state string includes\
    \ them. As the values generated by the touch inputs span a large domain, we must\
    \ compare it with a threshold value, 50.\n\nThe index.h file will contain additional\
    \ elements for displaying the touch state. We chose SVG circles here and a threshold\
    \ value 20 for changing their color: yellow when the logic state is 1, and gray\
    \ when the logical state is 0. The complete index.h file is presented in figure\
    \ 7.9, with the new/modified parts highlighted.\n\n```cpp\nconst char MAIN_page\
    \ [] PROGMEM = R\"===(\nhtml>\n```\n\n# AJAX ESP server\n\n```html\ntype=\"button\"\
    \ onclick=\" ClientToServer(1)\"\nid=\"dout1\">DigOut_1\n```\n\n```html\ntype=\"\
    button\" onclick=\" ClientToServer(2)\"\nid=\"dout2\">DigOut_2\n```\n\nDigital\
    \ Input:\n\n```html\ntype=\"button\" id=\"dout3\">DIn1\n```\n\nADC Value is :\
    \ id=\"ADCValue\">o\n\nTouch state:\n\n```html\nid=\"Disk1\" cx=\"250\" cy=\"\
    100\" r=\"30\" fill=\"Red\" />\nid=\"Disk2\" cx=\"50\" cy=\"100\" r=\"30\" fill=\"\
    Red\" />\n)====\";\n```\n\n**Figure 7.9.** The file for generating a page for\
    \ commanding two digital outputs, and monitoring some logical inputs and an analog\
