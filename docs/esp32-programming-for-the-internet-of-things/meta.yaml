  md: 'To send a command that contains a specific parameter, a query structure will
    be used - the sign "?" followed by as following:


    ```

    xhttp.open("GET","url?param="+val, true);

    xhttp.send();

    ```


    For transmitting several parameters, the query structure will contain the sign
    "?" followed by pairs parameter_n = separated by the "&" sign:


    ```

    xhttp.open("GET","url?param1=val1¶m2=VAL2¶m3=val3", true);

    xhttp.send ();

