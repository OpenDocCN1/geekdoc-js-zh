  - '[PAGE 235]


    # # presentation of MQTT technology


    MQTT is a standard messaging protocol in a complex network of correspondents,
    with the following favorable features:


    +   - Traffic is minimal, so a message can have from two bytes up to 256 megabytes,
    allowing faster speeds than classic technologies


    +   - Clear organization of traffic routes, with directions and hierarchy, allowing
    effortless development of the network by adding new nodes


    +   - The possibility of confirming and even ensuring the delivery of the message
    by setting the Quality of Service parameter (QoS).


    The main drawback of MQTT technology is the increased volume of hardware involved,
    as there is a need for a messages dispatching server called a It does not recommend
    MQTT for quite simple applications, which require a minimal cost. Above a certain
    level of complexity of the IoT system, the advantages of MQTT are becoming relevant,
    so here we will present some practical solutions for the implementation of this
    technology.


    In organizing an IoT system based on MQTT, there may be an arbitrary number of
    fixed or portable nodes coupled to the Internet, capable of sending or receiving
    messages, referred to as clients. A client can be, for example, an ESP32 module
    that sends messages about the status of its entries and receives command messages
    for some of the outputs. Another correspondent client may be an application on
    a smartphone or tablet, or it can be a PC running an application on a web page.
    Unlike the standard client/server model, the two clients mentioned do not communicate
    directly but through the broker server, which takes over and distributes the messages
    to the clients.


    When a client sends information to the broker, he publishes a message that has
    two parts: **topic** and The topic identifies the'
  - '[PAGE 236]


    subject of the which is part of a list that is common to all correspondents, often
    having a hierarchical structure, including sub-topics, as in figure 11.1. The
    payload contains specific information related to the topic.'
  - '[PAGE 237]


    For example, the topic published by a client without a specific destination may
    be as Temperature / Camera₁, Temperature / Camera₂, ..., or Pressure / Reactor₈,
    Pressure / Boiler₅, etc. Notice the hierarchy introduced by mentioning a general
    part of the subject separated from the private part by a ''/'' character. The
    second part of the message, payload, may contain a numeric value or text, for
    example "23", "23.7°C", "3.2 bar", "ON", "OFF" etc.


    ![](img/bc50e9ed6994305c0caada2236432c8a_237_0.png)


    # Figure 11.1. Schema of a portion of an MQTT network'
  - '[PAGE 238]


    To receive a message, a client must be subscribed to the subject of the message.
    Thus, the message with a certain topic, published by a client, is taken over by
    the server and sent to all clients subscribed to that topic.


    It can be noticed that in this way a very logical extension of the network can
    be made by adding clients and topics, the distribution being automatically provided
    by the broker.


    The MQTT protocol also allows cases that can be treated specifically. An example
    is when none of the subscribers to a particular topic is started. In this case,
    the client who publishes a message can request that the message be retrieved on
    the server to be delivered to a subscriber to that topic when it will be started.
    Also, there may be the possibility that when a client, subscribed to a topic,
    stops, a warning message will be sent to the subscribers of the network (Last
    Will and Testament). Of course, it is forwarded to the broker beforehand, and
    when the broker sees the disconnection, usually ungracefully, the client sends
    it to the other subscribers. There are some recommended practices for such special
    situations that will not be presented here to not the main exposure, but can be
    consulted on the Internet, for example at


    The broker program can be run by a personal server, as will be shown in a later
    chapter, or it may be a public one, chosen from the many variants available on
    the Internet, as exemplified in Table 11.1.


