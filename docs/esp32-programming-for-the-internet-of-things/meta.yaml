- md: "# **Figure 9.3.** Program for command and monitor digital and analog inputs\
    \ and outputs\n\n## Programming using the ESP-IDF development environment and\
    \ ECLIPSE\n\nProgramming the ESP8266/ESP32 using the Arduino IDE software development\
    \ environment, although very simple to use, has some drawbacks for complex applications,\
    \ and first of all the lack of debugging possibilities. That is why, for developing\
    \ such applications on ESP32, it is recommended to use the Espressif IoT Development\
    \ Framework (ESP-IDF).\n\nYou may find the full documentation for programming\
    \ the ESP32 module in this environment at:\n<https://esp-idf.readthedocs.io/en/latest/index.html>.\n\
    \n![Figure 10.1 - schema of programming using the ESP-IDF environment](img/bc50e9ed6994305c0caada2236432c8a_222_0.png)\n\
    \n**Figure 10.1.** Schema of programming using the ESP-IDF environment\n\n## The\
    \ ESP-IDF development environment and setting the toolchain\n\nWe tested the text\
    \ presented below in September 2018, in Eclipse Oxygen. Some Implementation changes\
    \ may occur in the coming years, so that you may have to make some changes in\
    \ setting up the toolchain, as it also did in previous years. As in other areas\
    \ of IT, to cope with rapid technological advances, you should try to understand\
    \ the mechanisms and not just memorize them.\n\nTo begin with, download and unzip\
    \ the installation file from the address:\n<https://dl.espressif.com/dl/esp32_win32_msys2_environment_and_toolchain-20180110.zip>\n\
    \nMove the msys32 directory to the root `C:\\`, then go to this directory and\
    \ run. In the new window (terminal type) the working area is set with the command:\n\
    \n```\nmkdir -p ~/esp\n```\n\nIt can be seen in Windows that the `C:\\msys32\\\
    home\\USERNAME\\esp\\` subdirectory was created. From the mingw32 terminal we\
    \ enter the work folder with the command:\n\n```\ncd ~/esp\n```\n\nGive the esp-idf\
    \ environment repository the cloning command:\n\n```\ngit clone --recursive https://github.com/espressif/esp-idf.git\n\
    ```\n\nAt this point, the `C:\\msys32\\home\\USERNAME\\esp\\esp-idf\\` subdirectory\
    \ will appear, and the path to it must be set and added to the user profile, hence\
    \ called `IDF_PATH`. For this, go to the `C:\\msys32\\etc\\profile.d\\` directory\
    \ where we must create a text file with the name adding here the IDF_PATH with\
    \ the line:\n\n```\nexport IDF_PATH=\"C:/msys32/home/USERNAME/esp/esp-idf\"\n\
    ```\n\nHere and below, instead of `USERNAME`, the Windows user name will appear,\
    \ visible in the `C:/msys32/home/` directory.\n\nWe can verify the IDF_PATH by\
    \ closing msys32 and entering again, with the command:\n\n```\nprintenv IDF_PATH\n\
    ```\n\n# Part I. IoT Communications using classic HTML & JavaScript technologies\n\
    \n## An example project\n\nNow you can test the compilation and launch of a project.\
    \ You can copy (in the terminal) one of the examples from esp-idf with the commands:\n\
    \n```\ncd ~/esp\ncp -r $IDF_PATH/examples/get-started/hello_world .\n```\n\nAttention,\
    \ space and endpoint should not be omitted. For the object code generated by the\
    \ project to be loaded into the flash, the **serial port** to which the ESP32\
    \ module is connected must be specified. This can be done using the menuconfig\
    \ of mingw32, as shown below. From C:/msys start mingw32.exe. Enter the project\
    \ folder - in the example presented using the command:\n\n```\ncd ~/esp/hello_world\n\
    ```\n\nIn terminal, enter the command:\n\n```\nmake menuconfig\n```\n\n```\nsever@DESKTOP-QEFSQHP\
    \ MINGW32 ~\n$ cd ~/esp/hello_world\n\nsever@DESKTOP-QEFSQHP MINGW32 ~/esp/hello_world\n\
    $ ls\nbuild  main  Makefile  README.md  sdkconfig  sdkconfig.old\n\nsever@DESKTOP-QEFSQHP\
    \ MINGW32 ~/esp/hello_world\n$ make menuconfig\n```\n\nAfter displaying several\
    \ lines, the main menuconfig window appears:\n\n![menuconfig main window](img/bc50e9ed6994305c0caada2236432c8a_227_0.png)\n\
    \n**Serial flasher config** -> Enter. With the ESP32 module coupled and the driver\
    \ installed, check in the Device Manager which serial port it uses, for example,\
    \ COM4. Write the port number in the terminal window, for example, COM4 and then\
    \ OK. Save -> OK -> Exit, returning to the Serial flasher config setup screen.\n\
    \n![Serial flasher config](img/bc50e9ed6994305c0caada2236432c8a_228_0.png)\n\n\
    Exit returns to the main menuconfig window.\n\nOptionally, on a case-by-case basis,\
    \ you can configure other parameters required by the program:\n\n- Go to Component\
    \ config.\n- Go to Driver configurations\n- Enter into ADC configuration, or WiFi,\
    \ or ESP-specific, etc. as required\n\nEach change is followed by Save and Exit,\
    \ repeated until it exits in mingw32 (the prompt may take several tens of seconds).\n\
    \nCompilation and flash loading can be done with the command:\n\n```\nmake flash\n\
    ```\n\nThe process may take several minutes initially, and the next compilation\
    \ usually takes less than a minute.\n\nChanges can be made by editing the `.../main/main.c`\
    \ file of the project.\n\nObservation of the serial output can be done with a\
    \ monitor that is obtained in mingw32 with the command:\n\n```\nmake monitor\n\
    ```\n\nExiting it can be done with `Ctrl+]`.\n\nOf course, any other serial terminal\
    \ can be used. Attention, it must be disconnected when the `make flash` command\
    \ is given, otherwise, a serial bus error occurs.\n\n## And configuring Eclipse\n\
    \nAs has been shown, one of the main advantages of the ESP-IDF environment is\
    \ the ability to debug by step-by-step troubleshooting, the use of breaking points,\
    \ variable tracking, etc. For this, you need to use an integrated editor in the\
    \ development environment, for example.\n\nTo install Eclipse, download it from:\n\
    <https://www.eclipse.org/downloads/>\n\n![Eclipse download page](img/bc50e9ed6994305c0caada2236432c8a_230_0.png)\n\
    \nRun the installer (you may be required to install Java JRE), selecting \"Eclipse\
    \ for C / C++ Development\", then launch the Eclipse program.\n\nWe will consider\
    \ that all previous steps have been taken when we installed ESP-IDF and created\
    \ the `C:/msys32/home/USERNAME/esp/work` directory. Obviously, you can opt for\
    \ other work directories, in which case the paths will be modified accordingly.\
    \ In the following, an Eclipse project will be imported to the same directory\
    \ as esp-idf, previously copied with mingw32, or copied directly to Windows.\n\
    \n- File -> Import -> C/C++ / Existing Code as Makefile Project -> Project Name\
    \ (for ex. Test1) -> Existing Code Location -> Browse -> `C:/msys32/home/USERNAME/esp/hello_world`\n\
    \n- Click Test1 then Project -> Properties\n\n- Click C/C++ Build, deselect \"\
    Use default build command\" and **optionally** introduce make:\n  `python ${IDF_PATH}/tools/windows/eclipse_make.py`\n\
    \  then Apply\n\n- Click \"C/C++ Build\" \"Environment\" add Add variable `BATCH_BUILD`\
    \ with the value `1`, Add variable `IDF_PATH` with the value `C:/msys32/home/USERNAME/esp/esp-idf`\n\
    \nthen Apply and Add variable `PATH` with the value `C:\\msys32\\usr\\bin;C:\\\
    msys32\\mingw32\\bin;C:\\msys32\\opt\\xtensa-esp32-elf\\bin` followed by Apply.\n\
    \n![Eclipse C/C++ Build Environment settings](img/bc50e9ed6994305c0caada2236432c8a_232_0.png)\n\
    \n**Optional:** Click \"C / C++ General\" \"Preprocessor Includes Paths, Macros,\
    \ etc.\" go to the Providers tab, tick the CDT GCC Built-in Compiler Settings\
    \ Cygwin and enter the value:\n\n```\nxtensa-esp32-elf-gcc ${FLAGS} -E -P -v -dD\
    \ \"${INPUTS}\"\n```\n\nthen Apply and CDT GCC Build Output Parser with the value:\n\
    \n```\nxtensa-esp32-elf-((g?cc)|([gc]\\+\\+)|(clang))\n```\n\nfollowed by Apply\
    \ and Close.\n\n- Click Test1 -> main and double-click `hello_world_main.c` to\
    \ display the source file and edit it.\n- Project -> Build Targets -> Create ->\
    \ Flash\n\nIn order to be able to load the project generated object code into\
    \ the flash memory, for each new project, specify the serial port to which the\
    \ ESP32 module is coupled. This can not be done at this time in Eclipse, so use\
    \ the menuconfig from the mingw32 program, as shown earlier in paragraph 10.2.\n\
    \n![Eclipse project Test1 loaded](img/bc50e9ed6994305c0caada2236432c8a_233_0.png)\n\
    \nThe project loaded in Eclipse (Figure 10.2) can now be compiled and loaded into\
    \ flash. To do this, double click on Build Targets -> flash (in the upper left\
    \ column). A first compilation takes a few minutes, and the next ones less than\
    \ a minute.\n\nYou can watch the serial port with Window -> Show View -> Terminal.\
    \ Be careful, it must be closed before a new write in flash, otherwise, a busy\
    \ port message appears."
  mdcn: "\n# **图 9.3.** 用于命令、监控数字与模拟输入输出的程序\n\n## 使用 ESP-IDF 开发环境和 ECLIPSE 进行编程\n\n\
    虽然使用 Arduino IDE 软件开发环境对 ESP8266/ESP32 进行编程非常简单易用，但对于复杂应用存在一些缺点，首先是缺乏调试可能性。因此，推荐使用\
    \ Espressif 物联网开发框架（ESP-IDF）来开发此类 ESP32 应用程序。\n\n您可以在以下地址找到在此环境中编程 ESP32 模块的完整文档：\n\
    <https://esp-idf.readthedocs.io/en/latest/index.html>。\n\n![图 10.1 - 使用 ESP-IDF\
    \ 环境进行编程的示意图](img/bc50e9ed6994305c0caada2236432c8a_222_0.png)\n\n**图 10.1.** 使用\
    \ ESP-IDF 环境进行编程的示意图\n\n## ESP-IDF 开发环境与工具链设置\n\n我们于 2018 年 9 月在 Eclipse Oxygen\
    \ 中测试了下文介绍的内容。未来几年可能会发生一些实施变更，因此您可能需要对工具链设置进行一些调整，正如前几年所做的那样。与信息技术的其他领域一样，为了应对快速的技术发展，您应该努力理解其机制，而不仅仅是记忆。\n\
    \n首先，从以下地址下载并解压安装文件：\n<https://dl.espressif.com/dl/esp32_win32_msys2_environment_and_toolchain-20180110.zip>\n\
    \n将 msys32 目录移动到根目录 `C:\\`，然后进入该目录并运行。在新窗口（终端类型）中，使用以下命令设置工作区域：\n\n```\nmkdir\
    \ -p ~/esp\n```\n\n在 Windows 中可以看到已创建 `C:\\msys32\\home\\USERNAME\\esp\\` 子目录。我们使用以下命令从\
    \ mingw32 终端进入工作文件夹：\n\n```\ncd ~/esp\n```\n\n克隆 esp-idf 环境仓库：\n\n```\ngit clone\
    \ --recursive https://github.com/espressif/esp-idf.git\n```\n\n此时，将出现 `C:\\msys32\\\
    home\\USERNAME\\esp\\esp-idf\\` 子目录，必须设置其路径并添加到用户配置文件中，因此称为 `IDF_PATH`。为此，进入 `C:\\\
    msys32\\etc\\profile.d\\` 目录，我们需要在此处创建一个文本文件，文件名添加 IDF_PATH 并包含以下行：\n\n```\nexport\
    \ IDF_PATH=\"C:/msys32/home/USERNAME/esp/esp-idf\"\n```\n\n此处及下文中，`USERNAME` 将替换为\
    \ Windows 用户名，可在 `C:/msys32/home/` 目录中查看。\n\n我们可以通过关闭 msys32 并重新进入来验证 IDF_PATH，使用命令：\n\
    \n```\nprintenv IDF_PATH\n```\n\n# 第一部分. 使用经典 HTML & JavaScript 技术的物联网通信\n\n##\
    \ 示例项目\n\n现在您可以测试项目的编译和启动。您可以使用以下命令在终端中复制 esp-idf 的一个示例：\n\n```\ncd ~/esp\ncp\
    \ -r $IDF_PATH/examples/get-started/hello_world .\n```\n\n注意，不应省略空格和句点。为了将项目生成的目标代码加载到\
    \ flash 中，必须指定 ESP32 模块连接的**串口**。这可以使用 mingw32 的 menuconfig 完成，如下所示。从 C:/msys\
    \ 启动 mingw32.exe。进入项目文件夹 - 在示例中使用以下命令：\n\n```\ncd ~/esp/hello_world\n```\n\n在终端中，输入命令：\n\
    \n```\nmake menuconfig\n```\n\n```\nsever@DESKTOP-QEFSQHP MINGW32 ~\n$ cd ~/esp/hello_world\n\
    \nsever@DESKTOP-QEFSQHP MINGW32 ~/esp/hello_world\n$ ls\nbuild  main  Makefile\
    \  README.md  sdkconfig  sdkconfig.old\n\nsever@DESKTOP-QEFSQHP MINGW32 ~/esp/hello_world\n\
    $ make menuconfig\n```\n\n显示几行后，将出现主 menuconfig 窗口：\n\n![menuconfig 主窗口](img/bc50e9ed6994305c0caada2236432c8a_227_0.png)\n\
    \n**Serial flasher config** -> 回车。连接 ESP32 模块并安装驱动程序后，在设备管理器中检查其使用的串口，例如 COM4。在终端窗口中输入端口号，例如\
    \ COM4，然后点击 OK。Save -> OK -> Exit，返回到 Serial flasher config 设置屏幕。\n\n![Serial\
    \ flasher config](img/bc50e9ed6994305c0caada2236432c8a_228_0.png)\n\nExit 返回到主\
    \ menuconfig 窗口。\n\n可以根据具体情况选择配置程序所需的其他参数：\n\n- 进入 Component config。\n- 进入 Driver\
    \ configurations\n- 根据需要进入 ADC 配置、WiFi 配置或 ESP 特定配置等。\n\n每次更改后，依次进行 Save 和 Exit，重复直到在\
    \ mingw32 中退出（提示符可能需要几十秒）。\n\n编译和 flash 加载可以使用以下命令完成：\n\n```\nmake flash\n```\n\
    \n最初过程可能需要几分钟，后续编译通常不到一分钟。\n\n可以通过编辑项目的 `.../main/main.c` 文件进行更改。\n\n可以使用监视器观察串口输出，在\
    \ mingw32 中使用以下命令获取：\n\n```\nmake monitor\n```\n\n使用 `Ctrl+]` 退出。\n\n当然，可以使用任何其他串口终端。注意，当发出\
    \ `make flash` 命令时必须断开连接，否则会发生串行总线错误。\n\n## 以及配置 Eclipse\n\n如前所述，ESP-IDF 环境的主要优势之一是能够通过逐步故障排除、使用断点、变量跟踪等方式进行调试。为此，您需要使用开发环境中的集成编辑器，例如。\n\
    \n要安装 Eclipse，请从以下地址下载：\n<https://www.eclipse.org/downloads/>\n\n![Eclipse 下载页面](img/bc50e9ed6994305c0caada2236432c8a_230_0.png)\n\
    \n运行安装程序（可能需要安装 Java JRE），选择\"Eclipse for C / C++ Development\"，然后启动 Eclipse 程序。\n\
    \n我们假设在安装 ESP-IDF 并创建 `C:/msys32/home/USERNAME/esp/work` 目录时已完成所有先前步骤。显然，您可以选择其他工作目录，在这种情况下路径将相应修改。接下来，一个\
    \ Eclipse 项目将被导入到与 esp-idf 相同的目录中，该目录先前已通过 mingw32 复制，或直接复制到 Windows。\n\n- File\
    \ -> Import -> C/C++ / Existing Code as Makefile Project -> Project Name（例如 Test1）->\
    \ Existing Code Location -> Browse -> `C:/msys32/home/USERNAME/esp/hello_world`\n\
    \n- 点击 Test1，然后 Project -> Properties\n\n- 点击 C/C++ Build，取消选中\"Use default build\
    \ command\"，并**可选地**输入 make：\n  `python ${IDF_PATH}/tools/windows/eclipse_make.py`\n\
    \  然后 Apply\n\n- 点击\"C/C++ Build\" \"Environment\"，添加变量 `BATCH_BUILD`，值为 `1`，添加变量\
    \ `IDF_PATH`，值为 `C:/msys32/home/USERNAME/esp/esp-idf`\n\n  然后 Apply，并添加变量 `PATH`，值为\
    \ `C:\\msys32\\usr\\bin;C:\\msys32\\mingw32\\bin;C:\\msys32\\opt\\xtensa-esp32-elf\\\
    bin`，然后 Apply。\n\n![Eclipse C/C++ Build Environment 设置](img/bc50e9ed6994305c0caada2236432c8a_232_0.png)\n\
    \n**可选：** 点击\"C / C++ General\" \"Preprocessor Includes Paths, Macros, etc.\"\
    ，进入 Providers 选项卡，勾选 CDT GCC Built-in Compiler Settings Cygwin 并输入值：\n\n```\n\
    xtensa-esp32-elf-gcc ${FLAGS} -E -P -v -dD \"${INPUTS}\"\n```\n\n然后 Apply，再点击\
    \ CDT GCC Build Output Parser，输入值：\n\n```\nxtensa-esp32-elf-((g?cc)|([gc]\\+\\\
    +)|(clang))\n```\n\n然后 Apply 和 Close。\n\n- 点击 Test1 -> main，然后双击 `hello_world_main.c`\
    \ 以显示源文件并进行编辑。\n- Project -> Build Targets -> Create -> Flash\n\n为了能够将项目生成的目标代码加载到\
    \ flash 存储器中，对于每个新项目，必须指定 ESP32 模块连接的串口。目前无法在 Eclipse 中完成此操作，因此请使用 mingw32 程序中的\
    \ menuconfig，如前文 10.2 节所示。\n\n![已加载的 Eclipse 项目 Test1](img/bc50e9ed6994305c0caada2236432c8a_233_0.png)\n\
    \n在 Eclipse 中加载的项目（图 10.2）现在可以进行编译并加载到 flash 中。为此，双击 Build Targets -> flash（在左上方列中）。第一次编译需要几分钟，后续编译少于一分钟。\n\
    \n您可以使用 Window -> Show View -> Terminal 查看串口。请注意，在向 flash 写入新内容之前必须关闭它，否则会出现端口忙的消息。\n"
