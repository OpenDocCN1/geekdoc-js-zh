    \    }\n    else {\n        Serial.print(\"failed with state \");\n        Serial.print(client.state());\n\
    \        delay(1000);\n    }\n}\nvoid receivedCallback(char* topic, byte* payload,\
    \ unsigned int length){\n    if(!client.connected()){\n        client.connect(\"\
    ESP32Client1\" );//唯一ID\n    }\n    Serial.print(\"Message received: \");\n```\n"
