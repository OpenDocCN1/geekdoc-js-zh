    # mosquitto in Windows


    For using Node-Red in Windows, it is necessary to specify a broker. It can be
    a public one, installed on a cloud, such as or another one listed above.


    For the sake of security, you can use a local broker running under Windows, such
    as Mosquitto - which will be further used in examples. However, since it has to
    be running throughout the use of MQTT, it is recommended that Node-Red and the
    broker program be installed on a mini PC made with Raspberry Pi or equivalent,
    which, with low consumption and high safety, may remain in operation permanently.


    The installation is done by downloading the file corresponding to the Windows
    version, for example, from the internet page


    https://mosquitto.org/download/ . By running it, installation occurs, default
    to C:\Program Files\mosquitto.


