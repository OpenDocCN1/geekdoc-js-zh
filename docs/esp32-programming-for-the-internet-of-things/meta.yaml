    # in Node-Red


    Creating applications in Node-red is usually done on a PC or other device with
    a large enough screen to see all the elements of the graphical interface simultaneously.
    For this, the following conditions are required:


    +   1. The ESP program must specify a valid broker (the server and the port assigned),
    whether public or local, and it must be running, it does not matter on which computer,
    but with access to the WiFi network of the Node-Red and the Mosquitto broker.

    2. Node-Red must be running on the programming computer or another accessible
    IP device.

    3. If a local broker is used, this broker (for example, Mosquitto) must run on
    the server device.'
  - '[PAGE 298]


    The examples that will be presented below assume that the general program for
    three digital outputs, an analog output, four digital inputs, and one analog input
    with mqttServer is loaded on the ESP32 module and uses the address on which the
    broker is running. Several mqttServer variants were written in the listing: a
    broker on a public server, a broker on a local network (local IP) server, or a
    broker on an own server outside the local network (public IP):


    ```

    const char* mqttServer = "test.mosquitto.org";//Broker public in cloud

    //const char* mqttServer = "192.168.1.119";//IP local on own server

    //const char* mqttServer = "5.2.153.10";//IP public on own server

    ```


    **Note: saving and restoring the Node-Red programs**'
  - '[PAGE 299]


    Saving and loading the programs developed in Node-Red is quite different from
    other files. This is because Node-Red may be running on an external device, so
    the related file will form on that remote device.


    If Node-Red is used on a Windows computer, with a localhost broker, exporting
    (saving) a Node-Red program is done in JSON (JavaScript Object Notation) format.
    We may use Menu-> Export-> Library, and the file will appear in C:\Users\ [user]\node-red\lib\flows
    directory.


    Importing (loading) will be done from the directory with Menu-> Import-> Library.


    To use Node-Red on a separate broker the export can be done in the clipboard and
    from there you can copy and save it to a text file on your current computer. For
    import, the text file will be opened, the content copied then Import-> Clipboard,
    and paste the contents of the text file. Following these actions, a new tab containing
    that flow will appear. The old tab can be deleted by double-clicking on it and
    then Delete.


