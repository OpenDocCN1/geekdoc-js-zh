    \ IP，如以下章节所述。\n\n### LAN - DHCP 服务器\n\nDHCP（动态主机配置协议）是用于 IP 网络上自动配置的协议。DHCP 服务器可以为每个客户端分配一个\
    \ IP 地址，并告知客户端 DNS 服务器 IP 和默认网关 IP。RT-N12+ 支持本地网络最多 253 个 IP 地址。\n\n### 基本配置\n\
