  md: '# command of a GPIO port via WiFi


    Various commands can be sent, through the web page created by the ESP32 server,
    to the GPIO (General Port Input / Output) ports of that board. The computer or
    mobile device on which the web page is running is a server’s client that can be
    read with client.read instructions, periodically called in the main loop of the
    ESP32 board. Depending on the data sent by the client, the server program can
    execute various commands through standard C instructions.'
