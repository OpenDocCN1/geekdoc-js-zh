    在之前的程序中，网页向服务器发送命令，并根据接收到的信息显示服务器的状态。但是，在下一个命令到来之前，即使服务器的状态发生变化，网页仍然显示相同的旧状态。因此，如果有另一个客户端（浏览器）向服务器发送命令，第一个客户端不会自动显示服务器的真实状态。只有在发送新命令或刷新页面时，新状态才会显示。此外，当服务器输入状态发生变化时，新值在客户端发送命令或执行刷新之前不会显示在网页上。\n\
    \n如前所述，使用标准技术，有一些方法可以在特定时间间隔内自动刷新网页，但这会增加流量并可能产生不愉快的视觉效果。\n\n然而，AJAX 技术允许仅自动更新所需的元素，从而减少流量并改善视觉效果。\n\
    \n为此，可以使用 setInterval JavaScript 函数定期调用 AJAX 函数，该函数将数据从服务器传输到客户端：\n\n```\nsetInterval(function()\
    \ {\n    // Call the function every 2 seconds\n    ClientToServer();\n}, 2000);\
    \ //2000 mSeconds update rate\n```\n\n应将其插入 index.h 文件的脚本部分，如图 7.1 所示。\n\n## 关于通过\
    \ AJAX 自动刷新的程序\n\n使用 setInterval 函数可以调用更新网页所有所需元素的函数，而不会出现视觉伪影。但是，在此过程的 50-200\
    \ ms 间隔内，可能会发生按钮点击事件，这是第二个过程，使用标准 WebServer 库可能会丢失。\n\n## 关于 ESP32 WebServer 的说明\n\
    \n在之前的程序中，我们使用了作为 WebServer.h 包含的官方库。但是，目前（2020 年 7 月）该库对 ESP32 存在一些缺点。主要困难在于它不允许两个或更多客户端同时访问。如果一个客户端有请求，而服务器已经处于对另一个客户端的响应过程中，则第二个请求将被丢弃。\n\
    \n对于单命令客户端，这种现象非常罕见，仅在两个或更多客户端同时发出命令时才会发生。但是，如果我们希望定期刷新页面的某些元素，那么即使只涉及单个客户端，由于服务器处于刷新过程中，命令有时也会被忽略。因此，每\
    \ 10-20 次尝试中，客户端的命令就会被忽略一次。如果这对应用程序很重要，有两种解决方案。\n\n第一种方案是使用性能较弱的芯片 ESP8266。令人惊讶的是，它在这种情况下工作得非常好，这意味着相应的库\
    \ ESP8266WebServer 编写得非常好。这就是为什么在之前的程序中我们演示了使用 ESP8266 的替代语法。\n\n第二种方案是使用另一个库，该库编写得也很好，特别适合进程排队。例如，我们这里使用\
    \ Me-no-dev 开发的 ESPAsyncWebServer 库，可以在 GitHub 上找到。\n\n首先，访问 https://github.com/me-no-dev/ESPAsyncWebServer\
    \ 点击 Clone，然后下载 ZIP。接着访问 https://github.com/me-no-dev/AsyncTCP 点击 Clone 并下载 ZIP。\n\
    \n现在，在 Arduino IDE 中，打开 Sketch->Include Library->Add .ZIP Library，然后选择下载的压缩包。\n\
    \n为了实现第一种方案，我们将使用 ESP8266 NodeMCU 模块，并修改 C 文件，如图 6.9 中的注释所示。同时，使用 setInterval\
    \ 函数完成 \"index.h\" 文件（图 7.1）。\n\n```\nconst char MAIN_page [] PROGMEM = R\"====(\n\
    <html>\n```\n\n## AJAX ESP 服务器\n\n```\ntype=\"button\" onclick=\" ClientToServer(1)\"\
