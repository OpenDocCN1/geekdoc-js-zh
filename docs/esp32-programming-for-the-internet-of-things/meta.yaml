    \ 2, nonos-sdk 2.2.1+100 (190703), v2 Lower Memory, Disabled, None, Only Sketch,\
    \ 115200 on COM5\n\n**图 2.2.** 使用DHCP的最简网页ESP32程序\n\n## 用于外部访问的静态地址\n\n如果你想始终分配相同的IP，可以分配一个静态IP，或者进行DHCP保留。这样路由器就可以将来自网络外部的访问请求，通过服务器所在端口转发到其IP地址。要分配静态地址，程序的初始部分将如图2.3所示。\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_19_0.png)\n\n```\n#include <WiFi.h>\n\
    \nconst char* ssid=\"SSID\";\nconst char* pass=\"Pass1234\";\n\nWiFiServer server(80);\n\
    \nvoid setup() {\n  Serial.begin(115200);\n  pinMode(LED_BUILTIN, OUTPUT);\n \
    \ delay(10);\n  Serial.println(\"Connecting\");\n  IPAddress local_IP(192, 168,\
    \ 0, 180); // Static IP\n  IPAddress gateway(192, 168, 0, 1);    // network parameters\n\
    \  IPAddress subnet(255, 255, 255, 0);\n  WiFi.config(local_IP, gateway, subnet);\n\
    \  WiFi.begin(ssid, pass);\n\n  while (WiFi.status() != WL_CONNECTED) {\n    delay(500);\n\
    \    Serial.print(\".\");\n  }\n  Serial.println(WiFi.localIP());\n  server.begin();\n\
    }\n\nvoid loop() {\n```\n\n**图** 静态IP服务器连接\n\n如果你选择对特定地址进行DHCP保留，请按以下步骤操作：\n\n\
    打开ESP将要连接并进行DHCP保留的WiFi路由器配置页面。为此，首先找到ESP板顶部的MAC地址，如图2.4示例顶部所示，将该地址复制到中间字段，分配IP地址并添加到保留列表中。该示例针对LINKSYS路由器，其他路由器的设置界面可能不同。\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_20_0.png)\n\n**图 2.4.** DHCP路由器地址保留示例（针对给定MAC）\n\
    \n此时，ESP服务器在路由器上始终会被分配相同的地址，如果我们从连接到同一路由器的客户端使用该内部地址，它将是可见的（在示例中为192.168.1.245）。\n\
    \n无论是在DHCP上保留IP的情况下，还是使用静态IP时，要从外部网络访问页面，请按以下步骤操作：\n\n配置路由器转发80端口，如图2.5示例所示。这样，外部客户端也可以使用路由器的IP地址访问网页，可能后跟端口号（在示例中为5.2.123.10，它将自动连接到80端口，或5.2.123:80）。如果80端口被其他设备占用，可以使用另一个端口，如后面示例所示。\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_23_0.png)\n\n**图 2.5.** 端口转发到本地地址的示例\n\
    \n从工具->串口监视器开始；\n\n编译并将程序加载到ESP中；\n\n串口监视器显示服务器所连接路由器的内部IP地址。\n\n你可以从连接到同一路由器的客户端使用内部地址通过浏览器进入，或者从外部客户端使用路由器地址进入。\n\
    \n**注意：** 默认HTTP协议端口是80，因此该值会自动添加到客户端请求的网页地址中。例如，如果调用http://101.102.103.100，它会转到http://101.102.103.100:80。如果地址80已被路由器用于转发地址，可以在此处运行的服务器使用另一个端口，但在这种情况下，LAN和WAN地址都必须明确指定端口。例如，如果服务器在85端口上声明，IP为192.168.1.240，LAN地址可以写为http://192.168.1.240:85，如果路由器中85端口已转发到LAN地址192.168.1.240，则WAN地址可以写为http://101.102.103.100:85。\n\
    \n当然，程序第四行将修改为如图2.6所示以指定新端口。\n\n此外，在静态IP的情况下，如果它连接到另一个本地网络，该IP和网关都必须与路由器处于不同的IP类别。同时，要从外部可见，所涉及的端口必须转发到下级路由器的上级路由器IP地址。例如，如果主路由器（连接到公共IP）为次级路由器分配地址192.168.1.200和网关192.168.1.1，则该次级路由器可以为服务器分配IP地址192.168.0.180和网关192.168.0.1。如果使用的端口例如为80和81，两者都必须转发到第一个路由器上的192.168.1.200，第二个路由器转发到192.168.0.180。\n\
    \n在主循环中，HTML指令将使用client.println()命令传递，如图2.2示例所示。\n\n![](img/bc50e9ed6994305c0caada2236432c8a_25_0.png)\n\
    \n**图 2.6.** 指定另一个服务端口\n\n## 使用MIT App Inventor的应用\n\n在线MIT App Inventor环境允许使用面向对象的图形编程和事件快速开发移动设备的Android应用程序。\n\
    \n为此，打开http://ai2.appinventor.mit.edu页面并创建账户，下载并安装App Inventor Setup软件包。同时，必须安装所用Android手机的Windows驱动程序。\n\
    \n打开项目->启动新项目并输入项目名称（用下划线代替空格）。项目显示第一个屏幕和Designer窗口。\n\n在最右侧列中设置Screen1的参数（如对齐方式、背景图像、颜色等），如图2.7示例所示。\n\
    \n从左列的用户界面中拖动一个WebViewer对象到应用程序窗口。单击WebViewer1对象（在中右列），可以更改其参数。\n\n选择Blocks选项卡（右上角），按图2.8创建查看器。为此，单击左列，首先在Screen1对象上并拖动初始化语句，然后单击WebViewer1对象并写入服务器的URL。地址写为文本（如果单击左侧Built-in类别中的Text项，会出现第一个块）。\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_29_0.png)\n\n**图 2.7.** 在MIT App Inventor中开发的程序的图形界面\n\
    \n![](img/bc50e9ed6994305c0caada2236432c8a_30_0.png)\n\n**图 2.8.** MIT App Inventor中的程序代码块\n\
    \n从MIT App Inventor工具启动aiStarter程序（先前安装的），然后通过连接->模拟器连接到Android模拟器。它可能需要版本升级，完成后需要重置连接并再次启动模拟器。如果ESP32上的Arduino应用程序已打开，模拟器屏幕将如图2.9所示。\n\
    \n你可以用USB线配对Android手机，重置MIT连接后，可以控制USB连接。此图像会出现在你的Android手机上并运行，但也可以出现在任何其他浏览器中。\n\
    \n你可以从构建菜单编译应用程序。它将下载到计算机，或者你可以为其生成QR码。在这种情况下，必须在手机上安装MIT AI2 Companion（来自Play商店）以扫描生成的QR码，并将新应用程序直接安装到手机中。\n\
    \n此外，编译后的应用程序（带有.apk扩展名）可以发送到Google Play商店。\n\n该应用程序可以以可编辑形式下载到计算机中（仅通过MIT App\
    \ Inventor），使用项目->将所选项目（.aia）导出到我的计算机。\n"
