    ## communication between client and server using MIT App Inventor


    The general scheme of a bidirectional transmission system between a server and
    several clients is shown in 5.1.


    ![](img/bc50e9ed6994305c0caada2236432c8a_77_0.png)


    | Client 1 (web page) | | |

    |:---|:---|:---|

    | Digital commands (buttons etc.) | | |

    | Analogical commands (sliders) | | |

    | Ethernet | | |

    | Client 2 (web page) | Analog Inputs (conditioning amplifiers, transducers, analogical
    sources etc.) | |

    | Digital commands (buttons etc.) | Analog Inputs (ADC) | |

    | Analogical commands (sliders) | GPIOs | |

    | Ethernet | Digital inputs (sensors) | WiFi |

    | | SERVER | |

    | | GPIOs | |

