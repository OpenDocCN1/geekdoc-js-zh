    # Figure 3.1. Program for controlling a digital output via HTML


    After compiling and loading the program in ESP32, it will connect to the router
    with the specified SSID and Password and receive an IP displayed on the Serial
    monitor. If this IP is reserved in DHCP, and port 80 is forwarded on the router
    to that IP, a browser may access directly to the router''s WAN address. The web
    page displayed by the browser will be as in the example in Figure 3.2.

    By clicking on the first link, the LED on the ESP32 board will be ON, and with
    a click on the second link, it will turn OFF. Of course, you can change the output
    pin (in this case defined by the LED_BUILTIN constant in the included header "WiFi.h"),
    and you can enter other pins in the ESP32 program using C instructions. Other
    commands in the browser may also be included using instructions HTML, and other
    webpage structures may be sent with client.print() commands.'
