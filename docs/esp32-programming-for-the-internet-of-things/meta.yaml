    \  client.loop();\n}\n```\n\n**Figure 12.6.** The program for three digital controls\
    \ and an analog command\n\nWe remind that analog widgets can generate huge data\
    \ streams if the mouse continuously drives them, which could block the link. Therefore,\
    \ the new Connect() function has been defined, which will try to restore the link\
    \ and resubscribe to the topics used. It is called in the setup sequence, in the\
    \ receivedCallback() function - if the message is not a normal one, and in the\
    \ infinite loop after the client.state() statement - which normally has to return\
    \ the 0 code.\n\nThe standard codes returned by the client.state() statement in\
    \ MQTT are as follows:\n\n| Code | Meaning |\n|------|---------|\n| -4 | the server\
    \ didn't respond within the keepalive time |\n| -3 | the network connection was\
    \ broken |\n| -2 | the network connection failed |\n| -1 | the client is disconnected\
    \ cleanly |\n| 0 | the client is connected |\n| 1 | the server doesn't support\
    \ the requested version of MQTT |\n| 2 | the server rejected the client identifier\
    \ |\n| 3 | the server was unable to accept the connection |\n| 4 | the username/password\
    \ were rejected |\n| 5 | the client was not authorized to connect |\n\nThere are\
