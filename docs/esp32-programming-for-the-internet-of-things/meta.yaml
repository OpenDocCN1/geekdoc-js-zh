    # command in MIT App Inventor


    Transmitting an analogical value from the client can be done with a virtual slider
    that can take integer values within a specific range. The current value can be
    converted into a string, transmitted and then converted by the server again in
    a number.


    The main problem is that acting the slider can result in a very rapid succession
    of data that overloads or even blocks the communication. A solution to avoid this
    phenomenon is to transmit the slider values only at certain time intervals (preferably
    between 0.5 and 2 seconds).'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'An example of implementing this technique in MIT App Inventor is described
    below (Figure 4.2).


    There will be three global variables corresponding to the three possible events
    in the application: the pressing of the ON button - "global on", the pressing
    of the OFF button - "global off" and acting of the slider - "global slide", all
    of them initially declared with the logical value "false".


    When one of these events occurs, the variable is positioned as "true" value, and
    it remains as such until the timer has expired. After this interval, they will
    be turned to "false" automatically.


    As you may see in figure 4.3, from the palette "Sensor" a Clock component was
    added, and in its Properties, a TimerInterval may be specified (in milliseconds)
    with the box TimerEnabled checked.


    When a timer event occurs (every 1000 milliseconds for example), these global
    variables are tested. If one of them is "true", it is turned to "false", after
    which specific actions are as in the program in Figure 4.2.'
