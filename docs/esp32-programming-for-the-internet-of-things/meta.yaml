    \n**图4.1.** 用于输出数字控制和模拟控制的程序\n\n## MIT App Inventor中的命令\n\n从客户端传输模拟值可以通过虚拟滑块完成，该滑块可以在特定范围内取整数值。当前值可以转换为字符串，传输，然后由服务器再次转换为数字。\n\
