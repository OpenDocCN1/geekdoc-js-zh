    already been verified by third parties, in this case, students from Hyperion University,
    who have provided very valuable feedback.


    # and Objects of the AJAX Technology


    As shown before, the transmission of client-to-server commands can be done through
    a GET request. The server reads a string of characters terminated with "/r" and
    extracts'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'the command information, executing the appropriate routines. In principle,
    the server can also transmit state information (the current digital and analog
    values), but the changes will become visible on one or more web clients only after
    a page refresh.


    All programs presented so far require refreshing the whole page to show the current
    status of the server. The state shown may differ from the real one because the
    server program or another client might modify it.


    Of course, this refresh can be ordered periodically by the server, with setInterval
    or similar functions, but reloading the entire page may require a large data transfer
    flux, and the general appearance with periodic "blinking" is unpleasant in a classic
    browser.


    That is why a newer technology has been developed to automatically update some
    page elements without reloading the whole page - AJAX (Asynchronous JavaScript
    And XML). It allows data to be sent and read from the client to the server by
    combining the JavaScript instructions with the possibilities of data transfer
    between applications over the Internet through XML.


    The main object of the AJAX technology is XMLHttpRequest, which replaces ActiveXObject
    used in older browsers. It allows to exchange data with the server, using the
    syntax::


    ```

    var object_name = new HMLHttpRequest();

    ```


    When an event occurs, the client creates such an object and sends a request to
    the server using a "GET" method. The server processes this request and creates
    a response to send data back to the client.


    Now the client processes the response and updates the specified elements of the
    web page.'
