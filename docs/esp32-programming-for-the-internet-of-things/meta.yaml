    # LAN - DHCP Server


    DHCP (Dynamic Host Configuration Protocol) is a protocol for the automatic configuration
    used on IP networks. The DHCP server can assign each client an IP address and
    informs the client of the of DNS server IP and default gateway IP. RT-N12+ supports
    up to 253 IP addresses for your local network.


