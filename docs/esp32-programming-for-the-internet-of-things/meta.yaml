    # an analog output using Node-Red


    As it was shown, the transmission of an analog command can be done using the PWM
    technique, which simulates a numerical-analog conversion by integrating rectangular
    impulses with variable fill factor. This technique is especially advantageous
    for handling high inertia loads that make intrinsic integration, such as heating
    elements, LEDs, electromagnets, etc., because the driving transistor works in
    switching mode, so with very high efficiency. However, this technique cannot be
    used to control elements that thermally dissipate the signal''s harmonics, such
    as AC motors and others, which require the design of'
  merge: -1
  pgno: 317
