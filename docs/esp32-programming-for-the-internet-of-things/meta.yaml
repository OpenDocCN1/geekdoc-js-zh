    # of a program that toggles two digital outputs with AJAX transmission


    To simplify the graphical appearance of the web page one may use a single button
    for each digital output and toggle it like in figure 6.8.


    When one of the buttons is clicked, it calls the JS function ClientToServer(out)
    with out=1 or out=2 respectively. This function transmits with AJAX the string
    "ClToSe?Transm="+out to the server, as may be seen in the Inspect->Network window
    in figure 6.8.


    The server calls the function handleServRecept() which reads this string using
    the instruction This instruction reads in a temporary variable, the string that
    follows the argument Then a substring containing only one character (''1'' or
    ''2'') is selected and transformed to the integer dign. If this is 1, then LED1
    is toggled and this is 2, LED2 is toggled.


    Next, the new states of the digital outputs are read and sent as a comma-separated
    array of strings to the client.


    At the client, it is received as a response to the request and split into two
    substrings, str[0] and If str[0] is ''1'' the background color of the first button
    will become Yellow, else it remains White. The same happens with str[1] and the
    second button. In this way, a button''s color reflects exactly the state of the
    corresponding output after a command is transmitted.'
