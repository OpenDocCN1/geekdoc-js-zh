    dout1\">DigOut_1\n```\n\n```\ntype=\"button\" onclick=\" ClientToServer(2)\"\n\
    id=\"dout2\">DigOut_2\n```\n\n```\n)====\";\n```\n\n**Figure 6.10.** The web page\
    \ creation file for toggling two logical states through AJAX\n\n## Refresh of\
    \ the web page via AJAX\n\n## Of the automatic refresh\n\nIn the previous programs,\
    \ a web page sends commands to the server and, based on the received information,\
    \ displays the state of the server. But, until the next command, even if the state\
    \ of the server changes, the web page continues to display the same old state.\
    \ Hence, if another client (browser) sends a command to the server, the first\
    \ client does not automatically display the real state of the server. The new\
    \ state is displayed only when a new command is sent, or when the page is refreshed.\
    \ Also, when the state of the server's inputs changes, the new values will not\
    \ be visible on the client web-page until it sends a command or executes a refresh.\n\
    \nAs mentioned, using standard technologies, there are some methods for automatically\
    \ refreshing the web-page, at certain time intervals, but this increases the traffic\
    \ and may produce unpleasant visual effects.\n\nAJAX technology, however, allows\
    \ automatic updating of the required elements only, reducing traffic and improving\
    \ the visual appearance.\n\nTo do this, you can use a setInterval JavaScript function\
    \ to periodically call an AJAX function, which transmits data from the server\
    \ to clients:\n\n```\nsetInterval(function() {\n    // Call the function every\
    \ 2 seconds\n    ClientToServer();\n}, 2000); //2000 mSeconds update rate\n```\n\
    \nThis should be inserted in the script part of the index.h file as in figure\
    \ 7.1.\n\n## Of a program with automatic refresh via AJAX\n\nUsing the setInterval\
    \ function may be used to call the function which updates all the desired elements\
    \ of the web-page, with no visual artifacts. However, in the 50-200 ms interval\
    \ of this process, a click from a button may occur, and this is a second process\
    \ that may be lost using the standard WebServer library.\n\n## Note on ESP32 WebServer\n\
    \nIn the previous programs, we used the official library included as WebServer.h.\
    \ However, at present (July 2020) there are some drawbacks to this library for\
    \ ESP32. The main difficulty is that it doesn't allow two or more clients simultaneously.\
    \ If a client has a request and the server is already in the response process\
    \ for another client, the second request is dropped out.\n\nFor single command\
    \ clients, this phenomenon is very rare and happens only if two or more clients\
    \ emit their command simultaneously. But if we want to periodically refresh some\
    \ elements of the page, then even if a single client is involved, the command\
    \ will sometimes be ignored because the server is in the refresh process. So,\
    \ every 10-20 trials, the client's command is ignored. If it matters for the application,\
    \ there are two solutions.\n\nThe first one is to use the less powerful chip,\
    \ ESP8266. Surprisingly, it works perfectly in such cases, which means that the\
    \ corresponding library, ESP8266WebServer is very well written. That is why in\
    \ the previous programs we illustrated the alternative syntax for using ESP8266.\n\
    \nA second solution is to use another library, that is as well written, especially\
    \ for queuing the processes. For example, we use here the ESPAsyncWebServer library,\
