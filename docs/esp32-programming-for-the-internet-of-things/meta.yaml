    # ## programming using the ESP-IDF development environment and ECLIPSE


    Programming the ESP8266/ESP32 using the Arduino IDE software development environment,
    although very simple to use, has some drawbacks for complex applications, and
    first of all the lack of debugging possibilities. That is why, for developing
    such applications on ESP32, it is recommended to use the Espressif IoT Development
    Framework (ESP-IDF).


    You may find the full documentation for programming the ESP32 module in this environment
    at:

    <https://esp-idf.readthedocs.io/en/latest/index.html>.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '![](img/bc50e9ed6994305c0caada2236432c8a_222_0.png)


    **Figure 10.1.** schema of programming using the ESP-IDF environment


    # **the ESP-IDF development environment and setting the toolchain**


    We tested the text presented below in September 2018, in Eclipse Oxygen. Some
    Implementation changes may occur in the coming years, so that you may have to
    make some changes in setting up the toolchain, as it also did in previous years.
    As in other areas of IT, to cope with rapid technological advances, you should
    try to understand the mechanisms and not just memorize them.


