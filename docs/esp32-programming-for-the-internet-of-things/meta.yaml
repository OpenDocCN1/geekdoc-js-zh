    of a program with automatic refresh via AJAX


    Using the setInteval function may be used to call the function which updates all
    the desired elements of the web-page, with no visual artifacts. However, in the
    50-200 ms interval of this process, a click from a button may occur, and this
    is a second process that may be lost using the standard WebServer library.


    # **Note on ESP32 WebServer**


    In the previous programs, we used the official library included as WebServer.h.
    However, at present (July 2020) there are some drawbacks to this library for ESP32.
    The main difficulty is that it doesn''t allow two or more clients simultaneously.
    If a client has a request and the server is already in the response process for
    another client, the second request is dropped out.


    For single command clients, this phenomenon is very rare and happens only if two
    or more clients emit their command simultaneously. But if we want to periodically
    refresh some elements of the page, then even if a single client is involved, the
    command will sometimes be ignored because the server is in the refresh process.
    So, every 10-20 trials, the client''s command is ignored. If it matters for the
    application, there are two solutions.


    The first one is to use the less powerful chip, ESP8266. Surprisingly, it works
    perfectly in such cases, which means that the corresponding library, ESP8266WebServer
    is very well written. That is why in the previous programs we illustrated the
    alternative syntax for using ESP8266.


    A second solution is to use another library, that is as well written, especially
    for queuing the processes. For example, we use here theESPAsyncWebServer library,
    by Me-no-dev, which may be found on GitHub.'
