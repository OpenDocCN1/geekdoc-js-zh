    # of a program for controlling a digital output with AJAX transmission


    Ajax technology, although leading to a more complex code than HTML, allows bidirectional
    communication between the client and the server and more efficient control over
    IoT.

    The next program performs a two-way transmission of a digital state that will
    command a LED and will display the server''s response to its status.

    However, one should note that this program does not display the real status at
    a given time of the server, but only the immediate response to the transmitted
    command. This status may change later, either due to a command received from another
    client or due to the change of state of some server inputs. The client will display
    status changes after a new conversation with the server, or automatically at fixed
    intervals, as will be shown in a later program.

    The webpage displayed on a client through this simple program will be as in Figure
    6.2.'
