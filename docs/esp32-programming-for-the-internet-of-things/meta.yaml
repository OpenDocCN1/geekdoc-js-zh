    \n```\nslid1.oninput = function () {\n    document.getElementById(\"AnaTr\").innerHTML\
    \ =\n        slid1.value;\n    // 此处可以调用其他函数\n}\n```\n\n该函数也可以根据应用需求调用其他JavaScript函数。\n\
    \n## 模拟与数字命令到服务器\n\n根据客户端-服务器通信的通用图表，任何网页客户端都可以向服务器传输数字和模拟命令。由于这些命令是通过open方法中的“url”（字符串）参数传输的（参见段落），因此必须对它们进行明确区分。\n\
    \n因此，我们必须定义某种协议，以允许服务器以某种方式处理接收到的字符串。\n\n在后续内容中，我们将采用以下约定：\n\nClToSe?Transm\n\n\
    | 字符 | 含义 |\n|-----------|---------|\n| 0 | 刷新 |\n| 1 | 无变化 |\n\n| 第一位数字 | 类型\
    \ | 第二位数字 | 动作 |\n|-------------|------|--------------|--------|\n| 1 | 数字 | 1\
    \ | 切换1 |\n| 2 | 模拟 | 2 | 切换2 |\n\n在以下示例中，将使用一个滑块来通过浏览器控制服务器上的PWM模拟输出。应用的网页如图9.1所示。我们可以看到在命令部分插入了一个输入滑块和两个段落。第一个段落显示传输的模拟值，第二个段落显示接收的模拟值。当两个或多个客户端连接到服务器时，这很有用，这样每个客户端都可以显示模拟输出的实时值，该值可能被其他客户端修改。\n\
    \n## AJAX ESP服务器\n\n- 数字输出1、数字输出2\n\n输入滑块1：\n\n模拟传输值（%）：51\n\n模拟接收值（%）：51\n\n\
    数字输入：DIn1\n\nADC值：2864\n\n触摸状态：\n\n**图9.1。** 带有模拟命令的网页\n\n图9.2所示的网页文件具有以下功能：\n\
    \n- 控制两个数字输出；\n- 控制一个模拟输出；\n- 监控一个数字输入；\n- 监控一个模拟输入。\n\n```\nconst char MAIN_page[]\
    \ PROGMEM  = R\"=====(\n<html>\n```\n\n### AJAX ESP服务器\n\n```\ntype=\"button\"\
    \ onclick=\"\" id=\"dout1\">DigOut_1\n```\n\n```\ntype=\"button\" onclick=\"\"\
    \ id=\"dout2\">DigOut_2\n```\n\nclass=\"slidecontainer\">\n\n输入滑块1：\n\n```\ntype=\"\
    range\" min=\"0\" max=\"100\" value=\"1\" id=\"slid1\">\n```\n\n模拟传输值（%）：id=\"\
    AnaTr\">0\n\n模拟接收值（%）：id=\"AnaRec\">0\n\n## 数字输入：\n\n```\ntype=\"button\" id=\"\
    dout3\">DIn1\n```\n\nADC值：id=\"ADCValue\">0\n\n```\nid=\"chart_div\" style=\"\
    width: 150px; height: 150px;\"\n```\n\n触摸状态：\n\n```\nid=\"Disk1\" cx=\"250\" cy=\"\
    40\" r=\"30\" fill=\"Red\" />\nid=\"Disk2\" cx=\"50\" cy=\"40\" r=\"30\" fill=\"\
    Red\" />\n)======\";\n```\n\n**图9.2。** 用于双向数字和模拟通信的网页文件\n\n我们在此突出了对先前文件所做的修改。\n\
    \n首先，根据提出的约定，我们修改了两个按钮的参数，以便它们将传输字符串。\n\n然后定义了滑块，作为一个元素，具有标识符以及显示传输和接收模拟值的两个段落。\n\
    \n在JavaScript部分，我们定义了slid1.oninput函数，该函数显示传输的值，并使用参数调用ClientToServer函数。\n\n此外，ClientToServer函数将接收一个额外的子字符串，将其显示为“AnaRec”元素，并可选择显示为滑块位置。此选项对于在多个网页之间传输滑块位置很有用，但可能会引入一些抖动效应，因为传输值和接收值之间始终会存在延迟。\n\
    \n在服务器运行的程序中（图9.3），我们将LED3定义在输出GPIO5上，如图所示。我们还声明了PWM通道和变量AnOut，该变量将包含接收到的最后一个模拟值。\n\
    \n在Setup部分，我们声明了LED3引脚的输出模式和PWM参数：2000 Hz和8位分辨率。\n\n主要更改可以在函数server.on(\"/ClToSe\"\
    ,HTTP_GET,...)中注意到。\n\n首先，通过request->getParam获得的t_state字符串被分离为3部分：\n\n- int tn是第一个字符的数值。根据我们的约定，如果为0，则是简单的刷新；如果为1，则表示接收到数字命令；如果为2，则表示接收到模拟命令。\n\
    \n- int dign是第二个字符的数值。根据我们的约定，如果tn为1且dign为1，则第一个数字输出被切换；如果dign为2，则第二个数字输出被切换。\n\
    \n- int anan是第2-4个字符的数值。根据我们的约定，如果tn为2，则使用ledcWrite()指令将其作为PWM值写入LED3。由于AnOut的值为0...100，我们将其乘以2.55以缩放到0...255。\n\
    \n接收到的模拟值存储在AnOut变量中，然后转换为字符串State7，该字符串将被插入到服务器发送给客户端的整个State变量中。\n\n```\n#include\
    \ <WiFi.h>\n#include <AsyncTCP.h>\n#include <ESPAsyncWebServer.h>\n#include \"\
    index.h\" //网页（HTML+javascript）\n#define LED1 2 //D4 NodeMCU Devkit内置 //D9 WeMos内置\n\
    #define LED2 4 //D0 用户NodeMCU Devkit //D2 用户WeMos\n#define Din1 13\n#define LED3\
    \ 5 //模拟输出\nint ledChannel=0;\nint AnOut;//接收到的最后一个模拟值\n//你的WiFi路由器的SSID和密码\n\
    const char* ssid = \"MySSID\";\nconst char* password = \"MyPass\";\nAsyncWebServer\
    \ server(85);//需要ESPAsyncWebServer.h和\nAsyncTCP.h\n//======= 设置和WiFi连接 ==============\n\
    ```\n\n```\nvoid setup(void){\n    Serial.begin(115200);\n    IPAddress local_IP(192,\
    \ 168, 1, 246); //静态IP\n    IPAddress gateway(192, 168, 1, 1); // 网络参数\n    IPAddress\
    \ subnet(255, 255, 255, 0);\n    WiFi.config(local_IP, gateway, subnet);\n   \
    \ WiFi.begin(ssid, password);\n    //等待连接\n    while (WiFi.status() != WL_CONNECTED)\
    \ {\n      delay(500);\n      Serial.print(\".\");\n    }\n    Serial.println(WiFi.localIP());\n\
    \    pinMode(LED1,OUTPUT);\n    pinMode(LED2,OUTPUT);\n    pinMode(Din1,INPUT_PULLUP);\n\
    \    pinMode(LED3,OUTPUT);//模拟输出LED\n    ledcSetup(ledChannel,2000,8);//启动PWM，2000Hz，8位\n\
    \      server.on(\"/\", HTTP_GET, [](AsyncWebServerRequest *request){\n      \
    \      request->send(200, \"text/html\", MAIN_page);\n        });\n      server.on(\"\
    /ClToSe\",HTTP_GET, [] (AsyncWebServerRequest\n*request) {\n          String t_state=\
    \ request->getParam(\"Transm\")->value();//如\nxhttp.open(\"GET\",...\n      int\
    \ tn = t_state.substring(0,1).toInt();//命令类型\n(0,1或2)，作为整数\n```\n\n```\n    int\
    \ dign = t_state.substring(1,2).toInt();//响应的数字部分作为整数\n    int anan = t_state.substring(1,4).toInt();//响应的模拟部分作为整数\n\
    \    if (tn==1)\n    {\n      switch (dign)\n      {\n        case 1:\n      \
    \  digitalWrite(LED1,!digitalRead(LED1));break; //切换1\n        case 2:\n     \
    \   digitalWrite(LED2,!digitalRead(LED2));break;//切换2\n      }\n    }\n    if\
    \ (tn==2)\n    {\n      AnOut=anan;\n      Serial.println(anan);\n      ledcAttachPin(LED3,ledChannel);\n\
    \      ledcWrite(ledChannel,2.56*AnOut);\n    }\n    String State1=String(digitalRead(LED1));//输出的实际状态\n\
    \    String State2=String(digitalRead(LED2));//输出的实际状态\n    String State3=String(digitalRead(Din1));\n\
    \    String State4 =String(analogRead(A0));\n    String State5 = String(50 - touchRead(14));\n\
    \    String State6 = String(50 - touchRead(27));\n    String State7=String(AnOut);\n\
    \    String State=\n    Serial.println(State);\n    request->send(200, \"text/plain\"\
    ,State);\n```\n\n```\n});\nserver.begin();  //启动服务器\nSerial.println(\"HTTP server\
    \ started\");\n}\n//=========    循环 ============\nvoid loop(void){\n}\n```\n"
