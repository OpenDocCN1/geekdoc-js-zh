  md: '# digital-analog conversion via PWM in Arduino IDE


    In the Arduino IDE programming environment, the ledcAttachPin() and ledcDetachPin()
    instructions attach and detach a PWM channel to a pin. The ledcWrite() instruction
    writes the number of pulses to count, which, divided to the maximum number of
    pulses, establish the fill factor. For example, for a 10-bit resolution, the total
    number of steps is 1024 so that a ledcWrite(300) instruction will give a fill
    factor of about 30%, so an analog voltage of about 1 V.


    In the next program, we first declare the constants and variables, some of which
    are necessary for PWM output. Then the server is connected to a router with known
    SSID and password, using a static IP address. In the example, the address 192.168.1.246
    was used, with port 85 (forwarded from WAN to this LAN address).'
