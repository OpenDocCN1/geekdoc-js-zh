  md: '**Figure 11.3.** Serial Monitor window with MQTT messages sent by ESP32


    As you can see, a public broker can be used, for example or others from the list
    above. This broker uses the default port 1883 (unencrypted) or 8883 (if encryption
    is desired).


    It may happen that a public broker to be temporarily down, and you must specify
    another one in the .ino file and the same in HelloIoT.


    Every client must have a *unique* otherwise the clients will block one another.
    This way, even if there are several clients in the same LAN, there is no need
    to reserve static IP addresses, nor port forwarding for them.


    There is also a more secure variant: running the broker on an own server, with
    local or public IP, under Windows or Linux. Such solutions will be presented later,
