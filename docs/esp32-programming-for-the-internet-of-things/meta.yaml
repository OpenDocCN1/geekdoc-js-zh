    # type elements designed through CSS


    A widespread element for graphical monitoring of an analog value is the Progressbar
    object. It can be created through HTML/CSS and manipulated by JavaScript, as will
    be exemplified below.


    Although it is possible to use the HTML object "meter" for analog values monitoring
    (as will be exemplified in a later chapter), we will present it here an implementation
    using CSS (Cascading Style Sheets), to familiarize the reader with the style techniques.


    According to common practice, the graphical definition of the elements of this
    object can be done in a separate CSS file or a header portion of the index.h file.
    A CSS object has various graphical parameter values: position, size, border, characters,
    color, etc. There is a wide variety of CSS objects, properties, and methods, of
    which some very simple will be presented here.


    A cassette with the name of the represented value (Analog 1) will be defined,
    followed by a horizontal line, then a progress cassette that will contain a controllable
    length bar (using JavaScript) as in the center of Figure 8.1.'
