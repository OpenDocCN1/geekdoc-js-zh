    In many applications, as may be seen in the general diagram of an IoT structure
    the server has to transmit the state of some of its inputs to be monitored on
    the web-page of the clients. It happens when a client sends a command to the server,
    or an automatic page refresh is requested.


    In the previous programs, the server reads the state of its outputs and responds
    to the client as a feed-back. We may also read the digital or analogic inputs
    and concatenate their states to the response string:


