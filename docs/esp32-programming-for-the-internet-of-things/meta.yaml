    **图 5.1.** 服务器与多个客户端之间通信的总体方案


    ## 双向客户端–服务器通信


    为了将服务器上的各种状态传输给客户端，例如某些输入（传感器或其他信号源连接到这些输入）的逻辑或模拟状态，客户端可以使用 GET 指令周期性地请求服务器重新发送网页，并附带服务器的
    URL（例如 192.168.1.246:85）。如前所示，该请求也可用于通过在根地址后附加额外的字符串（例如 192.168.1.246:85/ON）来向服务器发送指令。


    然而，在普通浏览器中周期性地刷新整个网页会由于闪烁而影响页面的外观，这可以通过 AJAX 技术来避免，相关内容将在后续章节中介绍。如果与 Android 应用程序的双向通信已经足够，则可以通过
    MIT App Inventor 非常轻松地使用此方法。


    ## 通过 MIT App Inventor 刷新网页


    为此，在 Timer 生成的块中输入一个 GET 请求，其中根 URL（可能已被前述三条指令之一修改过）已预先设置，如图 5.2 所示。其效果将是服务器在定时器给定的一段时间后重新发送网页，该网页必须包含其状态的更新信息。


    ![](img/bc50e9ed6994305c0caada2236432c8a_80_0.png)


    **图 5.2.** 修改 MIT App Inventor 应用程序，以实现周期性的服务器读取


    为了传输状态信息，服务器将在主循环中包含它们的值，并在其后附带将其显示在网页上的指令。在下面的示例中，假设 A0 输入端（对于具有 36 个引脚的 DOIT
    ESP32，第二个左上角的输入）连接了一个电位器，它将模拟类似于传感器所传输的模拟信号输入。此外，GPIO13 输入端连接了一个按钮，它将模拟来自传感器的逻辑信号（ON
    / OFF）。


    ```

    String button=String(digitalRead(13));

    ```


    ```

    String a = String(analogRead(A0)/41);

    ```


    由于 ESP32 的模数转换器为 12 位，因此转换的最大结果为 4095。为了将数值缩放到 0–100 的范围内，结果被除以 41。这在某种程度上会增加
    ESP32 微控制器的负载，另一种做法是在移动设备上的应用程序中进行缩放，但这将使服务器发送的块中的字符数量增加 2。


    为了在页面上显示相应的值，在传输的序列中，我们将为每条状态信息插入一个头部，其后跟随包含该信息的字符串。在下面的示例中，头部分别为 "But" 和 "Pot"，前者后跟一个字符（0
    或 1），后者后跟三个字符（0–100）。此类指令可以在 HTML 部分中输入：


    ```

    client.println("But");

    client.println(button);

    client.println("Pot");

    client.println(a);

    ```


    显然，根据应用程序的需求，也可以使用相同的方法插入其他模拟或数字输入的状态。


    在 MIT 应用程序的图形界面中，应添加服务器状态显示的元素。在下面的示例中，为 GPIO13 的逻辑值添加了一个 Label（标签）元素、一个会改变颜色的按钮（根据该状态显示黄色/蓝色）以及一个用于显示
    A0 上模拟值的 Thumbnail 滑块。这些元素将根据您的偏好在 MIT 应用程序的图形界面中进行设置。


    在 MIT 应用程序中，还必须添加一个块，用于识别服务器的入口状态信息，并执行在客户端进行显示的指令。


    首先，将初始化两个全局变量：“global raspuns”用于显示数字输入的状态，“global raspunsAna”用于显示模拟信息。


    如图 5.3 所示，在从服务器发送的完整 "responseContent" 文本中，搜索 "But" 字符串的索引，并从该索引的起始位置 5 处开始分离出一个
    "global raspuns" 字符（完整字符串中有两个被解释为空格的字符）——红色椭圆所示。


    然后使用此子字符串的内容修改 Label1 的文本，最后，通过将其与 "1" 进行比较，设置 Button1 的颜色——黄色椭圆所示。类似地，分离并随后在
    Slider2 上显示指示模拟值的子字符串——蓝色椭圆所示。


    ![](img/bc50e9ed6994305c0caada2236432c8a_84_0.png)


    **图 5.3.** 修改 MIT App Inventor 应用程序以选择并显示从服务器接收到的状态信息


