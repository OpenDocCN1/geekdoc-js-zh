    ## an analog output using Node-Red


    As it was shown, the transmission of an analog command can be done using the PWM
    technique, which simulates a numerical-analog conversion by integrating rectangular
    impulses with variable fill factor. This technique is especially advantageous
    for handling high inertia loads that make intrinsic integration, such as heating
    elements, LEDs, electromagnets, etc., because the driving transistor works in
    switching mode, so with very high efficiency. However, this technique cannot be
    used to control elements that thermally dissipate the signal''s harmonics, such
    as AC motors and others, which require the design of interfaces through industrial
    electronics.


    To make such a command, two new nodes will be inserted in the previous diagram,
    as in figure 14.13.


    ![](img/bc50e9ed6994305c0caada2236432c8a_319_0.png)


    **Figure 14.13.** The node-red screen with the three digital command and an analog
    one.


    It is noticeable that in Layout (tab right) in Tab 1 a new group was added, Analog
    Out.


    From the Dashboard area, a Slider node will be inserted, and by double-clicking
    it will be edited as in figure 14.14, by choosing Group, Label, Range, Topic,
    and Name.


    ![](img/bc50e9ed6994305c0caada2236432c8a_320_0.png)


    ## **Figure 14.14.** Editing the slider node for the analog control


    From the Network area, an Mqtt Out node will be inserted, and by double-clicking,
    it will be edited as in figure 14.15 by choosing Server (the same as for ESP),
    Topic and Name. If we use a Mosquitto broker running on an external device, the
    localhost:1880 is replaced by the address of the server running the broker.


    ![](img/bc50e9ed6994305c0caada2236432c8a_321_0.png)


    **Figure 14.15.** Editing the mqtt out node for the analog command.


    Entering the User Interface, it will be noticed that a slider element has been
    created to control the brightness of the blue LED between 0 and 100%.


    You may enter several such analog commands by this procedure, but you should carefully
    consult the ESP module documentation used to see which of the pins could safely
    function in the PWM mode. On various ESP modules, some pins are used by hardware
    for other functions (for example, I2C, USART, etc.).


