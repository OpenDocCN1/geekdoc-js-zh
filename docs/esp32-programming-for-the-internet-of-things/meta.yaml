    **Figure 12.6.** The program for three digital controls and an analog command


    We remind that analog widgets can generate huge data streams if the mouse continuously
    drives them, which could block the link. Therefore, the new Connect() function
    has been defined, which will try to restore the link and resubscribe to the topics
    used. It is called in the setup sequence, in the receivedCallback() function -
    if the message is not a normal one, and in the infinite loop after the client.state()
    statement - which normally has to return the o code.


    The standard codes returned by the clientstate() statement in MQTT are as follows:


    +   - -4 the server didn''t respond within the keepalive time;

    - -3 the network connection was broken;

    - -2 the network connection failed;

    - -1 the client is disconnected cleanly;

    - o the client is connected;

    - 1 the server doesn''t support the requested version of MQTT;

    - 2 the server rejected the client identifier;

    - 3 the server was unable to accept the connection;

    - 4 the username/password were rejected;

    - 5 the client was not authorized to connect.


    There are many options for inserting HTML and JS code into the widgets behaviors.
    For this, in the Units tab, select the appropriate type from Sample. An analog
    command would require a slider widget found in the Numbers code. In the obtained
    window, with Type-> Code, you can edit the code accordingly: the "topic" fields
    where you will enter'
