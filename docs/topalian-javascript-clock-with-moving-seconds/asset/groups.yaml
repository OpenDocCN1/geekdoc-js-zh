  mdcn: "\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_53_0.png)\n\n## // 如何合并一个文件夹下的JS文件.js\n\
    \n首先，我们在**每个脚本**的末尾添加**两个新行**。这样它们以后就可以在每个脚本之间通过换行符完美地合并。**\n\n我们打开 **js** 文件夹。\n\
    \n在我们的 js 项目文件夹中，在文件夹的地址栏中输入 **cmd** 然后按回车。这会在命令提示符中打开我们的 js 文件夹。\n\n我们输入 `copy\
    \ *.js main.js` 然后按回车。\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_54_0.png)\n\
    \n这将创建一个名为 main.js 的新文件。这个新文件将所有的 .js 文件包含在**一个**文件中。但是，在 main.js 脚本的末尾有一个杂质字符，我们需要删除它。在\
    \ VSCode 中，该字符可能被称为 SUB。\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_55_0.png)\n\
    \n我们移除这个杂质 SUB 字符，代码就可以运行了。正如我们看到的，杂质字符已被删除。\n\n<!-- 现在，在我们的 html 代码中，我们可以输入 -->\n\
    `<script src = 'main.js'></script>`\n这使得将 js 代码上传到网站变得简单得多。\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_56_0.png)\n\
    \n## 如何使用命令提示符将 .js 文件合并为一个 main.js 文件\n\n此适用于适用于 js 项目文件夹的子文件夹中有想要合并的 js 脚本的情况。\n\
    \n![](img/caee5a601dc1e6c3e9deb9d745ec8934_57_0.png)\n\n## // 如何合并所有文件夹下的JS文件.js\n\
    \n### 教程：\n如何合并我们 js 文件夹中所有文件夹下的所有 .js 文件。\n\n**准备工作：**\n我们应该在每个脚本的末尾添加两个新行。这样它们就可以在每个脚本之间通过换行符完美地合并。\n\
    \n第一步：打开我们的 js 文件夹\n第二步：在 js 文件夹的地址栏输入 **cmd**，按**回车**。这会在命令提示符中打开我们的 js 文件夹。\n\
    \n![](img/caee5a601dc1e6c3e9deb9d745ec8934_58_0.png)\n\n第三步：在命令提示符中输入下面的命令然后按回车\n\
    `for /r \"%CD%\" %i in (*.js) do type \"%i\" >> main.js`\n\n现在我们有一个名为 main.js\
    \ 的新 .js 文件，它将所有的 js 文件包含在一个文件中。这使得上传应用程序变得容易，并且容易发现我们的项目有多少行代码。\n\n要使用我们的 main.js\
    \ 文件，我们在 html 文件代码中包含它：\n`<script src = 'js/main.js'></script>`\n\n编写愉快 :-)\n\n\
    ![](img/caee5a601dc1e6c3e9deb9d745ec8934_59_0.png)\n\n## 如何使用批处理文件将 .js 文件合并为一个\
    \ main.js 文件\n\n此适用于我们的 js 项目文件夹的子文件夹中有想要合并的 js 脚本的情况。\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_60_0.png)\n\
    \n## // 如何使用Bat文件合并JS文件.js\n\n我们可以使用以下方法将位于 js 文件夹中的所有 .js 文件合并为一个 main.js 文件：\n\
    - 命令提示符方法\n- 或者\n- .bat 文件方法\n\n.bat 文件方法非常简单。我们双击位于 js 文件夹中的 bat 文件，它就会生成一个 main.js\
    \ 文件，该文件包含了 js 文件夹中的所有 .js 文件，包括我们 js 文件夹下所有子目录中的所有 .js 文件。\n\n这是一种合并我们 .js 文件的非常简单的方法，因为我们可以随时双击\
    \ .bat 文件，它会再次生成 main.js 文件，包含 js 文件夹中的所有 js 文件，包括 js 文件夹下所有子目录中的所有 .js 文件。这使得上传我们的应用程序变得简单得多。\n\
    \n编写愉快 :-)![](img/caee5a601dc1e6c3e9deb9d745ec8934_61_0.png)\n\n## Topalian_Combine_JS_Files.bat\n\
    \n:: 此 .bat 文件将我们项目文件夹中所有文件夹中的所有 js 文件合并为一个 main.js 文件。\n:: 要激活此 bat 文件，在它位于 js\
    \ 文件夹时双击该 bat 文件。\n```batch\n@echo off\n:: 设置输出名称\nset \"output=main.js\"\n::\
    \ 清空现有的输出文件\ntype nul>\"%output%\"\n:: 遍历子目录中的 JavaScript 文件\nfor /r %%i in (*js)\
    \ do (\n:: 将每个文件的内容追加到输出文件\ntype \"%%i\"%\"%output%\"\n)\necho \"JavaScript files\
    \ combined into %output% successfully.\"\n```\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_62_0.png)\n\
    \n## 如何使用 Node.js 将 .js 文件合并为一个 main.js 文件\n\n此版本将成功合并单个文件夹的 js 文件。它也可以合并所有子目录中的\
    \ js 文件。\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_63_0.png)\n\n// Topalian_Combine_JS_Files.js```javascript\n\
    let fs = require('fs');\nlet path = require('path');\n\nfunction combineJSFiles(directory,\
    \ scriptFilename) {\n    let outputFilePath = path.join(directory, 'main.js');\n\
    \    let fileContents = [];\n\n    function traverseFolder(folder) {\n       \
    \ let files = fs.readdirSync(folder);\n        for (let i = 0; i < files.length;\
    \ i++) {\n            let file = files[i];\n            let filePath = path.join(folder,\
    \ file);\n            let stats = fs.statSync(filePath);\n            if (stats.isDirectory())\
    \ {\n                traverseFolder(filePath);\n            } else if (path.extname(filePath)\
    \ === '.js') {\n                let content = fs.readFileSync(filePath, 'utf8');\n\
    \                // 检查是否为脚本本身\n                if (filePath !== scriptFilename)\
    \ {\n                    fileContents.push(content);\n                }\n    \
    \        }\n        }\n    }\n\n    traverseFolder(directory);\n    fs.writeFileSync(outputFilePath,\
    \ fileContents.join('\\n'), 'utf8');\n    console.log(`Combined ${fileContents.length}\
    \ .js files into ${outputFilePath}`);\n}\n\n// 获取脚本目录\nlet currentDirectory =\
    \ process.cwd();\n\n// 获取脚本文件名\nlet scriptFilename = __filename;\ncombineJSFiles(currentDirectory,\
    \ scriptFilename);\n```\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_64_0.png)\n\
