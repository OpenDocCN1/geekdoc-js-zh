    \ === '.js') {\n                let content = fs.readFileSync(filePath, 'utf8');\n\
    \                // check if file is not script itself\n                if (filePath\
    \ !== scriptFilename) {\n                    fileContents.push(content);\n   \
    \             }\n            }\n        }\n    }\n\n    traverseFolder(directory);\n\
    \    fs.writeFileSync(outputFilePath, fileContents.join('\\n'), 'utf8');\n   \
    \ console.log(`Combined ${fileContents.length} .js files into ${outputFilePath}`);\n\
    }\n\n// get current directory of script\nlet currentDirectory = process.cwd();\n\
    \n// get filename of script\nlet scriptFilename = __filename;\ncombineJSFiles(currentDirectory,\
    \ scriptFilename);\n```\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_64_0.png)\n\
    ![](img/caee5a601dc1e6c3e9deb9d745ec8934_65_0.png)\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_66_0.png)\n\
