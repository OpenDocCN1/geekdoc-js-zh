    \ enter.\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_54_0.png)\n\nThis creates\
    \ a new file that is named main.js. This new file contains all .js files in ONE\
    \ file. But, there is a junk character at the end of the main.js script that we\
    \ have to delete. In VSCode the character might be called SUB\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_55_0.png)\n\
    \nWe remove this junk SUB character and the code will now run. As we can see,\
    \ the junk character is removed.\n\n<!-- Now, in our html code, we can type -->\n\
    `<script src = 'main.js'></script>`\nThis makes it much easier to upload our js\
    \ code to our website.\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_56_0.png)\n\
    \n## How to Combine .js files into one main.js file using Command Prompt\n\nVersion\
    \ for when we have js scripts in subfolders in our js project folder, that we\
    \ want to combine.\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_57_0.png)\n\n##\
    \ // HowToCombineJSFilesAllFolders.js\n\n### TUTORIAL:\nHow to Combine all .js\
    \ files in all folders that are in our js folder.\n\n**Getting things ready:**\n\
    We should add two new lines at the end every script. This way they will combine\
    \ nicely with a line break in between each script.\n\nStep One: Open our js folder\n\
    Step Two: Type in the address bar of the js folder, **cmd**, press **Enter**.\
    \ This opens our js folder in the command prompt.\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_58_0.png)\n\
    \nStep Three: Type the command shown below in the command prompt and then press\
    \ Enter\n`for /r \"%CD%\" %i in (*.js) do type \"%i\" >> main.js`\n\nNow we have\
    \ a newly created .js file named main.js that has all of our js files included\
    \ into one file. This makes it easy to upload our application and easy to find\
    \ out how many lines of code our project is.\n\nTo use our main.js file, we include\
    \ it in our html file code:\n`<script src = 'js/main.js'></script>`\n\nHappy Scripting\
    \ :-)\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_59_0.png)\n\n## How to Combine\
    \ .js files into one main.js file using a batch file\n\nVersion for when we have\
    \ js scripts in subfolders in our js project folder, that we want to combine.\n\
    \n![](img/caee5a601dc1e6c3e9deb9d745ec8934_60_0.png)\n\n## // HowToCombineJSFilesUsingBatFile.js\n\
    \nWe can combine all of the .js files that are located in our js folder into one\
    \ main.js file, using either:\n- The Command Prompt Method\n- or\n- The .bat File\
    \ Method\n\nThe .bat file method is very easy. We double click the bat file, which\
    \ is located in our js folder, and it will make a main.js file, which includes\
    \ all .js files in the js folder, including all .js files in all subdirectories\
    \ of our js folder.\n\nThis is a very easy way to combine our .js files, because\
    \ we can double click the .bat file anytime, and it will again generate the main.js\
    \ file which includes all js files in js folder, including all .js files in all\
    \ subdirectories of our js folder. This makes uploading our application much easier.\n\
    \nHappy Scripting :-)![](img/caee5a601dc1e6c3e9deb9d745ec8934_61_0.png)\n\n##\
    \ Topalian_Combine_JS_Files.bat\n\n:: This .bat File Combines All js files in\
    \ all folders of our project folder, into one main.js file.\n:: To activate this\
    \ bat file, we double click the bat file while it is located in js folder.\n```batch\n\
    @echo off\n:: set the output name\nset \"output=main.js\"\n:: clear existing output\
    \ file\ntype nul>\"%output%\"\n:: loop through JavaScript files in subdirectories\n\
    for /r %%i in (*js) do (\n:: append the content of each file to output file\n\
    type \"%%i\"%\"%output%\"\n)\necho \"JavaScript files combined into %output% successfully.\"\
    \n```\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_62_0.png)\n\n## How to Combine\
    \ .js files into one main.js file using Node.js\n\nThis version will successfully\
    \ combine a single folder of js files. It also works to combine js files in all\
    \ subdirectories.\n\n![](img/caee5a601dc1e6c3e9deb9d745ec8934_63_0.png)\n\n//\
    \ Topalian_Combine_JS_Files.js\n```javascript\nlet fs = require('fs');\nlet path\
