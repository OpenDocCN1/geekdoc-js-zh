    \ 3.33: count-lines-with-stat.slice.out\n\nThis code is complex, but much simpler\
    \ than it would be if we were using callbacks.\n\n**3.5**\n\n**Lining things up**\n\
    \nThis code uses the expression `{filename, stats}` to create an object whose\
    \ keys are `filename`\n\nand `stats`, and whose values are the values of the corresponding\
    \ variables. Doing this makes\n\nthe code easier to read, both because it’s shorter\
    \ but also because it signals that the value\n\nassociated with the key `filename`\
    \ is exactly the value of the variable with the same name.\n\n**3.6**\n\n**How\
    \ can we make this more readable?**\n\nPromises eliminate the deep nesting associated\
    \ with callbacks of callbacks, but they are still hard\n\nto follow. The latest\
    \ versions of JavaScript provide two new keywords `async` and `await` to ﬂatten\n\
    \ncode further. `async` means \"this function implicitly returns a promise\",\
    \ while `await` means \"wait\n\nfor a promise to resolve\". This short program\
    \ uses both keywords to print the ﬁrst ten characters\n\nof a ﬁle:\n\n\a\n\n\x04\
    \n\n`import fs from` `'``fs -extra -promise` `'`\n\n`const`\n\n`firstTenCharacters\
    \ = async (filename) => {`\n\n`const`\n\n`text = await fs.readFileAsync (filename\
    \ ,` `'``utf -8``'``)`\n\n`console.log(``` ` ```inside , raw text is ${text.length}\
    \ characters long` `` ` ```)`\n\n`return`\n\n`text.slice(0, 10)`\n\n`}`\n\n`console.log(``'``about\
    \ to call` `'``)`\n\n`const`\n\n`result = firstTenCharacters (process.argv [2])`\n\
    \n`console.log(``` ` ```function`\n\n`result has type ${result.constructor.name}```\
