    \ 13.17: checking/js-interactive.out\n\nWe therefore won’t try to handle circular\
    \ dependencies. However, we will detect them and\n\ngenerate a sensible error\
    \ message.\n\n`import` **vs.** `require`\n\nCircular dependencies work JavaScript’s\
    \ `import` syntax because we can analyze ﬁles to deter-\n\nmine what needs what,\
    \ get everything into memory, and then resolve dependencies. We can’t\n\ndo this\
    \ with `require`-based code because someone might create an **alias** and call\
    \ `require`\n\nthrough that or `eval` a string that contains a `require` call.\
    \ (Of course, they can also do these\n\nthings with the function version of `import`.)\n\
    \n**13.4**\n\n**How can a module load another module?**\n\nWhile we’re not going\
    \ to handle circular dependencies, modules do need to be able to load other\n\n\
    modules. To enable this, we need to provide the module with a function called\
    \ `require` that it can\n\ncall as it’s loading. As in Chapter 12, this function\
    \ checks a cache to see if the ﬁle being asked for\n\nhas already been loaded.\
    \ If not, it loads it and saves it; either way, it returns the result.\n\nOur\
    \ cache needs to be careful about how it identiﬁes ﬁles so that it can detect\
    \ duplicates loading\n\nattempts that use diﬀerent names. For example, suppose\
    \ that `major.js` loads `subdir/first.js`\n\nand `subdir/second.js`. When `subdir/second.js`\
    \ loads `./first.js`, our system needs to realize\n\nthat it already has that\
    \ ﬁle even though the path looks diﬀerent. We will use **absolute paths** as\n\
    \ncache keys so that every ﬁle has a unique, predictable key.\n\nTo reduce confusion,\
    \ we will call our function `need` instead of `require`. In order to make the\n\
    \ncache available to modules while they’re loading, we will make it a property\
    \ of `need`. (Remember,\n\na function is just another kind of object in JavaScript;\
    \ every function gets several properties au-\n\ntomatically, and we can always\
    \ add more.) Since we’re using the built-in `Map` class as a cache, the\n\nentire\
    \ implementation of `need` is just 15 lines long:\n\n\a\n\n\x04\n\n`import`\n\n\
