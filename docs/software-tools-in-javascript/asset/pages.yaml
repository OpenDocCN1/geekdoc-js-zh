  md: '**19**


    *Virtual Machine*


    ***Assembling and running low-level code***


    **Terms deﬁned: Application Binary Interface**, **assembler**, **assembly code**,
    **bitwise opera-**


    **tion**, **instruction pointer**, **instruction set**, **label (address in memory)**,
    **op code**, **register**,


    **virtual machine**, **word (of memory)**


    Computers don’t execute JavaScript directly. Instead, each processor has its own
    **instruction**


    **set**, and a compiler translates high-level languages into those instructions.
    Compilers often use an


    intermediate representation called **assembly code** that gives instructions human-readable
    names


    instead of numbers. To understand more about how JavaScript actually runs we will
    simulate a


    very simple processor with a little bit of memory. If you want to dive deeper,
    have a look at Bob


    Nystrom’s¹*Crafting Interpreters*². You may also enjoy Human Resource Machine³,
    which asks you


    to solve puzzles of increasing diﬃculty using a processor almost as simple as
    ours.


    **19.1**


    **What is the architecture of our virtual machine?**


    Our **virtual machine** has three parts, which are shown in Figure 19.1 for a
    program made up of


    110 instructions:


    1\. An **instruction pointer** (IP) that holds the memory address of the next
    instruction to execute.


    It is automatically initialized to point at address 0, which is where every program
    must start.


    This rule is part of the **Application Binary Interface** (ABI) for our virtual
    machine.


    2\. Four **registers** named R0 to R4 that instructions can access directly. There
    are no memory-to-


    memory operations in our VM: everything happens in or through registers.


    3\. 256 **words** of memory, each of which can store a single value. Both the
    program and its data


    live in this single block of memory; we chose the size 256 so that each address
    will ﬁt in a single


    byte.


    The instructions for our VM are 3 bytes long. The **op code** ﬁts into one byte,
    and each instruc-


    tion may optionally include one or two single-byte operands. Each operand is a
    register identiﬁer,


    a constant, or an address (which is just a constant that identiﬁes a location
    in memory); since


    constants have to ﬁt in one byte, the largest number we can represent directly
    is 256\. Table 19.1


    uses the letters `r`, `c`, and `a` to indicate instruction format, where `r` indicates
    a register identiﬁer, `c`


    indicates a constant, and `a` indicates an address.


    1http://journal.stuﬀwithstuﬀ.com/


    2https://craftinginterpreters.com/


    3https://tomorrowcorporation.com/humanresourcemachine


    311'
