    \ terse output. Since we may want to look for ﬁles somewhere else,\n\nor request\
    \ verbose output, the program needs to handle command-line arguments.\n\nThe `minimist`⁵module\
    \ does this in a way that is consistent with Unix conventions. Given\n\ncommand-line\
    \ arguments *after* the program’s name (i.e., from `process.argv[2]` onward),\
    \ it looks\n\nfor patterns like `-x something` and creates an object with ﬂags\
    \ as keys and values associated with\n\nthem.\n\n**Filenames in** `minimist`\n\
    \nIf we use a command line like `pray.js -v something.js`, then `something.js`\
    \ becomes the\n\nvalue of `-v`. To indicate that we want `something.js` added\
    \ to the list of trailing ﬁlenames\n\nassociated with the special key `_` (a single\
    \ underscore), we have to write `pray.js -v –`\n\n`something.js`. The double dash\
    \ is a common Unix convention for signalling the end of pa-\n\nrameters.\n\nOur\
    \ **test runner** is now complete, so we can try it out with some ﬁles containing\
