  md: "134\n\n*9 Page Templates*\n\n**Scoping rules**\n\nSearching the stack frame\
    \ by frame while the program is running is called is **dynamic scoping**,\n\n\
    since we ﬁnd variables while the program is running. In contrast, most programming\
    \ languages\n\nused **lexical scoping**, which ﬁgures out what a variable name\
    \ refers to based on the structure\n\nof the program text.\n\nThe values in a\
    \ running program are sometimes called an **environment**, so we have named our\n\
    \nstack-handling class `Env`. Its methods let us push and pop new stack frames\
    \ and ﬁnd a variable\n\ngiven its name; if the variable can’t be found, `Env.find`\
    \ returns `undefined` instead of throwing an\n\nexception (Figure 9.2).\n\n\a\n\
    \n\x04\n\n`class Env {`\n\n`constructor (initial) {`\n\n`this.stack = []`\n\n\
    `this.push(Object.assign ({}, initial ))`\n\n`}`\n\n`push (frame) {`\n\n`this.stack.push(frame)`\n\
    \n`}`\n\n`pop () {`\n\n`this.stack.pop()`\n\n`}`\n\n`find (name) {`\n\n`for (let\
    \ i = this.stack.length - 1; i >= 0; i--) {`\n\n`if (name in this.stack[i]) {`\n\
    \n`return`\n\n`this.stack[i][ name]`\n\n`}`\n\n`}`\n\n`return`\n\n`undefined`\n\
    \n`}`\n\n`toString () {`\n\n`return`\n\n`JSON.stringify(this.stack)`\n\n`}`\n\n\
    `}`\n\n`export`\n\n`default`\n\n`Env`\n\n\x06\n\n\x05\n\nListing 9.4: env.js"
