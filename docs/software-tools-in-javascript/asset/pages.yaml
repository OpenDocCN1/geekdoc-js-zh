  md: '**11**


    *Layout Engine*


    ***Figuring out what goes where in a web page***


    **Terms deﬁned: Liskov Substitution Principle**, **attribute**, **cache**, **conﬁrmation
    bias**, **design**


    **by contract**, **easy mode**, **layout engine**, **query selector**, **signature**,
    **z-buﬀering**


    You might be reading this as an HTML page, an e-book (which is basically the same
    thing), or


    on the printed page. In all three cases, a **layout engine** took some text and
    some layout instructions


    and decided where to put each character and image. We will build a small layout
    engine in this


    chapter based on Matt Brubeck’s¹tutorial²to explore how browsers decide what to
    put where.


    Our inputs will be a very small subset of HTML and an equally small subset of
    CSS. We will


    create our own classes to represent these instead of using those provided by various
    Node³libraries;


    to translate the combination of HTML and CSS into text on the screen, we will
    label each node in


    the DOM tree with the appropriate styles, walk that tree to ﬁgure out where each
    visible element


    belongs, and then draw the result as text on the screen.


    **Upside down**


    The coordinate systems for screens put (0, 0) in the upper left corner instead
    of the lower left.


    X increases to the right as usual, but Y increases as we go down, rather than
    up (Figure 11.1).


    This convention is a holdover from the days of teletype terminals that printed
    lines on rolls of


    paper; as Mike Hoye⁴has repeatedly observed⁵, the past is all around us.


