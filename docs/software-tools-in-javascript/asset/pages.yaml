    on the


    processor.


    **XML:** A set of rules for deﬁning **HTML**-like tags and using them to format
    documents (typically


    data). XML was popular in the early 2000s, but its complexity led many programmers
    to adopt


    **JSON**, instead.


    **YAML:** Short for "YAML Ain’t Markup Language", a way to represent nested data
    using inden-


    tation rather than the parentheses and commas of **JSON**. YAML is often used
    in conﬁguration


    ﬁles and to deﬁne **parameters** for various ﬂavors of **Markdown** documents.


    **z-buﬀering:** A drawing method that keeps track of the depth of what lies "under"
    each pixel so


    that it displays whatever is nearest to the observer.'
