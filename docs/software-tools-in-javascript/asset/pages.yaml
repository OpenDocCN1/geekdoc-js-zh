    \n... ... ...\n\nFigure 14.3: Finding nodes in the tree using the Iterator pattern.\n\
    \n**14.5**\n\n**How else could the AST walker work?**\n\nA third approach to this\
    \ problem uses the **Iterator** design pattern. Instead of taking the computa-\n\
    \ntion to the nodes as a visitor does, an iterator returns the elements of a complex\
    \ structure one by\n\none for processing (Figure 14.3). One way to think about\
    \ it is that the Visitor pattern encapsulates\n\nrecursion, while the Iterator\
    \ pattern turns everything into a `for` loop.\n\nWe can implement the Iterator\
    \ pattern in JavaScript using **generator functions**. If we declare\n\na function\
    \ using `function *` (with an asterisk) instead of `function` then we can use\
    \ the `yield`\n\nkeyword to return a value and suspend processing to be resumed\
    \ later. The result of `yield` is a\n\ntwo-part structure with a value and a ﬂag\
    \ showing whether or not processing is done:\n\n\a\n\n\x04\n\n`function * threeWords\
    \ () {`\n\n`yield` `'``first` `'`\n\n`yield` `'``second` `'`\n\n`yield` `'``third`\
    \ `'`\n\n`}`"
