  md: "**12**\n\n*File Interpolator*\n\n***Managing source ﬁles that have been broken\
    \ into pieces***\n\n**Terms deﬁned: header ﬁle**, **literate programming**, **loader**,\
    \ **sandbox**, **search path**, **shell**\n\n**variable**\n\nMany of the examples\
    \ in these lessons are too long to show comfortably in one block of code\n\non\
    \ a printed page, so we needed a way to break them up. As an experiment, we wrote\
    \ a custom\n\n**module loader** that reads a source ﬁle containing specially-formatted\
    \ comments and then reads\n\nand inserts the ﬁles speciﬁed in those comments before\
    \ running the code (Figure 12.1). Modern\n\nprogramming languages don’t work this\
    \ way, but C and C++ do this with **header ﬁles**, and static\n\nsite generators\
    \ (Chapter 9) do this to share fragments of HTML.\n\nThe special comments in our\
    \ source ﬁles contain two ﬁelds: the text to put in the displayed\n\nversion and\
    \ ﬁle to include when loading:\n\n\a\n\n\x04\n\n`class`\n\n`Something {`\n\n`/*+`\n\
    \n`constructor + constructor.js +*/`\n\n`/*+ a long`\n\n`method + long_method.js\
    \ +*/`\n\n`/*+`\n\n`another`\n\n`method + another_method .js +*/`\n\n`}`\n\n\x06\
    \n\n\x05\n\nListing 12.1: interpolation-example.js\n\nWe got this to work, but\
    \ decided to use a diﬀerent approach in this book. The stumbling block\n\nwas\
    \ that the style-checking tool ESLint¹didn’t know what to make of our inclusions,\
    \ so we would\n\neither have to modify it or build a style checker of our own.\
    \ (We will actually do that in Chapter 14,\n\nbut we won’t go nearly as far as\
    \ ESLint.)\n\nDespite being a dead end, the inclusion tool is a good way to show\
    \ how JavaScript turns source\n\ncode into something it can execute. We need to\
    \ be able to do this in the next couple of chapters,\n\nso we might as well tackle\
    \ it now.\n\n**12.1**\n\n**How can we evaluate JavaScript dynamically?**\n\nWe\
    \ want to display ﬁles as they are on the web and in print, but interpolate the\
    \ ﬁles referenced in\n\nspecial comments when we load things with `import`. To\
    \ do this, we need to understand the lifecycle\n\nof a JavaScript program. When\
    \ we ask for a ﬁle, Node²reads the text, translates it into runnable\n\n1https://eslint.org/\n\
    \n2https://nodejs.org/en/\n\n197"
