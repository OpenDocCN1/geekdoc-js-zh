    \ncompletely different\n\nresult\n\nFigure 5.1: How hash functions speed up lookup.\n\
    \nIt’s easy to write a bad hash function, but very hard to write one that qualiﬁes\
    \ as cryptographic.\n\nWe will therefore use a library to calculate 160-bit **SHA-1**\
    \ hashes for our ﬁles. These are not random\n\nenough to keep data secret from\
    \ a patient, well-funded attacker, but that’s not what we’re using\n\nthem for:\
    \ we just want hashes that are random to make **collision** extremely unlikely.\n\
    \n**The Birthday Problem**\n\nThe odds that two people share a birthday are 1/365\
    \ (ignoring February 29). The odds that\n\nthey *don’t* are therefore 364/365\\\
    . When we add a third person, the odds that they don’t share a\n\nbirthday with\
    \ either of the preceding two people are 363/365, so the overall odds that nobody\n\
    \nshares a birthday are (365/365)×(364/365)×(363/365). If we keep calculating,\
    \ there’s a 50%\n\nchance of two people sharing a birthday in a group of just\
    \ 23 people, and a 99.9% chance with\n\n70 people.\n\nWe can use the same math\
    \ to calculate how many ﬁles we need to hash before there’s a\n\n50% chance of\
    \ a collision. Instead of 365 we use 2^(160)(the number of values that are 160\
    \ bits\n\nlong), and after checking Wikipedia⁴and doing a few calculations with\
    \ Wolfram Alpha⁵, we\n\ncalculate that we would need to have approximately 10^(24)ﬁles\
