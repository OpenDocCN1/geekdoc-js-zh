    *Introduction*


    ***Who you are and where we’re going***


    The best way to learn design is to study examples [Schon1984, Petre2016], and
    some of the best


    examples of software design come from the tools programmers use in their own work.
    In these lessons


    we build small versions of things like ﬁle backup systems, testing frameworks,
    regular expression


    matchers, and browser layout engines both to demystify them and to give some insights
    into how


    experienced programmers think. We draw inspiration from [Brown2011, Brown2012,
    Brown2016],


    Mary Rose Cook¹’s Gitlet², and the books that introduced the Unix philosophy to
    an entire gener-


    ation of programmers [Kernighan1979, Kernighan1981, Kernighan1983, Kernighan1988].


    All of the written material in this project can be freely reused under the terms
    of the Creative


    Commons - Attribution license³, while all of the software is made available under
    the terms of the


    Hippocratic License⁴; see Appendix A for details.


    *All proceeds from this project will go to support the Red Door Family Shelter*⁵*.*


    **1.1**


    **Who is our audience?**


    Every lesson should be written with speciﬁc learners in mind. These three personas⁶describe
    ours:


    • Aïsha started writing VB macros for Excel in an accounting course and never
    looked back. After


    spending three years doing front-end JavaScript work she now wants to learn how
    to build back-


    end applications. This material will ﬁll in some gaps in her programming knowledge
    and teach


    her some common design patterns.


    • Rupinder is studying computer science at college. He has learned a lot about
    the theory of


    algorithms, and while he uses Git and unit testing tools in his assignments, he
    doesn’t feel he


    understands how they work. This material will give him a better understanding
    of those tools


    and of how to design new ones.


    • Yim builds mobile apps for a living but also teaches two college courses: one
    on full-stack web


    development using JavaScript and Node and another titled "Software Design". They
    are happy


    with the former, but frustrated that so many books about the latter subject talk
    about it in the


    abstract and use examples that their students can’t relate to. This material will
    ﬁll those gaps


    and give them starting points for a wide variety of course assignments.


