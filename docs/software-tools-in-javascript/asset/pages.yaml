    `const`\n\n`lineCount = (filename) => {`\n\n`return new`\n\n`Promise (( resolve\
    \ , reject) => {`\n\n`fs.readFileAsync(filename , { encoding:` `'``utf -8``'`\
    \ `})`\n\n`.then(data => resolve(data.split (``'``\\n``'``). length - 1))`\n\n\
    `.catch(err => reject(err))`\n\n`})`\n\n`}`\n\n`const`\n\n`srcDir = process.argv\
    \ [2]`\n\n`main(srcDir)`\n\n\x06\n\n\x05\n\nListing 3.27: count-lines-globbed-ﬁles.js\n\
    \n\a\n\n\x04\n\n`node count -lines -globbed -files.js .`\n\n\x06\n\n\x05\n\nListing\
