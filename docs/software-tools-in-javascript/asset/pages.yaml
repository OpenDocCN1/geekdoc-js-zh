  md: "250\n\n*15 Code Generator*\n\n**15.2**\n\n**How can we generate JavaScript?**\n\
    \nWe could use a decorator to replace every function in our program with one that\
    \ keeps track of\n\nwhether or not it was called, but it would be tedious to apply\
    \ the decorator to every one of our\n\nfunctions by hand. What we really want\
    \ is a way to do this automatically for everything, and for\n\nthat we need to\
    \ parse and generate code.\n\n**Other ways to do it**\n\nA third way to achieve\
    \ what we want is to let the system turn code into runnable instructions\n\nand\
    \ then modify those instructions. This approach is often used in compiled languages\
    \ like\n\nJava⁵, where the **byte code** produced by the **compiler** is saved\
    \ in ﬁles in order to be run.\n\nWe can’t do this here because Node compiles and\
    \ runs code in a single step.\n\nOur tool will parse the JavaScript with Acorn\
    \ to create an AST, modify the AST, and then use\n\na library called Escodegen⁶to\
    \ turn the AST back into JavaScript. To start, let’s look at the AST\n\nfor a\
    \ simple function deﬁnition, which is 75 lines of pretty-printed JSON:\n\n\a\n\
    \n\x04\n\n`import`\n\n`acorn`\n\n`from` `'``acorn` `'`\n\n`const`\n\n`text =`\
    \ `` ` ```const`\n\n`func = (param) => {`\n\n`return`\n\n`param + 1`\n\n`}```\
    \ ` ``\n\n`const ast = acorn.parse(text , { sourceType:` `'``module` `'` `})`\n\
    \n`console.log(JSON.stringify(ast , null , 2))`\n\n\x06\n\n\x05\n\nListing 15.4:\
    \ func-def.js\n\n\a\n\n\x04\n\n`{`\n\n`\"type \": \"Program\",`\n\n`\"start \"\
    : 0,`\n\n`\"end\": 46,`\n\n`\"body \": [`\n\n`{`\n\n`\"type \": \" VariableDeclaration\
    \ \",`\n\n`\"start \": 0,`\n\n`\"end\": 46,`\n\n`\"declarations \": [`\n\n`{`\n\
    \n`\"type \": \" VariableDeclarator \",`\n\n`\"start \": 6,`\n\n`\"end\": 46,`\n\
