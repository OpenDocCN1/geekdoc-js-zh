  md: '116


    *7 Pattern Matching*


    **Make repetition more eﬃcient**


    Rewrite `RegexAny` so that it does not repeatedly re-match text.


    **Lazy matching**


    The regular expressions we have seen so far are **eager**: they match as much
    as they can, as early


    as they can. An alternative is **lazy matching**, in which expressions match as
    little as they need


    to. For example, given the string `"ab"`, an eager match with the expression `/ab*/`
    will match both


    letters (because `/b*/` matches a ’b’ if one is available) but a lazy match will
    only match the ﬁrst


    letter (because `/b*/` can match no letters at all). Implement lazy matching for
    the `*` operator.


    **Optional matching**


    The `?` operator means "optional", so that `/a?/` matches either zero or one occurrences
    of the letter


    ’a’. Implement this operator.'
