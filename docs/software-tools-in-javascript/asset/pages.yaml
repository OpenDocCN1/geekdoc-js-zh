    *1 Introduction*


    Frustrated by that, he and Andy Oram^(14)persuaded some well-known programmers
    to contribute


    a chapter each to a collection called *Beautiful Code* [Oram2007], which went
    on to win the Jolt Award


    in 2007\. Entries in the book described everything from ﬁguring out whether three
    points are on a


    line to core components of Linux and the software for the Mars Rover, but the
    breadth that made


    them fun to read also meant they weren’t particularly useful for teaching.


    To ﬁx that, Greg Wilson, Amy Brown^(15), Tavish Armstrong^(16), and Mike DiBernardo^(17)edited
    a


    four-book series between 2011 and 2016 called *The Architecture of Open Source
    Applications*^(18). In


    the ﬁrst two volumes, the creators of ﬁfty open source projects described their
    systems’ designs; the


    third book explored the performance of those systems, while in the fourth volume
    contributors built


    scale models of common tools as a way of demonstrating how those tools worked.
    These books were


    closer to what an instructor would need for an undergraduate class on software
    design, but still


    not quite right: the intended audience would probably not be familiar with many
    of the problem


    domains, and since each author used the programming language of their choice,
    much of the code


    would be hard to understand.


    *Software Tools in JavaScript* is meant to address these shortcomings: all of
    the code is written


    in one language, and the examples are all tools that programmers use daily. Most
    of the programs


    are less than 60 lines long and the longest is less than 200; we believe each
    chapter can be covered


    in class in 1-2 hours, while the exercises range in diﬃculty from a few minutes
    to a couple of days.


