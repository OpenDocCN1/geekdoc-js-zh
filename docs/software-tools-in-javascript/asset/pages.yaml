    Figure 18.1: Finding allowable combinations of package versions.


    **18.1**


    **What is semantic versioning?**


    Most software projects use **semantic versioning** for software releases. Each
    version number con-


    sists of three integers X.Y.Z, where X is the major version, Y is the minor version,
    and Z is the **patch**


    number. (The full speciﬁcation⁴allows for more ﬁelds, but we will ignore them
    in this tutorial.)


    A package’s authors increment its major version number every time something changes
    in a way


    that makes the package incompatible with previous versions For example, if they
    add a required


    parameter to a function, then code built for the old version will fail or behave
    unpredictably with


    the new one. The minor version number is incremented when new functionality is
    **backward-**


    **compatible**—i.e., it won’t break any existing code—and the patch number is
    changed for backward-


    compatible bug ﬁxes that don’t add any new features.


    The notation for specifying a project’s dependencies looks a lot like arithmetic:
    `>= 1.2.3` means


    "any version from 1.2.3 onward", `< 4` means "any version before 4.anything",
    and `1.0 - 3.1` means


    "any version in the speciﬁed range (including patches)". Note that version 2.1
    is greater than version


    1.99: no matter how large a minor version number becomes, it never spills over
    into the major version


    number in the way that minutes add up to hours or months add up to years.


    It isn’t hard to write a few simple comparisons for semantic version identiﬁers,
    but getting all


