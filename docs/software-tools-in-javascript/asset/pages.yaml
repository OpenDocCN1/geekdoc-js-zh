    **topological order:** Any ordering of the **nodes** in a **graph** that respects
    the direction of its **edges**,


    i.e., if there is an edge from node A to node B, A comes before B in the ordering.
    There may


    be many topological orderings of a particular graph.


    **transitive closure:** The set of all **nodes** in a **graph** that are reachable
    from a starting node,


    either directly or indirectly.


    **tree:** A **graph** in which every node except the **root** has exactly one
    **parent**.


    **tuple:** A value that has a ﬁxed number of parts, such as the three color components
    of a red-green-


    blue color speciﬁcation.


    **Turing Machine:** A theoretical model of computation that manipulates symbols
    on an inﬁnite


    tape according to a ﬁxed table of rules. Any computation that can be expressed
    as an algorithm


    can be done by a Turing Machine.


    **two hard problems in computer science:** Refers to a quote by Phil Karlton:
    "There are only


    two hard problems in computer science—cache invalidation and naming things." Many
    variations


    add a third problem as a joke, such as **oﬀ-by-one errors**.


    **type declaration:** A statement in a program that a variable or value has a
    particular data type.


    Languages like Java require type declarations for all variables; they are optional
    in TypeScript


    and Python, and not allowed in pure JavaScript.


    **Unicode:** A standard that deﬁnes numeric codes for many thousands of characters
    and symbols.


    Unicode does not deﬁne how those numbers are stored; that is done by standards
    like **UTF-8**.


    **Uniform Resource Locator (URL):** A unique address on the World-Wide Web. URLs
    origi-


    nally identiﬁed web pages, but may also represent datasets or database queries,
    particularly if


    they include a **query string**.


    **unit test:** A test that exercises one function or feature of a piece of software
    and produces **pass**,


    **fail**, or **error**.


    **UTF-8:** A way to store the numeric codes representing **Unicode** characters
    in memory that is


    **backward-compatible** with the older **ASCII** standard.


    **vector:** A sequence of values, usually of **homogeneous** type.


    **version control system:** A system for managing changes made to software during
    its develop-


    ment.


    **virtual machine:** A program that pretends to be a computer. This may seem a
    bit redundant, but


    VMs are quick to create and start up, and changes made inside the virtual machine
    are contained


    within that VM so we can install new **packages** or run a completely diﬀerent
    operating system


    without aﬀecting the underlying computer.


    **Visitor pattern:** A **design pattern** in which the operation to be done is
    taken to each element of


    a data structure in turn. It is usually implemented by having a generator "visitor"
    that knows


    how to reach the structure’s elements, which is given a function or method to
    call for each in


    turn, and that carries out the speciﬁc operation. See also: **Iterator pattern**.'
