  md: "**13**\n\n*Module Loader*\n\n***Loading source ﬁles as modules***\n\n**Terms\
    \ deﬁned: absolute path**, **alias**, **circular dependency**, **closure**, **directed\
    \ graph**, **en-**\n\n**capsulate**, **immediately-invoked function expression**,\
    \ **inner function**, **namespace**, **plugin**\n\n**architecture**\n\nChapter\
    \ 12 showed how to use `eval` to load code dynamically. We can use this to build\
    \ our own\n\nversion of JavaScript’s `require` function. Our function will take\
    \ the name of a source ﬁle as an\n\nargument and return whatever that ﬁle exports.\
    \ The key requirement for such a function is to avoid\n\naccidentally overwriting\
    \ things: if we just `eval` some code and it happens to assign to a variable\n\
    \ncalled `x`, anything called `x` already in our program might be overwritten.\
    \ We therefore need a way to\n\n**encapsulate** the contents of what we’re loading.\
    \ Our approach is based on [Casciaro2020], which\n\ncontains a lot of other useful\
    \ information as well.\n\n**13.1**\n\n**How can we implement namespaces?**\n\n\
    A **namespace** is a collection of names in a program that are isolated from other\
    \ namespaces. Most\n\nmodern languages provide namespaces as a built-in feature\
    \ so that programmers don’t accidentally\n\nstep on each other’s toes. JavaScript\
    \ doesn’t, so we have to implement them ourselves.\n\nWe can do this using **closures**.\
    \ Every function is a namespace: variables deﬁned inside the\n\nfunction are distinct\
    \ from variables deﬁned outside it (Figure 13.1). If we create the variables we\n\
    \nwant to manage inside a function, then deﬁned another function inside the ﬁrst\
    \ and return that\n\n**inner function**, that inner function will be the only\
    \ thing with references to those variables.\n\nFor example, let’s create a function\
    \ that always appends the same string to its argument:\n\n\a\n\n\x04\n\n`const`\n\
    \n`createAppender = (suffix) => {`\n\nconst outer = (amount) => {\n\n    const\
    \ inner = (value) => {\n\n        return value + amount\n\n    }\n\n}\n\nconst\
    \ adder = outer(5)\n\nadder(10)\n\nglobal scope\n\nadder\n\namount\n\n5\n\nFigure\
    \ 13.1: Using closures to create private variables.\n\n213"
