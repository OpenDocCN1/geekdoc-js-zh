  md: '**15**


    *Code Generator*


    ***Modifying code to track coverage and execution times***


    **Terms deﬁned: Decorator pattern**, **byte code**, **code coverage (in testing)**,
    **compiler**,


    **macro**, **nested function**, **two hard problems in computer science**


    We’ve been writing tests since Chapter 4, but how much of our code do they actually
    check?


    One way to ﬁnd out is to use a **code coverage** tool like Istanbul¹that watches
    a program while


    it executes and keeps track of which lines have run and which haven’t. Making
    sure that each line


    is tested at least once doesn’t guarantee that the code is bug-free, but any code
    that *isn’t* run


    shouldn’t be trusted.


    Our code coverage tool will keep track of which functions have and haven’t been
    called. Rather


    than rewriting Node²to keep track of this for us, we will modify the functions
    themselves by parsing


    the code with Acorn³, inserting the instructions we need into the AST, and then
    turning the AST


    back into code.


    **Simple usually isn’t**


    At ﬁrst glance it would be a lot simpler to use regular expressions to ﬁnd every
    line that


    looks like the start of a function deﬁnition and insert a line right after each
    one to record


    the information we want. Of course, some people split function headers across
    several lines


    if they have lots of parameters, and there might be things that look like function
    deﬁnitions


    embedded in comments or strings. It doesn’t take long before our simple solution
    turns into


    a poorly-implemented parser for a subset of JavaScript that no-one else understands.
    Using a


    full-blown parser and working with the AST is almost always less work.


    **15.1**


    **How can we replace a function with another function?**


    The ﬁrst thing we need is a way to wrap up an arbitrary function call. If we declare
    a function in


    JavaScript with a parameter like `...args`, all of the "extra" arguments in the
    call that don’t line up


    with regular parameters are stuﬀed into the variable `args` (Figure 15.1). We
    can also call a function


    by putting values in a variable and using `func(...var)` to spread those values
    out. There’s nothing


    special about the names `args` and `vars`: what matters is the ellipsis `...`


    1https://istanbul.js.org/


    2https://nodejs.org/en/


    3https://github.com/acornjs/acorn


    247'
