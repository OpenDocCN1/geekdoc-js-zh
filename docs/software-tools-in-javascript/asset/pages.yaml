  md: "132\n\n*9 Page Templates*\n\nIn this chapter we will build a simple page templating\
    \ system using the third strategy. We will\n\nprocess each page independently\
    \ by parsing the HTML and walking the DOM to ﬁnd nodes with\n\nspecial attributes.\
    \ Our program will execute the instructions in those nodes to do the equivalent\
    \ of\n\nloops and if/else statements; other nodes will be copied as-is to create\
    \ text.\n\n**9.1**\n\n**What will our system look like?**\n\nLet’s start by deciding\
    \ what \"done\" looks like. Suppose we want to turn an array of strings into an\n\
    \nHTML list. Our page will look like this:\n\n\a\n\n\x04\n\n`<html >`\n\n`<body\
    \ >`\n\n`<p>Expect`\n\n`three items </p>`\n\n`<ul z-loop =\" item:names\">`\n\n\
    `<li ><span z-var=\" item\"/></li >`\n\n`</ul >`\n\n`</body >`\n\n`</html >`\n\
    \n\x06\n\n\x05\n\nListing 9.1: input-loop.html\n\nThe attribute `z-loop` tells\
    \ the tool to repeat the contents of that node; the loop variable and the\n\n\
    collection being looped over are separated by a colon. The attribute `z-var` tells\
    \ the tool to ﬁll in\n\nthe node with the value of the variable.\n\nWhen our tool\
    \ processes this page, the output will be standard HTML without any traces of\n\
    \nhow it was created:\n\n\a\n\n\x04\n\n`<html >`\n\n`<body`\n\n`style =\"font\
    \ -size: 200%; margin -left: 0.5em\">`\n\n`<p>Expect`\n\n`three items </p>`\n\n\
    `<ul >`\n\n`<li ><span >Johnson </span ></li >`\n\n`<li ><span >Vaughan </span\
    \ ></li >`\n\n`<li ><span >Jackson </span ></li >`\n\n`</ul >`\n\n`</body >`\n\
    \n`</html >`\n\n\x06\n\n\x05\n\nListing 9.2: output-loop.html"
