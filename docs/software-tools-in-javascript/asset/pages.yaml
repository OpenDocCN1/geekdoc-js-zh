  md: "*9.2 How can we keep track of values?*\n\n133\n\n**Human-readable vs. machine-readable**\n\
    \nThe introduction said that mini-languages for page templating quickly start\
    \ to accumulate\n\nextra features. We have already started down that road by putting\
    \ the loop variable and\n\nloop target in a single attribute and splitting that\
    \ attribute to get them out. Doing this\n\nmakes loops easy for people to type,\
    \ but hides important information from standard HTML\n\nprocessing tools. They\
    \ can’t know that this particular attribute of these particular elements\n\ncontains\
    \ multiple values or that those values should be extracted by splitting a string\
    \ on a\n\ncolon. We could instead require people to use two attributes, as in:\n\
    \n\a\n\n\x04\n\n`<ul z-loop =\" names\" z-loop -var=\" item\">`\n\n\x06\n\n\x05\
    \n\nbut we have decided to err on the side of minimal typing. And note that strictly\
    \ speaking,\n\nwe should call our attributes `data-something` instead of `z-something`\
    \ to conform with the\n\nHTML5 speciﬁcation⁵, but by the time we’re ﬁnished processing\
    \ our templates, there shouldn’t\n\nbe any `z-*` attributes left to confuse a\
    \ browser.\n\nThe next step is to deﬁne the API for ﬁlling in templates. Our tool\
    \ needs the template itself,\n\nsomewhere to write its output, and some variables\
    \ to use in the expansion. These variables might\n\ncome from a conﬁguration ﬁle,\
    \ from a YAML header in the ﬁle itself, or from some mix of the two;\n\nfor the\
    \ moment, we will just pass them into the expansion function as an object:\n\n\
    \a\n\n\x04\n\n`const`\n\n`variables = {`\n\n`names: [``'``Johnson` `'``,` `'``Vaughan`\
    \ `'``,` `'``Jackson` `'``]`\n\n`}`\n\n`const dom = readHtml(``'``template.html`\
    \ `'``)`\n\n`const`\n\n`expander = new`\n\n`Expander(dom , variables)`\n\n`expander.walk\
    \ ()`\n\n`console.log(expander.result)`\n\n\x06\n\n\x05\n\nListing 9.3: example-call.js\n\
    \n**9.2**\n\n**How can we keep track of values?**\n\nSpeaking of variables, we\
    \ need a way to keep track of their current values; we say \"current\" because\n\
    \nthe value of a loop variable changes each time we go around the loop. We also\
    \ need to maintain\n\nmultiple sets of variables so that variables used inside\
    \ a loop don’t conﬂict with ones used outside it.\n\n(We don’t actually \"need\"\
    \ to do this—we could just have one global set of variables—but experience\n\n\
    teaches us that if all our variables are global, all of our programs will be buggy.)\n\
    \nThe standard way to manage variables is to create a stack of lookup tables.\
    \ Each **stack frame**\n\nis an object with names and values; when we need to\
    \ ﬁnd a variable, we look through the stack\n\nframes in order to ﬁnd the uppermost\
    \ deﬁnition of that variable..\n\n5https://developer.mozilla.org/en-US/docs/Learn/HTML/Howto/Use_data_attributes"
