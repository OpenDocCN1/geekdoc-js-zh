    **client:** A program such as a web browser that gets data from a **server** and
    displays it to, or


    interacts with, users. The term is used more generally to refer to any program
    A that makes


    requests of another program B. A single program can be both a client and a server.


    **closure:** A set of variables deﬁned in the same **scope** whose existence has
    been preserved after


    that scope has ended.


    **code coverage (in testing):** How much of a **library** or program is executed
    when tests run. This


    is normally reported as a percentage of lines of code.


    **cognitive load:** The amount of working memory needed to accomplish a set of
    simultaneous tasks.


    **collision:** A situation in which a program tries to store two items in the
    same location in memory.


    For example, a collision occurs when a **hash function** generates the same **hash
    code** for two


    diﬀerent items.


    **column-major storage:** Storing each column of a two-dimensional array as one
    block of memory


    so that elements in the same row are far apart. See also: **row-major storage**.


    **combinatorial explosion:** The exponential growth in the size of a problem or
    the time required


    to solve it that arises when all possible combinations of a set of items must
    be searched.


    **comma-separated values (CSV):** A text format for tabular data in which each
    **record** is one


    row and **ﬁelds** are separated by commas. There are many minor variations, particularly
    around


    quoting of **strings**.


    **command-line argument:** A ﬁlename or control ﬂag given to a command-line program
    when it


    is run.


    **command-line interface (CLI):** A user interface that relies solely on text
    for commands and


    output, typically running in a **shell**.


    **comment:** Text written in a script that is not treated as code to be run, but
    rather as text that


    describes what the code is doing. These are usually short notes, often beginning
    with a `#` (in


    many programming languages).


    **compile:** To translate textual source into another form. Programs in **compiled
    languages** are


    translated into machine instructions for a computer to run, and **Markdown** is
    usually translated


    into **HTML** for display.


    **compiled language:** Originally, a language such as C or Fortran that is translated
    into machine


    instructions for execution. Languages such as Java are also compiled before execution,
    but into


    **byte code** instead of machine instructions, while **interpreted languages**
    like JavaScript are


    compiled to byte code on the ﬂy.'
