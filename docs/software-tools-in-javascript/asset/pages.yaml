    **7.4**


    **Exercises**


    **Split once**


    Modify the query selector code so that selectors like `div#id` and `div.class`
    are only split into


    pieces once rather than being re-split each time `matchHere` is called.


    **Find and ﬁx the error**


    The ﬁrst regular expression matcher contains an error: the pattern `''``a*ab``''`
    should match the string


    `''``aab``''` but doesn’t. Figure out why it fails and ﬁx it.


    **Unit tests**


    Rewrite the tests for selectors and regular expressions to use Mocha.


    **Find all with query selectors**


    Modify the query selector so that it returns *all* matches, not just the ﬁrst
    one.


    **Select based on attributes**


    Modify the query selector to handle `[attribute="value"]` selectors, so that (for
    example)


    `div[align=center]` returns all `div` elements whose `align` attribute has the
    value `"center"`.


    **Child selectors**


    The expression `parent > child` selects all nodes of type `child` that are immediate
    children of


    nodes of type `parent`—for example, `div > p` selects all paragraphs that are
    immediate children of


    `div` elements. Modify `simple-selectors.js` to handle this kind of matching.


    **Find all with regular expressions**


    Modify the regular expression matcher to return *all* matches rather than just
    the ﬁrst one.


    **Find one or more with regular expressions**


    Extend the regular expression matcher to support `+`, meaning "one or more".


    **Match sets of characters**


    Add a new regular expression matching class that matches any character from a
    set, so that


    `Charset(``''``aeiou``''``)` matches any lower-case vowel.'
