  md: '**2**


    *Systems Programming*


    ***Using callbacks to manipulate ﬁles and directories***


    **Terms deﬁned: Boolean**, **anonymous function**, **asynchronous**, **callback
    function**, **cog-**


    **nitive load**, **command-line argument**, **console**, **current working directory**,
    **destructur-**


    **ing assignment**, **edge case**, **ﬁlesystem**, **ﬁlter**, **globbing**, **idiomatic**,
    **log message**, **path (in**


    **ﬁlesystem)**, **protocol**, **scope**, **single-threaded**, **string interpolation**


    The biggest diﬀerence between JavaScript and most other programming languages
    is that many


    operations in JavaScript are **asynchronous**. Its designers didn’t want browsers
    to freeze while


    waiting for data to arrive or for users to click on things, so operations that
    might be slow are


    implemented by describing now what to do later. And since anything that touches
    the hard drive


    is slow from a processor’s point of view, Node¹implements **ﬁlesystem** operations
    the same way.


    **How slow is slow?**


    [Gregg2020] used the analogy in Table 2.1 to show how long it takes a computer
    to do diﬀerent


    things if we imagine that one CPU cycle is equivalent to one second.


    Early JavaScript programs used **callback functions** to describe asynchronous
    operations, but


    as we’re about to see, callbacks can be hard to understand even in small programs.
    In 2015, the


    language’s developers standardized a higher-level tool called promises to make
    callbacks easier to


    manage, and more recently they have added new keywords called `async` and `await`
    to make it


    easier still. We need to understand all three layers in order to debug things
    when they go wrong,


    so this chapter explores callbacks, while Chapter 3 shows how promises and `async`/`await`
    work.


    **Operation**


    **Actual Time**


    **Would Be...**


    1 CPU cycle


    0.3 nsec


    1 sec


    Main memory access


    120 nsec


    6 min


    Solid-state disk I/O


    50-150 µsec


    2-6 days


    Rotational disk I/O


    1-10 msec


    1-12 months


    Internet: San Francisco to New York


    40 msec


    4 years


    Internet: San Francisco to Australia


    183 msec


    19 years


    Physical system reboot


    5 min


    32,000 years


    Table 2.1: Computer operation times at human scale.


