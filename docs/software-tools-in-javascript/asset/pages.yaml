    **version control system**


    Now that we can test software we have something worth saving. A **version control
    system**


    like Git¹keeps track of changes to ﬁles so that we can recover old versions if
    we want to. Its heart


    is a way to archive ﬁles that:


    1\. records which versions of which ﬁles existed at the same time (so that we
    can go back to a


    consistent previous state), and


    2\. stores any particular version of a ﬁle only once, so that we don’t waste disk
    space.


    In this chapter we will build a tool for doing both tasks. It won’t do everything
    Git does: in


    particular, it won’t let us create and merge branches. If you would like to know
    how that works,


    please see Mary Rose Cook’s²excellent Gitlet³project.


    **5.1**


    **How can we uniquely identify ﬁles?**


    To avoid storing redundant copies of ﬁles, we need a way to tell when two ﬁles
    contain the same


    data. We can’t rely on names because ﬁles can be renamed or moved over time; we
    could compare


    the ﬁles byte by byte, but a quicker way is to use a **hash function** that turns
    arbitrary data into


    a ﬁxed-length string of bits (Figure 5.1).


    A hash function always produces the same **hash code** for a given input. A **cryptographic**


    **hash function** has two extra properties:


    1\. The output depends on the entire input: changing even a single byte results
    in a diﬀerent hash


    code.


    2\. The outputs look like random numbers: they are unpredictable and evenly distributed
    (i.e., the


    odds of getting any speciﬁc hash code are the same)


