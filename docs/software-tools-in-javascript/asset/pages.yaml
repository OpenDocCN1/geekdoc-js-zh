    **side eﬀect:** A change made by a function while it runs that is visible after
    the function ﬁnishes,


    such as modifying a **global variable** or writing to a ﬁle. Side eﬀects make
    programs harder


    for people to understand, since the eﬀects are not necessarily clear at the point
    in the program


    where the function is called.


    **signature:** The set of parameters (with types or meaning) that characterize
    the calling interface


    of a function or set of functions. Two functions with the same signature can be
    called inter-


    changeably.


    **single-threaded:** A model of program execution in which only one thing can
    happen at a time.


    Single-threaded execution is easier for people to understand, but less eﬃcient
    than **multi-**


    **threaded** execution.


    **singleton:** A set with only one element, or a **class** with only one **instance**.
    See also: **Singleton**


    **pattern**.


    **Singleton pattern:** A **design pattern** that creates a **singleton object**
    to manage some resource


    or service, such as a database or **cache**. In **object-oriented programming**,
    the pattern is


    usually implemented by hiding the **constructor** of the **class** in some way
    so that it can only


    be called once.


    **slug:** An abbreviated portion of a page’s URL that uniquely identiﬁes it. In
    the example


    `https://www.mysite.com/category/post-name`, the slug is `post-name`.


    **source map:** A table used to translate a piece of code back to the lines in
    the original source.


    **sparse matrix:** A matrix in which most of the values are zero (or some other
    value). Rather than


    storing many copies of the same values, programs will often use a special data
    structure that


    only stores the "interesting" values.


    **SQL:** The language used for writing queries for a **relational database**.
    The term was originally


    an acronym for Structured Query Language.


    **stack frame:** A section of the **call stack** that records details of a single
    call to a speciﬁc function.


    **stale (in build):** To be out-of-date compared to a **prerequisite**. A **build
    manager**’s job is to


    ﬁnd and update things that are stale.


    **standard error:** A predeﬁned communication channel for a **process** typically
    used to report er-


    rors. See also: **standard input**, **standard output**.


    **standard input:** A predeﬁned communication channel for a **process**, typically
    used to read input


    from the keyboard or from the previous process in a **pipe**. See also: **standard
    error**, **standard**


    **output**.


    **standard output:** A predeﬁned communication channel for a **process**, typically
    used to send


    output to the screen or to the next process in a **pipe**. See also: **standard
    error**, **standard**


    **input**.


    **static site generator:** A software tool that creates HTML pages from templates
    and content.'
