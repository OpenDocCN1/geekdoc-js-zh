  md: "38\n\n*3 Asynchronous Programming*\n\n**Character encoding**\n\nA **character\
    \ encoding** speciﬁes how characters are stored as bytes. The most widely used\n\
    \nis **UTF-8**, which stores characters common in Western European languages in\
    \ a single byte\n\nand uses multi-byte sequences for other symbols. If we don’t\
    \ specify a character encoding,\n\n`fs.readFileAsync` gives us an array of bytes\
    \ rather than a string of characters. We can tell\n\nwe’ve made this mistake when\
    \ we try to call a method of `String` and Node tells us we can’t.\n\nThe next\
    \ step is to count the lines in multiple ﬁles. We can use `glob-promise` to delay\
    \ handling\n\nthe output of `glob`, but we need some way to create a separate\
    \ task to count the lines in each ﬁle\n\nand to wait until those line counts are\
    \ available before exiting our program.\n\nThe tool we want is `Promise.all`,\
    \ which waits until all of the promises in an array have com-\n\npleted. To make\
    \ our program a little more readable, we will put the creation of the promise\
    \ for each\n\nﬁle in a separate function:\n\n\a\n\n\x04\n\n`import`\n\n`glob from`\
    \ `'``glob -promise` `'`\n\n`import fs from` `'``fs -extra -promise` `'`\n\n`const`\n\
    \n`main = (srcDir) => {`\n\n`glob(``` ` ```${srcDir }/**/*.*` `` ` ```)`\n\n`.then(files\
    \ => Promise.all(files.map(f => lineCount(f))))`\n\n`.then(counts => counts.forEach(c\
