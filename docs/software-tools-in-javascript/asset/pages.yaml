    \n`const`\n\n`filePath = path.join(fileDir , filename)`\n\n`if (!fs.existsSync(filePath\
    \ )) {`\n\n`throw new Error(``` ` ```Cannot`\n\n`find ${filePath }``` ` ```)`\n\
    \n`}`\n\n`const`\n\n`inner = fs.readFileSync(filePath ,` `'``utf -8``'``)`\n\n\
