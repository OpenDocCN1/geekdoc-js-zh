  md: '**4**


    *Unit Testing*


    ***Testing software piece by piece***


    **Terms deﬁned: Singleton pattern**, **actual result (of test)**, **assertion**,
    **caching**, **defensive**


    **programming**, **design pattern**, **dynamic loading**, **error (in a test)**,
    **exception handler**,


    **expected result (of test)**, **exploratory programming**, **fail (a test)**,
    **ﬁxture**, **global vari-**


    **able**, **introspection**, **lifecycle**, **pass (a test)**, **side eﬀect**,
    **test runner**, **test subject**, **throw**


    **(exception)**, **unit test**


    We have written many small programs in the previous two chapters, but haven’t
    really tested


    any of them. That’s OK for **exploratory programming**, but if our software is
    going to be used


    instead of just read, we should try to make sure it works.


    A tool for writing and running **unit tests** is a good ﬁrst step. Such a tool
    should:


    • ﬁnd ﬁles containing tests;


    • ﬁnd the tests in those ﬁles;


    • run the tests;


    • capture their results; and


    • report each test’s result and a summary of those results.


    Our design is inspired by tools like Mocha¹and Jest², which were in turn inspired
    by tools built


    for other languages from the 1980s onward [Meszaros2007, Tudose2020].


    **4.1**


    **How should we structure unit testing?**


    As in other unit testing frameworks, each test will be a function of zero arguments
    so that the


    framework can run them all in the same way. Each test will create a **ﬁxture**
    to be tested and


    use **assertions** to compare the **actual result** against the **expected result**.
    The outcome can be


    exactly one of:


    • **Pass**: the **test subject** works as expected.


    • **Fail**: something is wrong with the test subject.


    1https://mochajs.org/


    2https://jestjs.io/


