    **directed acyclic graph**, **driver**, **interpreted language**, **link (a program)**,
    **pattern rule**,


    **runnable documentation**, **stale (in build)**, **topological order**


    Suppose we are using a page templating system to create a website (Chapter 9).
    If we a change


    a single page our tool should translate it, but shouldn’t waste time translating
    others. If we change


    a template, on the other hand, the tool should realize that every page in the
    site is potentially


    aﬀected and automatically re-translate all of them.


    Choosing what actions to take based on how ﬁles depend on one another is a common
    pattern.


    For example, programs in **compiled languages** like C and Java have to be translated
    into lower-


    level forms before they can run. In fact, there are usually two stages to the
    translation: compiling


    each source ﬁle into some intermediate form, and then **linking** the compiled
    modules to each other


    and to libraries to create a runnable program (Figure 10.1). If a source ﬁle hasn’t
    changed, there’s


    no need to recompile it before linking.


    A **build manager** takes a description of what depends on what, ﬁgures out which
    ﬁles are


    out of date, determines an order in which to rebuild things, and then executes
    any necessary steps.


    Originally created to manage compilation, they are also useful for programs written
    in **interpreted**


    **languages** like JavaScript when we want to bundle multiple modules into a single
    loadable ﬁle


    (Chapter 17) or re-create documentation from source code (Chapter 16). In this
    chapter we will


