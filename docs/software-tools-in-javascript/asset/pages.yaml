  md: "210\n\n*12 File Interpolator*\n\n\a\n\n\x04\n\n`class`\n\n`Example {`\n\n`constructor\
    \ (name) {`\n\n`this.name = name`\n\n`}`\n\n`// <fragment >`\n\n`fragment (message)\
    \ {`\n\n`console.log(``` ` ```${name }: ${message }``` ` ```)`\n\n`}`\n\n`//`\n\
    \n`</fragment >`\n\n`}`\n\n\x06\n\n\x05\n\nThe code that selects the part of the\
    \ ﬁle we want to display is part of our page templating\n\nsystem. It re-extracts\
    \ code for display every time the web version of this site is built, which ensures\n\
    \nthat we always shows what’s in the current version of our examples. However,\
    \ this system doesn’t\n\nautomatically update the description of the code: if\
    \ we write, \"It does X,\" then modify the code\n\nto do Y, our lesson can be\
    \ inconsistent. **Literate programming** was invented to try to prevent\n\nthis\
    \ from happening, but it never really caught on—unfortunately, most programming\
    \ systems that\n\ndescribe themselves as \"literate\" these days only implement\
    \ part of Donald Knuth’s³original vision.\n\n**12.6**\n\n**Exercises**\n\n**Security\
    \ concerns**\n\n1\\. Write a function `loadAndRun` that reads a ﬁle, evaluates\
