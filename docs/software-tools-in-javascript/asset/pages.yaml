    **20.5**


    **Exercises**


    **Implementing tab completion**


    Read the documentation for `prompt-sync`⁴and then implement **tab completion**
    for the debugger.


    **Modifying variables while running**


    Add a `set` command that sets the value of a variable to a new value in a running
    program. How


    do you handle setting array elements?


    **Making output more readable**


    Modify the tracing debugger so that the statements inside loops and conditionals
    are indented for


    easier reading.


    **Better loops**


    Our solution for handling loops is sloppy; ﬁx it.


    **Using a ﬂag to continue execution**


    Modify the debugger and virtual machine to use a "continue executing" ﬂag rather
    than throwing


    an exception when execution should end. Which approach is easier to understand?
    Which will be


    easier to extend in future?


    **Numbering lines**


    Write a tool that takes a JSON program representation *without* statement numbers
    and produces


    one that numbers all of the interesting statements for debugging purposes. Use
    whatever deﬁnition


    of "interesting" you think would be most useful.


    **Looping around again**


    Implement a "next loop iteration" command that runs the program until it reaches
    the current


    point in the next iteration of the current loop.


    **Looking up objects**


    Rather than having some objects call `setXYZ` methods in other objects, it is
    common practice to


    use a lookup table for mutual dependencies:


    1\. Every object initializes calls `table.set(name, this)` in its constructor.


