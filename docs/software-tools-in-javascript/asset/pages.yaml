    \ = /\\/\\*\\+(.+?)\\+(.+?)\\+\\*\\// g`\n\n\x06\n\n\x05\n\nListing 12.31: caching.js\n\
    \nWe can now have a ﬁle like this:\n\n\a\n\n\x04\n\n`class`\n\n`Example {`\n\n\
