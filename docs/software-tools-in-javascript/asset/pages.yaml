    *E Glossary*


    **relative path:** A path that is interpreted relative to some other location,
    such as the **current**


    **working directory**. A relative path is the equivalent of giving directions
    using terms like


    "straight" and "left". See also: **absolute path**.


    **root (in a tree):** The **node** in a **tree** of which all other nodes are
    direct or indirect **children**, or


    equivalently the only node in the tree that has no **parent**.


    **row-major storage:** Storing each row of a two-dimensional array as one block
    of memory so that


    elements in the same column are far apart. See also: **column-major storage**.


    **runnable documentation:** Statements about code that can be executed to check
    their correct-


    ness, such as **assertions** or **type declarations**.


    **sandbox:** A testing environment that is separate from the production system,
    or an environment


    that is only allowed to perform a restricted set of operations for security reasons.


    **SAT solver:** A library or application that determines whether there is an assignment
    of true


    and false to a set of **Boolean** variables that makes an expression true (i.e.,
    that satisﬁes the


    expression).


    **schema:** A speciﬁcation of the format of a dataset, including the name, format,
    and content of


    each **table**.


    **scope:** The portion of a program within which a deﬁnition can be seen and used.
    See also: **closure**,


    **global variable**, **local variable**, **namespace**.


    **scope creep:** Slow but steady increase in a project’s goals after the project
    starts.


    **scoring function:** A function that measures or estimates how good a solution
    to a problem is.


    **search path:** The list of directories that a program searches to ﬁnd something.
    For example, the


    Unix **shell** uses the search path stored in the `PATH` variable when trying
    to ﬁnd a program whose


    name it has been given.


    **seed:** A value used to initialize a **pseudo-random number generator**.


    **semantic versioning:** A standard for identifying software releases. In the
    version identiﬁer


    `major.minor.patch`, `major` changes when a new version of software is incompatible
    with old


    versions, `minor` changes when new features are added to an existing version,
    and `patch` changes


    when small **bugs** are ﬁxed.


    **server:** Typically, a program such as a database manager or web server that
    provides data to a


    **client** upon request.


    **SHA-1 hash:** A **cryptographic hash function** that produces a 160-bit output.


    **shell:** A **command-line interface** that allows a user to interact with the
    **operating system**,


    such as Bash (for Unix and MacOS) or PowerShell (for Windows).


    **shell variable:** A variable set and used in the **Unix shell**. Commonly-used
    shell variables include


    `HOME` (the user’s home directory) and `PATH` (their **search path**).'
