    The most important thing about this design is how extensible it is: if we want\
    \ to add other\n\nkinds of matching, all we have to do is add more classes. That\
    \ extensibility comes from the lack of\n\ncentralized decision-making, which in\
    \ turn comes from our use of polymorphism and the **Chain of**\n\n**Responsibility**\
    \ design pattern. Each component does its part and asks something else to handle\n\
    \nthe remaining work; so long as each component takes the same inputs, we can\
    \ put them together\n\nhowever we want.\n\n**The Open-Closed Principle**\n\nThe\
    \ **Open-Closed Principle** states that software should be open for extension\
    \ but closed for\n\nmodiﬁcation, i.e., that it should be possible to extend functionality\
    \ without having to rewrite\n\nexisting code. As we said in Chapter 3, this allows\
    \ old code to use new code, but only if\n\nour design permits the kinds of extensions\
    \ people are going to want to make. Since we can’t\n\nanticipate everything, it\
    \ is normal to have to revise a design the ﬁrst two or three times we\n\ntry to\
    \ extend it. As [Brand1995] said of buildings, the things we make learn how to\
    \ do things\n\nbetter as we use them."
