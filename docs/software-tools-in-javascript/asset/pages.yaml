    *1 Introduction*


    Like these three personas, readers should be able to:


    • Write JavaScript programs using loops, arrays, functions, and classes.


    • Create static web pages using HTML and CSS.


    • Install Node on their computer and run programs with it from the command line.


    • Use Git⁷to save and share ﬁles. (It’s OK not to know the more obscure commands⁸.)


    • Explain what a tree is and how to process one recursively. (This is the most
    complicated data


    structure and algorithm we *don’t* explain.)


    This book can be read on its own or as a companion to *Building Software Together*⁹,
    which is a


    guide for students who are about to embark on their ﬁrst large software project
    in a team. If you


    are looking for a project to do in a course, adding a tool to those covered here
    would be fun as well


    as educational. Please see Chapter 21 for more details.


    **1.2**


    **What tools and ideas do we cover?**


    Programmers have invented a lot of tools^(10)to make their lives easier. This
    volume focuses on a few


    that individual developers use while writing software; we hope future volumes
    will explore those


    used in the applications that programmers build.


    Appendix E deﬁnes the terms we introduce in these lessons, which in turn deﬁne
    the scope of


    our lessons:


    • How to process a program like any other piece of text.


    • How to turn a program into a data structure that can be analyzed and modiﬁed.


