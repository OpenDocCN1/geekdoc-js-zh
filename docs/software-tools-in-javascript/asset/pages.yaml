    \ , () => vm.run ())`\n\n`}`\n\n\x06\n\n\x05\n\nListing 20.22: test/test-expect.js\n\
    \nLet’s try running our tests:\n\n\a\n\n\x04\n\n`npm run test -- -g` `'``interactive`\n\
    \n`debugger` `'`\n\n\x06\n\n\x05\n\nListing 20.23: test-expect.sh\n\n\a\n\n\x04\
    \n\n`> stjs@1 .0.0 test /u/stjs`\n\n`> mocha */ test/test -*.js \"-g\" \"interactive`\n\
    \n`debugger\"`\n\n`interactive`\n\n`debugger`\n\n✓`runs and prints`\n\n\x06\n\n\
    \x05\n\nListing 20.24: test-expect.out\n\nThat works—or does it? Why is only one\
    \ test shown, and doesn’t the summary appear? After\n\na bit of digging, we realize\
    \ that the debugger’s `exit` command calls `process.exit` when the simu-\n\nlated\
    \ program ends, so the whole program including the VM, debugger, and test framework\
    \ stops\n\nimmediately *before* the promises that contain the tests have run.\n\
    \nWe could ﬁx this by modifying the debugger callback to return an indication\
    \ of whether or\n\nnot execution should continue, then modify the VM to pay attention\
    \ to that ﬂag. However, this\n\napproach becomes very complicated when we have\
    \ deeply-nested calls to `exec`, which will happen\n\nwith loops and conditionals.\n\
    \nA better alternative is to use an exception for control ﬂow. We can deﬁne our\
    \ own kind of\n\nexception as an empty class: it doesn’t need any data because\
    \ we are only using it to get a typed\n\nobject:\n\n\a\n\n\x04\n\n`class`\n\n\
    `HaltException {`\n\n`}`\n\n`export`\n\n`default`\n\n`HaltException`\n\n\x06\n\
    \n\x05\n\nListing 20.25: halt-exception.js\n\nNext, we modify the debugger to\
    \ throw this exception when asked to exit:\n\n\a\n\n\x04\n\n`import`\n\n`HaltException`\n\
    \n`from`\n\n`'``./halt -exception.js` `'`\n\n`import`\n\n`DebuggerTest`\n\n`from`\n\
    \n`'``./debugger -test.js` `'`\n\n`class`\n\n`DebuggerExit`\n\n`extends`\n\n`DebuggerTest\
    \ {`\n\n`exit (env , lineNum , op , args) {`\n\n`throw new`\n\n`HaltException\
    \ ()`"
