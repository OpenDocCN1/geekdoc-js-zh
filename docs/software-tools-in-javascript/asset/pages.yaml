    \n\n\x05\n\nListing 16.30: ﬁll-in-headers.html\n\n**Code is data**\n\nWe haven’t\
    \ made this point explicitly in a while, so we will repeat it here: code is just\
    \ another\n\nkind of data, and we can process it just like we would process any\
    \ other data. Parsing code\n\nto produce an AST is no diﬀerent from parsing HTML\
    \ to produce DOM; in both cases we\n\nare simply transforming a textual representation\
    \ that’s easy for people to author into a data\n\nstructure that’s easy for a\
    \ program to manipulate. Pulling things out of that data to create\n\na report\
    \ is no diﬀerent from pulling numbers out of a hospital database to report monthly\n\
    \nvaccination rates.\n\nTreating code as data enables us to do routine programming\
    \ tasks with a single command,\n\nwhich in turn gives us more time to think about\
    \ the tasks that we can’t (yet) automate. Doing\n\nthis is the foundation of a\
    \ tool-based approach to software engineering; as the mathemati-\n\ncian Alfred\
    \ North Whitehead once wrote, \"Civilization advances by extending the number\
    \ of\n\nimportant operations which we can perform without thinking about them.\"\
    \n\n**16.4**\n\n**Exercises**\n\n**Building an index**\n\nModify the documentation\
    \ generator to produce an alphabetical index of all classes and methods\n\nfound.\
    \ Index entries should be hyperlinks to the documentation for the corresponding\
    \ item."
