    \nmajor\n\nFigure 13.3: Testing circular imports.\n\n*acyclic* graphs we met in\
    \ Chapter 10, though, these graphs can contain cycles: we say a **circular**\n\
    \n**dependency** exists if X depends on Y and Y depends on X either directly or\
    \ indirectly. This may\n\nseem nonsensical, but can easily arise with **plugin\
    \ architectures**: the ﬁle containing the main\n\nprogram loads an extension,\
    \ and that extension calls utility functions deﬁned in the ﬁle containing\n\n\
    the main program.\n\nMost compiled languages can handle circular dependencies\
    \ easily: they compile each module into\n\nlow-level instructions, then link those\
    \ to resolve dependencies before running anything (Figure 13.3).\n\nBut interpreted\
    \ languages usually run code as they’re loading it, so if X is in the process\
    \ of loading\n\nY and Y tries to call X, X may not (fully) exist yet.\n\nCircular\
    \ dependencies work in Python¹, but only sort of. Let’s create two ﬁles called\
    \ `major.py`\n\nand `minor.py`:\n\n\a\n\n\x04\n\n`# major.py`\n\n`import`\n\n\
