    \ the parameter `suffix` still exists but can only be\n\nreached by the inner\
    \ function:\n\n\a\n\n\x04\n\n`this and that`\n\n`/u/stjs/module -loader/manual\
    \ -namespacing.js:10`\n\n`console.log(``'``suffix is` `'``, suffix)`\n\n`^`\n\n\
    `ReferenceError : suffix is not`\n\n`defined`\n\n`at /u/stjs/module -loader/manual\
    \ -namespacing.js :10:26`\n\n`at ModuleJob.run (internal/modules/esm/module_job.js\
    \ :152:23)`\n\n`at async`\n\n`Loader.import (internal/modules/esm/loader.js :166:24)`\n\
    \n`at async`\n\n`Object.loadESM (internal/process/esm_loader.js :68:5)`\n\n\x06\
    \n\n\x05\n\nListing 13.2: manual-namespacing.out\n\nWe could require every module\
    \ to deﬁne a setup function like this for users to call, but thanks\n\nto `eval`\
    \ we can wrap the ﬁle’s contents in a function and call it automatically. To do\
    \ this we will\n\ncreate something called an **immediately-invoked function expression**\
    \ (IIFE). The syntax `()`\n\n`=> {...}` deﬁnes a function. If we put the deﬁnition\
    \ in parentheses and then put another pair of\n\nparentheses right after it:\n\
    \n\a\n\n\x04\n\n`(() => {...})()`\n\n\x06\n\n\x05\n\nwe have code that deﬁnes\
    \ a function of no arguments and immediately calls it. We can use this\n\ntrick\
    \ to achieve the same eﬀect as the previous example in one step:\n\n\a\n\n\x04\
    \n\n`const`\n\n`contents = (() => {`\n\n`const`\n\n`privateValue =` `'``private\
    \ value` `'`\n\n`const`\n\n`publicValue =` `'``public value` `'`\n\n`return {\
