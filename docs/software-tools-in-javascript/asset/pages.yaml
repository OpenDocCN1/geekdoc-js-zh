  md: '**14**


    *Style Checker*


    ***Checking that code conforms to style guidelines***


    **Terms deﬁned: Adapter pattern**, **Iterator pattern**, **Markdown**, **abstract
    syntax tree**,


    **dynamic lookup**, **generator function**, **intrinsic complexity**, **linter**,
    **walk (a tree)**


    Programmers argue endlessly about the best way to format their programs, but everyone
    agrees


    that the most important thing is to be consistent [Binkley2012, Johnson2019].
    Since checking rules


    by hand is tedious, most programmers use tools to compare code against various
    rules and report


    any violations. Programs that do this are often called **linters** in honor of
    an early one for C named


    `lint` (because it looked for ﬂuﬀin source code).


    In this chapter we will build a simple linter of our own inspired by ESLint¹,
    which we use to


    check the code in this book. Our tool will parse source code to create a data
    structure, then go


    through that data structure and apply rules for each part of the program. It will
    also introduce us


    to one of the key ideas of this book, which is that source code is just another
    kind of data.


    **Don’t deﬁne your own style**


    Just as the world doesn’t need more ﬁle format (Chapter 8) it also doesn’t need
    more program-


    ming styles, or more arguments among programmers about whether there should be
    spaces


    before curly braces or not. Standard JS²may not do everything exactly the way
    you want,


    but adopting it increases the odds that other programmers will be able to read
    your code at


    ﬁrst glance.


    **14.1**


    **How can we parse JavaScript to create an AST?**


    A parser for a simple language like arithmetic or JSON is relatively easy to write.
    A parser for a


    language as complex as JavaScript is much more work, so we will use one called
    Acorn³instead.


    Acorn takes a string containing source code as input and produces an **abstract
    syntax tree** (AST)


    whose nodes store information about what’s in the program (Figure 14.1). An AST
    is for a program


    what the DOM is for HTML: an in-memory representation that is easy for software
    to inspect and


    manipulate.


    1https://eslint.org/


    2https://standardjs.com/


    3https://github.com/acornjs/acorn


    229'
