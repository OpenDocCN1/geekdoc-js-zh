  md: "**17**\n\n*Module Bundler*\n\n***Turning many ﬁles into one***\n\n**Terms deﬁned:\
    \ entry point**, **module bundler**, **transitive closure**\n\nJavaScript was\
    \ designed in a hurry 25 years ago to make web pages interactive. Nobody realized\n\
    \nit would become one of the most popular programming languages in the world,\
    \ so it didn’t include\n\nsupport for things that large programs need. One of\
    \ those things was a way to turn a set of easy-\n\nto-edit source ﬁles into a\
    \ single easy-to-load ﬁle so that browsers could get what they needed with\n\n\
    one request.\n\nA **module bundler** ﬁnds all the ﬁles that an application depends\
    \ on and combines them into\n\na single loadable ﬁle (Figure 17.1). This ﬁle is\
    \ much more eﬃcient to load: it’s the same number\n\nof bytes but just one network\
    \ request. (See Table 2.1 for a reminder of why this is important.)\n\nBundling\
    \ ﬁles also tests that dependencies actually resolve so that the application has\
    \ at least a\n\nchance of being able to run.\n\nBundling requires an **entry point**,\
    \ i.e., a place to start searching for dependencies. Given that,\n\nit ﬁnds all\
    \ dependencies, combines them into one ﬁle, and ensures they can ﬁnd each other\
    \ correctly\n\nonce loaded. The sections below go through these steps one by one.\n\
    \n**17.1**\n\n**What will we use as test cases?**\n\nThe simplest test case is\
    \ a single ﬁle that doesn’t require anything else: if this doesn’t work, nothing\n\
    \nwill. Our test case and the expected output are:\n\n\a\n\n\x04\n\n`const`\n\n\
    `main = () => {`\n\n`console.log(``'``in main` `'``)`\n\n`}`\n\n`module.exports\
    \ = main`\n\n\x06\n\n\x05\n\nListing 17.1: single/main.js\n\n\a\n\n\x04\n\n`in\
    \ main`\n\n\x06\n\n\x05\n\nListing 17.2: expected-single.out\n\nIn our second\
    \ test case, `main.js` requires `other.js`, which doesn’t require anything. The\
    \ main\n\nﬁle is:\n\n279"
