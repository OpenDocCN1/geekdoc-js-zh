  md: "*10.2 Where should we start?*\n\n153\n\n**Topological order**\n\nA **topological\
    \ ordering** of a graph arranges the nodes so that every node comes after every-\n\
    \nthing it depends on. For example, if A depends on both B and C, then (B, C,\
    \ A) and (C, B,\n\nA) are both valid topological orders of the graph.\n\n**10.2**\n\
    \n**Where should we start?**\n\nWe will store our rules in YAML ﬁles like this:\n\
    \n\a\n\n\x04\n\n`- target: A`\n\n`depends:`\n\n`- B`\n\n`- C`\n\n`recipes:`\n\n\
    `- \"update A from B and C\"`\n\n`- target: B`\n\n`depends:`\n\n`- C`\n\n`recipes:`\n\
    \n`- \"update B from C\"`\n\n`- target: C`\n\n`depends: []`\n\n`recipes: []`\n\
    \n\x06\n\n\x05\n\nListing 10.1: three-simple-rules.yml\n\nWe could equally well\
    \ have used JSON, but it wouldn’t have made sense to use CSV: rules have a\n\n\
    nested structure, and CSV doesn’t represent nesting particularly gracefully.\n\
    \nWe are going to create our build manager in stages, so we start by writing a\
    \ simple **driver** that\n\nloads a JavaScript source ﬁle, creates an object of\
    \ whatever class that ﬁle exports, and runs the\n\n`.build` method of that object\
    \ with the rest of the command-line parameters:\n\n\a\n\n\x04\n\n`const`\n\n`main\
    \ = async () => {`\n\n`const`\n\n`BuilderClass = (await`\n\n`import(process.argv\
    \ [2])). default`\n\n`const`\n\n`builder = new`\n\n`BuilderClass (... process.argv.slice\
    \ (3))`\n\n`try {`\n\n`builder.build ()`\n\n`} catch (err) {`\n\n`console.error(``'``Build`\n\
    \n`failed:``'``, err)`\n\n`}`\n\n`}`\n\n`main ()`"
