  md: "42\n\n*3 Asynchronous Programming*\n\n`result.then(value => console.log(```\
    \ ` ```outside , final`\n\n`result is \"${value }\"``` ` ```))`\n\n\x06\n\n\x05\
    \n\nListing 3.34: await-fs.js\n\n\a\n\n\x04\n\n`about to call`\n\n`function`\n\
    \n`result has type`\n\n`Promise`\n\n`inside , raw text is 24 characters`\n\n`long`\n\
    \n`outside , final`\n\n`result is \"Begin at t\"`\n\n\x06\n\n\x05\n\nListing 3.35:\
    \ await-fs.out\n\n**Translating code**\n\nWhen Node sees `await` and `async` it\
    \ silently converts the code to use promises with `then`,\n\n`resolve`, and `reject`;\
    \ we will see how this works in Chapter 15\\. In order to provide a context\n\n\
    for this transformation we must put `await` inside a function that is declared\
    \ to be `async`:\n\nwe can’t simply write `await fs.statAsync(...)` at the top\
    \ level of our program outside a\n\nfunction. This requirement is occasionally\
    \ annoying, but since we should be putting our code\n\nin functions anyway it’s\
    \ hard to complain.\n\nTo see how much cleaner our code is with `await` and `async`,\
    \ let’s rewrite our line counting\n\nprogram to use them. First, we modify the\
    \ two helper functions to look like they’re waiting for\n\nresults and returning\
    \ them. They actually wrap their results in promises and return those, but\n\n\
    Node now takes care of that for us:\n\n\a\n\n\x04\n\n`const`\n\n`statPair = async\
    \ (filename) => {`\n\n`const`\n\n`stats = await fs.statAsync(filename)`\n\n`return\
    \ { filename , stats }`\n\n`}`\n\n`const`\n\n`lineCount = async (filename) =>\
    \ {`\n\n`const`\n\n`data = await fs.readFileAsync (filename ,` `'``utf -8``'``)`\n\
