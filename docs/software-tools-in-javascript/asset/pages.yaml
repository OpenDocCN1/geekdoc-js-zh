    \n**12.3**\n\n**How can we ﬁnd ﬁles?**\n\nEach of the ﬁles included in our examples\
    \ is in the same directory as the ﬁle including it, but in\n\nC/C++ or a page\
    \ templating system we might include a particular ﬁle in several diﬀerent places.\n\
    \nWe don’t want to have to put all of our ﬁles in a single directory, so we need\
    \ a way specify where\n\nto look for ﬁles that are being included.\n\nOne option\
    \ is to use relative paths, but another option is to give our program a list of\
