    \n`Expect`\n\n`from`\n\n`'``../ expect.js` `'`\n\n`import VM from`\n\n`'``../vm\
    \ -interactive.js` `'`\n\n`import`\n\n`Debugger`\n\n`from`\n\n`'``../ debugger\
