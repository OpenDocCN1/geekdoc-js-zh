    *File Backup*


    ***Archiving ﬁles with directory structure***


    **Terms deﬁned: Application Programming Interface**, **Coordinated Universal Time**,


    **JavaScript Object Notation**, **SHA-1 hash**, **Time of check/time of use**,
    **collision**, **comma-**


