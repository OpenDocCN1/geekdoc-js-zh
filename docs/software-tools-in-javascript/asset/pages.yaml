    *Build Manager*


    ***Updating ﬁles that depend on other ﬁles***


    **Terms deﬁned: Template Method pattern**, **automatic variable**, **build manager**,
    **build**


    **recipe**, **build rule**, **build target**, **compiled language**, **cycle (in
