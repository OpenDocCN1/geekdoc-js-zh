    *Glossary*


    **absolute error:** The absolute value of the diﬀerence between the observed and
    the correct value.


    Absolute error is usually less useful than **relative error**.


    **absolute path:** A path that points to the same location in the **ﬁlesystem**
    regardless of where it


    is evaluated. An absolute path is the equivalent of latitude and longitude in
    geography. See also:


    **relative path**.


    **abstract method:** In **object-oriented programming**, a **method** that is
    deﬁned but not imple-


    mented. Programmers will deﬁne an abstract method in a **parent class** to specify
    operations


    that **child classes** must provide.


    **abstract syntax tree (AST):** A deeply nested data structure, or **tree**, that
    represents the struc-


    ture of a program. For example, the AST might have a **node** representing a `while`
    loop with


    one **child** representing the loop condition and another representing the **loop
    body**.


    **accidental complexity:** The extra (avoidable) complexity introduced by poor
    design choices. The


    term is used in contrast with **intrinsic complexity**.


    **accumulator:** A variable that collects and/or combines many values. For example,
    if a program


    sums the values in an array by adding them all to a variable called `result`,
    then `result` is the


    accumulator.


    **actual result (of test):** The value generated by running code in a test. If
    this matches the **ex-**


    **pected result**, the test **passes**; if the two are diﬀerent, the test **fails**.


    **Adapter pattern:** A **design pattern** that rearranges parameters, provides
    extra values, or does


    other work so that one function can be called by another.


    **alias:** A second or subsequent reference to the same object. Aliases are useful,
    but increase the


    **cognitive load** on readers who have to remember that all these names refer
    to the same thing.


    **anonymous function:** A function that has not been assigned a name. Anonymous
    functions are


    usually quite short, and are usually deﬁned where they are used, e.g., as callbacks.
    In Python,


    these are called lambda functions and are created through use of the lambda reserved
    word.


    **Application Binary Interface (ABI):** The low-level layout that a piece of software
    must have


    to work on a particular kind of machine.


    **Application Programming Interface (API):** A set of functions provided by a
    software library


    or web service that other software can call.


    **argument:** A value passed to a function when it is called. See also: **parameter**.


    **ASCII:** A standard way to represent the characters commonly used in the Western
    European


    languages as 7- or 8-bit integers, now largely superceded by **Unicode**.


