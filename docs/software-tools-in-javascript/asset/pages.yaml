  md: "*12.5 What did we do instead?*\n\n209\n\n`}`\n\n\x06\n\n\x05\n\nListing 12.34:\
    \ import-interpolate-bottommethod.js\n\nLet’s test it:\n\n\a\n\n\x04\n\n`node\
    \ test -import -interpolate.js`\n\n\x06\n\n\x05\n\nListing 12.35: test-import-interpolate.sh\n\
    \n\a\n\n\x04\n\n`(bottomMethod (topMethod`\n\n`called`\n\n`from test -import -interpolate.js))`\n\
    \n\x06\n\n\x05\n\nListing 12.36: test-import-interpolate.out\n\nWhen this program\
    \ runs, its lifecycle is:\n\n1\\. Node starts to run `test-import-interpolate.js`.\n\
    \n2\\. It sees the `import` of need-interpolate‘ so it reads and evaluates that\
    \ code.\n\n3\\. Doing this creates a singleton cache object.\n\n4\\. The program\
    \ then calls `need(``'``./import-interpolate.js``'``)`.\n\n5\\. This checks the\
    \ cache: nope, nothing there.\n\n6\\. So it loads `import-interpolate.js`.\n\n\
    7\\. It ﬁnds two specially-formatted comments in the text...\n\n8\\. ...so it\
    \ loads the ﬁle described by each one and inserts the text in place of the comment.\n\
    \n9\\. Now that it has the complete text, it calls `eval`...\n\n10\\. ...and stores\
    \ the result of `eval` (which is a class) in the cache.\n\n11\\. It also returns\
    \ that class.\n\n12\\. We then create an instance of that class and call its method.\n\
    \nThis works, but as we said in the introduction we decided not to use it because\
    \ it didn’t play\n\nwell with other tools. No piece of software exists in isolation;\
    \ when we evaluate a design, we always\n\nhave to ask how it ﬁts into everything\
    \ else we have.\n\n**12.5**\n\n**What did we do instead?**\n\nRather than interpolating\
    \ ﬁle fragments, we extract or erase parts of regular JavaScript ﬁles based\n\n\
    on specially-formatted comments like the `<fragment>...</fragment>` pair shown\
    \ below."
