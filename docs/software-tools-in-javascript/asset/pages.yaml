    **raise (an exception):** To signal that something unexpected or unusual has happened
    in a pro-


    gram by creating an **exception** and handing it to the **error-handling** system,
    which then tries


    to ﬁnd a point in the program that will **catch** it. See also: **throw (exception)**.


    **read-eval-print loop (REPL):** An interactive program that reads a command typed
    in by a


    user, executes it, prints the result, and then waits patiently for the next command.
    REPLs are


    often used to explore new ideas, or for debugging.


    **record:** A group of related values that are stored together. A record may be
    represented as a **tuple**


    or as a row in a **table**; in the latter case, every record in the table has
    the same **ﬁelds**.


    **register:** A small piece of memory (typically one **word** long) built into
    a processor that operations


    can refer to directly.


    **regular expression:** A pattern for matching text, written as text itself. Regular
    expressions are


    sometimes called "regexp", "regex", or "RE", and are powerful tools for working
    with text.


    **relational database:** A database that organizes information into **tables**,
    each of which has a ﬁxed


    set of named **ﬁelds** (shown as columns) and a variable number of **records**
    (shown as rows).


    See also: **SQL**.


    **relative error:** The absolute value of the diﬀerence between the actual and
    correct value divided


    by the correct value. For example, if the actual value is 9 and the correct value
    is 10, the relative


    error is 0.1\. Relative error is usually more useful than **absolute error**.'
