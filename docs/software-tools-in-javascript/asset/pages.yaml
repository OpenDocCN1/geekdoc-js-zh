  md: "234\n\n*14 Style Checker*\n\n**There’s more than one way to do it**\n\n`walk.simple`\
    \ takes four arguments:\n\n1\\. The root node of the AST, which is used as the\
    \ starting point.\n\n2\\. An object containing callback functions for handling\
    \ various kinds of nodes.\n\n3\\. Another object that speciﬁes what algorithm\
    \ to use—we have set this to `null` to use the\n\ndefault because we don’t particularly\
    \ care about the order in which the nodes are processed.\n\n4\\. Something we\
    \ want passed in to each of the node handlers, which in our case is the `state`\n\
    \narray. If our node handling functions don’t require any extra data from one\
    \ call to the next\n\nwe can leave this out; if we want to accumulate information\
    \ across calls, this argument acts\n\nas the Visitor’s memory.\n\nAny general-purpose\
    \ implementation of the Visitor pattern is going to need these four\n\nthings,\
    \ but as we will see below, we can implement them in diﬀerent ways.\n\n**14.3**\n\
    \n**How can we apply checks?**\n\nWe don’t just want to collect nodes: we want\
    \ to check their properties against a set of rules. One\n\nway to do this would\
    \ be to call `walk.simple` once for each rule, passing it a function that checks\n\
    \njust that rule. Another way—the one we’ll use—is to write a generic function\
    \ that checks a rule\n\nand records any nodes that don’t satisfy it, and then\
    \ call that function once for each rule inside\n\nour `Identifier` handler. This\
    \ may see like extra work, but it ensures that all of our rule-checkers\n\nstore\
    \ their results in the same way, which in turn means that we can write one reporting\
    \ function\n\nand be sure it will handle everything.\n\nThe function `applyCheck`\
    \ takes the current state (where we are accumulating rule violations),\n\na label\
    \ that identiﬁes this rule (so that violations of it can be stored together),\
    \ the node, and a\n\nlogical value telling it whether the node passed the test\
    \ or not. If the node failed the test we make\n\nsure that `state` contains a\
    \ list with the appropriate label and then append this node to it. This\n\n\"\
    create storage space on demand\" pattern is widely used but doesn’t have a well-known\
    \ name.\n\n\a\n\n\x04\n\n`const`\n\n`applyCheck = (state , label , node , passes)\
    \ => {`\n\n`if (! passes) {`\n\n`if (!( label in state )) {`\n\n`state[label]\
    \ = []`\n\n`}`\n\n`state[label ]. push(node)`\n\n`}`\n\n`}`\n\n\x06\n\n\x05\n\n\
    Listing 14.7: check-name-lengths.js\n\nWe can now put a call to `applyCheck` inside\
