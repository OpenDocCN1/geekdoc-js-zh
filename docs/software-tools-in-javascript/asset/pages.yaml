    ***Using patterns to ﬁnd things in data***


    **Terms deﬁned: Chain of Responsibility pattern**, **Document Object Model**,
    **Open-Closed**


    **Principle**, **base class**, **child (in a tree)**, **coupling**, **depth-ﬁrst**,
    **derived class**, **eager match-**


    **ing**, **greedy algorithm**, **node**, **polymorphism**, **query selector**,
    **regular expression**, **scope**


    **creep**, **test-driven development**


    We have been globbing to match ﬁlenames against patterns since Chapter 2\. This
    lesson will


    explore how that works by building a simple version of the **regular expressions**
    used to match


    text in everything from editor and shell commands to web scrapers. Our approach
    is inspired by


    Brian Kernighan’s¹entry in [Oram2007].


    Regular expressions have inspired pattern matching for many other kinds of data,
    such as **query**


    **selectors** for HTML. They are easier to understand and implement than patterns
    for matching


    text, so we will start by looking at them.


    **7.1**


    **How can we match query selectors?**


    Programs stores HTML pages in memory using a **document object model** or DOM.
    Each element


    in the page, such as a heading and or paragraph, is a **nodes**; the **children**
    of a node are the elements


    it contains (Figure 7.1).


    The ﬁrst step is to deﬁne the patterns we want to support (Table 7.1).


    According to this grammar, `blockquote#important p.highlight` is a highlighted
    paragraph


    inside the blockquote whose ID is `"important"`. To ﬁnd elements in a page that
    match it, our


    `select` function breaks the query into pieces and uses `firstMatch` to search
    recursively down the


    document tree until all the selectors in the query string have matched or no matches
    have been


    found (Figure 7.2).


