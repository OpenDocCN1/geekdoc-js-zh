    *Package Manager*


    ***Getting and installing packages***


    **Terms deﬁned: SAT solver**, **backward-compatible**, **combinatorial explosion**,
    **heuristic**,


    **manifest**, **patch**, **prune**, **semantic versioning**


    There is no point building software if you can’t install it. Inspired by the Comprehensive
    TeX


    Archive Network CTAN¹, most languages now have an online archive from which developers
    can


    download packages. Each package typically has a name and one or more version(s);
    each version


    may have a list of dependencies, and the package may specify a version or range
    of versions for each


    dependency.


    Downloading ﬁles requires some web programming that is out of scope for this book,
    while


    installing those ﬁles in the right places uses the systems programming skills
    of Chapter 2\. The piece


    we are missing is a way to ﬁgure out exactly what versions of diﬀerent packages
    to install in order


    to create a consistent setup. If packages A and B require diﬀerent versions of
    C, it might not be


    possible to use A and B together. On the other hand, if each one requires a range
    of versions of C


    and those ranges overlap, we might be able to ﬁnd a combination that works—at
    least, until we try


    to install packages D and E.


    We *could* install every package’s dependencies separately with it; the disk space
    wouldn’t be


    much of an obstacle, but loading dozens of copies of the same package into the
    browser would slow


    applications down. This chapter therefore explores how to ﬁnd a workable installation
    or prove that


    there isn’t one. It is based in part on this tutorial²by Maël Nison³.


    **Satisﬁability**


    What we are trying to do is ﬁnd a version for each package that makes the assertion
    "P is


    compatible with all its dependencies" true for every package P. The general-purpose
    tools for


    doing this are called **SAT solvers** because they determine whether there is
    some assignment


    of values that satisﬁes the claim (i.e., makes it true). Finding a solution can
    be extremely hard


    in the general case, so most SAT solvers use heuristics to try to reduce the work.


