  md: "342\n\n*20 Debugger*\n\n• `subject` is the thing being tested.\n\n• `start`\
    \ is a callback to start the system running. It gives control to the subject,\
    \ which then calls\n\nback into the test framework for input and output.\n\n•\
    \ `get` and `send` store things to be given to the subject and to be checked against\
    \ its output. Both\n\nmethods return `this` so that we can chain calls together.\n\
    \n• `run` starts the system and checks that all expected interactions have been\
    \ used up when testing\n\nis done.\n\n• `toSystem` and `fromSystem` use `next`\
    \ to get the next test record, check its type, and return the\n\nstring.\n\nLet’s\
    \ modify the debugger to use the tester, keeping in mind that the prompt counts\
    \ as an\n\noutput (and yes, we forgot this in the ﬁrst version):\n\n\a\n\n\x04\
    \n\n`import`\n\n`DebuggerInteractive`\n\n`from`\n\n`'``./debugger -interactive.js`\
    \ `'`\n\n`class`\n\n`DebuggerTest`\n\n`extends`\n\n`DebuggerInteractive {`\n\n\
    `constructor () {`\n\n`super ()`\n\n`this.tester = null`\n\n`}`\n\n`setTester\
    \ (tester) {`\n\n`this.tester = tester`\n\n`}`\n\n`input (display) {`\n\n`this.tester.fromSystem(display)`\n\
    \n`return`\n\n`this.tester.toSystem ()`\n\n`}`\n\n`message (m) {`\n\n`this.tester.fromSystem(m)`\n\
    \n`}`\n\n`}`\n\n`export`\n\n`default`\n\n`DebuggerTest`\n\n\x06\n\n\x05\n\nListing\
    \ 20.21: debugger-test.js\n\nAgain, we can’t pass the tester as a constructor\
