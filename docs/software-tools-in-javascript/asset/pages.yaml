  md: '**D**


    *Contributing*


    All contributors must abide by our Code of Conduct.


    **D.1**


    **Making Decisions**


    This project uses Martha’s Rules¹[Minahan1986] for consensus decision making:


    1\. Before each meeting, anyone who wishes may sponsor a proposal by ﬁling an
    issue in the GitHub


    repository tagged "proposal". Proposals must be ﬁled at least 24 hours before
    a meeting in order


    to be considered at that meeting, and must include:


    • a one-line summary (the subject line of the issue)


    • the full text of the proposal


    • any required background information


    • pros and cons


    • possible alternatives


    2\. A quorum is established in a meeting if half or more of voting members are
    present.


    3\. Once a person has sponsored a proposal, they are responsible for it. The group
    may not discuss


    or vote on the issue unless the sponsor or their delegate is present. The sponsor
    is also responsible


    for presenting the item to the group.


    4\. After the sponsor presents the proposal, a "sense" vote is cast for the proposal
    prior to any


    discussion:


    • Who likes the proposal?


    • Who can live with the proposal?


    • Who is uncomfortable with the proposal?


    5\. If all of the group likes or can live with the proposal, it passes immediately.


    6\. If most of the group is uncomfortable with the proposal, it is postponed for
    further rework by


    the sponsor.


    1https://journals.sagepub.com/doi/10.1177/088610998600100206


