    *E Glossary*


    **stream:** A sequential ﬂow of data, such as the **bits** arriving across a network
    connection or the


    bytes read from a ﬁle.


    **streaming API:** An **API** that processes data in chunks rather than needing
    to have all of it in


    memory at once. Streaming APIs usually require **handlers** for events such as
    "start of data",


    "next block", and "end of data".


    **string:** A block of text in a program. The term is short for "character string".


    **string interpolation:** The process of inserting text corresponding to speciﬁed
    values into a **string**,


    usually to make output human-readable.


    **synchronous:** To happen at the same time. In programming, synchronous operations
    are ones


    that have to run simultaneously, or complete at the same time. See also: **asynchronous**.


    **tab completion:** A technique implemented by most **REPLs**, **shells**, and
    programming editors


    that completes a command, variable name, ﬁlename, or other text when the TAB key
    is pressed.


    **table:** A set of **records** in a **relational database** or **data frame**.


    **tagged data:** A technique for storing data in a two-part structure, where one
    part identiﬁes the


    type and the other part stores the bits making up the value.


    **Template Method pattern:** A **design pattern** in which a **parent class**
    deﬁnes an overall


    sequence of operations by calling **abstract methods** that **child classes**
    must then implement.


    Each child class then behaves in the same general way, but implements the steps
    diﬀerently.


    **test harness:** A program written to test some other program or set of functions,
    typically to


    measure their performance.


    **test runner:** A program that ﬁnds and runs software tests and reports their
    results.


    **test subject:** The thing being tested, sometimes also called the system under
    test (SUT).


    **test-driven development (TDD):** A programming practice in which tests are written
    before a


    new feature is added or a **bug** is ﬁxed in order to clarify the goal.


    **throw (exception):** Another term for **raising** an exception.


    **tightly coupled:** Components in a software system are said to be tightly coupled
    if they depend


    on each other’s internals, so that if one is altered then others have to be altered
    as well. See


    also: **loosely coupled**.


    **Time of check/time of use (ToCToU):** A **race condition** in which a process
    checks the state


    of something and then operates on it, but some other process might alter that
    state between


    the check and the operation.


    **timestamp:** A digital identiﬁer showing the time at which something was created
    or accessed.


    Timestamps should use **ISO date format** for portability.


    **token:** An indivisible unit of text for a parser, such as a variable name or
    a number. Exactly what


    constitutes a token depends on the language.'
