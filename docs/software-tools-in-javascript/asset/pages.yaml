  md: "**3**\n\n*Asynchronous Programming*\n\n***Using promises to manage delayed\
    \ computation***\n\n**Terms deﬁned: UTF-8**, **call stack**, **character encoding**,\
    \ **class**, **constructor**, **event loop**,\n\n**exception**, **ﬂuent interface**,\
    \ **method**, **method chaining**, **non-blocking execution**, **promise**,\n\n\
    **promisiﬁcation**, **protocol**\n\nCallbacks work, but they are hard to read\
    \ and debug, which means they only \"work\" in a limited\n\nsense. JavaScript’s\
    \ developers added **promises** to the language in 2015 to make callbacks easier\n\
    \nto write and understand, and more recently they added the keywords `async` and\
    \ `await` as well to\n\nmake asynchronous programming easier still. To show how\
    \ these work, we will create a **class** of our\n\nown called `Pledge` that provides\
    \ the same core features as promises. Our explanation was inspired\n\nby Trey\
    \ Huﬃne’s¹tutorial², and we encourage you to read that as well.\n\n**3.1**\n\n\
    **How can we manage asynchronous execution?**\n\nJavaScript is built around an\
    \ **event loop**. Every task is represented by an entry in a queue; the\n\nevent\
    \ loop repeatedly takes a task from the front of the queue, runs it, and adds\
    \ any new tasks that\n\nit creates to the back of the queue to run later. Only\
    \ one task runs at a time; each has its own **call**\n\n**stack**, but objects\
    \ can be shared between tasks (Figure 3.1).\n\nMost tasks execute all the code\
    \ available in the order it is written. For example, this one-line\n\nprogram\
    \ uses `Array.forEach` to print each element of an array in turn:\n\n\a\n\n\x04\
    \n\n`[1000 , 1500 , 500]. forEach(t => console.log(t))`\n\n\x06\n\n\x05\n\nListing\
    \ 3.1: not-callbacks-alone.js\n\n\a\n\n\x04\n\n`1000`\n\n`1500`\n\n`500`\n\n\x06\
    \n\n\x05\n\nListing 3.2: not-callbacks-alone.out\n\nHowever, a handful of special\
    \ built-in functions make Node³switch tasks or add new tasks to the\n\nrun queue.\
    \ For example, `setTimeout` tells Node to run a callback function after a certain\
    \ number\n\n1https://medium.com/@treyhuﬃne\n\n2https://levelup.gitconnected.com/understand-javascript-promises-by-building-a-promise-from-scratch-\n\
    \n84c0fd855720\n\n3https://nodejs.org/en/\n\n27"
