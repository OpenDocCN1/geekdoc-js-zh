    \ can we turn a list of tokens into a tree?**\n\nWe now have a list of tokens,\
    \ but we need a tree that captures the nesting introduced by parentheses\n\nand\
    \ the way that `*` applies to whatever comes before it. Let’s trace a few cases\
    \ in order to see how\n\nto build this tree:\n\n1\\. If the regular expression\
    \ is `/a/`, we create a `Lit` token for the letter `a` (where \"create\" means\n\
    \n\"append to the output list\").\n\n2\\. What if the regular expression is `/a*/`?\
    \ We ﬁrst create a `Lit` token for the `a` and append it to\n\nthe output list.\
    \ When we see the `*`, we take that `Lit` token oﬀthe tail of the output list\
    \ and\n\nreplace it with an `Any` token that has the `Lit` token as its child.\n\
    \n3\\. Our next thought experiment is `/(ab)/`. We don’t know how long the group\
    \ is going to be when\n\nwe see the `(`, so we put the parenthesis onto the output\
    \ as a marker. We then add the `Lit` tokens\n\nfor the `a` and `b` until we see\
    \ the `)`, at which point we pull tokens oﬀthe end of the output list\n\nuntil\
    \ we get back to the `(` marker. When we ﬁnd it, we put everything we have temporarily\n\
    \ncollected into a `Group` token and append it to the output list. This algorithm\
    \ automatically\n\nhandles `/(a*)/` and `/(a(b*)c)/`.\n\n4\\. What about `/a|b/`?\
    \ We append a `Lit` token for `a`, get the `|` and—and we’re stuck, because we\n\
    \ndon’t yet have the next token we need to ﬁnish building the `Alt`.\n\nOne way\
