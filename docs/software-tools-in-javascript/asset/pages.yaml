    Figure 10.2: How a build manager ﬁnds and respects dependencies.


    create a simple build manager based on Make¹, Bajel², Jake³, and other systems
    discussed in


    [Smith2011].


    **10.1**


    **What’s in a build manager?**


    The input to a build manager is a set of rules, each of which has:


    • a **target**, which is the ﬁle to be updated;


    • some **dependencies**, which are the things that ﬁle depends on; and


    • a **recipe** that speciﬁes how to update the target if it is out of date compared
    to its dependencies.


    The target of one rule can be a dependency of another rule, so the relationships
    between the ﬁles


    form a **directed acyclic graph** or DAG (Figure 10.2). The graph is directed
    because "A depends


    on B" is a one-way relationship; it cannot contain cycles (or loops) because if
    something depends


    on itself we can never ﬁnish updating it. We say that a target is **stale** if
    it is older than any of its


    dependencies. When this happens, we use the recipes to bring it up to date.


    Our build manager must:


    1\. Read a ﬁle containing rules.


    2\. Construct the dependency graph.


    3\. Figure out which targets are stale.


    4\. Build those targets, making sure to build things *before* anything that depends
    on them is built.


