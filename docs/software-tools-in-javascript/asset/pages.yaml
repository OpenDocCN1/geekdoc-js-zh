    fourth()\n\nrun queue\n\nevent loop\n\nFigure 3.1: Using an event loop to manage\
    \ concurrent tasks.\n\nof milliseconds have passed. Its ﬁrst argument is a callback\
    \ function that takes no arguments, and\n\nits second is the delay. When `setTimeout`\
    \ is called, Node sets the callback aside for the requested\n\nlength of time,\
    \ then adds it to the run queue. (This means the task runs *at least* the speciﬁed\n\
    \nnumber of milliseconds later).\n\n**Why zero arguments?**\n\n`setTimeout`’s\
    \ requirement that callback functions take no arguments is another example of\
    \ a\n\n**protocol**. One way to think about it is that protocols allow old code\
    \ to use new code: whoever\n\nwrote `setTimeout` couldn’t know what speciﬁc tasks\
    \ we want to delay, so they speciﬁed a way\n\nto wrap up any task at all.\n\n\
    As the listing below shows, the original task can generate many new tasks before\
