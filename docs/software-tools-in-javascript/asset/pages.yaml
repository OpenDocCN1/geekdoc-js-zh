    \n`expander.output(node.attribs[``'``z-num` `'``])`\n\n`},`\n\n`close: (expander\
    \ , node) => {`\n\n`expander.showTag(node , true)`\n\n`}`\n\n`}`\n\n\x06\n\n\x05\
    \n\nListing 9.9: z-num.js\n\nWhen we enter a node like `<span z-num=\"123\"/>`\
    \ this handler asks the expander to show an\n\nopening tag followed by the value\
    \ of the `z-num` attribute. When we exit the node, the handler asks\n\nthe expander\
    \ to close the tag. The handler doesn’t know whether things are printed immediately,\n\
    \nadded to an output list, or something else; it just knows that whoever called\
    \ it implements the\n\nlow-level operations it needs.\n\nNote that this expander\
    \ is *not* a class, but instead an object with two functions stored under\n\n\
    the keys `open` and `close`. We could use a class for each handler so that handlers\
    \ can store any extra\n\nstate they need, but **bare objects** are common and\
    \ useful in JavaScript (though we will see below\n\nthat we *should* have used\
    \ classes).\n\nSo much for constants; what about variables?\n\n\a\n\n\x04\n\n\
    `export`\n\n`default {`\n\n`open: (expander , node) => {`\n\n`expander.showTag(node\
    \ , false)`\n\n`expander.output(expander.env.find(node.attribs[``'``z-var` `'``]))`\n\
    \n`},`\n\n`close: (expander , node) => {`\n\n`expander.showTag(node , true)`\n\
    \n`}`\n\n`}`\n\n\x06\n\n\x05\n\nListing 9.10: z-var.js\n\nThis code is almost\
