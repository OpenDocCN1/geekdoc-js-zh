  md: "*2.5 How can we copy a set of ﬁles?*\n\n19\n\n(from the command line) and the\
    \ name of the particular output directory to create. This was\n\nlegal, since\
    \ every function creates a new **scope**, but hard for people to understand.\n\
    \nOur ﬁle copying program currently creates empty destination directories but\
    \ doesn’t actually\n\ncopy any ﬁles. Let’s use `fs.copy` to do that:\n\n\a\n\n\
    \x04\n\n`import`\n\n`glob from` `'``glob` `'`\n\n`import fs from` `'``fs -extra`\
    \ `'`\n\n`import`\n\n`path from` `'``path` `'`\n\n`const [srcRoot , dstRoot] =\
    \ process.argv.slice (2)`\n\n`glob(``` ` ```${srcRoot }/**/*.*` `` ` `` `, { ignore:`\n\
    \n`'``*~``'` `}, (err , files) => {`\n\n`if (err) {`\n\n`console.log(err)`\n\n\
    `} else {`\n\n`for (const`\n\n`srcName of files) {`\n\n`const`\n\n`dstName = srcName.replace(srcRoot\
    \ , dstRoot)`\n\n`const`\n\n`dstDir = path.dirname(dstName)`\n\n`fs.ensureDir(dstDir\
    \ , (err) => {`\n\n`if (err) {`\n\n`console.error(err)`\n\n`} else {`\n\n`fs.copy(srcName\
    \ , dstName , (err) => {`\n\n`if (err) {`\n\n`console.error(err)`\n\n`}`\n\n`})`\n\
    \n`}`\n\n`})`\n\n`}`\n\n`}`\n\n`})`\n\n\x06\n\n\x05\n\nListing 2.17: copy-ﬁle-unﬁltered.js\n\
    \nThe program now has three levels of callback (Figure 2.8):\n\n1\\. When `glob`\
    \ has data, do things and then call `ensureDir`.\n\n2\\. When `ensureDir` completes,\
    \ copy a ﬁle.\n\n3\\. When `copy` ﬁnishes, check the error status.\n\nOur program\
    \ looks like it should work, but if we try to copy everything in the directory\
    \ containing\n\nthese lessons we get an error message:\n\n\a\n\n\x04\n\n`rm -rf\
    \ /tmp/out`\n\n`mkdir /tmp/out`\n\n`node copy -file -unfiltered.js ../ node_modules\
    \ /tmp/out 2>&1 | head -n 6`\n\n\x06\n\n\x05\n\nListing 2.18: copy-ﬁle-unﬁltered.sh"
