  md: "**9**\n\n*Page Templates*\n\n***Generating HTML pages from templates***\n\n\
    **Terms deﬁned: Visitor pattern**, **bare object**, **dynamic scoping**, **environment**,\
    \ **lexical scop-**\n\n**ing**, **stack frame**, **static site generator**\n\n\
    Every program needs documentation in order to be usable, and the best place to\
    \ put that\n\ndocumentation is on the web. Writing and updating pages by hand\
    \ is time-consuming and error-\n\nprone, particularly when many parts are the\
    \ same, so most documentation sites use some kind of\n\n**static site generator**\
    \ to create web pages from templates.\n\nAt the heart of every static site generator\
    \ is a page templating system. Thousands of these have\n\nbeen written in the\
    \ last thirty years in every popular programming language (and one language,\n\
    \nPHP¹, was created for this purpose). Most of these systems use one of three\
    \ designs (Figure 9.1):\n\n1\\. Mix commands in a language such as JavaScript\
    \ with the HTML or Markdown using some kind\n\nof marker to indicate which parts\
    \ are commands and which parts are to be taken as-is. This\n\napproach is taken\
    \ by EJS², which we used to write these lessons.\n\n2\\. Create a mini-language\
    \ with its own commands like Jekyll³(which is used by GitHub Pages⁴).\n\nMini-languages\
    \ are appealing because they are smaller and safer than general-purpose languages,\n\
    \nbut experience shows that they eventually grow most of the features of a general-purpose\
    \ lan-\n\nguage. Again, some kind of marker must be used to show which parts of\
    \ the page are code and\n\nwhich are ordinary text.\n\n3\\. Put directives in\
    \ specially-named attributes in the HTML. This approach has been the least\n\n\
    popular, but since pages are valid HTML, it eliminates the need for a special\
    \ parser.\n\n<% items.forEach(item => { %>\n\n**<ul>**\n\n **<li>**<%- item.title\
    \ %>**</li>**\n\n<% } %>\n\n**</ul>**\n\nEJS\n\n{% for item in items %}\n\n**<ul>**\n\
    \n **<li>**{{ item.title }}**</li>**\n\n{% endfor %}\n\n**</ul>**\n\nJekyll\n\n\
    \ **<li>**<span z-var=\"item\"/>**</li>**\n\n**<ul** z-loop=\"item:items\"**>**\n\
    \n**</ul>**\n\nArgon\n\nFigure 9.1: Three diﬀerent ways to implement page templating.\n\
    \n1https://www.php.net/\n\n2https://ejs.co/\n\n3https://jekyllrb.com/\n\n4https://pages.github.com/\n\
    \n131"
