  md: 'You just reviewed how the z-index property can be used to layer elements in
    a webpage. Other tools available to help with this task are the five back-ground
    properties identified in Table 6-3.


    Each of these properties can be used to customize the background of an entire
    page or for specific page elements. For example, you could add a colored background
    to a paragraph and a repeating image to the background of a table cell. Here are
    two code samples to show how these properties might be added:


    ```

    p { background-color: #012345; }

    td.textured { background-image: url(images/pattern.jpg); }

    ```


    **TIP When you want to use more than one background property for a single element,
    use CSS shorthand to avoid coding them all longhand:


    P { BACKGROUND: URL (STAR-BG.GIF) NO-REPEAT; };**


    | Property | Description | Possible Values | Default Value |

    |---|---|---|--|

    | background-attachment | Defines whether a background image scrolls when the
    page is scrolled or remains fixed in its original location | scroll fixed | scroll
    |

    | background-color | Defines the background color of an element | <color> transparent
    | transparent |

    | background-image | Defines an image to be used as the background pattern | <URL>
    none | none |

    | background-position | Defines the starting position of the background color
    or image with x and y positions (if you specify one keyword, the second will automatically
    be ''center'') | <percentage> <length> top bottom center right | 0% 0% |

    | background-repeat | Specifies how a background image repeats | repeat no-repeat
    repeat-x repeat-y | repeat |'
