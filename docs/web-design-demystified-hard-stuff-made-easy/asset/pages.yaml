- img_proc: true
  md: 'Choosing the best format for your web graphics is a bit like shopping—you are
    looking for the format that looks the best but costs the least. In this case,
    the cost comes in download time for webpage visitors. Frankly, any graphics program
    geared towards web design will let you visually compare how each format affects
    your file. In fact, most programs offer a way to compare all formats at once.


    Photoshop''s Save for Web feature (shown in Figure 3-2) allows you to compare
    up to four versions of an image at once. Figure 3-2 compares the original image
    to three other versions, each using different export settings. In this example,
    the PNG-24 is the largest in terms of file size (6.773k), but it is the only one
    that allows the shadow behind the button to fade to transparent.


    The GIF version does include transparency, but it will only display appropriately
    if the background of the page matches the color (which is case white). This happens
    because GIF files only support one level of transparency. The JPEG


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_87_0.png)


    FIGURE 3-2. Photoshop''s Save for Web comparing GIF, JPEG, and PNG formats for
    a button'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'version is the smallest in file size, but shows the most pixilation and dithering
    that occurs with its file compression, particularly in areas of solid color.


    There is not one format that is perfect for every file. In the end, you''ll have
    to weigh the various options to determine which file format is appropriate in
    each situation. When all your slices are named and optimized, your final step
    is to allow the graphics program to do its part and save each file. You can export
    all the slices at once individually if you prefer.


    # Exporting Slices


    The steps for exporting slices vary slightly depending on which graphics program
    you''re using.


    NOTE Many designers begin by designing in Photoshop, then switch to Fireworks
    to take advantage of the great web export options. If you decide to go that route,
    save your file as a .psd in Photoshop and open that same .psd in Fireworks before
    continuing with the export options.


    +   - In Fireworks, you can quickly export a single slice by right-clicking (CTRL-clicking
    in Mac) the slice and choosing "Export Selected Slice." Or, if you are ready to
    export all the slices in your file at once, choose File | Export, and then specify
    where you want to save the slice(s) before clicking the Export button.

    - In Photoshop, the only way to access the Export options is to choose File |
    Save For Web & Devices. The resulting window contains options for naming and optimizing
    your slices (if you have not already done so). Then, if you want to export a single
    slice, select it with the Slice Select tool before clicking the Save button. The
    last step is specifying where the slice(s) should be saved. At that point, you
    can also tell Photoshop whether to output All Slices, All User Slices, or Selected
    Slice.


    > Still Struggling

    Lots of online tutorials help walk you through exporting slices in whichever graphics
    program you''re using. Check out http://snook.ca/files/sc-export.mov for a great
    video about exporting slices from Photoshop and Fireworks.'
  merge: -1
