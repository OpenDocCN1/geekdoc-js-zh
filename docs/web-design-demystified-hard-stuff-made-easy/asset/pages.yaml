  md: '# Chapter 2 DESIGNING FOR SCREENS


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_54_0.png)


    FIGURE 2·4. The Web Developer toolbar is great addition to Firefox for web designers.


    Choose different screen resolution from the drop-down menu to cause the browser
    to be resized to fit within the selected screen size. This allows you to see how
    much of a design remains visible at different resolutions.


    If you use Internet Explorer 8, you will find these same developer tools built
    into the browser. Choose Tools/Developer Tools to access these features. For the
    resizing tool, you will then need to select Tools/Resize, followed by the desired
    area.


    The biggest area of concern regarding screen sizes of traditional computers is
    how much horizontal space is available for content. In the early days of the Web,
    designers focused on the lowest common denominator (640 × 480). This means the
    most important content was designed to fit within a width of about 600 pixels.
    (The extra 40 pixels are taken up by the browser chrome—menus, scroll bars, etc.—and
    the operating system.)'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'Now, designers typically opt to create liquid pages, which grow and shrink
    according to the available screen area on the visitor''s monitor. This means you
    must design a page that looks good both at 800 pixels wide and 1200 pixels wide,
    which isn''t always easy to do. To help in that regard, here are some quick tips:


    +   - Photographs don''t easily scale. If your page includes large photos, figure
    out how to handle the space around them as page grows. Likewise, don''t make the
    photos so large that they cause other important content to be hidden on smaller
    screens.


    +   - Text is difficult to read when contained within really wide columns. As
    such, I suggest using a fixed width for text areas and filling in the surrounding
    space as necessary with other elements.


    +   - Really wide pages don''t typically translate well into really small spaces.
    Consider creating a maximum layout width for your pages don''t get unwieldy and
    difficult to read.


    +   - Don''t forget the "fold," which refers to the point at which users have
    to scroll vertically. Be sure the most important content is located "above the
    fold" for your target screen sizes.


    TIP To find the Web Developer toolbar shown in Figure 2-4, open the Firefox browser
    and visit https://addons.mozilla.org/en-US/firefox/addon/60. Then click the Add
    To Firefox button to install.


    But what about designing for mobile screens? While you can add custom sizes to
    the Resize function within the Web Developer toolbar, it''s not a true indication
    of how your pages will display the browsers used on mobile devices are so different.
    (More on how the browsers affect the page display shortly.) The best way to plan
    your designs for display on mobile screens is to work with the correct sizes when
    creating your mockups. For example, design tools like Photoshop allow you to create
    new documents according to common screen sizes. You can even choose from a list
    of popular mobile device screen sizes, as shown in the following illustration.'
  merge: -1
  pgno: 55
