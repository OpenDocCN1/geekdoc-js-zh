  md: 'Depending on what type of computer you have and who is hosting the site, you
    may use one of many different types of desktop or web-based FTP programs. Or you
    might use an FTP tool that comes with your HTML editor, such as the built-in FTP
    capabilities in Adobe Dreamweaver.


    # Desktop FTP


    While there are hundreds of FTP programs available, they all function in the same
    way. To begin, you must choose computer you want to access. If you want to upload
    your files to a web server, enter that computer''s information in the space provided
    for "remote" computer.


    NOTE You should receive all the necessary login information (username, password,
    etc.) when you sign up for a hosting service. If you''re unsure, check your host''s
    website or call its customer support for assistance.


    Then, in the space provided for the "local" computer, navigate to the folder on
    your computer containing the file you want to transfer. If you select the file
    to be transferred, you can use the upload button to copy the file to the destination
    location on your host server. For example, in Dreamweaver, the local computer
    is usually shown on the right, while the remote system displays on the left. After
    clicking a file to upload to the local computer, I can click the Put button (it''s
    a "up" arrow) to upload the file to the remote system (Figure 9-1).


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_235_0.png)


    Figure 9-1- Screenshot of Dreamweaver''s FTP'
