    Alt text is the alternate text that is displayed when an image doesn’t, and is
    added with the alt attribute to make sure descriptive words explain what users
    will find when the image is viewed. For example, if the image contains a coupon
    for $20, you could code your image like this: <img src="http://mycompany.com/email/images/coupon.jpg"
    alt="Use this coupon to get $20 OFF for your next purchase" />


    Another way to help users understand the e-mail content is to include teaser text
    at the top of the page. When an e-mail is initially displayed in an e-mail reader,
    the bottom half can easily be hidden depending on the user’s monitor size and
    screen resolution. And as you read, the images may be turned off'
