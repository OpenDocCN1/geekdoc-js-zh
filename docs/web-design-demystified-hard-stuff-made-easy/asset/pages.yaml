    # Title


    The title element is required, as it tells the browser what to display in its
    title bar. First and foremost, you should always include some descriptive text
    that gives users an idea what the page is about. Many people also use this part
    of the page to help orient users to their location on the website.


    # Meta


    The meta element is used to provide reference information such as the author of
    the page or its copyright details. Table 3-2 lists the most common types of meta
    tags. I also cover them a bit more in Chapter 9. Here''s an example of header
    content that includes a title and relevant meta data:


    ```

    <head>

    <title>Amy''s Flowers | Roses | Amy''s Blooming Dozen Bouquet</title>

    <meta name="author" content="Wendy Willard />

    <meta name="copyright" content="2010, Amy''s Flowers" />

    </head>

    ```


    > TIP The meta element is one that does not have a closing tag. Tags like this
    are often referred to as empty tags. So to “close” tags like this one, you place
    the terminating slash before the final bracket, as shown in the previous code
    snippet.


    # Base


    The base element is used when it''s necessary to identify a base URL for all links
    on the page. For example, if the links on a page access within


