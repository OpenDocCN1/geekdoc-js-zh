    >\n<html>\n<head>\n  <title>My First Web Page</title>\n</head>\n<body>\n  This\
    \ is the basic page code.\n</body>\n</html>\n```\n\n# Version Information\n\n\
    The first thing every HTML document needs a line that identifies which version\
