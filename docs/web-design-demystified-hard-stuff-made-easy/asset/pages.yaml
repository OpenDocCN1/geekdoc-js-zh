  md: 'in color can be caused by distinctions in another type of color palette—the
    one that ships with the computer''s operating system—as well as lighting and gamma
    issues related to the user''s monitor.


    In fact, 216 colors will display uniformly across all Mac and Windows systems
    (but even those colors can be affected by lighting and gamma issues). Those 216
    colors are commonly referred to as ''web-safe'' colors.


    **TIP** Refer to www.visibone.com/color/chart_847.gif for a visual representation
    of a web-safe color chart, complete with RGB and HTML values for each color.


    In the past, web designers were wary of using anything but web-safe colors, for
    fear their choices wouldn''t be available on every user''s system. When colors
    weren''t available, the browser sometimes displays areas of the page with completely
    different colors. This often caused webpages to look awful on some systems, even
    though they were beautiful on others. But as computer systems and monitors have
    gotten better, the risk that web users will not be able to see a particular color
    on a webpage has decreased. Because of this, most web designers now ignore the
    web-safe palette altogether in favor of whatever color looks.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_61_0.png)


    > If you feel a bit green when it comes to color theory, you can easily learn
    a few concepts by visiting some excellent online color resources like http://www.colormattors.com/colorthe.html
    and http://en.wikipedia.org/wiki/Color_theory.


    # Contrast


    Even though you can use any of the colors in the RGB color spectrum, there are
    certain considerations in regard to which colors you select. Perhaps the most
    important color consideration for screen design is contrast. Whatever colors you
    select, you need to make sure the page offers contrast to allow any text to be
    readable, regardless of the user''s lighting. This is especially true when mixing
    hues with similar values. While it can be beautiful to mix a mid-tone blue with
    a mid-tone green, some people just won''t see the difference.'
