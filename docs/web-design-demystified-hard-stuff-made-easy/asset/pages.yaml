    # Body Content


    The rest of the code within an HTML file is contained within the body content.
    Everything that displays within the browser content area is somehow referenced
    between the opening and closing body tags. Here''s an example of some very basic
    content:


    ```

    // p tag is used to contain paragraphs of text on the page.

    // h1 tag is used to contain the most important headlines on the page.

    <body>

    <h1>Amy''s Flowers</h1>

    <p>Located in Bel Air, MD, Amy''s Flowers has been serving the Hartford County
    area for almost 20 years.</p>

    <a href="products.html" title="View Sample products"></a> | <a href="contacts.html"
    title="Contact Us"></a></create</a></p>

    </body>

    ```


    The tag is used to create links to other.


    As reviewing the preceding sample code, notice some tags have aspects you can
    customize. These options are called attributes and are placed after the element
    name in the tag, but before the final bracket. In the preceding example, href
    and title are attributes of the opening tag (which, in this case, is used to create
    a link to another page.'
