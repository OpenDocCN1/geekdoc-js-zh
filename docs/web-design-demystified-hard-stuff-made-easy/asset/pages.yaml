  md: '# TABLE 4-1 Differences Between Block-Level and Inline Elements


    | | Block-Level | Inline |

    |---|---||

    | Formatting | Begin on new lines | Do not begin new lines |

    | Contents | May contain other block-level elements as well as inline elements
    | May contain only other inline elements |

    | White space | Can have margins, padding, and forced dimensions (width/height)
    | Cannot have margins or forced dimensions (width/height) |

    | Positioning | Can be moved independently of the surrounding elements | Are treated
    as part of the normal flow of the document text and cannot be moved outside of
    that |


    categories: block-level or inline. Table 4-1 outlines the differences between
    these two types of HTML elements.


    The div element is commonly used block-level container because it helps designers
    define the overall structure of pages. Inside those, block-level containers might
    include the headlines, paragraphs, and lists. The element used to create links
    is an example of an inline container. Each of these is outlined in the following
    sections.


    To make things interesting, it should be noted that you can actually force an
    element to be block or inline. This means you could force a link (which is normally
    an inline element) to display as a block-level element instead. I discuss this
    more in the next chapter, but at this point you only need to understand how being
    block-level or inline affects page content.


    > NOTE Block-level and inline elements are discussed more in Chapter 5, styling
    the page.


    # Headings


    One of the earliest means of structuring text content were the headings, available
    in six levels of importance from <h1> to <h6>. You use the headings to tell the
    browser which pieces of text function as headings, and then specify how to style
    them later with CSS.


    ```

    <h1>About Us</h1>

    ```


    Headings in HTML are similar to the headings you might use in a word processor
    like Microsoft Word. They are also similar to headings in outlines,'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Chapter 4 ALL ABOUT THE HTML


    because they should only be used in the proper order, from h1 down to h6. For
    example, you wouldn''t create an outline that began with a small letter a and
    was followed by the roman numeral I. Instead, you would begin with the roman numeral
    I, follow with a capital A, and so on. In like manner, an h1 should be followed
    by an h2>, as opposed to an h3>.


    While the heading element changes the size of the text contained by it, this element
    is primarily used as a structural element to identify the headings within various
    content areas. At this point, don''t try to change or alter the characteristics
    of your headings. We''ll do that with a style sheet in the next chapter.


    # Paragraphs


    The next best method of structuring text content is with the paragraph element.
    HTML is different from traditional word processors because you cannot simply press
    the RETURN or ENTER key to end a paragraph, and then press the TAB key to indent
    a new one. Instead, you have to use tags to tell the browser where to start and
    end paragraphs, as well as any other types of breaks.


    The paragraph element (which is coded as <p>...</p>) functions specifically as
    a container for paragraphs of text. This means you will use an opening paragraph
    tag at the beginning of your paragraph, and a closing version at the end. Here''s
    what it looks like:


    ```

    <p>CHOP POINT CAMP is a Maine summer camp combining a strong residential camping
    camp with the excitement of an adventurous trip. Each summer, 80 teenagers between
    the ages of 12 and 18 come to Chop Point all over the world to have one of the
    best summers of their lives.</p>

    ```


    Even though the paragraph element''s sole purpose is to contain paragraphs of
    text, it doesn''t automatically indent. That can be achieved through a style sheet,
    if desired. Instead, paragraphs created with <p> are separated by blank lines.


    # Line Breaks


    Sometimes it''s necessary to force a line break within a chunk of text. The line
    break element is an inline tag perfect for this purpose. Adding <br /> to to your
    code is the same as pressing SHIFT-RETURN or ENTER on your keyboard in a word
    processor. It causes the browser to stop printing text on line and drop down to
    the next line.'
