  md: '# Content Blocks


    As was mentioned previously, each part of your designs must fit into a “block”
    within the overall layout. Even though you probably didn''t think a whole lot
    about those blocks when you were creating the design, they become extremely important
    during the coding.


    In fact, if you structure your content blocks appropriately, you''ll be able to
    easily customize them as needed. How? The secret lies in something I can''t stress
    enough: the separation of the *style* of a webpage from its content.


    Consider a design with four key blocks: a header, some navigation, body copy,
    and a footer. If each of these blocks is first structured within the HTML and
    then styled with the CSS, you can actually format and move the blocks independently
    on the page without ever returning to the HTML code. Indeed, a great strength
    of style blocks is their ability to let you apply groups of formatting characteristics
    to sections of text.


    The key to setting up these content blocks is the div element. Adding a simple
    `<div>` and `</div>` grouping to the code on your page will cause no outward change
    in appearance when the page is viewed in the browser. This element is merely used
    as a container, allowing you to manipulate its contents later with style sheets.
    As you begin coding your pages, you want to identify the most appropriate blocks,
    or sections, to house the content on the page.


    # Planning the Structure


    The vast majority of webpages follow a similar structure, with a header, navigation,
    main content, and footer. That''s not to say all webpages *look the same*, but
    just that many have a similar underlaying structure. It''s how you organize the
    structure on the page that is unique. Let''s take another look at a site sliced
    in Chapter 3 to see how this might work. Figure 4-1 shows the site''s design,
    while Figure 4-2 shows how it might be broken up into content blocks.


    In the code, we use the div element to separate content blocks, then add the id
    attribute to give each block a name (as I did with header, mainContent, nav, and
    footer in the following example). In the same way that a unique Social Security
    number is assigned as identification—ID—for each person'
