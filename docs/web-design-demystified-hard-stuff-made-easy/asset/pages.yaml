  md: 'Technically, you may wonder why a "computer" wasn''t included on my list

    of required items for a usability test. Suppose you wanted to test a site before

    it was built. You could do so by printing the mockups of the website and asking

    testers to explain how they might perform certain tasks using the sample

    screens. This process is referred to as testing with paper prototypes and can
    be a

    great way to check the usability of a website well before extensive resources
    are

    used to actually build it.


    # Locate the Testers


    So you have the website to be tested. How do you find the users? In my exper-

    ience, you need only ask. Let''s face it: lots of us like to be the center of
    att-\ention... if only for a few minutes. You don''t need a large number of testers.

    As long as the testers are a good representation of the target audience,

    four to six people should be sufficient.


    To locate users, first check with the client or site owner to identify

    current customers who might be able to help. If the business doesn''t yet have

    an existing customer base, check out the competition. Look for people who

    currently utilize a competitor and ask if they might be willing to participate.

    You could offer a discount coupon as an incentive, or even a small payment to

    compensate for their time.


    It''s a good idea to make sure the tester has not been involved in the design

    or development at all, is completely new to the website, and is not

    working for the client or website owner. Beyond that, you can ask anyone who

    fits the site''s target audience.


    # Create the Test


    When planning your usability tests, refer back to the process you went through

    to identify the site''s target audience. What goals did you have for the user?

    What did you expect they''d to accomplish on the site? Use the answers

    to questions like these to write the test scenarios for your users.


    You want to be prepared before the usability test so not to waste anyone''s

    time. It''s best to limit the actual test to about 10 or 15 minutes so you have

    debrief the tester afterward and she is finished in under 30 minutes.


    With each test, try to determine whether the user understands the page

    being tested and can successfully use the site''s navigation to locate information.

    General usability tests might evaluate whether a page is difficult to read, where

    users tend to get lost, and how easily accessible the information is. More detailed'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Chapter 9 GOING LIVE


    tests might seek to know whether a user can perform a specific task or locate
    a certain piece of information.


    Consider running a trial test with a colleague prior to facilitating the test
    with actual users. This can tell you whether your testing procedure is too long,
    short, confusing, and so on.


    # Facilitate the Test


    When you''ve found the users and created the test, you can set up some time to
    run the test. At that point, you''ll need a facilitator to guide the users through
    the test and record the results. Because you might have a tendency to correct
    the tester or defend the design, it is best to find someone else to facilitate
    the test.


    At the start of the test, have the facilitator remind you that he is not being
    tested—the website is. Also, ask him to think out loud so his thoughts about the
    site can be recorded. For example, when evaluating a site for a bank, the facilitator
    might ask, “What would you do if you were looking for information about a used
    car loan?” Then the facilitator should not direct the tester in any way. Instead,
    should simply record where the user clicks and what he does to accomplish the
    task.


    Avoid asking the tester to make suggestions about how to fix the test. This is
    your job. Do have the facilitator take notes and (if the budget allows) record
    the test to video. While obviously an additional cost, recording usability tests
    save money down the road you always have the video to refer back to questions
    arise.


    After the test is completed and the user has been debriefed, the facilitator needs
    only to thank the tester and offer any payment or gift promised before compiling
    the results. The best part of usability tests is they provide instant access to
    how real users are interacting with the site.


    # Uploading to a Web Server


    When the site is ready to go live (where it is accessible to visitors on the Web),
    it''s time to transfer the pages to the host web server. Use File Transfer Protocol
    (FTP) programs to make this transfer.


    The concept of using an FTP program is similar to moving around on your own computer.
    But instead of moving files from one folder to another on your computer, you''re
    moving them from one folder to another folder on a different computer.'
