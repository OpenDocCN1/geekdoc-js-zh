  md: '# chapter 9


    # # Going Live


    The last few chapters have covered how to code your webpages to allow them to
    display as expected for as many people as possible. When you''ve completed that
    process, it''s time to perform a final browser check before publishing your content.
    This chapter discusses testing process, as well as the tools used to make your
    pages live for the world to see! Finally, the chapter closes with a look at site
    maintenance and getting your pages listed in popular search engines.


    # CHAPTER OBJECTIVES


    In this chapter, you will


    +   * Identify the purpose of testing webpages and the methods by which it is
    accomplished

    * Differentiate between desktop and browser-based FTP

    * Recognize how to effectively document a web development project

    * Identify ways to improve a site''s search engine ranking'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Testing


    In the beginning of the book, I discussed various aspects of a user''s computer
    setup that affect how he or she views a website. During the testing process, you
    should try to replicate as many of those situations as possible. Obviously it
    is impossible to test your site using every setup method, but there are ways to
    get a pretty good idea of how the site will come across in a wide variety of situations.


    # Testing the Code


    One of the first tests most developers run is to validate the code. The process
    of validating your code checks it against the coding standards used by browsers
    during page display. Even though modern web browsers do a pretty good job of displaying
    pages with minor code errors, there are certain errors that don''t fare so well.
    This means pages containing these errors will display differently from browser
    to browser and platform to platform.


    A great way to avoid putting up a page with such errors is to check it first,
    using a validation tool. To do so, visit http://validator.w3.org in your web browser.
    From there, you have a couple of options:


    +   * **Validate by URI** This method allows you to validate a page that is already
    uploaded to a web server. Simply enter the address of the page and click the Check
    button.

    * **Validate by file upload** This method works well for a page stored on your
    personal computer that hasn''t yet uploaded to a web server. Click the Validate
    By File Upload tab and then click the Browse button to locate the file in question
    before clicking the Check button.

    * **Validate by direct input** This method is well suited to pages currently under
    construction, or for smaller sections of code that seem to be causing a problem.
    Click the Validate By Direct Input tab, then enter the code you want to validate,
    and click the Check button.


    NOTE The W3C validator mentioned here only checks HTML, XML, and Standard Generalized
    Markup Language (SGML) files. If you want to validate a CSS file, use http://jigsaw.w3.org/css-validator.
    Dreamweaver also offers built-in validation tools, located under the File | Validate
    menu.'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'After the validator checks your file, you''ll be presented with a page specification
    whether or not your code checked out. If it passes, congratulations are in order.
    But if it doesn''t, fear not, because plenty of us write code that doesn''t initially
    pass inspection.


    Thankfully, the W3C offers suggestions on how to improve the code so it can pass
    inspection. From time to time, you may encounter errors that are unavoidable.
    For example, you may recall the original method of embedding video into a webpage
    by using the embed element. However, the embed element is not recognized by the
    W3C as proper markup. So, if you include the embed element in an effort to reach
    users of older browsers, your pages won''t validate.


    # PROBLEM 9-1


    I embedded a YouTube video on my site, using the HTML provided by YouTube, but
    now my page won''t validate!


    # SOLUTION


    When adding YouTube videos to your site, you will likely be given code that contains
    the embed element, which will cause your pages to throw errors upon validation.
    There are several other sources that offer fixes for this problem. Check out www.tools4noobs.com/online_tools/youtube_xhtml
    or www.alistapart.com/articles/flashatay.


    Here are few other common reasons why a page won''t validate:


    +   - **A missing tag** Probably the number one reason why a page doesn''t validate
    is that a tag isn''t closed. In my experience, that is frequently the `<div>`
    tag. I might open it (using `<div>`) and then code all of the content, but forget
    to close it (using `</div>`). Any of the table tags are also common culprits for
    missing end tags. You might start a new row (using `<tr>`) but then forget to
    close it after adding the row''s cells. Empty tags like `<br>` require a trailing
    slash: `/` and won''t validate as XHTML without them.


    +   - **Incorrect DOCTYPE declaration** If you forget to include the DOCTYPE tag
