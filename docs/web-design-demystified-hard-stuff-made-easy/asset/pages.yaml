  md: '# Chapter 10 E-MAIL DESIGN


    in Dreamweaver, which allows you to see pieces of the design are in which cells.


    While Chapter 4 outlined the basic concepts behind tables, there are a few additional
    things to consider when using tables for page layout. First, there are two attributes
    that can be added to the opening table tag to define the space in around the cells:


    +   - cellpadding Defines the space between the content in the cell and the edges
    of that cell


    +   - cellspacing Defines the space in between each of the individual cells


    It is common for designers to split apart e-mail designs and then put them together
    using tables (as I did with the design shown in Figures 10-1 and 10-2). When doing
    so, you need to eliminate all the space between the cells to make them display
    seamlessly. The easiest way to accomplish seamless tables in e-mail design is
    to set the table element''s cellpadding, cellspacing, and border attributes to
    zero, like this:


    ```

    <table cellpadding="0" cellspacing="0" border="0">

    ```


    Here are a few other guidelines to keep in mind:


    +   - Always define the width of your table cells (with the width attribute added
    to the opening td tag) to ensure your layout stays as you intend it to.


    +   - If your table cells contain images, use absolute sizes when defining the
    width or height those cells. In other words, switch to pixel widths instead of
    percentages.


    +   - Start with the border set to 1 (border="1") to help you visualize the table
    during development. Switch it to zero for testing and the final delivery.


    +   - Use the align attribute inside the opening cell (td) and row (tr) tags to
    specify the horizontal alignment of the content.


    +   - Use the valign attribute inside the opening cell (td) and row (tr) tags
    to specify the vertical alignment of the content.'
