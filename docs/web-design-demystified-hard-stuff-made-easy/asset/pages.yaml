- img_proc: true
  md: '# What’s Unique About Screen Design?


    Whenever you begin a new web design project, you must consider how the user will
    ultimately view your design. When the Web was in its infancy, users could only
    view webpages through web browsers on computers. But now people can access the
    Web from mobile phones, game systems, TVs, and even refrigerators! The thing all
    of those have in common is this: Each has a screen on which content is viewed.
    Beyond the fact that each has a screen, however, there are plenty of differences.


    To ensure you understand those differences, let’s look more closely at some of
    them.


    # Devices


    The most obvious difference between how users view webpages is in the device itself.
    Is your target audience accessing the site from a traditional computer (desktop
    or laptop) or a mobile, handheld device (such as a phone, game console, or MP3
    player)? In all likelihood, the answer will include both categories. So how do
    you accommodate traditional computer users as well as mobile users?


    Let’s take a look at how some other sites have handled this issue. First, check
    out Figures 2-1 and 2-2 to see how Target deals with a target audience accessing
    their site from different devices. Figure 2-1 shows how www.target.com displays
    in a typical web browser, while Figure 2-2 shows that same site on an iPhone.


    A 2009 Pew Internet research found that at least 33 percent of Americans can access
    the Internet on mobile devices. If you’re part of that 33 percent, you know how
    hard it is to view webpages on mobile devices versus traditional computers. More
    often than not, it can be difficult to view and navigate complete webpages when
    viewed on the small screens that come with mobile devices. Frankly, there’s a
    way to create a customized version of your site, just for mobile users.


    Figure 2-3 shows the customized Target site that displays for mobile users. Target’s
    developers have included a script on the web server to “sniff out” mobile users
    and serve the appropriate pages. Notice how you can view the entire page at once
    without zooming or squinting.


    **TIP** If you expect moderate mobile use, create a mobile-friendly style sheet
    for your site. This is discussed in more detail in Chapter 6.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Chapter 2 DESIGNING FOR SCREENS


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_52_0.png)


    Figure 2-1 · Target.com viewed in Firefox on a digital computer


    # Screen Area


    Speaking of zooming and squinting, do you know the resolution of your screen?
    Or, a different way, what is the total amount of viewing space available on your
    monitor, regardless of the monitor’s physical size? Table 2-1 lists typical screen
    areas for common monitor sizes. Also, check out www.screenresolution.org for additional
    information.


    The screen area is important when you are dealing with how much content can realistically
    fit onto a single webpage. Unlike pages printed on paper, where everyone sees
    a design at the same size (perhaps 8.5 x 11 inches), the designed webpage will
    vary in size according to the screen area of its viewer.'
