    your blog. I''ll talk a bit more about blogs in Chapter 8.


    # Domain Names


    I would be remiss to finish a section on hosting without discussing domain names.
    As a web designer, you will often be asked to give advice about selecting domain
    names. Many people underestimate the power of a guessable and memorable domain
    name.


    When talking about this, I frequently use the example of a company called Acme
    Landscaping Incorporated. While it may seem logical to its business ownership
    to purchase the domain name alinc.com, it''s probably not the first thing a potential
    customer would try. The name acmelandscaping.com would be my first guess, but
    if that were already taken I might try acelandrapers.com or acmelowns.com. Then,
    I''d probably add another domain that doesn''t have the business name, but instead
    provides a good search engine tag.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'In the case of a summer camp website I created, we were able to register thebestsummercamp.com
    in addition to a domain name with the organization''s name. While thebestsummercamp.com
    isn''t the Uniform Resource Locator (URL) listed on the business cards, it has
    proven to be a valuable marketing tool for the organization as it reaches out
    to new members of the target audience.


    TIP You can register a domain name either through your hosting company or independently
    through a site like Go Daddy (www.godaddy.com).


    # # Target Audience


    Now that we''ve answered the where question, it''s time to move to the who. If
    you''re creating a website for a business, a group, or an organization, you''re
    most likely targeting people who might buy or use the company''s products or services.
    Even if your site is purely for the purpose of disseminating information, you
    must be targeting a audience.


    Knowing that audience can significantly affect how you design and develop the
    site. For example, if you''re developing a site to sell a new name for Mac users,
    you know you can target the Mac operating system and browsers. Conversely, a site
    selling products for both Mac and PC users needs to be built and tested to function
    well on both platforms. Or what about a site whose target audience frequently
    uses web-enabled phones to access the site? Such a site would require coding and
    testing on a variety of web-enabled phones, in addition to traditional desktop
    browsers. When considering your site''s target audience, consider how it affects
    things:


    +   - Target platforms The computer through which the site is accessed

    - Target browsers The software through which the site is accessed

    - Target screen area/resolutions The “window” through which the site is viewed


    # # PROBLEM 1-1


    I''ve been asked to create a website for my company, but it''s not the typical
    marketing site. My boss wants a site just for the employees of the company, to
    share documents and other information. How do I plan for this type of audience?'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# SOLUTION


    It sounds like you''ve been asked to help create an intranet site, which is a
    private site only accessible to qualified users. Creating a site for such a narrow
    audience will enable you to tailor the look and feel to the needs of your company''s
    employees, which probably all have similar computers, browsers, and access speeds.
    However, you must also consider whether employees will access the site from home
    computers or mobile phones, which will likely have different requirements than
    your typical office computer. Talk with your boss to determine whether the site
    will be accessible to both home and office users, and then plan accordingly.


    Each of these affect design decisions you make, as which fonts to use, how to
    make the graphics, and which layout works best. I discuss this a bit more in the
    next chapter.


    In the meantime, here are few sites that provide online demographics and market
    research helpful to web designers. These sites offer details about demographics
    such as browsers, access speeds, hardware, traffic patterns, and site performance,
    as well as consumer demographics, as advertising trends and purchasing decisions.


    +   * http://www.access-gov.info/learn.cfm?id=demo&xid=MN

    * http://www.internetews.com/stats

    * http://www.thecounter.com/stats

    * http://www.gvu.gatech.edu/research

    * http://en-us.nielsen.com/tab/industries/media/online_publishers


    > TIP Whenever possible, try to speak to members of the site''s target audience.
    Inquire about their online usage to determine what they might look for at the
    proposed website. I like to walk them through a sample scenario, asking first
    how they might try to find the site, and then what they might like to do there.


    # Information Architecture


    Another aspect of the site that is important to plan ahead of time is the way
    the content is structured, or information architecture. Of course, there is no
    perfect way of organizing content, at least not that works for everyone. Instead,
    you must look at all the possible ways of arranging the content on the site and
    select the method that works best for your project''s goals, as well as the needs
    of the target audience.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'Suppose you were designing a site for the youth group at your church. The proposed
    content for the site includes event listings, trip details (and any associated
    paperwork), staff bios, information for parents, links to social networking sites,
    and general information for students. Once you have identified the content categories,
    it''s time to figure out how to structure them within the context of a website
    to identify how users move through the site.


    # All-in-One


    You could just put all the information on a single page. For sites with only a
    little bit of content, or those that serve primarily as a way to access information
    on other sites (through links), this is a good choice. But for the youth group
    site? Probably not.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_41_0.png)


    # Flat


    Another option is to have all the pages at the same level, where each page is
    accessible from every other one. This is probably the most common method of organizing
    content for small businesses and organizations (like our youth group). You''ve
    probably seen sites like this a lot, where you visit the home page and find links
    to pages titled “About Us,” “Contact Us,” and “Home.” Sites organized like this
    may or not have a “site map” or “index page” as an additional resource for quick
    linking.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_41_1.png)


    # Hub-and-Spoke


    Sometimes you need a way to structure content so that certain sections are separate
    from others, and each one follows a linear structure. One example might be an
    online training site, where you return to your “desk” after watching a class lecture
    or taking a test.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_41_2.png)'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Strict Hierarchy


    What you wanted to offer several sections geared toward the different people who
    might visit the site? For the youth group site, those might be “Parents” and “Students.”
    With a strict hierarchical structure, visitors to the Parents section would only
    be presented with information for parents. They’d have to go back to the home
    page and switch to the Students section to see that information.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_42_0.png)


    # Multidimensional Hierarchy


    This type of structure is similar to a strict hierarchy, but with one key difference:
    In this case, it is possible to access content from a different section without
    first returning to the home or gateway page. Multidimensional hierarchy has become
    a really popular way to lay out content on large, complex websites. A great example
    of this might be a large online bookstore that lets you view books by title, author,
    subject, or even keyword. The content can be reached by any of these methods.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_42_1.png)


    > NOTE A great resource for learning more about web development is Web Design
    from Scratch (www.webdesignfromscratch.com), which is run by a web design agency
    in London called Scratchmedia. The information architecture classification I used
    here was based on Scratchmedia’s research and included with their permission.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Documentation


    Finally, I want to spend a few minutes talking about how to document your project.
    Typically, this does not come easy to designers. We often focus on the more creative
    aspects of a project and sometimes neglect the more mundane tasks. Having said
    that, I encourage you to come up with a method of documenting your projects that
    meets the needs without being cumbersome. The easier you make documenting the
    project, the more likely you are to just do that.


    What needs to be documented? Anything that might affect how the site ultimately
    functioning. The most commonly documented aspects of a website project include:


    +   * Structure A site map might be used to document the information architecture
    of the site before it is built (see Figure 1-1).

    * Layout A wireframe document outline where a particular page''s elements might
    be placed (see Figure 1-2).

    * Navigation A storyboard can be used to document a target user''s ideal path
    through the site (see Figure 1-3).

    * Style A mockup or comp is typically created in a design program used to figure
    out the site''s look and feel (see Figure 1-4).


    Aside from these documents, which are typically produced during the beginning
    phases of a project, there are several other types of documents that may be created
    even before a project has really begun. When a project is either pitched or just
    getting off the ground, the web team will likely create some sort of proposal
    to the client to explain how the site will be built. After a project has been
    officially contracted, a Statement of Work is created to spell out what work is
    being performed for what price.


    If the site is complex, particularly if it requires coding or programming beyond
    basic HTML, a technical specification should also be included in the documentation.
    This document identifies the technologies to be used and how the site''s functionality
    will be achieved with each one.'
  merge: -1
