  md: '# Track Your Progress


    Anyone investing in a website needs some method of measuring the success of those
    efforts. In the search engine optimization world, there are a few things you want
    to monitor:


    +   - **Site visits and page views** The amount of traffic on your site is obviously
    an important part of your site''s success. Measuring the number of people accessing
    your site each day, week, and month can help you plan when and to advertise for
    additional customers.

    - **Incoming links** When other site links to yours, the popularity of your site
    increases. (As I mentioned, Google considers a site with lots of incoming links
    to be more important than a similar one without any incoming links.) You can help
    increase your chances of acquiring more incoming links by performing tasks as
    reviewing relevant products on Amazon and other stores, creating a page about
    your business on Wikipedia and commenting on relevant blogs.

    - **Conversion rate** Any web owner obviously wants to meet the goals set for
    the site or for a particular advertising campaign. Whether the goal is to increase
    sales of a particular product or get more people to sign up for your newsletter,
    you can track progress by monitoring goal version data. In other words, the data
    tells how many site visitors actually purchased a product or signed up for a newsletter.

    - **Bounce rate** Monitoring the number of people who view only one page of your
    site or leave the site quickly can identify how engaging the site''s content is.
    If a particular page on the site has a high bounce rate, it''s probably time to
    reevaluate the content on that page.


    The most used method of monitoring these and other aspects of websites is a tool
    called Google Analytics (www.google.com/analytics). To use Google Analytics (GA),
    website owners add a bit of code to each page they want to monitor. Then, GA tracks
    how people find the site, how they use it, and how you can help them more efficiently
    and effectively.


    Because Google Analytics is a free tool, you really have no excuse to track how
    your site is performing. You simply add a bit of code to your pages and then watch
    the results with Google''s browser-based tool (see Figure 9-3). Better yet, take
    advantage of Google''s other webmaster tools (found at www.google.com/webmasters)
    to really boost your site''s online presence.'
