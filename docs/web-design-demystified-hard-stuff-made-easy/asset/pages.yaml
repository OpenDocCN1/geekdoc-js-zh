  md: '# Creating Design Mockups


    Well, you''ve read all about the unique aspects of designing for screens, but
    you may still be wondering exactly to get started. Suppose you read through the
    first chapter and did some planning and are now ready to work in a graphics editor.
    You may have some ideas as to the colors you''d like to use, or maybe you have
    a particular navigation method in mind. Hopefully, you''ve spent some time sketching
    possible layouts and selected one or two to move forward with. That''s all great.
    Now it''s time to cement these ideas with a comprehensive design mockup (also
    called a comp).


    I typically start in Photoshop, with a new file that''s roughly 1000 pixels wide
    by 800 pixels tall, at 72 dpi (dots per inch). This is a good size for most of
    my projects (of this writing, I am typically targeting a screen resolution of
    at least 1024 × 768), as is large enough to give me some room to work. Consider
    your target audience before selecting the size of your page.


    After you create your blank file, begin by importing all of the page elements,
    such as the logo and any existing company graphics. Because your file will probably
    grow to contain many layers, I suggest taking advantage of the organization options
    in your graphics program. For example, if you''re using Photoshop, Figure 2-7
    shows how you can gather related layers into groups to help keep your layers cluttered.


    > NOTE Learning a graphics program like Photoshop is beyond the scope of this
    book, but I will offer related tips as much as possible. Refer back to some of
    the outside resources mentioned in Chapter 1 to learn more about Photoshop and
    your graphics editors.


    From time to time, there may be aspects of the page that you need to import from
    other sources. That might include stock media (which is discussed in the next
    section), sample text, or placeholders for elements to be created by the browser.
    For example, if your mockup shows a page that contains form elements, you could
    take screen captures of those elements and paste them into the mockup to give
    a client an idea of how it will look when it''s finished. Or, you can download
    copies of all sorts of form elements from a site like www.webdesignerstoolkit.com.'
  merge: -1
  pgno: 69
