    # Maintaining Pages with Adobe Contribute


    After you''ve created templates and built pages off those templates, you''ve created
    a site that can easily be maintained by nontechnical editors. In particular, there
    is one piece of software nontechnical editors can use to easily update pages created
    with Dreamweaver templates.


    Adobe Contribute is a website management tool to build with Dreamweaver files.
    Some people refer to Contribute as a scaled-down version of Dreamweaver, geared
    toward nontechnical website managers.


    Visit www.adobe.com/contribute to learn more about this website management tool.


    When a user opens a template-based page in Contribute, the tool recognizes regions
    which are editable and which are locked. If someone tries to edit a noneditable
    region in Contribute, he is prevented from doing so. Furthermore, while a Dreamweaver
    user can override a noneditable region by disconnecting the page from its template,
    Contribute users are not able to do so. This gives website developers powerful
    control over which aspects of their pages can be edited by nontechnical website
    maintainers.


    # Media Types


    So far in this chapter, I''ve mostly discussed using templates to speed up web
    development and maintenance. But there is another important reason templates are
    used in web design: to target different users or display methods.


    For example, creating a main style sheet for your website means that all the pages
    will carry the same look and feel when viewed in a web browser. But what about
    how the pages display when they are printed or viewed on a mobile device? You
    can create additional templates, or in this case style sheets, to specify how
    your pages are displayed in different types of media.'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'By default, style sheets apply to all media types. But it is easy to create
    and link additional style sheets for different media types. The following code
    sample shows three different style sheets might be used to target three different
    display methods:


    ```

    <link rel="stylesheet" media="screen" href="screen.css" type="text/css">

    <link rel="stylesheet" media="print" href="print.css" type="text/css">

    <link rel="stylesheet" media="handheld" href="screen-small.css" type="text/css">

    ```


    This method works when you need to set up completely different style sheets for
    each different media type. If instead, you only want to change a few styles within
    your main site style sheet, you can use the @media rule in your style sheet, like:


    ```

    @media print {

    body { font-size: 10pt; }

    @media screen {

    body { font-size: 12px; }

    ```


    Possible media types (whose names are case-sensitive) include:


    +   - all

    - braille

    - embossed (for paged Braille readers)

    - handheld

    - print

    - projection

    - screen

    - speed

    - tty (used for teletypes, terminals, and portable devices with limited display
    capabilities)

    - tv


    # Printer-Specific Style Sheets


    Ever wished a webpage and seen a button labeled "click for printer version" or
    something similar? While that may have led to a PDF or Microsoft Word version
    of the page, it likely led to the same page displayed with a printer-specific
    style sheet referenced in one of the two methods I just outlined. When creating
    printer-specific style sheets, here are a few things to keep in mind.'
  merge: -1
  pgno: 217
- img_proc: true
  md: "# Chapter 8 TEMPLATES AND MEDIA TYPES\n\n201\n\n# Color\n\nFirst, always set\
    \ your background color to white and remove any background images you might have\
    \ already assigned to the page. This ensures the user doesn't waste ink printing\
    \ in a black background with white text for no real reason. What may have looked\
    \ attractive on screen might only be a big bleed of ink on the printed page.\n\
    \nAlso, consider the color of text-based content to make sure it will be readable-even\
    \ if the page is printed in black and white.\n\n# Links\n\nIf you turned your\
    \ link underlines off, be sure to turn them back on. Likewise, considering them\
    \ bold or otherwise emphasized so they'll stand out even more if printed in black\
    \ and white. CSS even allows you to specify that link URLs should be displayed\
    \ after the linked text. This would be quite useful if someone prints your page\
    \ and wants to access its links at a later date.\n\nThe following code specifies\
    \ that the URL should be printed after both visited and unvisited links:\n\n```\n\
    a:link:after, a:visited:after {\n  content: \" + attr(href) + \"\";\n}\n```\n\n\
    If you have a lot of internal links on your pages, you may need to add your domain\
    \ name to this code. Without it, users might see only a portion of the URLs printed,\
    \ such as index.html or aboutus/contact.html. Here's how to add the domain:\n\n\
    ```\na:link:after, a:visited:after {\n  content: \" + (http://www.company.com\"\
    \ + attr(href)) + \"\";\n}\n```\n\n> TIP If you have a combination of internal\
    \ and external links on your pages, you create a custom class to attach to only\
    \ those links you want to affect this type of style sheet declaration.\n\n# Fonts\n\
    \nThe standard font measurement for printed pages is points. Therefore, if you\
    \ used another measurement for your screen pages, such as pixels, be sure to change\
    \ that for your printer-specific style sheet."
  merge: -1
