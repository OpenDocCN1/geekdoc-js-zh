    You can also navigate through the host computer''s directory structure by clicking
    the folder names to expand or condense them. Most FTP tools also allow you to
    create new folders on the remote computer and to adjust the settings of those
    folders.


    This is the most basic method of FTP, where you are simply copying files from
    one computer to another. There will likely be additional options and settings,
    depending on which FTP tool you decide to use.


    Here are a few desktop FTP programs you might check out if you''re using a Windows
