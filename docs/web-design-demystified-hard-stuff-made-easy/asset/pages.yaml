- img_proc: true
  md: '# Page Size


    Whereas webpages are designed for screen format (landscape, 800 × 600 pixels,
    and so forth), printed pages should be designed for the paper on which they will
    be printed. Most users in the United States will probably print in portrait format
    on standard letter-size paper (8.5 × 11 inches). Be sure to leave at least a half-inch
    margin on all sides.


    # Positioning


    If you styled any aspects of your page to be absolutely positioned, consider removing
    that declaration and allowing the content to flow freely on the page.


    # Image Resolution


    Images created for the Web are low in screen resolution (72 dpi) because that
    make them quicker to download. It does not, however, make them pretty when printed.
    In fact, printed web graphics often look quite bad. Therefore, when creating alternate
    versions of webpages that will be printed, avoid graphics whenever possible. If
    that''s not an option, it''s probably best to instead offer the page as a downloadable
    PDF. I prefer turning off the images and navigation whenever possible to allow
    users to save on ink they might otherwise waste printing images they do not need.


    # Mobile-Specific Style Sheets


    Due to the large number of people accessing the Web from handheld devices, it''s
    common for modern websites to offer custom versions geared towards those users.
    In particular, you want to restructure the content so it can be easily viewed
    on smaller screens.


    First list the areas of concern for mobile-specific style sheets, I need to mention
    a few caters. There are some handheld devices that do not support enough CSS to
    recognize different media types. Those devices, unfortunately, will continue to
    display the screen media styles.


    Second, there is a handheld device that (as of this writing) will display webpages
    with mobile-specific style sheets even though its screen is a bit larger than
    most phones and personal digital assistants (PDAs). Apple''s iPad, launched in
    2010, contains the word "mobile" in its user agent string, which means it should
    follow styles specified in the handheld category. You could use a detection script
    to identify iPad users and deliver a more appropriately styled page.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Chapter 8 TEMPLATES AND MEDIA TYPES


    Refer to http://davidwalsh.name/detect-ipad and http://detectmobilebrowsers .mobi
    for some examples.


    # Links


    If you''ve ever tried to click a link on a small, handheld screen, you can appreciate
    how difficult it can be. With that in mind, take steps in your mobile style sheet
    to make your links as easy as possible to click. You might consider using display:block
    to cause text links to span the entire width of the content area (thereby making
    the clickable area larger), and add a background color to make them highly visible.


    # Images


    Many mobile users pay according the amount of data transferred in a given month.
    This means your hefty images can cost users money, in addition to extra download
    time. Consider reducing image sizes to make them quicker to download and allow
    the text to take center stage. Certainly any images that are crucial to the content
    delivery could be removed entirely.


    Because many mobile users access webpages via text-only browsers, it''s all the
    more important to include alternative text for every image in your site.


    # Page Size


    Whenever possible, avoid absolute widths. There are just so many different screens
    in the mobile market that you''ll end up very few people with a page width of
    150 pixels, for example. Stick with relative widths, such as 100 percent, to reach
    the widest possible audience.


    # Positioning


    Designs based on absolute or fixed positioning, as well as those with floats rarely
    translate well on a handheld device. Consider that a fluid, single-column layout
    is much easier to navigate and read on small screens.


    To advantage of every square pixel of space, try removing the extra margins and
    padding you might have added when creating your default style sheet. You rarely
    need more than three to five pixels of buffer space between the edge of the mobile
    browser and your page''s content.


    When reviewing the positioning of your content divisions, take a critical look
    and decide whether a few of those content divisions could be hidden from display
    on mobile browsers. The advertisements might be necessary on the'
  merge: -1
