    # # Testing the Display


    After you''ve completed your code testing, it''s time to verify that the page
    displays as you expect in your target browsers and operating systems. Throughout
    this book, I stress the importance of checking your pages in multiple browsers
    and multiple computer systems to make sure they appear correctly.


    Even if you don''t have more than one type of computer or browser, after your
    pages are live (uploaded to a web server), you can ask friends to test them for
    you. You can also visit local libraries, schools, and sometimes even shopping
    malls to see how the sites fare in different environments.


    Each time you visit the site on a different computer, record the browser, monitor
    size, resolution and operating system used. This way, when you see errors or bugs,
    you can get help in determining the problem. Table 9-1 provides a sample testing
    checklist to help you record results.


    Alternatively, you can use an online tool Adobe''s Lab Lab (www.browserlab.adobe.com),
    Browshots (www.browshots.org), or Litmus (www.litmusapp.com), which will take
    screen captures of your page on a variety of different computer systems and browsers.


    # # Testing the Usability


    A key aspect of a website''s success is how well it functions with users. Many
    designers fail to perform usability testing on sites before taking them live,
    leaving everyone to wonder whether the site will work. Instead, I encourage you
    to perform some simple, yet effective, usability tests on any site you build before
    it goes live.


    People often think usability tests are expensive and time-consuming, when in fact
    they can be a cost-saver when you consider how much time you might spend on a
    redesign to fix an unusable site. You don''t need any fancy equipment or specialized
    training to test for usability.


    In its most basic form, a usability test requires only three things: a website,
    a tester, and a facilitator. In fact, those three things don''t even need to be
    in the same room (although that is preferable). I have even performed usability
    tests over the phone while watching the user''s screen through a conferencing
    tool such as WebEx (www.webex.com).'
