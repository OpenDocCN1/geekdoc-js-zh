- img_proc: true
  md: '# Specify the Type of Positioning


    First, you need to specify the type of positioning being used. This is done with
    the position property, using the value that corresponds to whichever method of
    positioning is used. (Note: If you do not specify a method of positioning, the
    default "static" value is used.)


    ```

    #header { position: absolute; }

    ```


    Once you determine which method of positioning you''ll use, you must figure out
    the lineage of the element. In other words, you need to identify the containing
    block that holds the element being positioned. When elements use absolute or fixed
    positioning, they are placed relative to their closest, positioned containing
    block. If there is no such containing block, the browser window is used.


    > TIP means if you want to absolutely position an element, it''s best to place
    it within a content division that is also positioned (using any method except
    the default static value).


    # Set the Dimensions


    After the type of positioning has been identified, it''s time to specify where
    to position the element. The top, right, bottom, and left properties are used
    to tell the browser where each edge of the box should fall within the page:


    ```

    #header { position: absolute;

    top: 20px;

    left: 20px; }

    ```


    When an element is relatively positioned, you need only specify the locations
    of two perpendicular sides (such as top and left to tell the browser where to
    place the upper-left corner of the box) in relation to its current location.


    > NOTE Specifying two parallel sides can cause the browser to become confused
    because left: -10px and right: 10px essentially cancel each other out.


    But when you absolutely position an element, you can specify the locations of
    all four sides needed. Or, you can set the position of just two sides of the box
    and then add the height and width properties to specify the size of the box (and
    ultimately the other two sides). Compare the following two code snippets to see
    how an element is affected by these different strategies.'
  merge: -1
  pgno: 165
- img_proc: true
