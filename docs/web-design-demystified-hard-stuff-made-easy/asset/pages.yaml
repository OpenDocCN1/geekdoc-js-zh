- img_proc: true
  md: '# Working with Dreamweaver Templates


    A common way to create a template in Dreamweaver is to first start with an existing
    webpage you designed. This might be the first of a series of interior pages for
    a large website being developed. Suppose you create the initial page according
    to the original design mockups and get it approved from the client. Now you need
    to build the rest of the pages that follow the same style and layout as the first
    page. Here’s where Dreamweaver’s template feature comes in.


    Creating a template depends on whether you''re starting from scratch or an existing
    page:


    +   - To create a template from an existing page, choose File | Save As Template,
    give it a unique name, and specify the site in which to save the file. Then click
    Save.

    - To create a template from scratch, choose File | New and select HTML Template
    as the page size before Create.


    When you create a new template in Dreamweaver, it is given a .d extension. All
    templates must be stored in the site’s Templates folder (if the folder doesn''t
    already exist, Dreamweaver will create it for you).


    > TIP If you''re new to Dreamweaver, check out this helpful three-part series
    about building websites in Dreamweaver from Adobe’s Developer Connection: www.adobe.com/devnet/dreamweaver/articles/first_website_pt1.html.


    # Template Regions


    After you''ve identified the file as a template, it is time to specify the types
    of regions in the document. Dreamweaver allows for four types of template regions:


    +   - Editable regions can be edited and changed by any user. All templates need
    to have at least one editable region. An example of an editable region might be
    the page headline or its main text area.

    - Locked regions cannot be edited or changed by any user unless the user is a
    template administrator or when the template is edited in Dreamweaver. An example
    of a locked region might be the navigation bar of the page. This is the default
    type of region for a template.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Chapter 8 TEMPLATES AND MEDIA TYPES


    +   * Optional regions can be hidden or shown by any user. Depending on the parameters
    you set, optional regions can contain editable regions. An example of an optional
    region might be a box linking to related content.


    +   * Repeating regions can be duplicated, edited, and changed by any user. An
    example of a repeating region might be a row of data within a table.


    To create a new region, select the area that contains the content to be included
    in the region and choose Insert | Template Objects. Then select the type of region
    you''d like to insert (editable, optional, or repeating).


    **TIP Any content that is not inside an editable, optional, or repeating region
    is automatically considered locked.**


    When you create a region, Dreamweaver adds comments around the section in your
    HTML code. Here''s an example of these comments, as they create an editable region
    to contain the page title:


    ```

    <-- TemplateBeginEditable name="doctype">

    <title>FREE Delivery</title>

    <!-- TemplateEndEditable -->

    ```


    You shouldn''t remove those comments, unless you want to get rid of them.

    In addition, you can create editable attributes. This lets you unlock an HTML
    tag attribute in a template so that attribute can be edited within a template-based
    page. For example, you can lock which image appears in a webpage, but allow the
    alignment of that to be editable.


    > Still Struggling

    Refer to the Template section of Adobe''s Dreamweaver Developer Connection: www.adobe.com/devnet/dreamweaver/templates.html.


    # Using Library Items


    One of the great benefits of templates in Dreamweaver is that you can reuse layouts
    for multiple pages. Dreamweaver also lets you reuse smaller chunks of code throughout
    multiple pages on a website by storing them inside a site library.'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'In fact, you can put anything that would be in the body of the document into
    a library item.


    These chunks of code are referred to as library items. These files are saved with
    an .lib extension and housed in a folder called Library in the main directory
    of the website. To create a library item, try one of the following actions:


    +   - Select File | New, then choose the Blank Page (or Basic Page) category,
    and select Library Item.

    - Highlight a part of a file and select Modify | Library | Add Object To Library.

    - Highlight a part of a file within the body of the document, and click the New
    Library item at the bottom of the Assets panel.


    After a code selection is saved as a library item, it can easily be used throughout
    as many times you feel necessary. To use a library item, first make sure your
    library is visible in the Assets panel (click the book icon on the left side of
    the Assets panel to open the library). Then, drag the item into any open page
    to insert.


    If you switch to Code view in Dreamweaver, you can see the code that was added
    when you dragged the item into the page. Here''s an example of a library item
    I use to add fine print to HTML e-mails for a client:


    ```

    <!--BeginLibraryItem "Library/LD-Fine-Print.lib" -->

    <p style="font-family:Verdana, Arial, Helvetica, sans-serif;font-size:10px;color:#666666;width:20px;height:660px">Let''s
    Dish! is the region''s leading metal-assembly chain, where customers stock up
    on homemade, freezer-ready meals take the stress out of dinner. For more details
    visit letadish.com.\</p>

    <!--EndLibraryItem -->

    ```


    Whenever you need to edit a library item, you simply double-click the item in
    the library category of the Assets panel and make any necessary changes. Then,
    all pages using that library item will be automatically updated.


    NOTE You will still need to upload all changed pages to the live web server edits
    have been made to any corresponding library items.'
  merge: -1
