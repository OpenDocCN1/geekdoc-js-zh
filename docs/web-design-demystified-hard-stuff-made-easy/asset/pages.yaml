  md: 'at a list of choices like "Generate Table" or "Generate CSS.\ At this point,
    you may be wondering, "What’s the difference?”


    When HTML was first put into practice, the pages being developed were quite simple.
    At that point, "tables" were used to re-create tabular data, which is typically
    housed in spreadsheets. But then, web designers came the scene and started using
    tables to lay out more complex webpages, placing different aspects of the page
    into each table cell and hiding the edges (borders) to make the design appear
    seamless.


    Eventually a better solution became available: positioning with cascading style
    sheets. Frankly, all modern browsers now use CSS for positioning, which is great
    news for web designers. CSS positioning requires less code than table-based page
    layouts and offers more flexibility. CSS layouts are also easier to maintain than
    their table-based counterparts.


    Having said that, CSS positioning is not yet supported by most e-mail readers,
    as of press time. Because of that, most designers rely on table-based layouts
    for any pages created for e-mail.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_92_0.png)


    # Still Struggling


    The layout options vary according to the graphics editor being used. So when you
    get to this point in the design process, it’s a good idea to review tutorials
    that address the specific export options available for your graphics editor. For
    Fireworks, try http://tv.adobe.com/watch/learn-fireworks-cs4/creating-cssxhtml-layouts.
    For Photoshop, try http://tv.adobe.com/watch/assets-in-motion/episode-4. To see
    how you can use Fireworks and Photoshop together to streamline the process, check
    out http://tv.adobe.com/watch/everyday-timesavers-web/quickly-transform-photoshop-layouts.


    # Coding the File Structure


    When I first start the coding aspect of a project, I typically create a new folder
    on my hard drive to house all the related files. Then within that folder, I create
    a few subfolders. The most important of these is probably my images folder. It
    is a good idea to place all the images for a site within a particular folder instead
    of leaving them strewn about various places. This makes it easier to'
