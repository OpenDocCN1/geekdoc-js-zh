  md: '# 3

    Building the Pages


    After you''ve completed a mockup, with everything looking just how you''d like
    to display in the browser, what''s next? Wouldn''t it be great if we could wiggle
    our noses and have the graphics editor do all the dirty work to make the file
    web-ready? Yes, and no.


    Most web graphics editors do include some options to speed up the process and
    make it almost effortless, but you''ll undoubtedly need to do a bit of tidying
    up your files to get them in tip-top shape for web viewing. That''s exactly what
    this chapter focuses on: the basics of building pages to be viewed in a browser.


    # CHAPTER OBJECTIVES


    In this chapter, you will


    +   - Identify web-friendly file formats for images

    - Determine how the compression method affects the image

    - Slice mockups for web delivery

    - Select the best method of exporting images and text for your project

    - Recognize basic CSS content'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Web File Formats


    First, let''s spend a few minutes covering exactly which types of files can be
    viewed in a browser. If you''ve ever tried to open a Photoshop (.psd) or Flash
    (.flv) file in your browser, you''ve probably found out that doesn''t work well.
    Those file formats are used as for building pages in Photoshop and Flash, but
    not for viewing in a browser. In effect, .psd and .flv files contain more information
    than the browser needs. So, you need to flatten and condense those files in a
    way that is suitable for display in a browser.


    # Key Terms


    Image files are typically saved as one of three browser-friendly formats: .jpg,
    .gif, and .png. (Flash files are typically exported as .swf files, but can also
    be saved in a variety of other web-friendly formats, depending on the project.)
    Before we cover the details about GIFs, JPEGs, and PNGs, I need to define a few
    new terms that relate to those file formats.


    # Compression Methods


    Web graphic file formats take your original image and compress it to make it smaller
    (in file size) for Web and E-mail delivery. Two basic types of compression methods
    are used for web graphics: lossy and lossless.


    Lossy compression requires data to be removed permanently from the image to compress
    the file and make it smaller. Typically, areas with small details are lost as
    the level of loss is increased. Lossless compression is the opposite of lossy,
    in that no data is lost when the file is compressed. In these cases, the actual
    data looks the same whether it''s compressed or uncompressed.


    > While lossless compression does not result in a loss of data, the file can change
    in appearance if colors are removed during compression. I comment on this in the
    section about GIFs.


    # Color Mode


    All web images are displayed in the standard screen-based RGB (red, green, blue)
    color mode. But when you compress an image to make it smaller in file size, it
    can be helpful to remove some of the colors.'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'For this reason, some web file formats are smaller, more restricted color palettes.
    Others are capable of handling millions of colors, and instead shrink the file
    size in other ways. Table 3-1 (shown after the “Key Terms” section) identifies
    the number of colors available in each web file format discussed.


    # Transparency


    When you view an image and are able to see through parts of it, that image is
    said to have transparency. Some graphics editors show this transparency by displaying
    a gray and white checkerboard behind the image, as indicated in the following
    screen capture from Photoshop.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_78_0.png)


    **TIP** When a web graphic contains transparency, the webpage’s background color
    or background image shows through the transparent areas.


    File types that support transparency fall into two categories: binary and variable.
    Binary transparency means any pixel is either transparent or opaque. Variable
    transparency, also known as alpha channel, allows pixels to be partially transparent
    or partially opaque; therefore, it is capable of creating subtle gradations.


    Certain file types do not support transparency at all. If the image shown in the
    previous illustration were to be saved in a format not supporting transparency,
    the areas shown in a checkerboard would be filled with a solid color.


    # Interlaced/Progressive


    Have you ever viewed a webpage and noticed that a web graphic first appeared blocky
    or fuzzy before gradually coming into focus? If you frequently access the Web
    via high-speed connection, you probably haven''t encountered this as'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'much as you might have with a slower connection, or as much as you might

    with a web-enabled mobile device.


    When you save web graphics, you have the option to make them interlaced

    or progressive (depending on the file format), which essentially means the

    graphic is displayed at multiple levels of clarity, from blurry to clear.


    Noninteraced/nonprogressive images must be fully loaded before the browser

    displays them in a webpage. If you have a large image on a page accessed with
    a

    slower connection, users may see only blank space while the file is downloading.

    If it takes too long, users may leave your site. For this reason, it is helpful
    to web

    users designers save web graphics as interlaced or progressive.


    # GIF


    Originally designed for online use in the 1980s, GIF uses a compression method

    is well suited to contain certain types of web graphics. This method, called LZW

    compression, is lossless. Even though means no data is lost when the file is

    compressed, the nature of the GIF file format is such that it does not support
    more

    256 colors. Compare that to other graphics formats that support millions

    of colors, and you can see how this lossless format isn''t completely lossless.


    NOTE GIF is officially pronounced with a soft g.


    Because GIFs are limited to a certain number of colors, the following types of

    images lend themselves to being saved in this format:


    +   * Text

    * Line drawings

    * Cartoons

    * Flat-color graphics


    # JPEG


    The JPEG file format (pronounced jay-peg) was created by the Joint Photo-

    graphic Experts Group, who sought to create a format more suitable for com-

    pressing photographic imagery than GIF.


    One major difference between GIFs and JPEGs is that JPEGs don''t contain

    an exact set of colors, but are capable of displaying as many colors as are neces-

    sary for the file. However, when you save a photograph as a JPEG, you might

    consider all the colors in the file to be merely recommended, because the lossy'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Chapter 3 BUILDING THE PAGES


    compression could require some colors to be altered. In addition, web JPEG files
    must be in the RGB (red, green, blue) color mode, as opposed to the print standard
    of CMYK (cyan, magenta, yellow, black).


    The JPEG format is well suited for the vast majority of your photographic web
    images.


    # PNG


    PNG (pronounced P-N-G or ping) stands for Portable Network Graphics and is the
    newest and most flexible of these three graphic file formats. Many designers consider
    PNG to be the "best of both worlds" as it offers advantages over GIFs and JPEGs.


    NOTE PNG was recognized as an international standard in 2003.


    My favorite aspect of the PNG format is its ability to save files with alpha transparency.
    This feature (which is not available with GIFs or JPEGs) means you can place an
    irregularly shaped image on top of a multicolored background seamlessly. In other
    words, you could have one image fade into another without an obvious edge between
    them.


    An additional benefit of PNG is its gamma correction. The PNG file format has
    the capability to correct for differences in how computers and monitors interpret
    color values. However, as of this writing, no browser has yet to support this
    feature.


    So... why isn''t this the only file format I''m discussing if it''s so good? Because
    PNG wasn''t an original web file format, users of older browsers needed to download
    a plugin-in to view web graphics in the PNG format. Even though all modern browsers
    support the basic characteristics of PNGs, web designers have been slow to uniformly
    adopt this feature-packed file format.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_80_0.png)'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# 64 WEB DESIGN DeMYSTiFiED


