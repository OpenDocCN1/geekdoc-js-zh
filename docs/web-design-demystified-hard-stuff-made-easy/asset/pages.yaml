  md: '# 20 WEB DESIGN DeMYSTiFiED


    about having a custom domain name (such as www.wendywillard.com). Visit http://sites.google.com
    to get started.


    NOTE Other sites that offer free personal site hosting include Bravehost (www
    .bravenet.com/webhosting) and Tripod (www.tripod.com). Also, check with your e-mail
    or Internet service provider to see if you already are eligible for free hosting
    with your existing account.


    Because these sites are largely targeted to beginners, they make uploading and
    maintaining your webpages a breeze. Most use web-based tools to help you create
    a site, so you don''t need to purchase or install any software.


    # Business Site Hosting


    Most businesses cannot take advantage of free hosting, because many of those tools
    prohibit use by for-profit companies. For the majority of businesses, paid offsite
    hosting is therefore the most effective and popular solution. Hosting like this
    either be on a shared or dedicated server. While a shared server can be significantly
    less expensive than one dedicated to your needs, it may not be possible in all
    situations. For example, if you run custom web applications, requires a high level
    of security, or needs a large amount of hard drive space, a dedicated server is
    preferred.


    TIP If a dedicated server is not in the budget, a virtual private server (VPS)
    might be adequate.


    Even within the category of paid offsite hosting there are many different service
    levels. If you do a search for "website hosting" you will be overwhelmed with
    choices. So do you decide which one to select? Here are a few questions to ask
    when looking for business hosting:


    +   * How much hard drive space is included?


    +   * How much traffic can the site generate per month? (Ask for some average
    traffic rates for similar sites to compare.)


    +   * How many e-mail accounts are included?


    +   * What kind of access is permitted? (You want to make sure you have FTP access
    to upload files.)


    +   * What kind of support is offered, and when is the support team available?


    +   * How often are backups made? How are they accessed?'
