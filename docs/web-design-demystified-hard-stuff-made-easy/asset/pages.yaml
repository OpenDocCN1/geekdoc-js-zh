    # Lists


    Many of us use lists to stay organized at home and work. Websites also frequently
    use lists to organize content on a page. As an added benefit, lists can help the
    usability of webpages because they make the text content more readable.


    There are three basic types of lists in HTML, as outlined in Table 4-2. Remember
    the purpose of the list elements is not to style the content to structure it.
    As such, if you''d like to change the color of the bullets or adjust the indentation,
    wait until you add a style sheet to the page for.


    | TABLE 4-2 Types of HTML Lists |

    | Type of List | Sample Code | Sample Browser Display |

    | Ordered—each list item is preceded by a number or letter | Homework: <ol><li>Read
    pgs. 4-10</li><li>Do the exercises on pg. 11</li><li>Select a science fair project</li></ol>
    | Homework: 1. Read pgs. 4-10 2. Do the exercises on pg. 11 3. Select a science
    fair project |

    | Unordered—each list item is preceded by a bullet | Homework: <ul><li>Read pgs.
    4-10</li><li>Do the exercises on pg. 11</li><li>Select a science fair project</li></ul>
    | Homework: • Read pgs. 4-10 • Do the exercises on pg. 11 • Select a science fair
    project |

    | Definition—con-tains terms, which are flush left, and definitions, which are
    indented | <dt>HTML</dt><dd>Hypertext Markup Language</dd> <dt>FTP</dt><dd>File
    Transfer Protocol</dd> | HTML Hypertext Markup Language FTP File Transfer Protocol
    |'
