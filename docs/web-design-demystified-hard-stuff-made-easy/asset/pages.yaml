  md: '# chapter 8


    # Templates and Media Types


    When you are designing for the Web, at some point you will face the question of
    when to use a web template. In web terms, a template is an empty layout waiting
    for your content. Throughout the course of this chapter, we''ll look at ways you
    can use templates to save time both during development and maintenance of a site,
    as well as to make your pages more accessible to users.


    # CHAPTER OBJECTIVES


    In this chapter, you will


    +   * Recognize the benefits of using templates in web design

    * Differentiate between hosted and downloadable blogging templates

    * Understand how Dreamweaver templates can help nontechnical users maintain webpages

    * Identify ways to customize style sheets for printing and mobile users


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_202_0.png)'
  merge: -1
  pgno: 202
- img_proc: true
  md: '186 WEB DESIGN DeMYSTifiEd


    There are pros and cons to using templates. On the positive side, templates can
    save you a lot of time (and money!) in developing a layout. In, if you''re new
    to web design, using a template can help you learn more about webpage layout you
    work with existing files.


    The drawbacks include a potential lack of originality and flexibility. While some
    templates are easily customized, others can require so much work to move elements
    around the page that you''d be better off writing your own code.


    Stock templates are available for all sorts of sites, from very basic marketing
    sites to corporate blogs and even shopping sites. The first half of this chapter
    helps you identify the right type of template for your needs and then use it to
    get started on the right foot.


    In the second half of the chapter, we move on to another sort of template: one
    specifies how your pages will display in alternative viewing conditions, such
    as the printed page or a mobile device. Because these types of conditions can
    cause a page to appear completely differently from the way they do in traditional
    desktop-based web browsers, it''s important to create special instructions for
    the browser.


    # Finding Stock Templates


    Thousands of sites offer templates for free or for sale. Because of the sheer
    number of templates available, it''s easy to get distracted by the many flash
    options. While searching for a web template, it''s important to focus on the goals
    of your site and what users needs to accomplish through it.


    With the large number of templates available, it can be difficult to find quality
    products. Here are a few guidelines to consider as you search:


    +   - Files should be editable using your favorite web editor

    - Coding should be up to W3C standards, and ideally the files should validate
    (http://validator.w3.org)

    - Files should come with instructions regarding how to edit and upload

    - Pages created should display in any modern web browser without generating errors


    **TIP As mobile users make up a growing part of web audiences, many templates
    also include mobile versions. If you are interested in developing a mobile version
    of your site, be sure to look for templates with mobile options.'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'Chapter 8 TEMPLATES AND MEDIA TYPES


    # Template Options


    The first step is to identify the type of template you need. Many different options
    exist, so I outlined the basic types of templates in Table 8-1.


    Basic website templates are fairly easy to download and use. Shopping cart and
    CMS templates, however, require you to have some knowledge of the site''s host
    environment. For example, before you can even start searching through CMS templates,
    you must know which CMS is used.


    The most popular content management systems include WordPress, Joomla!, and Drupal,
    each of which is freely distributed as open-source software. You have that piece
    of information, it''s much easier to sort through the various options for your
    specific tool.


    | TABLE 8-1 Types of Web Templates |

    | Type | Description | Included Files |

    |---|---|---|n| Single-page template | Includes code and graphics to create a
    website that uses design for all its pages. (Some single-page templates also include
    Photoshop files.) | .html<br>.css<br>.psd (sometimes) |

    | Full site template | Includes all code and graphics needed to create a home
    page and interior pages for the site. (Some website templates also include Photoshop
    files and animations.) | .html<br>.css<br>.psd (sometimes)<br>.fla (sometimes)
    |

    | Flash template | Includes Flash files to create a website built entirely in
    Flash, and the HTML file to reference the Flash movies. | .html<br>.fla<br>.swf
    |

    | Shopping cart template | Includes all code and graphics to create an online
    store. Many also include the shopping software, or work with existing software
    on your host computer. | varies according to the technologies used<br>.psd (sometimes)<br>.fla
    (sometimes) |

    | Content Management System (CMS) template | Includes all code and graphics to
    integrate the theme with an existing CMS on your host computer. | varies according
    to the CMS used<br>.psd (sometimes)<br>.fla (sometimes) |'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Still Struggling


    Having trouble wrapping your head exactly what a content management system? Check
    Wikipedia''s definition to learn more: http://en.wikipedia.org/wiki/Content_management_system.


    # Software Requirements


    When you''re building a site that uses a shopping cart or content management system,
    you will end up with pages built with something other than basic HTML and CSS.
    As such, there are additional requirements for the site''s host computer. A shopping
    cart template, for example, might require certain versions of tools like PHP and
    MySQL. Be sure to check with your site''s host company before purchasing any templates
    with additional software requirements.


    # Page Size


    Another aspect of the template to consider is the page size. Throughout this book,
    I''ve discussed how important it is to build pages that work for the intended
    audience. To that end, be aware of the size of any template you consider. Reputable
    companies advise users as a template''s page width, which is typical anywhere
    from 800 px to 1200 px. If you find a template that fits your project but is the
    wrong size, check to see if the template company offers customization. Many offer
    customizations, such as page width changes, for an adaptive fee.


    # Template Themes


    Templates are organized by category or theme. When a designer uploads a template
    to an online repository, she adds keywords to help associate the template with
    few categories or themes. This can be helpful if you''re looking for a specific
    theme, such as one featuring animals or one that highlights certain holidays.


    However, I caution you against feeling pigeon-pholed into the "education" category,
    for example, just because you''re creating a site for an educational organization.
    Instead, check out multiple themes to be sure the template you identify is the
    best for your site, regardless of which category it is housed in.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Template Sites


    There are really thousands of template sites out there—some better than others.
    Most work very under one of three financial models:


    +   - Pay per template

    - Subscription

    - Free


    Obviously, we''d all love to use the free templates, if possible. But usually
    either aren''t as high quality or don''t offer as much flexibility. Having said
    that, free templates can work quite well for some projects. Just be sure to check
    the license details to verify your project fits within the license guidelines.


    The other two options—pay per use and subscription—each involve paying for services.
    Subscription-based sites allow you to download and use a certain number of templates
    each month without paying any additional fees. These types of sites typically
    cater to web designers who frequently use templates for multiple projects each
    month.


    If that doesn''t sound like you, consider simply paying a "per template" fee when
    you find the template you''d like to use. The regular price is typically lower,
    but doesn''t limit others from also using the same template. If you''d like to
    purchase the template and take it off the market, ask for the unique price. While
    the unique price is typically up to ten times the cost of the regular price, it
    means no one will be able to use that template for another website. Here are a
    few template sites you might try to get started:


    +   - Template Monster www.templatemonster.com

    - DreamTemplate www.dreamtemplate.com

    - Templates.com www.templates.com

    - Ice Templates www.ictemplates.com

    - Template World www.templateworld.com

    - Pixel Mill www.pixelmill.com

    - Theme Vault www.themesvault.com

    - Web Design Library www.webdesign.org

    - Studio Press www.studiopress.com'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Blogging


    You know a technology has gone mainstream when your mom tells you she started
    a blog to journal online about her gardening techniques. Yup, blogs have officially
    “arrived.”


    In fact, they''ve gone mainstream that many companies are taking advantage of
    blogging tools to manage corporate websites. This is happening because blogging
    tools are powerful enough to allow any non-technical author to write, edit, and
    publish web content quickly, without using any HTML code. For cash-strapped businesses,
    this translates into a real financial benefit.


    Blogging software can be used as content management systems, which means sites
    built upon them can be managed without ever coding a single HTML tag. If you decide
    to use a blog, you''re not limited to creating a site that looks like a personal
    journal. Blogging tools are flexible enough that you can use them for all sorts
    of business websites. And the best part is that some really blogging tools are
    free!


    Two popular blogging tools are Google''s Blogger (www.blogspot.com) and WordPress
    (www.wordpress.com). Both are available as hosted blogging tools for anyone wanting
    to use them. The hosted part refers to the fact that someone else (Google or WordPress)
    maintains the server on which the blog is housed.


    However, of the two, only WordPress also offers a version that can be downloaded,
    installed, and completely customized on the web server of your choice. This means
    you (or your system administrator) can download all the source files necessary
    to run the blogging software and install them on your own server without incurring
    any additional cost. This downloadable version of WordPress is found at www.wordpress.org
    instead of wordpress.com.


    NOTE If you want to research other downloadable blogging tools, check out http://en.wikipedia.org/wiki/Blog_software#Examples.


    # Hosted Blogging


    If you don''t need control over or access to the web server, a hosted option from
    Blogger or WordPress is probably a good choice. Table 8-2 compares the most basic
    features of each tool.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# TABLE 8-2 Blog Features


    | Feature | WordPress | Blogger |

    | Ability to import content from another source | Yes (from a variety of formats)
    | Yes (only from another blogger.com blog) |

    | Ability to use different themes (designs) | Yes, but you can''t edit the style
    sheet for a theme without a paid subscription | Yes (you can also edit the style
    sheet for each template) |

    | Ability to add static pages that are not part of the system | Yes (unlimited)
    | Yes (up to 10) |

    | Ability to add a built-in contact form | Yes | No, but you could create your
    own and host it elsewhere |

    | Ability to make the blog content private | Yes, but you are limited to 35 readers
    per page, unless you upgrade to a paid subscription | Yes, but you can restrict
    access only to those with Google accounts |

    | Ability to allow others to author content | Yes (four levels of access: Administrators,
    Editors, and Contributors) | Yes (two levels of access: Administrators and Non-Administrators)
    |

    | Ability to upload and add images | 3GB of storage with free account | Yes (1GB
    of storage with free account—uses Picassa Web Albums) |

    | Ability to moderate comments | Yes | Yes, but you can''t edit comments |

    | Ability to use custom domain name (my.blog.com) | Yes (only with paid subscription)
    | Yes |


    Beyond those basic features, both tools offer thousands of additional features
    called plug-ins (or gadgets). (Do a search in Google for “WordPress plug-ins”
    to see tons of options.) Most of these have been created by individuals throughout
    the world who then upload and share them with the rest of the blogging community.


    You can do just about anything with plug-ins. You know those iPhone claiming “there’s
    an app for that?” The same commercials could be used for plug-ins. If you have
    an idea to extend the capabilities of your blog, there’s probably a plug-in to
    accomplish it. For example, if you want to earn money with ads on your blog, there’s
    a plug-in for that. A slideshow or poll? There are plug-ins for those, too. Want
    to include a search-able database of audio files? There’s a plug-in for that.'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'The one caveat of plug-ins is that you can only use official Blogger or WordPress
    plug-ins on hosted blogs. Therefore, if you find another plug-in on the Web and
    want to install it on your hosted blog, you''re out of luck unless it''s supported
    by Blogger or WordPress. So if you want to take advantage of the wealth of nonofficial
    plug-ins and themes available for download, it''s time to consider hosting your
    own blog.


    # Custom Blogging


    When you encounter a project that needs a custom blog hosted on a server (or your
    administrator) manage, you can still take advantage of a free blogging tool. As
    I mentioned, WordPress also offers a downloadable version you can install (free
    of charge) on any server that meets the basic requirements (www.wordpress.org/about/requirements).


    Most hosting providers actually make the installation process quite painless.
    In fact, several (which are promoted at www.wordpress.org/hosting) offer one-click
    installations of WordPress for any sites they host. Using a hosting company that
    offers this type of quick installation is worth it, and makes WordPress accessible
    to even beginners.


    After the installation is complete, you''ll want to focus your efforts on the
    template files. As of this writing, those are located in the wp-content/themes
    folder. You can download additional theme templates from developers all the Web
    (as described in the section on finding stock templates in the beginning of this
    chapter) and paste them into this directory as well.


    > TIP Themes are a collection of files and styles that work together to create
    the look of your site. When you download a theme, it will contain various page
    templates as well as one or more style sheets to carry the theme through the entire.


    Each theme comes with multiple templates to handle different types of pages displayed
    through the blogging tool. For example, here are a few of the template files contained
    within the default theme:


    +   * archives.php

    * comments.php

    * footer.php

    * header.php

    * index.php'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'Chapter 8 TEMPLATES AND MEDIA TYPES


    +   - page.php

    - sidebar.php

    - style.css


    If you want to change the theme''s layout, or even create your own custom theme,
    you will want to check out each of these files to see what needs to be edited.
    Or, you could edit the style sheet to change elements such as backgrounds and
    font characteristics.


    # Templates in Dreamweaver


    Even if you don''t use a stock template, you will likely use some sort of template
    when you build websites. For example, you might create a master page with the
    site''s layout and navigation and copy it each time you need to create a new page.
    This can definitely save you a ton of development time, there is a drawback. If
    you later need to make a change to the navigation or layout that cannot be achieved
    by changing the style sheet, you may have to edit each and every HTML page based
    on the initial page.


    Adobe Dreamweaver, a popular development tool among web designers, has its own
    type of template files that can help prevent this problem. These templates are
    special master files containing editable regions. Any pages created based on these
    master templates allow parts of the pages to be edited without affecting other
    areas blocked from edits. Those areas that are locked can only be edited by changing
    the original master template. When you edit the master template, all changes propagate
    to any pages using that template, which means you only have to make the change.


    This can also be a huge benefit to a web designer who needs to develop a website
    she will then turn to someone else to maintain. Many times, the person maintaining
    the website has little experience with HTML or other scripting languages. When
    such maintainers are faced with the challenges of editing text with HTML, they
    can often lose interest in the site maintainance or worse yet, make changes that
    cause problems with the site display.


    As the template creator, you can specify which parts of the template pages can
    be edited by maintainers and which can only be edited by a template administrator.
    The templates and any pages built off these templates can then be edited in Dreamweaver
    or its counterpart, Contribute. (I''ll cover more about Contribute shortly.)'
  merge: -1
