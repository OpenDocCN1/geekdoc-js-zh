    Once you''ve named your content blocks, they can easily be formatted in the site''s
    style sheet. Need to change the font style or even move a block from the top of
    your page to the bottom... on ten different pages? Not only is it easy to change
    that navigation bar, but you have to edit only the style sheet—and not the individual
    HTML pages—to do so. Here''s an example showing different styles can be applied
    to each content block:


    ```

    #header {border:1px solid black;}

    #nav {background-color:black;color:white;font-size:10px;}

    #mainContent {font-size:11px;}

    #footer {font-size:9px;}

    ```


    In the style sheet, the # before each content block name is necessary because
    this is an id selector (not a tag or element selector). Instead of using a tag
    as my selector, as p, I''ve essentially made my own selectors and given them names
    like header and footer. And because I used the id attribute to name them, I prefixed
    my selector name with a pound sign (#).


    NOTE I cover more about CSS selectors in Chapter 5.


    # Other HTML Containers


    After you''ve organized your page into the key areas, you can further organize
    the content within those larger blocks using some basic HTML container elements.
    (We call these container elements because their main purpose is to contain page
    elements.) Each of the elements discussed in this section belong in one of two'
