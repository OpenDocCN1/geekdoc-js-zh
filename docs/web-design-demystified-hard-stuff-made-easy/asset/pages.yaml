  md: '# chapter 4


    # All About the HTML


    When moving from a graphics editor to an HTML editor, a lot of beginning designers
    get hung up in the intricacies of the code. It''s no wonder, given that the two
    types of applications are so different from one another. You might relate it to
    the old "left brain vs. right brain" argument, where left-brain thinking is more
    analytical and focuses on the individual parts, while right-brain thinking is
    more intuitive and looks at the wholes.


    In any case, the next few chapters focus on the individual parts of the design
    layout, as we put them back together with the code.


    # CHAPTER OBJECTIVES


    In this chapter, you will


    +   * Determine how the div element is used to organize content

    * Use HTML to add headlines, paragraphs, and lists to webpages

    * Differentiate between absolute and relative links

    * Create basic tables and forms with HTML

    * Understand how to add images and multimedia with HTML'
