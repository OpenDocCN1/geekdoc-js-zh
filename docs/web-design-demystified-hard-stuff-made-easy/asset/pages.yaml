    # Helping Users Find the Site


    After the website is designed, coded, tested, uploaded, and documented your job
    is finished, right? Not necessarily. You may also be asked to help get the site
    listed in popular search engines, or even to help the site owner market with online
    advertising or targeted e-mails (which we will cover in the final chapter). For
    now, let''s take a look at the first area: listing. But before we do that, you
    need to understand how search engines work.


    # Search Engine Methodology


    Traditional search engines rank pages according to the number of times a key word
    or search term appears on the page. In the past, this has caused some less-than-honorable
    people to repeat key words over and again in an effort to increase their ranking.
    The search engines catch wind of that practice, however, and started banning sites
    that repeated key words in an unreasonable manner.


    Google, the most popular search engine, takes a slightly different approach. According
    to its website, their process works like this:


    +   We use more than 200 signals, including our patented PageRank™ algorithm,
    to examine the entire link structure of the web and'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Chapter 9 GOING LIVE 223


    determine which pages are most important. We then conduct hypertext-matching analysis
    to determine which pages are relevant to the specific search being conducted.
    By combining overall importance and query-specific relevance, we''re able to put
    the most relevant and reliable results first.


    In essence, Google examines not just the page, but the whole market (and even
    linked social media sites), to evaluate the relationships between the pages and,
    therefore, the importance of the content within them. This means a key word used
    in a headline could indicate that it is of greater importance than a key word
    used within the body code.


    Google is often referred to as a "crawler-based" or "spider" search engine because
    systems "crawl" the Web to find relevant data. By contrast, search engines are
    directory based and merely provide an index of sites, they don''t necessarily
    seek related data. Each search engine has its own way of indexing data in an effort
    to increase speed and efficiency.


    As of July 2010, the three search engines garnered a whopping 93.9 percent of
    the United States market, according to ComScore (www.comscore.com). Google comes
    first with just over 65 percent, followed by Yahoo! at just over 17 percent, and
    Microsoft (Bing) with 11 percent. You only need to list these three search engines
    to reach the vast majority of search engine users. With that in mind, let''s focus
    on three for the rest of this discussion.


    # Search Engines Look for Key Words


    When someone starts a web search, the popular search engines evaluate key words
    and phrases throughout webpages to find the best matches. Of course, content is
    king, so the best way to ensure users find your site in search engines is to include
    the content they are looking for. But, it''s also important to repeat your site''s
    key words in specific places.


    +   - The address A site whose address is www.marylandflorist.com will probably
    rank higher than the same site with an address like www.flowersbywendy.com, simply
    because "Maryland" and "florist" are key terms. For this reason, many companies
    register multiple domains: one with the business name and at least one other that
    describes what the business does.


    +   - Headlines Many designers don''t use the heading elements (h1, h2, and so
    on) because they don''t see the need. These elements are actually quite'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# WEB DESIGN DeMySTIFieD


    valuable, because the words contained within them signify importance to search
    engines as well as users. Using relevant headlines can go a long way toward increasing
    the usability and searchability of your site.


    +   **Body copy** This one can''t be emphasized enough. If for a florist, the
    site surely needs to include content about flowers as well as the products and
    services offered. "Getting off a tangent" because it not dilutes your message
    but also lowers the page''s importance in search engines.


    +   **Images** No, search engines "see" your images, but they can read the alternate
    text (alt attribute) associated with them. This alternative text offers a great
    opportunity to enhance the searchability of your site. Here''s an example: <img
    src="image.jpg" alt="Photo of ABC Company CEO, James Rile"/>


    +   **Links** Don''t forget about your links. HTML provides for the title attribute
    to be included within tags as well to reach a readable, searchable title to each
    link. Here''s an example: <a href="link.html" title="Click to find out about ABC
    Company''s swimming pool products and services">


    +   **Page** The title at the top of the page may see insignificant, but it''s
    typically the first thing a search engine uses from your site, so make it count.
    A title "Company Home Page" isn''t nearly as effective as something like "Flowers
    by Wendy – Your Source for High Quality Floral Arrangements in Northeastern Maryland.


    Finally, use meta data to aid those search engines that support them in identifying
    your content. Meta data is instructions about your webpage, as a description and
    keywords.


    To incorporate meta data, the meta element should be added to each page on your
    site in the opening and closing head tags. Here is an example of how meta elements
    might be used on a page listing events at a local restaurant:


    ```

    <head>

    <title>Half Pints Pub | Entertainment Calendar</title>

    <meta name="description" content="With dozens of huge HD TV''s at Half Pints,
    you can catch all your favorite games and sporting events while enjoying entertainment,
    spirited competition, and good old-fashioned camaraderie." />

    ```'
