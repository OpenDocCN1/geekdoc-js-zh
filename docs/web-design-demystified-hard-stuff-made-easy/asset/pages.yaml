- img_proc: true
  md: '# Chapter 2 DESIGNING FOR SCREENS


    Obviously, this can be done in a variety of ways, so there is no one “right” way
    to lay out a webpage. But here are a few guidelines to consider:


    +   - Provide consistent navigation (as discussed in the preceding section).

    - Keep content accessible and relevant.

    - Orient the user (help the user recognize what page he''s viewing within your
    site''s structure), usually with a relevant page title.

    - Maintain an appropriate content hierarchy.


    With regard to the final bullet point, the most important thing you can give your
    users is reliable, relevant, up-to-date content. With this being the case, the
    content should always be the first priority within the structure of the page,
    and it should serve to achieve the business objectives for that page and for the
    entire site.


    I remember my graphic design instructors in art school repeating and over again:
    “What''s the first thing you want viewers to notice on your page?” That should
    be the question you ask yourself when developing the content structure for webpages.


    Remember that, the designer, you''re in the driver''s seat when it comes to prioritizing
    what users see on the page. While it might be tempting to make every element on
    the page animated, moving, glowing, or brightly colored, use these extras sparingly.
    Usability study shows viewers are drawn to the real meat of the site, much more
    than the glitz and glamour, and it''s the content that keeps them coming back.


    Also, when designing the page structure, think about how you look at a webpage.
    You''ll probably agree that you look at the center first, and then move your eyes
    around the page according to what jumps out at you. Other common glances include
    the top-left portion of the screen (close to those backs!) and the right edge
    (near the scroll bar). Check out weuse.com/eyetracking for some eye-tracking studies
    where people look when viewing webpages.


    In journalism, you typically put the most important details in the beginning of
    a story, as not all readers will make it to the end. The Web is the same, at least
    in that not everyone makes to the bottom of the screen. Therefore, the top portion
    should contain enough details to encourage users to keep reading, but not so much
    that they are overwhelmed and don''t know where to look.'
