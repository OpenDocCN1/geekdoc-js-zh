  md: "# Tables\n\nIf you've spent any amount of time using a word processor or spreadsheet\
    \ ap-lication, you're probably familiar with the concept of a digital table. Quite\
    \ simply, a table is a section of information divided into columns and/or rows\
    \ of blocks, called cells. To create tables with HTML, you need to know about\
    \ four basic table elements, as described in the following list. With these elements\
    \ in mind, you can create both simple and complex table structures.\n\n+   * <table></table>\
    \ This is the container for every other element used to create a table in HTML.\
    \ The opening and closing table tags should be placed at the beginning and end\
    \ of your table.\n* <tr></tr> This creates a new table row. The opening and closing\
    \ tr tags surround the cells in that row.\n* <td></td> This creates a new table\
    \ cell. The opening and closing td tags surround the actual content of that cell.\n\
    * <th></th> This optional element creates a new table header cell and is used\
    \ in place of the td element for that cell. By default, the content in header\
    \ cells is boldface and centered.\n\nNOTE Tables are block-level elements.\n\n\
    If you wanted to create a table with three columns, a header row, and two data\
    \ rows, like this:\n\n| Row 1, Header Cell 1 | Row 1, Header Cell 2 | Row 1, Header\
    \ Cell 3 |\n|---|---|--|\n| Row 2, Data Cell 1 | Row 2, Data Cell 2 | Row 2, Data\
    \ Cell 3 |\n| Row 3, Data Cell 1 | Row 3, Data Cell 2 | Row 3, Data Cell 3 |\n\
    \nHere's how you code it:\n\n```\n<table>\n<tr><th>Row 1, Header Cell 1</th>\n\
    \  <th>Row 1, Header Cell 2</th>\n  <th>Row 1, Header Cell 3</th>\n</tr>\n<tr><td>Row\
    \ 2, Data Cell 1</td>\n  <td>Row 2, Data Cell 2</td>\n  <td>Row 2, Data Cell 3</td>\n\
    </tr>\n</table>\n```"
  merge: -1
  pgno: 117
- img_proc: true
  md: '```

    <tr><td>Row 3, Data Cell 1</td>

    <td>Row 3, Data Cell 2</td>

    <td>Row 3, Data Cell 3</td>

    </tr>

    </table>

    ```


    Perhaps the most confusing part of tables is the order in which they are coded.
    Many people just started with web design mistakenly assume they should create
    the columns and the rows. That’s true... sort of. While you are creating the column
    structure with the th and td cells, you must place all cells of each row together
    within the corresponding tags.


    **TIP** *To keep yourself in check, remember to code tables as you read English,
    left to right, top to bottom.*


    You can include any type of content in a cell that that you might include elsewhere
    on a webpage. This content should be typed between the opening and closing cell
    tags. All elements used to format that content should also be included between
    these cell tags.


    Tables, by nature of their design, have internal and external borders. By default,
    most recent browsers set the border size to zero, making tables invisible. However,
    borders can be quite useful for making tables easier to read. Frankly, there’s
    a style sheet property for that (which we’ll address in Chapter 5), as well as
    adjusting the space in and around each cell.


    # Forms


    The last type of HTML container I want to discuss is the form. All forms have
    the same basic structure, which includes opening and closing form tags, input
    controls, and processing methods. The form tags surround the entire form, just
    as html surround document.


    All other form-related tags are then placed between the opening and closing form
    tags. The parts of the form that allow user input are referred to as *input controls*.
    The most basic type of input control is the single-line text field. This and other
    input controls are highlighted in Table 4-3.


    Usually, text fields are preceded by descriptive text (also called the *label*)
    telling the user what to enter in the box. That text is enclosed within opening
    and closing label tags, with an associated *for* attribute to let the browser
    know'
  merge: -1
  pgno: 118
