    # Inline Styles


    In previous chapters, I discussed three different methods of including CSS in
    your pages: inline, internal, and external. Unfortunately, as of this writing,
    e-mail readers ignore internal and external styles, which means we are left only
    with the inline option. Means all styling information must be included within
    the elements it affects, like this:


    ```

    <p style="font-family:verdana;font-size:12pt;color:blue;">

    ```


    While you''re steering clear of internal and external style sheets to reach the
    widest possible audience, you should also avoid all shorthand. Instead, write
    out every complete style declaration like I did in the previous code example (instead
    of grouping all the font styles like this: font: verdana 12pt).


    TIP Check www.campaignmonitor.com/css to see an updated list of which e-mail readers
    support CSS.


    # Add Text and Teaser Text


    Yes, I mentioned this one before as well, but it is worth revisiting. Designing
    for e-mail, you must expect that your images will not always be visible to the
    user for a variety of reasons. Some e-mail readers, like Gmail, do not load the
    images in an e-mail unless the user gives the okay. If your e-mail is composed
    completely of text, this means your users will initially see a big empty space
    with a broken image link.


    Gmail leaves it to the user to decide whether to display the message''s images.
    (Users can choose to display images for a single e-mail, or always display images
    from this sender.) There are two ways you can help your users make that decision:
    with alt text and teaser text. Figure 10-3 shows an example of teaser text and
    alt text displaying when an e-mail is displayed in Gmail.'
