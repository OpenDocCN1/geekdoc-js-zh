- img_proc: true
  md: 'Chapter 8 TEMPLATES AND MEDIA TYPES 197


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_214_0.png)


    # # Still Struggling

    Refer to this online tutorial for more information about using library items in
    Dreamweaver: http://webdesign.about.com/od/dreamweaverhowtos/a/aa090406.htm.


    # ## Using Server-Side Includes


    At the end of the previous section, I mentioned that pages using library items
    will need to be reloaded to the live web server after any changes are made to
    embedded library items. Dreamweaver''s library items are stored locally on your
    personal computer.

    What if you stored your code selections on the live web server instead and allowed
    the web server to assemble the pages on the fly? This would mean you only had
    to update a code snippet and then all the other pages would be updated (without
    you needing to reload them). This can be accomplished through the use of *server-side
    includes* (SSIs).


    > **NOTE** If you try to use SSIs without success, it may be because they have
    not been enabled on your web server. Contact your system''s system administrator
    for help in configuring your account to use SSIs.


    To create an SSI, you simply start with a blank page in Dreamweaver or any other
    HTML editor. Add the code to be reused on multiple pages and save the file with
    an .ssi, .inc, or .txt extension (Note: Check with the correct extension for your
    server.) Be sure the only code included in the SSI is the code to be added to
    other pages (in other words, there is no need to add `html`, `head`, or `body`
    elements others are part of your code selection).

    After the SSI, you use a #include directive to add the SSI to your HTML pages:


    ```

    This single slash at the beginning of the link tells the browser to start looking
    for the file at the root, or main, level of the website.


    <!--include virtual=/includes/footer.ssi-->

    ```


    SSIs must be stored on the same web server as the pages containing them. To make
    maintenance easier, it''s a good idea to keep them all in the same folder (such
    as one named *includes*, like I used in the previous example).'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'TIP If you''re using Dreamweaver to build your pages, you can also add an SSI
    to a webpage by choosing Insert | Server-Side Include. The contents of the SSI
    display in Dreamweaver''s Design view, but only the #include directive is shown
    in Code view. Dreamweaver uses "file" instead of "virtual" in the SSI directive,
    which just means the file parameter is defined relative to the document path instead
    of the document root.


    After an SSI has been added to a webpage, that HTML file must be saved with a
    different extension. Instead of .html, you can use .shtml to tell the server to
    compile the page with its SSIs before displaying it in the browser. (Note: If
    you''re building dynamic pages, such as those created with PHP or ASP, there''s
    no need to change the file extension because the server already knows to check
    those pages before displaying them in the browser.) But to be sure, always check
    with your server administrator to ask about the proper extensions when coding
    SSIs.


    To edit an SSI, simply open the file in your favorite web editor and make the
    necessary changes. When you save the file to the live web server, all pages using
    that SSI will display the updated content.


    > Still Struggling

    Find plenty of online resources about SSIs here: http://websitetips.com/ssi.


    # PROBLEM 8-1


    I''ve made changes to my SSI file, but am not seeing those changes in the live
    webpages. Why not?


    # SOLUTION


    Most likely, you have not reuploaded the edited file to the web server. First,
    check to be sure you have indeed made the changes to the SSI file, and then save
    it. After that, use FTP to upload the file to its final destination on the live
    web server, making sure to overwrite the old version of the SSI. Then, use your
    browser to view the page using the updated SSI, making sure to click Refresh if
    you''ve recently viewed the file.'
  merge: -1
  pgno: 215
