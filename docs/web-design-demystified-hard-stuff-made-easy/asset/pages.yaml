  md: '# Chapter 1 GETTING STARTED


    this category may fall to the designer or other team members (or, more likely,
    all of the team members). Those tasks might include:


    +   - Clicking every link to ensure one works as expected

    - Completing every web form to check the functionality

    - Testing the usability of the website to determine how well users can access
    the content

    - Verifying that all text and graphical data display as expected in the target
    browsers and on all target platforms

    - Coordinating with the appropriate team member to fix any errors found during
    testing


    Testing is key to any website project, for obvious reasons: If you have a broken
    link (or worse, a broken page) that never gets fixed, your business loses credibility
    and maybe some customers. Nevertheless, this category of tasks often falls through
    the cracks for many independent web designers. To avoid trap, build time for testing
    into your project schedule from the very beginning. Make sure you spend time confirming
    that the site you built actually works. If you''re trying to make a living doing
    this, you''ll be the first step towards gaining repeat business from this customer
    and maybe even new business from someone who accesses the site.

    For more website testing, check out these resources:


    +   - Rocket Surgery Easy: The Do-It-Yourself Guide to Finding and Fixing Usability
    Problems by Steve Krug (New Riders Press, 2009)

    - Handbook of Usability Testing: How to Plan, Design, and Conduct Effective Tests
    by Jeffrey Rubin, Dana Chisnell, and Jared Spool (Wiley, 2008)

    - The Ultimate Testing Checklist (http://articles.sitepoint.com/article/ultimate-testing-checklist)

    - UITest.com (http://www.uitest.com)

    - BrowserShots (http://www.browserscreenshots.org)

    - Litmus Testing Software (http://www.litmusapp.com)

    - Adobe BrowserLabs (http://browserlab.adobe.com)


    # Search Engine Optimization


    When a website is launched, most people want to know how soon it will be on the
    first page of Google''s search results. Yeah, right! Search engine optimization'
  merge: -1
  pgno: 26
- img_proc: true
  md: '(SEO) is the process of making webpages easily understood and interpreted by
    search engines. Contrary to popular belief, this is not simply a to-do item you
    check off your project schedule after a site has gone live.

    Instead, SEO is best tackled throughout the entire web development process. In
    fact, the tasks in this category can become so involved that large development
    teams often include a person (or people) who specialize in this area. Here are
    some examples of the types of tasks this person may perform:


    +   - Cross-linking pages to ease navigation and increase visibility

    - Reviewing and editing the site''s content to add relevant keywords and phrases

    - Submitting the site to search engines

    - Checking the site''s listing in key search engines

    - Identifying potential changes to the site that may increase its visibility and/or
    popularity

    - Blocking private pages from being listed with search engines

    - Advertising with search engines to increase visibility


    For more about SEO, check out these resources:


    +   - Search Engine Optimization: An Hour by Day by Jennifer Grappone and Gradivia
    Couzin (Syex, 2011)

    - Search Engine Optimization for Dummies by Peter Kent (For Dummies, 2010)

    - Patrick Gavin''s SEO Blog (www.patrickgavin.com)

    - Search Engine Watch (www.searchengewatch.com)

    - Search Engine Journal (www.searchengenginejournal.com)

    - Google''s Website Optimizer (www.google.com/websiteoptimizer)


    # Maintenance


    Who will take the website after it is launched? The answer to this question is
    often overlooked, but needs to be identified at the start of the project. If the
    site maintainer a nontechnical employee of the client, the site needs to be built
    in such a way that a nontechnical person can maintain it, without needing to learn
    a programming language. Or, if the site is a personal blog, the technical skills
    of the blog owner will likely dictate which blogging software is used to build
    the site.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Regardless, it’s important to consider what happens to the site after it’s

    unched, so you can better understand the technical limitations involved in

    building it. Typical maintenance tasks are:


    +   * Updating press releases and news

    * Adding new content

    * Posting jobs

    * Updating the staff listings

    * Keeping the calendar


    I cover the topic of website maintenance more in Chapters 9 and 10.


    # Technologies and Tools


    Now that I’ve covered the basic tasks within a web development team, let’s

    move on to the technologies and tools used to complete those tasks.


    # HTML and CSS


    The most basic of all web technologies and the easiest to learn is HTML, which

    stands for Hypertext Markup Language. Essentially, HTML tells the web

    browser how to display content and link to related information.


    Pretty much all webpages use HTML in some way, shape, or form. Even if

    you haven’t noticed them before, there are likes of little HTML “tags"

    floating around the scenes of the webpages you visit. To see what I

    mean, open your web browser and choose View Source, View | View Source,

    or | Page Source (depending on your browser). This gives you a glimpse

    of the code used to create the page being viewed.


    HTML was originally designed to mark up text and its structure (titles, head-

    ings, and so forth), as opposed to dictate page layout. Technologies such as

    cascading style sheets (CSS) are better at handling page layout. Both HTML

    and CSS will be discussed in this book, as both are indispensable for web\designers.


    So what exactly does HTML do? It provides instructions to the browser

    regarding how to display content. For example, you might use a certain bit of

    HTML to indicate where paragraphs start and finish:


    ```

    <p>This is a paragraph of text.</p>

    ```'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Now that doesn''t look so difficult, does it? All tags use brackets to separate
    them from the other content on the page. In the previous example, you can see
    that brackets surround both the opening and closing paragraph tags. The <p> tells
    the browser this is the start of a new paragraph, and the </p> tells it to end
    that paragraph. (To end or close a tag, you reuse the tag, but with a forward
    slash after the first bracket).


    NOTE the p portion of the code here is called the element, while the p is referred
    to as a tag when surrounded by the brackets: <p>. However, in most cases, the
    two terms—element and tag—are used interchangeably.


    We use HTML like to structure the page, telling the browser whose pieces of content
    are paragraphs, which are lists, and so on. Then we add some CSS to specify how
    to style each content area. We''ll work with each of these—HTML and CSS—throughout
    this book.


    # Beyond HTML and CSS


    When you want to move beyond basic page layout and content styling, you''ll likely
    need invoke some other web technologies and tools. Typically, we break down into
    two categories:


    +   - Client-side

    - Server-side


    When the action happens on the user''s system (within the browser), it''s referred
    to as being "client-side." Conversely, code that is processed before it reaches
    the user''s system is said to be "server-side."


    TIP Server-side scripts are stored on the server and sometimes require additional
    software to be installed there. Client-side scripts do not interact with the server
    and, therefore, do not require any additional software to be installed on the
    server.


    If you want to offer your website in both English and Spanish, but you don''t
    want the hassle of maintaining two versions of the site. You could store all the
    text content of the site in a database or plain-text files, and reference those
    files within your HTML code using a server-side script. Then, when the user selects
    a language from the home page, the server-side script builds the pages on demand,
    importing the English or Spanish text segments'
  merge: -1
