  md: '# Selectors


    In Chapter 4, I briefly touched on selectors. With CSS, you use selectors to apply
    styles to elements. Selectors allow you to style a particular piece of content,
    or whole sections of content, depending on the original design. A selector can
    be an HTML element (such as p or div), or even custom words you create for the
    sole purpose of applying styles.


    To put this in other terms, let''s compare it to building a house. After you''ve
    completed the basic construction (with the HTML), it''s time to decorate each
    room. You might specify your we paint all blue, with white moldings. If you were
    using CSS to tell the painters what to do, the code might look like this:


    ```

    walls {color:blue; molding:white};

    ```


    In this example, walls is my selector; it''s what aspect of the page (or house)
    we want to style. To help solidify how selectors are used in style sheets, let''s
    take a look at all the most common types of selectors.


    # Type Selectors


    Suppose you want to cause all your headings to display in the Century Gothic font
    and be colored blue. The simplest way to accomplish this would be to add a style
    declaration using the h1 element as your selector, like this:


    ```

    h1 {font-family:''century gothic'';color:blue};

    ```


    You''ll notice that the opening tag itself looks like this: <h1> when it''s in
    your HTML code, you remove the brackets when using it as a selector in CSS. Any
    element that falls within the body section of the HTML page can be a selector.
    If you want to style all the paragraphs on your page, you could use p as your
    selector. Or, if you wanted to style all of the text on your page (regardless
    of whether it''s contained in paragraphs, lists, tables, or whatever), you could
    use body as your selector.


    > NOTE The W3C officially calls these selectors, but I like to refer to them as
    selectors to make them easier for students to understand.


    # ID Selectors


    We covered selectors a bit in Chapter 4, because they directly relate to the structuring
    of your pages. The most common use of id selectors is to uniquely style sections
    of a page. I say “uniquely style” because no two id values can be'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'the same. In other words, after you name one content area “header”, you cannot
    reuse that id for any other content area affected by the same style sheet.


    TIP The id attribute can be added to any existing opening tag in the code, so
    long as is used just once in each page. Because of that limitation, it is commonly
    used with the div element to separate the page content.


    When you want to style an element that has an id, you reference that id with its
    name preceded by a pound sign:


    ```

    #header{border:1px;}

    ```


    The pound sign is necessary to let the browser know the selector in question is
    not an element, but rather the value of an id attribute somewhere in the page.


    # Class Selectors


    Similar to the id selector, a class selector is a custom selector you create specifically
    for your pages. The difference, is, that class selectors can be applied multiple
    times throughout your pages. For example, a class might be used to apply a style
    class “highlight” that adds a yellow background color behind various important
    bits of text on multiple pages.


    In the HTML code, the class attribute is used to specify the class’s name. Just
    like the id attribute, the class attribute can be added to any existing opening
    tag in the body section of the code, or you can use a span tag with the class
    attribute to apply a class of section not already affected by another tag.


    ```

    <span class="highlight">This text is highlighted.</span>

    ```


    In the style sheet, classes are preceded by periods. This tells the browser that
    the selector is not an HTML element or the value of an id attribute, but a custom
    name applied with the class attribute.


    ```

    .highlight {background-color:yellow;}

    ```


    # Other Selectors


    Aside the basic type, id, and class selectors, there are a number of other ways
    to be more specific about which element is being styled.


    # Universal Selector


    The asterisk (*) is the universal selector in CSS. Similar to running a wildcard
    search, using an asterisk as your selector causes all elements on the page to
    be'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'styled with the declaration. This can be helpful to force all the text on your
    page to use the same font family:


    +   * {font-family: verdana;}


    # Attribute Selectors


    When you style content with type selectors, you sometimes need to be more specific
    about which elements to affect. Suppose you needed to style all links to a particular
    website differently so they stood out. An attribute selector is for purposes like
    this:


    ```

    a[href="http://www.mycompany.com"] {font-weight:bold};

    ```


    With the syntax for attribute selectors, the attribute is enclosed within straight
    brackets after the element name. Then, if you want to look only for attributes
    with a certain value (like in the previous example), you include that value inside
    the square brackets as I did. In this case, it causes the style to be applied
    to all instances of the following HTML code within the page:


    ```

    <a href="http://www.mycompany.com">

    ```


    # Descendant Selectors


    What if you want to style the paragraphs in the main content section of the page
    differently from those in the header or footer? There are actually a couple of
    ways to accomplish this, one of them being descendant selectors.


    Here''s the HTML code for the scenario I just set up:


    ```

    <div id="mainContent"><p>Text here</p></div>

    <div id="footer"><p>Text here</p></div>

    ```


    As you can see, if I use p as my selector, I will affect the paragraphs in sections.
    To style them differently with descendant selectors, my style sheet might look
    like this:


    ```

    #mainContent p {font-size:12pt;

    #footer p {font-size:10pt;}

    ```


    TIP These types of selectors are called descendant selectors because they match
    elements that are descendants of other elements in the document''s family tree.
    When you separate two selectors with a space, you''re telling the browser to look
    for the first selector and find the second selector inside the first one within
    the code. So in this case, these style declarations only affect paragraphs within
    the mainContent and footer divisions.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Child Selectors


    Child selectors are similar to descendent selectors, in that they allow you to
    style very specific aspects of the page. To understand the difference between
    descendent and child selectors, we need to take a step back and recognize how
    the HTML hierarchy works.


    HTML includes its own set of parent-child relationships. In fact, we can create
    HTML page’s “family tree” just like you might have done in elementary school for
    your own family. Only, in this case, we are using HTML elements in place of family
    members’ names. Take a look at the following illustration to see what I mean.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_134_0.png)


    In this example, there is an unordered list (UL) in the header content division.
    That list contains five list items (LI). Each list item is therefore called a
    child of the list element, as well as a descendent of the header content division
    and the body element. (All elements are descendants of the body element, so you
    might call him the grandaddy of them all…)


    Each list item contains a link (A), and some of those links are bold. If we wanted
    to cause only the link colors inside those unbolded list items to be orange, we
    might use a child selector like this:


    ```

    li a { color: orange; }

    ```


    If there are other lists on the page, things might get confusing. So to clarify,
    we could add a descendent selector to tell the browser to make only those links
    inside a list item inside of the header content division orange:


    ```

    #header li > a { color: orange; }

    ```


    As you can see, child selectors are separated by a greater-than symbol in your
    style sheet, while descendent selectors are separated by a space.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# Pseudo-Elements and Pseudo-Classes


    What you want to apply a style where no HTML element exists or is easily accessed?
    For example, a lot of designers are fond of creating drop caps for the first letter
    of key paragraphs. While this is easy to accomplish using print design software,
    there''s no HTML element that you style the first letter of a paragraph. That''s
    where pseudo-elements and pseudo-classes come in.


    CSS provides several pseudo-elements and pseudo-classes to style aspects of HTML
    pages that are otherwise inaccessible. These are essentially "fake" elements and
    classes whose purpose is to apply styles. As of this writing, there aren''t a
    lot of these pseudo-elements and pseudo-classes, but we can expect more to come
    with future revisions to the CSS specification. Tables 5-1 and 5-2 list those
    currently in use.


    Pseudo-elements and pseudo-classes are not supported by older browsers. Be sure
    to test pages that use these selectors in all target browsers.


    Each of these pseudo-classes and pseudo-elements are applied the same way, with
    a colon separating the real HTML element from the fake one, like this:


    ```

    a:link {color:blue};

    a:visited {color:purple};

    a:hover {color:orange};

    a:active {color:yellow};

    ```


    In this case, the pseudo-classes are applied to the element, because that''s how
    links are created in HTML.


    The hover, active, and focus pseudo-classes aren''t limited to links, and can
    be applied to other elements as well.


    # TABLE 5-1 CSS Pseudo-Elements


    | Pseudo-Element | Description |

    |---|---|

    | :first-letter | Allows you to style the first letter of the first line of a
    text block |

    | :first-line | Allows you to style the first line of a text block |

    | :before | Allows you to insert content before other content, such as adding
    the word "New!" to the start of certain items in a list |

    | :after | Allows you to insert content after other content, such as adding an
    asterisk after the text in certain table cells |'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# TABLE 5-2 CSS Pseudo-Classes


    | Pseudo-Class | Description |

    | :first-child | Allows you to style the first child element of another parent
    element |

    | :link | Allows you to style elements that have not yet been visited |

    | :visited | Allows you to style links that have already been visited |

    | :hover | Allows you to style the way elements display as the mouse hovers over
    them |

    | :active | Allows you to style the way elements display as they are being clicked
    |

    | :focus | Allows you to style the way elements display when users are interacting
    with them, such as text fields currently being completed |

    | :lang | Allows you to style the language of specific elements |


    # Combining Selectors


    You can also apply styles to multiple selectors quickly and efficiently by combining
    selectors. When you do this, you simply separate them with a comma. Here''s an
    example in which I change the font size for all paragraphs and table cells at:


    ```

    p,td {font-size:12pt};

    ```


    # Importance


    One thing to keep in mind about selectors is this: If you apply a particular style
    using the p element name as a selector, all paragraphs will carry that style.
    If you want to overwrite that style, there are a few things you can do.

    I''ve already shown you a few ways to be specific as you apply styles, thereby
    overriding general styles in the process. One of those is to create a custom selector
    and apply it to whichever paragraph you want to display differently. Here''s an
    example in which I specify that all paragraphs should use a certain size text,
    except for one paragraph styled with a more specific selector:


    ```

    p {font-size:12pt};

    p.footer {font-size:10pt};

    ```


    Remember that you can apply styles in different locations—internal, external,
    inline—with varying results. Generally speaking, in external style sheets can
    be overridden by internal style sheets, which can then be overridden by an inline
    style sheet. To clarify, suppose you have an external style sheet'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# WEB DESIGN DeMySTiFiD


    applies to all the pages of a website, and then an internal style applying to
    one page in particular. If both style sheets specify different font sizes for
    level one headings, the internal style rule is the one that will ultimately be
    used.


    **NOTE** This discussion on importance just scratches the surface, as the CSS
    offers detailed guidelines with regard to which rule takes precedence in the case
    of conflicts. Refer to www.eskimo.com/~-bloo/indexdot/css/topics/cascade.htm to
    learn more about the details of those guidelines.


    # Inheritance


    With all this talk of children and descendants, we certainly need to at least
    mention inheritance. While HTML children don''t inherit riches from their parents,
    they do inherit certain style characteristics. For example, consider the list
    item containing a bolded element:


    ```

    <li>Please remind your child to bring his/her musical instruction to school <strong>every
    Wednesday</strong> between now and the end of the year.</li>

    ```


    If you apply a color to all list items on your page, the text inside the strong
    element will also inherit color styling. That is, unless you specifically override
    color with a style specifically applied to the strong element, as in:


    ```

    li > strong {color: green;}

    ```


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_137_0.png)


    # Still Struggling


    Wondering which styling aspects are inherited and which are not? Check out an
    online style properties library to learn exactly what is inherited in style sheet:
    http://webdesign.about.com/od/css/astylibrary.html.


    Every CSS property also includes the optional value "inherit". So if you find
    a certain style characteristic is not inherited, you can force it to do so by
    using this value. Specifying p {margin: inherit;} in your style sheet will tell
    the browser even though the margin property is not normally inherited, it should
    be in this case.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# TIP The background-color property is another that is not inherited. How-ever,
    several modern browsers display some element''s background colors through their
    child elements because the default value of the background-color property is transparent.
    As a work-around, make sure to specify all background-grounds instead of leaving
    them to change.


    # The important Declaration


    When all else fails, you can attempt to force a certain style declaration to override
    all others with the use of the !important declaration. Here''s how this might
    work:


    ```

    footer {font-family: verdana; !important}

    ```


    In this case, even if another style declaration specifies paragraphs should use
    a different font, all paragraphs in the footer content division will display in
    Verdana because of the inclusion of this specific !important declaration.


    # PROBLEM 5-1


    I am using an external style sheet to drive the design of the entire website,
    but need to override a few styles for one page. What is the best way to accomplish
    this?


    # SOLUTION


    This is actually a common situation. I often create site-wide style sheets (which
    are usually located at styles.css) that contain the styles for every page on the
    site. Then, I use custom selectors to get more specific. For example, while all
    of the level two headings might normally be displayed in black, what if I needed
    to display one of those headings in first.


    There are a couple of ways to approach this. First, I could create a custom class
    and add it to only that heading tag, like this: <h2 class="highlight"> Alternatively,
    I could create a custom class for that and add it to the body tag, like: <body
    class="sales"> Then, I would use body.sales h2 as a descendant selector when declaring
    my style. This latter option of assigning classes to each page of the site allows
    me to get very specific about styles while still using a site-wide style sheet.'
  merge: -1
  pgno: 138
- img_proc: true
  md: "# Font Styles\n\nNow that you know how to specify which elements to style,\
    \ let's move on to the properties used to actually style those elements. You can\
    \ alter all sorts of aspects of your page through a long list of CSS properties.\
    \ The first, and most commonly used, properties to discuss are the font properties.\
    \ Table 5-3 lists the properties that affect aspects of fonts on webpages.\n\n\
    Here's an example of how these properties might be used to adjust the style of\
    \ a paragraph:\n\n```\np {\n  font-style: italic;\n  font-size: lem;\n  font-weight:\
    \ bold;\n  font-variant: small-caps;\n  font-family: arial;\n}\n```\n\nAfter reading,\
    \ you might be wondering if there isn't a more efficient way to code all those\
    \ font properties when several are used within a single rule. Frankly, they can\
    \ be grouped using CSS shorthand, via the font property. In other words, you can\
    \ adjust all of the characteristics shown in the preceding code sample at once\
    \ within a single property, like this:\n\n```\np { font: italic item bold small-caps\
    \ arial; }\n```\n\n![](img/e9cc309d049aca128e9afd3cd8693fe3_139_0.png)\n\n# Font\
    \ Sizes\n\nTable 5-3 lists several different ways you can specify font sizes in\
    \ CSS, including absolute keywords (small, medium, large), relative keywords (smaller\
    \ or larger), or lengths (numbers followed by units) or percentages.\n\nThe common\
    \ units used to specify fonts for screens are px (short for pixels) and em (refers\
    \ to the width of the M in the current face and point size). Two less popular,\
