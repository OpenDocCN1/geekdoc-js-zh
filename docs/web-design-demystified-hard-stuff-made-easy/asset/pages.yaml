  md: '# Chapter 6 INTEGRATING HTML AND CSS FOR LAYOUT 151


    # Define the Overflow


    Finally, when you position elements with defined sizes, you need to consider how
    to handle any content within those elements that doesn''t fit.


    Suppose you create a content division to hold your main body copy and give it
    an overall width of 500 pixels and a height of 600 pixels. What if the text for
    one of the pages doesn''t fit within that size? By default, CSS sets all content
    to be visible, regardless of the size of the content box. This means you may end
    up with some not-so-readable results when the extra text flows out onto your page.


    To prevent that happening, you can define how the browser handles any content
    that doesn''t fit—with the `overflow` property. The four possible values are `visible`,
    `hidden`, `scroll`, and `auto`. Visible and hidden are fairly obvious, and scroll
    is just what you''d expect: It adds a scroll bar to the box so users can access
    the overflow content.


    Auto allows you to let the browser decide what is needed. This is particularly
    useful when a content division''s styling is used on multiple pages—each with
    different amounts of content. If the content division is large enough to accommodate
    its content on one page, no scroll bar will be added. But if the content overflows
    on another page, a scroll bar will be added.


    # Adding Interactivity


    The positioning of elements in a webpage can be a powerful way to add activity.
    In particular, this can occur when layers are hidden temporarily (using `visibility`:
    hidden in the style sheet) and then made visible based on user action. Here are
    just a few ways interactivity might be achieved through CSS positioning:


    +   - Advertising Have ever clicked on a link in a banner ad, only to have that
    ad to grow larger without the actual webpage changing? Very likely, the larger
    version of the ad was a hidden layer set to appear when you clicked the link.


    +   - Entertainment While many online games use Flash for interactivity, many
    newer versions are switching to a combination of HTML and CSS, thanks to the additional
    interactivity offered in the forthcoming HTML5. These games often place different
    elements on layers so that they can easily be moved around on the page, independently
    of each other.'
