    nIN THIS ISSUE: $20 OFF coupon, Stay-cation ideas, and more!

    If you can''t see the images, view this message in a web browser instead.


    NOTE Teaser text should be included on the first line after the opening body tag
    to ensure it is displayed at the very top of the e-mail message.


    # Limit Page Widths


    While it''s true people see by using larger and larger monitors, that doesn''t
    mean you can create e-mails to fill screens. Most e-mail readers use a paneled
    approach, where the list of mailboxes might run down the left side, with the list
    of messages above the actual message area in the space on the right. This means
    your e-mail needs to fit in a small portion of the overall e-mail reader window
    because the majority of your audience won''t scroll horizontally to read an e-mail.


    TIP Try to keep your e-mail pages no wider than 700 pixels to avoid the right
    side cut off.


    # Avoid Anything Beyond Basic HTML


    Because multimedia is so prevalent in web design, it''s not uncommon to be asked
    to add them to e-mail designs as well. Unfortunately, the e-mail readers aren''t
    able to handle multimedia the way browsers do.


    As of this writing, the only reliable way to include any sort of video in an e-mail
    is with an animated GIF. And there is no support for sound at all in an e-mail
    reader. In short, you cannot realistically add audio or video to any HTML e-mail.


    And the recommendation isn''t better for Flash lovers, because Apple''s Mail program
    is the only e-mail client to offer native support for video and Flash files. While
    you can include a "fallback" image when embedding Flash files in normal webpages
    for browsers to display when the Flash player isn''t avail-, most e-mail clients
    won''t even let you do that. So at point it is best to avoid Flash when designing
    HTML e-mail.


    Finally, avoid any sort of client-side scripting like JavaScript, as it won''t
    work and will likely cause your page to be marked as spam.'
