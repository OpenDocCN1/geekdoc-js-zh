    # Font Families


    Another important font characteristic is the font itself. In CSS, the font name

    is listed as the value of the font-family property.


    For most browsers, the default font is something like Times New Roman,

    which is not exactly the easiest to read on screens. Many designers choose

    to change the default font to a bit more screen-friendly, using the

    font-family property:


    ```

    body { font-family: verdana; }

    ```


    TIP Table 2-2 in Chapter 2 lists the most popular and widely supported screen

    fonts.


    # Font Stacks


    Because it’s common for some fonts not to be available on certain users’ ma-

    ines, can include multiple fonts in font specification. This process

    is referred to as defining font stacks, as the browser looks for the first font

    out the user’s system and moves on to the next if the first is not found.

    None of the fonts are available, the text is displayed in the default font. Here’s

    what this might look like in a style sheet:


    ```

    body { font-family: verdana, arial, helvetica sans-serif; }

    ```'
