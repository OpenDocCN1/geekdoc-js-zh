  md: '# Introduction


    When I started creating the outline for this book, I had just finished teaching
    a semester-long web design course for a local community college. That experience
    couldn''t have come at a better time because it helped me refine my approach to
    teaching web design. I took my years of experience creating websites and writing
    about that process, and tweaked it a bit to tailor it for students. The result
    is Web Design DeMYStifieD.


    # Who Should Use This Book


    Even though this book is jam-packed with information, it is not meant to be the
    only resource for learning web design. It is, however, intended to be the perfect
    companion for instructor-led courses, either online or in the classroom. You''ll
    likely get the most from this book if you know a little about the following:


    +   - Computer: Can you open, close, and move files around easily? Do you have
    a web browser and Internet connection you feel comfortable using?

    - Design: Do you know what styles, layouts, and so on appeal to you? Can you express
    those in terms of color, shape, and texture?

    - HTML: Do you know what it is used for? Have you ever used it to create a basic
    webpage?'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'If you can''t answer in the affirmative to at least two of the preceding questions,
    you can still use this book as an introduction to web design, but you''ll want
    to pay special attention to the tips, hints, and notes throughout the book. Many
    of these list resources where you can find additional information about a particular
    topic, such as graphic design.


    #  How to Use This Book


    The chapters are organized based on a typical web design project and the steps
    taken to complete such a project. Within each chapter are learning objectives
    to help frame the content discussed in that section.


    There are ten chapters in this book, each of which builds upon the one before
    it. When I wrote the book, I intended for each student to move through the chapters
    consecutively. However, individual chapters can also be used as a reference at
    a later date.


    A ten-question quiz can be found at the end of every chapter. The purpose of this
    quiz is to help solidify key concepts identified in the material covered. Answers
    to each quiz can be found in the back of the book.


    Finally, a 75-question exam is included after Chapter 10. This exam poses questions
    from all the material covered, in a random order, to verify you''ve retained the
    most important aspects of what you''ve learned. The exam answers are also included
    in the back of the book.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# chapter 1


    # Getting Started


    To get started in web design, we need to first make sure we''re all on the same
    page. Specifically, I will use this chapter to outline the steps involved in a
    web design process, as well as who completes each step and what tools are used
    to do so. By the end of this chapter, we''ll be ready to switch gears a bit to
    discuss how web design differs from print design.


    # CHAPTER OBJECTIVES


    In this chapter, you will


    +   - Differentiate between the various aspects of web development teams

    - Recognize the tools and technologies used by web development teams

    - Identify the steps involved in planning a website

    - Identify ways to document the web development process'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 2 WEB DESIGN DeMyStIfieD


    # What Is Web Design?


    Prior to the mid-1990s, you might have wondered if web design was an activity
    reserved for spiders, like the one made famous by the movie Charlotte''s Web.
    These days, it seems like everyone knows someone who designs webpages.


    So exactly does a web designer do? If you''ve picked up this book, you''re probably
    interested in the answer to this question. Or, perhaps, you''re taking a required
    web design course in school and need some figuring out the basics. In either case,
    you''ve come to the right place. This book is meant to provide an introduction
    to modern web design concepts and technologies. With that said, it is not the
    be-all and end-all of web design instruction. Rather, I seek to touch on all aspects
    and provide references to online sources for additional information.


    In its most basic form, web design covers the creation of content viewed over
    the Web. Indeed, Wikipedia describes web design as "the skill of creating presentations
    of content (usually hypertext or hypermedia) that is delivered to an end-user
    through the World Web, by way of a web browser or other web-enabled software like
    Internet clients, microblogging clients, and RSS readers" (http://en.wikipedia.org/wiki/Web_Design).


    In the business world, a professional web designer can take on a variety of tasks,
    from planning the site''s information to be presented, designing that information
    and building the code used to display it. As you learn about web design, you may
    find a certain aspect appeals to you more than another. That your work can benefit
    because many web designers specialize in very specific areas. For example, you
    might be drawn to know how content is structured on a site and move toward the
    specialty called information architecture. Or, you might prefer making content
    interactive with tools like Adobe Flash and decide to focus your efforts on becoming
    proficient in such tools.


    Regardless, I hope this book gives you a firm foundation in the basic aspects
    of web design as you start your journey.


    # Design vs. Development


    You''ve probably heard both "web design" and "web development" used to refer to
    the creation of content for the Web. In fact, you may even be enrolled in a web
    design class within a web development curriculum and wonder how the two fit together.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Many people consider web design to be what happens to the front-end of a website,
    while web development might refer to the work on the site''s back-end. The front-end
    of a site typically involves any customer-facing aspects of the site, such as
    the layout, navigation, graphics, and text. By contrast, the back-end comprises
    the behind-the-scenes code and technologies that make the front-end work. This
    frequently includes databases to store content, scripts to process web forms,
    and other programming to display content.

    This book focuses on the creation of the front-end of a website, which we are
    referring to as web design.


    # Teams and Tasks


    I just threw out a couple of different specialties within the overarching title
    of web design. When working on a large web design project, you may encounter one
    of these specialties, plus a few more. If you''re working by yourself on a smaller
    project, you will probably dabble a bit in each of the following categories:


    +   - Project management

    - Information architecture

    - Design

    - Coding/programming

    - Animation

    - Copywriting/editing

    - Testing

    - Search engine optimization

    - Maintenance


    # Project Management


    Project management is an important aspect of any website project. Tasks that fall
    into this category might include:


    +   - Evaluating the project goals and objectives

    - Recognizing potential problem areas

    - Communicating with client(s) about the project

    - Identifying the site''s target audience'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# WEB DESIGN DeMYSTiFieD


    +   * Collecting the site’s content

    * Scheduling the project and its milestones

    * Keeping everyone on schedule

    * Educating the client about the project’s process and the site’s maintenance


    If you end up working for a design agency, the project management role will likely
    fall to an individual who manages several projects at once. As such, project managers
    must be extremely organized and task-oriented people. When the tasks in this category
    fall to you, either as the project manager for a larger team or as the do-it-all
    web designer, it is important to stay focused on meeting the project goals and
    managing the steps along the way.


    To learn more about project management for the Web, here are a few additional
    resources:


    +   * Managing Interactive Media Projects by Tim Frick (Delmar Cengage Learning,
    2007)

    * Making Things Happen: Mastering Project Management (Theory in Practice) by Scott
    Berkun (O’Reilly, 2008)

    * Effective Project Management for Web Geeks (http://articles.sitepoint.com/article/project-management-web-geeks)

    * Project management, collaboration, and task software: Basecamp (www.basecamphq.com)

    * Web Design: An Introduction to Project Management from Wikiversity (http://en.wikisociety.org/wiki/Web_Design/An_introduction_to_Project_Management)


    # Information Architecture


    In web design, information architecture involves organizing the content in the
    most effective and efficient manner for the end user. Tasks that fall into this
    category might include:


    +   * Labeling the site’s content areas

    * Organizing the content

    * Developing an efficient, user-centered structure for the site’s content

    * Creating wireframes (or storyboards) to track a user’s progress through the
    site'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Chapter 1 GETTING STARTED


    +   - Ensuring the navigation meets the end-user requirements

    - Documenting the site map


    **NOTE** You will notice there is some overlap among the categories, in some tasks
    are included in multiple categories. This is not a mistake! Web design teams vary
    greatly according to the people and projects involved, and sometimes tasks are
    shared.


    The information architect''s ultimate goal is to organize the content in such
    a way that people can find what they want, when they want. Moving through the
    site should be intuitive for end users, yet make sense for the business owner.
    This can be particularly challenging, as much of the success of the website lies
    here. In other words, if the information architecture fails, the site fails. If
    people can''t find the content they seek, the plain and simple truth is that they
    will go over. Therefore, it is important not to overlap the tasks in this category.
    Even if you are the only person on your web team, spend ample time at the beginning
    of the project figuring out the best way to organize the site''s content. Look
    for more in this Chapter 2. In the meantime, here are some additional resources
    you might check:


    +   - *A Project Guide to UX Design: For User Experience Designers in the Making*
    by Russ Ung and Carolyn Chandler (New Riders Press, 2009)

    - *Content Strategy for the Web* by Kristina Halvorson (New Riders Press, 2009)

    - Jakob Nielsen on Usability and Web Design (www.useit.com)

    - User Interface Engineering (www.uite.com)


    **TIP** UX is an acronym for "user experience." In web design, UX is often to
    refer to anything that affects a user''s perception of the website. UX specialists
    often have experience in psychology, as well as design and computer science.


    # Design


    The design tasks of the site... it''s what you''re reading this book for, right?
    The overarching topic of design covers everything in this chapter, but the more
    specific design-related tasks typically include:


    +   - Creating comprehensive designs (comps or mockups) for key sections/pages/screens
    of the project

    - Translating comprehensive designs into working prototypes'
  merge: -1
  pgno: 22
- img_proc: true
  md: '6 WEB DESIGN DeMYSTiFiED


    +   * Developing supplementary graphic content as needed

    * Identifying the transitions between sections/screens/pages

    * Coding the designs to display in web browsers


    I cover more details about these tasks in the following chapters, so I won''t
    discuss them in depth here. In addition to these tasks, the designer may or may
    not be involved in the coding or programming of the site. Keep reading for more
    on what tasks entail.


    # Coding/Programming


    A website is nothing without the code to make it happen. For smaller websites,
    the code is typically basic enough to be coded by the designer. But for larger
    or more complex projects, a programmer is an important addition to the team. This
    member of the team might perform such tasks as:


    +   * Designing and maintaining appropriate databases, servers, testing environments,
    security procedures, networks, and so on

    * Coding the designs to display in web browsers


    Most people—myself included—consider coding and web design to go hand-in-hand.
    Even if a web designer isn''t the one coding the pages, he needs to have a firm
    understanding of how the code works in order to create an appropriate web design.
    A large portion of this book will be spent discussing how to translate your designs
    into code. Even so, you''ll likely need additional resources to solidify your
    coding knowledge. Here are a few options:


    +   * HTML: A Beginner''s Guide, Fourth Edition by Wendy Willard (McGraw-Hill/Professional,
    2009)

    * HTML & CSS: The Complete Reference, Fifth Edition by Thomas A. Powell (McGraw-Hill/Professional,
    2010)

    * HTML Source: HTML Tutorials (www.yourhtmlsource.com)

    * World Wide Web Consortium (W3C)—the organization that develops and maintains
    HTML (w3.org)

    * HTML Goodies: The Ultimate HTML Resource (www.htmlgoodies.com)

    * HTML and CSS Tutorials (www.htmldog.com)

    * HTML & CSS Tutorials (www.w3schools.com/sitemap/sitemap_tutorials.asp)'
