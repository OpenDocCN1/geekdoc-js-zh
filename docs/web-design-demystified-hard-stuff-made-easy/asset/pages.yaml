  md: '# Animation/Multimedia


    When a website project involves any type of animation, it''s best to add a team
    member experienced with animation design. When web design was still in its infancy,
    designers often created static images as well as animated ones. But the level
    of design and complexity in web animation has grown such that animation design
    is truly a specialty. Tasks left to web animators might include:


    +   - Designing key sections/pages/screens of the animation

    - Developing the animation between frames/screens

    - Coding/programming the animation


    I often have students ask whether they should learn how to create web animation.
    If you''re considering focusing your skills on web animation or multimedia, you''ll
    spend some time learning Adobe Flash, as that is the facto standard for animation
    and multimedia on the web. For additional information about web animation and
    Flash, check out these resources:


    > NOTE Each of the books listed is available for users of Flash CS3, CS4, and
    CS5 (as of this writing). Select the book that corresponds to whichever version
    of the software you plan to use.


