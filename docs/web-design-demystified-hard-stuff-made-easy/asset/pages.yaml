  md: '# WEB DESIGN DeMyST1FieD


    A link to a multimedia file is essentially the same as any other link.

    means you can use the element and href attribute, like this:


    ```

    <a href="slideshow.mov" title="Click to see this slideshow">Watch

    this student''s slideshow.</a>

