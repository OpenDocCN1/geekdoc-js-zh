  md: '# Ems


    Em is a scalable unit of measurement, which means it can increase or decrease
    depending on the user''s browser settings. One em is equal to the current font
    size. So if you specify in your body element a document''s font size is 12 points,
    then for that document 1em = 12 pt. If you later specify that a headline should
    be 2 em, Dreamweaver would display at 24 pt.


    Dreamweaver uses ems when you specify your page layout should be elastic, because
    text sized with ems can vary depending on the fonts used.


    # Pixels


    Pixels are the common unit of measure for screens. Depending on your computer
    and monitor, webpages may display at 72 or 96 pixels per inch (ppi). Unfortunately,
    pixels are not scalable, which means users cannot increase the font size if you
    code a page using pixels for font measurements.


    When you use your text with pixels, the text will remain the same size regardless
    of how the browser window is resized. This is useful when you are trying to create
    a fixed layout where various items on the page need to be aligned with one another.


    # Points


    Points are the common unit of measure for print. Seventy-two points make up one
    inch on the printed page. Just like pixels, points are fixed and not scalable.


    # Percentages


    You can also specify font sizes by percentage. Like ems, percentages are scalable.
    In addition, they are dictated by the current font size (either in the page, or
    if that''s not specified, then for the browser). So if the current font size is
    12 pt, then 100 percent is equal to 12 pt, while 150 percent would be 18 pt.


    If you create a new page layout in Dreamweaver using a liquid layout, you''ll
    notice Dreamweaver uses percentages as the preferred unit of measurement to allow
    text to grow and shrink as needed.


    # Which to Use?


    Ultimately, which unit of measure you use will depend on the goals of your site.
    If accessibility is a chief goal, you will want to steer clear of any unit of
    measure'
