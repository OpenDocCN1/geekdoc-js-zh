  md: 'Because your e-mail is downloaded and displayed on the reader''s system, you
    need to make sure all images are stored on a web server and referenced with complete,
    absolute URLs (i.e., those that start with http://). Likewise, all links to other
    webpages or content need to be absolute.


    # Store Images on a Live Web Server


    I just mentioned this, but I can''t stress how important it is. In order for images
    referenced in an HTML e-mail to display once the e-mail is downloaded by the recipient,
    they must be stored on a live web server and referenced with an absolute URL.
    So, your images will not display if your code looks like this:


    ```

    <img src="header.jpg" />

    ```


    When it comes to image storage for e-mail design, you essentially have two choices:


    +   - Create a folder on the company''s web server to house all e-mail-related
    files and images. In this case, your image URLs might look like: <img src="http://www.company.com/email/images/header.jpg"
    />.

    - Store the images on your ESP''s web server. If you go this route, your image
    references might look like this: <img src="http://files.mysp.com/98943789/6785436574.jpg"
    />.


    # Use Tables for Layout


    So far, I''ve not discussed any other layout method except for that which is accomplished
    with style sheets. Because CSS is the preferred layout method for webpages that
    are viewed in web browsers. Unfortunately, e-mail readers haven''t caught up to
    web browsers in the display of HTML and CSS. So, web designers are forced to use
    "old school" layout methods when designing for e-mail.


    In particular, Microsoft Outlook does a poor job at rendering CSS. As of this
    writing, it does not support the float or position properties in CSS and has very
    little support for padding, margins, and background colors.


    So what do you need to create columns in pages to be viewed in Microsoft Outlook
    or other e-mail readers? Although it''s a bit archaic and somewhat complex to
    maintain, you can use HTML tables for page layout. Compare Figures 10-1 and 10-2
    to see how a table-based layout might work for an HTML e-mail. Figure 10-2 shows
    the layout in "Expanded Tables mode"'
