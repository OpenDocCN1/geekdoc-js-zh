  md: '# chapter 2


    # Designing for Screens


    Now we''re all on the same page with regard to who does what in a typical web
    development project, let''s focus a bit more on the designer''s role. If you''re
    ansty to get into your favorite graphics editor to start designing, great! But
    before you do, let me bring to your attention a few key design issues first.


    > CHAPTER OBJECTIVES


    In this chapter, you will


    +   - Identify those design issues that are unique to screen design, particularly
    as they relate to devices, browsers, bandwidth, color, navigation, and transitions

    - Create design mockups that meet the project goals

    - Determine the best method of sharing design mockups for your needs'
  merge: -1
