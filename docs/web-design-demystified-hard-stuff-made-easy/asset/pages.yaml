  md: '# Chapter 10 E-MAIL DESIGN


    work for HTML e-mail. But because of the inconsistency of support for CSS among
    e-mail readers, there are certain differences you need to be aware of.


    # Recommendations


    When you are coding a webpage that will ultimately be viewed in an e-mail reader,
    there are certain steps you must take to ensure the page displays properly. A
    few of the following recommendations may go directly against something I told
    you in previous chapters, that''s okay. As I mentioned, coding for e-mail has
    some unique challenges that sometimes cause us to change our standard coding methods.


    TIP Campaign Monitor, a fabulous ESP and wonderful resource for all things HTML
    e-mail, is part of the Email Standards Project. As such, they have a ton of information
    about CSS among the most popular e-mail readers. You can find this information
    at www.campaignmonitor.com/css and www.email-standards/clients.


    # Keep It Simple


    Remember the purpose of your e-mail and stick to it. You don''t need to include
    the entire website''s navigation or layout in an e-mail design. Usually, a header
    and footer, in addition to the main body content, are sufficient.


    While we''re talking about keeping it simple, I should mention that back-ground
    images aren''t supported by all the browsers. As such, stick to solid-color backgrounds
    that can be applied with HTML, as opposed to gradients or patterns that require
    image-based backgrounds.


    Figure 10-1 shows an example of a typical HTML e-mail I create for my clients.
    Notice that this e-mail is not text heavy, but instead gets the message in just
    a few sentences. The rest of the e-mail is photographic in nature, to be visually
    appealing and attention-getting. There is a link at the top of the page for readers
    who can''t see the images in their e-mail readers. That link takes users to view
    the same e-mail in their web browser (which generally does a better job of displaying
    HTML e-mail). I''ve marked a few other aspects of the design to point out ways
    our e-mail design differs from that of a traditional webpage.


    # Use Absolute Paths


    Whenever you add a link or an image to a webpage, you have the option of using
    either absolute or relative path names. Relative path names are shorter'
