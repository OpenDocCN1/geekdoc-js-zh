    # PROBLEM 6-1


    I''m having trouble with some of my content areas displaying properly in older
    versions of Internet Explorer. I''ve used your guidelines for specifying box widths,
    but the sizes are off in those older browsers. What''s going on?


    # SOLUTION


    The W3C box model as I have specified it not always been supported uniformly by
    Internet Explorer. In particular, versions prior to version 6 supported a different
    methodology for determining box widths.


    According to the W3C, the total width of a box is determined by adding the left
    margin, left border, left padding, content width, right padding, right border,
    and right margin. In those nonconforming versions of IE, the padding and border
    sizes are considered to be inside the content width. This means if you specify
    your content should be 100 pixels wide, with a 40-pixel padding and a 3-pixel
    border, older versions of IE will incorrectly'
