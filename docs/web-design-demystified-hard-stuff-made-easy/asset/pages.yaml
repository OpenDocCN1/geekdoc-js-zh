  md: 'locate reference images later. Another folder I typically create is called
    "common" and contains all the non-HTML code files referenced by the web-pages,
    such as the style sheet (which is a .css file) and any JavaScript files (saved
    with a .js extension).


    After you finish exporting the various elements of the design from your graphics
    editor and have them organized on your computer, it''s time to switch to a coding
    tool. You can definitely code HTML and CSS with any text editor, the vast majority
    of web designers use a professional, web-specific tool such as Dreamweaver or
    Expression Web.


    If you exported code from your graphics editor, open it in your code editor and
    take a look at what you have. When you view HTML files in a browser, the code
    is translated between the scenes to display the page accordingly. When you instead
    open that same file in a code editor, you see only the code. You might think of
    HTML files as being two-faced, in that they look completely different depending
    on how you approach them.


    > **NOTE** Many code editors contain browser previews so you can see both "faces"
    of the HTML code from within one development tool. In Dreamweaver, the Code view
    displays the code, while the Design view shows a browser preview.


    # Basic Page Code


    All HTML pages need to have the html, head, and body tags, along with the DO identifier.
    This means, at the very least, your pages should include the following:


    +   - A line containing information about which version of HTML is used

    - A header section, containing descriptive information about the page

    - A body section containing the page''s actual content


    > **NOTE** The required tags for HTML pages depend on part of the version of HTML
    currently being used. HTML 4.01/XHTML 1.0 was released as an official specification
    by the World Wide Web Consortium (W3C) in 1999. As of this writing, HTML5 is in
    development but is not expected to be completed for several years. Even so, some
    parts of the HTML5 specification may be supported by new browsers before the specification
    is finished. Therefore, it''s a good idea to check the W3C''s website (www.w3.org)
    for updates. To read more about what''s coming in the next versions of HTML and
    CSS, check this article: http://pcworld.id.com/article/345863/geek_101_html5_css3.'
