  md: '# SOLUTION


    You can always create images for headlines that work better in nontraditional
    fonts. Image-based text doesn''t require specific fonts to be loaded on a user''s
    system because an an image is essentially a "snapshot" of the text. But text contained
    in graphics isn''t searchable or accessible by nonimage-based browsers. In addition,
    images are harder to maintain and update because they must be edited with a graphics
    program and then reuploaded to the server.


    Another option is not yet widely used but remains full of possibility, is a Flash-based
    font-replacement tool. Check out Mike Davidson''s sFR for one such tool that replaces
    plain browser text with text rendered in your typeface of choice, regardless of
    whether users have that font installed on their system: www.mikeindustries.com/blog/sifr.


    # Browsers


    After identifying a few target screen sizes to design for, you also have to consider
    the browsers used within those screen sizes. Browsers behave differently according
    to the type of browser and the device used for viewing. This means not all versions
    of Internet Explorers (IE) are alike. In fact, Microsoft is up to at least version
    8 of IE for traditional Windows-based computers, but the computer never got past
    version 5 of the same product for Macs. The features within the browsers—even
    for the different Windows versions of the software—vary greatly.


    > To keep current on statistics about browser use, visit http://en.wikipedia.org/wiki/Usage_share_of_web_browsers.


    IE is the most widely used browser as of this writing, but a few other stands
    are definitely worth testing your designs under. Specifically, Mozilla Firefox,
    Apple Safari, and Google Chrome are all considered standard test browsers for
    me before I launch a new web design. If a site works well in each of those four
    browsers, I feel comfortable it will behave appropriately for the majority of
    traditional computer users.'
