  md: 'Chapter 9 GOING LIVE


    # Documentation


    The most successful web projects are thoroughly documented throughout the design
    and development phases. In addition, effective and efficient sites are continually
    redocmented after the site’s launch and during any updates. While this may seem
    like the least enjoyable aspect of the project, it can often save immense amounts
    of time and money while the site is being maintained.


    In the beginning of the book, I outlined some common types of documentation for
    web projects. At the end of any project, it is important to confirm that all appropriate
    documentation has been updated according to the final outcome. Let’s review those
    documents briefly to determine which need updating.


    +   * Proposal (used to sell the project to the client) This does not need to
    be updated.


    +   * Statement of Work/Design and Architecture Specification (used to detail
    the exact course of action to be taken during development) Addendums may be added
    to document any changes, regardless of how small, and to avoid questions later.


    +   * Mockups/comps (used to give visual descriptions of how the site will be
    implemented) Mockups should be updated to show any changes required during the
    development process.


    +   * Site maps, wireframes, and storyboards (used to outline the site’s structure
    and flow) Notes and addendums should be added to document any changes that occurred
    during production.


    # Style Guides


    There is one additional piece of documentation that needs to be created, if it
    hasn’t been already. The style guide is a document that spells out the decisions
    made in designing the site. For example, what fonts were used? It’s important
    to specify only the font name, but also the sizes used, and well as any other
    typographical details needed to reproduce all graphical and web-based text.


    Style guides don’t have to be fancy or long. Rather, they just need to effectively
    transfer the style information from the original designer to whoever might need
    to maintain or edit the site. In fact, because you—the original designer—might
    not even know who will make changes to the site in the future,'
