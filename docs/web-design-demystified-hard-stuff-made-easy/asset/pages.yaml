  md: '# chapter 10


    # E-mail Design


    The final aspect of web design I''d like to cover is an area that has grown tremendously
    over the past decade: E-mail design. In fact, you''ve probably watched it grow
    as your inbox has become a lot more colorful (and a lot busier!).


    # CHAPTER OBJECTIVES


    In this chapter, you will


    +   * Identify the pros and cons of e-mail marketing

    * Recognize how designing for e-mail readers is different from designing for browsers

    * Understand the use of e-mail service providers


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_250_0.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'Ten years ago, e-mail programs weren''t capable of interpreting HTML within
    e-mails. But now, widespread support of HTML and CSS by e-mail readers significantly
    changed the face of business e-mail. While most companies still provide plain-text
    e-mails to customers who request them, the vast bulk of business marketing and
    advertising e-mail is now sent with embedded HTML.


    For the designer, this brings a new avenue of work opportunities, as well as headaches.
    Why? Because an e-mail embedded with HTML essentially just a webpage (like those
    you''ve learned to create in the rest of this book). So if you can design and
    code webpages, you can design and code HTML e-mail.


    The reason for the headaches is this: Support for HTML and CSS is growing among
    e-mail readers, but it still lags behind many fronts. In fact, coding HTML for
    e-mail is now like coding HTML for web browsers was a decade ago—which means you''ll
    spend a lot of time testing, and testing, and revising some more.


    # E-mail Standards


    The first thing we need to discuss about e-mail design is its standards. Earlier
    in the book, I discussed how the W3C maintains standards for various web coding
    languages. Those standards are then used by browser developers to ensure that
    webpages viewed in their browsers display as expected.


    The same concept holds true for e-mail coding... to a point. The problem is that
    e-mail application developers don''t follow one particular set of standards for
    e-mail display. In November 2007, a group of people got together to form the Email
    Standards Project. This organization works with e-mail application developers
    and the design community to improve web standards support and accessibility in
    e-mail.


    While this is undoubtedly going to be a slow process, there is great hope among
    the design community that this organization will help bring the same level of
    consensus that the W3C brought to the web browser front.


    You can download the Email Standards Project’s “Acid Test” to see exactly how
    they tested each e-mail client. You can also view the results of their test, and
    learn more about the movement, at www.email-standards.org/acid-test.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Planning for E-mail Design


    Much of the beginning of this book was devoted to helping you plan a website design
    project. E-mail design requires the same amount of planning to ensure the e-mail
    is sent, received, and viewed successfully. When planning a website, it’s important
    to determine which technologies meet the site goals. Likewise, with e-mail design,
    you must take a step back before designing to determine what type of e-mail will
    best serve the target audience: plain-text or HTML.


    # Pros and Cons of HTML E-mail


    The most basic e-mail is referred to as plain-text, that it contains only text
    characters and no additional formatting or coding. This is the type of e-mail
    most of us have been sending and receiving for years. HTML e-mail, by contrast,
    is actually an HTML page displayed in an e-mail reader. While there are some great
    benefits to sending webpages through e-mail, there are also many drawbacks.


    # Con: HTML E-mail Sometimes Dilutes the Message


    First, let''s consider the purpose of e-mail. At the end of the day, we use e-mail
    to communicate with each other. While there are certainly many forms of communication,
    e-mail has traditionally used written language to communicate. All e-mail readers
    allow users to read written text.


    When you start styling that text with color and other formatting, you stop relying
    on the written word to communicate your message. Before you make the decision
    to send HTML e-mails, you need to determine the specific message of the e-mails
    being sent, and whether any extra formatting will affect that message.


    # Con: You Can''t Control the Display Method


    Unlike web browsers, which have become much more uniform in their display and
    support of HTML, e-mail readers are plentiful and vastly different from one another.
    Consider all the ways you read e-mail. If you have a Yahoo!, Hotmail/Live Mail,
    or Gmail account, you probably read your e-mail in a web browser.'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'But you still have the option to read your e-mail in a stand-alone e-mail program
    like Outlook or Apple Mail. And if you are like a growing number of people, you
    might also check your e-mail on a smart phone like a Blackberry or iPhone. I just
    named seven different ways to read an e-mail, and I''m only getting started!


    It is virtually impossible to know how your HTML e-mails will display read by
    the end user. Testing in as many of the popular e-mail readers as possible is
    certainly important, but ultimately you must make design decisions to ensure the
    widest possible audience can still glean the message being communicated. Keep
    this in mind when deciding whether HTML is the best delivery method for a particular
    e-mail.


    # Con: Readers May Not Receive Your Message


    Due to the proliferation of HTML e-mail, the simple truth is that plain-text e-mail
    is more likely to actually get to the reader. This may mean that the most important
    e-mail communication with a customer—such as receipts—should be kept in plain
    text.


    Many e-mail readers block images and attachments from unknown senders or suspected
    spammers. One reason this happens is that anything attached to an e-mail is capable
    of harboring viruses and other malicious code. Also, when you send HTML e-mails
    with images stored on a web server, you can tell whether the e-mail was opened
    by simply reviewing the site''s access logs to see if the images were displayed.
    This allows spammers to differentiate between active e-mail addresses and those
    that are bad.


    In fact, HTML e-mails are more likely to be tagged as spam for having embedded
    images. That means your beautifully designed HTML e-mail may end up in a customer''s
    spam bucket and eventually in the trash without customer knowing it.


    # Con: HTML E-mail Takes Longer to Download


    Another reason HTML e-mail might not make it to the reader is size. If you get
    a little crazy with large images and hefty attachments, you can cause someone''s
    e-mail system to slow down or even crash. E-mail readers on mobile devices often
    only download the first 100kb or so of an e-mail, so it''s important to create
    web graphics that are small in file size and quick to download.


    Okay, now that we''ve moved through a few of the drawbacks, let''s switch gears
    and consider the reasons you might want to use HTML e-mail.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Pro: HTML E-mail Is More Visually Appealing


    Let''s face it: Most of us react more quickly to an image of a double-dip chocolate
    ice cream on a hot summer day than we might to those words mixed in other text
    in a crowded paragraph. As the saying, "a picture is worth a thousand words."
    When it comes to marketing, those pictures can mean the difference between closing
    a sale and losing a customer.


    # Pro: HTML E-mail Is Cost Effective


    Advertisers who use to rely on expensive print-mail campaigns are largely embracing
    HTML e-mail as an efficient way to get their messages in front of customers more
    quickly and less extensively. While design costs are about the same, the cost
    of sending a thousand e-mails is significantly less than the cost to print and
    snail-mail thousand postcards to customers.


    # Pro: HTML E-mail Is Targeted


    While most companies do target ZIP codes when sending snail-mail ads, e-advertising
    allows you to target specific demographics and behaviors. For example, suppose
    you are a customer of a certain grocery store that has recently started offering
    delivery services. Being interested in this service, you viewed a page on the
    company''s website describing this new feature, but you never actually purchased
    it. Because you were logged into your account with this company at the time you
    viewed the delivery page, they decide to send you a targeted e-mail ad offering
    free delivery on your order. Such targeted e-mails to be highly successful.


    # Know Your Audience


    From a legal standpoint, the most important thing to know about your audience
    is whether you have permission to contact them in this manner and for this purpose.
    In short, spam is any e-mail sent without the permission of the recipient.


    Here are a few guidelines to help you e-mail the right people (at least legally):


    +   - Send e-mail to current customers. Most people consider anyone who has purchased
    from within the last two years to be a "current" customer.

    - Send e-mail to people who request information from you, either in person or
    online, but only about relevant topics. In other words, if someone responds to
    a job posting on a company''s website but isn''t hired, it''s not okay for that
    company to start sending him marketing e-mail about its products.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'This means it''s not okay to send marketing messages to e-mail addresses you''ve
    found on other messages that have been forwarded to you or those found on the
    Internet. Just because I post my e-mail address on my personal website doesn''t
    mean I want to receive marketing e-mail from any business who visits my website.


    While it may be tempting to send mass e-mails to strangers in the hopes one day
    may become a new customer, it is much more effective to target people who have
    already expressed an interest in your business or product. If you regularly message
    people who didn''t ask to receive your e-mail, you risk being put on "blacklists"
    by the various e-mail service providers. Once your site has been identified as
    one that sends spam, it can be difficult to get any of your messages through,
    regardless of whether they are being sent to legitimate recipients.


    As a web designer, it''s often up to you to educate others about the dangers of
    spam. If you''re working with a business that ensures whether its marketing list
    is legal, consider passing a free "Permission Guidelines Handout" from Campaign
    Monitor: www.campaignmonitor.com/downloads/permission-guidelines-handout.


    # Follow Federal Trade Commission Guidelines


    Federal law requires you to always provide a way for a recipient to specify that
    he no longer wishes to receive your messages. At a bare minimum, this means you
    must provide a valid return address to which users can send a "please remove e-mail".
    Most reputable e-mail systems offer efficient unsubscribe mechanisms allowing
    users to opt out through an online form linked from all e-mails.


    Federal law requires you to keep such unsubscribe methods available for at least
    30 days after e-mails are sent. After receiving an unsubscribe request, companies
    have 30 days to stop sending the recipient-email.


    To avoid your email being blocked as spam, you must also use legitimate headers
    and subject lines. In other words, you can''t send an e-mail with a subject of
    "Free delivery on your next order" unless the offer is valid and intended to recipients.
    The from and reply-to address fields must also contain valid, active e-mail addresses.
    Finally, the company''s business name and physical mailing address must also be
    visible on the message.


    TIP Check out www.ftc.gov/bcp/edu/pubs/business/ecommerce/bus61.shtm for more
    information about the CAN-SPAM Act.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Know the Available Tools


    The tools used to develop and send HTML e-mails depend somewhat on the purpose
    of the messages being sent and the company that is sending them. As I mentioned,
    an HTML e-mail is really just a webpage. First, let''s consider the tools used
    to design and develop HTML e-mail.


    # Design and Development Tools


    I don''t have a lot of new tools to tell you about this section, because the tools
    used to design and develop HTML e-mails are, for the most part, the same as those
    used to develop standard webpages. This means you can continue to use Photoshop
    (or another favorite design tool) to design your e-mails, and Dream-weaver (or
    another favorite development tool) to code them. The real difference comes when
    you want to publish the e-mails.


    # Publishing Tools


    In the previous chapter, I talked about using FTP software to publish your webpages—thereby
    making them live and accessible by anyone with Internet access. HTML e-mail has
    a completely different publishing process.


    The best way to publish, or send, bulk HTML e-mail is to use an e-mail service
    provider (ESP). Similar to an Internet service provider, an ESP handles all aspects
    of bulk e-mail delivery, from managing the recipient lists (both subscribe and
    unsubscribe features) to tracking the number of times each e-mail is opened and
    clicked.


    Just as there are hundreds of ISPs, you also have your choice of quite a few ESPs.
    While web designers typically get to choose the design and development tools used
    for a project, we don''t often get to select the ESP. More commonly, it is the
    company sending the e-mail who chooses the e-mail service providers.


    As a freelancer, I have used a fair number of ESPs, depending on the company sending
    the messages. Each of the tools I''ve used has its own list of pros and cons,
    depending on the business and its audience. Sometimes I am asked to make suggestions
    to companies selecting a new ESP. Here are a few features I suggest you look for
    when researching ESPs:


    +   - Contact management tools to handle the subscriber list

    - E-mail creation tools to help format and lay out the content

    - E-mail sending tools to help you test your e-mails'
  merge: -1
  pgno: 256
- img_proc: true
  md: '+   - Design services to help with graphic design and creative support

    - E-mail reporting tools to help track things like click-throughs, opens, and
    conversions

    -Ease of use

    - Support


    Many e-mail service providers include e-mail creation tools to help you format
    and lay out the content before the message is sent. These tools allow you to select
    a design template and then use "fill in the blank" forms to enter the e-mail content.
    Tools like this can be great for companies with little budget to send custom-designed
    emails every time a message is sent. They often offer little flexibility and don''t
    do much to keep a company''s branding consistent.


    A great way to take advantage of the e-mail creation tools without compromising
    design and flexibility is to design a custom template. I frequently am hired to
    create customized templates (which include the client''s branding) that are then
    imported into the ESP''s software. The custom templates then allow anyone within
    the client''s business to easily create and send a branded e-mail.


    As with any software, it''s important to try before you buy. ESPs typically charge
    a monthly fee or per-mail/per-recipient fees (or a combination of both). Many
    offer rebranding tools to allow designers to create their clients'' e-mails, and
    give the clients tools to send and manage them. Of the most popular ESPs include:


    +   - Blue Hornet www.bluehorst.com

    - Campaign Monitor www.campaignmonitor.com

    - Constant Contact www.constantcontact.com

    - Emma www.myemma.com

    - iContact www.iccontact.com

    - Lyris www.lyris.com

    - MailChimp www.mailchimp.com

    - Vertical Response www.verticalresponse.com


    # # Coding for E-mail Design


    Throughout this book, I''ve provided instruction on using HTML to code webpages.
    For the most part, all of the elements and attributes discussed far will also'
