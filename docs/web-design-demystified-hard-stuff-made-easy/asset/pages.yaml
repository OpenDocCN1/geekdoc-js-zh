  md: 'search engines that don''t allow users to promote certain links do consider
    user input. When you search for a phrase, the search engine tracks which links
    are actually clicked within the results. It records that information and adjusts
    the results as needed to ensure the most likely (that is, most popular) links
    display before those that are rarely clicked.


    This means we end up with a bit of the "chicken and egg" syndrome. I often hear,
    "How can I increase my ranking if I''m showing up on page 30 of the results and
    no one gets the opportunity to click my link?" Keep reading...


    # Submit Your Site


    All of the top search engines provide free online forms used to recommend new
    or updated sites.


    +   - Google http://www.google.com/addurl

    - Yahoo! http://siteexplorer.search.yahoo.com/submit

    - Bing http://www.bing.com/docs/submit.aspx


    Usually, submitting your site using these free tools is enough to get your site
    listed, but it''s not enough to get you anywhere near the top of the search results.
    I''m afraid, it is not free.


    # Increase Your Ranking


    As a designer, one of the most common questions I hear from site owners is this:
    How can I increase my ranking in Google? Search engine optimization (SEO) involves
    not only preparing the site to be indexed by the search engines, but also being
    proactive about bringing new customers to the site through those same search engines
    (often in the form of sponsored search advertising).


    While SEO should be a key part of any modern website project, many people are
    of the mindset "if you build it, they will come." Because of that, SEO is often
    left, with companies not really understanding its importance until they realize
    no one is visiting their site.


    It''s your job, as a web professional, to educate clients about the importance
    of SEO. If a site is built with SEO in the beginning (using the concepts mentioned
    previously), it will be easier to increase the site''s presence in the major engines.


    After the site has been built with SEO in, the best way to increase your site''s
    visibility, popularity, and ultimately its ranking in the search engines is to
    take advantage of pay-per-click (PPC) advertising. All of the major search'
