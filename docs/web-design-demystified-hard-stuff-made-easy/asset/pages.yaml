  md: '# Box Properties


    Every element on a webpage—text, photographs, logos, drop-down menus, and so on—is
    contained within a box of sorts, or at least it''s considered to be a box in coding
    terms. This is important to realize, because you must code each element on the
    page as if it had four corners and four sides, even if it doesn''t look like when
    it''s displayed in the browser.


    As mentioned in Chapter 4, two types of boxes are used in web development: block
    and inline. By default, each type of element falls into one of those two categories.
    However, the box type can also be changed as needed, using the display property:


    ```

    div#nav {display:inline};

    ```


    Using a value of inline causes a normal block-level element to display as if it
    were an inline element. By contrast, an inline element can be made to display
    as a block-level element with a value of block. Or, you can use:none to hide the
    content altogether.


    > TIP Refer to Table 4-1 in Chapter 4 for a reminder of the differences between
    block and inline elements.


    All block-level elements use five basic spacing properties that affect the area
    around the element''s “box":


    +   - Height

    - Width

    - Border

    - Margin

    - Padding


    # Height and Width


    When the box in question is a block-level element, it will fill the available
    horizontal space by default. This means that unless you specify a smaller width,
    paragraphs (which are block-level elements) will run all the way across the page.


