  md: 'Each attribute has a value, which comes after the equal sign and is placed
    within quotation marks. For the View Sample Products link in the example, "products.html"
    is the value of the href attribute and "View sample products" is the value of
    the title attribute.


    The tags located in the body content area of a webpage are discussed in the following
    chapters.


    #  Basic CSS Code


    I''ve already mentioned the phrase "style sheets" a few times, but I haven''t
    really given them a full explanation. Part of the reason is that style sheets
    weren''t really a part of the earlier versions of HTML. The purpose of cascading
    style sheets is to separate the style of a webpage from its content.


    The current W3C specifications dictate that we use HTML only to identify the content
    of that, and then use a style sheet to specify the presentation of that content.
    This only makes webpages more accessible and usable to all users (regardless of
    their browsers, platforms, operating systems, physical limitations, and so forth),
    but also to search engines and other types of software.


    > TIP If you''ve ever used the drop-down menu in some versions of Microsoft Word,
    you''ve already used a style sheet of sorts. The most basic style sheet might
    include a style called Body Text that specifies how the body text of the webpage
    should look—which font and color to use, how much space to leave around it, and
    so on.


    CSS offers three types of style sheets:


    +   - Styles are embedded right within the HTML code they affect.

    - Styles are placed within the header information of the webpage and then affect
    all corresponding tags on a single page.

    - Styles are coded in a separate document, which is then referenced from within
    the header of the actual webpage. This means a single external style sheet can
    be used to affect the presentation on a whole group of webpages.


    You can use any or all of these types of style sheets in a single document. However,
    if you include more than one type, the rules of cascading order take precedence
    over internal styles, which take precedence over external styles.'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'In a nutshell, CSS styles apply from general to individual. This means a rule-set
    in the header section of a document overrides a linked style, while a ruleset
    in the body of a document overrides one in the header. In addition, more local
    (or inline) styles only override the parent attributes where overlap occurs. We''ll
    look at this more in Chapter 5.


    # Inline


    Inline styles are enclosed in straight quotes using the style attribute with whichever
    tag you want to affect. For example, if you wanted to cause a paragraph of text
    to display using the Verdana font, you could use an inline style declaration like:


    ```

    <p style="font-family:verdana;">

    ```


    If you also wanted to make text blue, you can add another rule to just that. (Rules
    are separated by semicolons.)


    These are CSS rules.

    The two rules together are considered a style declaration.


    ```

    <p style="font-family:verdana;color: blue;">

    ```


    > **TIP** Inline styles are best for making quick changes to a page, but aren''t
    suited for styling an entire document or website. The reason is when styles are
    added to a tag, they occur only for that individual tag and not for all similar
    tags on the page. To affect all similar tags on the page, use internal or external
    styles.


    # Internal


    When you want to change the font for all the paragraphs on a single page, you
    can use an internal (also called embedded) style sheet. Internal styles are added
    with the style element in the header content of the page. Here''s an example of
    what an internal style sheet might look like:


    These are called selectors.


    ```

    <head>

    <title>Amy''s Flowers</title>

    <style type="text/css">

    h1 {font-family: georgia; color: blue;}

    p {font-family: verdana; }

    </style>

    </head>

    ```


    All rules end with semicolons.


    The two rules together are contained within curly brackets.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'With internal style sheets, a selector is placed before the declaration, which
    is enclosed in curly brackets. The selector tells the browser which of the page
    you want to affect. In the preceding example, h1 and p are used as selectors to
    tell the browser we want to change the appearance of the most important headlines
    and all paragraphs on the page.


    Some people prefer to break internal rules over several lines to ensure readability.
    That means the following example is just as valid as the preceding example:


    ```

    h1 {font-family:verdana;

    color:blue;} /* These are the CSS properties */

    ```


    **TIP You can use certain shorthand properties to reduce the amount of coding
    necessary.** For example, instead of specifying both the font-family and font-size
    properties, you could simply use the font property, as in:


    ```

    h2 {font: verdana 12pt};

    ```


    # External


    The third and final type of style sheet is not contained within the HTML page,
    but is housed within its own document and then referenced from within the HTML
    document. An external style sheet doesn''t use the style tag, or contain any HTML
    tags at all, but simply includes a list of rulesets for the browsers. As such,
    an external style sheet might look like this:


    ```

    h1 {font-family: georgia; color: blue};

    h2 {font-family: georgia; color: orange};

    p {font-family: verdana; font-size:12pt};

    ```


    When you create your external style sheet, save it as a .css filename extension.
    Then return to your HTML file and add the link tag to the header content to reference
    the external style sheet, as in the following


    ```

    <head>

    <title>Amy''s Flowers</title>

    <link rel="stylesheet" type="text/css" href="styles.css" />

    </head>

    ```


    This specifies the type of file linked. This specifies the file containing the
    external style sheet.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Coding Practices


    > TIP External style sheets are best used to house all the styles for an entire
    website. Note these styles can be overridden by any internal or inline style sheets
    contained within individual pages.


    If you view the source code for several different websites, you will see a few
    similarities. This is not a coincidence; according to the latest HTML specification,
    you should keep in mind the following etiquette rules as you code your pages:


    +   - All tags should be lowercase.

    - All tag values should be placed within straight quotation marks.

    - All tags must be closed.


    > NOTE These rules come from the XHTML 1.0 specification, which is the latest
    published spec related to HTML that has been created by the W3C (as of writing).
    When HTML5 is released, the rules may change.


    You also want to observe proper spacing within tags. Let''s look more closely
    at some example code to identify where proper spacing should occur:


    ```

    No space is between the brackets and the element name. A single space should come
    between attributes.

    <body><a href="http://www.google.com" title="Search Google">Search Google</a>

    A single space should come between element names and attributes.

    No space should come between a tag and the text it affects.

    ```


    Finally, you must consider how to nest tags properly. The tag nesting refers to
    the process of using one HTML tag inside another. The easiest way to understand
    this concept is to see it in action:


    ```

    <strong><em>These tags are nested properly.</em></strong><strong><em>These tags
    are not nested properly.</em></strong>

    ```'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'You should always be able to draw semicircles that connect the opening and
    closing vertices of each tag. If any of your semicircles intersect, your tags
    are not nested properly.


    **TIP** When you look at other designers'' code, you will likely see many lines
    of code are indented. People sometimes indent code to help organize it visually,
    but indenting has virtually no impact on the code itself.


    # Naming Conventions


    If you use a tool like Dreamweaver, the program will automatically prompt you
    to save in the correct file format. Even so, remember the following few points
    when saving your HTML files:


    +   - You can use .html or .htm, but it''s best to be consistent in whichever
    you choose.

    - Some web servers are case-sensitive, MyPage.html is different than mypage.html.

    - Don''t use spaces, punctuation, or special characters other than hyphens (-)
    and underscores (_).


    # Chapter Summary


    Whew! This chapter covered a lot of the nuts and bolts required as you translate
    your designs from mockups to working webpages. Even if you ultimately decide to
    let your graphics editor do much of the work for you by exporting your designs
    and writing the code, it is important that you understand what is happening during
    that process. Knowing what''s going on behind the scenes will make it easier to
    fix errors and customize the code to display exactly as you intended.


    In the next chapter, I''ll discuss the HTML used for page layout in more detail,
    and outline the code necessary to add headlines, paragraphs, lists, links, images,
    tables, and forms.'
