    # Transitions


    Finally, I don''t want to finish this section on unique aspects of screen design
    mentioning webpage transitions. A transition refers to what happens when a user
    attempts to access a new piece of content. Does the entire page change appear
    in place of the old content, using the same layout and structure? Or is the new
    content placed in a new "layer" floating on top of the current page? What about
    pages that appear in completely new (pop-up) browser windows?


    If you have a Facebook account, you''ve probably seen a variety of transition
    methods. For example, when new changes flowed into the news feed, only the content
    within the news feed changes (older posts move down the page). And when someone
    posts a link to a YouTube video, you initially see a small preview of that move.
    When you click the preview, the video grows to full size and the content around
    it adjusts accordingly. These are all effective ways of transitioning between
    content without requiring additional user input.


    Because transitions affect how a user accesses content, it''s important for the
    design to incorporate a transition plan for the site.


    # Layout


    In Chapter 1, I mentioned that a wireframe document can be used to help refine
    a webpage layout before the page is actually designed in a graphics editor. A
    good web layout addresses the user''s needs while fulfilling the site owner''s
    goals.'
