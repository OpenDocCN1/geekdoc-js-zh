    * Transmit www.panic.com


    # Web-based FTP


    If you''re using a free service to host your website, you probably have FTP capabilities
    through that company''s website. This is called web-based FTP because you don''t
    need any additional software to transmit the files—in fact, you perform the file
    transfer directly within your web browser.


    Even if your host company doesn''t offer web-based FTP, if you use the Firefox
    web browser, you have an even better option. While I use the built-in FTP capabilities
    in Dreamweaver, since that''s my preferred HTML development tool, I sometimes
    have a need for file transfer outside of Dreamweaver. In those cases, I use a
    Firefox add-on called FireFTP.


    To install FireFTP (or another web-based FTP tool for Firefox), open Firefox and
    visit https://addons.mozilla.org for FTP. Locate the app you want to add, and
    click the corresponding Download or Add To Firefox button.'
