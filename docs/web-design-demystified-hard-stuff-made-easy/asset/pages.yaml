    # Form Processing


    So what happens after you''ve created the form? Is the form''s data e-mailed to
    the website manager or stored in a database somewhere? Is it, perhaps, written
    to another webpage on the site, such as with blog comments? Many possibilities
    exist, and they ultimately depend on the purpose of the form.


    Because HTML does not include form processing options, most web forms use some
    sort of scripting (such as ASP, PHP, or CGI) to process the data. When a user
    clicks the submit button, the contents of the form are sent to the script. The
    script determines what to do with the data: send it, store it, or display it.


    In many development teams, programmers typically handle the processing of web
    forms. If this responsibility falls to you, first check with the site''s hosting
    provider because they may offer free scripts to customers. Or, you can search
    the thousands of free scripts available at sites like:


    +   * www.scriptarchive.com

    * www.hotscripts.com

    * www.cgi-resources.com


    Pay attention to the documentation offered with each script, because it should
    tell you how to customize the script for your needs and how to install it on your
    server.


    After you install and customize a script, you''ll just need to reference it within
    the form. That is accomplished with the addition of two attributes to the opening
    form tag, like this:


    ```

    <form action="script.php" method="post">

    ```


    The action attribute identifies the location of the processing script. The method
    attribute carries two possible values: get and post. With the get method,'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Chapter 4 ALL ABOUT THE HTML


    the form''s data is added to the end of the script identified in the action attribute
    but it is being sent for processing. By contrast, the post method writes the form''s
    data to the message body when it is sent for processing. The former method is
    used primarily for search forms, while the later method typically works for just
    about every other type of form.


    # Images


    So far in this chapter, I''ve covered various ways you can organize and contain
    webpage content. For the most part, the HTML elements discussed pertain to text
    content. But we know the Web is a lot more than just text content. There is one
    HTML element in particular that you need to understand in order to add images
    to your webpages.


    The img element (short for image) is an inline, empty tag, that has no closing
    version. Instead, it has a few key attributes that tell the browser all about
    the image being displayed. The src attribute identifies the location of the image
    file, while the alt attribute provides a text for nonvisual browsers. Just as
    with adding links, the title attribute can also be used to provide a tool for
    supporting browsers. Finally, the height and width attributes (specified in pixels)
    tell the browser how much space on the page to allot for the image. Here''s how
    that might look in HTML:


    ```

    <img src="/images/banner.jpg" width="600" height="200" alt="Products Banner" title="Here
    are just a few of the products we feature each month" />

    ```


    Images can be placed within forms, inside tables, among paragraphs, and just anywhere
    in your webpages. After you add them with this HTML code, you''ll probably want
    to customize their display with your style sheet. You''ll see in the next chapter,
    CSS can be used to cause images to display as block-level elements, and then align
    them, overlap them, add borders, spacing, and even position an image in an exact
    location on the page.


    # Multimedia


    When you want to incorporate multimedia—anything beyond static images added with
    the img tag—you can do so in two primary ways: You can embed media so it appears
    within the webpage, or you can link to it.'
