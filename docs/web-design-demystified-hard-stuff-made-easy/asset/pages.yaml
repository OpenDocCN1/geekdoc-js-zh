    a web developer.


    To help you understand how a *client-side* script might work, consider forms you
    fill out on the Web. Have you ever clicked the submit button on such a form, only
    to be told you missed a required field? This type of form confirmation is accomplished
    through a client-side script. When the submit button is clicked, the script tells
    the browser to make sure any required fields are complete before sending the form
    content to its final destination. Nothing goes back to the server until the content
    is verified at the client (user) level. Once the content of the form get sent
    back to the server, a server-side script is called upon to process the form.


