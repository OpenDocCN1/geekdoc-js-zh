  md: '# CSS Positioning


    So I''ve discussed basic text alignment and floats, but what about the more powerful
    positioning I mentioned? There are four basic types of positioning with CSS: static,
    relative, fixed, and absolute.


    # Static and Relative Positioning


    Normal (also called static) is the default type of positioning that happens when
    no other type of positioning is specified. With normal positioning, items are
    placed one after another, starting at the upper-left corner of the page. By default,
    all elements are positioned normally unless you specify otherwise.


    Relative positioning starts off using normal positioning, but then allows certain
    elements to be moved up, down, left, or right from the original position. In other
    words, boxes are relative to where they would normally be placed on the page.
    Here''s an example of a level-two headline that is moved 100 pixels to the right
    of its normal position:


    ```

    h2 { position: relative; left: 100px; }

    ```


    When we use relative positioning, we''re moving the box relative to its current
    location. So if we want to move a box to the right, we actually do that by asking
    the browser to look at the left edge and push 100 pixels over to the right. To
    move it back toward the left edge, we''d instead specify a value of -100. With
    relative positioning, we have to think of this whole page as a big grid, with
    the zero point at wherever the box''s edge would normally be placed.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_163_0.png)


    # Fixed and Absolute Positioning


    With normal and relative positioning, elements are free to move around on the
    page. Conversely, the final two types of positioning—fixed and absolute—both'
  merge: -1
