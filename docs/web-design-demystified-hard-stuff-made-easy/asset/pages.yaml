  md: '# PROBLEM 4-1


    I want to include multimedia in my pages, but I don''t know how to use Flash.


    # SOLUTION


    A few years back, professional web designers were expected to be proficient in
    Flash as well as static web design tools. But then Adobe unveiled a much more
    robust version with Flash 5, and sent many traditional designers running for the
    hills (including me). The latest version is significantly more powerful as a delivery
    method for rich, interactive online content, but is also much more complex to
    use. As such, a new crop of Flash-centric developers has risen up, with traditional
    web designers acting in more of an art direction role for Flash projects.


    So, what does mean for you? I encourage you to explore Flash with Adobe’s free
    30-day demo. If it is something you enjoy using, take some classes and really
    dive into the product. You will find plenty of work as a custom Flash developer.


    But if Flash isn’t your thing, you have a few options. First, you could partner
    with a custom Flash developer. Second, you can purchase stock Flash files from
    sites like www.istockphoto.com and www.buystockflash.com. Third, you can take
    advantage of an intermediate tool that helps you create certain types of Flash
    files. For example, I like PulpMotion for making quick and easy Flash slideshows
    (www.pulpmotion.com) or SwishMiniMax for simple Flash banners (www.swishzone.com).


    # Chapter Summary


    Don you feel comfortable with HTML yet? Don’t worry if you don’t, because it will
    come much more easily with a bit of practice. Before you know it, you’ll be coding
    line breaks <br /> in your sleep. But in the meantime, use the many online references
    mentioned in this chapter to stay up-to-date on the code and increase your skills.


    Chapter 5 moves on to presenting the nitty-gritty of CSS, so you can style all
    the HTML you learned in this chapter.'
