    +   1. Identify the key words or phrases you want to sponsor. Certain words and
    phrases are more popular than others and therefore cost more to sponsor.


    +   2. Create the ad. All sponsored ads are text-based, with a limited number
    of characters.


    +   3. Place a bid, which is the amount of money you''re willing to pay each time
    someone clicks your ad. For example, if you bid $0.10 per click and 100 people
    click your ad, you will be charged $10.


    +   4. Set a daily, weekly, and/or monthly spending limit for your advertising
    campaign. If you specify not to spend more than $100/day, your ad won''t be shown
    after that budget is reached each day of the campaign.


    That''s it! PPC advertising on the search engines is easy to set up, but be warned
    that it can quickly become a full-time job. The most successful search engine
    advertisers sponsor a variety of different search terms, using multiple ads and
