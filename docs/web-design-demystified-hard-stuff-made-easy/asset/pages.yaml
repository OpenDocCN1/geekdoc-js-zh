  md: '# Naming Slices


    After you''ve created all the necessary slices, it''s time to name them. Here
    are the basic steps to do that in the two most popular web graphics programs:


    +   * In Fireworks, you can do this in two different places. You can select the
    slice and name it in the Property Inspector, or you can add the name after clicking
    the web layer in the Layers panel. (If you don''t see the Property Inspector,
    choose Window | Properties.)

    * In Photoshop, you use the Slice Selection tool to double-click the slice and
    access the Slice Options dialog box.


    Regardless of which program you use, it''s important that you come up with an
    appropriate naming convention for your site''s assets (supporting files) before
    you starting. Here are a few guidelines to consider:


    +   * Use descriptive filenames that might increase your site''s search traffic.
    For example, suppose each news article on the site displays a photograph of the
    article''s author. You might name each photo something "article1-photo." While
    that works great to help you identify which photo goes where, it doesn''t actually
    tell you about the contents of the photo. An alternative might be "joesmith-photo."
    Not only does this identify the image as a photo of Joe Smith, but it allows anyone
    searching for "joe smith photo" to find the image.

    * Avoid naming slices unless they will be used on a page that will never need
    to be updated. It''s very tempting to name images with schemes such as "home-01.jpg,"
    "home-02.jpg," and so on. The main problem with this type of convention comes
    in the site maintenance. Suppose you need to add an image in between 02 and 03.
    Do you use 02b? It can get real confusing, fast.

    * Use dashes instead of underscores. Underscores have been a common way to separate
    words in filenames, because spaces aren''t allowed. A better choice is the dash,
    because it is more easily recognized when the filename is linked (and underscores
    by default).

    * Be consistent with regard to case. It''s fine to mix cases, in JoeSmith-photo,
    provided you can remember your naming convention and stick with it. If you name
    a file JoeSmith-photo and then link to joesmith-photo, you''ll end up with a broken
    link.'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'NOTE Your web graphics program may include the option to automatically name
    each slice (such as slice01, slice02, and so on). While this can be helpful if
    you need to name a lot of slices, it works best if you customize the settings
    so you have a better idea what each slice contains. In other words, AboutUs01
    and News01 make more sense than slice01 and slice02.


    # # Exporting Designs


    After you''ve named your slices, it''s time to optimize them. This means you select
    the desired file format (GIF, JPEG, or PNG) and the appropriate settings (number
    of colors, dithering, and so on). Here are a few tips to help you through that
    process:


    +   - A smaller color palette makes GIFs smaller Remember that images saved as
    GIFs have a limited number of colors (no more than 256). The fewer colors present,
    the smaller the file size. Therefore, it''s important to use only as many colors
    as is necessary to accurately display the image. Few GIFs actually need all 256
    colors. Try reducing the number of colors all the way down to 8 or 16, and work
    your way back as high as you need to go to make the image look acceptable.

    - Dithering adds file size When you reduce the number of colors in an image''s
    palette, the program must know what to do in the areas that contain the colors
    being removed. If you tell the program to use dithering (you can specify the amount
    of dithering between 0 and 100 percent), it may use multiple colors in a checkerboard
    pattern in those areas to give the appearance of the color you removed. If no
    dithering is used, the removed colors are replaced with another solid color. Dithering
    can be useful in providing the appearance of gradations or subtle color shifts—be
    warned that it adds to the file size.

    - Photographs don''t usually require high-quality JPEG settings When you save
    an image as a JPEG, you choose between several quality levels. The highest level
    has the least amount of compression and, therefore, the least amount of data removed.
    The lowest-quality JPEG has the most data removed and often looks blotchy, blurry,
    and rough. I usually save JPEG images with a medium quality. Your decision will
    be based on the lowest quality you can use without compromising the integrity
    of the file: The lower the quality level, the lower the file size.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# TIP JPGs are most commonly used for images of a photographic nature and those
    that feature color gradations.


    +   - The PNG format is flexible enough to fit a variety of situations. When saving
    a file as a PNG, you must first choose how many colors to include. Saving as a
