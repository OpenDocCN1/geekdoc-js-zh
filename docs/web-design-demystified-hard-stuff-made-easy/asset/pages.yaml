  md: '# WEB DESIGN DeMyStifiEdD


    Finally, it might make sense to collaborate with clients and/or team members through
    a tool like Google Docs (http://docs.google.com). One of my clients prefers this
    method of communication to track deliverables, tasks, and deadlines. We even use
