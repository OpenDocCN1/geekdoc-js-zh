  md: '# JavaScript


    JavaScript is referred to as an object-oriented scripting language used to perform
    actions in webpages. JavaScript is extremely popular among developers, due in
    part to the fact that it enjoys widespread support among web browsers.


    JavaScript is an interpreted language, which means it is not compiled, or translated
    into machine-language (1’s and 0’s) before use. Like HTML, you can use any text
    or web development editor to write JavaScript.


    When you use JavaScript, it’s often placed in the HTML of your page. This means
    you can learn JavaScript from visiting your favorite websites, just as you can
    with HTML, and viewing the page source from the browser.


    > NOTE It is a common misconception that JavaScript is part of Java. JavaScript
    was originally created with Java’s syntax and terminology in mind, the two are
    quite different.


    # Terminology and Syntax


    JavaScript can either be included within your HTML pages or left alone in .js
    files that are linked to the HTML pages of your site. When included within the
    header content of your HTML page, JavaScript is placed between opening and closing
    script tags:


    ```

    <script language="JavaScript" type="text/javascript">

    ... goes here ...

    </script>

    ```


    You should learn new terms before you use any JavaScript. Given that scripts are
    essentially a set of instructions to the browser, you can often read them as a
    series of commands, made up of statements and expressions. One type of statement
    is an if... else control statement, also called a conditional, which tells the
    browser to do one thing if x is true and to do something else if x is false.


    While HTML entities are contained within angle brackets, JavaScript statements
    are surrounded by curly brackets. In addition, all statements (instructions) end
    with semicolons, similar to CSS. Here’s a simple example of the layout you’d use
    creating a set of JavaScript instructions:'
