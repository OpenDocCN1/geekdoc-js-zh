  md: '# Copywriting/Editing


    When businesses first develop design projects, they often try to reuse content
    that was originally created to be viewed as a printed piece. This is not the ideal
    situation for the end user, who is accessing the content on a screen instead of
    paper. In the best-case scenario, a copyeditor is involved to write (or rewrite)
    the content specifically for web readers. Tasks in this category typically include:


    +   - Working with an information architect and/or designer to label the site’s
    content areas

    - Developing the site''s text content

    - Reviewing and editing the site''s text content for web readability


    A copywriter isn’t always in the budget for small design projects, but that doesn’t
    mean these tasks aren’t necessary. On the contrary, if there isn''t an official
    copywriter on the project, it''s up to the remaining team members to pick up the
    slack and ensure the content is edited for web readability. I touch on this more
    in Chapter 2. In the meantime, there are some additional resources to help you
    learn about copyediting for the Web:


    +   - Copy Sells: The Revolutionary Formula for Creating Killer Copy That Grabs
    Their Attention and Compels Them to Buy by Maria Veloso (AMACOM, 2009)

    - Content Strategy for the Web by Kristina Halvorson (New Riders Press, 2009)

    - The Web Write: Writing for and Marketing Your Website by Dan Furman (Self Counsel
    Press, 2009)

    - The Web Developer’s Copywriting Guide (http://articles.sitepoint.com/article/developers-writing-guide)

    - Web Content and Writing for Web Sites (http://websitetips.com/webcontent)

    - Copywriting 101: An Introduction to Effective Copy (http://www.copyblogger.com/copywriting-101)


    # Testing


    The technical term for the process of testing a web project (or just about any
    project for that matter) is quality assurance, or QA for short. Although software
    development companies have whole departments devoted to QA, the tasks in'
  merge: -1
  pgno: 25
