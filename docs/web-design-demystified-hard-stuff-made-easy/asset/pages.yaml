    # # Link Styles


    I mentioned that the color property can be used to change the color of text. But
    what about links? If you apply the color property to a paragraph containing a
    link, you will notice the link does not inherit the color applied to the containing
    paragraph. Instead, if you do not specify otherwise, the links on your pages will
    display according to the browser settings.


    As you might have deduced from the section pseudo-classes, there are special ways
    to style links. The a:link selector allows you to specify the style of the links
    before they are clicked, while a:visited alters the links after they''ve selected.
    The a:hover selector specifies the style of the link when the cursor is positioned
    over them. Finally, a:active states specify how the link should display as it''s
    being clicked.


    The order in which you define these is important. Some people use the LoVe/Hate
    mnemonic device to remember the proper order. Each of the letters stands for one
    of the elements: Link, Visited, Hover, Active. It may help you remember to always
    style your links in the following order:


    ```

    a:link {color: blue; font-weight: bold;}

    a:visited {color: purple}

    a:hover {color: orange; text-decoration: none;}

    a:active {color: green;}

    ```


    As you can see from this example, you don''t have to stop at changing the colors
    of your links. You can format links using any of the other properties discussed.
    In this case, I styled the links as bold before they have been clicked and removed
    the underline for the hover state. But the possibilities are endless.


