- img_proc: true
  md: '# 204 WEB DESIGN DeMYSTiFiEd


    desktop-based version of the site, but if they block the actual content from being
    accessible on smaller screens, your mobile readers will go elsewhere.


    # Special Effects


    Some handheld devices do not support multimedia files, specifically those created
    with Flash. If you''re creating a mobile-specific style sheet, consider hiding
    Flash files and offering other ways of accessing that content.


    In addition, disable any rollovers, pop-up windows, or other scripted features
    that could cause your pages to render incorrectly (or even to not render at all)
    when displayed on mobile devices.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_221_0.png)


    > Refer to www.alistpart.com/articles/pocket and http://perishablepress.com/press2009/08/02/the-5-minute-css-mobile-maker
    for excellent overviews of how to write mobile-specific style sheets.


    # Chapter Summary


    Templates can be amazing time-saving devices in web design, both for the original
    design and the person who ends up maintaining the site. This chapter provided
    a broad overview of how you can use templates to your benefit for almost any web
    project.


    In addition, we covered the use of media-based style sheets to create custom versions
    of a site, specifically for printing and mobile users. Both templates and media-based
    style sheets can significantly increase the usability and maintainability of your
    website.


    In the next chapter, we''ll look at the final pieces of the puzzle as you make
    your webpages live.'
