    2010)

    - Adobe Flash Classroom in a Book by Adobe Creative Team (Adobe Press, 2010)

    - How to Cheat in Adobe Flash: The Art of Design and Animation by Chris Georgenes
    (Focal Press, 2010)

    - Inspiring Flash Design (naldzgraphics.net/inspirations/45-excellent-examples-of-flash-designs)

    - Flash Kit: A Flash developer resource site (http://www.flashkit.com)

    - Smashing Magazine: Flash (http://www.smashingmagazine.com/tag/flash)

    - About.com Flash Web Design (http://www.webdesign.about.com/od/Macromedia_Flash.htm)

    - Tutorialized Photoshop and Flash tutorials (http://www.tutorialized.com)

    - Newgrounds Flash tutorials (http://www.newgrounds.com/collection/flashtutorials.html)'
