- img_proc: true
  md: '# Chapter 6 INTEGRATING HTML AND CSS FOR LAYOUT


    The float property tells the browser to place the floated element nearest whichever
    container edge is (left or right) and then flow the rest of the page''s content
    around it. To say it another, content automatically flows along the right side
    of a left-floated element, and to the left side of a right-floated element.


    > Images are easy to float because they carry defined height and width values.
    If you float a block-level element, it will not work unless you specify a width
    that is smaller than the total width available so there is room to flow the remaining
    content around it.


    For example, if you wanted to place an image in the upper-right corner of several
    paragraphs of text, you could use the float property with a value of right to
    tell the browser to keep the image on the right side of the text. When coding
    floats, make sure your floated content is placed before any other content to wrap
    it in the HTML:


    ```

    img.portrait { float: right; }

    ```


    Sometimes when you float an element, you need to prevent other content from wrapping
    around it. The clear property is used to tell the browser to stop wrapping content
    around a floated object. For example, in the following code sample, the first
    paragraph wraps around a floated image, and the second is forced to begin after
    the floated image ends:


    ```

    <img src="photo.jpg" alt="Team Photo" style="float:right;">

    <p>This paragraph of text will flow the left side of the floated image.</p>

    <p style="clear:right;">There will be blank space in the two paragraphs. The clear
    property causes this paragraph to be placed after the floated image, not around
    it.</p>

    ```


    Possible values for the clear property are left (to clear items floated left),
    right (to clear items floated right), both (to clear all floated items), or none.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_162_0.png)'
  merge: -1
