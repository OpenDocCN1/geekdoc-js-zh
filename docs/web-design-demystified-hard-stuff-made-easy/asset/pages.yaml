- img_proc: true
  md: '# Exporting HTML


    Both Photoshop and Fireworks will also write the HTML code to display your slices
    to the layout you designed. Before you get too excited, this doesn''t mean you''re
    off the hook about learning HTML! If you plan to use a graphics program to write
    your code, it''s still important for you to understand HTML. The reason is that
    these programs write code according to some pretty rules contained within them.
    If your layout doesn''t fit into those rules, you will likely end up with buggy,
    inefficient code.


    That doesn''t mean you should never use code written by graphics programs either.
    Instead, I often suggest that beginners use this code to get started. I encourage
    you to see how the program wrote its code and determine what is working and what
    isn''t. Don''t feel bound to the outputted code, but consider one possible way
    to code your design.


    +   PROBLEM 3-1

    Wait! I don''t really understand HTML! How am I supposed to code the pages when
    I''m still learning the code?


    +   SOLUTION

    Don''t worry—this is a common struggle for new web designers. But that''s why
    you''re reading this book, right? As I mentioned, it''s okay to let the graphics
    editor write your code for you while you''re learning, as long as you dig into
    this and use it as a learning tool. Challenge yourself to move the navigation
    from the left side to the right, for example, after the code has been written
    for you. Be sure to save a copy of the original code, then go through the process
    of editing the code, saving it, and checking the results. You will make a lot
    of mistakes, but we all do. It''s the process of fixing those mistakes that helps
    you learn and understand how HTML does what it does.


    # From Photoshop


    When you allow a graphics editor to create the necessary code for a design to
    display in a browser, you must specify the type of slice for every square pixel
    on the page. Because much of your page will likely be browser-generated text,
    you''ll have to specify some of those areas as "No Image" slices.'
