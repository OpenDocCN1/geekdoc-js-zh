  md: '# Planning a Site


    When you begin any web development project, it''s important to spend some time
    planning. Although this section of the book is quite small in comparison to the
    part devoted to the layout and style of the site, the planning part of the project
    is nevertheless significant. In fact, I would go so far as to say it is one of
    the most important aspects of the project.


    To get started, let''s take a look at where planning fits into the lifecycle of
    a typical web project, as shown in this illustration.


    Your first task should be to identify the goals of the project. Why are you creating
    this website? If you''re working in a professional capacity, you might have received
    a formal Request for Proposal (RFP) from a client. An RFP is a company''s way
    of stating its needs to a variety of potential bidders, who then respond with
    a written proposal specifying how they intend to meet the client''s project needs.


    If you''re not responding to an RFP, you still need to know some basic information
    about your project, including:


    +   - Description and objectives of the website (What will the site do?)

    - Explanation of the hosting environment (Where will the site live?)

    - Required content, components, and functionalities (How will the site work?)

    - Description of the target audience (Who will the site serve?)

    - Proposed timeline (When will the site go live?)


    Even though you may be developing the site for a family member or a friend, you
    still need to get everything down on paper to ensure a smooth development process.
    In addition to the list you just read, here are a few things you might want to
    remember while trying to assess the project''s needs.


    +   - Get to know the company profile and background. What are its strengths and
    weaknesses? Who are its competitors, and where do they stand in regard to comparable
    products?


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_35_0.png)'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Chapter 1 GETTING STARTED


    +   * Get to know the contact person. What is her experience level with the Web
    and similar projects? What comparable sites does she like and dislike?

    * Get to know the company’s brand. Is there an existing logo, or do you need to
    create one? Can the visual design be an extension of the current ‘look and feel,’
    or must it be a complete redesign?


    After considering this information, you’ll likely be in a better position to identify
    the goals of the site. A few examples of site goals might be:


    +   * Sell products/services

    * Increase public awareness of a company/product/service

    * Acquire employees

    * Educate

    * Communicate with customers

    * Disseminate information

    * Provide updates to products/services


    Now let’s look more closely at the where, who, and how of planning the project.


    # Hosting


    The hosting of the site answers the where question posed previously. Before you
    can build any site, you must know where it will be stored on the Web. During development,
    the site may be hosted on your own personal computer, but it can’t stay there
    the site goes live. All public websites must be transferred or uploaded to a host
    computer with 24-hour access to the Internet. Businesses pay monthly fees to companies
    who host (or store) webpages so they can have 24/7 availability to web surfers.


    A variety of web hosting options exist, from free, personal site hosting to business,
    business site hosting.


    # Personal Site Hosting


    If you have an e-mail account with Google (Gmail), you’re halfway to setting up
    your own personal site hosting. Google offers free webpages to its users, specifically
    targeting those who want to create sites for clubs, families, and other social
    groups. This type of situation is perfect if you aren’t concerned'
  merge: -1
  pgno: 36
