  md: '# Chapter 2 DESIGNING FOR SCREENS


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_56_0.png)


    # Fonts


    Another consideration is that fonts are typically device-dependent. So, while
    Arial might a default sans-serif font for Windows computers, Helvetica is more
    popular on Macs. If you select a font that is not available on your user''s system,
    what happens? That depends on how the font is specified.


    If you use a font that ultimately be included inside of an image (such as a file
    saved as a JPG or GIF), you don''t have to worry about the font selected. Because
    that''s the text ends up being saved as a picture and loaded into the webpage.
    But if you want to use a particular font for text that will be rendered by the
    browser, you must be careful which fonts are selected.


    The reason is that text generated by the browser can only be displayed using fonts
    loaded on the user''s system. So if you specify that a section of text display
    using Gill Sans, but some users dont have, the text will not display as you expect.
    In your HTML or CSS, you can actually specify a cascade of fonts, which is a list
    of fonts you''d like to use for the text, in order of preference. We''ll cover
    that in more detail in Chapter 5. For now, you just need to be aware of which
    you''re selecting while designing. Table 2-2 lists the most popular fonts already
    loaded on the typical user''s system.


    Not only are the face themselves an issue, the size at which they display is also
    a variable. Text displayed on a Macintosh system typically appears smaller than
    its counterpart on a Windows-based PC. Many of the browsers'' latest versions
    do help combat this problem by offering Mac users the option of displaying'
  merge: -1
