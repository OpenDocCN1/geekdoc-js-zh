- img_proc: true
  md: '# Chapter 2 DESIGNING FOR SCREENS


    So what creates contrast? Here are a few ideas:


    +   - Change the hue Place a red box next to a yellow one, and you''ve achieved
    contrast because of the difference in hues.


    +   - Change the value White text on a black background causes a distinct contrast
    because of the variation in value (shade) of the colors.


    +   - Change the pattern Striped background next to a solid color-ground creates
    contrast because of the divergent patterns.


    +   - Change the movement Good design moves your eyes around a page according
    to what''s most important. Contrast in movement occurs when you design with the
    intention of gently moving the user''s eye down the page, perhaps with a gradation
    of color, and then abrupt them with a different shape, filled with a different
    color.


    Contrast can be good when it succeeds in helping you focus the user''s attention;
    but it can also be bad. Contrast typically happens when the designer loses focus
    on what''s important—that is, creating a readable site that fulfills its goals.


    While you''re thinking about the contrast of your designs, don''t forget about
    the text color—both foreground and background. Yes, even I choose colored background
    from time to time, but the truth is that white is usually the best color for backgrounds
    big chunks of text. Let''s fact: it''s easier to read dark text on a light/white
    background than the opposite. White text on dark/black backgrounds can be beautifully
    moving, but is not typically appropriate for large areas of text (i.e., anything
    more than a few sentences of).


    TIP When it comes to smaller bits of text, such as in navigation or headlines,
    it can be beneficial to use dark backgrounds to add contrast and draw attention.


    Contrast is of particular interest to anyone who is colorblind. A few online tools
    can help you visualize what people are colorblind see when viewing certain colors.
    Check www.newmanservices.com/colorblind/default.asp to see one example. Or you
    can use a desktop-based tool to help you analyze the contrast of your designs:
    www.stainlessvision.com/projects/colour-contrast-visualiser and www.vischeck.com/vischeckURL.php
    are all good options.


    If you''re using a graphics editor such as Photoshop to build your design, one
    method of quickly checking the contrast of a design is to switch temporarily to
    grayscale mode. Viewing views in grayscale can help identify problem areas. Another
    low-tech method of spot-checking color contrast is to'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'squint your eyes while looking at the design. Areas with little contrast tend
    to blur when viewed with squinted eyes. While this may be okay for color meant
    only as a background texture, it''s not appropriate for body copy or headlines.


    # Color Tools


    If you need some inspiration to create harmonious color schemes, you''ll find
    a lot of online tools to help. Consider one of the following to get you started:


    +   - http://www.colorschemedesigner.com

    - http://www.colourlovers.com

    - http://www.kuler.adobe.com


    # Navigation


    Obviously, navigation is a big part of any screen design. Print designers don''t
    have to worry about making buttons available to access additional information
    (although it could be argued that a link to a company''s website and other contact
    information might be considered the "navigation" of a print advertisement, but
    I digress...).


    The navigation of a site includes all the links to related content. The first
    thing you need to do is identify all the links your pages need to include, starting
    with the home page. Not every page on a site needs to be accessible from the home
    page, so you must figure out which ones should be included, and then of those,
    which are the most important. You can usually divide the links into level of navigation:
    primary, secondary, tertiary, or supporting.


    | Primary Navigation |

    | Secondary | Main Content |

    | Supporting Navigation |


    Primary navigation is typically included on every page of the site. These are
    the most important links that must be accessible everywhere. In many cases, these
    are the navigation bars found around the top of webpages.


    Secondary navigation commonly houses the department-level navigation that is included
    only in certain sections of the site. If you had your primary navigation across
    the top of the page, as shown in this illustration, you might include the secondary
    navigation down the left side.'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'Then, the tertiary or other supporting navigation might include miscellaneous
    pages that don''t clearly fit into the department-level or primary navigation.
    Commonly included in this type of navigation are pages like Privacy Policy and
    Terms of Use. Many designers also include text links to key sections of the site
    for easy access.


    Complex sites often include many levels of navigation on the same page. The trick
    is getting them all to work together to offer plenty of options without being
    overwhelming. Let''s take a look at a large, complex site to see exactly how this
    might be accomplished. Visit amazon.com, then review Figure 2-5 to how we''ve
    labeled the different types of navigation to make them easier to discuss.


    +   Block A to all the departments on the site. This is the hierarchical block
    that links to the site''s structure, this site is primarily organized by department.
    For this website, the hierarchical navigation block acts as the primary method
    of navigation.(Refer back to Chapter 1 for explanations on the different ways
    you can organize.)


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_64_0.png)'
  merge: -1
  pgno: 64
- img_proc: true
  md: '+   Block B is what I call the dynamic navigation block, because the resulting
    pages (search results, cart contents, and so on) are different for each visitor.
    On Amazon.com, dynamic navigation is a secondary navigation method.


    +   Block C is commonly referred to as local navigation, in that those links are
    local to the particular section currently being browsed (in this case, the Kindle
    Store). Note that these links will not appear when another section of the site
    is being viewed. This e-commerce site depends on its local navigation as an important
    tertiary method of navigation.


    +   Block D shows shortcut navigation, which offers one-click access to essential
    functions of the site. For Amazon, the Buy Now button is the most important link
    alike. Shortcut links are typically included in a variety of places on the site
    and don''t live in one department or section.


    +   Block E, reference or related navigation, is a different type of navigation
    that is custom to each page, as related content is pulled from a database behind
    the scenes. For the Amazon page, that''s a display of items other customers also
    bought after purchasing the book currently viewed.


    **TIP Another commonly used navigation method is breadcrumb navigation. Sites
    with deep local navigation use "breadcrumb trails" to help orient users and provide
    easy access to pages along their path in the site.


    The Amazon site is certainly filled with plenty of options for the user. Most
    likely, your first few websites will be much less complex in nature. So let''s
    look at the navigation for a sample small business, which is at the opposite end
    of the spectrum in navigation. Visit www.landscape.us and refer to Figure 2-6
    to see a page on this site with a very basic methods of navigation.


    After you identify the levels of navigation, you need to figure out how to visually
    represent each bucket of links. Things such as underlined text and tabs work well
    because everyone understands these can click for more content. If you spend any
    amount of time on the Web, you''ll probably see a lot of the same types of visual
    navigation metaphors, such as:


    +   - Tabs


    +   - Vertical navigation bars docked to the left side of the screen, with each
    link on a separate line


    +   - Horizontal navigation bars docked to the top of the screen, with links separated
    by characters such as the pipe (|), dash (–), bullet (•), and for ward slash (/)'
