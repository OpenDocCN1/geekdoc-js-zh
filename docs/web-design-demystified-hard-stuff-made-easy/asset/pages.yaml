  md: '# WEB DESIGN DeMYSTiFEd


    You can use those RGB color values to define color like this:


    ```

    <p style="color: rgb(0,0,0);">

    ```


    Or, you could use the RGB percentages, like this:


    ```

    <p style="color: rgb(0%, 0%, 0%);">

    ```


    Notice that a comma separates each RGB value and the entire set of values is placed
    inside parentheses. A lowercase rgb precedes those parentheses.


    # Color Names


    You can also specify a color name with the color property:


    ```

    <p style="color: black;">

    ```


    HTML 3.2 and 4.0 define a standard set of 16 colors, which could be referenced
    by names. The first version of CSS continued with those 16 colors, and orange
    was added in CSS 2.1. CSS3 finally gives us a larger set of acceptable colors.
    Refer to this online reference to get an updated list of supported color names:
    www.w3schools.com/css/css_colornames.asp


    > TIP Wondering which method to use when defining color? Any of them! You can
    tailor your color presentation method to your particular site, using whichever
    method makes the most sense to you.


    # Transparent Colors


    The CSS3 specification defines a new way to specify color so to make certain areas
    partially transparent. Using RGBA, you can adjust the alpha value (transparency)
    of a color, using a value between 0.0 (completely transparent) and 1.0 (fully
    opaque). For example, you might use the following code to tell the browser to
    display a headline at 50 percent of its defined color:


    ```

    h1 {color: rgba(255,50,125,0.5); }

    ```


    As of this writing, the latest version of Safari, Firefox, and Chrome all support
    RGBA color specification. In addition, the Internet Explorer 9 preview supports
    for this powerful feature. Be cautious in going crazy with RGBA until it is fully
    supported by the majority of browsers in your target audience. In the meantime,
    visit www.css-tricks.com/rgba-browser-support for tips and guidance on using RGBA.'
