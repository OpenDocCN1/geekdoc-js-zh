  md: '# Links


    Links are a huge part of any webpage. Without any links, a webpage is really just
    a dead end. Because they are so integral to webpages, links are typically sprinkled
    throughout the different content blocks of the page. Remember that links are inline
    elements (as opposed to block-level), and can be placed anywhere within the body
    section of the code.


    In HTML, a link has two ends (also called anchors) and a direction between them.
    One end—the source—is where it starts, and the other—the destination—is the content
    being linked. The tag most frequently used to create links is the element (short
    for anchor). Here''s an example of what a link to CNN.com might look like that:


    ```

    <a href="http://www.cnn.com" title="Click to visit CNN.com">CNN</a>

    ```


    In this code example, the anchor tag tells the browser the content between the
    opening and closing tags is some sort of link. The href attribute, for hypertext
    reference, tells the browser the direction, or destination, of the content.


    The title attribute provides a brief description of the link. Some browsers display
    this description as a tool tip when the user''s mouse hovers over the link, so
    it''s a good idea to include it when you can.


    Here are a few more attributes commonly used when creating links:


    +   * accesskey Used to assign a keyboard shortcut to the link

    * tabindex Used to customize the tab order of the link

    * target Used to specify the browser window in which a link should display


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_114_0.png)


    Visit www.w3schools.com/TAGS/tag_a.asp and www.w3.org/TR/WD-htmlink-970328 for
    additional details regarding the anchor tag.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Relative vs. Absolute Links


    When linking to other content, it''s very important to properly format the hypertext
    reference. For example, to link to CNN''s website, you must include the entire
    address, beginning with the http// (which is called the protocol). This is called
    an absolute link because it leaves no doubt as to where the linked content is
    located.


    By contrast, a relative link uses a path relative to the current page. This means
    the actual path to reach the file may vary depending on where you are in the file
    structure. Relative links are most commonly used when you want to link from one
    page to another within a single website. Here''s an example linking from a file
    called quote.html to another named benefits:


    ```

    <a href="../careers/humanresources/benefits.html">Benefits</a>

    ```


    In this example, the ../ at the beginning of the hypertext reference tells the
    browser to go up one level within the file structure from the current location.
    Then, the benefits.html file will be found in the humanresources folder within
    the careers folder at that level.


    Then, if you wanted to link from the benefits.html page back to the quote.html
    page, the link might look like this:


    ```

    <a href="../contact/quote.html">Request a Quote</a>

    ```


    The following illustration helps clarify the relationship between the two files.


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_115_0.png)'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Chapter 4 ALL ABOUT THE HTML


    **TIP** Most servers are also set up to recognize a single slash as a direct link
    back to the root directory of the server. So <a href="index.html">links back to
    the main index page regardless of where you''re linking from is located. This
    type of link is called a root-relative path.


    # Interior Links


    What when you want to link to a section of content within a webpage, as opposed
    to the entire page? In this case, you must first define the destination by using
    the name attribute:


    ```

    <h2 name="contact-form">Contact</h2>

    ```


    You can either add the name attribute to an existing tag—as I did in the previous
    example—or you can use the element to create the anchor anywhere on the page:


    ```

    <a name="section1"></a>

    ```


    When it comes to link to the section of the page, you need only to add the destination
    name (prefixed by a pound sign) to the end of the hypertext reference, like this:


    ```

    <a href="/company.html#contact-form">Contact Us</a>

    ```


    # Other Links


    It''s important to note you can also use the element to add links to e-mail addresses
    and multimedia files and a variety of other types of content. In each case, you
    need to follow the same basic structure:


    ```

    <a href="destination">

    ```


    So as already shown, an absolute link to another website would look like:


    ```

    <a href="http://www.foxnews.com">

    ```


    A link to an e-mail link would look similar, just with a different destination
    prefixed by the mailto protocol:


    ```

    <a href="mailto:email@emailaddress.com">

    ```


    Alternatively, a link to execute a bit of JavaScript code (which I explain more
    in Chapter 7) when clicked would be prefixed by the javascript protocol:


    ```

    <a href="javascript:window.open(''http://example.com'', ''Window Title'',''width=350.height=550'')">

    ```'
