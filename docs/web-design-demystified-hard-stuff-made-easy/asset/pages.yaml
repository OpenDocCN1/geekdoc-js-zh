- img_proc: true
  md: '# WEB DESIGN DeMYSTIFieD


    When designing for multiple browsers, here are a few things to keep in mind:


    +   - Provide alternatives Some web browsers on mobile devices are text-only.
    That means anyone using these browsers won''t see the graphics in your webpages.
    Therefore, if any critical information on the site is included in graphics, you
    must make alternative text-only options available.

    - Use standard code As you become more familiar with HTML, you''ll learn that
    some elements are handled better by certain browsers, and some tags are completely
    ignored by other browsers. Try to stick with standard HTML as specified by the
    World Wide Web Consortium (W3C—www.w3.org), and you''ll be more likely to reach
    the widest audience.

    - Test, test, and test some more Don''t assume your page looks good in Firefox
    just because it works in IE. Confirm it.


    > NOTE Chapter 9 talks more about testing sites in different browsers and various
    devices.


    # Bandwidth


    Another aspect of web design that is unique is bandwidth. When designing an advertisement
    for a magazine, you don''t have to consider how many kilobytes the file is. (That''s
    a good thing that most ads end up being megabytes in file size!) Unfortunately,
    website visitors are definitely concerned with the size of your files.


    The term bandwidth refers to the speed at which web users access the Internet.
    Users who log on to the Internet from computers using telephone modems (yes, many
    people still do) often access at speeds of 28.8 to 56 Kbps (kilobits per second),
    while cable and DSL (digital subscriber line) users'' speeds increase significantly
    to an average of 2 to 3 Mbps (megabits per second) or 2000 to 3000 Kbps. Anyone
    using FiOS can see speeds double of that. And Mobile users'' bandwidth can run
    the entire gamut: Stationary users can see speeds similar to cable and DSL users,
    while those in a moving vehicle only receive about 350/Kbps.


    With such a varied selection, you must design your graphics accordingly. The larger
    the size of your graphic files, the longer they''ll take to'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'download onto a user''s screen. Sit in front of your web browser and slowly
    count to ten. Are you willing to wait for a webpage to download? Many people wait
    less than ten seconds before giving up and moving on. Therefore, you have precious
    little time to grab someone''s attention and invite him to stay longer.


    To estimate the size of a webpage, you must add the sizes of the text (the HTML
    and CSS files) and the images (the GIFs and JPEGs). Using Table 2-3, a page totaling
    500K in content might take five seconds to download over a 3G network in a moving
    vehicle, but less than a second if the same user was stationary or accessing the
    page from a desktop computer connected through FiOS.


    If you''re creating webpages for the general public, a good rule of thumb is to
    limit your main content pages around 200K in size. HTML and CSS files typically
    weigh in around 1 to 3K, so that leaves the vast majority of the other content
    such as graphics. This guideline can often restrict you to the most important
    and necessary graphics on a page. There will always be exceptions to this, particularly
    for pages with a designer''s portfolio or a video archive.


    # Color


    Right from the start, screen-based color is unlike print-based color because they
    use two unique color palettes. All color used in screen-based designs is created
    with the RGB (red, green, blue) color palette, as opposed to the print-standard
    CMYK (cyan, magenta, yellow, black) palette. In addition, while graphics created
    for the printed page look the same to all who view them, web graphics may look
    vastly different from one to the next. This variation


    | TABLE 2-3 Average Download Speeds for Popular Connection Types |

    | Connection Type | Average Download per Second |

    | T1/T3 network | 1000 to 40,000 Kbit+ |

    | FiOS | 5000 to 30,000 Kbit |

    | Cable/DSL/3G (stationary) | 2000 to 5000 Kbit |

    | 3G (moving) | 100 to 350 Kbit |

    | Modem/dial-up | 6 to 7 Kbit |'
