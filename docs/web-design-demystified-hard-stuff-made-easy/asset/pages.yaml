    Users who click this link will be prompted to either download the file or view

    it now (whichever application is set up to handle the file type).

    Alternately, you can cause the file to display directly within the context of

    your page. As long as the appropriate plug-in is installed on the user''s computer,

    the file loads and plays along with anything else that might appear on that page.

    HTML''s object element is perfect for embedding all sorts of multimedia, from

    Flash files to YouTube videos. Thankfully, YouTube (and other similar sites)\provide
    lots of help for anyone trying to embed their files on other pages.


    If you visit youtube.com and locate the video you''d like to embed,

    y''ll find the necessary code for both linking and embedding the file. Here''s

    some provided by YouTube, which we can use to better understand the

    object tag:


    ```

    <object width="480" height="385">

    <param name="movie" value="http://www.youtube.com/v/PK-s2ek_5Cc6&hl=en_US&fs=1&rel=0"></param>

    <param name="allowFullFullScreen" value="true"></param>

    <param name="allowfullscreenaccess" value="always"></param>

    <embed src="http://www.youtube.com/v/PK-s2ek_5Cc6&hl=en_US&fs=1&rel=0"

    type="application/x-shockwave-flash" allowfullscreenaccess="always"

    allowfullscreen="true" width="480" height="385"></embed>

    </object>

    ```


    In this example, the object tag has only the width and height

    attributes, used to embed the media file.

    Next, param tags (short for parameter) are used to specify the individual file

    characteristics. The most important one—and the only one we really need in

    this case—identifies the location of the YouTube video. The other two are-

    prietary Flash features.


    Before the object element was the preferred method for embedding media

    files, some browsers used the embed element. In an effort to reach the widest
    pos-

    sible audience (which may include users of very old browsers), YouTube includes

    em embed element with the same information as was already provided by the

