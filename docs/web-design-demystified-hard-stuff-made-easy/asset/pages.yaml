    # Set the Visibility


    After you position an element, you may want to alter its visibility. Why? Sometimes
    it can be helpful to hide certain elements from view until they are needed. This
    can help you to create multiple layers of content within a single page and then
    bring the required layer forward as needed. It''s easy to hide and display layers
    with the visibility property, like this:


    ```

    #moreinfo { visibility: hidden; }

    ```


    The possible values for the visibility property are hidden, visible, and collapse.
    By default, the visibility of elements is inherited from parent objects. Also,
    if you hide an element with relative or static positioning, its dimensions continue
    to affect the flow of the document''s content. If you don''t want a hidden box
    to cause content to shift, set its display to none instead of hidden.


    The collapse value only works for table elements, but is quite useful in temporarily
    hiding a row or column without affecting the rest of the table''s layout.'
