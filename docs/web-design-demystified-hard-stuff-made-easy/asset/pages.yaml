    # Form Structure


    After you''ve coded the form, you''ll undoubtedly want to add some structure and
    style. We''ll take care of the styling part in Chapter 5, but there are two more
    HTML elements we need to consider to help structure input controls more efficiently:
    fieldset and legend.


    The fieldset element enables you to group input controls and labels, and the legend
    element allows you to add a caption to fieldset. Without any structure, the input
    controls and labels will simply flow together on the page. This occurs because
    unlike paragraphs and headings, input controls are inline elements that do not
    force line breaks by default.


    Suppose you were creating a form for prospective employees to complete. It might
    contain three sections: personal information, employment history, and education.
    Each section then contains the input controls and labels to gather the necessary
    information:'
  merge: -1
