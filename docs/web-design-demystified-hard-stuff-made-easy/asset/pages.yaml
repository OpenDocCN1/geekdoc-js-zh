  md: '# 172 WEB DESIGN DeMYSTIfieD


    # PHP


    The second scripting language I''d like to introduce you to is PHP, which is sort
    of an all-purpose scripting language well suited for web development. It is open-source,
    which means any developer can customize and deploy it on any web server without
    paying a license fee. Open-source technologies survive and grow because of the
    community of people using them, and PHP is no exception. PHP is likely the most
    widely used web scripting language today.


    PHP runs on many different computer systems (Windows, Unix, Linux, and so on)
    and is compatible with just any web server in use today. The official PHP specification
    is maintained at www.php.net.


    NOTE PHP must be installed on the host system in order for you to use your webpages.
    Not to worry, though—because PHP is free, most companies keep PHP updated on all
    their servers (although many do not offer PHP on Windows servers, because those
    systems use Active Server Page (ASP) instead). Here''s a tutorial that walks you
    through the process of installing PHP, you should find it necessary to do so:
    www.php.net/manual/en/install.php.


    # Terminology and Syntax


    In PHP, the code is surrounded by the PHP tags: <?php ?>. Each line of code within
    the PHP tags usually ends with a semicolon, similar to JavaScript. Unlike JavaScript,
    when an HTML file contains PHP, it usually must be saved with a .php file extension.
    If you include PHP code inside of an .html file, the PHP code might be ignored.
    The required extension varies from server to server, so check with your hosting
    provider for more information. Files saved as .php let the web server execute
    the PHP code within them when the content is sent to the web browser.


    PHP has its own way of declaring variables, just like JavaScript. Variables can
    include text strings, numbers, and many other types of data. In PHP, variables
    are preceded by a dollar sign, like this:


    ```

    $variable_name = value;

    ```


    There are a few guidelines you should consider when naming variables:


    +   * Variable names must begin with a letter or underscore (_).

    * Variable names can only contain letters, numbers, and underscores.

    * Variable names cannot contain any spaces.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Chapter 7 BEYOND HTML AND CSS 173


    If your variable''s value needs to contain spaces, as a line of text might, you
    can use a *string*, whereby the value is enclosed within quotes:


    ```

    $text = "This is my first line of PHP";

    ```


    PHP also uses the basic if... else statement I showed you in the JavaScript section.
    As with most scripting languages, the real meat is found in the functions being
    performed when the page is loaded. PHP has more than 700 built-in functions—plus
    an unlimited number of custom functions—which means there''s a whole lot you can
    do with!


    Even though there are many options, the same basic process is used. First you
    tell the system you''re starting a function, then you give it a name and specify
    the instructions it contains, like this:


    ```

    function functionName() {

    //instructions go;

    }

    ```


    > Prefacing a line of code with // tells the browser this is a comment from the
    author and should be read, not run.


    Notice the syntax of a function is the same in JavaScript and PHP.

    Another important aspect of most scripting languages is the *operator*. These
    characters are used to specify how two different values are compared. There are
    many different types of operators, but the most basic operators are probably quite
    familiar to you already. Take a look at Table 7-1 to see what mean.


    | TABLE 7-1 Basic Scripting Operators |

    | Operator | Description | Example |

    | --- | --- | --- |

    | + | Addition | x+2 |

    | - | Subtraction | x-2 |

    | * | Multiplication | x*2 |

    | / | Division | x/2 |

    | ++ | Increment | x++ |

    | -- | Decrement | x-- |

    | = | Assignment | x=2 |

    | == | Is equal to | x==2 |

    | != | Is not equal to | x!=2 |'
  merge: -1
