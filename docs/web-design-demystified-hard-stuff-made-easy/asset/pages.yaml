    # Chapter Summary


    When it is time to create page mockups for a web development project, you must
    consider how the delivery method affects the design process. In this chapter,
    I outlined several of the ways in which the process is affected. Specifically,
    devices, browsers, bandwidth, color, navigation, and transitions were covered.
    As the designer, you will need to determine how each of these affects your particular
    project and what you can do to ensure the end users receive the content you intend.


    In the next chapter, we move on to breaking apart the mockups into text and image
    files, and then preparing them for storage on the web server.'
