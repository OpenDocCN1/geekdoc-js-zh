- img_proc: true
  md: 'Now you''ve had a chance to become familiar with some of the terminology and
    syntax of PHP, let''s take a look at an example of how it might be used in web
    design.


    # Usage: Process a Form


    A common use of PHP is to process a web form. Three built-in PHP variables are
    perfectly suited for this purpose: $_GET, $_REQUEST, and $_POST. In do not, however,
    provide you with a way to process that form because HTML does not include such
    a method for that, you must use some other language, such as PHP.


    The first thing you need to create is your HTML form and reference the new PHP
    form from the opening tag. What follows is a basic form that asks for the user''s
    name, e-mail address, and comments:


    ```

    <form action="processform.php" method="post">

    <input type="text" name="name" /><br>

    Email: <input type="text" name="email" /><br>

    Comments:<br>

    <textarea name="comments" rows="10" cols="50"></textarea>

    <br>

    <input type="submit" />

    </form>

    ```


    Next, create the processform.php file. The contents of that file are included
    here:


    This bit of code should be the only thing in the page, and there should not be
    any white space or other text after it.


    The value of each variable is the same as the name of the attribute in the HTML
    form.


    ```

    <?php

    $name = $_REQUEST[''name''];

    $email = $_REQUEST[''email''];

    $comments = $_REQUEST[''comments'']; ;

    ```


    This section creates the variables.


    ```

    mail ("recipient@company.com",

    "Contact Form Results",

    "$name said: $comments",

    "From: $email");

    ```


    This section sends the e-mail.


    ```

    header ("Location: http://www.company.com/form_thankyou.html");

    ?>

    ```


    This specifies which page to display after the form is processed.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Chapter 7 BEYOND HTML AND CSS


    PHP has a special function called mail that is able to send e-mail using the data
    sent through the file. In this case, the data being sent is the person''s name,
    e-mail address, and comments (as defined in the original HTML form).


    This PHP file has three distinct sections: one to create the variables, one to
    send the e-mail, and one to identify the next webpage to be displayed. Within
    the section that sends the e-mail, there are four arguments.


    +   * The first one defines the e-mail address to which the message should be
    sent.

    * The second argument identifies the subject line.

    * The third one defines the contents of the e-mail message.

    * The fourth argument specifies the e-mail address to be listed in the From field.


    The final section should list the page to be shown after the form is processed.
    This is a different HTML page from the one that housed the form. It should contain
    text that lets website visitors know the form has been processed. I also like
    to include contact information in case the visitor wants to reach a live person
    before he receives an e-mail response.


    After you become comfortable with this most basic method of form processing (which
    does not include any way to prevent spam), you may want to tackle more complex
    forms, perhaps including form validation (making sure the fields are completed
    correctly) and spam prevention. Check out www.digital-web.com/articles/bulletproof_contact_form_with_php
    for a great PHP processing-resource.


    # Learning More


    If you''d like to learn more about PHP, check out some of the following resources:


    +   * PHP Junkyard This site contains free, downloadable PHP scripts, as well
    as lists of books and tutorials (www.phpjunkyard.com).

    * PHP Freaks This website (www.phpfreaks.com) bills itself as “your number-one
    PHP resource,” mostly because it boasts an online community of more than 90,000
    members. Here''ll find tutorials, free scripts, and tons of folks to help you
    learn and use PHP.

    * PHP Builder This section of Internet.com (www.phpbuilder.com) is specifically
    geared toward web developers using PHP.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# XML


    +   - PHP.net As I mentioned, PHP.net is run by the people who maintain and update
    the language. As such, it is a great resource for all information about PHP.


    +   - Beginning PHP and MySQL by W. J. Gilmore (Apress, 2006)


    +   - Wicked Cool PHP: Real-World Scripts That Solve Difficult Problems by William
    Steinmetz (No Starch Press, 2008)


    XML stands for Extensible Markup Language. It is similar to HTML, in that the
    two languages share the same basic structure and formatting. The key difference
    is that XML holds the data while HTML structures it. Plus, you can create your
    own XML elements, according to the type of data contained.


    XML was developed to move and store data, but not to replace HTML, which was developed
    to display data. This means you can use the two complementary languages together
    to store and display data.


    Let''s look at a few code samples to clarify the difference between the two markup
    languages. First, consider this HTML sample from a calendar of events:


    ```

    <h1>New York Bus Trip/</h1>

    <h2>Saturday, May 8, 9:00am - Sunday, May 9, 8:00pm/</h2>

    <p>Bus departs from Fallston Park and Ride promptly at 9:00am on Saturday. Contact
    Pam Toll for more information.</p>

    ```


    As designers, we can read this code snippet and understand that the level one
    heading contains the event title, the level two heading contains the event date,
    and the paragraph includes event details. But if a database needed to evaluate
    this data? The database might not understand the various HTML elements, or be
    able to associate their content with the data they contain. Here is where XML
    excels. That same calendar of events could be coded with XML to clarify the purpose
    of each bit of data:


    ```

    <calendar>

    <eventTitle>New York Bus Trip</eventTitle>

    <eventDate>Saturday, May 1, 9:00am - Sunday, May 2, 8:00pm</eventDate>

    <eventDetails>Bus departs from Fallston Park and Ride promptly at 9:00am on Saturday.
    Contact Pam Toll for more information.</eventDetails>

    </calendar>

    ```'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'TIP The W3C maintains the XML standards. Visit www.w3.org/standards/xml to
    learn more.


    When I tell you that XML is meant to store data, you might wonder why I''m not
    calling it a database. The reason is traditional databases are tied to specific
    software and/or computer systems, but XML is platform- and software-independent.
    Databases require that software in order to be interpreted properly, whereas XML
    is referred to as "self-describing" because it contains both the data and the
    element and attribute names to describe it. Having said that, many databases allow
    importing of XML data and exporting as XML files.


    # Terminology and Syntax


    XML has elements and attributes, just like HTML. The syntax is pretty much the
    same as in HTML. In HTML, we use the !DOCTYPE statement at the top of all HTML
    files to let the browser know which version of HTML the page follows. Likewise,
    the first line of an XML document includes the XML declaration, like this:


    ```

    <?xml version="1.0"?>

    ```


    NOTE XML is case-sensitive, which means <eventTitle> and <EVENTtitle> are two
    different elements.


    I''ve already mentioned that you create your own XML elements. While this means
    XML is quite powerful, it has the potential to get confusing. To clarify, the
    W3C has set up a few guidelines for developers. A well-formed XML document must
    follow each of the following rules:


    +   - The document must have a single root element that contains all other elements.


    +   - All elements must be properly nested.


    +   - All elements must be closed.


    +   - All attributes must be included in the opening tags with values enclosed
    between quotes.'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'In addition, here are a few more guidelines to keep in mind when naming elements:


    +   - Names cannot begin with any of the following: numbers, punctuation, or "xml."


    +   - Aside from the first letter, the rest of the name can include any letter
    or number.


    +   - Names must not contain any spaces.


    So if we return to our calendar of events, here''s what a more complete example
    might look like:


    ```

    <?xml version="1.0"?>

    <calendar>

    <event id="0501">

    <title>New York Trip</title>

    <eventDate>Saturday, May 1, 9:00am - Sunday, May 2, 8:00pm</eventDate>

    <orderDetails>Bus departs from Fallstone Park and Ride promptly at 9:00am on Saturday.
    Contact Pam Trell for more information.</orderDetails>

    </event>

    <event id="0508">

    <title>Mother''s Day Tea</title>

    <eventDate>Saturday, May 8, 2:00pm - 4:00pm</eventDate>

    <orderDetails>Tea is open to all moms and those who love them. Lois Burt for more
    information.</orderDetails>

    </event>

    </calendar>

    ```


    After your data is organized with XML, you can use other coding methods to display
    it. An XSL (Extensible Stylesheet Language) document contains the presentation
    instructions for an XML document, in much the same way a CSS file specifies how
    to style HTML content.


    > Still Struggling

    Check out the XML tutorial on W3 Schools: www.w3schools.com/xml.'
  merge: -1
