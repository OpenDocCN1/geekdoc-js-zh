  md: '```

    <meta name="keywords" content="sports bar, pub, English, concert, band, music,
    live entertainment, football, Baltimore Ravens, restaurant, family dining, take-out,
    delivery" />

    </head>

    ```


    Customize the content of these tags to identify a description that properly explains
    the purpose of your site in a sentence or two (20 to 50 words is a good place
    to start) and key words that parallel users might search for. Because most users
    search for words in lowercase, you can avoid capital letters in your key words.
    The number of key words you use varies somewhat according to the search engine;
    make sure your most important key words are listed first because some limit the
    contents of your key words to about 900 characters.


    One additional note about meta elements: I''ve listed these last as a way to identify
    their importance when it comes to search engine optimization. While it''s true
    these specific meta elements can transfer the description and key words to search
    engines, the other places I listed previously greater importance among modern
    search engines. It''s still good to include relevant meta data, but you shouldn''t
    rely on it as the only way to get the information to search engines. (Remember
    that the content of meta elements isn''t displayed on your pages, but is only
    visible to search engines and browsers.)


    # Still Struggling


    Visit Search Engine Watch (www.searchenginwatch.com) for more tips on using meta
    elements.


    # Search Engines Favor the Popular Crowd


    In junior high, I was not a fan of popularity contests, but when it comes to search
    engines it is a different story. Search engines like Google consider how many
    related sites link to a particular page and increase the rankings of those pages.
    It determines which pages are popular by evaluating the incoming links and user
    input.


    Complementary website links to yours, Google considers that to be an indication
    of your site''s value or worth. Similarly, those pages that other searches have
    "promoted" rise to the top of the search results faster than those not promoted.
    Users can click the "promote" button next to a link in Google''s search results
    to let Google know this particular page is relevant to the search terms.'
