    # Sharing Copies of Your Mockups


    If you’re creating a website for someone else, you undoubtedly have to show them
    your design mockups at some point. There are plenty of ways to accomplish this,
    but you want to make sure you have a way of managing the mockups in case the site
    owner wants to refer back to a previous version later in the project. As a freelancer,
    I typically use one of two methods to manage this process:


    +   * Create a mini-site on my personal site Sometimes I create a page on my website
    where I store and track design mockups. Figure 2-8 shows an example of how I handled
    this for one client. The client could click the links to display each mockup within
    the browser to see how the final page will look surrounded by the browser chrome.


    +   * Use an online document storage location Other times (depending on the nature
    of the project), I simply create a folder for the client files on my online document
    storage site. Use Drop Box (www.dropbox.com), but you can use whichever online
    storage site you’re comfortable with. I love Drop Box because as soon as I add
    a file to a shared folder, it alerts the other users of that folder to the presence
    of the new or updated file. (And hey, it doesn’t hurt that the first 2GB of storage
    space is free. Plus, if you sign up using this referral link, we both get 250
    MB of extra space, free: www.dropbox.com/referrals/NTMODE5OTE5.)'
