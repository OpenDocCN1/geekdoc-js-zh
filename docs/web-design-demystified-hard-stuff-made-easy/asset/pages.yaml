  md: '# chapter 7


    # # Beyond HTML and CSS


    Just about any website today uses some type of technology beyond HTML and CSS.
    Frankly, you don’t have to be a skilled programmer to achieve a basic understanding
    of technologies like JavaScript, Hypertext Preprocessor (PHP), Extensible Markup
    Language (XML), and Really Simple Syndication (RSS). I''ve included an introductory-level
    primer on each of these tools here in the hopes it will inspire you to try your
    hand at each one. Perhaps you''ll find a particular technology you''d like to
    focus on as you expand your skills.


    # CHAPTER OBJECTIVES


    In this chapter, you will


    +   - Understand how JavaScript is used to add interactivity to webpages

    - Understand how PHP is used to extend the capabilities of HTML

    - Understand how XML is used to move and store data


    ![](img/e9cc309d049aca128e9afd3cd8693fe3_182_0.png)'
