    # Stock Media


    The use of photography and multimedia can often add a sense of professionalism
    to a website, but many businesses do not have the budget to hire photographers
    or artists. Frankly, plenty of stock companies offer royalty-free media that can
    be used for almost any purpose, except for resale.


    **TIP** Royalty-free does not mean the item is free. But it does mean you (the
    purchaser) are permitted to use the item multiple times without having to pay
    an additional fee beyond the original purchase price. Read the license to determine
    for types of projects you can use a particular item.


    Figure 2-7 - Photoshop lets you organize layers into groups.'
