    # Basic Alignment


    In Chapters 4 and 5, I discussed adding images, links, text, and all sorts of
    HTML elements. But as of yet we haven''t really covered how to move them around
    the page. That''s because the movement is all achieved with a few powerful CSS
    properties. The most basic of these are two properties used to align text: text-align
    and vertical-align.


    +   - The text-align property defines the horizontal alignment of text and block-level
    elements. Possible values include left, right, center, and justify. The default
    value is left for most elements.

    - The vertical-align property specifies the vertical alignment of text and inline-level
    elements (including text within table cells). Possible values include baseline,
    sub, super, top, text-top, middle, and text-bottom. The default value is baseline.


    Both affect the text is aligned relative to the container object. If I wanted
    to justify all the paragraphs on my page, I could simply add the text-align property
    to my style sheet like this:


    ```

    p { text-align: justify; }

    ```


    # Floats


    Beyond the basic text alignments possible with the text-align and vertical-align
    properties, the float property allows you to “float” an element to the left or
    right edge of the container object. When an element is floated, it remains stationary
    while the rest of the content flows freely around the page.'
  merge: -1
