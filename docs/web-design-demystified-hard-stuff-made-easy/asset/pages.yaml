    \ three document type definitions (or DTDs for short):\n\n+   - **Strict** Includes\
    \ only tags available in the current specification, and none of those that have\
    \ been [deprecated](https://www.example.com) (retired)\n- **Transitional** Includes\
    \ everything in the strict DTD, as well as some older tags\n- **Frameset** Includes\
    \ everything in the transitional DTD, plus older tags used to create frames\n\n\
    The actual code used to tell the browser which DTD is being used tends to get\
    \ quite long (as you may noted by the first two lines in my previous example).\
    \ Most people copy and paste the code from another source online to avoid any\
    \ types. Check out www://www.w3schools.com/tag/doctype.asp for a complete list\
    \ (including copyable code references) for each of these DTDs.\n\n# Header Content\n\
    \nAs I mentioned, the header of the document contains information about the document,\
    \ as opposed to actual page content. The header section is created by an opening\
    \ and closing header tag. The other elements typically included in the header\
    \ are:\n\n+   - <title>\n- <meta>\n- <base>"
