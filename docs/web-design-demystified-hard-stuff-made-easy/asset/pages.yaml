  md: '+   Using deprecated (or phased-out) code If you have been around the HTML
    scene for a few years, you have picked up a few bad habits along the way. One
    of those could include using the align attribute, for example, to quickly align
    an image within a paragraph of text. While this use of the align attribute used
    to be acceptable, it will cause errors if you use it on a page validated against
    the Strict XHTML validation. Instead, you have two options. You could change your
    DOctype to transitional (which will allow for other attributes like align), or
    use the CSS properties float or text-align to properly align text and images on
    the page.


    +   Missing alt attributes always need alternative text specified to help nonvisual
    browsers and search engines understand the content of the image. If you do not
    specify this text using the alt attribute in your tag, your page will not validate.


    +   Incorrectly nested tags When discussing proper HTML structure, I mentioned
    a structure used to code multiple tags in a row. For example, if you want to apply
    two sets of tags to the same bit of content, you need to open and close them like
    so that the first to be opened is the last to be closed: `<p><strong>Red</strong></p>`


    +   Random machine characters If you copy and paste code from Microsoft Word or
    another program, you frequently bring along extraneous characters and Microsoft
    markup that are not important to the HTML. In fact, those machine characters may
    not be visible to you, but they may break your code. If you suspect this might
    be the problem, try removing the copied text and retyping without using copy and
    paste.


    After you''ve identified the errors, fix them one at a time, validating the page
    again each attempt. It can be a daunting process to troubleshoot your code, as
    you go line-by-line looking for problems. Take breaks, and don''t afraid to ask
    a friend or colleague to give it a try. A fresh set of eyes can quickly scout
    out problem areas that tired eyes can''t see.


