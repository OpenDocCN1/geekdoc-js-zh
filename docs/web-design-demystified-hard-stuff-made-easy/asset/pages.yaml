  md: "# Usage: Exchange Data with RSS\n\nThe primary use of XML today is in the exchange\
    \ of data between sources. In fact, a ton of information is exchanged every day\
    \ through the use of RSS feeds. RSS (Really Simple Syndication) has grown so quickly\
    \ in recent years that you might not have known what it means, you've likely seen\
    \ it referenced at one website or another.\n\nMany news sites and web blogs include\
    \ little orange or blue rectangular buttons that tell a story is available for\
    \ syndication by the general public. For example, visit www.foxnews.com/rss to\
    \ see a list of the Fox News content available for syndication. Another example\
    \ comes from Netflix, which provides everything with a feed, from new DVD releases\
    \ to personalized feeds of your movie queue: www.netflix.com/RSSFeeds.\n\nHere's\
    \ an example that shows the structure of an XML document used to hold an RSS feed:\n\
    \n```\n<xml version=\"1.0\"?>\n<rss version=\"1.0\">\n<channel>\n  <title>WendyWillard</title>\n\
    \  <link>http://www.wendyllard.com</link>\n  <description>a healthy mix of creativity\
    \ and code</description>\n  <language>en-us</language>\n  <item>\n    <title>Adding\
    \ Third-Party Content</title>\n    <link>http://www.wendyllard.com/blog/2010/04/20/adding-third-party-content</link>\n\
    \    <description>When you create websites, you often need to integrate content\
    \ from other sources. Suppose you wanted to load the current weather forecast\
    \ into a page on your site...</description>\n  </item>\n  <item>\n    <title>Web\
    \ Design Links</title>\n    <link>http://www.wendyllard.com/blog/2010/04/20/web-design-links/</link>\n\
    \    <description>Here's an ever-growing compilation of links from web design\
    \ books that are useful to web designers.</description>\n  </item>\n</channel>\n\
    </rss>\n```\n\nAs you can see, a feed includes a channel element, which has title,\
    \ link, description, and language (optional) elements, followed by one or more\
    \ item elements, each of which has its own title, link, and description elements.\
    \ This is saved as an .xml or .rss file and stored on your web server."
  merge: -1
  pgno: 196
- img_proc: true
  md: 'The next step to creating an RSS feed is to validate it using Feed Validator
    (www.feedvalidator.org). If a problem is found, the tool will let you know so
    it can be corrected.


    **TIP To “read” such syndicated content, you need to open the RSS feed in a news
    reader (also called an aggregator). Check out http://blogspace.com/rss/readers
    for a list of some popular readers.


    The final step is to add the feed to your page. There are two places you can link
    the feed. First, you can provide a clickable link within the body of your page,
    where users can click to access the feed:


    ```

    <a href="feed.rss">RSS Feed</</a>

    ```


    In addition, you can add the reference to the header content of your page. When
    you do so, you''re telling the browser where to find the RSS feed for the page,
    even if there is no clickable link. That way, if a user attempts to view the feed
    through any RSS reader, the correct content will be shown.


    ```

    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="http://www.cnn.com/feed.xml"
    />

    ```


    # Using an RSS Service


    Plenty of tools will create a standard RSS feed out of the content on your site
    (or anyone else''s, for that matter), so you don''t have to. Here are a few tools
    you can use to easily create, edit, and publish RSS feeds:


    +   * FeedFire (www.feedfire.com)

    * FeedForAll (www.feedforall.com)

    * Feed43 (www.feed43.com)

    * Feedity (www.feedity.com)


    Also, if you use a content management system or a blog to build and maintain your
    site, you probably take advantage of built-in RSS tools.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Learning More


    If you''d like to learn more about XML, check out some of the following resources:


    +   - XML Standards This site (www.w3.org/standards/xml) is worth mentioning a
    second time, because it contains the XML standards, as well as all sorts of additional
    information for beginning and advanced users alike.

    - About.com''s XML Resources This website (webdesign.about.com/od/xml/XML.htm)
    is full of links to everything XML, including information about XSLT and a complete
    XML glossary.

    - Internet.com''s XML Resources This section of Internet.com (www.xmlfiles.com)
    is specifically geared toward web developers using XML.

    - XML: Visual QuickStart Guide by Kevin Howard Goldberg (Peachpit Press, 2008)


    # Chapter Summary


    While web design coding might begin with HTML, it certainly doesn''t end there.
    There many other tools and technologies are used to extend the capabilities of
    HTML on webpages. This chapter provided an overview of three of those technologies:
    JavaScript, PHP, and XML.


    As with most web technologies, things can get rather complex with more comprehensive
    projects. When that happens, don''t be afraid to call in some backup and engage
    the skills of a developer more experienced in whichever technology is being used.
    Word of mouth is the best way to find a reputable developer, so contact your local
    web developer networking group if you have one. Alternatively, try visiting the
    computer sciences department of a local college for people who can help.


    Chapter 8 explains templates and media types in web design, and how each one can
    greatly increase the usability and maintainability of your webpages.'
