    | author | <meta name="author" content="name of author" /> |

    | copyright | <meta name="copyright" content="year, owner" /> |

    | description | <meta name="description" content="brief description" /> |

    | keywords | <meta name="keywords" content="list of keywords" /> |

    | robots | <meta name="robots" content="none" /> |'
