    | | GIF | JPEG | PNG |

    |---|---|---|--|

    | Color Mode(s) | 8-bit (Restricted to no more than 256 exact) | 24-bit (Millions
    of colors) | 8-bit 24-bit (32-bit plus alpha channel) |

    | Compression Method | Lossless | Lossy | Lossless |

    | Animation | Supported | Not supported | Not supported |

    | Transparency | Supported (Binary only) | Not supported | Supported (Variable/alpha)
    |


    Table 3-1 compares the basic characteristics of each of these three formats. Regardless
    of which one you select for a particular situation, remember to test your files
    to ensure they perform to your satisfaction in all your target browsers.


    > **TIP** The 32-bit color format is similar to 24-bit color because it also has
    millions of colors. However, 32-bit color has an additional masking channel, which
    can be used for alpha transparency. (An alpha channel is essentially a place within
    the file where you can store extra information about it.) Be sure to thoroughly
    test any pages using PNG alpha transparency, as it is not supported by some browsers.


    # Slicing Designs


    A lot of beginning designers try to save their entire designs as single images
    for the webpage. While this might be the easiest to get a design from a graphics
    editor to the browser, it is not the best for your site''s visitors for a couple
    of reasons. First, a single large image will undoubtedly be quite hefty in file
    size, Second, a single large image isn''t flexible enough to work well in the
    variety of different viewing conditions discussed in the previous chapter.


    In addition, text is best left to the browser to render, to allow the user to
    increase or decrease the font size as needed. Text rendered by the browser is'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'also searchable (whereas text contained within an image is not) and easily
    linked to related information.


    For all these reasons, it is best to slice your design up into individual images
    and chunks of text to put together by the browser. The good news is that all the
    graphic editors I mentioned previously contain slicing tools to make this task
    easier.


    # Using Guides


    To get started, you can draw “guides” across an image to help you identify where
    each individual piece begins and ends. This is important because every image on
    your webpage is, ultimately, saved in a rectangular box. No, you can''t save a
    triangular-shaped GIF. All GIFs, JPEGs and PNGs must have four sides and be rectangles.
    You can use transparency to make things look like they aren’t rectangular but,
    in reality, everything is contained within some sort of box.


    Because everything is contained in those boxes, you might need to break some elements
    across several boxes to achieve the desired result. These pieces are going to
    be put back together with code. Think of it as a tic-tac-toe game, in which each
    element on the page is placed in a different square of the game. When you draw
    guides on your design, you’re drawing the edges of those squares.


    > TIP While the exact steps vary according to the graphics editor being used,
    most allow you to simply drag from the horizontal or vertical rulers in wherever
    you want the guide to be located.


    # Creating Slices


    Just like drawing guides, the specific steps necessary to create slices depend
    on which graphics editor is used. In Photoshop and Fireworks, the steps are essentially
    the same: You use the Slice Tool to create slices. After selecting this tool from
    the palette, draw boxes around each of the elements to define slice borders. Figure
    3-1 shows a design mockup that is sliced and ready to be exported.


    In Figure 3-1, notice I only drew two slices on the page, but Photoshop displays
    at least seven. Because everything must fit into a “grid,” the application basically
    fills in the gaps around my slices (which it refers to as “user-slices”) with
    its own slices.'
