  md: '# Hour 18. Reading and Writing Cookies


    What You''ll Learn in This Hour:


    +   - What cookies are

    - All about cookie attributes

    - How to set and retrieve cookies

    - About cookie expiration dates

    - How to save multiple data items in a single cookie

    - Deleting cookies

    - Escaping and unscaping data

    - Limitations of cookies


    Something that the JavaScript techniques that you have seen so far can''t do transfer
    information from one page to another. Cookies provide a convenient way to give
    your web pages the means to store and retrieve small pieces of information on
    a user''s own computer, allowing your website to save details such as a user''s
    preferences or dates of his or her prior visits to your site.

    in this hour you learn how to create, save, retrieve, and delete cookies using
    JavaScript.


    # What Are Cookies?


    The HTTP protocol that you use to load web pages into your browser is a so-called
    stateless protocol. This means that the server has delivered the requested page
    to your browser, it considers the transaction complete and retains no memory of
    it. This makes it difficult to maintain certain sorts of continuity during a browsing
    session (or between one session and the next) such as keeping track of which information
    the visitor has already read or downloaded, or of his login status to a private
    area of the site.


    Cookies are a way to get around this problem; you could, for example, cookies
    to remember a user''s last visit, save a list of that user''s preferences, or
    keep track of shopping cart items while he or she continues to shop. Correctly
    used, cookies can help improve the experience perceived by the user while using
    your site.


    The cookies themselves are small strings of information that can be stored on
    a'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'user’s computer by the web pages he or she visits, to be later read by any
    other web pages from within the correct domain and path. Cookies are set to expire
    after a specified length of time.


    # Caution


    Be aware that many users do not allow websites to leave cookies on their computers,
    be sure not to make your websites depend on them.

    The usual reason is that some websites use cookies as part of advertising systems,
    using them to track users’ online activities with a view to selecting appropriate
    advertisements. It may be advisable to show an explanation of why you are going
    to use the cookie and what you’ll use it for.


    # Limitations of Cookies


    Your browser may have a limit to how many cookies it can store—normally a few
    hundred cookies or more. Usually, 20 cookies per domain name are permitted. A
    total of 4KB of cookie information can be stored for an individual domain.


    In addition to the potential problems created by these limitations, cookies can
    also vanish from a hard disk for various reasons, such as the cookie’s expiry
    date being reached or the user clearing cookie information or switching browsers.
    Cookies should therefore never be used to store critical data, and your code should
    be written to cope with situations where an expected cookie cannot be retrieved.


    # The document .cookie Property


    Cookies in JavaScript are stored and retrieved by using the cookie property of
    the document object.


    Each cookie is essentially a text string consisting of a name and a value pair,
    this:


    ```

    username=sam

    ```


    When a web page is loaded into your browser, the browser marshals all of the cookies
    available to that page into a single string-like property, which is available
    as document.cookie. Within document.cookie, the individual cookies are separated
    by semicolons.'
