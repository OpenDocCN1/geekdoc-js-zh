  md: '# Debugging and Verifying Tools


    Debugging tools can save you hours when trying to track down elusive problems
    in your JavaScript code and help you speed up your scripts by analyzing execution
    timing.


    Verifying tools help you to write tidy, concise, readable, and problem-free code.
    Numerous debugging and verifying tools are available, including the following.


    # Firebug


    Firebug integrates with the Mozilla Firefox browser to offer excellent debugging,
    editing, and profiling tools. Go to http://getfirebug.com/javascript.


    # JSLint


    JSLint (http://www.jslint.com/), written by Douglas Crockford, analyzes your JavaScript
    source code and reports potential problems, including both style conventions and
    coding errors.'
