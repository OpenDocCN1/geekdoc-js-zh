  md: '# Hour 23. Debugging Your Code


    What You''ll Learn in This Hour:


    +   - The types of errors common in JavaScript

    - How to carry out simple debugging with alert()

    - Using the browser console and console.log()

    - Grouping messages in the console

    - Using breakpoints


    As you delve into more advanced scripting, you''re going to now and create JavaScript
    programs that contain errors.


    JavaScript errors can be caused by a variety of minor blunders, such as mismatched
    opening and closing parentheses, mistyping of variable names or keywords, making
    calls to nonexistent methods, and so on. This hour aims to offer some straightforward
    tips and suggestions for diagnosing errors and correcting your code, making your
    programming hours more pleasurable and productive.


    # An Introduction to Debugging


    The process of locating and correcting bugs is known as debugging, and it can
    be one of the most tricky and frustrating parts of the development process.


    # Types of Errors


    The errors that can crop up in your code usually conform to one of three types:


    +   - Syntax errors—These can include typographical and spelling errors, missing
    or mismatched quote marks, missing or mismatched parentheses/braces, and case-sensitivity
    errors.

    - Runtime errors—Errors that occur when the JavaScript interpreter tries to do
    something it can''t make sense of. Examples include trying to treat a string as
    if it were a numerical value and trying to divide a number by zero.

    - Faulty program logic—These mistakes don''t always generate error messages—the
    code may be perfectly valid—but your script doesn''t do what you want to. These
    are usually problems associated with algorithms or logical flow within the script.'
