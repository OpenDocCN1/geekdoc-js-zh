  md: "Each cookie has an expires date after which the cookie is automatically deleted.\
    \ The expires date should be in UTC time (Greenwich Mean Time, or GMT). If no\
    \ value is set for expires, the cookie will only last as long as the current browser\
    \ session and will be automatically deleted when the browser is closed.\n\n# Writing\
    \ a Cookie\n\nTo write a new cookie, you simply assign a value to document.cookie\
    \ containing the attributes required:\n\nClick here to view code image\n\n```\n\
    document.cookie = \"username=sam;expires=15/06/2013 00:00:00\";\n```\n\nTo avoid\
    \ having to set the date format manually, we could do the same using JavaScript’s\
    \ object:\n\nClick here to view code image\n\n```\nvar cookieDate = new Date (\
    \ 2013, 05, 15 );\ndocument.cookie = \"username=sam;expires=\" + \ncookieDate.toUTC();\n\
    ```\n\nThis produces a result identical to the previous example.\n\n# Tip\n\n\
    Note the use of\n\n```\ncookieDate.toUTCString();\n```\n\ninstead of\n\n```\n\
    cookieDate.toString();\n```\n\nbecause cookie dates always need to be set in UTC\
    \ time.\n\nIn practice, you should use escape() to ensure that no disallowed characters\
    \ find their way into the cookie values:\n\nClick here to view code image\n\n\
    ```\nvar cookieDate = new Date ( 2013, 05, 15 );\nvar user = \"Sam Jones\";\n\
    document.cookie = \"username=\" + escape(user) + \";expires=\" + \ncookieDate.toUTCString();();\n\
    ```\n\n# A Function to Write a Cookie"
