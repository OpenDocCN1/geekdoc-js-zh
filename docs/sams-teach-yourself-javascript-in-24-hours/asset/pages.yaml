  md: '# Hour 21. JavaScript Beyond the Web Page


    What You''ll Learn in This Hour:


    +   - Some examples of applications for JavaScript outside straightforward pages


    +   - How to write a browser extension for Google Chrome


    Up to now you''ve learned a wide range of uses for JavaScript in the writing of
    web pages. However, JavaScript can also be used for extending browsers by building
    adds-ons and extensions. Also, JavaScript interpreters are embedded in a number
    of tools apart from web browsers. Such applications often provide their own object
    model representing the host environment, although the core JavaScript language
    may remain essentially the same in each instance.


    In this hour, you learn about JavaScript above and beyond writing simple web content.
    You also write your own extension for Google''s Chrome browser.


    # JavaScript Outside the Browser


    There are a number of applications for JavaScript to control the actions of other
    applications in addition to web pages:


    +   - Browser extensions for Google''s Chrome, Opera, and Apple''s Safari 5 browsers,
    and widget/gadget collections for Apple''s Dashboard, Microsoft, Yahoo!, and Google
    Desktop can all be used with JavaScript.


    +   - JavaScript is supported in PDF files used by Adobe''s Acrobat and Reader,
    as well as many third-party applications.


    +   - Adobe tools as Photoshop, Illustrator, Dreamweaver, and others allow scripting
    via JavaScript.


    +   - The OpenOffice.org application suite (and its sibling LibreOffice) have
    JavaScript as one of the included macro scripting languages. These suites are
    written largely in Java and provide a JavaScript implementation based on Mozilla
    Rhino. JavaScript macros can access the application''s variables and objects,
    much like web browsers scripts that access the browser''s Document Object Model
    (DOM) for a web page.


    +   - Sphere, an open source and cross-platform program for writing role-'
