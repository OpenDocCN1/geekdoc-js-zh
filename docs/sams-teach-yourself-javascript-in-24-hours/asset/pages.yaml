  md: '# FIGURE 24.1 The results of our unit tests


    As you can see, one of our tests failed; JavaScript added a small rounding error.
    This is a starting point from which I reexamine the code of the function addTax()
    to remove this anomaly—perhaps by using rounding on the output value before returning
    it.


    Of course, you don''t have to log the results to the console; they could just
    as easily as QUnit, to the page, saved to a database, and so on. Later we''ll
    look at QUnit, an open source unit testing application that displays a nicely
    formatted test result in the HTML of the test page.


    # Writing JavaScript for Unit Testing


    Looking again at the preceding example, some things immediately become clear:


    +   The function addTax() was, of course, a *named* function. Had it been an anonymous
    function, it would have been much harder—perhaps impossible—to test this.


    +   The function having been contained in an external JavaScript file (here tax.js)
