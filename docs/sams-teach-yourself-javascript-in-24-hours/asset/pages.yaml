    \ code image\n\n```\n<audio src=\"song.mp3\" autoplay loop></audio>\n```\n\n>\
    \ Tip\nDon't abuse loop and autoplay, or you may find that many of your visitors\
    \ never return!\n\nAs with the earlier examples for video files, you can include\
    \ alternative formats to ensure that user's browser will find one that it can\
    \ play, as in the following code:\n\nClick here to view code image\n\n```\n<audio\
    \ controls=\"controls\">\n  <source src=\"song.ogg\" type=\"audio/ogg\" />\n \
    \ <source src=\"song.mp3\" type=\"audio/mpeg\" />\n  Your browser does not support\
    \ the audio element.\n</audio>\n```\n\nMP3, WAV, and Ogg are typically supported\
    \ file formats for the <audio> element. Controlling an audio file in JavaScript\
    \ uses the same methods as for the <video> tag.\n\nTo add and play an audio file\
    \ via JavaScript, you can treat it just like any other JavaScript or DOM object:\n\
    \nClick here to view code image\n\n```\nvar soundElement = document.createElement('audio');\n\
    soundElement.setAttribute('src', 'sound.ogg');\nsoundElement.play();\nsoundElement.pause();\n\
    ```"
