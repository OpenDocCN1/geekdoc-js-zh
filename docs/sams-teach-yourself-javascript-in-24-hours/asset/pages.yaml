    # Simplifying Calculation with the Math Object


    JavaScript''s Math object can save you a lot of work when performing many sorts
    of calculations that frequently occur.


    Unlike the Date object, the Math object does not need to be created before use;
    it already exists, and you can call its methods directly.


    A list of the available methods is in Appendix B, but Table 4.2 shows some examples.


    | Method | Description |

    | --- | --- |

    | ceil(n) | Returns rounded up to the nearest whole number |

    | floor(n) | Returns rounded down to the nearest whole number |

    | max(a,b,c,...) | Returns the largest number |

    | min(a,b,c,...) | Returns the smallest number |

    | round(n) | Returns rounded up or down to the nearest whole number |

    | random() | Returns a random number between 0 and 1 |


    # TABLE 4.2 Some Methods of the Math Object


    Let’s work through some examples.


    # Rounding


    The methods ceil(), floor(), and round() are useful for truncating the decimal
    parts of numbers:


    Click here to view code image


    ```

    var myNum1 = 12.55;

    var myNum2 = 12.45;

    alert(Math.floor(myNum1)); // shows 12

    alert(Math.ceil(myNum1)); // shows 13

    alert(Math.round(myNum1)); // shows 13

    alert(Math.round(myNum2)); // shows 12

    ```


    Note when you use round(), if the fractional part of the number is .5 or greater,
    the number is rounded to the next highest integer. If the fractional part is less
    than .5, the number is rounded to the next lowest integer.


