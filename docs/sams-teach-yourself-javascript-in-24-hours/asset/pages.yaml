  md: '# Introduction


    This introduction walks you through a few basic things before you begin reading,
    including who this book was written for, why it was written, the conventions employed
    in this book and in the Sams Teach Yourself series, how the content is organized,
    and the tools you need to create JavaScript.",


    # Who This Book Is For


    If you''re interested in learning JavaScript, chances are that you''ve already
    gained a basic understanding of HTML and web page design in general, and want
    to move on adding some extra interactivity to your pages. Or maybe you currently
    code in another programming language, want to see what additional capabilities
    JavaScript can add to your armory.


    If you''ve never tinkered with HTML at all, nor do any computer programming, it
    would be helpful to browse through an HTML primer before getting into the book.
    Don''t worry—HTML is very accessible, and you don''t need to be an expert in it
    to start experimenting with the JavaScript examples in this book.


    JavaScript is an ideal language to use for your first steps in programming, and
    in case you get bitten by the bug, pretty much all of the fundamental concepts
    that you learn in JavaScript will later be applicable in a wide variety of other
    languages such as C, Java, and PHP.


    # The Aims of This Book


    When JavaScript was first introduced, it was somewhat limited in what it could
    do. With basic features and rather haphazard browser support, it gained a reputation
    in some quarters as something of a toy or gimmick. Now, due to much better browser
    support for W3C standards and improvement in the JavaScript implementations used
    in recent browsers, JavaScript is finally being treated as a serious programming
    language.


    Many advanced programming disciplines used in other programming languages can
    readily be applied to JavaScript; for example, object-oriented programming promotes
    the writing of solid, maintainable, and reusable code.


    So-called "unobtrusive" scripting techniques and the use of DOM scripting focus
    on adding interaction to web pages while keeping the HTML simple to read and well
    separated from the program code.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'This book aims to teach the fundamental skills relevant to all of the important
    aspects of JavaScript as it''s used today. In the course of the book, you start
    from basic concepts and gradually learn the best practices for writing JavaScript
    programs in accordance with current web standards.


    # Conventions Used


    All of the code examples in the book are written as HTML5. For the most part,
    though, the code avoids using HTML5-specific syntax, since at the time of writing
    its support in web browsers is still not universal. The code examples should work
    correctly in any recent web browser, regardless of the type of computer or operating
    system.


    In addition to the main text of each lesson, you will find a number of boxes labeled
    as Notes, Tips, and Cautions.


    # Note


    These sections provide additional comments that might help you to understand the
    text and examples.


    # Tip


    These blocks give additional hints, shortcuts, or workarounds to make coding easier.


    # Caution


    Avoid common pitfalls by using the information in these blocks.


    # Try it Yourself


    Each hour contains at least one section that walks through the process of implementing
    your own script. This will help you to gain confidence in writing your own JavaScript
    code based on the techniques you''ve learned.


    # Q&A, Workshop, and Exercises


    After each hour''s lesson, you''ll find three final sections.


    +   The “Q&A” section tries to answer a few of the more common questions'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'about the hour’s topic.


    +   - The “Workshop” section includes a quiz that tests your knowledge of what
    you learned in that lesson. Answers to the quiz items are conveniently provided
    immediately following the quiz.


    +   - The “Exercises” section offers suggestions for further experimentation,
    based on the lesson, that you might like to try on your own.


    # How the Book Is Organized


    The book is divided into seven parts, gradually increasing in the complexity of
    the techniques taught.


    +   - Part I—First Steps with JavaScript


    An introduction to the JavaScript language and how to write scripts using the
    language’s common functions. Part of this book is aimed at readers with little
    or no prior programming knowledge, and no knowledge of the JavaScript language.


    +   - Part II—Cooking with Code


    Here JavaScript’s data types are introduced, such as numbers, strings, and arrays.
    More sophisticated programming paradigms such as program control loops and timers
    are also covered.


    +   - Part III—Objects


    This part of the book concentrates on creating and handling objects, including
    navigating and editing objects belonging to the DOM (Document Object Model).


    +   - Part IV—HTML and CSS


    Here you learn in greater depth how JavaScript can interact with HTML (including
    HTML5) and CSS (Cascading Style Sheets), including the latest CSS3 specification.


    +   - Part V—Using JavaScript Libraries


    In this part of the book you learn to simplify cross-browser development using
    third-party libraries such as jQuery.


    +   - Part VI—Advanced Topics


    This part of the book covers reading and writing cookies, looks at what’s new
    in JavaScript via the ECMAScript 6 specification, introduces the use of frameworks
    such as AngularJS, and shows examples of using JavaScript beyond its use in web
    pages.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Part VII—Learning the Trade


    In the final part you explore aspects of professional JavaScript development such
    as good coding practices, JavaScript debugging, and unit testing.


    # Tools You''ll Need


    Writing JavaScript does not require any expensive and complicated tools such as
    Integrated Development Environments (IDEs), compilers, or debuggers.


    The examples in this book can all be created in a text-editing program, such as
    the Windows Notepad program. At least one application ships with just about every
    operating system, and countless more are available for no or low cost via download
    from the Internet.


    Appendix A, “Tools for JavaScript Development,” lists some additional, easily
    obtainable tools and resources for use in JavaScript development.


    To see your program code working, you''ll need a web browser such as Internet
    Explorer, Mozilla Firefox, Opera, Safari, or Google Chrome. It is recommended
    that you upgrade your browser to the latest current stable version.


    The vast majority of the book''s examples do not need an Internet connection to
    function. Simply storing the source code file in a convenient location on your
    computer and opening it with your chosen browser is generally sufficient. The
    exceptions to this are on cookies and the examples in the book that demonstrate
    Ajax: to explore all of the sample code will require a web connection (a connection
    to a web server over your local area network) and a little space in which to post
    the sample code. If you''ve done some HTML coding, you may already have covered;
    if not, a hobby-grade web hosting account costs little and will be more than adequate
    for trying out the examples in this book. (Check that your web host allows you
    to run scripts written in the PHP language if you want to try out the Ajax examples
    in Part V. Nearly all hosts do.)'
  merge: -1
