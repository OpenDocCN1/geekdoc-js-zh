    # What Is Object-Oriented Programming?


    The code examples to date have been so-called procedural programming. Procedural
    programming is characterized by having data stored in variables, which are operated
    on by lists of instructions. Each instruction (or list of instructions, such as
    a function) can create, destroy, or modify the data, yet the data remains somewhat
    "separate" from the program code.


    In object-oriented programming (OOP), the program instructions and the data on
    which they operate are more intertwined. OOP is a way of conceptualizing a program’s
    data into discrete "things" referred to as objects—each having its own properties
    (data) and methods (instructions).


    Suppose


    For each car in the rental fleet, you would create an instance of the Car object.'
