  md: '# Hour 5. Numbers and Strings


    # What You''ll Learn in This Hour:


    +   - The numeric and string data types supported by JavaScript ► Conversion between
    data types ► How to manipulate strings


    We use the term data type to talk about the nature of the data that a variable
    contains. A string variable contains a string, a number variable, a numerical
    value, and so forth. However, the JavaScript language is what''s called loosely
    typed language, meaning that JavaScript variables can be interpreted as different
    data types in differing circumstances.


    In JavaScript, you don''t have to declare the data type of a variable before using
    it, as the JavaScript interpreter will make its best guess. If you put a string
    into your variable and later want to interpret that value as a number, that''s
    OK with JavaScript, provided that the variable actually contains a string''s "like"
    a numerical value (for example, "200px" or "50 cents", but nothing such as your
    name). You can later use it as a string again, if you want.


    In this hour you learn about the JavaScript data types of number, string, and
    Boolean, and some built-in methods for handling values of these types. We also
    mention escape sequences in strings, and two special JavaScript data types—null
    and undefined.


    # Numbers


    Mathematicians have all sorts of names for different types of numbers. From the
    so-called natural numbers 1, 2, 3, 4 ..., you can add 0 to get the whole numbers
    0, 1, 2, 3, 4 ..., and then include the negative values -1, -2, -3, -4 ... to
    form the set of integers.


    To express numbers falling between the integers, we commonly use a decimal point
    with one or more digits following it: 3.1415926524


    Calling such numbers floating point indicates indicates that they can have an
    arbitrary number of digits before and after the decimal point; that is, the decimal
    point "float" to any location in the number.


    JavaScript supports both integer and floating-point numbers.


    # Integers'
