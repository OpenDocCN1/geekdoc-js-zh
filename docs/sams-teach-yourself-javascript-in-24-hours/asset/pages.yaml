  md: 'Click here to view code image


    ```

    username=sam;location=USA;status=fullmember;

    ```


    # Tip


    I refer to document.cookie as a string-like property, because it isn’t really
    a string—it behaves like one when you’re trying to extract cookie information,
    as you see during this hour.


    # Escaping and Unescaping Data


    Cookie values may not include certain characters. Those disallowed include semicolons,
    commas, and whitespace characters such as space and tab. Before storing data to
    a cookie, you need to encode the data in such a way that it will stored correctly.


    You can use the JavaScript escape() function to encode a value before storing
    it, and the corresponding unescape() function to recover the original cookie value.


    The escape() function converts any non-ASCII character in the string to its equivalent
    two- or four-digit hexadecimal format—so a blank space is converted into %20,
    and the ampersand (&) to %26.


    For example, the following code snippet retrieves the original string saved in
    variable str followed by its value after applying the escape() function:


    Click here to view code image


    ```

    var str = ''Here is a (short) piece of text.'';

    document.write(str + ''<Cr />'' + escape(str));

    ```


    The output to the screen would be


    Click here to view code image


    ```

    Here is a (short) piece of text.

    Here%21is%20a%20%28short%29%20piece%20of%20text.

    ```


    Notice that the spaces have been replaced by %20, the opening parenthesis by %28,
    and the closing parenthesis by %29.


    All special characters, with the exception of *, @, -, _, +, ., and /, are encoded.


    # Cookie Ingredients


    The cookie information in document.cookie may look like a simple string of name
    and value pairs, each in the form of'
