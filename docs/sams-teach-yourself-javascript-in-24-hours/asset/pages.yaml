    # Conditional Breakpoints


    Sometimes it helps to break code execution only when a particular situation occurs.
    You can set a conditional breakpoint by right-clicking the breakpoint icon in
    the left column and entering a conditional statement.


    Your code will execute without interruption until the condition is fulfilled,
    at which point execution will halt. For instance, in Figure 23.12, the code will
    halt if the sum of a and b is less than 12. You can edit the expression at any
    time by right-clicking once more on the breakpoint icon.'
