- img_proc: true
  md: "<p><font color=red>ins text is in red!</font></p>\n\nThis was pretty awful\
    \ for a number of reasons:\n\n+   - Every single piece of text in the page that\
    \ we wanted to be colored red had to be marked up with these extra tags.\n\n+\
    \   - The created style could not be carried over to other pages; they too had\
    \ to be marked up individually with additional HTML.\n\n+   - To later change\
    \ pages' styles, you had to edit each and every page and sift through the HTML,\
    \ changing every style-related tag and attribute individually.\n\n+   - With all\
    \ this extra markup, the HTML became very hard to read and maintain.\n\nCSS separates\
    \ the styling of an HTML element from the markup function of that element. This\
    \ is done by defining individual style declarations and then applying these to\
    \ HTML elements or collections of elements.\n\nYou can use CSS to style the visual\
    \ properties of a page element, as as color, font, and size, as well as format-related\
    \ properties such as positioning, padding, and alignment.\n\nSeparating style\
    \ from content in this way brings with it a lot of benefits:\n\n+   - Style declarations\
    \ can be applied to more than one element or even (when using external stylesheets)\
    \ more than one page.\n\n+   - Changes to style declarations affect all associated\
    \ HTML elements, making updating your site's style more accurate, quick, and efficient.\n\
    \n+   - Sharing style encourages more consistent styling through your site.\n\n\
    +   - HTML markup is clearer to read and maintain.\n\n# CSS Style Declarations\n\
    \nThe syntax of CSS style declarations is not unlike that of JavaScript functions.\
    \ Suppose you want to declare a style for all paragraph elements in a page, causing\
    \ the font color inside the paragraphs to be colored red:\n\n```\np {\n  color:\
    \ red;\n}\n```\n\nYou can apply more than one style rule to your chosen element\
    \ or collection of elements, separating them with semicolons:\n\n```\np {\n  color:\
    \ red;\n}\n```"
