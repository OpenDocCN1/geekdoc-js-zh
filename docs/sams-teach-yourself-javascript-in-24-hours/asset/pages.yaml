    \ of the object.\n\nLet’s look at an example:\n\nClick here to view code image\n\
    \n```\nfunction Box(width, length, height) {\n    function volume(a,b,c) {\n \
    \       return a*b*c;\n    }\n    this.boxVolume = volume(width, length, height);\n\
