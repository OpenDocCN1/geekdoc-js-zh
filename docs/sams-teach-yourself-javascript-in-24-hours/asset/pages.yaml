  md: 'In the lessons that follow, we''ll build on these fundamental concepts to get
    into

    more advanced scripting projects.


    # Q&A


    +   Q. If I use server-side scripting (in a language such as PHP or ASP), can
    I still use JavaScript on the client side?

    nA. Most definitely. In fact, the combination of server-side and client-side scripting
    provides a potent platform, capable of producing powerful applications. Google''s
    Gmail is a good example.

    Q. How many different browsers should I test?

    A. As many as you practically can. Writing standards-compliant code that avoids
    browser-specific features will go a long way toward making your code run smoothly
    in different browsers. However, one or two differences between browser implementations
    of certain features are likely to always exist.

    Q. Won''t the inclusion of JavaScript slow down the load time of my pages?

    A. Yes, though usually the difference is small enough not to be noticeable. If
    you have a particularly large piece of JavaScript code, you may feel it''s worthwhile
    testing your page on the slowest connection user is likely to have. Other than
    in extreme circumstances, it''s unlikely to be a serious issue.


    # Workshop


    Try to answer all the questions before reading the subsequent “Answers” section.


