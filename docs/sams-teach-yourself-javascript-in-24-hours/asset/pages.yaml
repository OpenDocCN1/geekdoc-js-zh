  md: '# ng-init


    The ng-init directive runs at startup, before AngularJS has any application code.
    With it you can set default variables prior to running any other functions.


    # ng-click


    The ng-Click directive attaches a listener to a DOM element. When the element
    is clicked, AngularJS executes the expression defined in the directive.


    # ng-repeat


    The ng-repeat directive iterates through a collection and loads a template for
    each item. The template it copies the element having the attribute ng-repeat.


    ```

    $scope.departments = [

    { name: ''Sales'' },

    { name: ''Support'' },

    { name: ''Production'' },

    { name: ''Shipping'' }

    ];

    ```


    You can iterate through them using ng-repeat:


    ![](img/d69da38ba351b605218073fbb83a1f3e_350_0.png)


    ```

    <ul>

    <li ng-repeat="dept in departments">{{ dept.name }}</li></li>

    </ul>

    ```


    Here the <li> element will be cloned four times to produce the list sent to the
    view.


    # Filters


    The job of a filter is to select a subset of items from an array and return it
    as a new array. Here are a few things you might do with an array:


    +   - Format a number to a currency format, using currency.

    - Select a subset of items from an array, using filter.

    - Format a string to lowercase, using lowercase.

    - Order an array by an expression, using orderBy.

    - Format a string to uppercase, using uppercase.


    Here''s the general syntax for a filter in AngularJS:'
