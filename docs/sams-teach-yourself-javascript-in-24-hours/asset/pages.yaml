    # Try it Yourself: A Function to Output User Messages


    Let''s use what we''ve learned so far in this hour by creating a function that
    can send the user a message about a button or he has just clicked. Place the function
    definition in the <head> section of the page and call it with multiple arguments.


    Here''s our function:


    Click here to view code image


    ```

    function buttonReport(buttonId, buttonName, buttonValue) {

    // information about the id of the button

    var userMessage1 = "Button id: " + buttonId + "\n";

    // then the button name

    var userMessage2 = "Button name: " + buttonName + "\n";

    // and the button value

    var userMessage3 = "Button value: " + buttonValue;

    // alert the user

    alert(userMessage1 + userMessage2 + userMessage3);

    }

    ```


    The function buttonReport takes three arguments, those being the id, name and
    value of the button that has clicked. With each of these three pieces of information,
    a short message is constructed. These three messages are then concatenated into
    a single string, which is passed to the alert() method to pop open a dialog containing
    the information.


    # Tip


    You may have noticed that the first two message have the element "\n" appended
    to the string; this is a "new line" character, forcing the message within the
    alert dialog to return to the left and begin a new line. Special characters like
    this one must be prefixed with \ if they are to be correctly interpreted when
    they appear in a string. A \ prefixed character is known as an escape sequence.
    You learn more about escape sequences in Hour 5, "Numbers and Strings."'
