    # Graceful Degradation


    Among the earliest browsers were some that didn''t support the inclusion of images
    in HTML. When the <img> element was introduced, a way was needed to allow those
    text-only browsers to present something helpful to the user whenever such a nonsupported
    tag was encountered.


    In the case of the <img> tag, that was provided by the alt (alternative text)
    attribute. Web designers could assign a string of text to alt, and text-only browsers
    would display this to the user instead of showing the image. At the whim of the
    page designer, the alt text might be a simple title for the image, a description
    of what the picture would have displayed, or a suggestion for an alternative source
    of information that would have been carried in the graphic. This was an early
    example of graceful degradation, the process by which a user whose browser lacked
    the required technical features to make full use of a web page''s design—or has
    those features disabled—can still benefit as fully as possible from the site''s
    content.


    Let''s take JavaScript itself another example. Virtually every browser supports
    JavaScript and turns it off. So do you really need to worry about visitors who
    don''t have JavaScript enabled? The answer is probably yes. One type of frequent
    visitor to your site will no doubt be the spider program from one of the search
    engines, busy indexing the pages of the Web. The spider will attempt to follow
    all the navigation links on your pages to build a full index of your site''s content;
    such navigation requires the services of JavaScript, you may find some parts of
    your site not indexed. Your search ranking will probably suffer as a result.


    Another important example lies in the realm of accessibility. No matter how capable
    a browser program is, there are some users who suffer with limitations, such as
    perhaps inability to use a mouse, or the necessity to use screen-reading software.
    If your site does not cater to these users, they''re unlikely to return.


    # Progressive Enhancement


    When we talk about graceful degradation, it''s easy to imagine a fully functional
    web page with all the bells and whistles providing charitable assistance to users
    whose browsers have lesser capabilities.


    Supporters of progressive enhancement tend to look at the problem from the'
  merge: -1
  pgno: 378
- img_proc: true
  md: 'opposite direction. They favor the building of a stable, accessible, and fully
    functional website, the content of which can be accessed by just about any imaginable
    user and browser, to which they can later add extra layers of additional usability
    for those who can take advantage of them.


    This ensures that the site will work for even the most basic browser setup, with
    more advanced browsers gaining some additional enhancements.


    # Separate Style, Content, and Code


    The key resource of a web page employing progressive enhancement techniques is
    the content. HTML provides markup facilities to allow you to describe your content
    semantically; the markup tags themselves identify page elements as being headings,
    tables, paragraphs, and so on. We might refer to this as the semantic layer.


    What this semantic layer should ideally not contain is any information about how
    the page should appear. You can add this additional information afterwards, using
    CSS techniques to form the presentation layer. By linking external CSS stylesheets
    to the document, you avoid any-related information from appearing in the HTML
    markup itself. Even a browser having no understanding of CSS, however, can access
    and display all of the page’s information, even though it might not look pretty.


    When you come now to add JavaScript in the mix, you do so as yet another notional
    layer—you might think of it as the behavior layer. Users without JavaScript still
    have access to the page content via the semantic markup; if their browser understand
    CSS, they’ll also benefit from the enhanced appearance of the presentation layer.
    If the JavaScript of the behavior layer is applied correctly, it will offer more
    functionality to those who can use it, without prejudicing the abilities of the
    preceding layers.


    To achieve this, you need to write JavaScript that is unobtrusive.


    # Unobtrusive JavaScript


    There is no formal definition of unobtrusive JavaScript, but the concepts upon
    which it’s built all involve maintaining the separation between the behavior layer
    and the content and presentation layers.


    # Leave That HTML Alone


    The first and perhaps most important consideration is the removal of JavaScript
    code from the page markup. Early applications of JavaScript clutter the HTML'
