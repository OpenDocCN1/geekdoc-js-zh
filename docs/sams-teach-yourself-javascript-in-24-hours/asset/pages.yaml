  md: 'AngularJS begins as soon as the web page has loaded. The ng-app directive tells
    AngularJS that, in this case, it is the &lt;body&gt; element of the page that
    contains an AngularJS application.


    The ng-model directive binds the value contained by the input field to the variable
    name.


    Similarly, the ng-bind directs the HTML content of the &lt;span&gt; element to
    the variable name. In this way, the &lt;span&gt; element becomes a variable in
    our MVC framework.


    Now, any changes in the input field will be immediately reflected in the &lt;span&gt;
    element, as shown in Figure 20.2.


    ![](img/d69da38ba351b605218073fbb83a1f3e_348_0.png)


    **FIGURE 20.2** a simple AngularJS application


    That''s it. We already have a dynamic application that would ordinarily have taken
    much more code to build. We didn''t have to worry about writing code for data
    binding and updating, nor specify any models. In fact, we haven''t written any
    JavaScript of our own! The application—simple as it is—already works because of
    AngularJS’s design.


    # Scopes


    A scope is an object that links a DOM element (the view part of the MVC architecture)
    to a controller; in MVC terms, this object becomes the *model*.


    The controller and the view both access to the scope model, so it can be used
    to communicate between them. This scope object will house the data and the methods
    used in the view.


    All AngularJS applications have a *$rootScope*. The *$rootScope* belongs to the
    DOM element that contains the **ng-app** directive.


    When explicit scopes are not set in the application, this is the scope used by'
