  md: '# Hour 4. DOM Objects and Built-in Objects


    What You''ll Learn in This Hour:


    +   - Talking to the user with alert(), prompt(), and confirm()

    - Selecting page elements with getElementById()

    - Accessing HTML content with innerHTML

    - How to use the browser history object

    - Reloading or redirecting the page using the location object

    - Getting browser information via the navigator object

    - Manipulating dates and times with the Date object

    - Calculations made easier with the Math object


    In Hour 1, "Introducing JavaScript," we talked a little about the DOM and introduced
    the top-level object in the DOM tree, the window object. We also looked at one
    of its child objects, document.


    In this hour, we introduce some more of the utility objects and methods that you
    can use in your scripts.


    # Interacting with the User


    Among the methods belonging to the window object, there are some designed specifically
    to help your page communicate with the user by assisting with the input and output
    of information.


    # alert()


    You''ve already used the alert() method to pop up an information dialog for the
    user. You''ll recall that this modal dialog simply shows your message with a single
    OK button. The term modal means script execution pauses, and all user interaction
    with the page is suspended, until the user clears the dialog. alert() method takes
    a message string as its argument:


    ```

    alert("This is my message");

    ```


    alert() does not return a value.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# confirm()


    The confirm() method is similar to alert(), in that it pops up a modal dialog
    with a message for the user. The confirm() dialog, though, provides the user with
    a choice; instead of a single OK button, the user may select OK and Cancel, as
    shown in Figure 4.1. Clicking on either button clears the dialog and allows the
    calling script to continue, the confirm() method returns a different value depending
    on which button was clicked—true in the case of OK, or false in the case of Cancel.
    We begin to look at JavaScript’s data types in the next hour, but for the moment
    you just need to know that a Boolean variable can only take one of two values,
    true or false.


    ![](img/d69da38ba351b605218073fbb83a1f3e_73_0.png)


    FIGURE 4.1 The confirm() dialog


    The confirm() method is called in a similar way to alert(), passing the required
    message as an argument:


    [Click here to view code image](https://example.com/image_link)


    ```

    var answer = confirm("Are you happy to continue?");

    ```


    Note that here, though, we pass the returned value of true or false to a variable
    so we can later test its value and have our script take appropriate action depending
    on the result.


    # prompt()


    The prompt() method is yet another way to open up a modal dialog. In this case,
    though, the dialog invites the user to enter information.

    A prompt() dialog is called in just the same manner as confirm():


    [Click here to view code image](https://example.com/image_link)


    ```

    var answer = prompt("What is your full name?");

    ```'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'The prompt method also allows for an optional second argument, giving a default
    response in case the user clicks OK without typing anything:


    [Click here to view image](#)


    ```

    var answer = prompt("What is your full name?", "John Doe");

    ```


    The return value from a prompt() dialog depends on what the user takes:


    +   * If the user types in input and clicks Enter, the user string is returned.


    +   * If the user clicks OK or presses Enter without typing anything into the
    prompt dialog, the method returns the default response (if any), optionally specified
    in the second argument passed to prompt().


    +   * If the user dismisses the dialog (that is, by clicking Cancel or pressing
    Escape), the prompt method returns null.


    # Note


    The null value is used by JavaScript on certain occasions to denote an empty value.
    When treated as a number it takes the value 0, when used as a string it evaluates
    to the empty string (""), and when used as a Boolean value it becomes false.


    The prompt() dialog generated by the previous code snippet is shown in Figure
    4.2.


    ![](img/d69da38ba351b605218073fbb83a1f3e_74_0.png)


