  md: "It’s fairly straightforward to write a function to write your cookie for you,\
    \ leaving all the escaping and wrangling of optional attributes to the function.\
    \ The code for such a function appears in Listing 18.1.\n\n# LISTING 18.1 Function\
    \ to Write a Cookie\n\nClick here to view code image\n\n```\nfunction createCookie(name,\
