  md: '# # Appendix B. JavaScript Quick Reference


    Table B.1, Table B.2, Table B.3, and Table B.4 in this appendix contain a quick
    look-up for some of the more commonly used elements of JavaScript syntax, along
    with properties and methods for a selection of the built-in objects.


    | Operator | Description |

    |---|---|

    | **Arithmetic Operators** | |

    | * | Multiplies two numbers. |

    | / | Divides two numbers. |

    | % (Modulus) | Returns the remainder left after dividing two numbers using integer
    division. |

    | **String Operators** | |

    | + | (String addition) Joins two strings. |

    | += | Joins two strings and assigns the joined string to the first operand. |

    | **Logical Operators** | |

    | && | (Logical AND) Returns a value of true if both operands are true; otherwise,
    returns false. |

    | || | (Logical OR) Returns a value of true if either operand is true. However,
    if both operands are false, returns false. |

    | ! | (Logical NOT) Returns a value of false if its operand is true; true if its
    operand is false. |

    | **Bitwise Operators** | |

    | & | (Bitwise AND) Returns a one in each bit position if both operands'' bits
    are one. |

    | ^ | (Bitwise XOR) Returns a one in a bit position if the bits of one operand,
    but not both operands, are one. |

    | | | (Bitwise OR) Returns a one in a bit if either operand has a one in that
    position. |

    | ~ | (Bitwise NOT) Changes one to zeros and zeros to ones in all bit positions—that
    is, flips each bit. |

    | << | (Left shift) Shifts the bits of its first operand to the left by the number
    of places given in the second operand. |'
