  md: 'of node.


    Q. Is Mozilla’s DOM Inspector the only tool of its type?


    A. Not at all. Just about every browser has some DOM inspection tools built into
    the developer tools. However, Mozilla’s DOM Inspector gives a particularly clear
    view of the DOM hierarchy and the parameters of individual nodes; that’s why I
    presented it here.


    Q. Is it better to use the DOM to insert and retrieve HTML, or innerHTML?


    A. Each has its advantages and disadvantages. To insert a chunk of HTML into a
    document, using innerHTML is quick and easy. However, it returns no references
    to the code you’ve inserted, so you can’t carry out operations on that content
    very easily. DOM methods offer finer-grained control for manipulating page elements.


    Wherever you use innerHTML, the same result is achievable using DOM methods, though
    usually with a little more code.


    Remember, that innerHTML is not a W3C standard. It is well supported currently,
    but there’s no guarantee that will will always be so.


    Q. I’ve seen references on the Web to DOM Core and HTML DOM. What are these, and
    what are the differences between them?


    A. The DOM Core describes a basic nucleus of DOM methods that are applicable not
    just to HTML pages, but also pages written in any similar markup language—XML,
    HTML DOM is a larger collection of additional methods relating specifically to
    HTML pages. They offer some shorthand ways of carrying out tasks, at the expense
    of making your code a little portable than non-HTML applications.


    The examples in this book generally use DOM Core methods to be more general. Listing
    9.6, for example, I used the statement


    Click here to view image


    ```

    menuA.setAttribute("href", "#item" + i);

    ```


    I could have used the HTML DOM statement


    ```

    menuA.href = "#item" + i;

    ```


    which is a little shorter.


