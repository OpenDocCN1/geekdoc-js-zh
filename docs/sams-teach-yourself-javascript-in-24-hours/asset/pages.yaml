    a string of characters, or various other data types discussed later in this hour
    or those that follow. Our variables can be pretty much anything we want, so long
    as we use alphanumeric characters, the dollar sign $, or underscores in the name.


    # Note


    JavaScript is case sensitive—a variable mypetcat is a different variable from
    Mypetcat or MYPETCAT.


    Many coders of JavaScript, and other programming languages, like to use the so-called
