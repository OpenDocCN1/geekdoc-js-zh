    You''ve already learned about the W3C DOM and, and in the code examples of previous
    hours, you used various DOM objects, properties, and methods. In this hour you
    begin exploring JavaScript can directly interact with the DOM. In particular,
    you learn some ways to navigate around the DOM, selecting particular DOM objects
    that represent parts of the page’s HTML contents. You see how to create elements,
    how to add, edit, and remove nodes of the DOM tree, and how to manipulate elements’
    attributes.


    # DOM Nodes


    In Part I, “First Steps with JavaScript,” you were introduced to the W3C Document
    Object Model (DOM) as a hierarchical tree of parent-child relationships that form
    a model of the current web page. By using appropriate methods, you can navigate
    to any part of the DOM and retrieve details about it.

    You probably recall that the top-level object in the DOM hierarchy is the window
    object, and one of its children is the document object. In this hour we mainly
    deal with the document object and its properties and methods. Take a look at the
    simple web page of Listing 9.1.'
