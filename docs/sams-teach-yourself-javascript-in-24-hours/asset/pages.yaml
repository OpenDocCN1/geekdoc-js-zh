  md: '# Tip


    When you amend the DOM using the methods described in this hour, you change the
    way a page appears in the browser. Bear in mind, that you''re not changing the
    document itself. If you ask your browser to display the source code of the page,
    you won''t see any changes here.


    That’s because the browser is actually displaying the current DOM representation
    of the document. Change that, and you change what appears onscreen.


    # Creating Nodes


    Adding new nodes to the DOM tree is a two-stage process:


    +   1. First, you create a new node. Once created, the node is initially in a
    kind of “limbo”; it exists, but it’s not actually located anywhere in the DOM
    tree, and therefore doesn’t appear on the visible page window.

    2. Next, you add the new node to the tree, in the desired location. At this point
    it becomes part of the visible page.


    Let’s look at some methods of the document object that are available for creating
    nodes


    # createElement()


    You can call on the createElement() method to create new HTML elements having
    any of the standard HTML element types—paragraphs, spans, tables, and so on.


    Let’s suppose you’ve decided to create a new <div> element for your document.
    To do so, you simply need to pass the relevant nodeName value—in this case "div”—to
    the createElement method:


    Click here to view code image


    ```

    var newDiv = document.createElement("div");

    ```


    The new <div> element exists, but currently has no content, no attributes, and
    no location in the DOM tree. You see how to solve these issues shortly.


