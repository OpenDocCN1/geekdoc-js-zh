  md: '# Hour 20. Using Frameworks


    +   What You''ll Learn in This Hour:

    * What frameworks are, and why they’re useful

    * About the Model-View-Controller (MVC) architecture

    * How to get started with Google’s AngularJS framework

    * Details of some other popular frameworks


    If you''ve already written a number of applications, chances are you''ve had to
    solve some of the same coding problems over and over again. One of the techniques
    you can use to cut down on such re-invention of the wheel is to use a software
    framework.


    In this hour you''ll learn about a popular style of network called an MVC (Model-View-Controller)
    framework, and see how to implement such a framework for single-page JavaScript
    applications using Google’s AngularJS.


    # Software Frameworks


    The purpose of a framework is to improve the efficiency with which you can write
    software applications, at the same time adding consistency, quality, reliability,
    and robustness to it.


    Choosing a well-written and appropriate framework can leave you more time to focus
    on the unique requirements of your application rather than spending lots of valuable
    time on the application’s infrastructure.


    # Why Use a Framework?


    Frameworks help you to reuse code that has been previously built and tested, improving
    your application’s reliability and reducing the coding and testing required in
    its creation.


    A framework can also encourage better programming practices, due to the structure
    it imposes on your application.


    Finally, a framework usually provides you with the means to extend its functionality,
    making it better suited to your application’s needs.


    # Frameworks Are Not the Same as Libraries'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'Many people confuse the term software framework with a software library, like
    the ones discussed in Part V of this book.


    However, there is a fundamental difference between frameworks and libraries; when
    you use a library, the objects and methods available within that library already
    exist, waiting to be invoked by your custom application. You need to know which
    objects and methods to employ in your code in order to create your application.


    When you use a framework, it''s you that designs and the objects and methods used
    by your application. The framework provides a consistent structure in which you
    can do this.


    # Model-View-Controller (MVC) Architecture


    The concept of the Model-View-Controller (MVC) software architecture is fairly
    simple: to separate your application into units, each of which conforms to one
    of the following parts.


    # Models


    Models represent the part of the application dealing with business data and business
    logic. A model might be a single object, or it could be some structure made up
    from a variety of objects.


    # Views


    A view is a representation of a model used to present information to the user.
    It usually acts as a presentation filter, showing only certain aspects of the
    data contained in a model while suppressing others.


    A view interrogates the model to obtain the data necessary for presentation. It
    might also change the data in the model by sending appropriate commands. Such
    questions and all commands have to be in semantics defined within the model.


    # Controllers


    A controller forms the link between the user and the application, arranging for
    views to be displayed on the screen, or reading user input by presenting menus,
    input fields, buttons, or other page elements. The controller interprets user
    input before passing it to one or more of the views.


    The operation of the various parts of the MVC framework is shown in Figure 20.1.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '![](img/d69da38ba351b605218073fbb83a1f3e_345_0.png)


    FIGURE 20.1 Model-View-Controller framework interactions


    # ### A Real-World Example


    Watching TV can be analogous to an MVC framework.

    The broadcaster makes available various channels, each containing different data;
    these channels can be thought of as the *models* of the MVC system.

    The view is provided by the TV''s screen.

    You can interact with the TV by using the functions of the remote control(ler).


    # ### Using an MVC Framework for Web Apps


    The MVC architecture lends itself very well to web applications.


    +   - **Model**—The page content is stored in the models that underpin the application.
    The technical details may vary—the text and images may be stored in a database,
    as server files, or in some other way—but the content, and the rules of how it
    all fits together, are encoded into the model part of the framework.'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'View—The HTML and CSS add one or more visual display layers to the content—the
    veneer we apply to give our web application a particular appearance and style.
    We can change how the content is displayed without altering the original content,
    as stored in the model(s), at all.


    Controller—The controller element consists of program code linked to the interactive
    elements on the page, such as form fields, buttons, and the links. Such code interprets
    user input and communicates with models and views.


    # The AngularJS Framework


    AngularJS is an MVC framework developed by Google that lets you build well-structured,
    easily testable, and maintainable JavaScript web applications. It is designed
    to help you produce powerful, reliable, single-page applications.


    # An Overview of AngularJS


    AngularJS is an MVC framework that binds your HTML code (corresponding to the
    views part of the MVC paradigm) to JavaScript objects (the models part of MVC).


    In one direction, any changes to your models update the page automatically. The
    opposite is also true—a model, for instance associated with a text field, is updated
    when the content of the field is changed. In the same manner, changes in the view—such
    as a user entering information in a field, or clicking on a button—make the required
    changes to the appropriate model(s).


    Behind the scenes, AngularJS handles the logic, so you don''t have to write code
    to update your page''s HTML code, or to listen for and act upon user events.


    # Including AngularJS in your page


    To use AngularJS you have include it in your page. Perhaps the easiest way to
    do that is via Google''s CDN:


    Click here to view code image


    ```

    <script>

    src="http://ajax.googleapis.com/ajax/libs/angularjs/1.3.14/angular.min.js"></script>

    ```


    # Extending HTML with ng- directives


    AngularJS employs a number of directives that help you associate your page''s'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'HTML elements to models in the MVC architecture. These directives each start
    with ng- and can be added to any element.


    The key attribute that you have to include in any page is ng-app, which defines
    an AngularJS application. You need to apply this to an element that contains the
    rest of the page elements being ng- directives. You can apply it to the page''s
    <body> element (making the whole page part of the application), or a <div> element
    enclosing the application:


    ```

    <body ng-app>

    ```


    AngularJS finds this element when the page loads and processes all ng-directives
    it sees on its child elements.


    Two further important ng- directives are ng-model and ng-bind.


    The ng-model directive connects value of HTML controls as input fields, select
    boxes, text and so on, to application data stored in models.


    The ng-bind directive binds application data, in the MVC models, to elements in
    the HTML view.


    A trivial example is shown in Listing 20.1.


    # LISTING 20.1 A Simple AngularJS Example


    Click here to view code image


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>AngularJS Example</title>

    <style>

    #output {

    font: 28px helvetica, arial, sans-serif;

    color: red;

    }

    </style>

    <script

    src="http://ajax.google.com/ajax/libs/angularjs/1.3.14/angular.min.js"></script>

    </head>

    <body ng-app>

    <p>Name: <input type="text" ng-model="name"></p>

    <span id="output" ng-bind="name"></span>

    </body>

    </html>

    ```'
