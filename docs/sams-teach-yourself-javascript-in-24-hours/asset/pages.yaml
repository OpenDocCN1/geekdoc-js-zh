    # # Using Breakpoints to Halt Code Execution


    As your scripts grow in complexity, you''re likely to find that even console logging
    isn''t enough to let you debug effectively.


    To perform more detailed debugging, you can set so-called breakpoints in the code
    at places of interest. When code execution arrives at a breakpoint, it pauses;
    while time remains frozen you can examine how your code is operating, check variable
    values, read logged messages, and so on.


    To set a breakpoint in most popular debuggers you need to go to the Scripts panel,
    where you''ll see your code listed. Click on a line number (or just to the left
    of it) to set a breakpoint at that line. In Figure 23.11, a breakpoint has been
    set on line 8 of the code. The execution has stopped at this point, and you can
    see the current values of the individual variables in the right panel. You can
    remove breakpoints by clicking again on the breakpoint icon in the left margin.


    ![](img/d69da38ba351b605218073fbb83a1f3e_405_0.png)'
