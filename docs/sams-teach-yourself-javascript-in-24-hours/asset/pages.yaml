    # Summary


    In this hour, you were introduced to the concepts of server-side and client-side
    scripting and had a brief history lesson about JavaScript and the Document Object
    Model. You had an overview of the sorts of things JavaScript can do to enhance
    your web pages and improve the experience for your users.


    Additionally, you learned about the basic structure of the Document Object Model,
    and how JavaScript can access particular objects and their properties, and use
    the methods belonging to those objects.'
