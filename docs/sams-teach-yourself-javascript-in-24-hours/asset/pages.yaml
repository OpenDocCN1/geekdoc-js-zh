  md: '# Hour 6. Arrays


    What You''ll Learn in This Hour:


    +   - What we mean by the array data type

    - How to declare and populate arrays

    - How to manage array contents


    Sometimes it makes sense to store multiple variable values under a single variable
    name. JavaScript is the array data type to help you do this.

    In this hour you''ll see how JavaScript arrays are created and how the data stored
    in these arrays can be manipulated in code.


    # Arrays


    An array is a type of object used for storing multiple values in a single variable.
    Each value has a numeric index that may contain data of any data type—Booleans,
    numbers, strings, functions, objects, and even other arrays.


    # Creating a New Array


    The syntax for creating an array will already be familiar to you; after all, an
    array is simply another object:


    ```

    var myArray = new Array();

    ```


    However, for arrays there is a shorthand version—simply use square brackets ([])
    like this:


    ```

    var myArray = [];

    ```


    # Initializing an Array


    You can optionally preload data into your array at the time it is created:


    Click here to view code image


    ```

    var myArray = [''Monday'', ''Tuesday'', ''Wednesday''];

    ```


    Alternatively, items can be added after the array has been created:


    ```

    var myArray = [];

    myArray[0] = ''Monday'';

    myArray[1] = ''Tuesday'';

    ```'
