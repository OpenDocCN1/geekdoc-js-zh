  md: '# Hour 11. JavaScript and HTML5


    What You''ll Learn in This Hour:


    +   - About the new HTML5 markup tags

    - How to handle video and audio

    - Using the <canvas> element

    - Drag and drop in HTML5

    - Working with local storage

    - How to interface with the local file system


    The previous version of HTML, HTML 4.01, has been been around since 1999.

    The XML-based version of HTML, XHTML, had been the subject of various recent W3C
    efforts, the latest having moved toward XHTML2. In 2009 the W3C announced that
    XHTML2 was to be dumped in favor of diverting resources to a new version of HTML,
    HTML5.


    > Tip

    Note how it''s written: HTML5. There''s no space between the L and the 5.


    This latest incarnation of HTML concentrates on developing HTML as a front end
    for web applications, extending the markup language via semantically rich elements,
    introducing some new attributes, and adding the possibility to use brand-new APIs
    in conjunction with JavaScript.


    The HTML5 standard was finalized as the new standard for HTML in the fall of 2014,
    and the major browsers already support many of the new HTML5 elements and APIs.


    In this hour, you learn how to control some of these powerful new features with
    JavaScript.


    # New Markup for HTML5


    Even HTML pages that are well-formed are more difficult to read and interpret
    than they could be, because the markup contains very little semantic information.


    Page sections such as sidebars headers and footers and navigation elements are'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'all contained in general-purpose page elements such as divs, and only identifiable
    by the ID and class names invented by the page''s developer.

    HTML5 adds new elements to more easily identify each of these, and more,

    types of content. Some of the new tags are listed in Table 11.1.


    | Tag | Description |

    |---|---|

    | <section> | Used to define sections of pages |

    | <header> | The header of a page |

    | <footer> | The footer of a page |

    | <nav> | The navigation on a page |

    | <article> | The article or primary content on a page |

    | <aside> | Extra content, such as a sidebar on a page |

    | <figure> | Images that annotate an article |

    | <figcaption> | A caption for a <figure> element |

    | <summary> | A visible heading for a <details> element |


    TABLE 11.1 Some New HTML5 Tags


    #  Some Important New Elements


    While HTML5 introduces a wide variety of interesting new capabilities, this section
    concentrates on the new tags that help ease some long-standing difficulties.


    #  Video Playback with <video>


    Video on the Web is extremely popular. However, the methods for implementing video
    are generally proprietary, reproduction happening via plugins as Flash, Windows
    Media, and Apple QuickTime. Markup that works for embedding these elements in
    one browser doesn''t always work in the others. HTML5 contains a <video> element,
    the aim of which is to enable the embedding of any and all video formats.


    Using the new <video> tag, you can implement your favorite QuickTime movie like:


    ```

    <video src="video.mov" />

    ```


    So far there has been much debate about which video formats (codecs) should be
    supported by the video element; at the time of writing, the search continues for
    a codec that requires no special licensing terms, though WebM'
