  md: '# Hour 13. Introducing CSS3


    What You''ll Learn in This Hour:


    +   - Some of the new abilities CSS3 brings to CSS

    - Using vendor-specific prefixes and extensions

    - Cross-border setting of CSS3 properties

    - Setting CSS3 properties efficiently in JavaScript


    Using CSS3 you can easily achieve plenty of cool new effects without having to
    use lots of JavaScript code and/or graphics applications such as Photoshop. You
    can create rounded borders, add shadows to boxes, use an image as a border, and
    more. CSS3 contains several new background properties that give you more control
    over background elements, including multiple background images, while CSS3 gradients
    let you display transitions between two or more specified colors. New features
    include text shadows and word wrap, as well as use of web fonts. CSS3 lets you
    easily build really cool transitions, transformations, and animations.


    In this hour you''ll get a flavor of what CSS3 can do for your web pages, and
    you''ll see how to effectively control CSS3''s capabilities using JavaScript.


    # Vendor-Specific Properties and Prefixes


    CSS vendor prefixes are a way for browser companies to add support for new or
    experimental CSS3 features before they become part of the formal CSS3 specification,
    or to implement features of a specification that hasn''t been finalized. In course,
    these prefixes usually become unnecessary as the features become fully supported
    via their standard CSS3 nomenclature. To make sure that your pages render as you
    want them in the maximum number of browsers, though, it pays to use prefixes.


    The CSS3 browser prefixes you''re likely to need appear in Table 13.1.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '| Browser-System | Prefix |

    |--- | --- |

    | Android | -webkit- |

    | Chrome | -webkit- |

    | Firefox | -moz- |

    | Internet Explorer | -ms- |

    | iOS | -webkit- |

    | Opera | -o- |

    | Safari | -webkit- |


    # TABLE 13.1 Vendor Prefixes for CSS3


    In most cases, where a prefix is necessary you take the CSS3 property as listed
    in the CSS3 specification and add the relevant prefix from Table 13.1 for the
    browser in use. For example, later in this hour you will read about CSS3 transitions.
    You will see that, if you want to add a CSS3 transition to your page, you use
    the transition property with the prefixes added first:


    Click here to view code image


    ```

    -webkit-transition: background 0.5s ease;

    -moz-transition: background 0.5s ease;

    -o-transition: background 0.5s ease;

    transition: background 0.5s ease;

    ```


    The user''s browser will respond to whichever version of the transition feature
    it understands, ignoring the rest.


    Thankfully, browser manufacturers are working hard at fully implementing all of
    the CSS3 features, and for most modern browsers the number of properties requiring
    a prefix is falling quickly.


    # Tip


    At the time of writing there''s a really useful roundup of feature/browser combinations
    require a prefix at http://shouldiprefix.com/.


    For a frequently updated list of which features are supported by a particular
    browser and, visit http://www.w3schools.com/cssref/css3_browsersupport.asp.


    # Caution


    The prefixed version of a property might not always be exactly the same as the
    property as described in the CSS3 specification.'
