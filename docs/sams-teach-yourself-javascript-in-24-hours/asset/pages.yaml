    Earlier in the book you saw how to directly instantiate an object using the new
    Object () syntax. In this hour you learn about JavaScript Object Notation (JSON),
    which as its name implies, offers another way to create object instances, and
    can also act as a general-purpose data exchange syntax.


    > Note

    nThe official home of JSON is http://json.org/, which also has links to a wide
    variety of JSON resources on the Web.


    # What Is JSON?


    JSON (pronounced "JSON") is a simple and compact notation for JavaScript objects.
    Once expressed in JSON, objects can easily be converted to be stored and transmitted
    (across networks or between applications, for instance). However, the real beauty
    of JSON is that an object expressed in JSON is really just expressed in normal
    JavaScript code. You therefore take advantage of “automatic” parsing in JavaScript;
    you can just have JavaScript interpret the contents of a JSON string as code,
    with no extra parsers or converters.


    # JSON Syntax


    JSON data is expressed as a sequence of parameter and value pairs, each pair using
    a colon to separate parameter from value. These "parameter" : "value" pairs are
    themselves separated by commas:


    Click here to view code image'
