    # FIGURE 9.2 The DOM’s tree model of our page


    # Caution


    Remember, the DOM is not available until the page has finished loading. Don''t
    try to execute any statements that use the DOM until then, or your script is likely
    to produce errors.


    Look how the tree diagram of Figure 9.2 relates to the code in Listing 9.1. The
    `<html>` element contains all the other markup of the page. It is the `parent`
    element to two `immediate` elements, the `<head>` and `<body>` elements. These
    two elements are siblings, as they share a parent. They are also parents themselves;
    the `<head>` element has one child, `<title>`, and the `<body>` element three
    children: the `<h1>` heading, the ordered list `<ol>`, and a paragraph, `<p>`.
    Of these three siblings, only `<ol>` has children, those three `<li>` line items.
    Various of these elements of the tree text, shown represented in the gray boxes
    in Figure 9.2.

    The DOM is constructed as a hierarchy of such relationships. The boxes that make
    up the junctions and terminating points of the tree diagram are known as nodes.


    # Types of Nodes


    Figure 9.2 shows various element nodes, each of which represents an HTML element
    such as a paragraph element, `<p>`, along with some `text nodes`, representing
    the text content of such page elements.


    # Tin'
