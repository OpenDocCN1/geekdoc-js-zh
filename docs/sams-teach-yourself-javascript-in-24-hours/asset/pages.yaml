    # JSON Data Types


    The parameter part of each parameter :value pair must follow a few simple grammatical
    rules:


    +   - It must not be a JavaScript reserved keyword.

    - It must not start with a number.

    - It must not include any special characters except the underscore or dollar sign.


    The values in JSON objects can contain any of the following data types:


    +   - Number

    - String

    - Boolean

    - Array

    - Object

    - null (empty)


    # Caution


    JavaScript syntax has several data types that are not included in the JSON standard,
    including Date, Error, Math, and Function. These data types must be represented
    as some other data format, with the encoding and decoding programs following the
