    # Operator Precedence


    When you use several operators in the same calculation, JavaScript uses precedence
    rules to determine in what order the calculation should be done. For example,
    consider the statement


    ```

    var average = a + b + c / 3;

    ```


    If, as the variable''s name implies, you''re trying to calculate an average, this
    would not give the desired result; the division operation would be carried out
    c before adding the values of a and b to the result. To calculate the average
    correctly, we would have to add parentheses to our statement, like this:


    Click here to view code image


    ```

    var average = (a + b + c) / 3;

    ```


    If you have doubts about the precedence rules, I would recommend that you always
    parentheses liberally. There is no cost to doing so, it makes your code easier
    to read (both for you and for anyone else who later has to edit or decipher it),
    and it ensures that precedence issues don''t spoil your calculations.


    # Note


    If you have programming experience in another language such as PHP or Java, you''ll
    find that the precedence rules in JavaScript are pretty much identical to the
    ones you''re used to. You can find detailed information on JavaScript precedence
    at http://msdn.microsoft.com/enus/library/z3ks45k7(yvs,94).aspx.


