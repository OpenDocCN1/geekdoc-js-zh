  md: '# Hour 24. JavaScript Unit Testing


    **What You''ll Learn in This Hour:**


    +   - What unit testing is and why it''s used

    - How to make your JavaScript code more easily testable

    - Some examples of JavaScript test suites

    - About the QUnit test suite and the CommonJS unit testing specification


    Often, a little JavaScript hack that started out as just a few lines of code subsequently
    grows to ten, then twenty, then fifty. Meanwhile, functions are tweaked to a little
    more, conditional statements gain a few extra conditions, or a couple extra variables
    are created.


    When such an application (inevitably) breaks, it can be a nightmare to unravel
    the code and find the problem.


    As you already read in Hour 22, "Good Coding Practice," good coding practice can
    help to make your code easier to understand and to maintain, but there''s something
    you can do, too. As your JavaScript applications grow in size, complexity, and
    sophistication, it becomes even more important to write code that can be easily
    tested.


    In this hour you''ll learn some ways to write your code to make it suitable for
    unit testing, and how to write and perform such tests.


    # **What Is Unit Testing?",


    If you''re unfamiliar with the concept of unit testing, don''t worry, it''s not
    too complicated to understand.


    Usually when somebody thinks about testing a JavaScript application, they imagine
    the completed system to see if it works as expected. This is essentially a test
    to see if the various pieces of the application work correctly together, and is
    often known as integration testing.


    Unit testing is a software verification and validation method in which an application
    is broken down into its smallest testable parts, called units, these units are
    individually examined and tested for proper operation. A unit is the smallest
    testable part of an application, such as an individual function or method. Unit
    testing can be done manually, but such testing is usually automated.'
  merge: -1
  pgno: 411
- img_proc: true
  md: "Essentially, you write a series of tests for each fundamental element of your\
    \ code, to test that unit's performance under all conceivable types of input.\
    \ If all of these tests are passed, you can be confident that each tested element\
    \ is fit for purpose.\n\n# Try it Yourself: A Home-Cooked Unit Test\n\nLet's jump\
    \ right in and perform a unit test from scratch.\n\nIn this example we'll write\
    \ some tests, perform them on a sample unit, and send a summary of the results\
    \ to the browser console.\n\nLet's look at a function we wrote back in [Hour 3,\
    \ \"Using Functions,\\] to add a given percentage to a net figure and return the\
    \ gross amount:\n\n[Click here to view code image]\n\n```\nfunction addTax(subtotal,\
    \ taxRate) {\n  var total = subtotal * (1 + (taxRate/100));\n  return total;\n\
    }\n```\n\nThis function forms the unit that we'll subject to some tests.\n\nWe'll\
    \ save this function in a file test.js, and include it in the HTML page that will\
    \ serve as a test suite. In the real world, it's more likely that tax.js would\
    \ contain a number of different functions, as part of a financial application,\
    \ but for this example it'll just fine. The HTML code is shown in [Listing 24.1].\n\
    \n# LISTING 24.1 HTML Code for the Test Suite\n\n[Click here to view code image]\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Manual Testing Examples</title>\n\
    \  <script src=\"test.js\"></script>\n  <script>\nfunction test(amount, rate,\
    \ expected) {\n  results.total++;\n  var result = addTax(amount, rate);\n  if\
    \ (result!==expected) {\n    results.failed++;\n    console.log(\"Expected \"\
    \ + expected + \", but but got \" + result);\n  }\n}\",\n```"
