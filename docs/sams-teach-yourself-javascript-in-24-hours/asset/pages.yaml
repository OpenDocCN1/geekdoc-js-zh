    # Try it Yourself: A Banner-Cycling Script


    Let''s put to use some of what you learned in this hour by writing a script to
    cycle images on the page. I''m sure you have seen this sort of program before,
    either as an image slideshow, or perhaps to rotate advertisement banners.


    First, I want to introduce you to two new items. The first is an event handler
    that you haven''t met before—the onLoad method of the window object. Its operation
    is simple: We can attach it to the <body> element like this:


    Click here to view code image


    ```

    <body onload="someFunction()">

    ```


    When the page has finished loading completely, the onLoad event fires, and the
    code specified in the event handler runs. We use this event handler to run our
    banner rotator as soon as the page has loaded.


    Second, we are going to use JavaScript''s setInterval() function. This function
    allows us to run a JavaScript function repeatedly, with a preset delay between
    successive executions.


    The setInterval() function takes two arguments. The first is the name of the function
    we want to run, the second delay (in milliseconds) between successive executions
    of the function. As an example, the line


    ```

    setInterval(myFunc, 5000);

    ```


    would execute the function myFunc() every five seconds.


    We use setInterval() to rotate the banner image at a regular interval.


    Create a new file named banner.html and enter the code from Listing 23.2.


