- img_proc: true
  md: "# Using jQuery to Implement Ajax\n\nAs you probably now realize, Ajax programming\
    \ from scratch can be a little cumbersome. Fortunately, jQuery solves this for\
    \ you, letting you write Ajax routines in a few lines of code.\n\nThere are a\
    \ number of jQuery methods for performing Ajax calls to the server; the more frequently\
    \ used ones are described here.\n\n# load()\n\nWhen you simply want to grab a\
    \ document from the server and display it in a page element, load() might be all\
    \ you require. The following code snippet gets the file newContent.html and adds\
    \ its content to the element with id=\"elem\"\n\nClick here to view code\n\n```\n\
    $function() {\n  $(\"elem\").load(\"newContent.html\");\n}\n```\n\nA neat trick\
    \ is that you can pass a selector along with the URL, and only get the part of\
    \ the page corresponding to selector:\n\nClick here to view code\n\n```\n$function()\
    \ {\n  $(\"elem\").load(\"newContent.html #info\");\n}\n```\n\nHere you have added\
    \ a jQuery selector after the URL, separated by a space. This causes jQuery to\
    \ pass back only the content of the container specified by the selector; in this\
    \ case, the element with ID of info.\n\nWhen load() gives you too little control,\
    \ jquery offers methods to send GET and POST requests to.\n\n# get() and post()\n\
    \nThe two methods are similar, simply invoking different request types. You don't\
    \ need to select a jQuery object (such as a page element or set of elements);\
    \ instead, you can call get() or post() directly using $.get() or $.post(). In\
    \ its simplest form, the get() or post() method takes a single argument, the target\
    \ URL.\n\nYou'll want to send data to the server using get() or post(). Such data\
    \ is sent as a set of parameter and value pairs in an encoded string."
  merge: -1
  pgno: 308
- img_proc: true
  md: "# Tip\n\nIf you are collecting data from form fields, jQuery offers the handy\
    \ serialize() method that can assemble the form data for you:\n\nClick here to\
    \ view code image\n\n```\nvar formData = $('form1').serialize();\n```\n\nIn most\
    \ cases, you'll want to do something with the returned data. To do that, you pass\
    \ a callback function as your argument:\n\nClick here to view code image\n\n```\n\
    $.get(\"server.php\",\nparam1: \"value1\", param2: \"value2\",\nfunction() {\n\
    \  alert(\"Server responded: \" + data);\n});\n```\n\nThe syntax for post() is\
    \ essentially the same:\n\nClick here to view code image\n\n```\n$.post(\"server.php\"\
    ,\nparam1: \"value1\", param2: \"value2\",\nfunction() {\n  alert(\"Server responded:\
    \ \" + data);\n});\n```\n\n# ajax\n\nFor the ultimate flexibility, the ajax()\
    \ method allows you to set virtually every aspect of the Ajax call and how to\
    \ handle the response. For full details of ajax() see the documentation at http://api.jquery.com/jq/ajax/.\n\
    \n| Try it Yourself: An Ajax Form with jQuery\nLet's round off this with an example\
    \ of a simple Ajax submission powered by jQuery.\nWe'll work with this simple\
    \ HTML form:\nClick here to view code image\n<form id=\"form1\">\nName:<input\
    \ type=\"text\" name=\"name\" id=\"name/><br />\nEmail:<input type=\"text\" name=\"\
    email\" id=\"email/><br />\n<input type=\"submit\" name=\"submit\" id=\"submit\"\
    \ value=\"Submit\">\n</form>\n\nYou're going to use jQuery to carr out the following\
    \ tasks:"
  merge: -1
