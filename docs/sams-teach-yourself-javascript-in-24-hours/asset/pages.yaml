    # Setting Multiple Values in a Single Cookie


    Each cookie contains one name=value pair, so if you need to store several separate
    pieces of data such as a user''s name, age, and membership number, you need three
    different cookies.


    However, with a little ingenuity you can make your cookie store all three values
    by concatenating the required values into a single string, which becomes the value
    stored by your cookie.


    This way, instead of having three separate cookies for name, age, and membership
    number, you could have just one, perhaps named user, containing all three pieces
    of data. To separate the details later, you place in your value string a special
    character called a delimiter to separate the different pieces of data:


    [Click here to view code image]'
