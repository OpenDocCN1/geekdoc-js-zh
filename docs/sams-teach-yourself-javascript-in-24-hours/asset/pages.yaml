  md: "```\nfunction drag(ev) {\n  ev.dataTransfer.setData(\"Text\",ev.target.id);\n\
    }\n```\n\n+   Another function named allowDrop(ev) is executed when the drag passes\
    \ over the intended drop area. All this function must achieve is to prevent the\
    \ drag area's default behavior from taking place (as the default behavior preventing\
    \ dropping):\n\n```\nfunction allowDrop(ev) {\n  ev.preventDefault();\n}\n```\n\
    \n+   Finally, a function named drop(ev) is executed when the dragged item is\
    \ dropped. In this function, the value of the dataTransfer property is read to\
    \ determine the ID of the dragged object; then the default object is appended\
    \ as a child object to the drop area object. Once again, the default operation\
    \ needs to be prevented from taking place:\n\n```\nfunction drop(ev) {\n  var\
    \ data = ev.dataTransfer.getData(\"Text\");\n  ev.target.appendChild(document.getElementById(data));\n\
    \  ev.preventDefault();\n}\n```\n\nThe loaded page should look something like\
