  md: 'from displaying the JavaScript source code on the screen along with the page
    content. Unless you have a reason to support very old browsers, this technique
    is no longer required.


    # JavaScript Statements


    JavaScript programs are lists of individual instructions that we refer to as statements.
    To interpret statements correctly, the browser expects to find each statement
    written on a separate line:


    ```

    this is statement 1

    this is statement 2

    ```


    Alternatively, they can be combined in the same line by terminating each with
    a semicolon:


    Click here to view code image


    this is statement 1; this is statement 2;


    To ease the readability of your code, and to help prevent hard-to-find syntax
    errors, it''s good practice to combine both methods by giving each statement its
    own line and terminating the statement with a semicolon:


    this is statement 1;

    this is statement 2;


    # Commenting Your Code


    Some statements are not intended to be executed by the browser''s interpreter,
    but are there for the benefit of anybody who may be reading the code. We refer
    to such lines as comments, and there are specific rules for adding comments to
    your code.


    A comment that occupies just a single line of code can be written by placing a
    double slash before the content of the line:


    ```

    // This is a comment

    ```


    # Note


    JavaScript can also use the HTML comment syntax for single-line comments:


    ```

    <!-- this is a comment -->

    ```


    However, this is not commonly used in JavaScript programs.'
