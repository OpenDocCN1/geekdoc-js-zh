  md: '# Tip


    You can access the total number of spreadsheets on your page using document.styleSheets.length


    # Enabling, Disabling, and Switching Stylesheets


    Each stylesheet in the array has a property called disabled, containing a value
    of Boolean true or false. This is a read/write property, so we are able to effectively
    switch individual stylesheets on and off in JavaScript:


    Click here to view code image


    ```

    document.styleSheets[0].disabled = true;

    document.styleSheets[1].disabled = false;

    ```


    The preceding code "switches on" the second stylesheet in the page (index 1) while
    "switching off" the first stylesheet (index 0).


