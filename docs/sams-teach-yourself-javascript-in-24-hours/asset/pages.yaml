    # Mozilla’s DOM Inspector


    One of the easiest ways to view node information is by using the DOM Inspector
    available for Firefox. If you use Firefox, you may find the DOM Inspector already
    installed, though since Firefox 3 it''s available as a separate add-on. You can
    download it at https://addons.mozilla.org/en-US/firefox/addon/dom-inspector-6622.


    Once installed, you can open the DOM Inspector for any page in the browser by
    pressing Ctrl+Shift+I. The window that opens is in Figure 9.5, displaying the
    DOM representation of the web page of Listing 9.1.


    ![](img/d69da38ba351b605218073fbb83a1f3e_164_0.png)


    FIGURE 9.5 Mozilla’s DOM Inspector


    A DOM node is selected from the tree structure in the left-hand display pane,
    and details about it can be examined in the right-hand pane. As well as the viewer
    for the DOM tree, other viewers are included for viewing CSS rules, style sheets,
    computed style, JavaScript objects, and more.


    The interface can seem a little daunting at first, but it’s well worth exploring
    the program’s capabilities.'
