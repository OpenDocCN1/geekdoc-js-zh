  md: '# Hour 12. JavaScript and CSS


    What You''ll Learn in This Hour:


    +   - Separating style from content

    - The DOM style property

    - Retrieving styles

    - Setting styles

    - Accessing classes using className

    - The DOM style object

    - Enabling, disabling, and switching stylesheets in JavaScript

    - Changing the mouse cursor


    In the early days of the World Wide Web, pages were all about their text content.
    Early browsers had rudimentary support for graphic effects—some didn''t even support
    images. Styling a web page was largely a matter of using the few style-related
    attributes and tags allowed by the early incarnations of HTML.


    Things improved markedly with the introduction of browser support for Cascading
    Style Sheets (CSS), which allowed the styling of a page to be treated independently
    from its HTML markup.


    Earlier in the book, you learned how to edit the structure of your page using
    JavaScript''s DOM methods. However, JavaScript can also be used to access and
    amend CSS styles for the current page. In this hour you learn how.


    # A Ten-Minute CSS Primer


    If you''ve decided to learn JavaScript there''s a pretty good chance that you''re
    already familiar with CSS styling. Just in case it''s managed to pass you by,
    let''s review the basics.


    # Separating Style from Content


    Before CSS came along, most styling in HTML pages was carried out using HTML tags
    and/or their attributes. To change the color of a piece of text, for example,
    you would have used something like this:


    Click here to view code image'
