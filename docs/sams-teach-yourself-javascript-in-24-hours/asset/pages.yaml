    # CSS3 Backgrounds


    CSS3 contains several new background properties that allow more control of the
    background element.


    In this section you''ll learn about the background-size and background-origin
    properties, as well as how to use multiple background images.


    # The background-size Property


    The background-size property adds a new feature to CSS that allows you to set
    the size of your background images using lengths, percentages, or either of two
    keywords, contain or cover.


    Specifying the background size using lengths and percentages behaves as you might
    expect. For each background image, two lengths or percentages can be supplied,
    relating to the width and height, respectively. (When you use percentages, these
    relate to the space available for the background, not to the width and height
    of the background image )'
