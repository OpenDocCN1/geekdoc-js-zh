    # Summary


    In this hour you learned about some of the capabilities CSS3 brings to web design.
    You saw how different browser manufacturers implement new or experimental CSS3
    features using custom prefixes, and saw how you can access these custom features
    using JavaScript.


    # Q&A


    +   Q. What browsers currently support CSS3 transitions, transforms, and animations?


    +   A. At the time of writing, 2D transforms are available in all popular current
    browsers, while 3D transforms are supported in Safari, Chrome/Chromium, and Firefox.
    Transitions and 3D transforms were added in IE10. Some of these effects degrade
    sensibly, so a user having a browser without support will still be OK, but will
    see the page elements without animation.


    +   Q. Why do several different browsers use the -webkit- prefix?


    +   A. WebKit is a layout engine used for rendering web pages in browsers. The
    webkit engine is the basis of a number of popular browsers, including Safari,
    Chrome/Chromium, and various other browsers for desktop and mobile platforms.


