    # # Summary


    In many instances, writing JavaScript can be made a whole lot easier by using
    libraries. Such libraries wrap many of the commonly used objects and methods into
    more user-friendly forms; no longer do you have to remember cross-browser methods
    to, for example, add or remove an event listener or access form elements. In this
    hour you learned a little about some of the more popular JavaScript libraries.


    # # Q&A


    +   - Q. How do I include a third-party JavaScript library into my pages?

    - A. The process varies slightly from library to library. Usually it''s simply
    a matter of including one or more external .js files into the `<head>` part of
    your web page. See the documentation supplied with your chosen library for specific
    details.

    - Q. Can I use more than one third-party library in the same script?

    - A. Yes, in theory: If the libraries are well written and designed not to interfere
    with each other, there should be no problem combining them. In practice, this
    depends on the libraries you need and how they were written.


