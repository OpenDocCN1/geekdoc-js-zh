  md: "+   ► Check that both input fields contain text.\n\n+   ► Submit the form via\
    \ Ajax using HTTP POST.\n\n+   ► Print the data returned from the server into\
    \ a <div> element on the page.\n\nTo check that both fields have data entered,\
    \ you use a simple function:\n\n![](img/d69da38ba351b605218073fbb83a1f3e_310_0.png)\n\
    \n```\nfunction checkFields(){\n  return ($(\"#name\").val() && $(\"#email\").val());\n\
    }\n```\n\nFor the function to return Boolean true, the value attribute of both\
    \ form must contain some text data; if either is empty, the blank field must be\
    \ interpreted as \"falsy\" and the logical AND (&&) operator will cause false\
    \ to be returned from the function.\n\nNext, apply jQuery's submit() event handler\
    \ to detect form submission. If your function checkFields() returns false, the\
    \ default behavior will be canceled and the form won't be submitted; otherwise,\
    \ jQuery serializes the data and sends a post() to the server script.\n\nThe jQuery\
    \ serialize() method is used to collect the form information into a serialized\
