  md: 'An integer is a whole number—positive, negative, or zero. To put it another
    way, an integer is a numerical value without a fractional part.

    All of the following are valid integers:


    +   * 33

    * -1,000,000

    * 0

    * -1


    # Floating-Point Numbers


    Unlike integers, floating-point numbers have a fractional part, even if that fractional
    part is zero. They can be represented in the traditional way, like 3.14159, or
    in exponential notation, like 35.4e5.


    > Note

    In exponential notation, e represents “times 10 to the power,” so 35.4 can be
    read as 35.4 x 10⁵

    Exponential notation provides a compact way to express numbers from the very large
    to the very small.


    All of the following are valid floating-point numbers:


    +   * 3.0

    * 0.00001

    * -99.99

    * 2.5e12

    * 1e-12


    > Tip

    JavaScript also has the ability to handle hexadecimal numbers.

    Hexadecimal numbers begin with 0x, for instance 0ab0080.


    # Not a Number (NaN)


    NaN is the value returned when your script tries to treat something non-numerical
    as a number, but can’t make any sense of it as a numerical value. For example,
    the result of trying to multiply a string by an integer is not numerical.'
