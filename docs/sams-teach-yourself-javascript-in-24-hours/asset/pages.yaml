  md: '# Appendix A. Tools for JavaScript Development


    JavaScript development doesn’t require any special tools or software other than
    a text editor and a browser.

    Most operating systems come bundled with at least one of each, and in many cases
    these tools will be more than sufficient for you to write your code.

    However, many alternative and additional tools are available, some of which are
    described here.


    > Tip Be sure to check the license terms on the individual websites and/or included
    in the download package.


    # Editors

    The choice of an editor program is a personal thing, and most programmers have
    their favorite. Listed in the following sections are some popular, free editors
    that you can try.


    # Notepad++


    If you develop on the Windows platform, you’re probably already aware of the Notepad
    editor usually bundled with Windows. Notepad++ (http://notepad-plus-plus.org/)
    is a free application that aims to be a powerful replacement, while still being
    light and fast.

    Notepad++ offers line numbering, syntax and brace highlighting, macros, search
    and replace, and a whole lot more.


    # jEdit


    jEdit is a free editor written in Java. It can therefore be installed on any platform
    having a Java virtual machine available, such as Windows, Mac OS X, OS/2, Linux,
    and so on.

    A fully featured editor in its own right, jEdit can also be extended via 200+
    available plugins-ins to be, for example, a complete development environment or
    an advanced XML/HTML editor.

    Download jEdit from www.jedit.org.'
  merge: -1
  pgno: 423
- img_proc: true
  md: '# SciTE


    Initially developed as a demonstrator for the Scintilla editing component, SciTE
    has developed into a complete and useful editor in its own right.

    A free version of SciTE is available for Windows and Linux users via download
    from www.scintilla.org/SciTE.html, while a commercial version is available via
    the Mac Apps Store for Mac OS X users.


    # Geany


    Geany (www.geany.org/) is a capable editor that can also be used as a basic integrated
    development environment (IDE). It was developed to provide a small and fast IDE,
    and can be installed on pretty any platform supported by the GTK toolkit, including
    Windows, Linux, Mac OS X, and FreeBSD.

    Gany is free to download and use under the terms of the GNU General Public License.


    # Validators


    To make your pages work as intended regardless of the user''s browser and operating
    system, it''s always advisable to check your HTML code for correctness and conformance
    to standards.

    A number of online tools and facilities are available to help you, as discussed
    dext.


    # The W3C Validation Services


    The W3C offers an online validator at http://validator.w3.org/ that will check
    the markup validity of web documents in HTML, XML, SMIL, MathML, and other markup
    languages. You can enter the URL of the page to be checked, or cut-and-paste your
    code into the validator.

    CSS can be validated in a similar way at http://jigsaw.w3.org/css-validator/validator.html.en.


    # Web Design Group (WDG)


    WDG also offers an online validation service at www.htmlhelp.com/tools/validator.

    This is similar to the W3C validator, but in some circumstances gives slightly
    more helpful information, such as warnings about valid but dangerous code, or
    highlighting undefined references rather than simply listing them as errors.'
  merge: -1
