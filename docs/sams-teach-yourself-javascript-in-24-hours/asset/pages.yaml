    # Selecting Elements with getElementsByTagName()


    You already know how to access an individual page element using the document object''s
    getElementById() method. Another method of the document object, getElementsByTagName(),
    allows you to build an array populated with all of the occurrences of a particular
    tag.


    Like getElementById(), the getElementsByTagName() method accepts a single argument.
    However, in this case it''s not the element ID but the required tag name that
    is passed to the method as argument.


    # Caution


    Make careful note of the spelling. Elements (plural) is used in getElementsByTagName(),
    whereas Element (singular) is used in getElementById().


    As an example, suppose you wanted to work with all of the <div> elements in a
    particular document. You can populate a variable with an array-like collection
    called myDivs by using


    Click here to view code image


    ```

    var myDivs = document.getElementsByTagName("div");

    ```


