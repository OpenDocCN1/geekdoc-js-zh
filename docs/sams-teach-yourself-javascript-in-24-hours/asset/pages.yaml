  md: '# Hour 16. The jQuery UI User Interface Library


    # What You''ll Learn in This Hour:


    +   * What jQuery UI is all about

    * Using the ThemeRoller

    * How to include jquery UI in your pages

    * Interactions: drag, drop, resize, and sort

    * Using widgets: accordions, date pickers, and tabs


    In the previous hour you learned about to use the jQuery open source JavaScript
    library. In this hour you will see how to use its companion library jQuery UI.
    jQuery UI provides advanced effects and theme-able widgets that help you to build
    interactive web applications.


    # What jQuery UI Is All About


    The jQuery development team decided to launch an “official” collection of plugins
    for jQuery, bringing together a wide range of popular user interface components
    and giving them a common interface style. Using these components you can build
    highly interactive and attractively styled web applications with a minimum of
    code.


    Using jQuery UI in your programs gives you access to


    +   * Interactions—The jQuery UI library provides support for dragging and dropping,
    resizing, selecting, and sorting page elements.

    * Widgets—These are feature-rich controls including accordion, autocomplete, button,
    date picker, progress bar, slider, and tabs.

    * Theme building—Give your site a coherent look-and-feel across all of the user
    interface components. A ThemeRoller tool is available at [http://jqueryui.com/themeroller/](http://jqueryui.com/themeroller/).
    The ThemeRoller online tool allows The ThemeRoller online tool allows you to choose
    a theme from the gallery of prewritten designs or create a custom theme based
    on an existing theme as a starting point.


    In this hour, you will see how to use a selection of the more popular plug-ins.
    Thanks to the consistent user interface of jQuery UI, it will then be easy to
    explore many other available plug-ins by using the jQuery documentation.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# # How to Include jQuery UI in Your Pages


    The first step is to visit the jQuery ThemeRoller online application at http://jqueryui.com/themeroller/.


    # ## Using the ThemeRoller


    The jQuery UI CSS Framework is a set of classes covering a wide range of user
    interfaces. Using the ThemeRoller tool, you can build your own interface styles,
    either from scratch or on any of the extensive collection of examples available
    in the gallery at http://jqueryui.com/themeroller/


    Once you''ve decided on a style, jQuery UI provides a builder that packages only
    the components you need. It also handles any dependencies for your selected items,
    so you can download a widget or interaction without all the ancillary files it
    requires. All you need to do is download and unpack the zip file.


    Once you''ve unpacked the download, you have the following directories:


    ```

    css

    /development-bundle/

    /js/

    ```


    **The development-bundle directory holds the jQuery UI source code, demos, and
    documentation.** If you don''t intend to change any of the jQuery UI code, you
    can safely delete it.


    Generally, you need to include from the remaining files your theme, jQuery, and
    jQuery UI on any page that is to use jQuery widgets and interactions:


    [Click here to view code image](#)


    ```

    <link rel="stylesheet" type="text/css" href="jqueryui.min.css">

    <script src="http://code.jquery.com/jquery-latest.min.js"></script>

    <script

    src="http://codeorigin.jquery.com/ui/1.10.3/jqueryui.min.js">

    </script>

    ```


    If you use one of the standard gallery themes, you can alternatively link to all
    of the files you use on a Content Delivery Network:


    [Click here to view code image](#)


    ```

    <link rel="stylesheet" type="text/css"

    href="http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/smooth/jqueryui.css">

    <script src="http://code.jquery.com/jquery-latest.min.js"></script>

    <script>

    ```'
