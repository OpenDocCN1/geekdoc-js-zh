    \ the whole sequence is enclosed between curly braces to form a JSON object representing\
    \ your data:\n\n```\nvar jsonObject = {\n  \"param1\":\"value1\",\n  \"param2\"\
    :\"value2\",\n  \"param3\":\"value3\"\n}\n```\n\nThe object jsonObject defined\
    \ here uses a subset of standard JavaScript—it's just a little piece of valid\
    \ JavaScript code.\n\nObjects written using JSON notation can have properties\
    \ and methods accessed directly using the usual dot notation:\n\nClick here to\
    \ view code image\n\n```\nalert(jsonObject.param1); // alerts 'value1'\n```\n\n\
    More generally, though, JSON is a general-purpose syntax for exchanging data in\
    \ a string format. Not only objects, but ANY data that can be expressed as a series\
    \ of parameter:value pairs can be expressed in JSON notation. It is then easy\
    \ to convert the JSON object into a string by a process known as serialization;\
    \ serialized data is convenient for storage or transmission around networks. You'll\
    \ see how to serialize a JSON object later in this hour.\n\n# Note\n\nAs a general-purpose\
    \ data exchange syntax, JSON can be used somewhat like XML, though JSON can be\
    \ simpler for humans to read. Also, the parsing of large XML files can be a slow\
    \ process, whereas JSON gives your script a JavaScript object, ready to use.\n\
    \nJSON has gathered momentum recently because it offers several important advantages.\
    \ JSON is\n\n+   * Easy to read for people and computers\n* Simple in concept—a\
    \ JSON object is nothing more than a series of parameter :value pairs enclosed\
    \ by curly braces\n* Largely self-documenting\n* Fast to create and parse\n* A\
    \ subset of JavaScript, meaning that no special interpreters or other additional\
    \ packages are necessary"
