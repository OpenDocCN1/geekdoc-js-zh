    # Conditional Statements


    Conditional statements, as the name implies, are used to detect particular conditions
    arising in the values of the variables you are using in your script. JavaScript
    supports various such conditional statements, as outlined in the following sections.


    # The if () Statement


    In the previous hour we discussed Boolean variables, which we saw could take one
    of only two values—true or false.

    JavaScript has several ways to test such values, the simplest of which is the
    if statement. It has the following general form:


    Click here to view code image


    ```

    if(this condition is true) then this;

    ```


    Let''s look at a trivial example:


    Click here to view code image


    ```

    var message = "";

    var bool = true;

    if(bool) message = "The test condition evaluated to TRUE";

    ```'
