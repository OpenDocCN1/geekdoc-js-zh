    # # Summary


    In this hour you learned a number of ways in which JavaScript can be put to work
    on the CSS sheets of your page. You learned how to use the style property of page
    elements, how to work with CSS classes, and how to manipulate entire stylesheets.


    # ## Q&A


    +   **Q. Is it possible for JavaScript to work with individual CSS style rules?**
    Yes it is, but at the time of writing this does not work very well cross-browser.
    Mozilla browsers support the cssRules array, while Internet Explorer calls the
    equivalent array Rules. There is also considerable difference between browsers
    in how the notion of a “rule” is interpreted. It’s to be hoped that future browser
    versions will resolve these differences.

