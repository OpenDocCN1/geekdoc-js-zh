    ```

    var myUser = getCookie("user");

    var myArray = myUser.split(''|'');

    var name = myArray[0];

    var age = myArray[1];

    var memno = myArray[2];

    ```


    Cookies that store multiple values use fewer of the 20 cookies per domain allowed
    by some browsers, remember that your use of cookies is still subject to the 4KB
    overall limit for cookie information.


    # Note


    This is a further example of serialization, which you learned in Hour 10, "Meet
    JSON."


    # Summary


    In this hour you learned about cookies, and how to set, retrieve, and delete them
    using JavaScript. You also learned how to concatenate multiple values into a single
    cookie.


    # Q&A


    +   Q. When concatenating multiple values into a single cookie, you can use any
    character as a delimiter?


    +   A. You can''t use any character that might appear in your escaped data (except
    the delimiter character), nor can you use equals (=) or the semicolon (;) as these
    are used to assemble and concatenate the name=value pairs in document.cookie.
    Additionally, cookies may not include whitespace or commas, so naturally they
    cannot be used as delimiters either.


    +   Q. Are cookies safe?


    +   A. Questions are often raised over the security of cookies, but such fears
    are largely unfounded. Cookies can help website owners and advertisers track your
    browsing habits, and they can (and do) use such information to select'
