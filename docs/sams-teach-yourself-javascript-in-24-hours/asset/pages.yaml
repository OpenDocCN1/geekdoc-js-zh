    Of course, if you place jQuery in another directory, you''ll have to change the
    SRC (relative or absolute) path in the value you give to the SRC attribute to
    reflect the location of the file.


    # Note


    The actual filename depends on the version you download. At the time of writing,
    1.11.2 is the current release.


    # Use a Remote Version


    Instead of downloading and hosting jQuery yourself, you can include it from a
    so-called Content Delivery Network, or CDN. In addition to saving you from having
    to download the jQuery library, using a CDN version has a further advantage: It''s
    quite likely that users visit your page and their browser requests jQuery, it''ll
    already be in their browser cache. Additionally, CDNs generally ensure that they
    serve the file from the server geographically closest to them, cutting the loading
    time.


    The official jQuery site lists the following CDNs:


    +   - Google Ajax API CDN—http://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js


    +   - Microsoft CDN—http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.11.2.min.js


    +   - jQuery CDN—http://code.jquery.com/jquery-1.11.2.min.js (Minified version),
    http://code.jquery.com/jquery-1.11.2.js (Source version) You can modify your <script>
    tag to set the chosen CDN, for example:


    Click here to view code image


    ```

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    Unless you have a particular reason for hosting yourself, this is usually the
    best way.

    ```


    # Tip


    If you want to make sure your code is always using the latest release of jQuery,
    simply link to http://code.jquery.com/jquery-latest.min.js.


