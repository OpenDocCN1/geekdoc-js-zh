  md: "The amount of comments in your code can be greatly reduced by making the code\
    \ self-commenting as possible. You can go some way toward this by choosing meaningful-readable\
    \ names for methods and properties. JavaScript has rules about the characters\
    \ allowed in the names of methods (or functions) and properties (or variables),\
    \ but there's still plenty of scope to be creative and concise.\n\nA popular convention\
    \ is to put the names of constants into all uppercase:\n\n```\nMONTHS_PER_YEAR\
    \ = 12;\n```\n\nFor regular function, method, and variable names, so-called CamelCase\
    \ is a popular option; names constructed from multiple words are concatenated\
    \ with each word except the first. The first letter can be upper- or lowercase:\n\
    \n```\nvar memberSurname = \"Smith\"\nvar lastGroupProcessed = 16;\n```\n\nIt's\
    \ recommended to constructor functions for instantiating objects the first character\
    \ capitalized:\n\nClick here to view code image\n\n```\nfunction Car(make, model,\
    \ color) {\n    .... statements\n}\n```\n\nThe capitalization provides a reminder\
    \ that the new keyword needs to be used:\n\nClick here to view code image\n\n\
    ```\nvar herbie = new Car('VW', 'Beetle', 'white');\n```\n\n# Reuse Code Where\
    \ You Can\n\nGenerally, the more you can modularize your code, the better. Take\
    \ a look at this function:\n\nClick here to view code image\n\n```\nfunction getElementArea()\
    \ {\n    var high = document.getElementById(\"id1\").style.height;\n    var wide\
