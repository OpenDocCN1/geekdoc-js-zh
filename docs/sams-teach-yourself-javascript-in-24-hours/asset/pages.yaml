  md: '# Hour 14. Using Libraries


    What You''ll Learn in This Hour:


    +   - Why using a library can be a good idea

    - The sorts of things libraries can help you do

    - Library extensions from the user community

    - Introducing some popular libraries

    - A quick overview of prototype.js


    Libraries are reusable collections of JavaScript code that let you do complicated
    things by adding only a few lines of extra code to your program.


    There are many freely JavaScript libraries that can help you quickly develop capable,
    cross-browser applications.


    Several of the more popular libraries are introduced in this hour.


    # Why Use a Library?


    You''ll often see opinions expressed, mainly on the Internet, by JavaScript developers
    who strongly advocate writing your code instead of using one of the many available
    libraries. Popular objections include


    +   - You won''t ever know how the code works because you''re simply employing
    someone''s algorithms and functions.

    - JavaScript libraries contain a lot of code you''ll never use but that your users
    have to download away.


    Like many aspects of software development, these are matters of opinion. Personally,
    I believe there are some very good reasons for using libraries sometimes:


    +   - Why invent code that somebody has already written? Popular JavaScript libraries
    tend to contain the sorts of abstractions that programmers need often—which means
    you''ll likely need those functions too from time to time. The thousands of downloads
    and pages of online comment generated by the most-used pretty much guarantee that
    the code they contain will be more thoroughly tested and debugged than your own,
    home-cooked code would be.'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'Take inspiration from other coders. There are some really clever programmers
    out there; take their work and use it to improve your own.


    Using a well-written library can really take away some of the headaches of writing
    cross-browser JavaScript. You won''t have every browser always at your disposal,
    but you rely on the library writers—and their communities of users—test on every
    leading browser.


    Download size for most libraries is not horrific. For the few occasions where
    you need the shortest of download times, compressed versions are available for
    most of the popular libraries that you can use in your “production” websites.
    There''s also the possibility of examining the library code and extracting just
    the parts you need.


    # What Sorts of Things Can Libraries Do?


    The specs differ depending on the library concerned and the needs and intentions
    of its creator. However, there are certain recurring themes that most libraries
    include:


    +   Encapsulation of DOM methods—As you see later in this hour you look at prototype.js,
    JavaScript libraries can offer appealing shorthand ways to select and manage page
    elements and groups of elements.


    +   Animation—In Hour 7, “Program Control,” you learned about the use of timers.
    Timers can be used to animate page elements, but writing code can be tricky and
    the resulting code complicated to maintain. Many of the popular libraries wrap
    these sorts of operations into convenient functions to slide, fade, shake, squish,
    fold, snap, and pulsate parts of your page’s interface, all in a cross-browser
    way and just a few lines of code.


    +   Drag and drop—A truly cross-browser drag and drop has always been one of the
    trickiest effects to code for all browsers. Libraries can make it easy.


    +   Ajax—Easy methods to update page content without needing to worry about the
    nitty-gritty of instantiating XMLHttpRequest objects and managing callbacks and
    status codes.


    # Some Popular Libraries


    New libraries are popping up all the time; others have seen continual development
    over a number of years. This is no means a complete list; it simply attempts to
    point out some of the more popular current players.'
  merge: -1
  pgno: 260
