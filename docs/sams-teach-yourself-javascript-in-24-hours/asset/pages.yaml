    #  Summary


    In this hour you learned how to build slick user interfaces using the jQuery UI
    library in addition to jQuery. You saw how to quickly add interactions and widgets
    to your pages, and how to set an overall style for your interface items using
    the ThemeRoller application.


    #  Q&A


    +   Q. Can I further customize these interface elements?


    +   A. Yes you can. Due to the limited space in this book, each of the interactions
    and widgets demonstrated in this hour used the default settings. In reality, each
    has a host of customization options to make it work how you want. You''ll find
    extensive documentation and examples at http://docs.jquery.com/UI/.


    +   Q. How can I make the other elements on my page have the same styles as those
    generated by jQuery UI?


    +   A. When jQuery UI generates markup, it applies classes to the newly created
    markup items. These classes correspond to CSS declarations in the jQuery UI CSS
    Framework. Full details for each widget are given in the jQuery UI documentation.'
