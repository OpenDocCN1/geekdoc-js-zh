    <h1>The Extremadura Region of Western Spain</h1>

    <h2>Geography of the Region</h2></h2>

    <p>The autonomous community of Extremadura is in western Spain alongside the Portuguese
    border. It borders the Spanish regions of Castilla y Leon, Castilla La Marcha
    and Andalusia as well as Portugal (to the West). Covering over 40,000 square kilometers
    it has two provinces: Cáceres in the North and Badajoz in the South.</p>

    <h2>Where to Stay</h2>

    <p>There is a wide range of accommodation throughout Extremadura including small
    inns and guest houses ''Hortaleza'' or think about renting a ''casa rural'' (country
    house) if you are traveling in a group.</p>

    <h2>Climate</h2>

    <p>Generally Mediterranean, except for the north, where it is continental. Generally
    known for its extremes, including very hot and dry summers with frequent droughts
    and long and mild winters.</p>

    <h2>What To See</h2>

    <p>Extremadura hosts major events all year including theater, music, cinema, literature
    and folklore. Spectacular venues include medieval town squares and historic centers.
    There are special summer theater festivals in Mérida, Cáceres, Alcantara and Alburquerque.</p>

    <h2>Gastronomy</h2>

    <p>The quality of Extremadura food arises from the fine quality of the local ingredients.
    In addition to free-range lamb and beef, fabulous cheeses, red and white wines,
    olive oil, honey and paprika, Extremadura is particularly renowned for Iberian
    ham. The ''p negra'' (blackfoot) pigs are fed on acorns in the cork-oak forests,
    the key to producing the world''s best ham and cured sausages..</p>

    </body>

