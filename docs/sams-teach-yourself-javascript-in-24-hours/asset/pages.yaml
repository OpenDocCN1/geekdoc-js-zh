  md: '# Comparison Operators


    | == | (Equality operator) Returns true if the two operands are equal to each
    other. |

    | != | (Not-equal-to) Returns true if the two operands are not equal to each other.
    |

    | === | (Strict equality) Returns true if the two operands are both equal and
    of the same type. |

    | !== | (Strict not-equal-to) Returns true if the two operands are either not
    equal and/or not of the same type. |

    | > | (Greater-than) Returns true if the first operand''s value is greater than
    the second operand''s value. |

    | >= | (Greater-than-or-equal) Returns true if the first operand''s value is greater
    than or equal to the second operand''s value. |

    | < | (Less-than) Returns true if the first operand''s value is less than the
    second operand''s value. |

    | <= | (Less-than-or-equal) Returns true if the first operand''s value is less
    than or equal to the second operand''s value. |


    # Special Operators


    | ?: | (Conditional operator) Executes an ''if...else'' test. |

    | , | (Comma operator) Evaluates two expressions and returns the result of evaluating
    the second expression. |

    | delete | (Deletion) Deletes an object and removes it from memory, or deletes
    an object''s property, or deletes an element in an array. |

    | function | Creates an anonymous function. |

    | in | Returns true if the property you''re testing is supported by a specific
    object. |

    | instanceof | Returns true if the given object is an instance of the specified
    type. |

    | new | Creates a new object from the specified object type. |

    | typeof | Returns the name of the type of the operand. |

    | void | Allows evaluation of an expression without returning a value. |


    # TABLE B.1 The JavaScript Operators'
