    # # Date Picker


    Expecting visitors to correctly fill out date fields has always has been a tricky
    business, mainly due to the wide range of possible date formats that may be used.


    A date picker is a pop-up calendar widget that allows the user to simply click
    on the required day, leaving the widget to format the selected date and enter
    the appropriate data into the correct input field.


    Suppose you have a form field to accept a date:


    Click here to view code image


    ```

    <input type="text" id="datepicker">

    ```


    You can implement a date picker widget for that field with a single line of code:


    Click here to view code image


    ```

    $(\#datepicker).datepicker();

    ```


    Listing 16.5 has a complete example you can try.'
