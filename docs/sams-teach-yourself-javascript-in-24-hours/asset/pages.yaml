    # Using the location Object


    The location object contains information about the URL of the currently loaded
    page.


    We can think of the page URL as a series of parts:

    [protocol]//[hostname]:[port]/[pathname][search][hash]


    Here''s an example URL: http://www.example.com:8080/tools/display.php?

    section=435#list


    The list of properties of the location object includes data concerning the various
    parts of the URL. The properties are listed in Table 4.1.


    | Property | Description |

    | --- | --- |

    | location.href | ''http://www.example.com:8080/tools/display.php?section=435#list''
    |

    | location.protocol | ''http:'' |

    | location.host | ''www.example.com:8080'' |

    | location.hostname | ''www.example.com'' |

    | location.port | ''8080'' |

    | location.pathname | ''/tools/display.php'' |

    | location.search | ''?section=435'' |

    | location.hash | ''#list'' |


    # TABLE 4.1 Properties of the location Object


