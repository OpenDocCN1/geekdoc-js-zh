  md: 'There is a handy shorthand for selecting the first and last elements in the
    childNodes array.


    firstChild is, surprisingly, the first element in the childNodes array. Using
    firstChild is equivalent to using childNodes[0].


    To access the last element in the collection, you gain a big advantage by using
    last. To access this element you would otherwise have to do something like this:


    Click here to view code image


    ```

    var lastChildNode = myElement.childNodes[myElement.childNodes.length - 1];

    ```


    That''s pretty ugly. Instead, you can simply use


    Click here to view code image


    ```

    var lastChildNode = myElement.lastChild;

    ```


    # the parentNode Property


    The parentNode property, unsurprisingly, returns the parent node of the node to
    which it''s applied. In the previous example, you used


    Click here to view code image


    ```

    var lastChildNode = myElement.lastChild;

    ```


    Using parentNode you can go one step back up the tree. The line


    Click here to view code image


    ```

    var parentElement = lastChildNode.parentNode;

    ```


    would return the parent element of lastChildNode, which is, of course, the object
    myElement.


    # nextSibling and previousSibling


    Sibling nodes are nodes that share a parent node. When applied to a specified
    parent node, these read-only properties return the next and previous sibling nodes,
    respectively, or null if there is no such node.


    Click here to view code image


    ```

    var oElement = document.getElementById("toDoList");

    var firstOne = oElement.firstChild;

    var nextOne = firstOne.nextSibling;

    ```'
