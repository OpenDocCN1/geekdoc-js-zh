  md: 'To add a multiline comment in this way, we need to prefix every line of the
    comment:


    ```

    // This is a comment

    // spanning multiple lines

    ```


    A more convenient way of entering multiline comments to your code is to prefix
    your comment with /* and terminate it with /. A comment written using this syntax
    can span multiline lines:


    ```

    /* This comment can span

    multiple lines

    without needing

    to mark up every line */

    ```


    Adding comments to your code is a good thing to do, especially when you''re writing
    larger or more complex JavaScript applications. Comments act as reminders to you,
    and also as instructions and explanations to anybody else reading your code at
    a later date.


    # Note


    It''s true that comments add a little to the size of your JavaScript source file,
    and this can have an adverse effect on page-loading times. Generally the difference
    is so small as to be barely noticeable, but if it matters you can always strip
    out all the comments from a “production” version of your JavaScript file—that
    is, a version to use with live, rather than development, websites.


