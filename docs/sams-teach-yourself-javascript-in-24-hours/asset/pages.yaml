    \ procedure has completed its execution, such as an external file being loaded\n\
    \n# Using try and catch\n\nA useful way to intercept potential errors and deal\
    \ with them cleanly is using the try and catch statements.\n\nThe try statement\
    \ allows you to attempt to run a piece of code. If the code runs without errors,\
    \ all is well; however, should an error occur you can use the catch statement\
    \ to intervene before an error message is sent to the user, and determine what\
    \ the program should do about the error.\n\n```\ntry {\n  doSomething();\n} catch(err)\
    \ {\n  doSomethingElse();\n}\n```\n\nNote the syntax:\n\n```\ncatch(identifier)\n\
    ```\n\nHere identifier is an object created when an error is caught. It contains\
    \ information about the error; for instance, if you wanted to alert the user to\
    \ the nature of a JavaScript runtime error, you could use a construct like\n\n\
    ```\ncatch(err) {\n  alert(err.description);\n}\n```\n\nto open a dialog containing\
