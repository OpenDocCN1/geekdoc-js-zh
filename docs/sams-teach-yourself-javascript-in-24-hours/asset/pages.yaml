    - Using jQuery for Ajax applications


    Many JavaScript libraries are available, but jQuery is arguably the most popular
    and also the most extensible. A huge number of developers contribute source plug-ins
    for jQuery, and you can find a plug-in for almost any application you might have.
    The wide range of plug-ins and the simple syntax make jQuery a great library.
    In this hour you learn the basics of jQuery and get a taste of how powerful it
    is.


    # Including jQuery in Your Pages


    Before you use jQuery, you need to include it in your pages. There are two main
    options, as detailed in the following sections.


    # Download jQuery


    You can download jQuery from the official website at http://docs.jquery.com/Downloading_jQuery,
    where you find both Compressed and Uncompressed versions of the code. The Compressed
    version is for your live pages, as it has been compressed to the smallest possible
    file size to download as quickly as possible.


    For development purposes, choose the Uncompressed version. Thanks to the well-formatted,
    commented source, you can read the jQuery code to see how it works.


    You need to include the jQuery library in the <head> section of your pages, using
    a <script> tag. The easiest way is to place the downloaded jquery.js file in the
    same directory as from where where you want to use it and reference it like this:
    Click here to view code image'
