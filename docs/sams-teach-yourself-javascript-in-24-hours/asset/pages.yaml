    # Using eval()


    Only recent browsers have native support for JSON syntax (we talk about using
    native browser support in just a moment). However, since JSON syntax is a subset
    of JavaScript, the JavaScript function eval() can be used to convert a JSON string
    into a JavaScript object.


    # Note


    The JavaScript eval() function evaluates executes whatever is passed as an argument.
    If the argument is an expression, eval() evaluates the expression; for example,


    ```

    var x = eval(4 * 3); // x=12

    ```


    If the argument comprises one or more JavaScript statements, eval() executes those
    statements:


    Click here to view code image


    ```

    eval("a=1; b=2; document.write(a+b);"); // writes 3 to the page

    ```


    The eval() function uses the JavaScript interpreter to parse the JSON text and
    produce a JavaScript object:


