  md: '# The window and document Objects


    Each time your browser loads and displays a page, it creates in memory an internal
    representation of the page and all its elements, the DOM. In the DOM, elements
    of your web page have a logical, hierarchical structure, like a tree of interconnected
    parent and child objects. These objects, and their interconnections, form a conceptual
    model of the web page and the browser that contains and displays it. Each object
    also has a list of properties that describe it, and a number of methods we can
    use to manipulate properties using JavaScript.


    Right at the top of the hierarchical tree is the browser window object. This object
    is a parent or ancestor to everything else in the DOM representation of your page.


    The window object has various child objects, some of which are visualized in Figure
    1.1. The first child object shown in Figure 1.1, and the one we''ll use in this
    book, is the document object. Any HTML page loaded into the browser creates a
    document object containing all the HTML and other resources that go into making
    up the displayed page. All of this information is accessible via JavaScript as
    a parent-child hierarchy of objects, each with its properties and methods.


    ![](img/d69da38ba351b605218073fbb83a1f3e_32_0.png)


    FIGURE 1.1 The window object and some of its children


    The other children of the window object visible in Figure 1.1 are the location
    object (containing details of the URL of the currently loaded page), the history
    object (containing details of the browser''s previously visited pages), and the
    navigator object (stores details of the browser type, version, and capabilities).
    We look in detail at these objects in Hour 4, "DOM Objects and Built-In Objects,"
    and use them again at intervals throughout the book, but for now let''s concentrate
    on the document object.


    # Object Notation'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'The notation we use to represent objects within the tree uses the dot or period:


    parent.child


    As an example, referring to Figure 1.1, the location object is a child of the
    window object, so in in the DOM it is referred to like this:


    ```

    window.location

    ```


    # Tip


    This notation can be extended as many times as necessary to represent any object
    in the tree. For example


    ```

    object1.object2.object3

    ```


    represents object3, whose parent is object2, which is itself a child of object1.


    The <body> section of your HTML page is represented in the DOM as a child element
    of the document object; we would access it like this:


    ```

    window.document.body

    ```


    The last item in the sequence can also be, instead of another object, a property
    or method of the parent object:


    ```

    object1.object2.property

    object1.object2.method

    ```


    For example, let''s suppose that we want to access the title property of the current
    document, as specified by the HTML <title>...</title> tags. We can simply use


    ```

    window.document.title

    ```


    # Note


    Don''t worry if object hierarchy and dot notation don''t seem too clear right
    now. You''ll be seeing many examples in the course of the book!


    # Tip


    The window object always contains the current browser window, so you can refer
    to window.document to access the current document. As a'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'shortcut, you can simply use document instead of

    window.document—this also refers to the current document.


    If you have several windows open, or if you are using a frameset, there

    will be a separate window and document object for each window or

    frame. To refer to one of these documents, you need to use the relevant

    window name and document name belonging to the window or frame in

    question.


    # Talking to the User


    Let''s take a look at some of the methods associated with the window and

    document objects. We begin with two methods, each of which provides a

    means to talk to the user.


    # window.alert()


    Even if you don''t realize it, you''ve seen the results of the window object''s

    alert on many occasions. The window object, you''ll recall, is at the

    top of the DOM hierarchy, and represents the browser window that''s displaying

    your page. When you call the alert() method, the browser pops open a dialog

    displaying your message, along with an OK button. Here''s an example:


    Click here to view code image


    ```

    <script>window.alert("Here is my message");</script>

    ```


    This is our first working example of the dot notation. Here we are calling the

    alert() method of the window object, so our object.method notation

    becomes window.alert.


    # Tip


    In practice, you can leave out the window. part of the statement.

    Because the window object is the top of the DOM hierarchy (it''s

    sometimes referred to as the global object), any methods called without

    direct reference to their parent object are assumed to belong to window.

    So


    Click here to view code image


    ```

    <script>alert("Here is my message");</script>

    ```


    works just as well.'
