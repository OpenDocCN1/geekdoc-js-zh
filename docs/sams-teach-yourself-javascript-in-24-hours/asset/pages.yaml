- img_proc: true
  md: 'Applications written in a procedural manner are hard to test. However, if you
    write your code with testing in mind, you''ll not only make it easier to write
    those tests, but also write code that''s so much easier to read, maintain, and
    extend.


    In the next section I''ll round up a few coding techniques that will make your
    code easier to test.


    # Refactoring Code


    The process of reorganizing your JavaScript code into a different form, but without
    modifying its operation, is known as refactoring. Refactoring is a great method
    of improving the design of a program, as it generally separating the program logic
    from the user interaction and display elements.


    Where your code is based around a library such as jQuery and/or a framework such
    as Angular, so that discipline might already have been imposed on your code. Where
    JavaScript has been written from scratch, there''s more likelihood that a lot
    of refactoring will be needed. This is especially true where code has been initially
    written with little or no concern for separating HTML and program logic—for instance,
    where inline event handlers have been used.


    Here are a few of the things you can do to make your code easier to test.


    # Externalize Scripts


    JavaScript code collected into external files and later linked into your application
    is generally easier to test. In an ideal case, the same JavaScript file to be
    included in your production application can simply be linked into your test harness
    instead in order to have the tests performed.


    # Keep Functions and Methods Simple


    The more you try to do with a single procedure, the more complex and numerous
    your tests will have to be, and the more difficult it may be to untangle that
    function from the code around in order to test it.


    # The QUnit Test Suite


    The previous example shows that you can run unit tests without a huge amount of
    code. However, for more than a few tests it''s much more productive to use a purpose-designed
    unit testing framework providing more advanced tools for writing and running your
    tests. In this section we''ll look at one such framework, QUnit.'
  merge: -1
  pgno: 415
- img_proc: true
  md: 'QUnit is a powerful, open source JavaScript unit testing framework. It''s written
    by members of the jQuery team, and is used in the jQuery, jQuery UI, and jQuery
    Mobile projects. However, QUnit is capable of testing any regular JavaScript code.


    # Installing QUnit


    QUnit is a self-contained library, needing only one JavaScript file (qunit.js)
    and one CSS file (qunit.css), both of which you can download from the QUnit website.
    Alternatively, you can use versions that are hosted on a CDN, as in these examples.


    # A Minimal QUnit Setup


    Once again, your test setup will be a simple HTML page, as shown in Listing 24.2.
    This time, QUnit is included from a CDN.


    # LISTING 24.2 Code for QUnit Test Suite


    Click here to view code image


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Hello QUnit Example</title>

    <link rel="stylesheet" href="http://code.jquery.com/qunit/qunit-1.16.0.css">

    </head>

    <body>

    <div id="qunit"></div>

    <div id="qunit-fixture"></div>

    <script src="http://code.jquery.com/qunit/qunit-1.16.0.js"></script>

    <script src="tests.js"></script>

    </body>

    </html>

    ```


    Note the layout of this file, and how similar it is to our manual test suite used
    in the previous section. There are a few differences, however:


    +   * Instead of logging information to the console, QUnit outputs formatted results
    into the <div> ID #qunit.


    +   * The #qunit-fixture element is required in instances where you need to set
    up a so-called mock DOM of elements that are used during testing, usually things
    like form elements. The mock DOM is reset after every unit'
