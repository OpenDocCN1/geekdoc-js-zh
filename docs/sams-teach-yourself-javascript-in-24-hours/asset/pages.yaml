  md: 'This is the simplest way to create a new Date object containing information
    about the date and time:


    ```

    var mydate = new Date();

    ```


    The variable mydate is an object containing information about the date and time
    at the moment the object was created. JavaScript has a long list of methods for
    retrieving, setting, and editing data within Date objects. Let''s look at a few
    simple examples:


    [Click here to view code image]


    ```

    var year = mydate.getFullYear(); // four-digit year e.g. 2012

    var month = mydate.getMonth(); // month number 0 - 11; 0 is January,

    etc.

    var date = mydate.getDate(); // day of the month 1 - 31

    var day = mydate.getDay(); // day of the week 0 - 6; Sunday = 0,

    etc.

    var hours = mydate.getHours(); // hours of the time, 0 - 23

    var minutes = mydate.getMinutes(); // minutes of the time, 0 - 59

    var seconds = mydate.getSeconds(); // seconds of time, 0 - 59

    ```


    # Creating a Date Object with a Given Date and Time


    We can easily create Date objects representing arbitrary dates and times by passing
    arguments to the Date( ) statement. There are several ways to do this:


    [Click here to view code image]


