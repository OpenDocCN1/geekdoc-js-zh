  md: 'Where they exist, text nodes are always contained within element nodes. However,
    not every element node contains a text node.


    There are a number of other node types, representing such information as each
    element''s attributes, HTML comments, and other information relevant to the page.
    Many node types can, of course, contain other nodes as children. Each different
    type of node has an associated number known as its node property. The node properties
    for the various types of nodes are listed in Table 9.1.


    | nodeType | Type of Node |

    |---|---|

    | 1 | element |

    | 2 | attribute |

    | 3 | text (including whitespace) |

