  md: '# Hour 22. Good Coding Practice


    # What You''ll Learn in This Hour:


    +   - How to avoid overuse of JavaScript

    - Writing readable and maintainable code

    - About graceful degradation

    - About progressive enhancement

    - How to separate style, content, and code

    - Writing unobtrusive JavaScript

    - Using feature detection

    - Avoiding inline code such as event handlers

    - How to handle errors well


    JavaScript has gained an unfortunate reputation in certain circles. Since its
    main goal as a scripting language was to add functionality to web page designs,
    accessibility for first-time programmers has always been an important aspect of
    the language. Unfortunately, that has often led to poorly written code being allowed
    into web pages, leading to frustration for more software-savvy users. Throughout
    the book so far I''ve made reference to aspects of coding that are good and bad.
    In this hour we will all together to form some general guidelines for good coding
    practice.


    # Don’t Overuse JavaScript


    How much JavaScript do you need? There’s often a temptation to include JavaScript
    code and enhanced interaction where it’s not strictly necessary or advisable.


    +   - It’s important to remember that your users are likely to spend most of their
    Internet time on sites other than yours. Experienced Internet users are accustomed
    to popular interface components such as menus, breadcrumb trails, and tabbed browsing.
    These elements are popular, in general, because they work well, can be made to
    look good, and don’t require the user to read a manual first. Is familiarity with
    a site’s operation likely to increase a user’s productivity more than the potential
    benefits of your all-new whiz-bang design?'
  merge: -1
  pgno: 373
- img_proc: true
  md: '+   Many of the visual effects that once needed to be coded in JavaScript can
    now be achieved perfectly well using CSS. Where both approaches are possible (image
    rollovers and some types of menus immediately to mind), CSS is usually well supported
    across browsers (despite a few variations) and isn''t as commonly turned off by
    the user. In the rare case that CSS isn''t supported, the page is rendered as
    standard HTML, leaving a page''s at least perfectly functional, even if it''s
    not pretty.


    +   Users in many areas of the world are still using outdated, overpowered, hand-me-down
    computers and may also have slow and/or unreliable Internet access. The CPU cycles
    taken up by your unnecessary code may be precious to them.


    +   In some cases you might cost yourself a degree of search engine page rank,
    since their spiders don''t always correctly index content that''s been generated
    by JavaScript, or designs that require it for navigation.


    Used carefully and with foresight, JavaScript can be a great tool, but sometimes
    it can have too much of a good thing.


    # Writing Readable and Maintainable Code


    There is no way of knowing who will one day need to read and understand the code.
    Even if that person is you, several years and many projects may have intervened;
    the code that is so familiar to you at the time of writing can seemifying further
    down the line. If somebody else has to interpret your code, they may not share
    your coding style, naming conventions, or areas of expertise, and you may not
    be available to help them out.


    # Use Comments Sensibly


    Well-chosen comments at critical places in your code can make all the difference
    in such situations. Comments are your notes and pointers for those who come later.
    The trick is in deciding what comments are likely to be helpful. The subject has
    often raised debate, and opinions vary widely, so what follows is largely my opinion.


    It''s perhaps reasonable to assume that the person who ends up reading your code
    has an understanding of JavaScript, so a commentary on the way the language itself
    works is going too far; JavaScript developers may vary widely in their styles
    and abilities, but the one thing we do share is the language syntax!


    Harder to interpret when reading code are the thought processes and algorithms'
