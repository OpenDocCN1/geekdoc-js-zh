    # Drawing on the Page with <canvas>


    The new <canvas> tag gives you just that: a rectangular space in your page where
    you can draw shapes and graphics, as well as load and display image files and
    control their display via JavaScript. The many practical uses for the element
    include dynamic charts, JavaScript/HTML games, and instructional animations.


    Using the <canvas> tag allows you to define a region by setting its width and
    height parameters; everything else related to creating the graphical content done
    via JavaScript. There is an extensive set of drawing methods known as the Canvas
    2D API.


    > Try it Yourself: Moving a Ball Using <canvas>


    You''re going to make a simple animation in a <canvas> element—just a red disc
    (to represent a ball) moving in a circle on the page.

