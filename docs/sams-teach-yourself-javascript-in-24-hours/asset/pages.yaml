    # Summary


    In this hour you learned about DOM nodes and how to navigate the DOM using a variety
    of node-related methods. You also learned about using Mozilla’s DOM Inspector
    to examine the DOM of your page.


    In addition, you learned how to create new nodes to add to the DOM, and how to
    edit page content dynamically by adding, editing, and removing nodes.


    # Q&A


    Q. Is there a quick way to determine whether a node has any child nodes?


    +   A. Yes, you can use the hasChildNodes() method. This method returns a Boolean
    value of true if the node has one or more nodes, and false if not. Remember that
    attribute nodes and text nodes cannot be child nodes, so the method will always
    return false if applied to these types'
