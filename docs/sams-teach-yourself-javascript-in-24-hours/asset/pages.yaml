  md: '![](img/d69da38ba351b605218073fbb83a1f3e_210_0.png)


    # # Drag and Drop


    Drag and drop is a part of the HTML5 standard. Just about any element can be made
    draggable.


    To make an element draggable, all that''s required is to set its draggable attribute
    to true:


    ```

    <img draggable="true" />

    ```


    Dragging something, though, isn''t much much use by itself. To employ a draggable
    object to achieve something useful, you''re probably going to want to be able
    to drop it somewhere.


    To define an object can be dropped, and control the dragging and dropping process,
    you need to write event listeners to detect and control the various parts of the
    drag-and-drop process.


    There are a few different events you can utilize to control your drag and drop:


    +   - dragstart


    +   - drag'
