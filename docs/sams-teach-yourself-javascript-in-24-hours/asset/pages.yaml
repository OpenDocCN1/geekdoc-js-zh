  md: "# Playing Sound with the <audio> Tag\n\nPretty much everything previously stated\
    \ about the <video> tag applies equally well to the <audio> tag. The simple way\
    \ to use the <audio> tag is like this:\n\nClick here to view code image\n\n```\n\
    <audio src=\"song.mp3\"></audio>\n```\n\nYou can add further attributes to achieve\
