  md: "+   - dragenter\n- dragleave\n- dragover\n- drop\n- dragend\n\nTo control your\
    \ drag and drop, you need to define a source element (where the drag starts),\
    \ the data payload (what it you’re dragging), and a drop target (an area to catch\
    \ the dropped item).\n\n# Tip\n\nNot all items can be drop targets—an <img>, for\
    \ example, cannot accept drops.\n\nThe dataTransfer property contains a piece\
    \ of data sent in a drag action. The value of dataTransfer is usually set in the\
    \ dragstart event and read/handled in the drop event.\n\nCalling setData(format,\
    \ data) or getData(format, data) will (respectively) set or read this piece of\
    \ data.\n\n# Try it Yourself: Drag and Drop in HTML5\n\nYou’re going to build\
    \ a demonstrator for the HTML5 drag-and-drop interface.\n\nFire up your editor\
    \ and create a file containing the code listed in Listing 11.2.\n\n# LISTING 11.2\
    \ HTML5 Drag and Drop\n\nClick here to view code image\n\n```\n<DOCTYPE HTML>\n\
    <html>\n<head>\n  <title>HTML5 Drag and Drop</title>\n  <style>\n    body { background-color:\
    \ #ddd; font-family: arial, verdana, sans-serif;}\n    #drop1 { width: 200px;height:\
