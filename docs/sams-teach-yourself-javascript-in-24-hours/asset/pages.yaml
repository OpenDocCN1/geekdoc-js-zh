    # The DOM getComputedStyle() Method


    Nowadays nearly all browsers support the DOM getComputedStyle() method, which
    accesses the final (that is, computed) style of an element. By final style, we
    mean the style in which the browser displays the element after applying (in their
    appropriate order) all of the styling rules relevant to that element, they inline,
    or inherited from container elements.


    The getComputedStyle() method returns an object having various methods, including
    getPropertyValue(property), which returns the current value for the given CSS
    property name:


