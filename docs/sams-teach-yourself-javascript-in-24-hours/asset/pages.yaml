    # Q&A


    +   Q. Should I always write object-oriented code?

    A. It’s a matter of personal preference. Some coders prefer to always think in
    terms of objects, methods, and properties, and write all their code with those
    principles in mind. Others feel that, particularly for smaller and simpler programs,
    the level of abstraction provided by OOP is too much, and procedural coding is
    OK.

    Q. How would I use my objects in other programs?

    A. An object’s constructor function is quite a portable entity. If you link your
    page a JavaScript file containing an object constructor function, you have the
    means to create objects and use their properties and methods throughout your code.


