  md: '>> (Sign-propagating right shift) Shifts the bits of the first operand to the
    right by the number of places given in the second operand.


    >>> (Zero-fill right shift) Shifts the bits of the first operand to the right
    by the number of places given in the second operand, and then shifts in zeros
    from the left.


    # Assignment Operators


    +   = Assigns the value of the second operand to the first operand, if the first
    operand is a variable.


    +   += Adds two operands and assigns the result to the first operand, if it is
    a variable.


    +   -= Subracts two operands and assigns the result to the first operand, if it
    is a variable.


    +   *= Multiplies two operands and assigns the result to the first operand, if
    it is a variable.


    +   /= Divides two operands and assigns the result to the first operand, if it
    is a variable.


    +   %= Calculates the modulus of two operands and assigns the result to the first
    operand, and if it is a variable.


    +   &= Executes a bitwise AND operation on two operands and assigns the result
    to the first operand, if it is a variable.


    +   ^= Executes a bitwise exclusive OR operation on two operands and assigns the
    result to the first operand, if it is a variable.


    +   |= Executes a bitwise OR operation on two operands and assigns the result
    to the first operand, if it is a variable.


    +   << Executes a left shift operation on two operands and assigns the result
    to the first operand, if it is a variable.


    +   >= Executes a sign-propagating right shift operation on two operands and assigns
    the result to the first operand, if it is a variable.


    +   >>> Executes a zero-fill right shift operation on two operands and assigns
    the result to the first operand, if it is a variable.'
