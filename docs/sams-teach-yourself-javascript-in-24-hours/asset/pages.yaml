    # Handling Errors Well


    When your JavaScript program encounters an error of some sort, a warning or error
    will be created inside the Java interpreter. Whether and how this is displayed
    depends on the browser in and the user''s settings; the user may see some form
    of error message, or the failed program may remain silent but inactive.


    Neither situation is good for the user; he or she is likely to have no idea what
    has gone wrong, or what to do about it.'
