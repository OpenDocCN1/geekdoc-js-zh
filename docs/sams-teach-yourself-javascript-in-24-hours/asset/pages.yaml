    \n```\n<?php\necho \"Name: \" . $_REQUEST['name'] . \"<br>Email: \" . \n.\\$_REQUEST['email']];\n\
    ?>\n```\n\nFinally, the callback function displays the returned information on\
    \ the page:\n\n```\nfunction(data){\n  $(\"#div\").html(data);\n}\n```\n\nThe\
