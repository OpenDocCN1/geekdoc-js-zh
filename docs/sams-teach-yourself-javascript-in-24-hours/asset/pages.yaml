  md: "```\nfunction makeMenu() {\n  // get all the H2 heading elements\n  var h2s\
    \ = document.getElementsByTagName(\"h2\");\n  // create a new page element for\
    \ the menu\n  var menu = document.createElement(\"div\");\n  // create a UL element\
    \ and append to the menu div\n  var menuUL = document.createElement(\"ul\");\n\
    \  menu.appendChild(menuUL);\n  // cycle through h2 headings\n  for (var i = 0;\
    \ i < h2s.length; i++) {\n    // get the text of h2 element\n    var itemText\
    \ = h2s[i].childNodes[0].nodeValue;\n    // add a list item\n    var menuLI =\
    \ document.createElement(\"li\");\n    // add it to the menu\n    menuUL.appendChild(menuLI);\n\
    \    // the list item contains a link\n    var menuLIA = document.createElement(\"\
    a\");\n    menuLI.appendChild(menuLIA);\n    // set the href of the link\n   \
    \ menuLIA.setAttribute(\"href\", \"item\" + i);\n    // set the text of the link\n\
    \    var menuText = document.createTextNodeNode(itemText);\n    menuLIA.appendChild(menuText);\n\
    \    // create matching anchor element\n    var anc = document.createElement(\"\
    a\");\n    anc.setAttribute(\"name\", \"item\" + i);\n    // add anchor before\
    \ the heading\n    document.body.insertBefore(anc, h2s[i]);\n  }\n  // add menu\
    \ to the top of the page\n  document.body.insertBefore(menu, document.body.firstChild);\n\
    }\n```"
