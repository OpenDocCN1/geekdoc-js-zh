  md: '# Capturing Mouse Events


    One of the fundamental purposes of JavaScript is to help make your web pages more
    interactive for the user. To achieve this, we need to have some mechanisms to
    detect what the user and the program are at any given moment—where the mouse is
    in the browser window, whether the user has clicked a mouse button or pressed
    a keyboard key, whether a page has fully loaded in the browser, and so on.


    All of these occurrences we refer to as *events*, and JavaScript has a variety
    of tools to help us work with them. Let''s take a look at some of the ways we
    can detect a user''s mouse actions using JavaScript.


    JavaScript deals with events using so-called *event handlers*. We are going to
    investigate three of these: onClick, onmouseover, and onmouseout.


    # The onClick Event Handler


    The onClick event handler can be applied to nearly all HTML elements visible on
    a page. One way we can implement it is to add one more attribute to the HTML element:


    Click here to view code image


    ```

    onclick=" ...some JavaScript code..."

    ```


    Note


    While adding event handlers directly into HTML elements is perfectly valid, it
    is not regarded as ideal as good programming practice. It serves us well for the
    examples in Part I of this book, but later in the book you learn more powerful
    and elegant ways to use event handlers.


    Let''s see an example; have a look at Listing 2.3.


    # LISTING 2.3 Using the onClick Event Handler


    Click here to view code image


    ```

    <!DOCTYPE html>

    <html>

    <head>

    ```'
