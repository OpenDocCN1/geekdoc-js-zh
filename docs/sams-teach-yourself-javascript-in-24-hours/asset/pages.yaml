  md: '# # Hour 1. Introducing JavaScript


    # ## What You''ll Learn in This Hour:


    +   - About server-side and client-side programming

    - How JavaScript can improve your web pages

    - The history of JavaScript

    - The basics of the Document Object Model (DOM)

    - What the window and document objects are

    - How to add content to your web pages using JavaScript

    - How to alert the user with a dialog box


    The modern Web has to do with its original, text-only ancestor. Modern web pages
    can include audio, video, animated graphics, interactive navigation, and much
    more—and more often than not, JavaScript plays a big part in making it possible.


    In this first hour we describe what JavaScript is, briefly review the language’s
    origins, and consider the kinds of things it can do improve your web pages. You
    also do right and in writing some JavaScript code.


    # ## Web Scripting Fundamentals


    Since you''ve picked up this book, there’s a pretty good chance that you’re already
    familiar with the World Wide Web and have at least a basic understanding of writing
    web pages in some variant of HTML.


    HTML (Hypertext Markup Language) is not a programming language (but as the name
    indicates) a markup language; we use it to mark parts of our page to indicate
    to the browser that these parts should be in a particular way—bold or italic text,
    for instance, or as a heading, a list of bullet points, arranged as a table of
    data, or using many other markup options.


    Once written, these pages by their nature are static. They can’t respond to user
    actions, make decisions, or modify the display of their page elements. The markup
    they contain will always be interpreted and displayed in the same way whenever
    the page is visited by a user.


    As you know from using the World Wide Web, modern websites can do much more; the
    pages we routinely visit are often far from static. They can contain'
  merge: -1
  pgno: 25
- img_proc: true
  md: '“live” data, such as share prices or flight arrival times, animated displays
    with changing colors and fonts, or interactive capabilities such as the ability
    to click through a gallery of photographs or sort a column of data.


    These clever capabilities are provided to the user by programs—often known as
    scripts—operating behind the scenes to manipulate what’s displayed in the browser.


    # Note


    The term script has no doubt been borrowed from the world of theater and TV, where
    the script defines the actions of the presenters and performers. In the case of
    a web page, the protagonists are the elements on the page, with a script provided
    by a scripting language such as, in this case, JavaScript. Program and script
    are, for our purposes, pretty much interchangeable terms, as are programming and
    scripting. You’ll find all of used in the course of the book.


    # Server-Versus Client-Side Programming


    There are two fundamental ways of adding scripts to otherwise static web content:


    +   - You can have the web server execute a script before delivering your page
    to the user. Scripts can define what information is sent to the browser for display
    to the user—for example, by retrieving product prices from the database of an
    online store, checking a user’s identity credentials before logging into a private
    area of the website, or retrieving the contents of an email mailbox. These scripts
    are generally run at the web server before generating the requested web page and
    serving it to the user. You won’t be surprised to learn that we refer to this
    as server-side scripting.


    +   - Alternatively, the scripts themselves, rather than running on the server,
    can be delivered to the user’s browser along with the code of the page. Such scripts
    are then executed by the browser and operate on the page’s already-delivered content.
    The many functions such scripts can perform include animating page sections, reformatting
    page layouts, allowing the user to drag-and-drop items within a page, validating
    user input on forms, redirecting users to other pages, and much more. You have
    probably already guessed that this is referred to as client-side scripting, and
    you’re correct.


    This book is all about JavaScript, the most-used language for client-side'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'scripting on the Internet.


    # Note


    There is, in fact, an elegant way to incorporate output from server-side scripts
    into your client-side JavaScript programs. We look at this in [Part V](“Using
    JavaScript Libraries,” when we study a technique called Ajax.


    # JavaScript in a Nutshell


    # Note


    Although the names are similar, JavaScript doesn’t have much, if anything, to
    do with the Java language developed by Sun Microsystems. The two languages share
    some aspects of syntax, but no more than so either of them do with a host of other
    programming languages.


    A program written in JavaScript can access the elements of a web page, and the
    browser window in it is running, and perform actions on those elements, as well
    as create new page elements. A few examples of JavaScript’s capabilities include


    +   Opening new windows with a specified size, position, and style (for example,
    the window has borders, menus, toolbars, and so on)


    +   Providing user-friendly navigation aids such as drop-down menus


    +   Validation of data entered into a web form to make sure that it is of acceptable
    format before the form is submitted to the web server


    +   Changing how page elements look and behave when particular events occur, such
    as the cursor moving over them


    +   Detecting and exploiting advanced features supported by the particular browser
    used, such as third-party plug-ins, or native support for new technologies


    Because JavaScript code runs locally inside the user’s browser, the page tends
    to respond quickly to JavaScript instructions, enhancing the user’s experience
    and making the application seem more like one of the computer’s native applications
    rather than simply a web page. Also, JavaScript can detect and utilize certain
    user actions that HTML can’t, such as individual mouse clicks and keyboard actions.


    Virtually every web browser in common use has support for JavaScript.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Where JavaScript Came From


    The ancestry of JavaScript dates back to the mid 1990s, when version 1.0 was introduced
    for Netscape Navigator 2.


    The European Computer Manufacturers Association (ECMA) became involved, defining
    ECMAScript, the great-grandaddy of the current language. At the same time, Microsoft
    introduced JavaScript, its own version of the language, for use in its Internet
    Explorer range of browsers.


    ECMA continues to issue updated versions of the ECMAScript language standard.
    At the time of writing, ECMAScript 6 is nearing its final version, and in Part
    VI, "Advanced Topics," you can read about some of the new language features soon
    to become available.


    JavaScript is not the only client-side scripting language. Microsoft browsers
    have supported (in addition to JavaScript, Microsoft’s version of JavaScript)
    a scripting-oriented version of the company’s own Basic language, called VBScript.


    JavaScript, has much better browser support; a version of JavaScript is supported
    by nearly every modern browser.


    # The Browser Wars


    In the late 1990s, Netscape Navigator 4 and Internet Explorer 4 both claimed to
    offer major improvements over earlier browser versions in terms of what could
    be achieved with JavaScript.


    Unfortunately, the two sets of developers had gone in separate directions, defining
    their own additions to the JavaScript language, and how it interacted with your
    web page.


    This ludicrous situation forced developers to essentially write two versions of
    each of their scripts, and use some clumsy and often error-prone routines to try
    to determine which browser was being used to view the page, and subsequently switch
    to the most appropriate version of their JavaScript code.'
