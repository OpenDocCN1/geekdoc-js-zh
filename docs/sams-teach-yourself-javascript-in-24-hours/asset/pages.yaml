  md: 'If you don''t set width and height parameters, the canvas defaults to 300 pixels
    wide by 150 pixels high.


    You first need to specify the rendering context. At the time of writing, 2D is
    the only widely supported context, though a 3D context is under development.


    [Click here to view code image]


    ```

    context = canvas1.getContext(''2d'');

    ```


    The only primitive shapes supported by <canvas> are rectangles:


    [Click here to view code image]


    ```

    fillRect(x,y,width,height);      //draw a filled rectangle

    strokeRect(x,y,width,height);      //draw an outlined rectangle

    clearRect(x,y,width,height);        // clear the rectangle

    ```


    All other shapes must be created using one or more path-drawing functions. Since
    you want to draw a colored disc, that''s what you need here.


    Several different path-drawing functions are offered by <canvas>:


    Move to x, y without drawing anything:


    ```

    moveTo(x, y);

    ```


    Draw a line from the current location to x, y:


    ```

    lineTo(x, y);

    ```


    Draw a circular arc of radius r, having circle center x, y, from


    ```

    startAngle to endAngle;

    ```


    [Click here to view code image]


    ```

    arc(x, y, r, startAngle, endAngle, anti);

    ```


    Setting the last parameter to Boolean true makes the arc draw

    counterclockwise instead of the default clockwise.


    To create shapes using these basic commands, you need some additional

    methods:


    [Click here to view code image]


    ```

    object.beginPath();      //complete a partial shape

    object.closePath();      //draw an outlined shape

    object.stroke();        //draw a filled shape

    object.fill();          //draw a filled shape

    ```'
