  md: '# Note


    An instance of an object is a particular application of an object “template” to
    create a working object based on specific data. For example, the general object
    template Car might have a specific instance where a Car object has been created
    with specific data identifying it as a “blue 1998 Ford, and another instance describing
    a “yellow 2004 Nissan.” In most discussions of object-oriented programming, an
    object template is referred to as a class. I''ve revisited the temptation to use
    term, as JavaScript doesn''t really use classes, but the concept called a constructor
    function is similar. You learn about constructor functions during this hour.


    Writing OOP code offers several advantages over procedural methods:


    +   **Code reuse**—First, OOP allows you to reuse your code in a variety of scripts.
    You could achieve this with regular functions, but it would become difficult to
    keep track of all the variables that needed to be passed, their scope, and meaning.
    For object, in contrast, you only need to document the properties and methods
    for each object. Providing these rules, other programs—and even other programmers—can
    easily use your object definitions.


    +   **Encapsulation**—You can define the way objects interact with other parts
    of your scripts by carefully controlling the properties and methods that the rest
    of the program can “see.” The internal workings of the object can be hidden away,
    forcing code external to the object to access that object’s data only through
    the documented interfaces that object offers.


    +   **Inheritance**—Often when you are coding you will need for some code that
    is nearly, but not quite, the same as something that''s been coded before—maybe
    something already coded in the same application. Using inheritance, new objects
    can be created based on the design of previously defined objects, optionally with
    additions or modifications to their methods and properties; the new object inherits
    properties and methods from the old.


    In the previous hours you often used objects; either those built into JavaScript,
    or those that make up the DOM. However, you can also create your own objects,
    with their own properties and functions, to use in your programs.


