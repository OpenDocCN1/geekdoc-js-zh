    # Summary


    You covered quite a lot of ground this hour.

    First of all you learned various ways to include JavaScript code in your HTML
    pages.

    You studied how to declare variables in JavaScript, assign values to those variables,
    and manipulate them using arithmetic operators.

    Finally, you were introduced to some of JavaScript''s event handlers, and you
    learned how to detect certain actions of the user''s mouse.


    # Q&A


    +   Q. Some of the listings and code snippets list opening and closing <script>
    tags on the same line; other times they are on separate lines. Does it matter?

    A. Empty spaces, as the space character, tabs, and blank lines, are completely
    ignored by JavaScript. You can use such blank space, which programmers usually
    call whitespace, to lay out your code in such a way that it''s more legible and
    easy to follow.

    Q. Can I use the same <script> element both to include an external JavaScript
    file and to contain JavaScript statements?

    A. No. If you use the script element to include an external JavaScript file by
    using the src attribute, you cannot also include JavaScript statements between
    <script> and </script>—this region must be left empty.


