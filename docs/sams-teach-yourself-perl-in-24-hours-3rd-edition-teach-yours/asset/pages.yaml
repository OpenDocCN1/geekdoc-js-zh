  md: 'Your output will vary considerably from the preceding. The module is now tested
    and installed. Enjoy!


    # ...UNIX, The Hard Way


    Although you can install modules in UNIX without using the CPAN module, most of
    the time you don''t need to install this. This method is presented for completeness
    only; you should really use the CPAN module whenever possible.


    First, you need to download the module from CPAN. It is a gzipped-tar bundle.
    If the module is Date::Calc, you would need to obtain the latest version, which
    has a name something like Date-Calc-X.Y.tar.gz. After you''ve downloaded the bundle,
    go to that directory and unpack the bundle like this:


    ```

    $ gunzip Date-Calc-4_2.tar.gz

    ```


    ```

    $ tar xf Date-Calc-4_2.tar

    ```


    Unpacking creates a subdirectory called Date-Calc-4.2. Change into that sub True
    using cd, and type the following command:


    ```

    $ perl Makefile.PL


    Checking if your kit is complete...


    Looks good


    Writing Makefile for Date::Calc

    ```


    Now you have a Makefile, which is required for the build process. Next, build
    the module using the make as follows:


    ```

    $ make


    mkdir blib


    mkdir blib/lib


    Manifying blib/man3/Date::Calc.3


    Target "makemakerdflt" is up to date.

    ```'
