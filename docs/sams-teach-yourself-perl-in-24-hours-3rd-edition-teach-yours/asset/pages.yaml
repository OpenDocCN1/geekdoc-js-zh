    A program of this sort allows remote web server to explore your entire directory
    structure. The CGI program performs no validation of what the directory is, and
    if the browser wants to explore your sensitive data, it may be able to.


    The more important point is that $directory might not contain a directory at all!
    If the web browser sent back value /home/ cat /etc/passwd dirname, the command
    run by CGI would have been as follows:


    ```

    ls -l /home; cat /etc/passwd

    ```


    This command would send a copy of the system''s password file back to the web
    browser. In fact, any Unix shell or MS-DOS command could be run this way, including
    commands to delete files on your server! If your web server has not set up properly,
    this could allow any user on the Internet to take full control of your remote
    server.


    Perl has a mechanism to prevent you from doing things like this. The -T switch
    on the #! enables data tainting. Data received from external sources—filehandles,
    network sockets, the command line, and on it—it’s tainted. Tainted data cannot
    be used in backticks, system calls (such as opening a file for output), the system
    command, or other places that might compromise your security.


    You also cannot use the open system function, or backticks in your Perl program
    when tainting is enabled unless you explicitly set the PATH environment variable
    first.


