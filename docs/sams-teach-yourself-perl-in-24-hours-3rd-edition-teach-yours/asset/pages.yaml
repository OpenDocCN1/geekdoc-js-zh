  md: '# Hour 21. Introduction to CGI


    What You''ll Learn in This Hour:


    +   * The basics of how the Web works

    * What you need to know *before* writing CGI

    * How to write your first CGI program


    There''s no question in anyone''s mind that the explosion in popularity of the
    Internet is mostly due to the World Wide Web. Since the introduction of the first
    graphical web browser in 1993, the Internet has expanded at a phenomenal rate—going
    from the number of hosts doubling every 20 months around 1993 to doubling every
    12 months currently. The growth of private networks—intranets—has increased more
    rapidly.


    The content of the web has become more sophisticated since 1993, and the users
    of the web expect each page to do more than simple **static (unchanging)** web
    pages. A successful website requires dynamic web pages—pages that provide up-to-date
    information. Complex pages with rapidly changing content would be almost impossible
    to keep current if not for **Common Gateway Interface (CGI).**


    # **By the Way**


    The next four hours require you to have some knowledge of Hypertext Markup Language
    (HTML). If you''re unfamiliar with HTML, don''t despair. It''s not really hard
    to learn, and you won''t need much to complete this book.


    HTML is a markup language commonly used for constructing web pages. HTML consists
    of plain text with formatting codes embedded in the text to indicate how a web
    browser should display the text. For example, the text `HTML is <i>not</i> hard
    to learn.` is normal text except for the `<i>` markers. These are `tags` and describe
    the formatting. In this case, the word *not* would not be displayed in italics
    by a web browser, if it can. (Remember, not all browsers are graphical.)


    A full lesson in HTML is well beyond the scope of this book. It''s not difficult;
    there''s just a lot of material to cover. The specification for HTML is maintained
    by the World Wide Web Consortium (W3C) at http://www.w3.org, and you can find
    some nice tutorials there as well. One good book on HTML is *Sam Teach Yourself
    HTML in 24 Hours*.'
  merge: -1
  pgno: 473
- img_proc: true
  md: '# # Browsing the Web


    The Web, as you know it, is simply the interaction between two different systems
    trying to exchange data. The system that is trying to fetch a web page is known
    as the **client**. The client usually runs a program called a **web browser**,
    such as Safari, Firefox, Internet Explorer, Opera, and so on. This is the extent
    of the Web that you''re used to using every day. The web browser provides navigation
    buttons and bookmarks and is responsible for driving web pages on your screen.


    On the other end of the Web is a system known as the **web server**. This system
    takes the client''s request for a page, retrieves it from a local disk, and sends
    it to the client—your web browser. This interaction is shown in Figure 21.1.


    Figure 21.1. Web browser fetching a page.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_474_0.png)


    # ## Fetching a Static Web Page


    A client requests a web page by examining a Uniform Resource Locator (URL) to
    determine the protocol, server, and request to make on that server. A typical
    URL might look like the following:


    http://www.google.com:80/more.html


    The parts of the URL can be broken down like this:


    +   - This part is the protocol. HTTP, or Hypertext Transfer Protocol, is a protocol
    used for transferring web pages. You may also see File Transfer Protocol (ftp)
    or secure HTTPS (https).

    - **www.google.com**—This part is the name of the server—also called a **host
    name**—that contains the document you want. Sometimes, you might see an IP address,
    usually written as four numbers separated by dots: 209.185.108.147. These addresses
    tend to be less reliable than the names, though.

    - :80—This part is a port that determines on which your client and the server
    will connect with each other. This port is optional; the protocol used determines
    what port will be used. HTTP means "use port 80.

    - more.html—This is the request made on the server. Usually it''s a document you
    want to retrieve. It''s written as a pathname, such as /archives/foo.html, or
    it has other characters trailing at the end, such as (?&), but essentially it
    is what the client needs the server to retrieve.'
  merge: -1
  pgno: 474
- img_proc: true
  md: 'the client then follows these steps for http (see Figure 21.2):


    +   1. The hostname (www.google.com) is converted to an IP address.


    +   2. A connection is established with the server at www.google.com using the
    IP address and the port number.


    +   3. The server is asked for the page more.html. The client waits for a response.


    +   4. The server sends the response—in this case, the contents of more.html—and
    drops the connection to the server.


    +   5. The client renders the response on the screen.


    # Figure 21.2. Requesting a page.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_475_0.png)


    the nitty-gritty of the "conversation" between the client and the server is covered
    in depth in Hour 24, "Manipulating HTTP and Cookies."


    # Dynamic Web Content—CGI


    During a normal web page fetch, the server simply locates the document requested,
    retrieves it from its disk storage, and sends it to the client, as illustrated
    in Figure 21.3.


    # Figure 21.3. Static web page fetch.'
  merge: -1
  pgno: 475
- img_proc: true
  md: 'The server in Figure 21.3 doesn''t process the data at all; it simply examines
    the request and passes the requested data back to the client.


    One method to create dynamic content on the Web is through the use of CGI programs.
    CGI is an agreed-upon method that web servers use to run programs on the server
    to generate web content. When a URL indicates to a server that a CGI program should
    be run to generate the content, the server starts the program, the program generates
    the content, and the server passes the content back to the client, as illustrated
    in Figure 21.4.


    # Figure 21.4. CGI script-generated web page.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_476_0.png)


    Each time the client requests a page that''s really a CGI program, the following
    occurs:


    +   1. The server starts a new instance of the CGI program.


    +   2. The CGI program generates a page, or another response, using whatever information
    it needs.


    +   3. The page is sent back to the client.


    +   4. The CGI program exits.'
  merge: -1
  pgno: 476
- img_proc: true
  md: 'The CGI program can be any kind of program. It can be a Perl script, which
    is what you''ll learn about here. It can also be programmed in C, the Unix shell,
    Pascal, Lisp, TCL, or nearly any other programming language. The fact that many
    CGI programs are written in Perl is a happy coincidence. Perl happens to be very
    well-suited to writing programs that deal with text, and the output of CGI programs
    is often text.


    The output of CGI programs can be almost anything, however. It can be images,
    HTML-formatted text, Zip files, streaming video, or any other kinds of content
    you might find on the Web. For the most part, the CGI programs you will be writing
    will generate HTML-formatted text.


    # By the Way


    CGI is not a language; it has nothing to do specifically with Perl, it has nothing
    to do with HTML, and it has very little to do with HTTP. It''s simply an agreed-upon
    interface between web servers and programs run on their behalf. This informal
    interface wasn''t codified until October 2004 in RFC 3875. You can read about
    this at http://www.ietf.org. You''ll pick up bits and pieces of these details
    over the next four hours.'
  merge: -1
  pgno: 477
- img_proc: true
  md: '# Don''t Skip This Section


    You''re almost ready to write a CGI. Almost. You need to check a few things; first;
    otherwise, your first experience writing CGI programs will not be a happy one.
    It''s much easier to check things before you, rather than while you''re debugging.


    To use CGI, you need a web server. A common problem that new CGI programmers is
    that they are writing CGI programs without having a web server properly installed.
    For obtaining a web server, you have a couple options: You can rent space on a
    commercial web server, or you can run your own. The decision is up to you, based
    on what you would like to pay, and how technically you adapt to.


    To obtain a commercial web server, surf the Web and find one. These commercial
    servers are commonly known as "web hosting companies", and the rates they charge
    and the features offered can vary wildly. If you''re planning on writing Perl
    programs, you should be sure to check that Perl version 5 is supported as a CGI
    language. A very few web hosting companies do not support Perl as a CGI programming
    language or not allow CGI at all. Avoid those companies; you have plenty of others
    to choose from.


    You should also make sure that the web hosting company allows you to write your
    own scripts. Some companies claim that they allow Perl CGI but then require that
    you use their programs—sometimes for a fee. You should avoid those companies as
    well.


    Still other companies will charge a fee to "review" your CGI programs before you''re
    allowed to use them. If you choose one of these companies, you should set up your
    own server for testing this "reviewing" can be expensive.


    Running your own personal web server isn''t too difficult, if you have some technical
    skills and are willing to read through the instructions. First, you need to pick
    a web server. If you''re running Windows, you can choose from dozens of free or
    nearly free web servers to install. Make sure they support Perl as a CGI scripting
    language. A few commercial web servers are also available for Windows, notably
    Microsoft''s Internet Information Server (IIS).


    If you have a Unix machine, a few commercial web servers are available. Contact
    your Unix vendor for a list.


    The most popular web server on the Internet, Apache, is completely free. The Apache
    server is easy to install—if you have a C compiler—and fairly easy to operate
    if you''re comfortable editing configuration files. Apache is even precompiled
    for the Microsoft Windows platform. For information on Apache, go to http://www.apache.org.


    If you run your own web server, make sure that the web server is working properly
    and can serve static pages before you attempt to write CGI programs. If your web
    server does not serve static web pages, it''s very unlikely that CGI programs
    will work.


    You should also check the configuration for the web server to make sure that you
    have CGI scripts properly enabled. Not having this feature enabled is the cause
    of most beginners'' frustrations with CGI programming.'
  merge: -1
