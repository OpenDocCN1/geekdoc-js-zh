  md: '# Hour 1. Getting Started with Perl


    What You''ll Learn in This Hour


    +   * Installing Perl

    * Accessing Perl''s internal documentation

    * Writing your first Perl script


    Perl is a general-purpose programming language. It can be used for anything that
    any other programming language can be used for. It has been used in every industry
    imaginable for almost any task you can think of. It''s used on stock market; in
    manufacturing, design, bioinformatics, customer support, quality control, systems
    programming, payroll, and inventory; and, of course, on the Web.


    Perl is used in many places because it is a glue language. A glue language is
    used to bind things together. You probably wouldn''t want to write a word processor
    in Perl—although you could—because word processors are already available. Writing
    a database, a spreadsheet, an operating system, or a full-featured Web server
    for Perl would be silly—but again, possible.


    What Perl is good at is tying these elements together. Perl can take your database,
    convert it into a spreadsheet-ready file, and during the processing, fix the data
    if you want. Perl can also take your word processing documents and convert them
    to HTML for display on the Web.


    As a side effect of being a language designed to glue elements together, Perl
    is very adaptable. It runs under, at least, about two dozen operating systems—and
    probably more. Perl''s programming style is very flexible, so you can do the same
    things in many ways. Your programs may look nothing like mine, if they both work,
    that''s okay. Perl can be a strict language when it needs to be, but it can also
    be forgiving to new programmers if you want. It''s all up to you.


    Let me clear up a few points. The name of the language is Perl. The name of the
    program that runs your programs, the interpreter, is perl. The distinction isn''t
    very important to you—except when you''re trying to start your programs; it''s
    always perl. Sometimes—not here—you will see Perl written as PERL, probably because
    one explanation of Perl''s name is an acronym for *Practical Extraction and Report
    Language*. Nobody ever called it PERL; it''s too pretentious. It''s just Perl
    to its friends.


    # By the Way


    Many of Perl''s features were “borrowed” from other languages. This borrowing
    gave rise, early on, to Perl''s other acronym-expansion: *Pathologically Eclectic
    Rubbish Lister.*'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# # Installing Perl


    To play with perl, you first have to install it. Perl''s installation is designed
    to be easy and free. In fact, as part of the installation steps, Perl should do
    a self-test to make sure that''s okay. The installation procedures vary widely
    depending on operating system you have. So, to get things moving, pick which operating
    system you have from the sections here, and follow along


    #  Stop! Wait! Maybe You Already Have Perl


    Before you go through all the trouble to install Perl on your system, you should
    check to see whether you already have it. Some Unix vests ship with the operating
    system. NT comes with Perl as part of the Windows Resource Kit (but that version
    is a bit old). To see whether you have Perl properly installed on your operating
    system, you need to get to a command prompt.


    Under Unix, simply log in to the system. If you have a graphical environment,
    you need to open a terminal window. After you''ve logged in or opened your window,
    you may see a prompt like this:


    ```

    $

    ```


    It might be a % or it might look like bash%, but either way, it is called the
    **shell prompt** or **command prompt**. For the first few hours, you''ll need
    to be at this prompt to interact with Perl.


    To see whether Perl is properly installed on your system, type the following (but
    not the $ prompt):


    ```

    $ perl -v

    ```


    Either the system responds with an error message such as `command not found`,
    or Perl responds and prints its version number. If Perl prints its version number,
    it''s installed. You probably do not have to reinstall it.


    # **Watch Out!**


    The version number reported should be at least 5—perhaps 5.004, 5.005, 5.6, 5.8,
    and so on—but no lower. If Perl responds with a version of 4.x, you must install
    a new copy. Perl version 4 is old, buggy, and no longer maintained; few of the
    examples in this book will work with Perl version 4. At the time of this writing,
    5.8.6 is considered the current version of Perl.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'See whether Perl is properly installed on a Windows machine you need to get
    to an MS-DOS prompt, similar to Figure 1.1.


    # Figure 1.1. You can check your version of Perl at this DOS prompt.


    [View full size image]


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_21_0.png)


    At that prompt, type the following (but don''t repeat the prompt):


    ```

    C:\> perl -v

    ```


    If Perl is properly installed, it answers with its version number. As noted in
    the previous caution, it should be at least version 5. If MS-DOS replies with
    Bad command or file name, you need to install Perl properly.


    On the Macintosh (running MacOS), you can check to see whether Perl is installed
    by running File Find (Command-f) for ''MacPerl'' as shown in Figure 1.2. If the
    application is found, open it and look at the ''About MacPerl'' option under the
    Apple Menu. You should have at least Version 5.2.0 Patchlevel 5.004; otherwise,
    you should install a new version of MacPerl.'
  merge: -1
