  md: '# Your Next Steps


    After reading the first two-thirds of this book, you should have an understanding
    of the basics of Perl. You have by no means learned the whole language. On my
    bookshelf are at least half a dozen books on the Perl language with—discounting
    overlapping subjects—2,300 pages, and still some topics in Perl are not included.


    A single resource can''t cover *all* of Perl; however, the following sections
    provide recommendations for your next few steps.


    The resources outlined here are presented roughly in the order in which you should
    seek them out. There are exceptions, for the most part, following this order will
    solve your problems in the quickest manner possible.


    # Your First Step


    When you have a Perl problem, trying to figure out what to do first is tough.
    You''re frustrated, and if you''ve been working on the problem for a while, you''re
    probably upset. Take a deep breath, don''t panic, and convince yourself that everything
    will be alright. Believe it or not, this is important first step. Most people
    will become blocked on a problem after a while, and all the frustration from being
    blocked will prevent clear thinking, so you might up making things work.


    Walk away, get something to drink, calm down, and relax. You will solve this problem.


    # Your Most Useful Tool


    The most useful tool in your toolbox is Perl itself. First, you need to determine
    what kind of problem you have. Usually, problems fall into two categories: faulty
    syntax or bad and incomplete logic.


    If you have a problem with syntax, you can usually break it down into two smaller
    problems: Either you''re using some bit of Perl incorrectly, or you''ve made a
    typo. Run your program and examine the error message; it usually indicates Perl''s
    best guess as to which line is wrong. Look at the line for any of the following:


    +   - Perl''s error message indicate specifically where you should look? Look
    there! The Perl interpreter is your best ally in finding bugs.

    - Do all the parentheses, brackets, and braces have matches?

    - Did you check your spelling carefully? Check it again. You''d be surprised at
    how many bugs turn out to be spelling errors.

    - Did you leave something out? A comma? A period?

    - Do the lines immediately before the indicated line look okay?

    - If you go back to the section in this book where that particular type of syntax
    was addressed, can you find examples that look similar to yours?

    - If you copied the code from another source, did you check someplace else for
    a similar piece of code? Mistakes happen.'
  merge: -1
