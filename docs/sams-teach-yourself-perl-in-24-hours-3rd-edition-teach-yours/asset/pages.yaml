  md: '# Q&A


    Q1: If the Web was invented after Perl, why is Perl a CGI language?


    A1: Perl is a CGI language for the same reason that computers are used to play
    games: It''s not what they were invented for—they''re just good at it. The next
    hour presents a more detailed explanation of why Perl is a good CGI language.


    Q2: I posted to Usenet and got a rude, flaming response. What should I do?


    A2: First, does that flame contain some good advice? If so, take that and throw
    the rudeness away. Otherwise, just ignore it and go on. Life''s too short to waste
    time in a flame war.


    Q3: Is there an easy way to search CPAN?


