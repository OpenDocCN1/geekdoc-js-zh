    # Did you Know?


    Tips offer shortcuts and hints on getting the task done.


    # Watch Out!


    Cautions explain roadblocks you might encounter when you work with Perl and tell
    you how to avoid them.


    **New terms** are emphasized by being placed in bold for your easy reference.'
