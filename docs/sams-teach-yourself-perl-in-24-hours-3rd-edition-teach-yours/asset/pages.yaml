  md: '# XML Data


    Hierarchical data comes in many forms. As noted before, the index and table of
    contents of this book are largely hierarchical. Many methods of representing this
    kind of data structure have been developed over the years. The most common one
    in use is called **extensible Markup Language** or **XML**.


    XML is a format developed by the Wide Web Consortium (W3C). It consists of a text
    **document**. Inside of that document we call the **root element**. One element
    that encompasses the entire document called is enclosed in a pair of **tags**—empty
    elements can be represented by a single start-end tag. Elements can have **attributes**,
    which are indicated in the opening tag. A sample XML document is shown in Figure
    19.2.


    Figure 19.2. A marked-up XML document.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_434_0.png)


    # By the Way


    This is a *drastically* simplified description of XML, but it will suffice for
    your purposes. If you want all the details, visit the W3C''s web site at http://www.w3.org.


    XML documents are used for all kinds of data interchange. RSS feeds from blogs
    use XML as a data representation method, commercial databases can return results
    in XML format, Google can be queried with XML, and even Microsoft Office products
    can store data as XML documents. XML has become the lingua franca of data interchange
    since the late 1990s.


    Because of this widespread use, there are *hundreds* of toolkits and methods for
    creating, reading, and modifying'
