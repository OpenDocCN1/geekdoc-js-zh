  md: '# Getting Elements Out of an Array


    So far in this hour, you''ve been slinging around arrays and lists and putting
    information into arrays. How can you get that information back out?


    One way to get the contents of the entire array is to put the array variable in
    double quotation marks:


    ```

    print "@array";

    ```


    An array in double quotes is interpolated, and its elements are returned separated
    by spaces. This example prints the elements of @array with a space separating
    each element.


    Many times, though, you need to get individual elements of arrays. You may need
    to search for an element, change the value of an element, or to add or remove
    individual elements in an array.


    Individual elements in array are accessed by a numeric index. The index for array
    elements starts at the number 0 and increases by 1 for each additional element.
    Each element of the array has an index value, as shown here:


    @trees


    | 0 | 1 | 2 | 3 |

    |---|---|---|---|

    | oak | cedar | maple | apple |


    The number of elements in an array is limited only by your system''s memory. To
    access an element, you use the syntax


    ```

    $array[index]

    ```


    where array is the array name and index is the index of the element you want (also
    called a subscript). The array does not have to exist before you refer to individual
    elements; if it does not already exist, it just automatically springs into existence.
    Some examples of accessing array elements follow:'
  merge: -1
  pgno: 94
