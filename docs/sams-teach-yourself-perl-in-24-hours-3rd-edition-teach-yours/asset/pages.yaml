  md: '# What''s Perl All About, Anyway?


    To get a sense of the culture of Perl, how it works, and what resources are available
    to you, it''s necessary to learn what makes Perl tick.


    # A Brief History of Perl


    In 1988, the Internet was a different place. First, it was a lot smaller and looked
    much different than it does today. The Internet, at the time, had roughly 60,000
    machines on it. Today there are hundreds of millions.


    At the time, the World Wide Web did not exist. It wouldn''t be conceived until
    1991 at CERN in Europe, and the first graphical browser, Mosaic, wouldn''t be
    invented until 1993.


    Most of the traffic on the Internet was textual. Usenet needed a messaging system
    so that groups could keep in touch. Email strongly resembled what it is today—that
    is, mostly textual. File transfers and remote logins rounded out the traffic on
    the Internet.


    In January 1988, Larry Wall announced that he had just written a replacement for
    the awk sed tools under Unix; he called it "Perl." The original manual for Perl
    described it as follows:


    > > Perl is an interpreted language optimized for scanning arbitrary text files,
    extracting information from those text files, and printing reports based on that
    information. It''s also a good language for system management tasks. The language
    is intended to be practical (easy to use, efficient), complete rather than beautiful
    (tiny, elegant, minimal). It combines (in features of C, sed, awk, and sh, so
    some people familiar with those languages would have little difficulty with it.
    (Language historians will also note vestiges of C, Pascal, and even BASIC-PLUS.)
    Expression syntax corresponds quite closely to C expression syntax. If you have
    a problem that would ordinarily use sed or awk or sh, but it exceeds their capabilities
    or needs to run faster, and you don''t want to write the silly thing in C, then
    perl may be for you. There are also translators to turn your and awk scripts into
    perl scripts.


    Perl version 2 was released in June 1988, and it looked very much like modern-day
    Perl: You would recognize and be able to use most of the features of Perl 2. It
    was, and is, a rich, fully programming language. As the description says, Perl''s
    features at the time were geared toward text processing and system programming
    tasks.


    For Perl, 1991 was a banner year. In January, the first edition of Programming
    Perl by Larry Wall and Rand Schwarz published this. This book (and, in later editions)
    the definitive reference book for the Perl language. On the pink cover featured
    a camel, the official mascot of the Perl language. (It''s not a handsome animal,
    but it''s reliable, trustworthy, and very utilitarian.)


    The first edition of Programming Perl coincided with the release of Perl version
    4. This version of Perl was the first widely distributed version of Perl, and
    remnants of flame-burning corners might still be found today in the Net, despite
    the fact that it was last patched in 1992. You probably shouldn''t use it if you
    run across it.'
  merge: -1
  pgno: 365
- img_proc: true
  md: 'In October 1994, Perl version 5 was released. Features such as private variables,
    references, modules, and objects—which you haven''t seen yet—were introduced.
    In October 1996, the second edition of Programming Perl (“The Blue Camel”) was
    released, documenting these new features.


    # # Open Source


    One of the reasons for Perl''s success has to do with how the Perl language is
    developed and distributed. The Perl interpreter is a piece of Open Source software.
    **Open Source** is the new term given to an old concept among programmers; freely
    redistributable software. This software can be given away for free, and the source
    code for the software can be viewed, fixed, and adapted by anyone who wishes to
    change it. Other software packages that follow this model are the Linux and FreeBSD
    operating systems, the Apache Web server, and the Firefox Open Source browser.


    Using the Open Source model is a very effective way to develop software. Because
    the code is written by volunteers, unnecessary code tends not to be included in
    the package. Features that are deemed necessary are proposed and included. The
    software''s quality is very good because everyone with interest in the software
    has the right, and duty, to watch the development carefully for bugs. The more
    people who look at the code, the fewer bugs tend to survive.


    # # By the Way


    Eric S. Raymond has written an excellent series of essays on the Open Source model
    of development that discuss why it works, why it''s economically beneficial, and
    how it developed. The first essay, "The Cathedral and the Bazaar," is a good introduction
    to the Open Source development model works. The URL for these essays is listed
    in the [Other Resources](#) section of this hour.


    The Perl interpreter is copyrighted by Larry Wall; he owns it, and he''s his to
    do as he pleases. However, most software, Perl can be licensed for use. A software
    license describes how the software can be used and distributed; it''s the fine
    print you find when opening store-bought software. Larry Wall offers two different
    licenses for you to choose from: the GNU General Public License and the Perl Artistic
    License. After reading both, you can choose to follow the terms of either agreement
    when redistributing Perl.


    The text of both licenses is quite lengthy, but let me summarize briefly:


    +   - You may redistribute the source code for the Perl interpreter, but you must
    duplicate the copyright notices.

    - You may modify the original source code if your changes are clearly marked as
    your own and you give away the changes or clearly indicate that it is not the
    standard version of Perl. You must provide the standard version as well.

    - You can charge a reasonable fee for distributing Perl. You can charge a fee
    for support, but you cannot sell Perl itself. You can include Perl in other products
    that you sell.

    - Programs that are written using Perl are not subject to this license.

    - No warranties are made about Perl.'
