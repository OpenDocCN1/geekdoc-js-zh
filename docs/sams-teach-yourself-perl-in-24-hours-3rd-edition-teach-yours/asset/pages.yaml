  md: '# Example: Implementation of Car in Perl


    Listing 18.1 shows how a simple car can be represented in Perl. This listing should
    be saved as Car.pm.


    To create a class in Perl, a constructor must bless a reference into the class.
    What this means is a reference (it doesn''t matter what type, most people use
    hash references) is going to be created within the new subroutine. The bless function
    will take that reference and associate it with the class as an instance. The new
    subroutine should then return that reference.


