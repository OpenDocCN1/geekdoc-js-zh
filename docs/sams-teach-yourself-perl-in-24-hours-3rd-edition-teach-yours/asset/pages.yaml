  md: "# Something You Should Know\n\nPerl is called a free-form programming language.\
    \ This means Perl statements aren't very picky about how they are written. You\
    \ can insert spaces, tabs, and even carriage returns—called whitespace—nearly\
    \ anywhere in a Perl statement, and really doesn't matter.\n\nThe places that\
    \ you really can't insert spaces willy-nilly are places you'd expect restrictions\
    \ to be. For example, you can't insert spaces in the middle of a function name;\
    \ pr int is not a valid function. Or you can insert them in numbers, as in 25\
    \ 61. Also, whitespace inside literal strings like \"Hello, World!\" shows up\
    \ as well, whitespace. Almost everywhere else it's valid. You could write the\
    \ sample Perl program like this:\n\n```\n#!/usr/bin/perl\n\nprint\n    \"Hello,\
    \ World!\\n\"\n;\n```\n\nIt would have functioned identically to the original.\
    \ This free-form nature gives you a lot of range in \"style\" in your Perl programs.\
    \ Feel free to express yourself with form. Just remember, someday other users\
    \ may have to look at your programs. Be kind to them.\n\nThe style used in the\
    \ examples in this book is fairly conservative. Sometimes statements are broken\
    \ across several lines for clarity or to save space because Perl statements can\
    \ get quite long. The Perl documentation even has a style guide, if you want to\
    \ browse it for suggestions. You should search for the document named perstyle.\n\
    \n# By the Way\n\nStyle in Perl programs can be taken to extremes. Valid Perl\
    \ programs can be written as poetry, even haiku. Some memorable Perl programs\
    \ actually look like pictures but do something useful. The Perl Journal (http://www.tpj.com)\
    \ used to run a contest that was about all writing obscure-looking Perl programs:\
    \ the Obfuscated Perl Contest. You should not take style lessons from these entries."
  merge: -1
