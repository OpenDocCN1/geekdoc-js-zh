  md: "# Scope\n\nIn the introduction for this hour, you learned that subroutines\
    \ are used to take pieces of code and bundle them and give them a name. You can\
    \ then use this name to execute the code whenever you need it. You can also write\
    \ the code within the subroutine so that it functions autonomously. That is, you\
    \ can make it run and produce its return using nothing but arguments, the language's\
    \ built-in functions and operators, and literal expressions within it. In that\
    \ case, you can reuse the subroutine in other programs, because it no longer relies\
    \ on the context being called in; it simply takes its arguments defined internally\
    \ and produces a return value. The subroutine becomes a black box—stuff goes in,\
    \ stuff comes out—and you don't care what happens on the inside. Such a subroutine\
    \ is called a *pure function*.\n\nNow examine the following snippets:\n\n```\n\
    # One fairly good way to write this function\n\nsub moonweight {\n    ($weight)\
    \ = @;\n\n    return($weight / 6);\n}\n\nprint moonweight(150);\n```\n\n```\n\
    # A poor way to write this function.\n\nsub moonweight {\n    return($ $weight/6\
    \ );\n}\n\n$weight = 150;\n\nprint moonweight;\n```\n\nIn the long run, the first\
    \ implementation shown here is a better one. It doesn't rely on any external variables—those\
    \ outside the function—being set. It takes its argument, which it copies to $weight,\
    \ and then does its calculations. The second implementation cannot easily be reused\
    \ in another program; you would have to ensure that $weight is properly set and\
    \ is not being used for some other value. If it were being used for"
