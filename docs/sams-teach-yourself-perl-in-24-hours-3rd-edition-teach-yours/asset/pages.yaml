  md: "In addition to blocks, for, while, if, and other flow-control statements that\
    \ control blocks of code, you can use Perl statements to control the flow within\
    \ the blocks.\n\nThe simplest statement that you gives control is last. the last\
    \ statement causes the innermost running loop block to be exited. Consider this\
    \ example:\n\n```\nwhile($i<15) {\n    last if ($i==5);\n    $i++;\n}\n```\n\n\
    The last statement causes the while loop to exit when the value of $i is 5, instead\
    \ of normally when the while test is false. When you have multiple nested loop\
    \ statements, last exits the loop currently running.\n\n# Listing 3.3. Example\
    \ of the last Statement\n\n```\n1: for($i=0; $i<100; $i++) {\n2:     for($j=0;\
    \ $j<100; $j++) {\n3:         if ($i * $j == 140) {\n4:             print \"The\
    \ product of $i and $j is 140\\n\";\n5:             last;\n6:         }\n7:  \
    \   }\n8: }\n```\n\nThe set of nested loops in Listing 3.3 finds all the numbers\
    \ less than 100 whose products are 140—2 and 70, and 34, and so on—rather inefficient.\
    \ The point to note here is the last statement. When a product is, the result\
    \ is printed, and the inner loop (the loop iterating over $j) is exited. The outer\
    \ loop continues executing (by incrementing $i) and reruns the inner loop.\n\n\
    The next statement causes control to be passed back to the top of the loop and\
    \ the next iteration of the loop"
