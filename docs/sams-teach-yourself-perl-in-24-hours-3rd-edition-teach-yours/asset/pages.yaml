  md: '# What to Do When Your CGI Program Doesn''t Work


    The following sections provide a general-purpose CGI program debugging guide.
    Before you read all this information to find the problem in your first CGI program,
    go back through the instructions to make sure you didn''t skip any steps.


    By the time you reach the end of this hour, you should be able to find any problems
    your CGI program has.


    The diagnostics in these sections assume you''re debugging a program named hello.cgi.
    If your program has another name, use it instead.


    # Is It Your CGI Program?


    The first potential source of problems to eliminate is the CGI program itself.
    There''s no sense in debugging web server configurations if the CGI program doesn''t
    work.


    CGI programs can be run interactively like Perl programs, and running them this
    way is very useful for debugging. To run your program, start it from the command
    prompt like this:


    ```

    perl hello.cgi

    ```


    The Perl interpreter should reply with a line that looks like this:


    ```

    (offline mode: enter name=value pairs on standard input)

    ```


    This prompt indicates that the CGI module is attempting to get your CGI form values;
    they are covered in Hour 22, "Basic Forms."


    To this prompt, you should—for now—respond with just an end-of-file character.
    Under Unix, it is Ctrl+D, you just press the Ctrl key and type D. In Windows,
    you press Ctrl+Z. Perl should then print the following:


    ```

    Content-Type: text/html

    ```


    ```

    <b>Hello, World!</b>

    ```'
