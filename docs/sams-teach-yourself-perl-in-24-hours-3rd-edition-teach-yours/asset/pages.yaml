  md: 'Problem: Special-secret variable names to control behavior.


    Solved: The constructor takes the pathname as an argument, and the dirty work
    is done inside of the class. The only names you have to know are method names
    to use with the object.


    3.


    Problem: Can''t do concurrent operations with the module.


    Solved: Because each object maintains its own internal state and structures, there''s
    no real limit to how many independent objects you can create.


    4.


    Problem: With users accessing internals, the behavior becomes unpredictable.


    Mostly Solved: No internal mechanisms are directly visible to the module user.
    Arguments get passed to the constructor and the methods, and the module can keep
    its internals private. In Perl, it''s still possible to directly change the internals
    components of a class from outside of the class—but it''s not recommended, and
    sometimes not easy.'
