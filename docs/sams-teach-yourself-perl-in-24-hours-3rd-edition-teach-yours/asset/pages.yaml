  md: "# # Opening Files\n\nTo read or write files in Perl, you need to open a `filehandle`.\
    \ Filehandles in Perl act as convenient references (handles) between your program\
    \ and the operating system about a particular file. They contain information about\
    \ how the file was opened and how you are reading (or writing) the file; they\
    \ also contain user-defined attributes about how the file is to be read or written.\n\
    \nFrom previous times you are already familiar with `STDIN`. This filehandle is\
    \ given to you automatically by Perl when your program starts, and it is usually\
    \ connected to the keyboard (you'll learn more details about `STDIN` later). The\
    \ format for file names is the same as that for variables named in `Hour 2`. \"\
    Perl's Building Blocks: Numbers and Strings,\" ensure that no type identifier\
    \ appears in front of the name (`$`, `@`). For this reason, we recommend that\
    \ file names be in uppercase so that they do not clash with Perl's current or\
    \ reserved words: `foreach`, `else`, `if`, and so on.\n\n# ## By the Way\n\nYou\
    \ can also use a scalar string or anything that returns a string—such as a filehandle.\
    \ This type is called an *indirect filehandle*. Describing this is a bit of a\
    \ confusing for a primer in Perl. For more information on indirect filehandles,\
    \ see the online documentation on the perfunc `open` function in the manual page.\n\
    \nAny time you need to access a file on your disk, you need to create a new filehandle\
    \ and prepare it by opening the filehandle. You open filehandles, not surprisingly,\
    \ with the `open` function. The syntax of the `open` function is as follows:\n\
    \n```\nopen(filehandle, pathname)\n```\n\nThe `open` function takes the filehandle\
    \ as its first argument and the pathname as the second argument. The pathname\
    \ indicates which file you want to open. If you don't provide a full pathname—such\
    \ as `c:/windows/system/`—open will try to open the file in the current directory.\
    \ If the `open` function succeeds, it returns a non-zero value. If it fails, it\
    \ returns `undef`.\n\n```\nif (open(MYFILE, \"myfile\")) {\n    # Run this if\
    \ the open succeeds\n} else {\n    print \"Cannot open myfile!\\n\";\n    exit\
    \ 1;\n}\n```\n\nIn the preceding snippet, if `open` succeeds, it evaluates to\
    \ a true value, and the `if` block is with the open filehandle called MYFILE which\
    \ is now open for output. Otherwise, the file cannot be opened, and the `else`\
    \ portion of the code is run, indicating an error. In many Perl programs, the\
    \ `open or fail` syntax is writing using the `die` function stops execution of\
    \ your Perl program and prints an error message:\n\nDied at scriptname line xxx"
