  md: '# Unix Stuff


    This portion of the hour is primarily for the users of Perl who are working under
    the Unix operating system. If you don''t use Perl on a Unix system, you can safely
    skip this section and not miss anything important; you can read it if you''re
    curious about Unix, however.


    Unix users should know that Perl has a deep Unix heritage, and some Perl functions
    come from Unix commands and operating system functions. Most of these functions
    will not be used. Some functions—unlink come from Unix with meanings that are
    not really tied to Unix at all. Every operating system deletes files, and Perl
    ensures that unlink does the right thing on every operating system. Perl makes
    a great effort to ensure that concepts—such as file I/O—that should be portable
    between operating systems actually are portable, and it hides all theibilities
    from you if it can.


    The fact that many Unix functions and commands are embedded in the Perl language—which
    has been ported to many non-Unix operating systems—is a tribute to the desire
    of Unix developers and administrators to take a little bit of the Unix toolkit
    with them wherever they go.


    # By the Way


    As the next section suggests, this description is not to be taken as a full explanation
    of Unix file permissions and how to manipulate them. For a full explanation, consult
    your operating system''s documentation or any good book on Unix, such as Sams
    Teach Yourself Unix in 24 Hours.


    # A Crash Course in File Permissions


    In Hour 1, to make a Perl program run as though it were a regular command, you
    were given the chmod 755script without any real explanation of what it meant.
    First of all, chmod is a command in Unix that sets the permissions of files. Next,
    the 755 is a description of the permissions being given to the file: the owner
    scriptname. Each of the three digits represents one of file, the group it belongs
    to, any nongroup and other—user. In this case, the owner has permission 7, whereas
    the group and others have permission 5, as shown in Figure 10.1.


    > Figure 10.1. Breakdown of Unix permission bits.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_246_0.png)


    Table 10.2 lists the possible values of the digit for each possible combination
    of permissions.


    Table 10.2. File Permissions'
