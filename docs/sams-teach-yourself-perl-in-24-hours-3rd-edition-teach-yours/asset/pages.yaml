  md: 'If typing this command worked, congratulations! Remember how you ran this program
    because this is how you will start your programs for the rest of the book. (You
    can use some other ways, which will be covered shortly.)


    If it did not work, check for the following:


    +   - If you receive the error message Bad command or file name or perl: command
    not found, the Perl program is not in your execution path. You need to figure
    out where the Perl program is installed and add that directory to the PATH in
    your shell.

    - If you receive the error message Can''t open perl script hello: A file or directory
    does not exist, you''re probably not in the same directory as the file you named
    earlier, or you saved the file under a different name. To change into the proper
    directory under Unix or Windows, use the cd command. For example, if you saved
    the file on your desktop in Windows 98, the command would be:


    ```

    c:\> cd Windows\Desktop

    c:\> perl hello

    ```


    Remember, if you used an extension on the filename (such as .pl or .plx), you
    need to specify that extension when you run the program.


    +   - If you receive an error such as syntax error, Perl starts normally but cannot
    figure out what is in the file named hello. You''ve mistyped the file''s contents,
    or you''ve used a word processor that applied formatting to the saved file. The
    cat (Unix) or the type (DOS) can be used to verify what is in the file. If you
    mistype, check everything; the quotation marks and punctuation are important.


    If you''re using MacPerl, simply select Run "hello" from the Script menu to run
    your first Perl program. If you''re not using MacPerl''s built-in editor to write
    your program, use the Open command from the File menu to open your program in
    MacPerl, and select Run.


    # It Worked! So What Happened?


    When you typed the command perl hello, a program named perl started on your computer.
    This program is called the Perl interpreter. The Perl interpreter is the heart
    and soul of Perl. Its job is to take the file it has been given (hello, in this
    case), and find the program inside it, and run it.


    When it run a program, the interpreter first checks the statements, functions,
    operators, math, and everything that makes up the Perl program to make sure the
    syntax is correct, and then executes the statements one at a time.


    When the Perl interpreter is all done reading your program from disk, it begins
    to run the program'
