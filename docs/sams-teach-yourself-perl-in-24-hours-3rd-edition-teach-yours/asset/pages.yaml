    Recursive subroutines are not very common. Large ones are complicated to construct
    and difficult to debug. Any task that can be done through iteration (using for,
    while, foreach) can be done with recursion, and any recursive task can be accomplished
    iteratively. Recursion is usually reserved for a small set of tasks that lend
    themselves to easily.'
