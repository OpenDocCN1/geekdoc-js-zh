  md: '```

    substr string, offset

    substr string, offset, length

    ```


    The substr function takes string, starting at position offset, and returns the
    rest of the string from offset to the end. If length is specified, then length
    characters are taken—or until the end of the string is found, whichever comes
    first—as in this example:


    ```

    #Character positions in sa

    # 0          10         20         30

    $a="I do not like green eggs and ham";

    print substr($a, 25);      # prints "and ham."

    print substr($a, 14, 5);   # prints "green"

    ```


    If the offset specified is negative, substr substr starts counting from the right.
    For example, substr($a, -5) returns the last five characters of $a. If the length
    specified is negative, substr returns from its starting position to the end of
    the string, leaving length characters, as in this example:


    ```

    print substr($a, 5, -10);      # prints "not like green egg"

    ```


    In the preceding snippet, substr starts at position 5 and returns the rest of
    the string except the last 10 characters.


    You can also use the substr function on the left side of an assignment expression.
    When used on the left, substr indicates what characters to be replaced in a scalar.
    When substr is used on the left side of an assignment, the first argument must
    be an variable—such as a scalar variable—not a string literal. The following is
    an example of editing a string with substr:


    ```

    $a="countrymen, lend your wallets"

    # Replace first character of $a with "Romans, C"

    substr($a, 0, 1)="Romans, C";

    ```'
