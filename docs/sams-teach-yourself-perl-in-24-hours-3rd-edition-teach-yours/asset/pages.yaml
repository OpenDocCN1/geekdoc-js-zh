    An important difference between glob opendir/readdr/closed is that glob returns
    the pathname used in the pattern, where the opendir/readdr/closed functions do
    not. For example, glob(''/usr/include/*.h'') returns ''/usr/include'' as part
    of any matches; readdir does not.


    So which should you use? It''s completely up to you. However, using the opendir/readdr/closed
    functions to be a much more flexible solution and will be used in most of the
    examples throughout this book.


    Perl offers an alternative way to write globs. Simply placing the pattern inside
    the angle operator (<) makes the angle operator like glob:


    ```

    @cfiles = <*.c>; # All files ending in .c

    ```


    The syntax that uses the angle operator for globbing is older and can be confusing.
    In this book, I will continue to use the glob operator instead for clarity.'
