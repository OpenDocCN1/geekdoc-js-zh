  md: '# Hour 4. Stacking Building Blocks: Lists and Arrays


    What You''ll Learn in this Hour:


    +   - How to fill and empty arrays

    - How to examine arrays element by element

    - How to sort and print arrays

    - How to split scalars into arrays and join arrays back into scalars


    Scalars are Perl''s singular nouns. They can represent any one thing—a word, a
    record, a document, a line of text, or a character. Often, though, you need to
    talk about collections of things—many words, a few records, two documents, fifty
    lines of text, or a dozens characters.


    When you need to talk about many things in Perl, you use *list data*. You can
    represent list data in three ways: using lists, arrays, and hashes.


    Lists are the simplest representation of list data. A list is a simple group of
    scalars. Sometimes they''re written with parentheses enclosing the scalars, which
    are separated by comma. For, `(2, 5, $a, "Bob")` is a list that contains two numbers,
    a scalar variable `$a`, and the string "Bob". Each scalar in a list is called
    a *list element*. Keeping with the philosophy of Least Surprise (see Hour 2, "Perl''s
    Building Blocks: Numbers and Strings") lists can contain as many elements as you
    like. Because scalars can also be arbitrarily large, a list can hold quite a lot
    of data.


    To store data so that you can run it throughout your program, you need an array
    variable. Array variables are represented in Perl with "at" sign `@` as the type
    identifier followed by a variable name (as discussed in Hour 2, "Perl''s Building
    Blocks: Numbers and Strings\ For example, `@foo` is a valid array variable. You
    can have the same name for an array variable as a scalar variable; for example,
    `$names` and `@names` refer to different things—`$names` to a scalar variable,
    and `@names` to an array. The variables have nothing to do with each other.


    Individual items in an array are called *array elements*. Individual array elements
    are referred to by their position within the array, called an *index*. Thus, we
    can refer to the third array element of the array `@foo`, the fifth array element
    of the array `@names`, and so on.


    The other list type, a *hash*, is similar to an array. Hashes will be discussed
