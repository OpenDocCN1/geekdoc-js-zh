  md: '# Appendix A. Installing Modules


    Installing modules in Perl isn''t hard, and learning how to install them is essential
    if you ever wanted to master Perl. This appendix contains information on how to
    install the modules you need.


    # By the Way


    Detailed documentation on installing modules under almost any architecture is
    available in Perl''s documentation. The document, called "perlmodinstall," even
    contains instructions for building under obscure operating systems such as OS/2
    and VMS.'
  merge: -1
