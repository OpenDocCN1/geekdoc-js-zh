  md: 'A3: Before I give you answer, you must realize that some people consider tracking
    an invasion of privacy. Having said that, let me show you the general method:


    +   1.


    Write your <a href> links so that they go to a CGI program, passing the real target
    URL as a parameter:


    ```

    <a

    href="http://server/cgi/redirect.pl?target=http://www.congo.com">Congo</a

    ```


    +   2.


    The redirect.pl program in the example should use the CGI module''s param function
    to get the real URL (http://www.congo.com) from the parameter target:


    ```

    $target_url=param(''target'');

    ```


    +   3.


    A cookie is then created with the target URL in the value, with a name you can
    search for later, such as:


    ```

    $tracking_cookie=cookie(-name => ''tracker'',

    -value => $target_url,

    -expires => ''+1w'');

    ```


    +   4.


    The redirect is then sent to the browser along with the cookie:


    ```

    print redirect(-uri => $target_url,

    -cookie => $tracking_cookie);

    ```


    Later, when the browser returns to your Web site, you can look for the cookie
    named TRacker, which will contain the URL that the user visited or when she left
    your site.


    There are other methods of tracking users, this is just one.


    Q4: Can I transmit a cookie while redirecting the browser to another page?'
