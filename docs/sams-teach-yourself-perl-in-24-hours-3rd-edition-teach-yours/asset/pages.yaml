- img_proc: true
  md: 'Fetching information causes Perl to retrieve the key and data from the DBM
    file, as follows:


    ```

    print $hash(canine);

    ```


    To disconnect the hash from the DBM file, use dbmclose with the hash name like
    this:


    ```

    dbmclose(%hash);

    ```


    After you''ve disconnected from the DBM file, the items that were stored in it—the
    keys feline canine with the values associated with them—are still in the DBM file,
    which is the whole point of a DBM file. The key-value pairs stored in a hash tied
    to a DBM file are retained between invocations of a Perl program.


    Functions you would normally perform with a hash can be performed with a hash
    that ties to a DBM file. The hash functions keys, values, and delete work normally
    (exists does not). You can export the hash—and the DBM file—by assigning the hash
    to an empty list like this: %hash=(). You can even initialize the hash by assigning
    it to a list after it''s tied to the DBM file with dbmopen.


    # Important Points to Know


    The following are just a few small points you need to know about tying hashes
    to DBM files:


    +   - The length of your keys and data is now limited. Normal hashes have (virtually)
    unlimited key and value length. Hashes that are tied to a DBM file have a limited
    key and value length, typically around 1,024 characters for both the key and the
    value combined—this is a limitation of DBM files. The total number of keys and
    values that can be stored has not changed; it is limited only by your file system.

    - The values in the hash before dbmopen are lost, it''s just best to use a fresh
    hash. Now consider this example:


    ```

    $h=();


    $h(dromedary)="camel"


    dbmopen(%h, "database", 0644) || die "Cannot open: $";


    print $h(dromedary); # Likely will print nothing at all


    dbmclose(%h);

    ```'
