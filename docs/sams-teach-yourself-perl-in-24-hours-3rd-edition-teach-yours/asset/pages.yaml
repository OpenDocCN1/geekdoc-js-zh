    successfully started to do so with Unix''s design. When Perl constructs the pipeline
    and starts it, it''s not sure that the pipeline will actually work; if the pipeline
    is assembled properly and starts, it''s assumed that it will finish properly.
    When the last program in the pipeline completes, it should return a successful
    exit status. The close function can return status to tell whether everything went
    all right; otherwise, an error results.'
