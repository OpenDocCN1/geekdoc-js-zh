  md: "# Function Notes\n\nNow that you know about scope, there are some things that\
    \ can be done effectively only with scope. One are recursive subroutines, and\
    \ the other is the use strict statement that enables a stricter Perl, possibly\
    \ preventing you from making mistakes.\n\n# Declaring Variables local\n\nPerl\
    \ version 4 didn't have private variables. Instead, Perl 4 had variables that\
    \ were \"almost private.\" This concept of almost-private variables is still around\
    \ in Perl 5. You declare these variables using the local operator, as in this\
    \ example:\n\n```\nsub myfunc {\n  local($foo) = 56;\n\n  # rest of function...\n\
    }\n```\n\nIn the preceding snippet, $foo is declared to local to the myfunc()\
    \ subroutine. A variable that has been declared with local acts almost identically\
    \ to one declared with my: It can be scoped to a subroutine, block, or eval, and\
    \ its value is destroyed upon leaving the subroutine or block.\n\nThe difference\
    \ is that variable declared local can be seen within its scopes block and within\
    \ any subroutines called from that block. Table 8.1 shows a side-by-side comparison.\n\
    \nTable 8.1. Comparing my and local"
