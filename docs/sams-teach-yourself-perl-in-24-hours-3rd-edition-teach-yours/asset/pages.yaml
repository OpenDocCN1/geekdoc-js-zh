  md: '# Modifiers and Multiple Matching


    Until now, all the regular expressions you''ve seen been case sensitive. That
    is, whether lowercase characters are distinct in a pattern match. To match words
    and not care about they''re in upper lowercase would require something like this:


    ```

    / [Mm] [Aa] [Cc] [Bb] [Ee] [Tt] [Hh] /

    ```


    This example doesn just look silly; it''s error-prone because it would be really
    easy to mistype an upper-/lowercase pair. The substitution operator (s///) and
    the match operator (m//) can match regular expressions regardless of case if followed
    with the letter i:


    ```

    /macbeth/i;

    ```


    The preceding example matches Macbeth in uppercase, lowercase, or mixed case (MaCbEtH).


    Another modifier for matches and substitutions is the global-match modifier, g.
    The regular expression (or substitution) is done not just once, but repeatedly
    through the entire string, each match (or substitution) taking place immediately
    after the first one.


    The g modifier (and other modifiers) can be combined by simply specifying all
    of them after the match or substitution operator. For example, g matches all occurrences
    of the pattern in the string, whether uppercase or lowercase.


    In a context, the global-match modifier causes the match to return a list of all
    the portions of the regular expression that are parentheses:


    ```

    $="One fish, two frog, red fred, blue foul";

    ```


    ```

    @F=m/\W(f\w\w\w)/g;

    ```


    The pattern matches a nonstop character, and then the letter f, followed by four
    word characters. The f and four word characters form a group, marked by parentheses.
    After the expression is evaluated, array variable F will contain four elements:
    fish, frog, fred, and foul.


    In a scalar context, the g modifier causes the match to iterate through the string,
    returning true for each match and false when no matches are made. Now consider
    the following:'
