  md: '# The Comprehensive Perl Archive Network (CPAN)


    Perl offers additional modules to expand your development environment even further.
    These modules are contained in the Comprehensive Perl Archive Network (CPAN).


    # What Is CPAN?


    CPAN is a large collection of Perl modules, programs, and documentation, contributed
    to the Perl community by the volunteers who wrote them.


    The list of modules available in CPAN is extensive. CPAN was formed in 1995, and
    at the time of this writing, contains more than 7,000 modules available for installation.
    The modules cover a wide range of programming problems. Table 16.1 provides a
    short list to give you a taste of what''s in CPAN.


    # Table 16.1. Modules in CPAN


    | Module Group | General Description |

    | --- | --- |

    | Tk | Graphical interface for Perl programs; specific toolkit modules are available
    for accessing specialty graphics libraries such as the Win32 API, Gtk, Gnome,
    Qt, or the X11 toolkit |

    | Net::* | Networking modules: interfaces for Mail, Telnet, IRC, LDAP, and 40+
    others |

    | Math::* | More than 30 modules for such constructs as complex numbers, fast
    Fourier transforms, matrix manipulation, and so on |

    | Date::*, Time::* | Modules for converting dates/times into and out of various
    formats and doing manipulations on them |

    | Data::*, Tree:: | Modules for manipulating data structures such as linked-lists
    and B-trees |

    | DBI::* | Generic interface to databases |

    | DBD::* | Interface to commercial and free databases such as Oracle, Informix,
    Ingress, ODBC, Msq, MySQL, Sybase, and many others |

    | Term::* | Fine control over text-mode screens as DOS Command window or Unix
    xterms |

    | String::*, Text::* | Dozens of modules for parsing text and formatting text
    |

    | CGI::*, | Modules for producing, serving, fetching, and parsing |

    | URI::*,* | Web pages |'
