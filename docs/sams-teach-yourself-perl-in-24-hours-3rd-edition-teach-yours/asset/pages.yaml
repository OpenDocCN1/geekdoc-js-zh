  md: "# Creating and Calling Subroutines\n\nYou create user-defined subroutines in\
    \ Perl by using the following syntax:\n\n```\nsub subroutine_name {\n\n    statement1;\n\
    :\n    statementx;\n}\n```\n\nSubroutine names in Perl follow the same naming\
    \ conventions as scalars, arrays, and hashes outlined in Hour 2, \"Perl's Building\
    \ Blocks: Numbers and Strings.\" Subroutine names can have the same names as variables.\
    \ However, you should avoid creating subroutine names that are the same as those\
    \ of Perl's built-in functions and operators. Creating two subroutines with the\
    \ same name in Perl causes Perl to emit a warning if warnings are enabled; otherwise,\
    \ the second definition causes the first to be forgotten.\n\nHere is an example\
    \ of a subroutine:\n\n```\nsub countdown {\n\n    for ($i=10; $i>=0; $i--) {\n\
    \n        print \"$i --\";\n    }\n}\n```\n\nWhen the program needs to use the\
    \ code in the subroutine, you can use either of the following syntax lines to\
    \ call (or invoke) the subroutine:\n\n```\n&countdown();\n```"
