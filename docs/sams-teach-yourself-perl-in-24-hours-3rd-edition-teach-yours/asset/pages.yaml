  md: '# # Looping


    As you read in the Introduction, sometimes just making decisions and running code
    conditionally are not enough. Often you need to run pieces of code over and again.
    The exercise presented in Listing 3.1 wasn''t much fun because you could only
    take one guess (well, and that is a pointless conditional). If you want to be
    able to take multiple guesses, you need to be able to repeat sections of code
    conditionally, and that''s what looping is all about.


    # ## Looping with while


    The simplest kind of loop is a while loop. A while loop repeats a block of code
    as long as an expression is true. The syntax for a while loop looks like this:


    ```

    while (expression) block

    ```


    When Perl encounters the while statement, it evaluates the expression. If the
    expression is true, the block of code is run. Then, when the end of the block
    is reached, the expression is re-evaluated. If it''s still true, the block is
    repeated, as in the following snippet:


    # ### Listing 3.2. Sample while Loop


    ```

    1: $counter=0;

    2: while ($counter < 10 ) {

    3:     print "Still counting...$counter\n";n4:     $counter++;

    5: }

    ```


    Line 1: $counter is initialized to zero.


    Line 2: The expression $counter < 10 is evaluated. If it''s true, the code in
    the block is run.


    Line 4: The value of $counter is incremented by 1.


    Line 5: The } marks the end of the block started on line 2 with a { . At this
    point, Perl returns'
  merge: -1
