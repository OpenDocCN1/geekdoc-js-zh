    # Watch Out!


    Waiting for user input (or any other potentially slow events) while holding a
    lock is not a good idea. All other programs that need that lock will stop and
    wait for the lock to be released. You therefore should obtain your lock, do your
    locking-sensitive code, and then release your lock.


