  md: "# Manipulating Arrays\n\nNow that you've learned the basic rules for building\
    \ arrays, it's time to learn some tools to help you manipulate those arrays to\
    \ perform useful tasks.\n\n# Stepping Through an Array\n\nIn Hour 3, \"Controlling\
    \ the Program's Flow,\" you learned about making loops with while, for, and other\
    \ constructs. Many tasks you want to perform involve examining each element of\
    \ an array. This process is called iterating over the array. One way you could\
    \ do so is to use a for loop, as follows:\n\n```\n@flavors=qw( chocolate vanilla\
    \ strawberry mint sherbet );nfor($index=0; $index<@flavors; $index++) {\n    print\
    \ \"My favorite flavor is $flavors[$index] and...\"\n}\nprint \"many others.\\\
    n\"\n```\n\nThe first line initializes the array with ice cream flavors, using\
    \ the qw operator for clarity. (If I had included a two-word flavor such as Rocky\
    \ Road, I would have needed a regular, single-quoted list. The second line does\
    \ most of the work.) $index is initialized to 0 and incremented by 1 until @flavors\
    \ is reached. Because it is being compared to the scalar $index, @flavors is evaluated\
    \ in a scalar context, so it evaluates to 5—the number of elements in @flavors.\n\
    \nThe preceding example seems like an awful lot of work for iterating over an\
    \ array. Usually in Perl, if something seems like an awful of work, you can find\
    \ an easier way to do it. This is no exception. Perl has another loop statement\
    \ mentioned in Hour 3, foreach. The foreach statement sets an index variable,\
    \ called an iterator, equal to each element of a list in turn. Consider this example:\n\
    \n```\nforeach $cone (@flavors) {\n    print \"I'd like a cone of $cone\\n\"\n\
    }\n```\n\nHere, the variable $cone is set to each value in @flavors. As $cone\
    \ is set to each value in @flavors,"
