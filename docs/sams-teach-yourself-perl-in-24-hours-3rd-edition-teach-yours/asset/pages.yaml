  md: '# # Hour 11. System Interaction


    **What You''ll Learn in this Hour:**


    +   * The system() function

    * Capturing output

    * Portability


    All the Perl you''ve learned until now has been fairly self-contained: If you
    wanted something done, you had to do it yourself—sorting data, creating directory
    listings, divining configuration information, and so on. The problem is that it''s
    a lot of work, and you are repeating that work that might have been done elsewhere.


    One of the current buzzwords being touted about Perl is that it''s an excellent
    *glue* language. What this means is that Perl can use programs that are installed
    with your operating system as components, connecting them together to create larger
    programs. It can start your OS utilities and use them to gather information, interact
    with you, and then shut them down.


    Perl can glue together these smaller utilities to produce a much larger and more
    useful utility. This capability has added the benefit of allowing you to quickly
    write code that might otherwise have taken a long time to write and debug. You
    should use any leverage at your advantage to write code quickly and accurately.
    Gluing system utilities together can offer a large advantage.


    # **By the Way**


    The examples in this hour—for the most part—have two versions, one for Windows
    and MS-DOS systems and the other for Unix systems. Where only one example is provided,
    you''ll find a note in the text about what to change for the other kind of system—and
    usually that change is minor.'
  merge: -1
