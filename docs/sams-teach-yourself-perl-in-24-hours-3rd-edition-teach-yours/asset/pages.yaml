  md: "Another common task—copying files—can be done the hard way in Perl:\n\n+  \
    \ 1. Open the source file for reading.\n\n+   2. Open the destination file for\
    \ writing.\n\n+   3. Read the source file and write to the destination.\n\n+ \
    \  4. Close both files.\n\nAnd, of course, after each step, you must make sure\
    \ that no errors occurred and that each write was successful. That's the hard\
    \ way. An easier way is to take advantage of Perl's File::Copy module, which does\
    \ the file copying for you. The following is an example of this module:\n\n```\n\
    use File::Copy;\ncopy(\"sourcefile\",\"destination\") || warn \"Could not copy\
    \ files: $\\$\"\n```\n\nThe preceding snippet copies the contents of sourcefile\
    \ to destination. The copy function returns 1 on success or 0 if a problem occurred,\
    \ and sets the variable $ to the error proper.\n\nFile::Copy also provides a move\
    \ function,which moves a file from one directory to another. If the file can be\
    \ moved by simply renaming it, it is renamed; this is usually the case when the\
    \ source file and the destination file are on the same file system or disk. If\
    \ renaming is possible, first the file is copied to the destination filename,\
    \ and the original file is removed. Consider this example:\n\n```\nuse File::Copy;\n\
    if (not move(\"important.doc\",\"d:/archives/documents/important.doc\")) {\n \
    \ warn \"important.doc could not be moved: $\\$\";\n  unlink \"d:/archives/documents/important.doc\"\
    ;\n}\n```\n\nIn the following snippet, the file important.doc is moved from its\
    \ current directory to the target directory d:/archives/documents. If the move\
    \ fails, it's possible that a partial target file exists. The unlink function\
    \ removes the partially copied file if the move fails.\n\n# Is Anybody Out There?"
