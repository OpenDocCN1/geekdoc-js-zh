    VISA 0000-11-2222-3333 06/06


    12-31441 1


    99-00129 1


    This is more typical of the kind of data that would be sent through a web application
    (or any other kind of program). If you''ve ordered products on the web from an
    online retailer, you''ve probably received a confirmation email that looked very
    much like this. It''s still human-readable, but it''s structured in such a way
    that it can be easily processed by software.


    # Hierarchical Data


    Hierarchical data refers to data that is structured, like table data, but contained
    in parent-child or container relationships.


    The Table of Contents of this book is an example of hierarchical data. Each line
    in the Table of Contents isn''t really meaningful unless you know its context.
    There are 24 entries called "Summary," but each Summary is only meaningful if
    you know in which chapter it appears. The Index of this book is also hierarchical.
    There are at least half-dozen entries for the word "arrays," sometimes as a minor
    topic (data types/references/arrays, and so on) and once as a major topic. Exactly
    where it appears depends a great deal on what is being talked about.


    You''ll look at hierarchical data in a little while, specifically at a method
    of representing hierarchical data called XML.


    # Binary Data


    The last category of data is binary data. It''s usually quite unreadable by humans.
    Loading a binary file into your text editor results in gibberish.


    Binary data is useful when exchanging data between programs where space and speed
    are concerns, and human readability is not. Normally to decode binary data, you
    must be supplied with the data layout by the person who''s also supplying the
    data. It''s very structured—like the table data in Figure 19.1—it''s just that
    the structure isn''t apparent. JPEG images, ZIP files, and MP3 music files are
    all examples of binary data.


    # Figure 19.1. Marked-up incoming order'
