  md: '# Filling Your Hash


    Individual hashes are created by assigning values to them, as much as array elements.
    For example, you can create individual hash elements, as in the following:


    ```

    $Authors(''Dune'')=''Frank Herbert'';

    ```


    In this example, you assign an element to the hash %Authors. The key for this
    element is the word Dune, and the data is Frank Herbert. This assignment creates
    a relationship in the hash between Dune and Frank Herbert. The value associated
    with it, $Authors(''Dune''), can be treated like any other; it can be passed to
    functions, modified by operators, or reassigned. When you are changing a hash
    element, always remember that you are modifying the value stored in the hash element,
    not the hash itself.


    Why does the example use $Authors{} instead of %Authors{} Like arrays, hashes
    are represented as a value, they have their own in front of the variable name
    (%). When you access an individual element of a hash, you are accessing a scalar
    value, so you prefix the variable with a dollar ($) indicating a single value
    is being referenced, and you use the braces to indicate that you mean the value
    in the hash you have associated with, not an element in an array or an unrelated
    scalar value with the same name as the hash. To Perl, $Authors{''Dune''} represents
    a scalar value—in this case, Frank Herbert.


    A hash with just one key isn'' particularly useful. To put several values into
    a hash, you could use a series of hashes, as shown in the following:


    ```

    $food(''apple'') = ''fruit'';

    $food(''pear'') = ''fruit'';

    $food(''carrot'') = ''vegetable'';

