  md: '# Watch Out!


    Using a variable before it has been initialized with a value is a bad practice.
    Perl can be made to warn you when this situation happens. If your program has
    -w on the #! line at the beginning, the directive "use warnings" appears in your
    program (Perl 5.6). If you invoke Perl with the -w switch on the command line,
    and then try to use the value of a variable that you haven''t previously set,
    Perl responds with this error message when your program runs and you try to use
    the value: Use of uninitialized value.


    # The Special Variable $_


    Perl has a special variable, $, whose value is used as a "default" by many operators
    and functions. For example, if you simply print $_ by itself—without specifying
    a scalar variable or string literal to print—Perl will print the current value
    of $_:


    ```

    $="Dark Side of the Moon";


    print;    # Prints the value of $, "Dark side...",

    ```


    Using $_ like this can understandably cause some confusion. It''s not really apparent
    what print is actually printing, especially if the assignment to $_ occurs higher
    up in the program.


    Some operators and functions are actually easier to use with the $_ variable,
    notably the pattern-matching operators discussed in Hour 6, "Pattern Matching."
    In this book, however, I''ll keep the use of $_ to a minimum so that the lessons
    are easier to follow.'
