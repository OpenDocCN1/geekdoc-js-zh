- img_proc: true
  md: '# By the Way


    Redirecting error and output messages in Unix is well beyond the scope of this
    book, and the technique varies depending on what shell you use. Any good book
    on using Unix should cover this topic thoroughly.


    # Text Files and Binary Files


    Some operating systems—such as VMS, Atari ST, and notably Windows and MS-DOS—make
    the distinction between binary files (raw) and text files. This distinction causes
    problems because Perl can''t tell the difference—and you wouldn''t want it to.


    Text files are simply records that end in end-of-line characters, called *record
    separators*. Binary files, on the other hand, are collections of bits that need
    to be treated literally, such as images, executable programs, and data files.


    When you''re writing a text file, Perl translates the `\n` character sequence
    into the record separator that your operating system uses. In Unix, `\n` becomes
    ASCII 10 (LF); on a Macintosh, ASCII 13 (CR); and on Windows systems, it becomes
    the sequence ASCII 13 and ASCII 10 (CRLF). When you''re writing text, this behavior
    is appropriate.


    When you''re writing binary data—GIF files, EXE files, MS Word documents, and
    so on—translation is not you want. Any time you really need to write binary data,
    and not Perl or the operating system to translate it for, you must use the `binmode`
    function to mark the filehandle as binary. Use `binmode` before you do any input
    or output from it:


    ```

    open(FH, "camel.gif") || die "$";


    binmode(FH); # The filehandle is now binary.


    # Start of a valid GIF file...


    print FH "GIF87a\056\001\045\015\000";


    close(FH);

    ```


    You have to use `binmode` on the filehandle only once, unless you close it and
    reopen it. Using `binmode` on systems that do not distinguish between binary files
    and text files (Unix, Macintosh) causes no harm.


    # File Test Operators *'
