    \ would be simply to increase $i by 2, but that wouldn't demonstrate next, would\
    \ it?)\n\nThe redo statement is similar to next, except that the condition isn't\
    \ re-evaluated. Perl resumes execution at the beginning of the block and doesn't\
    \ check whether the termination condition has been met yet.\n\n# Labels\n\nPerl\
    \ allows blocks and some loop statements (for, while) to be labeled. That is,\
    \ you can place an identifier in front of the block or statement:\n\n```\nMYBLOCK:\
    \ {\nn}\n```\n\nThe preceding block is labeled as MYBLOCK. Label names follow\
    \ the same conventions as variable names, with one small exception: Label names\
    \ do not have an identifying character—$, $, @—as variables do. It's important\
    \ to make sure that label names do not clash with Perl's built-in keywords. As\
    \ a matter of style, it's best if label names are all uppercase. You should not\
    \ have any conflicts with any current or future Perl keywords that way. The for\
    \ while statements can all have labels as well.\n\n```\nOUTER: while($expr) {\n\
    \    INNER: while($expr) {\n        statement;\n    }\n}\n```"
