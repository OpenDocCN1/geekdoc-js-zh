    package, where pat specifies the pattern to search for. To find the Date::Manip
    module, for example, search like this:


    ```

    cpan> i /Manip/

    ```


    The CPAN module may need to contact a CPAN server and obtain a new copy of the
    index. This situation happens only when needed, and the process takes just a moment.
    When the query is done, CPAN replies with something like the following information:


