  md: 'blocks Number of blocks in file Zero, always


    Many of the values in Table 10.3 you will probably never use, but they are presented
    for completeness. For the more obscure values—especially in the Unix return values—you
    might want to consult your operating system''s reference manual.


    The following is an example of using stat on a file:


    ```

    @stuff=stat "myfile";

    ```


    Normally, the retrieved values from stat are copied into an assignable list of
    scalars for clarity:


    ```

    ($dev, $ino, $mode, $nlink, $uid, $gid, $rdev, $size,

    $atime, $mtime, $ctime, $blsize, $blocks)=stat("myfile");

    ```


    To print the permissions for a file-three digit format described in the section
    "A Crash Course in File Permissions," you use this bit of code, where @stuff contains
    the permissions:


