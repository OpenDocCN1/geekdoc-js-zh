  md: '# Summary


    In this hour you learned how to collect your code into useful groupings called
    modules. These modules can be shared among multiple programs. This has the benefits
    of allowing you to use the same code in many places without cutting-and-pasting,
    making the code easier to maintain by having only one copy of shared code, and
    grouping useful subroutines together by function.'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# Q&A


    Q1: How do I create many modules, and group them together by name?


    A1: Perl groups module names using :: to separate each grouping from least specific
    to most specific. For example, File there are modules File::Find File::IO—both
    are related to files, but perform different functions. To create your own grouping
    for a module named MyModules::File::FileInfo, you need to create a directory called
    MyModules, and under a directory named File, and under that file named FileInfo.pm
    where your module code will go.


    Q2: I want to put my modules someplace, separate from the programs. How can I
    do this?


    A2: Perl uses an internal array called @INC to determine where to search for modules.
    To look for modules in another directory, there''s a helper called lib which will
    cause perl to look elsewhere for modules. To look for modules in \home\mymodules
    use this at at the beginning of your program:


    ```

    use lib ''\home\mymodules'';

    ```


    For more information, type perldoc lib.


    Q3: Most of my module users will import large groups of subroutines. This will
    make my use line long. Is there a remedy?


    A3: Yes. You can choose to select a group of module subroutines or variable names
    together and export them as a group. Use the hash %EXPORT_TAGS instead of (or
    in addition to) @EXPORT_OK. The keys to the hash are group names; the values are
    an array reference of the names themselves. The Exporter module manual page has
    more information.'
