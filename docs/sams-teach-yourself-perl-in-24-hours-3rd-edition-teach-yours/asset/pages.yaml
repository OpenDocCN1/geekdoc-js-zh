    \ inside the angle operator and assign the value to a variable:\n\n```\nopen(MYFILE,\
    \ \"myfile\") || die \"Can't open myfile: $!\";\n\n$line=<MYFILE>;      # Reading\
    \ the filehandle\n```\n\nThe angle operator in a scalar context reads one line\
    \ of input from the file. When called after the entire file has been read, the\
    \ angle operator returns the value undef.\n\n# By the Way\n\nA \"line of input\"\
    \ is usually considered to be a text stream until the first end-of-line sequence\
    \ is found. In Unix, that end-of-line sequence is a newline character (ASCII 10);\
    \ in DOS and Windows, it's the sequence of carriage return and newline characters\
    \ (ASCII 13,10). This default end-of-line value can be manipulated by Perl to\
    \ achieve some interesting results. This topic will be covered in Hour 12, \"\
    Using Perl's Command-Line Tools.\"\n\nTo read and print the entire file, you can\
    \ use the following if MYFILE is an open filehandle:\n\n```\nwhile(defined($a=<MYFILE>))\
    \ {\n\n    print $a;\nn}\n```\n\nAs it turns out, a shortcut for reading the filehandle\
    \ is to use a while loop. If the angle operators are the only elements inside\
    \ the conditional expression of a while loop, Perl automatically assigns the input\
    \ line to the special variable $_ (described in Hour 2, \"Perl's Building Blocks:\
    \ Numbers and Strings\") and repeats the loop until the input is exhausted:\n\n\
    ```\nwhile(<MYFILE>) {\n```"
