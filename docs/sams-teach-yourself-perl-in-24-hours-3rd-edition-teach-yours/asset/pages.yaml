  md: '# Installing Perl on Unix


    To install Perl on Unix, you need a couple of things. First, you need a copy of
    the Perl source bundle. You can easily download the latest bundle from the Downloads
    area of http://www.perl.com. You can find multiple versions, but the one you want
    is always labeled "Stable" or "Production." You also need an ANSI C compiler.
    Don''t worry if you don''t know what that means. Perl''s configuration program
    checks for one, and if the compiler is not there, you can install a prebuilt version.


    # By the Way


    If your Unix has a system for installing prebuilt packages, you may be able to
    install a prebuilt version of Perl. Linux, Solaris, AIX, and other Unixes have
    prebuilt bundled versions of Perl that can be easily installed. Consult your documentation
    on where to obtain these packages.


    After you have the Perl source bundle—which comes in a file named something like
    stable.tar.gz—then you need to unpack and install it. To do so, enter these commands:


    ```

    $ gunzip stable.tar.gz

    ```


    ```

    $ tar xf stable.tar

    ```


    These commands take a while to run. If you don''t have the gunzip decompression
    program, you can obtain a copy from http://www.gnu.org. The program bundle is
    called gzip. When you''re finished unpacking, type the following command at a
    prompt:


    ```

    $ sh Configure

    ```


    The configure program starts and asks you a lot of questions. If you don''t know
    the answers to most of them, that''s fine; just press Enter. The default answer
    is usually the best one. Perl can be built on almost any Unix system imaginable.
    When that''s all done, type this command:


    ```

    $ make

    ```


    Building Perl takes quite a while. Get some coffee. If you have a slow system,
    get lunch. When the build is complete, type two more commands:'
  merge: -1
  pgno: 24
- img_proc: true
  md: '```

    $ make test

    ```


    ```

    # make install

    ```


    The make test command ensures that Perl is 100 percent okay and ready to run.
    To run make install, you might need to be logged in as root—that''s why the prompt
    #, root''s prompt, in the example—because it wants Perl into system directories.


    When make install is correct, you can test Perl''s installation by typing the
    following at the prompt again:


    ```

    $ perl -v

    ```


    If this command works, congratulations!


    # Did you Know?


    You can go to http://www.perl.com for the latest version of Perl.


    # Installing Perl on Mac OS


    # By the Way


    If your Macintosh is running the operating system Mac OS X, it is essentially
    a Unix machine and you should generally follow the instructions for Unix in this
    book. Mac OS X ships with a recent version of Perl and should already be installed.


