  md: 'The Content-Type: text/html message indicates that what follows should be interpreted
    as text or HTML. The meaning of this message is covered fully in Hour 24. For
    now, just know that it''s important that this message is the first printed by
    your program—with the header function—and that''s necessary. If anything else
    is emitted before the Content-Type message, the CGI program will fail.


    **Problem:** Perl responds with a syntax error.


    **Solution:** Fix the syntax error.


    **Problem:** Perl responds with Can''t locate CGI.pm in @INC...


    **Solution:** Your Perl installation is incomplete. The CGI module ships with
    Perl by default. If you need to reinstall it, see Appendix A, "Installing Modules."
    Make sure you''ve spelled CGI correctly.


    # Server Problems


    After you have eliminated your script as the cause of the problems, it''s time
    to check the script''s installation and the server''s configuration.


    **Problem:** The server responds with the message Not Found or 404 Not Found.


    **Solution:** These messages usually indicate one of the following problems:


    +   - The URL you used is incorrect. You typed http://www.server.com/cgi/hello.cgi
    when you should have typed http://www.server.com/cgi-bin/hello.cgi. Go back to
    the checklist and verify that the URL of your CGI directory is correct, you''ve
    spelled the name of the script right, and you have the right extension.

    - You placed the script in the wrong directory on the web server. Verify with
    the checklist that the CGI directory is correct, and if not, move the script to
    the correct location.


    **Problem:** The text of your script is displayed.


    **Solution:** The program is displayed because the web server thinks that the
    program is a real document, not a program to be executed.


    +   - You used the wrong extension on your CGI program. Instead of .pl, you used
    .cgi or some other extension. Check the checklist, and make sure you''re using
    the correct extension on your CGI program.

    - You put the script in the wrong directory, and you''re using the URL to access.
    Verify that you''ve put the script in the correct CGI program directory and you''re
    using the right URL.

    - The server is misconfigured. If you''re using your own web server, reread the
    documentation and verify that you''ve set it correctly. The installation includes
    a test CGI script; so, try it. If you''re using a commercial web hosting server,
    verify that you''re placing your script in the correct'
