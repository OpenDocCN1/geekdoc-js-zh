  md: "For example, if your Perl program reads a list of customers from a file, printing\
    \ that customer list in alphabetical order would be reasonable. For sorting data,\
    \ Perl provides the sort function takes as its argument a lists and sorts it in\
    \ (roughly speaking) alphabetical order; the function then returns a new list\
    \ in sorted order. The original array remains untouched, as you can see in this\
    \ example:\n\n```\n@Chiefs=gw(Clinton Bush Reagan Carter Ford Nixon);\nprint join('\
    \ ', sort @Chiefs, \"\\n\");\n join(' ', @Chiefs, \"\\n\";\n```\n\nThis example\
    \ prints the sorted list of presidents (Bush Carter Clinton Ford Nixon Reagan)\
    \ and prints the list again in its original order.\n\nBe forward that the default\
    \ sort order is ASCII order. This means that all words that start with uppercase\
    \ characters sort words that begin in lowercase letters. Numbers do not sort in\
    \ ASCII the way you would expect. They don't sort by value. 11 sorts higher than\
    \ 100. In this case, you need to sort by something other than the default order.\n\
    \nThe sort function allows you to sort in whatever order you want by using a block\
    \ of code (or a subroutine, named, inside Hour8 \"Functions\") as the second argument.\
    \ Inside the block (or subroutine), two variables, $a and $b, are set to two elements\
    \ of the list. The block's task is to return -1, 0, or 1 depending on whether\
    \ $a is less than $b$, equal to $b$, or greater than $b$, respectively. The following\
    \ is an example of how hard it may be to sort by numeric values, assuming that\
    \ @numbers is full of numeric values:\n\n```\n@sorted=sort { return(1) if ($<$b);\n\
    return(0) if ($===$b);\nreturn(-1) if ($a<$b); } @numbers;\n```\n\n(spaceshiphip\
    \ operator)>The preceding example certainly sorts @numbers numerically. The code\
    \ looks far too complicated for such a common task. As you might suspect for anything\
    \ this cumbersome, Perl has a shortcut: \"spaceship\" operator, <=. The spaceship\
    \ operator gets its name because somewhat resembles a flying saucer, seen from\
    \ the side. It returns -1 if its left operand is less than the right, 0 if the\
    \ two operands are equal, and if the left operand is greater than the right:\n\
    \n```\n@sorted=sort { $a=>$b; } @numbers;\n```"
