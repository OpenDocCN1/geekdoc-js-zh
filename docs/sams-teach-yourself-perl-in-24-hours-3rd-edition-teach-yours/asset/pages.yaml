  md: '# Other Command-Line Stuff


    The debugger is not the only feature of the interpreter that can be activated
    by command-line switches. In fact, many useful Perl programs can be written just
    at the command prompt.


    By the Way


    Macintosh users should run these command-line examples by selecting 1-liners from
    the Script menu and then typing the command in the dialog box.


    # One-Liners


    The key to such programs is the -e switch when per Perl on the command line. Following
    the -e can be any Perl statements at all, as in this example:


    ```

    C:> perl -e "print ''Hello, world'';"

    ```


    Hello, world


    You can use multiple -e statements to insert multiple statements or separate them
    with semicolons, as shown here:


    ```

    C:> perl -e "print ''Hello, world'';" -e "print ''Howzit goin?''''"

    ```


    Hello, worldHowzit goin?


    A word of caution: Most command interpreters have rules about quotation marks.
    The Windows/MS-DOS command interpreter—command.com or the NT command shell—allows
    you to use double quotes to group word—such as print and Hello, World in the preceding
    example—but you cannot easily put double quotes inside other quotes. Nor can you
    easily put >, <, |, or ^ inside the double quotes. Consult your operating system''s
    manual for a complete list of MS-DOS/Windows quoting rules.


    Under Unix, generally as long as the quotes are balanced—every open quote has
    a close quote—and embedded quotation marks have a \ in front of them, they should
    be okay:


    ```

    $ perl -e ''print "Hello, World\n";'' -e ''print "Howzit goin?\n"''

    ```'
