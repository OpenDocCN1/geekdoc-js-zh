  md: '# Your First Program


    To write your Perl programs, you need a utility called **text editor**. A text
    editor is a program that allows you to enter plain text, without any formatting,
    into a file. Microsoft Windows Notepad and the MS-DOS EDIT program are both examples
    of text editors. For Unix, vi, Emacs, and pico are all text editors. At least
    one of them will be available on your system.


    Under the Mac, the MacPer application contains a rudimentary text editor; to open
    a new program, select New under the File menu. For Mac OS X use the TextEdit program.
    which is located in the Finder under Applications. Be sure to set the preferences
    to "plain text" or select "Make Plain Text" over the Format menu.


    You should *not* use a word processor to type in your Perl programs. Word processors—such
    as Microsoft Word, WordPad, WordPerfect, and so on—embed formatting codes by default
    when they save documents, even if the documents contain no bold, italic, font
    changes, or other special formatting. These codes will confuse Perl, and your
    programs will not work correctly. If you need to use a word processor, be sure
    to save your programs as plain text.


    # Typing Your First Program


    Open your text editor, and type the following Perl program exactly as shown:


    ```

    #!/usr/bin/perl


    print "Hello, World!\n";

    ```


    The **#!** line should be the first line in the file.


    After you type this program into your text editor, save it in a file named **hello**.
    You don''t need an extension on the filename, but Perl permits you to put one
    there. Some Windows and Macintosh utilities use extensions to tell what kind of
    file this is. If you need or want to use an extension, `.pl` or `.plx` is common;
    for example, you can use **hello.pl**.


    # Watch Out!


    One of the most common problems here besets users of Microsoft Notepad. When you
    save the file, Notepad always appends a **.txt** extension to the file, whether
    or not you asked it to. If you want a .pl extension, you have to specify the filename
    in quotes, like this: "hello.pl", as shown in the following figure. This forces
    Notepad to save the file without the .txt extension.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Running the Program


    To run the program, for now, you need to get to a command prompt. In Unix, open
    a terminal window or log in. In a Microsoft Windows machine, open an MS-DOS prompt.
    Under Mac OS X, use the Finder, select Applications, Utilities and run Terminal.
    You should also change into the directory where you stored the hello program by
    using your shell''s cd command.


    When you''re at the prompt, type the following. (A DOS prompt is shown here; Unix
    has a slightly different prompt.)


    ```

    C:\PROGRAMS> perl hello

    ```


    If all goes well, Perl should respond with the following message:


    ```

    Hello, World!

    ```'
