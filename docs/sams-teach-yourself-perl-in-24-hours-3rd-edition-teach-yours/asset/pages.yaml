  md: '# Writing


    To write data to a file, you must first have a filehandle open for writing. Until
    now, all open statements have seen opening the filehandle for reading only. The
    syntax for opening a file for writing is almost identical to that for reading:


    ```

    open(filehandle, ">pathname")


    open(filehandle, ">>pathname")

    ```


    The first syntax line look familiar, except for the > in front of the pathname.
    The > signals to Perl the file specified at pathname should be overwritten with
    new data, that any existing data should be discarded, and that filehandle is open
    for writing. In the second example, >> tells Perl to open the file for writing,
    but if the file already exists, not to discard the contents but append the new
    data to the end of it. Check out these examples:


    ```

    # Overwrite existing data, if any

    open(NEWFH, ">output.txt") || die "Opening output.txt: $";


    # Simply append to whatever data may be there.

    open(APPFH, ">>logfile.txt") || die "Opening output.txt: $";

    ```


    # By the Way


    Until now, it''s almost impossible for your Perl programs to harm anything. Now
    that you know how to write to files, you must be very careful to write only to
    files that you mean to change. On systems where the operating system files are
    vulnerable (Windows 95/98, Mac), you can damage your operating system by carelessly
    writing to files. Be very aware of what files you are writing. Recovering the
    data in files accidentally opened with > is nearly impossible. Cleaning out data
    in files accidentally opened with >> is also difficult, so be careful.


    When you''re done with a filehandle opened for writing, closing the filehandle
    is especially important. Your operating system doesn''t commit data to disk as
    you write it; it buffers the data up and writes it occasionally. The close function
    notifies the operating system that you are done writing and that the data should
    be moved to permanent storage on disk:'
