    \ subroutine is now completely self-contained.\n\nThe portion of the program in\
    \ which this variable is called the variable's scope.\n\nYou can use the my operator\
    \ to declare scalar, array, and hash variables private to a subroutine. Filehandles,\
    \ subroutines, and Perl's special variables—!, $$, and @_, for example—cannot\
