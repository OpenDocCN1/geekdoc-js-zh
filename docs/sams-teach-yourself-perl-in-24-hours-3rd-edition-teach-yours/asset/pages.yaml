  md: '# Putting Things into Lists and Arrays


    Putting things into a literal list is easy. As you saw, the syntax for a literal
    list is a set of parentheses enclosing scalar values. The following is an example:


    ```

    (5, ''apple'', $x, 3.14159)

    ```


    This example creates a four-element list containing the numbers 5, the string
    ''apple'', whatever happens to be in the scalar variable $x, and pi.


    If the list contains only simple strings, single quotation marks around each string
    gets to be too much for you, Perl provides a shortcut—the qw operator. An example
    of qw follows:


    ```

    qw( apples oranges 45.6 $x )

    ```


    This example creates a four-element list. Each element of the list is separated
    from the others by whitespace (spaces, tabs, or newlines). If you have list elements
    that have embedded whitespace, you cannot use the qw operator. This code works
    just as though you had written the following:


    ```

    (''apples'', ''oranges'', ''45.6'', ''$x'')

    ```


    Notice that the $x is encased in single quotation marks. The qw operator does
    not do variable interpolation elements that look like variables; they are treated
    as though you wanted that way literally. So ''$x'' is not converted to whatever
    the value of the scalar variable $x is; it''s left alone as a string containing
    a dollar sign and the letter x.


    Perl also has a useful operator for ranges in lists; it''s called the range operator.
    The range operator is designated by a pair of periods (..). The following is an
    example of this operator:


    ```

    (1..10)

    ```


    The range operator takes the left operand (the 1) and the right operand (the 10)
    and constructs a list consisting'
