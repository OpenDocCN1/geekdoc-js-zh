  md: '# Hour 19. Data Processing


    What You''ll Learn in this Hour:


    +   - How to determine what kind of data you''re dealing with

    - Basic techniques for breaking down common data types in Perl

    - How to parse table data and XML


    If you''re old enough, the phrase "data processing" probably conjures up images
    of magazine ads from the 1970s proclamation that you could "make big money as
    a Data Processor," or minicomputers with whirling tape drives from the 1980s.


    But that''s not really what we''re talking about in this hour. This hour is about
    taking data from its presented form and making it more useful. This takes a few
    different stages.


    First, you have to examine the raw data to see if it can be cut, sliced up, stretched,
    and massaged into the final form that you need. Usually this step is obvious,
    but not to be forgotten. If you''ve got a CD collection, it is possible to assemble
    a (partial) discography for each band in the collection? Sure. Is it possible
    to take that and assemble a telephone directory for your company? No, because
    the raw data you need isn''t just in there.


    Next you need to pick your tools to read the data, pull it apart, and reassemble
    it. Our tool of choice, of course, is Perl.


    Finally—and this is the part that requires some creativity—examine the data to
    determine how to pull it apart. Should you cut it into vertical slices (columns)?
    Horizontal slices (rows)? Make new tables and manipulate those? Do you have to
    glue two different sources of data together?


    This hour will show you some basic techniques for pulling apart your data and
    reassembling it into a useful form.


    By the Way


    For further reading, an entire book has been written on the subject of using Perl
    to manipulate table data, XML data, and parse unstructured data: Data Munging
    with Perl by David Cross.'
  merge: -1
  pgno: 422
- img_proc: true
  md: '# # How to Look at Data


    To give this some context, I''m going to invent a fictional company, WidgetCo,
    and you are going to take on the role of programmer. WidgetCo is a small (10 employee)
    shop that sells reprint parts for antique bicycles. WidgetCo primarily sells through
    catalogs to bicycle enthusiasts and repair shops.


    Your boss, Mr. Widget, has determined that his company will now be taking orders
    from the Internet. In fact, he would like you as Chief Programmer to streamline
    the process. Initially, orders will be received through email sent by someone''s
    web site. (The exact mechanism for taking such orders over the web will be covered
    in Hours 21–24.) Now, for your concern we are dealing with incoming mail messages.


    So what can you expect to see?


    #  Unstructured Data


    One kind of data representation is called unstructured. For example, the web site
    could simply have users type what they want in a text box and mail me the results
    to you. What you''ll likely see is something like the following mail message:


    From: lisa@geeksalad.org


    Subject: Order


    I love your catalog! I have a 1962 Schwinn Astro Special that I''m trying to get
    working again. It used to be my older brother''s bike, but he broke the seat clamp
    so I''ll need one of those. The one on one page 62 of the catalog in the right-hand
    corner should do nicely. Also, can you send me a half yard of seat material on
    the next page? My VISA number is 0000-11-2222-3333 and expires in July 2006. Please
    ship it to 1000 Rose St in Monroe, MI 48089.


    This contains all the relevant information, but there''s no hope of having a computer
    program dissect all of this. A human is still going to have to read this message,
    and re-key the information into your ordering system. Unstructured data is not
    suitable for any kind of automation.


    # Table Data


    Most likely, the web site will be designed to send data in a structured form.
    The most common representation is a table. Your email order might arrive and look
    like the following:


    From: beth@geeksalad.org


    Subject: Order


    beth@geeksalad.org'
