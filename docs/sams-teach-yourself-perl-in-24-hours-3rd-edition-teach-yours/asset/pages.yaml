- img_proc: true
  md: '# The Stateless Web


    Writing complex multipforms using CGI programs offers a unique programming challenge.
    The connection between a Web browser and a Web server is not a long-term connection.
    The Web browser connects to the server, retrieves the page, and then disconnects
    from the Web server. No sustained connection is kept between the server and your
    browser.


    To make matters more complicated, each time the browser connects to the Web server,
    the Web server doesn''t recognize the browser as having been to the site beforehand.
    The server has no easy way of recognizing the browser each time—and the librarian
    can retrieve the book because he or she can


    An analogy that works well is that of a conversation between a library patron
    and a librarian with no memory. The patron is allowed to ask only one question
    at a time. The patron can ask the librarian for a book—say, on Arizona—and the
    librarian can retrieve it. The librarian can fulfill simple requests easily. However,
    the patron cannot request another book on the same subject. The librarian would
    have no memory of the prior request and would be helpless. If the request were
    rephrased as "give me another book on Arizona," the librarian would still be unable
    to help because he or she might retrieve the same book on Arizona as he or she
    did for the first request.


    The only way to retrieve a second book on the subject would be to say, "I need
    another book on Arizona; I already have *Settling of the Southwest.* That request
    has enough information to state the problem and let the librarian know what''s
    not an appropriate response.


    Writing multipage forms for the Web uses the same solution: Each question/answer
    session needs to contain enough information so that the Web server can figure
    out what needs to be done and what has already been done. You can create such
    sessions in a few different ways; one of them—using hidden HTML fields—is presented
    in this hour.'
  merge: -1
  pgno: 509
- img_proc: true
  md: '# Hidden Fields


    The easiest way to Web forms "remember" information is to embed previous information
    in them by using hidden fields. Hidden fields are part of the HTML specification
    that allow fields and values to be part of an HTML form but not appear in the
    form when it''s rendered visually. In HTML, they''re written as follows:


    ```

    <input type="hidden" name="fullname" value="Pink Floyd/>

    ```


    If the preceding HTML were put into a form, a new name ("fullname") and value
    ("Pink Floyd") would be part of the form. If the form was submitted to a Perl
    CGI program, the param function would return a key and a value for the hidden
    field.


    # The Online Store


    For an example of how to use hidden fields, consider an online store that uses
    a series of Web pages to allow people to shop for items from an online catalog.
    Now, I''ll just walk you through the workings of a complex form. Later in this
    hour, I''ll present another complex form with code to create an online survey.


    > Watch Out!


    Do not use this example of an online store without implementing some kind of secure
    Web transaction, such as https. Consult your server''s documentation to set this
    up. Notice that this example does not contain any real personal information such
    as phone numbers or credit card numbers because hidden fields are just like regular
    HTML forms. No security is involved at all.


    The first page of the online store, illustrated in Figure 23.1, presents a list
    of featured items from the store.


    Figure 23.1. The first page of an online store.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_510_0.png)'
  merge: -1
  pgno: 510
- img_proc: true
  md: 'When the user clicks the Go to Store button, CGI program accepts the values
    from the form and then presents the full catalog, as shown in Figure 23.2.


    # Figure 23.2. Catalog of online store shown.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_511_0.png)


    The second page presents the full catalog. When the first page—with the featured
    items—was submitted, the CGI program accepted the values, and then as it was printing
    the HTML for the full catalog, it placed the selected quantities for the featured
    items on the new form as hidden fields.


    Each time the CGI program receives the values from the HTML form, the new page
    contains the old values in hidden fields, as well as the new values in the regular
    form elements.


    In this way, you avoid the "forgetful librarian" problem. When the form for the
    full catalog is submitted, the hidden fields in the form remind the CGI program
    which items were selected from the first form, as well as from the current form.


    If a third page is needed, the values from the first two pages can be squirreled
    away on the third page as hidden fields, as shown in Figure 23.3.


    # Figure 23.3. Shipping info for online store.'
  merge: -1
  pgno: 511
- img_proc: true
  md: '![](img/cf381f8bfc9aae35d8aa7efee5768d06_512_0.png)


    You should be aware of some problems with hidden fields on an HTML page. First,
    the values in the hidden fields can be seen by anyone. To see the values, users
    can simply view the HTML source for the page; most Web browsers have an option
    for viewing the source.


    Second, the values in hidden fields can be changed by remote users. Remote users
    can use a doctored Web browser or submit the form manually using HTTP. For example,
    the online store should not store the *prices* in hidden fields—only the quantities.
    The CGI program should look up the prices on the server side as they are needed
    for display.


    # By the Way


    When you are designing forms, take a look at how other people design theirs. This
    way, you learn whether they are using hidden fields to preserve information. Most
    Web browsers have a View Page Source selection. You should use it on any form
    you find particularly interesting to see how it was put together. *Do not* copy
    the form, however. Most of the time copying violates the original author’s copyright.'
  merge: -1
  pgno: 512
