    # Watch Out!


    Remember that every line of data read in a filehandle in Perl contains the end-of-line
    characters in addition to the text from the line. If you want just the text, use
    chomp on the input line to get rid of the end-of-line characters.


    In a list context, the angle operators read in the entire file and assign it to
    the list. Each line of the file is assigned to each of the list or array, as shown
    here:


    ```

    open(MYFILE, "novel.txt") || die "$!";

    @contents=<MYFILE>;nclose(MYFILE);

