  md: "# Making a Stricter Perl\n\nPerl is a permissive language. It doesn't get in\
    \ your way; it allows you to just get your work done without complaining too much\
    \ about what your code looks like. However, you can also tell Perl to be a bit\
    \ strict about your code. Perl can help you avoid silly mistakes if you are using\
    \ the switch on the command line—or on the #- line. Perl warns you when you're\
    \ using undefined variables, by a variable name once, and so on.\n\nIn large software\
    \ projects, and as your projects get larger and larger, it's nice to have Perl\
    \ keep you yourself in line. In addition to using the -w switch, you can tell\
    \ the Perl interpreter at compile time to turn on more warnings. You do so by\
    \ using use strict:\n\n```\nuse strict;\n\nsub mysub {\n\n    my $x;\n\n:\n}\n\
    \nmysub();\n```\n\nThe use strict statement is actually called a compiler directive.\
    \ It tells Perl to flag the following situations as runtime errors that point\
    \ out in the current block or file:\n\n+   - Attempts to use variable names (other\
    \ than special variables) that are not declared with my\n- Attempts to use a base\
    \ word as a function name when the function definition hasn't been seen yet\n\
    - Other potential errors\n\nThe use strict directive, for now, helps you avoid\
    \ the last two problems. Having Perl flag variables not declared with my prevents\
    \ you from using a global variable when you actually intend to use a private variable;\
    \ it's a way of helping you write more self-contained code and not rely on variables.\n\
    \nThe last trap that use strict catches is of bare keywords. Examine this code:\n\
    \n```\n$var=value;\n```\n\nIn this case, do you mean for value to be interpreted\
    \ as a subroutine call, as a string (but you forgot the"
