    Most of the program in Listing 14.2 is similar to the one shown in Listing 14.1,
    with the following differences.


    Line 7: The filename passed is tested to ensure it is a regular file. Remember,
    this subroutine gets called for both drives and directories.


    Lines 9-11: The filename is checked to see whether it .tmp at the end of the name.
    If so, the file is deleted with unlink.


