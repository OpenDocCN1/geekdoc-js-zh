    # What Truth Means to Perl


    Up to this point, you''ve been reading about "if this expression is true..." or
    "...evaluates to true...", but you haven''t seen any formal definition of what
    Perl thinks "true". Perl has a few short rules about what is true and what the
    rules actually make sense when you think about them for a bit. The rules are follows:


    +   - The number 0 is false.

    - The empty string "" and the string "0" are false.

    - The undefined value undef is false.

    - Everything else is true.


    Make sense? The only other point to remember is that when you''re testing an expression
    to see whether it''s true or false, the expression is simplified—functions are
    called, operators are applied, math expressions are reduced, and so on—and converted
    to a scalar value for evaluation to determine whether it is true or false.


    Think about these rules, and then take a look at Table 3.3. Try to guess whether
    the expression is true or false before you look at the answer.


    # Table 3.3. True or False Examples


    | Expression | True or False? |

    |---||

    | 0 | False. The number 0 is false. |

    | 10 | True. It is a nonzero number and therefore true. |

    | 9>8 | True. Relational operators return true or false, as you would expect.
    |'
