  md: '# Hour 2. Perl''s Building Blocks: Numbers and Strings


    What You''ll Learn in This Hour:


    +   * Literal numbers and strings

    * Scalar variables

    * Operators


    Every programming language—and every human language—has a similar beginning: You
    have to have something to talk about. In Perl, numbers and strings are the basic
    unit of conversation, and these are called **scalars**.


    Every hour in this book deals in some way with scalars—increasing, decreasing,
    querying, collecting, clearing, separating, folding, sorting, saving, loading,
    printing, and deleting them. Scalars are Perl''s singular nouns; they can represent
    a word, a record, a document, a line of text, or a character.


    Some scalars in Perl can represent information that does not change over the life
    of the program. Some programming languages call these values **constants** or
    **literals**. Literal data is used for things that simply do not change, such
    as the value of $\pi$, the rate of acceleration of a body falling to Earth, and
    the name of the 15th President of the United States. If these values are needed
    by a Perl program, they would, at some point in the program, be represented by
    a scalar literal.


    The other kinds of scalars in Perl are those that change, called **scalar variables**.
    Variables hold data while you manipulate it. You can change the contents of variables
    because they merely act as handles for the data they represent. Variables are
    given names—convenient and easy-to-remember names, ideally—that enable you to
    refer to the data you are manipulating.


    This hour also introduces Perl''s operators. They are one kind of verb in the
    Perl language. Operators take Perl''s nouns and do the actual manipulations you
    need to write programs that perform useful tasks.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Literals


    Perl has two different types of scalar constants *literals*: numeric literals
    and string literals.


    # Numbers


    Numeric literals are numbers, and Perl accepts several different ways of writing
    numbers. All the examples shown in Table 2.1 are valid numeric literals in Perl.


    Table 2.1. Samples of Numeric Literals


    | Number | Type of Literal |

    | --- | --- |

    | 6 | An integer |

    | 12.5 | A floating point number |

    | 15. | Another floating point number |

    | .7320508 | Yet another floating-point number |

    | 1e10 | Scientific notation |

    | 6.67E-33 | Scientific notation (e or E is acceptable) |

    | 4_294_296 | A large number with underscores instead of commas |


    Numbers are expressed as you think they might be. Integers are just groups of
    consecutive digits. Floating-decimal numbers contain a decimal point in the correct
    position, even if there are no digits to the right of it. A floating-point number
    can be expressed in scientific notation as an exponent preceded by the letter
    (e or E) and a decimal number called the mantissa. The value of the scientific-notation
    literal is 10 raised to the power indicated by the exponent, multiplied by the
    mantissa; for example, 6.5536E4=65536.0 (Strictly speaking, a mantissa is the
    decimal part of a logarithm, where it serves the same purpose as it does here.)


    You cannot put commas in a numeric literal to improve readability, but you can
    use underscores where commas would normally appear. Perl removes the underscores
    when using the value.


    # Watch Out!


    Do not use a leading zero in front of a number, such as 010. To Perl, a leading
    zero means that the literal represents an octal number—base 8. Perl also allows
    you to use hexadecimal numbers—base 16 and binary numbers—base 2. More information
    on these is in the online documentation'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Strings


    String literals in Perl are sequences of characters, such as Hello, World. They
    can contain as much data as you want; have no real limit on their size except
    the amount of virtual memory in your computer. Strings can also contain any kind
    of data—simple ASCII text, ASCII with the high bits on, even binary data. Strings
    can be empty.


    In Perl you must enclose string literals, with very few exceptions, in quotation
    marks. This process is called quoting the string. The two primary ways of quoting
    strings are to use single quotation marks ('''') or double quotation marks ("").
    The following are some sample string literals:


    ```

    "foo!"

    ```


    ```

    ''Fourscore and seven years ago''

    ```


    ```

    "One fish,\nTwo fish,\nRed fish,\nBlue fish\n"

    ```


    ```

    "Frankly, my dear, I don''t give a hoot.\n"

    ```


    If you need to put another quotation mark inside your string literal? For example,
    the following string literal would make no sense to Perl:


    ```

    "Then I said to him, \Go ahead, make my day\"

    ```


    The quotation mark in front of the word Go marks the end of the string started
    by the first quotation mark, leaving the phrase Go ahead, make my day outside
    the string literal—in which case it would have to be valid Perl, which isn''t.
    To prevent this situation, you must use a backslash (\ in front of the quotation
    marks that are inside the string. A backslash inside a string literal tells Perl
    the character that follows should not be treated as Perl normally treats it—in
    this case, it should be handled as a character in the string literal rather than
    the marker for the end of the string literal. A backslash character in front of
    each quotation mark that you want Perl to treat as a character, as shown here:


    ```

    "Then I said to him, \"Go ahead, make my day.\\"

    ```


    The backslashes let Perl know that the quotation mark that follows is not the
    match for the first quotation'
  merge: -1
  pgno: 41
