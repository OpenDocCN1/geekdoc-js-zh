    5: sub wanted {

    6:   # Check to see if the filename is not a directory

    7:   if (-f $File::Find::name ) {

    8:     # Verify the filename ends in .tmp

    9:     if ($File::Find::name~/\.tmp$/i) {

    10:      print "Removing $File::Find::name";

    11:      unlink $File::Find::name;

    12:    }

    13: }

    14: }

