  md: '# # DBM Files


    One of the simplest ways for your Perl program to remember data in an organized
    way is the use of DBM files. A DBM file is a file that''s connected to a Perl
    hash. To read and write a DBM file, simply manipulate a hash, as you''ve been
    doing since Hour 7, "Hashes."


    To tie a hash to a DBM file, use the Perl function dbmopen, as shown here:


    ```

    `dbmopen(hash, filename, mode)`

    ```


    The dbmopen hash to a DBM file. The filename you supply creates one or two different
    files on your disk with names that are a variation on filename:filename.pag, filename.dir,
    or filename.db. Perl uses these files to store the hash. These files are not text
    files, and you should not attempt to use an editor on them. Also, if one of the
    files is empty, or very large relative to the amount of data in it, don''t worry
    about it; that''s normal.


    The mode is the permissions on the two DBM files that Perl creates. Recall that
    permissions were discussed in the section "A Course in File Permissions" in Hour
    10, "Files and Directories." For Unix, a sensible set of permissions; they control
    who can access your DBM files. For example, 0666 allows everyone read and write
    access to your DBM files. 0644 allows you to read and write the files, but others
    to read them. For Windows, you can simply use 0666, because you don''t have any
    file permissions to worry about.


    The dbmopen function returns true the hash has been successfully tied to the DBM
    file; it returns false otherwise. Now consider this example:


    ```

    `dbmopen(%hash, "dbmfile", 0644) || die "Cannot open DBM dbmfile: $$";`

    ```


    The preceding statement is executed, the hash %hash is connected to a DBM file
    called dbmfile. Perl creates pairs of files on your disk, called dbmfile.pag and
    dbmfile.dir, to keep the hash in. If you assign a value to the hash, as shown
    here, Perl updates the DBM files with that information:


    ```

    `$hash{feline}="cat";

    ```


    ```

    `hash{canine}="dog";

    ```'
  merge: -1
