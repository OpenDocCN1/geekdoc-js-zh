  md: '# New Ways with Arrays


    In the following section, we will discuss a set of array functions that make several
    powerful data structures possible in Perl.


    # A List as a Stack


    Until now, lists (and arrays) have been presented as linear arrangements of data
    with indexes that make it possible to access each element, as shown here:


    | 0 | 1 | 2 | 3 | 4 | 5 |

    |---|---|---|---|---|--|

    | Apple | Peach | Pear | Plum | Mango | Guava |


    Use your imagination for a moment and imagine the array elements piled up vertically
    with the element having the highest index at the top, as shown here:


    | Guava |

    | Mango |

    | Plum |

    | Pear |

    | Peach |

    | Apple |


    Notice that there are no index numbers in this figure. The reason is that the
    functions we will discuss here are concerned with only the top and the bottom
    of the array, not with anything in the middle. In computer terminology, this list
    is called a stack. Stacks are useful for accumulating tasks that you want in order.
    A good example is a game of Klondike solitaire (like the Solitaire game often
    installed with (Windows)). Each of the seven piles of cards represents a stack.
    Initially, cards are placed on the stack face down. As they are needed, they are
    turned over and removed from the top of the stack, or additional cards can be
    placed on top of the newly turned-over cards, but cards cannot be removed or inserted
    in the middle of the stack or at the bottom.'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'Stacks in Perl are (usually) implemented with arrays. To place items on top
    of a stack, you use the push function. To remove from the top of the stack, you
    use the pop function.


    A stack implemented as a Perl Array can also be modified from the bottom, dealing
    with the bottom of the cards. The shift function removes elements from the bottom,
    and unshift adds elements to the bottom of the stack. All four operations are
    shown here:


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_227_0.png)


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_227_1.png)'
