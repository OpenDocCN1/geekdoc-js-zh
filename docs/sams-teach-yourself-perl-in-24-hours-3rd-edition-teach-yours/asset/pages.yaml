- img_proc: true
  md: 'It''s the same word each time, but the meaning has changed. It becomes a noun,
    an adjective, and a different kind of noun depending on how it''s used in a sentence.


    Perl is also sensitive to context. Functions and operators in Perl can behave
    differently depending on what context they are used in. The most important contexts
    in Perl are list context and scalar context.


    As you''ve seen, you can use one operator—the equals sign—to perform assignment
    with both arrays and scalars. The type of expression (list or scalar) on the left
    side of the assignment operator determines what context the things on the right
    side are evaluated in, as shown in the following lines of code:


    ```

    $a=$b;

    # Scalar on the left: this is scalar context.

    @foo=@bar;

    # Array on the left: this is list context

    ($a)=@foo;

    # List on the left: this is also list context.

    $b=@bar;

    # Scalar on the left: this is scalar context.

    ```


    The last line is interesting, because it puts an array into scalar context. As
    was stated in the previous section, evaluating an array in a scalar context returns
    the number of elements in the array.


    # More about the Size and End of an Array


    Observe $a $b in the following few lines of code; they do almost the same thing:


    ```

    @foo=qw( water cola juice lemonade );

    $a=@foo;

    $b=$#foo;

    print "$a\n";

    print "$b\n";

    ```


    At the end of this code, $a contains the number 4, and $b contains the number
    3. Why the difference? $a is @foo evaluated in a scalar context, and it contains
    the number of elements. $b, on the other hand, is set to the index of the last
    element, and indexes start counting at 0.'
