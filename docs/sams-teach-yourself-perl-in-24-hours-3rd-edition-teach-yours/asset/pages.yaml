  md: 'whose contents aren''t important; whoever holds a lock on that file can proceed.

    To use a semaphore, all you need a filename that can be used as a semaphore and
    a couple of functions to lock and unlock the semaphore file, as shown in Listing
    15.3. This is not a complete program; it is meant to be included as any of other
    programs.


    # Listing 15.3. General-Purpose Locking Functions


    ```

    1: use Fcntl qw(:lock);

    2: # Any file name will do for semaphore.

    3: my $semaphore_file="/tmp/sample.sem";n4:

    5: # Function to lock (waits indefinitely)

    6: sub get_lock {

    7:     open(SEM, "$semaphore_file")

    8:     || die "Cannot create semaphore: $!"

    9:     lock(SEM, LOCK_EX) || die "Lock failed: $!"

    10: }

    11:

    12: # Function to unlock

    13: sub release_lock {

    14:     close(SEM);

    15: }

    ```


    These locking functions can surround any code that you do not want to be run concurrently,
    even if that code has nothing to do with reading or writing files. For example,
    this snippet—even if run by several processes at the same time—allows only one
    process at a time to print a message:


    ```

    get_lock();      # waits for a lock.

    print "Hello, World!\n";

    ```'
