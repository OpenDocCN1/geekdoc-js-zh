    # Recursion


    You will probably run into a special class of subroutines sooner or later. These
    subroutines actually call themselves to do their work. They are called recursive
    subroutines.


    Recursive subroutines are used whenever tasks can be broken down into smaller
    and smaller tasks. One example of a recursive task is searching a directory tree
    for a file. After searching the topmost directory, as subdirectories are found,
    these directories must be searched. And within those directories, if subdirectories
    are found, these directories must be searched. You should begin to see a pattern
    here:


    Another recursive task is computing factorials, which are frequently used in statistics.
    For example, the number of ways the six letters ABCDEF are arranged is 6-factorial,
    written 6! in mathematics. The factorial of an integer is the product of that
    integer and all the smaller integers up to 1. So the factorial of 6 is 6x5x4x3x2x1,
    or 720, and the factorial of 5 is 5x4x3x2x1, or 120. Notice that 6! is equal to
    65!. One way to compute the factorial of 6 is to compute the factorial of 5 and
    multiply by 6. To compute the factorial of 5, you compute the factorial of 4 and
    multiply by 5, and so on. On the first, hand is just 1. The factorial of 0 is
    also defined as 1, so 1! equals 0!. This leads to a recursive subroutine for computing
    factorials, which is shown in Listing 8.3.


    # Listing 8.3. Factorials


    ```

    1:  sub factorial {

    2:    my ($num)=@_;

    3:      return(1) if ($num <= 1);

    4:      return($num * factorial($num - 1));

    5:  }

    6:  print factorial(6);

    ```


    Line 2: The argument to the factorial() subroutine is copied to $num, which is
    declared private to the subroutine.


    Line 3: Every recursive subroutine needs to have a termination condition. That
    is, there needs to be some argument value at which the subroutine no longer calls
    itself for an answer.'
