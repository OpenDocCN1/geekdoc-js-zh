    checklist. Verify that Perl is actually installed there using is or dir in FTP
    or.


    +   - If you used FTP to transfer the CGI program to the server, you may not have
    used ASCII mode for the transfer. Moving a script written in Windows to a Unix
    server—and vice versa—in binary mode does not work.


    +   - The permissions are not correct on the CGI program (Unix). See the description
    of Forbidden in the "Server Problems" section.


    Log entry: Can''t locate CGI.pm in @INC...


    Possible causes: The Perl installation is incomplete, corrupt, or very old. Perl
    is apparently unable to locate the CGI module, which is a standard part of the
    Perl installation. You might need to reinstall the module or contact your system
    administrator to have or her reinstall Perl. See Appendix A.


    Log entry: Syntax error, warning, Global symbol requires, and so on


    Possible causes: Your Perl program apparently has a typo or incorrect syntax.
    Follow the instructions in the "Is It Your CGI Program?" section to determine
    the problem.


    Log entry: Premature end of script headers


    Possible causes: This catch error message describes any situation in which your
    script is run, and the Content-Type header—printed by the CGI module''s header
    function—is not the first thing emitted by the script. Sometimes a secondary message
    appears in the log file, immediately before or after this one. The other message
    may be more helpful in determining what went wrong. Try these solutions:


