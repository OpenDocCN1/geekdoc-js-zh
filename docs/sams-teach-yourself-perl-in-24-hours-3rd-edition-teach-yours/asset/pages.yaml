  md: 'Systems For Unix—Linux, in particular—the following snippet works:


    ```

    # Last lines of df -k . reports something like this:


    # Filesystem      1024-blocks Used  Available Capacity on

    # /dev/hd1       938485     709863 180139      80%      /

    # And the 4th field is the number of free 1024K disk blocks


    # This format may be particular to Linux.


    my(@dir, $free);


    @dir=`df -k` `.


    $free=(split(/\s+/), $dir[$dir])[3]);


    $free=$free*1024;

