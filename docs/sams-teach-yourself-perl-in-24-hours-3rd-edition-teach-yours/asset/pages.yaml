  md: 'continues running program until it''s all done. When it''s finished with your
    program, the Perl interpreter exits and returns control to your operating system.


    Now let us look at how the hello program is "run"


    # Perl Play-by-Play


    The first line of the hello program is


    ```

    #!/usr/bin/perl

    ```


    To Perl, anything following a # on a line is considered a comment line. A comment
    is something that Perl ignores. The #! on the first line of a program is different
    in some cases. The pathname—/usr/bin/perl—is the path to the Perl interpreter.
    If a Unix file begins with #! followed by the path of an interpreter is executable,
    Unix knows that is a program (rather than a shell script) and how to interpret
    it. See the Q&A section at the end of the hour for an explanation of how to run
    programs.


    Some Web servers can execute Perl programs—Apache, for example—also pay attention
    to the #! line and can call the programs without having to use an explicit perl
    command.


    For now, just consider #! a comment line.


    The next line of the program is


    ```

    print "Hello, World!\n";

    ```


    A whole lot is going on here. This line marks off for Perl one thing to do.


    First, this line contains a function called print. The print function takes whatever
    follows it and displays it to your screen by default. What the print function
    is supposed to lasts all the way up to the semicolon (;).


    The semicolon in Perl is a statement separator. You should put a semicolon between
    statements in your Perl program to show where one ends and the next begins.


    In this case, the print function displays the phrase Hello, World! \n at the end
    of the line tells Perl to insert a new blank line after it prints the phrase.
    The quotation marks around the phrase and the \n Perl that is a literal string,
    and not another function. Strings are discussed at great length next hour.'
  merge: -1
