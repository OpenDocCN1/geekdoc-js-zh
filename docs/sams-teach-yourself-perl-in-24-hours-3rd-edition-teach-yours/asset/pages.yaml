    # Why Do People Contribute?


    The last half of century programming, programmers have solved the same problems
    over and again. Searching, sorting, communicating, reading, writing—these problems
    have actually changed very little since the 1950s. Books on computer programming
    theory and management are still applicable after 20 or 30 years.


    Programmers are driven, ultimately, by solving interesting problems. Solving the
    same problems over and again (reinventing the wheel) is not only an interesting
    exercise and often results in inferior solutions. A typical frustration for programmers
    is to spend a long time and great deal of effort to solve a complex problem, only
    to discover that a simple and elegant solution works. This leads to programmers
    seeking to share code with one another. Sharing has the interesting side effect
    of creating better code because other programmers notice problems in your code
    that you do not.


    CPAN is an effort by the Perl community to save itself from unnecessary work.
    The modules are there to keep you from the frustrating experience of reinventing
    someone''s wheel.


    The quality in most of the CPAN modules is also very good because the modules,
    as well as Perl, are developed under the Open Source model of production. When
    you install a module on your system, you automatically have the source code for
    the module. You can examine the source yourself and—based on the license—use portions
    of the source for your own programs, modify the source, and contact the author
    with changes.


    On the surface, the idea of CPAN seems very communal, the actual reasons that
    authors contribute to CPAN are widely varied. Sometimes they contribute to help
    others with similar problems. Sometimes they'
