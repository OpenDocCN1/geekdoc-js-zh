  md: '# Hour 8. Functions


    What You''ll Learn in This Hour:


    +   - How to define your own functions and call them

    - How to pass values into functions and return values

    - How to write programs with use strict to enforce structure


    Almost all computer languages support *functions*. A function is a grouping of
    code statements that can be called by name to do some work and then return some
    value. You''ve been using functions throughout this book; for example, you''ve
    used `print`, `chomp`, `sort`, `open`, `close`, `split`, and so on. These functions
    are built into Perl.


    Perl also allows you to write your own functions. In Perl, Perl''s user-defined
    functions are called *subroutines*, or *subs*. Like Perl''s built-in functions,
    user-defined functions can take arguments and return values to the caller.


    Perl also supports the the concept of *scope*. Scope defines the set of variables
    that a given statement in the program can access as it is executed. Because of
    Perl''s scope features, you can write functions that behave autonomously from
    the rest of your program. Well-written functions can be reused in other programs.'
  merge: -1
