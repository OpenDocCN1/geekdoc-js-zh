  md: '# Introduction


    > "Any sufficiently advanced technology is virtually indistinguishable from magic."


    —Arthur C. Clarke


    Remember this well: There''s nothing magical about programming a computer.


    Like anything that seems magical, there''s always a trick to it—and programming
    is no different. All you need are some analytical thinking skills, the desire
    to learn, and some time to learn Perl. The best way to learn how to program a
    computer—or any task really—is to have a goal. Your goal could be spice up your
    Web pages, convert a program you already have to Perl, or to satisfy idle curiosity—it
    doesn''t really matter.


    Now, that you''ve established a goal and have thinking skills, what does this
    book do for you?


    This book will teach you the basics of the Perl programming language. You''ll
    learn enough Perl to do something useful. You will not be overwhelmed with details
    that, although interesting, will only get in your way and you''ll probably never
    use them again. Each new concept in this book is demonstrated by lots of working
    code examples. Go ahead—flip through the book and see.


    But why Perl? Almost every company that uses programming of some kind uses Perl.
    Perl is found in finance, manufacturing, genetics, the military, and every other
    application known to humankind. And, of course, Perl is used on the Internet and
    the World Wide Web. Perl isn''t going away any time soon, which is why learning
    it is an investment in your time that will pay off for years to come.


    It''s also possible to create really stunning Perl programs with just a small
    bit of code. Using a little bit of Perl to glue together other applications, languages,
    and technologies, you''ll be creating useful Perl programs in no time.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# How to Use This Book


    This book is divided into 24 segments that take roughly an hour to complete. You
    can work through the lessons in the space of a day (if you don''t plan to eat
    or sleep), or you can take your time and work through the hour lessons at your
    own pace.


    At the end of each hour, you''ll be able to accomplish a new set of tasks. The
    lessons contain clear explanations of the language features and how they work.
    In addition, each hour provides you with the opportunity for hands-on training,
    simply by following the steps described.'
