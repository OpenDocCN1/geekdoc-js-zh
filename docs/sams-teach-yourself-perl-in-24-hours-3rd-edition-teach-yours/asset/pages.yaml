- img_proc: true
  md: 'function in CGI module takes care of actually transmitting the cookie to the
    browser. This means you must create the cookie, by using cookie function, and
    then call the header function afterwards. You shouldn''t send any other kind of
    data to the browser after the cookie and the header have been sent.


    To create a cookie and send it to a browser in a CGI program, you can use a CGI
    program similar to this:


    ```

    #!/usr/bin/perl -w


    use CGI qw(:all);


    use strict;


    my $cookie=cookie(-name => ''Sample'',


    -value => ''This cookie contains no MSG'');


    # Transmit the cookie to the browser


    print header(-cookie => $cookie);

    ```


    After the preceding snippet has run, a cookie called Sample is set on the browser.
    The cookie contains the information ''This cookie contains no MSG''.


    # Watch Out!


    Actually, the cookie might not be set. Browsers can refuse to accept a cookie
    for many reasons. See "Problems with Cookies" later this hour.


    To retrieve cookies from the browser in your CGI program, you use the same function—cookie.
    When called without any arguments, as shown in the following examples, cookie
    returns a list of cookies that the browser has for your server:


    ```

    @cookie_list=cookie();


    # Returns names of all cookies set

    ```'
  merge: -1
  pgno: 540
- img_proc: true
  md: '```

    # Returns the value for a particular cookie

    $cookie_value=cookie($cookie_name);

    ```


    By default, the cookie is set on the browser, it is returned to any CGI program
    that resides on the same server. Only the server that sets the cookies can fetch
    these cookies. To view the Sample cookie previously created, you can use another
    CGI program:


    ```

    #!/usr/bin/perl -wT

    use CGI qw(:all);

    use strict;

    print header();

    # Print out the standard header

    print "<p>Sample''s value: ", cookie(''Sample''),</p>";

    ```


    The preceding snippets use cookie with one argument—the name of the cookie whose
    value you want to see. That value is retrieved and printed.


    The browser should retain the cookie until the browser is terminated. When the
    browser is restarted, the cookie Sample will be gone. If you want to make a more
    permanent cookie, see "Long Term Cookies" later in this hour.


    # By the Way


    Most browsers have an option to view the cookies as they''re being set. In Netscape,
    you can find the cookie viewing options under the Preferences selection on the
    Advanced tab. In Internet Explorer, the selection appears on the Advanced tab
    of the Internet Options dialog, and a radio button controls whether you can view
    cookies as they''re set.


    # Example: Using Cookies'
