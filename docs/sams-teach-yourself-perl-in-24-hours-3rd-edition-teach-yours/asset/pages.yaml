  md: '# Other Structures


    In the preceding section, you will learn how to create a basic Perl structure,
    a list of lists, by using references and arrays. Actually, an unlimited number
    of variations of arrays, scalars, and hashes can be combined to create more and
    more complex data structures, such as the following:


    +   * Lists of hashes

    * Hashes of lists

    * Hashes of hashes

    * Hashes that contain lists, which contain hashes, and so on


    There isn''t enough room in this book to describe all of these structures. However,
    the online documentation that comes with each Perl installation contains a document
    titled *Perl Data Structures Cookbook*. It is a very detailed but understandable
    description of each of these structures and many others. With each structure,
    the *Perl Data Structures Cookbook* details


    +   * Declaring your structure (literal representation)

    * Filling your structure

    * Adding elements

    * Accessing elements

    * Traversing the entire structure


    To view the *Perl Data Structures Cookbook,* at a command prompt, type `perldoc
    perldsc`.


