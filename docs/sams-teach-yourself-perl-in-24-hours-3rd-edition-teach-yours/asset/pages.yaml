  md: '# A Multipage Survey


    Surveys are common places to find forms that span several different Web pages.
    They''re sometimes too long to fit on a single page, and they can usually be broken
    up into categories.


    What follows is a simple multipage Web survey to find out aspects about your personality.
    This survey presents four different pages but could easily be changed to support
    as many pages as you would like. The four pages are as follows:


    +   * A series of general questions to find out what kind of personality you have

    * Some specific questions about your habits and a question based on an answer
    from the first survey page

    * A page that allows you to enter your name and comments about the survey

    * A "thank you" message that prints after the survey is complete


    The same CGI program is used to perform all four functions. It decides which page
    to open next, depending on which page it has displayed. The core of the survey
    program is shown in Listing 23.1.


    > Did you Know?


    By including the line


    ```

    use CGI::Carp qw(fatalsToBrowser);

    ```


    your CGI program''s die() messages, which might normally go to the Web server''s
    log file, are printed as part of the Web page. When you write longer CGI programs,
    this might help in debugging.


    The results of the survey are saved in a text file but are not displayed by this
    program at all. This program simply collects the survey answers and stores them.
    You will have to write another CGI program to display the results.


    # Listing 23.1. First Part of the Survey Program


    ```

    1: #!/usr/bin/perl -w

    2: use Fcntl qw(:flock);

    3: use CGI qw(:all);

    ```'
