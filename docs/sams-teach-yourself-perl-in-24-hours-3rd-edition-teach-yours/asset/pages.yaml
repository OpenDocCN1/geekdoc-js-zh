    The primary difference between double-quoting and single-quoting a string is that
    single-quoted strings are quite literal; every character in a single-quoted string
    (except the sequence \'') means exactly what it is there. In a double-quoted string,
    on the other hand, Perl checks to see whether variable names or escape sequences
