- img_proc: true
  md: 'For the past, system works the same under both architectures. The point to
    remember is that commands are fundamentally different from one OS to another.
    To get a list in MS-DOS, you use the dir command; to get a list under Unix, you
    use the ls. In rare cases—perldoc, for example—the commands are similar under
    Unix and MS-DOS.


    When the system function is running the external command, the output of that command
    is displayed on your screen as though your Perl program were printing it. If external
    command need input, the input comes from your terminal the same way your Perl
    program input from the terminal. The command run system inherits STDIN and STDOUT
    file descriptors, so the external command does I/O from the exact same place as
    your Perl program. Invoking fully interactive programs from system is possible.


    Consider the following example under Unix:


    ```

    $file="myfile.txt";

    system("vi $file");

    ```


    Now consider this example under Windows/MS-DOS:


    ```

    $file="myfile.txt";

    system("edit $file");

    ```


    Each of the preceding examples runs an editor on myfile.txt—vi for Unix and edit
    for DOS. The editor runs full screen, of course, and all the normal editor commands
    work. When the editor exits, control returns to Perl.


    You can use the system function to run any program, not just console-mode programs
    (text). Under Unix, this example runs a graphical clock:


    ```

    system("xclock -update 1");

    ```


    Under MS-DOS/Windows, the following example invokes a graphical file editor:'
