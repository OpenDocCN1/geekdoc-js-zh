    @trees=qw(oak cedar maple apple cherry pine peach fir);

    @trees[3,4,6];          # Just the fruit trees

    @conifers=@trees[5,7];  # Just the conifers

    ```


    # Finding the End of an Array


    Sometimes you need to find the end of the array—for example, to see how many trees
    are in the @trees array or to cut some trees out of the @trees array. Perl provides
    a couple of mechanisms for finding the end. The first is a special variable in
    the form ##arrayname. It returns the number of the last valid index of the array.
    Check out this example:


    ```

    @trees=qw(oak cedar maple apple cherry pine peach fir);

    ```'
