- img_proc: true
  md: '# Weather Station


    For your first Perl glue, you''re going to create your own weather application.
    You might be familiar with those desktop applications that run on the desktop
    toolbar and display the current temperature. You''re going to build your own (at,
    least, a week) in Perl.


    Your requirements will be the following:


    +   - Your data sources must be readily available, free (no money required), and
    freely redistributable (no license required).

    - You want this to be easy for users to use. They''ll supply the ZIP code, and
    you''ll figure out the rest.

    - You''d like at catch the current conditions (rainy, cloudy, sunny, and so on)
    and the temperature.


    Not too difficult, eh? Now you have got to construct how you''re going to get
    from the ZIP code to a weather report:


    +   - Hourly weather observations are available from NOAA (National Ocean and
    Atmospheric Administration) at http://www.nows.noaa.gov/data/current_obs. They''re
    arranged by station names, called METAR codes.

    - A list of airports, and their corresponding METAR codes is available from NOAA
    as well as http://www.nows.noaa.gov/data/current_obs/index.xml.

    - The U.S. Census Bureau maintains a database that roughly correlate a ZIP code
    to latitude and longitude. You can use the latitude and longitude to find the
    closest airport.


    So reversing your steps gives the procedure you need to write your program:


    +   1. Use the ZIP code to find out the latitude and longitude of where that ZIP
    code is from the U.S. Census Bureau.

    2. Take the list of airports and compute the distance between each airport and
    the ZIP code using a Great Circle formula—this is used to find the distance between
    two points on the surface of the Earth given latitude and longitude. Remember
    the closest airport and its METAR code.

    3. Use that METAR code to look up the weather at NOAA.

    4. Display the information you''ve collected.


    Let''s do this program in three different parts of. Of course, it should all be
    combined at the end into one large program.


    # Part 1: Finding Out Where You Are


    The first part of your problem is going from a ZIP code to a latitude and longitude.
    The U.S. Census Bureau maintains the U.S. Gazetteer Place and ZIP code database.
    To query the database, go to http://www.census.gov/cgi-bin/gazetteer and enter
    a ZIP Code. If I use 48220, the resulting web page is shown in Figure 20.1.


    Figure 20.1. US Census Bureau''s Gazetteer web interface.


    [View full size image]'
