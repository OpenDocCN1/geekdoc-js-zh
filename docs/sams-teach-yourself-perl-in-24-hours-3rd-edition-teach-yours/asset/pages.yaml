  md: '# More Operators


    Perl has many operators that there isn''t enough space in this book to document
    them all fully. (You can read about most of them in the "perl" manual page.) But
    for the remainder of this hour, you''ll read about the most commonly used operators
    and functions in Perl.


    # One-Operand (Unary) Operators


    Until now, all the operators you''ve read about take two operands—that is, two
    expressions, from whose values the operands make a new value in some way. For
    example, division (6/3) requires a dividend (6) and a divisor (3), multiplication
    (5*2) requires a multiplicand (5) and a multiplier (2), and so on. Another kind
    of operator, called a unary operator, takes only one operand. You''re probably
    familiar with one of example already—the unary minus returns its value with its
    sign reversed: negative if the operand is positive, positive if the operand is
    a negative number:


    ```

    6; # Six

    -6; # Negative six.

    -(-5); # Positive five, not negative five.

    ```


    Many of Perl''s unary operators are actually named operators; that is, instead
    of a symbol—like the -- for unary minus—they use a word. The parentheses around
    the operand with named operators are optional but are shown in Table 2.4 for clarity.
    Named unary operators in Perl look and act like functions (discussed in Hour 8,
    "Functions"), and their operands are called arguments—the term used for expressions
    that Perl act on.


    # Table 2.4. Some Named Unary Operators


    | Operator | Sample Usage | Result |

    |---|---||

    | int | int(5.6234) | Returns the integer portion of its argument (5). |

    | length | length("nose") | Returns the length of its string argument (4). |

    | lc | lc("ME TOO") | Returns its argument shifted to lowercase letters ("me too").
    |

    | uc | uc("hal 9000") | Returns its argument shifted to uppercase letters ("HAL
