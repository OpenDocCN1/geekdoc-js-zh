    seven lines of the statement are shown along with a description that shows what
    they came from (Employee) and what line or lines of the file they were found on
    (5 through 11).


    Last, you see debugger prompt DB<1>. 1 signifies that the debugger is waiting
    for its first command. The cursor waits at the debugger prompt for your command.


    At this point, your program is not running. The program is actually paused just
    before the first instruction -myemployees(, and so on. Whenever the debugger shows
    a statement from your program, it is about to be executed, not the last statement
    run.


    The debugger is now ready for your commands.


    # Basic Debugger Commands


    The first and most important—command you can give the debugger the help command.
    If you type h in the debugger prompt, all the debugger commands are printed. You
    can also use variations: h h prints a summary of commands and syntax, h cmd prints
    help for a specific command.


    The list of help commands is probably longer than your screen will allow, and
    the first few commands will probably scroll off to right. To make any debugger''s
    output display a screen at a time, put a | in front of the command. So, to see
    a screen at a time, the command is | h.


    The most-used feature of the debugger is the capability to run Perl an instruction
    at a time. So, continuing with the previous example, to go the next statement
    in your Perl program, use the debugger''s n


    ```

    main::Employee:5):            my employees=(

