  md: 'David has been written by Person 1. So Person 2 adds "Joy" to the array @PHONEEL,
    which does not contain "David." At the same time, Person 1 writes a copy of @PHONEEL
    to the database—which does contain "David."


    When Person 2''s instance of program finally makes it step 5, it overwrites the
    data with Person 1. The database updates with "Joy", but not "David"—clearly a
    bug.


    # Watch Out!


    The problem is actually worse than you learned; the preceding explanation is vastly
    oversimplified. The additional headers come from the fact that the writtenata()
    functions seemingly open and write the data all in one burst—but they don''t.
    Multiprocessing systems can easily stop a program in the middle of writing data,
    go run another program for a moment, and return later—milliseconds later, but
    nonetheless. Both programs can be writing to the same file, with different data,
    at the same time. This can cause your data file to become corrupted or erased.


    The kind of problem we have just seen a formal name; it''s called a race condition.
    That is, what gets stored in the file depends on which user "wins" or "loses"
    the race. Race conditions are difficult to debug in programs, because they come
    and go depending on how many instances of the program are running at the same
    time, and the bugs associated with race conditions aren''t obvious.


    Allowing multiple programs to update the data at the same time is a tricky position,
    but it can be handled using a mechanism called locks. File locks are used to prevent
    multiple instances of a program from altering a file at the same time.


    Locking poses several problems, but the foremost among them is that different
    operating systems and different kinds of file systems require different types
    of locking mechanisms. The next sections describe how to lock files to prevent
    this kind of disaster


    # Locking with Unix and Windows


    To lock files under Unix and Windows, you can use Perl''s flock function. The
    flock function provides an advisory locking mechanism. This means that any programs
    you need to access the file must also flock to make sure that no one is writing
    to the file at the same time. However, other programs can still modify the file;
    this is why the mechanism is called advisory locking, not mandatory locking.


    You''re familiar with one kind of advisory lock already: a traffic light. The
    signal is to prevent multiple vehicles from entering the same part of the intersection
    at the same time. But the signal works only everyone obeys it. The same holds
    true for file locks. Every program that can potentially access a file at the time
    must use flock to prevent an accident. An advisory lock doesn''t keep other processes
    from accessing the data; it prevents other processes only from obtaining a lock.


    The flock function takes two arguments—a filehandle and a lock type—as you can
    see in the following syntax:'
  merge: -1
  pgno: 353
- img_proc: true
  md: '```

    use Fcntl qw(:flock);


    flock(FILEHANDLE, lock_type);

    ```


    The flock function returns true if the lock is successful; it returns false otherwise.
    Sometimes calling flock causes your program to pause and wait for other locks
    to clear (more about this in a moment). The use Fcntl qw(:flock) allows you to
    use symbolic names for the lock_type instead of harder-to-remember members.


    There are two kinds of locks: shared and exclusive. Normally, you get a shared
    lock when you want to read a file and an exclusive lock when you want to write
    to it. If a process has an exclusive lock on a file, then the only lock is-no
    other process can have locks at all. But many processes can have shared locks
    at the same time as long as there are no exclusive locks. In such cases, it''s
    safe to have many processes reading the file at the same time as long as nobody
    is writing.


    Some possible values for lock_type are as follows:


    +   - LOCK_SH-- This requests a shared lock on the file. If another process has
    an exclusive lock on the file, then flock pauses the exclusive lock is cleared
    before taking out the shared lock on the file.

    - LOCK_EX-- This requests an exclusive lock on a file opened for writing. If other
    processes have a lock (either shared or exclusive), then flock pauses until those
    locks are cleared.

    - LOCK_UN-- This releases a lock, but it is rarely needed; simply closing the
    file writes out any unwritten data and releases the lock. Releasing the lock on
    a file that is still open can cause data corruption.


    # Did you Know?


    Locks with flock are released when you close the file or when your program exits—even
    if it exits with an error.


    Taking a lock on a file that you''re also trying to read or write can be tricky.
    Problems arise because opening a file and locking the file is at least a two-step
    process: You have to have the file before you can lock it. If you open a file
    with open(FH, "filename") and then get a lock with flock, you''ve modified the
    file (truncated with >) before you obtain the lock. This could potentially modify
    the file (by truncating it) while other process has a lock on it.


    Solving this problem involves called a semaphore file. A semaphore file is just
    a sacrificial file'
