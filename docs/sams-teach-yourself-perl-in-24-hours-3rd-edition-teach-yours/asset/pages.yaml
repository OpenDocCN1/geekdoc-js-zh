  md: '# Cookies


    In Hour 23, "Complex Forms," you learned how to make your web browser remember
    information between web pages by using hidden fields in HTML. You must understand
    this process because you might need to pass information from one instance of a
    CGI program to another. The only way to do this is to store a piece of information
    with the browser.


    Another way to store information with the browser is to use HTTP cookies. HTTP
    cookies are pieces of information passed between the browser and the CGI program
    during the HTTP connection. Using cookies can be a much more flexible method of
    storing information with a browser than using hidden HTML fields.


    You can think of a cookie as a movie theater ticket. You can go to the theater
    ticket booth and obtain a ticket for a subsequent showing. You can then leave
    the theater, come back, buy some popcorn, and do anything else like. When you''re
    ready to see the movie, present your ticket to the ticket-taker. The ticket-taker
    doesn''t know how, when, or why you purchased the ticket, but as long as you have
    it, the ticket-taker will let you the bearer admission to a subsequent showing.


    An HTTP cookie is simply an information packet that the CGI program asks the browser
    to hold. The packet can be reclaimed at any time by another CGI program or by
    the same program. Cookies are ever passed back to the server when regular HTML
    pages are requested. The cookie can contain any kind of information: information
    about multipage web forms, visitation information, user preferences, and so on.


    The cookie is transferred from the server to the browser whenever a CGI program
    requests that a cookie be created (see Figure 24.3); this process is called setting
    a cookie.


    Figure 24.3. Cookie going to the browser from a CGI program.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_538_0.png)


    The cookie can be later reclaimed by a CGI program to retrieve the information
    stored in the cookie, as illustrated in Figure 24.4.


    Figure 24.4. Cookie being returned to the server by the browser.'
  merge: -1
  pgno: 538
- img_proc: true
  md: "![](img/cf381f8bfc9aae35d8aa7efee5768d06_539_0.png)\n\n# # Why Is a Cookie\
    \ Called a Cookie?\n\nIn computing circles, cookie is a very old term. It refers\
    \ to any piece of information passed between routines or programs that enable\
    \ the holder of the cookie to perform some operation. Some kinds of cookies are\
    \ called **magic cookies** because they contain data's obscure and meaningful\
    \ only to the sender and the receiver of the cookie. CGI cookies are not magic.\n\
    \n# # How to Make Cookies\n\nTo create a cookie, you can use a CGI function called\
    \ cookie. The syntax of the cookie function you're concerned with is as follows:\n\
    \n```\n$$cookie_object=cookie(-name => cookie_name,           # Optional\n   \
    \                           -value => cookie_value,\n                        \
    \      -expires => expiration_date,      # Optional\n                        \
    \      -path => path_info,                 # Optional\n$$\n```\n\nThe cookie function\
    \ takes arguments in you haven't seen yet, but is quite common in Perl modules.\
    \ Each argument in the call to cookie has a name, so you don't have to remember\
    \ the order in which the arguments occur; they simply get named in whatever order\
    \ you decide to use them.\n\nWhen called with the first syntax, the cookie function\
    \ returns a cookie, which should be stored in a scalar variable and then be given\
    \ to the CGI module's header function to be sent to the browser. The only required\
    \ argument to create a cookie is the -value argument. The -name argument allows\
    \ several cookies to be sent to the server at one time, which can be retrieved\
    \ individually or as a group. The -expires and path are discussed in the next\
    \ section."
