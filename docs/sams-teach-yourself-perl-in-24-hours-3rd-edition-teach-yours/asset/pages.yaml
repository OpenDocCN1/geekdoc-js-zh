  md: '# Getting a Directory Listing


    The first step in obtaining directory information from your system is to create
    a directory handle. A directory handle is something like a filehandle, except
    that instead of a file''s contents, you read the contents of a directory through
    the directory handle. To open a directory handle, you use the opendir function:


    ```

    opendir dirhandle, directory

    ```


    In this syntax, dirhandle is the directory handle you want to open and directory
    is the name of the directory you want to read. If the directory handle cannot
    be opened—because you don''t have permission to read the directory, the directory
    doesn''t exist, or because of some reason—opendir returns false. Directory handle
    variable names should be constructed similarly to filehandles—using the rules
    for variables named out Hour 2. "Perl''s Building Blocks: Numbers and Strings”—and,
    like filehandles, they should be uppercase to avoid conflicts with Perl''s keywords.
    The following is an example:


    ```

    opendir(TMPDIR, ''/tmp'') || die "Cannot open /tmp: $!";

    ```


    All the examples in this hour use forward slashes (/) in the Unix style because
    it is less confusing than the backslashes (\) used by Windows and MSDOS and works
    just as well with operating systems as with Unix.


    Now that the directory handle is open, you use the readdir function to read it:


    ```

    readdir dirhandle;

    ```


    In a scalar context, readdir returns the next entry in the directory, or undef
    if none are left. In a list context, readdir returns all the (remaining) directory
    entries. The names returned by readdir include files, directories, and (for Unix)
    special files; they are returned in no particular order. The directory entries
    . and .. (representing the current directory and its parent directory) are also
    returned by readdir. The directory entries returned by readdir do not include
    the pathname part of the name returned.


    When you''re done with the directory handle, you should close it by using closedir:'
