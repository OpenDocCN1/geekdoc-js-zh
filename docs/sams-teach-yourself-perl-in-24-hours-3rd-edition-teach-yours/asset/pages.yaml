    Notice the difference between this snippet and the previous one. The utility under
    Windows to find the space is dir; under Unix, it is df -k . The last line of output
    of df -k is split apart, and the fourth field is placed in $field Output of df
    vary slightly between Unix systems; usually, the number of fields is reported,
    or they''re in their order. Your Perl could easily compensate by simply picking
    a different field.


    Now you have two completely different routines to find free disk space. You can
