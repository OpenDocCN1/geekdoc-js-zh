    or an underscore character (_) after the type identifier. The first character
    of a variable name cannot be a number, though.

    - Variable names are case sensitive. This means that upper- and lowercase are
    significant in variable names. Thus, each of the following represents a different
    scalar variable:


    ```

    $value

    ```


    ```

    $VALUE

    ```


    ```

    $Value

    ```


    ```

    $valE

    ```


    Perl reserves—in contrast to some other languages—do not have to be declared or
    initialized in any way before you use them. Variables such as `$_`, `""`, `$/`,
    `$$` are **special variables** and should not be used as normal variables in your
    Perl programs. The purpose of these special variables will be covered later.


    Scalar variables in Perl do not have to be declared or initialized in any way
