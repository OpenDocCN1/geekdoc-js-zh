    is the last element of @array, $array[-2] is the next to the last element, and
    so on.


    # Learning More about Context


    What is *context*? Context means the things that surround an item of interest
    to help define what that item means. For example, seeing a man in surgical scrubs
    can have different meanings depending on where he is: In a hospital, the fact
    that the man is wearing scrubs might mean he''s a doctor; at a Halloween party,
    he could be another party guest in costume.


    Human language uses context to help determine the meaning of words. For example,
    the word *level* can have several different meanings depending on how it''s used
    and what context it''s in:


    +   - The carpenter used a level to hang the door straight.

    - The moderator spoke in a level tone.

    - The water in the pool was at waist level.'
