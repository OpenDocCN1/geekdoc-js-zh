    Literal lists are usually used to initialize some other structure: an array or
    a hash. To create an array in Perl, you can simply put something into it. With
    Perl, unlike other languages, you don''t have to tell it ahead of time that you''re
    creating an array or how large the array is going to be. To create a new array
    and populate it with a list of items, you could do the following:


    ```

    @boys=qw( Greg Peter Bobby );

