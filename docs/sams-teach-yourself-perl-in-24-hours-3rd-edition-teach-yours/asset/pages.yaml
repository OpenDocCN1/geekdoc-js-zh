    # Working with Other Variables


    In Listing 6.2, the weight gathered from the user is stored in $_ and manipulated
    with substitution operators and matching operators. This listing has a problem,
    however: $_ isn''t exactly the best variable name to store "weight". It''s not
    intuitive for starters, for $_ might get altered when you least expect it.


    Watch Out!


    In general, storing anything in $_ for long is playing with fire; eventually,
    you will get burned. Many of Perl''s use $_ as a default argument, and some of
    them modify $_ as well. $_ is Perl''s general-purpose variable, and trying to
    keep a value in $_ for very long (especially after what you learn in Hour 8, "Functions")
    will cause bugs eventually.


    Using a variable $weight would have been better in Listing 6.2. To use the match
    operator and substitution operator against variables other than $_ you must bind
    them to the variable. You do so by using the binding operator, ~=, as shown here:


    ```

    $weight="185 lbs";n

    $weight=~s/ lbs;//    # Do substitution against $weight

    ```


    The =~ operator doesn''t make assignments; it merely takes the operator on the
    right and causes it to act on the variable to the left. The entire expression
    has the same value as it would if $_ were used, as you can see in this example:


    ```

    $poem="One fish, two fish, red fish";

