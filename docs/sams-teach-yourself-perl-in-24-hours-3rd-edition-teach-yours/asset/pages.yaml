  md: "# The system() Function\n\nThe simplest way to run a command outside Perl is\
    \ to use the system function. The system pauses the Perl program, runs the external\
    \ command, and continues running your Perl program. The syntax for system is\n\
    \n```\nsystem command;\n```\n\nwhere command is the command that you want to run.\
    \ The return value from system is 0 if everything goes okay or nonzero if a problem\
    \ occurs. Notice that this result is backward from the normal Perl values of true\
    \ and false.\n\nThe following is an example of system under Unix:\n\n```\nsystem(\"\
    ls -lF\");    # Print a file listing\n# print system's documentation\nif ( system(\"\
    perldoc -f system\") ) {\n    print \"Your documentation isn't installed correctly!\\\
    n\";\n}\n```\n\nThis next example shows system under MS-DOS/Windows:\n\n```\n\
    system(\"dir /w\");    # Print a file listing\n# print system's documentation\n\
    if ( system(\"perldoc -f system\") ) {\n    print \"Your documentation isn't installed\
    \ correctly!\\n\";n\n}\n```"
  merge: -1
