  md: '3: If you export a subroutine name from a module into a program that already
    has a subroutine by that same name, which one runs when you call the subroutine?
    (Try it and see.)


    +   a.


    The subroutine from the module


    +   b.


    The subroutine from the main program


    +   c.


    Neither; the program won''t compile.


    +   d.


    Neither; the program will compile, but it will crash when you call the ambiguous
    function.


    # Answers


    A1: Generally, anything not declared with my, and not following a package declaration,
    is in the namespace main.


    A2: All of the above. In Perl, a module must exist in a statement that has a true
    value. The only false values in Perl are zero, undef, and the empty string. The
    traditional way is with 1;


    A3: All statements are processed during compile-time. Momentarily, the module''s
    subroutine would have taken precedence. Later in the compilation it is replaced
    with the local version of the subroutine.


