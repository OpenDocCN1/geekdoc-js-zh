  md: 'To solve this problem, you can use Perl''s regular expressions to group parts
    of the pattern with parentheses, (), as shown here:


    ```

    /(fr|b|l|fl|cl)og/

    ```


    You need parentheses to have groups within groups. For example, you could write
    the preceding expression as /((fr|b)(f|c)?)/og/ as well.


    In a context, the match operator returns a list of the portions of the expression
    matched that were in parentheses. Each parenthesized is a return value to the
    list, or 1 if the pattern contains no parentheses. Check out this example:


    ```

    $="apple is red";

    ```


    ```

    ($fruit, $color)=/(.*)\sis\(.*)/

    ```


    In this snippet, the pattern matches anything (as a group), and then whitespace,
    the word is, more whitespace, and then anything (as also a group). The two grouped
    expressions are returned to the list on the left side and assigned to $fruit and
    $color.


    # Anchors


    The last metacharacters (I bet you thought they''d never end) are the anchors.
    You use anchors to tell the regular expression engine where you want to look for
    the pattern—at the beginning of a string or at the end.


    The first of these anchors is the caret (^). The caret at the beginning of a regular
    expression causes the expression to match only at the beginning of a line. For
    example, /^video/ matches the video only if it occurs at the beginning of a line.


    Its counterpart is the dollar sign ($). The dollar sign at the end of a regular
    expression causes the pattern to match only at the end of the line. For example,
    /earth$/ matches earth, but only at the end of a line.


    # Patterns


    | Patterns | What They Do |

    | --- | --- |

    | /^Help/ | Matches only lines that begin with *Help*. |

    | /^Frankly.*darn$/ | Matches lines that begin with *Frankly* and end in *darn*.
    Everything in between is matched as well.'
