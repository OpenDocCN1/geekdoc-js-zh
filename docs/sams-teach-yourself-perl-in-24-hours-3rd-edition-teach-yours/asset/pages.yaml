- img_proc: true
  md: "A3: Yes you can. A value that can be passed to flock causes it to not pause.\
    \ (It is called nonblocking flock.) To find out whether a flock would pause, put\
    \ a |LOCK_NB after the lock type like this:\n\n```\nuse Fcntl qw(:flock);\n\n\
    # Attempt to get an exclusive lock, but don't wait for it.\nif (not flock( LF,\
    \ LOCK_EX|LOCK_NB )) {\n    print \"Could not get the lock: !$\";\n}\n```\n\n\
    You can even wait for a lock for a while, and then print a message if you don't\
    \ get it eventually:\n\n```\nuse Fcntl qw(:flock);\n\n$lock_attempts = 3;\nwhile\
    \ (not flock( LF, LOCK_EX|LOCK_NB )) {\n    sleep 5;      # Wait 5 seconds\n \
    \   $lock_attempts--; # Count down chances...\n    die \"Could not get lock!\"\
    \ if (not $attempts);\n}\n```"
