  md: '# Pipes


    Pipes in Unix and MS-DOS/Windows are used for connecting different processes together
    so that the output of one process becomes the input of the next. Consider the
    following set of commands, which would work in Unix (if you change the dir to
    ls) or MS-DOS:


    ```

    dir > outfile

    sort outfile > newfile

    more newfile

    ```


    The output of dir is collected in outfile. The sort is used to sort outfile, and
    the output from sort is stored in newfile. The more shows the contents of newfile
    a screenful at a time.


    Pipes allow you to perform that sequence, but without outfile and newfile, like
    this:


    ```

    dir | sort | more

    ```


    The output of dir is given to sort, which then sorts the data. The output from
    sort is then given to more for page-at-a-time display. No redirection (>) or temporary
    files are needed.


    This kind of command line is called a pipeline, and the vertical line between
    the commands is called a pipe. Unix relies heavily on pipes to connect its small
    utilities. MS-DOS and Windows support pipes but have fewer command-line utilities
    that work with them.


    Perl programs can participate in a pipeline in many ways. First of all, if you
    have a Perl program that accepts standard input, transforms it, and sends it to
    standard output, then you can write a command line to insert that Perl program
    into a pipeline, in the following example:


    ```

    dir /B | sort | perl Totaler | more

    ```


    In the preceding pipeline, Totaler could be a Perl program you write to print
    the sum of the directory listing and maybe some statistics, with the directory
    listing itself. If you''re using Unix, change the dir /B to ls -l, and the pipeline
    works as expected. Listing 11.1 contains the Totaler program.


    # Listing 11.1. Complete Listing for Totaler


    ```

    1: #!/usr/bin/perl

    2:

    3: use strict;

    4:   my($dirs,$sizes,$total);

    5:

    ```'
