  md: '# A Quick Tour


    What follows a quick tour of some of the modules already installed on your system
    as part of the core Perl distribution.


    # Exploring Files and Directories


    In Hour 10, you learned how to open directories and read lists of filenames contained
    within those directories. At that time, when the subject of reading subdirectories
    came up, you were told not to be concerned. Now you''ll learn how to traverse
    directories and subdirectories recursively.


    You might write a common program to find a particular file without knowing exactly
    what directory it''s in. For example, suppose you want to find a file named important.doc
    somewhere beneath the directory documents, as shown here:


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_322_0.png)


    This illustration shows a directory structure under a parent directory named documents.
    Finding a file somewhere under documents, using only opendir/readdir/closedir,
    is not easy. First, documents must be searched for the file. Then each of the
    directories under documents must be searched—accounting, misc, and personal—and
    then each directory under those directories, and so on.


    This is an old problem, solved again again by programmers over the last 30 years.
    Your only solution to it would be a waste of time. Naturally, the designers of
    Perl have included an easy solution: the File::Find module. To use the File::Find
    module in your program, simply enter the following in your program—preferably
    near the top:


    ```

    use File::Find;

    ```


    A new function called find then becomes available to you. The find function''s
    syntax is as follows:


    ```

    find subref, dirlist

    ```


    The second argument to find is a list of directories to search. The first argument
    is new to you; it''s a subroutine'
