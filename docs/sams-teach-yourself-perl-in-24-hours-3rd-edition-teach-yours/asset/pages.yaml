  md: '# Conventions Used in This Book


    Sams Teach Yourself Perl in 24 Hours uses a number of conventions that are consistent
    throughout this book:


    +   - Each hour begins with an overview of what you will learn.

    - Step-by-step instructions are preceded by a To Do icon.

    - Every hour ends with a summary and series of commonly asked questions and answers;
    hopefully, you''ll find the answers to your questions among them.


    In addition, these elements appear throughout the book:


