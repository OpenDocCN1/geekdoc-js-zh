  md: 'all at.


    Perl does not have a built-in function for figuring out what your current directory
    is—because of the way some operating systems are written, it''s not easy to tell.
    To find the current directory, you must use two statements Somewhere in your program—preferably
    near the beginning—you must use the statement use Cwd and then, when you want
    to retrieve the current directory, use the cwd function:


    use Cwd;


    ```

    print "Your current directory is: ", cwd, "\n";nchdir ''/tmp'' or warn "Directory
    /tmp not accessible: $!";nprint "You are now in: ", cwd, "\n";

    ```


    You have to execute the use Cwd statement only once; afterward, you can use the
    cwd function as often as necessary.


    # By the Way


    The statement use Cwd actually instructs Perl to load a module called Cwd that
    extends the Perl language with new functions, such as Cwd. If the preceding snippet
    returns an error Can''t locate Cwd.pm in @INC, or you don''t understand modules
    completely, dont worry about it you are right. Modules will be fully discussed
    in Hour 14, "Using Modules."


    # Creating and Removing Directories


    To create a new directory, you can use the Perl mkdir function. the mkdir function''s
    syntax is as follows:


    ```

    mkdir newdir, permissions;

    ```


    The mkdir function returns true if the directory newdir can be created. Otherwise,
    it returns false and sets $ to the reason mkdir failed. the permissions are really
    important only on Unix implementations of Perl, but may be used on all versions.
    For the following example, you use the value 0755; this value will be explained
    in the section "Unix Stuff" later in this hour. For MS-DOS and Windows users,
    just use the 0755; it''s good enough and will satisfy you a long explanation.'
