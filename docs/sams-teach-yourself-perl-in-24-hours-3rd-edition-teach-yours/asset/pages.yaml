  md: '# Hour 12. Using Perl''s Command-Line Tools


    **What You''ll Learn in This Hour:**


    +   - How to use Perl''s debugger

    - How to use command-line switches to write Perl programs


    Until now, the Perl-line interpreter has been a fairly simple program to use.
    You type a program into a file and then invoke the Perl interpreter to run your
    program. The Perl interpreter is much more flexible than this, however.


    Built into the interpreter is a debugger. The debugger allows you to play your
    Perl program like a videotape. You can rewind your program to the beginning, play
    it slow, play it fast, and freeze-frame it to examine the innards closely. The
    debugger is an often underutilized tool for finding problems in Perl programs.


    Perl can also run programs that are not typed into files. For example, you can
    run small programs directly from your system''s command prompt.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# What is the Debugger?


    The Debugger is a built-in feature of the Perl interpreter. It allows you to take
    any Perl program and step through that statement by statement. Along the way,
    you can examine variables, change them, let the program run for a while, interrupt
    the program, or start over again.


    From your program''s perspective, nothing is different. Input still comes from
    the keyboard, and output still goes to the screen. The debugger doesn''t know
    when it''s stopped or when it''s running. In fact, you can examine your program''s
    workings without disturbing them at all.


    # Starting the Debugger


    If you are a Macintosh user running Perl, to use the debugger you need only select
    Debugger from the Script menu, and a debugger window opens with a prompt for you.


    Under any other operating system, to start the debugger you must be at your system''s
    command prompt. For DOS and Windows users, this means the standard MS-DOS C:\prompt.
    For Unix users, this means the prompt that you were presented when you logged
    in (usually % or $).


    All the examples in this section use the Employee program from Listing 9.1 in
    Hour 9, "More Functions and Operators.\ You might find it handy to put a bookmark
    on that page and flip back and forth for reference.


    To start the debugger at the prompt—an MS-DOS prompt is used for the example—type
    this line for reference:


    ```

    C:\ perl -d Employee

    ```


    The -d switch causes perl to start up in debugging mode; the program to be debugged
    is also indicated on the command line. Some messages giving version information
    are then displayed, as shown here:


    ```

    Loading DB routines from perl5db.pl version 1.0401

    ```


    ```

    Emacs support available.

    ```


    ```

    Enter h or `h'' for help.

    ```


    ```

    main::(Employee:5):    my @employees=(

    main::(Employee:6):    ''Smith,Bob,123101,9.35,40'',

    ```'
