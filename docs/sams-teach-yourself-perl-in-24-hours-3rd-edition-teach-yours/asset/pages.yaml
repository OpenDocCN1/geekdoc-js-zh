  md: '# # Locking


    Imagine that you''ve written a wonderful Perl program and that the whole world
    wants to use it. If you''re on a Unix or Windows NT machine, even on a Windows
    95 or 98 machine, more one person might be running your program *at the same time*.
    Or, your program may be put onto a Web server, and it''s run so frequently that
    instances of your program overlap.


    Now suppose that your program uses a database for its work, such as the text file
    database you just described—but this discussion applies to any kind of database.
    Look at the following code, which uses functions described in the preceding section:


    ```

    chomp($newrecord=<STDIN); # Get a new record from the user

    @PHONEL=readdata(); # Read data into @PHONEL

    push(@PHONEL, $newrecord); # Put the record into the array

    writata(@PHONEL); # Write out the array

    ```


    Looks harmless, doesn''t it? But if two people run your program at nearly the
    same time and trying different records, it''s not harmless at all; it''s quite
    buggy. In the following diagram, this particular set of Perl statements is run
    nearly the same time, on the same system, by two different people (Person 2 is
    working slightly behind Person 1). Watch carefully.


    | Time Sequence | Person 1 | Person 2 |

    |---|---|---|

    | 1 | $newrecord = "David 555-1212"; | | |

    | 2 | @PHONEL = readdata(); | $newrecord = "Joy 555-6611"; |

    | 3 | push(@PHONEL, $newrecord); | @PHONEL = readdata(); |

    | 4 | writata(@PHONEL); | push(@PHONEL, $newrecord); |

    | 5 | | writata(@PHONEL); |


    From Person 1''s perspective, the data is read in step 2, and the new record ("David")
    is added to @PHONEL in step 3 and written at step 4.


    From Person 2''s perspective, the data is read in at step 3, the new record ("Joy")
    is added to @PHONEL in step 4, and @PHONEL is written out in step 5.


    Here''s the bug: the data read in by Person 2 in step 3 does not contain the record
    "David." That record'
