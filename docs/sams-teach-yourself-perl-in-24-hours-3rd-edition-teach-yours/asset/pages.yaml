  md: 'If you''re proficient with a C compiler and the tools needed in a development
    environment—makefiles, shells, and so—you can take the Hard Way and build your
    own Perl from scratch. The source to the perl interpreter is free to look at,
    modify, and change to suit your needs; see Hour 16, "The Perl Community," for
    details. Building Perl under Windows is not easy and probably more hassle than
