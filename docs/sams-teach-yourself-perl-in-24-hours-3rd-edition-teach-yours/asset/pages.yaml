  md: '# Hour 10. Files and Directories


    What You''ll Learn in This Hour


    +   - How to get a directory listing

    - How to create and remove files

    - How to create and remove directories

    - How to get information about files


    Files in your operating system provides a convenient set of storage concepts for
    data. The OS enables a name to be given to the data (a filename) and provides
    an organizational structure, called a **file system**, so that you can find the
    data. Your computer''s file system organizes files into groups called **directories**—sometimes
    called **folders**. These directories contain files or other directories.


    This nesting of directories inside directories provides a treelike structure to
    the file system on your computer. Each file is part of a directory, and each directory
    is part of a parent directory. In addition to providing an organizational structure
    for your files, the operating system also stores data about file: when the file
    was last read, when it was modified, who created it, the current size of the file,
    and so on—called metadata (see Hour 5, "Working with Files"). This organization
    is true of almost all modern computer operating systems.


    In the case of the Macintosh (pre-Mac OS X), this structure still holds true,
    except that the top-level directory is called a Volume, and the subdirectories
    area is called Folders.


    Perl allows you to access this structure, modify the organization, and examine
    the information about the files. The functions that Perl uses for these tasks
    are all derived from the Unix operating system, but they work just fine under
    whatever operating system Perl happens to be running on. Perl''s file system manipulation
    functions are portable, meaning that if you use Perl''s to manipulate files and
    query them, you should have no problems running your code under any operating
    system Perl supports, providing that the directories are structured similarly.'
  merge: -1
  pgno: 232
