    # # What If You Can''t Find the Documentation?


    If you can''t find the documentation, only two things can be wrong. The first
    is you not looking in the right places. Perhaps the perdoc utility is installed
    in a directory that''s not in your shell path. Or your search path is overly restrictive.
    Hunt around for the perdoc utility, and add that directory to your shell''s PATH
    environment variable.


    The second reason is the documentation was removed, either by accident or malice.
    Perl''s installation includes documentation. You can''t install Perl without it.
    If the documentation isn''t there, a good argument could be made that Perl wasn''t
    properly installed or that it has been corrupted. Perhaps you—or the system administrator—should
    reinstall Perl. The documentation is an integral part of the Perl development
    environment, and without it some pieces of Perl will not function.


    If all else fails, and you can''t get a local copy of the documentation, you can
    fall back to the Web. On Perl''s distribution site (http://www.perl.com), you
    can access the standard set of documentation. Having actual documentation that
    came with your version of Perl would be better—tailor-made to your particular
    version and installation—but this online documentation will do in a pinch.'
