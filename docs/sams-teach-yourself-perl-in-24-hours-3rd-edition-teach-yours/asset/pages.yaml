  md: '# Quantifiers


    Until now, all the characters in patterns, whether text characters or metacharacters,
    have had a one-to-one relationship with characters in their target they were trying
    to match. For example, in /Simon/, S matches an S, i matches an i, m matches an
    m, and so on. A **quantifier** is a kind of metacharacter that regulates the regular
    expression how many consecutive occurrences of something to match. A quantifier
    can be placed after any single character or group of characters (you''ll learn
    more about details on this topic momentarily).


    The simplest quantifier is the + metacharacter. The + causes the preceding character
    to match at least once, or as many times as it can and still have a matching expression.
    Thus, /do+g/ would:


    | Match These | Not These | Why Not |


    | hounddog | badge | The required o is missing. |

    | hotdog | doofus | The g is missing. |

    | doingsower | Doogie | D is not the same as d. |

    | doooooogdog | pagoda | The d, o, and g do not appear in order. |


    The * metacharacter is similar to the + metacharacter, but it causes the preceding
    character to match zero or more times. In other words, /t*/ pattern means to match
    as many t''s as possible, but if none exists, that''s okay. Thus, /car*t/ would:


    | Match These | Not These | Why Not |


    | carted | carrot | The o introduces into the pattern, but the ed follows the
    pattern. |

    | cat | carl | The t in the pattern isn''t optional, but the r is. |

    | carritt | caart | The a in the pattern can''t be repeated, but the r can. |


    One step down from the * metacharacter is ?. The ? metacharacter causes the preceding
    character to be matched either zeros or once (but not more). So the pattern /c?/ola/
    causes a c to be matched if it''s available; otherwise, that''s okay. Then it
    is followed by o, and essentially, this pattern matches any string with ola in,
    if ola is preceded by a c, that string is matched as well.


    The difference between ? and * metacharacters is that /c?/ola/ would match cola
    and ola, but not ccola. The extra c requires two matches. The pattern /c*ola/
    would match cola, ola, and ccola because the c can be repeated as many times as
    necessary, not just zero or one.


    If matching zero, one or more occurrences of a pattern isn''t specific enough
    for you, Perl allows you to match exactly as many occurrences as you need using
    braces, {}. The quantifier with braces has the following format:'
  merge: -1
  pgno: 139
- img_proc: true
  md: '```

    pat{n,m}

    ```


    Here, n is the minimum number of matches, m is the maximum number of matches,
    and pat is the character or group of characters you''re trying to quantify. You
    can omit either n or m, but not both. Consider the following examples:


    +   - /x{5,10}/ occurs at least 5 times, but no more than 10.

    - /x{9}/ occurs at least 9 times, possibly more.

    - /x{0,4}/ occurs up to 4 times, possibly not at all.

    - /x{8}/ must occur exactly 8 times.


    A common idiom in regular expressions is *. You can use it to match anything—usually
    anything between two things that you''re interested in. For example, /first.*last/
    attempts to match the word first, followed by anything, and then the last. Observe
    how /first.*last/ matches the following strings:


    # first then last


    The good players get picked first, the bad last.


    The first shall be last, and all last shall be.


    Look at the match in the third line carefully. The match starts on the word first
    as expected. The match then matches the word last, but it doesn''t consider itself
    done. It continues searching until it finds the (and final) occurrence of the
    word last. Here, the * follows the fourth rule listed in the "Rules of the Game":
    It matches the largest possible string, while completing the match. Often, matching
    the largest string is not what you want, so Perl offers another solution called
    minimal matching, which is documented further in the perl manual.


    # Character Classes


    Another common practice in regular expressions is to ask for a match of "any of
    these characters." If you''re trying to match numbers, it would be nice to be
    able to write a pattern that matches "any 0–9"; if you''re searching a list of
    names and to match Van Beethoven and Van Beethoven, a pattern that matches either
    v or V would be helpful.


    Perl''s regular expressions have such a tool; it''s called a character class.
    To write a character class, you enclose the characters it contains in square brackets
    []. Characters in a character class are treated as a single character during the
    match. Inside a character class, you can specify ranges of characters (where ranges
    make sense) by putting a dash between the upper and lower bounds. The following
    are some examples:'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Character Class Explanation


    [abcd] Match of any a, b, c, d, or e


    [a-e] Same as above; match any a, b, c, d, or e


    [ls]Gg[rs] Match any uppercase G or lowercase g


    [0-9] Match a digit


    [0-9]+ Match one or more digits in sequence


    [A-Za-z]{5} Match any group of five alphabetic characters


    [!@#$%^&()] Match any of these punctuation marks


    The last example is interesting because the characters in that class are usually
    metacharacters. Inside a character class, most metacharacters lose their "meta-ness";
    in other words, they behave like any other ordinary character. Thus, the * really
    represents a literal *.


    If a caret (^) occurs the first character of a character class, the character
    class is negated. That is, the character class matches any single character that
    is not in the class, as in this example:


    ```

    /^[A-Z]/;      # Matches non-uppercase-alphabetic characters

    ```


    ], ^, and – are special in a character class, some rules apply about trying to
    match those characters literally in a character class. To match a literal ^ in
    a character class, you must make sure it does not occur first in the class. To
    match a literal ], you need to put it first in the class or put a backslash in
    front of it; for example, /[abc\]/. To put a literal hyphen (-) in a character
    class, you can simply put it first in the class or a backslash in front of it.


    Perl contains shortcuts for commonly used character classes. They are represented
    by a backslash and a nonmetacharacter, as shown in Table 6.2.


    # Table 6.2. Special Character Classes


    | Pattern | Matches |

    | --- | --- |

    | \w | A word character; same as [a-zA-Z0-9_] |

    | \W | A nonword character (the inverse of \w) |

    | \d | A digit; same as [0-9] |'
