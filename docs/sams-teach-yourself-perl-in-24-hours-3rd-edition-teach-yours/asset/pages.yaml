  md: '# Q&A


    Q1: I''m having problems with the following program. No files are read in, even
    though they''re in the directory!


    ```

    opendir(DIRHANDLE, "/mydir") || die;


    @files=<DIRHANDLE> ;


    closedir(DIRHANDLE);

    ```


    A1: Whoops! The problem is in the second line. DIRHANDLE is a directory handle,
    not a filehandle. You cannot read directory handles with the angle operators (<).
    The correct way to read the directory is @files=readdir DIRHANDLE.


    Q2: Why doesn''t glob("*.*") match all the files in a directory?


    A2: Because ".*" only matches filenames with a dot in them. To match all the files
    in a directory, use glob("*"). The glob function''s patterns are designed to be
    portable across many operating systems and thus do not behave the same as the
    *.* pattern in DOS.


    Q3: I modified mygrep exercise to search subdirectories by using opendir and some
    more loops, but it has bugs.


    A3: In short: Don''t Do That. Descending a tree is an old problem, it''s not particularly
    easy, it''s been solved many times before, and you don''t need to do it for yourself.
    Doing all that work on a problem that''s already solved is called "reinventing
    the wheel." that''s wonderful, but don''t spend too much time on it until Hour
    15, where you''ll learn to use the File::Find module instead. It''s a lot simpler
    to use—and, more importantly, it''s debugged.


