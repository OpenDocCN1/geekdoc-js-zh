    # Overview


    Learn Perl programming quickly and easily with 24 one-hour lessons in Sams Teach
    Yourself Perl in 24 Hours, 3e/. These step-by-step lessons will teach you the
    basics of Perl and how to apply it in web development and system administration.
    Plus, the third edition has been updated to include 5 chapters on new technologies,
    information on the latest version of Perl and a look ahead to Perl 6. You will
    focus on real-world development, including how to:


    +   * Effectively use Perl for large development projects using Perl Modules.

    * Use Perl for data processing.

    * Utilize Perl as a "glue" language with other programming languages.

    * Use Perl as a web development language.


    The concise, modular format of the Sams Teach Yourself Perl in 24 Hours, 3/e is
    the ideal way to learn for today''s working professional.'
