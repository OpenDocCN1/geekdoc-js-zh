  md: '# Directories


    Thus far in this hour, I''ve sort of hardhaving over the topic of directory structure.
    Full pathname are sometimes needed to open files, the readdir function can read
    directories. But navigating directories, adding or removing, and cleaning them
    out takes a little bit more Perl.


    # Navigating Directories


    When you run software, your operating system keeps track of what directory you
    are in you run the software. When you log in to a Unix machine and run a software
    package, you are usually placed in your home directory. If you use the operating
    system command prompt, the shell shows you what directory you are in. The prompt
    reflects what directory you are at the time—for example, C:\WINDOWS. Alternatively,
    you can type the operating system command cd at the MS-DOS, and tells you what
    directory you are. The directory that you''re currently using is called your current
    directory or your current working directory.


    # Watch Out!


    If you use a program editor or an integrated editor/debugger and running your
    Perl programs directly from there, your "current directory" might not be what
    you think. It might be the directory that the Perl program is in, your editor
    is in, or any other directory—it depends on your order. Use the cwd function below
    from inside your Perl program to determine exactly where your current directory
    is.


    If you do not specify a full pathname when you try to open a file—for example,
    open(FH, "file") || die—Perl will attempt to open the file in your current working
    directory. To change your current directory, you can use the chdir function, as
    follows:


    ```

    chdir newdir;

    ```


    The chdir function changes the working directory to newdir. If the newdir does
    not exist, or you don''t have permission to access newdir, chdir returns false.
    The directory change is temporary; as your Perl program ends, you return to the
    directory that you were working in before you ran the Perl program.


    Running the chdir without a directory as argument causes chdir to change your
    home directory. On a Unix system, the home directory is usually the directory
    you were placed in when logged in. On Windows 95, Windows 90, or MS-DOS, chdir
    takes you to the directory indicated in the HOME environment variable. If HOME
    isn''t set, chdir doesn''t change your current directory'
  merge: -1
