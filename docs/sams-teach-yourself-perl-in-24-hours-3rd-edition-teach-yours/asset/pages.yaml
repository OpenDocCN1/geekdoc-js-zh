  md: 'You shouldn''t rely on a brief summary like this for legal purposes; I provided
    it only to give you a feel for the licenses themselves.


    # Watch Out!


    Before you attempt to include Perl within another package, it is important that
    you read the licenses and determine what you''re doing either of the licenses.
    The Perl Artistic License is included with every Perl distribution as a file named
    Artistic. You can view the GNU General Public License at http://www.gnu.org.


    The licenses allow Perl to be developed and enhanced in an open forum. In this
    way, all the source code for Perl is visible to whoever wants to read and suggest
    changes. This approach encourages good programming and prevents getting locked
    into proprietary, hidden, and obscured software solutions.


    # The Development of Perl


    The development of the Perl interpreter, the language, and the modules that go
    along with it in the standard distribution takes place on a mailing list where
    the developers of Perl propose changes, examine bug reports, and debate what changes
    should be made to the Perl source code.


    Anyone is welcome to participate in this process; that''s what Open Source is
    all about. However to prevent chaos, the changes are filtered through a group
    of core developers who approve or reject the changes and maintain the core of
    Perl''s development. Changes are evaluated on the basis of what is good for Perl,
    how useful the changes are, and whether anyone has attempted the changes successfully.
    Larry Wall, who oversees this process, acts in the role of a benevolent dictator,
    allowing the beneficial changes to occur and vetoing changes he considers harmful.


    The current release of Perl is 5.8.6. This reflects a numbering scheme for releases
    of *major.minor.patchlevel*. The **major** number is the version of the language
    (5), the **minor** number is the version of the interpreter (8), and the **patchlevel**
    (6) indicates the patch level of this interpreter''s code.


    The even-numbered *minor* releases are production quality, the odd ones (5.7,
    5.9) are unstable development releases. The next significant production release
    of Perl will be called 5.10.'
