- img_proc: true
  md: 'remarkably similar question to yours in one of these newsgroups.


    Google maintains an online history for much of Usenet. Using its search engine,
    with a few well-chosen keywords, you''ll likely find the answers to your question.


    For example, say that you want to know how to write a Perl program to fetch a
    Web page. Go to groups.google.com''s Advanced Search screen, and fill in the screen
    with the following:


    Keywords: fetch web page


    Group: comp.lang.perl.misc


    For this example, leave all the other fields blank. When the search returns—with
    thousands of matches—of the matches will have to do with the topic you asked about.
    You should remember a few points about the articles that you read in Usenet.


    +   - Not all the answers are correct. Anyone can ask a question, and anyone can
    answer it. Read a few responses, and decide for which one seems authoritative.
    Your mileage will vary.

    - If you''re unsure whether an answer is correct, use the answer as a starting
    point to check the information yourself. Read general manuals on the topic now
    that you know where to look.

    - Google archives news for five or six years. Answers that may have been true
    years ago may not be true now.


    # When All Else Fails, Ask


    If you''ve checked the online documentation, your books, and Usenet history, and
    you still don''t have an answer to your question, you might need to ask someone.


    Asking for help should be your last resort, certainly not your first. Experts
    are a unique medium for answering questions. They can take your badly phrased
    question and sometimes come with a genuinely solution to your problem. However,
    unlike the other resources previously mentioned, people do not have an unlimited
    capacity for answering questions. They will get tired, they will have bad days,
    and they will specifically get tired of answering the same questions over and
    over.


    Although it''s very likely the person you''re asking may know the answer, remember
    that you''re borrowing that person''s time and experience to get the answer to
    your question. It''s your responsibility to do a reasonable amount of searching
    before asking someone else.


    To ask a question in Usenet, you need to use a newsreader or one of the previously
    mentioned Web interfaces to Usenet News. As you''re assembling your question,
    follow these guidelines:


    +   1.

    Before you do anything else, see whether the group has a Frequently Asked Questions
    (FAQ) list, The *'
