  md: 'The three times mentioned in Table 10.3—access, modification, and create (or
    create) time—are stored in a peculiar format. The time stamps are stored as number
    of seconds from midnight, January 1, 1970, Greenwich mean time. To print them
    in a usable format, you use the localtime function, as follows:


    ```

    print scalar localtime($mtime);

    ```


    This function prints the modification time of the file in a format similar to
    Sat Jul 3 23:35:11 EDT 1999. The access time is the time that the file was last
    read (or opened for reading). The modification time is the time when the file
    was last written to. Under Unix, the "change" time is the time when the information
    about the file—the ownership, number of links, permissions, and so on—was changed;
    it is not the creation time of the file but often happens to be coincidence. Under
    Microsoft Windows, the ctime field stores the time the file was created.


