  md: '# Pod::*


    Provide access to Perl''s Plain Old Documentation formatting routines.


    Symbol


    Allows you to view or manipulate Perl''s symbol table.


    Sys::Hostname


    Obtains your system''s IP hostname.


    Sys::Syslog


    Allows writing to a Unix system''s error log.


    Term::*


    Provide terminal-controlling functions interface for cursor positioning, screen
    cleaning, and so on.


    Text::Abbrev


    Builds abbreviation tables.


    Text::ParseWords


    Allows you to parse text to search for words.


    Text::Soundex


    Categorizes words based on pronunciation, using the Soundex method.


    Tie::*


    Connect Perl''s variables to functions so that you can implement your arrays and
    hashes.


    Time::*


    Allows you to parse and manipulate time. For example, you can convert times into
    "Sat Jul 24 16:21:38 EDT 1999" back into the number of seconds since January 1,
    1970.


