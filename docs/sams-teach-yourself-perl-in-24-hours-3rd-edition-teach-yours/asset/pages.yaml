  md: '# Text Files as Databases


    Often, databases are small, simple arrangements: a list of users on a small system,
    local hosts on a small network, a list of favorite Web sites, or a personal address
    file. These are all simple forms of databases, and for simple databases, normal
    text files will often do. But before using text files as databases, you need to
    consider some pros and cons.


    The good news: Using a text file as a database has a few distinct advantages over
    using more complicated alternatives such as DBM files or large databases such
    as Oracle or Sybase. Some of these advantages are:


    +   * Text file databases are portable. They can be moved between vastly kinds
    of systems without too much trouble.

    * Text files can be edited with a text editor and printed to paper without any
    special tools.

    * Text files are simple to construct initially.

    * Text file databases can be imported into other programs—stylesheets, word processors,
    or other databases—without hassles. Almost any program that allows you to import
    data allows you to import text.


    Now, as you would expect, there is some bad news. To understand the bad news fully,
    consider how text files are usually constructed. Text files are traditionally
    arranged so that each line in the text file is a record and columns within each
    line are fields. To your system, however, a text file is simply a stream of characters.
    So a text file database that looks like


    > Bob 555-1212


    Maury 555-0912


    Paul 555-0012


    Ann-Marie 555-1190


    is actually stored as a continuous stream of characters like


    Bob[space]555-1212[newline]Maury[space]555-0912[newline]Paul[space]...


    where [space] represents a space character and [newline] represents a record separator
    (newline character, "n") for your operating system, as discussed in Hour 5. The
    characters for each record and each field are packed together in one long stream
    of characters; the new column-row display is simply the human-readable way that
    editors, printers, and Perl represent the data.


    Keeping that structure in mind, consider the disadvantages of a text file database:


    +   * Text files cannot be inserted into; they can only be overwritten—partially
    or completely. Inserting new data anywhere, except at the end of the file, involves
    copying all the data following the newly inserted data further down in the file.'
