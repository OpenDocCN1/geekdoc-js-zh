  md: '# Hour 20. Perl as a Glue Language


    What You''ll Learn in This Hour:


    +   - How to fetch web pages in Perl

    - Practical applications of XML Parsing

    - How to create a PDF document

    - How to create a Microsoft Excel spreadsheet


    Perl was born in the Unix world where there''s a tool for every job imaginable.
    This was called the toolkit approach to software development. Every Unix utility
    was constructed to do one thing and do it well.


    Perl breaks that model, a little. Perl was partly designed as a glue language.
    Its purpose was to connect different tools together in a useful way. To do that
    it has to be a very flexible multitasker.


    In this hour you''ll get to play with a smattering of technologies, using Perl
    to glue the whole mess together into some useful tools to add to your repertoire.
    I''m going to approach this as a series of small, independent tasks and hopefully
    you''ll be able to glue them into larger programs as needed.'
  merge: -1
