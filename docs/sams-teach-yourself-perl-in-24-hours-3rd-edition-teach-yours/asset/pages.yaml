  md: '# # Q&A


    **Q1:** Can I store the structures from Hour 13, "References and Structures,"
    in a DBM file or a text file?


    **A1:** The short answer is not easily. The longer answer is yes, but you first
    need to convert the "structure" over a string that represents the data and the
    structure it contains, and then you need to use that as a value in the DBM-tied
    hash. The module to do so is `Data::Dumper`.


    **Q2:** How do I lock DBM files?


    **A2:** DBM files can be locked using the semaphore locking system shown previously.
    Simply use the `get_lock()` and `release_lock()` functions from Listing 15.3 and
    put these around the DBM open and close functions:


    ```

    get_lock();


    dbmopen(%hash, "foo", 0644) || die "dbmopen: $!";


    $hash(newkey)="Value";


    dbmclose(%hash);


    release_lock();

    ```


    **Q3:** Can I somehow just check to see whether `flock` is going to pause without
    actually having it stop?'
