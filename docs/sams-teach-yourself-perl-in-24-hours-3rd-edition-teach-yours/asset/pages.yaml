  md: '# Reference Basics


    You create and assign a scalar variable by using an assignment operator, as follows:


    ```

    $a="Stones"; # A normal scalar

    ```


    After this snippet, a scalar variable called $a is created, and it contains the
    string "Stones". Now, somewhere in the computer''s memory, there is a place labeled
    $a that contains that string, illustrated here:


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_302_0.png)


    If you want to assign the scalar $a to $b—$b=$a;—you would wind up with two copies
    of the data, without two different names, as shown here:


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_302_1.png)


    Having two copies might be acceptable if you want separate, independent copies
    of the data. However, if you want both $a and $b to reference the same piece of
    data—not a copy—you must create a *reference*. Just as the library catalog for
    a book does not contain a copy of the book''s text, a reference does not contain
    any real data; it is simply a pointer to a piece of data. The reference is usually
    stored in another scalar variable.


    To create a reference to any variable, you must put a backslash in front of the
    name with its type identifier. For example, to create a reference to $a called
    $ref, you would assign the reference to $ref as follows:


    ```

    $ref=\$a; # Create a reference to $a

    ```


    This assignment creates a situation like the following:


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_302_2.png)


    $ref doesn''t contain any data for itself; it is simply a reference to $a. The
    variable $a isn''t changed; it can'
