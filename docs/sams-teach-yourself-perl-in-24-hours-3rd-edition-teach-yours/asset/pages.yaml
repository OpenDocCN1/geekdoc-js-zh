  md: '# Everything You Ever Wanted to Know About THAT File


    To find out, in excruciating detail, you might want to know about a file, you
    can use Perl''s stat function. The stat function originated in Unix, and the return
    values differ slightly between Unix and non-Unix systems. The syntax for stat
    is as follows:


    ```

    stat filehandle;


    stat filename;

    ```


    The stat function can retrieve information either an open filehandle or about
    a particular file. Under any operating system, stat returns a 13-element list
    describing the attributes of the file. The actual values in the list differ slightly
    depending on which operating system you''re running because operating systems
    include features that others do not implement. Table 10.3 shows what each element
    in stat''s return value stands.


    # Table 10.3. Return Values from stat


    | Index | Name | Unix | Windows |

    |---|---|---|--|

    | 0 | dev | Device number | Drive number (C: is usually 2, D: is usually 3, and
    so on) |

    | 1 | ino | Inode number | Zero, always |

    | 2 | mode | File''s mode (permissions) | Not relevant |

    | 3 | nlink | Number of links | Usually 0; Windows NT; file system might allow
    links |

    | 4 | uid | User ID (UID) of the owner | Zero, always |

    | 5 | gid | Group ID (GID) of the owner | Zero, always |

    | 6 | rdev | Special file info | Drive number (again) |

    | 7 | size | Size of file in bytes | Size of file in bytes |

    | 8 | atime | Time of last access | Time of last access |

    | 9 | mtime | Time of last modification | Time of last modification |

    | 10 | ctime | Inode change time | File creation time |

    | 11 | blksz | Disk block size | Zero, always |'
  merge: -1
