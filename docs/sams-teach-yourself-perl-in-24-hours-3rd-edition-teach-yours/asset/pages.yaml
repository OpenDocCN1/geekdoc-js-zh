  md: '# Transliteration, Not Substitution


    For this next operator, the *transliteration* operator (sometimes called the *translation*
    operator), think back to how regular expression substitutions work: The substitution
    operator, works like `s/pattern/replacement/` and was discussed in Hour 6, works
    against the default variable unless specified by a binding operator `=`. The transliteration
    operator works something like that, except it doesn''t use regular expressions
    and works completely differently. Still follow? The syntax for the transliteration
    operator is as follows:


    ```

    tr/searchlist/replacementlist/

    ```


    The transliteration operator—TR//`—searches a string for the elements in `searchlist`
    and replaces them with the corresponding elements in `replacementlist`. By default,
    the transliteration operator searches and modifies the variable `$_`. To search
    and modify other variables, you use a binding operator as you would for regular
    expression matches, such as:


    ```

    tr/ABC/XYZ/;      # In $, replaces all A''s with X''s, B''s with Y''s, etc.

    $=~/ABC/XYZ/;      # Does the same, but with $r

    ```


    Logical groups are accepted with dashes throughout. For example, A-Z represents
    the capital letters A through Z, so that you don''t have to write them all out,
    in this example:


    ```

    tr/A-Z/a-z/;      # Change all uppercase to lowercase

    tr/A-Za-z/a-zA-Z/;    # Invert upper and lowercase

    ```


    If `replacementlist` is empty or identical to `searchlist`, the characters matched
    are counted by `tr///` and returned. The target string is not modified, as in
    the following example:


    ```

    $eyes=$potato=tr/i//; # Count the i''s in $potato, return to $eyes

    $nums=tr/0-9//;      # Count digits in $, return to $nums

    ```'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'Finally, for reason it can also be written, TR/// y/// with the same results,
    y is a synonym for tr. TR/// (and hence, y///) also allows you to specify an alternate
    set of delimiters searchlist and replacementlist. It can be naturally paired set
    such as parentheses or any other character, as you can see here:


    ```

    tr(a-z) (n-za-m);      # Rotate all characters 13 to the left in $\_

    y[.,_.-][;:=|];      # Switch around some punctuation

    ```


    # By the Way


    The TR/// operator actually has additional functionality, but it isn''t used often.
    To read about all the other tasks TR/// can perform, look at the online documentation
    in the perplop section.'
