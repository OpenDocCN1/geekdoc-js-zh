  md: '# A Better Way to print


    The print function is a very simple output function; it provides almost no formatting
    capability. To fine-grained control over the appearance of expression values,
    such as left and right alignment, number of digits of decimal precision, and fixed-width
    output, you must use the Perl printf function instead.


    # Formatted Printing with printf


    The printf function was borrowed (almost verbatim) from the C programming language,
    but other languages have a similar function, such as BASIC''s print using function.
    The syntax for printf is as follows:


    ```

    printf formatstring, list

    nhandle formatstring, list

    ```


    The formatstring is a string that describes the format of the output, which is
    described shortly. The list is a list of values that you want printf to display—somewhat
    similar to the arguments to the print function. Normally, printf displays its
    output to the STDOUT filehandle, but, as print, if you specify a filehandle, printf
    uses that filehandle instead. Note that no comma is used between the filehandle
    and the formatstring.


    # Specifying the Field Formats


    The formatstring is a string literal (usually or a scalar that describes what
    the output should look like. Every character in the formatstring is printed literally,
    except those character sequences beginning with a %. The % indicates the start
    of a field specifier. The format of a field specifier is shown here:


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_218_0.png)


    As seen in the figure, field specifiers have the form %-w.dx, where w is the total
    desired width of the field. d is the minimum number of digits.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Table 9.1. Partial List of printf Field Specifier Types


    Field Type Meaning


    | c | Meaning |

    | --- | --- |

    | c | Character |

    | s | String |

    | d | Decimal integer; fraction is truncated |

    | f | Floating-point number |


    A full list of field spec specifiers is included in the online manual. You can
    view it by typing perld -printf at a command prompt.


    The following are some examples of using printf:


    ```

    printf("%20s", "Jack");      # Right-justify "Jack" in 20-characters

    printf("%-20s", "Jill");      # Left-justify "Jill" in 20 characters

    $amt=7.122;

    printf("%6.2f", $amt);               # prints "  7.12"

    $amt=7.127;

    printf("%6.2f", $amt);               # prints "7.13", extra digits rounded

    printf("%c", 65);                   # prints ASCII character for 65, "A"

    $amt=9.4;

    printf("%6.2f", $amt);               # prints "  9.40"


    printf("%6d", $amt);               # prints "     9"

    ```'
