  md: '# Q&A: Is there really any difference between using & and not using & when
    calling a subroutine?


    Q1:


    None that should concern you at this point. A subtle difference does exist between
    &foo and when subroutine prototypes are used or when a subroutine is called without
    parentheses. These are topics well beyond the scope of this book, but for curiosity,
    they''re documented in the persub manual page.


    A1:


    When I use my($var) in a program, Perl responds with a syntax error, next 2 tokens
    my ( the message).


    Q2:


    You either have mistyped something or have Perl version 4 installed. Type perl
    -v at a command prompt. If Perl responds, you should upgrade immediately.


    A2:


    Q3: How do I pass (or return) functions, filehandles, multiple arrays, or hashes
    to a subroutine?


    A3:


    For passing functions, multiple arrays, and hashes, you need to use a reference,
    which is covered in Hour 13. For passing filehandles, you need to use either something
    called a tieglob or the IO::Handle module, both of which are beyond the scope
    of this book.


    Q4: A function I''m returning many values, but I''m interested in only one. How
    do I skip return values?


    A4:


    One method is to make a literal out of the function by wrapping the entire function
    call in parentheses. When it''s a list, you can use ordinary list slices to get
    pieces of the list. The following extracts just the year (current year 1900) from
    the built-in function localtime, which actually has nine return values:


    ```

    print "It is now ", 1900+(localtime) [5];

    ```


    The other method is to assign the return value from the function into a list and
    simply assign the unwanted values to undef or a dummy variable:


    ```

    (undef, undef, undef, undef, undef, $year_offset)=localtime;

    ```'
