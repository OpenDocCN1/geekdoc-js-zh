  md: '# Presenting Data as PDF


    The data on the weather report expose is impressive, but the presentation isn''t
    all that hot. And as you know, presentation is very important.


    For a printed document it''s tough to beat PDF for presentation. PDF stands for
    Portable Document Format, and is a powerful and very common way of distributing
    electronic documents that require precise printing control. The most common tool
    for reading PDFs is Adobe System''s Acrobat Reader. This tool is freely available
    from http://adobe.com.


    There is hardly room to go into all the details of creating PDF documents. The
    specification itself is over a thousand pages long! But a few short notes should
    be enough to get you started:


    +   - PDF documents are object-oriented. PDF documents have properties (creator,
    pages, encoding schemes, and so on). Each page in the PDF document is an object.

    - Page objects have properties media size (paper size) and several properties
    to control clipping of text and graphics on the page (artbox, cropbox, and so
    on).

    - Text and graphics are placed on pages by specifying coordinates, pen types,
    pen colors, and font names.

    - The coordinate system for PDF is upside down from when you''re probably used
    to if you''ve done any graphics programming. On an 8 1/2"x11" sheet of paper,
    the 0,0 coordinate is at the lower left. The upper-right corner is 612,792.


    There are several modules on CPAN for writing PDF files. The module you''ll use
    is PDF::API2. It''s slightly more complicated than others (such as PDF::Create),
    but mastered will provide a lot of flexibility.


    Eventually, your weather report will look something like Figure 20.6.


    # Figure 20.6. The weather report in all its glory.


    [View full size image]'
