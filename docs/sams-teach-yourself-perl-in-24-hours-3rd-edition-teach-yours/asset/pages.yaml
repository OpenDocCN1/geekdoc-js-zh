  md: "# Other Flow Control Tools\n\nControlling the way your program executes with\
    \ loops and condition statements is fine, but other flow control statements are\
    \ needed to make readable programs. For example, Perl has statements to exit a\
    \ while early, to skip portions of a for loop, to exit an if statement preceding\
    \ the end of a block, or even to exit your program without falling off the end.\
    \ Using some of the constructs explained in this section can make your Perl programs\
    \ more concise and easier to read.\n\n# Odd Arrangements\n\nThe if statements\
    \ have one more possible syntax. If you have only one expression inside the if\
    \ block, the expression can actually precede the if statements. So, instead of\
    \ writing\n\n```\nif (test_expression ) {\n    expression;\n}\n```\n\nyou can\
    \ write\n\n```\nexpression if (test_expression );\n```\n\nThe following are a\
    \ couple of examples of this variation of the syntax:\n\n```\n$correct=1 if ($guess\
    \ == $question);\nprint \"No pi for you!\" if ($ratio != 3.14159);\n```\n\nYou\
    \ usually use this syntax in Perl for clarity; sometimes reading the code is easier\
    \ if you see the action before the condition. The expression preceding the if\
    \ must be a single expression. The if statement must also be followed by a semicolon.\n\
    \n# Fine-Grained Control"
