  md: '# Hour 14. Using Modules


    What You''ll Learn in This Hour:


    +   - Learn how to use modules in your Perl programs

    - Take a quick tour of some built-in modules

    - Review the list of the core modules distributed with Perl


    Perl, as you''ve noticed, is an extremely flexible language. Not only does it
    do well with files, text, math, algorithms, and other issues normally found in
    any computer language; much of Perl is dedicated to special-purpose functions.
    Regular expressions are a part of the core and are very important to the way that
    Perl is used, although many languages do just fine without them. Likewise, Perl''s
    handling of external programs (backticks, pipes, and system from Hour 11, "System
    Interaction") is also extensive, whereas many languages do not handle them at
    all.


    A temptation in designing a language is to include anything and everything in
    the core of the language. Being inclusive can, create a language that is very
    large and difficult to use. For example, some language designers feel that support
    for access to the World Wide Web should be included in the core of the language.
    That''s a useful feature, but not necessarily one that everyone needs. If the
    Web (using present protocols) is less important 10 years from now than it is,
    a decision will have been made to remove that support a lot of already-written
    software will be broken.


    For this reason, Perl has taken a different track. Starting with Perl 5, the language
    itself can be extended through the use of modules. Modules are collections of
    routines that allow you to extend Perl''s reach. You will find modules that add
    Web browsing, graphics, Windows Object Linking and Embedding (OLE), databases,
    and almost anything imaginable in Perl. Remember, however, that Perl does not
    need modules to run. It is completely functional without them.


    By using modules, you can gain access to a large library of working code to help
    you write your programs. The last third of this book, in fact, is dedicated to
    writing CGI (Common Gateway Interface) programs using Perl modules.


    At the time of this writing, more than 4000 modules are available, and more than
    two dozen are distributed with Perl. These modules, for the most part, can be
    freely redistributed. You can use them in your own programs for almost any purpose.
    Consequently, many problems you may encounter have already been solved for you;
    all you need to do is install the correct module and use it appropriately.'
  merge: -1
