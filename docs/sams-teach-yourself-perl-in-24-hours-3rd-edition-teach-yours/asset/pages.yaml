- img_proc: true
  md: '# Passing Information to Your CGI Program


    When a CGI program is run as the result of a submission form, the field names
    and values passed in form—called **parameters**—need to be processed by the CGI
    program. This is done with the param function


    Without any arguments, the param function returns the names of the fields passed
    into the CGI program. If the CGI program was accepting the form in Listing 22.1,
    the param function would return body, sex, name, and submit.


    With an argument, param returns the value of that parameter. For example, param(''sex'')
    would return the value of the radio buttons—either male or female—depending on
    which was selected.


    Listing 22.2 contains a short CGI program to print these parameters.


    # Listing 22.2. CGI Program for Printing Parameters


    ```

    1: #!/usr/bin/perl -w

    2: use strict;

    3: use CGI qw(:standard);

    4:

    5: print header;

    6: print "<The name was", param(''name''), "<br>";

    7: print "The sex selected: ", param(''sex''), "<br>";

    8: print "The description was:<br>", param(''description''),

    9: "</p>";

    ```


    If the parameter specified by param is not used in the form, param returns undef.


    # GET and POST Methods


    In the form in Listing 22.1, the <FORM> tag has an attribute called method. The
    method attribute specifies how the web browser should transmit the data to the
    web server. Currently, two methods are available.'
  merge: -1
  pgno: 496
- img_proc: true
  md: 'GET—the default method if you do not specify one in the <FORM> tag—is called
    GET. The GET values are passed to the CGI program by having their values encoded
    in the URL. You may have seen URLs while surfing the Web:


    http://www.server.com/cgi-bin/sample.pl?name=foo&desc=Basic%20Forms


    The CGI program, when it runs, can decode the remainder of the URL into fields
    and values. The param param function essentially does the same thing when it''s
    called. You should not try decoding these values yourself. The param function
    does thorough job of it, and you don''t have any reason to use anything else to
    extract the values.


    The other method, POST, produces exactly the same result but through different
    means. Instead of encoding all the values into the URL, the web server is contacted
    and the HTML form values are sent as input to the CGI program. Again, you don''t
    need to know exactly how this process works; the CGI module takes care of it.
    Simply calling the param function takes care of reading the values, decoding them,
    and passing them to your program.


    # By the Way


    You may downloaded CGI programs from the Internet or use other examples in books
    that try to decode an environment variable called QUERY_STRING or use a variable
    called REQUEST_METHOD to figure out what the form uses a GET or POST method. These
    programs attempt to reproduce the work already done in the standard CGI module—and
    probably not as well. You should avoid doing this yourself.


    So, which method should you choose? Each method has advantages and disadvantages.
    The GET allows the web browser to bookmark the particular URL that generated the
    page. For example, the http://www.server.com/cgi-bin/sample.pl?names=foo&desc=Basic%20Forms
    could be bookmarked and always returned to the browser. From the perspective of
    the CGI program—sample.pl—it knows the normal CGI parameters as it always has.
    Being able to call a CGI program repeatedly using the GET method''s URL-encoded
    values is called idempotency.


    However, you might not particularly want browsers to be able to bookmark your
    site to run your CGI programs directly, and the URLs for invoking a CGI program
    with the GET method are friendly, ugly.


    The POST method doesn''t encode the data in the URL at all; it relies on the browser
    to send the data as it''s negotiating for the page. However, because the data
    isn''t encoded into the URL, you can''t bookmark a page that was generated by
    a CGI program using the POST method.'
  merge: -1
  pgno: 497
- img_proc: true
  md: '# Web Security 101


    Before you put CGI programs on the World Wide Web, you need to know a few things.
    Putting a CGI program on a web page, you are giving remote users (using web browsers)
    limited access to your system. Using normal HTML documents, you can retrieve only
    static documents from your web site. Using CGI programs, however, they''re actually
    able to run programs on your web server.


    Knowing how to write safe and secure CGI programs will make you and your web administrator
    much happier. Writing such programs is not hard; you just need to follow a few
    simple precautions.


    # A Clear Link


    When a web browser retrieves a page from your web server, the HTML is sent over
    a cleartext channel (see Figure 22.6). This means that the data winds its way
    through the Internet, it''s not encrypted, encoded, or otherwise obscured.


    > Figure 22.6. Plain text being transmitted to server.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_498_0.png)


    The data that a user puts into a form and submits to your CGI program is transmitted
    with the same protocol as the initial web page. All fields of the form are free
    for anyone to see as they go by (see Figure 22.7).


    > Figure 22.7. Server responding in plain text.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_498_1.png)


    The problem of data being transmitted in the clear is a real one that you should
    be concerned with. The Internet is not a secure place, and anyone along the wire
    between the web browser and the web server can eavesdrop on the information being
    sent out or in.'
  merge: -1
  pgno: 498
- img_proc: true
  md: 'Keeping point in mind, you should never transmit kinds of data with normal
    CGI forms:


    +   - Passwords of any kind

    - Personal information (Social Security numbers, phone numbers)

    - Financial information (account numbers, PINs, credit card numbers)


    Keep this rule of thumb: Never send anything on the Internet you wouldn''t put
    on a postcard. If you need to transmit data that needs to be kept secure, you
    need to use extraordinary methods to do so: use secure HTTPS (instead of HTTP),
    make sure that the servers you''re sending the data to are secure, and trust the
    recipient with your information.


    # By the Way


    "But wait!" you say, "I''ve seen forms on the Internet asking for all these pieces
    of information and claiming to be secure." Reason secure transactions can be performed
    over the Web with some additional tools. Secure web transactions are actually
    performed by encrypting the *entire* browser/server conversation. This is done
    by using a secure version of the HTTP protocol **https**.


    # Watching for Insecure Data


    Another point to consider in writing CGI programs is that you''re writing programs
    that will execute Perl commands based on the input given to you by a web page.
    The Internet—and possibly your—is full of people who are not wise and would take
    great deal and pride in harming your web server. Also, benign users could accidentally
    send invalid data to your CGI program.


    Consider the HTML form in [Listing 22.3] and the CGI program in [Listing 24.4].


    # Listing 22.3. Directory Listing Web Form


    ```

    <form action="cgi-bin/directory.cgi">

    <p>What directory to list?</p>

    <input type="text name=dirname==/ >

    <input type="submit name=submit value="Run This"/>/ >

    </p>

    </form>

    ```


    # Listing 22.4. An Insecure CGI Program Named **directory.cgi**


    ```

    #!/usr/bin/perl -w

    ```'
