- img_proc: true
  md: '# # Picking the Right Module


    First, you need to pick the right module. A good starting place is the CPAN itself
    at http://www.perl.com/CPAN. You need to decide which module''re interested in.



    CPAN modules are named, roughly, by what they do. For example, Image::Size takes
    an image and reports what size the image; this module is useful for working with
    Web pages. Some modules have unusual names. LWP derives its name from a Perl library
    called libwww-perl.


    You can also find bundles of modules on CPAN. These bundles contain several related
    modules—and usually prerequisite modules—all in one large package. For example,
    the libnet bundle installs like a module, but in the process, you get several
    modules related to networking. LWP is part of the libnet bundle, for example.


    **By the Way**


    When you install a module, you also automatically get all the documentation needed
    for that module.'
  merge: -1
  pgno: 560
- img_proc: true
  md: '# Installing the Modules Under...


    For each the examples in the following sections, you will attempt to install the
    Date::Manip module from CPAN. To install your own module or bundle, simply substitute
    the name of your module in place of Date::Manip.


    # ...Windows


    With Windows, the easiest solution is to use prepackaged modules available from
    ActiveState Tool Corp., assuming of course, that the Perl installation you have
    is from ActiveState.


    To install a prebuilt module under Windows, you first need to start the Perl Package
    Manager (PPM). This utility simplifies the module-building process for you by
    providing an interactive interface to module installation. To start the PPM, you
    need to open a DOS command prompt, as shown in Figure A.1; you should connect
    to the Internet.


    Figure A.1. You can work from the DOS command prompt.


    [View full size image]


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_561_0.png)'
  merge: -1
  pgno: 561
- img_proc: true
  md: 'At the command prompt, type ppm, as shown here. The PPM utility should then
    start; if it doesn''t, you can use ppm.bat that was installed with ActiveState
    Perl and run it with the full pathname.


    ```

    C:\Windows>ppm

    ```


    ```

    PPM interactive shell (2.1.6) - type ''help'' for available commands

    PPM>

    ```


    To search for a particular module, use the search command, as shown here. You
    need to use this command because ActiveState doesn''t have inbuilt packages for
    all the modules in CPAN, only the most requested ones. Also, for installation,
    you have to be able to spell the name of the module correctly.


    ```

    PPM> search Date

    Packages available from http://www.ActiveState.com/packages:

    ```


    +   - Date-Calc

    - Date-Manip

    - TimeDate


    ```

    PPM>

    ```


    I''ve summarized the results of the search. There are actually more than 40 available
    date modules. After you''ve found the module you want—Date-Manip for this example—you
    can install it by using the install command, as follows:


    ```

    PPM> install Date-Manip

    ```


    ```

    Install package ''Date-Manip?'' (y/N): y

    Installing C:\Perl\html\lib\Date\Manip.html

    Installing C:\Perl\htmlhelp\pkg-Date-Manip.chm

    Installing C:\Perl\htmlhelp\pkg-Date-Manip.hhc

    Installing C:\Perl\site\lib\Date\Manip.pm

    ```'
