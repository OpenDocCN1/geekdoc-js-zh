  md: '# Searching Scalars


    Regular expressions are nice for searching scalars for patterns, but sometimes
    they''re overkill. In Perl, some overhead—but not much—is involved in assembling
    the pattern and then searching for the pattern within scalars. Also, you can easily
    make mistakes when writing regular expressions. Perl provides several functions
    for searching and extracting simple information from scalars.


    # Searching with index


    If you merely want to find one string within another scalar, Perl provides the
    index function. The syntax for index is as follows:


    ```

    index string, substring


    index string, substring, start_position

    ```


    The index function starts at the left of string and searches for substring. The
    index returns the position at which substring is found, with 0 being the leftmost
    character. If the substring is not found, index returns -1. The string to be searched
    can be a literal, a scalar, or any expression that returns a value. The substring
    is not a regular expression; it''s just another scalar.


    The following are some examples. You can write Perl''s functions and operators
    with or without parentheses enclosing the arguments.


    ```

    index "Ring around the rosy", "around";      # Returns 5

    index("Pocket full of pokies", "ket");      # Returns 3

    $a="Ashes, ashes, we all fall down"

    index($a, "she");                               # Returns 1

    index $a, "they";                            # Returns -1 (not found)

    @qw(oats       beans);

    index join(" ",@, "peas");                  # Returns 5

    ```


    Optionally, you can give the index function a start position in the string to
    start searching, as shown in the-'
