- img_proc: true
  md: 'directory, or contact the web host for help.


    **Problem:** The server responds with the message Forbidden 403 Error.


    **Solution:** The permissions on the CGI program are not correct. This problem
    is most likely to occur on a Unix web server.


    You can view the permissions on the hello.cgi program by typing ls -l hello.cgi
    at a command prompt in the directory. If you have FTP access to the server, you
    can view the file permissions by typing dir. The permissions should look something
    like this:


    ```

    -rwxr-xr-x   user   93 Aug 03 23:06 hello.cgi

    ```


    The permissions are the rwxr-xr-x characters on the left. If they don''t look
    exactly like this, go back to the installation instructions for details on how
    to properly set the permissions on the CGI program.


    #  Fixing Internal Server or 500 Errors


    If the server replies with an Internal Server Error or 500 Error message, this
    means that your CGI program failed somehow. This general-purpose failure message
    is generated by many different problems.


    The most important tool you have in debugging an "Internal Server Error" is the
    server''s log file. As the web server receives requests for web pages, it writes
    each request into a file for later analysis. Any errors that the server encounters
    are also logged, including error messages generated by CGI programs.


    Find the location of the server error file, which you should have noted in the
    checklist. The log is typically written by appending any new items to the bottom
    of the log file. To see the last few entries under Unix, at a command prompt,
    type


    ```

    tail error_log

    ```


    to just the bottom of the file. Some web servers have a utility—often a CGI program
    itself—to view the log file. If you have FTP-only access to the server, you might
    need to download the log file and view it on your local PC to see the error entries.


    If you do not have access to the server''s error logs, you have a big problem.
    Finding an "Internal Server Error" will be a hit-and-miss affair. Following the
    checklist shown, you should find the problem eventually.(The messages you''ll
    find in the server logs are approximated; the text will vary from server to server).


    **Log entry:** No such file or directory: exec of /cgi-bin/hello.cgi failed'
