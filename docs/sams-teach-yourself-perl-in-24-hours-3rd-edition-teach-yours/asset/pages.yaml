  md: '# Writing C:\Perl\site\lib\auto\Date-Manip\.packlist


    PPM>


    The Date-Manip module is now installed!


    If you want to download the bundle and install it manually—perhaps the PC doesn''t
    have Internet access or is behind a firewall—you can finds instructions for downloading
    and installing modules by hand and dealing with firewalls on ActiveState''s Web
    site (http://www.ActiveState.com). ActiveState maintains a FAQ specific to its
    distribution of Perl, and you can find the necessary instructions there.


    # By the Way


    Installing modules with PPM—for example, using your own C compiler under Microsoft
    Windows—is well beyond the scope of this book. The source distribution of Perl
    contains instructions for building yourself under Windows, but this job is not
    for beginners. If you can accomplish that, building modules yourself shouldn''t
    be too difficult because the processes are the same.


    # ...UNIX, Using CPAN


    Installing modules under UNIX can be exciting and full of challenges, or it can
    be ridiculously easy. If you need an ANSI C (the one used to build Perl will be
    fine) and a compiler license if your vendor requires one. You also need a copy
    of the GNU programming program gzip/gunzip; some UNIX vendors ship it as a standard
    utility. You can obtain a copy from http://www.fsf.org if you don''t have it.


    One thing: You''ll probably need root privileges on the installation machine.
    Normally, Perl is installed as a systemwide utility. Installing modules into the
    system directories that requires you have adequate permission to do so—root permission.


    The Perl installation comes with a module called CPAN that is designed to help
    you install other modules. To get the installation started, start Perl using the
    CPAN module''s shell like this:


    ```

    $ perl -MCPAN -e shell

    ```


    The first time you run this command, the CPAN module interrogates you to find
    where you want to fetch Perl modules from and how you want them built. Most of
    the time, the default answers are sufficient. You are asked about the location
    of temporary directories, which CPAN mirror you want to use (a list is presented),
    and whether you''re accessing the Internet through a proxy.'
