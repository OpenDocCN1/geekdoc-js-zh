  md: 'scriptname is the name of the Perl program, xxx is the line where the die was
    encountered. The die and open functions function together in this:


    ```

    open(MYTEXT, "novel.txt") || die;

    ```


    This line is read as "open or die," which sums up to how you will usually want
    your program to handle the situation when a file cannot be opened. As described
    in Hour 3, "Controlling the Program," if the open does not succeed—if it fails—then
    the OR (||) needs to evaluate the right-hand argument (the die). If the open returns
    true—then the die is not invoked. This example also uses the other logical symbol
    for OR, or.


    When you are done with a file, it is good programming practice to close the file.
    The operating system that the file is available for release and any unwritten
    data for the filehandle be written to. Also, your operating system allows you
    to open only a fixed number of files—after that limit is exceeded, you cannot
    open more files until you close. To close filehandles, use the close function
    as follows:


    ```

    close(MYTEXT);

    ```


    If a filename is reused—that is, if another file is opened with the same filename—the
    original filehandle is closed and reopened.


    # Pathnames


    Until now, you''ve opened files with simple names like novel.txt that did not
    include a path. When you try to open a filename that does not specify a directory,
    Perl assumes the file is in the current directory. To open a file in another directory,
    you must use a pathname. The pathname describes the path that Perl must take to
    find the file on your system.


    You specify the pathname in the manner in which your operating system expects
    it, as shown in the following examples:


    ```

    open(MYFILE, "DISK:[USER.PIERCE.NOVEL]") || die; # VMS

    open(MYFILE, "Drive:folder:file") || die; # Macintosh

    open(MYFILE, "/usr/pierce/novel") || die; # Unix.

    ```


    Under Windows and DOS, systems use backslash separators—for example, \Windows\users\pierce\novel.txt.
    The only catch is when you use backslash-separated paths in a double-quoted string
    in Perl, the backslash sequence gets translated to a special character. Consider
    this example:


    ```

    open(MYFILE, "\Windows\users\pierce\novel.txt") || die; # WRONG

    ```


    This example will probably fail, because \n in a double-quoted string is a newline
    character—not the letter n—and all the other backslashes will get removed by Perl.
    As you might guess from Hour 2, "Perl''s Building Blocks: Numbers and Strings,"
    the correct way to open the file is by escaping each backslash with another backslash:


    ```

    open(MYFILE, "C:\Windows\users\pierce\novel.txt") || die; # Right, but messy.

    ```'
