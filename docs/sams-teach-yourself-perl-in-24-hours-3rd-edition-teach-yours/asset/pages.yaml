  md: 'Regular expressions in the manual pages and in other documentation are sometimes
    called REs or regexps. For clarity, I''ll continue to refer to them as regular
    expressions throughout this book.


    # Rules of the Game


    As you begin to write regular expressions in Perl, you should know that a few
    rules are involved in the way Perl interprets them. There are not many rules,
    though, and most of them make sense after you think about them. They are as follows:


    +   1.

    Normally, pattern matches start at the left of the target string and work their
    way to the right.


    +   2.

    Pattern matches return true (in whatever context) if and only if the entire pattern
    can be used to match the target string.


    +   3.

    The first possible match (the leftmost) in the target string is matched first.
    Regular expressions don''t leave behind one good match to go looking for another
    further along. However...


    +   4.

    The largest possible first match is taken. Your regular expressions might find
    a match immediately and then try to stretch it as far as possible. Regular expressions
    are greedy, meaning they try to match as much as possible.'
  merge: -1
