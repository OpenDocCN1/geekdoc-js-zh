  md: '![](img/cf381f8bfc9aae35d8aa7efee5768d06_545_0.png)


    Having the sales programs and the engineering CGI programs reside in different
    directories might make sense. If a CGI program were set to a cookie, the engineering
    CGI programs would pick it up, and versa. This result might not be desirable,
    and the people writing CGI programs for both sites need to coordinate to make
    sure they don''t reuse each other''s cookie names.


    To get around this problem, you can use the cookie function''s -path option. It
    indicates the pathname—relative to the top of the URL—to which the cookie should
    be returned. For example, to send a cookie that will be returned only to the sales
    CGI programs, you use this snippet:


    # # Cookie only visible to sales CGI programs


    ```

    $cookie=cookie( -name => ''profile'',


    -value => ''sedan,luxury,2-door'',


    -path => ''/cgi-sales'');


    print header(-cookie => $cookie);

    ```


    By default, cookies are returned to every site on the server as though you had
    used the option -path->''''. To restrict the cookie to only one CGI program, you
    can use the CGI program''s URL in the -path option:


    # # Return the cookie only to this program


    ```

    $cookie=cookie( -name => ''profile'',


    -value => ''sedan,luxury,2-door'',


    -path => script_name() );


    print header(-cookie => $cookie);

    ```'
