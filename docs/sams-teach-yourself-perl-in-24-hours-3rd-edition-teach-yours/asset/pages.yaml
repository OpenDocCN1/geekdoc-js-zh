  md: "# Free Files, Testing Files, and Binary Data\n\nFiles and file systems do not\
    \ contain the data that you put into them. On the one hand, filehandles sometimes\
    \ represent more than a simple file. They may stand for things like the keyboard,\
    \ the monitor screen, network sockets, or mass storage devices as tape drives.\n\
    \nAlso, in addition to the data stored in the files, a file system contains what's\
    \ called metadata—that is, data about the data in its files. Perl can be used\
    \ to get metadata out of the file system; for example, to determine how big your\
    \ file is, when it was last changed, who changed it, and information about what's\
    \ in the file. In some operating systems, the file metadata can even determine\
    \ whether the file is treated as a text file or a binary file.\n\n# Free Filehandles\n\
    \nPerl begin like a Unix utility, and sometimes pieces of its heritage show through—even\
    \ on non-Unix platforms. When your Perl program starts, it receives three filehandles\
    \ that are “free”—that is, they are opened automatically without you having to\
    \ do any programming work to open them. They are STDOUT (standard output), STDIN\
    \ (standard input), and STDERR (standard error). By default, they are connected\
    \ to your terminal.\n\nAs you type, Perl can read your input from the STDIN filehandle:\n\
    \n```\n$guess=<STDIN>;\n```\n\nWhen you want to display output, you use print.\
    \ The reason why your output has appeared on the screen is that, by default, print\
    \ uses the STDOUT filehandle:\n\n```\nprint \"Hello, World!\\n\";           #\
    \ is the same as...\n\n STDOUT \"Hello, World!\\n\";\n```\n\nIn Hour 12, you'll\
    \ learn how to change print's default filehandle.\n\nSTDERR is usually set to\
    \ your terminal, like STDOUT, but it is used for displaying error messages. In\
    \ Unix, error messages and normal output can be sent to different displays, and\
    \ writing error messages to the STDERR is traditional. The die and warn functions\
    \ both write their messages to STDERR. If your operating system does not have\
    \ a separate error-reporting filehandle—for example, Windows or MS-DOS—your STDERR\
    \ output will go to the STDOUT device."
  merge: -1
