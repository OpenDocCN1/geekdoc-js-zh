  md: 'Perl groups do; it was shipped with your Perl interpreter. For any other group,
    search Google the group''s FAQ before posting a message.


    2. Post the question to the correct newsgroup. A general Perl language question
    should be posted to the group comp.lang.perl.misc. A CGI-specific programming
    question should probably be posted to comp.infosystems.www.authoring.cgi. By reading
    the FAQ for the group, you''ll know whether you''re posting to the right place.


    3. Pick a good subject line for your post. Subject lines should describe your
    problem, avoid useless phrases as "help me" or "newbie question," and be descriptive
    but concise.


    4. Make sure that the body includes the following:


    +   a. A description of what you''re trying to do (maybe even an explanation why)

    b. A description of what you''ve tried so far

    c. A description of the errors you''ve encountered


    For example, if you post error messages or references to your code, you should
    also include enough of your code so that the responders can tell what''s going
    on. If you''re trying to process data, include a few lines for an example.


    The body should not include the following:


    +   a. Large code segments

    b. Postings of binaries such as .EXEs or uuencoded files'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'MIME attachments (instead, include your examples and code in the body of the
    text)


    5.


    Make sure you post with a valid email address, in case someone wants to reply
    but not publicly.


    6.


    Above all, be polite. You are asking for the kindness of strangers. No one is
    obliged to help you. Say "please" and "thank you," and avoid inflammatory remarks.
    Don''t use gimmicks to get help -for example, "Help a poor little girl with her
    CGI program" or "I''ll give you a free Web page if you...." These gimmicks are
    rude and demeaning.


    After you post your article to the newsgroup, wait. Usenet takes a few days to
    propagate to the entire world, and people don''t always keep up and read every
    article. Be patient, and on to the next problem while waiting. Whatever you do,
    do not post to Usenet with your question too soon. Wait at least a couple of weeks
    before asking again. Rephrase your question, make sure your subject line is clear,
    and then try again.


    The responses to your article can start immediately (within a few minutes) or
    could show a month or more after you posted. As I said, the quality of the responses
    will vary greatly. Some will be informative, and others will be wrong. Some will
    be gracious and polite, and others will be exceedingly rude. It''s considered
    good Netiquette to thank the responders and ignore any flames you''ve received.


    # Another Place to Look and Ask: PerlMonks


    The PerlMonks web site (www.perlmonks.org) is another useful resource for Perl
    programmers. It''s fairly easily-to-navigate web message-board system that provides
    answers to questions and discussion of related topics. Between 25 and 40 questions
    are answered daily in the "Seekers of Perl Wisdom" of the site and most questions
    are answered within 24 hours.


    A wide range of people seek help at PerlMonks, from those starting out with Perl
    to knowledgeable users who are looking for opinions on modules or articles before
    publication.


    Like Usenet, those answering questions are all volunteers and have diverse backgrounds
    and experiences with Perl. As with any free resource, the quality and depth of
    answers can vary from response to response and from day to day.


    In addition to the guidelines mentioned for Usenet, Tim Vroom who runs PerlMonks
    recommends a few more suggestions:


    +   - Try to find the answer first using Google to search Usenet, the Perl FAQs,
    and PerlMonk''s search feature.


    +   - Realize that people are usually much more receptive to answering a question
    when it''s clear you''ve put some effort into solving the problem yourself.


    +   - Use the "Chatbox" feature—a live chat with other visitors to PerlMonks—to
    ask smaller and less involved questions, or get clarification on how to use the
    site.'
