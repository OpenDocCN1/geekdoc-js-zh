  md: '# Scalar Variables


    To store scalar data in Perl, you must use a scalar variable. In Perl, you indicate
    a scalar variable with a dollar sign followed by the name of the variable. The
    following are some examples:


    ```

    $a

    ```


    ```

    $total

    ```


    ```

    $Date

    ```


    ```

    $serial_number

    ```


    ```

    $cat450

    ```


    The dollar sign—called a **type identifier**—indicates to Perl that the variable
