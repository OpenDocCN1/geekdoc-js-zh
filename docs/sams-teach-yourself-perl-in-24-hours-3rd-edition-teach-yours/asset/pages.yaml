  md: 'Each field specifier uses one item from the list, as shown in the following
    figure. For each item, there should be a field specifier; for every field specifier,
    there should be a list element.


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_220_0.png)


    print leading zeros in a number, simply put a 0 in front of the width in the field
    specifier, as follows:


    ```

    printf("%06.2f", $amt); # prints "009.40"

    ```


    What if you want a literal percent sign in your output? The sequence %% represents
    a percent sign:


    ```

    $newprice = 1.4499;

    $oldprice = 1.229;

    printf("The price went up by %3.1f%%\n", 100(($newprice/$oldprice) - 1));

    # prints "The price went up by 17.9%%!"

    ```


    # Formatted Output to a String


    The sprintf function is nearly identical to printf, except instead of being printed,
    the formatted output is returned from sprintf—ready for you to assign to a scalar
    or use in another expression, as you can see here:


    ```

    $weight=85;

    # # Format result nicely to 2-decimals


    # # Format result nicely to 2-decimals

    $monthweight = sprintf("%.2f", $weight / 6);

    print "You weigh $monthweight on the moon.",

    ```


    Remember that printf and sprintf with the %f format specifier will round your
    results to the specified number of decimal places for you.'
