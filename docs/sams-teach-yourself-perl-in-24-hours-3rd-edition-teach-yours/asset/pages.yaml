  md: '# Hour 6. Pattern Matching


    What you''ll Learn in this Hour:


    +   * How to construct simple regular expressions

    * How to use regular expressions to match patterns

    * How to edit strings using regular expressions


    In the preceding hour, you learned about reading data from files. With that information,
    combined with your knowledge of scalars, arrays, and operators, you''re prepared
    to manipulate that data to do what you wantalmost. The data in the file might
    not have an easy-to-use format that can be broken up with a simple split on spaces.
    You might have lines that contain data you''re not interested in and want to edit
    out.


    What you need is to recognize patterns in the input stream, to pick and choose
    data based on those patterns, and possibly to edit the data to a more usable form.
    One of Perl''s tools for performing these tasks is regular expressions. Throughout
    this text, regular expression and pattern will be used almost interchangeably.


    Regular expressions are almost a language unto themselves. Regular expressions
    are a formal method of describing patterns to match. In this hour, you''ll learn
    a bit of this pattern-matching language.


    # By the Way


    The online documentation has a much deeper (but more terse) description of the
    full regular expression language used by Perl. You can look at the perlre documentation
    included with Perl. The topic is so deep that an entire book has been published
    on regular expressions. This book, highly recommended by the Perl community, called
    Mastering Regular Expressions by Jeffrey E. F. Friedl (Sebastopol: O''Reilly,
    2002). It is about regular expressions in general, but close attention is paid
    to Perl.


    Regular expressions are used in other programming languages as well'
