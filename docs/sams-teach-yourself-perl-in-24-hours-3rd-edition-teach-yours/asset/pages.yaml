  md: '# Permission Allows That Permission Group


    7 Reading, writing, and executing the file


    6 Reading and writing the file


    5 Reading and executing the file


    4 Reading the file only


    3 Writing and executing the file


    2 Writing the file only


    1 Executing the file only


    0 No access to the file


    To set permissions on a file in Perl, you use the built-in function called chmod:`:


    ```

    chmod mode, list_of_files;

    ```


    The `chmod` function changes the permission on all the files in `list_of_files`
    and returns the number of files whose permission were changed. The `mode` is a
    four-digit number beginning with 0 (because it''s a literal octal number, measured
    in bits) and stands in this `Hour 2` for the permission that you want to update.
    The following are some examples of `chmod`. Note that `R` stands for read permission,
    `W` for write permission, and `X` for execute permission:


    ```

    chmod 0755, ''file.pl''; # Grants RWX to owner, RX to group and non-owners

    chmod 0644, ''myfile.txt''; # Grants RW to owner, and R to group and non-owners

    chmod 0777, ''script.pl''; # Grants RWX to everyone (usually, not very smart)

    chmod 0000, ''cia.dat''; # Nobody can do anything with this file

    ```


    Earlier this hour, you learned about the `mkdir` function. The first argument
    of `mkdir` is a file permission—the kind that `chmod` uses:


    ```

    mkdir "usr/tmp", 0777; # Publicly readable/writable/executable

    mkdir "myfiles", 0700; # A very private directory

    ```'
