  md: '# Hour 22. Basic Forms


    What You''ll Learn in This Hour:


    +   * How to process basic forms in Perl CGI programs

    * How to debug CGI forms

    * How to write safer CGI programs


    While surfing the Web, you''ve undoubtedly filled out a few HTML forms. HTML forms,
    such as email web forms, shopping carts, guestbooks, online auction forms, mailing
    list subscriptions, and order forms, are used to collect information, such as
    login information, and even web site preference settings from the browser''s user.


    When the user clicks the submit button on those forms, what happens? Almost always,
    the data from that form is passed to a CGI program. In this hour, you''ll learn
    how to take data from a form and manipulate it in your CGI programs.'
  merge: -1
  pgno: 492
- img_proc: true
  md: '# How Forms Work


    You''ve undeployed used forms on the Web, and you might even understand how they''re
    laid out and how they work. Regardless, a review of HTML form basics is in order.


    # Short Review of HTML Form Elements


    Before you jump into how a form works, you should review how HTML represents a
    form and the roles that all the elements in that form play.


    # By the Way


    The HTML presented in this book should not be taken as a model of great HTML.
    Enough HTML is presented to demonstrate the CGI features needed, but not else.
    There are generally no `<head>` or `<body>` tags, no `<!DOCTYPE>` in any of the
    HTML presented in the examples. In addition, the screens are quite plain. Feel
    free to add your own HTML to make the screens more attractive and complete. Most
    browsers will display the HTML presented here correctly.


    An **HTML form** is a portion of HTML document that accepts user input. When the
    browser loads HTML containing a form, various HTML tags create input areas on
    the page. The user input is put into form elements such as check boxes, radio
    buttons, selection menus, and text elements. After the user has manipulated the
    input elements with the web browser, the form is typically submitted to a CGI
    program for processing.


    A typical HTML form is constructed something like the one shown in Listing 22.1.


    # Listing 22.1. A Small HTML Form


    ```

    1: <form action="http://www.server.com/cgi-bin/submit.cgi" method="get">

    2: Name<input type="text" name="name"/><br/>

    3: Description<br/>

    4: <textarea name="description" rows="5" cols="40">

    5: </textarea>

    6: <input type="radio" name="sex" value="male"/>Male

    7: <input type="radio" name="sex" value="female"/>Female

    ```'
  merge: -1
  pgno: 493
- img_proc: true
  md: '```

    8: <br/>

    9: <input type="submit" value="Send"/><input type="reset"/>

    10: </form>

    ```


    Figure 22.1 shows the form from [Listing 22.1](https://example.com/listing-22-1)
    rendered with the Netscape browser.


    # Figure 22.1. The form from Listing 22.1 rendered in Netscape.


    [View full size image](https://example.com/full-size)


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_494_0.png)


    The <form>(https://example.com/form) tag specifies the beginning of the form within
    the complete HTML document. The [method](https://example.com/method) attribute
    specifies whether this form will use the [GET](https://example.com/get) or [POST](https://example.com/post)
    method for form submission. If this attribute is not specified, the browser submits
    the form to the CGI program using the [GET](https://example.com/get) method. The
    difference between the methods is documented later. The [action](https://example.com/action)
    attribute specifies the URL of the CGI program that will receive the form data.'
  merge: -1
  pgno: 494
- img_proc: true
  md: 'The HTML presents the user with an input field—a blank, text box. The text
    box is assigned a name—consistently "name".


    The <textarea> tag allows the browser to display a multiline text box to accept
    input. The important attribute to notice is the name attribute; in this case,
    the name of the field is description. Each element in an HTML form should have
    a different name attribute. When a CGI program is given for processing, the name
    attribute is used to fill the fields.


    Finally, the submit button is displayed. When the user clicks this button, the
    form values are passed to a CGI program for processing, as explained in the next
    section.


    The HTML 4.0 specification contains quite a few different element types, so I
    will not try to document all fully in this book. For example, many form element
    attributes to fix certain properties of the form element, such as rows and cols
    the textarea in the preceding form. For the rest of this book, however HTML form
    elements are used, only the most basic attributes will be used.


    # By the Way


    You can find the full HTML 4.0 specification, including the valid form elements
    and their attributes, at http://www.w3c.org.


    # What Happens When You Click Submit?


    After a user has filled in a form on his or her web browser, a short chain of
    events takes place:


    +   The data on the form is collected by the web browser into name and value pairs
    (see Figure 22.2). For example, in the sample form, the field named body takes
    on the value of the text entry field. The field named sex takes on the value of
    the radio buttons. The web browser does all this work before anything else happens.


    Figure 22.2. Browser pairing up data and fiel


    ![](img/cf381f8bfc9aae35d8aa7efee5768d06_495_0.png)'
  merge: -1
