  md: '# The Metacharacters


    In all the examples, the portion of text matched by patterns are represented with
    underlines. Remember that the entire target string is said to match even if just
    portion of it matches the regular expression. The underline marks are to help
    demonstrate exactly part of the target they match.


    It''s important to read through the following sections; however, don''t worry
    if the information doesn''t immediately make sense; it will shortly. The application
    of these metacharacters will be demonstrated in a bit.


    # A Simple Metacharacter


    The first of the metacharacters is the dot (.). Inside a regular expression, the
    dot matches any single character except a newline character. For example, in the
    pattern /p.t/, the . matches any single character. This pattern would match pot,
    pat, pit, carpet, python, and pup tent. The . requires that one character be between
    the p and the t, but no more. Thus, the pattern would not match apt (no character
    at all between p and t) or expect (too many characters between p and t).


    # The Unprintables


    Earlier you read that, to include a metacharacter inside a regular expression,
    you have to precede the character with a backslash, as shown here, to make it
    lose its meta-ness:


    ```

    /\^\$/; # A literal caret and dollar sign

    ```


    When preceded by backslash, normal characters become metacharacters. As you saw
    in Hour 2, some characters take on some special meaning in (double-quoted) string
    literals when they are preceded by a backslash; almost all those same characters
    represent the same values in regular expressions, as shown in Table 6.1.


    # Table 6.1. Special Characters


    | Character | Matches |

    | \n | A newline character |

    | \r | A carriage return |

    | \t | A tab |

    | \f | A formfeed |'
