  md: 'When you open a file, it''s sometimes nice to know whether the file exists,
    whether the file is really a directory, or whether opening the file will give
    a permission denied error. If you could examine the file metadata, you could get
    answers to these questions. For these situations, Perl provides the file test
    operators. The test operators all have the following syntax:


    ```

    -X filehandle

    ```


    ```

    -X pathname

    ```


    Here, X is the particular test you want performed, and filehandle is the filehandle
    you wanted. You can also test pathname without having an open filehandle. Table
    5.1 lists some of the operators.


    # Table 5.1. Short List of File Test Operators


    | Operator | Example | Result |

    | -r | -r ''file'' | Returns true if ''file'' is readable |

    | -w | -w $a | Returns true if the filename contained in $a is writable |

    | -e | -e ''myfile'' | Returns true if ''myfile'' exists |

    | -z | -z ''data'' | Returns true if ''data'' exists but is empty |

    | -s | -s ''data'' | Returns size of ''data'' in bytes if it exists |

    | -f | -f ''novel.txt'' | Returns true if ''novel.txt'' is a regular file rather
    than a directory |

    | -d | -d /tmp/ | Returns true if /tmp/ is a directory |

    | -T | -T ''unknown'' | Returns true if ''unknown'' appears to be a text file
    |

    | -B | -B ''unknown'' | Returns true if ''unknown'' appears to be a binary file
    |

    | -M | -M ''foo'' | Returns the age (in days) since the file ''foo'' was modified
    since this time program began |


    You can view the full list of file test operators in the online documentation.
    Type perdoc perfunc at a command prompt, or look in the section "Alphabetical
    List of Perl Funcs."


    The following snippet uses file test operators to verify that files don''t already
    exist before they are overwritten and to determine the age of the file since it
    was last modified:'
