  md: '# First Lesson in Portability


    Portability: It''s one of the things that Perl is good. Whether your Perl code
    runs on a VMS machine, Unix, a Macintosh, or under MS-DOS, there''s a very high
    probability that the Perl code you write will work seamlessly across any architecture
    that Perl supports. When you need to interact with the underlying operating system,
    such as when you''re doing I/O, Perl tries to handle all the nitty-gritty details
    for you so that your code will just work.


    # By the Way


    Some of the reasons that Perl is portable are discussed at great length in Hour
    16, "The Perl Community."


    Sometimes, though, there''s a limit to what Perl can hide from you.


    Throughout this hour, the examples here read "do this for Windows and MS-DOS,
    do this for Unix," and either one has worked, depending on the architecture you''re
    using. To accommodate both Windows and Unix with your own programs means that
    you''ll have to create two versions of each program—one for Windows and one for
    Unix. Developing these two versions creates further problems when your program
    is successful and moved to an even more alike architecture like Mac OS 9.


    It''s not uncommon for a program to be written for one architecture—such as Windows
    NT—to find itself being run under a different architecture—such as Unix. Because
    Perl runs on so many different architectures, many people assume that running
    a Perl program under Windows NT is the same as running under Unix. Web servers
    and other applications move frequently between architectures; it is just good
    sense to keep your software portable.


    Creating a different version of your program for each architecture that would
    work under every possible situation is time consuming, wasteful, and unproductive.
    But by following a few rules, you can create programs that will work everywhere,
    or at least try to work everywhere, and that are easy to fix if they do not.


    The following are some general rules for writing "go anywhere" code:


    +   1.


    Always have warnings turned on, and use the use strict directive. This way, you
    can make sure that your code will probably run with various versions of Perl and
