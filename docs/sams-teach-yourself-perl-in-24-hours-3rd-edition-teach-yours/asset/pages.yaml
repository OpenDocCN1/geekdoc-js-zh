  md: 'The last two points for writing "go anywhere" code—wrapping system-dependent
    things in subroutines and checking the architecture of the machine that is running
    on—bear a little more explanation and a demonstration.


    As you sit typing your Perl programs, you should remember that one day your Perl
    program might be used on a more machine than the one you are currently using.
    You may develop the next Amazon.com Web site, and it may move from your PC to
    a large Windows NT server or a cluster of Sun Enterprise 10000 Unix or you may
    have personal CGI programs and change Web providers only to find that your new
    provider has a different kind of server. These situations happen all of the time
    and need consideration.


    So how do you your program know the difference between Windows NT and Unix? Simple.
    The $O—that a dollar sign, a caret, and the capital letter O—contains the architecture
    name that the program is running. For example, under Windows and MS-DOS, it contains
    the string MSWin32. Under Unix, it contains the type of Unix you are running—linux,
    aix, solaris, and so on.


    The following are some tasks that depend on what operating system you are running:


    +   * Finding out anything about the system''s configuration

    * Working with the disk and directory structure

    * Using system services (such as email)


    For example, you are going to examine a piece of code to find the available disk
    space on a system. This experiment might be useful if someone wants to upload
    a file to a server or you need to find out whether the file would exist first.
    A code snippet to find the free disk space in the current drive of a Windows system
    might look like the following:


    ```

    # The last line of ''dir'' reports something like:

    #    10 dir(s)      67,502,080 bytes free

    # Or on Win98, "MB" instead of "bytes"

    my(@dir,$free);

    @dir=`dir`;

    $free=$dir[$#dir];

    $free=~s/.*([\d,]+)\s+free/\$1;

    $free=~s/,//g;

    ```


    The preceding snippet takes the last line of the directory listing—@dir—and uses
    regular expressions to remove everything but the size—the digits and commas preceding
    bytes free. Finally, the commas are removed so that $free contains just the raw
    free disk space. This approach works well for Windows'
