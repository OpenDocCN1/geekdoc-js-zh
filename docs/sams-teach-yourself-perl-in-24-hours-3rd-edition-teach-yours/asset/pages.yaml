    print DEST @contents; # Write it out to the destination

    close(DEST);\close(SOURCE);

    ```


    This snippet implements a simple file copy. As a matter of fact, you can do the
    read and write at the same time and shorten the routine, just like this:


    ```

    print DEST <SOURCE>;

    ```


    By print expects a list as an argument, <SOURCE> is evaluated in a list context.
    When the angle operator is evaluated in a list context, the entire file is read
    and then printed to the filehandle DEST.'
