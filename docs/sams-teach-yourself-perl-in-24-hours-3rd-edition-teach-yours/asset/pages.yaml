  md: 'time to seek out help. The first place to look for answers is in the Perl documentation.


    As indicated in Hour 1, "Getting Started with Perl," every Perl installation comes
    with a full set of documentation. For the 5.8 release, more than 2,200 pages of
    documentation are included with the distribution. Every module, function, and
    most aspects of the Perl language are covered in the documentation, as well as
    a large Frequently Asked Questions and tutorials.


    To get a list of available documentation, type perldoc perl at a command prompt.
    Each of the manual sections is listed, as well a general description of Perl.


    The Frequently Asked Questions list contains a list of the most commonly asked
    questions that beginners and experts have about the Perl language. It''s worth
    browsing online to get an idea of what kind of questions are, even if you don''t
    completely understand the answers yet.


    If, for some reason, you do not have the Perl documentation installed on your
    system or perldoc does not present the documentation, you should first look to
    your system''s administrator to find the documentation. Having the documentation
    correctly installed is important because the online documentation matches the
    version of Perl you''re running. Any other documentation might have differences.


    If you cannot access the online documentation, you can also find the documentation
    at http://www.perl.com.


    # Learn from the Mistakes of Others


    Usenet is a distributed messaging system that was developed in the early 1980s
    and pred the fledgling Internet. Usenet is divided into thousands of discussion
    groups, with topics ranging from meditation, gardening, computing, and science
    fiction to hiking and skating, along with regional groups for every region of
    the world. A few newsgroups are specific to Perl:


    +   comp.lang.perl.announce News about new Perl releases, modules, and information


    +   comp.lang.perl.moderated Low-traffic group with moderated discussions about
    Perl


    +   comp.lang.perl.misc High-traffic discussion group about anything related to
    Perl


    To read Usenet, you need a newsreader, and newsreaders are not hard to find. You
    can go to any software download and get a newsreader. You can also go to Web Archives
    as groups.google.com to mirror the Usenet newsgroups in a Web format and require
    only that you have a Web browser to read news.


    In these newsgroups, people post questions about problems that they''re having
    with Perl, and other people answer the questions—all on a voluntary basis. Also,
    discussions about general-interest topics related to Perl take place here.


    An observation that has held true through my entire programming career is as follows:
    There are no original problems in computing. Any problem that you are having,
    someone else has had before. The trick is finding who asked the question and what
    answer that person found. It''s very likely that at least one person has asked'
  merge: -1
