    Listing14.2 contains another File::Find example. This removes all the files on
    the C: and D drives with the .extension; these temporary files accumulate and
    tend to clutter your hard disk. You can easily use this program to remove files
    from a Unix system or perform any kind of file maintenance.


    # Listing 14.2. Removing Temporary Files


    ```

    1: #!/usr/bin/perl -w

    2 use strict;

    3: use File::Find;

