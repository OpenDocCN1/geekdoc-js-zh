  md: '# Full List of Standard Modules


    A lengthy description of the full list of modules included with Perl is well beyond
    the scope of this book. The following is a listing of the modules in the standard
    Perl distribution with a brief description. If you are curious about what the
    module does and how it works, use perldoc to view the documentation for a specific
    module.


    | Module Name | Description |


    | AutoLoader | Allows Perl to compile functions only when needed. |


    | AutoSplit | Splits modules for autoloading. |


    | Benchmark | Allows repetitive testing of Perl functions for speed benchmarking.
    |


    | CGI | Allows easy access to the Common Gateway Interface for Web programming,
    covered in Hours I7 to 24. |


    | CPAN | Provides access to the archive of Perl''s modules, for installing new
    modules. |


    | Carp | Generates error messages. |


    | DirHandle | Provides an object interface to directory handles. |


    | Env | Maps the operating system''s environment into variables. |


    | Exporter | Allows you to write your own modules. |


    | ExtUtils::* | Allow you to write your own modules or install modules. |


    | File::* | Offer more file-manipulation operations, such as File::Copy. |


    | File::Spec::* | Allows OS-independent operations on filenames. |


    | FileCache | Opens more files than the OS normally allows. |


    | FindBin | Finds the name of the current executing program. |


    | Getopt::* | Allow you to process command-line options in your programs. |


    | I18N::Collate | Allows locale-specific sorting. |


    | IPC::* | Provide Interprocess Communications; two- and three-ended pipes, for
    example. |


    | Math::* | Allow you to use extended math libraries with arbitrary-precision
    floating-point, integer, and complex numbers. |


    | Net::* | Allow you to get information on network hosts. For example, Net::hostent
    Translates IP addresses—such as 204.71.200.68—into host names—such as www.yahoo.com.
    |'
