    ```


    The preceding snippet contains elements you might not understand. That''s okay;
    some of it has not been presented to you yet. The permissions as retrieved by
    stat—in $mode in this case—contains lots of "extra" information. The &0777 strips
    just the portion of the information you''re interested in here. Finally, % is
    a printf that formats numbers in octal—the 0–7 in which Unix expects permissions
    to be formatted.


    # By the Way


    Octal is a base-8 representation of numbers. It''s used in Unix for largely historical
    reasons, but it came along with Perl anyway. If you''re still lost, don''t panic.
    Just use the printf shown previously if you ever need to display a file''s permissions.
    It doesn''t happen that often; don''t worry if you don''t get that part.'
