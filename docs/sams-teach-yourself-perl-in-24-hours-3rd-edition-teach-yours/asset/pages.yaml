    \ statement is not executed.\n\nThe if statement can also run one set of statements\
    \ if a condition is true and another set of statements if it's not. That structure\
    \ is called an if-else statement. The syntax looks like this:\n\n```\nif (expression)\
    \      # If expression is true...\n\n    block1               # ...this block\
    \ of code is run.\nelse\n    block2               # Otherwise this block is run.\n\
    ```\n\nThe first block, block1, is run only if the expression is true; if the\
