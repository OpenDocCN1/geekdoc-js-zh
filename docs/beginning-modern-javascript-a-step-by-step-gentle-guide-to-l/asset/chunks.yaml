    ![16 待办事项列表](img/image_rsrc2ER.jpg)


    要开始构建这个应用程序，我们需要创建一个简单的服务器来存储任务数据。为此，我们需要安装 Node.js。


    ## 安装 Node.js


    Node.js 是一个 JavaScript 运行时应用程序，它让你能够在浏览器之外运行 JavaScript。我们需要在计算机上安装这个应用程序来创建一个简单的服务器。


    你可以从 [`nodejs.org`](https://nodejs.org) 下载并安装 Node.js。选择推荐的 LTS 版本，因为它具有长期支持。


    ## 创建服务器和数据库


    为了设置这个项目，我们创建一个名为 `todo-list` 的新文件夹。在 VSCode 中打开这个文件夹，然后创建一个名为 `db.json` 的新文件，并将以下内容放入其中：


    ```json

    { "tasks":  [ { "title":  "Learn Swimming", "completed":  true, "id":  1 }, {
    "title":  "Learn Cooking", "completed":  false, "id":  2 } ]  }

    ```


    这个 JSON 文件将作为我们应用程序的数据库。当我们添加新任务时，这个文件会被更新。


    下一步是将这个 JSON 文件作为服务器运行。为此，你需要使用 Node Package Manager（简称 NPM）来安装一个 json 服务器。


    首先，右键单击 `todo-list` 文件夹，然后选择 **在集成终端中打开** 选项。这将打开一个终端，你可以在其中运行一些命令。


    我希望你运行的命令是 `npm install -g json-server`。这个命令会在你的计算机上全局安装 `json-server` 包。


    安装完成后，你应该会看到以下输出：


    ![16 安装 json 服务器](img/image_rsrc2ES.jpg)


    下一步是运行 `json-server` 包。在终端中运行以下命令：


    ```bash

    json-server db.json

    ```


    如果你看到以下输出，说明 JSON 服务器运行成功：


    ![16 运行 json 服务器](img/image_rsrc2ET.jpg)


    你可以打开浏览器，访问 [`localhost:3000/tasks`](http://localhost:3000/tasks) 这个 URL，查看我们之前创建的
    JSON 数据。


    我们将要创建的待办事项列表应用程序将访问这个 API 端点，用于获取、添加、删除和更新任务。


    你已经成功创建了一个暴露 API 端点的简单服务器。干得漂亮！


    ## 让我们开始项目：先处理 HTML 和 CSS


    下一步是编写项目的前端部分。在 VSCode 中打开 `client` 文件夹，然后创建两个文件：`index.html` 和 `script.js`。


    打开 `index.html` 文件，编写标准的 HTML 文档结构，就像我们创建向导表单时那样：


    ```html

    <!DOCTYPE html>


    <html lang="en">


      <head>


        <meta charset="UTF-8" />


        <meta name="viewport" content="width=device-width, initial-scale=1.0" />


        <title>To-do List</title>


      </head>


      <body></body>


    </html>

    ```


    为了将注意力集中在 JavaScript 部分，我们将使用 Bootstrap 来为 HTML 标签添加样式。Bootstrap 是一个包含预编写 CSS
    规则的库，你可以将其应用到项目中。


    要使用 Bootstrap 样式，你只需为 HTML 元素添加特定的类。通过创建一个从 CDN 服务器获取 Bootstrap CSS 的链接，将 Bootstrap
    添加到我们的项目中，如下所示：


    ```html

    <title>To-do List</title>


    <link


      rel="stylesheet"


      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"


    />

    ```


    CDN 代表内容分发网络，它是一个允许你获取流行库的服务器。通过使用 CDN，你无需将 Bootstrap CSS 文件下载到本地并加载。


    最后一步是将 `script.js` 文件添加到 HTML 文件中。和往常一样，添加 `defer` 属性，以便浏览器在 HTML 文档渲染完成后加载脚本：


    ```html

    <script src="script.js" defer></script>


    </head>

    ```


    现在我们需要在 `<body>` 标签中添加一些 HTML。首先，编写一个容器，它将包含我们所有的 HTML 内容。我会添加一些注释来帮助你正确放置 HTML：


    ```html

    <body>


      <div class="container m-5 rounded mx-auto bg-light shadow">


        <!-- 应用标题部分 开始-->


        <div class="row p-4">


          <div class="col">


            <h1 class="text-center">


              <u>我的待办事项列表 ✅</u>


            </h1>


          </div>


        </div>


        <!-- 应用标题部分 结束 -->


      </div>


    </body>

    ```


    在“应用标题部分 结束”注释下方，添加一个输入框和一个按钮，我们将用它们来创建任务。输入框和按钮周围的 div 仅用于应用 Bootstrap 样式：


    ```html

    <!-- 创建任务部分 开始 -->


    <div class="row p-3">


      <div class="col col-11 mx-auto">


        <div class="row bg-white rounded shadow-sm p-2">


          <div class="col">


            <input


              type="text"


              id="task-title"


              class="form-control border-0 rounded"


              placeholder="在此输入任务.."


            />


          </div>


          <div class="col-auto">


            <button type="button" class="btn btn-primary" onClick="addTask()">


              添加任务


            </button>


          </div>


        </div>


      </div>


    </div>


    <div class="my-2 mx-4 border-bottom"></div>


    <!-- 创建任务部分 结束 -->

    ```


    接下来，在“创建任务部分”下方添加筛选部分。这个筛选部分将包含一个选择输入框：


    ```html

    <!-- 筛选选项部分 开始 -->


    <div class="row p-3 justify-content-end">


      <div class="col-auto d-flex align-items-center">


        <label class="text-secondary my-2 me-2">筛选</label>


        <select class="form-select form-select-sm" onChange="filterTasks(event)">


          <option value="all" selected>全部</option>


          <option value="completed">已完成</option>


          <option value="active">进行中</option>


        </select>


      </div>


    </div>


    <!-- 筛选选项部分 结束 -->

    ```


    最后一步是显示任务。这里我们将使用表格元素：


    ```html

    <!-- 任务列表部分 开始 -->


    <div class="row px-5">


      <div class="col">


        <div class="table-responsive">


          <table class="table table-striped table-bordered table-hover">


            <tbody id="tbody-tasks">


              <tr>


                <td><input class="form-check-input" type="checkbox" checked /></td>


                <td>Learn JavaScript</td>


                <td>


                  <button type="button" class="btn btn-link">编辑</button>


                </td>


                <td>


                  <button type="button" class="btn btn-link">删除</button>


                </td>


              </tr>


              <tr>


                <td><input class="form-check-input" type="checkbox" /></td>


                <td>Learn HTML</td>


                <td>


                  <button type="button" class="btn btn-link">编辑</button>


                </td>


                <td>


                  <button type="button" class="btn btn-link">删除</button>


                </td>


              </tr>


            </tbody>


          </table>


        </div>


      </div>


    </div>


    <!-- 任务列表部分 结束 -->

    ```


    现在 HTML 部分完成了。右键单击 `index.html` 文件，选择 **用 Live Server 打开** 来查看结果。


    如果你需要检查代码，可以获取本章使用的代码，地址为 [`github.com/nathansebhastian/js-todo-list/tree/main/check-point-1`](https://github.com/nathansebhastian/js-todo-list/tree/main/check-point-1)


    ## 总结


    在本章中，我们安装了 Node.js，并使用 `json-server` 包创建了一个简单的服务器。我们在这个项目中使用的数据库是一个名为 `db.json`
    的简单 JSON 文件。


    我们还为待办事项应用程序创建了 HTML 文件，并使用 Bootstrap 为元素添加了样式。


    ## 第 17 章：为应用程序添加 CRUD 功能


    创建、读取、更新和删除（CRUD）是构成 Web 应用程序核心的四个基本功能。在本章中，我们将学习如何使用 JavaScript 实现它们。


    在开始为待办事项列表创建功能之前，我们需要编辑 Live Server 设置，防止在 `db.json` 文件发生变化时服务器重新加载。


    如果不这样做，当我们添加、编辑或删除任务时，应用程序将会中断。


    '
- fmt: "\nOpen the VSCode Settings menu by pressing `Ctrl + ,` or `Command + ,` and\
    \ search for `'live server ignore'`. You should see the following output:\n\n\
    ![17 liveserver settings](OEBPS/image_rsrc2EU.jpg)\n\nClick the `Edit in settings.json`\
    \ link, and add `db.json` to the Live Server ignore files settings as shown below:\n\
    \n```json\n\"liveServer.settings.ignoreFiles\": [\n    \"db.json\",\n    \".vscode/**\"\
    ,\n    \"**/*.scss\",\n    \"**/*.sass\",\n    \"**/*.ts\"\n]\n```\n\nSave the\
    \ changes. Now Live Server won’t reload when there’s a change in the `db.json`\
    \ file.\n\n## Use Fetch to Get and Display Tasks from the API\n\nNow that we have\
    \ the database and the interface ready, the next step is to use JavaScript to\
    \ get tasks data and display it in our table. We’re going to use the Fetch API\
    \ for that.\n\nOpen the `script.js` file, and write the following `getTask()`\
    \ function:\n\n```javascript\nconst BASE_API_URL = 'http://localhost:3000/tasks';\n\
    \nfunction getTasks() {\n  const tableElement = document.querySelector('#tasks-table');\n\
    \  fetch(BASE_API_URL)\n    .then(response => response.json())\n    .then(tasks\
    \ => {\n      console.log(tasks);\n    });\n}\n\ngetTasks();\n```\n\nIn the code\
    \ above, we declared a constant variable to store the API URL we’re going to hit\
    \ with requests.\n\nBelow the constant, we created a function called `getTasks()`\
    \ that will execute a network request using `fetch()`. To check if we successfully\
    \ retrieved the data, we printed the tasks to the console.\n\nIf you open the\
    \ browser console, you should see the following output:\n\n![17 get tasks output](OEBPS/image_rsrc2EV.jpg)\n\
    \nThis means we successfully retrieved the tasks data. The next step is to display\
    \ those data on our To-do List. We need to query the `<tbody>` element in our\
    \ HTML page and put the tasks as rows there.\n\nRecall that in our previous chapter,\
    \ we put the `id` attribute to the `<tbody>` tag as follows:\n\n```html\n<tbody\
    \ id=\"tbody-tasks\">\n  ...\n</tbody>\n```\n\nThis means we can get the element\
    \ using the query selector:\n\n```javascript\nconst BASE_API_URL = 'http://localhost:3000/tasks';\n\
    const tableElement = document.querySelector('#tbody-tasks');\n```\n\nThen we go\
    \ back into the `getTasks()` function, remove the `console.log()` method and create\
    \ table rows based on the tasks data.\n\nBelow, you can see that the code for\
    \ creating the elements is quite long, but it’s essentially the same as when we\
    \ create buttons for the Wizard Form:\n\n```javascript\nfunction getTasks() {\n\
    \  let tableRows = '';\n  fetch(BASE_API_URL)\n    .then(response => response.json())\n\
    \    .then(tasks => {\n      tasks.forEach(task => {\n        const element =\
    \ `<tr class=${\n          task.completed ? 'table-success' : ''\n        }><td><input\
    \ class=\"form-check-input\" type=\"checkbox\" ${\n          task.completed ?\
    \ 'checked' : ''\n        } onclick=\"toggleTask(event, ${task.id})\"></td><td>${\n\
    \          task.title\n        }</td><td><button type=\"button\" class=\"btn btn-link\"\
    \ onclick=\"editTask(${\n          task.id\n        })\">Edit</button></td><td><button\
    \ type=\"button\" class=\"btn btn-link\" onclick=\"deleteTask(${\n          task.id\n\
    \        })\">Delete</button></td></tr>`;\n        tableRows += element;\n   \
    \   });\n      tableElement.innerHTML = tableRows;\n    });\n}\n```\n\nIn the\
    \ above code, we create a variable named `tableRows` that starts as an empty string.\
    \ Next, we iterate over the `tasks` array using the `forEach()` method, and create\
    \ an `element` variable for each task data.\n\nThis `element` variable uses the\
    \ data from the array to dynamically adjust the HTML output. If the task is marked\
    \ as completed, then the `table-success` class is added to the `<tr>` tag, and\
    \ the `checked` attribute is added to the checkbox.\n\nWhen the checkbox is clicked,\
    \ then the `toggleTask()` function will be called. When the Edit button is clicked,\
    \ then the `editTask()` function will be called, and when the Delete button is\
    \ clicked, the `deleteTask()` button is called.\n\nThe elements are stored in\
    \ the `tableRows` variable, and when the `forEach()` process is finished, we set\
    \ the `innerHTML` value of the `tableElement` to the `tableRows` value.\n\nIf\
    \ you open the browser, you should see the tasks appear on the table like this:\n\
    \n![17 get data](OEBPS/image_rsrc2EW.jpg)\n\nSince we’re able to display the data,\
    \ we can remove the hard-coded `<tr>` elements in our `index.html` file. Remove\
