- fmt: "\nThe input you passed to fill a parameter is called an argument, and here’s\
    \ how to do it:\n\n`greet(\"Peter\");`\n\nThe `'Peter'` string inside the parentheses\
    \ when calling the `greet()` function will be passed as the `name` parameter.\n\
    \nRun the code to receive this output:\n\n```\nHello, Peter!\nNice weather today,\
    \ right?\n```\n\nYou can have more than one parameter when defining the function,\
    \ but you need to split each parameter with a comma as follows:\n\n```\nfunction\
    \ greet(name, weather) {\n  console.log(`Hello, ${name}!`);\n  console.log(`It's\
    \ ${weather} today, right?`);\n}\n\ngreet(\"Nathan\", \"rainy\");\n```\n\nOutput:\n\
    \n```\nHello, Nathan!\nIt's rainy today, right?\n```\n\nWhen you specify two parameters\
    \ in the function header, you need to pass two arguments. If you call the function\
    \ without passing the arguments then the value will be `undefined`.\n\nIn the\
    \ next section, you’ll learn how to create parameters with default values, which\
    \ allows you to call the function without having to pass an argument to it.\n\n\
    But for now, I hope you see the convenience of having parameters. They make your\
    \ functions more adaptable and reusable by taking different input values to cover\
    \ a variety of scenarios the function might have.\n\nAs shown in the example,\
    \ the `name` and `weather` parameters allow you to greet many different people\
    \ in different weathers.\n\nWhether sunny, rainy, or cloudy, just change the `name`\
    \ and `weather` arguments when you want to greet another person.\n\n## Default\
    \ Parameters\n\nWhen defining a function, you can set a default value for any\
    \ parameter in that function.\n\nFor example, the `name` parameter in the function\
    \ below is a default parameter:\n\n```\nfunction greet(name = \"Nathan\") {\n\
    \  console.log(`Hello, ${name}!`);\n  console.log(\"Nice weather today, right?\"\
    );\n}\n```\n\nHere, the default value `'Nathan'` will be used when no value or\
    \ `undefined` is passed for the `name` parameter.\n\nYou can test this by calling\
    \ the `greet()` function without an argument as follows:\n\n```\ngreet();\ngreet(\"\
    Jack\");\n```\n\nOutput:\n\n```\nHello, Nathan!\nNice weather today, right?\n\
    Hello, Jack!\nNice weather today, right?\n```\n\nAny function you define can have\
    \ a mix of default and non-default parameters.\n\nHere’s another example of a\
    \ function that has one default parameter called `name` and one non-default parameter\
    \ called `weather`:\n\n```\nfunction greet(weather, name = \"Nathan\") {\n  console.log(`Hello,\
    \ ${name}!`);\n  console.log(`It's ${weather} today, right?`);\n}\n\ngreet(\"\
    sunny\");\n```\n\nOutput:\n\n```\nHello, Nathan!\nIt's sunny today, right?\n```\n\
    \nNotice that the `weather` parameter was placed in front of the `name` parameter.\
    \ This is for convenience so that you don’t need to specify the default parameter.\n\
    \nIf you place the non-default parameter after the default parameter, then you\
    \ need to pass a value to the `name` parameter to get to the `weather` parameter.\n\
    \nConsider the example below:\n\n```\nfunction greet(name = \"Nathan\", weather)\
    \ {\n  console.log(`Hello, ${name}!`);\n  console.log(`It's ${weather} today,\
    \ right?`);\n}\n\ngreet(undefined, \"sunny\");\n```\n\nTo pass an argument to\
    \ the `weather` parameter, we need to pass `undefined` or any value for the `name`\
    \ parameter first.\n\nThis is why it’s better to specify non-default parameters\
    \ in front of default parameters.\n\n## Default Parameters and Null\n\nBack in\
    \ Section 2, recall that we briefly explored the difference between `undefined`\
    \ as the \"default\" empty value and `null` as the \"intentional\" empty value.\n\
    \nWhen you pass `undefined` to a function that has a default parameter, the default\
    \ parameter will be used:\n\n```\nfunction greet(name = \"John\"){\n  console.log(name);\n\
    }\n\ngreet(undefined); // John\n```\n\nAs you can see, JavaScript prints the default\
    \ parameter value `John` when you pass `undefined` to the function.\n\nBut when\
    \ you pass `null` to the function, the default parameter will be ignored:\n\n\
    ```\nfunction greet(name = \"John\"){\n  console.log(name);\n}\n\ngreet(null);\
    \ // null\n```\n\nThis is one of the common mistakes that beginners make when\
    \ learning JavaScript. When you use the value `null`, JavaScript will think you\
    \ want that value to be empty, so it doesn’t replace the value with the default\
    \ parameter.\n\nWhen you use `undefined`, then JavaScript will replace it with\
    \ the default parameter. You might encounter this issue as you work with JavaScript\
    \ code in your career, so just keep this in mind.\n\n## The `return` Statement\n\
    \nA function can also have a `return` statement inside the code block. A `return`\
    \ statement is used to return a value back to the caller.\n\nFor example, the\
    \ following function returns the sum of two values:\n\n```\nfunction sum(a, b)\
    \ {\n  return a + b;\n}\n\nlet result = sum(3, 2);\nconsole.log(result); // 5\n\
    ```\n\nThe value returned by a function can be assigned to a variable for further\
    \ operation. You can add the `return` statement anywhere inside the function.\n\
    \nWhen JavaScript reaches the `return` statement, it skips further code written\
    \ inside the function block and goes back to where you call the function.\n\n\
    The following function has two `return` statements:\n\n```\nfunction checkAge(age)\
    \ {\n  if (age > 18) {\n    return \"You may get a car license\";\n  }\n  return\
    \ \"You may not get a car license yet\";\n}\n\nconsole.log(checkAge(20));\nconsole.log(checkAge(15));\n\
    ```\n\nOutput:\n\n```\nYou may get a car license\nYou may not get a car license\
    \ yet\n```\n\nWhen we call the `checkAge()` function the first time, the value\
    \ of `age` argument is greater than 18, so JavaScript executes the `return` statement\
    \ inside the `if` block.\n\nThe second time we called the function, the `if` condition\
    \ wasn’t met, so JavaScript executed the `return` statement under the `if` block\
    \ instead.\n\nYou can also stop a function execution and return to the caller\
    \ by specifying the `return` statement without any value:\n\n```\nfunction greet()\
    \ {\n  console.log(\"Hello!\");\n  return;\n  console.log(\"Good bye!\");\n}\n\
    \ngreet()\n```\n\nOutput:\n\n```\nHello!\n```\n\nHere, the `return` statement\
    \ is called between the `console.log()` calls.\n\nJavaScript executes the first\
    \ `console.log()` call, then skips the rest of the code. The `'Good bye!'` string\
    \ isn’t printed.\n\n## Variable Scope\n\nNow that you’re learning about functions,\
    \ it’s a good time to talk about variable scope.\n\nA variable declared inside\
    \ a function can only be accessed from that function. This is because that variable\
    \ has a local scope.\n\nOn the other hand, a variable declared outside of any\
    \ block is known as a global variable because of its global scope.\n\nThese two\
    \ scopes are important because when you try to access a local variable outside\
    \ of its scope, you’ll get an error. For example:\n\n```\nfunction greet() {\n\
    \  let myString = \"Hello World!\";\n}\n\ngreet();\nconsole.log(myString);\n```\n\
    \nWhen you run the code above, JavaScript responds with an error:\n\n```\nReferenceError:\
    \ myString is not defined\n```\n\nThis is because the `myString` variable is declared\
    \ inside the `greet()` function, so you can’t access that variable outside of\
    \ it. It doesn’t matter even if you called that function before accessing the\
    \ variable.\n\nMeanwhile, a global variable can be accessed from anywhere, even\
    \ inside a function:\n\n```\nlet myString = \"Hello World!\";\n\nfunction greet()\
    \ {\n  console.log(myString);\n}\n\ngreet(); // Hello World!\n```\n\nHere, the\
    \ `greet()` function is able to access the `myString` variable declared outside\
    \ of it.\n\nKeep in mind that this applies only to variables declared using `let`\
    \ and `const`.\n\nNext, you can also define a local variable with the same name\
    \ as the global variable without overwriting it.\n\nHere’s an example:\n\n```\n\
    let myString = \"Hello World!\";\n\nfunction greet() {\n  let myString = \"Morning!\"\
    ;\n  console.log(myString);\n}\n\ngreet();  // Morning!\nconsole.log(myString);\
    \ // Hello World!\n```\n\nWhen you call the `greet()` function, a local variable\
    \ called `myString` is assigned the string `'Morning!'`.\n\nOutside of the function,\
    \ the global variable that’s also called `myString` still exists, and the value\
    \ isn’t changed.\n\nJavaScript considers the local scope variable to be a different\
    \ variable. When you declare the same variable inside a function, any code inside\
    \ the function will always refer to the local variable.\n\nIn practice, you rarely\
    \ need to declare the same variable in different scopes.\n"
  raw: 'The input you passed to fill a parameter is called an argument, and here’s
    how to do it:


    greet("Peter");


    The ''Peter'' string inside the parentheses when calling the greet() function
    will be passed as the name parameter.


    Run the code to receive this output:


    Hello, Peter!


    Nice weather today, right?


    You can have more than one parameter when defining the function, but you need
    to split each parameter with a comma as follows:


    function greet(name, weather) {


      console.log(`Hello, ${name}!`);


      console.log(`It''s ${weather} today, right?`);


    }


    greet("Nathan", "rainy");


    Output:


    Hello, Nathan!


    It''s rainy today, right?


    When you specify two parameters in the function header, you need to pass two arguments.
    If you call the function without passing the arguments then the value will be
    undefined.


    In the next section, you’ll learn how to create parameters with default values,
    which allows you to call the function without having to pass an argument to it.


    But for now, I hope you see the convenience of having parameters. They make your
    functions more adaptable and reusable by taking different input values to cover
    a variety of scenarios the function might have.


    As shown in the example, the name and weather parameters allow you to greet many
    different people in different weathers.


    Whether sunny, rainy, or cloudy, just change the name and weather arguments when
    you want to greet another person.


    ## Default Parameters


    When defining a function, you can set a default value for any parameter in that
    function.


    For example, the name parameter in the function below is a default parameter:


    function greet(name = "Nathan") {


      console.log(`Hello, ${name}!`);


      console.log("Nice weather today, right?");


    }


    Here, the default value ''Nathan'' will be used when no value or undefined is
    passed for the name parameter.


    You can test this by calling the greet() function without an argument as follows:


    greet();


    greet("Jack");


    Output:


    Hello, Nathan!


    Nice weather today, right?


    Hello, Jack!


    Nice weather today, right?


    Any function you define can have a mix of default and non-default parameters.


    Here’s another example of a function that has one default parameter called name
    and one non-default parameter called weather:


    function greet(weather, name = "Nathan") {


      console.log(`Hello, ${name}!`);


      console.log(`It''s ${weather} today, right?`);


    }


    greet("sunny");


    Output:


    Hello, Nathan!


    It''s sunny today, right?


    Notice that the weather parameter was placed in front of the name parameter. This
    is for convenience so that you don’t need to specify the default parameter.


    If you place the non-default parameter after the default parameter, then you need
    to pass a value to the name parameter to get to the weather parameter.


    Consider the example below:


    function greet(name = "Nathan", weather) {


      console.log(`Hello, ${name}!`);


      console.log(`It''s ${weather} today, right?`);


    }


    greet(undefined, "sunny");


    To pass an argument to the weather parameter, we need to pass undefined or any
    value for the name parameter first.


    This is why it’s better to specify non-default parameters in front of default
    parameters.


    ## Default Parameters and Null


    Back in Section 2, recall that we briefly explored the difference between undefined
    as the "default" empty value and null as the "intentional" empty value.


    When you pass undefined to a function that has a default parameter, the default
    parameter will be used:


    function greet(name = "John"){


      console.log(name);


    }


    greet(undefined); // John


    As you can see, JavaScript prints the default parameter value John when you pass
    undefined to the function.


    But when you pass null to the function, the default parameter will be ignored:


    function greet(name = "John"){


      console.log(name);


    }


    greet(null); // null


    This is one of the common mistakes that beginners make when learning JavaScript.
    When you use the value null, JavaScript will think you want that value to be empty,
    so it doesn’t replace the value with the default parameter.


    When you use undefined, then JavaScript will replace it with the default parameter.
    You might encounter this issue as you work with JavaScript code in your career,
    so just keep this in mind.


    ## The return Statement


    A function can also have a return statement inside the code block. A return statement
    is used to return a value back to the caller.


    For example, the following function returns the sum of two values:


    function sum(a, b) {


      return a + b;


    }


    let result = sum(3, 2);


    console.log(result); // 5


    The value returned by a function can be assigned to a variable for further operation.
    You can add the return statement anywhere inside the function.


    When JavaScript reaches the return statement, it skips further code written inside
    the function block and goes back to where you call the function.


    The following function has two return statements:


    function checkAge(age) {


      if (age > 18) {


        return "You may get a car license";


      }


      return "You may not get a car license yet";


    }


    console.log(checkAge(20));


    console.log(checkAge(15));


    Output:


    You may get a car license


    You may not get a car license yet


    When we call the checkAge() function the first time, the value of age argument
    is greater than 18, so JavaScript executes the return statement inside the if
    block.


    The second time we called the function, the if condition wasn’t met, so JavaScript
    executed the return statement under the if block instead.


    You can also stop a function execution and return to the caller by specifying
    the return statement without any value:


    function greet() {


      console.log("Hello!");


      return;


      console.log("Good bye!");


    }


    greet()


    Output:


    Hello!


    Here, the return statement is called between the console.log() calls.


    JavaScript executes the first console.log() call, then skips the rest of the code.
    The ''Good bye!'' string isn’t printed.


    ## Variable Scope


    Now that you’re learning about functions, it’s a good time to talk about variable
    scope.


    A variable declared inside a function can only be accessed from that function.
    This is because that variable has a local scope.


    On the other hand, a variable declared outside of any block is known as a global
    variable because of its global scope.


    These two scopes are important because when you try to access a local variable
    outside of its scope, you’ll get an error. For example:


    function greet() {


      let myString = "Hello World!";


    }


    greet();


    console.log(myString);


    When you run the code above, JavaScript responds with an error:


    ReferenceError: myString is not defined


    This is because the myString variable is declared inside the greet() function,
    so you can’t access that variable outside of it. It doesn’t matter even if you
    called that function before accessing the variable.


    Meanwhile, a global variable can be accessed from anywhere, even inside a function:


    let myString = "Hello World!";


    function greet() {


      console.log(myString);


    }


    greet(); // Hello World!


    Here, the greet() function is able to access the myString variable declared outside
    of it.


    Keep in mind that this applies only to variables declared using let and const.


    Next, you can also define a local variable with the same name as the global variable
    without overwriting it.


    Here’s an example:


    let myString = "Hello World!";


    function greet() {


      let myString = "Morning!";


      console.log(myString);


    }


    greet();  // Morning!


    console.log(myString); // Hello World!


    When you call the greet() function, a local variable called myString is assigned
    the string ''Morning!''.


    Outside of the function, the global variable that’s also called myString still
    exists, and the value isn’t changed.


    JavaScript considers the local scope variable to be a different variable. When
    you declare the same variable inside a function, any code inside the function
    will always refer to the local variable.


    In practice, you rarely need to declare the same variable in different scopes:'
