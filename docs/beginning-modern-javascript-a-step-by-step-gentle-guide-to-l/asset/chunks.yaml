    add a submit button to the third step, so let’s do it.


    Add the submit button to the step3 div as follows:


    <div id="step3" class="step">


      <div class="form-group">


        <label for="password">Password</label>


        <input


          class="form-control"


          name="password"


          type="password"


          placeholder="Enter password"


        />


      </div>


      <button type="button" class="btn btn-previous" onclick="prevStep()">


        Previous


      </button>


      <button type="submit" class="btn btn-submit f-right">Submit</button>


    </div>


    Add the CSS for the submit button in style.css as follows:


    .btn-submit {


      border-color: #28a745;


      background-color: #28a745;


    }


    Now we need to listen when the submit button is clicked.


    ## Listening to Form Submit Events Using JavaScript


    Besides the DOM API, the browser also expose signals known as events that you
    can use as a cue to run a specific code. We have done this earlier when adding
    the onclick attribute to the buttons:


    <button type=''button'' class=''btn btn-secondary'' onclick=''prevStep()''>


        Previous


      </button>


      <button type=''button'' class=''btn btn-primary f-right'' onclick=''nextStep()''>


        Next


      </button>


    The onclick HTML attribute is a shortcut to listen to the click event. When the
    previous button is clicked, we run the prevStep() function. When the next button
    is clicked, we run the nextStep() function.


    Aside from using the onclick attribute, we can also add event listeners using
    the addEventListener() method.


    Let’s add an event listener so that we know when a form is submitted. The Wizard
    Form we created has an id attribute, so you can select that form using JavaScript.


    const wizardForm = document.querySelector(''#wizard-form'');


    Next, you need to call the addEventListener() method and listen to the ''submit''
    event as follows:


    const wizardForm = document.querySelector(''#wizard-form'');


    wizardForm.addEventListener(''submit'', function (event) {


      // TODO: handle the submit event


    });


    Now that we can listen to the submit event, we need to interrupt the default behavior
    of the form so that JavaScript can take over.


    To do so, we need to call the event.preventDefault() method inside the function
    we passed to the event listener:


    const wizardForm = document.querySelector(''#wizard-form'');


    wizardForm.addEventListener(''submit'', function (event) {


      event.preventDefault();


    });


    The preventDefault() method interrupts the default flow of the submit event, which
    will cause the browser to refresh the current page.


    From here, you can instruct JavaScript to do specific tasks to the form data submitted
    by the user.


    The form object has an object property named elements that store all input elements
    you define inside the form. Inside the object, you can access the value of input
    fields by specifying its name attribute, followed by the value property.


    Here’s how to get the values form our Wizard Form:


    event.preventDefault();


    const email = wizardForm.elements.email.value;


    const username = wizardForm.elements.username.value;


    const password = wizardForm.elements.password.value;


    Finally, we display the data using the JavaScript alert() function, which


    const email = wizardForm.elements.email.value;


    const username = wizardForm.elements.username.value;


    const password = wizardForm.elements.password.value;


    alert(`Registration complete! Your details: \n


      Email: ${email} \n


      Username: ${username} \n


      Password: ${password}`);


    You can test the Wizard Form in the browser. Fill in the textboxes and you’ll
    get an alert when clicking the submit button:


    Just to make the application smarter, we can reset the form after it has been
    submitted by the user:


    const email = wizardForm.elements.email.value;


      const username = wizardForm.elements.username.value;


      const password = wizardForm.elements.password.value;


    //   alert(...);


      wizardForm.reset();


      currentStep = 1;


      showStep();


    The reset() method from the form will reset all textboxes, then we set the currentStep
    variable to 1 and run the showStep() function to reset the interface.


    ## Taking Care of Repeating Code


    If you look closely, you might notice that the code for the Next and Previous
    buttons in the steps are identical. Instead of writing them in the HTML file,
    we can use JavaScript to add them dynamically.


    First, select all the steps div using querySelector() as follows:


    const stepsDiv = document.querySelectorAll(''.step'');


    stepsDiv.forEach((element, index) => {


      if (index === 0) {


        element.innerHTML += nextButton;


      } else if (index === stepsDiv.length - 1) {


        element.innerHTML += previousButton;


        element.innerHTML += registerButton;


      } else {


        element.innerHTML += previousButton;


        element.innerHTML += nextButton;


      }


    });


    Next, declare three variables containing the HTML buttons tag:


    const stepsDiv = document.querySelectorAll(''.step'');


    const previousButton =


      ''<button class="btn btn-secondary" onclick="prevStep()" type="button">Previous</button>'';


    const nextButton =


      ''<button class="btn btn-primary f-right" onclick="nextStep()" type="button">Next</button>'';


    const registerButton =


      ''<button type="submit" class="btn btn-success f-right">Register</button>'';


    Now, we need to iterate over the elements using the forEach() method. We can check
    if the element is the first or the last step from the index value.


    For the first element at index 0, we only add the next button. For the last element,
    we add the previous and submit buttons, for all the middle elements, we add the
    previous and next buttons:


    stepsDiv.forEach((element, index) => {


      if (index === 0) {


        element.innerHTML += nextButton;


      } else if (index === stepsDiv.length - 1) {


        element.innerHTML += previousButton;


        element.innerHTML += registerButton;


      } else {


        element.innerHTML += previousButton;


        element.innerHTML += nextButton;


      }


    });


    To check if the element is the last step of the Wizard Form, we compare the index
    value with the stepsDiv.length - 1 value.


    To add an element to existing elements, we use the += assignment operator.


    Now we can remove all <button> elements from the HTML file. Run the Wizard Form
    in the browser again, and you’ll see the buttons added using JavaScript.


    The Wizard Form is finished. You can check the completed application at [https://github.com/nathansebhastian/js-wizard-form/tree/main/complete](https://github.com/nathansebhastian/js-wizard-form/tree/main/complete)


    ## Summary


    Congratulations on finishing your first JavaScript project! The Wizard Form application
    helps you learn the idea of using JavaScript to manipulate what you see on the
    screen.


    Although a Wizard Form looks complex, it’s actually pretty easy when you have
    the steps mechanism created using JavaScript.


    Let’s recap what we’ve learned in this project:


    1.  How to select HTML elements using document.querySelector() and document.querySelectorAll()


    2.  Show and hide elements using CSS and JavaScript


    3.  Conditionally display HTML elements using variables, if statements, and functions


    4.  An introduction to browser events


    5.  Handling a form submit event with addEventListener()


    6.  Retrieve, display, and reset form data with the event object


    7.  Add elements to specific parts of the HTML document with the innerHTML property


    And the most important thing is that you’ve seen how an application can be built
    step-by-step and gradually becomes more complex.


    In the next chapter, we’re going to learn how to use JavaScript to send and receive
    data from a backend service. See you there.


    Chapter 13: Asynchronous JavaScript and Callbacks


    JavaScript is a non-blocking, synchronous programming language.


    What does this even mean? It means that JavaScript doesn’t wait until a code finished
    running before running the next one (non-blocking)


    Synchronous means sequential, and we know this because JavaScript runs code line
    by line from the top to the bottom.'
