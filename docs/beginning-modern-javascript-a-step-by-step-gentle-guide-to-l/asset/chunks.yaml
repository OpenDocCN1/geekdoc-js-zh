  trans: "\n\n按下 `Ctrl + ,` 或 `Command + ,` 打开 VSCode 设置菜单，搜索 `'live server ignore'`。你应该会看到以下输出：\n\
    \n![17 liveserver settings](img/image_rsrc2EU.jpg)\n\n点击 `Edit in settings.json`\
    \ 链接，然后将 `db.json` 添加到 Live Server 忽略文件设置中，如下所示：\n\n```json\n\"liveServer.settings.ignoreFiles\"\
    : [\n    \"db.json\",\n    \".vscode/**\",\n    \"**/*.scss\",\n    \"**/*.sass\"\
    ,\n    \"**/*.ts\"\n]\n```\n\n保存更改。现在，当 `db.json` 文件发生更改时，Live Server 将不会重新加载。\n\
    \n## 使用 Fetch 从 API 获取并显示任务\n\n现在我们已经准备好了数据库和界面，下一步是使用 JavaScript 获取任务数据并将其显示在表格中。我们将使用\
    \ Fetch API 来实现。\n\n打开 `script.js` 文件，编写以下 `getTask()` 函数：\n\n```javascript\n\
    const BASE_API_URL = 'http://localhost:3000/tasks';\n\nfunction getTasks() {\n\
    \  const tableElement = document.querySelector('#tasks-table');\n  fetch(BASE_API_URL)\n\
    \    .then(response => response.json())\n    .then(tasks => {\n      console.log(tasks);\n\
    \    });\n}\n\ngetTasks();\n```\n\n在上面的代码中，我们声明了一个常量变量来存储我们将要请求的 API URL。\n\n\
    在该常量下方，我们创建了一个名为 `getTasks()` 的函数，该函数将使用 `fetch()` 执行网络请求。为了检查是否成功获取了数据，我们将任务打印到了控制台。\n\
    \n如果你打开浏览器控制台，应该会看到以下输出：\n\n![17 get tasks output](img/image_rsrc2EV.jpg)\n\n\
    这意味着我们成功获取了任务数据。下一步是将这些数据显示在待办事项列表中。我们需要查询 HTML 页面中的 `<tbody>` 元素，并将任务作为行放入其中。\n\
    \n回想一下，在上一章中，我们为 `<tbody>` 标签添加了 `id` 属性，如下所示：\n\n```html\n<tbody id=\"tbody-tasks\"\
    >\n  ...\n</tbody>\n```\n\n这意味着我们可以使用查询选择器获取该元素：\n\n```javascript\nconst BASE_API_URL\
    \ = 'http://localhost:3000/tasks';\nconst tableElement = document.querySelector('#tbody-tasks');\n\
    ```\n\n然后我们回到 `getTasks()` 函数中，移除 `console.log()` 方法，并根据任务数据创建表格行。\n\n下面你可以看到，创建元素的代码相当长，但本质上与我们在向导表单中创建按钮的代码相同：\n\
    \n```javascript\nfunction getTasks() {\n  let tableRows = '';\n  fetch(BASE_API_URL)\n\
    \    .then(response => response.json())\n    .then(tasks => {\n      tasks.forEach(task\
    \ => {\n        const element = `<tr class=${\n          task.completed ? 'table-success'\
    \ : ''\n        }><td><input class=\"form-check-input\" type=\"checkbox\" ${\n\
    \          task.completed ? 'checked' : ''\n        } onclick=\"toggleTask(event,\
    \ ${task.id})\"></td><td>${\n          task.title\n        }</td><td><button type=\"\
    button\" class=\"btn btn-link\" onclick=\"editTask(${\n          task.id\n   \
    \     })\">Edit</button></td><td><button type=\"button\" class=\"btn btn-link\"\
    \ onclick=\"deleteTask(${\n          task.id\n        })\">Delete</button></td></tr>`;\n\
    \        tableRows += element;\n      });\n      tableElement.innerHTML = tableRows;\n\
    \    });\n}\n```\n\n在上面的代码中，我们创建了一个名为 `tableRows` 的变量，初始值为空字符串。接下来，我们使用 `forEach()`\
    \ 方法遍历 `tasks` 数组，并为每个任务数据创建一个 `element` 变量。\n\n这个 `element` 变量利用数组中的数据动态调整 HTML\
    \ 输出。如果任务标记为已完成，则向 `<tr>` 标签添加 `table-success` 类，并向复选框添加 `checked` 属性。\n\n当复选框被点击时，将调用\
    \ `toggleTask()` 函数。当编辑按钮被点击时，将调用 `editTask()` 函数，当删除按钮被点击时，将调用 `deleteTask()`\
    \ 函数。\n\n这些元素存储在 `tableRows` 变量中，当 `forEach()` 过程完成后，我们将 `tableElement` 的 `innerHTML`\
    \ 值设置为 `tableRows` 的值。\n\n如果你打开浏览器，应该会看到任务出现在表格中，如下所示：\n\n![17 get data](img/image_rsrc2EW.jpg)\n\
    \n既然我们能够显示数据，就可以移除 `index.html` 文件中硬编码的 `<tr>` 元素。移除下面高亮显示的行：\n\n```html\n<!--\
    \ 从 index.html 中移除以下内容 -->\n<tr>\n  ... 学习 JavaScript ...\n</tr>\n<tr>\n  ...\
    \ 学习 HTML ...\n</tr>\n```\n\n现在我们已经成功显示了数据，下一步是启用向数据库添加新任务的功能。\n\n## 添加新任务\n\n\
    要向数据库添加新任务，我们需要定义 `addTask()` 函数，该函数已在上一章中为“添加任务”按钮定义：\n\n```html\n<button type=\"\
    button\" class=\"btn btn-primary\" onClick=\"addTask()\">\n  添加任务\n</button>\n\
    ```\n\n回到 `script.js` 文件，创建一个名为 `addTask()` 的新函数，并将以下代码写入其中：\n\n```javascript\n\
    function addTask() {\n  const taskTitle = document.querySelector('#task-title');\n\
    \  const data = {\n    title: taskTitle.value,\n    completed: false,\n  };\n\
    \  fetch(BASE_API_URL, {\n    method: 'POST',\n    headers: {\n      'Content-Type':\
    \ 'application/json',\n    },\n    body: JSON.stringify(data),\n  }).then(response\
    \ => {\n    if (response.ok) {\n      alert('任务已添加');\n      getTasks();\n   \
    \   taskTitle.value = '';\n    }\n  });\n}\n```\n\n首先，我们查询 id 为 `task-title` 的输入文本，然后创建一个名为\
    \ `data` 的对象，用于存储任务的 `title` 和 `completed` 状态。\n\n之后，我们使用 `fetch()` 发送 POST 请求，并添加所需的选项。当收到响应时，我们调用\
    \ `alert()` 函数通知用户任务已添加到数据库。\n\n由于数据库中有了新任务，我们调用 `getTasks()` 数据来重新加载任务列表并显示给用户。然后我们清空输入文本，使其更直观。\n\
    \n现在你可以从浏览器测试添加新任务。下一步是添加删除功能。\n\n## 删除任务\n\n要从数据库中删除任务，我们需要在 `script.js` 文件中定义\
    \ `deleteTask()` 函数。以下是完整的函数：\n\n```javascript\nfunction deleteTask(id) {\n  const\
    \ confirmation = confirm('你确定要删除该任务吗？');\n  if (confirmation) {\n    fetch(BASE_API_URL\
    \ + '/' + id, {\n      method: 'DELETE',\n    }).then(response => {\n      if\
    \ (response.ok) {\n        alert('任务已删除');\n        getTasks();\n      }\n   \
    \ });\n  }\n}\n```\n\n首先，我们使用 `confirm()` 函数（属于浏览器 API）与用户确认删除决定。\n\n当用户确认后，我们使用\
    \ `fetch()` 函数发送 DELETE 请求，并将要删除的任务的 `id` 值放入 API URL 中（`BASE_API_URL + '/' +\
    \ id`）。\n\n收到响应后，我们只需调用 `alert()` 函数通知用户，然后使用 `getTasks()` 刷新任务列表。\n\n现在你可以从浏览器测试删除按钮。它应该可以正常工作。\n\
    \n## 编辑任务\n\n要编辑任务，我们需要在 `script.js` 文件中声明 `editTask()` 函数，如下所示：\n\n```javascript\n\
    function editTask(id) {\n  const newTitle = prompt('输入新的任务标题');\n  if (newTitle)\
    \ {\n    const data = { title: newTitle };\n    fetch(BASE_API_URL + '/' + id,\
    \ {\n      method: 'PATCH',\n      headers: {\n        'Content-Type': 'application/json',\n\
    \      },\n      body: JSON.stringify(data),\n    }).then(response => {\n    \
    \  if (response.ok) {\n        alert('任务已更新');\n        getTasks();\n      }\n\
    \    });\n  }\n}\n```\n\n要编辑任务，我们需要调用 `prompt()` 函数向用户询问新的任务标题。收到新标题后，我们将标题作为对象放入\
    \ `data` 变量中。\n\n下一步是使用 `fetch()` 执行网络请求，将任务的 `id` 添加到 URL，并将方法设置为 `PATCH`。\n\n\
    收到响应后，我们通知用户并刷新列表。\n\n## 将任务标记为已完成\n\n要将任务标记为已完成或未完成，我们需要检查复选框输入是否具有 `checked`\
    \ 属性。\n\n"
- fmt: '

    To do so, we need to access the `event` property when the input is clicked. This
    is why we pass the `event` property on the checkbox `onclick` attribute:


    ```

    <input ... type="checkbox" onclick="toggleTask(event, id)">

    ```


    Create a `toggleTask()` function in the `script.js` file as shown below:


    ```

    function toggleTask(event, id) {


      const checked = event.target.checked;


      const data = {


        completed: checked,


      };


      fetch(BASE_API_URL + ''/'' + id, {


        method: ''PATCH'',


        headers: {


          ''Content-Type'': ''application/json'',


        },


        body: JSON.stringify(data),


      }).then(response => {


        if (response.ok && checked) {


          alert(''Hurray! You finished the task'');


        }


        getTasks();


      });


    }

    ```


    The `checked` attribute returns `true` when the checkbox is checked, or `false`
    otherwise.


    We wrap this value in a `data` object and then send a `PATCH` request using `fetch()`,
    similar to the `editTask()` function we created earlier.


    When the task is marked as completed, we notify the user with an `alert()` call.
    To refresh the list, we call the `getTasks()` function.


    Now we have all core functionalities created using JavaScript. The last step is
    to enable the filter function.


    ## Filtering Tasks


    The select input that we’ve created will serve as a filter function. We can refresh
    the list to see only completed or active tasks.


    In JSON server, you can filter the returned data by adding a query parameter.
    To filter by the `completed` property value, the URL is [http://localhost:3000/tasks?completed=true](http://localhost:3000/tasks?completed=true)
    or [http://localhost:3000/tasks?completed=false](http://localhost:3000/tasks?completed=false).


    You can test this by opening the URL on the browser.


    Since we already have a `getTasks()` function, we can create a `filterTasks()`
    function that simply calls on `getTasks()`:


    ```

    function filterTasks(event) {


      const filterValue = event.target.value;


      if (filterValue === ''all'') {


        getTasks();


      } else if (filterValue === ''completed'') {


        getTasks(''completed'');


      } else {


        getTasks(''active'');


      }


    }

    ```


    Here, we use the `event` property again to get the value of the select input.


    Next, we check the value of the `filterValue` and add the relevant argument when
    calling the `getTasks()` function.


    If we want to see only completed tasks, then we send the `''completed''` value
    to the `getTasks()` function.


    To accommodate the filter argument, we need to add a parameter to the `getTasks()`
    function. Let’s update the function as shown below:


    ```

    function getTasks(filter) {


      let parameter = '''';


      if (filter === ''completed'') {


        parameter = ''?completed=true'';


      } else if (filter === ''active'') {


        parameter = ''?completed=false'';


      }


      const API_URL = BASE_API_URL + parameter;


      fetch(API_URL)


      ...


    }

    ```


    Here, we add the `filter` parameter to the `getTasks()` function. Then, we create
    a query parameter for the URL using an `if-else` check.


    Next, we add the `parameter` to the `BASE_API_URL` and use it when calling the
    `fetch()` function.


    This way, the GET request corresponds to the filter value you selected.


    And now the application is complete! You can try all the functionalities on your
    browser.


    If you encounter an error and need some help, you can compare your code with mine
    at [https://github.com/nathansebhastian/js-todo-list/tree/main/check-point-2](https://github.com/nathansebhastian/js-todo-list/tree/main/check-point-2)
    or email me at [nathan@codewithnathan.com](mailto:nathan@codewithnathan.com)


    ## Summary


    Well done! You’ve just finished your second JavaScript project. Hopefully, this
    project has shown you how JavaScript is the secret ingredient that makes a web
    application interactive.


    In JavaScript, we define functions that respond to user actions, and then plug
    those functions into the HTML `onclick` attribute.


    When the user performs an action, JavaScript will respond by running the relevant
    process. The CRUD operations are the core functionalities of a web application,
    and you’ll see them no matter what applications you use.


    Wrapping Up


    Congratulations on finishing this book! It wasn’t easy, but you did it anyway.


    I hope this book has improved your understanding of JavaScript and the role it
    plays in software development, particularly when it comes to front-end development.


    Now you see how JavaScript can be used to manipulate what’s being shown to the
    browser window long after the HTML and CSS part of the site has been rendered.


    The Browser API consists of a set of objects and methods that you can access using
    JavaScript, allowing you to manipulate the content of your website. The `Document`
    object allows you to select specific elements using the `querySelector()` method.


    The browser also exposes signals known as events that you can listen to. This
    way, you can execute some code as a reaction to the event, such as the `''click''`
    and `''submit''` events.


    ## The Next Step


    There are other APIs that you can use to get the location of the user, accept
    images and files submitted by the user, or access your camera and microphones.


    Exploring all these APIs is beyond the scope of this book, so I’ll make another
    book where we’re going to explore the Browser APIs in full and build projects
    with it.


    You can also tackle learning popular JavaScript libraries such as React, Vue or
    Svelte next as you now have the fundamental knowledge of how JavaScript works.
    I’m also planning to write a book on these libraries.


    If you enjoy this book, you might consider subscribing to my newsletter to know
    when I release a new one at [https://codewithnathan.com/newsletter](https://codewithnathan.com/newsletter)


    I also have a 7-day free email course on Mindset of The Successful Software Developer
    which is free at [https://sebhastian.gumroad.com/l/mindset](https://sebhastian.gumroad.com/l/mindset)


    Each email unveils a slice of wisdom that I got after working as a web developer
    and programmer for 8+ years in the tech industry, from startups to mega-corporations.
    It offers a fresh perspective on what it means to be a successful software developer.


    If you like the book, I would appreciate it if you could leave me a review in
    Amazon too because it would help others to find this book.


    For any questions, feel free to email me at [nathan@codewithnathan.com](mailto:nathan@codewithnathan.com).


    If you didn’t like the book, or if you feel that I should have covered certain
    additional topics, please let me know in the email. This book can only get better
    thanks to readers like you.


    Thank you and all the best for your career in tech!


    Until next time.


