  trans: "\n这与人类在生活中做决策的方式类似。例如，你有钱支付去日本的假期吗？如果有，就去。如果没有，那就多存点钱！\n\n这就是控制流的作用。控制流是编程语言中的一个特性，允许你根据可能出现的不同条件有选择地运行特定代码。\n\
    \n使用控制流可以让你根据程序中存在的条件定义程序可以采取的多个路径。\n\nJavaScript 中常用的控制流有两种：条件语句和循环。\n\n## 条件流\n\
    \n条件流语句用于仅在特定条件下运行一段代码。\n\n有两种创建条件流的方式：\n\n1. `if…else` 语句\n2. `switch…case` 语句\n\
    \n## `if…else` 语句\n\n`if` 语句允许你创建一个仅在特定条件满足时运行的程序。\n\n`if` 语句的语法如下：\n\n```\nif\
    \ (condition) {\n  // 条件为真时执行的代码\n}\n```\n\n来看一个例子。假设你想去一个需要 5000 美元的假期。\n\n使用\
    \ `if` 语句，检查你是否有足够的余额：\n\n```\nlet balance = 7000;\nif (balance > 5000) {\n  console.log(\"\
    你有足够的钱去这次旅行。我们走吧！\");\n}\n```\n\n运行上面的代码一次，你会看到终端上打印出该字符串。\n\n现在将 `balance` 的值改为\
    \ 3000，你将得不到任何响应。\n\n这是因为 `if` 语句内部的代码仅在条件为真时执行。\n\n在 `if` 语句之后，你可以在其下方编写另一行代码，如下所示：\n\
    \n```\nlet balance = 7000;\nif (balance > 5000) {\n  console.log(\"你有足够的钱去这次旅行。我们走吧！\"\
    );\n}\nconsole.log(\"结束！\");\n```\n\n无论你给 `balance` 变量赋什么值，上面的第二个 `console.log()`\
    \ 调用都会执行。\n\n如果你希望它仅在 `if` 条件满足时执行，那么也将该行放在花括号内：\n\n```\nlet balance = 7000;\n\
    if (balance > 5000) {\n  console.log(\"你有足够的钱去这次旅行。我们走吧！\");\n  console.log(\"\
    结束！\");\n}\n```\n\n接下来，假设你需要在 `if` 语句条件不满足时运行一些代码。\n\n这就是 `else` 语句的用武之地。请看下面的例子：\n\
    \n```\nlet balance = 7000;\nif (balance > 5000) {\n  console.log(\"你有足够的钱去这次旅行。我们走吧！\"\
    );\n} else {\n  console.log(\"抱歉，钱不够。多存点！\");\n}\nconsole.log(\"结束！\");\n```\n\
    \n现在将 `balance` 的值改为小于 5000，你就会触发示例中的 `else` 块。\n\nJavaScript 还有 `else if` 语句，它允许你在之前的\
    \ `if` 语句条件不满足时编写另一个条件进行检查。\n\n考虑下面的例子：\n\n```\nlet balance = 7000;\nif (balance\
    \ > 5000) {\n  console.log(\"你有足够的钱去这次旅行。我们走吧！\");\n} else if (balance > 3000)\
    \ {\n  console.log(\"你只有足够的钱来一次居家度假\");\n} else {\n  console.log(\"抱歉，钱不够。多存点！\"\
    );\n}\nconsole.log(\"结束！\");\n```\n\n当 `balance` 金额小于 5000 时，`else if` 语句会检查 `balance`\
    \ 是否大于 3000。如果是，那么程序会建议你进行居家度假。\n\n你可以根据需要编写任意多个 `else if` 语句，每个语句仅在前一个条件不满足时执行。\n\
    \n总之，`if..else..else if` 语句允许你根据程序面临的条件执行不同的代码块。\n\n## `switch…case` 语句\n\n`switch`\
    \ 语句是核心 JavaScript 语法的一部分，允许你控制代码的执行流程。\n\n它通常被认为是 `if..else` 语句的替代方案，能提供更易读的代码，尤其是在需要评估许多不同条件时。\n\
