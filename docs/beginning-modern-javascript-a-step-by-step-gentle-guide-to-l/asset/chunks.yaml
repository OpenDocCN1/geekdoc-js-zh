  raw: 'Why is this important? Let me show you an easy example.


    The window object of the DOM has a method called setTimeout() that you can use
    to run a function after a specific amount of time.


    The method accepts two arguments:


    1.  The function to execute after the timeout


    2.  The amount of time to wait in milliseconds


    For example, here’s how to wait 3 seconds before running a console log:


    setTimeout(function () {


      console.log(''Hello!'');


    }, 3000);


    Run the code above from the console, and after 3 seconds, you should see the ''Hello!''
    string printed.


    Now, let’s add some console log before and after the setTimeout() method as follows:


    console.log(''Start'');


    setTimeout(function () {


      console.log(''Hello!'');


    }, 3000);


    console.log(''End'');


    Now we have ''Start'' and ''End'' strings which should be printed before and after
    the setTimeout() method has finished executing.


    When you run the code above, you will see this output:


    image::images/3-4-example-settimeout.png


    Surprise! The ''End'' string got printed ahead of the ''Hello!'' string. This
    is because of the non-blocking nature of JavaScript.


    The synchronous nature of JavaScript makes it read the code line by line from
    top to bottom. But because it’s non-blocking, JavaScript executes the setTimeout()
    method, then continue code execution to the next line.


    This is not a bug. It’s an expected behavior of JavaScript because of the way
    it’s designed.


    And this is important to know because when you’re developing a website or application,
    there will be times when you send data to a server, and you need to wait for the
    response before continuing code execution.


    To make JavaScript wait until a specific operation has been completed, we need
    to use what’s known as the callback function.


    ## Callback Functions Explained


    A callback function is simply a function passed into another function as an argument.
    The callback function would then be used by the function when the situation is
    right.


    The function we passed into the setTimeout() method above is a callback function.
    So does the function we passed into the addEventListener() method.


    Back to the example above, we can make JavaScript wait for the setTimeout() method
    to finish before printing the ''End'' string by moving the console log line below
    ''Hello!'' as follows:


    console.log(''Start'');


    setTimeout(function () {


      console.log(''Hello!'');


      console.log(''End!'');


    }, 3000);


    But of course, we can do this because we’re the ones who added the setTimeout()
    method.


    If we imagine the setTimeout() method as a part of code that we can’t touch, like
    the addEventListener() method, how do we make sure that it runs a certain instruction
    after the timeout?


    The answer is to use a callback, just like the addEventListener() method. In the
    example below, imagine that you can’t modify the content of the processData()
    function:


    function processData(data, callbackFn) {


      setTimeout(function () {


        console.log(''Sending data back'');


        const response = {


          data: data + ''abc'',


        };


        callbackFn(response);


      }, 3000);


    }


    Here, the processData() function accepts two parameters:


    1.  The data parameter to process


    2.  The callback function to execute after the process


    To get the response from the function above, we need to call that function and
    pass both data and a callback function.


    Here’s how you do it:


    processData(''Nathan'', function (response) {


      console.log(`Response given: ${response}`);


    });


    This callback pattern is used not only when responding to events, but also when
    sending data to another server.


    We don’t know in advance how long a server needs to process the data, so we put
    a callback function that will be executed when the response is ready.


    ## Summary


    In this chapter, you’ve learned that JavaScript is a programming language that
    doesn’t stop to wait for a function that takes time to finish. It will continue
    to run the next line of code when the previous line isn’t completed yet.


    The callback function is a way to make JavaScript run in an asynchronous manner.
    The next step of the operation starts only when the previous operation is completed.


    Chapter 14: Promises


    A Promise is an alternative way to deal with the non-blocking nature of JavaScript
    while running asynchronous operations. It’s a modern feature released in 2015
    (that is 20 years after the first release of JavaScript)


    Basically, a Promise object represents a "pending state" in the most common sense:
    The promise will eventually be fulfilled at a later date.


    To give you an illustration, suppose you want to buy a new phone to replace your
    old phone, so you open a messaging app to contact a phone store. This is similar
    to how you access a variable or a function that returns a promise:


    ![14 access a promise](OEBPS/image_rsrc2EF.jpg)


    After you send a message explaining what you want, you get an automated message
    saying that a representative will answer your message shortly. This is similar
    to receiving a Promise object:


    ![14 promise pending state](OEBPS/image_rsrc2EG.jpg)


    A minute later, you get a new message from a human representative, saying that
    the phone model you want to buy is available for purchase. This is when the Promise
    was resolved:


    ![14 promise resolved](OEBPS/image_rsrc2EH.jpg)


    Or, in a completely different scenario, the representative tells you that the
    store doesn’t sell phones, because the store is a food store and not a phone store.
    This means the Promise was rejected:


    ![14 promise rejected](OEBPS/image_rsrc2EJ.jpg)


    This illustration shows how the Promise object in JavaScript works:


    | ▪ |


    | ▪ |


    | ▪ |


    A typical promise implementation would look as follows:


    let p = new Promise((resolve, reject) => {


      let isTrue = true;


      if (isTrue) {


        resolve(''Promise resolved'');


      } else {


        reject(''Promise rejected'');


      }


    });


    When creating a new Promise object, we need to pass a callback function that will
    be called immediately with two arguments: the resolve() and reject() functions


    Depending on the result of the Promise, either the resolve() or the reject() function
    will be called to end the pending state.


    To handle the Promise object, you need to chain the function call with then()
    and catch() functions as shown below:


    let p = new Promise((resolve, reject) => {


      let isTrue = true;


      if (isTrue) {


        resolve(''Success'');


      } else {


        reject(''Error'');


      }


    });


    p


    .then(message => console.log(`Promise resolved: ${message}`))


    .catch(message => console.log(`Promise rejected: ${message}`));


    The resolve() function corresponds to the then() function, while reject() corresponds
    to the catch() function. You can change the isTrue value to false to test this.


    Here’s an illustration of the promise process:


    ![14 promise object](OEBPS/image_rsrc2EK.jpg)


    Using the promise pattern, you can call your functions sequentially by placing
    the next process inside the then() method.


    ## Callbacks vs Promises


    The promise pattern is created to replace the use of callbacks. By using promises,
    the code we write would be more intuitive and maintainable.


    Going back to the messaging illustration, let’s create an example of using callbacks
    to handle the situation. First, we declare the two variables required for this
    situation, called isPhoneStore and isPhoneAvailable:


    const isPhoneStore = true;


    const isPhoneAvailable = true;


    Next, we write a function that will process incoming messages. This function will
    mimic the promise pattern, and it will resolve only when isPhoneStore and isPhoneAvailable
    are true:


    function processMessage(resolveCallback, rejectCallback) {


      if (!isPhoneStore) {


        rejectCallback({


          name: ''Wrong store'',


          message: ''Sorry, this is a food store!'',


        });


      } else if (!isPhoneAvailable) {


        rejectCallback({


          name: ''Out of stock'',


          message: ''Sorry, the X phone is out of stock!'',


        });


      } else {


        resolveCallback({


          name: ''OK'',


          message: ''The X phone is available! How many you want to buy?'','
