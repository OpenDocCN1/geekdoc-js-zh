    Number data types represent different kinds of numbers. There are two types of
    numbers in JavaScript:


    - ▪

    - ▪


    An integer is a whole number without decimals and fractions. Below, you see examples
    of two integers `x` and `y`:


    ```

    let x = 1;

    let y = 2;

    console.log(x + y);

    // Output: 3

    ```


    On the other hand, floats refer to numbers with decimal points like this:


    ```

    let f = 1.2;

    let z = 2.35;

    console.log(f + z);

    // Output: 3.55

    ```


    To create a float, you need to write a number and use `.` to define the decimal
    values.


    With number types, you can perform arithmetic operations such as addition `+`,
    subtraction `-`, division `/`, and multiplication `*` just like how you use a
    calculator.


    ## Booleans in JavaScript


    Boolean is a type that represents `true` and `false` values.


    You can think of Booleans as a light switch that can only be in one of two positions:
    on or off.


    So it is with Boolean values in programming languages. They are used when JavaScript
    needs to make a decision: Go left or go right? Right or wrong?


    Here’s how you create Boolean values in JavaScript:


    ```

    let on = true;

    let off = false;

    ```


    This data type is frequently used when you need to make a decision using a control
    flow. You’ll see why Boolean values are very useful when developing an application
    later.


    ## Undefined


    `Undefined` is a data type in JavaScript used to represent a variable that hasn’t
    been assigned any value yet.


    Anytime you declare a variable without assigning any value, the `undefined` value
    will be assigned to that variable. For example:


    ```

    let first_name;

    console.log(first_name); // undefined

    ```


    You can also assign `undefined` to a variable explicitly as follows:


    ```

    let last_name = undefined;

    ```


    But this is usually not recommended, because JavaScript has another value called
    `null` which is used to mark a variable as empty.


    ## Null


    The `null` value is a special data type that represents an empty or unknown value.
    Here’s how you assign a variable as `null`:


    ```

    let first_name = null;

    ```


    The code above means that the value of `first_name` is empty or unknown.


    At this point, you may be thinking what’s the difference between `undefined` and
    `null`? They seem to serve a similar purpose.


    And you are correct. Both `undefined` and `null` are values that represent nothing,
    and other programming languages usually only have one, and that is `null`.


    In JavaScript, the `undefined` value is reserved as the default value when a variable
    is declared, while `null` means you intentionally assign an "empty" value for
    the variable.


    To summarize, JavaScript treats `undefined` as the "default" empty value and `null`
    as the "intentional" empty value.


    ## Type Conversion


    At times, you might want to convert one data type into another so that the program
    runs as expected.


    For example, suppose you need to convert a string into an integer so you can perform
    an addition between numbers.


    If you have one of the numbers as a string, JavaScript joins them together instead
    of adding:


    ```

    let x = "7";

    let y = 5;

    console.log(x + y); // 75

    ```


    To add the two numbers properly, you need to convert the `x` variable into an
    integer.


    Changing the data from one type to another is also known as type conversion or
    type casting. There are 3 functions frequently used to do type conversion:


    - ▪

    - ▪

    - ▪


    As their name implies, these type conversion functions will attempt to convert
    any value you specified inside the parentheses to the type of the same name.


    To convert a string into an integer, you can use the `int()` function:


    ```

    let x = "7";

    let y = 5;

    // Convert x to integer

    x = Number(x);

    console.log(x + y); // 12

    ```


    On the other hand, the `String()` function converts a value of another type to
    a string. If you type `String(true)`, then you’ll get `''true''` back.


    Passing a value of the same type as the function has no effect. It will just return
    the same value back.


    ## Type Coercion


    In JavaScript, type coercion is a process where a value of one type is implicitly
    converted into another type.


    This is automatically done by JavaScript so that your code won’t cause an error.
    But as you’ll see in this section, type coercion can actually cause undesired
    behavior in the program.


    Let’s consider what happens when you perform an addition between a number and
    a string in JavaScript:


    ```

    console.log(1 + "1");

    ```


    As you’ve seen in the previous section, JavaScript will consider the number as
    a string and join the two letters as `11` instead of adding them (`1 + 1 = 2`)


    But you need to know that other programming languages don’t respond the same way.


    Programming languages like Ruby or Python will respond by stopping your program
    and giving an error as feedback. It will respond with something along the lines
    of "Cannot perform addition between a number and a string".


    But JavaScript will see this and say: "I cannot do the operation you requested
    as it is, but I can do it if the number `1` is converted to a string, so I’ll
    do just that."


    And that’s exactly what type coercion is. JavaScript notices that it doesn’t know
    how to execute your code, but it doesn’t stop the program and responds with an
    error.


    Instead, it will change the data type of one of the values without telling you.


    While type coercion doesn’t cause any errors, the output is something you actually
    don’t want either.


    ## Type Coercion Rules


    Type coercion rules are never stated clearly anywhere, but I did find some rules
    by trying various silly codes myself.


    It seems that JavaScript will first convert data types to string when it finds
    different data types:


    ```

    1 + "1" // "11"

    [1 ,2] + "1" // "1,21"

    true + "1" // "true1"

    ```


    But the order of the values matters when you have an object. Writing objects first
    always returns numeric `1`:


    ```

    { a: 1 } + "1" // 1

    "1" + { a: 1 } // "1[object Object]"

    true + { a: 1 } // "true[object Object]"

    { a: 1 } + 1 // 1

    ```


    JavaScript can calculate between boolean and numeric types, because boolean values
    `true` and `false` implicitly have the numeric value of `1` and `0`:


    ```

    true + 1 // 1+1 = 1

    false + 1 // 0+1 = 1

    [1,2] + 1 // "1,21"

    ```


    Type coercion is always performed implicitly. When you assign the value as a variable,
    the variable type will never change outside of the operation:


    ```

    let myNumber = 1;

    console.log(myNumber + "1"); // prints 11

    console.log(myNumber); // still prints number 1 and not string

    ```


    You can try to find some more on your own, but you hopefully understand what type
    coercion is and how it works by now.


    ## Why You Should Avoid Type Coercion


    JavaScript developers are generally divided into two camps when talking about
    type coercion:


    - ▪

    - ▪


    If you ask me, I would recommend that you avoid using type coercion in your code
    all the time.


    The reason is that I’ve never found a problem where type coercion is required
    for the solution, and when I need to convert one type into another, it’s always
    better to do so explicitly:


    ```

    let price = "50";

    let tax = 5;

    let totalPrice = Number(price) + Number(tax);

    console.log(totalPrice);

    ```


    Using explicit type conversion functions such as `Number()` and `String()` will
    make your code clear and transparent. You don’t need to guess the correct data
    type required in your program.


    Type coercion is one of the unique features in JavaScript that may confuse beginners,
    so it’s good to clear it up early.


    ## Summary


    JavaScript provides five basic data types that you can use in creating a useful
    program. Each data type has specific traits that define what you can and can’t
    do with the data.


    In the next chapter, you’re going to learn about operators, which allows you to
    further manipulate any data defined in your code.


    ## Chapter 4: JavaScript Operators


    As the name implies, operators are symbols you can use to perform operations on
    your data.


    You’ve seen some examples of using the plus `+` operator to join multiple strings
    and add two numbers together. Of course, JavaScript has more than one operator
    as you’ll discover in this section.


    Since you’ve learned about data types and conversion previously, learning operators
    should be relatively easy.

