    \ to notify the user, then refresh the tasks list with `getTasks()`.\n\nNow you\
    \ can test the delete button from the browser. It should be working.\n\n## Editing\
    \ a Task\n\nTo edit a task, we need to declare the `editTask()` function in our\
    \ `script.js` file as follows:\n\n```javascript\nfunction editTask(id) {\n  const\
    \ newTitle = prompt('Enter the new task title');\n  if (newTitle) {\n    const\
    \ data = { title: newTitle };\n    fetch(BASE_API_URL + '/' + id, {\n      method:\
    \ 'PATCH',\n      headers: {\n        'Content-Type': 'application/json',\n  \
    \    },\n      body: JSON.stringify(data),\n    }).then(response => {\n      if\
