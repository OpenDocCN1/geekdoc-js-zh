  trans: "\n回到项目，我们在向导表单上需要做的最后一项任务是在第三步添加一个提交按钮，那么我们就开始吧。\n\n按如下方式将提交按钮添加到 `step3`\
    \ div 中：\n\n```html\n<div id=\"step3\" class=\"step\">\n  <div class=\"form-group\"\
    >\n    <label for=\"password\">密码</label>\n    <input\n      class=\"form-control\"\
    \n      name=\"password\"\n      type=\"password\"\n      placeholder=\"输入密码\"\
    \n    />\n  </div>\n  <button type=\"button\" class=\"btn btn-previous\" onclick=\"\
    prevStep()\">\n    上一步\n  </button>\n  <button type=\"submit\" class=\"btn btn-submit\
    \ f-right\">提交</button>\n</div>\n```\n\n在 `style.css` 中为提交按钮添加 CSS，如下所示：\n\n```css\n\
    .btn-submit {\n  border-color: #28a745;\n  background-color: #28a745;\n}\n```\n\
    \n现在我们需要监听提交按钮被点击的事件。\n\n## 使用 JavaScript 监听表单提交事件\n\n除了 DOM API 之外，浏览器还会暴露称为事件的信号，你可以将其用作运行特定代码的提示。我们在之前为按钮添加\
    \ `onclick` 属性时已经这样做过：\n\n```html\n<button type='button' class='btn btn-secondary'\
    \ onclick='prevStep()'>\n    上一步\n  </button>\n  <button type='button' class='btn\
    \ btn-primary f-right' onclick='nextStep()'>\n    下一步\n  </button>\n```\n\n`onclick`\
    \ HTML 属性是监听 `click` 事件的快捷方式。当点击“上一步”按钮时，我们运行 `prevStep()` 函数。当点击“下一步”按钮时，我们运行\
    \ `nextStep()` 函数。\n\n除了使用 `onclick` 属性，我们还可以使用 `addEventListener()` 方法添加事件监听器。\n\
    \n让我们添加一个事件监听器，以便知道表单何时被提交。我们创建的向导表单有一个 `id` 属性，因此你可以使用 JavaScript 选择该表单。\n\n\
    ```javascript\nconst wizardForm = document.querySelector('#wizard-form');\n```\n\
    \n接下来，你需要调用 `addEventListener()` 方法并监听 `'submit'` 事件，如下所示：\n\n```javascript\n\
    const wizardForm = document.querySelector('#wizard-form');\n\nwizardForm.addEventListener('submit',\
    \ function (event) {\n  // TODO: 处理提交事件\n});\n```\n\n现在我们可以监听提交事件了，我们需要中断表单的默认行为，以便\
    \ JavaScript 能够接管。\n\n为此，我们需要在传递给事件监听器的函数内部调用 `event.preventDefault()` 方法：\n\n\
    ```javascript\nconst wizardForm = document.querySelector('#wizard-form');\n\n\
    wizardForm.addEventListener('submit', function (event) {\n  event.preventDefault();\n\
    });\n```\n\n`preventDefault()` 方法会中断提交事件的默认流程，该默认流程会导致浏览器刷新当前页面。\n\n从这里开始，你可以指示\
    \ JavaScript 对用户提交的表单数据执行特定任务。\n\n表单对象有一个名为 `elements` 的对象属性，它存储你在表单内定义的所有输入元素。在该对象内部，你可以通过指定输入字段的\
    \ `name` 属性，后跟 `value` 属性来访问输入字段的值。\n\n以下是如何从我们的向导表单中获取值：\n\n```javascript\nevent.preventDefault();\n\
    \nconst email = wizardForm.elements.email.value;\nconst username = wizardForm.elements.username.value;\n\
    const password = wizardForm.elements.password.value;\n```\n\n最后，我们使用 JavaScript\
    \ 的 `alert()` 函数显示数据，该函数：\n\n```javascript\nconst email = wizardForm.elements.email.value;\n\
    const username = wizardForm.elements.username.value;\nconst password = wizardForm.elements.password.value;\n\
    \nalert(`注册完成！您的详细信息：\\n\n  邮箱：${email} \\n\n  用户名：${username} \\n\n  密码：${password}`);\n\
    ```\n\n你可以在浏览器中测试向导表单。填写文本框，然后在点击提交按钮时会收到一个弹窗：\n\n为了让应用程序更智能，我们可以在用户提交后重置表单：\n\
    \n```javascript\nconst email = wizardForm.elements.email.value;\nconst username\
    \ = wizardForm.elements.username.value;\nconst password = wizardForm.elements.password.value;\n\
    //   alert(...);\nwizardForm.reset();\ncurrentStep = 1;\nshowStep();\n```\n\n\
    表单的 `reset()` 方法会重置所有文本框，然后我们将 `currentStep` 变量设置为 1 并运行 `showStep()` 函数来重置界面。\n\
    \n## 处理重复代码\n\n如果你仔细观察，可能会注意到步骤中的“下一步”和“上一步”按钮的代码是相同的。与其在 HTML 文件中编写它们，我们可以使用\
    \ JavaScript 动态添加它们。\n\n首先，使用 `querySelector()` 选择所有步骤 div，如下所示：\n\n```javascript\n\
    const stepsDiv = document.querySelectorAll('.step');\n\nstepsDiv.forEach((element,\
    \ index) => {\n  if (index === 0) {\n    element.innerHTML += nextButton;\n  }\
    \ else if (index === stepsDiv.length - 1) {\n    element.innerHTML += previousButton;\n\
    \    element.innerHTML += registerButton;\n  } else {\n    element.innerHTML +=\
    \ previousButton;\n    element.innerHTML += nextButton;\n  }\n});\n```\n\n接下来，声明三个包含\
    \ HTML 按钮标签的变量：\n\n```javascript\nconst stepsDiv = document.querySelectorAll('.step');\n\
    \nconst previousButton =\n  '<button class=\"btn btn-secondary\" onclick=\"prevStep()\"\
    \ type=\"button\">上一步</button>';\nconst nextButton =\n  '<button class=\"btn btn-primary\
    \ f-right\" onclick=\"nextStep()\" type=\"button\">下一步</button>';\nconst registerButton\
    \ =\n  '<button type=\"submit\" class=\"btn btn-success f-right\">注册</button>';\n\
    ```\n\n现在，我们需要使用 `forEach()` 方法遍历这些元素。我们可以根据 `index` 值检查该元素是第一步还是最后一步。\n\n对于 `index`\
    \ 为 0 的第一个元素，我们只添加下一步按钮。对于最后一个元素，我们添加上一步和提交按钮，对于所有中间元素，我们添加上一步和下一步按钮：\n\n```javascript\n\
    stepsDiv.forEach((element, index) => {\n  if (index === 0) {\n    element.innerHTML\
    \ += nextButton;\n  } else if (index === stepsDiv.length - 1) {\n    element.innerHTML\
    \ += previousButton;\n    element.innerHTML += registerButton;\n  } else {\n \
    \   element.innerHTML += previousButton;\n    element.innerHTML += nextButton;\n\
    \  }\n});\n```\n\n为了检查该元素是否是向导表单的最后一步，我们将 `index` 值与 `stepsDiv.length - 1` 值进行比较。\n\
    \n要向现有元素添加元素，我们使用 `+=` 赋值运算符。\n\n现在我们可以从 HTML 文件中删除所有 `<button>` 元素。再次在浏览器中运行向导表单，你会看到使用\
    \ JavaScript 添加的按钮。\n\n向导表单完成了。你可以在 [`github.com/nathansebhastian/js-wizard-form/tree/main/complete`](https://github.com/nathansebhastian/js-wizard-form/tree/main/complete)\
    \ 查看完整的应用程序。\n\n## 总结\n\n恭喜你完成了第一个 JavaScript 项目！向导表单应用程序帮助你理解了使用 JavaScript 操作屏幕显示内容的思路。\n\
    \n虽然向导表单看起来很复杂，但当你使用 JavaScript 创建了步骤机制后，实际上相当简单。\n\n让我们回顾一下在这个项目中学到的内容：\n\n1.\
    \  如何使用 `document.querySelector()` 和 `document.querySelectorAll()` 选择 HTML 元素\n\
    2.  使用 CSS 和 JavaScript 显示和隐藏元素\n3.  使用变量、`if` 语句和函数有条件地显示 HTML 元素\n4.  浏览器事件简介\n\
    5.  使用 `addEventListener()` 处理表单提交事件\n6.  使用事件对象检索、显示和重置表单数据\n7.  使用 `innerHTML`\
    \ 属性向 HTML 文档的特定部分添加元素\n\n最重要的是，你已经看到了一个应用程序是如何逐步构建并逐渐变得复杂的。\n\n在下一章中，我们将学习如何使用\
    \ JavaScript 从后端服务发送和接收数据。到时见。\n\n## 第 13 章：异步 JavaScript 与回调\n\nJavaScript 是一种非阻塞的同步编程语言。\n\
    \n这到底是什么意思？这意味着 JavaScript 不会等待一段代码运行完毕后再运行下一段代码（非阻塞）。\n\n同步意味着顺序执行，我们知道这一点是因为\
    \ JavaScript 从上到下逐行运行代码。\n"
- fmt: "\nWhy is this important? Let me show you an easy example.\n\nThe `window`\
    \ object of the DOM has a method called `setTimeout()` that you can use to run\
    \ a function after a specific amount of time.\n\nThe method accepts two arguments:\n\
    \n1. The function to execute after the timeout\n2. The amount of time to wait\
    \ in milliseconds\n\nFor example, here’s how to wait 3 seconds before running\
    \ a console log:\n\n```\nsetTimeout(function () {\n  console.log('Hello!');\n\
    }, 3000);\n```\n\nRun the code above from the console, and after 3 seconds, you\
    \ should see the `'Hello!'` string printed.\n\nNow, let’s add some console log\
    \ before and after the `setTimeout()` method as follows:\n\n```\nconsole.log('Start');\n\
    setTimeout(function () {\n  console.log('Hello!');\n}, 3000);\nconsole.log('End');\n\
    ```\n\nNow we have `'Start'` and `'End'` strings which should be printed before\
    \ and after the `setTimeout()` method has finished executing.\n\nWhen you run\
    \ the code above, you will see this output:\n\nimage::images/3-4-example-settimeout.png\n\
    \nSurprise! The `'End'` string got printed ahead of the `'Hello!'` string. This\
    \ is because of the non-blocking nature of JavaScript.\n\nThe synchronous nature\
    \ of JavaScript makes it read the code line by line from top to bottom. But because\
    \ it’s non-blocking, JavaScript executes the `setTimeout()` method, then continue\
    \ code execution to the next line.\n\nThis is not a bug. It’s an expected behavior\
    \ of JavaScript because of the way it’s designed.\n\nAnd this is important to\
    \ know because when you’re developing a website or application, there will be\
    \ times when you send data to a server, and you need to wait for the response\
    \ before continuing code execution.\n\nTo make JavaScript wait until a specific\
    \ operation has been completed, we need to use what’s known as the callback function.\n\
    \n## Callback Functions Explained\n\nA callback function is simply a function\
    \ passed into another function as an argument. The callback function would then\
    \ be used by the function when the situation is right.\n\nThe function we passed\
    \ into the `setTimeout()` method above is a callback function. So does the function\
    \ we passed into the `addEventListener()` method.\n\nBack to the example above,\
    \ we can make JavaScript wait for the `setTimeout()` method to finish before printing\
    \ the `'End'` string by moving the console log line below `'Hello!'` as follows:\n\
    \n```\nconsole.log('Start');\nsetTimeout(function () {\n  console.log('Hello!');\n\
    \  console.log('End!');\n}, 3000);\n```\n\nBut of course, we can do this because\
    \ we’re the ones who added the `setTimeout()` method.\n\nIf we imagine the `setTimeout()`\
    \ method as a part of code that we can’t touch, like the `addEventListener()`\
    \ method, how do we make sure that it runs a certain instruction after the timeout?\n\
    \nThe answer is to use a callback, just like the `addEventListener()` method.\
    \ In the example below, imagine that you can’t modify the content of the `processData()`\
    \ function:\n\n```\nfunction processData(data, callbackFn) {\n  setTimeout(function\
    \ () {\n    console.log('Sending data back');\n    const response = {\n      data:\
    \ data + 'abc',\n    };\n    callbackFn(response);\n  }, 3000);\n}\n```\n\nHere,\
    \ the `processData()` function accepts two parameters:\n\n1. The `data` parameter\
    \ to process\n2. The callback function to execute after the process\n\nTo get\
    \ the response from the function above, we need to call that function and pass\
    \ both `data` and a callback function.\n\nHere’s how you do it:\n\n```\nprocessData('Nathan',\
    \ function (response) {\n  console.log(`Response given: ${response}`);\n});\n\
    ```\n\nThis callback pattern is used not only when responding to events, but also\
    \ when sending data to another server.\n\nWe don’t know in advance how long a\
    \ server needs to process the data, so we put a callback function that will be\
    \ executed when the response is ready.\n\n## Summary\n\nIn this chapter, you’ve\
    \ learned that JavaScript is a programming language that doesn’t stop to wait\
    \ for a function that takes time to finish. It will continue to run the next line\
    \ of code when the previous line isn’t completed yet.\n\nThe callback function\
    \ is a way to make JavaScript run in an asynchronous manner. The next step of\
    \ the operation starts only when the previous operation is completed.\n\n## Chapter\
    \ 14: Promises\n\nA `Promise` is an alternative way to deal with the non-blocking\
    \ nature of JavaScript while running asynchronous operations. It’s a modern feature\
    \ released in 2015 (that is 20 years after the first release of JavaScript)\n\n\
    Basically, a `Promise` object represents a \"pending state\" in the most common\
    \ sense: The promise will eventually be fulfilled at a later date.\n\nTo give\
    \ you an illustration, suppose you want to buy a new phone to replace your old\
    \ phone, so you open a messaging app to contact a phone store. This is similar\
    \ to how you access a variable or a function that returns a promise:\n\n![14 access\
    \ a promise](OEBPS/image_rsrc2EF.jpg)\n\nAfter you send a message explaining what\
    \ you want, you get an automated message saying that a representative will answer\
    \ your message shortly. This is similar to receiving a `Promise` object:\n\n![14\
    \ promise pending state](OEBPS/image_rsrc2EG.jpg)\n\nA minute later, you get a\
    \ new message from a human representative, saying that the phone model you want\
    \ to buy is available for purchase. This is when the `Promise` was resolved:\n\
    \n![14 promise resolved](OEBPS/image_rsrc2EH.jpg)\n\nOr, in a completely different\
    \ scenario, the representative tells you that the store doesn’t sell phones, because\
    \ the store is a food store and not a phone store. This means the `Promise` was\
    \ rejected:\n\n![14 promise rejected](OEBPS/image_rsrc2EJ.jpg)\n\nThis illustration\
    \ shows how the `Promise` object in JavaScript works:\n\n| ▪ |\n| ▪ |\n| ▪ |\n\
    \nA typical promise implementation would look as follows:\n\n```\nlet p = new\
    \ Promise((resolve, reject) => {\n  let isTrue = true;\n  if (isTrue) {\n    resolve('Promise\
    \ resolved');\n  } else {\n    reject('Promise rejected');\n  }\n});\n```\n\n\
    When creating a new `Promise` object, we need to pass a callback function that\
    \ will be called immediately with two arguments: the `resolve()` and `reject()`\
    \ functions\n\nDepending on the result of the `Promise`, either the `resolve()`\
    \ or the `reject()` function will be called to end the pending state.\n\nTo handle\
    \ the `Promise` object, you need to chain the function call with `then()` and\
    \ `catch()` functions as shown below:\n\n```\nlet p = new Promise((resolve, reject)\
    \ => {\n  let isTrue = true;\n  if (isTrue) {\n    resolve('Success');\n  } else\
    \ {\n    reject('Error');\n  }\n});\n\np\n.then(message => console.log(`Promise\
    \ resolved: ${message}`))\n.catch(message => console.log(`Promise rejected: ${message}`));\n\
    ```\n\nThe `resolve()` function corresponds to the `then()` function, while `reject()`\
    \ corresponds to the `catch()` function. You can change the `isTrue` value to\
    \ `false` to test this.\n\nHere’s an illustration of the promise process:\n\n\
    ![14 promise object](OEBPS/image_rsrc2EK.jpg)\n\nUsing the promise pattern, you\
    \ can call your functions sequentially by placing the next process inside the\
    \ `then()` method.\n\n## Callbacks vs Promises\n\nThe promise pattern is created\
    \ to replace the use of callbacks. By using promises, the code we write would\
    \ be more intuitive and maintainable.\n\nGoing back to the messaging illustration,\
    \ let’s create an example of using callbacks to handle the situation. First, we\
    \ declare the two variables required for this situation, called `isPhoneStore`\
    \ and `isPhoneAvailable`:\n\n```\nconst isPhoneStore = true;\nconst isPhoneAvailable\
    \ = true;\n```\n\nNext, we write a function that will process incoming messages.\
    \ This function will mimic the promise pattern, and it will resolve only when\
    \ `isPhoneStore` and `isPhoneAvailable` are true:\n\n```\nfunction processMessage(resolveCallback,\
    \ rejectCallback) {\n  if (!isPhoneStore) {\n    rejectCallback({\n      name:\
