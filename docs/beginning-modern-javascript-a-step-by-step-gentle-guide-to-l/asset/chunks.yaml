    \ perform a network request using `fetch()`, add the `id` of the task to the URL,\
    \ and set the method to `PATCH`.\n\nWhen we receive a response, we notify the\
    \ user and refresh the list.\n\n## Marking a Task as Completed\n\nTo mark a task\
    \ as completed or not completed, we need to check if the checkbox input has the\
    \ `checked` attribute.\n"
  raw: 'Open the VSCode Settings menu by pressing Ctrl + , or Command + , and search
    for ''live server ignore''. You should see the following output:


    ![17 liveserver settings](OEBPS/image_rsrc2EU.jpg)


    Click the Edit in settings.json link, and add db.json to the Live Server ignore
    files settings as shown below:


    "liveServer.settings.ignoreFiles": [


        "db.json",


        ".vscode/**",


        "**/*.scss",


        "**/*.sass",


        "**/*.ts"


    ]


    Save the changes. Now Live Server won’t reload when there’s a change in the db.json
    file.


    ## Use Fetch to Get and Display Tasks from the API


    Now that we have the database and the interface ready, the next step is to use
    JavaScript to get tasks data and display it in our table. We’re going to use the
    Fetch API for that.


    Open the script.js file, and write the following getTask() function:


    const BASE_API_URL = ''http://localhost:3000/tasks'';


    function getTasks() {


      const tableElement = document.querySelector(''#tasks-table'');


      fetch(BASE_API_URL)


        .then(response => response.json())


        .then(tasks => {


          console.log(tasks);


        });


    }


    getTasks();


    In the code above, we declared a constant variable to store the API URL we’re
    going to hit with requests.


    Below the constant, we created a function called getTasks() that will execute
    a network request using fetch(). To check if we successfully retrieved the data,
    we printed the tasks to the console.


    If you open the browser console, you should see the following output:


    ![17 get tasks output](OEBPS/image_rsrc2EV.jpg)


    This means we successfully retrieved the tasks data. The next step is to display
    those data on our To-do List. We need to query the <tbody> element in our HTML
    page and put the tasks as rows there.


    Recall that in our previous chapter, we put the id attribute to the <tbody> tag
    as follows:


    <tbody id="tbody-tasks">


      ...


    </tbody>


    This means we can get the element using the query selector:


    const BASE_API_URL = ''http://localhost:3000/tasks'';


    const tableElement = document.querySelector(''#tbody-tasks'');


    Then we go back into the getTasks() function, remove the console.log() method
    and create table rows based on the tasks data.


    Below, you can see that the code for creating the elements is quite long, but
    it’s essentially the same as when we create buttons for the Wizard Form:


    function getTasks() {


      let tableRows = '''';


      fetch(BASE_API_URL)


        .then(response => response.json())


        .then(tasks => {


          tasks.forEach(task => {


            const element = `<tr class=${


              task.completed ? ''table-success'' : ''''


            }><td><input class="form-check-input" type="checkbox" ${


              task.completed ? ''checked'' : ''''


            } onclick="toggleTask(event, ${task.id})"></td><td>${


              task.title


            }</td><td><button type="button" class="btn btn-link" onclick="editTask(${


              task.id


            })">Edit</button></td><td><button type="button" class="btn btn-link" onclick="deleteTask(${


              task.id


            })">Delete</button></td></tr>`;


            tableRows += element;


          });


          tableElement.innerHTML = tableRows;


        });


    }


    In the above code, we create a variable named tableRows that starts as an empty
    string. Next, we iterate over the tasks array using the forEach() method, and
    create an element variable for each task data.


    This element variable uses the data from the array to dynamically adjust the HTML
    output. If the task is marked as completed, then the table-success class is added
    to the <tr> tag, and the checked attribute is added to the checkbox.


    When the checkbox is clicked, then the toogleTask() function will be called. When
    the Edit button is clicked, then the editTask() function will be called, and when
    the Delete button is clicked, the deleteTask() button is called.


    The elements are stored in the tableRows variable, and when the forEach() process
    is finished, we set the innerHTML value of the tableElement to the tableRows value.


    If you open the browser, you should see the tasks appear on the table like this:


    ![17 get data](OEBPS/image_rsrc2EW.jpg)


    Since we’re able to display the data, we can remove the hard-coded <tr> elements
    in our index.html file. Remove the highlighted lines below:


    <!-- remove this from index.html -->


    <tr>


      ... Learn JavaScript ...


    </tr>


    <tr>


      ... Learn HTML ...


    </tr>


    Now that we successfully displayed the data, the next step is to enable adding
    a new task to the database.


    ## Adding a New Task


    To add a new task to the database, we need to define the addTask() function that
    has been defined in the previous chapter for the ''Add Task'' button:


    <button type="button" class="btn btn-primary" onClick="addTask()">


      Add Task


    </button>


    Back to the script.js file, create a new function named addTask() and write the
    following code into it:


    function addTask() {


      const taskTitle = document.querySelector(''#task-title'');


      const data = {


        title: taskTitle.value,


        completed: false,


      };


      fetch(BASE_API_URL, {


        method: ''POST'',


        headers: {


          ''Content-Type'': ''application/json'',


        },


        body: JSON.stringify(data),


      }).then(response => {


        if (response.ok) {


          alert(''Task added'');


          getTasks();


          taskTitle.value = '''';


        }


      });


    }


    First, we query the input text, which has an id of task-title, then we create
    an object called data that stores the title and completed status of the task.


    After that, we send a POST request using fetch(), adding the required options.
    When the response comes, we call the alert() function to notify the user that
    the task has been added to the database.


    Because there’s a new task on the database, we called the getTasks() data to reload
    the task lists and display it to the user. Then we empty the input text just to
    make it intuitive.


    Now you can test adding a new task from the browser. The next step is to add the
    delete functionality.


    ## Deleting a Task


    To delete a task from the database, we need to define the deleteTask() function
    in our script.js file. Here’s the function in full:


    function deleteTask(id) {


      const confirmation = confirm(''Are you sure you want to delete the task?'');


      if (confirmation) {


        fetch(BASE_API_URL + ''/'' + id, {


          method: ''DELETE'',


        }).then(response => {


          if (response.ok) {


            alert(''Task deleted'');


            getTasks();


          }


        });


      }


    }


    First, we confirm the decision to delete the task with the user using the confirm()
    function, which is part of the browser API.


    When the user confirms, we send a DELETE request using the fetch() function, and
    we put the id value of the task we want to delete in the API URL (BASE_API_URL
    + ''/'' + id)


    When we got a response back, we just call the alert() function to notify the user,
    then refresh the tasks list with getTasks().


    Now You can test the delete button from the browser. It should be working.


    ## Editing a Task


    To edit a task, we need to declare the editTask() function in our script.js file
    as follows:


    function editTask(id) {


      const newTitle = prompt(''Enter the new task title'');


      if (newTitle) {


        const data = { title: newTitle };


        fetch(BASE_API_URL + ''/'' + id, {


          method: ''PATCH'',


          headers: {


            ''Content-Type'': ''application/json'',


          },


          body: JSON.stringify(data),


        }).then(response => {


          if (response.ok) {


            alert(''Task updated'');


            getTasks();


          }


        });


      }


    }


    To edit a task, we need to call the prompt() function to ask the user a new title
    for the task. When the new title is received, we put the title as an object inside
    the data variable.


    The next step is to perform a network request using fetch(), add the id of the
    task to the URL, and set the method to PATCH.


    When we receive a response, we notify the user and refresh the list.


    ## Marking a Task as Completed


    To mark a task as completed or not completed, we need to check if the checkbox
    input has the checked attribute.'
