    ```\n\n另一种名为 `pop()` 的方法可用于从数组末尾移除一个元素：\n\n```\nlet birds = ['Owl', 'Eagle', 'Sparrow'];\n\
    birds.pop();\nconsole.log(birds);\n// ['Owl', 'Eagle']\n```\n\n`unshift()` 方法可用于从索引\
    \ 0 的前端添加一个元素：\n\n```\nlet fishes = ['Salmon', 'Goldfish', 'Tuna'];\nfishes.unshift('Sardine');\n\
    console.log(fishes);\n// ['Sardine', 'Salmon', 'Goldfish', 'Tuna']\n```\n\n另一方面，`shift()`\
    \ 方法可用于从索引 0 移除一个元素：\n\n```\nlet fishes = ['Salmon', 'Goldfish', 'Tuna'];\nfishes.shift();\n\
    console.log(fishes);\n// ['Goldfish', 'Tuna']\n```\n\n`indexOf()` 方法可用于查找并返回数组中某个元素的索引。如果数组中找不到该元素，该方法将返回\
    \ `-1`：\n\n```\nlet fishes = ['Salmon', 'Goldfish', 'Tuna'];\nlet pos = fishes.indexOf('Tuna');\n\
    console.log(pos); // 2\n```\n\n要遍历数组，你可以使用 `forEach()` 方法。该方法接受一个函数，该函数将对数组中的每个元素执行。该方法会将数组的元素和索引位置传递给该函数。以下是使用该方法的示例：\n\
    \n```\nlet fishes = ['Salmon', 'Goldfish', 'Tuna'];\nfishes.forEach(function (element,\
    \ index) {\n  console.log(`${index}: ${element}`);\n});\n```\n\n输出将是：\n\n```\n\
    0: Salmon\n1: Goldfish\n2: Tuna\n```\n\n这就是使用 `forEach()` 方法遍历数组的方式。\n\n## 总结\n\
    \n在本章中，你学习了数组这种特殊数据类型，以及如何操作存储在数组中的值。通过使用数组，你可以像对象一样将不同类型的数据存储在一个变量下，但更简单，因为你无需为每个值添加键。\n\
    \n# 第 9 章 - 文档对象模型（DOM）简介\n\n在深入学习之前，让我们回顾一下关于网页浏览器和 HTML 文档的知识。当我们想要构建一个网页时，我们会创建一个包含\
    \ HTML、CSS 和 JavaScript 的 HTML 文档。这三种技术像团队一样协同工作，各自扮演不同的角色，构建出我们在浏览器中看到的内容。\n\n\
    HTML 是一种标记语言，用于定义页面的结构和内容。我们使用的标签如 `<head>`、`<body>` 和 `<button>` 都有其含义，浏览器会处理这些标签，将文档内容渲染到屏幕上。\n\
    \n![仅含 HTML 的网站](img/image_rsrc2E5.jpg)\n\n图 7. 仅含 HTML 的网站\n\n但仅靠 HTML 生成的页面非常单调且外观普通。CSS\
    \ 的诞生使人们能够改变 HTML 标签在浏览器中的呈现方式。通过使用 CSS，你可以让按钮显示为你选择的颜色，或者让文本输入框带有圆角边框，使其更具吸引力和现代感。\n\
    \n![使用 CSS 样式化的网站](img/image_rsrc2E6.jpg)\n\n图 8. 使用 CSS 样式化的网站\n\nHTML 和 CSS\
    \ 是很好的搭档，但即便如此，网页仍然只是一个被动的存在。一旦浏览器处理完内容并渲染出来，你就无法以任何方式编辑页面。你无法更改页面的背景和文本颜色（例如深色模式），无法创建酷炫的动画，无法打开麦克风或摄像头，也无法在点击后从另一个网站检索数据并显示在页面上。\n\
    \nJavaScript 是一种受浏览器支持的编程语言，它填补了 HTML 和 CSS 留下的空白。简而言之，JavaScript 为静态网站注入了活力，使其变得动态。它允许网站与用户交互，响应用户的操作，并动态更新内容，而无需重新加载页面。\n\
    \n## DOM 解释\n\n那么，为什么 JavaScript 能做到 HTML 和 CSS 做不到的事情呢？答案是 JavaScript 能够操作文档对象模型，简称\
    \ DOM。DOM 是一个由构成网页的对象组成的层次结构。浏览器会暴露这个 DOM，以便你可以使用 JavaScript 更改页面结构、样式和内容。\n\n\
    例如，假设你的文档中有以下 HTML 内容：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n \
    \ <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n  <title>Document</title>\n</head>\n<body>\n  <h1>Hello\
    \ World!</h1>\n  <p>This is a paragraph element</p>\n</body>\n</html>\n```\n\n\
    上述 HTML 文档生成的 DOM 图如下所示。下面我将解释该图的含义：\n\n![DOM 示例图](img/image_rsrc2E7.jpg)\n\n\
    图 9. DOM 示例图\n\nDOM 看起来像一棵由一组相连节点组成的树状结构。这些节点是你可以使用 JavaScript 访问的对象。`html` 节点及其子节点就是文档的内容。\n\
    \n现在，让我们重点关注 `window` 和 `document` 对象。\n\n## Window 对象\n\n`window` 对象是 DOM 树的根，该对象用于指示浏览器执行以下任务：\n\
    \n| ▪ |\n| ▪ |\n| ▪ |\n| ▪ |\n\n你可以通过在控制台中输入 `window` 并按回车来访问 `window` 对象。浏览器会响应并显示该对象的方法和属性，如下所示：\n\
    \n![Window 对象](img/image_rsrc2E8.jpg)\n\n图 10. Window 对象的属性和方法\n\n`window` 对象提供了你将用于操作网页的子对象和方法。例如，`window`\
    \ 拥有 `console` 对象，你可以用它向控制台输出消息。在控制台中输入以下代码并按回车：\n\n```\nwindow.console.log('Hello\
    \ World!');\n```\n\n你会看到字符串 `'Hello World!'` 被输出到控制台。\n\n`window` 对象是一个全局对象，因此在调用其子对象时可以省略它。要访问\
    \ `console` 对象，只需像下面这样输入 `console`：\n\n```\nconsole.log('Hello World!');\n```\n\
    \n访问 `document` 对象时也是如此。你可以写 `document.propertyOrMethod` 而不是 `window.document.propertyOrMethod`。\n\
    \n我不会深入探讨 `window` 对象，因为作为 Web 开发者，你在日常工作中更多地是与 `document` 对象交互。\n\n## Document\
    \ 对象\n\n`document` 对象是你在文档中编写的所有 HTML 元素的入口点。这个对象也是文档对象模型名称的由来。它不叫窗口对象模型，因为我们主要处理的是\
    \ Document 对象而不是 Window 对象。\n\n![文档对象模型](img/image_rsrc2E9.jpg)\n\n图 11. 文档对象模型\n\
    \n通过 `document` 对象，你可以使用 JavaScript 检索与 HTML 内容相关的任何数据。你可以使用 `document.title`\
    \ 属性获取文档标题，使用 `document.URL` 获取 URL。引用来源可在 `document.referrer` 中找到，域名在 `document.domain`\
    \ 中。\n\n通过 `document` 对象，你可以获取 `body` 和 `head` 节点：\n\n- `document.documentElement`：整个\
    \ HTML 元素节点\n- `document.body`：body 元素节点\n- `document.head`：head 元素节点\n\n你可以尝试从控制台访问这些属性，如下所示：\n\
    \n![Document 属性](img/image_rsrc2EA.jpg)\n\n图 12. Document 属性\n\n你可以在 [`developer.mozilla.org/en-US/docs/Web/API/Document`](https://developer.mozilla.org/en-US/docs/Web/API/Document)\
    \ 查看 `document` 对象所有属性和方法的文档（注意：一开始可能会觉得信息量很大）。\n\n当然，你能做的远不止读取文档数据。在下一章中，我们将开始一个项目来练习操作\
    \ DOM。\n\n## 总结\n\nDOM 是一种树状结构，由我们创建并加载到浏览器中的 HTML 文件生成。浏览器随后将这个 DOM 暴露为一组我们可以访问的\
    \ JavaScript 对象，例如 `window` 和 `document` 对象。这是一项重要的技术，它允许你编程控制网页浏览器执行特定任务。\n\n\
    # 第 10 章：项目 1 - 创建向导表单应用程序\n\n"
- fmt: "\nWe’re going to learn how we can use JavaScript to control what’s being shown\
    \ on our web application.\n\nThe application we’re going to build is a simple\
    \ Wizard Form. A Wizard Form is a multi-step form designed to ease the filling\
    \ process for a long and complex form.\n\nBy showing only a few inputs at a time,\
    \ users will feel encouraged to fill in the blank input rather than feeling overwhelmed\
    \ and potentially abandoning the form.\n\nThe Wizard Form has three steps as shown\
    \ below:\n\n![10 wizard form example](OEBPS/image_rsrc2EB.jpg)\n\nFigure 13\\\
    . Wizard Form Demo\n\nBy clicking the next button, you can jump into the other\
    \ parts of the form. When you click on the submit button, an alert will be triggered\
    \ and your inputs will be displayed:\n\n![10 form alert](OEBPS/image_rsrc2EC.jpg)\n\
    \nFigure 14\\. Wizard Form Alert\n\nTo keep things simple, the form will only\
    \ have one input for each step and you don’t need to validate the data.\n\nGiven\
    \ the demo above, you basically need to break the form into three `<div>` elements,\
    \ and then use JavaScript to display them one at a time. Let’s start the project\
    \ in the next section.\n\n## Project Setup\n\nTo start this project, let’s create\
    \ a new folder to separate the project from the code examples we’ve written so\
    \ far.\n\nLet’s name the folder `wizard_form` and create three files that we will\
    \ fill later: `index.html`, `style.css`, and `script.js`.\n\n## Putting the HTML\
    \ and CSS First\n\nWhen starting a new project, the first step we need to do is\
    \ to put the HTML and CSS according to the specifications we’ve been given.\n\n\
    Open the `index.html` file in VSCode and write the basic HTML structure inside:\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"\
    UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    \ />\n    <title>Document</title>\n  </head>\n  <body></body>\n</html>\n```\n\n\
    Next, update the `<head>` tag as follows:\n\n1.  Edit the title to JS Wizard Form\n\
    2.  Add the links to the style and script files\n\nThe result should look as follows:\n\
    \n```html\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\" />\n<title>JS Wizard Form</title>\n<link rel=\"stylesheet\"\
    \ href=\"style.css\" />\n<script src=\"script.js\" defer></script>\n```\n\nThe\
    \ next step is to write the body of the HTML document. As shown in the demo, there’s\
    \ a container that holds the Wizard Form, so add a container `div` into the body\
    \ as follows:\n\n```html\n<body>\n  <div class='container'>\n    <h1>The Wizard\
    \ Form \U0001F9D9‍♂️</h1>\n    <p>\n      Step <span id='currentStep'>1</span>\n\
    \    </p>\n    <form id='wizard-form'></form>\n  </div>\n</body>\n```\n\nThe `<form>`\
    \ tag is added as the child of the container `div`. Now, you need to create the\
    \ three steps of the Wizard Form.\n\nYou can separate the form into three `<div>`\
    \ tags:\n\n```html\n<form id=\"wizard-form\">\n  <div id=\"step1\" class=\"step\"\
    >\n    <div class=\"form-group\">\n      <label for=\"email\">Email address</label>\n\
    \      <input\n        class=\"form-control\"\n        name=\"email\"\n      \
    \  type=\"text\"\n        placeholder=\"Enter email\"\n      />\n    </div>\n\
    \  </div>\n  <div id=\"step2\" class=\"step\">\n    <div class=\"form-group\"\
    >\n      <label for=\"username\">Username</label>\n      <input\n        class=\"\
    form-control\"\n        name=\"username\"\n        type=\"text\"\n        placeholder=\"\
    Enter username\"\n      />\n    </div>\n  </div>\n  <div id=\"step3\" class=\"\
    step\">\n    <div class=\"form-group\">\n      <label for=\"password\">Password</label>\n\
    \      <input\n        class=\"form-control\"\n        name=\"password\"\n   \
    \     type=\"password\"\n        placeholder=\"Enter password\"\n      />\n  \
    \  </div>\n  </div>\n</form>\n```\n\nNow if you open the HTML file using Live\
    \ Server, you can see the skeleton HTML structure finished:\n\n![10 wizard form\
    \ bare html](OEBPS/image_rsrc2ED.jpg)\n\nIt’s time to add some CSS to beautify\
    \ this application. Open the `style.css` we created earlier and put the following\
    \ styles inside. I’ll briefly explain these rules below:\n\n```css\nbody {\n \
    \ margin: 1rem;\n  font-family: sans-serif;\n  background-color: #edceb0;\n}\n\
    \n.container {\n  margin-left: auto;\n  margin-right: auto;\n  background: #fff;\n\
    \  height: 424px;\n  width: 338px;\n  padding: 71px 93px 0;\n  border-radius:\
    \ 10px;\n  box-shadow: 0 2px 7px 0 rgba(0, 0, 0, 0.1);\n}\n\nlabel {\n  display:\
    \ inline-block;\n  margin-bottom: 0.5rem;\n}\n\n.form-group {\n  margin-bottom:\
    \ 1rem;\n}\n\n.form-control {\n  width: 100%;\n  padding: 0.375rem 0.75rem;\n\
    \  font-size: 1rem;\n  line-height: 1.5;\n  color: #495057;\n  border: 1px solid\
    \ #ced4da;\n  border-radius: 0.25rem;\n  box-sizing: border-box;\n}\n```\n\nThe\
    \ `body` style is used to add space, font family, background to the application.\
    \ The `.container` style is used to beautify the `div` containing the form. The\
    \ `label`, `.form-group` and `.form-control` is used to make the form look good.\n\
    \nYou can see the style applied in the browser:\n\n![10 wizard form styled](OEBPS/image_rsrc2EE.jpg)\n\
    \nThe first step is done. We’ve added the minimum amount of HTML and CSS required\
    \ for the document.\n\n## Summary\n\nIn this chapter, we laid the foundations\
    \ for our Wizard Form Application by writing the HTML and CSS content.\n\nThe\
    \ `id` and `class` attributes are added to the HTML elements to help in styling\
    \ and manipulating with JavaScript in the next chapter.\n\nIf you need to check\
    \ your work, you can get the sample code used in this chapter at [https://github.com/nathansebhastian/js-wizard-form/tree/main/check-point-1](https://github.com/nathansebhastian/js-wizard-form/tree/main/check-point-1)\n\
    \n# Chapter 11: The Wizard Form Mechanism\n\nIn this chapter, we’re going to implement\
    \ the Wizard Form mechanism using JavaScript. To do so, we’re going to use the\
    \ query selector methods provided by the DOM.\n\n## DOM Query Selector Methods\n\
    \nThe Document Object Model provides a set of methods that allow you to select\
    \ a specific element in the HTML nodes. They are the `querySelector()` and `querySelectorAll()`\
    \ methods.\n\nThe `querySelector()` method is a JavaScript method from the `document`\
    \ object that allows you to retrieve a single `Element` object that matches the\
    \ CSS selector passed to the method.\n\nThe CSS selector is the pattern you use\
    \ when targeting a specific element for styling. Here’s an example of CSS selectors:\n\
    \n```css\n/* Selecting all elements with the id value of box */\n#box {\n}\n\n\
    /* Selecting all elements with the class value of btn */\n.btn {\n}\n```\n\nThe\
    \ pattern you need to pass to the `querySelector()` method can be as simple or\
    \ as complex as you need.\n\nFor example, here’s how to use the method to retrieve\
    \ an element with an `id` attribute of `'box'`:\n\n```javascript\ndocument.querySelector('#box');\n\
    ```\n\nThe `querySelector()` method always returns the first element that matches\
    \ the query. The method searches for the element from the top to the bottom of\
    \ the DOM tree.\n\nThe string parameter passed to the `querySelector()` method\
    \ follows the CSS selector pattern, where class is represented by a period `.`\
    \ and id is represented by a hash `#`.\n\nSuppose you have the following HTML\
    \ element on your page:\n\n```html\n<body>\n  <h1>Query Selector</h1>\n  <h2>Learning\
    \ Query selector method</h2>\n  <p id=\"opening\" class=\"bold\">Placeholder</p>\n\
    </body>\n```\n\nYou can retrieve the `<p>` element by passing `\"p\"` as the method’s\
    \ argument:\n\n```javascript\nlet element = document.querySelector('p');\nconsole.log(element);\n\
    // <p id=\"opening\" class=\"bold\">Opening</p>\n```\n\nOr you can also pass the\
    \ `id` or the `class` attribute, it will return the same `<p>` element:\n\n```javascript\n\
    document.querySelector('.bold');\n// <p id=\"opening\" class=\"bold\">Opening</p>\n\
    \ndocument.querySelector('#opening');\n// <p id=\"opening\" class=\"bold\">Opening</p>\n\
    ```\n\nWhen you pass a selector that returns two elements, only the first element\
    \ will be returned by the method. The following code tries to fetch both `<h1>`\
    \ and `<h2>` elements:\n\n```javascript\ndocument.querySelector('h1, h2');\n//\
    \ <h1>Query Selector</h1>\n```\n\nAbove, you can see that the method returns the\
    \ first match, which is the `<h1>` element.\n\nAnd that’s how the `querySelector()`\
    \ method works. When you need to retrieve more than a single element, you need\
    \ to use the alternative `querySelectorAll()` method instead.\n"
  raw: 'We’re going to learn how we can use JavaScript to control what’s being shown
    on our web application.


    The application we’re going to build is a simple Wizard Form. A Wizard Form is
    a multi-step form designed to ease the filling process for a long and complex
    form.


    By showing only a few inputs at a time, users will feel encouraged to fill in
    the blank input rather than feeling overwhelmed and potentially abandoning the
    form.


    The Wizard Form has three steps as shown below:


    ![10 wizard form example](OEBPS/image_rsrc2EB.jpg)


    Figure 13\. Wizard Form Demo


    By clicking the next button, you can jump into the other parts of the form. When
    you click on the submit button, an alert will be triggered and your inputs will
    be displayed:


    ![10 form alert](OEBPS/image_rsrc2EC.jpg)


    Figure 14\. Wizard Form Alert


    To keep things simple, the form will only have one input for each step and you
    don’t need to validate the data.


    Given the demo above, you basically need to break the form into three <div> elements,
    and then use JavaScript to display them one at a time. Let’s start the project
    in the next section.


    ## Project Setup


    To start this project, let’s create a new folder to separate the project from
    the code examples we’ve written so far.


    Let’s name the folder wizard_form and create three files that we will fill later:
    index.html, style.css, and script.js.


    ## Putting the HTML and CSS First


    When starting a new project, the first step we need to do is to put the HTML and
    CSS according to the specifications we’ve been given.


    Open the index.html file in VSCode and write the basic HTML structure inside:


    <!DOCTYPE html>


    <html lang="en">


      <head>


        <meta charset="UTF-8" />


        <meta name="viewport" content="width=device-width, initial-scale=1.0" />


        <title>Document</title>


      </head>


      <body></body>


    </html>


    Next, update the <head> tag as follows:


    1.  Edit the title to JS Wizard Form


    2.  Add the links to the style and script files


    The result should look as follows:


    <meta charset="UTF-8" />


    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <title>JS Wizard Form</title>


    <link rel="stylesheet" href="style.css" />


    <script src="script.js" defer></script>


    The next step is to write the body of the HTML document. As shown in the demo,
    there’s a container that holds the Wizard Form, so add a container div into the
    body as follows:


    <body>


      <div class=''container''>


        <h1>The Wizard Form 🧙‍♂️</h1>


        <p>


          Step <span id=''currentStep''>1</span>


        </p>


        <form id=''wizard-form''></form>


      </div>


    </body>


    The <form> tag is added as the child of the container div. Now, you need to create
    the three steps of the Wizard Form.


    You can separate the form into three <div> tags:


    <form id="wizard-form">


      <div id="step1" class="step">


        <div class="form-group">


          <label for="email">Email address</label>


          <input


            class="form-control"


            name="email"


            type="text"


            placeholder="Enter email"


          />


        </div>


      </div>


      <div id="step2" class="step">


        <div class="form-group">


          <label for="username">Username</label>


          <input


            class="form-control"


            name="username"


            type="text"


            placeholder="Enter username"


          />


        </div>


      </div>


      <div id="step3" class="step">


        <div class="form-group">


          <label for="password">Password</label>


          <input


            class="form-control"


            name="password"


            type="password"


            placeholder="Enter password"


          />


        </div>


      </div>


    </form>


    Now if you open the HTML file using Live Server, you can see the skeleton HTML
    structure finished:


    ![10 wizard form bare html](OEBPS/image_rsrc2ED.jpg)


    It’s time to add some CSS to beautify this application. Open the style.css we
    created earlier and put the following styles inside. I’ll briefly explain these
    rules below:


    body {


      margin: 1rem;


      font-family: sans-serif;


      background-color: #edceb0;


    }


    .container {


      margin-left: auto;


      margin-right: auto;


      background: #fff;


      height: 424px;


      width: 338px;


      padding: 71px 93px 0;


      border-radius: 10px;


      box-shadow: 0 2px 7px 0 rgba(0, 0, 0, 0.1);


    }


    label {


      display: inline-block;


      margin-bottom: 0.5rem;


    }


    .form-group {


      margin-bottom: 1rem;


    }


    .form-control {


      width: 100%;


      padding: 0.375rem 0.75rem;


      font-size: 1rem;


      line-height: 1.5;


      color: #495057;


      border: 1px solid #ced4da;


      border-radius: 0.25rem;


      box-sizing: border-box;


    }


    The body style is used to add space, font family, background to the application.
    The .container style is used to beautify the div containing the form. The label,
    .form-group and .form-control is used to make the form look good.


    You can see the style applied in the browser:


    ![10 wizard form styled](OEBPS/image_rsrc2EE.jpg)


    The first step is done. We’ve added the minimum amount of HTML and CSS required
    for the document.


    ## Summary


    In this chapter, we laid the foundations for our Wizard Form Application by writing
    the HTML and CSS content.


    The id and class attributes are added to the HTML elements to help in styling
    and manipulating with JavaScript in the next chapter.


    If you need to check your work, you can get the sample code used in this chapter
    at [https://github.com/nathansebhastian/js-wizard-form/tree/main/check-point-1](https://github.com/nathansebhastian/js-wizard-form/tree/main/check-point-1)


    Chapter 11: The Wizard Form Mechanism


    In this chapter, we’re going to implement the Wizard Form mechanism using JavaScript.
    To do so, we’re going to use the query selector methods provided by the DOM.


    ## DOM Query Selector Methods


    The Document Object Model provides a set of methods that allow you to select a
    specific element in the HTML nodes. They are the querySelector() and querySelectorAll()
    methods.


    The querySelector() method is a JavaScript method from the document object that
    allows you to retrieve a single Element object that matches the CSS selector passed
    to the method.


    The CSS selector is the pattern you use when targeting a specific element for
    styling. Here’s an example of CSS selectors:


    /* Selecting all elements with the id value of box */


    #box {


    }


    /* Selecting all elements with the class value of btn */


    .btn {


    }


    The pattern you need to pass to the querySelector() method can be as simple or
    as complex as you need.


    For example, here’s how to use the method to retrieve an element with an id attribute
    of ''box'':


    document.querySelector(''#box'');


    The querySelector() method always returns the first element that matches the query.
    The method searches for the element from the top to the bottom of the DOM tree.


    The string parameter passed to the querySelector() method follows the CSS selector
    pattern, where class is represented by a period . and id is represented by a hash
    #.


    Suppose you have the following HTML element on your page:


    <body>


      <h1>Query Selector</h1>


      <h2>Learning Query selector method</h2>


      <p id="opening" class="bold">Placeholder</p>


    </body>


    You can retrieve the <p> element by passing "p" as the method’s argument:


    let element = document.querySelector(''p'');


    console.log(element);


    // <p id="opening" class="bold">Opening</p>


    Or you can also pass the id or the class attribute, it will return the same <p>
    element:


    document.querySelector(''.bold'');


    // <p id="opening" class="bold">Opening</p>


    document.querySelector(''#opening'');


    // <p id="opening" class="bold">Opening</p>


    When you pass a selector that returns two elements, only the first element will
    be returned by the method. The following code tries to fetch both <h1> and <h2>
    elements:


    document.querySelector(''h1, h2'');


    // <h1>Query Selector</h1>


    Above, you can see that the method returns the first match, which is the <h1>
    element.


    And that’s how the querySelector() method works. When you need to retrieve more
    than a single element, you need to use the alternative querySelectorAll() method
    instead.'
