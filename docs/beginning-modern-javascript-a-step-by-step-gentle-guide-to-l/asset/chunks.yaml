  trans: "\n\n## `querySelectorAll()` 方法\n\n`querySelectorAll()` 方法是 DOM API 中的一个\
    \ JavaScript 方法，它允许你检索所有与传入的 CSS 选择器匹配的元素。\n\n例如，下面展示了如何使用该方法检索所有具有 `box` 类属性的元素：\n\
    \n```\ndocument.querySelectorAll('.box');\n```\n\n传递给 `querySelectorAll()` 方法的字符串参数遵循\
    \ CSS 选择器模式，其中类用句点 `.` 表示，id 用井号 `#` 表示。\n\n要检索特定元素的所有副本，你可以直接将该元素的名称作为参数传入。\n\
    \n假设页面上有以下 HTML 元素：\n\n```\n<body>\n  <p id=\"opening\" class=\"bold\">Opening</p>\n\
    \  <p id=\"middle\">Middle</p>\n  <p id=\"closing\" class=\"bold\">Closing</p>\n\
    </body>\n```\n\n你可以通过传入 `\"p\"` 作为方法的参数来检索所有 `<p>` 元素：\n\n```\nlet elements =\
    \ document.querySelectorAll('p');\nconsole.log(elements);\n// NodeList(3) [p#opening.bold,\
    \ p#middle, p#closing.bold]\nconsole.log(elements[0]);\n// <p id=\"opening\" class=\"\
    bold\">Opening</p>\n```\n\n或者，当你只需要开头和结尾的 `<p>` 元素时，你可以传入类或 `id` 作为参数：\n\n```\n\
    document.querySelectorAll('.bold');\n// [p#opening.bold, p#closing.bold]\ndocument.querySelectorAll('#opening,\
    \ #closing');\n// [p#opening.bold, p#closing.bold]\n```\n\n你还可以通过其他属性（如 `target`\
    \ 或 `value`）来选择元素：\n\n```\n// 返回所有 target=\"_blank\" 的元素\ndocument.querySelectorAll('[target=_blank]');\n\
    // 返回所有 value=\"red\" 的元素\ndocument.querySelectorAll('[value=red]');\n```\n\n\
    `querySelectorAll()` 方法的返回值是一个类似数组的对象，称为 `NodeList`。\n\n要访问 `NodeList` 对象的元素，你可以使用索引位置。你也可以使用\
    \ `forEach()` 方法遍历这些元素：\n\n```\nlet elements = document.querySelectorAll('p');\n\
    // 1. 访问索引 0 处的元素\nconsole.log(element[0]);\n// 2. 使用 forEach() 遍历元素\nelements.forEach(function\
    \ (element) {\n  console.log(element);\n  element.style.backgroundColor = 'yellow';\n\
    });\n```\n\n上面的代码会在循环中记录当前元素，并将其 `background-color` 值设置为 `\"yellow\"`。\n\n即使只有一个匹配的元素，`querySelectorAll()`\
    \ 方法也始终返回一个 `NodeList` 对象。\n\n## 使用 CSS 隐藏表单步骤\n\n回到向导表单应用，我们需要一种使用 CSS 和 JavaScript\
    \ 显示和隐藏表单步骤的方法。在 `style.css` 中添加以下规则：\n\n```\n.step {\n  display: none;\n}\n.step.active\
    \ {\n  display: block;\n}\n```\n\n这将使所有带有 `step` 类的 `div` 标签在显示中被隐藏。要显示表单步骤，请将\
    \ `active` 类添加到 `step1` div 中，如下所示：\n\n```\n<div id=\"step1\" class=\"step active\"\
    >\n  <div class=\"form-group\">...</div>\n</div>\n```\n\n返回浏览器，现在你只会看到向导表单的第一步被显示。\n\
    \n## 添加“下一步”按钮\n\n现在我们需要一些按钮来在表单步骤之间切换，因此在 `step1` div 中添加以下按钮：\n\n```\n<div id=\"\
    step1\" class=\"step active\">\n  <div class=\"form-group\">...</div>\n  <button\n\
    \    type=\"button\"\n    class=\"btn btn-primary f-right\"\n    onclick=\"nextStep()\"\
    \n  >\n    Next\n  </button>\n</div>\n```\n\n在这个按钮中，我们添加了 `onclick` 属性，以便在点击按钮时运行\
    \ JavaScript 代码。\n\n我们要调用的函数名是 `nextStep()`，所以让我们在 `script.js` 文件中创建这个函数。我们还需要一个\
    \ `showStep()` 函数，它将执行以下操作：\n\n```\nlet currentStep = 1;\n\nfunction nextStep()\
    \ {\n  if (currentStep < 3) {\n    currentStep++;\n    document.querySelectorAll('.step').forEach(function\
    \ (element) {\n      element.classList.remove('active');\n    });\n    document.querySelector(`#step${currentStep}`).classList.add('active');\n\
    \    document.querySelector('#currentStep').textContent = currentStep;\n  }\n\
    }\n```\n\n在 `script.js` 文件中，我们声明了一个名为 `currentStep` 的变量，用于记录表单当前所处的步骤。\n\n在 `nextStep()`\
    \ 函数中，我们使用 `if` 语句检查 `currentStep` 是否小于 3，因为表单只有 3 个步骤。\n\n要进入下一步，我们使用 `++` 运算符将\
    \ `currentStep` 值增加 1，然后使用 `document.querySelectorAll()` 方法选择所有包含 `step` 类的元素。我们从所有表单步骤中移除\
    \ `active` 类。\n\n之后，我们选择当前步骤，并使用 `classList.add()` 方法将 `active` 类添加到该元素。最后一项任务是将\
    \ `currentStep` 段落的内容更改为 `currentStep`。\n\n在浏览器中打开向导表单，你应该能够使用“下一步”按钮导航到步骤 3。但请注意，你无法返回上一步！这就是我们接下来要实现的功能。\n\
    \n## 添加“上一步”按钮\n\n现在我们需要另一个按钮来移动到上一步。在 `step2` 和 `step3` div 标签上，你可以添加以下按钮：\n\n\
    ```\n<div id='step2' class='step'>\n  <div class='form-group'>...</div>\n  <button\
    \ type='button' class='btn btn-secondary' onclick='prevStep()'>\n    Previous\n\
    \  </button>\n  <button type='button' class='btn btn-primary f-right' onclick='nextStep()'>\n\
    \    Next\n  </button>\n</div>\n\n<div id=\"step3\" class=\"step\">\n  <div class=\"\
    form-group\">...</div>\n  <button type=\"button\" class=\"btn btn-secondary\"\
    \ onclick=\"prevStep()\">\n    Previous\n  </button>\n</div>\n```\n\n接下来，我们需要在\
    \ `script.js` 文件中添加一个 `prevStep()` 函数：\n\n```\nfunction prevStep() {\n  if (currentStep\
    \ > 1) {\n    currentStep--;\n    document.querySelectorAll('.step').forEach(function\
    \ (element) {\n      element.classList.remove('active');\n    });\n    document.querySelector(`#step${currentStep}`).classList.add('active');\n\
    \    document.querySelector('#currentStep').textContent = currentStep;\n  }\n\
    }\n```\n\n`prevStep()` 函数与 `nextStep()` 函数基本相同，只是 `if` 语句的检查条件和 `currentStep`\
    \ 的递减部分不同。\n\n与其在两个不同的函数中编写相同的代码，我们可以创建一个新函数来执行查询选择器的部分。我们将这个函数命名为 `showStep()`。\n\
    \n你的 `script.js` 文件应该如下所示：\n\n```\nlet currentStep = 1;\n\nfunction showStep()\
    \ {\n  document.querySelectorAll('.step').forEach(function (element) {\n    element.classList.remove('active');\n\
    \  });\n  document.querySelector(`#step${currentStep}`).classList.add('active');\n\
    \  document.querySelector('#currentStep').textContent = currentStep;\n}\n\nfunction\
    \ nextStep() {\n  if (currentStep < 3) {\n    currentStep++;\n    showStep();\n\
    \  }\n}\n\nfunction prevStep() {\n  if (currentStep > 1) {\n    currentStep--;\n\
    \    showStep();\n  }\n}\n```\n\n回到浏览器，现在你可以使用按钮进入下一步和上一步。最后需要做的是为这些按钮添加样式。目前它们看起来相当糟糕：\n\
    \n```\n.f-right {\n  float: right !important;\n}\n\n.btn {\n  color: #fff;\n \
    \ cursor: pointer;\n  font-size: 1rem;\n  line-height: 1.5;\n  border-radius:\
    \ 0.25rem;\n  padding: 0.375rem 0.75rem;\n  border: 1px solid transparent;\n}\n\
    \n.btn-next {\n  border-color: #007bff;\n  background-color: #007bff;\n}\n\n.btn-previous\
    \ {\n  border-color: #6c757d;\n  background-color: #6c757d;\n}\n```\n\n`.f-right`\
    \ 样式为元素添加了 `float` 属性，使其向右移动；`.btn` 用于设置按钮的样式。\n\n`.btn-next` 和 `.btn-previous`\
    \ 样式分别为相应的元素添加了边框和背景颜色。\n\n到目前为止一切顺利。最后一项任务是添加提交按钮并显示表单收集的数据。\n\n如果你遇到错误并希望检查你的工作，可以在\
    \ [`github.com/nathansebhastian/js-wizard-form/tree/main/check-point-2`](https://github.com/nathansebhastian/js-wizard-form/tree/main/check-point-2)\
    \ 获取本章使用的代码。\n\n## 第 12 章：处理向导表单提交\n\n为了完成向导表单应用，我们需要提供关于表单提交时该如何处理的说明。\n\n##\
    \ 添加提交按钮\n\n"
- fmt: "\nBack to the project, the final task we need to do on the Wizard Form is\
    \ to add a submit button to the third step, so let’s do it.\n\nAdd the submit\
    \ button to the `step3` div as follows:\n\n```html\n<div id=\"step3\" class=\"\
    step\">\n  <div class=\"form-group\">\n    <label for=\"password\">Password</label>\n\
    \    <input\n      class=\"form-control\"\n      name=\"password\"\n      type=\"\
    password\"\n      placeholder=\"Enter password\"\n    />\n  </div>\n  <button\
    \ type=\"button\" class=\"btn btn-previous\" onclick=\"prevStep()\">\n    Previous\n\
    \  </button>\n  <button type=\"submit\" class=\"btn btn-submit f-right\">Submit</button>\n\
    </div>\n```\n\nAdd the CSS for the submit button in `style.css` as follows:\n\n\
    ```css\n.btn-submit {\n  border-color: #28a745;\n  background-color: #28a745;\n\
    }\n```\n\nNow we need to listen when the submit button is clicked.\n\n## Listening\
    \ to Form Submit Events Using JavaScript\n\nBesides the DOM API, the browser also\
    \ expose signals known as events that you can use as a cue to run a specific code.\
    \ We have done this earlier when adding the `onclick` attribute to the buttons:\n\
    \n```html\n<button type='button' class='btn btn-secondary' onclick='prevStep()'>\n\
    \    Previous\n  </button>\n  <button type='button' class='btn btn-primary f-right'\
    \ onclick='nextStep()'>\n    Next\n  </button>\n```\n\nThe `onclick` HTML attribute\
    \ is a shortcut to listen to the `click` event. When the previous button is clicked,\
    \ we run the `prevStep()` function. When the next button is clicked, we run the\
    \ `nextStep()` function.\n\nAside from using the `onclick` attribute, we can also\
    \ add event listeners using the `addEventListener()` method.\n\nLet’s add an event\
    \ listener so that we know when a form is submitted. The Wizard Form we created\
    \ has an `id` attribute, so you can select that form using JavaScript.\n\n```javascript\n\
    const wizardForm = document.querySelector('#wizard-form');\n```\n\nNext, you need\
    \ to call the `addEventListener()` method and listen to the `'submit'` event as\
    \ follows:\n\n```javascript\nconst wizardForm = document.querySelector('#wizard-form');\n\
    \nwizardForm.addEventListener('submit', function (event) {\n  // TODO: handle\
    \ the submit event\n});\n```\n\nNow that we can listen to the submit event, we\
    \ need to interrupt the default behavior of the form so that JavaScript can take\
    \ over.\n\nTo do so, we need to call the `event.preventDefault()` method inside\
    \ the function we passed to the event listener:\n\n```javascript\nconst wizardForm\
    \ = document.querySelector('#wizard-form');\n\nwizardForm.addEventListener('submit',\
    \ function (event) {\n  event.preventDefault();\n});\n```\n\nThe `preventDefault()`\
    \ method interrupts the default flow of the submit event, which will cause the\
    \ browser to refresh the current page.\n\nFrom here, you can instruct JavaScript\
    \ to do specific tasks to the form data submitted by the user.\n\nThe form object\
    \ has an object property named `elements` that store all input elements you define\
    \ inside the form. Inside the object, you can access the value of input fields\
    \ by specifying its `name` attribute, followed by the `value` property.\n\nHere’s\
    \ how to get the values from our Wizard Form:\n\n```javascript\nevent.preventDefault();\n\
    \nconst email = wizardForm.elements.email.value;\nconst username = wizardForm.elements.username.value;\n\
    const password = wizardForm.elements.password.value;\n```\n\nFinally, we display\
    \ the data using the JavaScript `alert()` function, which\n\n```javascript\nconst\
    \ email = wizardForm.elements.email.value;\nconst username = wizardForm.elements.username.value;\n\
    const password = wizardForm.elements.password.value;\n\nalert(`Registration complete!\
    \ Your details: \\n\n  Email: ${email} \\n\n  Username: ${username} \\n\n  Password:\
    \ ${password}`);\n```\n\nYou can test the Wizard Form in the browser. Fill in\
    \ the textboxes and you’ll get an alert when clicking the submit button:\n\nJust\
    \ to make the application smarter, we can reset the form after it has been submitted\
    \ by the user:\n\n```javascript\nconst email = wizardForm.elements.email.value;\n\
    const username = wizardForm.elements.username.value;\nconst password = wizardForm.elements.password.value;\n\
    //   alert(...);\nwizardForm.reset();\ncurrentStep = 1;\nshowStep();\n```\n\n\
    The `reset()` method from the form will reset all textboxes, then we set the `currentStep`\
    \ variable to 1 and run the `showStep()` function to reset the interface.\n\n\
    ## Taking Care of Repeating Code\n\nIf you look closely, you might notice that\
    \ the code for the Next and Previous buttons in the steps are identical. Instead\
    \ of writing them in the HTML file, we can use JavaScript to add them dynamically.\n\
    \nFirst, select all the steps div using `querySelector()` as follows:\n\n```javascript\n\
    const stepsDiv = document.querySelectorAll('.step');\n\nstepsDiv.forEach((element,\
    \ index) => {\n  if (index === 0) {\n    element.innerHTML += nextButton;\n  }\
    \ else if (index === stepsDiv.length - 1) {\n    element.innerHTML += previousButton;\n\
    \    element.innerHTML += registerButton;\n  } else {\n    element.innerHTML +=\
    \ previousButton;\n    element.innerHTML += nextButton;\n  }\n});\n```\n\nNext,\
    \ declare three variables containing the HTML buttons tag:\n\n```javascript\n\
    const stepsDiv = document.querySelectorAll('.step');\n\nconst previousButton =\n\
    \  '<button class=\"btn btn-secondary\" onclick=\"prevStep()\" type=\"button\"\
    >Previous</button>';\nconst nextButton =\n  '<button class=\"btn btn-primary f-right\"\
    \ onclick=\"nextStep()\" type=\"button\">Next</button>';\nconst registerButton\
    \ =\n  '<button type=\"submit\" class=\"btn btn-success f-right\">Register</button>';\n\
    ```\n\nNow, we need to iterate over the elements using the `forEach()` method.\
    \ We can check if the element is the first or the last step from the `index` value.\n\
    \nFor the first element at `index` 0, we only add the next button. For the last\
    \ element, we add the previous and submit buttons, for all the middle elements,\
    \ we add the previous and next buttons:\n\n```javascript\nstepsDiv.forEach((element,\
    \ index) => {\n  if (index === 0) {\n    element.innerHTML += nextButton;\n  }\
    \ else if (index === stepsDiv.length - 1) {\n    element.innerHTML += previousButton;\n\
    \    element.innerHTML += registerButton;\n  } else {\n    element.innerHTML +=\
    \ previousButton;\n    element.innerHTML += nextButton;\n  }\n});\n```\n\nTo check\
    \ if the element is the last step of the Wizard Form, we compare the `index` value\
    \ with the `stepsDiv.length - 1` value.\n\nTo add an element to existing elements,\
    \ we use the `+=` assignment operator.\n\nNow we can remove all `<button>` elements\
    \ from the HTML file. Run the Wizard Form in the browser again, and you’ll see\
    \ the buttons added using JavaScript.\n\nThe Wizard Form is finished. You can\
    \ check the completed application at [https://github.com/nathansebhastian/js-wizard-form/tree/main/complete](https://github.com/nathansebhastian/js-wizard-form/tree/main/complete)\n\
    \n## Summary\n\nCongratulations on finishing your first JavaScript project! The\
    \ Wizard Form application helps you learn the idea of using JavaScript to manipulate\
    \ what you see on the screen.\n\nAlthough a Wizard Form looks complex, it’s actually\
    \ pretty easy when you have the steps mechanism created using JavaScript.\n\n\
    Let’s recap what we’ve learned in this project:\n\n1.  How to select HTML elements\
    \ using `document.querySelector()` and `document.querySelectorAll()`\n2.  Show\
    \ and hide elements using CSS and JavaScript\n3.  Conditionally display HTML elements\
    \ using variables, `if` statements, and functions\n4.  An introduction to browser\
    \ events\n5.  Handling a form submit event with `addEventListener()`\n6.  Retrieve,\
    \ display, and reset form data with the event object\n7.  Add elements to specific\
    \ parts of the HTML document with the `innerHTML` property\n\nAnd the most important\
    \ thing is that you’ve seen how an application can be built step-by-step and gradually\
    \ becomes more complex.\n\nIn the next chapter, we’re going to learn how to use\
    \ JavaScript to send and receive data from a backend service. See you there.\n\
    \n## Chapter 13: Asynchronous JavaScript and Callbacks\n\nJavaScript is a non-blocking,\
    \ synchronous programming language.\n\nWhat does this even mean? It means that\
    \ JavaScript doesn’t wait until a code finished running before running the next\
    \ one (non-blocking)\n\nSynchronous means sequential, and we know this because\
    \ JavaScript runs code line by line from the top to the bottom.\n"
