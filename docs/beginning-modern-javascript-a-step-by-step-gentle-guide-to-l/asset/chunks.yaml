  trans: "\n你传递给参数填充的输入称为实参，以下是具体做法：\n\n`greet(\"Peter\");`\n\n调用 `greet()` 函数时，括号内的字符串\
    \ `'Peter'` 将作为 `name` 参数传递。\n\n运行代码将得到以下输出：\n\n```\nHello, Peter!\nNice weather\
    \ today, right?\n```\n\n定义函数时可以有多个参数，但需要用逗号分隔每个参数，如下所示：\n\n```\nfunction greet(name,\
    \ weather) {\n  console.log(`Hello, ${name}!`);\n  console.log(`It's ${weather}\
    \ today, right?`);\n}\n\ngreet(\"Nathan\", \"rainy\");\n```\n\n输出：\n\n```\nHello,\
    \ Nathan!\nIt's rainy today, right?\n```\n\n当你在函数头部指定两个参数时，需要传递两个实参。如果你调用函数时没有传递实参，那么值将是\
    \ `undefined`。\n\n在下一节中，你将学习如何创建带有默认值的参数，这样可以在不传递实参的情况下调用函数。\n\n但现在，我希望你能看到参数带来的便利。它们通过接受不同的输入值来覆盖函数可能遇到的各种场景，使函数更具适应性和可重用性。\n\
    \n如示例所示，`name` 和 `weather` 参数允许你向不同天气下的不同人打招呼。\n\n无论是晴天、雨天还是阴天，当你想要向另一个人打招呼时，只需更改\
    \ `name` 和 `weather` 实参即可。\n\n## 默认参数\n\n定义函数时，你可以为该函数中的任何参数设置默认值。\n\n例如，下面函数中的\
    \ `name` 参数就是一个默认参数：\n\n```\nfunction greet(name = \"Nathan\") {\n  console.log(`Hello,\
    \ ${name}!`);\n  console.log(\"Nice weather today, right?\");\n}\n```\n\n这里，当没有为\
    \ `name` 参数传递值或传递 `undefined` 时，将使用默认值 `'Nathan'`。\n\n你可以通过不带实参调用 `greet()` 函数来测试这一点，如下所示：\n\
    \n```\ngreet();\ngreet(\"Jack\");\n```\n\n输出：\n\n```\nHello, Nathan!\nNice weather\
    \ today, right?\nHello, Jack!\nNice weather today, right?\n```\n\n你定义的任何函数都可以混合使用默认参数和非默认参数。\n\
    \n下面是另一个函数的示例，它有一个名为 `name` 的默认参数和一个名为 `weather` 的非默认参数：\n\n```\nfunction greet(weather,\
    \ name = \"Nathan\") {\n  console.log(`Hello, ${name}!`);\n  console.log(`It's\
    \ ${weather} today, right?`);\n}\n\ngreet(\"sunny\");\n```\n\n输出：\n\n```\nHello,\
    \ Nathan!\nIt's sunny today, right?\n```\n\n注意，`weather` 参数被放在了 `name` 参数前面。这样做是为了方便，这样你就不需要指定默认参数了。\n\
    \n如果你将非默认参数放在默认参数之后，那么你需要先为 `name` 参数传递一个值，才能到达 `weather` 参数。\n\n考虑下面的例子：\n\n\
    ```\nfunction greet(name = \"Nathan\", weather) {\n  console.log(`Hello, ${name}!`);\n\
    \  console.log(`It's ${weather} today, right?`);\n}\n\ngreet(undefined, \"sunny\"\
    );\n```\n\n为了向 `weather` 参数传递实参，我们需要先为 `name` 参数传递 `undefined` 或任何值。\n\n这就是为什么最好将非默认参数放在默认参数前面。\n\
    \n## 默认参数与 null\n\n回顾第 2 节，我们简要探讨了 `undefined` 作为“默认”空值与 `null` 作为“有意”空值之间的区别。\n\
    \n当你向具有默认参数的函数传递 `undefined` 时，将使用默认参数：\n\n```\nfunction greet(name = \"John\"\
    ){\n  console.log(name);\n}\n\ngreet(undefined); // John\n```\n\n如你所见，当你向函数传递\
    \ `undefined` 时，JavaScript 会打印默认参数值 `John`。\n\n但是当你向函数传递 `null` 时，默认参数将被忽略：\n\n\
    ```\nfunction greet(name = \"John\"){\n  console.log(name);\n}\n\ngreet(null);\
    \ // null\n```\n\n这是初学者在学习 JavaScript 时常犯的错误之一。当你使用值 `null` 时，JavaScript 会认为你想要该值为空，因此不会用默认参数替换该值。\n\
    \n当你使用 `undefined` 时，JavaScript 会用默认参数替换它。在你的职业生涯中处理 JavaScript 代码时可能会遇到这个问题，所以请记住这一点。\n\
    \n## `return` 语句\n\n函数也可以在代码块中包含 `return` 语句。`return` 语句用于将值返回给调用者。\n\n例如，以下函数返回两个值的和：\n\
    \n```\nfunction sum(a, b) {\n  return a + b;\n}\n\nlet result = sum(3, 2);\nconsole.log(result);\
    \ // 5\n```\n\n函数返回的值可以赋值给变量，以便进一步操作。你可以在函数内部的任何位置添加 `return` 语句。\n\n当 JavaScript\
    \ 遇到 `return` 语句时，它会跳过函数块中后续编写的代码，并返回到调用函数的位置。\n\n以下函数包含两个 `return` 语句：\n\n```\n\
    function checkAge(age) {\n  if (age > 18) {\n    return \"You may get a car license\"\
    ;\n  }\n  return \"You may not get a car license yet\";\n}\n\nconsole.log(checkAge(20));\n\
    console.log(checkAge(15));\n```\n\n输出：\n\n```\nYou may get a car license\nYou\
    \ may not get a car license yet\n```\n\n当我们第一次调用 `checkAge()` 函数时，`age` 实参的值大于\
    \ 18，因此 JavaScript 执行了 `if` 块内的 `return` 语句。\n\n第二次调用该函数时，`if` 条件不满足，因此 JavaScript\
    \ 转而执行了 `if` 块下方的 `return` 语句。\n\n你也可以通过指定不带任何值的 `return` 语句来停止函数执行并返回调用者：\n\n\
    ```\nfunction greet() {\n  console.log(\"Hello!\");\n  return;\n  console.log(\"\
    Good bye!\");\n}\n\ngreet()\n```\n\n输出：\n\n```\nHello!\n```\n\n这里，`return` 语句在两个\
    \ `console.log()` 调用之间被调用。\n\nJavaScript 执行第一个 `console.log()` 调用，然后跳过其余代码。字符串\
    \ `'Good bye!'` 不会被打印。\n\n## 变量作用域\n\n既然你正在学习函数，那么现在是讨论变量作用域的好时机。\n\n在函数内部声明的变量只能从该函数内部访问。这是因为该变量具有局部作用域。\n\
    \n另一方面，在任何块外部声明的变量被称为全局变量，因为它具有全局作用域。\n\n这两个作用域很重要，因为当你尝试在其作用域之外访问局部变量时，会收到错误。例如：\n\
    \n```\nfunction greet() {\n  let myString = \"Hello World!\";\n}\n\ngreet();\n\
    console.log(myString);\n```\n\n当你运行上述代码时，JavaScript 会返回一个错误：\n\n```\nReferenceError:\
    \ myString is not defined\n```\n\n这是因为 `myString` 变量是在 `greet()` 函数内部声明的，所以你无法在函数外部访问它。即使你在访问变量之前调用了该函数，也无济于事。\n\
    \n同时，全局变量可以从任何地方访问，甚至在函数内部：\n\n```\nlet myString = \"Hello World!\";\n\nfunction\
    \ greet() {\n  console.log(myString);\n}\n\ngreet(); // Hello World!\n```\n\n\
    这里，`greet()` 函数能够访问在其外部声明的 `myString` 变量。\n\n请记住，这仅适用于使用 `let` 和 `const` 声明的变量。\n\
    \n接下来，你还可以定义一个与全局变量同名的局部变量，而不会覆盖它。\n\n示例如下：\n\n```\nlet myString = \"Hello World!\"\
    ;\n\nfunction greet() {\n  let myString = \"Morning!\";\n  console.log(myString);\n\
    }\n\ngreet();  // Morning!\nconsole.log(myString); // Hello World!\n```\n\n当你调用\
    \ `greet()` 函数时，一个名为 `myString` 的局部变量被赋值为字符串 `'Morning!'`。\n\n在函数外部，同样名为 `myString`\
    \ 的全局变量仍然存在，并且值没有改变。\n\nJavaScript 将局部作用域变量视为不同的变量。当你在函数内部声明同名变量时，函数内的任何代码都将始终引用局部变量。\n\
    \n在实践中，你很少需要在不同的作用域中声明相同的变量。\n"
