  trans: "\n对象项也称为属性，其中键为属性名，值为属性值。你可以将键/值对视为在对象中声明的变量。\n\n当需要向对象添加多个项时，需要使用逗号分隔每个项。要访问属性，可以使用点号（`.`）表示法，如下所示：\n\
    \n```\nconsole.log(myBook.title); // Beginning JavaScript\n```\n\n你可以将字符串或数字指定为项的键，也可以将任何类型的数据指定为值，包括数字和函数：\n\
    \n```\nlet myBook = {\n  title: \"Beginning JavaScript\",\n  author: \"Nathan\
    \ Sebhastian\",\n  price: 9.99,\n  describe: function () {\n    console.log(`Book\
    \ title: ${this.title}`);\n    console.log(`Book author: ${this.author}`);\n \
    \ },\n};\n\n// 调用函数\nmyBook.describe();\n```\n\n在上面的代码中，`describe` 键或属性是一个方法，用于打印对象中的标题和作者值。通过在方法名后添加括号来调用该方法。\n\
    \n`this` 关键字指的是代码的上下文，在本例中是 `myBook` 对象。\n\n通常，对象键用于为其所持有的值提供更多上下文。键也必须是唯一的，因此不能在同一个对象中两次使用相同的键。\n\
    \n例如，如果你有关于一本书的数据，你可以使用 `title`、`author` 和 `price` 等对象键来帮助你理解每个键中存储的值的上下文。\n\n\
    ## 为什么函数在对象内部被称为方法？\n\n你可能会想，如果方法只是对象中的一个函数，那么为什么还要用这个额外的术语呢？这似乎没有必要。\n\n这是因为“方法”这个术语立即暗示了存在一个该方法所属的对象。\n\
    \n当你调用像 `String()` 这样的函数时，你是在不指定拥有该函数的对象的情况下调用它：\n\n```\nString(7)\n```\n\n但是当你调用一个方法时，你需要指定从中调用该函数的对象。\n\
    \n例如，从 `myBook` 对象调用 `describe()` 方法时：\n\n```\nmyBook.describe();\n```\n\n“方法”这个术语为处理程序的人提供了更多信息，使你无需查看代码就能区分“函数”和“对象中的函数”。\n\
    \n属性也是如此。该术语用于区分“变量”和“对象中的变量”。\n\n## 如何访问对象值\n\n要访问对象的值，可以使用点号表示法 `.` 或方括号 `[]`\
    \ 表示法。\n\n以下是使用点号表示法访问对象属性的示例：\n\n```\nlet myBook = {\n  title: \"Beginning JavaScript\"\
    ,\n  author: \"Nathan Sebhastian\",\n};\n\nconsole.log(myBook.title);\nconsole.log(myBook.author);\n\
    ```\n\n以下是使用方括号访问相同属性的方法：\n\n```\nlet myBook = {\n  title: \"Beginning JavaScript\"\
    ,\n  author: \"Nathan Sebhastian\",\n};\n\nconsole.log(myBook[\"title\"]);\nconsole.log(myBook[\"\
    author\"]);\n```\n\n请记住，你需要将属性名用引号括起来，就像字符串一样，否则 JavaScript 会认为你在方括号内传递了一个变量。\n\
    \n## 如何向对象添加新属性\n\n你可以使用点号表示法或方括号向对象分配新属性，如下所示：\n\n```\nlet myBook = {\n  title:\
    \ \"Beginning JavaScript\",\n  author: \"Nathan Sebhastian\",\n};\n\n// 添加发布年份属性\n\
    myBook.year = 2023;\n\n// 添加出版商属性\nmyBook[\"publisher\"] = \"CodeWithNathan\"\
    ;\n\nconsole.log(myBook);\n```\n\n上面的 `console.log()` 将输出以下内容：\n\n```\n{\n  title:\
    \ 'Beginning JavaScript',\n  author: 'Nathan Sebhastian',\n  year: 2023,\n  publisher:\
    \ 'CodeWithNathan'\n}\n```\n\n你可以根据需要向同一个对象添加任意数量的属性。\n\n## 如何修改对象属性\n\n要修改现有属性，你需要使用点号或方括号表示法指定一个现有的对象属性，后跟赋值运算符，如下所示：\n\
    \n```\nlet myBook = {\n  title: \"Beginning JavaScript\",\n  author: \"Nathan\
    \ Sebhastian\",\n};\n\n// 更改作者属性\nmyBook.author = \"John Doe\";\n\nconsole.log(myBook);\n\
    ```\n\n输出：\n\n```\n{\n  title: 'Beginning JavaScript',\n  author: 'John Doe'\n\
    }\n```\n\n如你所见，`author` 属性的值已被更改。\n\n## 如何删除对象属性\n\n要从对象中删除属性，你需要使用 `delete` 运算符，如下所示：\n\
    \n```\nlet myBook = {\n  title: \"Beginning JavaScript\",\n  author: \"Nathan\
    \ Sebhastian\",\n};\n\ndelete myBook.author;\n\nconsole.log(myBook);\n```\n\n\
    输出：\n\n```\n{ title: 'Beginning JavaScript' }\n```\n\n当你尝试访问已删除的属性时，你将得到 `undefined`\
    \ 值。\n\n## 如何检查属性是否存在于对象中\n\n要检查某个属性是否存在于对象中，你可以使用 `in` 运算符，如下所示：\n\n```\npropertyName\
    \ in myObject\n```\n\n如果 `propertyName` 存在于你的对象中，`in` 运算符将返回 `true`。\n\n请参见下面的示例：\n\
    \n```\nlet person = {\n  firstName: \"Nathan\",\n  lastName: \"Sebhastian\"\n\
    }\n\n// 检查 firstName 是否存在\nconsole.log('firstName' in person); // true\n\n// 检查\
    \ age 是否存在\nconsole.log('age' in person); // false\n```\n\n## 总结\n\n在本章中，你学习了对象数据类型，这是一种特殊的数据类型，可以包含许多属性和方法。\n\
    \n对象在 JavaScript 中经常用于执行特定任务。你已经看到了其中一种形式：`console.log()`，我们通过它指示 JavaScript 在控制台中打印内容。\n\
    \n你还学习了如何添加、访问、删除和编辑对象的属性和方法。\n\n# 第 8 章 - 数组\n\n数组是一种特殊的对象，可用于保存多个值。数组可以是字符串、数字、布尔值、对象或它们的混合列表。\n\
    \n要创建数组，你需要使用方括号 `[]` 并用逗号分隔各项。\n\n以下是创建字符串列表的方法：\n\n```\nlet birds = ['Owl',\
    \ 'Eagle', 'Parrot', 'Falcon'];\n```\n\n你可以将数组视为一个项目列表，每个项目存储在一个储物柜隔间中：\n\n![8\
    \ 数组如同储物柜](img/image_rsrc2E3.jpg)\n\n图 5. 数组示意图\n\n你也可以声明一个没有任何值的空数组：\n\n```\n\
    let birds = [];\n```\n\n数组也可以包含混合值，如下所示：\n\n```\nlet mixedArray = ['Bird', true,\
    \ 10, 5.17]\n```\n\n上面的数组包含一个字符串、一个布尔值、一个整数和一个浮点数。\n\n## 数组索引位置\n\nJavaScript\
    \ 会记住数组中元素的位置。元素的位置也称为索引号。\n\n回到储物柜的例子，你可以将索引号视为储物柜编号。索引号从 0 开始，如下所示：\n\n![8 数组索引类比](img/image_rsrc2E4.jpg)\n\
    \n图 6. 数组索引示意图\n\n要访问或更改数组的值，你需要在数组名后添加方括号表示法 `[x]`，其中 `x` 是该元素的索引号。示例如下：\n\n\
    ```\n// 访问数组中的第一个元素\nmyArray[0];\n\n// 访问数组中的第二个元素\nmyArray[1];\n```\n\n假设你想从\
    \ `birds` 数组中打印字符串 `'Owl'`。你可以这样做：\n\n```\nlet birds = ['Owl', 'Eagle', 'Parrot',\
    \ 'Falcon'];\n\nconsole.log(birds[0]); // Owl\nconsole.log(birds[1]); // Eagle\n\
    ```\n\n就是这样。你需要输入数组的名称，后跟用方括号括起来的索引号。\n\n你也可以使用赋值运算符为特定索引分配新值。\n\n让我们将 `'Parrot'`\
    \ 替换为 `'Vulture'`：\n\n```\nlet birds = ['Owl', 'Eagle', 'Parrot', 'Falcon'];\n\
    \nbirds[2] = 'Vulture';\n\nconsole.log(birds);\n// ['Owl', 'Eagle', 'Vulture',\
    \ 'Falcon']\n```\n\n因为数组索引从零开始，所以值 `'Parrot'` 存储在索引 2 而不是 3。\n\n## 数组方法和属性\n\n\
    由于数组是一个对象，你可以调用 JavaScript 提供的方法和属性来操作数组值。\n\n要获取数组的大小，你可以访问 `length` 属性：\n\n\
    ```\nlet fishes = ['Salmon', 'Goldfish', 'Tuna'];\n\nconsole.log(fishes.length);\
    \ // 3\n```\n\n"
