    ## 第 2 章：JavaScript 变量


    在解释什么是变量之前，我希望你修改在 `script.js` 文件中编写的代码。


    将该文件中的代码修改如下：


    ```

    let message = "Learning JavaScript!"


    console.log(message)

    ```


    回到浏览器控制台，你会看到与直接在 `console.log()` 函数中写入 `''Learning JavaScript!''` 消息时相同的输出。这是为什么呢？


    这是因为上面代码中声明的 `message` 就是一个变量。


    在编程中，变量就是你赋予某个值的名称，以便以后可以访问该值。你可以把变量想象成一个可以贴到某个值上的标签，这样你就可以通过标签来引用该值。


    要声明一个变量，你需要输入关键字 `let`，后跟变量名。


    代码中的第一行告诉 JavaScript 将 `message` 变量与值 `''Learning JavaScript!''` 关联起来：


    ```

    let message = "Learning JavaScript!"

    ```


    在第二行中，JavaScript 被指示打印 `message` 的值，它也确实这样做了。


    你可以通过重新赋值来改变变量的值，如下所示：


    ```

    let message = "Learning JavaScript!"


    print(message)


    message = "Nice weather!"


    print(message)

    ```


    运行该文件，你会看到输出两行内容：


    ```

    Learning JavaScript!


    Nice weather!

    ```


    变量用于引用数据，这样你就可以在程序中多次使用相同的数据。


    接下来，让我们看看 JavaScript 中变量命名的一些规则。


    ### 变量命名


    JavaScript 有一些命名规则，你需要了解以避免命名错误。


    变量名只能包含字母、数字和下划线（`_`）。这意味着你可以将变量命名为 `message`、`message_1`、`message_2`。


    变量名的第一个字符不能是数字。`message_1` 是可以的，但 `1_message` 不行。


    你不能使用保留关键字，比如 `console`，因为它们被 JavaScript 用于执行某些操作。JavaScript 还有许多其他关键字，你将在后续章节中学习，例如
    `if`、`for` 和 `while`。


    变量名区分大小写，这意味着 `Message`、`MESSAGE` 和 `message` 可以用来创建三个不同的变量。当然，我不建议使用相似的名称，因为这会引起混淆。


    有时，你需要用多个单词来声明变量名。JavaScript 有两种全球通用的命名约定：


    1.  `camelCase`（驼峰命名法）


    2.  `snake_case`（蛇形命名法）


    驼峰命名法是一种将后续单词的首字母大写的命名约定。示例如下：


    ```

    let myAwesomeVariable

    ```


    蛇形命名法使用下划线来分隔单词。示例如下：


    ```

    let my_awesome_variable

    ```


    两种命名约定都是可接受的，但你应该在代码中坚持使用其中一种，以避免混淆。


    ### 常量变量


    有时你需要存储一个在程序运行期间不得更改的值。


    常量变量是指在程序运行期间其值不会改变的变量。在 JavaScript 中，常量变量使用 `const` 关键字声明。


    下面展示了如何在 JavaScript 中声明两个常量：


    ```

    const FILE_SIZE_LIMIT = 2000


    const MAX_SPEED = 300

    ```


    如果你尝试重新赋值一个常量变量，将会得到错误：


    ```

    const FILE_SIZE_LIMIT = 2000


    FILE_SIZE_LIMIT = 3000 // 错误！

    ```


    常量的命名约定是全部使用大写字母，尽管使用小写字母也可以。全大写的标准使得常量在阅读代码时更加突出。


    ### 总结


    在本章中，我们探讨了如何使用 `let` 和 `const` 关键字在 JavaScript 中创建变量。我们还学习了如何通过传递变量名来访问变量。


    学习如何使用变量来编写一个能按你意愿运行的程序，是作为程序员最重要的技能之一。


    但在你进一步学习如何使用变量之前，让我们先了解一下 JavaScript 中的数据类型。


    ## 第 3 章：基本数据类型


    数据类型只是编程语言中已知的不同类型数据的定义。


    数据类型包含了关于你能对该数据做什么和不能做什么的规范。


    为了给你一个友好的例子，我相信你同意 `2 + 2 = 4` 吧？


    嗯，JavaScript 也同意这一点：


    ```

    console.log(2 + 2);


    // 输出：4

    ```


    但是，如果你尝试将数字与字母相加，如下所示会发生什么？


    ```

    console.log(2 + "ABC");

    ```


    输出：


    ```

    2ABC

    ```


    将数字与字母相加会导致 JavaScript 将值连接或拼接在一起。将数字与字母相加不同于数字与数字相加，JavaScript 会查看数据类型以确定对该数据执行哪种操作。


    在本节中，你将学习 JavaScript 拥有的基本数据类型：


    | ▪ |

    | ▪ |

    | ▪ |

    | ▪ |

    | ▪ |


