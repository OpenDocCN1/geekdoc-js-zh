    ## Arithmetic Operators


    The arithmetic operators are used to perform mathematical operations like additions
    and subtractions.


    These operators are frequently used with number data types. Here’s an example:


    ```

    console.log(10 - 3); // 7

    console.log(2 + 4); // 6

    ```


    In total, there are 8 arithmetic operators in JavaScript:


    ```

    // 1. Addition (+)

    // Returns the sum between the two operands

    console.log(5 + 2); // 7


    // 2. Subtraction (-)

    // Returns the difference between the two operands

    console.log(5 - 2); // 3


    // 3. Multiplication (*) operator

    // Returns the multiplication between the two operands

    console.log(5 * 2); // 8


    // 4. Exponentiation (**) operator

    // Returns the value of the left operand raised to the power of the right operand

    console.log(5 ** 2); // 4


    // 5. Division operator

    // Returns the sum between the two operands

    console.log(5 / 2); // 4


    // 6. Remainder operator

    // Returns the remainder of the left operand after being divided by the right
    operand

    console.log(5 % 2); // 1

    ```


    These operators are pretty straightforward. As you’ve seen in the previous section,
    the `+` operator can also be used on strings data to merge multiple strings as
    one:


    ```

    let message = "Hello " + "human!";

    console.log(message); // Hello human!

    ```


    When you add a number and a string, JavaScript will perform a type coercion and
    treat the number value as a string value:


    ```

    let sum = "Hi " + 89;

    console.log(sum); // Hi 89

    ```


    Using any other arithmetic operator with strings will cause JavaScript to return
    a `NaN` value, which stands for Not a Number. The `NaN` is a number data type.


    ## The Assignment Operator


    The next operator to learn is the assignment operator and its variants, which
    is represented by the equals `=` sign.


    In JavaScript, the assignment operator is used to assign data or a value to a
    variable.


    You’ve seen some examples of using the assignment operator before, so here’s a
    reminder:


    ```

    // Assign the string value ''Hello'' to the ''message'' variable

    let message = "Hello";


    // Assign the Boolean value true to the ''on'' variable

    let on = true;

    ```


    You may’ve noticed that the equals sign has a slightly different meaning in programming
    than in math, and you’re correct!


    The assignment operator isn’t used to compare if a number equals another number
    in programming.


    If you want to do that kind of comparison, then you need to use the equal to `==`
    operator. We’ll learn more about comparison in the next section.


    Assignment operators can also be combined with arithmetic operators, so that you
    can add or subtract values from the left operand.


    There are 6 types of assignment operators available in JavaScript. Among these,
    only the standard assignment and the addition assignment are used frequently.
    The rest is nice to know.


    ### Standard Assignment Operator


    The assignment operator is used to assign one value to another:


    ```

    let x = 2

    let y = 1


    // Assign y to x

    x = y


    console.log(x); // 1

    ```


    ### Addition Assignment Operator


    The addition assignment is used to perform addition on the two operands, and assign
    the result to the left operand:


    ```

    let x = 2

    let y = 1


    x += y


    console.log(x); // 3

    ```


    This is a shorter way to write `x = x + y`.


    ### Subtraction Assignment Operator


    The subtraction assignment is used to perform subtraction on the two operands,
    and assign the result to the left operand:


    ```

    let x = 2

    let y = 1


    x -= y


    console.log(x); // 1

    ```


    This is a shorter way to write `x = x - y`.


    ### Multiplication Assignment Operator


    The multiplication assignment is used to perform multiplication on the two operands,
    then assign the result to the left operand:


    ```

    let x = 2

    let y = 2


    x *= y


    console.log(x); // 4

    ```


    This is a shorter way to write `x = x * y`.


    ### Division Assignment Operator


    The division assignment is used to perform division on the two operands, then
    assign the result to the left operand:


    ```

    let x = 5

    let y = 2


    x /= y


    console.log(x); // 2.5

    ```


    This is a shorter way to write `x = x / y`.


    ### Remainder Assignment Operator


    The remainder assignment is used to perform remainder on the two operands, then
    assign the result to the left operand:


    ```

    let x = 10

    let y = 3


    x %= y


    console.log(x); // 1

    ```


    This is a shorter way to write `x = x % y`.


    Next, we’re going to take a look at the comparison operators.


    ## The Comparison Operators


    Comparison operators are used to compare two values. The operators in this category
    will return Boolean values: either `true` or `false`.


    The following table shows all comparison operators available in JavaScript:


    | Name | Operation Example |

    | --- | --- |

    | Equal | `x == y` |

    | Not equal | `x != y` |

    | Strict equal | `x === y` |

    | Strict not equal | `x !== y` |

    | Greater than | `x > y` |

    | Greater than | `x > y` |

    | Greater than or equal | `x >= y` |

    | Less than | `x < y` |

    | Less than or equal | `x <= y` |


    Here are some examples of using these operators:


    ```

    console.log(9 == 9); // true

    console.log(9 != 20); // true

    console.log(2 > 10); // false

    console.log(2 < 10); // true

    console.log(5 >= 10); // false

    console.log(10 <= 10); // true

    ```


    The comparison operators can also be used to compare strings like this:


    ```

    console.log("ABC" == "ABC"); // true

    console.log("ABC" == "abc"); // false

    console.log("Z" == "A"); // false

    ```


    String comparisons are case-sensitive, as shown in the example above.


    JavaScript also has two versions of each comparison operator: loose and strict.


    In strict mode, JavaScript will compare the types without performing a type coercion.


    You need to add one more equal `=` symbol to the comparison as follows:


    ```

    console.log("9" == 9); // true

    console.log("9" === 9); // false

    console.log(true == 1); // true

    console.log(true === 1); // false

    ```


    You should use the strict comparison operators unless you have a specific reason
    not to.


    ## Logical Operators


    The logical operators are used to check whether one or more expressions result
    in either `true` or `false`.


    There are three logical operators that JavaScript has:


    1. `&&` AND operator - if any expression returns `false`, the result is `false`

    2. `||` OR operator - if any expression returns `true`, the result is `true`

    3. `!` NOT operator - negates the expression, returning the opposite.


    These operators can only return Boolean values. For example, you can determine
    whether ''7 is greater than 2'' and ''5 is greater than 4'':


    ```

    console.log(7 > 2 && 5 > 4); // true

    ```


    Let’s have a little exercise. Try to run these statements on your computer. Can
    you guess the results?


    ```

    console.log(true && false);

    console.log(false || false);

    console.log(!true);

    ```


    These logical operators will come in handy when you need to assert that a specific
    requirement is fulfilled in your code.


    ## The typeof Operator


    JavaScript allows you to check the data type by using the `typeof` operator. To
    use the operator, you need to call it before specifying the data:


    ```

    let x = 5;

    console.log(typeof x) //  ''number''

    console.log(typeof "Nathan") // ''string''

    console.log(typeof true) // ''boolean''

    ```


    The `typeof` operator returns the type of the data as a string. The `''number''`
    type represents both integer and float types, the `''string''` and `''boolean''`
    represent their respective types.


    ## Summary


    In this chapter, we’ve learned about the operators available in JavaScript. Of
    all these operators, only a select few are used frequently, while the rest will
    be used only in specific conditions.


    At first, it might be difficult to memorize the operator you need. The key to
    remembering the operators is practice. The more code you write, the more you internalize
    the operators. Just keep this chapter as a reference when you need to use operators
    later.


    ## Chapter 5: Control Flows


    Up until now, the JavaScript code you’ve written is executed line by line from
    top to bottom. But what if you want to run some lines of code only when a certain
    condition is met?


    A computer program usually needs to take into account many different conditions
    that can arise during the program’s execution.

