    When we call the function, we need to provide the callback functions, similar
    to how we need to chain the then() and catch() methods when accessing a promise:


    processMessage(


      value => console.log(value),


      reason => console.log(reason)


    );


    In the call to the processMessage above, the first argument is the resolveCallback()
    function, and the second argument is the rejectCallback() function.


    If you run the code above, then the resolveCallback() function will be called.
    You can change one of the two variables to false to trigger the rejectCallback()
    function.


    Now that we have a working callback example, let’s rewrite the code using a promise
    as follows:


    const isPhoneStore = true;


    const isPhoneAvailable = true;


    function processMessage() {


      return new Promise((resolve, reject) => {


        if (!isPhoneStore) {


          reject({


            name: ''Wrong store'',


            message: ''Sorry, this is a food store!'',


          });


        } else if (!isPhoneAvailable) {


          reject({


            name: ''Out of stock'',


            message: ''Sorry, the X phone is out of stock!'',


          });


        } else {


          resolve({


            name: ''OK'',


            message: ''The X phone is available! How many you want to buy?'',


          });


        }


      });


    }


    processMessage()


      .then(response => console.log(response))


      .catch(error => console.log(error));


    Here, you can see that the processMessage() function returns a Promise object
    that gets resolved only when both isPhoneStore and isPhoneAvailable are true.


    When one of the two variables is false, then the Promise object will be rejected.


    Here you can see that you don’t need to add two extra parameters to the processMessage()
    function just for the callbacks, and when calling the function, you also use the
    then() and catch() methods to handle the result of the promise.


    The use of a promise makes the code easier to understand. Here’s the comparison
