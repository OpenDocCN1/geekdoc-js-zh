    # Beginning Modern JavaScript


    A Step-By-Step Gentle Guide to Learn JavaScript for Beginners


    By Nathan Sebhastian


    ## Preface


    The goal of this book is to provide a gentle step-by-step instructions that will
    help you see how to develop web applications using JavaScript.


    Instead of covering all the theories and concepts of JavaScript, I’ll be teaching
    you only the most important building blocks of the language. We’ll cover things
    like variables, data types, arrays, functions, and objects before learning how
    to build and manipulate the web using JavaScript.


    After finishing this book, you will have a solid foundation in building a front-end
    application using JavaScript.


    ## Working Through This Book


    This book is broken down into 17 short chapters, where each chapter will focus
    on a specific aspect of JavaScript. The last few chapters will take all you’ve
    learned in the previous ones so that you can build a Wizard Form and a To-do List
    application using JavaScript, HTML, and CSS.


    I encourage you to write the code you see in this book and run them so that you
    have a sense of what web development with JavaScript looks like. You learn best
    when you code along with examples in this book.


    A tip to make the most of this book: Take at least a 10-minute break after finishing
    a chapter, so that you can regain your energy and focus.


    Also, don’t despair if some concept is hard to understand. Learning anything new
    is hard for the first time, especially something technical like programming. The
    most important thing is to keep going.


    ## Requirements


    No previous JavaScript programming knowledge is required as I will introduce JavaScript
    from the basics, but you should be somewhat familiar with HTML and CSS to make
    the most of this book.


    ## Contact


    If you need help, you can contact me at [nathan@codewithnathan.com](mailto:nathan@codewithnathan.com).


    You might also want to subscribe to my 7-day free email course called Mindset
    of the Successful Software Developer at [https://sebhastian.gumroad.com/l/mindset](https://sebhastian.gumroad.com/l/mindset)


    The email course would help you find the right path forward as a software developer.


    ## Chapter 1: Introduction


    ### What is JavaScript?


    JavaScript was created around April 1995 by a developer named Brendan Eich. At
    the time, he was working to develop a browser for a company called Netscape. He
    was told that he only had 10 days to design and code a working prototype of a
    programming language that could run on the browser.


    He needed to create a language that appealed to non-professional programmers who
    wanted to hack a website from scratch. The reason he was given only 10 days was
    that Netscape needed to release its browser, which at the time competed with Microsoft.

