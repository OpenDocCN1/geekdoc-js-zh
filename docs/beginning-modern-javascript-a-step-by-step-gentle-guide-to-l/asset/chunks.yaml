    ![16 todo list](OEBPS/image_rsrc2ER.jpg)


    To start building this application, we need to create a simple server that’s going
    to store our task data. To do so, we need to install Node.js.


    ## Installing Node.js


    Node.js is a JavaScript runtime application that enables you to run JavaScript
    outside of the browser. We need to install this application on our computer to
    create a simple server.


    You can download and install Node.js from [https://nodejs.org](https://nodejs.org).
    Pick the recommended LTS version because it has long-term support.


    ## Creating the Server and Database


    To set up this project, let’s create a new folder named `todo-list`. Open this
    folder in VSCode, then create a new file named `db.json` and put the following
    content in it:


    ```json

    { "tasks":  [ { "title":  "Learn Swimming", "completed":  true, "id":  1 }, {
    "title":  "Learn Cooking", "completed":  false, "id":  2 } ]  }

    ```


    This JSON file will serve as the database of our application. When we add a new
    task, this file will be updated.


    The next step is to run this JSON file as a server. To do so, you need to use
    Node Package Manager (or NPM for short) to install a json server.


    First, right-click on the `todo-list` folder and select the **Open in Integrated
    Terminal** option. This will open the terminal from which you can run some commands.


    The command I want you to run is `npm install -g json-server`. This command will
    install the `json-server` package globally on your computer.


    Once the installation is finished, you should see the following output:


    ![16 install json server](OEBPS/image_rsrc2ES.jpg)


    The next step is to run the `json-server` package. Run this command in your terminal:


    ```bash

    json-server db.json

    ```


    If you see the following output, it means the JSON server is running successfully:


    ![16 run json server](OEBPS/image_rsrc2ET.jpg)


    You can open the browser and access the URL at [http://localhost:3000/tasks](http://localhost:3000/tasks)
    to see the JSON data we created earlier.


    The To-do List application we’re going to create is going to access this API endpoint
    for fetching, adding, removing, and updating the tasks.


    You’ve created a simple server that exposes an API endpoint successfully. Nice
    work!


    ## Let’s Start the Project: HTML and CSS First


    The next step is to write the front-end part of the project. Open the `client`
    folder in VSCode, then create two files named `index.html` and `script.js`.


    Open the `index.html` file and write the standard HTML document structure just
    like when we create the Wizard Form:


    ```html

    <!DOCTYPE html>


    <html lang="en">


      <head>


        <meta charset="UTF-8" />


        <meta name="viewport" content="width=device-width, initial-scale=1.0" />


        <title>To-do List</title>


      </head>


      <body></body>


    </html>

    ```


    To focus our attention on the JavaScript part, we’re going to use Bootstrap to
    style our HTML tags. Bootstrap is a library containing pre-written CSS rules that
    you can apply to your project.


    To use Bootstrap styles, you just add specific classes to your HTML elements.
    Add Bootstrap to our project by creating a link that fetches the Bootstrap CSS
    from the CDN server as follows:


    ```html

    <title>To-do List</title>


    <link


      rel="stylesheet"


      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"


    />

    ```


    CDN stands for Content Delivery Network, and it’s a server that allows you to
    fetch popular libraries. By using a CDN, you don’t need to download the Bootstrap
    CSS file onto your computer and load it locally.


    The last step is to add the `script.js` file to the HTML file. As always, add
    the `defer` attribute so that the browser loads the script after the HTML document
    has been rendered:


    ```html

    <script src="script.js" defer></script>


    </head>

    ```


    Now we need to add some HTML to the `<body>` tag. First, write the container that’s
    going to contain all our HTML content. I’m going to add some comments to help
    you put the HTML in the right place:


    ```html

    <body>


      <div class="container m-5 rounded mx-auto bg-light shadow">


        <!-- App title section START-->


        <div class="row p-4">


          <div class="col">


            <h1 class="text-center">


              <u>My Todo List ✅</u>


            </h1>


          </div>


        </div>


        <!-- App title section END -->


      </div>


    </body>

    ```


    Under the ''App title section END'' comment, add an input and a button we’re going
    to use to create a task. The divs around the input and the button is created only
    to apply Bootstrap style:


    ```html

    <!-- Create task section START -->


    <div class="row p-3">


      <div class="col col-11 mx-auto">


        <div class="row bg-white rounded shadow-sm p-2">


          <div class="col">


            <input


              type="text"


              id="task-title"


              class="form-control border-0 rounded"


              placeholder="Enter the task here.."


            />


          </div>


          <div class="col-auto">


            <button type="button" class="btn btn-primary" onClick="addTask()">


              Add Task


            </button>


          </div>


        </div>


      </div>


    </div>


    <div class="my-2 mx-4 border-bottom"></div>


    <!-- Create task section END -->

    ```


    Next, we’re going to add the filter section under the ''Create task section''.
    This filter section will contain a select input:


    ```html

    <!-- Filter options section START -->


    <div class="row p-3 justify-content-end">


      <div class="col-auto d-flex align-items-center">


        <label class="text-secondary my-2 me-2">Filter</label>


        <select class="form-select form-select-sm" onChange="filterTasks(event)">


          <option value="all" selected>All</option>


          <option value="completed">Completed</option>


          <option value="active">Active</option>


        </select>


      </div>


    </div>


    <!-- Filter options section END -->

    ```


    The last step is to display the tasks. We’re going to use table element here:


    ```html

    <!-- Tasks list section START -->


