  trans: "\n\n为什么这很重要？让我给你看一个简单的例子。\n\nDOM 的 `window` 对象有一个名为 `setTimeout()` 的方法，你可以用它来在特定时间后运行一个函数。\n\
    \n该方法接受两个参数：\n\n1. 超时后要执行的函数\n2. 等待的时间（以毫秒为单位）\n\n例如，下面是如何等待 3 秒后执行一个控制台日志：\n\n\
    ```\nsetTimeout(function () {\n  console.log('Hello!');\n}, 3000);\n```\n\n从控制台运行上面的代码，3\
    \ 秒后，你应该会看到打印出 `'Hello!'` 字符串。\n\n现在，让我们在 `setTimeout()` 方法前后添加一些控制台日志，如下所示：\n\
    \n```\nconsole.log('Start');\nsetTimeout(function () {\n  console.log('Hello!');\n\
    }, 3000);\nconsole.log('End');\n```\n\n现在我们有了 `'Start'` 和 `'End'` 字符串，它们应该在 `setTimeout()`\
    \ 方法执行完毕前后被打印出来。\n\n当你运行上面的代码时，你会看到以下输出：\n\nimage::images/3-4-example-settimeout.png\n\
    \n惊喜！`'End'` 字符串竟然在 `'Hello!'` 字符串之前打印出来了。这是因为 JavaScript 的非阻塞特性。\n\nJavaScript\
    \ 的同步特性使其从上到下逐行读取代码。但由于它是非阻塞的，JavaScript 会执行 `setTimeout()` 方法，然后继续执行下一行代码。\n\n\
    这不是一个 bug。这是 JavaScript 的预期行为，因为它的设计方式就是这样。\n\n了解这一点很重要，因为当你在开发网站或应用程序时，有时你需要向服务器发送数据，并且需要等待响应才能继续执行代码。\n\
    \n为了让 JavaScript 等待某个特定操作完成，我们需要使用所谓的回调函数。\n\n## 回调函数详解\n\n回调函数就是一个作为参数传递给另一个函数的函数。当条件合适时，该函数会使用这个回调函数。\n\
    \n我们上面传递给 `setTimeout()` 方法的函数就是一个回调函数。同样，我们传递给 `addEventListener()` 方法的函数也是回调函数。\n\
    \n回到上面的例子，我们可以让 JavaScript 等待 `setTimeout()` 方法完成后再打印 `'End'` 字符串，方法是将控制台日志行移到\
    \ `'Hello!'` 下面，如下所示：\n\n```\nconsole.log('Start');\nsetTimeout(function () {\n\
    \  console.log('Hello!');\n  console.log('End!');\n}, 3000);\n```\n\n当然，我们可以这样做，因为我们是添加\
    \ `setTimeout()` 方法的人。\n\n如果我们把 `setTimeout()` 方法想象成一段我们无法触碰的代码，比如 `addEventListener()`\
    \ 方法，那么我们如何确保它在超时后执行某个指令呢？\n\n答案是使用回调，就像 `addEventListener()` 方法一样。在下面的例子中，假设你不能修改\
    \ `processData()` 函数的内容：\n\n```\nfunction processData(data, callbackFn) {\n  setTimeout(function\
    \ () {\n    console.log('Sending data back');\n    const response = {\n      data:\
    \ data + 'abc',\n    };\n    callbackFn(response);\n  }, 3000);\n}\n```\n\n这里，`processData()`\
    \ 函数接受两个参数：\n\n1. 要处理的 `data` 参数\n2. 处理完成后要执行的回调函数\n\n要从上面的函数获取响应，我们需要调用该函数并同时传递\
    \ `data` 和一个回调函数。\n\n具体做法如下：\n\n```\nprocessData('Nathan', function (response)\
    \ {\n  console.log(`Response given: ${response}`);\n});\n```\n\n这种回调模式不仅用于响应事件，也用于向另一台服务器发送数据。\n\
    \n我们无法预先知道服务器处理数据需要多长时间，因此我们放置一个回调函数，当响应准备好时执行它。\n\n## 总结\n\n在本章中，你了解到 JavaScript\
    \ 是一种不会停下来等待耗时函数完成的编程语言。当上一行代码尚未完成时，它会继续运行下一行代码。\n\n回调函数是一种让 JavaScript 以异步方式运行的方法。只有在前一个操作完成后，下一个操作才会开始。\n\
    \n## 第 14 章：Promise\n\n`Promise` 是在运行异步操作时处理 JavaScript 非阻塞特性的另一种方式。它是 2015 年发布的一个现代特性（也就是\
    \ JavaScript 首次发布 20 年后）。\n\n基本上，`Promise` 对象在最常见的意义上代表一个“待定状态”：这个承诺最终会在未来的某个时间点被兑现。\n\
    \n为了给你一个直观的说明，假设你想买一部新手机来替换旧手机，于是你打开一个消息应用联系一家手机店。这类似于你访问一个返回 promise 的变量或函数：\n\
    \n![14 access a promise](img/image_rsrc2EF.jpg)\n\n在你发送一条消息说明你的需求后，你收到一条自动回复，说客服代表会很快回复你的消息。这类似于收到一个\
    \ `Promise` 对象：\n\n![14 promise pending state](img/image_rsrc2EG.jpg)\n\n一分钟后，你收到一位真人客服代表的新消息，说你想买的手机型号有货。这时\
    \ `Promise` 被解决了（resolved）：\n\n![14 promise resolved](img/image_rsrc2EH.jpg)\n\
    \n或者，在完全不同的场景下，客服代表告诉你这家店不卖手机，因为这是一家食品店而不是手机店。这意味着 `Promise` 被拒绝了（rejected）：\n\
    \n![14 promise rejected](img/image_rsrc2EJ.jpg)\n\n这个说明展示了 JavaScript 中 `Promise`\
    \ 对象的工作原理：\n\n| ▪ |\n| ▪ |\n| ▪ |\n\n一个典型的 promise 实现如下所示：\n\n```\nlet p = new\
    \ Promise((resolve, reject) => {\n  let isTrue = true;\n  if (isTrue) {\n    resolve('Promise\
    \ resolved');\n  } else {\n    reject('Promise rejected');\n  }\n});\n```\n\n\
    当创建一个新的 `Promise` 对象时，我们需要传递一个回调函数，该函数会立即被调用，并带有两个参数：`resolve()` 和 `reject()`\
    \ 函数。\n\n根据 `Promise` 的结果，会调用 `resolve()` 或 `reject()` 函数来结束待定状态。\n\n要处理 `Promise`\
    \ 对象，你需要将函数调用与 `then()` 和 `catch()` 函数链式连接，如下所示：\n\n```\nlet p = new Promise((resolve,\
    \ reject) => {\n  let isTrue = true;\n  if (isTrue) {\n    resolve('Success');\n\
    \  } else {\n    reject('Error');\n  }\n});\n\np\n.then(message => console.log(`Promise\
    \ resolved: ${message}`))\n.catch(message => console.log(`Promise rejected: ${message}`));\n\
    ```\n\n`resolve()` 函数对应 `then()` 函数，而 `reject()` 对应 `catch()` 函数。你可以将 `isTrue`\
    \ 的值改为 `false` 来测试这一点。\n\n下面是 promise 过程的图示：\n\n![14 promise object](img/image_rsrc2EK.jpg)\n\
    \n使用 promise 模式，你可以通过将下一个过程放在 `then()` 方法中来顺序调用你的函数。\n\n## 回调 vs Promise\n\nPromise\
    \ 模式是为了取代回调的使用而创建的。通过使用 promise，我们编写的代码会更加直观且易于维护。\n\n回到消息说明的例子，让我们创建一个使用回调处理这种情况的示例。首先，我们声明这种情况所需的两个变量，称为\
    \ `isPhoneStore` 和 `isPhoneAvailable`：\n\n```\nconst isPhoneStore = true;\nconst\
    \ isPhoneAvailable = true;\n```\n\n接下来，我们编写一个处理传入消息的函数。这个函数将模拟 promise 模式，并且只有当\
    \ `isPhoneStore` 和 `isPhoneAvailable` 都为 true 时才会解决：\n\n```\nfunction processMessage(resolveCallback,\
    \ rejectCallback) {\n  if (!isPhoneStore) {\n    rejectCallback({\n      name:\
    \ 'Wrong store',\n      message: 'Sorry, this is a food store!',\n    });\n  }\
    \ else if (!isPhoneAvailable) {\n    rejectCallback({\n      name: 'Out of stock',\n\
    \      message: 'Sorry, the X phone is out of stock!',\n    });\n  } else {\n\
    \    resolveCallback({\n      name: 'OK',\n      message: 'The X phone is available!\
    \ How many you want to buy?',\n    });\n  }\n}\n```\n\n"
- fmt: "\n```\n    });\n\n  }\n\n}\n```\n\nHere, you can see that the function `processMessage`\
    \ accepts two callback functions: `resolveCallback` and `rejectCallback`.\n\n\
    When we call the function, we need to provide the callback functions, similar\
    \ to how we need to chain the `then()` and `catch()` methods when accessing a\
    \ promise:\n\n```\nprocessMessage(\n  value => console.log(value),\n  reason =>\
    \ console.log(reason)\n);\n```\n\nIn the call to the `processMessage` above, the\
    \ first argument is the `resolveCallback()` function, and the second argument\
    \ is the `rejectCallback()` function.\n\nIf you run the code above, then the `resolveCallback()`\
    \ function will be called. You can change one of the two variables to `false`\
    \ to trigger the `rejectCallback()` function.\n\nNow that we have a working callback\
    \ example, let’s rewrite the code using a promise as follows:\n\n```\nconst isPhoneStore\
    \ = true;\nconst isPhoneAvailable = true;\n\nfunction processMessage() {\n  return\
    \ new Promise((resolve, reject) => {\n    if (!isPhoneStore) {\n      reject({\n\
    \        name: 'Wrong store',\n        message: 'Sorry, this is a food store!',\n\
    \      });\n    } else if (!isPhoneAvailable) {\n      reject({\n        name:\
    \ 'Out of stock',\n        message: 'Sorry, the X phone is out of stock!',\n \
    \     });\n    } else {\n      resolve({\n        name: 'OK',\n        message:\
    \ 'The X phone is available! How many you want to buy?',\n      });\n    }\n \
    \ });\n}\n\nprocessMessage()\n  .then(response => console.log(response))\n  .catch(error\
    \ => console.log(error));\n```\n\nHere, you can see that the `processMessage()`\
    \ function returns a `Promise` object that gets resolved only when both `isPhoneStore`\
    \ and `isPhoneAvailable` are `true`.\n\nWhen one of the two variables is `false`,\
    \ then the `Promise` object will be rejected.\n\nHere you can see that you don’t\
    \ need to add two extra parameters to the `processMessage()` function just for\
    \ the callbacks, and when calling the function, you also use the `then()` and\
    \ `catch()` methods to handle the result of the promise.\n\nThe use of a promise\
    \ makes the code easier to understand. Here’s the comparison of the two side by\
    \ side:\n\n![14 callback vs promise](OEBPS/image_rsrc2EM.jpg)\n\n## Summary\n\n\
    In this chapter, you’ve learned how the `Promise` object works in JavaScript.\
    \ A promise is easy to understand when you realize the three states that can be\
    \ generated by the promise: pending, resolved, and rejected.\n\nWhen facing a\
    \ promise, you need to define what’s going to happen next inside the `.then()`\
    \ and `.catch()` methods\n\nYou’ve also learned how promises can be used to replace\
    \ callbacks.\n\n# Chapter 15: The Fetch API\n\nIn this chapter, we’re going to\
    \ learn about the Fetch API. But before we start, let’s quickly review what we\
    \ mean by API.\n\n## What is an API?\n\nAPI stands for Application Programming\
    \ Interface, but this fancy term doesn’t really tell you what an API is, so let\
    \ me explain it in simpler terms.\n\nAn API is simply a program that’s exposed\
    \ by the developer. The intention of exposing this program is so that other applications\
    \ can call and use the program to achieve a specific result.\n\nFor example, imagine\
    \ you’re going to a restaurant to have lunch. You don’t directly go to the kitchen\
    \ and prepare the food.\n\nInstead, you order food from the waiter, who takes\
    \ the order to the kitchen. In the kitchen, the chef will make the food, and when\
    \ it’s done, the waiter brings the food to your table.\n\nYou know nothing about\
    \ what’s happening in the kitchen. All you know is that you specify what you want\
    \ to the waiter, and the waiter takes care of the rest.\n\n![15 api illustration](OEBPS/image_rsrc2EN.jpg)\n\
    \nIn a similar way, an API serve as the gateway that you can access to achieve\
    \ a specific result. You don’t really know how the API works under the hood. All\
    \ you know is that you get what you wanted from the API.\n\nThere are two kinds\
    \ of APIs: the web API (also known as REST API), or library API.\n\nThe web API\
    \ is created by exposing certain endpoints that you can access to send and receive\
    \ data.\n\nThe library API is a piece of code written by other people. This code\
    \ usually has a bunch of objects, methods, and properties that you can access\
    \ to do something. You don’t need to know how they work under the hood.\n\nThe\
    \ `document` object exposed by the browser is an example of a library API, also\
    \ known as the DOM API. You don’t write the `document` object from scratch, and\
    \ when you call the `querySelector()` method, you don’t know exactly what code\
    \ is written in that method.\n\nThe Fetch API we’re going to learn next is also\
    \ a library API.\n\n## How Fetch API works\n\nThe Fetch API is a function that\
    \ you can use to send a request to any web API URL and get some response.\n\n\
    To send a GET request similar to that of an HTML form, you only need to pass the\
    \ URL where you want to send the data as an argument to the `fetch()` function:\n\
    \n```\nfetch('<Your URL>');\n```\n\nThe `fetch()` function accepts two parameters:\n\
    \n1.  The URL to send the request to\n2.  The options to set in the request. You\
    \ can set the request method to GET or POST here.\n\nUnder the hood, the `fetch()`\
    \ function returns a promise, so you need to add the `.then()` and `.catch()`\
    \ methods.\n\nWhen the request returns a response, the `then()` method will be\
    \ called. If the request returns an error, then the `catch()` method will be executed.\n\
    \nInside the `.then()` and `.catch()` methods, you pass a callback function to\
    \ execute when the respective methods are called. In the following example, we’re\
    \ going to hit a dummy URL located in `jsonplaceholder.typicode.com`:\n\n```\n\
    fetch('https://jsonplaceholder.typicode.com/todos/1')\n  .then(response => console.log(response))\n\
    \  .catch(error => console.log(error));\n```\n\nThe code above will give the following\
    \ response:\n\n![15 fetch response](OEBPS/image_rsrc2EP.jpg)\n\nHere, you can\
    \ see that the `body` property contains a `ReadableStream`. To use the `ReadableStream`\
    \ in our JavaScript application, we need to convert it to JSON format first, so\
    \ let’s do it:\n\n```\nfetch('https://jsonplaceholder.typicode.com/todos/1')\n\
    \  .then(response => response.json())\n  .then(data => console.log(data))\n```\n\
    \nThe `json()` method converts the `ReadableStream` into a JavaScript object.\
    \ The `data` variable above will be printed as follows:\n\n```\n{\n  userId: 1,\n\
    \  id: 1,\n  title: \"delectus aut autem\",\n  completed: false\n}\n```\n\nIf\
    \ you want to send a POST request instead of a GET request, pass an object containing\
    \ a `method` property as follows:\n\n```\nfetch('https://jsonplaceholder.typicode.com/todos',\
    \ {\n  method: 'POST',\n}).then(response => response.json())\n  .then(data =>\
    \ console.log(data))\n```\n\nWhen you send a POST method, you need to set the\
    \ request header and body properties to ensure a smooth process.\n\nFor the header,\
    \ you need to add the `Content-Type` property and set it to `application/json`.\
    \ The data you want to send should be put inside the `body` property in a JSON\
    \ format. See the example below:\n\n```\nfetch('https://jsonplaceholder.typicode.com/todos',\
