  raw: 'In the beginning, JavaScript was not as powerful as it is today, but an active
    community of JavaScript developers kept adding new features to the language.


    With the rise of internet-based companies like Google and Facebook, JavaScript
    began to grow to accommodate the ambitions of these giant internet companies.
    The language received contributions from software developers everywhere around
    the world.


    A great innovation happened to make JavaScript even more powerful in 2009\. A
    server-side environment named Node.js was released, allowing JavaScript to run
    on the server side like PHP, Java, Python, Ruby, and many more. It also enabled
    developers to create a full-stack web application using only JavaScript.


    Today, JavaScript is a language that is used virtually everywhere.


    ## Why Learn JavaScript?


    There are 4 good reasons why you need to learn JavaScript:


    1.  JavaScript is the only language that works in the browser


    2.  It’s fairly easy to learn (but hard to master)


    3.  It’s an essential language for making web applications


    4.  There are many career opportunities when you know how to work with JavaScript


    Learning JavaScript opens tremendous opportunities no matter what role you want
    to get into in the tech industry. You can be a frontend, backend, mobile, or full-stack
    developer by mastering JavaScript.


    ## Computer Setup


    To start programming with JavaScript, you only need two things:


    1.  A web browser


    2.  A code editor


    We’re going to use the Chrome browser to run our JavaScript code, so if you don’t
    have one, you can download it here:


    [https://www.google.com/chrome/](https://www.google.com/chrome/)


    The browser is available for all major operating systems. Once the download is
    complete, install the browser on your computer.


    Next, we need to install a code editor. There are several free code editors available
    on the Internet, such as Sublime Text, Visual Studio Code, and Notepad++.


    Out of these editors, my favorite is Visual Studio Code, because it’s fast and
    easy to use.


    ## Installing Visual Studio Code


    Visual Studio Code or VSCode for short is a code editor application created for
    the purpose of writing code. Aside from being free, VSCode is fast and available
    on all major operating systems.


    You can download Visual Studio Code here:


    [https://code.visualstudio.com/](https://code.visualstudio.com/)


    When you open the link above, there should be a button showing the version compatible
    with your operating system as shown below:


    ![1 installvscode](OEBPS/image_rsrc2DZ.jpg)


    Figure 1\. Install VSCode


    Click the button to download VSCode, and install it on your computer.


    Now that you have a code editor installed, the next step is to create your first
    JavaScript application.


    ## Your First JavaScript Application


    It’s time to run your first JavaScript program. First, create a folder on your
    computer that will be used to store all files related to this book. You can name
    the folder ''beginning_javascript''.


    Next, open the Visual Studio Code, and select File > Open Folder… from the menu
    bar. Select the folder you’ve just created earlier.


    VSCode will load the folder and display the content in the Explorer sidebar, it
    should be empty as we haven’t created any files yet.


    To create a file, right-click anywhere inside the VSCode window and select New
    Text File or New File… from the menu. Once the file is created, press Ctrl+S or
    Command+S to save the file. Name that file as index.html.


    The next step is to put some content in the HTML file. You can write the content
    below:


    <!DOCTYPE html>


    <html lang="en">


    <head>


        <meta charset="UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1.0">


        <title>Document</title>


        <script src="script.js" defer></script>


    </head>


    <body>


        <h1>Hello World!</h1>


    </body>


    </html>


    The HTML code above is just a standard template for a new HTML document, in which
    we set the document type with DOCTYPE and the language with lang.


    Inside the <head> tag, we defined basic information about this document, such
    as the character encoding with charset, the viewport and default zoom level to
    1.0, the title of the document, and the <script> tag to load a JavaScript file.


    Notice that the <script> tag above contains the defer attribute. This attribute
    is added to ensure that the script will be processed after the HTML document has
    been loaded by the browser.


    Inside the body tag, we just add a heading <h1> tag with the ''Hello World!''
    text.


    In your VSCode, you should see different parts of your code highlighted with different
    colors. This is a feature of the text editor called syntax highlighting, and it’s
    really useful to help you distinguish different parts of the code.


    Save the changes to the file, and the next step is to run this file using a local
    server.


    ## Install Live Server Extension


    VSCode extensions are small programs created to enhance the capability of VSCode.
    One extension that’s very useful is the Live Server extension, which allows developers
    to run a local server to test their code.


    We’re going to use the Live Server extension to run our HTML file. To install
    extensions, click the Extension icons that look like a puzzle of blocks or press
    Ctrl+Shift+X or Command+Shift+X.


    You should see the extension sidebar. At the top of the sidebar, type in ''live
    server'' and select the one that’s created by Ritwick Dey. See the picture below:


    ![1 install live server](OEBPS/image_rsrc2E0.jpg)


    Figure 2\. Install Live Server


    Explanation of the image above:


    1.  Click the Extensions icon in the Activity Bar


    2.  Search for ''live server'' and select the one created by Ritwick Dey


    3.  Install the extension


    Once installed, go back to the Explorer tab by clicking on the Files icon at the
    top of the Activity Bar.


    Here, you need to right-click on the index.html file and select Open with Live
    Server from the context menu.


    The Live Server should start a local server and open your browser automatically
    as follows:


    ![1 live server ok](OEBPS/image_rsrc2E1.jpg)


    Figure 3\. Live Server Running


    If you see the image above, congratulations! You now have a local server to help
    you develop your JavaScript application.


    ## Creating the JavaScript File


    Now that we have a local server running, the last thing we need is to create a
    JavaScript file and print something to the console to know that it’s working correctly.


    In your VSCode window, right-click on the Explorer sidebar and write a new file
    named script.js.


    Inside the file, write the following code:


    console.log(''Learning JavaScript!'');


    Live Server automatically reloads the browser when it detects any change in your
    files. Back to the browser, you need to open the browser console by pressing the
    Command+Option+J or Control+Shift+J


    You should see the words printed in the console as follows:


    ![1 open console](OEBPS/image_rsrc2E2.jpg)


    Figure 4\. Open Browser Console


    With this, you’ve completed your first JavaScript application. Well done!


    The console.log() is a keyword used to print output to the console. It consists
    of the console keyword, which is an object that gives access to the browser console.


    The log keyword is a method used to instruct JavaScript to print a message. By
    now, you must be wondering what is an object and a method.


    Don’t worry! We’re going to learn more about functions and objects later. For
    now, just remember that the console.log() keyword is used to print things to the
    console. This keyword will be used frequently in the coming chapters.


    ## Writing Comments


    In programming, comments are text we use to communicate the context of the code
    written in the file.


    To write a comment in JavaScript, you need to add two forward slashes // before
    the comment as shown below:


    // This is a comment


    // This is also a comment


    // Below print two lines of statements


    console.log("Hello World!");


    console.log("I''m learning JavaScript");'
