  raw: 'This is similar to how a human makes decisions in their life. For example,
    do you have money to cover the vacation to Japan? If yes, go. If not, then save
    more money!


    This is where control flow comes in. Control flow is a feature in a programming
    language that allows you to selectively run specific code based on the different
    conditions that may arise.


    Using control flows allows you to define multiple paths a program can take based
    on the conditions present in your program.


    There are two types of control flows commonly used in JavaScript: conditionals
    and loops.


    ## Conditional Flow


    The conditional flow statement is used to run a piece of code only under specific
    conditions.


    There are two ways you can create a conditional flow:


    1.  if…else statement


    2.  switch…case statement


    ## The if…else Statement


    The if statement allows you to create a program that runs only if a specific condition
    is met.


    The syntax for the if statement is as follows:


    if (condition) {


      // code to execute if condition is true


    }


    Let’s see an example. Suppose you want to go on a vacation that requires 5000
    dollars.


    Using the if statement, here’s how you check if you have enough balance:


    let balance = 7000;


    if (balance > 5000) {


      console.log("You have the money for this trip. Let''s go!");


    }


    Run the code above once, and you’ll see the string printed on the terminal.


    Now change the value of balance to 3000 and you’ll get no response.


    This happens because the code inside the if statement is only executed when the
    condition is true.


    After the if statement, you can write another line of code below it as follows:


    let balance = 7000;


    if (balance > 5000) {


      console.log("You have the money for this trip. Let''s go!");


    }


    console.log("The end!");


    The second console.log() call above will be executed no matter what value you
    assign to the balance variable.


    If you want it to execute only when the if condition is met, then put the line
    inside the curly brackets as well:


    let balance = 7000;


    if (balance > 5000) {


      console.log("You have the money for this trip. Let''s go!");


      console.log("The end!");


    }


    Next, suppose you need to run some code only when the if statement condition is
    not fulfilled.


    This is where the else statement comes in. See the following example:


    let balance = 7000;


    if (balance > 5000) {


      console.log("You have the money for this trip. Let''s go!");


    } else {


      console.log("Sorry, not enough money. Save more!");


    }


    console.log("The end!");


    Now change the value of balance to be less than 5000, and you’ll trigger the else
    block in the example.


    JavaScript also has the else if statement which allows you to write another condition
    to check should the previous if statement condition isn’t met.


    Consider the example below:


    let balance = 7000;


    if (balance > 5000) {


      console.log("You have the money for this trip. Let''s go!");


    } else if (balance > 3000) {


      console.log("You only have enough money for a staycation");


    } else {


      console.log("Sorry, not enough money. Save more!");


    }


    console.log("The end!");


    When the balance amount is less than 5000, the else if statement will check if
    the balance is more than 3000. If it does, then the program will proceed to recommend
    you do a staycation.


    You can write as many else if statements as you need, and each one will be executed
    only if the previous statement isn’t met.


    Together, the if..else..else if statements allow you to execute different blocks
    of code depending on the condition the program faces.


    ## The switch…case Statement


    The switch statement is a part of core JavaScript syntax that allows you to control
    the execution flow of your code.


    It’s often thought of as an alternative to the if..else statement that gives you
    more readable code, especially when you have many different conditions to assess.


    Here’s an example of a working switch statement. I will explain the code below:


    let age = 15;


    switch (age) {


      case 10:


        console.log("Age is 10");


        break;


      case 20:


        console.log("Age is 20");


        break;


      default:


        console.log("Age is neither 10 or 20");


    }


    First, you need to pass an expression to be evaluated by the switch statement
    into the parentheses. In the example, the age variable is passed as an argument
    for evaluation.


    Then, you need to write the case values that the switch statement will try to
    match with your expression. The case value is immediately followed by a colon
    (:) to mark the start of the case block:


    case "apple":


    Keep in mind the data type of the case value that you want to match with the expression.
    If you want to match a string, then you need to put a string. switch statements
    won’t perform type coercion when you have a number as the argument but put a string
    for the case:


    switch (1) {


      case "1":


        console.log("Hello World!");


        break;


    }


    The number expression doesn’t match the string case value, so JavaScript won’t
    log anything to the console.


    The same also happens for boolean values. The number 1 won’t be coerced as true
    and the number 0 won’t be coerced as false:


    switch (0) {


      case true:


        console.log("Hello True!");


        break;


      case false:


        console.log("Bonjour False!");


        break;


      default:


        console.log("No matching case");


    }


    ## The switch Statement Body


    The switch statement body is composed of three keywords:


    | ▪ |


    | ▪ |


    | ▪ |


    When your expression finds a matching case, JavaScript will execute the code following
    the case statement until it finds the break keyword. If you omit the break keyword,
    then the code execution will continue to the next block.


    Take a look at the following example:


    switch (0) {


      case 1:


        console.log("Value is one");


      case 0:


        console.log("Value is zero");


      default:


        console.log("No matching case");


    }


    When you execute the code above, JavaScript will print the following log:


    > "Value is zero"


    > "No matching case"


    This is because without the break keyword, switch will continue to evaluate the
    expression against the remaining cases even when a matching case is already found.


    Your switch evaluation may match more than one case, so the break keyword is commonly
    used to exit the process once a match is found.


