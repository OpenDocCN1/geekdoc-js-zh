    ## 算术运算符


    算术运算符用于执行加法和减法等数学运算。


    这些运算符经常与数字数据类型一起使用。下面是一个示例：


    ```

    console.log(10 - 3); // 7

    console.log(2 + 4); // 6

    ```


    JavaScript 中共有 8 个算术运算符：


    ```

    // 1. 加法（+）

    // 返回两个操作数的和

    console.log(5 + 2); // 7


    // 2. 减法（-）

    // 返回两个操作数的差

    console.log(5 - 2); // 3


    // 3. 乘法（*）运算符

    // 返回两个操作数的乘积

    console.log(5 * 2); // 8


    // 4. 幂运算（**）运算符

    // 返回左操作数的右操作数次幂的值

    console.log(5 ** 2); // 4


    // 5. 除法运算符

    // 返回两个操作数的商

    console.log(5 / 2); // 4


    // 6. 取余运算符

    // 返回左操作数除以右操作数后的余数

    console.log(5 % 2); // 1

    ```


    这些运算符相当直观。正如你在上一节中看到的，`+` 运算符也可以用于字符串数据，将多个字符串合并为一个：


    ```

    let message = "Hello " + "human!";

    console.log(message); // Hello human!

    ```


    当你将一个数字和一个字符串相加时，JavaScript 会执行类型强制转换，并将数字值视为字符串值：


    ```

    let sum = "Hi " + 89;

    console.log(sum); // Hi 89

    ```


    对字符串使用任何其他算术运算符都会导致 JavaScript 返回 `NaN` 值，它代表“非数字”（Not a Number）。`NaN` 是一种数字数据类型。


    ## 赋值运算符


    接下来要学习的运算符是赋值运算符及其变体，用等号 `=` 表示。


    在 JavaScript 中，赋值运算符用于将数据或值赋给变量。


    你之前已经见过一些使用赋值运算符的例子，这里再提醒一下：


    ```

    // 将字符串值 ''Hello'' 赋给 ''message'' 变量

    let message = "Hello";


    // 将布尔值 true 赋给 ''on'' 变量

    let on = true;

    ```


    你可能已经注意到，等号在编程中的含义与数学中略有不同，你说得没错！


    赋值运算符在编程中不用于比较一个数字是否等于另一个数字。


    如果你想进行这种比较，则需要使用等于 `==` 运算符。我们将在下一节中进一步了解比较。


    赋值运算符还可以与算术运算符结合使用，这样你就可以对左操作数进行加或减操作。


    JavaScript 中有 6 种赋值运算符。其中，只有标准赋值和加法赋值使用频繁，其余的了解即可。


    ### 标准赋值运算符


    赋值运算符用于将一个值赋给另一个值：


    ```

    let x = 2

    let y = 1


    // 将 y 赋给 x

    x = y


    console.log(x); // 1

    ```


    ### 加法赋值运算符


    加法赋值用于对两个操作数执行加法，并将结果赋给左操作数：


    ```

    let x = 2

    let y = 1


    x += y


    console.log(x); // 3

    ```


    这是 `x = x + y` 的简写形式。


    ### 减法赋值运算符


    减法赋值用于对两个操作数执行减法，并将结果赋给左操作数：


    ```

    let x = 2

    let y = 1


    x -= y


    console.log(x); // 1

    ```


    这是 `x = x - y` 的简写形式。


    ### 乘法赋值运算符


    乘法赋值用于对两个操作数执行乘法，然后将结果赋给左操作数：


    ```

    let x = 2

    let y = 2


    x *= y


    console.log(x); // 4

    ```


    这是 `x = x * y` 的简写形式。


    ### 除法赋值运算符


    除法赋值用于对两个操作数执行除法，然后将结果赋给左操作数：


    ```

    let x = 5

    let y = 2


    x /= y


    console.log(x); // 2.5

    ```


    这是 `x = x / y` 的简写形式。


    ### 取余赋值运算符


    取余赋值用于对两个操作数执行取余运算，然后将结果赋给左操作数：


    ```

    let x = 10

    let y = 3


    x %= y


    console.log(x); // 1

    ```


    这是 `x = x % y` 的简写形式。


    接下来，我们将看看比较运算符。


    ## 比较运算符


    比较运算符用于比较两个值。这类运算符会返回布尔值：`true` 或 `false`。


    下表列出了 JavaScript 中所有可用的比较运算符：


    | 名称 | 操作示例 |

    | --- | --- |

    | 等于 | `x == y` |

    | 不等于 | `x != y` |

    | 严格等于 | `x === y` |

    | 严格不等于 | `x !== y` |

    | 大于 | `x > y` |

    | 大于 | `x > y` |

    | 大于或等于 | `x >= y` |

    | 小于 | `x < y` |

    | 小于或等于 | `x <= y` |


    以下是使用这些运算符的一些示例：


    ```

    console.log(9 == 9); // true

    console.log(9 != 20); // true

    console.log(2 > 10); // false

    console.log(2 < 10); // true

    console.log(5 >= 10); // false

    console.log(10 <= 10); // true

    ```


    比较运算符也可以像这样用于比较字符串：


    ```

    console.log("ABC" == "ABC"); // true

    console.log("ABC" == "abc"); // false

    console.log("Z" == "A"); // false

    ```


    如上例所示，字符串比较区分大小写。


    JavaScript 还有每个比较运算符的两个版本：宽松和严格。


    在严格模式下，JavaScript 会比较类型而不执行类型强制转换。


    你需要在比较中多加一个等号 `=`，如下所示：


    ```

    console.log("9" == 9); // true

    console.log("9" === 9); // false

    console.log(true == 1); // true

    console.log(true === 1); // false

    ```


    除非你有特定的理由不这样做，否则应该使用严格比较运算符。


    ## 逻辑运算符


    逻辑运算符用于检查一个或多个表达式的结果是 `true` 还是 `false`。


    JavaScript 有三种逻辑运算符：


    1. `&&` 与运算符——如果任何表达式返回 `false`，则结果为 `false`

    2. `||` 或运算符——如果任何表达式返回 `true`，则结果为 `true`

    3. `!` 非运算符——对表达式取反，返回相反的结果。


    这些运算符只能返回布尔值。例如，你可以判断“7 大于 2”且“5 大于 4”是否成立：


    ```

    console.log(7 > 2 && 5 > 4); // true

    ```


    让我们做个小练习。试着在你的电脑上运行这些语句。你能猜出结果吗？


    ```

    console.log(true && false);

    console.log(false || false);

    console.log(!true);

    ```


    当你需要在代码中断言某个特定条件是否满足时，这些逻辑运算符会派上用场。


    ## typeof 运算符


    JavaScript 允许你使用 `typeof` 运算符检查数据类型。要使用该运算符，你需要在指定数据之前调用它：


    ```

    let x = 5;

    console.log(typeof x) //  ''number''

    console.log(typeof "Nathan") // ''string''

    console.log(typeof true) // ''boolean''

    ```


    `typeof` 运算符以字符串形式返回数据的类型。`''number''` 类型表示整数和浮点数类型，`''string''` 和 `''boolean''`
    分别表示各自的类型。


    ## 总结


    在本章中，我们学习了 JavaScript 中可用的运算符。在所有这些运算符中，只有少数几个经常使用，而其余的只在特定条件下使用。


    起初，记住你需要的运算符可能有些困难。记住运算符的关键在于练习。你写的代码越多，就越能内化这些运算符。当你以后需要使用运算符时，只需将本章作为参考即可。


    ## 第 5 章：控制流


    到目前为止，你编写的 JavaScript 代码都是从上到下逐行执行的。但是，如果你只想在满足某个条件时运行某些代码行，该怎么办呢？


    计算机程序通常需要考虑程序执行过程中可能出现的许多不同条件。


