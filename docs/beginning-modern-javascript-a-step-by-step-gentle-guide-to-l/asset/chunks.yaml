  trans: "\n我们将学习如何使用 JavaScript 来控制 Web 应用上显示的内容。\n\n我们要构建的应用是一个简单的向导表单（Wizard Form）。向导表单是一种多步骤表单，旨在简化长而复杂表单的填写过程。\n\
    \n通过每次只显示少量输入项，用户会更有动力填写空白输入，而不是感到不知所措，甚至可能放弃表单。\n\n向导表单包含三个步骤，如下图所示：\n\n![10\
    \ wizard form example](img/image_rsrc2EB.jpg)\n\n图 13. 向导表单演示\n\n点击“下一步”按钮，可以跳转到表单的其他部分。点击“提交”按钮时，会触发一个警告框，并显示你输入的内容：\n\
    \n![10 form alert](img/image_rsrc2EC.jpg)\n\n图 14. 向导表单警告框\n\n为了简单起见，表单的每一步只有一个输入项，并且你不需要验证数据。\n\
    \n根据上面的演示，你基本上需要将表单拆分为三个 `<div>` 元素，然后使用 JavaScript 一次只显示其中一个。让我们在下一节开始这个项目。\n\
    \n## 项目设置\n\n要开始这个项目，我们先创建一个新文件夹，将项目与我们之前编写的代码示例分开。\n\n将文件夹命名为 `wizard_form`，并创建三个文件，稍后我们会填充内容：`index.html`、`style.css`\
    \ 和 `script.js`。\n\n## 先编写 HTML 和 CSS\n\n在开始一个新项目时，我们首先要根据给定的规范编写 HTML 和 CSS。\n\
    \n在 VSCode 中打开 `index.html` 文件，并写入基本的 HTML 结构：\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\" />\n    <title>Document</title>\n\
    \  </head>\n  <body></body>\n</html>\n```\n\n接下来，按如下方式更新 `<head>` 标签：\n\n1.  将标题改为\
    \ JS Wizard Form\n2.  添加样式和脚本文件的链接\n\n结果应如下所示：\n\n```html\n<meta charset=\"UTF-8\"\
    \ />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    \ />\n<title>JS Wizard Form</title>\n<link rel=\"stylesheet\" href=\"style.css\"\
    \ />\n<script src=\"script.js\" defer></script>\n```\n\n下一步是编写 HTML 文档的 body 部分。如演示所示，有一个容器包含向导表单，因此在\
    \ body 中添加一个容器 `div`，如下所示：\n\n```html\n<body>\n  <div class='container'>\n   \
    \ <h1>The Wizard Form \U0001F9D9‍♂️</h1>\n    <p>\n      Step <span id='currentStep'>1</span>\n\
    \    </p>\n    <form id='wizard-form'></form>\n  </div>\n</body>\n```\n\n`<form>`\
    \ 标签作为容器 `div` 的子元素添加。现在，你需要创建向导表单的三个步骤。\n\n你可以将表单拆分为三个 `<div>` 标签：\n\n```html\n\
    <form id=\"wizard-form\">\n  <div id=\"step1\" class=\"step\">\n    <div class=\"\
    form-group\">\n      <label for=\"email\">Email address</label>\n      <input\n\
    \        class=\"form-control\"\n        name=\"email\"\n        type=\"text\"\
    \n        placeholder=\"Enter email\"\n      />\n    </div>\n  </div>\n  <div\
    \ id=\"step2\" class=\"step\">\n    <div class=\"form-group\">\n      <label for=\"\
    username\">Username</label>\n      <input\n        class=\"form-control\"\n  \
    \      name=\"username\"\n        type=\"text\"\n        placeholder=\"Enter username\"\
    \n      />\n    </div>\n  </div>\n  <div id=\"step3\" class=\"step\">\n    <div\
    \ class=\"form-group\">\n      <label for=\"password\">Password</label>\n    \
    \  <input\n        class=\"form-control\"\n        name=\"password\"\n       \
    \ type=\"password\"\n        placeholder=\"Enter password\"\n      />\n    </div>\n\
    \  </div>\n</form>\n```\n\n现在，如果你使用 Live Server 打开 HTML 文件，可以看到 HTML 骨架结构已经完成：\n\
    \n![10 wizard form bare html](img/image_rsrc2ED.jpg)\n\n是时候添加一些 CSS 来美化这个应用了。打开我们之前创建的\
    \ `style.css`，并将以下样式放入其中。下面我会简要解释这些规则：\n\n```css\nbody {\n  margin: 1rem;\n  font-family:\
    \ sans-serif;\n  background-color: #edceb0;\n}\n\n.container {\n  margin-left:\
    \ auto;\n  margin-right: auto;\n  background: #fff;\n  height: 424px;\n  width:\
    \ 338px;\n  padding: 71px 93px 0;\n  border-radius: 10px;\n  box-shadow: 0 2px\
    \ 7px 0 rgba(0, 0, 0, 0.1);\n}\n\nlabel {\n  display: inline-block;\n  margin-bottom:\
    \ 0.5rem;\n}\n\n.form-group {\n  margin-bottom: 1rem;\n}\n\n.form-control {\n\
    \  width: 100%;\n  padding: 0.375rem 0.75rem;\n  font-size: 1rem;\n  line-height:\
    \ 1.5;\n  color: #495057;\n  border: 1px solid #ced4da;\n  border-radius: 0.25rem;\n\
    \  box-sizing: border-box;\n}\n```\n\n`body` 样式用于为应用添加间距、字体族和背景色。`.container`\
    \ 样式用于美化包含表单的 `div`。`label`、`.form-group` 和 `.form-control` 用于让表单看起来更美观。\n\n你可以在浏览器中看到应用了样式后的效果：\n\
    \n![10 wizard form styled](img/image_rsrc2EE.jpg)\n\n第一步完成了。我们已经添加了文档所需的最基本的 HTML\
    \ 和 CSS。\n\n## 总结\n\n在本章中，我们通过编写 HTML 和 CSS 内容，为向导表单应用奠定了基础。\n\n`id` 和 `class`\
    \ 属性被添加到 HTML 元素中，以便在下一章中辅助样式化和 JavaScript 操作。\n\n如果你需要检查你的工作，可以获取本章使用的示例代码，地址为\
    \ [`github.com/nathansebhastian/js-wizard-form/tree/main/check-point-1`](https://github.com/nathansebhastian/js-wizard-form/tree/main/check-point-1)\n\
    \n# 第 11 章：向导表单机制\n\n在本章中，我们将使用 JavaScript 实现向导表单的机制。为此，我们将使用 DOM 提供的查询选择器方法。\n\
    \n## DOM 查询选择器方法\n\n文档对象模型提供了一组方法，允许你选择 HTML 节点中的特定元素。它们是 `querySelector()` 和\
    \ `querySelectorAll()` 方法。\n\n`querySelector()` 是 `document` 对象的一个 JavaScript\
    \ 方法，它允许你检索与传递给该方法的 CSS 选择器匹配的单个 `Element` 对象。\n\nCSS 选择器是你在针对特定元素进行样式化时使用的模式。以下是\
    \ CSS 选择器的示例：\n\n```css\n/* 选择所有 id 值为 box 的元素 */\n#box {\n}\n\n/* 选择所有 class\
    \ 值为 btn 的元素 */\n.btn {\n}\n```\n\n你需要传递给 `querySelector()` 方法的模式可以简单，也可以复杂，根据需要而定。\n\
    \n例如，以下是如何使用该方法检索具有 `id` 属性 `'box'` 的元素：\n\n```javascript\ndocument.querySelector('#box');\n\
    ```\n\n`querySelector()` 方法总是返回与查询匹配的第一个元素。该方法从 DOM 树的顶部到底部搜索元素。\n\n传递给 `querySelector()`\
    \ 方法的字符串参数遵循 CSS 选择器模式，其中类用句点 `.` 表示，id 用井号 `#` 表示。\n\n假设你的页面上有以下 HTML 元素：\n\n\
    ```html\n<body>\n  <h1>Query Selector</h1>\n  <h2>Learning Query selector method</h2>\n\
    \  <p id=\"opening\" class=\"bold\">Placeholder</p>\n</body>\n```\n\n你可以通过传递 `\"\
    p\"` 作为方法的参数来检索 `<p>` 元素：\n\n```javascript\nlet element = document.querySelector('p');\n\
    console.log(element);\n// <p id=\"opening\" class=\"bold\">Opening</p>\n```\n\n\
    或者你也可以传递 `id` 或 `class` 属性，它会返回相同的 `<p>` 元素：\n\n```javascript\ndocument.querySelector('.bold');\n\
    // <p id=\"opening\" class=\"bold\">Opening</p>\n\ndocument.querySelector('#opening');\n\
    // <p id=\"opening\" class=\"bold\">Opening</p>\n```\n\n当你传递一个返回两个元素的选择器时，该方法只会返回第一个元素。以下代码尝试获取\
    \ `<h1>` 和 `<h2>` 元素：\n\n```javascript\ndocument.querySelector('h1, h2');\n//\
    \ <h1>Query Selector</h1>\n```\n\n上面可以看到，该方法返回了第一个匹配项，即 `<h1>` 元素。\n\n这就是 `querySelector()`\
    \ 方法的工作原理。当你需要检索多个元素时，需要使用替代方法 `querySelectorAll()`。\n"
- fmt: "\n## `querySelectorAll()` Method\n\nThe `querySelectorAll()` method is a JavaScript\
    \ method from the DOM API that allows you to retrieve all elements that match\
    \ the CSS selector you passed as the argument.\n\nFor example, here’s how to use\
    \ the method to retrieve any element that has the class attribute of `box`:\n\n\
    ```\ndocument.querySelectorAll('.box');\n```\n\nThe string parameter passed to\
    \ the `querySelectorAll()` method follows the CSS selector pattern, where class\
    \ is represented by a period `.` and id is represented by a hash `#`.\n\nTo retrieve\
    \ all copies of a specific element, you can simply pass the name of the element\
    \ as its argument.\n\nSuppose you have the following HTML element on your page:\n\
    \n```\n<body>\n  <p id=\"opening\" class=\"bold\">Opening</p>\n  <p id=\"middle\"\
    >Middle</p>\n  <p id=\"closing\" class=\"bold\">Closing</p>\n</body>\n```\n\n\
    You can retrieve all `<p>` elements by passing `\"p\"` as the method’s argument:\n\
    \n```\nlet elements = document.querySelectorAll('p');\nconsole.log(elements);\n\
    // NodeList(3) [p#opening.bold, p#middle, p#closing.bold]\nconsole.log(elements[0]);\n\
    // <p id=\"opening\" class=\"bold\">Opening</p>\n```\n\nOr when you only need\
    \ the opening and the closing `<p>` elements, you can pass either the class or\
    \ the `id`s as the argument:\n\n```\ndocument.querySelectorAll('.bold');\n// [p#opening.bold,\
    \ p#closing.bold]\ndocument.querySelectorAll('#opening, #closing');\n// [p#opening.bold,\
    \ p#closing.bold]\n```\n\nYou can also select elements by other attributes like\
    \ `target` or `value`:\n\n```\n// return all elements with target=\"_blank\"\n\
    document.querySelectorAll('[target=_blank]');\n// return all elements with value=\"\
    red\"\ndocument.querySelectorAll('[value=red]');\n```\n\nThe return value of the\
    \ `querySelectorAll()` method will be an array-like object called `NodeList`.\n\
    \nTo access elements of the `NodeList` object, you can use the index position.\
    \ You can also use the `forEach()` method to iterate over the elements:\n\n```\n\
    let elements = document.querySelectorAll('p');\n// 1. Access element at index\
    \ 0\nconsole.log(element[0]);\n// 2. Iterate over the elements using forEach()\n\
    elements.forEach(function (element) {\n  console.log(element);\n  element.style.backgroundColor\
    \ = 'yellow';\n});\n```\n\nThe code above will log the current element inside\
    \ the loop and set its `background-color` value to `\"yellow\"`.\n\nThe `querySelectorAll()`\
    \ method always returns a `NodeList` object even when you only have one matching\
    \ element.\n\n## Hide Form Steps With CSS\n\nBack to the Wizard Form Application,\
    \ we need a way to show and hide the form steps using CSS and JavaScript. Add\
    \ the following rules in `style.css`:\n\n```\n.step {\n  display: none;\n}\n.step.active\
    \ {\n  display: block;\n}\n```\n\nThis causes all the `div` tags with the `step`\
    \ class to be hidden from display. To show the form step add the class `active`\
    \ to the `step1` div as follows:\n\n```\n<div id=\"step1\" class=\"step active\"\
    >\n  <div class=\"form-group\">...</div>\n</div>\n```\n\nGo back to the browser,\
    \ and you now see only the first step of the wizard form being displayed.\n\n\
    ## Adding the Next Button\n\nNow we need some buttons to move between the form\
    \ steps, so add the following button on `step1` div:\n\n```\n<div id=\"step1\"\
    \ class=\"step active\">\n  <div class=\"form-group\">...</div>\n  <button\n \
    \   type=\"button\"\n    class=\"btn btn-primary f-right\"\n    onclick=\"nextStep()\"\
    \n  >\n    Next\n  </button>\n</div>\n```\n\nIn this button, we add the `onclick`\
    \ attribute so that we can run JavaScript code when the button is clicked.\n\n\
    The name of the function we want to call is `nextStep()`, so let’s create that\
    \ function in our `script.js` file. We also need a `showStep()` function that\
    \ will:\n\n```\nlet currentStep = 1;\n\nfunction nextStep() {\n  if (currentStep\
    \ < 3) {\n    currentStep++;\n    document.querySelectorAll('.step').forEach(function\
    \ (element) {\n      element.classList.remove('active');\n    });\n    document.querySelector(`#step${currentStep}`).classList.add('active');\n\
    \    document.querySelector('#currentStep').textContent = currentStep;\n  }\n\
    }\n```\n\nIn the `script.js` file, we declared a variable named `currentStep`,\
    \ which is used to let us know in what step the form is currently in.\n\nIn the\
    \ `nextStep()` function, we used the `if` statement to check if the `currentStep`\
    \ is less than 3 because the form only has 3 steps.\n\nTo move to the next step,\
    \ we increment the `currentStep` value by one using the `++` operator, then we\
    \ use the `document.querySelectorAll()` method to select all elements containing\
    \ the `step` class. We remove the `active` class from all form steps.\n\nAfter\
    \ that, we select the current step and add the `active` class to the element using\
    \ the `classList.add()` method. The final task is to change the content of the\
    \ `currentStep` paragraph to the `currentStep`.\n\nOpen the wizard form in the\
    \ browser, and you should be able to navigate to step 3 using the next button.\
    \ But notice that you can’t go back to the previous step! This is what we’re going\
    \ to implement next.\n\n## Adding the Previous Button\n\nNow we need another button\
    \ to move to the previous step. On `step2` and `step3` div tags, you can add the\
    \ following buttons:\n\n```\n<div id='step2' class='step'>\n  <div class='form-group'>...</div>\n\
    \  <button type='button' class='btn btn-secondary' onclick='prevStep()'>\n   \
    \ Previous\n  </button>\n  <button type='button' class='btn btn-primary f-right'\
    \ onclick='nextStep()'>\n    Next\n  </button>\n</div>\n\n<div id=\"step3\" class=\"\
    step\">\n  <div class=\"form-group\">...</div>\n  <button type=\"button\" class=\"\
    btn btn-secondary\" onclick=\"prevStep()\">\n    Previous\n  </button>\n</div>\n\
    ```\n\nNext, we need to add a `prevStep()` function to the `script.js` file:\n\
    \n```\nfunction prevStep() {\n  if (currentStep > 1) {\n    currentStep--;\n \
    \   document.querySelectorAll('.step').forEach(function (element) {\n      element.classList.remove('active');\n\
    \    });\n    document.querySelector(`#step${currentStep}`).classList.add('active');\n\
    \    document.querySelector('#currentStep').textContent = currentStep;\n  }\n\
    }\n```\n\nThe `prevStep()` function is identical to the `nextStep()` function,\
    \ except for the `if` statement check and decrementing the `currentStep` part.\n\
    \nInstead of writing the same code in two different functions, we can create a\
    \ new function that runs the query selectors part. Let’s name this function `showStep()`.\n\
    \nYour `script.js` file should look as follows:\n\n```\nlet currentStep = 1;\n\
    \nfunction showStep() {\n  document.querySelectorAll('.step').forEach(function\
    \ (element) {\n    element.classList.remove('active');\n  });\n  document.querySelector(`#step${currentStep}`).classList.add('active');\n\
    \  document.querySelector('#currentStep').textContent = currentStep;\n}\n\nfunction\
    \ nextStep() {\n  if (currentStep < 3) {\n    currentStep++;\n    showStep();\n\
    \  }\n}\n\nfunction prevStep() {\n  if (currentStep > 1) {\n    currentStep--;\n\
    \    showStep();\n  }\n}\n```\n\nBack to the browser, now you can go to the next\
    \ and previous steps with the buttons. The last thing we need to do is to style\
    \ these buttons. Right now they look pretty bad:\n\n```\n.f-right {\n  float:\
    \ right !important;\n}\n\n.btn {\n  color: #fff;\n  cursor: pointer;\n  font-size:\
    \ 1rem;\n  line-height: 1.5;\n  border-radius: 0.25rem;\n  padding: 0.375rem 0.75rem;\n\
    \  border: 1px solid transparent;\n}\n\n.btn-next {\n  border-color: #007bff;\n\
    \  background-color: #007bff;\n}\n\n.btn-previous {\n  border-color: #6c757d;\n\
    \  background-color: #6c757d;\n}\n```\n\nThe `.f-right` style adds the `float`\
    \ property to the element to move it to the right, the `.btn` is used to style\
    \ the buttons.\n\nThe `.btn-next` and `.btn-previous` styles add border and background\
    \ colors to the respective elements.\n\nSo far so good. The final task is to add\
    \ the submit button and display the data collected by the form.\n\nIf you get\
    \ an error and would like to check your work, you can get the code used in this\
    \ chapter at [https://github.com/nathansebhastian/js-wizard-form/tree/main/check-point-2](https://github.com/nathansebhastian/js-wizard-form/tree/main/check-point-2)\n\
    \n## Chapter 12: Handling Wizard Form Submission\n\nTo finish the Wizard Form\
    \ application, we need to provide instructions on what to do when the form is\
    \ submitted.\n\n## Adding a Submit Button\n"
  raw: '## querySelectorAll() Method


    The querySelectorAll() method is a JavaScript method from the DOM API that allows
    you to retrieve all elements that match the CSS selector you passed as the argument.


    For example, here’s how to use the method to retrieve any element that has the
    class attribute of box:


    document.querySelectorAll(''.box'');


    The string parameter passed to the querySelectorAll() method follows the CSS selector
    pattern, where class is represented by a period . and id is represented by a hash
    #.


    To retrieve all copies of a specific element, you can simply pass the name of
    the element as its argument.


    Suppose you have the following HTML element on your page:


    <body>


      <p id="opening" class="bold">Opening</p>


      <p id="middle">Middle</p>


      <p id="closing" class="bold">Closing</p>


    </body>


    You can retrieve all <p> elements by passing "p" as the method’s argument:


    let elements = document.querySelectorAll(''p'');


    console.log(elements);


    // NodeList(3) [p#opening.bold, p#middle, p#closing.bold]


    console.log(elements[0]);


    // <p id="opening" class="bold">Opening</p>


    Or when you only need the opening and the closing <p> elements, you can pass either
    the class or the `id`s as the argument:


    document.querySelectorAll(''.bold'');


    // [p#opening.bold, p#closing.bold]


    document.querySelectorAll(''#opening, #closing'');


    // [p#opening.bold, p#closing.bold]


    You can also select elements by other attributes like target or value:


    // return all elements with target="_blank"


    document.querySelectorAll(''[target=_blank]'');


    // return all elements with value="red"


    document.querySelectorAll(''[value=red]'');


    The return value of the querySelectorAll() method will be an array-like object
    called NodeList.


    To access elements of the NodeList object, you can use the index position. You
    can also use the forEach() method to iterate over the elements:


    let elements = document.querySelectorAll(''p'');


    // 1\. Access element at index 0


    console.log(element[0]);


    // 2\. Iterate over the elements using forEach()


    elements.forEach(function (element) {


      console.log(element);


      element.style.backgroundColor = ''yellow'';


    });


    The code above will log the current element inside the loop and set its background-color
    value to "yellow";


    The querySelectorAll() method always returns a NodeList object even when you only
    have one matching element.


    ## Hide Form Steps With CSS


    Back to the Wizard Form Application, we need a way to show and hide the form steps
    using CSS and JavaScript. Add the following rules in style.css:


    .step {


      display: none;


    }


    .step.active {


      display: block;


    }


    This causes all the div tags with the step class to be hidden from display. To
    show the form step add the class active to the step1 div as follows:


    <div id="step1" class="step active">


      <div class="form-group">...</div>


    </div>


    Go back to the browser, and you now see only the first step of the wizard form
    being displayed.


    ## Adding the Next Button


    Now we need some buttons to move between the form steps, so add the following
    button on step1 div:


    <div id="step1" class="step active">


      <div class="form-group">...</div>


      <button


        type="button"


        class="btn btn-primary f-right"


        onclick="nextStep()"


      >


        Next


      </button>


    </div>


    In this button, we add the onclick attribute so that we can run JavaScript code
    when the button is clicked.


    The name of the function we want to call is nextStep(), so let’s create that function
    in our script.js file. We also need a showStep() function that will :


    let currentStep = 1;


    function nextStep() {


      if (currentStep < 3) {


        currentStep++;


        document.querySelectorAll(''.step'').forEach(function (element) {


          element.classList.remove(''active'');


        });


        document.querySelector(`#step${currentStep}`).classList.add(''active'');


        document.querySelector(''#currentStep'').textContent = currentStep;


      }


    }


    In the script.js file, we declared a variable named currentStep, which is used
    to let us know in what step the form is currently in.


    In the nextStep() function, we used the if statement to check if the currentStep
    is less than 3 because the form only has 3 steps.


    To move to the next step, we increment the currentStep value by one using the
    ++ operator, then we use the document.querySelectorAll() method to select all
    elements containing the step class. We remove the active class from all form steps.


    After that, we select the current step and add the active class to the element
    using the classList.add() method. The final task is to change the content of the
    currentStep paragraph to the currentStep.


    Open the wizard form in the browser, and you should be able to navigate to step
    3 using the next button. But notice that you can’t go back to the previous step!
    This is what we’re going to implement next.


    ## Adding the Previous Button


    Now we need another button to move to the previous step. On step2 and step3 div
    tags, you can add the following buttons:


    <div id=''step2'' class=''step''>


      <div class=''form-group''>...</div>


      <button type=''button'' class=''btn btn-secondary'' onclick=''prevStep()''>


        Previous


      </button>


      <button type=''button'' class=''btn btn-primary f-right'' onclick=''nextStep()''>


        Next


      </button>


    </div>


    <div id="step3" class="step">


      <div class="form-group">...</div>


      <button type="button" class="btn btn-secondary" onclick="prevStep()">


        Previous


      </button>


    </div>


    Next, we need to add a prevStep() function to the script.js file:


    function prevStep() {


      if (currentStep > 1) {


        currentStep--;


        document.querySelectorAll(''.step'').forEach(function (element) {


          element.classList.remove(''active'');


        });


        document.querySelector(`#step${currentStep}`).classList.add(''active'');


        document.querySelector(''#currentStep'').textContent = currentStep;


      }


    }


    The prevStep() function is identical to the nextStep() function, except for the
    if statement check and decrementing the currentStep part.


    Instead of writing the same code in two different functions, we can create a new
    function that runs the query selectors part. Let’s name this function showStep().


    Your script.js file should look as follows:


    let currentStep = 1;


    function showStep() {


      document.querySelectorAll(''.step'').forEach(function (element) {


        element.classList.remove(''active'');


      });


      document.querySelector(`#step${currentStep}`).classList.add(''active'');


      document.querySelector(''#currentStep'').textContent = currentStep;


    }


    function nextStep() {


      if (currentStep < 3) {


        currentStep++;


        showStep();


      }


    }


    function prevStep() {


      if (currentStep > 1) {


        currentStep--;


        showStep();


      }


    }


    Back to the browser, now you can go to the next and previous steps with the buttons.
    The last thing we need to do is to style these buttons. Right now they look pretty
    bad:


    .f-right {


      float: right !important;


    }


    .btn {


      color: #fff;


      cursor: pointer;


      font-size: 1rem;


      line-height: 1.5;


      border-radius: 0.25rem;


      padding: 0.375rem 0.75rem;


      border: 1px solid transparent;


    }


    .btn-next {


      border-color: #007bff;


      background-color: #007bff;


    }


    .btn-previous {


      border-color: #6c757d;


      background-color: #6c757d;


    }


    The .f-right style adds the float property to the element to move it to the right,
    the .btn is used to style the buttons.


    The .btn-next and .btn-previous styles add border and background colors to the
    respective elements.


    So far so good. The final task is to add the submit button and display the data
    collected by the form.


    If you get an error and would like to check your work, you can get the code used
    in this chapter at [https://github.com/nathansebhastian/js-wizard-form/tree/main/check-point-2](https://github.com/nathansebhastian/js-wizard-form/tree/main/check-point-2)


    Chapter 12: Handling Wizard Form Submission


    To finish the Wizard Form application, we need to provide instructions on what
    to do when the form is submitted.


