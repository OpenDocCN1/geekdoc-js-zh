  trans: "\n起初，JavaScript 并不像今天这样强大，但活跃的 JavaScript 开发者社区不断为这门语言添加新功能。\n\n随着谷歌和 Facebook\
    \ 等互联网公司的崛起，JavaScript 开始发展以满足这些互联网巨头的雄心。来自世界各地的软件开发者都为这门语言做出了贡献。\n\n2009 年，一项重大创新让\
    \ JavaScript 变得更加强大。一个名为 Node.js 的服务器端环境发布了，它允许 JavaScript 像 PHP、Java、Python、Ruby\
    \ 等语言一样在服务器端运行。它还使开发者能够仅使用 JavaScript 创建全栈 Web 应用程序。\n\n如今，JavaScript 几乎无处不在。\n\
    \n## 为什么要学习 JavaScript？\n\n你需要学习 JavaScript 的 4 个充分理由：\n\n1.  JavaScript 是唯一能在浏览器中运行的语言\n\
    2.  它相当容易学习（但难以精通）\n3.  它是制作 Web 应用程序的必备语言\n4.  掌握 JavaScript 后，会有很多职业机会\n\n无论你想在科技行业担任什么角色，学习\
    \ JavaScript 都会带来巨大的机遇。通过掌握 JavaScript，你可以成为前端、后端、移动端或全栈开发者。\n\n## 计算机设置\n\n要开始使用\
    \ JavaScript 编程，你只需要两样东西：\n\n1.  一个网页浏览器\n2.  一个代码编辑器\n\n我们将使用 Chrome 浏览器来运行 JavaScript\
    \ 代码，如果你还没有，可以在这里下载：\n\n[`www.google.com/chrome/`](https://www.google.com/chrome/)\n\
    \n该浏览器适用于所有主流操作系统。下载完成后，在你的计算机上安装浏览器。\n\n接下来，我们需要安装一个代码编辑器。互联网上有几个免费的代码编辑器，例如\
    \ Sublime Text、Visual Studio Code 和 Notepad++。\n\n在这些编辑器中，我最喜欢的是 Visual Studio\
    \ Code，因为它快速且易于使用。\n\n## 安装 Visual Studio Code\n\nVisual Studio Code（简称 VSCode）是一款为编写代码而创建的代码编辑器应用程序。除了免费之外，VSCode\
    \ 速度很快，并且适用于所有主流操作系统。\n\n你可以在这里下载 Visual Studio Code：\n\n[`code.visualstudio.com/`](https://code.visualstudio.com/)\n\
    \n当你打开上面的链接时，应该会有一个按钮显示与你的操作系统兼容的版本，如下所示：\n\n![安装 VSCode 第一步](img/image_rsrc2DZ.jpg)\n\
    \n图 1. 安装 VSCode\n\n点击按钮下载 VSCode，并在你的计算机上安装。\n\n现在你已经安装了代码编辑器，下一步是创建你的第一个 JavaScript\
    \ 应用程序。\n\n## 你的第一个 JavaScript 应用程序\n\n是时候运行你的第一个 JavaScript 程序了。首先，在你的计算机上创建一个文件夹，用于存储与本书相关的所有文件。你可以将文件夹命名为\
    \ `beginning_javascript`。\n\n接下来，打开 Visual Studio Code，从菜单栏中选择“文件”>“打开文件夹...”。选择你刚刚创建的文件夹。\n\
    \nVSCode 将加载该文件夹，并在资源管理器侧边栏中显示其内容，由于我们还没有创建任何文件，它应该是空的。\n\n要创建文件，请在 VSCode 窗口内的任意位置右键单击，然后从菜单中选择“新建文本文件”或“新建文件...”。创建文件后，按\
    \ Ctrl+S 或 Command+S 保存文件。将该文件命名为 `index.html`。\n\n下一步是在 HTML 文件中放入一些内容。你可以编写以下内容：\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Document</title>\n    <script src=\"script.js\" defer></script>\n\
    </head>\n<body>\n    <h1>Hello World!</h1>\n</body>\n</html>\n```\n\n上面的 HTML\
    \ 代码只是一个新 HTML 文档的标准模板，其中我们使用 `DOCTYPE` 设置了文档类型，使用 `lang` 设置了语言。\n\n在 `<head>`\
    \ 标签内，我们定义了该文档的基本信息，例如使用 `charset` 设置字符编码，使用 `viewport` 和默认缩放级别 1.0，文档标题，以及用于加载\
    \ JavaScript 文件的 `<script>` 标签。\n\n请注意，上面的 `<script>` 标签包含 `defer` 属性。添加此属性是为了确保脚本在浏览器加载\
    \ HTML 文档之后才被处理。\n\n在 body 标签内，我们只添加了一个带有 `Hello World!` 文本的标题 `<h1>` 标签。\n\n\
    在你的 VSCode 中，你应该会看到代码的不同部分以不同颜色高亮显示。这是文本编辑器的一个功能，称为语法高亮，它对于帮助你区分代码的不同部分非常有用。\n\
    \n保存对文件的更改，下一步是使用本地服务器运行此文件。\n\n## 安装 Live Server 扩展\n\nVSCode 扩展是为增强 VSCode 功能而创建的小程序。一个非常有用的扩展是\
    \ Live Server 扩展，它允许开发者运行本地服务器来测试他们的代码。\n\n我们将使用 Live Server 扩展来运行我们的 HTML 文件。要安装扩展，请单击看起来像拼图块的扩展图标，或按\
    \ Ctrl+Shift+X 或 Command+Shift+X。\n\n你应该会看到扩展侧边栏。在侧边栏顶部，输入 `live server`，然后选择由\
    \ Ritwick Dey 创建的那个。请看下图：\n\n![安装 Live Server](img/image_rsrc2E0.jpg)\n\n图 2.\
    \ 安装 Live Server\n\n上图说明：\n\n1.  单击活动栏中的扩展图标\n2.  搜索 `live server` 并选择由 Ritwick\
    \ Dey 创建的那个\n3.  安装扩展\n\n安装完成后，通过单击活动栏顶部的文件图标返回到资源管理器选项卡。\n\n在这里，你需要右键单击 `index.html`\
    \ 文件，然后从上下文菜单中选择“Open with Live Server”。\n\nLive Server 应该会启动一个本地服务器，并自动打开你的浏览器，如下所示：\n\
    \n![Live Server 运行中](img/image_rsrc2E1.jpg)\n\n图 3. Live Server 运行中\n\n如果你看到上图，恭喜你！你现在有了一个本地服务器来帮助你开发\
    \ JavaScript 应用程序。\n\n## 创建 JavaScript 文件\n\n现在我们已经有了一个正在运行的本地服务器，最后需要做的是创建一个\
    \ JavaScript 文件，并向控制台打印一些内容，以确认它正常工作。\n\n在你的 VSCode 窗口中，右键单击资源管理器侧边栏，并创建一个名为 `script.js`\
    \ 的新文件。\n\n在该文件中，编写以下代码：\n\n```\nconsole.log('Learning JavaScript!');\n```\n\n\
    Live Server 在检测到文件有任何更改时会自动重新加载浏览器。回到浏览器，你需要按 Command+Option+J 或 Control+Shift+J\
    \ 打开浏览器控制台。\n\n你应该会在控制台中看到打印出的文字，如下所示：\n\n![打开浏览器控制台](img/image_rsrc2E2.jpg)\n\
    \n图 4. 打开浏览器控制台\n\n至此，你已经完成了第一个 JavaScript 应用程序。干得好！\n\n`console.log()` 是一个用于向控制台打印输出的关键字。它由\
    \ `console` 关键字组成，该关键字是一个提供对浏览器控制台访问的对象。\n\n`log` 关键字是一个方法，用于指示 JavaScript 打印一条消息。现在，你一定在想什么是对象和方法。\n\
    \n别担心！我们稍后会学习更多关于函数和对象的知识。现在，只需记住 `console.log()` 关键字用于向控制台打印内容。这个关键字将在接下来的章节中频繁使用。\n\
    \n## 编写注释\n\n在编程中，注释是我们用来传达文件中代码上下文的文本。\n\n要在 JavaScript 中编写注释，你需要在注释前添加两个正斜杠\
    \ `//`，如下所示：\n\n```\n// This is a comment\n// This is also a comment\n// Below\
    \ print two lines of statements\nconsole.log(\"Hello World!\");\nconsole.log(\"\
    I'm learning JavaScript\");\n```\n"
- fmt: '

    Comments are ignored by the language processor, so you can use comments to disable
    some code without having to delete that code.


    The code below shows how to disable the second print statement:


    ```

    console.log("Hello World!");


    // console.log("I''m learning JavaScript");

    ```


    ## Summary


    In this chapter, we’ve explored the origins of JavaScript, installed the required
    tools to code in JavaScript, and run our first JavaScript application.


    We’ve also learned how to write comments in our JavaScript file. In the next chapter,
    we’re going to learn about variables.


    ## Chapter 2: JavaScript Variables


    Before explaining what a variable is, I want you to change the code you’ve written
    in the `script.js` file.


    Change the code in that file as follows:


    ```

    let message = "Learning JavaScript!"


    console.log(message)

    ```


    Go back to the browser console, and you’ll see the same output as when you write
    the `''Learning JavaScript!''` message directly inside the `console.log()` function.
    How can this be?


    This is because the `message` declared in the code above is a variable.


    In programming, a variable is simply a name that you give to a value so that you
    can access that value later. You can think of a variable as a label that can be
    tagged to a certain value, so you can refer to the value using the label.


    To declare a variable, you need to type the keyword `let` followed by the variable
    name.


    The first line in the code tells JavaScript to associate the `message` variable
    with the value `''Learning JavaScript!''`:


    ```

    let message = "Learning JavaScript!"

    ```


    In the second line, JavaScript is instructed to print the value of `message`,
    and that’s exactly what it does.


    You can change the value of your variable by re-assigning another value as follows:


    ```

    let message = "Learning JavaScript!"


    print(message)


    message = "Nice weather!"


    print(message)

    ```


    Run the file and you’ll see two lines printed as the output:


    ```

    Learning JavaScript!


    Nice weather!

    ```


    Variables are used to reference data so that you can use the same data multiple
    times in your program.


    Next, let’s see some rules for naming variables in JavaScript.


    ### Variable Naming


    JavaScript has a few naming rules that you need to know to avoid naming errors.


    Variable names can only contain alphabet letters, numbers, and underscores (`_`).
    This means you can name your variable `message`, `message_1`, `message_2`.


    The first character of the variable name must not be a number. `message_1` is
    okay. `1_message` is not.


    You can’t use reserved keywords such as `console` because they are used by JavaScript
    to do certain things. There are many other keywords used by JavaScript that you’ll
    learn in the following sections such as `if`, `for`, and `while`.


    Variable names are case-sensitive, which means `Message`, `MESSAGE`, and `message`
    can be used to create three different variables. But of course, I don’t recommend
    using similar names as it causes confusion.


    Sometimes, you need more than one word to declare a variable name. JavaScript
    has two naming conventions that are used worldwide:


    1.  `camelCase`


    2.  `snake_case`


    Camel case is a naming convention that uses an uppercase letter for the first
    character for subsequent words. Here’s an example:


    ```

    let myAwesomeVariable

    ```


    The snake case naming convention uses an underscore to separate words. Here’s
    an example:


    ```

    let my_awesome_variable

    ```


    Both are acceptable naming conventions, but you should stick to one of them in
    your code to avoid confusion.


    ### Constant Variables


    There are times when you need to store a value that must not be changed in a variable.


    A constant variable is a variable that doesn’t change its value as long as the
    program is running. In JavaScript, a constant variable is declared using the `const`
    keyword.


