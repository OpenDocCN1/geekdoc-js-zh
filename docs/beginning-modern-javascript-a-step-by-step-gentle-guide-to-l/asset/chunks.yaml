    Chapter 9 - The Document Object Model (DOM) Introduction


    Before we dive into the lesson, let’s recap what we know about the web browser
    and HTML documents.


    When we want to build a web page, we create an HTML document filled with HTML,
    CSS, and JavaScript.


    These three technologies are used together like a team, each playing a different
    role to build what we see in our web browser.


    HTML is a markup language used to define the structure and content of the page.
    The tags we used like <head>, <body>, and <button> have meanings, and the browser
    will process these tags, rendering the content of the document to the screen


    ![9 just html](OEBPS/image_rsrc2E5.jpg)


    Figure 7\. HTML Only Website


    But the HTML alone produces a very boring and generic-looking page. CSS was created
    to enable people to change the way the HTML tags are represented on the browser.


    By using CSS, you can make a button displayed in a color of your choice, or a
    text input box with a rounded border, making them more appealing and modern.


    ![9 html and css](OEBPS/image_rsrc2E6.jpg)


    Figure 8\. A Website Styled With CSS


    HTML and CSS were great partners, but even then, a web page is still just a passive
    thing. Once the browser process the content and render it, you can’t edit the
    page in any way.


    You can’t change the background and text color of the page (the dark mode, for
    example) you can’t create cool animations, turn on the microphone or webcam, and
    retrieve data from another website to display on the page after a click.


    JavaScript is the programming language that’s supported by the browser, and it
    fills the gap left open by HTML and CSS.


    In short, JavaScript breathes life into static websites, turning them dynamic.
    It allows a website to interact with the user, respond to their actions, and dynamically
    update the content without requiring a page reload.


    ## The DOM Explained


    So how come JavaScript can do things that HTML and CSS can’t do? Well, the answer
    is that JavaScript has the ability to manipulate the Document Object Model, or
    the DOM for short.


    The DOM is a hierarchical structure composed of objects that make up a web page.
    Web browsers then expose this DOM so that you can change the page structure, style,
    and content using JavaScript.


    For example, suppose you have the following HTML content in your document:


    <!DOCTYPE html>


    <html lang="en">


    <head>


      <meta charset="UTF-8">


      <meta name="viewport" content="width=device-width, initial-scale=1.0">


      <title>Document</title>


    </head>


    <body>


      <h1>Hello World!</h1>


      <p>This is a paragraph element</p>


    </body>


    </html>


    The DOM graph generated by the HTML document above is as follows. I’m going to
    explain what the graph means below:


    ![9 dom example](OEBPS/image_rsrc2E7.jpg)


    Figure 9\. Example DOM Graph


    The DOM looks like a tree structure with a set of connected nodes. These nodes
    are objects that you can access using JavaScript. The html node and its children
    are the content of your document.


    For now, let’s focus on the window and document objects.


    ## The Window Object


    The window object is the root of the DOM tree, and this object is used to instruct
    the browser to do tasks like:


    | ▪ |


    | ▪ |


    | ▪ |


    | ▪ |


    You can access the window object from the Console by typing window and press Enter.
    The browser would respond by showing you the methods and properties of the object
    as follows:


    ![9 window](OEBPS/image_rsrc2E8.jpg)


    Figure 10\. Window Object Properties and Methods


    The window object provides both child objects and methods that you’re going to
    access to manipulate a web page.


    For example, the window has the console object that you can use to log a message
    to the console.


    Type the code below to the console and hit Enter:


    window.console.log(''Hello World!'');


    You’ll see the string ''Hello World!'' logged to the console.


    The window object is a global object, so you can omit it when calling its child
    object. To access the console object, just type console as follows:


    console.log(''Hello World!'');


    The same goes for when you access the document object. You can write document.propertyOrMethod
    instead of window.document.propertyOrMethod.


    I won’t go too deep on the window object, because as a web developer, you’re going
    to interact more with the document object in your daily routine.


    ## The Document Object


    The document object is the entry point for all HTML elements that you write in
    your document. This object is also what gives the Document Object Model its name.


    It’s not called the Window Object Model because we’re mostly going to work with
    the Document object instead of the Window object.


    ![9 dom example html](OEBPS/image_rsrc2E9.jpg)


    Figure 11\. Document Object Model


    From the document object you can retrieve any data related to the HTML content
    using JavaScript. You can get the Document title using the document.title property,
    and the URL using document.URL. The referrer is available in document.referrer,
    the domain in document.domain.


    From the document object you can get the body and head nodes:


    document.documentElement: the whole HTML Element node document.body: the body
    Element node document.head: the head Element node


    You can try to access these from the console as shown below:


    ![9 document properties](OEBPS/image_rsrc2EA.jpg)


    Figure 12\. Document Properties


    You can see the documentation of all the properties and methods of the document
    object at [https://developer.mozilla.org/en-US/docs/Web/API/Document](https://developer.mozilla.org/en-US/docs/Web/API/Document)
    (note that it might be overwhelming at first)


    Of course, you can do much more than just read your Document data. In the next
    chapter, we’re going to start a project to practice manipulating the DOM.


    ## Summary


    The DOM is a tree-like structure generated from the HTML file that we created
    and loaded into the browser.


    The browser then exposes this DOM as a set of JavaScript objects that we can access,
    such as the window and document objects.


    It’s an important piece of technology that allows you to program the web browser
    to do specific tasks.


