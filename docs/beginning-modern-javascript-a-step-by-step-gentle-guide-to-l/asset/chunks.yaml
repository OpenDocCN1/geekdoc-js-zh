    ## Loop Flow


    As you program an application in JavaScript, you’ll often need to write a piece
    of code that needs to be executed repeatedly.


    Let’s say you want to write a program that prints the numbers 1 to 10 in the console.
    You can do it by calling `console.log` 10 times like this:


    ```javascript

    console.log(1);

    console.log(2);

    console.log(3);

    console.log(4);

    console.log(5);

    // and so on..

    ```


    This works, but there’s a better way to write this kind of repetitive task.


    A loop statement is another type of control flow statement used to execute a block
    of code multiple times until a certain condition is met.


    There are two loop statements used in JavaScript:


    - | ▪ |

    - | ▪ |


    Let’s learn how to use these statements in practice.


    ## The for Statement


    Instead of repeating yourself 10 times to print the numbers 1 to 10, you can use
    the for statement and write just a single line of code as follows:


    ```javascript

    for (let x = 0; x < 10; x++) {

      console.log(x);

    }

    ```


    There you go! The for statement is followed by parentheses (()) which contain
    3 expressions:


    - | ▪ |

    - | ▪ |

    - | ▪ |


    These expressions are separated by a semicolon (;)


    After the expressions, the curly brackets ({}) will be used to create a code block
    that will be executed by JavaScript as long as the `condition` expression returns
    true.


    You can identify which expression is which by paying attention to the semicolon
    (;) which ends the statement.


    ```javascript

    for ( [initialization]; [condition]; [arithmetic expression]) {

      // As long as condition returns true,

      // This block will be executed repeatedly

    }

    ```


    The arithmetic expression can be an increment (`++`) or a decrement (`--`) expression.
    It is run once each time the execution of the code inside the curly brackets end:


    ```javascript

    for (let x = 10; x >= 1; x--) {

      console.log(x);

    }

    ```


    Or you can also use shorthand arithmetic operators like `+=` and `-=` as shown
    below:


    ```javascript

    // for statement with shorthand arithmetic expression

    for (let x = 1; x < 20; x += 3) {

      console.log(x);

    }

    ```


    Here, the `x` will be incremented by 3 each time the loop is executed.


    Once the loop is over, JavaScript will continue to execute any code you write
    below the for body:


    ```javascript

    for (let x = 1; x < 2; x++) {

      console.log(x);

    }

    console.log("The for loop has ended");

    console.log("Continue code execution");

    ```


    ## When to Use a for Loop


    The for loop is useful when you know how many times you need to execute a repetitive
    task.


    For example, let’s say you’re writing a program to flip a coin. You need to find
    how many times the coin lands on heads when tossed 10 times. You can do it by
    using the `Math.random` method:


    - | ▪ |

    - | ▪ |


    ```javascript

    let heads = 0;

    let tails = 0;

    for (x = 1; x <= 10; x++) {

      if (Math.random() < 0.5) {

        tails++;

      } else {

        heads++;

      }

    }

    console.log("Tossed the coin ten times");

    console.log(`Number of heads: ${heads}`);

    console.log(`Number of tails: ${tails}`);

    ```


    The example above shows where the for loop offers the most effective approach.


    Now let’s see an alternative exercise about coin flips where the for loop is not
    effective:


    Find out how many times you need to flip a coin until it lands on heads.


    This time, you don’t know how many times you need to flip the coin. This is where
    you need to use the while loop statement, which you’re going to learn next.


    ## The while Statement


    The while statement or while loop is used to run a block of code as long as the
    condition evaluates to true.


    You can define the condition and the statement for the loop as follows:


    ```javascript

    while (condition) {

      statement;

    }

    ```


    Just like the for loop, the while loop is used to execute a piece of code over
    and over again until it reaches the desired condition.


    See the example below:


    ```javascript

    let i = 0;

    while (i < 6) {

      console.log(`The value of i = ${i}`);

      i++;

    }

    ```


    Here, the while loop will repeatedly print the value of `i` as long as `i` is
    less than 6. In each iteration, the value of `i` is incremented by 1 until it
    reaches 6 and the loop terminates.


    Keep in mind that you need to include a piece of code that eventually turns the
    evaluating condition to false or the while loop will be executed forever. The
    example below will cause an infinite loop:


    ```javascript

    let i = 0;

    while (i < 6) {

      console.log(`The value of i = ${i}`);

    }

    ```


    Because the value of `i` never changes, the while loop will go on forever!


    ## When to Use a While Loop


    Seeing that both while and for can be used for executing a piece of code repeatedly,
    when should you use a while loop instead of for?


    An easy way to know when you should use while is when you don’t know how many
    times you need to execute the code.


    Back to the coin toss example, there’s one case that’s perfect for a while loop:


    Find out how many times you need to flip a coin until it lands on heads.


    You also need to show how many times you flip the coin until it lands on heads:


    ```javascript

    let flips = 0;

    let isHeads = false;

    while (!isHeads) {

      flips++;

      isHeads = Math.random() < 0.5;

    }

    console.log(`It took ${flips} flips to land on heads.`);

    ```


    Here, the condition `isHead = Math.random() < 0.5` simulates the flipping of a
    fair coin. When the result is true, it means the coin landed on heads and the
    loop will exit.


    Because you can’t know how many times you need to loop until you get the number
    8, you need to use a while loop instead of a for loop.


    ## Summary


    In this chapter, you’ve learned about the two types of control flow available
    in JavaScript: the conditional flow and the loop flow.


    Each type has two different ways of controlling the flow: conditional has if-else
    and switch, while loop has for and while statements.


    The if and for statements are usually preferred over the switch and while statements.
    You can think of switch and while as an alternative syntax that you use when if
    and for isn’t suitable.


    # Chapter 6: Functions


    A function is simply a section (or a block) of code that’s written to perform
    a specific task.


    For example, the type casting function `String()` is used to convert data of another
    type to a string.


    The `log()` method from `console.log()` that we’ve used in the previous chapters
    is also a function, but because `log()` is attached to the `console` object, it’s
    called a method.


    You’ll learn more about objects and methods in the chapter. For now, just know
    that a function and a method are essentially the same, except that a method is
    called from an object.


    Besides the built-in functions provided by JavaScript, you can also create your
    own function.


    ## How to Create Your Own Function


    Creating a function starts with typing the function keyword followed by the function
    name, a pair of round brackets, and then a pair of curly brackets.


    Here’s an example:


    ```javascript

    function greet() {

      // function body here

      console.log("Hello!");

    }

    ```


    To call a function, you need to specify the function name followed by parentheses:


    ```javascript

    greet(); // Hello!

    ```


    The code inside the function is executed when you call that function.


    ## Function Parameters and Arguments


    Parameters are variables used to accept inputs given when the function is called.


    You can specify parameters in the function header, inside the parentheses.


    The following example shows a function that has one parameter called `name`:


    ```javascript

    function greet(name) {

      // function body

    }

    ```


    How you use that `name` parameter inside the function is up to you.


    You can use the parameter inside the `print()` function as follows:


    ```javascript

    function greet(name) {

      console.log(`Hello, ${name}!`);

      console.log("Nice weather today, right?");

    }

    ```


    Now whenever you need to call the `greet()` function, you need to pass an input
    to fill in the `name` parameter.

