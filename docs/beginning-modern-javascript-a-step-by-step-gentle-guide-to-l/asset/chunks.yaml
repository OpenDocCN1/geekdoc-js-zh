    );\n    break;\n  case false:\n    console.log(\"Bonjour False!\");\n    break;\n\
    \  default:\n    console.log(\"没有匹配的 case\");\n}\n```\n\n## `switch` 语句体\n\n`switch`\
    \ 语句体由三个关键字组成：\n\n- ▪\n- ▪\n- ▪\n\n当你的表达式找到匹配的 case 时，JavaScript 会执行 `case` 语句后面的代码，直到遇到\
    \ `break` 关键字。如果你省略了 `break` 关键字，那么代码执行会继续到下一个块。\n\n请看下面的例子：\n\n```\nswitch (0)\
    \ {\n  case 1:\n    console.log(\"值是 1\");\n  case 0:\n    console.log(\"值是 0\"\
    );\n  default:\n    console.log(\"没有匹配的 case\");\n}\n```\n\n当你执行上面的代码时，JavaScript\
