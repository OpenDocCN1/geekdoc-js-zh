- fmt: "\nIn the beginning, JavaScript was not as powerful as it is today, but an\
    \ active community of JavaScript developers kept adding new features to the language.\n\
    \nWith the rise of internet-based companies like Google and Facebook, JavaScript\
    \ began to grow to accommodate the ambitions of these giant internet companies.\
    \ The language received contributions from software developers everywhere around\
    \ the world.\n\nA great innovation happened to make JavaScript even more powerful\
    \ in 2009\\. A server-side environment named Node.js was released, allowing JavaScript\
    \ to run on the server side like PHP, Java, Python, Ruby, and many more. It also\
    \ enabled developers to create a full-stack web application using only JavaScript.\n\
    \nToday, JavaScript is a language that is used virtually everywhere.\n\n## Why\
    \ Learn JavaScript?\n\nThere are 4 good reasons why you need to learn JavaScript:\n\
    \n1.  JavaScript is the only language that works in the browser\n2.  It’s fairly\
    \ easy to learn (but hard to master)\n3.  It’s an essential language for making\
    \ web applications\n4.  There are many career opportunities when you know how\
    \ to work with JavaScript\n\nLearning JavaScript opens tremendous opportunities\
    \ no matter what role you want to get into in the tech industry. You can be a\
    \ frontend, backend, mobile, or full-stack developer by mastering JavaScript.\n\
    \n## Computer Setup\n\nTo start programming with JavaScript, you only need two\
    \ things:\n\n1.  A web browser\n2.  A code editor\n\nWe’re going to use the Chrome\
    \ browser to run our JavaScript code, so if you don’t have one, you can download\
    \ it here:\n\n[https://www.google.com/chrome/](https://www.google.com/chrome/)\n\
    \nThe browser is available for all major operating systems. Once the download\
    \ is complete, install the browser on your computer.\n\nNext, we need to install\
    \ a code editor. There are several free code editors available on the Internet,\
    \ such as Sublime Text, Visual Studio Code, and Notepad++.\n\nOut of these editors,\
    \ my favorite is Visual Studio Code, because it’s fast and easy to use.\n\n##\
    \ Installing Visual Studio Code\n\nVisual Studio Code or VSCode for short is a\
    \ code editor application created for the purpose of writing code. Aside from\
