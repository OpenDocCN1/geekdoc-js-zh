    ## Summary


    In this chapter, you’ve learned how the Promise object works in JavaScript. A
    promise is easy to understand when you realize the three states that can be generated
    by the promise: pending, resolved, and rejected.


    When facing a promise, you need to define what’s going to happen next inside the
    .then() and .catch() methods


    You’ve also learned how promises can be used to replace callbacks.


    Chapter 15: The Fetch API


    In this chapter, we’re going to learn about the Fetch API. But before we start,
    let’s quickly review what we mean by API.


    ## What is an API?


    API stands for Application Programming Interface, but this fancy term doesn’t
    really tell you what an API is, so let me explain it in simpler terms.


    An API is simply a program that’s exposed by the developer. The intention of exposing
    this program is so that other applications can call and use the program to achieve
    a specific result.


    For example, imagine you’re going to a restaurant to have lunch. You don’t directly
    go to the kitchen and prepare the food.


    Instead, you order food from the waiter, who takes the order to the kitchen. In
    the kitchen, the chef will make the food, and when it’s done, the waiter brings
    the food to your table.


    You know nothing about what’s happening in the kitchen. All you know is that you
    specify what you want to the waiter, and the waiter takes care of the rest.


    ![15 api illustration](OEBPS/image_rsrc2EN.jpg)


    In a similar way, an API serve as the gateway that you can access to achieve a
    specific result. You don’t really know how the API works under the hood. All you
    know is that you get what you wanted from the API.


    There are two kinds of APIs: the web API (also known as REST API), or library
    API.


    The web API is created by exposing certain endpoints that you can access to send
    and receive data.


    The library API is a piece of code written by other people. This code usually
    has a bunch of objects, methods, and properties that you can access to do something.
    You don’t need to know how they work under the hood.


    The document object exposed by the browser is an example of a library API, also
    known as the DOM API. You don’t write the document object from scratch, and when
    you call the querySelector() method, you don’t know exactly what code is written
    in that method.


    The Fetch API we’re going to learn next is also a library API.


    ## How Fetch API works


    The Fetch API is a function that you can use to send a request to any web API
    URL and get some response.


    To send a GET request similar to that of an HTML form, you only need to pass the
    URL where you want to send the data as an argument to the fetch() function:


    fetch(''<Your URL>'');


    The fetch() function accepts two parameters:


    1.  The URL to send the request to


    2.  The options to set in the request. You can set the request method to GET or
    POST here.


    Under the hood, the fetch() function returns a promise, so you need to add the
    .then() and .catch() methods.


    When the request returns a response, the then() method will be called. If the
    request returns an error, then the catch() method will be executed.


    Inside the .then() and .catch() methods, you pass a callback function to execute
    when the respective methods are called. In the following example, we’re going
    to hit a dummy URL located in jsonplaceholder.typicode.com:


    fetch(''https://jsonplaceholder.typicode.com/todos/1'')


      .then(response => console.log(response))


      .catch(error => console.log(error));


    The code above will give the following response:


    ![15 fetch response](OEBPS/image_rsrc2EP.jpg)


    Here, you can see that the body property contains a ReadableStream. To use the
    ReadableStream in our JavaScript application, we need to convert it to JSON format
    first, so let’s do it:


    fetch(''https://jsonplaceholder.typicode.com/todos/1'')


      .then(response => response.json())


      .then(data => console.log(data))


    The json() method converts the ReadableStream into a JavaScript object. The data
    variable above will be printed as follows:


    {


      userId: 1,


      id: 1,


      title: "delectus aut autem",


      completed: false


    }


    If you want to send a POST request instead of a GET request, pass an object containing
    a method property as follows:


    fetch(''https://jsonplaceholder.typicode.com/todos'', {


      method: ''POST'',


    }).then(response => response.json())


      .then(data => console.log(data))


    When you send a POST method, you need to set the request header and body properties
    to ensure a smooth process.


    For the header, you need to add the Content-Type property and set it to application/json.
    The data you want to send should be put inside the body property in a JSON format.
    See the example below:


    fetch(''https://jsonplaceholder.typicode.com/todos'', {


      method: ''POST'',


      headers: {


        ''Content-Type'': ''application/json'',


      },


      body: JSON.stringify({ title: ''Learn JavaScript'' }),


    }).then(response => response.json())


      .then(data => console.log(data))


    In the example above, we send a POST request to create a new todo task. The title
    of the task is Learn JavaScript. The response from the typicode API would be similar
    as follows:


    {


      title: ''Learn JavaScript'',


      id: 201


    }


    ## Summary


    The Fetch API allows you to access APIs and perform a network request using standard
    request methods such as GET, POST, PUT, PATCH, and DELETE.


    The Fetch API returns a promise, so you need to chain the function call with .then()
    and .catch() methods, as shown in the previous chapter.


    Here, we only see the GET and POST methods in action, but don’t worry because
    we’re going to use the rest in the following project.


    Chapter 16: Project 2 - Creating a To-do List Application


    As the final project of this book, we’re going to create a To-do List application.


    In this application, we can add, edit, delete, and mark a task as completed.


