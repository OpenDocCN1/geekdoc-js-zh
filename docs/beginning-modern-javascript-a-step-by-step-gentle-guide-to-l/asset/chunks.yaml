    \    console.log(\"值是二十或更大\");\n}\n```\n\n你需要记住 `if` 和 `case` 评估之间的区别：\n\n- ▪\n\
    - ▪\n\n## 何时使用 Switch？\n\n在 `if` 和 `switch` 之间做选择时的经验法则是：\n\n只有当使用 `if` 编写代码很繁琐时，才使用\
    \ `switch`\n\n例如，假设你想根据星期几的数字来写出星期几的名称。\n\n你可以这样编写：\n\n```\nlet weekdayNumber\
