    <tr>\n  ... Learn JavaScript ...\n</tr>\n<tr>\n  ... Learn HTML ...\n</tr>\n```\n\
    \nNow that we successfully displayed the data, the next step is to enable adding\
    \ a new task to the database.\n\n## Adding a New Task\n\nTo add a new task to\
    \ the database, we need to define the `addTask()` function that has been defined\
    \ in the previous chapter for the 'Add Task' button:\n\n```html\n<button type=\"\
    button\" class=\"btn btn-primary\" onClick=\"addTask()\">\n  Add Task\n</button>\n\
    ```\n\nBack to the `script.js` file, create a new function named `addTask()` and\
    \ write the following code into it:\n\n```javascript\nfunction addTask() {\n \
    \ const taskTitle = document.querySelector('#task-title');\n  const data = {\n\
    \    title: taskTitle.value,\n    completed: false,\n  };\n  fetch(BASE_API_URL,\
    \ {\n    method: 'POST',\n    headers: {\n      'Content-Type': 'application/json',\n\
    \    },\n    body: JSON.stringify(data),\n  }).then(response => {\n    if (response.ok)\
    \ {\n      alert('Task added');\n      getTasks();\n      taskTitle.value = '';\n\
    \    }\n  });\n}\n```\n\nFirst, we query the input text, which has an id of `task-title`,\
    \ then we create an object called `data` that stores the `title` and `completed`\
    \ status of the task.\n\nAfter that, we send a POST request using `fetch()`, adding\
    \ the required options. When the response comes, we call the `alert()` function\
    \ to notify the user that the task has been added to the database.\n\nBecause\
    \ there’s a new task on the database, we called the `getTasks()` data to reload\
    \ the task lists and display it to the user. Then we empty the input text just\
    \ to make it intuitive.\n\nNow you can test adding a new task from the browser.\
