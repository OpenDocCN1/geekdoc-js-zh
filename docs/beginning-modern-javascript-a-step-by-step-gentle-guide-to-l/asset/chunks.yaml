    \ 也会继续对剩余 case 评估表达式。\n\n你的 `switch` 评估可能匹配多个 case，因此通常使用 `break` 关键字在找到匹配后退出该过程。\n\
    \n最后，你也可以将表达式作为 case 值：\n\n```\nswitch (20) {\n  case 10 + 10:\n    console.log(\"\
    值是二十\");\n    break;\n}\n```\n\n但你需要记住，case 块的值必须与 `switch` 参数完全匹配。\n\n使用 `switch`\
    \ 语句时最常见的错误之一是人们认为 case 值会被评估为 `true` 或 `false`。\n\n以下 case 块不会产生正确的结果：\n\n```\n\
    let age = 5;\nswitch (age) {\n  case age < 10:\n    console.log(\"值小于十\");\n \
