    # 现代 JavaScript 入门


    面向初学者的循序渐进式 JavaScript 学习指南


    作者：Nathan Sebhastian


    ## 前言


    本书的目标是提供循序渐进的温和指导，帮助你了解如何使用 JavaScript 开发 Web 应用。


    我不会涵盖 JavaScript 的所有理论和概念，而是只教你该语言中最重要的构建块。我们将学习变量、数据类型、数组、函数和对象等内容，然后再学习如何使用
    JavaScript 构建和操作网页。


    读完本书后，你将拥有使用 JavaScript 构建前端应用的坚实基础。


    ## 如何使用本书


    本书分为 17 个短章节，每章聚焦于 JavaScript 的一个特定方面。最后几章将综合运用前面所学的内容，让你使用 JavaScript、HTML 和
    CSS 构建一个向导表单和一个待办事项列表应用。


    我鼓励你亲手编写书中的代码并运行它们，这样你就能体会到用 JavaScript 进行 Web 开发的感觉。边阅读本书中的示例边编码，学习效果最佳。


    充分利用本书的一个小建议：每完成一章后，至少休息 10 分钟，以便恢复精力和注意力。


    另外，如果某个概念难以理解，请不要灰心。学习任何新东西第一次都会很难，尤其是像编程这样的技术性内容。最重要的是坚持下去。


    ## 前提要求


    不需要任何 JavaScript 编程知识，因为我会从基础开始介绍 JavaScript，但为了充分利用本书，你最好对 HTML 和 CSS 有一定了解。


    ## 联系方式


    如果你需要帮助，可以通过 nathan@codewithnathan.com 联系我。


    你也可以订阅我的免费 7 天电子邮件课程《成功软件开发者的心态》，网址是 [`sebhastian.gumroad.com/l/mindset`](https://sebhastian.gumroad.com/l/mindset)


    该电子邮件课程将帮助你找到作为软件开发者的正确前进方向。


    ## 第 1 章：引言


    ### 什么是 JavaScript？


    JavaScript 大约在 1995 年 4 月由一位名叫 Brendan Eich 的开发者创建。当时，他正在为一家名为 Netscape 的公司开发浏览器。他被告知只有
    10 天时间来设计和编写一种能在浏览器上运行的编程语言的工作原型。


    他需要创建一种能吸引非专业程序员的语言，这些人希望从头开始构建一个网站。之所以只给他 10 天时间，是因为 Netscape 需要发布其浏览器，而当时它正在与微软竞争。


