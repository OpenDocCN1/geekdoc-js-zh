- img_proc: true
  md: 'Q. Why do you suggest that I include my JavaScript files at the bottom of my
    HTML file above the closing body element?


    A. When a browser is rendering the Document Object Model, it starts at the top
    and works its way down to the bottom of your HTML file. HTTP requests are limited
    to two requests per domain, so if you have multiple JavaScript includes, you are
    stopping the page loading while those resources are fetchedched. Even if the delay
    is for a split second, this delay can cause users to believe your site is unresponsive
    and slow. Including your JavaScript files before the closing body element ensures
    that the rest of the page loads quickly. Even if the site is not fully functional,
    users believe that the site is responsive and fast because they see things being
    rendered on the page.


    # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. True or False: jQuery only supports attaching a click event to an element.

    2. True or False: jQuery selector notation is similar to CSS notation.

    3. True or False: jQuery is for data manipulation only.

    4. True or False: jQuery is incompatible with any other JavaScript frameworks.

    5. True or False: Using jQuery selectors I am able to select only basic HTML elements
    such as spans, div, and table elements.


    # Answers


    +   1. False. jQuery offers more events than just the click event to attach to
    events. You can use all the events that you use to binding in standard JavaScript
    notation with jQuery, and you can use the jQuery .bind function for greater flexibility
    and customization.

    2. True. jQuery notation is based on CSS notation so that developers who are not
    terribly familiar with JavaScript can immediately start using jQuery with the
    skills they already have from working with CSS.

    3. False. While jQuery excels at data and object manipulation, it is a fantastic
    effects package. By using the .animate() function, you can actually create your
    own effects.'
