  md: '# Adding Extras to Lists


    You may be wondering what extras can be added to a list. There are quite a few
    things we can do. We can add numbers, insert a counter, include thumbnail images,
    include an icon, and even create split lists. Let''s start with using numbered
    lists.


    # Using Numbered Lists


    To create a numbered list you need to start with an ol element and include li
    elements inside it. Each li element is automatically numbered based on the position
    it is placed in the ol element. 11.2 shows the creation of a numbered list.


    # LISTING 11.2 Creating a Numbered List


    ```

    1: <ol data-role="listview">

    2:   <li data-role="list-divider">Numbered Items with Links</li>

    3:   <li><a href="#Polar"><a></a></li>

    4:   <li><a href="#Grizzly"><a></a></li>

    5:   <li><a href="#Brown"><a></a></li>

    6:   <li><a href="#Black"><a></a></li>

    7: </ol>

    ```


    On line 1 we begin with an ol element that has an attribute of data-role="listview"
    to apply the jQuery Mobile styles to make this a numbered list. Just like the
    standard list if you omit the data-role="listview" the styles will not be applied
    and it will remain an ordered list instead of being rendered as a numbered list.


    Line 2 contains an li element that contains an attribute of data-role="list-divider".
    This works the same as it does in the standard list allowing this particular element
    to act as a separator. Even though it is an li element inside an ol element, it
    will not be numbered.


    Lines 3-6 show four li elements with elements with some text inside them. Just
    like the standard list, these elements will be styled with arrows on the right
    indicating that they can be clicked and tapped. Line 7 closes the ol and completes
    our numbered list.


    Figure 11.3 shows what a numbered list looks like on a mobile browser.


    While this numbered list was not set up as an inset numbered list, it can be created
    as one by using the data-inset="true" attribute on the ol element.


    Another thing we can do with numbers is count bubbles.'
