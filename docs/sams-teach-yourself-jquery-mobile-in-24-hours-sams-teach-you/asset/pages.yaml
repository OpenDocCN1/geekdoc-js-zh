- img_proc: true
  md: '# Exploring Transcoding Programs


    Many programs are available to help you encode your mobile video. Most of these
    programs work through a process known as transcoding. This process takes an already
    prepared video and changes the settings including codecs and bitrate to create
    a new video file. The higher the quality of your source file, the higher your
    transcoded video will be.


    # MiroVideoConverter


    The MiroVideoConverter (http://www.mirovideoconverter.com/) is a program available
    for free to Windows and Macintosh users. Its is incredibly simple to use. Once
    the program has been opened, you drag and drop the file you want to transcode
    to the program window, pick an out format, and then click the Convert! button.
    The problem with the converter is that it does not give you any control over the
    settings used for the transcoding process. This makes it difficult to fine-tune
    your video files to the exact settings you want.


    # Handrake


    Handbrake (http://handbrake.fr/) is another open-source video transcoding program
    available for Windows, Macintosh, and Linux users. The primary function of the
    program is more along the lines of creating personal DVD backup files, it can
    be used to create both .mp4 and .mkv files. Once the program has been installed,
    you open the file you want to transcode and then make adjustments to the output
    by using the Video, Audio, Subtitle, and Chapter sections at the bottom of the
    program window.


    # MediaCoder


    MediaCoder (http://www.mediacoder.com/) is a program that has gone through a bit
    of change in the last years. When it first appeared it was an all-in-one solution,
    but it has since branched out into specialized versions. It is a Windows program,
    but the author mentions that by using an emulator it can run on Linux and on Macintosh
    systems. MediaCoder is a transcoding program compatible with most format containers
    and codecs. It may occasionally encounter an error when you attempt to create
    a file with incompatible codecs. I have found that for Windows transcoders, this
    particular program gives you a considerable amount of flexibility and options.
    The program is built with a wizard to walk you through file creation, or you may
    adjust everything manually. If you are using the manual settings you can drag
    and drop the files you transcoded into the program and then use the Settings tabs
    at the bottom to adjust the output type and format.


    # MPEG Streamclip


    The last encoding/transcoding program we are going to cover is MPEG Streamclip
    (http://www.squared5.com/). It is available for both Macintosh and Windows systems.
    It contains a player and editor, and of course the ability to transcode files
    from one format into another. The program works similarly to the others listed.
    Once you have opened the program, you can drag and'
  merge: -1
  pgno: 371
- img_proc: true
  md: 'Encoding Video for Mobile Playback 355


    drop a video onto it. You can then use the File menu to view information about
    the streams contained in the video, and to export the video to another format.


    # # Encoding a Video


    Regardless of the program you end up using, if you want to support the widest
    number of devices possible there are some rules you need to follow:


    +   - Encode with an .mp4 container.


    While it is true that some browsers do not support .mp4 for HTML5 video playback,
    almost every mobile device supports the .mp4 container for native playback.


    +   - Keep your bitrate low between 400-800 kbps.


    The bitrate does how clear or pixelated your video is; however, it is also a key
    factor in file size and CPU load when decoding the video. If you can keep it in
    that range, you should be able to achieve quality and file size.


    +   - Encode your audio with AAC-LC.


    Of the AAC codecs this is the lowest in quality, but it is the most supported.
    Don''t worry too much about it; even at 48kbps it still sounds fairly good. Most
    encoders allow you to use a quality setting that creates a variable bitrate file
    that gives a good balance between file size and sound.


    +   - Encode your video with H.264, Baseline level 3.0, no B-Frames.


    This should be pretty straightforward. Use AVC or H.264 and then if your encoding
    program allows you to choose a profile and level, choose Baseline and 3.0. If
    your encoding program does not allow these options, then turn off any extras such
    as B-Frames.


    +   - Unless you absolutely need HD video, use a resolution 480x360 (4:3) or 480x270
    (16:9).


    The maximum resolution supported with level 3.0 is 720x576 when playing back at
    24 frames per second. This really means that you will not be able to provide a
    true HD file unless you use a file with a different level or container. While
    this is changing, legacy devices will continue to be ideal for several years.


    If you follow those rules, the videos you create will play back on most smartphones,
    personal media players, and tablets.


    To get an idea of how the settings should look let''s take a look at some figures.
    Figure 19.4 shows the export to a MPEG-4 setting screen from Streamclip with the
    settings for mobile video. Figure 19.5 and Figure 19.6 show the Video and Advanced
    tab configurations needed when using HandBrake for transcoding mobile video.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# 356 HOUR 19: Encoding Your Video for Mobile


    ![](img/56578b432709a7220ba1c18b41eabe62_373_0.png)


    FIGURE 19.4

