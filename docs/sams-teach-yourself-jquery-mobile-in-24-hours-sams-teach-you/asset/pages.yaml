  md: "# Browser Support for Compression\n\nNot all browsers are compatible with compression.\
    \ Any browser that does not support at least HTTP\n1.1 encoding will not work\
    \ with gzip or deflate compression. Most modern browsers support HTTP\n1.1, but\
    \ some proxies and even antivirus software can force the browser to support only\
    \ HTTP 1.0,\nmaking the browser incompatible with server-side compression methods.\n\
    \nThe good news about handling compression on the server is if the client asking\
    \ for content\ncannot handle compression, the server will not send it. This allows\
    \ you to not worry\nso much about keeping separate configurations, or even files\
    \ based on compression or un-\npressed versions.\n\nLet's take a look at configuring\
    \ server-side compression on a couple of popular servers.\n\n# Configuring Your\
    \ Apache Server\n\nSome servers are preconfigured to use server-side compression\
    \ (such as IIS v7+). For an exam-\nple how to configure your web server, we walk\
    \ through the ever-popular open source Apache\nserver and the Deflate module.\n\
    \nApache can be configured in two ways. You can use an .htaccess file, or you\
    \ can change the\nconfiguration of the server itself to always have compression\
    \ turned on. To get started with either\nmethod, you first need to make sure you\
    \ have the correct module enabled. The easiest way to see\\whether you have the\
    \ module is to open your httpd.conf file and search for an entry of\n#LoadModule\
    \ deflate_module modules/mod_deflate.so\n\nIf you have that line, you need to\
    \ remove the # that is commenting out the line. While you have\nthis file open,\
    \ you can enable compression to always be on by moving to a section of the file\n\
    where MIME types can be set. If you do not already have a section, add an entry\
    \ at the bottom\nof the file. When you find a suitable location, add the following:\n\
    \n```\n<files *.js>\n  SetOutputFilter DEFLATE\n</files>\n```\n\nOnce you have\
    \ saved that, the file and restart your server. When the server comes back\nup\
    \ it will start server-side compression automatically.\n\nNow that you are working\
    \ compression, you may want to clean up what actually gets com-\npressed. Movies,\
    \ images, music, and already-compressed files will not benefit from any added\n\
    compression and will just use CPU that could be used elsewhere. So to take care\
    \ of that,\nago back into your httpd.conf file and change the line you previously\
    \ entered in a files element so\nit that appears as follows:\n\n```\nAddOutputFilterByType\
    \ DEFLATE text/html text/css application/javascript\n```"
