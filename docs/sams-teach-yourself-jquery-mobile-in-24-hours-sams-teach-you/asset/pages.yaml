  md: '# LISTING 8.6 A Code Snippet for Setting Up a Footer Toolbar


    ```

    1: <div data-role="footer">

    2:     <h4>h4I am a footer toolbar</h4>

    3: </div>

    ```


    This snippet of code should be as familiar as the header toolbar by, as we have
    covered it before. Let''s do something new and switch up the footer toolbar by
    removing the h4 element and replacing it with a few buttons. Listing 8.7 shows
    the modified footer toolbar.


    # LISTING 8.7 Buttons Added to the Footer Toolbar


    ```

    1: <div data-role="footer" class="ui-bar">

    2:     <a href="#" data-role="button">Link 1 </a>

    3:     <a href="#" data-role="button">Link 2 </a>

    4:     <a href="#" data-role="button">Link 3 </a>

    5: </div>

    ```


    This should look straightforward. On line 1 we added class="ui-bar" to add some
    padding to the toolbar. The ui-bar class sets a default font size and sets the
    margins to 0. It is commonly combined with other classes to create padding, clear
    floats, and change the display property and the positioning of an element. We
    also removed the h4 element and replaced it with three elements that contain attributes
    of data-role="button" to style the links as buttons. Take a look at Figure 8.6
    to see the results of our changes.


    As shown in Figure 8.6, we now have three buttons that are styled inline with
    each other. They look pretty good, but we can make them look a little better by
    applying a controlgroup to. A control is a container that surrounds the buttons
    and applies either a vertical or horizontal style to them so that they appear
    as one long button that has been sliced into portions. Listing 8.8 shows the code
    for aligning a controlgroup with the buttons aligned horizontally.


    # LISTING 8.8 Using a Control to Align and Style Buttons


    ```

    1: <div data-role="footer" class="ui-bar">

    2:     <div data-role="controlgroup" data-type="horizontal">

    3:         <a href="#" data-role="button">Link 1 </a>

    4:         <a href="#" data-role="button">Link 2 </a>

    5:         <a href="#" data-role="button">Link 3 </a>

    6:     </div>

    7: </div>

    ```


    As shown in Figure 8.7 you see the styles applied from wrapping the buttons in
    a controlgroup container.'
