    closing tags for various HTML elements that complete our page.


    # Perceived pageinit Processing Speed


    When using the pageinit event, the transition between pages does not actually
    take place until whatever code has been placed into the pageinit event has finished
    processing. This can cause some delay between page transitions and make users
    who are unprepared for the wait time the site has some lag or is slow. Plan ahead
    and keep the functions you need to have on page-load short and direct.


    The following figures show the use of the pageinit event. These figures were taken
    on an Android device version 4.0.1. Depending on which browser and device you
    use, the alert message will appear styled differently. Figure 4.3 shows the page
    we built in Listing 4.6. Figure 4.4 shows the alert that is triggered by the function
    called in the pageinit event. Figure 4.5 shows the page that triggered the pageinit
    event and is the code from Listing 4.7.


    You can set up pageinit events for other pages using a unique id for each page
    you want to attach to the event. By doing this, you can trigger functions that
    you want happening when certain pages load.'
