- img_proc: true
  md: '# # Generating Your QR Codes


    The easiest way to get started generating your code is to use the Google Chart
    Tools. By utilizing the Google Chart Tools, you can create codes instantly that
    will appear in your browser when you visit a parameterized URL. To begin generating
    QR codes, you need to use this base URL:


    https://chart.googleapis.com/chart?cht=qr


    Once you have that, you can add some extra URL parameters to finish the code creation.
    By adding ch=300x300 you get back an image 300x300 pixels in size. You can change
    this value to change the dimension of the code returned. The current maximum size
    that you can request is 547x547 pixels.


    To add the text data you want to encode, you need to add a parameter of chl=yourtexthere.
    You should change the value of "yourtexthere" to whatever value you want the QR
    code to contain. An important detail is that whatever value you decide to put
    into the code must be URL encoded. This means that the text I am awesome would
    become 1%20awesome when encoded.


    That is all the data required to create a QR code, but you may want to consider
    passing the error correction level if the embedded data is made redundant. Redundant
    information allows much more compatibility and allows some of the QR code to be
    altered, missing, or destroyed and still maintain readability. By default the
    value is set at L, which allows for up 7% of the code to be lost but still readable.
    You may choose to use M allowing up to 15%, allowing up to 25%, or H allowing
    up to 30%. Remember that data redundancy requires more space to write out the
    information, so you can not put much data into a QR code with a value of H as
    you can with one set at L.


    Let''s take a look at a full URL that generates a QR code for us using the parameters
    we learned about. Typing the URL into your browser:


    https://chart.googleapis.com/chart?cht=qr&chs=300x300&chl=I%27ve%20generated%20my%20QR%20chld=H


    Figure 20.3 shows the resulting QR code from running that URL in a browser.'
  merge: -1
  pgno: 386
