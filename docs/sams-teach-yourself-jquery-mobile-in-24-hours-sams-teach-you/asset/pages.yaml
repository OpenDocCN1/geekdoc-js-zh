    # CAUTION


    Theme Information

    Every theme used in WordPress contains important data in the comments at the top
    of the styles.css file. These comments are used to display the name, version,
    and description of the theme in the administration area of WordPress. While it
    is fine to modify the data, make sure you do not delete and leave it empty!


    Lines 1-3 are a comment and import of the reset.css file. Because jQuery Mobile
    already provides a reset, this file does not need to be called, so it can be safely
    commented out. Lines 4 and 5 show the other included imports for other styles.
    Line 7 shows the image style we want to resize images for different mobile devices,
    and line 8 shows a class that was added for some page formatting. Line 9 shows
    a class file that will overwrite some of the included jQuery Mobile styles that
    we''ll be using later. Line 11 is a comment to let you know that the area below
    is media queries and have a minimum width of 650px. Line 12 shows a media query
    that will run on all devices that support media queries and Line 13 and 14 show
    the styles that will be applied on these devices. Line 16 shows a media query
    that will run on all devices that support media queries and have a maximum screen
    size of 649px.


    With those few changes, let''s see what has happened to our site. Figure 24.7
    shows the site viewed on a tablet, and Figure 24.8 shows the site viewed on a
    smaller screen device.'
