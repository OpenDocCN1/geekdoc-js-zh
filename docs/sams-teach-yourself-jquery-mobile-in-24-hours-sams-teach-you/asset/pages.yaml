    # Functioning with JavaScript


    We now know how to style the content on a site—it might be nice if we could make
    something happen when a visitor comes to the site. This is where JavaScript comes
    into play.


    JavaScript originally picked up a bad reputation when it was first introduced.
    People did not understand what it was, or even what it was for. I remember a friend
    of mine was convinced that he had picked up a virus every time he visited a certain
    website words would follow his mouse around the screen.


    To many people, JavaScript became a nuisance and at best a practical joke language.
    At the time it was not realized what JavaScript could do or how it could enrich
    websites by adding animation, data collection, and event binding that could change
    the way a user interacts with a web-site. While I am it let me dispel one more
    myth, JavaScript is not Java.


    Whether you realize it or not, today JavaScript does more heavy lifting and manipulation
    of the Object Model than ever before. Websites that could only do things with
    precompiled files and special plug-ins can now be displayed natively in a browser.
    JavaScript helps websites feel more interactive, or even more like a native application.


    # Where Scripts Can Be Added


    You can include JavaScript by placing the code inside script tags. While these
    tags can be placed anywhere inside your document, you should take some time to
    consider where your script will be most effective.


    * **'
