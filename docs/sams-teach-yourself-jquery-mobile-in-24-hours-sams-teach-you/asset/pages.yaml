  md: '# Adding Icons to Buttons


    When you think of a native mobile application, are all the buttons text only?
    Of course not; they tend to have images in them.


    These images, or icons, allow us to know what the button is without having to
    read it. They also make some buttons appear less awkward if there is not enough
    room to spell out what they are supposed to do.


    # Using the Built-in Icon Set


    jQuery Mobile comes with a built-in set of icons that you can use on your buttons
    to help styling for mobile devices. These icons are applied to your buttons by
    including a data-icon=" attribute in the element you are using as a button. The
    icon you want to display on the button is the value for the attribute. For example,
    if I wanted to display a search icon in my button I would use data-icon="search"
    as an attribute on the element that I am using as a button.


    The included icons are


    +   * Left Arrow - data-icon="arrow-1"

    * Right Arrow - data-icon="arrow-r"

    * Up Arrow - data-icon="arrow-u"

    * Down Arrow - data-icon="arrow-d"

    * Delete - data-icon="delete"

    * Plus - data-icon="plus"

    * Minus - data-icon="minus"

    * Check - data-icon="check"

    * Gear - data-icon="gear"

    * Refresh - data-icon="refresh"

    * Forward - data-icon="forward"

    * Back - data-icon="back"

    * Grid - data-icon="grid"

    * Star - data-icon="star"'
