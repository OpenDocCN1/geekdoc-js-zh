  md: '# Encoding Video for Mobile Playback 351


    While the iPhone 4S runs at a set resolution of 640×960, remember that the previous
    iPhone models prior to the iPhone 4 run with a resolution of 320×480. To complicate
    this touch more, the iPad and iPad2 both have a resolution of 1024×768 while the
    new iPad contains a resolution of 2048×1536.


    # Windows Phone 7


    The Windows Phone system currently runs with a set resolution for all devices.
    This makes designing for them nice as all screens display in the same proportion.
    This may change shortly, but for now you can skip worrying too much about how
    the video is going to play back on all devices.


    +   - Native resolution: 480×800

    - Video codes: WMV Simple, Main, and Advanced profile, MPEG-4 Part 2 Simple and
    Advanced profile, MPEG-4 Part 10 (H.264, AVC) Baseline, Main, and High Profile
    Level 3.0, and H.263

    - Audio codes: AAC-LC, HE-ACC v1 (AAC+), HE-ACC v2 (eAAC)

    - Video containers: .wmv, .3gp, .3g2, .mp4, .m4v, .amr

    - Visit help:http://msdn.microsoft.com/en-us/library/ and search for media formats
    to learn about the latest media support


    With the release of tablets and mobile devices pending, the support level for
    media playback may change soon. Microsoft has shown strong support for H.264 in
    HTML5 video playback, so with that in mind video support on mobile devices should
    stay near whatever can be played back in Internet Explorer.


    Now that we have a list of what common mobile devices are capable of, let''s learn
    about the tools and settings used to encode videos for playback.


    # Encoding Video for Mobile Playback


    If you''ve never encoded video before, it''s common to think that you need to
    use the absolute highest quality possible. While getting the highest quality possible
    may sound like the best idea, it will result in either a file size that is unacceptable
    for mobile delivery or a file that is unable to be played on mobile devices. Luckily
    there are some tools that can help you learn how to create the perfect video.
    Sometimes the best way to learn is through a little investigation, and some slight
    reverse engineering. Let''s take a look at some tools to find out how videos are
    encoded.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# Discovering Inspection Tools


    Inspection tools work as analyzers that open a container file and tell you about
    the video and audio stream information. This is similar to the Get Info option
    in OSX and like viewing properties of a file in Windows. The biggest difference
    is when using an inspector program you get a lot more detail. 19.2 shows what
    is returned when using Get Info on OSX and viewing file properties in Windows.


    ![](img/56578b432709a7220ba1c18b41eabe62_369_0.png)


    FIGURE 19.2


    Details about the video container are shown.


    The details given are relevant, such as file size and resolution, in Windows they
    do not tell you the bitrate used or even what codecs are used for each stream
    in the file. On OSX you see some basic information, but you are not shown the
    bitrate for the individual audio and video streams but instead shown a combined
    total bitrate. Also are not shown extra codec features such as the file level
    was encoded at. For that we need to use other tools.


    My absolute video inspection tool is called Mediainfo and is available for Windows,
    Mac, and Linux users. It is available as a free, GPL licensed download from sourceforge
    at http://mediainfo.sourceforge.net/en/Download. Once you have downloaded and
    installed the application, you are ready to start inspecting files. When Mediainfo
    is opened, it presents an entry window divided into sections. To inspect a file,
    either use the program menu to select a file, or drag-and-drop the file into the
    program window. Once a file has been dropped, the window populates the sections
    with data from the file. 19.3 shows the program inspecting a video.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# Encoding Video for Mobile Playback 353


    ![](img/56578b432709a7220ba1c18b41eabe62_370_0.png)


    Figure 19.3

    MediaInfo inspecting a file


    As you can see from Figure 19.3, the file in use has one video stream, and one
    audio stream. The audio codec used was AVC, and in the sections below you can
    get more detailed information. The video section shows the bitrate the video was
    encoded at, the resolution of the video along with ratio, how many frames-per-second,
