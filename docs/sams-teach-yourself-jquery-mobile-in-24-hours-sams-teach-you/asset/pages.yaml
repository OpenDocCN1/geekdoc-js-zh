    # Windows Phone


    While the adoption rate of Windows Phone devices has not been as fast as iOS or
    Android, a partnership with Nokia aims to change that. Windows Phone features
    a streamlined and modern OS that is simple to use with a good-looking UI. The
    Windows Phone SDK comes with everything you need to get started developing, including
    the Windows Phone Emulator. The SDK installs only on computers running at least
    Windows Vista SP2. Note that the Windows Phone Emulator will not run in an installation
    of Windows that is running inside an emulator. This means that those running VMware
    Fusion, Parallels Desktop, and VirtualBox will be able to install the SDK, but
    not able to use emulator for testing. That means that developers to Linux or Macintosh
    systems need to dual- or tri-boot their system with a Windows installation to
    use the Windows Phone Emulator.


    While the Windows Phone Emulator is aimed at loading and testing applications
    developed for the OS, it comes with Internet Explorer Mobile installed. This is
    perfect for testing websites and web applications built on jQuery Mobile. Figure
