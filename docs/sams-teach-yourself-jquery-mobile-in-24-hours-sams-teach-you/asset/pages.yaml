  md: '# Button Clipping


    If you are developing with jQuery 1.0 you may notice that buttons sometimes have
    borders or shadows that appear. This does not affect all browsers but is visible
    in both desktop and mobile WebKit- and Opera-based browsers. The solution to this
    issue is to upgrade using jQuery Mobile 1.1+.


    Another option for content formatting in your footer is to use a grid system.
    Let''s keep our buttons but use a grid system to separate them from each other.
    Listing 8.9 shows the footer toolbar with a three-column grid layout applied.


    # LISTING 8.9 A Footer Toolbar with a Grid Layout Applied


    ```

    1: <div data-role="footer" class="ui-bar">

    2:   <div class="ui-grid-b">

    3:     <div class="ui-block-a"><a href="#" data-role="button">Link 1</a></div>

    4:     <div class="ui-block-b"><a href="#" data-role="button">Link 2</a></div>

    5:     <div class="ui-block-c"><a href="#" data-role="button">Link 3</a></div>

    6:   </div>

    7: </div>

    ```


    Line 2 shows starting our grid by class="ui-grid-b" on the div element. This class
    sets up a three-column grid.


    Line 3 shows a div element with an attribute of class="ui-block-a", which means
    it will be shown in the first column. Listing 4 and 5 use a similar class to put
    their content in the second and third column. Line 6 closes our grid by closing
    the div element.


    Each of the buttons will now be displayed inside a separate column in the footer
    toolbar. We can see what this looks like in Figure 8.8.


    Using the grid looks good for spacing, but you can see that each button is aligned
    to the left side of the column. This may be problematic to your design, however,
    as it throws the symmetry of the page.


    We can solve this problem by using a navbar to display the links. In Listing 8.10
