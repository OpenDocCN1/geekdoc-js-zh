    Applications are built using the Windows Phone SDK, which is used in conjunction
    with Visual Studio and can be downloaded for free. To release an app in the Marketplace
    you must be either a licensed Xbox Live or Windows Phone developer. All applications
    are subject to approval and must pass to appear in the Marketplace.


    The future of Windows Phone is currently geared toward a more complete integration
    with Windows 8, including tighter integration for desktops, tablets, and mobile
    phones.


    # Bada


    This OS is created by Samsung and is still trying to gain traction in the mobile
    device market. It was introduced in 2010 with a limited number of hardware devices.
    If you have ever used an Android device from Samsung that runs the touchwiz launcher,
    then Bada will feel somewhat'
