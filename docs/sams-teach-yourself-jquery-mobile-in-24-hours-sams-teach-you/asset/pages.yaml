- img_proc: true
  md: 'guides at http://phonegap.com/start, or you could use the PhoneGap Build service
    (https://build.phonegap.com/). Using PhoneGap Build you only need to upload a
    zip of your HTML, CSS, and JavaScript files and it automatically generates application
    store ready files. PhoneGap is a useful framework that could be covered in a book
    by itself, hopefully you have seen how it can be easily leveraged to quickly create
    or port applications from the Web to a mobile device.


    # # Summary


    In this hour you learned how to use PhoneGap and jQuery Mobile to create an application
    that can be used on the Android platform. You learned what tools are needed and
    how to create a project. By using PhoneGap, it is possible to port some web applications
    to mobile devices in a short amount of time, and by using jQuery Mobile the layout
    of your application appears like it does on a website. This allows you to use
    styling that you are already familiar with and provides a comfortable cross-platform
    experience.


    # # Q&A


    +   - **Q.** It seems too simple to include a jQuery Mobile project; is that really
    all it takes?

    - **A.** The difficulty level depends on the project. You can create some very
    complex awesome applications by including backbone.js and using some web service
    calis. Doing so increases the difficulty level of your app. If you tie it into
    the native hardware system also increases the complexity level of your app. For
    example, the project sample in this hour did not include access to the camera.
    The application created in this hour was to give you a taste of using PhoneGap
    with a simple jQuery Mobile project.


    +   - **Q.** When using PhoneGap can I make the device noises or take pictures?

    - **A.** Absolutely, just remember that when users install their application they
    are shown what permissions the application needs. If someone downloads an app
    that wants to use the camera and doesn''t explain why, the user may not complete
    the install.


    +   - **Q.** Is the app from this hour available in the Android section of Google
    Play?

    - **A.** Yes, this app is published and available for free download.


    # # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.'
