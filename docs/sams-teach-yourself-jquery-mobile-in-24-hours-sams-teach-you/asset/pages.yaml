    # # Adapting to the Orientation Event


    When viewing a mobile device, there are two options or modes for screen orientation.
    When a page is viewed in portrait, it means that the height of the screen is greater
    than the width of the screen. When a page is viewed in landscape, the width of
    the screen is greater than the height of the screen.


    Unless the device is locked into one viewing mode, the screen can be rotated and
    content shifted dynamically to make use of the extra space. jQuery Mobile handles
    the resize of many of your elements, you may want to trigger a custom function
    whenever a screen change is detected.


    Listing 12.7 shows a snippet of code used to bind the orientationchange event
    to a page and run when it is triggered.


    # LISTING 12.7 Using the orientationchange Event


    ```

    1: $(document).on(''pageinit'', function() {

    2:   $(window).on(''orientationchange'', function(e) {

    3:   $("#mode").html(''orientation is currently ''+e.orientation);

    4:   });

    5: });

    ```'
