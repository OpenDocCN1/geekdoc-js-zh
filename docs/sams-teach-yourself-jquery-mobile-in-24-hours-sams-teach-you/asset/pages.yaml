  md: '# # HOUR 9

    # Designing Buttons


    # ### What You''ll Learn In This Hour:


    +   * When button are used

    * Button default settings and how to override them

    * How to add icons to buttons

    * How to add custom icons to buttons


    This hour we learn about the button system in jQuery Mobile. We''ve lightly covered
    buttons before, and we''ve used them to switch pages and trigger dialog windows,
    but you can do much more with them.


    # ### Beginning with Buttons


    Buttons are tightly integrated into jQuery Mobile. Buttons are useful in mobile
    sites and applications because they improve the user experience. Few things are
    more frustrating than being to see a link on your screen but being unable to activate
    or use it. jQuery Mobile solves this problem by allowing you to style your links
    as buttons that scale to the device they are viewed on. In this turn creates elements
    that are easy to read and access.


    # ### Creating a Link-Based Button


    Let''s take a quick review on how to create a button. First we need to create
    a link and then give it an attribute of data-role="button". This does not create
    an actual button element or object, but instead uses the underlying styling and
    markup to make the link appear to be button.


    Here is a one-line snippet of code that shows an element being styled as a button:


    ```

    <a href="#" data-role="button">Button</a>

    ```


    This creates what is referred to as a link-based button. Because link-based buttons
    use only the styles and markup of the button plug-in, they cannot natively tap
    into the button functions and'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'methods. You can create and use link-based buttons wherever you want, I''ve
    found that it is best to use them in navigation, or for triggering custom functions.


    While link-based buttons do not use the automatic plug-in of jQuery Mobile, it
    turns out that input and button elements do.


    # Inputs and Buttons


    In HTML many types of input elements create buttons. Anytime, reset you use an
    input element with an attribute having a value of submit, button, or image it
    automatically is styled as a button.


    With these inputs being automatically styled as buttons, you do not need to add
    the data-role="button" attribute like you did when using a link-based button.
    Just in case you were wondering, the button element is also automatically styled
    as a button and does not require any extra markup. Listing 9.1 shows the contents
    of the file button_examples.html. This file contains code for creating all the
    buttons supported by jQuery Mobile.


