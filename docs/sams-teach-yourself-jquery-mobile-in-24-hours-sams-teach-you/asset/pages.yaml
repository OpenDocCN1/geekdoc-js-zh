  md: 'Things continued to get more complex as developers were eager to explore new
    territory and push the language further. Layouts based on tables emerged, and
    this allowed new flexibility and control in regards to how a site was displayed.
    Table layouts were immensely popular. This allowed new flexible or self-sizing
    sections and a more dynamic site flow. CSS was new, and when it was supported
    in browsers it was limited. This made styling containers and forms difficult.
    Some light CSS was starting to be born, but it did not fully replace table layout
    containers, using of the <font> tag, and some other style-only tags.


    Web developers continued to mold, push, and hack the HTML was being rendered by
    browsers. This progression and community adopted standards helped to drive advancements
    in the various Internet browsers that were available. Soon most browsers had at
    least rudimentary support for CSS2. That moved into a fair amount of arguing over
    how HTML should really be used in site development.


    # The DOCTYPE


    Continuing through the evolution of HTML brings us to talking about the DOCTYPE.
    This is an interesting tag that was added to let browsers know how to render the
    page.


    While this is not actually an HTML tag per se, it is a necessary component for
    the correct rendering and handling of your website.


    Developers are still happily using deprecated HTML tags but want to move on to
    HTML 4 can use the Transitional DOCTYPE.


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"

    "http://www.w3.org/TR/html4/loose.dtd">

    ```


    The Transitional DOCTYPE allows the browser to parse through deprecated tags and
    displays them without throwing any errors.


    Developers who do not want to include support for deprecated tags and the possible
    formatting errors that may ensue when using a “compatibility” mode can use the
    strict DOCTYPE.


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN"

    "http://www.w3.org/TR/html4/strict.dtd">

    ```


    Using the strict DOCTYPE tells the browser to throw errors when deprecated tags
    are included in the HTML file it tries to load. This can be useful as it guarantees
    your work is at least up to the HTML 4 standard.'
