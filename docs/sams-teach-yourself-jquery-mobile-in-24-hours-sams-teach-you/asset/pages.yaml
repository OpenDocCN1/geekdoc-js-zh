  md: '# Summary


    With mobile emulators it is possible to better prepared to handle different devices
    and know how your site will work and appear on them. In this hour you learned
    to acquire some mobile device simulators and what platforms they run on. You also
    learned that not all emulators are full device emulators but are applications
    that simulate a browser that can be installed on some mobile devices.


    Mobile emulators are not perfect; you should test with actual hardware as often
    as possible. This is due to the emulation of hardware and software running on
    a different chipset and platform.


    You also learned that by using a UA detection script with mobile emulators you
    can detect mobile devices and plan ahead for them.


    # Q&A


    +   Q. What about an emulator for Opera Mini?

    A. Odd enough the main difference between Opera Mobile and Opera Mini is how the
    data is handled. In Opera Mini every request is sent to the Opera backend servers
    for compressed data. This results in smaller downloads and less bandwidth used,
    while the Opera Mobile application skips this step when connected to Wi-Fi. So
    in short, testing with Opera Mobile should get you close enough to Opera Mini
    to work.


    +   Q. Should I be concerned if I don''t use a remote debugging utility like Opera
    Dragonfly on my iOS or Android development?

    A. Yes and No. If the page loads and functions as planned, then I''d say you are
    most likely in the clear. However, both default browsers for iOS and Android run
    WebKit, so to be safe, fire up Safari and Chrome and use the Developer Tools to
    look for errors and fix them on your desktop. After you have fixed any errors,
    try loading on your device or emulator again. If it''s still broken, you can resort
    to some good old alert debugging or similar visual debug tool. iOS devices also
    allow you to turn on a Debug Console in the system preferences that will show
    you errors that occur on pages you are working on.'
  merge: -1
  pgno: 432
- img_proc: true
  md: 'Q. If jQuery Mobile handles issues including fallback support for legacy devices,
    why should I even bother with emulators?


    A. Using emulators is mostly a personal preference, and jQuery Mobile does a fantastic
    job of making your website work on legacy devices. However, unless you really
    want to be that developer that passes a site off because it works on your mobile
    device, you should always test it on as many devices as possible. What may work
    for you in your chosen browser might not work for someone else.


    # # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # # Quiz


    +   1. What platform can you install the iOS Simulator on?


    +   2. What is required to create and Android Virtual Device?


    +   3. What is Fennec?


    +   4. What makes emulating BlackBerry devices a little different from other devices?


    +   5. True or False: You can run the Windows Phone Emulator on a copy of Windows
    running inside a VM.


    # # Answers


    +   1. iOS comes with Xcode and only runs on computers running OSX.


    +   2. You need to download the Android SDK and any APIs that you want to use.


    +   3. Fennec was the codename for Firefox Mobile. The UA for Firefox Mobile still
    contains Fennec, and the emulator still displays Fennec as the application name.


    +   4. BlackBerry offers emulators on a per-device situation. This allows you
    to get the emulator for the device you want to test.


    +   5. False. The Windows Phone Emulator will not function inside a VM. It will
    only run from a standard Windows installation.'
  merge: -1
