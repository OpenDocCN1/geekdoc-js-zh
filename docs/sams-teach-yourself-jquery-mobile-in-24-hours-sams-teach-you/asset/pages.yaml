    # Summary


    In this hour you learned about licenses for software and images. Some licenses
    permit you to use the work for free as long as the work is noncommercial, while
    others require a fee. You learned how to find icons, icon sets, and stock images,
    and you learned how to include and use plug-ins with jQuery Mobile. Finally, you
    learned about using custom fonts inside your jQuery Mobile projects by either
    the @font-face method or Google Web Fonts.


    # Q&A


    +   Q. If I find something on the Internet and there''s not a license posted with
    it, is it free?

    A. Unfortunately it is not free. Code that is posted on blogs is considered copyrighted
    by the original author. While the author may not choose to pursue and take action,
    it is much better to ask permission, even if it''s just in a comment to the author
    for permission to use the work.

    Q. Why do some software releases specifically use the GPLv2 instead of the newer
    GPLv3? Shouldn''t they use the newer version?

    A. Authors can decide for themselves which version of any license they want to
    attach to their software. The GPLv2 is still considered a good license for developers,
    and some developers do not feel the need to attach the newest version to their
    software.

    Q. You mentioned earlier that using images lose SEO. How exactly does a custom
    font help me gain the SEO back?

    A. SEO is a funny thing because it changes often; machines still have restrictions
    when it comes to reading images. Most search bots do not take the time to even
    process the images. They see an img element and index the alt text for the image.
    When you use a custom font, your original text is still on the page and will be
    indexed by the bot when it makes a sweep through the site. This way you can put
    your text inside an h1, h2, or h3 tag and get the full weight of the text instead
    of an alt tag reference.'
