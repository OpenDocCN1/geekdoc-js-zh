    # Summary


    This hour covered several of the events available when using jQuery Mobile. You
    should now have a good idea of how to tie an event to element and when it will
    run. You saw that many events rely on the use of the pageinit event.


    You learned about the use of touch events including tap, taphold, swipe, swipeleft,
    and swright. You also learned about the virtual mouse events and how they can
    be used to normalize event handling between desktop and mobile browsers.


    # Q&A


    +   Q. Is it possible to use a hover on a mobile device?


    +   A. Not exactly. Because a hover is similar to a mouseover event, it can be
    triggered. However, when your finger is removed from the screen the virtual mouse
    will also be removed making the code running in the mouseover event no longer
    function. You can create a pseudo-hover by attaching a mouseover event to an element
    and then assigning another mouseover event to every other element in the DOM that
    will close, cancel, or complete the code from the first mouseover. This is an
    expensive and somewhat clumsy solution, but it is possible.'
