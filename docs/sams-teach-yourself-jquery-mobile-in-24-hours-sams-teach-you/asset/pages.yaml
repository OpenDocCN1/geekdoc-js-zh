    # Extended Input Elements


    Mobile devices have a few new ways of collecting user input. Some of these ways
    have existed with desktop browsers for some time, but they are not used enough
    to be considered common. When thinking about the various control or input features
    of a mobile device, often included is a slider to change settings, a flip toggle
    to change from one setting to another, and a search feature. All three of these
    are supported in jQuery Mobile.


    # Slider


    The slider is typically used on pages where a user would click and drag or tap
    to select a value rather than type it. The slider great great for use as a volume
    control, brightness or opacity control, and even for use on pages that perform
    calculations. Take a look at the following code and see whether you can tell what
    each attribute does.


    ```

    <input type="range" name="slider" id="slider" value="10" min="0" max="100" />

    ```


    The attribute `type="range"` is what jQuery Mobile looks for to create the slider,
    and even though it is a `type="range"`, it is still called a slider. There isn''t
    anything special about the `name` and `id` attributes; they work just like they
    do with other input elements. The `value` attribute, however, is important because
    it sets where the slider button or handle starts. The'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'min attribute sets how low the slider can go, while the max attribute sets
    how high the slider is allowed to go.


    You should use a label with each slider you include on your page. This should
    be done not only for display and accessibility reasons, but also because it is
    required when using jQuery Mobile. Listing10.6 shows a form with three sliders
    taken from a page using jQuery Mobile.


    # LISTING 10.6 Using Sliders Inside a Form


    ```

    1: <form id="volume" name="volume" action="volume.php">

    2: &nbsp;&nbsp;<div data-role="fieldcontain">

    3: &nbsp;&nbsp;&nbsp;&nbsp;<label>Bass</label>

    4: &nbsp;&nbsp;&nbsp;&nbsp;<input type="range" name="" id="min" min="10" max="110"
    value="80" />

    5: &nbsp;&nbsp;</div>

    6: &nbsp;&nbsp;<div data-role="fieldcontain">

    7: &nbsp;&nbsp;&nbsp;&nbsp;<label>Mid</label>

    8: &nbsp;&nbsp;&nbsp;&nbsp;<input type="range" name="" id="min" min="0" max="90"
    value="80" />

    9: &nbsp;&nbsp;</div>

    10: &nbsp;&nbsp;<div data-role="fieldcontain">

    11: &nbsp;&nbsp;&nbsp;&nbsp;<label>Treble</label>

    12: &nbsp;&nbsp;&nbsp;&nbsp;<input type="range" name="" id="" min="5" max="105"
    value="80" />

    13: &nbsp;&nbsp;</div>

    14: </form>

    ```


    You can see that we used div containers on lines 2, 6, and 10 to separate each
    slider from one another. We also included labels for each slider, and because
    the container has the data-role="fieldcontain" attribute, it attempts to put both
    label and slider on the same line.


    There is only one curve in this example. You may not notice it immediately, but
    when you look at Figure 10.6 you can see that though each slider has the same
    value, it shows up in a different place on each slider. This is because I changed
    the min and max settings of each slider. Keep this in mind when you build sliders
    on your page.


    # Flip Toggle Switch


    The flip toggle switch is pretty much a binary toggle. It is turned on, or it
    is turned off. This is common in settings where you turn parts of your mobile
    device on or off.


    To create a flip toggle switch you need to start with a select element that has
    two option elements. You then need to add an attribute of data-role="slider" to
    the select element. Just like the other input elements, you also wrap the flip
    toggle switch inside a container with the data-role="fieldcontain" to keep the
    label and the flip toggle switch on the same line (if room is available). Listing
    10.7 shows two flip toggle switches being set up on a page using jQuery Mobile.
    One is placed inside a div element with the data-role="fieldcontain"'
