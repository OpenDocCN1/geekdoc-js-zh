- img_proc: true
  md: 'means “No Case”, meaning that it will ignore the case of the characters in
    the regex. Line 4 shows what happens when the condition from line 3 is met. The
    URL that is listed should be where you want the mobile user to go. The [L,R=302]
    means two things actually; the L means that it is the last rule that should be
    processed by the RewriteEngine, and the R=302 means that the browser will be told
    that the original page has been temporarily moved.


    While this is a great start, this regex will not work for all mobile devices.
    In fact, if you open a different mobile device, say a BlackBerry and browse to
    where the .htaccess file is running, it will not trigger the mobile redirect and
    will be treated to the original site. To accurately create your perfect regex
    you should look at your server logs and view the different UA strings of viewing
    your site and add entries to your regex based on that data. Several catchall scripts
    and regex strings are available as search results from your favorite search engine
    all as you can. Keep in mind before you push into your production environment
    that every script should be looked over carefully and still compared with your
    server logs to see whether it is.


    To get a summary of using the .htaccess file for detecting and redirecting mobile
    devices let’s take a look at the pros and cons.


    The pros of using the .htaccess file for mobile detection


    +   * Fairly easy to manage

    * Works at the server level without reliance on client capability

    * Does not require any other server-side languages


    The cons of using the .htaccess files for mobile detection


    +   * Can be a strain on the server

    * Can create possible redirect loops

    * Does not natively work with all web servers


    If you have access to your server configuration file (usually a file named httpd.conf),
    you can do all your rewriting inside this file. This has the added benefit of
    loading into memory rather than being evaluated on every request.


    For those who do not want to mess with any type of configuration file, but still
    want the server to handle the detection and redirection of mobile devices, you
    can use server-side languages to get the job done. Let’s take a look at doing
    this with PHP.'
