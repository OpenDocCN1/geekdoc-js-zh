    #  Radio Buttons and Check Boxes


    Radio buttons are useful when you want to present more than one option to the
    user but have the user select only one of them. They remind them of multiple-choice
    tests, or those "fill in the bubble" forms. jQuery Mobile takes radio buttons
    a bit further than your standard radio button by using the label element to display
    the radio button on a touch-friendly bar.


    To create a radio button you start with an input element and then use an attribute
    of type="radio". You also want to give your radio button the value and id attributes.
    To make multiple radio buttons work together, you must give them all the same
    name. Your radio button should look similar to the following snippet:


    ```

    <input type="radio" name="radio-1" id="radio-1" value="Option 1" />

    ```


    You can group radio buttons together inside a div or a fieldset using a controlgroup,
    and they will display them without any breaks between them. If you use the fieldset
    element, you can also use the legend element to give a description for the group.


    If you want your radio buttons to appear horizontally you can use an attribute
    of data-role="controlgroup" and the attribute data-type="horizontal". This, however,
    makes your radio buttons appear as a row of radio buttons instead of a row of
    radio buttons.


    Check boxes are similar to radio buttons, but they allow the user to select as
    many of the options they want instead of just one. Just like radio buttons, you
    must include a label element for each checkbox element as jQuery Mobile uses it
    to create the touch-friendly bar. To create a'
  merge: -1
