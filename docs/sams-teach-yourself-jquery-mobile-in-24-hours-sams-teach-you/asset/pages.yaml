  md: '# Adjusting Layouts Based on Screen Size 283


    Since this is an addition to the style element, lines 1-4 show the styles we set
    to use up our mobile layout defaults. Line 5 shows our media query being set.
    Something to note about this query that we left out the keyword only and are using
    min-width instead of devicewidth. This is done to target a broader range of devices
    instead of particular device or set of devices. This also means that this media
    query will be compatible with all devices with a modern browser instead of just
    mobile devices. By combining this with jQuery Mobile, we get a clean consistent
    style across all devices.


    Continuing with line 6 we can see a comment that is left letting you know that
    anything inside this query is considered for tablets and devices with similar
    resolutions of a tablet. Line 7 shows that we are adjusting the base style that
    was originally set on line 3 to a width of 30% shows a similar change for the
    styles originally on line 4. Note that when you are using media queries, you must
    be careful to overwrite or reset styles that they display correctly. You can see
    that we are handling for that exact issue by resetting the margins with a margin:
    O of leaving the base styles as margin-left: 50%.


    Lines 9-12 are new styles set by using the jQuery Mobile default styles.


    Now that you''ve seen the style changes to the page, take a look at Figure 15.4
    and see what the site looks like on a tablet with the styles applied.


    ![](img/56578b432709a7220ba1c18b41eabe62_300_0.png)


