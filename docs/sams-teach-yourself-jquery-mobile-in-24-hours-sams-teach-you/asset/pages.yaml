  md: '# Sams Teach Yourself

    jQuery Mobile in 24 Hours


    ![](img/56578b432709a7220ba1c18b41eabe62_499_0.png)


    In just 24 sessions of one hour or less, Sams Teach Yourself jQuery Mobile in
    24 Hours will help you create mobile sites that adapt, respond, and display content
    on any leading device, delivering seamless experiences to all of your visitors
    from a single code base. With this title''s straightforward, step-by-step approach,
    you''ll learn to put jQuery Mobile to work with scannable codes, videos, CMS integration,
    and more. Every lesson we build on is what you''ve already learned, giving you
    a rock-solid foundation for real-world success!


    **Step-by-step instructions** carefully walk you through each chapter or common
    jQuery Mobile development tasks.


    **Quizzes and Exercises** at the end of each chapter help you test your knowledge.

    **Notes** present valuable additional information related to the discussion.

    **Tips** offer advice or show you easier ways to perform tasks.

    Cautions** alert you to possible problems and give you advice on how to avoid
    them.


    # Learn how to...


    +   * Quickly start using jQuery Mobile with HTML, CSS, and JavaScript

    * Create responsive layouts that automatically optimize for any smartphone or
    tablet

    * Detect devices and route them to specific areas of your area

    * Style jQuery Mobile user interfaces that control everything you see, touch,
    or gesture

    * Use events to create functionality for gestures

    * Choose and use the best video embedding/encoding techniques for each solution

    * Go beyond jQuery defaults with plugins and themes

    * Add jQuery Mobile to WordPress themes

    * Use scannable QR codes and Tags to track customers and point them to custom
    content

    * Work with device emulators and overcome your weaknesses

    * Use PhoneGap to bridge the gap between native and web applications

    * “Minify” your site to make it load and run faster

    * Master powerful new tips and tricks for better jQuery development


    **Phil Dutson** is Lead eCommerce Developer for ICON Health and Fitness, the world''s
    second-largest online fitness equipment retailer. There, he specializes in creating
    seamless customer experiences across multiple browsers and platforms. Dutson has
    worked on pioneering projects and solutions for NordicTrack, ProForm, Freemotion,
    Sears, Costco, Sams, and other leading firms. Dutson co-founded and managed The
    ECom DevBlog, a blog focused on web development solutions.


