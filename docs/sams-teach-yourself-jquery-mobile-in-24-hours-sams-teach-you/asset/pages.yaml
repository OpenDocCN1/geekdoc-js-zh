    Before you start your final testing you should know that not all the page transitions
    are supported when using PhoneGap and jQuery 1.1RC1. When a transition is not
    supported the default transition used is the "fade" transition, which causes the
    scene to "blink" between pages. Currently the "flow" transition that we are using
    in this application is not supported by Android devices running Gingerbread (Android
    2.3). If you decide to change the transition to "none" it will not display a transition,
    but will introduce a slight lag between button press and page load. Issues with
    page transitions will hopefully be fixed by the 1.1 final release. If this is
    a major set back for your application, you can fall back to jQuery Mobile 1.0
    where the basic transitions are supported.


    With page transition behavior aside remember when using an emulator you may get
    some odd behavior. Delay, blinking between screens, and even occasional failure
    to reorient the screen are all problems that may occur when using an AVD. If available,
    using at least one Android device for testing is ideal. To test with your Android
    device, put the device into USB debugging mode. This setting is located in either
    the Settings -> Applications -> Development or Settings -> Developer Options menu
    on your device. Once enabled plug USB'
