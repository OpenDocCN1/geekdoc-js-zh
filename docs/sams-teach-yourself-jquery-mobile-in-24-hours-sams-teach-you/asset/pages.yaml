- img_proc: true
  md: '# Additional Mobile Features


    sensor is to perform operations when the device is close to something. An example
    of this is automated screen operation when the device is placed in a pocket or
    to your head. A quick way to tell your phone has this feature is to take a call
    and check to see whether the screen turns off instantly when you place the phone
    up to your ear. When you pull it away, look to see whether the turns back on by
    itself.


    # Physical Keyboard


    This is another feature that you might not think about when you look at a mobile
    device. Some devices rely on software keyboards that display keys onscreen that
    they are touched or typed to. Other mobile devices have a full set of hardware
    keys that slide out or are placed below the screen of the device. It is important
    to be aware that not all devices have a keyboard, especially when designing form
    input or application controls that use hardware keys as shortcut.


    # GPS


    If your device contains a Global Positioning System (GPS), it has the ability
    to look for a network of satellites that are used to “fix” your location by using
    a series of coded radio waves and timestamps. This data is used by various applications
    for everything from plotting your position on a map, tracking where you''ve been,
    or even displaying your current speed and direction.


    Acquiring your position can take a few minutes so some devices include Assisted
    GPS. This works by using known positions of cell towers and other known access
    points to assist the GPS in determining your location.


    # Barometer


    Yes, some mobile devices come with a barometer sensor inside them. While this
    can help weather applications display air pressure and predict future weather
    at your location, the actual intent for this sensor is quite different. The barometer
    is actually included to assist the GPS unit. The barometer can get a better fix
    on your altitude and speed up the GPS acquisition of your location.


    # Camera


    Some devices have one camera on the back of the device. Other devices have two
    cameras, one on the back and one front. Generally the front-facing camera has
    a smaller megapixel count and is used for video chatting or for quick self-portraits.


    The camera included on most mobile devices can be used in a variety of ways. Some
    applications use the camera for simple picture sharing, while others use the image
    taken to reference against a library of similar pictures to identify it. Other
    uses of the camera include Alternate'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'Reality, which allows you to view the world through your mobile device while
    pictures, menus, routes, and guides are superimposed into the environment. A current
    trend with the camera in your device is to use scan Quick Response (QR) codes
    to view special promotions or to receive coupons for the item you are looking
    at. Figure 6.4 shows a QR code that you can scan with a mobile device.


    ![](img/56578b432709a7220ba1c18b41eabe62_121_0.png)


    FIGURE 6.4

    QR codes are popular for displaying text, address information, and links.


    Not all mobile devices include a camera, and some official application marketplaces
    will not be available if a camera is not included with the device.


    # Wireless


    Many mobile devices come with WiFi for network and Internet usage at home or at
    various business establishments. The 802.11 version of a wireless card inside
    varies per device. Some mobile devices opt for a cheaper 802.11g wireless card
    that may use less power to save battery, while other devices may include a 802.11n
    wireless card for possible increased speed and distance.


    Other mobile devices may include a 3G connection for cellular service. Other devices
    may also include 4G, LTE, WiMAX, or similar cellular technology for increased
    bandwidth, connection, and sharing. Generally devices that include cellular access
    capability cost more than their WiFi only counterparts. Also worth noting that
    while a data plan is required to use the cellular access, it can still be used
    with the cellular access turned off.'
