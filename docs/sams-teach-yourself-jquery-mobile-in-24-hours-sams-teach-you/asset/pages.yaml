  md: 'The Box Shadow submenu has three properties that you can change, COLOR, OPACITY,
    and SIZE. These settings affect anything the .ui-shadow class, including dialog
    windows. Changing the COLOR value makes the shadow use the specified value instead
    of the default value of #000000. The OPACITY value changes how transparent the
