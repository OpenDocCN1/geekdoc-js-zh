  md: '# Adding jQuery Mobile to Your Theme


    447


    ![](img/56578b432709a7220ba1c18b41eabe62_464_0.png)


    FIGURE 24.2


    The Starkers theme lives up to the name.


    # Adding jQuery Mobile to Your Theme


    Modifying a theme with jQuery takes some work, and while you may at first think
    that everything is done and perfect, there are bound to be some flaws. Although
    the way we are about to add jQuery Mobile to a theme does work, there will always
    be something that was missed or no longer supported as new versions roll out.
    Plug-ins also break the functionality of a theme, so be sure to fully test them
    before adding them to your live blog. like plug-ins, some widgets can also cause
    undesirable effects to occur including some formatting issues. To avoid of these
    issues now open, the administration section of the blog and the Widgets subnav
    under the Appearance section and remove both the Search and Recent Comments widgets
    from the Primary Widget Area. This can be done by clicking and dragging the widget
    to the left or expanding the widget and clicking on the Delete link. With those
    widgets gone, we are ready to start adding jQuery Mobile to your theme.


    Let''s start by editing the header.php file. A lot of code and included files
    go into this file, and it is included on every page. While I could tell you every
    line to replace or add, the easiest way to display this is to show the header.php
    file with the comments removed and the new code applied.'
