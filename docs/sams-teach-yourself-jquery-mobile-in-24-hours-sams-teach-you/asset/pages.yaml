  md: "# HOUR 6\nKnowing the Capabilities of Mobile Devices\n\nWhat You'll Learn in\
    \ This Hour:\n\n+   - The current screen resolutions of mobile devices\n- The\
    \ various extras mobile devices have\n- The current selection of mobile operating\
    \ systems\n- jQuery Mobile support for various mobile devices\n\nSince we have\
    \ been through the basics of creating a mobile site, in this hour we focus on\
    \ some of the aspects of a mobile device.\n\n start with the various screen sizes\
    \ and resolutions of different mobile devices and move on to understand the screen\
    \ depth. We then take a quick look at some current mobile operating systems and\
    \ finally finish out the hour discussing the jQuery Mobile support matrix.\n\n\
    # Understanding Screen Resolutions and PPI\n\nNot all mobile devices are created\
    \ equal, and not just in memory or processing power. The screen sizes of most\
    \ mobile devices are different and may vary significantly even when compared to\
    \ a previous version.\n\n's look at the iPhone as an example. Apple originally\
    \ created the iPhone with a screen size of 3.5 inches and a resolution of 320x480.\
    \ Apple continued using that screen size and resolution until the iPhone 4, which\
    \ has the 3.5-inch display but a substantially increased resolution of 640x960.\n\
    \nWhile that is great to designers and geeks who obsess over product specifications,\
    \ you may be asking yourself why the resolution matters and whether it has an\
    \ effect on anything.\n\n# Clearing Up Resolution\n\nResolution is the amount\
    \ of pixels displayed on a screen and is generally shown in a width-by-height\
    \ format. You may already be familiar with resolution and not realize it. For\
    \ years the"
  merge: -1
  pgno: 114
- img_proc: true
  md: 'most common resolution on a computer was 640×480. If we took that measurement
    as height that would mean the screen is 640 pixels wide by 480 pixels tall. As
    time moved on 800×600 became the next common resolution, and then 1024×768. Web
    development has been pushing a maximum width between 920 and 980 pixels over the
    last few years using this width fits the website inside a viewing resolution of
    1024×768 and only requires visitors to scroll vertically.


    Knowing what the average visitor screen size is, or what the minimum and maximum
    resolutions are can alter your website design and style. Visitors who attempt
    to view or use your site with a lower resolution than your design will only allow
    to see a small portion of it on initial page load. They can see your content,
    but they will be forced to scroll horizontally, and they may miss out on the message
    or any call to action you are trying to send. This is especially important to
    mobile devices and can be a design headache as you shift your design to handle
    the differences in various devices.


    Let me bring up more resolution example that is commonly viewed but not commonly
    thought too about. Take a moment and consider the television. I won''t spend time
    going into the specifics of how a picture is displayed on a television, but try
    to think about the last time you watched a program in Standard Definition (SD).
    Now think about the first time you watched a program in High Definition (HD).
    Did you notice the difference? After viewing a program in HD, watching will have
    softer edges and may seem to have a touch blur to everything. This is because
    of the resolution differences between SD and HD. The default resolution of SD
    is generally 640×480, while HD tends to be either 1280×720 or 1920×1080. The difference
    in resolution is also typically the reason why SD content on some HD televisions
    has a tendency to look blocky, distorted, or show artifacts as the lower resolution
    image is forced to be "blown up" to fit the larger resolution.


    Another factor to take into account is not only the resolution of the device,
    but the physical size of the screen as well. The physical display size and resolution
    go together to form pixel density.


    # Pixel Density


    Pixel density or Pixels Per Inch (PPI) is the amount of pixels that can be placed
    in a given area. Going back to the iPhone example, the early generation iPhone
    contained a resolution of 320×480 with a physical display size of 3.5 inches.
    After some number crunching, that gives a screen PPI of 163. The iPhone4 has a
    resolution of 640×960 and the same physical display size of 3.5 inches. This doubles
    the PPI to 326. The difference in density is due to the physical screen size and
    the amount of pixels that can be placed in that area, thereby increasing the resolution
    that can be displayed.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Understanding Screen Resolutions and PPI


    TIP


    # Calculating the PPI of a Screen


    To figure out the PPI of a display you need to know the physical size of the screen
    and the resolution that it displays. Starting with the resolution of the device,
    you can take the square root of both the width-squared and height-squared added
    together and divide it by the physical diagonal display size of the display. For
    example, a display with a 4-inch screen and a resolution of 480x800 would be calculated
    by the following:


    ```

    $\sqrt{480^2+800^2} = 932.95$\n932.95/4 = 233.24$ PPI

    ```


    While there are many heated debates over whether PPI matters with digital images
    when being viewed on a display, you can live by this guideline: It is not the
    PPI of the image that matters, but the overall resolution of the image and the
    device that is viewing it.


    Let me explain a little. Devices with a higher PPI will have a higher resolution,
    meaning that images appear smaller when displayed on devices with a higher PPI.
    A great example of this is when you look at an image on a monitor with a display
    resolution of 640x480 and then switch to a monitor with a resolution of 1280x1024.
    The image will be displayed twice as big as the 640x480 screen as it will be on
    the 1280x1024 even though the PPI of the image itself didn''t change. Figure 6.1
    and Figure 6.2 illustrate this.


    ![](img/56578b432709a7220ba1c18b41eabe62_116_0.png)


    FIGURE 6.1

    640x480 viewing an image that is 400px × 300px'
  merge: -1
  pgno: 116
- img_proc: true
  md: '![](img/56578b432709a7220ba1c18b41eabe62_117_0.png)


    FIGURE 6.2

    1280×1024 viewing an image that is 400px × 300px


    When dealing with mobile devices you need to be aware of the differences in screen
    resolutions so that images and buttons on your site are still big enough for users
    to access.


    Just in case you have started to wonder about common screen resolutions of mobile
    devices, the following is a list of current sizes. Note that in the list the width
    and height are generally reversed in most phones.


    +   * Quarter Video Graphics Array (QVGA): 240×320

    * Wide Quarter Video Graphics Array (WQGA400): 240×400

    * Wide Video Graphics Array (WVGA432): 240×432

    * Half Video Graphics Array (HVGA): 320×480

    * Wide Video Graphics Array (WVGA800): 480×800

    * Wide Video Graphics Array (WVGA854): 480×854

    * iPhone 4 (Retina™): 640×960

    * Wide eXtended Graphics Array (WXGA): 1280×800


    Figure 6.3 shows an overlay of these different sizes so that you can get an idea
    of just how different the viewing area and aspect are.'
