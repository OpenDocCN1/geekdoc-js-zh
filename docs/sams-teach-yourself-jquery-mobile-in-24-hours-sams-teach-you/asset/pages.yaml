    Now that we''ve seen how to add some embedded videos using popular video hosting
    and sharing sites, let''s take a look at how to add your own video.


    # Embedding Your Own Video


    If you prefer to have total control over your video files, you can always host
    the files yourself. This of course means that you''ll have to monitor your own
    bandwidth, and you''ll need to provide your own playback method. Luckily, HTML5
    can help with the playback method.


    Video playback has always been something wanted on websites. Unfortunately, early
    HTML standards left out the means for browsers to properly deal with video files.
    This in turn led developers to start seeking elsewhere for video playback. Flash
    was quick to dominate the Web, and several programs were developed to leverage
    some of the Flash code to allow users to view videos. Videos were encoded into
    flv (flash video) files and could be referenced through an swf object loader.
    Support for mp4 files was added to Flash in version 9. While that was and continues
    to work well for desktops, some mobile devices do not include Flash compatible
    browsers or even allow Flash to run on the mobile platform. This is where HTML5
    comes in.'
