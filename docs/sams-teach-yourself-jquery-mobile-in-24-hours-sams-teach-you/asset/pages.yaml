- img_proc: true
  md: '# Playing Device Detective with PHP


    You have seen how you can use an .htaccess file to rewrite the requests coming
    from mobile browsers to direct them to a mobile section or page of your site.
    While using that method works, developers seem to have a deeper knowledge of using
    PHP than they have of working with .htaccess files. PHP is an excellent language
    to start with because it is readily available on most host providers, and it runs
    with most servers that you can download and use on your own system.


    While it is impossible for me to cover everything that you can do with PHP in
    a couple of pages, I can show you how to detect the UA with PHP. To get started
    let''s take a look at a built-in PHP variable named $_SERVER.


    The $_SERVER is an array and contains many elements that you can use to find out
    information about the server as well as some information about the client visiting
    it. It is important to note that when using the $_SERVER variable, it may not
    always return values. Because some servers are configured not to pass some data
    to the PHP variable. Listing 17.2 shows the content of detect.php, a simple PHP
    file that being used to display some information using the $_SERVER variable.


    # LISTING 17.2 Using the PHP $_SERVER Variable


    ```

    1: <!DOCTYPE html>

    2: <html>

    3:   <head>

    4:     <title>UA with PHP</title>

    5:   </head>

    6:   <body>

    7:   <h1>Using PHP to detect UA</h1>

    8:   <p>The UA viewing this page is:</p>

    9:   <p><?php echo $_SERVER[''HTTP_USER_AGENT'']; ?></p>

    10: </body>

    11: </html>

    ```


    The file is really simple; it starts off on line 1 declaring the HTML5 DOCTYPE
    and continues setting up the page. In the body element of the file we can see
    that we have a few elements that are telling us what the page is, and what the
    UA of the device viewing the page is. Line 9 shows the PHP script used to actually
    get the UA. In PHP, echo outputs whatever it is after to the screen. By using
    the $_SERVER array object and passing HTTP_USER_AGENT into it we can retrieve
    the value that has been stored there. Depending on the browser we use when view
    the page, the information displayed changes. Figure 17.1 and 17.2 show the results
    of the page being viewed through a desktop browser and on an iPhone simulator.'
