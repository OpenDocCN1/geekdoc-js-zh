  md: '384 HOUR 21: Learning to Minify Everything


    # LISTING 21.4 The Minified Version of the Sample CSS File


    ```

    1: body(font-family:Helvetica, Arial, sans-serif;font-size:1em;margin:0;padding:0)

    header(height:90px;padding-left:15px;margin-bottom:10px)#content(padding:5px);

    width:950px)#footer(height:30px;font-size:80%;text-align:center)

    ```


    For Listing 21.3 I wrote out the CSS in such an easy to read, pretty-print, or
    paragraph-style format. When comparing to Listing 21.4, the immediate difference
    is that the CSS has been compressed to one line instead of 23. The second difference
    that you may have missed is that the semicolon has been removed from each section,
    and the space between property and value have been removed to save space. The
    changes are relatively small, but they do make a difference. The file from Listing
    21.3 is 297 bytes, while the file from Listing 21.4 is 219 bytes. This comes out
    as a file that is about 74% of the original file, or a savings of 26%. To learn
    more about how CSS is minified by the YUI Compressor, visit http://developer.yahoo.com/yui/compressor/css.html.


    The YUI Compressor is an excellent choice to start with compressing your JavaScript
    and CSS. While we are looking at compressing code, there is a similar compiler
    called the Closure Compiler. Let''s take a look at this compiler and how it works.


    # Using Closure Compiler


    Google has a project aimed at minifying JavaScript. The Closure Compiler also
    analyzes your JavaScript, and if there is code that is never used or is impossible
    to get to, it removes the compile. It also checks for code efficiency and changing
    your existing code into an efficient version if needed.


    Just like the YUI Compressor, the Closure Compiler is available as a .jar file
    that can be run from command line or terminal. If you do not have Java installed,
    a web UI is available that you can use to copy and paste your code for compilation.
    If that isn''t enough an API also can be used to build your own page that can
    be used to compile code.


    Let''s take a quick walk through each of these methods. Starting with the .jar
    file, the following line is executed to compile your JavaScript:


    ```

    java -jar compiler.jar --js filetocompiled.js --js_output_file compiledfile.js

    ```


    In the preceding line you can see that the compiler.jar file is used with the
    first argument or option being --js, yes it is a double-dash, and this specifies
    what the input file is. In our example our input file is called filecompiled.js.
    If you have more than one JavaScript file that you want compiled and put into
    the same output, you can specify another --js option. Just be careful the order
    you are feeding the scripts into the compiler or they may fail to run due to dependency
    problems. The --js_output_file specifies what the output file should be named.'
