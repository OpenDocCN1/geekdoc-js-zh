- img_proc: true
  md: 'Using this method you can include extra functions or libraries that you may
    want to run only on a mobile device. This is especially useful for libraries focused
    on touch events only.


    To summarize the use of JavaScript for detecting and redirecting mobile devices
    let''s take a look at the pros and cons.


    The pros to using JavaScript for mobile detection


    +   * The client does all the work.

    * Can be combined with AJAX to include files dynamically.

    * Not dependent on server technology to run.


    The cons to using JavaScript for mobile detection are


    +   * Can be ignored by turning off JavaScript on the client.

    * Code is visible in the page source.

    * Due to connection speeds a page may render before a script has finished executing
    causing possible site inconsistency for the user.


    Now that you know about using the server and client to detect a mobile device,
    let''s look at a completely different way of handling mobile devices.


    # Non-Detection Solutions


    The future of mobile browsing is changing rapidly, and the very definition of
    a mobile device is being challenged as the devices we take with us become more
    powerful and capable. Techniques that were used to detect mobile devices either
    do not work, or are working on the wrong devices. Another complication is the
    ability of mobile browsers to alter the UA that they send to the server. This
    makes UA-only detecting methods fail, or obsolete.


    While there are some great solutions such as the Wireless Universal Resource FiLe
    (http://wurfl.sourceforge.net/) that keep an expanding list of mobile devices
    and provide an API you can use for mobile device detection, you should consider
    some existing solutions to help combat mobile devices.


    # Using Responsive Design


    Creating a site that changes based on the viewing capabilities of the client seems
    like best approach. It is comfortable to users because they get an experience
    that feels like it has been tailored to fit their device. It has been gaining
    in popularity as more and more sites are taking this approach in handling mobile
    devices.'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'Current mobile devices tend to have browsers that support most HTML5 and CSS3
    features, making them ideal for use with a responsive design. Designs that these
    browsers generally have a big enough processor in them to handle a fair amount
    of images as well as JavaScript processing. This is important to consider when
    handling mobile devices.


    Device overload is becoming less of a problem, but it wasn''t all that long ago
    that I built a site that would routinely crash the mobile Safari browser. It was
    an elusive problem, and it wouldn''t happen every time the site was viewed. The
    problem turned out to be a couple of sprite images that were too large to be stored
    in memory and then referenced repeatedly when some elements were injected into
    the DOM. While this may not happen on current generation devices, older phones
    may be prone to problems similar to this.


    Unless you are planning your site or app to work with a specific list of devices,
    you need to rely on the use of analytics to give you clues as how you should change
    your site. Many analytics packages are available some open-source that you can
    compile and run on your server. For ease of use, I recommend using a Google Analytics
    (http://www.google.com/analytics) account and using it to get a feel for what
    your users are viewing your site, and how they arrive on your site. With this
    information you can make a more informed decision on what dimensions your site
    should be designed for.


    Another option you may need to consider with a responsive design is that some
    users may not want the responsive version of your site. While that may sound a
    little strange, there is one site in particular that whenever I visit, I instantly
    click on the Full View Site link. I do this because the mobile version of the
    site actually leaves out not the navigation menu I want, but also an entire section
    of the site. While I may be in the minority, the idea of visiting the full version
    of the site is something left out of most responsive designs.


    To summarize using a responsive design for handling mobile devices let''s take
    a look at the pros and cons.


    The pros to using a responsive design


    +   - No dependence on the client UA


    +   - Create an experience that fits a wide gamut of device resolutions


    +   - Does not require the use of a separate site to maintain


    +   - Does not require extra views, pages, or directories specifically for mobile
    browsers


    The cons to using a responsive design


    +   - May not work with legacy or "dumb" phone browsers.


    +   - The browser on the device must have either CSS3 support to run media queries,
    or it must be able to run JavaScript and a compatibility script.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '+   - Creating a successful responsive design can take a lot of time and planning.


    +   - Giving the user an option to view the full site is not generally offered
    and may need to be considered.


    Now that we''ve discussed a responsive design, let''s look at another way to handle
    mobile detection, without the detection.


    # Using jQuery Mobile


    Why bother checking for a mobile device at all when you can use a framework that
    handles mobile devices as well as desktops? The jQuery Mobile library makes a
    fabulous choice when it comes to dealing with cross-platform and cross-device
    browsers. Only a handful of frameworks allow you to create and manage a mobile
    site that behaves the same way as a desktop. With jQuery Mobile you know you are
    getting a well-tested, community-driven, and proven framework that is already
    included in everything from blogs to native applications.


    jQuery Mobile is an ideal solution because not only it work on most platforms,
    it contains a large amount of fallback support for legacy devices. That means
    when someone browses your site with a legacy device, they can still use it. While
    it''s true that site functionality decreases, it does not leave them without a
    means of navigating. Another reason that makes jQuery Mobile an ideal solution
    is that it can be blended with custom CSS and JavaScript allowing you to customize
    your site exactly how you want. You can still use a responsive design with jQuery
    Mobile, and you can include other plug-ins to extend functionality.


    To quickly summarize the use of jQuery Mobile as a method for handling both desktop
    and mobile devices, let''s take a look at some pros and cons.


    The pros of using jQuery Mobile are


    +   - No mobile detection needed, works on most devices.


    +   - Other utilities, plug-ins, and design methods can be combined with jQuery
    Mobile.


    +   - Part of the jQuery family.


    The cons of using jQuery Mobile are


    +   - The framework requires a download of assets including the jQuery library.


    +   - The AJAX navigation model can get a bit complicated when used out of place
    with template engines.


    +   - Some elements may look a little out of place when viewed on high-resolution
    screens.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Summary


    In this hour you learned not only why mobile detection should be considered, but
    also how to detect and redirect mobile devices on the server using a .htaccess
    file and PHP. It is also possible to use JavaScript to do some client-side mobile
    detection and redirection. These methods are all accomplished by reading the UA
    of the browser requesting to view the site. While the UA may be spoofed, it gives
    you a place to start with filtering any mobile devices.


    Finally you learned that sometimes it may be better not to direct a user to a
    special mobile page or site, but instead to leverage a responsive design or just
    use jQuery Mobile to handle all site visitors.


    # Q&A


    +   Q. How often do legacy devices really browse websites?


    +   A. Smartphones seem to be everywhere, but there are still many phones that
    are text-only or that use the Wireless Application Protocol (WAP). This all comes
    back to your own analytics; you will reality not know the frequency of legacy
    devices until you start tracking them.


    +   Q. When can UA detection fail?


    +   A. UA detection can fail when you are trying to target a specific browser.
    Many browsers have the same name in the mobile version as you use in the desktop
    version. This has happened in the past when attempting to Gecko based browsers
    (Firefox). When creating the regex strings you are going to, try to be as specific
    to the mobile device as possible. Even then you may run into trouble, so you need
    to test with many devices as you can (both actual devices and emulators), and
    you need to do periodic updates to the regex you are using.


    +   Q. I do not run an Apache server; I can still use a .htaccess file?


    +   A. A few servers support the use of .htaccess files, but for the most part
    they work only on Apache servers. You can, however, with a little work copy the
    settings from .htaccess files into your current server config. For IIS v7+ users
    you can actually do most things you would do in a .htaccess file inside your Web.config
    file. Other servers such as nginx have support for a module that can be used to
    perform redirection (http_rewriteModule). Take a look at your server guide and
    see whether there is a configuration file or module that works on your server.'
