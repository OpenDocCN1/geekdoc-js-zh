    # # Search Input


    The search input is a new type of input that is part of the HTML5 specifications.
    This input is an enhanced text field that has an icon to help users know what
    it is for. When the user starts typing an “x” icon appears that when tapped or
    clicked erases all the user text entry in the field.


    To create a search input, use the following one-line snippet


    ```

    <input type="search" name="search-input" id="search-input" value="" />

    ```


    With the other elements we have covered this here, be sure to include a label
    to increase your form accessibility. You can also use a container with data-role="fieldcontainer"
    to keep the label and search input on the same line when enough room is available
    onscreen. Listing 10.8 shows two inputs being created.


    # LISTING 10.8 Creating Search Inputs


    ```

    1: <form id="search-form" name="search-form" action="search.php" method="get">

    2: <label for="search-1">The site:</label>

    3: <input type="search" name="search-1" id="search-1" value="" />

    4: <div data-role="fieldcontainer">

    5: <label for="search-2">Find:</label>

    ```'
