- img_proc: true
  md: '![](img/56578b432709a7220ba1c18b41eabe62_264_0.png)


    ![](img/56578b432709a7220ba1c18b41eabe62_264_1.png)


    # Summary


    In this hour you learned about the theme framework included with jQuery Mobile.
    The theme can be controlled by using classes or by using the data-theme and data-content-theme
    attributes on page sections.


    You learned that you can apply a custom icon set using CSS, and if you replace
    the included sprite files you still use the built-in classes to call your sprite
    images. You learned about the swatch system and that swatches are designated by
    any letter from a to z . Of these letters, the first five are already included
    by default with jQuery Mobile and may be modified or extended.


    Finally, you learned how to create a swatch based on one of the included swatches,
    and how to include it in an external file to your page.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Q&A


    Q Do I have to keep the default styles that are included with jQuery Mobile?


    No, the jQuery Mobile team included the first five swatches as an example of what
    can be done but expects you to modify, break, extend, and play with any and every
    style include.


    Q How many themes can I use on my site?


    Many sources on the Internet reference "theme" and "swatch" interchangeably creating
    some serious confusion. That said, you are allowed one theme that can contain
    up to 26 swatches. You can mix and match various parts of the swatches to create
    a unique blend of swatches.


    Q Can I use a custom icon set that doesn''t match the included one—for example,
    a sprite that uses images that are separated by a single pixel instead of 18?


    Yes, you just need to make sure that you create the classes to back up your custom
    sprite set. As long as you reference the sprite file and your custom classes the
    icon set works with jQuery Mobile just like it would with any other site.


    # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. What data attribute is used to apply a swatch to an element?


    +   2. What is the default icon size in the included sprites?


    +   3. True or False: Mobile browsers load both the standard icon set and the
    high-resolution icon set.


    +   4. How does jQuery Mobile include fallback support for legacy browsers in
    regards to swatches?


    +   5. True or False: You can overwrite any of the included swatches with your
    own styles.


    # Answers


    +   1. You can use data-theme or data-content-theme to apply swatches.


    +   2. The default icon size is 18px for regular screen resolution and 36px for
    high-resolution or Retina displays.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '3. False. The files are referenced in CSS and downloading them is determined
    by a media query. If the mobile device is unable to use the icon file, it will
    not download it.


    4. Each swatch includes several lines of browser-specific styles to add support
    for most mobile browser types. This helps to make sure that your swatch appears
    as close to the same as possible in cross-browser situations.


    5. True. You can alter, edit, change, modify, remove, and add as much as you want
    to any swatch style. In fact each swatch is commented to help you know what you
    are modifying and why a particular line was included.


    # Exercises


    +   1. Either find a different sprite set online or open an image editor and change
    the sprite files that come with jQuery Mobile and load them on a page.


    +   2. If you have access to a few mobile devices try loading a page on all of
