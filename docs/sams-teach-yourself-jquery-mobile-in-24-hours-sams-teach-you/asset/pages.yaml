    Lines 23-26 close the remaining elements that are still open.


    # Full-Screen Playback


    Not all devices handle videos the way they think they might. Several devices automatically
    play the video in full-screen mode as soon as the play button is clicked. Other
    devices may even default to the built-in video player of the device. Even the
    behavior at the device may vary. Some devices leave you on the video screen in
    case you want to watch it again, others return to the page that contains the video.
    When you are not expecting this behavior, you may think that your site is broken.


    Figure 18.2 shows the page rendered on a mobile browser.'
