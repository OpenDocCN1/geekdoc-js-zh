  md: 'Rendering Quick Response Codes 373


    ![](img/56578b432709a7220ba1c18b41eabe62_390_0.png)


    FIGURE 20.7

    Using a dark background and a white or light foreground causes the QR code to
    fail.


    Experiment to find color combinations that work when mixing background and foreground
    col-ors. Sometimes odd combinations, such as a lime-green background and a blue
    foreground, will-work as shown in Figure 20.8.


    ![](img/56578b432709a7220ba1c18b41eabe62_390_1.png)


    FIGURE 20.8

    Green and blue work as they create a high enough contrast to be scanned.


    Another option you have for customizing the QR code is to change the image or
    include others inside the code. Let''s take a look at what you can do.


    # Custom Images


    When creating codes with data redundancy or a high level of error correction,
    you can mess up the image on purpose to make something more unique and brand fitting.
    When modifying the QR code, it is important that you pay attention to the four
    location boxes. Three of them are'
  merge: -1
  pgno: 390
- img_proc: true
  md: 'black boxes with a white inner border and then a black square. These are located
    in the top-right, top-left, and bottom-left. On the bottom-right is the fourth
    box. It is similar but contains fewer pixels or boxes. These boxes help the scanner
    orient itself to the code, if you can avoid covering them, it helps. You can still
    place or stylize them a little, but stay away from covering them completely. You
    also need to stay away from a line that exists between the top-left and top-right
    boxes, as well as another line between the top-left and bottom-left box. These
    lines extend between the closest inside corners of the boxes. Figure 20.9 shows
    a guide you can use for areas that you should avoid.


    ![](img/56578b432709a7220ba1c18b41eabe62_391_0.png)


    **FIGURE 20.9**

    Areas to avoid when modifying QR codes


    By looking at the guide, the light gray frame that borders the entire figure is
    called the quiet zone. The quiet zone helps the scanner find the area where the
    QR code is. The dark gray areas near the three large black squares are where the
    information about the QR code structure is stored. If you edit these areas, your
    code may fail to scan at all. The other boxes can be slightly modified, but than
    changing the color, you may not want to modify them too heavily. For an exact
    detail of areas that are safe for editing, visit the entry for QR code at Wikipedia
    (http://en.wikipedia.org/wiki/QR_Code).


    Figures 20.10 and 20.11 show a couple of QR codes that have been altered to display
    custom images. When using custom images inside a QR code, they can be color or
    black and white.'
  merge: -1
  pgno: 391
- img_proc: true
  md: '![](img/56578b432709a7220ba1c18b41eabe62_392_0.png)


    FIGURE 20.10


    The logo inside the QR code allows the code to be scanned.


    ![](img/56578b432709a7220ba1c18b41eabe62_392_1.png)


    FIGURE 20.11


    The stylized QR code still works even with rounded edges.


    Remember that not everyone uses the same software to scan your codes, so it is
    best to test with as many devices and scanners as possible. Now that we know about
    generating and styling codes, let''s take a look at creating Microsoft Tag codes.


    # Generating Microsoft Tag Codes


    Microsoft created a unique code of its own that can be used to serve content to
    mobile devices just like QR codes. Currently the only thing you need to get started
    is a Windows Live ID account. As soon as you create one, you can start generating
    codes and distributing them.'
  merge: -1
  pgno: 392
- img_proc: true
  md: 'The benefits of using a Tag over a QR code include the ability to edit the
    Tag at any time. This is especially helpful when you find you have generated a
    QR code that has a typo encoded into it, when a link no longer points to a correct
    domain, and even when contact information has changed.


    Let''s take a short walk through creating a Tag code.


    # # Generating a Tag


    The easiest way to start generating your own Tags is to go to http://tag.microsoft.com
    and click the Sign In link. Create a Windows Live ID, or sign in with an existing
    one. After you have signed in, you will be at the Tag manager. From here you can
    manage all Tags and create new ones. Find the Tag button and click it. This takes
    you to a new screen where you can choose the details of the Tag that you are generating.
    On this screen you can type in a Tag Title that will be shown when the Tag is
    scanned or as displayed in the history section of the Tag app. You can also choose
    the type of Tag you want to generate. Following is a list of the types of Tags
    you can create:


    +   * URL—This launches the URL in the mobile browser when scanned.


    +   * App Download—This allows you to create a URL that is opened by the device
    that scans the Tag. If the device is not supported, a default link is used instead.
    This is handy for creating links to files or marketplaces for installation.


    +   * Free Text—This works just like a plain text encoding inside a QR code. The
    maximum size for text storage inside a Tag is 1,000 characters.


    +   * vCard—This points to a vCard that can be imported into the mobile address
    book. Inside the editor you are given the option of uploading a vCard or typing
    all your details in number and having it generate one for you.


    +   * Dialer—This creates a prompt that allows the device that scans it to call
    a phone number embedded in the Tag.


    After choosing your type, you have the option of putting some notes in that help
    you organize your Tag or remind you what the Tag was created for. After the notes
    you can upload an image. This is actually a cool feature. When Tag is scanned
    the picture you uploaded is downloaded to the device and shows in the user''s
    history. This helps the user remember your brand, name, or content. The next feature
    allows you to change the start and end dates of your Tag. That''s right, you can
    actually schedule your Tags'' available date. This allows you to get Tags printed
    and distributed without worry that someone is going to see your campaign before
    you want them to, and allows you to schedule the end of the campaign as well.'
  merge: -1
  pgno: 393
- img_proc: true
  md: 'Depending on the type you picked, the fields below allow you to fill out the
    details to finish your Tag. When done click the Save button and you are taken
    back to the management screen. From here you can download the Tag that you just
    created. When you choose to download your image you are given some options on
    how you want the code to be generated. Let''s look at the options and how to maximize
    them for your project.


    # Downloading a Tag


    When you download your tag, you are given the option of downloading a Tag Barcode
    (with a colorful triangle pattern drawn on it), a Custom Tag Barcode (uses colored
    dots instead of triangles), a QR code, or a Near Field Communication (NFC) URL.
    The default download option is to generate a Tag Barcode that will also add some
    text with a link to download a scanner. It will also be generated in color, but
    you have the option of generating it in black and white only. Figure 20.12 shows
    a Tag generated with the default options.


    ![](img/56578b432709a7220ba1c18b41eabe62_394_0.png)


    # Get the free mobile app at http://gettag.mobi


    FIGURE 20.12

    A Tag with help text and generated in color


    A Tag downloaded this way can be saved as a .pdf, .wmf, .jpeg, .png, .gif, .tiff,
    .tag, or URL (as a .txt file). The format options allow you to easily move the
    work to a graphics editing program such as Adobe Illustrator to get the Tag ready
    for print.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# 378 HOUR 20: Creating QR and Tag Codes


    The option of downloading a Custom Tag Barcode has the same basic options as the
    standard Custom Tag Barcode; however, you can only download a .pdf, .wmf, .tag,
    or URL (as a .txt file). When the file is downloaded, it contains colored or black-and-white
    dots instead of trian-gles. Using a graphics editing program or even PowerPoint,
    you can then embed an image into the code. Figure 20.13 shows an example of a
    Custom Tag.


    ![](img/56578b432709a7220ba1c18b41eabe62_395_0.png)


    Get the free mobile app for your phone

    http://gettag.mobi


    FIGURE 20.13

    A Tag that has been customized


    The interesting part about customizing a Tag is that you don''t need to worry
    about using the same color as the dots. You can blend into them and create some
    truly unique Tags and they still function. When creating a custom tag, you need
    to make sure that you leave the top and bottom white bars as well as the sidebars.
    If you save the file as .wmf, you can actually import the file into PowerPoint
    and overlay it on another image. This makes generating custom codes a quick and
    easy process, provided you have PowerPoint. You can learn more and see some examples
    by visiting http://tag.microsoft.com/what-is-tag/custom-tags.aspx.


    The option to generate a QR code allows you to download the code in .pdf, .wmf,
    .jpeg, .png, .gif, .tiff, and URL (as a .txt file format). Odd enough, it works
    just like a QR code, so there isn''t much to cover that we''ve gone over already.


    The last option to download an NFC URL allows you to download only a .txt file
    that contains the information needed for an NFC chip to be encoded with the data
    to make the chip detectable with NFC.


    After you download the file, you can then start using it just like you would with
    a QR code. One of the cool things is that the management page has a Reports link
    that takes you to an analytics page where you can view different stats about your
    Tags and how they are doing over a given timeframe.'
