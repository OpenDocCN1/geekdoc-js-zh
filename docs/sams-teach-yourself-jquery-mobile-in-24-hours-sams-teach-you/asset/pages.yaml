  md: '# HOUR 19

    Encoding Your Own Video for Mobile


    # What You''ll Learn in This Hour:


    +   - What a video container is

    - What popular codecs are available for mobile playback

    - Codec support on mobile devices

    - The settings to use to encode a video for mobile playback

    - Options available for delivering the video


    Last hour we learned about how to get an embedded video to play back in our application.
    Although we learned how to embed our own video, we did not see how to create the
    video that we used. This is what we cover in this hour.


    # Learning the Basics of Video Encoding


    Every time you open or watch a video file you are setting into motion a complex
    process of parsing and processing. To get started, let me give you a quick high-level
    view of how a video works.


    Each video file is made of at least one video stream and can be accompanied by
    several audio streams. When you watch a video file, the player must open the file
    and determine what data is available and how to display the video content on the
    screen and the audio content through your sound system. To make matters worse,
    video files can contain only audio, and they can contain only video. Let''s take
    a closer look at why this is possible by learning about the video container.


    # Video Containers


    When most people talk about video files they seem to leave off what the file actually
    is. While techies obsess over the actual extension and container used, people
    in general have no idea what goes into a video, and what it does. To put it plainly,
    a container is exactly that—a file'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'that can contain data. You can think of a container as a box that has room
    inside to hold or contain audio and video data. Figure 19.1 gives a diagram of
    a container.


    # Container


    ![](img/56578b432709a7220ba1c18b41eabe62_361_0.png)


    FIGURE 19.1

    A diagram of a basic container


    Now before you start trying to stuff all sorts of video and audio files into a
    text file under the idea that is a suitable container, each container has limitations
    on what and how much it is allowed to hold.


    If you are familiar with Windows, you may have heard about or even used .avi files.
    This file type was extremely common, and although it has now seen better days,
    can still be found today. A file with an extension of .avi is an Audio Video Interleaved,
    which is a generic description of what the file contains—a video stream and an
    audio stream. The default standard in Windows has changed to use the .wmv container,
    which stands for Windows Media Video.


    Macintosh users are no doubt familiar with the QuickTime .mov container. This
    container is still in common use today and can be played on other systems when
    QuickTime or another suitable player is installed.


    WebM is a container created specifically for web videos and can be used with HTML5
    video on Opera, Firefox, and Chrome. Internet Explorer supports it when a plug-in
    has been installed. Other popular containers are Ogg and Matroska (.mkv), which
    are similar to the MPEG-4 container but usually contain different codecs. Speaking
    of codecs, let''s take a few minutes and talk about what they are, and why you
    need them.


    # Codecs


    When videos are encoded, you use a coder/decoder to store the data. Both video
    and audio streams have different codecs that they can use to achieve a mixture
    of compression ratio and quality. Some codecs use a better compression method
    and can achieve a higher quality picture and sound than other codecs, but often
    require more processing power to decode the stream. This can create stuttering
    or frame skipping on the video when it is being watched. On'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Learning the Basics of Video Encoding


    the other hand, if you encode a video with very little compression you may end
    up with a file that is likely to be stream or too pixelated if you cut back on
    your quality.


    When dealing with mobile devices you have a limited number of codecs that are
    supported, and even fewer that are compatible with all mobile devices. Let''s
    start by looking at the available codecs for audio.


    # Audio Codecs


    Most videos have an audio track that is played back in sync with the video. Quite
    a few codecs available that can be used to encode the audio to be played back
    from a container. Keep in mind that many audio codecs are available, and this
    list is just of the most common that are compatible with mobile devices.


    # WAV


    WAV files are generally uncompressed audio files and are popular because of how
    they have been around and because they can be used with Windows, Macintosh, and
    Linux systems. Due to the uncompressed nature of this codec, files are extremely
    large. While you can use a WAV file for playback on mobile devices, you should
    really avoid using them in any video plan on streaming due bandwidth constraints.


    WAV codec summary:


    +   * Stored as .wav files.

    * One to two channels at 8000-44100Hz with 4-16 bits per sample.

    * Files must be less than 4GB each.


    # MP3


    A format that became extremely popular in the 1990s is the MPEG-1/2 Audio Layer
    III or MP3 codec. This codec is the audio compression used with MPEG-2 files are
    highly favored as their compression is great for storing files, and allow easy
    portability. Not all MP3 files are created equal; use some different bitrate than
    others. The bitrate controls the amount of compression used and the amount of
    room in the spectrum to contain the audio frequencies. Lower bitrates often sound
    distorted on frequencies (mostly during cym crashes). MP3 files are encoded at
    a Constant Bit Rate that gives a dedicated amount of space to the audio that limits
    how much space is available. Variable Bit encoding allows space to be shuffled
    from frequencies that are not currently in use to ones in an attempt to make the
    file stay small while allowing a more dynamic range of music to be heard. Regardless
    of some of the possible quality concerns, many online music stores including Google
    Music and Amazon MP3 use this format to distribute audio files. Due to the amount
    of mobile devices that support this codec, you should consider using it to encode
    your audio.'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'MP3 codec summary:


    +   - Stored as .mp3 files.

    - 1 to 5.1 multichannel at 16000-48000Hz at 32-320kbps.

    - Can be encoded in either a Constant Bit Rate or a Variable Bit Rate.

    - MP3 files do not contain Digital Rights Management.


    # Ogg Vorbis


    Another audio format similar to MP3 is known as Ogg Vorbis. This codec is copyright
    free and endorsed by both Opera and Firefox as being the preferred audio codec
    in HTML5 videos. Ogg Vorbis is occasionally referenced as just Vorbis. This is
    because Ogg is a container and Vorbis is the actual codec used inside the container.
    The Ogg Vorbis codec is versatile and can encode files at a bitrate anywhere from
    45kbps to 500kbps. It can also handle samples from 8kHz to 192kHz and even handle
    up to 255 discrete channels. When encoding, the quality levels range from -2 to
    10. This can make encoding somewhat of a chore as you may need to encode a file
    multiple times to make sure you are getting the quality you want. However, a quality
    level of 5 is generally a good value for use when streaming a file. As with all
    audio, though, your mileage may vary and you may be able to get by with a lower
    quality encoding.


    Ogg Vorbis codec summary:


    +   - Files are encoded by quality level.

    - The codec to use for video files played back in HTML5 on Opera and Firefox.

    - Capable of being encoded at higher rates than MP3.

    - Free from licensing and patent issues.


    # AAC


    Anyone familiar with ITunes or devices running iOS have used the AAC codec. The
    Advanced Audio Coding or AAC codec is a popular audio codec that can compress
    audio with more quality than that of an MP3 file of the same size. AAC files are
    versatile and have Digital Management solutions embedded into them. AAC files
    can be encoded in Constant Bit Rate or by Average Bit Rate, which is similar to
    the Variable Bit Rate that MP3 files use. AAC files can also be encoded in different
    profiles as AAC-LC (Low Complexity), HE-AAC (High Efficiency), and HE-AAC v2.
    Each of these profiles has a different amount of support and features in relation
    to compression, spectrum, and channel support. For three of the three mentioned
    profiles, HE-AAC v2 is the newest and allows a very high rate of compression;
    unfortunately this and the HE-AAC codec are not compatible with most mobile devices.
    AAC-LC, however, is'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'only compatible with most mobile devices, but is highly recommended for use
    as the audio codec used in videos you want to stream.


    AAC codec summary:


    +   - Newer than the MP3 codec.


    +   - Ability to compress with greater quality than other lossy codecs.


    +   - Contains multiple encoding profiles.


    +   - The AAC-LC profiles should be used for maximum compatibility.


    +   - Can contain Digital Rights Management.


    # NOTE


    # Lossy Listening


    The term "lossy" refers to compression methods that remove data to reduce file
    size. Because this data is deleted, it can never be returned and is a loss. Codecs
    that use this data loss are called lossy codecs for this reason. Audio codecs
    that retain all data are referred to as lossless codecs. These include FLAC, APE,
    Apple Lossless Audio Codec, and others.


    Now that we''ve covered a few of the codecs that can be used, let''s take a look
    at some of the video codecs available.


    # Video Codecs


    Just like audio, video also has codecs that are used for compression. The following
    is a list of video codecs that can be used with HTML5 and mobile device playback.


    # VP8


    VP8 is a relatively new codec on the field that is used with the WebM container
    with the Vorbis encoded audio stream. VP8 was acquired by Google and pushed as
    a replacement to the somewhat-legally challenged H.264 codec. VP8 is free to use
    it as it is released from Google under a free patent license. The quality of VBR
    is comparable to the existing H.264 codec. There is no official maximum bitrate,
    but keep in mind that the higher your bitrate, the more bandwidth it needs. Encoding
    with VP8 can be in Variable Bitrate (VBR), Constant Bitrate (CBR), and Constrained
    Quality (CQ). VBR works like some of the audio codecs. Sections of video with
    fast movement or color changes will be allocated more data bits, while sections
    that remain still will receive less data bits. Encoding your video with a CBR
    does not actually keep the bitrate constant all the time, but instead offers slight
    fluctuations in the data bit distribution. Encoding with the CQ setting is similar
    to VBR, but places a limit on how much'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'data can be spent in one section. When using the CQ setting, encoding the video
    with a two-pass system is highly recommended.


    VP8 codec summary:


    +   - Similar to H.264


    +   - Supports VBR, CBR, and CQ encoding modes


    +   - Capable of multipass encoding


    +   - Compatible with Opera 10.60+, Firefox 4+, Chrome 6+, and IE9 (with WebM
    MF plug-in installed)


    # Theora


    Theora is the video codec support by the Ogg container. Oddly enough, Theora is
    a spinoff of the VP3 codec (which continued to become the VP8 codec). In relation
    to quality and compression, it falls in the middle of the current offering of
    video codecs. It is currently a well-supported video codec when it comes to use
    with HTML5 video as it is supported by many modern web browsers. While other codecs
    focus on the bitrate to use, Theora uses a quality setting to adjust the bitrate
    as needed. When starting out with Theora, it is a good idea to make a few different
    files at vari-ous quality settings and choose the one that has the best balance
    of quality and file size for Internet delivery.


    Theora codec summary:


    +   - Similar to both H.264 and VP8


    +   - Encoding based on quality instead of bitrate


    +   - Compatible with Firefox 3.5+, Opera 10.50+, and Chrome 3.0


    # H.264


    H.264 actually has a few names. It can also be referred to as MPEG-4 Part 10 and
    AVC (Advanced Video Coding). I have been guilty on occasion of just referring
    to the codec as the container is usually stored in, it is mp4. The H.264 codec
    is extremely popular, and you can find support for it on many mobile devices including
    the Sony PSP and iPod Touch. Because the codec can also be used on Blu-ray discs,
    there are profiles that devices can certify to guarantee playback. Most mobile
    devices cannot play anything higher than the Baseline profile. While there are
    roughly 18 different profile settings, the three commonly found in encoders are
    Baseline, Main, and High. Each profile determines what features of the codec can
    be used. In addition to the profiles, you can also use levels to adjust the available
    data for encoding. The levels currently range from 1 to 5.2; however, most mobile
    devices do not support any level'
