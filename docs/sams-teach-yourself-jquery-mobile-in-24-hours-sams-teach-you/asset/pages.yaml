  md: 'While doing this does force the code to delay executing, it must wait until
    all elements have been loaded (including external images, banners, scripts, pixels,
    and so on). jQuery handles both of these problems by using the document.ready()
    function.


    The document.ready() function checks the DOM for the time when it can start executing
    your code. This way your JavaScript code can execute safely at the first possible
    moment.


    The caveat to this is that all your jQuery code needs to reside inside that particular
    function to execute. This adds protection to your scripts from failing on objects
    that may not exist when your script is called. Your script holds on execution
    until the document is truly ready for it.


