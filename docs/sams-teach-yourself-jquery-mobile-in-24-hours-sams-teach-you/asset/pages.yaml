  md: "# Learning About Swatches\n\nA swatch is a set of CSS rules that are applied\
    \ whenever the swatch is used. The swatches are labeled using letters of the alphabet;\
    \ the five swatches are labeled a, b, c, d, and e. Each swatch has a different\
    \ meaning when used. The first swatch, a, is considered the most important and\
    \ contains the highest level of visual priority. The second swatch, b, is considered\
    \ a secondary color, and the third swatch, c, is a neutral gray. The fourth swatch,\
    \ d, is considered a secondary level color palette. The fifth swatch, e, is considered\
    \ an accent swatch.\n\nWhen modifying your swatches you do not have to follow\
    \ this convention, but it does make for an easy-to-follow guide. Each theme can\
    \ have up to 26 swatches, with each swatch using one letter of the alphabet. This\
    \ allows you to create an extremely large amount of colors and options for your\
    \ theme.\n\nIf you were to open the default jQuery Mobile style sheet, you would\
    \ see a few sections related to swatches. Each swatch section is labeled so that\
    \ it is easy to find. Each section is also commented for readability and is roughly\
    \ 135 lines long. To get familiar with the swatch-section, Listing 13.5 shows\
    \ a 40-line snippet of the swatch.\n\n# LISTING 13.5 The First 40 Lines of the\
    \ Swatch of jQuery Mobile\n\n```\n.ui-bar-a {\n  border: 1px solid #2A2A2A /*a-bar-border*/\n\
    \  background: #111111 /*a-bar-background-color*/\n  color: #ffffff /*a-bar-color*/\n\
    \  font-weight: bold;\n  text-shadow: 0 -1px 1px #000000;\n  background-image:\
    \ -webkit-gradient(linear, left top, left bottom,\nfrom(#3c3c3c), to (#111));\
    \ /* Saf4+, Chrome *\n  background-image: -webkit-gradient(#3c3c3c, #111) \n \
    \ / Chrome 10, Saf.5.1 *\n  background-image: -moz-gradient(#3c3c3c, #111) /*\
    \ FP 3.6 *\n  background-image: -o-gradient(#3c3c3c, #111) /* IE 10 *\n  background-image:\
    \ linear-gradient(#3c3c3c, #111); /* Opera 11.10 *\n}\n.ui-bar-a input,\n.ui-bar-a\
