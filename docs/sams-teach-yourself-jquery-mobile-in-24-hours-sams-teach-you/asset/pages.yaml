- img_proc: true
  md: '# Summary


    In this hour you learned that compression matters as it helps to minimize the
    bandwidth needed for a user to experience the site. You have several options for
    minifying JavaScript with the YUI Compressor, the Closure Compiler, or the PACKER.
    Compressing CSS files is also possible and should be considered.


    You learned about server-side compression through the use of the gzip and deflate
    methods. Deflate can be enabled in the server settings of Apache or in a more
    restricted approach by using .htaccess files.


    You learned about image compression and what type of image compression should
    be applied depending on the needs of the image being compressed. Not all images
    are fully compressed when originally saved and may see improved compression by
    using either an image optimization service or program.


    Finally, you learned that an Apache module is available that allows to tackle
    everything from minified code and compressed images, to combined and zipped files.


    # Q&A


    +   Q. Why didn''t you mention WebP for image compression?


    +   A. WebP is an up-coming format that has some serious potential as a mainstay
    for images used on the Web. However, it is currently supported natively in Opera
    and Chrome. While techniques do exist to make WebP work in other browsers, I wanted
    to mention only types currently supported by the vast majority of browsers.


    +   Q. So is there anything I can do if my web host does not allow gzip or deflate
    to be used?


    +   A. Yes and No. Some people have had luck using a PHP script to attempt forced
    compression. The best thing to do is to contact your hosting company and ask them
    whether they support server-side compression and how to enable it. Most hosting
    companies already have a policy in place and will work with you when asked. Support
    for gzip in web browsers is nearly universal now as it has been supported since
    IE4, so some developers are uploading only zipped code. This forces browsers without
    support for gzip to not display zipped content, so if you take this approach your
    leeway may vanish.


    +   Q. Does the size of my image really matter and is 20KB or 30KB really big
    deal with broadband speeds as fast as they are?


    +   A. I would love to tell you that size doesn''t matter. I would also love to
    tell you that everyone has a fiber broadband connection. Unfortunately, though,
    neither of those is true. When dealing with mobile devices it gets even worse
    network latency and connection speed can vary in the same room. Search engines
    have also started ranking websites based on loading times. This means that if
    you cannot figure out how to deliver your site in 1 to 3 seconds, your ranking
    may slide. Every KB of size you can shave off your site helps.'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. True or False: Minified files can also be compressed with server-side compression.

    2. True or False: PACKED files should be used whenever server-side compression
    is not available.

    3. When should JPEG image compression be used?

    4. Why was PNG image compression not very popular?

    5. What is the maximum number of colors supported in a PNG file?


    # Answers


    +   1. True. Files that run through the YUI Compressor or Closure can be further
    reduced in size through the use of gzip or deflate on the server.

    2. True. PACKED files do not get any extra compression from gzip or deflate, but
    neither is available, PACKED files will become smaller than their minified counter
    parts.

    3. Whenever you are using a large image or picture you should use JPEG compression.

    4. Until recently, the PNG format was not fully supported in all browsers. Because
    GIF was widely supported there was no big push for developers and designers to
    start using PNG files.

    5. The maximum amount of colors that can be used in a PNG file is 281,474,976,656
    (48-bit).


    # Exercises


    +   1. Download or use one of the online code tools to minify your code. Compare
    the size of your original to the minified version. If you can, enable server-side
