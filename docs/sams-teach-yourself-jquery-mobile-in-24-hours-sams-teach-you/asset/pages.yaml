  md: 'The icons have been placed on the buttons, and we can see that the icons have
    all been placed to the left of the text on the buttons. This is the default behavior
    of icon placement on buttons. We can change the icon placement using the data-iconpos="
    attribute and a value of top, right, or bottom. It should not come as a surprise
    that the placement of the icon will be exactly where the value says to place.
    We can also use a value of notext to leave only the icon on the button and remove
    the text. This resizes the button to be barely larger than the icon itself and
    can come in handy when you need to place many buttons on a single line for a small
    screen. Listing 9.8 gives an example of buttons using different vertices to change
    the default icon placement.


    # LISTING 9.8 Examples of the Values Used in the data-iconpos Attribute


    ```

    1: <div data-role="content">

    2:   <a href="#" data-role="button" data-icon="back">Back</a>

    3:   <a href="#" data-role="button" data-icon="home" data-iconpos="top">Home</a>

    4:   <a href="#" data-role="button" data-icon="forward" data-iconpos="right">Forward</a>

    5:   <a href="#" data-role="button" data-icon="gear" data-iconpos="bottom">Config</a>

    6:   <a href="#" data-role="button" data-icon="info" data-iconpos="notext">information</a>

    7: </div>

    ```


    Line 2 locks the data-iconpos attribute as the icon will already be positioned
    on the left side of the button. Line 3, however, does include the data-iconpos
    attribute with the value of top. This will make the button taller than it normally
    be. Line 4 shows that our icon will be positioned on the right side of the button.
    We know this because the data-iconpos="right" attribute. Line 5 causes an icon
    to be placed under the button. Buttons that position icons under the text have
    the same height as buttons that have icons positioned above them. Line 6 is probably
    the most interesting button because it uses data-iconpos="notext". This really
    makes the button minimal and easy to place on even the smallest mobile screens.


    Figure 9.9 shows how our buttons now look with the icons located in different
