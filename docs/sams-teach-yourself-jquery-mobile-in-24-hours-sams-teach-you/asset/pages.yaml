    <div data-role="header" data-theme="e">Using the e swatch/hl</div>

    ```


    Figure 13.6 shows a page with this snippet of code in.


    # # Content Blocks


    Content block them can be a little tricky. The jQuery Mobile team suggests that
    you do not apply a data-theme attribute directly to the content section of your
    page. This is because of the potential that the content section will not take
    up the entire viewable space of the page. When this happens the background applied
    cuts off abruptly leaving you with a page that appears broken. Instead you should
    apply the swatch you wanted by using a data attribute on the element that contains
    the data-role="page" attribute.'
