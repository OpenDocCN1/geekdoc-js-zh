    # Brushing Up on Touch Events


    Whenever users interact by touch with your site they are triggering touch events.
    You can tap (pardon the pun) into these events to run custom functions.


    # Using Tap Events


    The main difference between a click and touchstart event is about 300ms. While
    that may not seem like a lot of time, 1/3 of a second delay can make your mobile
    site or application feel slow and unresponsive. The tap event is used by default
    on links, lists, and similar Query Mobile plug-ins and widgets, you can use the
    tap event to trigger custom functions on different elements on your page.


    You can also use the tap event on your pages. This event waits for almost an entire
    second before it is triggered. Listing 12.4 shows the contents of tap_events.html
    where both a tap and tapold event are being used on an image.


    +   LISTING 12.4 Using the tap and tapold Events


    ```

    1: <!DOCTYPE html>

    2: <html>

    3: <head>

    ```'
