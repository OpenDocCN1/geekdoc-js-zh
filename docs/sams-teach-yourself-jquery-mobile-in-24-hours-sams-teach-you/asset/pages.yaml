  md: "# Compressing Code 383\n\nThe first difference you probably noticed between\
    \ the two files is the number of lines used.\nListing 21.1 is nine lines while\
    \ 21.2 is actually just one long line. Continuing to compare them, you can see\
    \ that line 2 of Listing 21.1 there is a variable named value. This was renamed\
    \ to a in JavaScript. This will happen with many variables and values you use\
    \ when minify your JavaScript. The last major difference between the two files\
    \ is that the comments have been completely stripped out of the minified version.\
    \ So how much difference do these changes make in file size? The file in Listing\
    \ 21.1 is 222 bytes. The compressed file in Listing 21.2 is 103 bytes. That shrinks\
