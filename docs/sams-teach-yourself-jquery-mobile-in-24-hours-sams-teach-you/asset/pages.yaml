  md: "There are a few differences here compared to the base file so let's start at\
    \ the top and work down through the differences. The first change is the addition\
    \ on line 5 of the meta element that jQuery Mobile requires. The next additions\
    \ are found on lines 10-17. Line 10 is include for the jQuery Mobile styles, line\
    \ 11 is include for the jQuery library, and lines 12-16 are a custom script. The\
    \ script is used to disable the AJAX navigation that jQuery Mobile uses. This\
    \ has been disabled to administrative users getting errors and browser-lock whenever\
    \ they try to transition to the administration area with AJAX enabled. If you\
    \ are experienced with WordPress development, you may override some of the link-building\
    \ functions to insert a rel=\"external\" attribute on links that transition to\
    \ the admin area. For new to WordPress development disabling the AJAX allows you\
    \ to get up and running immediately.\n\nLine 17 shows the include for the jQuery\
    \ Mobile library. Continuing down the file, the next change is on line 26 where\
    \ a div element added containing the properties of data-role=\"page\" to make\
    \ it a, and id=\"qm-page\" so that we could tie the events to the page in your\
    \ JavaScript. Line 27 was also added to create the header of the page by using\
    \ a div element with the properties of data-role=\"header\" and data-position=\"\
    inline\". The inline style was used to block the included in the header. Line\
    \ 28 shows modification to the way we added to the header to give visible cue\
    \ for users to return to the home page. Line 31 shows that the data-role=\"navbar\"\
    \ property added to help style the section through jQuery Mobile. Also the line\
