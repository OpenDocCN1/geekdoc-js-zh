  md: '# Introduction


    There is little doubt that the way we currently access, use, and share the things
    we find online is going to continue to become more and more mobile. Every month
    thousands of new smartphones are activated and accompany their owners everywhere
    from trips to the grocery store to mountain hiking. As our thirst for connectivity
    expands into areas not possible a few years ago we need sites that deliver information
    quickly and easily, and that will work no matter what device we are using for
    access. This can be done with jQuery Mobile.


    Built on the popular and stable jQuery framework, jQuery Mobile can be utilized
    to transform existing sites into mobile-friendly ones. If you do not have a site
    yet, don''t worry starting out with a blank slate is a great way to see how simple
    and easy using jQuery Mobile is. Shortly you will have a site that handles as
    well on a mobile device as it does on a desktop.


    Getting into mobile site development is no longer an option; it''s a necessity.
    Even though the landscape is morphing for the mobile web as for the current desktop
    websites, using a framework like jQuery Mobile bridges the gaps between hardware
    and software platforms. This gives you the peace of mind that users can still
    use your site, even if they are on a legacy device that may fail to support many
    other sites today.


    # Key Features of This Book


    You''re not only going to learn how to use jQuery Mobile, you''re going to put
    it to work with scannable codes, videos, and CMS integration. Starting out with
    the basics we will build a simple web page to display information about you. You''ll
    then kick it up and learn how to customize your page by including a responsive
    layout so that small devices are shown content just for them tablet users get
    an optimized experience that takes advantages of the increased screen space. You
    also learn how to detect mobile devices and route them to special directories
    or sections of your site based on the User Agent.


    Mobile users also enjoy the use of rich site content, including videos that improve
    the user experience by providing a visual guide to a product or service. You learn
    about embedding videos as well as encoding video so that they play back on mobile
    devices as well as the pros and cons for each method.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    If you are marketing looking into the viability of a mobile project or endeavor,
    you''ll enjoy about the use of scannable codes to help track and direct mobile
    users to specific sites, videos, or text messages. These codes can be printed
    in magazines, manuals, and on product packaging to help users learn more about
    your product or sign up for updates.


    As progress hour by hour, you get a great foundation for mobile site development
    as well as gain valuable insight through the tricks, tips, and warnings scattered
    throughout. Twenty-four hours from now you''ll have a greater understanding of
    mobile site development and what needs to be done for your next project mobilized
    and into the hands of millions.


    # How to Use This Book


    This book is straightforward. It starts here in the introduction, and then moves
    onto the first hour. There are 24 lessons, each of which should take about an
    hour to complete. I tried to set up the book not only as a lesson guide, but also
    as a handy reference guide that you can keep around once. Since each hour covers
    a portion of the jQuery Mobile framework along with examples, this book should
    prove useful even if you use it for reference. While it is possible to quaff an
    energy drink and have this entire book finished in one go, I''d honestly recommend
    giving you your subconscious some time to process the concepts you learn in each
    hour.


    # How This Book Is Organized


    This book has been carved into four parts to help you focus or reference the section
    that best suits your level of learning or interest. They are


    +   - Part I, "Beginning jQuery Mobile," covers the basics, everything from HTML,
    CSS, and JavaScript to building a page using jQuery Mobile. If you are entirely
    new to the game, start right here, and you''ll be up to speed in no time.

    - Part II, "Creating the User Interface," teaches you about the user interface
    and how it is styled with jQuery Mobile. This is anything the user is going to
    see, touch, and use. This part even covers the use of events to help create custom
    functionality for gestures as adjusting the built-in theme manually.

    - Part III, "Customizing Your Content," takes you beyond the jQuery Mobile defaults
    and looks at adding plugin-ins, themes, responsive design, and device detection.

    - Part IV, "Extending the Mobile Experience," is all about taking it to the next
    level. Video integration, device emulation, minified code, creating an Android
    app using PhoneGap, and even adding jQuery Mobile to a WordPress theme are all
    covered here.'
  merge: -1
