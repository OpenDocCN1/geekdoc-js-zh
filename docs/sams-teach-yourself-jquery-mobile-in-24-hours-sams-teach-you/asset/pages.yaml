  md: '# HOUR 2: Working with HTML, CSS, and JavaScript


    to use be contained within this element. Line 3 contains the opening and closing
    tags of the head element. Generally the head element contains the title element,
    meta tags, links to CSS files, links to JavaScript files, as well as a few other
    custom or specialty tags. Line 4 contains the opening and closing body tags. The
    body element contains all the structure, the skeleton of your site. Along with
    standard HTML elements such as p, div, and ul, the body element may also contain
    inline JavaScript as well as links to external JavaScript files. Line 5 closes
    the html element and completes our HTML.


    TIP


    # Loading Files in the Head


    Your site will stop loading until all files in the head element have been downloaded
    and placed into memory. If you have large files or slow scripts included in your
    head element it can give the impression of a slow-loading or broken site. Unless
    these files are necessary to page functionality, it is best to put large JavaScript
    files just before the closing body tag.


    # Separation of Content and Presentation


    The current view of correctly using HTML and CSS is to use it as the separation
    of content and presentation. This is a good idea as you can easily create themes
    and then change the entire look of your site by changing the styles instead of
    the content. Some websites follow this model and have several different style
    sheets that allow you to switch the "theme" of the website.


    Content is handled purely (or as close to purely as possible) by HTML while anything
    that affects the way the data is displayed or rendered to an end user is handled
    with CSS.


    HTML tags that once were deprecated in changing the way fonts and text displayed
    to the user were deprecated in HTML 4 and replaced with newer tags that attempted
    to describe the content being placed within them.


    A short list of elements that had been deprecated but are again valid in HTML5:


    +   * <b>` is used to grab attention.

    * <i>` is used to declare an alternate voice or mood.

    * <s>` is used to display information no longer valid or relevant.


    Sections of code are generally divided using div tags. Inside these tags are subsections
    that usually contain your text. The text is generally grouped into paragraphs
    and contained in p tags. HTML5 introduces new tags such as article and section
    elements that behave similarly to div elements. Sections can also be divided by
    the new header and footer elements.'
