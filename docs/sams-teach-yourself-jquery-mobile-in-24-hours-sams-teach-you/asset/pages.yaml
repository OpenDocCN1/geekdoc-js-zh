  md: '# Praise for Sams Teach Yourself

    jQuery Mobile in 24 Hours


    Phil does a great job taking you through the mobile ecosystem and how jQuery Mobile
    makes it dead simple to break into it. Going from the fundamentals of web and
    mobile to advanced topics like video and them, anyone looking to gain greater
    knowledge in mobile development will profit from this book.


    **Brett Child**, Software Consultant, Software Technology Group


    "Sams Teach Yourself jQuery Mobile in 24 Hours by Phil Dutson is full of rock-solid
    real-world examples that can be easily built upon to create a functional, rich,
    custom, completely usable website.


    The book reads incredibly well; you find that the learning comes almost effortlessly
    as you read and work through the tutorials. In addition to learning the elements
    you need to build your own website, you''ll also learn how to extend and fill
    your mobile website with elements such as video and the creation and scanning
    of QR and Microsoft Tag codes. It covers the introduction of jQuery Mobile into
    WordPress and the development of Android-based applications using jQuery Mobile
    and PhoneGap. I highly recommend a read if you''re doing any type of mobile web
    development.


    **Drew Harvey**, Solution Architect, CrossView, Inc.


    "This book is an excellent resource for any developer looking to integrate jQuery
    mobile into their next project. Phil covers the fundamentals of jQuery mobile
    while also providing best practices for mobile development.


