    and how this helps reduce HTTP request blocking and perceived loading speed. That
    is a good practice on a standard HTML page, this will not work with all scripts
    when using jQuery Mobile. Because jQuery Mobile uses AJAX, scripts in the head
    element are considered to be "run once" scripts. If you have scripts that want
    to execute only on a single or center page you should either use the pageinit
    event, or you may include your scripts within the div element you are using as
    a page with the data-role="page" attribute.


