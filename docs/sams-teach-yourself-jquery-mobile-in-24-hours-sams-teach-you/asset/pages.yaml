    The other place on your page that you can use a navbar is in the footer toolbar.
    Let''s learn about the footer toolbar and what we can do with it.


    # Adding a Footer Toolbar


    Just like the header toolbar, the footer toolbar is added by adding an attribute
    of data-role="Footer" to a container element. There are a few differences between
    the header and footer toolbars. The footer toolbar does not automatically format
    the placement of links; this must be done manually through the use of custom styles,
    a layout grid, a navbar, or by using a controlgroup.


    Let''s start with a basic footer toolbar and then look at adding content through
    some of the other methods. Listing 8.6 shows the code needed to set up a footer
    toolbar.'
