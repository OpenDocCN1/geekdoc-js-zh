  md: '# HOUR 23

    Building an App with PhoneGap and jQuery Mobile


    # What You''ll Learn in This Hour


    +   - Why PhoneGap is ideal for web developers

    - The difference between native and web apps

    - How to create an Android project with PhoneGap

    - How to import a jQuery Mobile project into a PhoneGap project


    There has been some debate about building native applications or using web applications
    and while both sides have valid points, there are times when a web application
    either isn''t feasible or just doesn''t provide the device permissions needed
    to allow the application to function properly. This hour we spend some time looking
    at a project that helps bridge the gap between native and web applications.


    # Getting Started with PhoneGap


    PhoneGap started out as a project aimed at taking HTML5 web applications and making
    them available on mobile devices without requiring web developers to learn new
    languages to create native applications. PhoneGap currently supports features
    of the iOS, Android, Windows, BlackBerry, webOS, Symbian, and bada platforms.
    For a list of currently supported features for each platform, visit http://phonegap.com/about/features.
    At the Adobe MAX Conference in 2011 it was announced that PhoneGap would be acquired
    by Adobe. Adobe recently donated the original codebase of PhoneGap to the Apache
    Software Foundation where it has become the Apache Cordova project (http://incubator.apache.org/cordova).
    That being said, PhoneGap can be thought of as a project powered by Apache Cordova,
    or a distribution of Apache Cordova. PhoneGap is a framework that allows you create
    native applications. Let''s learn more about native applications, how to install
    PhoneGap, and how to create a project.


    # Going Native


    Native applications are built to run as standalone applications on the device.
    This means that they have been compiled and optimized for the device OS. Native
    applications are put into a'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# 420 HOUR 23: Building an App with PhoneGap and jQuery Mobile


    different sandbox of security restrictions and allowed access to different layers
    of the hardware inside the machine. For example, a native application is granted
    access to the device storage, accelerometer, camera, and hardware keys. Another
    positive of native applications is that they may not require an Internet connection
    or a cached version to function. Not all applications use device features, and
    some may not use features at all. Applications that are utilities generally do
    not use extra device features, although some check for and use an available data
    connection to push updates to the application.


    When creating a native application it is important to know the capabilities of
    each device you are planning to build for and plan for them. Not all devices will
    have a compass, accelerometer, or camera. They may also contain different screen
    resolutions and file system partitions. Some of these issues can be dealt with
    by the nature of your application, while others, such as layout controls, can
    be handled with responsive layouts and by using frameworks such as jQuery Mobile.


    # Installing PhoneGap


    PhoneGap is itself a framework, which means that the installation process is as
    easy as including it in your project. The downside to this is that depending on
    what platform you are programming for you will need to change how you include
    PhoneGap. To get started we need to first download the current version of PhoneGap,
    which is available at http://phonegap.com/download-thankyou. Once you have the
    compressed file downloaded, you can start installing the other prerequisites.
    Each platform has a list of requirements that must be met to develop for that
    platform. For our sample in this hour we are going to use PhoneGap with an Android
    project. We use Android because the Android SDK runs on Windows, OSX, and Linux,
    allowing anyone to create a sample project and test it. To develop with the Android
    SDK, you need to download the Android SDK as well as install Eclipse.


    # Downloading the Android SDK


    To start with the Android SDK, following these steps:


    +   1. Open a browser to http://developer.android.com/sdk/index.html and download
    the version of the SDK for your system. If you download a compressed file you
    only need to uncompress the file on your system and then run the android script
    or batch file.

    2. When the script or batch file is executed, the Android SDK Manager should appear
    and allow you to start downloading the pieces of the SDK that you want to develop.

    3. For testing across the most common Android devices you will probably want to
    download Android 2.3.3 (API 10 – Gingerbread), Android 3.2 (API 13 – Honey), and
    Android 4.0.3 (API 15 – Ice Cream Sandwich). As we learned before, to use an Android
    Virtual Device (AVD), you need to have at least one of these APIs downloaded.'
