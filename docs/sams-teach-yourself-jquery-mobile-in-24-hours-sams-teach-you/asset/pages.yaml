- img_proc: true
  md: '# Stylizing QR Codes


    Even though most scanners work better with a simple black-and-white QR code, you
    may actually get a better customer response if you stylize your code and give
    it a little personality. This can be done in a few ways. You can adjust the color
    and size, and include some custom imagery inside it. Let''s start with adjusting
    the color of the code.


    # Adjusting the Color


    The safest change you can make as far as color goes is to the foreground color.
    This can be done either by the generator or by processing the image in an image
    manipulation program by colorizing or selectively replacing the color. Figure
    20.4 shows a QR code that has a red foreground color and a white background. For
    those who are reading the black and white version of this hour, the figures can
    be viewed in color at http://jquerymobilein24.qr.


    ![](img/56578b432709a7220ba1c18b41eabe62_388_0.png)


    FIGURE 20.4

    The code will still be readable when enough contrast is available.


    You can also use a gradient on the foreground image to change the style as well.
    Figure 20.5 shows a QR code with a diagonal gradient, which starts with orange
    in the top left and transitions to black at the bottom right and is applied to
    the foreground color with a white background.'
  merge: -1
  pgno: 388
- img_proc: true
  md: '![](img/56578b432709a7220ba1c18b41eabe62_389_0.png)


    # FIGURE 20.5


    Gradients must still contain a high contrast to be scanned.


    If you decide to change the background color, you must remember to keep a high
    contrast between the foreground and background colors. Even with a high contrast,
    you cannot use white or any color that would appear lighter in contrast to the
    color behind it. A yellow background with a black foreground will work well, but
    a blue background with a white foreground will fail spectacularly. Figures 20.6
    and 20.7 show two QR codes with color backgrounds and foregrounds.


    ![](img/56578b432709a7220ba1c18b41eabe62_389_1.png)


    # FIGURE 20.6


    Using yellow and black provides enough contrast to be scanned.'
