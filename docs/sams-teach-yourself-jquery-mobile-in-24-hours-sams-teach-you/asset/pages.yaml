    # Aligning Content with a Grid


    A grid is just what it sounds like. It is a tool for placing objects to make them
    align. jQuery Mobile uses a grid system to help with content alignment. This system
    is useful as it helps to create a cross-device experience that takes the guesswork
    out of dealing with devices that have different dimensions than you originally
    planned for.


    The grid system in jQuery allows you to create columns of equal width. To apply
    the grid system to your container you need to add a class to the container you
    want to use the grid, and a secondary class to the items inside the container.


    Grid container classes are as follows:


    +   - ui-grid-a creates a two-column grid.


    +   - ui-grid-b creates a three-column grid.


    +   - ui-grid-c creates a four-column grid.


    +   - ui-grid-d creates a five-column grid.'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'Content classes are as follows:


    +   - ui-block-a is used on the first block.

    - ui-block-b is used on the second block.

    - ui-block-c is used on the third block.

    - ui-block-d is used on the fourth block.

    - ui-block-e is used on the fifth block.


    When using a container that has elements with content that is wider than the screen
    resolution, the content will be moved to a new row in the grid. This helps keep
    content organized and viewable.


    Figure 7.5 shows a page created without using the grid system.


