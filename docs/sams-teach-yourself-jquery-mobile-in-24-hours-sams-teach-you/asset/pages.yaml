    # # Adding Custom Fonts


    As soon as fonts were created, everyone wanted to use one of their own. I remember
    one of the first sites I built the font element, and I spent hours looking for
    exactly the right font to use. I didn''t know back then that anyone who didn''t
    have the font I wanted to install on their system such a much different site than
    I had created. Luckily the Web has moved forward, and several solutions have been
    developed to help overcome custom issues.


    For while any custom font work was done with images. There''s nothing wrong with
    that; in fact, it is a great way to make sure your fonts look exactly the way
    you want it to look. The downside of using images is that you lose accessibility,
    and SEO. This leads to what common fonts are available to use.


    # # Keeping It Generic


    Just about all computers and mobile devices have a set of common or generic fonts
    installed on them that are accessible by a browser. These fonts are called as
    safe fonts. These fonts are generally put together into a font family, and are
    applied using CSS. The idea is that when a font family is used, if the first listed
    is unavailable, the second font listed will be used instead. Each font in the
    font family should be similar to the one before it, with the first being preferred
    overall. A few web safe fonts listed in font family are


    +   * Arial, Helvetica, sans-serif


    +   * Times New Roman, Times, serif


    +   * Impact, Charcoal, sans-serif


    +   * Tahoma, Geneva, sans-serif


    +   * Lucida Console, Monaco, monospace


    While serif, sans-serif, and monospace may be used as generic fonts, you can also
    use cursive and fantasy. These fonts can be combined to create a custom font family
    that can be used on your site. A browser will do the best it can to match fonts;
    however, if it is unable to match the exact font it just defaults to a built-in
    system font. A good place to test we'
