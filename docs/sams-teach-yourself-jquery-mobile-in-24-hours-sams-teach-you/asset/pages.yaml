    # # Working with a Custom Theme


    Now that you have created your theme, you may just want to get started right away
    using it. We start by covering how to download your theme, and then we cover importing
    it back into ThemeRoller. This comes handy when you want to add another swatch
    or change a value that you missed. Finally we add a custom theme to a page.


    # # Downloading Your Theme


    ThemeRoller makes it easy to download and start using your theme immediately.
    There is a Download Theme link on the upper-left side of the main ThemeRoller
    page. By clicking on this a modal window appears and asks you to name the theme
    as well as gives you some brief instructions on how to include the theme in your
    jQuery Mobile pages. After you name your theme, click on that Download Zip button
    to begin your theme download.


    The zip file you download contains an index.html file as well as a themes folder.
    The file gives you a brief example of how your theme looks and gives you the instructions
    for including your theme on a page.


    Inside the themes folder that is inside your downloaded zip file, you find two
    CSS files. They have whatever name you gave your theme when you downloaded it.
    One of them contains the uncompressed full version of your theme, and the other
    contains a compressed or minified version of your theme. I recommend that you
    use your minified version in production and keep your uncompressed version for
    editing. There is also an image folder that contains the icons needed by your
    theme. These are the same image used by the default jQuery Mobile styles. Before
    we get to adding your custom theme to a page, let''s look at one last portion
    that I find useful, the ability to import an existing theme and work on it.


    # # Importing a Theme into ThemeRoller


    Occasionally you may run into a problem with a style that you had missed or overlooked,
    or you may need to add an additional swatch to your custom theme. Rather than
    using hack-and-slash or cut-and-paste methods of adding swatches to your theme,
    you can actually upload or import your custom theme into ThemeRoller and modify
    it there.


    To import your custom theme and continue working with it you need the uncompressed
    version of your theme. Open that in a text editor, select all the text, and copy
    it to your system clipboard'
