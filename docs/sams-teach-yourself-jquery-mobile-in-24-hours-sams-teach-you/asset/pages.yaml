  md: "# Summary\n\nIn this hour you learned that the three basic sections of a mobile\
    \ site are the header, the content area, and the footer. You put those elements\
    \ together on a page and had them render with the jQuery Mobile library in a browser\
    \ as a mobile site.\n\nYou also learned that you can use valid HTML inside each\
    \ section and saw that you can control the styling of the content within each\
    \ section using inline styles. Styles can also be controlled through an external\
    \ CSS file.\n\nYou learned how to add an image to the site and to make it scale.\
    \ Finally you learned about using multiple \"page\" elements in one HTML file\
    \ and how to use a button to navigate between pages.\n\n# Q&A\n\n+   Q. I see\
    \ mobile sites with a navigation section, a header or splash, and several call-to-action-buttons.\
    \ How does this fit into the \"three major sections\" of a mobile site?\n\n+ \
    \  A. A navigation section can be placed in multiple areas. Some navigation sections\
    \ are included in the header section while others replace the entire footer section.\
    \ As for callouts, many sites keep one in the header section, or have a static\
    \ location inside the content area that stays the same as you navigate through\
    \ the site. Many elements make up a mobile site. The \"three major sections\"\
    \ are a way to help you carve up your site and think about your layout.\n\n+ \
    \  Q. Can I use any HTML tags inside any section or just ones like you used? \n\
    \n+   A. Any tag, as long as it is a valid HTML tag, can be used. Some tags may\
    \ be styled by the internal theme system, but you can always override the style\
    \ or use a different tag. Tags that may fail are ones that are not valid or created\
    \ tags.\n\n+   Q. Why did we set the image to \"max-width:100%\",\n\n+   A. This\
    \ allows the image to scale itself. By setting the style to \"max-width: 100%\"\
    \ on all the image tags, we are telling the browser that the image cannot exceed\
    \ the parent container, but that it should be as close to it as possible. This\
    \ way, when the parent container is less the 100% of the image size the image\
    \ scales down to fit. Note that if you are viewing the mobile site on an older\
    \ browser, the image may still break out of the container.\n\n# Workshop\n\nThe\
    \ workshop contains a quiz and some exercises to help you check your comprehension\
    \ and understanding."
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Quiz


    +   1. Is jQuery Mobile only available when invoked through a CDN?

    2. Does jQuery Mobile use a custom DOCTYPE that works only with jQuery Mobile?

    3. How can you link to multiple pages if you only have one HTML file?

    4. Is a header absolutely required for the site to work when using jQuery Mobile?

    5. When changing the browser size or rotating the screen, what happens to the
    layout of your site?


    # Answers


    +   1. Of course not; jQuery Mobile can be used locally or from a CDN.

    2. No, jQuery Mobile uses the standard HTML DOCTYPE ensuring compatibility with
    future browsers and the HTML5 specification.

    3. When you set up your div elements that will be used for each page in your single
    HTML file you should give each one a unique id. Then whenever you want to link
    to another page you simply use the id of the desired page with a hash or pound
    symbol in front of it. For example you could set up a tag and set the href to
    a value of #pagethree and that would transition from your current page to the
    page with the id of "pagethree"

    4. While we did cover three major sections of a site, there is no rule that states
    you must have all three sections. Some sites get rid of the header or footer section
    altogether and use a navigation section or put an image there instead.

    5. jQuery Mobile detects the change and changes the size of your elements to match
    the new resolution or orientation.


    # Exercises


    +   1. Continue working with the mobile site and add another image to one of the
    pages. Try removing the style for the image and see what happens on your mobile
    when you use a larger image than the screen has space for.

    2. Modify the site some more. Remove the header and footer and replace it with
    a button, image, or leave blank. Add an external stylesheet and see what styles
    you can add to the header or footer replacement.

    3. View a few of your favorite websites on your mobile and see whether they redirect
    or offer you a mobile version of their site. Look to see whether they are using
    jQuery Mobile or some other framework to serve mobile content.'
