  md: '# # HOUR 16

    # Rolling Your Own Theme with ThemeRoller


    What You''ll Learn in This Hour:


    +   - What the jQuery Mobile ThemeRoller is us for

    - How to use ThemeRoller to create your own theme

    - How to import themes into ThemeRoller for editing

    - How to include a ThemeRoller theme in your site


    You already know that you can create your own theme by modifying an existing swatch
    or using a little cut-and-paste action. While you are still more than welcome
    to create your swatches and themes that way, there is another tool that was highly
    anticipated and is now yours to use and enjoy. The tool is called ThemeRoller,
    and if you are not already familiar with it, the time has finally come to start
    using it.


    # ## Introduction to ThemeRoller


    There are few different offerings from the jQuery family. For instance there is
    the standard jQuery library, the jQuery UI library, and the jQuery Mobile library.
    While the original library is used to help extend and make JavaScript faster and
    easier, the jQuery UI library was introduced to help developers create widgets
    and a common style that could be used to create a cross-browser experience. Developers
    who have used the jQuery UI library have undoubtedly heard at least of, if not
    dubbed, the ThemeRoller system that was originally created for that library (http://jqueryui.com/themeroller/)
    is similar to the jQuery Mobile ThemeRoller (http://jquerymobile.com/themeroller/).
    Both show the basic page elements and include an area to change the styles.


    The version of ThemeRoller available at the time of this writing is compatible
    with jQuery Mobile only to version 1.0. The new ThemeRoller that will be released
    the final release of jQuery Mobile 1.1 will have a utility to convert previously
    generated themes to be compatible with the 1.1 release of jQuery Mobile.'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'The jQuery Mobile ThemeRoller was developed with help from Adobe and features
    kuler (http://kuler.adobe.com/) integration. This means that you can load color
    swatches or even search for your own publicly shared color swatches.


    While it''s great talking about such a fantastic tool, let''s get into the nuts
    and bolts of actually using it.


    # # Creating a Theme with ThemeRoller


    Using the jQuery Mobile ThemeRoller is simple. When you load the ThemeRoller page
    in your browser you are greeted with a simple welcome message telling you that
    you can create up to 26 swatches and that it is recommended you create at least
    3 swatches for your theme. After acknowledging the message, you are dropped on
    a page that has a menu bar on the left and three separate swatch sections on the
    right. Figure 16.1 shows the default page after the welcome message has been acknowledged.


    ![](img/56578b432709a7220ba1c18b41eabe62_311_0.png)


    **FIGURE 16.1** ThemeRoller is ready to be used for theme creation.


    There are three ways to get started creating your swatch. You can use the color
    palette at the top of the page to drag and drop colors onto the theme-swatch areas
    below, you can use the inspector to select the portion of the swatch you want
    to edit, or you can just use the menu bar on the left to manually change any and
    all facets of the entire theme. Let''s take a deeper look at each of the three
    methods.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Using the Color Palette for Adjustments


    Along the top of the ThemeRoller page is a color palette that is stretched out
    into a single line. You can use this palette line to click-and-drag a single color
    from the palette to a swatch area. Depending on where you drag and drop the palette
    color, the swatch changes based on the color. For example, if you drag a color
    to the header element of a swatch, the header for that swatch switches to that
    color.


    You are not limited to the initial colors displayed on the color palette. Two
    sliders below them allow you to adjust the lightness and saturation of the color.
    By adjusting the lightness you can easily slide between the entire color spectrum
    of dark and moody to washed pastels. Changing the saturation level changes the
    intensity of the color. This gives you the option of getting eye-piercing neon
    colors and emergency reds as well as faded tones with a shred of color left in
    them. The slider method gives you a quick and easy way to move around available
    colors.


    There is no reset button on the lightness and saturation sliders, so if you see
    a color or two that you want to use them, before you make adjustments. Doing saves
    them to a set of color palette spots to the right of the main palette. These saved
    or recently used colors can be dragged and dropped just like the other palette
    colors so you can map out a color scheme before you drag and drop if you want,
    and then change colors on the fly after that. Figure 16.2 shows a screenshot of
    the color palette area including the adjustment sliders and recently used colors
    sections.


    ![](img/56578b432709a7220ba1c18b41eabe62_312_0.png)


    FIGURE 16.2 The palette is used to drag and drop colors to adjust your swatches.


    As can be seen in Figure 16.2, there is also the option of getting color schemes
    from the Adobe Kuler website. Clicking on the link opens a modal window that contains
    the newest additions to the Kuler website. To create your own you must register
    on the Kuler website (http://kuler.adobe.com) and create a public swatch. You
    can then use the search feature to find your swatch. For those who prefer not
    to jump through any registration hoops, I find that changing the display options
    in the Kuler model to “Search Colors” and typing in a color you want (red, blue,
    green, and so on) returns a great set of possible palettes to you. This even works
    on colors that you might not normally consider such as “carbon,” “violet,” and
    “predator.”


    Using the color palette is a fast and efficient way to get your custom theme started,
    but it doesn''t give you the full control that you want. Learn how to tune your
    theme, let''s take a look at it using the inspector tool.'
