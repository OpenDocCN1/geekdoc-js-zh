  md: '# Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. True or False: All mobile devices have the exact same pixel density.

    2. True or False: Mobile devices can come with a GPS included that allows users
    to see where they are on a map, or even how fast they are travelling.

    3. True or False: Some mobile devices cannot use cellular technologies for Internet
    access.

    4. True or False: Resistive screens respond quicker than conductive screens, allowing
    a smoother experience.

    5. True or False: All devices will work with all the features of jQuery Mobile.


    # Answers


    +   1. False. All mobile devices do not have the exact screen size or resolution;
    it would be impossible for them to all have the exact pixel density.

    2. True. Some mobile devices have a GPS included that can show where you are,
    how long it takes you to get there, and give a live update of how fast you are
    currently moving.

    3. True. Not every device that is considered mobile is connected through cellular
    networks. Many devices such as personal media players, tablets, or eReaders use
    WiFi to connect to the Internet.

    4. False. Resistive screens have a harder time tracking movement and may give
    the feeling of added lag when used.

    5. False. Unfortunately not all devices support all the styles or even the JavaScript
    required for jQuery Mobile to function fully. On the bright side, the jQuery Mobile
    team has gone to great lengths to include fallback support for legacy devices
    making sites built with jQuery Mobile still function on older or unsupported devices.


    # Exercises


    +   1. Either using your mobile device or a borrowed one, experiment with the
    various features of the device and see what apps have been developed that use
    these features. This may include weather applications that use the barometer,
    image apps that use the cameras, or even apps that track your walking, jogging,
    or biking.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '2. Determine what type of mobile OS and version your mobile device is currently
    running. Look at the version history online and see what features have been added
    up to the point of your device. Check to see whether you are even using the new
    features or whether there are ones that you should be using.


    3. Open the browser on your mobile device and browse a few sites. Check to see
    whether your browser can support multiple tabs or windows. Go to your app marketplace
    and search for other browsers. Read about them and see what extra functionality
    they give when compared to the stock or included browser on your mobile device.'
