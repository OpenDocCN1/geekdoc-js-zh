    file automatically. If you are not expecting this, you may think the tool is broken.
    Also you should know that you can only upload files under 1MB in size. This is
    a free service that you should look into. Visit http://www.smushit.com/ysmushit/
    to get started with the program. Using my test JPEG file, it'
