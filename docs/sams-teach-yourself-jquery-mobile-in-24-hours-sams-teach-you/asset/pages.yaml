  md: '# Summary


    In this hour you learned about the built-in support for links in the header toolbar
    and how to add a `navbar` to include more links. You learned about the footer
    toolbar and how to add buttons, how to use a control group to style them, how
    to apply a grid system, and how to use a navbar to contain your links.


    You also learned about positioning toolbars using the `fixed` and `fullscreen`
    positions. You learned that using fixed positioning will insert the toolbars whenever
    they are not detected in the current view, while using full screen will attach
    the toolbars above the rest of the elements on the page.


    You then learned about using a persistent `navbar` in the footer toolbar, and
    how to make buttons appear active when the page is loaded.


    # Q&A


    +   Q. What happens when I add more than five links inside a navbar? Does it break
    the header does when adding extra links?


    +   A. No, it doesn''t break. The `navbar` changes the formatting of the columns
    to display two columns and stacks the links below rows.


    +   Q. Can I apply my own custom styles to the header instead of using the built-in
    ones?


    +   A. Yes, you may always write your own CSS to style the header the way you
    want. This is actually something you may want to do to display custom pages or
    message pages.


