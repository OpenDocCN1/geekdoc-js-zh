  md: '# HOUR 15

    Responsive Site Layout


    What You''ll Learn in This Hour:


    +   - Understanding responsive design

    - How to use media queries

    - How to build a responsive page

    - How to change styles based on device orientation


    Creating a site layout that is responsive is not necessarily something that everyone
    needs, but when used can create a better layout and user interface. A responsive
    site layout gives you the ability to build your site for both large and small
    screen devices while allowing just the right amount of screen space to be used.
    There are a few different methods that you can use to attain a responsive layout
    including CSS3 media queries. Let''s start by learning how to use them.


    # Appreciating Media Queries


    A few years ago I was working on a project that required the width and height
    of the browser so that some calculations could be run to decide how the layout
    of the site should appear. While the project finished to a satisfactory conclusion,
    the end result was JavaScript intensive than I had originally hoped. What made
    it even worse was that it relied on extra scripts to add support for all major
    browsers. While at the time this was as good as I could get it, today I could
    have used media queries to shape my site layout.


    You may recognize the media attribute from CSS2 where it was mostly used to inform
    the browser where the style sheet was to be used for screen display or for printing.
    CSS3 has taken this original functionality and expanded it. For example, if I
    wanted to include a style sheet on a page viewed with a browser on a screen that
    had a maximum width of 480px, I would use the following:


    ```

    <link rel="stylesheet" type="text/css" media="screen" and (max-device-width: 480px)\
    href="mobile.css" />

    ```'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# HOUR 15: Responsive Site Layout


    The media attribute allows us to set up certain terms that must be met to include
    the referenced CSS file. We can also use them inside an existing style sheet.
    Listing 15.1 shows the setup for a couple of media queries that would be included
    either as a CSS file or inside a style element.


    # LISTING 15.1 Media Queries for Use with Mobile Devices


    ```

    1: @media only screen

    2: and (min-device-width: 480px)

    3: and (max-device-width: 800px) {

    4:   /* styles go here */

    5: }

    6: @media only screen

    7: and (min-device-width: 768px)

    8: and (max-device-width: 1024px) {

    9:   /* styles go here */

    10: }

    ```


    The first media query starts on line 1 and continues to line 5. The first three
    lines could be moved onto a single line, but in this example they would make them
    easier to read. Line 1 declares that this is a media query using @media. Using
    only older browsers to skip this media query, while using screen allows browsers
    running on devices with min-device-width: 480px inside parentheses. This means
    that not only does the browser have to support the arguments on line 1, but must
    also have a screen of width of at least 480px. By using min-width, the browser
    is checking the actual dimensions of the screen, the view-area line. Line 3 adds
    another requirement to the device: the media query has a maximum resolution of
    800px. That means all together the query runs only if the device is equipped with
    a browser that supports media queries, a screen, and has an exact resolution of
    either 480×800 or 800×480. Any styles that you want to apply to a device that
    meets that specification are entered on line 4 and beyond, just like you would
    like to do with normal CSS.


    The second media query runs on lines 6-10 and follows the same pattern as the
    first media query. This query runs only on devices that are equipped with a browser
    that supports media queries, a screen, and has an exact resolution of either 1024×768
    or 768×1024.


    Now that you have a taste of how media queries work, it''s time to look at how
    they can be applied to site layout.


    # Adjusting Layouts Based on Screen Size


    The method to building a traditional website has usually been centered on choosing
    a supporting screen resolution, and then making a choice between a static or fluid
    layout. While your personal favorite size is either 960px or 1140px, this becomes
    a problem for most devices.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Adjusting Layouts Based on Screen Size


    When thinking about responsive design, you can start from either end of the sizing
    spectrum. You can start from either the largest to smallest or from smallest to
    largest screen size. Both methods have pros and cons, and both should be considered
    for your target audience.


    The pros of starting large and working small:


    +   * You can retrofit an existing site by working down from the current size.

    * Using “fallback” techniques may already be familiar for developers.

    * The design may be compatible with older desktop browsers and systems.


    The cons of starting large and working small:


    +   * The site is generally bloated from the start with all of your features.

    * Extra detection methods may be required to decide what to load after all assets
    have been downloaded to the client.

    * CSS may get larger than necessary to scale down the existing site.


    The pros of starting small and working large:


    +   * Your CSS should be lighter as you will be adding options instead of checks
    for them.

    * You do not have to worry about hiding features as they are added as the screen
    gets bigger.

    * By starting small you are forced to focus on what really matters on your site.


    The cons of starting small and working large:


    +   * It is an entirely new mindset and may take an extended period of time to
    get a design working.

    * By the time you get around to the full site, some features may be left out.

    * It may feel like starting with the least common denominator and working up to
    what everyone else is using.


    I personally prefer to start with the smallest size I am going to support and
    then build up and enhance the experience. Else that you need to do when using
    a responsive design is to use either grid system or a fluid system using percentages.
    Let’s take a walk through a site starting with the mobile layout.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# Creating a Mobile Layout


    To get started on the mobile design you first need to know what you are going
    to design. For this example we create a single-page portfolio. Knowing that, here
    is a list of things that to include in our page:


    +   - Name

    - Picture

    - Contact Information

    - My Work

    - Interests

    - Social


    Using a block model layout for a page that is 480×800px, we can create a layout
    that has a header, then a picture and a name, contact information, a list of work,
    a list of interests, and a social links section. Figure 15.1 shows a block level
    layout of each area.


