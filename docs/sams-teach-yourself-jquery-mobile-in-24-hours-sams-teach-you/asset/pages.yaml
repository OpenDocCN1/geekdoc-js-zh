  md: '# Q&A 167


    We used a single image file set as the background for the custom icon. If you
    want, you may use an image sprite instead of a single file. Using image sprites
    is usually a good idea as they reduce the amount of HTTP requests that the mobile
    device needs to make to get all the assets of the page. If you plan on using more
    than a few custom icons, you should give serious consideration to combining them
    into an image sprite.


    # Summary


    This hour you learned all buttons. You learned that link-based buttons are created
    by adding data-role="button" to any element. You also learned that form input
    elements with an attribute type of submit, reset, button, or image are automatically
    styled into buttons and can access all the button functions.


    You learned how to override button defaults. You can take off a button''s rounded
    corners and remove the drop shadow. Buttons will use as much width as possible
    to display themselves. To change this behavior you use the attribute display-inline="true"
    and a grid to make them align on the same row but still use the maximum width
    available to.


    This hour also discussed using the built-in icon set for your buttons. By default
    the icons are placed to the left of the text included in the button, but this
    can be changed to the icon above, below, or to the right of the text, or the icon
    can appear by itself with the text of the button removed.


    Finally you learned about adding your custom icons to buttons and what image size
    and file type are needed for the buttons to display properly.


    # Q&A


    +   Q. Can I use a controlgroup on buttons like we did in the navbar?


    +   A. Yes, the controlgroup will work outside of toolbars and will work on any
    buttons you have your page.


    +   Q. After talking about image sprites, will there be a time when I wouldn''t
    want to use them?


    +   A. The only time you may not want to use image sprites is when they are exceptionally
    large. When the image sprite is delivered to the mobile browser, it is placed
    into memory. If your mobile device has a small or limited amount of memory, storing
    the sprite along with all the other assets of the website may crash the browser.
    That being said, the goal of a mobile site is to make the entire site as light
    as possible, so I would use image sprites and then test them on as many devices
    as possible.'
