- img_proc: true
  md: '# HOUR 1


    # Getting to Know jQuery Mobile


    **What You''ll Learn in This Hour:**


    +   - Why you should use jQuery Mobile

    - Devices support jQuery Mobile

    - The tools that will help you develop your site


    I am excited that you are intrigued enough with jQuery Mobile to start learning
    it. To kick things off, we start with a short discussion on why you should be
    thinking about diving into mobile design and why jQuery Mobile is the perfect
    solution.


    Then we learn about the different types of devices that jQuery Mobile works with
    as well as a quick look at some supported operating systems.


    Finally we discover what software is available to help you get started developing
    on whatever platform you are using.


    # Why You Should Use jQuery Mobile


    The world is going mobile. It is predicted that mobile web traffic will overtake
    desktop traffic within the next few years. Even now people everywhere use their
    mobile devices to learn, shop, compare, or even as a distraction they wait for
    the appointment. Mobile devices are convenient and easily taken anywhere.


    Think about how you use your current mobile device. Even if you have only an iPod
    Touch, I''m betting you still check email, look up the forecast, and do some light
    web surfing on it. Think about the apps you have installed; a few of them probably
    could be or cleverly designed web applications.


    While browsing on your mobile, you have probably noticed that more and more websites
    provide a mobile experience or version of their site. You may wonder how they
    created the site, or whether they used a complicated in-house system or framework
    to make the site.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Of course maybe that''s not it at all. Maybe you have a tablet or smartphone
    and have noticed that when you load a site in your mobile browser the device buckles
    under the weight of all the assets it has to try to load.


    You know there has be a way to make a mobile site responsive, flexible, and simple,
    but where do you start? An abundance of mobile development kits and tools are
    available, but what about support for those kits or their reliability?


    The answer to your question is easy: You should be using jQuery Mobile.


    # Responsive


    Many things make a site responsive: how a page looks when it transitions, what
    happens when you tap on a button, even how content loads.


    Did you know that there is a difference between a "click" event and a "touch"
    event? More importantly, did you know that there is around 300ms difference between
    the two events? Sure 300ms may not sound like much, but when was the last time
    you pressed a button that had one-third of a second delay on it? Did you press
    the button again because it felt "laggy"? This is one of the problems that jQuery
    Mobile helps you remedy. Using touch events decreases the lag, increases the perceived
    speed of your website, and greatly increases user happiness.


    Another problem with normal sites on mobile devices is how long they take to load.
    Sometimes you see the backgrounds render and then some image boxes and finally
    some text. I have seen on websites that load the background and then nothing else
    becomes large image elements or a video needed to load, leaving the page in an
    ugly unfinished state. I didn''t hang around long enough to see whether they finished
    loading. An unresponsive site where you can''t see the page or navigate around
    it does not make a good mobile experience.


    jQuery Mobile solves loading problems by using deferred loading techniques mixed
    with a healthy dose of Ajax to load images, content, and more. This means that
    the site loads is important to the user first and adds extra content while the
    user is absorbing the information they come to see in the first place.


    # Flexible


    When developing, few things are worse than committing to a framework and finding
    out that you cannot customize any of it. What if you don''t like one of the widgets
    provided in the framework? What if the styles are ugly or do not match your brand?
    What if the framework lets you customize the style but doesn''t let you add in
    your own custom widget? These are all real problems, and each of them is easy
    to overcome with jQuery Mobile.


    If you don''t like the included themes you can use ThemeRoller and make your own.
    What if you like the main theme but need a different colored header style? Easy,
    you can include'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'a second style sheet and overwrite the existing styles. For the ultimate in
    flexible style changes, you can actually replace one of the included themes with
    your own. This allows you to fine-tune everything to fit your needs or branding.


    As for widgets, you are free to build whatever you want. Because jQuery Mobile
    is built on the jQuery framework you can build and use widgets and plug-ins just
    as you want on mobile websites. While you need to plan ahead for differences in
    the mobile environment (no hover states or events, size constraints, less computing
    power, and so on), you have the freedom to build whatever you want and use it
    within your mobile site using standard JavaScript or leveraging the jQuery framework.


    # Simple


    By leveraging some of the new HTML5 proposed standards along with using the jQuery
    framework, setting up a site is easy. There are no framework-only tags to learn,
    just modification attributes in the existing tags that you are already using today.


    # Support and Reliability


    jQuery Mobile is built on the amazing jQuery library. jQuery has been proven to
    be a fast, efficient, and dependable JavaScript library. jQuery has taken the
    Web by storm and changed the way developers implement and use JavaScript on websites
    and web applications.


    The jQuery team is dedicated to making the jQuery library number one choice in
    JavaScript development. Having this as the foundation for jQuery Mobile ensures
    a fully supported and reliable solution for years to come. jQuery was even chosen
    by Microsoft as a preferred JavaScript framework, and Microsoft has included full
    auto-completion support for jQuery inside Visual Studio.


    Contacting the jQuery team is easy; you have a dedicated blog, forum, and Twitter
    account with continuing posts about updates, features, and helpful hints and how-to''s.
    The community is rapidly growing, and now is a great time to jump in and get involved
    with the project.


    # Supported Devices


    What can jQuery Mobile be used on? Almost any device that has a browser can run
    jQuery Mobile (including desktops). You will, however, get a different experience
    based on what browser you use and on the hardware that is pushing the browser.
    Of course it goes a little deeper than that; it also depends on operating system
    your device has. The following sections start with larger hardware devices and
    work down through smaller ones.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Desktop, Laptops, and All-in-One Systems


    On your PC, Mac, or Linux computer jQuery Mobile sites run in any modern browser
    (note that by "modern" I browsers have support for HTML5 tags and some CSS3 support).

    Running your mobile site in Firefox, Chrome, Safari, or Opera should yield a good
    result as they all have support for HTML5. You may see an occasional rounded corner
    that isn''t round, but for the most part the site looks good and behaves as expected.
    Even Chrome Desktop displays works well with jQuery Mobile.


    # Tablets


    The experience that you get using jQuery Mobile is determined not only by the
    supported browsers of the device but also by the processing power of the tablet.


    Most tablets have a large screen, and it can take a considerable amount of processing
    power to drive that screen. This means that while your site still loads quickly
    and renders correctly, page transitions and dialog pop-ups may appear to be skipping
    frames. This doesn''t necessarily mean that your site is actually slowing, but
    on some tablets it may to stutter.


    When I was testing with an iPad and iPad 2 I found that all special effects and
    page transitions were as fluid and smooth as I expected. When testing with a Galaxy
    Tab 10.1 things were still smooth, but I noticed some stutter or a complete lack
    of animation while the screen was being transitioned from page to page.


    While I have personally tested the TouchPad, ZiiO, Playbook, or the newer Archos
    tablets, they are reported to handle jQuery Mobile fairly smoothly.


    # Smartphones


    There are way too many phones to list them all, so instead this section talks
    about the OS support on various phones. Let platform, but some of the advanced
    features and Ajax loading may not be supported. This is another reason why using
    jQuery Mobile is a wise decision. The ability to fall back to support older devices
    and still have a functioning site is a must-have.


    # Android


    If you are using the built-in browser on Android all the advanced features will
    work and you will be treated to the full array of visual splendor in. Note that
    if you are using Fennec, Firefox, or Opera mobile you may run into some styling
    issues and some lack of full support on animations, but your overall experience
    should be rather pleasant.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# iOS


    The way jQuery Mobile handles the iPhone is actually impressive. Transitions are
    smooth, animations are fluid, and the dialog boxes pop in and out perfectly. Support
    is definitely not lacking for mobile Safari on iOS.


    A warning about third-party browsers: Using a browser app may degrade some performance,
    and in some cases actually cause Ajax navigation to fail. This doesn''t mean that
    the site is not usable, it just means instead of a nice seamless transition between
    pages the site loads more like a standard site, using page refreshes in response
    to taps or clicks.


    # BlackBerry


    The BlackBerry operating system has several versions released, and your experience
    will be based on what version you are running. Version 6.0 has all the bells and
    whistles that Android and iOS have. Version 5.0 still looks loses Ajax navigation.
    Any of the 4 devices get a standard fallback version of the site. This means that
    instead of nice CSS3 styling and transitions you get a simple styled site that
    uses page refreshes to move to new content.


    The Playbook runs an independent operating system and provides an experience similar
    to version-6.0 and 7.0 of the BlackBerry operating system.


    # webOS


    With the future of webOS itself looking continually grim, and hardware support
    already at an end, I will just say that versions 1.4 to 3.0 all handle jQuery
    Mobile with full functionality.


    The slower your webOS device is, the more chance you will see some frame skipping,
    but you still get full Ajax support, styles, and transitions.


    # Windows Mobile


    Windows Phone 7 handles jQuery Mobile without a problem. It looks good, runs smoothly,
    and all features are enabled. This is due to the included web browser being based
    on Internet Explorer 9, giving users access to some HTML5 and CSS3 features.


    Windows Mobile 6.5, however, is a different story. Windows Mobile 6.5 uses an
    older version of the Internet Explorer browser and suffers from a lack of feature
    support. While the Windows Mobile team is hard at working making new releases
    of Internet Explorer more developer and standard friendly, those using an older
    version of the browser will miss out on AJAX navigation and some styling. Any
    mobile device running Windows Mobile prior to version 6.5 displays the basic fallback
    version of the site.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# eReader Devices


    This is actually a tough one to nail down because there are many eReader devices
    on the market.


    What I can tell you that jQuery Mobile supports Kindle devices that include the
    experimental WebKit-based browser. Other eReader devices, such as the Nook Color,
    that run a modified version of Android also have full support for jQuery Mobile.


    Keep in mind that with eReader devices, the ones that use E-Ink technology are
    required to redraw the entire screen when a page is loaded, performance on these
    devices may suffer.


    # The Developer’s Arsenal


    Now that we know that jQuery Mobile runs on just any connected device, you may
    have a few questions, such as:


    +   * What programming languages do I use to create my mobile site in?

    * What, if any, IDEs are available to work with?

    * Do I need to have web server installed to write mobile sites?

    * What platform should I be on to write a mobile site?

    * Can I develop for free, or is there a cost associated with the software?


    These are real and important questions, and one should always know what tools
    are available. Let''s answer each of these questions and expand on them so you
    know exactly what is available in the developer arsenal.


    # Programming Languages


    If you have already created a website and are looking to make a mobile version
    or convert your existing site into a mobile one, I have some great news for you.
    You already have the entire skill set needed to use jQuery Mobile.


    Knowledge of HTML, CSS, and JavaScript are what you need to get started. You can
    also get crazy with it and mix in some scripting languages too. If you want you
    can run with a PHP backbone without a problem. If you need some Ruby in to help
    keep things flowing your way, go ahead and use it. While being skilled with other
    programming languages is helpful, it is not required.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Integrated Development Environment (IDE), Platforms, and Cost


    While there are the hard-core, die-hard, do-it-yourself types of developers who
    need nothing more than notepad, textedit, or vi to get their coding done, there
    are also plenty of developers who enjoy a little help with auto-complete, auto-close,
    and snippet libraries to dig through. If you enjoy a little help from your programmatic
    friends, then you are likely going to want to develop inside an IDE.


    Whether you run with the Windows crowd, stand confidently with OSX, or love to
    get up your elbows in Linux, you can whatever platform you want. Remember, jQuery
    Mobile is just a JavaScript framework so whatever platform you are already using
    to develop your current site with most likely work with jQuery Mobile.


    Cost is a funny thing. Some people gladly pay for support, features, and usability.
    Others sacrifice one or even all of three if they can get the program for free
    or at a discounted price.


    Let''s talk about some of the available development applications for your OS and
    whether you should pay for it, or pick it up for free.


    # Development Applications for Windows


    The applications are programs that run on the Windows platform. This includes
    both the XP and 7 versions of Windows.


    # Aptana Studio


    Aptana bills itself as the world''s most powerful open-source web development
    IDE. It comes with an included web server for debugging and has support for server-side
    JavaScript.


    For a development IDE, I have personally found Aptana to be a great starting point
    for those unfamiliar with web development who could use a library of snippets
    and who do not want to mess around figuring out how to install a web server to
    make their project run.


    Aptana was also purchased by Accelerator and has included support for Titanium.
    With Titanium you can create a web application and package it as a native application
    for most mobile devices and mobile operating systems.


    # Eclipse


    If you looked at Aptana Studio and thought it looked strikingly similar to Eclipse,
    you would be correct. Eclipse is one of my favorite IDEs. I''ve used it for projects
    in PHP, Java, and a few projects in-between.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'There are many different flavors of Eclipse, but all have support for plug-ins
    and software add-ons, allowing it to be modular and customizable. A vanilla version
    of Eclipse will set you back nothing, as it is open-source.


    You are encouraged to donate to the Eclipse project to keep it free and for continued
    development and support.


    # Dreamweaver


    Back in the emerging days of web development Macromedia had a great little IDE
    named Dreamweaver that took a WYSIWYG approach to web development. Macromedia
    was later acquired by Adobe, and Dreamweaver has been integrated with several
    other web technologies for rapid web development and deployment.


    The latest version of Dreamweaver sports built-in support for jQuery Mobile and
    includes several prebuilt mobile templates to get you going.


    The pricing varies somewhat on Dreamweaver because different versions are available,
    but you may download a 30-day trial to give it a spin and see whether it matches
    your personal flow and development needs.


    # Visual Web Developer Express


    Microsoft puts out this specialized version of Visual Studio for developers who
    are new or who to learn a new technology. There are stipulations with using this
    free version of Visual Studio. For personal or education use you are unlimited,
    but if you want to profit from your project or release it commercially, you need
    to step up to the full version of Visual Studio.


    Visual Web Developer Express features full jQuery code-completion and can be integrated
    with .NET and IIS.


    # Notepad++


    The last program I will mention as an IDE for use in Windows is the one I actually
    use the most. Notepad++ is a free program that is similar to the notepad application
    that comes with Windows.


    It is similar to notepad in that it can process a file with an extension of .txt.
    It takes a massive leap forward by adding support for multiple open files sorted
    into tabs, syntax highlighting, a plugin-in architecture, scripting support, and
    more.


    Whether I am editing XML, PHP, HTML, CSS, JavaScript, or other files, Notepad++
    is my favorite tool to use. It does not feature an integrated server, but you
    can use plug-ins with it and set up remote connections to upload files through
    FTP to your site for use with testing.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Komodo IDE/Edit


    Those looking for another option for an IDE can use Komodo by ActiveState. Komodo
    IDE is the flagship product with many excellent features including code collaboration,
    a debugger, and a database explorer. Those on a budget can appreciate Komodo Edit.
    This is the freemium offering from ActiveState that features the base toolkit
    without the extra features. This means you get an editor that has auto-complete
    as well as a toolbox for storing code snippets. Both versions run on Windows,
    Linux, and OSX.


    # Development Applications for OSX


    The following applications run on the Apple OSX platform. The applications listed
    should run on the Snow Leopard and Lion versions of OSX.


    # Kod


    I used Kod briefly and found it to be a sufficient IDE for development. It is
    a free application and integrates itself into the file system, becoming the default
    application to edit most of your web files.


    # Coda


    This is a much talked about about IDE that can be purchased in the App Store.
    It is one of the most popular web development applications available for OSX.
    It also comes with useful tools such as a built-in SVN client and various file
    transfer protocols. Dreamweaver users will feel fairly comfortable in the layout
    and use of the program.


    # TextWrangler


    Whenever I am doing a quick edit, or just need to look at files I intend to use
    TextWrangler. This is a free program by the makers of BBeEdit and has syntax highlighting
    with support for most web languages.


    You definitely cannot beat the price, and if you need more features you can always
    step up to the fully featured BBeEdit.


    TextWrangler is not built for the HTML newbie. It does not come with the comprehensive
    tools or snippets BBeEdit comes, with those who are just embarking on website
    development would probably feel more comfortable using another IDE.


    # Espresso


    Espresso is a web IDE from the makers of CSSEdit This great little IDE has all
    the features of the other big players—code completion, live preview, file transfer
    protocol support, extensions—and includes a 15-day free trial to help you decide
    whether you want to purchase it.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Eclipse


    Eclipse is a multiplatform application, and as such is available for use on OSX.
    It generally rolls with the same amount of plug-ins and extensions as the versions
    found on other platforms.


    # Aptana Studio


    Yep that''s right, Aptana Studio is also available for the Mac. There are no feature
    differences between Windows and Mac, so if you are constantly switching platforms
    you will already be at home and familiar with Aptana Studio.


    # Komodo IDE/Edit


    When developers move from already Windows to OSX something that becomes annoying
    quickly is the Home and End keys no longer move you to the beginning or end of
    a line but rather to the beginning or end of the document. Komodo IDE and Komodo
    Edit have remapped the functionality of these keys to have the same behavior as
    found in Windows. While this may be a small feature, for some developers this
    is actually a big deal.


    # Development Applications for Linux


    The following applications can be used on most versions or flavors of Linux. You
    need to either build from source or check repositories for these apps for your
    Linux environment.


    # GNU Emacs


    Featuring syntax highlighting and customization support, Emacs is a great way
    to just jump in and get going. Note that there are not many bells or whistles
    that should be prepared to just jump in and get coding.


    Emacs has extensive search and replace tools as well as support for regular expressions.
    It also allows you to edit remote files, or files owned by another user when given
    credentials and connection information.


    # gedit


    Those familiar with gnome use gedit. It is the default text editor of the gnome
    desktop and has syntax highlighting and a code snippet library available. For
    most Linux users, this is more than enough to get them going in the right direction.


    # Aptana Studio


    Small world isn''t it? Turns out Aptana Studio works in your Linux environment
    too. All the features of the Windows and OSX versions are also available in Linux.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Eclipse


    As mentioned in the OSX section, Eclipse is multiform, so, yes, it works on Linux,
    both 32- and 64-bit versions. It has all the same features as the other platform
    versions, making transition between platforms a snap.


    # Komodo IDE/Edit


    As mentioned before, the Komodo IDE and Komodo Edit are available for Linux as
    well. This is a good solution if you are using multiple platforms and would prefer
    to have the same experience between them.


    # Web Servers


    As a general disclaimer I will say that developing jQuery Mobile applications
    does not require running a web server, or even you to have Internet access. You
    can load and reference all the required files locally and test them in a modern
    HTML5 and CSS3 supporting browser.


    Of course without running your code on a server you will not get to see the effects
    of compression, possible server issues, network latency, user permissions, .htaccess
    file changes, or even complete testing from an actual mobile device. Here is the
    short list of available web servers. You may also run into problems with file
    locations and permissions.


    While many different types of web servers are available, they do not all run on
    the same platform. The following descriptions list what platform web server runs
    on.


    # Nginx


    This is an all-in-one server that boasts the most connections with the smallest
    memory footprint. Versions are available for Linux, a buildable version for OSX,
    and some compiled binaries for Windows.


    Note that the Windows binaries use some Cygwin files, so I strongly recommend
    against the Windows version as a production server.


    # Apache


    It is safe to say that most web developers have experience in dealing with or
    having their site hosted on an Apache server.


    It is probably the most popular open-source HTTP server available. It has many
    features and is easily to maintain and operate. Versions are available for download
    for Unix/Linux and Windows.


    If you are using OSX, you already have Apache installed. To see which version,
    open a terminal and type `httpd -v`.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Lighttpd


    Pronounced "lighty," this up-and-comer in the server world is focused on speed.
    It is a Linux-only server and seems fairly straightforward (both in use and installation).


    # IIS


    Our .NET loving friends already know about IIS, and it is the preferred web server
    of choice for them. It comes with most versions of the Windows OS and can be integrated
    with PHP. It features GUI configuration and management system and has downloadable
    extensions to help you get the most out of it.


    # XAMPP


    XAMPP is a package of applications used for web serving. It contains Apache, MySQL,
    PHP, and Perl. It runs on Linux, Windows, OSX, and Solaris. With its easy setup
    and configuration, this is the stack that I commonly use when developing.


    # Summary


    You have learned why it is important to start developing mobile sites, and why
    you should be using jQuery Mobile to do it.


    You now have a basic understanding of what devices support jQuery Mobile and gained
    an overview into planning for these devices.


    Finally you learned about the different tools available for development, including
    programming languages, IDEs, and server software.


    Using this knowledge you should now have a foothold on getting started with mobile
    development and be able to find the tools that are comfortable to use.


    # Q&A


    +   Q. Is a web server absolutely necessary for mobile development?


    +   A. That is a great question, and a little difficult to answer. If your mobile
    site is static and does not use any dynamic code, you can develop without a server.
    That said, unless you develop a single page site, you will receive error messages
    when you attempt to load separate pages. Using a server gives you better results,
    allows AJAX, and allows you to test your site cross-device using emulators or
    with devices attached to the same network you are on.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'Q. Do I have to use an IDE to develop? Some of the suggested IDEs are too expensive
    or don''t offer incentive to use them.


    A. No, if you are a notepad, textedit, or vi kind of developer, you are already
    good to go. The listed IDEs are just suggestions to help you get started if you
    are new to development and need a little help with structure and/or file management.


    Q. I have been using a WYSIWYG IDE for years and it has never let me down or has
    never been excessively difficult to use. Why does it seem to get "knocked" by
    developers on the Internet?


    A. While a lot of "die-hard" developers make fun of WYSIWYG development programs,
    there is nothing wrong with them per se. The stigma comes from computer-generated
    code. When developing with a WYSIWYG editor you will find that there are few things
    worse than computer-generated code. While it may be optimized, it may not match
    the design or the flow that you would expect. Naming conventions are not very
    descriptive and end up as a series of letters. These editors may also include
    hundreds of lines of CSS hacks and CSS evaluations (both may be looked upon unfavorably
    by the developer community).


    # # Workshop


    The workshop contains a quiz and some activities to help you check your comprehension
    and understanding.


    # # Quiz


    +   1. True or False: jQuery Mobile works only with mobile versions of Webkit-based
    browsers.


    +   2. True or False: jQuery Mobile is based on plain JavaScript and does not
    require the use of any other JavaScript libraries or frameworks.


    +   3. True or False: jQuery is a well-known and strongly supported framework.


    # # Answers


    +   1. False. Not only does jQuery Mobile work with mobile versions of Webkit-based
    browsers, but it works with Opera, Firefox, and BlackBerry. It also works with
    all modern desktop browsers.


    +   2. False. jQuery Mobile is based on jQuery, which is a JavaScript framework.
    However, since it is a framework, it is not considered plain JavaScript. The jQuery
    Mobile framework uses more of an HTML attribute-based approach to development
    and leverages the power of the jQuery framework for DOM manipulation giving a
    fairly seamless cross-browser experience.


    +   3. True. jQuery is very well-known and included in many websites and development
    programs than you would originally think. Dreamweaver, Aptana Studio, and even
    Expression Web come with built-in support for jQuery.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Exercises


    +   1. Download a few of the programs mentioned previously and install them. Get
    a feel for which one fits your personal development style the best, and which
    one meets your personal and/ or corporate budget.


    +   2. Perform a search on mobile usage in your country and region for adoption
    rates and impact. Get familiar with the statistics for your area to get a better
    understanding of whether you will be setting the bar or playing catch-up in your
    niche.


    +   3. Take a few minutes to surf the Web on a mobile device. Take notes on what
    you like and what features you wish the sites you had available. Write down how
    many sites offered you a mobile site automatically and which ones ignored your
    mobile device. Add another note on whether the websites you visit offer a native
    app for your device.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Working with HTML, CSS,

    and JavaScript


    What You''ll Learn in This Hour:


    +   - The current role of HTML

    - Different ways to add styles to a web page

    - What JavaScript is and how you can use it


    This hour reviews the concepts and current trends of using HTML, CSS, and JavaScript.
    This is important as it plays a major role in development with jQuery Mobile.
    Sites that use jQuery Mobile are built with HTML, and while they are styled by
    a default theme, you may want to change the styles to something a little more
    custom. This requires knowledge of how to read and edit CSS. Understanding JavaScript
    comes into play when you want to bind events to button presses or screen taps.
    Understanding standard JavaScript is also useful when learning to use the jQuery
    Mobile framework.


    While it will be fun to cover everything there is to know about HTML, CSS, and
    JavaScript, it''s just not possible in an hour. However, if you have ever developed
    a website, toyed with HTML, or just been away for a few weeks, this will be an
    informative hour that gets you back up to speed.


    # Building Content with HTML


    HTML is the basic building block of the Web. It is the frame that holds your site
    together and the foundation that allows you to extend your site into whatever
    you want it to be. HTML has come a long way from its inception and is continuing
    to grow and develop.


    # The Role of HTML


    Before Cascading Style Sheets (CSS) were introduced, everything was handled with
    HTML tags. Images, text, layout, scrolling text, just about everything was put
    in place with HTML tags. You may remember viewing the source code on your browser
    and seeing lots of &nbsp; character entities used for layout purposes.'
