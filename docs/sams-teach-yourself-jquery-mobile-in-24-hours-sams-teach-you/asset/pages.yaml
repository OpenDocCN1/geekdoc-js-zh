  md: '# Summary


    In this hour you learned how lists work when used with jQuery Mobile. Lists can
    be displayed either in full screen or inset, and both ul and li elements can be
    used and styled with jQuery Mobile.


    You learned about adding extras such as thumbnails, icons, and a count to list
    items. You also learned about split lists and how to use them with the other extras
    that can be added to list items.


    You saw how to add a search filter to your list, how it works with list dividers,
    and how to customize the initial search filter text. You also learned that you
    can combine a list with a form to include a different visual style and that it
    can be used in place of div elements with the data-role="fieldcontain" attribute.


    # Q&A


    +   Is there a reason why I would or not want to use inset lists?

    I believe this comes down to personal preference and style. An example of when
    inset lists come in is creating complex layouts using media queries to hide or
    show content based on screen size. If your screen layout splits into multiple
    columns, a standard list will fill up the entire column but not include any side
    borders. This can give your list incomplete feel.


    +   Do I always have to enter the number to display in the count manually?

    No. But to make the number dynamic you need to include either a backend language
    to write the value out, or use some JavaScript to change the values on an event
    such as pageInit() or pageCreate().n


    +   If I included a thumbnail that was shorter than 80px. It looks wrong. Isn''t
    it supposed to center my image?

    Unfortunately jQuery Mobile will not figure out the center of your image. Instead
    it places it at the top and leaves empty space at the bottom. To fix this I suggest
    trimming your image manually in some photo-manipulation software and then placing
    it on a transparent background or other color so that the image is 80x80 px with
    your image centered. If you look at Figure 11.5 you can see that is what I have
    to do with my thumbnail images because they came out at 80x60 px.


    # Workshop


    The workshop contains a quiz and some exercises to help check your comprehension
    and understanding.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Quiz


    +   1. True or False: It is impossible to stop jQuery Mobile from styling your
    lists.


    +   2. True or False: You can mix multiple list extras together to create uniquely
    styled list items.


    +   3. How do you create a split list?


    +   4. What is the default size for an icon when used with a list?


    +   5. How do you add a count to a list item?


    # Answers


    +   1. False. jQuery Mobile always checks for a data-role="listview" element on
    the ul element of your list before it styles it. If you do not include the attribute
    your list will use default styles instead of the jQuery Mobile ones.


    +   2. True. You can mix almost any of the various extras together to make your
    lists stand out and perform the tasks you need. This includes mixing thumbnails
    with a count, or icons with a split list, and so on.


    +   3. To create a split list you need to include two elements inside a list item.


    +   4. The default size of an icon is 16x16 pixels. This is different from the
    default icon size used with buttons, and is 18x18 pixels.


    +   5. You create a count by adding an element with an attribute class="ui-li-count"
    that contains a number. This number is then displayed on the right side of the
    list item when rendered.


    # Exercises


    +   1. Create either an inset or standard list and apply a thumbnail and a count.


    +   2. Create a form and adding various form elements to different list items.
    Experiment with how the list changes when displayed as an inset list.


    +   3. Create an address book using list dividers and a search filter to quickly
    find a name that you are looking for.'
  merge: -1
