- img_proc: true
  md: '# Delivering Video Content


    ![](img/56578b432709a7220ba1c18b41eabe62_374_0.png)


    FIGURE 19.6

    nThe settings used for the Advanced tab for mobile-safe encoding


    Now that you can encode or transcode your video content, let''s look at how to
    get it to play back on mobile devices.


    # Delivering Video Content


    When displaying video content on a mobile device you have a few options. You can
    use HTML5 video tags to display and control your video, or you can use various
    JavaScript plug-ins, or can link directly to the file allowing the device to play
    the back in the native device player. Since we have already covered using the
    HTML5 video element, let''s take a look at some common plug-ins to handle our
    mobile videos.


    # Using Plug-Ins and Players


    Before you get too excited about the prospects of using a plug-in or player to
    handle all your video needs, there is one thing you need to do first. It doesn''t
    matter what web server you are running, but you must configure your MIME types
    or some of these plug-ins may not work. Either modify your server configuration
    file or if using an Apache server, add the following to a .htaccess file:


    ```

    AddType video/ogg .ogg

    AddType video/mp4 .mp4

    AddType video/webm .webm

    ```'
  merge: -1
  pgno: 374
- img_proc: true
  md: 'Many of the video plug-ins available for use are a clever collection of JavaScript
    and CSS allowning support and device detection. Some players even allow fallback
    to Flash for browsers that do not support HTML5. Several players on the Web do
    not support mobile devices at all, so we''re going to take a look at the ones
    that do.


    # Projekktor


    Projekktor (http://projektor.com/) was one of the first HTML5 video players that
    I actually heard about. It is a fully featured player and can be tailored to suit
    almost anything you need. Projekktor is released under the GPL, so it is free
    to use in your projects. If you get stuck or need some support you have several
    options from free (in the form of an FAQ and document listing) to pay support.
    For nonmobile devices that browse this plug-in that do not support HTML5, a Flash
    fallback is available.


    # MediaElement.js


    MediaElement.js (http://mediaelement.js/) is quickly becoming the popular choice
    for guaranteed video playback regardless of browser and device type. It allows
    you to decide how much support you want to give. This means that if you only want
    to provide one H.264 encoded video, that is all you need to do. By doing so you
    limit older browsers, but it does save a few lines of code and makes prototyping
    or testing a snap as you can go back and add extra support later. It also has
    built-in plug-ins that add a little extra functionality and/ eye candy to the
    player. The license is either GPL v2 or MIT, so you feel free to use this in your
    web projects.


    # JPlayer


    JPlayer (http://jplayer.org/) is another player that sports some excellent ideas.
    It can be used as both a video player and an audio player. Just like the other
    players, it contains fallback support to Flash. Similar to MediaElement.js, you
    can get with just an .mp4 file; however, for full compatibility you need to generate
    an .ogg and .webm file as well. It is licensed as GPL or MIT so you are free to
    include it in your web projects.


    # Video.js


    Video.js (http://videojs.com/) is another option that provides a player with a
    common skin that works-browser. It also features integration with Flash or Silverlight
    for fallback support. Unlike of the previous players, it does not rely on the
    jQuery library and can be run as a standalone or with others. Video.js is one
    of the easier players to use as you can include the required files from its CDN,
    and then create the HTML5 video element as you normally would with a few extra
    classes and a custom data attribute named data-setup. The license is a variant
    on the GPL known as the Lesser GPL, which allows you to use it on your site as
    long as any improvements you make are contributed back to the Video.js team.'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# Summary


    While there are times when you would like use use a specific interface that a
    player brings, occasionally it is better to just let the device handle the video.
    This is where using the native video player comes in.


    # Using the Native Player


    The native video player varies on each mobile device; however


    ```

    <a href="videos.mp4">Watch a demo</a>

    ```


    When the link is clicked, the browser should detect that it is a video file and
    ask what to do with the file, or it launches the native player for the device.
    When viewing is finished, the user is usually returned to the page that called
    the file.


    Sometimes, however this method can be a little unpredictable. While most iOS and
    Android devices play the .mp4 file when linked from a website, some browsers download
    the file instead, which turn forces you to find the file and load it into the
    native player themselves. With my own testing I''ve found that by declaring the
    MIME types mentioned earlier, most devices play the video or at least ask whether
    you want to play the video before downloading and storing the file. Another problem
    with using this method is that a user is shifted to the video screen and then
    forced to wait until the file has been downloaded enough to begin playback. This
    can be a little strange for users who are not expecting the transition, or the
    possibly long wait time.


    # Summary


    In this hour you learned what the various codecs available for both video and
    audio streams are and what they are capable of holding. what the current specs
    are for several mobile devices in regards to video and audio playback capability.


    You learned about some tools available for the inspection and creation of videos.
    This included learning about the basic rules of encoding a video with an almost
    guaranteed setting for playback on all video-capable mobile devices.


    You also learned about some plug-ins available to integrate HTML5 video into your
    site that work with mobile devices. When plug-ins are not desired, you can link
    directly to a video file and have the device play the file inside the native player.'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# # Q&A


    Q. Are there any other video inspectors or encoders?


    A. Yes, there are quite a few. I chose to cover the ones that either I have used
    personally or fit the budget of a user just starting out. Many commercial programs
    as Adobe Premiere and Final Cut have the capability to produce videos with the
    same constraints on them. There are also specialized encoders such as Fireogg
    that creates .ogg files for video playback.


    Q. How do these videos work with jQuery Mobile?


    A. Using jQuery Mobile doesn''t change the way of the plugins are used, although
    you may have to change the load to the pageinit event.


    Q. What happens if I try to view a video on a device that does not support HTML5,
    Flash, or any other fallback?


    A. Generally when this happens you either get an error message about a failure
    to play back the video or get a direct link to download the video. As a developer
    what the end user sees is completely up to you.


    # # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # # Quiz


    +   1. What is the profile you should use for H.264 to maximize device compatibility?


    +   2. What is the video codec used with an .ogg container?


    +   3. What is a benefit to using a plug-in for video playback?


    +   4. What version of the AAC codec should be used with mobile devices?


    +   5. How can you use the native player from your site?


    # # Answers


    +   1. A profile of 3.0 allows maximum compatibility with mobile devices.


    +   2. The Theora codec is used inside the .ogg container.


    +   3. Plug-ins supply customization, ease of use, support for legacy browsers,
    and fallback support for other video delivery systems like Flash and Silverlight.'
  merge: -1
  pgno: 377
- img_proc: true
  md: '4. AAC-LC works on almost all mobile devices and as such should be used whenever
    possible.


    5. If supported, the native player is triggered when direct link is used to the
    video file.


    # # Exercises


    +   1. Download MediaInfo and use it to analyze some video files on your computer.
    Compare the codec settings with what we learned this hour.


    +   2. Create a video, or use the one from the previous exercise, and transcode
    the file into one that works on your device. Copy the file to your device and
    see whether it will play back. Take this a step further and create a simple HTML
    page with a direct link to the file. Use your mobile device to see whether the
    video will play in the native player.


    +   3. Experiment with one of the player plug-ins and compare how it functions
    on various browsers and systems. If you have multiple devices available, examine
    the playback experience between them.'
