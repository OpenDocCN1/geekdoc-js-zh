  md: '# Searching List Content


    If you are using a list to display a large number of items you may want to include
    a search filter to help users navigate through your selection to find what they
    need.


    Creating a search filter is easier than you might think. All you need to do is
    add an attribute of data-filter="true" to the ul element of your list. Listing
    11.7 shows a list with a search filter applied.


    # LISTING 11.7 Adding a Search Filter to a List


    ```

    1: <ul data-role="listview" data-filter="true">

    2: <li data-role="list-divider">Signed Banks</li></li>

    3: <li>Planned obsolescence</li></li>

    4: <li>$E.E.P. (Scorched Earth Policy)</li></li>

    5: <li>Ground Pounder</li></li>

    6: <li>Decibel Hertz</li></li>

    7: <li>Ultra Violent Lients</li></li>

    8: <li>Southern Tempo</li></li>

    9: <li>Candy Lab</li></li>

    10: <li>Brother Tobias</li></li>

    11: <li>Silent Squall</li></li>

    12: <li>Red Air Day</li></li>

    13: <li>Fourty Floor</li></li>

    14: <li>Marvelous Makeover</li></li>

    15: <li>Anthem</li></li>

    16: <li>Grouppaiser</li></li>

    17: <li>Nine Knights</li></li>

    18: <li>Modulation</li></li>

    19: <li>Saw the Sine</li></li>

    20: </ul>

    ```


    On line 1 the data-filter="true" attribute was applied on the opening ul element.
    Line 2 is an li element that contains a data-role="list-divider". We already know
    that this creates a list but when using the search filter, the list divider is
    visible only as long as at least one thing comes back as a result. Lines 3-19
    li elements being created with different names in them for the purpose of demonstrating
    the search filter. Figure 11.8 shows what the list looks like with the search
    filter.


    As you type into the search filter box, the displayed list automatically hides
    list items based on matches between the entered text and the list item text content.
    Text entered into the filter is not case sensitive and even on partial matches.
    For example, if you were to put the code from Listing 11.7 into a page and type
    "rou" into the search filter, it would remove all entries except for "Ground Pounder"
    and "Grouppaiser".'
