    as chaining. Take a look at the following code snippet:


    ```

    $(''<a href="http://"]'').addClass(''external'').attr(''target'', ''_blank'');

    ```


    For the preceding code, we start off using somewhat complex selector that will
    find every element in the DOM that contains an attribute of href that starts with
    http:// We then use the .addClass() function to add a class with a value to all
    elements returned in the selection. We chain the .attr() function to add an attribute
    of target with a value set to _blank.


    For the plain and simple description of what we just did, we added a class and
    an attribute to all <a href="http://example.com"> elements that were in the DOM.


