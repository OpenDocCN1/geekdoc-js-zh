  md: '# Conquering Collapsible Content


    Line 19 is the div element for our collapsible container.


    The collapsible container we just looked at would be great for holding some information,
    a secondary navigation section, or even an options bar. However, you may be wondering
    about a collapsible set that expands and closes containers semantically. This
    is commonly referred to as an accordion, and if you look at line 20 you can see
    how to begin again.


    Line 20 is the beginning of a div element that contains a data-role="collapsible-set"
    attribute. This is the wrapper or the container for multiple collapsible content
    containers.


    Line 21 shows another div element containing two attributes, data-role="collapsible"
    and data-collapsed="false". We already know what data-role="collapsible" will
    do, but the data-collapsed="false" attribute is new. When it is present, it informs
    jQuery Mobile that it needs to be expanded by default page load instead of collapsed.


    Lines 22-24 show the content that will be shown on page load, and line 25 shows
    the closing element for the collapsible section.


    Line 26 shows another collapsible section set up through the use of another div
    element containing the data-role="collapsible" attribute.


    Lines 27 and 28 should look pretty much the same as the content in our previous
    collapsible containers.


    Line 29 shows something you may not have expected. It is another div element with
    the data-role="collapsible" attribute. In case you were wondering, it''s not a
    fluke. This was done completely on purpose to show you that you can nest collapsible
    content sections inside each other. Inside this nested collapsible section you
    can see that we have thrown in some content following the exact rules as any other
    collapsible section. The nested collapsible content section is closed on line
    32, and the section that was holding it is closed on line 33.


    Line 34 is the closing element for the collapsible-set container.


    Remember that when using collapsible sets only one collapsible section remains
    open at a time; the rest are automatically collapsed.


    Figure 7.8 shows collapsible.html being rendered on a mobile device.


    Using collapsible content is a great way to increase the user-friendliness of
    your mobile site. It is also a great way to pack in extra content without forcing
    the end user to scroll through the parts that are not relevant to them. You can
    benefit from the use of collapsible content on everything from product pages to
    blog posts.'
