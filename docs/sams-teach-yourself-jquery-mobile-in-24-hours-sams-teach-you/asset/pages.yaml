  md: '# Playing Device Detective with PHP 315


    Now that we know how to get the UA as PHP, let''s look at actually redirecting
    the page when a mobile device is detected. Listing 17.3 shows a PHP script that
    redirects the browser based on the UA.


    # LISTING 17.3 Redirecting a Mobile Device with PHP


    ```

    1: <?php

    2: $ua = $_SERVER[''HTTP_USER_AGENT''];

    3: if (strpos($ua, ''iphone'') !== false) {

    4:     header(''Location: http://localhost/mobile'');

    5:     exit();

    6: }

    7: ?>

    ```


    This script should be placed or near the top of your PHP file so that it executes
    before the rest of the page is rendered. Line 1 is the standard ordering for running
    PHP. When is not any PHP code will not run. Line 2 shows a variable named $ua
    being created. This variable contains the UA of the browser viewing the page by
    being set to $_SERVER[''HTTP_USER_AGENT'']. Line 3 is a little interesting, but
    to sum it up it is checking for the existence of the string ''iphone'' within
    the $ua variable it is checking. When found it executes 4, which informs the browser
    viewing the page to redirect the browser to a different location. Line 5 simply
    stops further execution of the script. Line 6 closes the if block, and line 7
    closes our PHP script.


    This script can be modified to include more strings to look for either in the
    if block, or if you wanted to redirect to different pages or locations based on
    device type by including an else and/or else block.


    As a summary of using PHP for detecting and redirecting mobile devices let''s
    take a look at the pros and cons


    The pros of using PHP for mobile detection


    +   * Cleaner than using and managing .htaccess files

    * Compatible with any server that can run PHP

    * Not dependent on client-side logic to run


    The cons of using PHP for mobile detection are


    +   * Can be spoofed by modified UA strings.

    * Needs to match a string exactly.'
