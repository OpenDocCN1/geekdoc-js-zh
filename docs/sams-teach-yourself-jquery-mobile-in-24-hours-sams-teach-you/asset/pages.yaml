  md: '# Flash for Mobile


    Adobe announced in November 2011 that mobile versions of Flash would no longer
    be developed.

    This means the last version of Flash available on a mobile device is version 11.1.
    Security

    updates will still be maintained, but Adobe has shifted focus to pursuing HTML5
    technology. Keep

    in d mind that Flash is not completely dead in the mobile scene as it may still
    be used for developing

    mobile Adobe AIR applications. You can learn more by reading the blog post from
    Adobe located at

    http://blogs.adobe.com/conversations/2011/11/flash-focus.html.


    The HTML5 standard has support for video playback and can be used to embed video
    files into

    web pages. While a war is waging on the file types for videos in each browser,

    HTML5 has provided a way to skip the skirt. Listing 18.4 shows a snippet of HTML5
    code used to

    load and play back a video.


    # LISTING 18.4 Using HTML5 to Play Back a Video


    ```

    1: <video class="localvideo" controls>

    2: <source id="mp4_src"

    3:   src="ascent.mp4"

    4:   type="video/mp4; codecs="avc1.42E01E, mp4a.40.20">

    5: </source>

    6: <source id="ogg_src"

    7:   src="ascent.ogg"

    8:   type="video/ogg; codecs="theora, vorbis"

    9: </source>

    10: </video>

    ```


    Line 1 shows the use of the HTML5 video element with an attribute of class="localvideo"

    and a Boolean attribute of controls. The class attribute can be used for styling
    or to help

    with selecting the element, and the controls attribute is used to include play,
    pause, scrub,

    audio controls when the video element is rendered in a browser. If you choose
    to omit

    controls you will have to build your own player controls. Line 2 through 5 can
    actu-

    ally be on the same line, but I have broken them out so that they are easy to
    read and

    understand. Line 2 shows the opening tag of a source element. The attributes stored
    in this-

    are are what the browser will use to prepare the playback codecs to play the video.
    The

    id attribute works the same way as the source element as it does on other HTML
    elements,

    no change or surprise there. Line 3 shows the src attribute, which is used to
    give a path to

    tideo that will be played back. In this instance the file is in the same directory
    as the HTML file

    and is named ascent.mp4. Line 4 shows a rather complex type attribute. This attribute
    actu-

    ally supports attributes inside it, so you will notice that it uses a mix of single
    and double

    quotes to get all the data that it needs passed through. The first part of data
    passed is the MIME type

    for the file. The codec attribute is then passed and contains some strings that
