  md: '# Compiling the Application


    cable into your device and into your computer and then choose to run the project
    as an Android Application.


    # NOTE


    # Drivers for Debugging


    Depending on your OS you may need to download some drivers. If you have trouble
    connecting your device to Eclipse and running the application, visit http://developer.android.com/guide/developing/device.html
    and follow the steps to set your hardware. Remember to follow the fine print and
    ignore setting the android:debuggable="true" in your AndroidManifest.xml file.


    When you are satisfied that your application is working properly you can prepare
    for deployment by right-clicking on the project and choosing Android Tools and
    then Export Signed Package from the submenu. This opens a window that checks your
    project for errors. If none are found, you can click the Next button. If you have
    already created an Android application before, you should already have keystore,
    which you can use to sign your application. If you have never created one, you
    need to create a self-signed certificate by clicking on the CreateXXX radio button
    and clicking Next. Follow the menu as it generates you certificate. For more information
    on Android and certificates, visit http://developer.android.com/guide/publishing/app-signing.html.
    After you have used or created your certificate you are prompted to save the APK
    file to your file system. This is the file that contains your application, make
    sure you know exactly where you are putting it. Once you have chosen a location,
    click Finish to start the export process.


    When the file has been exported, you are returned to your project. From there
    you can email, copy or move the APK onto your Android device and install it. Remember
    that when installing APK files in this you must go into your device settings and
    enable Unknown Sources in the Applications section. If you have a developer account
    to publish your app in Google Play, you can upload the exported APK directly to
    your account. To register as a Google Play developer, visit https://play.google.com/apps/publish/signup.


    # NOTE


    # Default Icon


    When you create an application in Eclipse a default icon is used with your application.
    If you want to customize your icon, follow the icon guidelines at http://developer.android.com/guide/practices/ui_guidelines/icon_design.html.


    Once created, copy the images into your project into the appropriate res/drawable-folders.


    That is all there is to be quickly creating an app using PhoneGap and jQuery Mobile.
    If you want to port your application to another platform as iOS or BlackBerry,
    you can follow the'
  merge: -1
