  md: '# Looking at Virtual Mouse Events


    The virtual mouse events are an answer to compatibility problems between mobile
    and desktop browsers. For example, some mobile browsers support an event called
    touchstart, while other mobile browsers do not. Desktop browsers support the mouseover
    event and have support for hover over the use of the mouseover event while mobile
    devices have a hard time emulating or using the correct event. These problems
    are solved in jQuery by using virtual mouse events. When a page is loaded with
    jQuery, the browser is checked for support. Events are then supported based on
    the virtual mouse events. While this happens in the background, you can bind virtual
    mouse events to run specific functions, or even to get data that can be used in
    other functions.


    The virtual mouse events that are available


    +   * vmousever

    * vmousedown

    * vmousemove

    * vmouseup

    * vclick

    * vmousecancel


