    to use as a gradient tool when I am away from my design software.


    Figure 16.3 shows the properties changed by use of the inspector.


    ![](img/56578b432709a7220ba1c18b41eabe62_314_0.png)


    FIGURE 16.3

    The inspector tool makes it easy to find the exact element you want to edit.


    As you have already noticed, when using the inspector to select a header, the
    properties of the swatch you clicked on were opened. If you didn''t notice, use
    the inspector to change the settings for the header of the B swatch. Notice how
    when the header is selected the properties are opened only for the B swatch. This
    is expected behavior, there are some elements that are part of the Global swatch.


    To change the Global swatch settings make sure that you have the inspector enabled
    by clicking on the Large On button. Next, move your cursor down the icon in the
    header that looks like a house of any of the open swatches. When your mouse is
    hovering over the home icon it should have a box surrounding it. Click your mouse
    to select it for editing. Notice how the properties editing area is not opened
    to the properties of a particular swatch letter but is instead automatically opened
    for the Global swatch. This is because some elements are shared between all swatches.
    This includes the icons used on your site, as well as the radio button colors,
    the check marks, and the active state for some sliders and select boxes.


    Now that we know how to use the inspector to quickly get an idea of where properties
    are and how to adjust them in various swatches, let''s take a look at adjusting
    the properties manually.'
