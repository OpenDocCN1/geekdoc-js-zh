  md: '# HOUR 14

    Sprucing Up Your Design


    What You''ll Learn in This Hour:


    +   - Popular copyrights and licenses used with software

    - Where to find custom icons and icon sets

    - Where to find stock images

    - How to use custom fonts in your site

    - Using plug-ins with jQuery Mobile


    You are probably at the point where you would like to expand on some elements
    of your design to help make it personal and unique. This is where custom icon
    sets, images, and custom fonts come into play. Also not to be ignored is the addition
    of plug-ins that can help manage the look, flow, and feel of your site. But before
    we get into that, we need to square away a few technical details that keep you
    out of trouble and operating your site smoothly.


    # Understanding Copyrights and Licensing


    Oddly enough those who know the most about copyrights and licenses are the ones
    who are enforcing or breaking them. While you already may have your opinions on
    copyrights and licenses, you should know about them. Ignorance may work a bit
    when dealing with a cease and deist letter, but it will not save you when you
    try to publish your application or try to pass someone''s work off your own.


    There are several types of copyrights and licenses that you should be aware of
    when you are creating a site or mobile application. No matter what license is
    in use, the best thing to do when in doubt is to contact the artist, owner, or
    company of any copyrighted work. Let''s go over some of the common licenses that
    you will find when looking to extend your mobile site.


    # General Public License (GPL)


    This license has gone through a few different versions and currently resides at
    version 3. It was first created in February 1989 to help developers publish code
    that could not be taken by others'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'redistributed as another''s work. It required developers to release human-readable
    source code with any binary or compiled code.


    Version 2 of the GPL (GPLv2) was released in 1991 and is still used in a considerable
    amount of projects and programs today. It added clauses to fix some loopholes
    that hardware manufacturers exposed through the use of software detection that
    would not let hardware function when a software modification was made. It also
    included a clause making it illegal to distribute any software under GPL2 if the
    software had been legally released or court-ordered to be distributed without
    source code.


    Version 3 of the GPL was released in 2007 and was geared to address some of the
    areas concerning the license with patents, compatibility with other licenses such
    as the MIT and Apache licenses, and define source code. This version also added
    some room for developers to release source code over peer-to-peer connections
    as long as it is clear to the user where they may obtain the code. The most recent
    Linux kernel has been released using this version of the GPL.


    When any version of this license is applied to software, it is distributed but
    must remain under the specified license. Software released under this license
    may belong to other parties, but they may not build proprietary software from
    it.


    This means that if you are running a website you are generally free to run with
    software (including plugin-ins) that are licensed through the GPL because it is
    not being distributed. The tricky part becomes when you attempt to bundle your
    site and sell it in an application store or market as it becomes something of
    a proprietary software package or program. Projects that use jQuery and jQuery
    Mobile may use the GPL license.


    You can learn more about the GPL and the version used by jQuery (GPLv2) by visiting
    the following links:


    +   - http://www.gnu/licenses/gpl.html

    - http://en.wikipedia.org/wiki/GNU_General_Public_License

    - http://en.wikipedia.org/wiki/Tivoization

    - https://github.com/jquery/jquery/blob/master/GPL-LICENSE.txt


    # The Massachusetts Institute of Technology (MIT)


    The Massachusetts Institute of Technology (MIT) license is a popular license used
    with software. The MIT license was originally created for use with the Windows
    System and is popular with open source projects. Part of the reason for the popularity
    is that it allows code and programs to be released as open source, but also to
    be incorporated into proprietary projects and applications. The jQuery Mobile
    is dual licensed to use either the GPL and/or the MIT license.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Understanding Copyrights and Licensing


    This is the license that enables you to include the jQuery Mobile framework in
    any applications that you publish to any application or marketplace.


    The MIT license is occasionally referred to as the Expat and X11 license although
    there are slight differences between them.


    You can read more about the MIT license and the jQuery uses by visiting the following
    links:


    +   * http://www.opensource.org/licenses/MIT

    * http://en.wikipedia.org/wiki/MIT_License

    * https://github.com/jquery/jquery/blob/master/MIT-LICENSE.txt


    # The Berkeley Software Distribution (BSD)


    This license was originally created for Berkeley Software Distribution, which
    was a UNIX variant created at Berkeley. It is similar to the MIT license in the
    respect that any software using it is freely available for modification, redistribution,
    and inclusion provided that the text of the license is included.


    Today a couple of versions of the BSD license are available to use. These are
    sometimes referred to modified BSD licenses.


    The Modified BSD license was created in 1999 and contains three clauses that state
    that the software must be released with a copy of the license, the binary format
    of the software must also include a copy of the license, and the original developer(s)
    or institution does not endorse work or can be used as an endorsement on derivatives
    of the original code.


    There is also a simplified version that contains two of the three clauses to omit
    the clause. While it does remove that clause, it adds a paragraph about the views
    and opinions of the software author.


    The jQuery framework includes the Sizzle selector engine created by the Dojo Foundation
    and released for development under the GPL, MIT, and BSD license. To learn more
    about the BSD license visit the following links:


    +   * http://www.opensource.org/licenses/BSD-3-Clause

    * http://www.opensource.org/licenses/bsd-license.php

    * http://en.wikipedia.org/wiki/BSD_licenses

    * http://en.wikipedia.org/wiki/Berkeley_Software_Distribution

    * http://www.linfo.org/bsdlic.html

    * https://github.com/jquery/sizzle/blob/master/LICENSE'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Creative Commons


    Creative Commons created the Creative Commons license in 2002. It originally aimed
    to help content creators easily distribute works with clearly defined rules for
    what could be done with the work. Four major rights were attached to the license.
    These were Attribution (must give credit to original author), Noncommercial (may
    not be used for any commercial work), No Derivative Works (may not create new
    works based on, or using any part of the original work), and ShareAlike (may be
    used, but must be verbatim with no modifications). These rights could then be
    mixed and matched to create a license that was suitable by the creator.


    Currently six variations are in common use today. These are


    +   - Attribution alone (BY)

    - Attribution + NoDerivatives (BY ND)

    - Attribution + ShareAlike (BY SA)

    - Attribution + Noncommercial (BY NC)

    - Attribution + Noncommercial + NoDerivatives (BY NC ND)

    - Attribution + Noncommercial + ShareAlike (BY NC SA)


    Currently using any version of the license requires that the original author be
    given credit or attribution rights for the work.


    This license is not recommended for software and instead is used on copyrighted
    works such as books, music, pictures, blogs, and so on. Any work released under
    this license cannot be reverted or restricted to another license provided that
    it was originally received under the license.


    To learn more about the Creative Commons license, you can visit the following
    links:


    +   - http://en.wikipedia.org/wiki/Creative_Commons_licenses

    - http://en.wikipedia.org/wiki/Creative_Commons

    - http://creativecommons.org/licenses/

    - http://www.flickr.com/creativecommons/

    - http://soundcloud.com/101/creative-commons


    # Mobile Application Licensing


    Using licenses with mobile applications can be tricky. Most application stores
    or markets have a policy in place that gives you a legal outline of what licenses
    are allowed for distribution in their store. Some stores allow distribution of
    apps that contain GPL code; others do not.'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'While you may create a web app that uses GPL code and allows users to browse,
    view, and interact with your site through a web browser, packaging that site in
    a webview or repacked native application may violate the terms of the store agreement.
    This is true even when you offer the application for free inside the marketplace.


    Always remember to read the licensing agreements before you distribute the application
    as some licenses require you to provide the source code if someone asks for it.
    For store Terms of Service visit the following links:


    +   - iTunes Store

    http://www.apple.com/legal/itunes/us/terms.html

    - Android Market/Play

    http://www.android.com/us/developer-distribution-agreement.html

    - App Hub (Windows Phone and Xbox LIVE)

    http://create.msdn.com/en-US/home/legal/terms_of_use

    - BlackBerry

    http://us.blackberry.com/legal/terms.jsp


    Now that we''ve learned a bit about licensing, let''s learn where we can find
    images and plug-ins that we can use in jQuery Mobile projects.


    # Finding Images


    Whether you are looking for a custom set of icons or some stock imaging to use
    as a background you need images. If you are a designer then you are probably already
    in good shape where images are concerned; however, every now and then it''s good
    to know where to go to get images when you are in a pinch or need some inspiration.


    # Getting Icons and Icon Sets


    You already know that some icons are included with jQuery Mobile by default, but
    when you are trying to make a unique app or just want to see what other developers
    and designers are doing, looking up icons can be beneficial.


    Icons can be located from several difference sources. They can be downloaded or
    acquired from commercial websites that specialize in maintaining large libraries
    of icon files, or from free or social sites. Let''s go over a few sites and learn
    about what is offered and what you can expect to find.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Using Commercial Sources


    Commercial sites generally offer the best-looking resources and have a wide selection.
    Not all commercial sites are equal, and not all offer you the same type of product.
    For example, some sites happily sell you an icon set delivered in multiple .png
    files with different dimensions. This may not bother you too much because you
    might be able to rescale the images without too much pixelation, but it might
    have been nicer if they had given you a vector set that you could use to create
    your own size without any loss in quality.


    Whenever you go to make a purchase, try to get a sample first. This way you will
    know for sure whether the files you are purchasing work with your setup. Another
    thing to keep in mind when buying icons and icon sets is the license they are
    using to sell them to you with. Many commercial sell icons under a royalty-free
    model. This doesn''t mean that you are buying the work and it means that you are
    buying the work to use on your site or application and you pay once. It does not
    give you the right to bundle or redistribute the icons for resale.


    The following is a list of sites that sell commercial icons and icon sets:


    +   - http://icondock.com/

    - http://stockicons.com/

    - http://www.iconshock.com/

    - http://icondrawer.com/

    - http://graphicriver.net/category/icons

    - http://www.shutterstock.com/

    - http://www.icojoy.com/allicons/

    - http://somerandomdude.com/work/iconic/

    - http://tipogram.com/


    # Getting Free Icons


    Not every project is going to require you to use a commercial set of icons, and
    even if you may not have a budget that is big enough to support getting a set
    to get it done. You don''t have to worry, though; plenty of places still offer
    free icons and icon sets.


    If you''ve done some searching or read a few design blogs, you know that there
    are tons of “free icons!” and “free for download!” resources. What you may have
    missed is that some lines usually contain a link to a commercial set of icons
    that dual licensed—one for personal projects under a CC license, and one that
    usually includes a royalty-free license. An example of this is the “gentleface”
    icon set (https [url hidden]). This is an icon set that has been released for
    public works under the CC (a, nc) license. You can use it on your'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Finding Images 259


    own site as long as you give credit back to where you acquired the icons and as
    long as you are not using it for commercial purposes.


    Not all icon sets will be free, and some of them pale in comparison with the detail
    and time spent on making them look polished and good; however, that doesn''t mean
    that you won''t be able to find anything.


    The following sites all contain free icons or icon sets:


    +   * http://www.famfamfam.com/lab/icons/

    * http://www.defaulticon.com/

    * http://www.greetip.com/open-source-icons-gcons/

    * http://www.iconza.com/

    * http://www.iconeden.com/icon/category/free


    # Using the Web to Find Icons and Icon Sets


    One of the best things about the Web right now is that there are so many different
    ways to find the resources you need. You can use search engines, blogs, and social
    sites to find links to icons and icon sets.


    Some of my favorite resources of images and designs are blogs. The following list
    is a great place to get started with finding icons:


    +   * http://www.smashingmagazine.com/

    * http://www.noupe.com/

    * http://www.speckboy.com/

    * http://www.webresourcesdepot.com/

    * http://www.hongkiat.com/blog/


    While you can visit each of these sites and dig through all the posts to find
    icons and icon sets, the easiest way I''ve found is to use Google to do it for
    you. All you need to do is open http://www.google.com and then type the following
    into the search box:


    ```

    site:smashingmagazine.com

    ```


    When you press the Enter key on your keyboard or click the Google Search button
    on the page, the results returned will be all from smashingmagazine.com and will
    contain the word "icons." You can refine the search further by adding "sets" or
    "free" to the search. To search other sites, just replace the "smashingmagazine.com"
    portion with the site you want to check.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'You can also sort through Twitter the way. Just put twitter.com in and watch
    the links coming pouring in. Of course you can also visit http://twitter.com and
    use the search box on the site to find icons and icon sets. Another way to find
    icons through Twitter is to check the tweets from the sites mentioned previously.
    I''ve found that many sites and blogs share links through Twitter that leave off
    their sites. Many of them are also very friendly and helpful, so if you have a
    question, feel free to contact them and see if they can give you some direction.


    Now that you know how to find icons, let''s go over stock images.


    # Sorting through Stock Images


    Before I jumped into dealing with ecommerce and marketing, I really had no idea
    how big the stock image market was. For some reason I had stuck in my head that
    whenever someone needed a picture they''d hire a photographer or grab a camera
    and run out to take pictures. While that happens, there are occasional problems
    such as weather, season, time, and location that really mess up. When this is
    the case, using stock images is a good way to get the images you need. Another
    use for stock images that you may not have thought about using them for textures.
    You can use textures to add noise or depth to an otherwise visually bland brand
    or logo. Let''s take a few minutes to go over how to get stock images.


    # Commercial Stock Images


    Just like icons and icon sets, stock images are available through many commercial
    sites. Most images are offered through a royalty-free system allowing you to use
    the images anyway you want as long as you do not distribute or sell them. Be sure
    to read the licensing terms when you make your purchase though so that you know
    exactly what you can do with the image.


    Many commercial sites allow you to purchase individual images, or sign up for
    a monthly plan where you pay a set amount and in return are allowed a set number
    of credits or downloads.


    Popular commercial sites for acquiring stock images are


    +   - http://www.istockphoto.com/

    - http://www.shutterstock.com/

    - http://us.fotolia.com/

    - http://www.veer.com/


    Just like icons, you can find several sites that allow you to use some images
    for free. Let''s take a look at free stock images.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Free Stock Images


    Some images can be acquired for free and used without cost, even on commercial
    projects. Others allow you to use them, but only for nonprofit projects. You can
    mix some of them to create new images or derivative works without worrying violating
    any licenses.


    The free side of stock images seems to be from artists who are trying out new
    styles, new equipment, or are just trying to make a name for themselves without
    too worry about having a perfect high-end product. While that is not always the
    case, it is much more difficult to find exactly what you are looking for when
    dealing with free. The saying “You get what you pay for” literally holds true
    in this instance. Still, I''ve found many free stock images that I have used over
    textures, or even masks to make some interesting images and backgrounds. As I''ve
    said, always check the license and give credit where credit is due.


    The following is a list of sites that offer free stock images:


    +   * http://www.sxc.hu/

    * http://www.everystockphoto.com/

    * http://www.flickr.com/

    * http://www.stockvault.net/

    * http://www.deviantart.com/

    * http://search.creativecommons.org/


    Another element that you may want to add to your mobile site is extra functionality.
    Some of that can be added through the plug-ins.


    # Functionality Enhancement with Plug-ins


    When developing with frameworks like jQuery Mobile, plug-ins can help you easily
    enhance your functionality. Plug-ins are functions or methods that come packed
    together that can be added to help with special effects, change default behavior,
    or help with some of your logic.


    # Finding Plug-ins


    jQuery Mobile is new, the amount of plug-ins is not as large as the original jQuery
    framework. However, as it continues to gain popularity, more developers will use
    it and release plug-ins to help others do what they have already done. This is
    beneficial for developers who know what they want, but are unsure of exactly how
    to do it. The part that I love most about plug-ins is digging through the source
    code so I can tell what they are doing, and so I can modify it to fit my exact
    needs.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# HOUR 14: Sprucing Up Design


    Locating jQuery Mobile plug-ins can be difficult at first, but as soon as you
    know where to look, it becomes much easier. The first place to start is with a
    fantastic page that the jQuery Mobile team has put together at http://jquerymobile.com/resources/#Plugins.


    This resource page contains sites that run jQuery Mobile, applications and frameworks
    that you can use to build jQuery Mobile sites, plug-ins and extensions, and even
    some templates for use with wireframe building software.


    The second place I suggest looking is Twitter. The official jQuery Mobile team
    @jquerymobile does a terrific job of posting new plug-ins and resources when they
    are available.


    # Using Plug-ins


    Because plug-ins cover anything that is added to the base library, they can be
    included through different means. Some plug-ins are JavaScript files that you
    include along with jQuery Mobile, and others are additional CSS files. We''re
    going to take a quick look at using the 960 grid plug-in with a page that is using
    jQuery Mobile.


    The 960 grid is a popular grid system that is in use on desktop websites. It allows
    pages to be flexible and allow content to grow and shrink based on the viewable
    space of the browser. The jQuery Mobile port of the 960 grid plug-in for this
    system can be found at http://jeromeetienne.github.com/jquery-mobile-960/


    Listing 14.1 shows the contents of plugin_960gs.html, where the plug-in is being
    used on a page with jQuery Mobile.


    # LISTING 14.1 Using a Plug-In with jQuery Mobile


    ```

    1: <!DOCTYPE html>

    2: <html>

    3: <head>

    4:     <title>Developing with jQuery Mobile</title>

    5:     <meta name="viewport" content="width=device-width, initial-scale=1">

    6:     <link rel="stylesheet" href="http://code.jquery.com/mobile/1.1.0/jquery-mobile-1.1.0.min.css"
    />

    7:     <link rel="stylesheet" href="http://jeromeetienne.github.com/jquery-mobile-960/css/jquery-mobile-fluid960.min.css"
    />

    8:     <script src="http://code.jquery.com/jquery-1.7.1.min.js"></script>

