  md: '# HOUR 17

    Detecting Mobile Devices


    # What You''ll Learn in This Hour:


    +   - Why developers choose to use mobile detection

    - Various methods of detecting mobile devices

    - How to redirect a mobile device after detection

    - Pros and cons of mobile detection methods


    You may have noticed that when you visit some websites on your mobile device you
    are automatically redirected to a mobile version of the site. While this may seem
    like Internet black magic, there is a much simpler explanation for the events
    that happen behind the scenes. Before we get to the magic, let''s take a moment
    and learn why mobile detection is important.


    # Learning the Importance of Mobile Detection


    Over the last decade we have enjoyed progressively faster and connection speeds.
    Companies have raced to wire every home with broadband connections, satellite
    service has improved and expanded to remote users, and wireless technology has
    taken leaps forward in providing service to users on the move. As the connection
    speed of users has increased developers have continued to crawl and more and more
    data down the pipe. The benefit to the amount of data that a developer can send
    is the ability to create rich user experiences and websites that act like fully
    installed applications. The downside is that heavy websites bring connections
    to a crawl and force users to watch loading screens while data is painfully pulled
    down the client.


    You may remember back when you type in an address for a site and a page would
    appear asking if you would like the high-bandwidth or low-bandwidth version of
    the site. The high-bandwidth version often contained animated images, Flash content,
    and for a every site had to have music playing. On the other hand, if you chose
    the low-bandwidth alternative, you were treated to possibly one or two pictures
    and a screen full of text. This is where mobile detection comes into use.'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'Mobile detection gives developers the ability to create a lighter experience
    that can either be generic or custom tailored to the device requesting the data.
    In this respect you can choose whether you want to force a large media-filled
    experience down to size a user or trade it out for a minimalistic. It also allows
    you to include full size images and backgrounds or to include smaller images and
    a solid color background intense. Knowing when a mobile device is viewing your
    site is as important as it gives clues to the audience that is viewing your content
    and can help you make changes that benefit the main users of your site.


    Mobile devices has shifted over the last few years as mobile devices continue
    to blur the line between desktop browsers and mobile browsers. Methods that used
    to be valid and indis are now flawed and not recommended for filtering traffic
    from one version of your site to another. One method previously used to determine
    which devices were mobile was to detect support. A test could be run on the client
    browser and if the JavaScript could not be run then it would run the mobile version
    of the page. While this worked to some degree, it left large gaps and holes on
    who would see the page. Smartphones crossed into browsers with JavaScript support,
    this method quickly fell from prominent use and is now used for feature detection
    and fallbacks for browser support.


    Today are methods that still let some devices through but have a greater chance
    of catching the majority of mobile devices. Let''s take a look at using some server
    configuration files to find out what device is browsing our network.


    # Using the .htaccess File


    Those familiar with using the Apache web server already know that using .htaccess
    files can come in handy for a variety of uses. These files allow you to create
    server configurations that apply to the folder they are placed in. Configuration
    changes can range anywhere from redirects to creating files under authentication.
    It just so that they can also be used to help direct mobile visitors to a different
    site or when used.


    To use the .htaccess file as a means to redirect traffic you need to learn a little
    about what a mobile browser reports to the server. Each mobile browser has a specific
    string it passes to the server when it requests a file. This is known as the User
    Agent (UA). By checking the UA when a page is requested you can determine whether
    the page should be delivered as is, or whether it should tell the browser requesting
    the page to go to a different directory, domain, or file.


    Take a look at the following UA and see what you can tell them they came from:


    +   - Mozilla/5.0 (iPhone Simulator; CPU iPhone OS 5.0 Mac OS X) AppleWebKit/534.46
    (KHTMLHTML, like Gecko) Version/5.1 Mobile/9A334 Safari/7534.48.3"'
  merge: -1
