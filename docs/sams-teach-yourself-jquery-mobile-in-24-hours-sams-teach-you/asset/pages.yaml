    icons used with list items


    Now that we have made our lists look more exciting and visually descriptive, let''s
    make them

    even more useful by using a split list.


    # Creating a Split List


    A split list is a list that contains list items that have more than one link in
    them. When you

    place two a elements inside the li element, jQuery Mobile automatically creates
    a split list.

    The first element takes the majority of space of the list item leaving the second
    element a

    small space for an on the right side of the list item. Because split lists are
    auto-

    matically created by adding a second link, you can mix other list extras together.
    Listing 11.6

    shows a snippet of code used to make a split list.


    # LISTING 11.6 Creating a Split List


    ```

    1: <ul data-role="list-split-theme="e">

