  md: '# Looking at Mobile Operating Systems


    Just as there are a wide variety of mobile devices there are also a wide variety
    of operating systems that run them.


    # iOS


    Many are familiar with iOS as it powers many of the “iDevices.” It has been around
    since 2007 and was originally named iPhone OS. It features tight integration with
    the Apple OS (known as OSX), iTunes, and the App Store.


    When it was originally introduced few apps were available in the App Store, so
    many developers build web apps that run in the dimensions of the iPhone. Web apps
    are still supported by the platform and run inside Mobile Safari (the web browser
    packaged inside).


    Other web browsers are available for iOS and can be purchased in the App Store.


    Developers can download the Software Development Kit (SDK) for free but are required
    to pay a registration fee per year to publish applications in the App Store. Applications
    must go through a submission process where they are either accepted and placed
    in the App Store, rejected and sent back to the developer to fix: While native
    code is written and compiled with Objective-C, there are frameworks that take
    HTML, CSS, and JavaScript compile it to run as a native app.


    # Android


    Mobile devices that run the Android OS have been on the rise during the last few
    years. Android started in 2008 by Google and the Open Handset Alliance and is
    currently used in tablets, mobile phones, and personal media players. It features
    the Play Store, Play Music, Play Books, widgets, and extra customization through
    the use of “routing” the device to install modified versions of the OS (please
    be aware that routing a device will usually void your warranty).


    Android originally branched into versions for small screen devices (phones) and
    large screen (tablet) devices but is coming into a unity with future versions.


    Android ships with a built-in browser based on WebKit (the same WebKit that Chrome
    is based on). Similar in support to Mobile Safari (which is also based on WebKit)
    any CSS3 and HTML5 features are supported.


    Native application development is done with the Android SDK, which can be downloaded
    for free. Code is written in Java, extended with API calls, and then compiled
    for device usage. There is a one-time developer fee to release your app in the
    Android Market. While applications are'
