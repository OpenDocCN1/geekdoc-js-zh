- img_proc: true
  md: 'You save time in development by being able to ramp up new developers quickly
    by leveraging skills they already have. In larger projects they require hundreds
    or even thousands of lines of code, time is saved in the simplicity of creating
    and using objects.


    The jQuery framework saves you bandwidth by reducing the amount of code needed
    to accomplish what you do and turn reduces your overall file size. Even though
    including a framework takes some bandwidth itself, if server-side compression
    is enabled on your server, the file-size of the jQuery framework is only 31kb.


    During this hour, we learn how jQuery makes things easier through the use of selectors,
    filters, and chaining.


    # Including jQuery in Your Site


    Implementing the jQuery framework into your site is as straightforward as adding
    any external JavaScript file. To add jQuery to your site, do the following:


    +   - Include the jQuery library either from a local location or by using a Content
    Delivery Network.


    +   - Include or inline your JavaScript after the jQuery library inclusion.


    +   - Make sure that your code is initialized by calling the $(document).ready()
    function.


    Use the following snippet to include the jQuery library just before the closing
    body tag in HTML file. The following code snippet uses a Content Delivery Network
    (CDN) to host the library rather than loading a local copy of the jQuery library.
    Note that when using jQuery Mobile 1.0 the following snippet loads the version
    of jQuery you will use:


    ```

    <script type="text/javascript" src="http://code.jquery.com/jquery-1.6.4.min.js"></script>

    ```


    When using jQuery Mobile 1.1 use the following snippet to load jQuery:


    ```

    <script type="text/javascript" src="http://code.jquery.com/jquery-1.7.1.min.js"></script>

    ```


    Loading the script file remotely provides a couple of nice benefits. First, most
    CDN locations will use compression on the file. Some web hosts do not allow server-side
    compression because of the extra cost in processing power on the server, so loading
    the file from a provider that does is nice. The second benefit is that by loading
    the script from a different domain you save yourself from possible HTTP request
    blocking. That in turn allows the browser to request an extra file and load your
    site faster. Another benefit of using the public CDN link is the odds are good
    that a user has already visited a site using the same script, and therefore will
    already have a cached copy saved to their browser cache further speeding up the
    loading of your site.'
