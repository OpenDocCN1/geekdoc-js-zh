  md: '# Positioning Your Animation


    Note that animation changes are called and run just like CSS changes. This means
    that to adjust the left, top, right, and bottom properties of an element, that
    element must be positioned using position: absolute or position: relative. Failure
    to have the element positioned causes the animation without throwing any JavaScript
    errors.


    Animations are a great way to add interactivity and user entice to your website.
    You can even use the animation function to build rudimentary games and effects.


    # Summary


    You just learned the jQuery framework and a few of its uses. You also learned
    how to load it to your website by calling the file from a local location or by
    a CDN.


    You learned about jQuery selectors and how you can select various elements in
    the DOM so that you can manipulate them.


    You learned about chaining functions together and the possible errors that can
    occur when running all code parallel instead of running it in sequence.


    You also learned that jQuery offers an .animate() function that can be used to
    make an object size and even location on the page.


    # Q&A


    +   Q. Why should you use a CDN?

    A. A Content Delivery Network is a network of servers in various geographical
    locations that serve files from a location that is closer to your location. This
    helps to load required files faster for everyone. Another reason why a CDN is
    a good idea is that most of them will serve gzipped and minified versions of the
    file you requested. Serving gzipped and minified files is important as file size
    is greatly reduced. They are also useful as they do not count against the total
    number of URL connections that your browser is allowed to make in the same way
    as local files and resources do.


    +   Q. I included jQuery on the page but nothing is working, how do I fix it?

    A. Including the jQuery library on your page is not enough. Remember that if you
    do not wrap your code in the $(document).ready() function it will not run. If
    on the other hand you are getting a "$ is not defined" error in your JavaScript
    console, make sure that you have included the jQuery library before your custom
    scripts.'
