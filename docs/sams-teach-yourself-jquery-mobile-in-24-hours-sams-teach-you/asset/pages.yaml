  md: '# HOUR 22


    # Using Mobile Device Emulators


    What You''ll Learn in This Hour:


    +   - Why you should use device emulators

    - The weaknesses of device emulators

    - Where to find device emulators

    - How to use emulators with your site


    Whether you are developing a website or a web application, considering the way
    it will display and handle on different devices is an issue that you must deal
    with. When you fail to plan ahead for different devices and browsers, you can
    leave some fairly embarrassing gaps in your site. While it is true that most smartphones
    either ship with or can run an HTML5 capable browser, there are still legacy devices
    and proprietary browsers that render your code differently. This is where using
    mobile device emulators comes into play.


    # Turning to Mobile Device Emulators


    If you''ve never used an emulator, before, you can think of it as a virtual device
    or program that performs similarly to the actual device. Many emulators allow
    you to experience how the device will behave from startup to shutdown. Other emulators
    are application wrappers that allow you to use certain applications of the mobile
    device. When dealing with a mobile site, emulators give you an idea of how the
    site will be displayed and how the user will interact with what they are presented.


    Using an emulator for mobile devices is especially important as mobile devices
    translate some events differently than desktop browsers. Another reason that you
    should use an emulator is to understand the wide array of screen resolutions available
    to mobile devices. It''s always good to test the theory of responsive design and
    site layout, until you have have used either an emulator or an actual device it
    may be difficult to fully appreciate how your design and site layout handles on
    a tablet device instead of a smartphone.'
  merge: -1
  pgno: 414
- img_proc: true
  md: 'From a cost perspective, device emulators offer a great starting point for
    small shops, taps, developers, and those who are only able to devote weekend-warrior
    status to development. Emulators are generally free or only require a shorter
    developer application to be filled out prior to download. This makes it easy for
    you to get started testing and creating websites and web applications that run
    as smoothly as possible on the actual device.


    While using an emulator may sound like a developer’s dream come true, there are
    actually potential problems that you need to keep in mind. The biggest issues
    from emulators not giving a completely accurate portrayal of how the device works.
    Think about how most mobile devices work. Most tablets or smartphones use a touchscreen.
    When you use an emulator you are presented with a screen or image of the device
    or application. The problem then becomes manipulating the device. While the mouse
    does a fair job at acting out taps, gestures or swipes are impossible to perform.
    Many emulators have found assisted ways around this, adding some features that
    allow you to hold a key on your keyboard while clicking-dragging to create gestures
    like pinching. Other emulators include special keyboard and mouse modes to help
    you navigate around them. Another problem you run into when using emulators is
    speed. Because most mobile devices run on different types of processors, the languages
    they use are translated differently to the processor. This means that for emulator
    to function it needs to be compiled in another language or it needs to convert
    all the input from the host machine into a native format that it can use to process.
    This takes a considerable amount of time, leaving you with a device that may not
    function at the same speed as an actual device. By that same token, there are
    occasions where the emulator actually runs faster and more responsively than the
    actual device.


    Another problem is application support. Many emulators come with a limited feature
    set and limited ability to add new programs. Since most emulators provide a browser
    this will not be too much of an inconvenience but a shock if you are not expecting
    it. You should also be aware that emulators do not run inside another emulator.
    While that may sound like a no-brainer, let me explain it in a way that is more
    common for developers. If you are on OSX and are running a version of Windows
    in a VM, you will not be able to use the Windows Phone Emulator. You may be able
    to install it, but it will not function. On a similar note, the IOS simulator
    will not function on any except OSX. Some pseudo-emulators will think either Safari
    or Chrome to act like iOS, but if you want the official emulator, you need to
    be running on hardware with OSX installed.


    Following is a quick summary of the pros and cons of using device emulators:


    Pros of using device emulators:


    +   - Low cost alternative for development

    - Properly displays device resolution'
  merge: -1
  pgno: 415
