- img_proc: true
  md: '# Using the Inspector Tool for Adjustments


    The inspector tool works similarly to the common inspection tools found in many
    of today''s browsers. You simply click the On button and then as you hover over
    a portion of swatch it will be outlined. When you have the exact element you want
    to edit outlined, click your mouse to select it. When an element has been selected,
    the properties area on the left side of the ThemeRoller site automatically opens
    to the style properties of the selected element.


    Let''s walk through an example of using the inspector to change some values on
    a swatch. We''re going to change the header color of the A from the default gray
    to something little more colorful. To start, make sure the inspector is currently
    enabled by clicking on the On button. Next move your cursor over the header of
    the A swatch. You''ll know that you are in the area where the entire header section
    is outlined.


    When the header is correctly outlined, click your mouse, and the Header/Footer
    Bar properties of the A swatch opens for editing on the left side of the ThemeRoller
    site. Note that the inspector will still be, so as you move your mouse over the
    swatch on the way to edit the properties, any swatch elements you pass over will
    be outlined. While this may be a bit confusing at first, it actually comes handy
    when you accidentally select an element you didn''t mean to select the first time.


    With the properties for the Header/Footer Bar op, you can see that you can change
    the TEXT COLOR, SHADOW, BACKGROUND, and BORDER color. The colors can be changed
    using standard RGB hex color codes, or you can click on them to open a color wheel
    to help you select the color you want. While RG values use with ThemeRoller, the
    tool is a little buggy with them. The values must not have spaces between them,
    and the input text field and the text color turn white. The TEXT SHADOW has four
    boxes for adjustments. The first box adjusts the x-axis of the shadow, the second
    box adjusts the y-axis of the shadow, the third box controls the spread or dithering
    of the shadow, and the fourth box controls the shadow color.


    # TIP


    # Shadows Are Not Black


    While your mind may play tricks on you and tell that shadows are pure black, they
    most definitely are not. To try this out for yourself, grab a flashlight and head
    toward a wall. Turn on the flashlight and put your hand in front of it. This does
    enable you to make some killer puppets, you should notice that the shadow on the
    wall is not pure black. Rather your shadow is either a different shade of the
    color of the wall it''s being projected on, or a different shade of the light
    being projected out of the flashlight or light source you are using. I''m not
    saying you can''t use #000000 for your shadow color, just that it isn''t the real
    color of a shadow.


    The BACKGROUND section is another property that contains some extra options you
    can use to fine-tune the settings. Next to the base color property is a slider
    that adjusts the gradient level'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'of the selected color. Moving the slider to the right adds a gradient that
    moves from light at the top to the bottom. The opposite is true for adjusting
    the slider to the left. If you change the base color from the default setting
    of #e9eaeb to another color, say #f7931e, then the slider adjusts for various
    shades of orange to be applied. If you click the + box next to the slider, then
    START and END properties appear, and you can manually change the gradient that
    is applied. You can also watch the values in these boxes change by dragging the
