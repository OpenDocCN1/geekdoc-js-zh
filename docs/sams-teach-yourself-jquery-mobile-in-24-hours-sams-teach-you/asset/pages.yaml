    folder from the current location on your development location on your production
    installation of WordPress. This is the exact process you used when you moved the
    original theme to begin editing and viewing the theme. If you were already working
    on the theme on your production environment, you don''t actually have to do anything
    since it''s already live.


    ![](img/56578b432709a7220ba1c18b41eabe62_477_0.png)


    FIGURE 24.10

    The archive.php page rendered on a tablet'
