  md: '# HOUR 8

    Tuning the Toolbars


    What You''ll Learn In This Hour:


    +   - How to add a header toolbar

    - How to add buttons to the header toolbar

    - How to add a navigation toolbar

    - How to add a footer toolbar

    - How to use positioning with toolbars

    - How to use a persistent navigation toolbar


    Whether you are building a mobile site or a mobile app, you are probably going
    want to use a toolbar. Toolbars allow you to present content in a familiar and
    useful way. Toolbars are generally used for the header and footer sections of
    your pages.


    You may not always opt for, or even use a toolbar on every page of your mobile
    site. However, there are several occasions where they are useful. I have frequently
    used footer toolbars to house my navigation sections, allowing my site to give
    a more mobile-application feel. By including a persistent header or footer toolbar,
    you allow the user instant access to important options or links within your site
    without making them scroll around to find the links they are looking for.


    Now that we know a little about what we can do with toolbars, let''s learn how
    to add them to a mobile site.


    # Adding a Header Toolbar


    This may seem a little déjà vu, but I''m going to show you how to add a header
    toolbar to a page. Listing 8.1 shows the code from a standard page section with
    a header toolbar added.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# LISTING 8.1 Setting Up a Header Toolbar


    ```

    1: <div data-role="page">

    2: <div data-role="header">

    3: <h1>I am a header toolbar</h1>

    4: </div>

    5: </div>

    ```


    Just in case you were wondering, you have done the code in Listing 8.1 before.
    Whenever you use data-role="header" on a div element, you are actually setting
    up a header toolbar. Figure 8.1 shows the output from the code snippet in Listing
    8.1.


    ![](img/56578b432709a7220ba1c18b41eabe62_151_0.png)


    FIGURE 8.1

    An empty page with a header toolbar


    You can do more than just use the header toolbar as a title for your page; you
    can also add up two buttons. This makes the header toolbar useful for displaying
    options on data-entry or similar pages.


    To add a button into the header toolbar you simply need to add a link and style
    it as a button. Listing 8.2 shows an excerpt of page code where one button has
    been applied.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# LISTING 8.2 Adding a Button to a Header Toolbar


    ```

    1: <div data-role="page">

    2:   <div data-role="header" data-position="inline">

    3:     <a href="#">Contacts</a>

    4:     <h1>I am a header toolbar</h1>

    5:   </div>

    6: </div>

    ```


    By adding an element on line 3, we set up a button that will be displayed on the
    left side of the header toolbar. Note that we did not have to apply a data-role
    to style the link as a button. The link will be styled as a button automatically
    when it is inside the header toolbar.


    The first link in the header toolbar always defaults to display on the left side
    of the header toolbar. This happens even if you include the link after the h1
    element. That means that if you swap lines 3 and 4, the button still appears on
    the left.


    Figure 8.2 shows what the toolbar looks like now that we have added a button to
    it.


    ![](img/56578b432709a7220ba1c18b41eabe62_152_0.png)


    FIGURE 8.2

    Link has been added to the left side of the header toolbar and automatically styled
    as a button.


    Now that you know that the first link that is added automatically goes on the
    left side of the header toolbar, where do you think a second button goes? Let''s
