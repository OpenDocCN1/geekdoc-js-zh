    While the initial release of the OS was met with 10 devices supporting, Microsoft
    made a partnership with Nokia in 2011 to help bolster hardware support. The agreement
    with Nokia also brought support for the Ovi store and Nokia maps to the OS. In
    these Windows Phone has integration with Bing services and has a a Marketplace
