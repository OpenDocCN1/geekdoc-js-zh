    Using a navbar in both the header and footer toolbars


    Now that we’ve seen some different options for placing content into the header
    and footer toolbars, there is one last thing we need to cover—the default behavior
    for how toolbars are displayed onscreen.


    # Positioning the Toolbars


    Toolbars are generally placed before and after the content section, as is standard
    in web development. Sometimes you may find yourself wanting the header and footer
    to stay visible all the time, there are two different ways of doing this. You
    can use either fixed or full screen positioning on the toolbar.


    # Using a Fixed Position


    When using a fixed position, jQuery Mobile checks the page to see whether the
    positioned toolbar is already in view. If the toolbar is out of the view, it will
    be inserted into the document at the top or bottom of the viewable area (depending
    on whether it is a header or footer toolbar). To make a toolbar the fixed position,
    you need to add data-position="fixed" to the toolbar. Listing 8.11 shows the code
    for a page that contains a header and footer toolbar using fixed positioning.'
