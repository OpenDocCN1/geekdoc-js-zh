  md: 'Q&A 109


    Mobile devices do not run the same mobile OS, and now you know that mobile devices
    are generally tied to a store where apps can be purchased or downloaded. Different
    mobile browsers are used to surf the Internet and view web applications and mobile
    websites, and you learned that you could develop for these mobile devices with
    an SDK and knowledge of the native programming language.


    Finally you learned that the jQuery Mobile team keeps a support matrix of devices
    with the expected level of style and functionality for those devices.


    # Q&A


    +   Q. What is the difference between a native application and a web application?

    A. A native application means that the code was written and compiled either using
    the same language as the OS or into a file that can be understood by the device
    at an OS level. Native applications give deeper control and access to the hardware
    components of the device and usually grant access to the local file system. Native
    applications generally must be coded for each mobile OS individually.


    Web applications on the other hand are built to be displayed in the browser or
    through a special viewer on the mobile device. Web applications are usually built
    to function like a native app but have the advantage of only being written once.
    There are a few frameworks such as PhoneGap, Sencha Touch, Appcelerator, and Rhodes
    that you can use to write a web application that you can tie into some of the
    functionality that native apps can use.


    +   Q. Why isn''t there a mobile standard for devices that everyone can follow
    so that developing is easier?


    +   A. Some companies have put together agreements to try to standardize some
    of the features of mobile devices. The problem, however, isn''t really the devices,
    it is the demand. If a manufacturer has customers demanding a device with a specific
    size, they will call to the customer needs. This is also what continues to drive
    mobile evolution and progress. It may be easier for developers to handle cookie-cutter
    devices, but without new features and changes in device development wouldn''t
    evolve much either.


    +   Q. How does jQuery Mobile help me deal with all these device differences?


    +   A. jQuery bridges the gap in many places for you. It helps you with a uniform
    layout that looks nearly the same on every mobile device that it views. It gives
    you the tools to make a responsive layout that has the ability to work with browsers
    on your standard computer as well as on your mobile device. It is geared toward
    speed and functionality, both of which are important to mobile users. Finally
    it helps you reduce the bandwidth spent on your mobile site and lets users get
    to your content faster than loading a full site.'
  merge: -1
