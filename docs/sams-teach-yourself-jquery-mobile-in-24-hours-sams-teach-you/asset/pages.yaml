    # # Buttons


    Buttons automatically use the swatch that is assigned to the parent container.
    If you place a button in a content block that uses swatch b, then the button will
    use swatch b.


    You can change this by using the `data-theme` attribute on the button directly
    to change what swatch inherits. The following one-line snippet shows the markup
    for changing a button theme using this method:


    ```

    <a href="#" data-role="button" data-theme="e"></a>

    ```


    Should be simple enough. Figure 13.5 shows two buttons on a page, one inheriting
    the swatch, and the other being set by the `data-theme` attribute.'
