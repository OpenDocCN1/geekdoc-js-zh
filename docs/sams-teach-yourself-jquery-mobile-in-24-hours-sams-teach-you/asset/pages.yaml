- img_proc: true
  md: 'Q. So I can''t use the $(document).ready or $ (function(){}) on my mobile pages?


    A. You can, but it''s not recommended. Remember that jQuery Mobile runs your site
    through AJAX, the only page that will execute $(document).ready() function will
    be the first page. If that is the behavior you are expecting, then go for it.
    Although you will be miles better off by planning ahead and using the pageinit
    event, especially if you plan on growing your application or site.


    Q. Will the screen orientation work on a desktop browser?


    A. Yes, it does actually work on the desktop. This is done through a calculation
    that runs during the resize event. When the screen is resized the current width
    and height are compared, and the event will trigger based on the window size.


    # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. During page page initialization, what three stages does a page go through?


    +   2. What is the time difference in processing between a touch and click event?


    +   3. How do you bind the pageinit event to a specific page?


    +   4. What virtual mouse events are available with jQuery Mobile?


    +   5. True or False: The swipe event will be triggered for screen swipes to both
    the left and the right.


    # Answers


    +   1. Before page creation, page creation, and page initialization.


    +   2. There is roughly a 300ms difference between a click event and a touch event.


    +   3. When you create your page container using data-role="page", you also need
    to make sure it has an id attribute set. The .live() function is then used on
    the id through a selector to bind the pageinit event to it.


    +   4. The virtual mouse events that are accessible are mouseover, mousedown,
    mousemove, mouseup, vclick, and mousecancel.


    +   5. True. You can use the swipeleft and swiper events when you want to tie
    specific functions to a swipe in a specific direction.'
