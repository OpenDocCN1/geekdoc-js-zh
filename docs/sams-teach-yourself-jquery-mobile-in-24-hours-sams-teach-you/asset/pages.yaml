    # The select Element


    The select element is a little different from the previous elements because it
    doesn''t extend the input element. It acts like a container for option elements.
    Each option element has a value and contains some text. The text for each option
    element appears when the select element is clicked or tapped. When the user is
    shown the list of option elements and selects one of them, the value within the
    selected option element becomes the value of the select element.


    With jQuery Mobile the select element is styled as a button with an arrow pointing
    down. It also takes up as much space as is available and can be used with a container
    that has an attribute of data-role="fieldcontain" to place the label and select
    elements on the same line (if there is enough room onscreen).'
