- img_proc: true
  md: 'Line 15 starts our content section. This area contains everything you want
    displayed that doesn''t belong in the header or the footer. This may include lists,
    forms, images, and more.


    Line 18 is the beginning of the footer section. We mentioned before that this
    section might not exist on all of your mobile sites or projects. You may want
    a nice footer with some links or legal text, or you may want to switch the entire
    section out for a group of buttons to make your mobile site feel more like an
    application.


    Figure 7.1 shows a screenshot of what the page looks like in a mobile browser.


    ![](img/56578b432709a7220ba1c18b41eabe62_132_0.png)


    FIGURE 7.1

    A single page layout showing the head, content, and footer sections


    While you may be fine creating a single page site with jQuery Mobile to host a
    mobile version of your contact information, there are times when you need to share
    more, show more, or just do more. This is when you should use multiple pages.


    # Using a Multiple Page Layout


    A multiple page layout is simply a collection of single page layouts. This can
    be achieved in a couple of different ways. You can create one HTML file and include
    multiple pages inside it, or you can create multiple HTML files that each contain
    a page and then link them together.'
