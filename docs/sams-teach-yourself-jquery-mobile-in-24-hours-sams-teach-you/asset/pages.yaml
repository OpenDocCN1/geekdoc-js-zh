    # # Summary


    This hour discussed the jQuery Mobile framework. You learned that it is dependent
    on the standard jQuery framework to function. You learned what files are included
    and required to use the jQuery Mobile framework, and also learned about HTML5
    data attribute and how jQuery leverages them to apply style and functionality
    to the page.


    The basic requirements needed for a mobile page were discussed as well as how
    to add extra HTML elements into the page to complete the look and feel of a mobile
    site.


    Finally you learned how to overwrite some of the default jQuery Mobile settings
    and that you can use the `pageinit` event to run a function when a page is called
    to get around the problems associated with the `$(document).ready` function only
    running on the first page load.'
