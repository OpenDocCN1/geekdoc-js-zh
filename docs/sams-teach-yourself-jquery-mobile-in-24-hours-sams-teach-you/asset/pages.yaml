    # Using Swipe Events


    Swiping at your mobile device is common when moving through image galleries, deleting
    email, bringing up contact information, and more. With jQuery Mobile you can tap
    into three swipe events: swipe, swipeleft, and swiperight. A swipe is similar
    to a click-and-drag action on a computer. The touch must travel more than 30px
    horizontally and take less than 1 second to complete. It also may not move more
    than 20px vertically or the event will be cancelled. Listing 12.5 shows the contents
    of the file swipe_events.html, which shows the use of the swipe, swipeleft, and
    the swiperight events.


