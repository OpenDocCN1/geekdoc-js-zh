  md: '# HOUR 18

    Embedding Video Playback for Mobile


    What You''ll Learn in This Hour:


    +   - How to use embedded video from YouTube

    - How to use embedded video from Vimeo

    - How to embed a self-hosted video

    - Resources available for video hosting


    Whether you are piecing together a group site or a trying to create a tutorial
    site, there will probably be a time when you will want to add some video content.
    Even if you do not have the resources to host your own video, there are other
    service providers that you can leverage to handle the video for you. Let''s learn
    about them and how we can embed video into our mobile site.


    # Understanding Video Playback


    Videos are a fantastic medium that can be leveraged to help express ideas, show
    tutorials, and present information in a controlled fashion. Displaying content
    through video is a good choice, as you already know exactly what the user is going
    to be looking at. Many sites have come into existence because of their ability
    to display and share video content. With more people getting mobile devices capable
    of video playback and sharing content socially, you should consider adding a little
    video content to your site.


    Playing back videos on mobile devices can be tricky. Although some devices can
    play back and even stream crystal-clear 1080p video, other devices can barely
    stream 480p video at 15 frames per second. Another concern is network bandwidth.
    Few things are worse than trying to start a video that is 45 seconds long, but
    buffers for more than 5 minutes. With these concerns in mind, there are several
    websites or services that specialize in hosting and sharing videos that you can
    leverage to overcome or at least alleviate some of these obstacles.


    Let''s start by taking a look at the ever-popular YouTube.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Embedding a Video with YouTube


    YouTube (http://www.youtube.com) is a fantastic site that allows users to create
    unique content and share it with friends, coworkers, and users. It also allows
    users to interact with each other, and as a content creator gives valuable insight
    into the analytics of users watching your content.


    Currently you create a YouTube account you can upload videos and edit them from
    within the site. Videos are uploaded to YouTube with a resolution usually somewhere
    between 240p (426x240) to 1080p (1920x1080). Users can, however, upload video
    up to 4k (4096x3072) in resolution. Videos vary in length, but all users are allowed
    15 minutes per video. Longer videos may be played, but must go through a verification
    process. Keep in mind, though, for most mobile sites, if you can''t get your message
    in 15 minutes or less, you may need to rethink the message you are trying to deliver.


