    The code starts as a standard page using jQuery Mobile, and on line 9 we use the
    pagecreate event to run the code on line 10. The code using a selector that finds
    any element on the page that has a class="modify" attribute and then adds an attribute
    of data-inset="true". After that has been done you can see that a function called
    listview() is running. This function is known as the listview plug-in and is used
    to apply the styles and markup for it. Line 11 then closes the .on() function,
    which is the binding to the pagecreate event.


    Looking down at line 20 we can see a u element that contains only an attribute
    of class="modify". The data-role="listview" attribute is not present, and neither
    is the data-inset="true". Figure 12.2 shows that with the missing attributes,
    the script that runs during the pagecreate event will apply the necessary styles
    to make the u element inset.


    It is important to note that the listview plug-in cannot be called during the
    pagebeforeevent. It must be called after you have applied any data attributes
    or classes that you want parsed. If you call a widget or plug-in before you call
    the .attr() function or similar functions, the widget or plug-in will not parse
    the additional data and it will be skipped.


    The next event during page initialization is pageinit.'
