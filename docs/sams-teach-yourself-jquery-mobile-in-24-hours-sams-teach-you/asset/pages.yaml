  md: '# HOUR 20

    Creating QR and Tag Codes


    What You''ll Learn in This Hour:


    +   * How QR and Tag codes are used

    * Programs that can be used to read them

    * How to create and customize QR and Tag codes

    * Ways that QR and Tag codes can be used


    Unless you''ve managed to avoid social websites, newspapers, flyers, billboards,
    and the advertising market in general, you have seen a QR and/or Tag code before.
    This hour you learn what they are and how you can use them.


    # Delving into QR and Tag Codes


    Barcodes are heavily used in inventory tracking. When you want to buy an item
    at a store, a barcode is usually scanned at the register, displays how much the
    product costs, and makes a mark in the store inventory that the item was sold.
    The entire transaction is facilitated by the few characters of information held
    in the barcode on the item. This same principle of data also works on Quick Response
    (QR) codes and Tag codes.


    Standard barcodes read along a single axis; this makes them known as 1D or one-dimensional
    codes. This single axis limits the amount of data available but makes the code
    easily read by a scanner. QR codes are read along the X and Y axis, making them
    2D or two-dimensional codes. This allows more data to be stored inside the same
    area as a barcode. Due to the complexity of the layout, scanning devices may not
    scan the code correctly if it is too small to be read. Microsoft Tag codes work
    in a similar but proprietary fashion. The Tag is read by a scanner and then referenced
    against an online database to deliver data back to the scanning application.


    QR and Tag codes are found today in a variety of places. You can find them on
    billboards, magazines, catalogs, TV and Internet ads, business cards, conference
    tickets, and in many more places. The use of QR codes is gaining traction as more
    users take advantage of the experience'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'that can be created by using them. Some businesses have even integrated the
    codes into an online shopping cart allowing users to scan and purchase an item
    directly from a catalog or ad.


    NOTE


    # QR Code


    The term QR Code is registered trademark of DENSO WAVE INCORPORATED (http://www.densowave.com/en/adcd).


    # Scanning QR Codes


    Most mobile devices do not come with a barcode scanner built in; however, as long
    as the device has access to an application store, you can download an app that
    allows you to scan codes. The following sections provide a list of applications
    and what platform they work on.


    # Scan


    Scan aims to be as simple as possible. There are no buttons to press, no extra
    frills, just a simple scanner that also keeps track of the codes that you''ve
    scanned. Many iOS users prefer Scan over the scanning speed. I did run into issues
    while using this on an Android device where the image was backwards, making it
    awkward to get the code up to be scanned—but it still worked as advertised. Scan
    is available for iOS and Android devices. You can learn more at http://scan.me/


    # RedLaser


    RedLaser is a scanning application created by eBay. It is a ridiculously detailed
    app in what it offers for features. It ties in with an online database for scanning
    results that makes it a fantastic tool for using on standard barcodes. If you
    want an all-in-one scanner that can be used for price checking as well as reading
    QR codes, this is one of the apps to look at. It is available for iOS, Android,
    and Windows Phone. You can learn more by visiting http://www.redlaser.com/


    # ShopSavvy


    This was the second scanner I ever installed, and it still remains one of my favorites.
    ShopSavvy works like RedLaser; for someone who only wants to scan QR codes and
    follow the links or read the messages, it is serious overkill. However, it is
    well-designed, keeps a history of previous scans, and worked on everything I attempted
    to scan with it. It is available for iOS, Android, and Windows Phone. You can
    learn more by visiting http://shopsavvy.com/'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# ScanLife


    ScanLife is another full-featured scanning app similar to RedLaser and ShopSavvy.
    ScanLife boasts support for a surprisingly large number of mobile devices. A unique
    feature included in the app is a live stream that lets you see what other people
    are scanning and allows you to tap on them and view information about the product
    that was scanned. ScanLife is available for iOS, Blackberry, Android, Windows
    Phone, and Nokia. To learn more, visit http://www.scanlife.com.


    # Barcode Scanner


    The same team behind the ZXing library also released an app to go with it. This
    is a simple, no-fills app that allows you to scan barcodes and view the data contained
    in them. It does not hook into a database and return shopping results, price matches,
    or social options. Of course, it doesn''t hit any third-party servers to collect
    your scanning information. Instead, it is a dead-simple scanner I use as my main
    tool for scanning QR codes. It is available for Android (by ZXing Team) and iOS
    (by Romain Pechyre). You can stay up to date on app releases by visiting http://code.google.com/p/zxing/wiki/GetTheReader.


    # Microsoft Tag


    The Microsoft Tag reader works with QR codes as well as Tag codes. It is an easy-to-use
    application that keeps a tidy history of the codes you scan. The history does
    not seem to keep track of text-only QR codes, but it does keep track of ones that
    direct you to view a web page. It is available for Windows Phone, Windows Mobile,
    iOS, Android, Blackberry, Symbian, and J2ME phones. Learn more by visiting http://tag.microsoft.com/download.aspx.


    Let''s take a deeper look at QR codes and how to create them.


    # Rendering Quick Response Codes


    QR codes are not only useful, they can be used in many different ways. QR codes
    currently serve to distribute contact information, appointments, SMS messages,
    text, websites, and more. Some QR codes require an Internet connection to be used
    while others contain purely text or information avoiding the need for a connection.
    To illustrate this, Figure 20.1 shows a QR code that contains only text, and Figure
    20.2 shows a QR code with a URL.'
  merge: -1
  pgno: 382
- img_proc: true
  md: '# HOUR 20: Creating QR and Tag Codes


    ![](img/56578b432709a7220ba1c18b41eabe62_383_0.png)


    FIGURE 20.1

    This QR code displays "QR Codes are pretty cool" when scanned.


    ![](img/56578b432709a7220ba1c18b41eabe62_383_1.png)


    FIGURE 20.2

    This QR code contains the URL http://www.jquerymobile24.com/qrexample/.


    QR codes do have some limitations you must be aware of. First of all, size matters—the
    bigger the code, the higher the compatibility of devices that can scan them. It
    is recommended that you use a code that measures 1.25"x 1.25". I have done a bit
    of experimenting and found that a 1"x1" code works; however, using a larger code
    allows the scanner to read the code faster and from a greater distance. The farther
    away your scanner is from the object, the larger your code needs to be.


    Another limitation to keep in mind is that these codes generally are meant for
    mobile devices. That means you should plan on handling them accordingly. If you
    are creating QR codes for your website, you would better have a mobile site or
    at least a responsive layout done to accommodate these devices.'
  merge: -1
  pgno: 383
- img_proc: true
  md: 'Lighting conditions also matter. This is just like trying to focus your camera
    in the dark, only worse. Most phones have a camera that will not allow the use
    of a manual focus when used with a scanning application. This means your camera
    may drive itself nuts trying to focus on a blurry code over and again due to poor
    lighting. Printing your code on a glossy surface may also affect the readability
    of your code. If you can print it on a matte sheet of paper, or in a location
    with minimal glare, your code will be easier to scan and process.


    While there are some subtle tweaks you can do with QR codes, you should use a
    solid background color that has a high contrast with the squares or dots of your
    code. You should never use a gradient as the background image.


    # QR code Do''s:


    +   - Make the code as large as possible for your campaign.

    - When printing codes, try to use a matte finish rather than glossy.

    - Make sure you are planning for mobile devices to be using your codes.

    - When possible, use good lighting where your code is displayed.


    # QR code Don''ts:


    +   - Use codes smaller than 1"x1".

    - Direct mobile users to a full desktop site.

    - Use noncontrasting colors or a gradient on the background.


    Now that we know a little about QR codes, let''s take a look at generating them.


    # Third-Party QR Generation


    Many websites are available that will generate your QR codes for you. Some of
    these websites are free to use in both commercial and personal settings, while
    others have license restrictions. Some sites also have free and paid plans that
    add extra options and analytics packages to your code. The following sections
    outline sites available for use and what features you can expect to find using
    them.


    # ZXing


    The ZXing (Zebra Crossing) project created by Google provides a scanning library
    that can be used in both Android and Java projects. They also feature a QR code
    generator that can be found at http://zxing.appspot.com/generator/. The generator
    is a straightforward application that allows you to pick the type of data you
    want to store in the QR code and generates the code for you as well as gives you
    a link that you can use to replicate the image using the Google Chart Tools.'
  merge: -1
  pgno: 384
- img_proc: true
  md: '# Kaywa


    Kaywa provides a QR code generator found at http://qrcode.kaywa.com/ that is free
    for noncommercial use. They also make a scanning app that is available in the
    Android Market. The generator allows the creation of URL, text, phone number,
    and SMS QR codes. The images may be sampled on the site and downloaded for use
    on your noncommercial site.


    # QRStuff


    QRStuff is a service that offers both free and commercial services that can be
    found at http://www.qrstuff.com/. This service allows many different types of
    data to be embedded into QR codes and uses its own algorithm to create QR codes
    rather than relying on third-party API services. QRStuff offers a commercial account
    that allows the use of a URL shortener that enables you to build QR codes that
    point to a short link which can be repointed at any time to make a pseudo-dynamic
    QR code. This service also allows analytic tracking so that you can get some data
    on the amount of scans your code have received.


    # Delivr


    Delivr is another service that offers both free and registered member services
    for QR code generation. You can visit http://delivr.com/qr-code-generator to get
    started creating your own QR codes. To differentiate itself from the competition,
    Delivr offers code generation for various app stores, social media links, affiliate
    links, and analytics campaign links. Signing up for the service gives you access
    to code analytics, short-link URLs, and statistics.


    # BeQRious


    BeQRious is another provider that offers a well-designed QR code generator which
    gives tracking and profile perks for registered members. BeQRious also offers
    design services that bring a unique and personalized appearance to your QR code.
    You can check out the generator by visiting http://beqious.com/qr-code-generator/


    # SPARQCode


    QRCode offers a full suite of services, including its own scanner, a generator,
    and an API that can easily be tapped to create QR codes. The SPARQCode experience
    is a good place to start for anyone who wants to eventually go commercial. The
    services include a free trial that allows for 250 tracked scans so that you can
    decide whether you want to jump in and go for a full package. Check out the QR
    generator and learn more by visiting http://www.sparqc.com/static/maestro.


    Now that you know where to get get codes, let''s take a look at how to create
    your own codes.'
  merge: -1
