  md: '# HOUR 4: Introduction to the jQuery Mobile Framework


    The two jQuery libraries are included as they contain all the logic that makes
    the frameworks work. The jQuery Mobile library extends on the base features of
    the jQuery library. Each of these libraries is available in a production version
    and a development version. The main difference between the two is that in the
    production version each file has been minified to remove excess whitespace and
    leaves out all comments. If you want to dive into what each framework tick, grab
    the development versions as they contain extra lines with legibility and comments
    to explain some sections of code.


    The jQuery Mobile CSS style sheet is included as it contains all the styles, themes,
    and swatches that are used with jQuery Mobile. These styles include various settings
    for backgrounds, colors, margin, padding, and sprites. jQuery Mobile does leverage
    CSS3 styles as this allows a smaller file size, and most modern mobile browsers
    have fairly good support for them.


    When the files listed previously are included together in your HTML file, you
    are ready to get started using jQuery Mobile.


