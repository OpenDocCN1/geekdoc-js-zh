  md: '# # HOUR 11

    # Learning About Lists


    What You''ll Learn in This Hour:


    +   - How unordered lists work with jQuery Mobile

    - How to number items in a list

    - How to add icons and thumbnails to list items

    - How to search through list items

    - How to use a form with a list


    List elements are used often in web development. Their versatility helps developers
    display content, navigation, and links with minimal effort. jQuery Mobile uses
    both ordered and unordered lists to display content and links in a mobile friendly
    way, while continuing the original ease of use.


    # Creating Standard and Inset Lists


    While you may already be familiar with standard list behavior in HTML, jQuery
    Mobile brings some new options to list behavior and display. Whether you want
    to create a list that takes up the entire screen or create a list that jumps off
    the page, you can do it with jQuery Mobile.


    Standard lists behave similar to buttons; they take up the full amount of space
    available to them. Inset lists still take up the full amount of space, but add
    rounded corners and a shadow to make the list appear to jump off the page.


    # Creating a Standard List


    Using HTML, you can make a standard list by creating a ul element and li elements
    inside it. To make a standard list in jQuery Mobile follow the same setup only
    you need to add an attribute of data-role="listview" to the ul element. Listing
    11.1 shows the creation of a standard list.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# LISTING 11.1 Creating a Standard List


    ```

    1: <ul data-role="listview">

    2: <li data-role="list-divider">List Items</li>

    3: <li>-I am an item!</li>

    4: <li>-I am another list item!</li>

    5: <li data-role="list-divider">List Items with Links</li>

    6: <li><a href="#">I am a link in a list item!</a></li>

    7: <li><a href="#">I am another link in a list item!</a></li>

    8: </ul>

    ```


    On line 1 a standard list is created with the ul element and styled by jQuery
    Mobile because of the data-role="listview" attribute, the standard list styles
    will be used instead of the jQuery Mobile styles. This can be very useful if you
    want to use a standard list without the styles that jQuery Mobile adds.


    Lines 2 and 5 are both li elements, but they contain an extra attribute of data-role="list-divider".
    When used, this attribute changes the display styles of the li element to create
    grouped content. The text within the element is displayed like a title to help
    users understand the grouping.


    Lines 3 and 4 show li elements that have been created. These two elements will
    be styled with a darker gray background and will not be clickable. Lines 6 and
    7, however, will be styled with a lighter gray background and will be given an
    icon on the right to indicate that they are clickable. When links within a standard
    list are clicked, jQuery Mobile makes an AJAX request to the target and injects
    the results into the DOM and then triggers a page transition to bring it into
    view.


    Figure 11.1 shows the standard list we made rendered in a mobile browser. Like
    buttons and toolbars, the styling may be a little different based on the mobile
    browser you are using.


    Now that we have a standard list created, let''s take a look at creating an inset
    list.


    # Creating an Inset List


    To create an inset list, you start by creating a standard list and then add an
    attribute of data-inset="true" to the ul element. This means we could use the
    code from Listing 11.1 and only change the first line to make our inset list:


    ```

    <ul data-role="listview" data-inset="true">

    ```


    Figure 11.2 shows what our one-line change has done to our list.


    Now that we know how jQuery Mobile styles standard lists and how to create inset
    lists, let''s learn about the extras we can do with lists.'
