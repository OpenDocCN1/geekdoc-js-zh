    # Using PACKER


    While minifying code has lately been the champion of choice for JavaScript compression,
    times you need a different form of compression. This is where the Dean Edwards
    PACKER comes well into play. We know that minifying code removes white space,
    clears out comments, and does some light spricing up to your code. When you use
    PACKER your code is obfuscated and packed into a nice little selfish piece of
    JavaScript.


    JavaScript files that contain .pack.js in the name usually indicate that the file
