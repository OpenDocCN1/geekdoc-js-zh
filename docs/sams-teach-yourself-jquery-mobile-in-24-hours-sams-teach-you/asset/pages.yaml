  md: '# HOUR 10

    Formulating Your Forms


    What You''ll Learn in This Hour:


    +   * The basic elements of a form element

    * What jQuery Mobile does with form elements

    * How to use the slider, flip toggle switch, and search input

    * How to submit forms using jQuery Mobile


    Depending on the site you are building, you may need to use a form. Forms are
    a terrific way to get information from a user. This information may then be used
    with backend processing logic to determine what to do with the data. This hour
    you learn about form elements and how they work with jQuery Mobile.


    # Getting Started with Forms


    Don''t sweat it if you have never used a form before. I''ve met plenty of developers
    that have never actually used a form, and even some that have built a form, but
    just sent it off to who-nows without understanding exactly what they just did.


    Personally, I like to think of forms as Mad Libs, those humorous word games we
    all loved as kids. A Mad Lib generally is a short story template printed on a
    piece of paper that has blank fields asking for different things, such as a part
    of the body or a part of speech. When you are finished filling it out, you give
    it to your friend to read and process. This is just about the same way the form
    works. The form is the paper, and various elements such as input, select, and
    label make up the fields that either contain data or tell you what to write in
    them. When you are finished filling out the form you then submit it for processing.'
  merge: -1
