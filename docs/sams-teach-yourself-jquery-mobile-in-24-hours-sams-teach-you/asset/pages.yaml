    # Attaching a Navigation Toolbar


    A navigation toolbar, or navbar, is a widget built into jQuery Mobile that allows
    you to add navigation links to your page. Similar to the built-in grid system,
    the navbar is capable of containing five columns. To add a navbar to your page,
    you must use a container element with an unordered list with attribute of data-role="navbar".
    Inside the container you must have an unordered list with each column inside an
