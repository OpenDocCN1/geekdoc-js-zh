  md: '# Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. True or False: The GPLv3 is currently compatible with the MIT license.

    2. What license is not recommended for use with software?

    3. What can be used to extend the functionality, accessibility, or appearance
    of a site?

    4. What are web safe fonts?

    5. True or False: You can take and use any image you want from public sources
    like flickr.com.


    # Answers


    +   1. GPLv3 is fully compatible

    2. The Creative Commons is not recommended for use with software. Instead developers
    should consider using a GPL, MIT, or BSD license.

    3. Plug-ins, custom fonts, and icons can be used to extend the functionality,
    accessibility, and appearance of a site.

    4. Fonts that are commonly installed on most computer systems and mobile devices
    are referred to as web safe fonts.

    5. False. You may not use any image you find on flickr, or any other image-searching
    website. Just because an image is view on the Internet does not mean you have
    the right to use the image. Always check for a license on the work. If a license
    cannot be found, contact the artist directly, or the entity hosting the image
    file.


    # Exercises


    +   1. Spend some time searching for an icon set that you think would look good
    in your application. Try to find a free set that you can download and experiment
    with. If the icon comes with multiple resolutions, experiment using a higher resolution
    version for retina displays.

    2. Do some research on jQuery Mobile plug-ins and see whether already are available
    that fit with a project you have in mind. If you do not have one in mind, grab
    an image slider or gallery plug-in and some stock images and combine them into
    an image gallery or slider.'
