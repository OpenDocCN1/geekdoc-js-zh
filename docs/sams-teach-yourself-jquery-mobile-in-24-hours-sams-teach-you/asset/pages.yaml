  md: '# Understanding the Mobile Initialization Event


    You already learned that one of the problems with using standard JavaScript happens
    including scripts and attaching events or when trying to manipulate data that
    may not exist at the time the function is called. The jQuery framework uses the
    $(document).ready() function to circumvent manipulation and loading problems by
    giving access to your functions as soon as possible. While this is fantastic for
    single page sites, it becomes a small problem for the jQuery framework.


    jQuery uses AJAX to load the contents of each page rather than reload the entire
    DOM structure. $(document).ready() function only runs once per page, not per AJAX
    call. In jQuery Mobile, the $(document).ready() function doesn''t run once per
    page, but rather once per site unless requested or performed by the user. This
    means that some of the default settings that need to be set by jQuery Mobile cannot
    be in the $(document).ready() function because they would not be applied to pages
    through AJAX.


    The answer to setting and changing these defaults is to use the mobileinit event
    because it runs before the $(document).ready() function ever does. To use the
    mobileinit event you must first include the jQuery framework and then inline or
    include an external JavaScript file that contains an event binding for the mobileinit
    event and finally for jQuery Mobile. May that sound a little confusing, so let''s
    look at Listing 4.5 for an example of this process.


    # LISTING 4.5 Including jQuery, an inline mobileScript, and jQuery Mobile


    ```

    1: <script src="http://code.jquery.com/jquery-1.7.1.min.js"></script>

    2: <script type="text/javascript">

    3: $(document).on("mobileinit", function() {

    4:   $.extend($mobile, {

    5:     pageLoadErrorMessage: ''Either the page cannot be found or it cannot be
    loaded.'',

    6:   });

    7: });

    8: </script>

    9: <script

    src="http://code.jquery.com/mobile/1.1.0/jquery-mobile-1.1.0.min.js"></script>

    ```


    Line 1 starts out with the include for the jQuery framework. Line 2 is the beginning
    of our inline JavaScript event. Line 3 is where we set up the mobileinit event
    by using the .on() function (which is part of the version 1.7 of the jQuery framework
    and why we need to include the jQuery framework before our inline script). If
    we had been using a version of jQuery Mobile prior to 1.1 we would be using the
    .bind() function instead of the .on() function. The .on() function can take a
    few arguments, but in our case we pass two. The first argument is the event you
    want to bind, and the second is usually an'
