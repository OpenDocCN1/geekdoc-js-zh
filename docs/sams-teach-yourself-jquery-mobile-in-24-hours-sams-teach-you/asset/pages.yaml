  md: '# Submitting Forms


    Form submission is a little different when using jQuery Mobile. On most websites
    when a form is submitted, the user is redirected to a page based on whatever backend
    code has and determined what to do with the user. While that is still possible,
    the default way forms are handled with jQuery Mobile is to handle all submissions
    through AJAX. Also, the default method for sending form data is through the use
    of GET.


    # Submitting Forms with AJAX


    As I mentioned before, all form submissions are handled with AJAX by default.
    This means that the results of the form are injected into the DOM and a page transition
    is triggered to move the current view of the page to it. This is the same way
    new pages are loaded by default with jQuery Mobile.


    While you can use any backend processing language you are familiar with handling
    forms, we are going to use some PHP mixed with jQuery Mobile to demonstrate how
    form submission works. Listing 10.9 shows a PHP file that contains some rudimentary
    logic to display data from a form submit.


    # LISTING 10.9 The Contents of login.php


    ```

    1: <!DOCTYPE html>

    2: <html>

    3: <head>

    4: <title>Forms with jQM</title>

    5: <meta name="viewport" content="width=device-width, initial-scale=1">

    6: <link rel="stylesheet" href="http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css"
    />

    7: <script src="http://code.jquery.com/jquery-1.7.1.min.js"></script>

    8: <script src="http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js"></script>

    9: </head>

    10: <body>

    11: <div data-role="page">

    12: <div data-role="header"><h1>login.php</h1></div>

    13: <div data-role="content">

    14: <p>You tried to login as "<strong><?php echo \$_POST[''username'']; ?></strong>"?</p>

    15: <p>You used "<strong><?php echo \$_POST[''password'']; ?></strong>" as your
    password?</p>

    </div>

    16: <p>The input element with type="hidden" contained "<strong><?php echo \$_POST[''hiddenInput''];
    ?></strong>"</p>

    17: <a href="jqm_simple_form.html" data-rel="button">Go Back</a>

    ```'
  merge: -1
  pgno: 203
- img_proc: true
  md: '```

    18: <div>

    19: </div>

    20: <body>

    21: </html>

    ```


    While that does appear to be an awful lot of HTML to output what was passed through
    as the ''username'' on our form. Line 15 shows more use of PHP as we get what
    was passed out of the ''password'' field on our form. The last bit of PHP appears
    on line 16 of our form where we display what was passed through the form in a
    hidden input element.


    In Listing 10.2 we referenced the jqm_simple_form.html that used login.php as
    the action for the form. Since we just created the login.php file, you can now
    place both of these files in the same folder on a web server and run them together
    to see the form working for yourself.


    As for the page AJAX, if you open Web Inspector, Firebug, or a similar debugging
    program, you can actually watch the DOM being manipulated as the form is submitted
    and the contents of login.php are injected into the DOM. Because of the page is
    never reloaded, and the user never actually leaves the page they are.


    # NOTE


    # Duplicate Form with AJAX


    If you are using multiple forms on your mobile site make sure that you use a unique
    id on every one of them. Because pages and forms are injected into the DOM, they
    are moved into memory and stay there. Having a unique id on every form will save
    you hours of headache as you try to fix seemingly phantom problems.


    # Submitting a Form Without AJAX


    Occasionally you may need to submit a form that reloads the entire page instead
    of making an AJAX request and inserting it into the DOM. When this is the case
    you only need to add the attribute data-ajax="false" to the form element. This
    forces jQuery Mobile to load the result as a new page. The following is a one-line
    snippet that shows the modification required to your opening form element.


    ```

    <form id="login" name="login" action="login.php" method="POST" data-ajax="false">

    ```


    If you take the previous snippet and replace line 14 of jqm_simple_form.html with
    it, you will find that even though the form appears to handle the same, a page
    load is actually happening instead of a DOM injection. You can verify this by
    using Web Inspector, Firebug, or similar tools.'
