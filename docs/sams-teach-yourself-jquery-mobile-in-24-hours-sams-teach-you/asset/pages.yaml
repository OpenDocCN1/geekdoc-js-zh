- img_proc: true
  md: '# Quiz


    +   1. What platforms do PhoneGap work on?

    2. True or False: PhoneGap is a standalone application.

    3. What Android permissions must be included when using PhoneGap?

    4. What file controls the application settings in your Android project?

    5. What is required to test your application from Eclipse?


    # Answers


    +   1. PhoneGap works with iOS, Android, Windows Phone, BlackBerry, webOS, Symbian,
    and bada.

    2. False. PhoneGap is a framework that allows web applications to interface with
    mobile hardware allowing web developers to create applications with native capabilities.

    3. At a minimum you must include android.permission.INTERNET and android.permission.READ_PHONE_STATE.

    4. The AndroidManifest.xml file controls everything from the devices that are
    compatible with your application to the permissions your application needs to
    run.

    5. Either an Android device in USB Debugging mode or an AVD created at a compatible
    API level must be created to run and test your application.


    # Exercises


    +   1. Modify the project to be compatible with a different range of devices.
    The default included in the example project is API 10. Try lowering it and see
    how it handles on your AVD or an actual device.

    2. Check out the documentation at PhoneGap (http://docs.phonegap.com/) and add
    sound playback or even a vibration control when a reset button is pushed or when
    a calculation is run.

    3. Create a new project in Eclipse; try porting one of your web applications onto
    the Android platform.'
