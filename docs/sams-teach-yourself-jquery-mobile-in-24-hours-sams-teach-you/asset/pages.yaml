  md: '# HOUR 2: Working with HTML, CSS, and JavaScript


    You then learned the role of JavaScript in web development and how to include
    JavaScript by using external files or placing code inside <script> tags inside
    the head or body elements of your HTML file.


    # Q&A


    +   Q. Does the single-line hierarchy style of formatting ever pose any rendering
    problems?

    A. Yes, using a single-line hierarchy style of formatting can occasionally be
    a problem with some browsers. When you are setting the property and value in your
    CSS, if you forget to add a space before the value may be skipped causing your
    styles to break. This is another reason why many developers prefer to use the
    paragraph style and then minify the code before using it on production.

    Q. Can I still use tables though developers are CSS now for styling?

    A. Of course you. Just remember that tables should be used for displaying tabular
    data. You really should avoid using a table as a layout device and use it only
    for displaying lists and forms.

    Q. If the HTML 4 spec deprecates some HTML tags, why would I want to use the Transitional
    DOctype?

    A. If you ever get the chance to work on a project where the code is inherited
    you may find yourself replacing portions of it at a time. When this is the case,
    using the Transitional DOctype allows you to improve the site while maintaining
    the previous version.


    # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. Can the use of deprecated HTML tags can still be used in the HTML strict
    DOctype?

    2. Why is inline styling discouraged?

    3. Is JavaScript currently used for mouse trails and animated eyes or is it used
    for other things?'
