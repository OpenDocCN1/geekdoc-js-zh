    # Conquering Collapsible Content


    Collapsible content can be hidden or shown with a click or a touch. You probably
    have already seen this type of behavior on websites before. You may have seen
    it in the Frequently Asked Questions sections on multiple sites. Usually on those
    sites it is a question or an answer to the title viewable and a little “−” or
    “” next to it to show that it can be opened or closed. The same functionality
    is built into jQuery Mobile.


    To create collapsible content, you just need to add data-role="collapsible" to
    the element you want to make collapsible. Listing 7.7 gives an example of using
    collapsible content on a page. You can view this example by loading collapsible.html
    in your browser.


