    # # Summary


    In this hour you just learned about single and multiple page layouts. You learned
    that you are able to create a multiple page layout within the same file, or by
    using links to external files.


    Aligning content with a grid, and what grid options are available within the jQuery
    Mobile framework were also discussed.


    Finally, you then learned about collapsible content and that it can be used to
    make accordions and can also contain nested collapsible content.


    # # Q&A


    +   Q. When using the grid system, are there any dangers with low resolution?

    A. I wouldn''t call it a danger, but there are some difficulties you may run into.
    For example, if you have a three-column grid and you have buttons with more than
    one word on them, there is a good chance that your text will not be seen on low-resolution
    devices. A user may see only the first letter or two of your link text.'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'Q. How would using collapsible content be beneficial for a blog?


    A. While you may run into blogs with short intro sections, on a mobile device
    you still have to scroll through all that text. By using a collapsible content
    section for your post or intro section, you can still show the title of a blog
    post and allow the visitor to decide whether it is worth expanding the section
    and reading through.


    Q. What do I do if I want to use more than five columns in my grid?


    A. The short answer is to re-evaluate what you are trying to accomplish. The long
    answer is that you need to remember that you are using a mobile framework. When
    screen widths are as small as 240px, you are left with columns that are only 48px
    wide. That is wide enough to get between two and four characters per column, smaller
    and the column would be completely illegible. Note that when using the grid system
    with jQuery Mobile, your columns will be equal width. If you really want use more
    than five columns or even two columns with one at 75% width and the other at 25%
    width, I would suggest adding some custom CSS to your page and not using the built-in
    grid system.


    # # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # # Quiz


    +   1. What type of site is it a good idea to use a single page layout contained
    in a single file?

    2. How does using a grid system help with displaying content?

    3. True or False: It is impossible to nest collapsible content.

    4. How do you add a title and use a "+" or "-" to a collapsible section?

    5. True or False: You can also create multiple rows when using a grid for columns


    # # Answers


    +   1. A profile or contact site is a great candidate for a single page.

    2. Using a grid brings visual balance to your site; however, when combined with
    navigation or buttons with a grid system excels. Most native mobile applications
    use a grid when aligning buttons or icons.

    3. False. You can nest collapsible content by simply creating a collapsible container
    within another one.'
