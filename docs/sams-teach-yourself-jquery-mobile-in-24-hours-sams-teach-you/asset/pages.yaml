  md: '324 HOUR 17: Detecting Mobile Devices


    # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. What can a .htaccess file be used for?

    2. What is a User Agent?

    3. Why does using a test for JavaScript support make for an inconsistent detection
    method?

    4. What gives you the best idea of what visitors view your site and on what devices?

    5. What makes using jQuery Mobile so ideal for even legacy devices?


    # Answers


    +   1. A .htaccess file can be used to control file access, read and write cookies,
    create redirects, and other things that would normally only be configured in server
    configuration files.

    2. The User Agent is a string passed in the HTTP header request of a browser.
    This contains information about the browser and device that is doing the requesting.

    3. While WAP devices will fail the JavaScript check and be directed to the proper
    page, most smartphones will pass the test and not be redirected.

    4. An analytics package gives you a look at how a user found your site, what they
    came looking at, and how long they stayed. This is valuable information that can
    be used to help you optimize the mobile experience you are trying to convey.

    5. Fallback support. Even when a user browsers your site on a device that doesn''t
    provide all the bells and whistles that a newer device gets, they are still able
    to use the site and to browse it fully.


    # Exercises


    +   1. Create your own .htaccess file and regex and experiment with using it.
    Try to redirect the mobile device to another page or site.

    2. Using a server-side method or JavaScript, create a couple of entries using
    a regex file that will direct different types of devices to different pages. For
    example, redirecting tablet-let users to one page and small-screen devices to
    a different page.

    3. Create a page that uses JavaScript to display the UA of the device viewing
    the page. If you want to get a little extra fancy, add a second section that uses
    some PHP to output the same information. Test with your JavaScript processing
    turned on and off and compare the results between the two methods.'
