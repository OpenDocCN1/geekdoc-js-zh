  md: '+   Loading scripts just before the closing body tag makes your site appear
    to load quickly may have an unintended consequence of missing site functionality
    for up to the first few seconds.


    # Loading Scripts


    You can include JavaScript using a reference to an external .js file or include
    your code inside a script element. These references should be included in either
    the head element or inside the body element.


    Script tags that reference an external file can be included like so:


    ```

    <script src="http://code.jquery/jquery-1.6.4.min.js"></script>

    ```


    Note that you can include more than one JavaScript file this way, and they can
    be included from both local and remote locations.


    If you have JavaScript code that you want to include directly on the page, you
    may include it inside script tags.


    # Setting the Type


    If you looked at the source code of various websites you have probably noticed
    that some are missing the declaration "type=text/javascript" in the script tag.
    You can choose to include it (as per the HTML 4 spec) or omit it as all modern
    browsers already know that anything inside a script element will be JavaScript.


    Listing 2.7 shows an HTML page that contains a sample function that looks for
