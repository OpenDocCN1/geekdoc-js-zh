  md: '# NOTE


    # The Author''s Websites


    Anything web related moves fast. Sometimes there are small gaps of time between
    versions in a framework or browser, but when a community is driving new functionality
    and more and more devices are released into the market, things are quickly changed.
    The author of this book, Phil Dutson, maintains two websites that can be useful
    as you learn about jQuery Mobile and web development. The first is http://www.jsymobilein24.com/
    where you can find blog entries and updates to the world of jQuery Mobile. The
    second is the eCom DevBlog, which can be found by visiting http://dev.tonic1394.com.


    Each site hosts a blog with a searchable index to help you find what you are looking
