    3:   <li><a href="#">Bugs<span class="ui-li-count">5</span></a></li>

    4:   <li><a href="#">Comments<span class="ui-li-count">12</span></a></li>

    5:   <li><a href="#">Suggestions<span class="ui-li-count">8</span></a></li>

    6:   <li><a href="#">Tickets<span class="ui-li-count">27</span></a></li>

    7: </ul>

    ```


    Since we''ve already covered the basic setup of a standard list you should know
