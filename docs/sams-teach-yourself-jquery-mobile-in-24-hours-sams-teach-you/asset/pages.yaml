    The built-in icons are an appreciated feature of jQuery Mobile, but when you have
    a particular style or brand, these built-in icons might not work. Let''s take
    a look at customization.


    # Using Custom Icons


    The custom icons that you need to be 18×18 pixels. The icon itself needs to be
    white, and the file should be saved as a PNG with alpha transparency. If you want
    may also use a high-resolution icon for use on Retina and similar displays. The
    high-resolution icon should be 36×36 instead of 18×18 and also needs to be saved
    as a PNG with alpha transparency.'
