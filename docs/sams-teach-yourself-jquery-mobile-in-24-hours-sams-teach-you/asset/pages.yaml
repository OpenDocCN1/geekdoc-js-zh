    # Using a Full Screen Position


    The full screen position is closely related to the fixed position. The main difference
    is that the toolbars are placed above the page rather than be a part of it. This
    can create some navigation problems as links that would normally be available
    farther down or farther up the page from the toolbars are now sitting underneath
    them.


    Full screen positions are good to use when you are displaying an image gallery
    or for showing videos. In these instances the controls can be put in the navbar,
    letting the user open and close the controls when they need them.'
