  md: '# HOUR 5

    Building Your First Mobile Site


    What You''ll Learn In This Hour:


    +   - The basic structure of a page

    - How to add a header and a footer bar to your page

    - How to add some simple formatting to your layout

    - How to attach an image and make it scale

    - How to use a button to link to another page


    You''ve been introduced to most of the basic building blocks that make up jQuery
    Mobile. In this hour we put them together to make a rudimentary but usable website.

    We start with the basics of site structure and move on to adding content. When
    we are finished you''ll have a small two-page site that features an auto-scaling
    image and a link to a second page. The link is triggered by a button and gives
    you a look at page transitions.


    # Structuring the Page


    The structure of your site is important, for both the ease of maintaining your
    site and for the user experience. The layout you choose is going to determine
    the entire user experience. Your layout should let users know where they are and
    what they want to continue scroll down or click on a button and dive deeper into
    your site. While many pieces and elements make up a mobile site, we are going
    to focus on three major areas as shown in Figure 5.1.


    Not every site follows this exact formula, but most use a similar layout. Let''s
    take a look at the three sections a little more in depth.


    # The Header


    This section is the first thing a user sees, and may be the most prominent feature
    of your mobile site. This informs users where they are, and may include a search
    bar, a call-to-action button, and/or a logo.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '![](img/56578b432709a7220ba1c18b41eabe62_97_0.png)


    FIGURE 5.1

    This shows a basic wireframe of the site with a header, content, and footer section.


    # The Content Area


    Content areas are exactly what they sound like: buttons, text, call-outs, and
    everything else that is not already included in the other sections. The content
    area houses the core of your site and displays everything you want the user to
    see, absorb, or spend time on.


    # The Footer


    The footer is an often overlooked but important area of your site. It can contain
    everything from extra links to a simple credit line for ownership of the site.
    In mobile development the footer is often omitted and replaced with a navigation
    bar or other static element.


    Now that we have that covered, let''s start on your first mobile site. Listing
    5.1 shows the beginning of a mobile site.'
