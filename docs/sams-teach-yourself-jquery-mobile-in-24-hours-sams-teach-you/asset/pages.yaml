    We''ve seen the portfolio site change based on whether you are using a small-screen
    mobile device, a tablet, or a desktop. There is one last thing that you may need
    to plan for in case you have not already thought about it: how to handle site
    orientation.


    # # Rotating Site Layout


    In the example portfolio site we used a responsive design and then used media
    queries with a min-width setting to allow the change in site layout. This worked
    well for small-screen mobile, tablet, and desktop devices. Something we did not
    look into was handling orientation. While we are fully able to design sites using
    min-width and similar media queries, you can also use the orientation media query
    to change the styles on your site.


    By including orientation: portrait or orientation: landscape you can create new
    sets of styles that are applied only when the device reports back the requested
    orientation.'
