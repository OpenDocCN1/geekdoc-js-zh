  md: '# HOUR 13


    # Changing the Default Theme


    What You''ll Learn in This Hour:


    +   - How the theme framework is used

    - How to load your own theme

    - How to apply different swatches to elements

    - How to customize and create swatches


    While the default styles of jQuery Mobile already look fantastic, you may want
    to change them to match your brand. The theme system in jQuery Mobile is modular
    and flexible enough to allow you to present your site with the unique colors and
    styles that give users your branded experience instead of a generic one size fits
    all.


    # Learning About the Theme Framework


    As you have noticed when using jQuery Mobile, a set of styles is applied to elements
    by default. The styles applied are part of the theme framework. The theme framework
    uses a combination of CSS2 and CSS3 styles to apply all the formatting as well
    as rounded corners, shadows, and gradients for backgrounds without loading extra
    images. This helps save file size allowing the client to add most of the special
    effects instead of forcing the browser to download multiple static images.


    The theme framework is a powerful part of the jQuery Mobile system and allows
    you to easily create multiple color schemes and even new icon sets with minimal
    effort. Let''s take a look at how you can leverage the theme framework.


    # Using Icons and Classes


    Even though CSS3 is in use and helps reduce file size, some static assets are
    still used. They have been put together into a minimum amount of files that are
    downloaded only when needed. Currently the default theme uses five static image
    files:'
