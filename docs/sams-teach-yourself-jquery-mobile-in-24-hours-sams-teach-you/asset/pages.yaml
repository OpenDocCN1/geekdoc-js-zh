- img_proc: true
  md: '# Summary


    In this hour you learned that there are many third-party vendors and tools that
    allow you to create QR codes and embed various data in them. You also learned
    how to create your own QR codes by leveraging Google Chart Tools as well as how
    to modify them for a unique experience. This is possible by using a parameterized
    URL that returns an image. You also learned how a bookmark could be used to access
    the service. Some QR scanners were also covered that you have an idea of the popular
    scanners today and what devices they are compatible.


    You also learned about Microsoft Tag codes and how they are different from QR
    codes. Tag codes are similar to QR codes; however, they are managed by using a
    Windows Live ID account. Tag codes also use a code that can either color or black-and-white
    with either triangles or dots. You also learned how to generate a Tag and about
    the types of data that can be contained in them.


    # Q&A


    +   Q. If I generate a Microsoft Tag, will the service be around in the next five
    years?

    A Microsoft has stated that they will keep the codes working until at least 2015,
    and they will give a two-year notice to all users with a free account that the
    service is either being terminated or moving to a pay model.

    Q. I''ve generated a QR code that was .75"x.75" and it worked fine on my phone.
    Do I really need to generate them at a 1.25"x1.25" size?

    A That depends. Are you sure that everyone who is going to scan your code has
    the same phone as you? Can you guarantee even if they have the same phone they
    will be scanning your code under the same lighting conditions and medium? If you
    can, then by all means, create a .75"x.75" code; otherwise, you may want to use
    a larger code to increase your compatibility.

    Q. You listed a few QR scanners but not any Tag scanners. Are any Tag readers
    available or just the one from Microsoft?

    A Currently the Tag scanner from Microsoft is the only Tag scanner available that
    can read Tags. It was listed under the QR scanner section because it also works
    with QR codes. If you are working with both codes, it''s not a bad app to have
    installed.'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. When the highest level of error correction or redundancy is in effect on
    a QR code, what is the maximum percentage of the code that can be wrong and still
    work?

    2. What does QR stand for?

    3. What is the recommended display size for a QR code and why?

    4. True or False: Custom images cannot be used inside QR codes.

    5. How do custom images work inside Tag codes?


    # Answers


    +   1. Depending on the level of error correction in the QR code, up to 30% of
    the code can be missing, lost, either or destroyed and the QR code will still
    work.

    2. QR stands for Quick Response.

    3. 1.25"x1.25" is the recommended size. At this size more than 90% of devices
    capable of scanning a QR code should work.

    4. False. You can use custom images as long as they stay out of certain areas
    within the QR code, and as long as they do not exceed the 30% error correction
    limit of the code.

    5. Custom images must be used with a custom Tag. The image is embedded behind
    the code itself. In a Tag image, the custom image can cover the dots used in the
    image, but not the white lines at the top and bottom or the sidebars.


    # Exercises


    +   1. Use a few of the mentioned services to generate your own QR codes. Try
    using the booklet, or create your own. After you have generated some codes, open
    one in an image manipulation program and experiment with changing the color of
    the QR code. Try removing a few sections of the code to test the readability of
    the code with errors present.

    2. Download and try out a few of the scanning apps. Check your device to see whether
    any of the programs function better than others. If you have access to multiple
    devices, give them a try as well.

    3. Either with an existing or new Windows Live ID account, create a Tag code.
    After you have created your first code, go back and create a custom Tag and use
    a custom image with it.'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# HOUR 21

    Learning to Minify Everything


    What You''ll Learn in This Hour:


    +   - The importance of minifying your files

    - How to minify JavaScript and CSS files

    - How to compress images

    - Enabling server compression


    When creating a website you may not put much thought into the little details like
    overall file size, URL requests, or the amount of JavaScript, CSS, and images
    used, but these details can really make or break your site. This hour we learn
    how to compress or minify as many of the assets of your site as possible to create
    a lighter and fast-loading site.


    # Compressing Code


    You may have noticed that jQuery Mobile comes with two versions of each JavaScript
    and CSS file it provides. The first file is usually named something close to jquery.mobile-1.0.1.js,
    while the second is named jquery.mobile-1.0.1.min.js. You may notice the difference
    in the file names right off, but the second contains the word min. Whenever min
    is present, it means that the file has been minified. A file that has been minified
    will have all the trailing spaces removed, including hard returns, tabs, and spaces
    so that they are shorter as all comments removed from the file. This may not seem
    like it would save too much room, but in the case of the previously mentioned
    jQuery Mobile files, the savings are 138KB, or just about 62%. With that in mind,
    why wouldn''t you want to compress all your JavaScript and CSS files? Let''s learn
    about how we can get started minifying files.


    # Using the YUI Compressor


    Although a few JavaScript compressors were available, the team of web specialists
    from Yahoo! that are the developers of the Yahoo! User Interface (YUI) library
    found problems that they didn''t like, and so they created their own compressor.
    They then took things a step further and'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'added the ability to minify CSS files as well. YUI Compressor requires Java
    (at least version 1.4) to be installed on your system.


    To use the YUI Compressor you first need to download it from http://ylibrary.com/download/yuicompressor/;
    The YUI Compressor is open-source, so when you unzip the file do not be surprised
    by all the fold builders. If you do not want to make any modifications you can
    find the ready-to-use .jar file in the build directory. You can run the .jar file
    from that location, or you can move it somewhere else. I recommend copying the
    .jar file to another folder in an easy to remember location. I usually put it
    in a folder named "compression". Once you have the .jar file where you want, if
    you are comfortable with the command you have compressed or copied into the same
    directory. and change the following command line you can leave the path to the
    files you want to compress. Otherwise, once your file has been copied you will
    need to drop it terminal or command line and run the following command:


    ```

    java -jar yuicompressor-2.4.7.jar filetobecompressed.js -o stdout.js

    ```


    In the preceding line use version 2.4.7 of the YUI Compressor; be sure to change
    the numbers to match the version you are currently running. The file we are compressing
    in the example is named filetcompressed.js. Make sure to specify the actual name
    of your file. By adding the -o stdout.js we specified what the output file should
    be named. If you do not specify an output file, then the compressed output appears
    onscreen only.


    To see the results of minifying JavaScript, Listing 21.1 shows a sample JavaScript
    file before compression, and Listing 21.2 shows the minified file.


    # LISTING 21.1 A Simple JavaScript Function


    ```

    1: // This function will display the value passed to it

    2: function popUp(value) {

    3:   if (value === undefined) {

    4:     // No value was passed

    5:     alert("There was no value passed");

    6:   } else {

    7:     alert("Value passed: "+value);

    8:   }

    9: }

    ```


    # LISTING 21.2 The Minified Version of the Simple JavaScript Function


    ```

    1: function popUp(a){if(a==undefined){alert("There was no value passed")}

    else(alert("Value passed: "+a))};

    ```'
