- img_proc: true
  md: 'Using the preceding code applies compression to any HTML, CSS, and JavaScript
    files that are served.


    Another way you can control what files are compressed is to manage it at the directory
    level by using a .htaccess file. To manage files this way the only modification
    you need to make to the httpd conf file is to uncomment the line containing the
    LoadModule entry. After that you just need to create the .htaccess file and make
    sure it contains the following:


    ```

    AddOutputFilterByType DEFLATE text/html

    AddOutputFilterByType DEFLATE text/css

    AddOutputFilterByType DEFLATE application/javascript

    ```


    This method just like the other method, but allows you to control what folders
    have compressed. You will notice that only files that contain text are being compressed.
    This is because movies, images, and audio files are already saved using a form
    of compression that is either not supported, redundant, or will actually become
    inflated when server-side compression is turned on for these file types.


    That really is all there is to enabling server-side compression for Apache. Let''s
    shift our attention to getting the most out of image compression.


    # Compressing Images


    Image compression can be a little confusing, especially because many people believe
    that all images are JPEG files. This stems from the fact that point-and-shoot
    cameras as well as most mobile phones all take pictures that are saved as JPEG
    files. While it is true that many pictures on the Web are served as JPEG files,
    there are benefits and drawbacks to using different types of image files to get
    the compression you want. Since we''ve already started talking about JPEG files,
    let''s start there and then move to some other image types.


    # Using JPEG Image Compression


    JPEG comes from the Joint Photographic Experts Group who created this particular
    type of image compression. It is generally used as a lossless form of image compression,
    so what goes in does not always come out. The idea behind using JPEG compression
    is finding a balance between file size and image distortion or pixelation. Depending
    on the program you use to save the image, you have several options for compression.
    Some save images on a quality scale that ranges from 0 to 100, while others use
    another scale that goes from 0 to 12, and you can probably guess, the lower the
    quality, the smaller the file. JPEG files also contain a large color palette,
    supporting up to 16.7 million colors.


    To illustrate the quality levels of JPEG compression, Figure 21.2 shows a series
    of an image saved at different quality levels.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '![](img/56578b432709a7220ba1c18b41eabe62_407_0.png)


    FIGURE 21.2

    As the quality decreases, the pixelation and blur increase.


    As you can see in Figure 21.2, some areas do not seem to be affected terribly
    by the lower compression, while other areas become a blurred mess of square pixels.

    As far as using JPEG compression goes, it is generally a safe bet as it is compatible
    with almost every browser. It is generally also the format of choice for large
    images or pictures. In a few situations, however, it should be avoided—for example,
    when you need edges without distortion, images with fewer than 256 colors in them,
    and transparency. For those times, you should look at using a GIF image.


    # Using GIF Image Compression


    The Graphics Interchange Format (GIF) image compression has been around since
    1987 and boasts some very useful features. While it is limited to a 256-color
    palette, it supports transparency and animation. It uses a lossless compression
    codec that makes it the perfect choice for logos, text, and drawings.

    You should stay away from attempting to save photographs as GIF files as the color
    palette makes the image appear textured, noisy, or dithered. For the images that
    you want to save in the GIF format, many graphics programs create a modified color
    palette containing many'
  merge: -1
  pgno: 407
- img_proc: true
  md: 'colors and shades as needed to match the image you are compressing, as well
    as drop any unneeded colors to compress your file more. If you have a high number
    of colors, or just are not sure colors you may need, you can default to a web-safe
    color palette.


    Transparency is supported with GIF files; however, the support is somewhat limited.
    For the best results adding an outline or stroke to the portion of the image shown
    that contains the same color as the background it will be placed on will have
    the greatest effect. Failing to do so may give you an image that appears jagged
    or rough. Figure 21.3 shows an example of the jagged edge that can occur with
    text or other images that do not match the background color.


    ![](img/56578b432709a7220ba1c18b41eabe62_408_0.png)


    FIGURE 21.3

    Images with many edges, such as text jagged when transparent.


    While images compressed as GIF files are still in use today, another format was
    built to eventually replace GIF images. Let''s take a look at PNG compression.


    # Using PNG Image Compression


    PNG files were created with the intention of improving on the original GIF compression.
    PNG image compression was also created to sidestep a possible royalty payment
    when the compression algorithm used in GIF was patented. PNG files are similar
    to GIF files in that they are fantastic for as logos, text, and drawings. While
    PNG files can be used for photos, the compression ratio is not as forgiving as
    JPEG. This means your image will look good, but the file size will be huge, and
    as such should be avoided.


    PNG files are not limited to a 256-color palette (8-bit) but can instead use up
    to 281,474,976,710,656 colors (48-bit). Keep in mind that just because the format
    supports many colors, use hardware may not. If you were to compare a file with
    the same color palette'
  merge: -1
  pgno: 408
- img_proc: true
  md: 'as a GIF file, though, you would find that you can usually get a smaller file
    with PNG compression instead of GIF compression. Figure 21.4 shows a GIF and a
    PNG file that contain the same color palette.


    ![](img/56578b432709a7220ba1c18b41eabe62_409_0.png)


    # FIGURE 21.4


    The GIF file is 6KB, and the PNG file is 5KB.


    Another improvement over GIF is the use of an alpha channel for transparency.
    This means that you do not have to apply an outline or stroke to your image to
    keep corners looking smooth.


    With all the benefits of PNG images, you might wonder why they have not already
    taken over the format of choice for images and graphics. This is mostly due to
    lack of browser support. Until recently not all browsers supported PNG files,
    or all the features that the PNG format brings. The lack of animation support
    has also been a concern to those who like a little movement in their images. When
    considering these from a mobile perspective, PNG files make sense to be used as
    most mobile devices have browsers that support the PNG format.


    Now that we''ve covered the basic formats that can be used for image compression,
    let''s look at some tools that you can squeeze them a little more.


    # Tools for Further Image Compression


    Programs are not always perfect. Sometimes you may save a file and think that
    it will automatically generate the best file in regards to quality and size. Unless
    you specify what you are doing, using another program or tool to optimize your
    images is a good idea. The following sections discuss tools you can use to get
