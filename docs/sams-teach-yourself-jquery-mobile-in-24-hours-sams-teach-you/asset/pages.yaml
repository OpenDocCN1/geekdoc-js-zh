  md: '# HOUR 17: Detecting Mobile Devices


    Now that we know how to get the UA by JavaScript, let''s parse it redirect the
    device to another location on page load. Listing 17.5 shows a script that redirects
    some mobile devices to another page when loaded.


    # LISTING 17.5 Redirecting the Mobile Browser with JavaScript


    ```

    1: <script>

    2:   var ua = navigator.userAgent;

    3:   if ((ua.match(/iPhone/i)) || (ua.match(/Android/i))) {

    4:     location.replace("http://localhost/mobile");

    5:   }

    6: </script>

    ```


    Line 1 begins the script element. Line 2 shows a variable set up to use of the
    navigator.userAgent. This variable is important especially if you are going to
    be doing more than one check because the value will not change, so it can be stored
    in memory once instead of forcing the browser to grab it and compare it over over
    again. Line 3 shows an if block that is using the .match() function on the ua
    variable. The .match() function takes a regex that it compares to the string it
    is attached to, which in this case is the ua variable. The trailing insensitivity.
    If you prefer, you may leave those off and change the ua variable setup to the
    .toLowerCase() function. Before you do that, keep in mind that using a regex is
    about 50% faster than using the .toLowerCase() function on the ua variable. Line
    4 shows that when the if block is found to be true, it redirects the browser by
    using the .replace() function on the location object. Line 5 closes the block,
    and line 6 closes the script element.


    While this method does a great job of mimicking the server-side versions, you
    can also use this method to dynamically include different files. Listing 17.6
    shows the contents of include_js.html, which gives an example of some JavaScript
    that includes another JavaScript file (external_script.js) when it detects an
    iPhone or Android device.


    # LISTING 17.6 Using JavaScript to Include Files Based on Mobile Detection


    ```

    1: <!DOCTYPE html>

    2: <html>

    3: <head>

    4: <title>UA with JS</title>

    5: <script src="http://code.jquery.com/jquery-1.7.1.min.js"></script>

    6: <script>

    7:   window.onload = function() {

    8:     var ua = navigator.userAgent;

    9:     if ((ua.match(/iPhone/i)) || (ua.match(/Android/i))) {

    10:      $.get(''external_script.js'');

    11:   }

    12: };

    ```'
