  md: '# HOUR 2: Working with HTML, CSS, and JavaScript


    ![](img/56578b432709a7220ba1c18b41eabe62_47_0.png)


    FIGURE 2.2


    An HTML file that has been styled with the style element


    In the preceding snippet we have a file named styles.css in the same folder as
    HTML file call-ing it. Any styles that have been coded and placed in the file
    styles.css will be pulled into the document and used.


    It is worth noting that you can store your CSS in subfolders, and even load it
    from offsite.


    You are not limited to using one CSS file in your HTML file, either; you can actually
    use multiple files. Using multiple external CSS files has the advantage of separating
    styles that are not needed until a certain portion of your site has been entered
    and has the possibility of making your code easier to maintain.


    Another use of separating styles is to create browser-specific styles that are
    included only when a browser is detected.


    CAUTION


    # Using Multiple CSS Files


    Using multiple CSS files can have a few somewhat serious drawbacks. If you are
    calling them all on the same page you could create HTTP request blocking, and
    inadvertently create a slower loading web page while all of the files are downloaded
    and parsed into memory. If you are using separate files based on browser detection,
    you will most likely run into maintaining different files for different versions.
    Your site may also have an increased loading time as your detection scripts need
    to load and include files based on what they find.'
