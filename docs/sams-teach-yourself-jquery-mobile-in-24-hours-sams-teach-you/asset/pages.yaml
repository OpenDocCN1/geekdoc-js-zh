  md: '# HOUR 12


    # Handling Events


    What You''ll Learn in This Hour:


    +   - How to use page initialization events

    - How to use touch events

    - How to use virtual mouse events

    - How to trigger an event when device orientation changes


    An event is basically a trigger that happens either by user interaction or by
    a process that is being run. As a developer, you can tie into an event to enable
    custom scripts to run, or change the default behavior of an action or process.
    During this hour, we look at some of the different ways that you can use an event
    to extend your site when using jQuery Mobile.


    # Events for Page Initialization


    When pages are initialized they go through three stages:


    +   - Before page creation

    - Page creation

    - Page initialization


    These stages all have an event that can be used to help you dynamically manipulate
    code.


    Let''s start at the first event you can use during the page initialization process.


    # Using the pagebeforecreate Event


    The pagebeforecreate event is used when you have content that you wanted modified
    before jQuery Mobile had a chance to lock in and write the data-roles and attributes
    of page elements to the DOM. Listing 12.1 shows the content of pagebeforecreate.html,
    which is a file that contains a list that will be modified during the pagebeforecreate
    event.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# LISTING 12.1 Using pagebefcreate to Dynamically Add an Attribute


    ```

    1: <!!DOCTYPE html>

    2: <html>

    3: <head>

    4: <title>Developing with jQuery Mobile</title>

    5: <meta name="viewport" content="width=device-width, initial-scale=1">

    6: <link rel="stylesheet" href="http://code.jquery.com/mobile/1.1.0/jquery-mobile-1.1.0.min.css"
    />

    7: <script src="http://code.jquery.com/jquery-1.7.1.min.js"></script>

    8: <script>

    9: $(document).on(''pagebefcreate'', function(event) {

    10: $(.modify).attr(''data-inset'', ''true'');

    11: });

    12: </script>

    13: <script src="http://code.jquery.com/mobile/1.1.0/jquery-mobile-1.1.0.min.js"></script>

    14: </head>

    15: <body>

    16: <div data-role="page" id="home">

    17: <div data-role="header"><h1>pagebefcreate event</h1></div>

    18: <div data-role="content">

    19: <p>The following list will be inset during the pagebefcreate event</p>

    20: <ul class="modify" data-role="listview">

    21: <li>A/</li>

    22: <li>B/</li>

    23: <li>C/</li>

    24: </ul>

    25: </div>

    26: </div>

    27: </body>

    28: </html>

    ```


    The file starts out as a standard HTML file that uses jQuery Mobile, but on line
    8 we see the script element. Line 9 contains some jQuery code that is used to
    bind the pagebefcreate event to the document. This is done using the .on() function
    that is available when using jQuery 1.7+. Line 10 shows when the pagebefcreate
    event runs it searches for any elements that have an attribute of class="modify"
    and applies an attribute of data-inset="true" to any that are found using the
    .attr() function. Line 12 closes the script element.


    Because the pagebefcreate event runs before the page code is added to the DOM,
    jQuery Mobile sees the data-inset="true" attribute and styles it as an inset list.
    Figure 12.1 shows what the page looks like when loaded on a mobile browser.'
