  md: '# CAUTION


    # JavaScript Library Plug-ins and DOCTYPEs


    JavaScript library plug-ins are a bit picky about the use of the Transitional
    and strict DOCTYPE used on a site. If you are using a JavaScript library or plug-in
    that does not work the way as it does on a demo site, try changing your DOCTYPE
    and see whether it magically starts working as intended.


    For current developers who want to cater to modern and mobile browsers, the HTML5
    DOCTYPE is definitely the way to go.


    Using the HTML5 DOCTYPE works on almost all legacy browsers and is already in
    use on many websites today.


    To use the HTML5 DOCTYPE in your HTML file, use the following snippet:


    ```

    <!DOCTYPE html>

    ```


    Yep, that is really all there is to using the HTML5 DOCTYPE on your site. There
    is nothing crazy, long, or complicated to it.


    What is even more impressive is that legacy browsers have rudimentary support
    for it. Rather than throw the browser into a complete quirks mode, it uses more
    of a semi-quirks mode that generally does not break the formatting of the site.


    # The Basic Structure


    After the DOCTYPE has been added to the page, we can begin to assemble the basic
    structure of an HTML document. Listing 2.1 shows the required elements of an HTML
    file using the HTML5 DOCTYPE.


    # LISTING 2.1 Required Elements of an HTML File Using the HTML5 DOCTYPE


    ```

    1: <!DOCTYPE html>

    2: <html>

    3: <head><title></title></head>

    4: <body></body>

    5: </html>

    ```


    As shown in Listing 2.1, the basic structure of an HTML document is exactly that,
    basic. On line 1 we declare the HTML5 DOCTYPE allowing the browser viewing this
    file to know how to parse the rest of the document. On line 2 we start the html
    element. All valid HTML tags that we want'
