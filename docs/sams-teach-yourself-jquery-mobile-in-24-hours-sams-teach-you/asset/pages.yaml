  md: 'Q. When using custom icons, your example showed the value being "custom-sams".
    Do I need to use a dash in the value I use?


    A. No, I used that value because when the class is applied it comes out as "ui-icon-custom-sams".
    When I am working on my CSS files I know that this will be part of the "ui" as
    an "icon" that is "custom" that will have a file attached to it named "sams".
    I use this as a personal system to keep my files organized. You can name it whatever
    you want as long as you remember to apply your custom styles to the class that
    is generated.


    # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. What is a link-based button, and how do you create one?


    +   2. What data attribute do you use to remove the rounded corners from buttons?


    +   3. What do the dimensions of a custom icon need to be to use them with your
    buttons?


    +   4. True or False: You cannot use icon-only buttons; all buttons must include
    text.


    +   5. True or False: When using input elements that are automatically turned
    into buttons with jQuery Mobile, event handlers for the elements that had been
    previously bound are removed.


    # Answers


    +   1. Link-based buttons are buttons that have only the styles of a button applied.
    They cannot use any of the button functions. To create one you need an element
    that contains an attribute of data-role="button".


    +   2. To make corners square, you need to include the data-corners="false" attribute.


    +   3. For standard resolution devices you need to use 18x18 pixel dimensions.
    For HD or Retina supported icons you need to use 36x36 pixel dimensions.


    +   4. You may use data-iconpos="notext" to remove the text from the button and
    show only the icon. Although all buttons do not require text inside, using icon-only
    usability is a key factor in keeping text in your code. Browsers that do not support
    the features of jQuery Mobile still benefit from being able to see that the button
    is supposed to do.


    +   5. When jQuery Mobile changes the input element into a button it keeps the
    original element and places it above the button. The input element is changed
    to be transparent so it is not visible, but any clicks on the button really are
    clicks on the original input element.'
