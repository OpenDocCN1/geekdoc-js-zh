  md: '# The Head Element


    Placing your script element inside the head element may cause blocking, but will
    make sure your code is ready or already executing before the rest of your page
    is loaded. Those that have experience with third-party "pixel" or tracking providers
    know that they want their pixel as high as they can get. Placing a script in the
    head element ensures that it will be loaded, as the rest of the page must wait
    until the script has been downloaded before it can continue loading.


    Loading scripts into the head element this way may have some drawbacks. If the
    script you are calling is remote you may end waiting for it to load. Since some
    browsers you have only two requests for URL data at a time, this can block one
    of your requests causing the rest of the elements on your site to load considerably
    slower.


    # The Middle


    You could try loading scripts inside the body element. I have seen this done by
    developers who were debugging and never cleaned up their scripts. I also seen
    this used by those who thought it was a good idea to include the script right
    before the place where they needed it to.


    While it seems like a good idea to keep the scripts close to where you are working
    or calling the methods, this can make site and page maintenance a nightmare. Trying
    to figure out where the code that is breaking your site or web application is
    not a fun way to spend an afternoon (especially in compiled code where line numbers
    do not necessarily reflect the actual line numbers in precompiled files).


    # The End of the Body


    The last place you include your scripts is just above the closing body tag. Putting
    your scripts here enables the rest of your page to start building before any included
    JavaScript scripts can drag the URL down with slowly loading remote JavaScript
    scripts. This gives users the feeling of a fast and responsive website because
    they can see the page starting to render before the page has requested and loaded
    the functions that it needs to work.


    The drawback to this method is the fact that if you are depending on extra functionality
    be applied to the page on load and a user clicks on something that should trigger
    an event that uses events set up in your JavaScript file, the event may not be
    bound yet, so the click action will be wasted or appear as an error.


    A summary of placing JavaScript tags in your document:


    +   - Loading scripts in the head element make them load first but can adversely
    affect the perceived load time.

    - Loading scripts inside the body may seem like like a good idea but creates issues
    with maintenance and throws possible loading delays.'
