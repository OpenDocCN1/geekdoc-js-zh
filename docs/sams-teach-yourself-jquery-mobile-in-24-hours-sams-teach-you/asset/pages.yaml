    0-160kbps 8-48kHz, AMR-NB 4.7-12.2kbps sampled @ 8kHz, AMR-WB 9 rates from 6.60-23.85kbit/s
    @ 16kHz, MP3 8-320kbps CBR/VBR, FLAC (Android 3.1+) recommended sample at 44.1
    khz supports up to 48kHz recommended but support for 24-bit


    +   * Video containers: .3gp, .mp4, .webm, .mkv

