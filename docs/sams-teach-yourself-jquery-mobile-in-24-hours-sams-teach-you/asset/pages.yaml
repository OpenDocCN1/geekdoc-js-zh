  md: '# HOUR 24

    Including jQuery Mobile with WordPress


    # What You''ll Learn in this Hour:


    +   * An overview of WordPress

    * How themes work with WordPress

    * How to include jQuery Mobile in a theme


    WordPress is an extremely popular framework used by thousands of people and companies
    to serve up dynamic content and drive ecommerce sites. WordPress is an impressive
    and extensible framework, and while I would love to cover it more in depth, this
    soon we cover the basics and then get a theme ready using jQuery Mobile.


    # Introducing the WordPress CMS


    Static websites are great for use as tools or for information sharing, but they
    lack the ability for live updates. The power behind a dynamic website is an integral
    part of a website''s capability to attract visitors and even get better rankings
    on search engines. While it is true that you could edit your site manually every
    time you have an update or change, this soon becomes monotonous work that increases
    the chance for errors with every update. This is a Content Management System (CMS)
    comes into play. By using a CMS you can control what appears on a page and easily
    add content to different sections of a page.


    Two types of sites running a CMS that you are already familiar with: social sites
    and ecommerce sites. Let''s give you a tool that allows you to update content
    and change visible content. This is dynamic content generated by the user, and
    the site displays your data in a given field. Whether it is a social system that
    records and displays 140 characters or a blog that one of your friends updates
    with her works on the migratory habits of rocks in Death Valley, they are all
    CMS to one extent or another.


    Ecommerce sites are simply CMS sites that use a utility to import product data,
    including descriptions, prices, pictures, reviews, and more, that are then compiled
    and displayed to the user visiting the site. Can you imagine how difficult it
    would be to manually update and edit a'
  merge: -1
  pgno: 460
- img_proc: true
  md: 'site by hand as organize product placement, layout, and images? These reasons
    are why WordPress exists.


    WordPress has been around for years, and while it is generally billed as simple
    blogging software, it is an extremely flexible and capable system that can be
    used as a full-blown CMS solution. You may ask why you should even bother with
    WordPress when other solutions such as Textpattern, Pixie, or even Anchor CMS
    are available. WordPress may not be the end-solution for your CMS, but it is one
    of the most popular systems on the Internet. It is so popular that most web hosts
    offer one-click installs of the platform. WordPress also has one of the largest
    community followings on the Internet and carries over 19,000 plug-ins in the plug-repository.
    This gives you options, extensibility, and a place to go to when you need help.
    Let''s take a look at how to install and get WordPress.


    # Installing WordPress


    WordPress is available in two versions, a hosted version that can be found at
    http://www.WordPress.com, and a version for developers that can be downloaded
    and installed on our server. This version can be found at http://www.WordPress.org.
    While the hosted version of the platform is great for most standard users, we
    are more interested in downloading our own copy of WordPress and installing it
    on our own server. By opening //WordPress.org/download/ in your browser you are
    taken to the download page for the current version of WordPress and a .zip file
    and a .tar file. Both files contain the same files, but the .tar file is a bit
    smaller. Windows users should opt for the .zip download, while Linux and OSX users
    grab the .tar download. After you download the file, you are ready to start the
    installation process. WordPress comes with a "5-minute installation" that can
    be found at http://codex.WordPress.org/Installing_WordPress. This page includes
    a section on how to install WordPress on your computer. If you require some extra
    resources, you can try the links listed at http://codex.wordpress.org/WordPress_Installation_Techniques#Installing_WordPress_Locally.
    If you already have a web host with a MySQL 5.0+ database and PHP version 5.2.4+,
    you can upload the files from the compressed download you grabbed earlier and
    start there. If you are developing locally on your computer you need to install
    PHP, MySQL, and a web server. Common all-in-one solutions for these are XAMPP
    and Ampps. Once you have WordPress installed and running, it is time to start
    using a theme.'
  merge: -1
  pgno: 461
- img_proc: true
  md: '# Creating a Custom Theme for WordPress


    Themes in WordPress are collections of various PHP, JavaScript, and CSS files
    bundled together that control the display and functionality of the site. They
    can be used to radically change the site functions and help to extend the capacity
    of WordPress to be just about anything. Hundreds of themes are available for download,
    and some are even available through purchase. In recent versions of WordPress,
    a theme library can be searched and themes can be installed from the administration
    area.


    So what do you do when you want to create a theme? You have a few options. You
    can grab an existing theme and change it to suit your purposes, or you can find
    a "starter" or "blank" theme, or you can visit the codex on theme creation (http://codex.WordPress.org/Theme_Development)
    and build your theme from scratch. No matter what option you choose, you should
    be familiar with the basic structure of a theme which is as follows:


    +   - Header

    - Loop

    - Sidebar

    - Footer


    Each of these sections is controlled by at least one file. For example, the header
    section is controlled by header.php, while the loop section works like a content
    area that can be controlled by files like index.php, single.php, and page.php.


    To better show how this works, let''s download a blank theme and set our blog
    to use it. Several blank themes are absolutely perfect for starting a new theme.
    You could start with the HTML5Reset theme (html5reset.org), or you could start
    with another theme like Starkers. The Starkers theme was created in 2008 and has
    been updated to keep contemporary with WordPress releases. Currently the Starkers
    theme is being rebuilt and has been rebranded under thepoint Industries name.
    It will be available at http://viewpointindustries.com/. For this hour we use
    the previously released version 3.0 of the Starkers theme, which is released under
    the GPL and is available at http://jquerymobile/starker on GitHub at https://github.com/viewpointindustries/Starkers.
    Visit the website and download the theme. When the file has finished downloading,
    unzip the file and then copy or FTP the Starkers folder to your themes folder,
    which is found at wordpressInstallationDirectory/wp-content/themes (where wordpressInstallationDirectory
    is the name of the folder where you originally set up your WordPress'
  merge: -1
  pgno: 462
