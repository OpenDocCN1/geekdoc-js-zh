- img_proc: true
  md: '![](img/56578b432709a7220ba1c18b41eabe62_478_0.png)


    # FIGURE 24.11


    The search.php page rendered on a tablet


    ![](img/56578b432709a7220ba1c18b41eabe62_478_1.png)


    # FIGURE 24.12


    The page.php page rendered on a tablet


    Remember that not all themes are the same, and implementing jQuery Mobile is different
    on every theme. That doesn''t mean that it will be more difficult, but it will
    be different. You may also be considering a mobile plug-in that does device detection
    and then directs mobile users to a mobile device. WordPress is a wonderfully customizable
    platform that can do some amazing things with a little PHP know-how and determination.
    When combined with jQuery Mobile you get a truly dynamic site that works for everyone
    who visits.


    # Summary


    In this hour you learned about the WordPress framework and how it is used as a
    publishing platform from CMS to ecommerce sites. WordPress uses themes to change
    appearance and function. These themes can be customized, and other frameworks
    can be included inside them.


    You also learned that jQuery Mobile can be included in a theme and to provide
    the styles and functionality for a theme used in WordPress. While integration
    of jQuery Mobile does touch quite a few files, it can be done fairly easily and
    still provide a rich user experience to your publishing platform.'
  merge: -1
  pgno: 478
- img_proc: true
  md: '# Q&A


    +   Q. Can I add jQuery Mobile to any theme?

    A. Absolutely, but remember that the more customized the theme is the more potential
    the theme has for running into issues with the addition of jQuery Mobile.


    +   Q. What will happen to my theme when WordPress updates?

    A. Chances are usually good that you will not have to do anything; however, nothing
    is guaranteed to work in future releases. i suggest that every time a major update
    comes down for WordPress you grab it and throw it on a development blog and check
    your theme for functionality and appearance.


    +   Q. I downloaded a plug-in for WordPress and when I activated it site looks
    like exploded!

    A. I completely understand what you are going through. I have run into this issue
    with antispam commenting system. The system was designed to add an extra field
    to the comments section making it difficult for robots to fill out and submit
    the form. Unfortunately the styles were hard coded and it made the comments section
    look broken. Not all plug-ins are compatible with all themes, and some are not
    compatible with the current version of WordPress. The best thing to do in this
    instance is to see whether you can code around the issue, or modify the source
    code of the plug-in to play nice with jQuery Mobile. If that still doesn''t work,
    try searching for a fork or port of the original plug-in.


    # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. What is WordPress?

    2. What are themes in regards to WordPress?

    3. True or False: Other frameworks can be included in theme files.

    4. True or False: When adding jQuery Mobile to a theme it will work with all plug-ins
    automatically.

    5. When adding jQuery Mobile into a WordPress theme, what feature may break access
    to the admin area?'
  merge: -1
  pgno: 479
- img_proc: true
  md: '# Answers


    +   1. WordPress is a popular framework that can be used to publish dynamic content.


    +   2. Themes are bundles of PHP, JavaScript, CSS, and image files combined to
    provide function-ality and style unique to the theme.


    +   3. True. Plug-ins, widgets, JavaScript libraries, and more can be combined
    into themes.


    +   4. False. jQuery Mobile may not even appear to be working when first applied
    to the theme. It may also break your widgets, plug-ins, and theme until properly
    integrated.


    +   5. The AJAX Navigation system of jQuery Mobile may break your ability to enter
    the admin area, and even to edit posts and comments. This can be overcome by disabling
    the feature.


    # Exercises


    +   1. Use ThemeRoller to add some custom color to the theme.


    +   2. Try changing the comments section to use the original ol element and edit
    the functions. php file to change the display to something new.


    +   3. Try customizing another WordPress theme to use jQuery Mobile and test and
    see how your implementation works.'
