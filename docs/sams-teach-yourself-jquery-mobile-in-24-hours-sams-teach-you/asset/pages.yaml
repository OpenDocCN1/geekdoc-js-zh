    are also shown when detected. The audio section displays the bitrate, sample rate,
    channels, and codec used.


    While this is best standalone solution for Windows users, other inspection tools
    are available as follows:


    # OSX


    +   - Media Inspector—Available in the App Store

    - Invisor and Invisor Lite—Available in the App Store

    - VideoSpec—Available at http://videospec.free.fr/english/

    - iMediaHUD—Available at http://www.ffmpeg.com/styled-6/index.html


    # Linux


    +   - Themonospot—Available at http://www.integrazionweb.com/themonospot/


    Now that you know how to determine what is in a video file, use this information
    to encode a video. Let''s look at some programs that you can use to encode your
    video.'
