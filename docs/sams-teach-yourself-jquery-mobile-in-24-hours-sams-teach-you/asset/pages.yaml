  md: 'values are actually the same; one is just written in shorthand. This also applies
    to hex values that use capital or lowercase letters. Even though the values do
    not appear quite the same, you do not have to worry about the values being interpreted
    incorrectly by the browser viewing your theme.


    Q. Can I include more than one custom CSS file?


    A. Sort of, but in all honesty you should avoid it. Each theme can have up to
    26 swatches, and then you can mix and match the styles inside them to create even
    more custom styles. So if you are asking whether you can combine two CSS files
    to create a theme with 52 swatches instead of 26, the answer is a solid no. If
    you mean that you want to include one file with swatches A-E and another file
    with swatches F-Z, then yes you can technically do that, but it will cost you
    an extra HTTP request and managing your styles much more difficult.


    Q. Do I have to use the compressed version of the CSS file? I tried opening it
    and it doesn''t appear human-readable.


    A. Whether you used the compressed or minified version of your styles is completely
    up to you; however, the minified version of your theme is included because it
    reduces file-size and makes the file download faster to the client browser.


