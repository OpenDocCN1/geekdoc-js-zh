  md: '# Creating a Tablet Layout


    Tablets have the advantage of higher resolutions than most smaller mobile devices.
    Generally means that you have more room to use in your design and allows you to
    change the layout to accommodate the extra space. This also means that some elements
    of your design may now appear stretched and out of place. To take that into account,
    Figure 15.3 shows a wireframe of what the design should change to when viewed
    on a tablet.


    ![](img/56578b432709a7220ba1c18b41eabe62_299_0.png)


    FIGURE 15.3 A wireframe of the tablet version of the portfolio site


    With the new layout in mind, Listing 15.3 shows the style element portion of portfolio-tablet.
    html.


    # LISTING 15.3 Using a Media Query to Adjust the Page Layout for Tablets


    ```

    1: <style type="text/css" media="screen">

    2: img {max-width: 100%;};

    3: #app-pic {width: 50%;float: left;}

    4: #app-name {width: 50%; margin-left:50%;min-height: 80px;}

    5: @media all and (min-width: 800px){

    6:   /* Tablet styles go here */

    7: #app-pic {width: 30%;}

    8: #app-name {width: 30%;float: left;margin: 0;}

    9: #app-contact {width: 30%;float: right;}

    10: #app-work {clear: left;width: 63%;padding-top: 1%;}

    11: #app-interests {width: 63%;float: left}

    12: #app-social {width:30%;clear: right;float: right;}

    13: }

    14: </style>

    ```'
