- img_proc: true
  md: '# Summary


    In this hour you learned about forms and how jQuery Mobile uses them. You learned
    about the modifications to standard form inputs that jQuery Mobile makes, as well
    as some of the new form inputs that jQuery Mobile offers. You learned how to add
    a slider, a flip toggle switch, and a search input to a form.


    This hour also discussed form submission. The default method for submitting a
    form is with a GET request, although this can be changed to a POST request if
    you want. You learned that the default handling method of form submission is through
    an AJAX call where the results are injected into the DOM. Finally you learned
    that you can override the AJAX setting and require the page to be reloaded through
    the use of the `data-ajax="false"` attribute on the form element.


    # Q&A


    +   Q. You mentioned that some mobile browsers ignore styles or replace them.
    Why does this happen?

    A. The jQuery Mobile team does its absolute best at trying to accommodate as many
    browser types as you can. While most modern mobile browsers are based on WebKit
    and use a similar preset CSS and browser chrome, some use completely different
    rendering methods. Opera Mobile for example is focused on speed and handles element
    rendering a little differently than the rest to deliver pages quickly and efficiently.

    Q. What if I don''t want to use any jQuery Mobile styles on my form elements?

    A. While I''m not sure why you would want to do that, I''m sure you have your
    reasons. In this case you can simply add `data-role="none"` to any form element
    that you want to have rendered natively by the browser.

    Q. When submitting forms through AJAX, the URL in my location bar changes; is
    it really using AJAX?

    A. Yes, jQuery Mobile will update the displayed URL in your location bar, but
    if you watch with debug tools you will see that the original page is just marked
    as `display:none` and the page that was AJAX''d will appear.


    # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Quiz


    +   1. How do you change a form to use a POST request instead of GET?

    2. What do you need to do to disable AJAX form submission?

    3. True or False: By default, jQuery Mobile only adds new input types. It does
    not change the style of any existing input types.

    4. How do you create a flip toggle switch?

    5. True or False: Search inputs are actually just restyled Submit buttons.


    # Answers


    +   1. In your form element, add the attribute method="POST".

    2. In your form element, add the attribute data-ajax="false".

    3. jQuery Mobile changes all form elements by default, but can be told to let
    the browser handle them natively using the data-role="none" attribute.

    4. You need to create a select element with an attribute of data-role="slider"
    and then place two option elements inside it.

    5. A search input is part of the HTML5 specification that is more closely related
    to a text field.


    # Exercises


    +   1. Create a contact form using jQuery Mobile. Think of all the fields that
    you want to capture and use the various input elements to make your form.

    2. Create a preferences page using the slider and flip toggle switch.

    3. Using whatever backend programming knowledge you have, create a page that handles
    a form submit using jQuery Mobile. If you do not have any backend experience,
    try changing the login.php file that we used in this hour to get data from more
    fields, or to display the data in different input elements.'
