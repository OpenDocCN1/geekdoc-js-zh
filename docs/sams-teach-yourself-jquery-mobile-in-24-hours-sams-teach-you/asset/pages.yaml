    # # Changing the Button Size


    Whenever we previously created a button, we didn''t worry about the size of the
    button. While you may not ever need to change the default size of a button, you
    may run into a few problems or some unexpected results with the default size.


    By default, buttons take as much width as they have available to them. If you
    design your site and test only with a low-resolution device you may never notice
    what happens to your buttons when they are viewed on a tablet. Figure 9.5 shows
    a page with a couple of buttons being viewed on a tablet in landscape orientation.'
