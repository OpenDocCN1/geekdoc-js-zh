    download different browsers or emulators and use them to view a page using jQuery
    Mobile. Note the differences between the browsers and then open the CSS file and
    tweak the settings to see what browsers are affected.


    +   3. Create your own swatch by copying an existing swatch or from scratch. Change
    the button colors, the body colors, and other styles. Notice what happens when
    you change the text but forget to change the color of the text shadow. Look for
    other changes that affect the way the page is displayed.'
