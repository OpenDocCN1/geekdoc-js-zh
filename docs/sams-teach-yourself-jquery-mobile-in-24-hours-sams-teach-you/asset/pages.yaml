  md: '# Touchscreens


    Most modern mobile devices feature a touchscreen for data display and functionality.
    There are actually many types of touchscreen technologies, but the two most popular
    for mobile devices are usually resistive and capacitive.


    # Resistive


    Touchscreens that use resistive technology function by using a multilayered screen
    with two conductive layers in them separated by a gap. When the screen is touched
    or tapped, the layers touch together to create a point. Those who remember old
    Personal Digital Assistant devices and even current gaming devices should be familiar
    with this type of touchscreen generally include a stylus to increase the accuracy
    of the touch or tap. A downside to this type screen is that it can have a delay
    when tracking movement making applications and websites feel a bit sluggish compared
    to capacitive screen devices.


    # Capacitive


    Touchscreens that are capacitive function through the use of sensors placed in
    various areas of the screen that detect the tiny frequency changes between an
    insulator and a transparent conductor that occur when the screen is touched or
    pressed. Frequency changes are dependent on a conductive material touching the
    screen. This is why a nonconductive stylus, glove, or similar material touches
    the screen the frequency will not change and the touch will not be detected. Many
    mobile devices opt for this type of touchscreen technology because of increased
    precision when touching the screen.


    # Orientation


    Many portable devices can detect how they are being held and will change how data
    is displayed to the screen, or use this information as an input device. While
    it may not seem terribly helpful at first, device orientation can make a large
    impact on some activities such as reading. This displays the inherent benefit
    of supporting two viewing resolutions.


    # Accelerometer


    Some devices include a gyroscope or three-way sensor that can return feedback
    by analyzing movement along the x, y, and z axis. This information is then processed
    and can be used to adjust the screen orientation, or can be used by some programs
    or games as a way to move objects along the surface.


    # Proximity Sensor


    This is one sensor that few people think about or even exists. This may not be
    included in your mobile device but is found in many current mobile handsets. The
    main function of this is'
  merge: -1
