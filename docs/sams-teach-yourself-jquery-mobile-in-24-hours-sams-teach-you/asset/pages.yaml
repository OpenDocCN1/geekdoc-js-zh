  md: '# Creating a Desktop Layout


    We now have a site that looks great on a small-screen mobile device and a tablet.
    We may still be a problem, though. What happens when we view the site on a desktop
    with a high-resolution screen? The site still suffers from the stretching effect
    that happened when we viewed the mobile version on a tablet device. Let''s look
    at using another media query to take care of views from desktop computers.


    Unless you are specifically targeting mobile devices and routing them to special
    content or a special section of your site, you will have desktop users using your
    mobile device. This means that you really need to consider using a media query
    to at least put size restriction on the amount of space you want the entire page
    to take up. Of course it is personal preference, and some designs work well with
    long buttons, lists, and content areas.


    You may have already known or heard about some research that suggests users follow
    an “F” pattern when viewing information on a site using a desktop. By choosing
    to follow that pattern, I am going to change the layout a bit in the hopes that
    it will increase the odds of what I want the user to read and remember.


    # Analytical Awareness


    You should do as much analytical research for your site as possible. Also keep
    in mind that just because a pattern or theory works today, that doesn''t mean
    it won''t change or become a rule. The “fold” for instance was a design law that
    is now becoming less important than it was once.


    15.5 shows the wireframe for the site when viewed on a desktop or high-resolution
    device.


    Now that we have a wireframe to work with, let''s look at Listing 15.4, which
    shows the style element portion from portfolio_desktop.html.


    # LISTING 15.4 Using Media Queries to Change Site Layout for Mobile, Tablet, and
    Desktop Devices


    ```

    1: <style type="text/css" media="screen">

    2: img {max-width: 100%};

    3: #app-pic {width: 50%; float: left;};

    4: #app-name {width: 50%; margin-left:50%;min-height: 80px;};

    5: @media all (min-width: 800px){

    6: /* Tablet styles goes here */

    7: #app-pic {width: 30%;};

    8: #app-name {width: 30%; float: left;margin: 0;}

    9: #app-contact {width: 30%; float: right;};

    10: #app-work {clear: left;width:63%;padding-top: 1%;};

    ```'
