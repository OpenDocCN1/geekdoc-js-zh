  md: '# Q&A 289


    ![](img/56578b432709a7220ba1c18b41eabe62_306_0.png)


    FIGURE 15.8

    Page with elements styled from a media query triggered from landscape


    Finally, I will again point out that if you design the site with a mobile first
    approach and plan ahead using min-width, you will not have to rely much on using
    the orientation media query, but that it is always good to know that it is an
    available option.


    # Summary


    In this hour you just learned about media queries and how they can be leveraged
    to create sites that maximize the available screen resolution of the device viewing
    them. You learned how to design from the mobile up, and how doing this saves on
    extra CSS and makes your site easy to extend. You also learned about using device
    orientation and how it can be used as a media query to help adjust layout based
    on how a user is using a device to view your site.


    # Q&A


    +   Q. Do I really have to use media queries or can I just use default styles?

    A. You only have to use media queries if you want to. They are tools to help designers
    and developers create new experiences that are easily tailored to the browser
    user is using to view your site. You are more than welcome to use any style or
    even use a little JavaScript to dynamically change your site.'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'Can I mix and match more than two media queries to get a little more specific
    on the exact resolution of devices I want to have certain styles?


    Remember that not all browsers respect the orientation property of media queries,
    but you can. Here is a query you can use that specifically targets mobile devices
    that have a resolution of 480x800: @media all and (min-device-width: 480px) and
    (max-device-width: 800px) and (orientation: portrait) {/*Styles here*/}.


    I''ve heard a little about combining CSS3 transitions with media queries. Does
    that mean the entire page can animate itself whenever screen orientation changes?


    Sort of. Elements that are not used with positioning or floats can be transitioned
    and it looks fairly cool. However, if you used the portfolio example from this
    hour you''d really notice the #app-name element animating or using any transitions
    at all.


    # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. What version of CSS are media queries?


    +   2. What is the difference between min-device-width and min-width?


    +   3. True or False: When using a media query you cannot link to styles included
    in external CSS files.


    +   4. True or False: The orientation property of media queries is compatible
    with all browsers.


    +   5. True or False: When using responsive layout you should use a grid system
    or percentages for widths.


    # Answers


    +   1. Media queries were introduced as part of the CSS3 specification.


    +   2. min-device-width uses the actual device resolution for width, where min-width
    uses viewable space of the browser window.


    +   3. False. You can run a media query that links to an external CSS file for
    all of the styles. For example you could use: <link rel="stylesheet" media="screen"
    and (min-width: 800px) and (max-width: 1280px) href="css/tablet.css" />.


    +   4. False. While the orientation property is compatible with most mobile device
    browsers, it is not supported by all browsers (including desktop browsers).'
  merge: -1
  pgno: 307
- img_proc: true
  md: '5. For best results you should always use a grid system or percentages for
    styling. This is part of what makes the site responsive and able to adapt to the
    browser it is being viewed in. You can always add an element to wrap the content
    portion in to control how wide the site gets.


    # Exercises


    +   1. Open the portfolio_desktop.html file and modify the existing styles to
    play with the site layout. Think of a different way to display the site and change
    the sections around CSS only.


    +   2. Modify the portfolio site to have another media query. You could change
    the site to adjust styles at 480 or 512 instead of 800. This would allow you to
    change the display for older generation smartphones.


    +   3. Using either a sketch pad or program, create your own wireframes for a
    mobile, tablet, and desktop design and then create it using media queries.'
