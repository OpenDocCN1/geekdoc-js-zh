    +   - May still suffer from redirect issues.


    To learn more about other elements and data that you can get out of the $_SERVER
    variable, visit the PHP manual at http://www.php.net/manual/en/reserved.variables.server.php.


    While we have covered two methods of detecting mobile devices from the server,
    you can also use JavaScript to detect and redirect a browser from the client.


    # Using JavaScript as a Detection Method


    JavaScript can be used in the nearly same manner as using PHP or a .htaccess file.
    While it may have some obvious differences, it is still a method that you may
    want to employ. When using JavaScript you can still get the UA by calling the
    userAgent property of the navigator object. Figure 17.4 shows the contents of
    detect_js.html.


    # LISTING 17.4 Displaying the UA with JavaScript


    ```

    1: <!DOCTYPE html>

    2: <html>

    3: <Head>

    4:  <title>UA with JS</title>

    5: </head>

    6: <body>

    7: <h1>Detecting the UA with JavaScript</h1>

    8: <p>Click the button below to view your device UA.</p>

    9:  <button type="button" onclick="getUA()">View UA</button>

    10:  <script>

    11:   function getUA() {

    12:    alert(navigator.userAgent);

    13:   }

    14:  </script>

    15: </body>

    16: </html>

    ```


    The code here looks like standard test page boilerplate, and it is, so we''ll
    start on line 9. Line 9 shows a button that calls getUA() function when clicked.
    This function is defined inside the script element that starts on line 10. The
    function is declared on line 11. Line 12 shows an alert() function being called
    that displays the value of navigator.userAgent when run. Line 13 closes the getUA()
    function, and line 14 closes the script element.


    This shows similar results to what we saw with the PHP tests. Figure 17.3 shows
    the test being run from a desktop browser, and Figure 17.4 shows it running in
    an iOS simulator.'
