    Two pages are included in this example with each using a different swatch. The
    custom style sheet that contains our custom swatches is included on line 7. Note
    that when including custom styles, you should always include them after the jQuery
    Mobile styles have been included.


    The button on line 16 will change from the first page to the second. The button
    on line 28 will change back. Both pages are setting the data-theme on the element
    that contains the data-role="page" attribute so that the swatch is applied to
    all components on the page. Figures 13.8 and 13.9 show the first and second pages
    rendered in a mobile browser.


    You can continue to add swatches to your CSS file all the way to the z swatch.
    Just in case you wondered, you do not have to go in alphabetical order if you
    do not want to; you can start at any letter.'
