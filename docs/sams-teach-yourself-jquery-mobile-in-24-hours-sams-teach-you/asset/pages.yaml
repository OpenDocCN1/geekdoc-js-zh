  md: 'Many more mobile operating systems are available, and more are currently in
    active develop-ment. Some mobile devices feature an OS that has taken the core
    of another OS and applied heavy modifications to both the look and functionality
    of the system to create a unique user experience.


    # Learning About Mobile Graded Browser Support


    With so many mobile devices in existence, the team at jQuery Mobile has decided
    to keep a matrix of supported devices.


    Before you get too excited, it does not cover every mobile device in existence,
    but it does cover the popular ones. The list is carved into four major sections
    or grades.


    The A-grade section is a list of browsers that support all the features that jQuery
    Mobile adds to your site. This means all the special effects including page transitions
    appear, and all them styles will be applied. This also means that pages will be
    loaded through AJAX and will be dynamically inserted into the DOM giving a smoother
    experience.


    The B-grade section still offers an excellent viewing experience with most styles
    being enabled. Navigation may feel on the low side since AJAX page loading is
    not supported. This means that rather than receiving loading messages while pages
    are fetched and inserted into the DOM, pages will have to be navigated to and
    displayed.


    The C-grade section gets you a basic usable site. The pages will still load, and
    your content will still be there, but everything is reduced to fallbacks. The
    fancy styles will not be applied. Page transitions will not work.


    The last section is more of a message from the development team letting users
    know that they have not tested every mobile OS and device. What is nice is that
    there is usually a note why a device is on the list. The reasons may vary from
    OS not supported to unable to test due to lack of emulation software or hardware
    available. To view the list of currently supported devices for yourself browse
    to http://jquerymobile.com/qbs/


    # Summary


    In this hour you learned about some the aspects of mobile devices, including screen
    size and resolution and that each mobile device may display an image at a different
    size due to resolution.


    You learned about the different feature sets that can be found in mobile devices.
    You also learned about some the functionality of these features and have an idea
    about how they can be used by developers.'
