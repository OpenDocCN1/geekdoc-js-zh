- img_proc: true
  md: '# Manually Adjusting the Swatches


    When you have the time or want to really fine-tune your theme, you can manually
    set all the properties. This is similar to using the inspector, but instead of
    using the inspector to find the elements you want to edit, you only use the properties
    section. The benefit to this is that you can use your mouse to test the elements
    in your swatch. For example, when the inspector tool is turned to Off, you can
    click on the Option 1 button on any swatch. This makes a select box appear above
    the swatch that allows you to see what your properties have done.


    If you have just loaded the ThemeRoller page and have not changed any settings,
    you should notice that the properties section starts with the Global properties
    selected. By default three swatches named A, B, and C appear as navigation tabs.
    Each of these navigation tabs has submenus you can expand to change the properties
    below.


    The General tab contains:


    +   * Font Family

    * Active State

    * Corner Radii

    * Icon

    * Box Shadow


    Figure 16.4 shows the Global tab with collapsed submenus.


    ![](img/56578b432709a7220ba1c18b41eabe62_315_0.png)


    FIGURE 16.4

    These settings apply to all swatches.


    The Font Family submenu contains only the F property to edit. Remember that themes
    are CSS driven; the value for this property can be any valid web font or font.
    The default setting is Helvetica, Arial, sans-serif.'
