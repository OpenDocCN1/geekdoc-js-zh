    to watch movies, news, and entertainment. Because of this, most devices have built-in
    support for many video types. The following sections provide a handy reference
    list of devices and relevant specs for video playback. This list is important
    to know as it can be used to help you determine what you should be aiming when
    creating videos for end users.


    # Android


    Android has good support for common video formats as well as a wide range of audio
    file support. Something that should be noted with devices running Android is that
    some codec support can be added by custom builds and by third-party manufacturers.
    For example, the Samsung Galaxy Player 5.0 has support for FLAC audio files even
    though it runs Android version 2.3.5.


    +   * Native resolution: On varie and model up to device

