  md: '# Finding Emulators for Testing


    +   - Can be used to test responsive layouts between devices

    - Easily test websites and applications inside native device browsers


    Cons of using device emulators:


    +   - Device input is emulated and may not be completely accurate.

    - Device operating speed may be incorrect.

    - Some emulators may not run on your current OS.

    - Lack of full device feature support.


    Now that you know why you should use emulators, and *some* of the common pitfalls
    that come with them, let''s look at the process of acquiring and running them
    on your system.


    # Finding Emulators for Testing


    Getting your hands on an emulator is usually a straightforward process. Visiting
    the developer section of almost any mobile OS usually results in a link to sign
    up for development tools or the Software Development Kit (SDK). Some sites make
    getting the emulator easy, while others require you to sign up as a developer.
    Once you have through the correct hoops and filled out the required forms you
    are given the link to the files that contain the emulator.


    # Android


    The emulator for Android is part of the Android SDK, which is available for download
    at http://developer.android.com/sdk/index.html. The download does not require
    any signup or registration and is available for Windows, OSX, and Linux systems.
    Once you have downloaded and installed the Android SDK, you can use the Virtual
    Device (AVD) Manager to create emulators for different Android devices. Unlike
    other emulation software, the AVD Manager allows you to create multiple emulators
    that run different versions of the Android OS. To create emulators with different
    versions of Android, you need to first use the included SDK Manager to download
    the versions that you want for your emulator. While the base Android API versions
    can be downloaded without any developer registration, some of the API versions
    require registration. You may choose to sign up, skip downloading the specialized
    API versions. Once you have downloaded the API versions that you are going to
    use, you can open the AVD Manager and click on the New button. From there you
    are presented with a virtual device creation screen. Figure 22.1 shows the screen
    with some settings filled out.'
  merge: -1
