    # Using the pageinit Event Instead of

    $(document).ready()


    To use the pageinit event on your page, you have to take a slightly dynamic and
    more

    planned approach to your code. There are a few different ways you can attach the
    pageinit

    event in your code. When using a version of jQuery Mobile prior to 1.1, you will
    be using jQuery

    1.6.4, which means you use the .bind() function instead of the .on() function.
    When using

    jQuery Mobile 1.1+ you use the .on() function to bind the event.


    The .on() function introduced in jQuery 1.7 is a unification of functions used
    to bind

    events. Instead of having to worry about using .bind(), .live(), or .delegate(),
    you can

    now use the .on() function to find events. More about this function can be found
    by visiting

    http://api.jquery.com/on/. If you are using a version of jQuery Mobile prior to
    1.1, you should

    not use the .on() method, but should instead use .delegate() or .live() function.


