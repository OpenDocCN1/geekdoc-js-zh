  md: '# HOUR 7

    Learning About Page Layout


    What You''ll Learn in This Hour:


    +   * How to create a single page layout

    * How to create a multiple page layout

    * How to align content with a grid

    * How to make content collapsible


    This hour we dive deeper into the use of single and multiple page layouts. We
    also learn about using a grid to help align content, and then finish the hour
    by learning how to add collapsible content on a mobile site.


    # Using a Single Page Layout


    As you start to think about your mobile projects, you may find that a single page
    site is a viable option. Single page sites are great for profile sites or simple
    applications. But of course there is much more than just using a single page layout.
    A single page layout is the starting point for any iQuery project. Every page
    in your site will share the attributes of a single page template.


    We previously discussed the three main sections of a mobile page; the head, content,
    and footer sections. Regardless of your overall site structure, every page you
    include will use portions of a single page layout.


    Listing 7.1 shows the contents of singlepage.html. This is a simple single page
    layout that can be used as a base for any page you are going to build.


    # LISTING 7.1 A Single Page Template


    ```

    1: <!DOCTYPE html>

    2: <html>

    3:   <head>

    4:     <title>Sample template</title>

    ```'
  merge: -1
  pgno: 130
- img_proc: true
