    +   2. The header toolbar supports two buttons and automatically puts the first
    button on the left and the second button on the right side of the toolbar. You
    can override the default behavior and styles with custom if you want.


    +   3. To apply a controlgroup to your buttons, you need to wrap the buttons in
    a container element that contains an attribute of data-role="controlgroup". By
    adding a second attribute you can adjust the alignment of the controlgroup. By
    default the control-group aligns the buttons vertically, but by using data-type="horizontal"
    the buttons will be lined up next to each other.


