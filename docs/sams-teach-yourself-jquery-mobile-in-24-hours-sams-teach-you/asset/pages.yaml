    # Enhancing Forms with jQuery Mobile


    jQuery Mobile has exceptional support for forms on mobile devices. Each element
    has been restyled to be barely and easily usable on a mobile device. Keep in mind
    that some of the form styles vary slightly depending on the platform and mobile
    browser that you are using.


