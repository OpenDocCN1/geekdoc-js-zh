    You should recognize this code from the pages since you should have a pretty grasp
    on what is going on with this code, I''ll briefly touch on some of the lines that
    you should pay particular attention to.


    Line 1 shows the <!DOCTYPE html declaration. We previously covered why this is
    important, so make sure that you always start your HTML files with this declaration.


    Line 4 is the title element, which is important for Search Engine Optimization
    (SEO) and descriptive purposes. Line 5 is the meta element that allows the page
    to fit mobile devices. If you leave it out, your end user will have to pinch and
    zoom, and your site may suffer from unexpected layout issues.


    Line 6, 7, and 8 all have the required files for using jQuery Mobile. In this
    example we load them from a Content Delivery Network (CDN). You need to keep these
    links up to date to use all the newest features.


    Line 11 is the container for our page. Due to the Ajax nature of jQuery Mobile,
    all pages are kept separate and loaded when. Note that in single page documents,
    this container is not necessarily required and will be inserted automatically
    when not included. With being said it is still good practice to always include
    a container for your page.


    Line 12 begins our header section. Note that you do not have to use an h1 if you
    do not want to. I strongly recommend you do for SEO purposes, but if you have
    a different strategy you may change this value to an h2, h3, h4, h5, or h6 and
    still retain the same styling.'
