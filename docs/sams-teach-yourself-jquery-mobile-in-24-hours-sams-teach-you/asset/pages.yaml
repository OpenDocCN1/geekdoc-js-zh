    GRI34) AppleWebKit/533.1 (KHTML, like Gecko) Version/4.0 Mobile

    Safari/533.1"


    +   - "Mozilla/5.0 (iPad; CPU iPhone 5_0.1 like Mac OS X

    AppleWebKit/534.46 (KHTML, like Gecko) Version/5.1 Mobile/9A405

    Safari/7534.48"


    +   - GET /favicon.ico HTTP/1.1" 404 209 "http://192.168.0.9/"

    "Mozilla/5.0 (Linux; Android 2.3.5; en-us; Y-G70 Build/

    GINGERBREAD) AppleWebkit/533.1 (KHTML, like Gecko) Version/4.0 Mobile

    Safari/533.1"


    The preceding examples are from both emulators and actual devices. I used both
    so that you

    would have an example of how the UA can vary even when it''s coming from an emulator

    that should be mimicking the actual device you are trying to use. The first two
    listed above are

    emulators, an iOS emulator and an Android emulator. The third and fourth are actual
    mobile

    devices—an iPod Touch running iOS 5.0.1 and a Galaxy Phone 5 running Gingerbread
    2.3.5.


    Taking a closer look at these UA you can see that they have a few similarities.
    For exam-

    , both the IOS emulator and the iPod have the word iPhone in the UA. For the other
    two\examples, both the emulator and the Galaxy Phone have the word Android in
    them. Knowing

    this, we can build a simple regular expression (regex) based on finding these
    keywords in the

    UA when a page is requested. Listing 17.1 shows a simple .htaccess file used to
    find iPhone and

    devices.


    # LISTING 17.1 Using regex and +htaccess to Follow Mobile Devices


    ```

    1: Options+FollowSymlinks

    2: RewriteEngine On

    3: RewriteCond %{HTTP_USER_AGENT} "android|iphone" [NC]

    4: RewriteRule ^.*$ http://localhost/mobile/ [L,R=302]

    ```


    Line 1 shows a statement that is defined by the Apache server to allow the rewrite
    to work. I have

    read that if this line is already included in your server configuration it may
    cause your

    page to error. While I have not run into this particular problem myself, if you
    are getting an

    Error 500 page when this runs, removing line 1. Line 2 shows the RewriteEngine
    being

    enabled. The RewriteEngine is part of the server magic that makes this all run;
    it enables the

    server to read the request from the client browser and rewrite it to everything
    else. One

    common for rewriting the request is for blog engines to make the URLs more human
    read-

    Line 3 is where we are starting to determine a RewriteCond that checks the UA

    for words android and iphone. If you are wondering why I didn''t type "Android"
    and

    "iPhone" inside the regex, it is because particular line has [NC] at the end.
    The [NC]'
  merge: -1
