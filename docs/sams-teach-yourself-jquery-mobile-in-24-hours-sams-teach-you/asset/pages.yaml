  md: '# Photoshop


    Yes, Adobe Photoshop has the ability to compress your images in a very fine Save.
    The trick is not to save the image as you would normally, but instead to use the
    Save for Web & Devices menu option. When you use Save for Web & Devices, a few
    options are automatically set that help keep the file size down. For example,
    PNG files are automatically saved with 8 bits per channel instead of 24. The other
    nice thing about saving for the Web is the interface that you are shown when saving.
    You can see exactly how your quality changes to the image. Running my test files
    through this method I was able to get my JPEG compressed down to 633KB with minimal
    distortion and my PNG test file down to 3.5KB.


    # Picasa


    Picasa is a free offering from Google that runs on Windows and OSX. This imaging
    software allows you to edit and group photos as well as export them as compressed
    JPEG images. Linux users can also get the program installed using WINE.


    Now that we''ve covered image compression, let''s take a look at an experimental
    Apache module that provides an all-in-one compression solution.


    # Using mod_pagespeed on Your Apache Server


    For those running Apache 2.2+ for your web server, you should look into running
    Google''s mod_pagespeed. This is an open-source Apache module that uses a rewrite
    of filters that help with compression and request limiting. It has some of the
    previously mentioned image compression techniques built in to help compress your
    images for delivery. I like to think of it as a magic pill for improving the Web
    experience.


    It works in a fairly simple manner. Instead of responding to every HTTP request
    that comes in, it accepts all requests first and then prioritizes them as well
    as groups similar files. These files are then treated with server-side compression
    and sent to the client requesting the resources.


    For an example of how files are bundled, let''s say your website has base.css
    and category.css file that are called on the same page. Instead of using two requests
    and responses to get both files to the browser, it accepts requests, and then
    appends both CSS files together and minifies them for return so that only one
    HTTP response is used. This works for way JavaScript files. If you combine this
    with a caching policy, the savings can really start to add up.


    Some sites may not see much of an improvement, while others can see a speed increase
    of around 40%. As always, your mileage will vary, but if you have a Debian or
    RPM-based Linux distribution, go to http://code.google.com/speed/page-speed/docs/module.html
    and get started with optimizing your server.'
  merge: -1
