    # Summary


    In this you learned what the JQuery Mobile ThemeRoller is and how to access it.
    You learned how to use the color palette to drag and drop colors onto color swatches
    to change styles. By using the inspector tool you can figure out exactly what
    element and property you need to edit the customization you want. You also learned
    how to download your theme when finished, import it back into ThemeRoller to make
    changes, and implement your custom theme into your page.


    # Q&A


    +   - When reading about adjusting the properties for the various Global and swatch
    styles, why are some of the default values inconsistent in the way they are presented?

    - I''m not entirely sure why the values in the tool do not follow a preset guideline
    for presentation or entry. For example, the Button: Hover submenu has a property
