  md: '# Working with a Custom Theme 303


    (usually done through Command+C or Ctrl+C) Next open your browser back up to import
    link just below the Download Theme link. When you do that, a modal window appears
    and asks you to paste your code into the text area. Paste your code into the text
    area (usually done with the Command+V or Ctrl+V keys) and click the Import button
    in the modal window. As soon as you click the button, your theme is applied and
    your styled swatches appear.


    Please note that the import function does not work with themes that you created
    yourself, but only with themes generated by ThemeRoller. The import feature has
    one other feature that makes it easy to extend the default theme that comes with
    jQuery Mobile. This is useful for when you are upgrading a legacy app, or when
    you have built a site using the default styles and want to customize the original
    swatch. To import the original jQuery Mobile styles, click on the Import button,
    instead of pasting in your CSS code. click on the Import Default link on the top-right
    of modal. This automatically puts the styles into the text area. After it has
    loaded, click the Import button to finish the process. As soon as the import is
    finished, you will see the familiar swatches appear.


    Now we know how to download our custom theme, and how to import it back into ThemeRoller
    for more modification, let''s learn how to include our custom theme in our page.


    # Including a Custom Theme


    When you download your theme, you are shown a snippet of code that enables you
    to use your custom theme. While the sample code uses a bold style to highlight
    the inclusion of your custom theme, it is easy to overlook the other style that
    is being used.


    When using a custom theme instead of using the standard jQuery Mobile styles you
    need to just give the structure. This may feel a little vague so let give you
    an example.


    Instead of using this styles reference:


    ```

    <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css"
    />

    ```


    Use this:


    ```

    <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0/jquery.mobile.structure-1.0.min.css"
    />

    ```


    The major difference may appear be the filename, but the files are actually quite
    different. The file jquery.mobile.structure-1.0.min.css contains only the pieces
    necessary for the layout or structure of jQuery Mobile. It does not contain any
    swatch information. This helps cut down on the file size, and more importantly
    prevents the default jQuery Mobile styles from overwriting your custom theme styles.
    You can load this style using one of the jQuery Mobile Content'
