  md: '# HOUR 3

    # Using the jQuery Framework


    **What You''ll Learn in this Hour:**


    +   - How to include jQuery in your site

    - How to use jQuery selectors

    - How to include and use the jQuery framework


    This hour covers the basics of the jQuery framework. This is important as it gives
    a developmental base and understanding of the framework that jQuery Mobile uses
    to function. Learning about jQuery also gives you an idea of how you can write
    scripts that can be used with jQuery Mobile. This hour is purely about the jQuery
    framework.


    Unless you are running a static site or application, you are going to run into
    a few wishes and wants. You are probably going to want to create an area that
    rotates or changes displayed information. Perhaps you want to display a gallery
    of images. Another feature you may want is add some friendly client-side validation
    to reduce server-side validation requests. Or of course you may want some special
    effects to use on your site and do not want to use a plug-in-based playback device.


    By using JavaScript, everything on the previous list is not only possible but
    is already being used on millions of websites. There are pages built on the use
    of "vanilla" JavaScript, and there are plenty of sites built with various JavaScript
    libraries that help developers create everything on their wish list.


    While we won''t cover the other libraries here, I will tell you the reason why
    I absolutely adore jQuery. jQuery is simple, seriously simple. It might sound
    a little odd, but with jQuery you can learn and use JavaScript with little knowledge
    of the JavaScript language.


    Using a framework is all about saving you time, reducing bits bandwidth, and making
    things easier. jQuery does all these things by taking the small bits of JavaScript
    that you may already know and blending that together with your expertise in CSS.'
  merge: -1
