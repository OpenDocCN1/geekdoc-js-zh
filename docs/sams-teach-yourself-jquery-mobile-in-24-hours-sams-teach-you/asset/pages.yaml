  md: '# Summary


    In this hour you learned how to embed video code from YouTube and Vimeo and add
    them to your mobile site. You can also use plug-ins such as fitVids.js to help
    the videos dynamically respond in size to the device viewing them.


    You also learned how to embed videos that are hosted on your own server using
    HTML5. You learned a little about how HTML5 video elements work, and that not
    all browsers support all video types. This was overcome by including source elements
    that contained attributes that the browser could use to find a supported video
    and code to play back the video.


    Finally, you learned that more sites are available that you can get started with
    using, sharing, and/or hosting video files. You were also given a list of enterprise
    sites that you could check into for content hosting and delivery.


    # Q&A


    +   Q. Do I need to sign up for an API key with YouTube to use embedded video?

    A. Not necessarily. Signing up for an API key allows you to build your own video
    playlist and controls, but if you are using the embedding code, then you do not
    need to get one.


    +   Q. When using a Content Delivery Network, do I need to use any special links
    to my video?

    A. It completely depends on your provider. Most Content Delivery Networks that
    I have used have set up one base URL to use for your content and then they handle
    the transmission of the media back. This is a question that your provider should
    be able to answer.


    +   Q. How much should I be worried about bandwidth when I use embedded videos?

    A. When you use YouTube or Vimeo, the bandwidth is all handled on their end. If
    you are worried about the user experience, make sure you are embedding the non-HD
    version of the video. Doing so allows a faster download of the video to the mobile
    device and ensures a smoother playback experience.


    # Workshop


    The workshop contains a quiz and some exercises to help you check your comprehension
    and understanding.


    # Quiz


    +   1. True or False: All mobile devices are capable of video playback.

    2. True or False: When self-hosting a video you only need to worry about using
    an mp4 file.'
