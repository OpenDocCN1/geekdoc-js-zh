  md: '# CHAPTER 7 CONTENT


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_179_0.png)


    # 61. Will You Effectively Use Images in Your Content?


    Using images within your content can be a powerful way of capturing visitors''
    attention and communicating your message. Images have been shown to draw people
    out of the typical "F" pattern of scanning a page (across the top and down the
    left side), so if they''re not used effectively, they can be powerful distractions.
    The following sections give you some ideas for effective use of images in your
    content.


    # Stay on Topic


    Photos or graphics need to support the main face of the content, for example,
    having a photo of a product, the location being discussed, or the event you''re
    reporting on. No matter how great an image might be, if it doesn''t help your
    visitors understand what you are saying on the page, it is diverting their attention
    (in fact, the nicer the image, the greater the distraction).


    A popular use of images is to show something symbolic, such as a photo of a security
    guard in an article about laptop security. However, make sure the symbolism is
    clear so the reader isn''t spending time to connect it to the content, as in the
    example of Figure 7-5.


    If you''re not whether an image is appropriate, ask other people if it makes sense
    to.


    +   Finding the right image can be time-consuming, you''ll find some resources
    for locating affordable or free images in the section for this chapter in Appendix
    A.


    +   Be sure you have the right to use the images. Even if you''ve used an image,
    you need to read the details of the content to be it used on a website. For photos
    you take make sure you have the permission of the people in the photo.


