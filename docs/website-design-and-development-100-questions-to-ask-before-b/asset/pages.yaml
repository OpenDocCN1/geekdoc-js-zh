  md: '# 8. How Reliable Is the Web Hosting Provider?


    A great website is useless if no one can get to it, so the reliability of your
    web hosting provider is vital. Having said that, you to understand absolutely
    no provider can promise that your site will be available 24 hours per day, 365
    days per year. There is no such thing as 100 percent uptime.


    It''s just a fact of operating web servers that need to be maintained, and some
    might require going offline (downtime). Of course, providers need to keep this
    planned downtime to a minimum, and they try to schedule it for overnight or during
    low-traffic times. What you want to know is that the web hosting provider is working
    to minimize unplanned downtime as well as drastic slowdowns in the loading of
    your site.


    These accidental outages or drops in speed are these: How will they happen at
    some point, so the real questions are: Frequently how long do outages last, and
    when do they happen?


    If your site is down for a couple of minutes, two or three times a year, even
    if it''s during prime traffic periods, that probably won''t affect you. However,
    if the site is unavailable for 10 minutes a week during peak visiting hours or
    very slow to load for a few hours each week in the same time frame, you''ll develop
    a bad reputation, not to mention lose revenue.


    Are uptime guarantees of any value? Check the print to understand what kind or
    amount of downtime quantifies for the guarantee—most don''t include planned downtime.
    Then there''s the question of compensation if the guarantee is broken. If you''re
    paying $9.95 per month for hosting, with a free month of service make up your
    loss?


    All things being equal, if one host has an uptime guarantee and the other doesn''t,
    you might as well have the guarantee to give you at least something to point at
    during a dispute.


    > It''s common for web hosting providers to tout the fact that they have a 99.9%
    uptime record. Even with impressive number, if you apply the percentages to a
    single month, that''s still 43 minutes of downtime. And this figure doesn''t include
    planned downtime.


    > If you''re particularly concerned with reliability, there are monitoring services
    that will give you uptime reports on your site. Consider using one of them for
    the first month or two that you are with a provider to give you a more accurate
    picture of reliability. Search for monitoring or see the resource appendix for
    this chapter.'
  merge: -1
