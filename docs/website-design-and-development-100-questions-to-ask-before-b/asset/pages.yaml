  md: '# 3. HOW MUCH SHOULD YOU PAY FOR A DOMAIN?


    You can also get an existing domain name by agreeing to pay the current registrant
    to transfer the registration to you. Many registrars offer domain name brokering
    services to facilitate these kinds of transactions, or some will run domain name
    auctions. The cost of registering a domain name is completely a matter of what
    you''re willing to pay the current registrant—it can be a couple of hundred dollars
    or a couple of thousands (or more). Figure 1-3 shows example of domains-for-sale


    Sometimes you''ll see offers of a free domain, but remember that you''re paying
    for the domain somehow—usually by committing to a contract for a period of time.
    Always read the fine print to understand the terms. For example, the domain might
    be free for only one year of registration, or you have to pay a high yearly rate
    for the domain name if you stop hosting with the registrar. The same can be true
    even for low-priced domains, so check to see what''s involved with any special
    deal.


    | | | | |

    |---|---|---|--|

    | Fitnesslet.net | Health | $380 | Add to Cart |

    | FitnessWork.net | Health | $6880 | Add to Cart |

    | FitnessWay.com | Health | $5,880 | Add to Cart |

    | FitnessRunning.com | Health | $3,180 | Add to Cart |

    | FitnessPoint.com | Health | $1,895 | Add to Cart |

    | FitnessPosition.com | Health | $1,595 | Add to Cart |

    | FitnessQuality.com | Health | $3,990 | Add to Cart |

    | FitnessPoints.com | Health | $892 | Add to Cart |

    | Fitnesscall.com | Health | $1,480 | Add to Cart |

    | FitnessFirst.net | Health | $1,580 | Add to Cart |


    FIGURE 1-3


    These are some of the reasons why it''s impossible to say what you should pay
    for any particular domain name, but here are a couple of rules of thumb to follow:


    > Rule of Thumb Do not pay more than $12 per year for a new .com domain (subject
    to fee changes from ICANN, the governing body).


    You can get .com names for less, but usually because you have to buy some other
    product or buy in bulk or transfer from another registrar, so so on. The point
    is, you don''t pay more than $12 to get a .com with no strings attached from good
    quality registrars.


    > Rule of Thumb Expect to pay more for specialty TLDs such as .tv, .co, .pro.


    On Video Watch the video on DVD showing an example of a registration scam letter
    and what it says in the fine print.'
