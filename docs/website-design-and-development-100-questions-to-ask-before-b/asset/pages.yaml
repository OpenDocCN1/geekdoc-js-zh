  md: '# 60. HOW EFFECTIVELY WILL YOUR CONTENT USE LINKS?


    might miss something unless you draw their attention to it, and internal linking
    is ideal for that.


    Just as links to other pages on your site are helpful within content, so are links
    to other content on the same page. On-page links, as they are known, are commonly
    used for menu bars on pages, but you can also use them with the text. This breaks
    with the usual understanding of linear reading—following one paragraph to the
    next—but linking is meant to support a nonlinear approach to reading. The back
    bounce will always return the reader to where they were.


    Be sure to use the full URL http://mydomain.com/thispage.html when linking to
    pages on your own site, and consistently use the URL on all links to a page.


    > Rule of Thumb Don''t use words like "click here" on or to create text links.
    Include words descriptive of the link subject.


    The text you use for linking (known as the anchor text) should be specially written
    for your purpose. You need the text to adequately describe what visitors will
    find when they click it, and the best use the most important keyword(s) at the
    beginning. For example, if your anchor text is "this article in Scientific American"
    it would be better written as "the article on increased longevity in Scientific
    American."


    # Related Questions


    +   * 42. How user-friendly will your links be? Page 109

    * 89. Will links to and from other sites be engine-friendly? Page 257

    * 94. Will you be regularly checking your site''s functionality? Page 277


