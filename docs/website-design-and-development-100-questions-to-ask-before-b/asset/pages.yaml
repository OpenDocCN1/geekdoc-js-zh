  md: '# 94. Will You Be Regularly Checking Your Site''s Functionality?


    Websites are becoming increasingly complex, which means you need to regularly
    ensure that your site is working properly. You might hear about problems from
    visitors, but most will just go to another site. If you consistently monitor your
    site, you can catch these issues before they turn away visitors.


    The trouble is that site owners typically don''t visit their own sites on a regular
    basis, so even obvious problems such missing images or videos go unnoticed. They
    treat sites like printed matter—they''ll always look the way they did when first
    published. But even a basic web page with unchanging content relies on several
    systems to keep it functioning—servers, software, code such as JavaScript, and
    content management software—and they can change or break.


    > Rule of Thumb Go through every page of your website once a month.


    A regular inspection means more than glancing through your site. Here are some
    examples of what needs to be checked:


    +   Images—Visually check for broken images—re-upload if necessary or correct
    the HTML if the image has been moved.

    Links—Use a link validator to catch broken links (see Appendix A).

    Forms—Test that they say and that they arrive at the e-address. Deliberately make
    errors to test the form-validation process. Do the same for third-party forms
    such as mailing list signups.

    Photo galleries—Test that they are working and images are displaying correctly.

    Third-party widgets—Check that feeds from social media or dedicated content are
    still working.

    Video—Check that videos embedded from sharing sites are still working (owners
    might have removed the video or blocked embedding).

    Shopping—Check that Buy Now buttons or shopping carts are working.


    > Use a spreadsheet to create a checklist of all the elements of your site that
    needs to be tested, including the URL they''re located. This will make it easier
    for you, if plus you need someone else to do it, everything''s laid out clearly.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# CHAPTER 10 HOUSEKEEPING AND SECURITY


    Changes in software are another cause of website problems. Whether it is database
    software (such as MySQL), scripting languages (such as PHP) or even the software
    running your server (such as Apache), they''re all constantly being improved for
    features and security. Programmers work hard to take these changes into account,
    but the interactions are complex, and things get missed.


    Your best protection is to follow the update instructions for any software you''re
    using, such as a CMS, a shopping cart, or JavaScript features as slideshows. It''s
    also important to subscribe to the notification list of your hosting company.
    These notices will advise of upcoming changes, or known conflicts that have been
    reported. If updating your site''s software or upgrading to a new version of database
    doesn''t help, you''ll probably need to hire your hosting company or a developer
    to sort things out.


    Because web browsers can display a website differently, it''s important to check
    your site''s functionality when a major change is introduced for a popular browser—the
    introduction of Internet Explorer 9, for example.


    The ultimate functionality of a site, is, whether it''s running or not, and regular
    checks won''t help. The simplest answer is to establish a routine of looking at
    your site at least once a day. It''s important that you know at moment whatever
    the site is running, consider a site-monitoring service. You can find free and
    paid services with the search term site monitoring tools.


    # Related Questions


    +   31. Will your site design well in different browsers? Page 76

    43. Will your site have special requirements for certain features to work? Page
    111

    100. How will you protect your site from attacks? Page 295


    # Action Items


    +   - If you use a CMS, check to see whether there''s an updated version available.

    - Go through each page of your site and use a spreadsheet to list the technical
    functions that need checking. Put the URL of the page on the list so someone can
    go into a specific page easily.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# 95. Do You Have a Plan for Updating Site Content?


    Regularly updating the content on your site is vital to developing a relationship
    with visitors and attracting the search engines. Typically, owners put in a lot
    of time and energy for the first few weeks after the site is launched, and then
    activity trails off and the site remains static, sometimes for years.


    Establishing a routine is the best way to approach content updates, but it''s
    very important to be realistic about your routine. How much time will you truly
    have? How much material will you be able to come up with? Start slowly—it''s always
    better to be increasing content updates than to have them drop off.


    There are three main types of content updating for sites, and each requires its
    own routine:


    +   - Fresh blogging-style content

    - New pages with content

    - Adding to or changing existing content


    If you can establish an overall routine with a mix of these, you''re well on your
    way to have an active site. And an active site is healthy.


    # Fresh Blogging Content


    In the chapter on content, I distinguished between having a blog and the act of
    blogging. Blogging content is anything short and usually fairly timely. Here are
    some examples:


    +   - Company news—staff changes, new equipment

    - Sector news—anything from the sector you serve that has an impact on you or
    your visitors

    - Testimonials or reviews

    - Personal observations

    - Quotations

    - Tip of the day/week


    > If you have friends or staff who can help with adding content, all the better.
    But again, start slowly and see how the plan works. Circumstances change and you
    don''t want to be left trying to maintain a routine of 30 updates per week.


    > Real simple syndication (RSS) feeds from other sites (short snippets of frequently
    updated information that appear on your site) are sometimes hailed a way to easily
    fill your site with fresh content. Although these feeds can be useful to your
    visitors, they aren''t a substitute for creating your own content'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# CHAPTER 10 HOUSEKEEPING SECURITY


    For short, time-sensitive material, consider setting up your mobile device to
    allow posting entries to your CMS. You can also set up a folder for your mobile
    device''s recording function, so you can make notes quickly and write the piece
    later in the day or week.


    Setting aside a couple of hours each week is a good routine for this type of content.
    It''s frequent enough that it keeps you from building up so much material that
    it becomes onerous. And because most CMS allow you to schedule material, you can
    do the writing all at once and then publish pieces over the seven days.


    How much you depend on your writing ability, but if you aim for two or three pieces
    per week, that''s a good amount to keep visitors coming back and for search engines
    to know you''re active.


    Make sure your CMS allows you to input these items as individual pieces of content,
    not just adding them to the same page. The individual items might appear in headline
    form on a single page (as a blog), but it''s important for search engines, and
    also for organizing your content in the future, each entry be separate.


    Keep your eyes open for videos other people have done or ones you can do yourself—this
    kind of content is particularly popular. With images—always ask if there''s an
    image to go with what you''ve written.


    # New Pages


    Always be on the lookout to add new pages to your site. Some will be obvious,
    such as the addition of a new staff member or expansion into a new area of business.
    But don''t miss other opportunities.


    For instance, if you noticed interest in an aspect of family counseling that''s
    just part of your family counseling, create a page focused primarily on that aspect.
    Or if there is a hot trend in fashion, you can pull together a page that talks
    about the trend while providing images and links to all your related products.


    Be on the lookout for new pages that can feed one of your key pages. In the chapter
    on search engines I talked about keyword-focused pages that have several related
    pages linking to it: the knitting page that has links from a knitting needle,
    a knitting pattern page, and knitting classes page. By brainstorming ways to links
    to the knitting page, you might think of doing a series of knitting videos, each
    with its own page linking to central page.


    Always check your statistics to see pages or areas of your site are most popular.
    Is there new material you can add with the same topic?


    Be sure to highlight new pages for a time on your home page.


    Although new pages are great, make sure they''re justified. Don''t create a new
    page if it essentially repeats what on another page or if you can update an existing
    page to warrant an addition, and is it separate enough in some way from the existing
    content?'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Update Existing Content


    Making revisions to or adding new material to an existing page is often overlooked
    part of content management plan. Make it part of your routine to look through
    your site every couple of weeks or so if anything new can be added.


    Be careful not to change the primary topic of a page when you''re adding new material.
    You''ve hopefully optimized the page for search engines based on being a particular
    way. Adding too much content (or with the wrong sort) can change that focus in
    the eyes of the search engine (and probably for your visitors, too).


    It might be that the content has changed significantly that you need to reoptimize
    the page, but that will be a fair bit of work. Always see if you can add the material
    with different wording perhaps or maybe it''s worth filling out the new content
    and creating a new page.


    # On Video


    See examples of blogging content and demonstrations of the scheduling function
    in a CMS.


    If you''re adding a note to part of your content, it can be useful highlight the
    new material with an update notice and the date. If you''re changing large portions
    of the text, put an update notice at the very beginning of the content.


    # Related Questions


    +   - 48. Will your site be built with a content management system (CMS)? Page
    124

    - 64. What content will be on your home page? Page 170

    - 66. Will you be blogging on your site? Page 183

    - 96. Will you routinely check your contact information? Page 282


    # Action Items


    +   - Make a list of content that you will need or likely will need updating—separate
    them weekly, monthly, and annual categories.

    - Think about what a realistic updating schedule might be. Try it for one month
    and then reevaluate.'
