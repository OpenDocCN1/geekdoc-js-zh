  md: 'One-button control panel backup—Some hosting control panels have a one-click
    backup of your database, and you simply choose to save the copy in your backup
    folder.


    Manual database backup—Most hosting control panels have an interface for working
    with databases (phpMyAdmin is the most common for Linux servers), and this interface
    will have a backup or export tool. Usually there is a default setting for these
    tools, but your hosting provider should have tutorials to walk you through the
    particular steps. You need to be careful working with a database manager or you
