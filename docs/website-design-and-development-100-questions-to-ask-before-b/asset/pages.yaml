  md: '# 33. WILL THE DESIGN OF YOUR SITE NAVIGATION COMPLEMENT OR CLUTTER YOUR SITE?


    Menus that use Flash often become small works of art rather than a help to the
    visitor, and that''s a distraction. Movement is not a problem in and of itself,
    but when there''s too much of it or the effect is really stunning, it''s easy
    for the visitor to be drawn to the bright shiny object instead of getting around
    the site.


    From a layout standpoint, you should put the main navigation above or below the
    logo? One common structure is to have the main menu below the logo and a secondary
    main menu above and to the right. The two approaches are shown in Figure 4-29.


    Many times on a Flash-based menu there''s a sound accompanying the mouseover of
    a button. This is a good example of a design element that seems when you''re building
    the site, but becomes annoying to visitors who do a lot more mousing over than
    your one-time demo by the designer.


