  md: '# 97. Will You Have Content You Can''t Afford to Have Stolen?


    How do you prevent people from stealing your website content and passing it off
    as their own? The fact is, you can''t. Anything you put on a website can be saved
    by visitors—text, images, documents, videos—and that''s a good thing for the most
    part. Problems arise when people use content without giving credit or steal to
    make money.


    All you can do by way of prevention is clearly label your content as copywritten
    and provide guidelines for how people might use your content. After that, it''s
    a matter of monitoring the Web for improper use of content.


    > Rule of Thumb: Don''t put anything on a website that you''re worried about other
    people stealing.


    This answer is not meant to scare you—the amount of theft from the average website
    is negligible—but simply to make you. If you know the risks are, you can make
    an informed decision.


    The simplest step is to have a copyright notice on all your material. If you live
    in a country that party to a copyright agreement known as the Berne Convention—such
    as the United States, the United Kingdom, or Canada—you don''t technically need
    to put up this notice. According to agreement, simply publishing a work (in the
    wide sense of something public) gives it copyright status.


    The purpose of putting a notice on your site is to remind people of this fact,
    and in some countries it can strengthen your work because you make potential thieves
    aware that they shouldn''t copy your work.


    The best way to format a basic copyright notice is like this: Copyright 2010 George
    Plumley or 2010 George Plumley


    On websites, this notice typically is displayed in the footer and covers the site
    as a whole. If you want to draw attention to a copyright on a particular piece
    of content, you might want to put it at the end of the article or near the top.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_303_0.png)'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'Beyond these basics, a copyright notice might include wording to tell visitors
    under what circumstances they can use your material. For example, you might say
    that material can be used without permission for noncommercial sites as credit
    is given and a link is provided back to the original page. Or you might want to
    specify that only excerpts might be used, or images can''t be used by text.


    If you''re not sure how to specify terms of usage—the circumstances under which
    people are allowed to make use of your material—you might consider a Creative
    Commons license. This organization—not part of any government agency—provides
    creators of works with standardized terms of usage in the form of free licenses
    with varying levels of restriction.


    You might want to take copyright protection a step further and officially register
    your website with your country''s copyright agency. For websites, the process
    typically involves sending copies of site files along with a registration fee.


    Copyright law is complex and varies between countries. Nothing is intended as
    legal advice and you should research the issue using the search phrase copyright
    law [name of country].


    If you use a Creative Commons license, keep in mind that once you place it on
    your site or a particular piece of content, it is irrevocable. You can stop using
    the license, but anyone who made use of your material while the license was in
    place can continue to do so.


    # Tracking Down Thieves


    Fortunately, the same openness makes it easy to steal from websites also makes
    it fairly to know if something has been stolen and used online.


    Search engines are one of the best tools for checking to see if anyone is stealing
    your content and using it online—enter a long, unique phrase in quotation marks.
    Tools such as Google Alerts will notify you if particular phrases show up and
    give you the relevant link. Search engines also help the cause by blacklisting
    sites that take content without citing the source or linking back to the original
    site.


    There are free online services that can streamline the search process for you—use
    the term plagiarism checker. Then, there are paid services, such as Copyscape,
    which will monitor the Web for you and produce reports on what they think are
    legitimate and illegitimate usage.'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'Of course, online searches don''t address offline use of content. In the case
    of text, your best hope is that plagiarism is caught by editors during the publishing
    process.


    In the case of images, there are at least two simple ways to minimize illegal
    use offline:


    +   - Make images as low in quality and physical size as possible while keeping
    them visually attractive (this will also make pages load faster).


    +   - Put a watermark (a digital image) enough of the image to make it unusable,
    while still looking good.


    # Passworded Content


    Passworded content does not mean securing content. If your site allows anyone
    to sign up as a member, password certainly cannot prevent theft. Even when you
    give passwords out to selected people, a determined hacker will try various methods,
    such as stealing passwords or using brute force (trying combinations).


    Sometimes the best content on a site is hidden behind passwords, which means search
    engines won''t be able to index. The desire for higher search engine rankings
    sometimes gets the better of people and they hire a programmer to allow search
    engines to index, but not allow anyone else without a password. Trouble is, search
    engines (keep copies of) pages and password-protected content is suddenly accessible
    through a search (there are ways to stop the caching).


    Again it comes down to this: Either the material you want for the public, or it''s
    too sensitive and should either be inside an intranet or private network, or it
    shouldn''t be online at all.


    # Protecting E-Mail Addresses


    Spammers have robots that do nothing but scour the Web to find e-mail addresses
    on websites and add them to lists that are sold to marketers. The simplest way
    to beat these robots is to use well-written forms instead of putting e-mail addresses
    on your site.


    Prevent people from grabbing images for online use is virtually impossible. Tricks
    like disabling right mouse or laying a transparent-parent image over the real
    image doesn''t help in the end because it''s still easy to find the URL for the
    image. Putting images in Flash galleries or chopping them into pieces as whole
    might be a bit more effective, but remember that anyone can take a screenshot
    of your page.


    Forms are also helpful for cases in which the visitor doesn''t have access to
    an e-mail program.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Rule of Thumb


    Avoid putting e-mail addresses on your website. Use forms instead.


    You hear about tricks to hide addresses from the spammers—such as writing an address
    name[atmydomain.com—but these either don''t work (robots just look for [at] instead
    of), or they can make life difficult for the user (making e-mail addresses as
    images).


    With a form, the e-mail address to which it is sent never shown in the browser
    or in the HTML source code. Most web hosts offer to use and effective e-mail form
    software, and contact forms are built-in to most CMSs. You can keep an e-mail
    form very simple so that users have pretty much the same experience as using their
    e-mail program.


    # On Video


    See how to search for possible plagiarism. See how easily the URL for an image
    can be found, even from a JavaScript.


    # Related Questions


    +   * 39. Will your forms be easy to use? Page 101

    * 77. Do you have content you can offer to other sites? Page 216


    # Action Items


    +   * Decide how and where you want your copyright notice to appear. Use only
    a name that''s legally entitled to hold a copyright—either an individual or a
    registered company/organization.

    * Double-check that images have been sufficiently reduced in size for the Web.'
  merge: -1
