- img_proc: true
  md: '# 98. Will Your Site Administration Be Securely Accessed?


    In the age of CMSs and hosting control panels, the administration of your site
    can be conducted from anywhere in the world, issues of secure access are greatly
    magnified. Safely accessing sites is not complicated, but forming the necessary
    habits takes effort.


    First and foremost, you need a secure username and password for any interface
    that provides access to your site or the tools necessary to run the site. These
    include the following:


    +   - Domain name manager


    +   - Hosting control panel


    +   - FTP access


    +   - CMS


    +   - E-mail accounts


    Even if you have an extremely secure password—like, hk3#Nqe5W%—do not use the
    same one for all these systems.


    One of the problems with usernames is often that you don''t get to choose what
    they''ll be. Hosting companies, for example, often assign a username that''s either
    the same as the domain or shortened version of it. All the more reason to make
    sure you have a good password.


    If you''re able to choose your username, make it a combination of letters and
    numbers, and at least seven characters long. Although a memorable name is okay,
    try to make it very unrelated to the domain name or any obvious personal information
    (such as your middle name or the city you live in). The numbers can also be memorable,
    but don''t use personal numbers such as your birthday.


    Armed with a secure username and password, the challenge is to make it difficult
    for people to steal them. This includes the obvious points such as not keeping
    them on your hard drive in a text file or writing them on a sticky note pasted
    to the wall. Less obvious but equally dangerous are the ways people use computers
    and access sensitive material over the Internet.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_307_0.png)


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_307_1.png)'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Home and Office Security


    Unless you disconnect your modem at night or unplug your computer from a network
    when not in use, your machine is a potential target 24 hours a day. If hackers
    get into your computer, they can either look for passwords in files or set up
    monitoring tools that capture your keystrokes as you enter usernames and passwords
    (including when you change passwords to try and be more secure).


    The most important step you can take to secure your computer(s) is to have a router
    or some other type of physical firewall between your modem and your computer/network.
    What these hardware firewalls do essentially prevent the rest of the Internet
    with a fake computer. Instead of deconfuse your machine, intruders make it as
    far as the firewall.


    Don''t confuse this with a software firewall, which tries to do-similar but from
    inside your computer. This is a physical box that would look the same to hackers
    whether you have any computers hooked up at the other end or not.


    Of course, this hardware firewall isn''t help much in your immediate vicinity
    if you use your wireless network unguarded. Especially in larger cities, there
    could be hundreds of people close to get into your network if you let them, and
    once on the person potentially has access to your computer. To implement wi-fi
    security through your router, as shown in Figure 10-4.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_308_0.png)


    FIGURE 10-4'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# CHAPTER 10 HOUSEKEEPING AND SECURITY


    Wi-fi Protected Access (WPA) is the minimum level of security you should use.
    You''ll see a setting on your router called WEP or Wired Equivalent Privacy, it''s
    less secure—among other things, it allows secret keys to be reused plus it has
    a smaller number of possible keys.


    A hardware firewall and secure wi-fi are your best defenses against someone getting
    into your computer directly and stealing passwords or monitoring your web activities.
    The rest is up to you: You need to decide if you''re going to let in harmful programs
    that can do similar damage by downloading everything and off the Web or clicking
    on links that ask you for sensitive information. No firewall will protect you
    from the methods of spreading viruses and programs that can steal your passwords.


    Aside from your common sense, you would do well to regulate your computer with
    antivirus programs to catch any malware in it.


    Everything so far applies to a small office environment, but the big difference
    is that you have several people all on the same network, using less common sense
    than others. Truth is, some people like to click "you''re the millis visitor"
    or give out bank information whenever they are asked for it—despite knowing the
    dangers. Others to leave passwords lying around. You just need to be more vigilant
    in an office.


    # Accessing Your Site on the Road


    One of the advantages of web-based CMSs is that you can access them from any browser
    anywhere in the world. However, there are steps you should take to protect yourself
    from how your passwords can''t be stolen:


    +   Make sure you''re joining a legitimate open wi-fi network. The idea of these
    networks is that anyone can join—there''s no password (just as if you didn''t
    use any security on your home wi-fi). These open wi-spots are common now in airports
    and other public areas. However, hackers can easily set up fake networks that
    show on your list of available networks. Double-check that you have the correct
    name of the legitimate network.


    +   Whether it''s an open or secure network, remember that it''s a network. Other
    people on the network could potentially get into your machine, use internal firewalls,
    turn off file sharing, and use only login pages that are secure (they''ll have
    https in the URL).'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'If you absolutely must use a public machine or someone else’s machine, make
    sure you erase your session. To learn how, and for more suggestions, use this
    phrase: tips for using public computers.


    If you leave your machine, even for a few moments, put it into password-protected
    mode.


    Do not stay logged on to an administrative area while surfing the net. Log off
    and log in again when you need to.


    # Related Questions


    +   5. Who will register your domain and in whose name? Page 11

    15. Do you have a strong hosting username and password? Page 35

    19. Can you access your domain e-mail through a web browser? Page 48


    # Action Items


    +   Check to make sure you have a router between your modem and your computer/network.
    Some routers and modems are combined into a single unit—check with your ISP.

    Put travel security tips on an index card that you can keep in your computer case
    so they’re always available on the road.'
