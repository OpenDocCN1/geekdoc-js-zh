  md: '# 89. Will Your Links to and from Other Sites Search Engine-Friendly?


    If optimized content is the most important factor for search engine ranking, links
    to and from other sites must come a second. Some argue that they are even more
    important than content. It really depends on the search engine—some quite little
    weight on one or the other. The bottom line is this: Pay as much attention to
    links as you do to optimizing content and you cannot go wrong.


    When it comes to links, search engines place the weight on which sites are linking
    to yours. These are known as inbound links and they''re an indicator of your site''s
    relevance and importance. Search engines also take into account of which sites
    you link to your content, In each case, the better the link, the more counts in
    your favor.


    # Inbound Links


    Having other sites linking to yours is very important to search engines, but unfortunately
    it''s not just a high school popularity contest. Large numbers of inbound links
    won''t necessarily win you a lot of points in the eyes of search engines—it''s
    the quality of the links that matters, and quality is based on several factors.


    # RELEVANCE


    Suppose you get 50 friends to link their site to your bake shop site. It sounds
    like a good idea, but unless their site is related to baking, a simple link won''t
    do much good. If they have a review of your bake shop that includes a link, it
    might be somewhat useful, although a review on a car repair site will carry less
    weight than a blog about family outings. Sites that would make a bigger impact
    with a link would be restaurant review sites or shopping sites or directory sites.


    Importance


    > Use one of the free online link analyzers, such as Yahoo! Explorer, to find
    out who''s linking to the sites of highly ranked competitors. This can provide
    you with leads or at least ideas for getting your own inbound links. See Question76
    for more details.


    > It is possible to search engines not to follow any links on a page (with the
    robots meta tag) or just a particular link <a rel="nofollow" href="... If the
    site linking to you has a nofollow directive for your link, you won''t receive
    any search ranking benefit from that site—cause the search engine to your site.


    > Has this been made of avoiding "nofollow" sites (sites that block search engines
    from indexing sites they know) looking for inbound links, but remember that getting
    traffic to your site is the goal, and if a nofollow site has good potential for
    sending you, the link is still worthwhile.'
