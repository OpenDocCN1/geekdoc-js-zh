  md: '# CHAPTER 5 USER EXPERIENCE


    If some of your content is hidden from unregistered visitors, make sure you clearly
    label it as such and provide an obvious link to the registration/sign-page.


    JavaScript is turned off. What will happen to your fancy site introduction in
    Flash if someone doesn''t have Flash or has disabled it?


    Having a link so the visitor can download the necessary plug-in is one part of
    an alternative, but if the information is vital, you should offer it in a different
    format, or if it just outlines the basics. For example, make the text from a Flash
    presentation available in HTML or provide a separate graph for a slideshow that
    requires JavaScript. People can then decide they want to see the full version
    by downloading the software or turning a plug-in back.


    Registration is another barrier you need to carefully consider before implementing
    your site. Every situation will be different, but unless you''re running an intranet,
    be sure to offer enough free material that visitors will still come to your site
    if they''re not registered. In other words, registration should always be an added
    value proposition. By signing up for a mailing list, paying a subscription fee,
    joining an organization, and so on, you''re given access to more information.


    Another barrier to consider is the documents you make available your site. Clearly
    state the file type of these documents visitors will know if they can even open
    them. If the file requires a program that some visitors might not have, consider
    putting it into a more universal format (PDF is always the best bet).


    Documents in Microsoft Word cannot be opened by everyone. They might be standard
    in the workplace, but not everywhere.


    See examples of offering limited information with the ability to sign up for premium
    service.


