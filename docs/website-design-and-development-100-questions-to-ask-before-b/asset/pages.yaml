  md: '# 38. Will Your Site Use Popups?


    Popups are any type of content that covers the current browser window or opens
    an additional small window based on a user action, such as mousing over a link
    or simply loading the page. There are three primary types of popups, which are
    not all different technically, but have very different looks and interactions.
    Figures 5-8, 5-9, and 5-10 show examples of each.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_117_0.png)


    FIGURE 5-8


    The first type of popup is a box that displays to the cursor when the user moves
    over or clicks. They are typically used to provide help to the visitor—instructions,
    word meanings, or even images—without navigating away from the page. However,
    in the case of popups with added content, ask yourself whether that content shouldn''t
    be in the body of the text.


    The second type of popup greys the current browser window and the new content
    is displayed in the center of the screen, as shown in Figure 5-9.


    Commonly used for photo galleries, this approach solves a lot of the problems
    with traditional browser popups. The user can see the browser window, but not
    access any of its content, so there'' no chance of accidentally clicking away
    from the popup and getting confused. The popup content does not look like a browser
    window, which further reduces friction. With clear controls, in particular an
    exit button, this type of popup is very user-friendly.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# 38. WILL YOUR SITE USE POPUPS?


