  md: '# 29. Will the Background of Your Site Help Focus the Content or Distract from
    It?


    If you use a fixed width design for your site, part of the browser window will
    display a background. The styling of this background can either help set off the
    rest of your design or really distract from it.


    You have two basic choices for the background of your site: a solid color or images,
    which can be used in several ways.


    When deciding on a solid color, it is simplest to consult your color scheme. Designers
    often choose a very light color or a light grey, which will set off any offset.
    Others use very dark colors or black as a background to offset the site, but particularly
    if you have a lot of background area, very dark colors can be overwhelming after
    a while because the contrast is so great.


    Backgrounds can also be created with images. Unless otherwise specified, backgrounds
    are automatically repeated over and over again by the browser. This effect, known
    as tiling, creates apparently backgrounds using tiny images. The background in
    Figure 4-14 consists of a single image (shown on the right) repeated over and
    over again.


    > If you go with the same background color as the background of the content areas,
    you''ll probably still want to frame the site in some way (a light line around
    the outside, for example).


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_89_0.png)


    FIGURE 4-14


    > If you have a back-ground color or image, make sure that you hide it when you''re
    formatting pages for printing.


    If you want to use a complex image or photo for your site background, think about
    the potential visual clutter it can create. If you do choose to go that route,
    at least have a solid background behind your content'
  merge: -1
