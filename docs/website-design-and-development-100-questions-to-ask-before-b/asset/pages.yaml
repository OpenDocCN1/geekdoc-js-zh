    of a server, once a week, but only the most recent copy is available. Though hosts
    often do their best to recover a particular site.


    > Rule of Thumb Backups are your responsibility, not that of your hosting provider.


    In the end, though, the responsibility for backups rests with the site owner,
    as shown in the sample hosting agreement in Figure 10-3. In other words, hosting
    companies are not legally responsible for getting your content back to where it
