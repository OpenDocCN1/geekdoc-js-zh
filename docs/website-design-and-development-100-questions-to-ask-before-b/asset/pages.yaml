  md: '# 65. What Basic Content Pages Will Be on Your Site?


    Exactly what you have on your website is a very individual matter, but there are
    certain pages that virtually every site can benefit from.


    # About Us


    An About page should offer a clear, succinct description of what you do, but it
    also needs to tell your story. Whether you''re an individual, a small business,
    a corporation, or an organization, visitors want to know not just what you do
    but also why you do what you do. It doesn''t have to be a story in the sense of
    being highly dramatic ("I got into the business after almost being killed in a
    free fall»), but in the sense of an insightful narrative. Figure 7-15 shows how
    a small- and medium-sized business handle their About pages:


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_193_0.png)


    FIGURE 7-15


    Even if the story of you does not directly relate to what your website is, it
    tells the visitor something. Often it''s the seemingly unrelated stories that
    are the most interesting: You studied before becoming a mechanic, or the company
    is managed entirely by people who come up through the ranks.


    Don''t make your About page a resume, unless somewhere on there you could link
    to a resume (as a document or a web page), and don''t turn it into a history lesson.


    Above all, the About page should not be a sales pitch. Give visitors insights
    into you or your organization. Although every page on your site should help build
    a relationship with the visitor, that''s the sole function of the About page.'
