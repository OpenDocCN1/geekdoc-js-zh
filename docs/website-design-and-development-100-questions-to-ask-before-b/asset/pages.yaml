  md: '# 22. Will the Design of Your Site Support Your Content or Distract from It?


    When visitors first open a web page, statistics show they decide whether to stay
    within the first 6 to 8 seconds. Given that short time, you can understand the
    importance of design. Two of its tasks are to convey the feel and purpose of the
    site and to focus your attention by drawing your eye to what''s important. If
    visitors get the wrong feel or focus on the wrong material, the greater the chance
    they''re going to hit the back button.


    Take a look at the sample home pages in Figure 4-1.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_71_0.png)


    FIGURE 4-1


    Because neither site has what can be called a beautiful design, some people think
    they are examples of what not to do. But if design is about clear communication,
    not creating works of art, these sites'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# 22. WILL THE DESIGN OF YOUR SITE SUPPORT YOUR CONTENT OR DISTRACT FROM IT?


    actually do a pretty job. In each case, you know immediately what business they''re
    in, where they''re located, and what general services they offer. It''s not that
    designs cannot be improved, but they give you good focus and don''t distract.


    When you''re finding examples of sites you like, don''t like them for their own
    sake. Look for designs that speak to your purpose and style. Imagine that the
    site you''re looking at is your own and ask how clearly it would communicate.


    From the moment you have samples of sites you like, you need to start yourself
    this question about every element of the design: Does it favor a visitor''s understanding
    or use of the content? This will give a good starting point when you''re talking
    to web designers, looking at potential templates, or sketching your own. And keep
    asking that question at every stage of your design development.


    Once visitors have taken the feel of the overall site, they will find what they''re
    looking for, and this is when the design must give focus to the important elements
