  md: '# CHAPTER 6 CONSTRUCTION


    # 47. Will Your Site Be Static or Dynamic?


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_141_0.png)


    If you look at the source code for any web page using your browser, you''ll see
    a complete HTML page. But whether that entire page is in a single file on your
    server or it''s in bits and pieces is the difference between static and dynamic
    websites.


    Building an HTML page, especially one with a simple design, is not huge task.
    It''s when you have more than a few of these static pages and you want to change
    something to them all. Search and replace does work to some extent, but then you
    have to upload every file you''ve changed. And the changes never end, so you''re
    constantly trying to keep up with all these files. Now imagine if you have 100
    or 1,000 pages. Static websites become a nightmare to keep running, is why people
    prefer to dynamic sites.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_141_1.png)


    The advantage of having your pages assembled out of bits and pieces is that you
    save a lot of repetition in the construction of any particular page. Take the
    case of the top region of your site, or the header area it is. In most cases,
    it will contain your logo and page navigation. It''s user-friendly to have the
    same header from page to page, so keep it in a single file that''s shared by every
    page.


    When it comes right down to it, even the content is a separate bit that should
    be stored on its own, so a "page" becomes more than an assembly tool, as you can
    see in this example from a Word-Press page template in Figure 6-1 (the actual
    assembly is what the content management system [CMS] does).


    The other advantage of dynamically-built sites is that they future-proof. If you
    change colors or want a new layout, you''d probably have to change one or two
    files. There''s nothing so constant as change, so why make it difficult to change
    your site.


    > Rule of Thumb Any website should be built dynamically, even if it consists of
    a single page.


    Dynamic construction is clearly the way to go. But how you construct a dynamic
    site is an important issue, particularly for making it easy to administer by anyone.
    That''s when you need to look into a CMS.'
  merge: -1
