  md: '# Introduction


    About a year ago, I was talking to the marketing manager of a large organization.
    He was very excited about a major redesign they had recently made to their website,
    but he had a question about updating some information at the bottom of each page
    on the site. I asked what content manager they were using. "Oh we got rid of that,"
    he said.


    I listened in horror as a web developer advised them to take all their content
    out of a database and create hundreds of individual HTML pages. According to the
    developer, search engines don''t like websites that are run by databases. Several
    thousands of dollars later, the marketing manager was asking me to change a phone
    number in all those pages. I will never forget the look on his face when I explained
    the search engine advice was nonsense and that changing the phone number with
    a content manager took two seconds.


    I''ve heard far too many stories like this in my years as a web developer—time
    and money wasted on doing things the wrong way or a less efficient way—when all
    it would have taken is for someone to ask the right questions at the right time.


    This book is for marketing manager and everyone else could use a coach to ask
    those questions at every stage of building a website.


    In the best-case scenario, reading this book will confirm that everything''s going
    well with your site. In the worst-case scenario, it might lead you to start again
    from scratch. Somewhere in it will help you save time and money, and create a
    better website.


    If you already have a website, use this book as a checklist. Again, it would be
    great to come away satisfied that the job had been done right the first time.
    But if there''s something that needs fixing, this book will help you identify
    it and provide some guidance on how to correct it.


    There''s more and more pressure these days to have a presence on the Web. If you''re
    feeling pressure but feel lost about what it takes to create a website, I hope
    this book will ease the pressure and give you confidence creating the best site
    possible.'
  merge: -1
  pgno: 14
