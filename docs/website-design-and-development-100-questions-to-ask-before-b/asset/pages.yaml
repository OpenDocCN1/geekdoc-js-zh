  md: '# 39. Will Your Forms Be Easy

    to Use?


    Forms are handy for visitors and for you, but they need to be

    clear and simple to use.


    Here are some design basics:


    +   * Keep the form as short as it can possibly be.

    * Leave adequate space between individual fields so the form

    does''t look crowded and intimidating.

    * Group related fields and visually separate the areas.

    * Clearly designate fields.


    You can also make forms easy by using drop-down menus for any-

    t that has fixed choices—date of birth, countries, states, and so

    on—rather than asking people to do it themselves. Where the

    information is unique but still structured—a postal code, for example—

    you can give an example of the format you want next to the box visitors

    fill in. See this at work in Figure 5-11.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_120_0.png)


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_120_1.png)


    Figure 5-11

    | | | | |

    | Arrival Date |

    | | MM DD YYYY |


    Provide a link next to the form field if you think visitors

    not understand what you''re asking for. A simple popup when they

    mouse over a question mark ? or some appropriate symbol is an elegant

    solution, as shown by the examples in Figure 5-12.'
  merge: -1
