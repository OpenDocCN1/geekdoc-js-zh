  md: '# 51. What Tools Will Be Needed for Building a Site or Its Content?


    If you''re not trying to design your own site or set up a CMS by yourself, the
    tools will be needed for creating some of the content on your site.


    The two basics for working with web content are:


    +   - A text editor

    - An image editor


    A text editor is very easy to learn, although image editors can have a learning
    curve depending on what it need you to do.


    Text editors are an absolute if you''ll be working in any way with HTML or CSS
    files. It''s what text editors don''t do that makes them so important: They don''t
    add nonstandard or hidden coding to the text word processing software. In Figure
    6-4, you can see what happens behind the scenes of a word document when you open
    it in a text editor.


    > You can find a list of common and image editors for Windows and Mac in Appendix
    A at the back of this book. The list includes freeware, shareware, and commercial
