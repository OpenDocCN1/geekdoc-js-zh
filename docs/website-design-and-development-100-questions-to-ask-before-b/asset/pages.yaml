  md: '# 96. WILL YOU ROUTINELY CHECK YOUR CONTACT INFORMATION?


    the system tries to e-mail it to a nonworking address, you might have to pay someone
    to go into your database and make the change manually.


    On website, up-to-date contact information is obviously important. You might notice
    incorrect information in the large address box at the top right of your website,
    but you need to think about the less obvious places, too:


    On larger sites, it can be helpful to have special codes for your company name
    and contact information. If you need to update it, you just change the code and
    all instances on the site are updated. Talk to your web developer about this is
    possible.


    +   - Have you mentioned a phone number or address within the body of text?


    +   - Do you have any old pages archived on your site with out-of-date contact
    information?


    +   - Check the scripts that run forms to make sure they''re resending to the
    correct address.


    +   - If you have multiple people working on the site, ask them to check their
    work—they''ll hopefully remember when they used the information.


    The larger and the older the site, the easier it is for incorrect information
    to be buried. Starting off your site with a routine to catch these changes is
    very important. You''ll save a lot of time and headaches down the road, not to
    ensuring the good of your visitors.


    # Related Questions


    +   - 5. Who will register your domain and in whose name? Page 11


    +   - 10. Does the web hosting provider have a good hosting control panel? Page
    23


    +   - 37. Will visitors easily know how to stay in touch with you? Page 95


    # Action Items


    +   - Keep a list of all pages or areas of the site that contain contact information.
    As your site grows, add to the list. When it comes for changes, you''ll be sure
    you''ve covered everything.


    +   - Gather all your contact information into a single document and print it
    out with the passwords. Then erase the passwords and save the file, keeping the
    printed copy in a safe place.'
