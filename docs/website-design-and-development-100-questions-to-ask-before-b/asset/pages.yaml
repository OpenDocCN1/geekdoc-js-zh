  md: '# CHAPTER 3 E-MAIL


    # 17. Does Your E-mail Address Use Your Domain Name?


    # Importance


    Just because you set up an e-mail account with your domain name, don''t get rid
    of the e-mail account with your ISP. If your website is for a business, you''ll
    want to keep the old e-mail as your personal address, for example.


    If you''re connected to the Web, you probably have an e-mail address that uses
    the name of your Internet service provider (ISP): myname@mysisp.com. When you
    register a domain name for your website, it means you can also set up e-mail addresses
    that use myname@mydomain.com.


    +   Rule of Thumb Set up at least one e-mail address using your domain name and
    use it for communication that involves your you


    Here are a few good reasons for having I''ll to refer to as domain e-mail:


    Avoid using common e-mail usernames as info@mydomain.com or sales@mydomain.com
    and so on, as spammers’d ’ automatically include these on their lists on the off
    chance they''ve set up.


    +   Domain e-mail promotes your website—If all people know about you your e-mail
    address (sarah@mydomain.com), they can find your website. If you continue to use
    the e-mail address you get from your ISP, you''re promoting the provider instead.


    +   Domain e-mail lends credibility—If you''re running a business and your e-mail
    address has the name of an ISP or a free e-mail service, it doesn''t look very
    professional. Either you''re not willing to put out the bit of money it costs
    to get a domain name, or you have a domain name and couldn''t be better off using
    an e-mail account using that name. None of those is an impression you want to
    leave with clients and customers.


    Remember that all e-mail you send from your computer is through your ISP. If you''re
    having trouble sending e-mail, call your ISP, not your host. If you have trouble
    receiving e-mail, talk to the company in charge of the account (your ISP for e-mail
    accounts using its domain name or your web hosting provider for domain e-mails).


    +   Domain e-mail never changes as you register that domain—If you just use an
    ISP''s e-mail address and then have to switch ISPs, the old address no longer
    works. Not only that, you can''t forward old e-mail to your new address. An e-mail
    from your domain will always be available as long as you keep domain registered.
    Even if you decide to change your e-mail from sarah.miller@mydomain.com to sarah@mydomain.com,
    you can forward the old e-mail to the new.'
