  md: '# 80. Is Affiliate Marketing Something You Could Use?


    Affiliate marketing is a method of driving traffic to your site by having other
    sites advertise your products in return for a percentage of sales made by visitors
    from their sites.


    One of the advantages of affiliate marketing is that the affiliates sometimes
    do more than display banners. They write reviews or link to your site from many
    different areas of their content. In that sense, affiliates are like salespeople
    rather than a medium in which you advertise. They’ll give personal testimonials
    or descriptions or relate your product to their audience, all of which can help
    increase the chance of a sale.


    To track sales for each affiliate, you need an affiliate manager system, of which
    there are two types, described in Table 8-4.


    **TABLE 8-4.** Affiliate Manager Systems


    | SYSTEM | PROS | CONS |

    |---|---|---|n| Self-hosted affiliate software | No monthly fees hosted as part
    of your website’s account (the software itself might cost money). Can be fully
    customized to your needs. | You’re responsible for all maintenance and software
    errors. No promotional help. |

    | Affiliate network | A quality service can give you credibility. Promotes your
    program to members of the network. Usually very user-friendly. Often has extensive
    reporting tools. No maintenance issues. Usually great support, training. | Typically
    a monthly fee based on a percentage of what your affiliates earn. Fairly heavy
    startup fees. |'
