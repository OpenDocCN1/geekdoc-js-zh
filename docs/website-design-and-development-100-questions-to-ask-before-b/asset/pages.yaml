  md: '# CHAPTER 7 CONTENT


    186


    TABLE 7-1: Shopping Cart Building Options (continued)


    | BUILDING OPTION | PROS | CONS |

    | --- | --- | --- |

    | Hosted full-feature shopping cart | Easy to set up. Little to no technical skills
    required. No software upgrades to deal with. All server tasks handled for you,
    including backups. Extensive shipping options. Numerous customer service options.
    | Monthly service fee (starting at $30, but more in the $75–120 range for the
    features most people would want) Limited customization options. Can''t take software
    with you, you can take only your data. |

    | Self-hosted-feature shopping cart | Extensive shipping options. Numerous customer
    service options. Ability to customize options or even new ones. Portability–move
    your store to whatever server you want. Lower monthly fees (just for hosting,
    $10–20). Many good open-source software packages. | You''re responsible for updating
    the software. Some technical skills are required for set up and any customization.
    Time or labor costs for setting up can be high.


    Online stores consist of two distinct connected parts: a catalog system and a
    shopping cart system. The entire system is usually referred to as shopping cart,
    but technically the shopping cart is what enables you to buy multiple items at
    one time. The catalog part of the system is used to manage and display the items
    for sale.


    If you''re selling a few products or services that won''t change and are usually
    purchased one at a time, the hosted shopping cart is perfect for you.


    For example, if you sell coaching sessions, all you would do is sign up for an
    account with a company such as PayPal, use a wizard to create a Buy Now button,
    and then paste the HTML for the page describing your coaching session. When clients
    click the button, they’re taken to the PayPal server where they pay for the item.
    All you pay is a transaction fee whenever someone buys something. Figure 7-21
    shows what things look like on your site and on PayPal.'
