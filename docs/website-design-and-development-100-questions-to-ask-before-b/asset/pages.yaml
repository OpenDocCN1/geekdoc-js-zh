  md: '# 28. HOW WILL YOUR SITE DESIGN USE COLOR?


    This is not the place to go into color theory, but you can quickly see how these
    schemes work by using one of the many great online color pickers: search for the
    color chooser.


    Making sure that color variations and additional colors go with your base is very
    important because it keeps your design professional, easy on the eye, and more
    focused. A hot pink button will jump out if the rest of the site has a green color
    scheme. But if you want the button to stand out, hot pink is not particularly
    the best way to go about it. A contrasting color goes with your color scheme.
    There''s a difference between standing out and being jarring.


    Don''t forget about contrast when placing one color next to or on top of another,
    with text. If there isnt enough contrast, the two colors will blend into one another.
    This is particularly important with body text if you want a colored background.
    Too low a contrast will make the text difficult to read and equally hard to print.


    > On Video

    Watch how colorsedesigner.com and other tools can help you find the right colorors.
    Also see how color contrast can affect the readability of text


    > In your design program, try to turn off color to spot contrast problems. As
    you''re testing your site online, there are tools for catching contrast. Search
    for color checker.


    # Related Questions


    +   29. Will the background of your site help focus the content or distract from
    it? Page 70

    33. Will the design of your site navigation complement or clutter your site? Page
    82

    42. How user-friendly will your links be? Page 109


    # Action Items


    +   Make a note of the colors used by your competitors (both online and off).
    Is there a common color?

    Try the same design with two or three base colors and test a mockup on several
    people of different genders, ages, and so on to see how they feel when they first
    look at it.'
  merge: -1
