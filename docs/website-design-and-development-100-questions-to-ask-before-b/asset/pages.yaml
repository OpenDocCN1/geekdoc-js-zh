  md: '# 59. Will Your Written Content Be Correct, Clear, and Well Structured?


    Apart from the actual content of your site—what you have to offer—the answers
    to this question can be the make-or-break point of building your website. If you
    had the most compelling content in the world, you could go without graphics, you
    could survive with poor typography, you might do without coherent navigation,
    but, in the end, visitors have trouble understanding or following the content,
    you''re lost.


    The suggestions cannot make up for disorganized thinking or basic writing skills,
    they''re part of the next step after having clear thoughts and at least decent
    writing skills. I''ve divided the suggestions into three parts.


    # Being Correct


    Mistakes in your content make you look sloppy, incompetent, or ignorant, which
    are qualities you never want to convey.


    The most common kind of mistake, is the spelling error. First of all, they''re
    easy for visitors to spot. Second, in this day and age of spell-checking, it''s
    hard for visitors to imagine how you didn''t spot the error too. All they assume
    that you don''t pay attention to details and haven''t taken the trouble to read
    your material.


    Although grammar mistakes might be less noticeable, if they''re frequent and bad,
    don''t just give a bad impression but can also interfere with visitors understanding
    what you''re saying. Constant bad grammar can also cause people to stop reading
    because they have to work so hard.


    Getting facts right is important for the value of your content and for your credibility.
    If you''re making a claim based on something you heard second-hand, be to check
    it out. Also, the ease of verifying information in the age of the Internet makes
    errors of fact hard to accept, plus people have come to expect links to references
    where possible. Credibility takes an even bigger hit if the fact is so obviously
    wrong (Lebanon is not in Africa: 10% of 120 is not 1.2).


    > Most web browsers have a spell-check feature. Before going live with your site,
    check each page using your browser to highlight any errors that weren''t caught.


    > One simple way of catching errors is to have one or two other people read what
    you''ve written, if you don''t have time to do that, try reading your work backward—problems
    jump out that way.'
