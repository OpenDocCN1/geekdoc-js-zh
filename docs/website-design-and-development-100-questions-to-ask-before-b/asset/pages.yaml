  md: '# 71. How Will You Manage Your Mailing List?


    It''s possible to keep your e-mail list in your e-mail program and send out massings
    from time to time, but it''s much easier and safer to use an e-mail list manager.
    These programs are designed to automate processes such as: having people sign
    up, mailing out materials, handling requests to unsubscribe, checking for duplicates,
    and so on.


    There are two types of e-mail list managers. Each has its pros and cons, as shown
    in Table 8-1.


    TABLE 8-1: E-mail List Managers


    | TYPE | PROS | CONS |

    | --- | --- | --- |

    | Self-hosted software | No monthly fees hosted as part of your website''s account
    (the software itself might cost money). Can be fully customized to your needs.
    | You''re responsible for all maintenance and dealing with software problems.
    Potential for exceeding your host''s hourly limit on e-mail (about 200). |

    | Third-party hosted services | Usually user-friendly. Often extensive reporting
    tools. No maintenance issues. No send restrictions. Usually great support, training.
    | Monthly fee based on volume. Customization is limited to a few extra fields.
    Only the data is yours. |


    Although you pay a monthly fee for hosted e-mail list managers, it''s only in
    the $15–$30 range for up to several thousand subscribers and the savings in time,
    energy, and peace of mind are all worth it.


    > Rule of Thumb Use a hosted e-mail list manager. Let it handle the technical
    aspects so you can focus on marketing and creating content.'
