  md: '# Unplanned Downtime or Slowdowns


    One of the most common causes of unplanned downtime or server slows is poor security.
    Most sites are hosted on a shared server (multiple accounts on a single server),
    and if one of the other sites is using an insecure piece of software, it can let
    in hackers to use up the server''s resources. If the hosting company isn''t on
    top of things or has poor security system between hosting accounts, your site
    can be slowed down or knocked out.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_39_0.png)


    Another common cause of server disruptions on shared servers is the attempt to
    squeeze too many sites onto one server without leaving some breathing room for
    unexpected bursts of traffic. Ask the hosting provider what its policy is for
    limiting sites on any server.


    # Related Questions


    +   - 13. How much storage space and bandwidth do you need for your site? Page
    30

    - 100. How will you protect your site from attacks? Page 295


    # Action Items


    +   - Ask friends or business associates who have had a website for a long time
    what hosting provider they use and how reliable they''ve been. Then do search
    on those friends and see what others say about them. If you don''t want to spend
    much time researching, start by looking at web hosting providers that have a lot
    of clients. largest hosting providers. Big isn''t always better, of course, but
    usually they get there by offering good service and not just because of heavy
    marketing.

    - When you''ve decided on a host, sign up for a month-to-month contract. If it
    proves unreliable, you won''t be trying to get out of something long term.'
