  md: '# 15. Do You Have a Strong Hosting Username and Password?


    One of the crucial simple ways to protect your website from getting hacked is
    to have a strong password for your hosting account. A strong password has:


    +   - more than eight characters


    +   - no dictionary words


    +   - mix of upper- and lowercase letters, numbers, and symbols


    Here’s the difference between strong and weak passwords:


    +   - **Good Password**—tiUgr6K3e#Y


    +   - **Bad Password**—sparky


    Hosting account passwords are often assigned to you automatically and if it doesn’t
    meet the criteria just listed, you should change it. You can do that through your
    hosting control panel.


    > **Rule of Thumb** Change a password only if it’s as strong or stronger than
    the original.


    Don’t change a password to something simple because it’s easier for you to remember.
    Simpler also means for hackers to break in. If you’re not sure how to make a password
    strong, most control panels have a password strength indicator to guide you all.

    Don’t be tempted to use the same password for your domain management and for your
    hosting account. Both provide access to key components of your online presence,
    so why make it easy for hackers to access both?


    On Video

    Watch how to create strong passwords and how to use a hosting control panel’s
    change password function and password generator


    If you need people to work on your website temporarily, don’t give them username
    and password. Instead, create an FTP account for them through your hosting control
    panel. When the work is finished, you simply delete the account.


    You might be asked by someone working on your website for the File Transfer Protocol
    (FTP) information. In most cases, the login information for FTP protocols will
    be the same as the login for your hosting control panel, but your host should
    make it clear if’re different.'
