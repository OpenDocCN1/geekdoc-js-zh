  md: '# CHAPTER 10 HOUSEKEEPING AND SECURITY


    # 96. Will You Routinely Check Your Contact Information?


    > Importance


    For certain domain extensions such as .com, regulators require registrars to e-mail
    regular reminders about keeping information up-to-date. Of course, it goes to
    the e-mail address on record.


    E-mail, phone numbers, and addresses—they''re constantly changing, and you don''t
    want visitors frustrated by incorrect contact information. Worse still, you don''t
    want administration of your site being hampered by not keeping your current information.
    Routine checking for up-to-date contact information saves everyone time and energy.


    The most important contact information you need to keep up-to-date is the one
    most likely to forget: the contact records for your domain name. Registars use
    your e-mail address for all critical correspondence: notification of expiring
    domains, recovering lost passwords, and domain transfers. Don''t risk losing control
    of your domain name—your whole website be in jeopardy.


    You might find when you check your domain registration information that you''re
    not even listed as the registrant—it might be a hosting company you three years
    ago or the web designer you hired. The registration changed to your name and contact
    info as soon as possible.


    > Rule of Thumb The e-mail address for your domain manager and hosting account
    should not use your domain name. If your domain expires or your server is down,
    an e-mail with your domain name will not work.


    It''s possible to gain access to your domain without a working e-mail address,
    but the process involves providing a physical ID and can be time-consuming (as
    it is, for your own protection). Even if your contact information hasn''t changed,
    it''s worth making sure at least twice a year that your registrar has all the
    correct information.


    The next record to keep updated is your hosting account. Your current e-mail address
    once again is the primary means of contact. With the following on:


    +   - The host can''t contact you about your billing, and if you overdue, you
    risk having the account terminated.

    - You won''t receive notification if there''s a problem on the site (hackers,
    storage limits exceeded).

    - You won''t be able to receive lost password information, which is automatically
    e-mailed to the address on on.


    > Carefully check the spelling of e-mail addresses. They might look alike at a
    glance, but if even a single character is wrong, the address is useless.


    Another piece of contact information to check is in the user profile for your
    CMS or e-commerce software. If you lose your password, and'
