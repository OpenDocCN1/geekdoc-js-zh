  md: '# 41. HOW EASILY WILL YOUR PAGES PRINT?


    Fortunately, there''s a simple answer for the web owner, and that''s the use of
    a special style sheet. By including media="print" in the link to this style sheet,
    your browser''s function will automatically use that style sheet instead of the
    regular one. No special print button or scripting is required beyond this, which
    is good because users either don''t use special print buttons or if they do, they
    still use the browser print out of head.


    A style sheet works in two ways: hiding unnecessary content and reformatting content
    as necessary.

    Suppose that you don''t want the sidebar printed out. You simply create a rule
    in the print style sheet that hides it. As long as you sure elements on a page
    can be targeted by creating good CSS markup, you can do things as printing only
    your logo and nothing else in your site''s header area.


    For the content you do want, it would be helpful to style it differently from
    how it appears on the website. For example, if your text has a colored background
    on your website, you''ll want to switch to writing for purposes. Or the font you
    use online might be changed to a print-friendly font. The point is that you can
    do all of this without copying or duplicating your content—the style sheet handles
    everything.


    To know whether a print style sheet is in place for your site, see Figure 5-18.
    On the left is what you expect to see in the header of your site (or you might
    need to link your main style sheet for a section such as the one on the right).


    > CSS supports 10 media types, of which print is only one. You can have separate
    style sheets for Braille, handheld, and more.


    > On Video

    View real-time examples of how CSS style sheets make print-inking easy.


