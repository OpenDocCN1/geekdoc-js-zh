  md: '# 7. What Is the Difference between a Web Hosting Provider and an ISP?


    An Internet service provider (ISP) is the company that enables you to get on the
    Internet (via DSL, cable, satellite, and so on); a web hosting provider manages
    space on the Internet for storing and accessing websites and other files.


    This distinction often gets blurred in people''s minds because ISPs also offer
    varying levels of hosting services. In particular, ISPs provide e-mail hosting,
    and for many people the e-mail account they get from their ISP is the only one
    they have. It''s very common for an ISP to provide free or low cost hosting when
    you sign up, although this isn''t always publicized.


    # ISP Hosting


    Web hosting accounts from ISPs generally are meant for personal web space. They
    have web addresses (URLs) such as http://members.provider.com/username and typically
    do not have features that a business website needs: databases, large amounts of
    storage space, handling large numbers of visitors, or the ability to use your
    own domain name. In fact ISP hosting accounts can be very restrictive, as the
    excerpt in Figure 2-3 demonstrates.


    Even when an ISP offers useful business features, you need to assess its support
    for hosting services, online hosting interface, and all the other questions about
    hosting and ISP being raised in this chapter. There''s a lot to being in an ISP
    and supporting that of the business: Do you have the resources to adequately support
    hosting as?


    > You can always use your ISP''s free web space for a hobby or family website
    or as a place for the kids to create their own website.


    The other important consideration is search engine visibility. If you host your
    site with your ISP and use its domain name, and then a year down the road you
    want more features, get your own domain, and move to a web hosting provider, links
    to your site will no longer work and your search engine ranking you''ve built
    will be lost because your web address will have changed.


    > If you decide to sign up with a web hosting provider, don''t cancel services
    with your ISP. You still need them to connect to the Internet.'
