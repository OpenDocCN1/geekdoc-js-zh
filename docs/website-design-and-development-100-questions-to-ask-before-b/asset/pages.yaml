  md: '# Media


    It would be nice CNN or the New York Times wanted to talk to you, but don''t let
    the fact that it''s highly unlikely stop you from having a media page on your
    site (and if they do call, you''ll be ready). A media page is meant for anyone
    who needs materials in order to talk about you.


    A blogger doing a review of your book needs an image of the cover, a conference
    organizer needs your bio and your photo, or the committee for an event you''re
    sponsoring your logo for a poster. Not only have you made it easy for all these
    people to get what they need you also ensured that it''s what you want them to
    have. Logos are a perfect example of this. You don''t want people using an old
    version of your logo or a poor quality version. By having your latest logo in
    various formats on your media page, you don''t leave anything to chance.


    Much of the material on media page might be available elsewhere on the site, but
    you don''t want to rely on it being by chance. Plus, it likely needs to be available
    in a format to journalists and others. For instance, the information from the
    About page and related pages should be a PDF for downloading, although the image
    of your location''s on the contact page should be available on the media page
    in a print-ready, high-resolution format.


    # Testimonials/Reviews/Case Studies


    When you ask a friend if he''s tried the new restaurant that just opened, you''re
