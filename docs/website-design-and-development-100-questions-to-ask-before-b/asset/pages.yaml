  md: '# 60. How Effectively Will Your Content Use Links?


    Did you know that the H in HTML stands for hypertext, which literally means “more
    than text”? What makes more than the text in printed materials is the ability
    to link words and phrases to other content. With this powerful tool comes responsibility,
    so this answer is about responsible as effective linking within your content.


    First and foremost, links need to be relevant to the content being visited. If
    the link sends visitors to a destination that''s not clearly related, you wasted
    their time, not to disrupting the flow of your content.


    Even relevant links, however, should be used sparingly. If every few words have
    links, the reader might get the sense you''re relying on the links to do work
    instead of gaining the information of your yourself. Also, links are supposed
    to point out important additional material, and if almost everything is linked,
    the reader isn''t sure what''s important to follow. See Figure 7-4 illustrates
    this.


    Some people wonder why anyone would create links that take visitors to other websites.
    But showing others useful sites is part of establishing a rapport and a sense
    of value by being helpful.


