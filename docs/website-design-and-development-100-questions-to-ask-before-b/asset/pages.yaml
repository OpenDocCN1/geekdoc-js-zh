  md: '# 16. Should Your E-mail Be on a Separate Server from Your Website?


    For most people, the answer to this question is no. Hosting accounts for websites
    includes e-mail hosting, which can easily handle the typical needs of users. However,
    there are certain situations in which it makes to host your domain''s e-mail on
    a different server:


    +   - You prefer using a web mail service—If you already use an online service
    such as Gmail or Yahoo!, you can also have your domain''s e-mail handled through
    its servers instead of your web hosting provider.


    +   - You have your own internal mail server—Hosting your own e-mail on a server
    in office is becoming more common, and you can easily keep that server while setting
    up a website with your web hosting provider.


    > Rule of Thumb The e-mail that comes with web hosting is adequate for the needs
    of most site owners, so there''s no need to have a separate e-mail server.


    If you have an e-mail server in your office, why not just host your website, too?
    The answer is that hosting websites is an entirely different process requiring
    an additional level of maintenance, not to mention issues of bandwidth(amount
    of traffic to the site), ISP restrictions, and more. Plus web hosting providers
    are so inexpensive.


    +   - Your company is using special e-mail software—Tools such as Microsoft Exchange,
    which integrate e-mail, voicemail, messaging, and other communications tools into
    a single package, require a special server for e-mail.


    +   - You need high security—If keeping e-mail secure is a top priority, you''ll
    probably need a specialized e-mail hosting service.


    +   - You need added reliability—Having your website and e-mail go down together
    might be too risky, so having e-mail on a separate server is a way to solve this.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# What It Takes to Have Your E-mail on Another Server


    It''s beyond the scope of this book to go into the details of setting up the connection
    between a web server and a separate mail server, the idea is that instructions
    on your web hosting provider''s server redirect all incoming mail to a different
    address. This is done through the domain name server (DNS) records. To set up
    these instructions, you''ll require the IP address (a numbered address like 11.111.11.111)
    of the server that will handle the mail.


    If you give them this IP address, most web hosting providers will make the necessary
    changes for you, either for free or for a small fee. If you know IT people or
    friends who have done this kind of redirection you can give them access to your
    hosting control panel. It is possible to make the changes yourself through your
    hosting control panel, but I don''t recommend it.


    > If you''re determined to redirect mail to another server, look for detailed
    help on your hosting control panel and follow the instructions exactly, or enter
    the search phrase mx record at another server.


    # Related Questions


    +   7. What is the difference between a web hosting provider and an ISP? Page
    17

    18. Can you easily manage e-mail through your web hosting provider? Page 46


    # Action Items


    +   Be sure to weigh the costs of having e-mail on a separate server (especially
    an in-house server) vs. doing it through your hosting account. Legal requirements
    or increased productivity, for example, might well justify the expense of a separate
    mail server.

    If you already have an e-mail server, the people who set it up for you can also
    help with getting your domain name pointing properly to it and your web hosting
    provider (or the mail server people might have a good hosting control panel and
    reliable hosting at a good price).'
