  md: '# 45. How Easily Will Visitors Find Important Details Specific to Your Site?


    Most of the questions in this chapter deal with user experience issues that apply
    to virtually any site. But there will be elements that are specific to your site,
    and this question will help you think about how to make them user-friendly.


    Here''s a simple example: If you accept credit cards, let everyone know. People
    usually think of this when they accept online payments, but even if you accept
    credit cards only offline, tell your visitors. Where exactly to place credit card
    information on a page will depend on how important it is to your visitors. Does
    it need to be on every page or is it enough to place it on pages such as Contact
    or Services? Figure 5-23 shows some examples of where you can place credit card
    codes.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_135_0.png)


    Making things easy to find does not mean everything has to have a link on the
    home page. Even if you don''t start your site with a busy front page, it''s easy
    to keep adding links and buttons until it becomes a big blur to visitors.


    Figure 5-23


    An FAQ is a good place to put this information. However you choose to do it, don''t
    make your visitors guess or have to contact you to find out something as basic
    as whether you take credit cards.


    Suppose you''re looking for a dentist. One website contains a list of insurance
    companies the dentist deals with (yours among them), and the other doesn''t. Which
    dentist will you call first? Think about what pieces of information will be most
    crucial to your visitors and make sure''re easy to find.'
