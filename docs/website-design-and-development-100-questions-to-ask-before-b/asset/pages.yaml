  md: '# 56. Will Your Content Serve

    Your Site''s Purpose?


    In one sense, this should be the first chapter of this book because content truly
    is the heart of any website. It''s what visitors are looking for and is the reason
    they come back. If you read earlier chapters in this book, you know that content
    is the benchmark of just every decision you need to make about the site. But what''s
    the benchmark for deciding on content?


    Back in the introduction to this book, I asked why you wanted to build a website.
    The answer or answers to that question must be used to determine what pages you
    need on your site, what content belongs on those pages, what wording to use, what
    writing style to use, and much more. The benchmark for content is the site''s
    purpose.


    > Rule Of Thumb Review your site content at least per year to make sure it meets
    your site''s purpose. You''ll also want to review your purpose.


    Suppose that your purpose is to increase the number of jobs performed at your
    auto repair shop—in other words, to get more business. The people who can give
    you more business are the visitors to your site, so to fulfill your purpose your
    site needs to convince them that you''re the shop to meet their needs. Now starts
    to get more specific.


    One of the needs of car owners is to keep their cars running safely at the lowest
    possible cost. It''s a problem they face, to speak. A task of your website, then,
    would be to show how you can provide the solution to that problem. What content
    can help convince them of them? Here are:


    +   - A page detailing the cost savings of preventative maintenance\and the high
    costs of putting off maintenance


    +   - A page of customer testimonials emphasizing quality work at a

    great value


    +   - A seasonal specials page


    +   - A page of favorite tips from your mechanics that can help save

    customers money on anything automotive'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'Some ideas will depend on what you''re already doing or could easily plan to
    do (such as seasonal specials), whereas other ideas are a matter of thinking how
    your knowledge can be communicated to customers in a helpful way. But in each
    case, the ideas are driven by providing a solution for customers designed to help
    drive the purpose of the site.


    Of course, there are other customer needs that can bring them to your repair shop,
    so the purpose might remain the same—getting more business—the content required
    to fulfill that purpose with various customer needs.


    Notice that your site''s purpose actually boils down to the needs of your audience,
    and applies to not just commercial sites. If the purpose of your site is to convince
    something, the content required to convince them ultimately has to speak their
    language, be in terms of their understanding, and relate to their needs and goals.
    The same is true of informing, entertaining, or any other purpose. Your website
    is a communication tool for people—it has to engage them or click onto the next
    site.


    Hopefully you''re already doing this kind of thinking as part of your overall
    business and marketing strategy, and it''s just a matter of dreaming up to implement
    it on the Web. If you haven''t been thinking this way, use the website to get
    thinking that across your whole business (from what you say in newspaper ads to
    how you set up your waiting room!).


    > Remember to voice your audience''s problems on the site and offer solutions.
    If visitors can hear themselves thinking in your copy, they''ll be more likely
    to listen to your solution because they know you "get them."


