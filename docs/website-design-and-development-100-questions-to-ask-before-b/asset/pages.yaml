    # Backing Up Databases


    If you have a CMS or a shopping cart system, then in addition to the files, you''ll
    need to back up the databases used by these systems. Again, there are several
    options, depending on your software and on your host-panel:


    +   - Built-in backup—Many CMSs and shopping carts have a backup function that
    makes a copy of your database and provides options for downloading that copy.
    You can have the copy e-mailed to you (this is handy if you''re not at your computer
    or for automated backups) or you can download it directly to the backup folder
    you created. If you use the e-mail option, remember to save the copy to your backup
    folder when it arrives.'
