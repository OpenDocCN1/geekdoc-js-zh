    few clicks using one of these panels.


    If a hosting provider does not have a hosting control panel, that''s a good sign
    to move on. If it does, you''ll want to try it out or at least get detailed information
    about it, including screenshots like the one in Figure 2-5, which shows the home
    page for the popular hosting control cPanel.


