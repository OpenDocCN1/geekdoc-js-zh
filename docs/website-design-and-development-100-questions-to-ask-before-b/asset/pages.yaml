    +   * On your site map make notes, perhaps using a special color of arrow, about
    opportunities to link from one page to another within the content. Do the same
    for links to other sites you might have missed.

    * Check what anchor text you''ve chosen for your links and see if it needs rewriting
    to be more descriptive, while keeping the natural flow of the content.'
