    The same is true of content that''s regularly updated and then stops. But keeping
    content fresh can feel very daunting.


    The trick to blogging is to make it as easy as possible. First of all, don''t
    set the bar too high. If you can add one new item to your website couple of weeks,
    that''s often plenty for visitors and for search engines to keep returning.


    The second trick to successful blogging is to make it as easy to schedule. Most
    CMS, and certainly those specified bloggers, make it easy to write content and
    have it appear any time in the future. So, a pastor who wants a daily devotion
    to appear on the church website could sit down one month and write all the devotions
    at one time and schedule them to appear daily.


    Updating or adding pages to your website is also important to keeping your site
    content, but this is different from the content being discussed.


