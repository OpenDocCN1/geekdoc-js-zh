  md: '# What''s on the DVD?


    There are videos to accompany more than 50 of the questions in your book. You
    can see demonstrations of online tools, more examples of websites, and hear additional
    commentary.


    The DVD also contains a worksheet for your site requirements, a prelaunch checklist,
    and an alternative table of contents.


    # System Requirements


    Make sure that your computer meets the minimum system requirements listed in this
    section. If your computer doesn''t match up to most of these requirements, you
    might have a problem using the contents of the DVD.


    Necessary requirements are the following:


    +   * PC running Windows XP or later, or Mac running OS X

    * DVD-ROM drive

    * Adobe Flash Player 9 or later (free download from Adobe).


    > The interface if you have auto-run disabled. In that case, click Start -> Run
    (for Windows Vista, click All Programs -> Accessories -> Run). In the dialog box
    that appears, type D:Startexe.(Replace D with your DVD drive uses a different
    letter. If you don''t know the letter of your DVD drive how it is listed under
    My Computer.) Click OK.


    # Using the DVD on a PC


    To access the content from the DVD, follow these steps:


    +   1. Insert the DVD into your computer''s DVD-ROM drive. The license agreement
    appears.

    2. Read through the license agreement, and then click the Accept button if you
    want to use the DVD.

    3. The DVD interface displays. Select the lesson video you want to view.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Using the DVD on a Mac


    To install the items from the DVD to your hard drive, follow these steps:


    +   1. Insert the DVD into your computer''s DVD-ROM drive.


    +   2. The DVD icon will display on your desktop: double-click to open it.


    +   3. Double-click the Start button.


    +   4. Read the license agreement, and then click the Accept button to use the
    DVD.


    +   5. The DVD interface will display. Here you can install the programs and run
    the demos.


    # Troubleshooting


    If you have difficulty installing or using any of the materials on the companion
    DVD, try the following solutions:


    +   Turn off any antivirus software that might be running—

    Installers sometimes mimic virus activity and make your computer incorrectly believe
    that it is being infected by a virus. (Be sure to run the antivirus software back
    later.)


    +   Close all running programs—The more programs you run, the less memory is available
    to other programs. Installers also typically update files and programs: if you
    keep other programs running, installation might not work properly.


    +   Reference the ReadMe file—Please refer to the ReadMe file located at the root
    of the DVD-ROM for the latest product information at the time of publication.


    +   Reboot if necessary—If all else fails, rebooting your machine can often clear
    any conflicts in the system.'
