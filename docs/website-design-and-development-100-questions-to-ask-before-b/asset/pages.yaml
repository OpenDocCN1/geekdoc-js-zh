  md: '# CHAPTER 1 DOMAIN NAMES


    # 2. Do You Need Multiple Domain Names?


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_23_0.png)


    You need to make sure you are correctly point additional domain names at your
    website. There can be negative consequences when dealing with search engines unless
    you do it right, which involves creating a call of a 301 redirect. What this redirect
    tells search engines is that the website has permanently moved from one domain
    to another. For detailed instructions you search phrase redirect multiple domains
    301.


    Every website should only have one domain name by which it''s known, but there
    are all sorts of reasons to have additional domain names pointing to that site.
    Here are a few:


    +   Common misspellings—Suppose that name is Healthwise; it would make sense to
    get an additional domain name with the Healthwise because most people will enter
    it that out of habit.


    +   Common variations—If you use a name in your primary domain (health2you), you
    should register an additional domain name with the literal spelling (healthhtoyou).


    +   Doing business in multiple countries—A British company might have a domain
    name with the country top level domain .uk, but also the domain name with .com.
    Keep in mind that most country regulators require a legal presence to register
    their domains.


    +   Block competing domains—Someone else might register the same domain with a
    different extension. You can prevent this by registering the .com, .net, and .org
    versions of your domain name, for example.


    The part of the domain that comes after the very last (mydomain.com.uk) is the
    root or top level (TLD) extension. There are two common types: generic (gTLDs)
    such as .com, .org, and biz; and country-code (ccTLDs) such as .uk, .ca, .au,
    .tv, and .co.


    +   Special domain names—Suppose that you develop a fitness calculator on your
    Healthwise fitness website. It might be worth registering a domain such as thatfitnesschallenge
    and point at that page on your site.


    Although most new domain names are not expensive, having a lot of domain names
    can add you''ll need to weigh some of these variations are: how likely misspellings
    might be, how much competition there is, and whether people in a certain country
    if they''re going to go with a domain with their country''s extension.'
