  md: '# 66. Will You Be Blogging on Your Site?


    A lot of people will tell you it''s important to have a blog: Blogs are good for
    developing relationships with visitors and they can help get better exposure in
    search engines. The personal nature of most blogs and their typical diary-style
    design can make it hard for website owners to see how exactly a blog would fit
    into their site.


    What''s important, however, is not the blog itself, but the act of blogging, which
    is nothing more than putting up new content on a frequent basis. That''s what
    keeps visitors (and search engines) coming back to blogs, so the question for
    you as a website owner is: Can you come up with relevant, interesting content
    that can be updated frequently?


    The answer is yes, if you give it some thought. For example, news about your company
    or organization is perfect blogging material. The new lathe in your machine shop,
    a newly hired stylist, the arrival of a new bicycle model, a change of hours,
    and the results of the baseball team you—these are constantly bits of relevant
    information you can share with visitors.


    If you expand this news to include trends in the world that affect your area of
    business, suddenly there''s a mountain of potential topics for blogging: how the
    weather in India is affecting vacation plans; the implications of a new study
    on coffee habits; how an article in a magazine about sunscreen products impact
    your visitors.


    Here are some other ideas for blogging areas on a website—topics that constantly
    changing content:


    +   - Press releases

    - Articles

    - Tips

    - Features of the week

    - Testimonials

    - Case studies


    If you set up a blogging area on your site, make sure you use it. The blank blog
    shown in Figure 7-20 (it was three months old at the time of writing) is not uncommon
    and it gives a negative impression.


    > The software that runs blogs is really simple, easy-to-use content management
    software designed to display the most recent content first


    > Frequently adding new material without a CMS is possible, but it''s not as simple
    unless you''re very comfortable working with HTML.'
