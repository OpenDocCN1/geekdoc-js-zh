  md: '# Images


    Search engines can''t see images so you need to help understand what an image
    is about. This kind of optimization is important not just for image searches,
    but for regular search rankings as well. The basics of image optimization starts
    with the image''s HTML tag. Figure 9-8 shows an image tag that has not been optimized,
    and each part of the tag has been labeled.


    | File Name | alt Attribute | title Attribute |

    |---|---|--|

    | <img src="my-dog-playing-frisbee.jpg" alt="My Dog Playing Frisbee" title="The
    Big Catch | |


    FIGURE 9-8


    Starting with the filename for the image—img839287.tif—it tells you nothing except
    what number it in someone''s camera. If this is a picture of your new car, name
    the file something like "honda-civic-2010-blue-4-door.jpg". If you''re reviewing
    the car, the filename matches the content of the page. The bonus is if someone
    searches for "honda civic 2010," not only will your web page come up but your
    image could come up as its own listing.


    The next piece of the image''s HTML that needs optimizing is the alt attribute.
    (It stands for "alternative" and it''s that shows on the web page if the image
    is broken or if images are turned off.) It''s also indexed by search engines.


    If the alt attribute says something like "Honda Civic 2010 blue 4-door," it matches
    the filename, fits with the page content, and gives another check box on the search
    engine''s relevance checklist. If it has the keyword for the page, the alt attribute
    becomes more useful—but make sure it''s part of the image description, not just
    thrown in to get more keywords.


    The final element of the image is the title attribute. Text in it will be displayed
    by the browser as a small popup box when visitors hover over the image. Although
    it''s a benefit to users to search engines specifically, the title attribute does
    add additional text to the description of the image.


    The location of an image on the page affects how it is ranked by search engines.
    First, make sure the image is surrounded by the text it is related to, such as
    the Honda photo in the car review, not on


    > Don''t confuse optimization of images for reduced size with SEO. Images need
    to be saved for the web to keep their file size small; that''s known as optimization.


    > Putting a hyphen between words in a filename allows search engines to read the
    individual words. Spaces or underscores won''t the trick.


    > For details about image optimization, search for images seo.


    > Don''t confuse the alt and title attributes of an image. If you put text only
    in the title attribute, it does not get picked up by the search engines in the
    same way.'
