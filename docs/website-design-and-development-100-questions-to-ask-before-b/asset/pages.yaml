  md: '# 54. Will Your Nontext Files Use the Proper File Types?


    When you''re building your site, and later as you create content, it''s important
    to know what file types you should be using. It can make a huge difference to
    the look, loading time, and compatibility of your site.\ One of the most common
    misunderstandings with images is to use JPG (pronounced jay-peg) and when to use
    GIF (hard or soft g) or PNG files. (The PNG was developed to replace the GIF,
    which is limited in colors and is protected by a patent.)


    +   Rule of Thumb JPG is for photographs or any image with lots of differently
    colored or blended areas. GIF is for graphics with distinct areas of solid color,
    or without transparency. PNG, which is a replacement for GIF, supports more colors
    and better transparency.


    The results of not following these guidelines can be seen in Figure 6-9. Look
    at the detail of the same photograph saved as a JPG and as a GIF, the difference
    for image of flat colors.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_159_0.png)


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_159_1.png)


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_159_2.png)


    The GIF photograph looks okay, but notice how much larger it is than the JPG (the
    GIF is 43K and the JPG is only 5K). Saving photographs in PNG format also produces
    unnecessarily large files. These various file types use compression to make images
    smaller for the Web. GIFs are not good at compressing shades of color, but compare
    the images with the flat colors: The GIF not only has crisper edges but it has
    also created a much smaller file than the JPG.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_159_3.png)'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# 54. WILL YOUR NONTEXT FILES USE THE PROPER FILE?


    Controlling file size for images is extremely important for keeping down the loading
    time of a website. All image software allows you to change the dots per inch as
    well as the dimensions—two important factors in reducing image size. But you''ll
    also want a special way of saving for the Web. Your software should allow you
    to choose the amount of compression for JPEGs, GIFs, and PNGs.


    HTML allows you to change the dimensions of an image, but the results aren''t
    so. GIFs cannot be altered or else they break up. JPGs can stand a bit of resizing,
    but then it looks good. It is better to size the image in your image editor, or
    a lot of CMs today to physically resize an image and save the new version.


    Instead of uploading images directly from your camera to your website, you should
    first reduce their size and optimize them. But you will need to be careful not
    to optimize so much they look bad. While you can see the pixels on both blowups,
    the image on the right has much larger blocks of pixels. That''s the result of
    higher compression and it''s what makes an image look rough or "choppy".


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_160_0.png)


    FIGURE 6-10


    When uploading documents to the Web it is best to use PDFs. Saved properly, they
    can keep down the size of the file, but most importantly, they can be read by
    virtually anyone. If you put any other type of document on your site, you inconvenience
    users who don''t have the necessary program.


    > If your current software does not allow you to save documents as PDFs, for a
    free or low-cost program by searching for the phrase PDF writer software.


    Sometimes you have to upload documents of a particular type, which is why it''s
    important to tell visitors what type of document it is, so they''re not downloading
    something they can''t.


    For audio files, you should save them as mp3 with the lowest bit rate that maintains
    good quality (different for music and voice).'
