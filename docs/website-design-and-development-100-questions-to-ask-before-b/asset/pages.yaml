  md: '# 69. How Will You Build Your E-mail List?


    E-mails remains an essential part of communication on the Web. Social media tools
    come and go, and people might or might not regularly look at their social media
    accounts, but you can count on e-mail being checked regularly. That''s why an
    e-mail list of people interested in your ideas, products, or services remains
    a cornerstone of any marketing plan. How you build this list is what this is all
    about.


    Here are some ideas for building your e-mail list offline:


    +   E-mail signup sheet—Use this sheet at trade shows, openings or open houses,
    book signings, or when giving a speech.


    +   Business card drops—Many businesses already use these boxes to do draws, why
    not add a notice saying entrants will be placed on a mailing list? You can use
    these drops at trade shows, at a point of sale, in an office, or in a waiting
    room.


    +   Print advertising—Mention signing up for a free report or a newsletter: then
    direct people to your website (or an e-mail address if your site is not up yet).


    +   Meeting people—As of your follow-up after meeting people, be sure to ask them
    to join your mailing list.


    +   Telesinars—If you''re holding your own seminar, make mailing list part of
    the general signup process, or promote the newsletter during the seminar and then
    follow up with an e-mail to them.


    > Rule of Thumb—You must clearly tell people they''re signing up for an e-mail
    list and you must prove that they agreed to sign up.


    E-mail marketing is sometimes referred to as permission-based because it requires
    you to get permission from the person you''re putting on the mailing list. Any
    offline additions to your list must include the following:


    +   Clearly state that you will put the e-mail address on a mailing list, with
    a short explanation of what the mailing list is about'
