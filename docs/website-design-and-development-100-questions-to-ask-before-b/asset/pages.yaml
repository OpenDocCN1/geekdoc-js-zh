  md: '# 11. What Type of Server and Which Operating System Do You Require?


    Web hosting providers offer a wide range of server types and operating systems,
    but for most users the choices are pretty simple.


    # Types of Servers


    Web servers fall into two broad categories:


    +   - Shared servers

    - Dedicated servers


    In a shared hosting environment, your website is on a server with hundreds or
    even thousands of other websites. Dedicated servers host your content exclusively
    (there are a number of different types of dedicated servers, but those aren''
    important in this context). Hosting a website on a shared server costs a lot and
    offers all the features most websites will need, so choosing a shared server makes
    sense for the vast majority of sites.


    > Rule of Thumb A shared server hosting account is all that''s needed for most
    websites.


    However, there are two factors in particular that can affect the performance of
    your website on a shared server:


    +   - Overcrowding

    - Lax security


    It''s important to check what policies a web hosting provider has to deal with
    each.


    How many sites a server can support depends on size and power of the machine,
    and in each case hosting providers have to balance service with profitability.
    They need enough sites to make their money, but too many sites will slow down
    the server and leave less room to cope with spikes in traffic. Poor-quality providers
    will sacrifice service for profitability.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# 11. WHAT TYPE OF SERVER AND WHICH OPERATING SYSTEM DO YOU REQUIRE?


    The other issue is how good the provider''s security measures are. If another
    website on the shared server gets hit with a virus, you don''t want it to infect
    your site or bring down the entire server. With adequate security in place, these
    issues can be avoided—that''s what separates web hosting providers from the poor
    ones.


    # Operating Systems


    Just like your computer at home or at work, web hardware runs on an operating
    system. The two most common systems offered by web hosting providers are:


    +   * Linux/UNIX

    * Windows


    > The operating system you use at home or work is entirely separate from the operating
    system you need for your website. If you use Windows at home you don''t have to
    have a Windows server for your site.


    Both will run HTML files just fine, so the key in deciding which to choose is
    whether your website requires software such as content management system.


    Generally speaking, if software uses a language called PHP, you are better off
    on a Linux operating system: if the software runs on a language ASP or .NET, your
    site sits on a Windows machine. If your website needs to interact with Microsoft
    products such as Sharepoint or Access, a Windows system is required.


    > If you get up with Linux and discover that you really need a Windows server,
    or your web hosting provider can switch things over. This is easy if your site
    doesn''t run special software at the moment. It''s a matter of making sure that
    the software can run on the other operating system or being aware of potential
    issues.


    # Related Questions


    +   * 12. Does your website have specific software requirements? Page 28

    * 48. Will your site be built with a content management system (CMS)? Page 124

    * 55. Which languages other than HTML will you use to build your site? Page 143


    # Action Items


    +   * Check the shared hosting forums on a web hosting provider''s site to see
    whether there are constant complaints of slow servers or security breaches affecting
    entire servers.

    * If you''re working with a web designer or developer, they can help decide whether
    you need a Linux or Windows server, if you''re creating the site itself, check
    the requirements list of any software you''re running and ask your web hosting
    provider for advice.'
