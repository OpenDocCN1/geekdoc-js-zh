  md: '# 31. WILL YOUR SITE DESIGN DISPLAY WELL IN DIFFERENT BROWSERS?


    This allows any IE newer version than 7 to use a particular styling on the body
    of the HTML. You can also have this conditional code the browser to go and get
    a separate style sheet.


    One of the difficulties of sorting browser compatibility is knowing when trying
    to keep everyone happy. The first step is to understand which browsers your visitors
    are most likely using. You can find general browser statistics on websites like
    the one shown on the left side of Figure 4-24, and when your site is up-and-running,
    you can see the browsers in your site statistics, shown on the right side of Figure
    4-24.


    > On Video See an example of cross-browser testing.


    | Web Browsers | Name | Visits | Visits |

    |---|---|---|--|

    | 1 Internet Explorer 8 | 26.17% | 5102 | 03.02% |

