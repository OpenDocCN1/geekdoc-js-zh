  md: '# 91. Will the HTML Code for Your Site Be Search Engine-Friendly?


    HTML code does not directly affect your search engine rankings, but it can present
    some barriers to the programs (robots) used to gather website data.


    Search engine robots are not like web browsers. Browsers want to give users the
    best possible experience viewing sites, so they tend to be very forgiving of HTML
    that breaks. Robots, on the other hand, are interested in indexing content and
    simply work their way through every character in the HTML. Many of the errors
    they encounter won''t cause a problem, but they''re enough to cause the robot
    to miss content or indexing.


    You can quickly spot major errors in your HTML without having to be an HTML expert.
    There''s a free validation service provided by the organization for HTML standards,
    like the W3C consortium all you have to enter a page''s URL into the validator,
    and it will provide a report on your errors, as shown in Figure 9-13.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_283_0.png)


    Don''t be shocked at the errors you''ll see for your pages. If you enter the URLs
    of several websites, including Google, you''ll discover that they don''t validate,
    either. In fact, the majority of sites won''t validate, so just get hung up trying
    to eliminate little'
  merge: -1
  pgno: 283
- img_proc: true
