  md: '# 23. Will Your Site Layout Make Your Content Clear?


    The layout of a website serves as a kind of map for visitors. Once they understand
    the layout, they’ll know where to look for different kinds of content. Creating
    a site layout can be divided into two tasks: laying out the general areas and
    laying out specific content within them. Examples of these two tasks might include
    the following: whether a sidebar will be on the left or the right of the main
    content; and deciding what content belongs on the sidebar, the content will be
    ordered, how it’s spaced, and so on.


    The job of a designer is to make sure that both aspects of a site’s layout keep
    the visitor focused on what’s important. In most cases, that means using conventional
    site layouts as the ones shown in Figure 4-3.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_74_0.png)


    FIGURE 4-3


    No surprises here—and that’s a good thing. You want people to concentrate on your
    message, not on understanding radically new structures. In a famous study of the
    eye movements of users looking at different types of websites, usability guru
    Jakob Nielsen found a rough, common pattern in the shape of an F, as shown in
    Figure 4-4.


    > Importance


    A great designer can probably focus visitors on the content almost any sort of
    layout, but you would need a very good reason to spend the kind of money it would
    take you to accomplish that.'
