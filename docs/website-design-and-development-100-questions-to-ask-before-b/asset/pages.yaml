  md: '# 32. Will Your Site Design Display Well on Mobile Devices?


    More and more visitors view websites through their smartphones and other mobile
    devices with greatly reduced screens. Making sure that your site is not just visible
    but also functional on these devices is becoming increasingly important.


    In Figure 4-25, you can see the same page as displayed proportionately on a mobile
    browser and on a regular browser.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_98_0.png)


    | Water Fleeters | Welcome to Plumbing Professionals! |

    | --- | --- |

    | Drains or Pipes | commercial, industrial, or we are here to help you with all
    your plumbing, drain or drains (We do) | |

    | Pipe Lines | "We Don''t"" Serving All Of Southern Michigan, Including Ann Arthur,
    Detroit, Flint, Grand Rapids and NOW Toledo, Ohio |

    | Sewers, Burp Pipes, Stations, Basches | |

    | Water Jetting | | |

    | Bathrooms, Kitchens, Laundry | |

    | Business Services | |


    Mobile devices usually make it easy for users to zoom in and out, but this puts
    the burden on the user and constantly zooming can be awkward.


    From a design standpoint, there are two basic options for giving mobile users
    a better experience:


    +   - Restyle your existing site

    - Create a separate mobile site


    Just as with separate print sheets, the first option is to simply reformat existing
    pages to be friendlier for mobile users: narrower width, single column format,
    larger buttons, and so on. Figure 4-26 shows a site''s regular page and the styled
    equivalent on a mobile device.


    > This answer deals with the design of sites for mobile users, but there''s also
    the important technical issue of how a visitor gets the mobile version of a website.
    Whether you''re going to provide the mobile user with a special sheet or a separate
    site, it would be nice to be able to do this automatically in the way your site
    differs differently than Firefox users. Unfortunately, at this point, detecting
    mobile browsers and devices is complicated by a lack of standards. For this issue,
    try the mobile browser detection.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# CHAPTER 4 DESIGN AND LAYOUT


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_99_0.png)


    It''s important to allow users to switch easily between the mobile and the desktop
    version of the site. Have links to both versions. The trick is to make sure that
    the button is highly visible to a mobile user without having to zoom in or scroll.
    And the button must be on every page of both versions of the site.


    FIGURE 4-26


    Having a site that is simply viewed differently is definitely an advantage from
    standpoint of maintenance.


    Content management systems (CMS) typically allow you to easily change the look
    of your site by switching templates, and this makes them prime candidates for
    this restyling approach to mobile devices. Your CMS might offer a plug-in or extension
    that makes it simple to offer mobile users a different view of exactly the same
    matter.


    Make sure that your mobile site is organized on your server so that you can directly
    direct people to either via a subdirectory (http://mydomain.com/mobile) or a subdomain
    (http://mobile.mydomain.com). A popular convention for mobile subdomains is http://m.mydomain.com.


    However, there are good reasons for thinking that a change of stylesheet is not
    enough and that a mobile site needs to be-built from the ground up (while maintaining
    the same general look and branding of the original site).


    People use mobile devices differently than they use desktops or ever laptops.
    Sessions tend to be very short; touch screens and limited input meaning that navigation
    and other tasks need to be even easier; there are more likely to be offline distractions,
    and so on. All of these factors mean you might have to think not just about the
    overall design but the organizational flow of the site. For about designing sites
    for mobile visitors, use the term mobile web design.


    If your website is built dynamically, the page viewed in a browser is created
    from various parts through a scripting process rather than existing on a server
    as a single HTML file. Creating a separate mobile site does not mean starting
    from scratch. Depending on how your content is divided up into separate files
    or database entries, it might only be a matter of reorganizing how some or all
    of the same content is presented.'
