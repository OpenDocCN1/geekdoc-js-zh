  md: '# 36. Will Your Site Load Quickly?


    If average website visitors take 6 to 8 seconds before deciding to stay on a site,
    how long will they wait for the site to actually load? Patience is not something
    you should think for granted when other websites are only a click away.


    Start your site''s loading time early in the development stages. You want to catch
    the catchers in your design, coding, or content as soon as possible. Table 5-1
    shows some of the most common consumers and some of the easiest to change:


    TABLE 5-1: Common Time Consumers


    | PROBLEM | SOLUTIONS |

    | --- | --- |

    | Images | Keep the physical size of all images as small as possible (the average
    size of photos from a camera is 2,500KB, but an 80KB image can fill a computer
    screen). |

    | Multimedia | Optimize the images for the Web using an image-editing program.
    Look at the total number of images on a page. If you have 40 graphics and photos
    averaging 10KB, then 400KB. Optimize files as much as possible. Host video files
    on a separate server, such as YouTube. |

    | Scripts | Make sure that coding such as JavaScript or CSS are in lines separate
    from the HTML page. Consolidate several scripts of the same type into a single
    file.


    > Importance

    The time it takes to load a page is one of the factors in search engine rankings.
    Although load might not count for a great calculating rank, it reflects the fact
    that speed is important to visitors.


    > Internet connections have allowed the total size of web pages to increase without
    sacrificing your load time. Since 2003, average page size has tripled to just
    over 300KB.


    # Ways to Measure Page Loading Time


    There are many easy-to-use tools that show you varying amounts of information
    about page loading time:


    +   **Browser plug-ins**—Some browsers offer plugins that minimize the loading
    time of websites. Check the resources section for this chapter at the back of
    the book for plug-in options.

    **Online services**—There are sites on the Web where you can enter the URL of
    a page and get not only the time it takes for the page to load, but detailed information
    on every single element


    > More and more visitors are arriving at websites by shortened URLs like this:
    http://bit.ly/auzdeb. To reduce the length of messages), they''re being used by
    more and more sites. However, the processing of these short URLs can add to load
    times, even more reason to keep your pages lean'
