  md: '# 63. Will Your Site Use a Splash Page?


    > Rule Of Thumb Don''t use a splash page.


    That answer will be qualified in a moment, but for the vast majority of websites,
    it''s still NO. If you''re unfamiliar with the term, a splash page is an opening
    page of a website with no content other than a few images or an animation and
    perhaps a linked phrase such as “Enter the site.\ The example in Figure 7-9 expects
    you to know that you should click the logo.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_186_0.png)


    Although they''ve become less common, splash pages still get created unnecessarily,
    and here are two important reasons why they shouldn''t:


    +   - They create a barrier for your visitors by giving no information as well
    as adding an extra click.

    - They create a barrier for search engines because the very first page of your
    site does not have what they need most for indexing purposes: content.


