  md: '# 93. How Will You Back Up Your Site?


    At some point, your website will crash. The hard drive on the server will die,
    someone will accidentally erase some files, or a database will get corrupted.
    These are rare occurrences, but when they happen they become catastrophes only
    if you haven''t properly backed up your website. If you have, problems like these
    should be only minor nuisances.


    There are three basic steps to any backup routine:


    +   - Making a copy of all necessary site files

    - Storing the copied files

    - Backing up the copied files


    This process can be as simple as downloading copies of all your site files to
    your home computer and then making another backup on your hard drive. But with
    more sites using content management systems (CMSs) or e-commerce programs, there
    are databases to consider as well as additional options for backing up.


    For most people, the easiest way to handle backups is to keep the copies on a
    home or office computer. Here''s one way to organize them:


    +   - Navigate to the folder on your computer where you keep all website-related
    materials and create a folder called Site Backups (this needs to be done only
    the first time you are backing up your site)


    +   - When you''re doing a backup or if you''re downloading an automated backup,
    create a folder inside of Site Backups whose name includes the current date.


    > To name the folder of a particular backup, try this convention: YYYMMDD (for
    example, 20100408 for April 8, 2010). That way, the folders will line up in chronological
    order.


    # Backing Up Site Files


    All websites hosted on their own server have files that need to be backed up,
    even with a database-driven site. There are several options for accessing the
    site files on your server:


    +   - FTP programs—A File Transfer Protocol (FTP) program is useful if you are
    accessing several different sites (names of good'
