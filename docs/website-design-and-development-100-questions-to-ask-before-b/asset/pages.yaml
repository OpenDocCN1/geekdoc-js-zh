  md: '# 4. Do You Know What Makes a Good Domain Registrar?


    There really isn''t much for a domain registrar to do except record who registered
    which name, the only way to trust registrars is by the services they offer. These
    break down into two broad categories:


    +   - **Domain management**—How easy is it for you to manage your domains, update
    information, organize multiple domains, and so on?

    - **Add-on functions**—Does the registrar offer services such as renewal or free
    e-mail accounts?


    If you have only one, the quality of a registrar''s domain management interface
    might not be that important. But if you have more than one, you''ll appreciate
    being able to tell the status of all your domains, organize them into groups,
    sort them in various ways, quickly manage where the domains are pointing, and
    so on. Figure 1-4 shows an example of a good domain manager layout.


    The other important part of a domain management system is the help function. You
    deal with domain names once then maybe not for another year or more. Without a
    good help system, it is difficult to remember what you should do. Contextual popup
    help, but video tutorials even better.


    Registrars vs. Hosts

    It''s easy to think that these are one and the same because so many registrars
    offer hosting and so many web providers offer names. But there is absolutely no
    requirement that you have your domain names registered through the company that
    hosts your website, or vice versa. Registering domains and hosting are two distinct
    functions.


    > If you discover a registrar with better pricing or services, you can transfer
    your domain to that other registrar at any time. Your existing registrar should
    not charge any fee, but this new registrar will charge you for an additional year
    of registration (which you have spent anyway).


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_28_0.png)'
