  md: '# 59. WILL YOUR WRITTEN CONTENT BE CORRECT, CLEAR, AND WELL STRUCTURED?


    The content can be as simple as breaking the content into separate sections or
    often separate pages. Context will help you decide which is better. If the long
    content is all related to residential design, sections would be best because it''s
    more likely the reader will be interested in one or more of the sections. But
    residential and commercial markets are very different, so a separate page for
    interior design makes more sense.


    Short content is not always a way to do thing. If you break a single article into
    several pages, that can be as annoying as having a lot of diverse text to find
    one topic. Or if you break up a single thought that needs 12 sentences to get
    communicated, you''re doing the visitor as much of a disservice as running 3 thoughts
    together into a single paragraph.


    Figure-2 shows the difference that sections can make your article visibly to long
    content.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_174_0.png)


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_174_1.png)


    # FIGURE 2


    Not only do the section headings extra white space but the difference in sizing
    helps to draw your eye to the beginning of each section.


    Avoid centering titles or headings that breaks the pattern of scanning down the
    left side of the page.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_174_2.png)


    After your eyes can grasp the visual structure of the piece, it is to have clearly
    headings so you can quickly grasp what the section is about. Compare the three
    headings in Figure 7-3.'
