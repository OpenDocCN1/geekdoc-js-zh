  md: '# # How to Use This Book


    The book is written as a series of questions that a coach or consultant might
    ask of web designers and developers on behalf of a website owner. The questions
    take the form of “Have you thought about out?” or “Will you be doing such and
    such?; the answers in the book are intended to help you understand what good responses
    to those questions would be.


    I tried to make the writing and the structure of this book as user-friendly as
    possible. The writing aims to be clear and simple about complex topics without
    being simplistic, while the layout and design aim to present information clearly
    and make it simple to find what you need.


    Here’s a list of features to help you use the book:


    +   **Numbered questions**—These not only make it easier to remember where in
    the book is located but on the accompanying website you can easily enter the number
    of any question and be taken to the part of the site that contains updates, further
    information, and reader comments.


    +   **Prioritized questions**—Each question is given a priority level from 1 to
    4. This can be helpful when time and resources are limited, and you want to know
    where best to utilize them.


    +   **Organized by topic**—Questions are grouped by topic to make it easier to
    find all information about, say, search engine optimization.


    +   **Alternative organizations**—Special lists on the DVD provide some additional
    ways of ordering and grouping the questions.


    +   **Sidebars**—Tips, notes, warnings, and video references can be found in the
    side margins. Within the text you’ll also find the Rule of Thumb sidebar to help
    you remember key points.


    +   **Search terms are highlighted**—Throughout the text you will find suggestions
    for search phrases to find more information, designated with this symbol: 👍


    +   **Cross-referencing**—Each question also suggests additional questions within
    the book, and Appendix A contains additional reading material, off- and online.


    +   **Action items**—Each question finishes with action items to get you started.


    +   **Glossary**—There’s a comprehensive glossary in Appendix B, which is supplemented
    on the book’s website with useful links.'
  merge: -1
