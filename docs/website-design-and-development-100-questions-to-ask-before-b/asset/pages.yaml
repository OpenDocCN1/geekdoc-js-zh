- img_proc: true
  md: '# CHAPTER 3 E-MAIL


    Designating your e-mail account as the catch-all or default-address for you can
    fill some of the roles described for aliases, but there are good reasons not to
    take that approach.


    +   Common misspellings—If people regularly misspell the portion of your e-mail
    address before the @ symbol, you can set up an alias with the wrong spelling.
    That way the server won''t reject the address. For example, if your address is
    kimberly@mydomain.com and people often type it with an ''ley'', you just set up
    an alias kimberly@mydomain.com and point it to your e-mail address.


    A catch-all address means that any e-mail address can get through, whether it''s
    misspelled or whether there''s no account or alias. The problem is, unless you
    set up filtering, you can get a lot of spam because one tactic is to send dozens
    or hundreds of e-mails with common names, such as info@sales?. If you have a catch-all
    account, these will all get passed through.


    +   Throwaway addresses—It''s fun to sign up for things on the Internet (newsletters,
    offers, contests, and so on), but you don''t always want to give out your personal
    or primary e-mail address. Simply use an e-mail alias and then you can turn off
    the address if you''re getting lots of spam. Or if you''re running a test, it
    might be useful to have an e-mail address that you can delete when the contest
    is over.


    However, email aliases might not always be the best way to go. For example, many
    e-mail programs require your reply address to match the address of the e-mail
    account. Instance, if you have an e-mail alias myname@mydomain.com pointing to
    an account on your ISP''s server—myname@isp.com—your reply address would have
    to be myname@isp.com. That could get confusing, so you''d want to set up the address
    as an e-mail account rather than an alias.


    # On Video


    Watch how it can be to create e-mail accounts and aliases using a hosting control.


    # Related Questions


    +   17. Does your e-mail address use your domain name? Page 44

    18. Can you easily manage e-mail through your web hosting provider? Page 46


    # Action Items


    +   In your hosting control panel, familiarize yourself with how e-mail aliases
    are created. Look for mail forwarders, forward e-mail, or similar phrases in your
    menu. Creating one and test that it works.


    +   Keep a list of the e-mail aliases you create, listing where they''re directed
    and the purpose of the alias.'
