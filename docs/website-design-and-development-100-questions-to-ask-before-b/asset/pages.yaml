  md: '# 26. Will Images Be Used Effectively in Your Design?


    Images are a powerful part of a website''s design, but that power should be used
    for good and not evil. Images in a design complement the content of the site,
    not distract from it.


    For the purposes of this question, I want to divide design images into three groups:


    +   * Graphics

    * Photos

    * Elements (icons, divider lines, and so on)


    In all cases, one of the assumptions will be that the images add to the purpose
    and enhance the content by being relevant. The concern in this question is whether
    the images do so in a way that matters rather than hinders.


    Keep both the quantity and the complexity of graphics in your design to a level
    that does not distract. For example, if you''re an organization that promotes
    better housing, it might be true that you deal with all kinds of shelter, from
    houses to apartments to townhouses, but to have images of each type in your header
    can be visual overkill. If each image is also very detailed, you further increase
    the distraction factor. A simple outline of a roof might be enough to make your
    point, look good, and not draw your eye away from content.


    How do you know when to start taking away? One important criterion is your purpose
    and your content. In the housing example, if people aren''t aware that you deal
    with apartments, keep a drawing of an apartment in the design that is as simple
    as the roof outline.


    But there''s more to the principle of taking away than simply removing images.
    It can include taking away color (a monotone is less distracting than full color),
    lowering opacity (an image at 40 percent is less distracting 80 percent), or showing
    only a portion of a graphic, as the examples in Figure 4-9 demonstrate.


    Incorporating photos into your design is very important, in particular for quickly
    clearing your purpose and conveying the feel of the site. Except for the home
    page, keep photos in the design as small as possible. If photos are too small,
    of course, visitors will be distracted by trying to make out what''s in the photo.


    > Images that appear within content will be discussed in the chapter on content,
    and back-ground images for the site as are left to a separate question in this
    chapter.'
