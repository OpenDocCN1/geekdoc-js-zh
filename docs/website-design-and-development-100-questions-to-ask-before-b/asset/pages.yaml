  md: '# 42. How User-Friendly Will Your Links Be?


    Linking to other pages on your site or to others is one of the most powerful features
    of the Web, so it''s important to make it easy for visitors to identify and use
    links.


    The first point to consider with links is whether to display them with the conventional
    underline style. Because text can get cluttered when it''s underlined, some designers
    choose to display links using color alone. If you go this route, it can be helpful
    to display the underline style when the visitor mouses over the link, just to
    help confirm that it is a link.


    Coloring links is important because using the same color as the other text, even
    with underlining or bolding, is just too confusing to a visitor. Deciding what
    color to use must strike a balance between clarity and distinction. You need visitors
    to notice that is a link, but you don''t want it to overpower the rest of the
    text, particularly with long links or large number of links in a single paragraph.


    The color of links when you mouse over them should change in some way to reinforce
    that the visitor is on a link. This is a must if you''re not underlining at all,
    but if you style the mouse with an underline, the color change is important for
    catching people''s eye. The mouseover color needs to be enough of a contrast to
    indicate that something has happened; it''s best to use a shade of grey or a different-color.


    One of the most neglected aspects of link styling is to do with links that you
    have already visited. By default, if you specify a color for links, but not visited
    links, the same color will be used. It isn''t a conscious decision to distinguish
    visited links, but simply a lack of thinking about it.


    The idea behind visited links is to help users know where they have and have not
    gone. A great example of this is on a site''s Links page, in which there might
    be dozens and dozens of useful links. Knowing which ones you''ve been to can save
    a lot of time. Keep in mind that browsers can remember where you''ve been for
    months at a time, so if


    Importance


    > Avoid mixing and matching link styles. If you''re not underlining in the body
    of the text, keep that over other areas of the site.


    > If you don''t set a color for links, browsers automatically use theirs, and
    it might might not suit the look of your site.


    > Simply saying "click here" is not very userfriendly it offers a good description
    of where your link will take the visitor. For search engine purposes, it''s better
    to link the description rather than the click here.'
