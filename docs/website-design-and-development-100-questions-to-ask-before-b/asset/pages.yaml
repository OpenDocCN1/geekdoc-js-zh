  md: '# 99. Will You Be Collecting Sensitive Visitor Information on Your Site?


    More and more detailed information is being gathered from website visitors, not
    simply because of e-commerce but also because any data about visitors is vital
    to establishing relationships and providing more relevant content. It''s up to
    site owners to ensure that this information is protected in every way possible.


    > Rule of Thumb Do not store any type of important information online.


    To understand how easily unprotected information can be found online, look at
    the spreadsheet in Figure 10-5, which contains passwords and credit card numbers.
    This was found less than a minute with a simple search.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_311_0.png)


    Figure 10-5


    This spreadsheet was actually uploaded to a server, but it could just as easily
    have been the text file generated by a form on a website. The bottom line is this:
    You can''t have sensitive information stored online, however temporary it might
    be.


    That''s why it''s simplest to leave data collection to third parties. For example,
    by using a third-party shopping cart system, the collection of'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# 99. WILL YOU BE COLLECTING SENSITIVE VISITOR INFORMATION ON YOUR SITE?


    credit card information can be taken care of on their servers. Mailing list services
    handle the collection and storage of your data, instead of you having to install
    your mailing list program and dealing with the protection of the list once it''s
    collected.


    If you do plan to collect any sort of vital information from visitors (without
    storing it), keep in mind that the transmission of information poses as much risk
    as storage of it.


    When you send any information through your browser—submitting a form is one example—it
    is as public as the website data you download. That''s why browser encryption
    (the little lock you see at the bottom of your window when viewing pages starting
    https://) is important. It encrypts the data being transmitted through the browser
    so that anyone who grabs it can''t read it.


    To activate encryption, you need an SSL certificate for your website. There are
    various levels of certificates, each costing more but offering security. For a
    basic site, you can get certificates for as $70 per year, but carefully research
    what level of certificate you need and how reliable the vendor is. Some certificates
    do a very cursory check of the domain and therefore don''t provide a lot of trust.


    > Even if you leave sensitive data to a third-party site, you need to have a privacy
    policy that makes this clear to visitors.


    > If possible, use a secure URL for any login pages to protect passwords.


    The next security issue is this: How will you transmit the information collected
    through your form? A contact form, for example, would normally send its information
    to you by e-mail, but that''s not at all secure for sensitive information. You
    have to secure e-mail by using an encryption system like OpenPGP. It creates a
    key that you use with your form processing script and another key that you use
    on your e-mail client. The e-mail is encrypted when it''s sent and decoded when
    it arrives in your e-mail program.


    # Related Questions


    +   39. Will your forms be easy to use? Page 101

    67. Will you be selling online? Page 185

    69. How Will You Build Your E-mail List? Page 194'
  merge: -1
