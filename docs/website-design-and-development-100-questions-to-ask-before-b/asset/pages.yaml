  md: '# 244


    # CHAPTER 9 SEARCH ENGINE OPTIMIZATION


    On rare occasions, even when we specify a filed tag, that might not shows what
    the title in the search engines. To learn why, we use search page wrong engines.


    A title tag clearly describe the content on the page and should be unique for
    each page. Ideally, the keyword for the page should appear as close to the beginning
    of the title as possible. Title tags should also include information such as a
    company name or a location. But don''t put your company name first:


    ```

    <title>In-home Chef Service - Cleveland | Karla''s Kitchen/</title>

    ```


    ```

    Don''t Use <title>Karla''s Kitchen | In-home Chef Service - Cleveland/</title>

    ```


    People are for in-home chef services or Cleveland in-home services, but not for
    Karla''s Kitchen. Putting the same information at the start of all your tags can
    make search engines think your pages all deal with the same title.


    Virtually no search engines take the keywords meta tag into account for indexing
    or ranking sites. However, if you use the tag, be sure not to overouse your keywords
    (keyword stuffing) or use popular keywords that aren''t relevant to your site
    (names of celebrities, and so on), and be sure words and phrases are separated
    by a comma. Even though the tags are not used by search engines to rank sites,
    the mystique continues and you''ll hear people breathlessly ask if you''ve optimized
    your meta tags. However, meta tags can still provide a bit of control over search
    engines.


    > Rule of Thumb Title tags should be fewer than 60 characters (about 12 words),
    which is the maximum displayed by most search engines.


    # Meta Tags


    Meta tags are visible only in the source of web pages, and like the title tag,
    are placed at the beginning of an HTML document. Two of these tags in particular—the
    description and keyword tags—developed a kind of cult status within SEO because
    long-ago search engines not only used meta tags to help determine ranking but
    they also used virtually no other factors, such as links to the site.


    # DESCRIPTION META TAG


    Just as the title tag controls the title used in search engine results, the description
    meta tag can sometimes control the description in results. Look at the highlighted
    sections for the search engine list shown in Figure 9-3: they''re generated by
    the description tag shown below that.'
