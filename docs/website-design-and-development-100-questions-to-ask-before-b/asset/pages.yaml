    the rest of the page from loading. Some unclosed tags are clearly visible in your
    browser (why is this page bold starting halfway down?; but many aren''t or they''ll
    produce a problem that isn''t directly related to the tag.


    However, putting your site does not tell the whole story of whether your HTML
    is search-friendly. For instance, a validator does not tell you you should use
    a heading instead of a bold tag to highlight sections of your content. Both tags
    will validate, but only the heading is useful to search engines in terms of telling
    something about the importance of the text. Similarly, validators will not tell
    you that it is a mistake to use the <h1> tag more than once on a page.


    Semantic errors in your code—errors that make meaning unclear—need to be checked
    by looking at the source code of a page. That''s how you can make sure sections
    of text are designated with the correct headings; or how you can tell whether
    the page is laid out with tables or easier-for-robots-to-read, more efficient
    style sheets. As well, you can check to make sure robots don''t have to sift through
    JavaScript or style rules that belong in separate pages, not in the HTML file.


    > Use HTML entities instead of characters. Search engine robots can be stopped
    in their tracks by characters as # or |, but they may read the HTML equivalents
    (entities) &#23 and &amp; just. You check the code of your site to see whether
    your designer has used properly.


    # Related Questions


    +   49. Will you use tags or style sheets to lay out your site? Page 126


    +   50. How effectively will style sheets be used on your website? Page 129


    +   52. Will your HTML be bloated? Page 134


    +   59. Will your written content be correct, clear, and well structured? Page
    153


    # Action Items


    +   Check your site in the HTML validator and look for serious errors.


    +   Look at the HTML code of your pages to make sure that headings are being used
    and used correctly.'
