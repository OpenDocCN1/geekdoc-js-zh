  md: '# CHAPTER 8 MARKETING AND PROMOTION


    # 79. Will Paid Online Advertising Be Part of Your Marketing Plan?


    # Importance


    Although the Web is filled with marketing and promotional opportunities that require
    more time than money, paid advertising can still have an important role in any
    web marketing plan. This answer deals with paid search listings and then with
    others of paid ads.


    If 50 percent of visitors to websites come from search engines, it''s important
    to remember that many of them arrive through search listings. Depending on the
    search engine, this can be as much as 50 percent of the traffic.


    Just to be clear, paid search does not mean that you''re buying a listing in the
    search engine itself. The organic results highlighted in Figure 8-10 are based
    solely on the formulas that search engines use to rank, whereas the paid listings
    are displayed in places outside the search results.


    Paid search ads can be very useful when you''re launching your site and your search
    engine optimization (SEO) efforts haven''t had time to kick in.


    +   - News

    - Shopping


    +   - More searches


    Some different ideas might be:

    - cookies

    - pickles

    - potatoes


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_239_0.png)


    Google has the lion''s share of search traffic, which means ads on its system
    cost the most. Try smaller search engines like Bing to see if you can get results
    for a lower price.


    # FIGURE 8-10


    Search advertising uses a per click model: you only pay when someone clicks your
    ad. The cost for that click is determined through a bidding process. Generally
    speaking, the higher you bid, the higher you appear on the page (although services
    like Google Ads also take into account your click-through rate, so even if someone
    bids more than you, you could appear first because it has a better click rate).'
