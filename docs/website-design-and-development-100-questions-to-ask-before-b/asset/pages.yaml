- img_proc: true
  md: '# 93. HOW WILL YOU BACK UP YOUR SITE?


    > **Rule of Thumb** Never store copies of your site files and databases on the
    server where your site is hosted.


    Offsite storage of backups clearly is a must, and you have lots of options for
    storing them:


    +   - Your computer, as I''ve mentioned, is the simplest choice for most people.

    - At-home storage, but not on your computer, includes external hard drives, take
    back ups, or DVDs.

    - Your hosting company might offer backup storage in a different location than
    the server hosting your site.

    - There are backup services that provide storage.

    - There are online storage services such as Amazon S3.

    - For small sites, you can even use something as simple as having backups e-mailed
    to a free e-mail account that has lots of storage space, such as Gmail or Yahoo!


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_294_0.png)


    # Storing a Copy of Your Backup


    Wherever you store your backups offsite, the key is to keep a second copy in yet
    another location. It''s good to spread your risk. For example, if you''re storing
    backups on your home computer, have another copy on an external hard drive. If
    you use an online storage service, regularly download a copy of the backup to
    your computer. It doesn''t take a lot of time, and the cost of storage is negligible,
    but when your server goes down and your computer crashes at the same time, you''ll
    be glad for the second backup.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_294_1.png)


    > **Rule of Thumb** Always have a backup of your backup stored in a separate location.'
