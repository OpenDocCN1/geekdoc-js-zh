  md: '# Writing Content


    When done properly, writing with search engines in mind should not only sound
    natural, it should actually be clearer for visitors. Here are two of the most
    important elements of writing for search engines.


    # KEYWORDS IN CONTENT


    Having emphasized the importance of keywords in SEO, the risk is that people let
    this color their writing. They think the more a keyword is used, the better the
    ranking. Writing and editing becomes an exercise of hitting so-called magic numbers
    on a keyword density analyzer (it measures the percentage of keyword mentions
    to all other words on the page).


    > Rule of Thumb Write for your audience, not for keyword density analyzers.


    Forget magic numbers and write your pages so that they clearly communicate a message
    that will benefit visitors in some way. SEO is left to the editing stage, when
    you can stand back and look for opportunities to use your keyword more, but without
    overusing it.


    One way to avoid repeating keywords too much, but still keep your page focused,
    is to use variants of the keyword—remember longer keywords you left off your final
    list! In fact, these related keywords are an important part of long tail optimization.


    If the keyword for one of your pages is "patio tables," use the longer keywords
    you found, such as "outdoor patio tables," garden tables. Fewer people search
    for them, but because they''re searching for something more specific, they might
    be better prospects. And you won''t drive your visitors "patio table crazy.


    Section headings are also useful places to work in your keywords. Not only will
    the keywords be in HTML that they be flagged as important for the search engines
    but your visitors will also see them easily as they scan the page.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_269_0.png)'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# DESCRIPTIVE LINK TEXT


    The wording of text for links within your content—the anchor text—is important
    to SEO in two ways:


    +   - To decide if the link is relevant to the focus of the page


    +   - To explain what content will be found when the link is clicked


    If the anchor text for a link just says “click here,” it isn’t helpful. Make sure
    the text clearly describes what the link is about: “snowshoeing article in National
    Geographic.” Notice the keyword at the start of this description. If the link
    is on a page about snowboarding, that’s great, but even on a page about winter
    sports it will be clear that the link is relevant (and not trying to sell a time-share).


    Notice both of these criteria need to be in agreement. A well-described link that
    goes to the wrong sort of site is bad for visitors: a poorly described link that
    goes to a good site, although marginally better for visitors, is still not optimal.
    Any disconnect between the anchor text and the linked site is a negative to the
    search engines because it means the visitor isn’t getting the best experience
    possible.


    # Related Questions


    +   - 42. How user-friendly will your links be? Page 109


    +   - 58. Will the content of each page have a single focus? Page 151


    +   - 59. Will your written content be correct, clear, and well structured? Page
    153


    +   - 60. How effective will your content use links? Page 158


    # Action Items


    +   - Review your site map for its effectiveness based on your keyword list. Add
    all links between pages so you can clearly see the relationships. Look for alternative
    or additional site structures.


    +   - Review the text of each page of your site. First, if a visitor read only
    the first paragraph, would they get the main message of that page? Second, does
    your keyword for that page appear near the start of that first paragraph.'
