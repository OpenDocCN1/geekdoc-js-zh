  md: '# 40. What Happens if a Page on

    Your Site Does Not Exist?


    If you move or change the name of a page after launching your site, you should
    create a 301 redirect and not simply allow the server to generate a 404 error.
    For details, search on the phrase 301 redirect.


    If visitors mistype a page URL, search for something that''s not on your site,
    or try a link that no longer exists, they will be stuck and then move to a different
    site?


    Known as a 404 error, this is the way HTML handles files that can''t be found
    on a server. If there are no instructions on the server, a visitor''s browser
    will generate messages like the ones in Figure 5-15, which everyone has at one
    time or another.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_123_0.png)


    An unexpected construction on a page is almost worse than a generic 404 error
    because you''ve knowingly led the visitor to an empty page. If a page has no content,
    don''t have it on your site. Or, use it as a promotional opportunity and gives
    visitors a good taste of what''s coming on that page—at least they won''t feel
    it''s a wasted click.


    FIGURE 5-15


    The problem is that you''re left with no choice but to press your browser''s back
    button, and usually means returning to a search engine or other.


    The alternative is to create your own 404 error page happily keeps visitors on
    your site. In order to do that, however, your server needs to know which file
    to use for the error page. Some hosts have already set up, or your hosting control
    panel will automate the process—check with your hosting provider. It''s also possible
    to make the server changes yourself, but have to know what you''re doing. To read
    up on manual changes, search for the term custom 404 page.


    When it comes to designing the 404 error page, it''s simplest to make it like
    all your other pages, with full navigation, as shown in Figure 5-16.'
  merge: -1
