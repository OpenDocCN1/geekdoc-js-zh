  md: '# 101st Question


    It was once popular to name books 1001 or 101, but I always found that a bit gimmicky,
    so I deliberately stayed away from using 101 in the title. How-ever, late in the
    writing process I realized that there was an all-encompassing question I hadn''t
    addressed in the book: Why do you want to build a website?


    I''d taken it for granted that this is a book about building websites. But because
    the goal is to raise questions and avoid wasted time, energy, and money, it''s
    crucial to ask why you''re building a site in the first place. So that''s the
    101st question of the book: Why?


    In this increasingly web-oriented world, it''s easy to shrug off the question
    by saying everyone needs a website and leave it at. The answers to the question
    are important for you, the website owner, because they help shape the nature and
    growth of the site, as well as provide a way of judging the success of the site.


    I say answers because you can and should have several reasons for building a website,
    and they fall roughly into two camps:


    +   - Outcomes you expect from your site


    +   - Tasks you expect your site to perform


    # THE PURPOSES OF YOUR SITE


    Maybe you expect your site to make you more money, convince people of your point
    of view, get more fans, provide support for existing customers, unite people who
    share your interests, or accomplish any number of purposes. You might expect your
    site to achieve several of these goals, but whatever the case, it''s crucial that
    you have these purposes clearly in your plan, execute, and grow your site.


    The best way to have your purposes clearly in mind is to write them down. Six
    months down the road, let alone six, you might alter those purposes, however slightly,
    to suit the circumstances of the moment and convince yourself that these had been
    the purposes all along. The written word can help keep your minds.


    As you compile a list of purposes, some will be immediately obvious, but it''s
    important not to stop there. Keep thinking and writing. Don''t question or second-guess
    what comes up to you: write it down. And get specific. In a sense, wanting to
    get more new customers is the same as wanting to make more money,'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'by yet being more specific, it''s a goal that''s easier to measure and one
    that gets closer to deciding what tasks your website must perform. Which brings
    me to the second type of answer to the question: Why do you want to build a website?


    # THE TASKS YOUR SITE MUST PERFORM


    A website is a communications tool you''re building to help achieve the goals
    you''ve set, but it''s a communications tool unique in the history of the world
    because it can perform a variety of tasks that no before it could have hoped to
    perform on its own. In fact, a website can be virtually communication tool that
    ever existed, and then some.


    A website can be a diary, brochure, book, television, telephone, radio, slideshow,
    billboard, business card, and so on. Not only that, but it can be all of them
    at the same time, or it can be now and others later. And a year from now it could
    be something no one has thought of.


    However, all this power and flexibility can be a bit daunting. Even when the purposes
    of your site are clear, you face a myriad of choices for accomplishing those goals.
    Code, time and money will limit everyone, but that still doesn''t resolve the
    question of exactly which tasks your site should perform; What kind of communications
    tools it should be. You''ll need to look at which tools are best for reaching
    your audience.


    Then there''s the problem of peer pressure. Everyone will have their opinion of
    what your website should do—you''ve got to have a blog; video is an absolute button
    that is so cool. It''s like having a TwLinked account: a whole lot of relatives
    telling you what you ought to be when you grow up. When you''re dealing with something
    new, that kind of pressure can be real.


    Let take off some of the pressure. It''s just fine if your website is a static
    one-page "business card" as long as it''s professional-looking, gives a good description
    of your website, has contact information, and so on. In other words, it makes
    it a good online business card. Of course you can''t expect such a website to
    do for you, but at least you''ve started a web presence.


    After reading this book, I think you will understand why you shouldn''t leave
    your website as a business card for very long. But it''s important that you make
    decisions like that for good reasons rather than everyone says so.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# STARTING TO PLAN


    Once you''ve got your purposes in mind and the tasks your site will need to perform,
    you can begin the process of planning the site.


    Don''t worry at this stage about organizing anything. Just write down messages
    you want to convey on the site: Describe your window cleaning services: explain
    how your sand-blasting process is revolutionary: how you can help homeowners to
    sell their house.


    Some might be a single page on your site: others might involve several pages describing
    different aspects of the message. Or you might find that the message is too general
    and there are actually several messages behind them.


    The rest of this book will help you develop and refine this plan, but getting
    the basic ideas on paper as soon as possible is extremely valuable. You''ll get
    more out of this book the more you''ve given some thought already to what you
    want your website to do.


    # Accompanying Videos on DVD


    The Web is dynamic, and printed pages have limited space, so video is a great
    way of showing dynamic content as well as providing additional ideas and comments.
    Most questions have an accompanying video for which a brief description is provided
    in the book as well as on the DVD menu.


    # Errata


    We make every effort to ensure that there are no errors in the text or in the
    code. However, no one is perfect, and mistakes do occur. If you find an error
    in one of our books, such as a spelling mistake or faulty piece of code, we would
    be very grateful for your feedback. By sending in errata you might save another
    reader of frustration, and at the same time you will be helping us provide even
    higher quality information.


    To find the errata page for this book, go to www.wiley.com and locate the title
    using the Search box or one of the title lists. Then, on the Book Search Results
    page, click the Errata link. On this page you can view all errata that has been
    submitted for this book and posted by Wiley editors.'
