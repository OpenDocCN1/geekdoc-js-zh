  md: '# 5. Who Will Register Your Domain and in Whose Name?


    Although registering a domain name is straightforward, some people are not comfortable
    doing it or they''re too busy, so it''s uncommon for a web designer or a company
    to register a domain on behalf of their client. If you''re having your domain
    name registered, there are several steps you''ll want to take to make sure that
    the domain remains under your control.


    At the very least, you should be listed as the registrant: Use your mailing information,
    your e-mail address, and so on. The registrant is the one who controls your domain
    name: administrative, technical, and billing. Usually all four contacts are the
    same, but it can be useful to the person or company helping you listed as the
    technical contact. That way they have authority to talk to the registrant if there
    are technical issues to be resolved. The key is to be listed as the registrant.


    Of all the information listed for you registrant, the most important is your e-mail
    address. It''s used for a number of crucial tasks:


    +   - Notifying of the domain''s expiration date

    - Sending approval requests you want to transfer to another domain registrar

    - Sending password information you should ever lose your password


    Once the domain name has been configured so it''s pointing to your server and
    your website is functional, you should change the password for your domain manager.
    You can always supply the designer or company with this new information they need
    later to help you with the domain name. What you don''t want is discover a year
    later that some former employee has access to your domain and goes in and changes
    the registrant e-mail and password, thereby taking control of the domain.


    If you''ve had a domain name registered, but you don''t have any of the login
    information for the domain, do what''s called a whos search at


