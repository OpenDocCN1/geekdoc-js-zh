  md: '# 35. Will Your Navigation Menus Be Easy to Use?


    Much of the value of websites lies in their ability to connect vast amounts of
    information, both on the site and on the Internet. Within a website, good navigation
    makes it easy for visitors to find the information they need, and all of the navigation
    tools, menus are the most important.


    In discussing site layout, I stressed how crucial it is to have your navigation
    where people expect it to be and in the same place on all pages. Now I''ll show
    you some other design factors that can affect the usability of your menus.


    # The Real Work Is in Site Organization


    Navigation will only be as good as the ways you can think of present your content.
    Consider the different ways your material can be connected. Don''t limit yourself
    to the way you''re organizing the actual site files. There needs to be a logic
    to that organization, of course, but your navigation can reflect other ways of
    organizing as.


    > Another benefit of all your work with site organization is that you''ll have
    a much more effective site map, which is an important aid to navigation.


    +   Rule of Thumb Key information on a site should never more than three clicks
    away.


    The primary goal of any navigation menu for sites with more than a few pages is
    to lead the visitor from the general to the more specific. This drilling-down
    process is well illustrated on large sites. On the Wal-Mart site, for example,
    I begin with Outdoor Living, which takes me to Lawn & Garden, then to Outdoor
    Heating & Lighting, and finally to Patio Heaters. There can be several ways to
    get your visitor to Patio Heaters, but it always begins with a more general topic—say,
    Patios and Decks. The more ways visitors can get to your material, the more likely
    they are to find it.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# The Look of the Main Menu


    It''s worth mentioning again some points discussed in the design chapter. The
    main menu should stand out from the look of the rest of the site, but not so much
    that it is distracting. That means using colors that fit the site''s color scheme
    and avoiding the use of graphics that make the menu hard to read. 5-1 shows some
    examples of poorly-designed menus.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_108_0.png)


    FIGURE 5-1


    Be sure that the names of menu items are easy to read: Use a clear font, sized
    large enough, with good color contrast.


    > Rule of Thumb Don''t use graphics for the text of your menus.


    If your menus use text controlled by style sheets rather than relying on graphics,
    you can quickly make adjustments to the font, size, and color during testing or
    any other time. It also saves time and money down the road when adding new pages
    or changing the name of a page—you don''t have to create any graphics.


    > You can still have graphics behind the menu text simply by using style sheets
    and specifying an image for the background of the text.


    # Main Menu Structure


    To avoid overwhelming visitors, it''s best to limit the visible items on any navigation
    menu to about seven, which means that if you have more than seven pages on your
    website, you''ll need some options.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# CHAPTER 5 USER EXPERIENCE


    # Horizontal vs. vertical main menus


    It common years ago to place main menus vertically in a left sidebar, but today
    new sites use a horizontal structure at the top of the page. There are a number
    of good reasons for this, but one of the most important is that vertical menus
    on the left are a distraction from visitors scanning down the content of the page.


    One argument for vertical menus is that they make it easy to add new pages and
    are not limited by the width of the site. However, menus with too many choices
    are confusing. Vertical menus should generally be left to secondary menus, as
    products, blog categories, or subpage listings for an area of a site.


    For more on the debate, use the term horizontal vertical navigation.


    One option is to display submenu items when you click to a page on the main menu.
    The submenu might be on a sidebar or below the main menu, as shown in Figure 5-2.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_109_0.png)


    FIGURE 5-2


    Because visitors cannot see the submenu unless they click through, this approach
    is best suited to situations where it''s clear that visitors are likely to take
    only one path. For example, on a real estate site the main menu might include
    two items: Buyers and Sellers. Visitors know which category they fall into, so
    they''ll click that item without knowing what''s available under the other.


    More and more large sites are taking this approach. To use the example of a newspaper
    or magazine style site, you don''t need to see all the choices for the Sports
    on the main menu. You know what Sports, so click that, and all the subpages are
    for sports.


    > Rule of Thumb Your main menu should be horizontal with no more than seven to
    ten visible buttons.


    For websites with fewer than say, 20 pages, it probably makes sense to make all
    your choices available all the time. This is particularly true for new visitors
    who are not familiar with what''s on your site and you don''t want them to have
    to dig too hard to find it.


    One option for all or most of the pages on the main menu is to use what calls
    a inline menu. It displays a second navigation bar with bars for the item you''ve
    moved over, as shown in Figure 5-3 A. It is important to have this secondary menu
    in a different color or at least a very different shade so that visitors can distinguish
    from the main menu.


    Using cascading sheets (CSS) to create the mouseover effects for menus is efficient
    and flexible method. If you use JavaScript for effects like drop-downs, make sure
    the files are not inadvertently written (that is, very large).'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# 35. WILL YOUR NAVIGATION MENUS BE EASY TO USE?


    Revealing subpages on mouseover is more commonly done, how-ever, by using drop-downs
    (or flyouts with vertical menus). These types of menus—illustrated in Figure 5-3
    B—allow you to show several subpages at one time, plus your design does not have
    to include space for a second navigation area.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_110_0.png)


    # Rule of Thumb


    Avoid having more than three levels of drop-downs.


    The trick with drop-down menus is not to get carried away. Many scripts for these
    menus allow four, five, or even six of drop-downs, but after a point it becomes
    extremely confusing and hard to use (you have to try to keep your mouse in the
    right spot for fear of losing all those levels you accidentally move your mouse
    wrong).


    # Footer Menus


    Having any navigation in the footer is visitors come to expect. This is particularly
    handy when you have more than a screen''s worth of content on the page.


    Footer menus tend to be used for housekeeping items such as contact information,
    privacy policies, advertising information, or terms of use. On smaller sites,
    you might want all your pages on this menu—or at least some key ones. Of course,
    a link to the home-page should always be at the left side of the footer menu.


    > It''s not necessary, but it can be helpful to show a small arrow or other sign
    that a menu item has subtitles. This was very common in the early days of drop-down
    menus, but people have become so to mousing tabs to see whether there''s any longer
    crucial.


    > A link takes back to the top of the current page is also a nice courtesy item
    on a footer menu.'
  merge: -1
