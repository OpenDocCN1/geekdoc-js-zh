    +   - Headlines at the top linking to each item


    +   - At least one action item (buy, fill out, sign up, make a booking)


    +   - Your contact information, including links back to your website


    +   - Invitation to pass along the newsletter to others who might be interested


    +   - A reminder why the person is receiving this e-mail


    +   - An unsubscribe link


    > Rule of Thumb The subject line or at least from the field of an e-mail should
    include a consistent identifier, so subscribers know who it''s.


    One other important element of any e-mail newsletter is the subject line, which
    will get subscribers to open the e-mail. Take your compelling item in the mailing
    and write a short, clear, enticing headline for the subject.


