  md: '# 49. Will You Use Tables or Style Sheets to Lay Out Your Site?


    Implementing your site''s layout in HTML can be done in one of two ways: using
    a table structure or cascading style sheets (CSS). This is why you should build
    it using CSS.


    # A Bit of History


    In the earliest days of the Internet, web pages were essentially bodies of text,
    broken up by headings and paragraphs with some images from time to time. Life
    was simple. There were also things called tables that people used to lay out information
    the way they were doing in spread-sheets: in rows and columns.


    Then people realized you could use tables to structure content in more complex
    ways. You can have text in one column, other text in a second column, and then
    text in a row that spans both columns.


    Come the next idea of nesting one table to get even more complex layouts. Before
    long, pages were much more organized, easier to read, and had many more elements
    to them. But behind the scenes you''d had referred to as ugly code—tables within
    tables within and things called spacers. Spacers are tiny block graphics that
    are resized with HTML to create space on the page.


    Enter the CSS, which allowed you to tell how they should display on a page, including
    how they''re laid. As CSS became more sophisticated and, most importantly, browsers
    got better at uniformly applying CSS rules, the need for tables to do page layout
    all disappeared. And that''s where things stand as of the writing of this book.


    But replace tables?


    +   Tables are very hard to work with anything more than the most basic layout.
    Searching through the code of multiple nested tables is very time consuming, plus,
    for example, you need lots


    > Importance

    Tables remain useful for organizing what''s called tabular content—statistics
    and so on.'
