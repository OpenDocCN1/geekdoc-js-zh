  md: '# 37. Will Visitors Easily Know How to Stay in Touch with You?


    Websites allow you to start a dialogue with your visitors using a variety of tools.
    But you have to make it easy for visitors to find those.

    The most common way to help visitors get in touch is a contact button somewhere
    in your navigation structure. There are two main schools of locating your contact
    button: at the end of your main navigation or in a smaller number near the main
    navigation. Examples of each are shown in Figure 5-5.


    | Documentation | In the News | Our Clients | Contact |

    |---|---|---|---||

    | Affiliation | How to Help | | |

    | Your Self Publishing Guide | Request Questions | Cell | |

    | Office locations | Group websites | Contact us |

    | Resources | Links | Contact | PERSPECTIVE ABOUT US Sign in to online services


    Figure 5-5


    The idea of the secondary menu is to separate housekeeping elements from actual
    content items as well as to keep the size of your main menu. However, if you have
    only three or four content menu items, it''s probably best to put all pages on
    one menu. Which method you choose, the contact link should also be on the short
    menu in your footer.

    Social media is another crucial way of staying in touch with your visitors, so
    make links to your accounts are always visible (links that encourage people to
    share your content using social media are covered in a later chapter). Figure
    5-6 shows some examples of prominently displaying your social media links.

    New methods are also being devised for displaying contact information, so keep
    an eye out for how to improve your site. A recent trend for social media links,
    for example, is to display a thin box at the bottom of the browser window covering
    the regular content, as shown in Figure 5-7.


    > If you deal with the public, it''s handy to show your general contact information
    on all pages, usually in the sidebar or the footer. Include the address, phone
    number, hours of operation, and so.


    > You can also display the latest feeds from your social media accounts, but if
    you do, make sure you keep up those feeds or it can look bad to have information''s
    a month old or older.


    > Don''t get too fancy with icons for your social media—you want visitors to quickly
    know what you''re linking. Use standard logos.'
