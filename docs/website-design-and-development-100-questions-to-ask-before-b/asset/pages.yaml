  md: '# 21. Who Will Design Your Site?


    To help answer this question, it''s important to understand that web design is
    a lot more than making a site look good. This common misconception confuses one
    of the tools of site design—visual appeal—with the actual goal, which is to effectively
    communicate whatever the website is required to do: entertain, sell, convince,
    inform, and so on.


    Web design requires expertise in designing graphics and text, laying pages, and
    translating it all into HTML and CSS. Keep in mind when considering who will design
    your site, some alternatives for you are summarized in Table 4-1.


    TABLE 4-1: Alternative Methods for Designing Your Site

    | METHOD | ADVANTAGES | DISADVANTAGES |

    |---|---|--|

    | Hire a web designer. | Your site is customized exactly the way you want it,
    not just in design, but in layout and function. All elements of design can be
    covered. You can get advice on alternatives. | Can be costly. If the designer
    is not good with web implementation, you''ll need extra help. |

    | Get a site template. | Low cost. A well-built template gives you the experience
    of a good designer. Coding is already done. Customization is possible. | Customization
    requires design and HTML knowledge. Even a template includes several layouts,
    they probably aren''t exactly what you need. No one to help make decisions. Can''t
    always check the HTML before you buy. |

    | Get a templated site. | Low to no cost. Last to implement. | Little to no flexibility
    in design or layout. If you leave the host, you can contain content but design.
    No one to help make decisions. |

    | Do it yourself. | No labor costs. | Very steep learning curve. High time costs.
    Unless you have the programs, you might need to buy software. No one to help you.
    |'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'Whichever route you take, you''re the one who will be making the final decision
    on design, so it''s important to know what to look for and what questions to ask.
    This includes the process of evaluating sites you see on the Web—what you like
    and what don''t like. The questions in this chapter will help you with that evaluation
    as well as the process of evaluating your own design at every stage.


    Be honest about the real costs of each of the possible ways to do your site design.
    For example unless you''re handy with design programs, the learning curve to generate
    a site mockup might be very costly in time, or the cost of your site looking like
    another template might outweigh the cost of hiring a designer.


    Rule of Thumb Use a web designer. Even if you begin with a template, you''ll probably
    need at least some customization and some-one to make sure the design is properly
    implemented in HTML.


    # Related Questions


    +   22. Will the design of your site support your content or distract from it?
    Page 52

    23. Will your site design layout make your content clear? Page 55

    31. Will site design display well in different browsers? Page 76

    47. Will your site be static or dynamic? Page 122

    49. Will you use tables or style sheets to lay out your site? Page 126


    # Action Items


    +   * Start a list of sites whose you like. Begin with sites in your field, but
    also look for designs in radically different fields. Even if there''s only one
    element about the site that strikes you, bookmark it and make a note. These sites
    will be helpful no matter route you take for- your site.

    * When adding to your list, look at sites with different glasses on. One time,
    choose yourself just 6 sec-onds to decide whether you like each site''s design.
    Another time, choose designs based on how easily you can find information such
    as a phone number, or compare sites based on how easily you can read text.

    * Ask friends and colleagues how they got their site designed. What was it working
    with the de-signer? How did it work out using a template? How flexible was the
    site-building system they used?'
  merge: -1
