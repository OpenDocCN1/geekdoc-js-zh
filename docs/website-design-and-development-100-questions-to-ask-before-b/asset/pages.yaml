  md: '# 76. Do You Have a Plan for Getting Important Sites to Link to You?


    Links to your website—inbound links are the second most important part of search
    engine rankings, but of course they''re great traffic generators in themselves.
    Some links are more valuable for getting traffic than others. Your web marketing
    plan needs a strategy for getting a link from these sites.


    > Rule of Thumb Be a site that others will want to link to.


    Whether other sites link to you of their own accord or whether you actively seek
    a link from them, your site needs to be one they''ll gladly link to you. In other
    words, make sure that you have something to offer. That''s the most important
    step for getting any inbound links, including great ones.


    What makes an inbound link great? It comes from a related, authoritative, high-traffic
    site (a closely related to your topic that is ranked highly by the search engines
    and has a lot of visitors interested in your topic). Simply being related to your
    site, then, is not enough to make a link great. Having a link from any related
    site would be nice, but focus your efforts on the very important sites.


    How to pick great sites and how to approach them for links—these are the two centers
    for inbound linking.


    You know your field best, start by making a list of the most important sites.
    Then, do a search on relevant keywords and find the top sites. Then, enter sites
    into a service such as Yahoo! Explorer (you need a free Yahoo! account) to see
    who''s linking to them, as shown in Figure 8-9.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_232_0.png)


    The focus is here on getting particular sites to link to you. Of course, you''ll
    make it easy for anyone who wants to link to you. Have site bookmarking available,
    put "link to this" instructions on your articles, and so might get a few links
    (who know what traffic get). At the very worst, you''ll get penalized by search
    engines for trying to manipulate your rankings. Because there are much more effective
    ways to spend your time and money, you should stay away.


    With services called Link Exchanges, you add your site, and others in the exchange
    link to you, and vice versa. At the very best, you might get a few links (who
    know what traffic get). At the very worst, you''ll get penalized by search engines
    for trying to manipulate your rankings. Because there are much more effective
    ways to spend your time and money, you should stay away.'
