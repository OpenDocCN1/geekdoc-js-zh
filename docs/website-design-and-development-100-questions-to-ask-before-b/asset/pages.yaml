    - A public talk you''ve given

    - A sample coaching session for your mentoring business

    - An interview with a well-known leader in your yoga community

    - A sample song from your CD


    > Avoid having video and audio files play automatically; instead, let visitors
    choose.


    > Always give a good text-based description of what''s in a video or an audio
    so that visitors and search engines understand the basics of what''s on the video
    without having to view it.


    If you enjoy the audio format and have lots of material to present, you can turn
    that into a podcast (the loose term for any regular or somewhat regular audio
    placed on the Web). A podcast can be as straightforward as putting up a weekly
