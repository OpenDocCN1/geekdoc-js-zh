  md: 'A privacy policy is not simply for sites that sell online or collect information
    through forms (newsletter signups, quotations, and so on). Your site might use
    cookies (small bits of code stored on visitor''s computers), and you''re not even
    aware of it. There''s information generated by people''s browsers that has the
    potential to be collected and stored. Even the statistics you compile—no matter
    how anonymous they be—need to be addressed by a privacy policy. For help writing
    a privacy policy, use this search term: website policy sample.


    Terms and conditions pages to be addressed with online selling, but most websites
    can benefit from making clear just a few terms or conditions. What are the conditions
    of your services should someone hire? What are your offline shipping terms? What
    are the terms for using material on your website? These are kinds of frequently
    asked questions, but put in more legal terms.


    > It''s worth running policy pages past a lawyer if you have any concerns about
    exactly you should be saying.


    # Site Map


    A site map is a set of links to every page on your website. On larger sites, it''s
    probably the only place where you can get to any page from one spot.


    If you have fewer than 10 pages, a web page with your site map on probably isn''t
    necessary (although it can''t hurt). Past 10 pages, a site map page can be very
    helpful as a guide for visitors. In particular, it''s a great place to link to
    your error page (when visitors have tried to get to a page that doesn''t exist
    on your site). And when you have a great many pages, it can be helpful to have
    a hierarchical site map such as the one in Figure 7-19.


    This makes it easier for visitors to see the relationships between pages and not
    have to hunt through to figure out the section they want.'
