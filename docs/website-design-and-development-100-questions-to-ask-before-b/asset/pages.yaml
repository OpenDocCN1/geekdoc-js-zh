    of your own site.


    # Audio


    Audio provides a unique opportunity for connecting with your audience because
    it''s both intimate and less demanding of your audience''s attention. People can
    listen to what while they''re doing something else on their computers. With downloaded
    audio they can listen while driving, exercising, doing chores, and all of which
    can greatly extend the reach of your content. Here are some examples to get you
    thinking how to use audio:


