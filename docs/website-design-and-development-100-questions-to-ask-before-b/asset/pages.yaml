  md: '# 61. WILL YOU EFFECTIVELY USE IMAGES IN YOUR CONTENT?


    # Be Real


    Sometimes stock photos of people might be your only option, but whenever you can,
    use photos of real people—people in your organization, your clients, and so on.
    As long as the quality of the photograph is reasonable—visitors aren''t struggling
    with poor lighting or blurriness—people want to see you and your world, not a
    bunch of models playing-acting.


    # Show Activity


    When possible, use action shots of people. Instead of a picture-self standing
    at a trade show booth, use one that you demonstrates something or talking with
    someone. Even action shots of objects (a car moving instead of sitting in a driveway)
    or animals (a lion crouch instead of lying) can be more compelling, depending
    on the point of the image.


    An image might support the page''s primary idea, but if there are already four
    other supporting images on a fairly short page, for example, you might be overloading
    the visitor visual. Consider creating a gallery of thumbnails for the page or
    setting a single rotating image. Or simply ask yourself if you need all those
    images. If you have a very long page with lots of images, it could be broken up
    into several or different related topics?


    # Get the Right Proportions


    Even the right photo in the right place can be less effective if it''s not sized
    effectively. This is a matter of keeping the proportions right. For example, if
    an image will squeeze the text around it and make it hard to read, that''s a distraction.


    In Figure 7-6, in the left pane, you can see an image forcing the text into a
    tiny column. Making the image smaller can help with the text, but you also don''t
    want to make it difficult to see what''s in the image, as shown in the middle
    screen. In this situation, it makes sense not to wrap the text at all and inset
    the image to the width of the text as shown in the right screen of Figure 7-6.


    > Clip art is the term used for stock drawings and illustrations you can find
    both online and off. Be sure to use quality clip art. Limit the Quantity


    > Resizing an image is always best done by changing the actual size of the image
    and uploading it to your site. Some content management systems (CMSs) have built-in
    image editors that make physical resizing easier.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_180_0.png)


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_180_1.png)


