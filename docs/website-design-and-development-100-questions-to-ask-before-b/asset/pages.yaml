  md: '# Appendix B

    Glossary


    This book covers a lot of subjects, each of which has its own unique terminology.
    I''ve tried throughout the book to briefly explain terms as they''re introduced.
    Those terms, along with many others, are gathered here. You can also find additional
    terms in the glossary on the book''s website at www.ahundredquestionstoask.com.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_334_0.png)'
  merge: -1
  pgno: 334
- img_proc: true
  md: '404 error The error message or page displayed when an address for a nonexistent

    web page is entered in a browser.


    above the fold When a web page is first loaded and without scrolling, this is
    the

    visible content above the bottom edge of the visitor''s browser window.


    Active Server Pages (ASP) A server-side scripting language developed by Microsoft.

    ad tracking The statistics gathered about advertisements on the Web, including
    how

    times viewed and how many times clicked.


    add-ons Small scripts that add functionality to web browsers, content management

    systems (CMS), or other software.


    affiliate A website that advertises for a merchant in return for a share of any
    sales or

    other actions resulting from visitors clicking through that site.


    affiliate link A specially coded link on an affiliate website that allows the
    merchant

    to track visitors from that site and credit the affiliate.


    anchor text That that has been hyperlinked to another page or site.

    anonymous FTP A file transfer count allows anyone to access a web hosting

    account without a username or password.


    Apache An open source web server package that is the most common web

    server software in the world. Primarily used on Linux platforms.


    attribute Additional elements of tags in HTML. For example, the image tag <img>

    can have attributes such location <img src="http://mydomain.com"> or alternative

    text <img alt="Picture of my cat">


    authentication On the Web, this refers to verifying the identity of a user in
    a secure

    area of a website.


    autoresponder In e-mail marketing, this is used to send out prewritten messages
    at

    specific times (for example, one week after a person signs up to an e-mail list).


    back up The process of making a copy of all files necessary to run the

    site and storing them safely elsewhere in case of server problems.


    bandwidth In common usage, the total size of all files uploaded and downloaded

    from a website in one month. Technically refers to the amount of file uploads
    and

    downloads a server can handle at any specific moment.


    banner ad In web marketing, a graphical advertisement that links to another

    website.


    below the fold When a web page is first loaded, this is the unseen content below
    the

    bottom edge of the visitor''s browser window.'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'To block a website, an IP address, or an e-mail address for bad practices such
    as spamming or stealing content.


    On a web browser, storing a link for future reference. In social media, storing
    a link to share with others.


    A short text-based navigation menu (usually horizontal) shows the links connecting
    the current page to the home page.


    How uniformly a website is displayed in different browsers and different versions
    of the same browser.


    Web browsers store copies of web pages on your hard drive to make it faster to
    load when you return to the site. With heavy traffic sites, servers will sometimes
    store the most recent copies of pages to handle all the requests.


    A loose term for additional text or images that sit outside the text on a page.


    A set of rules created to define the layout and style of web pages (as position,
    spacing, backgrounds, fonts, sizing, and so on).


    A program that allows live messaging between two or more users on the Internet.
    Often used as support tools to get help online. Also called Chat.


    The percentage of clicks on a link (usually advertisement) compared with the number
    of times the page has been displayed.


    A client program that requests a service from a program on another computer. On
    the Web, a browser is a client because it requests pages from a web server sitting
    on a host''s computer. E-mail programs are another example of a client.


    Refers to languages that operate on your computer instead of a web server. JavaScript
    is client-side because it runs in your browser.


    A set of colors that go well with the parent color. There are many different color
    schemes for any one parent color.


    Reduction in size of images, documents, or multimedia for faster delivery on the
    Web.


    The delivery of ads over the Web, based on the content of the page in which it
    is placed. The process of choosing the ad occurs at the moment the page is accessed.


    Software that allows users with little or no technical knowledge to be able to
    change or add content on a website. A CMS provides simple interfaces for entering
    and formatting text, uploading and manipulating images, creating new pages, and
    so on.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# APPENDIX B GLOSSARY


    contrast In graphic design, the grey scale difference between two colors. Too
    low a contrast (such as blue on red) is difficult to read.


    conversion rate The number of visitors to a site who take a specific action (buying
    something or signing up for something, for example).


    cookie User-specific information stored on your computer as a text file or on
    a server that is used during the current or subsequent visits (example, your name
    or membership status). Although there can be malicious cookies, 99 percent of
    them are perfectly and are used on virtually all dynamic websites.


    copyright The exclusive rights granted to the creator of an original work governing
    the copying, distribution, or adaptation of the work.


    Cost per Action (CPA) How much is charged every time a visitor takes a particular
    action (buys, joins, and so on),


    Cost per Click (CPC) How much is charged every time a visitor clicks a website
    advertisement.


    Cost per Impression (CPM) How much is charged for a certain number of views of
    a website. Usually given in terms of cost per thousand (M stands for the French
    mile).


    crawl The act of automated programs (robots) reading every file on a website.
    Often used to refer to the term of search engine robots.


    database A computer application for storing and retrieving data. Databases used
    by web software such as content management systems and shopping carts.


    dedicated server A server that is not shared with any other hosting accounts and
    over which one has complete control.


    deep link A link to a page within a website below the level of the home page (for
    example, http://mydomain.com/company-history.html).


    domain extension The letters following the last period in a domain name (for example,
    .com, .us, .info, .uk, and so on). Also see top-level domain (TLD).


    domain name The name that identifies a website, such as wiley.com, of having to
    use IP addresses such as 192.168.1.1.


    domain service or domain server (DNS) Translates domain names (mydomain.com) into
    IP addresses (192.168.1.1).


    domain registrant The person, company, or organization that controls a domain
    name for the period of time it is registered (no one owns names).


    domain registrar A provider who can register domain names on your behalf.'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'double opt-in In e-mail marketing, the process of verifying that a person has
    filled out the initial signup form (usually through a link in a welcome-email).


    download On the Web, the transfer of files from a server to a user''s computer
    (see also upload). Viewing a website involves downloading the site files to.


    downtime The period of time when a web server or a particular website is not available
    to visitors.


    duplicate content In search engine terms, when large or entire portions of one
    site are duplicated on another site (with or without permission).


    dynamic website A website whose pages are assembled from numerous files before
    being displayed in a browser. (Opposite of static website).


    e-mail account Space on a web server in which mail is stored for a particular
    e-mail address.


    e-mail alias An e-mail address that does not store e-mail for downloading, but
    simply passes the e-mail to another address.


    e-mail forwarding On web servers, the process of sending a copy of an e-mail to
    one or more other addresses.


    e-mail marketing Sending information and offers in the form of e-mail to subscribers
    who requested that their address be placed on a mailing list.


    e-mail server A web server whose sole function is to deal with e-mail.


    encryption The conversion of data into a form that can be read only by someone
    who has the decryption software. Used on the Web to secure information passed
    between browsers and servers.


    Extensible Hypertext Markup Language (XHTML) XHTML is the latest version of HTML.


    external link A link from one website to another. (Also known as an outbound link).


    ezine The name given to an e-mail written in the style of a magazine. Sometimes
    used as a synonym for e-mail newsletters.


    feed On the Web, a method of enabling content on one website to simultaneously
    published on other websites or read by users feed readers. See Also Really Simple
    Syndication (RSS).


    File Transfer Protocol (FTP) On the Web, a method of uploading or downloading
    files from a computer to a server.


    firewall Hardware or software that protects a network or individual computer from
    unauthorized access.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '**fixed-width layout** A layout that does not change its width as the user
    changes the width of their browser window.


    **Flash** A multimedia format developed by Adobe for use on the Web.


    **fluid layout** A layout in which the width of the site changes to match the
    width of the user''s browser.


    **footer** The bottom area of a website after all the content.


    **form validation** The process of checking the data being submitted through a
    form.


    **forum** Website software that allows members to post messages and reply to existing
    messages.


    **Frequently Asked Questions (FAQ)** The name typically used for pages on websites
    that feature common questions along with (usually) short answers.


    **gigabyte (GB)** One billion bytes or one thousand megabytes (MB).


    **Google AdSense** A service that allows contextual ads from the Google Ads systems
    to be placed on a website per click (CPC) basis.


    **Google Ads** A service that enables advertisers to bid for ads on Google and
    participating servers, as well as on sites in. The ads are targeted at specific
    keywords and charged on a per click (CPC) basis.


    **Google PageRank** Google''s rating of a website based on the quality of the
    inbound links to that site. Known simply as PR, the rating is a crucial component
    in Google''s positioning of a site in its search results.


    **Google Sitemap** A special kind of sitemap registered with Google that helps
    its robots find all content properly.


    **Graphics Interchange Format (GIF)** A compression format for storing images
    that is best used for large areas of a single color.


    **hacking** The act of getting into other computers and servers, with or without
    to crack any codes to do so.


    **header** The top portion of a website before the content begins. Typically contains
    the site''s name and navigation menu.


    **hit** A website statistic of how many times a file (page, image, document, and
    so on) has been downloaded. Do not confuse with PageViews or Unique Visitors.


    **host or web hosting provider** In the context of websites, any provider that
    stores files and makes them available for others to view on the Web.'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'hosting control panel A user-friendly interface that allows the average person
    to perform server-related tasks, such as creating e-mail accounts, passwording
    directories, uploading files, creating databases, and much more.


    HTML 5 A major upgrade of HTML that, among other things, will make it possible
    to play video and audio without having a browser plugin.


    HTML tables HTML tags used to display data in rows and columns. Until cascading
    style sheets (CSS), tables were used to layout web pages as.


    hyperlink A pointer to another document, most commonly another web page and most
    commonly referred to as a link.


    hypertext Text that is linked to other pages, documents, or sites.


    Hypertext Markup Language (HTML) A set of tags used to define the layout, links,
    and formatting of web pages.


    Hypertext Preprocessor (PHP) The most widely used server-side scripting language.


    Hypertext Transfer Protocol (HTTP) The standard set of rules for sending text
    files across the Internet.


    Hypertext Transfer Protocol Security (HTTPS) Like HTTP, but also secures Internet
    communication using Secure Socket Layer (SSL) technology. When using HTTPS you
    see a small lock icon at the bottom of your browser. See also Socket Layer (SSL).


    icons Small graphics used to indicate specific kind of content on a website (such
    as list items, e-mail, headings, and so on).


    image editor Software that enables the user to crop, resize, and adjust image
    files.


    image resolution The number of dots per inch (dpi) in an image (72 dpi) is the
    standard for the Web.


    image size The physical size of the image as it would display on a screen (expressed
    in pixels for use on the Web) or amount of space the file takes up (2MB, 50K,
    and so on).


    inbound links Links from another website to your site.


    indexing The process of search engines gathering data about a website and storing
    that information for retrieval when people are doing searches.


    inline styles Cascading Style Sheet (CSS) rules that are placed directly in HTML
    tags rather than in style sheets.


    Internet A worldwide network connecting millions of computers. The Web is a portion
    of the Internet.'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'Internet Information Server (IIS) Web server software for Windows operating
    systems.


    Internet Message Access Protocol (IMAP) A communication protocol for managing
    e-mail without downloading it to a server. (See also POP).


    Internet Protocol (IP) address A unique number identifying every computer on the
    Internet (for example, 64.143.26.342).


    Internet service providers (ISPs) Cable companies, phone companies, and those
    that provide people with access to the Internet.


    Java A programming language developed by SUN mostly for programming web servers
    and apps.


    Java applet On the Web, a small program that is used by websites for highly specialized
    interactive purposes.


    JavaServer Pages (JSP) A server-side scripting language often used by very large
    websites in part because of its highly efficient caching methods that can speed
    up the serving of pages.


    JavaScript The most popular scripting language on the Internet, developed by Netscape.


    JPG and JPEG Compression formats for reducing the size of photographs in particular.


    keyword With respect to search engines, a word or phrase used to search for relevant
    information.


    keyword analyzer A tool for quickly displaying keyword information about a web
    page.


    keyword density The ratio of instances of a keyword to the total number of words
    on the page.


    kilobyte (K or KB) Equal to roughly one thousand bytes of information (actually
    1024). A photo that would fill a computer screen can be as small as 50K or about
    50,000 bytes.


    Knowledge Base A comprehensive database of information to answer questions from
    visitors in a far more detailed way than an FAQ page.


    landing page A page specifically designed to be a destination point for an advertisement
    or promotional link. One version is known as a squeeze page.


    layout On a website, this is the placement of parts of a site, such as the header,
    footer, sidebar(s), and content, as well as the placement of elements within each
    of these areas.


    leading In typography, the amount of space between lines of text.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# APPENDIX B GLOSSARY


    link A connection between an element on a web page (text or image) and another
    page or file, on or or off the site. (See also inbound links and outbound links).


    link checker or link validator A tool for checking whether on a website are still
    active or not.


    Linux An open-source operating system based on UNIX. A majority of websites are
    hosted on Linux servers.


    live chat A two-way text-based messaging system commonly used by websites to provide
    support to visitors.


    loading time The time it takes for a web page to fully appear in a user''s browser.


    long tail keywords In a list of related keywords, these are the ones with fewer
    searches and therefore less competition from marketers.


    mail server The portion of a server devoted to handling e-mail or a dedicated
    server that only handles e-mail.


    mailing list In e- marketing, the list of people who have signed up to receive
    a newsletter or other information.


    megabyte (MB) 1024 KB or roughly one million bytes.


    membership site A site or portion of a website that requires a username and password
    that might or might not require payment for access.


    meta tags Tags in a document that describe the content. In HTML documents these
    are usually placed in the head section at the top of the document.


    mockup In web design a graphical representation of what the site will look like.


    modem Hardware that connects a computer to a network. For most people their ISP
    provides them with a modem to the Internet.


    Multipurpose Internet Mail Extensions (MIME) types An Internet standard for defining
    types of files as .jpg, .gif, PDF, Flash, .mov and so on.


    MySQL The widely used open-source database software for websites.


    negative space Used white space.


    newsletter In e-mail marketing, e-mail sent on a regular basis to subscribers
    of a mailing list.


    nofollow An attribute of certain HTML tags to tell robots not to follow a link
    (or any link on a page).


    off-page search engine optimization (SEO) Factors that affect a website''s position
    in search engine results and are outside the site itself (most importantly the
    links to the site from other sites). Also see search engine optimization (SEO).'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# APPENDIX B GLOSSARY


    **on-page search engine optimization (SEO)** Factors within a website that affect
    its position in search engine results (most importantly, the quality of the content
    and use of relevant keywords in various parts of the site). Also see *search engine
    optimization* (SEO).


    **opacity** In web design, the level of transparency for an image: how much can
    you see through the image which is behind it.


    **operating system (OS)** The software that manages the operation of a computer,
    web servers (for example, Windows, Linux).


    **opt-in** In e-mail marketing, the process of verifying that a person has asked
    to subscribe to an e-mail list.


    **optimization** In search engine marketing, the process of helping search engines
    properly index your site. In graphics, the process of reducing the size of an
    image by compressing it.


    **organic search results** The various websites, videos, images, and so on that
    are found by a search engine—as opposed to paid search advertisements that display
    around them.


    **outbound links** Links from your to other websites.


    **outsourcing** Hiring others on a contractual basis to work for you instead of
    or your staff doing it.


    **PageRank** See *GooglePageRank*.


    **pay per click (PPC) advertising** Any advertisement for which the advertiser
    pays if a visitor clicks the ad.


    **payment processor** A company that processes transactions, in particular credit
    card transactions, including authorizations, refunds, and transfers of money between
    merchants and the bank handling the merchant account.


    **permalink** A permanent link to a piece of content on a website. The idea is
    even if the content is reorganized in other ways, this link will never break.


    **ping** A method for testing communication between two computers on a network.
    In blogging, it refers to the notification of special servers that your content
    has been updated (these servers, in turn, broadcast notice to users of their services).
    It also refers to being notified that someone has linked to one of your posts.


    **platform** A common way of referring to the operating system used by a web server,
    such as Linux or Windows.


    **plug-ins** Small programs that can be added to a base program to provide additional
    functions. Sometimes called add-ons or extensions.'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'podcast An episodic of audio or video files often produced in formats similar
    to offline broadcast programs.


    popup Any object that appears over the top of the current browser screen, either
    automatically or by the result of clicking a link.


    Portable Document Format (PDF) A document file developed by Adobe that can be
    read by virtually any browser.


    Portable Network Graphics (PNG) An image compression format intended to replace
    GIF, which is not as powerful and has patent restrictions on.


    Post Office Protocol (POP) The most common communication protocol for retrieving
    e-mail from a server. See also Internet Access Protocol (IMAP).


    Practical Extraction and Reporting Language (Perl) A server-side scripting language
    most used on Linux or UNIX servers.


    public domain A technical term for a work not covered by copyright. When a copyrighted
    work goes into the public domain depends on a country''s laws. Being on the Internet
    does not make a work public domain.


    Really Simple Syndication (RSS) The common syndication format that creates what''s
    referred to as a feed from a website. This feed can be read by RSS readers or
    other types of programs.


    reciprocal link When two sites link to each other.


    redirecting On the Web, an automated process of sending a visitor to another location.
    This can be done through a meta tag refresh in the HTML or on the server with
    a 301 redirect (permanent) or a 302 (temporary).


    Return on Investment (ROI) The profit or loss resulting from an investment and
    often expressed in percentage terms. It can refer to the overall profit or loss
    of a company or specific actions (an email marketing campaign, the return generated
    by a particular advertisement).


    robot A program that automatically gathers information from web page to page gathering
    Used by search engines to index sites and by hackers to harvest e-mail addresses
    and other information.


    robots file A text file that is placed in website directories to control search
    engine robots (to stop them from indexing certain pages, and so on).


    router Hardware or software that can control access to various parts of a computer
    or computer network.


    sans serif font A font with no edge elements at the ends of strokes. On the Web,
    the most common sans fonts are Verdana, Arial, and Helvetica.'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'scanning On Websites, people''s habit of glancing through content looking for
    head-lines or words that catch their attention.


    screen resolution This is the setting that determines how much you can see on
    your computer monitor. The physical size of a screen is fixed, but you can adjust
    the screen resolution to show more pixels. The average screen resolution today
    is 1024 × 768 pixels.


    script A collection of statements written in a scripting language such as JavaScript
    or PHP.


    search engine Run by programs that automatically catalog information on the Web
    (as opposed to directories that are compiled manually). The most popular search
    engines are Google and Bing.


    search optimization (SEO) A combination of organizing, writing, and coding websites
    that search engines can better understand what the site is and how the content
    relates to specific keywords.


    search engine results page (SERP) After you enter a search term (or terms), this
    page displays the results of your search.


    search volume The number of people searching for a particular keyword.


    Secure Socket Layer (SSL) On the Web, software to secure communication when a
    browser is transmitting data.


    serif font A font that flourishes of varying styles and sizes at the ends of each
    stroke. The most common serif fonts on the Web are Times New Roman and Georgia.


    server-side Having to do with a server. Scripts that are processed by a server
    are called server-side scripts, and the language of the script is a server-side
    language.


    shared server A server containing multiple hosting accounts, running into several
    hundreds or even thousands.


    shopping cart Software that collects purchase information; it adds up; processes
    any shipping, taxes, or other conditions; and then passes the total and information
    to a payment processor.


    sidebar The areas of a website to the right or left (or both) of the content area,
    between the header and footer.


    Simple Mail Transfer Protocol (SMTP) A communication protocol for sending e-mail.
    For most people, their SMTP server is with their Internet service provider (ISP).'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# APPENDIX B GLOSSARY


    site builder software Programs of varying complexity that enable you to build
    a website with little or no knowledge of HTML. They can be on a server or on your
    computer.


    sitemap On the visible portion of a website, a page containing a full list of
    all pages on the site. Behind the scenes, a sitemap can be coding that helps search
    engines navigate through it.


    social bookmarking Publicly sharing favorite links with anyone or a select group
    of people, via a social media tool (for example, Delicious).


    social media Web-based services that provide interaction between users through
    simple publishing tools. Common examples include Twitter, Facebook, and LinkedIn.


    spider Another name for programs or robots that automatically search through websites
    gathering information.


    splash page Usually a graphics-based page that acts as a gateway to a website''s
    real home page.


    spyware Software hidden in a computer with the purpose of collecting information
    such as passwords.


    squeeze page A type of page in which the visitors'' options are very limited (they
    can either buy/sign up for something or leave).


    static website A website files do not need any assembly before being played in
    a browser. In other words, the HTML, you see in your browser is contained in a
    single file on the server.(Opposite of dynamic website.)


    streaming A way of transmitting video and audio files over the Web that users
    can see or hear part of the file that is being transferred.


    style sheet On the Web, a text file containing a set of rules governing the look
    and layout of a page.


    subdomain A domain name that depends on a parent name (for example, http://myhosts.mydomain.com
    is a subdomain of http://mydomain.com).


    subscriber In email marketing, someone who has signed up to a mailing list. For
    websites, someone who has registered to access password-protected material on
    the site.


    tag line A short descriptive phrase that goes with a company or organization''s
    title (for example, “Makers of fine contemporary furniture”).


    template On the Web, a file that contains all or part of the design and structure
    of a page separate from the content.'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'text editor enables that you to work with text but not add any hidden characters
    that can interfere with how that text displays on the Web.


    tiling In design, the process of repeating an image over and over again to form
    what appears to be a single image. This way the entire background of a site might
    be nothing more than a 10 x10 pixel image.


    title tag An HTML tag that is displayed at the top of browser windows, on browser
    tabs, and as the title of a search engine result.


    top-level domain (TLD) Refers to the set of letters following the final period
    in a domain name (for example, .com, .uk, .tv, .info and so on).


    turnkey website service A ready-made website that is hosted by a third party and
    for you don''t need to do any software maintenance or updating. In simple terms,
    you choose a design from a series of templates and then add your content.


    typography The art of making text or easy to read.


    Uniform Resource Identifier (URI) Any means of identifying a resource (website,
    document, a set of characters that identifies a resource) on the Internet, such
    as web pages, documents, images, mailboxes, services and so on. A URI might or
    identify the location of the resource. If it gives a location, then it''s usually
    referred to as a uniform resource locator (URL).


    Uniform Resource Locator (URL) A URI identifies the location and method of accessing
    a resource on the Internet. For instance, http://mydomain.com gives the location
    of a website (mydomain.com) and it specifies how to access the files (using http
    protocol). If the URI is ftp://mydomain.com, the location is the same, but the
    method of accessing the files is different. Because a URI identifies a resource
    on the web, it is a type of uniform resource identifier.


    universal search Search results that include data from specialized searches such
    as images or videos, not just the usual website results. Also known as blended
    search.


    un To uncompress a file that has been compressed, or zipped.


    upload On the Web, the transfer of files from a computer to a web server; the
    opposite-site of download.


    uptime The period of time when a website is visible on the Internet.


    validator A tool for making sure that elements of a website meet certain standards
    (HTML, CSS, and so on). There are online validators as well as validator software.


    viral marketing Getting a small number of people interested and then letting them
    spread the information to others. Also known as word-of-mouth marketing.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# APPENDIX B GLOSSARY


    virtual private network (VPN) A secure connection allowing users to access a private
    network over a public communications structure such as the Internet.


    visitor . On the Web, someone who views at least one page of a website. Visiting
    a page must be clearly distinguished from the hits generated by viewing the page.


    web address See Uniform Resource Locator (URL) and Internet Protocol (IP) address.


    web developer . web designer A web developer develops with the technical aspects
    of websites, in particular any scripting or database work. A web designer comes
    with the use of the site and some tools that implement in HTML and CSS.


    web hosting provider Provides server software, storage space, and bandwidth for
    making files and websites accessible over the Web.


    web mail Online programs that allow you to access your e-mail from any device
    with a browser that connects to the Internet.


    webmaster tools Usually a free service offered by search engines to help site
    owners make their sites more search-engine friendly.


    web server A server with specialized software for making websites accessible over
    the Internet.


    webinar A seminar/workshop delivered virtually through a web browser.


    What You See Is What You Get (WYSIWYG) In design, the capability of software to
    display a web page during editing exactly the way it will be displayed on the
    Web.


    white space In design, the space between elements on a page, such as the space
    between content and the sidebar or even lines of text. The space need not be white,
    just blank. Also known as negative space.


    WHOIS A communications protocol that is commonly used to access databases of information
    about domain names. A WHOIS search for a domain name can tell you who is registered,
    how long it been registered, when it expires, and many. Many WHOIS search tools
    exist on the Web, including on any domain registrar.


    widgets Code connects a website to a third-party provider for various kinds of
    content (weather reports, clocks, news, currency converters, and much more).


    wi-fi Wireless Internet access that is available to the public, with or without
    password.


    wireless security The encryption of data transmitted wirelessly over a network.
    There are several levels of security available, but most wireless devices have
    no security by default.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '**World Wide Web (WWW)** A section of the Internet intended for public use.


    **World Wide Web Consortium (W3C)** The organization responsible for managing
    standards for the World Wide Web (WWW) portion of the Internet.


    **ZIP** A compression format for computer files. Compressing files before making
    them available for download on the Web not only makes them load faster, but it
    also helps protect against viruses.'
