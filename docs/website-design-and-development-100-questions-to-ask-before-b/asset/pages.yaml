  md: '# CHAPTER 4 DESIGN AND LAYOUT


    # 28. How Will Your Site Design Use Color?


    > Importance


    Years ago, when computer monitors had a limited range of color, websites had to
    be designed around those colors. What came to be known as the browser-safe palette
    consisting of 216 colors (computers could render 256, but PCs and Macs differed
    on 40 of them). Now browsers can render millions of colors, you don''t need to
    be limited by these 216 colors. On the other hand, unless you very specialized
    color-matching, it is easier to choose from a limited palette than a virtually
    unlimited one. Most color choos allow you to limit them to this browser-safe set
    of colors.


    There are two basic considerations for using color on your website:


    +   - Does the central color fit the perception and mood of the site?

    - Does the color scheme based on that color work?


    Although it might not be exact science, you know from your experience that color
    can affect your perceptions and feelings. Red, for example, can be associated
    with passion and energy, whereas blue can be associated with order and authority.
    Of course, some people will see these associations as positive, and as negative.


    How people perceive is the result of many influences: culture, gender, age, socioeconomic
    factors, and so much more. That means thinking about color take into account your
    audience as your goals. For example, a company that once used blue might start
    green with early earthy tones because their customers became more concerned about
    the environment. To get an overview of opinions on the use of color in marketing,
    search for the term psychology marketing.


    Having a set color for your site


    Color values on the Web will look like this: #FFF000. This is a hexadecimal code,
    and in this case, it describes a type of red. Web designers also use RBG values
    (255, 0, 0), whereas print designers use CMYK (0, 100, 100, 0).


