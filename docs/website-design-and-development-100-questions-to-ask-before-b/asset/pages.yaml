  md: '# CHAPTER 8 MARKETING AND PROMOTION


    # 68. Do You Have a Web Marketing Plan?


    Importance


    The rest of this chapter covers web marketing tools, except for search engines,
    which are covered in Chapter 9.


    In some cases, a website is the product itself and a marketing tool. In this book,
    I treat it strictly as a marketing tool.


    In the introduction to this book, I asked the question, "Why do you want to build
    a website?" The answer to that question is an important part of your web marketing
    plan because a website is at the heart of all online marketing. The current answer
    gives you a brief overview of some other elements in a web marketing plan.


    A web marketing plan should be part of a broader marketing plan for your business
    or organization. Many small-to-medium-sized outlets, might be the largest component
    of a marketing plan, but if you don''t have a marketing plan at all, hopefully
    this answer will convince you of its importance.


    Marketing plans are vital, because they commit your ideas and plans to paper.
    It''s too easy to lose sight of goals, strategies, and methods floating around
    in the head, and even easier to change them to suit the moment. A written set
    of plans keeps honest. That''s not to say plans can''t or shouldn''t change, but
    having them in the document helps you to justify your changes.


    A marketing plan can be as simple as a few lines on each topic. Don''t put off
    the plan because you think it needs to be a complex document.


    > Rule of Thumb Review your marketing plan at least every three months. Check
    how you''re doing, what needs revising, and so on.


    There are some key sections that can make your marketing plan useful:


    +   SWOT analysis—SWOT for strengths, weaknesses, opportunities, and threats.
    The strengths and weaknesses are about your site, whereas the opportunities and
    threats are about the market you are competing in.


    +   Target audience—To whom are you marketing? Knowing age, gender, occupation,
    location, income, time, and ethnic background can help you decide how you''re
    going to reach that audience. Understanding the needs of your audience can help
    you decide what you''re going to say to them. How will you be able to help your
    audience?


    At every point of your plan, set specific goals. For example, one goal might be
    to increase new visitors by 20 percent, get 20 newsletters per month, send a promotional
    offer to 5 key websites, and so on.'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'Strategies—Although strategies might be broad in scope, they should not be
    so general as to be useless. For example, “get more business” is not very helpful,
    whereas “increase purchases by current customers” provides guidance. You’ll also
    have strategies—for instance, one for each product or for each service your organization
    provides.


    Creating a marketing calendar on a spreadsheet or a project management program
    such as Microsoft Project is a great way to map out your tactics as a series of
    tasks. Give each task a start and end date, indicate who will perform each task,
    and determine its priority. Use color-coding to help visualize types of tasks
    (e-mail marketing versus article marketing, and so on).


    Tactics—These are the details about how you will implement your strategies. What
    are the objectives for each tactic? What is the message being delivered? What
    tools will be used?


    Budgeting and measurement—What are the costs for implementing the marketing plan?
    What is the expected return? How will the results of the plan be measured?


    # Related Questions


    +   - 56. Will your content serve your site''s purpose? Page 146

    - 83. How do you plan to track website visitors and marketing results? Page 233

    - 84. What are your search engine expectations? Page 238


    # Action Items


    +   - Get something written down as soon as possible. Start by writing a couple
    of sentences for each part of the marketing plan. The sooner you commit to writing,
    the more focused your marketing efforts become, and the more likely you''ll build
    a marketing plan over time.

    - Set aside time for working on your marketing plan and create a routine: for
    example, half an hour at the end of each work day or two hours every Monday night.'
  merge: -1
