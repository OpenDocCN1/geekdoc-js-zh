  md: '# 13. How Much Storage Space and Bandwidth Do You Need for Your Site?


    Ironically, two of the most prominent features you see in ads for web hosting
    limits are disk storage space and bandwidth, when in fact the drop in price for
    both of them has almost made them irrelevant in choosing a provider. Still, it
    pays to know you''re getting enough of both.


    # Storage


    Websites are made up of files: HTML files, image files, video files, documents,
    and so on. How much storage you need the web server depends on the types and amounts
    of files you''ll have on your site. You want to make sure you think ahead—might
    not have many files now, but they can add up quickly.


    Suppose that you have a blog in which you''re planning to upload lots of photos
    and videos. Let''s do the math for one year''s activities:


    +   - Blogging software and database = 20MB

    - 5 × 1.5MB photos per week = 390MB

    - 1 × 5MB video every two weeks = 130MB


    Total after 1 year = 540MB (about half gigabyte)


    From this rough calculation, you''d want a web hosting account with at least 1GB
    of storage space. Fortunately, these days that a fairly basic starting point for
    storage limits, even for low-priced hosting. Often you''ll get more for your money.


    > Rule of Thumb Look for a hosting account that offers a minimum of 1GB of storage
    space.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Bandwidth


    Whenever people visit your site, they''re downloading files (such as HTML files,
    images, and so on) so their browser can display the site. Web hosting providers
    track all this downloading based on the number of bytes of data, and the monthly
    traffic of all this is referred to as your bandwidth.


    In the blogging example, with all the photos and videos, each visitor would use
    a good deal of bandwidth when viewing the site. You want more visitors coming
    to your site, but keep in mind that this means you''re using more bandwidth. So
    you want to make sure your hosting account has sufficient bandwidth to meet your
    needs or projected needs.


    As storage, bandwidth costs have dropped dramatically in recent years, so you
    can get plenty of bandwidth for very little money. For a basic website without
    any lot of images or documents as PDFs, and several thousand visitors per month,
    you might get away with iGB or so of bandwidth. But of course, the more you can
    get for your money, the better—you never know when your efforts will pay off and
    you''re swamped with visitors.


    Having lots of bandwidth doesn''t mean your site can''t get overloaded with traffic.
    That''s because the bandwidth everyone talks about is actually a total data transfer
    limit over a one-month period. Techno, bandwidth is the rate at which data can
    be transferred at any given moment.


    If you think of data flowing through a pipe, bandwidth is the diameter (the bigger
    the pipe, the more that can flow in any given moment). But any pipe has a limit.
    So if your website is featured in a national media outlet, and tens of thousands
    of people flood your site at once, it won''t matter how much data transfer you''ve
    got; you can overload the bandwidth (pipe) and slow down your site or crash the
    server.


    > About all those advertisements that say "unlimited disk space" and "unlimited
    bandwidth-\ The truth is that every server has limits. What the ads really means
    is that average users won''t need to pay for additional disk space if they go
    from 2GB of usage to 3GB, or if they have a similar bandwidth. That''s definitely
    a bonus.


    > You can save storage space (and, more importantly, bandwidth) by hosting large
    files as videos or even photos on services such as YouTube or Flickr.'
