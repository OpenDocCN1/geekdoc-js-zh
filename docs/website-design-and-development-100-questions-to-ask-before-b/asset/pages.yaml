  md: '# CHAPTER 7 CONTENT


    # 57. Will Your Content Be Easily Accessible?


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_167_0.png)


    > Use your statistics to regularly assess whether any content is being given sufficient
    accessibility importance (or vice versa). You might find that visitors reading
    a page that is not easily accessible, and by making it so, you can reach more
    people.


    Your task when setting up a website is to make all your content easily accessible
    to visitors, while making the content most important to them more visibly and
    frequently accessible. The key techniques for accessibility are mentioned here
    in rough order of importance (many are covered in more detail throughout the booklet):


    +   Placement in the navigation—Including a page on the main navigation not only
    makes it quickly available from anywhere on the site but says to visitors that
    it has an importance that a page on only the footer menu does not. Pages, on the
    first level of the main navigation are most important, second-level items less
    so, and so on.


    +   Placement on every page—If a link to content appears on every page (outside
    of the main navigation and the footer navigation), that makes the content highly
    accessible and again indicates a high level of importance.


    +   Placement on the home page—Any content that''s promoted on the home page takes
    on a special significance, even if that''s one of the few ways to access the page.
    Even pages with a link in the main navigation will benefit greatly from a link
    in the content of the home page. Of course, the more space and/or graphics devoted
    to the link on the home page increases its importance even more. A simple text
    link within the home page achieves extra significance.


    +   Vertical placement—The further up a page element is placed, the more likely
    it is that people will see it and the greater importance attached to it. Other
