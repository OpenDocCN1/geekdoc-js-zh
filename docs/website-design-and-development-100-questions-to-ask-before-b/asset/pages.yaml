    not count as a design inconsistency.


    Consistency of design is important with navigation. You might change the look
    of your header for different parts of a website, but it''s best to keep the same
    colors and look for the navigation.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_102_2.png)


    # Related Questions


    +   26. Will images be used effectively in your design? Page 63


    +   35. Will your navigation be easy to use? Page 88


    +   57. Will your content be easily accessible? Page 148


    # Action Item


    +   Don''t look at your navigation in isolation, especially if it involves animation.
    Look at it on a complete page and check that it''s obvious and not distracting.'
