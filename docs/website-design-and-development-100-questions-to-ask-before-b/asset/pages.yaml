  md: '# 87. WILL YOUR CONTENT BE SEARCH ENGINE-FRIENDLY?


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_268_0.png)


    FIGURE 9-6


    # PAGE STRUCTURE


    Just as search engines see your site according to the structures you create through
    linking, they see your pages according to the structures you create using placement
    and headings.


    Placement means that your most important point on a page is made in the first
    paragraph, your next most important in the second, and so on. If you have more
    than two or three paragraphs, you''ll probably want to break things up using sections,
    and this provides an additional opportunity to make your structure clear to search
    engines.


    You can break up sections by having a heading that''s been styled bold. To has
    this significance, but it means nothing special to search engines: they see it
    as


    HTML heading tags, on the other hand, provide a kind of meaning for the search
    engine robots. Using H1 (highest) to H7 (lowest), you can tell search engines
    how sections relate to one another. If H1 is used for the page/content title,
    H2 will be the first main section. Perhaps this section has a subthought of separation,
    or it gets an H3 heading. Then the next main section gets an H2, and so on.


    > Be sure the filenames of pages reflect the specific content: heat-pump-service.html,
    not heat-pumps.html (which could be a product sales page); or something cryptic
    as hp-service.html or page5.html. Specific naming can help search engines understand
    what a page is.


