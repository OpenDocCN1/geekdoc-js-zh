  md: '# 18. Can You Easily Manage E-mail through Your Web Hosting Provider?


    If you''ve ever lost the password for your e-mail, you''ll appreciate an easy-to-use
    e-mail management function on your hosting control panel. There is no need to
    call tech support: log in to the control panel, create a new password, and put
    that in your e-mail program on your computer. Sometimes the e-mail manager might
    be separate from the hosting control panel, but the key is to make sure it''s
    user-friendly. Figure 3-1 shows an example of the home section of e-mail management
    in a hosting control panel.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_61_0.png)


    FIGURE 3-1


    > If someone else is setting up your hosting and your e-mail, at the very least,
    learn how to manage your accounts and the pass-words in-putter.


    As you can see in Figure 3-1, there are a lot of e-mail functions available, of
    which you''ll never need to use. The basic tasks you should be able to perform
    from any e-mail interface are:


    +   * Add and delete e-mail accounts.

    * Change e-mail account passwords.

    * Change the capacity (quota) of mail accounts.

    * Forward an e-mail address to another.

    * Add and delete autoresponders (out-of-office messages, and so on).

    * Set up mailing lists.

    * Control spam filtering.


    With hosting control panels, setting up an e-mail account should be as simple
    as filling in a form with an e-mail address and a password, as shown in the top
    area of Figure 3-2.'
