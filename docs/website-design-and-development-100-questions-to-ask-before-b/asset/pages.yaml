  md: '# 14. How Much Should You Be Paying for Web Hosting?


    Like storage and bandwidth, the price of hosting has dropped so much that it''s
    almost irrelevant to us. However, if you''re paying more than you need to, it''s
    quite relevant, so this question is designed to make sure that you don''t pay
    too much.


    Because most readers of this book will be going the route of shared hosting (your
    site is on a server with hundreds of others), that''s what I''ll be talking about
    more. The bottom line? For an average site, you shouldn''t pay more than $10.95
    per month for quality shared hosting.


    > Rule of Thumb Don''t pay more than $10.95 per month for shared hosting.


    Still, be sure that you''re not comparing apples and oranges. For example, a web
    designer who has set hosting for a client might be charging $19.99 per month,
    but personally handle tech support, set up client e-mail, and do things like back
    ups. In other words, the client isn''t just paying for hosting, but for services
    as well. You might do everything yourself and pay only $5.99 per month on a multilayer
    contract, but you can''t compare the two.


    Here are pricing basics for other types of shared hosting:


    +   **E-commerce hosting**—If you''re using your shopping cart system, you''ll
    need a package that offers things such as added security. You might be paying
    $14.99 per month and upward, depending on all the features you want.


    +   **Video hosting**—There are lots of free hosting sites (the most popular is
    YouTube). They generally work very well, and the price is right, but you might
    want to consider how long smaller startups are going to be around. There are paid
    services, such as Amazon''s S3 hosting, which typically charge you by the amount
    stored and the amount of traffic.


    What about providers who free hosting? I admit there''s always something about
    that word "free," even in this day of expensive hosting. But think about it. They''re
    giving you the hosting for free so they can put ads on your site by business which
    seems welcome. (Let''s face it, you''re saving only a cup of coffee a month—is
    it worth it?) Even for personal sites, there are lots of free platforms days (Blogger,
    Facebook, and so on) that have no ads or far less intrusive ones.'
