  md: '# 87. Will Your Content Be Search Engine-Friendly?


    Whether you do any SEO or not, search engines will index and rank your site according
    to the rules they follow. Without SEO you''re leaving it to chance that your content
    will ranked the way you want. But if you optimize the structure and the writing
    of your content to follow the rules, you vastly increase the odds of a good ranking.


    # Structuring Content


    Search engines work on the assumption that first in line means more important.
    The trick is to realize that really mean it. It''s not a bad assumption; not mentioning
    a keyword until the first sentence of the second paragraph has meaning to a search
    engine: This page is not primarily about this keyword (there are other factors,
    of course). The structure of your site and of each page needs to take into account
    assumptions like this.


    # SITE STRUCTURE


    Search engines use a site''s home page as the starting point of site structure.
    Then they look at what gets directly from the home page—the second level of the
    site structure. Pages that link directly from the second level form the third,
    and so on. The higher a page is within this structure, the more important it becomes
    to search the engine.


    The beauty of websites is that you can create “structures” at the same time—you
    are not tied to one of connections in the physical file folder system would be.
    You have the ability to create different pathways for different purposes, and
    therefore different keyword optimization.


    Suppose you''re building a website for your wool shop. You sell products such
    as yarns, patterns, and accessories (needles): plus you have classes on knitting,
    crocheting, and cross-stitching). Add some basic pages such as About and Contact
    and you have your second- and third-level structures, as shown in Figure 9-5.


    > Displaying these levels visually on a site map is more than just a way of making
    it easier to understand, you''re laying out blueprint for search engines. That''s
    why it is vital to indent on the map all the links between pages so you can see
    how search engines interpret the


    > On sites with fewer than five pages, site structure probably won''t be much
    of an issue, and the focus would be on page structure alone.'
