    providers have created their own systems that are as good or sometimes better.
    The two most popular third-party packages used by are cPanel and Parallels/Plesk.


    The most common tasks you''ll probably perform through a hosting control are:


    +   **E-mail management (creating accounts, autoresponders, and so on)


