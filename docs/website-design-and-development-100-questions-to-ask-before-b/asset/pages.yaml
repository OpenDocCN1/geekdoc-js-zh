  md: '# 34. WILL YOU BE USING ANIMATION IN YOUR DESIGN?


    If you decide that an animation is called for, there are several considerations
    that can keep it from becoming a distraction:


    +   - Make the animation user-controlled if possible (either it occurs when a
    visitor takes some action or if the animation starts automatically the visitor
    can turn it off).

    - Keep the overall length of the animation short.

    - Unless the animation is very subtle, don''t repeat more than once.

    - If the animation has distinct elements (such as photos), give enough time between
    transitions.

    - Limit the animation to the home page.

    - Use transitions that are less jarring to the eye, such as fades.


    > On Video

    > Watch some examples of design animations that distract and others enhance. Also
    see some alternatives to animations/rotations.


    # Related Questions


    +   - 26. Will images be used effectively in your design? Page 63

    - 35. Will your navigation menus be easy to use? Page 88

    - 36. Will your site load quickly? Page 93

    - 43. Will your site have special requirements for certain features to work? Page
    111


    # Action Items


    +   - Before spending money on creating any animation, subject it to the content
    test described above, and if it passes that test, be sure it gets designed with
    the criteria listed here.

    - Never judge a finished animation on a blank screen. Always look at it within
    the context of a full page with content, even if that page is a mockup. If the
    animation is planned for every page, you need to test it on a working site where
    you''re moving from page to page.'
