  md: '# CHAPTER 6 CONSTRUCTION


    # 48. Will Your Site Be Built with a Content Management System (CMS)?


    If it''s much easier to build a website that''s more dynamic than static, the
    best way to build a dynamic site is with a CMS. Importance


    Having a CMS does not mean you''ll never have to hire people to help you. The
    work you''ll need to hire them for is set everything up once; then the ongoing
    maintenance will cost a lot of money to hire out.


    The primary purpose of a CMS is to make changing and adding content as easy as
    possible. Your web designer might be comfortable working with a dynamic site structure
    using individual files, but do you want to work with plain HTML or learn how to
    upload files to a server? It be much easier to work with an interface such as
    the example from the popular open-source Joomla shown in Figure 6-2.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_143_0.png)


    FIGURE 6-2


    If you''re planning to host a CMS on your own server, an consideration is how
    easy it is to update. Like any software, it will require constant updates for
    security, improved features, and so. Ideally it should update with the press of
    a button and not require any modifications to your template files.


    Adding images or new pages are other common tasks that any CMS will simplify;
    but it''s much easier that you feel comfortable with the particular way in which
    the system does these tasks.


    Although each updating is important, the real power of a CMS lies in the ability
    to add functionality to your site, such as photo galleries, forms, and more. It''s
    also some of the biggest differences between CMSs.


    CMSs can be divided into two broad categories:


    +   - Hosted


    +   - Self-hosted


    Hosted versions include the site-builder systems offered by many hosting providers
    or free blogging or website services. A self-hosted'
