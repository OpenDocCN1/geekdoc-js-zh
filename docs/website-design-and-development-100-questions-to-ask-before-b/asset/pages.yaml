  md: '# CHAPTER 9 SEARCH ENGINE OPTIMIZATION


    # 92. Will You Need to Hire Anyone to Help Optimize Your Site for Search Engines?


    > Importance


    Do not pay anyone to submit your site to search engines. The robots come around
    automatically, so you''ll be indexed without anyone doing anything.


    SEO is big business. There are tens of thousands of SEO specialists who offer
    to get better rankings for your site. Most of them can provide useful help and
    advice, and I''ll get to them in a moment. First, I need to say about the minority
    of SEO practitioners who distract from the good work of others.


    The distraction comes in the form of misleading claims as: "Guaranteed Top Placement"
    or "Be #1 Google." To website owners who know SEO is vital but are overwhelmed
    by the details, or who are lazy and want a quick fix, these promises can be attractive.
    But if you put your wallets away for a moment, the next couple of pages can save
    you some time and money.


    Paying to have your site listed with large directories is not a good idea. You
    can easily find directories in your area of interest, and if you don''t have the
    time, hire an SEO consultant to research it for you. A reputable company will
    find relevant directories, and not just submit to hundreds of them.


    First, much of what is good for search engine ranking to do with content—and is
    completely in your control. This means that a list of SEO needs to be done by
    you or whoever is writing your web page content.


    > Rule of Thumb When it comes to SEO services, run when you use words like "guaranteed."


    Although it''s not as directly within your control, getting links from good websites
    is something you can pursue yourself. It takes time and energy, and you probably
    have more of that than cash.


    Besides saving money, avoiding the lure of big promises can also keep you from
    getting involved questionable or dangerous SEO practices. Good search engine rankings
    can sometimes be achieved by finding loopholes in new ways of using the rules
    that search engines follow. There are lots of clever people out looking for ways
    to work on the margin of good practices, but the equally clever people at the
    search engines usually spot this and close loopholes in new rules.


    Then there are the SEO experts who achieve results by using practices that are
    banned by the search engines. The strategy might work'
