  md: '# 55. Which Other Languages Than HTML Will You Use to Build Your Site?


    HTML is quite limited in what it can do, and most of the features of modern websites—assembling
    content from multiple files, drop-down menus, animations, and photo galleries—are
    accomplished using scripting languages, such as JavaScript, or PHP.


    Scripting languages on the Internet fall into two categories:


    +   * **Server-side (processed on the server before reaching the browser).** Common
    languages include PHP, ASP, JSP, Perl, and ColdFusion. Common uses include: interacting
    with databases, processing forms, assembling web pages, and actions that require
    more security.


    +   * **Client-side (processed in the browser and after the load of a page):**
    Common languages include JavaScript and Java. Common uses include: mouse effects
    such as drop-down menus and image rollovers: validation of input before the form
    is processed: access of third-party tools such as statistics, widgets, forms,
    and so on; and popup windows (ads, photo galleries, and so on).


    One of the drawbacks of client-side languages is that the software to run them
    might not be present on a particular person''s browser (or even if it, is turned
    off). Although JavaScript is built into all browsers, some people turn it off
    either because they are concerned about security or because they find annoying
    some of the things they do with JavaScript (such as animated trails behind the
    cursor). Server-side languages, the scripts get processed no matter what.


    When deciding how to accomplish something on your site, always ask this question:
    Can this be done in a better way? Better means simpler, more reliable, more secure,
    or more universal? For example, if you want a fancy photo gallery, you might see
    Flash galleries like you. But ask whether the same effect can be accomplished
    in JavaScript, or even CSS, or a server-side language such as PHP (some-thing
    visitors can''t).


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_162_0.png)


    Running server-side scripts is generally more secure because they are processed
    before reaching the browser, so users can''t interfere with them (though poorly
    written scripts can leave holes).


    You can test your site likes sheets disabled or JavaScript turned off by making
    these changes to your browser. Even easier method is to use a developer toolbar
    for your browser. These tools rarely have commands to disable features such as
    JavaScript without changing anything in the browser''s settings.'
  merge: -1
