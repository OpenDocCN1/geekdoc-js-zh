  md: '# 67. Will You Be Selling Online?


    If you''re planning to sell products or services directly from your website, there
    are a number of basic issues to consider. There''s no room in this book to get
    into all the details, but these answers will at least get you started in the right
    direction.


    There are three general options for building an online store:


    +   * **Hosted basic shopping cart**—You insert Buy Now or Add to Cart anywhere
    on your website, which then click through to a secure server hosted by a third-party
    where the order is processed.


    +   * **Hosted full-feature shopping cart**—The software to manage and display
    products, and gather orders are all hosted on a third-party server.


    +   * **Self-hosted full-feature shopping cart**—You host and maintain the software
    to manage and display products, and gather orders.


    Table 7-1 lists pros and cons for each of the three shopping cart options.


    **TABLE 7-1.** Shopping Cart Building Options


    | BUILDING OPTION | PROS | CONS |

    |---|---|---|

    | Hosted basic shopping cart | Easy to set up. Inexpensive to set up. No fees
    for the shopping cart. Product information and display are fully controlled by
    you. | No control over the check-out process. Limited shipping options. No product
    management software (other than your own CMS). No built-in customer service features
    such as product reviews, wish lists, gift certificates, and so on. | |


    continues'
  merge: -1
  pgno: 204
