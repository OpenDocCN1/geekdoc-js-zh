  md: '# CHAPTER 1 DOMAIN NAMES


    A popular scam is when a domain registrar sends out a notice saying that your
    domain is expiring soon, so you should make sure it''s safe by renewing now. Except
    that when you sign the form, you''re actually agreeing to transfer the domain
    from your existing company, and at crazy high rates (upward of $70 per month).
    Do not respond to these notices! Instead, use them as a reminder to log in to
    your registrar and renew your domain at your regular rate.


    Some top-level domains such as .tv are actually country codes which have been
    licensed by the country to be sold to anyone in the world. You''re paying for
    the privilege of having this exclusive extension. In the case of other extensions,
    such as .pro, you''re paying for an accreditation process among other things.
    Some domains such as .me have come down in price after initial sales were slow,
    so sometimes it can pay to wait.


    Many domain extensions allow you to register a name for up to 10 years, whereas
    the minimum registration period is generally 1 year, but sometimes it can be 2
    years.


    Although registering for several years in advance eliminates the worry of missing
    a renewal, make sure that you don''t forget your domain. In particular, it''s
    easy for your contact e-mail to have changed in a few years, so you end up not
    getting the renewal notice. As long as you keep your information up to date, lengthy
    registration times can be helpful.


    If you''ve registered a domain for a fairly new extension, it might be worth doing
    a yearly registration. The price for those domains can well go down over time
    (. .com names are $35 per year that not long ago), and it would be a shame to
    lock it in at the higher price.


    The final point to keep in mind domain pricing is that domain registrars have
    not offering cheap extension and service. Having an amazing price with poor service
    is no deal at all. But what counts as good service from a registrar? That''s the
    topic of the next question.


    # Related Question


    +   2. Do you need multiple domain names? Page 4


    # Action Item


    +   Survey the sites of several registrars to get a sense of what they''re all
    charging for a particular domain extension.'
