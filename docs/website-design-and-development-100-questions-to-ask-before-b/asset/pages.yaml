  md: '# CHAPTER 1 DOMAIN NAMES


    # 1. Have You Thought of a Good Domain Name for Your Website?


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_21_0.png)


    You cannot own a domain name. Registrants are generic exclusive right to use a
    domain name for a certain period. This right is managed through regulatory agencies,
    such as the Internet Corporation for Assigned Names and Numbers (ICANN), the international
    agency that oversees generic (non-country) domain names such as .com or .org,
    for periods up to 10 years. You will have people selling their domain name, but
    what they''re really doing is transferring their right to use the domain for a
    fee.


    Choosing a domain name is a key step in developing your website. Aside from part
    of your branding, a domain name is one of the most common ways people will find
    you on the Internet. That''s why a domain name needs to be memorable—by matching
    or relating to an existing name or simply catchy and unique.


    # If You Have an Existing Offline Name


    If you already have an established name, you''ll want your domain name to be the
    same (or very close to it). If your company name is Healthwise Fitness Equipment,
    the top of your list will be healthfitness.com. Even if you''re commonly known
    as Healthwise Fitness, it would be better to use the word in the domain because
    it will help the search engines distinguish you from fitness clubs or other businesses
    that use the name Healthwise Fitness.


    In case you can''t get the full name, you have some variations prepared. For Healthwise
    Fitness Equipment, healthwiseequipment.com would be a good alternative. It retains
    the key part of your brand name as well as the search engine-friendly term. The
    word head should be enough to keep you from being confused with a construction
    company.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_21_1.png)


    Watch how to use an online domain search tool to brainstorm alternative versions
    of a domain name.


    Another alternative is to place dashes between each word: healthwise-fitness.com.
    Keep in mind, communicating those dashes can be tricky, and people often forget
    to put them in. Other alternatives include short forms or acronyms—hfe.com—or
    if your business is connected to a region or country, find a domain name using
    your country''s extension, such as healthwiseequipment.us. Quite often a name
    that takes .com will be available for a particular country.


    There''s a lot to consider choosing a domain name, but not long deciding. People
    have checked a domain''s availability in the evening only to find that it''s been
    taken by morning.


    Some people say it''s better to keep your domain name as short as possible. Aside
    from the fact that many shorter names have already been snapped up, the length
    of the domain is not as important as it is'
