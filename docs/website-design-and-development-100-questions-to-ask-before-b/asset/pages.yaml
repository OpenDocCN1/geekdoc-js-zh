    \ the way in different browsers—is the bane of their existence. What looks fine\
    \ in Internet Explorer might not look the same in Firefox or Chrome. Testing your\
    \ site to make sure it works in a variety of browsers is important, but that means\
    \ some extra work.\n\nHow much difference can a browser make in the display of\
