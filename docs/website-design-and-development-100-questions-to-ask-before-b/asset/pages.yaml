  md: '# 33. Will the Design of Your Site Navigation Complement or Clutter Your Site?


    Designing site navigation involves finding a balance between the importance of
    making it noticeable and not overpowering content by standing out too much. This
    question is about achieving that balance. The usability of the navigation will
    be left to the next chapter.


    Navigation is not the place to show off your Photoshop skills unnecessarily, as
    the examples in Figure 4-27 illustrate.


    # On Video


    See examples of effective menus and partially the use of color and contrast.


    | HOME | CAPABILITIES | MACHINE SPECIFICATIONS | CONTACT | EMPLOYMENT |

    | --- | --- | --- | --- | --- |

    | START | PLAN | BUILD | DESIGN | GROW | PUBULET | NEW |

    | CONTENT | GRAPHICS | COLUMNS | STYLIZER | FUSION |

    | HOME | GALLERIES | PRODUCTS | SOFTWARE | SALES |

    | ABOUT | CAPABILITIES | INDUSTRIES SERVED | JOB SHOP SERVICES | CONTACT US |
    RFP/FILE |


    Figure 4-27


    Plain colors, slight gradients, or subtle light effects are much nicer, yet still
    effective. The latter two are shown in Figure 4-28.


    | STORE | ABOUT | Home Find a Job Textbook F | HOME | GET 63163 RETANS | ABOUT
    |


    Figure 4-28


    You need to strike a balance between making it clear where the navigation is and
    not making it center of attention.


    Using icons instead of words in your navigation only requires visitors to think
    too much, it''s also visually distracting. Your eye is naturally drawn to images
    and having a group of five or more of them at the top of your website is particularly
    distracting. You want people to notice the navigation, but you do that by the
    overall design, not icons.


    If you use icons or images with words, it makes your menu much less flexible.
    If you want to add a page or change the name of a page, you have to call in a
    designer to make a new button. Use only the images in the background, but keep
    the titles as HTML text.'
