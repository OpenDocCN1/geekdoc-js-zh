  md: '# 100. How Will You Protect Your Site from Attacks?


    Hackers are constantly looking for ways into servers, and they succeed in part
    by finding holes in the programs and scripts that run your websites. Although
    site owners often don''t have direct control over keeping holes plugged, there
    are some steps they can take to help, including knowing some questions to ask
    of hosting providers and developers.


    There is one important sorry that hackers get into servers over which site owners
    have a great deal of control: detecting passwords. By having weak passwords or
    not protecting passwords from being stolen, site owners provide hackers with their
    most useful way of getting into the back end of websites.


    Another important source of information for hackers is the files you forget to
    remove from your website. Aside from files that might contain passwords, you include
    programs you loaded on your server in the past, aren''t currently using, and are
    out-of-date and vulnerable to security breaches.


    Here are more steps you can take to ensure your site is less vulnerable to attacks:


    +   **Keep software updated**—Programs such as CMSs or shopping carts will need
    you when they need updating. Often these updates are to fix security issues, and
    the longer you wait to do it, the longer you''re leaving potential holes unplugged.


    +   **Don''t use unknown software**—If you come across a script for a feature
    on your website, check it carefully. If it''s poorly written, it could leave your
    site insecure. Stick to software that has a wide user base, or ask your web developer
    or if it''s trustworthy.


    +   **Check that your directories are secure**—Using the name of the directories
    on your server, try entering that address in your web browser (for example, http://mydomain.com/images/)
    and see what you get. If there''s a blank screen or an access forbidden notice,
    you''re good. If you see a list of folders and files, you need to ask your host
    to turn off directory listing.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# CHAPTER 10 HOUSEKEEPING AND SECURITY


    +   Have error messaging turned off—If your site runs on a script language such
    as PHP, ask your hosting provider or web developer if error messaging is turned
    on. If it is, ask them to turn it off because these messages can provide hackers
    with valuable information.


    +   Make your forms are secure—Submitting a form sends information to your server.
    If the contents of the form aren''t cleansed before getting to the server, they
    could be sending dangerous programs placed in the form by hackers. This is not
    simple form validation, which tests things such as the formatting of postal codes,
    but a thorough examination of every bit of data to make sure nothing bad is getting
    through. Most hosts offer good quality form-processing programs or check with
    your web developer to make sure form processing is being used.


    +   If you have any custom programming done, ask the developer about the security
    of the coding—If it''s a complex program, you might want to have a third party
    check it over vulnerabilities.


    These are some of the main ways you can help keep your website secure. By choosing
    a reliable host and using reliable software, you know that the programmers are
    doing their best to keep up with many other issues of web security.


    # Related Questions


    +   8. How reliable is the web hosting provider? Page 19


    +   15. Do you have a strong hosting username and password? Page 35


    +   98. Will your site administration be securely accessed? Page 288


    # Action Items


    +   Talk about security with your web developer as soon as possible (before software
    is chosen, for example) and follow the checklist of items mentioned previously.
    In particular, make sure form data is being cleansed.


    +   Before launch, talk to your developer about running one of many programs for
    analyzing web security as a final check. This could made part of your regular
    site checkup too.'
  merge: -1
