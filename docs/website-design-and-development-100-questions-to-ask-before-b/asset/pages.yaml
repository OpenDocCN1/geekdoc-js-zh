  md: '# 85. How Do You Plan to Research Useful Keywords for Your Site?


    People use words and phrases to search the Internet. SEO is all about making sure
    search engines recognize that your content is relevant to particular keywords.
    Before you can do SEO, then, you''ll need to know what keywords to optimize for.
    This is not as simple as it sounds because the keywords you need are the ones
    people actually use, not the ones you would. That means doing some research.


    # Keyword Research


    Start with your customers. Create a list of keywords you they think would use
    to search for what''s on your site. Then listen to how they talk on the phone,
    observe how they write e-mail, and note how they ask for something in the shop.
    You might talk about commercial properties, but potential customers say they''re
    looking for office space. Add this new information to your list.


    > Keep an eye out for topical keywords that can fit with your site: hot topics
    in magazines, new trends in the news, or the latest buzz on social media. If you
    can tap into the cache of those terms, it can produce some good short-term traffic.


    Monitor the competition. Find the keywords your competitors are using. It''s best
    to choose the sites of competitors who rank highly in the search engines. Add
    to to your list.


    Next, run your list through keyword tools, such as Google AdWords, Wordtracker,
    or Keyword Discovery. You''re looking for three pieces of information in particular:


    +   - Additional keyword ideas

    - How many people are searching for a keyword

    - How many websites are competing for a keyword


    > Use several keyword tools because they differ in what search engine data they
    use, how they analyze it, and the kinds of information they report. You''ll find
    a list of tools in Appendix A.


    Figure 9-1 keyword results from Google AdWords.

    As you can see just from this portion of the results, you''ve got even keywords
    to sort through. At some point the research has stop, and you have to decide which
    keywords you will use for SEO.'
