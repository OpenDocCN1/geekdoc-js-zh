  md: 'memorability. If your company name is four words long, it will be easy to remember
    a domain name that matches those four words exactly. You can also help visitors
    remember a longer name by capitalizing words in print (HealthwiseFitnessEquipment.com)
    or using colors for the parts of the name.


    # If You Don''t Have An Offline Name


    For some businesses, deciding on a company name is one and the same with choosing
    a domain name. In most situations it''s best to find a name that describes what
    you do. If your business is fitness equipment, try to get those terms in the domain
    name.


    It''s also possible to choose an unregulated but catchy or distinctive name. Take
    the thousands of social media startup companies on the Internet, for names such
    as Squidoo, Ning, and Reddit. They''re trying to follow in the footsteps of online
    giants like Amazon and Google, which have shown that an unusual domain name can
    be turned into a household word (with a lot of hard work and heavy marketing)


    Before finishing your list, you need to consider whether it would be good to have
    multiple domain names for your website—the topic of the next question.


    > Registering vs. Owning

    You often see domains written as www.mydomain.com, but the www is not actually
    part of the domain name. Increasingly you''ll see URL''s without the www so check
    with your host to see if your account is configured to accept either version.
    If it''s not and you leave off the www, your site won''t come.


