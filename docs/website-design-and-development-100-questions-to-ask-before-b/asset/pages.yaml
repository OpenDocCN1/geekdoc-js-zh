  md: '# CHAPTER 9 SEARCH ENGINE OPTIMIZATION


    # AUTHORITY


    Authority is not a zero-sum quality. In other words, linking to another site,
    you don''t lose any portion of your authority, the other site simply picks up
    a bit of authority for itself.


    Even when a link is from a relevant site, however, it''s better to have a link
    from what''s sometimes called an authoritative site. Authority or trust are those
    that have emerged over the last few years as search engines looked for better
    ways to rank sites. Google''s PageRank system, which initially focused mostly
    on inbound links, is an example of one type of ranking method (PageRank was used
    as a factor for determining placement on Google''s results)


    Just as you trust other people over time by observing their actions, search engines
    look at a huge number of factors to determine the level of sites, such as the
    age of the site, how many other authoritative sites link to it, how helpful the
    is to visitors (linking to other useful sites), often content is updated, and
    how secure the site is.


    You should be linking only to sites that are useful to your visitors, but authority
    is another reason for not linking to just any site—you are granting them some
    authority and you need to ask yourself if they deserve it.


    Something to keep in mind when looking for sites you want to have linking to you.
    Authority gets passed from one site to another. A website in your field (X) has
    no reason to link to your new site (Z), but you know whose site (Y) has an inbound
    link from X. Because of that, search engines give Y a bit of authority developed
    by X. If Y links to Z, the search engines get Z a bit of the authority given to
    Y. It''s not a lot, but until you gain the trust of X, you''re gaining a measure
    of authority.


    # INBOUND LINK CODE


    The marketing chapter in this book has some answers for getting other links to
    you. Here the discussion will be confined to the technical issues concerning the
    links on those other sites.


    If possible, make sure that inbound links have your correct name, and that the
    URL is the one you consistently use for that page. In the case of CMS, that means
    using what are called permanent links. These are URLs over which you have varying
    degrees of control, such as but that masks the actual URL generated by the CMS,
    such as http://mydomain.com/?page=387.


    However, because the page with this URL is listed in category 34, another link
    to the same page could be http://mydomain.com/?page=387&cat=34. If one inbound
    link goes to one address, and another inbound link goes to the other, the search
    engines sees two links to'
