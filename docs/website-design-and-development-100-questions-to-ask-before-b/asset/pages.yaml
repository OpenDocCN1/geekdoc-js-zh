  md: '# CHAPTER 8 MARKETING AND PROMOTION


    # 70. How Will You Market Yourself Using E-mail?


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_217_0.png)


    Think of e-marketing as pitching yourself by example. By providing useful content,
    you are marketing your expertise and your understanding of the audience''s needs.
    Of course, it''s always crucial to be the deal by giving subscribers a call to
    action, they''ll want you to prove your worth.


    E-mail marketing needs to be clearly distinguished from e-mail advertising (spam).
    In the previous question, I talked about having permission of people on your e-mail
    list. The other factor that distinguishes e-marketing from spam is that you are
    always sending something of value in addition to asking subscribers to take some
    action (buy, donate, participate).


    The most common form of e-marketing is the newsletter. The name is a little bit
    misleading because newsletters can be anything from a minimagine to a kind of
    retail flyer to a single article. When scheduling your mail, you need to strike
    a balance between fortune and you who are constantly bothering them.


    > Rule of Thumb A typical e-mail newsletter schedule be no less than once a month
    and no more than once a week.


    # On Video


    See examples and details of actual newsletters, including text-only versions of
    newsletters.


    Newsletters also vary greatly in production values—fancy graphics to plain text.
    A couple of samples are shown in Figure 8-3:


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_217_1.png)


    FIGURE 8-3'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'Whatever the format or style, the key is to make your newsletter short, relevant,
    reflective of you. The material should be something subscribers can use (advice,
    tools, ideas) or act on (offers, new items) immediately, but it has to come from
    you.


    For instance, you might have an article on the importance of great customer service.
    There’s nothing new about the topic, but by giving your definition of great customer
    service, supporting it with a story that happened to you, you make the point your
    own way. And we benefit by hearing some known knowledge explained in new ways,
    so don’t worry about being original; be concerned instead about being you and
    being clear.


    Here are some content ideas for your newsletter:


    +   - Solutions to your readers face

    - How-to tips and articles

    - Checklists your readers can use

    - Case studies

    - Customer stories and testimonials

    - Opinion pieces about topics in your industry or the news

    - Your reviews of books, blogs, articles, documentaries, and so on

    - Interviews of people who will benefit your readers


    Here are some ideas for finding newsletter material:


    +   - Look for older material you''ve written that you can update, or create short
    excerpt articles.

