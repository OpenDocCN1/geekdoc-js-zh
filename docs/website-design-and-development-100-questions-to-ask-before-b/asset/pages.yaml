  md: '# 84. What Are Your Search Engine Expectations?


    Search engines are the number one people find websites. If your site can''t easily
    be found through the search engines, you''re at a serious disadvantage. Unfortunately,
    the importance of search engines can lead people to throw money at the problem
    or fall victim to false promises, when what is required is a bit of understanding
    and the willingness to take the small steps necessary for good search engine ranking.


    Don''t expect overnight in search engine rankings. Getting to the top 10 for a
    particular search word or phrase (known as a keyword) takes time. Not a lot of
    time in traditional marketing terms, but a few months in the world of the Internet
    can seem like a long time.


    Although searching or both is similar, search engines are very different from
    directories. A search engine uses automated programs (robots) to index every website
    it can find. Directories rely on submissions from the public and manual additions
    by staff.


    > Rule of Thumb With a new website, expect a minimum of three months for the SEO
    to start to show.


    Then there are expectations about how high your site will rank. If you''re going
    to be number one for every keyword you want, expect to be disappointed. Even when
    your site does well, don''t expect to remain there without continual. And don''t
    expect that a good ranking for a keyword will always bring traffic because people''s
    use of that keyword might change.


    Bringing your search engine expectations in line with reality requires understanding
    the goals and methods of search engines. Once you know what search engines want
    and how to give it to them, you can move beyond promises of easy money and quick
    fixes.


    Search engines use literally hundreds of factors to determine the ranking of pages.
    Some of them might have very little, but they''re still part of the equation.
    As more knowledge is gained, as these weights change, as can the factors themselves.


    # Understanding Search Engines


    By this point in the book, you know its primary message: great content, regularly
    updated, is the key to a successful website. It should also be enough for search
    engine success because search engines want to provide the most relevant content
    for their users. If search engines were human, that might be true, but computer
    programs, they need some help determining relevance. Search engine optimization
    (SEO) is all about helping search engines analyze and rank your content.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# 84. WHAT ARE YOUR SEARCH ENGINE EXPECTATIONS?


    The techniques of SEO are based on understanding how search engines try to mimic
    human beings when they judge whether content is relevant to their needs. Search
    engines begin by analyzing data about a website that has been gathered by robots—computer
    programs that read the HTML code. From this analysis, search engines know how
    many times a word appears on a page, whether a word appears in the title, who
    is linking to the page, how old the page is, how old the content is, and much
    more.


    > Although you can submit sites to search engines, it''s not necessary. They''ll
    find you very quickly.


    All facts about a website are run through complex mathematical formulas that give
    different weight to each fact as well as relationships between facts, after which
    the results are compared to results for other sites, and in the end ranking is
    determined for each site. Add to this the fact that the data being collected and
    the way these process it is always changing, and you see why SEO can be a bit
    daunting.


    Thankfully, this constant change has one purpose: to more accurately represent
    and rate the content of websites. Search engines will only get better and better
    at analyzing content, keep writing great content and you will be on the right
    track.


    In the meantime, your SEO efforts need to match the current knowledge of the factors
    that search engines look at and what weight they give to them. The rest of this
    chapter is about the basics of that current knowledge.


    +   * Introduction—Why do you want to build a website? Page 00

    * 68. Do you have a marketing plan? Page 192

    * 79. Will paid online advertising be part of your marketing plan? Page 220

    * 83. How do you plan to track website visitors and marketing results? Page 233


    # Action Item


    +   * Visit some websites that talk about SEO in realistic terms (see the links
    in Appendix A).'
  merge: -1
  pgno: 258
