  md: '# CHAPTER 9 SEARCH ENGINE OPTIMIZATION


    There are lots of free link checkers online.

    Just enter a URL and you get a report on all links and which ones are broken.
    For a list of some link checkers, see this chapter''s section in Appendix A.


    Unlike inbound links, you have full control over the writing of outbound links,
    so you can follow the points made earlier in this chapter about writing descriptive
    text for links.


    It''s important for your visitors and for search engines that your outbound links
    be relevant to your content. A link might not be relevant to your site in general,
    but it needs to be relevant to the content in which it appears.


    Make sure the sites you link to are not just relevant but also have great content.
    If you''re writing wood carving, a link to a wood carving site that has poor-quality
    tutorials is not only a diservice to your readers but it''s unlikely that the
    site has a good search engine ranking.


    It''s easy to create an outbound link and then forget about it, but if the page
    you link to disappears, you''re left with a broken link, and that can have serious
    consequences for SEO. Page relevance, or worse, still cause robots to up indexing
    your page. Checking for broken links is an ongoing task that should be done primarily
    to prevent your visitors from being frustrated, but also as part of your SEO strategy.


