  md: '# 79. WILL PAID ONLINE ADVERTISING BE PART OF YOUR MARKETING PLAN?


    +   - Animated or multimedia banners in varying sizes

    - Video ads


    Some of the ways online ads can be delivered:


    +   - Simple display

    - Popups

    - Interstitial or between pages.

    - Contextual (based on page content)


    There are four ways in which online advertising charges are calculated:


    +   - **Cost per click**—When someone clicks your ad and visits your site, you
    pay an amount per click. If no one clicks, you pay nothing.

    - **Cost per view**—You pay on the number of views or impressions—how many times
    your ad is seen by visitors.

    - **Cost per action**—You pay on the actions taken by visitors. One version of
    this is affiliate marketing, which is covered later in this chapter.

    - **Cost per period**—You pay for an ad space or sponsorship for a certain period
    of time or a particular newsletter, the number of clicks or views is not measured
    and does not affect the price.


    The most widely used form of advertising is per click, for the obvious advantage
    that you pay nothing unless someone clicks through your site, and visiting your
    site is the principal goal of advertising.


    As far as the cost of advertising, there''s no way to give general rates for any
    types of ads. You''ll want to research costs of similar ads on similar sites.
    Tools offered by per click services will tell you how much you need to bid in
    order to reach a certain spot.


