    | 10 iPhone 3.1 | 0.50% | 3 | 00.06% |


    # FIGURE 4-24


    As you see from these lists, there are dozens of browsers out there, but the average
    website owner can''t afford to worry about all of them. The most used browsers
    are IE, FF, Chrome, and Safari. Although their individual numbers might change,
    they''re likely to be the top for some time to come. You can find the latest numbers
    by entering this search phrase: browser usage statistics.


    > Understanding browser compatibility is another example of why you have to pay
    for an experienced web designer for the CSS and HTML for your website.


    You also need to consider backward compatibility in a particular browser. IE 6,
    for example, is one of the biggest ever. Although it''s still being used by some
    people, that number has dropped considerably now, and it might not be worth trying
    to patch things up for audience.


    The next consideration is the extent of the problem. If a browser is pushing one
    of your columns off so visitors have to scroll right, that''s a serious barrier
    to usability and needs to be fixed.'
