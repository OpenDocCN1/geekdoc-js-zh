  md: '# 50. How Effectively Will Style Sheets Be Used on Your Website?


    It is extremely unusual these days for anyone to build a website with CSS. The
    question is: How useful is the style sheet? Even when the site layout is CSS-based
    rather than using classes, as discussed in the previous question, it does not
    mean the CSS is being used to its potential.


    > Rule of Thumb Well CSS should be fine-grained, simple, and not inline.


    Fine-grained CSS means that every element on the page can be targeted individually.
    For example, if you need to style the paragraph within a box on your sidebar,
    your CSS allows you to distinguish paragraph from all others on the page or from
    any rest of the site. If contact box appears on every single page, you will be
    able to color it blue only on the About page, for instance.


    Making your CSS fine-grained can get complicated if you''re not careful how you
    name elements. If you give every element its own name, you''ll not end up with
    an anonymous style sheet: you''ll lose flexibility. The trick is to keep things
    simple by attaching classes and ideas to areas, and only to individual elements
    (a word, a paragraph, and so on) if necessary.


    Here''s what the difference looks like in a style sheet if you want to target
    just the year in a copyright notice (the respective HTML shown below):


    ```

    #footer-copyright-year ( color: #dd0000 )

    <div><p>Copyright

    <span class="#footer-copyright-year">2010</span></span></p></div>


    .highlight ( color: #006699 )

    #footer_copyright .highlight ( color: #dd0000 )

    <div id="footer"><p id="copyright">Copyright

    <span class="highlight">2010</span></span></p></div>

    ```


    CSS is an important time- and cost-saving tool. During the design process it saves
    a lot of time when you want to test different colors or layouts. The savings are
    more evident when you want to redesign the site in the future. Other than graphics
    work, it''s mostly a matter of changing the style sheet rules.


    Modern browsers allow you to assign multiple classes to an element, which allows
    for more fine-grained styling.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# CHAPTER 6 CONSTRUCTION


    The first approach requires a rule for every element, or at least very comma-delimited
    lists of classes or ids for a shared rule. Either way, the style sheet becomes
    bloated and difficult to navigate. It also means that if you want to follow the
    general "highlight" rule, you can''t simply eliminate the individual rule: you
    need to rewrite the rule (or put it in the list of all highlighted elements).


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_149_0.png)


    The other approach says: Put every highlighted element on the site into a single
    class. From a design standpoint you''re likely going to want all highlights to
    be the same anyway. Then, if there''s an exception to that rule, simply target
    the specific instance of "highlight" by drilling down through the sections where
    it resides (#footer and #copyright).


    The final sign of good CSS is that it doesn''t use all called inline styles, which
    is when the rules are placed in the actual HTML. To continue with the highlighted
    example, this HTML will accomplish the same results as the previous approaches:


    ```

    <div><p><span style="color:#00000;">2010</span></span></p></div>

    ```


    The trouble with inline styles is when you need to change the style, you have
    to go into the HTML instead of working with a single CSS style sheet. That might
    not make difference for a single instance, but imagine if you had multiple instances
    of a style on one page. Even using search and replace would be more work than
    changing a single line in the style sheet. Now imagine changing the style of dozens
    of pages.


    # Related Questions


    +   * 41. How easily will your pages print? Page 106

    * 49. Will you use tables or style sheets to lay out your site? Page 126

    * 52. Will your HTML be bloated? Page 134


    # Action Items


    +   * Make a list of elements or areas of the site that you want to be easily
    targeted for future change (for example, a specific phrase that occurs regularly
    or a type of callout that you want to use continuously).


    +   * Talk to your designer, check the source code of a web template, or question
    a website provider about how CSS will be used on the project. Get a second opinion
    from a knowledgeable friend, or hire someone for half an hour to give an assessment.'
  merge: -1
