    ![](img/3493f0a51a5c20b7f571f197b5a924b3_206_0.png)


    FIGURE 7-21


    You can also have multiple products on your site and Add to Cart button for each
    of these buttons takes customers to the third-party server where they can see
    their shopping cart. They can then return to your site and add more products or
    check out.


    Although this basic shopping cart system is handy for a few services or products,
    it is very limited in areas such as shipping and has no useful shopping cart features
    such as gift certificates, cross-product promotion, and so on.


    For a true online store, you need a hosted or self-hosted shopping cart system.
    Deciding which route to take depends on how you want to spend your time and money.
    If you have fairly good technical skills (or are very adventurous), hosting the
    shopping cart software yourself gives you freedom, and the real cost is your time.
    If you''re willing to pay someone else to do it, again the freedom to customize
    can be very important.


    If you need to get a store up and running quickly and you''re not worried about
    customization, a hosted solution makes a lot of sense. There might be ongoing
    costs, but they''re monthly fixed costs, and you don''t have any maintenance concerns.


    Having considered the hosting question, the next important issue is which shopping
    cart software to go with. Some software is in both a hosted and a self-hosted
    version, which give you additional choices. Some software is open source, which
    means it''s free to download, but you''ll need good skills or people with good
    skills to implement it because there''s no included support.'
