  md: '# CHAPTER 4 DESIGN AND LAYOUT


    # 24. What Will Be the Width and Height of Your Website?


    # Importance


    When you''re creating your site''s layout, you''ll need to decide how it will
    be viewed in a web browser and to ensure that your design does not take up too
    much of the first screen''s worth of real estate.


    The first decision you''ll need to make about width is whether to have a fixed
    or a fluid width. As the name suggests, a fixed width is set and never changes,
    whereas a fluid width means the site automatically adjusts its width to match
    the size of the visitor''s browser. A sample of a fluid width (left) and a fixed
    width (right) are shown in Figure 4-5.


    The advantage of a fixed width layout is that you have more control over the structure
    of the site. The disadvantage is that you''re at the mercy of different monitor
    sizes and resizing their browser windows. Some people might have to scroll left
    and right to see all your content.


    On Video

    Watch samples of how fixed widths and fluid widths function in a browser along
    examples of horizontal scrolling be avoided. Also see an example of browser resolution
    statistics.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_77_0.png)


    FIGURE 4-5


    You can keep up with the average settings of computer monitors by using this search
    resolution statistics refine the search results to the last year.


    The key is to minimize how many people need to scroll horizontally by keeping
    your site width a bit less than the width of the current average screen resolution.
    At time of printing, that resolution is 1024 pixels. That means if you set your
    site at 960 pixels, there will be a bit of breathing room on either side of the
    average screen (always center your fixed width).


    > Rule of Thumb A fixed width size should be at least 60 pixels narrower than
    the width of the current average screen resolution.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# 24. WHAT WILL BE THE WIDTH AND HEIGHT OF YOUR WEBSITE?


    A fluid avoids the too-narrow or too-wide problem because the website is always
    exactly the same width as the visitor''s browser. The disadvantage is that your
    text and image elements, in particular, move around and can affect the readability
    and look of the site. Don''t assume fluid sites are immune from horizontal: fixed
    elements such as images can keep the site from fully resizing with the browser
    window.


    Even though web pages are infinite in length, height plays a role in design because
    people pay attention to what they see when they open a web page. Following the
    tradition of the most important headlines of a newspaper being visible when it
    is folded, this very important region of your site is referred to as "above the
    fold." With today''s monitors, height is roughly the first 700 pixels—what people
    will see without scrolling.


    From a design standpoint, you want to ensure that the header area does not take
    too much of this valuable real estate. The header, of course, carries your branding
    and your navigation, although you don''t want it to be too small, also don''t
    want to detract from the page title and the first few paragraphs of text.


    The biggest culprit of width is height. You might feel very strongly about an
    effective photo being displayed in the header area, but if that image is too tall,
    it''s taking away from content, and in most cases that''s not a good thing.


    Home pages are one of the exceptions to this rule. Because there''s usually a
    small amount of content, there''s room to play with white space, and so on.


    At some point, simply increasing width to match monitor trends will require an
    almost because there''s a limit to the width of text that the human eye can easily
    take in, and you will need to break up columns.


    Some designers have addressed the question of height by creating fixed layouts
    in which the content scrolls within the design. There are a number of disadvantages
    to this. Scrolling content is often done with what are called frames and pose
    issues for search engines. Another disadvantage is that you lose a lot of real
    estate on the side because it''s limited to the screen height.


    Having a top margin in the design of the site—not flushing to the top of the browser
    window—allows valuable real estate, it''s worth considering that margin is necessary,
    even if it''s only a small margin.


    # Related Questions


    +   23. Will your site layout match your content? Page 55

    29. Will the background of your site help focus the content or distract from it?
    Page 70

    49. Will you use tables or style sheets to lay out your page? Page 162

    64. What content will be on your home page? Page 170


    # Action Item


    Whether to use a fixed or fluid structure needs to be decided early in the design
    process.'
  merge: -1
  pgno: 78
