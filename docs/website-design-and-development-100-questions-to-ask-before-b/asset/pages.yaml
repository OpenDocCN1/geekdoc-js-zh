  md: '# 58. Will the Content of Each Page Have a Single Focus?


    If you think about how the Internet works, it tends to be for something specific:
    the latest news on your favorite team, a recipe for chicken, or lyrics to a song.
    When visitors come to your site, it''s likely they''re looking for something specific
    too, and one way to help them find it is by limiting each page to one central
    topic.


    A plumbing company, for example, might offer installation, servicing, and repairs
    for furnaces, heat pumps, air conditioners, plumbing fixtures, and water taps.
    But if the navigation offers just one link to a page called services, you''re
    making a visitor work a chance that you offer such a service. If the menu shows
    a page specifically for heat pump services, the guesswork is removed.


    Even if the home page lists heat pump repairs as a service, but the link through
    to a single page detailing every service offered, you''re making visitors work
    to find exactly what they need. The same is true for search engines.


    When a search engine indexes for the phrase “heat pump repairs,” pages about heat
    pump services rank higher than a page on which it is only one of six or seven
    topics. With a high percentage of visitors visiting sites to search through engines,
    the goal is to have them click directly to the page they need, and that''s far
    likely to happen if your pages have focused content.


    A page listing all services would still be viewed as an overview, as long as it''s
    kept short, with a two- three-sentence description of each service and links to
    the page detailing that service. But the ultimate destination should be a page
    on one specific topic and nothing else.


    Another advantage of focused content is that it makes it easier for you to target
    a page with additional information to use for a visitor. For instance, on your
    sidebar you might have “internal ads” that point to other content on your site.
    If the focus of a page is to explain types of paint, you know that links to pages
    with additional information about paint or to paint products will be of value
    to visitors seeing that page.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_170_0.png)


    Part of being focused might include location. A plumbing company that serves a
    specific city or region needs to make sure that the content of its pages reflects
    the location. That way, visitors aren''t wasting their time reading a comment
    outside their area.


    Be the filenames of pages reflect the specific content: heat-pumps.html, not-pumps.html
    (which could be a sales page or something cryptic such as-service.html or page5.html).
    Specific naming can help search engines understand what a page is about.


    Ad services such as Google AdSense, often choose what ads to place on a page based
    on its content—the more focused your content, the more relevant others will be.'
