  md: '# 46. How Will You Test the User-Friendliness of Your Site?


    Throughout this book I emphasize the importance of testing your site in various
    ways before launching, but it''s also important to conduct tests in the best ways
    possible.


    If you can, leave your users alone to do the testing. They''re much more likely
    to be honest in their reactions if you''re not sitting next to them. Ask if you
    can record them visually during the test (put in writing that it''s not going
    up on YouTube or being sold).


    For more information on how to conduct user tests, search for the term user techniques.
    Also check the resources in Appendix A of this book.


    > **Rule of Thumb** Early and test often. If it''s just getting a friend to look
    at a rough site plan over a coffee, the sooner you get feedback, the better.


    When you are in the same room, be sure not to give any explicit or implicit reactions
    to the subject''s responses. Even a simple nodding of your head can lead people
    to think they''re on the right path and giving similar responses.


    Don''t tell people you''re testing. If someone knows you the navigation tracks,
    they''ll use it differently than they would normally.


    Don''t ask leading questions. If you''ve left people to test on their own and
    haven''t told them what you''re testing for, your questions shouldn''t lead them
    towards certain answers. Ask a general question first and see what the people
    see. If you''re not hearing about the topics you''re interested in, then you can
    get more specific, but still don''t say things such as "Did you find the site
    loaded quickly?" because people will say yes because that''s the answer you want
    to.


    Keep in mind that because someone has looked at something, it doesn''t mean they
    understand it. One of the reasons why eyewacking systems take you so far. You
    might notice the user using a slideshow on the page, but questioning them will
    tell you they got the point of the slideshow.


    Any testing is better than no testing. E-mailing a link to 10 friends with a request
    for any feedback will give you something to go.


    Give subsets a task. Visitors come to your site with a goal in mind. Simply telling
    a test subject to look at your site isn''t very realistic, so give them a task.
    If you''re testing a service''s website, have the subject look for pet walking
    services, but put it in terms of a scenario: You need someone to walk your dog
    in the early morning and water your plants.'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'Pick subjects who are interested. If you''re testing a site for real estate
    investors, find people with an interest in real estate. Even if you''re testing
    for features of the site that have nothing to do with the content, someone who
    isn''t interested in real estate will not see the site in the same way.


    If time or money allow, try to follow up whatever you do with a different type
    of testing. For instance, if users fill out a survey, also ask questions that
    come to the same subject a bit differently. You might find that the two answers
    conflict.


    There are online services that will conduct testing for you at rates affordable
    for small businesses (see the resources for this chapter in Appendix A). The advantage
    here is that you get a larger number and broader cross-section of people. Also,
    you benefit from the techniques used by these services, which can help eliminate
    some of the issues that arise when setting tests on your own.


    Go where the people are. If you have a gardening site, approach a local gardening
    club about finding volunteers. Have a small gift for each participant, such as
    a free service from you or a $10 gift card to a gardening store.


    # Related Questions


    +   22. Will the design of your site support your content or distract from it?
    Page 52


    +   33. Will the design of your site navigation complement or clutter your site?
    Page 82


    +   39. Will your forms be easy to use? Page 101


    # Action Items


    +   Make a list of what you think needs testing on your site. After getting some
    feedback or some tests, compare your list with what people actually responded
    to or had troubles with.


    +   Based on your site schedule, budget, and time, plan to test at the three key
    stages of development: draft plan, design, and first working version of the site.'
  merge: -1
