  md: 'For example, the list of insurance companies could be in the sidebar of all
    pages describing the dentist’s services. At the same time, have a text link to
    the list anywhere on the site that it’s relevant to mention “We deal with a wide
    variety of insurance companies.” Links such as are important because they’re immediately
    relevant to what the visitor is reading; you’ve done them a favor by anticipating
    that they’ll want this information.


    > Look at other sites in your field for ideas on the kinds of details you can
    emphasize on your site.


    If you’re using a graphic to convey information, such as the credit card logos
    or as an entitlement to click for more information, remember that you don’t need
    to take up a lot of real estate or visitors’ attention with large images. With
    careful placement on the page (for example, a lot of buttons tightly packed in
    a row) and simple design, your button will stand out better and achieve its effect.


    Contextual links are an effective way of drawing attention to details within your
    site. These can take the form of sidebar menus or related items lists at the end
    of a page. If you’re in a particular section of a plumbing site, you could list


    These contextual links are part of your navigation system, but they’re so specific
    that you don’t want them on your main menu, with drop-downs.


    If you have frequent temporary information that needs to be quickly and clearly
    conveyed, designing a special area of the site that displays only when the information
    is relevant. For example, a theatre company that has ongoing fundraising events
    could have an area at the top of the header or in the sidebar appears only when
    the event is taking place. This is nicer than an automatic popup, and because
    it appears only once in a while, it doesn’t fade into the background of your attention,
    as can be the case with What’s New sections.


