  md: '# 48. WILL YOUR SITE BE BUILT WITH A CONTENT MANAGEMENT SYSTEM (CMS)?


    CMS is one that you install on your server and for which you’re responsible for
    updating and so on.


    There are a number of differences between the two types, but the key distinction
    is that a hosted version does not allow you to customize your site and your functionality
    exactly the way you want. There''s a fixed list of add-on features (though these
    have become more extensive in recent years), and you can''t touch the actual files
    that run the site.


    > Rule of Thumb Anything than a personal site should be built using a self-hosted
    CMS, even if it’s only a few pages in size.


    With self-hosted open-source CMS there are large communities of people constantly
    developing and updating add-ons. For example, as media became popular you immediately
    had functions being created for open-source CMS as WordPress, Drupal, and Joomla,
    which would allow you to post to Twitter and Facebook.

    A hosted CMS might also allow you to edit your function list (hopefully sooner
    than later), but typically it would be only one, whereas the self-hosted open-source
    systems, there are literally dozens of social media add-ons that can do a wide
    range of tasks.


    With a self-hosted system you can also hire a developer to create your unique
    functions you control the actual coding that runs the site. In’re not dependent
    on a free host to remain in business or your provider to continue providing a
    free-builder.


    One of the disadvantages of a hosted CMS is that you can''t switch hosts. Because
    you don''t control the files running the CMS, you can''t pack and move everything
    (other than the actual content).


    # Related Questions


    +   51. What tools will be needed for building the site or its content? Page 131

    55. Which other languages than HTML will you use to build your site? Page 143

    66. Will you be blogging on your site? Page 183

    95. Do you have a plan for updating site content? Page 279


    # Action Item


    +   Try out the administration system for each CMS you’re considering. Pay particular
    attention to how comfortable you feel doing the following: editing existing content,
    formatting text, adding images or documents, adding new pages, managing menus,
    adding new functionality (polls, social bookmarking, and so on).'
