  md: '# 86. Will Your Pages Have the Hidden HTML Tags Necessary for Search Engines?


    For website owners, one of the most mysterious aspects of SEO is a set of HTML
    tags that don''t produce any actual content on the web page. The mystery is due
    in part to the fact that they are hidden in the source code, but perhaps more
    because of rumors about exactly what they do and how important they can be for
    search engines. This answer should help to clear up some of those mysteries.


    # Title Tag


    The title tag <title> is arguably the most important of the hidden HTML tags because
    search engines use it:


    +   * To determine the relevance of your content

    * To create a title for the page''s search engine results


    Technically, the title tag isn''t hidden because it shows up at the top of the
    browser window, as shown in Figure 9-2.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_262_0.png)


    > If you''re considering a content management system (CMS), make sure it allows
    you to write a custom tag for each page.


    # FIGURE 9-2


    Figure 9-2 shows how the title tag is placed in the HTML. You can also see how
    this tag forms the title of the page''s listing in the search engine. In other
    words, you control one of key parts of search engine results.


    > Of course, you need to remember to write a title tag. A common mistake is not
    to change the default assigned by some site-builder programs. You can see the
    results if you search for Page title.'
  merge: -1
