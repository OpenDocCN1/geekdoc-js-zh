  md: '# 27. Will Your Design Make Good Use Of Space?


    White space, or negative space, is what designers refer to as areas that contain
    little or no content. When you visit a website that feels crowded, you''re experiencing
    a lack of white space, and this crowding makes it difficult to find what you need
    or to know what''s most important. One of the great advantages of the Internet
    over print media is that space is virtually unlimited, so there isn''t the same
    imperative to fit in as one can, and white space can flourish.


    Look at how the site in Figure 4-10 gives mental breathing room to the message.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_84_0.png)


    FIGURE 4-10


    There are plenty of visual elements here, but they''re given the space to stand
    out rather than overwhelming you. In other words, good use of white space does
    not mean boring or devoid of colors and graphical elements.


    White space is any area separating content on a page, even the amount of spacing
    between lines of text (the details of working with white space in text are dealt
    with in a separate question).'
