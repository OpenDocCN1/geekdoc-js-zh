  md: '# 3. How Much Should You Pay for a Domain?


    The price of a domain name is determined by two variables: the base price set
    by the agencies that control the various domain name extensions (.com, .us, .tv,
    and so on) and the markup charged by domain name registrars.


    That''s why you see such a variation in the prices charged by a registrar for
    different domain extensions, as shown in Figure 1-1.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_25_0.png)


    FIGURE 1-1


    On top of that, different registrars might offer radically different prices for
    the same domain extension by creating special offers: for instance, if you transfer
    over from another registrar or host your website through the registrar. Figure
    1-2 shows different prices for a .com.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_25_1.png)


    FIGURE 1-2'
