  md: '# 72. Which Social Media Will You Use to Promote Yourself?


    If search engines and e-mail are two cornerstones of web marketing these days,
    social media is the third. It’s no longer a question of whether to use social
    media, but rather which are best suited to your audience and to you. This answer
    is designed to give you very brief overview of what''s available and how the tools
    can help you.


    There are four types of social media that are particularly effective for marketing
    purposes, as shown in Table 8-2.


    TABLE 8-2. Social Media Types


    | TYPE | EXAMPLES | DESCRIPTION |

    | --- | --- | --- |

    | Social networking | Twitter, Facebook, LinkedIn, MySpace | These sites function
    like large communities within smaller communities can be created, right down to
    a personal community. Have a wide range of activities, from conversations to sharing
    media, to playing games, to creating groups. |

    | Social bookmarking and news | Delicious, Digg, StumbleUpon | Pointing people
    useful sites and interesting news, with a community voting that promotes items
    higher up the rank based on getting more votes. |

    | Media sharing | YouTube, Flickr, SlideShare | Posting multimedia content for
    others to view and place on their sites. Often include internal commenting and
    rating systems as well. |

    | Social content | Wikipedia, Yelp, Yahoo! Answers, Ehow | Sites where questions
    are posed, multiple answers are given by others, and are rated; sites where reviews
    are posted; sites where pages are built and edited by editors. |


    > Social media have been transformational tools for marketing because of the capability
    to quickly and easily share information with large numbers of people while maintaining
    a personal connection. Equally transformational is the fact that each person has
    control over what they receive and who they associate with. You''re either a part
    of their conversation or you''re not.


    > Rule of Thumb Try to include at least one from each of these four categories
    in your web marketing plan.


    Beyond the big names listed in Table 8-2, there are hundreds of different social
    media tools out there. Even if they''re not widely used, your'
