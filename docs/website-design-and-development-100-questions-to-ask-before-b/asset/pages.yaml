  md: '# Automated Backups


    There are several options for automating the process of backing up both files
    and databases:


    +   **Built-in software backups**—The backup features or modules of CMSs and shopping
    carts allow for regularly scheduled backups of content files, databases, or both.
    These can be set to run daily, weekly, and so on, and you have the option to store
    the backups on the server or have them e-mailed to you. Some modules also offer
    the ability to send backups to an online storage provider such as Amazon S3.


    +   **Dedicated backup programs**—There are free or paid programs you install
    on your server to automatically provide backups of both site files and databases.
    You set the frequency and whether the backups will be stored on the server, e-mailed,
    or sent to another server.


    +   **Online backup services**—Instead of installing software on your server,
    these backup services operate from a web-based panel and perform regularly scheduled
    backups to their servers. The cost is pretty small (a few dollars per month),
    and it saves you from having an own location to store the backups.


    +   **Custom server programming**—You can hire your hosting company or a third
    party to create a backup routine on your server using what are called "cron jobs."
    Keep in mind that the backed-up files are still on the server, so you''ll need
    to offload them-to your computer or some other source.


    # Storing Your Backups


    The point of backing up your website is that if anything happens to it or the
    server, you can quickly upload it to a new location and get running again as quickly
    as possible. If your backups are stored with your site, you might lose them too,
    too if your server goes down. At the very least, you''d be able to access the
    backups until the server is restored, so you couldn''t set up a temporary site
    or move to a new hosting company.'
  merge: -1
