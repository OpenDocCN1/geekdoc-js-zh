  md: '# 43. Will Your Site Have Special Requirements for Certain Features to Work?


    When making decisions about features for your website or your organization, ask
    yourself whether you''re putting up needless barriers in (this case, I literally
    mean barriers). There''s nothing more frustrating when you click something and
    receive a message like the ones in Figure 5-19.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_130_0.png)


    You need the plug-in for the Mac OS Netscape Browser 6.x and later

    To make things easy, we''ve selected the IPX plug-in you need. If this is not
    the correct setup, a list of Alternative plug-ins and viewers is also available
    for you to choose from.


    FIGURE 5-19


    You''re trying to get some information or be entertained, and the website owner
    is making you work for it: Stop and download an unknown piece of software you''re
    not even you''ll need again.


    Flash is an example of software that you have to add to your browser as a plug-in.
    At one time it was hit or miss whether users had Flash installed in their browser,
    so website owners decided whether it was worth annoying users who didn''t have
    the plug-in. Now that Flash is standard in browsers (except for some mobile devices),
    it''s no longer a barrier it once


    Standard or not, if you create anything on your website that uses a plug-in, you
    should have an alternative without the plug-in. Even JavaScript needs to be considered
    a plug-in because people are able to turn it off, and so on. If you have a drop-down
    menu that uses JavaScript, for example, you should plan for how it will function
    if


    > You sometimes sees warnings that a site is "best viewed in browser X" with a
    link to download it. Don''t go through it. If a problem is so severe that someone
    cannot properly see your site in one of the major browsers, you need to fix the
    problem, not force people to get a new browser. At the same time, it''s not worth
    effective to make sure your site is viewable in browsers more than three or four
    versions old.'
