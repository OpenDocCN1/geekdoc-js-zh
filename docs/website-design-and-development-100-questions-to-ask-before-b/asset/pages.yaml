  md: '# CHAPTER 7 CONTENT


    # 62. How Will You Use Video or Audio in Your Content?


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_183_0.png)


    The power of video and audio also means that they''re done poorly, the bad impression
    will be all the stronger. Don''t rush out to make a video or audio without practice.
    Try these search terms:


    +   - tips for better videos

    - tips for a better speaking voice.


    The promise of multimedia on the Internet has to be realized over the last few
    years—faster computers, faster Internet connections, better web technology, cheaper
    recording equipment. What this means is that average website owner can take advantage
    of the power of video and audio to create even more compelling content.


    If content is on the Internet, video is making a play to become the king of content.
    That''s because in many ways, video can bring visitors to your subject matter
    more than words or images could.


    Here are some ideas to get you thinking about videos you can produce:


    +   - Demonstrate how your new lawnmower works.

    - Have customers send videos of them using your workout video.

