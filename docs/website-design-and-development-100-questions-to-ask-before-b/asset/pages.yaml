    how easily can you get support from a web hosting provider? There are five key
    types of support to look for:


    +   **Direct support**—Whether by phone, live chat, or even e-mail (as long as
    they get back to you within minutes), this is your ultimate form of tech support
    because it allows you to pinpoint your exact problem and hopefully reach a resolution
    quickly. At the very least, you''ll want direct support from 9 a.m.-5 p.m. in
    your zone, or 24/7 is always best.


    +   **Video tutorials**—Being able to see how to do something is the next thing
    to be getting through the process in person, but these do tend to cover general
    topics.


    +   **Contextual help screens**—Instead of reada a general help page, clicking
    these buttons gives you information based on where you are or what you need. Look
    for detailed information, not a two-line description that is thoroughly useless.
    Figure 2-4 shows an example of a contextual help screen.


