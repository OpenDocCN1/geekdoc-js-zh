  md: '# 41. How Easily Will Your Pages Print?


    Have you ever tried to print a web page and got dozens of pages with occasional
    bits of content? Or a dark background causes your printer to use huge amounts
    of toner to produce something unreadable anyway? You can save your visitors from
    frustrations as these by making your pages printer-friendly.


    There are two approaches to page printing:


    +   - Create print-friendly copies of individual pages.


    +   - Create a separate style sheet to control how any page print.


    The first technique is often used by media websites for printing their articles.
    The example in Figure 5-17 shows the web page with a popup window containing the
    specially formatted version.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_125_0.png)


    FIGURE 5-17


    The trouble with this approach is that you have to maintain two separate pages.
    This is not a big problem if you''re using a content management system that might
    provide the ability to use a template to configure content for printing. Even
    then, however, if visitors link to the print version instead of original, the
    original page loses the value of those links because the search engines see them
    two separate pages.'
  merge: -1
  pgno: 125
