  md: '# 52. Will Your HTML Be Bloated?


    Proper website construction techniques include keeping the actual HTML you see
    in your browser as minimal as possible. The two main culprits of bloated HTML
    files:


    +   - Not using external files where possible

    - Poor coding techniques


    Although JavaScript and CSS can be placed in an HTML file, they add a great deal
    to the size of the files. This would not be an issue if the extra code is unique
    to the individual HTML file, but typically the code is used by many if not all
    HTML files on a site. In such cases, it makes sense to put the JavaScript and
    CSS into external files.


    In Figure 6-6, compare the header area on the left with JavaScript and CSS in
    the HTML, and on the right same header with one-line references to external files
    containing the code:


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_153_0.png)'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# 52. WILL YOUR HTML BE BLOATED?


    Not only external JavaScript and CSS files help reduce the size of each page,
    but they speed up your site as a whole because of something called calling. Browsers
    will cache or store the information from a file reading it for the first time.
    If the same JavaScript were on every page, the browser would keep reading it every
    time. If its cached, the information is already there, so there''s no need to
    take up time again.


    But it''s just a case of having separate files from your HTML: you also want to
    avoid having too to spend a bit of time looking for each file. By putting all
    your JavaScript together, for example, the browser has to load only one file.


    The other culprit that for large HTML files is poor coding techniques. One technique
    for creating a 20-pixel blank space in HTML using transparent image: `<br /><img
    src=''spacer.gif'' height=''20px'' width=''10px'' border=''0''/>`. Now suppose
    you want this space at the end of each paragraph on the page. Even if there are
    only three paragraphs, you can see how much HTML is required. Compare with a single
    line of CSS specifying that all paragraphs have a 20-pixel margin at the bottom.


    I showed you in a previous question how using CSS styles in the HTML (inline styles)
    is not very flexible, but it also adds unnecessary coding. The same for using
    complex table structures to lay out a size. It''s not very efficient and makes
    your HTML files much larger.


    Another coding technique is to have large amounts of space between lines or areas
    in your HTML, JavaScript, or CSS files. Although this might make things easier
    to read in your text, that extra space actually takes up valuable loading time.


    > If you''re using JavaScript libraries (files that make it even add functionality),
    it''s handy to reference them on another, such as Google''s script repository,
    rather than storing them on your server. Browsers generally only access one or
    two files at a time from a different server, so count in limitation, and you can
    be leading more at one time.


    > If you get a JavaScript from the free script repositories on the Internet, you
    don''t have to keep its file separate. You can place JavaScript inside your main
    JavaScript file (be sure to keep the author attribution intact). As long as the
    functions used in the body still have same names, it doesn''t matter what the
    name of the overall script is.


    # On Video


    See how long bloated HTML pages can actually become.'
