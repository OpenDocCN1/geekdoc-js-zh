  md: '# Being Clear


    One of the first steps to being clear is to write for your audience, not for yourself.
    That means providing context or background that you might take for granted.


    Writing for your audience means using the terms you would use. In your industry
    you might talk about Commercial Real Estate while your audience is looking for
    Office Space. You might refer to your method as Therapy while your audience thinks
    of as Counseling.


    Being clear also involves explanations or descriptions one step at a time rather
    than jumping several points because they''re taken granted by people in the know.


    Another element of clarity is to get to the point quickly. This begins with the
    title of the content. It might be fine to create headline copy (and if it''s important
    to the concept of your website, go ahead), but in the vast majority of cases a
    clear descriptive title is much more effective for visitors as well as for search
    engines.


    Within the body of the content, it''s important for each paragraph to get to the
    point right away and then elongate. Long, verbose sentences do not help you get
    to the point. On the other hand, you don''t want your copy to be dumbed down.
    Write for your audience, and if it''s a wide audience, write somewhere in the
    lower half.


    # Being Well Structured


    As writing, the key to good structure is this: Get to the point. Just as visitors
    need to know immediately what your site is about, you need to know immediately
    that the content of the page they''ve landed on give them what they need immediately.


    If it takes three paragraphs to know that your interior design services include
    the commercial as well as the residential market, that''s too long for a visitor
    looking for commercial interior design. People need to scan first before reading,
    and if they don''t find the word commercial until the third paragraph, they might
    well give up before then.


    > Rule of Thumb For typical web pages, paragraphs should average about 3 sentences
    or roughly 60 words. Pages should be no more than 10 paragraphs long.


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_173_0.png)'
