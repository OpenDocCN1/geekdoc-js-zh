  md: '# 20. Do You Need an e-mail Account or an e-mail Alias


    Most e-mail addresses are connected to an e-mail account (sometimes called a mailbox),
    which is space on a server e-mail is stored and then retrieved by e-mail programs
    like Outlook Express, Thunderbird, or your mobile device. There are e-mail addresses
    that don''t have their own account and simply get redirected to an existing e-mail
    account; they are known as aliases.


    > > **Rule of Thumb** You''ll need at least one e-mail account for your website''s
    domain name. If nothing else, it helps keep personal e-mail separated.


    For example, if you have an e-mail account with the address name@domain.com, you
    can set up an e-mail alias offer@domain.com, which simply forwards to it. You
    don''t have to set up anything in your e-mail program because there''s no account
    for offer@domain.com. You can create many of these aliases and use one e-mail
    account or a variety of accounts, as shown in Figure 3-5.


    | Address | Forward To | Forwards |

    | :--- | :--- | :--- |

    | name@domain.com | george@domain.com | Details |

    | offer@domain.com | name@domain.com | Details |

    | sales@domain.com | george@domain.com | Details |

    | info@domain.com | george@domain.com | Details |


    # FIGURE 3-5


    Here are few ways to use e-mail aliases:


    +   * Easily sort your e-mail**—Even if you''re a one-person operation, you might
    have several areas on your website from which you contact you about different
    issues. The most common example would be Sales vs. Support. You can create an
    e-mail alias for each, and then they go to your main e-mail account. Not only
    will you know the e-mail is meant for a particular "department," but you can also
    create filters in your e-mail program, to place the e-mails in your own mail folders


    ![](img/3493f0a51a5c20b7f571f197b5a924b3_66_0.png)'
  merge: -1
