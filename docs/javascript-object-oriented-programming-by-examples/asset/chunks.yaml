    student1’s prototype object also has its prototype which is a  User object.


    When executed student1.logInfo(), JS engine searched the method in the  student1
    object first but was not found. Therefore, it continued to search for it in  student1’s
    prototype. It found the method there and invoked it.


    ![](Images/image00527.jpeg)


    teacher1.logInfo() proceeded in the same way as student1.logInfo() since  teacher1’s
    structure is almost the same as student1’s structure.


    ![](Images/image00528.jpeg)


    The  guard1 object has its prototype object (called Object I). And  guard1’s prototype
    object also has its prototype which is a User object (called Object II).


    When executed  guard1.logInfo(), JS engine searched the method in the  guard1  object
    first but was not found. Therefore, it continued to search in  guard1’s prototype
    (Object I) but was not found again. Followed the prototype chain, it continued
    to search in Object II and found the method there and invoked it.


    In conclusion, subclassing in JavaScript is built on the prototype chain.


    ### 5.6.7 ES5 JavaScript OOP for Old Browsers


    The  class keyword is not supported by old browsers such as Internet Explorer.
    Therefore, we have another solution in this section that implement JavaScript
    OOP in ES5 code.


    We will implement the  __extendsClass function to create a derived class from
    the base class. This function will


    ● set up the prototype chain so that derived class can use public methods of the
    base class


    ● initialize all properties of the derived class based on the base class


    ● create the constructor of the derived class


    The  __extendsClass function is as below.


    | 1 | var __extendsClass = (this && this.__extendsClass) &#124;&#124; (function
    () { |


    | 2 |  // d: derived; b: base; p: property |


    | 3 |  var extendStatics = function (d, b) { |


    | 4 |     extendStatics = Object.setPrototypeOf &#124;&#124; |


    | 5 | ({ __proto__: [] } instanceof  Array && function (d, b) { |


    | 6 |         d.__proto__ = b; |


    | 7 |       }) &#124;&#124; |


    | 8 |  function (d, b) { |


    | 9 |  for (var p in b) |


    | 10 |  if (Object.prototype.hasOwnProperty.call(b, p)) |


    | 11 |             d[p] = b[p]; |


    | 12 |       }; |


    | 13 |  return extendStatics(d, b); |


    | 14 |   }; |


    | 15 |  return  function (d, b) { |


    | 16 |  if (typeof b !== "function" && b !== null) |


    | 17 |  throw  new TypeError(String(b) + " is not a constructor or null"); |


    | 18 |     extendStatics(d, b); |


    | 19 |  function __() { |


    | 20 |  this.constructor = d; |


    | 21 |     } |


    | 22 | d.prototype = b === null ? Object.create(b) : (__.prototype = b.prototype,
    new __()); |


    | 23 |   }; |


    | 24 | })(); |


