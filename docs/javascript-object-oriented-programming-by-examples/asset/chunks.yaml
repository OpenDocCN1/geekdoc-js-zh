    # Chapter 5


    Object-Oriented Programming


    Object-Oriented Programming (OOP) is a programming method that takes objects as
    the foundation for building algorithms and building programs.


    In OOP, an object is understood as an instance in which the data and the procedures
    that act on the data are encapsulated together. The object is characterized by
    several operations and the information remembers the impact of these operations.
    Operations on an object are called methods or behaviors of that object.


    ## 5.1 Basic Concepts in OOP


    In this section, we will learn concepts like encapsulation, classes, and instance,
    object inheritance, polymorphism, and virtual methods where the concept of data
    hiding through encapsulation is the key matter.


    ### 5.1.1 Encapsulation


    Encapsulation is the ability to store data and the methods that act on an object
    separately from the others. All information in an object-oriented system is stored
    within its objects and can only be manipulated when the objects are ordered to
    perform operations.


    Encapsulation is not just the collection of data and programs into a block, they
    are also understood in the sense that it is the identity of the data and the operations
    that act on that data. All that is visible of the encapsulated object is the object''s
    communication methods.


    ### 5.1.2 Class and Instance


    Class is a data type defined in the program. However, the concept of a class goes
    even further, it contains the implementation of the properties as well as possible
    operations on the data. In general, the class characterizes a sample of several
    objects and describes the internal structure of these objects. Objects of the
    same class have the same definition of their operations and the same data structure.


    An instance is a real object in memory. In other words, the instance is a variable
    declared of type class. An instance is an object created from a class. The class
    describes the structure that includes the behavior and information of the instance,
    while the current state of the instance is determined by the operations performed
    on that instance.


    ### 5.1.3 Inheritance


    Classification of objects is the arrangement of objects with the same communication
    behavior into the same group. After subclassing, the next job is to build classes
    that are derived from existing classes called base classes. These classes, in
    addition to their properties, retain the characteristics of the base classes.
    In other words, they inherit the behavior and data of the base class. The class
    that inherits from the base class is called a derived class. These derived classes
    in turn act as the base classes of other derived classes.


    With inheritance we do not have to rebuild from scratch new classes, just need
    to add the necessary properties and methods into the derived classes. Thanks to
    inheritance, objects of different classes will share some methods of communication
    behaviors. Then we can send the same message to all objects with the same property,
    that is, objects with the same base type.


    ### 5.1.4 Polymorphism


    Polymorphism is the ability to send the same message to different objects that
    share the same characteristics. In other words, the message is sent regardless
    of which class the receiver belongs to, only that the set of recipients has a
    certain property in common.


    In OOP languages, polymorphism is represented by the ability to describe methods
    with the same name in different classes. This feature saves programmers from having
    to write cumbersome control structures in their programs. The different possibilities
    of the message are only really required when the program executes. The polymorphism
    of object-oriented programming is achieved mainly through concepts such as virtual
    methods, and dynamic linking techniques as below.


    ### 5.1.5 Virtual Method


    The dynamic binding technique allows us to interfere with the operation of entities
    without recompiling the program. We can transmit and receive information from
    these new objects just like the existing ones.'
