    \ add() { |\n\n| 12 |  return num1 + num2 + x + y; |\n\n| 13 |     } |\n\n| 14\
    \ | console.log(add()); // 33 |\n\n| 15 | } |\n\n| 16 | test(); |\n\n![Rat with\
    \ solid fill](Images/image00514.jpeg) The above example is also an example of\
    \ closure which will be introduced soon.\n\n## 3.10 Passing by Value vs. by Reference\n\
    \nParameters, which are not objects, are passed to functions by value — so if\
    \ the code within the body of a function assigns new values to parameters that\
    \ were passed to the function, the change is not reflected globally or in the\
    \ code called that function.\n\n| 1 | \"use strict\"; |\n\n| 2 | let x = 10; |\n\
    \n| 3 | function test(param) { |\n\n| 4 |     param = 100; |\n\n| 5 | } |\n\n\
    | 6 | test(x); |\n\n| 7 | console.log(x); // 10 |\n\nWhen you pass an object as\
    \ a parameter, if the function changes the object's properties, that change is\
    \ visible outside the function, as shown in the following example. We say that\
    \ the param was passed by reference.\n\n| 1 | \"use strict\"; |\n\n| 2 | let o\
    \ = { info: 10 }; |\n\n| 3 | function testObject(obj) { |\n\n| 4 |     obj.info\
    \ = 100; |\n\n| 5 | } |\n\n| 6 | testObject(o); |\n\n| 7 | console.log(o); //\
    \ {info: 100} |\n\n| 8 |  |\n\n| 9 | let a = [1, 2, 3]; |\n\n| 10 | function testArray(arr)\
    \ { |\n\n| 11 |     arr[0] = 10; |\n\n| 12 | } |\n\n| 13 | testArray(a); |\n\n\
    | 14 | console.log(a); // [10, 2, 3] |\n\n## 3.11 Function Overloading\n\nIf two\
    \ or more functions have the same name, the latest function definition will override\
    \ the others.\n\nExample 1:\n\n| 1 | \"use strict\"; |\n\n| 2 | function sum(x,\
    \ y) { |\n\n| 3 |  return x + y; |\n\n| 4 | } |\n\n| 5 | function sum(x, y, z)\
    \ { |\n\n| 6 |  return x + y + z; |\n\n| 7 | } |\n\n| 8 | console.log(sum(1, 2));\
    \ // NaN since z is undefined |\n\n| 9 | console.log(sum(1, 2, 3)); // 6 |\n\n\
    Example 2:\n\n| 1 | \"use strict\"; |\n\n| 2 | function sum(x, y, z) { |\n\n|\
    \ 3 |  return x + y + z; |\n\n| 4 | } |\n\n| 5 | function sum(x, y) { |\n\n| 6\
    \ |  return x + y; |\n\n| 7 | } |\n\n| 8 | console.log(sum(1, 2)); // 3 |\n\n\
    | 9 | console.log(sum(1, 2, 3)); // 3 since the 3rd argument was ignored |\n\n\
    ## 3.12 First-class Function\n\nFirst-class functions are functions that are treated\
    \ as variables. For example,\n\n● a function can be assigned as a value to a variable\n\
    \n| 1 | \"use strict\"; |\n\n| 2 | const sayHello = function () { |\n\n| 3 |   \
    \  console.log(\"Hello!\"); |\n\n| 4 | } |\n\n| 5 | sayHello(); // Hello! |\n\n\
    ● a function can be passed as an argument to other functions\n\n| 1 | \"use strict\"\
    ; |\n\n| 2 | function sayHello() { |\n\n| 3 |  return  \"Hello \"; |\n\n| 4 |\
    \ } |\n\n| 5 | function greeting(helloMessage, name) { |\n\n| 6 |     console.log(helloMessage()\
    \ + name); |\n\n| 7 | } |\n\n| 8 | // Pass sayHello as an argument to greeting\
    \ function |\n\n| 9 | greeting(sayHello, \"Neo\"); // Hello Neo |\n\n● a function\
    \ can be returned by another function\n\n| 1 | \"use strict\"; |\n\n| 2 | function\
    \ sayHello() { |\n\n| 3 |  return  function () { |\n\n| 4 |         console.log(\"\
    Hello!\"); |\n\n| 5 |     } |\n\n| 6 | } |\n\n| 7 | const myFunc = sayHello();\
    \ |\n\n| 8 | myFunc(); // Hello! |\n\n## 3.13 Context Binding\n\n### 3.13.1 bind\n\
    \nThe Function.prototype.bind() method helps us change the context of the  this\
    \ keyword.\n\nThe syntax is:\n\nbind(thisArg, arg1, ... , argN)\n\nwhere\n\n●   \
    \  thisArg is the object that the  this keyword will point to\n\n●     arg1, arg2,\
    \ ...argN (optional) are arguments of the function.\n\nExample 1:\n\n| 1 | \"\
    use strict\"; |\n\n| 2 | let obj = { |\n\n| 3 | firstName: \"Neo\", |\n\n| 4 |\
    \ lastName: \"D. Truman\" |\n\n| 5 | }; |\n\n| 6 |  |\n\n| 7 | function logInfo()\
    \ { |\n\n| 8 |     console.log(this.firstName + \" \" + this.lastName); |\n\n\
    | 9 | } |\n\n| 10 | let logInformation = logInfo.bind(obj); |\n\n| 11 | logInformation();\
    \ // Neo D. Truman |\n\nExample 2: input arguments into  bind()\n\n| 1 | \"use\
    \ strict\"; |\n\n| 2 | let obj = { |\n\n| 3 | firstName: \"Neo\", |\n\n| 4 | lastName:\
    \ \"D. Truman\" |\n\n| 5 | }; |\n\n| 6 |  |\n\n| 7 | function logInfo(email) {\
    \ |\n\n| 8 |     console.log(this.firstName + \" \" + this.lastName); |\n\n| 9\
    \ |     console.log(email); |\n\n| 10 | } |\n\n| 11 | let logInformation = logInfo.bind(obj,\
    \ \"neodtruman@gmail.com\"); |\n\n| 12 | logInformation(); |\n\n| 13 | // Neo\
    \ D. Truman |\n\n| 14 | // neodtruman@gmail.com |\n\nExample 3: does not input\
    \ arguments into  bind()\n\n| 1 | \"use strict\"; |\n\n| 2 | let obj = { |\n\n\
    | 3 | firstName: \"Neo\", |\n\n| 4 | lastName: \"D. Truman\" |\n\n| 5 | }; |\n\
    \n| 6 |  |\n\n| 7 | function logInfo(email) { |\n\n| 8 |     console.log(this.firstName\
    \ + \" \" + this.lastName); |"
