    \n# Chapter 2: Object\n\nIn JavaScript, object is the most-used component that\
    \ could contain many key-value pairs. In an object, a key can have value as a\
    \ function, called a method of the object.\n\n## 2.1 Creating Objects\n\nWe can\
    \ create an object using the curly brackets (`{}`) which enclose some key-value\
    \ pairs in the below syntax.\n\n```javascript\n{\n  key1: value1,\n  key2: value2,\n\
    \  …\n  keyN: valueN\n}\n```\n\nExample:\n\n| 1 | `\"use strict\"; |\n| 2 | `let\
    \ obj = {` |\n| 3 | `firstName: \"Neo\",` |\n| 4 | `lastName: \"D. Truman\",`\
