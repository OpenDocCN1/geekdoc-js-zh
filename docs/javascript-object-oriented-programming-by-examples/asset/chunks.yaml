    \    console.log(this); // undefined\n    console.log('Hi ' + this.name); // TypeError\n\
    }\nlet user = {\n    name: 'Neo',\n    sayHi: welcome\n}\nlet greetingFunc = user.sayHi;\n\
    greetingFunc();\n```\n\n### 4.3 globalThis\n\nThe `globalThis` property is used\
    \ to ensure working on the global object of the current environment. In the case\
    \ of web browsers, `globalThis` is always the `Window` object.\n\nAn example that\
