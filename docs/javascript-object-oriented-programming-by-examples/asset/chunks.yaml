  trans: "\n\n![Crocodile with solid fill](img/image00513.jpeg) 递归函数会将返回地址推入 `Call\
    \ Stack`（调用栈），导致它们的运行速度比普通函数慢。因此，如果可能，我们应该避免使用递归函数。\n\n## 3.7 箭头函数表达式\n\n箭头函数表达式是匿名的，具有以下局限性：\n\
    \n- 没有对 `this` 或 `super` 的绑定，不应将其用作对象的方法。\n- 不适用于 `call`、`apply` 和 `bind` 方法，这些方法通常依赖于建立作用域。\n\
    - 不能作为构造函数使用。\n- 在其体体内不能使用 `yield`。\n\n箭头函数表达式的语法：\n\n- 单个参数。对于简单的表达式返回是隐式的：\n\
    \  `param => expression`\n- 多个参数需要括号。对于简单的表达式返回是隐式的：\n  `(param1, ..., paramN)\
    \ => expression`\n- 多条语句需要大括号：\n  `param => {`\n    `expressions`\n  `}`\n- 多个参数需要括号，且多条语句需要大括号：\n\
    \  `(param1, ..., paramN) => {`\n    `expressions`\n  `}`\n\n示例 1：\n\n| 1 | `\"\
    use strict\";` |\n| 2 | `let sayHi = name => console.log(\"Hello \" + name);`\
    \ |\n| 3 | `sayHi('Neo'); // \"Hello Neo\"` |\n\n示例 2：\n\n| 1 | `\"use strict\"\
    ;` |\n| 2 | `let sayHi = (firstName, lastName) => console.log(`Hello ${firstName}\
    \  ${lastName}`);` |\n| 3 | `sayHi('Neo', 'D. Truman'); // \"Hello Neo D. Truman\"\
    ` |\n\n示例 3：\n\n| 1 | `\"use strict\";` |\n| 2 | `let sayHi = name => {` |\n|\
    \ 3 | `  let upperCaseName = name.toUpperCase();` |\n| 4 | `    console.log(\"\
    Hello \" + upperCaseName);` |\n| 5 | `}` |\n| 6 | `sayHi('Neo'); // \"Hello NEO\"\
    ` |\n\n示例 4：\n\n| 1 | `\"use strict\";` |\n| 2 | `let sayHi = (firstName, lastName)\
    \ => {` |\n| 3 | `  let upperCaseFirstname = firstName.toUpperCase();` |\n| 4\
    \ | `  let upperCaseLastname = lastName.toUpperCase();` |\n| 5 | `    console.log(`Hello\
    \ ${upperCaseFirstname}  ${upperCaseLastname}`);` |\n| 6 | `}` |\n| 7 | `sayHi('Neo',\
    \ 'D. Truman'); // \"Hello NEO D. TRUMAN\"` |\n\n## 3.8 立即调用函数表达式\n\nIIFE（立即调用函数表达式）是在其定义代码之后立即被调用的函数。使用\
    \ IIFE 的目的之一避免污染全局命名空间。\n\n语法如下：\n\n```javascript\n(function () {\n //// some\
    \ code here\n})(); // 这一行的括号表示调用该函数\n```\n\n示例：\n\n| 1 | `\"use strict\";` |\n\
    | 2 | `(() => {` |\n| 3 | `  let someVariable = 10;` |\n| 4 | `    console.log(someVariable);`\
    \ |\n| 5 | `  // 使用上述变量的一些初始化代码` |\n| 6 | `})();` |\n| 7 | `// someVariable 在函数执行后会被丢弃。`\
    \ |\n\n## 3.9 函数作用域\n\n在函数内部定义的变量仅在函数内部或通过 `closure`（闭包）可用。\n\n然而，函数可以访问定义在其所在作用域内的所有变量和函数。\n\
    \n- 换句话说，定义在全局作用域的函数可以访问全局作用域定义的所有变量。\n\n| 1 | `\"use strict\";` |\n| 2 | `//\
    \ 这些变量定义在全局作用域中` |\n| 3 | `let num1 = 10,` |\n| 4 | `    num2 = 20;` |\n| 5 |\
    \ `// 这个函数也定义在全局作用域中` |\n| 6 | `function sum() {` |\n| 7 | `  return num1 + num2;`\
    \ |\n| 8 | `}` |\n| 9 | `console.log(sum()); // 30`\n\n- 定义在另一个函数内部的函数也可以访问父函数的变量。\n\
    \n| 1 | `\"use strict\";` |\n| 2 | `// 这些变量定义在全局作用域` |\n| 3 | `let num1 = 10,`\
    \ |\n| 4 | `    num2 = 20;` |\n| 5 | `|` |\n| 6 | `// 嵌套函数示例` |\n| 7 | `function\
    \ test() {` |\n| 8 | `  let x = 1,` |\n| 9 | `        y = 2;` |\n| 10 | `|` |\n\
    | 11 | `  function add() {` |\n| 12 | `  return num1 + num2 + x + y;` |\n| 13\
    \ | `  }` |\n| 14 | `  console.log(add()); // 33` |\n| 15 | `}` |\n| 16 | `test();`\
    \ |\n\n![Images/image0514.jpeg) 上述示例也是闭包的示例。\n\n## 3.10 按值传递与引用传递\n\n不是对象的参数按值传递给函数——因此如果函数体内对参数赋值的新值不会反映到全局或调用该函数的地方。\n\
    \n| 1 | `\"use strict\";` |\n| 2 | `let x = 10;` |\n| 3 | `function test(param)\
    \ {` |\n| 4 | `    param = 100;` |\n| 5 | `}` |\n| 6 | `test(x);` |\n| 7 | `console.log(x);\
    \ // 10` |\n\n当传递对象时，如果函数更改了对象的属性，该更改在外部是可见的，如下所示。我们说 `param` 是按传递的。\n\n| 1 |\
    \ `\"use strict\";` |\n| 2 | `let o = { info: 10 };` |\n| 3 | `function testObject(obj)\
    \ {` |\n| 4 | `    obj.info = 100;` |\n| 5 | `}` |\n| 6 | `testObject(o);` |\n\
    | 7 | `console.log(o); // {info: 100}` |\n| 8 | `|` |\n| 9 | `let a = [1, 2, 3];`\
    \ |\n| 10 | `function testArray(arr) {` |\n| 11 | `    arr[0] = 10;` |\n| 12 |\
    \ `}` |\n| 13 | `testArray(a);` |\n| 14 | `console.log(a); // [10, 2, 3]` |\n\n\
    ## 3.11 函数重载\n\n如果两个或多个函数具有相同的名称，后定义的函数将覆盖之前的。\n\n示例 1：\n\n| 1 | `\"use strict\"\
    ;` |\n| 2 | `function sum(x, y) {` |\n| 3 | `  return x + y;` |\n| 4 | `}` |\n\
    | 5 | `function sum(x, y, z) {` |\n| 6 | `  return x + y + z;` |\n| 7 | `}` |\n\
    | 8 | `console.log(sum(1, 2)); // 因为 z 是 undefined，所以是 NaN` |\n| 9 | `console.log(sum(1,\
    \ 2, 3));` |\n\n示例 2：\n\n| 1 | `\"use strict\";` |\n| 2 | `function sum(x, y,\
    \ z) {` |\n| 3 | `  return x + y + z;` |\n| 4 | `}` |\n| 5 | `function sum(x,\
    \ y) {` |\n| 6 | `  return x + y;` |\n| 7 | `}` |\n| 8 | `console.log(sum, 1));`\
    \ |\n\n## 3.12 一等函数\n\n一等函数是被视为变量函数。例如，函数可以被赋值为一个值。\n\n| 1 | `\"use strict\";`\
    \ |\n| 2 | `const sayHello = function() {` |\n| 3 | `  console.log(\"Hello!\"\
    );` |\n| 4 | `};` |\n| 5 | `sayHello();` |\n\n函数可以作为参数传递。\n\n| 1 | `\"use strict\"\
    ;` |\n| 2 | `function greet(fn) {` |\n| 3 | `  fn();` |\n| 4 | `}` |\n| 5 | `greet(sayHello);`\
    \ |\n\n函数可以被另一个函数返回。\n\n| 1 | `\"use strict\";` |\n| 2 | `function getGreeting()\
    \ {` |\n| 3 | `  return function() {` |\n| 4 | `    console.log(\"Hello!\");`\
    \ |\n| 5 | `  };` |\n| 6 | `}` |\n| 7 | `const myFunc = getGreeting();` |\n| 8\
    \ | `myFunc();` |\n\n## 3.13 上下文绑定\n\n`Function.prototype.bind()` 方法帮助我们更改 `this`\
    \ 关键字。\n\n语法为：\n`bind(thisArg, arg1, ...N)`\n\n其中\n- `thisArg` 是 `this` 关键字指向的对象\n\
    - `arg1, arg2, ...N`（可选）是函数的参数。\n\n示例 1：\n\n| 1 | `\"use strict\";` |\n| 2 | `let\
    \ obj = {` |\n| 3 | `  firstName: \"Neo\",` |\n| 4 | `  lastName: \"D. Truman\"\
    ` |\n| 5 | `};` |\n| 6 | `|` |\n| 7 | `function logInfo() {` |\n| 8 | `  console.log(this.firstName\
    \ + \" \" + this.lastName);` |\n| 9 | `}` |\n| 10 | `let logInformation = logInfo.bind(obj);`\
    \ |\n| 11 | `logInformation(); // Neo D. Truman` |\n\n示例 2：向 `bind()` 输入参数。\n\n\
    | 1 | `\"use strict\";` |\n| 2 | `let obj = {` |\n| 3 | `  firstName: \"Neo\"\
    ,` |\n| 4 | `  lastName: \"D. Truman\"` |\n| 5 | `};` |\n| 6 | `|` |\n| 7 | `function\
    \ logInfo(email) {` |\n| 8 | `  console.log(this.firstName + \" \" + this.lastName);`\
    \ |\n| 9 | `  console.log(email);` |\n| 10 | `}` |\n| 11 | `let logInformation\
    \ = logInfo.bind(obj, \"neodtruman@gmail.com\");` |\n| 12 | `logInformation();`\
    \ |\n| 13 | `// Neo D. Truman` |\n| 14 | `// neodtruman@gmail.com` |\n\n示例 3：不向\
    \ `bind()` 输入参数。\n\n"
- fmt: "\n```javascript\n9 | console.log(email);\n10 | }\n11 | let logInformation\
    \ = logInfo.bind(obj);\n12 | logInformation(\"neodtruman@gmail.com\");\n13 | //\
    \ Neo D. Truman\n14 | // neodtruman@gmail.com\n```\n\n### 3.13.2 call\n\nThe `Function.prototype.call()`\
    \ method works in the same way as `bind()` however `call()` will invoke the function\
    \ (as its name, “call”) but `bind()` does not.\n\nThe syntax is:\n\n`call(thisArg,\
    \ arg1, ... , argN)`\n\nwhere:\n\n● `thisArg` is the object that the `this` keyword\
    \ will point to\n● `arg1`, `arg2`, ...`argN` (optional) are arguments of the function.\n\
    \n#### Example 1:\n\n```javascript\n1 | \"use strict\";\n2 | let obj = {\n3 |\
    \ firstName: \"Neo\",\n4 | lastName: \"D. Truman\"\n5 | };\n6 | \n7 | function\
    \ logInfo() {\n8 |     console.log(this.firstName + \" \" + this.lastName);\n\
    9 | }\n10 | logInfo.call(obj); // Neo D. Truman\n```\n\n#### Example 2:\n\n```javascript\n\
    1 | \"use strict\";\n2 | let obj = {\n3 | firstName: \"Neo\",\n4 | lastName: \"\
    D. Truman\"\n5 | };\n6 | \n7 | function logInfo(email) {\n8 |     console.log(this.firstName\
    \ + \" \" + this.lastName);\n9 |     console.log(email);\n10 | }\n11 | // We can\
    \ get email from user and push it into the array of arguments\n12 | let args =\
    \ [\"neodtruman@gmail.com\"];\n13 | logInfo.apply(obj, args);\n14 | // Neo D.\
    \ Truman\n15 | // neodtruman@gmail.com\n```\n\n`call()` provides a new value of\
    \ `this` to the function/method. With `call()`, you can write a method once and\
    \ then inherit it in another object without rewriting the method for the new object.\n\
    \n```javascript\n1 | \"use strict\";\n2 | let obj1 = {\n3 | firstName: \"Neo\"\
    ,\n4 | lastName: \"D. Truman\",\n5 | getFullname: function () {\n6 |     return\
    \ this.firstName + \" \" + this.lastName;\n7 |     }\n8 | };\n9 | let obj2 = {\n\
    10 | firstName: \"John\",\n11 | lastName: \"Conner\",\n12 | }\n13 | let fullname\
    \ = obj1.getFullname.call(obj2);\n14 | console.log(fullname); // John Conner\n\
    ```\n\nWe can also use `call()` to chain constructors for an object like the below\
    \ example.\n\n```javascript\n1 | \"use strict\";\n2 | function Thing(name, price)\
    \ {\n3 |     this.name = name;\n4 |     this.price = price;\n5 | }\n6 | \n7 |\
    \ function SchoolThing(name, price) {\n8 |     Thing.call(this, name, price);\n\
    9 |     this.category = 'School Thing';\n10 | }\n11 | \n12 | const book = new\
    \ SchoolThing('Student Book', 6);\n13 | console.log(book);\n14 | // SchoolThing\
    \ {name: 'Student Book', price: 6, category: 'School Thing'}\n```\n\n### 3.13.3\
    \ apply\n\nThe `Function.prototype.apply()` method works in the same way as `call()`\
    \ however `apply()` will receive an array of arguments of the function. Accepting\
    \ an array of arguments helps us generate the arguments at runtime and “send”\
    \ to the function.\n\nThe syntax is:\n\n`apply(thisArg, argsArray)`\n\nwhere:\n\
    \n● `thisArg` is the object that the `this` keyword will point to\n● `argsArray`\
    \ (optional) is the array of arguments of the function.\n\n#### Example:\n\n```javascript\n\
    1 | \"use strict\";\n2 | let obj = {\n3 | firstName: \"Neo\",\n4 | lastName: \"\
    D. Truman\"\n5 | };\n6 | \n7 | function logInfo(email) {\n8 |     console.log(this.firstName\
    \ + \" \" + this.lastName);\n9 |     console.log(email);\n10 | }\n11 | // We can\
    \ get email from user and push it into the array of arguments\n12 | let args =\
    \ [\"neodtruman@gmail.com\"];\n13 | logInfo.apply(obj, args);\n14 | // Neo D.\
    \ Truman\n15 | // neodtruman@gmail.com\n```\n\n## 3.14 Closure\n\n### 3.14.1 Introduction\n\
    \nA closure gives you access to an outer function's scope from an inner function.\
    \ In JavaScript, closure is created every time a function is created inside another\
    \ function and the function use its parent’s variables.\n\n```javascript\n1 |\
    \ \"use strict\";\n2 | \n3 | function sayHi(firstName) {\n4 |     let lastName\
    \ = 'D. Truman';\n5 |     return function doLog(message) {\n6 |         debugger;\n\
    7 |         console.log(`${firstName} ${lastName}. ${message}`);\n8 |     };\n\
    9 | }\n10 | \n11 | let greetingFunc = sayHi('Neo');\n12 | greetingFunc('How are\
    \ you?');\n13 | // Neo D. Truman. How are you?\n```\n\nWhen we run the above code,\
    \ the debugger of the browser will stop at the `debugger` breakpoint (line 6)\
    \ as below picture.\n\n![](Images/image0515.jpeg)\n\nWe can see in the above picture,\
    \ the `doLog()` function can access these variables:\n\n● Local variables: `message`:\
    \ parameter of `doLog()` function\n● Closure variables from `sayHi()` function:\
    \ `firstName`: parameter of `sayHi()` function, `lastName`: local variable of\
    \ `sayHi()` function\n\nThe reason is that nested functions in JavaScript could\
    \ form closures. A closure is actually a function scope that consists of all local\
    \ variables of the function so the inner function could refer to them. In this\
    \ case, `greetingFunc` is a reference to the instance of the function `doLog()`\
    \ that is created when `sayHi()` is run. The instance of `doLog()` having (`firstName`\
    \ and `lastName`) to its parent function. For this reason, `firstName` and `lastName`\
    \ variables are available in the `Closure(sayHi)`. As a result, when `greetingFunc`\
    \ is invoked, `\"Neo D. Truman. How are you?\"` is printed to the console.\n\n\
    ![Crocodile with solid fill](Images/image0516.jpeg)\n\nThe closure will negatively\
    \ affect script performance both in terms of processing speed and memory consumption.\
    \ Therefore, we should avoid creating nested functions if we don’t need. The below\
    \ example shows that there are nested functions but there is no closure since\
    \ the inner function doesn’t refer to its parent’s variables.\n\n```javascript\n\
    1 | \"use strict\";\n2 | \n3 | function sayHi(firstName) {\n4 |     let lastName\
    \ = 'D. Truman';\n5 |     return function doLog(message) {\n6 |         debugger;\n\
    7 |         console.log(message);\n8 |     };\n9 | }\n10 | \n11 | let greetingFunc\
    \ = sayHi('Neo');\n12 | greetingFunc('How are you?');\n```\n\nWhen we run the\
    \ above code, the debugger of the browser will stop at the `debugger` breakpoint\
    \ (line 6) as below picture.\n\n![](Images/image0517.jpeg)\n\nWe can see in the\
    \ above picture, that the `doLog()` function didn’t access any variables of the\
    \ `sayHi()` function. Therefore, in the Scope Chain, there is no `Closure(sayHi)`\
    \ as in the previous example.\n\n### 3.14.2 Private Properties and Methods using\
    \ Closures\n\nWe can emulate private properties and methods of objects using closures\
    \ since the object can access variables and functions in its closure but does\
    \ not own them. The following code illustrates how to use closures to define private\
    \ properties and methods of an object.\n\n```javascript\n1 | \"use strict\";\n\
    2 | function makeUserObject() {\n3 |     let name = 'Neo';\n4 |     function allCap(str)\
    \ {\n5 |         return str.toUpperCase();\n6 |     }\n7 | \n8 |     return {\n\
    9 |         getUpperCaseName: function () {\n10 |             debugger;\n11 |\
    \             return allCap(name);\n12 |         },\n13 |         getName: function\
    \ () {\n14 |             return name;\n15 |         },\n16 |         setName:\
