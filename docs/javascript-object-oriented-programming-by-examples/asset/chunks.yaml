  trans: "\n\n# Example：\n\n```javascript\n\"use strict\";\n\nfunction doLog(info)\
    \ {\n    console.log(info);\n}\nfunction doAlert(info) {\n    alert(info);\n}\n\
    \nfunction processName(callback) {\n  let name = 'Neo';\n    callback(name);\n\
    }\nprocessName(doLog);\nprocessName(doAlert);\n```\n\n## 3.16 生成器函数 (Generator\
    \ Function)\n\n`function*` 正是一个生成器，它根据函数体内部的 `yield` 表达式或 `yield*` 返回不同的值（到另一个生成器函数）。\n\
    \n生成器的 `next()` 方法返回一个带有 `value` 和 `done` 属性的对象。\n\n### 示例 1:\n\n```javascript\n\
    \"use strict\";\nfunction* generator(x) {\n  yield x;\n  yield x * 2;\n  yield\
    \ x * 5;\n}\n\nconst gen = generator(10);\n\nconsole.log(gen.next()); // {value:\
    \ 10, done: false}\nconsole.log(gen.next()); // {value: 20, done: false}\nconsole.log(gen.next());\
    \ // {value: 50, done: false}\nconsole.log(gen.next()); // {value: undefined,\
    \ done: true}\n```\n\n### 示例 2:\n\n```javascript\n\"use strict\";\nfunction* anotherGenerator(y)\
    \ {\n  yield y * 3;\n  yield y * 4;\n}\n\nfunction* generator(x) {\n  yield x;\n\
    \  yield x * 2;\n  yield* anotherGenerator(x);\n  yield x * 5;\n}\n\nconst gen\
    \ = generator(10);\n\nconsole.log(gen.next()); // {value: 10, done: false}\nconsole.log(gen.next());\
    \ // {value: 20, done: false}\nconsole.log(gen.next()); // {value: 30, done: false}\n\
    console.log(gen.next()); // {value: 40, done: false}\nconsole.log(gen.next());\
    \ // {value: 50, done: false}\nconsole.log(gen.next()); // {value: undefined,\
    \ done: true}\n```\n\n生成器中的 `return` 语句会让生成器完成其工作（即其返回的对象的 `done` 属性将设置为 `true`）。返回的值将被设置为生成器返回的对象的\
    \ `value` 属性。\n\n### 示例 3:\n\n```javascript\n\"use strict\";\nfunction* generator(x)\
    \ {\n  yield x;\n  return x * 2;\n  yield x * 5; // 不可到达\n}\n\nconst gen = generator(10);\n\
    \nconsole.log(gen.next()); // {value: 10, done: false}\nconsole.log(gen.next());\
    \ // {value: 20, done: true}\nconsole.log(gen.next()); // {value: undefined, done:\
    \ true}\n```\n\n与 `return` 语句类似，生成器内部抛出的错误将使生成器结束——除非在生成器体内部被捕获。当生成器结束后，随后的 `next()`\
    \ 调用将不会执行该生成器的任何代码，它们将只返回此类形式的对象：`{value: undefined, done: true}`。\n\n### 示例 4:\n\
    \n```javascript\n\"use strict\";\nfunction* generator(x) {\n  yield x;\n  throw\
    \ 'Error here';\n  yield x * 5; // 不可到达\n}\n\nconst gen = generator(10);\n\nconsole.log(gen.next());\
    \ // {value: 10, done: false}\ntry {\n  console.log(gen.next());\n} catch (error)\
    \ {\n  console.log(error); // Error here\n}\nconsole.log(gen.next());// {value:\
    \ undefined, done: true}\n```\n\n为 `next()` 方法提供一个参数可以向生成器发送值。语法为：\n\n`next(value)`\n\
    \n其中\n\n* `variable = yield expression`，传递给 `next()` 函数的值将赋值给 `variable`。\n\n\
    ### 示例:\n\n```javascript\n\"use strict\";\nfunction* idGenerator() {\n  let counter\
    \ = 0;\n  while (true) {\n    let seeker = yield ++counter;\n    if (seeker) {\n\
    \      counter += seeker;\n    }\n  }\n}\n\nconst generateId = idGenerator();\n\
    console.log(generateId.next().value); // 1\nconsole.log(generateId.next().value);\
    \ // 2\nconsole.log(generateId.next().value); // 3\nconsole.log(generateId.next(2).value);\
    \ // 6 (跳过两个 id)\nconsole.log(generateId.next().value); // 7\nconsole.log(generateId.next(-3).value);\
    \ // 5 (回滚三个 id)\nconsole.log(generateId.next().value); // 6\n```\n\n# 第 4 章\n\
    \n## JavaScript 中的 this\n\n### 4.1 函数中的 this\n\n在非严格模式下，在 Web 浏览器中工作时，函数（各种类型的函数）中的\
    \ `this` 是 `Window` 对象，如下所示。\n\n```javascript\n// 函数声明\nfunction testFunc1() {\n\
    \    console.log(this); // Window 对象\n}\ntestFunc1();\n\n// 函数表达式\nlet testFunc2\
    \ = function () {\n    console.log(this); // Window 对象\n}\ntestFunc2();\n\n//\
    \ 嵌套函数\nfunction test3() {\n  // 函数声明\n  function testFunc3() {\n    console.log(this);\
    \ // Window 对象\n  }\n  testFunc3();\n\n  // 函数表达式\n  let testFunc4 = () => {\n\
    \    console.log(this); // undefined\n  }\n  testFunc4();\n}\n```\n\n在 Web 浏览器中工作时，函数（各种类型的函数）中的\
    \ `this` 是 `Window` 对象，如下所示。\n\n```javascript\n// 函数声明\nfunction testFunc1() {\n\
    \    console.log(this); // Window 对象\n}\ntestFunc1();\n\n// 函数表达式\nlet testFunc2\
    \ = function () {\n    console.log(this); // Window 对象\n}\ntestFunc2();\n\n//\
    \ 嵌套函数\nfunction test3() {\n  // 函数声明\n  function testFunc3() {\n    console.log(this);\
    \ // Window 对象\n  }\n  testFunc3();\n\n  // 函数表达式\n  let testFunc4 = () => {\n\
    \    console.log(this); // undefined\n  }\n  testFunc4();\n}\n```\n\n在 Web 浏览器中工作时，函数（各种类型的函数）中的\
    \ `this` 是 `Window` 对象，如下所示。\n\n```javascript\n// 函数声明\nfunction testFunc1() {\n\
    \    console.log(this); // Window 对象\n}\ntestFunc1();\n\n// 函数表达式\nlet testFunc2\
    \ = function () {\n    console.log(this); // Window 对象\n}\ntestFunc2();\n\n//\
    \ 嵌套函数\nfunction test3() {\n  // 函数声明\n  function testFunc3() {\n    console.log(this);\
    \ // Window 对象\n  }\n  testFunc3();\n\n  // 函数表达式\n  let testFunc4 = () => {\n\
    \    console.log(this); // undefined\n  }\n  testFunc4();\n}\n```\n\n在 Web 浏览器中工作时，函数（各种类型的函数）中的\
    \ `this` 是 `Window` 对象，如下所示。\n\n```javascript\n// 函数声明\nfunction testFunc1() {\n\
    \    console.log(this); // Window 对象\n}\ntestFunc1();\n\n// 函数表达式\nlet testFunc2\
    \ = function () {\n    console.log(this); // Window 对象\n}\ntestFunc2();\n\n//\
    \ 嵌套函数\nfunction test3() {\n  // 函数声明\n  function testFunc3() {\n    console.log(this);\
    \ // Window 对象\n  }\n  testFunc3();\n\n  // 函数表达式\n  let testFunc4 = () => {\n\
    \    console.log(this); // undefined\n  }\n  testFunc4();\n}\n```\n\n### 4.2 对象方法中的\
    \ this\n\n由于对象的方法也是函数，因此方法中的 `this` 关键字的行为与函数中的相同（见上一节）。\n\n### 示例 1:\n\n```javascript\n\
    \"use strict\";\nlet user = {\n  name: 'Neo',\n  logInfo: function () { // 函数表达式\n\
    \    console.log(this);\n  },\n  showInfo: () => { // 箭头函数\n    console.log(this);\n\
    \  }\n}\nuser.logInfo(); // {name: 'Neo', logInfo: f, showInfo: f}\nuser.showInfo();\
    \ // Window 对象\n```\n\n### 示例 2:\n\n```javascript\n\"use strict\";\nfunction testUser()\
    \ {\n  let user = {\n    name: 'Neo',\n    logInfo: function () { // 函数表达式\n \
    \     console.log(this);\n    },\n    showInfo: () => { // 箭头函数\n      console.log(this);\n\
    \    }\n  }\n  user.logInfo(); // {name: 'Neo', logInfo: f, showInfo: f}\n  user.showInfo();\
    \ // undefined\n}\ntestUser();\n```\n\n### 示例 3: 嵌套函数中的 this 将为 undefined\n\n\
    ```javascript\n\"use strict\";\nlet user = {\n  firstName: 'Neo',\n  lastName:\
    \ 'D. Truman',\n}\n```\n\n"
- fmt: "\n```javascript\nshowFullname: function () {\n    console.log(this.firstName\
    \ + ' ' + this.lastName);\n    function sayHi() {\n        console.log(this);\
    \ // undefined\n        console.log('Hi ' + this.firstName + ' ' + this.lastName);\
    \ // TypeError\n    }\n    sayHi();\n}\nuser.showFullname();\n```\n\nExample 4:\
    \ a solution for example 3 is saving the pointer to object at outer function and\
    \ use it in the inner function (a closure)\n\n```javascript\n\"use strict\";\n\
    let user = {\n    firstName: 'Neo',\n    lastName: 'D. Truman',\n    showFullname:\
    \ function () {\n        console.log(this.firstName + ' ' + this.lastName);\n\
    \        let self = this;\n        function sayHi() {\n            console.log(self);\n\
    \            // self is {firstName: 'Neo', lastName: 'D. Truman', showFullname:\
    \ f}\n            console.log('Hi ' + self.firstName + ' ' + self.lastName);\n\
    \            // Hi Neo D. Truman\n        }\n        sayHi();\n    }\n}\nuser.showFullname();\n\
    ```\n\nWe should not use arrow functions in these cases:\n\n- Case #1: Define\
    \ methods in object or class. Examples areas above.\n- Case #2: Define callback\
    \ events of DOM’s elements.\n- Case #3: Define methods in the object’s prototype.\n\
    \nsince `this` might refer to the `Window` object or could be `undefined` as above\
    \ examples.\n\n### Example for case #2\n\nHTML code (added to `index.html`):\n\
    ```html\n<button id=\"btn-test\">Test</button>\n```\nJavaScript code:\n```javascript\n\
    \"use strict\";\nlet btnTest = document.getElementById('btn-test');\n// on clicked\n\
    btnTest.addEventListener('click', () => {\n    // this is not the btnTest button\
    \ as expected\n    console.log(this); // Window object\n});\n// on double-clicked\n\
    btnTest.addEventListener('dblclick', function () {\n    console.log(this); //\
    \ 'btn-test' button\n});\n```\n\n### Example for case #3:\n\n```javascript\n\"\
    use strict\";\nfunction User(name) {\n    this.name = name;\n}\nUser.prototype.logInfo\
    \ = () => {\n    console.log(this);\n}\nUser.prototype.showInfo = function ()\
    \ {\n    console.log(this);\n}\nlet user = new User('Neo');\nuser.logInfo(); //\
    \ Window object\nuser.showInfo(); // {name: 'Neo'}\n```\n\n### 4.2.1 Implicit\
    \ Binding\n\nThe below example defines object’s method using function expression.\
    \ Therefore, `this` refers to the object.\n\nExample:\n```javascript\n\"use strict\"\
    ;\nfunction welcome() {\n    console.log(this); // {name: 'Neo', sayHi: f}\n \
    \   console.log('Hi ' + this.name); // Hi Neo\n}\nlet user = {\n    name: 'Neo',\n\
    \    sayHi: welcome\n}\nuser.sayHi();\n```\n\n### 4.2.2 Implicit Binding\n\nContinue\
