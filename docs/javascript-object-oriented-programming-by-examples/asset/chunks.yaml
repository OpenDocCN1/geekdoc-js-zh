    # Preface


    Object-Oriented Programming (OOP) is a programming method that takes objects as
    the foundation. This book introduces OOP concepts like encapsulation, classes,
    and instances, object inheritance, etc., and guides you on how to do OOP in JavaScript.


    JavaScript is the world''s most used programming language, which is one of the
    core technologies of the World Wide Web, alongside HTML and CSS. Websites use
    JavaScript on the client-side for web page behavior and user interaction. All
    major web browsers have their JavaScript engine to execute the JavaScript code
    on the web pages.


    ## Book Audience


    The book targets intermediate developers who already know basic JavaScript programming.
    It starts by introducing all concepts related to OOP. Then, Object-Oriented Programming
    in JavaScript will be introduced in the last chapter when you knew all the related
    concepts.


    If you want to learn JavaScript from basic to the most difficult topics, please
    read [another book by the author](https://www.amazon.com/dp/B09VDRLYBT).


    ## How to Contact Us


    My email is [neodtruman@gmail.com](mailto:neodtruman@gmail.com). If you have any
    questions, please send me an email. I am always happy to hear from people who’ve
    read my books. I’ll try my best to answer every email I receive. The subject should
    be “[JavaScript Object-Oriented Programming By Examples] <Your subject here>”
    so that I could filter and answer your questions quickly.


    You can also follow me on the Amazon Author page, [https://www.amazon.com/Neo-D-Truman/e/B09P6LHL2M](https://www.amazon.com/Neo-D-Truman/e/B09P6LHL2M)


    ## Conventions Used in This Book


    The following typographical conventions are used in this book:


    Italic


    Indicates new terms, URLs, email addresses, filenames, and file extensions.


    Bold


    Indicates important concepts or UI items such as menu items and buttons to be
    selected or clicked.


    Constant width


    Indicates computer code including statements, functions, classes, objects, methods,
    properties, etc.


    Constant width bold


    Shows commands or other text that should be typed literally by the user.


    Constant width italic


    Shows text that should be replaced with user-supplied values or values determined
    by context.


    ![Fish with solid fill](Images/image00491.jpeg) This element signifies a general
    note.


    ![Rat with solid fill](Images/image00492.jpeg) This element signifies a tip or
    suggestion.


    ![Crocodile with solid fill](Images/image00493.jpeg) This element indicates a
    warning or caution.


