    10 | }\n11 | // 我们可以从用户获取 email 并将其推入参数数组\n12 | let args = [\"neodtruman@gmail.com\"\
    ];\n13 | logInfo.apply(obj, args);\n14 | // Neo D. Truman\n15 | // neodtruman@gmail.com\n\
    ```\n\n## 3.14 闭包 (Closure)\n\n### 3.14.1 简介\n\n闭包允许函数访问其定义时所在的作用域中的变量，即使该作用域已经执行完毕。闭包是\
    \ JavaScript 中非常强大的特性。\n\n```javascript\n1 | \"use strict\";\n2 | function outer(x)\
    \ {\n3 |     let count = 0;\n4 |     return function inner(y) {\n5 |         count++;\n\
    6 |         console.log(x, y, count);\n7 |     };\n8 | }\n9 | \n10 | let func\
    \ = outer(\"hello\");\n11 | func(1); // hello 1 1\n12 | func(2); // hello 2 2\n\
    ```\n\n闭包“记住”了它被创建时的环境。当一个函数被创建时，它会携带一个对其定义环境的引用。这意味着即使外部函数已经执行并返回，内部函数仍然可以访问外部函数的局部变量。\n\
    \n```javascript\n1 | \"use strict\";\n2 | function counter() {\n3 |     let count\
    \ = 0;\n4 |     return function() {\n5 |         count++;\n6 |         return\
    \ count;\n7 |     };\n8 | }\n9 | \n10 | let increment = counter();\n11 | console.log(increment());\
    \ // 1\n12 | console.log(increment()); // 2\n13 | console.log(increment()); //\
    \ 3\n```\n\n闭包还可以允许多个函数共享同一个环境。\n\n```javascript\n1 | \"use strict\";\n2 | function\
    \ createPerson(firstName, lastName) {\n3 |     let age = 0;\n4 |     return {\n\
    5 |         firstName: firstName,\n6 |         lastName: lastName,\n7 |      \
    \   greet: function() {\n8 |             // ...省略 ...\n8 |         },\n9 |   \
    \      incrementAge: function() {\n10 |             age++;\n11 |         },\n\
    12 |         getAge: function() {\n13 |             return age;\n14 |        \
    \ }\n15 |     };\n16 | }\n17 | \n18 | let person = createPerson(\"Neo\", \"Truman\"\
    );\n19 | person.incrementAge();\n20 | console.log(person.getAge()); // 1\n21 |\
    \ person.incrementAge();\n22 | console.log(person.getAge()); // 2\n```\n\n闭包还用于模拟私有变量，因为\
    \ JavaScript 以前没有真正的私有属性支持。\n\n```javascript\n1 | \"use strict\";\n2 | function\
    \ createPerson(firstName, lastName) {\n3 |     let age = 0;\n4 |     return {\n\
    5 |         firstName: firstName,\n6 |         lastName: lastName,\n7 |      \
    \   // ... \n8 |         getAge: function() {\n9 |             return age;\n10\
    \ |         },\n11 |         setAge: function(newAge) {\n12 |             age\
    \ = newAge;\n13 |         }\n14 |     };\n15 | }\n16 | \n17 | let person = createPerson(\"\
    Neo\", \"Truman\");\n18 | console.log(person.getAge()); // 0\n19 | person.setAge(25);\n\
    20 | console.log(person.getAge()); // 25\n21 | console.log(person.age); // undefined\n\
    ```\n\n### 3.14.2 使用闭包实现私有属性和方法\n\n我们可以使用闭包模拟对象的私有属性和方法，因为对象可以访问闭包中的变量，但不拥有它们。\n\
    \n```javascript\n1 | \"use strict\";\n2 | function createPerson(firstName, lastName)\
    \ {\n3 |     let age = 0;\n4 |     return {\n5 |         firstName: firstName,\n\
    6 |         lastName: lastName,\n7 |         // ... \n8 |         getAge: function()\
    \ {\n9 |             return age;\n10 |         },\n11 |         setAge: function(newAge)\
    \ {\n12 |             age = newAge;\n13 |         }\n14 |     };\n15 | }\n16 |\
    \ \n17 | let person = createPerson(\"Neo\", \"Truman\");\n18 | console.log(person.getAge());\
    \ // 0\n19 | person.setAge(25);\n20 | console.log(person.getAge()); // 25\n21\
    \ | console.log(person.age); // undefined\n```\n\n"
