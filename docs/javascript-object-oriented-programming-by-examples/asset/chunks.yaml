    ```\n\nWe can open the Console panel to see the result and check the values of\
    \ the `student1`, `teacher1`, and `guard1` variables. Try to expand the objects\
    \ and their prototypes (`[[Prototype]]`) to see more information as the below\
    \ pictures.\n\n![](Images/image00526.jpeg)\n\nThe `student1` object has its prototype\
    \ object having a method named “logInfo”. This `logInfo()` method is different\
    \ from the `logInfo()` method in the `User` class.\n\n`student1`’s prototype object\
    \ also has its prototype which is a `User` object.\n\nWhen executed `student1.logInfo()`,\
    \ JS engine searched the method in the `student1` object first but was not found.\
    \ Therefore, it continued to search for it in `student1`’s prototype. It found\
    \ the method there and invoked it.\n\n![](Images/image00527.jpeg)\n\n`teacher1.logInfo()`\
    \ proceeded in the same way as `student1.logInfo()` since `teacher1`’s structure\
    \ is almost the same as `student1`’s structure.\n\n![](Images/image00528.jpeg)\n\
    \nThe `guard1` object has its prototype object (called Object I). And `guard1`’s\
    \ prototype object also has its prototype which is a `User` object (called Object\
    \ II).\n\nWhen executed `guard1.logInfo()`, JS engine searched the method in the\
    \ `guard1` object first but was not found. Therefore, it continued to search in\
    \ `guard1`’s prototype (Object I) but was not found again. Followed the prototype\
    \ chain, it continued to search in Object II and found the method there and invoked\
    \ it.\n\nIn conclusion, subclassing in JavaScript is built on the prototype chain.\n\
    \n### 5.6.7 ES5 JavaScript OOP for Old Browsers\n\nThe `class` keyword is not\
    \ supported by old browsers such as Internet Explorer. Therefore, we have another\
    \ solution in this section that implement JavaScript OOP in ES5 code.\n\nWe will\
    \ implement the `__extendsClass` function to create a derived class from the base\
    \ class. This function will:\n\n- set up the prototype chain so that derived class\
    \ can use public methods of the base class\n- initialize all properties of the\
    \ derived class based on the base class\n- create the constructor of the derived\
    \ class\n\nThe `__extendsClass` function is as below.\n\n```javascript\nvar __extendsClass\
    \ = (this && this.__extendsClass) || (function () {\n  // d: derived; b: base;\
    \ p: property |\n  var extendStatics = function (d, b) {\n    extendStatics =\
    \ Object.setPrototypeOf ||\n    ({ __proto__: [] } instanceof Array && function\
    \ (d, b) {\n          d.__proto__ = b;\n      }) ||\n    function (d, b) {\n \
    \     for (var p in b)\n      if (Object.prototype.hasOwnProperty.call(b, p))\n\
    \            d[p] = b[p];\n      };\n    return extendStatics(d, b);\n  };\n \
    \ return function (d, b) {\n  if (typeof b !== \"function\" && b !== null)\n \
    \ throw new TypeError(String(b) + \" is not a constructor or null\");\n    extendStatics(d,\
    \ b);\n    function __() {\n      this.constructor = d;\n    }\n    d.prototype\
    \ = b === null ? Object.create(b) : ((.prototype = b.prototype, new __());\n \
    \ };\n})();\n```\n\nSource code of the `User` class:\n\n```javascript\nvar User\
    \ = (function () {\n  // Private properties here\n  var _age;\n\n  // Private\
    \ methods here\n  function _logAge() {\n    console.log(\"Age: \" + _age);\n \
    \ }\n\n  // Constructor\n  function User(firstName, lastName, age) {\n    this.firstName\
    \ = firstName;\n    this.lastName = lastName;\n    _age = age;\n  }\n\n  // Public\
    \ methods here\n  User.prototype.getAge = function () {\n    // Access private\
    \ property (_age) via Closure\n    return _age;\n  };\n  User.prototype.setAge\
    \ = function (newAge) {\n    _age = newAge;\n  };\n  User.prototype.logInfo =\
    \ function () {\n    console.log(\"Name: \" + this.firstName + \" \" + this.lastName);\n\
    \    // Access private property (_age) via Closure\n    _logAge();\n  };\n\n \
    \ // Static methods supported by Prototype Chain\n  User.staticProp = 0;\n  User.staticMethod\
    \ = function () {\n    console.log('Message from static method');\n  };\n  //\
    \ Static properties and methods implemented by Function\n  return User;\n})();\n\
    ```\n\nSource code of the `Student` class:\n\n```javascript\nvar Student = (function\
    \ (_super) {\n  // Call the __extendsClass function at the beginning\n  __extendsClass(Student,\
    \ _super);\n\n  // Private properties\n  var _Prop = 'Student';\n\n  // Constructor\n\
    \  function Student(firstName, lastName, age, id) {\n    _super.call(this, firstName,\
    \ lastName, age);\n    this.id = id;\n  }\n\n  // Public methods\n  Student.prototype.logInfo\
    \ = function (times) {\n    console.log('Information of student:');\n    console.log(\"\
    Name: \" + this.firstName + \" \" + this.lastName);\n    // call super method\
    \ from class\n    console.log(\"Age: \" + this.getAge());\n    console.log(\"\
    Id: \" + this.id);\n    // Access _privateProp from instance:\n    //;\n  };\n\
    \n  return Student;\n})(User);\n```\n\nSource code of the `Teacher` class:\n\n\
    ```javascript\nvar Teacher = (function (_super) {\n  // Call the __extendsClass\
    \ function at the beginning\n  __extendsClass(Teacher, _super);\n\n  // Constructor\n\
    \  function Teacher(firstName, lastName, age) {\n    _super.call(this, firstName,\
