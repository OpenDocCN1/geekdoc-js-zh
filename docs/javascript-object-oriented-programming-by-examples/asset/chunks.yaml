    \ = obj1.getFullname.call(obj2);\n14 | console.log(fullname); // John Conner\n\
    ```\n\n我们也可以使用 `call()` 为对象链式调用构造函数，如下示例所示。\n\n```javascript\n1 | \"use strict\"\
    ;\n2 | function Thing(name, price) {\n3 |     this.name = name;\n4 |     this.price\
