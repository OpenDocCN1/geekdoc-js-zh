    - Global scope: variables declared with `var` and function declarations.


    Objects in different environments are different. For example, the Global Object
    in `NodeJS` is different from the Global Object in browsers.


    ## Object Literal


    ### Shorthand Properties


    We can use variables to define an object’s properties. In case the property name
    is the same as the name of the variable, we can use the shorthand form below.


    Example:


    ```javascript

    1 | "use strict"; |

    2 | let firstName = ''Neo''; |

    3 | let lastName = ''D. Truman''; |

    4 | |

    5 | let user = { |

    6 |     firstName, |

    7 |     lastName, |

    8 |     email: "neodtruman@gmail.com" |

    9 | } |

    10| console.log(user); |

    // { firstName: ''Neo'', lastName: ''D. Truman'', email: ''neodtruman@gmail.com''
    }

    ```


    ### Shorthand Methods


    To define the methods of an object quickly, we can use the shorthand methods by
    omitting `: function`.


    Example:


    ```javascript

    1 | "use strict"; |

    2 | let user = { |

    3 |     name: ''Neo D. Truman'', |

    4 |     logInfo() { |

    5 |         console.log(this.name); |

    6 |     } |

    7 | } |

    8 | user.logInfo(); // Neo D. Truman |

    9 | console.log(user); |

    // { name: ''Neo D. Truman'', logInfo: [Function: logInfo] }

    ```


    ### Computing Property Keys


    We can compute the property keys like example.


    ```javascript

    1 | "use strict"; |

    2 | let objKey = ''name''; |

    3 | let country = { |

    4 |     [objKey]: ''Canada'', |

    5 |     [objKey + ''Abb'']: ''ca'' |

    6 | } |

    7 | console.log(country); // {name: ''Canada'', nameAbb: ''ca'' }

    ```


    ## Prototype of Objects


    In JavaScript, every object has a private prototype (`__proto__`) which is also
    an object. We use `Object.create()` to assign an object to the prototype of another
    object to inherit the properties and methods of the base object.


    Example:


    ```javascript

    1 | "use strict"; |

    2 | let obj1 = { |

    3 |     firstName: ''Neo'', |

    4 |     lastName: ''D. Truman'', |

    5 |     logFullname: function() { |

    6 |         console.log(this.firstName + '' '' + this.lastName); |

    7 |     } |

    8 | }; |

    9 | |

    10| let obj2 = Object.create(obj1); |

    11| obj2.firstName = ''John''; |

    12| obj2.logFullname(); // John D. Truman

    ```


    We can open the Console panel to see the result and check the value of the `obj2`
    variable by typing `obj2` at the cursor (`>`), then pressing Enter. Try to expand
    the object and its prototype (`[[Prototype]]`) to see more information in this
    picture.


    (Images/image0508.jpeg)


    In the above picture, we can see Prototype of `obj2` is the `obj1` object.


    The following describes how `obj2.logFullname()` can print "John D. Truman" to
    the console panel.

    - Since `obj2` doesn’t have the `logFullname()` method, the JavaScript engine
    did search the method in `obj2`’s prototype.

    - Because the prototype of `obj2` is the `obj1` object, the `logFullname()` method
    was found and invoked.

    - In the method, `this` was `obj2` so that `this.firstName` is "John".

    - As `obj2` doesn’t have the property `lastName`, the JavaScript engine again
    searched the `lastName` property in `obj2`’s prototype.

    - Because the prototype of `obj2` is the `obj1` object, the `lastName` property
    was found ("D. Truman") and used. As a result, "John D. Truman" was printed on
    the Console panel.


    (Images/image0509.jpeg) We could access the prototype of `obj2` using `obj2.__proto__`
    but this way of coding is not recommended since `Object.__proto__` is deprecated.


    ## Prototype Chain


    Since the prototype of an object is another object, the prototype could have its
    own.. We call that a prototype chain. At the end of the prototype chain, we will
    see a `null` object. The below example demonstrates a prototype chain.


    ```javascript

    1 | "use strict"; |

    2 | let obj1 = { |

    3 |     firstName: ''Neo'', |

    4 |     lastName: ''D. Truman'', |

    5 |     logFullname: function() { |

    6 |         console.log(this.firstName + '' '' + this.lastName); |

    7 |     } |

    8 | }; |

    9 | |

    10| let obj2 = Object.create(obj1); |

    11| obj2.firstName = ''John''; |

    12| |

    13| let obj3 = Object.create(obj2); |

    14| obj3.age = 39; |

    15| obj3.logFullname(); // John D. Truman

    ```


    (Images/image0510.jpeg)


    In the above picture, we can see the prototype of `obj3` is the `obj2` object,
    and the prototype of `obj2` is the `obj1` object.


    The following describes how `obj3.logFullname()` can print "John D. Truman" to
    the console panel.

    - Since `obj3` doesn’t have the `logFullname()` method, the JavaScript engine
    did search the method in `obj3`’s prototype which is `obj2`.

    - Since `obj2` doesn’t have the `logFullname()` method, the JavaScript engine
    searched the method in `obj2`’s prototype.

