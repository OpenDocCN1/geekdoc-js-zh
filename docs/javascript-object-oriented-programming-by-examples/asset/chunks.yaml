    \   console.log(this); // undefined\n    console.log(globalThis); // Window object\n\
    }\ntest();\n```\n\n# Chapter 5 Object-Oriented Programming\n\nObject-Oriented\
    \ Programming (OOP) is a programming method that takes objects as the foundation\
    \ for building algorithms and building programs.\n\nIn OOP, an object is understood\
    \ as an instance in which the data and the procedures that act on the data are\
    \ encapsulated together. The object is characterized by several operations and\
    \ the information remembers the impact of these operations. Operations on an object\
    \ are called methods or behaviors of that object.\n\n## 5.1 Basic Concepts in\
    \ OOP\n\nIn this section, we will learn concepts like encapsulation, classes,\
    \ and instance, object inheritance, polymorphism, and virtual methods where the\
    \ concept of data hiding through encapsulation is the key matter.\n\n### 5.1.1\
    \ Encapsulation\n\nEncapsulation is the ability to store data and the methods\
    \ that act on an object separately from the others. All information in an object-oriented\
