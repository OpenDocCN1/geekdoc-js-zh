    \n# Preface\n\nObject-Oriented Programming (OOP) is a programming method that\
    \ takes objects as the foundation. This book introduces OOP concepts like encapsulation,\
    \ classes, and instances, etc., and guides you on how to do JavaScript.\n\nJavaScript\
    \ is the world's most used language, which is one of the core technologies of\
    \ the World Wide, alongside HTML and CSS. Websites use JavaScript on the client-side.\
    \ All major web browsers have their engine to execute the JavaScript code.\n\n\
    # Book Audience\n\nThe book targets intermediate developers who already know basic\
    \ JavaScript programming. It starts by introducing all concepts related to OOP.\
    \ Then, Object-Oriented Programming in JavaScript will be introduced in the last\
    \ chapter.\n\n# How to Contact Us\n\nMy email is `odtruman@gmail.com`. If you\
    \ have any questions, please send me an email. I am always happy to hear from\
    \ people who’ve read my books. I’ll try my best to answer every email I receive.\
    \ The subject should be `[JavaScript Object-Oriented Programming By Examples]\
    \ <Your subject here>` so that I could filter and answer your questions quickly.\n\
    \n# Conventions Used in This Book\n\nThe following typographical conventions are\
    \ used in this book:\n\nItalic indicates new terms, URLs, email addresses, filenames,\
    \ and file extensions.\n\nBold indicates important concepts or UI items such as\
    \ menu items and buttons to be selected or clicked.\n\nConstant width indicates\
    \ computer code including statements, functions, classes, objects, methods, properties,\
