    \ = 'Hi'; // TypeError` |\n\nSetters use the `set` keyword as a modifier of its\
    \ function.\n\nExample 2:\n\n| 1 | `\"use strict\";` |\n| 2 | `const obj = {`\
    \ |\n| 3 | `_message: 'Initial message',` |\n| 4 | ` set message(newMessage) {`\
