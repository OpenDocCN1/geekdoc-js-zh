    \ are ordered to perform operations.\n\nEncapsulation is not just the collection\
    \ of data and programs into a block, they are also understood in the sense that\
    \ it is the identity of the data and the operations that act on that data. All\
    \ that is visible of the encapsulated object is the object's communication methods.\n\
    \n### 5.1.2 Class and Instance\n\nClass is a data type defined in the program.\
    \ However, the concept of a class goes even further, it contains the implementation\
    \ of the properties as well as possible operations on the data. In general, the\
    \ class characterizes a sample of several objects and describes the internal structure\
    \ of these objects. Objects of the same class have the same definition of their\
    \ operations and the same data structure.\n\nAn instance is a real object in memory.\
    \ In other words, the instance is a variable declared of type class. An instance\
    \ is an object created from a class.\n\n### 5.1.3 Inheritance\n\nClassification\
    \ of objects is the arrangement of objects with the same communication behavior\
    \ into the same group. After subclassing, the next job is to build classes that\
    \ are derived from existing classes called base classes. These classes, in addition\
    \ to their properties, retain the characteristics of the base classes. In other\
    \ words, they inherit the behavior and data of the base class. The class that\
    \ inherits from the base class is called a derived class. These derived classes\
    \ in turn act as the base classes of other derived classes.\n\n### 5.1.4 Polymorphism\n\
    \nPolymorphism is the ability to send the same message to different objects that\
