  trans: "\n\n```javascript\nlet student1 = new Student('John', 'Conner', 20, '123456');\n\
    console.log(student1);\nstudent1.logInfo();\n\nlet teacher1 = new Teacher('Neo',\
    \ 'D. Truman', 39);\nconsole.log(teacher1);\nteacher1.logInfo();\n\nlet guard1\
    \ = new SecurityGuard('William', 'Smith', 30);\nconsole.log(guard1);\nguard1.logInfo();\n\
    ```\n\n我们可以打开控制台（Console）面板查看结果，并检查 `student1`、`teacher1` 和 `guard1` 变量的值。尝试展开对象及其原型（`[[Prototype]]`），如如下所示所示查看更多信息。\n\
    \n![](img/image00526.jpeg)\n\n`student1` 对象的原型对象有一个名为“logInfo”的方法。此处的 `logInfo()`\
    \ 方法与 `User` 类中的 `logInfo()` 方法不同。\n\n`student1` 的原型对象也有它的原型，是一个 `User` 对象。\n\n\
    当执行 `student1.logInfo()` 时，JS 引擎首先在 `student1` 对象中搜索该方法，但未找到。因此，它继续在 `student1`\
    \ 的原型中搜索。它在那里找到了该方法并调用了它。\n\n![](img/image00527.jpeg)\n\n`teacher1.logInfo()`\
    \ 的执行过程与 `student1.logInfo()` 相同，因为 `teacher1` 的结构与 `student1` 的结构几乎相同。\n\n![](img/image00528.jpeg)\n\
    \n`guard1` 对象有一个原型对象（称为 Object I）。而 `guard1` 的原型对象也有它的原型，是一个 `User` 对象（称为 Object\
    \ II）。\n\n当执行 `guard1.logInfo()` 时，JS 引擎首先在 `guard1` 对象中搜索该方法，但未找到。因此，它继续在 `guard1`\
    \ 的原型（Object I）中搜索，但再次未找到。遵循原型链，它继续在 Object II 中搜索，找到了方法并调用。\n\n结论：JavaScript\
    \ 中的子类化是构建在原型链之上的。\n\n### 5.6.7 针对旧浏览器的 ES5 JavaScript OOP\n\n旧浏览器（如 Internet\
    \ Explorer）不支持 `class` 关键字。因此，我们在本节中提供了另一种解决方案，在 ES5 代码中实现 JavaScript OOP。\n\n\
    我们将实现 `__extendsClass` 函数来从基类创建派生类。该函数将：\n\n- 设置原型链，使派生类可以使用基类的公共方法\n- 根据基类初始化派生类的所有属性\n\
    - 创建派生类的构造函数\n\n`__extendsClass` 函数如下：\n\n```javascript\nvar __extendsClass =\
    \ (this && this.__extendsClass) || (function () {\n  // d: derived; b: base; p:\
    \ property |\n  var extendStatics = function (d, b) {\n    extendStatics = Object.setPrototypeOf\
    \ ||\n    ({ __proto__: [] } instanceof Array && function (d, b) {\n         \
    \ d.__proto__ = b;\n      }) ||\n    function (d, b) {\n      for (var p in b)\n\
    \      if(Object.prototype.hasOwnProperty.call(b, p))\n            d[p] = b[p];\n\
    \      };\n    return extendStatics(d, b);\n  };\n  return function (d, b) {\n\
    \  if (typeof b !== \"function\" && b !== null)\n  throw new TypeError(String(b)\
    \ + \" is not a constructor or null\");\n    extendStatics(d, b);\n    function\
    \ __() {\n      this.constructor = d;\n    }\n    d.prototype = b === null ? Object.create(b)\
    \ : ((.prototype = b.prototype, new __()));\n  };\n})();\n```\n\n`User` 类的源代码：\n\
    \n```javascript\nvar User = (function () {\n  // 此处为私有属性\n  var _age;\n\n  //\
    \ 此处为私有方法\n  function _logAge() {\n    console.log(\"Age: \" + _age);\n  }\n\n\
    \  // 构造函数\n  function User(firstName, lastName, age) {\n    this.firstName =\
    \ firstName;\n    this.lastName = lastName;\n    _age = age;\n  }\n\n  // 此处为公共方法\n\
    \  User.prototype.getAge = function () {\n    // 通过闭包访问私有属性 (_age)\n    return\
    \ _age;\n  };\n  User.prototype.setAge = function (newAge) {\n    _age = newAge;\n\
    \  };\n  User.prototype.logInfo = function () {\n    console.log(\"Name: \" +\
    \ this.firstName + \" \" + this.lastName);\n    // 通过闭包访问私有属性 (_age)\n    _logAge();\n\
    \  };\n\n  // 原型链支持的静态方法\n  User.staticProp = 0;\n  User.staticMethod = function\
    \ () {\n    console.log('Message from static method');\n  };\n  // 通过 Function\
    \ 实现的静态属性方法\n  return User;\n})();\n```\n\n`Student` 类的源代码：\n\n```javascript\n\
    var Student = (function (_super) {\n  // 在开头调用 __extendsClass 函数\n  __extendsClass(Student,\
    \ _super);\n\n  // 私有属性\n  var _Prop = 'Student';\n\n  // 构造函数\n  function Student(firstName,\
    \ lastName, age, id) {\n    _super.call(this, firstName, lastName, age);\n   \
    \ this.id = id;\n  }\n\n  // 公共方法\n  Student.prototype.logInfo = function (times)\
    \ {\n    console.log('Information of student:');\n    console.log(\"Name: \" +\
    \ this.firstName + \" \" + this.lastName);\n    // 调用类中的 super 方法\n    console.log(\"\
    Age: \" + this.getAge());\n    console.log(\"Id: \" + this.id);\n    // 从实例访问\
    \ _privateProp: \n    //;\n  };\n\n  return Student;\n})(User);\n```\n\n`Teacher`\
    \ 类的源代码：\n\n```javascript\nvar Teacher = (function (_super) {\n  // 在开头调用 __extendsClass\
    \ 函数\n  __extendsClass(Teacher, _super);\n\n  // 构造函数\n  function Teacher(firstName,\
    \ lastName, age) {\n    _super.call(this, firstName, lastName, age);\n  }\n\n\
    \  // 公共方法\n  Teacher.prototype.logInfo = function (times) {\n    console.log('Information\
    \ of teacher:');\n    console.log('...');\n  };\n\n  return Teacher;\n})(User);\n\
    ```\n\n`SecurityGuard` 类的源代码：\n\n```javascript\nvar SecurityGuard = (function\
    \ (_super) {\n  // 在开头调用 __extendsClass 函数\n  __extendsClass(SecurityGuard, _super);\n\
    \n  // 构造函数\n  function SecurityGuard(firstName, lastName, age) {\n    _super.call(this,\
    \ firstName, lastName, age);\n  }\n\n  return SecurityGuard;\n})(User);\n```\n\
    \n让我们尝试上面的代码！\n\n```javascript\nconsole.log('Access static property and method:');\n\
    console.log(User.staticProp);\nUser.staticMethod();\nconsole.log('-------------');\n\
    /* 在控制台面板，我们将看到：Access static property and method:0Message from static method-------------*/\n\
    ```\n\n"
