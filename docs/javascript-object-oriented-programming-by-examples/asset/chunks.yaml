    # Chapter 3


    ## Function


    A function is a set of statements that come together to complete a task. These
    statements are enclosed in curly braces `{}` and executed when the function is
    invoked.


    A function is also an object so that we can add properties to it.


    ```javascript

    1 "use strict";

    2 function myFunc() {

    3 }

    4 console.log(Function instanceof Object); // true

    5 myFunc.version = 1.2;

    6 console.log(myFunc.version); // 1.2

    ```


    ## 3.1 Creating a Function


    ### 3.1.1 Function Declaration


    A function declaration or function statement is defined using the `function` keyword,
    followed by a function name.


    For example, the following code defines a simple function named `sum`:


    ```javascript

    1 "use strict";

    2 function sum(x, y) {

    3  return x + y;

    4 }

    5 console.log(typeof sum); // "function"

    6 console.log(sum(10, 20)); // 30

    ```


    The function `sum` takes two parameters, called `x` and `y`. The function consists
    of one statement that says to return the summary of the two parameters. The statement
    `return` specifies the value returned by the function.


    ### 3.1.2 Function Expression


    A function expression is an anonymous function that does not have a name. Therefore,
    it is often assigned to a variable so that we can call the function using the
    variable. For example, the function `sum` could have been defined as:


    ```javascript

    1 "use strict";

    2 let sum = function (x, y) {

    3  return x + y;

    4 }

    5 console.log(typeof sum); // "function"

    6 console.log(sum(10, 20)); // 30

    ```


    ![Crocodile with solid fill](Images/image00512.jpeg) Function expression can have
    an issue with hoisting as in the below example.


    ```javascript

    1 "use strict";

    2 console.log(typeof sum); // ReferenceError: Cannot access ''sum'' before initialization

    3 let sum = function (x, y) {

    4  return x + y;

    5 }

    ```


    ### 3.1.3 Using Function Constructor


    Function constructor can be used to create a function programmatically. It means
    that parameters and bodies could be defined at runtime.


    The syntax is `new Function(param1, ..., paramN, functionBody)` when:

    - `param1, ..., paramN`: Names to be used by the function as formal parameters.

    - `functionBody`: A string containing the function definition.


    The following code creates a function that takes two parameters and return summary
    of them.


    ```javascript

    1 "use strict";

    2 const sum = new Function(''x'', ''y'', ''return x + y'');

    3 console.log(sum(10, 20)); // 30

    ```


    ## 3.2 Calling Functions


    A function is invoked by using brackets `()` with the arguments. A function declaration
    (not function expression) can be hoisted (appear below the call in the code),
    as in this example:


    ```javascript

    1 "use strict";

    2 console.log(sum(10, 20)); // 30

    3 function sum(x, y) {

    4  return x + y;

    5 }

    ```


    In the above example,

    - `x` and `y` are parameters of the function;

    - `10` and `20` are arguments used when we call the function.


    ## 3.3 The return Statement


    The `return` keyword is used to finish the processing of functions and return
    something to the caller.


    The syntax is `return [expression]`; where the `expression` whose value is to
    be returned. If omitted, `undefined` is returned.


    Example 1:

    ```javascript

    1 "use strict";

    2 function test() {

    3  return 100;

    4 }

    5 let x = test();

    6 console.log(x); // 100

    ```


    Example 2:

    ```javascript

    1 "use strict";

    2 function test() {

    3  return;

    4 }

    5 let x = test();

    6 console.log(x); // undefined

    ```


    Example 3:

    ```javascript

    1 "use strict";

    2 function test() {

    }

    3 let x = test();

    4 console.log(x); // undefined

    ```


    ## 3.4 Function Parameters


    JavaScript doesn’t require the number of arguments must be equal to the number
    of function parameters. For example, we have a function having two parameters
    like this example:


    ```javascript

    1 "use strict";

    2 function sum(x, y) {

    3  return x + y;

    }

    ```


    And we can invoke the above function with different number of arguments without
    any errors.

    - One argument: lacking input will be `undefined`. `console.log(sum(10)); // NaN
    (since y is undefined)`

    - Two arguments: `console.log(sum(10, 20)); // 30`

    - Three arguments: redundant input will be ignored. `console.log(sum(10, 20, 30));
    // 30`


    ### 3.4.1 Default Parameters


    Default function parameters are values used when the number of arguments is less
    than the number of parameters. For example, the `sum` function has two parameters
    but when invoking it, we input only one argument. In that case, the default parameter
    will be used.


    ```javascript

    1 "use strict";

    2 function sum(x, y = 0) {

    3  return x + y;

    }

    4 console.log(sum(10)); // 10 (since y = 0)

    ```


    ### 3.4.2 Rest Parameters


    The rest parameter syntax helps us collect inputs into an array.


    ```javascript

    1 "use strict";

    2 function sum(...numbers) {

    3  console.log(numbers instanceof Array); // true

    4

    5  let result = 0;

    6  for (let i = 0; i < numbers.length; i++) {

    7    result += numbers[i];

    8  }

    9  return result;

    10 }

    11 console.log(sum(10, 20, 30)); // 60

    12 console.log(sum(10, 20, 30, 40)); // 100

    ```


    And this is an example of using rest parameters in combination with ordinary parameters.


    ```javascript

    1 "use strict";

    2 function multiply(multiplier, ...numbers) {

    3  let result = [];

    4  for (let i = 0; i < numbers.length; i++) {

    5    result.push(numbers[i] * multiplier);

    6  }

    7  return result;

    8 }

    9 let arr = multiply(2, 10, 20, 30);

    10 console.log(arr); // [20, 40, 60]

    ```


    ## 3.5 The arguments Object


    The `arguments` object of a function is a special object that contains all arguments
    which were inputted by users.


    Example:

    ```javascript

    1 "use strict";

    2 function sum() {

    3  let total = 0;

    4  for (let n of arguments) {

    5    total += n;

    6  }

    7  return total;

    }

    8 console.log(sum(1, 2, 3, 4, 5)); // 15

    ```


    ## 3.6 Recursive Function


    A recursive function calls itself in its function body.


    For example, consider the following function which will calculate a summary of
    integers from `start` number to `end` number. To focus on the concept, we don’t
    put the validation code of the parameters.


    ```javascript

    1 "use strict";

    2 function sum(start, end) {

    3  let result = 0;

    4  for (let i = start; i <= end; i++) {

    5    result += i;

    6  }

    7  return result;

    }

    8 console.log(sum(2, 6)); // 2 + 3 + 4 + 5 + 6 = 20

    ```


    We can write the above example in another way as a recursive function.


    ```javascript

    1 "use strict";

    2 function sum(start, end) {

    3  return start === end ? end : start + sum(start + 1, end);

    }

    4 console.log(sum(2, 6));

    5 // = 2 + sum(3, 6)// = 2 + 3 + sum(4, 6)// = 2 + 3 + 4 + sum(5, 6)// = 2 + 3
    + 4 + 5 + sum(6, 6)// = 2 + 3 + 4 + 5 + 6

    ```

