    ### 3.13.2 call


    The  Function.prototype.call() method works in the same way as  bind() however  call()
    will invoke the function (as its name, “call”) but  bind() does not.


    The syntax is:


    call(thisArg, arg1, ... , argN)


    where


    ●     thisArg is the object that the  this keyword will point to


    ●     arg1, arg2, ...argN (optional) are arguments of the function.


    Example 1:


    | 1 | "use strict"; |


    | 2 | let obj = { |


    | 3 | firstName: "Neo", |


    | 4 | lastName: "D. Truman" |


    | 5 | }; |


    | 6 |  |


    | 7 | function logInfo() { |


    | 8 |     console.log(this.firstName + " " + this.lastName); |


    | 9 | } |


    | 10 | logInfo.call(obj); // Neo D. Truman |


    Example 2:


    | 1 | "use strict"; |


    | 2 | let obj = { |


    | 3 | firstName: "Neo", |


    | 4 | lastName: "D. Truman" |


    | 5 | }; |


    | 6 |  |


    | 7 | function logInfo(email) { |


    | 8 |     console.log(this.firstName + " " + this.lastName); |


    | 9 |     console.log(email); |


    | 10 | } |


    | 11 | logInfo.call(obj, "neodtruman@gmail.com"); |


    | 12 | // Neo D. Truman |


    | 13 | // neodtruman@gmail.com |


    call() provides a new value of  this to the function/method. With  call(), you
    can write a method once and then inherit it in another object without rewriting
    the method for the new object.


    | 1 | "use strict"; |


    | 2 | let obj1 = { |


    | 3 | firstName: "Neo", |


    | 4 | lastName: "D. Truman", |


    | 5 | getFullname: function () { |


    | 6 |  return  this.firstName + " " + this.lastName; |


    | 7 |     } |


    | 8 | }; |


    | 9 | let obj2 = { |


    | 10 | firstName: "John", |


    | 11 | lastName: "Conner", |


    | 12 | } |


    | 13 | let fullname = obj1.getFullname.call(obj2); |


    | 14 | console.log(fullname); // John Conner |


    We can also use  call() to chain constructors for an object like the below example.


    | 1 | "use strict"; |


    | 2 | function Thing(name, price) { |


    | 3 |  this.name = name; |


    | 4 |  this.price = price; |


    | 5 | } |


    | 6 |  |


    | 7 | function SchoolThing(name, price) { |


    | 8 |     Thing.call(this, name, price); |


    | 9 |  this.category = ''School Thing''; |


    | 10 | } |


    | 11 |  |


    | 12 | const book = new SchoolThing(''Student Book'', 6); |


    | 13 | console.log(book); |


    | 14 | // SchoolThing {name: ''Student Book'', price: 6, category: ''School Thing''}
    |


    ### 3.13.3 apply


    The  Function.prototype.apply() method works in the same way as  call() however  apply()
    will receive an array of arguments of the function. Accepting an array of arguments
    helps us generate the arguments at runtime and “send” to the function.


    The syntax is:


    apply(thisArg, argsArray)


    where


    ●     thisArg is the object that the  this keyword will point to


    ●     argsArray (optional) is the array of arguments of the function.


    Example:


    | 1 | "use strict"; |


    | 2 | let obj = { |


    | 3 | firstName: "Neo", |


    | 4 | lastName: "D. Truman" |


    | 5 | }; |


    | 6 |  |


    | 7 | function logInfo(email) { |


    | 8 |     console.log(this.firstName + " " + this.lastName); |


    | 9 |     console.log(email); |


    | 10 | } |


    | 11 | // We can get email from user and push it into the array of arguments |


    | 12 | let args = ["neodtruman@gmail.com"]; |


    | 13 | logInfo.apply(obj, args); |


    | 14 | // Neo D. Truman |


    | 15 | // neodtruman@gmail.com |


    ## 3.14 Closure


    ### 3.14.1 Closure Introduction


    A closure gives you access to an outer function''s scope from an inner function.
    In JavaScript, closure is created every time a function is created inside another
    function and the function does use its parent’s variables.


    | 1 | "use strict"; |


    | 2 |  |


    | 3 | function sayHi(firstName) { |


    | 4 |  let lastName = ''D. Truman''; |


    | 5 |  return  function doLog(message) { |


    | 6 |  debugger; |


    | 7 |         console.log( |


    | 8 |  `Hello ${firstName}  ${lastName}. ${message}` |


    | 9 |         ); |


    | 10 |     } |


    | 11 | } |


    | 12 |  |


    | 13 | let greetingFunc = sayHi(''Neo''); |


    | 14 | greetingFunc(''How are you?''); |


    | 15 | // Hello Neo D. Truman. How are you? |


    When we run the above code, the debugger of the browser will stop at the  debugger
    breakpoint (line 6) as in the below picture.


    ![](Images/image00515.jpeg)


    We can see in the above picture, the  doLog() function can access to these variables:


    ● Local variables


    message: parameter of the  doLog() function


    ● Closure variables from the  sayHi() function


    firstName: parameter of the  sayHi() function


    lastName: local variable of the  sayHi() function


    The reason is that nested functions in JavaScript could form closures. A closure
    is actually a function scope that consists of all local variables of the function
    so that the inner function could refer to them. In this case,  greetingFunc is
    a reference to the instance of the function  doLog() that is created when  sayHi()
    is run. The instance of  doLog() having references (fisrtName and  lastName) to
    its parent function. For this reason, the  fisrtName and  lastName variables are
    available in the  Closure (sayHi). As a result, when  greetingFunc is invoked,  "Hello
    Neo D. Truman. How are you?" is printed to the console panel.


    ![Crocodile with solid fill](Images/image00516.jpeg) The closure will negatively
    affect script performance both in terms of processing speed and memory consumption.
    Therefore, we should avoid creating nested functions if we don’t need them.


    The below example shows that there are nested functions but there is no closure
    since the inner function doesn’t refer to its parent’s variables.


    | 1 | "use strict"; |


    | 2 |  |


    | 3 | function sayHi(firstName) { |


    | 4 |  let lastName = ''D. Truman''; |


    | 5 |  return  function doLog(message) { |


    | 6 |  debugger; |


    | 7 |  console.log(message); |


    | 8 |     } |


    | 9 | } |


    | 10 |  |


    | 11 | let greetingFunc = sayHi(''Neo''); |


    | 12 | greetingFunc(''How are you?''); |


    When we run the above code, the debugger of the browser will stop at the  debugger
    breakpoint (line 6) as below picture.


    ![](Images/image00517.jpeg)


    We can see in the above picture, that the  doLog() function didn’t access any
    variables of the  sayHi() function. Therefore, in the Scope Chain, there is no
    Closure (sayHi) as in the previous example.


    ### 3.14.2 Private Properties and Methods using Closures


    We can emulate private properties and methods of objects using closures since
    the object can access variables and functions in its closure but does not own
    them.


    The following code illustrates how to use closures to define private properties
    and methods of an object.


    | 1 | "use strict"; |


    | 2 | function makeUserObject() { |


    | 3 |  let name = ''Neo''; |


    | 4 |  function allCap(str) { |


    | 5 |  return str.toUpperCase(); |


    | 6 |     } |


    | 7 |  |


    | 8 |  return { |


    | 9 | getUpperCaseName: function () { |


    | 10 |  debugger; |


    | 11 |  return allCap(name); |


    | 12 |         }, |


    | 13 | getName: function () { |


    | 14 |  return name; |


    | 15 |         }, |


    | 16 | setName: function (newName) { |


    | 17 |             name = newName; |


    | 18 |         } |


    | 19 |     } |


    | 20 | } |


    | 21 | let u = makeUserObject(); |


    | 22 | console.log(u); |


    | 23 |  |


    | 24 | console.log(u.name); // undefined |


    | 25 | console.log(u.allCap); // undefined |


    | 26 |  |


    | 27 | console.log(u.getUpperCaseName()); // ''NEO'' |


    | 28 |  |


    | 29 | u.setName(''John''); |


    | 30 | console.log(u.getName()); // ''John'' |


    When we run the above code, the debugger of the browser will stop at the  debugger
    breakpoint (line 10) as in the below picture.


    ![](Images/image00518.jpeg)


    The  getUpperCaseName() function can access variable  name and invoke function  allCap()
    of the Closure. However, the u variable (user instance) cannot access the  name
    variable and the  allCap() function. This behavior emulates the private properties
    and methods of the object.


    ## 3.15 Callback Function


    A callback function is a function treated as a parameter of another function so
    that the parent function will invoke it later.'
