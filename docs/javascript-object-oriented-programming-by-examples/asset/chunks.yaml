    \    console.log(info);\n}\nfunction doAlert(info) {\n    alert(info);\n}\n\n\
    function processName(callback) {\n  let name = 'Neo';\n    callback(name);\n}\n\
    processName(doLog);\nprocessName(doAlert);\n```\n\n## 3.16 Generator Function\n\
    \nThe `function*` is exactly a generator that returns different values based on\
    \ the `yield` expressions inside the function body or the `yield*`, to another\
    \ generator function.\n\nThe `next()` method of generators returns an object with\
    \ `value` and `done` properties.\n\n### Example 1:\n\n```javascript\n\"use strict\"\
    ;\nfunction* generator(x) {\n  yield x;\n  yield x * 2;\n  yield x * 5;\n}\n\n\
    const gen = generator(10);\n\nconsole.log(gen.next()); // {value: 10, done: false}\n\
    console.log(gen.next()); // {value: 20, done: false}\nconsole.log(gen.next());\
    \ // {value: 50, done: false}\nconsole.log(gen.next()); // {value: undefined,\
    \ done: true}\n```\n\n### Example 2:\n\n```javascript\n\"use strict\";\nfunction*\
    \ anotherGenerator(y) {\n  yield y * 3;\n  yield y * 4;\n}\n\nfunction* generator(x)\
    \ {\n  yield x;\n  yield x * 2;\n  yield* anotherGenerator(x);\n  yield x * 5;\n\
    }\n\nconst gen = generator(10);\n\nconsole.log(gen.next()); // {value: 10, done:\
    \ false}\nconsole.log(gen.next()); // {value: 20, done: false}\nconsole.log(gen.next());\
    \ // {value: 30, done: false}\nconsole.log(gen.next()); // {value: 40, done: false}\n\
    console.log(gen.next()); // {value: 50, done: false}\nconsole.log(gen.next());\
    \ // {value: undefined, done: true}\n```\n\nA `return` statement in a generator\
    \ will make the generator done its job (i.e., the `done` property of the object\
    \ returned by it will be set to `true`). The returned value will be set as the\
    \ `value` property of the object returned by the generator.\n\n### Example 3:\n\
    \n```javascript\n\"use strict\";\nfunction* generator(x) {\n  yield x;\n  return\
    \ x * 2;\n  yield x * 5; // unreachable\n}\n\nconst gen = generator(10);\n\nconsole.log(gen.next());\
    \ // {value: 10, done: false}\nconsole.log(gen.next()); // {value: 20, done: true}\n\
    console.log(gen.next()); // {value: undefined, done: true}\n```\n\nMuch like a\
    \ `return` statement, an error thrown inside the generator will make the generator\
    \ finished — unless caught within the generator's body. When a generator is finished,\
    \ subsequent `next()` calls will not execute any of that generator's code, they\
    \ will just return an object of this form: `{value: undefined, done: true}`.\n\
    \n### Example 4:\n\n```javascript\n\"use strict\";\nfunction* generator(x) {\n\
    \  yield x;\n  throw 'Error here';\n  yield x * 5; // unreachable\n}\n\nconst\
    \ gen = generator(10);\n\nconsole.log(gen.next()); // {value: 10, done: false}\n\
    try {\n  console.log(gen.next());\n} catch (error) {\n  console.log(error); //\
    \ Error here\n}\nconsole.log(gen.next());// {value: undefined, done: true}\n```\n\
    \nProvide a parameter to the `next()` method to send a value to the generator.\
    \ The syntax is:\n\n`next(value)`\n\nwhere\n\n* `variable = yield expression`,\
    \ the value passed to the `next()` function will be assigned to `variable`.\n\n\
    ### Example:\n\n```javascript\n\"use strict\";\nfunction* idGenerator() {\n  let\
    \ counter = 0;\n  while (true) {\n    let seeker = yield ++counter;\n    if (seeker)\
    \ {\n      counter += seeker;\n    }\n  }\n}\n\nconst generateId = idGenerator();\n\
    console.log(generateId.next().value); // 1\nconsole.log(generateId.next().value);\
    \ // 2\nconsole.log(generateId.next().value); // 3\nconsole.log(generateId.next(2).value);\
    \ // 6 (skip two ids)\nconsole.log(generateId.next().value); // 7\nconsole.log(generateId.next(-3).value);\
    \ // 5 (rollback three ids)\nconsole.log(generateId.next().value); // 6\n```\n\
    \n# Chapter 4\n\n## this in JavaScript\n\n### 4.1 this in Functions\n\nIn non-strict\
    \ mode, `this` in functions (all kinds of functions) is the `Window` object when\
    \ working on a Web Browser, as the below example.\n\n```javascript\n// function\
    \ declaration\nfunction testFunc1() {\n    console.log(this); // Window object\n\
    }\ntestFunc1();\n\n// function expression\nlet testFunc2 = function () {\n   \
    \ console.log(this); // Window object\n}\ntestFunc2();\n\n// nested functions\n\
    function test3() {\n  // function declaration\n  function testFunc3() {\n    console.log(this);\
    \ // Window object\n  }\n  testFunc3();\n\n  // function expression\n  let testFunc4\
    \ = () => {\n    console.log(this); // undefined\n  }\n  testFunc4();\n}\n```\n\
    \n`this` in functions (all kinds of functions) is the `Window` object when working\
    \ on a Web Browser, as the below example.\n\n```javascript\n// function declaration\n\
    function testFunc1() {\n    console.log(this); // Window object\n}\ntestFunc1();\n\
    \n// function expression\nlet testFunc2 = function () {\n    console.log(this);\
    \ // Window object\n}\ntestFunc2();\n\n// nested functions\nfunction test3() {\n\
    \  // function declaration\n  function testFunc3() {\n    console.log(this); //\
    \ Window object\n  }\n  testFunc3();\n\n  // function expression\n  let testFunc4\
    \ = () => {\n    console.log(this); // undefined\n  }\n  testFunc4();\n}\n```\n\
    \n`this` in functions (all kinds of functions) is the `Window` object when working\
