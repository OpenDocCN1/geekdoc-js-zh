  trans: "\n\n```javascript\nshowFullname: function () {\n    console.log(this.firstName\
    \ + ' ' + this.lastName);\n    function sayHi() {\n        console.log(this);\
    \ // undefined\n        console.log('Hi ' + this.firstName + ' ' + this.lastName);\
    \ // TypeError\n    }\n    sayHi();\n}\nuser.showFullname();\n```\n\n示例 4：示例 3\
    \ 的解决方案是在外部函数中保存对象的指针，并在内部函数（闭包）中使用它。\n\n```javascript\n\"use strict\";\nlet user\
    \ = {\n    firstName: 'Neo',\n    lastName: 'D. Truman',\n    showFullname: function\
    \ () {\n        console.log(this.firstName + ' ' + this.lastName);\n        let\
    \ self = this;\n        function sayHi() {\n            console.log(self);\n \
    \           // self is {firstName: 'Neo', lastName: 'D. Truman', showFullname:\
    \ f}\n            console.log('Hi ' + self.firstName + ' ' + self.lastName);\n\
    \            // Hi Neo D. Truman\n        }\n        sayHi();\n    }\n}\nuser.showFullname();\n\
    ```\n\n在这些情况下我们不应该使用箭头函数：\n\n- 情况 #1：在对象或类中定义方法。如上文示例所示。\n- 情况 #2：定义 DOM 元素的回调事件。\n\
    - 情况 #3：在对象的原型上定义方法。\n\n因为 `this` 可能会指向 `Window` 对象，或者如上面的示例所示可能是 `undefined`。\n\
    \n### 情况 #2 的示例\n\nHTML 代码（添加到 `index.html` 中）：\n```html\n<button id=\"btn-test\"\
    >Test</button>\n```\nJavaScript 代码：\n```javascript\n\"use strict\";\nlet btnTest\
    \ = document.getElementById('btn-test');\n// 当点击时\nbtnTest.addEventListener('click',\
    \ () => {\n    // this 并不是预期的 btnTest 按钮\n    console.log(this); // Window 对象\n\
    });\n// 当双击时\nbtnTest.addEventListener('dblclick', function () {\n    console.log(this);\
    \ // 'btn-test' 按钮\n});\n```\n\n### 情况 #3 的示例：\n\n```javascript\n\"use strict\"\
    ;\nfunction User(name) {\n    this.name = name;\n}\nUser.prototype.logInfo = ()\
    \ => {\n    console.log(this);\n}\nUser.prototype.showInfo = function () {\n \
    \   console.log(this);\n}\nlet user = new User('Neo');\nuser.logInfo(); // Window\
    \ 对象\nuser.showInfo(); // {name: 'Neo'}\n```\n\n### 4.2.1 隐式绑定\n\n下面的示例使用函数表达式定义对象的方法。因此，`this`\
    \ 指向该对象。\n\n示例：\n```javascript\n\"use strict\";\nfunction welcome() {\n    console.log(this);\
    \ // {name: 'Neo', sayHi: f}\n    console.log('Hi ' + this.name); // Hi Neo\n\
    }\nlet user = {\n    name: 'Neo',\n    sayHi: welcome\n}\nuser.sayHi();\n```\n\
    \n### 4.2.2 隐式绑定\n\n继续隐式绑定的示例，我们将对象的方法赋值给变量并作为函数表达式调用它。结果是，函数表达式中的 `this` 将是 `undefined`。\n\
    \n```javascript\n\"use strict\";\nfunction welcome() {\n    console.log(this);\
    \ // undefined\n    console.log('Hi ' + this.name); // TypeError\n}\nlet user\
    \ = {\n    name: 'Neo',\n    sayHi: welcome\n}\nlet greetingFunc = user.sayHi;\n\
    greetingFunc();\n```\n\n### 4.3 globalThis\n\n`globalThis` 属性用于确保在当前环境的全局对象上运行。在\
    \ Web 浏览器中，`globalThis` 始终是 `Window` 对象。\n\n在网页上运行的示例：\n```javascript\n\"use strict\"\
    ;\nfunction test() {\n    console.log(this); // undefined\n    console.log(globalThis);\
    \ // Window 对象\n}\ntest();\n```\n\n# 第 5 章 面向对象\n\n面向对象编程（OOP）是一种以对象为基础构建算法和程序的编程方法。\n\
    \n在 OOP 中，对象被理解为一个实例，其中数据和作用于数据的过程被封装在一起。对象的特征是若干项操作，并且信息记录了这些操作的影响。对对象的操作被称为该对象的方法或行为。\n\
    \n## 5.1 OOP 中的基本概念\n\n在本节中，我们将学习封装、类和实例、对象继承、多态和虚方法等概念，其中通过封装实现数据隐藏的概念是核心问题。\n\
    \n### 5.1.1 封装\n\n封装是将数据和作用于对象的方法与其它部分分开存储的能力。面向对象系统中的所有信息都存储在对象内部，并且只有当对象被有序调用时才能进行操作。\n\
    \n封装不仅是将数据和程序收集在一起，它也被理解为数据的身份标识以及作用于数据的操作。封装对象的可见部分是对象的通信方法。\n\n### 5.1.2 类与实例\n\
    \n类是程序中定义的数据类型。然而，类的概念更进一步，它包含了属性的实现以及可能对数据的操作。通常，类是了对象的样本，并描述了这些对象的内部结构。相同的对象具有相同的操作定义和数据结构。\n\
    \n实例是内存中的真实对象。换句话说，实例是声明为类的变量。实例是从类创建的对象。\n\n### 5.1.3 继承\n\n对象的分类是将具有相同通信行为的对象归类。在子类化之后，下一步工作是构建派自现有类（基类）的类。这些类在拥有自身属性的同时，保留了基类的特征。换句话说，它们继承了基类的行为和数据。派自基类的类被称为派生类。这些派生类反过来又是其他派生类的基类。\n\
    \n### 5.1.4 多态\n\n多态是向具有相同的对象发送相同消息的能力。也就是说，无论接收者属于哪个类，只要具有共同属性。\n\n在 OOP 语言中，多态通过在不同类中描述具有相同名称的方法来实现。这一特征使程序员避免了在程序中编写复杂的控制结构。消息的不同可能性只有在程序运行时才是真正需要的。\n\
    \n### 5.1.5 虚方法\n\n动态绑定技术允许我们在不重新编译程序的情况下干预实体的操作。\n\n"
- fmt: "\nTo get that advantage, while implementing the object's classes we have to\
    \ implement virtual methods. These are methods that will carry specific content\
    \ at program execution time. When the compiler compiles the source program into\
    \ machine language, the program segments of the virtual methods are included in\
    \ the table of virtual methods. At program execution time, virtual methods will\
    \ be called from this virtual method table.\n\n## 5.2 The new Operator\n\nThe\
    \ `new` operator lets developers create an instance of a user-defined object type\
    \ or of one of the built-in object types that have a constructor function.\n\n\
    ![Rat with solid fill](Images/image00519.jpeg) We capitalize the first letter\
    \ of function constructors to distinguish them from the normal functions.\n\n\
    Example:\n\n```javascript\n\"use strict\";\nfunction User(firstName, lastName)\
    \ {\n  this.firstName = firstName;\n  this.lastName = lastName;\n}\nlet user1\
    \ = new User('Neo', 'D. Truman');\nconsole.log(user1);\n// User {firstName: 'Neo',\
    \ lastName: 'D. Truman'}\n```\n\nWhen the code `new User(...)` is executed, the\
    \ following things happen:\n\n- A new empty object is created.\n- The prototype\
    \ of the object will have a new property, called `constructor`, which will be\
    \ assigned the `User` function to it.\n- Finally, the constructor is called with\
    \ `this` binding to the object at the first step.\n\n## 5.3 The prototype Property\
    \ of Functions\n\nIn JavaScript, functions are also objects, because they can\
    \ have properties and methods just like any other objects. What distinguishes\
    \ them from other objects is that functions can be called.\n\nThis is an example\
    \ of the `prototype` property of functions.\n\n```javascript\n\"use strict\";\n\
    function User(firstName, lastName) {\n  this.firstName = firstName;\n  this.lastName\
    \ = lastName;\n}\nconsole.log(typeof User); // function\n// Using function.prototype\n\
    User.prototype.logName = function () {\n  console.log(this.firstName + ' ' + this.lastName);\n\
    }\n\nlet user1 = new User('Neo', 'D. Truman');\nconsole.log(user1); // User {firstName:\
    \ 'Neo', lastName: 'D. Truman'}\nuser1.logName(); // Neo D. Truman\n```\n\nThe\
    \ `user1` object doesn’t have the method `logName()` but `user1.logName()` worked\
    \ and printed “Neo D. Truman” to the Console panel.\n\nLet’s open the Console\
    \ panel to see the result. Try to expand the `user1` object and its prototype\
    \ (`[[Prototype]]`) to see more information in this picture.\n\n![](Images/image00520.jpeg)\n\
    \nIn the above picture, we can see the Prototype of `user1` is an object having\
    \ the `logName()` method because we defined `User.prototype.logName` as a function\
    \ expression.\n\nThe following describes how `user1.logName();` can print “Neo\
    \ D. Truman” to the console panel.\n\n- Since `user1` doesn’t have the `logName()`\
    \ method, the JavaScript engine did search the method in `user1`’s prototype.\n\
    - Because the prototype of `user1` is an object having the `logName()` method,\
    \ the desired method was found and invoked.\n- In the method, `this` was `user1`\
    \ so that `this.firstName` is “Neo” and `this.lastName` is “D. Truman”. As a result,\
    \ “Neo D. Truman” was printed on the console panel.\n\nThere is another prototype\
    \ in `user1`’s prototype (as in the picture) and we call them a Prototype Chain.\
    \ Searching through the prototype chain could happen again and again until:\n\n\
    - it found the desired property or method\n- or it reaches `null` since `null`\
    \ has no prototype.\n\nMethods of objects should be defined in the `Function.prototype`\
    \ objects because of these advantages:\n\n- Save memory since it only takes up\
    \ one memory area.\n- Can modify the methods easily after creating instances since\
    \ all instances only refer to one prototype object.\n\nLet’s try the below example:\n\
    \n```javascript\n\"use strict\";\nfunction User(firstName, lastName) {\n  this.firstName\
    \ = firstName;\n  this.lastName = lastName;\n  this.badMethod = function () {\n\
    \    console.log('Should not define method like this');\n  }\n}\n\nUser.prototype.logName\
    \ = function () {\n  console.log(this.firstName + ' ' + this.lastName);\n}\n\n\
    let user1 = new User('Neo', 'D. Truman');\nlet user2 = new User('John', 'Conner');\n\
    \nuser2.badMethod = function () {\n  console.log('The badMethod() method of user2');\n\
    }\nuser1.badMethod(); // Should not define method like this\nuser2.badMethod();\
    \ // The badMethod() method of user2\n\nUser.prototype.logName = function () {\n\
    \  console.log('The logName() method was modified');\n}\nuser1.logName(); // The\
    \ logName() method was modified\nuser2.logName(); // The logName() method was\
    \ modified\n```\n\n## 5.4 Extend Function Objects\n\nWe can use the `prototype`\
    \ property of functions to extend the function objects. The below example implements\
    \ the `String.format()` method that returns a formatted string by given format\
    \ and arguments.\n\nExample:\n\n```javascript\n\"use strict\";\nString.prototype.format\
    \ = function () {\n  let args = arguments;\n  return this.replace(/{(\\d+)}/g,\
    \ function (match, number) {\n    return typeof args[number] !== 'undefined' ?\
    \ args[number] : match;\n  });\n}\nlet greetingStr = 'Hello {0}. How are you,\
    \ {1}?'.format('Neo', 'D. Truman');\nconsole.log(greetingStr); // Hello Neo. How\
    \ are you, D. Truman?\n```\n\n## 5.5 Reflect\n\n`Reflect` is a built-in object\
    \ that helps:\n\n- Detecting whether an object contains certain properties.\n\
    ```javascript\n\"use strict\";\nlet obj = { firstName: \"Neo\" };\nReflect.has(obj,\
    \ 'firstName'); // true\n```\n\n- Retrieving a property.\n```javascript\n\"use\
    \ strict\";\nlet obj = { firstName: \"Neo\" };\nReflect.get(obj, 'firstName');\
    \ // Neo\n```\n\n- Returning the object's own keys.\n```javascript\n\"use strict\"\
    ;\nlet obj = { firstName: \"Neo\" };\nReflect.ownKeys(obj); // ['firstName']\n\
    ```\n\n- Adding a new property to the object\n```javascript\n\"use strict\";\n\
    let obj = { firstName: \"Neo\" };\nReflect.set(obj, 'age', 39);\nconsole.log(obj.age);\
    \ // 39\n```\n\n- Setting the prototype of an object. Returns `true` if the update\
    \ was successful.\n```javascript\n\"use strict\";\nlet obj1 = { firstName: \"\
    Neo\", lastName: \"D. Truman\", logname: function () {\n  console.log(this.firstName\
    \ + ' ' + this.lastName);\n} };\nlet obj2 = { firstName: \"John\" };\nReflect.setPrototypeOf(obj2,\
    \ obj1);\nobj2.logname(); // John D. Truman\n```\n\n## 5.6 Classes\n\nClasses\
    \ in JavaScript are built on the prototype chain and used to create objects. There\
    \ are two types of classes; these are class expression and class declaration,\
    \ but no types support hoisting.\n\n### 5.6.1 Class declarations\n\nOne way to\
    \ define a class is using a class declaration. To declare a class, you use the\
    \ `class` keyword with the name of the class.\n\nExample:\n\n```javascript\n\"\
    use strict\";\nclass User {\n  constructor(firstName, lastName) {\n    this.firstName\
    \ = firstName;\n    this.lastName = lastName;\n  }\n  logName() {\n    console.log(this.firstName\
    \ + ' ' + this.lastName);\n  }\n}\nlet user1 = new User('Neo', 'D. Truman');\n\
    console.log(user1.firstName); // Neo\nconsole.log(user1);\n```\n\n![](Images/image00521.jpeg)\n\
    \nAs in the picture, `user1` is an object having two properties `firstName` and\
    \ `lastName`. The `logName()` method of `user1` is put inside the object’s prototype.\n"
  raw: 'To get that advantage, while implementing the object''s classes we have to
    implement virtual methods. These are methods that will carry specific content
    at program execution time. When the compiler compiles the source program into
    machine language, the program segments of the virtual methods are included in
    the table of virtual methods. At program execution time, virtual methods will
    be called from this virtual method table.


    ## 5.2 The new Operator


    The  new operator lets developers create an instance of a user-defined object
    type or of one of the built-in object types that have a constructor function.


    ![Rat with solid fill](Images/image00519.jpeg) We capitalize the first letter
    of function constructors to distinguish them from the normal functions.


    Example:


    | 1 | "use strict"; |


    | 2 | function User(firstName, lastName) { |


    | 3 |  this.firstName = firstName; |


    | 4 |  this.lastName = lastName; |


    | 5 | } |


    | 6 | let user1 = new User(''Neo'', ''D. Truman''); |


    | 7 | console.log(user1); |


    | 8 | // User {firstName: ''Neo'', lastName: ''D. Truman''} |


    When the code  new User(...) is executed, the following things happen:


    ● A new empty object is created.


    ● The prototype of the object will have a new property, called “constructor”,
    which will be assigned the  User function to it.


    ● Finally, the constructor is called with  this binding to the object at the first
    step.


    ## 5.3 The prototype Property of Functions


    In JavaScript, functions are also objects, because they can have properties and
    methods just like any other objects. What distinguishes them from other objects
    is that functions can be called.


    This is an example of the  prototype property of functions.


    | 1 | "use strict"; |


    | 2 | function User(firstName, lastName) { |


    | 3 |  this.firstName = firstName; |


    | 4 |  this.lastName = lastName; |


    | 5 | } |


    | 6 | console.log(typeof User); // function |


    | 7 | // Using function.prototype |


    | 8 | User.prototype.logName = function () { |


    | 9 |     console.log(this.firstName + '' '' + this.lastName); |


    | 10 | } |


    | 11 |  |


    | 12 | let user1 = new User(''Neo'', ''D. Truman''); |


    | 13 | console.log(user1); // User {firstName: ''Neo'', lastName: ''D. Truman''}
    |


    | 14 | user1.logName(); // Neo D. Truman |


    The  user1 object doesn’t have the method  logName() but  user1.logName() worked
    and printed “Neo D. Truman” to the Console panel.


    Let’s open the Console panel to see the result. Try to expand the  user1 object
    and its prototype ([[Prototype]]) to see more information in this picture.


    ![](Images/image00520.jpeg)


    In the above picture, we can see the Prototype of  user1 is an object having the  logName()
    method because we defined the  User.prototype.logName as a function expression.


    The following describes how  user1.logName(); can print “Neo D. Truman” to the
    console panel.


    ● Since  user1 doesn’t have the  logName() method, the JavaScript engine did search
    the method in  user1’s prototype.


    ● Because the prototype of  user1 is an object having the  logName() method, the
    desired method was found and invoked.


    ● In the method,  this was  user1 so that  this.firstName is “Neo” and  this.lastName
    is “D. Truman”. As a result, “Neo D. Truman” was printed on the console panel.


    There is another prototype in  user1’s prototype (as in the picture) and we call
    them a Prototype Chain. Searching through the prototype chain could happen again
    and again until


    ● it found the desired property or method


    ● or it reaches  null since  null has no prototype.


    Methods of objects should be defined in the  Function.prototype objects because
    of these advantages:


    ● Save memory since it only takes up one memory area.


    ● Can modify the methods easily after creating instances since all instances only
    refer to one prototype object.


    Let’s try the below example:


    | 1 | "use strict"; |


    | 2 | function User(firstName, lastName) { |


    | 3 |  this.firstName = firstName; |


    | 4 |  this.lastName = lastName; |


    | 5 |  this.badMethod = function () { |


    | 6 |         console.log(''Should not define method like this''); |


    | 7 |     } |


    | 8 | } |


    | 9 |  |


    | 10 | User.prototype.logName = function () { |


    | 11 |     console.log(this.firstName + '' '' + this.lastName); |


    | 12 | } |


    | 13 |  |


    | 14 | let user1 = new User(''Neo'', ''D. Truman''); |


    | 15 | let user2 = new User(''John'', ''Conner''); |


    | 16 |  |


    | 17 | user2.badMethod = function () { |


    | 18 |     console.log(''The badMethod() method of user2''); |


    | 19 | } |


    | 20 | user1.badMethod(); // Should not define method like this |


    | 21 | user2.badMethod(); // The badMethod() method of user2 |


    | 22 |  |


    | 23 | User.prototype.logName = function () { |


    | 24 |     console.log(''The logName() method was modified''); |


    | 25 | } |


    | 26 | user1.logName(); // The logName() method was modified |


    | 27 | user2.logName(); // The logName() method was modified |


    ## 5.4 Extend Function Objects


    We can use the  prototype property of functions to extend the function objects.
    The below example implements the  String.format() method that returns a formatted
    string by given format and arguments.


    Example:


    | 1 | "use strict"; |


    | 2 | String.prototype.format = function () { |


    | 3 |  let args = arguments; |


    | 4 |  return  this.replace(/{(\d+)}/g, function (match, number) { |


    | 5 |  return  typeof args[number] != ''undefined'' ? args[number] : match; |


    | 6 |     }); |


    | 7 | } |


    | 8 |  |


    | 9 | let greetingStr = ''Hello {0} {1}. How are you, {0}?''.format(''Neo'', ''D.
    Truman''); |


    | 10 | console.log(greetingStr); |


    | 11 | // Hello Neo D. Truman. How are you, Neo? |


    ## 5.5 Reflect


    Reflect is a built-in object that helps:


    ● Detecting or retrieving whether an object contains certain properties.


    | 1 | "use strict"; |


    | 2 | let obj = { |


    | 3 | firstName: "Neo", |


    | 4 | lastName: "D. Truman" |


    | 5 | } |


    | 6 | Reflect.has(obj, ''firstName''); // true |


    | 7 | Reflect.get(obj, ''firstName''); // Neo |


    | 8 | Reflect.has(obj, ''age''); // false |


    ● Returning the object''s own keys


    | 9 | Reflect.ownKeys(obj); // [''firstName'', ''lastName''] |


    ● Adding a new property to the object


    | 10 | Reflect.set(obj, ''age'', 39); |


    | 11 | console.log(obj.age); // 39 |


    ● Setting the prototype of an object. Returns  true if the update was successful.


    | 1 | "use strict"; |


    | 2 | let obj1 = { |


    | 3 | firstName: ''Neo'', |


    | 4 | lastName: ''D. Truman'', |


    | 5 | logFullname: function () { |


    | 6 |         console.log(this.firstName + '' '' + this.lastName); |


    | 7 |     } |


    | 8 | } |


    | 9 |  |


    | 10 | let obj2 = { |


    | 11 | firstName: ''John'' |


    | 12 | } |


    | 13 | // Set obj1 as prototype of obj2 |


    | 14 | Reflect.setPrototypeOf(obj2, obj1); |


    | 15 | obj2.logFullname(); // John D. Truman |


    ## 5.6 Classes


    Classes in JavaScript are built on the prototype chain and used to create objects.
    There are two types of classes; these are class expression and class declaration,
    but no types support hoisting.


    ### 5.6.1 Class declarations


    One way to define a class is using a class declaration. To declare a class, you
    use the  class keyword with the name of the class.


    Example:


    | 1 | "use strict"; |


    | 2 | class  User { |


    | 3 |  constructor(firstName, lastName) { |


    | 4 |  this.firstName = firstName; |


    | 5 |  this.lastName = lastName; |


    | 6 |     } |


    | 7 |     logName() { |


    | 8 |         console.log(this.firstName + '' '' + this.lastName); |


    | 9 |     } |


    | 10 | } |


    | 11 |  |


    | 12 | let user1 = new User(''Neo'', ''D. Truman''); |


    | 13 | console.log(user1.firstName); // Neo |


    | 14 | console.log(user1); |


    We can open the Console panel to see the result. Try to expand the  user1 object
    and its prototype ([[Prototype]]) to see more information in this picture.


    ![](Images/image00521.jpeg)


    As in the picture,  user1 is an object having two properties  firstName and  lastName.
    The  logName() method of  user1 is put inside the object’s prototype.


    ### 5.6.2 Class expressions'
  toc: []
  trans: "\n为了获得这种优势，在实现对象的类时，我们必须实现虚方法。这些是在程序执行时携带特定内容的方法。当编译器将源程序编译成机器语言时，虚方法的程序段会被包含在虚方法表中。在程序执行时，将从这个虚方法表中调用虚方法。\n\
    \n## 5.2 new 运算符\n\n`new` 运算符允许开发者创建用户定义对象类型的实例，或者创建具有构造函数的内置对象类型的实例。\n\n![实心填充鼠](img/image00519.jpeg)\
    \ 我们将函数构造函数的首字母大写，以区分它们与普通函数函数。\n\n示例：\n\n```javascript\n\"use strict\";\nfunction\
    \ User(firstName, lastName) {\n  this.firstName = firstName;\n  this.lastName\
    \ = lastName;\n}\nlet user1 = new User('Neo', 'D. Truman');\nconsole.log(user1);\n\
    // User {firstName: 'Neo', lastName: 'D. Truman'}\n```\n\n当执行代码 `new User(...)`\
    \ 时，会发生以下情况：\n\n- 创建一个新的空对象。\n- 该对象的原型将有一个新属性，称为 `constructor`，并将 `User` 函数赋值给它。\n\
    - 最后，调用构造函数并将 `this` 绑定到第一步创建的对象上。\n\n## 5.3 函数的 prototype 属性\n\n在 JavaScript\
    \ 中，函数也是对象，因为它们像任何其他对象一样拥有属性和方法。它们与其他对象的区别在于函数可以被调用。\n\n这是一个函数 `prototype` 属性的示例。\n\
    \n```javascript\n\"use strict\";\nfunction User(firstName, lastName) {\n  this.firstName\
    \ = firstName;\n  this.lastName = lastName;\n}\nconsole.log(typeof User); // function\n\
    // 使用 function.prototype\nUser.prototype.logName = function () {\n  console.log(this.firstName\
    \ + ' ' + this.lastName);\n}\n\nlet user1 = new User('Neo', 'D. Truman');\nconsole.log(user1);\
    \ // User {firstName: 'Neo', lastName: 'D. Truman'}\nuser1.logName(); // Neo D.\
    \ Truman\n```\n\n`user1` 对象没有 `logName()` 方法，但 `user1.logName()` 正常工作并在控制台面板打印了“Neo\
    \ D. Truman”。\n\n让我们打开控制台面板查看结果。尝试展开 `user1` 对象及其原型（`[[Prototype]]`）以查看此图中的更多信息。\n\
    \n![](img/image00520.jpeg)\n\n在上面的图中，我们可以看到 `user1` 的原型是一个拥有 `logName()` 方法的对象，因为我们把\
    \ `User.prototype.logName` 定义为一个函数表达式。\n\n以下内容描述了 `user1.logName();` 如何在控制台面板上打印“Neo\
    \ D. Truman”。\n\n- 由于 `user1` 没有 `logName()` 方法，JavaScript 引擎在 `user1` 的原型中搜索了该方法。\n\
    - 因为 `user1` 的原型是一个拥有 `logName()` 方法的对象，所以找到了并调用了所需的方法。\n- 在方法内部，`this` 指向 `user1`，因此\
    \ `this.firstName` 是“Neo”，`this.lastName` 是“D. Truman”。结果是在控制台面板上打印了“Neo D. Truman”。\n\
    \n在 `user1` 的原型中还有另一个原型（如图片所示），我们称之为原型链（Prototype Chain）。对原型链的搜索可能会反复反复发生，直到：\n\
    \n- 找到了所需的属性或方法\n- 或者到达 `null`，因为 `null` 没有原型。\n\n对象的方法应该定义在 `Function.prototype`\
    \ 对象中，因为具有以下优势：\n\n- 节省内存，因为它只占用一个内存区域。\n- 在创建实例后可以轻松修改方法，因为所有实例只引用一个原型对象。\n\n\
    让我们尝试下面的示例：\n\n```javascript\n\"use strict\";\nfunction User(firstName, lastName)\
    \ {\n  this.firstName = firstName;\n  this.lastName = lastName;\n  this.badMethod\
    \ = function () {\n    console.log('Should not define method like this');\n  }\n\
    }\n\nUser.prototype.logName = function () {\n  console.log(this.firstName + '\
    \ ' + this.lastName);\n}\n\nlet user1 = new User('Neo', 'D. Truman');\nlet user2\
    \ = new User('John', 'Conner');\n\nuser2.badMethod = function () {\n  console.log('The\
    \ badMethod() method of user2');\n}\nuser1.badMethod(); // Should not define method\
    \ like this\nuser2.badMethod(); // The badMethod() method of user2\n\nUser.prototype.logName\
    \ = function () {\n  console.log('The logName() method was modified');\n}\nuser1.logName();\
    \ // The logName() method was modified\nuser2.logName(); // The logName() method\
    \ was modified\n```\n\n## 5.4 扩展函数对象\n\n我们可以使用函数的 `prototype` 属性来扩展函数对象。下面的示例实现了\
    \ `String.format()` 方法，该方法根据给定的格式和参数返回格式化字符串。\n\n示例：\n\n```javascript\n\"use strict\"\
    ;\nString.prototype.format = function () {\n  let args = arguments;\n  return\
    \ this.replace(/{(\\d+)}/g, function (match, number) {\n    return typeof args[number]\
    \ !== 'undefined' ? args[number] : match;\n  });\n}\nlet greetingStr = 'Hello\
    \ {0}. How are you, {1}?'.format('Neo', 'D. Truman');\nconsole.log(greetingStr);\
    \ // Hello Neo. How are you, D. Truman?\n```\n\n## 5.5 Reflect\n\n`Reflect` 是一个内置对象，有助于：\n\
    \n- 检测对象是否包含某些属性。\n```javascript\n\"use strict\";\nlet obj = { firstName: \"Neo\"\
    \ };\nReflect.has(obj, 'firstName'); // true\n```\n\n- 获取属性。\n```javascript\n\"\
    use strict\";\nlet obj = { firstName: \"Neo\" };\nReflect.get(obj, 'firstName');\
    \ // Neo\n```\n\n- 返回对象的自身的键。\n```javascript\n\"use strict\";\nlet obj = { firstName:\
    \ \"Neo\" };\nReflect.ownKeys(obj); // ['firstName']\n```\n\n- 向对象添加新属性。\n```javascript\n\
    \"use strict\";\nlet obj = { firstName: \"Neo\" };\nReflect.set(obj, 'age', 39);\n\
    console.log(obj.age); // 39\n```\n\n- 设置对象的原型。如果更新成功则返回 `true`。\n```javascript\n\
    \"use strict\";\nlet obj1 = { firstName: \"Neo\", lastName: \"D. Truman\", logname:\
    \ function () {\n  console.log(this.firstName + ' ' + this.lastName);\n} };\n\
    let obj2 = { firstName: \"John\" };\nReflect.setPrototypeOf(obj2, obj1);\nobj2.logname();\
    \ // John D. Truman\n```\n\n## 5.6 类\n\nJavaScript 中的类构建在原型链之上，并用于创建对象。类有两种类型；这些类表达式和类声明，但这些类型都不支持提升。\n\
    \n### 5.6.1 类声明\n\n定义类的一种方法是使用类声明。声明类时，使用 `class` 关键字配合类名。\n\n示例：\n\n```javascript\n\
    \"use strict\";\nclass User {\n  constructor(firstName, lastName) {\n    this.firstName\
    \ = firstName;\n    this.lastName = lastName;\n  }\n  logName() {\n    console.log(this.firstName\
    \ + ' ' + this.lastName);\n  }\n}\nlet user1 = new User('Neo', 'D. Truman');\n\
    console.log(user1.firstName); // Neo\nconsole.log(user1);\n```\n\n![](img/image00521.jpeg)\n\
    \n如图所示，`user1` 是一个拥有两个属性 `firstName` 和 `lastName`的对象。`user1` 的 `logName()` 方法被放置在对象的原型中。\n"
- fmt: "\nThe class expression is another way to define classes. Class expressions\
    \ can be named or unnamed. The name given to a class expression is local to the\
    \ class's body.\n\nExample:\n\n```javascript\n1 | \"use strict\";\n2 | // unnamed\n\
    3 | let User = class {\n4 |  constructor(firstName, lastName) {\n5 |  this.firstName\
    \ = firstName;\n6 |  this.lastName = lastName;\n7 |     }\n8 | }\n9 | console.log(User.name);\
    \ // User\n10 | let user1 = new User('Neo', 'D. Truman');\n11 |  \n12 | // named\n\
    13 | let AnotherUser = class  UserClass{\n14 |  constructor(firstName, lastName)\
    \ {\n15 |  this.firstName = firstName;\n16 |  this.lastName = lastName;\n17 |\
    \     }\n18 | }\n19 | console.log(AnotherUser.name); // UserClass\n20 | // But\
    \ AnotherUser must be used to create objects\n21 | let user2 = new AnotherUser('Neo',\
    \ 'D. Truman');\n```\n\n\n### 5.6.3 Constructor\n\nThe `constructor` method is\
    \ a function that will be called automatically when creating new objects. They\
    \ are often used as a gateway that receives initial data for the objects.\n\n\
    In a constructor’s function body, we can use the `super` keyword to call the constructor\
    \ of the super class.\n\n### 5.6.4 Static Methods and Properties\n\nThe `static`\
    \ keyword is used to specify static variables and methods of classes. Static variables\
    \ or methods are accessed via the class name (not through the class instance).\n\
    \nExample:\n\n```javascript\n1 | \"use strict\";\n2 | class  User {\n3 |  static\
    \ staticProperty = \"Static Value\";\n4 |  \n5 |  constructor(firstName, lastName)\
    \ {\n6 |  this.firstName = firstName;\n7 |  this.lastName = lastName;\n8 |   \
    \  }\n9 |     logInfo() {\n10 |         console.log(this.firstName + ' ' + this.lastName);\n\
    11 |     }\n12 |  static staticMethod() {\n13 |         console.log('This is a\
    \ static method');\n14 |     }\n15 | }\n16 |  \n17 | console.log(User.staticProperty);\
    \ // Static Value\n18 | User.staticMethod(); // This is a static method\n19 |\
    \  \n20 | let user1 = new User('Neo', 'D. Truman');\n21 | console.log(user1.staticProperty);\
    \ // undefined\n22 | console.log(user1.staticMethod); // undefined\n23 | console.log(user1);\n\
    ```\n\nInside a class, static methods and static properties can only be used within\
    \ another static method of the class.\n\n```javascript\n1 | \"use strict\";\n\
    2 | class  User {\n3 |  static staticProperty = \"Static Value\";\n4 |  \n5 |\
    \  constructor(firstName, lastName) {\n6 |  this.firstName = firstName;\n7 | \
    \ this.lastName = lastName;\n8 |     }\n9 |     logInfo() {\n10 |         console.log('Access\
    \ the static property from non-static method: ' + this.staticProperty);\n11 |\
    \     }\n12 |  static staticMethod() {\n13 |         console.log('Value of the\
    \ static property: ' + this.staticProperty);\n14 |     }\n15 | }\n16 |  \n17 |\
    \ User.staticMethod();\n18 | // Value of the static property: Static Value\n19\
    \ |  \n20 | let user1 = new User('Neo', 'D. Truman');\n21 | user1.logInfo();\n\
    22 | // Access the static property from the non-static method: undefined\n```\n\
    \n![Crocodile with solid fill](Images/image00522.jpeg) We can refer to the static\
    \ properties and method as properties of the constructor: `this.constructor.STATIC_PROPERTY`\
    \ / `this.constructor.STATIC_METHOD()`. However, we should avoid using them because\
    \ it breaks the pattern that is “We can only call static methods or use static\
    \ properties within another static method of the same class”.\n\n### 5.6.5 Private\
    \ Methods and Properties\n\nThe hash `#` prefix is used to declare private properties\
    \ and private methods of objects. Private fields can only be accessed inside the\
    \ classes. They are not available for the class instances or in the derived classes.\n\
    \nExample:\n\n```javascript\n1 | \"use strict\";\n2 | class  User {\n3 |  // Private\
    \ properties must be declared here\n4 |     #age;\n5 |  constructor(firstName,\
    \ lastName, age) {\n6 |  this.firstName = firstName;\n7 |  this.lastName = lastName;\n\
    8 |  this.#age = age;\n9 |     }\n10 |     logInfo() {\n11 |         console.log(this.firstName\
    \ + ' ' + this.lastName);\n12 |  this.#logAge();\n13 |     }\n14 |  \n15 |   \
    \  #logAge() {\n16 |      console.log(this.#age);\n17 |     }\n18 | }\n19 |  \n\
    20 | let user1 = new User('Neo', 'D. Truman', 30);\n21 | user1.logInfo();\n22\
    \ | console.log(user1);\n```\n\nUn-comment the below lines will cause SyntaxError:\n\
    \n```javascript\n23 // user1.#age;\n24 // user1.#logAge();\n```\n\nWe can open\
    \ the panel to see the value of `this.#age`. ![Crocodile with solid fill](Images/image00522.jpeg)\
    \ We can see that private fields are located directly in the object. If we refer\
    \ to out of scope, a SyntaxError will be thrown.\n\n### 5.6.6 Classing with Extends\n\
    \nThe `extends` keyword is used to create a derived class (of another class).\
    \ The `super` keyword is used to call the constructor of the super class.\n\n\
    Example:\n\nSource of the `User` class:\n\n```javascript\n1 | \"use strict\";\n\
    2 | class  User {\n3 |  // Private properties must be declared here\n4 |     #age;\n\
    5 |  constructor(firstName, lastName, age) {\n6 |  this.firstName = firstName;\n\
