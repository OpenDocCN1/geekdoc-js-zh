  trans: "\n设置开发环境的第一步是选择你的代码编辑器。几乎所有的编辑器都具有自动补全、语法高亮、代码格式化和智能重构等基本功能。使用它们可以帮助你防止潜在的错误。其他功能如逐行调试可能已经存在于编辑器中了。然而，在调试\
    \ JavaScript 代码时，我们将使用 浏览器的开发者工具。完成开发环境设置后，你的编码工作将变得异常简单和快速。\n\n![Rat with solid\
    \ fill](img/image00494.jpeg) 你可以考虑使用的几个工具，以便能够随时选择其中任何一个。无论你选择哪种工具，都将遵循类似的流程来学习课程。\n\
    \n## 1. 安装代码编辑器\n\n在本书中，我们使用 Visual Studio Code（简称为 `VS Code`）作为代码编辑器。你可以从 [`code.visualstudio.com/download`](https://code.visualstudio.com/download)\
    \ 免费下载它。在 Stack Overflow 的调查中，`VS Code` 被评为跨语言最流行的代码编辑器。\n\n第一次打开 `VS Code` 时，系统可能会要求你选择一种语言来开始；只需选择\
    \ JavaScript 即可。\n\n## 2. 使用 Web 浏览器\n\n我们将使用 Google Chrome 作为运行和调试 JavaScript\
    \ 代码的工具，因为它是最流行的浏览器。此外，它还包含了下面将描述的强大的开发者工具。\n\n### 2.1 使用浏览器的开发者工具\n\n开发者工具通常显示为浏览器窗口右侧或底部的标签页组面板。要在\
    \ Google Chrome 中打开开发者工具，打开浏览器窗口右上角的 `Chrome 菜单`，并选择 `更多工具 > 开发者工具`。\n\n你也可以使用\
    \ `Shift + CTRL + J`（Windows/Linux）或 `Option + ⌘ + J`（macOS）来打开工具。\n\n![](img/image00495.jpeg)\n\
    \n开发者工具将在新窗口中打开，或如下所示在 `Chrome` 窗口内打开。\n\n![](img/image00496.jpeg)\n\n我们可以按照以下步骤将其分离到单独窗口，或仅更改停靠位置：\n\
    \n- 点击右上角的“自定义和控制开发者工具”按钮。\n- 然后按照下图选择你想要的停靠侧。\n\n![](img/image00497.jpeg)\n\n\
    ### 2.2 使用控制台工具\n\n如果没有选择 `Console`（控制台）工具，你可能需要选择 `Console` 标签。我们可以像下面所示在 `Console`\
    \ 工具中检查变量的值或直接尝试 JavaScript 代码。\n\n![](img/image00498.jpeg)\n\nConsole 面板显示你通过\
    \ `console.log()` 输出的消息以及任何未处理的错误。\n\n### 2.3 使用 Sources 源码工具\n\n你可能需要选择 `Sources`（源代码）标签来打开调试工具。它支持通过断点进行逐行调试、查看调用堆栈、作用域链等。细节将在稍后通过代码介绍。\n\
    \n![](img/image00499.jpeg)\n\n## 3. 准备工作空间\n\n请按照以下步骤创建你的工作空间：\n\n- 创建 `Example`\
    \ 文件夹，例如 `D:\\Example`\n- 打开 `Visual Studio Code`\n- 在 `VS Code` 中，选择菜单 `文件 >\
    \ 打开文件夹…`\n- 选择你的文件夹，在我的示例是 `D:\\Example`\n- 将鼠标悬停在 `EXAMPLE` 文件夹上，会出现如下所示的图标。\n\
    \n![](img/image00500.jpeg)\n- 点击 `New File`（新建文件）图标。\n\n![](img/image00501.jpeg)\n\
    - 输入 `index.html` 并按回车\n- 然后在编辑器中输入以下 HTML 代码\n\n```html\n<!DOCTYPE  html>\n<html>\n\
    <body>\n <h2>Testing Page</h2>\n <!-- 在此处输入你的 HTML 代码 -->\n <script  src=\"app.js\"\
    ></script>\n</body>\n</html>\n```\n``````\n\n- 选择菜单 `文件 > 保存` 将更改保存到 `index.html`\
    \ 文件。\n\n![](img/image00502.jpeg)\n- 将鼠标悬停在 `EXAMPLE` 文件夹上并点击 `New File`（新建文件）图标。\n\
    - 输入 `app.js` 并按回车。\n- 然后在编辑器中输入下面的 JavaScript 代码。\n\n```javascript\n\"use strict\"\
    ;\nconsole.log('This is your first JS code.');\n```\n\n- 选择菜单 `文件 > 保存` 将更改保存到\
    \ `app.js` 文件。\n\n![](img/image00503.jpeg)\n\n![Rat with solid fill](img/image00504.jpeg)\
    \ 在学习本书的期间，你将将修改 `app.js` 文件中的 JavaScript 代码和 `index.html` 文件中的 HTML 代码。\n\n让我们在\
    \ Web 浏览器（如 Google Chrome）中打开 `index.html` 文件来尝试代码。\n\n![](img/image00505.jpeg)\n\
    \n然后，打开 `Console` 面板查看结果。\n\n![](img/image00506.jpeg)\n\n# 第 2 章：对象\n\n在 JavaScript\
