    be named or unnamed. The name given to a class expression is local to the class''s
    body.


    Example:


    | 1 | "use strict"; |


    | 2 | // unnamed |


    | 3 | let User = class { |


    | 4 |  constructor(firstName, lastName) { |


    | 5 |  this.firstName = firstName; |


    | 6 |  this.lastName = lastName; |


    | 7 |     } |


    | 8 | } |


    | 9 | console.log(User.name); // User |


    | 10 | let user1 = new User(''Neo'', ''D. Truman''); |


    | 11 |  |


    | 12 | // named |


    | 13 | let AnotherUser = class  UserClass{ |


    | 14 |  constructor(firstName, lastName) { |


    | 15 |  this.firstName = firstName; |


    | 16 |  this.lastName = lastName; |


    | 17 |     } |


    | 18 | } |


    | 19 | console.log(AnotherUser.name); // UserClass |


    | 20 | // But AnotherUser must be used to create objects |


    | 21 | let user2 = new AnotherUser(''Neo'', ''D. Truman''); |


    ### 5.6.3 Constructor


    The  constructor method is a function that will be called automatically when creating
    new objects. They are often used as a gateway that receives initial data for the
    objects.


    In a constructor’s function body, we can use the  super keyword to call the constructor
    of the super class.


    ### 5.6.4 Static Methods and Properties


    The  static keyword is used to specify static variables and methods of classes.
    Static variables or methods are accessed via the class name (not through the class
    instance).


    Example:


    | 1 | "use strict"; |


    | 2 | class  User { |


    | 3 |  static staticProperty = "Static Value"; |


    | 4 |  |


    | 5 |  constructor(firstName, lastName) { |


    | 6 |  this.firstName = firstName; |


    | 7 |  this.lastName = lastName; |


    | 8 |     } |


    | 9 |     logInfo() { |


    | 10 |         console.log(this.firstName + '' '' + this.lastName); |


    | 11 |     } |


    | 12 |  static staticMethod() { |


    | 13 |         console.log(''This is a static method''); |


    | 14 |     } |


    | 15 | } |


    | 16 |  |


    | 17 | console.log(User.staticProperty); // Static Value |


    | 18 | User.staticMethod(); // This is a static method |


    | 19 |  |


    | 20 | let user1 = new User(''Neo'', ''D. Truman''); |


    | 21 | console.log(user1.staticProperty); // undefined |


    | 22 | console.log(user1.staticMethod); // undefined |


    | 23 | console.log(user1); |


    Inside a class, static methods and static properties can only be used within another
    static method of the class.


    | 1 | "use strict"; |


    | 2 | class  User { |


    | 3 |  static staticProperty = "Static Value"; |


    | 4 |  |


    | 5 |  constructor(firstName, lastName) { |


    | 6 |  this.firstName = firstName; |


    | 7 |  this.lastName = lastName; |


    | 8 |     } |


    | 9 |     logInfo() { |


    | 10 |         console.log(''Access the static property from non-static method:
    '' + this.staticProperty); |


    | 11 |     } |


    | 12 |  static staticMethod() { |


    | 13 |         console.log(''Value of the static property: '' + this.staticProperty);
    |


    | 14 |     } |


    | 15 | } |


    | 16 |  |


    | 17 | User.staticMethod(); |


    | 18 | // Value of the static property: Static Value |


    | 19 |  |


    | 20 | let user1 = new User(''Neo'', ''D. Truman''); |


    | 21 | user1.logInfo(); |


    | 22 | // Access the static property from the non-static method: undefined |


    ![Crocodile with solid fill](Images/image00522.jpeg) We can refer to the static
    properties and method as properties of the  constructor:  this.constructor.STATIC_PROPERTY
    / this.constructor.STATIC_METHOD(). However, we should avoid using them because
    it breaks the pattern that is “We can only call static methods or use static properties
    within another static method of the same class”.


    ### 5.6.5 Private Methods and Properties


    The hash # prefix is used to declare private properties and private methods of
    objects. Private fields can only be accessed inside the classes. They are not
    available for the class instances or in the derived classes.


    Example:


    | 1 | "use strict"; |


    | 2 | class  User { |


    | 3 |  // Private properties must be declared here |


    | 4 |     #age; |


    | 5 |  constructor(firstName, lastName, age) { |


    | 6 |  this.firstName = firstName; |


    | 7 |  this.lastName = lastName; |


    | 8 |  this.#age = age; |


    | 9 |     } |


    | 10 |     logInfo() { |


    | 11 |         console.log(this.firstName + '' '' + this.lastName); |


    | 12 |  this.#logAge(); |


    | 13 |     } |


    | 14 |  |


    | 15 |     #logAge() { |


    | 16 |         console.log(this.#age); |


    | 17 |     } |


    | 18 | } |


    | 19 |  |


    | 20 | let user1 = new User(''Neo'', ''D. Truman'', 39); |


    | 21 | user1.logInfo(); |


    | 22 | console.log(user1); |


    | 23 |  |


    | 24 | // Un-comment the below lines will cause SyntaxError |


    | 25 | // user1.#age; // SyntaxError |


    | 26 | // user1.#logAge(); // SyntaxError |


    We can open the Console panel to see the result and check the value of the  user1
    variable. Try to expand the object and its prototype ([[Prototype]]) to see more
    information in this picture.


    ![](Images/image00523.jpeg)


    We can see that all private fields are located directly in the object, not in
    its prototype. And if we refer to # names from out of scope, a  SyntaxError will
    be thrown.


    ![Crocodile with solid fill](Images/image00524.jpeg) It is also a syntax error
    to attempt to remove private fields with  delete.


    ### 5.6.6 Sub Classing with Extends


    The  extends keyword is used to create a class as a derived class (child of another
    class).


    The  super keyword is used to call the constructor of the super class.


    ![Fish with solid fill](Images/image00525.jpeg) If there is a constructor present
    in the subclass, it needs to first call  super() before using "this".


    Example:


    Source code of the  User class:


    | 1 | "use strict"; |


    | 2 | class  User { |


    | 3 |  // Private properties must be declared here |


    | 4 |     #age; |


    | 5 |  |


    | 6 |  constructor(firstName, lastName, age) { |


    | 7 |  this.firstName = firstName; |


    | 8 |  this.lastName = lastName; |


    | 9 |  this.#age = age; |


    | 10 |     } |


    | 11 |  |


    | 12 |  // getter and setter of private properties |


    | 13 |     getAge() { |


    | 14 |  return  this.#age; |


    | 15 |     } |


    | 16 |     setAge(newAge) { |


    | 17 |  this.#age = newAge; |


    | 18 |     } |


    | 19 |  |


    | 20 |  // Public methods here |


    | 21 |     logInfo() { |


    | 22 |         console.log(`Name: ${this.firstName}  ${this.lastName}`); |


    | 23 |  this.#logAge(); |


    | 24 |     } |


    | 25 |  |


    | 26 |  // Private methods here |


    | 27 |     #logAge() { |


    | 28 |         console.log(`Age: ${this.#age}`); |


    | 29 |     } |


    | 30 | } |


    Source code of the  Student class:


    | 1 | "use strict"; |


    | 2 | class  Student  extends User { |


    | 3 |  constructor(firstName, lastName, age, id) { |


    | 4 |  // Must call constructor of the super class before using ''this.'' |


    | 5 |  super(firstName, lastName, age); |


    | 6 |  this.id = id; |


    | 7 |     } |


    | 8 |  |


    | 9 |     logInfo() { |


    | 10 |         console.log(''Information of the student:''); |


    | 11 |  |


    | 12 |  // Constructor of the super class initialized the firstName and lastName
    properties but the Student class still owns the properties |


    | 13 |  // super.firstName; // undefined |


    | 14 |  // super.lastName; // undefined |


    | 15 |         console.log(`Name: ${this.firstName}  ${this.lastName}`); |


    | 16 |  |


    | 17 |  // Cannot access private fields of super class |


    | 18 |  // super.#age; // SyntaxError |


    | 19 |  // super.#logAge(); // SyntaxError |


    | 20 |  // Therefore, we must use the getter as below |


    | 21 |         console.log(`Age: ${super.getAge()}`); |


    | 22 |  // We can use this.getAge() instead of super.getAge() since the method
    could be found in the prototype chain |


    | 23 |  |


    | 24 |         console.log(`Id: ${this.id}`); |


    | 25 |     } |


    | 26 | } |


    Source code of the  Teacher class:


    | 1 | class  Teacher  extends User { |


    | 2 |     logInfo() { |


    | 3 |         console.log(''Information of the teacher:''); |


    | 4 |         console.log(''...''); |


    | 5 |     } |


    | 6 | } |


    Source code of the  SecurityGuard class:


    | 1 | class  SecurityGuard  extends User { } |


    Let’s try the above code!'
