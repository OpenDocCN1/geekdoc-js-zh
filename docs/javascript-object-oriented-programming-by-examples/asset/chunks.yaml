    \n# 前言\n\n面向对象编程（OOP）是一种以对象为基础的编程方法。本书介绍了封装、类和实例等 OOP 概念，指导你如何使用 JavaScript。\n\
    \nJavaScript 是世界上最广泛使用的语言，与 HTML 和 CSS 并列为核心技术之一。网站在客户端使用 JavaScript。所有主流浏览器都拥有执行\
    \ JavaScript 代码的引擎。\n\n# 读者群体\n\n本书面向已经熟悉基础 JavaScript 编程的中级开发者。它首先介绍了所有的 OOP\
    \ 概念，最后在最后一章介绍了 JavaScript 中的面向对象编程。\n\n# 如何与我们联系\n\n我的邮箱是 `odtruman@gmail.com`。如果你有任何问题，请给我发邮件。我很乐意听到读过我书的人反馈。我会尽力回答收到的每封邮件。主题应该是\
    \ `[JavaScript 面向对象编程实例教程] <你的主题>`，以便我快速筛选并回答你的问题。\n\n# 本书中使用的约定\n\n本书使用了以下排版约定：\n\
    \n*斜体*表示新术语、URL、电子邮件地址、文件名和扩展名。\n\n**粗体**表示重要概念或 UI 项目，如菜单项和按钮。\n\n`等宽字体`表示代码，包括语句、函数、类、对象、方法、属性等。\n\
    \n`等宽粗体`表示需要逐字输入的命令或其他文本。\n\n`等宽斜体`表示应替换为用户提供的值或根据上下文确定的文本。\n\n"
- fmt: "\nThe first step in setting up your development environment is choosing your\
    \ code editor. Almost editors have essential features like autocompletion, syntax\
    \ highlighting, formatting code, and smart refactoring. Using them helps you to\
    \ prevent potential mistakes. Other features such as line-by-line debugging could\
    \ be already available in the editor. However, we will use the Developer Tools\
    \ of web browsers while debugging JavaScript code. When finished setting up the\
    \ development environment, your coding will be amazingly easy and fast.\n\n![Rat\
    \ with solid fill](Images/image00494.jpeg) There are several tools you might consider\
    \ so that you could always choose any of them. No matter what tools you choose,\
    \ you’ll follow a similar process to learn the lessons.\n\n## 1. Installing a\
    \ Code Editor\n\nIn this book, we use Visual Studio Code (shortened to `VS Code`)\
    \ as the code editor. You can download this free at [https://code.visualstudio.com/download](https://code.visualstudio.com/download).\
    \ In Stack Overflow’s survey, `VS Code` was ranked as the most popular code editor\
    \ across languages.\n\nAt the first-time opening `VS Code`, you could be asked\
    \ to select a language to get started; just choose JavaScript for now.\n\n## 2.\
    \ Using a Web Browser\n\nWe will use Google Chrome as a tool to run and debug\
    \ our JavaScript code since it is the most popular browser. Moreover, it also\
    \ includes amazing Developer Tools that will be described below.\n\n### 2.1 Using\
    \ Developer Tools of The Browser\n\nThe Developer Tools are usually presented\
    \ as a tabbed group of panes at the right or bottom of the web browser window.\
    \ To open the developer tools in Google Chrome, open the `Chrome Menu` in the\
    \ upper-right-hand corner of the browser window and select `More Tools > Developer\
    \ tools`.\n\nYou can also use `Shift + CTRL + J` (on Windows/Linux), or `Option\
    \ + ⌘ + J` (on macOS) to open the tools.\n\n![](Images/image00495.jpeg)\n\nThe\
    \ Developer Tools will either open up in a new window or within the `Chrome` window\
