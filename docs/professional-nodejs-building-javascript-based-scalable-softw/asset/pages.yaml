  md: "Now point the browser to any other URL, such as http://localhost:8080/abc.\
    \ You should see the \"Hello World\" string rendered. This means that the static\
    \ component passes control to the next one, which in this case is the \"Hello\
    \ World!\" renderer.\n\n> NOTE Just as an interesting experiment, if you remove\
    \ the \"Hello World!\" renderer and then try a URL that the static server can't\
    \ reply to, you will find that Connect replies with the following:\n\nCannot GET\
    \ <URL>\n\nThis happens when Connect can't find any middleware that responds to\
    \ the request.\n\n# Parsing the Query String\n\nA typical convention for passing\
    \ arguments into a server-side page generator is using a query string. A query\
    \ string is where you encode a string containing name and value pairs. It comes\
    \ at the end of a URL, after the ? character. Here is an example of a URL with\
    \ a query string:\n\n/search?q=node.js&where=mailinglist\n\nConnect has a middleware\
    \ component that parses this string if available and then populates the query\
    \ property on the request, making it available for subsequent middleware components.\
    \ Listing 20-18 shows an example.\n\n# LISTING 20-18: Using the Connect query\
    \ string parser middleware.\n\n```\nvar connect = require('connect');\n\nvar app\
    \ = connect();\n\n// setup the query middleware\napp.use(connect.query());\n\n\
    // actually respond\napp.use(function(req, res) {\n    res.end(JSON.stringify(req.query));\n\
    });\n\napp.listen(8080);\n```\n\nHere you are setting up the query string parser\
    \ middleware and then replying with the content of req.query. You can save this\
    \ listing as a file named query.js and then run it:\n\n$ node query"
