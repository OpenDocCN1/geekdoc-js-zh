    \ res.render('users/index', {title: 'Users', users: users});\n  });\n});\n```\n\
    \nHere you are using the find method on model and passing an empty query object,\
    \ which means\nMongoDB should find every user and return him or her. There are\
    \ at least two problems with\nthis: First, you don't sort the results. By not\
    \ specifying the sorting order, MongoDB will use\nnatural order, which is the\
    \ order in which the documents are stored internally. This is most probably\n\
    not what the user is expecting. You can sort the query results by doing this:\n\
    \n```\nUser.find({}).sort('name', 1).exec(function(err, users) {\n  if (err) {\n\
    \    return next(err);\n  }\n  res.render('users/index', {title: 'Users', users:\
    \ users});\n});\n```\n\nHere we are using the query chaining API, where you can\
    \ define the constraints, specify\nthe sort order, and execute the query in separate\
    \ builder methods. Here you are specifying\nthat results should be sorted by the\
    \ name property in ascending order (hence the 1 value). If you\nuse -1 instead\
    \ of 1, the results would be sorted in descending order.\n\nYou can additionally\
    \ sort by any other fields; just add them to the query object before executing.\
    \ If,\ninstance, if you wanted to sort users by age (descending order) and then\
    \ by name (ascending order),\nyou would use the following code:\n\n```\nUser.find()\n\
    .sort('age', -1)\n.sort('name', 1)\n.exec(function(err; users) { ...\n```\n\n\
    The second problem with this listener code is that, because you are telling MongoDB\
    \ to fetch every\nobject in the collection, this time query takes to execute will\
    \ grow as the user collection grows."
