  md: '# CHAPTER 4 USING BUFFERS TO MANIPULATE, ENCODE, AND DECODE BINARY DATA


    > NOTE Another thing that is special about this buffer class is that the memory
    where the data sits is allocated outside of the JavaScript VM heap. This means
    that these objects will not be moved by the garbage-collection algorithm: It will
    sit in this permanent memory address without changing, saves CPU cycles that would
    be wasted making memory copies of the buffer contents.


    # CREATING A BUFFER


    You can create a buffer from a UTF-8-encoded string like this:


    ```

    var buf = new Buffer(''Hello World!'');

    ```


    You can also create a buffer from strings with other encodings as you specify
    the encoding on the second argument of the constructor:


    ```

    var buf = new Buffer(''8b76fde713ce'', ''base64'');

    ```


    Accepted encodings and their identifiers:


    +   ascii-ASCII. This encoding is limited to the ASCII character set.


    +   utf8-UTF-8. This is a variable width encoding that can represent every character
    in the Unicode character set. It has become the dominant encoding on the web.
    This is the default encoding if you do not specify one.


    +   base64-Base64. This encoding is used to represent binary data in an ASCII
    string format by translating it into a radix-64 representation. Base64 is commonly
    used to embed binary data into textual documents in a way that ensures that the
    data remains intact during transport.


    If you don''t have the initial content for a buffer and you need to create a buffer
    with a certain capacity to hold data in the future, you can create a new buffer
    by specifying its length like this:


    ```

    var buf = new Buffer(1024); // creating a 1024 byte buffer

    ```


    # GETTING AND SETTING BYTES IN A BUFFER


    After you create or receive a buffer, you might want to inspect and change its
    contents. You can access the byte value on any position of a buffer using the
    [] operator like this:


    ```

    var buf = new Buffer(''my buffer content'');

    // accessing the 10th position of buf

    console.log(buf[10]); // -> 99

    ```'
