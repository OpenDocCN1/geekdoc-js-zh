  md: '**NOTE** With the killSignal option you can pass a string identifying the name
    of the signal you want to send to the target process. Signals are identified in
    Node as strings. Here is a complete list of UNIX signals and their default actions:


    | NAME | DEFAULT ACTION | DESCRIPTION |

    | --- | --- | --- |

    | SIGHUP | Terminate process | Terminal line hangup |

    | SIGINT | Terminate process | Interrupt program |

    | SIGQUIT | Create core image | Quit program |

    | SIGILL | Create core image | Illegal instruction |

    | SIGTRAP | Create core image | Trace trap |

    | SIGABRT | Create core image | Abort program |

    | SIGEMT | Create core image | Emulate instruction executed |

    | SIGFPE | Create core image | Floating-point exception |

    | SIGKILL | Terminate process | Kill program |

    | SIGBUS | Create core image | Bus error |

    | SIGSEGV | Create core image | Segmentation violation |

    | SIGSYS | Create core image | Nonexistent system call invoked |

    | SIGPIPE | Terminate process | Software termination signal |

    | SIGALRM | Terminate process | Real-time timer expired |

    | SIGTERM | Terminate process | Software termination signal |

    | SIGURG | Discard signal | Urgent condition present on socket |

    | SIGSTOP | Stop process | Stop (cannot be caught or ignored) |

    | SIGTSTP | Stop process | Stop signal generated from keyboard |

    | SIGCONT | Discard signal | Continue after stop |

    | SIGCHLD | Discard signal | Child status has changed |

    | SIGTTIN | Stop process | Background read attempted from control terminal |

    | SIGTTO | Stop process | Background write attempted to control terminal |

    | SIGIO | Discard signal | I/O is possible on a descriptor |'
