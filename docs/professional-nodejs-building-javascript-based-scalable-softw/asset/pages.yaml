  md: "If you point your browser rendered: the URL http://localhost:8080/?a=b&c=d,\
    \ you should see the following response:\n\n```\n{\"a\":\"b\",\"c\":\"d\"}\n```\n\
    \nYou can now change the query string part of the URL and see how it reflects\
    \ the req.query object.\n\n# Parsing the Request Body\n\nIn HTTP, the request\
    \ body is the part of the request that comes after the header. It can contain\
    \ any content the application chooses and is typically used to upload files, post\
    \ forms, and pass remote API arguments.\n\nWhen posting forms, there are two types\
    \ of request body encoding: URL-encoded and multipart. The URL-encoded format\
    \ is similar to the query string format, and the multipart encoding is a more\
    \ complex format that is mainly used to upload files and pass more complex data\
    \ types.\n\nWhen passing arguments to an API call that is hosted by your server,\
    \ the remote client can encode the call arguments as a JSON-encoded body.\n\n\
    All of these main types of encoding are specified by the request content type,\
    \ and you will have to switch between these body decoders depending on it. Fortunately,\
    \ Connect comes with a generic body parser middleware component that makes this\
    \ for you, providing a final body property on the request object that can be consumed\
    \ later in the request.\n\nYou can use it as shown in Listing 20-19.\n\n+   LISTING\
    \ 20-19: Using the Connect body parser middleware.\n\n```\nvar connect = require('connect');\n\
    \nvar app = connect();\n\n// setup the middlewares\napp.use(connect.logger({method:req['content-type']));\n\
    app.use(connect.bodyParser());\n\n// actually respond\napp.use(function(req, res)\
    \ {\n  res.send(JSON.stringify(req.body));\n});\n\napp.listen(8080);\n```\n\n\
    Here you also added the logger middleware so you can inspect the HTTP method and\
    \ the request content type header.\n\nYou can save this listing as a file named\
    \ body.js and run it like this:\n\n```\n$ node body\n```"
