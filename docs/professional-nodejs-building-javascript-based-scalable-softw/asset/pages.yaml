  md: "# CREATING A SIMPLE DATAGRAM COMMAND-LINE CLIENT\n\nNow you are ready to replace\
    \ the nc client with a Node-based command-line UDP client. This client program\
    \ should accept the target hostname and port as command-line arguments and then\
    \ read from the standard input stream, piping this stream as messages to the UDP\
    \ target.\n\nStart by creating the script file and typing the following:\n\n```\n\
    #!/usr/bin/env node\n```\n\nSave this into a file named udp_client.js and change\
    \ it to be executable:\n\n```\n$ chmod +x udp_client.js\n```\n\nYour client should\
    \ be called from the shell command-line like this:\n\n```\n$ udp_client.js <host>\
    \ <port>\n```\n\nThen parse the command-line arguments. Those are available inside\
    \ the process.argv, which is an array containing all the command-line arguments.\
    \ The first argument will always contain the path for the Node executable, and\
    \ the second one will always contain the main script file path. The third will\
    \ then contain the host argument, and the fourth contains the port argument.\n\
    \n```\nvar host = process.argv[2];\nvar port = parseInt(process.argv[3], 10);\n\
    ```\n\n# Reading from the Command Line\n\nTo read from the command line after\
    \ your Node process is up, you must use the process.stdin readable stream. However,\
    \ the process.stdin stream starts in the paused state, which means that before\
    \ you can start using it, you need to resume it like this:\n\n```\nprocess.stdin.resume();\n\
    ```\n\nThen you should have the standard input stream available to get lines:\n\
    \n```\nprocess.stdin.on('data', function(data) {\n  console.log('user typed:',\
    \ data);\n});\n```\n\n# Sending Data to the Server\n\nNow you can pipe the user\
    \ input into the target UDP server:\n\n```\nvar dgram = require('dgram');\nvar\
    \ client = dgram.createSocket('udp4');\nprocess.stdin.on('data', function(data)\
    \ {\n  client.send(data, 0, data.length, port, host);\n});\n```"
