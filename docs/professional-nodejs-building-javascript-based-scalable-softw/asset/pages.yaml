  md: "Instead of using the .addListener function, you can use .on, which is simply\
    \ a shortcut. The following code is equivalent:\n\n```\n```javascript\nfunction\
    \ receiveData(data) {\n  console.log(\"got data from file read stream: %j\", data);\n\
    }\nreadStream.on(\"data\", receiveData);\n```\n```\n\nHere, you are using a named\
    \ function that you declare in advance, but instead you can use an inline anonymous\
    \ function to be more succinct:\n\n```\n```javascript\nreadStream.on(\"data\"\
    , function(data) {\n  console.log(\"got data from file read stream: %j\", data);\n\
    });\n```\n```\n\nAs pointed out, the arguments that are passed into the callback\
    \ depend on the specific emitter object and event type and are not standardized.\
    \ A \"data\" event might emit the data buffer, an \"error\" event might emit the\
    \ error object, and the stream \"end\" might not emit any value to the event listener.\n\
    \n# Binding Multiple Event Listeners\n\nThe event emitter pattern allows multiple\
    \ event listeners to listen to the same event type on the event emitter. For instance:\n\
    \n```\n```javascript\nreadStream.on(\"data\", function(data) {\n  console.log('I\
    \ have some data here.');\n});\nreadStream.on(\"data\", function(data) {\n  console.log('I\
    \ have some data here too.');\n});\n```\n```\n\nIn this example you bind two functions\
    \ to the readStream \"data\" event type. Every time the readStream object emits\
    \ the \"data\" event, you will see printed out:\n\n> I have some data here.\n\
    I have some data here too.\n\nThe event emitter is responsible for calling all\
    \ the registered listeners for a given event type, and it will call them in the\
    \ order in which they were registered. This means two things:\n\n+   - An event\
    \ listener might not be called immediately after the event is emitted. There might\
    \ be a bug caused by a jump in your code.\n- Throwing exceptions into the stack\
    \ is not normal behavior. When an event is emitted, if one of the event listeners\
    \ throws an error when invoked, some event listeners might never be called. In\
    \ that case, the event emitter will catch the error and may handle it."
