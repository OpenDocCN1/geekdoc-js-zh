  md: "# LISTING 25-11: New version of the user schema with a new enumerated gender\
    \ field in the data/schemas/user.js file.\n\n```\nvar mongoose = require('mongoose');\n\
    \nvar emailRegexp = /.+\\@.+\\..+/;\n\nvar UserSchema = new mongoose.Schema({\n\
    \  username: {type: String, unique: true},\n  name: String,\n  password: String,\n\
    \  email: {\n    type: String,\n    required: true,\n    match: emailRegexp\n\
    \  },\n  gender: {\n    type: String,\n    required: true,\n    uppercase: true,\n\
    \    'enum': ['M', 'F']\n  }\n});\n\nmodule.exports = UserSchema;\n```\n\nHere,\
    \ you are defining that the gender field should be a required string value equal\
    \ to M or F. Before validating the values, though, you are requesting that the\
    \ value be transformed into uppercase, which makes the lowercase values f and\
    \ m also valid.\nTo test this change you need restart your server and add the\
    \ gender field to the user creation form, as shown in Listing 25-12.\n\n# LISTING\
    \ 25-12: New version of the user creation form with the gender field in views/users/new.jade.\n\
    \n```\nh1 New User\n\nform(method=\"POST\", action=\"/users\")\n  p\n    label(for=\"\
    username\") Username<br />\n    input#username(name=\"username\")\n  p\n    label(for=\"\
    name\") Name<br />\n    input#name(name=\"name\")\n  p\n    label(for=\"email\"\
    ) Email<br />\n    input#email(name=\"email\")\n  p\n    label(for=\"password\"\
    ) Password<br />\n    input#password(type=\"password\", name=\"password\")\n \
    \ p\n```"
