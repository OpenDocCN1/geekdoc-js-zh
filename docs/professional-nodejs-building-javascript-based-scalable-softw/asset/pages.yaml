  md: "You now need to protect some of the user profile actions from other users.\
    \ For this you can create a new piece of middleware that checks whether the loaded\
    \ user is the same as the one logged in, as shown in Listing 21-20 in routes/middleware/restrict_user_to_self.js.\n\
    \nLISTING 21-20: New middleware to restrict user to the session user.\n\n```\n\
    function restrictUserToSelf(req, res, next) {\n  if (! req.session.user || req.session.user.username\
    \ !== req.user.username) {\n    res.send('Unauthorized', 401);\n  } else {\n \
    \   next();\n  }\n}\n\nmodule.exports = restrictUserToSelf;\n```\n\nNow you can\
    \ import this new piece of routing middleware at the top of the user routes:\n\
    \n```\nvar restrictUserToSelf = require('./middleware/restrict_user_to_self');\n\
    ```\n\nAnd use this middleware in the last listener in the user routes:\n\n```\n\
    app.del('/users/:name', loadUser, restrictUserToSelf, function(req, res, next)\
    \ {\n  delete users[req.user.username];\n  res.redirect('/users');\n});\n```\n\
    \nYou can then restart the server and ensure that, when you're logged in, you\
    \ cannot delete any profile other than your own.\n\n> **NOTE** This application\
    \ needs many improvements before it is safe. Improvements include sanitizing and\
    \ validating the user input, providing feedback messages when actions are performed,\
    \ and rendering more friendly messages when an error happens.\n\nYou should also\
    \ use a persistent database for storing user data, which is covered later in the\
    \ book.\n\n# SUMMARY\n\nExpress is one of the most popular web frameworks used\
    \ to build HTML-based websites. It builds up on the middleware functionality provided\
    \ by Connect and allows you to view rendering and routing on top of that."
