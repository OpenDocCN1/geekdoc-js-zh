    \ or mytwitterhandle and both will map to mytwitterhandle.\n\n# Using Getters\n\
    \nYou can also filter what is stored in the database after MongoDB hands it to\
    \ Mongoose, but before the object is available, by defining getters. Use a getter\
    \ to filter or transform the value any way you want by providing a custom function.\
    \ This can be useful, for instance, when you are performing data migrations.\n\
    \nSay you once allowed users to store Twitter handles that were prefixed by the\
    \ @ character. At a later point, you decided that you would use a setter to filter\
    \ them out. You have, in your user collection, some Twitter handles that are prefixed\
    \ with @ and others that are not. You could do a complete data migration, although\
    \ depending on your user collection size, that could take a long while and would\
    \ have an impact on service performance. You could also learn to live with this\
    \ inconsistency by changing the view code to allow both variations, but that would\
    \ place the data filtering code on the wrong part of the application.\n\nYou could\
    \ then define a filtering function like this at the top of the user schema module\
    \ in data/ schemas/user.js:\n\n```\nfunction filterTwitterHandle(handle) {\n \
    \ if (! handle) {\n    return;\n  }\n  handle = handle.trim();\n  if (handle.indexOf('@')\
    \ === 0) {\n    handle = handle.substring(1);\n  }\n  return handle;\n}\n```\n\
    \nThis function can now be used as both the setter and the getter of the twitter\
