- img_proc: true
  md: '# Resolving Paths


    You can resolve a series of paths into a normalized absolute path using path.resolve().
    It works like an iterative cd command for every argument, except that it also
    works on files and it''s abstract — it does not tap into the underlying filesystem
    to try to see if the path exists; it simply manipulates paths.


    For instance:


    ```

    var path = require(''path'');

    path.resolve(''/foo/bar'', ''./baz'');

    // => /foo/bar/baz

    path.resolve(''/foo/bar'', ''/tmp/file/'');

    // => /tmp/file

    ```


    If the resulting path is not absolute, path.resolve will prepend the current working
    directory to the path, as in this example:


    ```

    path.resolve(''/wwwroot'', ''static_files/png/'', ''../image.gif'');

    // if currently in /home/myself/node, it returns

    // => /home/myself/node/wwwroot/static_files/image.gif

    ```


    # Finding the Relative Path Between Two Absolute Paths


    By using path.relative(), you can also determine how to get from one absolute
    path to another absolute path. For example:


    ```

    var path = require(''path'');

    path.relative(''/data/orandea/test/aaa'', ''/data/orandea/impl/bbb'');

    // => ../impl/bbb

    ```


    # Extracting Components of a Path


    If you have a file path as /foo/bar/myfile.txt, you may need to retrieve the parent
    directory contents (the contents of /foo/bar) or read another file inside the
    same directory. For obtain the directory part of the file path use path.dirname(filePath).
    For example:


    ```

    var path = require(''path'');

    path.dirname(''/foo/bar/baz/asdf/quux.txt'');

    // => /foo/bar/baz/asdf

    ```


    In some cases, you might want to extract the filename from the file path, which
    is the last portion of a path. You can do this by using the path.basename function:


    ```

    var path = require(''path'');

    path.basename(''/foo/bar/baz/asdf/quux.html'');

    // => quux.html

    ```


    A file path can also include an extension, which is usually the string in the
    base name after and including the last .character.'
