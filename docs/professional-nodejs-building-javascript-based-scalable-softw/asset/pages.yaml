  md: "When a new connection arrives, the server emits the secureConnection event,\
    \ passing in the socket to the registered callback:\n\n```\nfunction connectionListener(stream)\
    \ {\n  console.log('got a new connection');\n}\n\nserver.on('secureConnection',\
    \ connectionListener);\n```\n\n# Reading Data from the Client\n\nWhen a client\
    \ connects, the server emits a secureConnection event, passing an instance of\
    \ the tls.CleartextStream class into the callback function. Much like the net.Socket\
    \ object, this object implements a duplex stream interface, which means you have\
    \ all the readable and writable stream methods and events available. You can simply\
    \ bind to the data event to get the decrypted data sent from the client like this:\n\
    \n```\nfunction secureConnectionListener(clientStream) {\n  clientStream.on('data',\
    \ function(data) {\n    console.log('got some data from the client:', data);\n\
    \  });\n}\\server.on('secureConnection', secureConnectionListener);\n```\n\n#\
    \ Sending Data to the Client\n\nYou can also use the CleartextStream object to\
    \ send data to a connected client like this:\n\n```\nserver.on('secureConnection',\
    \ function(clientStream) {\n  clientStream.write('Hey Hello!\\n');\n});\n```\n\
    \n# Ending the Connection\n\nYou may end a connection by simply calling .end()\
    \ on the client stream. For instance, if the client types \"quit\" you can end\
    \ the connection like this:\n\n```\nserver.on('secureConnection', function(clientStream)\
    \ {\n  clientStream.on('data', function(data) {\n    if (data.toString().trim().toLowerCase()\
    \ === 'quit') {\n      clientStream.end('Bye bye!');\n    }\n  });\n});\n```\n\
    \nAs in the TCP case, you can pass a string or a buffer into a buffer into the\
    \ clientStream.end function, which will be the last thing that is written out\
    \ to the client before the connection is closed."
