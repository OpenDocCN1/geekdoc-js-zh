  md: "It adds the remote address and the HTTP version.\n\nYou can also define your\
    \ own custom format by specifying a string containing any of the following\ntokens:\n\
    \n+   - :req [header] — You can specify any request header, as :req [Accept].\
    \ You can also\nout output as you want throughout the format string.\n- :http-version\
    \ — The HTTP version.\n- :response-time — The difference between the time the\
    \ request reaches the logger and the\nwhen the request is ended, in milliseconds.\n\
    - :remote-addr — The remote IP address of the client making the request.\n- :date\
    \ — The formatted date of when the log was created.\n- :method — The HTTP method\
    \ (GET, PUT, DELETE, HEAD, and so on).\n- :url — The requested URL.\n- :referrer\
    \ — The content of the referrer header.\n- :user-agent — The user agent string.\n\
    - :status — The numeric HTTP response status code.\n\nFor instance, if you want\
    \ to output only the method, URL, status code, and response time, you can\nuse\
    \ the following format:\n\n```\nvar format = ':method :url :status :response-time\
    \ ms';\napp.use(connect.logger(format));\n```\n\n# Handling Errors\n\nConnect\
    \ with a more elaborate error handler. One of its capabilities is using content\
    \ negotiation\nto understand what output is best. For instance, if the client\
    \ accepts the text/html content type,\napplication/json, it will output the error\
    \ as\na JSON-encoded object containing the error and stack properties. If any\
    \ of these content types is\nnot supported by the client, the error handler outputs\
    \ the error as plaintext.\n\nYou can use this error handler middleware by adding\
    \ it to the server, as shown in Listing 20-16.\n\nLISTING 20-16: Using the Connect\
    \ error handler.\n\n```\nvar connect = require('connect');\n\nvar app = connect();\n\
    \napp.use(function(req, res, next) {\n  next(new Error('Hey!'));\n});\n\n// actually\
    \ respond\n```"
