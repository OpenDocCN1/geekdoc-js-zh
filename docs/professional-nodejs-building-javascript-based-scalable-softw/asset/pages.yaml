- img_proc: true
  md: "# LISTING 21-8: User profile template.\n\n```\nh1= user.name\n\nh2 Bio\np=\
    \ user.bio\n\nform(action=\"/users/\" + encodeURIComponent(user.username), method=\"\
    POST\")\n  input(name=\"method\", type=\"hidden\", value=\"DELETE\")\n  input(type=\"\
    submit\", value=\"DELETE\")\n```\n\nIn the first section, you are showing the\
    \ username and bio. Then you are providing a simple form with a button to delete\
    \ the user from the database. You are also taking advantage of the method override\
    \ component to pass in a body parameter named _method containing the string \"\
    DELETE\". When this middleware sees this parameter, it will change the request\
    \ method from POST to DELETE, thereby activating this route listener:\n\n```\n\
    app.del('/users/:name', function(req, res, next) {\n  if (req.params.name) {\n\
    \    delete users[req.params.name];\n    res.redirect('/users');\n  } else {\n\
    \    next();\n  }\n});\n```\n\nThis listener will look up the user in the database,\
    \ and if the user exists, the listener will delete it from the database and redirect\
    \ the request to the users list.\n\nFrom the users list you can also create a\
    \ new user by clicking on the Create new profile link, which directs you to the\
    \ GET /users/new route listener:\n\n```\napp.get('/users/new', function(req, res)\
    \ {\n  res.render('users/new', {title: \"New User\"});\n});\n```\n\nThis listener\
    \ simply renders the views/users/new.jade template, which you need to create,\
