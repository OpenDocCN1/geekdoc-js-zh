  md: "expires. The Cookie header has its own encoding mechanism because many name-value\
    \ pairs can be encoded there. Setting a cookie with a name of a cookie that is\
    \ already stored on the browser overrides the original cookie.\n\nConnect comes\
    \ with a cookie middleware that takes care of parsing the request cookies, setting\
    \ the cookies property on the request object. You can use it as shown in Listing\
    \ 20-20.\n\nLISTING 20-20: Using the Connect body parser middleware.\n\n```\n\
    var connect = require('connect');\n\nvar app = connect();\n\n// setup middleware\n\
    app.use(connect.cookieParser());\n\n// actually respond\napp.use(function(req,\
    \ res) {\n  res.end(JSON.stringify(req.cookies));\n});\n\napp.listen(8080);\n\
    ```\n\nHere you are replying with the content of req.cookies, which should contain\
    \ an object with a property for each cookie that the client sends. To test this\
    \ save the previous listing into a file named cookie.js and start it:\n\n```\n\
    $ node cookie\n```\n\nYou can test this server with the curl command-line utility,\
    \ using the -b option, which sets the content on a cookie header:\n\n```\n$ curl\
    \ -b 'a=b; c=d' http://localhost:8080\n{\"a\":\"b\",\"c\":\"d\"}\n```\n\nHere\
    \ you can see that the cookies were correctly parsed into the req.cookie object.\n\
    \n# Using a Session\n\nConnect has a middleware component that allows you to keep\
    \ a session on the server side, allowing you to save session values that can be\
    \ used on future requests. When the client first connects, a session identifier\
    \ is created, and Connect sends a browser cookie containing it to associate that\
    \ browser with the created session. In future requests, the browser sends that\
    \ cookie, which allows the server to identify the session and retrieve the stored\
    \ session objects to be further used and modified.\n\nOn the server side, a session\
    \ is an object that allows you to store name-value pairs. By default, Connect\
    \ stores the session in memory but has a pluggable interface that allows you to\
    \ define a different store. Several third-party session stores allow you to use\
    \ Memcache, Redis, and other database servers as a session store for Connect."
