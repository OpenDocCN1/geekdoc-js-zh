  md: "```\nLISTING 25-22: A middleware component for loading an article in routes/middleware/load_article.js.\n\
    \nvar Article = require('../../data/models/article');\n\nfunction loadArticle(req,\
    \ res, next) {\n  Article.findOne({title: req.params.title})\n    .populate('author')\n\
    \    .exec(function(err, article) {\n      if (err) {\n        return next(err);\n\
    \      }\n      if (! article) {\n        return res.send('Not found', 404);\n\
    \      }\n      req.article = article;\n      next();\n    });\n}\n\nmodule.exports\
    \ = loadArticle;\n```\n\nThis new route middleware component is similar to the\
    \ load_user.js one, except that it instructs Mongoose to load the author using\
    \ the following:\n\n```\nArticle.findOne({title: req.params.title})\n  .populate('author')\n\
    \  //...\n```\n\nThis makes the corresponding user object available under the\
    \ property article.author, which you can now use on the article-rendering template\
    \ under views/articles/article.jade, as shown in Listing 25-23.\n\n```\nLISTING\
    \ 25-23: The article detail view template in views/articles/article.jade.\n\n\
    h1= article.title\n\ndiv!= article.body\n\nhr\n\np\n  span Author:\n  &nbsp;\n\
    \  a(href=\"/users/\" + encodeURIComponent(article.author.username))=\n    article.author.full_name\n\
    \np\n  a(href=\"/articles\") Back to all articles\n```\n\nYou also need to add\
    \ the loggedIn middleware component under routes/middleware/logged_in.js, as shown\
    \ in Listing 25-24."
  merge: -1
  pgno: 378
- img_proc: true
  md: "# LISTING 25-24: The article detail view template in views/articles/article.jade.\n\
    \n```\nfunction loggedIn(req, res, next) {\n  if (! req.session.user) {\n    res.send('Forbidden.\
    \ Please log in first.', 403);\n  } else {\n    next();\n  }\n}\n\nmodule.exports\
    \ = loggedIn;\n```\n\nFor this to work you still need to add the new route listeners\
    \ to the file app.js, as follows:\n\n```\n// Routes\n\nrequire('./routes/session')(app);\n\
    require('./routes/index')(app);\nrequire('./routes/users')(app);\nrequire('./routes/articles')(app);\n\
    ```\n\nYou need two new view templates as well:\n\n+   - views/articles/index.jade\
    \ contains the article list.\n- views/articles/new.jade contains the article creation\
    \ form.\n\nSee Listings 25-25 and 25-26.\n\n# LISTING 25-25: The article list\
    \ template in views/articles/index.jade.\n\n```\nh1 Articles\n\np\n  a(href=\"\
    /articles/new\") Create new article\n\nul\n  - articles.forEach(function(article)\
    \ {\n    li\n      a(href=\"/articles/\" + encodeURIComponent(article.title))=\
    \ article.title\n  - });\n\n- if (page > 0) {\n  a(href=\"?page=\" + (page - 1))\
    \ Previous\n  &nbsp;\n- }\n\n- if (! lastPage) {\n  a(href=\"?page=\" + (page\
    \ + 1)) Next\n- }\n```"
