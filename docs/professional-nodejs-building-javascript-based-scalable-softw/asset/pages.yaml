  md: "# ESCAPING THE EVENT LOOP\n\nBy using process.nextTick, you can defer the execution\
    \ of a non-crucial task to the next tick, freeing the event loop to execute other\
    \ pending events.\n\nAs an example, if you need to remove a temporary file you\
    \ created, but perhaps you don't need to do it before replying to the client,\
    \ you can do it like this:\n\n```\nstream.on(\"data\", function(data) {\n  stream.end(\"\
    my response\");\n  process.nextTick(function() {\n    fs.unlink(\"/path/to/file\"\
    );\n  });\n});\n```\n\n# USING SETTIMEOUT INSTEAD OF SETINTERVALnTO FORCE SERIALIZATION\n\
    \nLet's say you want a function that does some I/O — such as parsing a log file\
    \ — that will periodically be executed. Let's give that function the generic name\
    \ my_async_function. You could start by using setInterval like this:\n\n```\n\
    var interval = 1000;\nsetInterval(function() {\n  my_async_function(function()\
    \ {\n    console.log('my_async_function finished!');\n  });\n});\n```\n\nHowever,\
    \ you must ensure that none of these functions execute at the same time. You really\
    \ can't guarantee that you are using setInterval. If my_async_function takes one\
    \ millisecond longer than the interval you are, they would run at the same time.\n\
    \nYou need to enforce the interval between the end of one my_async_function and\
    \ the start of the next desired interval. Here is how you can do this:\n\n```\n\
    var interval = 1000; // 1 second\n\nfunction schedule() {\n  setTimeout(function\
    \ do_it() {\n    my_async_function(function() {\n      console.log('async is done!');\n\
    \      schedule();\n    }), interval);\n  }\nschedule();\n```\n\nHere you are\
    \ declaring a function named schedule (line 3) and invoking it immediately after\
    \ it is declared (line 10). This schedule function schedules the do_it function\
    \ to be executed in one second (the chosen interval). After one second passes,\
    \ this anonymous function fires, calling"
