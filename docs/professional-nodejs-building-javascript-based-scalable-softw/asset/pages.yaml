  md: "# CREATING AND USING COUCHDB VIEWS\n\nNow that you have every message persisted,\
    \ it would be nice if the users received the most recent messages every time they\
    \ connect or join a room. CouchDB is just a simple key-value store. Given the\
    \ correct ID, you could retrieve one single document by using the following:\n\
    \n```\n```javascript\nchatDB.get(messageID, function(err, doc) {\n  console.log('got\
    \ document!', doc);\n});\n```\n```\n\nBut that is of no use. You need to retrieve,\
    \ say, the latest 10 messages for a given chat room, and for that you have to\
    \ create a more complex query.\n\nThe way to create more complex queries is by\
    \ creating indexes using map-reduce functions, which are JavaScript functions\
    \ that reside in the CouchDB server. To create a mapping function, you need to\
    \ think about which keys you'll be mapping each document to so that CouchDB can\
    \ serve your queries. In this case, you want to index messages by room, so a mapping\
    \ function like the following one works well:\n\n```\n```javascript\nfunction(doc)\
    \ {\n  emit([doc.room, doc.when], doc);\n}\n```\n```\n\nThis mapping function\
    \ will be invoked every time there is a new document or a document is changed,\
    \ and every time it will emit the document indexed by a key containing the room\
    \ identifier and the timestamp. This will allow CouchDB to order the index by\
    \ room and creation time, allowing you not only to get all the messages pertaining\
    \ to a certain room but also, in conjunction, to retrieve the messages created\
    \ between two given dates.\n\nNow you can wrap the server initialization to a\
    \ function named `startServer`. This function will be called once the database\
    \ initialization operations are finished. Then you can add some initialization\
    \ code after you are sure that the `chat` database is created.\n\nNow you need\
    \ to insert this mapping function in a design document so that CouchDB creates\
    \ the corresponding view.\n\n```\n```javascript\ncouchdb.db.create('chat', function(err)\
    \ {\n  if (err && err.status_code !== 412) {\n    throw err;\n  }\n\n  var designDoc\
    \ = {\n    language: \"javascript\",\n    views: {\n      by_room: {\n       \
    \ map: couchMapReduce.toString()\n      }\n    }\n  };\n\n  var chatDB = couchdb.use('chat');\n\
    ```\n```"
  merge: -1
  pgno: 319
- img_proc: true
  md: "```\n```javascript\n(function insertOrUpdateDesignDoc() {\n    chatDB.insert(designDoc,\
    \ '_design/designdoc', function(err) {\n        if (err) {\n            if (err.status_code\
    \ === 409) {\n                chatDB.get('_design/designdoc', function(err, ddoc)\
    \ {\n                    if (err) { return console.error(err); }\n           \
    \         designDoc._rev = ddoc._rev;\n                    insertOrUpdateDesignDoc();\n\
    \                });\n            } else {\n                return console.error(err);\n\
    \            }\n        }\n        startServer();\n    });\n})();\n```\n```\n\n\
    Here you are building a design document. A design document is a special document\
    \ type in CouchDB where you define, among other things, the views. Each view is\
    \ composed of a mapping function (and an optional reducing function, which you\
    \ don't need here). You then insert this design document into the `_design/designdoc`\
    \ path. The path called `_design` is, in CouchDB, where all the design documents\
    \ of a certain database go to live. The design document created here is simply\
    \ called `designdoc`.\n\nBeware that the insertion of the design document can\
    \ fail, especially when a design document is already in CouchDB, in which case\
    \ the error will indicate a `409 Conflict` HTTP response status code. In that\
    \ case you need to update the design document revision so that there is no versioning\
    \ conflict and try again.\n\n> **NOTE** Even though this book does not aim to\
    \ teach you CouchDB inside and out, you need to understand some basic principles.\
    \ One of them is the way CouchDB uses versioning.\n\nIn CouchDB each document\
    \ has a version number. To update a certain document, you need to pass in the\
    \ latest version number. If you don't, CouchDB will return a `409 Conflict` HTTP\
    \ response status code. This prevents two clients from updating the same document\
    \ twice without each one knowing about the other.\n\nFor instance, say that clients\
    \ A and B have version 1 of document D. Clients A and B modify the document and\
    \ order an update at the same time. Document D will have a `_rev` property with\
    \ something like `1-76e555f270676c9f20a73726875c50b8`.\n\nThe server processes\
    \ A's request first and creates the second revision of the document, let's say\
    \ `2-676c7f20a73726875c50b876e555f270`. When the edits from client B try to update\
    \ document D, those edits still refer to version 1 (plus a checksum number). The\
    \ database now has a revision number 2 for document D, so client B's update will\
    \ be rejected with a `409 Conflict` status code."
