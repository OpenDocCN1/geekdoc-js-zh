- img_proc: true
  md: "```\n// ...\nemail: {\n    type: String,\n    sparse: true,\n    unique: true,\n\
    \    match: emailRegexp\n},\n// ...\n```\n\nYou can also define an index that\
    \ combines the values of two or more fields at the schema level, by inserting\
    \ it at the end of the file `data/users/schema.js`, before the module exports:\n\
    \n```\nUserSchema.index({username: 1, 'meta.created_at': -1});\n```\n\nThis creates\
    \ an index that combines the values of `username` and `meta.created_at`, where\
    \ the `username` is indexed in ascending order and the `meta.created_at` values\
    \ are indexed in descending order. This index is useful for speeding up a query\
    \ that uses these fields for filtering or sorting.\n\n> NOTE *If you now try to\
    \ restart your app, you may encounter the following problem:*\n\nMongoError: E11000\
    \ duplicate key error index: my_mongoose.users.$email_1  dup key: { : \"myemail@mail.com\"\
    \ }\n\n*This will happen if you have more than one user with the same e-mail address\
    \ in the database. To properly start the app, you have to change these duplicate\
    \ records.*\n\n# Referencing Other Documents Using DB Refs\n\nIn Mongoose, a document\
    \ can also contain a reference to another document. For instance, you may want\
    \ to have an article collection that contains, among other fields, an author.\
    \ This author can be a user. Instead of keeping the username, you can define that\
    \ a field contains an object ID. Define the following schema under `data/schemas/article.js`,\
    \ as shown in Listing 25-19.\n\n```\nvar Schema = require('mongoose').Schema;\n\
    \nvar ArticleSchema = new Schema({\n    title: {\n        type: String,\n    \
    \    unique: true\n    },\n    body: String,\n```"
