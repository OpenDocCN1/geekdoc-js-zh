  md: "For this, simply emit an HTTP request to the Twitter user page and then observe\
    \ the response HTTP status. If the response status is a 404 Not Found, you can\
    \ conclude that the Twitter handle is invalid.\n\nTo simplify the way you do HTTP,\
    \ use Mikeal Rogers's `request` third-party module (covered in Chapter 13, “Making\
    \ HTTP Requests”), which you must include in the `package.json` manifest (see\
    \ Listing 25-14).\n\n**LISTING 25-14:** A new version of the `package.json` manifest\
    \ containing the `request` dependency.\n\n```\n{\n    \"name\": \"application-name\"\
    ,\n    \"version\": \"0.0.1\",\n    \"private\": true,\n    \"dependencies\":\
    \ {\n        \"express\": \"2.5.11\",\n        \">= 0.0.1\",\n        \"mongoose\"\
    : \">=2.7.0\",\n        \"async\": \"0.1.22\",\n        \"request\": \"2.10.0\"\
    \n    }\n}\n```\n\nInstall the missing package:\n\n```\n$ npm install\n...\nrequest@2.10.0\
    \ ./node_modules/request\n```\n\nImport the module at the top of the user schema\
    \ file in `data/schemas/user.js`:\n\n```\nvar request = require('request');\n\
    ```\n\nAnd then, in the same file, define the validation function that takes a\
    \ value and a callback and then calls back with a boolean when a response from\
    \ Twitter arrives:\n\n```\nfunction twitterHandleExists(handle, done) {\n    request('http://twitter.com/'\
    \ + encodeURIComponent(handle), function(err, res) {\n        if (err) {\n   \
    \         console.error(err);\n            return done(false);\n        }\n  \
    \      if (res.statusCode > 299) {\n            done(false);\n        } else {\n\
    \            done(true);\n        }\n    });\n}\n```"
