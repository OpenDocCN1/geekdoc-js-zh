    On line 1 you obtain the http module, from which you can create a server object
    by calling http.createServer() (line 3).


    You then listen for request events, which happen when a new client connects. The
    event callback provides you with two arguments: the request and the response objects.
    You can then use the request object to learn details about this request and use
    the response object to write back to the client.


    On line 6 you write a header (''ContentType'': ''text/plain'') and the HTTP status
    200, which is a code that indicates the request succeeded.


    On line 7 you reply with the string "Hello World", and on line 8 you terminate
    the request.

    On line 11 you bind the server to the TCP port 4000.


    You can save this script into a named server.js and start it like this:


    ```

    $ node server.js

    ```


    Then you can point your browser to http://localhost:4000, and you should see the
    "Hello World!" string on it.


    This example can be shortened, as seen in Listing 11-2.


    # LISTING 11-2: A shortened "Hello World!" HTTP server.


    ```

    require(''http'').createServer(function(req, res) {

    res.writeHead(200, {''ContentType'': ''text/plain''});

    res.end(''Hello World!'');

    }).listen(4000);

    ```


    Here we are giving up the intermediary variables for storing the http module (because
    you need to call it only once) and the server (because you only need to make it
    listen on port 4000). Also, as a shortcut, the http.createServer() function accepts
    a callback function that will be invoked on every request.


    Here is one last shortcut: the response.end() function can accept a string or
    buffer, which will write to the response before ending the request.


    When a client makes a request, the HTTP server emits a request event, passing
    in HTTP request and response objects. The HTTP request object allows you to query
    some of the request properties, and the HTTP response allows you to build an HTTP
    response that will be sent to the client. In the next sections, you will learn
    about these objects and how you can use them to accomplish these tasks.'
