- img_proc: true
  md: "Now you can complete the user route listeners, as shown in Listing 21-6.\n\n\
    # LISTING 21-6: Completed user route listeners.\n\n```\n/*\n * User Routes\n */\n\
    var users = require('../data/users');\n\nmodule.exports = function(app) {\n  app.get('/users',\
    \ function(req, res) {\n    res.render('/users/index', { title: 'Users', users:\
    \ users });\n  });\n\n  app.get('/users/new', function(req, res) {\n    res.render('/users/new',\
    \ { title: \"New User\" });\n  });\n\n  app.get('/users/:name', function(req,\
    \ res, next) {\n    var user = users[req.params.name];\n    if (user) {\n    \
    \  res.render('/users/profile', { title: 'User profile', user: user });\n    }\
    \ else {\n      next();\n    }\n  });\n\n  app.post('/users', function(req, res)\
    \ {\n    if (users[req.body.username]) {\n      res.send('Conflict', 409);\n \
    \   } else {\n      users[req.body.username] = req.body;\n      res.redirect('/users');\n\
    \    }\n  });\n\n  app.del('/users/:name', function(req, res, next) {\n    if\
    \ (users[req.params.name]) {\n      delete users[req.params.name];\n      res.redirect('/users');\n\
    \    } else {\n      next();\n    }\n  });\n};\n\n```\n\nThis code implements\
    \ all the basic functions of listing, showing, creating, and removing users. Let's\
    \ go through each block of code, one at a time."
