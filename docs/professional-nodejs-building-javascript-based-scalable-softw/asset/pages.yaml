  md: "Keep in mind that the environment variables are passed between processes using\
    \ the operating system, and thus all the values arrive at the child process as\
    \ strings. For instance, if the parent process passes the number 123 as an environment\
    \ variable, the child process will receive it as the string 123.\n\nAs an example\
    \ you'll set up two Node scripts in the same folder. One can name parent.js and\
    \ the other child.js. The first one will launch the second one, so you need the\
    \ two scripts in place for this work.\n\nListing 8-3 shows a quick example of\
    \ when this happens.\n\nLISTING 8-3: Parent process setting environment variable.\
    \ (chapter8/03_environment_number.js)\n\n```\nvar exec = require('child_process').exec;\n\
    exec('node child.js', {env: 123}, function(err, stdout, stderr) {\n  if (err)\
    \ { throw err; }\n  console.log('stdout:\\n', stdout);\n  console.log('stderr:\\\
    n', stderr);\n});\n```\n\nSave this file as parent.js. Next is the source code\
    \ for the child process, which you should place inside a file named child.js (see\
    \ Listing 8-4).\n\nLISTING 8-4: Child process parsing environment variable. (chapter8/04_environment_number_child.js)\n\
    \n```\nvar number = process.env.number;\nconsole.log(typeof(number)); // \\> \"\
    string\"\nnumber = parseInt(number, 10);\nconsole.log(typeof(number)); // \\>\
    \ \"number\"\n```\n\nAfter you have saved this into a file named child.js, you\
    \ can launch it by using the command line when inside the folder with the source\
    \ code:\n\n```\n$ parent.js\n```\n\nIt should output the following:\n\n```\nstdout:\n\
    string\nnumber\nstderr:\n```\n\nHere you can see that, in spite of the parent\
    \ process passing a number into the name environment variable, the child process\
    \ receives it as a string (as you can see in line 2 of the output). In line 3\
    \ you parse the string into a number."
