  md: "# UNDERSTANDING THE USES OF UDP\n\nTime-sensitive applications often use UDP\
    \ because dropping packets is preferable to waiting for delayed ones, which may\
    \ not be an option in a real-time system.\n\nUDP's stateless nature is also useful\
    \ for servers answering small queries from large numbers of clients. Unlike TCP,\
    \ UDP supports packet broadcast (sending to all on local network) and multicasting\
    \ (sending to all subscribers).\n\nCommon network applications that use UDP include\
    \ DNS (Domain Name System), streaming media applications as IPTV (Internet Protocol\
    \ Television), VoIP (Voice over IP), IP tunneling, TFTP (Trivial File Transfer\
    \ Protocol), Simple Network Management Protocol (SNMP), Dynamic Host Configuration\
    \ Protocol (DHCP), and others. Other common applications include message logging\
    \ when strong reliability is not a requirement and clearing a distributed cache.\n\
    \n# BUILDING A DATAGRAM SERVER\n\nDatagram support in Node lies inside the dgram\
    \ module. So first you have to import it:\n\n```\nvar dgram = require('dgram');\n\
    ```\n\nThen you have to create the server:\n\n```\nvar server = dgram.createSocket('udp4');\n\
    ```\n\nThe dgram.createSocket function accepts the socket type as the first argument,\
    \ which can be either udp4 (UDP over IPv4) or udp6 (UDP over IPv6). In this example,\
    \ you are sticking to IPv4.\n\n> Also note that there is no actual server in UDP;\
    \ it's just a peer listening for messages on a socket. A server generally provides\
    \ some kind of feedback about receipt of a message. Later in this chapter you\
    \ will see how you can reply to a UDP message. For simplicity and disambiguation\
    \ I will keep calling this piece of software you are building a \"server.\"\n\n\
    # Listening for Messages\n\nA UDP server will emit a message event when a new\
    \ message is coming in, so you have to register a callback function for that event:\n\
    \n```\nserver.on('message', function(message) {\n  console.log('server got message:\
    \ ' + message);\n});\n```"
