  md: "# BUILDING A DATAGRAM CLIENT\n\nDepending on your application, you may just\
    \ want to send one or more UDP messages and not care about listening to a response\
    \ or any other UDP messages. In this case you would create a send-only UDP client.\n\
    \n# Creating the Client\n\nTo create a UDP client to send UDP packets, you can\
    \ simply create a UDP socket and send messages from it like this:\n\n```\nvar\
    \ dgram = require('dgram');\nvar client = dgram.createSocket('udp4');\n```\n\n\
    Here you are creating a client using the same dgram.createSocket function that\
    \ was also used on the server, except that you don't bind. Because you are not\
    \ binding to a specific port, the message is sent from a random UDP port. If you\
    \ wanted to send from a specific port, you could have used client.bind(port).\n\
    \n# Sending Messages\n\nNext you can create a buffer containing your message and\
    \ send it to the server through the client socket.\n\n```\nvar message = new Buffer('this\
    \ is a message');\nclient.send(message, 0, message.length, 4000, 'localhost');\n\
    ```\n\n# Closing the Socket\n\nWhen you no longer need to send messages, you can\
    \ close the datagram socket, which in this case happens when the message is flushed\
    \ into the network. Fortunately the client.send function accepts a callback for\
    \ when that happens, which you can use in this case:\n\n```\nclient.send(message,\n\
    \    0,\n    message.length,\n    4000,\n    'localhost',\n    function(err, bytes)\
    \ {\n        if (err) { throw err; }\n        client.close();\n    }\n);\n```\n\
    \nAs you can see, the callback function you pass into client.send gets called\
    \ with two arguments: an error if one occurs and the number of bytes that were\
    \ sent."
