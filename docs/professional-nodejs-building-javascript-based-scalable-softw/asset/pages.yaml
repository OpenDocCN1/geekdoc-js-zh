  md: '# Sending Multicast Messages


    To send a multicast message, you simply have to specify the multicast address
    like this:


    ```

    var dgram = require(''dgram'');

    var client = dgram.createSocket(''udp4'');


    var message = new Buffer(''this is a multicast message'');


    client.bind(4000);

    client.setMulticastTTL(10);

    client.send(message, 0, message.length, 4000, ''230.1.2.3''); client.close();

    ```


    Recall that you previously set the multicast time-to-live (TTL) to 10, an arbitrary
    value. This TTL tells the network how many hops (routers) the datagram can travel
    through before it is discarded. Every time a UDP packet travels through a hop,
    the TTL counter is decremented, and if 0 is reached, the packet is discarded.


    # Understanding Maximum Datagram Size


    UDP is lightweight and can be a great solution if your application can tolerate
    some data loss and disordering, but you should be aware of some additional limitations.


    The maximum datagram size depends on the network it travels through. The UDP header
    allows up to 65,535 bytes of data, but if your packets cross an Ethernet network,
    for instance, the Ethernet MTU (Maximum Transmission Unit) is 1,500 bytes, limiting
    the maximum datagram size to that number as well. Also, some routers will attempt
    to fragment large UDP packets into 512 byte chunks, so you should really limit
    yourself to that maximum size if you want to avoid fragmenting your datagram.


    # SUMMARY


    UDP is a lightweight transport protocol that can serve you well if you can relax
    some reliability constraints. It''s not connection-oriented, so it involves less
    overhead than TCP and can multicast and broadcast messages with just one network
    packet.


    If you want to send or receive UDP messages, you must first create a socket into
    which you can send messages to other UDP peers. If you need to listen to incoming
    messages, you have to bind your socket to a UDP port, and then wait for message
    events.


    Also, you can listen to multicast messages by attaching a multicast address membership
    to that socket.'
