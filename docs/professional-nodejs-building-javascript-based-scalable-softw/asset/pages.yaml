    \ of callback, as in Listing 8-10.\n\n# LISTING 8-10: Getting the child process\
    \ exit signal. (chapter8/11_child_exit_signal.js)\n\n```\nvar spawn = require('child_process').spawn;\n\
    \n// Spawn the child with a \"sleep 10\" command\nvar child = spawn('sleep', ['10']);\n\
    \nsetTimeout(function() {\n  child.kill();\n}, 1000);\n\nchild.on('exit', function(code,\
    \ signal) {\n  if (code) {\n    console.log('child process terminated with code\
    \ ' + code);\n  } else if (signal) {\n    console.log('child process terminated\
    \ because of signal ' + signal);\n  }\n});\",\n```\n\nHere you are launching a\
    \ child that will execute a sleep command for 10 seconds, but before those 10\
    \ seconds elapse, you are sending it a SIGKILL signal, which makes it print the\
    \ following:\n\nchild process terminated because of signal SIGTERM\n\n# SIGNALING\
    \ AND KILLING PROCESSES\n\nIn this section you will learn how you can control\
    \ your child process using signals. Signals are a simple way for the parent process\
    \ to communicate with the child process, or even to kill the child process.\n\n\
    Different signal codes have different meanings, and there are many of them. The\
    \ most common ones are for killing processes. If a process receives a signal that\
    \ it doesn't know how to handle, it will"
