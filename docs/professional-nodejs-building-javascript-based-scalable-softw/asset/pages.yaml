    \ and authenticate the client connection.\n\n# CREATING AN HTTPS CLIENT\n\nIn\
    \ Node, making an HTTPS request is very similar to making an HTTP one. In fact,\
    \ it can be exactly the same because you don't need to pass in the client private\
    \ key or client certificate unless the server requires it.\n\n# Initializing the\
    \ Client\n\nYou can make an HTTPS request to an HTTPS server like this:\n\n```\n\
    var fs = require('fs');\nvar https = require('https');\n\nvar options = {\n  host:\
    \ '0.0.0.0',\n  port: 4001,\n  method: 'GET',\n  path: '/'\n};\n```\n\nMuch like\
    \ the HTTP counterpart, you need to construct an object containing the options\
    \ for your request. This should include values for host, port, and path. You can\
    \ also specify the method if you want to make a request using a method other than\
    \ GET.\n\n# Making the Request\n\nYou have to pass these last options that specify\
    \ host, port, method, and path to the request function in the https module, which\
    \ accepts the options object and a function callback and returns an http.ClientRequest\
    \ instance.\n\n```\nvar request = https.request(options, function (response) {\n\
    \  console.log('status code:', response.statusCode);\n\n  response.on('data',\
    \ function (data) {\n    console.log('get some data back from the server:', data);\n\
    \  });\n});\n\nrequest.write('Hey!\\n');\nrequest.end();\n```\n\nThis client request\
    \ is a writable stream to which you can write, or into which you can pipe a readable\
    \ stream. You should then end the request so that the server can respond."
