  md: '# Summary


    When you''re working with files, most of the time you have to manipulate and extract
    parts of the file paths. By using the path module you can join paths, normalize
    them, calculate differences between them, and resolve relative paths into absolute
    ones. You can also extract path components like the file extension, the base name,
    the extension, and the directory path of any given file path.


    Node provides a low-level API to the filesystem in the fs module. Low-level filesystems
    use file descriptors to handle their files. You can use fs.open to open a file,
    fs.write to write to it, fs.read to read from it, and fs.close to close it.


    In error situations, you should always close your files by handling errors correctly
    — be sure to close all the file descriptors before calling back.'
