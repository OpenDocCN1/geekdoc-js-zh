  md: "Now you need to change the `views/users/profile.jade` template and add this\
    \ snippet right at the end:\n\n```\nh2 Recent Articles:\np!= partial('articles/list',\
    \ {articles: recentArticles })\n```\n\nThis makes use of the `views/articles/list.jade`\
    \ partial template that you need to create, as shown in Listing 25-27.\n\n**LISTING\
    \ 25-27:** The article list partial template.\n\n```\nul\n  - articles.forEach(function(article)\
    \ {\n      li\n        a(href=\"/articles/\" + encodeURIComponent(article.title))=\
    \ article.title\n  - });\n```\n\nBecause you already have this partial template\
    \ for listing, you can replace the explicit listing in the `views/articles/index.jade`\
    \ template with a call to this partial, as shown in Listing 25-28.\n\n**LISTING\
    \ 25-28:** A new version of the article list template that uses the article list\
    \ partial.\n\n```\nh1 Articles\n\np\n  a(href=\"/articles/new\") Create new article\n\
    \np!= partial('articles/list', {articles: articles})\n\n- if (page > 0) {\n  \
    \  a(href=\"?page=\" + (page - 1)) Previous\n    &nbsp;\n  }\n\n- if (! lastPage)\
    \ {\n    a(href=\"?page=\" + (page + 1)) Next\n  }\n```\n\nNow is a good time\
    \ to test the article creation and rendering by restarting your app and pointing\
    \ your browser to http://localhost:3000/articles. Try logging in, creating articles,\
    \ and browsing around.\n\n# Defining Static Methods\n\nYou can also expose methods\
    \ on the model that provide higher-level operations or queries. For instance,\
    \ you may want to provide a search function that returns articles with that string\
    \ on the title or on the body. You can define it at the end of the article schema\
    \ module in `data/schemas/article.js`, before the module exports:"
  merge: -1
