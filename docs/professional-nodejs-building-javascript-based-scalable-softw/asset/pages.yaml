  md: '# INSTALLING NODE USING THE SOURCE CODE


    If you have a UNIX system, you can install Node by compiling the source code.
    First you need to select which version of Node you will be installing, then you
    will download the source code and build, install, and run Node.


    > **NOTE** Node depends on several third-party code libraries, but fortunately
    most of them are already distributed along with the program. If you are building
    from source code, you should need only two things:


    * python (version 2.4 or higher) — The build tools distributed with Node run on
    python.

    * libssl-dev — If you plan to use SSL/TLS encryption in your networking, you''ll
    need this. libssl is the library used in the openssl tool. On Linux and UNIX systems
    it can usually be installed with your favorite package manager. The libssl library
    comes pre-installed on Mac OS X.


    # Choosing the Node Version


    Two versions of Node are usually available for download on the nodejs.org website:
    the latest and the latest unstable.


    In Node, the minor version numbering denotes the stability of the version. Stable
    versions have an even minor version (0.2, 0.4, 0.6), and unstable versions have
    an odd minor version (0.1, 0.3, 0.5, 0.7).


    Not only might an unstable version be functionally unstable, but the API might
    also be mutating. The stable versions should not change the public API. For each
    stable branch, a new patch should include only bug fixes, whereas APIs sometimes
    change in the unstable branch.


    Unless you want to test a new feature that is only available in the latest unstable
    release, should always choose the latest stable version. The unstable versions
    are a battleground for the Node Core Team to test new developments in the platform.


    More and more projects and projects successfully use Node in production (some
    of the most relevant are on the nodejs.org home page), but you might have to put
    some effort into keeping up with the API changes on each new minor stable release.
    That''s the price of using new technology.


    # Downloading the Node Source Code


    After you choose a version to download, copy the source code tarball URL from
    the http://nodejs.org website and download it. If you''re running in a UNIX system,
    you probably have wget installed, which means you can download it by using a shell
    prompt and typing the following:


    ```

    $ wget http://nodejs.org/dist/v0.6.1/node-v0.6.12.tar.gz

    ```'
