  md: "The user interface list needs to be paginated, which means you present slices\
    \ of the list of users. You can use the skip and limit options to retrieve only\
    \ one page worth of data:\n\n```\napp.get('/users', function(req, res, next) {\n\
    \  var page = req.query.page && parseInt(req.query.page, 10) || 0;\n  User.find({})\n\
    \    .sort('name', 1)\n    .skip(page * maxUsersPerPage)\n    .limit(maxUsersPerPage)\n\
    \    .exec(function(err, users) {\n      if (err) {\n        return next(err);\n\
    \      }\n      res.render('users/index', {title: 'Users', users: users, page:\
    \ page});\n    });\n});\n```\n\nHere you are retrieving the current page from\
    \ the query string in the request URL. If there is no such element in the query\
    \ string, you use the default value of 0. Then you tell MongoDB to skip the first\
    \ x elements — x being the number of users on the previous pages — and to limit\
    \ the results to the maximum number of elements in the page you want.\n\n> NOTE\
    \ For this code to work, you need to define the maxElementsPerPage configuration\
    \ variable in the module scope with a value that suits your needs:\n\nvar maxUsersPerPage\
    \ = 5;\n\nThen you need to pass the current page to the rendering template so\
    \ that the UI knows which page the user is at so it can craft the \"previous\"\
    \ and \"next\" page links. Now you need to change the views/users/index.jade template\
    \ to accommodate the paging, as shown in Listing 25-6.\n\nLISTING 25-6: Users\
    \ list with paging in views/users/index.jade.\n\n```\nh1 Users\n\np\n  a(href=\"\
    /users/new\") Create new profile\n\nul\n  - for(var username in users) {\n   \
    \ li\n      a(href=\"/users/\" + encodeURIComponent(username)) = users[username].name\n\
    \  - };\n\n- if (page > 0) {\n  a(href=\"?page=\" + (page - 1)) Previous\n  &nbsp;\n\
    - }\n\na(href=\"?page=\" + (page + 1)) Next\n```"
