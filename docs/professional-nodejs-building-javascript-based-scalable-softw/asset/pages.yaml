  md: "If you want to turn this off and force data to be sent immediately after each\
    \ write command,\nuse this:\n\n```\nsocket.setNoDelay(true);\n```\n\nOf course,\
    \ you can always revert this setting like this:\n\n```\nsocket.setNoDelay(false);\n\
    ```\n\n# Listening for Client Connections\n\nAs you saw, the server is created,\
    \ you can bind it to a specific TCP port like this:\n\n```\nvar port = 4001;\n\
    var host = '0.0.0.0',\nserver.listen(port, host);\n```\n\nThe second argument\
    \ (host) is optional. If it's omitted, the server will accept connections directed\
    \ to any IP address: \n\n```\nserver.listen(port);\n```\n\n# Closing the Server\n\
    \nThis method closes the server, preventing it from accepting new connections.\
    \ This function is asynchronous, and the server will emit the close event when\
    \ it closes:\n\n```\nvar server = ...\nserver.close();\nserver.on('close', function()\
    \ {\n  console.log('server closed!');\n});\n```\n\n# Handling Errors\n\nWhen handling\
    \ a socket on the client or the server you can (and should) handle errors by listening\
    \ to the error event like this:\n\n```\nrequire('net').createServer(function(socket)\
    \ {\n  socket.on('error', function(error) {\n    // do something\n  });\n});\n\
    ```\n\nIf you fail to catch an error, Node will handle an uncaught exception and\
    \ terminate the current process."
