  md: '# 25


    # Connecting to MongoDB

    Using Mongoose


    WHAT''S IN THIS CHAPTER?


    +   - Installing and using Mongoose

    - Defining schemas and models

    - Understanding Mongoose data types

    - Using schema validation

    - Searching, inserting, and updating documents

    - Pagaginating query results

    - Defining indexes

    - Using getters, setters, and virtual attributes

    - Referencing documents

    - Enriching models and document objects with higher-level movements


    Document-oriented databases have regained popularity in recent years, being at
    the front and center of the NoSQL movement. These types of databases, unlike relational
    ones, don''t require you to specify the structure of your data ahead of time.
    Instead, you can change it organically as your project requires. Another important
    difference from a relational database is that the document is generally the atomic
    unit and can be as complete as needed, eliminating the need to make costly joins
    and transactions across tables.


    MongoDB is a popular document-oriented database that enables you to perform dynamic
    rich queries using a powerful query language.'
