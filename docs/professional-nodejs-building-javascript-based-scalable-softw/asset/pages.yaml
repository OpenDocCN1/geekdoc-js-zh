  md: '# Changing or Setting a Header


    You can change a header you already set or set a new one by using the following:


    ```

    res.setHeader(name, value);

    ```


    This works only if you haven''t sent a piece of the body by using res.write()
    or res.end(). This also fails to work if you have already used res.writeHead()
    on that response object, because the headers also will have already been sent.


    # Removing a Header


    You can remove a header you have already set by calling res.removeHeader and providing
    the header name:


    ```

    res.removeHeader(''Cache-Control'');

    ```


    Again, this works only if the headers for that response haven''t already been
    sent.


    # Writing a Piece of the Response Body


    An HTTP server sends the response body after sending the response headers. Two
    ways to do this are to write a string:


    ```

    res.write(''Hello'');

    ```


    or use an existing buffer:


    ```

    var buffer = new Buffer(''Hello World'');

    res.write(buffer);

    ```


    # STREAMING HTTP CHUNKED RESPONSES


    One of the great features of Node is the ability to consume and produce streams
    easily from different sources. Because HTTP is a first-class protocol in Node,
    the HTTP responses are no different.


    HTTP chunked encoding allows a server to keep sending data to the client without
    ever sending the body size. When you specify a Content-Length header, the Node
    HTTP server sends the following to the client:


    ```

    Transfer-Encoding: chunked

    ```


    According to the HTTP specification, this header makes the client accept several
    chunks of data as the response body, sending a final chunk with a length of 0
    before the client can terminate the response. This can be useful for streaming
    text, audio, or video data into the HTTP client.


    Examples of streaming using this HTTP server feature are piping a file and piping
    the output of another process, both described next.'
