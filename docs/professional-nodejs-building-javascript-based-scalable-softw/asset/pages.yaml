  md: '# 12


    # Building a TCP Client


    WHAT''S IN THIS CHAPTER?


    +   - Connecting to a TCP server

    - Sending and receiving data from a TCP server

    - Reconnecting a broken connection


    Sitting at a level above IP, TCP is one of the most used transport protocols on
    the Internet, on top of which sit application protocols like HTTP. TCP is a connection-oriented
    protocol, which means that one endpoint requests and establishes a dedicated connection
    to another endpoint. This connection then sends and receive data to/from each
    other at the same time. TCP guarantees that the messages you receive are in order.
    It built-in mechanisms for flow control, making it a good platform for supporting
    machine-to-machine and human-to-machine protocols.


    As you will, Node makes it easy to build a TCP client that establishes a connection
    to another endpoint, usually called a TCP server. This connection then forms two
    streams of data that allow you to interact with the remote endpoint: One is a
    readable stream that receives data, and the other is a writable stream that writes
    data.


    > NOTE One point you should keep in mind is that when you write to a TCP stream,
    you receive no acknowledgment that the other side received the data. Even worse,
    because the underlying network implementation may chop or route your packets haphazardly,
    the other endpoint may have received only part of the message you sent (even though
    TCP internally tries to resent the packets that have been lost or corrupted).
    Remember that TCP guarantees only that the packets are received in order by the
    application, not that they are received at all.


    continues'
  merge: -1
  pgno: 136
- img_proc: true
  md: "> (continued)\nFurthermore, TCP, is not message-oriented; it just provides\
    \ a continuous stream of data. If you need to distinguish individual messages,\
    \ you need to implement a framing protocol that specifies where each message starts\
    \ and ends.\n\nHTTP, for instance, solves these problems whereby an application\
    \ needs a request-response workflow from a server and request and response messages\
    \ are clearly delimited.\n\n# CONNECTING TO A SERVER\n\nYou can connect to a TCP\
    \ server using the net module like this:\n\n```\nvar net = require('net');\nvar\
    \ port = 4000;\nvar conn = net.createConnection(port);\n```\n\nNote that the second\
    \ argument for the net.createConnection function is omitted, which is the hostname\
    \ you want to connect to. If absent, this hostname defaults to \"localhost\".\n\
    \n```\nvar net = require('net');\nvar port = 4000;\nvar host = \"www.acme.com\"\
    ;\nvar conn = net.createConnection(port, host);\n```\n\nYou can be notified when\
    \ the connection is established by passing a callback function as the last argument,\
    \ like this:\n\n```\nfunction connectionListener(conn) {\n  console.log('We have\
    \ a new connection');\n}\n```\n\n```\nvar conn = net.createConnection(port, host,\
    \ connectionListener);\n```\n\nIf you are connecting to the local host, you can\
    \ omit the host argument, passing the connection listener callback function as\
    \ the second argument.\n\n```\nvar conn = net.createConnection(port, connectionListener);\n\
    ```\n\nYou can instead listen for the connect event emitted by the conn object:\n\
    \n```\nconn.once('connect', connectionListener);\n```"
  merge: -1
