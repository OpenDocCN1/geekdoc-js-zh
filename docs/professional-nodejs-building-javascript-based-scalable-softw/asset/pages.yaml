  md: "# Understanding and Using Datagram Multicast\n\n> **NOTE** Message multicasting\
    \ can be useful when you don't need to know the address of all peers. Peers just\
    \ have to \"tune in\" and listen to that channel.\n\nFor instance, you could have\
    \ an event logging server listening on multiple \"channels.\" When another process\
    \ needs to log in to a \"channel,\" it would multicast a message containing the\
    \ event details into that \"channel.\"\n\nYou could also have multiple servers\
    \ set up to the same channel. For instance, one server could be responsible for\
    \ storing the events, and another would be responsible for sending them to an\
    \ analytics engine.\n\nNodes report their interest in listening to certain multicast\
    \ channels by tuning in to that channel. In IP addressing, a space is reserved\
    \ for multicast addresses. In IPv4 the range is between 224.0.0.0 and 239.255.255.255,\
    \ some of these are reserved.\n\nAddresses from 224.0.0.0 through 224.0.0.255\
    \ are reserved for local purposes (such as administrative and maintenance tasks),\
    \ and addresses from 239.0.0.0 to 239.255.255.255 are also reserved for administrative\
    \ scoping.\n\n# Receiving Multicast Messages\n\nTo join a multicast address like\
    \ 230.1.2.3, you can do something like this:\n\n```\nvar server = require('dgram').createSocket('udp4');\n\
    server.on('message', function(message, info) {\n  console.log('server get message:\
    \ ' + message + ' from ' + info.address +\n  ': ' + info.port);\n});\n\nserver.bind(4000);\n\
    server.addMembership('230.1.2.3');\n```\n\nLine 9 tells the kernel that this UDP\
    \ socket should receive multicast messages for the address 230.1.2.3. When you're\
    \ calling the addMembership method on the server, you can pass the listening interface\
    \ as an optional second argument. If this argument is omitted, Node will try to\
    \ listen on every network interface.\n\nThen you can test the server using your\
    \ new UDP client like this:\n\n```\n$ ./udp_client.js 230.1.2.3 4000\n```\n\n\
    Every line of text you input here should appear on the server console log."
  merge: -1
