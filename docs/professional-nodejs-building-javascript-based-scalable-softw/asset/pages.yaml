  md: '# Streaming


    Streaming returns a client request object, which you can pipe into a writable
    stream (just like I for Node core HTTP request function earlier in this chapter),
    or even into another request. For instance, if you want to pipe a request response
    into a file stream, you can do something like this:


    ```

    var fs = require(''fs'');

    var request = require(''request'');

    var file = fs.createWriteStream(''/path/to/my/file'');


    request.get(''http://www.example.com/temp/test.html'').pipe(file);

    ```


    You can pipe a request into another request. For instance, you can pipe a GET
    request into another POST request like this:


    ```

    var request = require(''request'');

    var source = request.get(''http://my.server.com/images/some_file.jpg'');

    var target = request.post(''http://other.server.com/images/some_file.jpg'');

    source.pipe(target);

    ```


    # Using a Cookie Jar


    By default, request interprets and stores all HTTP cookies in a global cookie
    jar. This means that, for your application, the requests send the cookies that
    were received from a given hostname.


    This behavior can sometimes be useful; however, you may not want to collect every
    single cookie because they may not be important to your application. You can choose
    to disable cookies globally by changing request defaults:


    ```

    request.defaults({jar: false});

    ```


    You can also turn this behavior off on a per-request basis by setting the options
    jar attribute to false:


    ```

    var options = {

    url: ''http://www.example.com/'',

    jar: false };

    request(options, callback);

    ```


    You can also define a specific cookie jar to use in each request by constructing
    and specifying it in the options object:


    ```

    var jar = request.jar();

    var options = {

    url: ''http://www.example.com/'',

    jar: jar };

    request(options, callback);

    ```'
