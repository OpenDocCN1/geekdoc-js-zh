    # # USING AN ASSERTION TESTING MODULE


    To build a valid test, you need a way to verify that the results you are getting
    match your expectations. For this, the previous example used node-tap''s built-in
    assertion functions — which you''ll learn about later — but for now you can use
    Node''s built-in assert module.


    # # Using the assert Module


    Node uses the built-in assert module in its tests. Node also exposes the assert
    module, which means you can use it to verify assumptions inside your own tests.

    to use the assert module, import the module into your test script:


    ```

    ```var assert = require(''assert'');```

    ```


    Now you can use the assertion functions. Each of these functions sets an expectation,
    and an exception will be thrown if the expectation is not met.


    First, you can test if a value is truthy:


    ```

    ```var a = true;

    assert(a);

    ```

    ```'
