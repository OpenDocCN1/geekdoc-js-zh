  md: '# 20


    # Building and Using HTTP Middleware


    **WHAT''S IN THIS CHAPTER?**


    +   - Understanding how Connect works

    - Making Connect-compatible middleware

    - Making a middleware component that handles errors

    - Using some of the built-in middleware components bundled in Connect

    - Serving static files using Connect middleware

    - Parsing query string, request body, and cookies

    - Maintaining a session


    Node is particularly fit to be an HTTP server. It has a great HTTP parser and
    can efficiently handle many concurrent connections in one single process.


    When you are building an HTTP application server, you usually need it to perform
    some routine tasks like parsing the cookie headers, parsing the query string on
    the request URL, maintaining and associating a session, persisting session data,
    serving static files, parsing the request body, logging the request and response,
    and others. When coding the core logic of your application, you shouldn''t have
    to explicitly perform these tasks; these should be handled by the HTTP server
    application logic.


    Some of these tasks involve inspecting the request — headers or body — others
    involve inspecting and changing the response, and some involve both. An example
    of where you may want to do both is when you want to log the details of each incoming
    request together with'
  merge: -1
  pgno: 230
- img_proc: true
  md: "the respective response HTTP status code. In this case you need to inspect\
    \ both the request and the response objects. You may also want to set or change\
    \ the response headers, as is the case of when you are maintaining a session ID\
    \ using browser cookies.\n\nIn typical HTTP application frameworks like Django,\
    \ Cake, Rails, or Sinatra, components generally called *middleware* perform these\
    \ tasks. These middleware components wrap the request-response cycle, extending\
    \ the request object before your application code is reached or changing the response\
    \ before or after it.\n\n# UNDERSTANDING THE CONNECT HTTP MIDDLEWARE FRAMEWORK\n\
    \nNode also includes some frameworks that ease the development of an HTTP-based\
    \ application. One of the most popular is called *Connect*. Connect defines a\
    \ model for middleware components and an engine to run them.\n\nIn general, middleware\
    \ components are pieces that the programmer can stack together. When Connect receives\
    \ an HTTP request, the middleware engine calls each of these components in order.\
    \ Any of these components has access to the request object, which means that they\
    \ can parse some headers and buffer and parse the request body. They can also\
    \ change the response headers, write a part of the body, or end the response.\n\
    \nConnect comes bundled with a series of middleware components, but you can easily\
    \ build your own.\n\n# BUILDING YOUR OWN HTTP MIDDLEWARE\n\nAs you will see, a\
    \ middleware component is not much more than a function that receives the request\
    \ and response objects, much like the standard Node HTTP server `request` listener.\
    \ To run an example of a simple middleware component, you need to first install\
    \ the `connect` module inside a working directory you choose:\n\n```\n$ npm install\
    \ connect\n```\n\nListing 20-1 shows a simple middleware component that responds\
    \ with the string `\"Hello World!\"` and ends the response.\n\n# LISTING 20-1:\
    \ A simple HelloWorld middleware.\n\n```\nfunction helloWorld(req, res) {\n  \
    \  res.end('Hello World!');\n}\n\nmodule.exports = helloWorld;\n```\n\nYou can\
    \ save this code listing as a local file named `hello_world.js` to be used later."
