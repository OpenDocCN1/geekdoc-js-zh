  md: '# 2


    # # Introducing Node


    WHAT''S IN THIS CHAPTER?


    +   - What is the event-driven programming style and what are the advantages of
    using it

    - How Node.js and JavaScript make event-driven programming easy


    Traditional programming does I/O the same way as it does local function calls:
    Processing cannot continue until an operation finishes. This programming model
    of blocking when doing I/O operations derives from the early days of time-sharing
    systems in which each process corresponded to one human user. The purpose was
    to isolate users from one another. In those systems, a user would typically need
    to finish one operation before deciding what the next operation would be. With
    widespread use of computer networks and the Internet, this model of “one user,
    one process” did not scale well. Managing many processes places a big burden on
    the operating system — in memory and context switching costs — and the performance
    of these tasks to decay after a certain number is reached.


    Multi-threading is one alternative to this programming model. A thread is a kind
    of light-weight process that shares memory with every other thread within the
    same process. Threads were created as an ad extension of the previous model to
    accommodate several concurrent threads of execution. When one thread is waiting
    for an I/O operation, another thread can take over the CPU. When the I/O operation
    finishes, that thread can wake up, meaning the thread that was running can be
    interrupted and resumed later. Furthermore, some systems allow threads to execute
    in parallel in different CPU cores.


    This means that programmers do not know what set of threads is executing at any
    given time, so they must be careful with concurrent access to the shared memory
    state. They have to use synchronization primitives like locks and semaphores to
    synchronize access to some data'
  merge: -1
