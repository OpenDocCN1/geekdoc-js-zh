  md: '# SUMMARY


    You can connect to a CouchDB server using Nano, a third-party module installable
    via NPM.


    Using Nano you can create a database and views on documents by inserting design
    documents that contain map and reduce functions.


    You can also insert documents and query these documents by accessing the generated
    views.


    CouchDB also allows documents to have binary file attachments, and Nano allows
    you to write and read them using streams.'
