  md: 'You can start your project by using the Connect command-line and evolve from
    there, adding or removing middleware components and defining the routing table.


    Routing uses a simple form of pattern-matching against the method and request
    URL. You should not stick all the routes in your main module. Instead, use separate
    modules for different sets of functionality.


    In Express, routing works much like global middleware, where you can define a
    stack of listener functions listening on a certain route. Using this feature you
    can make your final route listeners more secure and less redundant.'
