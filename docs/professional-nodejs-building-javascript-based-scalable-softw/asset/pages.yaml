  md: "# Defining a Model | 323\n\n> **NOTE** You can find out more about the MongoDB\
    \ error codes at the documentation at the mongodb.org website.\n\nFor the login\
    \ to work you have to integrate it with Mongoose. To do so, change the file in\
    \ routes/session.js to the following:\n\n```\n/*\n* Session Routes\n*/\nvar User\
    \ = require('../../data/models/user');\nvar notLoggedIn = require('./middleware/not_logged_in');\n\
    \nmodule.exports = function(app) {\n  app.dynamicHelpers({\n    session: function(req,\
    \ res) {\n      return req.session;\n    }\n  });\n\n  app.get('/session/new',\
    \ notLoggedIn, function(req, res) {\n    res.render('/session/new', { title: \"\
    Log in\" });\n  });\n\n  app.post('/session', notLoggedIn, function(req, res)\
    \ {\n    User.findOne({username: req.body.username, password: req.body.password},\n\
    \    function(err, user) {\n      if (err) {\n        return next(err);\n    \
    \  }\n\n      if (user) {\n        req.session.user = user;\n        res.redirect('/users');\n\
    \      } else {\n        res.redirect('/session/new');\n      }\n    });\n  });\n\
    \n  app.del('/session', function(req, res, next) {\n    req.session.destroy();\n\
    \    res.redirect('/users');\n  });\n});\n```\n\nNow that the user routes are\
    \ working with MongoDB, you can continue evolving your user schema to embed validators,\
    \ document nesting, and more."
