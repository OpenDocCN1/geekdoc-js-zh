  md: "# Using a Third-Party Module to Simplify HTTP Requests\n\n+   - `request.put\
    \ (url)` — Issues a PUT request.\n- `request.post (url)` — Issues a POST request.\n\
    - `request.head (url)` — Issues a HEAD request.\n- `request.del (url)` — Issues\
    \ a DELETE request.\n- `request.get(url)` — Issues a GET request; exists just\
    \ for uniformity, and you can instead use the default request ().\n\nInstead of\
    \ a string containing a URL, you can also use an options object. This object can\
    \ be something like the following:\n\n```\n{\n  url: 'http://www.acme.com:4001/something',\n\
    \  method: 'DELETE',\n  headers: {'Accept': 'application/json'},\n  body: new\
    \ Buffer('Hello world!')\n}\n```\n\nHere is a list of some accepted arguments:\n\
    \n+   - `uri or url` — Fully qualified URL or a parsed URL object from `url.parse()`.\
    \ For example, `https://my.server.com/some/path?a=1&b=2`.\n- `method` — HTTP method;\
    \ defaults to GET.\n- `headers` — HTTP headers; defaults to:\n- `qs` — A name-value\
    \ pair to be appended to the query string in the URL; for example, `{a:1,b:2}`.\n\
    - `body` — A request body for POST and PUT requests. Must be a buffer or a string.\n\
    - `form` — Sets the body to a query-string representation of the value and adds\
    \ the content-type application/x-www-form-urlencoded; charset=utf-8 to the header.\n\
    - `json` — Sets the body to a JSON representation of the value and adds the content-type\
    \ application/json header.\n- `followRedirect` — Follows HTTP 3xx responses as\
    \ redirects. Defaults to true.\n- `maxRedirects` — The maximum number of redirects\
    \ to follow; defaults to 10.\n- `onResponse` — If onResponse is true, the callback\
    \ will be fired on the response event instead of end. If onResponse is a function,\
    \ it will be called on response and not affect the regular semantics of the main\
    \ callback on end.\n\n+   - `encoding` — Encoding to be used on `setEncoding`\
    \ of the response data. If encoding is set to null, the response is returned as\
    \ a buffer.\n\n+   - `pool` — A hash object containing the agents for these requests.\
    \ If this option is omitted, this request will use the global pool that's set\
    \ to Node's default maxSockets."
