- img_proc: true
  md: "```\nfieldLength: 39,\nfieldType: 253,\nflags: 1,\ndecimals: 31 } }\n```\n\n\
    Even with this rudimentary example, you can see how the typical asynchronous callback\
    \ flow is used once again to make the database request non-blocking. This is especially\
    \ important in this context because — depending on the query and the size of the\
    \ result set — database requests can be somewhat slow, putting the responsiveness\
    \ of the application at risk if handled synchronously. Later in this chapter you'll\
    \ look into an even more efficient way to retrieve results from the database.\n\
    \nWhen connecting to the database using `mysql.createClient()`, you can provide\
    \ a set of options:\n\n+   - `host`: The IP address or DNS name of the server\
    \ that is to be connected. Defaults to localhost if omitted.\n- `port`: The TCP\
    \ port to connect to. Defaults to 3306 if omitted.\n- `user`: The username used\
    \ to authenticate against the server. Defaults to root if omitted.\n- `password`:\
    \ The password used to authenticate against the server. If omitted, a password-less\
    \ connection is attempted.\n- `database`: The database to be used upon successful\
    \ connection. If omitted, no database is selected, and must be selected using\
    \ a `SELECT` database query.\n- `debug`: If set to `true`, `node-mysql` prints\
    \ all incoming and outgoing data packets to the console. Defaults to `false`.\n\
    - `flags`: The MySQL connect protocol supports several flags that influence the\
    \ low-level details of the connection handshake, such as which protocol version\
    \ to use, whether to use compression or not, and so on. `node-mysql` ships with\
    \ a sensible default, so unless your server is configured in a non-standard way,\
    \ you don't need to set any of these flags. See http://forge.mysql.com/wiki/MySQL_Internals_ClientServer_Protocol#Handshake_Initialization_Packet\
    \ for a list of available flags.\n\nYou have not yet queried for any real data.\
    \ To do so, you need to create a database with a table and then add rows to the\
    \ table:\n\n```\nclient.query('CREATE DATABASE node', function(err) {\n  if (err)\
    \ {\n    client.end();\n    throw err;\n  }\n});\n```\n\nThis shows how errors\
    \ trigger the callback function. Here, you close the connection to the server\
    \ if an error occurs. You can trigger an error case by running this script more\
    \ than once. Because the database exists after the first run, it cannot be created\
    \ again. Therefore, the second query fails."
