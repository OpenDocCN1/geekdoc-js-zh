- img_proc: true
  md: "# INITIALIZING YOUR EXPRESS.JS APPLICATION\n\nThis section shows you how to\
    \ create an Express application from scratch, but first you must install Express\
    \ globally using npm:\n\n```\n$ npm install -g express@2.5.x\n```\n\n> NOTE If\
    \ this command fails because it doesn't have enough permissions, depending on\
    \ your system, you may be able to run it using sudo like this:\n\nsudo npm install\
    \ -g express@2.5.x\n\nIf you can't do it, try fixing the permissions in your file\
    \ system.\n\nNow you can use the binary module to initialize your application:\n\
    \n```\n$ express my_app\ncreate : my_app\ncreate : my_app/package.json\ncreate\
    \ : my_app/app.js\ncreate : my_app/public\ncreate : my_app/public/javascript\n\
    create : my_app/public/images\ncreate : my_app/public/stylesheets\ncreate : my_app/public/stylesheets/style.css\n\
    create : my_app/routes\ncreate : my_app/routes/index.js\ncreate : my_app/views\n\
    create : my_app/views/layout.jade\ncreate : my_app/views/index.jade\n```\n\nExpress\
    \ creates a directory my_app, followed by a set of files on which you can base\
    \ your new application. Step into that directory and edit your code editor to\
    \ analyze what Express created.\n\nFirst there is the package.json manifest file,\
    \ which contains something like:\n\n```\n{\n  \"name\": \"application-name\"\n\
    \  \"version\": \"0.0.1\"\n  \"private\": true\n  \"dependencies\": {\n    \"\
    express\": \"2.5.11\"\n    \"jade\": \">= 0.0.1\"\n  }\n}\n```"
  merge: -1
  pgno: 251
- img_proc: true
  md: "This manifest file's main purpose is to contain the module dependency list\
    \ that NPM can use to install dependencies. Let's install those dependencies now:\n\
    \n```\n$ npm install\n...\njade@0.26.2 ./node_modules/jade\n├── commander@0.5.2\n\
    └── mkdirp@0.3.0\n\nexpress@2.5.11 ./node_modules/express\n├── qs@0.4.2\n├── mime@1.2.4\n\
    ├── mkdirp@0.3.0\n└── connect@1.9.0 (formidable@1.0.11)\n```\n\nThis code will\
    \ download and install the Express module and the Jade templating language modules\
    \ and their dependencies into the local node_modules directory. You can see that\
    \ Express depends on, among others, the Connect module.\n\nNext, by exploring\
    \ the public directory Express created for you, you can see that it contains directories\
    \ for the static files you may need in your app. These are somewhat standard directories\
    \ for separating the location of style sheets, images, and client-side JS files,\
    \ but you can change them at will.\n\n```\n$ ls public\nimages    javascripts\
    \    stylesheets\n```\n\nYou will also find that Express created a file named\
    \ app.js containing some initialization code for your server, as seen in Listing\
    \ 21-1.\n\n# LISTING 21-1: The app.js file Express creates for you.\n\n```\n/**\n\
    \ * Module dependencies.\n */\n\nvar express = require('express')\n  , routes\
    \ = require('./routes');\n\nvar app = module.exports = express.createServer();\n\
    \n// Configuration\n\napp.configure(function(){\n  app.set('views', __dirname\
    \ + '/views');\n  app.set('view engine', 'jade');\n  app.use(express.bodyParser());\n\
    \  app.use(express.methodOverride());\n  app.use(app.router);\n  app.use(express.static(__dirname\
    \ + '/public'));\n});\n```"
  merge: -1
  pgno: 252
- img_proc: true
  md: "# LISTING 21-1 (continued)\n\n```\napp.configure('development', function()\
    \ {\n  app.use(express.errorHandler({ dumpExceptions: true, showStack: true }));\n\
    });\n\napp.configure('production', function() {\n  app.use(express.errorHandler());\n\
    });\n\n// Routes\napp.get('/', routes.index);\n\napp.listen(3000, function() {\n\
    \  console.log(\"Express server listening on port %d in %s mode\", app.address().port,\
    \ app.settings.env);\n});\n```\n\nAfter the initial dependency has loaded, you\
    \ will find that you are instantiating an Express server using express.createServer().\
    \ This server inherits from the Connect HTTP server, which in turn inherits from\
    \ the Node HTTP server.\n\nAfter this code goes into configuring some application\
    \ settings. It first sets the views to the root of the template files for composing\
    \ HTML pages. Then it sets the view engine setting to jade. Jade is a templating\
    \ language for HTML that does what you would expect from a templating language\
    \ — it allows you to render HTML blocks, render dynamic values, perform loops,\
    \ and include other templates. You can take a look at some simple Jade templates\
    \ that are inside the views directory that Express just created.\n\nIn the next\
    \ section, you learn how to define the middleware for your application.\n\n# SET\
    \ UP MIDDLEWARE IN YOUR APPLICATION\n\nContinuing with the code in the app.js\
    \ file, you can see that some middleware components are added to the app:\n\n\
    ```\napp.configure(function() {\n  app.use(express.bodyParser());\n  app.use(express.methodOverride());\n\
    \  app.use(app.router);\n  app.use(express.static(__dirname + '/public'));\n});\n\
    ```\n\nThis code is wrapped inside a callback function passed to the app.configure\
    \ call. This callback is invoked synchronously and is shown here to make the code\
    \ more consistent with the environment-specific configuration part that follows."
  merge: -1
  pgno: 253
- img_proc: true
  md: "Inside this callback you are setting up the body parser middleware component\
    \ — covered in the previous chapter — which is used to parse the request body\
    \ according to the content type defined in the request.\n\n> **NOTE** *The Connect\
    \ framework is bundled with a set of useful middleware components that Express\
    \ simply exposes. For instance, `express.bodyParser` exposes the Connect body\
    \ parser middleware. This prevents you from needing to install the Connect module\
    \ dependency to use the middleware.*\n\nThe method override middleware is then\
    \ added to the app. This middleware component enables browsers to simulate using\
    \ HTTP methods other than GET and POST. The HTTP standard defines many methods\
    \ like GET, POST, DELETE, PUT, and others, but web browsers are not capable of\
    \ using them. When posting a form or making an AJAX request, most browsers are\
    \ capable of using only GET or POST requests. But placing the pretend HTTP method\
    \ inside a hidden argument named `_method`, they can, with the help of the server\
    \ and the method override middleware, pretend to be using any other method.\n\n\
    > **NOTE** *There are several advantages of using the method overriding middleware.\
    \ First, you can make your routing decisions richer based on a standard HTTP method.\
    \ Second, you can treat HTTP clients that can request this method the same way\
    \ you treat browsers, which may lead to simplified server-side code.*\n\nNext\
    \ in the list is the router middleware. This middleware component dispatches each\
    \ request to the proper listener as defined in a routing table, depending on HTTP\
    \ method and URL. You will return to this subject later.\n\nThe code then sets\
    \ up a static file server middleware, which will serve static files inside your\
    \ `public` directory.\n\nAfter this block of code in `app.js`, you proceed to\
    \ some parts that are environment-specific:\n\n```\n```javascript\napp.configure('development',\
    \ function(){\n  app.use(express.errorHandler({ dumpExceptions: true, showStack:\
    \ true }));\n});\n\napp.configure('production', function(){\n  app.use(express.errorHandler());\n\
    });\n```\n```\n\nIn Express, you can have independent initialization code blocks\
    \ for each environment your app runs on. For instance, you may want to use the\
    \ in-memory session store in the development environment, but you may want to\
    \ use an external service like Memcache or Redis as the session store in a production\
    \ environment.\n\nIn this case you want the error handler to dump exceptions and\
    \ show the stack trace in a development environment, but you want to keep those\
    \ private when you are running in production."
  merge: -1
  pgno: 254
- img_proc: true
  md: "> **NOTE** You can change the environment by setting the `NODE_ENV` environment\
    \ variable. For instance, set the environment to `production` when you start your\
    \ Node process in this way:\n\n$ `NODE_ENV=production node my_app`\n\nIn Express,\
    \ the environment defaults to `development`.\n\nYou can also specify many environments\
    \ where you want that block of code to run by listing them before the last argument:\n\
    \n```\napp.configure('production', 'staging', function(){\n    app.use(express.errorHandler());\n\
    });\n```\n\n# ROUTING REQUESTS\n\nWhen you define an HTTP server request listener\
    \ or a middleware component, that piece of code is invoked for every request.\
    \ But obviously, different parts of your application need to trigger different\
    \ server behaviors. For instance, `GET` requests should probably be treated differently\
    \ than `POST` requests, and a different URL should also trigger different responses.\
    \ For instance, if you want some part of the application you're building to show\
    \ user profiles, you would want the following combinations of method and URLs\
    \ to behave differently:\n\n+   - `GET /users` — To show a list of users or to\
    \ search for users.\n- `GET /users/:username` — Generally, show the profile of\
    \ the user with the given username, like in the next line.\n- `GET /users/joe`\
    \ — To show the profile of the user who has the name \"joe.\"\n- `POST /users`\
    \ — To create a user profile.\n- `PUT /users/:username` — Generally, to update\
    \ a profile of a user with the specified username, like in the next line.\n- `PUT\
    \ /users/joe` — Update profile of user with name \"joe.\"\n\nThe list above defines\
    \ what is called a routing table. This table maps `HTTP` methods and `URL` patterns\
    \ into actions. The next section shows how to define these methods and patterns\
    \ in Express.\n\n# Handling Routes\n\nIn line 32 of the `app.js` file that Express\
    \ created (Listing 21-1), the code reads as follows:\n\n```\napp.get('/', routes.index);\n\
    ```\n\nThis code indicates to the app that, if a `GET` request is sent to the\
    \ `/` URL, the `routes.index` handler should be called. This `routes` object is\
    \ imported in line 7 and defined in the file `routes/index.js`. You need to change\
    \ this model a bit to accommodate the new set of routes."
  merge: -1
  pgno: 255
- img_proc: true
  md: "Change the routes/index.js file to the one shown in Listing 21-2.\n\n# LISTING\
    \ 21-2: The new version of routes/index.js.\n\n```\n/*\n * GET home page.\n */\n\
    module.exports = function(app) {\n  app.get('/', function(req, res) {\n    res.render('index',\
    \ { title: 'Express' });\n  });\n};\n```\n\nThen you should change line 32 of\
    \ app.js to the following:\n\n```\nrequire('./routes/index') (app);\n```\n\nThen\
    \ you can define the new routes in the file routes/users.js, as shown in Listing\
    \ 21-3.\n\n# LISTING 21-3: The users routes.\n\n```\n/*\n * User Routes\n */\n\
    module.exports = function(app) {\n  app.get('/users/:name', function(req, res)\
    \ {\n    res.render('users/profile', { title: 'User profile' });\n  });\n};\n\
    ```\n\nThen you need to add the following line to app.js, right after line 32:\n\
    \n```\nrequire('./routes/users') (app);\n```\n\n> NOTE This model of setting up\
    \ the routes delegates the route setup to each route group. This keeps the app.js\
    \ file from being cluttered with all the routes.\n\nYou are defining two new route\
    \ handlers for your application. The first is activated when a request has the\
    \ GET method and the URL /users. In this case you render the template users/index,\
    \ passing the title as an argument.\n\nThe next one is a dynamic route. It matches\
    \ any route that begins with /users/ followed by a non-empty string. This final\
    \ string will be available to the route handler in req.params.name."
