  md: "**LISTING 21-9** *(continued)*\n\n```\ntextarea#bio(name=\"bio\")\np\n  input(type=\"\
    submit\", value=\"Create\")\n```\n\nThis template contains a simple form for creating\
    \ a user. When pressing the Create button, a POST request is made to the /users\
    \ URL, activating this route listener:\n\n```\napp.post('/users', function(req,\
    \ res) {\n  if (users[req.body.username]) {\n    res.send('Conflict', 409);\n\
    \  } else {\n    users[req.body.username] = req.body;\n    res.redirect('/users');\n\
    \  }\n});\n```\n\nIn the first line of this listener function you are checking\
    \ whether this username is already in the \"database.\" If it is, you respond\
    \ with a 409 status code, which indicates to the client that there was a conflict.\
    \ The code also renders a \"Conflict\" string as the body response by using res.send,\
    \ a utility provided by Express that allows you to respond with a string and set\
    \ the response status code.\n\nIf there was no conflict, you save the user object\
    \ in the database and then redirect the user to the /users URL by using the res.redirect\
    \ utility function.\n\n> **NOTE** *Here you are storing the user database in memory.\
    \ In a real application you would obviously want to keep this data, which would\
    \ imply doing I/O and going asynchronous. If you have a generic and simple key-value\
    \ store module to access the database, your code for this last route listener\
    \ would look something like this:*\n\napp.post('/users', function(req, res, next)\
    \ {\n  db.get(req.body.username, function(err, user) {\n    if (err) {\n     \
    \ return next(err);\n    }\n    if (user) {\n      res.send('Conflict', 409);\n\
    \    } else {\n      db.set(req.body.username, req.body, function(err) {\n   \
    \     if (err) {\n          return next(err);\n        }\n        res.redirect('/users');\n\
    \      });\n    }\n  });\n});\n\n*In Chapters 23, 24, and 25, you will learn how\
    \ to connect to some popular databases using Node.*"
