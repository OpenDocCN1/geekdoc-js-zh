  md: "In Listing 12-2 you set the retry interval to an arbitrary value of three seconds.\
    \ You also cap the number of repeated failed retries to 10. These are both arbitrary\
    \ numbers that you should define based on your specific application.\n\n# LISTING\
    \ 12-2: A TCP client that attempts to reconnect.\n\n```\nvar net = require('net');\n\
    var port = 4000;\nvar conn;\n\nvar retryInterval = 3000; // 3 seconds\nvar retriedTimes\
    \ = 0;\nvar maxRetries = 10;\n\nprocess.stdin.resume();\n\nfunction connect()\
    \ {\n  function reconnect() {\n    if (retriedTimes >= maxRetries) {\n      throw\
    \ new Error('Max retries have been exceeded, I give up.');\n    }\n    retriedTimes\
    \ += 1;\n    setTimeout(connect, retryInterval);\n  }\n\n  conn = net.createConnection(port);\n\
    \n  conn.on('connect', function () {\n    retriedTimes = 0;\n    console.log('connected\
    \ to server');\n  });\n\n  conn.on('error', function(err) {\n    console.log('Error\
    \ in connection:', err);\n  });\n\n  conn.on('close', function () {\n    console.log('connection\
    \ closed, will try to reconnect');\n    reconnect();\n  });\n\n  process.stdin.pipe(conn,\
    \ {end: false});\n}\n();\n```\n\nYou are tracking how many times you have tried\
    \ to connect after the last successful connection by storing a counter in the\
    \ retriedTimes variable. Once you connect successfully, the retriedTimes variable\
    \ is reset to 0.\n\n# Closing the Connection\n\nTo close the connection you just\
    \ have to call conn.end() like this:\n\n```\nconn.end();\n```"
