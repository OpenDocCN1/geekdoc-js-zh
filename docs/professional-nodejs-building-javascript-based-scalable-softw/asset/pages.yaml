  md: '# 9

    Reading and Writing Streams of Data


    **WHAT''S IN THIS CHAPTER?


    +   - Introducing the streams interface

    - Getting data from a readable stream

    - Controlling the flow of a readable stream

    - Writing to a writable stream

    - Solving the slow client problem

    - Using pipe to stitch streams together


    Node has a useful abstraction: streams. More specifically, two very useful abstractions:
    readable streams and writable streams. They are implemented throughout several
    Node objects, and they represent inbound (readable stream) or outbound (writable
    stream) flows of data. An example of a stream is a TCP socket that you read from
    and write to, or a file that you append or read from sequentially. You have already
    come across some of them, but this chapter introduces them in a more formal and
    abstract way, paving the way for some concrete examples.'
  merge: -1
  pgno: 108
- img_proc: true
  md: "> NOTE A stream is an abstract construct that is implemented by several Node\
    \ objects. The way you create or obtain a stream depends on the type of stream\
    \ you are using. For instance, you can explicitly create a read or write stream\
    \ based on a file, but a server-side TCP socket is a stream that is handed to\
    \ you when a client connects.\nBesides having the characteristics of a readable\
    \ or a writable stream, an object can contain other properties or behaviors that\
    \ are particular to it. For instance, a file readable stream also contains a \"\
    path\" property that may not be present in other streams.\n\n# USING A READABLE\
    \ STREAM\n\nA readable stream is like a data faucet: After you have created or\
    \ obtained one — the method of creating or obtaining one depends on the type of\
    \ stream — you can control it. You can control the flow by pausing and resuming\
    \ it, you can get notified when data is available, and you can close it and get\
    \ notified when the stream ends.\n\n# Waiting for Data\n\nStreams can send data\
    \ in chunks. By listening to the “data” event, you can be notified every time\
    \ a stream delivers a chunk. You can get the data as a buffer or as a string,\
    \ depending on the stream-encoding settings.\n\nData is passed via the event handler\
    \ function that you bind to the “data” event. Depending on the stream encoding,\
    \ the data may be delivered in the raw form using a byte buffer or, if you define\
    \ the stream encoding by using the stream.setEncoding() function, be be passed\
    \ in as an encoded string, as in the following examples:\n\n```\nvar readablestream\
    \ = ...\nreadablestream.on('data', function (data) {\n  // data is a buffer;\n\
    \  console.log('got this data:', data);\n});\n\nvar readable2 = ...\nreadablestream2.setEncoding('utf8');\n\
    readablestream2.on('data', function (data) {\n  // data is a utf8-encoded string;\n\
    \  console.log('got this data:', data);\n});\n```\n\nIn the first example, data\
    \ is passed as a buffer because you didn't specify an encoding. In the second\
    \ example, data is passed as a UTF-8-encoded string."
  merge: -1
  pgno: 109
- img_proc: true
  md: "# Using Writable Streams\n\n> NOTE Because UTF-8 characters can be multibyte,\
    \ you may receive a character in two separate “data” events when you are expecting\
    \ UTF-8 characters. If you set the encoding to utf8, the stream takes care of\
    \ delivering a character only when it is complete.\n\n# Pausing and Resuming the\
    \ Stream\n\nA readable stream is like a faucet, and you can keep the data from\
    \ coming by pausing it like this:\n\n```\nstream.pause();\n```\n\nAfter you have\
    \ done this, you will not receive any further “data” events. This feature can\
    \ help you avoid implicit buffering, but as you will see later.\n\n> NOTE Pausing\
    \ a stream translates to different behaviors under the hood. For instance, if\
    \ the stream is a file stream, Node will stop reading from that file. If the stream\
    \ is a TCP socket, Node will stop reading new data packets, which has the effect\
    \ of stopping the packet flow from the other end. Other object types implement\
    \ pause differently.\n\nWhen you want to resume a paused stream, you can simply\
    \ call the stream.resume() method. This will reopen the faucet and data will be\
    \ emitted — until you pause it again or the stream ends.\n\n# Knowing When the\
    \ Stream Ends\n\nA stream can end. For instance, if you have a readable stream\
    \ that is streaming file content, when the stream emits an “end” event. Similarly,\
    \ if you have an HTTP stream that is delivering the requested body data, when\
    \ the request ends that stream will also emit the “end” event. You can listen\
    \ to event like so:\n\n```\nvar readable stream = ...\nreadable stream.on('end',\
    \ function() {\n  console.log('the stream has ended');\n});\n```\n\nAfter a readable\
    \ stream ends, you will receive no more “data” events.\n\n# USING WRITABLE STREAMS\n\
    \nA writable stream is an abstraction of something you can send data to. It can\
    \ be a file or a TCP network connection or an object that outputs transformed\
    \ data, such as a zipped file. A writable stream is an object that allows you\
    \ to write data to it. In this section, you learn to write data to a writable\
    \ stream and learn about drain events."
