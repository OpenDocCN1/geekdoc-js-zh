  md: '# 20 | CHAPTER 22 MAKING UNIVERSAL REAL-TIME WEB APPLICATIONS USING SOCKET.IO


    > NOTE If you are running a load balancer in front of a set of Node.js processes
    that run Socket.IO servers, you need to use one that supports WebSockets.


    If you want to run a Node-based Socket.IO server, I recommend looking at the node-http-proxy
    module, which is very malleable and feature rich. You can find more about it at:


    https://github.com/nodejitsu/node-http-proxy


    The problem with having a distributed set of processes like this is that any user
    can connect to any given Node.js process at given time. That user will only be
    able to communicate with the other users who are also connected to that server.
    Other users will be connected to different servers and will be unreachable.


    Fortunately, Socket.IO has a pluggable store. By default it uses a memory store
    that uses local process memory, but you can set the store to anything that conforms
    to a given protocol. For instance, a popular choice is to use the Redis database
    as a store.


    Redis is a powerful in-memory key-value database with some advanced features.
    One of these features is to support pub-sub, where clients can publish events
    and server subscribers are notified of these events. Socket.IO already comes with
    support for a Redis store baked in, but you need to install the module:


    ```

    $ npm install redis

    ```


    Now the only thing you need to install is the Redis server itself.


    > NOTE Installing a Redis server is out of the scope of this book, but heading
    to the official website documentation should get you started:


    http://redis.io/topics/quickstart


    Once you have a Redis server installed and running, you are ready to configure
    your Socket.IO server that it uses a Redis store:


    ```

    var redis = require(''redis''),

    RedisStore = require(''socket.io/lib/stores/redis''),

    pub = redis.createClient(),

    sub = redis.createClient(),

    client = redis.createClient();


    io.set(''store'', new RedisStore({

    redisPub : pub,

    redisSub : sub,

    redisClient : client

    }));

    ```'
