  md: "# Using Modifiers\n\nSometimes you want to change the value of a field before\
    \ you validate and save a document. For instance, the gender field has a declared\
    \ uppercase modifier that capitalizes the string before entering the validation\
    \ and saving step.\n\nFor fields of the String type, you can use the uppercase\
    \ modifier, the lowercase modifier, and the trim modifier. The last one removes\
    \ the leading and trailing white space from a string using the string.trim() method.\n\
    \nYou can also use a custom modifier by defining a function that transforms and\
    \ returns the value. For instance, the user can prefix the Twitter handle with\
    \ @ or not:\n\n```\nvar UserSchema = new mongoose.Schema({\n    username: {type:\
    \ String, unique: true},\n    name: String,\n    password: String,\n    email:\
