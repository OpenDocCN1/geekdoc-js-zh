  md: "# Using Sessions\n\nNow you have a very basic HTTP-based user management application\
    \ (or part of an application) that can be improved in many ways. One way is to\
    \ provide some sort of authentication mechanism and session management, allowing\
    \ the users to log in with a username and password. First you need to set up the\
    \ session middleware, in the app.js file:\n\n```\napp.configure(function() {\n\
    \  app.set('views', __dirname + '/views');\n  app.set('view engine', 'jade');\n\
    \  app.use(express.bodyParser());\n  app.use(express.methodOverride());\n  app.use(express.cookieParser('my\
    \ secret string'));\n\n  app.use(express.session({\n    secret: 'my secret string',\n\
    \    maxAge: 360000\n  }));\n  app.use(app.router());\n  app.use(express.static(__dirname\
    \ + '/public'));\n});\n```\n\nHere you are setting the cookie parser middleware\
    \ with a secret string (which you should change) because, as covered before, the\
    \ session middleware requires the cookie parser middleware to be set up because\
    \ it maintains the session cookies.\n\nYou are also setting up the session middleware\
    \ and defining the shared secret and the maximum session age. The maximum session\
    \ defines the maximum amount of time a session will be kept alive on the server\
    \ without any use HTTP traffic.\n\nThen you need to create a session route listener,\
    \ which you can put in a file with the path routes/session.js (see Listing 21-10).\n\
    \n# LISTING 21-10: Session routes.\n\n```\n/*\n * Session Routes\n */\n\nvar users\
    \ = require('../data/users');\n\nmodule.exports = function(app) {\n\napp.dynamicHelpers({\n\
    \  session: function(req, res) {\n    return req.session;\n  }\n});});\n\napp.get('/session/new',\
    \ function(req, res) {\n  res.render('session/new', {title: \"Log in\"});\n```"
