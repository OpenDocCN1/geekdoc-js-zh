  md: "terminate. Some signals can be handled by the child process, and some others\
    \ are solely handled by the operating system.\n\nGenerally, you can send a signal\
    \ to a child process using the `child.kill` method, which by default sends the\
    \ child a `SIGTERM` signal like this:\n\n```\nvar spawn = require('child_process').spawn;\n\
    var child = spawn('sleep', ['10']);\nsetTimeout(function() {\n  child.kill();\n\
    }, 1000);\n```\n\nYou can also specify which signal to send by passing in a string\
    \ identifying the signal as the sole argument like this:\n\n```\nchild.kill('SIGUSR2');\n\
    ```\n\nNote that even though this method is called `kill`, the signal might not\
    \ end up killing your process. If the child process handles the signal, the default\
    \ signal behavior is overridden. A child process written in Node can override\
    \ a signal by defining a signal handler like this:\n\n```\nprocess.on('SIGUSR2',\
    \ function() {\n  console.log('Got a SIGUSR2 signal');\n});\n```\n\nNow, when\
    \ you're defining a signal handler for `SIGUSR2`, your process will not die if\
    \ it receives a signal, but should print `Got a SIGUSR2 signal` instead. Using\
    \ this mechanism, you can devise a simple way of communicating with or even commanding\
    \ child processes, which is not as rich as using the input stream, but is much\
    \ simpler.\n\n`SIGKILL` and `SIGSTOP` are special signals that are handled by\
    \ the operating system, and the processes cannot override the default behavior.\
    \ They end up terminating the process, even if you define a signal handler for\
    \ them.\n\n# SUMMARY\n\nIn this chapter you executed external commands using the\
    \ `child_process.exec` function, which allows you to define the environment variables\
    \ that you pass into the child process without command-line arguments.\n\nYou\
    \ also learned to spawn child processes that execute external commands using the\
    \ `child_process.spawn` method. Doing this allows you to interact with child processes\
    \ using the input and output streams, and to further communicate with or even\
    \ kill a child process using signals."
