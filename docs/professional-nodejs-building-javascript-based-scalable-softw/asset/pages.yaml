  md: "# SPAWNING CHILD PROCESSES\n\nAs you have seen, you can use the child_process.exec()\
    \ function to launch external processes. You get your callback invoked when process\
    \ ends. This approach is very simple, but it has some drawbacks:\n\n+   - Except\
    \ for the command-line arguments and the environment variables, using exec() does\
    \ not allow you to communicate with the child process.\n- The child process output\
    \ is buffered. As a result, you cannot stream it, and it can consume memory.\n\
    \nFortunately, Node's child_process module allows for finer-grained control when\
    \ launching, stopping, and generally interacting with child processes. You may\
    \ launch a new process, called the child process, from your application, which\
    \ is called the parent process. Once you've launched a new process, it is a two-way\
    \ communication channel, which both processes can use to send and receive data\
    \ strings to and from each other. The parent process can also exercise some control\
    \ over the child, sending signals and forcing it to terminate.\n\n# Creating the\
    \ Child Process\n\nYou can spawn a new child process based on the child_process.spawn\
    \ function, shown in Listing 8-5.\n\n> LISTING 8-5: Spawning a child process.\
    \ (chapter8/05_spawning_child.js)\n\n```\n// Import the spawn function defined\
    \ on child_process module\nvar spawn = require('child_process');\n\n// Launch\
    \ a child process with a \"tail -f /var/log/system.log\" command\nvar child =\
    \ spawn('tail', ['-f', '/var/log/system.log']);\n```\n\nHere you you spawn a child\
    \ process to run a tail command, passing in arguments -f and /var/log/system.log.\
    \ This tail command will monitor the file in /var/log/system.log — if it exists\
    \ — and output every new data appended to the stdout stream. The spawn function\
    \ returns a Child object, which is a handler object that encapsulates access to\
    \ the real process. Here you assign this new descriptor to the variable named\
    \ child.\n\n# Listening for Data from the Child Process\n\nAny child process handler\
    \ has a property named stdout that represents the child process standard output\
    \ as a stream. You can bind to the data event on that stream, which is the same\
    \ as saying \"for every data chunk you get from the child output, invoke this\
    \ callback.\" Here is an example of that happening:\n\n```\n// print output to\
    \ the console\nchild.stdout.on('data', function(data) {\n  console.log('tail output:\
    \ ' + data);\n});\n```"
  merge: -1
  pgno: 102
- img_proc: true
  md: "Every time the child process outputs any data into its standard output, the\
    \ parent process gets notified and prints it to the console.\n\nBesides the standard\
    \ output, processes also have another output stream by default named standard\
    \ error stream, which is usually the stream use to output error messages.\n\n\
    In this case, if the file /var/log/system.log does not exist, the tail process\
    \ will output something like tail: /var/log/system.log: No such file or directory.\
    \ By listening to stderr, the parent process can be notified of these errors.\n\
    \nThe parent process can also listen for data from that stream using something\
    \ like this:\n\n```\nchild.stderr.on('data', function(data) {\n  console.log('tail\
    \ error output:', data);\n});\n```\n\nThe stderr process is also a read stream,\
    \ just stdout. In this example, every time the child process writes to the standard\
    \ error output, the parent process gets notified and prints out that data.\n\n\
    # Sending Data to the Child Process\n\nBesides receiving data from a child process's\
    \ output streams, the parent process can also send data to the child by writing\
    \ to the child's standard input stream, represented by the childProcess.stdin\
    \ property.\n\nThe child can listen for data using the process.stdin read stream,\
    \ but note that you first must resume this stream, because it is on a paused state\
    \ by default.\n\nIn Listing 8-6 you will build an example with these parts:\n\n\
    +   + app: A simple application that receives integers on its standard input stream,\
    \ increments them, and outputs the integers incremented by one into the standard\
    \ output stream. application serves as an example of a process that does some\
    \ computation work that a Node process can use to outsource specific work.\n\n\
    +   - test client that spawns the +1 app, sends it random numbers, and prints\
    \ the results. This serves as an example of how a Node process can spawn a child\
    \ process and order it to perform specific tasks.\n\nA file named plus_oke.js\
    \ with the code in Listing 8-6.\n\nLISTING 8-6: The +1 app application example.(chapter8/06_plus_one.js)\n\
    \n```\n// pause the stdin stream\nprocess.stdin.resume();\nprocess.stdin.on('data',\
    \ function(data) {\n  var number;\n  try {\n    // parse the input data into a\
    \ number\n    number = parseInt(data.toString(), 10);\n```"
  merge: -1
