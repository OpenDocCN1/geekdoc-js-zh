  md: '# 8 Creating and Controlling External Processes


    WHAT''S IN THIS CHAPTER?


    +   - Launching commands and child processes

    - Sending and receiving data from a child process

    - Sending signals to and then terminating a child process


    Node is designed to handle I/O efficiently, but, as you''ve seen, some types of
    programs are not a good fit for this model. For instance, if you were to perform
    a CPU-intensive task using Node, you would be blocking the event loop, thus limiting
    your application responsiveness. Instead, CPU-intensive tasks should be assigned
    to a different process, freeing the event loop. Node allows you to spawn processes
    that become children of the process that launched them — the parent. In Node,
    a child process has a two-way channel to communicate with the parent process,
    and the parent process can monitor and control the child to some degree.


    Another instance of when you may want to use a child process is when you want
    to simply execute an external command from Node and get back the results once
    the command finishes. For instance, you may want to spawn a UNIX command, a script,
    or another type of utility that is not directly executable inside Node.


    This chapter shows you how to spawn external commands and create, communicate
    with, and terminate child processes. The point is to enable you to accomplish
    multiple tasks outside of the Node process.'
  merge: -1
  pgno: 96
- img_proc: true
  md: "# EXECUTING EXTERNAL COMMANDS\n\nWhen you need to launch an external shell\
    \ command or an executable file, you may do so by using the child_process module.\
    \ You can import this module like this:\n\n```\nvar child_process = require('child_process');\n\
    ```\n\nYou can then use the exec function that is defined in this module like\
    \ this:\n\n```\nvar exec = child_process.exec;\nexec(command, callback);\n```\n\
    \nThe first argument to the exec function is a string with the command as you\
    \ would launch it from the shell. The second argument is a function callback.\
    \ This callback will be later called by the exec function once the command terminates\
    \ or an error occurs. You should expect three arguments in this callback: error,\
    \ stdout, and stderr. Here is an example:\n\n```\nexec('ls', function(err, stdout,\
    \ stderr) {\n//\n});\n```\n\nIf an error occurs, the first argument will be an\
    \ instance of the Error class. If the first argument does not contain an error,\
    \ the second argument, stdout, will contain the command output. The last argument\
    \ will contain the command error output.\n\nListing 8-1 shows a more complete\
    \ example of executing an external command.\n\n# LISTING 8-1: Executing an external\
    \ command. (chapter8/01_external_command.js)\n\n```\n// import the exec function\
    \ defined on the child_process module\nvar exec = require('child_process').exec;\n\
