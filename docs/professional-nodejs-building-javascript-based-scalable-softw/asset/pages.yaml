  md: "```\nvar client = tls.connect(port, host, options, function() {\n  client.end('Bye\
    \ bye!');\n});\n```\n\n# BUILDING SOME EXAMPLES\n\nIt's time to put everything\
    \ together and create a TLS chat server and client. You need to create a separate\
    \ directory for the client and the server so you can easily separate the script,\
    \ key, and certificate files.\n\n# Creating a TLS Chat Server\n\nCreate a project\
    \ directory named `chat_server` into which you'll place the key and certificate\
    \ files.\nFirst create the server key:\n\n```\n$ openssl genrsa -out server_key.pem\
    \ 1024\n```\n\nThen create the certificate request:\n\n```\n$ openssl req -new\
    \ -key server_key.pem -out server_csr.pem\n```\n\nTo create a self-signed certificate\
    \ with the CSR, you can do this:\n\n```\n$ openssl x509 -req -in server_csr.pem\
    \ -signkey server_key.pem \\\n  -out server_cert.pem\n```\n\nNow that you have\
