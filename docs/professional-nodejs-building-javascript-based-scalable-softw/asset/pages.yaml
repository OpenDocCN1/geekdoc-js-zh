  md: "pair. When a new HTTP request happens, the agent will ask to keep the connection\
    \ alive. When the request is completed and no additional requests are waiting\
    \ on a socket to become free, the socket is closed. This means that you don't\
    \ have to manually close the HTTP client and that TCP connections will tend to\
    \ be reused when Node is under load.\n\nWhen you make a request and an available\
    \ socket gets selected or a new connection is created for that request, the `http.ClientRequest`\
    \ emits a `socket` event. After the request is done, sockets are removed from\
    \ the agent's pool when the socket emits a `close` event or an `agentRemove` event.\
    \ If you want to keep an HTTP request open for a long time, you can remove it\
    \ from the pool by doing something like this:\n\n```\nfunction handleResponseCallback(res)\
    \ {\n  console.log('got response:', res);\n}\n\nvar req = http.request(options,\
    \ handleResponseCallback);\n\nreq.on('socket', function(socket) {\n  socket.emit('agentRemove');\n\
    });\n```\n\nNode allows a maximum of five open sockets per host-port pair on a\
    \ given process. That means, under heavy load, Node will serialize the requests\
    \ to the same host-port to reuse the sockets. If this process is not optimal for\
    \ your usage pattern, you can disable agent socket pooling by passing in `agent:\
    \ false` in the options object:\n\n```\nvar options = {\n  host: \"my.server.com\"\
    ,\n  port: 80,\n  path: \"/upload\",\n  method: \"POST\",\n  agent: false\n};\n\
    \nhttp.request(options, handleResponseCallback);\n```\n\nYou can also change the\
    \ maximum number of open sockets allowed in the socket pool per host-port pair\
    \ by changing `http.Agent.defaultMaxSockets` like this:\n\n```\nvar http = require('http');\n\
    http.Agent.defaultMaxSockets = 10;\n```\n\nThe default is changed globally, which\
    \ means that new HTTP agents, when created, will use this default. Note that,\
    \ if you have already made requests to a given hostname and port, the respective\
    \ HTTP agent instance will have already been created, so changing this default\
    \ will have no effect.\n\nWhen making a request you can also specify the HTTP\
    \ agent like this:\n\n```\nvar http = require('http');\nvar agentOptions = {\n\
    \  maxSockets: 10\n};\n```"
