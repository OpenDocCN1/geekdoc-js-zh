  md: "# OPENING A FILE\n\nThe fs.stat() function passes an instance of the stats\
    \ class into the callback function, which you can use to call any of the following:\n\
    \n+   - isFile() Returns true if it is a standard file and not a directory, a\
    \ socket, a symbolic link, or a device.\n\n+   - isDirectory() Returns true if\
    \ the file is a directory.\n\n+   - isBlockDevice() Returns true if the file is\
    \ a device of the type block; in most UNIX systems this is generally under the\
    \ /dev directory.\n\n+   - isCharacterDevice() Returns true if the file is a device\
    \ of the character type.\n\n+   - isSymbolicLink() Returns true if the file is\
    \ a symbolic link to another file.\n\n+   - isFifo() Returns true if the file\
    \ is a FIFO (a special kind of UNIX pipe).\n\n+   - isSocket() Returns true if\
    \ the file is a UNIX domain socket.\n\nBefore you read or manipulate files, you\
    \ have to open them using the fs.open function. Then, a callback function you\
    \ provide is invoked for the file descriptor, which you can later use to read\
    \ or write to the open file.\n\n```\nvar fs = require('fs');\nfs.open('/path/to/file',\
    \ 'r', function (err, fd) {\n  // got fd descriptor\n});\n```\n\nThe first argument\
    \ to fs.open() is the file path. The second argument contains the flags, which\
    \ indicate the mode with the file should open. The flags can be r, r+, w, w+,\
    \ a, or a+. Here are the semantics of these flags (taken from the fopen manual\
    \ page):\n\n+   - r-Opens the file for reading. The stream is positioned at the\
    \ beginning of the file.\n\n+   - r+-Opens the file for reading and writing. The\
    \ stream is positioned at the beginning of the file.\n\n+   - w-Truncates the\
    \ file to zero length or creates a file for writing. The stream is positioned\
    \ at the beginning of the file.\n\n+   - w+-Opens the file for reading and writing.\
    \ The file is created if it does not exist. Otherwise it is truncated. The stream\
    \ is positioned at the beginning of the file.\n\n+   - a-Opens the file for writing.\
    \ The file is created if it does not exist. The stream is positioned at the end\
    \ of the file. Subsequent writes to the file will always end up at the end of\
    \ file.\n\n+   - a+-Opens the file for reading and writing. The file is created\
    \ if it does not exist. The stream is positioned at the end of the file. Subsequent\
    \ writes to the file will always end up at the current end of file."
