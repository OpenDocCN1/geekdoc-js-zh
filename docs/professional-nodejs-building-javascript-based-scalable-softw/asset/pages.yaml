- img_proc: true
  md: "In the beginning, the listing imports the user's fake database, which is just\
    \ a JSON structure you parse and load into memory.\n\n```\napp.get('/users', function(req,\
    \ res){\n  res.render('users/index', {title: 'Users', users: users});\n});\n```\n\
    \nThe listener for the `GET /users` route simply passes the users “database” into\
    \ the `views/users/index.jade` template. Now you need to change that template\
    \ to render the users, as shown in Listing 21-7.\n\n# LISTING 21-7: User list\
    \ template.\n\n```\nh1 Users\n\np\n  a(href=\"/users/new\") Create new profile\n\
    \nul\n  - for(var username in users) {\n  li\n    a(href=\"/users/\" + encodeURIComponent(username))=\
    \ users[username].name\n  - };\n```\n\nThis listing iterates over the users object,\
    \ rendering for each user a list item that contains a link to the detail URL.\
    \ Here you can see an example of a Jade template and how you can intersperse code\
    \ with markup.\n\nYou can now restart the server to test this new code.\n\nWhen\
    \ you point your browser to `http://localhost:3000/users` you should see the user\
    \ list rendered. If you click on one of those user links, you activate the following\
    \ route listener:\n\n```\napp.get('/users/:name', function(req, res, next){\n\
    \  var user = users[req.params.name];\n  if (user) {\n    res.render('users/profile',\
    \ {title: 'User profile', user: user});\n  } else {\n    next();\n  }\n});\n```\n\
    \nThis route listener uses the request param containing the username and uses\
    \ it to look up the user object. If a user is found, it is applied to the `users/profile.jade`\
    \ template. If not, the control is passed back to the middleware engine, which\
    \ in this case will render a “Not found” message.\n\nIf you click on one of the\
    \ users in the list, you will get an error screen stating that Express failed\
    \ to locate the `users/profile` template. You need to create this under `views/users/profile.jade`,\
    \ as shown in Listing 21-8."
