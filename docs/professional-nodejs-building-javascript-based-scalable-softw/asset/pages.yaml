  md: '# SUMMARY


    Making HTTP requests in Node is easy by using the http module request() function.
    This method returns an http.ClientResponse object that emits a response event
    once the server replies. You can also stream the response body and pipe it into
    another writable stream if you want. You can also inspect the HTTP response headers,
    status code, and HTTP version.


    To simplify making HTTP requests, you should probably use Mikeal Roger''s request
    module, which lets you use a URL in most cases. It has some useful features like
    following redirects, remembering cookies, buffering the response body, setting
    query-string values, setting a form-encoded or a JSON-encoded request body, and
    streaming.'
