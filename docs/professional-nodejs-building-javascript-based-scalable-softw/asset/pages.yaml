- img_proc: true
  md: "```\nArticleSchema.statics.search = function(str, callback) {\nvar regex =\
    \ new RegExp(str, 'i');\nreturn this.find({'$or': [{title: regex, body: regex]},\
    \ callback);\n}\n```\n\nNow you can create a route listener in routes/articles.js\
    \ to expose this functionality:\n\n```\napp.get('/articles/search', function(req,\
    \ res, next) {\n  console.log('searching for', req.query.q);\n  ArticleSchema.search(req.query.q,\
    \ function(err, articles) {\n    if (err) {\n      return next(err);\n    }\n\
    \    res.render('articles/index', {\n      title: 'Article search results',\n\
    \      articles: articles,\n      page: 0,\n      lastPage: true\n    });\n  });\n\
    });\n```\n\n> NOTE You should add this snippet before the app.get('/articles/:title')\
    \ route so that it takes precedence.\n\nYou can test this by restarting your server,\
    \ logging in, creating some articles, and trying URLs like this, where somestring\
    \ is replaced by a part of an existing article title or body.\n\n```\nhttp://localhost:3000/articles/searchq=somestring\n\
    ```\n\n# SUMMARY\n\nMongoose is a database access library that allows you to map\
    \ document-oriented objects into collections and documents in a MongoDB database.\
    \ Even though document databases allow unstructured data, Mongoose requires you\
    \ to define a schema for each collection where you specify the data types, the\
    \ indexes, default values, various validation functions, and other options.\n\n\
    You can then use these schemas in collection models that provide methods of searching,\
    \ inserting, and modifying documents. Also, you can enrich these collection models\
    \ and the returned document objects by defining new methods they provide build\
    \ on top of the existing ones.\n\nYou can also have references from one document\
    \ into another document in the same or a different collection by using the Schema.ObjectId\
    \ type and defining the target collection."
