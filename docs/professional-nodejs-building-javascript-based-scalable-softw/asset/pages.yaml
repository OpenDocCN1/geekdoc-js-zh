  md: '# ABOUT THE AUTHOR


    **PEDRO TEIXEIRA** is a prolific open-source programmer and author of many Node.js
    modules. After graduating with a degree in Software Engineering more than 14 years
    ago, he has been a consultant, a programmer, and an active and internationally
    known Node.js community member.


    He is a founding partner of The Node Firm and a Senior Programmer at Nodejitsu
    Inc., the leading Node.js platform-as-a-service provider. He is also the author
    of the popular Node Tuts screencasts.


    When Pedro was 10 years old, his father taught him how to program a ZX Spectrum,
    and since then he has never wanted to stop. He taught himself how to program his
    father''s Apple IIe and then entered the PC era. In college he was introduced
    to the universe of UNIX and open-source, becoming seriously addicted to it. In
    his professional life he has developed systems and products built with Visual
    Basic, C, C++, Java, PHP, Ruby, and JavaScript for big telecommunications companies,
    banks, hotel chains, and others.


    He has been a Node.js enthusiast since its initial development, having authored
    many applications and many well-known modules like Fugue, Alfred.js, Carrier,
    Nock, and more.'
