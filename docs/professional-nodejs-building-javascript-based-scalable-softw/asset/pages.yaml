  md: "You can now test the web application by starting your server:\n\n```\n$ node\
    \ app\n```\n\nPoint your browser to http://localhost:3000/users and try to create\
    \ user profiles with correct and incorrect e-mail addresses. You will see that\
    \ a validation error will trigger the callback with an error. If you print a Mongoose\
    \ error when a validation error occurs, it will look something like this:\n\n\
    ```\n{ message: 'Validation failed',\n  name: 'ValidationError',\n  errors:\n\
    \   { email:\n      { message: 'Validator \"regexp\" failed for path email',\n\
    \        name: 'ValidatorError',\n        path: 'email',\n        type: 'regexp'\
    \ } } }\n```\n\nYou can test for this type of error and handle it in the routes/users.js\
    \ file:\n\n```\napp.post('/users', notLoggedIn, function(req, res, next) {\n \
    \ User.create(req.body, function(err) {\n    if (err) {\n      if (err.code ===\
    \ 11000) {\n        res.send('Conflict', 409);\n      } else {\n        if (err.name\
    \ === 'ValidationError') {\n          return res.send(Object.keys(err.errors).map(function(errField)\
    \ {\n            return err.errors[errField].message;\n          }).join('. '),\
    \ 406);\n        } else {\n          next(err);\n        }\n\n      }\n      return;\n\
    \    }\n    res.redirect('/users');\n  });\n});\n```\n\nThis will present a crude\
    \ message to the users, but you can easily evolve this code and present a proper\
    \ in-context message instead.\n\nYou can also enumerate the allowed values for\
    \ a certain field. For instance, if you wanted to store the user's gender in a\
    \ gender field, you can make the changes shown in Listing 25-11 to the user schema."
