  pgno: 231
- img_proc: true
  md: "This middleware component simply exports a function that will be called by\
    \ Connect to handle new requests. This function writes the string \"Hello World\"\
    \ into the body and then ends the request. You can test this middleware component\
    \ by creating a Connect server, as shown in Listing 20-2.\n\n# LISTING 20-2: A\
    \ Connect server that uses the HelloWorld middleware.\n\n```\nvar connect = require('connect');\n\
    \n// import middlewares\nvar helloWorld = require('./hello_world');\n\nvar app\
    \ = connect.createServer(HelloWorld);\napp.listen(8080);\n```\n\nHere you are\
    \ creating a Connect HTTP server and initializing it with the HelloWorld middleware\
    \ component. Save this listing as a file named hello_world_app.js and run it:\n\
    \n```\nnode hello_world_app\n```\n\nPoint your browser to http://localhost:8080,\
    \ and you will see the \"Hello World!\" response rendered.\n\nYou can also create\
    \ a more generic component that responds with any optional text, as shown in Listing\
    \ 20-3.\n\n# LISTING 20-3: A more generic ReplyText middleware.\n\n```\nfunction\
    \ replyText(text) {\n  return function(req, res) {\n    res.end(text);\n  }\n\
    }\n\nmodule.exports = replyText;\n```\n\nInstead of directly exporting a function\
    \ that handles the request, this middleware component exports a function that,\
    \ when invoked, returns a function that replies with a custom text string.\n\n\
    You can change the server code to use this more generic component to behave the\
    \ same way, as shown in Listing 20-4.\n\n# LISTING 20-4: A Connect server that\
    \ uses the ReplyText middleware.\n\n```\nvar connect = require('connect');\n\n\
    // import middlewares\nvar replyText = require('./reply_text');\n\nvar app = connect.createServer(replyText('Hello\
    \ World!'));\napp.listen(8080);\n```"
