  md: '# SLICING A BUFFER


    Once you have created or received a buffer, you may want to extract a part from
    it. You can slice a buffer to create another smaller buffer, specifying the starting
    and ending positions like this:


    ```

    var buffer = new Buffer("this is the content of my buffer");

    var smallerBuffer = buffer.slice(8, 19);

    console.log(smallerBuffer.toString()); // -> "the content"

    ```


    Notice that when you slice a buffer no new memory is allocated and nothing is
    copied. The new buffer uses the parent buffer memory and just references start
    and/ end positions. This has some implications.


    First, if your program changes the parent buffer and any of that change touches
    the bytes of the child buffer, the child buffer will change. Because the parent
    and the child buffer are different JavaScript objects, this may not be obvious
    to you and can introduce some bugs.


    Second, when you create a smaller buffer from a parent buffer this way, the parent
    buffer has to be kept around after the operation and not be reclaimed by the garbage
    collector, which can easily introduce a memory if you are not careful.


    > NOTE If you are concerned that you will leak memory by keeping an old buffer
    around, you should use the copy method instead, covered in the next section.


    # COPYING A BUFFER


    You can copy part of a buffer into another buffer using the copy method like this:


    ```

    var buffer1 = new Buffer("this is the content of my buffer");

    var buffer2 = new Buffer(11);

    ```


    ```

    var targetStart = 0;

    var sourceStart = 8;

    var sourceEnd = 19;

    ```


    ```

    buffer1.copy(buffer2, targetStart, sourceStart, sourceEnd);

    console.log(buffer2.toString()); // -> "the content"

    ```


    Here, you are copying position 8 to 19 of the source buffer into position 0 of
    the target buffer.


    # DECODING A BUFFER


    A buffer can be converted into a UTF-8-encoded string like this:


    ```

    var str = buf.toString();

    ```'
