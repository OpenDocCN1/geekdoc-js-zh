  md: "# Building an Example Command-Line TCP Client\n\nFirst you need to launch the\
    \ TCP server in the background and leave it listening on port 4000, ready for\
    \ your client-to-be to connect to.\n\n# Connecting to the Server\n\nHere you are\
    \ connecting to the server port 4000 in the local host. You are also listening\
    \ for any error that may occur.\n\n```\nvar net = require('net');\nvar port =\
    \ 4000;\nvar conn = net.createConnection(port);\n\nconn.on('connect', function()\
    \ {\n  console.log('connected to server');\n});\n\nconn.on('error', function(err)\
    \ {\n  console.log('Error in connection:', err);\n});\n```\n\n# Sending the Command\
    \ Line to the Server\n\nWhen a Node process starts, process.stdin is a stream\
    \ prepared to accept user keyboard input. This ReadStream will emit \"data\" events,\
    \ but only after you resume it; that stream is initialized in the paused state.\
    \ You can resume it by calling the resume method on the stream:\n\n```\nprocess.stdin.resume();\n\
    ```\n\nNow you have a writable stream to the server and a readable stream from\
    \ the user input. You can glue them together using the pipe method like this:\n\
    \n```\nprocess.stdin.pipe(conn);\n```\n\nNow, every time the process.stdin is\
    \ flushed — which usually happens after the user enters a new line character —\
    \ the data is piped to the server through the conn writable stream.\n\n# Printing\
    \ Server Messages\n\nYou can print every message that the server sends to the\
    \ process standard output stream. The easiest way is to pipe the connection output\
    \ like this:\n\n```\nconn.pipe(process.stdout);\n```\n\nHowever, there is one\
    \ problem with .pipe(targetStream) it ends the target stream as soon as the source\
    \ stream ends, which means that the process standard output stream will close\
    \ after the connection is closed, which is not the effect you are looking for.\
    \ Fortunately, the .pipe() accepts an end option that, when set to false, prevents\
    \ that happening.\n\n```\nconn.pipe(process.stdout, {end: false});\n```"
  merge: -1
