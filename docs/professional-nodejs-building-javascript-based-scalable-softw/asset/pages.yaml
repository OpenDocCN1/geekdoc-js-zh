  md: "# UNDERSTANDING HOW NODE MODULES\n\nIn Node, modules are referenced by file\
    \ path or name. A module that is referenced by a name will eventually map into\
    \ a file path unless the module is a core module. Node's core modules expose some\
    \ Node core functions to the programmer, and they are preloaded when a Node process\
    \ starts.\n\nOther modules include third-party modules that you installed using\
    \ NPM (Node Package Manager) or local modules that you or your colleagues have\
    \ created.\n\nEach module of any type exposes a public API that the programmer\
    \ can use after the module is imported into the current script. To use a module\
    \ of any type, you have to use the require function like:\n\n```\nvar module =\
    \ require('module_name');\n```\n\nThis will import a module or module installed\
    \ by NPM. The require function returns an object that represents the JavaScript\
    \ API exposed by the module. Depending on the module, the object can be any JavaScript\
    \ value — an object with some properties that can be functions, an array, or any\
    \ other type of JavaScript object.\n\n# EXPORTING A MODULE\n\nThe CommonJS module\
    \ system is the only way you can share objects or functions among files in Node.\
    \ For a sufficiently complex application you should divide some of the classes,\
    \ objects, or functions into reusable well-defined modules. To use the module,\
    \ a module exposes exactly what you specify it to.\n\nIn Node, files and modules\
    \ are one-to-one correspondence, which you can see in the following example. Start\
    \ by creating a file named circle.js, which just exports the Circle constructor:\n\
    \n```\nfunction Circle(x, y, r) {\n\n  function r_squared() {\n    return Math.pow(r,\
    \ 2);\n  }\n\n  function area() {\n    return Math.PI * r_squared();\n  }\n\n\
    \  return {\n    area: area\n  };\n}\n\nmodule.exports = Circle;\n```\n\nThe important\
    \ bit here lies on the last line, where you define what is to be exported by the\
    \ module. module is a variable that represents the module you are currently in.\
    \ module.exports is the object"
