- img_proc: true
  md: '> NOTE In JavaScript, a value that can be used successfully inside an it statement
    is said to be truthful. Truthy values are usually defined by all possible values,
    minus the falsy values, which are:


    * false

    * null

    * undefined

    * The empty string ""

    * The number 0

    * The number NaN


    In this and other assertion functions, you can also provide a message as the last
    argument, providing more information that is shown when the test fails:


    ```

    assert(a, ''a should be truthful'');

    ```


    You can use this alias to determine whether a value is truth:


    ```

    assert.ok(a, ''a should be truthful'');

    ```


    assert also tests for equality in two ways: shallow or deep. Shallow equality
    just tests the objects you provide and doesn''t test the equality of objects embedded
    inside the objects you provided. In contrast, deep equality recursively tests
    all the nested objects. Shallow equality is normally used to compare scalar objects
    like strings and numbers, while deep equality is used to compare two objects.


    You test shallow equality like this:


    ```

    assert.equal(a, 10, ''a should be 10'');

    ```


    This operator is equivalent to the JavaScript equality operator (==), which means
    that the assertion below is valid:


    ```

    assert.equal(''10'', 10);

    ```


    You can also use the reverse — the inequality assertion — which is the equivalent
    of the JavaScript inequality operator (!=). It makes the following assertion fail:


    ```

    assert.notEqual(''10'', 10);

    ```


    The assert module also supports the strict equality semantics, similar to the
    JavaScript equality operator (===). The following assertion fails:


    ```

    assert.strictEqual(''10'', 10, ''string should equal to number 10'');

    ```'
