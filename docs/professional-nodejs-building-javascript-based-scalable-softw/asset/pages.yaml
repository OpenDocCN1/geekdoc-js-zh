- img_proc: true
  md: "Express routing, strings prefixed by : are handled as placeholders, and the\
    \ captured value will match any string except for the character .\n\nNow you can\
    \ start the server:\n\n```\n$ node app\n```\n\nThen you can point a web browser\
    \ to http://localhost:3000. You should then see the default index view rendered.\
    \ If you go the URL http://localhost:3000/users, you will see an error message\
    \ rendered, and the server output should contain something like this:\n\n> failed\
    \ to locate view \"index/\", tried:\n- /Users/username/projects/my_app/views/users/index.jade\n\
    - /Users/username/projects/my_app/views/users/index.jade\n- /Users/username/projects/my_app/views/users/../index.jade\n\
    \nExpress helps you with the location of the missing template file. Now you must\
    \ create the file shown in Listing 21-4 within views/users/index.jade.\n\n# LISTING\
    \ 21-4: The users list view.\n\nh1 Users\n\np User list should be here\n\nAfter\
    \ you have saved this file and refreshed the page, you will see a simple HTML\
    \ page containing a placeholder for the user list. Just to simplify rendering,\
    \ you will now create a list of fake user data under data/users.json. .json with\
    \ some content, as shown in Listing 21-5.\n\n# LISTING 21-5: Fake users.\n\n```\n\
    {\n  \"frank\": {\n    \"username\": \"frank\",\n    \"name\": \"Frank Sinatra\"\
    ,\n    \"bio\": \"Singer\"\n  },\n\n  \"jobim\": {\n    \"username\": \"jobim\"\
    ,\n    \"name\": \"Antonio Carlos Jobim\",\n    \"bio\": \"Composer\"\n  },\n\n\
    \  \"fred\": {\n    \"username\": \"fred\",\n    \"name\": \"Fred Astaire\",\n\
    \    \"bio\": \"Dancer and Actor\"\n  }\n}\n```"
