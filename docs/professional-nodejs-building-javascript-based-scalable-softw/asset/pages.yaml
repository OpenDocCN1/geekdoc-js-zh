  md: "```\n// connection closed\n});\n\nsocket.write('Some string');\n\n}).listen(4001);\n\
    ```\n\nOn line 1 you use the createServer() method is listening on the net package,\
    \ which you bind to TCP port 401 on line 14. You can also pass in a callback function\
    \ to createServer every time there is a 'connection' event. Inside this callback\
    \ you will be handed a socket object, which you can use to send and receive data\
    \ to and from the client.\n\nBecause the server object is an event emitter, and\
    \ you can listen to events during its lifecycle, net.server emits the following\
    \ events:\n\n+   * \"listening\" — When the server is listening on the specified\
    \ port and address.\n* \"connection\" — When a new connection is established.\
    \ The callback to this function will receive the corresponding socket object.\
    \ You can also bind to this event by passing a function to net.createServer(),\
    \ like you did in the last example.\n* \"close\" — When the server is closed,\
    \ that is, it's not bound to port any more.\n* \"error\" — When an error occurs\
    \ at the server level. An error event happens, for instance, when you try to bind\
    \ an occupied port or to a port you don't have permission to bind to.\n\nListing\
    \ 10-1 has an example of outputting the lifecycle of a server.\n\n# LISTING 10-1:\
    \ Lifecycle of a TCP server.\n\n```\nvar server = require('net').createServer();\n\
    \nvar port = 4001;\n\nserver.on('listening', function() {\n  console.log('Server\
    \ is listening on port', port);\n});\n\nserver.on('connection', function(socket)\
    \ {\n  console.log('Server has a new connection');\n  socket.end();\n  server.close();\n\
    });\n\nserver.on('close', function() {\n  console.log('Server is now closed');\n\
    });\n\nserver.on('error', function(err) {\n  console.log('Error occurred:', err.message);\n\
    });\n\nserver.listen(port);\n```"
