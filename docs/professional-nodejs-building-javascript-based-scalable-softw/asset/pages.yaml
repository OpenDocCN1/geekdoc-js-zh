  md: "# CHAPTER 8 CREATING AND CONTROLLING EXTERNAL PROCESSES\n\nLISTING 8-7 (continued)\n\
    \n```\nchild.stderr.on('data', function(data) {\n  process.stdout.write(data);\n\
    });\n```\n\nHere you launch the +1 app as a child process on lines 1 to 4.\n\n\
    Then you use the setInterval function to do the following every second:\n\n+ \
    \  * Create a random natural number smaller than 10,000.\n* Send data as a string\
    \ to the child process.\n* Wait for the child process to reply with a string.\n\
    \nBecause you want to listen for data back from the child only once per number,\
    \ you will use child.stdout and not child.stdin. If you used the latter, you would\
    \ register multiple callback functions as time went. Each callback function would\
    \ be called every time you got data from the child stdout, which would end up\
    \ printing the data multiple times and erroneously.\n\n# Receiving Notification\
    \ when the Child Process Exits\n\nWhen a child process exits, an event is triggered\
    \ on the parent. Listing 8-8 shows how to listen to this event.\n\nLISTING 8-8:\
    \ Listening for the child exit event. (chapter8/09_listen_child_exit.js)\n\n```\n\
    var spawn = require('child_process').spawn;\n\n// Spawn the child with a 'ls -la'\
    \ command\nvar child = spawn('ls', ['-la']);\n\nchild.stdout.on('data', function(data)\
    \ {\n  console.log('data from child: ' + data);\n});\n\n// When child exits:\n\
    child.on('exit', function(code) {\n  console.log('child process terminated with\
    \ code ' + code);\n});\n```\n\nHere, on the last lines of body, you are listening\
    \ to the child exit event, and when it occurs, you print that to the console.\
    \ The child process exit code is passed into the callback function as the first\
    \ argument. Some programs use an exit code other than 0 as a way of signaling\
    \ failures. For instance, if you try to execute the command ls -la filename.txt\
    \ and there is no file named filename.txt on your current directory, you get an\
    \ exit code of 1, as you will try running the example in Listing 8-9."
