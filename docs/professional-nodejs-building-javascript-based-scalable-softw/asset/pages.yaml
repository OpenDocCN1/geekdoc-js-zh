  md: 'Line 7 pauses the readable stream if the write command cannot flush it to the
    kernel. Line 11

    resumes the readable stream when the writable stream is drained.


    # Using stream.pipe() to Prevent the Slow Client Problem and

    Assembling Readable and Writable Streams Using pipe()


    This process of pausing the readable stream until the writable stream catches
    up and-

    is it a recurring pattern that fortunately has been captured in Node, under the
    stream.pipe()

    command.


    This command is part of the readable stream interface — making the object pipe

    source — and accepts a destination writable stream as first argument.


    Here is the previous example using pipe:


    ```

    require(''http'').createServer(function(req, res) {

    var rs = fs.createReadStream(''/path/to/big/file'');

    rs.pipe(res);

    }).listen(8080);

    ```


    By default, end() is called on the destination when the readable stream ends.
    You can prevent

    behavior by passing in end: false on the second argument options object like this:


    ```

    require(''http'').createServer(function(req, res) {

    var rs = fs.createReadStream(''/path/to/big/file'');


    rs.pipe(res, { end: false });


    rs.on(''end'', function() {

    res.write("And that''s all, folks!")

    nres.end();

    })

    .listen(8080);

    ```


    Here you are pushing the string "And that''s all, folks!" when the file ends,
    and ending

    request yourself instead of relying on the stream.pipe() method to do it for you.


    # SUMMARY


    A stream is a wonderful abstraction that allows you to leverage Node''s architecture
    to easily

    implement streaming from any object that implements the API.


    The stream interface allows you to control the flow to mitigate the slow client
    problem, whereby

    you can pause and resume a readable stream. You can automate this process using
    the

    stream.pipe() method, also available in any readable stream instance.'
