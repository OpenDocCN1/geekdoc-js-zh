  md: "You can launch this example and, while the server is running, connect to it\
    \ by using `telnet` or `nc` like so:\n\n```\n$ telnet localhost 4001\n\nor\n\n\
    $ nc localhost 4001\n```\n\nOnce you connect, the server will disconnect you (because\
    \ you told it to in line 11) and then close (in line 12). You should see the following\
    \ output on the server console:\n\n```\nServer is listening on port 4001\nServer\
    \ has a new connection\nServer is now closed\n```\n\n# Using the Socket Object\n\
    \nWhen you get a “connection” event you are also handed the `socket` object as\
    \ the first argument of the callback function. This `socket` object is both a\
    \ read and a write stream, which means that it emits “data” events when it gets\
    \ a package of data and emits the “end” event when that connection is closed.\n\
    \nBecause the `socket` object is also a writable stream, that means you can write\
    \ buffers or strings to the socket by using `socket.write()`. You can tell the\
    \ socket that it should terminate the connection after all data has been written\
    \ by calling `socket.end()`. Listing 10-2 has an example TCP server that simply\
    \ echoes what you write.\n\n```\nLISTING 10-2: Simple echo TCP server.\n\nvar\
    \ server = require('net').createServer(function(socket) {\n    console.log('new\
    \ connection');\n\n    socket.setEncoding('utf8');\n\n    socket.write(\"Hello!\
    \ You can start typing. Type 'quit' to exit.\\n\");\n\n    socket.on('data', function(data)\
    \ {\n        console.log('got:', data.toString())\n        if (data.trim().toLowerCase()\
    \ === 'quit') {\n            socket.write('Bye bye!');\n            return socket.end();\n\
    \        }\n        socket.write(data);\n    });\n\n    socket.on('end', function()\
    \ {\n        console.log('Client connection ended');\n    });\n\n}).listen(4001);\n\
    ```"
