  md: "You can achieve this by piggybacking the Socket.IO server on a regular Node.js\
    \ HTTP server and serving the HTML through this HTTP server. Sounds complicated?\
    \ It's not, as Listing 22-3 shows.\n\n# LISTING 22-3: Serving the HTML file with\
    \ Node.js HTTP server.\n\n```\nvar httpd = require('http').createServer(handler);\n\
    var io = require('socket.io').listen(httpd);\nvar fs = require('fs');\n\nhttpd.listen(4000);\n\
    \nfunction handler(req, res) {\n    fs.readFile(__dirname + '/index.html',\n \
    \       function(err, data) {\n            if (err) {\n                res.writeHead(500);\n\
    \                return res.end('Error loading index.html');\n            }\n\n\
    \            res.writeHead(200);\n            res.end(data);\n        }\n    );\n\
    }\n\nio.sockets.on('connection', function (socket) {\n    socket.on('my event',\
    \ function(content) {\n        console.log(content);\n    });\n});\n```\n\nWhat\
    \ happens here is that the WebSocket server links into the HTTP server and listens\
    \ to certain requests. Whenever a client requests anything below `/socket.io`,\
    \ Socket.IO handles these requests, returning the `socket.io.js` script or setting\
    \ up a WebSocket connection. Any other request receives the `index.html` file\
    \ as a response.\n\nNow you can point your browser to `http://localhost:4000/`\
    \ — the string \"Hello World.\" will be logged to the console of your server.\n\
    \nNext, you will see how to rewrite this example code as a full application.\n\
    \n# Building a Real-Time Web Chat with Socket.IO\n\nNode.js provides the building\
    \ blocks for any real-time application on the web: It's based on the web standard\
    \ JavaScript and is non-blocking at heart, which is crucial for enabling real-time\
    \ behavior.\n\nTherefore it's no surprise that the poster child of real-time web\
    \ applications, that is, browser-based chatrooms, have become the most popular\
    \ example application for demonstrating Node.js capabilities."
  merge: -1
  pgno: 278
- img_proc: true
  md: "The example application is a good starting point for a basic chat application.\
    \ It needs to be extended on the server and the client side, which is explained\
    \ step by step in the following sections.\n\n# Application Structure and Use Case\n\
    \nThe application is very simple. The user interacts with the chat system through\
    \ a very frugal interface that provides only two elements — the text input field\
    \ and an area that displays all received chat messages.\n\nWhen the user types\
    \ text into the input field and presses Enter, the entered text is sent to the\
    \ server via Socket.IO. Whenever a message is received on the Socket.IO connection,\
    \ the client will add it to the message area.\n\nEvery client will receive all\
    \ messages sent by any other client, and these messages are echoed back as well.\n\
    \n# The Chat Server\n\nYou'll first rewrite the server application created in\
    \ Listing 22-3. You need to listen for new connections and new messages. Whenever\
    \ a new message from a client arrives, you need to echo it back to the client,\
    \ and then broadcast it to all other connected clients. You could implement the\
    \ broadcasting part by keeping an array of all currently connected clients, but\
    \ this is not necessary — Socket.IO already provides a convenient broadcast mechanism\
    \ that sends messages to all connected sockets, except the one that sent the message.\n\
    \nBecause the file serving part of the chat server doesn't need to be changed,\
    \ you just need to rewrite the part that handles socket connections:\n\n```\n\
    io.sockets.on('connection', function (socket) {\n    socket.on('clientMessage',\
    \ function(content) {\n        socket.emit('serverMessage', 'You said: ' + content);\n\
    \        socket.broadcast.emit('serverMessage', socket.id + ' said: ' + content);\n\
    \    });\n});\n```\n\nYou now need to listen to `clientMessage` events on each\
    \ connection socket, handle these events by echoing the content back to the sender,\
    \ and emit them to all other clients. To make chat messages distinguishable on\
    \ the client, you prefix messages with either `You said:` or `<client id> said:`,\
    \ whereby `client id` is the internal socket ID number for now.\n\nAgain, the\
    \ name of the incoming event is not a special keyword that bears any meaning in\
    \ regard to Socket.IO — it's a label that can be chosen at will. Of course, you\
    \ need to make sure that the client uses the same label when emitting messages\
    \ on the socket.\n\nListing 22-4 shows how the full server code looks at this\
    \ point."
