  md: '# CHAPTER 18 DEBUGGING MODULES AND APPLICATIONS


    This last snippet prints the following:


    { a: 1, b: 2 }


    This simple example passes in an object that is translated into a literal string
    representation. You can pass in any type of object, and console.log will inspect
    its properties and values.


    > NOTE Actually, console.log does not do any formatting. All the formatting is
    done by the util.format function. Whatever arguments you pass in to console.log
    are handed over to util.format, and the result is flushed to the standard output
    stream. This means that any of these example calls to console.log can be directly
    applied to util.format.


    The console.log function inspects only the object''s own enumerable properties,
    which means properties on the prototype chain and properties that are not enumerable
    are not shown. As an example, this code instantiates an EventEmitter on the Node
    code:


    ```

    > var EventEmitter = require(''events'').EventEmitter;

    undefined

    > var emitter = new EventEmitter();

    undefined

    > console.log(emitter);

    undefined

    > emitter.on(''data'', function () { });

    { events: { data: [Function] } }

    > console.log(emitter);

    { events: { data: [Function] } }

    undefined

    ```


    In the previous interactive example, you can see that the first time you call
    console.log on the emitter variable value, it prints an empty object. This is
    because the emitter has no properties set at the time of construction. Then, after
    you attach an event listener, it gains a property named _events, which is printed
    on the following console.log call.


    The console.log function can also comprehensibly log arrays:


    ```

    > var arr = [1, 2, 3];

    undefined

    > console.log(arr);

    [ 1, 2, 3 ]

    undefined

    ```


    The console.log function also provides — via the util.format function — the ability
    to interpolate values into strings, where placeholders are prefixed by % inside
    a string like this:


    ```

    > console.log(''an object: %j and a number: %d'', {a:1, b:2}, 0xfa);

    an object: {"a":1,"b":2} and a number: 250

    undefined

    ```


    *'
