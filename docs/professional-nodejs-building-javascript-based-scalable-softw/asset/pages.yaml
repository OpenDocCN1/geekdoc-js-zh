- img_proc: true
  md: "# CHAPTER 2 INTRODUCING NODE\n\nstructures, forcing them to foresee every possible\
    \ way threads can be scheduled to execute to try to prevent problems. If the application\
    \ relies heavily on a shared state between threads, this type of programming can\
    \ easily lead to strange bugs that happen at random and are usually difficult\
    \ to find.\n\nAn alternative to having the operating system scheduling the execution\
    \ for you is to use cooperative multi-threading. In this scheme you are responsible\
    \ for explicitly relinquishing the CPU to give time for another thread to execute.\
    \ Because you are now responsible for thread scheduling, this can relax the synchronization\
    \ requirements. However, this approach can become complex and error-prone for\
    \ the same reasons as regular multi-threading.\n\n# INTRODUCING THE EVENT-DRIVEN\
    \ PROGRAMMING STYLE\n\nEvent-driven programming is a programming style whereby\
    \ the flow of execution is determined by events. Events are handled by event handlers\
    \ or event callbacks. An event callback is a function that is invoked when something\
    \ significant happens — such as when the result of a database query is available\
    \ or the user clicks on a button.\n\nConsider how a query to a database is handled\
    \ in typical blocking I/O programming:\n\n```\nresult = query('SELECT FROM posts\
    \ WHERE id = 1');\ndo_something_with(result);\n```\n\nThis query requires that\
    \ the current thread or process wait until the database layer finishes processing\
    \ it.\n\nIn event-driven systems, this query would be performed in this way:\n\
    \n```\nquery_finished = function() {\n  do_something_with(result);\n}\nquery('SELECT\
    \ FROM posts WHERE id = 1', query_finished);\n```\n\nHere you are first defining\
    \ what will happen when the query is finished and storing that in a function named\
    \ query_finished. When it's finished, the query will invoke the query_finished\
    \ function, instead of simply returning the result.\n\nThis style of programming\
    \ — instead of waiting when interesting events occur — is called event-driven\
    \ or asynchronous programming. This is one of the defining features of Node. means\
    \ the current process will not block when it is doing I/O. Therefore several I/O\
    \ operations can occur in parallel, and each respective callback will be invoked\
    \ when the operation finishes.\n\nThe event-driven programming style is accompanied\
    \ by an event loop. An event loop is a construct that mainly performs two functions\
    \ in a continuous loop — event detection and handler triggering. In any run of\
    \ the loop, it has to detect which events just happened. Then, when an event happens,\
    \ the event loop must determine the event callback and invoke it."
