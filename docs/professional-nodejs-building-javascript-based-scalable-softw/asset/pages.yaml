  md: '# Using the HTTP Middleware Bundled in Connect


    > NOTE You see here that you are using an alternative syntax for creating the
    server and attaching the middleware. Here you''re creating the server by invoking
    the module function and then adding middleware to it by using the .use() method.
    This is an alternative to the previous syntax you saw, which can be more convenient
    because because it doesn''t require you to pass all the middleware components
    at the time of creation.


    You can save this code listing as a file named logger.js and run it like this:


    ```

    $ node logger

    ```


    Now, if you point your browser to http://localhost:8080, you will observe something
    like this in your server output:


    ```

    127.0.0.1 - [Sat, 23 Jun 2012 15:23:08 GMT] GET / HTTP/1.1" 200 - "-"Mozilla/5.0
    (Macintosh; Intel Mac OS X 10_7_4) AppleWebKit/536.5 (KHTML, like Gecko) Chrome/19.

    0.1084.54 Safari/536.5

    127.0.0.1 - [Sat, 23 Jun 2012 15:23:08 GMT] GET /favicon.ico HTTP/1.1" 200 - "-"Mozilla/5.0
    (Macintosh; Intel Mac OS X 10_7_4) AppleWebKit/536.5 (KHTML, like Gecko)

    Chrome/19.01084.5 Safari/536.5

    ```


    You can see that your server is outputting some request and response details.
    This is because the browser also requests the /favicon.ico URL, looking for a
    favorite icon to show in the URL bar.


    Here you can also see that the logger is outputting the remote client address,
    followed by the current date, the HTTP method, the HTTP version, the response
    status code, the response content length, the referrer, and the user agent string.
    This is the default format of the logging statement, and you can change it at
    will. You can choose to log almost every element available on the request (and
    you''ll soon how), but there are some predefined shortcuts for the short and tiny
    formats. You need to specify the format when creating the middleware:


    ```

    app.use(connect.logger(''tiny''));

    ```


    If you change the format to tiny and restart the server, it will output something
    like:


    ```

    GET / 200 - ms

    GET /favicon.ico 200 - 2 ms

    ```


    This format will output the HTTP method, URL, HTTP status code, content length
    header (not present in this case), and response time.

    You can choose a more verbose output than the "short" one, which will output something
    like the following:


    ```

    127.0.0.1 - GET / HTTP/1.1 200 - ms

    127.0.0.1 - GET /favicon.ico HTTP/1.1 200 - 1 ms

    ```'
