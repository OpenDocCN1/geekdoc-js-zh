  md: "```\nLISTING 25-26: The article creation form in views/articles/new.jade.\n\
    \nh1 New Article\n\nform(method=\"POST\", action=\"/articles\")\n    p\n     \
    \   label(for=\"title\") Title<br />\n        input#title(name=\"title\")\n  \
    \  p\n        label(for=\"body\") Body<br />\n        textarea#body(name=\"body\"\
    )\n    p\n        input(type=\"submit\", value=\"Create\")\n```\n\n# Defining\
    \ Instance Methods\n\nNow you want to be able to list the most recent articles\
    \ for a given user. To do this, you can create the query directly inside the user\
    \ route listener, but that would not be the right place to do so. Instead, you'll\
    \ create an instance method on the user object by attaching a method to the user\
    \ schema before the module exports at the end of file data/schemas/user.js, like\
    \ this:\n\n```\nUserSchema.methods.recentArticles = function(callback) {\n   \
    \ return this.model('Article')\n        .find({author: this._id})\n        .sort('created_at',\
    \ 1)\n        .limit(5)\n        .exec(callback);\n};\n```\n\nNow you can use\
    \ this instance method to retrieve a list of the last five articles of a given\
    \ user. Change the GET '/users/:name' route listener in file routes/users.js to\
    \ retrieve the most recent user articles so you can list them:\n\n```\napp.get('/users/:name',\
    \ loadUser, function(req, res, next){\n    req.user.recentArticles(function(err,\
    \ articles) {\n        if (err) {\n            return next(err);\n        }\n\
    \        res.render('users/profile', {\n            title: 'User profile',\n \
    \           user: req.user,\n            recentArticles: articles\n        });\n\
    \    });\n});\n```"
