  md: "# Writing Data into a Stream\n\nYou can write to a writable stream by passing\
    \ it a buffer or a string like this:\n\n```\nvar writable_stream = ...;\nwritable_stream.write('this\
    \ is an UTF-8 string');\n```\n\nIf you are passing a string as the first argument,\
    \ you can specify the string encoding by passing it in the second argument. Otherwise,\
    \ the stream assumes the string is UTF-8-encoded.\n\nHere is an example of passing\
    \ in an alternative encoding:\n\n```\nvar writable_stream = ...;\nwritable_stream.write('7e3e4acde5acde240a8ef5e731644fbd1',\
    \ 'base64');\n```\n\nAs stated earlier, you can simply pass in a buffer to write:\n\
    \n```\nvar writable_stream = ...;\nvar buffer = new Buffer('this is a buffer with\
    \ some string');\nwritable_stream.write(buffer);\n```\n\nOnce you write to a stream,\
    \ Node can immediately flush the data to the kernel buffer, or if that's not possible\
    \ at the time, Node will store it in a queue in memory. You can determine which\
    \ event occurred by observing the return value of the call to writable_stream.write().\
    \ The write command returns a value that is true when the buffer was flushed and\
    \ false when the buffer was queued. Later in this chapter you'll see how this\
    \ information can become helpful.\n\n# Waiting for a Stream to Drain\n\nBecause\
    \ Node does not block on I/O, it does not block on read or write commands. As\
    \ you've seen, on write commands you know if the buffer was immediately flushed.\
    \ If it was not flushed, it's stored in your process memory.\n\nLater, when the\
    \ stream manages to flush all the pending buffers, it emits a drain event that\
    \ you can listen to:\n\n```\nvar writable_stream = ...;\nwritable_stream.on('drain',\
    \ function() {\n  console.log('drain emitted');\n});\n```\n\nLater in this chapter\
    \ you'll see draining notifications combined with the pause and resume capabilities\
    \ can come handy for limiting the memory growth of your Node process.\n\n# CONSIDERING\
    \ SOME STREAM EXAMPLES\n\nSo far you've been introduced to the abstract streams\
    \ interface. Let's look at some examples where Node implements this."
  merge: -1
  pgno: 111
