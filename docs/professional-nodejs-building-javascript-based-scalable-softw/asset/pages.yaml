  md: '# # 22 Making Universal Real-Time Web Applications Using Socket.IO


    # ### WHAT''S IN THIS CHAPTER?


    +   - Understanding the history of HTTP in relation to real-time applications

    - Understanding how WebSockets enable real-time applications on the web

    - Using Socket.IO to write real-time applications for Node.js

    - Writing a web-based real-time chat with Socket.IO for Node.js

    - Using namespaces to separate Socket.IO apps

    - Scaling to several Node processes with Redis


    For many years, HTTP and real-time applications didn''t really go together very
    well. The reason lies in the very nature of the HTTP protocol, which is stateless
    and based on a request-response cycle — an HTTP server only reacts upon requests
    from the client but doesn''t have a stateful continuous connection to the client.


    An HTML and JavaScript-based application is capable of reacting to client events
    and sending them to the server, but the reverse is not easy. If an event on the
    server occurs, the server has no way of actively informing its clients about this
    event in real time. Only when clients ask the server for its current state can
    the information be delivered from the server to its clients.


    A browser-based chat is a good example of a web-based real-time application that
    shows the limitations of HTTP. Multiple users share a chatroom, which technically
    means that a message sent by any of the participating users needs to be delivered
    to all other users in the same room.'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'To achieve real-time, or at least near real-time, behavior in traditional web
    chats, certain workarounds were common. In its simplest form, the traditional
    request-response flow was used: The browser of every chat user polled the HTTP
    server at regular intervals for new messages. Polling fast enough, such as every
    second or less, gave the impression of interacting in real time.


    However, this technique was highly inefficient; the client had to poll every second,
    even if no new messages were available, and the server had to handle a request
    from all connected chat users every second, even if no new messages were available.
    In a chatroom where new messages where posted only every 10 seconds, the clients
    and the server had to do a lot of computation, which in 90 percent of the cases
    wasn’t necessary.


    More clever workarounds were developed, but they were all still based on the request-response
    cycle, only using it in slightly more efficient ways. *Long polling* is a technique
    whereby the client sends a request to the server only once, and then the server
    keeps this connection open, sending new data whenever it’s available. But because
    HTTP was never designed for this kind of use, implementations remained hacky —
    browsers showed different behaviors when faced with long-running request responses,
    and keeping the connection open usually resulted in inefficient load behavior
    on the server.


    Today, the situation is much better. The WebSocket protocol was developed (and
    recently standardized) to overcome the shortcomings of HTTP in relation to real-time
    applications, which now enables HTTP clients and browsers to talk to each other
    in an efficient and full-duplex way, without the need for workarounds.


    For the first time, real-time web applications can use only web technologies,
    without the need to for external technologies like Java Applets, Flash, or ActiveX.


    # UNDERSTANDING HOW WEBSOCKETS WORK


    At its core, a WebSocket connection is just a conventional TCP connection between
    an HTTP server and an HTTP client. It’s established using a handshake protocol,
    which is very similar to an HTTP handshake.


    The client initializes the connection. To do this, the browser sends a special
    HTTP/1.1 request to the server, asking it to turn the connection of this request
    into a WebSockets connection:


    ```

    GET /chat HTTP/1.1

    Host: server.example.com

    Upgrade: websocket

    Connection: Upgrade

    Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==

    Origin: http://example.com

    Sec-WebSocket-Protocol: chat, superchat

    Sec-WebSocket-Version: 13

    ```'
  merge: -1
  pgno: 275
- img_proc: true
  md: "Although this starts out as a regular HTTP connection, the client asks to “upgrade”\
    \ this connection to a WebSocket connection. If the server supports the WebSocket\
    \ protocol, it answers like this:\n\n```\nHTTP/1.1 101 Switching Protocols\nUpgrade:\
    \ websocket\nConnection: Upgrade\nSec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\n\
    Sec-WebSocket-Protocol: chat\n```\n\nThis marks the end of the handshake, and\
    \ the connection switches to data transfer mode. Both sides can now send messages\
    \ back and forth without any HTTP overhead or additional handshakes, making it\
    \ a bi-directional full-duplex communication connection in which both client and\
    \ server can send messages to one another at any time without having to wait for\
    \ one another.\n\n# USING SOCKET.IO TO BUILD WEBSOCKET APPLICATIONS\n\nAlthough\
    \ implementing your own WebSocket server for Node.js is possible, it’s not necessary.\
    \ Many low-level details need to be taken care of before you can implement an\
    \ actual application on top of it, which makes using a library a lot more practical.\n\
    \nThe de facto standard library for building WebSocket Node.js applications is\
    \ Socket.IO. Not only is it a wrapper library that makes building WebSocket servers\
    \ very convenient, it also provides transparent fallback mechanisms like long\
    \ polling for clients that don’t support the WebSocket protocol. Furthermore,\
    \ it ships with a client-side library that provides a convenient API for developing\
    \ the browser part of the application.\n\nUsing Socket.IO, you never need to grapple\
    \ with the low-level implementation details of a WebSocket server or client. You\
    \ get a clean and expressive API on both sides, which allows writing real-time\
    \ applications with ease.\n\n# Installing and Running Socket.IO on the Server\n\
    \nLike many other Node.js libraries, Socket.IO ships as an NPM module and can\
    \ therefore be installed with the following:\n\n```\n$ npm install socket.io\n\
    ```\n\nAfter you’ve installed it, you can implement a very basic WebSocket server,\
    \ as shown in Listing 22-1.\n\n# LISTING 22-1: Setting up a Socket.IO server.\n\
    \n```\nvar io = require('socket.io').listen(4000);\n\nio.sockets.on('connection',\
    \ function (socket) {\n  socket.on('my event', function(content) {\n    console.log(content);\n\
    \  });\n});\n```"
