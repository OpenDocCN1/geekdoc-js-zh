  md: "# 6\nScheduling the Execution of Functions Using Timers\n\nWHAT'S IN THIS CHAPTER?\n\
    \n+   - Deferring the execution of a function\n- Canceling a scheduled execution\n\
    - Scheduling a periodic execution of a function\n- Deferring the execution of\
    \ a function until the next event loop tick\n\nIf you are accustomed to programming\
    \ in browser JavaScript, you probably use the setTimeout and setInterval functions.\
    \ These functions allow for the deferred execution of a function after a given\
    \ period of time. For example, the following snippet of code, once loaded into\
    \ a web page, appends the string \"Hello there\" after one second has elapsed:\n\
    \n```\nvar oneSecond = 1000; // one second = 1000 x 1 ms\nsetTimeout(function()\
    \ {\n  document.write('<p>Hello there.</p>');\n  oneSecond);\n},\n```\n\nsetInterval\
    \ allows for the repetitive execution of a function spaced by a given time interval.\
    \ If you inject the following snippet into a web page, it will also append the\
    \ phrase \"Hello there\" to the document and keep doing so every second:\n\n```\n\
    var oneSecond = 1000; // one second = 1000 x 1 ms\nsetInterval(function() {\n\
    \  document.write('<p>Hello there.</p>');\n  oneSecond);\n}, oneSecond);\n```"
  merge: -1
  pgno: 78
- img_proc: true
  md: "The need for these functions has arisen the web has become a platform for building\
    \ applications. These scheduling functions help developers build periodic validation,\
    \ deferred remote data syncing, and all sorts of user interface interactions that\
    \ require a delay. Node implements this exact set of functions. On the server\
    \ side they can be used for assisting in repetitive or deferred execution of many\
    \ different procedures that include cache expiration, connection pool cleanup,\
    \ session timeout, polling, and others.\n\nI will now go over these functions\
    \ and discuss some of their limitations.\n\n# USING TIMEOUT TO DEFER THE EXECUTION\
    \ OF A FUNCTION\n\nThe setTimeout function lets you schedule any other function\
    \ to be executed once in the future. Here is an example:\n\n```\nvar timeout_ms\
    \ = 2000; // 2 seconds\nvar timeout = setTimeout(function() {\n  console.log(\"\
    timed out!\");\n}, timeout_ms);\n```\n\nExactly in browser JavaScript, setTimeout\
    \ accepts the deferred function as a first argument and the time after which the\
    \ function is executed — in milliseconds — as the second argument.\n\nThe call\
    \ to setTimeout returns a handler, which is an internal object that cannot be\
    \ used for anything except canceling the execution using clearTimeout.\n\n# USING\
    \ CLEARTIMEOUT TO CANCEL THE EXECUTION OF A FUNCTION\n\nOnce you have obtained\
    \ a timeout handler, you can use it to cancel the scheduled function call using\
    \ the clearTimeout function like this:\n\n```\nvar timeoutTime = 1000; // one\
    \ second\nvar timeout = setTimeout(function() {\n  console.log(\"timed out!\"\
    );\n}, timeout);\nclearTimeout(timeout);\n```\n\nIn this case the timeout will\
    \ never be fired (\"timed out!\" will never be printed to the console. You can\
    \ also cancel the scheduled execution at some time in the future. The following\
    \ code snippet shows an example where this happens:\n\n```\nvar timeout = setTimeout(function\
    \ A() {\n  console.log(\"timed out!\");\n}, 2000);\n```\n\n```\nsetTimeout(function\
    \ B() {\n  clearTimeout(timeout);\n}, 1000);\n```"
  merge: -1
  pgno: 79
- img_proc: true
  md: "# Using process.nextTick to Defer the Execution of a Function Until the Next\
    \ Event Loop Iteration\n\nHere you are scheduling two functions to be executed\
    \ in the future, A and B. Function A is scheduled to run in two seconds, B is\
    \ scheduled to run in one second. In this case, function A never fires when B\
    \ runs, it unschedules function A.\n\n# SCHEDULING AND CANCELING THE REPETITIVE\
    \ EXECUTION OF A FUNCTION\n\nsetInterval is similar to setTimeout, but instead\
    \ schedules a function to run every period of time. You might want to use it to\
    \ trigger recurring routines that perform some of cleanup, collection, logging,\
    \ fetching, polling, or any other procedure you may find useful to run on a repetitive\
    \ basis.\n\nThe following snippet of code outputs \"tick\" to the console every\
    \ second:\n\n```\nvar period = 1000; // 1 second\nsetInterval(function() {\n \
    \ console.log(\"tick\");\n}, period);\n```\n\nIf you don't want to keep running\
    \ this process indefinitely or until it ends, you can cancel it by calling clearInterval().\n\
    \nsetInterval returns a scheduling handler, which you can provide as an argument\
    \ to clearInterval to unschedule it.\n\n```\nvar interval = setInterval(function()\
    \ {\n  console.log(\"tick\");\n}, 1000);\n//\nclearInterval(interval);\n```\n\n\
    # USING PROCESS.NEXTICK TO DEFER THE EXECUTION OF A FUNCTION UNTIL THE NEXT EVENT\
    \ LOOP ITERATION\n\nSometimes browser JavaScript programmers use setTimeout(callback,\
    \ 0) as a way to defer tasks until the near future. The zero value in the millisecond\
    \ argument allows the JavaScript runtime that it should execute the callback function\
    \ as soon as possible after all pending events have been processed. This technique\
    \ is sometimes used to defer operations that don't need run immediately. For instance,\
    \ they are sometimes used to start animations or do some computation after the\
    \ user event has been processed.\n\nIn Node, the event loop runs, as the name\
    \ indicates, in a loop that processes the event queue. Every time the event loop\
    \ executes, it is a tick.\n\nYou can schedule a callback function to be invoked\
    \ on the next run of the event loop, that is, the next tick. Whereas setTimeout\
    \ uses a JavaScript runtime that has its own scheduling queue, the process.nextTick\
    \ function is specific to the Node event loop."
  merge: -1
  pgno: 80
- img_proc: true
  md: "By using process.nextTick(callback) instead of setTimeout(callback, 0), your\
    \ callback runs\nimmediately after all the events in the event queue have been\
    \ processed, which is much sooner (in\nthe CPU time scale) when the JavaScript\
    \ timeout queue is activated.\n\nYou can defer the execution of a function until\
    \ the next event loop tick like this:\n\n```\nprocess.nextTick(function() {\n\
    \  my_expensive_computation_function();\n});\n```\n\n> NOTE The process object\
    \ is one of the few Node global objects.\n\n# BLOCKING THE EVENT LOOP\n\nNode\
    \ and JavaScript runtimes in general are single-threaded event loops. On each\
    \ loop, the runtime\nprocesses the next event in queue by calling the associated\
    \ callback function. When event\nis done, the event loop fetches and processes\
    \ the next event; this pattern continues until the queue is\nempty. If one of\
    \ these callbacks takes a long time, the event loop won't processing events in\
    \ the\nantime. This can lead to a slow service or application.\n\nUsing memory-\
    \ or processor-intensive functions when handling events can lead to the event\
    \ loop\ncoming slow and the events being queued up and undesired or even blocked.\n\
    \nHere is an example of blocking the event loop:\n\n```\nprocess.nextTick(function\
    \ nextTick1() {\n  var a = 0;\n  while (true) {\n    a++;\n  }\n});\n\nprocess.nextTick(function\
    \ nextTick2() {\n  console.log(\"next tick\");\n});\n\nsetTimeout(function timeout()\
