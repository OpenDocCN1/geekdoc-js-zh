  md: "# SHUTTING DOWN THE SERVER\n\nYou can stop an HTTP server from accepting new\
    \ connections by unbinding it from the port like this:\n\n```\nserver.close();\n\
    ```\n\nIf you want it to start listening again, you have to repeat the following:\n\
    \n```\nserver.listen(port[, hostname]);\n```\n\nFollowing are some examples of\
    \ simple HTTP servers you can build without any third-party modules.\n\n# EXAMPLE\
    \ 1: BUILDING A SERVER THAT SERVES STATIC FILES\n\nIn this example, you'll be\
    \ building an HTTP server that serves static files (see Listing 11-5). The file\
    \ path is provided in the URL link like this:\n\n```\nhttp://localhost:4000/path/to/my/file.txt\n\
    ```\n\n> LISTING 11-5: Simple HTTP static file server.\n\n```\nvar path = require('path');\n\
    fs = require('fs');\nrequire('http').createServer(function(req, res) {\n  var\
    \ file = path.normalize('.' + req.url);\n  console.log('Trying to serve', file);\n\
    \n  function reportError(err) {\n    console.log(err);\n    res.write('Internal\
    \ Server Error');\n  }\n\npath.exists(file, function(exists) {\n  if (exists)\
    \ {\n    fs.stat(file, function(err, stat) {\n      var rs;\n      if (err) {\n\
    \        return reportError(err);\n      }\n      if (stat.isDirectory()) {\n\
    \        res.writeHead(403); res.end('Forbidden');\n      } else {\n        rs\
    \ = fs.createReadStream(file);\n        rs.on('error', reportError);\n       \
    \ res.writeHead(200);\n      }\n    });\n  }\n});\",\n```"
