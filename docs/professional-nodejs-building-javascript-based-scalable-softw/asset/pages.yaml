    \ uses the +1 application you created to outsource these calculations.\n\nStart\
    \ by creating a file named plus_one_test.js with Listing 8-7.\n\n> LISTING 8-7:\
    \ Testing the +1 application. (chapter8/07_plus_one_test.js)\n\n```\nvar spawn\
    \ = require('child_process').spawn;\n\n// Spawn the child with a node process\
    \ executing the plus_one app\nvar child = spawn('node', ['plus_one.js']);\n\n\
    // Call this function every 1 second (1000 milliseconds):\nsetInterval(function()\
    \ {\n\n  // Create a random number smaller than 10.000\n  var number = Math.floor(Math.random()\
    \ * 10000);\n\n  // Send that number to the child process:\n  child.stdout.write(number\
    \ + \"\\n\");\n\n  // Get the response from the child process and print it:\n\
    \  child.stdout.once('data', function(data) {\n    console.log('child replied\
    \ to ' + number + ' with: ' + data);\n  });\n}), 1000);\n```"
