- img_proc: true
  md: "# LISTING 25-19 (continued)\n\n```\nauthor: {\n  type: Schema.ObjectId,\n \
    \ ref: 'User',\n  required: true\n}\ncreated_at: {\n  type: Date,\n  'default':\
    \ Date.now\n});\nmodule.exports = ArticleSchema;\n```\n\nHere you are defining\
    \ a simple article schema that contains an author field that is of type Schema.ObjectId\
    \ and references the model named User.\n\nDefine the model in List 25-20 under\
    \ a file named data/models/article.js.\n\n# LISTING 25-20: The article model.\n\
    \n```\nvar mongoose = require('mongoose');\nvar ArticleSchema = require('../schemas/article');\n\
    \nvar Article = mongoose.model('Article', ArticleSchema);\n\nmodule.exports =\
