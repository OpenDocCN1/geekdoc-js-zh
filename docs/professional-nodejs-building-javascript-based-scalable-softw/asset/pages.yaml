    \ see that the header is written out into the response as expected.\nHere it’s\
    \ important that the middleware that writes the header is inserted before the\
    \ middleware that writes and ends the response. If you placed the ReplyText middleware\
    \ first, the second middleware would never be called because ReplyText does not\
    \ invoke the “next” callback.\n\n# Registering Callbacks Inside Middleware\n\n\
    Besides inspecting the request and changing the response, middleware components\
    \ can register some callbacks to be executed later. As an example, you can create\
    \ one that saves all the data of each request into a file (see Listing 20-7).\n\
    \n```\nLISTING 20-7: A middleware that saves every request into a file.\n\nvar\
    \ fs = require('fs'),\n    path = require('path'),\n    util = require('util');\n\
    \nfunction saveRequest(dir) {\n\n    return function(req, res, next) {\n\n   \
    \     var fileName = path.join(dir, Date.now().toString() + '_' +\n          \
    \  Math.floor(Math.random() * 100000) + '.txt');\n        var file = fs.createWriteStream(fileName);\n\
    \        file.write(req.method + ' ' + req.url + '\\n');\n        file.write(util.inspect(req.headers)\
    \ + '\\n');\n        req.pipe(file);\n        next();\n    }\n}\n\nmodule.exports\
    \ = saveRequest;\n```\n\nFor every request this middleware component gets, it\
    \ creates a new file inside a specified directory and saves all the headers into\
    \ it. Then, it pipes the request into that file. No part of the request body is\
    \ written out at this time. The data and other event listeners are set up so that\
    \ when future data arrives, that data is sent into the file writable stream."
