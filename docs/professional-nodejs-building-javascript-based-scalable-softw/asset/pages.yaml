  md: "# Using Virtual Attributes\n\n```\ntype: Date,\nvalidate: [validate_18_years_old_or_more,\
    \ 'You must be 18 years old or more'],\ntwitter: {\n  type: String,\n  validate:\
    \ [twitterHandleExists, 'Please provide a valid twitter handle'],\n  set: filterTwitterHandle,\n\
    \  get: filterTwitterHandle\n};\n```\n\nYou can also have some attributes that\
    \ are not present in the document, but are computed dynamically, as Mongoose loads\
    \ the document. For instance, the front-end code has to build the Twitter URL\
    \ string based on a Twitter handle, but the Twitter URL is an attribute of the\
    \ user, and as should belong in the user document. However, because this attribute\
    \ can be easily computed based on the Twitter handle, you can create a virtual\
    \ attribute. You do this by adding the following to the user schema module in\
    \ the file data/schemas/user.js, immediately before the module exports:\n\n```\n\
    //...\nUserSchema\nvirtual('twitter_url')\n  get(function() {\n    if (this.twitter)\
    \ {\n      return 'http://twitter.com/' + encodeURIComponent(this.twitter);\n\
    \    }\n  });\n```\n\n> NOTE Virtual attributes aren't saved into the document.\n\
    \nNow you can change the user profile view template to use all the new attributes,\
    \ as shown in Listing 25-15.\n\nLISTING 25-15: New version of the user profile\
    \ template using the twitter_url virtual attribute in views/users/profile.jade.\n\
    \n```\nh1= user.name\nh2 Bio\np= user.bio\nh2 Email\np= user.email\n```"
