  md: '# # Learn to build scalable software in JavaScript


    Node.js is a popular framework that allows you to build fast, highly scalable
    network programs using JavaScript. However, it comes with a learning curve. This
    in-depth guide walks you through the installation of the Node.js platform and
    focuses on the essentials of creating and loading modules; using buffers to manipulate,
    encode, and decode binary data; simplifying event binding with the event pattern;
    and more. Covering everything the execution of functions using timers to creating
    and controlling external processes, this book gets you up and running and building
    your you modules.


    Professional Node.js:


    +   - Addresses querying, reading from, and writing to files

    - Explores streams, file systems, networking, and automated unit testing

