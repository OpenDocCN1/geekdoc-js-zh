  md: "# Obtaining the Response Body\n\nAs stated, the response body is not present\
    \ when the response event is fired. If you are interested in register for \"data\"\
    \ events on the response body like this:\n\n```\nhttp.request(options, function(response)\
    \ {\n  response.setEncoding('utf8');\n  response.on('data', function(data) {\n\
    \    console.log('I have a piece of the body here', data);\n  });\n});\n```\n\n\
    Here you are registering for the \"data\" event on the response as soon as you\
    \ get the response event. You will then get called back as the pieces of the response\
    \ body arrive. The data can be a buffer, or if you specify an encoding on the\
    \ response object (like you did here), it will be an encoded string.\n\n# Streaming\
    \ the Response Body\n\nThe HTTP response is a readable stream that represents\
    \ the response body data stream. As with any readable stream, you can pipe it\
    \ into any writable stream like an HTTP request or a file. For instance, the following\
    \ example shows how to pipe the response body into an open file:\n\n```\nvar http\
    \ = require('http');\nvar fs = require('fs');\nvar options = {\n  host: \"www.google.com\"\
    ,\n  port: 80,\n  path: \"/\",\n  method: \"GET\"\n};\n\nvar file = fs.createWriteStream('/tmp/test.txt');\n\
    \nhttp.request(options, function(res) {\n  res.pipe(file);\n}).end();\n```\n\n\
    Here you are creating a file write stream and piping the response body into it.\
    \ As body data arrives from the server response, it's written to the file. When\
    \ the body ends, the stream is ended, and which then closes the file.\n\n# POOLING\
    \ SOCKETS USING HTTP.AGENT\n\nWhen making HTTP requests, Node internally uses\
    \ an agent. An agent is the entity in Node that makes HTTP requests for you. This\
    \ agent is responsible for maintaining a pool of live TCP sockets. This pool will\
    \ contain open out-of-use network connections for a given hostname and port"
