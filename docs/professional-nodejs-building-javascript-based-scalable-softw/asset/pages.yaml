    \ after the fs.write operation has been commanded. Once you pass it in, the buffer\
    \ is in control of that operation, and you should only reuse it after your callback\
    \ has been invoked.\n\n# Closing a File\n\nWith all the examples you've seen so\
    \ far in this chapter, you might have noticed that the code did not close the\
    \ files. This is because they are simple examples destined to be run once. When\
    \ your Node process exits, the operating system will make all the files are closed.\n\
    \nIn real applications, however, when you open a file, you will eventually need\
