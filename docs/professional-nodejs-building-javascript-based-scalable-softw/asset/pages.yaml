  md: "# CONNECTING AND CREATING A DATABASE\n\nNow you need to create a database connection.\
    \ Unlike most database management servers, CouchDB clients don't use a connection-oriented\
    \ protocol. Instead they use plain HTTP. HTTP is a stateless protocol, which means\
    \ that each transaction is performed inside an independent HTTP request.\n\nIn\
    \ this sense, there is no real “connection” to the database in Nano; there is\
    \ only the reference to a CouchDB server and a database. This implies that any\
    \ connectivity problems that arise happen only when an individual request is performed.\n\
    \n> NOTE Installing and managing a CouchDB server is out of the scope of this\
    \ book, but Internet services are available to provide a remote CouchDB server.\
    \ One of these services is IrisCouch, which you can reach at www.iris couch.com/.\n\
    \nYou can use IrisCouch to create and use a small database for free (if your usage\
