  md: "Save this listing as a file named hello_world_app_v2.js and run it:\n\n```\n\
    $ node hello_world_app_v2\n```\n\nBy pointing your browser to http://localhost:8080,\
    \ you should see the \"Hello World!\" response rendered again.\n\n# Creating Asynchronous\
    \ Middleware\n\nA middleware function can be asynchronous: When the work is done,\
    \ it needs to call a callback for the middleware engine to continue to do its\
    \ work. The previous example didn't use this feature because it just ended the\
    \ response without handing control to the next middleware in line.\n\nTo practice,\
    \ you can create a middleware component that introduces a header into the response\
    \ header section, as shown in Listing 20-5.\n\nLISTING 20-5: A Connect middleware\
    \ that writes a header.\n\n```\nfunction writeHeader(name, value) {\n  return\
    \ function(req, res, next) {\n  res.setHeader(name, value);\n  next();\n  }\n\
    }\n\nmodule.exports = writeHeader;\n```\n\nThis middleware component uses a third\
    \ argument that contains the callback to be invoked when this component is done.\n\
    \nSave this listing as a file named writeWorld_header.js.\n\nYou can now incorporate\
    \ this middleware component into your HelloWorld app by including it in the middleware\
    \ stack you pass into the server constructor, right before the ReplyText middleware,\
    \ as shown in Listing 20-6.\n\nLISTING 20-6: Including the WriteHeader middleware\
    \ in the HelloWorld app.\n\n```\nvar connect = require('connect');\n\n// import\
    \ middlewares\nvar writeHeader = require('./writeheader');\nvar replyText = require('./reply_text');\n\
    \nvar app = connect.createServer(\n  writeHeader('X-Powered-By', 'Node'),\n  replyText('Hello\
    \ World!')\n);\n\napp.listen(8080);\n```"
