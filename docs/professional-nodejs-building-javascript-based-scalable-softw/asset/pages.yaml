- img_proc: true
  md: "The input element, which is a simple text input field, will sit at the top\
    \ of the page, followed by a div for the message that fills the rest of the page:\n\
    \n```\nYour message:\n<input type=\"text\" id=\"input\">\n<div id=\"messages\"\
    ></div>\n```\n\nBefore the closing body tag, you need to load the Socket.IO client\
    \ library and add the client-side application logic. It's crucial to have the\
    \ JavaScript at the end of the document to make sure that all DOM elements are\
    \ available to the JavaScript.\n\nFirst, you need to load the Socket.IO client\
    \ library:\n\n```\n<script src=\"http://localhost:4000/socket.io/socket.js\" type=\"\
    text/javascript\"></script>\n```\n\nThen, after opening the script block with\
    \ code, you need to handle two cases — a message from the server arrives and a\
    \ message has to be sent to the server. Let's start with a function that knows\
    \ how to append new messages to the message area:\n\n```\nvar messagesElement\
    \ = document.getElementById('messages');\nvar lastMessageElement = null;\n\nfunction\
    \ addMessage(message) {\n  var newMessageElement = document.createElement('div');\n\
    \  var newMessageText = document.createTextNode(message);\n\n  newMessageElement.appendChild(newMessageText);\n\
    \  messagesElement.insertBefore(newMessageElement, lastMessageElement);\n  lastMessageElement\
    \ = newMessageElement;\n}\n```\n\nNew messages arrive on the Socket.IO wire, you\
    \ need to connect to the backend and add a handler for the serverMessage that\
    \ the server code emits:\n\n```\nvar socket = io.connect('http://localhost:4000');\n\
    socket.on('serverMessage', function(content) {\n  addMessage(content);\n});\n\
    ```\n\nThe last step is to emit clientMessage events with the message of the users\
    \ as their content. This can be achieved by using the onkeydown of the input field\
    \ and writing to the socket whenever the user presses Enter:\n\n```\nvar inputElement\
    \ = document.getElementById('input');\n\ninputElement.onkeydown = function (keyboardEvent)\
    \ {\n  if (keyboardEvent.keyCode === 13) {\n  socket.emit('clientMessage', inputElement.value);\n\
    \    inputElement.value = '';\n  }\n```"
