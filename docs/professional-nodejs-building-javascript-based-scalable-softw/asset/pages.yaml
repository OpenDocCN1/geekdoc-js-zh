  md: '# Setting Up and Using Node Package Manager | 11


    ```

    $ npm install sax@0.2.x

    ```


    If you want to install the latest version before 0.3 you should type:


    ```

    $ npm install sax@<0.3"

    ```


    You can get more sophisticated and combine version specifications like this:


    ```

    $ npm install sax@>=0.1.0 <0.3.1"

    ```


    # Uninstalling a Module


    When you use the following command, NPM will try to find and uninstall the package
    with the specified name.


    ```

    $ npm uninstall <package name>

    ```


    If you want to remove a globally installed package, you should use:


    ```

    $ npm uninstall -g <package name>

    ```


    # Updating a Module


    You can also update an installed module by using the following command:


    ```

    $ npm update <package name>

    ```


    This command will fetch the latest version of the package and update it. If the
    package does not exist, it will install it.


    You can also use the global switch (-g) to update a globally installed module
    like this:


    ```

    $ npm update -g <package name>

    ```


    # Using the Executable Files


    It''s possible that a module includes one or more executable files. If you choose
    to install a module globally by use the default directory settings, NPM installs
    the executables inside /usr/local/bin. This path is usually included in the default
    PATH environment variable.


    If you installed a package locally, NPM installs any executables inside the ./node_modules/.bin
    directory.


    # Resolving Dependencies


    NPM not only installs the packages you request but also installs the packages
    that those packages depend on. For instance, if you request to install package
    A and this package depends on package B and C, Node will fetch packages B and
    install them inside ./node_modules/A/node_modules.'
