  md: "# 10\n\n# Building TCP Servers\n\nWHAT'S IN THIS CHAPTER?\n\n+   - Creating\
    \ a TCP server\n- Closing server-side TCP connections\n- Handling network errors\n\
    - Piping data to or from a TCP connection\n- Building a TCP chat server\n\nThe\
    \ transmission control protocol (TCP) is one of the fundamental protocols of the\
    \ Internet. It sits on top of the Internet protocol (IP) and provides a transport\
    \ mechanism for the application layer. HTTP, for instance, works on top of TCP,\
    \ as do many other connection-oriented applications such as IRC, SMTP, and IMAP.\n\
    \nNode has a first-class HTTP server implementation in the form of a pseudo-class\
    \ in net.Server, which descends from the TCP server pseudo-class in net.Server.\
    \ This means that everything described in this chapter applies to the Node HTTP\
    \ server as well.\n\n# CREATING A TCP SERVER\n\nYou can create a TCP server using\
    \ the net module like this:\n\n```\nrequire('net').createServer(function(socket)\
    \ {\n  // new connection\n\n  socket.on('data', function(data) {\n    // got data\n\
    \  });\n\nsocket.on('end', function(data) {\n```"
