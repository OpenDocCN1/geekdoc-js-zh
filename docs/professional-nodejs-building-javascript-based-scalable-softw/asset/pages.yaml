  md: '# 15


    # Securing Your TCP Server with TLS/SSL


    WHAT''S IN THIS CHAPTER?


    +   - Understanding how the Public Key Infrastructure works

    - Creating a TLS server

    - Connecting to a TLS server

    - Validating the server and client certificates

    - Receiving and sending data securely


    TLS (Transport Layer Security) and SSL (Secure Socket Layer) allow client/server
    applications to communicate across a network in a way designed to prevent eavesdropping
    (others looking into your messages) and tampering (others changing your message).
    TLS/SSL encrypts the segments of network connections above the transport layer,
    enabling both privacy and message authentication.


    TLS is based on earlier SSL specifications developed by Netscape. In fact, TLS
    1.0 is also known as SSL 3.1, and the latest version (TLS 1.2) is also known as
    SSL 3.3. This chapter uses TLS instead of the deprecated SSL nomenclature.


    # UNDERSTANDING PRIVATE AND PUBLIC KEYS


    Public key cryptography refers to a cryptographic system that requires two separate
    keys. One key is used to encrypt the plaintext, and the other key is used to decrypt
    the encrypted message. One of these keys is public, and the other is private.
    If the plaintext is encrypted using the public key, only the private key can unlock
    it, enabling private communication from the public to the private key owner. If
    the plaintext is encrypted using the private key, the'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'public key can decrypt it. In this case the system verifies the signatures
    of the documents signed by the owner of the private key.


    A public key certificate (also known as a digital certificate) uses a digital
    signature to bind a public key to an identity — a person or an organization. The
    document will be signed by a Certificate Authority (CA) that went through the
    process of certifying that the identity information matches the public key. That
    Certificate Authority corresponds to another certificate that either was self-signed
    or was endorsed by another Certificate Authority, possibly forming a chain of
    delegation that forms part of the Public Key Infrastructure (PKI).


    Each computer defines a root set of Certificate Authorities that are used by default
    when validating certificates and certificate chains. When using Node’s TLS library
    you can use these default Certificate Authorities or define your own.


    # Generating a Private Key


    > NOTE Node TLS implementation is based on the OpenSSL library. Chances are you
    have the library installed. To check, open a terminal and try using the openssl
    command. If it’s not installed, look for a package named openssl and install it.


    TLS relies on the public/private key infrastructure where each client and server
    must have a private key to sign messages. The openssl utility can create a private
    key on the command line like this:


    $ openssl genrsa -out my_key.pem 1024


    This creates a file named my_key.pem with your private key.


    # Generating a Public Key


    Servers and clients involved in TLS must have a certificate if they are validating
    each other. Certificates are public keys signed by a Certificate Authority or
    are self-signed. The first step in getting a certificate is to create a Certificate
    Signing Request (CSR) file. This can be done by:


    $ openssl req -new -key my_key.pem -out my_csr.pem


    This will create a CSR file named my_csr.pem, but first you will need to answer
    some identification questions prompted by openssl.


    To create a self-signed certificate with the CSR, you can do this:


    $ openssl x509 -req -in my_csr.pem -signkey my_key.pem -out my_cert.pem


    This will create a self-signed certificate file named my_cert.pem based on your
    private key and your certificate request. Alternatively you can send the CSR to
    a Certificate Authority for signing, but for you to work on this chapter’s examples,
    a self-signed certificate is enough.'
