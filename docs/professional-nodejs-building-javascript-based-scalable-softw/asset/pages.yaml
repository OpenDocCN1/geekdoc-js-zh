- img_proc: true
  md: "> NOTE *If you use a memory store, the sessions won't survive a process restart.\
    \ If you use a persistent session store, you will have an external service where\
    \ the sessions will be kept and survive a Node process restart. Also, using an\
    \ external session store allows you to force two or more Node processes to share\
    \ the session state, which means that if you use a load balancer, any request\
    \ can hit any Node process running your app at any given time and always have\
    \ the session data available.*\n\n*For this example, though, you will use the\
    \ built-in and default memory store, but you should use an external persistent\
    \ store if your production setup involves more than one Node process.*\n\nListing\
    \ 20-21 shows how you can set up the session middleware.\n\n# LISTING 20-21: Using\
    \ the Connect session middleware.\n\n```\nvar connect = require('connect');\n\
    var format = require('util').format;\n\nvar app = connect();\n\n// setup middleware\n\
    app.use(connect.query());\n\napp.use(connect.cookieParser('this is my secret string'));\n\
    \napp.use(connect.session({\n  cookie: { maxAge: 24 * 60 * 60 * 1000 }\n}));\n\
    \n// actually respond\napp.use(function(req, res) {\n  for (var name in req.query)\
    \ {\n    req.session[name] = req.query[name];\n  }\n  res.end(format(req.session)\
    \ + '\\n');\n});\n\napp.listen(8080);\n```\n\nIn this listing, you are setting\
    \ up some middleware components.\n\nFirst, you are using the query string parser.\
    \ This is only because the example requires it, as you will see later.\n\nThen\
    \ you set up the cookie parser, but you pass a string into the middleware constructor.\
    \ This string contains a secret that will be used for the server to sign the data\
    \ in the cookies, ensuring that the data cannot be modified by the client.\n\n\
    After this you set up the session middleware, where you define the `cookie.maxAge`\
    \ option, which defines how long the session cookie can live in the browser before\
    \ expiring."
  merge: -1
  pgno: 247
- img_proc: true
  md: "Then, when a request arrives, you cycle through every attribute on the `req.query`\
    \ object and copy it into the session. This is an easy (and not very secure) way\
    \ for you to easily test the session object later by changing the query string\
    \ portion of the request URL.\nFinally, you reply to the request by serializing\
    \ the contents of the `req.session` property.\nYou can save this code listing\
    \ into a file named `session.js` and run it:\n\n```\n$ node session\n```\n\nThen\
    \ point your browser to `http://localhost:8080`. You should see something similar\
    \ to this rendered:\n\n```\n{ cookie:\n   { path: '/',\n     _expires: Sun, 24\
    \ Jun 2012 10:58:24 GMT,\n     originalMaxAge: 60000,\n     httpOnly: true } }\n\
    ```\n\nThis shows that the session has a `cookie` property that stores some cookie\
    \ information. This internal data is used by the session middleware.\n\nNow you\
    \ can set the session by using the query string. Try loading the following URL\
    \ in the browser:\n\n```\nhttp://localhost:8080/?a=b\n```\n\nYou will then see\
    \ something like this rendered:\n\n```\n{ cookie:\n   { path: '/',\n     _expires:\
    \ Sun, 24 Jun 2012 11:02:22 GMT,\n     originalMaxAge: 60 * 60 * 1000,\n     httpOnly:\
    \ true },\n   a: 'b' }\n```\n\nHere you can see that the session is getting the\
    \ names and values that were present on the query string.\n\nNow you can try passing\
    \ a URL with no query string (like `http://localhost:8080`), just to observe the\
    \ session data. You should see something like this rendered:\n\n```\n{ cookie:\n\
    \   { path: '/',\n     _expires: Sun, 24 Jun 2012 11:04:17 GMT,\n     originalMaxAge:\
    \ 60000,\n     httpOnly: true },\n   a: 'b' }\n```\n\nYou can now see that the\
    \ session is being successfully recorded and restored on subsequent requests."
  merge: -1
