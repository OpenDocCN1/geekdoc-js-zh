  md: "# CHAPTER 19 CONTROLLING THE CALLBACK FLOW\n\nLISTING 19-13 (continued)\n\n\
    ```\nfunction test(value) {\n  return value > 10;\n}\n\nfunction detect(item,\
    \ callback) {\n  request.post({\n    uri: 'http://localhost:8080',\n    body:\
    \ JSON.stringify(item)\n  });\n\n  function(err, res, body) {\n    if (err) {\n\
    \      throw err;\n    }\n    callback(body && test(JSON.parse(body)));\n  });\n\
    }\n\nasync.detect(collection, detect, done);\n```\n\nasync.detect invokes the\
    \ function in parallel for each element, which means that you might not get the\
    \ first item in the list that meets the criteria — it depends on the order in\
    \ which the asynchronous operations finish.\n\nIf order is important to you or\
    \ if you want to have only one pending active operation at any given time, you\
    \ can use the serialized version of this function: async.detectSeries. You can\
    \ replace the last line of the listing with the following:\n\n```\nasync.detectSeries(collection,\
    \ detect, done);\n```\n\nHere, async.detectSeries invokes the function and waits\
    \ for it to finish. Then, if the element fails the detection, async.detectSeries\
    \ goes on to the next element until one is detected or until there are no more\
    \ elements.\n\n# SUMMARY\n\nIt can be difficult to control asynchronous flow,\
    \ and it can easily lead to poorly structured code. One way to avoid these issues\
    \ is to declare callbacks as named functions beforehand and avoid nesting them.\n\
    \nYou can also create a generic flow-control routine or use one of many provided\
    \ by the async third-party module. Using them, you can perform function calls\
    \ in series or in parallel, or you can iterate over a collection in an asynchronous\
    \ fashion. This chapter covered some of the most used functions, but async provides\
    \ more than these. If you're interested, check out the official async documentation\
    \ at\n\n```\nhttps://github.com/caolan/async#readme\n```"
