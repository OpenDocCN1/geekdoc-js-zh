  md: "# Using Route Middleware\n\nYou might want to restrict actions based on session\
    \ info. You might, for instance, restrict the execution of some routes to users\
    \ who are logged in or even users who have certain internal profile characteristics\
    \ (like being the administrator).\n\nYou can make each of the relevant route listeners\
    \ perform this task, but this would lead to repetitive or inefficient code. Instead,\
    \ you can define route middleware that can be executed on chosen routes.\n\nFor\
    \ instance, if you want to access to the GET /users/new, POST /users, GET /sessions/new,\
    \ and POST /session to users who are not logged in, you can create the following\
    \ generic route middleware that you can save into routes/middleware/not_logged_in.js\
    \ (see Listing 21-15).\n\n# LISTING 21-15: The not_logged_in middleware.\n\n```\n\
    function isLoggedIn(req, res, next) {\n  if (req.session.user) {\n    res.send('Unauthorized',\
    \ 401);\n  } else {\n    next();\n  }\n}\n\nmodule.exports = isLoggedIn;\n```\n\
    \nThis middleware piece simply checks if a user is in the session. If there is\
    \ one, it sends a 401 Unauthorized status. If there is no user, it proceeds to\
    \ the next middleware in place.\n\nYou can then import this middleware piece at\
    \ the top of the routes/session.js file and proceed to include the middleware\
    \ piece in every route needed (see Listing 21-16).\n\n# LISTING 21-16: New version\
    \ of the session routes.\n\n```\n/*\n * Session Routes\n */\nvar users = require('./data/users');\n\
    var notLoggedIn = require('./middleware/not_logged_in');\n\nmodule.exports = function(app)\
    \ {\n\n  app.dynamicHelpers({\n    session: function(req, res) {\n      return\
    \ req.session;\n    }\n  });\n\n  app.get('/session/new', notLoggedIn, function(req,\
    \ res) {\n```"
