    \        from: username,\n        room: room,\n        message: content\n    \
    \  };\n      chatDB.insert(messageDoc, function (err) {\n        if (err) { console.error(err);\
    \ }\n      });\n      broadcast.emit('serverMessage', username + ' said: ' + message);\n\
    \    });\n  })\n});\n```\n\nHere, you are building a simple document that contains\
    \ the message and some meta-data — when the message was emitted, who emitted it,\
    \ and in which chat room.\n\n> NOTE Even though you are creating a simple flat\
    \ document in this example, in CouchDB you can have documents as complex as you\
    \ want, with as many nested levels as you need."
