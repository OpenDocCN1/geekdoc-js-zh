  md: "# BUILDING A TLS Client\n\nTo make a connection to a TLS server, your key and\
    \ certificate need to be issued first. If you have not done this yet, please create\
    \ them as explained at the beginning of this chapter.\n\n# Initializing the Client\n\
    \nYou must initialize the client connection with some options, which you need\
    \ to gather first. Previously you should have generated the private key and digital\
    \ certificate into some local files, which you must fetch using fs.readFileSync,\
    \ the synchronous version of fs.readFile.\n\n```\nvar fs = require('fs');\nvar\
    \ options = {\n  key: fs.readFileSync('/path/to/my/private_key.pem'),\n  cert:\
    \ fs.readFileSync('/path/to/my/certificate.pem')\n};\n```\n\n# Connecting to the\
    \ Server\n\nWhen you have the private key and the digital certificate, you can\
    \ connect to a TLS server using the tls.connect function:\n\n```\nvar tls = require('tls');\n\
    var host = 'localhost';\nvar port = 4001;\n\nvar client = tls.connect(port, host,\
    \ options, function() {\n  console.log('connected');\n});\n```\n\n# Verifying\
    \ the Server Certificate\n\nPrivate and public keys allow you to establish a secure\
    \ channel between a client and a server. This means that the channel is secure\
    \ from eavesdroppers and message changers. After a connection is established,\
    \ though, you may want to ensure that the server really is the server you wanted\
    \ to talk to. For this, you need to inspect the server certificate.\n\nTo do this,\
    \ you need to learn about some TLS connection options you haven't seen yet. One\
    \ of them is ca, which stands for Certificate Authority. If you omit this option,\
    \ a default set of root certificates will be used.\n\n> NOTE Unless an internal\
    \ Certificate Authority issued the certificates for your own operation, omit this\
    \ option and use the default CAs.\nIf you want to override these certificates\
    \ with your own certificates, you must pass in an array of buffers or strings\
    \ containing each CA's certificate."
