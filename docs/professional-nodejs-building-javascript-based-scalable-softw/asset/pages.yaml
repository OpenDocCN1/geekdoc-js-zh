  md: "# BUILDING A SIMPLE TCP CHAT SERVER\n\nNow you should be prepared to start\
    \ building a TCP-based chat server. You can start by instantiating the server,\
    \ logging some important events, and then binding the server to port 4001:\n\n\
    > LISTING 10-5: The TCP chat server — step 1.\n\n```\nvar net = require('net');\n\
    \\var server = net.createServer();\n\nserver.on('error', function(err) {\n  console.log('Server\
    \ error:', err.message);\n});\n\nserver.on('close', function() {\n  console.log('Server\
    \ closed');\n});\n\nserver.listen(4001);\n```\n\n# Accepting Connections\n\nNext,\
    \ you need to accept new client connections:\n\n> NOTE You can choose to catch\
    \ uncaught exceptions — preventing your Node process from being terminated — by\
    \ doing something like this:\n\nprocess.on('uncaughtException', function(err)\
    \ {\n  // do something\n});\n\nHowever, this practice is generally not a good\
    \ idea because when an exception happens and you don't handle it properly, your\
    \ application may get into an unknown state, which may introduce more and stranger\
    \ errors. Also, errors can lead to more errors, making it harder to understand\
    \ the root cause. If you do this, you will also probably leak memory or resources\
    \ (like file descriptors) because errors were not handled when they should have\
    \ been.\n\nIn general, you should use this event only to report everything you\
    \ can about your application and shut down your process."
