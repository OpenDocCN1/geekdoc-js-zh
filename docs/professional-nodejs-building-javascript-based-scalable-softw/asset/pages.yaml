  md: "You can try now to perform another request, setting a different variable name,\
    \ like http://localhost:8080/?c=d. You should see the previous session data plus\
    \ the new-value pair you provided:\n\n```\ncookie {\n  path: '/', Sun, 24 Jun\
    \ 2012 12:06:44 GMT,\n  originalMaxAge: 3599999,\n  httponly: true },n  a: 'b',\n\
    \  c: 'd'\n}\n```\n\n# Other Available Middleware\n\nThis chapter describes some\
    \ of the most popular and useful middleware components available in Connect, but\
    \ others provide things like CSRF (cross-site request forgery) protection, Gzip\
    \ compression, static file memory cache, virtual-host support, a request body\
    \ size limiter, and others.\nYou have already read about a session store using\
    \ Redis or Memcache, but others are also available for various databases like\
    \ MongoDB, CouchDB, and MySQL.\n\nAlso, many third-party middleware components\
    \ are compatible with Connect that allow you to do things like JSONP support,\
    \ render templates, support request timeout, integrate with various methods of\
    \ authentication, support LESS (the CSS DSL), and others. A list of these is maintained\
    \ by the Connect project patron at the following URL:\n\nhttps://github.com/senchalabs/connect/wiki\n\
    \n# SUMMARY\n\nConnect has become a bit of a standard for defining and running\
    \ middleware components in an HTTP server on Node. You can easily create components\
    \ that respond, log data, pipe the request body, handle errors, and do other things\
    \ in a reusable way.\nYou can also use the middleware components provided by Connect.\
    \ These include modules for parsing the query string, parsing the request body,\
    \ serving static files, handling errors, and maintaining sessions.\n\nAlso, many\
    \ third-party modules also allow you to easily extend the functions of your Node\
    \ HTTP server."
