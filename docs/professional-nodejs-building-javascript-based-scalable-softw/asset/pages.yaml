  md: "# BUILDING A TLS SERVER\n\nA TLS server is a subclass of `net.Server`, which\
    \ I introduced in Chapter 10 — “Building TCP Servers.” You can make everything\
    \ with a TLS server that you can with `net.Server`. When you use a TLS server,\
    \ however, you are using a secure connection.\n\n# Initializing the Server\n\n\
    Initializing a TLS server is a bit more complicated than initializing a plain\
    \ TCP server because you have to pass in the content of the server private key\
    \ and certificate files:\n\n```\nvar tls = require('tls');\nvar fs  = require('fs');\n\
    \nvar serverOptions = {\n  key:  fs.readFileSync('./my_key.pem'),\n  cert: fs.readFileSync('./my_certificate.pem')\n\
    };\n\nvar server = tls.createServer(serverOptions);\n```\n\nHere you are using\
    \ the synchronous version of `fs.readFile`, which reads a whole file into memory\
    \ to obtain the key and certificate that are on the filesystem.\n\n> **NOTE**\
    \ Here you're using `fs.readFileSync`, a synchronous function. Won't this block\
    \ the event loop? No, this will just run on the initialization phase of Node,\
    \ before the event loop starts. As long as you don't use blocking functions inside\
    \ an event handler, you won't block the event loop.\n\nBut wait, what if this\
    \ is a module you're writing and someone requires it inside a callback? You shouldn't\
    \ require modules inside callbacks. They perform synchronous filesystem access\
    \ and will block the event loop.\n\nBesides the `key` and `cert` options, `tls.createServer`\
    \ also accepts:\n\n+   - `requestCert` — If true the server will request a certificate\
    \ from clients that connect and attempt to verify that certificate. The default\
    \ value is false.\n- `rejectUnauthorized` — If true the server will reject any\
    \ connection that's not authorized with the list of supplied Certificate Authorities.\
    \ This option has an effect only if requestCert is true. The default value is\
    \ false.\n\n# Listening for Connections\n\nJust like a simple TCP server, you\
    \ can bind a TLS server to a TCP port like this:\n\n```\nvar port = 4001;\nserver.listen(port);\n\
    ```"
  merge: -1
