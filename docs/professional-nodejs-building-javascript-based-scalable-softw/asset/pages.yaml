  md: "You need to send a login message from the client. For that, the browser asks\
    \ the user for the username. Now you need something to trigger this question,\
    \ which can be a login server event.\n\n```\nsocket.on('login', function() {\n\
    \  var username = prompt('What username would you like to use?');\n  socket.emit('login',\
    \ username);\n});\n```\n\nThe server then needs to send a login event when the\
    \ user connects:\n\n```\nsocket.on('login', function(username) {\n  socket.set('username',\
    \ username, function(err) {\n    if (err) throw err;\n    socket.emit('serverMessage',\
    \ 'Currently logged in as ' + username);\n    socket.broadcast.emit('serverMessage',\
    \ 'User ' + username + ' logged in');\n  });\n});\n```\n\nAnd the server emits\
    \ a login event when the user connects:\n\n```\nsocket.emit('login');\n```\n\n\
    The login flow works like this: The user connects and the server sends a login\
    \ event. The browser, upon receiving this event, prompts the user about the username\
    \ and then sends it to the server with a login event. The server processes this\
    \ event, associating the username with that socket, to be used in the future.\n\
    \nListing 22-6 contains the full server code, and Listing 22-7 contains the complete\
    \ client code.\n\n# LISTING 22-6: A Socket.IO chat server that supports user login.\n\
    \n```\nvar http = require('http').createServer(handler);\nvar io = require('socket.io').listen(http);\n\
    var fs = require('fs');\n\nhttp.listen(4000);\n\nfunction handler(req, res) {\n\
    \  fs.readFile(__dirname + '/index.html',\n    function(err, data) {\n      if\
    \ (err) {\n        res.writeHead(500);\n        return res.end('Error loading\
    \ index.html');\n      }\n      res.writeHead(200);\n      res.end(data);\n  \
    \  });\n});\n```\n\ncontinues"
