  md: '# 276 | CHAPTER 23 CONNECTING TO MYSQL USING NODE-MYSQL


    > WARNING The MySQL protocol is sequential, which means that when using a connection
    you are executing each query in series. If you are building an application that
    performs many MySQL operations, having them all wait for each other is probably
    not a good solution.

    in that case you need to create more than one connection to MySQL.. You can choose
    to have one connection per application user, but depending on the number of concurrent
    users and the capacity of your MySQL server, this might not work well.

    You can also choose to create a connection pool, whereby you have a number of
    connections to your MySQL server and distribute the queries to them.


    # SUMMARY


    Exchanging data with a MySQL database is straightforward and efficient, thanks
    to the node-mysql module. However, you must be careful and pay close attention
    when dealing with external and therefore potentially malicious data. By listening
    to asynchronous events, large result sets can be handled efficiently row by row.'
