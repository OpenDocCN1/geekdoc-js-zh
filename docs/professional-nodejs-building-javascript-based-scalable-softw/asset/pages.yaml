  md: '# 7

    Querying, Reading from, and Writing to Files


    WHAT''S IN THIS CHAPTER?


    +   * Manipulating file paths

    * Extracting information from a file path

    * Understanding file descriptors

    * Using fs.stat() to capture file statistics

    * Opening, reading, writing, and closing files

    * Avoiding leaking file descriptors


    Node has a streaming API for dealing with files as if they were network streams.
    It is very convenient, but it only allows you to deal with files in a continuous
    way. This doesn''t work if you need to write or read from specific positions inside
    a file. For that, you need to go down a level and deal with the filesystem itself.


    This chapter covers file-handling basics, including how to open a file, read specific
    parts of it, write to it, and close it.


    Much of Node''s file API is an almost direct translation of the UNIX (POSIX) APIs,
    such as the way that file descriptors are used. Just like in UNIX, a file descriptor
    handle in Node is an integer representing the index of an entry on the process
    file descriptor table.


    There are three special file descriptors — 1, 2, and 3. They represent, respectively,
    the standard input, standard output, and standard error file descriptors. Standard
    input is, as the name indicates, a read-only stream that the process can use to
    read from the console or from data piped from another process. Standard output
    and standard error are output-only file descriptors,'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# CHAPTER 7 QUERYING, READING FROM, AND WRITING TO FILES


    they can be used to output to the console or into another process or file. Standard
    error is reserved for outputting errors, whereas standard output is for normal
    process output.


    These file descriptors are available to the process as soon as it starts and do
    not represent files. You can write to and read from specific positions within
    the file. With file descriptors — much like network streams — — you can only read
    and output continuously. What is written is cannot be overridden.


    Files are not limited in this way. For instance, in Node you can have append-only
    files, yet you can also write to a specific position.


    Nearly all the code that handles files has to handle and manipulate file paths.
    This chapter covers these utility functions and dives into file reading and content
    manipulation.


    # MANIPULATING FILE PATHS


    File paths represent files, and these paths come in relative or absolute formats.
    You can concatenate file paths, extract filename information, and detect file
    existence.


    In Node you can manipulate file paths using strings, but that can become difficult,
    for instance, when you want to join path components. For example, path components
    can be terminated with /, but they don''t have to be, and accounting for those
    cases can be cumbersome. Path separators vary according to the OS.


    Fortunately, Node has a module path that enables you to normalize, join, and resolve
    paths, as well as find relative paths from absolute paths, extract components
    from paths, and determine the existence of paths. In general, the path module
    simply manipulates strings and does not interact with the filesystem to validate
    the strings (with the exception of the path.exists() function).


    # Normalizing Paths


    Normalizing paths before you store or use them is often a good idea. For example,
    file paths that were input by users or are present in a configuration file, as
    well as paths that are the result of joining two or more paths, usually need to
    be normalized. To do so, you can use the normalize function in the path module
    to normalize a path, taking care of ..., and //. For instance:


    ```

    var path = require(''path'');

    path.normalize(''/foo/bar/baz/asdf/quux/../'');

    // => ''/foo/bar/baz/asdf/

    ```


    # Joining Paths


    By using path.join(), you can concatenate path strings. You can concatenate as
    many as you like, passing all of them as consecutive arguments like:


    ```

    var path = require(''path'');

    path.join(''/foo'', ''bar'', ''baz/asdf'', ''quux'', ''..'');

    // => ''/foo/bar/baz/asdf''

    ```


    As you can see, path.join() also normalizes the path.'
