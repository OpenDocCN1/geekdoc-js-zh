  md: "```\nvar data = [];\ndata[1] = \"the content\";\ndata[0] = 100;\n\nclient.query('INSERT\
    \ INTO test (id, content) VALUES (?, ?)', data);\n```\n\nSometimes, you need to\
    \ retrieve certain information when inserting or updating rows, like the ID of\
    \ the last inserted record or the number of rows affected by a query. node-mysql\
    \ provides this information to an optional callback:\n\n```\nclient.query('INSERT\
    \ INTO test (content) VALUES (?)', ['the content'],\n    function(err, info) {\n\
    \        if (err) {\n            return handle_error(err);\n        }\n      \
    \  console.log(info.insertId);\n    }\n);\n\nclient.query('UPDATE test SET content\
    \ = ?', ['new content'], function(err, info) {\n    if (err) {\n        return\
    \ handle_error(err);\n    }\n    console.log(info.affectedRows);\n});\n```\n\n\
    You can see here that the callback provides a first argument containing an error\
    \ object in case of an error, as usual. If no error occurred, the second argument\
    \ contains an object with the results of your query. If you insert into a table\
    \ with an auto-incremented field, that object will contain an `insertId` property\
    \ with the value of that field. If the query you performed deleted, updated, or\
    \ removed rows, the property `affectedRows` will contain the number of affected\
    \ rows.\n\n# READING DATA EFFICIENTLY\n\nYou can and should read from the database\
    \ using placeholders, too. node-mysql provides the result set in two different\
    \ ways. Providing a callback to the query call is the most straightforward way:\n\
    \n```\nquery = client.query(\n    'SELECT id, content FROM test WHERE id IN (?,\
    \ ?)',\n    [1, 100], function(err, results, fields) {\n        if (err) {\n \
    \           throw err;\n        }\n        console.log(results);\n    }\n);\n\
    ```\n\nThe resulting output looks like this:\n\n```\n[ { id: 1, content: 'the\
    \ content' },\n  { id: 100, content: 'the content' } ]\n```"
  merge: -1
  pgno: 305
- img_proc: true
  md: "As you can see, you receive the complete set of rows as an array of objects,\
    \ in one go. When querying for large result sets, this can become problematic,\
    \ because Node.js has to buffer the whole result set in memory.\n\nTo circumvent\
    \ this, you can handle the result set row by row, by utilizing *node-mysql*'s\
    \ streaming API.\n\nWhen sending a query to the server using client.query, a Query\
    \ object is returned that emits several events to which you can listen: error,\
    \ field, row, and end.\n\nYou can use these events as follows:\n\n```\nquery =\
    \ client.query('SELECT id, content FROM test WHERE id IN (?, ?)', [1, 100]);\n\
    \nquery.on('error', function(err) {\n    throw err;\n});\n\nquery.on('field',\
