  md: "# CHAPTER 11 BUILDING HTTP SERVERS\n\nWhen you get the request event on a server,\
    \ you don't immediately get the body of that request, simply because it has not\
    \ arrived. But if you want to, you can listen for data events, or even pipe the\
    \ request body into a WriteStream, such as a file or a TCP connection, because\
    \ the request object is a ReadStream:\n\n```\nvar writeStream = ...\n\nrequire('http').createServer(function(req,\
    \ res) {\n  req.on('data', function(data) {\n    writeStream.write(data);\n  });\n\
    }).listen(4001);\n```\n\n# UNDERSTANDING THE HTTP.SERVERRESPONSE OBJECT\n\nThe\
    \ response object (the second argument for the request event callback function)\
    \ is used to reply to the client. With it you can write the headers and the response\
    \ body.\n\n# Writing a Header\n\nTo write a header, use res.writeHead(status,\
    \ headers), where headers is an optional argument with an object containing a\
    \ property for every header you want to send. Consider this example:\n\n```\n\
    require('http').createServer(function(req, res) {\n  res.writeHead(200, {\n  \
    \  'Content-Type': 'text/plain',\n    'Cache-Control': 'max-age=3600'\n  });\n\
    \  res.end('Hello World!');\n}).listen(4000);\n```\n\nThis example sets two headers,\
    \ one labeled \"Content-Type: text/plain\" and another labeled \"Cache-Control:\
    \ max-age=3600\".\n\nIf you save the previous source code into http_server.js\
    \ and run it with:\n\n```\n$ node http_server.js\n```\n\nyou can query it by your\
    \ browser or using a command-line HTTP client like curl:\n\n```\n$ curl -i http://localhost:4000\n\
    HTTP/1.1 200 OK\nContent-Type: text/plain\nCache-Control: max-age=3600\nConnection:\
    \ keep-alive\nTransfer-Encoding: chunked\nHello World!\n```"
  merge: -1
