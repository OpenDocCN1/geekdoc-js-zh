  md: "# Using Validators\n\nWhen users register a new user account on the website,\
    \ they can enter whatever data they want in these fields — Mongoose makes no validations.\
    \ You can, however, introduce constraints into your user schema. For instance,\
    \ you can introduce a new email field that is required and has to match a regular\
    \ expression, as shown in Listing 25-10.\n\nLISTING 25-10: New version of the\
    \ user schema with a new validated e-mail field in data/schemas/user.js.\n\n```\n\
    var mongoose = require('mongoose');\n\n// simple but incomplete email regex\n\
    var emailRegex = /.+\\.+\\.+;\n\nvar UserSchema = new mongoose.Schema({\n  username:\
    \ {type: String, unique: true},\n  name: String,\n  password: String,\n  email:\
    \ {\n    type: String,\n    required: true,\n    match: emailRegex\n  }\n});\n\
    \nmodule.exports = UserSchema;\n```\n\nNow, to see the validator in action, you\
    \ need to add the email field to the user creation form in views/users/new-jade:\n\
    \nh1 New User\n\n```\nform(method=\"POST\", action=\"/users\")\n  label(for=\"\
    username\") Username <br />\n  input(name=\"username\")\n  label(for=\"name\"\
    ) Name <br />\n  input(name=\"name\")\n  label(for=\"email\") Email <br />\n \
    \ input#email(name=\"email\")\n  label(for=\"password\") Password <br />\n  input#password(type=\"\
    password\", name=\"password\")\n  label(for=\"bio\") Bio <br />\n  textarea#bio(name=\"\
    bio\")\n  input(type=\"submit\", value=\"Create\")\n```"
