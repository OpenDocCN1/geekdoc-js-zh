  md: '# 1

    Installing Node


    WHAT''S IN THIS CHAPTER?


    +   - Getting Node up and running

    - Installing Node Package Manager (NPM)

    - Using NPM to install, uninstall, and update packages


    The European JSConf in 2009, Ryan Dahl, a young programmer, presented a project
    he had been working on. This project was a platform that combined Google''s JavaScript
    engine, an event loop, and a low-level I/O primitives. This project was not like
    other server-side JavaScript platforms where all the I/O primitives were event-driven
    and there was no way around it. By leveraging the power and simplicity of JavaScript,
    this project turned the difficult task of writing event-driven server-side applications
    into an easy one. The project received a standing ovation and has since been met
    with unprecedented growth, popularity, and adoption.


    The project was named Node.js and is now known to developers simply as Node. Node
    provides a purely event-driven, non-blocking infrastructure for building highly
    concurrent software.


    > NOTE Node allows you to easily construct fast and scalable network services.


    Ever since its introduction, Node has received attention from some of the biggest
    players in the industry. They have used Node to deploy networked services that
    are fast and scalable. Node is so attractive for several reasons.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'One reason is JavaScript. JavaScript is the most widely used programming language
    on the planet. Most web programmers are used to writing JavaScript in the browser,
    and the server is a natural extension of that.


    The other reason is Node''s simplicity. Node''s core functionalities are kept
    to a minimum and all the existing APIs are quite elegant, exposing the minimum
    amount of complexity to the programmers. When you want to build something complex,
    you can easily pick, install, and use several of the available third-party modules.


    Another reason Node is attractive because of how easy it is to get started using
    it. You can download and install it easily and then get it up and running in a
    matter of minutes.


    The typical way to install Node on your development machine is by following the
    steps on the http://nodejs.org website. Node installs out of the box on Windows,
    Linux, Macintosh, and Solaris.


    # INSTALLING NODE ON WINDOWDS


    Node supports the Windows operating system since version 0.6.0. To install Node
    on Windows, point your browser to http://nodejs.org/#download and download the
    node-v*.msi Windows installer by clicking on the link. You will then be prompted
    with a security dialog box, as shown in Figure 1-1.


    Click on the Run button, and you will be prompted with another security dialog
    box asking for confirmation. If you agree, the Node install wizard begins (see
    Figure 1-2).


    ![](img/0ecd190249c06126b55721d75b65cf3c_37_0.png)


    FIGURE 1-1


    FIGURE 1-2


    When you click Run, the Installation Wizard starts (see Figure 1-3).


    Click on the Next button and Node will start installing. A few moments later you
    will get the confirmation that Node was installed (see Figure 1-4).'
