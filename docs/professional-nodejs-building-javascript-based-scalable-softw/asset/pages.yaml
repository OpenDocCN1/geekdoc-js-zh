  md: "# Creating a TCP Server\n\n```\nvar timeout = 60000; // 1 minute\nsocket.setTimeout(timeout);\n\
    socket.on('timeout', function() {\n  socket.write('idle timeout, disconnecting,\
    \ bye!');\n  socket.end();\n});\n```\n\nOr, you can use this shorter form by passing\
    \ the event listener in the second argument of socket\n.setTimeout():\n\n```\n\
    socket.setTimeout(60000, function() {\n  socket.end('idle timeout, disconnecting,\
    \ bye!');\n```\n\n# Setting Up Keep-Alive\n\nIn Node, a socket can implement a\
    \ keep-alive mechanism to prevent timeouts from occurring\non the network or on\
    \ the peer. Node does that by sending an empty TCP packet with the ACK flag\n\
    turned on to trigger an empty reply from the other side. This activity will keep\
    \ the connection alive\nof both peers.\n\nYou can enable the keep-alive functionality:\n\
    \n```\nsocket.setKeepAlive(true)\n```\n\nYou can also specify the delay between\
    \ the last packet received and the next keep-alive packet. You\nd do so on the\
    \ second argument of the socket.setKeepAlive() call it like this:\n\n```\nsocket.setKeepAlive(true,\
    \ 10000); // 10 seconds\n```\n\n> NOTE This keep-alive setting is not related\
    \ to the socket timeout setting\ndiscussed earlier. The socket.setKeepAlive()\
    \ setting periodically sends an\nempty packet to keep the connection alive, whereas\
    \ socket.setTimeout() is\nused to define a local inactivity timeout.\n\n# Using\
    \ Delay by or No Delay\n\nThe kernel buffers the data before sending the TCP packets,\
    \ and it uses Nagle's algorithm to\ndeterm when to actually send the data. This\
    \ algorithm is used to reduce the number of packets\nthat are sent across the\
    \ network when an application sends small chunks of data. Depending on the\napplication,\
    \ this feature may turn out to be quite useful, but it introduces some delay in\
    \ sending\nt data, which may add up to overall latency in your application."
