  md: "# ADDING DATA TO THE DATABASE WITH SECURITY CONCERNS IN MIND\n\nNow, create\
    \ a table and insert two rows of data:\n\n```\nclient.query('USE node');\n\nclient.query('CREATE\
    \ TABLE test ' +\n    '(id INT(11) AUTO_INCREMENT, ' +\n    ' content VARCHAR(255),\
    \ ' +\n    ' PRIMARY KEY(id))'\n);\n\nclient.query('INSERT INTO test (content)\
    \ VALUES (\"Hello\")');\nclient.query('INSERT INTO test (content) VALUES (\"World\"\
    )');\n\nclient.end();\n```\n\nThis works well but has one problem. If queries\
    \ are constructed this way and you have no direct control over the values used\
    \ for the query (maybe because the value for *content* is provided by users inputting\
    \ it through a form on a web page), your application becomes vulnerable to *SQL\
    \ injection*. A malicious user can submit data to your application that, if passed\
    \ on to the database unfiltered, breaks out of the intended SQL statement and\
    \ allows the attacker to execute arbitrary statements that could cause harm.\n\
    \nHere is an example of SQL injection in action:\n\n```\nclient.query('USE node');\n\
    \nvar userInput = '\"); DELETE FROM test WHERE id = 1; -- ';\n\nclient.query('INSERT\
    \ INTO test (content) VALUES (\"' + userInput + '\")');\n\nclient.end();\n```\n\
    \nIt's a bit complicated to see what's actually going on, but this is what happens.\n\
    \nThe code is written with the intent to supply a text string — entered by the\
    \ user — to the query value for the *content* field. Of course, the actual user\
    \ input is only simulated, but imagine that the value of *userInput* originates\
    \ from a field of an HTTP form.\n\nIn this case, the attacker does not supply\
    \ a simple text string, but instead prematurely closes the original query by closing\
    \ the quotation mark and bracket with *\") ;*. She then starts her own query that\
    \ deletes the row with id 1. Because the second part of the original query — the\
    \ closing quotation marks and the closing bracket — would result in invalid SQL,\
    \ the attacker prefixes these with two dashes. This results in everything after\
    \ these dashes being treated as a comment and therefore being ignored.\n\nThus,\
    \ the complete statement received by the server is:\n\n```\nINSERT INTO test (content)\
    \ VALUES (\"\"; DELETE FROM test WHERE id = 1; -- \")\n```"
  merge: -1
  pgno: 303
- img_proc: true
  md: 'This results in one new row being inserted to the table, and the row with id
    1 being deleted.


    You can, and should, protect your application against these kinds of attacks on
    several levels. The most important thing to do is to always treat incoming data
    as potentially harmful and reject any data that does not match a strict definition
    of “harmless” as early as possible.


    At the point in your application where foreign data will make up parts of a database
    query, there is an additional precaution you can leverage to protect against certain
    attack scenarios. Using placeholders with value assignments, you can guarantee
    that any part of your query that is supposed to be treated as a value is indeed
    interpreted by the database as a value and can never be interpreted as, for example,
    a DELETE command.


    Placeholders enable you to do this because, instead of concatenating your own
    commands together with user input into a final SQL statement (which allows an
    attacker to break out of the SQL structure), you write a SQL statement that only
    contains the commands you intend and doesn''t contain any values. The placeholders
    denote the location of values, the values are provided separately, and the database
    combines both into a working statement.


    This way, the query isn''t digested as a whole but instead becomes semantically
    enriched — the database knows which parts of the query are to be treated as values
    and values only. Looking at the first example, the lack of this semantic allowed
    the attacker to execute a command instead of enter a value.


    Here is how you can issue a statement with placeholders and value replacement:


    ```

    client.query(''USE node'');


    var userInput = ''"); DELETE FROM test WHERE id = 1; -- '';


    client.query(''INSERT INTO test (content) VALUES (?)'', [userInput]);


    client.end();

    ```


    Although the user input is still malicious, it cannot harm the database anymore.
    Because the server knows that anything in userInput is to be treated as the value
    for the content field, you don''t end up with a deleted row 1 but with a new row
    whose content field has the value "); DELETE FROM test WHERE id = 1; --.


    Although this is probably not the content you wished for, you have stopped the
    attack itself.


    Value assignment in node-mysql works by writing a SQL statement with quotation
    marks as placeholders for values and by additionally supplying an array of values
    that replace each of the placeholders in sequence. Matching multiple placeholders
    with multiple values works by simply traversing the supplied array from lower
    to higher keys, thus the following statement will result in the same data being
    written.


    ```

    var data = [100, "the content"];


    client.query(''INSERT INTO test (id, content) VALUES (?, ?)'', data);

    ```


    is equal to'
