    # Parsing Cookies


    Cookies are a standard used to store data as short strings on the web browser.
    A server can send one or many cookies, and each cookie has a name. The server
    can send one or more of these in the response of any request by using Set-Cookie
    response headers. The web browser has to store each of them and send them along
    as a single Cookie header on the following requests until the cookie'
