  md: '# Running Node


    Now you are ready to start Node. First you can simply experiment running Node
    as a command-line-interface (CLI). For that you need only to call the Node executable
    with no arguments like this:


    ```

    $ node

    ```


    This will start the CLI, which will then wait for you to input an expression.
    Just to test the installation and see Node actually doing something, you can type:


    ```

    > console.log(''Hello World!'');nHello World!

    undefined

    ```


    You can also run a JavaScript script from a file. For instance, if you create
    a file with this content:


    ```

    console.log(''Hello World!'');

    ```


    Name the file hello_world.js. Then run the file by passing the path as first argument
    to the Node executable while inside a shell prompt. For example:


    ```

    $ node hello_world.js

    Hello World!

    ```


    You can quit the CLI by typing Ctrl+D or Ctrl+C.


    # SETTING UP USING NODE PACKAGE MANAGER


    You can only get so far using the language features and the core functions. That''s
    why most programming languages have a system in place that allows you to download,
    install, and manage third-party modules. In Node, we Node Package Manager (NPM).


    NPM is three things — a third-party package repository, to manage packages installed
    in your computer, and a standard to define dependencies on other packages. NPM
    provides a public registry that contains all the packages that programmers publish
    in NPM. NPM also provides a command-line tool to download, install, and manage
    these packages. You can also use the standard package descriptor format to specify
    which third-party modules your module or application depends on.


    You don''t need to know about NPM to start using Node, but it will become necessary
    once you want to use third-party modules. Because Node provides only low-level
    APIs, including third-party modules is almost always necessary to fulfill any
    complex application without having to do it all yourself. As you will see, NPM
    allows you to download and play with modules without installing packages globally,
    which makes it ideal for playing and trying things.


    NPM and Node once required separate installs, but since Node version 0.6.0, NPM
    is already included.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Using NPM to Install, Update, and Uninstall Packages


    NPM is a powerful package manager and can be used in many ways. NPM maintains
    a centralized repository of public modules, which you can browse at http://search.npmjs.org.
    A Node opensource author may choose, as most do, to publish the module to NPM,
    and in the installation instructions should be the NPM name you use to remotely
    download and install it.


    This section covers the typical uses of NPM, which are installing and removing
    packages. This should be just enough for you to start managing your application
    dependencies on third-party modules published on NPM. However, you first need
    to understand the differences between global and local modes of operation and
    how these affect module lookups.


    # Using the Global versus the Local Mode


    NPM has two modes of operation: global and local. These two modes change target
    directories for storing packages and have deep implications for how Node loads
    modules.


    The local mode is the default mode of operation in NPM. In this mode, NPM works
    on the local directory level, never making system-wide changes. This is ideal
    for installing the modules your application depends on without affecting other
    applications you might also have installed locally.


    The global mode is more suited for installing modules that should always be available
    globally, the ones that provide command-line utilities and that are not directly
    used by applications.


    Always use the default local mode if you are in doubt. If module authors intend
    for one specific module to be installed globally, generally they will tell you
    so in the installation instructions.


    # The Global Mode


    If you installed Node using the default directory, while in the global mode, NPM
    installs packages to /usr/local/lib/node_modules. If you type the following in
    the shell, NPM will search for, download, and install the latest version of the
    package named sax inside the directory /usr/local/lib/node_modules/sax:


    ```

    $ npm install -g sax

    ```


    > NOTE If your current shell user doesn''t have enough permissions, you will need
    to log in as the root user or run this command within sudo:


    $ sudo npm install -g sax


    If you then have the requirement for this package in any Node script:


    ```

    var sax = require(''sax'');

    ```'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'Node will pick up this module in this directory (unless you have installed
    locally, in which case Node picks the local version).


    The local mode is the default mode, and you have to explicitly activate the global
    mode in NPM using the --g flag.


    # The Local Mode


    The local mode is the default mode of operation in NPM and the recommended dependency
    resolution mechanism. In this mode NPM installs everything inside the current
    directory — which can be your application root directory — and touches any global
    settings. This way you can choose, application by application, which modules and
    which versions to install without polluting global space. This means you can have
    two applications that depend on different versions of the same module without
    conflicting.


    In this mode, NPM works with the node_modules directory under the current working
    directory. If you are inside /home/user/apps/my_app, NPM will use /home/user/apps/my_app/node_modules
    file store for the modules


    If you run a Node app installed in the directory /home/user/apps/my_app, Node
    will search this /home/user/apps/my_app/node_modules directory first (before trying
    the parent directories and finally searching for it inside the global one). This
    means that Node is resolving a module dependency, a module installed using the
    local mode will always take precedence over a module installed globally.


    # Installing a Module


    Using the following command, you can download and install the latest version of
    a package:


    ```

    $ npm install <package name>

    ```


    For example, to download and install the latest version of the sax package, you
    should first change your current directory to your application root directory
    and then type:


    ```

    $ npm install sax

    ```


    This will create the node_modules directory if it doesn''t already exist and install
    the sax module under.


    You can also choose which version of a specific module to install by specifying
    it like this:


    ```

    $ npm install <package name>@<version spec>

    ```


    You can use a specific version number in the <version spec> placeholder. For instance,
    if you want to install version 0.2.5 of the sax module, you need to type:


    ```

    $ npm install sax@0.2.5

    ```


    Under <version spec> you can also specify a version range. For instance, if you
    want to install the latest release of the 0.2 branch, you can type:'
