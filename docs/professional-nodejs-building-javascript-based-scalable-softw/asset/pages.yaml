  md: '# INTRODUCTION


    IN 1995, WHEN I WAS IN MY SECOND YEAR IN COLLEGE, I was introduced to UNIX network
    programming. In C, you could create sockets to open TCP connections to servers
    and code the servers that accepted these connections. I remember the excitement
    I felt the first time I created a TCP server: I could accept connections and receive
    and send messages on them.


    If I wanted my server to accept many concurrent connections, the common solution
    was to use threads, but soon I had created my first multi-threaded TCP server.
    This server accessed a shared data structure, which needed to synchronize the
    access to all the client threads that had been spawned. Getting the synchronization
    fine-grained (to maximize resources and time) and right (to avoid deadlocks) proved
    to be more difficult than anticipated.


    A couple of years later, I entered the working world to become a consultant, programming
    and leading teams to implement various client projects. At first I continued to
    work within the UNIX world, but soon I was diverted to Java and all its enterprise
    flavors and finally landed on the fertile plains of web development, using scripting
    languages like PHP and Ruby. Doing web, I slowly became familiar with JavaScript
    and the event-driven programming model, never realizing it would later connect
    me back to the world of Ruby.


    Fast-forwarding to early 2010, a good friend of mine told to me about Node.js.
    It was fast, he said, and you can program it in JavaScript. It transported the
    event-driven browser programming into the UNIX network programming world.


    Curious, I went to take a look at the API documents and was immediately hooked.
    The ease with which you could create highly scalable servers without using threads
    and mix-and-match client and server code made me a deep dive into Node''s core
    and surrounding modules. Node.js connected the ease of a scripting language with
    all the power of UNIX network programming, and I felt like I was finally home.


    # WHO THIS IS FOR


    This book was written for the developer who is familiar with JavaScript, either
    browser or server-side programming. The reader should be familiar with some introductory
    concepts of how TCP and HTTP works. For the later chapters it also helps if the
    reader is familiar with classic development for the web (HTML, CSS, and JavaScript).


    If you already have Node.js installed, you may skip Chapter 2, "Introducing Node."


    If you already know the basics of how Node.js works internally and know about
