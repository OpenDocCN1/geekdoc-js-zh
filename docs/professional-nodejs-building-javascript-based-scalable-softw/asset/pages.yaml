  md: "# # Setting Up the Server Options\n\nTo create a server, you can do something\
    \ like this:\n\n```\nvar fs = require('fs');\nvar https = require('https');\n\n\
    var options = {\n  key: fs.readFileSync('server_key.pem'),\n  cert: fs.readFileSync('server_cert.pem')\n\
    };\n\nvar server = https.createServer(options, function(req, res) {\n  res.writeHead(200,\
    \ {'Content-Type': 'text/plain'});\n  res.end('Hello World!');\n});\n```\n\nThe\
    \ first argument of `https.createServer` is an options object that, much like\
    \ with the TLS module, provides the private key and the certificate strings. Just\
