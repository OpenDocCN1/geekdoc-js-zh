  md: '# INTRODUCTION


    After introducing core Node.js concepts and API subsets, I go into application
    building starting in Chapter 17 (“Testing Modules and Applications”) and cover
    debugging (Chapter 18, “Debugging Modules and Applications”), and I present some
    tips on controlling asynchronous flow (Chapter 19, “Controlling the Callback Flow”).


    Next, I address the necessary parts of building web applications, starting in
    Chapter 20, “Building and Using HTTP Middleware,” passing through Express.js (Chapter
    21), and creating real-time web allocations using Socket.IO (Chapter 22).


    Finally, I also address how to access and use databases from Node.js, including
    MySQL (Chapter 23), CouchDB (Chapter 24), and MongoDB (Chapter 25).


    # WHAT THIS BOOK COVERS


    This book covers Node.js v0.8, Express.js v2.5, Socket.io v0.9, Node-mysql v0.9,
    Nano v3.1, and Mongo v2.7.


    # HOW THIS BOOK IS STRUCTURED


    The book starts with setting up and introducing Node.js.


    It then explains the Node core fundamentals, which include modules, buffers, the
    Event Emitter pattern, and timers, after which the fundamental Node core specific
    file and networking APIs are introduced and explained, all complemented with practical
    examples.


    After covering Node core concepts, the book continues with some best practices
    for developing applications with Node.js, such as testing modules, debugging applications,
    and maintaining of the asynchronous callback flow.


    Building real-time web applications is one of the main cases of Node, and this
    book shows how to do it using Connect, Express.js, and Socket.IO.


    Because most applications need to connect to a database, the book explains how
    to connect to and use MySQL, CouchDB, and MongoDB from your Node.js application.


    # WHAT YOU NEED TO USE THIS BOOK


    To install and run Node.js applications, you need a PC or Macintosh computer running
    a recent version of either Windows, Linux, or MacOS.


    The source code for the samples is available for download from the Wrox website
    at: www.wrox.com/remtitle.cgi?isbn=P010093766.'
