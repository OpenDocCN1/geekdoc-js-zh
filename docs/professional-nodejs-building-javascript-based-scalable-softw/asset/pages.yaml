    \ function() {\n  client.on('data', function(data) {\n    console.log('got some\
    \ data from the server:', data);\n  });\n});\n```\n\n# Ending the Connection\n\
    \nDepending on your application and the agreed-upon protocol between the server\
    \ and the client, the client may end the connection after it no longer needs it.\n\
    \nBecause this only closes your end of the connection, you may still continue\
