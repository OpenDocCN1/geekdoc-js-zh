    HTTP has become a central part of the infrastructure of many private and public
    services over the Internet. Not only used to serve static content, HTTP has become
    the preferred way of serving and consuming public-facing API calls.


    Because it is good at handling I/O, Node is a good fit not only for providing
    but also for these HTTP services. In the following sections you will learn to
    perform and control HTTP requests using the core http module and a useful third-party
    request module.


    In the HTTP protocol, the request has two important properties: the URL and the
    method. The most common method used is the GET method, which is mainly used to
    request content, but other methods exist like POST (mainly used for submitting
    web forms), PUT, DELETE, and HEAD. Each one gets different results from the server.


    # MAKING GET REQUESTS


    This example uses http.get to make an HTTP GET request to the URL www.google.com:80/index.html.


    ```

    var http = require(''http'');

    var options = {

