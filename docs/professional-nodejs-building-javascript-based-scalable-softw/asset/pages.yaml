  md: '# CHAPTER 2 INTRODUCING NODE


    Dahl then turned to JavaScript. JavaScript has closures and first-class functions,
    which makes it a powerful match for event-driven programming. The power of JavaScript
    is one of the main reasons Node has become popular.


    # What Are Closures?


    Closures are functions that inherit variables from their enclosing environment.
    When you pass a function callback as an argument to another function that will
    do I/O, this callback function will be invoked later, and this function will almost
    magically — remember the context in which it was declared, along with all the
    variables available in context and any parent contexts. This powerful feature
    is at the heart of Node''s success.


    The following example shows how a closure works when programming JavaScript in
    the web browser. For instance, if you want to listen for an event — a button click,
    for instance — you can do something like:


    ```

    var clickCount = 0;

    document.getElementById(''myButton'').onclick = function() {

    clickCount += 1;

    alert(''clicked '' + clickCount + '' times.'');

    };

    ```


    Or, using jQuery:


    ```

    var clickCount = 0;

    $(''#mybutton'').click(function() {

    clickCount++;

    alert(''Clicked '' + clickCount + '' times.'');

    };

    ```


    In JavaScript, functions are first-class objects, which means you can pass functions
    as arguments to other functions. In both examples you assigned or passed a function
    as an argument to execute later. The callback handling function — your callback
    function — has every variable in scope at the point where the function was declared,
    which means that, in this case, it has access to the clickCount variable declared
    in the closure scope.


    The variable clickCount stores the number of times the user has clicked on the
    button. This variable is stored in the global scope (the outermost scope you can
    get to in JavaScript). Storing variables in the global scope is generally bad
    practice because they can easily collide with other code; keep variables in a
    scope that is local to the functions that need to use them. Most of the time you
    can avoid global scope pollution by wrapping all of your code inside another function
    to create an additional closure, as in the next example:


    ```

    function() {

    var clickCount = 0;

    $(''#mybutton'').click(function() {

    clickCount++;

    alert(''Clicked '' + clickCount + '' times.'');

    });

    }();

    ```'
