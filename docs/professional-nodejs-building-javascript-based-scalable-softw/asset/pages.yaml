  md: "```\nvar exec = require('child_process').exec;\nvar options = {\n  timeout:\
    \ 10000,\n  killSignal: 'SIGKILL'\n};\nexec('cat *.js | wc -l', options, function(err,\
    \ stdout, stderr) {\n  // ...\n});\n```\n\nThe available options are:\n\n+   -\
    \ cwd — current working directory. Use this if you want to force the current working\
    \ directory.\n- encoding — the expected encoding for the child output. Defaults\
    \ to the string utf8, which identifies the UTF-8 encoding. Use this if the process\
    \ you are executing outputs in an encoding other than UTF-8. Node supports these\
    \ encodings:\n  - ascii\n  - utf8\n  - ucs2\n  - base64\n\nIf you want more information\
    \ about the supported Node encodings, refer to Chapter 4, \"Using Buffers to Manipulate,\
    \ Encode, and Decode Binary Data.\"\n\n+   - timeout — the timeout in milliseconds\
    \ for the execution of the command. Defaults to 0, which waits indefinitely for\
    \ the child process to end.\n- maxBuffer — specifies the maximum size in bytes\
    \ of the output allowed on the stderr streams. If exceeded, the child is killed.\
    \ Defaults to 200 * 1024.\n- killsSignal — the signal to be sent to the child\
    \ if it times out or exceeds the output buffers.\n\nThe default value for this\
    \ is SIGTERM, which sends a termination signal to the process. This is usually\
    \ the order of ending processes. When using the SIGTERM signal, the process is\
    \ able to handle and override the default behavior. If the target process expects\
    \ it, you can send another signal altogether (like SIGUSR1, for instance). You\
    \ can also send a KILL signal, which is handled by the operating system and forces\
    \ the process to terminate immediately, without a cleanup routine being triggered.\n\
    \nIf you want to handle process termination more closely, you should use the child_process.spawn\
    \ function instead, which is covered later.\n\n+   - env — environment variables\
    \ to be passed into the child process. Defaults to null, which means the child\
    \ process inherits all the parent environment variables that are defined right\
    \ before spawning it."
