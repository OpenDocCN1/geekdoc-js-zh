    you passed to it is invoked (line 6), calling the schedule function, which will
    again schedule the do_it function to be executed in one second, thus restarting
    the cycle.


    # SUMMARY


    You can use setTimeout() to schedule the future execution of a function, which
    you can cancel with clearTimeout(). You can also schedule the periodic execution
    of a function by using setInterval() and unschedule it by using clearInterval().


    If you block the event loop with a processor-intensive operation, your scheduled
    functions will be delayed or never execute. You learned that you shouldn''t perform
    CPU-intensive operations inside the event loop and that you can defer the execution
    of a function until the next iteration of the event loop by using process.nextTick().


    Using I/O and setInterval() does not guarantee that there won''t be more than
    one pending call at any given time. However, you can circumvent this potential
    issue by using a recursive function and setTimeout().'
