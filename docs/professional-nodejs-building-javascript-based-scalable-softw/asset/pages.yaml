  md: "This default set of certificates will be used for authenticating the server.\
    \ The server will send its identification, and the TLS client will check the signature\
    \ of that identification against any of the trusted Certificate Authorities.\n\
    \nIf the certificate is authorized, the CleartextStream instance (which you assigned\
    \ back to a variable client) will have the property named authorization set to\
    \ true. If not, the stream will have that property set to false, and the stream\
    \ authorizationError will be set with the reason for the error. You can, if you\
    \ want, reject the connection to the server if the certificate is not authorized\
    \ by your root CAs, like this:\n\n```\nvar client = tls.connect(port, host, options,\
    \ function() {\n  console.log('authorized: ' + client.authorized);\n  if (! client.authorized)\
