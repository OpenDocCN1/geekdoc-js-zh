  md: "Save this code to server.js.\n\nThe corresponding client part looks like Listing\
    \ 22-2.\n\n# LISTING 22-2: A basic Socket.IO client.\n\n```\n<html>\n  <head>\n\
    \    <title>Socket.IO example application</title>\n    <script src=\"http://localhost:4000/socket.io/socket.io.js\"\
    ></script>\n    <script>\n      var socket = io.connect('http://localhost:4000');\n\
    \      socket.emit('my event', 'Hello world.');\n    </script>\n  </head>\n  <body>\n\
    \  </body>\n</html>\n```\n\nSave this in the same directory as index.html.\n\n\
    As you can see, both sides use a similar vocabulary. On the server, the first\
    \ step is to bind to a TCP port, 4000 in this case. As soon as the server is running,\
    \ it listens to incoming WebSocket connections. The connection event is triggered\
    \ as soon as a new client connects. The server then listens for incoming messages\
    \ on this connection, logging the content of any message it receives.\n\n> **NOTE**\
    \ As you can see, Socket.IO provides a message-oriented communication mechanism.\
    \ This is an improvement over the underlying WebSockets protocol, which doesn't\
    \ provide message framing.\n\nYou can also see that Socket.IO does not distinguish\
    \ between a client that is connected using WebSockets or any other type of mechanism:\
    \ It provides a unified API that abstracts away those implementation details.\n\
    \nThe event name my event is arbitrary — it's just a label the client gives the\
    \ messages it sends, and it is used to distinguish among different types of messages\
    \ within an application.\n\nOn the client, a WebSocket connection is created by\
    \ connecting to the server. This socket is then used to emit (or send) a message\
    \ with the label my event to the server. This triggers the listener in the server\
    \ code and results in the message content being logged to the console.\n\nNow,\
    \ it would be great if you could just open the HTML file locally via file:///path/to/index.html,\
    \ but that doesn't work reliably in all browsers because of security constraints\
    \ that apply when opening local files.\n\nTherefore, you need to serve the HTML\
    \ through the Node.js server, which allows you to request http://localhost:4000/,\
    \ which doesn't impose any security restrictions because it's a “real” HTTP request."
