    \      } else {\n        next(err);\n      }\n    }\n    return;\n    res.redirect('/articles');\n\
    \  });\n});\n```\n\n```\napp.del('/articles/:title', loggedIn, loadArticle, function(req,\
    \ res, next) {\n  req.article.remove(function(err) {\n    if (err) return next(err);\n\
    \    res.redirect('/articles');\n  });\n});\n\n```\n\nBecause this is mainly a\
