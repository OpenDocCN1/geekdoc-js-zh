- img_proc: true
  md: "```\nlabel(for=\"gender\") Gender<br />\ninput#gender(name=\"gender\")\np\n\
    label(for=\"bio\") Bio<br />\ntextarea#bio(name=\"bio\")\np\ninput(type=\"submit\"\
    , value=\"Create\")\n```\n\nBesides enumerating the possible values or providing\
    \ a regular expression, you can provide a custom function that will validate the\
    \ field. For instance, you may want to add a birth date to the user profile and,\
    \ for some reason, validate that the user is at least 18 years old.\n\nFirst,\
    \ because JavaScript stores dates in milliseconds, you need to convert 18 years\
    \ to milliseconds. You should do this at the beginning of your users routes module\
    \ in `data/schemas/user.js`:\n\n```\nvar TIMESSPAN_YEAR = 31536000000;\nvar TIMESSPAN_18_YEARS\
    \ = 18 * TIMESSPAN_YEAR;\n```\n\nThen you need to provide the validation function,\
    \ which you should also provide at the top of your user’s schema module in `data/schemas/user.js`:\n\
    \n```\nfunction validate_18_years_old_or_more(date) {\n  return (Date.now() -\
    \ date.getTime()) > TIMESSPAN_18_YEARS;\n}\n```\n\nThis function takes a date\
    \ and returns a boolean that notes whether the date is more than 18 years old.\n\
    These are the required schema changes:\n\n```\nvar UserSchema = new mongoose.Schema({\n\
    \  username: {type: String, unique: true},\n  name: String,\n  password: String,\n\
    \  email: {\n    type: String,\n    required: true,\n    match: emailRegexp\n\
    \  },\n  gender: {\n    required: true,\n    type: String,\n    uppercase: true,\n\
    \    'enum': ['M', 'F']\n  },\n  birthday: {\n    type: Date,\n    validate: [\n\
    \      validate_18_years_old_or_more,\n      'You must be 18 years old or more'\n\
    \    ]\n  }\n});\n```"
