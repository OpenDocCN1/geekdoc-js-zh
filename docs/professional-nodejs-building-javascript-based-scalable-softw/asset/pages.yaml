  md: "# 16\n# Securing Your HTTP Server with HTTPS\n\nWHAT'S IN THIS CHAPTER?\n\n\
    +   - Setting up an HTTPS server\n- Making requests to an HTTPS server\n- Validating\
    \ client and server certificates\n\nHTTPS adds the security capabilities of TLS\
    \ to the standard HTTP protocol. In Node HTTPS is implemented as a separate module\
    \ from HTTP. The HTTPS API is very similar to the HTTP one, with some small differences.\n\
    \nThe Node core module extends the core http module and uses the tls module as\
    \ a transport mechanism. For instance, the https.Server pseudo-class simply inherits\
    \ from the http.Server pseudo-class, overriding the way connections are constructed\
    \ inside the corresponding Agent class, which instantiates a TLS connection instead\
    \ of a plain TCP one.\n\n# BUILDING A SECURE HTTP SERVER\n\nIn this section you\
    \ will set up an HTTP server that talks to clients through a secured encrypted\
    \ channel. This HTTP server can provide self-authentication to clients and authenticate\
    \ client identification.\n\nFirst you have to create the server private key and\
    \ self-signed certificate like you did in the previous chapter:\n\n```\n$ openssl\
    \ genrsa -out server_key.pem 1024\n$ openssl req -new -key server_key.pem -out\
    \ server_csr.pem\\n$ openssl x509 -req -in server_csr.pem -signkey server_key.pem\n\
    \    -out server_cert.pem\n```\n\nThe second step prompts you with some questions\
    \ — you can answer them as you like."
