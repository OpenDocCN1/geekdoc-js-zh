  md: "# Writing to a File\n\nTo write into an open file, you can use fs.write(),\
    \ passing in a buffer with data:\n\n```\nvar fs = require('fs');\nfs.open('./my_file.txt',\
    \ 'a', function opened(err, fd) {\n  if (err) throw err;\n  var writeBuffer =\
    \ new Buffer('writing this string'),\n  bufferPosition = 0,\n  bufferLength =\
    \ writeBuffer.length, filePosition = null;\n  fs.write(fd,\n    writeBuffer,\n\
    \    bufferPosition,\n    bufferLength,\n    filePosition,\n    function write(err,\
    \ written) {\n      if (err) throw err;\n      console.log('wrote ' + written\
    \ + ' bytes');\n    }\n});\n```\n\nIn this example, you are opening the file in\
    \ append mode (a) on line 3, and then writing it on line 9. You are passing in\
    \ a buffer with the following information:\n\n+   - The data you want written\
    \ to the buffer\n- The position inside the buffer where the data should start\n\
    - The length of the data you want to write\n- The file position you want to start\
    \ writing from\n- A callback function called write, which will be invoked once\
    \ the operation ends\n\nIn this case, you are passing in a file position of null,\
    \ which indicates that the write will happen at the current cursor. Because you\
    \ are opening the file in append mode, the file cursor is positioned at the end\
