  md: "# INSTALLING MONGOOSE\n\nIn this chapter you create code that accesses a MongoDB\
    \ server. To do this in Node, you will use the Mongoose third-party module. Mongoose\
    \ allows you to access MongoDB using an object model.\n\nIn Chapter 21, “Making\
    \ a Web Application Using Express.js,” you had several route listeners for managing\
    \ users, which were the public interface for managing a user database. This database\
    \ was a fake in-memory object, making it obviously non-persistent and only suited\
    \ for a prototype. However, now that you can use a MongoDB database using Mongoose,\
    \ you can replace it with a real persisted data access layer.\n\nStart by copying\
    \ the final application code from Chapter 21 into the new project directory and\
    \ start from there. Now you need to change the application manifest package.json\
    \ file and add the Mongoose dependency, as shown in Listing 25-1.\n\nLISTING 25-1:\
    \ The application package.json manifest file.\n\n```\n{\n    \"name\": \"application-name\"\
    \n    , \"version\": \"0.0.1\"\n    , \"private\": true\n    , \"dependencies\"\
    : {\n        \"express\": \"2.5.11\"\n        , \"jade\": \">= 0.0.1\"\n     \
    \   , \"mongoose\": \">=2.7.0\"\n    }\n}\n```\n\nThis file notes that the scripts\
    \ you are building require any version of Mongoose greater or equal to 2.7.0.\
    \ Now you can actually install Mongoose by:\n\n```\n$ npm install\n...\nmongoose@2.7.1\
    \ ./node_modules/mongoose\n├── hooks@0.2.1\n└── mongodb@1.0.2 (bson@0.0.6)\n```\n\
    \n# UNDERSTANDING HOW MONGOOSE USES MODELS TO ENCAPSULATE DATABASE ACCESS\n\n\
    Mongoose is a tool for modeling objects that interact with the database. A database\
    \ has many collections, and a collection has many documents. Nothing requires\
    \ two documents in the same collection to have a similar structure, but, for instance,\
    \ if a “user” collection contains user records, all documents in that collection\
    \ will be similar."
  merge: -1
  pgno: 346
- img_proc: true
  md: "In Mongoose you define document schemas. Each schema can contain a list of\
    \ fields and their constraints. Each field can have a type and some type-specific\
    \ constraints, like a minimum value, for example, if the presence of a value is\
    \ required, if the value should be unique throughout the other documents in the\
    \ collection, if a validation rule is required, and so on.\n\nFirst you need to\
    \ connect to your MongoDB server, whether you installed it locally or subscribed\
    \ to\nan external service over the Internet. For this need you to specify a MongoDB\
    \ database URL with\nthe scheme:\n\n```\nmongodb://username:passwordhostname:port/database\n\
    ```\n\nIf you are connecting to MongoDB on your local machine, the server probably\
    \ doesn't need a\npassword, in which case you can simply use the following:\n\n\
    ```\nmongodb://localhost/database\n```\n\nThen you need to tell Mongoose to connect\
    \ to the database, and you can do so in the app.js file:\n\n```\nvar dbURL = 'mongodb://localhost/database';\n\
    var db = require('mongoose').connect(dbURL);\n```\n\nIf you haven't created a\
    \ MongoDB database for your application, you need to do so now.\n\n# DEFINING\
    \ A SCHEMA\n\nYou now need to create a schema module to define what a user document\
    \ will look like. You'll\n the data/schemas directory to host the schema modules,\
    \ where you will create a file named\nuser.js, as shown in Listing 25-2.\n\n>\
    \ LISTING 25-2: The user schema in data/schemas/user.js.\n\n```\nvar mongoose\
    \ = require('mongoose');\n\nvar UserSchema = new mongoose.Schema({\nusername:\
    \ String,\nname: String,\npassword: String\n});\nmodule.exports = UserSchema;\n\
    ```\n\nHere you are defining a basic schema with three fields, all of them strings.\
    \ Later in this chapter, you'll\n how you can evolve this schema to be more helpful\
    \ and to support more complex documents."
  merge: -1
  pgno: 347
- img_proc: true
  md: "# DEFINING A MODEL\n\nNow you need to define a model that will map into the\
    \ user collection in the database. You will also define this as a module under\
    \ data/models/user.js, as shown in Listing 25-3.\n\nLISTING 25-3: The user model\
    \ in data/models/user.js.\n\n```\nvar mongoose = require('mongoose');\nvar UserSchema\
    \ = require('../schemas/user');\n\nvar User = mongoose.model('User', UserSchema);\n\
    \nmodule.exports = User;\n```\n\nNow you need to use this model in your route\
    \ listeners. But first you need to update some routing middleware to support the\
    \ user document model. First, create a module located in routes/middleware/load_user.js\
    \ that defines a piece of middleware used to load users, as shown in Listing 25-4.\n\
    \nLISTING 25-4: The load user route middleware using the user model.\n\n```\n\
    var User = require('../data/models/user');\n\nfunction loadUser(req, res) {\n\
    \  User.findOne(req.params.name, function(err, user) {\n    if (err) {\n     \
    \ return next(err);\n    }\n    if (!user) {\n      return res.send('Not found',\
    \ 404);\n    }\n    req.user = user;\n    next();\n  });\n}\n\nmodule.exports\
    \ = loadUser;\n```\n\nHere you are using the findOne method provided in the user\
    \ model object. The first argument to it is the query parameters, in this case\
    \ is an exact match with the name request parameter. The second argument is a\
    \ callback function that is invoked when there is an error or the find operation\
    \ has terminated. If there is an error, it is forwarded to the next callback.\
    \ If no such user is found in the user collection, you reply with a 404 Not Found\
    \ status code and stop execution. Otherwise, if the user is found, you assign\
    \ it to the req.user property so other route listeners can use it later.\n\nNow\
    \ you can modify the user's route behavior, as shown in Listing 25-5."
