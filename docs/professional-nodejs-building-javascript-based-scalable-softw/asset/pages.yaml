  md: '# 3


    # # Loading Modules


    WHAT''S IN THIS CHAPTER?


    +   - Loading modules

    - Creating modules

    - Using the node_modules folder


    JavaScript is one of the most frequently deployed programming languages in the
    world; it''s the web''s lingua franca, used by all the browsers. The core of the
    language was created quickly back in the Netscape days, in a rush to beat Microsoft
    during the heat of the browser wars. The language was released prematurely, which
    inevitably meant it came out out with some bad features.


    Despite its short development time, JavaScript also shipped with some really powerful
    features. The sharing of a global namespace among all scripts that have been loaded
    is one of them, though. Once you load JavaScript code into a web page, it is injected
    into the global namespace, which is a common addressing space shared by all scripts.
    This can lead to security issues, conflicts, and general bugs that are hard to
    trace and solve.


    Thankfully, Node brings some order in regard to server-side JavaScript and implements
    the CommonJS standard. In this standard each module has its own context, separated
    from the other modules. This means that modules cannot pollute a global scope
    — because there is none — and cannot interfere with other modules.


    In this chapter, you will learn about different types of modules and how to load
    them into your application.


    Dividing your code into a series of well-defined modules can help you keep your
    code under control. You will also see how you can create and use your own modules.'
