    \ninputElement.onkeydown = function(keyboardEvent) {\n    if (keyboardEvent.keyCode\
    \ === 13) {\n        socket.emit('clientMessage', inputElement.value);\n     \
    \   inputElement.value = '';\n        return false;\n    } else {\n        return\
    \ true;\n    }\n};\n</script>\n\n</body>\n</html>\n```\n```\n\nThis implements\
    \ the simplest chat use case. When you start the chat server with node server.js\
    \ and open http://localhost:4000/, you will be presented with a very Spartan interface\
    \ that allows sending and receiving messages from other users. It makes sense\
    \ to open another browser window or tab to simulate real multi-user interaction.\n\
    \n# Extending the Chat Application\n\nAt this point, the chat exchange protocol\
    \ between client and server isn't exactly vast — each side emits one type of message\
    \ and reacts to one type of message. This will change when the use cases within\
    \ the application become more complex.\n\nFor example, it's not convenient that\
    \ chat users are identified by their internal socket connection ID. It would be\
    \ nice if before entering the chat, users could identify themselves by name.\n\
    \nThis can be implemented by adding another type of client-to-server Socket.IO\
    \ message type, which could be called login.\n\nThe server needs to handle this\
    \ message by associating the name of the user — which is the content part of the\
    \ login message — with the socket connection.\n\n```\n```javascript\nsocket.on('login',\
    \ function(username) {\n    socket.set('username', username, function(err) {\n\
    \        if (err) { throw err; }\n        socket.emit('serverMessage', 'Currently\
    \ logged in as ' + username);\n        socket.broadcast.emit('serverMessage',\
    \ 'User ' + username +\n            ' logged in');\n    });\n});\n```\n```\n\n\
    This code on the server is setting the username on the socket. Using socket.set\
    \ you can set any key-value pair on the socket, keeping any information around\
    \ you may find useful for the current socket connection."
