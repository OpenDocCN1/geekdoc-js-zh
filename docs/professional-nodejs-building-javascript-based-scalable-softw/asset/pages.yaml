    argument named t, which contains the control object for this test. With this object
    you can test your expectations and end the current test. It''s important that
    you end the test explicitly. Node-tap supports asynchronous tests, which means
    that if you''re performing any IO, the test will still run after your test function
    returns. Node-tap ends a test only when you call the end method on.


