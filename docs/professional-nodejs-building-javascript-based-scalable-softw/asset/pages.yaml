  md: "```\nLISTING 22-4: A simple Socket.IO chat server.\n\nvar httpd = require('http').createServer(handler);\n\
    var io = require('socket.io').listen(httpd);\nvar fs = require('fs');\n\nhttpd.listen(4000);\n\
    \nfunction handler(req, res) {\n  fs.readFile(__dirname + '/index.html',\n   \
    \ function(err, data) {\n      if (err) {\n        res.writeHead(500);\n     \
    \   return res.end('Error loading index.html');\n      }\n\n      res.writeHead(200);\n\
    \      res.end(data);\n    }\n  );\n}\n\nio.sockets.on('connection', function\
    \ (socket) {\n  socket.on('clientMessage', function(content) {\n    socket.emit('serverMessage',\
    \ 'You said: ' + content);\n    socket.broadcast.emit('serverMessage', socket.id\
    \ + ' said: ' + content);\n  });\n});\n```\n\n# The Chat Client\n\nBecause message\
    \ handling on the server side of the application is still basic, most of the heavy\
    \ lifting actually happens on the client side.\n\nTherefore, you need to rewrite\
    \ large parts of the previous example code. The client needs an element that allows\
    \ the user to enter chat messages and an area that displays all incoming chat\
    \ messages. First, you should style and position these on the page with some CSS\
    \ in the <head> section of the page:\n\n```\n<style type=\"text/css\">\n  #input\
    \ {\n    width: 200px;\n  }\n  #messages {\n    position: fixed;\n    top: 40px;\n\
    \    bottom: 8px;\n    left: 8px;\n    right: 8px;\n    border: 1px solid #EEEEEE;\n\
    \    padding: 8px;\n  }\n</style>\n```"
  merge: -1
