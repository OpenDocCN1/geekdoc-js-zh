  md: "# Detecting Disconnections\n\nThe only way users can now leave the chat is\
    \ by closing the browser window. That will trigger a `disconnect` event on the\
    \ server-side socket. It would be interesting for other connected users to be\
    \ informed that a certain user has left the chat.\n\n```\n```javascript\nsocket.on('disconnect',\
    \ function() {\n  socket.get('username', function(err, username) {\n    if (!\
    \ username) {\n      username = socket.id;\n    }\n    socket.broadcast.emit('serverMessage',\
    \ 'User ' + username + ' disconnected');\n  });\n});\n```\n```\n\nNow, when a\
    \ given socket is disconnected, the server broadcasts that information to all\
    \ other connected clients. Listing 22-8 contains the full server code.\n\n# LISTING\
    \ 22-8: A Socket.IO chat server that detects disconnections.\n\n```\n```javascript\n\
    var httpd = require('http').createServer(handler);\nvar io = require('socket.io').listen(httpd);\n\
    var fs = require('fs');\n\nhttpd.listen(4000);\n\nfunction handler(req, res) {\n\
    \  fs.readFile(__dirname + '/index.html',\n    function(err, data) {\n      if\
    \ (err) {\n        res.writeHead(500);\n        return res.end('Error loading\
    \ index.html');\n      }\n\n      res.writeHead(200);\n      res.end(data);\n\
    \    }\n  );\n}\n\nio.sockets.on('connection', function (socket) {\n  socket.on('clientMessage',\
    \ function(content) {\n    socket.emit('serverMessage', 'You said: ' + content);\n\
    \n    socket.get('username', function(err, username) {\n      if (! username)\
    \ {\n        username = socket.id;\n      }\n      socket.broadcast.emit('serverMessage',\
    \ username + ' said:' + content);\n    });\n  });\n});\n```\n```"
