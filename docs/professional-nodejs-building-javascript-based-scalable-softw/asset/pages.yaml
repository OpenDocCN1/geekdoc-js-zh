  md: "# Reconnecting the Connection Dies\n\nA TCP connection may be closed by the\
    \ remote server or in the event of a network problem or even if your connection\
    \ is idling for too long. In any case, if your application requires, it's easy\
    \ to reconnect to the server, as seen in Listing 12-1.\n\nLISTING 12-1: A TCP\
    \ client that reconnects immediately.\n\n```\nvar net = require('net');\nvar port\
    \ = 4000;\nvar conn;\n\nprocess.stdin.resume();\n\nfunction connect() {\n  conn\
    \ = net.connect(port);\n\n  conn.on('connect', function() {\n    console.log('connected\
    \ to server');\n  });\n\n  conn.on('error', function (err) {\n    console.log('Error\
    \ in connection:', err);\n  });\n\n  conn.on('close', function () {\n    console.log('connection\
    \ closed, will try to reconnect');\n    connect();\n  });\n\n  conn.pipe(process.stdout,\
    \ {end: false});\n  process.stdin.pipe(conn);\n}\nconnect();\n```\n\nHere you\
    \ are connecting by immediately invoking the local function connect.\n\nWhen an\
    \ error occurs on the connection, you will get an error event, then the connection\
    \ will close, which will trigger a close event. When the close event happens,\
    \ this code tries to reconnect immediately (which you will see later this might\
    \ be a bad idea) by invoking the local function connect, which goes through all\
    \ the connecting logic again.\n\nYou can test this process. While connected, terminate\
    \ the server and start it again. You should then see the client reconnecting successfully.\n\
    \nHowever, it is not recommended to reconnect immediately after you get disconnected\
    \ or that you keep retrying so can create a kind of loop, flooding your network\
    \ with connection requests. The server will be unreachable for a few milliseconds\
    \ after the disconnection. Instead, wait a bit for the network conditions to improve\
    \ or for the service to come back online. You should also try reconnecting after\
    \ a number of failed attempts has occurred — at this point, the problem is probably\
    \ not going to be solved by reconnecting: it be a permanent network or server\
    \ problem. The user should be informed and your program should stop trying to\
    \ reconnect automatically, at least for a considerable amount of time."
  merge: -1
