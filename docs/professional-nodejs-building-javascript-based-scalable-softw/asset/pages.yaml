  md: "Here you populate, by default, the meta.created_at and meta.updated_at fields\
    \ with the current timestamp (which is cast into a proper date value before it's\
    \ saved).\n\nBut this approach has one problem: If the user submits a form that\
    \ changes the meta.created_at record, this value gets saved into the document,\
    \ overriding the original value that you intended to be immutable. To prevent\
    \ mutation of the value, you need to remove the meta.created_at and meta.updated_at\
    \ values and insert the default values, before the document is saved. To do so,\
    \ add this snippet before the module exports at the end of the file data/schemas/user.js:\n\
    \n```\nUserSchema.pre('save', function(next) {\nif (this.isNew) {\n  this.meta.created_at\
    \ = undefined;\n}\nthis.meta.updated_at = undefined;\nnext();\n});\n```\n\nThe\
    \ user schema emits events before and after the object is saved or removed. In\
    \ this case you are attaching a listener that is called when the object is saved.\
    \ In this function, this keyword is bound to the document.\n\nYou can also determine\
    \ whether a document will be saved for the first time by observing the New property.\
    \ In this case, you only want to remove the meta.created_at value when the object\
    \ is created.\n\n> NOTE This code still doesn't work if the user somehow manages\
    \ to override the meta.created_at value when the object is updated. To prevent\
    \ this, you can create an attribute setter that doesn't allow any change in the\
    \ value:\n\nmeta:\n  created_at: {\n  type: Date,\n  'default': Date.now,\n  set:\
    \ function(val) {\n    return undefined;\n  }\n},\n  updated_at: {\n  type: Date,\n\
    \  'default': Date.now\n}"
