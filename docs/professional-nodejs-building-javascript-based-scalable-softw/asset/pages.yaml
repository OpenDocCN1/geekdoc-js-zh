  md: "```\napp.use(function(req, res) {\n    res.end('Hello World!');\n});\n\napp.use(connect.errorHandler());\n\
    \napp.listen(8080);\n```\n\nHere you are provoking an error and setting up the\
    \ error handler middleware at the end of the middleware stack. If you save this\
    \ listing as a file named `errorHandler.js`, you can run it like this:\n\n```\n\
    $ node errorHandler\n```\n\nIf you refresh your browser, you will see a formatted\
    \ HTML page containing the title `Connect`, the error message, and the error trace.\
    \ You can change the title by setting the `errorHandler` title property and introducing\
    \ a line of code like this:\n\n```\nconnect.errorHandler.title = 'My Application';\n\
    ```\n\n# Serving Static Files\n\nAn HTTP application usually needs to serve some\
    \ static assets like CSS, JavaScript, images, and HTML files. Connect already\
    \ has a middleware component that provides this function (see Listing 20-17).\n\
    \n**LISTING 20-17:** Using the Connect static server middleware.\n\n```\nvar connect\
    \ = require('connect');\n\nvar app = connect();\n\n// setup the static file server\n\
    app.use(connect.static(__dirname + '/public'));\n\n// actually respond\napp.use(function(req,\
    \ res) {\n    res.end('Hello World!');\n});\n\napp.listen(8080);\n```\n\nHere\
    \ you are saying that the static file server should look for files under the `public`\
    \ directory. If a file is found, that file is served, and the middleware chain\
    \ is interrupted.\n\nNow you can create a directory named `public` inside the\
    \ current folder and put a static file there that you can rename `pic.jpg`. Just\
    \ pick any JPEG picture you have. Then, save this previous listing into a file\
    \ named `static.js` on the parent folder and run it like this:\n\n```\n$ node\
    \ static\n```\n\nThen point your browser to the URL `http://localhost:8080/pic.jpg`.\
    \ You should see the picture rendered in your browser."
