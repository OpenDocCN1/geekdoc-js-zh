    # How Closures Help When Programming Asynchronously


    In event-driven programming you start by defining the code that will be executed
    when an event occurs, then you pass that code inside a function, and finally pass
    that function as an argument to be called later.


    In JavaScript, a function operates not by working in isolation but by remembering
    the context where it was declared, which enables manipulation of any variable
    present in that or any parent context.


    When you pass a callback function as an argument, that function will be invoked
    some time later, but it can manipulate any variable present that or in the parent
    scope, even if those scopes have already returned. In the last example, the callback
    function was able to access and manipulate the clickCount variable, even though
    it was invoked from within the click() function.


    This shows that by using the closure pattern, you can have the best of both worlds:
    You can do event-driven programming without having to maintain the state by passing
    around to functions. A JavaScript closure keeps the state for you.


    # SUMMARY


    Event-driven programming is a programming style whereby the flow is determined
    by the occurrence of events. Programmers register callbacks to be used as event
    handlers for events they are interested in, and the system invokes these handlers
    when those events occur. This model of programming has some advantages over the
    traditional blocking paradigm where, to scale, you have to use multiple processes
    or threads.


    JavaScript is a powerful language, which is well suited for this style of programming,
    mainly because it has first-class functions and closures.'
