  md: '# 17


    # # Testing Modules and Applications


    WHAT''S IN THIS CHAPTER?


    +   - Running tests using node-tap

    - Using the Node assert module

    - Testing a sample module


    To minimize the number of errors that users encounter while using your software,
    you must test the code you produce. You can do some of this testing manually,
    but optimally, you need a program that automates this process.


    Automated testing is one of the most important practices that improve code quality.
    The goal is to have a series of tests that cover your entire code base, including
    the main and edge cases of your software. Some disciplines like TDD (test-driven
    development) even advocate that you write your tests, make them fail, and then
    implement the code that makes them work.


    Whatever your approach, writing automated tests is a good investment. This chapter
    shows you how to do that in your Node modules and programs.


    # USING A TEST RUNNER


    To create an automated test, you first need a way to define your tests. Then you
    need a tool that compiles and runs these tests, outputting the results.


    Many such tools for Node.js and JavaScript exist. This chapter features one called
    node-tap. I picked it for several reasons: It''s simple, it easily supports asynchronous
    testing, and the output format is based on a standard.'
  merge: -1
  pgno: 190
- img_proc: true
  md: "You can install node-tap by including it inside the dev-dependencies section\
    \ of your package .json file:\n\n```\n{\n  \"name\": \"MyApp\",\n  \"version\"\
    : \"0.1.0\",\n  \"devDependencies\": {\n    \"tap\": \"*\"\n  }\n}\n```\n\nYou\
    \ then issue this command:\n\n```\n$ npm install\n```\n\nWhen NPM downloads and\
    \ installs node-tap and its dependencies, you can start using it.\n\n> NOTE If\
    \ you declare a dependency in the devDependencies property of your package.json\
    \ file, you are telling your program that it does not need that dependency once\
    \ it's running in production.\nThis is a good place to store all dependencies\
    \ that will be used solely for developing and testing your application.\nWhen\
    \ you install your application in a production environment, you can use the -production\
    \ option to skip the installation of the modules listed in the devDependencies\
    \ section:\n\n$ npm install --production\n\n# Writing Tests\n\nTo create tests,\
    \ you need to first set up a directory where you place your test scripts. As a\
    \ general rule, this directory is called tests and contains one file per module\
    \ you want to test.\nYou create your first test script inside this directory.\
    \ To do so, require the tap module and obtain the test constructor as follows:\n\
    \n```\nvar test = require('tap').test;\n```\n\nThen you can define your first\
    \ test. For that you you need to provide a test name and a function that contains\
    \ the test code:\n\n```\ntest(\"addition of 2 and 2 works\", function(t) {\n \
    \ t.equal(2+2, 4, \"2+2 should be 4\");\n  t.end();\n});\n```"
