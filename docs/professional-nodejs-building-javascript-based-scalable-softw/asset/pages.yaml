    \ it, though, head to http://couchdb.apache.org/ and learn more about it.\n\n\
    CouchDB also uses HTTP for client-server communication. In fact, when using CouchDB\
    \ from Node, you need more than the Node HTTP Client API even though, in the end,\
    \ you will probably want to create some sort of library code to reduce code duplication.\n\
    \nNano is just that — it's a third-party module that builds on top of Mikael Rogers's\
