  md: 'You can also create a file writable stream:


    ```

    var fs = require(''fs'');

    var rs = fs.createWriteStream(''/path/to/file'', options);

    ```


    fs.createWriteStream() also accepts a second argument with an options object that
    has the deault values:


    +   - flags: ''w'',

    - encoding: null,

    - mode: 0666


    +   The flags option contains the flags to be used when opening the file, so all
    the flags accepted by fs.open() are valid here.


    +   The mode option specifies the permission mode the file will be opened with
    if the file has to be created.


    You can also use the encoding option to force a specific encoding. For instance,
    you can use the following to create a writable stream that assumes UTF-8 encoding:


    ```

    var fs = require(''fs'');

    var rs = fs.createWriteStream(''/path/to/file'', { encoding: ''utf8'' });

    ```


    # ## Networking Streams


    Several kinds of streams are on the networking API of Node. For instance, a client
    TCP connection is both a writable stream and a readable stream, and is also a
    server connection.


    An HTTP request object is a readable stream. An HTTP response object is a writable
    stream.


    Each of these stream types is covered in later chapters. For now, bear in mind
    that these stream types have a common interface, which means that you can use
    some of these objects interchangeably and that you can abstract some problems
    and solve them only once. The slow client problem (covered in the next section)
    is one of these problems.


    # ## AVOIDING THE SLOW CLIENT PROBLEM AND SAVING YOUR SERVER


    Every time you have a process that reads some data and then has to send that data
    (or some transformation of it) to another consumer, you have what''s usually called
    the slow client problem.


    # ## Understanding the Slow Client Problem


    Node does not block while doing I/O. This means that Node does not block on reads
    or writes — it buffers the data for you the write cannot be flushed into the kernel
    buffers. Imagine this scenario: You are pumping data into a writable stream (like
    a TCP connection to a browser), and your source of data is a readable stream (like
    a file readable stream):'
  merge: -1
  pgno: 113
- img_proc: true
  md: "```\nrequire('http').createServer(function(req, res) {\n  var rs = fs.createReadStream('/path/to/big/file');\n\
    \n  rs.on('data', function(data) {\n    res.write(data);\n  });\n\n  rs.on('end',\
    \ function() {\n    res.end();\n  });\n}).listen(8080);\n```\n\nIf the file is\
    \ local, the readable stream will be fast. However, if the network connection\
    \ to the client is slow, the writable stream will be slow. The readable stream\
    \ \"data\" events will happen quickly, and the data will be sent to the writable\
    \ stream. However, Node will eventually have to start buffering the data because\
    \ the kernel buffers will fill up.\n\nWhat happens in practice is that the file\
    \ will be buffered in memory for each write command. Multiply this for every request\
    \ you have, and soon you will have memory growth problems. Generally, every time\
    \ you have a data producer and a data consumer and the producer is faster than\
    \ the consumer, you have to buffer data. That is, unless you pause the producer\
    \ until the consumer catches up.\n\n# Avoiding the Slow Client Problem\n\nIn most\
    \ cases you can avoid filling up the memory with unflushed buffers by pausing\
    \ the producer — the readable stream — so that the consumer's data — the writable\
    \ stream — does not get into the kernel. Frankly Node readable streams have exactly\
    \ the required functionality: You can pause and resume them. Here is an example\
    \ of how you can control the flow:\n\n```\nrequire('http').createServer(function(req,\
    \ res) {\n  var rs = fs.createReadStream('/path/to/big/file');\n\n  rs.on('data',\
    \ function(data) {\n    if (!res.write(data)) {\n      rs.pause();\n    }\n  });\n\
    \n  rs.on('drain', function() {\n    rs.resume();\n  });\n\n  rs.on('end', function()\
    \ {\n    res.end();\n  });\n}).listen(8080);\n```\n\nHere we are creating an HTTP\
    \ server listening on port 8080 that serves the content of the file /path/to/big/file\
    \ to all HTTP requests."
