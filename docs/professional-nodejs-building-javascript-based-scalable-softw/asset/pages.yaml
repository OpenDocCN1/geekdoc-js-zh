  md: "```\nrinfo.port,\n    rinfo.address);\n});\n```\n\nHere you are using the server's\
    \ send function, which sends a message to a specific address and port. The first\
    \ three arguments specify the message — first the buffer, then the initial offset\
    \ of the message inside the buffer (0 in this case because the message starts\
    \ at the beginning of the buffer), and then the message length in bytes (which\
    \ is the actual length of the buffer you have).\nThe remaining two arguments specify\
    \ the destination of that message, namely, the port and address. Here you are\
    \ retrieving the remote sender information contained on the rinfo argument — which\
    \ contains the remote server address info — and using that information to address\
    \ the receiver.\n\n# Putting the Echo Server Together\n\nThis is what the UDP\
    \ echo server now looks like:\n\n```\nvar dgram = require('dgram');\nvar server\
    \ = dgram.createSocket('udp4');\nvar port = 4000;\n\nserver.on('message', function(message,\
    \ rinfo) {\n    server.send(message, 0, message.length, rinfo.port, rinfo.address);\n\
    });\n\nserver.bind(port);\n```\n\nYou can test it by using the nc utility in the\
    \ shell command line:\n\n```\n$ nc -u 0.0.0.0 4000\n```\n\nYou can then start\
    \ typing strings and pressing Enter. You should see the strings printed back.\n\
    \n> **NOTE** Be careful not to change the buffer you pass on client.send before\
    \ the message has been copied into the kernel. If you need to know when your message\
    \ has been flushed to the kernel and when it's safe to reuse the buffer, you have\
    \ to pass a last argument to client.send with a callback function like this:\n\
    \n```\nvar message = new Buffer('blah blah');\nclient.send(message,\n        \
    \    0,\n            message.length,\n            '4000',\n            'localhost',\n\
    \            function() { // you can reuse the message buffer\n            });\n\
    ```"
