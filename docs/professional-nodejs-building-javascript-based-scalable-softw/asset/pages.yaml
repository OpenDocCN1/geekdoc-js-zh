  md: "# Creating File-System Streams\n\nYou can create a readable stream for a file\
    \ path by doing something like this:\n\n```\nvar fs = require('fs');\nvar rs =\
    \ fs.createReadableStream('/path/to/file');\n...\n```\n\nYou can pass a second\
    \ argument with options to fs.createReadableStream(), where you can specify the\
    \ start and end position on your file, the flags, the encoding, and the buffer\
    \ size. Here are the options arguments:\n\n+   - The encoding of the strings emitted\
    \ in \"data\" events, or null if you want raw buffers.\n- fd — If you already\
    \ have an open descriptor, you can pass it in here and the stream will assume\
    \ it. Defaults to null.\n- bufferSize — The size in bytes of each chunk of the\
    \ file to be read. Defaults to 64KB.\n- start — The file position of the first\
    \ byte to be read. Used to read a range of the file instead of the whole file.\n\
    - end — The file position of the last byte to be read. Used to read a range of\
    \ the file instead of the whole file.\n\n> NOTE If you already have an open file,\
    \ you can create a readable stream from it using the fd option:\n```\nvar fs =\
    \ require('fs');\nvar path = '/path/to/my/file';\nfs.open(path, 'r', function(err,\
    \ fd) {\n  fs.createReadableStream(null, {fd: fd, encoding: 'utf8'});\n  fs.on('data',\
    \ console.log);\n});\n```\n\nAlso, if you want to read a segment of a file, you\
    \ can use the start and end options. For instance, for the stream to start at\
    \ byte 20 and continue until the file ends:\n\n```\nvar fs = require('fs');\n\
    var path = '/path/to/my/file';\nvar readStream = fs.createReadableStream(path,\
    \ {start: 10});\n...\n```\n\nOr if you want the file to stop reading at byte 20:\n\
    \n```\nvar fs = require('fs');\nvar path = '/path/to/my/file';\nvar readStream\
    \ = fs.createReadableStream(path, {end: 20});\n...\n```"
