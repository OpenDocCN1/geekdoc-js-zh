  md: "# # UNDERSTANDING THE HTTP.SERVERREQUEST OBJECT\n\nWhen listening for request\
    \ events, the callback gets back HttpServer object as the first argument. This\
    \ object contains some properties you can inspect, including the url, method,\
    \ and headers properties:\n\n+   - req-url: This property contains the requested\
    \ URL as a string. It does not contain the schema, hostname, or port, but it contains\
    \ everything after that. Try running the following server to analyze the request\
    \ property:\n\n```\n```javascript\nrequire('http').createServer(function(req,\
    \ res) {\n  res.writeHeader(200, {'Content-Type': 'text/plain'});\n  res.end(req.url);\n\
    }).listen(4000);\n```\n```\n\nOpen http://127.0.0.1:4000 using a browser. Change\
    \ the path in the URL to see how it behaves.\n\n+   - req-method: This contains\
    \ the HTTP method used in the request. It can be, for example, GET, POST, DELETE,\
    \ or HEAD.\n- req-headers: This contains an object with a property for every HTTP\
    \ header in the request. To analyze it, you can run this server:\n\n```\n```javascript\n\
    var util = require('util');\nrequire('http').createServer(function(req, res) {\n\
    \  res.writeHeader(200, {'Content-Type': 'text/plain'});\n  res.end(util.inspect(req.headers));\n\
    }).listen(4000);\n```\n```\n\nConnect your browser to http://127.0.0.1:4000 to\
    \ inspect the headers of your request. Your server should output something like\
    \ this:\n\n```\n```{\n  'host': 'localhost:4000',\n  'connection': 'keep-alive',\n\
    \  'user-agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_7_2) AppleWebKit(like\
    \ Gecko) Chrome/135.0.6874.121 Safari/535.36',\n  'accept': 'text/html,application/xml,application/xml;q=0.9,*;q=0.8',\n\
    \  'accept-encoding': 'gzip, deflate, br',\n  'accept-language': 'en-US,q=0.8',\n\
    \  'accept-charset': 'ISO-8859-1,utf-8;q=0.7,*q=0.3'\n}\n```\n```\n\nHere you\
    \ are using util.inspect(), a utility function that analyzes the properties of\
    \ your object.\n\nThe header object property keys are lowercase. For instance,\
    \ a Cache-Control: max-age=0 header will have a property named \"cache-control\"\
    \ with the value \"max-age=0\". Values are untouched."
