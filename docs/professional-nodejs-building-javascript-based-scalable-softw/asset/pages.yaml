  md: "# READING FROM A FILE\n\nOnce a file is open, you can read a part of it, before\
    \ you do so, you have to create a buffer that will contain the data. That buffer\
    \ will be passed to the fs.read function to be filled with the file data.\n\n\
    ```\nvar fs = require('fs');\nfs.open('./my.file.txt', 'r', function opened(err,\
    \ fd) {\n  if (err) { throw err }\n  varBuffer = new Buffer(1024);\n  bufferOffset\
    \ = 0;\n  bufferLength = readBuffer.length;\n  filePosition = 100;\n fs.read(fd,\n\
    \  readBuffer,\n  bufferOffset,\n  bufferLength,\n  filePosition,\n  function\
    \ read(err, readBytes) {\n    if (err) { throw err; }\n    console.log('just read\
    \ ' + readBytes + ' bytes');\n    if (readBytes > 0) {\n      console.log(readBuffer.slice(0,\
    \ readBytes));\n    }\n  }\n});\n```\n\nHere are you opening the file, and when\
    \ it's opened (calling the opened function), you are asking to read a chunk of\
    \ 1,024 bytes from it, starting at position 100 of the buffer you provided (line\
    \ 11).\n\nThe last argument to the fs.read() call is a callback function (line\
    \ 16), which is invoked when one of the following things happens:\n\n+   - There\
    \ is an error.\n- Something has been read.\n- Nothing could be read.\n\nWith the\
    \ first argument, the callback gets an error object if something went wrong; otherwise,\
    \ the argument is null. If the read succeeds, the second argument (readBytes)\
    \ gets the number of bytes read into the buffer. If the read count is zero, the\
    \ file has reached the end.\n\n> NOTE Once you pass the buffer to fs.open(), that\
    \ buffer becomes under the control of the read command. The control of the buffer\
    \ will return to you once your callback is invoked. Don't read, write, or use\
    \ that buffer in another call before that; otherwise, you may read incomplete\
    \ data, or worse, you may write concurrently into the same buffer."
