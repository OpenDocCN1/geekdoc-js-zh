  md: "Again, you can start this server, connect to it using telnet or nc, as you\
    \ did before, and play around it. You can type quit<enter> to terminate the connection.\n\
    \nBecause the socket object is a readable stream, you can control the flow by\
    \ calling socket.pause() and socket.resume(), or even pipe it into a writable\
    \ stream, as shown in Listing 10-3.\n\n# LISTING 10-3: Piping out a socket.\n\n\
    ```\nvar ws = require('fs').createWriteStream('mysocketdump.txt');\n\nrequire('net').createServer(function\
    \ (socket) {\n  socket.pipe(ws);\n}).listen(4001);\n```\n\nAs before, you can\
    \ test Listing 10-3 using telnet or nc like this:\n\n```\n$ nc localhost 4001\n\
    ```\n\nYou can type as much as you want, press <enter> at least once to flush\
    \ to the server. You can then open the mysocketdump.txt file and find the text\
    \ you typed there.\n\nYou can also accomplish the reverse, whereby you pipe a\
    \ readable stream into the socket, as shown in Listing 10-4. For that to work\
    \ you have create a file on the local folder named hello.txt, fill with some random\
    \ text, and then run the Listing 10-4 example.\n\n# LISTING 10-4: Piping into\
    \ a socket.\n\n```\nrequire('net').createServer(function (socket) {\n  var rs\
    \ = require('fs').createReadStream('hello.txt');\n  rs.pipe(socket);\n}).listen(4001);\n\
    ```\n\nIf you try to connect to the server, you should see the text you inserted\
    \ in the hello.txt file. The connection will also be immediately closed. That's,\
    \ as explained in Chapter 9, \"Reading and Writing Streams of Data,\" pipe will\
    \ by default all the end when the source ends. If you want to keep the connection\
    \ open, you should pass { end : false } into the second argument of the pipe()\
    \ command.\n\n# Understanding Idle Socks\n\nBy default, a new connection is set\
    \ up between two peers, it is kept open until one of them closes or the underlying\
    \ link is lost. In Node, you can set TCP connections to timeout out of inactivity.\
    \ You can automatically close the connection when no traffic is sent or received\
    \ for some time. You can activate and deactivate the timeout by calling setTimeout(milliseconds)\
    \ on the connection. You can also listen for the timeout event on the socket object."
