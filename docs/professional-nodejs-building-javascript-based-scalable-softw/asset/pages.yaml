  md: "# USING A LIBRARY TO CONNECT AND COMMUNICATE WITH A MYSQL DATABASE\n\nAs installing\
    \ and setting up a MySQL database is not within the scope of this book, it's assumed\
    \ that you have a working MySQL instance running on your localhost or on another\
    \ reachable host.\n\nTo connect to your database, you must install the node-mysql\
    \ package in your local directory with the following command:\n\n```\nnpm install\
    \ mysql\n```\n\nOnce you have done this, write a simple application that connects\
    \ to your server, as shown in Listing 23-1.\n\n# LISTING 23-1: Connecting and\
    \ querying MySQL.\n\n```\nvar mysql = require('mysql');\n\nvar client = mysql.createServer({\n\
    \  host: 'localhost',\n  user: 'root',\n  password: 'root'\n});\n\nclient.query(\n\
    \  'SELECT \"Hello, world!',\n  function (err, results, fields) {\n    console.log(results);\n\
    \    console.log(fields);\n    client.end();\n  }\n);\n```\n\nBy saving and running\
    \ this listing, you can change lines 4, 5, and 6 to specify the host and credentials\
    \ for accessing your MySQL server. If your installation is local, you may not\
    \ need any credentials to connect to your MySQL server, in which case you can\
    \ remove the user and password fields from the create options.\n\nYou can then\
    \ save this code into a file named hello_world.js and run it:\n\n```\nnode hello_world\n\
    [{ 'Hello, world!': 'Hello, world!' }]\n{ 'Hello, world!':\n  length: 35,\n  received:\
    \ 35,\n  number: 2,\n  types: 4,\n  catalog: 'def',\n  name: 'Hello, world!',\n\
    \  charsetNumber: 192,\n```"
  merge: -1
