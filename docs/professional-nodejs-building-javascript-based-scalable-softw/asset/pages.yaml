- img_proc: true
  md: "This will schedule the connection to end after all the data has been written\
    \ out. You're ending the connection, you can also send data (a buffer or a string):\n\
    \n```\nconn.end('Bye bye!', 'utf8');\n```\n\nThis is equivalent to:\n\n```\nconn.write('Bye\
    \ bye!', 'utf8');\nconn.end();\n```\n\n> WARNING When you're ending the connection\
    \ you're queuing operation, which means that the connection does not end immediately.\
    \ Also, when the connection gets \"ended,\" a FIN packet is sent, which means\
    \ that the server will still send some data through.\n\nFor these two reasons,\
    \ you can still receive \"data\" events after you have ended the connection.\n\
    \n# # HANDLING ERRORS\n\nErrors can happen when you are trying to establish a\
    \ connection — the hostname is not found on DNS, the target host is not reachable,\
    \ or the connection is rejected — or a network error happens when you have already\
    \ established a connection. You can trap errors by listening to the error event\
    \ like this:\n\n```\nconn.on('error', function(err) {\n  console.error('this error\
    \ happened:' + err.message +\n  ', code: ' + err.code);\n});\n```\n\nBesides the\
    \ message property, networking-related errors also have the code property, which\
    \ you can stringify that to inspect and test data. For instance, if the requested\
    \ connection is refused, you will get an ECONREFUSED.\n\n```\nvar net = require('net');\n\
    var conn = net.createConnection('82837');\nconn.on('error', function(err) {\n\
    \  console.log('I got this error code: ' + err.code);\n});\n```\n\nThis last piece\
    \ of code should output the following:\n\n```\nI got this error code: ECONREFUSED\n\
    ```\n\n# # BUILDING AN EXAMPLE COMMAND-LINE TCP CLIENT\n\nNext you will build\
