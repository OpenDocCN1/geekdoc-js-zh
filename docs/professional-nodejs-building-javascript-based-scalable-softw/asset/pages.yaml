  md: "# LISTING 8-9: Getting the child process exit code. (chapter8/10_child_exit_code.js)\n\
    \n```\nvar spawn = require('child_process').spawn;\n\n// Spawn the child with\
    \ a \"ls_does_not_exist.txt\" command\nvar child = spawn('ls', ['does_not_exist.txt']);\n\
    \n// When the child process exits:\nchild.on('exit', function(code) {\n  console.log('child\
