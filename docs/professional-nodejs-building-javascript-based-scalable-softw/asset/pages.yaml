  md: "This listing declares a function named worker that receives a task and processes\
    \ it. In this case, the task is a number and the worker is calling the squaring\
    \ server to obtain the square value of this number.\n\nThe code then creates a\
    \ queue based on the worker function and defines a maximum concurrency. The maximum\
    \ concurrency is set to 5 in this example, but it's an arbitrary value and you\
    \ should define it for your own cases.\n\nThen the example pushes 10 jobs as numbers\
    \ 1 through 10 into the queue using queue.push. This function accepts a callback\
    \ to receive the result of this job one is done.\n\nYou can run this script by\
    \ saving it into a file named queue.js and running it:\n\n```\n$ node queue.js\n\
    5^2 = 25\n1^2 = 1\n2^2 = 4\n3^2 = 9\n4^2 = 16\n6^2 = 36\n10^2 = 100\n8^2 = 64\n\
    9^2 = 81\n7^2 = 49\n```\n\n> NOTE You can see here that the results are not in\
    \ the order you placed them. That's the nature of asynchronicity: The results\
    \ are shown in the order in which they finish. If you want to order the results,\
    \ you should use async.forEach or a similar function — which is covered later\
    \ in this chapter.\n\nOne of the nice things about using a queue is that it limits\
    \ the number of concurrent requests. You can use it to limit concurrent access\
    \ to resources like a database, preventing flooding, and so on. But how can you\
    \ determine and adapt the optimal maximum concurrency? Determining depends on\
    \ your application. The maximum concurrency can be, for instance, a function of\
    \ the observed latency, or it can be provided by an external setting. Any way\
    \ you do it, it's good to know that you can change the maximum concurrency after\
    \ the queue is created by changing the concurrency property on the queue:\n\n\
    ```\nqueue.concurrency = 10;\n```\n\nA queue also emits some events regarding\
    \ its state. You know when a queue has reached the maximum concurrency limit —\
    \ and further tasks have to wait to start — plugging a function into the queue's\
    \ saturated property, like this:\n\n```\nqueue.saturated = function() {\n  console.log('queue\
    \ is saturated');\n};\n```\n\nLikewise, you can know when the last item in the\
    \ queue is given to a worker by listening to the empty event like this:"
