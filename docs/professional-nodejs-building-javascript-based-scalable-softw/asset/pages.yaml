  md: "# SENDING AND RECEIVING DATA\n\nThe return value of the call to net.createConnection()\
    \ is an instance of net.Socket, which represents the connection to the server\
    \ and is both readable and a writeable stream. It allows you to send some data:\n\
    \n```\nconn.write('here is a string for you!');\n```\n\nYou can also pass a string\
    \ and specify the string encoding:\n\n```\nconn.write('SGVsbG8gV29ybGQh', 'base64');\n\
    ```\n\nYou can also write a buffer to the server:\n\n```\nvar buffer = new Buffer('Hello\
    \ World!');\nconn.write(buffer);\n```\n\nIn any of these variants you can pass\
    \ in a callback function:\n\n```\nconn.write('Hey!', function() {\n  console.log('data\
    \ was written out');\n});\n```\n\nNote that the callback is not invoked when the\
    \ server receives the data, only when the data is written to the network.\n\n\
    You can receive data from the server by listening to the data event emitted by\
    \ the connection every time data is available:\n\n```\nconn.on('data', function(data)\
    \ {\n  console.log('some data has arrived:', data);\n});\n```\n\nIf you don't\
    \ specify the encoding, the data that is passed in will be a buffer. If you want\
    \ that buffer to be encoded before being emitted, you must specify it by using\
    \ setEncoding:\n\n```\nconn.setEncoding('base64');\n```\n\nAs covered in Chapter\
    \ 4, \"Using Buffers to Manipulate, Encode, Decode Binary Data,\" you can use\
    \ ascii, utf8, or base64 as your encoding identifiers.\n\n# ENDING THE CONNECTION\n\
    \nYou can close the connection from your endpoint by using the connection end\
    \ method:\n\n```\nconn.end();\n```"
