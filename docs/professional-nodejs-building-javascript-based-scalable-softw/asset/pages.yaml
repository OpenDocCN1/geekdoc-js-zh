  md: "# Executing External Commands | 67\n\n| NAME | DEFAULT ACTION | DESCRIPTION\
    \ |\n| --- | --- | --- |\n| SIGXCPU | Terminate process | CPU time limit exceeded\
    \ |\n| SIGXFSZ | Terminate process | File size limit exceeded |\n| SIGVTALM |\
    \ Terminate process | Virtual time alarm |\n| SIGPROF | Terminate process | Profiling\
    \ timer alarm |\n| SIGWINCH | Discard signal | Window size change |\n| SIGINFO\
    \ | Discard signal | Status request from keyboard |\n| SIGUSR1 | Terminate process\
    \ | User defined signal 1 |\n| SIGUSR2 | Terminate process | User defined signal\
    \ 2 |\n\nYou may want to provide the child process with a set of environment variables\
    \ that is an extension of the parent ones. If you change the process.env object\
    \ directly, you will change it for every module of your Node process, which is\
    \ undesirable. Instead, create a new object that is the augmented copy of process.env,\
    \ as seen in Listing 8-2.\n\n# LISTING 8-2: Executing a command with augmented\
    \ environment variables. (chapter8/02_env_vars_augment.js)\n\n```\nvar env = process.env,\n\
    \  varName,\n  envCopy = {},\n  exec = require('child_process').exec(\n// Copy\
    \ process.env into envCopy\nfor (varName in env) {\n  envCopy[varName] = env[varName];\n\
    }\n\n// Assign some custom variables\nenCopy['CUSTOM ENV VAR1'] = 'some value';\n\
    enCopy['CUSTOM ENV VAR2'] = 'some other value';\n\n// Execute some command with\
    \ process.env and my custom variables\nexec('ls -la', { env: envCopy }, function(err,\
    \ stdout, stderr) {\n  if (err) { throw err; }\n  console.log('stdout:', stdout);\n\
    \  console.log('stderr:', stderr);\n});\n```\n\nHere you are creating an object\
    \ stored on the variable named envCopy, which will initially contain a copy of\
    \ the contents of the process.env object. You will then add or replace the environment\
    \ variables you want to change. Finally you execute the command, passing the envCopy\
    \ object as the environment object specification to the exec func."
