    ```\n\n# SUMMARY\n\nTCP is a connection-oriented protocol that handles message\
    \ ordering and flow-control for you. TCP can be a good transport layer on top\
    \ of which you can build client-server protocols.\n\nBuilding a TCP client in\
    \ Node is easy. When you try to establish a connection to a TCP server, net.createConnection()\
    \ returns a net.Socket instance, which is both a readable and a writable stream\
    \ that you can pipe data from and to. You can then send and receive data from\
    \ that connection, either as raw buffers or as encoded strings.\n\nYou should\
    \ listen to error events coming from a connection, and you can also detect when\
    \ a connection is closed. You can use the close event to try to reestablish a\
    \ connection, but you must be careful when trying to do this. Wait some time between\
