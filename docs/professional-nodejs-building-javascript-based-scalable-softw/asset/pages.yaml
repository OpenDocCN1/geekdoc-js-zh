    \ This can be done in the route listener in routes/users.js:\n\n```\napp.get('/users',\
    \ function(req, res, next) {\n  var page = req.query.page && parseInt(req.query.page,\
    \ 10) || 0;\n  User.count(function(err, count) {\n    if (err) {\n      return\
