    \  });\n  response.on(\"end\", function() {\n    console.log(\"response ended\"\
    );\n  });\n}\nreq.end();\n```\n\nHere, you are looking at some of the steps required\
    \ to make an HTTP request to a remote HTTP server using the Node http.request\
    \ API (which is covered later). Line 1 uses the continuing-style, passing in an\
    \ inline function that will be executed when the response is available. The HTTP\
    \ request API uses CPS when the the program continues to execute after the http.request\
    \ function completes.\n\nWhen complete, the http.request function invokes the\
    \ callback, passing a response object. This response object is an event emitter\
    \ and, according to the Node documentation, can emit, among others, the data and\
    \ end events. You are then registering callback functions that will be invoked\
    \ every time any of these events happen.\n\nAs a rule of thumb, use CPS when you\
    \ want to regain control after the requested operation completes and use the event\
    \ pattern when an event can handle multiple times.\n\n# UNDERSTANDING EVENT TYPES\n\
    \nNotice that emitted events always have a type, which is represented by a string.\
    \ In this example you have the \"data\" and \"end\" event types. These are arbitrary\
    \ strings dictated by the event emitter; by convention, event types are usually\
    \ lowercase with no spaces.\n\nYou cannot programmatically what types of events\
    \ a given emitter emits: The event emitter API provides no introspection mechanism.\
    \ The API you are using document which event types it is.\n\nThe event emitter\
    \ invokes the listener when a relevant event occurs, and it will pass in any relevant\
    \ data. In the http.request example, the \"data\" callback function receives the\
    \ data object as its first and sole argument, whereas the \"end\" event does not\
    \ receive any. These are also arbitrary arguments that are part of the specific\
    \ API contract. The callback argument signature should be documented in the API\
    \ specification of each event emitter.\n\nEvent emitter is a generic interface\
    \ that serves any type of event, but there is a special case in the Node implementation,\
    \ and that's the \"error\" event. Most event emitter implementations in Node will\
    \ emit an \"error\" event every time there is an error. If the programmer chooses\
