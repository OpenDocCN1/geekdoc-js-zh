  md: '# 312 | CHAPTER 25 CONNECTING TO MONGODB USING MONGOOSE


    In MongoDB, data is organized such that one MongoDB database holds a series of
    collections. Each collection has a series of documents, and each document contains
    a set of fields. A field is a key-value pair, where the key is a string and the
    value can be a basic type (like a string, integer, float, timestamp, binary, and
    so on), an embedded document, or a collection of these.


    A MongoDB query can be described using a JavaScript document literal. For instance,
    you may have a collection of users and want to find all users with the name "John"
    and the last name "Doe", you could apply the following query:


    ```

    {name: {first: ''John'', last: ''Doe''}}

    ```


    You could also find all users with "Doe" as the last name by using this query:


    ```

    {name.last'': ''Doe''}

    ```


    You can also use regular expressions instead of static values. For instance, to
    find all users whose last name starts with "D", you can use:


    ```

    {''name.last'': /^D/}

    ```


    This also works for array values. For instance, if you are searching in a collection
    of articles for those that have the keyword node.js, you can use the query:


    ```

    {keywords: ''node.js''}

    ```


    You could also match all the documents with at least one of a set of keywords
    by using the following:


    ```

    {keywords: {''$in'': [''node.js'', ''javascript'']}}

    ```


    There are several operators like this you can use inside queries, such as to find
    all documents where the field count has a value that is greater than 10 and less
    than or equal to 100:


    ```

    {count: {''$gt'': 10, ''$lte'': 100}}

    ```


    > NOTE This book does not aim to make you proficient in installing and querying
    MongoDB, which would be the subject of a whole other book.

    If you don''t have MongoDB installed in your system and you want to install it,
    use the information provided on the MongoDB home page at http://www.mongodb.org/.

    As an alternative, you can try using a MongoDB external service like the one provided
    by MongoHQ at https://mongohq.com/.'
