  md: 'This event loop is just one thread running inside one process, which means
    that, when an event hap-

    pens, the event handler can run without interruption. This means the following:


    +   - There is at most one event handler running at any given time.


    +   - Any event handler will run to completion without being interrupted.


    This allows the programmer to relax the synchronization requirements and not have
    to worry about

    concurrent threads of execution changing the shared memory state.


    # A WELL-KNOWN SECRET


    For some time, the systems-programming community has known that

    event-driven programming is the best way to create a service that can handle many

    concurrentconnections. It has been known to be more efficient regarding memory

    because there is less context to store, and more efficient regarding time because

    there is less context switching.


    This knowledge has infiltrated other platforms and communities; some of the

    well-known event loop implementations are Ruby''s Event Machine, Perl''s

    AnyEvent, and Python''s Twisted. There are also others for these and other

    languages.


    Implementing an application using one of these frameworks requires framework-

    sknowledge and framework-specific libraries. For example, when using Event

    Machine, you should avoid using synchronous libraries. To gain the benefit of

    blocking, you are limited to using asynchronous libraries built specifically for
    Event

    Machine. If you use any blocking library (most of the ones in the Ruby standard

    library), your server will not be able to scale optimally because the event loop
    will

    be constantly blocking, which prevents timely processing of I/O events.


    Node was devised as a non-blocking I/O server platform from day one, so generally

    you should expect everything built on top of it to be non-blocking. Because

    JavaScript itself is very minimal and does not any way of doing I/O (it does

    have have a standard I/O library), Node has a clean slate to build upon.


    # HOW NODE AND JAVASCRIPT MAKE WRITING ASYNCHRONOUS

    APPLICATIONS EASIER


    Ryan Dahl, the author of Node, began his project building a C platform, but maintaining
    the con-

    text between function calls was too complicated and led to complex code. He then
    turned to Lua,

    but Lua already had several blocking I/O libraries. This mix of blocking and non-blocking
    could

    confuse developers and prevent many of them from building scalable applications,
    thus Lua was

    ideal either.'
