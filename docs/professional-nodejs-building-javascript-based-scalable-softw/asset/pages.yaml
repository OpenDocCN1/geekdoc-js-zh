    \ that you can pipe it into a writable stream or simply register a callback function\
    \ for any data events.\n\n# Validating the HTTPS Server Certificate\n\nBesides\
    \ the secure communication channel, client-side validation of the server certificate\
    \ is the most common reason for using HTTPS on the web. Most web browsers want\
    \ to be sure that the server they are talking to is the same one that shows up\
    \ in the URL bar. You can perform this kind of validation using the built-in Node\
    \ HTTPS client.\n\nWhile performing a request, when you get a response event and\
    \ the response object, you can inspect that object. The response object has the\
    \ stream object embedded inside its socket attribute. Because this is a TLS stream,\
    \ you can invoke the getPeerCertificate function on it to obtain the server certificate\
    \ like this:\n\n```\nvar fs = require('fs');\nvar https = require('https');\n\n\
    var options = {\n  host: 'google.com',\n  method: 'GET',\n  path: '/'\n};\n\n\
    var req = https.request(options, function(res) {\n  console.log('res.socket.authorized:',\
    \ res.socket.authorized);\n  console.log('peer certificate:');\n  console.log(res.socket.getPeerCertificate());\n\
    });\n\nreq.end();\n```\n\nIf you run this small HTTPS client, you will get output\
    \ similar to this:\n\n```\nres.socket.authorized: true\npeer certificate:\n{ subject:\n\
