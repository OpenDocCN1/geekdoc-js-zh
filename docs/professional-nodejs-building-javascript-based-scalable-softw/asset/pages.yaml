  md: "# Receiving Data from the Server\n\nTo receive messages back from the server,\
    \ you need to subscribe to the message event:\n\n```\nclient.on('message', function(message)\
    \ {\n  console.log('Got message back:', message.toString());\n});\n```\n\n# Putting\
    \ the Command-Line UDP Client Together\n\nListing 14-2 shows what the complete\
    \ UDP command-line client looks like:\n\nLISTING 14-2: A command-line UDP client.\n\
    \n```\n#!/usr/bin/env node\nvar dgram = require('dgram');\n\nvar host = process.argv[2];\n\
    var port = parseInt(process.argv[3], 10);\nvar client = dgram.createSocket('udp4');\n\
    nprocess.stdin.on('resume());\n\nprocess.stdin.on('data', function(data) {\n \
    \ client.send(data, 0, data.length, host);\n});\n\nclient.on('message', function(message)\
    \ {\n  console.log('Got message back:', message.toString());\n});\n```\n\nYou\
    \ can fire it up using the shell command:\n\n```\n./udp_client.js 0.0.0.0 4000\n\
    ```\n\nYou should see the following:\n\n```\nStart typing to send messages to\
    \ 0.0.0.0:4000\n```\n\nIf you type some characters and then press Enter, you should\
    \ then see your message printed back as a response.\n\n# UNDERSTANDING AND USING\
    \ DATAGRAM MULTICAST\n\nOne of the interesting uses of UDP is to distribute messages\
    \ to several network nodes using only one network message. You can use this to\
    \ perform logging and clean the cache and in any case where you can afford to\
    \ lose some messages."
