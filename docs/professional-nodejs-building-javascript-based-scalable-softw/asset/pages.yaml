  md: "```\nif (err) {\n    return next(err);\n}\nres.redirect('/users');\n});\n});\n\
    ```\n\nHere you are checking if a username is taken and, if it's not, you create\
    \ the user using the create method on the user model. This code has at least one\
    \ problem — another request can create a user with the same username between the\
    \ time that you check whether a given username exists and the time that the database\
    \ actually creates the user. This would result in more than one user with the\
    \ same username inserted in the database, which cannot happen because you are\
    \ looking up users based on that value.\n\nYou can avoid this problem entirely\
    \ by adding an option to the user schema where you say that the username field\
    \ is unique, as shown in Listing 25-9.\n\n# LISTING 25-9: New version of the user\
    \ schema with a unique index in data/schemas/user.js.\n\n```\nvar mongoose = require('mongoose');\n\
    \nvar UserSchema = new mongoose.Schema({\n    username: {type: String, unique:\
    \ true},\n    name: String,\n    password: String\n});\n\nmodule.exports = UserSchema;\n\
    ```\n\nWhen you use this option, Mongoose will ensure that a unique index is created\
    \ on that field. Now you can remove the code that checks whether that username\
    \ already exists and simply rely on MongoDB returning you an error in file routes/user.js:\n\
    \n```\napp.post('/users', notLoggedIn, function(req, res, next) {\n    User.create(req.body,\
    \ function(err) {\n        if (err) {\n            if (err.code === 11000) {\n\
    \                res.send('Conflict', 409);\n            } else {\n          \
    \      next(err);\n            }\n            return;\n        }\n        res.redirect('/users');\n\
    \    });\n});\n```\n\nWhen MongoDB yields an error, Mongoose captures the error\
    \ code and passes it inside the error object. Here you are interpreting that error\
    \ code, presenting a 409 Conflict HTTP status code when that code signifies a\
    \ Duplicate Key Error."
