  md: "# Defining Indexes\n\nUnlike some other document-oriented databases, MongoDB\
    \ lets you perform ad hoc queries, where the database creates a plan for running\
    \ that query and tries to optimize it. Speed queries you can create indexes. You\
    \ can index single fields or compound indexes where you combine two or more fields.\n\
    \nAn index can be unique or not. In the user schema, the username has the unique\
    \ option set to true, which instructs Mongoose to ensure a unique index is created\
    \ for that field before any queries run. It happens that you already have a unique\
    \ index in the user's profile:\n\n```\n// ...\nvar userSchema = new mongoose.Schema({\n\
    \  username: {type: String, unique: true},\n  name: mongoose.Types.Mixed,\n});\n\
    //...\n```\n\nAs discussed, a unique index ensures that all documents have a different\
    \ value for that field.\n\nAlso, an index can be sparse or not. If you define\
    \ an index on a field, a normal index will contain an entry for all documents:\
    \ those that contain the field and that don't. But if you set the sparse option\
    \ to true on a field, Mongoose will ensure an index is created that contains only\
    \ the documents that contain the specified field.\n\nUsing sparse indexes has\
    \ an impact on the result of queries that field use. For instance, if you define\
    \ a sparse index on the Twitter handle for the user schema, and you order the\
    \ results of a query by Twitter handle, the results will only contain documents\
    \ for the Twitter handle is defined. By changing the user schema module in data/schemas/user.js,\
    \ setting the sparse property to true:\n\n```\n// ...\ntwitter: {\n  type: String,\n\
    \  sparse: true,\n  validate: [twitterHandleExists, 'Please provide a valid twitter\
    \ handle'],\n  set: filterTwitterHandle,\n  get: filterTwitterHandle\n},\n//..\n\
    ```\n\nRunning the query will only fetch documents that contain the twitter handle:\n\
    \n```\nUser.find({}).sort({twitter: 1}, callback);\n```\n\nYou can create sparse\
    \ with unique indexes to create a unique constraint that ignores documents with\
    \ a missing field. For instance, if you want the email field to be unique but\
    \ not mandatory, you can create a sparse unique index, which uses that field by\
    \ setting the properties in the user schema in the file data/schemas/user.js:"
