    \ the call to this view inside a function named `sendBackLog`, which makes this\
    \ query and sends it to a client socket:\n\n```\nfunction sendBackLog(socket,\
    \ room) {\n  var getOptions = {\n    start_key: JSON.stringify([room, 9999999999999]),\n\
    \    end_key: JSON.stringify([room, 0]),\n    limit: 10,\n    descending: true\n\
    \  };\n\n  chatDB.get('_design/designDoc/_view/by_room', getOptions,\n    function(err,\
    \ results) {\n      var messages = results.rows.reverse().map(function(res) {\n\
    \        return res.value;\n      });\n      socket.emit('backlog', messages);\n\
    \    });\n}\n```\n\nThis function will then need to be invoked when the user logs\
    \ in and enters a room. Once the response from CouchDB arrives, you get an object\
    \ that contains the document count and the offset of the result. In this case\
    \ you don't need these values. In the response object you also get the documents\
    \ inside a `rows` property, which you collect and emit inside a `backlog` event\
    \ sent to the socket.\n\nYou may have noticed that you are no longer emitting\
    \ a string message. Instead you are emitting a message document that contains\
    \ several attributes, including the message text and the author, room, and timestamp.\n\
    \nNext you need to change the front-end code to accept this document as the message\
