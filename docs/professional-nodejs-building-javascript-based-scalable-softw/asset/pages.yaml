  md: "# Piping a File\n\nYou can pipe ReadStream to the response. Here is an example\
    \ that pipes a file into the response. First you have to have an .mp4 file (a\
    \ movie) named “test.mp4” in your current directory. Then run the server shown\
    \ in Listing 11-3.\n\nLISTING 11-3: Piping a movie to the HTTP response.\n\n```\n\
    var fs = require('fs');\n\nrequire('http').createServer(function(req, res) {\n\
    \  res.writeHead(200, {'Content-Type': 'video/mp4'});\n  var rs = fs.createReadStream('test.mp4');\n\
    \  rs.pipe(res);\n}).listen(4000);\n```\n\nWith every request in Listing 11-3,\
    \ you are writing the header status and setting the content type header so that\
    \ the browser identifies the type of stream you are delivering to it. Then you\
    \ are opening the movie file as a ReadStream and piping it to the response WriteStream.\n\
    \nIf you open your browser to http://127.0.0.1:4000 on any modern browser, the\
    \ movie will start playing immediately, even though it's not fully loaded.\n\n\
    # Piping the Output of Another Process\n\nListing 11-4 shows an example that pipes\
    \ the output of a child process into the client.\n\nLISTING 11-4: Piping the output\
    \ of the process to the HTTP response.\n\n```\nvar spawn = require('child_process').spawn;\n\
    \nrequire('http').createServer(function(req, res) {\n  var child = spawn('tail',\
    \ ['-f', '/var/log/system.log']);\n  child.stdout.pipe(res);\n  res.on('end',\
    \ function() {\n    child.kill();\n  });\n}).listen(4000);\n```\n\nHere, when\
    \ a new request comes in, you launch a new child process by executing the command\
    \ -f /var/log/system.log (line 4), which produces a child process. Then you are\
    \ piping the output of that child process into the response (line 5).\n\nWhen\
    \ the response ends (because the browser window was closed, or the network connection\
    \ was severed, for instance), you need to kill the child process so it does not\
    \ hang afterward indefinitely.\n\nSo Listing 11-4 — in nine lines of code — shows\
    \ the power of Node by building a streaming server that spawns, pipes the output\
    \ of a process, and then kills the child process as needed."
