  md: "# UNDERSTANDING THE STANDARD CALLBACK PATTERN\n\nAsynchronous programming does\
    \ not use return values to denote that a function is finished. It uses the continuation-passing\
    \ style (CPS):\n\nContinuation-passing style (CPS) is a style of programming in\
    \ which control is passed explicitly in the form of a continuation. (...)\n\n\
    A function written in continuation-passing style takes as an extra argument explicit\
    \ \"continuation\", that is, a function of one argument. When the CPS function\
    \ has computed result, it \"returns\" by calling the continuation function with\
    \ this value as the argument.\n\n> WIKIPEDIA — //EN.WIKIPEDIA.ORG/WIKI/CONTINUATION-PASSING_STYLE\n\
    \nThis is a style in which a function invokes a callback after the operation is\
    \ complete so that your program can continue. As you see, JavaScript lends itself\
    \ to this type of programming. Here is an example in Node that involves loading\
    \ a file into memory:\n\n```\nvar fs = require('fs');\nfs.read('/etc/passwd',\
    \ function(err, fileContent) {\n  if (err) {\n    throw err;\n  }\n  console.log('file\
    \ content', fileContent.toString());\n});\n```\n\nHere, you are passing an anonymous\
    \ function as the second argument of the fs.readFile function, and you're making\
    \ use of the CPS, because you are continuing the execution of the program inside\
    \ that function.\n\nAs you can see here, the first argument to the callback function\
    \ is an error object, which will have an instance of the Error class if an error\
    \ occurs. This is a common pattern in Node when using CPS.\n\n# UNDERSTANDING\
    \ THE EVENT EMITTER PATTERN\n\nThe standard callback pattern — whereby you pass\
    \ a callback function as an argument of the function you are executing — works\
    \ well when the client needs to be notified when a function completes. If several\
    \ events take place during execution, or if they happen several times, this style\
    \ doesn't work well. For instance, if you are interested in being notified every\
    \ time data is available on a socket, the standard callback pattern is not very\
    \ helpful. This is when the event emitter pattern can help. You can use a standard\
    \ interface to clearly separate the event emitter and the event listener.\n\n\
    When you use an event emitter pattern, two or more objects are involved — the\
    \ event emitter and one or more event listeners.\n\nAn event emitter is an object\
    \ — as its name says — emits events. An event listener is a part of the code that\
    \ binds to the event emitter and listens for certain types of events, like in\
    \ this example:"
