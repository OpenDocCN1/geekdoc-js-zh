  \n### EchoLine 程序的工作原理\n\n当你还是个小婴儿，舒适地躺在母亲怀里时，她告诉了你如何将字符发送到计算机屏幕：\n\n`System.out.println(`*`你想要显示的任何文本`*\
  \ `);`\n\n她没有告诉你的是如何从计算机键盘获取字符。有很多方法可以做到这一点，但我在本章推荐的方法是\n\n`keyboard.nextLine()`\n\
  \n现在，有趣的部分来了。调用`nextLine`方法不仅仅是获取键盘上的字符。当计算机运行你的程序时，计算机会*用你在键盘上输入的内容*替换`keyboard.nextLine()`这段文本。\n\
  \n要理解这一点，请看清单 5-1 中的语句：\n\n`System.out.println(keyboard.nextLine());`\n\n当你运行程序时，计算机会看到你对`nextLine`的调用，然后立即停止。（参见图\
  \ 5-2。）计算机等待你输入一行文本。于是（参见图 5-3）你输入了这行：\n\n`Hey, there’s an echo in here.`\n\n计算机将整个`Hey`行替换到程序中的`keyboard.nextLine()`调用处。这个过程如图\
  \ 5-5 所示。\n\n![图片](img/Image00070.gif)\n\n图 5-5： 计算机用文本替换`nextLine`调用。\n\n对`keyboard.nextLine()`的调用嵌套在`System.out.println`调用内部。因此，最终计算机的行为就像清单\
  \ 5-1 中的语句变成了这样：\n\n`System.out.println(\"Hey, there’s an echo in here.\");`\n\n\
  计算机在屏幕上显示文本`Hey, there’s an echo in here.`的另一个副本。这就是为什么你在图 5-4 中看到两行`Hey`的原因。\n\n\
  ### 获取数字、单词和其他内容\n\n在清单 5-1 中，`keyboard.nextLine()`从计算机键盘获取一整行文本。如果你输入\n\n`Testing\
  \ 1 2 3`\n\n清单 5-1 中的程序会回显整个`Testing 1 2 3`文本行。\n\n有时你并不希望程序获取一整行文本。相反，你希望程序获取一行中的一部分。例如，当你输入**1\
  \ 2 3**时，你可能希望计算机获取数字 1。（也许数字 1 代表一个客户或类似的东西。）在这种情况下，你不需要在程序中使用`keyboard.nextLine()`，而是使用`keyboard.nextInt()`。\n\
  \n表 5-1 展示了`keyboard.next`相关方法的一些变体。不幸的是，表中的条目并不十分可预测。要读取一行输入，你调用`nextLine`。但要读取一个单词输入，你并不调用`nextWord`。（Java\
  \ API 中没有`nextWord`方法。）相反，要读取一个单词，你调用`next`。\n\n| **要读取的内容……** | **……请调用此方法** |\n\
  | --- | --- |\n| 不带小数点的数字 | `nextInt()` |\n| 带小数点的数字 | `nextDouble()` |\n| 一个单词（例如，以空格结尾）\
  \ | `next()` |\n| 一行（或从该行读取部分数据后剩余的内容） | `nextLine()` |\n| 单个字符（例如字母、数字或标点符号） |\
  \ `findWithinHorizon(\".\",0).charAt(0)` |\n\n表 5-1 一些 Scanner 方法\n\n此外，表中的故事有一个意外的结局。要读取单个字符，你不需要调用`next`*`Something`*。相反，你可以调用奇怪的`findWithinHorizon(\"\
  .\",0).charAt(0)`方法组合。（请原谅创建`Scanner`类的人。他们是从一个专业的角度创建`Scanner`的。）\n\n要查看表中一些方法的实际应用，请查看本书中的其他程序清单。第\
  \ 6 章、第 7 章和第 8 章中有一些特别好的例子。\n\n#### 获取单个单词和整行文本\n\n按照本章“输入并运行程序”部分的说明操作，但进行以下两处更改：\n\
  \n*   在第 6 步中，在“新建 Java 类”对话框的“名称”字段中输入**GetInput**。\n\n*   不要输入清单 5-1 中的代码，而是输入以下程序：\n\
  \n```java\nimport java.util.Scanner;\n\npublic class GetInput {\n    public static\
  \ void main(String[] args) {\n        Scanner keyboard = new Scanner(System.in);\n\
  \        System.out.println(keyboard.next());\n        System.out.println(keyboard.next());\n\
  \        System.out.println(keyboard.nextLine());\n        keyboard.close();\n \
  \   }\n}\n```\n\n当程序运行时，在 Eclipse 的控制台视图中输入以下文本（全部在一行上），然后按回车键。计算机会如何响应？为什么？\n\n\
  `I enjoy learning Java.`\n\n### 输入三行代码，然后不再回头\n\n在清单 5-1 中，无辜地隐藏着三行额外的代码。这些代码帮助计算机从键盘读取输入。这三行代码是：\n\
  \n`import java.util.Scanner;`\n\n`Scanner keyboard = new Scanner(System.in);`\n\n\
  `keyboard.close();`\n\n关于这三行代码，我有坏消息和好消息：\n\n*   **坏消息是，这些代码背后的逻辑很难理解。** 尤其是在第 5\
  \ 章中，我介绍了 Java 最基本的概念，这一点尤为突出。\n\n\n\n\n\n**好消息是，你不需要理解这三行代码背后的原理。** 你可以将这些代码复制粘贴到任何从键盘获取输入的程序中，无需做任何修改。这三行代码在所有\
  \ Java 程序中都能直接使用。\n\n只需确保将它们放在正确的位置：\n\n*   将 `import java.util.Scanner` 这一行放在程序的第一行。\n\
  *   将 `Scanner keyboard = new Scanner(System.in)` 这一行放在 `main` 方法中，紧跟在 `public static\
  \ void main(String args[]) {` 之后。\n*   将 `keyboard.close()` 这一行放在程序的最后一行。\n\n将来某个时候，你可能需要更仔细地考虑这三行代码的位置。但就目前而言，我给出的规则已经足够你使用了。\n\
  \n## 意料之外的情况\n\n不久前，我遇到一位讲师，他有一个有趣的政策。他说：“有时我在讲课时，会从头开始在电脑上编写一个程序。我就在学生面前做这件事。如果程序第一次编译并运行成功，我希望学生们给我热烈的掌声。”\n\
  \n起初，你可能会觉得这个人非常自负，但你需要换个角度看问题。程序第一次就能编译并正确运行是很罕见的。几乎总会有拼写错误或其他类型的错误。\n\n因此，本节将讨论你在首次编译和运行程序时常见的、意料之中的错误。每个人都会犯这些错误，即使是经验最丰富的程序员。关键在于保持冷静。以下是我的一般建议：\n\
  \n*   **不要指望你输入的程序第一次就能编译通过。**\n\n    准备好返回编辑器并修正一些错误。\n\n*   **不要指望编译无误的程序就能正确运行。**\n\
  \n    即使 Eclipse 编辑器中没有错误标记，你的程序仍可能包含缺陷。Eclipse 编译完程序后，你还需要成功运行它。也就是说，你的程序应该完成运行并显示正确的输出。\n\
  \n    你先编译，然后运行。让程序无错误地编译是这两项任务中较容易的一项。\n\n*   **阅读 Eclipse 编辑器中的内容，而不是你假设的内容。**\n\
  \n    不要假设你输入了正确的单词、正确的大小写，或者正确匹配了花括号或圆括号。将你输入的代码与任何示例代码进行比较。确保每个细节都正确无误。\n\n* \
  \  **保持耐心。**\n\n    每一个好的编程工作都需要很长时间才能做好。如果你不能立即理解某些东西，请坚持下去。坚持到底（或者暂时放下，稍后再回来）。只要你投入足够的时间，没有什么是你无法理解的。\n\
  \n*   **不要气馁。**\n\n    不要摔你的馅饼皮。气馁（而不是知识匮乏）是你的敌人。如果你气馁了，你将一事无成。\n\n*   **不要认为只有你理解得慢。**\n\
  \n    我理解得慢，但我为此感到自豪。（凯蒂，第 6 章 会晚一周交稿。）\n\n*   **不要胆怯。**\n\n    如果你的代码无法工作，并且你找不到原因，就去问别人。在在线论坛上发帖。不要害怕任何人的冷嘲热讽或讽刺回答。（关于如何回应别人无礼回答的手势列表，请参见附录\
  \ Z。）\n\n    要直接问我，请给我发电子邮件、推特或在 Facebook 上给我留言。（发送邮件至 `BeginProg@allmycode.com`，推特至\
  \ [@allmycode](http://www.twitter.com/allmycode)，或在 Facebook 上发帖至 [`/allmycode`](http://www.facebook.com/allmycode)。）\n\
  \n### 诊断问题\n\n本章前面的“输入并运行程序”一节告诉你如何运行 `EchoLine` 程序。如果一切顺利，你的屏幕最终会看起来像图 5-1 所示。但事情并不总是一帆风顺。有时你的手指会滑，在程序中插入一个拼写错误。有时你忽略了清单\
  \ 5-1 中的某个细节，然后得到一个讨厌的错误消息。\n\n当然，清单 5-1 中的某些内容是可以更改的。清单 5-1 中的每个单词并非一成不变。这里有一个棘手的问题：我不能告诉你必须完全按照原样重新输入清单\
  \ 5-1。有些更改是可以的；有些则不行。继续阅读一些“实例”。\n\n#### 大小写敏感\n\nJava 是大小写敏感的。其中，*大小写敏感*意味着在 Java\
  \ 程序中，字母 `P` 和字母 `p` 是不同的。如果你给我写粉丝信，开头写“亲爱的 barry”而不是“亲爱的 Barry”，我仍然明白你的意思。但 Java\
  \ 不会这样工作。\n\n只需更改 Java 程序中的一个字符，原本顺利的编译就会变成一个大麻烦！将 `p` 改为 `P`，如下所示：\n\n`// 下面这行代码是错误的：`\n\
  \n`System.out.Println(keyboard.nextLine());`\n\n当你在 Eclipse 编辑器中输入这个程序时，你会看到如图图\
  \ 5-6 所示的丑陋景象。\n\n![image](img/Image00071.gif)\n\n图 5-6： Java 编译器能识别 `println`，但不能识别\
  \ `Println`。\n\n当你看到像图 5-6 中的错误标记时，最好的办法是保持冷静，仔细阅读消息。有时消息中会包含有用的提示。（当然，有时也没有。）图\
  \ 5-6 中的消息是 `The method Println(String) is undefined for the type PrintStream`。用通俗的话说，这意味着“Java\
  \ 编译器无法解释单词 `Println`”。（消息没有直接说“不要输入单词 `Println`，你这个笨蛋！”。无论如何，如果计算机说你是我们中的笨蛋，你应该把它当作一种赞美。）现在，编译器无法理解像\
  \ `Println` 这样的单词的原因有很多。但对于初学者来说，你应该立即检查两个重要事项：\n\n*   **你是否拼写正确？**\n\n    你是否不小心输入了\
  \ `print1n`（数字 1），而不是 `println`（小写字母 l）？\n\n*   **你是否正确使用了大小写？**\n\n    你是否错误地输入了\
  \ `Println` 或 `PrintLn` 而不是 `println`？\n\n这两种错误中的任何一种都可能让 Java 编译器陷入混乱。因此，请将你的输入与正确的输入逐字（逐字母）进行比较。当你发现不一致时，返回编辑器并修复问题。然后再次尝试编译程序。\n\
  \n![提示](img/Image00003.jpg) 当你在 Eclipse 编辑器中输入程序时，Eclipse 会尝试编译该程序。当 Eclipse 发现编译时错误时，编辑器通常会显示至少三个红色错误标记。（参见图\
  \ 5-6。）编辑器左边距中的标记有一个类似 X 的符号，有时还有一个小灯泡。右边距中的标记是一个小方块。中间的标记是锯齿状的红色下划线。\n\n\n\n\n\n\
  如果将鼠标悬停在这些标记中的任何一个上，Eclipse 会显示一条消息，试图描述错误的性质。如果将鼠标悬停在波浪线上，Eclipse 会显示一条消息，并可能列出建议的解决方案列表。（每个建议的解决方案称为一个*快速修复*。）如果右键单击左边距的标记（或在\
  \ Mac 上按住 Control 键单击），然后在出现的上下文菜单中选择“快速修复”，Eclipse 会显示建议的解决方案。要让 Eclipse 自动修改你的代码（使用快速修复列表中的建议），只需单击或双击快速修复列表中的项目即可。（也就是说，单击任何看起来像链接的内容；双击任何看起来不像链接的内容。）\n\
  \n#### 标点符号不足\n\n在英语和 Java 中，使用；正确的！标点符号很重要）\n\n以清单 5-1 中的分号为例。如果你忘记输入分号会发生什么？\n\
  \n```\n//以下代码不正确：\nSystem.out.println(keyboard.nextLine())\nkeyboard.close();\n\
  ```\n\n如果你漏掉了分号，你会看到图 5-7 中显示的消息。\n\n![image](img/Image00072.gif)\n\n图 5-7： 一条有用的错误消息。\n\
  \n像图 5-7 这样的消息让你的生活简单得多。我不需要解释这条消息，你也不必琢磨消息的含义。只需按字面意思理解消息 `insert \";\" to complete\
  \ Statement`。在 `System.out.println(keyboard.nextLine())` 语句的末尾和该语句之后的任何代码之间插入分号。（对于更易读和理解的代码，将分号附加在\
  \ `System.out.println(keyboard.nextLine())` 语句的末尾。）\n\n#### 标点符号过多\n\n在初中时，我的英语老师说，每当我正常呼吸停顿的地方，就应该使用逗号。这个建议在过敏季节并不好用，那时我的句子中逗号比单词还多。即使作为一名付费作者，我也很难决定逗号应该放在哪里，所以我经常为了保险起见添加多余的逗号。这给我的文字编辑\
  \ Becky 增加了更多工作，她办公室的桌子旁有一个装满逗号的垃圾桶。\n\n在 Java 程序中也是如此。你可能会过度使用标点符号。例如，考虑清单 5-1\
  \ 中的 `main` 方法头。这一行对新手程序员来说是一个危险的弯道。\n\n关于术语*方法头*和*方法体*的信息，请参考第 4 章。\n\n通常，你不应该用分号结束方法头。但人们还是会添加分号。（也许在某种程度上，方法头看起来应该以分号结尾。）\n\
  \n```\n//以下代码行不正确：\npublic static void main(String args[]); {\n```\n\n如果你将这个多余的分号添加到清单\
  \ 5-1 的代码中，你会得到图 5-8 中显示的消息。\n\n![image](img/Image00073.jpg)\n\n图 5-8： 一个不需要的分号把事情搞砸了。\n\
  \n图 5-8 中的错误消息和快速修复有点误导。消息以 `This method requires a body` 开头。但该方法有一个方法体。不是吗？\n\n\
  当计算机尝试编译 `public static void main(String args[]);`（以分号结尾）时，计算机会感到困惑。我在图 5-9 中说明了这种困惑。你的眼睛看到了一个多余的分号，但计算机的眼睛将其解释为一个没有方法体的方法。所以这就是错误消息——计算机说\
  \ `This method requires a body instead of a semicolon`。\n\n![image](img/Image00074.gif)\n\
  \n图 5-9： 这台计算机在想什么？\n\n如果你选择“添加方法体”快速修复，Eclipse 会创建以下（非常糟糕的）代码：\n\n```\nimport java.util.Scanner;\n\
  \nclass EchoLine {\npublic static void main(String args[]) {\n} {\nScanner keyboard\
  \ = new Scanner(System.in);\nSystem.out.println(keyboard.nextLine());\nkeyboard.close();\n\
  }\n}\n```\n\n这个“修复”后的代码没有编译时错误。但当你运行这段代码时，什么也不会发生。程序开始运行然后停止运行，Eclipse 的控制台视图中没有任何内容。\n\
  \n我们都知道计算机是一台非常有耐心、非常富有同情心的机器。这就是为什么计算机会查看你的代码并决定再给你一次机会。计算机记得 Java 有一个高级特性，你可以编写一个方法头而不编写方法体。当你这样做时，你会得到所谓的*抽象方法*——我在本书中没有使用这个特性。无论如何，在图\
  \ 5-9 中，计算机看到了一个没有方法体的方法头。所以计算机对自己说：“我知道！也许程序员正在尝试编写一个抽象方法。问题是，抽象方法的方法头必须包含 `abstract`\
  \ 这个词。我应该提醒程序员这一点。”因此，计算机在图 5-9 中提供了 `Change ’EchoLine.main’ to ’abstract’` 快速修复。\n\
  \n无论如何，如果不揣摩言外之意，你就无法理解图 5-9 中的错误消息和快速修复。所以这里有一些技巧可以帮助你解读晦涩的消息：\n\n*   **避免条件反射式的反应。**\n\
  \n    有些人看到图 5-9 中的 `Change ’EchoLine.main’ to ’abstract’` 快速修复，会想知道如何将 `EchoLine.main`\
  \ 改为 `abstract`。不幸的是，这不是正确的方法。如果你不知道 `abstract` 是什么意思，很可能你一开始就没打算让 `EchoLine.main`\
  \ 成为 `abstract`。\n\n*   **长时间盯着有问题的代码行。**\n\n    如果你`仔细`查看图 5-9 中的 `public static\
  \ …` 行，最终你会注意到它与清单 5-1 中的对应行不同。清单 5-1 中的行没有分号，但图 5-9 中的行有分号。\n\n    当然，你并不总是从像清单\
  \ 5-1 中那样的预写代码开始。这就是熟能生巧的地方。你写的代码越多，你的眼睛对多余的分号和其他编程错误就会越敏感。\n\n#### 花括号过多\n\n你正在寻找最近的加油站，于是问了一个当地人。“走到第一个红绿灯左转，”当地人说。你直行了几条街，看到了一个闪烁的黄灯。你在信号灯处左转，行驶了大约一英里。什么？没有加油站？也许你把闪烁的信号灯误认为是真正的红绿灯。\n\
  \n你来到了一个岔路口，对自己说：“方向指示里没有提到岔路。我该走哪条路？”你向右拐，但一分钟后被迫上了高速公路。你看到一个牌子写着：下一个出口 24 英里。现在你真的迷路了，油表指针指向\
  \ S。（*S* 代表 Stranded，意为“抛锚”。）\n\n事情是这样的：你犯了一个无心之过。你不应该在黄色闪烁灯处左转。这个错误本身并不那么严重。但第一个错误导致了更多的混乱，最终，你的选择变得毫无意义。如果你没有在闪烁灯处转弯，你就永远不会遇到那个该死的岔路口。然后上高速公路简直就是一场灾难。\n\
  \n\n\n\n\n这个故事有意义吗？当然有。计算机也会陷入类似的混乱。计算机发现你的程序中有一个错误。然后，打个比方说，计算机会在岔路口做出选择——这个岔路是基于原始错误的——而这条岔路上的所有选项都不会带来好结果。\n\
  \n举个例子。你在重新输入清单 5-1 中的代码时，不小心多打了一个花括号：\n\n```\n//以下代码不正确：\nimport java.util.Scanner;\n\
  class EchoLine {\npublic static void main(String args[]) {\nScanner keyboard = new\
  \ Scanner(System.in);\n}\nSystem.out.println(keyboard.nextLine());\nkeyboard.close();\n\
  }\n}\n```\n\n在 Eclipse 编辑器中，你将鼠标悬停在最左侧的标记上。你会看到如图 5-10 所示的消息。\n\n![image](img/Image00075.jpg)\n\
  \n图 5-10： 三条错误消息。\n\nEclipse 感到困惑，因为程序中的某些代码完全放错了位置。Eclipse 显示了三条消息——一条关于 `SimpleName`，一条关于括号，还有一条关于\
  \ `MethodHeaderName`。这些消息都没有指出问题的根源。Eclipse 试图在糟糕的情况下尽力而为，但此时，你不应该相信 Eclipse 说的任何一个字。\n\
  \n计算机并不是聪明的动物，如果有人编程让 Eclipse 说 `insert \"SimpleName\" to complete QualifiedName`，那么\
  \ Eclipse 就会原样说出这句话。（有些人说计算机让他们觉得自己很笨。对我来说，恰恰相反。计算机提醒我，机器可以有多笨，而人可以有多聪明。我喜欢这一点。）\n\
  \n当你看到一堆错误消息时，请仔细阅读每一条消息。问问自己能从每条消息中学到什么。但不要将每条消息都当作权威真理。当你对 Eclipse 的消息束手无策时，回到你的努力中，仔细盯着代码看。\n\
  \n![remember](img/Image00005.jpg) 如果你收到不止一条错误消息，一定要仔细查看这一堆消息中的每一条。有时，一条有用的消息会隐藏在一堆不太有用的消息之中。\n\
  \n## 拼写错误（以及其他失误）\n\n你找到了一个古老的家族食谱，用来做魔鬼蛋（我的最爱之一）。你尽可能仔细地遵循每一步，但因为祖母有高血压，你省略了盐。你把一个蛋（完美的杰作）递给祖母。“胡椒不够，”她说着走开了。\n\
  \n下一道菜是勃艮第牛肉。你给亲爱的老奶奶拿了一块没加盐的切片。“不够甜，”她抱怨着离开了房间。“但这不可能，”你想，“勃艮第牛肉里没有糖。我明明没放盐。”即便如此，你还是回到厨房准备土豆泥。当然，你用了无盐黄油。“这次她会喜欢的，”你想。\n\
  \n“酸土豆！恶心！”奶奶说着，走到水槽边把土豆泥全吐了出来。因为你自尊心很强，所以并没有因为祖母的行为而感到被冒犯。但你有点困惑。为什么她对三道无盐的食谱给出了如此不同的评价？也许有一些你不知道的细微差别。\n\
  \n嗯，编写计算机程序时也会发生同样的事情。你可能会犯两次同样的错误（或者至少，你认为犯了同样的错误），但每次都会得到不同的错误消息。\n\n例如，如果你更改了清单\
  \ 5-1 中 `println` 的拼写或大小写，Eclipse 会告诉你该方法 `is undefined for the type PrintStream`。但如果你将\
  \ `System` 改为 `system`，Eclipse 会说 `system cannot be resolved`。而且当 `System` 拼写错误时，Eclipse\
  \ 不会注意到 `println` 是否拼写正确。\n\n在清单 5-1 中，如果你更改了 `args` 的拼写，什么也不会出错。程序可以正确编译和运行。但如果你更改了\
  \ `main` 的拼写，就会遇到一些不寻常的困难。（如果你不相信我，请阅读本章稍后的“运行时错误消息”部分。）\n\n还是在清单 5-1 中，更改 `Scanner\
  \ keyboard = new Scanner(System.in)` 这一行中等号的数量。如果是一个等号，一切正常。如果你不小心输入了两个等号（`Scanner\
  \ keyboard == new Scanner(System.in)`），Eclipse 会把你拉回正轨，告诉你 `Syntax error on token\
  \ \"==\", = expected`。（见图 5-11。）但如果你发疯似的输入四个等号，或者根本不输入等号，Eclipse 就会误解一切，并建议你 `insert\
  \ \";\" to complete BlockStatements`。不幸的是，插入分号根本没用。（见图 5-12。）\n\n![image](img/Image00076.gif)\n\
  \n图 5-11： 删除两个等号中的第二个。\n\n![image](img/Image00077.gif)\n\n图 5-12： 你少了一个等号，但 Eclipse\
  \ 没有注意到。\n\n![remember](img/Image00005.jpg) Java 对错误的反应方式多种多样。代码中的两个改动可能看起来很相似，但相似的改动并不总是导致相似的结果。代码中的每个问题都需要单独关注。\n\
  \n![tip](img/Image00003.jpg) 这里有一个有用的练习：从一个能正常运行的 Java 程序开始。成功运行代码后，做一个改动，故意引入错误。仔细查看每条错误消息，并问问自己这条消息是否有助于诊断问题。这个练习很有用，因为它能帮助你认识到错误是正常现象，并让你在不必急于让程序正确运行的压力下，练习分析消息。\n\
  \n## 运行时错误消息\n\n在本章中，到目前为止，我描述的是编译程序时出现的错误。另一类错误则隐藏到程序运行时才出现。一个典型的例子是 `main` 这个词的拼写或大小写错误。\n\
  \n假设在一时冲动之下，你把 `main` 错误地拼写成了大写 `M`：\n\n```\n//以下代码不正确：\npublic static void Main(String\
  \ args[]) {\n```\n\n当你输入代码时，一切都很顺利。你没有看到任何错误标记。\n\n但随后你尝试运行程序。这时，麻烦就来了。灾难如图 5-13\
  \ 所示。\n\n![image](img/Image00078.jpg)\n\n图 5-13： “选择内容不包含 main 类型”是什么意思？\n\n当然，你的程序中有一个名为\
  \ `Main` 的东西，但它有名为 `main` 的东西吗？（是的，我听说过一位著名诗人叫 e. e. cummings，但 E. E. Cummings 又是谁？）计算机不会假定你的\
  \ `Main` 与预期的 `main` 是同一个意思。你需要将 `Main` 改回 `main`。这样一切就正常了。\n\n但与此同时（或者说在“main 时间”），这种不正确的拼写是如何通过编译器的？为什么你在编译程序时没有收到错误消息？如果大写\
  \ `M` 不会让编译器出错，那为什么这个大写 `M` 会在运行时搞砸一切？\n\n答案要追溯到 Java 编程语言中不同类型的词。正如我在第 4 章中所说，Java\
  \ 有标识符和关键字。\n\nJava 中的关键字是固定不变的。如果你将 `class` 改为 `Class`，或者将 `public` 改为 `Public`，你会得到一些新的东西——计算机可能无法理解的东西。这就是为什么编译器会因关键字大小写错误而报错。确保所有关键字都被正确使用是编译器的职责。\n\
  \n\n\n\n\n另一方面，标识符可以随意出现。当然，有一个名为 `main` 的标识符，但你可以创建一个名为 `Main` 的新标识符。（不过你不应该这样做。对于了解\
  \ Java 中 `main` 通常含义的人来说，这太令人困惑了。）当编译器看到一行拼写错误的代码，比如 `public static void Main` 时，编译器只会认为你在创建一个全新的名称。因此编译器会放行这一行。你的老朋友——编译器，不会发出任何抱怨。\n\
  \n但是，当你尝试运行代码时，计算机会暴跳如雷。Java 虚拟机（JVM）运行你的代码。（详情请参见第 1 章。）JVM 需要找到一个位置来开始执行你代码中的语句，因此\
  \ JVM 会寻找一个名为 `main`（小写 `m`）的起点。如果 JVM 没有看到任何名为 `main` 的东西，JVM 就会不高兴。“在类 EchoLine\
  \ 中找不到 main 方法，”JVM 说道。所以在运行时，是 JVM（而不是编译器）给你报错。\n\n![tip](img/Image00003.jpg) 更好的错误信息应该是：在类\
  \ `EchoLine` 中找不到 `main` 方法，其中 `main` 中的字母 `m` 是小写。有时，编写错误信息的人会忽略一两个细节。\n\n### 什么问题？我没看到问题\n\
  \n在本章结尾，我将通过展示一些可以在清单 5-1 中更改而不影响程序运行的内容，来以积极的方式结束本章。\n\n#### 你创建的标识符\n\n如果你创建一个标识符，这个名字是可以随意更改的。例如，在清单\
  \ 5-1 中，你可以将 `EchoLine` 改为 `RepeatAfterMe`：\n\n```\nclass RepeatAfterMe {\npublic\
  \ static void main … etc.\n```\n\n只要你愿意保持一致，这完全没有问题。只需按照本章前面“输入并运行程序”一节中的大部分步骤操作即可。\n\
  \n* 在第 6 步中，不要在“新建 Java 类”对话框的“名称”字段中输入 `EchoLine`，而是输入 `RepeatAfterMe`。\n* 在第 8\
  \ 步中，当你从清单 5-1 复制代码时，不要在清单顶部附近输入 `class EchoLine {`，而是输入 `class RepeatAfterMe {`。\n\
  \n![technicalstuff](img/Image00007.jpg) 与其仅以 `class` 开头启动程序，你可以用 `public class`\
  \ 开头。如果这样做，将 `EchoLine` 改为 `RepeatAfterMe` 可能会带来一点麻烦。对于你这样的新手程序员来说，最简单的解决方案是去掉 `public`\
  \ 这个词。\n\n#### 空格和缩进\n\nJava 对空格和缩进的使用并不挑剔。你只需要保持程序组织良好且可读即可。以下是清单 5-1 中代码的空格和缩进的一种替代方案：\n\
  \n```\nimport java.util.Scanner;\n\nclass EchoLine\n{\npublic static void main(\
  \ String args[] )\n{\nScanner keyboard =\nnew Scanner( System.in );\nSystem.out.println\n\
  ( keyboard.nextLine() );\nkeyboard.close();\n}\n}\n```\n\n#### 你选择做事的方式\n\n程序就像指纹。没有两个程序看起来非常相似。假设我和一位同事讨论一个编程问题。然后我们各走各路，编写自己的程序来解决同一个问题。当然，我们是在重复劳动。但我们会创建完全相同的代码吗？绝对不会。每个人都有自己的风格，每个人的风格都是独一无二的。\n\
  \n我请另一位 Java 程序员 David Herst 编写他自己的 EchoLine 程序，但没有给他看我在清单 5-1 中的代码。他写的是：\n\n```\n\
  import java.io.BufferedReader;\nimport java.io.InputStreamReader;\nimport java.io.IOException;\n\
  \npublic class EchoLine {\npublic static void main(String[] args) throws IOException\
  \ {\nInputStreamReader isr = new InputStreamReader(System.in);\nBufferedReader br\
  \ = new BufferedReader(isr);\nString input = br.readLine();\nSystem.out.println(input);\n\
  }\n}\n```\n\n不要担心 `BufferedReader`、`InputStreamReader` 之类的东西。只需注意，就像雪花一样，没有两个程序是完全相同的，即使它们完成相同的任务。这很好。这意味着你的代码，无论多么不同，都可以和别人的代码一样好。这很令人鼓舞。\n\
  \n#### 编译时错误\n\n![tryitout](img/Image00006.jpg) MCV 疫苗通过让你患上轻微的麻疹来帮助你建立对麻疹的免疫力。同样，你可以通过故意在小型、可丢弃的\
  \ Java 程序中制造错误来增强对编程错误的免疫力。\n\n无论你编写代码多少年，你编写的任何新代码中总会有一些编程错误。即使是最有经验的专业程序员也会犯错。但通过练习一些简单的错误，你可以发现初学者最常犯的一些错误，并习惯“编码、测试、修复、再编码”的循环。\n\
  \n尝试以下在清单 5-1 中引入错误的方法：\n\n* 在 `println` 这个词中，将小写字母 `l` 改为数字 `1`。\n* 将整个 `System.out.println`\
  \ 行移到 `public static void main` 行的上方。\n* 删除 `(\"Chocolate, royalties, sleep\")`\
  \ 周围的括号。\n* 删除 `\"Chocolate, royalties, sleep\"` 周围的引号。\n* 将引用的文本跨行断开，如下所示：\n  ```\n\
  \  System.out.println(\"Chocolate,\n  royalties,\n  sleep\");\n  ```\n* 打开你最喜欢的文字处理程序（Microsoft\
  \ Word、Apple Pages 或其他），创建一个仅包含文本“Chocolate, royalties, sleep”的文档。很可能，你的文字处理程序会自动使用弯引号（“”）而不是直引号（\"\
  \"），而弯引号不适用于 Java 程序。因此，从你的文字处理程序中复制这段带弯引号的文本。在 Eclipse 编辑器中，将带弯引号的文本粘贴到清单 3-1（位于第\
  \ 3 章）中。替换该清单中原始的 `\"Chocolate, royalties, sleep\"` 文本，包括直引号等。查看 Eclipse 显示的错误信息类型。\n\
  \n#### 允许的空格和缩进更改\n\n你不能将带引号的字符串（例如 `\"Chocolate, royalties, sleep\"`）拆分成两行或三行。但在\
  \ Java 程序的其他部分，换行无关紧要。尝试更改清单 5-1 中的空格和缩进。尝试运行以下代码：\n\n```\nimport java.util.Scanner;\n\
  \nclass ThingsILike\n{\npublic static void main (String[] args)\n{\nScanner keyboard\
  \ = new Scanner (System.in);\nSystem.out.println (\"Chocolate, royalties, sleep\"\
  );\nkeyboard.close ();\n}\n}\n```\n\n## 第 6 章\n\n## 使用构建块：变量、值和类型\n\n本章内容包括\n\n\
  ![check](img/Image00002.jpg) **声明变量**\n\n![check](img/Image00002.jpg) **为变量赋值**\n\
  \n![check](img/Image00002.jpg) **处理数字**\n\n![check](img/Image00002.jpg) **使用 Java\
  \ 类型**\n\n早在 1946 年，约翰·冯·诺依曼就撰写了一篇关于新兴计算机和计算技术的开创性论文。其中，他确立了一个基本事实：尽管计算机很复杂，但其主要工作是将数据从一个地方移动到另一个地方。取一个数字——某人银行账户的余额。将这个数字从计算机内存移动到计算机处理单元。向余额中添加几美元，然后将其移回计算机内存。数据的移动……仅此而已；没有更多了。\n\
  \n足够了！本章将向你展示如何移动数据。\n\n## 使用变量\n\n以下是某软件公司网站上的摘录：\n\n\n\n\n\n> SnitSoft 认识到自己对信息技术社区的责任。因此，SnitSoft\
  \ 以象征性收费的方式提供其最受欢迎的应用程序。只需支付 5.95 美元加上运费和手续费，您就能收到一个包含 SnitSoft 旗舰产品的闪存盘。\n\n请继续。点击“立即订购！”链接。看看会发生什么。您会看到一个包含两个项目的订单表格。一个项目标有\
  \ `$5.95 (Flash drive)`，另一个项目写着 `$25.00 (Shipping and handling)`。真是敲竹杠！多亏了 SnitSoft\
  \ 的慷慨，您只需支付 30.95 美元就能买到价值十美分的软件。\n\n在 SnitSoft 网页的背后，一个计算机程序进行着卑鄙的计算。该程序看起来类似于清单\
  \ 6-1 中的代码。\n\n清单 6-1 SnitSoft 的大骗局\n\n```\nclass SnitSoft {\npublic static void\
  \ main(String args[]) {\ndouble amount;\namount = 5.95;\namount = amount + 25.00;\n\
  System.out.print(\"We will bill $\");\nSystem.out.print(amount);\nSystem.out.println(\"\
  \ to your credit card.\");\n}\n}\n```\n\n当我在自己的计算机上（而不是 SnitSoft 的计算机上）运行清单 6-1\
  \ 中的代码时，得到了如图 图 6-1 所示的输出。\n\n![image](img/Image00079.gif)\n\n图 6-1: 运行清单 6-1 中的代码。\n\
  \n### 使用变量\n\n清单 6-1 中的代码使用了一个名为 `amount` 的变量。*变量*是一个占位符。你可以将像 5.95 这样的数字放入变量中。将数字放入变量后，你可以改变主意，将另一个不同的数字（如\
  \ 30.95）放入变量中。（这就是变量中“变”的含义。）当然，当你将新数字放入变量时，旧数字就不再存在了。如果你没有将旧数字保存在其他地方，旧数字就消失了。\n\
  \n图 6-2 展示了清单 6-1 中代码的前后对比。当计算机执行 `amount = 5.95` 时，变量 `amount` 中包含数字 5.95。然后，在执行\
  \ `amount = amount + 25.00` 语句后，变量 `amount` 突然变成了 30.95。当你思考变量时，可以想象计算机内存中某个位置，那里由电线和晶体管存储着\
  \ 5.95、30.95 或其他数值。在图 6-2 中，想象每个盒子周围还有数百万个类似的盒子。\n\n![image](img/Image00080.gif)\n\
  \n图 6-2: 一个变量（前后对比）。\n\n现在你需要了解一些术语。（你可以参照图 6-3 来理解。）存储在变量中的东西称为*值*。变量的值可以在程序运行期间发生变化（例如，当\
  \ SnitSoft 添加运费和手续费时）。存储在变量中的值不一定是数字。（例如，你可以创建一个始终存储字母的变量。）存储在变量中的值的种类称为变量的*类型*。（你可以在本章剩余部分以及接下来的两章中了解更多关于类型的内容。）\n\
  \n![image](img/Image00081.jpg)\n\n图 6-3: 一个变量、它的值以及它的类型。\n\n![technicalstuff](img/Image00007.jpg)\
  \ 变量和变量的*名称*之间存在细微的、几乎难以察觉的区别。即使在正式写作中，我经常在指代*变量名*时使用*变量*一词。严格来说，`amount` 是变量名，而与\
  \ `amount` 相关的所有内存存储（包括 `amount` 的值和类型）才是变量本身。如果你认为这种*变量*与*变量名*之间的区别过于细微而不必在意，那么欢迎加入我们的行列。\n\
  \n每个变量名都是一个标识符——你可以在自己的代码中随意命名的名称（关于此主题的更多信息，请参见第 4 章）。在编写清单 6-1 时，我编造了名称 `amount`。\n\
  \n### 理解赋值语句\n\n清单 6-1 中带有等号的语句称为赋值语句。在*赋值语句*中，你将一个值赋给某个东西。在许多情况下，这个“某个东西”就是一个变量。\n\
  \n你应该养成从右向左阅读赋值语句的习惯。例如，清单 6-1 中的第一个赋值语句表示：“将 `5.95` 赋给 `amount` 变量。”第二个赋值语句稍微复杂一些。从右向左阅读第二个赋值语句，你得到：“将\
  \ `25.00` 加到 `amount` 变量中已有的值上，并将该数字（`30.95`）作为 `amount` 变量的新值。”关于这一点，图 6-4 给出了一个直观的、一目了然的图示。\n\
  \n![image](img/Image00082.jpg)\n\n图 6-4: 从右向左阅读赋值语句。\n\n![remember](img/Image00005.jpg)\
  \ 在赋值语句中，被赋值的对象始终位于等号的左侧。\n\n### 换行还是不换行？\n\n清单 6-1 中的最后三条语句使用了一个巧妙的技巧。你希望程序在屏幕上只显示一行，但这行包含三个不同的内容：\n\
  \n*   该行以 `We will bill $` 开头。\n*   该行接着显示 `amount` 变量的值。\n*   该行以 `to your credit\
  \ card` 结尾。\n\n这是三个独立的部分，因此你将它们放在三条独立的语句中。前两条语句是对 `System.out.print` 的调用。最后一条语句是对\
  \ `System.out.println` 的调用。\n\n对 `System.out.print` 的调用会在当前行的一部分显示文本，然后将光标留在当前行的末尾。执行\
  \ `System.out.print` 后，光标仍停留在同一行的末尾，因此下一个 `System.out.`*`whatever`* 可以继续在同一行上打印。通过多次调用\
  \ `print` 并以一次 `println` 调用收尾，最终结果就是一行漂亮的输出，如图 6-5 所示。\n\n![image](img/Image00083.gif)\n\
  \n图 6-5: `System.out.print` 和 `System.out.println` 所扮演的角色。\n\n![remember](img/Image00005.jpg)\
  \ 调用 `System.out.print` 会写入一些内容，并将光标留在输出行的末尾。调用 `System.out.println` 会写入内容，然后将光标移动到全新输出行的开头，从而完成工作。\n\
  \n## 那些零和一到底意味着什么？\n\n这里有一个词：\n\n> gift\n\n要讨论的问题是，这个词是什么意思？嗯，这取决于谁在看这个词。例如，说英语的读者会认为\
  \ *gift* 代表一个人赠予另一个人的东西，装在用亮纸和丝带装饰的盒子里：\n\n> 看！我给你一个**礼物**！\n\n但在德语中，*gift* 这个词的意思是“毒药”：\n\
  \n> 让我给你一些**毒药**，亲爱的。\n\n而在瑞典语中，*gift* 既可以表示“已婚”，也可以表示“毒药”：\n\n> 他们一**结婚**，她就往他的饮料里下了**毒**。\n\
  \n然后是法语。在法国，有一种名为“Gift”的糖果棒：\n\n> 他假期来了，只给了我一块**Gift** 巧克力棒。\n\n字母 g-i-f-t 到底意味着什么？嗯，在你决定如何解释它们之前，它们没有任何意义。计算机电路中的零和一也是如此。\n\
  \n\n\n\n以序列 01001010 为例。这个序列可以代表字母 *J*，也可以代表数字 74。同样的零一序列还可以代表 1.0369608636003646×10^(–43)。而当它被解释为屏幕像素时，同样的序列可以表示图\
  \ 6-6 中显示的点。01001010 的含义完全取决于软件解释该序列的方式。\n\n![image](img/Image00084.jpg)\n\n图 6-6：\
  \ 八个黑白屏幕像素的极端特写。\n\n### 类型与声明\n\n如何告诉计算机 01001010 代表什么？答案在于一个称为“类型”的概念。变量的*类型*描述了该变量允许存储的值的种类。\n\
  \n在清单 6-1 中，查看 `main` 方法体中的第一行：\n\n`double amount;`\n\n这一行被称为*变量声明*。在程序中加入这一行，相当于说：“我声明我的程序中有一个名为\
  \ `amount` 的变量。”这一行为你在程序中保留了名称 `amount` 的使用权。\n\n在这个变量声明中，单词 `double` 是一个 Java 关键字。这个单词\
  \ `double` 告诉计算机你打算在 `amount` 中存储哪种类型的值。具体来说，`double` 代表介于 –1.8×10³⁰⁸ 和 1.8×10³⁰⁸\
  \ 之间的数字。这是一个极其庞大的数字范围。如果不使用 ×10 这种科学记数法，第二个数字是：\n\n```\n180000000000000000000000000000000000000000000000000000\n\
  000000000000000000000000000000000000000000000000000000\n000000000000000000000000000000000000000000000000000000\n\
  000000000000000000000000000000000000000000000000000000\n000000000000000000000000000000000000000000000000000000\n\
  000000000000000000000000000000000000000.0\n```\n\n如果 SnitSoft 公司对运费和手续费收取如此高的费用，他们可以用\
  \ `double` 类型的变量来表示这笔费用。\n\n### 重点是什么？\n\n比 `double` 关键字所代表的数字范围巨大更重要的是，`double`\
  \ 值可以包含小数点右边的数字。在将 `amount` 声明为 `double` 类型后，你可以在 `amount` 中存储各种数字。你可以存储 5.95、0.02398479\
  \ 或 –3.0。在清单 6-1 中，如果我没有将 `amount` 声明为 `double` 类型，我就无法存储 5.95。相反，我只能存储普通的 5 或单调的\
  \ 6，没有任何小数点后面的数字。\n\n关于不带小数点的数字的更多信息，请参见第 7 章。\n\n![technicalstuff](img/Image00007.jpg)\
  \ 本段涉及一个非常挑剔的点，如果你没心情可以跳过。人们经常用*十进制数*这个短语来描述带有小数点右边数字的数字。问题是，音节“dec”代表数字 10，所以*十进制*这个词暗示了以\
  \ 10 为基数的表示法。由于计算机存储的是以 2 为基数（而不是以 10 为基数）的表示法，用*十进制*来描述这样的数字其实是用词不当。但在本书中，我实在忍不住。不管技术人员喜不喜欢，我都称它们为十进制数。\n\
  \n![tryitout](img/Image00006.jpg) 以下是一些供你尝试的内容：\n\n#### 数字运算\n\n更改清单 6-1 中的数值，并用新数字运行程序。\n\
  \n#### 变量变化\n\n在清单 6-1 中，将变量名 `amount` 改为其他名称。在整个清单 6-1 代码中一致地更改该名称。然后用新的变量名运行程序。\n\
  \n#### 使用下划线\n\n修改清单 6-1 中的代码，使运费和手续费为 100 万美元。使用 `1_000_000.00`（带下划线）来表示这一百万美元金额。\n\
  \n#### 更多信息，请\n\n修改清单 6-1 中的代码，使其显示三个值：闪存盘的原始价格、运费和手续费，以及总价。\n\n## 从键盘读取十进制数\n\n\
  我简直不敢相信！SnitSoft 正在促销！仅限一周，你可以以低至 5.75 美元的价格购买 SnitSoft 闪存盘！最好赶紧订购一个。\n\n不，等等！清单\
  \ 6-1 中的价格固定为 5.95 美元。我必须修改程序。\n\n我知道了。我会让代码更通用。我将从键盘输入金额。清单 6-2 是修改后的代码，图 6-7 显示了新代码的一次运行。\n\
  \n![image](img/Image00085.jpg)\n\n图 6-7： 获取 double 变量的值。\n\n清单 6-2 从键盘获取 double\
  \ 值\n\n```java\nimport java.util.Scanner;\n\nclass VersatileSnitSoft {\n    public\
  \ static void main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
  \        double amount;\n        System.out.print(\"What’s the price of a flash\
  \ drive? \");\n        amount = keyboard.nextDouble();\n        amount = amount\
  \ + 25.00;\n        System.out.print(\"We will bill $\");\n        System.out.print(amount);\n\
  \        System.out.println(\" to your credit card.\");\n        keyboard.close();\n\
  \    }\n}\n```\n\n![warning](img/Image00004.jpg) 分组分隔符因国家而异。图 6-7 所示的运行结果是在一台配置为美国地区的计算机上进行的，其中\
  \ *5.75* 表示“五又百分之七十五”。但在一个我称之为“逗号国家”（即 *5,75* 表示“五又百分之七十五”的国家）配置的计算机上，运行结果可能不同。如果你住在逗号国家，并且像图\
  \ 6-7 中那样输入 `5.75`，你很可能会收到一条错误消息（`InputMismatchException`）。如果是这样，请将文件中的数字金额改为符合你所在国家数字格式的写法。这样应该就没问题了。\n\
  \n### 虽为方法，却有其疯狂之处\n\n注意清单 6-2 中对 `nextDouble` 方法的调用。在第 5 章 的清单 5-1 中，我使用了 `nextLine`；但在这里的清单\
  \ 6-2 中，我使用了 `nextDouble`。\n\n在 Java 中，每种输入类型都需要其特定的方法。如果你要获取一行文本，那么 `nextLine`\
  \ 就很好用。但如果你从键盘读取内容，并且希望这些内容被解释为数字，那么你需要像 `nextDouble` 这样的方法。\n\n从清单 6-1 到清单 6-2，我添加了一个\
  \ `import` 声明和一些关于 `new Scanner(System.in)` 的内容。你可以通过阅读第 5 章 中的“获取数字、单词和其他内容”一节来了解更多关于这些内容的信息。（你还可以通过访问第\
  \ 13 章 了解更多关于输入输出的内容。）更多示例（更多 `keyboard.next`*`Something`* 方法）在第 7 章 和第 8 章 中。\n\
  \n### 方法与赋值\n\n注意我在清单 6-2 中如何使用 `keyboard.nextDouble`。对 `keyboard.nextDouble` 方法的调用是赋值语句的一部分。如果你查看第\
  \ 5 章 中关于 `EchoLine` 程序如何工作的部分，你会看到计算机可以用某个值替换方法调用。在清单 6-2 中，计算机就是这样做的。当你在键盘上输入\
  \ **5.75** 时，计算机将\n\n`amount = keyboard.nextDouble();`\n\n转换为\n\n`amount = 5.75;`\n\
  \n\n\n\n（计算机实际上并不会重写清单 6-2 中的代码。这里的`amount = 5.75`一行只是说明了计算机操作的效果。）在清单 6-2 的第二个赋值语句中，计算机将\
  \ 25.00 加到存储在`amount`中的 5.75 上。\n\n某些方法调用具有这种替换效果，而其他方法（如`System.out.println`）则没有。要了解更多关于此主题的信息，请参阅第\
  \ 19 章。\n\n## 主题变奏\n\n在清单 6-1 中，需要两行代码来给`amount`变量赋予其第一个值：\n\n`double amount;`\n\
  \n`amount = 5.95;`\n\n你可以只用一行代码完成同样的操作：\n\n`double amount = 5.95;`\n\n当你这样做时，你不会说是在“赋值”给`amount`变量。`double\
  \ amount=5.95`这一行并不被称为“赋值语句”。相反，这一行被称为带有*初始化*的声明。你是在*初始化*`amount`变量。你可以用初始化做各种事情，甚至包括算术运算：\n\
  \n`double gasBill = 174.59;`\n\n`double elecBill = 84.21;`\n\n`double H2OBill =\
  \ 22.88;`\n\n`double total = gasBill + elecBill + H2OBill;`\n\n### 将变量从一个地方移到另一个地方\n\
  \n记住初始化和赋值之间的区别很有帮助。首先，你可以将带有初始化的声明拖到方法外部：\n\n```\n//This is okay:\nclass SnitSoft\
  \ {\n    static double amount = 5.95;\n    public static void main(String args[])\
  \ {\n        amount = amount + 25.00;\n        System.out.print(\"We will bill $\"\
  );\n        System.out.print(amount);\n        System.out.println(\" to your credit\
  \ card.\");\n    }\n}\n```\n\n你不能对赋值语句做同样的事情（参见以下代码和图 6-8）：\n\n```\n//This does\
  \ not compile:\nclass BadSnitSoftCode {\n    static double amount;\n    amount =\
  \ 5.95; //Misplaced statement\n    public static void main(String args[]) {\n  \
  \      amount = amount + 25.00;\n        System.out.print(\"We will bill $\");\n\
  \        System.out.print(amount);\n        System.out.println(\" to your credit\
  \ card.\");\n    }\n}\n```\n\n![图片](img/Image00086.jpg)\n\n图 6-8： 编译`BadSnitSoftCode`的失败尝试。\n\
  \n你不能将语句拖到方法外部。（尽管变量声明以分号结尾，但变量声明不被视为语句。真是奇怪！）\n\n将声明放在方法外部的优势在第 17 章中有所说明。在你焦急地等待读到那一章时，请注意我是如何将我从`main`方法中提取的每个声明都加上了`static`这个词。我这样做是因为`main`方法的头部包含了`static`这个词。并非所有方法都是静态的。事实上，大多数方法都不是静态的。但每当你从一个`static`方法中提取声明时，你必须在声明的开头加上`static`这个词。关于`static`这个词的所有谜团将在第\
  \ 18 章中解开。\n\n### 合并变量声明\n\n清单 6-1 中的代码只有一个变量（好像变量供应不足似的）。你可以用多个变量达到同样的效果：\n\n```\n\
  class SnitSoftNew {\n    public static void main(String args[]) {\n        double\
  \ flashDrivePrice;\n        double shippingAndHandling;\n        double total;\n\
  \        flashDrivePrice = 5.95;\n        shippingAndHandling = 25.00;\n       \
  \ total = flashDrivePrice + shippingAndHandling;\n        System.out.print(\"We\
  \ will bill $\");\n        System.out.print(total);\n        System.out.println(\"\
  \ to your credit card.\");\n    }\n}\n```\n\n这段新代码产生的输出与清单 6-1 中的代码相同。（参见图 6-1。）\n\
  \n新代码有三个声明——分别对应程序的三个变量。因为所有三个变量具有相同的类型（`double`类型），我可以修改代码，一举声明所有三个变量：\n\n`double\
  \ flashDrivePrice, shippingAndHandling, total;`\n\n哪个更好——一个声明还是三个声明？没有哪个更好。这属于个人风格问题。\n\
  \n你甚至可以在合并声明中添加初始化。当你这样做时，每个初始化只适用于一个变量。例如，对于这一行：\n\n`double flashDrivePrice, shippingAndHandling\
  \ = 25.00, total;`\n\n`shippingAndHandling`的值变为`25.00`，但变量`flashDrivePrice`和`total`没有获得特定值。\n\
  \n![动手实践](img/Image00006.jpg) 想练习一下本节的概念吗？没问题！\n\n#### 给停车服务员小费\n\n一个在线博客建议，当停车服务员在纽约市的车库中取回你的车时，给\
  \ 2 美元小费。编写一个类似于清单 6-2 的程序。程序运行时，你输入车库公布的停车价格。程序会告诉你加上 2 美元小费后需要支付多少钱。\n\n#### 双倍价格\n\
  \n修改清单 6-2 中的代码，使得无论 U 盘正常售价是多少，程序都收取两倍的价格。换句话说，一个 5 美元的 U 盘最终价格为 10 美元，一个 100 美元的\
  \ U 盘变为 200 美元。\n\n## 使用 JShell 进行实验\n\n本书中的程序都以同样老套的开场白开始：\n\n```\nclass SomethingOrOther\
  \ {\n    public static void main(String args[]) {\n```\n\n在 Eclipse 编辑器中重新输入这些样板代码可能会很烦人，尤其是当你的目标是测试执行几个简单语句的效果时。为了解决这个问题，Java\
  \ 的管理者在 Java 9 中引入了一个新工具。他们称之为 JShell。\n\n当你使用 JShell 时，你几乎不需要输入整个程序。相反，你输入一条 Java\
  \ 语句，然后 JShell 对你的语句做出响应，然后你输入第二条语句，JShell 再响应，然后你输入第三条语句，依此类推。单条语句就足以让 JShell 做出响应。\n\
  \nJShell 只是语言*读取-求值-打印循环*（REPL）的一个例子。许多编程语言都有 REPL，而随着 Java 9 的推出，Java 语言终于有了自己的\
  \ REPL。\n\n### 启动 JShell 程序\n\n要运行 JShell，请确保你的计算机上安装了 Java 9（或更高版本的 Java，如果可用的话）。\n\
  \n#### 在 Windows 计算机上启动 JShell\n\n1. **打开命令提示符窗口。**\n\n   *在 Windows 7 中：* 按 Win+R，然后输入**cmd**，再按\
  \ Enter。\n\n   *在 Windows 8 中：* 在开始屏幕上，按 Win+Q。在出现的搜索字段中，输入**command prompt**，然后按\
  \ Enter。\n\n   *在 Windows 10 中：* 选择“开始” ⇒ “Windows 系统” ⇒ “命令提示符”。\n\n2. **在命令提示符窗口中，输入以下命令：**\n\
  \n   `cd \"\\Program Files\\Java\"`\n\n   `dir jdk*`\n\n   ![提示](img/Image00003.jpg)\
  \ 在某些计算机上，你可能更适合将第一个命令输入为`cd \"\\Program Files (x86)\\Java\"`。哪个有效就用哪个！\n\n   命令提示符窗口会列出一些目录名称作为响应。\n\
  \n3. **在命令提示符窗口的响应中，查找名为** `jdk-9` **或类似名称的目录。**\n\n   名称以`jdk1.8`或更低版本开头的目录无法使用。你必须安装\
  \ Java 9 或更高版本才能运行 JShell。\n\n   在下一步中，我假设你已经找到了名为`jdk-9`的目录。如果你的目录名称不同，请调整你的输入以匹配该名称。\n\
  \n4. **在命令提示符窗口中，输入以下命令：**\n\n   `cd jdk-9\\bin`\n\n   `jshell`\n\n   如果一切顺利，命令提示符窗口会显示`JShell>`提示符。这样你就知道已经成功启动了\
  \ JShell。\n\n#### 在 Mac 上启动 JShell\n\n1. **按 Command+空格键，然后输入**Terminal**，再按 Enter。**\n\
  \n\n\n\n因此，你的电脑终端应用程序开始运行。\n\n2.  **在终端应用程序窗口中，输入以下命令：**\n\n    `cd /Library/Java/JavaVirtualMachines`\n\
  \n    `dir jdk*`\n\n    终端应用程序会响应，列出一些目录名称。\n\n3.  **在终端应用程序的响应中，查找名为** `jdk-9.jdk`\
  \ **或类似名称的目录。**\n\n    名称以 `jdk1.8` 或更低版本开头的目录无法使用。你必须安装 Java 9 或更高版本才能运行 JShell。\n\
  \n    在下一步中，我假设你已经找到了名为 `jdk-9.jdk` 的目录。如果你的目录名称不同，请调整你的输入以匹配该名称。\n\n4.  **在终端应用程序窗口中，输入以下命令：**\n\
  \n    `cd jdk-9.jdk/Contents/Home/bin`\n\n    `./jshell`\n\n    如果一切顺利，终端应用程序会显示\
  \ `JShell>` 提示符。这样你就知道已经成功启动了 JShell。\n\n### 使用 JShell\n\n在图 6-9 中，我使用 JShell 来试验本章的\
  \ Java 概念。\n\n![image](img/Image00087.jpg)\n\n图 6-9： 我与 JShell 之间的亲密对话。\n\n当你运行\
  \ JShell 时，对话大致如下：\n\n`jshell> 你输入一条语句`\n\n`JShell 响应`\n\n`jshell> 你输入另一条语句`\n\n\
  `JShell 响应`\n\n例如，在图 6-9 中，我输入 `double amount` 然后按回车。JShell 响应显示：\n\n`amount ==>\
  \ 0.0`\n\n然后我输入 `amount = 5.95`，JShell 响应：\n\n`amount ==> 5.95`\n\n接着，当我输入 `amount\
  \ = amount + 25.00` 时，JShell 友好地返回：\n\n`amount ==> 30.95`\n\n以下是关于 JShell 的一些注意事项：\n\
  \n*   **你无需输入完整的 Java 程序。**\n\n    输入几条语句，例如：\n\n    `double amount`\n\n    `amount\
  \ = 5.95`\n\n    `amount = amount + 25.00`\n\n    就能达到目的。这就像运行清单 4-1 中的代码片段（只不过清单\
  \ 4-1 没有将 `amountInAccount` 声明为 `double` 类型）。\n\n*   **在 JShell 中，分号（在一定程度上）是可选的。**\n\
  \n    在图 6-9 中，我没有在每行末尾添加分号。\n\n*   **JShell 在你输入每一行后立即响应。**\n\n    在我将 `amount`\
  \ 声明为 `double` 后，JShell 响应告诉我 `amount` 变量的值为 `0.0`。在我输入 `amount = amount + 25.00`\
  \ 后，JShell 告诉我 `amount` 的新值为 `30.95`。\n\n图 6-10 展示了 JShell 的更多优秀特性。\n\n*   **你可以向\
  \ JShell 询问表达式的值。**\n\n    你无需将表达式的值赋给变量。例如，在图 6-10 中，我输入：\n\n    `gasBill + elecBill`\n\
  \n    JShell 响应告诉我 `gasBill + elecBill` 的值为 `258.8`。JShell 会为该值创建一个临时名称。在图 6-10\
  \ 中，这个名称恰好是 `$3`。\n\n*   **你甚至可以在不使用变量的情况下从 JShell 获得答案。**\n\n    在图 6-10 中，我询问\
  \ `42 + 7` 的值，JShell 慷慨地回答值为 `49`。JShell 为该值 `49` 创建了临时名称 `$4`。因此，在图 6-10 的下一行，我询问\
  \ `$4 + 1` 的值，JShell 给出了答案 `50`。\n\n![image](img/Image00088.gif)\n\n图 6-10： 使用 JShell\
  \ 计算表达式。\n\n![tip](img/Image00003.jpg) 在运行 JShell 时，你无需重新输入已经输入过的命令。如果你按一次上箭头键，JShell\
  \ 会显示你最近输入的命令。如果你按两次上箭头键，JShell 会显示你倒数第二次输入的命令，依此类推。当 JShell 显示一个命令时，你可以使用左箭头和右箭头键移动到命令中的任意字符位置。你可以修改命令中的字符。最后，当你按回车键时，JShell\
  \ 会执行你新修改的命令。\n\n要结束 JShell 的运行，你可以输入 `/exit`（以斜杠开头）。但 `/exit` 只是你可以向 JShell 发出的众多命令之一。要询问\
  \ JShell 还可以使用哪些其他命令，请键入 `/help`。\n\n借助 JShell，你可以在将语句放入完整的 Java 程序之前对其进行测试。这使得\
  \ JShell 成为一个真正有用的工具。\n\n#### JShell 趣味练习\n\n![tryitout](img/Image00006.jpg) 在你的电脑上启动\
  \ JShell 应用程序。在 JShell 应用程序中依次输入以下语句，并观察 JShell 的响应：\n\n`jshell> double bananaCalories\
  \ = 100.0`\n\n`jshell> double appleCalories = 95.0`\n\n`jshell> double dietSodaCalories\
  \ = 0.0`\n\n`jshell> double cheeseburgerCalories = 500.0`\n\n`jshell> bananaCalories\
  \ + appleCalories +`\n\n`…> dietSodaCalories + cheeseburgerCalories`\n\n注意，在 JShell\
  \ 中，一条语句可以跨越多行。在输入语句的第一部分后：\n\n`bananaCalories + appleCalories +`\n\n按回车键。然后，在下一行，JShell\
  \ 不会显示通常的 `jshell>` 提示符，而是显示 `…>`，这表示你应该继续输入该语句的更多内容。\n\n保持 JShell 运行，为下一个实验做准备。\n\
  \n#### 在 JShell 中移动\n\n在上一个实验中，你输入了四种食物的卡路里数值。但完成该实验后，你修改了对一个芝士汉堡卡路里数的估计。\n\n在 JShell\
  \ 仍在运行时，按键盘上的上箭头键，直到看到以下语句：\n\n`double cheeseburgerCalories = 500.0`\n\n然后按左箭头键，直到光标位于数字\
  \ `5` 旁边。按键盘上的退格键或删除键去掉数字 `5`，然后在该位置输入数字 `7`。现在语句变为：\n\n`double cheeseburgerCalories\
  \ = 700.0`\n\n按回车键确认你希望 JShell 执行修改后的语句。\n\n将 `cheeseburgerCalories` 的值改为 `700.0`\
  \ 后，使用键盘的上箭头和下箭头让 JShell 再次计算卡路里总和：\n\n`jshell> bananaCalories + appleCalories +`\n\
  \n`…> dietSodaCalories + cheeseburgerCalories`\n\n不要重新输入变量名。让箭头键为你完成工作！\n\n第 7 章\n\
  \n## 数字与类型\n\n本章内容\n\n![check](img/Image00002.jpg) **处理整数**\n\n![check](img/Image00002.jpg)\
  \ **从旧值创建新值**\n\n![check](img/Image00002.jpg) **理解 Java 中更奇特的类型**\n\n不久以前，人们认为计算机除了进行大量数字运算外，什么也做不了。计算机解决算术问题，故事到此为止。\n\
  \n20 世纪 80 年代，随着文字处理程序的广泛使用，关于“大型金属数学大脑”的神话逐渐消失。但即便如此，计算机仍然是出色的计算器。毕竟，计算机速度极快且非常精确。计算机从不需要用手指计数。最重要的是，计算机在做算术时不会感到负担。我讨厌在一家好餐厅用餐结束时还要担心税费和小费，但计算机完全不在乎这些。（即便如此，计算机也很少外出就餐。）\n\
  \n## 使用整数\n\n让我告诉你，当成年人一点也不好玩。现在我的客厅里有四个小孩。他们都盯着我，因为我手里拿着一袋口香糖。袋子里有 30 颗口香糖，孩子们都在想：“谁最棒？谁得到的口香糖比其他人多？谁会受到不公平的对待？”他们坚持要进行一次完整、正式的口香糖分配，每个孩子得到完全相同数量的美味小零食。我必须小心。如果不这样做，这件事就会没完没了。\n\
  \n\n\n有 30 颗弹珠糖和四个孩子，没办法平均分配这些弹珠糖。当然，如果我少一个孩子，就能给每个孩子 10 颗。问题是，弹珠糖可以扔掉，孩子不行。所以我唯一的选择就是尽可能平分，然后把剩下的处理掉。“好吧，快想想，”我对自己说。“30\
  \ 颗弹珠糖和 4 个孩子，我能保证每个孩子得到多少颗？”\n\n我立刻用电脑编程来解决这个问题。完成后，我得到了清单 7-1 中的代码。\n\n清单 7-1\
  \ 如何让四个孩子不闹脾气\n\n```\nclass KeepingKidsQuiet {\npublic static void main(String args[])\
  \ {\nint gumballs;\nint kids;\nint gumballsPerKid;\ngumballs = 30;\nkids = 4;\n\
  gumballsPerKid = gumballs / kids;\nSystem.out.print(\"Each kid gets \");\nSystem.out.print(gumballsPerKid);\n\
  System.out.println(\" gumballs.\");\n}\n}\n```\n\n图 7-1 展示了`KeepingKidsQuiet`程序的运行结果。如果每个孩子得到七颗弹珠糖，那他们就不能抱怨我偏心。他们得找别的事来争吵了。\n\
  \n![image](img/Image00089.gif)\n\n图 7-1: 公平公正。\n\n弹珠糖问题的核心在于，我处理的是整数——小数点后没有数字的数。当我用\
  \ 30 除以 4 时，得到 7½，但我不能把½当真。无论我怎么努力，都没法把一颗弹珠糖分成两半，至少免不了听到“我的一半比他的大”。这一点在 Java 中得到了很好的体现。在清单\
  \ 7-1 中，三个变量（`gumballs`、`kids`和`gumballsPerKid`）都是`int`类型。`int`值是整数。当你用一个`int`值除以另一个（就像清单\
  \ 7-1 中用斜杠那样），得到的是另一个`int`。当你用 30 除以 4 时，得到的是 7——而不是 7½。你在图 7-1 中可以看到这一点。综合起来，语句\n\
  \n`gumballsPerKid = gumballs/kids;`\n\n`System.out.print(gumballsPerKid);`\n\n会在电脑屏幕上显示数字\
  \ 7。\n\n### 从键盘读取整数\n\n这日子过得！昨天我家客厅里有四个孩子，我有 30 颗弹珠糖。今天我家有六个孩子，我有 80 颗弹珠糖。我该怎么应对这些变化？我知道了！我要写一个程序，从键盘读取弹珠糖和孩子的数量。程序见清单\
  \ 7-2，运行结果如图 7-2 所示。\n\n![image](img/Image00090.gif)\n\n图 7-2: 接下来，我可能会有 70 个孩子和\
  \ 1000 颗弹珠糖。\n\n清单 7-2 一个更通用的孩子与弹珠糖程序\n\n```\nimport java.util.Scanner;\n\nclass\
  \ KeepingMoreKidsQuiet {\npublic static void main(String args[]) {\nScanner keyboard\
  \ = new Scanner(System.in);\nint gumballs;\nint kids;\nint gumballsPerKid;\nSystem.out.print(\"\
  How many gumballs? How many kids? \");\ngumballs = keyboard.nextInt();\nkids = keyboard.nextInt();\n\
  gumballsPerKid = gumballs / kids;\nSystem.out.print(\"Each kid gets \");\nSystem.out.print(gumballsPerKid);\n\
  System.out.println(\" gumballs.\");\nkeyboard.close();\n}\n}\n```\n\n关于清单 7-2，有几点需要注意。首先，你可以用`nextInt`方法读取一个`int`值。（参考第\
  \ 5 章中的表格。）其次，你可以连续调用`Scanner`方法。在清单 7-2 中，我调用了两次`nextInt`。我只需要用空格分隔输入的数字。在图 7-2\
  \ 中，我在`80`和`6`之间放了一个空格，但更多空格也可以。\n\n这个空格规则适用于许多`Scanner`方法。例如，下面这段代码读取三个数值：\n\n\
  `gumballs = keyboard.nextInt();`\n\n`costOfGumballs = keyboard.nextDouble();`\n\n\
  `kids = keyboard.nextInt();`\n\n图 7-3 展示了这三个方法调用的有效输入。\n\n![image](img/Image00091.gif)\n\
  \n图 7-3: 三个`Scanner`方法调用的三个数字。\n\n### 所见即所得\n\n在编写自己的代码时，永远不要想当然。假设你不小心颠倒了清单 7-2\
  \ 中`gumballs`和`kids`赋值语句的顺序：\n\n```\n//This code is misleading:\nSystem.out.print(\"\
  How many gumballs? How many kids? \");\nkids = keyboard.nextInt();\ngumballs = keyboard.nextInt();\n\
  ```\n\n这里，`How many gumballs? How many kids?`这行具有误导性。因为`kids`赋值语句在`gumballs`赋值语句之前，所以你输入的第一个数字会成为`kids`的值，第二个数字会成为`gumballs`的值。程序显示的消息`How\
  \ many gumballs? How many kids?`并不重要。重要的是程序中赋值语句的顺序。\n\n如果`kids`赋值语句意外地排在了前面，你可能会得到一个奇怪的答案，比如图\
  \ 7-4 中的零。这就是`int`除法的运作方式。它只是截断余数。用一个小数（比如 6）除以一个大数（比如 80），结果就是 0。\n\n![image](img/Image00092.gif)\n\
  \n图 7-4: 如何让六个孩子非常不开心。\n\n![tryitout](img/Image00006.jpg) 就像老恐怖片里的疯狂科学家一样，试试这些有趣的实验吧！\n\
  \n#### 动手又动脑\n\n运行清单 7-2 中的程序。当程序询问`How many gumballs? How many kids?`时，输入 **80.5\
  \ 6**。（实际上，如果你所在的国家用 80,5 表示八十点五，则输入 80,5 而不是 80.5。）\n\n在这次运行中，你看到了什么不愉快的消息？为什么你会看到这条消息？\n\
  \n#### 再试一次\n\n运行清单 7-2 中的程序。当程序询问`How many gumballs? How many kids?`时，输入 **\"80\"\
  \ \"6\"** （包括引号）。\n\n在这次运行中，你看到了什么不愉快的消息？为什么你会看到这条消息？\n\n#### 一个微型加法器\n\n编写一个程序，从键盘获取两个数字，并显示这两个数字的和。\n\
  \n## 通过应用运算符创建新值\n\n还有什么比你的老朋友加号更让人安心的呢？这是你在小学数学中学到的第一件事。几乎每个人都知道如何计算二加二。事实上，在英语用法中，“二加二”是简单易行之事的代名词。每当你看到加号，你的一个脑细胞就会说：“谢天谢地，它可能复杂得多。”\n\
  \n所以 Java 也有加号。你可以用加号将两个数字相加：\n\n`int apples, oranges, fruit;`\n\n`apples = 5;`\n\
  \n`oranges = 16;`\n\n`fruit = apples + oranges;`\n\n当然，减号也是可用的：\n\n`apples = fruit\
  \ - oranges;`\n\n用星号表示乘法，用斜杠表示除法：\n\n`double rate, pay, withholding;`\n\n`int hours;`\n\
  \n`rate = 6.25;`\n\n`hours = 35;`\n\n`pay = rate * hours;`\n\n`withholding = pay\
  \ / 3.0;`\n\n\n\n\n\n![提示](img/Image00003.jpg) 当你用一个 `int` 值除以另一个 `int` 值时，得到的结果是\
  \ `int` 值。计算机不会进行四舍五入，而是直接截断余数。如果你在程序中写入 `System.out.println(11 / 4)`，计算机会打印 `2`，而不是\
  \ `2.75`。如果你需要小数结果，请将你要除的两个数（或其中一个）设为 `double` 类型。例如，如果你在程序中写入 `System.out.println(11.0\
  \ / 4)`，计算机会用 `double` 值 `11.0` 除以 `int` 值 `4`。由于两个值中至少有一个是 `double`，计算机会打印 `2.75`。\n\
  \n### 求余数\n\n有一个很有用的算术运算符叫做取余运算符。取余运算符的符号是百分号（`%`）。当你在程序中写入 `System.out.println(11\
  \ % 4)` 时，计算机会打印 `3`。这是因为 4 进入 11 的次数不重要，余数为 3。\n\n![技术细节](img/Image00007.jpg) 取余运算符的另一个名称是模运算符。\n\
  \n取余运算符实际上相当有用。毕竟，余数就是两个数相除后剩下的部分。如果你要兑换 1.38 美元的零钱呢？将 138 除以 25 后，你剩下 13 美分，如图\
  \ 7-5 所示。\n\n![图片](img/Image00093.jpg)\n\n图 7-5： 嘿，伙计！能换 138 根棍子的零钱吗？\n\n清单 7-3\
  \ 中的代码运用了这种取余思想。\n\n清单 7-3 兑换零钱\n\n```\nimport java.util.Scanner;\n\nclass MakeChange\
  \ {\npublic static void main(String args[]) {\nScanner keyboard = new Scanner(System.in);\n\
  \nint quarters, dimes, nickels, cents;\nint whatsLeft, total;\n\nSystem.out.print(\"\
  How many cents do you have? \");\ntotal = keyboard.nextInt();\n\nquarters = total\
  \ / 25;\nwhatsLeft = total % 25;\n\ndimes = whatsLeft / 10;\nwhatsLeft = whatsLeft\
  \ % 10;\n\nnickels = whatsLeft / 5;\nwhatsLeft = whatsLeft % 5;\n\ncents = whatsLeft;\n\
  \nSystem.out.println();\nSystem.out.println(\"From \" + total + \" cents you get\"\
  );\nSystem.out.println(quarters + \" quarters\");\nSystem.out.println(dimes + \"\
  \ dimes\");\nSystem.out.println(nickels + \" nickels\");\nSystem.out.println(cents\
  \ + \" cents\");\n\nkeyboard.close();\n}\n}\n```\n\n清单 7-3 中代码的一次运行结果如图 7-6 所示。你从\
  \ `total` 为 138 美分开始。语句\n\n`quarters = total / 25;`\n\n将 138 除以 25，得到 5。这意味着你可以从\
  \ 138 美分中兑换 5 个 25 美分硬币。接下来，语句\n\n`whatsLeft = total % 25;`\n\n再次将 138 除以 25，只将余数\
  \ 13 存入 `whatsLeft`。现在你准备好下一步，即从 13 美分中尽可能多地取出 10 美分硬币。\n\n![图片](img/Image00094.gif)\n\
  \n图 7-6： 1.38 美元的零钱。\n\n你继续这样操作，直到所有 5 美分硬币都被分完。此时，`whatsLeft` 的值就是 3（表示 3 美分）。\n\
  \n![技术细节](img/Image00007.jpg) 清单 7-3 中的代码使用以下硬币面额进行美元零钱兑换：1 美分、5 美分（一个镍币）、10 美分（一个角币）和\
  \ 25 美分（一个 quarter）。使用这些面额，`MakeChange` 程序提供的不仅仅是一组加起来等于 138 美分的硬币。`MakeChange`\
  \ 类给出的是加起来等于 138 美分的 *最少硬币数量*。稍作调整，你就可以让这段代码适用于任何国家的货币体系。你总是可以得到一组加起来等于总数的硬币。但对于某些国家的硬币面额，你并不总能得到加起来等于总数的\
  \ *最少硬币数量*。事实上，我正在寻找例子。如果你所在国家的硬币面额导致 `MakeChange` 无法总是给出最佳答案，请给我发邮件（`BeginProg@allmycode.com`），在推特上\
  \ @[`@allmycode`](http://www.twitter.com/allmycode)，或者在 Facebook 上发布到 [`/allmycode`](http://www.facebook.com/allmycode)。谢谢。\n\
  \n![警告](img/Image00004.jpg) 当两个或多个变量具有相似类型时，你可以使用组合声明来创建变量。例如，清单 7-3 中有两个组合声明——一个用于变量\
  \ `quarters`、`dimes`、`nickels` 和 `cents`（均为 `int` 类型）；另一个用于变量 `whatsLeft` 和 `total`（均为\
  \ `int` 类型）。但要创建不同类型的变量，你需要单独的声明。例如，要创建一个名为 `total` 的 `int` 变量和一个名为 `amount` 的 `double`\
  \ 变量，你需要一个声明 `int total;` 和另一个声明 `double amount;`。\n\n![提示](img/Image00003.jpg)\
  \ 清单 7-3 中有一个 `System.out.println()` 调用，括号内没有内容。当计算机执行这条语句时，光标会跳到屏幕上的新一行。（我经常用这条语句在程序输出中插入一个空行。）\n\
  \n#### JAVA 算术运算\n\n![试试看](img/Image00006.jpg) 以下每个表达式的值是多少？在 JShell 中每行输入一个表达式，看看你的答案是否正确：\n\
  \n```\n10 / 3\n10 % 3\n3 / 10\n3 % 10\n8 * 3 + 4\n4 + 8 * 3\n8 * (3 + 4)\n34 % 5\
  \ - 2 * 2 + 21 / 5\n```\n\n#### 变量值\n\n以下每个变量（`a`、`b`、`c` 等）的值是多少？在 JShell 中每行输入一条语句，看看你的答案是否正确：\n\
  \n```\nint a = 8\nint b = 3\nint c = b / a\nint d = a / b\nint e = a % b\nint f\
  \ = 5 + e * d - 2\n```\n\n#### 雇佣水管工\n\n当地一位水管工上门收费 75 美元。此外，水管工在我家每工作一小时，额外收费 125\
  \ 美元。编写一个程序，输入水管工在我家工作的小时数，并输出水管工收取的总费用。\n\n#### 再次兑换零钱\n\n修改清单 7-3 中的代码，使其从键盘获取一个美元数和一个美分数。例如，用户不再输入\
  \ 138（表示 138 美分），而是输入 1 38（1 美元 38 美分）。\n\n#### 我有多高？\n\n在我的家乡，我们不使用公制单位。相反，我们用英尺和英寸来测量每个人的身高。1\
  \ 英尺等于 12 英寸，我的身高是 5.5 英尺。（我的身高以英尺为单位是 `double` 值 5.5。）编写一个程序，计算我的身高（以英寸为单位）。（即从\
  \ 5.5 英尺计算出 66 英寸。）\n\n修改程序，使其询问用户的身高（以英尺为单位），然后报告该人的身高（以英寸为单位）。\n\n修改程序，使其询问用户的身高（以英尺和英寸为单位）。例如，一个身高\
  \ 5.5 英尺的人输入数字 5（表示 5 英尺），然后输入数字 6（表示额外的 6 英寸）。程序报告该人的身高（以英寸为单位）。\n\n#### 有多少个纪念日？\n\
  \n我和妻子是在 2 月 29 日结婚的，所以我们每四年才有一个纪念日。编写一个程序，其中包含一个名为 `years` 的变量。根据 `years` 变量的值，程序显示我们拥有的纪念日数量。例如，如果\
  \ `years` 的值是 `4`，程序显示句子 `Number of anniversaries: 1`。如果 `years` 的值是 `7`，程序仍然显示\
  \ `Number of anniversaries: 1`。但如果 `years` 的值是 `8`，程序显示 `Number of anniversaries:\
  \ 2`。\n\n### 自增和自减运算符\n\n\n\n\nJava 有一些简洁的小操作符，能让生活更轻松（对计算机处理器、你的大脑以及你的手指都是如此）。总共有四个这样的操作符——两个递增操作符和两个递减操作符。递增操作符加一，递减操作符减一。要了解它们的工作原理，你需要一些示例。\n\
  \n#### 使用前递增\n\n第一个示例见图 7-7。\n\n![image](img/Image00097.gif)\n\n图 7-7： 使用前递增。\n\n\
  图 7-7 中程序的运行结果如图 7-8 所示。在这个平淡无奇的运行中，口香糖球的数量被显示了三次。\n\n![image](img/Image00098.gif)\n\
  \n图 7-8： 前递增代码的运行结果（图 7-7 中的代码）。\n\n双加号根据放置位置的不同有两个名称。当你把 `++` 放在变量前面时，`++` 被称为\
  \ `前递增` 操作符。在单词 `preincrement` 中，`pre` 表示 *之前*。在这种语境下，*之前* 有两个不同的含义：\n\n*   你把 `++`\
  \ 放在变量 *之前*。\n*   计算机在变量用于语句中任何其他部分 *之前*，先将变量的值加 1。\n\n图 7-9 展示了前递增操作符的慢动作回放。在图\
  \ 7-9 中，计算机遇到 `System.out.println(++gumballs)` 语句。首先，计算机将 `gumballs` 加 1（将 `gumballs`\
  \ 的值提升到 `29`）。然后，计算机执行 `System.out.println`，使用 `gumballs` 的新值（`29`）。\n\n![image](img/Image00099.jpg)\n\
  \n图 7-9： 前递增操作符在行动。\n\n#### 使用后递增\n\n前递增的替代方案是 `后递增`。在后递增中，`post` 表示 *之后*。*之后* 有两个不同的含义：\n\
  \n*   你把 `++` 放在变量 *之后*。\n*   计算机在变量用于语句中任何其他部分 *之后*，再将变量的值加 1。\n\n图 7-10 展示了后递增操作符的特写。在图\
  \ 7-10 中，计算机遇到 `System.out.println(gumballs++)` 语句。首先，计算机执行 `System.out.println`，使用\
  \ `gumballs` 的旧值（`28`）。然后，计算机将 `gumballs` 加 1（将 `gumballs` 的值提升到 `29`）。\n\n![image](img/Image00100.jpg)\n\
  \n图 7-10： 后递增操作符在行动。\n\n看看图 7-11 中加粗的代码行。计算机在屏幕上打印 `gumballs` 的旧值（`28`）。只有在打印完这个旧值之后，计算机才将\
  \ `gumballs` 加 1（将 `gumballs` 的值从 `28` 提升到 `29`）。\n\n![image](img/Image00101.gif)\n\
  \n图 7-11： 使用后递增。\n\n![remember](img/Image00005.jpg) 对于 `System.out.println(gumballs++)`，计算机在打印\
  \ `gumballs` 已有的旧值 *之后*，才将 `gumballs` 加 1。\n\n图 7-11 中代码的运行结果如图 7-12 所示。将图 7-12\
  \ 与图 7-8 中的运行结果进行比较。\n\n*   在图 7-8 的前递增中，显示的第二个数字是 `29`。\n*   在图 7-12 的后递增中，显示的第二个数字是\
  \ `28`。\n\n    在图 7-12 中，数字 `29` 直到运行结束时才出现在屏幕上，此时计算机执行了最后一条 `System.out.println(gumballs)`。\n\
  \n![image](img/Image00102.gif)\n\n图 7-12： 后递增代码的运行结果（图 7-11 中的代码）。\n\n![tip](img/Image00003.jpg)\
  \ 你是否在纠结该用前递增还是后递增？别再犹豫了。大多数程序员使用后递增。在典型的 Java 程序中，你经常看到像 `gumballs++` 这样的写法。你很少看到像\
  \ `++gumballs` 这样的写法。\n\n除了前递增和后递增，Java 还有两个使用 `--` 的操作符。这些操作符被称为 `前递减` 和 `后递减`：\n\
  \n*   对于前递减（`--gumballs`），计算机在变量用于语句其余部分 *之前*，先将变量的值减 1。\n*   对于后递减（`gumballs--`），计算机在变量用于语句其余部分\
  \ *之后*，再将变量的值减 1。\n\n#### 使用 JShell 探索前递增和后递增\n\n![tryitout](img/Image00006.jpg)\
  \ 在 JShell 中逐行输入粗体文本，观察 JShell 的响应：\n\n```\njshell> int i = 8\njshell> i++\njshell>\
  \ i\njshell> i\njshell> i++\njshell> i\njshell> ++i\njshell> i\n```\n\n#### 在 Java\
  \ 程序中探索前递增和后递增\n\n在运行以下代码之前，尝试预测代码的输出。然后运行代码，看看你的预测是否正确：\n\n```\npublic class Main\
  \ {\npublic static void main(String[] args) {\nint i = 10;\nSystem.out.println(i++);\n\
  System.out.println(--i);\n--i;\ni--;\nSystem.out.println(i);\nSystem.out.println(++i);\n\
  System.out.println(i--);\nSystem.out.println(i);\n}\n}\n```\n\n### 赋值操作符\n\n如果你读过上一节——关于加\
  \ 1 操作符的那一节——你可能会想，能否操作这些操作符来加 2、加 5 或加 1000000？你能写出 `gumballs++++` 并仍然自称 Java 程序员吗？嗯，你不能。如果你尝试，Eclipse\
  \ 会给出错误信息：\n\n`Invalid argument to operation ++/--`\n\n如果你不使用 Eclipse，你可能会看到不同的错误信息：\n\
  \n`unexpected type`\n\n`required: variable`\n\n`found : value`\n\n`gumballs++++;`\n\
  \n`^`\n\n无论是否使用 Eclipse，底线是一样的：即你的代码包含错误，你必须修复它。\n\n如何加 1 以外的值？幸运的是，Java 有很多赋值操作符可供使用。使用\
  \ *赋值操作符*，你可以按任意数值进行加、减、乘、除。你还可以进行其他酷炫的操作。\n\n例如，你可以通过编写以下代码将 `kids` 变量加 1：\n\n\
  `kids += 1;`\n\n这比 `kids++` 或 `kids = kids + 1` 更好吗？不，并不更好。它只是一种替代方案。但你可以通过编写以下代码将\
  \ `kids` 变量加 5：\n\n`kids += 5;`\n\n你无法轻易地用前递增或后递增加 5。如果孩子们被困在邪恶科学家的克隆机器里呢？语句\n\n\
  `kids *= 2;`\n\n将 `kids` 的数量乘以 2。\n\n使用赋值操作符，你可以对变量进行任意数值的加、减、乘、除。该数值不必是字面量。你可以在等号右侧使用数值表达式：\n\
  \n```\ndouble amount = 5.95;\ndouble shippingAndHandling = 25.00, discount = 0.15;\n\
  amount += shippingAndHandling;\namount -= discount * 2;\n```\n\n上述代码将 25.00（`shippingAndHandling`）加到\
  \ `amount` 的值上。然后代码从 `amount` 的值中减去 0.30（`discount * 2`）。多么慷慨！\n\n![crossreference](img/Image00009.jpg)\
  \ 如果 `字面量` 这个词让你感到陌生，请参考第 4 章。\n\n#### 用赋值操作符做实验\n\n![tryitout](img/Image00006.jpg)\
  \ 在运行以下代码之前，尝试预测代码的输出。然后运行代码，看看你的预测是否正确：\n\n```\npublic class Main {\npublic static\
  \ void main(String[] args) {\nint i = 10;\ni += 2;\ni -= 5;\ni *= 6;\nSystem.out.println(i);\n\
  ```\n\n\n\n\n```\nSystem.out.println(i += 3);\n\nSystem.out.println(i /= 2);\n\n\
  }\n\n}\n```\n\n#### 再次进行更改\n\n除了我在本节中描述的赋值运算符之外，Java 还有一个 `%=` 运算符。`%=` 运算符对余数的操作类似于\
  \ `+=` 运算符对加法的操作。修改清单 7-3 中的代码，使其尽可能使用 `%=` 赋值运算符。\n\n## 大小很重要\n\n以下是今天的新词汇：\n\n\
  *   **foregift** (fore-gift) *n.* 承租人在租赁时向出租人支付的额外费用。\n\n*   **hereinbefore** (here-in-be-fore)\
  \ *adv.* 在本文件的先前部分。\n\n现在想象一下，你正在扫描一些压缩文本。在这些文本中，所有空格都被移除以节省存储空间。你遇到了以下字母序列：\n\n\
  > hereinbeforegiftedit\n\n问题是，这些字母是什么意思？如果你知道每个单词的长度，你就能回答这个问题：\n\n*   here in be\
  \ foregift edit\n\n*   hereinbefore gifted it\n\n*   herein before gift Ed it\n\n\
  计算机也面临同样的问题。当计算机在内存或磁盘中存储多个数字时，它不会在数字之间放置空格。所以想象一下，计算机内存的一小部分看起来像图 7-13 中的内容。（计算机只使用\
  \ 0 和 1，但图 7-13 使用了普通数字。使用普通数字更容易看出发生了什么。）\n\n![image](img/Image00104.jpg)\n\n图\
  \ 7-13： 存储数字 4221。\n\n图 7-13 中存储的是什么数字？是两个数字 42 和 21？还是一个数字 4,221？又或者是四个数字 4、2、2\
  \ 和 1？这完全取决于每个数字占用的空间大小。\n\n想象一个变量，它存储一个月中的发薪日数量。这个数字永远不会超过 31。你可以只用 8 个 0 和 1 来表示这个小数。但是，一个计算宇宙中星星数量的变量呢？这个数字可能轻易超过一万亿，而要精确表示\
  \ 1 万亿，你需要 64 个 0 和 1。\n\n此时，Java 挺身而出。Java 有四种整数类型。就像在清单 7-1 中一样，我声明\n\n`int` `gumballsPerKid;`\n\
  \n我也可以声明\n\n`byte` `paydaysInAMonth;`\n\n`short` `sickDaysDuringYourEmployment;`\n\
  \n`long` `numberOfStars;`\n\n这些类型（`byte`、`short`、`int` 和 `long`）各自有特定的取值范围。（参见表\
  \ 7-1。）\n\n| **类型名称** | **取值范围** |\n| --- | --- |\n| *整数类型* |  |\n| `byte` | –128\
  \ 到 127 |\n| `short` | –32768 到 32767 |\n| `int` | –2147483648 到 2147483647 |\n\
  | `long` | –9223372036854775808 到 9223372036854775807 |\n| *小数类型* |  |\n| `float`\
  \ | –3.4×10³⁸ 到 3.4×10³⁸ |\n| `double` | –1.8×10³⁰⁸ 到 1.8×10³⁰⁸ |\n\n表 7-1 Java\
  \ 的基本数值类型\n\nJava 有两种小数类型（小数点右边有数字的类型）。就像在清单 6-1（在第 6 章中）一样，我声明\n\n`double` `amount;`\n\
  \n我也可以声明\n\n`float` `monthlySalary;`\n\n在 `double` 和 `float` 之间选择时，我总是选择 `double`。`double`\
  \ 类型的变量具有更大的取值范围和更高的精度。（参见表 7-1。）\n\n表 7-1 列出了 Java 的六种*基本*类型（也称为*简单*类型）。Java 只有八种基本类型，因此表\
  \ 7-1 中只缺少了两种基本类型。\n\n第 8 章描述了剩下的两种基本类型。第 17 章介绍了非基本类型。\n\n作为初学者，你不必在表 7-1 中的类型之间做出选择。只需对整数使用\
  \ `int`，对小数使用 `double`。如果在学习过程中，你在别人的程序中看到类似 `short` 或 `float` 的内容，只需记住以下几点：\n\n\
  *   `byte`、`short`、`int` 和 `long` 类型表示整数。\n\n*   `float` 和 `double` 类型表示小数。\n\n\
  大多数情况下，你只需要知道这些。\n\n第 8 章\n\n## 数字？谁需要数字？\n\n本章内容\n\n![check](img/Image00002.jpg)\
  \ **处理字符**\n\n![check](img/Image00002.jpg) **处理“真”或“假”值**\n\n![check](img/Image00002.jpg)\
  \ **完善你对 Java 基本类型的了解**\n\n我不太喜欢传真机。它们太低效了。发送一份简短的传真，你会得到什么？你会得到两片树——一片在发送端，另一片在接收端。你还会得到数百万个点——这些点扫描打印页面上的微小线条。这些点区分亮区和暗区。真是浪费！\n\
  \n将传真与电子邮件进行比较。使用电子邮件，我可以用仅仅 2,500 个 0 和 1 发送一条 25 个字的参赛作品，而且不浪费任何纸张。最重要的是，电子邮件不描述亮点和暗点。电子邮件包含每个字母的代码——字母\
  \ *A* 对应一串短的 0 和 1，字母 *B* 对应另一串不同的 0 和 1，以此类推。还有什么比这更简单的呢？\n\n现在想象发送一个单词的传真。这个单词是\
  \ *true*，意思是“真的，我接受你写《Java 入门编程傻瓜书》第 5 版的提议。” 这份传真发送了四个字母 t-r-u-e 的图片，纸张上的污渍形成模糊的线条，墨粉不足的地方出现小白点。\n\
  \n但实际上，“true”消息的本质是什么？只有两种可能性，不是吗？消息可能是“true”或“false”，为了表示这些可能性，我不需要大张旗鼓。用 0 表示“false”，用\
  \ 1 表示“true”怎么样？\n\n*   他们问：“你接受我们写《Java 入门编程傻瓜书》第 5 版的提议吗？”\n\n   “1，”我回答。\n\n\
  可惜我几个月前没想到这一点。无论如何，本章讨论字母、真、假以及其他类似的东西。\n\n## 字符\n\n在第 6 章和第 7 章中，你在所有变量中存储数字。这很好，但生活中除了数字还有更多内容。例如，我用计算机写了这本书，这本书包含了成千上万个非数字的东西，称为*字符*。\n\
  \nJava 中用于存储字符的类型是 `char`。清单 8-1 是一个使用 `char` 类型的简单程序，清单 8-1 程序的运行结果如图 8-1 所示。\n\
  \n![image](img/Image00105.gif)\n\n图 8-1： 令人兴奋的程序输出！\n\n清单 8-1 使用 char 类型\n\n```\n\
  class LowerToUpper {\npublic static void main(String args[]) {\nchar smallLetter,\
  \ bigLetter;\nsmallLetter = ’b’;\nbigLetter = Character.toUpperCase(smallLetter);\n\
  System.out.println(bigLetter);\n}\n}\n```\n\n在清单 8-1 中，第一个赋值语句将字母 `b` 存储在 `smallLetter`\
  \ 变量中。在该语句中，注意 `b` 被单引号（`’ ’`）包围。在 Java 程序中，每个 `char` 字面量都以单引号开头和结尾。\n\n\n\n\n![technicalstuff](img/Image00007.jpg)\
  \ 当你用引号将字母括起来时，就告诉计算机这个字母不是变量名。例如，在清单 8-1 中，错误的语句 `smallLetter = b` 会告诉计算机查找名为 `b`\
  \ 的变量。由于不存在名为 `b` 的变量，你会收到一条 `b cannot be resolved to a variable` 的消息。\n\n在清单 8-1\
  \ 的第二个赋值语句中，程序调用了一个名为 `Character.toUpperCase` 的 API 方法。`Character.toUpperCase` 方法如其名所示——该方法生成小写字母对应的大写形式。在清单\
  \ 8-1 中，这个大写形式（字母 `B`）被赋值给变量 `bigLetter`，然后 `bigLetter` 中的 `B` 被打印在屏幕上，如图 8-2 所示。\n\
  \n![image](img/Image00106.jpg)\n\n图 8-2： 清单 8-1 中的操作。\n\n![remember](img/Image00005.jpg)\
  \ 当计算机在屏幕上显示 `char` 值时，它不会用单引号将字符括起来。\n\n### 我跑题了……\n\n不久前，我好奇如果调用 `Character.toUpperCase`\
  \ 方法并传入一个原本不是小写的字符会发生什么。我翻出 Java API 文档，但没有找到有用的信息。文档说 `toUpperCase` “使用 UnicodeData\
  \ 文件中的大小写映射信息将字符参数转换为大写。” 谢谢，但这对我没用。\n\n虽然看起来很傻，但我问自己，如果我是 `toUpperCase` 方法会怎么做。如果有人递给我一个大写字母\
  \ `R` 并让我把它大写，我会说什么？我会说：“把你的臭大写 `R` 拿回去。” 用计算机的行话来说，我会给那个人发一条错误消息。所以我好奇，如果我对字母 `R`\
  \ 应用 `Character.toUpperCase`，是否会收到错误消息。\n\n我试了一下。我在清单 8-2 中设计了实验。\n\n清单 8-2 探究 toUpperCase\
  \ 的行为\n\n```\nclass MyExperiment {\n\npublic static void main(String args[]) {\n\
  \nchar smallLetter, bigLetter;\n\nsmallLetter = ’R’;\n\nbigLetter = Character.toUpperCase(smallLetter);\n\
  \nSystem.out.println(bigLetter);\n\nsmallLetter = ’3’;\n\nbigLetter = Character.toUpperCase(smallLetter);\n\
  \nSystem.out.println(bigLetter);\n\n}\n\n}\n```\n\n在我的实验中，我没有混合化学物质或引发爆炸。我实际做的是：\n\
  \n*   **我将** ’R’ **赋值给** `smallLetter`。\n\n    `toUpperCase` 方法接收了大写字母 `R`，并返回了另一个大写字母\
  \ `R`。（参见图 8-3。）我没有收到错误消息。这告诉我 `toUpperCase` 方法对已经是大写的字母做了什么——它什么也不做。\n\n*   **我将**\
  \ `’3’` **赋值给** `smallLetter`。\n\n    `toUpperCase` 方法接收了数字 `3`，并返回了相同的数字 `3`。（参见图\
  \ 8-3。）我没有收到错误消息。这告诉我 `toUpperCase` 方法对非字母字符做了什么——它什么也不做——零、无、空。\n\n![image](img/Image00107.gif)\n\
  \n图 8-3： 运行清单 8-2 中的代码。\n\n我写这个实验是为了强调一个重要观点。当你不理解计算机编程中的某些内容时，编写一个测试程序通常很有帮助。设计一个实验，看看计算机如何响应。\n\
  \n我猜测将大写字母 `R` 交给 `toUpperCase` 方法会给我一个错误消息，但我错了。看到了吗？问题的答案并非从天而降。创建 Java API 的人做出了决策。他们做出了一些显而易见的选择，也做出了一些意想不到的选择。没有人知道\
  \ Java 特性的所有细节，所以不要指望把所有答案都塞进脑子里。\n\nJava 文档很棒，但对于文档回答的每个问题，它忽略了另外三个问题。所以大胆一点。不要害怕动手尝试。编写大量简短的程序进行实验。你弄不坏计算机，所以尽管大胆操作。你的求知精神总会得到回报。\n\
  \n阅读和理解 Java 的 API 文档是一门艺术，而非科学。关于如何充分利用这些文档的建议，请阅读我的文章《理解 Java API 文档》，网址为 [`www.dummies.com/programming/java/making-sense-of-javas-api-documentation`](http://www.dummies.com/programming/java/making-sense-of-javas-api-documentation/)。\n\
  \n### 仅限一个字符\n\n`char` 变量只存储一个字符。所以如果你忍不住想写下面的语句：\n\n```\nchar smallLetters;\n\n\
  smallLetters = ’barry’; //不要这样做\n```\n\n请抵制这种诱惑。你不能在 `char` 变量中一次存储多个字母，也不能在一对单引号之间放入多个字母。如果你想存储单词或句子（不仅仅是单个字母），那么你需要使用一种叫做\
  \ *String* 的东西。关于 Java 的 `String` 类型，请参见第 18 章。\n\n### 变量与复用\n\n在清单 8-2 中，我两次使用了\
  \ `smallLetter`，也两次使用了 `bigLetter`。这就是为什么它们被称为 *变量*。首先，`smallLetter` 的值是 `R`。后来，我改变了\
  \ `smallLetter` 的值，使其变为 `3`。\n\n当我给 `smallLetter` 赋新值时，`smallLetter` 的旧值被覆盖了。例如，在图\
  \ 8-4 中，第二次 `smallLetter` 赋值将 `3` 放入了 `smallLetter`。当计算机执行这第二个赋值语句时，旧值 `R` 就消失了。\n\
  \n![image](img/Image00108.jpg)\n\n图 8-4： 改变 `smallLetter` 的值。\n\n这可以吗？你能承受忘记 `smallLetter`\
  \ 曾经拥有的值吗？可以，在清单 8-2 中，这是可以的。在你用语句\n\n`bigLetter = Character.toUpperCase(smallLetter);`\n\
  \n给 `bigLetter` 赋值之后，你就可以忘记现有的 `smallLetter` 值了。你不需要这样做：\n\n```\n// 这段代码很繁琐。\n//\
  \ 额外的变量是不必要的。\nchar smallLetter1, bigLetter1;\nchar smallLetter2, bigLetter2;\n\
  smallLetter1 = ’R’;\nbigLetter1 = Character.toUpperCase(smallLetter1);\nSystem.out.println(bigLetter1);\n\
  smallLetter2 = ’3’;\nbigLetter2 = Character.toUpperCase(smallLetter2);\nSystem.out.println(bigLetter2);\n\
  ```\n\n你不需要将旧值和新值存储在单独的变量中。相反，你可以像清单 8-2 那样复用变量 `smallLetter` 和 `bigLetter`。\n\n\
  这种变量复用并不会节省大量打字工作，也不会节省太多内存空间。但复用变量能让程序保持整洁。当你查看清单 8-2 时，一眼就能看出代码有两部分，并且两部分做的事情大致相同。\n\
  \n清单 8-2 中的代码简单且易于管理。在这样一个小程序中，简单性和可管理性并不重要。但在大型程序中，仔细考虑每个变量的使用会很有帮助。\n\n### 何时不应复用变量\n\
  \n上一节讨论了复用变量以使程序简洁易读。本节展示另一面。在本节中，当前的问题迫使你创建新变量。\n\n\n\n\n\n假设你正在编写代码来反转一个四字母单词中的字母。你将每个字母存储在不同的独立变量中。清单\
  \ 8-3 展示了代码，图 8-5 展示了代码的运行效果。\n\n![image](img/Image00109.gif)\n\n图 8-5： 停下这些罐子！\n\
  \n清单 8-3 让单词反向\n\n```\nimport java.util.Scanner;\n\nclass ReverseWord {\n    public\
  \ static void main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
  \        char c1, c2, c3, c4;\n        c1 = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n\
  \        c2 = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n        c3 = keyboard.findWithinHorizon(\"\
  .\", 0).charAt(0);\n        c4 = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n\
  \        System.out.print(c4);\n        System.out.print(c3);\n        System.out.print(c2);\n\
  \        System.out.print(c1);\n        System.out.println();\n        keyboard.close();\n\
  \    }\n}\n```\n\n清单 8-3 中的技巧如下：\n\n*   按顺序为变量 `c1`、`c2`、`c3` 和 `c4` 赋值。\n*   按相反顺序在屏幕上显示这些变量的值：`c4`、`c3`、`c2`，然后是\
  \ `c1`，如图 8-6 所示。\n\n![image](img/Image00110.jpg)\n\n图 8-6： 使用四个变量。\n\n如果你不使用四个独立的变量，就无法得到你想要的结果。例如，假设你只用一个变量存储字符。你运行程序并输入单词\
  \ `pots`。当需要反向显示单词时，计算机只记得单词 `pots` 中的最后一个 `s`。但计算机不记得 `p`、`o` 或 `t`，如图 8-7 所示。\n\
  \n![image](img/Image00111.jpg)\n\n图 8-7： 因为只使用了一个变量而出错。\n\n我希望我能给你 12 条简单的规则，帮助你决定何时重用变量，何时不重用。问题是，我做不到。这完全取决于你想要实现什么。那么，如何自己判断何时重用变量，何时不重用呢？就像有人问如何到达卡内基音乐厅时，那人回答：“练习，练习，再练习。”\n\
  \n### 读取字符\n\nJava 的 `Scanner` 类的创建者并没有为读取单个字符创建一个 `next` 方法。因此，为了输入单个字符，我将两个 Java\
  \ API 方法拼接在一起。我使用了 `findWithinHorizon` 和 `charAt` 方法。\n\n表 5-1（在第 5 章中）介绍了这种 `findWithinHorizon(\"\
  .\", 0).charAt(0)` 技术，用于读取单个输入字符，而清单 8-3 使用该技术一次读取一个字符。（实际上，清单 8-3 使用了四次该技术来读取四个单独的字符。）\n\
  \n注意图 8-5 中输入格式。要输入单词 `pots` 中的字符，我连续输入四个字母，字母之间没有空格，也没有引号。`findWithinHorizon(\"\
  .\", 0).charAt(0)` 技术就是这样工作的，但不要怪我或我的技术。其他开发者的字符读取方法也是同样的方式。无论你使用谁的方法，读取字符与读取数字是不同的。具体如下：\n\
  \n*   **使用像 `nextDouble` 和 `nextInt` 这样的方法时，你需要在数字之间输入空格。**\n\n    如果我输入 **80 6**，那么两次调用\
  \ `nextInt` 会先读取数字 `80`，然后读取数字 `6`。如果我输入 **806**，那么一次调用 `nextInt` 会读取数字 `806`（八百零六），如图\
  \ 8-8 所示。\n\n*   **使用 `findWithinHorizon(\".\", 0).charAt(0)` 时，你不需要在字符之间输入空格。**\n\
  \n    如果我输入 **po**，那么连续两次调用 `findWithinHorizon(\".\", 0).charAt(0)` 会先读取字母 `p`，然后读取字母\
  \ `o`。如果我输入 **p o**，那么两次调用 `findWithinHorizon(\".\", 0).charAt(0)` 会先读取字母 `p`，然后读取一个空格字符。（是的，空格也是一个字符！）同样，请参见图\
  \ 8-8。\n\n![image](img/Image00112.gif)\n\n图 8-8： 读取数字和字符。\n\n![remember](img/Image00005.jpg)\
  \ 要在计算机程序的文本中表示单个字符，需要用单引号将字符括起来。但是，当你在程序输入中键入字符时，不需要用引号将字符括起来。\n\n![warning](img/Image00004.jpg)\
  \ 假设你的程序先调用 `nextInt`，然后调用 `findWithinHorizon(\".\", 0).charAt(0)`。如果你在键盘上输入 **80x**，你会收到一条错误消息。（消息显示\
  \ `InputMismatchException`。`nextInt` 方法期望你在每个 `int` 值之后输入一个空格。）现在，如果你在键盘上输入 **80\
  \ x** 而不是 **80x**，会发生什么？那么程序会得到 `int` 值 `80`，然后得到字符值一个空格。为了让程序得到 `x`，程序必须再调用一次 `findWithinHorizon(\"\
  .\", 0).charAt(0)`。这看起来有些浪费，但从长远来看是有意义的。\n\n#### 名字里有什么？\n\n![tryitout](img/Image00006.jpg)\
  \ 除了 `Character.toUpperCase` 方法之外，Java 还有一个 `Character.toLowerCase` 方法。考虑到这一点，编写一个程序，读取一个三个字母的单词，并输出该单词作为人名时的大写形式。例如，如果程序读取字母\
  \ `ann`，则程序输出 `Ann`。如果程序输入 `BoB`，则程序输出 `Bob`。\n\n#### 字母的排列\n\n编写一个程序，从键盘读取三个字母，并输出这三个字母的所有可能排列。例如，如果程序读取字母\n\
  \n```\nbox\n```\n\n程序输出\n\n```\nbox\nbxo\nobx\noxb\nxbo\nxob\n```\n\n## boolean\
  \ 类型\n\n我遇到大麻烦了。我有 140 颗口香糖，15 个孩子在我的客厅里跑来跑去，尖叫不止。他们尖叫是因为每个孩子想要 10 颗口香糖，他们跑来跑去是因为孩子们在拥挤的客厅里就是这样的。我需要一个程序来告诉我是否每个孩子都能得到\
  \ 10 颗口香糖。\n\n我需要一个 *boolean* 类型的变量。一个 `boolean` 变量存储两个值之一——`true` 或 `false`（`true`\
  \ 表示我可以给每个孩子十颗口香糖；`false` 表示我不能给每个孩子十颗口香糖）。不管怎样，孩子们已经失控了，所以我写了一个简短的程序，放在清单 8-4 中。程序的输出如图\
  \ 8-9 所示。\n\n![image](img/Image00113.jpg)\n\n图 8-9： 哦，不！\n\n清单 8-4 使用 boolean 类型\n\
  \n```\nclass CanIKeepKidsQuiet {\n    public static void main(String args[]) {\n\
  \        int gumballs;\n        int kids;\n        int gumballsPerKid;\n       \
  \ boolean eachKidGetsTen;\n        gumballs = 140;\n        kids = 15;\n       \
  \ gumballsPerKid = gumballs / kids;\n        System.out.print(\"True or false? \"\
  );\n        System.out.println(\"Each kid gets 10 gumballs.\");\n        eachKidGetsTen\
  \ = gumballsPerKid >= 10;\n        System.out.println(eachKidGetsTen);\n    }\n\
  }\n```\n\n在清单 8-4 中，变量 `eachKidGetsTen` 的类型是 `boolean`。因此，存储在 `eachKidGetsTen` 变量中的值可以是\
  \ `true` 或 `false`。（我不能在 `eachKidGetsTen` 变量中存储数字或字符。）\n\n\n\n\n\n为了给变量`eachKidGetsTen`赋值，程序会检查`gumballsPerKid`是否大于或等于十。（符号`>=`代表“大于或等于”。真可惜！标准计算机键盘上没有≥键。）由于`gumballsPerKid`只有九，`gumballsPerKid\
  \ >= 10`的结果为假。因此`eachKidGetsTen`被赋值为`false`。哎呀！孩子们会把房子拆了的！（在他们动手之前，先看看图 8-10。）\n\
  \n![image](img/Image00114.jpg)\n\n图 8-10： 为`eachKidGetsTen`变量赋值。\n\n### 表达式与条件\n\
  \n在清单 8-4 中，代码`gumballsPerKid >= 10`是一个表达式。该表达式的值取决于变量`gumballsPerKid`中存储的值。在糟糕的日子里，`gumballsPerKid\
  \ >= 10`的值为`false`。因此变量`eachKidGetsTen`被赋值为`false`。\n\n像`gumballsPerKid >= 10`这样，其值为`true`或`false`的表达式，有时被称为*条件*。\n\
  \n![technicalstuff](img/Image00007.jpg) 像`true`和`false`这样的值看起来可能包含字符，但实际上并非如此。在内部，Java\
  \ 虚拟机并不用字母 t-r-u-e 或 f-a-l-s-e 来存储`boolean`值。相反，JVM 存储的是代码，比如 0 代表 false，1 代表 true。当计算机显示`boolean`值时（如`System.out.println(eachKidGetsTen)`），Java\
  \ 虚拟机会将像 0 这样的代码转换为五个字母的单词`false`。\n\n### 比较数字；比较字符\n\n在清单 8-4 中，我将一个变量的值与数字 10\
  \ 进行了比较。我在表达式中使用了`>=`运算符：\n\n`gumballsPerKid >= 10`\n\n当然，大于或等于的比较只能帮你到这里。表 8-1\
  \ 展示了你可以用来比较事物的运算符。\n\n| **运算符符号** | **含义** | **示例** |\n| --- | --- | --- |\n| `==`\
  \ | 等于 | `myGuess == winningNumber` |\n| `!=` | 不等于 | `5 != numberOfCows` |\n| `<`\
  \ | 小于 | `strikes < 3` |\n| `>` | 大于 | `numberOfBoxtops > 1000` |\n| `<=` | 小于或等于\
  \ | `lowNumber + highNumber <= 25` |\n| `>=` | 大于或等于 | `gumballsPerKid >= 10` |\n\
  \n表 8-1 比较运算符\n\n使用表 8-1 中的运算符，你可以比较数字和字符。\n\n![warning](img/Image00004.jpg) 注意表\
  \ 8-1 第一行中的双等号。不要试图用单个等号来比较两个值。表达式`myGuess = winningNumber`（使用单个等号）并不会比较`myGuess`和`winningNumber`。相反，`myGuess\
  \ = winningNumber`会改变`myGuess`的值。（它将`winningNumber`的值赋给变量`myGuess`。）\n\n你可以使用`==`和`!=`运算符比较其他事物（除了数字和字符）。但这样做时，你必须小心。更多信息请参见第\
  \ 18 章。\n\n#### 比较数字\n\n没有什么比比较数字更单调乏味的了。“真还是假？五大于或等于十。”假。五既不大于也不等于十。你明白我的意思吗？无聊。\n\
  \n比较整数是直截了当的。但不幸的是，当你比较小数时，会有一个小问题。拿一个将摄氏度转换为华氏度的程序来说。等等！不要随便拿一个这样的程序；就拿清单 8-5 中的程序吧。\n\
  \n清单 8-5 这里温暖又舒适\n\n```\nimport java.util.Scanner;\n\nclass CelsiusToFahrenheit\
  \ {\n    public static void main(String args[]) {\n        Scanner keyboard = new\
  \ Scanner(System.in);\n        double celsius, fahrenheit;\n\n        System.out.print(\"\
  Enter the Celsius temperature: \");\n        celsius = keyboard.nextDouble();\n\n\
  \        fahrenheit = 9.0 / 5.0 * celsius + 32.0;\n\n        System.out.print(\"\
  Room temperature? \");\n        System.out.println(fahrenheit == 69.8);\n\n    \
  \    keyboard.close();\n    }\n}\n```\n\n如果你运行清单 8-5 中的代码并输入数字 21，计算机会计算`9.0 / 5.0\
  \ * 21 + 32.0`的值。信不信由你，你想检查计算机的答案。（谁知道呢？也许计算机算错了！）你需要做一些算术，但请不要伸手去拿计算器。计算器只是一台小型计算机，这类机器会互相包庇。要检查计算机的工作，你需要手动进行算术。什么？你说你害怕数学？好吧，别担心。我已经在图\
  \ 8-11 中完成了所有数学计算。\n\n![image](img/Image00115.jpg)\n\n图 8-11： 华氏温度恰好是 69.8。\n\n\
  如果你手动计算，`9.0 / 5.0 * 21 + 32.0`的值恰好是 69.8。所以运行清单 8-5 中的代码，并将`celsius`赋值为`21`。当你显示`fahrenheit\
  \ == 69.8`的值时，你应该得到`true`，对吗？\n\n嗯，不对。看看图 8-12 中的运行结果。当计算机计算`fahrenheit == 69.8`时，结果竟然是`false`，而不是`true`。这是怎么回事？\n\
  \n![image](img/Image00116.jpg)\n\n图 8-12： 清单 8-5 中代码的一次运行。\n\n![remember](img/Image00005.jpg)\
  \ 分组分隔符因国家而异。图 8-12 所示的运行结果在世界各地几乎都适用。但如果摄氏温度是二十一点五度，你在某些国家输入**21.5**（带点），而在其他国家输入**21,5**（带逗号）。你的计算机硬件没有内置“国家检测仪”，但当你安装计算机操作系统时，你会告诉它你住在哪个国家。Java\
  \ 程序会访问这些信息，并用它来自定义`nextDouble`方法的工作方式。\n\n一点侦探工作可以大有帮助。回顾一下事实：\n\n* **事实：** `fahrenheit`的值应该恰好是`69.8`。\n\
  * **事实：** 如果`fahrenheit`是`69.8`，那么`fahrenheit == 69.8`为`true`。\n* **事实：** 在图 8-12\
  \ 中，计算机显示了单词`false`。所以表达式`fahrenheit == 69.8`不是`true`。\n\n你如何协调这些事实？毫无疑问，`fahrenheit\
  \ == 69.8`是`false`，那么这对`fahrenheit`的值意味着什么？在清单 8-5 中，任何地方都没有显示`fahrenheit`的值。这会是问题所在吗？\n\
  \n此时，我使用了一个流行的程序员技巧。我添加了一些语句来显示`fahrenheit`的值：\n\n```\nfahrenheit = 9.0 / 5.0 *\
  \ celsius + 32.0;\nSystem.out.print(\"fahrenheit: \"); //Added\nSystem.out.println(fahrenheit);\
  \ //Added\n```\n\n增强版代码的一次运行如图 8-13 所示。如你所见，计算机没有命中目标。计算机计算`9.0 / 5.0 * 21 + 32.0`的值是`69.80000000000001`，而不是预期的`69.8`。事情就是这样。计算机的所有算术都是用\
  \ 0 和 1 进行的，所以计算机的算术看起来不像图 8-11 中的十进制算术。计算机的答案并没有错。只是答案稍微有点不精确。\n\n![image](img/Image00117.jpg)\n\
  \n图 8-13： `fahrenheit`变量的完整值。\n\n\n\n\n\n在第 7 章的一个示例中，Java 的取余运算符（`%`）给出的结果是 `0.1299999999999999`，而不是你期望的\
  \ `0.13`。同样奇怪的事情也发生在本节的示例中。但本节代码并没有使用什么奇特的取余运算符，而是用了你的老朋友：除法、乘法和加法。\n\n当你比较两个数字是否相等（使用\
  \ `==`）或不相等（使用 `!=`）时要小心。在使用 Java 的 `double` 类型或 `float` 类型时，微小的不精确性几乎无处不在。而且多个微小的不精确性会相互累积，变成非常大的不精确性。当你比较两个\
  \ `double` 值或两个 `float` 值时，这些值几乎永远不会完全相等。\n\n![记住](img/Image00005.jpg) 如果你的程序没有按你预想的方式运行，请检查你对变量值的怀疑。在代码中添加\
  \ `print` 和 `println` 语句。\n\n![技术细节](img/Image00007.jpg) 比较 `double` 值时，给自己留一些余地。不要比较是否完全相等，而是询问某个特定值是否合理接近预期值。例如，使用类似\
  \ `fahrenheit >= 69.8 - 0.01 && fahrenheit <= 69.8 + 0.01` 的条件来判断 `fahrenheit` 是否在\
  \ `69.8` 的 0.01 范围内。要了解更多关于包含 Java 的 `&&` 运算符的条件，请参阅第 10 章。\n\n#### 比较字符\n\n表 8-1\
  \ 中的比较运算符对字符也适用。粗略地说，运算符 `<` 表示“在字母表中更靠前”。但你必须注意以下几点：\n\n*   因为 `B` 在字母顺序上位于 `H`\
  \ 之前，所以条件 `'B' < 'H'` 为 `true`。这并不奇怪。\n*   因为 `b` 在字母顺序上位于 `h` 之前，所以条件 `'b' < 'h'`\
  \ 为 `true`。这也不奇怪。\n*   所有大写字母都排在任何小写字母之前，所以条件 `'b' < 'H'` 为 `false`。这倒是令人惊讶。（参见图\
  \ 8-14。）\n\n![图片](img/Image00122.jpg)\n\n图 8-14： 字母的排序。\n\n在实践中，你很少需要比较一个字母与另一个字母。但在第\
  \ 18 章中，你会读到 Java 的 `String` 类型。使用 `String` 类型，你可以比较单词、名称以及其他好东西。那时，你必须仔细考虑字母顺序，而图\
  \ 8-14 中的概念就会派上用场。\n\n![技术细节](img/Image00007.jpg) 在底层，字母 `A` 到 `Z` 存储为数字编码 65 到\
  \ 90。字母 `a` 到 `z` 存储为编码 97 到 122。这就是为什么每个大写字母都“小于”任何小写字母。\n\n## 其余的基本类型\n\n在第 7\
  \ 章中，我告诉你 Java 有八种基本类型，但表 7-1 只列出了八种中的六种。表 8-2 描述了剩下的两种类型——`char` 和 `boolean`。表\
  \ 8-2 并不太令人兴奋，但我不能让你只看到表 7-1 中不完整的故事。\n\n| **类型名称** | **取值范围** |\n| --- | --- |\n\
  | *字符类型* |  |\n| `char` | 数千个字符、字形和符号 |\n| *逻辑类型* |  |\n| `boolean` | 只有 `true`\
  \ 或 `false` |\n\n表 8-2 Java 的基本非数值类型\n\n![技术细节](img/Image00007.jpg) 如果你剖析 Java 虚拟机的某些部分，你会发现\
  \ Java 将 `char` 视为数值类型。这是因为 Java 使用一种叫做 *Unicode* 的东西来表示字符——这是一种用于表示世界上多种语言字母表的国际标准。例如，大写字母\
  \ C 的 Unicode 表示是 67。希伯来字母 Aleph 的表示是 1488。再举一个更冷门的例子，语音学中浊卷舌近音的表示是 635。但不必担心这些。我之所以提到\
  \ `char` 类型是数值类型，唯一的原因是为了在我的技术朋友面前保住面子。\n\n![技术细节](img/Image00007.jpg) 看完表 8-2 后，你可能想知道什么是字形。（事实上，我很自豪能写到这个深奥的概念，无论你是否需要这些信息。）*字形*是字符的一种特定表现形式。例如，a\
  \ 和 *a* 是两种不同的字形，但这两个字形都代表罗马字母表中的同一个小写字母。（因为这两个字形含义相同，所以它们被称为*异体字*。如果你想显得很聪明，找个机会在日常对话中插入“字形”和“异体字”这两个词吧！）\n\
