  \n## Java 程序中的元素\n\n英语和 Java 都被称为*语言*并非巧合。你用语言来表达思想。英语向人表达思想，而 Java 向计算机表达思想。此外，英语和\
  \ Java 都有单词、名称和标点符号之类的东西。事实上，这两种语言最大的区别在于 Java 比英语更容易学。（如果英语容易，计算机就能理解英语。可惜它们不能。）\n\
  \n拿一个普通的英语句子与清单 4-1 中的代码进行比较。这是那个句子：\n\n> Ann 不发音“r”音，因为她来自纽约。\n\n在高中语法课上，你关注动词、形容词等。但在这本书中，你从关键字和标识符的角度思考，如图\
  \ 4-2 所示。\n\n![image](img/Image00061.jpg)\n\n图 4-2： 简单句子中的元素。\n\nAnn 的句子包含各种东西。它们与你在计算机程序中找到的东西是同一类。所以计划是这样的：将图\
  \ 4-2 中的元素与清单 4-1 中的类似元素进行比较。你已经理解英语，因此可以利用这种理解来了解 Java 的一些新知识。\n\n但首先，这里有一个友好的提醒：在接下来的几段中，我将英语和\
  \ Java 进行对比。阅读这些段落时，请保持开放的心态。在比较 Java 和英语时，我可能会写道：“事物的名称与字典中的单词不同。”当然，你可以争辩说有些字典列出了专有名词，有些人有像\
  \ Hope、Prudence 和 Spike 这样的名字，但请不要这样。如果你避免吹毛求疵，你会从阅读中获得更多。好吗？我们还是朋友吗？\n\n### 关键字\n\
  \n*关键字*是字典中的单词——一种内置于语言中的单词。\n\n在图 4-2 中，像“from”这样的词是一个关键字，因为“from”在英语句子中使用时总是扮演相同的角色。Ann\
  \ 句子中的其他关键字是“doesn’t”、“pronounce”、“the”、“sound”、“because”和“she’s”。\n\n计算机程序也有关键字。事实上，清单\
  \ 4-1 中的程序使用了四个 Java 关键字（以粗体显示）：\n\n`class` `ThingsILike {`\n\n`public static void`\
  \ `main(String args[]) {`\n\n每个 Java 关键字都有特定的含义——这个含义在不同程序之间保持不变。例如，每当我编写 Java 程序时，单词`public`总是表示程序中任何其他代码都可以访问的部分。\n\
  \n![warning](img/Image00004.jpg) Java 编程语言是*区分大小写*的。这意味着如果你将单词中的一个小写字母改为大写字母，你就改变了单词的含义。改变大小写可能使整个单词从有意义变成无意义。在清单\
  \ 4-1 中，你不能将`public`替换为`Public`。如果你这样做，整个程序就会停止工作。\n\n本章对关键字`class`、`public`、`static`和`void`的含义几乎没有详细说明。你可以提前翻阅其他章节的内容，或者通过“作弊”来应付。编写程序时，只需以\n\
  \n`class SomethingOrOther {`\n\n开头，然后将文本\n\n`public static void main(String args[])\
  \ {`\n\n粘贴到你的代码中。在你最初的几个程序中，这个策略很管用。\n\n表 4-1 列出了 Java 关键字的完整列表。\n\n| `abstract`\
  \ | `continue` | `for` | `new` | `switch` |\n| `assert` | `default` | `goto` | `package`\
  \ | `synchronized` |\n| `boolean` | `do` | `if` | `private` | `this` |\n| `break`\
  \ | `double` | `implements` | `protected` | `throw` |\n| `byte` | `else` | `import`\
  \ | `public` | `throws` |\n| `case` | `enum` | `instanceof` | `return` | `transient`\
  \ |\n| `catch` | `extends` | `int` | `short` | `try` |\n| `char` | `final` | `interface`\
  \ | `static` | `void` |\n| `class` | `finally` | `long` | `strictfp` | `volatile`\
  \ |\n| `const` | `float` | `native` | `super` | `while` |\n\n表 4-1 Java 关键字\n\n\
  ![technicalstuff](img/Image00007.jpg) 在 Java 中，单词`true`、`false`和`null`具有特定含义。与表\
  \ 4-1 中的关键字一样，你不能将`true`、`false`和`null`用于 Java 程序中正常含义之外的任何其他含义。但出于只有最挑剔的 Java 专家才关心的原因，`true`、`false`和`null`并不被称为\
  \ Java 关键字。无论如何，如果你将单词`true`、`false`和`null`添加到表 4-1 中，也没问题。\n\n关于关键字，有一点要记住：在 Java\
  \ 中，每个关键字都有官方预定义的含义。Oracle 公司（对 Java 程序构成有最终决定权）创建了所有 Java 关键字。你不能为任何 Java 关键字赋予自己的含义。例如，你不能在计算中使用单词`public`：\n\
  \n```\n//这是糟糕的、糟糕的代码：\npublic = 6;\n```\n\n如果你试图以这种方式使用关键字，编译器会显示错误消息并拒绝翻译你的源代码。英语中也是如此。给一个婴儿取名\
  \ Because：\n\n> “让我们为今晚的主持人——Because O. Borel——献上热烈的掌声。”\n\n你可以这样做，但这个孩子永远不会过上正常的生活。\n\
  \n![technicalstuff](img/Image00007.jpg) 尽管我在本节中强烈主张，但 Java 中有两个关键字在 Java 程序中没有意义。这两个关键字——`const`和`goto`——被保留在\
  \ Java 中不使用。如果你试图创建一个名为`goto`的变量，Eclipse 会显示`Invalid VariableDeclaratorId`错误消息。Java\
  \ 的创建者认为，如果你在代码中使用了`const`或`goto`这两个词，应该礼貌地告诉你转到 C++程序员的那一桌。\n\n### 你或我可以定义的标识符\n\
  \n我喜欢 Ann 这个名字，但如果你不喜欢传统名字，就编一个全新的名字。你即将有一个新生儿。叫她 Deneen 或 Chrisanta。给他取名 Belton\
  \ 或 Merk。\n\n\n\n\n一个*名称*是标识某物的词，所以我将不再称这些东西为名称，而改称它们为*标识符*。在计算机编程中，*标识符*是某种名词。标识符引用一个值、程序的一部分、某种结构或任意数量的东西。\n\
  \n清单 4-1 中有两个我们可以自行定义的标识符。它们是虚构的词 `ThingsILike` 和 `args`。\n\n```\nclass ThingsILike\
  \ {\npublic static void main(String args[]) {\n```\n\n正如名字 Ann 和 Chrisanta 在英语中没有特殊含义一样，`ThingsILike`\
  \ 和 `args` 在 Java 中也没有特殊含义。在清单 4-1 中，我用 `ThingsILike` 作为程序名，但我也可以使用像 `GooseGrease`、`Enzyme`\
  \ 或 `Kalamazoo` 这样的名字。我必须在程序中写上 `(String someName[])`，但我也可以使用 `(String args[])`、`(String\
  \ commandLineArguments[])` 或 `(String cheese[])`。\n\n![tip](img/Image00003.jpg)\
  \ 为 Java 程序中的事物起一些合理且富有信息量的名称。像 `GooseGrease` 这样的名称是合法的，也确实很可爱，但它们无助于你跟踪程序的编写策略。\n\
  \n![remember](img/Image00005.jpg) 当我命名 Java 程序时，可以使用 `ThingsILike` 或 `GooseGrease`，但不能使用\
  \ `public` 这个词。像 `class`、`public`、`static` 和 `void` 这样的词是 Java 中的关键字。\n\n`(String\
  \ args[])` 中的 `args` 保存了你在运行 Java 程序时输入的任何额外内容。例如，如果你通过输入 `java ThingsILike won\
  \ too 3` 来运行程序，那么 `args` 会存储额外的值 `won`、`too` 和 `3`。作为初学者，你不需要考虑 Java 的这个特性。只需将 `(String\
  \ args[])` 粘贴到你的每个程序中即可。\n\n### 具有约定俗成含义的标识符\n\n许多人名叫 Ann，但只有一座著名的城市叫 New York。这是因为“New\
  \ York”这个词具有标准且广为人知的含义——它是不夜城。如果你要建立自己的城市，应该避免将其命名为 New York，因为那样只会让所有人困惑。（我知道佛罗里达州有一个小镇叫\
  \ New York，但那不算数。记住，你应该忽略这类例外。）\n\n大多数编程语言都有具有约定俗成含义的标识符。在 Java 中，几乎所有这类标识符都在 Java\
  \ API 中定义。清单 4-1 中有五个这样的标识符。它们是 `main`、`String`、`System`、`out` 和 `println`：\n\n\
  ```\npublic static void main(String args[]) {\nSystem.out.println(\"Chocolate, royalties,\
  \ sleep\");\n}\n```\n\n以下是每个名称含义的简要说明（更详细的描述贯穿本书）：\n\n*   **main：** 每个 Java 程序执行的起始点。\n\
  *   **String：** 一串文本；一行字符，一个接一个。\n*   **System：** Java API 中的一个预置程序。该程序可以访问计算机中某些不受\
  \ Java 虚拟机（JVM）直接控制的功能。\n*   **out：** 基于文本的程序显示其文本的地方。（对于在 Eclipse 中运行的程序，`out`\
  \ 代表控制台视图。要了解更多关于基于文本的程序，请查看第 3 章的前几段。）\n*   **println：** 在计算机屏幕上显示文本。\n\n![remember](img/Image00005.jpg)\
  \ 名称 `println` 来源于“print a *line*”（打印一行）。如果允许你用大写字母书写，它会是 `PRINTLN`，单词末尾有一个字母 `L`。当计算机执行\
  \ `println` 时，计算机会将一些文本放入 Eclipse 的控制台视图，然后立即*移动到下一行的开头*，为控制台视图中将要出现的其他内容做准备。\n\n\
  ![technicalstuff](img/Image00007.jpg) 严格来说，Java API 中标识符的含义并非一成不变。尽管你可以为 `System`\
  \ 或 `println` 这样的词赋予自己的含义，但这样做并不明智——因为你会让其他程序员感到困惑，他们早已习惯了这些常见标识符名称的标准 API 含义。\n\
  \n### 字面量\n\n*字面量*是一段看起来与其所代表的值完全相同的文本。在 Ann 的句子中（参见图 4-2），“r”是一个字面量，因为“r”指的是字母\
  \ *r*。\n\n编程语言也有字面量。例如，在清单 4-1 中，引号内的内容就是一个字面量：\n\n```\nSystem.out.println(\"Chocolate,\
  \ royalties, sleep\");\n```\n\n当你运行 `ThingsILike` 程序时，屏幕上会显示 `Chocolate`、`royalties`、`sleep`\
  \ 这些词。在清单 4-1 中，文本 `\"Chocolate, royalties, sleep\"` 指的就是这些词，与屏幕上显示的内容完全一致（不含引号）。\n\
  \n你在计算机程序中使用的大多数数字都是字面量。如果你在程序中写下语句\n\n```\nmySalary = 1000000.00;\n```\n\n那么 `1000000.00`\
  \ 就是一个字面量。它代表数字 1000000.00（一百万）。\n\n如果你不喜欢数数字位数，可以在 Java 7 程序中写下以下语句：\n\n```\nmySalary\
  \ = 1_000_000.00;\n```\n\n从 Java 7 开始，带下划线的数字可以作为字面量使用。\n\n![warning](img/Image00004.jpg)\
  \ 在 Java 7 之前的 Java 版本中，你不能在代码中使用像 `1_000_000.00` 这样的数字。\n\n![technicalstuff](img/Image00007.jpg)\
  \ 不同国家使用不同的数字分隔符和数字格式。例如，在美国，你写 1,234,567,890.55。在法国，你写 1234567890,55。在印度，你将数字按两位和三位分组，写为\
  \ 1,23,45,67,890.55。你不能在 Java 程序中写 `mySalary = 1,000,000.00` 这样的语句。Java 的数字字面量中不包含任何逗号。但在印度，你可以写\
  \ `mySalary = 10_00_000.00` 以便于阅读。而对于程序的输出，你可以使用 Java 的 `Locale` 和 `NumberFormat`\
  \ 类来显示像 1234567890,55 这样的数字。（关于 `Locale` 和 `NumberFormat` 的更多信息，请查看第 18 章。）\n\n\
  ### 标点符号\n\n一个典型的计算机程序包含大量标点符号。例如，考虑清单 4-1 中的程序：\n\n```\nclass ThingsILike {\npublic\
  \ static void main(String args[]) {\nSystem.out.println(\"Chocolate, royalties,\
  \ sleep\");\n}\n}\n```\n\n每个括号、每个花括号、每种类型的曲线符号都在使程序有意义方面发挥作用。\n\n在英语中，你一直写到一行末尾，然后将文本换行到下一行开头。在编程中，你很少这样工作。相反，代码的标点符号引导着某些行的缩进。缩进显示了程序的哪些部分从属于其他部分。这就像在英语中，你写这样一个句子：\n\
  \nAnn 不发音“r”音，因为\n\n，\n\n> 众所周知\n\n，\n\n她来自纽约。\n\n图 4-3 和 4-4 中的示意图展示了 `ThingsILike`\
  \ 程序的各个部分如何包含在其他部分中。注意一对花括号如何像一个盒子一样工作。为了让你一眼就能看出程序的结构，你将每个盒子内部的所有内容都缩进。\n\n![image](img/Image00062.gif)\n\
  \n图 4-3： 一对花括号像一个盒子。\n\n![image](img/Image00063.jpg)\n\n图 4-4： 计算机程序中的思想是相互嵌套的。\n\
  \n\n\n\n\n![记住](img/Image00005.jpg) 这一点我怎么强调都不为过：如果你不缩进代码，或者虽然缩进了但不够仔细，你的代码仍然能编译并正确运行。但这种成功运行会给你一种虚假的自信。一旦你试图更新某些缩进不当的代码，你就会陷入无法摆脱的困惑。听我的建议：在编写过程的每一步都仔细缩进你的代码。无论你是在草拟一个快速测试程序，还是为亿万富翁客户编写代码，都要精确地缩进。\n\
  \n![提示](img/Image00003.jpg) Eclipse 可以自动为你缩进代码。选择你想要缩进代码的 `.java` 文件。然后，在 Eclipse\
  \ 的主菜单中，选择 Source ⇒   Format。Eclipse 会重新排列编辑器中的行，缩进那些应该缩进的部分，通常能让你的代码看起来更美观。\n\n\
  ### 注释\n\n*注释* 是脱离正常流程的文本。在图 4-2 中，“That’s a sentence” 这些词并不是 Ann 句子的一部分。相反，这些词是关于\
  \ Ann 句子的说明。\n\n计算机程序中的注释也是如此。清单 4-1 中的前五行构成了一条大注释。计算机不会执行这条注释。注释中没有让计算机执行的指令。相反，注释告诉其他程序员关于你代码的一些信息。\n\
  \n注释也对你自身有益。想象一下，你把代码搁置一段时间，去处理其他事情。当你稍后回来继续处理代码时，注释能帮助你回忆起当时在做什么。\n\nJava 编程语言有三种注释：\n\
  \n*   **传统注释：** 清单 4-1 中的注释是*传统*注释。注释以 `/*` 开头，以 `*/` 结尾。开头的 `/*` 和结尾的 `*/` 之间的所有内容仅供人类阅读。`/*`\
  \ 和 `*/` 之间的任何内容都不会被编译器翻译。\n\n    清单 4-1 中的第二、三、四行有多余的星号。我称它们为“多余”，是因为在创建注释时这些星号并非必需。它们只是让注释看起来更美观。我在清单\
  \ 4-1 中包含了它们，因为出于某种我不完全理解的原因，大多数 Java 程序员都会添加这些多余的星号。\n\n*   **行末注释：** 下面是一些带有行末注释的代码：\n\
  \n    ```\n    class ThingsILike { //缺少两样东西\n    public static void main(String\
  \ args[]) {\n    System.out.println(\"sleep\"); //这里缺少\n    }\n    }\n    ```\n\n\
  \    *行末*注释以两个斜杠开头，并延伸到该行末尾。\n\n    ![提示](img/Image00003.jpg) 你可能会听到程序员谈论*注释掉*代码的某些部分。当你编写程序时，如果某些功能运行不正常，尝试移除部分代码通常会有所帮助。至少，你能发现移除可疑代码后会发生什么。当然，你可能不喜欢移除代码后的结果，所以你不希望完全删除代码。相反，你可以将普通的\
  \ Java 语句变成注释。例如，将 `System.out.println(\"Sleep\");` 变成 `/* System.out.println(\"\
  Sleep\"); */`。这样，在你试图找出程序问题所在时，Java 编译器就不会看到这段代码。\n\n*   **Javadoc 注释：** 一种特殊的 *Javadoc*\
  \ 注释是指任何以额外星号开头的传统注释：\n\n    ```\n    /**\n    * 打印一个字符串然后结束该行。\n    */\n    ```\n\
  \n    这是一个很酷的 Java 特性。从 Oracle 网站下载的 Java SE 软件中包含一个名为 `javadoc` 的小程序。`javadoc`\
  \ 程序会查找代码中的这些特殊注释。该程序利用这些注释创建一个全新的网页——为你的代码定制的文档页面。要了解更多关于将 Javadoc 注释转换为网页的信息，请访问本书的网站（[`allmycode.com/BeginProg`](http://allmycode.com/BeginProg)）。\n\
  \n## 理解一个简单的 Java 程序\n\n以下各节将对清单 4-1 中的 Java 程序进行介绍、解释、分析、剖析，并揭开其神秘面纱。\n\n### 什么是方法？\n\
  \n你在一家高档修车厂担任汽车修理工。你的老板总是匆匆忙忙，而且习惯把单词连在一起说：“fixTheAlternator on that junkyOldFord”（修理那辆破旧福特车的发电机）。你在脑海中快速过一遍任务清单：“把车开进工位，打开发动机盖，拿扳手，松开发电机皮带”，等等。这里涉及三件事：\n\
  \n*   **你有一个名称来表示你应该做的事情。** 这个名称是 `fixTheAlternator`。\n\n*   **在你的脑海中，有一系列与名称 `fixTheAlternator`\
  \ 相关联的任务。** 这个列表包括“把车开进工位，打开发动机盖，拿扳手，松开发电机皮带”等等。\n\n*   **有一个脾气暴躁的老板在命令你做所有这些工作。**\
  \ 你的老板通过说“fixTheAlternator”来让你开始工作。换句话说，你的老板通过说出你应该做的事情的名称来让你开始工作。\n\n在这个场景中，使用*方法*这个词并不牵强。你有一个处理发电机的方法。你的老板调用这个方法，你通过执行与该方法相关联的指令列表中的全部事项来响应。\n\
  \n#### Java 方法\n\n如果你相信上一节中的所有内容，那么你已经准备好了解 Java 方法了。在 Java 中，*方法* 是一个待办事项列表。每个方法都有一个名称，你可以通过在程序中使用该方法的名称来告诉计算机执行列表中的事项。\n\
  \n我从未编写过让机器人修理发电机的程序。但如果我要编写，程序可能会包含一个名为 `fixTheAlternator` 的方法。我的 `fixTheAlternator`\
  \ 方法中的指令列表看起来会像清单 4-2 中的文本。\n\n清单 4-2 一个方法声明\n\n```\nvoid fixTheAlternator(onACertainCar)\
  \ {\ndriveInto(car, bay);\nlift(hood);\nget(wrench);\nloosen(alternatorBelt);\n\
  …\n}\n```\n\n在我的 Java 代码的其他地方（在清单 4-2 之外），我需要一条指令来调用我的 `fixTheAlternator` 方法。调用\
  \ `fixTheAlternator` 方法的指令可能类似于清单 4-3 中的一行。\n\n清单 4-3 调用一个方法\n\n```\nfixTheAlternator(junkyOldFord);\n\
  ```\n\n![警告](img/Image00004.jpg) 不要过于仔细地审视清单 4-2 和 4-3。清单 4-2 和 4-3 中的所有代码行都是虚构的！我编造了这些代码，使其看起来很像真实的\
  \ Java 代码，但并非真实代码。更重要的是，清单 4-2 和 4-3 中的代码并非旨在说明 Java 的所有规则。所以，如果你手头有怀疑的态度，请对清单 4-2\
  \ 和 4-3 持保留意见。\n\n![技术细节](img/Image00007.jpg) 几乎每种计算机编程语言都有类似于 Java 方法的东西。如果你使用过其他语言，你可能会记得子程序、过程、函数、子例程、`Sub`\
  \ 过程或 `PERFORM` 语句等概念。无论你在喜欢的编程语言中如何称呼它，*方法* 都是一组收集在一起并赋予新名称的指令。\n\n#### 声明、头部和调用\n\
  \n如果你对方法是什么以及它如何工作有了基本了解（参见上一节），你可以进一步深入一些有用的术语：\n\n\n\n\n\n* 如果我偷懒，我会把清单 4-2 中的代码称为`method`。如果我不偷懒，我会把这段代码称为`method\
  \ declaration`。\n* 清单 4-2 中的方法声明包含两部分。第一行（包含名称`fixTheAlternator`的部分，直到但不包括左花括号）称为`method\
  \ header`。清单 4-2 的其余部分（花括号包围的部分）是`method body`。\n* 术语`method declaration`将清单 4-2\
  \ 中的指令列表与清单 4-3 中的指令区分开来，后者被称为方法调用。\n\n有关所有方法术语的直观说明，请参见图 4-5。\n\n![image](img/Image00064.jpg)\n\
  \n图 4-5： 描述方法的术语。\n\n方法的头部和主体就像字典中的一个词条。词条本身并不真正使用它所定义的词。相反，词条告诉你如果使用这个词会发生什么：\n\
  \n* **chocolate** (choc-o-late) *n.* **1.** 地球上最容易上瘾的物质。**2.** 你用版税收入支付的东西。**3.**\
  \ 一个人饮食中最重要的营养元素。\n* **fixTheAlternator(onACertainCar)** 把车开进维修区，打开发动机盖，拿起扳手，松开交流发电机皮带，然后吃点巧克力。\n\
  \n相比之下，方法调用就像在句子中使用一个词。方法调用使某些代码开始执行：\n\n* “我要吃巧克力，不然我就发脾气。”\n* “fixTheAlternator\
  \ on that junkyOldFord。”\n\n![remember](img/Image00005.jpg) 方法的`声明`告诉计算机，如果你调用该方法执行，会发生什么。`方法调用`（一段独立的代码）告诉计算机实际调用该方法执行。方法的声明和方法的调用通常位于\
  \ Java 程序的不同部分。\n\n### 程序中的 main 方法\n\n在清单 4-1 中，大部分代码是一个名为`main`的方法的声明。（只需在代码的方法头部中查找单词`main`。）目前，不必担心方法头部中的其他单词——`public`、`static`、`void`、`String`和`args`。我将在接下来的几章中（按需）解释这些单词。\n\
  \n与任何 Java 方法一样，`main`方法是一个配方：\n\n* `如何制作饼干：`\n* `预热烤箱。`\n* `擀面团。`\n* `烘烤擀好的面团。`\n\
  \n或\n\n* `如何执行 ThingsILike 代码中的`\n* `主要指令：`\n* `在屏幕上显示 Chocolate, royalties, sleep。`\n\
  \n单词`main`在 Java 中扮演着特殊角色。特别是，你永远不会编写显式调用`main`方法的代码。单词`main`是当程序开始运行时自动被调用的方法名称。\n\
  \n当`ThingsILike`程序运行时，计算机会自动找到程序的`main`方法，并执行该方法主体内的任何指令。在`ThingsILike`程序中，`main`方法的主体只有一条指令。该指令告诉计算机在屏幕上打印`Chocolate,\
  \ royalties, sleep`。\n\n![remember](img/Image00005.jpg) 方法中的任何指令都不会被执行，直到该方法被调用。但是，如果你给一个方法命名为`main`，那么该方法会自动被调用。\n\
  \n### 你最终如何告诉计算机做某事\n\n在清单 4-1 的核心深处，有一行代码实际上向计算机发出了直接指令。这一行\n\n`System.out.println(\"\
  Chocolate, royalties, sleep\");`\n\n告诉计算机显示单词`Chocolate, royalties, sleep`。（如果你使用\
  \ Eclipse，计算机会在控制台视图中显示`Chocolate, royalties, sleep`。）我可以用至少两种不同的方式描述这行代码：\n\n*\
  \ **它是一个语句。** 在 Java 中，告诉计算机做某事的直接指令称为`statement`。清单 4-1 中的语句告诉计算机显示一些文本。其他程序中的语句可能告诉计算机将\
  \ 7 放入某个内存位置，或使窗口出现在屏幕上。计算机程序中的语句可以做各种各样的事情。\n* **它是一个方法调用。** 在本章前面，我描述了一个称为方法调用的东西。语句`fixTheAlternator(junkyOldFord);`是方法调用的一个例子，`System.out.println(\"\
  Chocolate, royalties, sleep\");`也是。Java 有许多不同类型的语句。方法调用只是其中一种。\n\n#### 用分号结束语句\n\
  \n在 Java 中，每个语句都以分号结束。清单 4-1 中的代码只有一条语句，因此清单 4-1 中只有一行以分号结束。\n\n以清单 4-1 中的任何其他行为例——例如方法头部。方法头部（包含单词`main`的那一行）并不直接告诉计算机做任何事情。相反，方法头部描述了一些供将来参考的操作。头部声明：“万一有人调用`main`方法，接下来的几行代码告诉你如何响应那个调用。”\n\
  \n![remember](img/Image00005.jpg) 每个完整的 Java 语句都以分号结束。方法调用是一个语句，因此它以分号结束，但方法头部和方法声明都不是语句。\n\
  \n#### 名为 System.out.println 的方法\n\n清单 4-1 中间的语句调用了一个名为`System.out.println`的方法。这个方法在\
  \ Java API 中定义。每当你调用`System.out.println`方法时，计算机就会在屏幕上显示文本。\n\n想想名字。信不信由你，我认识两个名叫\
  \ Pauline Ott 的人。一个是修女，另一个是物理学家。当然，英语世界中有很多叫 Pauline 的人，就像 Java API 中有几个名为`println`的东西一样。为了区分物理学家\
  \ Pauline Ott 和影评人 Pauline Kael，我写全名 Pauline Ott。为了区分修女和物理学家，我写“Sister Pauline Ott”。同样，我写`System.out.println`或`DriverManager.println`。第一个（你经常使用）在计算机屏幕上写文本。第二个（你在本书中根本不会用到）写入数据库日志文件。\n\
  \n正如 Pauline 和 Ott 本身就是名字一样，`System`、`out`和`println`也是 Java API 中的名字。但要使用`println`，你必须写方法的全名。你永远不会单独写`println`。它总是`System.out.println`或\
  \ API 名称的其他组合。\n\n![warning](img/Image00004.jpg) Java 编程语言是区分大小写的。如果你将小写字母改为大写字母（反之亦然），就会改变单词的含义。你不能将`System.out.println`替换为`system.out.Println`。如果这样做，你的程序将无法运行。\n\
  \n#### 方法，无处不在的方法\n\n在`ThingsILike`程序中，有两个方法发挥作用。图 4-6 说明了这种情况，接下来的几个要点将带你逐一了解。\n\
  \n* **有一个`main`方法的声明。** 我自己编写了`main`方法。每当我开始运行`ThingsILike`程序时，这个`main`方法会自动被调用。\n\
  * **有一个对`System.out.println`方法的调用。** 对`System.out.println`方法的调用是`main`方法主体中唯一的语句。换句话说，调用`System.out.println`方法是`main`方法待办事项列表中的唯一事项。\n\
  \n\n\n\n\n`System.out.println` 方法的声明隐藏在官方 Java API 中。如需复习 Java API，请参阅第 1 章。\n\n\
  ![image](img/Image00065.gif)\n\n图 4-6： 调用 `System.out.println` 方法。\n\n![technicalstuff](img/Image00007.jpg)\
  \ 当我说“`System.out.println` 隐藏在 API 中”时，我并没有公正地评价 API。诚然，你可以忽略 API 中所有琐碎的 Java 代码。你只需要记住\
