  \n#### 先写后读\n\n修改“我的文件在哪？”实验中的代码，使 `PrintStream diskWriter` 声明出现在 `Scanner diskScanner`\
  \ 声明之前。\n\n当你运行代码时，单词 `Hello` 应该出现在 Eclipse 的控制台视图中。运行代码后，检查以确保你的 Eclipse 项目包含一个名为\
