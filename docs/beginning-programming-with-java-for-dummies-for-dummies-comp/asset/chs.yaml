  *   根据清单 18-3 中的代码，`password`的值是`\"swordfish\"`。\n\n*   在图 18-3 中，作为对程序提示的响应，用户输入了`swordfish`。因此，在代码中，`userInput`的值是`\"\
  swordfish\"`。\n\n*   `if`语句检查条件`password == userInput`。因为两个变量都有值`\"swordfish\"`，条件*应该*为真，但是……\n\
  \n*   ……条件*并不*为真，因为程序的输出是`You’re a menace`。\n\n这是怎么回事？我尝试加强代码，看看是否能找到任何线索。密码检查程序的增强版在清单\
  \ 18-4 中，新版本的运行结果如图 18-4 所示。\n\n\n\n\n\n![image](img/Image00219.gif)\n\n图 18-4：\
  \ 这看起来更糟了。\n\n清单 18-4 尝试调试清单 18-3 中的代码\n\n```\nimport java.util.Scanner;\nimport\
  \ static java.lang.System.out;\nclass DebugCheckPassword {\npublic static void main(String\
  \ args[]) {\nScanner keyboard = new Scanner(System.in);\nString password = \"swordfish\"\
  ;\nString userInput;\nout.print(\"What’s the password? \");\nuserInput = keyboard.next();\n\
  out.println();\nout.print(\"You typed \");\nout.println(userInput);\nout.print(\"\
  But the password is \");\nout.println(password);\nout.println();\nif (password ==\
  \ userInput) {\nout.println(\"You’re okay!\");\n} else {\nout.println(\"You’re a\
  \ menace.\");\n}\nkeyboard.close();\n}\n}\n```\n\n哎呀！这次我被难住了。图 18-4 中的运行结果显示，`userInput`\
  \ 和 `password` 变量的值都是 `swordfish`。那么为什么程序不接受用户的输入呢？\n\n当你用双等号比较两个东西时，引用类型和基本类型的行为并不相同。例如，考虑\
  \ `int` 和 `String`：\n\n*   你可以用双等号比较两个 `int` 值。这样做时，结果完全符合你的预期。例如，以下代码中的条件为真：\n\n\
  \    ```\n    int apples = 7;\n    int oranges = 7;\n    if (apples == oranges)\
  \ {\n    System.out.println(\"They’re equal.\");\n    }\n    ```\n\n*   当你用双等号比较两个\
  \ `String` 值时，结果并不如你所愿。计算机不会检查两个 `String` 值是否包含相同的字母。相反，它会检查变量在内存中存储方式的某种深奥属性。\n\
  \n![remember](img/Image00005.jpg) 就你的目的而言，术语*引用类型*只是类的一个花哨名称。由于 `String` 在 Java\
  \ API 中被定义为一个类，所以我称 `String` 为引用类型。这个术语突出了基本类型（如 `int`）和类（即引用类型，如 `String`）之间的平行关系。\n\
  \n### 比较字符串\n\n在前面的要点中，`int` 和 `String` 之间的差异非常有趣。但如果双等号对 `String` 值不起作用，那么如何检查用户\
  \ Joe 是否输入了正确的密码呢？你可以使用清单 18-5 中的代码来实现。\n\n清单 18-5 调用对象的方法\n\n```\n/*\n* This program\
