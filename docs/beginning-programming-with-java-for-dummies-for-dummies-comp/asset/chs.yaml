  \ CheckPassword {\npublic static void main(String args[]) {\nScanner keyboard =\
  \ new Scanner(System.in);\nString password = \"swordfish\";\nString userInput;\n\
  out.print(\"What’s the password? \");\nuserInput = keyboard.next();\nif (password.equals(userInput))\
  \ {\nout.println(\"You’re okay!\");\n} else {\nout.println(\"You’re a menace.\"\
  );\n}\nkeyboard.close();\n}\n}\n```\n\n新的密码检查代码的运行结果如图 18-5 所示，让我告诉你，这真是如释重负！清单\
  \ 18-5 中的代码确实有效！当用户输入 `swordfish` 时，`if` 语句的条件为真。\n\n![image](img/Image00220.gif)\n\
  \n图 18-5： 终于，用户 Joe 可以登录了。\n\n### 关于类和方法的真相\n\n清单 18-5 中的神奇之处在于使用了名为 `equals` 的方法。我有两种方式解释\
  \ `equals` 方法：一种简单的方式，一种更详细的方式。首先，简单的方式：`equals` 方法将一个字符串中的字符与另一个字符串中的字符进行比较。如果字符相同，则\
  \ `if` 语句内的条件为真。仅此而已。\n\n![remember](img/Image00005.jpg) 不要使用双等号来比较两个 `String` 对象。相反，应使用其中一个对象的\
  \ `equals` 方法。\n\n要更详细地理解 `equals` 方法，请翻到第 17 章，查看图 17-7 和图 17-8。这些图说明了类、对象以及表格各部分之间的相似性。在图中，每一行代表一次购买，每一列代表购买所具有的特征。\n\
  \n你可以观察到任何类（包括 Java 的 `String` 类）都具有相同的相似性。事实上，图 17-7 对购买所做的描述，图 18-6 对字符串做了同样的描述。\n\
  \n![image](img/Image00221.jpg)\n\n图 18-6： 将 `String` 类和 `String` 对象视为表格的一部分。\n\n\
  图 18-6 中展示的内容比真实的 `String` 类故事简单得多。但图 18-6 提出了一个很好的观点。与图 17-7 中的购买一样，每个字符串都有自己的特征。例如，每个字符串都有一个\
  \ `value`（字符串中实际存储的字符），每个字符串都有一个 `count`（字符串中存储的字符数）。你不能真的写出下面这行代码，因为图 18-6 中的内容省略了一些微妙的细节：\n\
  \n```\n//This code does NOT work:\nSystem.out.println(password.count);\n```\n\n\
  无论如何，图 18-6 中的每一行都有三个项目：一个 `value`、一个 `count` 和一个 `equals` 方法。因此，表格的每一行包含的不仅仅是数据。每一行都包含一个\
  \ `equals` 方法，一种对数据进行有用操作的方式。就好像每个对象（`String` 类的每个实例）都有三样东西：\n\n*   一串字符（对象的 `value`）\n\
  \n*   一个数字（对象的 `count`）\n\n*   一种与其他字符串进行比较的方式（对象的 `equals` 方法）\n\n这就是面向对象编程的本质。每个字符串都有自己的\
  \ `equals` 方法副本。例如，在清单 18-5 中，`password` 字符串有自己的 `equals` 方法。当你调用 `password` 字符串的\
  \ `equals` 方法并将 `userInput` 字符串放在方法的括号中时，该方法会比较这两个字符串，看它们是否包含相同的字符。\n\n清单 18-5 中的\
  \ `userInput` 字符串也有一个 `equals` 方法。我可以使用 `userInput` 字符串的 `equals` 方法将其与 `password`\
  \ 字符串进行比较。但我没有这样做。事实上，在清单 18-5 中，我根本没有使用 `userInput` 字符串的 `equals` 方法。（要比较 `userInput`\
  \ 和 `password`，我必须使用 `password` 字符串的 `equals` 方法或 `userInput` 字符串的 `equals` 方法。所以我做了一个任意的选择：我选择了\
  \ `password` 字符串的方法。）\n\n### 调用对象的方法\n\n在第 17 章中，我创建了一个 `Purchase` 类：\n\n```\nclass\
  \ Purchase {\ndouble unitPrice;\nint quantity;\nboolean taxable;\n}\n```\n\n我将 `unitPrice`\
  \ 变量、`quantity` 变量和 `taxable` 变量称为 `Purchase` 类的*字段*。\n\n调用字符串的 `equals` 方法类似于获取购买的\
  \ `unitPrice`。无论是 `equals` 还是 `unitPrice`，你都会用到你的老朋友——点号。例如，在清单 17-3（第 17 章中）中，你编写了\n\
  \n`onePurchase.unitPrice = keyboard.nextDouble();`\n\n而在清单 18-5 中，你编写了\n\n`if (password.equals(userInput))`\n\
  \n\n\n\n点号对于对象的字段和方法的作用是相同的。无论哪种情况，点号都会作用于对象并选取该对象的某个部分。无论该部分是字段（如 `onePurchase.unitPrice`）还是方法（如\
  \ `password.equals`），它都有效。\n\n事实上，字段和方法在许多方面非常相似，因此用一个词来统称字段和方法会很方便。这个词就是*成员*。在第\
  \ 17 章中，`Purchase` 类有三个成员：`unitPrice`、`quantity` 和 `taxable`。而在 Java API 中，`String`\
  \ 类大约有 60 个成员，其中之一是 `equals`。\n\n### 组合与使用数据\n\n在本章的这个位置，我终于可以说：“我早就告诉过你。”以下是第 17\
