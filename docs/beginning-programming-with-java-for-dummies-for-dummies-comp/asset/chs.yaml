  \ 号房间有 0 位客人，2 号房间有 2 位客人，3 号房间有 2 位客人。以此类推，直到文件中的最后一个数字。根据那个数字，九楼的 20 号房间有 4 位客人。\n\
  \n你希望这些数字显示得更有序一些——就像图 15-5 中那样的显示。于是你拿出键盘，快速编写一个 Java 程序。\n\n![image](img/Image00188.jpg)\n\
