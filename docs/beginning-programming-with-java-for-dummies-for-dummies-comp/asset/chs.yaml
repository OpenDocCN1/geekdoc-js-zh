  \ `.close();`\n\n- **在调用 `close` 时使用 `PrintStream` 变量名。**  \n  例如，要从清单 13-1 转到清单\
  \ 13-2，我在 `main` 方法的末尾添加  \n  `diskWriter` `.close();`\n\n### 从文件读取\n\n所有 `Scanner`\
