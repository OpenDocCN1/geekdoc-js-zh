  \ Java 的信息**\n\n难怪网络如此受欢迎。它既实用又有趣。本章通过列出十个实用且有趣的网站来证明这一点。每个网站都有资源帮助你更有效地使用 Java。据我所知，这些网站都没有使用广告软件、弹出窗口或其他令人讨厌的东西。\n\
