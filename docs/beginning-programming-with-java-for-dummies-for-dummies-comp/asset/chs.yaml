  \ 20 个数字的操作会重复 9 次。这很好，正是我想要的。\n\n![动手试试](img/Image00006.jpg) 在编写循环代码时，多练习总没有坏处。尝试解决以下问题。慢慢来，不要气馁。记住，答案可以在\
