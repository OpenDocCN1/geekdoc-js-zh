  \n`System.out.println(who);`\n\n\n\n\n直到`main`方法的末尾，程序会显示`home`、`visitor`或`neither`中的一个单词。尝试创建一个名为`Color`的`enum`，其值为`green`、`yellow`和`red`。编写一个程序，询问`What\
