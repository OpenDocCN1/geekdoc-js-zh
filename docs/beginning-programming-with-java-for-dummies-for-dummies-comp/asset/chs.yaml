  \ 0 和 1，它的算术运算方式与我们习惯的方式不太一样。那么如何解决这个问题呢？\n\nJava API 中有一个名为 `NumberFormat` 的类，而\
  \ `NumberFormat` 类有一个名为 `getCurrencyInstance` 的静态方法。当你调用 `NumberFormat.getCurrencyInstance()`（括号内为空）时，你会得到一个对象，该对象可以将数字格式化为美国货币金额。清单\
