  504.  533\n505.  534\n506.  535\n507.  536\n508.  537\n509.  538\n\n# 引言\n\n你的故事是什么？\n\
  \n*   你是一位在职员工，想进一步了解公司电脑的工作方式吗？\n*   你是一位学生，需要额外阅读才能通过计算机入门课程吗？\n*   你是一位典型的电脑用户——已经做过大量文字处理，想用电脑做点更有趣的事情吗？\n\
  *   你是一位求职者，对进入快节奏、光鲜亮丽、备受瞩目的计算机编程世界（或者至少是收入不错的计算机编程世界）感兴趣吗？\n\n那么，如果你想编写计算机程序，这本书就是为你准备的。本书摒弃了那种“你当然已经知道”的高傲假设，从头开始讲解计算机编程。\n\
  \n## 关于本书\n\n本书使用 Java——一种功能强大的通用计算机编程语言。但本书的重点并非 Java 的细微之处和古怪特性，而是强调一个过程——为计算机创建指令的过程。许多高深莫测的书籍描述了这一过程的机制——规则、约定和形式。但这些书并非为普通人而写，它们无法带你从现有水平达到你想要的目标。\n\
  \n在本书中，我几乎不假设你对计算机有任何经验。当你阅读每一节时，你会看到我的思考过程。你会看到我面临的问题、我的想法以及我找到的解决方案。有些问题是我记得自己作为新手时遇到的；另一些问题则是我作为专家时遇到的。我帮助你理解，帮助你想象，并帮助你自行创建解决方案。我甚至还会讲几个有趣的故事。\n\
  \n## 如何使用本书\n\n我希望我能说：“翻开本书的任意一页，开始编写 Java 代码。只需填空，无需回头。”从某种意义上说，这是真的。编写 Java 代码不会破坏任何东西，所以你随时可以自由尝试。\n\
  \n但我必须诚实：如果你不了解全局，编写程序会很困难。任何计算机编程语言都是如此，不仅仅是 Java。如果你在不知道代码含义的情况下输入代码，而代码又没有完全按照你的意愿执行，那你就会陷入困境。\n\
  \n在本书中，我将编程划分为可管理的块。每个块（大致）对应一章。你可以从任何地方开始阅读——第 5 章、第 10 章或其他地方。你甚至可以从一章的中间开始探索。我尽量让示例有趣，同时避免章节之间的依赖。当我用到另一章的重要概念时，我会添加注释来帮助你找到方向。\n\
  \n总的来说，我的建议如下：\n\n*   如果你已经知道某些内容，就不必费心去读。\n*   如果你感到好奇，不要害怕跳过。如果确实需要，你可以随时回头翻阅前面的章节。\n\
  \n## 本书使用的约定\n\n几乎每本技术书都会以字体图例开头，《傻瓜式 Java 编程入门（第 5 版）》也不例外。以下是本书中使用的字体简要说明：\n\n\
  *   新术语以*斜体*表示。\n*   当我希望你输入简短内容或执行某个步骤时，我会使用**粗体**。\n*   你还会看到这种`计算机字体`。我使用计算机字体表示\
  \ Java 代码、文件名、网页地址（URL）、屏幕消息以及其他类似内容。此外，如果需要输入的内容很长，它会单独一行（或几行）以计算机字体显示。\n*   当你自己在电脑键盘上输入时，需要更改某些内容。例如，我可能会要求你输入\n\
  \n    `class Anyname`\n\n    这意味着你应该输入 **class**，然后输入你自己命名的名称。需要替换为你自己单词的内容将以*`斜体计算机字体`*显示。\n\
  \n## 你不必阅读的内容\n\n选择第一章或第一节中你尚未了解的内容开始阅读。当然，你可能和我一样讨厌做决定。如果是这样，你可以遵循以下指南：\n\n*  \
  \ 如果你已经知道计算机编程是什么，可以跳过第 1 章的前半部分。相信我，我不会介意。\n*   如果你需要使用 Eclipse 以外的开发环境，可以跳过第 2\
  \ 章。这适用于你计划使用 NetBeans、IntelliJ IDEA 或其他开发环境的情况。\n\n    本书中的大多数示例需要 Java 5.0 或更高版本，部分示例需要\
  \ Java 7 或更高版本。因此，请确保你的系统使用 Java 7 或更高版本。如果你不确定电脑的 Java 版本，或者你有选择开发环境的余地，最稳妥的做法是阅读第\
  \ 3 章。\n\n*   如果你已经做过一些计算机编程，可以快速浏览第 6 章、第 7 章和第 8 章。然后深入阅读第 9 章，看看是否觉得轻松。（如果是，继续往下读。如果不是，再快速浏览一遍第\
  \ 6 章、第 7 章和第 8 章。）\n*   如果你觉得用 Java 以外的语言编写程序很轻松，那么这本书不适合你。请将本书作为纪念品，并购买我的《Java\
  \ 编程入门（第 7 版）》（同样由 Wiley 出版）。\n\n如果你想跳过侧边栏和标有“技术细节”图标的材料，请随意。事实上，如果你想跳过任何内容，都可以。\n\
  \n## 愚蠢的假设\n\n在本书中，我对你（读者）做了一些假设。如果其中某个假设不正确，你大概也没问题。如果所有这些假设都不正确……嗯，还是买这本书吧。\n\n\
  *   **我假设你有一台电脑。** 好消息是，你几乎可以在任何电脑上运行本书中的代码。唯一不能运行这些代码的电脑是那些超过八年（左右）的老古董。你可以在 Windows、Macintosh\
  \ 和 Linux 电脑上运行最新版本的 Java。\n*   **我假设你能操作电脑的常用菜单和对话框。** 你不必是 Windows、Linux 或 Macintosh\
  \ 的高级用户，但你应该能够启动程序、查找文件、将文件放入特定目录等。大多数时候，当你练习本书中的内容时，你是在键盘上输入代码，而不是用鼠标点击。\n\n  \
  \  在极少数需要拖放、剪切粘贴或即插即用的情况下，我会仔细引导你完成步骤。但你的电脑可能有数十亿种配置方式，我的说明可能不完全适合你的特殊情况。因此，当你遇到这些特定平台的任务时，请尝试按照本书中的步骤操作。如果步骤不完全适用，请给我发送电子邮件，或查阅针对你系统定制的书籍。\n\
  \n*   **我假设你能进行逻辑思考。** 计算机编程的全部内容就是逻辑思考。如果你能逻辑思考，你就成功了。如果你不相信自己能逻辑思考，请继续读下去。你可能会感到惊喜。\n\
  \n\n\n\n\n*   **我假设你对计算机编程知之甚少或一无所知。** 这不是那种“适合所有人的万能”书籍。我不会在取悦新手的同时戏弄专家。我特意将这本书面向新手——那些从未编程过或对编程感到不自在的人。如果你属于这类人，那么你读对了书。\n\
  \n## 本书的组织结构\n\n本书分为若干小节，小节组成节，节构成章，最后章汇总成五个部分。（写书时，你会非常熟悉书的结构。经过数月的写作，你会在晚上睡觉时梦见章节和部分。）本书的各部分列举如下。\n\
  \n### 第 1 部分：Java 编程入门\n\n第 1 部分中的章节为你做好整体编程体验的准备。在这些章节中，你将了解编程是什么，并让你的计算机准备好编写和测试程序。\n\
  \n### 第 2 部分：编写你自己的 Java 程序\n\n本部分涵盖基本构建块——任何 Java 程序以及任何使用类似 Java 语言编写的程序中的元素。在本部分中，你将发现如何表示数据以及如何从现有值中获取新值。程序示例简短但有趣。\n\
  \n### 第 3 部分：控制流程\n\n第 3 部分包含了我最喜欢的几章。在这些章节中，你让计算机从程序的一个部分导航到另一个部分。把你的程序想象成一座大宅邸，计算机在各个房间之间移动。有时计算机需要在两条或多条走廊之间做出选择，有时计算机会重新访问房间。作为程序员，你的工作是规划计算机在宅邸中的巡视路线。这非常有趣。\n\
  \n### 第 4 部分：使用程序单元\n\n你是否曾通过将一个大问题分解成更小、更易管理的部分来解决它？这正是你在本书第 4 部分中所做的。你将发现将编程问题分解成部分的最佳方法，并为新找到的部分创建解决方案。你还将了解如何使用他人的解决方案。这感觉像偷窃，但并非如此。\n\
  \n本部分还包含一章关于使用窗口、按钮和其他图形项进行编程的内容。如果你的鼠标觉得本书中的示例忽略了它，请阅读第 20 章。\n\n### 第 5 部分：十大要点\n\
  \n“十大要点”部分是一个小小的初学者糖果店。在“十大要点”中，你可以找到列表——技巧、资源以及各种有趣好东西的列表。\n\n我在[`www.dummies.com`](http://www.dummies.com/)上添加了一篇文章，帮助你熟悉\
  \ Java 文档（准确地说，是[`www.dummies.com/programming/java/making-sense-of-javas-api-documentation`](http://www.dummies.com/programming/java/making-sense-of-javas-api-documentation/)）。没有\
  \ Java 编程文档，我无法编写程序。事实上，没有那些至关重要的文档，任何 Java 程序员都无法编写程序。这些文档采用网页格式，因此易于查找和导航。但如果你不熟悉所有术语，文档可能会让人不知所措。\n\
  \n## 本书使用的图标\n\n如果你能看到我写这本书，你会看到我坐在电脑前自言自语。我在脑海中把每个句子重复好几遍。当我有额外的想法、旁白或不属于常规内容的东西时，我会稍微歪一下头。这样，任何听我说话的人（通常没人）都知道我暂时跑题了。\n\
  \n当然，在印刷品中，你看不到我歪头。我需要另一种方式将旁白想法单独放在一边。我用图标来实现。当你看到“提示”图标或“记住”图标时，你就知道我在快速绕道。\n\n\
