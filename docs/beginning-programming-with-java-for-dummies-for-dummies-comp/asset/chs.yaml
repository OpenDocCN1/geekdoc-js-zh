  \ **显示图像**\n\n![check](img/Image00002.jpg) **使用按钮和文本框**\n\n有一个关于马戏团杂技演员跳过老鼠的经典老笑话。不幸的是，如果我把这个笑话写进这本书里，可能会因版权侵权而被起诉。\n\
  \n无论如何，这个笑话是关于从小处着手，逐步迈向更大的目标。这正是你阅读《Java 编程入门（第 5 版）》时所做的事情。\n\n本书中的大多数程序都是基于文本的。*基于文本的*程序没有窗口，没有对话框——没有任何这类东西。在基于文本的程序中，用户在控制台视图中输入字符，程序在同一控制台视图中显示输出。\n\
  \n如今，很少有公开可用的程序是基于文本的。几乎所有程序都使用*GUI*——*图形用户界面*。因此，如果你已经读完了本书的每一页，你可能会对自己说：“我什么时候才能知道如何创建\
  \ GUI 呢？”\n\n好吧，现在就是时候了！本章将向你介绍 Java 中的 GUI 编程世界。\n\n![ontheweb](img/Image00008.jpg)\
  \ 你可以通过访问本书的网站（[`http://allmycode.com/BeginProg`](http://allmycode.com/BeginProg)）查看本书许多示例的\
  \ GUI 版本。\n\n### Java Swing 类\n\nJava 的*Swing*类在计算机屏幕上创建图形对象。这些对象可以包括按钮、图标、文本字段、复选框以及其他使窗口如此有用的好东西。\n\
  \nSwing 这个名字并不是首字母缩写。当 Java 编程语言的守护者们最初为这些类创建代码时，其中一位开发者将其命名为 Swing，因为摇摆乐正在经历怀旧复兴。是的，除了`String`和`Swing`，标准\
  \ Java API 中还有一个`Spring`类和一个 Spring 框架。但那是另一个故事了。\n\n实际上，Java 的 API 有若干组窗口组件。详情请参见附近的“Java\
  \ GUI”边栏。\n\n### 在屏幕上显示图像\n\n清单 20-1 中的程序在你的计算机屏幕上显示一个窗口。要查看该窗口，请看图 20-1。\n\n![image](img/Image00237.jpg)\n\
  \n图 20-1： 多漂亮的窗口！\n\n清单 20-1 中的代码本身逻辑很少。相反，这段代码将 Java API 中的一组类组合在一起。\n\n清单 20-1\
  \ 创建一个包含图像的窗口\n\n```\nimport javax.swing.JFrame;\nimport javax.swing.ImageIcon;\n\
  import javax.swing.JLabel;\n\nclass ShowPicture {\n    public static void main(String\
  \ args[]) {\n        JFrame frame = new JFrame();\n        ImageIcon icon = new\
  \ ImageIcon(\"androidBook.jpg\");\n        JLabel label = new JLabel(icon);\n  \
  \      frame.add(label);\n        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \        frame.pack();\n        frame.setVisible(true);\n    }\n}\n```\n\n在清单 17-3（第\
  \ 17 章）中，我通过以下行创建了`Purchase`类的实例：\n\n`Purchase onePurchase = new Purchase();`\n\n\
  在清单 20-1 中，我做了同样的事情——通过以下行创建了`JFrame`、`ImageIcon`和`JLabel`类的实例：\n\n\n\n\n\n`JFrame\
  \ frame = new JFrame();`\n\n`ImageIcon icon = new ImageIcon(\"androidBook.jpg\"\
  );`\n\n`JLabel label = new JLabel(icon);`\n\n以下是关于这几行代码的一些“八卦”：\n\n*   `JFrame`\
  \ 就像一个窗口（只不过它叫 `JFrame`，而不是窗口）。在清单 20-1 中，`JFrame frame = new JFrame();` 这行代码创建了一个\
  \ `JFrame` 对象，但这行代码并没有在任何地方显示这个 `JFrame` 对象。（显示操作在后面的代码中。）\n\n*   `ImageIcon` 对象是一张图片。在程序项目目录的根目录下，我有一个名为\
  \ `androidBook.jpg` 的文件。该文件包含图 20-1 中显示的图片。因此，在清单 20-1 中，`ImageIcon icon = new ImageIcon(\"\
  androidBook.jpg\");` 这行代码创建了一个 `ImageIcon` 对象——一个包含 `androidBook.jpg` 图片的图标。\n\n\
  \    ![remember](img/Image00005.jpg) 出于某种我永远无法理解的原因，你在运行清单 20-1 时可能不想使用我的 `androidBook.jpg`\
  \ 图片文件。你可以使用几乎任何 `.gif`、`.jpg` 或 `.png` 文件来替换我（可爱的）Android 书籍封面图片。为此，请将你自己的图片文件拖到\
  \ Eclipse 的 Package Explorer 中。（拖到这个示例项目文件夹的根目录。）然后，在 Eclipse 编辑器中，将名称 `androidBook.jpg`\
  \ 改为你自己的图片文件名。就这么简单！\n\n*   我需要一个地方来放置图标。我可以把它放在一个叫做 `JLabel` 的东西上。因此，在清单 20-1 中，`JLabel\
  \ label = new JLabel(icon);` 这行代码创建了一个 `JLabel` 对象，并将 `androidBook.jpg` 图标放在这个新标签的表面上。\n\
  \n如果你读了前面的要点，可能会产生一个错误的印象。这些措辞可能暗示每个组件（`JFrame`、`ImageIcon`、`JLabel` 等）的使用都是你已知知识的逻辑延伸。“你把\
  \ `ImageIcon` 放在哪里？嗯，当然，你把它放在 `JLabel` 上。”当你长时间努力使用 Java 的 Swing 组件后，所有这些事情对你来说都会变得自然。但在那之前，你需要在\
  \ Java 的 API 文档中查找一切。\n\n![remember](img/Image00005.jpg) 你永远不需要记住 Java API 类的名称或特性。相反，你应该随时准备好\
  \ Java 的 API 文档。当你需要了解某个类时，就在文档中查找它。如果你经常需要某个类，你就会记住它的特性。对于不常用的类，你总是有文档可以参考。\n\n\
  关于使用 Java API 文档的技巧，请参阅我的文章《理解 Java API 文档》，网址为 [`www.dummies.com/programming/java/making-sense-of-javas-api-documentation`](http://www.dummies.com/programming/java/making-sense-of-javas-api-documentation)。\n\
  \n### 只是另一个类\n\n什么是 `JFrame`？像任何其他类一样，`JFrame` 有几个部分。关于其中一些部分的简化视图，请参见图 20-2。\n\n\
  ![image](img/Image00238.jpg)\n\n图 20-2： `JFrame` 类的简化描述。\n\n与图 18-6（在第 18 章）中的 `String`\
  \ 一样，`JFrame` 类既有字段也有方法。字段包括框架的高度和宽度。方法包括 `add`、`setDefaultCloseOperation`、`pack`\
  \ 和 `setVisible`。总的来说，`JFrame` 类大约有 320 个方法。\n\n由于本书中不便详述的技术原因，你不能使用点号来引用框架的高度或宽度。但你可以使用那些臭名昭著的点号来调用许多\
  \ `JFrame` 方法。在清单 20-1 中，我通过编写 `add(label)`、`frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE)`、`frame.pack()`\
  \ 和 `frame.setVisible(true)` 来调用框架的方法。\n\n以下是关于清单 20-1 中 `JFrame` 方法的详细说明：\n\n*\
  \   `frame.add(label)` 调用将标签放到框架上。标签显示我的 `androidBook.jpg` 图片，因此这个调用使图片出现在框架上。\n\
  \n*   调用 `frame.setDefaultCloseOperation` 告诉 Java 当你试图关闭框架时该怎么做。（在 Windows 中，你点击标题栏右上角的\
  \ X。在 Mac 上，X 在框架的左上角。）对于作为更大应用程序一部分的框架，你可能希望点击 X 时框架消失，但你可能不希望应用程序停止运行。\n\n   \
  \ 但在清单 20-1 中，框架就是整个应用程序——全部内容。当你点击 X 时，你希望 Java 虚拟机自行关闭。为此，你调用 `setDefaultCloseOperation`\
  \ 方法，参数为 `JFrame.EXIT_ON_CLOSE`。其他选项如下：\n\n    *   `JFrame.HIDE_ON_CLOSE`：框架消失，但它仍然存在于计算机内存中。\n\
  \n    *   `JFrame.DISPOSE_ON_CLOSE`：框架消失，并且不再存在于计算机内存中。\n\n    *   `JFrame.DO_NOTHING_ON_CLOSE`：框架仍然显示，仍然存在，并且仍然执行你在点击\
  \ X 之前所做的所有操作。点击 X 时什么也不会发生。因此，使用这个 `DO_NOTHING_ON_CLOSE` 选项，你可能会变得相当困惑。\n\n   \
  \ ![warning](img/Image00004.jpg) 如果你不调用 `setDefaultCloseOperation`，Java 会自动选择 `HIDE_ON_CLOSE`\
  \ 选项。当你点击 X 时，框架消失，但 Java 程序继续运行。当然，由于没有可见的框架，清单 20-1 的运行不会做太多事情。运行唯一明显的效果是你的开发环境的行为。在\
  \ Eclipse 中，Console 视图工具栏上的小方块保持鲜红色。当你将鼠标悬停在该方块上时，会看到“终止”工具提示。要结束 Java 程序的运行（并将方块恢复为褪色的红灰色），只需点击这个小方块。\n\
  \n*   框架的 `pack` 方法将框架收缩包裹在已添加到框架的内容周围。如果不调用 `pack`，框架可能会比必要的大得多或小得多。\n\n    不幸的是，默认情况下框架会比必要的小得多。如果在清单\
  \ 20-1 中，你忘记调用 `frame.pack`，你会得到图 20-3 中显示的小框架。当然，你可以通过用鼠标拖动框架的边缘来放大框架。但为什么你必须这样做呢？只需调用\
  \ `frame.pack` 即可。\n\n*   调用 `setVisible(true)` 使框架出现在你的屏幕上。如果你忘记调用 `setVisible(true)`（我经常这样），当你运行清单\
  \ 20-1 中的代码时，屏幕上什么也看不到。这总是令人不安，直到你弄清楚自己做错了什么。\n\n![image](img/Image00239.jpg)\n\n\
