  \ Eclipse 的控制台视图中显示它们。\n\n第 14 章\n\n## 创建循环中的循环\n\n本章内容\n\n![check](img/Image00002.jpg)\
  \ **分析循环策略**\n\n![check](img/Image00002.jpg) **诊断循环问题**\n\n![check](img/Image00002.jpg)\
  \ **创建嵌套循环**\n\n如果你是 John Wiley & Sons, Inc. 的编辑，请不要阅读接下来的几段。在接下来的几段中，我将泄露一个重要的行业秘密（你绝对不希望我这么做）。\n\
  \n我将描述一个编写畅销《傻瓜》系列书籍的万无一失的流程。流程如下：\n\n写几个词组成一个句子。重复几次组成一个段落。\n\n*`重复以下步骤以形成一个段落：`*\n\
  \n*`重复以下步骤以形成一个句子：`*\n\n*`写一个词。`*\n\n重复前面的指令几次以形成一个章节。制作几个章节，然后制作几个章节。\n\n*`重复以下步骤以形成一本畅销的《傻瓜》系列书籍：`*\n\
  \n*`重复以下步骤以形成一个章节：`*\n\n*`重复以下步骤以形成一个部分：`*\n\n*`重复以下步骤以形成一个段落：`*\n\n*`重复以下步骤以形成一个句子：`*\n\
  \n*`写一个词。`*\n\n这个过程涉及一个循环中的循环中的循环中的循环中的循环。这就像是一幅语言版的 M.C. 埃舍尔版画。它是有用的，还是无聊的？\n\n\
  嗯，在计算机编程的世界里，这种事情经常发生。大多数五层循环都隐藏在方法调用后面，但两层循环嵌套在日常编程中很常见。因此，本章将告诉你如何编写循环中的循环。这是非常有用的内容。\n\
  \n顺便说一句，如果你是 Wiley 的编辑，从现在开始你可以继续阅读了。\n\n## 回顾你的旧代码\n\n第 12 章中的清单 12-5 程序从电子邮件地址中提取用户名。例如，程序从键盘读取\n\
  \n`John@BurdBrain.com`\n\n并将\n\n`John`\n\n写入屏幕。让我告诉你，在这本书中，我编写程序有一些相当蹩脚的借口，但这个简单的电子邮件示例是最蹩脚的！为什么你会想在键盘上输入一些内容，然后让计算机只显示你输入的一部分？这种代码一定有更好的用途。\n\
  \n确实有。BurdBrain.com 网络管理员有一个包含 10,000 名员工电子邮件地址的列表。更准确地说，管理员的硬盘上有一个名为 `email.txt`\
  \ 的文件。该文件包含 10,000 个电子邮件地址，每行一个地址，如图 14-1 所示。\n\n![image](img/Image00175.jpg)\n\n\
  图 14-1: 电子邮件地址列表。\n\n公司的电子邮件软件有一个有趣的功能。要在公司内部发送电子邮件，你不需要输入完整的电子邮件地址。例如，要发送电子邮件给\
  \ John，你可以输入用户名 `John` 而不是 `John@BurdBrain.com`。（这个 `@BurdBrain.com` 部分被称为*主机名*。）\n\
  \n公司的网络管理员想要提炼 `email.txt` 文件的内容。她想要一个新文件 `usernames.txt`，其中只包含用户名而不包含主机名，如图 14-2\
  \ 所示。\n\n![image](img/Image00176.jpg)\n\n图 14-2: 从电子邮件地址列表中提取的用户名。\n\n### 重写一些现有代码\n\
  \n为了解决管理员的问题，你需要修改清单 12-5 中的代码。新版本从磁盘文件获取电子邮件地址，并将用户名写入另一个磁盘文件。新版本在清单 14-1 中。\n\n\
  清单 14-1 从一个文件到另一个文件\n\n```java\nimport java.util.Scanner;\nimport java.io.File;\n\
  import java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\nclass ListOneUsername\
  \ {\n    public static void main(String args[]) throws FileNotFoundException {\n\
  ```\n\n\n\n\n\n`Scanner diskScanner = new Scanner(new File(\"email.txt\"));`\n`PrintStream\
  \ diskWriter = new PrintStream(\"usernames.txt\");`\n`char symbol;`\n`symbol = diskScanner.findWithinHorizon(\"\
  .\",0).charAt(0);`\n`while (symbol != ’@’) {`\n`diskWriter.print(symbol);`\n`symbol\
  \ = diskScanner.findWithinHorizon(\".\",0).charAt(0);`\n`}`\n`diskWriter.println();`\n\
  `diskScanner.close();`\n`diskWriter.close();`\n`}`\n`}`\n\n清单 14-1 的功能与清单 12-5 中的前身几乎相同。唯一的区别在于，清单\
  \ 14-1 中的代码不与用户交互，而是与磁盘文件交互。\n\n### 运行你的代码\n\n以下是运行清单 14-1 中代码的步骤：\n\n1. **在你的 Eclipse\
  \ 项目目录中创建一个名为** `email.txt` **的文件。**\n\n   在 `email.txt` 文件中，只放入一个电子邮件地址。只要地址包含\
  \ @ 符号，任何地址都可以。\n\n2. **将** `ListOneUsername.java` **文件（来自****清单 14-1** **的代码）放入项目的**\
  \ `src/(default package)` **目录中。**\n\n3. **运行****清单 14-1** **中的代码。**\n\n   运行代码时，控制台视图中不会显示任何有趣的内容。真可惜！\n\
  \n4. **查看** `usernames.txt` **文件的内容。**\n\n   如果你的 `email.txt` 文件包含 `John@BurdBrain.com`，那么\
  \ `usernames.txt` 文件将包含 `John`。\n\n有关这些步骤的更多详细信息，请参阅第 13 章中伴随清单 13-2、13-3 和 13-4\
  \ 的讨论。（如果你不知道如何查看 `usernames.txt` 文件的内容，该讨论尤其有用。）\n\n## 创建有用的代码\n\n上一节描述了一个网络管理员的问题——从一个包含电子邮件地址的文件中创建一个包含用户名的文件。清单\
  \ 14-1 中的代码解决了部分问题——它只提取了一个电子邮件地址。这是一个好的开始，但为了只获取一个用户名，你并不需要计算机程序。用铅笔和纸就能搞定。\n\n\
  别再让网络管理员久等了。在本节中，你将开发一个程序，处理硬盘驱动器上文件中的数十、数百甚至数千个电子邮件地址。\n\n首先，你需要一个创建程序的策略。将清单 14-1\
  \ 中的语句反复运行。更好的是，让这些语句自己反复运行。幸运的是，你已经知道如何反复做某件事：使用循环。（关于循环的基础知识，请参阅第 12 章。）\n\n策略如下：将清单\
  \ 14-1 中的语句放入一个更大的循环中：\n\n```\nwhile (*未到达 email.txt 文件末尾*) {\n  *执行清单 14-1 中的语句*\n\
  }\n```\n\n回顾清单 14-1 中的代码，你会发现这些语句本身也有一个 `while` 循环。因此，这个策略涉及将一个循环放入另一个循环中：\n\n```\n\
  while (*未到达 email.txt 文件末尾*) {\n  // 等等\n  while (symbol != ’@’) {\n    // 等等等等\n\
  \  }\n  // 等等等等等等\n}\n```\n\n因为一个循环在另一个循环内部，所以它们被称为*嵌套循环*。旧的循环（`symbol != ’@’` 循环）是*内层循环*。新的循环（文件末尾循环）称为*外层循环*。\n\
  \n### 检查文件是否结束\n\n现在你只需要一种测试循环条件的方法。如何知道是否到达了 `email.txt` 文件的末尾？\n\n答案来自 Java 的\
  \ `Scanner` 类。该类的 `hasNext` 方法对以下问题回答 `true` 或 `false`：\n\n> `email.txt` 文件中是否还有（除了你已经读取的内容之外的）内容可读？\n\
  \n如果程序的 `findWithinHorizon` 调用尚未消耗掉 `email.txt` 文件中的所有字符，那么 `diskScanner.hasNext()`\
  \ 的值为 `true`。因此，要在未到达 `email.txt` 文件末尾时持续循环，你可以这样做：\n\n```\nwhile (diskScanner.hasNext())\
  \ {\n  *执行清单 14-1 中的语句*\n}\n```\n\n该策略的首次实现见清单 14-2。\n\n清单 14-2 两个循环的机械组合\n\n```\n\
  /*\n * 此代码无法工作（但你可以从错误中学习）。\n */\nimport java.util.Scanner;\nimport java.io.File;\n\
  import java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\nclass ListAllUsernames\
  \ {\n  public static void main(String args[]) throws FileNotFoundException {\n \
  \   Scanner diskScanner = new Scanner(new File(\"email.txt\"));\n    PrintStream\
  \ diskWriter = new PrintStream(\"usernames.txt\");\n    char symbol;\n\n    while\
  \ (diskScanner.hasNext()) {\n      symbol = diskScanner.findWithinHorizon(\".\"\
  ,0).charAt(0);\n      while (symbol != ’@’) {\n        diskWriter.print(symbol);\n\
  \        symbol = diskScanner.findWithinHorizon(\".\",0).charAt(0);\n      }\n \
  \     diskWriter.println();\n    }\n\n    diskScanner.close();\n    diskWriter.close();\n\
  \  }\n}\n```\n\n当你运行清单 14-2 中的代码时，会得到如图 14-3 所示的令人失望的响应。\n\n![image](img/Image00177.gif)\n\
  \n图 14-3: 你搞砸了。\n\n### 模拟计算机的感受\n\n清单 14-2 中的代码有什么问题？为了找出原因，我来扮演计算机。“如果我是计算机，在执行清单\
  \ 14-2 中的代码时，我会做什么？”\n\n我首先会做的几件事如图 14-4 所示。我会读取 `John` 中的 `J`，然后写入 `John` 中的 `J`，接着读取字母\
  \ `o`（也在 `John` 中）。\n\n![image](img/Image00178.gif)\n\n图 14-4: 模拟清单 14-2 中的代码。\n\
  \n经过几次内层循环后，我会遇到 `John@BurdBrain.com` 中的 @ 符号，如图 14-5 所示。\n\n![image](img/Image00179.gif)\n\
  \n图 14-5: 到达用户名的末尾。\n\n找到这个 @ 符号会让我跳出内层循环，回到外层循环的顶部，如图 14-6 所示。\n\n![image](img/Image00180.gif)\n\
  \n图 14-6: 离开内层循环。\n\n我会读取 `BurdBrain` 中的 `B`，然后再次进入内层循环。但接着（太可怕了！）我会把那个 `B` 写入 `usernames.txt`\
  \ 文件。（见图 14-7。）\n\n![image](img/Image00181.gif)\n\n图 14-7: 我的错误所在。\n\n这就是错误！你不应该将主机名写入\
  \ `usernames.txt` 文件。当计算机找到 @ 符号时，它应该跳过 John 电子邮件地址的其余部分。\n\n此时，你有一个选择。你可以直接跳到清单\
  \ 14-3（从这里往后几节）中的修正代码，或者继续阅读以了解图 14-3 中错误消息的原因。\n\n### 为什么计算机意外地越过了文件末尾\n\n啊！你想知道为什么图\
  \ 14-3 中会出现那条讨厌的错误消息。\n\n\n\n\n我通过角色扮演计算机来帮助自己找出问题所在。假设我已经按照图 14-7 中的步骤进行了角色扮演。我不应该用内层循环处理第一个字母`B`（更不用说整个`BurdBrain.com`主机名了）。但不幸的是，我确实这么做了。\n\
  \n我继续运行并处理更多的电子邮件地址。当处理到最后一个电子邮件地址的末尾时，我抓取`BurdBrain.com`中的`m`，然后回去测试它是否为@符号，如图\
  \ 14-8 所示。\n\n![图片](img/Image00182.gif)\n\n图 14-8： 旅程的最后一段。\n\n现在我遇到了麻烦。这个最后的`m`显然不是@符号。于是我跳入内层循环，试图再获取一个字符。（参见图\
  \ 14-9。）`email.txt`文件中已经没有更多字符了，因此 Java 向计算机屏幕发送了一条错误消息。（请参考图 14-3 中的`NullPointerException`错误消息。）\n\
  \n![图片](img/Image00183.gif)\n\n图 14-9： 试图读取文件末尾之后的内容。\n\n![技术内容](img/Image00007.jpg)\
  \ 下面解释为什么会出现`NullPointerException`：`email.txt`文件中已经没有更多字符了，因此对`findWithinHorizon(\"\
  .\",0)`的调用返回空。（没有找到任何内容。）在 Java 中，更精确地描述这种空值的方式是使用`null`这个词。调用`findWithinHorizon(\"\
  .\",0)`的结果是`null`，因此指向找到的字符（`charAt(0)`）是徒劳的。于是，Java 显示了一条`NullPointerException`消息。\n\
  \n### 解决问题\n\n清单 14-3 给出了针对图 14-1 和图 14-2 所描述问题的解决方案。该清单中的代码与清单 14-2 中的代码几乎相同。唯一的区别是增加了一个对`nextLine`的调用。当计算机遇到@符号时，这个`nextLine`调用会吞掉输入行的剩余部分，而不会实际“品尝”它。（`nextLine`调用获取了电子邮件地址的剩余部分，但不会输出该部分。这个思路之所以可行，是因为每个电子邮件地址都独占一行。）在吞掉`@BurdBrain.com`之后，计算机会优雅地移动到下一行输入。\n\
  \n清单 14-3 这样就好多了！\n\n```\n/*\n * This code is correct!!\n */\nimport java.util.Scanner;\n\
  import java.io.File;\nimport java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\
  \nclass ListAllUsernames {\n    public static void main(String args[]) throws FileNotFoundException\
  \ {\n        Scanner diskScanner = new Scanner(new File(\"email.txt\"));\n     \
  \   PrintStream diskWriter = new PrintStream(\"usernames.txt\");\n        char symbol;\n\
  \        while (diskScanner.hasNext()) {\n            symbol = diskScanner.findWithinHorizon(\"\
  .\",0).charAt(0);\n            while (symbol != ’@’) {\n                diskWriter.print(symbol);\n\
  \                symbol = diskScanner.findWithinHorizon(\".\",0).charAt(0);\n  \
  \          }\n            diskScanner.nextLine();\n            diskWriter.println();\n\
  \        }\n        diskScanner.close();\n        diskWriter.close();\n    }\n}\n\
  ```\n\n要运行清单 14-3 中的代码，你需要一个`email.txt`文件——就像前面图 14-1 中显示的那个文件。在`email.txt`文件中，输入几个电子邮件地址。只要每个地址包含一个@符号并且每个地址独占一行，任何地址都可以。将`email.txt`文件与`ListAllUsernames.java`文件（来自清单\
  \ 14-3 的代码）一起保存在你的项目目录中。更多细节，请参见第 13 章中清单 13-2、清单 13-3 和清单 13-4 的讨论。\n\n通过清单 14-3，你达到了一个重要的里程碑。你分析了一个微妙的编程问题，并找到了一个完整且可行的解决方案。你使用的工具包括思考策略和角色扮演计算机。随着时间的推移，你可以用这些工具来解决更大、更好的问题。\n\
  \n![试试看](img/Image00006.jpg) 对于新手程序员来说，没有什么比创建嵌套循环更具挑战性了。这就是为什么我在本章以及接下来的两章中都会讲解循环技巧。你可以说，我在循环地讲解编程循环。\n\
  \n尝试编写我在接下来几段中建议的代码。不要害怕犯很多错误。如果你卡住了，放慢速度，退一步，思考当计算机严格按照指令执行时会发生什么。\n\n解决方案在我的网页上：[`www.allmycode.com/BeginProg`](http://www.allmycode.com/BeginProg)。但在你尝试过各种不同的想法之前，不要直接跳到解决方案。遵循这个经过验证的公式：\n\
  \n- `编写一些代码；`\n- `运行你的代码；`\n- `while (你的程序不能正确运行) {`\n- `逐条语句地逐步执行你的代码，同时跟踪变量的值以及计算机的输出，因为\
