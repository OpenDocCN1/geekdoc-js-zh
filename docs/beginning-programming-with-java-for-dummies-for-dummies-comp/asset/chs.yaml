  \n本章内容\n\n![勾选](img/Image00002.jpg) 编写在备选方案之间进行选择的语句\n\n![勾选](img/Image00002.jpg)\
  \ 将语句嵌套在一起\n\n![勾选](img/Image00002.jpg) 编写几种不同类型的决策语句\n\n以下是《Beginning Programming\
  \ with Java For Dummies》第 5 版第 8 章的摘录：\n\n> 如果你试图存储单词或句子（而不仅仅是单个字母），那么你需要使用一种叫做\
  \ *String* 的东西。^*^\n\n这段摘录说明了两个重要点：第一，你可能需要使用一种叫做 *String* 的东西。第二，你的行动选择可以取决于某件事是真还是假：\n\
  \n*   如果你确实是在存储单词或句子（为真），\n*   那么你需要使用一种叫做 *String* 的东西。\n\n本章讨论决策，这在指令创建中起着基础性作用。通过本章的内容，你的编程能力将突飞猛进。\n\
  \n## 决策，决策！\n\n想象一下，你正沿着一条安静的乡间小路散步。你享受着宜人的夏日时光。天气不太热，一阵轻柔的北风让你感到神清气爽。你手里拿着这本书，翻到了第\
  \ 9 章。你读到了关于存储单词或句子的段落，然后抬起头。\n\n你看到路有一个岔口。你看到两块指示牌——一块指向右边，另一块指向左边。一块牌子上写着：“存储单词或句子？真。”另一块牌子上写着：“存储单词或句子？假。”你评估了单词或句子的情况，然后继续前进，根据你的软件情况向左或向右拐。这个故事如图\
  \ 9-1 所示。\n\n![图片](img/Image00123.jpg)\n\n图 9-1： 该走哪条路？\n\n\n\n\n人生充满了岔路口。就拿加热冷冻零食的普通说明来说：\n\
  \n*   **微波炉加热说明：**\n\n    *   放在微波炉专用盘上。\n    *   高火加热 2 分钟。\n    *   翻转产品。\n  \
  \  *   再高火加热 2 分钟。\n\n*   **传统烤箱说明：**\n\n    *   将烤箱预热至 350 度。\n    *   将产品放在烤盘上。\n\
  \    *   烘烤 25 分钟。\n\n同样，你需要在不同选项之间做出选择。如果使用微波炉，就按这个做。否则，按那个做。\n\n事实上，很难想象有哪种有用的说明不涉及选择。如果你是一位房主，有两个受抚养人，年收入超过\
  \ 3 万美元，请勾选此处。如果你不记得如何在 Java 程序中使用花括号，请参见第 4 章。用户是否正确输入了密码？如果是，则允许用户登录；如果否，则将其踢出。如果你认为市场会上涨，就买入股票；否则，买入债券。如果你买入股票，应该买哪些？何时卖出？\n\
  \n## 做出决策（Java if 语句）\n\n当你编写计算机程序时，你会一个接一个地做出决策。几乎每种编程语言都有一种在两个方向之一分支的方式。在 Java（以及许多其他语言）中，这种分支特性被称为`if`语句。查看清单\
  \ 9-1 以了解`if`语句。\n\n清单 9-1 一个 if 语句\n\n```\nif (randomNumber > 5) {\n    System.out.println(\"\
  Yes. Isn’t it obvious?\");\n} else {\n    System.out.println(\"No, and don’t ask\
  \ again.\");\n}\n```\n\n要查看包含清单 9-1 中代码的完整程序，请跳转到清单 9-2（或者，如果你愿意，也可以步行、跳跃或奔跑至清单\
  \ 9-2）。\n\n清单 9-1 中的`if`语句代表一个分支、一个决策、两种备选行动方案。用通俗的英语来说，该语句的含义如下：\n\n如果`randomNumber`变量的值大于\
  \ 5，\n\n则在屏幕上显示`\"Yes. Isn’t it obvious?\"`。\n\n否则，\n\n则在屏幕上显示`\"No, and don’t ask\
  \ again.\"`。\n\n用图形表示，你会得到图 9-2 中所示的岔路口。\n\n![image](img/Image00124.jpg)\n\n图 9-2：\
  \ 一个随机数决定你的命运。\n\n### 仔细审视 if 语句\n\n一个`if`语句可以采用以下形式：\n\n```\nif (条件) {\n    一些语句\n\
  } else {\n    其他语句\n}\n```\n\n要得到一个真实的`if`语句，只需用有意义的文本替换三个占位符*条件*、*一些语句*和*其他语句*。以下是我在清单\
  \ 9-1 中进行替换的方式：\n\n*   我用`randomNumber > 5`替换*条件*。\n*   我用`System.out.println(\"\
  Yes. Isn’t it obvious?\");`替换*一些语句*。\n*   我用`System.out.println(\"No, and don’t\
  \ ask again.\");`替换*其他语句*。\n\n替换过程如图 9-3 所示。\n\n![image](img/Image00125.gif)\n\n\
  图 9-3： 一个`if`语句及其格式。\n\n有时我需要为`if`语句的各个部分使用其他名称。我将它们称为*if 子句*和*else 子句*：\n\n```\n\
  if (条件) {\n    if 子句\n} else {\n    else 子句\n}\n```\n\n`if`语句是*复合语句*的一个例子——一种在其内部包含其他语句的语句。清单\
  \ 9-1 中的`if`语句包含两个`println`调用，这些对`println`的调用就是语句。\n\n请注意我在清单 9-1 的`if`语句中如何使用括号和分号。特别要注意以下几点：\n\
  \n*   条件必须放在括号内。\n*   `if`子句内的语句以分号结尾。`else`子句内的语句也是如此。\n*   条件后面没有分号。\n*   `else`这个词后面没有分号。\n\
  \n作为初学者程序员，你可能会认为这些规则是任意的。但事实并非如此。这些规则属于精心设计的语法。它们就像英语句子的语法规则，但更加合乎逻辑！（抱歉，贝基。）\n\
  \n表 9-1 展示了当你违反`if`语句的标点规则时可能出现的各种问题。表中最后两项最为臭名昭著。在这两种情况下，编译器不会捕获错误。这会让你产生虚假的安全感。问题在于，当你运行程序时，代码的行为并非你所期望的那样。\n\
  \n| **错误** | **示例** | **最可能的消息或结果** |\n| --- | --- | --- |\n| 条件周围缺少括号 | `if randomNumber\
  \ > 5 {` | `Syntax error on token \"if\", ( expected after this token` |\n| `if`子句或`else`子句内的语句后缺少分号\
  \ | `if (randomNumber > 5) {` `System.out.println(\"Y\")` `}` | `Syntax error, insert\
  \ \";\" to complete BlockStatements` |\n| 条件后立即出现分号 | `if (randomNumber > 5); {`\
  \ `System.out.println(\"Y\");` `} else {` | `Syntax error on token \"else\", delete\
  \ this token` |\n| `else`词后立即出现分号 | `} else; {` | 程序编译无误，但无论条件为真还是假，`else`词后的语句总是被执行。\
  \ |\n| 缺少花括号 | `if (randomNumber > 5)` `otherValue = 7;` `System.out.println(\"\
  Y\");` `else` `otherValue = 9;` `System.out.println(\"N\");` | 程序有时编译无误，但程序运行可能不会按预期执行。（底线：不要省略花括号。）\
  \ |\n\n表 9-1 常见的 if 语句错误消息\n\n在编写代码时，将`if`语句视为一个不可分割的整体会有所帮助。不要先输入整行（条件和所有内容），而是尝试输入`if`语句的骨架轮廓：\n\
  \n```\nif () {          //待办：填写条件。\n    //待办：填写 if 子句。\n} else {\n    //待办：填写 else\
  \ 子句。\n}\n```\n\n有了完整的轮廓后，你就可以开始处理待办事项列表中的项目了。当你将这种思维方式应用于复合语句时，就不太容易出错。\n\n###\
  \ 一个完整的程序\n\n清单 9-2 包含一个带有简单`if`语句的完整程序。该清单中的代码就像一个电子神谕。向程序提出一个是非问题，程序会回答你。当然，你问题的答案是随机生成的。但谁在乎呢？反正问起来很有趣。\n\
  \n清单 9-2 我无所不知\n\n```\nimport java.util.Scanner;\nimport java.util.Random;\n\nclass\
  \ AnswerYesOrNo {\n    public static void main(String args[]) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        Random myRandom = new Random();\n\
  \        int randomNumber;\n\n        System.out.print(\"Type your question, my\
  \ child: \");\n        keyboard.nextLine();\n\n        randomNumber = myRandom.nextInt(10)\
  \ + 1;\n\n        if (randomNumber > 5) {\n            System.out.println(\"Yes.\
  \ Isn’t it obvious?\");\n        } else {\n            System.out.println(\"No,\
  \ and don’t ask again.\");\n        }\n\n        keyboard.close();\n    }\n}\n```\n\
  \n图 9-4 展示了清单 9-2 中程序的几次运行。该程序的动作分为四个部分：\n\n1.  **提示用户。** 调用`System.out.print`，告诉用户输入一个问题。\n\
  2.  **从键盘获取用户的问题。**\n\n\n\n在图 9-4 中，我运行了四次`AnswerYesOrNo`程序，每次输入不同的问题。与此同时，回到代码清单\
  \ 9-2，语句\n\n`keyboard.nextLine();`\n\n吞掉了我的问题，并且完全没有处理它。这有点反常，但你很聪明，所以你能应付。\n\n\
  通常，当程序从键盘获取输入时，程序会对输入进行处理。例如，程序可以将输入赋值给一个变量：\n\n`amount = keyboard.nextDouble();`\n\
  \n或者，程序可以将输入显示在屏幕上：\n\n`System.out.println(keyboard.nextLine());`\n\n但代码清单 9-2 中的代码不同。当这个`AnswerYesOrNo`程序运行时，用户必须输入一些内容。（调用`nextLine`会等待用户输入一些内容然后按回车。）但`AnswerYesOrNo`程序不需要存储输入以供进一步分析。（就像我妻子问我是否打算收拾自己的烂摊子时，我所做的那样——我忽略问题，随便编个答案。）所以程序对用户的输入不做任何处理。`keyboard.nextLine`的调用只是作为一个独立的语句存在，什么都不做，就像一个巨大的黑洞。程序这样做很不寻常，但电子神谕本身就是个不寻常的东西。它需要一些稍微不寻常的代码。\n\
  \n3.  **获取一个随机数——任意一个从 1 到 10 的`int`值。**\n\n    好吧，聪明人。你刚刚丢弃了用户的输入。你要如何回答用户的问题是“是”还是“否”呢？\n\
  \n    没问题！完全没问题！你会随机显示一个答案。用户不会察觉有什么不同。（哈哈！）只要你能生成随机数，就能做到这一点。用 1 到 10 的数字就足够了。\n\
  \n    在代码清单 9-2 中，关于`Random`和`myRandom`的内容看起来很像熟悉的`Scanner`代码。从初学者的角度来看，`Random`和`Scanner`的工作方式几乎相同。当然，有一个重要的区别：调用`Random`类的`nextInt(10)`方法不会从键盘获取任何东西。相反，这个`nextInt(10)`方法会凭空得到一个数字。\n\
  \n    名称`Random`在 Java API 中定义。在代码清单 9-2 中调用`myRandom.nextInt(10)`会得到一个 0 到 9 之间的数字。然后我的代码加\
  \ 1（得到 1 到 10 之间的数字），并将该数字赋值给变量`randomNumber`。完成后，你就可以回答用户的问题了。\n\n    ![技术说明](img/Image00007.jpg)\
  \ 在 Java API 中，`Random`是一个 Java 类的名称，`nextInt`是一个 Java 方法的名称。关于类和方法之间关系的更多信息，请参见第\
  \ 17 章、第 18 章和第 19 章。\n\n4.  **回答是或否。**\n\n    调用`myRandom.nextInt(10)`就像在电视游戏节目中转动轮盘。轮盘上有编号\
  \ 1 到 10 的槽位。代码清单 9-2 中的`if`语句将你的数字转换为“是”或“否”的选项。如果你掷出的数字大于 5，程序回答*是*。否则（如果你掷出的数字小于或等于\
  \ 5），程序回答*否*。\n\n    这一点你可以相信我。我基于我的`AnswerYesOrNo`程序做出了很多重要决定。\n\n![图片](img/Image00126.jpg)\n\
  \n图 9-4： 全知的 Java 程序在运行中。\n\n### 在代码中缩进 if 语句\n\n注意，在代码清单 9-2 中，`if`语句内部的`println`调用是缩进的。严格来说，你不必缩进`if`语句内部的语句。对于编译器来说，你可以把整个程序写在一行上，或者把所有语句排列成艺术性的、不规则的锯齿状。问题是，如果你不以某种逻辑方式缩进语句，那么你和别人都无法理解你的代码。在代码清单\
  \ 9-2 中，`println`调用的缩进有助于你的眼睛（和大脑）快速看出这些语句从属于整个`if`/`else`流程。\n\n在一个小程序中，不缩进或缩进不当的代码勉强可以容忍。但在一个复杂的程序中，不遵循整洁逻辑模式的缩进就是一个巨大而丑陋的噩梦。\n\
  \n![记住](img/Image00005.jpg) 始终缩进你的代码，以便一眼就能看出程序的流程。\n\n![提示](img/Image00003.jpg)\
  \ 你不必考虑缩进代码，因为 Eclipse 可以自动缩进你的代码。详情请参见第 4 章。\n\n## 主题变体\n\n我不喜欢剥猫皮。但我听说，如果有一天我需要剥一只猫，我有几种技术可以选择。下次我的猫组胺把地毯误当成猫砂盆时，我会记住这一点。^*\n\
  \n无论如何，无论你是剥鲶鱼皮、剥小猫皮，还是编写计算机程序，同样的原则都适用。你总是有替代方案。代码清单 9-2 展示了一种编写`if`语句的方法。本章的其余部分（以及第\
  \ 10 章的全部内容）将展示创建`if`语句的其他一些方法。\n\n### ……否则呢？\n\n你可以创建一个没有`else`子句的`if`语句。例如，想象一个网页，每十个随机访问者中有一个会收到特别优惠。为了让访问者保持好奇，我调用`Random`类的`nextInt`方法，并向那些数字是幸运数字\
  \ 7 的人提供优惠：\n\n*   如果`myRandom.nextInt(10) + 1`生成数字 7，则显示特别优惠消息。\n*   如果`myRandom.nextInt(10)\
  \ + 1`生成任何其他数字，则什么都不做。不显示特别优惠消息，也不显示令人沮丧的“抱歉，没有优惠给你”的消息。\n\n实现这种策略的代码如代码清单 9-3 所示。代码的几次运行结果如图\
  \ 9-5 所示。\n\n![图片](img/Image00128.jpg)\n\n图 9-5： 代码清单 9-3 的三次运行结果。\n\n代码清单 9-3 你难道不幸运吗？\n\
  \n```\nimport java.util.Random;\nclass SpecialOffer {\npublic static void main(String\
  \ args[]) {\nRandom myRandom = new Random();\nint randomNumber = myRandom.nextInt(10)\
  \ + 1;\nif (randomNumber == 7) {\nSystem.out.println(\"An offer just for you!\"\
  );\n}\nSystem.out.println(randomNumber);\n}\n}\n```\n\n代码清单 9-3 中的`if`语句没有`else`子句。这个`if`语句具有以下形式：\n\
  \n`if (条件) {`\n\n`一些语句`\n\n`}`\n\n当`randomNumber`为 7 时，计算机显示`An offer just for you!`。当`randomNumber`不是\
  \ 7 时，计算机不显示`An offer just for you!`。该操作如图图 9-6 所示。\n\n![图片](img/Image00129.jpg)\n\
  \n图 9-6： 如果你没什么好说的，那就什么也别说。\n\n![记住](img/Image00005.jpg) 始终（我是说*始终*）在`if`语句的条件中比较两个数字或字符时使用双等号。永远（那是*永远、永远、永远*）不要使用单等号来比较两个值。单等号用于赋值，而不是比较。\n\
  \n在代码清单 9-3 中，我擅自添加了一个额外的`println`。这个`println`（在`main`方法的末尾）显示了我调用`nextInt`生成的随机数。在带有特别优惠的网页上，你可能看不到随机生成的数字，但如果不知道代码生成了什么数字，我就无法测试我的`SpecialOffer`代码。\n\
  \n\n\n\n无论如何，请注意，`randomNumber` 的值在每次运行时都会显示。`randomNumber` 的 `println` 并不在 `if`\
  \ 语句内部。（这个 `println` 位于 `if` 语句之后。）因此，计算机总是会执行这个 `println`。无论 `randomNumber == 7`\
  \ 是 true 还是 false，计算机都会执行相应的 `if` 操作，然后继续执行 `System.out.println(randomNumber)`。\n\
  \n### 在 if 语句中塞入更多内容\n\n这里有一个有趣的情况：你有两支棒球队——Hankees 队和 Socks 队。你想在两行中分别显示两队的得分，并且胜者的得分显示在前面。（在电脑屏幕上，胜者的得分显示在败者得分之上。如果平局，则两行显示相同的分数，一上一下。）清单\
  \ 9-4 给出了代码。\n\n清单 9-4 让最好的队伍先显示\n\n```\nimport java.util.Scanner;\nimport static\
  \ java.lang.System.in;\nimport static java.lang.System.out;\nclass TwoTeams {\n\
  \  public static void main(String args[]) {\n    Scanner keyboard = new Scanner(in);\n\
  \    int hankees, socks;\n    out.print(\"Hankees and Socks scores? \");\n    hankees\
  \ = keyboard.nextInt();\n    socks = keyboard.nextInt();\n    out.println();\n \
  \   if (hankees > socks) {\n      out.print(\"Hankees: \");\n      out.println(hankees);\n\
  \      out.print(\"Socks: \");\n      out.println(socks);\n    } else {\n      out.print(\"\
  Socks: \");\n      out.println(socks);\n      out.print(\"Hankees: \");\n      out.println(hankees);\n\
  \    }\n    keyboard.close();\n  }\n}\n```\n\n图 9-7 展示了代码的几次运行结果。（为了在一张图中展示多次运行，我将\
