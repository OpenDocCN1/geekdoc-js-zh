  \n## 第 17 章\n\n## 使用对象和类进行编程\n\n本章内容\n\n![勾选](img/Image00002.jpg) **使用类进行编程（并且具有风格和技巧）**\n\
  \n![勾选](img/Image00002.jpg) **从类创建对象**\n\n![勾选](img/Image00002.jpg) **加入专属的“我理解类和对象”协会**\n\
  \n\n\n\n\n第 6 章、第 7 章和第 8 章介绍了 Java 的基本类型——比如`int`、`double`、`char`和`boolean`。这很好，但现实世界中的问题有多少会只涉及这些简单的值呢？考虑一下商家和顾客之间的交易。顾客进行购买，这涉及商品名称、型号、信用卡信息、销售税率以及许多其他内容。一次购买比一个`int`值复杂得多，也比一个`double`值复杂得多。如何在\
  \ Java 程序中表示一次完整的购买？\n\n在较老的计算机编程语言中，你会把一次购买当作一堆未打包的衣物来处理。想象一堆袜子、衬衫和其他衣物。你没有篮子，所以只能尽可能多地抓取。当你走向洗衣机时，会掉下一些东西——这里一只袜子，那里一块毛巾。这就像用老方法存储购买中的值。在较老的语言中，没有“购买”这个概念。只有`double`值、`char`值和其他零散的东西。你把购买金额放在一个变量中，顾客姓名放在另一个变量中，销售税数据放在其他地方。但这很糟糕。在通往编译器的路上，你很容易丢三落四。程序中只要有一点小错误，你就可能在这里丢掉一个金额，在那里丢掉一个顾客姓名。\n\
  \n对于洗衣和编程来说，如果你有一个篮子，情况会好得多。较新的编程语言（如 Java）允许你将值组合起来，创建出新的、更有用的值类型。例如，在 Java 中，你可以将`double`值、`int`值、`boolean`值以及其他类型的值组合起来，创建出你称之为`Purchase`的东西。因为你的购买信息全部打包在一起，所以跟踪购买的各个部分就更容易了。这就是一个重要的计算机编程概念的开端：*面向对象编程*的概念。\n\
  \n### 创建类\n\n我先从一个“传统”的例子开始。清单 17-1 中的程序处理简单的购买数据。程序的运行结果如图 17-1 所示。\n\n![image](img/Image00208.jpg)\n\
  \n图 17-1： 处理顾客的购买。\n\n清单 17-1 用老式方法处理\n\n```\nimport java.util.Scanner;\n\nclass\
  \ ProcessData {\n\n    public static void main(String args[]) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n\n        double unitPrice;\n        int quantity;\n\
  \        boolean taxable;\n\n        System.out.print(\"Unit price: \");\n     \
  \   unitPrice = keyboard.nextDouble();\n\n        System.out.print(\"Quantity: \"\
  );\n        quantity = keyboard.nextInt();\n\n        System.out.print(\"Taxable?\
  \ (true/false) \");\n        taxable = keyboard.nextBoolean();\n\n        double\
  \ total = unitPrice * quantity;\n\n        if (taxable) {\n            total = total\
  \ * 1.05;\n        }\n\n        System.out.print(\"Total: \");\n        System.out.println(total);\n\
  \n        keyboard.close();\n    }\n}\n```\n\n如果图 17-1 中的输出看起来有点奇怪，那是因为我在代码中没有控制小数点后的位数。所以输出中，$42.00\
  \ 显示为`42.0`。这没关系。我将在第 18 章中向你展示如何解决这个问题。\n\n### 引用类型和 Java 类\n\n清单 17-1 中的代码涉及几个简单的值：`unitPrice`、`quantity`和`taxable`。所以本章的重点是：通过组合几个简单的值，你可以得到一个单一的、更有用的值。这就是它的工作原理。你取一些\
  \ Java 的基本类型，将它们混合在一起做成一个基本类型炖菜，然后得到什么？你得到一种更有用的类型，称为*引用类型*。清单 17-2 中有一个例子。\n\n\
  清单 17-2 成为一次购买的含义\n\n```\nclass Purchase {\n\n    double unitPrice;\n    int quantity;\n\
  \    boolean taxable;\n}\n```\n\n清单 17-2 中的代码没有`main`方法，所以 Eclipse 可以编译代码，但你不能运行它。当你在\
  \ Eclipse 的主菜单中选择 Run ⇒   Run As 时，弹出的上下文菜单中没有 Java Application 条目。你可以点击 Eclipse\
  \ 工具栏上的小 Run As 按钮，然后选择 Java Application。但随后你会看到如图 17-2 所示的消息框。因为清单 17-2 没有`main`方法，所以没有地方开始执行。（实际上，清单\
  \ 17-2 中的代码根本没有语句。没有什么可执行的。）\n\n![image](img/Image00209.jpg)\n\n图 17-2： 清单 17-2\
  \ 中的代码没有`main`方法。\n\n### 使用新定义的类\n\n要对清单 17-2 中的代码做一些有用的事情，你需要一个`main`方法。你可以将`main`方法放在一个单独的文件中。清单\
  \ 17-3 向你展示了这样一个文件。\n\n清单 17-3 使用你的 Purchase 类\n\n```\nimport java.util.Scanner;\n\
  \nclass ProcessPurchase {\n\n    public static void main(String[] args) {\n    \
  \    Scanner keyboard = new Scanner(System.in);\n\n        Purchase onePurchase\
  \ = new Purchase();\n\n        System.out.print(\"Unit price: \");\n        onePurchase.unitPrice\
  \ = keyboard.nextDouble();\n\n        System.out.print(\"Quantity: \");\n      \
  \  onePurchase.quantity = keyboard.nextInt();\n\n        System.out.print(\"Taxable?\
  \ (true/false) \");\n        onePurchase.taxable = keyboard.nextBoolean();\n\n \
  \       double total = onePurchase.unitPrice * onePurchase.quantity;\n\n       \
  \ if (onePurchase.taxable) {\n            total = total * 1.05;\n        }\n\n \
  \       System.out.print(\"Total: \");\n        System.out.println(total);\n\n \
  \       keyboard.close();\n    }\n}\n```\n\n理解清单 17-3 中代码的最佳方法是将其与清单 17-1 中的代码逐行比较。事实上，有一个机械公式可以将清单\
  \ 17-1 中的代码转换为清单 17-3 中的代码。表 17-1 描述了该公式。\n\n| 在清单 17-1 中 | 在清单 17-3 中 |\n| ---\
  \ | --- |\n| `double unitPrice;` `int quantity` `boolean taxable;` | `Purchase onePurchase\
  \ = new Purchase();` |\n| `unitPrice` | `onePurchase.unitPrice` |\n| `quantity`\
  \ | `onePurchase.quantity` |\n| `taxable` | `onePurchase.taxable` |\n\n表 17-1 将代码转换为使用类\n\
  \n这两个程序（清单 17-1 和 17-3）本质上做的是同一件事，但一个使用基本类型变量，另一个依赖于清单 17-2 中的`Purchase`代码。两个程序的运行结果都类似于前面图\
  \ 17-1 所示。\n\n### 运行跨越两个独立文件的代码\n\n从 Eclipse 的角度来看，一个包含两个 Java 源文件的项目没什么大不了的。你在同一个项目中创建两个类，然后选择\
  \ Run ⇒   Run As ⇒   Java Application。一切都会按你期望的方式工作。\n\n唯一变得棘手的情况是，当你在一个项目中有两个`main`方法时。本节中的示例（参见清单\
  \ 17-2 和 17-3）没有这个问题。但当你试验代码时，很容易添加带有额外`main`方法的类。你也可能创建一个具有多个入口点的大型应用程序。\n\n\n\n\
  \n\n当一个项目有多个 `main` 方法时，Eclipse 可能会提示你并询问要运行哪个类的 `main` 方法。但有时 Eclipse 不会提示你。相反，Eclipse\
  \ 会随意选择一个 `main` 方法而忽略其他所有方法。这可能会让人非常困惑。你向错误的 `main` 方法中添加了 `println` 调用，但控制台视图中什么也没有出现。嘿，这是怎么回事？\n\
  \n你可以按照以下步骤解决这个问题：\n\n1. **在包资源管理器中展开项目的分支。**\n\n2. **展开项目分支中的** `src` **文件夹。**\n\
  \n3. **展开** `src` **分支中的** `(default package)` **分支。**\n\n   `(default package)`\
  \ 分支包含 `.java` 文件。\n\n4. **（在 Windows 上）右键单击你想要运行其** `main` **方法的** `.java` **文件。（在\
  \ Mac 上）按住 Control 键并单击你想要运行其** `main` **方法的** `.java` **文件。**\n\n5. **在出现的上下文菜单中，选择“运行方式”\
  \ ⇒ “Java 应用程序”。**\n\n![remember](img/Image00005.jpg) 你不能运行一个没有 `main` 方法的项目。如果你尝试这样做，会弹出一个消息框，就像前面图\
  \ 17-2 中显示的那样。\n\n### 为什么要这么做？\n\n从表面上看，清单 17-3 中的代码更长、更复杂、更难阅读。但想想一大堆衣物：找篮子、把袜子扔进篮子里可能需要时间，但当衣服都在篮子里时，搬运起来就容易多了。清单\
  \ 17-3 中的代码也是同样的道理。当你的数据都在一个 `Purchase` 篮子中时，对购买数据进行复杂操作就容易多了。\n\n### 从类到对象\n\n\
  清单 17-2 中的代码定义了一个类。`class` 是一个设计蓝图；它描述了你打算如何组合和使用数据片段。例如，清单 17-2 中的代码声明了你打算将 `double`、`int`\
  \ 和 `boolean` 值组合起来，以创建新的 `Purchase` 值。\n\n类是所有 Java 编程的核心。但 Java 被称为一种*面向对象*的语言。Java\
  \ 并不被称为面向类的语言。事实上，没有人使用*面向类语言*这个术语。为什么呢？\n\n嗯，你无法拥抱一个类。类不是真实的。没有对象的类就像没有巧克力的日子。如果你现在正坐在一个房间里，扫视一下房间里所有的椅子。房间里有多少把椅子？两把？五把？二十把？在一个有五把椅子的房间里，你有五个椅子对象。每把椅子（每个对象）都是真实的东西，你可以使用它，你可以坐在上面。\n\
  \n像 Java 这样的语言有类和对象。类和对象之间有什么区别？\n\n* 对象是一个事物。\n* 类是这类事物的设计蓝图。\n\n例如，你如何描述一把椅子是什么？嗯，椅子有座面、靠背和腿。在\
  \ Java 中，你可以编写清单 17-4 中的内容。\n\n清单 17-4 成为一把椅子的含义\n\n```java\n/*\n * 这是真正的 Java 代码，但这段代码\n\
  \ * 不能单独编译：\n */\nclass Chair {\n    FlatHorizonalPanel seat;\n    FlatVerticalPanel\
  \ back;\n    LongSkinnyVerticalRods legs;\n}\n```\n\n清单 17-4 中的代码是椅子的设计蓝图。代码告诉你每把椅子有三样东西。代码命名了这些部分（`seat`、`back`\
  \ 和 `legs`），并简要说明了每个部分是什么。（例如，座面是一个 `FlatHorizontalPanel`。）同样地，清单 17-2 中的代码告诉你每笔购买有三样东西。代码命名了这些部分（`unitPrice`、`quantity`\
  \ 和 `taxable`），并说明了每个部分的原始类型。\n\n想象一下宇宙边缘的一个巨大工厂。每晚你睡觉时，这个工厂会冲压出有形的对象——这些对象将在你第二天醒来时遇到。明天你将去\
  \ Sloshy Shoes 公司面试。所以今晚工厂为公司的办公室建造椅子。工厂根据清单 17-4 中近乎真实的代码建造椅子对象，如图 17-3 所示。\n\n\
  ![image](img/Image00210.gif)\n\n图 17-3: 来自 `Chair` 类的椅子对象。\n\n在清单 17-3 中，这一行\n\n\
  `Purchase onePurchase = new Purchase();`\n\n的行为就像宇宙边缘的那个巨大工厂。不过，清单 17-3 中的这一行创建的不是椅子对象，而是一个\
  \ `Purchase` 对象，如图 17-4 所示。清单 17-3 中的这一行是一个带有初始化的声明。就像这一行\n\n`int count = 0;`\n\n\
  声明了 `count` 变量并将 `count` 设置为 0，清单 17-3 中的这一行声明了 `onePurchase` 变量，并使 `onePurchase`\
  \ 指向一个全新的对象。这个新对象包含三个部分：一个 `unitPrice` 部分、一个 `quantity` 部分和一个 `taxable` 部分。\n\n\
  ![image](img/Image00211.jpg)\n\n图 17-4: 从 `Purchase` 类创建的对象。\n\n![technicalstuff](img/Image00007.jpg)\
  \ 如果你要较真，图 17-4 中的内容与清单 17-3 中语句 `Purchase onePurchase = new Purchase()` 的作用之间存在差异。图\
  \ 17-4 显示了一个对象，其中存储了值 `20.00`、`2` 和 `true`。语句 `Purchase onePurchase = new Purchase()`\
  \ 创建了一个新对象，但没有用有用的值填充该对象。获取值是在清单 17-3 的后面部分进行的。\n\n### 理解（或忽略）细微差别\n\n有时，当你引用一个特定对象时，你想强调该对象来自哪个类。嗯，侧重点的细微差别需要术语上的大差别。所以，Java\
  \ 程序员是这样使用术语的：\n\n* 在清单 17-3 中，语句 `Purchase onePurchase = new Purchase()` 创建了一个新的*对象*。\n\
  * 在清单 17-3 中，语句 `Purchase onePurchase = new Purchase()` 创建了 `Purchase` 类的一个新*实例*。\n\
  \n*对象*和*实例*这两个词几乎是同义词，但 Java 程序员从不说“`Purchase` 类的对象”（即使说了，他们也会觉得别扭）。\n\n顺便说一句，如果你搞混了这些术语，说了类似“`Purchase`\
  \ 类的对象”这样的话，没有人会对你发火。每个人都明白你的意思，生活照常进行。事实上，我经常使用像“`Purchase` 对象”这样的短语来描述 `Purchase`\
  \ 类的一个实例。对象和实例之间的区别并不十分重要。但重要的是要记住，*对象*和*实例*这两个词含义相同。（好吧！它们*几乎*含义相同。）\n\n### 引用对象的组成部分\n\
  \n在清单 17-2 的 `Purchase` 代码中，我声明了三个变量：一个 `unitPrice` 变量、一个 `quantity` 变量和一个 `taxable`\
  \ 变量。在现实生活中，你可能会说每笔购买有三个部分：所购物品的 `unitPrice`、购买物品的 `quantity`，以及该购买是否应纳税。\n\n当你创建一个\
  \ Java 类时，这些变量中的每一个都被称为一个*字段*。`Purchase` 类有三个字段——即 `unitPrice` 字段、`quantity` 字段和\
  \ `taxable` 字段。\n\n\n\n\n\n创建对象后，你可以使用点号来引用对象的字段。例如，在清单 17-3 中，我通过以下代码将值放入`onePurchase`对象的`unitPrice`字段：\n\
  \n`onePurchase.unitPrice = keyboard.nextDouble();`\n\n稍后在清单 17-3 中，我通过以下代码获取`unitPrice`字段的值：\n\
  \n`double total = onePurchase.unitPrice * onePurchase.quantity;`\n\n这种点号用法可能看起来繁琐，但它确实有助于程序员组织代码。在清单\
  \ 17-1 中，每个变量都是独立的实体。但在清单 17-3 中，每次使用`unitPrice`这个词都与购买的概念紧密相连。这很好。\n\n![technicalstuff](img/Image00007.jpg)\
  \ 每个字段都是一个变量，但并非每个变量都是字段。例如，在以下代码中，`amount`变量不是字段，因为它是在`main`方法内部声明的。\n\n```\npublic\
  \ static void main(String args[]) {\n    double amount;\n    amount = 5.95;\n  \
  \  // … 等等。\n}\n```\n\n无论如何，我不希望你被*字段*和*变量*这两个词困扰。*字段*只是一个在类中扮演特殊角色的变量。当我想强调这个特殊角色时，我使用*字段*一词。当我不想强调这个特殊角色时，我使用*变量*一词。我甚至可能在同一个句子中在*字段*和*变量*之间来回切换。谁知道呢？我可能会把某个东西称为*变段*或*字量*。\n\
  \n如果你关心我使用哪个词以及何时使用，那很好。如果你不关心，也不必担心。\n\n### 创建多个对象\n\n创建`Purchase`类后，你可以创建任意多个购买对象。例如，在清单\
  \ 17-5 中，我创建了两个购买对象。\n\n清单 17-5 处理购买\n\n```\nclass ProcessPurchases {\n    public\
  \ static void main(String[] args) {\n        Purchase purchase1 = new Purchase();\n\
  \        purchase1.unitPrice = 20.00;\n        purchase1.quantity = 3;\n       \
  \ purchase1.taxable = true;\n\n        Purchase purchase2 = new Purchase();\n  \
  \      purchase2.unitPrice = 20.00;\n        purchase2.quantity = 3;\n        purchase2.taxable\
  \ = false;\n\n        double purchase1Total = purchase1.unitPrice * purchase1.quantity;\n\
  \        if (purchase1.taxable) {\n            purchase1Total *= 1.05;\n       \
  \ }\n\n        double purchase2Total = purchase2.unitPrice * purchase2.quantity;\n\
  \        if (purchase2.taxable) {\n            purchase2Total *= 1.05;\n       \
  \ }\n\n        if (purchase1Total == purchase2Total) {\n            System.out.println(\"\
  No difference\");\n        } else {\n            System.out.println(\"These purchases\
  \ have different totals.\");\n        }\n    }\n}\n```\n\n图 17-5 展示了清单 17-5 中代码的运行结果，图\
  \ 17-6 说明了这一概念。\n\n![image](img/Image00212.jpg)\n\n图 17-5： 运行清单 17-5 中的代码。\n\n![image](img/Image00213.jpg)\n\
  \n图 17-6： 从一个类产生两个对象。\n\n![remember](img/Image00005.jpg) 要编译清单 17-5 中的代码，你必须在同一项目中拥有`Purchase`类的副本。（`Purchase`类在清单\
  \ 17-2 中。）要将类的代码从一个项目复制到另一个项目，请参阅第 16 章。（该章的边栏“在此处和彼处获取输入”描述了复制粘贴的步骤。）\n\n清单 17-5\
  \ 中有两个购买对象，因为代码\n\n`new Purchase();`\n\n被执行了两次。\n\n![tip](img/Image00003.jpg) 正如你可以将`int`变量的赋值与声明分开\n\
  \n```\nint count;\ncount = 0;\n```\n\n你也可以将`Purchase`变量的赋值与声明分开：\n\n```\nPurchase\
  \ purchase1;\npurchase1 = new Purchase();\n```\n\n创建了清单 17-2 中的代码后，`Purchase`这个词代表一种全新的类型——引用类型。Java\
  \ 有八种内置的基本类型，以及在你一生中人们可以定义的任意多种引用类型。在清单 17-2 中，我定义了`Purchase`引用类型，你也可以定义引用类型。\n\n\
  表 17-2 简要比较了基本类型和引用类型。\n\n|  | ***基本类型*** | ***引用类型*** |\n| --- | --- | --- |\n\
  | 如何创建 | 内置于语言中 | 定义为 Java 类 |\n| 有多少种 | 八种 | 无限多种 |\n| 变量声明示例 | `int count;` |\
  \ `Purchase aPurchase;` |\n| 赋值示例 | `count = 0;` | `aPurchase = new Purchase();`\
  \ |\n| 为其部分赋值 | （不适用） | `aPurchase.unitPrice = 20.00;` |\n\n表 17-2 Java 类型\n\n###\
  \ 关于类的另一种思考方式\n\n当你开始学习面向对象编程时，你可能会认为类的概念是一个大骗局。硅谷的一些极客闲着没事干，就去酒吧编造了一些关于类的令人困惑的胡言乱语。他们自己也不知道是什么意思，但看到人们努力理解的样子觉得很有趣。\n\
  \n嗯，这并非类的本质。类是严肃的东西。更重要的是，类很有用。许多权威研究表明，类和面向对象编程可以节省时间和金钱。\n\n即便如此，类的概念可能仍然难以捉摸。即使是经验丰富的程序员——那些刚接触面向对象编程的人——也很难理解对象与类的区别。\n\
  \n### 类、对象和表格\n\n由于类可能很神秘，我将用另一个类比来扩展你的理解。图 17-7 是一个包含三笔购买的表格。表格的标题由一个词（Purchase）组成，表格有三个列标题：*unitPrice*、*quantity*和*taxable*。而清单\
  \ 17-2 中的代码也包含相同的内容——`Purchase`、`unitPrice`、`quantity`和`taxable`。所以在图 17-7 中，将表格的顶部部分（标题和列标题）视为一个类。就像清单\
  \ 17-2 中的代码一样，表格的顶部部分告诉你成为`Purchase`意味着什么。（意味着拥有`unitPrice`值、`quantity`值和`taxable`值。）\n\
  \n![image](img/Image00214.jpg)\n\n图 17-7： 一个购买表格。\n\n类就像表格的顶部部分。那么对象呢？对象就像表格的一行。例如，使用清单\
  \ 17-5 中的代码，我创建了两个对象（`Purchase`类的两个实例）。第一个对象的`unitPrice`值为`20.00`，`quantity`值为`3`，`taxable`值为`true`。在对应的表格中，第一行包含这三个值——`20.00`、`3`和`true`，如图\
  \ 17-8 所示。\n\n![image](img/Image00215.jpg)\n\n图 17-8： 一笔购买对应表格的一行。\n\n### 一些问答\n\
  \n以下是世界上最简短的面向对象编程常见问题解答：\n\n*   **我可以在没有类的情况下拥有对象吗？**\n\n    不，你不能。在 Java 中，每个对象都是某个类的实例。\n\
  \n*   **我可以在没有对象的情况下拥有类吗？**\n\n\n\n\n是的，你可以。事实上，本书中几乎每个程序都创建了一个没有对象的类。以清单 17-5 为例。清单\
  \ 17-5 中的代码定义了一个名为`ProcessPurchases`的类。而在清单 17-5（或其他任何地方）中，我都没有创建`ProcessPurchases`类的实例。我有一个没有对象的类。这完全没问题。这是常规操作。\n\
  \n* **创建了一个类及其实例后，我还能向该类添加更多实例吗？**\n\n    是的，你可以。在清单 17-5 中，我创建了一个实例，然后又创建了另一个。在一个`for`循环中，我可以创建十几个实例，这样在图\
  \ 17-8 的表格中就会有十几行。无论没有对象、三个对象、四个对象还是更多对象，我仍然拥有同一个`Purchase`类。\n\n* **一个对象可以来自多个类吗？**\n\
  \n    别乱说！也许其他面向对象语言允许这种糟糕的类杂交，但在 Java 中，这是严格禁止的。这正是 Java 区别于它之前某些语言的一点：Java 更干净、更统一、更容易理解。\n\
  \n### 接下来是什么？\n\n清单 17-5 中的一些代码让我感到不安。在清单 17-5 中，计算购买总额的语句出现了一次，然后又出现了第二次，只做了一个微小的改动：\n\
  \n```\ndouble purchase1Total = purchase1.unitPrice * purchase1.quantity;\nif (purchase1.taxable)\
  \ {\n    purchase1Total *= 1.05;\n}\ndouble purchase2Total = purchase2.unitPrice\
