  \n*   **顾客是否有优惠券？**\n\n    也就是说，顾客的回答是`Y`*或*`y`吗？\n\n*   **顾客是否属于常规年龄组？**\n\n  \
  \  也就是说，顾客是否至少 12 岁*且*小于 65 岁？\n\n在清单 10-4 中，我使用`&&`运算符将第 1 项和第 2 项连接起来。这样做是因为，顾客要获得\
  \ 2.00 美元的折扣，必须同时满足两个条件（第 1 项*和*第 2 项），如图 10-7 所示。\n\n![image](img/Image00138.jpg)\n\
  \n图 10-7： 回复和年龄条件都必须为真。\n\n### 使用括号\n\n清单 10-4 演示了关于条件的一个重要点。有时，你需要括号来使条件正确工作。例如，下面这个错误的`if`语句：\n\
  \n```\n//此代码不正确：\nif (reply == 'Y' || reply == 'y' && age >= 12 && age < 65) {\n\
  \    price -= 2.00;\n}\n```\n\n将此代码与清单 10-4 中的正确代码进行比较。这个错误的代码没有用括号将`reply == 'Y'`与`reply\
  \ == 'y'`分组，也没有将`age >= 12`与`age < 65`分组。结果就是图 10-8 中那对奇怪的运行结果。\n\n![image](img/Image00139.gif)\n\
  \n图 10-8： 大写字母的过错。\n\n在图 10-8 中，注意尽管两次运行的年龄都是 85 岁，但输入`y`和`Y`却得到了不同的票价。这是因为，没有括号时，任何`&&`运算符都会在`||`运算符之前被求值。（这是\
  \ Java 编程语言的规则——先求值`&&`，再求值`||`。）当`reply`为`Y`时，错误`if`语句中的条件呈现以下形式：\n\n`reply ==\
  \ 'Y' || some-other-stuff-that-does-not-matter`\n\n每当`reply == 'Y'`为`true`时，整个条件自动为`true`，如图\
  \ 10-9 所示。\n\n![image](img/Image00140.jpg)\n\n图 10-9： “真或假”结果为“真”。\n\n## 构建嵌套\n\n\
  时间是 1968 年，电视剧《囚徒》正在播出。在最后一集中，剧中的英雄遇到了他的宿敌“一号”。起初，一号戴着一个诡异的笑脸/哭脸面具，当面具摘下后，里面是一个猴子面具。要找出猴子面具后面是什么，你得租下整部剧自己看。但与此同时，请注意这种分层：面具中的面具。你可以用`if`语句做同样的事情。本节示例将向你展示如何操作。\n\
  \n但首先，看看清单 10-4。在那段代码中，条件`age >= 12 && age < 65`被测试了两次。每次计算机都将数字 12 和 65 以及`age`值送入其复杂的电路；每次计算机都得到相同的答案。这很浪费，但浪费并不是你唯一关心的问题。\n\
  \n如果你决定更改老年人票的年龄限制呢？从现在起，只有 100 岁以上的人才能享受老年人折扣。你翻遍代码，看到了第一个`age >= 12 && age < 65`测试。你将`65`改为`100`，拍拍自己的背，然后回家。问题是，你只更改了两个`age\
  \ >= 12 && age < 65`测试中的一个，却没有更改另一个。难道把所有的`age >= 12 && age < 65`测试都放在一个地方不是更好吗？\n\
  \n清单 10-5 前来救场。在清单 10-5 中，我将所有`if`语句揉合成一个大块。代码很密集，但很好地完成了任务。\n\n清单 10-5 嵌套的 if 语句\n\
  \n```\nimport java.util.Scanner;\nclass AnotherAgeCheck {\n    public static void\
  \ main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n  \
  \      int age;\n        double price = 0.00;\n        char reply;\n        System.out.print(\"\
  How old are you? \");\n        age = keyboard.nextInt();\n        System.out.print(\"\
  Have a coupon? (Y/N) \");\n```\n\n\n\n\n\n```\nreply = keyboard.findWithinHorizon(\"\
  .\", 0).charAt(0);\nif (age >= 12 && age < 65) {\nprice = 9.25;\nif (reply == ’Y’\
  \ || reply == ’y’) {\nprice -= 2.00;\n}\n} else {\nprice = 5.25;\n}\nSystem.out.print(\"\
  Please pay $\");\nSystem.out.print(price);\nSystem.out.print(\". \");\nSystem.out.println(\"\
  Enjoy the show!\");\nkeyboard.close();\n}\n}\n```\n\n### 嵌套 if 语句\n\n清单 10-5 中代码的运行结果与清单\
  \ 10-4 的运行结果看起来完全相同。你可以在图 10-6 中看到几次运行结果。清单 10-5 的主要思想是将一个 `if` 语句放在另一个 `if` 语句内部。毕竟，第\
  \ 9 章 提到 `if` 语句可以采用以下形式：\n\n```\nif (*条件*) {\n*一些语句*\n} else {\n*其他语句*\n}\n```\n\
  \n谁说 *一些语句* 不能包含 `if` 语句？同样，*其他语句* 也可以包含 `if` 语句。而且，是的，你可以在一个 `if` 语句内部再创建一个 `if`\
  \ 语句，如此嵌套。对于可以拥有的 `if` 语句数量，没有预定义的限制。\n\n```\nif (age >= 12 && age < 65) {\nprice\
  \ = 9.25;\nif (reply == ’Y’ || reply == ’y’) {\nif (isSpecialFeature) {\nprice -=\
  \ 1.00;\n} else {\nprice -= 2.00;\n}\n}\n} else {\nprice = 5.25;\n}\n```\n\n当你将一个\
  \ `if` 语句放在另一个 `if` 语句内部时，就创建了 *嵌套* `if` 语句。只要慢慢来，并在脑海中清晰把握代码的流程，嵌套语句并不难编写。如果有助于理解，可以像图\
  \ 10-10 所示那样画一个流程图。\n\n![image](img/Image00141.jpg)\n\n图 10-10： 清单 10-5 中的流程。\n\n\
  ![warning](img/Image00004.jpg) 当你嵌套语句时，必须强制注意缩进和大括号的使用。（参见图 10-11 。）当代码的缩进具有误导性时，没有人（即使是编写该代码的程序员）能弄清楚代码是如何工作的。缩进混乱的嵌套语句是程序员的噩梦。\n\
  \n![image](img/Image00142.jpg)\n\n图 10-11： 注意添加正确的缩进和大括号。\n\n### 级联 if 语句\n\n这里有一个谜题：你有两支棒球队——Hankees\
  \ 队和 Socks 队。你想在两行上分别显示两队的得分，并且获胜者的得分列在前面。（在电脑屏幕上，获胜者的得分显示在失败者的得分上方。）当比分相同时会发生什么？\n\
  \n你放弃了吗？答案是，没有正确答案。发生什么取决于你编写程序的方式。看看第 9 章 中的清单 9-4 。当比分相等时，条件 `hankees > socks`\
  \ 为 `false` 。因此程序的执行流程会落到 `else` 子句。该子句先显示 Socks 队的得分，再显示 Hankees 队的得分。（参见第 9 章\
  \ 中的图 9-7 。）\n\n程序不一定非要这样工作。如果我将清单 9-4 中的 `hankees > socks` 改为 `hankees >= socks`\
  \ ，那么在平局的情况下，Hankees 队的得分会先显示。\n\n假设你想要更多的控制。当比分相同时，你想看到一条 `It’s a tie` 消息。为此，可以考虑一个三叉分支。一个分支用于\
  \ Hankees 获胜，另一个分支用于 Socks 获胜，第三个分支用于平局。你可以用几种不同的方式编写这段代码，但一种非常合理的方式是清单 10-6 。关于清单\
  \ 10-6 中代码的三次运行，请参见图 10-12 。\n\n![image](img/Image00143.gif)\n\n图 10-12： 加油，队伍，加油！\n\
  \n清单 10-6 平局情况……\n\n```\nimport java.util.Scanner;\nimport static java.lang.System.out;\n\
  class WinLoseOrTie {\npublic static void main(String args[]) {\nScanner keyboard\
  \ = new Scanner(System.in);\nint hankees, socks;\nout.print(\"Hankees and Socks\
  \ scores? \");\nhankees = keyboard.nextInt();\nsocks = keyboard.nextInt();\nout.println();\n\
  if (hankees > socks) {\nout.println(\"Hankees win…\");\nout.print(\"Hankees: \"\
  );\nout.println(hankees);\nout.print(\"Socks: \");\nout.println(socks);\n} else\
  \ if (socks > hankees) {\nout.println(\"Socks win…\");\nout.print(\"Socks: \");\n\
  out.println(socks);\nout.print(\"Hankees: \");\nout.println(hankees);\n} else {\n\
  out.println(\"It’s a tie…\");\nout.print(\"Hankees: \");\nout.println(hankees);\n\
  out.print(\"Socks: \");\nout.println(socks);\n}\nkeyboard.close();\n}\n}\n```\n\n\
  清单 10-6 说明了一种思考问题的方式。你有一个问题，但答案不止两个。（在本节的棒球问题中，问题是“谁赢了？”，答案是“Hankees”、“Socks”或“平局”。）这个问题自然需要一个\
  \ `if` 语句，但 `if` 语句只有两个分支——`true` 分支和 `false` 分支。因此，你将备选方案组合起来，形成 *级联 if 语句*。\n\n\
  在清单 10-6 中，级联 `if` 语句的格式是：\n\n```\nif (*条件 1*) {\n*一些语句*\n} else if (*条件 2*) {\n\
  *其他语句*\n} else {\n*更多语句*\n}\n```\n\n一般来说，你可以根据需要多次使用 `else if`：\n\n```\nif (hankeesWin)\
  \ {\nout.println(\"Hankees win…\");\nout.print(\"Hankees: \");\nout.println(hankees);\n\
  out.print(\"Socks: \");\nout.println(socks);\n} else if (socksWin) {\nout.println(\"\
  Socks win…\");\nout.print(\"Socks: \");\nout.println(socks);\nout.print(\"Hankees:\
  \ \");\nout.println(hankees);\n} else if (isATie) {\nout.println(\"It’s a tie…\"\
  );\nout.print(\"Hankees: \");\nout.println(hankees);\nout.print(\"Socks: \");\n\
  out.println(socks);\n} else if (gameCancelled) {\nout.println(\"Sorry, sports fans.\"\
  );\n} else {\nout.println(\"The game isn’t over yet.\");\n}\n```\n\n级联 `if` 语句并没有什么特别之处。这不是一个新的编程语言特性。级联\
  \ `if` 语句利用了 Java 中的一个漏洞——在某些情况下省略花括号的漏洞。除此之外，级联 `if` 语句只是为你提供了一种在代码中思考决策的新方式。\n\
  \n***注意：*** 清单 10-6 使用了静态导入声明，以避免重复书写 `System.out` 。要了解静态导入声明的一点内容（同时为我没有更深入地解释这个概念而道歉），请参见第\
  \ 9 章 。然后，要了解静态导入声明的真正故事，请参见第 18 章 。\n\n## 枚举可能性\n\n第 8 章 描述了 Java 的 `boolean` 类型——只有两个值（`true`\
  \ 和 `false`）的类型。`boolean` 类型非常方便，但有时你需要更多的值。毕竟，交通灯的值可以是 `green`、`yellow` 或 `red`。扑克牌的花色可以是\
  \ `spade`、`club`、`heart` 或 `diamond`。而工作日可以是 `Monday`、`Tuesday`、`Wednesday`、`Thursday`\
  \ 或 `Friday`。\n\n生活中充满了小范围的可能性，而 Java 有一个可以反映这些可能性的特性。这个特性被称为 `enum` 类型。它从 Java\
  \ 5.0 版本开始可用。\n\n### 创建 enum 类型\n\n\n\n\n\n清单 10-6 中的故事有三种可能的结局——汉基队获胜、袜子队获胜，或者比赛平局。你可以用下面这行\
  \ Java 代码来表示这些可能性：\n\n`enum WhoWins {home, visitor, neither}`\n\n本周的比赛在汉基维尔的 SnitSoft\
  \ 体育场进行，因此值`home`代表汉基队获胜，值`visitor`代表袜子队获胜。\n\n计算机编程的目标之一是让每个程序的结构反映它所解决的问题。当程序让你联想到其底层问题时，程序就容易理解且维护成本低。例如，一个用于统计客户账户的程序应该使用像`customer`和`account`这样的名称。而一个处理三种可能结果（主队赢、客队赢、平局）的程序应该有一个包含三个可能值的变量。`enum\
  \ WhoWins {home, visitor, neither}`这行代码创建了一个用于存储三个值的类型。\n\n`WhoWins`类型被称为*枚举类型*。你可以把新的`WhoWins`类型看作是一个增强版的`boolean`。与两个值（`true`和`false`）不同，`WhoWins`类型有三个值（`home`、`visitor`和`neither`）。你可以创建一个`WhoWins`类型的变量：\n\
  \n`WhoWins who;`\n\n然后给这个新变量赋值：\n\n`who = WhoWins.home;`\n\n在下一节中，我将把`WhoWins`类型派上用场。\n\
  \n### 使用枚举类型\n\n清单 10-7 展示了如何使用全新的`WhoWins`类型。\n\n清单 10-7 骄傲的赢家和失意的输家\n\n```\nimport\
  \ java.util.Scanner;\nimport static java.lang.System.out;\nclass Scoreboard {\n\
  \    enum WhoWins {home, visitor, neither}\n    public static void main(String args[])\
  \ {\n        Scanner keyboard = new Scanner(System.in);\n        int hankees, socks;\n\
  \        WhoWins who;\n        out.print(\"Hankees and Socks scores? \");\n    \
  \    hankees = keyboard.nextInt();\n        socks = keyboard.nextInt();\n      \
  \  out.println();\n        if (hankees > socks) {\n            who = WhoWins.home;\n\
  \            out.println(\"The Hankees win :-)\");\n        } else if (socks > hankees)\
  \ {\n            who = WhoWins.visitor;\n            out.println(\"The Socks win\
  \ :-(\");\n        } else {\n            who = WhoWins.neither;\n            out.println(\"\
  It’s a tie :-|\");\n        }\n        out.println();\n        out.println(\"Today’s\
  \ game is brought to you by\");\n        out.println(\"SnitSoft, the number one\
  \ software\");\n        out.println(\"vendor in the Hankeeville area.\");\n    \
  \    out.println(\"SnitSoft is featured proudly in\");\n        out.println(\"Chapter\
  \ 6. And remember, four out\");\n        out.println(\"of five doctors recommend\"\
  );\n        out.println(\"SnitSoft to their patients.\");\n        out.println();\n\
  \        if (who == WhoWins.home) {\n            out.println(\"We beat ’em good.\
  \ Didn’t we?\");\n        }\n        if (who == WhoWins.visitor) {\n           \
  \ out.println(\"The umpire made an unfair call.\");\n        }\n        if (who\
  \ == WhoWins.neither) {\n            out.println(\"The game goes into overtime.\"\
  );\n        }\n        keyboard.close();\n    }\n}\n```\n\n清单 10-7 中程序的三个运行结果如图图\
  \ 10-13 所示。\n\n![图片](img/Image00144.gif)\n\n图 10-13: 汉基维尔的喜悦？\n\n以下是清单 10-7 中发生的事情：\n\
  \n* **我创建了一个变量来存储`WhoWins`类型的值。**\n  就像这行代码\n  `double amount;`\n  声明`amount`用于存储`double`值（如`5.95`和`30.95`），这行代码\n\
  \  `WhoWins who;`\n  声明`who`用于存储`WhoWins`值（如`home`、`visitor`和`neither`）。\n\n* **我给`who`变量赋了一个值。**\n\
  \  我执行了其中一个\n  `who = WhoWins.something;`\n  赋值语句。具体执行哪个语句取决于`if`语句中`hankees > socks`比较的结果。\n\
  \  注意，在清单 10-7 中，我引用了每个`WhoWins`值。我写的是`WhoWins.home`、`WhoWins.visitor`或`WhoWins.neither`。如果我忘了`WhoWins`前缀而写成\n\
  \  `who = home;` //这个赋值不生效！\n  编译器会给我一个`home cannot be resolved to a variable`的错误信息。这就是`enum`类型的工作方式。\n\
  \n* **我将变量的值与每个`WhoWins`值进行比较。**\n  在一个`if`语句中，我检查了`who == WhoWins.home`条件。在另外两个`if`语句中，我检查了其他`WhoWins`值。\n\
  \n在清单 10-7 的末尾，我本可以不使用`enum`值。我可以再次测试像`hankees > socks`这样的条件：\n\n```\nif (hankees\
  \ > socks) {\n    out.println(\"The Hankees win :-)\");\n}\n// 然后在程序后面……\nif (hankees\
  \ > socks) {\n    out.println(\"We beat ’em good. Didn’t we?\");\n}\n```\n\n但这种策略会很笨拙。在一个更复杂的程序中，我可能最终要检查`hankees\
  \ > socks`十几次。这就像一遍又一遍地问同一个问题。\n\n与其重复检查`hankees > socks`条件，不如将比赛结果存储为一个`enum`值。然后我可以根据需要多次检查这个`enum`值。这是解决重复检查问题的一种整洁方式。\n\
