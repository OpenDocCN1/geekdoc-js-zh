  \n运行清单 10-3 代码的结果类似于图 10-5 所示。清单 10-2 和 10-3 的唯一区别在于使用了`boolean`变量。在清单 10-3 中，你在任何`if`语句开始之前就处理了所有小于号和双等号。当你遇到两个`if`语句时，条件可以使用简单的词语——比如`isKid`、`isSenior`和`hasCoupon`。有了这些`boolean`变量，表达每个`if`语句的条件就变得轻而易举。你可以在第\
  \ 8 章中了解更多关于`boolean`变量的内容。\n\n添加`boolean`变量可以让你的代码更易于管理。但由于某些编程语言没有`boolean`变量，许多程序员更喜欢即时创建`if`条件。这就是为什么我在本书中混合使用两种技术（带和不带`boolean`变量的条件）。\n\
  \n### 混合使用不同的逻辑运算符\n\n如果你读过清单 10-2，就会知道我家附近的电影院提供折扣券。问题是，我不能将优惠券与其他任何折扣同时使用。我曾试图说服检票员我未满\
  \ 12 岁，但他不信。那招不管用后，我又尝试将优惠券与老年人折扣结合使用，结果也行不通。\n\n显然，影院使用了某种软件来检查像我这样的人。它看起来有点像清单\
  \ 10-4 中的代码。要观看代码运行，请参见图 10-6。\n\n![image](img/Image00137.gif)\n\n图 10-6： 运行清单 10-4\
