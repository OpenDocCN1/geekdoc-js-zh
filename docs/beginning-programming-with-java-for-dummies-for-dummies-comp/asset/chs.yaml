  \ 等方法时使用 `Scanner` 变量名。**  \n  例如，要从清单 13-1 转到清单 13-2，我将  \n  `unitPrice = keyboard.nextDouble();`\
  \  \n  `quantity = keyboard.nextInt();`  \n  改为  \n  `unitPrice =` `diskScanner`\
