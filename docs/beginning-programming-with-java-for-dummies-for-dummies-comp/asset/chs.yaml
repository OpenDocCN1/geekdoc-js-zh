  `import java.util.Scanner;`\n`class BetterProcessData {`\n`public static void main(String\
  \ args[]) {`\n`Scanner keyboard = new Scanner(System.in);`\n`double unitPrice;`\n\
  `int quantity;`\n`boolean taxable;`\n**`NumberFormat currency = NumberFormat.getCurrencyInstance();`**\n\
  `System.out.print(\"Unit price: \");`\n`unitPrice = keyboard.nextDouble();`\n`System.out.print(\"\
  Quantity: \");`\n`quantity = keyboard.nextInt();`\n`System.out.print(\"Taxable?\
  \ (true/false) \");`\n`taxable = keyboard.nextBoolean();`\n`double total = unitPrice\
  \ * quantity;`\n`if (taxable) {`\n`total = total * 1.05;`\n`}`\n**`String niceTotal\
  \ = currency.format(total);`**\n`System.out.print(\"Total: \");`\n**`System.out.println(niceTotal);`**\n\
  `keyboard.close();`\n`}`\n`}`\n```\n\n清单 18-7 中代码的一些漂亮运行结果，请参见图 18-10。现在，你终于看到了像\
  \ `$20.34` 这样的总金额，而不是 `20.338500000000003`。啊！这样好多了。\n\n![图像](img/Image00225.jpg)\n\
  \n图 18-10: 看看这些漂亮的数字。\n\n### NumberFormat 的工作原理\n\n就我当前的目的而言，清单 18-7 中的代码包含三个有趣的变量：\n\
  \n*   变量 `total` 存储一个数字，例如 42.0。\n*   变量 `currency` 存储一个对象，该对象可以将数字格式化为美国货币金额。\n\
