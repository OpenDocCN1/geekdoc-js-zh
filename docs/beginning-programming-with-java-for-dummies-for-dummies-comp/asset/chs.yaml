  \n### 返回类型和返回值如何工作\n\n我想追踪 清单 19-10 和 19-11 中的部分操作。对于输入数据，我使用 图 19-9 中的第一组值。\n\n\
  以下是调用 `getInterest` 时发生的情况（你可以跟随 图 19-10 查看）：\n\n*   `balance` 的值为 `9508.00`，`rate`\
  \ 的值为 `2.0`。因此 `balance * (rate / 100.0)` 的值为 `190.16`——一百九十美元十六美分。\n*   值 `190.16`\
  \ 被赋值给 `interest` 变量，因此语句\n    `return interest;`\n    的效果等同于\n    `return 190.16;`\n\
  *   `return` 语句将这个值 `190.16` 发送回调用该方法的代码。*在流程中的这一点，清单 19-11 中的整个方法调用*——`anAccount.getInterest(interestRate)`——*取值为*\
  \ `190.16` *。*\n*   最后，值 `190.16` 被赋值给变量 `yearlyInterest`。\n\n![image](img/Image00236.gif)\n\
  \n图 19-10： 方法调用是一个带有值的表达式。\n\n![remember](img/Image00005.jpg) 如果方法返回任何东西，那么对该方法的调用就是一个带有值的表达式。该值可以被打印、赋值给变量、与其他值相加，等等。任何你能对其他类型的值做的事情，你都可以对方法调用做。\n\
  \n### 再次使用方法头\n\n当你创建方法或方法调用时，必须小心地一致使用 Java 的类型。确保检查以下几点：\n\n*   在 清单 19-10 中，`getInterest`\
  \ 方法的方法头以单词 `double` 开头。当方法执行时，它应该将一个 `double` 值发送回调用它的地方。\n*   同样在 清单 19-10 中，`getInterest`\
  \ 方法的最后一条语句是 `return interest`。该方法返回存储在 `interest` 变量中的任何值，而 `interest` 变量的类型是 `double`。到目前为止一切顺利。\n\
  *   在 清单 19-11 中，调用 `getInterest` 返回的值被赋值给名为 `yearlyInterest` 的变量。果然，`yearlyInterest`\
  \ 的类型是 `double`。\n\n这就解决了！在 清单 19-10 和 19-11 中，处理 `getInterest` 方法时类型的使用是一致的。我太激动了！\n\
