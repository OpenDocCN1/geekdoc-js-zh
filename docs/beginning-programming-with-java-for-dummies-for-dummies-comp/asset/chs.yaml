  \ `BetterAccount` 对象，然后调用清单 19-4 中的方法。当你运行所有这些代码时，你会得到类似图 19-3 的结果。\n\n### 向方法传递值\n\
  \n想象一下，你派一个人去超市买面包。当你这样做时，你会说：“去超市买些面包。”（在家试试看。你很快就会得到一条新鲜的面包！）当然，另一次，你派同一个人去超市买香蕉。你说：“去超市买些香蕉。”这一切的意义何在？嗯，你有一个方法，并且有一些即时信息，在调用方法时传递给方法。这个方法的名字是“去超市买些……”。即时信息要么是“面包”，要么是“香蕉”，取决于你的烹饪需求。在\
  \ Java 中，方法调用看起来像这样：\n\n```java\ngoToTheSupermarketAndBuySome(bread);\ngoToTheSupermarketAndBuySome(bananas);\n\
  ```\n\n括号里的东西被称为*参数*或*参数列表*。有了参数，你的方法变得更加通用。你不再每次都得到相同的东西，而是可以一次派某人去超市买面包，另一次买香蕉，第三次买鸟食。当你调用\
  \ `goToTheSupermarketAndBuySome` 方法时，你当场决定要请你的朋友买什么。\n\n这些概念在清单 19-6 和 19-7 中得到了更具体的体现。\n\
  \n清单 19-6 添加利息\n\n```java\nimport java.text.NumberFormat;\nimport static java.lang.System.out;\n\
  \nclass NiceAccount {\n    String lastName;\n    int id;\n    double balance;\n\n\
  \    void addInterest(double rate) {\n        out.print(\"Adding \");\n        out.print(rate);\n\
  \        out.println(\" percent…\");\n        balance += balance * (rate / 100.0);\n\
  \    }\n\n    void display() {\n        NumberFormat currency = NumberFormat.getCurrencyInstance();\n\
  \        out.print(\"The account with last name \");\n        out.print(lastName);\n\
  \        out.print(\" and ID number \");\n        out.print(id);\n        out.print(\"\
  \ has balance \");\n        out.println(currency.format(balance));\n    }\n}\n```\n\
  \n清单 19-7 调用 addInterest 方法\n\n```java\nimport java.util.Random;\n\nclass ProcessNiceAccounts\
  \ {\n    public static void main(String args[]) {\n        Random myRandom = new\
  \ Random();\n        NiceAccount anAccount;\n        double interestRate;\n\n  \
  \      for (int i = 0; i < 3; i++) {\n            anAccount = new NiceAccount();\n\
  \            anAccount.lastName = \"\" +\n                (char) (myRandom.nextInt(26)\
  \ + 'A') +\n                (char) (myRandom.nextInt(26) + 'a') +\n            \
  \    (char) (myRandom.nextInt(26) + 'a');\n            anAccount.id = myRandom.nextInt(10000);\n\
  \            anAccount.balance = myRandom.nextInt(10000);\n            anAccount.display();\n\
  \            interestRate = myRandom.nextInt(5);\n            anAccount.addInterest(interestRate);\n\
  \            anAccount.display();\n            System.out.println();\n        }\n\
  \    }\n}\n```\n\n在清单 19-7 中，这一行\n\n```java\nanAccount.addInterest(interestRate);\n\
  ```\n\n\n\n\n它的作用与我的小超市示例中的 `goToTheSupermarketAndBuySome(bread)` 这一行相同。`addInterest`\
  \ 这个词是方法名，括号中的 `interestRate` 是参数。整体来看，这条语句告诉清单 19-6 中的代码执行其 `addInterest` 方法。这条语句还告诉清单\
  \ 19-6 在方法的计算中使用某个数值（即 `interestRate` 变量中存储的值）。`interestRate` 的值可以是 1.0、2.0，或者通过调用\
  \ `myRandom.nextInt(5)` 得到的任何其他值。同样，`goToTheSupermarketAndBuySome` 方法适用于面包、香蕉，或者你从超市需要的任何其他东西。\n\
  \n下一节将详细描述 `addInterest` 及其操作。同时，清单 19-6 和清单 19-7 中代码的运行结果如图 19-5 所示。\n\n![image](img/Image00231.jpg)\n\
  \n图 19-5： 运行清单 19-7 中的代码。\n\n![remember](img/Image00005.jpg) Java 对类型的使用有严格的规定。例如，你不能将\
  \ `double` 值（如 `3.14`）赋值给 `int` 变量。（编译器会直接拒绝截断 `.14` 部分，你会收到一条错误信息。这有什么新鲜的呢？）但 Java\
  \ 在类型使用上并非完全不讲道理。Java 允许你将 `int` 值（如 `myRandom.nextInt(5)`）赋值给 `double` 变量（如 `interestRate`）。如果你将\
  \ `int` 值 `2` 赋值给 `double` 变量 `interestRate`，那么 `interestRate` 的值就变成了 `2.0`。结果如图\
  \ 19-5 的第二行所示。\n\n### 传递值\n\n调用方法时，你可以动态地向该方法传递信息。这些信息位于方法的参数列表中。清单 19-7 中有一个对 `addInterest`\
  \ 方法的调用：\n\n```\nanAccount.addInterest(interestRate);\n```\n\n第一次循环时，`interestRate`\
  \ 的值为 `2.0`。（记住，我使用的是图 19-5 中的数据。）在程序运行的这一时刻，该方法调用相当于以下语句：\n\n```\nanAccount.addInterest(2.0);\n\
  ```\n\n计算机即将运行 `addInterest` 方法内部的代码（清单 19-6 中的一个方法）。但首先，计算机会将值 `2.0` *传递*给 `addInterest`\
  \ 方法头中的参数。在 `addInterest` 方法内部，`rate` 的值变为 `2.0`。关于这一概念的图示，请参见图 19-6。\n\n![image](img/Image00232.gif)\n\
  \n图 19-6： 将值传递给方法的参数。\n\n这里有一个有趣的地方。`addInterest` 方法头中的参数是 `rate`。但在 `ProcessNiceAccounts`\
  \ 类内部，方法调用中的参数是 `interestRate`。这没问题。实际上，这是标准做法。\n\n在清单 19-6 和清单 19-7 中，参数的名称不必相同。唯一重要的是两个参数（`rate`\
  \ 和 `interestRate`）具有相同的类型。在清单 19-6 和清单 19-7 中，这两个参数都是 `double` 类型，所以一切正常。\n\n在\
  \ `addInterest` 方法内部，`+=` 赋值运算符将 `balance * (rate / 100.0)` 加到现有的 `balance` 值上。关于\
  \ `+=` 赋值运算符的更多信息，请参见第 7 章。\n\n### 使用方法头\n\n在接下来的几点中，我将对 `addInterest` 方法头（在清单 19-6\
  \ 中）做一些说明：\n\n*   **关键字** `void` **告诉计算机，当调用** `addInterest` **方法时，该方法不会向调用它的地方返回任何值。**\n\
  \n    下一节将给出一个方法返回值的示例。\n\n*   **关键字** `addInterest` **是方法名。**\n\n    这是你在编写 `ProcessNiceAccounts`\
  \ 类代码时用来调用该方法的名称。（参见清单 19-7。）\n\n*   **方法头中的括号包含了调用方法时将要传递的所有内容的占位符。**\n\n    调用方法时，你可以动态地向该方法传递信息。这些信息就是方法的参数列表。`addInterest`\
  \ 方法头表明，`addInterest` 方法接受一条信息，并且该信息必须是 `double` 类型：\n\n    ```\n    void addInterest(double\
  \ rate)\n    ```\n\n    确实，如果你查看对 `addInterest` 的调用（在 `ProcessNiceAccounts` 类的 `main`\
  \ 方法中），该调用中包含变量 `interestRate`，而 `interestRate` 是 `double` 类型。当我调用 `addInterest`\
  \ 时，我向该方法传递了一个 `double` 类型的值。\n\n### 方法如何使用对象的值\n\n清单 19-6 中的 `addInterest` 方法被清单\
  \ 19-7 的 `main` 方法调用了三次。每次的实际账户余额和利率都不同：\n\n*   **在图 19-5 的第一次调用中，余额为 8983.00，利率为\
