  \ **Beginning Programming with Java For Dummies Cheat Sheet**。\n\n## 下一步去哪里\n\n\
  如果你已经读到这里，那么你已经准备好开始阅读关于计算机编程的内容了。把我想象成你的向导、你的主人、你的私人助理。我尽一切努力让内容有趣，最重要的是，帮助你理解。\n\
  \n![ontheweb](img/Image00008.jpg) 如果你喜欢所读的内容，请给我发电子邮件、在我的 Facebook 墙上留言或发推文。我的电子邮件地址（专门为本书的评论和问题创建）是`BeginProg@allmycode.com`。我的\
  \ Facebook 页面是`/allmycode`，我的 Twitter 账号是`@allmycode`。别忘了：要获取最新信息，请访问本书的支持网站——[`http://allmycode.com/BeginProg`](http://allmycode.com/BeginProg)。\n\
  \n第 1 部分\n\n# Java 编程入门\n\n本部分内容……\n\n激发成为 Java 开发者的热情\n\n安装软件\n\n运行一些示例程序\n\n第\
  \ 1 章\n\n## 开始\n\n本章内容\n\n![check](img/Image00002.jpg) **了解计算机编程到底是什么**\n\n![check](img/Image00002.jpg)\
  \ **理解让你能够编写程序的软件**\n\n![check](img/Image00002.jpg) **准备使用集成开发环境**\n\n计算机编程？那是什么？它技术性强吗？会疼吗？它政治正确吗？谷歌控制它吗？为什么有人想学它？还有我呢？我能学会吗？\n\
  \n## 这一切是怎么回事？\n\n\n\n\n你可能用过电脑进行文字处理。打一封信，打印出来，然后把打印件寄给你爱的人。如果你能方便地使用电脑，你可能还上过网。访问一个页面，点击一个链接，再看另一个页面。很简单，对吧？\n\
  \n其实，这之所以简单，只是因为有人精确地告诉了电脑该做什么。如果你从工厂直接拿来一台电脑，不给它任何指令，这台电脑既不能做文字处理，也不能上网，什么也做不了。电脑所能做的，就是遵循人们给它的指令。\n\
  \n现在想象一下，你正在用 Microsoft Word 写一部伟大的美国小说，然后你到了一行的末尾（不是句子的末尾，只是行的末尾）。当你输入下一个单词时，电脑的光标会自动跳到下一行。这是怎么回事呢？\n\
  \n其实，有人编写了一个`计算机程序`——一套告诉电脑该做什么的指令。程序（或程序的一部分）的另一个名称是`代码`。清单 1-1 展示了 Microsoft Word\
  \ 的部分代码可能是什么样子。\n\n清单 1-1 计算机程序中的几行代码\n\n```\nif (columnNumber > 60) {\n    wrapToNextLine();\n\
  } else {\n    continueSameLine();\n}\n```\n\n如果你把清单 1-1 翻译成通俗易懂的英语，你会得到类似这样的内容：\n\
  \n`如果列号大于 60，`\n`则换到下一行。`\n`否则（如果列号不大于 60），`\n`则停留在同一行。`\n\n必须有人编写像清单 1-1 中那样的代码。这些代码，连同数百万行其他代码，构成了名为\
  \ Microsoft Word 的程序。\n\n那上网冲浪呢？你点击一个应该直接带你到 Facebook 的链接。在幕后，有人编写了如下代码：\n\n```\n\
  Go to <a href=\"http://www.facebook.com\">Facebook</a>.\n```\n\n无论如何，总得有人编写程序。这个人被称为`程序员`。\n\
  \n### 告诉电脑该做什么\n\n你用电脑做的每一件事都涉及大量的代码。例如，每个电脑游戏实际上都是一大堆（其实是“非常庞大”的！）计算机代码。在某个时候，必须有人编写游戏程序：\n\
  \n```\nif (person.touches(goldenRing)) {\n    person.getPoints(10);\n}\n```\n\n\
  毫无疑问，编写程序的人拥有宝贵的技能。这些人有两个重要的特质：\n\n*   他们知道如何将大问题分解成更小的、逐步的流程。\n*   他们能用非常精确的语言表达这些步骤。\n\
  \n用于编写步骤的语言被称为`编程语言`，而 Java 只是数千种有用的编程语言之一。清单 1-1 中的内容就是用 Java 编程语言编写的。\n\n### 各取所需\n\
  \n本书并非关于编程语言之间的差异，但你应该看看其他语言中的代码，以便更好地理解全局。例如，还有另一种语言 Visual Basic，它的代码看起来与 Java\
  \ 编写的代码有些不同。Visual Basic 程序的一个片段可能如下所示：\n\n```\nIf columnNumber > 60 Then\n    Call\
  \ wrapToNextLine\nElse\n    Call continueSameLine\nEnd If\n```\n\nVisual Basic 代码看起来比清单\
  \ 1-1 中的 Java 代码更像普通英语。但是，如果你认为 Visual Basic 像英语，那么再看看用 COBOL 编写的代码：\n\n```\nIF\
  \ COLUMN-NUMBER IS GREATER THAN 60 THEN\n    PERFORM WRAP-TO-NEXT-LINE\nELSE\n \
  \   PERFORM CONTINUE-SAME-LINE\nEND-IF.\n```\n\n在另一个极端，你会发现像 Forth 这样的语言。以下是用 Forth\
  \ 编写的一段代码：\n\n```\n: WRAP? 60 > IF WRAP_TO_NEXT_LINE? ELSE CONTINUE_SAME_LINE? THEN\
  \ ;\n```\n\n计算机语言之间可能差异很大，但在某些方面，它们又是相同的。当你习惯了写 `IF COLUMN-NUMBER IS GREATER THAN\
  \ 60`，你也能轻松地写出 `if (columnNumber > 60)`。这只不过是用一套符号替换另一套符号的心理过程。最终，写像 `if (columnNumber\
  \ > 60)` 这样的东西会变成你的第二天性。\n\n## 从你的思维到电脑的处理器\n\n当你创建一个新的计算机程序时，你会经历一个多步骤的过程。这个过程涉及三个重要的工具：\n\
  \n*   **编译器：** 编译器将你的代码翻译成计算机友好（人类不友好）的指令。\n*   **虚拟机：** 虚拟机逐步执行计算机友好的指令。\n*   **应用程序编程接口：**\
  \ 应用程序编程接口包含有用的预编写代码。\n\n接下来的三节将分别描述这三个工具。\n\n### 翻译你的代码\n\n你可能听说过计算机处理的是 0 和 1。这当然没错，但这意味着什么呢？首先，计算机电路并不直接处理字母表中的字母。当你在电脑屏幕上看到单词\
  \ *Start* 时，计算机内部将该单词存储为 `01010011 01110100 01100001 01110010 01110100`。你看到那个友好的五个字母单词的感觉，只是你对电脑屏幕像素的解读，仅此而已。计算机将所有内容分解成非常底层、不友好的\
  \ 0 和 1 序列，然后再将它们重新组合，以便人类能够处理结果。\n\n那么，当你编写一个计算机程序时会发生什么呢？程序必须被翻译成 0 和 1。这个翻译过程的正式名称是`编译`。没有编译，计算机就无法运行你的程序。\n\
  \n我编译了清单 1-1 中的代码。然后我做了一些无害的修改，以便看到生成的 0 和 1。我看到的是图 1-1 中的大杂烩。\n\n![image](img/Image00010.gif)\n\
  \n图 1-1: 我的电脑能理解这些 0 和 1，但我不能。\n\n图 1-1 中编译后的混乱内容有许多不同的名称：\n\n*   大多数 Java 程序员称之为`字节码`。\n\
  *   我经常称它为`.class 文件`。这是因为在 Java 中，字节码存储在名为 *SomethingOrOther* `.class` 的文件中。\n\
  *   为了强调区别，Java 程序员将清单 1-1 称为`源代码`，并将图 1-1 中的 0 和 1 称为`目标代码`。\n\n要直观地了解源代码和目标代码之间的关系，请参见图\
  \ 1-2。你可以编写源代码，然后让计算机根据你的源代码创建目标代码。为了创建目标代码，计算机使用一种名为`编译器`的特殊软件工具。\n\n![image](img/Image00011.jpg)\n\
  \n图 1-2: 计算机编译源代码以创建目标代码。\n\n![technicalstuff](img/Image00007.jpg) 你的计算机硬盘上可能有一个名为\
  \ `javac` 或 `javac.exe` 的文件。这个文件包含了那个特殊的软件工具——编译器。（嘿，怎么样？`javac` 代表“Java 编译器！”）作为\
  \ Java 程序员，你经常告诉你的计算机构建一些新的目标代码。你的计算机会在幕后运行 `javac` 文件中的指令来实现这个愿望。\n\n### 运行代码\n\
  \n几年前，我在哥本哈根待了一周。我和一个朋友一起玩，他能流利地说丹麦语和英语。当我们在公园里聊天时，我隐约注意到一些孩子在我们周围转悠。我一个丹麦语单词都不会，所以我以为孩子们只是在聊些普通的孩子话题。\n\
  \n然后我的朋友告诉我，孩子们说的不是丹麦语。“他们在说什么语言？”我问道。\n\n\n\n\n\n“他们在胡言乱语，”她说，“那只是些无意义的音节。他们听不懂英语，所以只是在模仿你。”\n\
  \n现在回到当下的话题。我看着图 1-1 中的内容，忍不住想嘲笑我的电脑说话的方式。但那样的话，我就和哥本哈根的那些孩子没什么两样了。对我来说毫无意义的东西，对我的电脑来说却可能意义非凡。当图\
  \ 1-1 中的 0 和 1 渗透进电脑的电路时，电脑就会“思考”出图 1-3 中所示的那些想法。\n\n![image](img/Image00013.jpg)\n\
  \n图 1-3： 电脑从字节码文件中获取的内容。\n\n每个人都知道电脑不会思考，但电脑可以执行图 1-3 中描述的指令。在许多编程语言（例如 C++和 COBOL）中，电脑所做的正是我所描述的那样。电脑会吞下一些目标代码，然后执行目标代码所指示的任何操作。\n\
  \n许多编程语言都是这样工作的，但 Java 并非如此。在 Java 中，电脑执行的是另一组不同的指令。电脑执行的是像图 1-4 中那样的指令。\n\n![image](img/Image00014.jpg)\n\
  \n图 1-4： 电脑运行 Java 程序的方式。\n\n图 1-4 中的指令告诉电脑如何执行其他指令。电脑的第一条指令不是“从内存中获取`columnNumber`”，而是“按照字节码文件中的指示去做”。（当然，在字节码文件中，第一条指令恰好就是“从内存中获取`columnNumber`”。）\n\
  \n有一个特殊的软件负责执行图 1-4 中的指令。这个特殊的软件被称为*Java 虚拟机*（JVM）。JVM 引导你的电脑执行一些字节码指令。当你运行一个 Java\
  \ 程序时，你的电脑实际上是在运行 JVM。这个 JVM 会逐位检查你的字节码，并执行字节码中描述的指令。\n\n有很多好的比喻可以描述 JVM。可以把 JVM\
  \ 想象成一个代理、一个跑腿的、一个中间人。无论如何，你都会遇到图 1-5 所示的情况。在（a）侧，是大多数编程语言的情况——电脑直接运行目标代码。在（b）侧，是\
  \ Java 的情况——电脑运行 JVM，而 JVM 则遵循字节码的指令。\n\n![image](img/Image00015.jpg)\n\n图 1-5：\
  \ 运行计算机程序的两种方式。\n\n![technicalstuff](img/Image00007.jpg) 你的电脑硬盘上可能有一些名为`javac`和`java`（或`javac.exe`和`java.exe`）的文件。`java`（或`java.exe`）文件包含了前面图\
  \ 1-4 中所示的指令——即 JVM 中的指令。作为一名 Java 程序员，你经常告诉你的电脑运行一个 Java 程序。你的电脑通过在后台运行`java`文件中的指令来实现这个愿望。\n\
  \n### 你可以使用的代码\n\n在 20 世纪 80 年代早期，我的表姐夫克里斯在一家计算机软件公司工作。这家公司为文字处理机编写代码。（当时，如果你想不用打字机来撰写文档，你会买一台除了文字处理之外什么也不做的“计算机”。）克里斯抱怨说，他总被要求一遍又一遍地编写同样的老代码。“首先，我写一个查找替换程序。然后我写一个拼写检查器。接着我又写另一个查找替换程序。然后，一种不同的拼写检查器。再然后，一个更好的查找替换程序。”\n\
  \n克里斯是如何保持对工作的兴趣的呢？而克里斯的雇主又是如何维持业务的呢？每隔几个月，克里斯就得重新发明轮子。扔掉旧的查找替换程序，从头开始写一个新程序。这效率很低。更糟糕的是，这很无聊。\n\
  \n多年来，计算机专业人士一直在寻找圣杯——一种让软件易于重用的编写方式。不要反复编写和重写你的查找替换代码。只需将任务分解成小块。一块用于查找单个字符，另一块用于查找空格，第三块用于将一个字母替换为另一个字母。当你拥有所有的小块后，只需将这些小块组装起来，形成一个查找替换程序。之后，当你想到文字处理软件的新功能时，你可以用稍微不同的方式重新组装这些小块。这很合理，成本效益高，而且有趣得多。\n\
  \n20 世纪 80 年代末，软件开发取得了多项进展，到 90 年代初，许多大型编程项目都开始使用预制组件来编写。Java 于 1995 年问世，因此该语言的创始人很自然地创建了一个可重用代码库。这个库包含了大约\
  \ 250 个程序，包括处理磁盘文件的代码、创建窗口的代码以及通过互联网传递信息的代码。自 1995 年以来，这个库已经发展到包含超过 4000 个程序。这个库被称为*应用程序编程接口（API）*。\n\
  \n每个 Java 程序，即使是最简单的程序，都会调用 Java API 中的代码。这个 Java API 既实用又强大。它实用，是因为你可以用 API 中的程序做很多事情。它强大，是因为\
  \ API 非常庞大。没有人能记住 Java API 提供的所有功能。程序员会记住他们经常使用的功能，并在需要时查阅那些他们急需的功能。他们在一个名为*API\
  \ 规范*（大多数 Java 程序员亲切地称之为*API 文档*或*Javadocs*）的在线文档中查找这些功能。\n\nAPI 文档（参见[`http://docs.oracle.com/javase/8/docs/api`](http://docs.oracle.com/javase/8/docs/api/)）描述了\
  \ Java API 中的数千个功能。作为一名 Java 程序员，你每天都会查阅这个 API 文档。你可以将文档收藏在 Oracle 网站上，并在需要查找内容时重新访问该网站，或者你也可以通过[`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)上的链接下载自己的\
  \ API 文档副本，从而节省时间。\n\n## 你的 Java 编程工具集\n\n要编写 Java 程序，你需要本章前面描述的工具：\n\n*   **你需要一个\
  \ Java 编译器。**（请参阅“翻译你的代码”一节。）\n*   **你需要一个 JVM。**（请参阅“运行代码”一节。）\n*   **你需要 Java\
  \ API。**（请参阅“你可以使用的代码”一节。）\n*   **你需要访问 Java API 文档。**（同样，请参阅“你可以使用的代码”一节。）\n\n\
  你还需要一些不那么特殊的工具：\n\n*   **你需要一个编辑器来编写你的 Java 程序。** 清单 1-1 包含了一个计算机程序的一部分。说到底，计算机程序就是一大段文本。因此，要编写计算机程序，你需要一个*编辑器*——一个用于创建文本文档的工具。\n\
  \n    编辑器很像 Microsoft Word，或者任何其他文字处理程序。最大的区别在于，编辑器不会给你的文本添加任何格式——没有粗体、斜体或字体区分。计算机程序完全没有格式。它们除了普通的字母、数字和其他熟悉的键盘字符之外，什么都没有。\n\
  \n\n\n\n\n![remember](img/Image00005.jpg) 当你编辑程序时，可能会看到粗体文本、斜体文本以及多种颜色的文本。但你的程序本身并不包含这些格式。如果你看到类似格式化的内容，那是因为你使用的编辑器启用了语法高亮。通过*语法高亮*，编辑器让文本看起来像是被格式化，以帮助你理解程序的结构。相信我，语法高亮非常有用。\n\
  \n* **你需要一种发出命令的方式。** 你需要一种方式来表达诸如“编译这个程序”和“运行 JVM”之类的指令。每台计算机都提供了发出命令的方式。（你可以双击图标，或者在运行对话框中输入冗长的命令。）但当你使用计算机的这些功能时，你需要在不同窗口之间跳转。你打开一个窗口阅读\
  \ Java 文档，另一个窗口编辑 Java 程序，第三个窗口启动 Java 编译器。这个过程可能非常*繁琐*。\n\n### 用于创建代码的工具\n\n在理想情况下，你可以通过一个统一的界面完成所有程序编辑、文档阅读和命令发出。这个界面被称为*集成开发环境*（*IDE*）。\n\
  \n一个典型的 IDE 将屏幕的工作区域划分为多个窗格——一个用于编辑程序，一个用于列出程序名称，一个用于发出命令，还有其他窗格帮助你编写和测试程序。你可以根据需要排列这些窗格以便快速访问。更棒的是，如果你更改了某个窗格中的信息，IDE\
  \ 会自动更新所有其他窗格中的信息。\n\nIDE 帮助你无缝地从编程工作的一个部分切换到另一个部分。有了 IDE，你无需担心编辑、编译和运行 JVM 的具体操作。相反，你可以专注于编写程序的逻辑。（你难道不知道吗？无论如何，你总会有需要担心的事情！）\n\
  \n在接下来的章节中，我将介绍 Eclipse IDE 的基本功能。Eclipse 有很多花哨的功能，但你可以忽略大部分，只需学会重复几个常规步骤。使用 Eclipse\
  \ 几次后，你的大脑会自动执行这些常规步骤。从那时起，你就不用再担心 Eclipse，而是专注于 Java 编程。\n\n当你阅读我关于 Eclipse 的段落时，请记住\
  \ Java 和 Eclipse 并非绑定在一起。本书中的程序适用于任何能运行 Java 的 IDE。除了 Eclipse，你还可以使用 IntelliJ IDEA、NetBeans、BlueJ\
  \ 或其他任何 Java IDE。事实上，如果你喜欢“艰苦朴素”，你也可以不使用 IDE 来编写和运行本书的程序。你可以使用记事本、TextEdit 或 vi，配合操作系统的命令提示符或终端。这一切都取决于你。\n\
  \n### 你的硬盘上已经有什么？\n\n你可能已经拥有一些创建 Java 程序所需的工具。但在较旧的计算机上，你的工具可能已经过时。本书中的大多数示例适用于所有版本的\
  \ Java。但有些示例无法在 Java 5.0 之前的版本上运行。其他示例则只能在 Java 6、Java 7、Java 8 或更高版本上运行。\n\n最稳妥的做法是重新下载工具。有关下载的详细说明，请参见第\
  \ 2 章。\n\n第 2 章\n\n## 设置你的计算机\n\n本章内容\n\n![check](img/Image00002.jpg) **安装 Java**\n\
  \n![check](img/Image00002.jpg) **下载并安装 Eclipse 集成开发环境**\n\n![check](img/Image00002.jpg)\
  \ **检查你的 Eclipse 配置**\n\n![check](img/Image00002.jpg) **获取本书示例中的代码**\n\n本章的详细程度远超你通常所需。如果你和大多数读者一样，可以按照“如果你不喜欢阅读说明……”一节中的步骤操作。然后直接跳到本章末尾附近的“导入本书示例程序”一节。只需阅读本章约\
  \ 20%的内容，你就能获得 100%所需的软件。\n\n当然，总会有一些小问题。有人用的是旧电脑，有人安装了冲突的软件。Joe 用的是 PC，Jane 用的是\
  \ Mac。Joe 的 PC 运行 Windows 10，而 Janis 运行 Windows 8。Joe 误读了我的一条指令，结果他的屏幕上没有任何内容与我描述的步骤匹配。本章\
  \ 80%的内容描述了在那些罕见情况下你需要做的事情，即必须诊断问题。\n\n如果你真的遇到麻烦，总有一个替代方案。你可以发送电子邮件至[`BeginProg@allmycode.com`](http://BeginProg@allmycode.com)。你也可以在\
  \ Facebook 上找到我（[`/allmycode`](http://facebook.com/allmycode)）或在 Twitter 上关注我（[`@allmycode`](http://twitter.com/allmycode)）。我很乐意回答问题并帮助你找出问题所在。\n\
  \n所以，请放心跳过本章中你不需要阅读的任何内容。凭直觉行事不会破坏任何东西。如果真的搞砸了，总有办法修复。\n\n## 如果你不喜欢阅读说明……\n\n要开始编写\
  \ Java 程序，你需要第 1 章中描述的软件：一个 Java 编译器和一个 Java 虚拟机（简称 JVM）。你还可以使用一个好的集成开发环境（IDE）和一些示例代码来入门。\n\
  \n编写 Java 程序所需的所有软件都是免费的。这些软件分为三个下载包：一个来自本书的网站，一个来自 Oracle，另一个来自 eclipse.org。\n\n\
  以下是获取创建 Java 程序所需软件的方法：\n\n1. **访问** [`www.allmycode.com/BeginProg`](http://allmycode.com/BeginProg)\
  \ **并下载包含本书所有程序示例的文件。**\n\n2. **访问** [`www.oracle.com/technetwork/java/javase/downloads`](http://www.oracle.com/technetwork/java/javase/downloads)\
  \ **并获取最新版本的 JDK。**\n\n    在页面顶部，你可能会看到 Java 8 的链接和按钮。这没问题，但为了充分利用本书内容，我推荐使用 Java\
  \ 9。使用 Java 9，你可以运行 JShell，这是一个用于测试 Java 功能的新交互式环境。如果 Oracle 的网页突出显示 Java 8，请向下滚动找到\
  \ Java 9 的早期访问预览版。按照链接和按钮获取前沿技术。\n\n    选择与你操作系统（Windows、Macintosh 或其他）匹配的软件版本。如果你在\
  \ JRE 和 JDK 之间难以选择，请选择 JDK。\n\n    如果你运行 Windows，并且在 32 位和 64 位软件之间难以选择，请抛硬币决定并记下你的选择。（如果选错了，在尝试安装\
  \ Java 或启动 Eclipse IDE 时会出现错误消息。）\n\n    ![remember](img/Image00005.jpg) 大多数在本章说明中遇到问题的人，要么安装了\
  \ 32 位 Java 搭配 64 位 Eclipse，要么安装了 64 位 Java 搭配 32 位 Eclipse。如果你在进入第 6 步时遇到麻烦，请下载并安装其他版本的\
  \ Java 或 Eclipse。\n\n3. **找到你在第 2 步中下载的 Java 软件图标。双击该图标开始安装 Java。**\n\n    ![tip](img/Image00003.jpg)\
  \ 如果你很着急（谁不着急呢？），快速访问[`http://java.com`](http://java.com)可能会有所帮助。[`http://java.com`](http://java.com)网站提供了一个简单快捷的一键式\
  \ Java 安装程序。（只需点击大大的 Java 下载按钮，你不会错过的。）Java 下载按钮并非在所有电脑上都有效。但如果它对你有效，就像挥动虚拟魔法棒一样，这一步就完成了。你可以绕过[`java.oracle.com`](http://www.oracle.com/technetwork/java/javase/downloads)网站的复杂性，直接进入第\
  \ 4 步。\n\n4. **访问** [`http://eclipse.org/downloads`](http://eclipse.org/downloads)\
  \ **并获取 Eclipse IDE。**\n\n\n\n\n\n大多数情况下，Eclipse 的网站会自动检测你电脑的操作系统，并提供针对你系统优化的下载版本。但如果网站提供了选择，请选择\
  \ **Eclipse IDE for Java Developers**。\n\n下载结果要么是一个可执行的安装程序文件（扩展名为 `.exe`），要么是一个压缩归档文件（扩展名为\
  \ `.zip` 或 `.tar.gz`）。\n\n5.  **如果你在第 4 步下载了** `.exe` **文件，请双击该文件图标开始安装 Eclipse。**\n\
  \n    **如果你在第 4 步下载了** `.zip` **文件或** `.tar.gz` **文件，请解压该压缩归档文件的内容。**\n\n    如果你有一个压缩归档文件，解压后会看到一个名为\
  \ `eclipse` 或 `Eclipse.app` 的文件夹。将此文件夹复制到电脑硬盘上一个方便的位置。例如，在我的 Windows 电脑上，我最终得到了一个\
  \ `C:\\eclipse` 文件夹。在我的 Mac 上，我最终在 `Applications` 文件夹中得到了一个 `Eclipse` 或 `Eclipse.app`\
  \ 图标。\n\n    ![technicalstuff](img/Image00007.jpg) 在 Windows 中，`Program Files` 名称中的空格会混淆某些\
  \ Java 软件。我认为本书中的任何软件都不会出现此类问题，但我无法保证。如果你愿意，可以将 Eclipse 解压到 `C:\\Program Files`\
  \ 或 `C:\\Program Files (x86)` 文件夹中。但请记住你的选择（以防之后遇到任何麻烦）。\n\n6.  **启动 Eclipse，然后点击欢迎屏幕上的\
  \ Workbench 图标。**\n\n    最初，欢迎屏幕上的图标可能没有文本标签。但当你将鼠标悬停在图标上时，会出现工具提示。选择工具提示标题为 Workbench\
  \ 的图标。\n\n7.  **在 Eclipse 中，导入你在第 1 步下载的代码。**\n\n有关这些内容的详细信息，请参阅接下来的几个小节。\n\n##\
  \ 获取本书的示例程序\n\n要获取本书示例程序的副本，请访问 [`http://allmycode.com/BeginProg`](https://users.drew.edu/bburd/BeginProg/)\
  \ 并点击链接下载本书中的程序。将下载文件（`BeginProgJavaDummies5.zip`）保存到电脑硬盘上。\n\n![tip](img/Image00003.jpg)\
  \ 在某些情况下，你点击下载链接，但浏览器没有提供保存文件的选项。如果遇到这种情况，请右键点击链接（在 Mac 上按住 Control 键点击）。在出现的上下文菜单中，选择“目标另存为”、“链接另存为”、“下载链接文件为”或类似标签的菜单项。\n\
  \n大多数网络浏览器会将文件保存到电脑硬盘上的 `Downloads` 目录中。但你的浏览器配置可能略有不同。无论如何，请记下包含下载的 `BeginProgJavaDummies5.zip`\
  \ 文件的文件夹。\n\n## 设置 Java\n\n你可以通过访问 [`www.oracle.com/technetwork/java/javase/downloads`](http://www.oracle.com/technetwork/java/javase/downloads)\
  \ 获取最新、最强大的 Java 版本。寻找最新可用的 JDK 版本。选择适用于你电脑操作系统的版本。\n\n图 2-1 显示我在 Oracle 网站上点击 Download\
  \ JDK 按钮（大约 2014 年 3 月）。当你访问该网站时，电脑屏幕上的页面可能看起来很像图 2-1，但你可能会看到 Java SE 9 而不是 Java\
  \ SE 8。\n\n*   **如果你看到 Java 9，那就用它。**\n\n*   **如果你看到的是 Java 8 而不是 Java 9，请向下滚动以找到\
  \ Java 9 的早期访问预览版。**\n\n    使用普通的旧版 Java 8，你可以运行本书中的所有程序。但如果你有 Java 9，你可以使用 JShell——一个可以快速轻松地试验\
  \ Java 代码片段的工具。\n\n![image](img/Image00016.jpg)\n\n图 2-1: 获取 Java JDK。\n\n![remember](img/Image00005.jpg)\
  \ 我在本章中描述的 Oracle 和 Eclipse 网站总是在变化。你从这些网站下载的软件也会变化。像“点击右上角的按钮”这样的具体说明很快就会过时（甚至产生误导）。因此，在本章中，我提供了长长的步骤列表，但也描述了这些步骤背后的思路。浏览每个建议的网站，寻找获取我所描述的软件的方法。当网站提供多个选项时，请查看本章中的说明以获取选择最佳选项的提示。如果你的电脑上的\
  \ Eclipse 窗口与本章图示中的窗口不完全相同，请扫描你的电脑窗口以寻找我所描述的任何选项。如果经过所有这些努力后，你仍然找不到所需内容，请查看本书的网站（[`www.allmycode.com/BeginProg`](http://allmycode.com/BeginProg)）或发送电子邮件至\
  \ `BeginProg@allmycode.com`。\n\n如果你无法确定最合适的 Java 版本，或者想知道缩写 *JRE* 和 *JDK* 的含义，请参阅后面的边栏“Eenie,\
  \ meenie, miney mo”（#text00005.html_c02-fea-0003）。\n\n### 下载并安装 Java\n\n在你接受许可协议并点击\
  \ Java 安装文件的链接后，你的电脑会执行以下两种操作之一：\n\n*   下载并在你的系统上安装 Java\n\n*   下载 Java 安装文件并将其保存到电脑硬盘上\n\
  \n如果安装自动开始，请按照说明操作，对所有提示回答“是”，并（除非你有充分的理由不这样做）接受默认设置。如果安装没有自动开始，请双击下载的安装文件来启动安装。\n\
  \n![technicalstuff](img/Image00007.jpg) 如果你的电脑运行 Linux，下载的文件可能是 `.tar.gz` 文件。`.tar.gz`\
  \ 文件是一个压缩归档文件。将归档文件的内容解压到你选择的文件夹中，并按照 Oracle 网站上发布的安装说明进行操作。\n\n有关文件名、文件类型和归档文件的更多信息，请参阅本章前面的边栏“那些烦人的文件扩展名”（#text00005.html_c02-sec-0003）和“压缩归档文件”（#text00005.html_c02-sec-0005）。\n\
  \n![ontheweb](img/Image00008.jpg) 在访问 [`www.oracle.com/technetwork/java/javase/downloads`](http://www.oracle.com/technetwork/java/javase/downloads)\
  \ 时，你还可以下载一份 Java API 文档。寻找标记为 Java SE Documentation（或类似名称）的下载项。接受许可协议，点击下载链接，然后看着文件下载到你的电脑硬盘上。下载的文件是一个压缩的\
  \ `.zip` 归档文件，因此你可以像解压其他所有此类归档文件一样解压它。（解压后的文件夹是一堆网页。要开始阅读 Java API 文档，请在该文件夹中查找\
  \ `index` 文件或 `index.html` 文件。双击该文件，你就可以开始了。）\n\n![tip](img/Image00003.jpg) 有关 Java\
  \ API 文档的介绍，请参阅第 1 章。\n\n大多数人在访问 Oracle 网站 [`java.oracle.com`](http://www.oracle.com/technetwork/java/javase/downloads)\
  \ 并通过网站菜单安装 Java 时不会遇到困难。但如果你的情况比大多数人更“有趣”，你可能需要做出一些决定并执行一些额外的步骤。接下来的几个小节描述了一些这样的“有趣”场景。\n\
  \n### 如果你想在电脑上找到 Java……\n\n第 1 章 描述了 Java 生态系统，包括其编译器、虚拟机和其他部分。你的电脑可能已经拥有其中一些 Java\
  \ 工具。如果是这样，你可以选择使用已有的版本，或者将最新版本的 Java 添加到系统中已有的版本之上。如果你需要帮助来决定怎么做，请参阅边栏“Eenie, meenie,\
  \ miney mo”（#text00005.html_c02-fea-0003）。\n\n\n\n\n\n![technicalstuff](img/Image00007.jpg)\
  \ Java 的各个版本不像室内猫那样——它们可以在同一台电脑上共存，而不会互相争斗或嘶吼。如果你的电脑上安装了多个 Java 版本，完全没问题。你甚至可以在同一台电脑上混用\
  \ 32 位和 64 位版本（只要至少有一个 Java 版本的位数与你的 Eclipse 版本匹配）。我的 Windows 10 电脑上有三个 Java 版本，从未遇到过麻烦。（偶尔，我会因为混淆不同\
  \ Java 版本而自找麻烦。但本章后面的“在 Eclipse 中配置 Java”一节能帮我理清头绪。要是没有这本书在身边，我该怎么办呢？）\n\n要查看你已安装的\
  \ Java 版本，并可能避免重新安装 Java，请继续阅读。\n\n## 在 Windows 10 上\n\n在任务栏的搜索框中，输入 **程序和功能**。在出现的选项列表中，选择“程序和功能”。此时会显示已安装的程序列表。在该列表中，查找标记为\
  \ *Java* 的项目。（参见图 2-2。）\n\n![image](img/Image00018.jpg)\n\n图 2-2： Windows 上的“程序和功能”对话框。\n\
  \n## 在 Windows 8 上\n\n在“开始”屏幕上，按住 Windows 键的同时按 Q。在出现的搜索框中，输入 **程序和功能**，然后按 Enter。此时会显示已安装的程序列表。在该列表中，查找标记为\
  \ *Java* 的项目。（参见图 2-2。）\n\n## 在 Windows 7 上\n\n选择“开始”⇒“控制面板”⇒“程序”⇒“程序和功能”。此时会显示已安装的程序列表。在该列表中，查找标记为\
  \ *Java* 的项目。（参见图 2-2。）\n\n## 在 Mac 上\n\nMacintosh 电脑可以支持两种不同的 Java 风格：一种由 Apple\
  \ 公司内部开发，另一种由 Oracle 主导开发。某些命令和步骤适用于其中一种 Java 风格，但不适用于另一种。例如，要查找 Apple 的 Java 版本，可以查看\
  \ `/System/Library/Java/Java Virtual Machines` 目录或 `/System/Library/Frameworks/JavaVM.framework/Versions`\
  \ 目录。但要查找 Oracle 的 Java，则需查看 `/Library/Java/JavaVirtualMachines` 目录。你还可以在 `/Library/Internet\
  \ Plug-Ins/JavaAppletPlugin.plugin/Contents/Home` 目录中找到 Oracle 的 Java。\n\nTiger、Leopard\
  \ 和 Snow Leopard（OS X 10.4、OS X 10.5 和 OS X 10.6）预装了 Java。较新的 Mac 操作系统则没有预装 Java。在这些较新的系统上，当你首次启动需要\
  \ Java 的应用程序时，电脑会提示你安装 Apple 的 Java 或 Oracle 的 Java。（例如，在本章后面，你将安装 Eclipse。当你首次尝试启动\
  \ Eclipse 时，如果尚未安装 Java，电脑会建议你进行安装。）\n\n表 2-1 描述了 Mac OS 与 Java 版本之间的对应关系。\n\n|\
  \ 如果你拥有此 Mac OS X 版本… | 那么你拥有此 Java 版本… | 并且你可以安装此 Java 版本 |\n| --- | --- | ---\
  \ |\n| OS X 10.4.11 (Tiger)OS X 10.5.8 (Leopard) PowerPC 和/或 32 位 | Apple 的 Java\
  \ 5.0 | Apple 的 Java 5.0 |\n| OS X 10.5.8 (Leopard) 基于 Intel 且 64 位 OS X 10.6.8\
  \ (Snow Leopard) | Apple 的 Java 6 | Apple 的 Java 6 |\n| OS X 10.7.5 (Lion)OS X 10.8.5\
  \ (Mountain Lion)OS X 10.9 (Mavericks)OS X 10.10 (Yosemite)OS X 10.11 (El Capitan)macOS\
  \ 10.12 (Sierra) | （无 Java） | Apple 的 Java 6Oracle 的 Java 9 |\n\n表 2-1 Mac OS X\
  \ 版本与 Java 版本\n\n要查看你正在运行的 OS X 版本，请执行以下操作：\n\n1. **选择 Apple 菜单 ⇒ 关于本机。**\n2. **在出现的“关于本机”对话框中，查找“版本”一词。**\n\
  \   你会看到类似“版本 10.12.4”的浅灰色文字。\n\n![tip](img/Image00003.jpg) 表 2-1 中的信息适用于已更新的 Mac\
  \ OS X 版本。如果你不经常应用软件更新，那么你运行的可能是 OS X 10.8.1 而非 10.8.5。如果是这样，请在 Apple 菜单中选择“软件更新”，然后按照提示操作。\n\
  \n![tip](img/Image00003.jpg) 我在网络上偶尔会看到一些帖子，描述如何在 OS X 10.3 上安装 Java 5.0，以及其他绕过表\
  \ 2-1 限制的方法。但如果你不喜欢折腾，这些变通方法并不适合你。（对于每个硬件或软件需求，总会有人试图创建变通方法，即 *hack*。无论如何，自行承担使用\
  \ hack 的风险。）\n\n如果你不信任表 2-1（坦白说，你不应该相信你在印刷品中找到的一切），你可以在电脑上执行测试，以发现 Java 的存在以及（如果你的\
  \ Mac 有 Java）Java 版本号。以下是一些测试方法：\n\n### 对于 OS X 10.6 或更早版本\n\n1. **在 Spotlight 的搜索字段中，输入**\
  \ Java Preferences**。**\n2. **当 Spotlight 的顶部命中项是 Java Preferences 时，按 Enter。**\n\
  \   Java Preferences 窗口出现。（参见图 2-3。）\n3. **Java Preferences 窗口列出了你电脑上安装的 Java 版本。**\n\
  \   在图 2-3 中，该电脑有四个 Java 版本：Java 6 和 Java 7 的 32 位（i386）版本，以及 Java 6 和 Java 7 的\
  \ 64 位（x86_64）版本。\n\n![image](img/Image00019.jpg)\n\n图 2-3： Java Preferences 应用程序。\n\
  \n### 对于 OS X 10.7 或更高版本\n\n1. **在 Apple 菜单中，选择“系统偏好设置”。**\n2. **在“系统偏好设置”应用程序窗口中，单击\
  \ Java 图标。**\n   Java 控制面板出现。它看起来像图 2-4 或图 2-5 中的面板**。**\n3. **如果你的 Java 控制面板看起来像**\
  \ **图 2-4** **中的面板，你可以在面板的“常规”选项卡上看到你电脑的 Java 版本。**\n   根据图 2-4 所示的面板，我的电脑有一个 Java\
  \ 9 的早期访问（ea）版本。你可以跳过其余步骤。\n4. **如果你的 Java 控制面板看起来像** **图 2-5** **中的面板，请选择面板的“Java”选项卡。（参见**\
  \ **图 2-6****。）**\n5. **在“Java”选项卡上，单击“查看”。**\n   Java 运行时环境设置窗口出现。（参见图 2-7。）\n\
  6. **在 Java 运行时环境设置窗口的“用户”选项卡和“系统”选项卡上查找 Java 版本。**\n   图 2-7 显示了 Java 运行时环境设置窗口的“用户”选项卡。根据该图，电脑运行的是\
  \ Java 1.8。（Java 的亲密朋友称此版本为“Java 8”。）\n\n![image](img/Image00020.jpg)\n\n图 2-4：\
  \ 你的 Java 控制面板可能看起来像这样。\n\n![image](img/Image00021.jpg)\n\n图 2-5： Java 控制面板的另一种形式。\n\
  \n![image](img/Image00022.jpg)\n\n图 2-6： Java 控制面板中的“Java”选项卡。\n\n![image](img/Image00023.jpg)\n\
  \n图 2-7： Java 运行时环境设置窗口中的“用户”选项卡。\n\n## 在 Linux 上\n\n要检查 Linux 电脑上的 Java 安装情况（或是否缺少\
  \ Java），请执行以下操作：\n\n1. **在桌面的菜单中查找名为“终端”（也称为 Konsole）的选项。**\n   终端窗口打开（通常为黑色背景上的白色文本）。\n\
  2. **在终端窗口中，输入以下文本并按 Enter：** `java -version`**。**\n   在我的一台 Linux 电脑上，终端窗口响应如下文本：\n\
  \   `java version 1.8.0_111`\n\n\n\n\n\n在另一台 Linux 电脑上，我看到这样的信息：\n\n`java version\
  \ 9`\n\n在 Java 8 和 Java 9 之间，Oracle 改变了它的版本编号系统。因此，版本 9 紧跟在 1.8.0 版本之后。无论如何，如果你的电脑返回的数字是\
  \ 9 或更高，你就可以开香槟庆祝，并期待顺利运行本书中的示例。如果版本号是 1.5 或更高，你可以运行本书中的许多示例，但并非全部。如果你的电脑返回类似 `command\
  \ not found` 的信息，那么很可能你的电脑上没有安装 Java。\n\n## 设置 Eclipse 集成开发环境\n\n在前面的章节中，你获得了你的*电脑*处理\
  \ Java 程序所需的所有工具。本节则有所不同。在本节中，你将获得*你*编写和测试 Java 程序所需的工具。你将获得 Eclipse——一个用于 Java\
  \ 的集成开发环境。\n\n*集成开发环境（IDE）* 是一个提供工具的程序，帮助你轻松高效地创建软件。没有 IDE 你也可以创建 Java 程序，但使用 IDE\
  \ 节省的时间和精力使其物有所值。（一些硬核程序员不同意我的观点，但那是另一回事。）\n\n根据 Eclipse 基金会的网站，*Eclipse* 是“一个通用工具平台——一个开放的可扩展\
  \ IDE，适用于任何事物，也并非特指任何事物。”确实，Eclipse 功能多样。程序员通常认为 Eclipse 是用于开发 Java 程序的 IDE，但 Eclipse\
  \ 也包含用于 C++、PHP 和许多其他语言的编程工具。\n\n我甚至见过与程序开发无关的 Eclipse 变体。例如，Dynatrace 有一个监控大型系统性能的应用程序。当你在桌面电脑上运行\
  \ Dynatrace 的应用程序时，你实际上运行的是 Eclipse 的一个增强版本。\n\n### 下载 Eclipse\n\n以下是下载 Eclipse\
  \ 的方法：\n\n1.  **访问** [`www.eclipse.org`](http://www.eclipse.org) **。**\n\n    今天，我访问\
  \ [`www.eclipse.org`](http://www.eclipse.org) 时，看到一个显示 *Download* 的大按钮。（参见 图 2-8\
  \ 。）明天，谁知道这个不断变化的网站上会出现什么！\n\n    无论如何，你很可能看到某种下载按钮。\n\n2.  **点击下载按钮。**\n\n    点击下载按钮后，你可能会看到几个下载选项。（参见\
  \ 图 2-9 。）\n\n    每年六月都会发布一个新版本的 Eclipse，版本名称按字母顺序排列。2016 年 6 月，名称是 Neon。2017 年\
  \ 6 月，是 Oxygen。2018 年 6 月，是 Photon。明白了吗？名称以 N 开头，然后是 O，接着是 P。（在 图 2-9 中，不要让 *Orion*\
  \ 中的 *O* 迷惑你。那是另一款软件。）\n\n3.  **点击按钮下载当前 Eclipse 版本。**\n\n    2017 年 5 月，我点击了 图\
  \ 2-9 中的 DOWNLOAD 64 BIT 按钮。结果，Eclipse 的网站又向我展示了另一个按钮。这个按钮提供了来自全球众多服务器之一的 Eclipse\
  \ 副本。\n\n4.  **点击相应的按钮，并按照相应的链接开始下载。**\n\n    你点击的链接取决于 Eclipse 的众多镜像站点中哪个提供你的下载。只需浏览这些选项，然后开始下载即可。\n\
  \n![image](img/Image00024.jpg)\n\n图 2-8: eclipse.org 的主页。\n\n![image](img/Image00025.jpg)\n\
  \n图 2-9: 2017 年 5 月，我下载了 Eclipse Neon。\n\n注意 图 2-9 中的 Download Packages 链接。如果你点击该链接，可以下载添加了某些功能的\
  \ Eclipse 副本。例如，Eclipse IDE for Java EE Developers 包包含用于工业级开发的重型功能。Eclipse IDE for\
  \ JavaScript and Web Developers 包则包含帮助人们创建网页的功能。\n\n如果你进入一个提供各种包的页面，请寻找名为 Eclipse\
  \ IDE for Java Developers（而不是 Java EE Developers）的包。\n\n![tip](img/Image00003.jpg)\
  \ Eclipse 的下载页面会引导你下载与你的电脑操作系统相匹配的 Eclipse 版本。例如，如果你在 Windows 电脑上访问该页面，页面只会显示适用于\
  \ Windows 的下载。如果你要为另一台电脑下载 Eclipse，你可能希望覆盖自动选择的操作系统。寻找一个包含你电脑操作系统名称的小下拉列表。你可以更改该下拉列表中选中的操作系统。\n\
  \n![warning](img/Image00004.jpg) 如果你知道你的 Java 版本（32 位或 64 位），请务必下载对应的 Eclipse 版本。如果你不知道你的\
  \ Java 版本，请下载 64 位版本的 Eclipse 并尝试启动它。如果你能启动 64 位 Eclipse，那就没问题。但如果你收到 `No Java virtual\
  \ machine was found` 错误消息，请尝试下载并启动 32 位版本的 Eclipse。关于 32 位和 64 位字长的完整说明，请参见本章前面的边栏“你的电脑有多少位？”\n\
  \n### 安装 Eclipse\n\n安装 Eclipse 的具体方式取决于你的操作系统以及你下载 Eclipse 时获得的文件类型。以下是简要总结：\n\n\
  *   **如果你运行 Windows 且下载的是** `.exe` **文件：**\n\n    双击 `.exe` 文件的图标。\n\n*   **如果你运行\
  \ Windows 且下载的是** `.zip` **文件：**\n\n    将文件内容解压到你选择的目录中。\n\n    换句话说，在文件资源管理器（也称为\
  \ *Windows 资源管理器*）中找到 `.zip` 文件的图标。然后双击 `.zip` 文件的图标。（结果，资源管理器会显示 `.zip` 文件的内容，其中只包含一个文件夹——名为\
  \ `eclipse` 的文件夹。）将 `eclipse` 文件夹拖到你电脑硬盘上的方便位置。\n\n    有关 `.zip` 文件的更多信息，请参见本章前面的边栏“压缩归档文件”。\n\
  \n    我最喜欢将 `eclipse` 文件夹直接拖到 `C:` 盘。因此，我的 `C:` 盘上有名为 `Program Files`、`Windows`、`eclipse`\
  \ 等文件夹。我避免将 `eclipse` 文件夹设为 `Program Files` 的子文件夹，因为有时我在处理 `Program Files` 名称中的空格时会遇到问题。\n\
  \n*   **如果你运行 Mac OS X：**\n\n    下载 Eclipse 时，你会获得一个 `.tar.gz` 文件或一个 `.dmg` 文件。\n\
  \n    *   `.tar.gz` 文件是一个压缩归档文件。当你下载该文件时，你的网页浏览器可能会自动为你解压部分内容。如果是这样，你的 `Downloads`\
  \ 文件夹中不会出现 `.tar.gz` 文件。相反，你会找到一个 `.tar` 文件（因为你的网页浏览器解压了 `.gz` 部分）或一个 `eclipse`\
  \ 文件夹（因为你的网页浏览器同时解压了 `.tar` 和 `.gz` 部分）。\n\n        如果你在 `Downloads` 文件夹中找到了一个新的\
  \ `.tar` 文件或 `.tar.gz` 文件，请双击该文件，直到看到 `eclipse` 文件夹。将这个新的 `eclipse` 文件夹拖到你的 `Applications`\
  \ 文件夹中，就大功告成了。\n\n    *   如果你下载了一个 `.dmg` 文件，你的网页浏览器可能会自动为你打开该文件。如果没有，请在 `Downloads`\
  \ 文件夹中找到该 `.dmg` 文件并双击它。按照双击后出现的任何说明操作。如果需要你将 Eclipse 拖入 `Applications` 文件夹，请照做。\n\
  \n*   **如果你运行 Linux：**\n\n    你可能会获得一个 `.tar.gz` 文件，但也有可能获得一个自解压的 `.bin` 文件。将 `.tar.gz`\
  \ 文件解压到你喜欢的目录，或者执行自解压的 `.bin` 文件。\n\n### 首次运行 Eclipse\n\n\n\n\n首次启动 Eclipse 时，您需要执行一些额外的步骤。要运行\
  \ Eclipse，请按以下步骤操作：\n\n1. **启动 Eclipse。**\n\n   在 Windows 中，“开始”菜单可能没有 Eclipse 图标。此时，请在文件资源管理器（即\
  \ Windows 资源管理器）中找到存放 Eclipse 解压文件的文件夹。双击代表 `eclipse.exe` 文件的图标。（如果看到的是 `eclipse`\
  \ 文件而非 `eclipse.exe` 文件，请查看本章前面的边栏“那些烦人的文件扩展名”。）\n\n   在 Mac 上，打开 Spotlight，在搜索框中输入\
  \ **Eclipse**。当 *Eclipse* 出现在 Spotlight 列表的顶部时，按 Enter 键。\n\n   ![提示](img/Image00003.jpg)\
  \ 首次在 Mac 上尝试运行 Eclipse 时，可能会收到一条消息，提示 Eclipse 并非来自 App Store，也非来自已识别的开发者。这世上没有百分之百的安全，但我下载并安装\
  \ Eclipse 无数次，从未遇到过问题。因此，要绕过这个障碍，请在 `Applications` 文件夹（或您安装 Eclipse 的其他位置）中找到 Eclipse\
  \ 应用条目。按住 Control 键点击该应用条目，在弹出的上下文菜单中选择“打开”。此时会弹出一个对话框，询问您是否确定要打开该应用。您确定，所以点击“打开”。\n\
  \n   启动 Eclipse 后，您会看到“工作空间启动器”对话框。（参见图 2-10）。该对话框询问您希望在计算机硬盘的哪个位置存储使用 Eclipse 创建的代码。\n\
  \n2. **在“工作空间启动器”对话框中，点击“确定”接受默认设置（或者不接受默认设置！）。**\n\n   无论如何，这都不是什么大事！\n\n   由于这是您首次使用某个特定的\
  \ Eclipse 工作空间，Eclipse 会以欢迎屏幕启动。（参见图 2-11）。\n\n3. **在欢迎屏幕上，寻找标有“工作台”的按钮或图标。**\n\n\
  \   在图 2-11 中，该按钮位于右上角。\n\n   ![提示](img/Image00003.jpg) 多年来，许多 Eclipse 欢迎屏幕都只显示图标，而很少或没有帮助文字。如果在欢迎屏幕上任何地方都看不到“工作台”字样，请将鼠标悬停在每个图标上，直到找到工具提示中包含“工作台”字样的图标。\n\
  \n4. **点击“工作台”图标，打开 Eclipse 的主屏幕。**\n\n   使用全新工作空间打开 Eclipse 后的主屏幕视图如图 2-12 所示。\n\
  \n![图片](img/Image00026.jpg)\n\n图 2-10： Eclipse 的工作空间启动器。\n\n![图片](img/Image00027.jpg)\n\
  \n图 2-11： Eclipse 的欢迎屏幕。\n\n![图片](img/Image00028.jpg)\n\n图 2-12： 使用全新工作空间的 Eclipse\
  \ 工作台。\n\n#### 如果需要在 Eclipse 中配置 Java……\n\nEclipse 通常会在您的计算机上查找 Java 安装，并选择一个已安装的\
  \ Java 版本来运行您的 Java 程序。您的计算机可能安装了多个 Java 版本，因此您可能需要仔细检查 Eclipse 选择的 Java 版本。以下步骤将向您展示如何操作：\n\
  \n1. **在 Windows 或 Linux 上：在 Eclipse 的主菜单中，选择 Window ⇒   Preferences。在 Mac 上：在 Eclipse\
  \ 的主菜单中，选择 Eclipse ⇒   Preferences。**\n\n   随后，Eclipse 的“首选项”对话框将出现。（您可以参照图 2-13\
  \ 进行操作。）\n\n2. **在“首选项”对话框左侧的树中，展开 `Java` 分支。**\n\n3. **在 `Java` 分支中，选择 `Installed\
  \ JREs` 子分支。**\n\n4. **查看“首选项”对话框主体中的 Java 版本列表（已安装的 JRE）。**\n\n   列表中，每个 Java 版本都有一个复选框。Eclipse\
  \ 使用已勾选的版本。如果勾选的版本不是您偏好的版本（例如，勾选的版本不是 9 或更高版本），您可以进行一些更改。\n\n5. **如果您偏好的 Java 版本出现在“已安装的\
  \ JRE”列表中，请勾选该版本的复选框。**\n\n6. **如果您偏好的 Java 版本未出现在“已安装的 JRE”列表中，请点击“添加”按钮。**\n\n\
  \   点击“添加”按钮后，将出现“JRE 类型”对话框。（参见图 2-14）。\n\n7. **在“JRE 类型”对话框中，双击“标准 VM”。**\n\n\
  \   随后，将出现“JRE 定义”对话框。（参见图 2-15）。接下来要执行的操作取决于几个不同因素。\n\n8. **填写对话框中的“JRE 主目录”字段。**\n\
  \n   具体操作方式取决于您的操作系统。\n\n   * 在 Windows 上，浏览到您安装偏好的 Java 版本的目录。在我的多台 Windows 电脑上，该目录通常是\
  \ `C:\\Program Files\\Java\\jre-9`、`C:\\Program Files\\Java\\jdk1.8.0`、`C:\\Program\
  \ Files (x86)\\Java\\jre-9` 或类似路径。\n\n   * 在 Mac 上，使用 Finder 浏览到您安装偏好的 Java 版本的目录。在对话框的“JRE\
  \ 主目录”字段中输入该目录的名称。\n\n     我的 Mac 上有一个 Java 目录是 `/System/Library/Java/Java Virtual\
  \ Machines/1.6.0.jdk/Contents/Home`，另一个是 `/Library/Java/JavaVirtualMachines/jdk-9.jdk/Contents/Home`。（第一个用于\
  \ Apple 的旧版 Java；第二个用于 Oracle 的新版 Java。）您还可能在 `/System/Library/Frameworks/JavaVM.framework/Versions`\
  \ 目录中找到 Apple 的旧版 Java，在 `/Library/Internet Plug-Ins/JavaAppletPlugin.plugin/Contents/Home`\
  \ 目录中找到 Oracle 的 Java。\n\n     ![提示](img/Image00003.jpg) 像 `/System` 和 `/Library`\
  \ 这样的目录通常不会出现在 Finder 窗口中。要浏览到这些目录之一（例如 `/Library` 目录），请在 Finder 的菜单栏中选择 Go ⇒   Go\
  \ to Folder。在出现的对话框中，输入 `/Library`，然后点击“前往”。\n\n     ![提示](img/Image00003.jpg) 在导航到包含您偏好的\
  \ Java 版本的目录时，您可能会遇到 `JDK 1.8.0.jdk` 图标或其他扩展名为 `.jdk` 的项目。要查看该项目的内容，请按住 Control\
  \ 键点击该图标，然后从出现的菜单中选择“显示包内容”。\n\n   * 在 Linux 上，浏览到您安装偏好的 Java 版本的目录。如果不确定，请搜索名称以\
  \ `jre` 或 `jdk` 开头的目录。\n\n   您可能还需要在“JRE 定义”对话框中执行一项操作。\n\n9. **查看“JRE 定义”对话框中的“JRE\
  \ 名称”字段；如果 Eclipse 没有自动填写名称，请在“JRE 名称”字段中输入一个名称（几乎任何文本都可以）。**\n\n10. **点击“完成”关闭“JRE\
  \ 定义”对话框。**\n\n    Eclipse 的“首选项”对话框将回到前台。对话框的“已安装的 JRE”列表中包含了您新添加的 Java 版本。\n\n\
  11. **勾选新添加的 Java 版本旁边的复选框。**\n\n    您差不多完成了。（还有几个步骤需要执行。）\n\n12. **在“首选项”对话框左侧的\
