  }\n```\n\n对我来说，这种重复看起来很愚蠢。难道计算机不应该让我们免于诸如重复打字之类的单调负担吗？如果我第一次正确键入了这些语句，但第二次却出了错怎么办？也许我会把错误的版本复制第三次和第四次，最终得到一团糟的代码！\n\
  \n重复的代码容易出错。它既不方便又没有必要。与其重复代码，你应该能够总结你的代码，然后反复引用那个总结过的代码。借助 Java 的方法，你正好拥有这种能力。在本书的许多示例中，你已经使用了别人的方法，而在第\
  \ 19 章中，你将创建自己的方法。\n\n![tryitout](img/Image00006.jpg) 这是你编写一些非常优雅的代码的机会。\n\n####\
