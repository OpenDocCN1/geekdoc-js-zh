  US half dollar\");\ncase 100:\nSystem.out.println(\"US dollar\");\ndefault:\nSystem.out.println(\"\
  Not a US coin\");\n}\n```\n\n#### 一周中的每一天\n\n编写一个程序，读取一个数字（从 1 到 7），并显示该数字对应的星期几。例如，在美国，星期日被视为一周的第一天。因此，如果用户输入`1`，程序显示`Sunday`。如果用户输入`2`，程序显示`Monday`。以此类推。\n\
  \n#### 吃饭时间\n\n编写一个程序，询问用户当前是几点，并使用`switch`语句告知用户用餐时间。如果时间在上午 6 点到上午 9 点之间，告诉用户“Breakfast\
