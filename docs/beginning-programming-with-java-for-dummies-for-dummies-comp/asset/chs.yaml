  \ **排除故障**\n\n就在昨天，我和我的仆人 RoboJeeves 聊天。（RoboJeeves 是 RJ-3000 系列个人机器人生命体中的高端型号。）对话如下：\n\
  \n*   *我：* RoboJeeves，告诉我一个物体在真空中下落三秒后的速度。\n*   *RoboJeeves：* 好的，我会的。“一个物体在真空中下落三秒后的速度。”好了，我告诉你了。\n\
  *   *我：* RoboJeeves，别给我那种自作聪明的回答。我要一个数字。我要实际速度。\n*   *RoboJeeves：* 好的！“一个数字；实际速度。”\n\
  *   *我：* RJ，这些低级的笑话有失你的身份。你到底能不能回答我的问题？\n*   *RoboJeeves：* 能。\n*   *我：* “能”什么？\n\
  *   *RoboJeeves：* 是的，我既能也不能回答你的问题。\n*   *我：* 那到底是哪个？你能吗？\n*   *RoboJeeves：* 是的，我能。\n\
  *   *我：* 那就做吧。告诉我答案。\n*   *RoboJeeves：* 速度是每小时 153,984,792 英里。\n*   *我：*（停顿思考后……）RJ，我知道你从不犯错，但那个数字\
  \ 153,984,792 太高了。\n*   *RoboJeeves：* 太高了？不可能。在巨大的曼戈尔克松戈星球上，物体下落得非常快。现在，如果你想知道地球上物体下落的情况，你应该一开始就说明。\n\
  \n有时候那个机器人让我很不爽。事实是，RoboJeeves 只做我吩咐他做的事——不多也不少。如果我说“喂猫”，那么 RJ 就会说：“喂给谁？你的哪位客人要吃猫肉晚餐？”\n\
  \n## 计算机很愚蠢\n\n\n\n\n尽管计算机非常方便，但它们做的都是同一件该死的事。它们会*完全*按照你的指令行事，而这有时非常不幸。例如，1962 年，一艘前往金星的水手号探测器在发射后仅四分钟就毁掉了。为什么？因为一个\
  \ FORTRAN 程序中缺少了一个按键。大约在同一时间，NASA 科学家发现了一个可能毁掉水星载人航天任务的错误。（没错！这些任务可是载人的！）这个错误是一行代码中用了句点而不是逗号。（程序员写了`DO\
  \ 10 I=1.10`而不是`DO 10 I=1,10`。）\n\n恕我直言，我的伙伴 RoboJeeves 和他的计算机表亲们都极其愚蠢。有时它们看起来像是在揣测我们人类的想法，但实际上它们只是在执行其他人告诉它们要做的事。它们可以抛虚拟硬币，用复杂的方案模仿创造性行为，但从未真正独立思考。如果你说“跳”，它们就会按照编程设定对字母\
  \ J-u-m-p 做出反应。\n\n因此，当你编写计算机程序时，你必须想象一个精灵给了你三个愿望。不要要求永恒的爱，因为如果你这样做了，精灵会给你一个流着口水、令人崇拜的伴侣——一个你根本不喜欢的家伙。也不要要求一百万美元，除非你想让精灵把你变成银行劫匪。\n\
  \n你在计算机程序中写的每一件事都必须*精确*。来看一个例子……\n\n## 一个回显键盘输入的程序\n\n清单 5-1 包含一个小型 Java 程序。该程序允许你在键盘上输入一行字符。一旦你按下回车键，程序就会显示第二行，复制你输入的内容。\n\
  \n清单 5-1 一个 Java 程序\n\n```\nimport java.util.Scanner;\n\nclass EchoLine {\n\npublic\
  \ static void main(String args[]) {\n\nScanner keyboard = new Scanner(System.in);\n\
  \nSystem.out.println(keyboard.nextLine());\n\nkeyboard.close();\n\n}\n\n}\n```\n\
