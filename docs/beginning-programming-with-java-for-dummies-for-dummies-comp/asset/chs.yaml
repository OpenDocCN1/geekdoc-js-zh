  \ **理解静态和非静态方法与字段**\n\n![check](img/Image00002.jpg) **让数字看起来更美观**\n\n我希望你没有读过第 17\
  \ 章，因为我在那一章开头撒了一个大谎。实际上，那不是谎言，而是夸张。\n\n实际上，也不是夸张，而是措辞上的精心选择。在第 17 章中，我写道将数据收集到类中是面向对象编程的开始。嗯，这没错。只不过在许多编程语言在面向对象编程流行之前就已经有了数据收集功能。Pascal\
  \ 有*记录*。C 有*结构体*。\n\n说得更准确一点，将数据分组到可用的块中只是面向对象编程的前提条件。只有当你将数据和方法都结合到你的类中时，你才真正在进行面向对象编程。\n\
  \n本章开启了数据和方法结合的进程，而第 19 章将完善这一图景。\n\n### String 类\n\n`String`类在 Java API 中声明。这意味着在你从\
  \ Oracle 网站（[`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)）下载的内容中，有一个名为`String.java`的文件。如果你找到这个`String.java`文件并查看其代码，你会发现一些非常熟悉的内容：\n\
  \n```\nclass String {\n    … 等等。\n```\n\n在你自己的代码中，你可以使用这个`String`类，而无需查看`String.java`文件内部的内容。这是面向对象编程的伟大之处之一。\n\
  \n### 一个简单的例子\n\n`String`是一串字符。它就像连续排列的几个`char`值。你可以声明一个`String`类型的变量，并在其中存储多个字母。清单\
  \ 18-1 有一个小例子。\n\n清单 18-1 我又在重复自己（再次）\n\n```\nimport java.util.Scanner;\n\nclass\
  \ JazzyEchoLine {\n    public static void main(String args[]) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        String lineIn;\n        lineIn = keyboard.nextLine();\n\
  \    }\n}\n```\n\n\n\n\n\n`System.out.println(lineIn);`\n`keyboard.close();`\n`}`\n\
  `}`\n\n清单 18-1 的一次运行结果如图 18-1 所示。这次运行与清单 5-1（见第 5 章）中的运行结果惊人地相似。这是因为清单 18-1 是对清单\
  \ 5-1 中工作的重演。\n\n![image](img/Image00216.gif)\n\n图 18-1：运行清单 18-1 中的代码。\n\n清单 18-1\
  \ 中的新思路是使用了`String`。在清单 5-1 中，我没有变量来存储用户的输入。但在清单 18-1 中，我创建了`lineIn`变量。这个变量存储了一串字母，比如字母`Do\
  \ as I write, not as I do`。\n\n### 善用 String 变量\n\n清单 18-1 中的程序接收用户的输入并将其回显到屏幕上。这是一个很棒的程序，但（就像我认识的许多大学行政人员一样）它似乎并不是特别有用。\n\
  \n来看看 Java 的`String`类型的一个更有用的应用。一个很好的例子在清单 18-2 中。\n\n清单 18-2 将名字放入 String 变量\n\n\
  ```\nimport java.util.Scanner;\nimport static java.lang.System.out;\nclass ProcessMoreData\
  \ {\n  public static void main(String args[]) {\n    Scanner keyboard = new Scanner(System.in);\n\
  \    String fullName;\n    double amount;\n    boolean taxable;\n    double total;\n\
  \    out.print(\"Customer’s full name: \");\n    fullName = keyboard.nextLine();\n\
  \    out.print(\"Amount: \");\n    amount = keyboard.nextDouble();\n    out.print(\"\
  Taxable? (true/false) \");\n    taxable = keyboard.nextBoolean();\n    if (taxable)\
  \ {\n      total = amount * 1.05;\n    } else {\n      total = amount;\n    }\n\
  \    out.println();\n    out.print(\"The total for \");\n    out.print(fullName);\n\
  \    out.print(\" is \");\n    out.print(total);\n    out.println(\".\");\n    keyboard.close();\n\
  \  }\n}\n```\n\n清单 18-2 中代码的一次运行结果如图 18-2 所示。代码将`Barry A. Burd`存储在一个名为`fullName`的变量中，并将`fullName`变量的内容作为输出的一部分显示出来。要使这个程序工作，你必须将`Barry\
  \ A. Burd`存储在某个地方。毕竟，程序遵循以下大纲：\n\n***`获取一个名字。`**\n\n*`获取其他一些信息。`*\n\n*`计算总额。`*\n\
  \n***`显示名字`** `（以及其他一些信息）。`*\n\n![image](img/Image00217.jpg)\n\n图 18-2：进行购买。\n\n\
  如果程序没有将名字存储在某个地方，那么在获取其他信息和计算总额之后，它就会忘记这个名字（因此程序无法显示名字）。\n\n### 读取和写入字符串\n\n要从键盘读取一个`String`值，你可以调用`next`或`nextLine`：\n\
  \n*   **方法** `next` **读取到下一个空白字符为止。**\n\n    例如，对于输入`Barry A. Burd`，语句\n\n    `String\
  \ firstName = keyboard.next();`\n    `String middleInit = keyboard.next();`\n  \
  \  `String lastName = keyboard.next();`\n\n    会将`Barry`赋值给`firstName`，`A.`赋值给`middleInit`，`Burd`赋值给`lastName`。\n\
  \n*   **方法** `nextLine` **读取到当前行末尾为止。**\n\n    例如，对于输入`Barry A. Burd`，语句\n\n   \
  \ `String fullName = keyboard.nextLine();`\n\n    会将`Barry A. Burd`赋值给变量`fullName`。（嘿，当作者还是有些隐藏好处的。）\n\
  \n要显示一个`String`值，你可以调用你的老朋友`System.out.print`或`System.out.println`。事实上，本书中的大多数程序都显示`String`值。在清单\
  \ 18-2 中，像\n\n`out.print(\"Customer’s full name: \");`\n\n这样的语句会显示`String`值`\"Customer’s\
  \ full name: \"`。\n\n![提示](img/Image00003.jpg) 你可以使用`print`和`println`将`String`值写入磁盘文件。详情请见第\
  \ 13 章。\n\n第 4 章介绍了一串字符，用双引号括起来：\n\n`\"Chocolate, royalties, sleep\"`\n\n在第 4 章中，我称其为某种*字面量*。（它是字面量，因为与变量不同，它看起来就像它所代表的东西。）那么，在本章中，我可以继续讲述\
  \ Java 字面量的故事：\n\n*   在清单 18-2 中，`amount`和`total`是`double`变量，而`1.05`是一个`double`字面量。\n\
  \n*   在清单 18-2 中，`fullName`是一个`String`变量，而像`\"Customer’s full name: \"`这样的东西是`String`字面量。\n\
  \n![记住](img/Image00005.jpg) 在 Java 程序中，你需要用双引号将`String`字面量中的字母括起来。\n\n![试试看](img/Image00006.jpg)\
  \ 只要多加练习使用 Java 的`String`值，你就永远不会被难住。\n\n#### 将字符串添加到其他内容中\n\n在 Java 中，你可以在`String`值和数值之间放置加号。当你这样做时，Java\
  \ 会将所有内容变成一个大的`String`值。要了解这是如何工作的，请将清单 18-2 中的最后几行替换为以下单行：\n\n`out.println(\"The\
  \ total for \" + fullName + \" is \" + total + \".\");`\n\n#### 单词顺序的乐趣\n\n编写一个程序，从键盘输入六个单词。程序输出六个句子，每个句子中第一个单词位于不同的位置。例如，一次运行的结果可能如下所示：\n\
  \n```\nonly I have eyes for you.\nI only have eyes for you.\nI have only eyes for\
  \ you.\nI have eyes only for you.\nI have eyes for only you.\nI have eyes for you\
  \ only.\n```\n\n### 使用对象的方法\n\n如果你不太关心类和引用类型，那么在清单 18-2 中使用`String`类型并不算什么大事。几乎你能对基本类型做的所有事情，似乎也能对`String`类型做。但前方有危险。看看清单\
  \ 18-3 中的代码以及图 18-3 中显示的运行结果。\n\n![image](img/Image00218.gif)\n\n图 18-3： 但我输入了正确的密码！\n\
  \n清单 18-3 一个有缺陷的密码检查器\n\n```\n/*\n * This code does not work:\n */\nimport java.util.Scanner;\n\
  import static java.lang.System.out;\nclass TryToCheckPassword {\n  public static\
  \ void main(String args[]) {\n    Scanner keyboard = new Scanner(System.in);\n \
  \   String password = \"swordfish\";\n    String userInput;\n    out.print(\"What’s\
