  \            anAccount.balance = myRandom.nextInt(10000);\n            anAccount.display();\n\
  \        }\n    }\n}\n```\n\n以下是清单 19-3 中操作的总结：\n\n- `执行以下操作三次：`\n- `创建一个新对象（`Account`类的一个实例）。`\n\
  - `随机生成该对象的`lastName`、`id`和`balance`值。`\n- `调用该对象的`display`方法。`\n\n三次`display`调用中的第一次打印第一个对象的`lastName`、`id`和`balance`值。第二次`display`调用打印第二个对象的`lastName`、`id`和`balance`值，依此类推。\n\
  \n清单 19-3 中代码的一次运行结果如图 19-3 所示。\n\n![image](img/Image00229.jpg)\n\n图 19-3: 运行清单\
  \ 19-3 中的代码。\n\n![warning](img/Image00004.jpg) 关于清单 19-3 中的代码，你的实际结果可能会有所不同。你不会看到与图\
  \ 19-3 中相同的值。事实上，如果你多次运行清单 19-3，你（几乎可以肯定）每次都会得到不同的三个字母的名字、不同的 ID 号和不同的账户余额。这就是程序随机生成值时发生的情况。\n\
  \n### 控制流\n\n假设你正在运行清单 19-3 中的代码。计算机执行到`display`方法调用：\n\n`anAccount.display();`\n\
  \n此时，计算机开始运行`display`方法内部的代码。换句话说，计算机跳转到`Account`类代码（清单 19-1 中的代码）的中间。\n\n执行完`display`方法的代码（那一堆`print`和`println`调用）后，计算机返回到清单\
  \ 19-3 中它离开的地方。也就是说，计算机回到`display`方法调用处，并继续执行后续代码。\n\n当你运行清单 19-3 中的代码时，每次循环迭代中的动作流并不完全是从上到下。相反，动作从`for`循环转到`display`方法，然后再回到`for`循环。整个过程如图\
  \ 19-4 所示。\n\n![image](img/Image00230.jpg)\n\n图 19-4: 清单 19-1 和 19-3 之间的控制流。\n\n\
  ### 使用标点符号\n\n在清单 19-3 中，注意点的使用。要引用存储在`anAccount`对象中的`lastName`，你写\n\n`anAccount.lastName`\n\
  \n要让`anAccount`对象显示自身，你写\n\n`anAccount.display();`\n\n太好了！当你引用对象的字段或调用对象的方法时，唯一的区别是括号：\n\
  \n*   要引用对象的字段，你不使用括号。\n\n*   要调用对象的方法，你使用括号。\n\n![remember](img/Image00005.jpg)\
  \ 当你调用一个方法时，你在方法名后面加上括号。即使括号内没有任何内容，也要这样做。\n\n### 多功能的加号\n\n\n\n\n\n清单 19-3 中的程序使用了一些巧妙的小技巧。在\
  \ Java 中，你可以用加号做两件不同的事情：\n\n*   **你可以用加号进行数字相加。**\n\n    例如，你可以写\n\n    `numberOfSheep\
  \ = 2 + 5;`\n\n*   **你可以用加号*拼接*字符串。**\n\n    当你拼接字符串时，你把它们一个接一个地粘在一起。例如，表达式\n\n\
  \    `\"Barry\" + \" \" + \"Burd\"`\n\n    将 `Barry`、一个空格和 `Burd` 粘在一起。新拼接成的字符串是（你猜对了）`Barry\
  \ Burd`。\n\n在清单 19-3 中，语句\n\n```java\nanAccount.lastName = \"\" +\n(char) (myRandom.nextInt(26)\
  \ + 'A') +\n(char) (myRandom.nextInt(26) + 'a') +\n(char) (myRandom.nextInt(26)\
  \ + 'a');\n```\n\n包含许多加号，其中一些加号用于拼接内容。第一个东西是一个神秘的空字符串（`\"\"`）。这个空字符串是不可见的，所以它永远不会妨碍你看到第二、第三和第四个东西。\n\
  \n在空字符串上，程序拼接了第二个东西。第二个东西是表达式 `(char) (myRandom.nextInt(26) + 'A')` 的值。这个表达式看起来可能很复杂，但实际上没什么大不了的。这个表达式代表一个大写字母（随机生成的任意大写字母）。\n\
  \n在空字符串和大写字母上，程序拼接了第三个东西。第三个东西是表达式 `(char) (myRandom.nextInt(26) + 'a')` 的值。这个表达式代表一个小写字母（随机生成的任意小写字母）。\n\
  \n在所有这些内容上，程序又拼接了另一个小写字母。所以总的来说，你得到了一个随机生成的三字母名字。更多细节，请参见下面的边栏。\n\n![技术细节](img/Image00007.jpg)\
  \ 在清单 19-3 中，语句 `anAccount.balance = myRandom.nextInt(10000)` 将一个 `int` 值赋给了 `balance`。但\
  \ `balance` 是一个 `double` 变量，而不是 `int` 变量。这没问题。在少数允许的情况下，Java 允许你将 `int` 值赋给 `double`\
  \ 变量。赋值的结果并不令人意外。如果你将 `int` 值 8734 赋给 `double` 变量 `balance`，那么 `balance` 的值就变成了\
  \ 8734.00。结果如图 19-3 的第一行所示。\n\n![记住](img/Image00005.jpg) 使用 `double` 类型来存储金额通常是一个坏主意。在本书中，我使用\
  \ `double` 是为了尽可能简化示例。但对于货币值，`int` 类型更好，而 `BigDecimal` 类型则更佳。更多细节，请参见第 7 章。\n\n\
  ### 让对象自己干活\n\n当我还是一个年轻的对象时，我没有你们现在拥有的对象那么聪明。例如，考虑清单 19-4 中的对象。这个对象不仅能显示自身，还能用值填充自身。\n\
  \n清单 19-4 一个包含两个方法的类\n\n```java\nimport java.util.Random;\nimport java.text.NumberFormat;\n\
