  \ \");`\n`quantity = keyboard.nextInt();`\n`System.out.print(\"Taxable? (true/false)\
  \ \");`\n`taxable = keyboard.nextBoolean();`\n`double total = unitPrice * quantity;`\n\
  `if (taxable) {`\n`total = total * 1.05;`\n`}`\n`String niceTotal = currency.format(total);`\n\
  `System.out.print(\"Total: \");`\n`System.out.println(niceTotal);`\n`keyboard.close();`\n\
  `}`\n`}`\n```\n\n### 理解大局\n\n在本节中，我将回答本书中提出的一些紧迫问题：“`java.util` 代表什么？” “为什么在代码的某些地方需要\
  \ `static` 这个词？” “园艺学学位如何帮助你整理已注销的支票？”\n\n我还将以一些独特而有趣的方式解释“static”。毕竟，静态字段和方法并不容易理解。从多个角度阅读\
  \ Java 的静态特性会有所帮助。\n\n### 包与导入声明\n\n在 Java 中，你可以将一组类分组到所谓的*包*中。实际上，Java 标准 API 中的类被分成了大约\
  \ 200 个包。本书中的示例大量使用了三个包：名为 `java.util`、`java.lang` 和 `java.io` 的包。\n\n#### 类 java.util.Scanner\n\
  \n包 `java.util` 包含大约 75 个类，其中包括非常有用的 `Scanner` 类。与大多数其他类一样，这个 `Scanner` 类有两个名称：一个*完全限定名*和一个缩写的*简单名*。该类的完全限定名是\
  \ `java.util.Scanner`，简单名是 `Scanner`。通过将包名添加到类的简单名上，你就得到了完全限定名。（也就是说，将包名 `java.util`\
  \ 添加到简单名 `Scanner` 上，得到 `java.util.Scanner`。）\n\n导入声明允许你缩写类的名称。使用声明\n\n`import java.util.Scanner;`\n\
  \nJava 编译器就能知道在哪里查找 `Scanner` 类。因此，你无需在整个代码中编写 `java.util.Scanner`，只需编写 `Scanner`\
  \ 即可。\n\n#### 类 java.lang.System\n\n\n\n\n\n`java.lang` 包包含约 35 个类，其中包括广受欢迎的 `System`\
  \ 类。（该类的全限定名是 `java.lang.System`，简单名是 `System`。）你无需在代码中编写 `java.lang.System`，只需编写\
  \ `System` 即可。你甚至不需要 `import` 声明。\n\n![technicalstuff](img/Image00007.jpg) 在 Java\
  \ 的所有包中，`java.lang` 包是特殊的。无论是否使用 import 声明，编译器都会自动导入 `java.lang` 包中的所有内容。你可以用 `import\
  \ java.lang.System` 开始程序，但即使你不这样做，编译器也会自动添加此声明。\n\n#### 静态变量 `System.out`\n\n为了缩写\
  \ `System.out.println`，你需要进行哪种导入？如何将其缩短为 `out.println`？import 声明允许你缩写*类*的名称。但在表达式\
  \ `System.out` 中，`out` 这个词并不是一个类，而是一个静态变量。（`out` 变量指向 Java 程序发送文本输出的位置。）因此，你不能编写：\n\
  \n```\n// 这段代码是无效的，不要使用：\nimport java.lang.System.out;\n```\n\n那该怎么办？你应该编写：\n\n\
  ```\nimport static java.lang.System.out;\n```\n\n要了解更多关于 `out` 变量作为静态变量的信息，请阅读下一节。\n\
  \n![technicalstuff](img/Image00007.jpg) 在本章中，我将 `out` 称为静态变量。这没问题。但更准确的描述是将其称为 Java\
  \ `System` 类的静态字段。\n\n### 揭开静态的神秘面纱\n\n我喜欢引用自己的话。当我引用自己的话时，不需要书面许可。我不必担心版权侵权，也从未收到过律师函。最棒的是，我可以随意更改和歪曲自己说过的话。当我转述自己的想法时，不可能被错误引用。\n\
  \n基于此，以下是前面章节中的一段引用：\n\n> *任何静态的东西都属于整个类，而不属于该类的任何特定实例……要调用静态方法，你需要使用类名加一个点。*\n\n\
  多么深刻！在清单 18-6 中，我介绍了一个名为 `parseInt` 的静态方法。以下是将同一段引用应用于静态 `parseInt` 方法的情况：\n\n>\
  \ *静态* `parseInt` *方法属于整个* `Integer` *类，而不属于* `Integer` *类的任何特定实例……要调用静态* `parseInt`\
  \ *方法，你需要使用* `Integer` *类名加一个点。你需要编写类似* `Integer.parseInt(reply)` *的代码。*\n\n非常好！那么我在第\
  \ 3 章中介绍的 `System.out` 呢？我也可以将我的引用应用于此。\n\n> *静态* `out` *变量属于整个* `System` *类，而不属于*\
  \ `System` *类的任何特定实例……要引用静态 out 变量，你需要使用* `System` *类名加一个点。你需要编写类似* `System.out.println()`\
  \ *的代码。*\n\n如果你思考一下 `System.out` 的含义，这种静态机制就说得通了。毕竟，名称 `System.out` 指向 Java 程序发送文本输出的位置。（当你使用\
  \ Eclipse 时，名称 `System.out` 指向 Eclipse 的控制台视图。）一个典型的程序只有一个发送文本输出的位置。因此，一个 Java 程序只有一个\
  \ `out` 变量。无论你创建了多少个对象——三个、十个或零个——你只有一个 `out` 变量。当你将某物设为静态时，你就确保了程序中只有该物的一个实例。\n\
  \n好了！`out` 变量是静态的。\n\n要缩写静态变量（或静态方法）的名称，你不能使用普通的 import 声明。相反，你需要使用静态导入声明。这就是为什么在第\
  \ 9 章及之后，我使用 `static` 关键字来导入 `out` 变量：\n\n```\nimport static java.lang.System.out;\n\
  ```\n\n### 巴里兑现了一个古老的承诺\n\n在第 6 章中，我将一个变量声明移到了 `main` 方法之外。我从清单 18-9 中的代码变成了清单 18-10\
  \ 中的代码。\n\n清单 18-9 在 main 方法内部声明变量\n\n```\nclass SnitSoft {\npublic static void\
  \ main(String args[]) {\ndouble amount = 5.95;\namount = amount + 25.00;\nSystem.out.println(amount);\n\
  }\n}\n```\n\n清单 18-10 将变量移到 main 方法外部\n\n```\nclass SnitSoft {\nstatic double amount\
  \ = 5.95;\npublic static void main(String args[]) {\namount = amount + 25.00;\n\
  System.out.println(amount);\n}\n}\n```\n\n在清单 18-9 中，`amount` 是属于 `main` 方法的变量。但在清单\
  \ 18-10 中，`amount` 是属于 `SnitSoft` 类的静态字段。\n\n在第 6 章中，我承诺会解释为什么清单 18-10 需要额外的 `static`\
  \ 关键字（在 `static double amount = 5.95` 中）。好了，经过本章对静态方法的所有讨论，我终于可以解释一切了。\n\n请参考图 18-7。在该图中，你有支票，还有一个\
  \ `sort` 方法。每张单独的支票都有自己的 `number`、自己的 `amount` 和自己的 `payee`。但整个 `Check` 类只有一个 `sort`\
  \ 方法。\n\n我不知道你怎么样，但为了整理我的已注销支票，我会把它们挂在我那棵奇特的象腿树（Yucca Elephantipes）上。我将编号较高的支票固定在上层叶片上，编号较低的放在下层叶片上。当我发现一张支票的编号介于另外两张之间时，我会选择一片空闲的叶子（位于上层和下层叶片之间）。\n\
  \n模拟我这种整理方法的程序看起来像这样：\n\n```\nclass Check {\nint number;\ndouble amount;\nString\
  \ payee;\nstatic void sort() {\nYucca tree;\nif (myCheck.number > 1700) {\ntree.attachHigh(myCheck);\n\
  }\n// … 等等\n}\n}\n```\n\n由于 `static` 关键字，`Check` 类只有一个 `sort` 方法。而且因为我在静态 `sort`\
  \ 方法内部声明了 `tree` 变量，这个程序只有一个 `tree` 变量。（事实上，我把所有已注销支票都挂在一棵象腿树上。）我可以将 `tree` 变量的声明移到\
  \ `sort` 方法外部。但如果这样做，我可能会有太多象腿树：\n\n```\nclass Check {\nint number;\ndouble amount;\n\
  String payee;\nYucca tree; // 这很糟糕！\n// 每张支票都有自己的树。\nstatic void sort() {\nif (myCheck.number\
  \ > 5000) {\ntree.attachHigh(myCheck);\n}\n// … 等等\n}\n}\n```\n\n在这段糟糕的代码中，每张支票都有自己的编号、自己的金额、自己的收款人以及自己的树。但这太荒谬了！我不想把每张支票都固定在自己的象腿树上。众所周知，你应该只用一棵象腿树来整理支票。（大银行就是这么做的。）\n\
  \n当我把 `tree` 变量的声明移到 `sort` 方法外部时，我希望保留我只有一棵树的事实。（更准确地说，整个 `Check` 类只有一棵树。）为了确保我只有一棵树，我将\
  \ `tree` 变量声明为静态：\n\n```\nclass Check {\nint number;\ndouble amount;\nString payee;\n\
  static Yucca tree; // 这样更好！\nstatic void sort() {\nif (myCheck.number > 5000) {\n\
  tree.attachHigh(myCheck);\n}\n// … 等等\n}\n}\n```\n\n出于完全相同的原因，当从清单 18-9 转到清单 18-10\
  \ 时，我编写了 `static double amount`。\n\n\n\n\n\n![tip](img/Image00003.jpg) 要了解更多关于排序的内容，请阅读约翰·莱文和玛格丽特·莱文·杨合著的\
  \ *UNIX For Dummies*（第 5 版）。要了解更多关于银行支票的内容，请阅读凯瑟琳·辛德尔所著的 *Managing Your Money Online\
  \ For Dummies*。要了解更多关于树的内容，请阅读菲利普·吉鲁、鲍勃·贝克斯特罗姆和兰斯·瓦尔海姆合著的 *Landscaping For Dummies*（均由\
