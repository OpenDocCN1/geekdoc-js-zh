  \ 变量，你需要调用 `currency` 对象的 `format` 方法。你将这个 `format` 方法应用于变量 `total`。\n\n### 你的国家；你的货币\n\
  \n清单 18-7 中的代码在美国运行良好。但在其他国家，货币符号可能不是美元符号 ($)，并且你可能用 `20.00` 以外的字符来表示 *二十*。\n\n\
  Java 会根据你计算机的区域设置来调整输入和输出。例如，假设你的计算机运行的是在法国销售的 Windows 版本。那么，就 Java 而言，你计算机的区域设置是\
  \ `Locale.FRANCE`，而清单 18-7 中代码的一次运行结果看起来就像图 18-11 所示。\n\n![图像](img/Image00226.jpg)\n\
