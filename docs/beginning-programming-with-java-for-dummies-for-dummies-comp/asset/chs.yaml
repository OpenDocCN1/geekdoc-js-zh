  }\n```\n\n#### 什么类型的数字？\n\n编写一个程序，从键盘读取一个数字，并显示`positive`、`negative`或`zero`中的一个词来描述该数字。使用级联`if`语句。\n\
  \n#### 接近交通信号灯\n\n你的驾驶手册上说：“当接近绿灯时，通过路口，除非这样做不安全，或者有警察指示你不要这样做。”\n\n编写一个程序，向用户提出三个问题：\n\
  \n* 你正在接近绿灯吗？\n* 通过路口安全吗？\n* 有警察指示你不要通过吗？\n\n对于每个问题，用户回答`Y`或`N`。根据三个回答，程序显示`Go`或`Stop`。\n\
