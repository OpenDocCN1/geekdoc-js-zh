  \n图 13-7： 计算机硬盘上 `13-02` 项目文件夹的内容。\n\n## 编写面向磁盘的程序\n\n清单 13-2 与清单 13-1 非常相似。实际上，只需进行一些简单的编辑，就可以从清单\
