  \ 24 32 40 48 56 64 72\n    9 |9 18 27 36 45 54 63 72 81\n    ```\n\n## 重复直到获得所需结果（Java\
  \ do 语句）\n\n我在第 12 章中介绍了 Java 的 `while` 循环。当你创建 `while` 循环时，首先编写循环的条件。在条件之后，编写需要重复执行的代码。\n\
  \n```\nwhile (条件) {\n    需要重复执行的代码\n}\n```\n\n这种编写 `while` 语句的方式并非偶然。该语句的外观强调了一个重要点——计算机在执行任何重复代码之前总是先检查条件。\n\
  \n如果循环的条件永远不为真，则循环内的代码永远不会被执行——一次也不会。事实上，你可以轻松编写一个永远不会执行其语句的 `while` 循环（尽管我想不出有什么理由要这样做）：\n\
  \n```\n// 这段代码不会输出任何内容：\nint twoPlusTwo = 2 + 2;\nwhile (twoPlusTwo == 5) {\n  \
  \  System.out.println(\"你在开玩笑吗？\");\n    System.out.println(\"2+2 不等于 5。\");\n \
  \   System.out.print(\"每个人都知道\");\n    System.out.println(\" 2+2 等于 3。\");\n}\n\
  ```\n\n尽管有这样一个愚蠢的 `twoPlusTwo` 示例，但 `while` 语句仍然是 Java 循环结构中最有用的。特别是，`while` 循环适用于需要“三思而后行”的情况。例如：“只要我的账户里有钱，就每月开一张按揭支票。”当你第一次遇到这个语句时，如果账户余额为零，你就不想开按揭支票——一张都不想。\n\
  \n但有时（虽然不多），你需要“先行动后思考”。在向用户请求响应的情况下，用户的响应可能合理，也可能不合理。可能是用户手指滑了，或者用户没有理解问题。在许多情况下，正确解释用户的响应非常重要。如果用户的响应不合理，你必须再次询问。\n\
  \n### 获取可靠的响应\n\n考虑一个删除文件的程序。在删除文件之前，程序要求用户确认。如果用户输入 `Y`，则删除；如果输入 `N`，则不删除。当然，删除文件是严肃的事情。将错误的按键误认为是“是”的回答可能会删除公司的记录。（而将错误的按键误认为是“否”的回答可能会保留公司的罪证。）如果对用户的响应有任何疑问，程序应要求用户重新响应。\n\
  \n\n\n\n暂停片刻，思考一下动作的流程——当计算机执行循环时，应该发生什么，不应该发生什么。这种循环在获取用户的第一个响应之前不需要检查任何东西。实际上，在用户给出第一个响应之前，循环没有什么可检查的。循环不应该以“只要用户的响应无效，就获取用户的另一个响应”开始。相反，循环应该直接向前，获取用户的响应，然后检查该响应是否有意义。实现这一切的代码在清单\
  \ 15-4 中。\n\n清单 15-4 删除前重复\n\n```java\n/*\n* DISCLAIMER: Neither the author nor\
  \ John Wiley & Sons,\n* Inc., nor anyone else even remotely connected with the\n\
  * creation of this book, assumes any responsibility\n* for any damage of any kind\
  \ due to the use of this code,\n* or the use of any work derived from this code,\n\
  * including any work created partially or in full by\n* the reader.\n*\n* Sign here:_______________________________\n\
  */\n\nimport java.io.File;\nimport java.util.Scanner;\n\nclass IHopeYouKnowWhatYoureDoing\
  \ {\n    public static void main(String args[]) {\n        Scanner keyboard = new\
  \ Scanner(System.in);\n        char reply;\n\n        do {\n            System.out.print(\"\
  Reply with Y or N…\");\n            System.out.print(\" Delete the importantData\
  \ file? \");\n            reply = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n\
  \        } while (reply != 'Y' && reply != 'N');\n\n        if (reply == 'Y') {\n\
  \            new File(\"importantData.txt\").delete();\n            System.out.println(\"\
  Deleted!\");\n        } else {\n            System.out.println(\"No harm in asking!\"\
  );\n        }\n\n        keyboard.close();\n    }\n}\n```\n\n### 删除文件\n\n运行清单 15-4\
  \ 程序的结果如图 15-6 所示。在删除文件之前，程序询问用户是否同意删除。如果用户给出两个预期答案之一（`Y`或`N`），程序将按照用户的意愿进行。但如果用户输入任何其他字母（或任何数字、标点符号等），程序会要求用户再次响应。\n\
  \n![image](img/Image00189.jpg)\n\n图 15-6: 不！别这么做！\n\n在图 15-6 中，用户犹豫了一会儿，先是输入字母`U`，然后是数字`8`，接着是小写字母。最后，用户输入`Y`，程序删除了`importantData.txt`文件。如果你比较硬盘上的文件（在程序运行前后），你会发现程序删除了名为`importantData.txt`的文件。\n\
  \n如果你使用 Eclipse，以下是如何确认文件被删除的方法：\n\n1. **创建一个包含清单 15-4 中代码的 Java 项目。**\n\n   如果你按照第\
