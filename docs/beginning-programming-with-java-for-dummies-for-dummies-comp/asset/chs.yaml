  \n#### 看见星星\n\n这个实验分为两部分。第一部分只需要一个循环。第二部分需要嵌套循环。\n\n\n\n\n\n*   编写一个程序，询问用户要显示多少颗星。当用户输入一个数字时，程序显示相应数量的星。以下是示例运行：\n\
