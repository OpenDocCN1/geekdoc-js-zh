  \ 19-7。\n\n*   **在图 19-5 的第二次调用中，余额为 3756.00，利率为 0.0。**\n\n    进行此调用时，表达式 `balance\
  \ * (rate / 100.0)` 表示 3756.00 * (0.0 / 100.00)。同样参见图 19-7。\n\n*   **在图 19-5 的第三次调用中，余额为\
  \ 8474.00，利率为 3.0。**\n\n    进行 `addInterest` 调用时，表达式 `balance * (rate / 100.0)`\
  \ 表示 8474.00 * (3.0 / 100.00)。\n\n![image](img/Image00233.gif)\n\n图 19-7： Cbj 的账户和\
  \ Bry 的账户。\n\n### 传递多个参数\n\n看一下清单 19-6 和清单 19-7。在这些清单中，`display` 方法没有参数，而 `addInterest`\
