  #### 微型计算器\n\n编写一个程序，提示用户输入两个数字和一个字符。在`switch`语句中，程序将该字符对应的运算应用于这两个数字，并显示结果。程序的一次运行可能如下所示：\n\
  \n```\nFirst number: 21.0\nSecond number: 8.0\nOperation (+ - * or /): +\n29.0\n\
  ```\n\n程序接受字符`+`、`-`、`*`或`/`中的任意一个。作为额外挑战，增强程序的输出如下：\n\n```\nFirst number: 31.0\n\
  Second number: 10.0\nOperation (+ - * or /): *\n31.0 * 10.0 = 310.0\n```\n\n请记住，你不能使用\
  \ Java 的`+`符号来显示一个`char`值紧挨着一个数值。如果你执行`System.out.println(5 + ’ ’ + ’*’)`，Java 不会显示`5\
  \ *`。相反，Java 会显示`79`。（如果你不信，可以在 JShell 中试试。）\n\n#### 数字颜色\n\n在 RGB 颜色模型中，数值表示红色、绿色和蓝色的量。如果你混合红、绿、蓝仅显示八种颜色，那么\
  \ 0 是黑色，1 是蓝色，2 是绿色，3 是青色，4 是红色，5 是品红色，6 是黄色，7 是白色。编写一个程序，从键盘读取一个数字，并显示该数字对应的颜色名称。\n\
  \n## 使用条件运算符\n\nJava 有一个我忍不住要写的巧妙特性。使用这个特性，你可以以一种自然的方式思考替代方案。\n\n那么“自然的方式”是什么意思呢？如果我模仿清单\
  \ 11-3 末尾附近的`if`语句大声思考，我会得出这样的结论：\n\n```\n//清单 11-3 中的思考过程：\n接下来我该做什么？\n如果是闰年，\n\
  我就让 numberOfDays 为 29；\n否则，\n我就让 numberOfDays 为 28。\n```\n\n我毫无头绪地进入了一个`if`语句，不知道接下来要做什么。这看起来很傻。现在是二月，每个人都知道二月该做什么。你要问这个月有多少天。\n\
  \n在我看来，清单 11-3 中的代码并没有反映出思考二月的最自然方式。这里有一种更自然的方式：\n\n```\n//思考这个问题的更自然方式：\nnumberOfDays\
  \ 的值是……\n等等！这是闰年吗？\n如果是，29\n如果不是，28\n```\n\n在这种更自然的思考方式中，我从一开始就知道我在选择一个天数。所以当我走到岔路口（“这是闰年吗？”）时，剩下的唯一任务就是在\
  \ 29 和 28 之间做出选择。\n\n我可以优雅地做出选择：\n\n```\ncase 2:\nSystem.out.print(\"Leap year (true/false)?\
  \ \");\nisLeapYear = keyboard.nextBoolean();\nnumberOfDays = isLeapYear ? 29 : 28;\n\
  ```\n\n`? :`组合被称为*条件运算符*。在图 11-6 中，我向你展示了我对二月的自然思考如何演变成条件运算符的格式。\n\n![image](img/Image00150.jpg)\n\
  \n图 11-6：从你的思维到计算机的代码。\n\n整体来看，`isLeapYear ? 29 : 28`是一个具有值的表达式。那么这个表达式有什么值呢？嗯，`isLeapYear\
  \ ? 29 : 28`的值要么是`29`，要么是`28`。这取决于`isLeapYear`是否为`true`。这就是条件运算符的工作原理：\n\n*   如果问号前面的内容为`true`，则整个表达式的值就是问号和冒号之间的内容。\n\
  *   如果问号前面的内容为`false`，则整个表达式的值就是冒号后面的内容。\n\n图 11-7 以一种滑稽的方式展示了这些概念。\n\n![image](img/Image00151.jpg)\n\
  \n图 11-7：你见过表达式自言自语吗？\n\n条件运算符的整体效果就像计算机在执行\n\n`numberOfDays = 29;`\n\n或\n\n`numberOfDays\
  \ = 28;`\n\n无论如何，`numberOfDays`都会得到一个值，并且代码优雅地解决了问题。\n\n![tryitout](img/Image00006.jpg)\
  \ 练习使用 Java 的条件运算符。\n\n#### 盛装打扮\n\n再看一下第 9 章中的“试一试”程序。使用条件运算符重写其中一些程序。\n\n*   询问用户是否想看笑脸。如果用户回答`Y`，则显示`:-)`；否则显示`:-(`。\n\
  *   随机生成一个数字，让用户输入一个数字。如果数字匹配，显示`You win!`，否则显示`You lose`。\n*   从键盘读取一个米数。然后从键盘读取一个字母（`c`或`m`）。如果字母是`c`，将米转换为厘米并显示结果。如果字母是`m`，将米转换为毫米并显示结果。（假设用户总是输入字母`c`或`m`。）\n\
  \n\n\n\n\n*   从键盘读取若干米数。然后从键盘读取一个字母。如果该字母是 `c`，则将米转换为厘米并显示结果。如果该字母是 `m`，则将米转换为毫米并显示结果。对于任何其他字母，显示原始的米数。\n\
  \n第 12 章\n\n## 循环往复\n\n本章内容\n\n![check](img/Image00002.jpg) **创建程序循环**\n\n![check](img/Image00002.jpg)\
  \ **用循环制定问题解决方案**\n\n![check](img/Image00002.jpg) **诊断循环问题**\n\n第 8 章 有一段代码，用于反转用户输入的四个字母单词。如果你没读过第\
  \ 8 章，或者不想翻回去看，这里快速回顾一下代码：\n\n```\nc1 = keyboard.findWithinHorizon(\".\",0).charAt(0);\n\
  c2 = keyboard.findWithinHorizon(\".\",0).charAt(0);\nc3 = keyboard.findWithinHorizon(\"\
  .\",0).charAt(0);\nc4 = keyboard.findWithinHorizon(\".\",0).charAt(0);\nSystem.out.print(c4);\n\
  System.out.print(c3);\nSystem.out.print(c2);\nSystem.out.print(c1);\n```\n\n这段代码对于恰好四个字母的单词来说非常合适，但如何反转一个五个字母的单词呢？按照现有代码，你必须添加两条新语句：\n\
  \n```\nc1 = keyboard.findWithinHorizon(\".\",0).charAt(0);\nc2 = keyboard.findWithinHorizon(\"\
  .\",0).charAt(0);\nc3 = keyboard.findWithinHorizon(\".\",0).charAt(0);\nc4 = keyboard.findWithinHorizon(\"\
  .\",0).charAt(0);\nc5 = keyboard.findWithinHorizon(\".\",0).charAt(0);\nSystem.out.print(c5);\n\
  System.out.print(c4);\nSystem.out.print(c3);\nSystem.out.print(c2);\nSystem.out.print(c1);\n\
  ```\n\n真麻烦！每当单词长度变化时，你就要添加语句！当输入变短时，你还要删除语句！这肯定不是解决问题的最佳方式。也许你可以命令计算机自动添加语句。（但话说回来，也许不行。）\n\
  \n幸运的是，你可以做得更好：只需编写一次语句，然后告诉计算机多次执行该语句。执行多少次？你可以告诉计算机执行该语句，直到它需要执行的次数为止。\n\n这就是核心思想。本章其余部分将详细介绍细节。\n\
  \n## 一遍又一遍地重复指令（Java while 语句）\n\n这里有一个简单的掷骰子游戏：不断掷两个骰子，直到掷出 7 或 11。清单 12-1 中的程序模拟了游戏中的动作，图\
  \ 12-1 显示了该程序的两次运行。\n\n![image](img/Image00152.gif)\n\n图 12-1: 妈妈需要一双新鞋。\n\n清单 12-1\
  \ 掷出 7 或 11\n\n```\nimport java.util.Random;\nimport static java.lang.System.out;\n\
  class SimpleDiceGame {\n  public static void main(String args[]) {\n    Random myRandom\
  \ = new Random();\n    int die1 = 0, die2 = 0;\n    while (die1 + die2 != 7 && die1\
  \ + die2 != 11) {\n      die1 = myRandom.nextInt(6) + 1;\n      die2 = myRandom.nextInt(6)\
  \ + 1;\n      out.print(die1);\n      out.print(\" \");\n      out.println(die2);\n\
  \    }\n    out.print(\"Rolled \");\n    out.println(die1 + die2);\n  }\n}\n```\n\
  \n清单 12-1 的核心是一个称为 *while 语句*（也称为 *while 循环*）的东西。`while` 语句具有以下形式：\n\n```\nwhile\
  \ (条件) {\n  语句\n}\n```\n\n用英语重新表述，清单 12-1 中的 `while` 语句会说：\n\n*当两个骰子的点数之和不是 7 也不是\
  \ 11 时*\n\n*继续执行花括号内的所有内容：* `{`\n\n`}`\n\n花括号内的内容（一遍又一遍重复的内容）是获取两个新的随机数并显示这些随机数值的代码。只要\
  \ `die1 + die2 != 7 && die1 + die2 != 11` 保持为真，花括号内的语句就会重复执行。\n\n循环中每次重复语句称为循环的一次\
  \ *迭代*。在图 12-1 中，第一次运行有 2 次迭代，第二次运行有 12 次迭代。\n\n当 `die1 + die2 != 7 && die1 + die2\
  \ != 11` 不再为真时（即当 `sum` 为 7 或 11 时），语句的重复立即停止。计算机继续执行循环之后的语句。\n\n### 跟踪循环中的动作\n\n\
  为了追踪清单 12-1 中代码的动作，我将借用图 12-1 中第一次运行的数字：\n\n*   开始时，`die1` 和 `die2` 的值都是 `0`。\n\n\
  *   计算机到达 `while` 语句的顶部，检查 `die1 + die2 != 7 && die1 + die2 != 11` 是否为真。（参见图 12-2。）条件为真，因此计算机在图\
  \ 12-3 中走 `true` 路径。\n\n    计算机执行一次循环迭代。在此迭代中，计算机获取 `die1` 和 `die2` 的新值，并将这些值打印在屏幕上。在图\
  \ 12-1 的第一次运行中，新值为 `3` 和 `1`。\n\n*   计算机返回到 `while` 语句的顶部，检查 `die1 + die2 != 7 &&\
  \ die1 + die2 != 11` 是否仍然为真。条件为真，因此计算机在图 12-3 中走 `true` 路径。\n\n    计算机执行另一次循环迭代。在此迭代中，计算机获取\
  \ `die1` 和 `die2` 的新值，并将这些值打印在屏幕上。在图 12-1 中，新值为 4 和 3。\n\n*   计算机返回到 `while` 语句的顶部，检查\
  \ `die1 + die2 != 7 && die1 + die2 != 11` 是否仍然为真。瞧！这个条件变成了假！（参见图 12-4。）计算机在图 12-3\
  \ 中走 `false` 路径。\n\n    计算机跳转到循环之后的语句。计算机显示 `Rolled 7` 并结束程序运行。\n\n![image](img/Image00153.jpg)\n\
  \n图 12-2: 两个错误不等于一个正确，但两个真值等于一个真值。\n\n![image](img/Image00154.gif)\n\n图 12-3: 清单\
  \ 12-1 中代码的路径。\n\n![image](img/Image00155.jpg)\n\n图 12-4: 看！我掷出了七点！\n\n### 没有提前退出\n\
  \n在清单 12-1 中，当计算机发现 `die1 + die2 != 7 && die1 + die2 != 11` 为真时，计算机继续执行并执行循环花括号内的所有五个语句。计算机执行\n\
  \n```\ndie1 = myRandom.nextInt(6) + 1;\ndie2 = myRandom.nextInt(6) + 1;\n```\n\n\
  也许（仅仅是也许），`die1` 和 `die2` 的新值加起来等于 7。即便如此，计算机也不会在循环中途跳出。计算机完成本次迭代并执行\n\n```\nout.print(die1);\n\
  out.print(\" \");\nout.println(die2);\n```\n\n再一次。计算机只有在完全执行完循环中的所有五个语句后，才会再次执行测试（检查\
  \ `die1 + die2 != 7 && die1 + die2 != 11` 是否仍然为真）。\n\n## 思考循环（哪些语句放在哪里）\n\n以下是二十一点纸牌游戏的简化版本：你不断拿牌，直到总点数达到\
  \ 21 或更高。然后，如果总点数为 21，你就赢了。如果总点数更高，你就输了。（顺便说一下，每张人头牌算作 10 点。）要玩这个游戏，你需要一个运行结果如图\
  \ 12-5 所示的程序。\n\n![image](img/Image00156.gif)\n\n图 12-5: 你赢则总和，你输则总和。\n\n\n\n\n\n\
  在本书的大部分章节中，我会在介绍程序特性之前先列出程序代码。但本节有所不同。本节讨论的是编写代码的策略。因此，在本节中，我将从头脑风暴策略开始。\n\n###\
  \ 寻找一些片段\n\n如何编写一个简化版“二十一点”游戏程序？我首先从游戏规则中寻找线索，这些规则在本节第一段中已详细说明。这场大规模的“寻宝”活动如图 12-6\
  \ 所示。\n\n![image](img/Image00157.jpg)\n\n图 12-6： 思考编程问题。\n\n根据图 12-6 的推理，我需要一个循环和一个`if`语句：\n\
  \n```\nwhile (total < 21) {\n    //do stuff\n}\nif (total == 21) {\n    //You win\n\
  } else {\n    //You lose\n}\n```\n\n要让这个程序运行起来，还需要什么？看看图 12-5 中的示例输出。我需要一个包含`Card`和`Total`字样的标题。这需要调用`System.out.println`：\n\
  \n```\nSystem.out.println(\"Card Total\");\n```\n\n我还需要几行输出——每行包含两个数字。例如，在图 12-5\
  \ 中，`6 14`这一行显示了两个变量的值。一个变量存储最近抽取的牌，另一个变量存储到目前为止所有抽取牌的总和：\n\n```\nSystem.out.print(card);\n\
  System.out.print(\" \");\nSystem.out.println(total);\n```\n\n现在我有四段代码，但还没有决定它们如何组合在一起。好吧，你可以直接说我疯了。但在这一过程中，我设想这四段代码相互环绕，就像低成本电影中的梦境片段。你可能想象得到，我并不擅长在梦境片段中描绘环绕的代码。即便如此，我还是把我的想法交给了约翰·威利父子出版公司的艺术部门，他们画出了图\
  \ 12-7 中的画面。\n\n![image](img/Image00158.gif)\n\n图 12-7： **……** 它们停在哪里，无人知晓。\n\n\
  ### 组装片段\n\n每段代码应该放在哪里？解决这个问题的最佳方法是询问每段代码应该执行多少次：\n\n*   **程序多次显示`card`和`total`的值。**\
  \ 例如，在图 12-5 的第一次运行中，程序显示了四次这些值（先是`8 8`，然后是`6 14`，等等）。为了重复显示，我将生成显示的代码放在循环内部：\n\n\
  \    ```\n    while (total < 21) {\n        System.out.print(card);\n        System.out.print(\"\
  \ \");\n        System.out.println(total);\n    }\n    ```\n\n*   **程序每次运行只显示一次`Card\
  \ Total`标题。** 这个显示出现在重复数字显示之前，因此我将标题代码放在循环之前：\n\n    ```\n    System.out.println(\"\
  Card Total\");\n    while (total < 21) {\n        System.out.print(card);\n    \
  \    System.out.print(\" \");\n        System.out.println(total);\n    }\n    ```\n\
  \n*   **程序每次运行只显示一次`You win`或`You lose`。** 这个消息显示出现在重复数字显示之后。因此我将输赢代码放在循环之后：\n\n\
  \    ```\n    //Preliminary draft code -- NOT ready for prime time:\n    System.out.println(\"\
  Card Total\");\n    while (total < 21) {\n        System.out.print(card);\n    \
  \    System.out.print(\" \");\n        System.out.println(total);\n    }\n    if\
  \ (total == 21) {\n        System.out.println(\"You win :-)\");\n    } else {\n\
  \        System.out.println(\"You lose :-(\");\n    }\n    ```\n\n### 获取变量的值\n\n\
  我几乎有了一个可运行的程序。但如果我对已开发的代码进行心理测试运行，我会面临一些问题。为了理解我的意思，请想象自己站在计算机的角度思考片刻。（好吧，计算机没有鞋子。想象自己穿着计算机的靴子。）\n\
  \n你从上一节显示的代码顶部开始（以`Preliminary draft`注释开头的代码）。在代码的第一条语句中，你显示`Card Total`字样。到目前为止一切顺利。但随后你遇到`while`循环并测试条件`total\
  \ < 21`。那么，`total`是否小于`21`？老实说，我很想编造一个答案，因为我不知道`total`变量的值而感到尴尬。（我确信计算机也很尴尬。）\n\n\
  在计算机到达`while`循环顶部之前，变量`total`必须有一个已知的值。由于玩家一开始没有牌，初始`total`值应为`0`。就这样定了。我在程序顶部声明`int\
  \ total = 0`。\n\n但我的朋友`card`变量呢？是否也应该将`card`设置为零？不。一副牌中没有值为零的牌（至少在我公平游戏时没有）。此外，`card`在程序运行期间应该多次获得新值。\n\
  \n等等！在前一句话中，“多次”这个词触动了我大脑中的神经元。它激发了“循环内部”的反射。因此我将对`card`变量的赋值放在`while`循环内部：\n\n\
  ```\n//This is a DRAFT -- still NOT ready for prime time:\nint card, total = 0;\n\
  System.out.println(\"Card Total\");\nwhile (total < 21) {\n    card = myRandom.nextInt(10)\
  \ + 1;\n    System.out.print(card);\n    System.out.print(\" \");\n    System.out.println(total);\n\
  }\nif (total == 21) {\n    System.out.println(\"You win :-)\");\n} else {\n    System.out.println(\"\
  You lose :-(\");\n}\n```\n\n代码仍然有一个错误，我可能通过更多的计算机角色扮演找到它。但相反，我大胆地运行这个测试版代码，看看会发生什么。图\
  \ 12-8 显示了运行的一部分。\n\n![image](img/Image00159.gif)\n\n图 12-8： 一次错误的运行。\n\n不幸的是，图\
  \ 12-8 中的运行不会自行停止。这种处理称为*无限循环*。循环一直运行，直到有人绊倒计算机的延长线。\n\n![remember](img/Image00005.jpg)\
  \ 你可以立即终止程序的运行。在 Eclipse 控制台视图的顶部寻找那个小小的红色矩形。当光标悬停在矩形上时，工具提示会显示*Terminate*。点击矩形，正在运行的\
  \ Java 程序就会停止，矩形变为灰色。\n\n### 从无限到有限\n\n对于某些问题，无限循环是正常且理想的。例如，考虑一个实时关键任务应用程序——空中交通管制或心肺机的监控。在这些情况下，程序应该一直运行下去。\n\
  \n但二十一点游戏应该很快结束。在图 12-8 中，游戏没有结束，因为`total`从未达到 21 或更高。实际上，`total`始终为零。问题在于我的代码中没有改变`total`变量值的语句。我应该将每张牌的值加到`total`上：\n\
  \n```\ntotal += card;\n```\n\n再次，我问自己这条语句应该放在代码中的什么位置。计算机应该执行这条赋值语句多少次？在程序开始时一次？在运行结束时一次？还是重复执行？\n\
  \n计算机应该重复地将牌的值加到累计总数上。实际上，每次抽牌时都应该累加。因此前面的赋值语句应该放在`while`循环内部，与获取新`card`值的语句并列：\n\
  \n```\ncard = myRandom.nextInt(10) + 1;\ntotal += card;\n```\n\n有了这个发现，我准备好查看完整的程序了。代码在清单\
  \ 12-2 中，图 12-5 显示了两次运行结果。\n\n清单 12-2 简化版二十一点游戏\n\n\n\n\n\n```java\nimport java.util.Random;\n\
  \nclass PlayTwentyOne {\n    public static void main(String args[]) {\n        Random\
  \ myRandom = new Random();\n        int card, total = 0;\n        System.out.println(\"\
  Card Total\");\n        while (total < 21) {\n            card = myRandom.nextInt(10)\
  \ + 1;\n            total += card;\n            System.out.print(card);\n      \
  \      System.out.print(\" \");\n            System.out.println(total);\n      \
  \  }\n        if (total == 21) {\n            System.out.println(\"You win :-)\"\
  );\n        } else {\n            System.out.println(\"You lose :-(\");\n      \
  \  }\n    }\n}\n```\n\n如果你已经读完了整个章节，你可能已经筋疲力尽了。创建循环可能是一项繁重的工作。幸运的是，你练习得越多，它就会变得越容易。\n\
  \n## 思考循环（预启动）\n\n我记得小时候，我们住在费城的前街，靠近高架列车转向肯辛顿大道的地方。清晨时分，我得到外面从井里打水。我得压好几次水泵，水才会出来。爸爸妈妈管这叫“引水”。\n\
  \n如今我不再引水了，而是给`while`循环做“预启动”。考虑一个忙碌的网络管理员的情况。她需要一个能从电子邮件地址中提取用户名的程序。例如，程序读取\n\n\
  `John@BurdBrain.com`\n\n并输出\n\n`John`\n\n程序是如何做到的呢？和本章的其他例子一样，这个问题涉及重复：\n\n- 重复执行以下操作：\n\
  \  - 读取一个字符。\n  - 输出该字符。\n\n当程序找到@符号时，就停止重复。我尝试编写这个程序。我的第一次尝试没有成功，但这是一个相当不错的开始。代码见清单\
  \ 12-3。\n\n清单 12-3 尝试从电子邮件地址获取用户名\n\n```java\n/*\n * This code does NOT work, but\
  \ I’m not discouraged.\n */\nimport java.util.Scanner;\n\nclass FirstAttempt {\n\
  \    public static void main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
  \        char symbol = ' ';\n        while (symbol != '@') {\n            symbol\
  \ = keyboard.findWithinHorizon(\".\",0).charAt(0);\n            System.out.print(symbol);\n\
  \        }\n        System.out.println();\n        keyboard.close();\n    }\n}\n\
  ```\n\n当你运行清单 12-3 中的代码时，你会得到如图图 12-9 所示的输出。用户一个接一个地输入字符——字母`J`，然后是`o`，然后是`h`，等等。起初，清单\
  \ 12-3 中的程序什么也不做。（在用户按下回车键之前，计算机不会将用户的任何输入发送给程序。）当用户输入完整的电子邮件地址并按下回车键后，程序获取第一个字符（`John`中的`J`）。\n\
  \n![image](img/Image00160.gif)\n\n图 12-9: 哎呀！连@符号也一起得到了。\n\n不幸的是，程序的输出并非你所期望。你得到的不仅仅是用户名`John`，而是用户名和@符号。\n\
  \n要找出原因，请跟随计算机读取输入`John@BurdBrain.com`时的操作：\n\n- 将`symbol`设置为`' '`（一个空格）。\n- 这个空格是否等于@符号？\n\
  \  - 否，因此执行一次循环迭代。\n  - 输入字母`'J'`。\n  - 打印字母`'J'`。\n- 这个`'J'`是否等于@符号？\n  - 否，因此执行一次循环迭代。\n\
  \  - 输入字母`'o'`。\n  - 打印字母`'o'`。\n- 这个`'o'`是否等于@符号？\n  - 否，因此执行一次循环迭代。\n  - 输入字母`'h'`。\n\
  \  - 打印字母`'h'`。\n- 这个`'h'`是否等于@符号？\n  - 否，因此执行一次循环迭代。\n  - 输入字母`'n'`。\n  - 打印字母`'n'`。\n\
  - 这个`'n'`是否等于@符号？ //问题就在这里。\n  - 否，因此执行一次循环迭代。\n  - 输入@符号。\n  - 打印@符号。 //哎呀！\n-\
  \ 这个@符号是否等于@符号？\n  - 是，因此停止迭代。\n\n在程序运行接近尾声时，计算机将字母`n`与`@`符号进行比较。因为`n`不是@符号，计算机直接进入循环：\n\
  \n- 循环中的第一条语句从键盘读取一个@符号。\n- 循环中的第二条语句没有检查是否到了停止打印的时候。相反，它直接前进并显示@符号。\n\n一旦你显示了@符号，就无法回头了。你不能改变主意并取消显示@符号。因此，清单\
  \ 12-3 中的代码并不完全有效。\n\n### 解决问题\n\n你从错误中学习。清单 12-3 的问题在于，在读取和写入字符之间，程序没有检查@符号。它应该执行“输入、测试、打印”，而不是“测试、输入、打印”。也就是说，不是这样做：\n\
  \n- 这个`'o'`是否等于@符号？\n  - 否，因此执行一次循环迭代。\n  - 输入字母`'h'`。\n  - 打印字母`'h'`。\n- 这个`'h'`是否等于@符号？\n\
  \  - 否，因此执行一次循环迭代。\n  - 输入字母`'n'`。\n  - 打印字母`'n'`。\n- 这个`'n'`是否等于@符号？ //问题就在这里。\n\
  \  - 否，因此执行一次循环迭代。\n  - 输入@符号。\n  - 打印@符号。 //哎呀！\n\n程序应该这样做：\n\n- 输入字母`'o'`。\n-\
  \ 这个`'o'`是否等于@符号？\n  - 否，因此执行一次循环迭代。\n  - 打印字母`'o'`。\n- 输入字母`'n'`。\n- 这个`'n'`是否等于@符号？\n\
  \  - 否，因此执行一次循环迭代。\n  - 打印字母`'n'`。\n- 输入@符号。\n- 这个@符号是否等于@符号？\n  - 是，因此停止迭代。\n\n\
  这个循环如图图 12-10 所示。\n\n![image](img/Image00161.gif)\n\n图 12-10: 程序需要做的事情。\n\n你可以尝试模仿以下非正式模式：\n\
  \n- 输入一个字符。\n- 该字符是否等于@符号？\n  - 如果不是，则执行一次循环迭代。\n- 打印该字符。\n\n问题是，你不能把`while`循环的测试放在循环中间：\n\
  \n```java\n//This code doesn’t work the way you want it to work:\n{\n    symbol\
  \ = keyboard.findWithinHorizon(\".\",0).charAt(0);\n    while (symbol != '@')\n\
  \        System.out.print(symbol);\n}\n```\n\n你不能把`while`语句的条件夹在你想要重复的两个语句之间。那么你能做什么呢？你需要遵循图\
  \ 12-11 中的流程。因为每个`while`循环都以测试开始，这就是你跳入循环的地方：先测试，然后打印，最后输入。\n\n![image](img/Image00162.gif)\n\
  \n图 12-11: 跳入循环。\n\n清单 12-4 展示了这种“测试、然后打印、然后输入”策略的具体实现。\n\n清单 12-4 不错的尝试，但是……\n\n\
  ```java\n/*\n * This code almost works, but there’s one tiny error:\n */\nimport\
  \ java.util.Scanner;\n\nclass SecondAttempt {\n    public static void main(String\
  \ args[]) {\n        Scanner keyboard = new Scanner(System.in);\n        char symbol\
  \ = ' ';\n        while (symbol != '@') {\n            System.out.print(symbol);\n\
  \            symbol = keyboard.findWithinHorizon(\".\",0).charAt(0);\n        }\n\
  \        System.out.println();\n        keyboard.close();\n    }\n}\n```\n\n运行清单\
  \ 12-4 代码的结果如图图 12-12 所示。代码几乎正确，但我仍然有一个小问题。注意用户输入前的空格。程序过早地进入了循环。第一次计算机执行以下语句时\n\
  \n```java\nSystem.out.print(symbol);\nsymbol = keyboard.findWithinHorizon(\".\"\
  ,0).charAt(0);\n```\n\n\n\n\n计算机显示了一个不需要的空白字符。然后计算机获取了`John`中的`J`。在某些应用中，多一个空白字符没什么大不了的。但在其他应用中，多余的输出可能是灾难性的。\n\
  \n![image](img/Image00163.gif)\n\n图 12-12： 计算机显示了一个多余的空白字符。\n\n### 修复问题\n\n无论是否灾难性，多余的空白字符都是逻辑缺陷的症状。程序在还没有任何有意义的结果可以显示之前，不应该显示结果。这个问题的解决方案被称为……（请击鼓）……*循环预读*。你调用一次`findWithinHorizon(\"\
  .\",0).charAt(0)`来让一些值流动起来。清单 12-5 展示了如何操作。\n\n清单 12-5 如何预读循环\n\n```\n/*\n * 这段代码能正确运行！\n\
  \ */\nimport java.util.Scanner;\nclass GetUserName {\n    public static void main(String\
  \ args[]) {\n        Scanner keyboard = new Scanner(System.in);\n        char symbol;\n\
  \        symbol = keyboard.findWithinHorizon(\".\",0).charAt(0);\n        while\
  \ (symbol != '@') {\n            System.out.print(symbol);\n            symbol =\
  \ keyboard.findWithinHorizon(\".\",0).charAt(0);\n        }\n        System.out.println();\n\
  \        keyboard.close();\n    }\n}\n```\n\n清单 12-5 遵循了图 12-13 所示的策略。首先你获取一个字符（例如`John`中的字母`J`），然后进入循环。进入循环后，你将该字母与@符号进行比较，如果合适则打印该字母。图\
  \ 12-14 展示了`GetUserName`程序的一次完美运行。\n\n![image](img/Image00164.gif)\n\n图 12-13： 清单\
  \ 12-5 中的策略。\n\n![image](img/Image00165.gif)\n\n图 12-14： 清单 12-5 中代码的一次运行。\n\n循环预读是一项重要的编程技术。但这还不是全部。在第\
  \ 14 章、第 15 章和第 16 章中，你可以了解其他一些有用的循环技巧。\n\n![tryitout](img/Image00006.jpg) 直面 Java\
  \ 循环，通过这些编程挑战来练习。\n\n#### 大数字\n\n编写一个程序，反复从用户键盘读取数字。当用户输入一个大于 100 的数字时，程序停止循环。\n\
  \n#### 到了吗？\n\n编写一个程序，反复向用户提出同一个问题：`Are we there yet?` 当用户回答大写字母`Y`或小写字母`y`时，程序停止循环。以下是一个示例运行：\n\
  \n```\nAre we there yet? N\nAre we there yet? n\nAre we there yet? N\nAre we there\
  \ yet? N\nAre we there yet? N\nAre we there yet? y\nWhew!\n```\n\n#### 累加\n\n编写一个程序，使用循环反复从键盘读取数字。当用户输入一个负数时，程序停止读取数字。程序报告这些数字的总和，不包括最后一个（负数）数字。\n\
  \n#### 再猜一次\n\n在第 9 章中，你编写了一个猜数字游戏程序。该程序将用户输入的数字与程序随机生成的数字进行比较。如果两个数字相等，用户获胜，否则失败。\n\
  \n按如下方式修改此程序：\n\n*   与原始版本一样，程序只随机生成一次数字，但是……\n*   ……程序反复要求用户猜测，直到用户猜对为止。\n\n####\
  \ 连续两个相同\n\n编写一个程序，反复从用户键盘读取数字。当用户连续两次输入相同的数字时，程序停止循环。以下是程序的一次示例运行：\n\n```\n5\n\
  13\n21\n5\n4\n5\n5\nDone!\n```\n\n第 13 章\n\n## 文件堆叠：应对信息过载\n\n本章内容\n\n![check](img/Image00002.jpg)\
  \ **使用硬盘上的数据**\n\n![check](img/Image00002.jpg) **编写访问硬盘的代码**\n\n![check](img/Image00002.jpg)\
  \ **排查输入/输出行为问题**\n\n考虑以下场景：\n\n*   你是一位企业主，每天处理数百张发票。你将发票数据存储在硬盘上的文件中。你需要定制代码来对发票进行排序和分类。\n\
  *   你是一位天文学家，拥有夜空扫描的数据。当你准备分析某块数据时，你将这块数据加载到计算机的硬盘上。\n*   你是一本畅销自助书的作者。去年的流行趋势叫做“自我镜像法”。今年的热潮是“做你的蛋糕系统”。如果不按照出版商的新规范进行转换，你就无法修改手稿。你需要软件来让这项任务变得可以忍受。\n\
  \n每种情况都需要一个新的计算机程序，每个程序都要从一个大型数据文件中读取。除此之外，每个程序还会创建一个全新的文件，其中包含明亮、闪亮的结果。\n\n在前面的章节中，示例从键盘获取输入，并将输出发送到\
  \ Eclipse 控制台视图。这对于小任务来说没问题，但你不可能让计算机提示你输入每一块夜空数据。对于大问题，你需要大量数据，而存储数据的最佳位置就是计算机的硬盘。\n\
  \n## 运行面向磁盘的程序\n\n为了处理大量数据，你需要用于从磁盘文件读取（和写入）的工具。一提到磁盘文件，有些人的心就开始因恐惧而怦怦直跳。毕竟，磁盘文件是难以捉摸且不可见的。它通过某种神奇的磁过程存储在计算机内部的某个地方。\n\
  \n事实上，从磁盘获取数据与从键盘获取数据非常相似。而将数据打印到磁盘与将数据打印到计算机屏幕也很相似。\n\n![technicalstuff](img/Image00007.jpg)\
  \ 在本书中，将程序的文本输出显示“在计算机屏幕上”意味着在 Eclipse 的控制台视图中显示文本。如果你不使用 Eclipse 而使用其他 IDE（例如 NetBeans\
  \ 或 IntelliJ IDEA），或者你完全不用 IDE 而使用系统的命令窗口，那么对你来说，“在计算机屏幕上”的含义略有不同。请根据需要自行理解。此外，我很清楚有些计算机使用\
  \ SSD 驱动器，内部没有真正的磁盘。因此，像*面向磁盘*和*磁盘文件*这样的术语已经显露出时代的痕迹。但让我们面对现实：“唱片店”不再专注于黑胶唱片，而在美国的度量单位中，12\
  \ 英寸也不再是国王脚的长度。如今的 LCD 屏幕不再需要“保存”。而且，与老式的机械汽车收音机不同，网页上的单选按钮并不标记你最喜欢的电台。\n\n考虑你在前面章节中运行代码时的场景。你在键盘上输入一些内容。程序接收这些内容，然后输出一些自己的内容。程序将这些新内容发送到控制台视图。实际上，数据流从键盘流向计算机内部，然后流向屏幕，如图\
  \ 13-1 所示。\n\n![image](img/Image00166.jpg)\n\n图 13-1： 使用键盘和屏幕。\n\n当然，本章的目标如图 13-2\
  \ 所示。硬盘上有一个包含数据的文件。程序从磁盘文件中获取数据，并输出一些全新的数据。然后程序将新数据发送到硬盘上的另一个文件。实际上，数据流从磁盘文件流向计算机内部，再流向另一个磁盘文件。\n\
  \n![image](img/Image00167.jpg)\n\n图 13-2： 使用磁盘文件。\n\n图 13-1 和图 13-2 中的场景是相似的。事实上，记住以下基本要点会有所帮助：\n\
  \n*   **磁盘文件中的内容与你从键盘输入的内容没有区别。**\n\n\n\n\n如果一个键盘读取程序期望你输入 `19.95 5`，那么对应的磁盘读取程序期望一个包含相同字符\
  \ `19.95 5` 的文件。如果一个键盘读取程序期望你按下回车并输入更多字符，那么对应的磁盘读取程序期望文件中的下一行有更多字符。\n\n*   **磁盘文件中的内容与你从\
  \ Eclipse 控制台视图中看到的内容并无区别。**\n\n    如果一个屏幕打印程序显示数字 `99.75`，那么对应的磁盘写入程序会将数字 `99.75`\
  \ 写入文件。如果一个屏幕打印程序将光标移到下一行，那么对应的磁盘写入程序会在文件中创建新的一行。\n\n如果你难以想象磁盘文件中有什么内容，只需想象你会在键盘上输入或会在电脑屏幕上（即\
  \ Eclipse 控制台视图）看到的文本。同样的文本可以出现在你磁盘上的文件中。\n\n### 示例程序\n\n清单 13-1 包含一个键盘/屏幕程序。该程序将单价乘以数量得到总价。代码的运行结果如图\
  \ 13-3 所示。\n\n![image](img/Image00168.gif)\n\n图 13-3: 从键盘读取；写入屏幕。\n\n清单 13-1 使用键盘和屏幕\n\
  \n```\nimport java.util.Scanner;\n\nclass ComputeTotal {\n  public static void main(String\
  \ args[]) {\n    Scanner keyboard = new Scanner(System.in);\n    double unitPrice,\
  \ total;\n    int quantity;\n\n    unitPrice = keyboard.nextDouble();\n    quantity\
  \ = keyboard.nextInt();\n    total = unitPrice * quantity;\n\n    System.out.println(total);\n\
  \n    keyboard.close();\n  }\n}\n```\n\n![remember](img/Image00005.jpg) 分组分隔符因国家而异。图\
  \ 13-3 所示的运行结果在世界各地几乎都适用。但如果单价是十九点九五，你在某些国家输入 `19.95`（带点），而在其他国家输入 `19,95`（带逗号）。安装计算机操作系统时，你会告诉它你所在的国家。Java\
  \ 程序会访问这些信息，并用它来自定义 `nextDouble` 方法的工作方式。\n\n目标是编写一个类似 清单 13-1 的程序。但这次新程序不是与键盘和屏幕交互，而是与你的硬盘驱动器交互。新程序从硬盘读取单价和数量，并将总价写回硬盘。\n\
  \nJava 的 API 提供了与硬盘交互所需的一切。一个很好的例子在 清单 13-2 中。\n\n清单 13-2 使用输入和输出文件\n\n```\nimport\
  \ java.util.Scanner;\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
  import java.io.PrintStream;\n\nclass ReadAndWrite {\n  public static void main(String\
  \ args[]) throws FileNotFoundException {\n    Scanner diskScanner = new Scanner(new\
  \ File(\"rawData.txt\"));\n    PrintStream diskWriter = new PrintStream(\"cookedData.txt\"\
  );\n    double unitPrice, total;\n    int quantity;\n\n    unitPrice = diskScanner.nextDouble();\n\
  \    quantity = diskScanner.nextInt();\n    total = unitPrice * quantity;\n\n  \
  \  diskWriter.println(total);\n\n    diskScanner.close();\n    diskWriter.close();\n\
  \  }\n}\n```\n\n关于 `rawData.txt` 文件（其名称出现在 清单 13-2 中）的维护和使用指南，请参阅后面的“创建输入文件”部分。\n\
  \n### 编写操作硬盘的代码\n\n*“我 _____（打印你的名字）_____ 同意每月支付 $______，在每月的第 ___ 天。”*\n\n填空。这就是你需要做的全部。从磁盘读取输入也可以采用同样的方式。只需填写\
  \ 清单 13-3 中的空白。\n\n清单 13-3 从磁盘文件读取数据的模板\n\n```\n/*\n * Before Eclipse can compile\
  \ this code,\n * you must fill in the blanks.\n */\nimport java.util.Scanner;\n\
  import java.io.File;\nimport java.io.FileNotFoundException;\n\nclass ___________\
  \ {\n  public static void main(String args[]) throws FileNotFoundException {\n \
  \   Scanner diskScanner = new Scanner(new File(\"_________\"));\n    ______ = diskScanner.nextInt();\n\
  \    ______ = diskScanner.nextDouble();\n    ______ = diskScanner.nextLine();\n\
  \    ______ = diskScanner.findWithinHorizon(\".\",0).charAt(0);\n    // Etc.\n \
  \   diskScanner.close();\n  }\n}\n```\n\n要使用 清单 13-3，请为你的类取一个名字。将该名字插入第一个空白处。在第二个空白处（引号之间）输入输入文件的名称。然后，要从输入文件中读取一个整数，调用\
  \ `diskScanner.nextInt`。要读取一个带小数点的数字，调用 `diskScanner.nextDouble`。你可以调用 第 5 章 的 表\
  \ 5-1 中的任何 `Scanner` 方法——这些方法与从键盘获取按键时调用的方法相同。\n\n清单 13-3 中的内容不是一个完整的程序。相反，它是一个*代码模板*——一段半成品的代码，留有空位供你填写。\n\
  \n使用 清单 13-3 中的模板，你可以从磁盘文件输入数据。使用类似的模板，你可以将输出写入文件。该模板在 清单 13-4 中。\n\n清单 13-4 将数据写入磁盘文件的模板\n\
  \n```\n/*\n * Before Eclipse can compile this code,\n * you must fill in the blanks.\n\
  \ */\nimport java.io.File;\nimport java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\
  \nclass ___________ {\n  public static void main(String args[]) throws FileNotFoundException\
  \ {\n    PrintStream diskWriter = new PrintStream(\"_________\");\n    diskWriter.print(_____);\n\
  \    diskWriter.println(_____);\n    // Etc.\n    diskWriter.close();\n  }\n}\n\
  ```\n\n要使用 清单 13-4，请将你的类名插入第一个空白处。在引号之间的空白处输入输出文件的名称。然后，要将一行的一部分写入输出文件，调用 `diskWriter.print`。要将一行的剩余部分写入输出文件，调用\
  \ `diskWriter.println`。\n\n![tip](img/Image00003.jpg) Eclipse 有一个内置功能，用于创建和插入代码模板。要开始使用\
  \ Eclipse 模板，请选择 Window ⇒ Preferences（在 Windows 中）或 Eclipse ⇒ Preferences（在 Mac\
  \ 上）。在出现的 Preferences 对话框中，选择 Java ⇒ Editor ⇒ Templates。创建新模板并不简单。但如果你稍微摸索一下，就能完成很多工作。\n\
  \n如果你的程序从一个磁盘文件获取输入，并将输出写入另一个磁盘文件，请将 清单 13-3 和 13-4 中的内容结合起来。这样做之后，你会得到一个类似 清单 13-2\
  \ 的程序。\n\n### 运行示例程序\n\n测试 清单 13-2 中的代码需要三个步骤。以下是这三个步骤的概述：\n\n1.  **创建** `rawData.txt`\
  \ **文件。**\n\n2.  **运行** **清单 13-2** **中的代码。**\n\n3.  **查看** `cookedData.txt` **文件的内容。**\n\
  \n接下来的几节将详细介绍每个步骤。\n\n#### 创建输入文件\n\n你可以使用任何普通的文本编辑器为 清单 13-2 中的代码创建输入文件。在本节中，我将向你展示如何使用\
  \ Eclipse 的内置编辑器。\n\n创建输入文件：\n\n1.  **在 Eclipse 的包资源管理器中选择一个项目。**\n\n    在本示例中，选择\
  \ `13-02` 项目（包含 清单 13-2 中代码的项目）。\n\n\n\n\n![remember](img/Image00005.jpg) 在包资源管理器中，选择一个标签为项目名称的分支。（选择\
  \ `13-02` 分支以运行清单 13-2 中的代码。）不要选择项目内的某个条目。（例如，不要选择 `src` 分支或 `(default package)`\
  \ 分支。）\n\n2. **在 Eclipse 的主菜单中，选择 File ⇒ New ⇒ File。**\n\n   此时会打开 Eclipse 的“新建文件”对话框。\n\
  \n3. **在“文件名”字段中，输入新数据文件的名称。**\n\n   你可以输入计算机认为是有效文件名的任何名称。对于本节示例，我使用了名称 `rawData.txt`，但其他名称如\
  \ `rawData.dat`、`rawData` 和 `raw123.01.dataFile` 也可以。我尽量避免使用麻烦的名称（包括简短无意义的名称和包含空格的名称），但你选择的名称完全取决于你自己（以及你的计算机操作系统、老板的突发奇想和客户的要求）。\n\
  \n4. **点击“完成”。**\n\n   文件名会出现在 Eclipse 的包资源管理器中。一个空编辑器（其选项卡上显示新文件的名称）会出现在 Eclipse\
  \ 的编辑区域。\n\n5. **在编辑器中输入文本。**\n\n   为了创建本节示例，我输入了文本 `19.95 5`，如图 13-4 所示。要创建你自己的示例，请输入程序运行时所需的任何文本。\n\
  \n![image](img/Image00169.jpg)\n\n图 13-4: 编辑输入文件。\n\n![warning](img/Image00004.jpg)\
  \ 本节的步骤适用于使用 Eclipse 创建输入文件的情况。你也可以使用其他程序创建输入文件，例如 Windows 记事本或 Macintosh 的 TextEdit。但这样做时，你必须注意文件格式和文件扩展名。例如，要使用\
  \ Windows 记事本创建名为 `raw123.01.dataFile` 的文件，请在“另存为”对话框的“文件名”字段中输入 `\"` `raw123.01.dataFile`\
  \ `\"`（带引号）。如果不加引号，记事本可能会在文件名后添加 `.txt`（将 `raw123.01.dataFile` 变成 `raw123.01.dataFile.txt`）。类似的问题也适用于\
  \ Macintosh 的 TextEdit 程序。默认情况下，TextEdit 会为每个新文件添加 `.rtf` 扩展名。要覆盖特定文件的 `.rtf` 默认设置，请在保存文件前选择\
  \ Format ⇒ Make Plain Text。然后，保存文件时，TextEdit 会提供在文件名后添加 `.txt` 扩展名的选项。在“另存为”对话框中，如果你不希望文件名以\
  \ `.txt` 结尾，请取消选中“如果未提供扩展名，则使用“.txt””复选框。\n\n#### 运行代码\n\n要让 Eclipse 运行代码，请执行与其他任何\
  \ Java 程序相同的操作。选择要运行的项目（本例中为项目 `13-02`）。然后选择 Run ⇒ Run As ⇒ Java Application。\n\n\
  当你运行清单 13-2 中的程序时，Eclipse 的控制台视图中不会显示任何文本。这种完全没有可见输出的情况会让一些人感到不安。事实上，像清单 13-2 中的程序完全在后台工作。该程序没有从键盘读取的语句，也没有向屏幕打印的语句。因此，如果你的硬盘驱动器声音很大，当你选择\
  \ Run ⇒ Run As ⇒ Java Application 时，可能会听到轻微的吱吱声，但你不会输入任何程序输入，也不会看到任何程序输出。\n\n该程序将其所有输出发送到硬盘上的一个文件中。如何查看文件内容呢？\n\
  \n#### 查看输出文件\n\n要查看清单 13-2 中程序的输出，请执行以下步骤：\n\n1. **在项目资源管理器中，选择** `13-02` **项目分支。**\n\
  \n2. **在主菜单中，选择 File ⇒ Refresh。**\n\n3. **在项目资源管理器中，展开** `13-02` **项目分支。**\n\n \
  \  一个名为 `cookedData.txt` 的新文件会出现在包资源管理器树中（位于 `13-02` 项目内）。\n\n4. **双击包资源管理器树中的**\
  \ `cookedData.txt` **分支。**\n\n   `cookedData.txt` 的内容会显示在 Eclipse 编辑器中。（参见图 13-5。）\n\
  \n![image](img/Image00170.jpg)\n\n图 13-5: 查看输出文件。\n\n### 磁盘文件问题故障排除\n\n当你运行清单 13-2\
  \ 中的代码时，计算机会执行 `new Scanner(new File(\"rawData.txt\"))`。如果 Java 虚拟机找不到 `rawData.txt`\
  \ 文件，你会看到类似图 13-6 所示的消息。这个错误消息可能令人沮丧。在很多情况下，你非常清楚硬盘上有一个 `rawData.txt` 文件。愚蠢的计算机就是找不到它。\n\
  \n![image](img/Image00171.jpg)\n\n图 13-6: 计算机找不到你的文件。\n\n没有快速、万无一失的方法来解决这个问题。但你应该始终首先检查以下事项：\n\
  \n* **再次检查是否存在名为** `rawData.txt` **的文件。**\n\n   打开 Windows 文件资源管理器或 Macintosh 的\
  \ Finder，查找具有该名称的文件。\n\n   ![tip](img/Image00003.jpg) 文件资源管理器和 Finder 中显示的文件名可能具有误导性。你可能会看到名称\
  \ `rawData`，而文件的真实名称是 `rawData.txt`。要一劳永逸地解决这个问题，请参考第 2 章中的“那些烦人的文件扩展名”边栏。\n\n*\
  \ **检查文件名的拼写。**\n\n   确保程序中的名称与硬盘上文件的名称完全一致。即使一个字母放错位置，也可能导致计算机找不到文件。\n\n* **如果你使用\
  \ Linux（或除 Mac OS X 之外的 UNIX 变体），请检查文件名的大小写。**\n\n   在 Linux 和许多 UNIX 版本中，大小写的差异可能会让计算机感到困惑。\n\
  \n* **检查文件是否位于正确的目录中。**\n\n   当然，你有一个名为 `rawData.txt` 的文件。但不要指望你的 Java 程序会在硬盘上的每个文件夹中查找该文件。你怎么知道哪个文件夹应该存放像\
  \ `rawData.txt` 这样的文件呢？\n\n   工作原理如下：每个 Eclipse 项目在计算机硬盘上都有自己的文件夹。你在图 13-5 中看到了\
  \ `13-02` 项目文件夹及其 `src` 子文件夹。但在图 13-7 中，Windows 文件资源管理器显示了 `13-02` 文件夹、其 `src` 子文件夹以及其他名为\
  \ `.settings` 和 `bin` 的子文件夹。（Mac 用户可以在 Finder 窗口中看到相同的子文件夹。）\n\n   `src`、`bin` 和\
  \ `.settings` 文件夹包含它们自己的文件。但在图 13-7 中，`rawData.txt` 和 `cookedData.txt` 文件直接位于 `13-02`\
  \ 项目文件夹内。换句话说，`rawData.txt` 和 `cookedData.txt` 文件位于 `13-02` 项目文件夹的根目录下。\n\n   ![remember](img/Image00005.jpg)\
  \ 当你运行本节示例时，`rawData.txt` 文件应位于硬盘上 `13-02` 项目文件夹的根目录下。这就是为什么在前面“创建输入文件”部分的步骤 1 中，我提醒你选择\
  \ `13-02` 项目文件夹，而不是项目的 `src` 子文件夹。\n\n   图 13-7 显示了输入和输出文件位于其 Eclipse 项目的根目录下。但一般来说，文件位置可能很棘手，尤其是当你从\
