  \     }\n    }\n}\n```\n\n### 从方法获取值\n\n假设你让朋友去买杂货。你以方法调用的形式提出杂货请求。你发出如下调用：\n\n\
  `goToTheSupermarketAndBuySome(bread);`\n\n`goToTheSupermarketAndBuySome(bananas);`\n\
  \n括号里的东西就是参数。每次调用 `goToTheSupermarketAndBuySome` 方法时，你都会在方法的参数列表中放入不同的值。\n\n那么，当你的朋友从超市回来时会发生什么？“这是你让我买的面包，”你的朋友说。作为执行你意愿的结果，你的朋友会返回一些东西给你。你发起了一个方法调用，而该方法返回了信息（或者更确切地说，该方法返回了一些食物）。\n\
  \n返回给你的东西称为方法的*返回值*，而返回的东西的类型称为方法的*返回类型*。\n\n### 一个例子\n\n要了解返回值和返回类型在实际 Java 程序中如何工作，请查看\
  \ 清单 19-10 和 19-11 中的代码。\n\n清单 19-10 一个返回值的方法\n\n```\nimport java.text.NumberFormat;\n\
  import static java.lang.System.out;\nclass GoodAccount {\n    String lastName;\n\
  \    int id;\n    double balance;\n    double getInterest(double rate) {\n     \
  \   double interest;\n        out.print(\"Adding \");\n        out.print(rate);\n\
  \        out.println(\" percent…\");\n        interest = balance * (rate / 100.0);\n\
  \        return interest;\n    }\n    void display() {\n        NumberFormat currency\
  \ = NumberFormat.getCurrencyInstance();\n        out.print(\"The account with last\
  \ name \");\n        out.print(lastName);\n        out.print(\" and ID number \"\
  );\n        out.print(id);\n        out.print(\" has balance \");\n        out.println(currency.format(balance));\n\
