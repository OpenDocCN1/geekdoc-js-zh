  \ 这里有问题\n\n以下代码有什么问题？单词 `static` 的含义如何产生影响？添加另一个 `static` 关键字能解决问题吗？为什么？\n\n```java\n\
  import java.util.Scanner;\n\npublic class Main {\n    Scanner keyboard = new Scanner(System.in);\n\
  \n    public static void main(String[] args) {\n        int numberOfCats = keyboard.nextInt();\n\
  \        System.out.println(numberOfCats);\n    }\n}\n```\n\n#### 事实如此\n\n在以下代码中，为什么字段是静态的？\n\
  \n```java\nclass Facts {\n    static int numberOfPlanets = 8;\n    static int numberOfMoons\
  \ = 1;\n    static int numberOfContinents = 7;\n    static int numberOfOceans =\
  \ 5;\n}\n```\n\n你可以通过在每个字段声明中添加 Java 的 `final` 关键字来使 `Facts` 类变得更好：\n\n```java\n\
  class Facts {\n    static final int numberOfPlanets = 8;\n    static final int numberOfMoons\
  \ = 1;\n    static final int numberOfContinents = 7;\n    static final int numberOfOceans\
  \ = 5;\n}\n```\n\n`final` 变量的值不能被更改。因此，在 `main` 方法中，代码\n\n```java\nSystem.out.println(BetterFacts.numberOfPlanets);\n\
  ```\n\n是合法的，但代码\n\n```java\nBetterFacts.numberOfPlanets = 9; // Bad code\n```\n\n\
  是不合法的。\n\n第 19 章\n\n## 创建新的 Java 方法\n\n本章内容包括\n\n![check](img/Image00002.jpg) **编写处理现有值的方法**\n\
  \n![check](img/Image00002.jpg) **构建修改现有值的方法**\n\n![check](img/Image00002.jpg) **创建返回新值的方法**\n\
  \n在第 3 章和第 4 章中，我介绍了 Java 方法。我向你展示了如何创建 `main` 方法以及如何调用 `System.out.println` 方法。从那些章节到本章之间，我很少提及方法。在第\
  \ 18 章中，我介绍了一堆供你调用的新方法，但这只是故事的一半。\n\n本章完成了这个循环。在本章中，你将创建自己的 Java 方法——不是你一直使用的那个老掉牙的\
  \ `main` 方法，而是一些新的、强大的 Java 方法。\n\n### 在类中定义方法\n\n在第 18 章的图 18-6 中，引入了一个有趣的概念——这个概念是面向对象编程的核心。每个\
  \ Java 字符串都有自己的 `equals` 方法。也就是说，每个字符串内部都内置了将自己与其他字符串进行比较的功能。这是一个重要的点。当你进行面向对象编程时，你将数据和功能捆绑到一个称为类的块中。只需记住巴里在第\
  \ 17 章中不朽的话：\n\n> 类……描述了打算如何组合*和使用*数据片段。\n\n为什么这些话如此重要？它们之所以重要，是因为在面向对象编程中，数据块对自己负责。通过面向对象编程，你需要了解的关于字符串的一切都位于文件\
  \ `String.java` 中。因此，如果人们在使用字符串时遇到问题，他们就知道去哪里查找所有代码。这太棒了！\n\n事情是这样的：对象包含方法。第 18\
  \ 章向你展示了如何使用对象的方法，而本章将向你展示如何*创建*对象的方法。\n\n### 创建方法\n\n想象一个包含三个账户信息的表格。（如果你难以想象这样的东西，只需看看图\
  \ 19-1。）在图中，每个账户都有一个姓氏、一个识别号和一个余额。此外（这里是重点），每个账户都知道如何在屏幕上显示自己。表格的每一行都有自己的 `display`\
  \ 方法副本。\n\n![image](img/Image00227.gif)\n\n图 19-1: 账户表格。\n\n图 19-1 中的姓氏可能看起来很奇怪。这是因为我是随机生成表格数据的。每个姓氏是三个字母的随意组合：一个大写字母后跟两个小写字母。\n\
  \n![technicalstuff](img/Image00007.jpg) 虽然看起来奇怪，但随机生成账户值是常见做法。当你编写新代码时，你想测试代码以确定它是否运行正确。你可以自己编造数据（使用像\
  \ `\"Smith\"`、`0000` 和 `1000.00` 这样的值）。但为了让你的代码接受具有挑战性的考验，你应该使用一些意想不到的值。如果你有一些来自真实案例研究的值，你应该使用它们。但如果你没有真实数据，随机生成的值很容易创建。\n\
  \n要了解我如何随机生成三个字母的名字，请参阅本章的边栏“随机生成单词”。\n\n\n\n\n我需要一些代码来实现图 19-1 中的想法。幸运的是，我在清单 19-1\
  \ 中有一些代码。\n\n清单 19-1 一个账户类\n\n```\nimport java.text.NumberFormat;\nimport static\
  \ java.lang.System.out;\n\nclass Account {\n    String lastName;\n    int id;\n\
