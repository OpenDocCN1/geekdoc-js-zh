  \n![tryitout](img/Image00006.jpg) 编写计算机代码是一项活动，学习活动的最佳方式就是练习。这就是为什么我为你创建了一些尝试的内容，以巩固你的知识。其中许多是建立信心的，但有些则更具挑战性。当你刚开始实践时，你会发现各种问题、困惑和障碍，这些在开始阅读材料时并未出现。但这是好事。坚持下去！不要气馁。或者，如果你感到沮丧，请访问本书的网站（[`www.allmycode.com/BeginProg`](http://www.allmycode.com/BeginProg)）获取提示和解决方案。\n\
