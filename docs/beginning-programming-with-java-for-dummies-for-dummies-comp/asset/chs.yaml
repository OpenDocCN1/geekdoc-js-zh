  \ [`www.java.net`](http://www.java.net)。\n\n### 寻找新闻、评论和示例代码\n\n如需阅读专家撰写的文章，请访问\
  \ InfoQ（[`www.infoq.com`](http://www.infoq.com)）和 TheServerSide（[`www.theserverside.com`](http://www.theserverside.com/)）。\n\
  \n如需参与所有人的讨论（包括许多非常聪明的人），请访问 JavaRanch（[`www.javaranch.com`](http://www.javaranch.com)）。\n\
  \n### 寻找 Java 相关工作\n\n如需查看职位列表，请访问 Dice（[`www.dice.com`](http://www.dice.com/)）。\n\
  \n### 有问题吗？\n\n如果你遇到困难需要帮助，可以在 Stack Overflow（[`stackoverflow.com`](http://stackoverflow.com/)）上搜索答案或提出问题。\n\
  \n别忘了：如果你对本书中读到的任何内容有疑问，可以发送电子邮件至 `BeginProg@allmycode.com`，在 [`www.facebook.com/allmycode`](http://www.facebook.com/allmycode)\
  \ 上发帖，或通过 [`@allmycode`](http://www.twitter.com/allmycode) 向 Burd 发推文。\n\n第 22 章\n\
  \n## Java API 中的十个实用类\n\n本章内容\n\n![check](img/Image00002.jpg) **了解更多关于类的信息**\n\n\
  ![check](img/Image00002.jpg) **发现其他有用的类**\n\n我为自己感到骄傲。我用了不到 30 个 Java API 中的类，就写了大约\
  \ 400 页关于 Java 的内容。标准 API 有数千个类，所以我觉得自己做得相当不错。\n\n无论如何，为了帮助你熟悉一些我最喜欢的 Java API 类，本章提供了一个简短的列表。此列表中的某些类在本书的示例中多次出现。其他类则非常有用，以至于我不得不将它们收录进来。\n\
  \n有关本章中类的更多信息，请查看 Java 的在线 API 文档：[`http://docs.oracle.com/javase/8/docs/api`](http://docs.oracle.com/javase/8/docs/api)。\n\
  \n### `ArrayList`\n\n第 16 章 介绍了数组。这很好，但在任何编程语言中，数组都有其局限性。例如，一个大小为 100 的数组。如果你突然需要存储第\
  \ 101 个值，那就完全没辙了。如果不重写一些代码，就无法更改数组的大小。向数组中插入值是另一个问题。要将 `\"Tim\"` 按字母顺序插入到 `\"Thom\"\
  ` 和 `\"Tom\"` 之间，你可能需要移动数千个 `\"Tyler\"`、`\"Uriah\"` 和 `\"Victor\"` 的名字来腾出空间。\n\n\
  但 Java 有一个 `ArrayList` 类。`ArrayList` 类似于数组，不同之处在于 `ArrayList` 对象可以根据需要增长和缩小。你还可以使用\
  \ `ArrayList` 类的 `add` 方法轻松插入新值。`ArrayList` 对象非常有用，因为它们能完成许多数组无法做到的好事。\n\n### `File`\n\
  \n说到实用的 Java 类！`File` 类能完成许多本书示例中未包含的功能。`canRead` 方法告诉你是否可以从文件中读取。`canWrite` 方法告诉你是否可以写入文件。调用\
  \ `setReadOnly` 方法可确保你不会意外写入文件。`deleteOnExit` 方法会删除文件，但只有在程序停止运行后才会执行。`exists` 方法检查你是否拥有某个特定文件。`isHidden`、`lastModified`\
  \ 和 `length` 方法能提供关于文件的更多信息。你甚至可以通过调用 `mkdir` 方法创建新目录。面对现实吧：这个 `File` 类功能强大！\n\n\
  ### `Integer`\n\n第 18 章 描述了 `Integer` 类及其 `parseInt` 方法。`Integer` 类还有许多其他功能，在处理\
  \ `int` 值时非常有用。例如，`Integer.MAX_VALUE` 代表数字 `2147483647`。这是 `int` 变量可以存储的最大值。（参见第\
  \ 7 章。）表达式 `Integer.MIN_VALUE` 代表数字 `–2147483648`（`int` 变量可以存储的最小值）。调用 `Integer.toBinaryString`\
  \ 会接受一个 `int` 并返回其二进制（基数为 2）表示。而 `Integer.toBinaryString` 对基数为 2 所做的处理，`Integer.toHexString`\
  \ 对基数为 16（十六进制）同样适用。\n\n### `JFrame`\n\n第 20 章 有一个 `JFrame` 示例。`JFrame` 可以作为应用程序在屏幕上显示的起点。`JFrame`\
  \ 就像一个窗口，因此你可以在 `JFrame` 上放置按钮、文本字段和其他有用的控件。在第 20 章中，我将一张图片放在了 `JFrame` 上。\n\n`JFrame`\
  \ 有几种不同的布局。例如，*边界布局*将 `JFrame` 分为五个区域：`NORTH`、`SOUTH`、`EAST`、`WEST` 和 `CENTER` 区域。`CENTER`\
  \ 区域中的项目通常是最大的，它是 `JFrame` 的核心。其他边界布局区域中的项目位于 `JFrame` 的四条边上。\n\n使用*网格布局*，你可以将项目放入表格单元格中；使用*流式布局*，你可以将项目一个接一个地排成一行。\n\
  \n### `JOptionPane`\n\n要快速创建简单的图形用户界面，可以使用 `JOptionPane`。以下是一些代码：\n\n```\nString\
  \ word = JOptionPane.showInputDialog(\"Enter a word\");\nJOptionPane.showMessageDialog(null,\
  \ word);\nString string = JOptionPane.showInputDialog(\"Enter an int value\");\n\
  int number = Integer.parseInt(string);\nnumber++;\nJOptionPane.showMessageDialog(null,\
  \ \"One more is \" + number);\n```\n\n运行这段代码时，你会看到图 22-1 到图 22-4 中的对话框。\n\n![image](img/Image00258.jpg)\n\
  \n图 22-1： 显示输入对话框。\n\n![image](img/Image00259.jpg)\n\n图 22-2：显示消息对话框。\n\n![image](img/Image00260.jpg)\n\
  \n图 22-3：显示另一个输入对话框。\n\n![image](img/Image00261.jpg)\n\n图 22-4： 显示另一个消息对话框。\n\n\
  ### `Math`\n\n你有数字需要处理吗？你用电脑进行复杂的计算吗？如果是这样，试试 Java 的 `Math` 类。（这是一段代码，而不是坐下来听代数课的地方。）`Math`\
  \ 类处理 π、*e*、对数、三角函数、平方根以及所有其他让大多数人感到毛骨悚然的数学内容。\n\n### `NumberFormat`\n\n第 18 章 有一节关于\
  \ `NumberFormat.getCurrencyInstance` 方法的内容。使用此方法，你可以将 `20.338500000000003` 转换为 `$20.34`。如果你不在美国，或者你的公司向全球销售产品，你可以使用\
  \ Java 的 `Locale` 来增强你的货币实例。例如，使用 `euro = NumberFormat.getCurrencyInstance(Locale.FRANCE)`，调用\
  \ `euro.format(3)` 会返回 `3,00 €` 而不是 `$3.00`。\n\n`NumberFormat` 类还有用于显示非货币金额的方法。例如，你可以显示带或不带逗号的数字，带或不带前导零，以及小数点后任意位数的数字。\n\
  \n### `Scanner`\n\nJava 的 `Scanner` 类能做的远不止本书示例中的那些。与 `NumberFormat` 类一样，`Scanner`\
  \ 可以处理来自不同区域设置的数字。例如，要输入 `3,5` 并使其表示“三又二分之一”，你可以输入 `myScanner.useLocale(Locale.FRANCE)`。你还可以告诉\
  \ `Scanner` 跳过某些输入字符串，或使用除 10 以外的数字基数。总而言之，`Scanner` 类非常灵活。\n\n### `String`\n\n\n\
  \n\n\n第 18 章 探讨了 Java 的 `String` 类。该章节详细描述了一个名为 `equals` 的方法。`String` 类还有许多其他有用的方法。例如，使用\
  \ `length` 方法，你可以获取字符串中的字符数。使用 `replaceAll`，你可以轻松地将字符串中出现的所有 `\"my fault\"` 替换为\
  \ `\"your fault\"`。而使用 `compareTo`，你可以按字母顺序对字符串进行排序。\n\n### 系统\n\n你可能对 `System.in`\
  \ 和 `System.out` 很熟悉。但 `System.getProperty` 呢？`getProperty` 方法可以揭示关于你计算机的各种信息。你可以找到的信息包括：操作系统的名称、处理器的架构、Java\
  \ 虚拟机版本、类路径、用户名，以及你的系统是使用反斜杠还是正斜杠来分隔文件夹名称。当然，你可能已经知道所有这些信息。但你的 Java 代码是否需要动态发现这些信息呢？\n\
  \n# 关于作者\n\n**Barry Burd 博士** 在罗格斯大学获得计算机科学硕士学位，并在伊利诺伊大学获得数学博士学位。在伊利诺伊州尚佩恩-厄巴纳担任助教期间，他曾五次入选全校范围的“学生评选优秀教师”名单。\n\
  \n自 1980 年以来，Burd 博士一直在新泽西州麦迪逊的德鲁大学数学与计算机科学系担任教授。他曾在美国、欧洲、澳大利亚和亚洲的会议上发表演讲。他主持关于软件及其他技术主题的播客和视频。他是许多文章和书籍的作者，包括《Java\
  \ For Dummies》、《Java Programming for Android Developers For Dummies》和《Android Application\
  \ Development All-in-One For Dummies》，这些书均由 Wiley 出版。\n\nBurd 博士与他的妻子（结婚 *n* 年，其中\
  \ *n* > 35）居住在新泽西州麦迪逊。作为一名狂热的室内爱好者，Burd 博士喜欢睡觉、聊天和吃饭。\n\n# 献词\n\n献给 Harriet、Sam\
