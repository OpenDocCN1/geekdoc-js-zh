  \n为了帮助你适应`NullPointerException`消息，故意生成一个。在 JShell 窗口中依次输入以下两行：\n\n`String name =\
  \ null;`\n\n`System.out.println(name.length());`\n\n## 第 15 章：老调重弹\n\n### 本章内容\n\
  \n![勾选](img/Image00002.jpg) **创建重复动作**\n\n![勾选](img/Image00002.jpg) **改进嵌套技巧**\n\
  \n![勾选](img/Image00002.jpg) **坚持用户提供有效响应**\n\n![勾选](img/Image00002.jpg) **遍历枚举值**\n\
  \n我清楚地记得——每次去埃德娜姑妈家时那种恐惧感。她是一位和蔼的老妇人，本意是好的。但去她家拜访总是令人痛苦。\n\n首先，我们会坐在客厅里谈论其他亲戚。只要我能听懂大家在说什么，那还好。有时闲聊会涉及成人话题，我就会感到无聊。\n\
  \n家庭闲聊结束后，父亲会帮埃德娜姑妈处理账单。这看起来很有趣，因为埃德娜姑妈有一种遗传性的家族毛病：和我以及许多祖先一样，埃德娜姑妈无论如何都理不清文件。就好像文件上有过敏原，让埃德娜姑妈浑身不自在。在付了十分钟有用的账单后，父亲会发现一个错误、一个不正确的总计，或者账本中其他需要关注的地方。他会问埃德娜姑妈，而她只是耸耸肩。父亲在试图找出问题时变得焦躁不安，而埃德娜姑妈则翻着白眼，带着无知满足的微笑。这真是绝妙的娱乐。\n\
  \n然后，付完账单后，我们会坐下来吃晚饭。这时我就会想起为什么我害怕这些拜访。晚餐令人难以忍受。埃德娜姑妈信奉弗莱彻主义——一种健康运动，其追随者每口食物咀嚼\
  \ 100 次。更虔诚的追随者会使用一张图表，每种食物的咀嚼次数不同。任何食物的最低咀嚼次数是 32 次——嘴里每颗牙齿一次。这样做的人说他们在“弗莱彻化”。\n\
  \n爸爸妈妈觉得整个弗莱彻主义很愚蠢，但他们尊重埃德娜姑妈，认为应该迁就她这个年纪的人，而不是违抗。至于我，我觉得自己会因为单调而爆炸。每顿饭都像永远持续。每一口都是煎熬。我仍然记得我的咒语——那些我不由自主对自己说的话：\n\
  \n*   `到目前为止我已经咀嚼了 0 次。`\n\n*   `我已经咀嚼了 100 次吗？如果没有，那么`\n\n*   `咀嚼！`\n\n*   `将咀嚼次数加\
  \ 1。`\n\n*   `回到“我已经咀嚼了吗”以检查是否完成。`\n\n## 重复执行一定次数的语句（Java `for` 语句）\n\n生活中充满了计数循环的例子。而计算机编程反映了生活（……还是反过来？）。当你告诉计算机做什么时，你常常是在告诉计算机打印三行、处理十个账户、拨打一百万个电话号码，等等。由于计数循环在编程中很常见，编程语言的创造者专门为这类循环开发了语句。在\
  \ Java 中，重复执行某件事一定次数的语句称为`for`语句。`for`语句的一个例子见清单 15-1。\n\n清单 15-1 霍勒斯·弗莱彻的报复\n\n\
  ```java\nimport static java.lang.System.out;\n\nclass AuntEdnaSettlesForTen {\n\
  \    public static void main(String args[]) {\n        for (int count = 0; count\
  \ < 10; count++) {\n            out.print(\"I’ve chewed \");\n            out.print(count);\n\
  \            out.println(\" time(s).\");\n        }\n        out.println(\"10 times!\
  \ Hooray!\");\n        out.println(\"I can swallow!\");\n    }\n}\n```\n\n图 15-1\
  \ 展示了运行清单 15-1 中程序的结果：\n\n*   清单 15-1 中的`for`语句首先将`count`变量设置为 0。\n\n*   然后`for`语句测试确保`count`小于\
  \ 10（显然是的）。\n\n*   接着`for`语句继续执行花括号内的打印语句。在这个早期阶段，计算机打印`I’ve chewed 0 time(s)`。\n\
  \n*   然后`for`语句执行`count++`——这是`for`语句括号内的最后一项。这个最后动作将`count`的值加 1。\n\n![图片](img/Image00184.gif)\n\
  \n图 15-1: 咀嚼十次。\n\n这结束了清单 15-1 中`for`语句的第一次迭代。当然，这个循环不止一次迭代：\n\n*   现在`count`等于\
  \ 1，`for`语句再次检查确保`count`小于 10。（是的，1 小于 10。）\n\n*   因为测试通过，`for`语句再次进入花括号内的语句，并在屏幕上打印`I’ve\
  \ chewed 1 time(s)`。\n\n*   然后`for`语句执行括号内的最后一项`count++`。该语句将`count`的值加 1，使`count`增加到\
  \ 2。\n\n以此类推。整个过程不断重复，直到十次迭代后，`count`的值最终达到 10。此时，检查`count`是否小于 10 的条件失败，循环执行结束。计算机跳转到`for`语句之后紧接着的任何语句。在清单\
  \ 15-1 中，计算机打印`10 times! Hooray! I can swallow!`。整个过程如图 15-2 所示。\n\n![图片](img/Image00185.gif)\n\
  \n图 15-2: 清单 15-1 中`for`循环的动作。\n\n### `for`语句的结构\n\n一个典型的`for`语句如下所示：\n\n```java\n\
  for (初始化; 条件; 更新) {\n    语句\n}\n```\n\n在关键字`for`之后，你在括号内放入三项内容：*初始化*、*条件*和*更新*。\n\
  \n括号内的每一项都扮演着各自独特的角色：\n\n*   **初始化：** 初始化只执行一次，当程序运行首次到达`for`语句时执行。\n\n*   **条件：**\
  \ 条件被多次测试（在每次迭代开始时）。\n\n*   **更新：** 更新也被多次求值（在每次迭代结束时）。\n\n如果这有助于理解，可以想象循环的文本被重新排列了：\n\
  \n\n\n\n\n`//This is` `NOT` `real code`\n\n```\nint count = 0\nfor count < 0 {\n\
  out.print(\"I’ve chewed \");\nout.print(count);\nout.println(\" time(s).\");\ncount++;\n\
  }\n```\n\n你不能用这种方式编写真正的 `for` 语句。（编译器会把这样的代码直接扔进垃圾桶。）即便如此，这仍然是 `for` 语句各部分执行的顺序。\n\
  \n![warning](img/Image00004.jpg) `for` 语句的第一行（`for` 关键字后跟括号内的内容）并不是一个完整的语句。因此，你几乎不会在括号后面加分号。如果你犯了错误，输入了分号，就像这样：\n\
  \n```\n// 不要这样做：\nfor (int count = 0; count < 10; count++) ;\n{\n```\n\n你通常会让计算机进入一个空循环。计算机从\
  \ 0 数到 9。数完之后，计算机会执行左花括号后面的任何语句。（循环在分号处结束，因此左花括号后面的语句不在循环内部。）\n\n### 初始化 for 循环\n\
  \n看看清单 15-1 中 `for` 循环的第一行，注意声明 `int count = 0`。这是新内容。当你创建 `for` 循环时，可以在循环初始化部分声明一个变量（比如\
  \ `count`）。\n\n如果在 `for` 循环的初始化中声明了变量，就不能在循环外部使用该变量。例如，在清单 15-1 中，尝试在循环结束后加上 `out.println(count)`：\n\
  \n```\n// 这段代码无法编译。\nfor (int count = 0; count < 10; count++) {\nout.print(\"I’ve\
  \ chewed \");\nout.print(count);\nout.println(\" time(s).\");\n}\nout.print(count);\
  \ // 这里的 count 变量不存在。\n```\n\n加上对 `count` 变量的这个额外引用后，编译器会给出错误信息。你可以在图 15-3 中看到这条信息。如果你对\
  \ `for` 语句不熟悉，这条信息可能会让你惊讶——“你说‘count 无法解析为变量’是什么意思？就在那条语句上面四行，明明有一个 `count` 变量声明。”啊，是的。但\
  \ `count` 变量是在 `for` 循环的初始化中声明的。在 `for` 循环外部，这个 `count` 变量并不存在。\n\n![image](img/Image00186.gif)\n\
  \n图 15-3： 什么 `count` 变量？我没看到 `count` 变量。\n\n要在 `for` 语句外部使用变量，必须在 `for` 语句外部声明该变量。你甚至可以对\
  \ `for` 语句的计数变量这样做。清单 15-2 给出了一个例子。\n\n清单 15-2 使用在 for 循环外部声明的变量\n\n```\nimport\
  \ static java.lang.System.out;\n\nclass AuntEdnaDoesItAgain {\npublic static void\
  \ main(String args[]) {\nint count;\nfor (count = 0; count < 10; count++) {\nout.print(\"\
  I’ve chewed \");\nout.print(count);\nout.println(\" time(s).\");\n}\nout.print(count);\n\
  out.println(\" times! Hooray!\");\nout.println(\"I can swallow!\");\n}\n}\n```\n\
  \n运行清单 15-2 中的代码，结果与清单 15-1 的运行结果完全相同。运行结果如图 15-1 所示。与前者不同，清单 15-2 可以奢侈地使用 `count`\
  \ 变量来显示数字 10。它之所以能做到这一点，是因为在清单 15-2 中，`count` 变量属于整个 `main` 方法，而不仅仅属于 `for` 循环。\n\
  \n注意清单 15-2 中的 `for (count = 0`。由于 `count` 是在 `for` 语句之前声明的，因此在 `for` 语句的初始化中不需要再次声明\
  \ `count`。我尝试过两次声明 `count`，就像下面的代码：\n\n```\n// 这样不行：\nint count;\nfor (int count\
  \ = 0; count < 10; count++) {\n… 等等。\n```\n\n然后 Eclipse 告诉我清理我的代码：\n\n`Duplicate\
  \ local variable count ^`\n\n## 使用嵌套 for 循环\n\n因为你正在阅读《Java 编程入门（傻瓜书）第 5 版》，我假设你管理着一家大酒店。第\
