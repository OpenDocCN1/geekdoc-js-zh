  \ **理解 Java 语句和方法**\n\n我在一所文理学院的科学楼工作。每次路过生物实验室时，我都会低声说一句感谢。我庆幸自己不用解剖小动物。在我的工作中，我解剖的是计算机程序。计算机程序的气味比保存的动物尸体好闻多了。而且，解剖程序时，我不会联想到自己的死亡。\n\
  \n在本章中，我邀请你和我一起解剖一个程序。我有一个名为 `ThingsILike` 的小程序。我将程序拆开，仔细检查程序的内部结构。准备好你的手术刀，我们开始吧！\n\
  \n### 首次查看 Java 代码\n\n我得坦白一件事。第一次看别人的计算机程序时，我会感到有点不安。意识到自己不理解代码中的某些（或许多）内容，让我紧张。我写过几百个（甚至几千个）程序，但开始阅读别人的代码时，我仍然感到不自信。\n\
  \n事实上，学习计算机程序是一个逐步积累的过程。首先，我会敬畏地凝视程序。然后运行程序，看看它做什么。接着盯着程序看一会儿，或者阅读别人对程序及其组成部分的解释。然后我再多凝视一会儿，再次运行程序。最终，我会理解这个程序。不要相信那些说自己从不经历这些步骤的聪明人。即使是经验丰富的程序员，也会缓慢而谨慎地接触新项目。\n\
  \n#### 看！一个程序！\n\n在清单 4-1 中，你会看到一段 Java 代码。像所有新手程序员一样，你应该谦卑地凝视这段代码。但*不要被吓倒*。一旦掌握了窍门，编程就相当简单了。是的，也很有趣。\n\
