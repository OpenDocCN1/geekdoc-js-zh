  \n## 写入、重写与反复重写\n\n出于调皮的本性，我做了一个小实验。我问自己，如果多次运行同一个文件写入程序会发生什么。于是我创建了一个小程序（清单 13-5\
  \ 中的程序），并运行了两次。然后我检查了程序的输出文件。输出文件（如图 13-8 所示）只包含两个字母。\n\n![image](img/Image00174.gif)\n\
  \n图 13-8： 测试一下。\n\n\n\n\n\n清单 13-5 一个小实验\n\n```java\nimport java.io.File;\nimport\
  \ java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\nclass WriteOK {\n\
  \    public static void main(String args[]) throws FileNotFoundException {\n   \
  \     PrintStream diskWriter = new PrintStream(new File(\"approval.txt\"));\n  \
  \      diskWriter.print('O');\n        diskWriter.println('K');\n        diskWriter.close();\n\
  \    }\n}\n```\n\n以下是实验从开始到结束的事件顺序：\n\n1. **在我运行** **清单 13-5** **中的代码之前，我的电脑硬盘上没有**\
  \ `approval.txt` **文件。**\n\n   这没问题。每个实验都得有个起点。\n\n2. **我运行了** **清单 13-5** **中的代码。**\n\
  \n   清单 13-5 中对 `new PrintStream` 的调用创建了一个名为 `approval.txt` 的文件。最初，新的 `approval.txt`\
  \ 文件不包含任何字符。随后在清单 13-5 中，对 `print` 和 `println` 的调用将字符写入文件。因此，运行代码后，`approval.txt`\
  \ 文件包含两个字母：字母 `OK`。\n\n3. **我第二次运行了** **清单 13-5** **中的代码。**\n\n   此时，我可能会想象在 `approval.txt`\
  \ 文件中看到 `OKOK`。但我在图 13-8 中看到的并非如此。运行两次代码后，`approval.txt` 文件只包含一个 `OK`。原因如下：\n\n\
  \   * 清单 13-5 中对 `new PrintStream` 的调用会删除我现有的 `approval.txt` 文件。该调用会创建一个新的空 `approval.txt`\
  \ 文件。\n   * 创建新的 `approval.txt` 文件后，`print` 方法调用将字母 `O` 放入新文件。\n   * `println` 方法调用将字母\
  \ `K` 添加到同一个 `approval.txt` 文件中。\n\n故事就是这样。每次运行程序时，它都会清除硬盘上已有的任何 `approval.txt`\
  \ 文件。然后程序将数据添加到一个新创建的 `approval.txt` 文件中。\n\n![tryitout](img/Image00006.jpg) 文件处理可能很棘手。如果早期遇到麻烦，很容易感到沮丧。幸运的是，这些实验将帮助你走上正确的轨道。\n\
