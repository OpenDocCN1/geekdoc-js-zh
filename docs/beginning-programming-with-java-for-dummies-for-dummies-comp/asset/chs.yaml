  \n图 2-20： Eclipse 显示了一堆 Java 项目。\n\n现在真正的乐趣开始了。\n\n## 下一步是什么？\n\n如果你正在读这一段，那么你可能已经完成了在计算机上安装\
  \ Java 和 Eclipse 的工作。在第 3 章中，你将开始收获软件安装工作的成果。你将使用 Eclipse 运行一个全新的 Java 程序。\n\n第\
  \ 3 章\n\n## 运行程序\n\n本章内容\n\n![勾选](img/Image00002.jpg) **编译并运行程序**\n\n![勾选](img/Image00002.jpg)\
  \ **编辑你自己的 Java 代码**\n\n![勾选](img/Image00002.jpg) **使用工作区**\n\n如果你是编程新手，对你来说，运行程序可能意味着点击鼠标。你想运行\
  \ Microsoft Word，所以双击 Microsoft Word 图标。仅此而已。\n\n当你创建自己的程序时，情况就有点不同了。对于一个新程序，程序员（或程序员所在公司的某个人）会创建程序的图标。在此之前，一个完全正常的程序可能连图标都没有。那么，对于一个全新的\
  \ Java 程序，你该怎么办？如何让程序运行？本章将告诉你需要了解的内容。\n\n## 运行一个现成的 Java 程序\n\n了解 Java 的最佳方式就是动手实践\
  \ Java。当你动手实践 Java 时，你就是在编写、测试和运行你自己的 Java 程序。本节通过描述如何运行和测试程序来为你做准备。你将运行一个我已经为你写好的程序，而不是自己编写程序。该程序计算你每月需要偿还的住房抵押贷款金额。\n\
  \n这个抵押贷款计算程序不会打开自己的窗口。相反，该程序会在 Eclipse 的“控制台”视图中运行。“控制台”视图是 Eclipse 工作台右下部分的一个选项卡。（参见图\
  \ 3-1。）完全在这个“控制台”视图中运行的程序被称为*基于文本的程序*。\n\n![图片](img/Image00037.jpg)\n\n图 3-1： 本章基于文本的抵押贷款程序的一次运行。\n\
  \n![提示](img/Image00003.jpg) 你可能在 Eclipse 工作台的右下部分看不到“控制台”选项卡。要调出“控制台”视图，请选择 Window\
  \ ⇒ Show View ⇒ Other。在出现的“Show View”对话框中，展开 General 分支。最后，在该 General 分支中，双击 Console\
  \ 项。\n\n有关“控制台”视图（以及 Eclipse 工作台的一般信息）的更多信息，请参见本章后面的“视图、编辑器和其他内容”一节。\n\n![在线](img/Image00008.jpg)\
  \ 你可以通过访问本书的网站（[ `http://allmycode.com/BeginProg` ](http://allmycode.com/BeginProg)）查看图\
  \ 3-1 中程序的 GUI 版本，以及本书中许多其他示例的 GUI 版本。\n\n实际上，当你运行抵押贷款程序时，你会在 Eclipse 的“控制台”视图中看到两样东西：\n\
  \n*   **抵押贷款程序发送给你的消息和结果：** 消息包括诸如`How much are you borrowing?`之类的内容，结果包括诸如`Your\
  \ monthly payment is $552.20`之类的行。\n\n*   **你在程序运行时对抵押贷款程序的响应：** 如果你在程序询问借款金额时输入\
  \ 100000.00，你会看到该数字回显在 Eclipse 的“控制台”视图中。\n\n以下是运行抵押贷款程序的方法：\n\n1.  **确保你已经按照**\
  \ **第 2 章** **中的说明操作——安装 Java、安装和配置 Eclipse 以及获取本书示例程序的说明。**\n\n    谢天谢地！你不需要多次遵循这些说明。\n\
  \n2.  **启动 Eclipse。**\n\n    会出现“Eclipse Workspace Launcher”对话框。（参见图 3-2。）\n\n\n\
  \n\n一个*工作空间*是计算机硬盘上的一个文件夹。Eclipse 将你的 Java 程序存储在一个或多个工作空间文件夹中。除了这些 Java 程序，每个工作空间文件夹还包含一些\
  \ Eclipse 设置。这些设置存储了诸如你使用的 Java 版本、你在编辑器中偏好的单词颜色，以及拖动编辑器区域边缘时编辑器区域的大小等信息。你可以拥有多个工作空间，每个工作空间包含不同的程序和不同的设置。\n\
  \n默认情况下，工作空间启动器会提议打开你上次运行 Eclipse 时打开的那个工作空间。你需要打开在第 2 章中使用过的工作空间，因此不要修改启动器工作空间字段中的内容。\n\
  \n3.  **在工作空间启动器对话框中，单击“确定”。**\n\n巨大的 Eclipse 工作台从你的电脑屏幕上注视着你。（参见图 3-3。）\n\n在图 3-3\
  \ 中，工作台最左侧是 Eclipse 的包资源管理器，其中包含诸如 03-01、04-01 等数字。每个数字实际上是一个 Eclipse 项目的名称。正式地说，一个*项目*是工作空间内文件和文件夹的集合。直观地说，项目是一个基本的工作单元。例如，一个用于管理你的\
  \ CD 收藏的 Java 程序文件（以及包含数据的文件）的独立集合，可以构成一个单独的 Eclipse 项目。\n\n再次查看图 3-3 中的包资源管理器，你会看到名为\
  \ 03-01、04-01 等的项目。我的项目 03-01 包含了清单 3-1（本章第 3 章中的第一个也是唯一的清单）的代码。项目 06-02 包含了清单 6-2（本书第\
  \ 6 章中的第二个代码清单）中的 Java 程序。项目名称可以包含字母、数字、空格和其他字符；对于本书示例的名称，我坚持使用数字和短横线。\n\n要了解更多关于\
  \ Eclipse 包资源管理器等主题的信息，请参阅即将到来的章节“Eclipse 窗口里都是些什么？”\n\n![warning](img/Image00004.jpg)\
  \ 当你启动 Eclipse 时，你可能会看到与图 3-3 不同的内容。你可能会看到 Eclipse 的欢迎屏幕，窗口中只有几个图标，其他地方一片空白。你也可能看到像图\
  \ 3-3 那样的工作台，但包资源管理器中没有数字列表（03-01、04-01 等）。如果是这样，你可能遗漏了第 2 章中关于配置 Eclipse 的一些说明。或者，你可能在本节说明的第\
  \ 2 步中修改了启动器工作空间字段中的内容。\n\n无论如何，请确保你在包资源管理器中看到像 03-01 和 04-01 这样的数字。看到这些数字可以确保 Eclipse\
  \ 已准备好运行本书中的示例程序。\n\n4.  **在包资源管理器中，单击** `03-0-Mortgage` **分支。**\n\n`03-0-Mortgage`\
  \ 项目是唯一一个名称不是两位数字、一个短横线、再两位数字的项目。\n\n![tip](img/Image00003.jpg) 你可能想先睹为快，看看一些 Java\
  \ 代码。要查看你在项目 `03-0-Mortgage` 中运行的 Java 程序，请在包资源管理器中展开 `03-0-Mortgage` 分支。在 `03-0-Mortgage`\
  \ 分支内部，你会找到一个 `src` 分支，其中又包含一个 `(default package)` 分支。在 `(default package)` 分支内部，你会找到\
  \ `Mortgage.java` 分支。这个 `Mortgage.java` 分支代表我的 Java 程序。双击 `Mortgage.java` 分支，我的代码就会出现在\
  \ Eclipse 的编辑器中。\n\n5.  **选择主菜单中的“运行 ⇒ 运行为 ⇒ Java 应用程序”，如****图 3-4****所示。**\n\n\
  当你选择“运行为 ⇒ Java 应用程序”时，计算机会运行该项目的代码。（在此示例中，计算机运行我编写的一个 Java 程序。）作为运行的一部分，消息 `How\
  \ much are you borrowing?` 会出现在 Eclipse 的控制台视图中。（控制台视图与问题视图、Javadoc 视图、声明视图以及其他可能的视图共享\
  \ Eclipse 工作台的右下角区域。请参考图 3-1。）\n\n6.  **在 Eclipse 的控制台视图内任意位置单击，然后输入一个数字，例如 100000.00，并按\
  \ Enter 键。**\n\n![warning](img/Image00004.jpg) 在第 6 步输入数字时，不要包含你所在国家的货币符号，也不要对数字进行分组。（美国居民：不要输入美元符号，也不要使用逗号。）像\
  \ $100000.00 和 1,000,000.00 这样的内容会导致程序崩溃。你会在控制台视图中看到一条 `NumberFormatException` 消息。\n\
  \n分组分隔符因国家而异。图 3-1 中显示的运行是在一台配置为美国地区的计算机上进行的，其中 *100000.00*（带点）表示“十万”。但在一个我称之为“逗号国家”的配置下，运行结果可能不同——在这些国家，*100000,00*（带逗号）表示“十万”。如果你住在逗号国家，并且完全按照图\
  \ 3-1 所示输入 100000.00，你很可能会收到一条错误消息（`InputMismatchException`）。如果是这样，请将文件中的数字金额修改为符合你所在国家的数字格式。这样就没问题了。\n\
  \n按 Enter 键后，Java 程序会在控制台视图中显示另一条消息（`What's the interest rate?`）。（再次参考图 3-1。）\n\n\
  7.  **针对利率问题，输入一个数字，例如 5.25，然后按 Enter 键。**\n\n按 Enter 键后，Java 程序会在控制台视图中显示另一条消息（`How\
  \ many years … ?`）。\n\n8.  **输入一个数字，例如 30，然后按 Enter 键。**\n\n根据你输入的数字，Java 程序会显示一个每月还款金额。再次参考图\
  \ 3-1。\n\n*免责声明：* 你当地的抵押贷款公司会收取各种费用。在现实生活中获得抵押贷款时，你支付的金额会超过我的 Java 程序计算出的金额。（而且多得多。）\n\
  \n![warning](img/Image00004.jpg) 在第 8 步输入数字时，不要包含小数点。像 30.0 这样的数字会导致程序崩溃。你会在控制台视图中看到一条\
  \ `NumberFormatException` 消息。\n\n![tip](img/Image00003.jpg) 有时，你会在程序运行过程中意识到自己犯了某种错误。你想立即终止程序的运行。只需单击控制台视图上方的小红色方块即可。（参见图\
  \ 3-5。）\n\n![image](img/Image00038.jpg)\n\n图 3-2： Eclipse 工作空间启动器。\n\n![image](img/Image00039.jpg)\n\
  \n图 3-3： Eclipse 工作台。\n\n![image](img/Image00040.jpg)\n\n图 3-4： 运行项目 `03-0-Mortgage`\
  \ 中代码的方法之一。\n\n![image](img/Image00041.jpg)\n\n图 3-5： 如何提前终止程序运行。\n\n如果你按照本节的说明操作，但没有得到我所描述的结果，你可以尝试三件事。我按从最佳到最差的顺序列出：\n\
  \n*   检查所有步骤，确保你操作正确。\n\n*   发送电子邮件至 `BeginProg@allmycode.com`，在我的 Facebook 墙 ([`/allmycode`](http://www.facebook.com/allmycode))\
  \ 上发帖，或向 Burd 发推文 ([@allmycode](http://www.twitter.com/allmycode))。如果你描述发生了什么，我可能能找出问题所在并告诉你如何纠正。\n\
  \n*   恐慌。\n\n## 输入并运行你自己的代码\n\n\n\n\n\n上一节是关于运行他人的 Java 代码（从本书网站下载的代码）。但最终，你将自行编写代码。本节将展示如何使用\
  \ Eclipse IDE 创建代码。\n\n### 将你的程序与我的程序分开\n\n在第 2 章中，你从我的网站下载了本书的示例。然后你创建了一个 Eclipse\
  \ 工作区，并将本书的示例导入到你的工作区中。\n\n你可以在同一个工作区中创建自己的项目。但如果你想将你的代码与我的代码分开，可以创建第二个工作区。以下是创建新工作区的两种方法：\n\
  \n* **启动 Eclipse 时，在 Eclipse 的“工作区启动器”对话框的“工作区”字段中键入一个新文件夹名称。**  \n  如果该文件夹尚不存在，Eclipse\
  \ 会创建该文件夹。如果该文件夹已存在，Eclipse 的“包资源管理器”会列出该文件夹包含的所有项目。\n\n* **在 Eclipse 工作台的主菜单中，选择“文件” ⇒ “切换工作区”。（参见图\
  \ 3-6。）**  \n  当你选择“文件” ⇒ “切换工作区”时，Eclipse 会提供几个你之前打开过的工作区文件夹。如果你的目标文件夹不在列表中，请选择“其他”选项。随后，Eclipse\
  \ 会重新打开其“工作区启动器”对话框。\n\n![image](img/Image00042.jpg)\n\n图 3-6： 切换到另一个 Eclipse 工作区。\n\
  \n### 编写并运行你的程序\n\n以下是创建新 Java 项目的方法：\n\n1. **启动 Eclipse。**\n\n2. **从 Eclipse 的菜单栏中，选择“文件” ⇒ “新建” ⇒ “Java\
  \ 项目”。**  \n   此时会显示“新建 Java 项目”对话框。\n\n3. **在“新建 Java 项目”对话框中，为你的项目键入一个名称，然后单击“完成”。**\
  \  \n   在图 3-7 中，我键入了名称 `MyFirstProject`。  \n   ![remember](img/Image00005.jpg)\
  \ 如果你单击“下一步”而不是“完成”，你会看到一些当前不需要的其他选项。为避免混淆，只需单击“完成”。  \n   单击“完成”后，你会回到 Eclipse\
  \ 工作台，`MyFirstProject` 会出现在“包资源管理器”中，如图 3-8 所示。  \n   下一步是创建一个新的 Java 源代码文件。\n\n\
  4. **在“包资源管理器”中选择你刚刚创建的项目。**  \n   为了创建图 3-8，我选择了 `MyFirstProject` 而不是 `SomeOtherProject`。\n\
  \n5. **在 Eclipse 的主菜单中，选择“文件” ⇒ “新建” ⇒ “类”。**  \n   此时会显示 Eclipse 的“新建 Java 类”对话框。（参见图\
  \ 3-9。）  \n   ![technicalstuff](img/Image00007.jpg) Java 程序员通常将代码划分为一个或多个*包*。典型的包名如\
  \ `java.util` 或 `org.allyourcode.images`。在图 3-9 中，Eclipse 警告我尚未为项目代码命名包。因此代码将进入一个名为\
  \ Java *默认包*的普通位置。Java 的默认包是一个没有名称的包——它是未打包代码的通用存放位置。包对于管理大型编程项目非常有用，但本书不涉及大型编程项目。因此，在本示例（以及本书的所有示例）中，我选择忽略该警告。有关\
  \ Java 包的更多信息，请参见第 18 章。  \n   ![tip](img/Image00003.jpg) 与其他所有窗口环境一样，Eclipse 提供了多种完成同一任务的方法。除了选择“文件” ⇒ “新建” ⇒ “类”之外，你还可以在\
  \ Windows 中右键单击“包资源管理器”中的 `MyFirstProject`（或在 Mac 上按住 Control 键单击 `MyFirstProject`）。从弹出的上下文菜单中选择“新建” ⇒ “类”。你也可以在\
  \ Windows 中按 Alt+Shift+N（或在 Mac 中按 Option+⌘  +N）开始操作。点击和按键的选择取决于你。\n\n6. **在“新建\
  \ Java 类”对话框的“名称”字段中，键入新类的名称。**  \n   在本示例中，我使用名称 `MyFirstJavaClass`，名称中的单词之间没有空格。（参见图\
  \ 3-9。）  \n   ![warning](img/Image00004.jpg) “新建 Java 类”对话框中的名称不能包含空格。唯一允许的标点符号是下划线字符（`_`）。你可以将类命名为\
  \ `MyFirstJavaClass` 或 `My_First_Java_Class`，但不能命名为 `My First Java Class` 或 `JavaClass,MyFirst`。\n\
  \n7. **勾选 `public static void main(String[] args)` 复选框。**  \n   你的勾选告诉 Eclipse 创建一些样板\
  \ Java 代码。\n\n8. **接受“新建 Java 类”对话框中所有其他选项的默认值。（换句话说，单击“完成”。）**  \n   你甚至可以忽略对话框顶部附近的“不鼓励使用默认包”警告。\
  \  \n   单击“完成”后，你会回到 Eclipse 工作台。现在 `MyFirstProject` 包含一个名为 `MyFirstJavaClass.java`\
  \ 的文件。为了方便起见，`MyFirstJavaClass.java` 文件中已经包含了一些代码。Eclipse 的编辑器会显示这些 Java 代码。（参见图\
  \ 3-10。）\n\n9. **替换新 Java 程序中的一行现有代码。**  \n   在 Eclipse 的编辑器中键入一行代码。将行  \n   `//\
  \ TODO Auto-generated method stub`  \n   替换为  \n   `System.out.println(\"Chocolate,\
  \ royalties, sleep\");`  \n   请严格按照清单 3-1 中的样子复制这行新代码。  \n   * 每个单词的拼写必须与清单 3-1\
  \ 中的完全一致。  \n   * 每个单词的大小写必须与清单 3-1 中的完全一致。  \n   * 包含所有标点符号——点号、引号、分号——全部都要。  \n\
  \   * ![remember](img/Image00005.jpg) 区分小写字母 `l` 和数字 `1`。单词 `println` 告诉计算机打印一整行。`println`\
  \ 中的每个字符都是小写字母。该单词不包含任何数字。  \n   ![warning](img/Image00004.jpg) Java 是*区分大小写*的，这意味着\
  \ `system.out.printLn` 与 `System.out.println` 不同。如果你输入 `system.out.printLn`，你的程序将无法运行。请务必严格按照清单\
  \ 3-1 中的方式大写你的代码。  \n   ![warning](img/Image00004.jpg) 如果你从电子书中复制粘贴代码，请检查代码中的引号是否为直引号（`\"\
  \"`），而不是弯引号（`“ ”`）。在 Java 程序中，直引号是正确的；弯引号会带来麻烦。  \n   如果你正确键入了所有内容，你会看到图 3-11 中的内容。\
  \  \n   如果你没有严格按照清单 3-1 中的方式键入代码，你可能会在编辑器中看到锯齿状的红色下划线、带有 X 形标记的小矩形或其他红色标记。（参见图 3-12。）\
  \  \n   Eclipse 编辑器中的红色标记表示 Java 代码中的*编译时错误*。编译时错误（也称为*编译器错误*）是一种阻止计算机翻译代码的错误。（参见第\
  \ 1 章中关于代码翻译的讨论。）  \n   ![tip](img/Image00003.jpg) 图 3-12 中的错误标记出现在 Java 程序的第 5\
  \ 行。行号显示在编辑器的左侧边距中。要让 Eclipse 编辑器显示行号，请选择“窗口” ⇒ “首选项”（在 Windows 中）或“Eclipse” ⇒ “首选项”（在\
  \ Mac 中）。然后选择“常规” ⇒ “编辑器” ⇒ “文本编辑器”。最后，勾选“显示行号”复选框。\n\n\n\n\n要解决编译时错误，你必须成为一名专注的侦探。你加入了一支精英小队，名为《法律与秩序：Java\
  \ 编程单元》。你很少能找到简单的答案。相反，你需要缓慢而仔细地梳理证据，寻找线索。你将编辑器中看到的一切，逐字逐句地与清单 3-1 中的代码进行比较。你不能错过任何一个细节，包括拼写、标点符号以及大小写。\n\
  \nEclipse 有一些很好的功能可以帮助你找到编译时错误的根源。例如，你可以将鼠标指针悬停在锯齿状的红色下划线上。此时，你会看到错误的简要说明以及一些修复建议——一些*快速修复*。（参见图\
  \ 3-13）\n\n在图 3-13 中，一个弹出消息告诉你 Java 不知道单词 `system` 是什么意思——即 *system cannot be resolved*。在该图底部附近，其中一个快速修复选项是将\
  \ `system` 改为 `System`。\n\n当你点击“更改为 'System'（`java.lang`）”选项时，Eclipse 的编辑器会将 `system`\
  \ 替换为 `System`。编辑器中的错误标记消失，你从图 3-12 中的错误代码回到图 3-11 中的正确代码。\n\n10.  **在 Eclipse 编辑器中对代码进行任何修改或更正。**\n\
  \n    当你最终在编辑器中看不到任何锯齿状下划线或斑点时，就可以尝试运行程序了。\n\n11.  **选择** `MyFirstJavaClass` **，可以通过在编辑器内单击，或者单击包资源管理器中的**\
  \ `MyFirstProject` **分支。**\n\n12.  **从 Eclipse 的主菜单中，选择 Run ⇒ Run As ⇒ Java Application。**\n\
  \n    这样就搞定了。你的新 Java 程序会在 Eclipse 的控制台视图中运行。如果你运行的是清单 3-1 中的代码，你会看到图 3-14 中的 `Chocolate,\
  \ royalties, sleep` 消息。简直就像在天堂一样！\n\n![image](img/Image00043.jpg)\n\n图 3-7： 让 Eclipse\
  \ 创建一个新项目。\n\n![image](img/Image00044.jpg)\n\n图 3-8： 你的项目出现在 Eclipse 的包资源管理器中。\n\
  \n![image](img/Image00045.jpg)\n\n图 3-9： 让 Eclipse 创建一个新的 Java 类。\n\n![image](img/Image00046.jpg)\n\
  \n图 3-10： Eclipse 在编辑器中写入一些代码。\n\n![image](img/Image00047.jpg)\n\n图 3-11： Eclipse\
  \ 编辑器中的一个 Java 程序。\n\n![image](img/Image00048.jpg)\n\n图 3-12： 一个输入错误的 Java 程序。\n\
  \n![image](img/Image00049.jpg)\n\n图 3-13： Eclipse 提供了一些有用的建议。\n\n![image](img/Image00050.jpg)\n\
  \n图 3-14： 运行清单 3-1 中的程序。\n\n清单 3-1 一个显示我喜欢的事物的程序\n\n```java\npublic class MyFirstJavaClass\
  \ {\npublic static void main(String[] args) {\nSystem.out.println(\"Chocolate, royalties,\
  \ sleep\");\n}\n}\n```\n\n## Eclipse 窗口里所有这些是什么？\n\n信不信由你，曾经有一位编辑拒绝了我的一本书稿。在页边空白处，编辑在诸如\
  \ *can't*、*it's* 和 *I've* 这样的词旁边潦草地写道：“这不是一个单词。”直到今天，我仍然不知道这位编辑为什么不喜欢缩略形式。我个人的看法是，语言总是需要扩展的。如果没有新词——比如\
  \ *dot-com*、*infomercial* 和 *vaporware*——我们会在哪里？\n\n即使是《牛津英语词典》（关于词汇争论的最终权威）每年也会增加超过\
  \ 4000 个词条。这相当于每年增长超过 1%。大约每天 11 个新词！\n\n事实上，人类的思想就像一座高层建筑：在至少建好第 49 层之前，你无法建造第\
  \ 50 层。在拥有像 *email* 这样的词之前，你无法谈论 *spam*。在当今这个时代，你需要语言的构建块。这就是为什么本节包含一堆新术语。\n\n在本节中，每个新定义的术语都描述了\
  \ Eclipse IDE 的一个方面。因此，在阅读所有这些 Eclipse 术语之前，我提供以下免责声明：\n\n*   **本节为可选阅读。** 如果你在理解本书某些指令时遇到困难，请参考本节。但如果你在\
  \ Eclipse IDE 中导航毫无问题，就不要纠结于本节中的术语，把事情搞复杂了。\n\n*   **本节提供术语的解释，而非正式定义。** 是的，我的解释相当精确，但并非无懈可击。本节中的几乎每个描述都有隐藏的例外、遗漏、豁免和排除。请将本节中的段落视为友好的提醒，而非法律合同。\n\
  \n*   **Eclipse 是一个非常实用的工具。** 但 Eclipse 并非 Java 生态系统的官方组成部分。尽管本书未详细描述，但你完全可以在不使用\
  \ Eclipse 的情况下编写 Java 程序。\n\n### 理解全局\n\n你的 Eclipse 之旅从一个宏观的鸟瞰图开始。\n\n*   **工作台：**\
  \ Eclipse 桌面。（参见图 3-3）工作台是你开发代码的环境。\n\n*   **区域：** 工作台的一个部分。图 3-3 中的工作台包含五个区域。为了说明这一点，我在每个区域周围画了边框。（参见图\
  \ 3-15）\n\n*   **窗口：** Eclipse 工作台的一个副本。使用 Eclipse，你可以同时打开多个工作台副本。每个副本出现在自己的窗口中。\n\
  \n*   **操作：** 提供给你的一个选择——通常在你点击某个东西时出现。例如，当你在 Eclipse 主菜单栏上选择 File ⇒ New 时，你会看到可以创建的新事物列表。该列表通常包括\
  \ Project、Folder、File 和 Other，但也可能包括 Package、Class 和 Interface 等。这些事物中的每一个（菜单上的每个项目）都称为一个*操作*。\n\
  \n![image](img/Image00054.jpg)\n\n图 3-15： 工作台被划分为多个区域。\n\n### 视图、编辑器和其他内容\n\n接下来的一组术语涉及视图、编辑器和选项卡。\n\
  \n![tip](img/Image00003.jpg) 你可能难以理解视图和编辑器之间的区别。（视图就像编辑器，编辑器就像视图，或者类似的东西。）如果视图和编辑器对你来说看起来一样，并且你不确定能否区分它们，请不要沮丧。作为普通的\
  \ Eclipse 用户，随着你使用工作台的经验增加，视图和编辑器之间的区别会自然显现。你很少需要判断你正在使用的是视图还是编辑器。\n\n如果你必须判断什么是视图，什么又是编辑器，以下是你需要知道的：\n\
  \n*   **视图：** Eclipse 工作台的一部分，用于显示信息供你浏览。在最简单的情况下，视图填充工作台中的一个区域。例如，在图 3-15 中，包资源管理器视图填充了最左侧的区域。\n\
  \n    许多视图以列表或树的形式显示信息。例如，在图 3-10 中，包资源管理器视图包含一个树。\n\n    你可以使用视图对事物进行更改。例如，要删除图\
  \ 3-15 左侧列出的 `03-01` 项目，请右键单击包资源管理器视图中的 `03-01` 分支。（在 Mac 上，按住 Control 键单击 `03-01`\
  \ 分支。）然后在出现的上下文菜单中选择 Delete。\n\n\n\n\n\n![remember](img/Image00005.jpg) 当你使用视图进行更改时，更改会立即生效。例如，在包资源管理器的上下文菜单中选择“删除”时，你选中的任何项目都会立即被删除。从某种程度上说，这种行为并不新鲜。当你使用\
  \ Windows 资源管理器回收文件或使用 Macintosh Finder 删除文件时，也会发生同样的事情。\n\n*   **编辑器：** Eclipse\
  \ 工作台的一部分，用于显示信息供你修改。典型的编辑器以文本形式显示信息。这些文本可以是文件的内容。例如，图 3-11 中的编辑器显示了 `MyFirstJavaClass.java`\
  \ 文件的内容。\n\n    ![remember](img/Image00005.jpg) 当你使用编辑器进行更改时，更改不会立即生效。例如，查看 图 3-11\
  \ 中的编辑器。该编辑器显示了 `MyFirstJavaClass.java` 文件的内容。你可以在编辑器中输入各种内容。在从 Eclipse 菜单栏中选择“文件 ⇒ 保存”之前，`MyFirstJavaClass.java`\
  \ 不会发生任何变化。当然，这种行为并不新鲜。当你使用 Microsoft Word 或任何其他文字处理程序时，也会发生同样的事情。\n\n    ![technicalstuff](img/Image00007.jpg)\
  \ 和其他作者一样，我偶尔也会偷懒，在真正想说*视图或编辑器*时，却用了*视图*这个词。当你发现我这样做时，只需摇摇头继续往下看。当我非常谨慎时，我会使用官方的\
  \ Eclipse 术语。我将视图和编辑器称为 Eclipse 工作台的*部件*。不幸的是，这种“部件”术语并不容易让人记住。\n\nEclipse 工作台的某个区域可能包含多个重叠的视图或重叠的编辑器。要将某个视图或编辑器置于最前面，你可以单击其选项卡。大多数\
  \ Eclipse 用户无需过多考虑（甚至根本不用考虑）这种“多个视图”的情况就能正常使用。但如果你关心选项卡和活动视图相关的术语，那么以下是详细说明：\n\n\
  *   **选项卡：** 除了称之为*选项卡*之外，几乎无法描述的东西。我们称之为选项卡的东西，无论用什么其他名字，都能让我们从一个视图切换到另一个视图，或从一个编辑器切换到另一个编辑器。重要的是，视图可以相互*堆叠*。Eclipse\
  \ 将堆叠的视图显示为带选项卡的笔记本中的页面。例如，图 3-14 显示了 Eclipse 工作台的一个区域。该区域包含五个视图（问题视图、Javadoc 视图、声明视图、搜索视图和控制台视图）。每个视图都有自己的选项卡。\n\
  \n    一堆堆叠的视图称为*选项卡组*。要将堆叠中的某个视图置于最前面，你可以单击该视图的选项卡。\n\n    顺便提一下，所有这些关于选项卡和视图的内容同样适用于选项卡和编辑器。唯一有趣的是\
  \ Eclipse 使用*编辑器*这个词的方式。在 Eclipse 中，编辑器区域的每个选项卡页面都是一个独立的编辑器。例如，图 3-16 中的编辑器区域包含三个编辑器（而不是属于同一个编辑器的三个选项卡）。\n\
  \n*   **活动视图或活动编辑器：** 在选项卡组中，位于最前面的视图或编辑器。\n\n    在 图 3-16 中，`MyFirstJavaClass.java`\
  \ 编辑器是活动编辑器。`Mortgage.java` 和 `ThingsILike.java` 编辑器是非活动的。\n\n![image](img/Image00055.jpg)\n\
  \n图 3-16： 编辑器区域包含三个编辑器。\n\n### 视图或编辑器中包含什么？\n\n接下来的几个术语涉及单个视图、单个编辑器和单个区域。\n\n* \
  \  **工具栏：** 视图顶部的按钮（以及其他小部件）栏。（参见 图 3-17 。）\n\n*   **菜单按钮：** 工具栏中一个向下的箭头。单击菜单按钮时，会显示一个操作下拉列表。（参见\
  \ 图 3-18 。）列表中显示的操作因视图而异。\n\n*   **关闭按钮：** 用于关闭特定视图或编辑器的按钮。（参见 图 3-19 。）\n\n*  \
  \ **双箭头：** 一个双箭头，表示特定区域中应显示其他选项卡（但该区域宽度不够）。图 3-20 中的双箭头旁边有一个小数字 2。这个 2 告诉你，除了两个可见的选项卡外，还有两个选项卡不可见。单击双箭头会弹出一个悬停提示，其中包含所有选项卡的标签。\n\
  \n*   **标记栏：** 编辑器区域左侧边缘的垂直标尺。Eclipse 在标记栏内显示微小的警报图标，称为*标记*。（例如，请参考 图 3-12 。）\n\n\
  ![image](img/Image00056.jpg)\n\n图 3-17： 包资源管理器视图的工具栏。\n\n![image](img/Image00057.jpg)\n\
  \n图 3-18： 单击包资源管理器视图的菜单按钮。\n\n![image](img/Image00058.jpg)\n\n图 3-19： 编辑器的关闭按钮。\n\
  \n![image](img/Image00059.jpg)\n\n图 3-20： 双箭头表示有两个编辑器被隐藏。\n\n### 回到全局视角\n\n接下来的两个术语涉及\
  \ Eclipse 的整体外观和感觉：\n\n*   **布局：** 特定视图的排列方式。图 3-3 中的布局有七个视图，其中四个很容易看到：\n\n    *\
  \   最左边，你可以看到包资源管理器视图。\n\n    *   最右边，你有任务列表视图和大纲视图。\n\n    *   靠近底部，你有问题、Javadoc、声明和控制台视图。\n\
  \n    除了所有这些视图之外，该布局还包含一个*编辑器区域*。所有打开的编辑器都出现在这个编辑器区域内。\n\n*   **透视图：** 一种非常有用的布局。如果某个特定布局确实有用，就会有人给它命名。而且，如果一个布局有名字，你就可以随时使用它。例如，图\
  \ 3-3 的工作台显示了 Eclipse 的 Java 透视图。默认情况下，*Java 透视图*包含六个视图，其排列方式与 图 3-3 所示的排列非常相似。\n\
  \n    ![tip](img/Image00003.jpg) 控制台视图出现在 图 3-3 中，但控制台视图并不总是作为 Java 透视图的一部分出现。通常，当你运行基于文本的\
  \ Java 程序时，控制台视图会自动出现。如果你想强制显示控制台视图，请选择“窗口 ⇒ 显示视图 ⇒ 其他”。在出现的“显示视图”对话框中，展开“常规”分支。最后，在该“常规”分支中，双击“控制台”项。\n\
