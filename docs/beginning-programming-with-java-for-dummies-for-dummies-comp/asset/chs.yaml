  \ 老版《阴阳魔界》电视剧以旁白罗德·瑟林谈论第五维度开场。我想知道如今在我当地的电影院看《阴阳魔界》要花多少钱！）\n\n第 11 章\n\n## 如何拨动虚拟开关\n\
  \n本章内容\n\n- ![check](img/Image00002.jpg) **处理多种选择**\n- ![check](img/Image00002.jpg)\
  \ **从语句中间跳出**\n- ![check](img/Image00002.jpg) **处理替代赋值**\n\n想象一下，在《一锤定音》节目中面对十扇不同的门。“选择\
  \ 1 号门、2 号门、3 号门、4 号门……等等！我们先插播广告。回来之后，我会说出另外六扇门的名字。”\n\n蒙提·霍尔（节目主持人）需要的是 Java 的`switch`语句。\n\
  \n## 认识 switch 语句\n\n清单 9-2 中的代码（参见第 9 章）模拟了一个占卜玩具——一个电子神谕。向程序提问，程序会随机生成一个“是”或“否”的答案。但作为玩具，清单\
  \ 9-2 中的代码并不有趣。代码只有两个可能的答案，缺乏多样性。即使是最早的会说话的玩偶也能说出大约十种不同的句子。\n\n假设你想增强清单 9-2 的代码。调用`myRandom.nextInt(10)\
  \ + 1`会生成 1 到 10 的数字。那么，你可以为这十个数字分别显示不同的句子。一大堆`if`语句应该能搞定：\n\n```\nif (randomNumber\
  \ == 1) {\n    System.out.println(\"Yes. Isn’t it obvious?\");\n}\nif (randomNumber\
  \ == 2) {\n    System.out.println(\"No, and don’t ask again.\");\n}\nif (randomNumber\
  \ == 3) {\n    System.out.print(\"Yessir, yessir!\");\n    System.out.println(\"\
  \ Three bags full.\");\n}\nif (randomNumber == 4)\n.\n.\n.\nif (randomNumber < 1\
  \ || randomNumber > 10) {\n    System.out.print(\"Sorry, the electronic oracle\"\
  );\n    System.out.println(\" is closed for repairs.\");\n}\n```\n\n但这种方法似乎很浪费。为什么不创建一个只检查一次`randomNumber`的值，然后根据找到的值采取行动的语句呢？幸运的是，确实存在这样的语句：`switch`语句。清单\
  \ 11-1 给出了一个`switch`语句的例子。\n\n清单 11-1 应对各种情况的答案\n\n```\nimport java.util.Scanner;\n\
  import java.util.Random;\nimport static java.lang.System.out;\n\nclass TheOldSwitcheroo\
  \ {\n    public static void main(String args[]) {\n        Scanner keyboard = new\
  \ Scanner(System.in);\n        Random myRandom = new Random();\n        int randomNumber;\n\
  \n        out.print(\"Type your question, my child: \");\n        keyboard.nextLine();\n\
  \n        randomNumber = myRandom.nextInt(10) + 1;\n\n        switch (randomNumber)\
  \ {\n            case 1:\n                out.println(\"Yes. Isn’t it obvious?\"\
  );\n                break;\n            case 2:\n                out.println(\"\
  No, and don’t ask again.\");\n                break;\n            case 3:\n    \
  \            out.print(\"Yessir, yessir!\");\n                out.println(\" Three\
  \ bags full.\");\n                break;\n            case 4:\n                out.println(\"\
  What part of ’no’ don’t you understand?\");\n                break;\n          \
  \  case 5:\n                out.println(\"No chance, Lance.\");\n              \
  \  break;\n            case 6:\n                out.println(\"Sure, whatever.\"\
  );\n                break;\n            case 7:\n                out.println(\"\
  Yes, but only if you’re nice to me.\");\n                break;\n            case\
  \ 8:\n                out.println(\"Yes (as if I care).\");\n                break;\n\
  \            case 9:\n                out.println(\"No, not until Cromwell seizes\
  \ Dover.\");\n                break;\n            case 10:\n                out.println(\"\
  No, not until Nell squeezes Rover.\");\n                break;\n            default:\n\
  \                out.print(\"You think you have problems?\");\n                out.print(\"\
  \ My random number generator is broken!\");\n                break;\n        }\n\
  \n        out.println(\"Goodbye\");\n        keyboard.close();\n    }\n}\n```\n\n\
  ### switch 语句中的 case\n\n图 11-1 展示了清单 11-1 程序的三个运行实例。以下是其中一次运行的过程：\n\n- 用户输入一个沉重的问题，变量`randomNumber`获得一个值。在图\
  \ 11-1 的第二次运行中，这个值是 2。\n- 清单 11-1 中的代码执行到`switch`语句的顶部，因此计算机开始检查该语句的`case`子句。值`2`与最顶部的`case`子句（`case\
  \ 1`子句）不匹配，因此计算机继续检查下一个`case`子句。\n- 下一个`case`子句中的值（数字 2）与`randomNumber`变量的值匹配，因此计算机执行这个`case\
  \ 2`子句中的语句。这两个语句是：\n\n```\nout.println(\"No, and don’t ask again.\");\nbreak;\n\
  ```\n\n这两个语句中的第一个在屏幕上显示`No, and don’t ask again`。第二个语句称为`break`语句。（真令人惊讶！）当计算机遇到`break`语句时，它会跳出当前所在的`switch`语句。因此，在清单\
  \ 11-1 中，计算机会直接跳过`case 3`、`case 4`等。计算机跳转到`switch`语句结束后的下一条语句。\n\n- 计算机显示`Goodbye`，因为这是`switch`语句之后的语句告诉计算机要做的。\n\
  \n![image](img/Image00145.jpg)\n\n图 11-1: 运行清单 11-1 的代码。\n\n清单 11-1 程序的整体思路如图 11-2\
  \ 所示。\n\n![image](img/Image00146.jpg)\n\n图 11-2: 一个带有 11 个分支的岔路。\n\n### switch 语句中的\
  \ default\n\n如果在运行清单 11-1 程序时出现严重错误怎么办？假设表达式`myRandom.nextInt(10) + 1`生成了一个不在 1\
  \ 到 10 范围内的数字。那么计算机会跳过所有`case`子句，转而执行`default`子句。在`default`子句中，计算机显示`You think you\
  \ have problems? …`，然后跳出`switch`语句。跳出`switch`语句后，计算机显示`Goodbye`。\n\n![tip](img/Image00003.jpg)\
  \ 实际上，你不需要在`switch`语句的末尾放置`break`。在清单 11-1 中，最后一个`break`（属于`default`子句的那个）只是为了整体整洁。\n\
  \n### switch 语句的细节\n\n`switch`语句可以采用以下形式：\n\n```\nswitch (表达式) {\n    case 第一个值:\n\
  \        语句\n    case 第二个值:\n        更多语句\n    // … 更多 case …\n    default:\n  \
  \      更多语句\n}\n```\n\n关于`switch`语句的一些要点：\n\n- *表达式*不一定非得是`int`类型。它可以是`char`、`byte`、`short`或`int`。\n\
  \n例如，以下代码在 Java 5 及更高版本中有效：\n\n```\nchar letterGrade;\n```\n\n\n\n\n\n```\nletterGrade\
  \ = keyboard.findWithinHorizon(\".\",0).charAt(0);\nswitch (letterGrade) {\ncase\
  \ ’A’:\n    System.out.println(\"Excellent\");\n    break;\ncase ’B’:\n    System.out.println(\"\
  Good\");\n    break;\ncase ’C’:\n    System.out.println(\"Average\");\n    break;\n\
  }\n```\n\n实际上，如果你避免使用 `Scanner` 类及其 `findWithinHorizon` 方法，这个要点的 `switch` 语句在所有\
  \ Java 版本（新旧版本）中都能正常工作。\n\n*   如果你使用 Java 7 或更高版本，`Expression` 可以是 `String`。例如，以下代码在\
  \ Java 6 中无法运行，但在 Java 7 中运行良好：\n\n    ```java\n    String description;\n    description\
  \ = keyboard.next();\n    switch (description) {\n    case \"Excellent\":\n    \
  \    System.out.println(’A’);\n        break;\n    case \"Good\":\n        System.out.println(’B’);\n\
  \        break;\n    case \"Average\":\n        System.out.println(’C’);\n     \
  \   break;\n    }\n    ```\n\n    ![交叉引用](img/Image00009.jpg) 我在第 8 章中简要介绍了 Java\
  \ 的 `String` 类型。我在第 18 章中详细描述了 `String` 类。\n\n*   `Expression` 不必是单个变量。它可以是 `char`、`byte`、`short`、`int`\
  \ 或 `String` 类型的任何表达式。例如，你可以用以下代码模拟两个骰子的投掷：\n\n    ```java\n    int die1, die2;\n\
  \    die1 = myRandom.nextInt(6) + 1;\n    die2 = myRandom.nextInt(6) + 1;\n    switch\
  \ (die1 + die2) {\n    // … 等等\n    }\n    ```\n\n*   `switch` 语句中的 `case` 不必按顺序排列。以下是一些可接受的代码：\n\
  \n    ```java\n    switch (randomNumber) {\n    case 2:\n        System.out.println(\"\
  不，别再问了。\");\n        break;\n    case 1:\n        System.out.println(\"是的。这还不明显吗？\"\
  );\n        break;\n    case 3:\n        System.out.print(\"是的，先生，是的，先生！\");\n \
  \       System.out.println(\" 满满三袋。\");\n        break;\n    // … 等等\n    }\n  \
  \  ```\n\n    这种 case 的混合可能会在阅读和理解程序时拖慢你的速度，但它是合法的。\n\n*   你不需要为 `Expression` 的每个预期值都提供一个\
  \ `case`。你可以将一些预期值留给 `default`。示例如下：\n\n    ```java\n    switch (randomNumber) {\n\
  \    case 1:\n        System.out.println(\"是的。这还不明显吗？\");\n        break;\n    case\
  \ 5:\n        System.out.println(\"没机会，兰斯。\");\n        break;\n    case 7:\n  \
  \      System.out.println(\"是的，但前提是你对我好。\");\n        break;\n    case 10:\n   \
  \     System.out.println(\"不，除非 Nell 挤了 Rover。\");\n        break;\n    default:\n\
  \        System.out.println(\"抱歉，我实在无法决定。\");\n        break;\n    }\n    ```\n\n\
  *   `default` 子句是可选的。\n\n    ```java\n    switch (randomNumber) {\n    case 1:\n\
  \        System.out.println(\"是的。这还不明显吗？\");\n        break;\n    case 2:\n    \
  \    System.out.println(\"不，别再问了。\");\n        break;\n    case 3:\n        System.out.print(\"\
  我太累了。\");\n        System.out.println(\" 去问别人吧。\");\n    }\n    System.out.println(\"\
  再见\");\n    ```\n\n    如果没有 `default` 子句，并且出现了任何 case 未覆盖的值，`switch` 语句将什么都不做。例如，如果\
  \ `randomNumber` 是 `4`，上述代码只会显示 `再见`，没有其他内容。\n\n*   在某些方面，`if` 语句比 `switch` 语句更灵活。例如，你不能在\
  \ `switch` 语句的 `Expression` 中使用条件：\n\n    ```java\n    //你不能这样做：\n    switch (age\
  \ >= 12 && age < 65)\n    ```\n\n    你也不能将条件用作 `case` 值：\n\n    ```java\n    //你不能这样做：\n\
  \    switch (age) {\n    case age <= 12: // … 等等\n    }\n    ```\n\n### 中断还是不中断\n\
  \n每个 Java 程序员都曾有过忘记使用 `break` 语句的时候。起初，输出结果令人困惑，但随后程序员会想起“穿透”这个概念。术语 *穿透* 描述了当你结束一个\
  \ `case` 而没有 `break` 语句时发生的情况。发生的情况是代码的执行会直接落入下一个 `case`。执行会一直穿透下去，直到你最终遇到一个 `break`\
  \ 语句或整个 `switch` 语句的结束。\n\n如果你不相信我，请看清单 11-2。这个清单中的代码有一个出了问题的 `switch` 语句。\n\n清单\
  \ 11-2 拜托，给我一个中断！\n\n```java\n/*\n * 这不是好代码。程序员忘记了一些 break 语句。\n */\nimport java.util.Scanner;\n\
  import java.util.Random;\nimport static java.lang.System.out;\n\nclass BadBreaks\
  \ {\n    public static void main(String args[]) {\n        Scanner keyboard = new\
  \ Scanner(System.in);\n        Random myRandom = new Random();\n        int randomNumber;\n\
  \n        out.print(\"说出你的问题，我的孩子：\");\n        keyboard.nextLine();\n\n       \
  \ randomNumber = myRandom.nextInt(10) + 1;\n\n        switch (randomNumber) {\n\
  \        case 1:\n            out.println(\"是的。这还不明显吗？\");\n        case 2:\n  \
  \          out.println(\"不，别再问了。\");\n        case 3:\n            out.print(\"\
  是的，先生，是的，先生！\");\n            out.println(\" 满满三袋。\");\n        case 4:\n      \
  \      out.println(\"'不' 的哪部分你不明白？\");\n            break;\n        case 5:\n  \
  \          out.println(\"没机会，兰斯。\");\n        case 6:\n            out.println(\"\
  当然，随便。\");\n        case 7:\n            out.println(\"是的，但前提是你对我好。\");\n      \
  \  case 8:\n            out.println(\"是的（好像我在乎似的）。\");\n        case 9:\n      \
  \      out.println(\"不，除非 Cromwell 夺取 Dover。\");\n        case 10:\n           \
  \ out.println(\"不，除非 Nell 挤了 Rover。\");\n        default:\n            out.print(\"\
  你觉得你有问题？\");\n            out.println(\" 我的随机数生成器坏了！\");\n        }\n\n        out.println(\"\
  再见\");\n        keyboard.close();\n    }\n}\n```\n\n我在图 11-3 中展示了这段代码的两次运行结果。在第一次运行中，`randomNumber`\
  \ 是 7。程序执行了 case 7 到 10，以及 `default`。在第二次运行中，`randomNumber` 是 3。程序执行了 case 3 和 4。然后，因为\
  \ case 4 有一个 `break` 语句，程序跳出了 `switch` 并显示 `再见`。\n\n![图片](img/Image00147.gif)\n\n\
  图 11-3: 请做出决定。\n\n![记住](img/Image00005.jpg) 清单 11-2 中的 `switch` 语句缺少一些 `break` 语句。即使没有这些\
  \ `break` 语句，代码也能编译通过且没有错误。但是当你运行清单 11-2 中的代码时，你不会得到你想要的结果。\n\n## 善用穿透\n\n通常，在使用\
  \ `switch` 语句时，你并不希望发生穿透，所以你会在 `switch` 中到处添加 `break` 语句。但有时，穿透正是你所需要的。\n\n以一个月中的天数为例。有没有简单的规则？包含字母\
  \ *r* 的月份有 31 天？*i* 在 *e* 之前（除了 *c* 之后）的月份有 30 天？\n\n你可以随意摆弄 `if` 条件。但为了处理所有可能性，我更喜欢使用\
  \ `switch` 语句。清单 11-3 演示了这个想法。\n\n清单 11-3 查找一个月中的天数\n\n```java\nimport java.util.Scanner;\n\
  \nclass DaysInEachMonth {\n    public static void main(String args[]) {\n      \
  \  Scanner keyboard = new Scanner(System.in);\n        int month, numberOfDays =\
  \ 0;\n        boolean isLeapYear;\n\n        System.out.print(\"哪个月份？ \");\n   \
  \     month = keyboard.nextInt();\n\n        switch (month) {\n        case 1:\n\
  \        case 3:\n        case 5:\n        case 7:\n        case 8:\n        case\
  \ 10:\n        case 12:\n            numberOfDays = 31;\n            break;\n  \
  \      case 4:\n        case 6:\n        case 9:\n        case 11:\n           \
  \ numberOfDays = 30;\n            break;\n        case 2:\n            System.out.print(\"\
  闰年（true/false）？ \");\n            isLeapYear = keyboard.nextBoolean();\n       \
  \     if (isLeapYear) {\n                numberOfDays = 29;\n            } else\
  \ {\n                numberOfDays = 28;\n            }\n        }\n\n        System.out.print(numberOfDays);\n\
  \        System.out.println(\" 天\");\n        keyboard.close();\n    }\n}\n```\n\
  \n\n\n\n\n```\n}\n}\n```\n\n图 11-4 展示了清单 11-3 中程序的几次运行。对于月份编号 6，计算机会跳转到`case 6`。由于`case\
  \ 6`子句中没有语句，因此程序运行的这一部分相当无聊。\n\n![image](img/Image00148.gif)\n\n图 11-4：距离下一个重要截止日期还有多少天？\n\
  \n但由于`case 6`子句中没有`break`，计算机会直接进入`case 9`。同样，计算机没有找到任何语句和`break`，于是继续进入下一个`case`，即`case\
  \ 11`。此时，计算机终于找到了有价值的内容。它将 30 赋值给`numberOfDays`，然后跳出整个`switch`语句。（参见图 11-5。）\n\n\
  ![image](img/Image00149.jpg)\n\n图 11-5：跟随弹跳球。\n\n二月是所有月份中最好的。首先，清单 11-3 中的二月`case`包含了对`Scanner`类的`nextBoolean`方法的调用。该方法期望我输入`true`或`false`。代码使用我输入的任何单词来给一个`boolean`变量赋值。（在清单\
  \ 11-3 中，我将`true`或`false`赋值给`isLeapYear`变量。）\n\n二月还包含它自己的`if`语句。在第 10 章中，我将`if`语句嵌套在其他`if`语句中。但在二月，我将`if`语句嵌套在`switch`语句中。这很酷。\n\
  \n![tryitout](img/Image00006.jpg) 这里是练习使用`switch`语句的地方。\n\n#### 请勿在家中（或任何其他地方）尝试\n\
