  \ 2 章中的步骤导入了本书的示例，请确保`15-04`（且没有其他文本）出现在“输入或选择父文件夹”字段中。\n\n4. **在对话框的“文件名”字段中，输入新文件的名称。**\n\
  \n   输入**importantData.txt**。\n\n5. **点击完成。**\n\n6. **观察文件名出现在 Eclipse 的包资源管理器中。**\n\
  \n   该名称位于`15-04`项目的根目录中。你将其放在根目录中，因为在清单 15-4 中，名称`importantData.txt`（没有斜杠或反斜杠）仅指项目根目录中的名称。程序的运行对根目录之外的任何文件都没有影响，即使这些文件中有名为`importantData.txt`的文件。\n\
  \n   ![crossreference](img/Image00009.jpg) 要了解如何引用项目根目录之外的文件，请参阅第 13 章。\n\n   对于这个实验，你不需要向文件中添加任何文本。该文件仅用于被删除。\n\
  \n7. **运行程序。**\n\n   当程序运行时，输入**Y**以删除`importantData.txt`文件。\n\n   运行程序后，你需要检查以确保程序删除了`importantData.txt`文件。\n\
  \n8. **在包资源管理器中，再次选择项目的根目录（为了保险起见）。**\n\n9. **在 Eclipse 的主菜单中，选择 File ⇒ Refresh。**\n\
  \n   Eclipse 会重新查看项目目录，并在包资源管理器的树中列出该目录的文件。假设程序正确执行，名为`importantData.txt`的文件将不再出现在树中。\n\
  \n在清单 15-4 中，语句\n\n`new File(\"importantData.txt\").delete();`\n\n很巧妙。乍一看，你似乎是在创建一个新文件，然后又在同一行代码中删除它！但实际上，`new\
  \ File`这个词只是在你的程序内部创建了一个文件的表示。更准确地说，`new File`这个词在你的程序内部创建了一个磁盘文件的表示，该文件可能已经存在于你的计算机硬盘上，也可能不存在。以下是`new\
  \ File`语句的真正含义：\n\n> *\"让* `new File(\"importantData.txt\")` *引用一个名为* `importantData.txt`\
  \ *的文件。如果该文件存在，则删除它。\"*\n\n是的，细节决定成败。但微笑在于微妙之处，高尚在于细微差别。\n\n### 使用 Java 的 do 语句\n\
  \n要编写清单 15-4 中的程序，你需要一个循环——一个反复询问用户是否应该删除`importantData.txt`文件的循环。（清单 15-4 中循环的动作如图\
  \ 15-7 所示。）循环会持续询问，直到用户给出有意义的响应。循环在每次迭代结束时，即每次用户响应之后，测试其条件。\n\n![image](img/Image00190.gif)\n\
  \n图 15-7: 循环开始，do 循环。\n\n这就是为什么清单 15-4 中的程序有一个*do*循环（也称为`do … while`循环）。使用`do`循环，程序直接跳入，执行一些语句，然后检查条件。如果条件为真，程序返回循环顶部进行下一次迭代。如果条件为假，计算机离开循环（并跳转到循环之后紧接着的任何代码）。\n\
  \n#### 仔细看看 do 语句\n\n`do`循环的格式是\n\n```\ndo {\n    Statements\n} while (Condition)\n\
  ```\n\n将*条件*写在循环末尾提醒我，计算机首先执行循环内的*语句*。计算机执行完*语句*后，继续检查*条件*。如果*条件*为真，计算机返回去再次执行*语句*。\n\
  \n使用`do`循环，计算机总是至少执行一次循环内的语句：\n\n```java\n//This code prints something:\nint twoPlusTwo\
  \ = 2 + 2;\ndo {\n    System.out.println(\"Are you kidding?\");\n    System.out.println(\"\
  2+2 doesn’t equal 5.\");\n    System.out.print (\"Everyone knows that\");\n    System.out.println(\"\
  \ 2+2 equals 3.\");\n}\n```\n\n\n\n`} while (twoPlusTwo == 5);`\n\n这段代码显示 `Are you\
  \ kidding? 2+2 doesn’t equal 5 …` *等等*，然后测试条件 `twoPlusTwo == 5`。由于 `twoPlusTwo ==\
  \ 5` 为假，计算机不会返回进行下一次迭代。相反，计算机会跳转到循环之后紧接着的任何代码。\n\n![tryitout](img/Image00006.jpg)\
  \ 练习使用 Java 的 `do` 语句。\n\n#### 我听到回声了吗？\n\n在 `do` 语句中，反复从键盘读取数字。在屏幕上将每个数字显示给用户。显示一个数字后，询问用户是否要继续输入数字。当用户回复字母\
  \ `n` 时，停止。\n\n以下是程序的一次示例运行：\n\n```\nEnter a number: 5\n5\nContinue? (y/n) y\nEnter\
  \ a number: 81\n81\nContinue? (y/n) y\nEnter a number: 29\n29\nContinue? (y/n) n\n\
  Done!\n```\n\n#### 累加吧！\n\n在 `do` 语句中，反复从键盘读取 `int` 值，并记录运行总和。用户通过输入最后一个 `int` 值（即值\
  \ 0）来表示“我想停止输入值”。此时，程序显示用户输入的所有值的总和。\n\n## 使用预定值重复（Java 的增强 for 语句）\n\n大多数人说自己“从未赢过任何东西”。其他人赢了抽奖、抽签和比赛，但他们没赢过。好吧，我要告诉这些人：其他人也没赢过。没人赢过。这就是概率法则的运作方式。你赢得美国流行彩票头奖的概率大约是\
  \ 1.35 亿分之一。如果你卖掉价值 25 万美元的房子，用所有钱买彩票，你中奖的概率仍然只有 540 分之一。如果你每个月每天都玩（每天卖一栋房子），你赢得头奖的概率仍然低于\
  \ 15 分之一。\n\n当然，上一段的内容不适用于我。我不买彩票，但我经常赢。我的连胜始于几年前。在一次在线研讨会结束时，我赢得了一些昂贵的 Java 软件。同月晚些时候，我赢得了一枚支持微芯片的小指戒指（1998\
  \ 年 Java 会议的纪念品）。第二年，我赢得了一台无线 PDA。就在上周，我赢得了一台高级商务级打印机。\n\n我从不花钱参加任何比赛。所有这些奖品都是免费的。当全国计算机科学教育者会议在内华达州里诺举行时，我的同事们说服我尝试老虎机。我输了\
  \ 23 美元，然后又赢回了 18 美元。那时我停止了游戏。我只落后 5 美元，就想见好就收。\n\n这就是为什么我写一个关于老虎机的 Java 程序是如此奇怪的事情。典型的老虎机有三个卷轴，每个卷轴大约有\
  \ 20 个符号。但为了说明本节的想法，我不需要 20 个符号。相反，我使用 4 个符号——樱桃、柠檬、金桔和芜菁甘蓝。\n\n### 创建增强 for 循环\n\
  \n当你玩我的简化老虎机时，你可以旋转超过 60 种组合中的任何一种——樱桃+樱桃+金桔、芜菁甘蓝+芜菁甘蓝+芜菁甘蓝，或者其他。本章的目标是列出所有可能的组合。但首先，我向你展示另一种循环。清单\
  \ 15-5 为老虎机的符号定义了一个 `enum` 类型，并显示了一个符号列表。（关于 `enum` 类型的介绍，请参见第 10 章。）\n\n清单 15-5\
  \ 老虎机符号\n\n```\nimport static java.lang.System.out;\n\nclass ListSymbols {\n   \
  \ enum Symbol {\n        cherry, lemon, kumquat, rutabaga\n    }\n\n    public static\
  \ void main(String args[]) {\n        for (Symbol leftReel : Symbol.values()) {\n\
  \            out.println(leftReel);\n        }\n    }\n}\n```\n\n清单 15-5 使用了 Java\
  \ 的*增强 for 循环*。*增强*一词意为“与早期 Java 版本中的循环相比有所增强”。增强 `for` 循环是在 Java 5.0 中引入的。如果你运行的是\
  \ Java 1.4.2（或类似版本），则无法使用增强 `for` 循环。\n\n以下是增强 `for` 循环的格式：\n\n```\nfor (TypeName\
  \ variableName : RangeOfValues) {\n    Statements\n}\n```\n\n以下是清单 15-5 中的循环如何遵循该格式：\n\
  \n* **在清单 15-5 中，单词 `Symbol` 是一个类型的名称。**\n  `int` 类型描述诸如 –1、0、1 和 2 之类的值。`boolean`\
  \ 类型描述值 `true` 和 `false`。而（由于清单 15-5 中的代码）`Symbol` 类型描述值 `cherry`、`lemon`、`kumquat`\
  \ 和 `rutabaga`。有关像 `Symbol` 这样的 `enum` 类型的更多信息，请参见第 10 章。\n\n* **在清单 15-5 中，单词 `leftReel`\
  \ 是一个变量的名称。**\n  清单 15-1 中的循环将 `count` 定义为 `int` 变量。类似地，清单 15-5 中的循环将 `leftReel`\
  \ 定义为 `Symbol` 变量。因此，理论上，变量 `leftReel` 可以取四个 `Symbol` 值中的任何一个。\n  顺便说一下，我将这个变量命名为\
  \ `leftReel`，因为代码列出了可以出现在老虎机三个卷轴最左侧的所有符号。由于老虎机的三个卷轴都有相同的符号，我也可以将这个变量命名为 `middleReel`\
  \ 或 `rightReel`。但转念一想，我会将名称 `middleReel` 和 `rightReel` 留到后面的示例中使用。\n\n* **在清单 15-5\
  \ 中，表达式 `Symbol.values()` 代表清单 15-5 中的四个值。**\n  引用我上一段的话：“理论上，变量 `leftReel` 可以取四个\
  \ `Symbol` 值中的任何一个。” 嗯，`for` 语句的 *`RangeOfValues`* 部分将理论付诸实践。括号内的这第三项表示：“进行与 `Symbol`\
  \ 值数量相同的循环迭代，并且在每次循环迭代中，`leftReel` 变量取不同的 `Symbol` 值。”\n  因此，清单 15-5 中的循环经历了四次迭代：一次迭代中\
  \ `leftReel` 的值为 `cherry`，另一次迭代中 `leftReel` 的值为 `lemon`，第三次迭代中 `leftReel` 的值为 `kumquat`，第四次迭代中\
  \ `leftReel` 的值为 `rutabaga`。在每次迭代中，程序打印 `leftReel` 变量的值。结果如图 15-8 所示。\n\n![image](img/Image00191.gif)\n\
  \n图 15-8: 清单 15-5 中代码的输出。\n\n通常，*`someEnumTypeName.values()`* 表达式代表特定 `enum` 类型的变量可以拥有的值集合。例如，在第\
  \ 10 章 的清单 10-7 中，你可以使用表达式 `WhoWins.values()` 来引用 `home`、`visitor` 和 `neither` 值。\n\
  \n![tip](img/Image00003.jpg) 类型名称（如 `Symbol`）与类型值（如 `Symbol.values()`）之间的区别非常微妙。幸运的是，你不必担心这种区别。作为初学者，你只需在增强循环的\
  \ *`RangeOfValues`* 部分使用 `.values()` 后缀即可。\n\n### 嵌套增强 for 循环\n\n清单 15-5 以优雅的方式解决了一个简单的问题。在阅读了清单\
  \ 15-5 之后，你可能会问更复杂的问题：“我能列出老虎机四个符号的所有可能的 3 卷轴组合吗？” 是的，你可以。清单 15-6 向你展示了如何做到这一点。\n\
  \n清单 15-6 列出组合\n\n```\nimport static java.lang.System.out;\n```\n\n\n\n\n\n```\n\
  class ListCombinations {\n    enum Symbol {\n        cherry, lemon, kumquat, rutabaga\n\
  \    }\n    public static void main(String args[]) {\n        for (Symbol leftReel\
  \ : Symbol.values()) {\n            for (Symbol middleReel : Symbol.values()) {\n\
  \                for (Symbol rightReel : Symbol.values()) {\n                  \
  \  out.print(leftReel);\n                    out.print(\" \");\n               \
  \     out.print(middleReel);\n                    out.print(\" \");\n          \
  \          out.println(rightReel);\n                }\n            }\n        }\n\
  \    }\n}\n```\n\n当你运行清单 15-6 中的程序时，会得到 64 行输出。其中一些行（来自运行中间部分）显示在图 15-9 中。\n\n![image](img/Image00192.gif)\n\
  \n图 15-9： 清单 15-6 中代码的部分输出行。\n\n与清单 15-3 中的代码类似，清单 15-6 中的程序包含一个循环嵌套在另一个循环中。实际上，清单\
  \ 15-6 是一个三层嵌套循环。以下是清单 15-6 的策略：\n\n- `对于（左侧转轮可能出现的 4 个符号中的每一个），`\n- `对于（中间转轮可能出现的\
  \ 4 个符号中的每一个），`\n- `对于（右侧转轮可能出现的 4 个符号中的每一个），`\n- `显示三个转轮的符号。`\n\n你从外层循环的`cherry`符号开始。然后进入中间循环，并以`cherry`符号开始该循环。接着进入内层循环，选择`cherry`（双关语）。最后，当每个循环都设置为`cherry`时，显示`cherry\
  \ cherry cherry`组合。（参见图 15-10。）\n\n![image](img/Image00193.gif)\n\n图 15-10： 首次进入清单\
  \ 15-6 程序中的循环。\n\n显示`cherry cherry cherry`之后，你继续处理最内层循环的其他值。也就是说，将右侧转轮的值从`cherry`改为`lemon`。（参见图\
  \ 15-11。）现在三个转轮的值是`cherry cherry lemon`，于是在屏幕上显示这些值。\n\n![image](img/Image00194.gif)\n\
  \n图 15-11： 在最内层循环中从 cherry 改为 lemon。\n\n当最内层（右侧转轮）循环的四个值全部遍历完毕后，跳出该最内层循环。但跳出后回到中间循环的顶部，将`middleReel`的值从`cherry`改为`lemon`。现在`leftReel`和`middleReel`的值分别是`cherry`和`lemon`。（参见图\
  \ 15-12。）\n\n![image](img/Image00195.gif)\n\n图 15-12： 在中间循环中从 cherry 改为 lemon。\n\
  \n在中间循环改为`lemon`后，再次冲入最内层循环。就像从未见过这个内层循环一样，将循环变量设置为`cherry`。（参见图 15-13。）\n\n![image](img/Image00196.gif)\n\
  \n图 15-13： 重新启动内层循环。\n\n显示美味的`cherry lemon cherry`组合后，开始改变最内层循环的值。（参见图 15-14。）\n\
  \n![image](img/Image00197.gif)\n\n图 15-14： 第二次遍历最内层循环。\n\n循环一直进行，直到显示所有 64 种组合。呼！\n\
  \n![tryitout](img/Image00006.jpg) 为了结束本章，你将为剪刀石头布游戏编写代码。\n\n#### 枚举所有可能性\n\n创建一个`enum`类型，包含剪刀石头布游戏中的三个值。编写一个程序，使用增强型`for`循环显示这三个值。\n\
  \n#### 展示你的手势\n\n使用嵌套的增强型`for`语句，展示两名玩家在剪刀石头布游戏中相互对抗的所有可能性。程序的输出应类似如下：\n\n```\n\
  paper paper\npaper scissors\npaper stone\nscissors paper\n... 以此类推\n```\n\n## 第\
  \ 16 章\n\n## 使用循环和数组\n\n本章内容\n\n![check](img/Image00002.jpg) **最大化使用 for 循环**\n\n\
  ![check](img/Image00002.jpg) **在单个变量中存储多个值**\n\n![check](img/Image00002.jpg) **处理值组**\n\
  \n本章有十幅插图。对于这些插图，John Wiley & Sons, Inc. 的人员坚持使用以下编号：图 16-1、图 16-2、图 16-3、图 16-4、图\
  \ 16-5、图 16-6、图 16-7、图 16-8、图 16-9 和图 16-10。但我喜欢另一种编号方式。我想将插图编号为`figure[0]`、`figure[1]`、`figure[2]`、`figure[3]`、`figure[4]`、`figure[5]`、`figure[6]`、`figure[7]`、`figure[8]`和`figure[9]`。在本章中，你将了解原因。\n\
  \n## 一些循环的实际应用\n\nJava 汽车旅馆拥有十间舒适的房间，坐落在主干道旁一个安静的地方。除了一个独立的小办公室外，汽车旅馆只是一长排底层房间。每个房间都可以从宽敞的前停车场轻松进入。\n\
  \n奇怪的是，旅馆的房间编号是 0 到 9。我可以说这种编号是偶然的——与建筑商的原始设计计划有关。但事实是，从 0 开始使得本章中的示例更容易编写。\n\n\
  作为 Java 汽车旅馆的经理，你将入住数据存储在计算机硬盘上的一个文件中。该文件对应旅馆中的每个房间有一个条目。例如，在图 16-1 中，0 号房间有 1 位客人，1\
  \ 号房间有 4 位客人，2 号房间为空，以此类推。\n\n![image](img/Image00198.jpg)\n\n图 16-1： Java 汽车旅馆的入住数据。\n\
  \n你想要一份显示每个房间客人数的报告。因为你知道有多少个房间，这个问题很适合用`for`循环来解决。解决这个问题的代码在清单 16-1 中，代码的运行结果如图\
  \ 16-2 所示。\n\n![image](img/Image00199.gif)\n\n图 16-2： 运行清单 16-1 中的代码。\n\n清单 16-1\
  \ 生成入住报告的程序\n\n```\nimport java.util.Scanner;\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
  import static java.lang.System.out;\n\nclass ShowOccupancy {\n    public static\
  \ void main(String args[]) throws FileNotFoundException {\n        Scanner diskScanner\
  \ = new Scanner(new File(\"occupancy\"));\n        out.println(\"Room\\tGuests\"\
  );\n        for (int roomNum = 0; roomNum < 10; roomNum++) {\n            out.print(roomNum);\n\
  \            out.print(\"\\t\");\n            out.println(diskScanner.nextInt());\n\
  \        }\n        diskScanner.close();\n    }\n}\n```\n\n清单 16-1 使用了一个`for`循环——这是第\
  \ 15 章中描述的那种循环。随着`roomNum`变量的值从 0 递增到 9，程序从`occupancy`文件中逐个显示数字。要了解更多关于从磁盘文件（如我的`occupancy`文件）读取数字的信息，请参见第\
  \ 13 章。\n\n\n\n\n\n![remember](img/Image00005.jpg) 本示例的输入文件名为 `occupancy`，而不是 `occupancy.txt`。如果你使用\
  \ Windows 记事本创建 `occupancy` 文件，则必须在“另存为”对话框的“文件名”字段中使用引号。也就是说，你必须在“文件名”字段中输入 `\"\
  occupancy\"`（带引号）。如果不给文件名加上引号，记事本会为文件名添加默认扩展名（将 `occupancy` 变成 `occupancy.txt`）。类似的问题也适用于\
  \ Macintosh 的 TextEdit 程序。默认情况下，TextEdit 会为每个新文件添加 `.rtf` 扩展名。若要为特定文件覆盖 `.rtf` 默认设置，请选择“格式”⇒“制作纯文本”。然后，在“另存为”对话框中，取消选中“如果未提供扩展名，则使用“.txt””复选框。（若要为所有新建文件覆盖默认设置，请选择\
  \ TextEdit ⇒“偏好设置”。然后，在“偏好设置”对话框的“新建文档”选项卡的“格式”部分，选择“纯文本”。）\n\n### 在运行时决定循环的界限\n\
  \n有时，你可能希望得到比图 16-2 更简洁的报告。“别给我一长串房间列表，”你说，“只告诉我 3 号房间的客人数量。”要获得这样的报告，你需要一个稍微智能一点的程序。该程序见清单\
  \ 16-2，程序的运行结果如图 16-3 所示。\n\n![image](img/Image00200.gif)\n\n图 16-3： 几个单房间报告。\n\n\
  清单 16-2 仅报告一个房间\n\n```\nimport java.util.Scanner;\nimport java.io.File;\nimport\
  \ java.io.FileNotFoundException;\nimport static java.lang.System.out;\npublic class\
  \ ShowOneRoomOccupancy {\npublic static void main(String args[]) throws FileNotFoundException\
  \ {\nScanner keyboard = new Scanner(System.in);\nScanner diskScanner = new Scanner(new\
  \ File(\"occupancy\"));\nint whichRoom;\nout.print(\"Which room? \");\nwhichRoom\
  \ = keyboard.nextInt();\nfor (int roomNum = 0; roomNum < whichRoom; roomNum++) {\n\
  diskScanner.nextInt();\n}\nout.print(\"Room \");\nout.print(whichRoom);\nout.print(\"\
  \ has \");\nout.print(diskScanner.nextInt());\nout.println(\" guest(s).\");\nkeyboard.close();\n\
  diskScanner.close();\n}\n}\n```\n\n如果说清单 16-2 有什么寓意，那就是 `for` 循环的迭代次数可以在不同运行之间变化。清单\
  \ 16-2 中的循环会一直运行，只要计数变量 `roomNum` 小于用户指定的房间号。当 `roomNum` 等于用户指定的数字时（即 `roomNum`\
  \ 与 `whichRoom` 相同），计算机跳出循环。然后计算机从 `occupancy` 文件中再读取一个 `int` 值，并将其显示在屏幕上。\n\n当你盯着图\
  \ 16-3 中的运行结果时，务必记住房间编号的特殊性。3 号房间有两位客人，因为 3 号房间是图 16-1 中 `occupancy` 文件的*第四个*房间。这是因为汽车旅馆的房间编号为\
  \ 0 到 9。\n\n### 在 for 循环中使用各种条件\n\n看看图 16-3 中的运行结果，注意当用户错误地询问一个不存在的房间时，程序表现得很糟糕：这家汽车旅馆没有\
  \ 10 号房间。如果你询问 10 号房间的客人数量，程序会尝试读取比 `occupancy` 文件包含的更多数字。这种不幸的尝试会导致 `NoSuchElementException`。\n\
  \n清单 16-3 修复了文件结束问题。\n\n清单 16-3 单房间代码的更精细版本\n\n```\nimport java.util.Scanner;\n\
  import java.io.File;\nimport java.io.FileNotFoundException;\nimport static java.lang.System.out;\n\
  public class BetterShowOneRoom {\npublic static void main(String args[]) throws\
  \ FileNotFoundException {\nScanner keyboard = new Scanner(System.in);\nScanner diskScanner\
  \ = new Scanner(new File(\"occupancy\"));\nint whichRoom;\nout.print(\"Which room?\
  \ \");\nwhichRoom = keyboard.nextInt();\nfor (int roomNum=0; roomNum < whichRoom\
  \ && diskScanner.hasNext(); roomNum++) {\ndiskScanner.nextInt();\n}\nif (diskScanner.hasNext())\
  \ {\nout.print(\"Room \");\nout.print(whichRoom);\nout.print(\" has \");\nout.print(diskScanner.nextInt());\n\
  out.println(\" guest(s).\");\n}\nkeyboard.close();\ndiskScanner.close();\n}\n}\n\
  ```\n\n清单 16-3 中的代码并不惊天动地。要得到这段代码，你只需取清单 16-2 中的代码，并添加几个对 `occupancy` 文件结束的测试。你在每次调用\
  \ `nextInt` 之前执行 `diskScanner.hasNext` 测试。这样，如果 `nextInt` 调用注定失败，你就能在失败发生之前捕获潜在的错误。清单\
  \ 16-3 代码的几次测试运行如图 16-4 所示。\n\n![image](img/Image00201.gif)\n\n图 16-4： 错误的房间号 10\
  \ 没有得到响应。\n\n![technicalstuff](img/Image00007.jpg) 在清单 16-3 中，我想知道 occupancy 文件是否包含更多数据（我尚未读取的任何数据）。因此我调用了\
  \ `Scanner` 类的 `hasNext` 方法。`hasNext` 方法会向前查看，判断我是否可以读取任何类型的数据——`int` 值、`double`\
  \ 值、单词、`boolean` 等。这对于本节示例来说没问题，但在某些情况下，你需要对输入数据更加挑剔。例如，你可能想知道是否可以调用 `nextInt`（而不是\
  \ `nextDouble` 或 `nextLine`）。幸运的是，Java 提供了满足你最挑剔输入需求的方法。像 `if (diskScanner.hasNextInt())`\
  \ 这样的方法会测试你是否可以从磁盘文件中读取一个 `int` 值。Java 还有 `hasNextLine`、`hasNextDouble` 等方法。关于普通的\
  \ `hasNext` 方法的更多信息，请参见第 14 章。\n\n清单 16-3 中有一个庞大而复杂的条件来保持 `for` 循环继续：\n\n```\nfor\
  \ (int roomNum=0; roomNum < whichRoom && diskScanner.hasNext(); roomNum++) {\n```\n\
  \n许多 `for` 循环的条件是简单的“小于”测试，但并没有规定所有 `for` 循环条件都必须如此简单。事实上，任何表达式都可以作为 `for` 循环的条件，只要该表达式的值为\
  \ `true` 或 `false`。清单 16-3 中的条件将“小于”与对 `Scanner` 类的 `hasNext` 方法的调用结合了起来。\n\n##\
  \ 读者，认识数组；数组，认识读者\n\n一位疲惫的旅行者走到 Java 汽车旅馆的前台。“我想要一个房间，”旅行者说。于是前台服务员运行了一份类似图 16-2\
  \ 的报告。注意到列表中第一个空房间，服务员推荐了 2 号房间。“我就要它了，”旅行者说。\n\n如今找个好帮手真难。你告诉过服务员多少次要先填满编号较大的房间？编号较小的房间比较旧，而且急需维修。例如，3\
  \ 号房间有一个室内游泳池（管道漏水，地毯湿透了）。2 号房间没有暖气（至少冬天没有）。1 号房间有严重的电气问题（对于那个房间，你总是提前收费）。此外，8 号房间是空的，而且编号较大的房间收费更高。\n\
  \n这时，展示方式的一个微妙变化就能带来巨大差异。你需要一个程序来按逆序列出空房间。这样，8 号房间就会在 2 号房间之前引起服务员的注意。\n\n\n\n\n\
  思考一个程序以逆序显示数据的策略。根据图 16-1 的输入，程序的输出应类似于图 16-5 所示的显示。\n\n![image](img/Image00202.gif)\n\
  \n图 16-5： 空房间列表，编号较大的房间显示在前。\n\n以下是编程策略的第一个（糟糕）想法：\n\n- 获取`occupancy`文件中的最后一个值。\n\
  - 如果该值为 0，则打印房间号。\n- 获取`occupancy`文件中倒数第二个值。\n- 如果该值为 0，则打印房间号。\n- ……以此类推。\n\n借助一些花哨的输入/输出程序，这个策略或许可行。但无论使用何种输入/输出程序，直接跳转到文件末尾或中间都是一件非常麻烦的事。如果你打算反复跳转，那就更糟糕了。所以，回到绘图板，想一个更好的办法。\n\
  \n这里有一个想法！读取`occupancy`文件中的所有值，并将每个值存储到各自的变量中。然后按逆序遍历这些变量，在适当的时候显示房间号。\n\n这个想法可行，但代码丑陋不堪，我拒绝将其称为“清单”来赋予它尊严。不，这只是一个“请看以下代码”之类的东西。所以，请看下面这段丑陋的代码：\n\
  \n```\n/*\n * 呃！我受不了这段丑陋的代码！\n */\nguestsIn0 = diskScanner.nextInt();\nguestsIn1\
  \ = diskScanner.nextInt();\nguestsIn2 = diskScanner.nextInt();\nguestsIn3 = diskScanner.nextInt();\n\
  guestsIn4 = diskScanner.nextInt();\nguestsIn5 = diskScanner.nextInt();\nguestsIn6\
  \ = diskScanner.nextInt();\nguestsIn7 = diskScanner.nextInt();\nguestsIn8 = diskScanner.nextInt();\n\
  guestsIn9 = diskScanner.nextInt();\nif (guestsIn9 == 0) {\n    System.out.println(9);\n\
  }\nif (guestsIn8 == 0) {\n    System.out.println(8);\n}\nif (guestsIn7 == 0) {\n\
  \    System.out.println(7);\n}\nif (guestsIn6 == 0) {\n    // ……以此类推。\n```\n\n你缺少的是一种统一命名十个变量的方式。也就是说，如果能写成这样就好了：\n\
  \n```\n/*\n * 好主意，但这不是真正的 Java 代码：\n */\n// 正向读取\nfor (int roomNum = 0; roomNum\
  \ < 10; roomNum++) {\n    guestsIn roomNum = diskScanner.nextInt();\n}\n// 反向写入\n\
  for (int roomNum = 9; roomNum >= 0; roomNum--) {\n    if (guestsIn roomNum == 0)\
  \ {\n        System.out.println( roomNum );\n    }\n}\n```\n\n好吧，你可以编写这种循环。你只需要一些方括号。当你将方括号添加到上述代码的想法中时，你就得到了所谓的数组。*数组*是一行值，就像一层汽车旅馆的一排房间。要想象数组，只需想象\
  \ Java 汽车旅馆：\n\n- 首先，想象房间一个挨着一个排列。\n- 接着，想象同样的房间，但前墙不见了。在每个房间里，你可以看到一定数量的客人。\n-\
  \ 如果可以的话，忘记 9 号房间里的两个客人正在把一堆钞票放进一个大公文包。忽略 5 号房间的客人已经一天半没离开电视机的事实。抛开所有这些细节，只看数字。在每个房间里，看到一个代表该房间客人数的数字。（如果自由想象不是你的强项，请看图\
  \ 16-6。）\n\n![image](img/Image00203.jpg)\n\n图 16-6： Java 汽车旅馆房间的抽象快照。\n\n用 Java\
  \ 编程的行话来说，整排房间被称为*数组*。数组中的每个房间被称为数组的*组件*（也称为数组*元素*）。每个组件关联两个数字：\n\n- **索引：** 在 Java\
  \ 汽车旅馆数组中，索引就是房间号（从 0 到 9 的数字）。\n- **值：** 在 Java 汽车旅馆数组中，值就是给定房间中的客人数（存储在数组组件中的数字）。\n\
  \n使用数组可以避免声明十个单独的变量：`guestsIn0`、`guestsIn1`、`guestsIn2` 等等。要声明一个包含十个值的数组，你可以写两行相当短的代码：\n\
  \n```\nint guestsIn[];\nguestsIn = new int[10];\n```\n\n你甚至可以将这两行合并成一行更长的代码：\n\n\
  ```\nint guestsIn[] = new int[10];\n```\n\n在这两段代码中，注意使用了数字 `10`。这个数字告诉计算机让 `guestsIn`\
  \ 数组拥有十个组件。数组的每个组件都有自己的名称。起始组件名为 `guestsIn[0]`，下一个名为 `guestsIn[1]`，以此类推。十个组件中的最后一个名为\
  \ `guestsIn[9]`。\n\n![remember](img/Image00005.jpg) 在创建数组时，你总是要指定组件的数量。数组的索引总是从\
  \ 0 开始，到比组件总数少一的数字结束。例如，如果你的数组有十个组件（并且你用 `new int[10]` 声明了数组），那么数组的索引范围是从 0 到 9。\n\
  \n![tip](img/Image00003.jpg) 当你创建数组变量时，你可以将方括号放在类型名之后或变量名之后。换句话说，你可以写成\n\n```\n\
  int guestsIn[];\n```\n\n就像我在本节中所做的那样，或者你也可以写成\n\n```\nint[] guestsIn;\n```\n\n就像一些程序员所做的那样。无论哪种方式，你定义的都是完全相同的数组变量。同样，你会看到\n\
  \n`public static void main(String args[])`\n\n也会看到\n\n`public static void main(String[]\
  \ args)`\n\n这两个方法头具有完全相同的含义。\n\n### 在数组中存储值\n\n创建数组后，你可以将值放入数组的组件中。例如，6 号房间的客人受够了你在别人床上放的那些薄荷糖。于是他们退房了，6\
  \ 号房间变成了空房。你应该将值 `0` 放入第 `6` 个组件。你可以用这个赋值语句来实现：\n\n```\nguestsIn[6] = 0;\n```\n\n\
  某个工作日，生意惨淡。汽车旅馆里没有客人。但随后你走运了：一辆大巴停在了汽车旅馆前。大巴侧面挂着“孤独者大会”的牌子。从车上下来 25 个人，每个人都走向汽车旅馆的小办公室，没有人注意车上的其他人。每个人都想要一个单独的房间。其中只有\
  \ 10 个人能住进 Java 汽车旅馆，但这没关系，因为你可以把另外 15 个孤独者送到路边的老 C 侧度假村和汽车旅馆。\n\n总之，为了在 Java 汽车旅馆登记这十个孤独者，你给每个房间安排了一位客人。创建数组后，你可以利用数组的索引编写一个\
  \ `for` 循环，如下所示：\n\n```\nfor (int roomNum = 0; roomNum < 10; roomNum++) {\n    guestsIn[roomNum]\
  \ = 1;\n}\n```\n\n这个循环代替了十个赋值语句，因为计算机执行了十次 `guestsIn[roomNum] = 1` 这条语句。第一次循环时，`roomNum`\
  \ 的值为 `0`，因此实际上计算机执行了\n\n```\nguestsIn[0] = 1;\n```\n\n在下一次循环迭代中，`roomNum` 的值为 `1`，因此计算机执行了相当于以下语句的操作：\n\
  \n```\nguestsIn[1] = 1;\n```\n\n在下一次迭代中，计算机的行为就像在执行\n\n```\nguestsIn[2] = 1;\n```\n\
  \n以此类推。当 `roomNum` 变为 9 时，计算机执行了相当于以下语句的操作：\n\n```\nguestsIn[9] = 1;\n```\n\n注意，循环的计数器从\
  \ 0 到 9。将此与图 16-6 进行比较，并记住数组的索引从 0 到比数组组件数少一的数字。使用从 0 到 9 的房间号进行循环，覆盖了 Java 汽车旅馆的所有房间。\n\
  \n\n\n\n![记住](img/Image00005.jpg) 当你处理数组时，使用 `for` 循环遍历数组的各个元素，通常会将循环的计数器变量初始化为\
  \ 0。为了形成测试是否继续迭代的条件，你经常会写出像 `roomNum < arraySize` 这样的表达式，其中 `arraySize` 是数组中的元素个数。\n\
  \n### 创建报告\n\n图 16-5 中用于创建报告的代码如代码清单 16-4 所示。这个新程序采用了世界上最丑陋代码（几页前的代码，包含变量 `guestsIn0`、`guestsIn1`\
  \ 等）的思路。但不再使用十个独立的变量，代码清单 16-4 使用了一个数组。\n\n代码清单 16-4 向前和向后遍历数据\n\n```java\nimport\
  \ java.util.Scanner;\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
  \nclass VacanciesInReverse {\n    public static void main(String args[]) throws\
  \ FileNotFoundException {\n        Scanner diskScanner = new Scanner(new File(\"\
  occupancy\"));\n        int guestsIn[];\n        guestsIn = new int[10];\n     \
  \   for (int roomNum = 0; roomNum < 10; roomNum++) {\n            guestsIn[roomNum]\
  \ = diskScanner.nextInt();\n        }\n        for (int roomNum = 9; roomNum >=\
  \ 0; roomNum--) {\n            if (guestsIn[roomNum] == 0) {\n                System.out.print(\"\
  Room \");\n                System.out.print(roomNum);\n                System.out.println(\"\
  \ is vacant.\");\n            }\n        }\n        diskScanner.close();\n    }\n\
  }\n```\n\n注意 `VacanciesInReverse` 程序第二个 `for` 循环括号中的内容。这些内容很容易搞错。你的目标是让循环依次检查房间\
  \ 9、房间 8，以此类推。\n\n```java\nif (guestsIn[9] == 0) {\n    System.out.print(roomNum);\n\
  }\nif (guestsIn[8] == 0) {\n    System.out.print(roomNum);\n}\nif (guestsIn[7] ==\
  \ 0) {\n    System.out.print(roomNum);\n}\n```\n\n……依此类推，直到……\n\n```java\nif (guestsIn[0]\
  \ == 0) {\n    System.out.print(roomNum);\n}\n```\n\n关于代码的一些观察：\n\n*   循环的计数器必须从\
  \ 9 开始：\n\n    `for (int roomNum = 9; roomNum >= 0; roomNum--)`\n\n*   每次循环，计数器*递减*\
  \ 1：\n\n    `for (int roomNum = 9; roomNum >= 0; roomNum--)`\n\n*   只要计数器*大于或等于*\
  \ 0，循环就继续：\n\n    `for (int roomNum = 9; roomNum >= 0; roomNum--)`\n\n仔细思考这三项，你就能写出完美的\
  \ `for` 循环。\n\n### 初始化数组\n\n在代码清单 16-4 中，你通过反复从磁盘文件读取数字并逐个元素存储到数组中，将值放入 `guestsIn`\
  \ 数组。有一种更简单的方法可以将值放入数组。当你声明数组时，可以提供*数组初始化*。具体做法如下：\n\n```java\nclass VacanciesInReverse\
  \ {\n    public static void main(String args[]) {\n        int guestsIn[] = {1,\
  \ 4, 0, 2, 2, 1, 4, 3, 0, 2};\n        for (int roomNum = 9; roomNum >= 0; roomNum--)\
  \ {\n            if (guestsIn[roomNum] == 0) {\n                System.out.print(\"\
  Room \");\n                System.out.print(roomNum);\n                System.out.println(\"\
  \ is vacant.\");\n            }\n        }\n    }\n}\n```\n\n在这段代码中，加粗的初始化行告诉 Java\
  \ 将 1 放入 `guestsIn[0]`，4 放入 `guests[1]`，0 放入 `guestsIn[2]`，以此类推。这种替代代码清单 16-4 的方法不使用磁盘文件，只需要一个循环。\n\
  \n在本章的酒店房间示例中，我没有使用数组初始化，因为将值存储在文件中更贴近实际。但你可以在自己的程序中使用数组初始化。\n\n![警告](img/Image00004.jpg)\
  \ 本节描述的特性之所以称为*初始化*，是因为你不能将其用作赋值的一部分。换句话说，你可以写\n\n```java\nint guestsIn[] = {1,\
  \ 4, 0, 2, 2, 1, 4, 3, 0, 2};\n```\n\n但不能写\n\n```java\n// Don’t do this:\nint guestsIn[];\n\
  guestsIn = {1, 4, 0, 2, 2, 1, 4, 3, 0, 2};\n```\n\n在数组声明结束后，就不能再使用花括号将值放入数组了。\n\n\
  ## 使用数组\n\n在本章前面，一车独行客来到了你的汽车旅馆。当他们终于离开时，你很高兴摆脱了他们，即使这意味着你的所有房间会空置一段时间。但现在又有一辆巴士驶入停车场。这辆巴士上挂着格雷加里安俱乐部的标志。车上下来\
  \ 50 个人，一个比一个爱社交。现在停车场里的每个人都吵着要见其他人。他们一边见面打招呼，一边嬉闹着涌向前台，唱着俱乐部的主题曲。（哦不！是格雷加里安圣歌！）\n\
  \n前五个格雷加里安人都想要 7 号房间。虽然挤了点，但你本来也不太在意消防法规。接着来了三个人，他们特别想要 0 号房间。（他们是程序员，觉得这个房间号很可爱。）然后是一群四个格雷加里安人，想要\
  \ 3 号房间。（房间里的游泳池对他们很有吸引力。）\n\n面对这么多人，你最好打开电脑。你启动一个程序，可以输入新的入住数据。该程序有五个部分：\n\n* \
  \  **创建一个数组，然后将** 0 **放入数组的每个元素中。**\n\n    当独行客俱乐部的成员离开时，汽车旅馆突然空了。（见鬼，甚至在独行客俱乐部成员离开之前，旅馆就已经显得空荡荡了。）要声明一个数组并用零填充，你可以执行如下代码：\n\
  \n    ```java\n    int guestsIn[];\n    guestsIn = new int[10];\n    for (int roomNum\
  \ = 0; roomNum < 10; roomNum++) {\n        guestsIn[roomNum] = 0;\n    }\n    ```\n\
  \n*   **获取一个房间号，然后获取将入住该房间的客人数量。**\n\n    读取用户输入的数字是相当乏味的事情。做一些提示，调用几次 `nextInt`，就搞定了：\n\
  \n    ```java\n    out.print(\"Room number: \");\n    whichRoom = keyboard.nextInt();\n\
  \    out.print(\"How many guests? \");\n    numGuests = keyboard.nextInt();\n  \
  \  ```\n\n*   **使用房间号和客人数量来修改数组中的值。**\n\n    在本章前面，要将一位客人放入 2 号房间，你执行了\n\n    `guestsIn[2]\
  \ = 1;`\n\n    现在你有两个变量：`numGuests` 和 `whichRoom`。假设 `numGuests` 是 `5`，`whichRoom`\
  \ 是 `7`。要将 `numGuests` 放入 `whichRoom`（即，将五位客人放入 7 号房间），你可以执行\n\n    `guestsIn[whichRoom]\
  \ = numGuests;`\n\n    这是新程序设计中的关键步骤。\n\n*   **询问用户程序是否应该继续。**\n\n    是否还有更多客人要安排房间？要了解这一点，执行以下代码：\n\
  \n    ```java\n    out.print(\"Do another? \");\n    } while (keyboard.findWithinHorizon(\"\
  .\",0).charAt(0) == 'Y');\n    ```\n\n*   **显示每个房间的客人数量。**\n\n    没问题！你已经做过这个了。你可以（几乎逐字地）从代码清单\
  \ 16-1 中借用代码：\n\n    ```java\n    out.println(\"Room\\tGuests\");\n    for (int\
  \ roomNum = 0; roomNum < 10; roomNum++) {\n        out.print(roomNum);\n       \
  \ out.print(\"\\t\");\n        out.println(guestsIn[roomNum]);\n    }\n    ```\n\
  \n    这段最新代码片段与代码清单 16-1 中的内容唯一的区别是，新代码使用了 `guestsIn` 数组。第一次循环时，代码执行\n\n    `out.println(guestsIn[0]);`\n\
  \n    显示 0 号房间的客人数量。第二次循环时，代码执行\n\n    `out.println(guestsIn[1]);`\n\n    显示 1 号房间的客人数量。最后一次循环时，代码执行\n\
  \n    `out.println(guestsIn[9]);`\n\n    完美。\n\n完整的程序（将这五个部分组合在一起）见代码清单 16-5。程序的运行结果如图\
  \ 16-7 所示。\n\n![图片](img/Image00204.gif)\n\n\n\n\n\n图 16-7： 运行清单 16-5 中的代码。\n\n清单\
  \ 16-5 将入住数据存储在数组中\n\n```\nimport java.util.Scanner;\nimport static java.lang.System.out;\n\
  class AddGuests {\n    public static void main(String args[]) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        int whichRoom, numGuests;\n      \
  \  int guestsIn[];\n        guestsIn = new int[10];\n        for (int roomNum =\
  \ 0; roomNum < 10; roomNum++) {\n            guestsIn[roomNum] = 0;\n        }\n\
  \        do {\n            out.print(\"Room number: \");\n            whichRoom\
  \ = keyboard.nextInt();\n            out.print(\"How many guests? \");\n       \
  \     numGuests = keyboard.nextInt();\n            guestsIn[whichRoom] = numGuests;\n\
  \            out.println();\n            out.print(\"Do another? \");\n        }\
  \ while (keyboard.findWithinHorizon(\".\",0).charAt(0) == ’Y’);\n        out.println();\n\
  \        out.println(\"Room\\tGuests\");\n        for (int roomNum = 0; roomNum\
  \ < 10; roomNum++) {\n            out.print(roomNum);\n            out.print(\"\\\
  t\");\n            out.println(guestsIn[roomNum]);\n        }\n        keyboard.close();\n\
  \    }\n}\n```\n\n嘿！清单 16-5 中的程序相当大！它可能是本书迄今为止最大的程序。但*大*并不一定意味着*难*。如果程序的每个部分都有意义，你可以独立创建每个部分，然后将所有部分拼在一起。瞧！代码就变得可控了。\n\
  \n## 循环风格\n\n第 15 章的清单 15-6 使用增强型 `for` 循环来遍历一组值。在那个程序中，这些值属于 `enum` 类型。嗯，本章也处理一组值——即数组中的值。所以，如果我向你展示一个遍历数组值的增强型\
  \ `for` 循环，你可能不会感到惊讶。\n\n要查看这样的循环，请从清单 16-5 中的代码开始。该程序中的最后一个循环看起来像这样：\n\n```\nfor\
  \ (int roomNum = 0; roomNum < 10; roomNum++) {\n    out.println(guestsIn[roomNum]);\n\
  }\n```\n\n要将其转换为增强型 `for` 循环，你需要创建一个新的变量名。（`howMany` 这个名字怎么样？我喜欢这个名字。）无论你选择什么名字，新变量都会遍历\
  \ `guestsIn` 数组中的值。\n\n```\nfor (int howMany : guestsIn) {\n    out.println(howMany);\n\
  }\n```\n\n这个增强型循环使用与第 15 章中循环相同的格式。\n\n```\nfor (*类型名 变量名* : *值范围*) {\n    *语句*\n\
  }\n```\n\n在第 15 章中，`值范围`属于枚举类型。但在本章的例子中，`值范围`属于数组。\n\n增强型 `for` 循环简洁明了。但不要急于在数组中使用增强型循环。这个特性有一些讨厌的限制。例如，我的新\
  \ `howMany` 循环不显示房间号。我避免显示房间号，因为我的 `guestsIn` 数组中的房间号是索引 0 到 9。不幸的是，增强型循环无法轻松访问数组的索引。\n\
  \n还有另一个令人不快的意外。从清单 16-4 中的以下循环开始：\n\n```\nfor (int roomNum = 0; roomNum < 10; roomNum++)\
  \ {\n    guestsIn[roomNum] = diskScanner.nextInt();\n}\n```\n\n将这个传统的 `for` 循环转换为增强型\
  \ `for` 循环，你会得到以下误导性的代码：\n\n```\nfor (int howMany : guestsIn) {\n    howMany = diskScanner.nextInt();\
  \ //不要这样做\n}\n```\n\n新的增强型 `for` 循环并没有达到你想要的效果。这个循环从输入文件中读取值，然后将这些值丢进垃圾桶。最终，数组中的值保持不变。\n\
  \n这很遗憾，但却是事实。要充分利用数组，你必须回到 Java 传统的 `for` 循环。\n\n## 删除多个文件\n\n第 15 章中的一个程序删除了一个名为\
  \ `importantData.txt` 的文件。删除该文件的代码如下：\n\n```\nnew File(\"importantData.txt\").delete();\n\
  ```\n\n在这段代码中，`new File` 调用指向单个文件。这段代码很好，但它没有告诉你如何删除一堆文件。如何编写代码一次处理多个文件？\n\n幸运的是，Java\
  \ 提供了处理多个文件的方法。一种方法是使用 `File` 对象数组。清单 16-6 包含一个说明此想法的程序。\n\n清单 16-6 删除所有 `.txt`\
  \ 文件\n\n```\nimport java.io.File;\nclass IHateTxtFiles {\n    public static void\
  \ main(String args[]) {\n        File folder = new File(\".\");\n        for (File\
  \ file : folder.listFiles()) {\n            if (file.getName().endsWith(\".txt\"\
  )) {\n                file.delete();\n            }\n        }\n    }\n}\n```\n\n\
  在许多操作系统（包括 Windows、Mac OS 和 Linux）中，单个点代表当前工作目录：程序开始查找文件的位置。对于在 Eclipse 中运行的 Java\
  \ 程序，此工作目录是项目的根目录。例如，假设清单 16-6 中的代码位于名为 `16-06` 的 Eclipse 项目中。那么你的硬盘上有一个名为 `16-06`\
  \ 的文件夹，其中包含一个名为 `src` 的文件夹，而 `src` 文件夹中又包含 `IHateTxtFiles.java` 文件。（参见图 16-8。）程序的工作目录是\
  \ `16-06` 目录。因此，在清单 16-6 中，代码\n\n```\nfolder = new File(\".\")\n```\n\n使 `folder`\
  \ 引用名为 `16-06` 的目录。\n\n![image](img/Image00205.jpg)\n\n图 16-8： 你的项目位于名为 `16-06`\
  \ 的文件夹中。\n\n![technicalstuff](img/Image00007.jpg) 如果你读完了上一段，我知道你在想什么。“项目的根目录 `16-06`\
  \ 是一个文件夹，而不是文件。但清单 16-6 中的代码说 `folder = new File(\".\")`。为什么代码不说 `folder = new Folder(\"\
  .\")` 呢？”嗯，很高兴你问这个问题。事实证明，大多数操作系统模糊了文件夹和文件之间的区别。对于 Java 来说，文档 `IHateTxtFiles.java`\
  \ 是一个文件，名为 `src` 的文件夹也是一种文件，名为 `16-06` 的文件夹也是一种文件。\n\n在 Java 中，每个 `File` 对象都有一个\
  \ `listFiles` 方法，当你调用 `folder.listFiles()` 时，你会得到一个数组。数组中存储的每个“值”都是 `folder` 中的一个文件。在清单\
  \ 16-6 中，增强型 `for` 循环的格式与上一节中的循环相同。\n\n```\nfor (*类型名 变量名* : *值范围*) {\n    *语句*\n\
  }\n```\n\n在清单 16-6 中，`值范围`是一个数组。该数组包含 `16-06` 项目目录中的所有文件。因此，增强型 `for` 循环会取出 `16-06`\
  \ 目录中的每个文件，并询问：“这个文件的名称是否以 `.txt` 结尾？”\n\n```\nif (file.getName().endsWith(\".txt\"\
  ))\n```\n\n如果某个文件的名称以 `.txt` 结尾，则删除该文件：\n\n```\nfile.delete();\n```\n\n图 16-9 和\
  \ 16-10 展示了 Eclipse 包资源管理器中的“之前”和“之后”图片。在运行本节示例之前，`16-06` 目录包含名为 `src`、`aFile.txt`、`save.me`\
  \ 和 `xFile.txt` 的内容。运行本节示例之后，`16-06` 目录仍然包含 `src` 和 `save.me`，但不再包含 `aFile.txt`\
  \ 或 `xFile.txt`。\n\n![image](img/Image00206.jpg)\n\n图 16-9： 使用我们的 `.txt` 文件删除产品之前，你丑陋的项目。\n\
  \n![image](img/Image00207.jpg)\n\n图 16-10： 使用我们的 `.txt` 文件删除产品之后，你可爱的项目。\n\n\n\n\
  \n\n![记住](img/Image00005.jpg) 运行本节程序后，你可能在 Eclipse 的包资源管理器中看不到任何变化。要验证项目目录中不再包含\
  \ `.txt` 文件，请在包资源管理器中选择 `16-06` 分支。然后，在 Eclipse 的主菜单中，选择 文件 ⇒ 刷新。\n\n![技术细节](img/Image00007.jpg)\
  \ Eclipse 的包资源管理器看起来像是在显示硬盘驱动器某部分的所有文件和文件夹。但外表可能具有欺骗性。包资源管理器中的某些分支既不代表文件也不代表文件夹。（例如，在图\
  \ 16-9 和图 16-10 中，`JRE 系统库` 分支代表一组相关文件——这些文件可能并不都在同一个目录中。）而且，硬盘驱动器上的某些文件和文件夹不会出现在\
  \ Eclipse 的包资源管理器中。（除了像 `src` 这样出现在 Eclipse 包资源管理器中的内容外，项目文件夹通常还包含名为 `.classpath`\
  \ 和 `.project` 的文件，以及名为 `.settings` 和 `bin` 的文件夹。这些额外的文件和文件夹通常不会显示在 Eclipse 的包资源管理器中。）\n\
  \n![技术细节](img/Image00007.jpg) 当你调用 `folder.listFiles()` 时，生成的数组不包含 `folder` 目录子目录中的任何内容。为了确认这一点，我在\
  \ `16-06` 项目的 `src` 目录中创建了 `dFile.txt`，然后运行了本节的示例。程序运行后，`dFile.txt` 没有被删除。\n\n![试试看](img/Image00006.jpg)\
  \ 想锻炼一下数组技能吗？如果是，这里有一些可以尝试的内容。\n\n#### 初始化数组\n\n本实验分为三个部分：\n\n*   运行以下程序，了解数组初始化是如何工作的：\n\
  \n    ```\n    public class Main {\n        public static void main(String[] args)\
  \ {\n            int[] myArray = { 9, 21, 35, 16, 21, 7 };\n            System.out.println(myArray[0]);\n\
  \            System.out.println(myArray[1]);\n            System.out.println(myArray[5]);\n\
  \            // System.out.println(myArray[6]);\n        }\n    }\n    ```\n\n*\
  \   如果取消前一个要点程序中最后一个 `System.out.println` 调用的注释，然后运行程序，会发生什么？为什么会这样？\n\n*   如果尝试将第一个要点程序中的一行代码替换为两行代码，会发生什么？\n\
  \n    ```\n    int[] myArray;\n    myArray = { 9, 21, 35, 16, 21, 7 };\n    ```\n\
  \n    这是否解释了为什么数组初始化不被称为数组赋值？\n\n#### 选择一个元素\n\n创建一个包含以下数组初始化的程序：\n\n```\nint amounts[]\
  \ = {19, 21, 16, 14, 99, 86, 31, 19, 0, 101};\n```\n\n在程序中，要求用户输入一个位置编号——一个从 0 到\
  \ 9 的数字。让程序通过显示 `amounts` 数组中该位置的值来响应。例如，如果用户输入 0，程序显示 19。如果用户输入 1，程序显示 21。以此类推。\n\
  \n#### 显示所有元素\n\n创建一个包含以下数组初始化的程序：\n\n```\nint amounts[] = {19, 21, 16, 14, 99,\
  \ 86, 31, 19, 0, 101};\n```\n\n添加代码以显示数组中的所有索引和值。输出的前三行应如下所示：\n\n```\nThe 0 element’s\
  \ value is 19.\nThe 1 element’s value is 21.\nThe 2 element’s value is 16.\n```\n\
  \n#### 显示部分元素\n\n创建一个包含以下数组初始化的程序：\n\n```\nint amounts[] = {19, 21, 16, 14, 99,\
  \ 86, 31, 19, 0, 101};\n```\n\n添加一个循环，显示数组中偶数位置的值。程序的输出为 `19 16 99 31 0`。\n\n####\
  \ 生成平方数\n\n我创建了一个程序，使用循环生成前 50 个完全平方数的数组。以下是我的程序，其中缺少一些代码：\n\n```\npublic class\
  \ Main {\n    public static void main(String[] args) {\n        int squares[] =\
  \ ___________;\n        for (______________________) {\n            squares[i] =\
  \ _____;\n        }\n        System.out.println(squares[0]);\n        System.out.println(squares[1]);\n\
  \        System.out.println(squares[2]);\n        System.out.println(squares[49]);\n\
  \    }\n}\n```\n\n填写缺失的代码。运行程序时，输出如下：\n\n```\n0\n1\n4\n2401\n```\n\n#### 找到一个空房\n\
  \n有人来到前台要求一个房间。酒店职员不需要所有空房的列表。职员只需要一个空房的编号。任何空房都可以。修改清单 16-4 中的代码，使其只显示一个房间号（当前空房的编号）。\n\
  \n#### 选择一个房间\n\n修改清单 16-5 中的代码，使其不询问用户要将客人安排到哪个房间号。代码自动从当前空房中选择一个房间。\n\n#### 有多少客人？\n\
  \n修改清单 16-4 或清单 16-5 中的代码，使程序显示汽车旅馆中的客人总数。（为此，代码将每个房间的客人数量相加。）\n\n#### 并行数组\n\n\
  创建一个新的 Eclipse 项目，并将以下代码放入项目的 `main` 方法中：\n\n```\nchar[] cipher = { ’s’, ’f’, ’k’,\
  \ ’l’, ’d’, ’o’, ’h’, ’z’, ’m’, ’b’,\n    ’t’, ’a’, ’n’, ’g’, ’u’, ’v’, ’i’, ’q’,\
  \ ’x’, ’w’, ’y’, ’c’,\n    ’j’, ’r’, ’p’, ’e’ };\nchar[] plain = { ’e’, ’q’, ’s’,\
  \ ’f’, ’i’, ’n’, ’h’, ’u’, ’r’, ’k’,\n    ’g’, ’z’, ’c’, ’y’, ’x’, ’l’, ’m’, ’d’,\
  \ ’w’, ’a’, ’b’, ’t’,\n    ’p’, ’j’, ’v’, ’o’ };\n```\n\n这段代码创建了两个数组。在第一个数组中，`cipher[0]`\
  \ 是 `’s’`，`cipher[1]` 是 `’f’`，`cipher[2]` 是 `’k’`，以此类推。在第二个数组中，`plain[0]` 是 `’e’`，`plain[1]`\
  \ 是 `’q’`，`plain[2]` 是 `’s’`，以此类推。\n\n完成 `main` 方法的编写，使得当用户输入一个小写字母时，程序在 `cipher`\
  \ 数组中查找该字母，并通过显示 `plain` 数组中对应的字母来响应。\n\n例如，如果用户输入字母 `s`，程序回复字母 `e`。（程序发现 `s` 在\
  \ `cipher` 数组的第 0 位，因此程序显示 `plain` 数组第 0 位的字母。而 `plain` 数组第 0 位的字母是 `e`。）\n\n类似地，如果用户输入\
  \ `f`，程序显示 `q`，因为 `f` 在 `cipher` 数组的第 1 位，而 `q` 在 `plain` 数组的第 1 位。\n\n#### 解密密文\n\
  \n对于所有密文爱好者来说，这是一个具有挑战性的任务！将你在之前的“并行数组”实验中编写的代码放入一个循环中。让用户输入一个单词，紧接着输入一个空格。当用户按下回车键时，程序重复执行并行数组实验中的代码。程序在\
  \ `cipher` 数组中查找用户输入的所有字母，并显示对应的 `plain` 数组字母。例如，如果用户输入 `rwpw`，程序响应显示单词 `java`。\n\
