  ### 静态方法\n\n你有一叠支票。每张支票都有一个编号、一个金额和一个收款人。你用你自己的打印机打印这些支票。要打印支票，你使用一个 Java 类。由 `Check`\
  \ 类创建的每个对象都有三个字段（`number`、`amount` 和 `payee`）。每个对象都有一个方法（`print` 方法）。你可以在图 18-7\
  \ 中看到所有这些。\n\n![image](img/Image00222.jpg)\n\n图 18-7： `Check` 类和一些支票对象。\n\n你希望按编号顺序打印支票。因此你需要一个\
  \ `sort` 方法来对支票进行排序。如果图 18-7 中的支票被排序，那么编号为 1699 的支票将排在第一位，而编号为 1705 的支票将排在最后。\n\n\
  关键问题是，每张支票是否都应该有自己的 `sort` 方法？编号为 1699 的支票需要对自己进行排序吗？答案是否定的。有些方法根本不应该属于类中的对象。\n\n\
  那么这些方法属于哪里？如何在不给每张支票创建单独的 `sort` 方法的情况下拥有一个 `sort` 方法？\n\n答案如下：将 `sort` 方法设为 `static`。任何静态的东西都属于整个类，而不属于类的任何特定实例。如果\
  \ `sort` 方法是静态的，那么整个 `Check` 类只有一个 `sort` 方法的副本。这个副本与整个 `Check` 类共存。无论你创建多少个 `Check`\
  \ 类的实例——三个、十个或零个——你只有一个 `sort` 方法。\n\n关于这个概念，请参考图 18-7。整个类只有一个 `sort` 方法。因此 `sort`\
  \ 方法是静态的。无论你如何调用 `sort` 方法，该方法都使用相同的值来完成其工作。\n\n当然，每个单独的支票（每个对象，图 18-7 中表格的每一行）仍然有自己的\
  \ `number`、自己的 `amount`、自己的 `payee` 以及自己的 `print` 方法。当你 `print` 第一张支票时，你会得到一个金额；当你\
  \ `print` 第二张支票时，你会得到另一个金额。因为每个对象都有一个 `number`、一个 `amount`、一个 `payee` 和一个 `print`\
  \ 方法，所以我称这些东西为 `non-static`。我称它们为非静态是因为……嗯……因为它们不是静态的。\n\n### 调用静态和非静态方法\n\n在本书中，我第一次使用\
  \ `static` 这个词是在清单 3-1 中。我在每个 `main` 方法中都使用了 `static`（本书的清单中有很多 `main` 方法）。在 Java\
  \ 中，你的 `main` 方法必须是静态的。事情就是这样。\n\n要调用静态方法，你使用类名加一个点号。这与调用非静态方法的方式略有不同：\n\n*   **要调用普通（非静态）方法，你在对象后面加一个点号。**\n\
  \n    例如，处理图 18-7 中支票的程序可能包含以下代码：\n\n    ```\n    Check firstCheck;\n    firstCheck.number\
  \ = 1705;\n    firstCheck.amount = 25.09;\n    firstCheck.payee = \"The Butcher\"\
  ;\n    firstCheck.print();\n    ```\n\n*   **要调用类的静态方法，你在类名后面加一个点号。**\n\n    例如，要对图\
  \ 18-7 中的支票进行排序，你可以调用 `Check.sort();`\n\n### 将字符串转换为数字\n\n清单 18-5 中的代码引入了一个名为 `equals`\
  \ 的非静态方法。要比较 `password` 字符串和 `userInput` 字符串，你需要在两个字符串对象之一前面加上 `.equals`。在清单 18-5\
  \ 中，我在 `password` 对象前面加上了 `.equals`：\n\n`if (password.equals(userInput))`\n\n每个字符串对象都有自己的\
  \ `equals` 方法，因此我也可以通过编写以下代码达到相同效果：\n\n`if (userInput.equals(password))`\n\n但 Java\
  \ 还有另一个名为 `Integer` 的类，整个 `Integer` 类有一个名为 `parseInt` 的静态方法。如果有人给你一个字符串，你想把这个字符串转换为\
  \ `int` 值，你可以调用 `Integer` 类的 `parseInt` 方法。清单 18-6 有一个小例子。\n\n清单 18-6 更多筹码，谢谢\n\n\
  ```\nimport java.util.Scanner;\nimport static java.lang.System.out;\n\nclass AddChips\
  \ {\n    public static void main(String args[]) {\n        Scanner keyboard = new\
  \ Scanner(System.in);\n        String reply;\n        int numberOfChips;\n     \
  \   out.print(\"How many chips do you have?\");\n        out.print(\" (Type a number,\"\
  );\n        out.print(\" or type 'Not playing') \");\n        reply = keyboard.nextLine();\n\
  \        if (!reply.equals(\"Not playing\")) {\n            numberOfChips = Integer.parseInt(reply);\n\
  \            numberOfChips += 10;\n            out.print(\"You now have \");\n \
  \           out.print(numberOfChips);\n            out.println(\" chips.\");\n \
  \       }\n        keyboard.close();\n    }\n}\n```\n\n清单 18-6 中代码的几次运行结果如图 18-8\
  \ 所示。你想给每个玩家十个筹码。但房间里有些扫兴的人不参与游戏。所以两个人都没有筹码，但待遇可能不同。空手的玩家得到十个筹码，但空手的扫兴者一个也得不到。\n\
  \n![image](img/Image00223.jpg)\n\n图 18-8： 运行清单 18-6 中的代码。\n\n在清单 18-6 中，你调用了 `Scanner`\
  \ 类的 `nextLine` 方法，允许用户输入任何字符——不仅仅是数字。如果用户输入 `Not playing`，你就不会给这个扫兴者任何筹码。\n\n\n\
  \n如果用户输入了一些数字，你就只能把这些数字困在名为 `reply` 的字符串变量中。你不能像 `reply` 这样的字符串加上十。因此，你需要调用 `Integer`\
  \ 类的 `parseInt` 方法，该方法接收你的字符串，并返回一个漂亮的 `int` 值。然后，你就可以对这个 `int` 值加十了。\n\n![技术内容](img/Image00007.jpg)\
  \ Java 有一个漏洞，允许你将数字加到字符串上。问题是，你得到的并不是真正的加法。将数字 `10` 加到字符串 `\"30\"` 上，得到的是 `\"3010\"\
  `，而不是 `40`。\n\n![警告](img/Image00004.jpg) 不要混淆 `Integer` 和 `int`。在 Java 中，`int` 是一种原始类型的名称（本书中会大量使用这种类型）。而\
  \ `Integer` 是一个类的名称。Java 的 `Integer` 类包含处理 `int` 值的便捷方法。例如，在清单 18-6 中，`Integer`\
  \ 类的 `parseInt` 方法从字符串中生成一个 `int` 值。\n\n### 将数字转换为字符串\n\n在第 17 章的清单 17-1 中，对两件商品的购买金额加上了税费。但清单\
  \ 17-1 代码的一次运行出现了一个异常。（请参考图 17-1。）对于 40 美元加 5% 的税，程序显示的总金额为 `42.0`。这很奇怪——在我所在的地方，货币金额通常不会只显示小数点后一位。\n\
  \n如果你不仔细选择购买金额，情况会更糟。例如，在图 18-9 中，我运行了同一个程序（清单 17-1 中的代码），购买金额为 19.37。结果显示得很难看。\n\
