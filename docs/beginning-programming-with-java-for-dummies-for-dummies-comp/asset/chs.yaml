  androidBook.jpg\");`\n\n`JLabel label = new JLabel(icon);`\n\n看起来像是方法调用。毕竟，方法调用由名称后跟括号组成。你可以在开括号和闭括号之间放入一些参数。表达式\
  \ `keyboard.nextLine()` 是对名为 `nextLine` 的方法的调用。那么，在清单 20-1 中，`JFrame()` 是对名为 `JFrame`\
  \ 的方法的调用吗？不，不是。\n\n在表达式 `new JFrame()` 中，Java 的 `new` 关键字表示对构造器的调用。构造器类似于方法，不同之处在于构造器的名称与\
  \ Java 类的名称相同。Java 的标准 API 包含名为 `JFrame`、`ImageIcon` 和 `JLabel` 的类，而清单 20-1 中的代码调用了\
  \ `JFrame`、`ImageIcon` 和 `JLabel` 的构造器。\n\n正如术语所暗示的，*构造器* 是一段用于构造对象的代码。因此，在清单 20-1\
  \ 中，当你调用\n\n`JFrame frame = new JFrame();`\n\n时，你让一个 `frame` 变量引用一个新构造的对象（一个从 `JFrame`\
  \ 类构造出来的对象）。\n\n构造器和方法有很多共同点。如果代码中没有相应的方法声明，你就无法调用该方法。（对于 Java 的 `nextLine` 方法，其方法声明位于\
  \ Java 庞大的 API 类集合中的某处。）构造器也是如此。如果代码中没有 `JFrame` 类的构造器，你就无法调用 `new JFrame()`。果然，在\
  \ Java API 类中，你可以找到 `JFrame()` 构造器的声明。代码大致如下：\n\n```\npublic class JFrame {\n  \
  \  int height;\n    int width;\n    public Component add() …\n    public void setDefaultCloseOperation()\
  \ …\n    public void pack() …\n    public void setVisible() …\n    …\n    /**\n\
  \     * 构造一个新的、初始不可见的框架。\n     */\n    public JFrame() {\n        …\n    }\n   \
  \ …\n}\n```\n\n构造器声明看起来几乎与方法声明一样。但请注意，构造器声明并非以 `public void JFrame()` 或 `public\
  \ double JFrame()` 或 `public` *`anything`* `JFrame()` 开头。除了可选的 `public` 关键字外，构造器声明只包含正在构造其对象的类的名称。更多内容将在下一节介绍。\n\
  \n### Swing 类：第二回合\n\n在你的 Java 相关旅程中，你会看到清单 20-1 中代码的几种变体。本节将探讨其中一种变体。\n\n本节的示例与上一节的示例功能完全相同。唯一的区别在于两个示例处理\
  \ `JFrame` 类的方式。本节的代码位于清单 20-2 中。\n\n清单 20-2 扩展 Java 的 JFrame 类\n\n```\nimport javax.swing.ImageIcon;\n\
  import javax.swing.JFrame;\nimport javax.swing.JLabel;\n\nclass ShowPicture {\n\
  \    public static void main(String args[]) {\n        new MyFrame();\n    }\n}\n\
  \nclass MyFrame extends JFrame {\n    MyFrame() {\n        ImageIcon icon = new\
  \ ImageIcon(\"androidBook.jpg\");\n        JLabel label = new JLabel(icon);\n  \
  \      add(label);\n        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n  \
  \      pack();\n        setVisible(true);\n    }\n}\n```\n\n![technicalstuff](img/Image00007.jpg)\
  \ 当你在 Eclipse 编辑器中查看清单 20-2 时，你会看到一个黄色标记。黄色标记表示警告而非错误，因此你可以忽略该警告并继续运行代码。如果将鼠标悬停在标记上，你会看到一条关于名为\
  \ `serialVersionUID` 的提示。*`serialVersionUID`* 是一个数字，有助于 Java 在将对象的不同副本从一个地方发送到另一个地方时避免版本冲突。你可以通过应用\
  \ Eclipse 的快速修复来消除该警告，但如果你不挑剔，则无需理会这些快速修复。\n\n![crossreference](img/Image00009.jpg)\
  \ 关于 Eclipse 快速修复功能的信息，请参阅第 5 章。\n\n### 扩展一个类\n\n在清单 20-2 中，`extends JFrame` 这几个词尤为重要。当你看到\
  \ Java 的 `extends` 关键字时，想象用短语 *is a kind of*（是一种）来替换该关键字：\n\n`public class MyFrame`\
  \ *`is a kind of`* `JFrame {`\n\n当你输入 `MyFrame extends JFrame` 时，你声明了你的新 `MyFrame`\
  \ 类拥有 Java 自身 `JFrame` 类中内置的字段和方法，甚至可能更多。例如，`JFrame` 实例具有 `setDefaultCloseOperation`、`pack`\
  \ 和 `setVisible` 方法，因此每个新的 `MyFrame` 实例也都具有 `setDefaultCloseOperation`、`pack` 和\
  \ `setVisible` 方法（参见图 20-6）。\n\n![image](img/Image00242.jpg)\n\n图 20-6： 一个 `MyFrame`\
  \ 实例拥有许多方法。\n\n当你在代码中加入 `extends JFrame` 时，你就免费获得了 `JFrame` 的方法。`MyFrame` 类的代码不需要为诸如\
  \ `setDefaultCloseOperation`、`pack` 和 `setVisible` 等方法提供声明。这些声明已经存在于 Java API 的\
  \ `JFrame` 类中。`MyFrame` 类代码中的声明仅针对全新的事物——即特定于你新声明的 `MyFrame` 类的事物。就好像清单 20-2 包含了以下信息：\n\
  \n`public class MyFrame` *`is a kind of`* `JFrame {`\n\n*`此外，除了 JFrame 中的内容，MyFrame\
  \ 还有一个全新的构造器：`*\n\n`public MyFrame() {`\n\n`// 等等`\n\n`}`\n\n`}`\n\n在清单 20-2 中，`new\
  \ MyFrame()` 让 `MyFrame` 构造器执行其工作。而清单 20-2 中的构造器做了相当多的工作！该构造器完成了清单 20-1 中 `main`\
  \ 方法所做的工作：\n\n*   构造器创建了一个包含 `androidBook.jpg` 图片的 `ImageIcon`。\n*   构造器创建了一个 `JLabel`\
  \ 对象，并将 `androidBook.jpg` 图标放在新标签的表面上。\n*   构造器添加了 `JLabel` 对象。\n\n    暂停一下！将什么添加到什么上？在清单\
  \ 20-1 中，语句\n\n    `frame.add(label);`\n\n    将 `JLabel` 对象添加到 `frame` 中。但在清单 20-2\
  \ 中，没有 `frame` 变量。在清单 20-2 中，你只有\n\n    `add(label);`\n\n    嗯，好消息是：在构造器声明内部，你正在构造的对象是“给定的”。你不需要命名该新对象来引用它。就好像构造器的代码如下所示：\n\
  \n    ```\n    MyFrame() {\n        ImageIcon icon = new ImageIcon(\"androidBook.jpg\"\
  );\n        JLabel label = new JLabel(icon);\n        new_frame_that_is_being_constructed.add(label);\n\
  \        new_frame_that_is_being_constructed.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \        new_frame_that_is_being_constructed.pack();\n        new_frame_that_is_being_constructed.setVisible(true);\n\
  \    }\n    ```\n\n\n\n\n以下是 清单 20-2 中构造器完成其工作的方式：\n\n*   构造器将 `JLabel` 对象添加到正在构建的\
  \ `MyFrame` 对象中。\n*   构造器告诉 Java 虚拟机在关闭框架时自行关闭。\n*   构造器将框架紧贴框架上显示的图像进行收缩包装。\n*\
  \   构造器使框架显示在屏幕上。\n\n`extends` 关键字为 Java 编程引入了一个基本概念——*继承*的概念。在 清单 20-2 中，新创建的 `MyFrame`\
  \ 类*继承*了现有 `JFrame` 类中声明的字段和方法。继承是面向对象编程语言的一个关键特性。\n\n![tryitout](img/Image00006.jpg)\
  \ 对本章的程序做一些修改。\n\n#### 混合搭配\n\n更改 清单 20-1 中 `main` 方法内语句的顺序。对 清单 20-2 中构造器内的语句也做同样的操作。语句的顺序是否会产生影响？代码中是否有某些语句必须位于其他语句之前？\n\
  \n构建可视化对象时语句顺序的宽松性暗示了一种不同的 GUI 编程思维方式。这被称为声明式编程，我将在下一节中描述它。\n\n#### 自行尝试\n\n使用你自己的图像文件替换我的\
  \ `androidBook.jpg` 文件，运行 清单 20-1 或 20-2 中的代码。\n\n### 代码汤：将 XML 与 Java 混合\n\n回过头来，再次仔细品味\
  \ 清单 20-1 中的代码。尽管 Java 具有面向对象的风格，但该代码使用“先做这个，再做那个”的方法来显示窗口：\n\n*   *以下是显示图片的方法：*\n\
  *   `构造`一个框架\n*   `构造`一个包含特定图像的图标\n*   `构造`一个包含该图标的标签\n*   `将`图标添加到框架\n*   *…*\n\
  *   `打包`框架\n*   `使`框架可见\n\n这种“先做这个，再做那个”的方法被称为*过程式编程*。\n\n现在想象你在卢浮宫，看着《蒙娜丽莎》。你不会想：“达芬奇先画了脸，然后在脸上加了微笑，然后加了身体，最后加了背景。”这幅画并不是从一个动作推进到另一个动作。相反，这幅画*就是*它本身。\n\
  \n同样，GUI 应用程序中的窗口不需要过程式的推进。相反，你可以*声明式地*描述一个窗口。你编写代码说：“窗口看起来是这样的。”Java 虚拟机根据你的描述自行决定显示什么以及何时显示。\n\
  \n例如，考虑 图 20-7 中的网格。\n\n![image](img/Image00243.gif)\n\n图 20-7： 姓名和电话号码。\n\n以下 Swing\
  \ 代码创建了一个类似 图 20-7 的网格。不要关注代码中的所有细节。相反，注意所有的动词：“`将`布局设置为新的 `GridLayout`，`将`标签添加到框架，`设置`字体，`打包`框架，等等。”这完全是过程式的。\n\
  \n```java\nimport java.awt.Font;\nimport java.awt.GridLayout;\nimport javax.swing.JFrame;\n\
  import javax.swing.JLabel;\n\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        JFrame frame = new JFrame();\n        frame.setLayout(new GridLayout(4,\
  \ 2));\n        JLabel labels[] =\n            { new JLabel(\"Name\"), new JLabel(\"\
  Phone\"),\n              new JLabel(\"Alice\"), new JLabel(\"555-1234\"),\n    \
  \          new JLabel(\"Bob\"), new JLabel(\"555-4321\"),\n              new JLabel(\"\
  Carol\"), new JLabel(\"555-3000\") };\n        frame.add(labels[0]);\n        frame.add(labels[1]);\n\
  \        JLabel boldLabel = new JLabel(\"Name\");\n        Font boldFont = boldLabel.getFont();\n\
  \        Font plainFont =\n            new Font(boldFont.getName(), Font.PLAIN,\
  \ boldFont.getSize());\n        for (int i = 2; i < 8; i++) {\n            labels[i].setFont(plainFont);\n\
  \            frame.add(labels[i]);\n        }\n        frame.pack();\n        frame.setVisible(true);\n\
  \    }\n}\n```\n\n为了将世界从过程式思维中拯救出来，JavaFX 提供了一种声明式选项。使用 JavaFX，你可以使用 XML（可扩展标记语言）标签以大纲形式描述场景。以下是\
  \ 图 20-7 中网格的 JavaFX 版本：\n\n```xml\n<GridPane gridLinesVisible=\"true\" layoutX=\"\
  100.0\" layoutY=\"165.0\">\n    <children>\n        <Label text=\"Name\" GridPane.columnIndex=\"\
  0\" GridPane.rowIndex=\"0\">\n            <font>\n                <Font name=\"\
  System Bold\" size=\"12.0\" fx:id=\"x1\"/>\n            </font>\n        </Label>\n\
  \        <Label font=\"$x1\" text=\"Phone\"\n               GridPane.columnIndex=\"\
  1\" GridPane.rowIndex=\"0\"/>\n        <Label text=\"Alice\"\n               GridPane.columnIndex=\"\
  0\" GridPane.rowIndex=\"1\"/>\n        <Label text=\"555-1234\"\n              \
  \ GridPane.columnIndex=\"1\" GridPane.rowIndex=\"1\"/>\n        <Label text=\"Bob\"\
  \n               GridPane.columnIndex=\"0\" GridPane.rowIndex=\"2\"/>\n        <Label\
  \ text=\"555-4321\"\n               GridPane.columnIndex=\"1\" GridPane.rowIndex=\"\
  2\"/>\n        <Label text=\"Carol\"\n               GridPane.columnIndex=\"0\"\
  \ GridPane.rowIndex=\"3\"/>\n        <Label text=\"555-3000\"\n               GridPane.columnIndex=\"\
  1\" GridPane.rowIndex=\"3\"/>\n    </children>\n</GridPane>\n```\n\n如果你熟悉 HTML（网页语言），你可能会认出\
  \ XML 网格代码中的一些技巧。如果不熟悉，不用担心。使用名为 Scene Builder 的工具，你的计算机会替你编写 XML 代码。要了解我的意思，请继续阅读。\n\
  \n### 使用 JavaFX 和 Scene Builder\n\nGUI 程序有两个有趣的特点：\n\n*   **GUI 程序通常包含大量代码。**\n\
  \    这些代码中，很多在不同 GUI 程序之间差异很小。\n*   **GUI 程序涉及可视化元素。**\n    描述可视化元素的最佳方式是“绘制”它们。用代码描述它们可能既缓慢又不直观。\n\
  \n为了让你的 GUI 开发更轻松，你可以使用 JavaFX 和 Scene Builder。使用 Scene Builder，你可以可视化地描述你的程序。Scene\
  \ Builder 会自动将你的可视化描述转换为 Java 源代码和 XML 代码。\n\n### 安装 Scene Builder\n\n安装 Scene Builder\
  \ 与安装大多数软件类似。以下是具体步骤：\n\n1.  **访问** [`http://gluonhq.com/products/scene-builder`](http://gluonhq.com/products/scene-builder)\
  \ **。**\n2.  **点击下载按钮。**\n    点击后，会出现一个下载选项列表。\n3.  **点击与你计算机操作系统（Windows、Mac 或\
  \ Linux）对应的按钮。**\n    随后，下载开始。在 Windows 计算机上，你会得到一个 `.exe` 文件。双击该文件开始安装。\n    在\
  \ Mac 上，你会得到一个 `.dmg` 文件。根据你的 Mac 网页浏览器设置，浏览器可能会或可能不会自动解压 `.dmg` 文件。如果没有，请双击 `.dmg`\
  \ 文件开始安装。\n4.  **按照安装程序的指示操作。**\n    在 Windows 计算机上，你接受一系列默认设置。\n    在 Mac 上，你将\
  \ Scene Builder 的图标拖到 `Applications` 文件夹中。\n\n就这样！你已经安装了 Scene Builder。\n\n### 安装\
  \ e(fx)clipse\n\nEclipse 有其自身复杂的机制来集成新功能。Eclipse 的工具称为 Eclipse *插件*。当你首次安装 Eclipse\
  \ 时，默认会获得许多插件。然后，为了增强 Eclipse 的功能，你可以安装许多额外的插件。\n\nEclipse 的 *e(fx)clipse* 插件有助于创建\
  \ JavaFX 应用程序。你可以将插件添加到现有的 Eclipse 安装中，但更简单的方法是下载一份新的 Eclipse（一份已经安装了 e(fx)clipse\
  \ 的副本）。以下是获取新 Eclipse 副本的方法：\n\n1.  **访问** [`http://efxclipse.bestsolution.at`](http://efxclipse.bestsolution.at/)\
  \ **。**\n2.  **查找包含 All-in-One 下载的页面。**\n\n\n\n\n\n3.  **在“All-in One 下载”页面上，找到一种下载适用于你操作系统的\
  \ Eclipse 副本的方法。**\n\n    ![记住](img/Image00005.jpg) 你下载的 Eclipse 的字长（32 位或 64 位）必须与你的\
  \ Java 版本的字长匹配。有关 32 位和 64 位字长的完整说明，请参见第 2 章。\n\n4.  **按照相应的链接或单击相应的按钮开始下载。**\n\n\
  5.  **按照****第 2 章****中的说明，在你的计算机上安装这个新的 Eclipse 副本。**\n\n    将新的 Eclipse 副本放在一个全新的文件夹中。这样，你就不必卸载旧的\
  \ Eclipse 副本。（实际上，在计算机上安装两个独立的 Eclipse 是很有帮助的。）在我的 Windows 计算机上，我有一个 `c:\\eclipse`\
  \ 文件夹和一个 `c:\\eclipseFX` 文件夹。这两个文件夹都有各自的子文件夹，名称如 `configuration`、`features` 和 `plugins`。这两个文件夹都有各自的\
  \ `eclipse.exe` 文件。同样，我的 Mac 在 Applications 文件夹中也有 `eclipse` 和 `e(fx)clipse` 文件夹。\n\
  \n![提示](img/Image00003.jpg) 当你启动新的 Eclipse 副本时，程序会提示你选择硬盘上的工作空间位置（即本次会话中 Eclipse\
  \ 项目所在的硬盘位置）。此时，你有两个选择：\n\n*   **你可以为两个不同的工作空间设置两个不同的文件夹——一个工作空间用于原始的 Eclipse 副本，另一个工作空间用于新的\
  \ Eclipse 副本。**\n\n    这样做可以将你之前章节的原始工作与本章的工作分开。此外，使用两个不同的工作空间，你可以同时运行两个 Eclipse\
  \ 副本。\n\n*   **或者，你可以将两个版本的 Eclipse 指向同一个文件夹（从而指向同一个工作空间）。**\n\n    这样做可以将所有工作集中在一个地方。你无需切换工作空间即可从原始工作切换到本章的工作。缺点是，你不能使用同一个工作空间同时运行两个\
  \ Eclipse 副本。\n\n    ![提示](img/Image00003.jpg) 不必为 Eclipse 工作空间的决定而烦恼。在任何 Eclipse\
  \ 副本中，你都可以从一个工作空间切换到另一个工作空间。你可以在每次启动 Eclipse 时决定使用哪个工作空间。你也可以通过选择 Eclipse 主菜单中的\
  \ File ⇒ Switch Workspace 来切换工作空间。\n\n### 创建一个基础的 JavaFX 项目\n\n有句老话说得好：“一图胜千言。”如果你把像\
  \ `javafx.application.Application` 这样的东西算作三个独立的词，那么同一张图就值 70 个词。在本节中，你将创建一个图片，Eclipse\
  \ 会根据它构建一个 70 词的 Java 程序。请按照以下步骤操作：\n\n1.  **按照前面“****安装 Scene Builder****”和“安装\
  \ e(fx)clipse”两节中的说明进行操作。**\n\n2.  **启动你的新 Eclipse 副本，并单击欢迎屏幕上的 Workbench 图标。**\n\
  \n3.  **从 Eclipse 的菜单栏中，选择 File ⇒ New ⇒ Project。**\n\n    此时会弹出 New Project 对话框。\n\
  \n4.  **在对话框的列表中，展开 JavaFX 分支。在该分支中，选择 JavaFX project，然后单击 Next。**\n\n    此时会弹出\
  \ New Java Project 对话框。\n\n5.  **在 New Java Project 对话框中，为你的项目输入一个名称。**\n\n    如果你严格按照我的说明操作，请将项目命名为\
  \ `MyFirstJavaFXProject`。\n\n6.  **单击 Finish 关闭 New Java Project 对话框。**\n\n    你会看到\
  \ Eclipse 工作台，在 Eclipse 的 Package Explorer 中显示你新创建的项目。\n\n### 运行你的基础 JavaFX 项目\n\
  \n在上一节中，你使用 e(fx)clipse 创建了一个全新的 JavaFX 项目。当你运行新项目的代码时，你会看到图 20-8 中的内容。你会看到一个空白的窗口。\n\
  \n![图片](img/Image00244.gif)\n\n图 20-8: 一个空窗口。\n\n这个窗口不包含任何图像、按钮、文本字段——什么都没有——这是因为\
  \ e(fx)clipse 创建新项目的方式。e(fx)clipse 工具用最少的代码填充项目。这样，新项目就是一块白板——一个空壳，你可以向其中添加按钮、文本字段或其他有用的组件。\n\
  \n### 向 JavaFX 项目添加内容\n\n我喜欢空旷的空间。大学毕业后独自生活时，我的公寓墙上没有挂任何画。我不想日复一日地盯着同样的艺术品。我更喜欢用自己想象中的图像来填充空白的白色空间。所以，对我来说，图\
  \ 20-8 中的空窗口令人感到舒适。\n\n但如果图 20-8 没有被纽约现代艺术博物馆收藏，那么这个窗口就毫无用处。（顺便说一句，我还在等待博物馆馆长的回复。）当你创建一个功能强大的\
  \ GUI 程序时，首先要创建一个包含按钮和其他小部件的窗口。然后添加方法来响应按键、按钮点击等操作。\n\n下一节包含一些响应按钮点击的代码。但在本节中，你将使用一个\
  \ XML 文件来描述一个按钮和一个文本字段：\n\n1.  **按照本章前面“****创建一个基础的 JavaFX 项目****”一节中的说明进行操作。**\n\
  \n    在 Eclipse 的 Package Explorer 中查找你在该节中创建的新项目。\n\n2.  **在 Eclipse 的 Package\
  \ Explorer 中展开新项目的分支。**\n\n    查找 `application` 分支，它位于 `src` 分支内部。\n\n3.  **右键单击（或在\
  \ Mac 上按住 Control 键单击）`application` 分支。在出现的上下文菜单中，选择 File ⇒ New ⇒ Other。**\n\n \
  \   此时会弹出 Select a Wizard 对话框。\n\n4.  **在 Select a Wizard 对话框的树中，展开 JavaFX 分支。**\n\
  \n5.  **在 JavaFX 分支中，双击 New FXML Document 项。**\n\n    此时会弹出 FXML File 对话框，如图 20-9\
  \ 所示。\n\n6.  **在对话框的 Name 字段中，为你的新文件输入一个名称，然后单击 Finish。**\n\n    如果你严格按照我的说明操作，请将文件命名为\
  \ `Root`。\n\n    ![提示](img/Image00003.jpg) 在图 20-9 中，你输入了名称 `Root`，但 e(fx)clipse\
  \ 创建的文件全名是 `Root.fxml`。\n\n    这个新的 `Root.fxml` 文件描述了你的新 JavaFX 应用程序中按钮、文本字段和其他内容的布局。这就是我在前面“代码汤：将\
  \ XML 与 Java 混合”一节开头大加渲染的 XML 文档。\n\n7.  **右键单击（或在 Mac 上按住 Control 键单击）Eclipse 的\
  \ Package Explorer 中新的 `Root.fxml` 分支。在出现的上下文菜单中，选择 Open with SceneBuilder。**\n\n\
  \    此时会弹出 Scene Builder 应用程序窗口。（参见图 20-10。）\n\n    Scene Builder 窗口包含几个区域：\n\n\
  \    *   Scene Builder 窗口的中间是 *Content panel*（内容面板），你可以在其中预览你的新应用程序。（目前，你的应用程序中没有任何内容可看，所以\
  \ Content panel 是一片空白。）\n\n    *   窗口的左上部分是 *Library panel*（库面板），其中包含 Containers\
  \ 部分、Controls 部分以及其他几个部分。\n\n        在 GUI 世界中，按钮、文本字段、标签和复选框等东西被称为 *controls*（控件）。Library\
  \ panel 的 Controls 部分形成了一个调色板。要创建 GUI 窗口，你可以将控件从调色板拖放到 Content panel 上。\n\n    *\
  \   窗口的左下部分是 *Document panel*（文档面板），其中包含 Hierarchy 部分和 Controller 部分。Hierarchy 部分包含一个\
  \ AnchorPane 项。\n\n\n\n\n\n“层次结构”部分包含一个树状图，显示窗口中的元素之间的嵌套关系。“控制器”部分帮助你将设计的窗口与应用程序的\
  \ Java 代码关联起来。\n\n*   窗口最右侧是*检查器面板*，其中包含“属性”部分、“布局”部分和“代码”部分。\n\n    在“属性”部分，你可以描述窗口中元素的特征。在“代码”部分，你可以为窗口中元素关联的\
  \ Java 方法命名。\n\n![warning](img/Image00004.jpg) 实际情况可能有所不同！这些说明适用于 Scene Builder\
  \ 8.3.0。如果你使用的是不同版本的 Scene Builder，操作步骤可能会略有差异。\n\n8.  双击“层次结构”部分中的 `AnchorPane`\
  \ 项。\n\n    在 Scene Builder 内容面板的中央会出现一个标记。\n\n9.  （可选）在内容面板中拖动标记以放大 `AnchorPane`。（参见图\
  \ 20-11。）\n\n10. 在库面板的“控件”部分找到 `TextField` 条目；然后将一个 `TextField` 控件拖入内容面板中的 `AnchorPane`。\n\
  \n11. 在库面板的“控件”部分找到 `Button` 条目。将一个 `Button` 控件拖入内容面板中的 `AnchorPane`。（关于 `TextField`\
  \ 控件和 `Button` 控件的外观，可参见图 20-12。）\n\n12. 在主菜单中，选择“文件”⇒“保存”。\n\n    这样即可保存新的 FXML\
  \ 文件。\n\n13. 关闭 Scene Builder 应用程序。\n\n    返回 Eclipse 工作台后，你可以在 `Root.fxml` 文件中看到新代码。（参见图\
  \ 20-13。）\n\n    ![tip](img/Image00003.jpg) 双击包资源管理器中的 `Root.fxml` 分支即可查看文件代码。如果代码中没有出现\
  \ `TextField` 和 `Button` 字样，请单击编辑器窗口内部。（单击鼠标可更新编辑器以反映 Scene Builder 所做的更改。）如果编辑器中的代码缩进不正确，请单击编辑器的空白区域，然后按\
  \ `Ctrl+Shift+F`（Windows）或 `⌘  -Shift-F`（Mac）。\n\n    ![remember](img/Image00005.jpg)\
  \ 任何时候你想格式化 Eclipse 编辑器中的代码（使其更易读、更易理解），都可以按 `Ctrl+Shift+F` 或 `⌘  -Shift-F`。\n\n\
  14. 编辑项目的 `Main.java` 文件。\n\n    注释掉 `BorderPane root` 语句，并添加一条 `Parent root` 语句，如清单\
  \ 20-3 中粗体所示。\n\n    清单 20-3 中的编辑操作将应用程序与你新设计的 `Root.fxml` 布局连接起来。\n\n15. 运行项目。\n\
  \n    运行后，你将看到图 20-14 中的窗口。\n\n![image](img/Image00245.jpg)\n\n图 20-9： FXML 文件对话框。\n\
  \n![image](img/Image00246.jpg)\n\n图 20-10： Scene Builder 启动运行。\n\n![image](img/Image00247.jpg)\n\
  \n图 20-11： 放大 AnchorPane。\n\n![image](img/Image00248.jpg)\n\n图 20-12： 一个 `TextField`\
  \ 和一个 `Button`。\n\n![image](img/Image00249.jpg)\n\n图 20-13： 新编码的 `Root.fxml` 文件。\n\
  \n![image](img/Image00250.jpg)\n\n图 20-14： 使用 `Root.fxml` 文件运行项目。\n\n清单 20-3 如何编辑\
  \ Main.java 文件\n\n```\npackage application;\n\nimport javafx.application.Application;\n\
  import javafx.fxml.FXMLLoader;\nimport javafx.scene.Parent;\nimport javafx.scene.Scene;\n\
  import javafx.stage.Stage;\n//import javafx.scene.layout.BorderPane;\n\npublic class\
  \ Main extends Application {\n    @Override\n    public void start(Stage primaryStage)\
  \ {\n        try {\n            // BorderPane root = new BorderPane();\n       \
  \     Parent root = FXMLLoader.load(getClass().getResource(\"Root.fxml\"));\n  \
  \          Scene scene = new Scene(root, 400, 400);\n            scene.getStylesheets().\n\
  \                add(getClass().getResource(\"application.css\").toExternalForm());\n\
  \            primaryStage.setScene(scene);\n            primaryStage.show();\n \
  \       } catch (Exception e) {\n            e.printStackTrace();\n        }\n \
  \   }\n\n    public static void main(String[] args) {\n        launch(args);\n \
  \   }\n}\n```\n\n按照本节的步骤操作时，Scene Builder 会修改项目的 Java 代码。完成本节的步骤后，你可以像往常一样运行项目（选择“运行”⇒“运行为”⇒“Java\
  \ 应用程序”）。但项目运行时，应用程序不会执行任何操作。单击按钮时，什么也不会发生。在文本字段中键入内容时，什么也不会发生。真是白费功夫！\n\n在下一节中，你将让按钮和文本字段发挥作用。\n\
  \n### 采取行动\n\n本章创建的程序大约有 50 行代码。但在此之前，你只输入了一行代码。在本节的说明中，你将让按钮响应鼠标单击。你只需再输入几行代码即可！\n\
  \n1.  按照本章前面“向 JavaFX 项目添加内容”一节的说明操作。\n\n    这样，你就有了显示 `TextField` 控件和 `Button`\
  \ 控件的代码。现在该重新打开 Scene Builder 了。\n\n2.  右键单击（在 Mac 上为 Control 单击）Eclipse 包资源管理器中的\
  \ `Root.fxml` 分支。在出现的上下文菜单中，选择“用 SceneBuilder 打开”。\n\n    将出现 Scene Builder 应用程序窗口。（参见图\
  \ 20-12。）\n\n3.  在 Scene Builder 窗口中，选择应用程序的 `Button` 控件。\n\n    你可以通过单击内容面板中 `Button`\
  \ 控件的图片，或单击文档面板“层次结构”部分中的 `Button` 字样来完成此操作。\n\n    选择 `Button` 控件后，检查器面板的“属性”部分会显示有关\
  \ `Button` 控件的一些信息。在该部分顶部附近，你会看到一个标记为 `Text` 的项。你在 `Text` 旁边的字段中键入的任何内容都会显示在按钮的表面上。\n\
  \n4.  在 `Text` 旁边的字段中，键入单词 `Capitalize`，然后按 Enter 键。\n\n    此时，单词 `Capitalize` 会出现在内容面板中\
  \ `Button` 控件的表面上。（参见图 20-15。）\n\n    请记住，检查器面板包含三个部分：“属性”部分、“布局”部分和“代码”部分。此时，“属性”部分已展开，另外两个部分已折叠。\n\
  \n5.  在检查器面板中，单击“代码”部分。\n\n    这样会展开“代码”部分（同时折叠“属性”部分）。\n\n6.  在“代码”部分，查找标记为“On\
  \ Action”的字段。在该字段中，键入 `onClick`，然后按 Enter 键。（参见图 20-16。）\n\n    ![tip](img/Image00003.jpg)\
  \ 在键入 `onClick` 之前，请确保“代码”部分顶部显示的是 `Button` 字样。如果显示的是其他单词（如 `TextField` 或 `AnchorPane`），则你即将更改错误组件的“On\
  \ Action”字段。\n\n    按钮控件就处理到这里！现在，我们来处理 `TextField` 控件。\n\n7.  选择 `TextField` 控件（可以在内容面板中，也可以在文档面板的“层次结构”部分中）。\n\
  \n8.  在“代码”部分，查找标记为 `fx:id` 的字段。在该字段中，键入 `textField`，然后按 Enter 键。（参见图 20-17。）\n\n\
  \    在告别 Scene Builder 之前，你需要将 Scene Builder 的工作与 Java 代码关联起来：\n\n9.  单击文档面板中的“控制器”部分。\n\
  \n\n\n\n这样做会扩大 Controller 部分，同时缩小 Hierarchy 部分。\n\n10. **在 Controller 类字段（位于 Controller\
  \ 部分内）中，输入** `application.Main` **（两个单词之间有一个点），然后按 Enter 键。（参见** **图 20-18** **。）**\n\
  \n    ![warning](img/Image00004.jpg) 在执行本节中的其他某些步骤时，你有一些自由度。例如，如果在第 4 步中输入 `Click\
  \ Me!` 而不是 `Capitalize`，程序仍然可以运行。但在填写本步骤的 Controller 类字段时，你的自由度非常小。默认情况下，e(fx)clipse\
  \ 工具将你的程序命名为 `Main.java`，并将其放在名为 `application` 的包中。因此，在 Controller 类字段中，你必须指向这个\
  \ `application.Main` 程序。如果你指向其他地方，则必须重命名程序或包，或者两者都重命名。而本章到目前为止已有 40 多个步骤需要遵循，你可能不想不必要地重命名内容。\n\
  \n    终于！你在 Scene Builder 中的工作即将结束。\n\n11. **在 Scene Builder 的主菜单中，选择 File ⇒ Save。**\n\
  \n12. **关闭 Scene Builder 应用程序。**\n\n    呼！你回到了 Eclipse 工作台。\n\n    ![remember](img/Image00005.jpg)\
  \ 当你关闭 Scene Builder 时，Eclipse 可能不会自动更新 `Root.fxml` 文件的内容。如果在代码中看不到 `Capitalize`\
  \ 这个词，请在编辑器窗口内单击鼠标。（单击鼠标会更新编辑器，以反映 Scene Builder 所做的更改。）\n\n13. **在** `Main.java`\
  \ **文件中，在** **清单 20-4** **的开头附近和** **清单 20-4** **的结尾附近添加粗体代码。**\n\n    清单 20-4 中的编辑告诉\
  \ Java，当用户单击 Button 控件时，更改 TextField 控件中显示的文本。\n\n    完成这一步后，你就拥有了一个真正的 GUI 应用程序！\n\
  \n14. **运行项目。**\n\n![image](img/Image00251.jpg)\n\n图 20-15： 使用 `Button` 控件的属性。\n\
  \n![image](img/Image00252.jpg)\n\n图 20-16： 当用户单击 `Button` 控件时，调用代码的 `onClick` 方法。\n\
  \n![image](img/Image00253.jpg)\n\n图 20-17： 为 `TextField` 控件分配 ID。\n\n![image](img/Image00254.jpg)\n\
  \n图 20-18： 指定 FXML 文件的控制器类。\n\n清单 20-4 如何编辑 Main.java 文件\n\n```\npackage application;\n\
  \nimport javafx.event.ActionEvent;\nimport javafx.scene.control.TextField;\nimport\
  \ javafx.application.Application;\nimport javafx.fxml.FXML;\nimport javafx.fxml.FXMLLoader;\n\
  import javafx.scene.Parent;\nimport javafx.scene.Scene;\nimport javafx.stage.Stage;\n\
  //import javafx.scene.layout.BorderPane;\n\npublic class Main extends Application\
  \ {\n    @Override\n    public void start(Stage primaryStage) {\n        try {\n\
  \            // BorderPane root = new BorderPane();\n            Parent root = FXMLLoader.load(getClass().getResource(\"\
  Root.fxml\"));\n            Scene scene = new Scene(root, 400, 400);\n         \
  \   scene.getStylesheets().\n                add(getClass().getResource(\"application.css\"\
  ).toExternalForm());\n            primaryStage.setScene(scene);\n            primaryStage.show();\n\
  \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
  \    }\n\n    public static void main(String[] args) {\n        launch(args);\n\
  \    }\n\n    @FXML\n    private TextField textField;\n\n    @FXML\n    protected\
  \ void onClick(ActionEvent event) {\n        textField.setText(textField.getText().toUpperCase());\n\
  \    }\n}\n```\n\n当你运行本节中的程序时，你会看到类似 图 20-19、20-20 和 20-21 中的屏幕截图。*瞧！* 当你单击按钮时，Java\
  \ 会将文本转换为大写！\n\n![image](img/Image00255.jpg)\n\n图 20-19： 一个全新的框架。\n\n![image](img/Image00256.jpg)\n\
  \n图 20-20： 用户在文本框中输入内容。\n\n![image](img/Image00257.jpg)\n\n图 20-21： 单击按钮将文本框中的文本转换为大写。\n\
  \n![tryitout](img/Image00006.jpg) 调整本节中的程序以获得一些令人兴奋的结果。（好吧，对某些人来说结果可能无趣，但对我来说很兴奋！）\n\
  \n#### 将文本复制到文本字段\n\n使用 e(fx)clipse 和 Scene Builder 创建一个包含一个按钮和两个文本字段的框架。当用户单击按钮时，Java\
  \ 将文本从第一个文本字段复制到第二个文本字段。\n\n***提示：*** 你可以用一个声明创建两个文本字段：\n\n```\n@FXML\nprivate TextField\
  \ textField, textField2;\n```\n\n#### 在文本字段之间复制\n\n使用 e(fx)clipse 和 Scene Builder\
  \ 创建一个包含两个按钮和两个文本字段的框架。当用户单击第一个按钮时，Java 将文本从第一个文本字段复制到第二个文本字段。当用户单击第二个按钮时，Java 将文本从第二个文本字段复制到第一个文本字段。\n\
  \n#### 将文本复制到标签\n\n在 JavaFX 中，标签类似于文本字段。与文本字段一样，标签可以显示文本。事实上，`Label` 控件有一个 `setText`\
  \ 方法，就像 清单 20-4 中使用的 `setText` 方法一样。\n\n但标签的外观不同。标签的外观不会邀请用户更改标签的文本。标签看起来像是永久固定在框架上的文本。当然，文本并不是永久的，因为你的代码可以更改标签的文本。\n\
  \n使用 e(fx)clipse 和 Scene Builder 创建一个包含一个按钮、一个文本字段和一个标签的框架。当用户单击按钮时，Java 将文本从文本字段复制到标签。\n\
  \n***提示：*** 当声明多个类型的控件时，每个声明都需要自己的 `@FXML` 注解。\n\n```\n@FXML\nprivate TextField\
  \ textField;\n\n@FXML\nprivate Label label;\n```\n\n#### 创建一个小型计算器\n\n使用 e(fx)clipse\
  \ 和 Scene Builder 创建一个包含两个文本字段、一个按钮和一个标签的框架。用户在一个文本字段中输入一个数字，在另一个文本字段中输入另一个数字。当用户单击按钮时，Java\
  \ 在标签中显示两个数字的和。\n\n***提示：*** 无论 Java 从文本字段的 `getText` 方法中得到什么，都是 `String` 类型。当你在两个\
  \ `String` 值之间放置加号时，Java 只是将值拼接在一起——例如，`\"42\" + \"98\"` 的结果是 `\"4298\"`。在将这些值相加之前，你必须将它们转换为数字。你可以使用\
  \ Java 的 `Integer.parseInt` 方法来实现。（请参阅 第 18 章。）\n\n当你调用标签的 `setText` 方法时，调用的参数必须是\
  \ `String` 类型。要从 `int` 值获取 `String` 值，请使用 `Integer.toString` 方法——例如，`Integer.toString(86)`\
  \ 的结果是 `\"86\"`。\n\n第 5 部分\n\n# 十要点部分\n\n本部分内容……\n\n使用网络资源\n\n窥见冰山一角：Java 中一些最有用的类\n\
