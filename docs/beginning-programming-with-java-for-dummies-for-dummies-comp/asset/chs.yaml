  \n#### 红灯或黄灯\n\n修改“接近交通信号灯”程序，使得程序询问`What color is the traffic light? (G/Y/R)`。当用户回答`Y`或`R`，并且要么通过不安全，要么有警察指示司机不要通过时，程序显示`Stop`。否则，程序不显示任何内容。\n\
