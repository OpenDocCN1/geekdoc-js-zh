  \ 类\n\n你听说过*面向对象编程*（也称为 *OOP*）这个术语吗？OOP 是一种思考计算机编程问题的方式——一种由多种不同编程语言支持的方式。OOP 始于\
  \ 20 世纪 60 年代的一种名为 Simula 的语言。它在 20 世纪 70 年代通过另一种名为 Smalltalk 的语言得到加强。到了 20 世纪 80\
  \ 年代，OOP 凭借 C++ 语言大放异彩。\n\n有些人想改变这个缩写，称之为 COP——面向类编程。这是因为面向对象编程始于一种称为*类*的东西。在 Java\
  \ 中，一切始于类，一切都被封装在类中，一切都基于类。在创建某种类之前，你在 Java 中什么都做不了。这就像在《危险边缘》节目中，听到亚历克斯·特雷贝克说“我们插播广告”，然后你打断他说：“对不起，亚历克斯。你不能在不把指令放在类中的情况下发出指令。”\n\
  \n理解类到底是什么对你来说很重要，所以我不敢在本章中随意解释。相反，我将第 17 章的大部分内容用于回答“什么是类？”这个问题。无论如何，在 Java 中，你的\
  \ `main` 方法必须放在一个类中。我编写了代码清单 4-1 中的代码，所以我得为我的新类起个名字。我选择了 `ThingsILike` 这个名字，因此代码清单\
  \ 4-1 中的代码以 `class ThingsILike` 开头。\n\n再看一下代码清单 4-1，注意 `class ThingsILike` 这一行之后发生了什么。其余代码被花括号括起来。这些花括号标记了类内部的所有内容。没有这些花括号，你就知道\
  \ `ThingsILike` 类的声明从哪里开始，但不知道声明在哪里结束。\n\n就好像 `ThingsILike` 类内部的东西被放在一个盒子里。（请参阅图\
  \ 4-3。）要框出一段代码，你需要做两件事：\n\n*   **使用花括号。** 这些花括号告诉编译器一段代码从哪里开始和结束。\n*   **缩进代码。**\
  \ 缩进告诉你的肉眼（以及其他程序员的肉眼）一段代码从哪里开始和结束。\n\n别忘了。你必须同时做到这两点。\n\n#### 程序中的词汇\n\n![tryitout](img/Image00006.jpg)\
