  \n清单 19-1 中的`Account`类定义了四个成员：一个`lastName`字段、一个`id`字段、一个`balance`字段和一个`display`方法。因此，`Account`类的每个实例都有自己的`lastName`、自己的`id`、自己的`balance`以及自己的`display`执行方式。这些内容与图\
  \ 19-1 中的四列相对应。\n\n### 检查方法的头部\n\n清单 19-1 包含了`display`方法的声明。与`main`方法的声明类似，`display`声明也有一个头部和一个主体。（参见第\
  \ 4 章。）头部包含两个单词和一对括号：\n\n*   **单词** `void` **告诉计算机，当调用** `display` **方法时，** `display`\
  \ **方法不会向调用它的地方返回任何内容。**\n\n    在本章后面，有一个方法会返回一些内容。目前，`display`方法不返回任何内容。\n\n* \
  \  **单词 `display` 是方法的名称。**\n\n    每个方法都必须有一个名称。否则，你就无法调用该方法。\n\n*   **括号中包含调用方法时将要传递给该方法的所有内容。**\n\
  \n    当你调用一个方法时，你可以动态地向该方法传递信息。这个`display`示例的括号是空的，看起来很奇怪。这是因为调用`display`方法时没有传递任何信息。这没问题。我将在本章后面给出一个更充实的例子。\n\
  \n### 检查方法的主体\n\n`display`方法的主体包含一些`print`和`println`调用。有趣的是，主体中引用了`lastName`、`id`和`balance`字段。方法的主体可以这样做。但是，由于每个对象都有自己的`lastName`、`id`和`balance`变量，那么`display`方法主体中的变量意味着什么呢？\n\
