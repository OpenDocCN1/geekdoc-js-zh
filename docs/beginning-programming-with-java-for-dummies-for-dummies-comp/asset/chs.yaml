  \n第 10 章\n\n## 他往哪边走了？\n\n本章内容\n\n![check](img/Image00002.jpg) **理清复杂条件**\n\n![check](img/Image00002.jpg)\
  \ **编写酷炫的条件代码**\n\n![check](img/Image00002.jpg) **嵌套你的 if 语句**\n\n又到了报税时间。此刻，我正在填写表格\
  \ 12432-89B。上面写着：\n\n> 如果你已婚且子女少于三个，并且收入高于 EIQ（预估收入配额），或者你单身且居住在非住宅区（根据《统一分区法》第\
  \ 10 条第 iii 部分定义），并且你既是有限责任公司（LLC）的自雇人士，又符合退伍军人福利条件，那么根据你对问题 2a 和 3d 的回答，跳过步骤 3\
  \ 和 4，或者步骤 4、5 和 6。\n\n难怪我没时间写作！我忙着解读这些税表呢。\n\n总之，本章讨论的是 `if` 语句的潜在复杂性。本章没有像表格 12432-89B\
  \ 那样复杂的内容，但如果你遇到类似复杂的情况，你也能应对自如。\n\n## 构建更大更好的条件\n\n在清单 9-2（参见第 9 章）中，代码根据对 `Random`\
  \ 类的 `nextInt` 方法的一次调用来选择行动方案。这对于第 9 章中描述的电子神谕程序来说没问题，但如果你是在掷一对骰子呢？在双陆棋和其他骰子游戏中，掷出\
  \ 3 和 5 与掷出 4 和 4 不同，尽管两次的总和都是 8。下一步行动取决于你是否掷出了双数。要让计算机掷两个骰子，你需要执行 `myRandom.nextInt(6)\
  \ + 1` 两次。然后将两次结果组合成一个更大、更复杂的 `if` 语句。\n\n为了模拟双陆棋游戏（以及许多其他更实际的情况），你需要组合条件：\n\n*`如果\
  \ die1 + die2 等于 8`*`且`*`die1 等于 die2，……`*\n\n你需要像 *且* 和 *或* 这样的东西——它们可以将条件连接起来。Java\
  \ 有表示这些概念的运算符，如表 10-1 所述，并在图 10-1 中进行了说明。\n\n| 运算符符号 | 含义 | 示例 | 图示 |\n| --- | ---\
  \ | --- | --- |\n| `&&` | 且 | `4 < age && age < 8` | 图 10-1 (a) |\n| `||` | 或 |\
  \ `age < 4 || 8 < age` | 图 10-1 (b) |\n| `!` | 非 | `!eachKidGetsTen` | 图 10-1 (c)\
  \ |\n\n表 10-1 逻辑运算符\n\n![image](img/Image00132.jpg)\n\n图 10-1: 当条件满足时，你会很开心。\n\n\
  像表 10-1 中那样的组合条件可能会非常令人困惑。这就是为什么我在使用这类东西时会小心翼翼。以下是表中每个示例的简短说明：\n\n*   `4 < age &&\
  \ age < 8`\n\n    `age` 变量的值大于 4 *且* 小于 8。数字 5、6、7、8、9……都大于 4。但在这些数字中，只有 5、6、7 小于\
  \ 8。因此，只有数字 5、6、7 满足这个组合条件。\n\n*   `age < 4 || 8 < age`\n\n    `age` 变量的值小于 4 *或*\
  \ 大于 8。要创建 *或* 条件，你需要使用两个管道符号。在许多美式英语键盘上，管道符号位于 Enter 键正上方（与反斜杠同一个键，但需按 Shift 键）。\n\
  \n    在这个组合条件中，`age` 变量的值要么小于 4，要么大于 8。例如，如果一个数字小于 4，则该数字满足条件。像 1、2、3 这样的数字都小于 4，因此这些数字满足组合条件。\n\
  \n    同样，如果一个数字大于 8，则该数字也满足组合条件。像 9、10、11 这样的数字都大于 8，因此这些数字满足条件。\n\n*   `!eachKidGetsTen`\n\
  \n    如果我不熟悉计算机编程语言，我会对这个感叹号感到困惑。我会认为 `!eachKidGetsTen` 的意思是“是的，每个孩子 *确实* 得到十个。”但这不是这个表达式的意思。这个表达式说的是：“变量\
  \ `eachKidGetsTen` 的值 *不* 是 `true`。”在 Java 和其他编程语言中，感叹号表示 *否定*、*不行*、*非*。\n\n   \
  \ 清单 8-4（参见第 8 章）中有一个名为 `eachKidGetsTen` 的 `boolean` 变量。`boolean` 变量的值要么是 `true`，要么是\
  \ `false`。因为 `!` 表示 *非*，所以表达式 `eachKidGetsTen` 和 `!eachKidGetsTen` 的值相反。因此，当 `eachKidGetsTen`\
  \ 为 `true` 时，`!eachKidGetsTen` 为 `false`（反之亦然）。\n\n![tip](img/Image00003.jpg) Java\
  \ 的 `||` 运算符是 *包含性的*。这意味着只要左侧为 `true`、右侧为 `true`，或者两侧都为 `true`，结果就是 `true`。例如，条件\
  \ `2 < 10 || 20 < 30` 为真。\n\n![warning](img/Image00004.jpg) 在 Java 中，你不能像在普通英语中那样组合比较。在英语中，你可能会说：“我们晚餐桌上会有三到十个人。”但在\
  \ Java 中，如果你写 `3 <= people <= 10`，你会收到错误消息。要进行这种比较，你需要类似 `3 <= people && people\
  \ <= 10` 这样的写法。\n\n### 组合条件：一个示例\n\n下面是一个使用逻辑运算符的实用示例。一家电影院公布了票价：\n\n*   普通票价：9.25\
  \ 美元\n\n*   12 岁以下儿童：5.25 美元\n\n*   老年人（65 岁及以上）：5.25 美元\n\n由于儿童和老年人的票价相同，你可以将这些价格合并为一个类别。（这并不总是最好的编程策略，但在这个例子中就这样做。）要找出某位观影者的票价，你需要一个或多个\
  \ `if` 语句。你可以用多种方式构建条件，我在清单 10-1 的代码中选择了其中一种方式。\n\n清单 10-1 你付的钱太多了吗？\n\n```java\n\
  import java.util.Scanner;\n\nclass TicketPrice {\n    public static void main(String\
  \ args[]) {\n        Scanner keyboard = new Scanner(System.in);\n        int age;\n\
  \        double price = 0.00;\n        System.out.print(\"How old are you? \");\n\
  \        age = keyboard.nextInt();\n        if (age >= 12 && age < 65) {\n     \
  \       price = 9.25;\n        }\n        if (age < 12 || age >= 65) {\n       \
  \     price = 5.25;\n        }\n        System.out.print(\"Please pay $\");\n  \
  \      System.out.print(price);\n        System.out.print(\". \");\n        System.out.println(\"\
  Enjoy the show!\");\n        keyboard.close();\n    }\n}\n```\n\n\n\n\n\n`TicketPrice`\
  \ 程序的几次运行（参见清单 10-1）如图 10-2 所示。（为了便于查看，我将 Eclipse 控制台中的运行结果复制到了 Windows 记事本中。）当你年满\
  \ 12 岁时，开始支付全价。你一直支付全价，直到 65 岁。从那时起，你再次支付优惠价格。\n\n![image](img/Image00133.gif)\n\
  \n图 10-2： *《Java 入门编程（For Dummies）：电影版》* 的入场票价。\n\n清单 10-1 的关键部分是中间那一堆 `if` 语句，如图\
  \ 10-3 所示。\n\n*   第一个 `if` 语句的条件测试的是常规票价组。任何年满 12 岁 *且* 未满 65 岁的人属于这一组。\n*   第二个\
  \ `if` 语句的条件测试的是边缘年龄段。未满 12 岁 *或* 年满 65 岁（含）的人属于这一类别。\n\n![image](img/Image00134.jpg)\n\
  \n图 10-3： 清单 10-1 中条件的含义。\n\n![tip](img/Image00003.jpg) 当你需要构造某个现有条件的相反条件时，通常可以遵循清单\
  \ 10-1 中的模式。将 `>=` 改为 `<`。将 `<` 改为 `>=`。将 `&&` 改为 `||`。\n\n![warning](img/Image00004.jpg)\
  \ 如果你更改清单 10-1 中的金额，可能会遇到麻烦。例如，使用语句 `price = 5.00` 时，程序会显示 `Please pay $5.0. Enjoy\
  \ the show!`。这是因为 Java 不会存储小数点右边的两个零（而且 Java 不知道也不关心 5.00 是一个美元金额）。要解决这类问题，请参见第\
  \ 18 章 中关于 `NumberFormat.getCurrencyInstance` 的讨论。\n\n### 何时初始化？\n\n看一下清单 10-1，注意\
  \ `price` 变量的初始化：\n\n`double price = 0.00;`\n\n这一行声明了 `price` 变量，并将其初始值设置为 `0.00`。如果我省略这个初始化，就会收到一条错误消息：\n\
  \n`The local variable price may not have been initialized`\n\n这是怎么回事？我没有初始化 `age`\
  \ 变量，但编译器并没有抱怨。为什么编译器偏偏对 `price` 变量斤斤计较呢？\n\n答案在于代码中赋值语句的位置。考虑以下两个事实：\n\n*   给 `age`\
  \ 变量赋值的语句（`age = keyboard.nextInt()`）不在 `if` 语句内部。\n\n    该赋值语句总是会被执行，并且（只要没有发生异常情况）变量\
  \ `age` 肯定会被赋予一个值。\n\n*   给 `price` 变量赋值的两条语句（`price = 9.25` 和 `price = 5.25`）都在\
  \ `if` 语句内部。\n\n    如果你查看图 10-3，会发现每个年龄段都被覆盖了。没有人会带着一个使两个 `if` 条件都为 `false` 的年龄出现在售票窗口。因此，每当你运行\
  \ `TicketPrice` 程序时，要么执行第一个 `price` 赋值，要么执行第二个。\n\n    问题在于编译器不够聪明，无法检查所有这些情况。编译器只看到了图\
  \ 10-4 中的结构，就担心计算机可能不会走任何一个 `true` 的分支。\n\n    如果（由于某些不可预见的原因）两个 `if` 语句的条件都为 `false`，那么变量\
  \ `price` 就不会被赋值。因此，如果没有初始化，`price` 就没有值。（更准确地说，`price` 没有在代码中被有意赋予的值。）\n\n    最终，计算机会执行到\
  \ `System.out.print(price)` 语句。除非 `price` 有一个有意义的值，否则它无法显示 `price`。此时，编译器会厌恶地举起它的虚拟双手。\n\
  \n![image](img/Image00135.jpg)\n\n图 10-4： 清单 10-1 中的选择。\n\n### 越来越多的条件\n\n昨晚我在附近的汉堡店吃了一顿美味的晚餐。作为促销活动的一部分，我随餐得到了一张折扣券。这张券可以在当地电影院购买电影票时抵扣\
  \ 2.00 美元。\n\n为了在 `TicketPrice` 程序中使用这张优惠券，我需要调整清单 10-1 中的代码。修改后的代码见清单 10-2。在图 10-5\
  \ 中，我带着这段新代码跑了几圈。\n\n![image](img/Image00136.gif)\n\n图 10-5： 运行清单 10-2 中的代码。\n\n\
  清单 10-2 你有优惠券吗？\n\n```\nimport java.util.Scanner;\n\nclass TicketPriceWithDiscount\
  \ {\n  public static void main(String args[]) {\n    Scanner keyboard = new Scanner(System.in);\n\
  \    int age;\n    double price = 0.00;\n    char reply;\n    System.out.print(\"\
  How old are you? \");\n    age = keyboard.nextInt();\n    System.out.print(\"Have\
  \ a coupon? (Y/N) \");\n    reply = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n\
  \    if (age >= 12 && age < 65) {\n      price = 9.25;\n    }\n    if (age < 12\
  \ || age >= 65) {\n      price = 5.25;\n    }\n    if (reply == 'Y' || reply ==\
  \ 'y') {\n      price -= 2.00;\n    }\n    if (reply != 'Y' && reply != 'y' && reply\
  \ != 'N' && reply != 'n') {\n      System.out.println(\"Huh?\");\n    }\n    System.out.print(\"\
  Please pay $\");\n    System.out.print(price);\n    System.out.print(\". \");\n\
  \    System.out.println(\"Enjoy the show!\");\n    keyboard.close();\n  }\n}\n```\n\
  \n清单 10-2 中有两个 `if` 语句的条件涉及字符：\n\n*   在第一个这样的语句中，计算机检查 `reply` 变量是否存储了字母 `Y` *或*\
  \ 字母 `y`。如果是，则从 `price` 中减去 2.00。（关于 `-=` 这类运算符的信息，请参见第 7 章。）\n*   第二个这样的语句有一个庞大的条件。该条件测试\
  \ `reply` 变量是否存储了任何合理的值。如果回复 *不是* `Y`，*也不是* `y`，*也不是* `N`，*也不是* `n`，计算机就会显示“Huh?”来表达它的关切。（作为付费顾客，自动售票机屏幕上出现“Huh?”这个词肯定会引起你的注意。）\n\
  \n![tip](img/Image00003.jpg) 当你创建一个大型的多部分条件时，通常有几种思考该条件的方式。例如，你可以将清单 10-2 中的最后一个条件重写为\
  \ `if (!(reply == 'Y' || reply == 'y' || reply == 'N' || reply == 'n'))`。“*如果不是*\
  \ `reply` *是* `Y`、`y`、`N` *或* `n` *中的某一个*，则显示‘Huh?’”。那么哪种写法更好呢——是清单 10-2 中的写法，还是这个提示中的写法？这取决于你的喜好。哪种写法让你更容易理解逻辑，哪种就更好。\n\
  \n### 使用布尔变量\n\n无论一个程序有多好，你总能让它变得更好一点。以清单 10-2 中的代码为例。那一堆 `if` 语句是否让你感到不安？你在阅读每个条件时是否会慢得像蜗牛？如果你能快速扫一眼条件并立即理解其含义，那该多好啊？\n\
  \n在某种程度上，你可以做到。如果你愿意创建一些额外的变量，就可以让你的代码更易读。清单 10-3 展示了如何做到这一点。\n\n清单 10-3 乔治·布尔会感到自豪\n\
