    API (Application Programming Interface)

    The syntax to create "React.createContext" const UserContext = React.createContext(defaultValue);Creating
    a Context Object


    When React displays a component/module that subscribes to this Context method,
    it will read the current context value from the Provider that is the closest match
    above in the hierarchy.


    The argument is the default value only when a component/function does not have
    a matching Provider above it in the hierarchy. This default value can be very
    helpful for testing components in an isolated way without wrapping them. Note:
    To pass undefined as a Provider value does not cause consuming consumers to use
    defaultValue.


    Context.Provider


    The syntax for context provider "<MyContext.Provider value={/* some value */}>


    Each Context object assigns a Provider React component that allows it to consume
    consumers that subscribe to context changes/alerts.


    The Provider components accept a value prop to be passed into the consuming components
    that are an heir of this Provider. A single Provider can be linked to several
    customers. Providers can be nested to override/overwrite values deeper within
    the mesh.


    Each and every consumer that is descendants of a Provider will rerender whenever
    the Provider’s value prop alters. The propagation/flow from Provider to its descendant
    consumers (including contextType and useContext) is not subject to the shouldComponentUpdate
    method/function, the consumer is likely to update even when an ancestor/previous
    component skips an update(modified).


    Changes are determined by comparing old values to the new ones using the same
    algorithm as Object.is.


    Note: The way modifications are determined can cause some issues/errors while
    passing objects as values.'
