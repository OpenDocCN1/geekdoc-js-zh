  md: '# Programmatic Navigation ■ 113


    Talking React precisely, bundles the complete codes and deploys all of them at
    the same time. Normally, this is not a terrible idea because React SPAs (single-page
    apps) are relatively modest and have no effect on the presentation, but what if
    we have a massive app, such as a content management system with a customer portal,
    admin portal, and so on. It does not seem like a good idea to load the entire
    program in this scenario.


    It will be a huge app and will cost a lot of needless data transmission, making
    the website load slowly.


    Because a user login will not have access to certain topographies, loading it
    is a waste of memory and work.


    In this part, I will explain the advantages of lazy loading and how to implement
    it in React.


    # Why Is Lazy Loading (and Suspense) Important


    First, bundling all code components in the development and puts them in one JavaScript
    portion that it passes to the browser. But as our app grow, we notice that the
    bundle gets bulky in size. We can swiftly make your app very hard and incredibly
    sluggish. With codes splitting, the bundle can split into smaller chunks where
    the significant chunk can be loaded first and then every other inferior lazily
    loaded.


    Also, while building apps, we know that as a best practice, contemplation should
    be made for users using mobile internet data and others with really deliberate
    internet connections. We, the developers/designers, should always be able to regulate
    the user experience even during the suspense period when resources are being loaded
    to the DOM.


    # Advantages of Lazy Loading


    When we know that codes/features will not be available to all the users or the
    user does not access them often, it is best to load when the user needs them.
    This improves user experience and primary loading time.


    For example, let us consider that our app has two sections, A and B. Size of A
    is 3 MB, and its loading time is similarly 3 seconds. As B is also 3 MB in size,
    its loading time know that a user will visit either of the segments, or a user
    receiving A will seldom access section B, and vice versa. If we loaded the entire
    app at the start of our app, it would cost the user 6 MB of data and take 6 seconds
    to load. The user might not want to wait for 6 seconds or would not be happy that'
