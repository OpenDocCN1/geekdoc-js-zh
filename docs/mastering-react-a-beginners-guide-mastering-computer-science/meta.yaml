    # REDUCERS


    Our entire state tree is stored in a single object. A potential complaint might
    be that it''s not modular enough, possibly because you''re considering modularity
    as describing objects. Redux achieves modularity via functions. Functions are
    used to update parts of the state tree. These functions are reducers.


    Reducers are functions that take the current state as arguments and use them to
    create and return a new state. Reducers are designed to update specific parts
    of the state tree, either leaves or branches. We can compose reducers into one
    reducer that can handle the entire state of our App given any action. The color
    organizer stores all of the state data in a single tree. If we want to use Redux
    for this App, we can create several reducers that each target leaves and branches
    on our state tree.


    This state data has two branches: colors and sort. The sort branch is a leaf.
    It doesn''t contain any child nodes. The color branch stores multiple colors.
    Each color object represents a leaf. A separate reducer will be used to handle
    each part of this state tree. Reducer is simply a function, so we can stub them
