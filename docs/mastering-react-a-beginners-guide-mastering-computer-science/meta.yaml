  md: 'Constituent''s files will have an explicit extension, which is not used for
    non-ReactJS developers, it''s |jsx|. Why not |js? What''s the definite JSX syntax
    which is used in ReactJS and in what ways it has improved compared to JS?


    That''s precisely what I will clarify for you in this chapter. I''m going to show
    you what JSX is, what it''s used for, how to use looping in JSX, and the difference
    between JSX and HTML.


    # WHAT IS JSX?


    The full form of JSX is "JavaScript XML," and it is a syntax extension to JavaScript
    based on "ES6," the latest "version" of JavaScript. JSX lets us write HTML in
    React by transposing HTML into React components, which will help you create UI
    more easily for your web applications.


    When somebody is working on React, they may find some suspicious HTML-type code
    embedded in the JavaScript. What is this suspicious HTML-type code, and how does
    it work within React functions? These short snippets of strange HTML-like code
    are not HTML (hypertext language), but rather "JavaScript XML," a syntactic extension
    of JavaScript based on ES6, or JavaScript XML, is a form of markup that allows
    you to write HTML in React library by converting HTML tags into React elements
    (components).


    Utilizing JSX lets you write HTML elements in JavaScript, which are then rendered
    to the DOM (Document Object Model). JSX (JavaScript XML) is a React-precise XML/HTML-type
    syntax that encompasses ECMAScript for XML/HTML-type content to coincide with
    JavaScript/React code. The composition is considered to be used by preprocessors
    (transpilers like Babel) to convert HTML-type content confined in JavaScript into
    typical JavaScript modules that a JavaScript engine can recognize.


    Using JSX, you may write HTML/XML-like edifices (e.g., DOM-like hierarchy blocks)
    in identical files as JavaScript code, and Babel will translate these expressions
    into genuine JavaScript code. As a replacement for putting JavaScript into HTML
    as mentioned earlier, JSX lets us put HTML into JavaScript.


    JSX was formed as a research project at DeNA Co., Ltd., one of the world''s major
    social game providers. Kazuho Oku and Go Fuji are the main developers (aka GFX).'
