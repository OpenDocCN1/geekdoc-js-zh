  md: "# Advanced Tools ■ 135\n\nIt allows using functional components of the lifecycle,\
    \ states, pure components, etc.\n\nReact also provides a few built-in Hooks like\
    \ useState, useEffect etc., whereas you can also create hooks on your own.\n\n\
    Hooks allow you to reuse logic concepts without changing your component sequence.\
    \ This makes it easy to manipulate and share Hooks among many components or among\
    \ the community. Before moving ahead, note that you can try Hooks in a few components\
    \ without rewriting any existing code.\n\nHooks allow you to break into a different\
    \ component of other smaller function-based figures on what the pieces have been\
    \ mapped (like setting a subscription or detecting the data), despite making a\
    \ split based on lifecycle methods. You can also choose from managing the component's\
    \ initial state with a reducer to make it more predictable.\n\n# State Hook\n\n\
    It is a built-in Hook (useState) that is used to create a React state for the\
    \ functional components. This hook has been called inside the function component\
    \ to add some local state to it. It lets you build your Hooks to reuse stateful\
    \ behavior between different functional component units. Now we will go through\
    \ the built-in hooks first.\n\n> This example renders a counter. Whenever the\
    \ button is clicked, it increases the value.\n\n```\nimport React, { useState\
    \ } from 'react';\nfunction Exmpl() {\n// Declaring a new state variable, which\
    \ called as \"count\"\nconst [count, setCount] = useState(0);\nreturn (\n  <div>\n\
    \    <p>You clicked {count} times</p>\n    <button onClick={() => setCount(count\
    \ + 1)}>\n      Click it\n    </button>\n  </div>\n);\n}\n```"
