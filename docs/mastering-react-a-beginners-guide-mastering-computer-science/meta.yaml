  md: '# React Routers ■ 91


    It is also worth observing that the react-router package uses the Path-to-RegExp
    package to turn the path string into the regular expression and matched against
    the current location.


    The <Route/> component or module offers three props that can be used to determine
    which component to render:


    +   - => component

    - => render

    - => children


    # Component Prop


    The component prop expresses that the Route will return the React element when
    the path is coordinated. This React element is formed from the provided component
    or module using React.createElement. There is an example using the component prop.


    ```

    <Route

    exact

    path="items"

    component={Items}

    />

    ```


    In this example, the Items components will be returned when the path matches the
    present location.


    # Render Prop


    The render prop provides the capability for inline rendering and passing extra
    props to the element and this prop expects the function that returns a React element
    when the present location matches the route’s route. There are examples demonstrating
    the use of the render prop on the Route component.


    ```

    <Route

    exact

    path="items"

    render={() => (<div>List of Items</div>)}

    />

    ```'
