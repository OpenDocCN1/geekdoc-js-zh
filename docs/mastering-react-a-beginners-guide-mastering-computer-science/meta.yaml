    ```

    const UserProvider = ({ children }) => {

    const [name, setName] = useState("John Doe");

    const [age, setAge] = useState(1);

    const happyBirthday = () => setAge(age + 1);

    return (

    <UserContext.Provider value={{ name, age, happyBirthday }}>

    {children}}

    </UserContext.Provider>

    );

    };

    ```


    Create a higher order component/module to consume the context named: with, e.g.,
    withUser.


    Example using React Hooks


    ```

    const withUser = (Child) => (props) => (<UserContext.Consumer>

    {(context) => <Child {...props} {...context} />

    /* Another option is: {context => <Child {...props} context={context}/>} */

    </UserContext.Consumer>

    );

    ```


    The difference between these two options is if you want the context to be a single
    nested property with this name, you must explode it to its properties (which in
    my opinion is more convenient).'
