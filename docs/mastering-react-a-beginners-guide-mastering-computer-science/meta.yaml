  md: 'The whole essence of building front-end user interfaces with React is how flexible
    it is to create these UIs, as components, and also style to give us a great look
    and experience and it is important to know that whatever styling approaches you
    may decide to use in still CSS - you are writing the CSS as you have always done.
    The difference is that the strategies (which we will be looking at) help make
    the procedure easy because of the exclusivity of React.


    # Major Styling Strategies in React #


    There are numerous strategies to follow when planning to style React components,
    these strategies have also enhanced and evolved over the years. In this part,
    we''ll go over the most common and up-to-date stylistic strategies, as well as
    how to apply them to React components. Among these methods are:


    +   1. CSS and SCSS stylesheets: They entail employing distinct stylesheets, similar
    to how we conservatively style our HTML web pages or applications with CSS or
    a CSS compiler called SASS.


    +   2. CSS modules: A CSS component is a CSS file that comprises class and animation
    names, which are by default scoped locally.


    +   3. Styled components: Styled Styled components are the library for React and
    React Native that permit you to use component-level styles in your app that are
    written with a mixture of JavaScript and CSS using a method called CSS-in-JS.


    +   4. JSS: JSS is a CSS writing tool that lets you utilize JavaScript to specify
    styles in a declarative, conflict-free, and recyclable manner. It can build in
    the browser, on the server, or in Node at build time.'
