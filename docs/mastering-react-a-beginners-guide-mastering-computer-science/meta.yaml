  md: "# Stopping Bubbling\n\nBeginning from the target and moving ahead toward the\
    \ top of the bubbling, i.e., starting from the child to its paternal, it moves\
    \ straight upward.\nA handler can also decide to stop the bubbling when the event\
    \ has been treated entirely. In JavaScript, we use the event.stopPropagation()\
    \ method.\n\nExample:\n\n```\n<!DOCTYPE html>\n<head>\n<meta charset=\"utf-8\"\
    >\n<meta name=\"viewport\" content=\"width=device-width\">\n<title>Event Bubbling</title>\n\
    </head>\n<body>\n<div id=\"p1\">\n<button id=\"c1\" onclick=\"event.stopPropagation()\"\
    >am the child</button>\n</div>\n<script>\nvar parent = document.querySelector('#p1');\n\
    parent.addEventListener('click', function() {\n  console.log(\"Parent is invoked\"\
    );\n});\nvar child = document.querySelector('#c1');\nchild.addEventListener('click',\
    \ function() {\n  console.log(\"Child is invoked\");\n});\n</script>\n</body>\n\
    </html>\n```\n\nIn order to invoke the bubbling and also prevent the handlers\
    \ from running on the current component, we can use event.stopImmediatePropagation()\
    \ process. It is another way that stops the bubbling and implementation of all\
    \ the other handlers. This implies that if a component contains more than one\
    \ event handler on a single event, all event handlers that are bubbling will be\
    \ stopped using this event.stopImmediatePropagation() method."
