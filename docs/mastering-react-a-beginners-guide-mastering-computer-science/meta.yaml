  md: '# 126 Mastering React


    management. Context API is a (type of) new attribute added in React version 16.3
    that let you distribute states through the entire app (or any part of it) lightly
    and easily.


    React Context API: How Does It Work?

    React.createContext() is the syntax that you need. It returns a consumer and a
    provider. The provider works as a module that, as its name suggests, provides
    the states to its children through the entire app and might hold the "store" and
    be the parent of all the modules that might require that store. The component
    that consumes and uses the state is termed Consumers.


    Context API Will Replace Redux?

    No. Well, it''s not the concept. The concept Redux is efficient and came perfectly
    to answer the requirements for the management of the state. Actually, it answered
    the need for this concept so clearly that it came to be known that you''t be a
    React developer/tester if you don''t know your way around the Redux. However,
    Redux has its demerits, and due to this, it''s important to know about the Context
    API gives us Redux doesn''t:


    +   * Simplicity: While using redux people tend to manage almost all of their
    states in redux and there arise two situations:

    1. Overhead: What is the need to create/update 3 files, just to add one small
    feature?

    2. Data Binding: One of the significant merits of React''s one-way data binding
    is that it''s easy to understand and manage – a component passes state to its
    child component. Using Redux takes it away from us.

    * With the use of Context API, we can define several unrelated contexts (stores)
    and use each in its appropriate place in the app.


    How to Use Context API?


    “I''ve been convinced, and now I want to incorporate Context API in my application,”
    you may be thinking. First, make sure you need it. It has been found that most
    people use shared/distributed states across nested modules instead of passing
    them as props. And if you do need it, you must follow the following few steps:'
