  md: '# OTHER THAN RENDERING PROPS


    It''s crucial to realize that because the pattern is called render props, you
    don''t have to utilize a render prop to use it. In fact, a render prop is any
    prop that is a function that a component/method uses to determine what to render.


    Although the above examples are used to render, we could just easily use the children''s
    prop!


    ```

    <Mouse children={mouse => (

    <p>The Mouse position is_{mouse.x}, {mouse.y}</p>

    )}/>

    ```


    And remember that the children prop doesn''t require to be named in the list of
    "attributes" in your JSX element. In spite of that, you can put it directly inside
    the element!


    ```

    <Mouse>

    {mouse => (

    <p>The Mouse position is_{mouse.x}, {mouse.y}</p>

    )}

    </Mouse>

    ```


    You''ll see this technique/method used in the react-motion API. Because this technique/method
    is a little odd, you should definitely clearly indicate in your propTypes child
    should be a function when creating an API like this.


    ```

    Mouse.propTypes = {

    children: PropTypes.func.isRequired

    };

    ```


    # CAVEATS


    Be attentive while using Render Props with React.PureComponent with the use of
    a render, prop can restrict the advantage that comes from the use of React.PureComponent
    if you define the function inside a render method. This is why shallow comparison
    will always return false for new props, and each render, in this case, will generate
    a fresh value for the render prop.'
