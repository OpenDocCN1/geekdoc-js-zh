  md: 'To reference or access assets in the public folder, you will need a particular
    variable called "PUBLIC_URL" You can only access the picture using the %PUBLIC_URL%
    prefix with the "public folder."


    Generally, recommend importing fonts, stylesheets, and images from JavaScript.


    ```

    <link rel="favicon_icons" href="%PUBLIC_URL%/favicon.ico"/>

    <link rel="stylesheet" type="text/css" href="%PUBLIC_URL%/style.css">

    ```


    Notes


    +   - None of the files or scripts in the public folder get minimized or post-processed.

    - Missing files will not be called or triggered during compilation, resulting
    in 404 errors for your users.

    - Because result filenames will not include content hashes, you will need to add
    or rename query parameters whenever they change.


    # USING THE PUBLIC FOLDER


    +   - In the build output, you will require a file with a specific name, such
    as manifest.webmanifest.

    - You will have hundreds of photos and need to dynamically reference their paths.

    - You''d want to add a short script, such as custom.js, outside of the packaged
    code.

    - Some libraries may be incompatible with Webpack, in which case you must include
    it as a <script> tag.


    For instance, if image is in Public Folder,


    index.html


    ```

    <img src="%PUBLIC_URL%/mypic.jpg" alt="mypic"/>

    ```'
