  md: "# 194 Mastering React\n\nTime for the Explanations\n\nWe generate a delay function\
    \ that returns a Promise that will resolve after a specified number of milliseconds.\
    \ We will use this function to block the Generator.\n\nSagas are modified as Generator\
    \ functions that yield objects to the redux-saga middleware. The yielded objects\
    \ are a kind of instructions to be interpreted by the middleware. When a Promise\
    \ is given to the middleware, the Saga is discarded until the Promise is completed.\
    \ In the example above, the incremental Saga is discarded until the Promise is\
    \ returned by delay resolves, which will happen after one second.\n\nOnce the\
    \ Promise is sorted out, the middleware will restart the Saga, executing the next\
    \ yield. The following sentence is the other produced object in this example:\
    \ (type: 'INCREMENT'), which informs the middleware to dispatch an INCREMENT action.\
    \ put is an example of what we call an Effect. Effects are plain JavaScript objects\
    \ which have instructions to be fulfilled by the middleware. When a middleware\
    \ recovers an Effect yielded by the Saga, the Saga is paused until the Effect\
    \ is fulfilled.\n\nSo to summarize, the incremental Saga recovers for 1 second\
    \ via the call to delay(1000), which dispatches an INCREMENT call.\n\nNext, we\
    \ design another Saga watchIncrement. We use takeEvery, a helper or composite\
    \ function provided by redux-saga, to listen for dispatched INCREMENT_ASYNC actions\
    \ or calls and run increment each time.\n\nNow there are two Sagas, and we require\
    \ to execute both at once. To do that, we will add a rootSaga that is responsible\
    \ for starting our other Sagas. In the file saga.js, refactor the file as:\n\n\
    ```\nimport { put, takeEvery, all } from 'redux-saga/\neffect'\nconst delays =\
    \ (ms) => new Promise(res) =>\n  setTimeout(res, ms))\nfunction* helloSaga() {\n\
    \  console.log('Hello Saga!')\n}\nfunction* incrementAsync() {\n  yield delay(1000)\n\
    \  yield put({ type: 'INCREMENT' })\n}\n```"
