  md: '# React Routers


    IN THIS CHAPTER


    +   * Routing

    * Router and query parameters


    React Router is the standard library for routing in React. It empowers the navigation
    among views of various components in the React app; it also permits changing the
    browser URL and keeps the user interface in sync with the URL. It is a standard
    library system built on top of React and is also used to generate routing in the
    React app using Router Package (RRP). It gives the synchronous URL on the browser
    with data or info that will display on the web page. It maintains the standard
    structure and behavior of the app and is mainly used for developing single-page
    web apps.


    Routing is how a user is directed to different pages based on their action or
    requests. ReactJS Router primarily used for developing single-page web apps. React
    Router is used to define the multiple routes in the app. When a user enters the
    URL into the browser and if that path matches any “route” within the router file,
    the user will be redirected to that route.


    Routing is the ability to move between several parts of the app when the user
    enters a URL or clicks on an element (link, button, icon, image, etc.) within
    the app.


    Until this point, you have dealt with the simple projects that do not need needless
    transition from one view to the other; thus, you are yet to cooperate with Routing
    in React.'
