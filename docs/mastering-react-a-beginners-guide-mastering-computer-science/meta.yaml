  md: '# Mastering React


    other components. Generally, React apps are made up of several components, so
    component challenging deals with testing these components exclusively.


    For example, consider a website that has dissimilar web pages with several components.
    Each component will have its own subcomponents. Testing each module without considering
    addition with other components is denoted as component testing.


    Testing this like in React needs more sophisticated tools. So, we would require
    Jest and sometimes more sophisticated tools, like Enzyme, which we will deliberate
    on shortly later.


    # Snapshot Test #


    A snapshot test confirms the user interface (UI) of a website app does not change
    unexpectedly. It records the code of a module at a certain point in time, allowing
    us to compare the component in one state to any likely state it may generate.


    We will study snapshot testing in a future section.


    # Advantages and Disadvantages of Testing #


    Testing is the part that is great and should be done, but it has advantages and
    disadvantages.


    # Advantages #


    +   - It avoids unexpected deterioration.

    - It permits the developer to focus on the existing task, rather than worrying
    about the past.

    - It permits the modular construction of an application that would otherwise be
    too complex to build.

    - It reduces the need for manual confirmation.


    # Disadvantages #


    +   - You require to write more code, as well as fix and maintain.

    - Non-critical test disappointments might cause the app to be excluded in terms
    of continuous incorporation.'
