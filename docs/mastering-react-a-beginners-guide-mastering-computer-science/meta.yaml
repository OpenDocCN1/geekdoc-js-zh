  md: 'Redux Saga offers a collection of composite functions that are used to spawn
    your works when specific calls are dispatched. These can be used to help in managing
    when and how your tasks are implemented.


    Let us take an example that the most used helper function is taki(). This instructs
    the middleware to spawn a new task for every action dispatched to your store similar
    to a given pattern. This provides a behavior identical to Redux Thunk and is as
    simple as it gets: "Application reminds you to fetch something, and go fetch it."


    Now that you have two functionally independent components and modules that needed
    to retrieve the most updated data from the place. Previously they existed on two
    pages and could be visited at any time. It would make sense for both components
    or modules to try to retrieve a new copy of the resource whenever it is rendered.
    Now imagine that your features have changed, and now the two components must be
    on the same page, and now you have a situation where two different components
    are redundantly spawning the same task.


    You could mention one of the components to no longer try to retrieve a new copy
    and rely on the other to design the necessary action or calls to retrieve this
    resource and populate the App store. Or you could add some logic to ensure that
    your component does not try to form a new action to retrieve this resource if
    this resource is already being loaded or mounted. This could also be solved using
    the other Redux-Saga helper function: take(). This function instructs the middleware
    to spawn a new task for an action dispatched matching a given pattern but will
    effectively ignore any new actions until the spawned task has been completed.


    With this, your two independent components or modules can coexist without any
    component-specific logic. As far as your component is concerned, it asks your
    saga to retrieve resources on its behalf and retrieve them from the resultant
    updated states. Your saga decides how to do it and wants to consider two different
    requests from different components. It is packed full useful examples if you''d
    like to get into the low-level details.


    Redux Saga is one of several tools to help you organize your App''s effects. It
