  md: '# 208 Mastering React


    # Event Capturing


    Netscape Browser was the first browser to introduce the method of event capturing.
    Event capturing is contradictory to event bubbling; in event capturing, an event
    moves from the outer-most element to the target, whereas in the case of event
    bubbling, the event movement begins from the target to the outer-most element,
    and event capturing is achieved before event bubbling but capturing is used very
    rarely for the reason that event bubbling is sufficient to handle the event flow.


    # Example of Event Capturing


    Let us consider an example code to understand the working of event capturing.


    ```

    <DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width">

    <title>Event Capturing</title>

    </head>

    <body>

    <div id="p1">

    <button id="c1">I am Child</button>

    </div>

    <script>

    var parent = document.querySelector(''#c1'');

    var child = document.querySelector(''#c1'');

    parent.addEventListener(''click'', function() {

    console.log("Parent is invoked");

    },true);

    child.addEventListener(''click'', function() {

    console.log("Child is invoked");

    });

    </script>

    </body>

    </html>

    ```


    # Explanation of Code


    The above-described codes are based on HTML and JS.

    In the HTML portion, we have formed a div holding id = p1. Inside the div, we
    have nested and formed a button with id = c1.'
