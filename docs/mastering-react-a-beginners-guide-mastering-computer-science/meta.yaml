  md: '# Handling Images


    IN THIS CHAPTER


    +   - Images

    - Importing images

    - Inside public Folder

    - Using Public Folder

    - Inside src Folder


    # IMPORTING IMAGES


    In this chapter, we will study how to use an image or picture with JSX component
    and HTML file using "img" tag in ReactJS file. Adding an image with the JSX component
    in ReactJs is crucial for any developer or designer. In the React App default
    directory structure, you will get two options to upload your images file:


    +   - Inside public folder

    - Inside src folder


    # INSIDE PUBLIC FOLDER


    If you insert a file in the public folder, it will not be processed by Webpack.
    Instead, it will copy in the build folder without any external Changement.'
