    # Protected Routes


    The rationale for having the protected route or paths is that when any user tries
    to access part of the app without logging in, they are redirected to the login
    page to sign in to the app.


    For this re-direct to work as intended, the react-router package provides the
    <Redirect/> component to serve this purpose, and this component has to prop which
    is passed to it in the form of an object comprising the path-name and state as
    shown below:


    ```

    <Redirect

    to={{pathname: ''/login'', state: {from:props.location}}} />

    ```


    Here, the Redirect component or module replaces the present location in the stack
    with the path name provided in the object (/login) and saves the location that
    the user was attempting to visit, in the state''s property. The values in the
    state can be retrieved from the Login components using props.location.state.


    For example, if the user attempts to navigate to /admin, a protected route, without
    log first, they will be redirected to the login page. Following the successful
    sign-in, they will be redirected to /admin, the route they intended to visit in
    the first place.


    # Custom Routes


    In order to attain the concept of protected routes, we must first understand how
    to form custom routes.


    Custom routes are an extravagant way of nesting a route inside the component,
    and this is typically done when there is a need to choose whether the components
    render or not.


    In the case of the protected route, a given route should only be retrieved when
    a user is logged in; else, the user should be directed to the login page.


