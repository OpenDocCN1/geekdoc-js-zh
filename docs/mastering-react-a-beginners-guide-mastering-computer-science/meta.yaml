  md: '# 214 ■ Mastering React


    # DATA VALIDATION


    Data validation is the process of confirming that user input is clean, correct,
    and useful.


    Typical validation tasks are:


    +   * Has the user filled in all mandatory fields?

    * Has the user filled a valid date?

    * Has the user filled out text in a numeric field?


    Often data, data authentication aims to ensure correct user input.

    Validation can be defined by many different approaches and deployed in several
    ways.


    - A web server executes server-side validation after the input has been sent to
    the server.

    - A web browser executes client-side validation before the input is sent to a
    web server.


    # HTML CONSTRAINT VALIDATION


    HTML5 introduced a new HTML validation method called constraint validation.

    HTML constraint validation is based on:


    +   * Constraint validation HTML Input Features

    * Constraint validation CSS Pseudo Selectors

    * Constraint validation DOM Properties and Approaches

    * Constraint Validation HTML Input Attributes


    # ATTRIBUTE DESCRIPTION


    +   * Disabled specifies that the input element should be disabled.

    * Max specifies the extreme value of an input element.

    * Min specifies the lowest value of an input element.

    * Pattern specifies the value patterns of an input element.

    * Required specifies that the input field needs an element.

    * Type specifies the type of an input element.


    For a full list, go to HTML Input Attributes.'
