  md: '# Testing Your Code


    IN THIS CHAPTER


    +   > Testing

    > Jest

    > Nock

    > react-testing-library


    You can check React components in the same way that you would test any JavaScript
    code.


    There are some ways to test React components. Broadly, they are divided into two
    categories:


    +   1. Rendering component trees in a basic test environment and asserting their
    output.


    +   2. Running a complete app in a genuine browser environment (also known as
    “end-to-end” tests).


    This documentation unit focuses on challenging approaches for the first event.
    While full end-to-end tests can be very valuable to prevent regressions to significant
    workflows, tests are not concerned with the React components in particular and
    are out of the scope of this section.'
