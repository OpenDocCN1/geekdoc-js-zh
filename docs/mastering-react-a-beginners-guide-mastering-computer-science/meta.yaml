  md: '# 150 Mastering React


    # TRADE-OFFS


    When selecting testing tools, it is worth noting a few trade-offs:


    +   - Iteration speed vs. realistic environment: Some tools offer a very quick
    response loop between making a modification and seeing the result but do not model
    the browser behavior precisely. Other tools might use an actual browser environment,
    but reduce the iteration speed and are flaker on a continuous combination server.

    - How much to mock: With components, the difference between a "unit" and an "integration"
    test can be blurry. If you are testing a form, would it experiment and also test
    the buttons inside it? Or should a button component have its own test suite? Should
    refactoring a button ever break the test?


    Different responses may work for different teams and products.


    # Recommended Tools


    Jest is a JavaScript assessment runner that allows you to access the DOM via jsdom.
    While jsdom is only an estimate of how the browser works, it is frequently good
    and sufficient for testing the React components. Jest has a fast repetition rate
    mixed with sophisticated features modules and timers to give you more control
    over how the code executes.


    React Testing Library is a set of helpers that allows you to test React components
    without relying on their execution details. This method makes refactoring a breeze
    and also pushes you toward the best performance for availability. Even though
    it doesn''t provide a way to "shallowly" render a module without its children,
    a test runner like Jest allows you to do this by mocking.


    In this chapter, I''m going to introduce you to a React testing tool Enzyme, along
    with the popular public library to test React components. I''ll announce to you
    Jest testing methods, including running tests, testing React components, snapshot
    testing, and mocking. If you are new to testing and inquisitive about how to get
    going, you will find this chapter helpful because we will start with an outline
    for testing. By the end, you will be up and running, testing React apps using
    Jest and Enzyme. You should be acquainted with React in order to follow this chapter.'
