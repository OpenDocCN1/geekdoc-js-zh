  md: 'Pros: If we place only the client-side form validation logic (JavaScript),
    then it decreases the network round trips between client and server as the form
    validation takes place on the client-side itself without going to the server.


    # Approach 3: Placing form authentication logic both on the server side and client
    side.


    Pros: Write both client- and server-side authentication logic, so the server-side
    form validation takes place even though client-side form authentication is not
    done.


    Cons: If client-side form authentication is executed, then it will also perform
    server-side form authentication, which degrades the performance.


    # Approach 4: Place form authentication logic both on the server side and client
    side, but accomplish server-side form authentication logic only when client-side
    form validation logic is affected.


    Write both client-side and server-side form authentications, but enable server-side
    form authentications only when client-side form validations are not done. This
    client(browser) detects a flag to the server, indicating whether client-side form
    authentications are done or not.


    Conclusion: Approach 4 is the best approach or method. Compared to the other approach,
    Approach 4 does not have a performance issue because the server side will perform
    only when client-side form authentications are not done.


