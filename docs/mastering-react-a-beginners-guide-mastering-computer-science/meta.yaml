  md: "# 196 ■ Mastering React\n\nare naturally positive. Thus, we have a problem;\
    \ there is nowhere in your Redux application to place your side-effects.\n\n Redux\
    \ middleware is associated between an action and a reducer. This allows actions\
    \ to contain something else than the plain object, as long as the middleware intercepts\
    \ it, performs its functionality, and returns a plain object to pass along toward\
    \ the reducer.\n\n Redux Thunk, a popular Redux-Saga option, allows functions\
    \ to enter the Redux store dispatch, which checks to see if it is a function or\
    \ an action object or module, starting the component in the former scenario and\
    \ directly passing along with the action objects and these functions can then\
    \ perform whatever asynchronous logic they want and produce a plain action or\
    \ object to be passed into the reducer.\n\n Redux Sagas are somewhat different\
    \ in that a separate set of instructions are defined in your Redux app, which\
    \ is captured exclusively by watch functions (as part of saga). The Saga will\
    \ implement the corresponding logic and dispatch a result to your App's reducer\
    \ upon capturing the calls. The Saga effectively operates as a second thread to\
    \ your App, listening for actions from your main application to do sophisticated\
    \ asynchronous activities and changing the state of your App once they are completed.\n\
    \nWhile I would not say Redux Saga is inherently better than any of the alternatives\
    \ available, it has benefits that might make you want to consider its use.\n\n\
    \ Redux Saga offers a place completely de-coupled from your action makers for\
    \ to handle your side-effects. Some people feel that this makes your App's data\
    \ flow harder to follow (which I would agree with), but I think that this de-coupling\
    \ makes organizing your codebase and extending functionality simpler down the\
    \ road.\n\n For example, in a situation where you might require to support a workflow\
    \ that needs multiple HTTP requests to different services in a particular order,\
    \ Redux-Saga permits you to compose granular sagas into a single one and represents\
    \ this new high-level function with a separate call. Your application can still\
    \ access/pass each individual HTTP resource in another workflow, but for this\
    \ specific one, your React component can manually call this high-level action\
    \ to load whatever it requires from a single place. As far as your component or\
    \ module is concerned, your asynchronous logic to load multiple resources in a\
    \ particular order is an abstracted way."
