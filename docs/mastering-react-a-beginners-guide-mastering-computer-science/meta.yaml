    and RATE_COLOR. But remember, each reducer focuses on a specific part of the state
    tree. RATE_COLOR in the color reducer will focus on locating the color that needs
    to be rated in the array; ADD_COLOR in the color reducer will result in a new
    color object with the correct properties; ADD_COLOR in the colors reducer will
    return an array that has an additional color object. They are meant to work together.
