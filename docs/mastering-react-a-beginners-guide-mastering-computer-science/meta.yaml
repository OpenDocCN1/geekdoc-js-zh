- img_proc: false
  md: 'This chapter introduces routing in a React app. To extend your apps by adding
    the routing capabilities, you will use the popular react-router library. It is
    worth noting that this library has three variants:


    +   1. react-router: It is the core library.


    +   2. react-router-dom: It is a variant of the core library meant to be used
    for web apps.


    +   3. react-router-native: It is a variant of the core library used with the
    react-native in the development of Android and iOS apps.


    # NEED FOR REACT ROUTER


    React Router plays an essential role in displaying multiple views in a single-page
    app. Without the React Router, it is impossible to display multiple views in React
    apps. Most social media websites like Facebook and Instagram use the React Router
    to render multiple views.


    # REACT ROUTER INSTALLATION


    React contains three different packages for routing:


    +   1. react-router: It provides the core routing components or methods and functions
    for the React Router apps.


    +   2. react-router-native: It is used for mobile apps.


    +   3. react-router-dom: It is used for web apps design.


    It is not feasible to include React Router in your app directly. To Utilize React
    routing, you must first install the react-router-dom modules in your project.
    The react-router-dom is installed with the command below:


    ```

    $ npm install react-router-dom --save

    ```


    # COMPONENTS IN REACT ROUTER


    Router components are classified into two types:


    +   1. <BrowserRouter>: It is used to handle dynamic URLs.


    +   2. <HashRouter>: It is used for handling static requests.'
