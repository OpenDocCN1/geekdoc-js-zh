    \ are termed reducers.\n\nReducers are functions that take the existing state\
    \ along with action\n\nas arguments and use them to form and return a new state.\
    \ Reducers are\n\nintended to update precise parts of the state tree, either leaves\
    \ or branches,\n\nand we can then compose reducers into one reducer that can handle\n\
    \nupdating the entire state of our application given any action. The color\n\n\
    coordinator stores all of the state data in a single tree, and if we want to use\n\
