    \ called Bright White to the\n\nstates. All of the info for the new color is involved\
    \ in the action. Actions\n\nare nice little packages that tell Redux how the state\
    \ should alter. They also\n\ninclude any related data that Redux will need to\
    \ modify. In Reducers, our\n\nentire state tree is saved in a single object. A\
    \ potential complaint might be\n\nthat it is not modular enough, possibly because\
