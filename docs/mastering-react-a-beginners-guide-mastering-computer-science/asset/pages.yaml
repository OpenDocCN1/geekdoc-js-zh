    \ Since the form authentication logic is not\n\nwritten on the server side, therefore,\
    \ the client-side form authentication\n\nlogic becomes useless.\n\nTo visualize\
    \ how it works: Disable the JS JavaScript codes in your\n\nbrowser and again run\
