  md: "Advanced Tools\uFEFF    ◾    **135**\n\nIt allows using functional components\
    \ of the lifecycle, states, pure com­\n\nponents, etc.\n\nReact also provides\
    \ a few built-in Hooks like useState, useEffect etc.,\n\nwhereas you can also\
    \ create hooks on your own.\n\nHooks allows you to reuse stateful logic concepts\
    \ without changing\n\nyour component sequence. This makes it easy to manipulate\
    \ and share\n\nHooks among many components or among the community. Before mov­\n\
    \ning ahead, note that you can try Hooks in a few components without\n\nrewriting\
    \ any existing code.\n\nHooks allow you to break into a different component of\
    \ other sev­\n\neral smaller function-based figures on what the pieces have been\n\
    \nmapped (such as setting a subscription or detecting the data), despite\n\nmaking\
    \ a split based on lifecycle methods. You can also choose from\n\nmanaging the\
    \ component’s initial state with a reducer to make it more\n\npredictable.\n\n\
    State Hook\n\nIt is a built-in Hook (useState) that is used to create a React\
    \ state for the\n\nfunctional components. This hook has been called inside the\
    \ function\n\ncomponent to add some local state to it. It lets you build your\
    \ own Hooks\n\nto reuse stateful behavior between different functional component\
    \ units.\n\nNow we will go through the built-in hooks first.\n\nThis example renders\
    \ a counter. Whenever the button is clicked, it\n\nincreases the value.\n\nimport\
    \ React, { useState } from 'react';\n\nfunction Exmp1() {\n\n// Declaring  a \a\
    new state variable, which called as\n\n\"count\"\n\nconst [count, set_Count] =\
    \ useState(0);\n\nreturn (\n\n<div>\n\n<p>You clicked {count} times</p>\n\n<button\
    \ onClick={() => set_Count(count + 1)}>\n\nClick it\n\n</button>\n\n</div>\n\n\
    );\n\n}"
