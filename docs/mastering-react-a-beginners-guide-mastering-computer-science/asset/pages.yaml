  md: "**194**    ◾    Mastering React\uFEFF\n\nTime for the Explanations\n\nWe generate\
    \ a delay function that returns a Promise that will resolve after\n\na specified\
    \ number of milliseconds. We will use this function to block the\n\nGenerator.\n\
    \nSagas are modified as Generator functions that yield objects to the\n\nredux-saga\
    \ middleware. The yielded objects are a kind of instructions to\n\nbe interpreted\
    \ by the middleware. When a Promise is given to the middle­\n\nware, the Saga\
    \ is discarded until the Promise is completed. In the example\n\nabove, the incremental\
    \ sync Saga is discarded until the Promise is returned\n\nby delay resolves, which\
    \ will happen after one second.\n\nOnce the Promise is sorted out, the middleware\
    \ will restart the\n\nSaga, executing codes until the next yield. The following\
    \ sentence is\n\nthe other produced object in this example: the result of executing\
    \ put\n\n(type: 'INCREMENT'), which informs the middleware to dispatch an\n\n\
    INCREMENT action​.p​ut is an example of what we call an Effect. Effects\n\nare\
    \ plain JavaScript objects which have instructions to be fulfilled by the\n\n\
    middleware. When a middleware recovers an Effect yielded by the Saga,\n\nthe Saga\
    \ is paused until the Effect is fulfilled.\n\nSo as to summarize, the incremental\
    \ sync Saga sleeps for 1(one) second\n\nvia the call to delay(1000), then dispatches\
    \ an INCREMENT call.\n\nNext, we design another Saga watchIncrementAsync. We use\
    \ takeEv­\n\nery, a helper or composite function provided by redux-saga, to listen\
    \ for\n\ndispatched INCREMENT_ASYNC actions or calls and run incrementA­\n\nsync\
    \ each time.\n\nNow there are two Sagas, and we require to execute them both at\
    \ once.\n\nTo do that, we will add a rootSaga that is responsible for starting\
    \ our other\n\nSagas. In the file sagas​.j​s, refactor the file as follows:\n\n\
    import { \aput, takeEvery, all }from 'redux-saga/\n\neffects'\n\nconst delays\
    \ = (ms) => \anew Promise(res =>\n\nsetTimeout(res, ms))\n\nfunction* helloSaga()\
    \ {\n\nconsole​.l​og('Hello Saga!')\n\n}\n\nfunction* incrementAsync() {\n\nyield\
    \ delay(1000)\n\nyield put ({ type: 'INCREMENT' })\n\n}"
