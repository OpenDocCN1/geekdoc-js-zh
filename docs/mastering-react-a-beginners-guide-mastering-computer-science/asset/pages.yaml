  md: "**70**    ◾    Mastering React\uFEFF\n\nSTARTING THE DEVELOPMENT SERVER\n\n\
    Run one of the two commands on your console to start the application’s\n\ndevelopment\
    \ server, depending on which package manager you’re using.\n\nyarn start\n\nnpm\
    \ start\n\nWith everything set up for our project, we can now open our project\
    \ in\n\na code editor and begin typing some code.\n\nCREATING OUR COMPONENT\n\n\
    First, we need to form a folder to save our components. Within the *src*\n\nfolder\
    \ in your project edifice, create a folder and name its *components*.\n\nIn your\
    \ newly created components folder, form two files and name:\n\none *Landing​.​js*\
    \ and the other *Header​.js​*. Next, we will make our com­\n\nponents and style\
    \ them within these two documents, as we will see\n\nbriefly.\n\nBefore moving\
    \ further, we start working with the CSS-in-JS (Styled-\n\ncomponents), open the\
    \ *Landing​.​js* file, and add the subsequent code to\n\nform our first component.\n\
    \nWe form the Landing​.​js component with the code below:\n\nimport styled from\
    \ \"styled-components\"; the styled component library\n\nwe installed is neccessary\
    \ here!\n\nThis component will render landing page contents in the container.\n\
    \nconst Landing = (props)=>{ // a functional component\n\nreturn\n\n(<Container>\n\
    \n<Content>\n\n<Content>\n\n</Container>);\n\n}\n\nexport default Landing;\n\n\
    To make our second component, open the Header​.​js file in the compo­\n\nnent\
    \ folder."
