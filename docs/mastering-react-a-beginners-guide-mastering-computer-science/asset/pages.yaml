  md: "**88**    ◾    Mastering React\uFEFF\n\nThis chapter introduces routing in\
    \ a React app. To extend your apps\n\nby adding the routing capabilities, you\
    \ will use the popular react-router\n\nlibrary. It is worth noting that this library\
    \ has three variants:\n\n1. **react-router**: It is the core library.\n\n2. **react-router-dom**:\
    \ It is a variant of the core library meant to be used\n\nfor web apps.\n\n3.\
    \ **react-router-native**: It is a variant of the core library used with the\n\
    \nreact-native in the development of Android and iOS apps.\n\nNEED FOR REACT ROUTER\n\
    \nReact Router plays an essential role in displaying multiple views in a sin­\n\
    \ngle-page app. Without the React Router, it is impossible to display mul­\n\n\
    tiple views in React apps. Most social media websites like Facebook and\n\nInstagram\
    \ use the React Router to render multiple views.\n\nREACT ROUTER INSTALLATION\n\
    \nReact contains three different packages for routing:\n\n1. **react-router**:\
    \ It provides the core routing components or methods\n\nand functions for the\
    \ React Router apps.\n\n2. **react-router-native**: It is used for mobile apps.\n\
    \n3. **react-router-dom**: It is used for web apps design.\n\nIt is not feasible\
    \ to include React Router in your app directly. To utilize\n\nReact routing, you\
    \ must first install the react-router-dom modules in your\n\nproject. The react-router-dom\
    \ is installed with the command below:\n\n$ npm install react-router-dom --save\n\
    \nCOMPONENTS IN REACT ROUTER\n\nRouter components are classified into two types:\n\
    \n1. **<****BrowserRouter****>**: It is used to handle dynamic URLs.\n\n2. **<****HashRouter****>**:\
    \ It is used for handling static requests."
