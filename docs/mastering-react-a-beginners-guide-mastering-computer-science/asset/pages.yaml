  md: "Advanced Tools\uFEFF    ◾    **133**\n\n*Class.contextType*\n\nclass MyClass\
    \ extends React.Component {\n\ncomponentDidMount() {\n\nlet value1 = this.context;\n\
    \n//* performing a side-effect \aat mount using the\n\nvalue of MyContext *//\n\
    \n}\n\ncomponentDidUpdate() {\n\nlet value1 = this.context ;\n\n/* ...... */\n\
    \n}\n\ncomponentWillUnmount() {\n\nlet value1 = this.context;\n\n/* ... */\n\n\
    }\n\nrender() {\n\nlet value1 = this.context;\n\n/* render something that based\
    \ \aon the value of\n\nMyContext class */\n\n}\n\n}\n\nMyClass.contextType = MyContext;\n\
    \nThis contextType feature on a class can be assigned to as a Context object\n\
    \ndesigned by React.createContext(). Using these features allows you to con­\n\
    \nsume the nearest current/updated value of that Context type with the use\n\n\
    this.context class. You can reference these features in any of the lifecycle\n\
    \nmethods, including the render function/method.\n\n*Note*: This API only allows\
    \ you to subscribe to a single context; if you\n\nneed to read more than one,\
    \ see Consuming Multiple/Several Contexts.\n\nIf anyone is using the experimental\
    \ public class fields syntax, one can\n\nuse a static class field to initialize\
    \ your contextType.\n\nclass MyClass extends React.Component {\n\nstatic contextType\
    \ = UserContext;\n\nrender() {\n\nlet value1 = this.context;\n\n/* render something\
    \ based on the value */\n\n}"
