  md: "**156**    ◾    Mastering React\uFEFF\n\nit(\"renders Account header\", ()\
    \ => {\n\n  const wrapper = shallow(<App />);\n\n  const header = \a<h1>Display\
    \ Active Users Account\n\nDetails</h1>;\n\n  expe​ct(wr​apper​.cont​ains(​heade​r)).t​oEqua​l(tru​e);\n\
    \n});\n\nOur first test will be skipped because we have used the skip method to\n\
    \nseparate the test. So, it will not execute or make any alteration to our test\n\
    \nwhen Jest runs and only the second one will execute. You can also use it​\n\n\
    .on​ly().\n\nIt is a bit frustrating to make changes in a text file and then have\
    \ to\n\nmanually run the npm test again. Jest has a nice attribute called watch\n\
    \nmode, which watches for file changes and runs tests, respectively. To run\n\n\
    Jest in watch-mode, you can run npm test -- --watch or jest --watch and I\n\n\
    would also recommend leaving Jest executing in the terminal window for\n\nthe\
    \ rest of this lesson.\n\nMocking Function #\n\nA mock is a convincing duplicate\
    \ or look-alike of a module or object with­\n\nout any real inner working. It\
    \ may have a tiny or small functionality, but\n\ncompared to the real thing, it\
    \ is a mock. Jest may generate it either manu­\n\nally or automatically.\n\nWhy\
    \ should we mock, or do we even need to mock? Mocking decreases\n\ndependencies,\
    \ or the amount of associated files that must be loaded and\n\nprocessed when\
    \ a test is executed. Using a large number of mocks speeds\n\nup test execution.\n\
    \nMock functions are sometimes known as “spies” because they allow\n\nyou to spy\
    \ on the behavior of a function that is directly called by another\n\npiece of\
    \ code, rather than merely evaluating the output of the code.\n\nThere are two\
    \ ways to mock a function: either create a mock function\n\nto use it in the test\
    \ code or write a manual mock to override a module\n\ndependency.\n\nManual mocks\
    \ are used to press out functionality with the mock data.\n\nFor example, rather\
    \ than accessing a remote resource, like a database or a\n\nwebsite, you may want\
    \ to make or create a manual mock that allows you\n\nto use the fake data.\n\n\
    We will use the mock function in the coming section."
