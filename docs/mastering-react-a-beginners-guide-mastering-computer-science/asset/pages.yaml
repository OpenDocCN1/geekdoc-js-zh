  md: "**208**    ◾    Mastering React\uFEFF\n\nEvent Capturing\n\nNetscape Browser\
    \ was the first browser to introduce the method of event\n\ncapturing. Event capturing\
    \ is contradictory to event bubbling; in event\n\ncapturing, an event moves from\
    \ the outer-most element to the target,\n\nwhereas in the case of event bubbling,\
    \ the event movement begins from\n\nthe target to the outer-most element in the\
    \ file, and event capturing is\n\nachieved before event bubbling but capturing\
    \ is used very rarely for the\n\nreason that event bubbling is sufficient to handle\
    \ the event flow.\n\n*Example of Event Capturing*\n\nLet us consider an example\
    \ code to understand the working of event\n\ncapturing.\n\n<!DOCTYPE html>\n\n\
    <html>\n\n<head>\n\n<meta charset=\"utf-8\">\n\n<meta name=\"viewport\" content=\"\
    width=device-width\">\n\n<title>Event Capturing</title>\n\n</head>\n\n<body>\n\
    \n<div id=\"p1\">\n\n<button id=\"c1\">I am Child</button>\n\n</div>\n\n<script>\n\
    \nvar parent = document.querySelector('#p1');\n\nvar child = document.querySelector('#c1');\n\
    \nparent.addEventListener('click', function(){\n\nconsole​.l​og(\"Parent is invoked\"\
    );\n\n},true);\n\nchild.addEventListener('click', function(){\n\nconsole​.l​og(\"\
    Child is invoked\");\n\n});\n\n</script>\n\n</body>\n\n</html>\n\n*Explanation\
    \ of Code*\n\nThe above-described codes are based on HTML and JS.\n\nIn the HTML\
    \ portion, we have formed a div id holding id = p1\\. Inside\n\nthe div, we have\
    \ nested and formed a button with id = c1."
