  md: "React Routers\uFEFF    ◾    **93**\n\nIn the browser, when you navigate for\
    \ /items/3, the React elements in\n\nboth Route components will be rendered as\
    \ shown below:\n\n• List of items\n\n• An item with id of 3\n\nThis could be the\
    \ envisioned behavior, where the first component displays\n\nthe label and the\
    \ other paths with the same base route render different\n\nuser interfaces.\n\n\
    Let us modify the above example and include the <Switch/> compo­\n\nnent and observe\
    \ the behavior when we navigate to /items/4.5.\n\n<Switch>\n\n<Route\n\npath=”/items”\n\
    \nrender={() => (<div><em>List of the items</em></\n\ndiv>)}\n\n/>\n\n<Route\n\
    \npath=”/items/4.5\"\n\nrender={() => (<div>Item with id of 4.5</div>)}\n\n/>\n\
    \n</Switch>\n\nIn the browser, only the List of Items will render and this is\
    \ because the\n\nSwitch component matches only the first route that matches the\
    \ current\n\nposition. In this example, the route /items have matched when /items/4.5\n\
    \nentered the browser’s address bar.\n\nLink\n\nThe react-router package also\
    \ contains the <Link/> component used to\n\ndirect the different fragments of\
    \ an app through hyperlinks. It is like the\n\nHTML’s anchor element, but the\
    \ key difference is that using the Link com­\n\nponent does not reload the page\
