  md: "**158**    ◾    Mastering React\uFEFF\n\nWe have two tests above, and we use\
    \ a describe layer, which takes the\n\ncomponent that is being tested. By mentioning\
    \ the values and props that\n\nwe expect to be passed by the test, we are able\
    \ to proceed further.\n\nIn our first test, we see if the props we gave to the\
    \ mounted component\n\nmatch the mock props we produced earlier.\n\nIn the second\
    \ test, we send the user props to the mounted Account\n\ncomponents and then see\
    \ whether we can discover the <p> element that\n\ncorrelates to what is in the\
    \ Account components. When we run the test\n\nsuite, you will see that the test\
    \ runs successfully.\n\nWe can also test the states of our components. Let us\
    \ check whether the\n\nstate of the error message is equal to null:\n\nit(\"renders\
    \ correctly with no error message\", () => {\n\nconst wrapper = mount();\n\nexpe​ct(wr​apper​.sta​t​e(\"\
    er​ror\")​).toE​qual(​null)​;\n\n});\n\nIn this test, we determine whether the\
    \ state of our components error or\n\nbug is equal to null, using a toEqual()\
    \ matcher function. If there is a bug or\n\nerror message in our application,\
    \ the test will fail when executed.\n\nIn this lesson, we’ll go through how to\
    \ test React components using\n\nsnapshot testing, which is yet another fantastic\
    \ methodology or method.\n\nSnapshot Testing #\n\nSnapshot testing captures the\
    \ codes of components at a moment in the\n\ntime, in order to match them to reference\
    \ snapshot files saved alongside\n\nthe test. It is used to keep track of modifications\
    \ in an application’s UI.\n\nThe actual code representation of a snapshot is a\
    \ JSON file, and this\n\nJSON contains a record of what the components looked\
    \ like when the\n\nsnapshot was created. During a test, Jest matches the contents\
    \ of this JSON\n\nfile to the output of the components during the test and if\
    \ they match, the\n\ntest passes; if they do not, the test fails.\n\nTo change\
    \ an Enzyme wrapper to a format that is just with Jest snap­\n\nshot testing,\
    \ we have to install enzyme-to-json:\n\nnpm install --save-dev enzyme-to-JSON\n\
    \nLet us write our snapshot test and run it for the first time; a snapshot of\n\
    \nthat component’s code will compose and be saved in a new __snapshots__\n\nfolder\
    \ in the src directory."
