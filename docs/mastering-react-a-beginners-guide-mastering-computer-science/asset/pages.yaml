    \ = n =>\n\nfetch(`https://random​_user​.me​/api/​?nat=${n}`)\n\n.then(throwNon200)\n\
    \n.then(res => res​.js​on())\n\n.catch(e => console​.l​og(e));\n\nAs we are using\
    \ the nock​.bac​k, the nock​.​js helper file is also used, we\n\nwill look at\
    \ this later.\n\nUsing “Nock”\n\nThe Nock documents explain this pretty well.\
    \ Several options are available\n\nto specify the alteration of the requests,\
    \ whether in the request resembles"
