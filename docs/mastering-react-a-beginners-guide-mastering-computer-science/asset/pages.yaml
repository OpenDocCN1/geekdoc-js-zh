  md: "**96**    ◾    Mastering React\uFEFF\n\nWithin the Category components, the\
    \ match object is destructured\n\nin the argument list, and links to the three\
    \ categories are formed using\n\nmatch.URL.\n\nTemplate literals are used to construct\
    \ or design the value of the prop\n\non the Link components to the different /shoe,\
    \ /foods, and /dress URLs.\n\nOpening the above example in a browser and clicking\
    \ on the category\n\nlink indicate three separate categories; when any of these\
    \ categories is\n\nclicked, the URL changes, but the user interface remains unchanged.\n\
    \nTo address this fault or errors and guarantee that the user interface\n\nchanges\
    \ when a category link is visited, we create a dynamic route within\n\nthe Category\
    \ components that utilizes match​.pa​th as its path parameter\n\nand then dynamically\
    \ update the user interface.\n\n<Route\n\npath={`${match​.pa​th}/:categoryName`}\n\
    \nrender={props =>\n\n(<div>\n\n{​props​.matc​h​.par​ams​.c​atego​ryNam​e} category\n\
    \n</div>\n\n)\n\n}\n\n/>\n\nWhen you examine the value of the path prop in the\
    \ above code snip­\n\npet, you will notice that we use:categoryName, a variable\
    \ within the route-\n\nname. The path parameter inside the supplied URL is categoryName,\
    \ and\n\nit collects anything that occurs after '/'category.\n\n:categoryName\
    \ is the path parameter within the given URL and it\n\ncatches everything that\
    \ comes after '/'category.\n\nPassing the values to the path prop in this way\
    \ saves us from having to\n\nhardcode all the different category routes and notice\
    \ the use of template\n\nliterals to construct the right path.\n\nA pathname like\
    \ category/shoes forms a parameter object like the one\n\nbelow:\n\n{\n\ncategoryName:\
    \ \"shoe\"\n\n}\n\nThe render prop in the route example runs the inline render\
    \ which dis­\n\nplays the categoryName param from the matched object contained\
    \ within\n\nprops."
