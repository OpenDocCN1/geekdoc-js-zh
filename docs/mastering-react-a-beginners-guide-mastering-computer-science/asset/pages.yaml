  md: "**144**    ◾    Mastering React\uFEFF\n\nclass MouseTracker extends React.Component\
    \ {\n\nrender() {\n\nreturn (\n\n<div>\n\n<h1>Move the mouse around!</h1>\n\n\
    <Mouse render={mouse => (\n\n<Cat mouse={mouse} />\n\n)}/>\n\n</div>\n\n);\n\n\
    }\n\n}\n\nNow, despite productively cloning the <Mouse> components and\n\nhard-coding\
    \ something else in its render method to resolve for a specific\n\nuse case, we\
    \ provide a render prop that <Mouse> can use to understand\n\nwhat it renders\
    \ firmly.\n\nThe render prop is a function prop that the component uses to know\
    \ what\n\nto render.\n\nThis technique/method makes the behavior that we need\
    \ to distribute\n\nextremely portable. To get this behavior, render a <Mouse>\
    \ with a render\n\nprop that informs what to render with the cursor’s current\
    \ (x, y).\n\nOne interesting thing to know about render props is that you can\
    \ imple­\n\nment the most higher order components (HOC) using a regular compo­\n\
    \nnent with the render prop. Consider an example: if you would prefer to\n\nhave\
    \ the withMouse HOC instead of a <Mouse> components, you could\n\neasily define\
    \ one using a regular <Mouse> with the render prop:\n\n// If \ayou really need\
    \ a HOC for some reason, you can\n\n// create one using a regular components with\
    \ a render\n\nprop!\n\nfunction withMouse(Component) {\n\nreturn class extends\
    \ React.Component {\n\nrender() {\n\nreturn (\n\n<Mouse render={mouse => (\n\n\
    <Component {..​.this​.props} mouse={mouse} />\n\n)}/>\n\n);\n\n}\n\n}\n\n}\n\n\
    Using a render prop allows you to employ either pattern."
