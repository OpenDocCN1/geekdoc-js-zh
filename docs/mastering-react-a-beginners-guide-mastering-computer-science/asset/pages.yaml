  md: "Advanced Tools\uFEFF    ◾    **145**\n\nOTHER THAN RENDERING PROPS\n\nIt’s\
    \ crucial to realize that because the pattern is called *render props*, you\n\n\
    don’t have to utilize a render prop to use it. In fact, a render prop is any\n\
    \nprop that is a function that a component/method uses to determine what\n\nto\
    \ render.\n\nAlthough the above examples are used to render, we could just as\
    \ easily\n\nuse the children’s prop!\n\n<Mouse children={mouse => (\n\n  <p>The\
    \ Mouse position is_ {mouse.x}, {mouse.y}</p>\n\n)}/>\n\nAnd remember that the\
    \ children prop doesn’t require to be named in\n\nthe list of “attributes” in\
    \ your JSX element. In spite of that, you can put it\n\ndirectly *inside* the\
    \ element!\n\n<Mouse>\n\n{mouse => (\n\n<p>The Mouse position is_ {mouse.x}, {mouse.y}</p>\n\
    \n)}\n\n</Mouse>\n\nYou’ll see this technique/method used in the *react-motion*\
    \ API.\n\nBecause this technique/method is a little odd, you should definitely\n\
    \nclearly indicate in your propTypes that child should be a function when\n\n\
    creating an API like this.\n\nMouse.propTypes = {\n\n  children: PropTypes​.func​.isRequi​red\n\
    \n};\n\nCAVEATS\n\nBe attentive while using Render Props with React.PureComponent\n\
    \nwith the use of a render, prop can restrict the advantage that comes\n\nfrom\
    \ the use of React.PureComponent if you define the function inside\n\na render\
    \ method. This is why the shallow prop comparison will always\n\nreturn false\
    \ for new props, and each render, in this case, will generate a\n\nfresh value\
    \ for the render prop."
