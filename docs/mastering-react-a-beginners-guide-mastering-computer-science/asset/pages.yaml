    \ data as the action’s payload. For example, when we dis­\n\npatch an action like\
    \ RATE_COLOR, we will want to know what color to\n\nrate and what rating to apply\
    \ to that color. This info can be passed right\n\nwith the action in the same\
    \ Java Script literal (see the following Example).\n\nExample: RATE_COLOR action\n\
    \n{\n\ntype: \"RATE_COLOR\",\n\nid: \"a5685c39-6bdc-4727-9188-6c9a00bf7f95\"\n\
