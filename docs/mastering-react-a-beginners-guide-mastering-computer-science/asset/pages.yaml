  md: "**134**    ◾    Mastering React\uFEFF\n\n}\n\nContext.Consumer\n\nThe syntax\
    \ of <MyContext.Consumer>\n\n{value1 => /* \arender something based on the context\n\
    \nvalue */}\n\n</MyContext.Consumer>\n\nA React component that subscribes to context\
    \ modified: Using this\n\ncomponent allows you to subscribe to a context within\
    \ the function\n\ncomponents.\n\nNeed a function as a child function: This function\
    \ takes and returns the\n\ncurrent context values to a React node. The value parameter\
    \ provided to\n\nthe function will be the value prop of the nearest Provider in\
    \ the mesh for\n\nthis context. If there is no Provider for the context above,\
    \ the value argu­\n\nment will equal the defaultValue that was passed to createContext().\n\
    \n*Note*: See render props for more information about the function of a\n\nchild’s\
    \ pattern.\n\n*Context.displayName*\n\nA displayName string attribute is available\
    \ on the\n\nContext object. This string is used by React DevTools\n\nto determine\
