  md: "Testing Your Code\uFEFF    ◾    **157**\n\nTesting React Components #\n\nThis\
    \ section will combine all of the knowledge we have acquired till now\n\nin understanding\
    \ how to test the React components. Testing involves\n\nensuring the output of\
    \ a component has not unexpectedly changed to\n\nsomething else. Creating components\
    \ in the right way is the most effective\n\nway to ensure successful testing.\n\
    \nOne thing we may do is to verify the component’s props, specifically\n\nwhether\
    \ or not props from one component are sent to another. Enzyme\n\nand the Jest\
    \ API allow creating a mock function to simulate whether props\n\nare being passed\
    \ between the components or not.\n\nWe need to pass the user-account props to\
    \ the Account component\n\nfrom the main App component. We have to give user-account\
    \ details to\n\nthe Account in order to render or process the active account of\
    \ the users.\n\nThis is where mocking comes in use, enabling us to test our components\n\
    \nwith fake data.\n\nLet us create a mock for the user props:\n\nconst user =\
    \ {\n\nname: \"Adeneye David\",\n\nemail: \"davidadeneye​@gmail​.​com\",\n\nusername:\
    \ \"Dave_Bautista\",\n\n};\n\nWe have formed a manual mock function in the test\
    \ file and enclosed\n\nit around the component. Let’s assume we are testing a\
    \ very large data­\n\nbase of users. Accessing the database directly from the\
    \ text file is not wise.\n\nInstead, we create a mock function, which allows us\
    \ to use fake data to test\n\nour component.\n\ndescribe(\"\", () => {\n\nit(\"\
    accepts user account props\", () => {\n\nconst wrapper = mount(<Account user={user}\
    \ />);\n\nexp​ect(w​rappe​r​.pr​o​ps().​user)​.toEq​ual(u​ser);​\n\n});\n\nit(\"\
    contains users account email\", () => {\n\nconst wrapper = mount(<Account user={user}\
    \ />);\n\nconst value = wrapper​.fi​nd(\"p\").text();\n\nexp​ect(v​alue)​.toEq​ual(\"\
    ​david​@gmai​l​.com​\");\n\n});\n\n});"
