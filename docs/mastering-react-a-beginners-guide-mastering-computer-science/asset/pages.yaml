    The test will fail if we click u to update the snapshot.\n\nWHAT IS NOCK?\n\n\
    • Nock is an HTTP (hypertext markup protocol) server mocking and\n\nexpectations\
    \ library for the Node​.j​s.\n\n• Nock can be used to test a module that performs\
    \ HTTP requests in\n\nan isolated way.\n\n• Nock works by overriding Node’s HTTP.request\
    \ functions. Also, it\n\noverrides HTTP.ClientRequest too to cover modules or\
