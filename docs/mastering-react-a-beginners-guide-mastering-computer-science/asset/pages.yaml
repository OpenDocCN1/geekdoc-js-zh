    \ while in HTML we use the\n\nclass feature. This is because JSX is translated\
    \ into JavaScript and class is a\n\nmentioned word in JavaScript.\n\n*JSX*\n\n\
    <div className = \"content\"></div>\n\n*HTML*\n\n<div class = \"content\"></div>\n\
    \nSelf-closing tags\n\nSelf-closing tags in JSX should have the forward slash,\
    \ whereas the for­\n\nward slash is noncompulsory in the HTML self-closing tags.\n\
    \n*JSX*\n\n<img src=\"abc​.ht​ml\" />\n\n<br/>\n\n*HTML*\n\n<img src=\" abc​.ht​ml\
    \ \" >\n\n<br>\n\nEvent Listeners\n\nEvent auditors in JSX are written in camelCase\
    \ (it’s a type of formatting in\n\nwhich the second term word is capital), for\
    \ instance, onClick, whereas in\n\nHTML, they are written in lowercase, for instance,\
    \ onclick."
