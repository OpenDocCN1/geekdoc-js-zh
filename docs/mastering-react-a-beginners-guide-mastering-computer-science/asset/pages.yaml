    \ add Nock, then look at nock and nock​.ba​ck\n\nwith some code examples.\n\n\
    Adding Nock\n\nWe will be creating this project that contains some simplistic\
    \ functions\n\nthat call a random user-created API, perfect for testing out the\
    \ Nock. It\n\nuses Jest as it is a test runner and for assertions.\n\nThere are\
