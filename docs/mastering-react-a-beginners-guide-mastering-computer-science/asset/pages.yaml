  md: "**174**    ◾    Mastering React\uFEFF\n\nFrom the use of AddColorForm component,\
    \ we can make the store dis­\n\npatch ADD_COLOR actions. When a user submits a\
    \ form, we retrieve the\n\ncolor and title from references and utilize that information\
    \ to generate and\n\ndispatch a new ADD_COLOR action:\n\nimport { PropTypes, Component\
    \ } from 'react'import {\n\naddColor } from '../actions'\n\nconst AddColorForm\
    \ = ({store}) => {\n\nlet _title, _color\n\nconst submit = e => {\n\ne.preventDefault()\n\
    \nstore.dispatch( addColor(​_title​.value, ​_color​.value) )\n\n​_title​.value\
    \ = ''\n\n​_color​.value = '#000000'\n\n​_title​.focus()\n\n}\n\nreturn (\n\n\
    <form className=\"add-color\" onSubmit={submit}>\n\n<input ref={input => _title\
    \ = input}\n\ntype=\"text\"\n\nplaceholder=\"color title...\" required/>\n\n<input\
    \ ref={input => _color = input}\n\ntype=\"color\" required/>\n\n<button>ADD</button>\n\
    \n</form>\n\n)\n\n}\n\nAddColorForm.propTypes = {\n\nstore: PropTypes​.obje​ct\n\
    \n}\n\nexport default AddColorForm\n\nWe import the essential and vital action\
    \ creator, addColor, from this\n\ncomponent. When the user accepts the form, we\
    \ utilize this action maker\n\nto send a new ADD COLOR action directly to the\
    \ store.\n\nThe ColorList component may acquire the original colors and arrange\n\
    \nthem using the store’s getState function. It may also immediately send\n\nRATE\
    \ COLOR and REMOVE COLOR operations as they occur:\n\nimport { PropTypes } from\
    \ 'react'\n\nimport Color from './Color'\n\nimport { rateColor, removeColor }\
    \ from '../actions'\n\nimport { sortFunction } from '../lib/array-helpers'"
