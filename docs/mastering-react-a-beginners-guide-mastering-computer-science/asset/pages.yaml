  md: "Redux\uFEFF    ◾    **177**\n\nconsidering that each component will mutate\
    \ its own state with internal\n\nsetState several calls.\n\nWhat messages are\
    \ expanded? What posts have been read? In order to\n\ntrace these details, we\
    \ must dive into the component hierarchy and track\n\ndown the state inside of\
    \ individual modules.\n\nRedux clarifies the way we view state in our application\
    \ by requiring us\n\nto save all state data in a single object. Everything we\
    \ need to know about\n\nthe App is in one place: one single source of truth. We\
    \ could construct the\n\nsame App with Redux by moving all of the state’s data\
    \ into a single loca­\n\ntion. In the social media App, we can see that we are\
    \ managing the state\n\nof the current user, messages, and posts from the same\
    \ object: the Redux\n\nstore. This object even stores information about the message\
    \ that is being\n\nedited, which messages are expanded, and which posts have been\
    \ seen.\n\nThis information is captured in arrays containing IDs that reference\
    \ spe­\n\ncific records. All of the messages and posts are cached in this state\
    \ object,\n\nso that data is there. With Redux, we pull state management away\
    \ from\n\nReact entirely. Redux will manage the state.\n\nACTIONS\n\nIn the previous\
    \ section, we introduced an important Redux rule: applica­\n\ntion state should\
    \ be stored in a single immutable object. Immutable means\n\nthis state object\
    \ doesn’t change. We will eventually update this state\n\nobject by replacing\
    \ it entirely. In order to do this, we will need instruc­\n\ntions about what\
    \ changes. That’s what actions provide: instructions about\n\nwhat should change\
    \ in the application state along with the necessary data\n\nto make those changes.\
    \ Actions are the only way to update the state of\n\na Redux application. Actions\
    \ provide us with instructions about what\n\nshould change, but we can also look\
    \ at them like receipts about the history\n\nof what has changed over time. If\
    \ users were to remove three colors, add\n\nfour colors, and then rate five colors,\
    \ they would leave a trail of informa­\n\ntion, as shown in\n\nUsually, when we\
    \ sit down to construct an object-oriented application,\n\nwe start by identifying\
    \ the objects, their properties, and how they work\n\ntogether. Our thinking,\
    \ in this case, is noun-oriented. When building a\n\nRedux application, we want\
    \ to shift our thinking into being verb-oriented.\n\nHow will the actions affect\
    \ the state data? Once you identify the actions,\n\nyou can list them in a file\
    \ called constants​.​js.\n\nIn the case of the color organizer, users will need\
    \ to be able to add a\n\ncolor, rate a color, remove color, or sort the color\
    \ list. Here we have defined"
