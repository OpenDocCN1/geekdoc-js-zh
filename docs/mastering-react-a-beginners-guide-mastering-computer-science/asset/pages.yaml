    \n// Invoke when ready to unsubscribe the listener\n\nunsubscribeLogger()\n\n\
    To recap, stores hold and manage state data in Redux applications, and\n\nthe\
    \ only way to change state data is by dispatching actions through the\n\nstore.\
    \ The store holds the application state as a single object. State muta­\n\ntions\
    \ are managed through reducers. Stores are created by supplying a\n\nreducer along\
    \ with optional data for the initial state. Also, we can sub­\n\nscribe listeners\
    \ to our store (and unsubscribe them later), and they will be\n\ninvoked every\
    \ time the store finishes dispatching an action.\n\nBoth the logger and the saver\
    \ are middleware functions. In Redux, mid­\n\ndleware is defined as a higher-order\
