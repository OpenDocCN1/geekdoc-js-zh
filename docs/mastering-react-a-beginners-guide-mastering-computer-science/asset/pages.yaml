    \ bundle size increased, developers or design­\n\ners started to investigate to\
    \ find more active ways to load the bundles to\n\nthe client quicker. Code-splitting\
    \ and lazy loading are two methods for\n\ndramatically reducing the initial loading\
    \ time for clients.\n\n*Strategies or Approaches to Split Your JavaScript JS Codes*\n\
    \n• Route base splitting\n\n• Components base splitting\n\n• Library base splitting\n\
    \nFour distinct libraries are studied in order to perform these code splitting\n\
    \nand slow loading methodologies. Let us go through the libraries one by one.\n\
