    REACT.COMPONENT


    This chapter contains a detailed API reference for the React component


    class description. It assumes that you’re familiar with fundamental React


    concepts, such as components and props and state and lifecycle. If you


    are not, read them first in the previous chapter. A component is one of


    the core structure blocks of ReactJS. In other words, every app you will


    develop or create in React will be made up of modules called components.


    Components help to make user interfaces (UIs) much more accessible and


    more straightforward. You can see UI broken down into several individ­


    ual pieces called components. Work on them independently and combine


    them all in a parent/root component which will be your final UI.


    React lets you define components as classes or functions. Components


    described as classes presently provide more attributes, defined in detail


    later in this chapter. To define a React component class, you have to extend


    React.Component.


