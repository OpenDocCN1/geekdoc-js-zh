    \ the <Greeting /> from the\n\nformer example:\n\nclass LoginControl extends React.Component\
    \ {\n\nconstructor(props) {\n\nsuper(props);\n\nthis.handleLoginClick = this​.handleLoginClick​.b​\n\
    \nind(this);\n\nthis.handleLogoutClick = this​.handleLogoutClick​.b​\n\nind(this);\n\
    \nthis​.sta​te = {isLoggedIn: false};\n\n}\n\nhandleLoginClick() {\n\nthis.setState({isLoggedIn:\
    \ true});\n\n}"
