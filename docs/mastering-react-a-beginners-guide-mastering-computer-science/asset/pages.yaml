  md: "Redux\uFEFF    ◾    **173**\n\nindex​.​js file, we will render an App component\
    \ and pass it to the store:\n\nimport React from 'react'\n\nimport ReactDOM from\
    \ 'react-dom'\n\nimport App from './components/App'\n\nimport storeFactory from\
    \ './store'\n\nconst store = storeFactory()\n\nconst render = () =>\n\nReactDOM​.rend​er(\n\
    \n<App store{store}/>,\n\ndocum​ent.g​etEle​mentB​yId('​react​-cont​ainer​')\n\
    \n)\n\nstore.subscribe(render)\n\nrender()\n\nThis is ./index​.​js file. In this,\
    \ we can create the store with the help of\n\nstoreFactory and render the App\
    \ component into the documents. When\n\nthe App is rendered to the store, it is\
    \ passed to it as a property. Now, every\n\ntime the store changes, the render\
    \ function will be called or invoked,\n\nwhich accurately updates the user interface\
    \ with the new state data.\n\nNow that we have passed or processed the store to\
    \ the App, we have to\n\ncontinue to pass it down to the child components that\
    \ need it.\n\nimport AddColorForm from './AddColorForm'\n\nimport SortMenu from\
    \ './SortMenu'\n\nimport ColorList from './ColorList'\n\nconst App = ({ store\
    \ }) =>\n\n<div className=\"app\">\n\n<SortMenu store={store} />\n\n<AddColorForm\
    \ store={store} />\n\n<ColorList store={store} />\n\n</div>\n\nexport the Default\
    \ App\n\nThe App component is the root component. It captures the store from\n\
    \nthe props and explicitly passes it to its child components. The store is then\n\
    \npassed on to the ColorList, AddColorForm, and SortMenu components as\n\nits\
    \ property.\n\nNow that we have already passed the store from the App, we can\
    \ use it\n\ninside the child components. Remember that we can read state from\
    \ the\n\nstore with the help of store.getState, and we can also dispatch actions\
    \ to\n\nthe store with the use of store.dispatch."
