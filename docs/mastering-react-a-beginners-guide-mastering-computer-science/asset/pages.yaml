  md: "**84**    ◾    Mastering React\uFEFF\n\nTo reference or access assets in the\
    \ public folder, you will need a par­\n\nticular variable called “PUBLIC_URL.”\
    \ You can only access the picture\n\nusing the %PUBLIC_URL% prefix from the “public\
    \ folder.”\n\nGenerally, I recommend importing fonts, stylesheets, and images\
    \ from\n\nJavaScript.\n\n<link rel=\"favicon_icons\" href=\a\"%PUBLIC_URL%/favicons​\n\
    \n.i​co\"/>\n\n<link rel=\"stylesheet\" type=\a\"text/css\" href=\"%PUBLIC_\n\n\
    URL%/style​.c​ss\"/>\n\nNotes\n\n• None of the files or scripts in the public\
    \ folder get minimized or\n\npost-processed.\n\n• Missing files will not be called\
    \ or triggered during compilation,\n\nresulting in 404 errors for your users.\n\
    \n• Because result filenames will not include content hashes, you will\n\nneed\
    \ to add or rename query parameters whenever they change.\n\nUSING THE PUBLIC\
    \ FOLDER\n\n• In the build output, you will require a file with a specific name,\
    \ such\n\nas manifest.webmanifest.\n\n• You will have hundreds of photos and need\
    \ to dynamically reference\n\ntheir paths.\n\n• You’d want to add a short script,\
    \ such as custom​.j​s, outside of the\n\npackaged code.\n\n• Some libraries may\
    \ be incompatible with Webpack, in which case\n\nyou must include it as a <script>\
    \ tag.\n\nFor instance, if image is in Public Folder,\n\nindex​.ht​ml\n\n<img\
    \ src=\"%PUBLIC_URL%/mypic​.j​pg\" alt=\"mypic\"/>"
