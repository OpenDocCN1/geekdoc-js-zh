    \nHeader\n\n</Nav>\n\n);\n\n}\n\nexport default Header;\n\nROUTING A COMPONENT\
    \ INTO THE MAIN APP\n\nTo get things started, let us open App​.j​s, which is the\
    \ base of our app.\n\nThen, we substitute all the content in it with the code\
    \ below to produce an\n\napp function that will load our styled components and\
    \ render them as the\n\nlanding page.\n\nAfter designing components/pages in your\
    \ web apps, you may need to\n\nexpose and allow your users to navigate through\
    \ them. To achieve this,\n\nyou require a dedicated router.\n\n• *React Router*\
    \ is the standard library for dynamic routing of compo­\n\nnents/page views in\
    \ simple ReactJs apps like single-page web apps.\n\n• *React Router* keeps the\
    \ UIs and URLs synchronized, giving users\n\nseamless navigation in web apps.\n\
    \nTo route components into the main application, you will import attri­\n\nbutes\
    \ from the react-router-dom, a React-router package that we installed\n\nearlier.\n\
    \nImport {BrowserRouter as Router, Switch, Route} from \"react-router-dom\";\n\
    \nThe Router, Switch, and Route will help us move between our formed com­\n\n\
    ponent and the main App​.j​s.\n\nImport Landing from \"./components/Landing\"\
    \ This is to import the com­\n\nponent formed in the Landing​.​js file."
