    \ and this​.sta​te in render().\n\nCLASS PROPERTIES\n\ndefaultProps\n\ndefaultProps\
    \ can be defined as a feature on the component class itself, to\n\nset the default\
    \ props for class. This is used for the undefined props, but not\n\nfor null props.\
    \ For example:\n\nclass CustomButton extends React.Component {\n\n// ...\n\n}\n\
    \nCustomButton.defaultProps = {\n\ncolor: 'blue'\n\n};"
