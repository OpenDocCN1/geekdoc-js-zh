    \ by intercepting external\n\nHTTP requests and enabling us to either return custom\
    \ responses to\n\ntest differential scenarios or store real responses as “fixtures,”\
    \ canned\n\ndata that will return reliable responses.\n\nUsing canned data or\
    \ information does come with risks, as it can go\n\nstale if not refreshed or\
    \ render periodically. Without special extra tests or\n\npinned API (Application\
    \ Programming Interface) versioning, a change in\n\nthe structure of the data\
    \ supplied by an API may go undetected, and it is\n\nthe developer’s duty to ensure\
    \ that policies are in place to avoid this."
