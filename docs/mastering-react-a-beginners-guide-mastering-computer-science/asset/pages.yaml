  md: "Forms\uFEFF    ◾    **207**\n\nStopping Bubbling\n\nBeginning from the target\
    \ and moving ahead toward the top of the bub­\n\nbling, i.e., starting from the\
    \ child to its paternal, it moves straight upward.\n\nA handler can also decide\
    \ to stop the bubbling when the event has been\n\ntreated entirely. In JavaScript,\
    \ we use the event.stopPropagation () method.\n\nExample:\n\n<!DOCTYPE html>\n\
    \n<html>\n\n<head>\n\n<meta charset=\"utf-8\">\n\n<meta name=\"viewport\" content=\"\
    width=device-width\">\n\n<title>Event Bubbling</title>\n\n</head>\n\n<body>\n\n\
    <div id=\"p1\">\n\n<button id=\"c1\" onclick=\"event.\astopPropagation()\">I\n\
    \nam the child</button>\n\n</div>\n\n<script>\n\nvar parent = document.querySelector('#p1');\n\
    \nparent.addEventListener('click', function(){\n\nconsole​.l​og(\"Parent is invoked\"\
    );\n\n});\n\nvar child = document.querySelector('#c1');\n\nchild.addEventListener('click',\
    \ function(){\n\nconsole​.l​og(\"Child is invoked\");\n\n});\n\n</script>\n\n\
    </body>\n\n</html>\n\nIn order to invoke the bubbling and also prevent the handlers\
    \ from run­\n\nning on the current component, we can use event.stopImmediatePropaga­\n\
    \ntion () process. It is another way that stops the bubbling and implementation\n\
    \nof all the other handlers. This implies that if a component contains more\n\n\
    than one event handler on a single event, all event handlers that are bub­\n\n\
    bling will be stopped using this event.stopImmediatePropagation() method."
