  md: "Programmatic Navigation\uFEFF    ◾    **113**\n\nTalking about React precisely,\
    \ it bundles the complete codes and\n\ndeploys all of them at the same time. Normally,\
    \ this is not a terrible idea\n\nbecause React SPAs (single-page apps) are relatively\
    \ modest and have no\n\neffect on the presentation, but what if we have a massive\
    \ app, such as a con­\n\ntent management system with a customer portal, admin\
    \ portal, and so on.\n\nIt doesn’t seem like a good idea to load the entire program\
    \ in this scenario.\n\nIt will be a huge app and will cost a lot of needless data\
    \ transmission,\n\nmaking the website load slowly.\n\nBecause a user login will\
    \ not have access to certain admin topogra­\n\nphies, loading it is a waste of\
    \ memory and work.\n\nIn this part, I will explain the advantages of lazy loading\
    \ and how to\n\nimplement it in React.\n\nWhy Is Lazy Loading (and Suspense) Important\n\
    \nFirst, bundling aligns our codes components in the development and\n\nputs them\
    \ in one JavaScript JS portion that it passes to the browser. But\n\nas our app\
    \ grows, we notice that the bundle gets very bulky in size. This\n\ncan swiftly\
    \ make using your app very hard and incredibly sluggish. With\n\ncodes splitting,\
    \ the bundle can split into smaller chunks where the most\n\nsignificant chunk\
    \ can be loaded first and then every other inferior one\n\nlazily loaded.\n\n\
    Also, while building apps, we know that as a best practice, contem­\n\nplation\
    \ should be made for users using mobile internet data and others\n\nwith really\
    \ deliberate internet connections. We, the developers/designers,\n\nshould always\
    \ be able to regulate the user experience even during the sus­\n\npense period\
    \ when resources are being loaded to the DOM.\n\nAdvantages of Lazy Loading\n\n\
    When we know that certain codes/features will not be available to all the\n\n\
    users or the user does not access them often, it is best to load them when\n\n\
    the user needs them. This improves user experience and primary loading\n\ntime.\n\
    \nFor example, let us consider that our app has two sections, A and B. Size\n\n\
    of A is 3 MB, and its loading time is about 3 seconds. As B is also 3 MB in\n\n\
    size, its loading time is similarly 3 seconds, and we know that a user will\n\n\
    visit either of the segments, or that a user receiving section A will seldom\n\
    \naccess section B, and vice versa. If we loaded the entire app at the start of\n\
    \nour app, it would cost the user 6 MB of data and take 6 seconds to load.\n\n\
    The user might not want to wait for 6 seconds or would not be happy that"
