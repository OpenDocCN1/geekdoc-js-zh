  md: "**162**    ◾    Mastering React\uFEFF\n\nor the response returned. The two\
    \ examples of this would be the response\n\nreturned from the successful request,\
    \ and force 500 responses to test the\n\nfunction’s fallback options.\n\nAll that\
    \ would require to be added to the existing test file to start using\n\nNock is\
    \ the const nock = require('nock'); / import nock from 'nock';.\n\nIn the first\
    \ test, we use the string to compare the hostname and path,\n\nspecify a reply\
    \ code and body, and add our assertion to the Promise chain\n\nof our function\
    \ calls. When the outgoing request from getRandomUser()\n\nis formed, it resembles\
    \ the Nock interceptor we just set up, and so the reply\n\nwe specify is returned.\n\
    \nit('should return a user', () => {\n\nnock('https://randomuser​.me')\n\n.get('/api/')\n\
    \n.reply(200, {\n\n  results: [{ name: 'Dominic_' }],\n\n});\n\nreturn query\n\
    \n.getRandomUser()\n\n.then(res => res.results[0].name)\n\n.then(res => expect(res).toEqual('Dominic_'));\n\
    \n});\n\nSimilarly, we mock the call with a specific nationality, so this time\
    \ we\n\nuse a RegExp to compare the hostname and path.\n\nit('should return a\
    \ user of set the nationality', ()\n\n=> {\n\nnock(/random/)\n\n.get(/nat=gb/)\n\
    \n.reply(200, {\n\n  results: [{ nat: 'GB' }],\n\n});\n\nreturn query\n\n.getRandomUserOfNationality('gb')\n\
    \n.then(res => res.results[0].nat)\n\n.then(res => expect(res).toEqual('GB'));\n\
    \n});\n\nIt is important to specify we are using afterAll(nock.restore) and\n\n\
    afterEach(nock.cleanAll) to make sure interceptors do not interrupt each\n\nother."
