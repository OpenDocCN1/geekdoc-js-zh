  md: "**68**    ◾    Mastering React\uFEFF\n\n<div>\n\n<h1>Hello student !</h1>\n\
    \n{unreadMessages​.leng​th > 0 &&\n\n<h2>\n\nYou have {unreadMessages​.leng​th}\
    \ unread messages.\n\n</h2>\n\n}\n\n</div>\n\n);\n\n}\n\nconst messages = ['React',\
    \ 'Re: React', 'Re:Re:\n\nReact'];\n\nReactDOM​.rend​er(\n\n<Mailbox unreadMessages={messages}\
    \ />,\n\ndocument.getElementById('root')\n\n);\n\nIt works because in JavaScript,\
    \ true && expression ever assesses to\n\nexpression, and false && expression always\
    \ appraises to false.\n\nTherefore, if that condition is true, the element right\
    \ after && will\n\nappear in the output or result. If it is false, React will\
    \ avoid and skip it.\n\nWHAT ARE STYLED COMPONENTS\n\n*Styled components* are\
    \ the library built for React and React Native develop­\n\ners or creators. They\
    \ let you use component-level styles in your apps. *Styled*\n\n*components* control\
    \ a mixture of JavaScript and CSS using CSS-in-JS.\n\nStyled components are based\
    \ on tagged template literals, meaning\n\nactual CSS code is written between backticks\
    \ when styling your compo­\n\nnents. This gives developers the flexibility of\
    \ reprocessing their CSS code\n\nfrom one project to the other.\n\nThere is no\
    \ requirement to map your formed components to external\n\nCSS styles with styled\
    \ components.\n\nAdvantages of Using Styled Components\n\nSome of the benefits\
    \ of employing styled components are as follows:\n\n• **Eliminates class name\
    \ errors**: Styled components give unique class\n\nnames for your styles, eliminating\
    \ the difficulties associated with\n\nclass name replication, misspellings, and\
    \ overlaps."
  merge: -1
