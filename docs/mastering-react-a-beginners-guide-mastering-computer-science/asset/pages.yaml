  md: "**90**    ◾    Mastering React\uFEFF\n\nThe HTML5 history API (Application\
    \ Programming Interface) is used\n\nby the BrowserRouter to keep the user interface\
    \ UI in sync with the URL\n\ninside the browser address bar.\n\nThe history object\
    \ formed by the Router contains the number of prop­\n\nerties and one of the position\
    \ properties whose value is also the object. We\n\nshould emphasize the location\
    \ attribute in this chapter because the others\n\nare outside the scope of this\
    \ book.\n\nWhen the preceding example is shown in the browser, the produced\n\n\
    history object should be visible in the React DevTools window, as seen\n\nbelow.\n\
    \n• The location of object within history object is molded so\n\n{ pathname, search,\
    \ hash, state }\n\n• The location object properties or characteristics are derived\
    \ from the\n\napp URL.\n\nRoutes\n\nThe <Route/> module is one of the most significant\
    \ building blocks in\n\nthe React Router package or suite. It renders the proper\
    \ user interface UI\n\nwhen the present location matches the route’s path. The\
    \ path is the prop\n\non the <Route/> module that defines the pathname that the\
    \ route should\n\nmatch as shown in the following example:\n\n<Route path=”/items”/>\n\
    \nThis route is matched when pathname is /items or all the other paths\n\nthat\
    \ start with /items/ for example /items/2\\. If the intention is to match\n\n\
    only /items firmly, the <Route/> component receives the exact prop.\n\nAdding\
    \ this confirms that only the pathname that precisely matches the\n\ncurrent location\
    \ is rendered. Let us consider the example below that uses\n\nthe exact prop.\n\
    \n<Route exact path=”/items” />\n\nWhen the path is matched, a React component\
    \ or module should be\n\nrendered so that there is a change in the UI."
