    \nGenerators will be executed in parallel. Now we only have to call on sag­\n\n\
    aMiddleware​.r​un on the root Saga in main​.j​s.\n\n// ...​\n\nimport rootSaga\
    \ from './sagas'\n\nconst sagaMiddleware = createSagaMiddleware()\n\nconst store\
    \ = ...\n\nsagaMiddleware​.r​un(rootSaga)\n\n// ...\n\nRedux Saga is a middleware\
    \ library that allows a Redux store to interact\n\nwith the resources outside\
    \ of itself asynchronously. This includes mak­\n\ning HTTP(HyperText Mat requests\
    \ to external services, accessing browser\n\nstorage, and executing I/O actions.\
    \ These actions are also known as side-\n\neffects. Redux Saga helps to manage\
    \ these side-effects in a way that is eas­\n\nier to manage.\n\nA redux store\
    \ intrinsically knows how to dispatch actions and update\n\nits state using its\
    \ root reducer. Actions constitute an event describing\n\nsomething happening\
    \ in your App and an intention to modify your app’s\n\nstate. A reducer accumulates\
    \ value from or stemming from dispatched\n\nactions and accumulates these values\
    \ into the newly updated state of your\n\napplication.\n\nReducers have been defining\
    \ in as pure functions, as it is compul­\n\nsory to let useful attributes of Redux\
    \ such as time travel (re-playing past\n\ncalls). Actions are objects or arguments\
    \ passed on into the reducer and"
