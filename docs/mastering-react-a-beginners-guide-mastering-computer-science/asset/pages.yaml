  md: "**152**    ◾    Mastering React\uFEFF\n\nother components. Generally, React\
    \ apps are made up of several compo­\n\nnents, so component challenging deals\
    \ with testing these components\n\nexclusively.\n\nFor example, consider a website\
    \ that has dissimilar web pages with\n\nseveral components. Each component will\
    \ have its own subcomponents.\n\nTesting each module without considering addition\
    \ with other components\n\nis denoted as component testing.\n\nTesting like this\
    \ in React needs more sophisticated tools. So, we would\n\nrequire Jest and sometimes\
    \ more sophisticated tools, like Enzyme, which\n\nwe will deliberate on shortly\
    \ later.\n\nSnapshot Test #\n\nA snapshot test confirms that the user interface\
    \ (UI) of a website app does\n\nnot change unexpectedly. It records the code of\
    \ a module at a certain point\n\nin time, allowing us to compare the component\
    \ in one state to any other\n\nlikely state it may generate.\n\nWe will study\
    \ snapshot testing in a future section.\n\nAdvantages and Disadvantages of Testing\
    \ #\n\nTesting is the part that is great and should be done, but it has advantages\n\
    \nand disadvantages.\n\n*Advantages #*\n\n• It avoids unexpected deterioration.\n\
    \n• It permits the developer to focus on the existing task, rather than\n\nworrying\
    \ about the past.\n\n• It permits the modular construction of an application that\
    \ would\n\notherwise be too complex to build.\n\n• It reduces the need for manual\
    \ confirmation.\n\n*Disadvantages #*\n\n• You require to write more code, as well\
    \ as fix and maintain.\n\n• Non-critical test disappointments might cause the\
    \ app to be excluded\n\nin terms of continuous incorporation."
