  md: "**106**    ◾    Mastering React\uFEFF\n\nReact Router is designed or created\
    \ to follow the ideology mentioned\n\npreviously. Thus, programmatically navigating\
    \ with the React Router\n\nshould, by definition, align with those three core\
    \ concepts or methods.\n\nReact Router provides us with the history object, which\
    \ is accessible by\n\npassing this object into each route as a prop. This history\
    \ object allows us\n\nto manually control the history of the browser. Since React\
    \ Router alters\n\nwhat we see based on the current URL, the history object gives\
    \ us fine-\n\ngrained control over when or where separate pieces of the app are\
    \ shown.\n\nWHAT IS PROGRAMMATIC NAVIGATION?\n\nProgrammatic navigation refers\
    \ to when the user is redirected as a result\n\nof an action that occurs on a\
    \ route. Login or sign-up action or form sub­\n\nmission action on a route is\
    \ a typical example of navigating program­\n\nmatically. In this chapter, we’ll\
    \ look at a variety of ways and methods for\n\nexploring React Router programmatically.\
    \ To programmatically navigate\n\nmeans to use JavaScript, i.e., program codes,\
    \ a function, or a method call.\n\nIf you just want the straight-up hyperlink,\
    \ then your best bet is <Link\n\nto=\"/some-URL\" />\n\nHOW DO YOU ROUTE PROGRAMMATICALLY\n\
    \nIN THE REACT?\n\nWith version v4 of React Router, there are three approaches\
    \ or methods\n\nthat you can take to programmatic routing within components:\n\
    \n1. Use the withRouter higher-order components.\n\n2. Use configuration and render\
    \ a <Route>.\n\n3. Use the context.\n\nUsing Redirect Component\n\nThe primary\
    \ way you programmatically navigate using the React Router\n\nv4+ is by using\
    \ the <Redirect /> component, and it is a recommended\n\nprocess that helps the\
    \ user navigate between routes.\n\nUsing the Redirect constituent is a different\
    \ strategy or method, but it\n\nis just as acceptable, and the objective is to\
    \ have it pointing at a state in the\n\nmodule and then traverse if that condition\
    \ is met.\n\nSome may argue that this solution requires more effort because it\n\
    \nrequires creating a new prop based on the component’s state and adding"
