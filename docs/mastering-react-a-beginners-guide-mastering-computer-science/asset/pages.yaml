    \ by its label attribute values\n\n• **getByPlaceholderText()**: by its placeholder\
    \ attribute value\n\n• **getByAltText()**: by its alt attribute values\n\n• **getByDisplayValue()**:\
    \ by its value attributes, usually for <input>\n\nelements\n\n• **getByTitle()**:\
