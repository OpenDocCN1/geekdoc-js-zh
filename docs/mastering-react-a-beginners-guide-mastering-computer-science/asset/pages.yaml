  md: '**105**


    C h a p t e r 6


    Programmatic


    Navigation


    IN THIS CHAPTER


    ¾ Programmatic navigation


    ¾ Lazy loading


    Programmatic navigation means when a user is redirected as the result


    of an action that occurs on a route, like a login or sign-up action. In this


    chapter, we’ll look at a variety of methodologies or strategies for exploring


    React Router programmatically.


    The React ideology consists of three core methods – the user event, state


    management, and render function – and programmatic routing can be


    said to be in line with this ideology.


    The effect of routing programmatically is on that particular page as no


    route altering or, at other times, may bring about the need to change a


    route. When there is a need, it is not going to be triggered by clicking a


    link, so we do not always have to use the Link component, and using the


    Link component in such a scenario is not optimal.


    Sometimes we want a specific action: we only want to travel to a differ­


    ent route when a certain event occurs or when a user completes an activity,


    such as submitting a form that takes you to a new page, and we call this


    type of action programmatic navigation.


    DOI:  10.1201/9781003309369-6'
