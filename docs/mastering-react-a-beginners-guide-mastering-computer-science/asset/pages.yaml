  md: "Redux\uFEFF    ◾    **197**\n\nRedux Saga also offers a collection of composite\
    \ functions that are used\n\nto spawn your works when some specific calls are\
    \ dispatched. These can\n\nbe used to help in managing when and how your tasks\
    \ are implemented.\n\nLet us take an example that the most commonly used helper\
    \ function is\n\ntakeEvery(). This instructs the middleware to spawn a new task\
    \ for every\n\naction dispatched to your store similar to a given pattern. This\
    \ provides a\n\nbehavior identical to Redux Thunk and is as simple as it gets:\
    \ “Application\n\nreminds you to fetch something, go and fetch it.”\n\nNow think\
    \ that you had two functionally independent components or\n\nmodules that needed\
    \ to retrieve the most updated data from the place.\n\nPreviously they existed\
    \ on two pages and could be visited on it at any time.\n\nIt would make sense\
    \ for both components or modules to try to retrieve a\n\nnew copy of the resource\
    \ whenever it is rendered. Now imagine that your\n\nfeatures have changed, and\
    \ now the two components need to be on the\n\nsame page, and now you have a situation\
    \ where two different components\n\nare redundantly spawning the same task.\n\n\
    You could mention one of the components to no longer try to retrieve\n\na new\
    \ copy and rely on the other to design the necessary action or calls\n\nto retrieve\
    \ this resource and populate the App store. Or you could add\n\nsome logic concept\
    \ to ensure that your component does not try to form\n\na new action to retrieve\
    \ this resource if this resource is already being\n\nloaded or mounted. But this\
    \ could also be solved using the other Redux-\n\nSaga helper function: take().\
    \ This function instructs the middleware to\n\nspawn a new task for an action\
    \ dispatched matching a given pattern but\n\nwill effectively ignore any new actions\
    \ until the spawned task has been\n\ncompleted.\n\nWith this, your two independent\
    \ components or modules can coexist\n\nwithout changing any component-specific\
    \ logic! As far as your compo­\n\nnent is concerned, it asks your saga to retrieve\
    \ resources on its behalf and\n\nretrieve them from the resultant updated states.\
    \ Your saga gets to decide\n\nhow to do it and wants to consider two different\
    \ requests from different\n\ncomponents. It is packed full of useful examples\
    \ if you’d like to get into\n\nthe low-level details.\n\nRedux Saga is one of\
    \ several tools to help you organize your App’s side-\n\neffects. It is heavy\
    \ and has a learning curve but contains a lot of function­\n\nality that will\
    \ help keep your codebase neat and modular to make the code\n\ntestable.\n\nWe\
    \ need to test our incrementAsync Saga to make sure it performs the\n\ndesired\
    \ task."
