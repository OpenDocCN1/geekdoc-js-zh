  md: "**150**    ◾    Mastering React\uFEFF\n\nTRADE-OFFS\n\nWhen selecting testing\
    \ tools, it is worth noting a few trade-offs:\n\n• **Iteration speed vs. realistic\
    \ environment:** Some tools offer a very\n\nquick response loop between making\
    \ a modification and seeing the\n\nresult but do not model the browser behavior\
    \ precisely. Other tools\n\nmight use an actual browser environment, but reduce\
    \ the iteration\n\nspeed and are flakier on a continuous combination server.\n\
    \n• **How much to mock:** With components, the difference between\n\na “unit”\
    \ and an “integration” test can be blurry. If you’re testing a\n\nform, would\
    \ it experiment and also test the buttons inside of it? Or\n\nshould a button\
    \ component have its own test suite? Should refactor­\n\ning a button ever break\
    \ the form test?\n\nDifferent responses may work for different teams and products.\n\
    \nRecommended Tools\n\nJest is a JavaScript assessment runner that allows you\
    \ to access the DOM\n\nvia jsdom. While jsdom is only an estimate of how the browser\
    \ works, it\n\nis frequently good and sufficient for testing the React components.\
    \ Jest\n\nhas a fast repetition rate mixed with sophisticated features like mocking\n\
    \nmodules and timers to give you more control over how the code executes.\n\n\
    React Testing Library is a set of helpers that allows you to test React\n\ncomponents\
    \ without relying on their execution details. This method\n\nmakes refactoring\
    \ a breeze and also pushes you toward the best perfor­\n\nmance for availability.\
    \ Even though it doesn’t provide a way to “shallowly”\n\nrender a module without\
    \ its children, a test runner like Jest allows you to\n\ndo this by *mocking*.\n\
    \nIn this chapter, I’m going to introduce you to a React testing tool named\n\n\
    Jest, along with the popular public library Enzyme, which is considered to\n\n\
    test React components. I’ll announce to you Jest testing methods, includ­\n\n\
    ing running tests, testing React components, snapshot testing, and mock­\n\ning.\
    \ If you are new to testing and inquisitive about how to get going, you\n\nwill\
    \ find this chapter helpful because we will start with an outline for test­\n\n\
    ing. By the end, you will be up and running, testing React apps using Jest\n\n\
    and Enzyme. You should be acquainted with React in order to follow this\n\nchapter."
