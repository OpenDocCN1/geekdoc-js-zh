    \ triggers a user interface variation and updates\n\nthe URL in the address bar.\n\
    \nLikewise, clicking on the Class link triggers a user interface that modi­\n\n\
    fies and updates the URL into the address bar.\n\nNESTED ROUTING\n\nNow that you\
    \ understand the <Route/> component and route function,\n\nwe can move on to layered\
    \ routing in a React project.\n\nA match object is formed when the router’s route\
    \ and position are effec­\n\ntively matched. This object contains info about the\
    \ URL and the route.\n\nThis info can be retrieved as properties on the matching\
    \ entity.\n\nLet’s look at the properties:\n\n• **=****>** **URL** : The string\
    \ that returns the matched portion of the URL\n\n• **=****>** **path** : The string\
    \ that returns the route’s route\n\n• **=****>** **isExact** : The boolean that\
    \ returns true (1) if the match was exact\n\n• **=****>** **params** : The object\
    \ comprising key-value couples that were\n\ncoordinated by the Path-To-RegExp\
    \ package."
