  md: "React Routers\uFEFF    ◾    **89**\n\nDepending on the scenario, it is not\
    \ always required to install the core\n\n­react-router library by itself, but\
    \ rather to choose between react-router-dom\n\nand react-router-native. All of\
    \ the functionality of the core react-router\n\nlibraries is imported by both\
    \ react-router-dom and react-router-native.\n\nThe choice of this book is in the\
    \ realm of web apps, so we can carefully\n\nselect react-router-dom. This library\
    \ is installed in the project by running\n\nthe command below in the project directory\
    \ or file:\n\nnpm install --save react-router-dom\n\nRouters\n\nThe react-router\
    \ package includes the number of routers that we can benefit\n\nfrom depending\
    \ on the platform we aim for. These include BrowserRouter,\n\nHashRouter, and\
    \ MemoryRouter.\n\nFor the browser-based apps we are building or designing, the\n\
    \nBrowserRouter and HashRouter are a good fit.\n\nThe BrowserRouter is used for\
    \ apps with a dynamic server that under­\n\nstands how to handle various sorts\
    \ of URLs, whereas the HashRouter is\n\nused for static websites with a server\
    \ that only replies to requests for files\n\nit knows about.\n\nMoving further,\
    \ we shall use the BrowserRouter with the postulation\n\nthat the server running\
    \ our app is dynamic and worth noting in that any\n\nrouter expects to receive\
    \ only a child. Take the below example:\n\nReactDOM​.rend​er(\n\n<BrowserRouter>\n\
    \n<App/>\n\n</BrowserRouter>,\n\ndocument.getElementById(‘root’));\n\nIn this\
    \ example, the <App/> module is the child to the <BrowserRouter>\n\nand should\
    \ be the only child. Now, the routing can happen from any­\n\nwhere within the\
    \ <App/> module, though it is considered good practice\n\nto group and place all\
    \ the paths in the same place.\n\nHistory\n\nEach router creates the history object\
    \ to keep track of the current location\n\nand re-renders the app whenever this\
    \ location varies. For this reason, the\n\nother React Routers component relies\
    \ on this history object being extant;\n\nthis is why they are required to be\
    \ rendered inside a router."
