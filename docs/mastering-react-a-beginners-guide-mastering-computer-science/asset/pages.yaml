  md: "Testing Your Code\uFEFF    ◾    **165**\n\nmake them much human-readable. Once\
    \ finished, this provides us with a\n\nnockDone function, to be called after our\
    \ expectations are done.\n\nAfter calling the getRandomUser(), we can now match\
    \ its result with\n\nour expectation. For simplifying to demonstrate, we just\
    \ assert that it will\n\ncontain results, which itself contains an Object.\n\n\
    Later we set the mode to wild, as in this case we require to ensure the\n\nother\
    \ tests do not use the fixture.\n\nThe fixtures themselves can be seen in a directory\
    \ specified in the nock​\n\n.​js helper, and are themselves interesting to look\
    \ at.\n\nFinal Thoughts\n\nNock provides strong tools for increasing the dependability\
    \ of tests that\n\nuse external services and enabling higher test coverage since\
    \ tests that\n\nwere previously deemed too flaky to implement may be evaluated.\n\
    \nAs with mocks, it is the developer’s obligation or duty to ensure that\n\nmocking\
    \ does not go too far, and that the test may still fail due to a change\n\nin\
    \ functionality, or it is useless.\n\nReact Testing Library is the testing utility\
    \ tool that is built to test the\n\nactual DOM hierarchy rendered by React on\
    \ the browser. The goal of the\n\nlibrary is to let you write tests that resemble\
    \ how a user would use your\n\napp. This can provide you with more confidence\
    \ that your app works as\n\nintended when a real user does use it.\n\nThe library\
    \ allows this by providing utility methods or techniques that\n\nwill query the\
    \ DOM in the same way the user would. For example, if a\n\nuser finds a button\
    \ to “Save” their work based on its content, the library\n\nprovides the getByText()\
    \ method or ideas. Later you'll learn more about\n\nthe library’s testing techniques.\n\
    \nBut first, let us see an example of the React Testing Library in action.\n\n\
    How to Use React Testing Library\n\nA Create React Project (or CRA)-created or\
    \ designed React app already\n\ncontains both the React Testing Library and Jest\
    \ by default, so all you have\n\nto do is write your test code.\n\nIf you need\
    \ to utilize the React Testing Library outside of a CRA proj­\n\nect, you must\
    \ manually install both the React Testing Library and Jest\n\nusing NPM:\n\nnpm\
    \ install --save-dev @testing-library/react jest"
