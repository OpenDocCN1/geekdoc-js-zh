    Sta​tus(f​riend​ID,\n\nhandleStatusChange);\n\n};\n\n});\n\nreturn isOnline;\n\
    \n}\n\nOur useFriendStatus hook is to update us on a friend’s status. It takes\n\
    \nFriendID as an argument and returns the value as online or offline.\n\nREACT​.​JS\
    \ RENDER PROPS\n\nThe Render Props is a technique/method in ReactJS for distributing\n\
    \ncodes between React components using a prop whose value is a func­\n\ntion/method.\
    \ Child function takes render props as a function and calls it\n\ninstead of executing\
    \ its own render logic. To summarize, if we give a func­\n\ntion from the parent\
    \ component to the child component as a render prop,\n\nthe child component calls\
    \ that function instead of creating its own logic.\n\nCreating a React App and\
    \ Downloading a Module\n\n**Step 1:** Use the following command to create a React\
    \ application:\n\nfoldername\n\nnpx create-react-app\n\n**Step 2:** After creating\
    \ project folder, i.e., foldername, use the following\n\ncommand to move to it:\n\
    \ncd foldername\n\nThe term “render prop” refers to a method for sharing codes\
    \ between React\n\ncomponents/module using the prop whose value is a function.\n\
    \nInstead of creating its own render logic, a component with a render\n\nprop\
    \ accepts a function that yields a React element and calls it."
