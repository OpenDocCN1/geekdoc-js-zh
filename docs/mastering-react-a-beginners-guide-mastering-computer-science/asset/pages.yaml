  md: "**64**    ◾    Mastering React\uFEFF\n\nIf props​.col​or is not provided, it\
    \ has been set “blue” by default:\n\nrender() {\n\nreturn <CustomButton /> ; //\
    \ \aprops​.col​or will be\n\nset it to blue\n\n}\n\nIf props​.col​or is set to\
    \ null that will remain set to null:\n\ndisplayName\n\nrender() {\n\nreturn <CustomButton\
    \ color=\a{null} /> ; // props​.col​\n\nor will remain null\n\n}\n\nThe displayName\
    \ string is used for debugging messages. Typically, you\n\ndo not require to set\
    \ it explicitly since it is inferred from the name of the\n\nfunctions or classes\
    \ that describe the components. You might want to set it\n\nevidently if we want\
    \ to display a different name for the debugging tenaci­\n\nties or when we form\
    \ a higher-order component; see Wrap the Display\n\nName for Easily Debugging\
    \ for details.\n\nINSTANCE PROPERTIES\n\nProps\n\nthis​.pro​ps holds the props\
    \ that were clear by the caller of this component.\n\nSee components and props\
    \ for an overview of props.\n\nIn particular, this​.props​.child​ren is an exclusive\
    \ prop, typically clear by\n\nthe child tags in the JSX appearance rather than\
    \ in the tag itself.\n\nState\n\nThe state encompasses data specific to this component\
    \ that may alter over\n\ntime and the state is user-defined, and it should be\
    \ the plain JavaScript\n\nobject.\n\nIf some value is not used for rendering or\
    \ data flow (for example, a timer\n\nID), you do not have to put it in a state,\
    \ and such values can be defined as\n\nfields on the component illustration.\n\
    \nDo not mutate this​.sta​te directly, as calling setState() afterward may\n\n\
    replace the change you made and treat this​.sta​te as if it were immutable."
