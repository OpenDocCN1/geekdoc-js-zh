  md: "**238**    ◾    Mastering React\uFEFF\n\nIn the Google chrome browser software\
    \ => Go to the Settings => In\n\n“Privacy and security” Section => Site Settings\
    \ => JavaScript => Block\n\nthe JavaScript.\n\nIn Firefox, type “about:config”\
    \ in browser’s address bar => Click on\n\n“Accept the risk and continue” => Type\
    \ “JavaScript” in the “Search” box\n\n=> Double-click the “JavaScript.enabled”\
    \ line to toggle the setting in\n\nbetween “true” and “false” as desired or need.\n\
    \nAfter disabling or putting off the JavaScript in browser software, if we\n\n\
    give the request to the servlet components without entering input, we will\n\n\
    get an HTTP status code of 500 error.\n\nWhen JavaScript is blocked, we should\
    \ notify the end user with a mes­\n\nsage saying “JavaScript is blocked in your\
    \ web browser.” For this purpose,\n\nthe <noscript> tag should be used.\n\nUsing\
    \ the <noscript> tag, we need to pass a guiding message or output\n\nto the end\
    \ user through browser settings if it is disabled or turned off.\n\nPlace <noscript>\
    \ tag into the body part of the HTML file. Example of\n\n<noscript> tag:\n\n<noscript>\n\
    \n<span style=\"color:red\">JavaScript has blocked,\n\nEnable the JavaScript</span>\n\
    \n</noscript>\n\nThe HTML files after placing the <noscript> tag:\n\n<head>\n\n\
    <script type=\"text/javascript\" src=js/validation​.​js>\n\n</script>\n\n</head>\n\
    \n<body>\n\n<noscript>\n\n<span style=\"color: red\">JavaScript \ahas blocked,\n\
    \nEnable the\n\nJavaScript</span>\n\n</noscript>\n\n<div style='text-align: center'>\n\
    \n<h1 style='color: blue'>Election \aCommission of\n\nIndia</h1>\n\n<form action=\"\
    checkvoter\" method=\"post\"\n\nonsubmit=\"return validate(this)\">"
