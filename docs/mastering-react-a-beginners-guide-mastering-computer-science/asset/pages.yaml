    \ some value */);\n\nMyContext.displayName = 'MyDisplayName';\n\n<MyContext.Provider>\
    \ // \"\aMyDisplayName.Provider\" in\n\nDevTools\n\n<MyContext.Consumer> // \"\
    \aMyDisplayName.Consumer\" in\n\nDevTools\n\nINTRODUCTION TO HOOKS\n\nHooks are\
    \ introduced in the version of React 16.8(a JavaScript library for\n\nuser interface).\
    \ Hooks are generally used as it allows you to use state and\n\nother React features\
