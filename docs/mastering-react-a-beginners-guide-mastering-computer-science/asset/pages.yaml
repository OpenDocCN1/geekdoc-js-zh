    \ update of both the URL and the\n\nuser interface.\n\nProtected Routes\n\nThe\
    \ rationale for having the protected route or paths is that when any user\n\n\
    tries to access part of the app without logging in, they are redirected to the\n\
    \nlogin page to sign in to the app.\n\nFor this re-direct to work as intended,\
    \ the react-router package pro­\n\nvides the <Redirect/> component to serve this\
    \ purpose, and this compo­\n\nnent has to prop which is passed to it in the form\
    \ of an object comprising\n\nthe path-name and state as shown below:\n\n<Redirect\n\
    \nto={{pathname: ‘/login’, state: {from:props.location}}}\n\n/>\n\nHere, the Redirect\
    \ component or module replaces the present location\n\nin the stack with the path\
    \ name provided in the object (/login) and then\n\nsaves the location that the\
    \ user was attempting to visit, in the state’s prop­\n\nerty. The values in the\
    \ state can be retrieved from within the Login com­\n\nponents using this​.props​.location​.st​ate.\n\
    \nFor example, if the user attempts to navigate to /admin, a protected\n\nroute,\
    \ without log in first, they will be redirected to the login page.\n\nFollowing\
    \ the successful sign-in, they will be redirected to /admin, the\n\nroute they\
    \ intended to visit in the first place.\n\nCustom Routes\n\nIn order to attain\
