  md: "**126**    ◾    Mastering React\uFEFF\n\nmanagement. Context API is a (type\
    \ of) new attribute added in React ver­\n\nsion 16.3 that let you distribute states\
    \ through the entire app (or any part\n\nof it) lightly and easily.\n\nReact Context\
    \ API: How Does It Work?\n\nReact.createContext() is the syntax that you required.\
    \ It returns a con­\n\nsumer and a provider. The provider works as a module that,\
    \ as its name\n\nsuggests, provides the states to its children through the entire\
    \ app and will\n\nhold the “store” and be the parent of all the modules that might\
    \ require\n\nthat store. The component that consumes and uses the state is termed\n\
    \nConsumers.\n\nContext API Will Replace Redux?\n\nNo. Well, it’s not complete.\
    \ The concept of Redux is efficient and came per­\n\nfectly to answer the requirements\
    \ for the management of the state. Actually,\n\nit answered the need for this\
    \ concept so clearly that it came to be known that\n\nyou can’t be a real React\
    \ developer/tester if you don’t know your way around\n\nthe Redux. However, Redux\
    \ has its demerits, and due to this, it’s important\n\nto know about the Context\
    \ API gives us which Redux doesn’t:\n\n• **Simplicity**: While using redux people\
    \ tend to manage almost all of\n\ntheir states in redux and there arise two situations:\n\
    \n1. **Overhead**: What is the need to create/update 3 files, just to add\n\n\
    one small feature?\n\n2. **Data Binding**: One of the significant merits of React’s\
    \ one-way\n\ndata binding is that it’s easy to understand and manage – a com­\n\
    \nponent passes state to its child component. Using Redux takes it\n\naway from\
    \ us.\n\n• With the use of Context API, we can define several unrelated con­\n\
    \ntexts (stores) and use each in its appropriate place in the app.\n\nHow to Use\
    \ Context API?\n\n“I’ve been convinced, and now I want to incorporate Context\
    \ API in my\n\napplication,” you may be thinking. First, make sure you need it.\
    \ It has\n\nbeen found that most people use shared/distributed states across nested\n\
    \nmodules instead of passing them as props. And if you do need it, you must\n\n\
    follow the following few steps:"
