    \ it is not a good approach or procedure.\n\nForm Validation Logic in Client and\
    \ Server Side but Validate at\n\nthe Server Side Only if Client-Side Authentication\
    \ Not Done\n\nWrite client-side and server-side form validations but enable server-side\n\
    \nform validations only when client-side form validations are not done. This\n\
    \nclient(browser) sends the flag to the server representing whether client-\n\n\
    side form validations are done or not.\n\nFor this purpose, we should use hidden\
    \ boxes in the HTML form.\n\nUsing hidden box support, the form page can send\
    \ a signal to the server or\n\nservlet constituent along with the request whether\
    \ client-side JS JavaScript"
