  md: "**200**    ◾    Mastering React\uFEFF\n\nput({type: 'INCREMENT'}) // => { \a\
    PUT: {type:\n\n'INCREMENT'} }\n\ncall(delay, 1000) // => { CALL: {fn: \adelays,\
    \ args:\n\n[1000]}}\n\nWhat happens is that the middleware checks the type of\
    \ each yielded\n\nEffect, then decides how to attain that Effect. It will convey\
    \ an action to\n\nthe Store if the Effect type is a PUT. It will call the given\
    \ function if the\n\nEffect is a CALL.\n\nThis separation between Effect formation\
    \ and Effect execution makes it\n\npossible to test our Generator in a surprisingly\
    \ easy way:\n\nimport test from 'tape'\n\nimport { put, call } from 'redux-saga/effects'\n\
    \nimport { incrementAsync, delay } from './sagas'\n\ntest('incrementAsync Saga\
    \ test', (assert) => {\n\nconst gen = incrementAsync()\n\nassert.deepEqual(\n\n\
    gen​.ne​xt().value,\n\ncall(delay, 1000),\n\n'incrementAsync Saga must call delay(1000)'\n\
    \n)\n\nassert.deepEqual(\n\ngen​.ne​xt().value,\n\nput({type: 'INCREMENT'}),\n\
    \n'incrementAsync Saga must dispatch an INCREMENT action'\n\n)\n\nassert.deepEqual(\n\
    \ngen​.ne​xt(),\n\n{ done: true, value: undefined },\n\n'incrementAsync Saga must\
    \ be done'\n\n)\n\nassert​.e​nd()\n\n})"
