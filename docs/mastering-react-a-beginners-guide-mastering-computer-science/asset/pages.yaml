    \ loading is not a new concept. It has been available for some time.\n\nIn essence,\
    \ lazy loading means that a constituent or a part of codes must\n\nget loaded\
    \ when it is essential. It is also referred to as codes excruciating\n\nand data\
    \ fetching. When we construct an application, the resultant bundle\n\nis frequently\
    \ rather enormous as our project expands in size. This will\n\nimpair the loading\
    \ time of our program for those with low bandwidth\n\nconnections, such as mobile\
    \ users. For that reason, it’s a good idea only to\n\nload as much of your app\
    \ as you need.\n\nWhat do we mean by that? Imagine your app consists of many routes\n\
    \nand some routes you are likely to visit often and some not so much.\n\nIf you\
