  md: "**136**    ◾    Mastering React\uFEFF\n\nHere, useState is a Hook. In a function\
    \ called Exmp1, we declare a new\n\nstate variable which we called “count.” It\
    \ is called inside a function compo­\n\nnent/module to provide some local/initial\
    \ state to it. In the above example,\n\nit is 0 because the counter is set to\
    \ zero, so at every click on the button, the\n\ncounter increases the value by\
    \ 1\\. You can call this function Exmp1 from\n\nan event handler or somewhere\
    \ else.\n\n*Declaring Multiple State Variables*\n\nfunction ExampleWithStates()\
    \ {\n\n// Declare multiple state variables!\n\nconst [age, set_Age] = useState(42);\n\
    \nconst [fruit, set_Fruit] = useState('banana');\n\nconst [\atodos, set_Todos]\
    \ = useState([{ text: 'Learn\n\nHooks and React' }]);\n\n// ...\n\n}\n\nEffect\
    \ Hook\n\nIt is also a type of built-in Hook (useEffect), it tells the React that\
    \ your\n\ncomponent needs to do something after render and also adds the ability\n\
    \nto perform side effects from a function component whenever there are\n\nsubsequent\
    \ renders. Effects are declared inside (the function or main)\n\ncomponent to\
    \ have access to its props and state. It did the same as every\n\nsubsequent render\
    \ –\n\n  componentDidMount,\n\n componentDidUpdate,\n\n componentWillUnmount\n\
    \nExample:\n\nimport React, { useState, useEffect } from 'react';\n\nfunction\
    \ Friend_Status(props) {\n\nconst [isOnline, set_Is_Online] = useState(null);\n\
    \nfunction handleStatusChange(status) {\n\nsetIsOnline(status._is_Online);\n\n\
    }"
