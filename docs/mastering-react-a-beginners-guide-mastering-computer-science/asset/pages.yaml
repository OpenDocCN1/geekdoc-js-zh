  md: "**172**    ◾    Mastering React\uFEFF\n\nMost websites, today, are built using\
    \ MVC (Model View Controller)\n\narchitecture. In the MVC architecture, React\
    \ is the “V,” which stands for\n\nview, whereas the architecture is provided by\
    \ the Flux or Redux.\n\nReactJS application is made up of multiple or more than\
    \ one compo­\n\nnent, where each component is responsible for outputting a small\
    \ and\n\nreusable piece of HTML code.\n\nThese components are the heart of all\
    \ React applications. All these\n\ncomponents can be mixed with several other\
    \ components to allow com­\n\nplex applications to be built of very simple building\
    \ blocks. To populate\n\ndata in the HTML DOM, ReactJS uses a virtual DOM-based\
    \ technique.\n\nThe virtual DOM is quick because it simply modifies individual\
    \ DOM\n\nitems rather than refreshing the entire DOM every time.\n\nTo create\
    \ a React app, we write React components that correspond to\n\nor match various\
    \ elements. These components are organized into higher-\n\nlevel components that\
    \ comprise the application structure. Consider a\n\nform with features such as\
    \ input fields, labels, or buttons. Each form ele­\n\nment may be written as a\
    \ React component, and then combined into a\n\nhigher-level component, i.e., the\
    \ form component itself. The form com­\n\nponents would define the form’s structure\
    \ as well as the items contained\n\ninside it.\n\nThe process of passing the data\
    \ all the way down and back up the tree\n\nintroduces complexity that the libraries\
    \ like Redux are designed to reduce.\n\nInstead of passing the data up the tree\
    \ through a two-way function bind­\n\ning, we can dispatch actions directly from\
    \ the child components to update\n\nthe application state.\n\nIn this chapter,\
    \ we will be looking forward to various different ways to\n\nincorporate the Redux\
    \ store.\n\nAt first, we will see how the store can be used without the help of\
    \ any\n\nadditional framework. After this, we are going to explore react-redux,\n\
    \na framework that will be used to integrate a Redux store with the React\n\n\
    component.\n\nEXPLICITLY PASSING THE STORE\n\nThe first, and the most logical\
    \ and important, way to include the store into\n\nyour UI is to pass it down the\
    \ component tree explicitly as the property.\n\nThis strategy is straightforward\
    \ and effective for tiny apps with only a few\n\nnested components.\n\nLet's have\
    \ a look at how can we incorporate the store into the color\n\norganizer. Inside\
    \ the ./"
