    open-source, front-end library responsible for the view layer of the appli­


    cation. It was created by a software engineer at Facebook, Jordan Walke. It


    was developed and maintained by Facebook and was then later used in its


    products like Instagram and WhatsApp. Facebook developed ReactJS in


    2011 in its newsfeed section, but it was later released to the public or every


