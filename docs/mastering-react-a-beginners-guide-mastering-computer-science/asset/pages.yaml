  md: '**125**


    C h a p t e r 7


    Advanced Tools


    IN THIS CHAPTER


    ¾ Advanced tools


    ¾ Context API


    ¾ Hooks


    ¾ Render props


    CONTEXT API


    Context makes available a way to pass data through the component hier­


    archy without having to pass props down manually at each and every level.


    Data is passed from top-down (i.e., parent to child) via props in this typi­


    cal React application, but such usage might be problematic for particular


    sorts of props (e.g., locale choice, user interface themes) that are required


    by multiple components within an application. Context allows you to


    communicate data like this across components without having to send a


    prop through every level of the tree directly.


    What Is React’s Context API (Application Programming Interface)?


    The React Context API (Application Programming Interface) is a way


    for a React app to functionally define global(extern) variables that can


    be passed through. This is another way to “prop drilling” from different


    generations: grandparent to child to parent, and so on. With the use of


    Redux, Context is also approved as an easier, lighter approach for state


    DOI:  10.1201/9781003309369-7'
