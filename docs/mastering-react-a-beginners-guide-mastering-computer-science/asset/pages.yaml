    \ event is treated first, followed by the outer­\n\nmost: the p> element’s click\
    \ event is handled first, followed by the div>\n\nelement’s click event.\n\nThe\
    \ innermost element’s event is treated first, followed by the outer­\n\nmost:\
    \ the p> element’s click event is handled first, followed by the div>\n\nelement’s\
    \ click event.\n\nThe outermost element’s event is treated first, followed by\
    \ the inner­\n\nmost: the div> element’s click event is handled first, followed\
    \ by the p>\n\nelement’s click event.\n\nWith the addEventListener() method you\
    \ can stipulate the propagation\n\ntype by using the “useCapture” parameter:\n\
    \naddEventListener(event, function, useCapture);The default value is\n\nfalse\
    \ or 0, which will use the bubbling propagation, when the value is set\n\nto true\
    \ or 1, the event uses the capturing propagation.\n\nExample:\n\ndocum​ent.g​etEle​mentB​yId(\"\
    ​myP\")​.addE​ventL​isten​er(\"c​\n\nlick\"​, myFunction, true)​;docu​ment.​getEl​ement​ById(​\"\
