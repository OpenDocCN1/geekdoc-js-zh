  md: "**66**    ◾    Mastering React\uFEFF\n\nELEMENT VARIABLES\n\nYou can use variables\
    \ to store elements. This can help you tentatively ren­\n\nder a part of the component\
    \ while the rest of the output does not change.\n\nConsider there are the two\
    \ new components representing Logout and\n\nLogin buttons:\n\nfunction LoginButton(props)\
    \ {\n\nreturn (\n\n<button onClick={props.onClick}>\n\nLogin\n\n</button>\n\n\
    );\n\n}\n\nfunction LogoutButton(props) {\n\nreturn (\n\n<button onClick={props.onClick}>\n\
    \nLogout\n\n</button>\n\n);\n\n}\n\nIn the below example, we will form a stateful\
    \ constituent called\n\nLoginControl.\n\nIt will render either <LoginButton />\
