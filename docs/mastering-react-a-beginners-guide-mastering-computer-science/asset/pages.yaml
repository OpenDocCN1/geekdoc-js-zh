    \ the first argument and action as the sec­\n\nond argument. Reducers do not cause\
    \ side-effects and should treat their\n\narguments as immutable data. In Redux,\
    \ modularity is achieved through\n\nreducers. Eventually, reducers are combined\
    \ into a single reducer, a func­\n\ntion that can update the entire state tree.\n\
    \nIn this section, we saw how reducers can be composed. We saw how the\n\ncolors\
    \ reducer uses the color reducer to assist in color management. In the\n\nnext\
    \ section, we will look at how the colors reducer can be combined with\n\nthe\
    \ sort reducer to update the state.\n\nTHE STORE\n\nIn Redux, the store is what\
    \ holds the application’s state data and handles\n\nall state updates. While the\
    \ Flux design pattern allows for many stores\n\nthat each focus on a the specific\
    \ set of data, Redux only has one store. The\n\nstore handles state updates bypassing\
    \ the current state and action through\n\na single reducer. We will create this\
    \ single reducer by combining and com­\n\nposing all of our reducers.\n\nIf we\
