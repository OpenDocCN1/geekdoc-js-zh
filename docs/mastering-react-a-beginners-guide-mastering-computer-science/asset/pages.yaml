  md: "**176**    ◾    Mastering React\uFEFF\n\nIn the following sections, we will\
    \ look at other ways to get the store to\n\nthe components that need it. They\
    \ have evolved as one of the winners in\n\nthe field of Flux or Flux-like libraries.\
    \ Redux is entirely based on Flux, and\n\nit was designed or created to tackle\
    \ the challenge of understanding how\n\ndata changes flow through the application.\
    \ Redux was created by Andrew\n\nClark and Dan abramov.\n\nWhen Andrew Clark began\
    \ aiding Dan with the job of finishing Redux,\n\nhe was working on version 4 of\
    \ Flummox, a Flux-based framework. The\n\nmessage on the npm page for the Flummox\
    \ reads as given below:\n\nVersion 4.x should be the last and major release, but\
    \ that never took\n\nplace. If you want to use the recent features, then use Redux.\
    \ It’s very good.\n\nRedux is surprisingly very small, with only 99 lines of code.\n\
    \nWe have mentioned earlier that Redux is Flux-like, but it is not com­\n\npletely\
    \ Flux. It has actions creators, action, action objects, and a store that\n\n\
    are used to change the state. Redux clarifies the concepts of Flux a bit\n\nby\
    \ eventually removing the minion, and representing App state with a\n\nsingle\
    \ immutable object/module. Redux also introduces reducers, which\n\nare not part\
    \ of the Flux pattern. Reducers are real functions that return\n\nupdated states\
    \ based on the current state and an action: (state, action) =>\n\nnewState.\n\n\
    State\n\nThe idea of saving the state in one place is not so crazy. In fact, we\
    \ did it in\n\nthe previous chapter.\n\nWe stored it in the kernel of our app.\
    \ In pure React or Flux apps, stor­\n\ning states in as few objects as possible\
    \ is recommended. In Redux, it’s rule\n\nno 2.\n\nWhen you came to know that you\
    \ have to store state in one place, it\n\nmight seem like an unnecessary requirement,\
    \ especially when you have\n\ndifferent types of data. Let’s consider how this\
    \ can be achieved with an\n\nApp that has many different types of data.\n\nWe’ll\
    \ look at a social media App that has state spread out across differ­\n\nent modules.\n\
    \nThe application itself contains user state. All of the messages are saved\n\n\
    in state under that. Each message contains its own state, and all of the\n\nposts\
    \ are saved under the posts component.\n\nAn application structured like this\
    \ may work well, but as it grows it\n\nmay be hard to determine the overall state\
    \ of the App. It may also become\n\ncumbersome to understand where updates have\
    \ been coming from,"
  merge: -1
