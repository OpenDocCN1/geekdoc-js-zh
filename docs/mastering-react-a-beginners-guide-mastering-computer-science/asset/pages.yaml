  md: "Forms\uFEFF    ◾    **205**\n\nalert(\"Your account has been formed successfully...\
    \ \");\n\n}\n\n}\n\n</script>\n\n</body>\n\n</html>\n\nEVENT BUBBLING AND CAPTURING\
    \ IN JAVASCRIPT\n\nIn JavaScript, dissemination of measures is done, which is\
    \ known as\n\n“Event Flow.” The arrangement or sequence in which the event is\
    \ received\n\nby the specific web page is referred to as event flow. Thus, in\
    \ JS, the event\n\nflow process is dependent on three factors:\n\n1. Event capturing\n\
    \n2. Event target\n\n3. Event bubbling\n\nThe notion of event bubbling is utilized\
    \ while constructing a web page or\n\na website using JS, where event managers\
    \ are summoned when one ele­\n\nment is nested into the other element and is part\
    \ of the same occurrence.\n\nThis approach or procedure is called as event bubbling,\
    \ and it is utilized\n\nwhile executing event flow for a web page. We can understand\
    \ event bub­\n\nbling as a classification of calling the event handlers when one\
    \ element\n\nis nested into the other element, and both the elements have registered\n\
    \nlisteners for the same event. So, commencement from the deepest com­\n\nponent\
    \ to its parents covering all its ancestors on the way to top to lowest,\n\ncall\
    \ is performed.\n\nExample of Event Bubbling\n\nLet us look at the example to\
    \ appreciate the working concept of event\n\nbubbling:\n\n<!DOCTYPE html>\n\n\
    <html>\n\n<head>\n\n<meta charset=\"utf-8\">\n\n<meta name=\"viewport\" content=\"\
    width=device-width\">\n\n<title>Event Bubbling</title>"
  merge: -1
  pgno: 225
