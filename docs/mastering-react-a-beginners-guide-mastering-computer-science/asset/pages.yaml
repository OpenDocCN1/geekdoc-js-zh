  md: "**166**    ◾    Mastering React\uFEFF\n\nInstalling React Testing Library and\
    \ Jest\n\nYou need to install Jest because the React Testing Library only provides\n\
    \nmethods or techniques to help you to write the test scripts. So you still\n\n\
    require a JavaScript test framework to execute the test codes.\n\nOther test frameworks,\
    \ such as Mocha or Jasmine, can be used, but I’ll\n\npick Jest because it performs\
    \ well with both React and Testing Libraries.\n\nIn this section, I will create\
    \ a new React application with CRA using the\n\ndefault template:\n\nnpx create-react-app\
    \ react-test-example\n\nCreate a New React App with CRA\n\nOnce the app is created\
    \ or designed, you should have an App​.test​.js file\n\nalready generated or created\
