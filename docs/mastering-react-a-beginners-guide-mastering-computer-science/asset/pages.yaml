    \ routes.\n\nCustom routes are an extravagant way of saying nesting a route inside\n\
    \nthe component, and this is typically done when there is a need to choose\n\n\
    whether the components should render or not.\n\nIn the case of the protected route,\
    \ a given route should only be retrieved\n\nwhen a user is logged in; else, the\
    \ user should be directed to the login page.\n\nLet us explore custom routes more\
