    \ what ways has it improved com­\n\npared to JS?\n\nThat’s precisely what I will\
    \ clarify for you in this chapter. I’m going to\n\nshow you what JSX is, what\
    \ it’s used for, how to use looping in JSX, and the\n\ndifference between JSX\
    \ and HTML.\n\nWHAT IS JSX?\n\nThe full form of JSX is “JavaScript XML,” and it\
    \ is a syntax extension to\n\nJavaScript based in “ES6,” the latest “version”\
    \ of JavaScript. JSX lets us\n\nwrite HTML in React by transposing HTML into React\
    \ components,\n\nwhich will help you to create UI more easily for your web applications.\n\
    \nWhen somebody is working on React code, they may find some suspi­\n\ncious HTML-type*\
    \ code embedded in the JavaScript. What is this suspi­\n\ncious HTML-type* code,\
    \ and how does it work within React functions?\n\nThese short snippets of strange\
    \ HTML-like* code are not HTML (hyper­\n\ntext markup language), but rather “JavaScript\
    \ XML,” a syntactic extension\n\nof JavaScript based on ES6\\. JSX, or JavaScript\
    \ XML, is a form of markup\n\nthat allows you to write HTML in React library by\
    \ converting HTML tags\n\ninto React elements (components).\n\nUtilizing JSX lets\
    \ you write HTML elements in JavaScript, which are\n\nthen rendered to the DOM\
    \ (Document Object Model). JSX (JavaScript\n\nXML) is a React-precise XML/HTML-type\
    \ syntax that encompasses\n\nECMAScript to consent XML/HTML-type content to coincide\
    \ together\n\nwith JavaScript/React code. The composition is considered to be\
    \ used\n\nby preprocessors (transpilers like Babel) to convert HTML-type content\n\
    \nconfined in JavaScript documents into typical JavaScript modules that a\n\n\
    JavaScript engine can recognize.\n\nUsing JSX, you may write brief HTML/XML-like\
    \ edifices (e.g., DOM-\n\nlike hierarchy blocks) in identical files as JavaScript\
    \ code, and Babel will\n\ntranslate these expressions into genuine JavaScript\
    \ code. As a replacement\n\nfor putting JavaScript into HTML as mentioned earlier,\
    \ JSX lets us put\n\nHTML into JavaScript.\n\nJSX was formed as a research project\
    \ at DeNA Co., Ltd., one of the\n\nworld’s major social game providers. Kazuho\
    \ Oku and Goro Fuji are the\n\nmain developers (aka GFX)."
