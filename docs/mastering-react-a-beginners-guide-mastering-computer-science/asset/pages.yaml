  md: "Testing Your Code\uFEFF    ◾    **163**\n\nFinally, we test 500 responses.\
    \ For this we formed an additional function\n\nthat returns a default value if\
    \ the API call does not return any response.\n\nWe will use Nock to intercept\
    \ the request and mock 500 responses, and\n\nthen test what function returns.\n\
    \nit('should return the default user on 500', () => {\n\nnock(/randomuser/)\n\n\
    .get(/api/)\n\n.reply(500);\n\nreturn query\n\n.getRandomUserGuarded()\n\n.then(res\
    \ => expect(res).\n\ntoMatchObject(defaultUser));\n\n});\n\nBeing able to mock\
    \ the non-200 response codes, delaying the connec­\n\ntion, and socket timeouts\
    \ is differentially useful.\n\nUsing 'nock​.ba​ck'\n\nnock​.ba​ck is much used\
    \ not just to intercept the HTTP request, but also\n\nto save a real response\
    \ for future use, and this saved response is termed a\n\n“fixture.”\n\nIn the\
    \ record mode, if the named fixture is present, it will use live calls,\n\nand\
    \ if it is not present, then a fixture will be created for further calls.\n\n\
    In this example project, only one HTTP call is being prepared per test,\n\nbut\
    \ nock​.ba​ck fixtures can record all the outgoing calls. This is particu­\n\n\
    larly useful when testing a tuff component that makes calls to several ser­\n\n\
    vices or during end-to-end testing where a variety of calls can be made. A\n\n\
    main merit of using fixtures is that once generated, they are fast to access,\n\
    \nreducing the chances of timeouts. As they use real-time data, mocking the\n\n\
    data structure is not compulsory, and any changes can be identified.\n\nAs mentioned,\
    \ it is necessary to delete and refresh fixtures regularly to\n\nensure they do\
    \ not go out stale.\n\nA present “feature” of nock​.ba​ck is that when used in\
    \ the same test file\n\nas standard nock interceptors, they can interrelate with\
    \ each other unless\n\nany of nock.backtests are bookended per test as follows:\n\
    \nnock​.back​.setM​ode('record');\n\n// your test\n\nnock​.back​.setM​ode('wild');"
