  md: "Redux\uFEFF    ◾    **179**\n\nWe refer to this data as the action’s payload.\
    \ For example, when we dis­\n\npatch an action like RATE_COLOR, we will need to\
    \ know what color to\n\nrate and what rating to apply to that color. This information\
    \ can be passed\n\ndirectly with the action in the same JavaScript literal.\n\n\
    This action tells Redux to add a new color, called Bright White, to the\n\nstate.\
    \ All of the information for the new color is included in the action.\n\nActions\
    \ are nice little packages that tell Redux how the state should be\n\nchanged.\
    \ They also include any associated data that Redux will need to\n\nmake the change.\n\
    \nREDUCERS\n\nOur entire state tree is stored in a single object. A potential\
    \ complaint\n\nmight be that it’s not modular enough, possibly because you’re\
    \ consider­\n\ning modularity as describing objects. Redux achieves modularity\
    \ via func­\n\ntions. Functions are used to update parts of the state tree. These\
    \ functions\n\nare called Reducers.\n\nReducers are functions that take the recent\
    \ state along with the action\n\nas arguments and use them to create and return\
    \ a new state. Reducers are\n\ndesigned to update specific parts of the state\
    \ tree, either leaves or branches.\n\nWe can then compose reducers into one reducer\
    \ that can handle updating\n\nthe entire state of our App given any action. The\
    \ color organizer stores all\n\nof the state data in a single tree. If we want\
    \ to use Redux for this App, we\n\ncan create several reducers that each target\
    \ specific leaves and branches on\n\nour state tree.\n\nThis state data has two\
    \ main branches: colors and sort. The sort branch\n\nis a leaf. It doesn’t contain\
    \ any child nodes. The color branch stores mul­\n\ntiple colors. Each color object\
