  md: "Redux\uFEFF    ◾    **175**\n\nconst ColorList = ({ store }) => {\n\nconst\
    \ { colors, sort } = store.getState()\n\nconst sortedColors = [..​.colors].\n\n\
    sort(sortFunction(sort))\n\nreturn (\n\n<div className=\"color-list\">\n\n{(colors​.leng​th\
    \ === 0) ?\n\n<p>No Colors Listed. (Add a Color)</p> :\n\nsortedColors​.m​ap(color\
    \ =>\n\n<Color key={color​.​id}\n\n{..​.color}\n\nonRate={(rating) =>\n\nstore.dispatch(\n\
    \nrateColor(color​.i​d, rating)\n\n)\n\n}\n\nonRemove={() =>\n\nstore.dispatch(\n\
    \nremoveColor(color​.​id)\n\n)\n\n} />\n\n)\n\n}\n\n</div>\n\n)\n\n}\n\nColorList.propTypes\
    \ = {\n\nstore: PropTypes​.obje​ct\n\n}\n\nExport default ColorList. The store\
    \ has now been passed all the way down\n\nto the component tree to the ColorList.\
    \ This component interacts or com­\n\nmunicates with the store directly. Whenever\
    \ the colors are removed or rated,\n\nthose actions are forwarded to the store.\
    \ The store is also used to acquire\n\nthe previous original colors. Those colors\
    \ are duplicated and sorted, respec­\n\ntively, and saved as sortedColors according\
    \ to the store’s sort property.\n\nsortedColors are then used to create the user\
    \ interface. This technique\n\nis great if your component tree is small, like\
    \ the color organizer. The dis­\n\nadvantage of this strategy is that we must\
    \ transmit the store to the child\n\ncomponent manually. Additionally, the ColorList,\
    \ AddColorForm, and\n\nSortMenu components require this particular store. It would\
    \ be difficult\n\nto reuse them in another application."
