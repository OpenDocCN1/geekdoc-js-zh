  md: "**132**    ◾    Mastering React\uFEFF\n\nWe access the data in ThemeContainer\
    \ and Content while we invoke\n\nthe callback {context.updateTheme} basis by the\
    \ toggle button in\n\nThemeContainer.\n\nAPI (Application Programming Interface)\n\
    \n*The syntax to create “React.createContext”const UserContext =*\n\n*React.createContext(default\
    \ Value);Creating a Context Object*\n\nWhen React displays a component/module\
    \ that subscribes to this Context\n\nmethod, it will read the current context\
    \ value from the Provider that is the\n\nclosest match above it in the hierarchy.\n\
    \nThe argument is the default value only when a component/function\n\ndoes not\
    \ have a matching Provider above it in the hierarchy. This default\n\nvalue can\
    \ be very helpful for testing components in an isolated way with­\n\nout wrapping\
    \ them. *Note:* To pass undefined as a Provider value does not\n\ncause consuming\
    \ components to use defaultValue.\n\n*Context.Provider*\n\nThe syntax for context\
    \ provider \"<MyContext.Provider\n\nvalue={/* some value */}>\n\n\"\n\nEach Context\
    \ object assigns a Provider React component that allows it to\n\nconsume components\
    \ that subscribe to context changes/alters.\n\nThe Provider components accept\
    \ a value prop to be passed into the con­\n\nsuming components that are an heir\
    \ of this Provider. A single Provider\n\ncan be linked to several customers. Providers\
    \ can be nested to override/\n\noverwrite values deeper within the mesh.\n\nEach\
    \ and every consumer that is descendants of a Provider will reren­\n\nder whenever\
    \ the Provider’s value prop alters. The propagation/flow from\n\nProvider to its\
    \ descendant consumers (including .contextType and useC­\n\nontext) is not subject\
    \ to the shouldComponentUpdate method/function,\n\nso the consumer is likely to\
    \ update even when an ancestor/previous com­\n\nponent skips an update(modified).\n\
    \nChanges are determined by comparing old values to the new ones using\n\nthe\
    \ same algorithm as Object​.i​s.\n\n*Note*: The way modifications are determined\
    \ can cause some issues/\n\nerrors while passing objects as values."
