  md: "**198**    ◾    Mastering React\uFEFF\n\n*Create Another File Sagas​.spec​.js*\n\
    \nimport test from 'tape'\n\nimport { incrementAsync } from './sagas'\n\ntest('incrementAsync\
    \ Saga test', (assert) => {\n\nconst generator = incrementAsync()\n\n// now what\
    \ ?\n\n})\n\nWhen incrementAsync is called, it produces an iterator object, and\
    \ the\n\niterator’s next method returns an object of the following structure.\n\
    \ngenerator​.ne​xt() // => { done: boolean, value: any }\n\nThe value field keeps\
    \ the yielded expression, i.e., the result of the expres­\n\nsions after the yield.\
    \ The done field identifies if the generator has termi­\n\nnated/halts or if there\
    \ are still have 'yield' expressions.\n\nIn the case of incremental sync, the\
    \ generator creates two values\n\nconsecutively:\n\nyield delay(1000)\n\nyield\
    \ put({type: 'INCREMENT'})\n\nSo, if we call on the next method/function of the\
    \ generator three times\n\nconsecutively, we get the results as follows:\n\ngenerator​.ne​xt()\
    \ // => { \adone: false, value: <result\n\nof calling delay(1000)> }\n\ngenerator​.ne​xt\a\
    () // => { done: false, value: <result\n\nof calling put({type: 'INCREMENT'})>\
    \ }\n\ngenerator​.ne​xt() // => { \adone: true, value: un_\n\ndefined }\n\nThe\
    \ first two invocations return the results of the yield expressions.\n\nOn the\
    \ third citation, since there is no more yield, the done field is set\n\nto true\
    \ value. And since the incrementAsync Generator doesn’t return\n\nanything (no\
    \ return statement), the value field is set to undefined or\n\nvoid.\n\nSo now\
    \ in order to test the functionality inside the incrementAsync, we\n\nwill have\
    \ to repeat over the returned Generator and test the values yielded/\n\ngenerated\
    \ by the generator."
