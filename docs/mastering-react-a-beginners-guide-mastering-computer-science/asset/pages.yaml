  md: "**154**    ◾    Mastering React\uFEFF\n\n• **Describe**: This elective method\
    \ is for alliance any number of it or test\n\ndeclarations.\n\n• **Expect**: This\
    \ is the disorder that the test requires to pass. It differen­\n\ntiates the received\
    \ parameter from the matcher and it also provides\n\nyou admittance to a number\
    \ of matches that allow you to validate\n\ndissimilar things. You can read more\
    \ about it in this section.\n\n• **Mount**: This method renders the complete DOM,\
    \ including the child\n\ncomponents of the parent component, in which we are consecutively\n\
    \nthe tests.\n\n• **Shallow**: This renders only the specific components that\
    \ we are chal­\n\nlenging. It does not render child components. This allows us\
    \ to test\n\ncomponents in separation.\n\nCreating a Test File #\n\nHow does Jest\
    \ know what is a test file and what is not? The first rule is that\n\nany file\
