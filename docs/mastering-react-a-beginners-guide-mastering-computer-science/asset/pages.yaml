  md: "Redux\uFEFF    ◾    **199**\n\nimport test from 'tape'\n\nimport { incrementAsync\
    \ } from './sagas'\n\ntest('incrementAsync Saga test', (assert) => {\n\nconst\
    \ generation = incrementAsync()\n\nassert.deepEqual(\n\ngenerator​.ne​xt(),\n\n\
    { done: false, value: ??? },\n\n'incrementAsync \ashould return a Promise that\
    \ will sort\n\nout after one second'\n\n)\n\n})\n\nThe issue is how do we test\
    \ the returns value of the delay? We cannot do\n\na simple test of equality on\
    \ Promises and if delay returned a normal value,\n\nthings would have been simpler\
    \ to test.\n\nWell, redux-saga provides the way to make the above statement possible.\n\
    \nDespite calling delay(1000) directly inside incrementAsync, we will call it\n\
    \nindirectly and export it to make a subsequent deep matching feasible:\n\nimport\
    \ { put, take_Every, all, call } from 'redux-\n\nsaga/effects'\n\nexport const\
    \ delays = (ms) \a=> new Promise(res =>\n\nsetTimeout(res, ms))\n\n// ...\n\n\
    export function* incrementAsync() {\n\n// use the call Effect\n\nyield call(delay,\
    \ 1000)\n\nyield put({ type: 'INCREMENT' })\n\n}\n\nIn place of doing yield delay(1000),\
    \ we’re now doing yield call(delay, 1000).\n\nWhat is the difference?\n\nIn case\
    \ 1, the yield expression delay(1000) is assessed before it gets\n\npassed to\
    \ the call of next (the caller could be the middleware when run­\n\nning our codes.\
    \ It could also be our test code that runs or compiles the\n\nGenerator function\
    \ and repeats over the returned Generator). So what the\n\ncaller get is a Promise,\
    \ as in the above test code.\n\nIn case 2, the yield expression call(delay, 1000)\
    \ is required to the caller\n\nof the next call just like put, and returns an\
    \ Effect that instructs the mid­\n\ndleware to call a given function with the\
    \ given argument sets. In fact, nei­\n\nther the put nor call performs any dispatch\
    \ or asynchronous call by itself,\n\nthey return plain JavaScript objects or functions."
