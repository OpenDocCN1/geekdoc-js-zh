  md: "**206**    ◾    Mastering React\uFEFF\n\n</head>\n\n<body>\n\n<div id=\"p1\"\
    >\n\n<button id=\"c1\">I am the child button</button>\n\n</div>\n\n<script>\n\n\
    var parent = document.querySelector('#p1');\n\nparent.addEventListener('click',\
    \ function(){\n\nconsole​.l​og(\"Parent has invoked\");\n\n});\n\nvar child =\
    \ document.querySelector('#c1');\n\nchild.addEventListener('click', function(){\n\
    \nconsole​.l​og(\"Child has invoked\");\n\n});\n\n</script>\n\n</body>\n\n</html>\n\
    \nThe Output of the above Code\n\n*Explanation of the above Code*\n\nThe above\
    \ code is an HTML and JavaScript-based code.\n\nWe have used the div tag with\
    \ div id = p1 and inside div, we have nested\n\na button with button id = c1.\n\
    \nNow, within the JavaScript segment, we have allocated the HTML ele­\n\nments\
    \ (p1 and c1) using the querySelector () function to the adjustable\n\nparent\
    \ and the child.\n\nAfter that, we have formed and included an event which is\
    \ the click\n\nincident to both the div element and child button. Also are formed\
    \ two\n\nfunctions that will help us to know the sequence of the execution of\
    \ the\n\nparent and the child. It means that if the child event is appealed first,\
    \ “child\n\nhas invoked” will be printed, then “parent is invoked” will get printed\
    \ on\n\nthe console window.\n\nThus, when the button is clicked, it will first\
    \ print “child has\n\ninvoked,” which means that the function within the child\
    \ event han­\n\ndler performs first. Then it goes to the invocation of the div\
    \ parent\n\nfunction.\n\nThe arrangement has taken place due to the perception\
    \ of the event\n\nbubbling. Thus, in this way event bubbling takes place."
