  md: "**196**    ◾    Mastering React\uFEFF\n\nare naturally positive. Thus, we have\
    \ a problem; there is nowhere in your\n\nRedux application to place your side-effects.\n\
    \nA Redux middleware is associated between an action and a reducer.\n\nThis allows\
    \ actions to contain something else other than the plain object,\n\nas long as\
    \ the middleware intercepts this, performs its functionality, and\n\nreturns a\
    \ plain object to pass along toward the reducer.\n\nRedux Thunk, a popular Redux-Saga\
    \ option, allows functions to enter\n\nthe Redux store dispatch, which checks\
    \ to see if it is a function or an action\n\nobject or module, starting the component\
    \ in the former scenario and\n\ndirectly passing along with the action objects\
    \ to the reducer in the latter\n\ncase, and these functions can then perform whatever\
    \ composite asynchro­\n\nnous logic they want and produce a plain action or call\
    \ object to be passed\n\ninto the reducer.\n\nRedux Sagas are somewhat different\
    \ in that a separate set of instruc­\n\ntions are defined in your Redux app, which\
    \ is captured exclusively by\n\nwatcher functions (as part of your saga). The\
    \ saga will implement the\n\ncorresponding logic and dispatch a resultant call\
    \ to your App’s reducer\n\nupon capturing the calls. The saga effectively operates\
    \ as a second thread\n\nto your App, listening for particular actions from your\
    \ main application\n\nto do sophisticated asynchronous activities and changing\
    \ the state of your\n\nApp once they are completed.\n\nWhile I would not say Redux\
    \ Saga is inherently better than any of the\n\nalternatives available, it has\
    \ some benefits that might make you want to\n\nconsider its use.\n\nRedux Saga\
    \ offers a place completely de-coupled from your action mak­\n\ners for you to\
    \ handle your App’s side-effects. Some people may feel that\n\nthis makes your\
    \ App’s data flow harder to follow (which I would agree\n\nwith), but I think\
    \ that this de-coupling makes organizing your codebase\n\nand extending functionality\
    \ simpler down the road.\n\nFor example, in a situation where you might require\
    \ to support a work­\n\nflow that needs multiple HTTP requests to different services\
    \ in a par­\n\nticular order, Redux-Saga permits you to compose granular sagas\
    \ into\n\na single one and represents this new high-level function with a separate\n\
    \ncall. Your application can still access/pass each individual HTTP resource\n\
    \nin another workflow, but for this specific one, your React component can\n\n\
    manually call this high-level action to load whatever it requires from\n\na single\
    \ place. As far as your component or module is concerned, your\n\nasynchronous\
    \ logic to load multiple resources in a particular order is an\n\nabstracted way."
