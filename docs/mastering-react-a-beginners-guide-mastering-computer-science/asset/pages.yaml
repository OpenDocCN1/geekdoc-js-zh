  md: "Testing Your Code\uFEFF    ◾    **161**\n\nIn our end-to-end testing, for example,\
    \ we see an example from my\n\npresent company. These employ Nock fixtures since\
    \ they would occasion­\n\nally fail due to timeouts while running during our continuous\
    \ delivery\n\nprocess. However, each time the developer runs these tests locally,\
    \ the\n\nfixtures are immediately destroyed and regenerated, keeping them up to\n\
    \ndate.\n\n• Nock is currently used in two chief ways:\n\n1. Mocking individual\
    \ responses specified by the developer or\n\ndesigner uses Nock\n\n2. Recording,\
    \ saving, and reusing/reusable live responses use\n\nnock​.ba​ck\n\nEither can\
    \ be within individual tests and if both are used within the same\n\ntest files,\
    \ then the nock​.ba​ck mode must be directly set, and reset, before\n\nand after\
