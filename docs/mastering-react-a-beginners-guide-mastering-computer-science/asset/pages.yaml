    \nexpect.objectContaining({\n\nresults: expect​.a​ny(Object),\n\n}),\n\n);\n\n\
    nockDone();\n\nnock​.back​.setM​ode('wild');\n\n});\n\nWe first mark the test\
    \ as asynchronous, to permit us to use Await. We\n\nset the mode to record state.\
    \ We pass in the name of the files we like to\n\nstore our fixtures as, and the\
    \ default-Options set in our nock​.​js helper to"
