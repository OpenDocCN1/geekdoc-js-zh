  md: "Testing Your Code\uFEFF    ◾    **151**\n\nA BRIEF INTRODUCTION TO TESTING\
    \ #\n\nChallenging is a line-by-line review of how your code will implement. A\n\
    \nsuite of tests for an application contains various bits of code to authenti­\n\
    \ncate whether an app is executing effectively and without fault. When codes\n\
    \nare updated, testing comes in helpful as well. After upgrading a piece of\n\n\
    code, you may run a test to ensure that the update does not damage exist­\n\n\
    ing app functionality.\n\nWhy Test? #\n\nIt is good to understand why we are doing\
    \ something before doing it. So,\n\nwhy test, and what is its persistence?\n\n\
    The first resolution of testing is to avoid regression. Regression is the\n\n\
    reappearance of an error that had formerly been fixed. It is a kind of fea­\n\n\
    ture stop effective as intended after a certain incident occurs.\n\nTesting confirms\
    \ the functionality of composite components and mod­\n\nular apps.\n\nTesting\
    \ is needed for the effective performance of a software app or\n\nproduct.\n\n\
    Testing makes an app more vigorous and less prone to error. It is a way\n\nto\
    \ authenticate that your code does what you want it to do and that your\n\napp\
    \ works as projected for your users.\n\nLet us go over the types of testing and\
    \ what they do.\n\nUnit Test #\n\nIn this kind of test, a specific unit or component\
    \ of the software is tested.\n\nA unit might be an individual function, component,\
    \ method, procedure,\n\nmodule, or object. A unit test separates a section of\
    \ codes and verifies its\n\nprecision, in order to confirm that each unit of the\
    \ software’s code accom­\n\nplishes as probable.\n\nIn unit testing, individual\
    \ processor functions are verified to guarantee\n\nthat they are operating appropriately,\
    \ and that all components are tested\n\nindependently. For instance, testing a\
    \ function whether an announcement\n\nor a loop in a program is functioning appropriately\
    \ would fall under the\n\nscope of unit testing.\n\nComponent Test #\n\nComponent\
    \ testing authenticates the functionality of a specific part\n\nof an app. Tests\
    \ are executed on each component in isolation from the"
