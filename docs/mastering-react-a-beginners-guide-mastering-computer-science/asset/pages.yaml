  md: "Advanced Tools\uFEFF    ◾    **143**\n\nThis is when the render prop comes\
    \ into play: rather than hard-coding\n\na Cat> within a Mouse> component and essentially\
    \ modifying its dis­\n\nplayed output, we may supply a function prop that Mouse>\
    \ uses to select\n\nwhat to render – a render prop dynamically.\n\nclass Cat extends\
    \ React.Component {\n\nrender() {\n\nconst mouse = this​.props​.mou​se;\n\nreturn\
    \ (\n\n<img \asrc=\"/cat​.jp​eg\" style={{ position:\n\n'absolute', left: mouse.x,\
    \ top: mouse.y }} />\n\n);\n\n}\n\n}\n\nclass Mouse extends React.Component {\n\
    \nconstructor(props) {\n\nsuper(props);\n\nthis.handleMouseMove =\a this​.handleMouseMove​.b​\n\
    \nind(this);\n\nthis​.sta​te = { x: 0, y: 0 };\n\n}\n\nhandleMouseMove(event)\
    \ {\n\nthis.setState({\n\nx: event.clientX,\n\ny: event.clientY\n\n});\n\n}\n\n\
    render() {\n\nreturn (\n\n<div style={{ height: '101vh' }} \aonMouseMove={this.\n\
    \nhandleMouseMove}>\n\n{/*\n\nDespite providing \aa static representation of what\n\
    \n<Mouse> renders,\n\nuse the \a'render' prop to clarify what to render\n\ndynamically.\n\
    \n*/}\n\n{this​.props​.ren​der(this​.sta​te)}\n\n</div>\n\n);\n\n}\n\n}"
