  md: "**178**    ◾    Mastering React\uFEFF\n\na string value for each of these action\
    \ types. An action is a JavaScript object\n\nthat has at minimum a field for type:\n\
    \n{ type: \"ADD_COLOR\" }\n\nThe action-type is a string that defines what should\
    \ happen. ADD_\n\nCOLOR is the action that will add a new color to our list of\
    \ colors in the\n\napplication state. It is pretty easy to make typos when creating\
    \ actions\n\nusing strings:\n\n{ type: \"ADD_COOLOR\" }\n\nThis typo would cause\
    \ a bug in our application. This type of error usu­\n\nally does not trigger any\
    \ warnings; you simply will not see the expected\n\nchange of your state data.\n\
    \nIf you make these errors, they can be tough to find. This is where con­\n\n\
    stants can save you:\n\nimport C from \"./constants\"\n\n{ type: C.ADD_COLOR }\n\
    \nThis specifies the same action, but with a JavaScript constant instead of\n\n\
    a string. A typo in a JavaScript variable will cause the browser to throw\n\n\
    an error. Defining actions as constants also lets you tap into the benefits\n\n\
    of IntelliSense and code completion in your IDE. When you start typing\n\nthe\
    \ first letter or two of a variable, the IDE will autocomplete it. Using\n\nconstants\
    \ is not required, but it is not a bad idea to get into the habit of\n\nincorporating\
    \ them.\n\nAction Type Naming Conventions\n\nAction types, like ADD_COLOR or RATE_COLOR,\
    \ are just strings, so\n\ntechnically you could call an action anything. Typically,\
    \ action types are\n\ncapitalized and use underscores instead of spaces. You should\
    \ also aim to\n\nclearly state the action’s intended purpose.\n\nAction Payload\
    \ Data\n\nActions are JavaScript literals that provide the instructions necessary\
    \ to\n\nmake a state change. Most state changes also require some data. Which\n\
    \nrecord should I remove?\n\nWhat new information should I provide in a new record?"
