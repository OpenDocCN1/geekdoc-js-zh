  md: "React Routers\uFEFF    ◾    **91**\n\nIt is also worth observing that the react-router\
    \ package uses the Path-\n\nto-RegExp package to turn the path string into the\
    \ regular expression and\n\nmatched against the current location.\n\nThe <Route/>\
    \ component or module offers three props that can be\n\nused to determine which\
    \ component to render:\n\n• => component\n\n• => render\n\n• => children\n\nComponent\
    \ Prop\n\nThe component prop expresses that the Route will return the React ele­\n\
    \nment when the path is coordinated. This React element is formed from the\n\n\
    provided component or module using React.createElement. There is an\n\nexample\
    \ using the component prop.\n\n<Route\n\n  exact\n\n  path=”/items”\n\n  component={Items}\n\
    \n/>\n\nIn this example, the Items components will be returned when the path\n\
    \nmatches the present location.\n\nRender Prop\n\nThe render prop provides the\
    \ capability for inline rendering and passing\n\nextra props to the element and\
    \ this prop expects the function that returns\n\na React element when the present\
    \ location matches the route’s route. There\n\nare examples demonstrating the\
    \ use of the render prop on the Route\n\ncomponent.\n\n<Route\n\n  exact\n\n \
    \ path=”/items”\n\n  render={() => (<div>List of Items</div>)}\n\n/>"
