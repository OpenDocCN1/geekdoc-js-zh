  md: "**222**    ◾    Mastering React\uFEFF\n\nIn the node tree, the top node has\
    \ termed the root(or root node).\n\nEvery node has precisely one parent, except\
    \ the root (which has no\n\nparent).\n\nA node can have numerous children.\n\n\
    Siblings (brothers or sisters) are nodes with the same parent.\n\n<html>\n\n<head>\n\
    \n<title>DOM_Tutorial</title>\n\n</head>\n\n<body>\n\n<h1>DOM Lesson 1</h1>\n\n\
    <p>Hello_world!</p>\n\n</body>\n\n</html>\n\nNode Tree\n\nFrom the above HTML\
    \ you can read:\n\n<html> is the root node\n\n<html> has no parents node\n\n<html>\
    \ is the parent node of the <head> and <body>\n\n<head> is the first child node\
    \ of <html>\n\n<body> is the last child node of <html>\n\nand:\n\n<head> has one\
    \ child node: <title>\n\n<title> has one child node (a text node): \"DOM Tutorials\"\
    \n\n<body> has two children: <h1> and <p>\n\n<h1> has one child: \"DOM Lesson\
    \ 1\"\n\n<p> has one child: \"Hello_world!\"\n\n<h1> and <p> are siblings\n\n\
    NAVIGATING BETWEEN NODES\n\nYou can use the subsequent node properties to navigate\
