  md: "Testing Your Code\uFEFF    ◾    **153**\n\nINTRODUCTION TO JEST #\n\nJest is\
    \ a pleasant JavaScript challenging framework with a focus on effort­\n\nlessness.\
    \ It can be installed or set up with npm or Yarn. Jest fit into a\n\nbroader class\
    \ of utilities known as test runners. It works great for React\n\napps, but it\
    \ also works great for external React apps.\n\nThe Enzyme is a package for testing\
    \ React applications. It is intended to\n\ntest components and makes it possible\
    \ to build declarations that imitate\n\nactions to validate whether the UI is\
    \ functioning properly.\n\nJest and Enzyme accompany each other well, so in this\
    \ piece, we will be\n\nusing both of them.\n\nProcess of Running a Test with Jest\
    \ #\n\nIn this part, we will be installing Jest and writing tests for it. If you\
    \ are new\n\nto ReactJS, then I acclaim using Create React App, for the reason\
    \ that it is\n\nready for use and ships with Jest.\n\nnpm init react-app my-app\n\
    \nWe require to install Enzyme ****and enzyme-adapter-react-16 with\n\nreact-test-renderer\
    \ (the number should be based on the variety of React\n\nyou are using).\n\nnpm\
    \ install --save-dev enzyme enzyme-adapter-react-16\n\nreact-test-renderer\n\n\
    Note that we have created our project with both Jest and Enzyme, we\n\nneed to\
    \ create a setupTest​.​js file in the project’s src folder. This is how the\n\n\
    file would look:\n\nimport { configure } from \"enzyme\";\n\nimport Adapter from\
    \ \"enzyme-adapter-react-16\";\n\nconfigure({ adapter: new Adapter() });\n\nThis\
    \ significant Enzyme sets up the connecter to run our tests.\n\nBefore continuing,\
    \ let us learn some basics. Some key belongings have\n\nbeen used a lot in this\
    \ chapter, and you will need to clear them or test\n\nthem. You would pass a function\
    \ or method to this technique, and the test\n\nrunner would perform that determination\
    \ as a block of tests."
