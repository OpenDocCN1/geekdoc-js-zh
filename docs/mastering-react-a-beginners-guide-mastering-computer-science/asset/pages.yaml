  md: "**92**    ◾    Mastering React\uFEFF\n\nIn the above example, when the existing\
    \ location matches the route\n\nexactly, a React element is formed and the string\
    \ List of Items is rendered\n\ninto the browser.\n\nconst cat = {category: “food”}\n\
    \n<Route\n\n  exact path=”/items”\n\n  render={props =>  <Items {…props} data={cat}/>}\n\
    \n/>\n\nIn the second example, data or info represents the extra props that are\n\
    \npassed to the Items component. Here, the cat is passed as an extra prop.\n\n\
    Children Prop\n\nThe children prop is like the render prop, which at all times\
    \ expects a\n\nfunction that returns the React element. The leading difference\
    \ is that the\n\nelement defined by the child prop is returned for all routes\
    \ regardless of\n\nwhether the present location matches the route or not.\n\n\
    <Route children={props =>  <Items {…props}/>}/>\n\nIn the above case, Items components\
    \ are always rendered.\n\nSwitch\n\nThe react-router library also encompasses\
    \ a <Switch/> component that is\n\nused to wrap multiple <Route/> components into\
    \ it. The Switch compo­\n\nnent selects the first matched path from all of its\
    \ children’s pathways.\n\nThe next example validates how multiple routes or paths\
    \ act in the\n\nabsence of the Switch components.\n\n<Route\n\npath=”/items”\n\
    \nrender={() => (<div><em>List of the items</em></\n\ndiv>)}\n\n/>\n\n<Route\n\
    \npath=”/items/3\"\n\nrender={() => (<div>Item with id of 3</div>)}\n\n/>"
