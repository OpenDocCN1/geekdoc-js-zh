    \ middleware.\n\nInstead of exporting the store directly, we export a function,\
    \ a factory\n\nthat can be used to create stores. If this factory is invoked,\
    \ then it will cre­\n\nate and return a store that incorporates logging and saving.\n\
    \nIn the logger, before the action is dispatched, we open a new console\n\ngroup\
    \ and log the current state and the current action. Invoking next pipes\n\nthe\
