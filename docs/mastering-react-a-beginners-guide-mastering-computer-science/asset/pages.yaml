  md: "Basics of React\uFEFF    ◾    **35**\n\nWHAT IS A REACT COMPONENT?\n\nThe following\
    \ section will deliver an intellectual model around the nature\n\nof a React module\
    \ and cover details around forming React components/\n\nelements.\n\nTypically,\
    \ the only interpretation of a user interface (e.g., the tree or\n\ntrunk) is\
    \ divided up into reasonable chunks (e.g., branches). The sapling\n\nbecomes the\
    \ starting section (e.g., a layout component) and then each por­\n\ntion in the\
    \ UI will become a sub-element that can be separated further\n\ninto sub-components\
    \ (i.e., sub-branches). This not only keeps the UI pre­\n\npared but also permits\
    \ data and state variations to sensibly flow from the\n\ntree to twigs, and then\
    \ sub-twigs.\n\nIf this explanation of React module is complex, then I would advise\
    \ that\n\nyou inspect any application interface and mentally start isolating the\
    \ UI\n\ninto logical lumps. Those chunks possibly are components. React modules\n\
    \nare the program of the sequence of concepts (i.e., UI, events/interactions,\n\
    \nstate changes, DOM changes) making it possible to exactly form these\n\nlumps\
    \ and sub-lumps. For example, a lot of application UIs will have an\n\noutline\
    \ constituent as the top constituent in a UI opinion. This constitu­\n\nent will\
    \ cover several sub-components, like, maybe, a search constituent\n\nor a menu\
    \ component. The search constituent can then be separated fur­\n\nther into sub-components.\
    \ Maybe the quest input is a distinct component\n\nfrom the button that invokes\
    \ the search. As you can see, a UI can rapidly\n\nconvert a tree of components.\
    \ Today, software program UIs are classically\n\ncreated by making a tree of very\
    \ simple single accountability components.\n\nReact offers the means to produce\
    \ these mechanisms via the “[React.cre­\n\nateClass()]” function (or, !@#$React.Component\
    \ if it uses ES6 classes). The\n\n[React.createClass()] function takes in an arrangement\
    \ entity and yields a\n\nReact component case.\n\nA React module is mostly any\
    \ fragment of a user interface that can\n\nencompass React nodes (via React.createElement()\
    \ or JSX). I have con­\n\nsumed a lot of time upfront grooming React nodes so\
    \ that the elements\n\nof a React module would be firmly understood. It seems\
    \ to be simple till\n\none comes to know that React modules can have other React\
    \ sub-elements\n\nwhich can result in a composite tree of components. This is\
    \ not dissimilar\n\nto the idea that React nodes can hold other React nodes in\
