  md: "Forms\uFEFF    ◾    **229**\n\n**Pros:** If we place only the client-side form\
    \ validation logic (JavaScript),\n\nthen it decreases the network round trips\
    \ between client and server\n\nas the form validation takes place on the client-side\
    \ itself without\n\ngoing to the server.\n\n**Approach 3:** Placing form authentication\
    \ logic both on the server side\n\nand client side.\n\n**Pros:** Write both client-\
    \ and server-side authentication logic, so the\n\nserver-side form validation\
    \ takes place even though client-side\n\nform authentication is not done.\n\n\
    **Cons:** If client-side form authentication is executed, then it will also\n\n\
    perform server-side form authentication, which degrades the\n\nperformance.\n\n\
    **Approach 4:** Place form authentication logic both on the server side\n\nand\
    \ client side, but accomplish server-side form authentication logic\n\nonly when\
    \ client-side form validation logic is not affected.\n\nWrite both client-side\
    \ and server-side form authentications, but\n\nenable server-side form authentications\
    \ only when client-side form\n\nvalidations are not done. This client(browser)\
    \ directs a flag to the\n\nserver, indicating whether client-side form authentications\
    \ are done\n\nor not.\n\n**Conclusion:** Approach 4 is the best approach or method.\
    \ Compared\n\nto the other approach, Approach 4 does not have a performance\n\n\
