  md: "**108**    ◾    Mastering React\uFEFF\n\nWe’ll concentrate on the history prop,\
    \ which maintains track of all\n\nthe session history beneath the hood and gives\
    \ us several methods or\n\napproaches to change it.\n\nThe push method is crucial\
    \ and is used to push a path as a route to\n\nthe history stack, which performs\
    \ as Last In First Out (LIFO). This causes\n\nthe application to redirect to the\
    \ last route added, redirecting the user to\n\na detailed route. The below example\
    \ assumes the component is rendered\n\nwith the React Router.\n\nCode-sandbox:\n\
    \nhttps://codesandbox​.io​/s​/angry​-saha​-djh3z​?file=​/src​/\n\nApp​.js\n\n\
    import React from \"react\";\n\nimport { userLogin } from \"./userAction\";\n\n\
    import Form from \"./Form\";\n\nconst Login = props => {\n\nconst handleLogin\
    \ = async userDetail => {\n\nconst success = await userLogin(userDetail);\n\n\
