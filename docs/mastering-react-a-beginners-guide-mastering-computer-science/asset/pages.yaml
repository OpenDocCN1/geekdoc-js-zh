  md: "React Components\uFEFF    ◾    **69**\n\n• **Easier managing of CSS**: Because\
    \ each piece of style is linked to a\n\nspecific component, it is easy to determine\
    \ which CSS is being used.\n\nThis makes it simple to get rid of unneeded component\
    \ styles.\n\n• **Simple and lively design**: Styled components enable props and\n\
    \nglobal themes, making styling much easier than manually grouping\n\nmany classes.\n\
    \n• **Reproducible styles**: When you style with the styled components,\n\nyou\
    \ can import your styles into the other project areas; it does not\n\nmatter how\
    \ big or small your codebase is.\n\nCREATING AND STYLING: A COMMON WEB\n\nPAGE\
    \ USING STYLED COMPONENTS\n\nThis section will produce a clone for the *disney+*\
    \ landing page and add\n\nCSS to its components using the styled components.\n\
    \nFirst, we need to create an application in React that will contain our\n\nlanding\
    \ page.\n\nWithin the folder of your choice, open the *command prompt* and type\n\
    \nthe following command:\n\nnpx create-react-app Disney-landing-page\n\nThis will\
    \ initialize and form our react app named Disney-landing-page\n\nby loading and\
    \ installing all the React dependencies essential for our\n\napplication.\n\n\
    Once all the dependencies have been installed, a development environ­\n\nment\
    \ for the React app will be ready.\n\nTo get into the project folder, use the\
    \ instruction below in the command\n\nprompt or the terminal of your code editor:\n\
    \ncd Disney-landing-page\n\nINSTALLING STYLED COMPONENTS\n\nNext, we need to install\
    \ the styled components and the react-router-dom\n\nlibraries into our project\
    \ by means of the commands below:\n\nyarn add styled-components\n\nyarn add react-router-dom"
