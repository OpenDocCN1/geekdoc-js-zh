  md: "React Components\uFEFF    ◾    **65**\n\nConditional Rendering\n\nIn React,\
    \ you can generate distinct components that encapsulate your\n\nneed’s performance.\
    \ Then, you can extract only some of them, depending\n\non the state of your apps.\n\
    \nConditional rendering in React is similar to how conditions work in\n\nJavaScript\
    \ in that it uses JavaScript operators such as if and the conditional\n\noperator\
    \ to generate elements that represent the current state and then\n\nallows React\
    \ to update the UI to match them.\n\nLet us consider these two components:\n\n\
    function UserGreeting(props) {\n\n  return <h1>Welcome </h1>;\n\n}\n\nturn <h1>Please\
    \ sign up.</h1>;\n\n}function GuestGreeting(props) {\n\n  re\n\nWe will create\
    \ a Greeting component that displays either of these com­\n\nponents depending\
    \ on whether a user is logged in or not:\n\nfunction Greeting(props) {\n\nconst\
    \ isLoggedIn = props.isLoggedIn;\n\nif (isLoggedIn) {\n\nreturn <UserGreeting\
    \ />;\n\n}\n\nreturn <GuestGreeting />;\n\n}\n\nReactDOM​.rend​er(\n\n// Try changing\
    \ to isLoggedIn={true}:\n\n<Greeting isLoggedIn={false} />,\n\ndocument.getElementById('root')\n\
    \n);\n\nTry it on the CodePen platform.\n\nThe given example renders a different\
    \ greeting depending on the value\n\nof the isLoggedIn prop."
