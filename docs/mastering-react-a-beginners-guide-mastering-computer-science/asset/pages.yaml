    \ file in the bundle. Unlike the CSS imports, import­\n\ning a file will give\
    \ you a string value. Now this value is the final path you\n\ncan reference in\
    \ your code. For example, the src attribute of an image or\n\nthe*href* of a link\
    \ to a PDF.\n\nNotes\n\n• Script and stylesheet get decreased and bundled, composed\
    \ to evade\n\nadditional network requirements.\n\n• Mislaid files cause compiling\
    \ faults instead of 404 errors for your\n\nusers.\n\n• Consequently, computer\
    \ filename contains satisfied hashes, so you\n\ndon’t need to worry about browsers\
