    or worse, try to run it when you call Jest. The second guideline is that Jest\n\
    \nwill look for any file with a suffix such as ​.spec​.js or ​.test​.js before\
    \ searching\n\nthe names of all folders and files in your whole repository.\n\n\
    Let us create our first test, for a React mini-app design for this chapter.\n\n\
    You can make it on GitHub. Run or execute npm install to install all of\n\nthe\
