    \ buttons in the exercise form are in two different columns. If we have not placed\
    \ them inside a `block` item before using the new column item, then it would have\
    \ pushed the buttons to the right of the other form elements. The block item allowed\
    \ us to contain the column without affecting the other form items.\n\n## Form\
    \ methods\n\nWe just covered many of the DHTMLX form item types and some of their\
