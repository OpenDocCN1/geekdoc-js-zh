    The toolbar spacer is now removed and all items are aligned to the left.


    ```

    myToolbar.removeSpacer("myButtonId");

    ```


    # addSlider


    The `addSlider` method creates a slider item, which will hold the value for later
    retrieval either on an event or specific request. The parameters for this item
    are ID, position, length of slider in pixels as integer, minimum value, maximum
    value, current value, label left side, label right side, and tooltip (optional).


    Type and run the following code line in the console:


    ```

    myToolbar.addSlider("mySliderId", 5, 40, 1, 10, 4, "Low", "High");

    ```'
  - '[PAGE 62]


    The DHTMLX Toolbar


    # addInput


    The `addInput` method creates a form like input in the toolbar. Its parameters
    are ID, position, initial value, and width in pixels as `int`.


    Type and run the following code line in the console:


    ```

    myToolbar.addInput("myInputId",6,"Hi", 30);

    ```


    We now have an input with a default value of Hi.


    # getValue


    The `getValue` method returns the value of a slider or input toolbar item.


    Type and run the following code line in the console:


    ```

    myToolbar.getValue("myInputId");

    ```


    You now see in the console, the initial value we set for the input. `disableItem`
    and `enableItem`.


    The `disableItem` renders an item disabled and `enableItem` does the reverse.


    Type and run the following code line in the console:


    ```

    myToolbar.disableItem("myButtonId");

    ```


    The button is now disabled and will not trigger any events.


    Now enable the button. Type and run the following code line in the console:


    ```

    myToolbar.enableItem("myButtonId");

    ```


    # hideItem and showItem


    The `hideItem` hides the toolbar item and the `showItem` does the reverse.


    Type and run the following code line in the console:


    ```

    myToolbar.hideItem("myButtonId");

    ```


    Type and run the following code line in the console:


    ```

    myToolbar.showItem("myButtonId");

    ```'
  - "[PAGE 63]\n\nHiding and showing toolbar items can be helpful when restricting\
    \ permissions to features.\n\n# removeItem\n\nThe `removeItem` method removes\
    \ an item from the toolbar. Type and run the following code line in the console:\n\
    \n```\nmyToolbar.removeItem(\"myInputId\");\n```\n\nThe input is now removed from\
    \ the toolbar.\n\n# Toolbar events\n\nNow that we have covered the different types\
    \ of items and how to get their values, we will talk about the events that can\
    \ be triggered. The toolbar events we will cover are `onClick`, `onStateChange`,\
    \ `onValueChange`, and `onEnter`.\nThe parameters for these events are the event\
    \ name and handler function.\nWhen triggered, the event handler will provide an\
    \ argument of the item ID which triggered the event.\n\n# onClick\n\nThe `onClick`\
    \ event listens to any clicks on the toolbar's items.\nLet's add this event to\
    \ the toolbar. Type and run the following code line in the console:\n\n```\nmyToolbar.attachEvent(\"\
    onClick\", function(itemId) {\n    console.log(itemId);\n});\n```\n\nNow, click\
    \ on the toolbar button item and see the item ID being logged in the console.\
    \ Also note that the select button will act as a button when clicking left of\
    \ the arrow.\n\n# onValueChange\n\nThe `onValueChange` event fires when the toolbar\
    \ slider item value is changed."
  - "[PAGE 64]\n\n# onStateChange\n\nThe `onStateChange` event fires when the toolbar\
    \ two-state button item state is changed.\n\n# onEnter\n\nThe `onEnter` event\
    \ fires when the *Enter* key is pressed inside the toolbar input item.\n\n# The\
    \ application code\n\nWe covered a lot of what DHTMLX has to offer in its toolbar\
    \ component. This will get us going for the application code.\n\nOpen the `app.js`\
    \ file and get ready to start writing code.\n\n# Creating the toolbar\n\nNow we\
    \ will create the toolbar for the application. We will use a JavaScript object\
    \ literal to create the toolbar.\n\nEnter the following code directly below where\
    \ the layout is created in the `app.js` file:\n\n```\n// Toolbar\nvar appToolbar;\n\
    dhtmlxEvent(window, \"load\", function(){\n    // create toolbar\n    appToolbar\
