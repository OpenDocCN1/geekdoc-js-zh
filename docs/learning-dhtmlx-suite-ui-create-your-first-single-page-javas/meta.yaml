    ```\n\nThe returned object is logged in the console. Each of the form items are\
    \ there. Notice the very first property is a random name generated by DHTMLX for\
    \ the input that we did not provide a name for.\n\n## The application code\n\n\
    Now, we have covered all the necessary form methods to create the application\
    \ form. We are now going to add the form creation method to the `app.js` that\
