- md: "Try these methods on a cell object. There is a styling difference in the progress\
    \ indicators for a layout object and cell object. These progress indicators can\
    \ be easily styled with CSS.\n\n## Overview of methods\n\nWe covered the more\
    \ commonly used methods for the DHTMLX layout and cell objects and the ones we\
    \ will use in building the application. DHTMLX provides many advanced features\
    \ you can explore like views, auto sizing, and docking/undocking.\n\n## Layout\
    \ events\n\nEvents in JavaScript are very useful when creating applications. DHTMLX\
    \ has provided many different events for each of the components. We will go over\
    \ how to attach and detach one of the events to give us an idea of how we can\
    \ utilize them.\n\nThe more common events for the layout object are `onResizeFinish`,\
    \ `onExpand`, `onCollapse`, and `onDblClick`. Let's take a look at `onResizeFinish`.\n\
    \nWe will use the same layout we created in previous sections to attach this event.\n\
    \n## attachEvent and detachEvent\n\nDHTMLX provides the `attachEvent` and `detachEvent`\
    \ methods.\n\nThe first parameter when attaching an event is the name of the event\
    \ you want to attach. The second is a handler method, which is the method that\
    \ will fire when the event triggers.\n\nType and run the following code:\n\n```\n\
    var myEventId = myLayout.attachEvent(\"onResizeFinish\", function(){\n    console.log(\"\
    Layout Resized\");\n});\n```\n\nNow if you resize the browser window you will\
    \ see a console entry stating **Layout Resized**.\n\nIn most cases the DHTMLX\
    \ event will pass some parameters back to the handler method. Since this is just\
    \ telling us the layout has been resized it passes nothing back.\n\nTo detach\
    \ an event we use the returned event ID from the `attachEvent` method. For the\
    \ event we just created, this event ID was assigned to the `myEventId` variable.\
    \ Now, we will use this to detach that same event.\n\nType and run the following\
    \ code:\n\n```\nmyLayout.detachEvent(myEventId);\n```\n\nThe console no longer\
    \ logs the text from the event.\n\nIf you want to clear all of the events created\
    \ on a certain layout object you could also use myLayout.detachAllEvents(), passing\
    \ no arguments.\n\n## dhtmlxEvent\n\nSimilar to other JavaScript libraries, DHTMLX\
    \ also has its own method to attach HTML DOM events to the HTML DOM elements.\
    \ It takes three arguments; the first being the DOM element, the second being\
    \ the HTML DOM event name without the \"on\" prefix, and lastly the handler. We\
    \ will be using this to load each of the application parts on the page load:\n\
    \n```\ndhtmlxEvent(window, \"load\", function(){\n    // Code to be run on page\
    \ load\n});\n```\n\nAll events in DHTMLX when added to the same event for the\
    \ same object are added to an internal array that will be fired in the order it\
    \ was added.\n\n## The application code\n\nNow that we have covered how to use\
    \ the DHTMLX's layout component, we are ready to create a layout for the application.\
    \ Open the app.js file and get ready to start writing the code.\n\n## Create the\
    \ layout\n\nEnter the following code directly below the config object in the app.js\
    \ file:\n\n```\n// Layout\nvar appLayout;\ndhtmlxEvent(window, \"load\", function(){\n\
    \    appLayout = new dhtmlXLayoutObject(document.body, \"2U\");\n    appLayout.cells(\"\
    a\").hideHeader();\n    appLayout.cells(\"b\").setText(\"User Chart\");\n});\n\
    ```\n\nFirst, we defined the global variable `appLayout` that will allow us access\
    \ to the layout in other methods of the application. Then we created the layout\
    \ wrapped in a page load event. When the page loads the layout will be created.\n\
    \nAfter refreshing the page it will look like the following screenshot:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_53_0.png)\n\
    \n## Summary\n\nIn this chapter, we went over the DHTMLX layout component and\
    \ its commonly used methods and events. We then created the main layout for the\
    \ application. Everything in the following chapters will be created in and around\
    \ this layout.\n\nIn the next chapter, we will learn about the DHTMLX toolbar\
    \ component and create one for the application.\n\n# 5\nThe DHTMLX Toolbar\n\n\
    In this chapter, we will learn about the DHTMLX toolbar component and its different\
    \ initializations, events, methods, and settings. Then we will add a toolbar to\
    \ the application, giving it the ability to delete and add a user.\n\nAll changes\
    \ made in this chapter will occur inside the app.js file.\n\n## The DHTMLX toolbar\n\
    \nThe DHTMLX toolbar is a very handy component for applications or web pages.\
    \ It allows us to quickly and easily create a robust series of buttons, dropdowns,\
    \ and inputs.\n\nWhen creating a DHTMLX toolbar, we have the freedom to place\
    \ it inside a DOM element, a DHTMLX layout or a DHTMLX cell. But when attaching\
    \ toolbars to the DHTMLX layout or cell, each are both limited to one. The following\
    \ screenshots shows the differences of attaching a toolbar to a layout object\
    \ and a cell object.\n\nThis screenshot shows an empty toolbar and what it looks\
    \ like when one is attached to a layout object:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_55_0.png)\n\
    \nThis screenshot shows a toolbar attached to a cell object:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_56_0.png)\n\
    \n## The methods and events\n\nNow open up the Chrome browser with the developer\
    \ tools visible console, and we will begin to learn about the DHTMLX toolbar object.\
    \ We will attach a toolbar, add toolbar items, and bind events.\n\n## Initialization\
    \ choices\n\nThe DHTMLX toolbar can be initiated in two ways. The first way is\
    \ by attaching it to a DOM element. The second way is by attaching it to an existing\
    \ DHTMLX layout or cell.\n\n## Initialization on a DOM element\n\nFirst we will\
    \ attach a toolbar to a DOM element. For these exercises, we will be using the\
    \ same web page as the application. To test attaching a toolbar to a DOM element,\
    \ we must first clear the page and create an element inside the `body` tag. We\
    \ will do this with JavaScript.\n\nType and run the following code line in the\
    \ console:\n\n```\ndocument.body.innerHTML = \"<div id='myToolbarCont'></div>\"\
    ;\n```\n\nWe just cleared the contents of the body and replaced it with a `div`\
    \ tag that has the `id` attribute of `myToolbarCont`.\n\nNext initialize and attach\
    \ a toolbar to that `div`.\n\nType and run the following code line in the developer\
    \ tools console:\n\n```\nnew dhtmlXToolbarObject(\"myToolbarCont\");\n```\n\n\
    The result will show an empty toolbar on the page.\n\n## Initialization on a layout\
    \ object\n\nIn the previous chapter, we created a reference of the returned value\
    \ from the `createLayout` method to the global variable named `appLayout`. We\
    \ will use this to access the layout and its child cells for these next exercises.\n\
    \nFirst refresh the page to clear the previous exercise. Then type and run in\
    \ the developer tools console:\n\n```\nappLayout.attachToolbar();\n```\n\nYou\
    \ will now see the toolbar attached to the overall layout, spanning across both\
    \ cells.\n\n## Initialization on a cell object\n\nNow let's add another toolbar,\
    \ this time to one of the child cells.\n\nType and run the following code line\
    \ in the developer tools console:\n\n```\nappLayout.cells(\"a\").attachToolbar();\n\
    ```\n\nNow you should see an empty toolbar in the left cell of the layout.\n\n\
    DHTMLX does not currently allow more than one toolbar per container. But the same\
    \ effect can be achieved by creating a child layout object inside a cell and attaching\
    \ toolbars to each of those. We will try this now.\n\nFirst refresh the page to\
    \ reset.\n\nNow we will create a child layout. Type and run the following code\
    \ line in the console:\n\n```\nvar childLayout = appLayout.cells(\"a\").attachLayout(\"\
    1C\");\n```\n\nThis adds a nested layout inside one of the cells.\n\nWith this\
    \ additional layout object we can now start adding toolbars to each object.\n\n\
    Type and run the following code line in the console:\n\n```\nappLayout.cells(\"\
    a\").attachToolbar(); // 1st toolbar\nchildLayout.attachToolbar(); // 2nd toolbar\n\
    childLayout.cells(\"a\").hideHeader(); // hide cell header\nchildLayout.cells(\"\
    a\").attachToolbar(); // 3rd toolbar\n```\n\nThere are now three toolbars appearing\
    \ one on top of the other.\n\nNow that we know how to initialize a DHTMLX toolbar,\
    \ we can start adding items.\n\n## Toolbar items\n\nThe DHTMLX toolbar has several\
    \ different item types:\n\n- Button\n- Two-state button (Toggle)\n- Button select\
    \ (Select)\n- Slider\n- Input\n- Text (Label)\n- Separator\n- Spacer\n\nWe will\
    \ now go over each of them and see how they work.\n\nFirst refresh the page to\
    \ clear the previous exercise code.\n\nNow we will add a new toolbar to cell a.\
    \ We will use this toolbar to add the items for the next exercises.\n\nType and\
    \ run the following code line in the console:\n\n```\nvar myToolbar = appLayout.cells(\"\
    a\").attachToolbar();\n```\n\n> When adding items to the toolbar; if the items\
    \ exceed the width of the cell, those items will not be visible. For this exercise,\
    \ make sure you have enough cell width to show all items that will be added."
  mdcn: "\n尝试在单元格对象上使用这些方法。布局对象和单元格对象的进度指示器在样式上有所不同。这些进度指示器可以很容易地用 CSS 来设置样式。\n\n\
    ## 方法概述\n\n我们已经介绍了 DHTMLX 布局和单元格对象更常用的方法，以及我们将用于构建应用程序的方法。DHTMLX 提供了许多高级功能供您探索，例如视图、自动调整大小和停靠/取消停靠。\n\
    \n## 布局事件\n\n在创建应用程序时，JavaScript 中的事件非常有用。DHTMLX 为每个组件提供了许多不同的事件。我们将介绍如何附加和分离其中一个事件，以便了解如何利用它们。\n\
    \n布局对象更常见的事件有 `onResizeFinish`、`onExpand`、`onCollapse` 和 `onDblClick`。让我们看看 `onResizeFinish`。\n\
    \n我们将使用之前章节中创建的布局来附加此事件。\n\n## attachEvent 和 detachEvent\n\nDHTMLX 提供了 `attachEvent`\
    \ 和 `detachEvent` 方法。\n\n附加事件时，第一个参数是要附加的事件名称。第二个是处理程序方法，即事件触发时将执行的方法。\n\n键入并运行以下代码：\n\
    \n```\nvar myEventId = myLayout.attachEvent(\"onResizeFinish\", function(){\n\
    \    console.log(\"Layout Resized\");\n});\n```\n\n现在，如果您调整浏览器窗口的大小，您将在控制台中看到一条条目，显示\
    \ **Layout Resized**。\n\n在大多数情况下，DHTMLX 事件会向处理程序方法传回一些参数。由于这只是告诉我们布局已调整大小，因此它没有传回任何内容。\n\
    \n要分离一个事件，我们使用从 `attachEvent` 方法返回的事件 ID。对于我们刚刚创建的事件，此事件 ID 已分配给 `myEventId` 变量。现在，我们将使用此\
    \ ID 来分离同一个事件。\n\n键入并运行以下代码：\n\n```\nmyLayout.detachEvent(myEventId);\n```\n\n\
    控制台将不再记录来自该事件的文本。\n\n如果您想清除在某个布局对象上创建的所有事件，也可以使用 myLayout.detachAllEvents()，不传递任何参数。\n\
    \n## dhtmlxEvent\n\n与其他 JavaScript 库类似，DHTMLX 也有自己的方法将 HTML DOM 事件附加到 HTML DOM\
    \ 元素。它接受三个参数：第一个是 DOM 元素，第二个是不带 \"on\" 前缀的 HTML DOM 事件名称，最后一个是处理程序。我们将使用此方法在页面加载时加载应用程序的各个部分：\n\
    \n```\ndhtmlxEvent(window, \"load\", function(){\n    // 页面加载时运行的代码\n});\n```\n\
    \nDHTMLX 中所有添加到同一对象相同事件的事件都会被添加到一个内部数组中，并按照添加的顺序触发。\n\n## 应用程序代码\n\n现在我们已经介绍了如何使用\
    \ DHTMLX 的布局组件，是时候为应用程序创建一个布局了。打开 app.js 文件，准备开始编写代码。\n\n## 创建布局\n\n在 app.js 文件的\
    \ config 对象正下方输入以下代码：\n\n```\n// 布局\nvar appLayout;\ndhtmlxEvent(window, \"load\"\
    , function(){\n    appLayout = new dhtmlXLayoutObject(document.body, \"2U\");\n\
    \    appLayout.cells(\"a\").hideHeader();\n    appLayout.cells(\"b\").setText(\"\
    User Chart\");\n});\n```\n\n首先，我们定义了全局变量 `appLayout`，它允许我们在应用程序的其他方法中访问布局。然后我们在页面加载事件中创建布局。当页面加载时，布局将被创建。\n\
    \n刷新页面后，它将如下图所示：\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_53_0.png)\n\n## 总结\n\
    \n在本章中，我们介绍了 DHTMLX 布局组件及其常用方法和事件。然后我们创建了应用程序的主布局。后续章节中的所有内容都将在此布局内或围绕此布局创建。\n\
    \n在下一章中，我们将学习 DHTMLX 工具栏组件，并为应用程序创建一个工具栏。\n\n# 5\nDHTMLX 工具栏\n\n在本章中，我们将学习 DHTMLX\
    \ 工具栏组件及其不同的初始化方式、事件、方法和设置。然后我们将为应用程序添加一个工具栏，使其能够删除和添加用户。\n\n本章中的所有更改都将发生在 app.js\
    \ 文件内部。\n\n## DHTMLX 工具栏\n\nDHTMLX 工具栏是应用程序或网页中非常方便的组件。它使我们能够快速轻松地创建一系列强大的按钮、下拉菜单和输入框。\n\
    \n创建 DHTMLX 工具栏时，我们可以自由地将其放置在 DOM 元素、DHTMLX 布局或 DHTMLX 单元格中。但是，将工具栏附加到 DHTMLX\
    \ 布局或单元格时，每个都限于一个工具栏。以下屏幕截图显示了将工具栏附加到布局对象和单元格对象的区别。\n\n此屏幕截图显示了一个空工具栏以及将其附加到布局对象后的样子：\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_55_0.png)\n\n此屏幕截图显示了附加到单元格对象的工具栏：\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_56_0.png)\n\n## 方法和事件\n\n现在打开 Chrome\
    \ 浏览器，显示开发者工具的控制台，我们将开始学习 DHTMLX 工具栏对象。我们将附加工具栏、添加工具栏项目并绑定事件。\n\n## 初始化选择\n\n\
    DHTMLX 工具栏可以通过两种方式进行初始化。第一种是将其附加到 DOM 元素。第二种是将其附加到现有的 DHTMLX 布局或单元格。\n\n## 在 DOM\
    \ 元素上初始化\n\n首先，我们将工具栏附加到一个 DOM 元素。对于这些练习，我们将使用与应用程序相同的网页。要测试将工具栏附加到 DOM 元素，我们必须首先清除页面并在\
    \ `body` 标签内创建一个元素。我们将用 JavaScript 来完成此操作。\n\n在控制台中键入并运行以下代码行：\n\n```\ndocument.body.innerHTML\
    \ = \"<div id='myToolbarCont'></div>\";\n```\n\n我们刚刚清除了 body 的内容，并用一个 `id` 属性为\
    \ `myToolbarCont` 的 `div` 标签替换它。\n\n接下来，初始化并附加一个工具栏到该 `div`。\n\n在开发者工具控制台中键入并运行以下代码行：\n\
    \n```\nnew dhtmlXToolbarObject(\"myToolbarCont\");\n```\n\n结果将在页面上显示一个空工具栏。\n\n\
    ## 在布局对象上初始化\n\n在上一章中，我们将 `createLayout` 方法返回值的引用赋给了名为 `appLayout` 的全局变量。我们将使用它来访问布局及其子单元格，以进行接下来的练习。\n\
    \n首先刷新页面以清除之前的练习。然后在开发者工具控制台中键入并运行：\n\n```\nappLayout.attachToolbar();\n```\n\n\
    现在您将看到工具栏附加到整个布局上，跨越两个单元格。\n\n## 在单元格对象上初始化\n\n现在让我们添加另一个工具栏，这次是添加到其中一个子单元格。\n\
    \n在开发者工具控制台中键入并运行以下代码行：\n\n```\nappLayout.cells(\"a\").attachToolbar();\n```\n\
    \n现在您应该在布局的左侧单元格中看到一个空工具栏。\n\nDHTMLX 目前不允许每个容器拥有多个工具栏。但是，可以通过在单元格内创建子布局对象并向每个子布局附加工具栏来达到相同的效果。我们现在将尝试此方法。\n\
    \n首先刷新页面以重置。\n\n现在我们将创建一个子布局。在控制台中键入并运行以下代码行：\n\n```\nvar childLayout = appLayout.cells(\"\
    a\").attachLayout(\"1C\");\n```\n\n这会在一个单元格内添加一个嵌套布局。\n\n有了这个额外的布局对象，我们现在可以开始向每个对象添加工具栏了。\n\
    \n在控制台中键入并运行以下代码行：\n\n```\nappLayout.cells(\"a\").attachToolbar(); // 第1个工具栏\n\
    childLayout.attachToolbar(); // 第2个工具栏\nchildLayout.cells(\"a\").hideHeader();\
    \ // 隐藏单元格标题\nchildLayout.cells(\"a\").attachToolbar(); // 第3个工具栏\n```\n\n现在有三个工具栏从上到下依次显示。\n\
    \n既然我们知道如何初始化 DHTMLX 工具栏，我们就可以开始添加项目了。\n\n## 工具栏项目\n\nDHTMLX 工具栏有几种不同的项目类型：\n\n\
    -   按钮\n-   双态按钮（切换）\n-   按钮选择（选择）\n-   滑块\n-   输入框\n-   文本（标签）\n-   分隔符\n-  \
    \ 间隔\n\n我们现在将逐一介绍它们并了解它们如何工作。\n\n首先刷新页面以清除之前的练习代码。\n\n现在我们将在单元格 a 中添加一个新的工具栏。我们将使用此工具栏来添加接下来练习的项目。\n\
    \n在控制台中键入并运行以下代码行：\n\n```\nvar myToolbar = appLayout.cells(\"a\").attachToolbar();\n\
    ```\n\n> 向工具栏添加项目时；如果项目超出单元格的宽度，这些项目将不可见。对于本次练习，请确保您有足够的单元格宽度来显示所有将要添加的项目。\n"
