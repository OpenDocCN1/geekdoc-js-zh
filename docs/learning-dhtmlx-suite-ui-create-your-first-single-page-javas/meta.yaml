    The DHTMLX Form and Calendar


    After you run this, you will see a form in the pop-up window that looks like the
    following screenshot:


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_92_0.png)


    Let''s go over each of these form item types and their attributes. Since we assigned
    a reference of the newly created form to the variable `myForm`, we will use this
    to call some methods.


    # Form items and attributes


    Each item on the form has its own attributes that can be applied. Some are common
    across multiple item types. Here are some of the common attributes available that
    can be applied to most of the form items:


    +   - `className` (string): It adds a CSS class to item

    - `disabled` (Boolean): It disables or enables the item

    - `hidden` (Boolean): It shows or hides the item

    - `tooltip` (string): It sets a tooltip for the item

    - `name` (string): It is the name of the form element'
  - '[PAGE 93]


    # settings


    The first object we have in the array is the `settings` item. This is an optional
    item that allows us to apply properties to all of the other items at once. For
    instance, having to set a width to all of the inputs in a form that has 20 inputs
    would be a little redundant. So, DHTMLX provided the settings object which works
    nicely. Don''t worry the settings can be overridden at the individual item level.


    For this exercise, we will also aligned the labels to the left using `position`
    and set a width to make them appear evenly using `labelWidth`.


    # input


    The `input` type is a normal form input that you would see on any HTML form. The
    attributes we set on the inputs are `inputWidth`, `validate`, `required`, `label`,
    and `name`. The name is how we will later retrieve the value of this input in
    code.


    Notice that there are three input items and one without the name attribute. If
    a `name` is not provided for a form item, DHTMLX generates a unique one for us.
    This does not make it easy to retrieve the values so we will use names in the
    application.


    The `validate` attribute added to an input validates the value of that input on
    a specified rule. Some of the provided validation rules are `ValidSSN`, `ValidNumeric`,
    `Empty`, `NotEmpty`, and `ValidEmail`.


    Another feature of the validate attribute is that a custom validation rule can
    be created. This is done by passing a custom function name or even a regular expression
    as the `validate` property value. Multiple validations can also be applied to
    the same item by using a string with the comma separating the validation, such
    as `NotEmpty` and `ValidNumeric`.


    There is also the `required` property. This does the exact same as the `NotEmpty`
    validation, but also adds an asterisk next to the label automatically. The asterisk
    mark is common practice for web forms to notify the user that those fields are
    required.


    We will test how these validations work shortly.


    # hidden


    The `hidden` type is identical to the HTML input type of hidden. This allows us
    to place values on to a form that are not visible in the UI. We didn''t use it
    in the exercise but we will be using this in the application form.'
  - '[PAGE 94]


    The DHTMLX Form and Calendar


    # checkbox


    The `checkbox` type creates an HTML checkbox with an integer value of 1 or 0.
    We can also add the `required` and `validate` attributes to a checkbox.


    # calendar


    The `calendar` type creates an input and initializes the DHTMLX calendar component
    to it automatically. This form type has some additional properties over the normal
    form elements.


    When creating a calendar, there is the option to format the date for display and
    set if we want time to be enabled using the `dateFormat` form item attribute.
    If you do not set the format it will be set to the default format.


    The value retrieved from a form item that has a calendar component attached is
    a JavaScript date object. This is important to know when saving the value to a
    database or wanting to redisplay it later. We need to convert the JavaScript date
    object to a readable string for storage and retrieval.


    # select


    The `select` type creates an HTML select with the property called `options`, which
    is an array that allows us to add HTML options to the select. We can also add
    the `required` and `validate` attributes to a `select` type. Inside each of the
    options objects, we can set the attribute `selected` to set an option as selected.


    # button


    The `button` item type creates a form button. These buttons allows us to listen
    for the `onButtonClick` form event. The `value` property is what sets the text
    inside the button. We also added a couple more buttons that are inside the block
    item type.


    # block


    DHTMLX provides several form items that assist with the form layout. The `block`
    form item is one of those. This creates a new group of form items that we can
    position together. The one we created contains the buttons and has several attributes,
    like the `width` attribute.


    We added the form items to a block by using the `list` property, which is an array
    of form item objects no different than what we are using outside of the `block`
    item. Inside the `list`, we created the save and cancel buttons in different columns
    with the `newcolumn` item.'
