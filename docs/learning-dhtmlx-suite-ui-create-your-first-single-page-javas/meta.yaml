  md: 'The DHTMLX Layout


    You should see a new three cell layout with a header of a, b, and c.


    Let''s clear that by refreshing the page; and then type and run the following
    code in the console:


    ```

    new dhtmlXLayoutObject(document.body, "3E");

    ```


    The same layout pattern was created because the second parameter for the layout
    constructor is the layout pattern. By default, DHTMLX sets the layout pattern
    3E. You can choose from any of the predefined patterns we spoke of earlier.


    Refresh the page once again so we can add a different layout and learn about accessing
    its cells. This time we need to assign a reference of the layout we create to
    a variable.


    Type the following code in the console:


    ```

    var myLayout = new dhtmlXLayoutObject(document.body, "2U");

    ```


    As you can see we now have two cells. One shows "a" and other shows "b". When
    a layout is first created each child cell''s header will have its cell ID as the
    text. This helps for quick identification. The cell''s ID is how we will access
    that cell''s object and its methods. Let''s access one of the cells and attach
    a child layout component and save a reference to it.


    Type and run the following code:


    ```

    var myChildLayout = myLayout.cells("a").attachLayout("3E");

    ```


    Attaching a layout component through this approach only uses one argument. Again
    this will default to the 3E pattern if an argument is not passed. Anytime a layout
    component is created the method used to create it will return the created layout
    object.


    Each of the cells inside any created layout comes with a header bar that can expand
    or collapse until it is either removed or a child layout component is attached.
    Then the header for that cell is no longer visible.


    # Methods


    Now, we will cover some of the methods available for the layout component and
