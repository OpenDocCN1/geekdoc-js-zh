- md: "## 3 Data Structures, Storage, and Callbacks\n\nIn this chapter, we will explore\
    \ how and where the user information will be stored, retrieved, and triggered\
    \ for updating related data components. We will cover some cool features of HTML5\
    \ that will allow us to write the entire application on the client side. This\
    \ will let us focus more on the user interface and the DHTMLX components, and\
    \ alleviate maintaining a database and server-side code.\n\nWe will add a `storage`\
    \ object to the `storage.js` file and add a `callbacks` object to the `app.js`\
    \ file directly below our `config` object.\n\n> DHTMLX has certain data structures\
    \ for different components. For the grid and chart components, there will be separate\
    \ calls to retrieve and structure the data.\n\n## localStorage\n\nThere has been\
    \ a lot of buzz going around about HTML5 and its capabilities. We will cover one\
    \ of them briefly.\n\nPrior to HTML5 `localStorage`, the only option that client-side\
    \ JavaScript had for storing persistent data across pages was utilizing cookies.\
    \ Cookies are limited in size and do not remain only on the client side; they\
    \ are sent to the server with each request. HTML5 `localStorage` considerably\
    \ increases the storage limit and is strictly stored on the client side.\n\nSome\
    \ of the main reasons for utilizing `localStorage` are caching Ajax-served data,\
    \ common form fields across pages, autocomplete results, or working offline. However,\
    \ it is fairly new and implementation still varies slightly between browsers.\n\
    \nHTML5 `localStorage` allows the client side to store persistent data in key-value\
    \ pairs across multiple browser windows restricted by the same-origin policy.\
    \ The usage is simple. Here are the methods and properties we will be using to\
    \ create the storage for our application:\n\n```\nlocalStorage.setItem(key,value)\
    \ // sets item value\nlocalStorage.getItem(key) // returns item value\nlocalStorage.key(nth)\
    \ // returns key of the enumeration\nlocalStorage.clear() // clears all stored\
    \ values\nlocalStorage.length // returns number of items\n```\n\nThese methods\
    \ and properties are self-explanatory.\n\nOne important thing to know about `localStorage`\
    \ is that the key and value parameters both are stored as DOMStrings. What this\
    \ means to the application is that if an `int` is entered, it will be converted\
    \ to a `string` version of that `int`. If you try to save an `object`, it will\
    \ be returned as \"[object type]\", where type is the object type. So how do we\
    \ store more complex objects into a `localStorage` item? We do so by using the\
    \ `JSON.stringify()` method.\n\nFor the application, we will create JavaScript\
    \ object literals and convert them to strings using the `JSON.stringify()` method\
    \ prior to storing them. Then, upon retrieval, we will convert them back to an\
    \ object using `JSON.parse()`. This is simple and allows us to save objects and\
    \ retrieve object literals to `localStorage`.\n\n## Creating the storage object\n\
    \nNow, we will create the storage object. Find the `storage.js` file that we created,\
    \ which should be empty. We will use the `storage` object to save and retrieve\
    \ the application data.\n\n> Please pay attention to trailing commas when adding\
    \ methods to this JavaScript object. Every method should be followed by a comma.\
    \ The last method is optional.\n\nFirst, we will look at each individual method\
    \ and what each one does. Then we will create the entire object.\n\n## The storage\
    \ methods and properties\n\nThere are two properties we created in the `storage`\
    \ object that are specific for helping it to operate.\n\n### lastStoredId\n\n\
    The first property is the `lastStoredId` property:\n\n`lastStoredId: localStorage.getItem(\"\
    lastStoredId\") ? localStorage.getItem(\"lastStoredId\") : 0,`\n\nThis property\
    \ retains the ID of the last entered item inside `localStorage`. Upon initial\
    \ loading of the page, this property checks the `localStorage` item `lastStoredId`\
    \ for a value. If it has one, that value is assigned to the `storage` object property\
    \ `lastStoredId` property. If not, the `storage` object property `lastStoredId`\
    \ property value defaults to 0.\n\nThis allows `localStorage` to act similarly\
    \ to a database with incrementing primary keys. The storage object method will\
    \ increment this property to create the user's ID when inserting a new user.\n\
    \n### setDateFormat\n\nThe `setDateFormat` method is storage specific. It receives\
    \ a JavaScript date object as its argument and converts it into readable string\
    \ for storage. We will use this to format dates in other storage methods:\n\n\
    ```\nsetDateFormat: function(date){\n    var d = (date.getMonth() + 1);\n    d\
    \ += \"-\"+date.getDate();\n    d += \"-\"+date.getFullYear();\n    return d;\n\
    },\n```\n\n## The user methods\n\nThe user methods will be used to create, update,\
    \ remove, and retrieve user objects from `localStorage`.\n\n## The user model\n\
    \nThe structure of our user model will be pulled directly from the values of the\
    \ DHTMLX form we will be creating. Here is a preview of the data the form will\
    \ contain:\n\n```\n{\n    id: 1, // Int\n    firstName: \"John\", // String\n\
    \    middleInitial: \"J\", // String\n    lastName: \"Smith\", // String\n   \
    \ dob: 1971-01-09T13:00:00.685Z, // Date\n    email: \"john@somedomain.com\",\
    \ // String\n    active: 1 // Int (0,1)\n}\n```\n\n### createUser\n\nThe createUser\
    \ method sets a new item and value into localStorage. This method takes a user\
    \ object as an argument. We will also call one of the callbacks object methods,\
    \ dataChanged. This will be covered when creating the callbacks object.\n\n```\n\
    createUser: function(user){\n    localStorage.setItem(\"lastStoredId\", ++storage.lastStoredId);\n\
    \    user.id = storage.lastStoredId;\n    user.dob = storage.setDateFormat(user.dob);\n\
    \    localStorage.setItem(user.id, JSON.stringify(user));\n    callbacks.dataChanged();\n\
    },\n```\n\n#### The user parameter\n\nThis is the user object that will be retrieved\
    \ from the DHTMLX form. Normally, one would create a user model to define the\
    \ structure, but since our form will be driving all data changes for the user,\
    \ it is safe to pull our data user model from the form.\n\nWhen creating a user,\
    \ there is no ID yet. That is where the lastStoredId comes in. We will set lastStoredId\
    \ incrementally and then assign this as the user ID for storage. We then look\
    \ at any form fields that a calendar is attached to. Since the calendar returns\
    \ a JavaScript date object, it needs to be converted to a readable format. The\
    \ **dob** field is the only field in the application form that has a calendar\
    \ attached.\n\nAfter the date field is formatted and the ID is created, the user\
    \ object is saved to the localStorage. The ID is used for the localStorage key\
    \ and the stringified version of the user object is used as the value.\n\n###\
    \ getUser\n\nThe getUser method retrieves the user object as a string from localStorage\
    \ and then parses the string into an object:\n\n```\ngetUser: function(id){\n\
    \    var user = localStorage.getItem(id);\n    return (user)?JSON.parse(user):false;\n\
    },\n```\n\n### updateUser\n\nThe updateUser method edits a user object by its\
    \ ID:\n\n```\nupdateUser: function(user){\n    user.dob = storage.setDateFormat(user.dob);\n\
    \    localStorage.setItem(user.id, JSON.stringify(user));\n    callbacks.dataChanged();\n\
    },\n```\n\n### removeUser\n\nThe `removeUser` method is the simplest method of\
    \ them all. It removes a user object from `localStorage` by the user ID:\n\n```\n\
    removeUser: function(id) {\n    localStorage.removeItem(id);\n    callbacks.dataChanged();\n\
    },\n```\n\n## The grid methods\n\nThe DHTMLX grid has a specific structure when\
    \ loading data. It allows the use of several different data formats. This application\
    \ will be using a JSON format. Be attentive to create the data structure as specified\
    \ or the data will not load.\n\n### The grid JSON data structure\n\nThe next block\
    \ of code is an example of how the data is structured. Studying this will help\
    \ you understand why and how we created the grid methods:\n\n```\ndata = {\n \
    \   \"rows\": [\n        {\n            \"id\":1,\n            \"data\":[\"col1\"\
    ,\"col2\",\"col3\",\"col4\",\"etc\"]\n        },\n        {\n            \"id\"\
    :2,\n            \"data\":[\"col1\",\"col2\",\"col3\",\"col4\",\"etc\"]\n    \
    \    }\n    ],\n    \"total_count\": 2\n}\n```\n\nThe object we load into the\
    \ grid has a rows array which contains an object for each of the user rows. The\
    \ ID needs to be unique or the grid will not operate correctly.\n\nEach individual\
    \ object in the rows array has a property named `data`. This is an array of data\
    \ for each column. The placement in the array corresponds to the column it will\
    \ show in."
  mdcn: "\n## 3 数据结构、存储与回调\n\n本章将探讨用户信息的存储、检索以及如何触发更新相关数据组件。我们将介绍一些 HTML5 的酷炫特性，这些特性使我们能够将整个应用程序编写在客户端。这让我们能更专注于用户界面和\
    \ DHTMLX 组件，同时减轻维护数据库和服务器端代码的负担。\n\n我们将在 `storage.js` 文件中添加一个 `storage` 对象，并在\
    \ `app.js` 文件的 `config` 对象正下方添加一个 `callbacks` 对象。\n\n> DHTMLX 为不同的组件定义了特定的数据结构。对于表格和图表组件，会有单独的调用以检索和构建数据。\n\
    \n## localStorage\n\n关于 HTML5 及其能力，坊间一直有很多讨论。我们将简要介绍其中一项。\n\n在 HTML5 的 `localStorage`\
    \ 出现之前，客户端 JavaScript 跨页面持久化数据的唯一选择是使用 Cookie。Cookie 有大小限制，且并非仅存在于客户端；它们会随每个请求发送到服务器。HTML5\
    \ 的 `localStorage` 显著提高了存储限制，并且严格存储在客户端。\n\n使用 `localStorage` 的主要原因包括：缓存 Ajax\
    \ 服务数据、跨页面的通用表单字段、自动完成结果，或者实现离线工作。然而，它相对较新，不同浏览器的实现仍有细微差异。\n\nHTML5 的 `localStorage`\
    \ 允许客户端在受同源策略限制的多个浏览器窗口之间，以键值对的形式存储持久化数据。其用法很简单。以下是我们将用于为应用程序创建存储的方法和属性：\n\n```\n\
    localStorage.setItem(key,value) // 设置项目值\nlocalStorage.getItem(key) // 返回项目值\n\
    localStorage.key(nth) // 返回枚举的键\nlocalStorage.clear() // 清除所有存储的值\nlocalStorage.length\
    \ // 返回项目数量\n```\n\n这些方法和属性不言自明。\n\n关于 `localStorage`，有一个重要的点需要了解：键和值参数都作为 DOMStrings\
    \ 存储。这意味着对于应用程序而言，如果输入一个 `int`，它将被转换为该 `int` 的 `string` 版本。如果您尝试保存一个 `object`，它将返回为\
    \ \"[object type]\"，其中 type 是对象类型。那么，我们如何将更复杂的对象存储到 `localStorage` 项中呢？我们使用 `JSON.stringify()`\
    \ 方法来实现。\n\n对于应用程序，我们将在存储之前，使用 `JSON.stringify()` 方法将 JavaScript 对象字面量转换为字符串。然后，在检索时，我们将使用\
    \ `JSON.parse()` 将它们转换回对象。这很简单，允许我们将对象保存到 `localStorage` 并检索对象字面量。\n\n## 创建 storage\
    \ 对象\n\n现在，我们将创建 storage 对象。找到我们创建的 `storage.js` 文件，它应该是空的。我们将使用 `storage` 对象来保存和检索应用程序数据。\n\
    \n> 请注意在向此 JavaScript 对象添加方法时使用尾随逗号。每个方法后都应跟一个逗号。最后一个方法是可选的。\n\n首先，我们将看看每个单独的方法及其功能。然后我们将创建整个对象。\n\
    \n## storage 方法和属性\n\n我们在 `storage` 对象中创建了两个特定的属性以帮助其运作。\n\n### lastStoredId\n\
    \n第一个属性是 `lastStoredId` 属性：\n\n`lastStoredId: localStorage.getItem(\"lastStoredId\"\
    ) ? localStorage.getItem(\"lastStoredId\") : 0,`\n\n此属性保留 `localStorage` 中最后输入项目的\
    \ ID。页面首次加载时，此属性会检查 `localStorage` 项目 `lastStoredId` 是否有值。如果有，则将该值分配给 `storage`\
    \ 对象的 `lastStoredId` 属性。如果没有，则 `storage` 对象的 `lastStoredId` 属性值默认为 0。\n\n这使得 `storage`\
    \ 能够像具有递增主键的数据库一样运作。当插入新用户时，storage 对象方法将递增此属性以创建用户的 ID。\n\n### setDateFormat\n\
    \n`setDateFormat` 方法是存储特定的。它接收一个 JavaScript 日期对象作为参数，并将其转换为可读的字符串进行存储。我们将在其他存储方法中使用它来格式化日期：\n\
    \n```\nsetDateFormat: function(date){\n    var d = (date.getMonth() + 1);\n  \
    \  d += \"-\"+date.getDate();\n    d += \"-\"+date.getFullYear();\n    return\
    \ d;\n},\n```\n\n## 用户方法\n\n用户方法将用于在 `localStorage` 中创建、更新、删除和检索用户对象。\n\n## 用户模型\n\
    \n我们用户模型的结构将直接取自我们将要创建的 DHTMLX 表单的值。以下是表单将包含的数据预览：\n\n```\n{\n    id: 1, // 整数\n\
    \    firstName: \"John\", // 字符串\n    middleInitial: \"J\", // 字符串\n    lastName:\
    \ \"Smith\", // 字符串\n    dob: 1971-01-09T13:00:00.685Z, // 日期\n    email: \"john@somedomain.com\"\
    , // 字符串\n    active: 1 // 整数 (0,1)\n}\n```\n\n### createUser\n\ncreateUser 方法在\
    \ localStorage 中设置一个新的项目和值。此方法接收一个用户对象作为参数。我们还将调用 callbacks 对象的一个方法，dataChanged。这将在创建\
    \ callbacks 对象时介绍。\n\n```\ncreateUser: function(user){\n    localStorage.setItem(\"\
    lastStoredId\", ++storage.lastStoredId);\n    user.id = storage.lastStoredId;\n\
    \    user.dob = storage.setDateFormat(user.dob);\n    localStorage.setItem(user.id,\
    \ JSON.stringify(user));\n    callbacks.dataChanged();\n},\n```\n\n#### user 参数\n\
    \n这是将从 DHTMLX 表单检索的用户对象。通常，人们会创建一个用户模型来定义结构，但由于我们的表单将驱动用户的所有数据更改，因此可以安全地从表单提取我们的用户数据模型。\n\
    \n创建用户时，还没有 ID。这就是 lastStoredId 的用武之地。我们将递增设置 lastStoredId，然后将其分配为存储的用户 ID。然后，我们查看任何附加了日历的表单字段。由于日历返回一个\
    \ JavaScript 日期对象，因此需要将其转换为可读格式。**dob** 字段是应用程序表单中唯一一个附加了日历的字段。\n\n日期字段格式化并创建\
    \ ID 后，用户对象将保存到 localStorage。ID 用作 localStorage 的键，用户对象的字符串化版本用作值。\n\n### getUser\n\
    \ngetUser 方法从 localStorage 以字符串形式检索用户对象，然后将字符串解析为对象：\n\n```\ngetUser: function(id){\n\
    \    var user = localStorage.getItem(id);\n    return (user)?JSON.parse(user):false;\n\
    },\n```\n\n### updateUser\n\nupdateUser 方法通过 ID 编辑用户对象：\n\n```\nupdateUser: function(user){\n\
    \    user.dob = storage.setDateFormat(user.dob);\n    localStorage.setItem(user.id,\
    \ JSON.stringify(user));\n    callbacks.dataChanged();\n},\n```\n\n### removeUser\n\
    \n`removeUser` 方法是所有方法中最简单的一个。它通过用户 ID 从 `localStorage` 中移除用户对象：\n\n```\nremoveUser:\
    \ function(id) {\n    localStorage.removeItem(id);\n    callbacks.dataChanged();\n\
    },\n```\n\n## 表格方法\n\nDHTMLX 表格在加载数据时有特定的结构。它允许使用多种不同的数据格式。本应用程序将使用 JSON 格式。请注意按照指定创建数据结构，否则数据将无法加载。\n\
    \n### 表格的 JSON 数据结构\n\n以下代码块是数据结构的示例。研究此内容将帮助您理解我们为何以及如何创建表格方法：\n\n```\ndata =\
    \ {\n    \"rows\": [\n        {\n            \"id\":1,\n            \"data\":[\"\
    col1\",\"col2\",\"col3\",\"col4\",\"etc\"]\n        },\n        {\n          \
    \  \"id\":2,\n            \"data\":[\"col1\",\"col2\",\"col3\",\"col4\",\"etc\"\
    ]\n        }\n    ],\n    \"total_count\": 2\n}\n```\n\n我们加载到表格中的对象有一个 rows 数组，其中包含每个用户行的一个对象。ID\
    \ 必须是唯一的，否则表格将无法正常运行。\n\nrows 数组中的每个单独对象都有一个名为 `data` 的属性。这是每一列的数据数组。数组中的位置对应于它将显示的列。\n"
