    \ 1221013\n\nPublished by Packt Publishing Ltd.\nLivery Place\n35 Livery Street\n\
    Birmingham B3 2PB, UK.\n\nISBN 978-1-84969-933-4\n\nwww.packtpub.com\n\nCover\
    \ Image by Eli Geske (ejgeske@yahoo.com)\n\nwww.allitebooks.com\n\n## Credits\n\
    \n**Author**\nEli Geske\n\n**Project Coordinator**\nAmey Sawant\n\n**Reviewers**\n\
    Asen Bozhilov\nAli Farhadi\nEd Wildgoose\n\n**Proofreader**\nLauren Harkins\n\n\
    **Acquisition Editor**\nKartikey Pandey\nJulian Ursell\n\n**Indexer**\nHemangini\
    \ Bari\n\n**Graphics**\nRonak Dhruv\n\n**Commissioning Editor**\nGovindan K\n\n\
    **Production Coordinator**\nKyle Albuquerque\n\n**Technical Editors**\nDipika\
    \ Gaonkar\nMrunmayee Patil\n\n**Cover Work**\nKyle Albuquerque\n\n## About the\
    \ Author\n\n**Eli Geske** is an entrepreneurial graphics designer turned programmer.\
    \ He has been involved in web applications from creating and enhancing online\
    \ gaming communities, to building applications that improve company's efficiency.\
    \ He has also invented products, put in for patents, and pushed them to market.\
    \ His programming skills range from JavaScript, PHP, and C# which he uses in the\
    \ medical industry, payment processing industry, and on custom order management\
    \ sites. He also has a degree in computer science, focusing on networking and\
    \ web server administration.\n\nHis knowledge of DHTMLX springs from his daily\
    \ engagements in a current large scale medical application.\n\nSome other of Eli's\
    \ writings and public offerings can be viewed on his blog www.eligeske.com or\
    \ on eligeske.github.com.\n\n> Throughout the past couple of years, my daily involvement\
    \ with the DHTMLX components Suite has included working with a wonderful development\
    \ team locally and abroad. These people have given me the ability to expand my\
    \ knowledge and learn new things. I'd like to send out thanks to Igor Lopez, Bruno\
    \ Spinelli, Tengiz Tutisani, Jaya Uradhanda, Sergey Bilida, Dmitry Shumarov, and\
    \ Sergio Reyes who are a part of that great team! I would also like to thank,\
    \ Roberto and Victor Beraja, whose visions have stretched the DHTMLX library to\
    \ its limits on more than one occasion. Cheers!\n\n## About the Reviewers\n\n\
    **Asen Bozhilov** is web developer with years of experience in web technologies.\
    \ Currently, he is working on XULRunner applications using JavaScript and XUL.\
    \ He has a bachelor's degree in computer science. In his spare time, he likes\
    \ to experiment with new technologies and programming languages. His interests\
    \ are mostly in the computer sciences, but he also enjoys sport activities.\n\n\
    He has reviewed other JavaScript books, such as *Maintainable JavaScript*, *JavaScript\
    \ Patterns*, and *JavaScript for PHP developers*.\n\n**Ali Farhadi** is a senior\
    \ web developer and system administrator living in Mashhad, Iran. He is passionate\
    \ about working on open source technology and has contributed to the major PHP\
    \ frameworks, CakePHP, and Lithium.\n\nHe is also one of the pioneers in the Persian\
    \ node.js community and has contributed to the core project since 2009. He has\
    \ also authored a few open source projects notably the HTML5Sortable jQuery plugin\
    \ and SMPP module for node.js.\n\nYou can read more about him and his works at\
    \ his website `http://farhadi.ir`.\n\n**Ed Wildgoose** grew up in the time when\
    \ a ZX81 was cutting edge and spent his formative years slaving away in the finance\
    \ world, before deciding that the way ahead was to start slaving away for even\
    \ longer hours and less money as his own boss. He enjoys learning about the art\
    \ of IT for its own sake and has played with most common (and uncommon) programming\
    \ languages and tools over the years (Did anyone else enjoy using Haskell in the\
    \ early 90s?). He has developed projects on Mac, Windows, and Linux over past\
    \ years, but most currently favors Linux for backend servers and Mac on the desktop.\n\
    \nHe currently owns MailASail (http://mailasail.com), a boutique, which supplies\
    \ services for users with satellite phones and roaming cellular devices. MailASail\
    \ is a leading supplier of satellite hardware and airtime, but specialize in offering\
    \ in-house solutions, which optimize TCP data over the expensive satellite links,\
    \ that is, you can grab your iPhone and read your email from the middle of an\
    \ ocean, desert, or glacier, for a very affordable cost! Their customers range\
    \ from BBC nature documentary creators through to ocean rowers.\n\n> I would like\
    \ to thank my wife Sue, and, my children, Katie and Luke, for putting up without\
    \ their father while he spent far too long working.\n\n## www.PacktPub.com\n\n\
    ### Support files, eBooks, discount offers, and more\n\nYou might want to visit\
    \ www.PacktPub.com for support files and downloads related to your book.\n\nDid\
    \ you know that Packt offers eBook versions of every book published, with PDF\
    \ and ePub files available? You can upgrade to the eBook version at www.PacktPub.com,\
    \ and as a print book customer, you are entitled to a discount on the eBook copy.\
    \ Get in touch with us at service@packtpub.com for more details.\n\nAt www.PacktPub.com,\
    \ you can also read a collection of free technical articles, sign up for a range\
    \ of free newsletters and receive exclusive discounts and offers on Packt books\
    \ and eBooks.\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_7_0.png)\n\nhttp://PacktLib.PacktPub.com\n\
    \nDo you need instant solutions to your IT questions? PacktLib is Packt's online\
    \ digital book library. Here, you can access, read and search across Packt's entire\
    \ library of books.\n\n### Why Subscribe?\n\n- Fully searchable across every book\
    \ published by Packt\n- Copy and paste, print and bookmark content\n- On demand\
    \ and accessible via web browser\n\n### Free Access for Packt account holders\n\
    \nIf you have an account with Packt at www.PacktPub.com, you can use this to access\
    \ PacktLib today and view nine entirely free books. Simply use your login credentials\
    \ for immediate access.\n\n## Table of Contents\n\n- **Preface** ........................................................................................................\
    \ 1\n- **Chapter 1: User Management Web App** ................................................................\
    \ 7\n  - **About DHTMLX** ......................................................................................\
    \ 7\n    - DHTMLX and other component libraries ...................................................\
