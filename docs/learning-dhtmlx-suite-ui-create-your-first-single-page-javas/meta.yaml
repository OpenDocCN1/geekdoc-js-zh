    You will now see the grid columns just below the toolbar.


    # # Grid methods


    Now let''s go over some available grid methods. Then we can add rows and call
    events on this grid.


    For these exercises we will be using the global `appLayout` variable.


    Refresh the page.


    # # attachGrid


    We will begin by creating a grid to a cell.


    The `attachGrid` method creates and attaches a grid object to a cell. This is
    the first step in creating a grid.


    Type and run the following code line in the console:


    ```

    var myGrid = appLayout.cells("a").attachGrid();

    ```


    # # setImagePath


    The `setImagePath` method allows the grid to know where we have the images placed
