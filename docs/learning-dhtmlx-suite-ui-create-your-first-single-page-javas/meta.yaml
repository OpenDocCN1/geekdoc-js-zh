  - '[PAGE 81]


    Three new pop-up windows were created in the page. Each of these pop-up windows
    can be moved around freely within the browser window similar to a desktop window.


    Next we will create the windows through provided methods.


    # Create windows through methods


    First we will create a new `dhtmlXWindows` method and then apply its settings.


    Refresh the page. Type and run the following code in the console:


    Now we have a base object available to start the exercises that will create the
    individual pop-up windows.


    ```

    var myWindows = new dhtmlXWindows();

    myWindows.setImagePath(config.imagePath);

    ```


    # Methods


    Each individual pop-up window acts as a container. This means they can have other
    components attached to them. This is a nice feature. Using the pop-up window''s
    methods, we can create and attach components like a form, grid, chart, layout,
    and more.


    Now let''s create a pop-up window.


    # createWindow (base object method)


    The parameters for this method are ID, x position, y position, width, and height.
    Note that we will pass null for the position variables, as they are not required
    unless a screen position is desired.


    Type and run the following code in the console:


    We have just created a new pop-up window and assigned a reference to the `myPopup`
    variable. Using this, we will apply some of the available settings and methods.


    ```

    var myPopup = myWindows.createWindow("w1", null, null, 200, 200);

    ```


    # setDimension


    The `setDimension` sets the height and width of a pop-up window in pixels.


    Type and run the following code in the console:


    ```

    myPopup.setDimension(300,300);

    ```'
  - '[PAGE 82]


    The DHTMLX Window


    # denyResize


    When a pop-up window is first created, the borders can be used to resize the window
    manually. The `denyResize` method disables this feature.


    Type and run the following code in the console:


    ```

    myPopup.denyResize();

    ```


    This method also disables the maximize button on the pop-up window''s toolbar.
    The `allowResize` method turns that feature back on.


    # centerOnScreen


    The `centerOnScreen` method takes out any guess work of positioning a pop-up window.
    This method positions the pop-up window in the center of the page.


    Type and run the following code in the console:


    ```

    myPopup.centerOnScreen();

    ```


    Now the pop-up window is centered.


    # setModal


    The `setModal` method creates an overlay that covers the background application
    on the page. This is quite useful when restricting access to functionality other
    than the active pop-up window.


    Type and run the following code in the console:


    ```

    myPopup.setModal(true);

    ```


    When the pop-up window is closed, the modal is also removed. But for the next,
    `hide` method, this does not occur. The modal remains even though the pop-up window
    is not visible.


    # hide


    The `hide` method hides the pop-up window leaving its state the same as before
    it was hidden.


    Type and run the following code in the console:


    ```

    myPopup.hide();

    ```


    The pop-up window is no longer on the screen, yet we still have the modal left
    over from our `setModal` method. Let''s turn that off.


    Type and run the following code in the console:


    ```

    myPopup.setModal(false);

    ```'
  - '[PAGE 83]


    # show


    The `show` method does the opposite of our `hide` method. It shows the pop-up
    window once again.


    Type and run the following code in the console:


    ```

    myPopup.show();

    ```


    It is visible again, right where we left it.


    # setText


    The `setText` method allows us to change the title on the pop-up window.


    Type and run the following code in the console:


    ```

    myPopup.setText("My Popup Window!");

    ```


    # hideHeader


    The `hideHeader` method allows us to hide the title bar all together.


    Type and run the following code in the console:


    ```

    myPopup.hideHeader();

    ```


    # showHeader


    The `showHeader` method does the reverse of `hideHeader`.


    Type and run the following code in the console:


    ```

    myPopup.showHeader();

    ```


    We touched on some of the basic methods for the pop-up window and all of the necessary
    ones for the application.


    # Events


    With the DHTMLX window component, you can attach one event to all of the pop-up
    windows created from the same base object. This is achieved by attaching the event
    to the base object. You can also attach an event to each individual pop-up window.


    We will be using the `onClose` event for the application. Let''s do a quick exercise
    using this event.'
  - "[PAGE 84]\n\n# onClose\n\nThe `onClose` event triggers just before the pop-up\
    \ window closes. This allows us some freedom to manipulate something prior to\
    \ it actually closing. It can also be used to prevent it from closing.\n\nWhen\
    \ the `onClose` event is attached to a pop-up window, we must return a `true`\
    \ value from the handler we provide or it will not close.\n\nType and run the\
    \ following code in the console:\n\n```\nmyPopup.attachEvent(\"onClose\",function(){\n\
    \    console.log(\"close clicked\");\n});\n```\n\nNow try to close the pop-up\
    \ window with the close button. The event is fired and the text is logged in the\
    \ console but the popup does not close.\n\nType and run the following code in\
    \ the console:\n\n```\nmyPopup.detachAllEvents();\nmyPopup.attachEvent(\"onClose\"\
    ,function(){\n    console.log(\"close clicked again\");\n    return true;\n});\n\
    ```\n\nWe detached the previously added event, then added a new event that returns\
    \ true allowing the event to complete.\n\nNext we will create the pop-up window\
    \ for the application.\n\n# The application code\n\nThe application code for this\
    \ chapter will create a pop-up window that will open when a grid row is double-clicked\
    \ or when the when the **add** button on the toolbar is pressed. Once the pop-up\
    \ window is created we do not want to recreate it again; so we will only hide\
    \ and show it. To prevent the pop-up window from closing when the close button\
    \ is pressed we will use the `onClose` event we discussed in the previous section."
