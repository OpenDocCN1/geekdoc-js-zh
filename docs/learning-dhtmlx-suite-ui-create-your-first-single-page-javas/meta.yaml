- md: '## jQuery 1.4 Reference Guide


    ISBN: 978-1-84951-004-2 Paperback: 336 pages


    A comprehensive exploration of the popular JavaScript library


    1. Quickly look up features of the jQuery library

    2. Step through each function, method, and selector expression in the jQuery library
    with an easy-to-follow approach

    3. Understand the anatomy of a jQuery script

    4. Write your own plug-ins using jQuery''s powerful plug-in architecture


    ## jQuery UI 1.8: The User Interface Library for jQuery


    ISBN: 978-1-84951-652-5 Paperback: 424 pages


    Build highly interactive web applications with ready-to-use widgets from the jQuery
    User Interface Library


    1. Packed with examples and clear explanations of how to easily design elegant
    and powerful front-end interfaces for your web applications

    2. A section covering the widget factory including an in-depth example on how
    to build a custom jQuery UI widget

    3. Updated code with significant changes and fixes to the previous edition


    Please check www.PacktPub.com for information on our titles


    ## Responsive Web Design with HTML5 and CSS3


    ISBN: 978-1-84969-318-9 Paperback: 324 pages


    Learn responsive design using HTML5 and CSS3 to adapt websites to any browser
    or screen size


    1. Everything needed to code websites in HTML5 and CSS3 that are responsive to
    every device or screen size

    2. Learn the main new features of HTML5 and use CSS3''s stunning new capabilities
    including animations, transitions and transformations

    3. Real world examples show how to progressively enhance a responsive design while
    providing fall backs for older browsers


    ## HTML5 Canvas Cookbook


    ISBN: 978-1-84969-136-9 Paperback: 348 pages


    Over 80 recipes to revolutionize the web experience with HTML5 Canvas


    1. The quickest way to get up to speed with HTML5 Canvas application and game
    development

    2. Create stunning 3D visualizations and games without Flash

    3. Written in a modern, unobtrusive, and objected oriented JavaScript style so
    that the code can be reused in your own applications


    Please check www.PacktPub.com for information on our titles'
