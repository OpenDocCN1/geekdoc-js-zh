  md: 'The DHTMLX Grid


    # setHeader


    The `setHeader` method sets the column headers and determines how many headers
    we will have. The argument is a JavaScript array.


    Type and run the following code line in the console:


    ```

    myGrid.setHeader(["Column1", "Column2", "Column3"]);

    ```


    # setInitWidths


    The `setInitWidths` method will set the initial widths of each of the columns.
    The asterisk mark (*) is used to set the width automatically.


    Type and run the following code line in the console:


    ```

    myGrid.setInitWidths("125,95,*");

    ```


    # setColAlign


    The `setColAlign` method allows us to align the column''s content position.


    Type and run the following code line in the console:


    ```

    myGrid.setColAlign("right,center,left");

    ```


    # init


    Up until this point, we haven''t seen much going on. It was all happening behind
    the scenes. To see these changes the grid must be initialized.


    Type and run the following code line in the console:


    ```

    myGrid.init();

    ```


    Now you see the columns that we provided.


    # addRow


    Now that we have a grid created let''s add a couple rows and start interacting.


    The `addRow` method adds a row to the grid. The parameters are ID and columns.


    Type and run the following code in the console:


    ```

    myGrid.addRow(1, ["test1", "test2", "test3"]);

    myGrid.addRow(2, ["test1", "test2", "test3"]);

    ```


    We just created two rows inside the grid.'
