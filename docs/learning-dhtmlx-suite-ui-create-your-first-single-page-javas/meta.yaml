  md: '# 10

    The Finish Line


    Welcome to the finish line! The application is now complete. With these newly
    perfected skills, we are ready to set forth into the world and use DHTMLX components
    on everything! Ok, that statement may have been a little overboard, but we do
    have a greater understanding of the library and should feel extremely comfortable
    in applying it.


    In this chapter, we will go over some of the issues we may have experienced in
    the creation of the application. We will also talk about some additional things
