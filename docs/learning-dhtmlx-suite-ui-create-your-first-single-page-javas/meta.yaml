  md: '# addButton


    The `addButton` method adds a button to a toolbar. Buttons are a clickable item
    that can have text and an icon.


    The parameters are the ID of the button, its position in the toolbar, the button
    text, an enabled icon (optional), and lastly a disabled icon (optional).


    Type and run the following code line in the console:


    ```

    myToolbar.addButton("myButtonId", 0, "My Button");

    ```


    Now, there is a button added to the toolbar with the text of `My Button`.


    # addButtonTwoState


    The `addButtonTwoState` method creates a toggle button, which keeps a Boolean
    state. This method has the same parameters as the `addButton` method. When this
    item is clicked, it fires the toolbar''s `onStateChange` event.


    Type and run the following code line in the console:


    ```

    myToolbar.addButtonTwoState("myButton2StateId", 1, "2 State");

    ```


    Now there is a new item on the toolbar with the text of **2 State**. When this
    new item is clicked, it will toggle between active and inactive.


    # getItemState


    The `getItemState` method is used to retrieve the pressed state for the **two-state**
    button and returns a Boolean.


    Type and run the following code line in the console:


    ```

    myToolbar.getItemState("myButton2StateId");

    ```


    This returns either `true` or `false` in the console.


    # addSeparator


    The `addSeparator` method creates a vertical line to show a division between the
    toolbar items. The only parameters are ID and position.


    Type and run the following code line in the console:


    ```

    myToolbar.addSeparator("sepId", 2);

    ```


    Now there is a separator line to the right of the **two-state** button.'
