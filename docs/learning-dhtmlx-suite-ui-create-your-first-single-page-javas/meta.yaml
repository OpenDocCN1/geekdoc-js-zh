  md: "Try these methods on a cell object. There is a styling difference in the progress\
    \ indicators for a layout object and cell object. These progress indicators can\
    \ be easily styled with CSS.\n\n# Overview of methods\n\nWe covered the more commonly\
    \ used methods for the DHTMLX layout and cell objects and the ones we will use\
    \ in building the application. DHTMLX provides many advanced features you can\
    \ explore like views, auto sizing, and docking/undocking.\n\n# Layout events\n\
    \nEvents in JavaScript are very useful when creating applications. DHTMLX has\
    \ provided many different events for each of the components. We will go over how\
    \ to attach and detach one of the events to give us an idea of how we can utilize\
    \ them.\n\nThe more common events for the layout object are `onResizeFinish`,\
    \ `onExpand`, `onCollapse`, and `onDblClick`. Let's take a look at `onResizeFinish`.\n\
    \nWe will use the same layout we created in previous sections to attach this event.\n\
    \n# attachEvent and detachEvent\n\nDHTMLX provides the `attachEvent` and `detachEvent`\
    \ methods.\n\nThe first parameter when attaching an event is the name of the event\
    \ you want to attach. The second is a handler method, which is the method that\
    \ will fire when the event triggers.\n\nType and run the following code:\n\n```\n\
    var myEventId = myLayout.attachEvent(\"onResizeFinish\", function(){\n    console.log(\"\
    Layout Resized\");\n});\n```\n\nNow if you resize the browser window you will\
    \ see a console entry stating **Layout Resized**.\n\nIn most cases the DHTMLX\
    \ event will pass some parameters back to the handler method. Since this is just\
    \ telling us the layout has been resized it passes nothing back.\n\nTo detach\
    \ an event we use the returned event ID from the `attachEvent` method. For the\
    \ event we just created, this event ID was assigned to the `myEventId` variable.\
    \ Now, we will use this to detach that same event."
