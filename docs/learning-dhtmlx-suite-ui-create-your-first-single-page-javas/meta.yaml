  md: 'Type and run the following code line in the developer tools console:


    ```

    new dhtmlXToolbarObject("myToolbarCont");

    ```


    The result will show an empty toolbar on the page.


    # Initialization on a layout object


    In the previous chapter, we created a reference of the returned value from the
    `createLayout` method to the global variable named `appLayout`. We will use this
    to access the layout and its child cells for these next exercises.


    First refresh the page to clear the previous exercise. Then type and run in the
    developer tools console:


    ```

    appLayout.attachToolbar();

    ```


    You will now see the toolbar attached to the overall layout, spanning across both
    cells.


    # Initialization on a cell object


    Now let''s add another toolbar, this time to one of the child cells.


    Type and run the following code line in the developer tools console:


    ```

    appLayout.cells("a").attachToolbar();

    ```


    Now you should see an empty toolbar in the left cell of the layout.


    DHTMLX does not currently allow more than one toolbar per container. But the same
    effect can be achieved by creating a child layout object inside a cell and attaching
    toolbars to each of those. We will try this now.


    First refresh the page to reset.


    Now we will create a child layout. Type and run the following code line in the
    console:


    ```

    var childLayout = appLayout.cells("a").attachLayout("1C");

    ```


    This adds a nested layout inside one of the cells.


    With this additional layout object we can now start adding toolbars to each object.'
