    \   dataChanged: function(){\n\n    }\n}\n```\n\n这个对象是保持所有应用组件中数据同步的粘合剂。在接下来的每一章中，我们将向这个对象添加内容。\n\
    \n*数据结构、存储与回调*\n\n## 总结\n\n本章涵盖了很多内容。我们创建了 `storage` 对象，它是整个应用的数据访问层。然后，我们创建了\
