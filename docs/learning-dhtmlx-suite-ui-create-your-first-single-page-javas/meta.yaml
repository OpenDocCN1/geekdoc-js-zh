    \n首次出版：2013 年 10 月\n\n生产参考号：1221013\n\n由 Packt Publishing Ltd. 出版。\nLivery Place\n\
    35 Livery Street\nBirmingham B3 2PB, UK.\n\nISBN 978-1-84969-933-4\n\nwww.packtpub.com\n\
    \n封面图片由 Eli Geske (ejgeske@yahoo.com) 提供\n\nwww.allitebooks.com\n\n## 致谢\n\n**作者**\n\
    Eli Geske\n\n**项目协调员**\nAmey Sawant\n\n**审阅者**\nAsen Bozhilov\nAli Farhadi\nEd\
    \ Wildgoose\n\n**校对员**\nLauren Harkins\n\n**组稿编辑**\nKartikey Pandey\nJulian Ursell\n\
    \n**索引员**\nHemangini Bari\n\n**图形设计**\nRonak Dhruv\n\n**组稿编辑**\nGovindan K\n\n\
    **制作协调员**\nKyle Albuquerque\n\n**技术编辑**\nDipika Gaonkar\nMrunmayee Patil\n\n**封面设计**\n\
    Kyle Albuquerque\n\n## 关于作者\n\n**Eli Geske** 是一位从图形设计师转型的企业家型程序员。他参与过各种网络应用项目，从创建和增强在线游戏社区，到构建提高公司效率的应用程序。他还发明过产品，申请过专利，并将其推向市场。他的编程技能涵盖\
    \ JavaScript、PHP 和 C#，应用于医疗行业、支付处理行业以及定制订单管理网站。他还拥有计算机科学学位，专注于网络和 Web 服务器管理。\n\
    \n他对 DHTMLX 的了解源于他日常参与的大型医疗应用程序开发工作。\n\nEli 的其他一些著作和公开内容可以在他的博客 www.eligeske.com\
    \ 或 eligeske.github.com 上查看。\n\n> 在过去的几年里，我日常参与 DHTMLX 组件套件的工作，包括与国内外优秀的开发团队合作。这些人让我能够扩展知识并学习新事物。我要向\
    \ Igor Lopez、Bruno Spinelli、Tengiz Tutisani、Jaya Uradhanda、Sergey Bilida、Dmitry\
    \ Shumarov 和 Sergio Reyes 表示感谢，他们是这个伟大团队的一部分！我还要感谢 Roberto 和 Victor Beraja，他们的愿景不止一次地将\
    \ DHTMLX 库推向了极限。干杯！\n\n## 关于审阅者\n\n**Asen Bozhilov** 是一位拥有多年 Web 技术经验的 Web 开发人员。目前，他使用\
    \ JavaScript 和 XUL 开发 XULRunner 应用程序。他拥有计算机科学学士学位。在业余时间，他喜欢尝试新的技术和编程语言。他的兴趣主要在计算机科学领域，但也喜欢体育活动。\n\
    \n他审阅过其他 JavaScript 书籍，例如 *Maintainable JavaScript*、*JavaScript Patterns* 和 *JavaScript\
    \ for PHP developers*。\n\n**Ali Farhadi** 是一位居住在伊朗马什哈德的资深 Web 开发人员和系统管理员。他热衷于开源技术，并为\
    \ CakePHP 和 Lithium 等主要 PHP 框架做出了贡献。\n\n他也是波斯 node.js 社区的先驱之一，自 2009 年起就为该项目做出了贡献。他还编写了一些开源项目，特别是\
    \ HTML5Sortable jQuery 插件和用于 node.js 的 SMPP 模块。\n\n您可以在他的网站 `http://farhadi.ir`\
    \ 上了解更多关于他及其作品的信息。\n\n**Ed Wildgoose** 在 ZX81 还是前沿科技的时代长大，并在金融界度过了他的成长岁月，后来他决定未来的道路是成为自己的老板，工作时间更长，赚得更少。他享受学习\
    \ IT 艺术本身的过程，多年来尝试过大多数常见（和不常见）的编程语言和工具（还有其他人喜欢在 90 年代初期使用 Haskell 吗？）。他在过去的几年里在\
    \ Mac、Windows 和 Linux 上开发过项目，但目前更倾向于将 Linux 用于后端服务器，Mac 用于桌面。\n\n他目前拥有 MailASail\
    \ (http://mailasail.com)，这是一家精品公司，为使用卫星电话和漫游蜂窝设备的用户提供服务。MailASail 是卫星硬件和通信时间的主要供应商，但专注于提供内部解决方案，优化昂贵卫星链路上的\
    \ TCP 数据传输，也就是说，您可以拿着 iPhone，在海洋、沙漠或冰川中部以非常实惠的成本阅读电子邮件！他们的客户从 BBC 自然纪录片创作者到海洋划船者都有。\n\
    \n> 我要感谢我的妻子 Sue，以及我的孩子们 Katie 和 Luke，感谢他们在我花太长时间工作时没有父亲陪伴在身边。\n\n## www.PacktPub.com\n\
    \n### 支持文件、电子书、折扣优惠等\n\n您可能想访问 www.PacktPub.com 获取与您书籍相关的支持文件和下载。\n\n您知道 Packt\
    \ 为出版的每本书都提供电子书版本，提供 PDF 和 ePub 文件吗？您可以在 www.PacktPub.com 升级到电子书版本，作为纸质书的客户，您有权享受电子书的折扣。请通过\
    \ service@packtpub.com 联系我们了解更多详情。\n\n在 www.PacktPub.com 上，您还可以阅读一系列免费技术文章，注册一系列免费时事通讯，并接收\
    \ Packt 书籍和电子书的独家折扣和优惠。\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_7_0.png)\n\
    \nhttp://PacktLib.PacktPub.com\n\n您需要 IT 问题的即时解决方案吗？PacktLib 是 Packt 的在线数字图书馆。在这里，您可以访问、阅读和搜索\
    \ Packt 整个图书馆的书籍。\n\n### 为什么订阅？\n\n- 完全可搜索 Packt 出版的每本书\n- 复制和粘贴、打印和收藏内容\n- 按需提供，可通过网络浏览器访问\n\
    \n### Packt 账户持有者免费访问\n\n如果您在 www.PacktPub.com 上拥有 Packt 账户，您可以使用它立即访问 PacktLib，并查看九本完全免费的书籍。只需使用您的登录凭据即可立即访问。\n\
