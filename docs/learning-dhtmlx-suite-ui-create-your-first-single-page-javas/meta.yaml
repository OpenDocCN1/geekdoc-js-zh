    # 7


    # # The DHTMLX Window


    In this chapter, we will learn about the DHTMLX window component covering the
    different initializations, events, methods, and settings. We will then add a pop-up
    window to the application that will hold a form created in the next chapter.


    All changes done in this chapter will be inside the `app.js` file.


    # ## The DHTMLX window


    The DHTMLX window component allows us to create multiple pop-up windows inside
    a web page quickly and easily. The window component provides the means to quickly
    attach a DHTMLX form, layout, grid, and most other components. It also does the
    work for styling, alignment, and positioning.


    The DHTMLX window component is a base object that can have many child pop-up windows
    created from it. The base object takes all of the important settings like the
    image path and the optional viewport.


    By the end of this chapter, we will have an excellent understanding of how to
    initialize and control a DHTMLX window object and create pop-up windows. We will
    then create a pop-up window that will open when the add button is pressed.


    # ## The methods and events


    We will begin by creating a new instance of the base `dhtmlXWindows` object.

    Refresh the browser to clear any console code from previous exercises.'
  - "[PAGE 80]\n\n# Initialization\n\nInitializations of DHTMLX's components are either\
    \ done through an existing component, such as the layout component, or initialized\
    \ to a DOM element. This is different with the window component. The base object\
    \ must be created first. From this base object, a set of new windows can be created.\n\
    \nThe settings for initialization in the other discussed components have always\
    \ been added in a functional manner. DHTMLX also provides the optional object\
    \ literal way of applying settings to initialization for most of their components.\
    \ For the first exercise we will create multiple windows with the settings as\
    \ an object literal.\n\n# Creating the base object\n\nIn the console we will create\
    \ a new `dhtmlXWindows` object with a settings object. This settings object will\
    \ set the path to the images folder and allow the creation of multiple windows\
    \ at the same time.\n\nType and run the following code in the console:\n\n```\n\
    var myWindows = new dhtmlXWindows({\n    image_path: config.imagePath,\n    wins:\
    \ [\n        {\n            id: \"w1\",\n            height: 200,\n          \
    \  width: 200,\n            text: \"One\"\n        },\n        {\n           \
    \ id: \"w2\",\n            height: 200,\n            width: 200,\n           \
    \ text: \"Two\",\n            left: 20,\n            top: 20\n        },\n   \
    \     {\n            id: \"w3\",\n            height: 200,\n            width:\
    \ 200,\n            text: \"Three\",\n            left: 40,\n            top:\
    \ 40\n        }\n    ]\n});\n```"
- md: "Three new pop-up windows were created in the page. Each of these pop-up windows\
    \ can be moved around freely within the browser window similar to a desktop window.\n\
    \nNext we will create the windows through provided methods.\n\n## Create windows\
    \ through methods\n\nFirst we will create a new `dhtmlXWindows` method and then\
    \ apply its settings.\n\nRefresh the page. Type and run the following code in\
    \ the console:\n\nNow we have a base object available to start the exercises that\
    \ will create the individual pop-up windows.\n\n```\nvar myWindows = new dhtmlXWindows();\n\
    myWindows.setImagePath(config.imagePath);\n```\n\n## Methods\n\nEach individual\
    \ pop-up window acts as a container. This means they can have other components\
    \ attached to them. This is a nice feature. Using the pop-up window's methods,\
    \ we can create and attach components like a form, grid, chart, layout, and more.\n\
    \nNow let's create a pop-up window.\n\n## createWindow (base object method)\n\n\
    The parameters for this method are ID, x position, y position, width, and height.\
    \ Note that we will pass null for the position variables, as they are not required\
    \ unless a screen position is desired.\n\nType and run the following code in the\
    \ console:\n\nWe have just created a new pop-up window and assigned a reference\
    \ to the `myPopup` variable. Using this, we will apply some of the available settings\
    \ and methods.\n\n```\nvar myPopup = myWindows.createWindow(\"w1\", null, null,\
    \ 200, 200);\n```\n\n## setDimension\n\nThe `setDimension` sets the height and\
    \ width of a pop-up window in pixels.\n\nType and run the following code in the\
    \ console:\n\n```\nmyPopup.setDimension(300,300);\n```\n\n## denyResize\n\nWhen\
    \ a pop-up window is first created, the borders can be used to resize the window\
    \ manually. The `denyResize` method disables this feature.\n\nType and run the\
    \ following code in the console:\n\n```\nmyPopup.denyResize();\n```\n\nThis method\
    \ also disables the maximize button on the pop-up window's toolbar. The `allowResize`\
    \ method turns that feature back on.\n\n## centerOnScreen\n\nThe `centerOnScreen`\
    \ method takes out any guess work of positioning a pop-up window. This method\
    \ positions the pop-up window in the center of the page.\n\nType and run the following\
    \ code in the console:\n\n```\nmyPopup.centerOnScreen();\n```\n\nNow the pop-up\
    \ window is centered.\n\n## setModal\n\nThe `setModal` method creates an overlay\
    \ that covers the background application on the page. This is quite useful when\
    \ restricting access to functionality other than the active pop-up window.\n\n\
    Type and run the following code in the console:\n\n```\nmyPopup.setModal(true);\n\
    ```\n\nWhen the pop-up window is closed, the modal is also removed. But for the\
    \ next, `hide` method, this does not occur. The modal remains even though the\
    \ pop-up window is not visible.\n\n## hide\n\nThe `hide` method hides the pop-up\
    \ window leaving its state the same as before it was hidden.\n\nType and run the\
    \ following code in the console:\n\n```\nmyPopup.hide();\n```\n\nThe pop-up window\
    \ is no longer on the screen, yet we still have the modal left over from our `setModal`\
    \ method. Let's turn that off.\n\nType and run the following code in the console:\n\
    \n```\nmyPopup.setModal(false);\n```\n\n## show\n\nThe `show` method does the\
    \ opposite of our `hide` method. It shows the pop-up window once again.\n\nType\
    \ and run the following code in the console:\n\n```\nmyPopup.show();\n```\n\n\
    It is visible again, right where we left it.\n\n## setText\n\nThe `setText` method\
    \ allows us to change the title on the pop-up window.\n\nType and run the following\
    \ code in the console:\n\n```\nmyPopup.setText(\"My Popup Window!\");\n```\n\n\
    ## hideHeader\n\nThe `hideHeader` method allows us to hide the title bar all together.\n\
    \nType and run the following code in the console:\n\n```\nmyPopup.hideHeader();\n\
    ```\n\n## showHeader\n\nThe `showHeader` method does the reverse of `hideHeader`.\n\
    \nType and run the following code in the console:\n\n```\nmyPopup.showHeader();\n\
    ```\n\nWe touched on some of the basic methods for the pop-up window and all of\
    \ the necessary ones for the application.\n\n## Events\n\nWith the DHTMLX window\
    \ component, you can attach one event to all of the pop-up windows created from\
    \ the same base object. This is achieved by attaching the event to the base object.\
    \ You can also attach an event to each individual pop-up window.\n\nWe will be\
    \ using the `onClose` event for the application. Let's do a quick exercise using\
    \ this event.\n\n## onClose\n\nThe `onClose` event triggers just before the pop-up\
    \ window closes. This allows us some freedom to manipulate something prior to\
    \ it actually closing. It can also be used to prevent it from closing.\n\nWhen\
    \ the `onClose` event is attached to a pop-up window, we must return a `true`\
    \ value from the handler we provide or it will not close.\n\nType and run the\
    \ following code in the console:\n\n```\nmyPopup.attachEvent(\"onClose\",function(){\n\
    \    console.log(\"close clicked\");\n});\n```\n\nNow try to close the pop-up\
    \ window with the close button. The event is fired and the text is logged in the\
    \ console but the popup does not close.\n\nType and run the following code in\
    \ the console:\n\n```\nmyPopup.detachAllEvents();\nmyPopup.attachEvent(\"onClose\"\
    ,function(){\n    console.log(\"close clicked again\");\n    return true;\n});\n\
    ```\n\nWe detached the previously added event, then added a new event that returns\
    \ true allowing the event to complete.\n\nNext we will create the pop-up window\
    \ for the application.\n\n## The application code\n\nThe application code for\
    \ this chapter will create a pop-up window that will open when a grid row is double-clicked\
    \ or when the **add** button on the toolbar is pressed. Once the pop-up window\
    \ is created we do not want to recreate it again; so we will only hide and show\
    \ it. To prevent the pop-up window from closing when the close button is pressed\
    \ we will use the `onClose` event we discussed in the previous section.\n\n##\
    \ Creating the pop-up window\n\nOpen the `app.js` file and add the following code\
    \ at the end:\n\n```\n// Popup\nvar appPopup;\ndhtmlxEvent(window, \"load\", function(){\n\
    \    // create popup\n    var win = new dhtmlXWindows();\n    win.setImagePath(config.imagePath);\n\
    \    appPopup = win.createWindow(1,null,null,400,300);\n    appPopup.setText(\"\
    User Add/Edit\");\n    appPopup.centerOnScreen();\n    // popup events\n    appPopup.attachEvent(\"\
    onClose\",callbacks.hidePopup);\n    // hide popup initially\n    appPopup.hide();\n\
    });\n```\n\nFirst we created the global variable as a reference to the pop-up\
    \ window. Then we created the base object, attached an event, and lastly we made\
    \ the popup hidden initially.\n\nNext we will add the code to show and hide the\
    \ pop-up window in the `callbacks` object.\n\n## callbacks\n\nInside the `callbacks`\
    \ object we are editing the `addClick`, `showPopup`, and `hidePopup` methods to\
    \ the following:\n\n## showPopup\n\nThe `showPopup` method contains the code to\
    \ show the pop-up window and modal.\n\nAdd the code to the `callbacks` object's\
    \ `showPopup` method as shown:\n\n```\nshowPopup: function(){\n    appPopup.setModal(1);\n\
    \    appPopup.show();\n},\n```\n\n## hidePopup\n\nThe `hidePopup` method contains\
    \ the code to hide the pop-up window and clear the modal.\n\nAdd the code to the\
    \ `callbacks` object's `hidePopup` method as shown:\n\n```\nhidePopup: function()\
    \ {\n    appPopup.setModal(0);\n    appPopup.hide();\n}\n```\n\n## addClick\n\n\
    The `addClick` method is triggered when the `add` button is pressed.\n\nAdd the\
    \ code to the `callbacks` object's `addClick` method as shown:\n\n```\naddClick:\
    \ function() {\n    callbacks.showPopup();\n}\n```\n\n## Test our popup\n\nAll\
    \ of the methods are now in place for the pop-up window.\n\nTo test we will first\
    \ refresh the page. After refreshing there will be no noticeable difference until\
    \ we click on the `add` button in the toolbar. Do so now and see that the pop-up\
    \ window opens centered on the page with the modal covering the background application.\
    \ Now test the close button and re-open.\n\nWith the pop-up window open, your\
    \ application should look like the following screenshot:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_87_0.png)\n\
    \n## Summary\n\nIn this chapter, we learned about DHTMLX's window component, and\
    \ the various ways through which we can initialize it. We also went over some\
    \ of the important methods and events for the individual pop-up windows and how\
    \ they relate to the base window object. Then we applied this knowledge to the\
    \ application by adding the pop-up code and methods.\n\nIn the next chapter, we\
    \ will use the pop-up window and add a DHTMLX form. This will allow us to add\
    \ a user through the application as opposed to the console."
  mdcn: "\n页面中创建了三个新的弹出窗口。每个弹出窗口都可以在浏览器窗口内自由移动，类似于桌面窗口。\n\n接下来，我们将通过提供的方法来创建这些窗口。\n\
    \n## 通过方法创建窗口\n\n首先，我们将创建一个新的 `dhtmlXWindows` 方法，然后应用其设置。\n\n刷新页面。在控制台中输入并运行以下代码：\n\
    \n现在，我们有了一个基础对象，可以开始进行创建各个弹出窗口的练习。\n\n```\nvar myWindows = new dhtmlXWindows();\n\
    myWindows.setImagePath(config.imagePath);\n```\n\n## 方法\n\n每个独立的弹出窗口都充当一个容器。这意味着它们可以附带其他组件。这是一个很好的特性。使用弹出窗口的方法，我们可以创建并附加表单、网格、图表、布局等组件。\n\
    \n现在，让我们创建一个弹出窗口。\n\n## createWindow（基础对象方法）\n\n此方法的参数是 ID、x 位置、y 位置、宽度和高度。请注意，对于位置变量，我们将传递\
    \ `null`，因为除非需要指定屏幕位置，否则它们不是必需的。\n\n在控制台中输入并运行以下代码：\n\n我们刚刚创建了一个新的弹出窗口，并将其引用赋值给了\
    \ `myPopup` 变量。利用这个引用，我们将应用一些可用的设置和方法。\n\n```\nvar myPopup = myWindows.createWindow(\"\
    w1\", null, null, 200, 200);\n```\n\n## setDimension\n\n`setDimension` 方法以像素为单位设置弹出窗口的高度和宽度。\n\
    \n在控制台中输入并运行以下代码：\n\n```\nmyPopup.setDimension(300,300);\n```\n\n## denyResize\n\
    \n当弹出窗口首次创建时，可以使用边框手动调整窗口大小。`denyResize` 方法会禁用此功能。\n\n在控制台中输入并运行以下代码：\n\n```\n\
    myPopup.denyResize();\n```\n\n此方法还会禁用弹出窗口工具栏上的最大化按钮。`allowResize` 方法可以重新启用该功能。\n\
    \n## centerOnScreen\n\n`centerOnScreen` 方法消除了定位弹出窗口的所有猜测。此方法将弹出窗口定位在页面的中心。\n\n\
    在控制台中输入并运行以下代码：\n\n```\nmyPopup.centerOnScreen();\n```\n\n现在，弹出窗口已居中显示。\n\n##\
    \ setModal\n\n`setModal` 方法创建一个覆盖层，遮盖页面上的背景应用程序。当需要限制对活动弹出窗口之外功能的访问时，此功能非常有用。\n\
    \n在控制台中输入并运行以下代码：\n\n```\nmyPopup.setModal(true);\n```\n\n当弹出窗口关闭时，模态层也会被移除。但对于接下来的\
    \ `hide` 方法，情况并非如此。即使弹出窗口不可见，模态层仍然存在。\n\n## hide\n\n`hide` 方法隐藏弹出窗口，但保持其状态与隐藏前相同。\n\
    \n在控制台中输入并运行以下代码：\n\n```\nmyPopup.hide();\n```\n\n弹出窗口不再显示在屏幕上，但我们仍然留有来自 `setModal`\
    \ 方法的模态层。让我们将其关闭。\n\n在控制台中输入并运行以下代码：\n\n```\nmyPopup.setModal(false);\n```\n\n\
    ## show\n\n`show` 方法与 `hide` 方法相反。它会再次显示弹出窗口。\n\n在控制台中输入并运行以下代码：\n\n```\nmyPopup.show();\n\
    ```\n\n它又可见了，就停留在我们离开它的位置。\n\n## setText\n\n`setText` 方法允许我们更改弹出窗口的标题。\n\n在控制台中输入并运行以下代码：\n\
    \n```\nmyPopup.setText(\"My Popup Window!\");\n```\n\n## hideHeader\n\n`hideHeader`\
    \ 方法允许我们完全隐藏标题栏。\n\n在控制台中输入并运行以下代码：\n\n```\nmyPopup.hideHeader();\n```\n\n## showHeader\n\
    \n`showHeader` 方法与 `hideHeader` 相反。\n\n在控制台中输入并运行以下代码：\n\n```\nmyPopup.showHeader();\n\
    ```\n\n我们介绍了一些弹出窗口的基本方法，以及应用所需的所有必要方法。\n\n## 事件\n\n使用 DHTMLX 窗口组件，您可以将事件附加到从同一个基础对象创建的所有弹出窗口。这是通过将事件附加到基础对象来实现的。您也可以将事件附加到每个独立的弹出窗口。\n\
    \n我们将在应用程序中使用 `onClose` 事件。让我们用这个事件做一个快速练习。\n\n## onClose\n\n`onClose` 事件在弹出窗口关闭之前触发。这让我们在窗口实际关闭之前有一些自由度来操作某些事情。它也可以用来阻止窗口关闭。\n\
    \n当 `onClose` 事件附加到弹出窗口时，我们必须从提供的处理函数返回 `true` 值，否则窗口将不会关闭。\n\n在控制台中输入并运行以下代码：\n\
    \n```\nmyPopup.attachEvent(\"onClose\",function(){\n    console.log(\"close clicked\"\
    );\n});\n```\n\n现在尝试用关闭按钮关闭弹出窗口。事件被触发，文本被记录在控制台中，但弹出窗口没有关闭。\n\n在控制台中输入并运行以下代码：\n\
    \n```\nmyPopup.detachAllEvents();\nmyPopup.attachEvent(\"onClose\",function(){\n\
    \    console.log(\"close clicked again\");\n    return true;\n});\n```\n\n我们分离了之前添加的事件，然后添加了一个返回\
    \ `true` 的新事件，允许事件完成。\n\n接下来，我们将为应用程序创建弹出窗口。\n\n## 应用程序代码\n\n本章的应用程序代码将创建一个弹出窗口，该窗口在网格行被双击或工具栏上的\
    \ **add** 按钮被按下时打开。一旦弹出窗口创建完成，我们不希望再次重新创建它；因此我们将只对其进行隐藏和显示。为了防止在按下关闭按钮时弹出窗口关闭，我们将使用上一节讨论的\
    \ `onClose` 事件。\n\n## 创建弹出窗口\n\n打开 `app.js` 文件，在末尾添加以下代码：\n\n```\n// Popup\nvar\
    \ appPopup;\ndhtmlxEvent(window, \"load\", function(){\n    // create popup\n\
    \    var win = new dhtmlXWindows();\n    win.setImagePath(config.imagePath);\n\
    \    appPopup = win.createWindow(1,null,null,400,300);\n    appPopup.setText(\"\
    User Add/Edit\");\n    appPopup.centerOnScreen();\n    // popup events\n    appPopup.attachEvent(\"\
    onClose\",callbacks.hidePopup);\n    // hide popup initially\n    appPopup.hide();\n\
    });\n```\n\n首先，我们创建了全局变量作为弹出窗口的引用。然后我们创建了基础对象，附加了一个事件，最后我们最初将弹出窗口隐藏。\n\n接下来，我们将在\
    \ `callbacks` 对象中添加显示和隐藏弹出窗口的代码。\n\n## callbacks\n\n在 `callbacks` 对象中，我们将编辑 `addClick`、`showPopup`\
    \ 和 `hidePopup` 方法为以下内容：\n\n## showPopup\n\n`showPopup` 方法包含显示弹出窗口和模态层的代码。\n\n\
    将代码添加到 `callbacks` 对象的 `showPopup` 方法中，如下所示：\n\n```\nshowPopup: function(){\n\
    \    appPopup.setModal(1);\n    appPopup.show();\n},\n```\n\n## hidePopup\n\n\
    `hidePopup` 方法包含隐藏弹出窗口和清除模态层的代码。\n\n将代码添加到 `callbacks` 对象的 `hidePopup` 方法中，如下所示：\n\
    \n```\nhidePopup: function() {\n    appPopup.setModal(0);\n    appPopup.hide();\n\
    }\n```\n\n## addClick\n\n`addClick` 方法在按下 `add` 按钮时触发。\n\n将代码添加到 `callbacks` 对象的\
    \ `addClick` 方法中，如下所示：\n\n```\naddClick: function() {\n    callbacks.showPopup();\n\
    }\n```\n\n## 测试我们的弹出窗口\n\n现在，弹出窗口的所有方法都已就位。\n\n为了测试，我们将首先刷新页面。刷新后，直到我们点击工具栏中的\
    \ `add` 按钮之前，都不会有明显变化。现在点击它，您会看到弹出窗口在页面中心打开，模态层覆盖了背景应用程序。现在测试关闭按钮并重新打开。\n\n当弹出窗口打开时，您的应用程序应如下方截图所示：\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_87_0.png)\n\n## 总结\n\n在本章中，我们学习了 DHTMLX\
    \ 的窗口组件，以及初始化它的各种方式。我们还介绍了一些独立弹出窗口的重要方法和事件，以及它们如何与基础窗口对象相关联。然后，我们将这些知识应用到应用程序中，添加了弹出窗口代码和方法。\n\
    \n在下一章中，我们将使用弹出窗口并添加一个 DHTMLX 表单。这将允许我们通过应用程序（而不是控制台）来添加用户。\n"
