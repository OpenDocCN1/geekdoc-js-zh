  md: '> **Downloading the example code**

    You can download the example code files for all Packt books you have purchased
    from your account at http://www.packtpub.com. If you purchased this book elsewhere,
    you can visit http://www.packtpub.com/support and register to have the files e-mailed
    directly to you.


    The `dhtmlx.css` and `dhtmlx.js` are the only DHTMLX library files necessary to
    include in the DHTMLX library for use. The `storage.js` and `app.js` are where
    the code for the user management application will be created.


    Additional CSS was added that sets the `html` and `body` to a height and width
    of 100%. This will allow the DHTMLX layout component, added later, to stretch
    and grow when the browser window is resized. We will be adding more CSS here in
    later chapters.


