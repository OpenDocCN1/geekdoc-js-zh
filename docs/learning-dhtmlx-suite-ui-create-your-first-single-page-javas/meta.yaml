    \ 14\n  - **Testing the DHTMLX installation** ................................................................\
    \ 15\n  - **Summary** .................................................................................................\
    \ 18\n- **Chapter 3: Data Structures, Storage, and Callbacks** ................................................\
    \ 19\n  - **localStorage** ...........................................................................................\
    \ 19\n  - **Creating the storage object** ......................................................................\
    \ 20\n    - The storage methods and properties .......................................................\
    \ 20\n      - lastStoredId ......................................................................................\
    \ 21\n      - setDateFormat ...................................................................................\
