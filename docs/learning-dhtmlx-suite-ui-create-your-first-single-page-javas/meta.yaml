    # 3 Data Structures, Storage, and Callbacks


    In this chapter, we will explore how and where the user information will be stored,
    retrieved, and triggered for updating related data components. We will cover some
    cool features of HTML5 that will allow us to write the entire application on the
    client side. This will let us focus more on the user interface and the DHTMLX
    components, and alleviate maintaining a database and server-side code.


    We will add a `storage` object to the `storage.js` file and add a `callbacks`
    object to the `app.js` file directly below our `config` object.


    > DHTMLX has certain data structures for different components. For the grid and
    chart components, there will be separate calls to retrieve and structure the data.


    # localStorage


    There has been a lot of buzz going around about HTML5 and its capabilities. We
    will cover one of them briefly.


    Prior to HTML5 `localStorage`, the only option that client-side JavaScript had
    for storing persistent data across pages was utilizing cookies. Cookies are limited
    in size and do not remain only on the client side; they are sent to the server
    with each request. HTML5 `localStorage` considerably increases the storage limit
    and is strictly stored on the client side.


    Some of the main reasons for utilizing `localStorage` are caching Ajax-served
    data, common form fields across pages, autocomplete results, or working offline.
    However, it is fairly new and implementation still varies slightly between browsers.'
  - '[PAGE 34]


    Data Structures, Storage, and Callbacks


    HTML5 `localStorage` allows the client side to store persistent data in key-value
    pairs across multiple browser windows restricted by the same-origin policy. The
    usage is simple. Here are the methods and properties we will be using to create
    the storage for our application:


    ```

    localStorage.setItem(key,value) // sets item value

    localStorage.getItem(key) // returns item value

    localStorage.key(nth) // returns key of the enumeration

    localStorage.clear() // clears all stored values

    localStorage.length // returns number of items

    ```


    These methods and properties are self-explanatory.


    One important thing to know about `localStorage` is that the key and value parameters
    both are stored as DOMStrings. What this means to the application is that if an
    `int` is entered, it will be converted to a `string` version of that `int`. If
    you try to save an `object`, it will be returned as "[object type]", where type
    is the object type. So how do we store more complex objects into a `localStorage`
    item? We do so by using the `JSON.stringify()` method.


    For the application, we will create JavaScript object literals and convert them
    to strings using the `JSON.stringify()` method prior to storing them. Then, upon
    retrieval, we will convert them back to an object using `JSON.parse()`. This is
    simple and allows us to save objects and retrieve object literals to `localStorage`.


    # Creating the storage object


    Now, we will create the storage object. Find the `storage.js` file that we created,
    which should be empty. We will use the `storage` object to save and retrieve the
    application data.


    > Please pay attention to trailing commas when adding methods to this JavaScript
    object. Every method should be followed by a comma. The last method is optional.


    First, we will look at each individual method and what each one does. Then we
    will create the entire object.


    # The storage methods and properties


    There are two properties we created in the `storage` object that are specific
    for helping it to operate.'
