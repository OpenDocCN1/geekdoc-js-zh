- md: "## 8 The DHTMLX Form and Calendar\n\nIn this chapter, we will learn about the\
    \ DHTMLX form and calendar component covering the different initializations, methods,\
    \ and settings. We will then add a form to the pop-up window that we created in\
    \ the previous chapter.\n\nAll changes done in this chapter will occur inside\
    \ the app.js and index.html files.\n\n## The DHTMLX form\n\nThe DHTMLX form component\
    \ allows us to create HTML forms through code or convert existing HTML into a\
    \ DHTMLX styled form. We will cover how to create a form through code using an\
    \ array of JavaScript object literals.\n\nThe form component has many different\
    \ item types. To name a few there are button, checkbox, container, input, file,\
    \ hidden, label, multiselect, password, radio, select, template, textarea, and\
    \ upload items. In addition there are also positional related items and items\
    \ that integrate other components.\n\nThe DHTMLX calendar is one of those components\
    \ that can be integrated into the form. It is still handled as an individual component\
    \ once created. This means that its events and methods are handled separately.\n\
    \nBy the end of this chapter, we will have a good understanding of the DHTMLX\
    \ form and how to apply validation, populate the form and retrieve its data. We\
    \ will then apply this understanding to the application and create a user add/edit\
    \ form that will control the data entry and manipulation.\n\n## Initialization\
    \ of the DHTMLX form\n\nAs we have covered in the previous chapters, when creating\
    \ DHTMLX components we can either attach them to a DOM element or to a DHTMLX\
    \ Layout. Same goes for the form component. So we do not need to cover these,\
    \ instead, we will try something new which is similar to attaching a form to a\
    \ layout.\n\nIn the last chapter, we learned how we can attach components directly\
    \ to a pop-up window. This is how we will attach a form.\n\nFirst, we will create\
    \ an array of objects that contain the settings and form items. This will be used\
    \ to initiate a form to the existing pop-up window. Here, we will practice by\
    \ adding a form directly to the pop-up window with the `attachForm` method.\n\n\
    ## attachForm\n\nThe form we will create for the exercise will have the `settings`,\
    \ `input`, `checkbox`, `calendar`, `select`, `button`, `block`, and `newcolumn`\
    \ item. The form will not look that great but we are just going over what each\
    \ item does.\n\nClick on the **add** button to show our empty pop-up window then\
    \ we will use the `attachForm` method to create a form in the pop-up window.\n\
    \n> When creating large blocks of code to place in the console, it helps to first\
    \ type it into notepad or some simple text editor for ease of syntax and later\
    \ editing.\n\nIn the console type in and run:\n\n```javascript\nvar myForm = appPopup.attachForm([\n\
    \    {\n        type: \"settings\",\n        position: \"label-left\",\n     \
    \   labelWidth: 100\n    },\n    {\n        type: \"input\",\n        label: \"\
    No name:\",\n        inputWidth: 50\n    },\n    {\n        type: \"input\",\n\
    \        name: \"input1\",\n        label: \"Some Label:\",\n        required:\
    \ true\n    },\n    {\n        type: \"checkbox\",\n        name: \"checkbox1\"\
    ,\n        label: \"Yes?\"\n    },\n    {\n        type: \"calendar\",\n     \
    \   name: \"mydate\",\n        label: \"date:\"\n    },\n    {\n        type:\
    \ \"select\",\n        name: \"mySelect\",\n        label: \"Select One:\",\n\
    \        options: [\n            { text: \"Option1\", value: 1 },\n          \
    \  { text: \"Option2\", value: 2 },\n        ]\n    },\n    {\n        type: \"\
    button\",\n        name: \"myButton1\",\n        value: \"Click Me\"\n    },\n\
    \    {\n        type: \"block\",\n        list: [\n            { type: \"button\"\
    , value: \"Button Left\"},\n            { type: \"newcolumn\", offset: 55 },\n\
    \            { type: \"button\", value: \"Button Right\"},\n        ]\n    }\n\
    ]);\n```\n\nAfter you run this, you will see a form in the pop-up window that\
    \ looks like the following screenshot:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_92_0.png)\n\
    \nLet's go over each of these form item types and their attributes. Since we assigned\
    \ a reference of the newly created form to the variable `myForm`, we will use\
    \ this to call some methods.\n\n## Form items and attributes\n\nEach item on the\
    \ form has its own attributes that can be applied. Some are common across multiple\
    \ item types. Here are some of the common attributes available that can be applied\
    \ to most of the form items:\n\n- `className` (string): It adds a CSS class to\
    \ item\n- `disabled` (Boolean): It disables or enables the item\n- `hidden` (Boolean):\
    \ It shows or hides the item\n- `tooltip` (string): It sets a tooltip for the\
    \ item\n- `name` (string): It is the name of the form element\n\n## settings\n\
    \nThe first object we have in the array is the `settings` item. This is an optional\
    \ item that allows us to apply properties to all of the other items at once. For\
    \ instance, having to set a width to all of the inputs in a form that has 20 inputs\
    \ would be a little redundant. So, DHTMLX provided the settings object which works\
    \ nicely. Don't worry the settings can be overridden at the individual item level.\n\
    \nFor this exercise, we will also aligned the labels to the left using `position`\
    \ and set a width to make them appear evenly using `labelWidth`.\n\n## input\n\
    \nThe `input` type is a normal form input that you would see on any HTML form.\
    \ The attributes we set on the inputs are `inputWidth`, `validate`, `required`,\
    \ `label`, and `name`. The name is how we will later retrieve the value of this\
    \ input in code.\n\nNotice that there are three input items and one without the\
    \ name attribute. If a `name` is not provided for a form item, DHTMLX generates\
    \ a unique one for us. This does not make it easy to retrieve the values so we\
    \ will use names in the application.\n\nThe `validate` attribute added to an input\
    \ validates the value of that input on a specified rule. Some of the provided\
    \ validation rules are `ValidSSN`, `ValidNumeric`, `Empty`, `NotEmpty`, and `ValidEmail`.\n\
    \nAnother feature of the validate attribute is that a custom validation rule can\
    \ be created. This is done by passing a custom function name or even a regular\
    \ expression as the `validate` property value. Multiple validations can also be\
    \ applied to the same item by using a string with the comma separating the validation,\
    \ such as `NotEmpty` and `ValidNumeric`.\n\nThere is also the `required` property.\
    \ This does the exact same as the `NotEmpty` validation, but also adds an asterisk\
    \ next to the label automatically. The asterisk mark is common practice for web\
    \ forms to notify the user that those fields are required.\n\nWe will test how\
    \ these validations work shortly.\n\n## hidden\n\nThe `hidden` type is identical\
    \ to the HTML input type of hidden. This allows us to place values on to a form\
    \ that are not visible in the UI. We didn't use it in the exercise but we will\
    \ be using this in the application form.\n\n## checkbox\n\nThe `checkbox` type\
    \ creates an HTML checkbox with an integer value of 1 or 0. We can also add the\
    \ `required` and `validate` attributes to a checkbox.\n\n## calendar\n\nThe `calendar`\
    \ type creates an input and initializes the DHTMLX calendar component to it automatically.\
    \ This form type has some additional properties over the normal form elements.\n\
    \nWhen creating a calendar, there is the option to format the date for display\
    \ and set if we want time to be enabled using the `dateFormat` form item attribute.\
    \ If you do not set the format it will be set to the default format.\n\nThe value\
    \ retrieved from a form item that has a calendar component attached is a JavaScript\
    \ date object. This is important to know when saving the value to a database or\
    \ wanting to redisplay it later. We need to convert the JavaScript date object\
    \ to a readable string for storage and retrieval.\n\n## select\n\nThe `select`\
    \ type creates an HTML select with the property called `options`, which is an\
    \ array that allows us to add HTML options to the select. We can also add the\
    \ `required` and `validate` attributes to a `select` type. Inside each of the\
    \ options objects, we can set the attribute `selected` to set an option as selected.\n\
    \n## button\n\nThe `button` item type creates a form button. These buttons allows\
    \ us to listen for the `onButtonClick` form event. The `value` property is what\
    \ sets the text inside the button. We also added a couple more buttons that are\
    \ inside the block item type.\n\n## block\n\nDHTMLX provides several form items\
    \ that assist with the form layout. The `block` form item is one of those. This\
    \ creates a new group of form items that we can position together. The one we\
    \ created contains the buttons and has several attributes, like the `width` attribute.\n\
    \nWe added the form items to a block by using the `list` property, which is an\
    \ array of form item objects no different than what we are using outside of the\
    \ `block` item. Inside the `list`, we created the save and cancel buttons in different\
    \ columns with the `newcolumn` item."
  mdcn: "\n## 8 DHTMLX 表单与日历\n\n在本章中，我们将学习 DHTMLX 的表单和日历组件，涵盖不同的初始化方式、方法和设置。然后，我们将在上一章创建的弹出窗口中添加一个表单。\n\
    \n本章中的所有更改都将发生在 `app.js` 和 `index.html` 文件中。\n\n## DHTMLX 表单\n\nDHTMLX 表单组件允许我们通过代码创建\
    \ HTML 表单，或者将现有的 HTML 转换为 DHTMLX 样式的表单。我们将介绍如何使用 JavaScript 对象字面量数组通过代码创建表单。\n\
    \n表单组件有许多不同的项目类型。例如，有按钮、复选框、容器、输入框、文件、隐藏字段、标签、多选框、密码框、单选按钮、选择框、模板、文本区域和上传项。此外，还有位置相关的项目以及集成其他组件的项目。\n\
    \nDHTMLX 日历是可以集成到表单中的组件之一。创建后，它仍然作为独立组件处理。这意味着它的事件和方法是单独处理的。\n\n在本章结束时，我们将对 DHTMLX\
    \ 表单有很好的理解，包括如何应用验证、填充表单以及检索其数据。然后，我们将把这些知识应用到应用程序中，创建一个用户添加/编辑表单，以控制数据输入和操作。\n\
    \n## DHTMLX 表单的初始化\n\n正如我们在前几章中介绍的，创建 DHTMLX 组件时，我们可以将它们附加到 DOM 元素或 DHTMLX 布局。表单组件也是如此。因此，我们不需要重复这些内容，相反，我们将尝试一种新的方法，类似于将表单附加到布局。\n\
    \n在上一章中，我们学习了如何将组件直接附加到弹出窗口。这也将是我们附加表单的方式。\n\n首先，我们将创建一个包含设置和表单项的对象数组。这将用于初始化现有弹出窗口中的表单。在这里，我们将通过练习使用\
    \ `attachForm` 方法直接将表单添加到弹出窗口中。\n\n## attachForm\n\n我们将为练习创建的表单将包含 `settings`、`input`、`checkbox`、`calendar`、`select`、`button`、`block`\
    \ 和 `newcolumn` 项。表单看起来不会太美观，但我们只是为了了解每个项的作用。\n\n点击 **add** 按钮显示我们空的弹出窗口，然后我们将使用\
