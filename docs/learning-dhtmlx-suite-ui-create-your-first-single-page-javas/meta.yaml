  md: '# # 5

    The DHTMLX Toolbar


    In this chapter, we will learn about the DHTMLX toolbar component and its different
    initializations, events, methods, and settings. Then we will add a toolbar to
    the application, giving it the ability to delete and add a user.


    All changes made in this chapter will occur inside the app.js file.


    # ## The DHTMLX toolbar


    The DHTMLX toolbar is a very handy component for applications or web pages. It
    allows us to quickly and easily create a robust series of buttons, dropdowns,
    and inputs.


    When creating a DHTMLX toolbar, we have the freedom to place it inside a DOM element,
    a DHTMLX layout or a DHTMLX cell. But when attaching toolbars to the DHTMLX layout
    or cell, each are both limited to one. The following screenshots shows the differences
    of attaching a toolbar to a layout object and a cell object.


    This screenshot shows an empty toolbar and what it looks like when one is attached
    to a layout object:


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_55_0.png)'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'The DHTMLX Toolbar


    This screenshot shows a toolbar attached to a cell object:


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_56_0.png)


    # The methods and events


    Now open up the Chrome browser with the developer tools visible console, and we
    will begin to learn about the DTHMLX toolbar object. We will attach a toolbar,
    add toolbar items, and bind events.


    # Initialization choices


    The DHTMLX toolbar can be initiated in two ways. The first way is by attaching
    it to a DOM element. The second way is by attaching it to an existing DHTMLX layout
    or cell.


    # Initialization on a DOM element


    First we will attach a toolbar to a DOM element. For these exercises, we will
    be using the same web page as the application. To test attaching a toolbar to
    a DOM element, we must first clear the page and create an element inside the `body`
    tag. We will do this with JavaScript.


    Type and run the following code line in the console:


    ```

    document.body.innerHTML = "<div id=''myToolbarCont''></div>";

    ```


    We just cleared the contents of the body and replaced it with a `div` tag that
    has the `id` attribute of `myToolbarCont`.


    Next initialize and attach a toolbar to that `div`.


    [ 42 ]'
