    \ be retrieved by using the idByIndex method. This will allow us to access the\
    \ data object after it has been added.\n\nLet's get the ID for the data object\
    \ of Steve. Type and run the following code in the console:\n\n```\nvar steveDataId\
    \ = myChart.idByIndex(0);\n```\n\nNow, we have assigned the ID that was generated\
    \ by DHTMLX to our steveDataId variable.\n\n# get()\n\nThe get method pulls all\
    \ the data we added earlier with the add method for Steve. It takes the argument\
    \ of the associated data ID we want to retrieve. The returned data object is not\
    \ read-only. We can use that same object to change the values and refresh the\
    \ grid to apply the changes.\n\nType and run the following code in the console:\n\
    \n```\nvar steveData = myChart.get(steveDataId);\n```"
  merge: -1
  pgno: 110
- img_proc: true
  md: "You can see in the console that we have all the data that was originally created\
    \ for Steve. Well, it appears Steve doesn't like to be called Steve but would\
    \ rather be called Steven. Let's update that for him.\n\nType and run the following\
    \ code in the console:\n\n```\nsteveData.name = \"Steven\";\nmyChart.refresh();\n\
    ```\n\nAs you see his name is now changed.\n\nNow we will look at the events.\n\
    \n# Events\n\nThere are many events available for the chart. For now let's take\
    \ a look at one of them to give us enough of an idea for future usage of the others\
    \ available.\n\n# onItemClick\n\nThe `onItemClick` event is triggered when we\
    \ click on each of the bars in our chart. It will return the data object ID of\
    \ the clicked item. Let's use this event to show an alert telling us whose data\
    \ we just clicked on.\n\nType and run the following code in the console:\n\n```\n\
    myChart.attachEvent(\"onItemClick\", function(id){\n  alert(\"This is data for\
    \ \"+myChart.get(id).name);\n});\n```\n\nNow, when we click each of the bars we\
    \ see an alert telling us the name of that data.\n\nWe covered more than all of\
    \ the necessary chart methods and events that are needed for the application.\
    \ Let's start applying what we've learned.\n\n# The application code\n\nFor the\
    \ application, we are going to show a series of data based on the age of each\
    \ of our users added through the form. This will match up with the grid any time\
    \ data is changed. As mentioned before we will be using a bar chart and will create\
    \ all necessary settings in the initialization method with the passed in object.\n\
    \nFirst, we will add the creation method in our `app.js` file directly after our\
    \ form creation method. This will have our global chart variable and create method."
  merge: -1
  pgno: 111
- img_proc: true
  md: "The DHTMLX Chart\n\n# Creating the chart\n\nAdd the following code to the `app.js`\
    \ file at the end:\n\n```\n// Chart\nvar appChart;\ndhtmlxEvent(window,\"load\"\
    ,function(){\n    appChart = appLayout.cells(\"b\").attachChart({\n        view:\
    \ \"bar\",\n        value: \"#age#\",\n        label: \"#age#\",\n        gradient:\
    \ \"rising\",\n        tooltip: {\n            template: \"#age#\"\n        },\n\
    \        xAxis: {\n            title: \"Users\",\n            template: \"#name#\"\
    ,\n            lines: false\n        },\n        yAxis: {\n            title:\
    \ \"Years of Age\",\n            lines: true\n        },\n        padding: {\n\
    \            left: 25,\n            right: 10,\n            top: 45\n        }\n\
    \    });\n    // reset chart data\n    callbacks.refreshChart();\n});\n```\n\n\
    First, we created a global variable and then created a chart inside the page load\
    \ event handler. Inside the chart initialization, we applied all the settings\
    \ that we just learned with the addition of `gradient` and `yAxis`. The `gradient`\
    \ sets a nice gradient effect on the bars. The `yAxis` will show lines and numbers\
    \ for the ages on the left side of the chart.\n\nAfter the initialization, we\
    \ called the `callbacks.refreshChart`, which will refresh the chart data the same\
    \ way we did for the grid."
  merge: -1
  pgno: 112
- img_proc: true
  md: "# callbacks.refreshChart()\n\nInside the `callbacks` object `refreshChart`\
    \ method, we will clear and add data to the chart.\n\nEdit the `refreshChart`\
    \ method as shown in the following code:\n\n```\nrefreshChart: function(){\n \
    \   appChart.clearAll();\n    appChart.parse(storage.getUserBarChart(), \"json\"\
    );\n},\n```\n\n# callbacks.dataChanged()\n\nInside the `callbacks` object `dateChanged`\
    \ method, we will add the `refreshChart` method.\n\nEdit the `dataChanged` method\
    \ as follows:\n\n```\ndataChanged: function(){\n    callbacks.refreshGrid();\n\
    \    callbacks.refreshChart();\n}\n```\n\nNow we can test the chart!\n\n# Test\
    \ the application\n\nFirst, clear our local storage data once again.\n\nType and\
    \ run the following code in the console:\n\n```\nlocalStorage.clear()\n```\n\n\
    Now, refresh the page and the chart and grid should be empty.\n\nWe are going\
    \ to add some users to the application, but first we need to take a look at something.\
    \ Click on the **add** button for the pop up. Move the pop-up window over the\
    \ chart by dragging the header. In the current version, at the time of writing\
    \ this book, the chart has a higher z-index than the pop-up window, which doesn't\
    \ allow us to use the pop up correctly. This can be fixed with a small CSS change.\n\
    \nIf you are having this issue, let's fix it by going into our `index.html` CSS\
    \ and adding the following CSS to the end of our styles:\n\n```\n.dhx_chart{ z-index:\
    \ 1; }\n```"
  merge: -1
  pgno: 113
