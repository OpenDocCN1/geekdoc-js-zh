- md: "## addButton\n\nThe `addButton` method adds a button to a toolbar. Buttons\
    \ are a clickable item that can have text and an icon.\n\nThe parameters are the\
    \ ID of the button, its position in the toolbar, the button text, an enabled icon\
    \ (optional), and lastly a disabled icon (optional).\n\nType and run the following\
    \ code line in the console:\n\n```\nmyToolbar.addButton(\"myButtonId\", 0, \"\
    My Button\");\n```\n\nNow, there is a button added to the toolbar with the text\
    \ of `My Button`.\n\n## addButtonTwoState\n\nThe `addButtonTwoState` method creates\
    \ a toggle button, which keeps a Boolean state. This method has the same parameters\
    \ as the `addButton` method. When this item is clicked, it fires the toolbar's\
    \ `onStateChange` event.\n\nType and run the following code line in the console:\n\
    \n```\nmyToolbar.addButtonTwoState(\"myButton2StateId\", 1, \"2 State\");\n```\n\
    \nNow there is a new item on the toolbar with the text of **2 State**. When this\
    \ new item is clicked, it will toggle between active and inactive.\n\n## getItemState\n\
    \nThe `getItemState` method is used to retrieve the pressed state for the **two-state**\
    \ button and returns a Boolean.\n\nType and run the following code line in the\
    \ console:\n\n```\nmyToolbar.getItemState(\"myButton2StateId\");\n```\n\nThis\
    \ returns either `true` or `false` in the console.\n\n## addSeparator\n\nThe `addSeparator`\
    \ method creates a vertical line to show a division between the toolbar items.\
    \ The only parameters are ID and position.\n\nType and run the following code\
    \ line in the console:\n\n```\nmyToolbar.addSeparator(\"sepId\", 2);\n```\n\n\
    Now there is a separator line to the right of the **two-state** button.\n\nThe\
    \ DHTMLX Toolbar\n\n## addText\n\nThe `addText` method creates a text item. This\
    \ is helpful when you need to create a label for another toolbar item.\n\nType\
    \ and run the following code line in the console:\n\n```\nmyToolbar.addText(\"\
    myTextId\", 3, \"A Label: \");\n```\n\nThere is a text item on the toolbar to\
    \ the right of the separator.\n\n## addButtonSelect\n\nThe `addButtonSelect` method\
    \ is a little more complicated than the previous items. This creates a select\
    \ button similar to an HTML select element.\n\nThe parameters are the ID, position,\
    \ text, JavaScript array of the options, an enabled icon (optional), a disabled\
    \ icon (optional), and additional advanced parameters.\n\nThe following is an\
    \ example for the JavaScript array of options. The parameters are ID, type, text,\
    \ and icon (optional).\n\n```\n[\"myOptionId\", \"obj\", \"Option 1\", \"icon.gif\"\
    ]\n```\n\nNow let's add a select button to the toolbar. Type and run in the console:\n\
    \n```\nmyToolbar.addButtonSelect(\"mySelectId\", 4, \"Select Me\", [\n  [\"option1\"\
    , \"obj\", \"Option 1\"],\n  [\"option2\", \"obj\", \"Option 2\"]\n]);\n```\n\n\
    There is now a select button added to the toolbar. Clicking on the arrow will\
    \ open the select button items. When an option is selected, the option gets highlighted.\
    \ A selection is remembered the next time the select button is opened.\n\n> There\
    \ are additional parameters in the DHTMLX documentation for the `addButtonSelect`\
    \ method that allow the created select button to behave more like an HTML select\
    \ element.\n\n## getListOptionSelected\n\nThe `getListOptionSelected` method will\
    \ return the ID of the currently selected item in the select button.\n\nType and\
    \ run the following code line in the console:\n\n```\nmyToolbar.getListOptionSelected(\"\
    mySelectId\");\n```\n\nIn the console, the currently selected option ID is returned.\n\
    \n## addSpacer\n\nThe `addSpacer` method divides the left side of the toolbar\
    \ from the right. The items to the right of the item with the spacer will now\
    \ be aligned to the right in the toolbar.\n\nThe only parameter this takes is\
    \ the ID of the toolbar item you would like to add the spacer to. We will add\
    \ this to the first button with the ID of `myButtonId`.\n\nType and run the following\
    \ code line in the console:\n\n```\nmyToolbar.addSpacer(\"myButtonId\");\n```\n\
    \nNow all of items to the right of My Button are aligned to the right of the toolbar.\n\
    \n## removeSpacer\n\nThe `removeSpacer` method removes a spacer from the toolbar.\
    \ Type and run the following code line in the console:\n\n```\nmyToolbar.removeSpacer(\"\
    myButtonId\");\n```\n\nThe toolbar spacer is now removed and all items are aligned\
    \ to the left.\n\n## addSlider\n\nThe `addSlider` method creates a slider item,\
    \ which will hold the value for later retrieval either on an event or specific\
    \ request. The parameters for this item are ID, position, length of slider in\
    \ pixels as integer, minimum value, maximum value, current value, label left side,\
    \ label right side, and tooltip (optional).\n\nType and run the following code\
    \ line in the console:\n\n```\nmyToolbar.addSlider(\"mySliderId\", 5, 40, 1, 10,\
    \ 4, \"Low\", \"High\");\n```\n\nThe DHTMLX Toolbar\n\n## addInput\n\nThe `addInput`\
    \ method creates a form like input in the toolbar. Its parameters are ID, position,\
    \ initial value, and width in pixels as `int`.\n\nType and run the following code\
    \ line in the console:\n\n```\nmyToolbar.addInput(\"myInputId\", 6, \"Hi\", 30);\n\
    ```\n\nWe now have an input with a default value of Hi.\n\n## getValue\n\nThe\
    \ `getValue` method returns the value of a slider or input toolbar item.\n\nType\
    \ and run the following code line in the console:\n\n```\nmyToolbar.getValue(\"\
    myInputId\");\n```\n\nYou now see in the console, the initial value we set for\
    \ the input.\n\n## disableItem and enableItem\n\nThe `disableItem` renders an\
    \ item disabled and `enableItem` does the reverse.\n\nType and run the following\
    \ code line in the console:\n\n```\nmyToolbar.disableItem(\"myButtonId\");\n```\n\
    \nThe button is now disabled and will not trigger any events.\n\nNow enable the\
    \ button. Type and run the following code line in the console:\n\n```\nmyToolbar.enableItem(\"\
    myButtonId\");\n```\n\n## hideItem and showItem\n\nThe `hideItem` hides the toolbar\
    \ item and the `showItem` does the reverse.\n\nType and run the following code\
    \ line in the console:\n\n```\nmyToolbar.hideItem(\"myButtonId\");\n```\n\nType\
    \ and run the following code line in the console:\n\n```\nmyToolbar.showItem(\"\
    myButtonId\");\n```\n\nHiding and showing toolbar items can be helpful when restricting\
    \ permissions to features.\n\n## removeItem\n\nThe `removeItem` method removes\
    \ an item from the toolbar. Type and run the following code line in the console:\n\
    \n```\nmyToolbar.removeItem(\"myInputId\");\n```\n\nThe input is now removed from\
    \ the toolbar.\n\n## Toolbar events\n\nNow that we have covered the different\
    \ types of items and how to get their values, we will talk about the events that\
    \ can be triggered. The toolbar events we will cover are `onClick`, `onStateChange`,\
    \ `onValueChange`, and `onEnter`.\n\nThe parameters for these events are the event\
    \ name and handler function. When triggered, the event handler will provide an\
    \ argument of the item ID which triggered the event.\n\n## onClick\n\nThe `onClick`\
    \ event listens to any clicks on the toolbar's items.\n\nLet's add this event\
    \ to the toolbar. Type and run the following code line in the console:\n\n```\n\
    myToolbar.attachEvent(\"onClick\", function(itemId) {\n    console.log(itemId);\n\
    });\n```\n\nNow, click on the toolbar button item and see the item ID being logged\
    \ in the console. Also note that the select button will act as a button when clicking\
    \ left of the arrow.\n\n## onValueChange\n\nThe `onValueChange` event fires when\
    \ the toolbar slider item value is changed.\n\n## onStateChange\n\nThe `onStateChange`\
    \ event fires when the toolbar two-state button item state is changed.\n\n## onEnter\n\
    \nThe `onEnter` event fires when the *Enter* key is pressed inside the toolbar\
    \ input item.\n\n## The application code\n\nWe covered a lot of what DHTMLX has\
    \ to offer in its toolbar component. This will get us going for the application\
    \ code.\n\nOpen the `app.js` file and get ready to start writing code.\n\n## Creating\
    \ the toolbar\n\nNow we will create the toolbar for the application. We will use\
    \ a JavaScript object literal to create the toolbar.\n\nEnter the following code\
    \ directly below where the layout is created in the `app.js` file:\n\n```\n//\
    \ Toolbar\nvar appToolbar;\ndhtmlxEvent(window, \"load\", function(){\n    //\
    \ create toolbar\n    appToolbar = appLayout.cells(\"a\").attachToolbar({\n  \
    \      items: [\n            { type: \"button\", id: 1, text: \"add\" },\n   \
    \         { type: \"separator\", id: 2 },\n            { type: \"button\", id:\
    \ 3, text: \"remove\" },\n            { type: \"separator\", id: 4 },\n      \
    \  ]\n    });\n    // attach toolbar events\n    appToolbar.attachEvent(\"onClick\"\
    , function(id){\n        switch(id){\n            case \"1\": callbacks.addClick();\
    \ break;\n            case \"3\": callbacks.removeClick(); break;\n          \
    \  default: break;\n        }\n    });\n});\n```"
  mdcn: "\n## addButton\n\n`addButton` 方法用于向工具栏添加一个按钮。按钮是可点击的项目，可以包含文本和图标。\n\n参数包括按钮的ID、在工具栏中的位置、按钮文本、启用时的图标（可选），以及禁用时的图标（可选）。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.addButton(\"myButtonId\", 0, \"My Button\"\
    );\n```\n\n现在，工具栏上已添加一个文本为 `My Button` 的按钮。\n\n## addButtonTwoState\n\n`addButtonTwoState`\
    \ 方法创建一个切换按钮，该按钮会保持一个布尔状态。此方法与 `addButton` 方法具有相同的参数。当此项目被点击时，它会触发工具栏的 `onStateChange`\
    \ 事件。\n\n在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.addButtonTwoState(\"myButton2StateId\"\
    , 1, \"2 State\");\n```\n\n现在工具栏上有一个新项目，其文本为 **2 State**。当点击此新项目时，它会在激活和非激活状态之间切换。\n\
    \n## getItemState\n\n`getItemState` 方法用于获取**双状态**按钮的按下状态，并返回一个布尔值。\n\n在控制台中输入并运行以下代码行：\n\
    \n```\nmyToolbar.getItemState(\"myButton2StateId\");\n```\n\n控制台将返回 `true` 或 `false`。\n\
    \n## addSeparator\n\n`addSeparator` 方法创建一条垂直线，用于分隔工具栏项目。唯一的参数是ID和位置。\n\n在控制台中输入并运行以下代码行：\n\
    \n```\nmyToolbar.addSeparator(\"sepId\", 2);\n```\n\n现在在**双状态**按钮的右侧有一条分隔线。\n\n\
    DHTMLX 工具栏\n\n## addText\n\n`addText` 方法创建一个文本项目。当需要为另一个工具栏项目创建标签时，此方法很有用。\n\n\
    在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.addText(\"myTextId\", 3, \"A Label: \");\n\
    ```\n\n在工具栏上，分隔线的右侧出现了一个文本项目。\n\n## addButtonSelect\n\n`addButtonSelect` 方法比之前的项目稍微复杂一些。它创建一个类似于\
    \ HTML select 元素的下拉选择按钮。\n\n参数包括ID、位置、文本、选项的JavaScript数组、启用时的图标（可选）、禁用时的图标（可选），以及额外的高级参数。\n\
    \n以下是选项JavaScript数组的示例。参数包括ID、类型、文本和图标（可选）。\n\n```\n[\"myOptionId\", \"obj\",\
    \ \"Option 1\", \"icon.gif\"]\n```\n\n现在，让我们向工具栏添加一个下拉选择按钮。在控制台中输入并运行：\n\n```\n\
    myToolbar.addButtonSelect(\"mySelectId\", 4, \"Select Me\", [\n  [\"option1\"\
    , \"obj\", \"Option 1\"],\n  [\"option2\", \"obj\", \"Option 2\"]\n]);\n```\n\n\
    现在工具栏上已添加一个下拉选择按钮。点击箭头将打开下拉选项。当选择一个选项时，该选项会高亮显示。下次打开下拉选择按钮时，上次的选择将被记住。\n\n> DHTMLX\
    \ 文档中对于 `addButtonSelect` 方法有额外的参数，允许创建的下拉选择按钮表现得更像 HTML select 元素。\n\n## getListOptionSelected\n\
    \n`getListOptionSelected` 方法将返回下拉选择按钮中当前选中项目的ID。\n\n在控制台中输入并运行以下代码行：\n\n```\n\
    myToolbar.getListOptionSelected(\"mySelectId\");\n```\n\n控制台将返回当前选中的选项ID。\n\n\
    ## addSpacer\n\n`addSpacer` 方法将工具栏的左侧与右侧分开。位于此项目右侧的项目现在将在工具栏中右对齐。\n\n它接受的唯一参数是你想要添加间隔的工具栏项目的ID。我们将把它添加到ID为\
    \ `myButtonId` 的第一个按钮上。\n\n在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.addSpacer(\"myButtonId\"\
    );\n```\n\n现在，My Button 右侧的所有项目都与工具栏右侧对齐。\n\n## removeSpacer\n\n`removeSpacer`\
    \ 方法从工具栏中移除一个间隔。在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.removeSpacer(\"myButtonId\"\
    );\n```\n\n工具栏的间隔现在已被移除，所有项目都左对齐。\n\n## addSlider\n\n`addSlider` 方法创建一个滑块项目，该滑块将保存一个值，以便在事件触发或特定请求时检索。此项目的参数是ID、位置、滑块长度（像素，整数）、最小值、最大值、当前值、左侧标签、右侧标签和工具提示（可选）。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.addSlider(\"mySliderId\", 5, 40, 1, 10, 4,\
    \ \"Low\", \"High\");\n```\n\nDHTMLX 工具栏\n\n## addInput\n\n`addInput` 方法在工具栏中创建一个类似表单的输入框。其参数是ID、位置、初始值和宽度（像素，`int`\
    \ 类型）。\n\n在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.addInput(\"myInputId\", 6, \"Hi\"\
    , 30);\n```\n\n现在我们有了一个默认值为 \"Hi\" 的输入框。\n\n## getValue\n\n`getValue` 方法返回滑块或输入框工具栏项目的值。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.getValue(\"myInputId\");\n```\n\n现在你可以在控制台中看到我们为输入框设置的初始值。\n\
    \n## disableItem 和 enableItem\n\n`disableItem` 方法将项目渲染为禁用状态，`enableItem` 方法则相反，将其启用。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.disableItem(\"myButtonId\");\n```\n\n按钮现在被禁用，不会触发任何事件。\n\
    \n现在启用该按钮。在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.enableItem(\"myButtonId\");\n```\n\
    \n## hideItem 和 showItem\n\n`hideItem` 方法隐藏工具栏项目，`showItem` 方法则相反，将其显示出来。\n\n\
    在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.hideItem(\"myButtonId\");\n```\n\n在控制台中输入并运行以下代码行：\n\
    \n```\nmyToolbar.showItem(\"myButtonId\");\n```\n\n在限制功能访问权限时，隐藏和显示工具栏项目会很有用。\n\
    \n## removeItem\n\n`removeItem` 方法从工具栏中移除一个项目。在控制台中输入并运行以下代码行：\n\n```\nmyToolbar.removeItem(\"\
    myInputId\");\n```\n\n输入框现在已从工具栏中移除。\n\n## 工具栏事件\n\n现在我们已经介绍了不同类型的项目以及如何获取它们的值，接下来我们将讨论可以被触发的事件。我们将要介绍的工具栏事件包括\
    \ `onClick`、`onStateChange`、`onValueChange` 和 `onEnter`。\n\n这些事件的参数是事件名称和处理函数。当事件被触发时，事件处理函数将提供触发该事件的项目ID作为参数。\n\
    \n## onClick\n\n`onClick` 事件监听工具栏项目的任何点击操作。\n\n让我们将此事件添加到工具栏。在控制台中输入并运行以下代码行：\n\
    \n```\nmyToolbar.attachEvent(\"onClick\", function(itemId) {\n    console.log(itemId);\n\
    });\n```\n\n现在，点击工具栏上的按钮项目，你会看到项目ID被记录到控制台。另外请注意，点击下拉选择按钮箭头左侧时，它也会作为一个按钮触发事件。\n\
    \n## onValueChange\n\n当工具栏滑块项目的值发生变化时，`onValueChange` 事件会被触发。\n\n## onStateChange\n\
    \n当工具栏双状态按钮项目的状态发生变化时，`onStateChange` 事件会被触发。\n\n## onEnter\n\n当在工具栏输入框项目内按下 *Enter*\
    \ 键时，`onEnter` 事件会被触发。\n\n## 应用程序代码\n\n我们已经介绍了 DHTMLX 工具栏组件提供的大量功能。这将为我们编写应用程序代码打下基础。\n\
    \n打开 `app.js` 文件，准备开始编写代码。\n\n## 创建工具栏\n\n现在我们将为应用程序创建工具栏。我们将使用一个 JavaScript 对象字面量来创建工具栏。\n\
    \n在 `app.js` 文件中布局创建代码的下方，输入以下代码：\n\n```\n// Toolbar\nvar appToolbar;\ndhtmlxEvent(window,\
    \ \"load\", function(){\n    // create toolbar\n    appToolbar = appLayout.cells(\"\
    a\").attachToolbar({\n        items: [\n            { type: \"button\", id: 1,\
    \ text: \"add\" },\n            { type: \"separator\", id: 2 },\n            {\
    \ type: \"button\", id: 3, text: \"remove\" },\n            { type: \"separator\"\
    , id: 4 },\n        ]\n    });\n    // attach toolbar events\n    appToolbar.attachEvent(\"\
    onClick\", function(id){\n        switch(id){\n            case \"1\": callbacks.addClick();\
    \ break;\n            case \"3\": callbacks.removeClick(); break;\n          \
    \  default: break;\n        }\n    });\n});\n```\n"
