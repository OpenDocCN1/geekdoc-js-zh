    \  return {\n        \"id\": user.id,\n        \"data\": data\n    }\n},\n```\n\
    \n## getUserGrid\n\nThe `getUserGrid` method will return the formatted object\
    \ to be loaded into the DHTMLX grid. It loops through `localStorage` utilizing\
    \ the `localStorage` key method, and checks to make sure we don't add our `lastStoredId`\
    \ value to our grid. Next, the `gridRow` method formats the individual rows with\
    \ the data retrieved from `localStorage`. Lastly, we structure the return object\
    \ and add the `total_count` property with the value of rows length:\n\n```\ngetUserGrid:\
