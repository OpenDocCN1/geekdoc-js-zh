  md: '# # About the Author


    **Eli Geske** is an entrepreneurial graphics designer turned programmer. He has
    been involved in web applications from creating and enhancing online gaming communities,
    to building applications that improve company''s efficiency. He has also invented
    products, put in for patents, and pushed them to market. His programming skills
    range from JavaScript, PHP, and C# which he uses in the medical industry, payment
    processing industry, and on custom order management sites. He also has a degree
    in computer science, focusing on networking and web server administration.


    His knowledge of DHTMLX springs from his daily engagements in a current large
    scale medical application.


    Some other of Eli''s writings and public offerings can be viewed on his blog www.eligeske.com
    or on eligeske.github.com.


    > Throughout the past couple of years, my daily involvement with the DHTMLX components
    Suite has included working with a wonderful development team locally and abroad.
    These people have given me the ability to expand my knowledge and learn new things.
    I''d like to send out thanks to Igor Lopez, Bruno Spinelli, Tengiz Tutisani, Jaya
    Uradhanda, Sergey Bilida, Dmitry Shumarov, and Sergio Reyes who are a part of
    that great team! I would also like to thank, Roberto and Victor Beraja, whose
    visions have stretched the DHTMLX library to its limits on more than one occasion.
    Cheers!'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# About the Reviewers


    **Asen Bozhilov** is web developer with years of experience in web technologies.
    Currently, he is working on XULRunner applications using JavaScript and XUL. He
    has a bachelor''s degree in computer science. In his spare time, he likes to experiment
    with new technologies and programming languages. His interests are mostly in the
    computer sciences, but he also enjoys sport activities.


    He has reviewed other JavaScript books, such as *Maintainable JavaScript*, *JavaScript
    Patterns*, and *JavaScript for PHP developers*.


    **Ali Farhadi** is a senior web developer and system administrator living in Mashhad,
    Iran. He is passionate about working on open source technology and has contributed
    to the major PHP frameworks, CakePHP, and Lithium.


    He is also one of the pioneers in the Persian node.js community and has contributed
    to the core project since 2009. He has also authored a few open source projects
    notably the HTML5Sortable jQuery plugin and SMPP module for node.js.


    You can read more about him and his works at his website `http://farhadi.ir`.'
