  md: '# The DHTMLX Toolbar


    Type and run the following code line in the console:


    ```

    appLayout.cells("a").attachToolbar(); // 1st toolbar

    childLayout.attachToolbar(); // 2nd toolbar

    childLayout.cells("a").hideHeader(); // hide cell header

    childLayout.cells("a").attachToolbar(); // 3rd toolbar

    ```


    There are now three toolbars appearing one on top of the other.


    Now that we know how to initialize a DHTMLX toolbar, we can start adding items.


    # Toolbar items


    The DHTMLX toolbar has several different item types:


    +   - Button

    - Two-state button (Toggle)

    - Button select (Select)

    - Slider

    - Input

    - Text (Label)

    - Separator

    - Spacer


    We will now go over each of them and see how they work.


    First refresh the page to clear the previous exercise code.


    Now we will add a new toolbar to cell a. We will use this toolbar to add the items
    for the next exercises.


    Type and run the following code line in the console:


    ```

    var myToolbar = appLayout.cells("a").attachToolbar();

    ```


    > When adding items to the toolbar; if the items exceed the width of the cell,
    those items will not be visible. For this exercise, make sure you have enough
    cell width to show all items that will be added.'
