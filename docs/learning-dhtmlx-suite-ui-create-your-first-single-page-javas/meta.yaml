    # # User Management Web App


    In this chapter, we will go over what DHTMLX is and the different ways in which
    we can use it. It is good to know that there are other options available and why
    DHTMLX stands out as a great choice for small-sized to full-sized web applications
    compared to others. We will also explain the application we will build, components
    that will be used, and what is needed to achieve this.


    # ## About DHTMLX


    DHTMLX is a robust set of JavaScript components used for client-side, desktop-like
    web applications or websites. It also has server-side connection scripts to better
    help format the data structure to and from chosen types of server-side storage.
    Each of the DHTMLX''s components can be used as individual features to your website
    or combined to create a full scale web application. All of these components work
    nicely together.


    If you have been searching the Web for different components like grids or modal
    windows, you probably have seen some of the large variety of other options out
    there. There are jQuery-driven grids, custom JavaScript modal windows, and full
    scale libraries of components similar to DHTMLX.


    # ## DHTMLX and other component libraries


    The major difference in the available JavaScript components is that most are small
    and contain only one or two different components. If you plan on just using a
    grid for a project, there are many good choices out there. Some of the better
    known smaller JavaScript component libraries for grids are jqGrid and SlickGrid.


    Surprisingly, I have found that DHTMLX''s grid has more options than even the
    single libraries specializing in grids. Also, one must be careful of choosing
    a standalone library, as the documentation and maturity can sometimes be an issue.'
  - '[PAGE 22]


    *User Management Web App*


    What about the more robust component libraries?


    One of DHTMLX''s comparable libraries is **Sencha Ext JS**. They both aim to give
    the developer the tools needed to build rich desktop-like applications in a web
    environment. They also provide both a free version as well as a paid version which
    includes support.


    The major difference between these two component libraries is their documentation
    and coding structure. Sencha Ext JS has a very granular documentation that, when
    learned, is very beneficial. DHTMLX has a straight to the point list of available
    methods and events which are available for each component.


    Today, more and more web designers want to make applications. These designers
    have a better understanding of a customer''s needs and how to create a more user-friendly
    application. These designers may not have an in-depth understanding of programming
    and documentation. DHTMLX caters toward this very well.


    # The components


    Let''s get familiar with some of the components that DHTMLX has to offer and go
    over exactly what a component is.


    A component in DHTMLX is a JavaScript object that is used to present and allow
    interaction of data to the end user in a clean and efficient manner. DHTMLX does
    all of the heavy lifting by creating the HTML in a presentable layout that is
    cross-browser friendly.


    What is also important about a component is that they can be used together in
    a combination of components or separately in a block-level DOM element.


    DHTMLX offers the following components:


    +   - Grid

    - Tree

    - Tree Grid

    - Layout

    - Windows

    - Toolbar

    - DataView

    - ColorPicker

    - Editor'
  - '[PAGE 23]


    +   * Chart

    * Menu

    * Form

    * Combo

    * TabBar

    * Calendar


    > The DHTMLX team is hard at work adding new components frequently, so it is beneficial
    to check their website for a list of currently available components.


    DHTMLX also provides an online skin builder and a Visual Designer tool. The skin
    builder allows for editing the CSS of a current skin or downloading one of the
    many existing skins. For our application, we will use the default "Blue Sky" skin.


    The Visual Designer tool is a graphical user interface that allows a user to create
    code without having to actually write it. This is free, and is available on the
    DHTMLX website.


    # What will we be building?


    Trumpets, please! We will be building a simple user management web application
    without a server-side database. Instead, we will be using HTML5''s local storage.
    This will allow us to get going with DHTMLX quickly without being bound to a specific
    server-side language.


    For the application, we will be using the Layout, Grid, Toolbar, Form, Chart,
    and Window components from the DHTMLX library. The app will provide the ability
    to add, delete, edit a user, and see charted data of those users in the system.'
  - '[PAGE 24]


    # *User Management Web App*


    The following screenshot is what our final application will look like:


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_24_0.png)


    When you are finished with this book, you will have a good understanding of how
    to get the DHTMLX components to work together in a web application.


    # ## Summary


    In this chapter, we covered what DHTMLX provides, which components are going to
    be utilized, and what our application will look like when completed. This brief
    introduction is enough to get us going.


    In the next chapter, we will start the installation process by downloading and
    attaching the scripts in a local web server, then test that the library is installed
    correctly.'
  - '[PAGE 25]


    # # 2 Download, Setup, and Test


    In this chapter, we will go over downloading the DHTMLX library, creating the
    base files and directory structure, and including the library files. We will then
    write the configuration for the application and test the installation with Google
    Chrome developer tools.


    # ## Installing a web server


    DHTMLX requires the application be used on a web server to allow all functionality
    to work. There are several preconfigured web server packages available for downloading
    on the Internet.


    One of the options for Windows is WampServer. It is available at `http://www.wampserver.com`.
    For Mac users, one of the popular web server packages is MAMP. It is available
    at `http://www.mamp.info`.


    Each of these websites provides instructions on using their packages.


    Once you have a web server running, you must locate a directory accessible through
    the web server where you would like to create the application. The examples in
    this book will be using the root of an installed web server as the application
    directory and accessing the application at `http://localhost/`. The book will
    also refer to the `root` as the application directory.


    # ## Creating the application directory structure


    Before downloading the DHTMLX components library, we need to create the application
    directory structure on our web server.'
- md: "## Download, Setup, and Test\n\nLocate the directory accessible on the web\
    \ server where you will be hosting the application. This directory will be your\
    \ application directory.\n\nNow, create a new folder named `js` in the application\
    \ directory. Inside the `js` folder, create a new folder named `application` and\
    \ another named `dhtmlx`. Your directory structure should appear as shown in the\
    \ following figure:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_26_0.png)\n\n\
    We will place all of the JavaScript files that we create for the application inside\
    \ the `application` folder. The DHTMLX library code will be placed inside the\
    \ `dhtmlx` folder.\n\n## Downloading the DHTMLX library\n\nNow, we are going to\
    \ download the DHTMLX library from their website and select which files will be\
    \ used.\n\nOpen up your favorite web browser and navigate to www.dhtmlx.com. Here\
    \ you will see a **Download** link in the menu. Click on the link. You should\
    \ now see a page that looks like the following screenshot:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_26_1.png)\n\
    \nWe want to download the entire library of components. DHTMLX calls this the\
    \ **Suite**. Locate the **Download** link on the page for the **Standard Edition**\
    \ of the Suite and click on the link. This will begin the download of a ZIP file.\
    \ Download it to a location other than the application directory so that we can\
    \ extract and choose which files we will use.\n\nOpen the extracted folder in\
    \ your file manager to view its contents. You will see that it contains many folders,\
    \ a license file, a readme file, an `index.html` file, and several more ZIP files.\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_27_0.png)\n\nThe folders you see contain\
    \ the individual components, which allow the individual use for each component.\n\
    \nThe ZIP files contain the entire library of components in a compressed format\
    \ in different skins.\n\nThe `index.html` file, when opened, provides the documentation\
    \ for the downloaded version of DHTMLX. The DHTMLX documentation is broken down\
    \ into two sections, documentation and samples, with details on each component.\
    \ DHTMLX also provides the most up-to-date version of documentation on the website,\
    \ but having a local copy is pretty handy when working offline, or if you have\
    \ a slow network connection.\n\nNext, we will extract the compressed version of\
    \ the entire library to the application directory. Locate the ZIP file named `dhtmlx_std_full.zip`.\
    \ This contains the actual DHTMLX files which we will use to build the application.\
    \ Extract the contents of the `dhtmlx_std_full.zip` file to the `dhtmlx` folder\
    \ in the `application` directory.\n\nOnce those have been extracted, we will start\
    \ creating our application files.\n\n## Creating the application file app.js\n\
    \nThe first application file is the `app.js` file. This will contain all of the\
    \ JavaScript to create the components and interactions.\n\nLet's start by creating\
    \ the `app.js` file in the `js/application` directory.\n\nInside this file, add\
    \ a `config` object at the top as shown in the following snippets:\n\n```\nvar\
    \ config = {\n    imagePath: \"js/dhtmlx/imgs/\",\n    iconPath: \"\"\n}\n```\n\
    \nThis `config` object contains the global properties for the DHTMLX components.\
    \ The `imagePath` property is the path where the images reside for the components\
    \ styling. The second one which we left blank is the path where the icons will\
    \ be stored. Icons can be used in several different components like the Modal\
    \ Window header and the toolbar buttons.\n\nIcons do not come with DHTMLX and\
    \ have to be added from a free or purchased icons library.\n\n## The data storage\
    \ file\n\nThe next file which we will create for the application is the `storage.js`\
    \ file. This file will contain the mini data access layer that will speak to HTML5\
    \ localStorage. It will contain all of the CRUD methods for the users and displays.\n\
    \nNow, create a new JavaScript file in the `js/application` directory named `storage.js`.\
    \ We will add code to this later.\n\nNext, we will add an HTML file that will\
    \ join the application code together.\n\n## Creating the index.html file\n\nThe\
    \ application will be accessed through the `index.html` file located in the root\
    \ of the application directory. We will set this up now.\n\nIn the root of the\
    \ application directory, add a new file named `index.html`. This should be accessible\
    \ from `http://localhost/index.html`.\n\nNow, add the markup for an HTML5 document\
    \ and include the external DHTMLX files:\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n  <head>\n    <title>Users</title>\n    <link href=\"js/dhtmlx/dhtmlx.css\"\
    \ type=\"text/css\"\n      rel=\"stylesheet\" />\n    <style>\n      /* layout\
    \ css */\n      html, body { height: 100%; width: 100%; }\n    </style>\n    <script\
    \ src=\"js/dhtmlx/dhtmlx.js\"></script>\n    <script src=\"js/application/storage.js\"\
    ></script>\n    <script src=\"js/application/app.js\"></script>\n  </head>\n \
    \ <body>\n  </body>\n</html>\n```\n\n> **Downloading the example code**\nYou can\
    \ download the example code files for all Packt books you have purchased from\
    \ your account at http://www.packtpub.com. If you purchased this book elsewhere,\
    \ you can visit http://www.packtpub.com/support and register to have the files\
    \ e-mailed directly to you.\n\nThe `dhtmlx.css` and `dhtmlx.js` are the only DHTMLX\
    \ library files necessary to include in the DHTMLX library for use. The `storage.js`\
    \ and `app.js` are where the code for the user management application will be\
    \ created.\n\nAdditional CSS was added that sets the `html` and `body` to a height\
    \ and width of 100%. This will allow the DHTMLX layout component, added later,\
    \ to stretch and grow when the browser window is resized. We will be adding more\
    \ CSS here in later chapters.\n\nThe following screenshot displays how your final\
    \ directory structure should appear:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_29_0.png)\n\
    \n## Testing the DHTMLX installation\n\nWe now have the necessary file structure\
    \ and the `index.html` file created. This file includes the external DHTMLX CSS\
    \ and JavaScript files for the application.\n\nNext, we will talk about the Chrome\
    \ developer tools and test if the DHTMLX library files were included correctly.\n\
    \nOpen the Chrome web browser and navigate to `http://localhost/` or `http://localhost/index.html`,\
    \ loading the `index.html` file.\n\nYou should see a blank page displayed.\n\n\
    To make JavaScript development easy, Chrome provides the developer tools. This\
    \ provides many useful tools for developing applications on the Web. The tool\
    \ that we will focus on is the console. There are two ways to access the Chrome\
    \ developer tools console window: through the Chrome menu or through keyboard\
    \ shortcuts. Let's use the keyboard shortcuts approach. On Windows and Linux,\
    \ the keyboard shortcut is `Ctrl + Shift + J`, and for Mac, it is `Cmd + Opt +\
    \ J`. With the provided keyboard shortcuts, open the developer tools console window.\n\
    \nInside the console window which you just opened, type the word `dhtmlx`. This\
    \ will bring up the developer tools intellisense with all of the available properties\
    \ and methods beginning with the word \"dhtmlx\". You should see something similar\
    \ to the next screenshot:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_30_0.png)\n\
    \n> If the intellisense does not open or if you see errors in the console, check\
    \ that you are including the files correctly.\n\nNow, we will do a further test\
    \ to check that the CSS is correct. For this we will add a DHTMLX layout object\
    \ to the page.\n\nType the following line of code into the console and then press\
    \ *Enter*:\n\n```\nnew dhtmlXLayoutObject(document.body);\n```\n\nThe page is\
    \ now divided into three separate containers as shown in the following screenshot:\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_31_0.png)\n\n> If you see only a gray\
    \ screen, this means that you haven't added the height and width CSS styles to\
    \ the HTML and body tag.\n\nThe three containers you see in the browser are the\
    \ DHTMLX layout cells. These will be discussed in a later chapter. This simple\
    \ test is enough to show that we have the files set up correctly. The installation\
    \ and testing is now complete.\n\n## Summary\n\nIn this chapter, we covered downloading\
    \ the DHTMLX Suite and the local documentation. We also created all of the necessary\
    \ files to start the application, and explored using the Chrome developer tools.\
    \ We touched on global configuration variables and what the storage file will\
    \ be used for. You should be pretty comfortable for future chapters when asked\
    \ to open one of these files or developer tools to add lines of code.\n\nIn the\
    \ next chapter, we will start writing code that will access the storage and create\
    \ the data structures for the components."
  mdcn: "\n## 下载、设置与测试\n\n定位到Web服务器上可访问的应用程序目录。该目录将成为你的应用目录。\n\n现在，在应用目录中创建一个名为`js`的新文件夹。在`js`文件夹内，分别创建名为`application`和`dhtmlx`的两个新文件夹。你的目录结构应如下图所示：\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_26_0.png)\n\n我们将把为应用程序创建的所有JavaScript文件放入`application`文件夹中。DHTMLX库代码将放置在`dhtmlx`文件夹内。\n\
    \n## 下载DHTMLX库\n\n现在，我们要从其网站下载DHTMLX库，并选择要使用的文件。\n\n打开你常用的Web浏览器并导航至 www.dhtmlx.com。你会在菜单中看到一个**下载**链接。点击该链接。你现在应该看到一个类似下图截图的页面：\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_26_1.png)\n\n我们想要下载包含所有组件的完整库。DHTMLX称其为**套件**。找到页面上**标准版**套件的**下载**链接并点击。这将开始下载一个ZIP文件。将其下载到一个不是应用目录的位置，以便我们可以解压并选择需要的文件。\n\
    \n在文件管理器中打开解压后的文件夹以查看其内容。你会看到它包含许多文件夹、一个许可证文件、一个自述文件、一个`index.html`文件以及几个额外的ZIP文件。\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_27_0.png)\n\n你看到的文件夹包含各个独立的组件，允许对每个组件单独使用。\n\
    \nZIP文件以压缩格式包含不同皮肤样式的整个组件库。\n\n`index.html`文件打开后提供所下载版本的DHTMLX文档。DHTMLX文档分为两个部分：文档和示例，详细介绍了每个组件。DHTMLX也在网站上提供最新版本的文档，但在离线工作或网络连接较慢时，拥有本地副本非常方便。\n\
    \n接下来，我们将把完整库的压缩版本解压到应用目录。找到名为`dhtmlx_std_full.zip`的ZIP文件。其中包含我们将用于构建应用程序的实际DHTMLX文件。将`dhtmlx_std_full.zip`文件的内容解压到应用目录中的`dhtmlx`文件夹。\n\
    \n一旦解压完成，我们将开始创建应用程序文件。\n\n## 创建应用文件 app.js\n\n第一个应用文件是`app.js`文件。它将包含创建组件和交互的所有JavaScript代码。\n\
    \n让我们首先在`js/application`目录中创建`app.js`文件。\n\n在此文件顶部添加一个`config`对象，如下所示：\n\n```\n\
    var config = {\n    imagePath: \"js/dhtmlx/imgs/\",\n    iconPath: \"\"\n}\n```\n\
    \n此`config`对象包含DHTMLX组件的全局属性。`imagePath`属性是组件样式所需图片的存放路径。我们留空的第二个属性是图标将存储的路径。图标可用于多个不同的组件，例如模态窗口标题和工具栏按钮。\n\
    \n图标不随DHTMLX提供，必须从免费或购买的图标库中添加。\n\n## 数据存储文件\n\n我们将为应用程序创建的下一个文件是`storage.js`文件。此文件将包含与HTML5\
    \ localStorage通信的迷你数据访问层。它将包含用户和显示的增删改查方法。\n\n现在，在`js/application`目录中创建一个名为`storage.js`的新JavaScript文件。我们稍后将为此文件添加代码。\n\
    \n接下来，我们将添加一个HTML文件，将应用代码整合在一起。\n\n## 创建 index.html 文件\n\n应用程序将通过位于应用程序目录根目录的`index.html`文件进行访问。我们现在来设置它。\n\
    \n在应用程序目录的根目录中，添加一个名为`index.html`的新文件。它应该可以通过`http://localhost/index.html`访问。\n\
    \n现在，添加一个HTML5文档的标记，并包含外部的DHTMLX文件：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n  <head>\n    <title>Users</title>\n    <link href=\"js/dhtmlx/dhtmlx.css\"\
    \ type=\"text/css\"\n      rel=\"stylesheet\" />\n    <style>\n      /* layout\
    \ css */\n      html, body { height: 100%; width: 100%; }\n    </style>\n    <script\
    \ src=\"js/dhtmlx/dhtmlx.js\"></script>\n    <script src=\"js/application/storage.js\"\
    ></script>\n    <script src=\"js/application/app.js\"></script>\n  </head>\n \
    \ <body>\n  </body>\n</html>\n```\n\n> **下载示例代码**\n你可以从你的账户 http://www.packtpub.com\
    \ 下载已购买的所有Packt图书的示例代码文件。如果你在其他地方购买了本书，可以访问 http://www.packtpub.com/support 并注册，以便直接通过电子邮件接收文件。\n\
    \n`dhtmlx.css`和`dhtmlx.js`是DHTMLX库中使用所必需的仅有文件。`storage.js`和`app.js`将是创建用户管理应用程序代码的地方。\n\
    \n添加了额外的CSS，将`html`和`body`的高度和宽度设置为100%。这将允许稍后添加的DHTMLX布局组件在浏览器窗口调整大小时能够伸展和增长。我们将在后面的章节中添加更多CSS。\n\
    \n下图截图显示了你最终目录结构应有的样子：\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_29_0.png)\n\
    \n## 测试DHTMLX安装\n\n我们现在拥有了必要的文件结构并创建了`index.html`文件。该文件包含了应用程序所需的外部DHTMLX CSS和JavaScript文件。\n\
    \n接下来，我们将讨论Chrome开发者工具，并测试DHTMLX库文件是否正确包含。\n\n打开Chrome Web浏览器并导航至`http://localhost/`或`http://localhost/index.html`，加载`index.html`文件。\n\
    \n你应该看到一个空白页面。\n\n为了方便JavaScript开发，Chrome提供了开发者工具。它为Web应用程序开发提供了许多有用的工具。我们将重点关注的是控制台。有两种方式可以访问Chrome开发者工具控制台窗口：通过Chrome菜单或通过键盘快捷键。让我们使用键盘快捷键方法。在Windows和Linux上，键盘快捷键是`Ctrl\
    \ + Shift + J`，对于Mac，则是`Cmd + Opt + J`。使用提供的键盘快捷键，打开开发者工具控制台窗口。\n\n在刚刚打开的控制台窗口中，输入单词`dhtmlx`。这将启动开发者工具的智能感知功能，显示所有以“dhtmlx”开头的可用属性和方法。你应该看到类似下图截图的内容：\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_30_0.png)\n\n> 如果智能感知未打开或你在控制台中看到错误，请检查文件是否正确包含。\n\
    \n现在，我们将进行进一步的测试，以检查CSS是否正确。为此，我们将在页面中添加一个DHTMLX布局对象。\n\n在控制台中输入以下代码行，然后按*Enter*键：\n\
    \n```\nnew dhtmlXLayoutObject(document.body);\n```\n\n页面现在被分成三个独立的容器，如下图截图所示：\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_31_0.png)\n\n> 如果你只看到一个灰色屏幕，这意味着你尚未将高度和宽度的CSS样式添加到HTML和body标签中。\n\
    \n你在浏览器中看到的三个容器是DHTMLX布局单元格。这些将在后面的章节中讨论。这个简单的测试足以表明我们已正确设置文件。安装和测试现已完成。\n\n##\
    \ 总结\n\n在本章中，我们介绍了下载DHTMLX套件和本地文档。我们还创建了启动应用程序所需的所有文件，并探索了使用Chrome开发者工具。我们提到了全局配置变量以及存储文件的用途。你应该对后续章节中被要求打开这些文件之一或开发者工具来添加代码行感到相当适应。\n\
    \n在下一章中，我们将开始编写访问存储并为组件创建数据结构的代码。\n"
