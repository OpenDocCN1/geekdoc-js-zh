    请通过 `copyright@packtpub.com` 与我们联系，并提供疑似盗版材料的链接。


    感谢您帮助保护我们的作者以及我们为您提供有价值内容的能力。


    ## 问题


    如果您在本书的任何方面遇到问题，可以通过 `questions@packtpub.com` 联系我们，我们将尽力解决。


    ## 用户管理 Web 应用


    在本章中，我们将介绍 DHTMLX 是什么，以及我们可以使用它的不同方式。了解其他可用选项以及为什么 DHTMLX 相较于其他选择脱颖而出，成为中小型到大型
    Web 应用的绝佳选择，这是很有益的。我们还将解释我们将要构建的应用程序、将使用的组件以及实现此目标所需的条件。


    ### 关于 DHTMLX


    DHTMLX 是一套强大的 JavaScript 组件，用于构建客户端、桌面风格的 Web 应用程序或网站。它还包含服务器端连接脚本，以更好地帮助格式化与所选类型的服务器端存储之间来回传输的数据结构。DHTMLX
    的每个组件都可以作为网站的独立功能使用，也可以组合起来创建完整的 Web 应用程序。所有这些组件都能很好地协同工作。


    如果您一直在网络上搜索不同的组件，如网格或模态窗口，您可能已经看到了许多其他选项。有 jQuery 驱动的网格、自定义 JavaScript 模态窗口，以及类似于
    DHTMLX 的完整组件库。


    ### DHTMLX 和其他组件库


    现有 JavaScript 组件的主要区别在于，大多数都很小，只包含一两个不同的组件。如果您计划仅为项目使用一个网格，有很多不错的选择。一些较知名的小型 JavaScript
    组件库用于网格的是 jqGrid 和 SlickGrid。


    令人惊讶的是，我发现 DHTMLX 的网格甚至比专门用于网格的单一库具有更多选项。此外，选择独立库时必须小心，因为文档和成熟度有时可能是个问题。


    那么更强大的组件库呢？


    DHTMLX 的一个可比库是 **Sencha Ext JS**。两者都旨在为开发者提供在 Web 环境中构建丰富桌面风格应用程序所需的工具。它们还提供免费版本以及包含支持的付费版本。


    这两个组件库的主要区别在于其文档和编码结构。Sencha Ext JS 具有非常详细的文档，一旦掌握，非常有益。DHTMLX 则提供了针对每个组件可用方法和事件的直截了当的列表。


    如今，越来越多的 Web 设计师想要创建应用程序。这些设计师更了解客户需求以及如何创建更用户友好的应用程序。这些设计师可能对编程和文档没有深入的理解。DHTMLX
    很好地迎合了这一点。


    ## 组件


    让我们熟悉一下 DHTMLX 提供的一些组件，并确切了解什么是组件。


    DHTMLX 中的组件是一个 JavaScript 对象，用于以清晰高效的方式向最终用户呈现数据并允许交互。DHTMLX 通过创建符合跨浏览器兼容性的可呈现布局的
    HTML 来完成所有繁重工作。


    组件同样重要的是，它们可以组合使用，也可以单独用于块级 DOM 元素。


    DHTMLX 提供以下组件：


    - Grid

    - Tree

    - Tree Grid

    - Layout

    - Windows

    - Toolbar

    - DataView

    - ColorPicker

    - Editor

    - Chart

    - Menu

    - Form

    - Combo

    - TabBar

    - Calendar


    > DHTMLX 团队正在努力频繁添加新组件，因此查看他们的网站以获取当前可用组件列表是有益的。


    DHTMLX 还提供在线皮肤构建器和 Visual Designer 工具。皮肤构建器允许编辑当前皮肤的 CSS 或下载众多现有皮肤之一。对于我们的应用程序，我们将使用默认的“Blue
    Sky”皮肤。


    Visual Designer 工具是一个图形用户界面，允许用户无需实际编写代码即可创建代码。这是免费的，可在 DHTMLX 网站上获取。


    ## 我们将构建什么？


    请鼓掌！我们将构建一个简单的用户管理 Web 应用程序，无需服务器端数据库。相反，我们将使用 HTML5 的本地存储。这将使我们能够快速开始使用 DHTMLX，而不受特定服务器端语言的限制。


    对于该应用程序，我们将使用 DHTMLX 库中的 Layout、Grid、Toolbar、Form、Chart 和 Window 组件。该应用程序将提供添加、删除、编辑用户以及查看系统中这些用户的图表数据的功能。


    以下截图是我们最终应用程序的样子：


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_24_0.png)


    完成本书后，您将很好地理解如何在 Web 应用程序中让 DHTMLX 组件协同工作。


    ### 总结


    在本章中，我们介绍了 DHTMLX 提供的内容、将要使用的组件以及完成后的应用程序外观。这个简短的介绍足以让我们开始。


    在下一章中，我们将通过下载脚本并在本地 Web 服务器中附加脚本开始安装过程，然后测试库是否已正确安装。


    ## 2 下载、设置和测试


    在本章中，我们将介绍下载 DHTMLX 库、创建基础文件和目录结构以及包含库文件。然后我们将编写应用程序的配置，并使用 Google Chrome 开发者工具测试安装。


    ### 安装 Web 服务器


    DHTMLX 要求应用程序在 Web 服务器上使用，以允许所有功能正常工作。互联网上有几个预配置的 Web 服务器包可供下载。


    Windows 的选项之一是 WampServer。它可在 `http://www.wampserver.com` 获取。对于 Mac 用户，一个流行的 Web
    服务器包是 MAMP。它可在 `http://www.mamp.info` 获取。


    这些网站都提供了使用其软件包的说明。


    一旦您的 Web 服务器运行，您必须定位一个可以通过 Web 服务器访问的目录，您希望在该目录中创建应用程序。本书中的示例将使用已安装 Web 服务器的根目录作为应用程序目录，并通过
    `http://localhost/` 访问应用程序。本书还将`root`称为应用程序目录。


    ### 创建应用程序目录结构


    在下载 DHTMLX 组件库之前，我们需要在 Web 服务器上创建应用程序目录结构。

    '
