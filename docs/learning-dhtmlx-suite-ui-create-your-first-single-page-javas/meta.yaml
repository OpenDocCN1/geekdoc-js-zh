  - "[PAGE 73]\n\n# onRowSelect\n\nThe `onRowSelect` event will trigger upon selection\
    \ of a row.\n\nType and run the following code in console:\n\n```\nmyGrid.attachEvent(\"\
    onRowSelect\", function(rowId){\n    console.log(rowId);\n});\n```\n\nNow, when\
    \ you select a row the console will log the ID of that row. This can be perceived\
    \ as a single click.\n\n# The application code\n\nNow, we are going to create\
    \ the user grid for the application. First, we will make the method that creates\
    \ the grid and events. Then, we will add logic to the `callbacks` object and test\
    \ the `storage` object code.\n\n# Create the grid\n\nOpen the `app.js` file and\
    \ add the following code at the end:\n\n```\n// Grid\nvar appGrid;\ndhtmlxEvent(window,\
    \ \"load\", function(){\n    // create grid\n    appGrid = appLayout.cells(\"\
    a\").attachGrid();\n    appGrid.setHeader([\"ID\",\"First Name\",\"MI\",\n   \
    \ \"Last Name\",\"DOB\",\"Email\",\"Active\"]);\n    appGrid.setColTypes(\"ro,ro,ro,ro,ro,ro,ro\"\
    );\n    appGrid.setInitWidths(\"35,*,35,*,75,*,55\");\n    appGrid.setColAlign(\"\
    center,left,center,left,center,left,center\");\n    appGrid.setImagePath(config.imagePath);\n\
    \    appGrid.init();\n\n    // attach grid events\n    appGrid.attachEvent(\"\
    onRowDblClicked\", function(rowId){\n        callbacks.editClick(rowId);\n   \
    \ });\n    appGrid.attachEvent(\"onRowSelect\", function(){\n        callbacks.setToolbarItemStates();\n\
    \    });\n    // reset grid and load it with data\n    callbacks.refreshGrid();\n\
    });\n```"
  - "[PAGE 74]\n\n*The DHTMLX Grid*\n\nFirst, we created the global `appGrid` variable\
