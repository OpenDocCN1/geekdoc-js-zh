  md: '# # 6

    # The DHTMLX Grid


    In this chapter, we will learn about the DHTMLX grid component covering the different
    initializations, events, methods, and settings. We will then add a grid to the
    application that will control the user data.


    All changes done in this chapter will occur inside the app.js file.


    In this chapter, we will start adding code to the callbacks object and use the
    storage object for the first time.


    # ## The DHTMLX grid


    The DHTMLX grid component is one of the more widely used components of the library.
    It has a vast amount of settings and abilities that are so robust we could probably
    write an entire book on them. But since we have an application to build, we will
    touch on some of the main methods and get into utilizing it.


    Some of the cool features that the grid supports is filtering, spanning rows and
    columns, multiple headers, dynamic scroll loading, paging, inline editing, cookie
    state, dragging/ordering columns, images, multi-selection, and events.


    By the end of this chapter, we will have a functional grid where we will control
    the editing, viewing, adding, and removing of users.


    # ## The grid methods and events


    When creating a DHTMLX grid, we first create the object; second we add all the
    settings and then call a method to initialize it. After the grid is initialized
    data can then be added.'
