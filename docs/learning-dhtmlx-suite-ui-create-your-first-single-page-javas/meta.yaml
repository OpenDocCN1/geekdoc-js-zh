    \n## 学习 DHTMLX Suite UI\n\n版权所有 © 2013 Packt Publishing\n\n保留所有权利。未经出版商事先书面许可，不得以任何形式或任何方式复制、存储在检索系统中或传播本书的任何部分，除非在评论文章中嵌入简短引文的情况除外。\n\
    \n本书的准备工作已尽力确保所呈现信息的准确性。然而，本书包含的信息按“原样”出售，无论是明示还是暗示。作者、Packt Publishing 及其经销商和分销商均不对因本书直接或间接造成的任何损害或声称造成的损害承担责任。\n\
