    \ to the application."
  mdcn: "\n## 数据结构、存储与回调\n\n还有一个名为 `total_count` 的属性。这是可选的，但当使用任何类型的分页处理大型数据集时，DHTMLX\
    \ 会用到此属性。此外，它还可用于在网格底部的状态栏中显示记录数。\n\n## gridRow\n\n`gridRow` 方法顾名思义。它将用户对象构造成一个格式化的行项，以用于网格数据：\n\
    \n```\ngridRow: function(user){\n    var data= [];\n    data.push(user.id);\n\
    \    data.push(user.firstName);\n    data.push(user.middleInitial);\n    data.push(user.lastName);\n\
    \    data.push(user.dob);\n    data.push(user.email);\n    data.push((user.active)?\"\
    Yes\":\"No\");\n    return {\n        \"id\": user.id,\n        \"data\": data\n\
    \    }\n},\n```\n\n## getUserGrid\n\n`getUserGrid` 方法将返回格式化后的对象，以便加载到 DHTMLX 网格中。它遍历\
    \ `localStorage`，使用 `localStorage` 的键方法，并检查以确保我们不会将 `lastStoredId` 的值添加到网格中。接下来，`gridRow`\
    \ 方法使用从 `localStorage` 检索到的数据格式化各个行。最后，我们构建返回对象，并使用行长度的值添加 `total_count` 属性：\n\
    \n```\ngetUserGrid: function(){\n    var rows = [];\n    for(var i =0; i<localStorage.length;\
    \ i++){\n        var storageKey = localStorage.key(i);\n        if(storageKey\
    \ != \"lastStoredId\"){\n            var row = localStorage.getItem(storageKey);\n\
    \            row = JSON.parse(row);\n            row = storage.gridRow(row);\n\
    \            rows.push(row);\n        }\n    }\n    return {\n        \"rows\"\
    : rows,\n        \"total_count\": rows.length\n    }\n},\n```\n\n## 图表方法\n\nDHTMLX\
    \ 图表有多种不同的图表类型可供选择。本应用程序将使用的是条形图。与网格类似，它也有自己的数据结构。以下是图表数据结构的示例：\n\n```\n[\n  \
    \  {\"id\":1,\"age\":35,\"name\":\"FirstName1\"},\n    {\"id\":2,\"age\":29,\"\
    name\":\"FirstName2\"}\n]\n```\n\n与加载 JSON 对象的网格不同，条形图将加载一个数组。数组中的每个项都是一个对象，其属性将为每个条形填充我们的图表值。\n\
    \n## barChartItem\n\n`barChartItem` 方法与 `gridRow` 方法类似。它返回从 localStorage 格式化的数据作为一个项，以添加到整个图表数据中：\n\
    \n```\nbarChartItem: function(user){\n    var getDateParts = function(date){\n\
    \        return {\n            d: date.getDate(),\n            m: date.getMonth()+1,\n\
    \            y: date.getFullYear()\n        }\n    }\n    var date = getDateParts(new\
    \ Date());\n    var dob = getDateParts(new Date(user.dob));\n    var age = date.y\
    \ - dob.y;\n\n    if(dob.m < date.m){\n        age--;\n    }\n    if(dob.m ==\
    \ date.m && dob.d > date.d){\n        age--;\n    }\n\n    return {\n        \"\
    id\" : user.id,\n        \"age\" : age,\n        \"active\": user.active,\n  \
    \      \"name\" : user.firstName\n    }\n}\n```\n\n这里，我们使用了 `user` 对象的 `firstName`、`active`\
    \ 和 `dob` 属性。使用 `dob` 属性，我们计算年龄。最后，根据这些值创建项结构并返回。\n\n## createUserBarChart\n\n\
    `createUserBarChart` 遍历 `localStorage` 以检索用户，然后使用 `barChartItem` 方法来构造项数据：\n\n\
    ```\ngetUserBarChart: function(){\n    var items = [];\n    for(var i =0; i<localStorage.length;\
