- md: "## The DHTMLX Chart\n\nThis will give the chart a padding of 100 pixels inside\
    \ the layout cell and now the labels have plenty of room to be readable. The chart\
    \ now looks like the following screenshot:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_108_0.png)\n\
    \n## Define chart type\n\nNow we will change the chart to a bar chart. We have\
    \ already set the chart up with the first series of data. Let's see what happens\
    \ when we change it to a bar chart with the `view` setting.\n\nType and run the\
    \ following code in the console:\n\n```\nmyChart.define(\"view\",\"bar\");\nmyChart.refresh();\n\
    ```\n\nOur chart has been changed to a bar chart. But the layout and labels don't\
    \ look quite right. For this, we need to set the `xAxis` to show the labels at\
    \ the bottom and change up some of the other settings. Let's do that now.\n\n\
    Type and run the following code in the console:\n\n```\nmyChart.define(\"label\"\
    , false);\nmyChart.define(\"padding\", 50);\nmyChart.define(\"xAxis\", {\n   \
    \ title: \"Names\",\n    template: \"#name#\",\n    lines: false\n})\nmyChart.define(\"\
    tooltip\",\"Views (#profileViews#)\");\nmyChart.refresh();\n```\n\nThe chart is\
    \ now more readable. We removed the label and added a tooltip which will display\
    \ the number of profile views when the mouse is hovered over a bar in the chart.\n\
    \nThe `xAxis` setting provides the ability to label the bottom of the chart with\
    \ meaningful labels. As you can see, we added the title of `Names` and each data\
    \ set has a label with the respective person's name. We also set the `lines` property\
    \ to false, which removes the vertical lines from the chart.\n\nThe chart now\
    \ looks like the following screenshot:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_109_0.png)\n\
    \nNext we will cover adding a second series of data to the chart.\n\n## The DHTMLX\
    \ Chart\n\n## addSeries()\n\nThe addSeries method allows us to create additional\
    \ series for the chart. We must provide an object as an argument. Now we will\
    \ add a data series for the age of each person in the chart.\n\nType and run the\
    \ following code in the console:\n\n```\nmyChart.addSeries({\n    value: \"#age#\"\
    ,\n    color: \"purple\",\n    tooltip: \"Age (#age#)\"\n});\nmyChart.refresh();\n\
    ```\n\nInside the object, we set the value, color, and tooltip then refreshed.\
    \ This applied the changes and now the age series has been added.\n\n## idByIndex()\n\
    \nEach data object we added to the chart earlier has an index assigned from the\
    \ chart's internal array. Meaning the first data object for Steve has the index\
    \ of zero. Each of these data objects also has an ID associated with it and can\
    \ be retrieved by using the idByIndex method. This will allow us to access the\
    \ data object after it has been added.\n\nLet's get the ID for the data object\
    \ of Steve. Type and run the following code in the console:\n\n```\nvar steveDataId\
    \ = myChart.idByIndex(0);\n```\n\nNow, we have assigned the ID that was generated\
    \ by DHTMLX to our steveDataId variable.\n\n## get()\n\nThe get method pulls all\
    \ the data we added earlier with the add method for Steve. It takes the argument\
    \ of the associated data ID we want to retrieve. The returned data object is not\
    \ read-only. We can use that same object to change the values and refresh the\
    \ grid to apply the changes.\n\nType and run the following code in the console:\n\
    \n```\nvar steveData = myChart.get(steveDataId);\n```\n\nYou can see in the console\
    \ that we have all the data that was originally created for Steve. Well, it appears\
    \ Steve doesn't like to be called Steve but would rather be called Steven. Let's\
    \ update that for him.\n\nType and run the following code in the console:\n\n\
    ```\nsteveData.name = \"Steven\";\nmyChart.refresh();\n```\n\nAs you see his name\
    \ is now changed.\n\nNow we will look at the events.\n\n## Events\n\nThere are\
    \ many events available for the chart. For now let's take a look at one of them\
    \ to give us enough of an idea for future usage of the others available.\n\n##\
    \ onItemClick\n\nThe `onItemClick` event is triggered when we click on each of\
    \ the bars in our chart. It will return the data object ID of the clicked item.\
    \ Let's use this event to show an alert telling us whose data we just clicked\
    \ on.\n\nType and run the following code in the console:\n\n```\nmyChart.attachEvent(\"\
    onItemClick\", function(id){\n  alert(\"This is data for \"+myChart.get(id).name);\n\
    });\n```\n\nNow, when we click each of the bars we see an alert telling us the\
    \ name of that data.\n\nWe covered more than all of the necessary chart methods\
    \ and events that are needed for the application. Let's start applying what we've\
    \ learned.\n\n## The application code\n\nFor the application, we are going to\
    \ show a series of data based on the age of each of our users added through the\
    \ form. This will match up with the grid any time data is changed. As mentioned\
    \ before we will be using a bar chart and will create all necessary settings in\
    \ the initialization method with the passed in object.\n\nFirst, we will add the\
    \ creation method in our `app.js` file directly after our form creation method.\
    \ This will have our global chart variable and create method.\n\n## The DHTMLX\
    \ Chart\n\n## Creating the chart\n\nAdd the following code to the `app.js` file\
    \ at the end:\n\n```\n// Chart\nvar appChart;\ndhtmlxEvent(window,\"load\",function(){\n\
    \    appChart = appLayout.cells(\"b\").attachChart({\n        view: \"bar\",\n\
    \        value: \"#age#\",\n        label: \"#age#\",\n        gradient: \"rising\"\
    ,\n        tooltip: {\n            template: \"#age#\"\n        },\n        xAxis:\
    \ {\n            title: \"Users\",\n            template: \"#name#\",\n      \
    \      lines: false\n        },\n        yAxis: {\n            title: \"Years\
    \ of Age\",\n            lines: true\n        },\n        padding: {\n       \
    \     left: 25,\n            right: 10,\n            top: 45\n        }\n    });\n\
    \    // reset chart data\n    callbacks.refreshChart();\n});\n```\n\nFirst, we\
    \ created a global variable and then created a chart inside the page load event\
    \ handler. Inside the chart initialization, we applied all the settings that we\
    \ just learned with the addition of `gradient` and `yAxis`. The `gradient` sets\
    \ a nice gradient effect on the bars. The `yAxis` will show lines and numbers\
    \ for the ages on the left side of the chart.\n\nAfter the initialization, we\
    \ called the `callbacks.refreshChart`, which will refresh the chart data the same\
    \ way we did for the grid.\n\n## callbacks.refreshChart()\n\nInside the `callbacks`\
    \ object `refreshChart` method, we will clear and add data to the chart.\n\nEdit\
    \ the `refreshChart` method as shown in the following code:\n\n```\nrefreshChart:\
    \ function(){\n    appChart.clearAll();\n    appChart.parse(storage.getUserBarChart(),\
    \ \"json\");\n},\n```\n\n## callbacks.dataChanged()\n\nInside the `callbacks`\
    \ object `dateChanged` method, we will add the `refreshChart` method.\n\nEdit\
    \ the `dataChanged` method as follows:\n\n```\ndataChanged: function(){\n    callbacks.refreshGrid();\n\
    \    callbacks.refreshChart();\n}\n```\n\nNow we can test the chart!\n\n## Test\
    \ the application\n\nFirst, clear our local storage data once again.\n\nType and\
    \ run the following code in the console:\n\n```\nlocalStorage.clear()\n```\n\n\
    Now, refresh the page and the chart and grid should be empty.\n\nWe are going\
    \ to add some users to the application, but first we need to take a look at something.\
    \ Click on the **add** button for the pop up. Move the pop-up window over the\
    \ chart by dragging the header. In the current version, at the time of writing\
    \ this book, the chart has a higher z-index than the pop-up window, which doesn't\
    \ allow us to use the pop up correctly. This can be fixed with a small CSS change.\n\
    \nIf you are having this issue, let's fix it by going into our `index.html` CSS\
    \ and adding the following CSS to the end of our styles:\n\n```\n.dhx_chart{ z-index:\
    \ 1; }\n```\n\n## The DHTMLX Chart\n\nNow, refresh the page and try using the\
    \ pop up once again. Everything works and the pop-up window is on top once again.\n\
    \nLet's start adding some data. Use the pop-up window to add the following users:\n\
    \n- John Smith, jsmith@email.com, 1-1-1963\n- Tim Smith, tsmith@email.com, 1-1-1963\n\
    - Alice Chance, achange@email.com, 6-23-1972\n- Bob White, bwhite@email.com, 12-22-1993\n\
    - Jimbo Manning, jmanning@email.com, 4-18-1984\n- Peter Redding, predding@email.com,\
    \ 9-9-2001\n- Susie Cue, scue@email.com, 10-3-1989\n\nAs you were entering these\
    \ users all data components were refreshing at the same time! Remember, we can\
    \ always edit a user by double-clicking the grid row.\n\nThe chart is completed\
    \ and looks like the following screenshot:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_114_0.png)"
  mdcn: "\n## DHTMLX 图表\n\n这将为图表在布局单元格内提供100像素的内边距，现在标签有足够的空间可供阅读。图表现在看起来如下图所示：\n\n\
    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_108_0.png)\n\n## 定义图表类型\n\n现在我们将图表更改为柱状图。我们已经使用第一组数据设置了图表。让我们看看当使用\
    \ `view` 设置将其更改为柱状图时会发生什么。\n\n在控制台中输入并运行以下代码：\n\n```\nmyChart.define(\"view\"\
    ,\"bar\");\nmyChart.refresh();\n```\n\n我们的图表已更改为柱状图。但布局和标签看起来不太合适。为此，我们需要设置 `xAxis`\
    \ 以在底部显示标签，并更改一些其他设置。我们现在就来做。\n\n在控制台中输入并运行以下代码：\n\n```\nmyChart.define(\"label\"\
    , false);\nmyChart.define(\"padding\", 50);\nmyChart.define(\"xAxis\", {\n   \
    \ title: \"Names\",\n    template: \"#name#\",\n    lines: false\n})\nmyChart.define(\"\
    tooltip\",\"Views (#profileViews#)\");\nmyChart.refresh();\n```\n\n图表现在更具可读性。我们移除了标签并添加了工具提示，当鼠标悬停在图表中的柱条上时，将显示个人资料浏览次数。\n\
    \n`xAxis` 设置提供了在图表底部使用有意义的标签进行标记的能力。如您所见，我们添加了标题 `Names`，每个数据集都有一个标签，显示相应人员的名称。我们还将\
    \ `lines` 属性设置为 false，这会从图表中移除垂直线。\n\n图表现在看起来如下图所示：\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_109_0.png)\n\
    \n接下来，我们将介绍向图表添加第二组数据。\n\n## DHTMLX 图表\n\n## addSeries()\n\n`addSeries` 方法允许我们为图表创建额外的数据系列。我们必须提供一个对象作为参数。现在，我们将为图表中每个人的年龄添加一个数据系列。\n\
    \n在控制台中输入并运行以下代码：\n\n```\nmyChart.addSeries({\n    value: \"#age#\",\n    color:\
    \ \"purple\",\n    tooltip: \"Age (#age#)\"\n});\nmyChart.refresh();\n```\n\n\
    在对象内部，我们设置了值、颜色和工具提示，然后刷新。这应用了更改，现在年龄数据系列已添加。\n\n## idByIndex()\n\n我们之前添加到图表的每个数据对象都被分配了图表内部数组中的一个索引。这意味着\
    \ Steve 的第一个数据对象索引为零。这些数据对象中的每一个都有一个与之关联的 ID，可以使用 `idByIndex` 方法检索。这将允许我们在数据对象被添加后访问它。\n\
    \n让我们获取 Steve 数据对象的 ID。在控制台中输入并运行以下代码：\n\n```\nvar steveDataId = myChart.idByIndex(0);\n\
    ```\n\n现在，我们将 DHTMLX 生成的 ID 分配给了我们的 `steveDataId` 变量。\n\n## get()\n\n`get` 方法拉取我们之前使用\
    \ `add` 方法为 Steve 添加的所有数据。它接受我们想要检索的关联数据 ID 作为参数。返回的数据对象不是只读的。我们可以使用同一个对象来更改值并刷新网格以应用更改。\n\
    \n在控制台中输入并运行以下代码：\n\n```\nvar steveData = myChart.get(steveDataId);\n```\n\n您可以在控制台中看到我们拥有最初为\
    \ Steve 创建的所有数据。嗯，看来 Steve 不喜欢被称为 Steve，而是更愿意被称为 Steven。让我们为他更新这一点。\n\n在控制台中输入并运行以下代码：\n\
    \n```\nsteveData.name = \"Steven\";\nmyChart.refresh();\n```\n\n正如您所看到的，他的名字现在已更改。\n\
    \n现在，我们将探讨事件。\n\n## 事件\n\n图表有许多可用的事件。目前，让我们看其中一个，以便对未来其他可用事件的使用有足够的了解。\n\n## onItemClick\n\
    \n`onItemClick` 事件在我们点击图表中的每个柱条时触发。它将返回被点击项的数据对象 ID。让我们使用这个事件来显示一个警报，告诉我们刚刚点击了谁的数据。\n\
    \n在控制台中输入并运行以下代码：\n\n```\nmyChart.attachEvent(\"onItemClick\", function(id){\n\
    \  alert(\"This is data for \"+myChart.get(id).name);\n});\n```\n\n现在，当我们点击每个柱条时，我们会看到一个警报，告诉我们该数据的名称。\n\
    \n我们涵盖了应用程序所需的所有必要的图表方法和事件。让我们开始应用我们所学的内容。\n\n## 应用程序代码\n\n对于该应用程序，我们将基于通过表单添加的每个用户的年龄显示一系列数据。这将在数据更改时与网格匹配。如前所述，我们将使用柱状图，并在初始化方法中使用传入的对象创建所有必要的设置。\n\
    \n首先，我们将在 `app.js` 文件中直接在表单创建方法之后添加创建方法。这将包含我们的全局图表变量和创建方法。\n\n## DHTMLX 图表\n\n\
    ## 创建图表\n\n将以下代码添加到 `app.js` 文件的末尾：\n\n```\n// Chart\nvar appChart;\ndhtmlxEvent(window,\"\
    load\",function(){\n    appChart = appLayout.cells(\"b\").attachChart({\n    \
    \    view: \"bar\",\n        value: \"#age#\",\n        label: \"#age#\",\n  \
    \      gradient: \"rising\",\n        tooltip: {\n            template: \"#age#\"\
    \n        },\n        xAxis: {\n            title: \"Users\",\n            template:\
    \ \"#name#\",\n            lines: false\n        },\n        yAxis: {\n      \
    \      title: \"Years of Age\",\n            lines: true\n        },\n       \
    \ padding: {\n            left: 25,\n            right: 10,\n            top:\
    \ 45\n        }\n    });\n    // reset chart data\n    callbacks.refreshChart();\n\
    });\n```\n\n首先，我们创建了一个全局变量，然后在页面加载事件处理程序中创建了一个图表。在图表初始化内部，我们应用了刚刚学到的所有设置，并添加了\
    \ `gradient` 和 `yAxis`。`gradient` 在柱条上设置了漂亮的渐变效果。`yAxis` 将在图表左侧显示年龄的网格线和数字。\n\n\
    初始化之后，我们调用了 `callbacks.refreshChart`，它将以与我们为网格所做的相同方式刷新图表数据。\n\n## callbacks.refreshChart()\n\
    \n在 `callbacks` 对象的 `refreshChart` 方法内部，我们将清除图表并添加数据。\n\n按照以下代码编辑 `refreshChart`\
    \ 方法：\n\n```\nrefreshChart: function(){\n    appChart.clearAll();\n    appChart.parse(storage.getUserBarChart(),\
    \ \"json\");\n},\n```\n\n## callbacks.dataChanged()\n\n在 `callbacks` 对象的 `dataChanged`\
    \ 方法内部，我们将添加 `refreshChart` 方法。\n\n按照以下方式编辑 `dataChanged` 方法：\n\n```\ndataChanged:\
    \ function(){\n    callbacks.refreshGrid();\n    callbacks.refreshChart();\n}\n\
    ```\n\n现在我们可以测试图表了！\n\n## 测试应用程序\n\n首先，再次清除我们的本地存储数据。\n\n在控制台中输入并运行以下代码：\n\n```\n\
    localStorage.clear()\n```\n\n现在，刷新页面，图表和网格应该为空。\n\n我们将向应用程序添加一些用户，但首先我们需要看一些事情。点击\
    \ **add** 按钮以弹出窗口。通过拖动标题将弹出窗口移动到图表上方。在当前版本（撰写本书时），图表的 z-index 高于弹出窗口，这使我们无法正确使用弹出窗口。可以通过一个小的\
    \ CSS 更改来修复此问题。\n\n如果您遇到此问题，让我们通过进入 `index.html` 的 CSS 并在样式末尾添加以下 CSS 来修复它：\n\n\
    ```\n.dhx_chart{ z-index: 1; }\n```\n\n## DHTMLX 图表\n\n现在，刷新页面并再次尝试使用弹出窗口。一切正常，弹出窗口再次位于顶部。\n\
    \n让我们开始添加一些数据。使用弹出窗口添加以下用户：\n\n- John Smith, jsmith@email.com, 1-1-1963\n- Tim\
    \ Smith, tsmith@email.com, 1-1-1963\n- Alice Chance, achange@email.com, 6-23-1972\n\
    - Bob White, bwhite@email.com, 12-22-1993\n- Jimbo Manning, jmanning@email.com,\
    \ 4-18-1984\n- Peter Redding, predding@email.com, 9-9-2001\n- Susie Cue, scue@email.com,\
    \ 10-3-1989\n\n当您输入这些用户时，所有数据组件都在同时刷新！请记住，我们始终可以通过双击网格行来编辑用户。\n\n图表已完成，看起来如下图所示：\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_114_0.png)\n"
