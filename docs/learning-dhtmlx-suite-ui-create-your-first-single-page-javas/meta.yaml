- img_proc: true
  md: "We want to download the entire library of components. DHTMLX calls this the\
    \ **Suite**. Locate the **Download** link on the page for the **Standard Edition**\
    \ of the Suite and click on the link. This will begin the download of a ZIP file.\
    \ Download it to a location other than the application directory so that we can\
    \ extract and choose which files we will use.\n\nOpen the extracted folder in\
    \ your file manager to view its contents. You will see that it contains many folders,\
    \ a license file, a readme file, an `index.html` file, and several more ZIP files.\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_27_0.png)\n\nThe folders you see contain\
    \ the individual components, which allow the individual use for each component.\n\
    \nThe ZIP files contain the entire library of components in a compressed format\
    \ in different skins.\n\nThe `index.html` file, when opened, provides the documentation\
    \ for the downloaded version of DHTMLX. The DHTMLX documentation is broken down\
    \ into two sections, documentation and samples, with details on each component.\
    \ DHTMLX also provides the most up-to-date version of documentation on the website,\
    \ but having a local copy is pretty handy when working offline, or if you have\
    \ a slow network connection.\n\nNext, we will extract the compressed version of\
    \ the entire library to the application directory. Locate the ZIP file named `dhtmlx_std_full.zip`.\
    \ This contains the actual DHTMLX files which we will use to build the application.\
    \ Extract the contents of the `dhtmlx_std_full.zip` file to the `dhtmlx` folder\
    \ in the `application` directory.\n\nOnce those have been extracted, we will start\
    \ creating our application files.\n\n# Creating the application file app.js\n\n\
    The first application file is the `app.js` file. This will contain all of the\
    \ JavaScript to create the components and interactions.\n\nLet's start by creating\
    \ the `app.js` file in the `js/application` directory.\n\nInside this file, add\
    \ a `config` object at the top as shown in the following snippets:\n\n```\nvar\
    \ config = {\n    imagePath: \"js/dhtmlx/imgs/\",\n    iconPath: \"\"\n}\n```"
  merge: -1
  pgno: 27
- img_proc: true
  md: "Download, Setup, and Test\n\nThis `config` object contains the global properties\
    \ for the DHTMLX components. The `imagePath` property is the path where the images\
    \ reside for the components styling. The second one which we left blank is the\
    \ path where the icons will be stored. Icons can be used in several different\
    \ components like the Modal Window header and the toolbar buttons.\n\nIcons do\
    \ not come with DHTMLX and have to be added from a free or purchased icons library.\n\
    \n# The data storage file\n\nThe next file which we will create for the application\
    \ is the `storage.js` file. This file will contain the mini data access layer\
    \ that will speak to HTML5 localStorage. It will contain all of the CRUD methods\
    \ for the users and displays.\n\nNow, create a new JavaScript file in the `js/application`\
    \ directory named `storage.js`. We will add code to this later.\n\nNext, we will\
    \ add an HTML file that will join the application code together.\n\n# Creating\
    \ the index.html file\n\nThe application will be accessed through the `index.html`\
    \ file located in the root of the application directory. We will set this up now.\n\
    \nIn the root of the application directory, add a new file named `index.html`.\
    \ This should be accessible from `http://localhost/index.html`.\n\nNow, add the\
    \ markup for an HTML5 document and include the external DHTMLX files:\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <title>Users</title>\n    <link\
    \ href=\"js/dhtmlx/dhtmlx.css\" type=\"text/css\"\n      rel=\"stylesheet\" />\n\
    \    <style>\n      /* layout css */\n      html, body { height: 100%; width:\
    \ 100%; }\n    </style>\n    <script src=\"js/dhtmlx/dhtmlx.js\"></script>\n \
    \   <script src=\"js/application/storage.js\"></script>\n    <script src=\"js/application/app.js\"\
    ></script>\n  </head>\n  <body>\n  </body>\n</html>\n```"
  merge: -1
