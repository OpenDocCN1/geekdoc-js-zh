  - '[PAGE 70]


    The DHTMLX Grid


    # setHeader


    The `setHeader` method sets the column headers and determines how many headers
    we will have. The argument is a JavaScript array.


    Type and run the following code line in the console:


    ```

    myGrid.setHeader(["Column1", "Column2", "Column3"]);

    ```


    # setInitWidths


    The `setInitWidths` method will set the initial widths of each of the columns.
    The asterisk mark (*) is used to set the width automatically.


    Type and run the following code line in the console:


    ```

    myGrid.setInitWidths("125,95,*");

    ```


    # setColAlign


    The `setColAlign` method allows us to align the column''s content position.


    Type and run the following code line in the console:


    ```

    myGrid.setColAlign("right,center,left");

    ```


    # init


    Up until this point, we haven''t seen much going on. It was all happening behind
    the scenes. To see these changes the grid must be initialized.


    Type and run the following code line in the console:


    ```

    myGrid.init();

    ```


    Now you see the columns that we provided.


    # addRow


    Now that we have a grid created let''s add a couple rows and start interacting.


    The `addRow` method adds a row to the grid. The parameters are ID and columns.


    Type and run the following code in the console:


    ```

    myGrid.addRow(1, ["test1", "test2", "test3"]);

    myGrid.addRow(2, ["test1", "test2", "test3"]);

    ```


    We just created two rows inside the grid.'
  - '[PAGE 71]


    # # setColTypes


    The `setColTypes` method sets what types of data a column will contain.


    The available type options are:


    +   - ro (readonly)

    - ed (editor)

    - txt (textarea)

    - ch (checkbox)

    - ra (radio button)

    - co (combobox)


    Currently, the grid allows for inline editing if you were to double-click on grid
    cell. We do not want this for the application. So, we will set the column types
    to read-only.


    Type and run the following code in the console:


    ```

    myGrid.setColTypes("ro,ro,ro");

    ```


    Now the cells are no longer editable inside the grid.


    # # getSelectedRowId


    The `getSelectedRowId` method returns the ID of the selected row. If there is
    nothing selected it will return null.


    Type and run the following code line in the console:


    ```

    myGrid.getSelectedRowId();

    ```


    # # clearSelection


    The `clearSelection` method clears all selections in the grid.


    Type and run the following code line in the console:


    ```

    myGrid.clearSelection();

    ```


    Now any previous selections are cleared.'
  - "[PAGE 72]\n\nThe DHTMLX Grid\n\n# clearAll\n\nThe `clearAll` method removes all\
    \ the grid rows. Prior to adding more data to the grid we first must clear it.\
    \ If not we will have duplicated data.\n\nType and run the following code line\
    \ in the console:\n\n```\nmyGrid.clearAll();\n```\n\nNow the grid is empty.\n\n\
    # parse\n\nThe `parse` method allows the loading of data to a grid in the format\
    \ of an XML string, CSV string, XML island, XML object, JSON object, and JavaScript\
    \ array. We will use the `parse` method with a JSON object while creating a grid\
    \ for the application.\n\nHere is what the `parse` method syntax looks like (do\
    \ not run this in console):\n\n```\nmyGrid.parse(data, \"json\");\n```\n\n# Grid\
    \ events\n\nThe DHTMLX grid component has a vast amount of events. You can view\
    \ them in their entirety in the documentation. We will cover the `onRowDblClicked`\
    \ and `onRowSelect` events.\n\n# onRowDblClicked\n\nThe `onRowDblClicked` event\
    \ is triggered when a grid row is double-clicked. The handler receives the argument\
    \ of the row ID that was double-clicked. Type and run the following code in console:\n\
    \n```\nmyGrid.attachEvent(\"onRowDblClicked\", function(rowId){\n    console.log(rowId);\n\
    });\n```\n\nDouble-click one of the rows and the console will log the ID of that\
    \ row."
- md: "## onRowSelect\n\nThe `onRowSelect` event will trigger upon selection of a\
    \ row.\n\nType and run the following code in console:\n\n```\nmyGrid.attachEvent(\"\
    onRowSelect\", function(rowId){\n    console.log(rowId);\n});\n```\n\nNow, when\
    \ you select a row the console will log the ID of that row. This can be perceived\
    \ as a single click.\n\n## The application code\n\nNow, we are going to create\
    \ the user grid for the application. First, we will make the method that creates\
    \ the grid and events. Then, we will add logic to the `callbacks` object and test\
    \ the `storage` object code.\n\n## Create the grid\n\nOpen the `app.js` file and\
    \ add the following code at the end:\n\n```\n// Grid\nvar appGrid;\ndhtmlxEvent(window,\
    \ \"load\", function(){\n    // create grid\n    appGrid = appLayout.cells(\"\
    a\").attachGrid();\n    appGrid.setHeader([\"ID\",\"First Name\",\"MI\",\n   \
    \ \"Last Name\",\"DOB\",\"Email\",\"Active\"]);\n    appGrid.setColTypes(\"ro,ro,ro,ro,ro,ro,ro\"\
    );\n    appGrid.setInitWidths(\"35,*,35,*,75,*,55\");\n    appGrid.setColAlign(\"\
    center,left,center,left,center,left,center\");\n    appGrid.setImagePath(config.imagePath);\n\
    \    appGrid.init();\n\n    // attach grid events\n    appGrid.attachEvent(\"\
    onRowDblClicked\", function(rowId){\n        callbacks.editClick(rowId);\n   \
    \ });\n    appGrid.attachEvent(\"onRowSelect\", function(){\n        callbacks.setToolbarItemStates();\n\
    \    });\n    // reset grid and load it with data\n    callbacks.refreshGrid();\n\
    });\n```\n\n*The DHTMLX Grid*\n\nFirst, we created the global `appGrid` variable\
    \ that holds the reference to the grid. Next the grid is created and settings\
    \ are applied. We then attached the events that will be used and added the method\
    \ that will refresh the grid data.\n\nNow, we will add the code to the `callbacks`\
    \ object to handle the grid events and the refreshing of the grid data.\n\n##\
    \ callbacks.setToolbarItemStates\n\nInside the `app.js` file locate the `callbacks`\
    \ method `setToolbarItemStates`.\n\nThis method will disable and enable the **remove**\
    \ button on the toolbar. Add the following code to the `setToolbarItemStates`\
    \ method as shown:\n\n```\nsetToolbarItemStates: function(){\n    if(appGrid.getSelectedRowId()){\n\
    \        appToolbar.enableItem(3);\n    }else{\n        appToolbar.disableItem(3);\n\
    \    }\n},\n```\n\nWhen this method is used it will check the grid for a selection\
    \ and enable or disable the **remove** button.\n\n## callbacks.removeClick\n\n\
    The `removeClick` method will fire when the **remove** button is clicked. When\
    \ this happens we will remove the selected user from the `localStorage` with the\
    \ `storage` method `removeUser`.\n\nAdd the following code to the `callbacks`\
    \ object `removeClick` method as shown in the following code snippet:\n\n```\n\
    removeClick: function(){\n    storage.removeUser(appGrid.getSelectedRowId());\n\
    },\n```\n\nNext, we need to reload the grid with the most up-to-date data from\
    \ the `localStorage`.\n\n## callbacks.refreshGrid\n\nThe refreshGrid method updates\
    \ the grid with the most recent data. Add the following code inside the callbacks\
    \ object refreshGrid method as shown in the following code snippet:\n\n```\nrefreshGrid:\
    \ function(){\n    appGrid.clearAll();\n    appGrid.parse(storage.getUserGrid(),\
    \ \"json\");\n    callbacks.setToolbarItemStates();\n},\n```\n\nWhen the refreshGrid\
    \ method is used it first clears all data from the grid then retrieves the data\
    \ from the localStorage to display in the grid.\n\nAfter the grid is cleared and\
    \ data is loaded the **remove** button is disabled.\n\n## callbacks.dataChanged\n\
    \nThe data in the localStorage is changed whenever a user is added, edited, or\
    \ removed. The dataChanged method will be used any time this happens to refresh\
    \ any component that is using the data. Add the refreshGrid to the callbacks object\
    \ dataChanged.\n\n```\ndataChanged: function(){\n    callbacks.refreshGrid();\n\
    }\n```\n\nNow refresh the page. The following screenshot shows us what we should\
    \ have after we refreshed:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_75_0.png)\n\
    \n*The DHTMLX Grid*\n\n## Testing the grid\n\nNow, we are going to add a couple\
    \ users with the `storage` methods to test the grid. After testing we will clear\
    \ the `localStorage`.\n\n## Creating a user\n\nThe `createUser` method was created\
    \ in *Chapter 3, Data Structures, Storage, and Callbacks* to add a user to the\
    \ `localStorage`. We will use this to add two users to the grid and test the functionality.\
    \ We will use a simplified version of the user object.\n\nIn the console type\
    \ and run the following code snippet:\n\n```\nstorage.createUser({firstName: \"\
    George\", dob: new Date(\"1991\")});\nstorage.createUser({firstName: \"Steve\"\
    , dob: new Date(\"1982\")});\n```\n\nThe `createUser` saved the users into the\
    \ `localStorage` then called the `dataChanged` method, which refreshed the grid.\
    \ Now we know that when a user is added the grid will update. The following screenshot\
    \ shows the grid with the two added users:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_76_0.png)\n\
    \n## Removing a user\n\nNow, we will test removing a user. Select a grid row and\
    \ click on the **remove** button. The selected row is now removed. Clicking on\
    \ the **remove** button removes the user from the `localStorage` and refreshes\
    \ the grid.\n\nType and run the following code line in the console:\n\n```\nlocalStorage.clear();\n\
    ```\n\nNow refresh the page to clear the grid and reset the ID count.\n\n## Summary\n\
    \nIn this chapter, we learned about the DHTMLX grid component. We also added the\
    \ user grid to the application and tested it with the `storage` and `callbacks`\
    \ methods.\n\nIn the next chapter, we will go over DHTMLX's Window component that\
    \ will provide a pop-up to hold the form to edit and add a user.\n\n# 7\n\n##\
    \ The DHTMLX Window\n\nIn this chapter, we will learn about the DHTMLX window\
    \ component covering the different initializations, events, methods, and settings.\
    \ We will then add a pop-up window to the application that will hold a form created\
    \ in the next chapter.\n\nAll changes done in this chapter will be inside the\
    \ `app.js` file.\n\n### The DHTMLX window\n\nThe DHTMLX window component allows\
    \ us to create multiple pop-up windows inside a web page quickly and easily. The\
    \ window component provides the means to quickly attach a DHTMLX form, layout,\
    \ grid, and most other components. It also does the work for styling, alignment,\
    \ and positioning.\n\nThe DHTMLX window component is a base object that can have\
    \ many child pop-up windows created from it. The base object takes all of the\
    \ important settings like the image path and the optional viewport.\n\nBy the\
    \ end of this chapter, we will have an excellent understanding of how to initialize\
    \ and control a DHTMLX window object and create pop-up windows. We will then create\
    \ a pop-up window that will open when the add button is pressed.\n\n### The methods\
    \ and events\n\nWe will begin by creating a new instance of the base `dhtmlXWindows`\
    \ object.\nRefresh the browser to clear any console code from previous exercises.\n\
    \n## Initialization\n\nInitializations of DHTMLX's components are either done\
    \ through an existing component, such as the layout component, or initialized\
    \ to a DOM element. This is different with the window component. The base object\
    \ must be created first. From this base object, a set of new windows can be created.\n\
    \nThe settings for initialization in the other discussed components have always\
    \ been added in a functional manner. DHTMLX also provides the optional object\
    \ literal way of applying settings to initialization for most of their components.\
    \ For the first exercise we will create multiple windows with the settings as\
    \ an object literal.\n\n## Creating the base object\n\nIn the console we will\
    \ create a new `dhtmlXWindows` object with a settings object. This settings object\
    \ will set the path to the images folder and allow the creation of multiple windows\
    \ at the same time.\n\nType and run the following code in the console:\n\n```\n\
    var myWindows = new dhtmlXWindows({\n    image_path: config.imagePath,\n    wins:\
    \ [\n        {\n            id: \"w1\",\n            height: 200,\n          \
    \  width: 200,\n            text: \"One\"\n        },\n        {\n           \
    \ id: \"w2\",\n            height: 200,\n            width: 200,\n           \
    \ text: \"Two\",\n            left: 20,\n            top: 20\n        },\n   \
    \     {\n            id: \"w3\",\n            height: 200,\n            width:\
    \ 200,\n            text: \"Three\",\n            left: 40,\n            top:\
    \ 40\n        }\n    ]\n});\n```"
  mdcn: "\n## onRowSelect\n\n`onRowSelect`事件将在选择行时触发。\n\n在控制台中输入并运行以下代码：\n\n```\n\
    myGrid.attachEvent(\"onRowSelect\", function(rowId){\n    console.log(rowId);\n\
    });\n```\n\n现在，当你选择一行时，控制台将记录该行的ID。这可以理解为单击操作。\n\n## 应用代码\n\n现在，我们将为应用程序创建用户网格。首先，我们将创建创建网格和事件的方法。然后，我们将向`callbacks`对象添加逻辑并测试`storage`对象的代码。\n\
    \n## 创建网格\n\n打开`app.js`文件并在末尾添加以下代码：\n\n```\n// Grid\nvar appGrid;\ndhtmlxEvent(window,\
    \ \"load\", function(){\n    // create grid\n    appGrid = appLayout.cells(\"\
    a\").attachGrid();\n    appGrid.setHeader([\"ID\",\"First Name\",\"MI\",\n   \
    \ \"Last Name\",\"DOB\",\"Email\",\"Active\"]);\n    appGrid.setColTypes(\"ro,ro,ro,ro,ro,ro,ro\"\
    );\n    appGrid.setInitWidths(\"35,*,35,*,75,*,55\");\n    appGrid.setColAlign(\"\
    center,left,center,left,center,left,center\");\n    appGrid.setImagePath(config.imagePath);\n\
    \    appGrid.init();\n\n    // attach grid events\n    appGrid.attachEvent(\"\
    onRowDblClicked\", function(rowId){\n        callbacks.editClick(rowId);\n   \
    \ });\n    appGrid.attachEvent(\"onRowSelect\", function(){\n        callbacks.setToolbarItemStates();\n\
    \    });\n    // reset grid and load it with data\n    callbacks.refreshGrid();\n\
    });\n```\n\n*DHTMLX 网格*\n\n首先，我们创建了全局变量`appGrid`，用于保存网格的引用。接下来，创建网格并应用设置。然后，我们附加了将使用的事件，并添加了刷新网格数据的方法。\n\
    \n现在，我们将向`callbacks`对象添加代码，以处理网格事件和网格数据的刷新。\n\n## callbacks.setToolbarItemStates\n\
    \n在`app.js`文件中找到`callbacks`方法`setToolbarItemStates`。\n\n此方法将禁用和启用工具栏上的**删除**按钮。按照以下代码片段所示，向`setToolbarItemStates`方法添加代码：\n\
    \n```\nsetToolbarItemStates: function(){\n    if(appGrid.getSelectedRowId()){\n\
    \        appToolbar.enableItem(3);\n    }else{\n        appToolbar.disableItem(3);\n\
    \    }\n},\n```\n\n当使用此方法时，它将检查网格是否有选择，并启用或禁用**删除**按钮。\n\n## callbacks.removeClick\n\
    \n当单击**删除**按钮时，`removeClick`方法将触发。发生这种情况时，我们将使用`storage`方法`removeUser`从`localStorage`中删除选定的用户。\n\
    \n按照以下代码片段所示，向`callbacks`对象`removeClick`方法添加代码：\n\n```\nremoveClick: function(){\n\
    \    storage.removeUser(appGrid.getSelectedRowId());\n},\n```\n\n接下来，我们需要从`localStorage`重新加载最新的数据到网格中。\n\
    \n## callbacks.refreshGrid\n\nrefreshGrid方法使用最新数据更新网格。按照以下代码片段所示，在callbacks对象refreshGrid方法内添加代码：\n\
    \n```\nrefreshGrid: function(){\n    appGrid.clearAll();\n    appGrid.parse(storage.getUserGrid(),\
    \ \"json\");\n    callbacks.setToolbarItemStates();\n},\n```\n\n当使用refreshGrid方法时，它首先清除网格中的所有数据，然后从localStorage检索要显示在网格中的数据。\n\
    \n网格清除并加载数据后，**删除**按钮将被禁用。\n\n## callbacks.dataChanged\n\n每当用户被添加、编辑或删除时，localStorage中的数据都会更改。dataChanged方法将在任何时候发生这种情况时使用，以刷新任何使用该数据的组件。将refreshGrid添加到callbacks对象dataChanged。\n\
    \n```\ndataChanged: function(){\n    callbacks.refreshGrid();\n}\n```\n\n现在刷新页面。以下截图显示了刷新后我们应该有的内容：\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_75_0.png)\n\n*DHTMLX 网格*\n\n## 测试网格\n\
    \n现在，我们将使用`storage`方法添加几个用户来测试网格。测试后，我们将清除`localStorage`。\n\n## 创建用户\n\n`createUser`方法在*第3章，数据结构、存储和回调*中创建，用于向`localStorage`添加用户。我们将使用此方法向网格添加两个用户并测试功能。我们将使用简化的用户对象版本。\n\
    \n在控制台中输入并运行以下代码片段：\n\n```\nstorage.createUser({firstName: \"George\", dob: new\
    \ Date(\"1991\")});\nstorage.createUser({firstName: \"Steve\", dob: new Date(\"\
    1982\")});\n```\n\n`createUser`将用户保存到`localStorage`，然后调用`dataChanged`方法，该方法刷新了网格。现在我们知道，当添加用户时，网格将更新。以下截图显示了添加了两个用户的网格：\n\
    \n![](img/bcf02c388bf10cd4c2927f8ff604bf76_76_0.png)\n\n## 删除用户\n\n现在，我们将测试删除用户。选择一个网格行并单击**删除**按钮。选定的行现在已删除。单击**删除**按钮将用户从`localStorage`中删除并刷新网格。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nlocalStorage.clear();\n```\n\n现在刷新页面以清除网格并重置ID计数。\n\
    \n## 总结\n\n在本章中，我们了解了DHTMLX网格组件。我们还将用户网格添加到应用程序中，并使用`storage`和`callbacks`方法对其进行了测试。\n\
    \n在下一章中，我们将介绍DHTMLX的Window组件，该组件将提供一个弹出窗口来包含用于编辑和添加用户的表单。\n\n# 7\n\n## DHTMLX\
    \ 窗口\n\n在本章中，我们将学习DHTMLX窗口组件，涵盖不同的初始化、事件、方法和设置。然后，我们将向应用程序添加一个弹出窗口，该窗口将包含下一章创建的表单。\n\
    \n本章中的所有更改都将在`app.js`文件中进行。\n\n### DHTMLX 窗口\n\nDHTMLX窗口组件允许我们快速轻松地在网页内创建多个弹出窗口。窗口组件提供了快速附加DHTMLX表单、布局、网格和大多数其他组件的方法。它还负责样式、对齐和定位。\n\
    \nDHTMLX窗口组件是一个基础对象，可以从中创建许多子弹出窗口。基础对象接受所有重要的设置，如图像路径和可选的视口。\n\n在本章结束时，我们将很好地理解如何初始化和控制DHTMLX窗口对象并创建弹出窗口。然后，我们将创建一个弹出窗口，当按下添加按钮时打开。\n\
    \n### 方法和事件\n\n我们将从创建新的基础`dhtmlXWindows`对象实例开始。\n刷新浏览器以清除之前练习中的任何控制台代码。\n\n##\
    \ 初始化\n\nDHTMLX组件的初始化要么通过现有组件（如布局组件）完成，要么初始化到DOM元素。窗口组件则不同。必须先创建基础对象。从这个基础对象，可以创建一组新窗口。\n\
    \n其他讨论过的组件中的初始化设置始终以函数方式添加。DHTMLX还为大多数组件提供了可选的对象字面量方式来应用初始化设置。在第一个练习中，我们将使用对象字面量作为设置来创建多个窗口。\n\
    \n## 创建基础对象\n\n在控制台中，我们将使用设置对象创建一个新的`dhtmlXWindows`对象。此设置对象将设置图像文件夹的路径，并允许同时创建多个窗口。\n\
    \n在控制台中输入并运行以下代码：\n\n```\nvar myWindows = new dhtmlXWindows({\n    image_path:\
    \ config.imagePath,\n    wins: [\n        {\n            id: \"w1\",\n       \
    \     height: 200,\n            width: 200,\n            text: \"One\"\n     \
    \   },\n        {\n            id: \"w2\",\n            height: 200,\n       \
    \     width: 200,\n            text: \"Two\",\n            left: 20,\n       \
    \     top: 20\n        },\n        {\n            id: \"w3\",\n            height:\
    \ 200,\n            width: 200,\n            text: \"Three\",\n            left:\
    \ 40,\n            top: 40\n        }\n    ]\n});\n```\n"
