  - '[PAGE 95]


    # newcolumn


    When the form item type `newcolumn` is added to a list of form items, it moves
    all of the items following the `newcolumn` item in the array to a new column.
    The only property available for this item is the `offset`, which sets the spacing
    between the columns.


    As you can see, the last two buttons in the exercise form are in two different
    columns. If we have not placed them inside a `block` item before using the new
    column item, then it would have pushed the buttons to the right of the other form
    elements. The block item allowed us to contain the column without affecting the
    other form items.


    # Form methods


    We just covered many of the DHTMLX form item types and some of their attributes.
    The DHTMLX form documentation has much more that was not covered.


    Now, we will look into some of the methods for validation and manipulating the
    values in a form.


    # setItemFocus()


    The `setItemFocus` method allows us to put focus on a form item of choice. This
    is pretty standard when creating forms and makes for a better user experience.


    Type and run the following code line in the console:


    ```

    myForm.setItemFocus("input1");

    ```


    The cursor will be focused in the form item named `input1` when the pop-up window
    is active.


    # validate()


    The `validate` method runs the validation rules that were set on each form item.


    Type and run the following code line in the console:


    ```

    myForm.validate();

    ```


    You will notice that the label for the required input is red and so will the text
    if any is entered. If there is no text in that field, enter some and leave it
    there. Now, run the `validate` method again. It will now check it once again and
    clears the validation on that input.'
  - '[PAGE 96]


    # # clear()


    The `clear` method resets the values in the form. Enter some data in the input
    or select a date. Then, type and run the following code line in the console:


    ```

    myForm.clear();

    ```


    All the data is now removed. This will also clear any validation errors that may
    be present.


    # # enableLiveValidation()


    The `enableLiveValidation` runs the validate method on blur of the form item.


    Type and run the following in the console:


    ```

    myForm.enableLiveValidation(true);

    ```


    Now, when you are focused on the required input and move to the next it will run
    the `validate` method. We can also turn this off by passing in `false`.


    # # setFormData()


    The `setFormData` method allows us to programmatically set the form item values.
    The parameter this method takes is a JavaScript object literal with the keys as
    the form item names and their values. This allows us to populate an entire form
    in one method if necessary. Let''s add data to our form item named `input1`.


    Type the following code line in the console and run:


    ```

    myForm.setFormData({ input1: "Hello!" });

    ```


    Now, the form item named `input1` has the entered value.


    # # getFormData()


    The `getFormData` method retrieves the values from the form, returning a JavaScript
    object literal.


    Type the following code line in the console and run:


    ```

    myForm.getFormData()

    ```


    The returned object is logged in the console. Each of the form items are there.
    Notice the very first property is a random name generated by DHTMLX for the input
    that we did not provide a name for.'
