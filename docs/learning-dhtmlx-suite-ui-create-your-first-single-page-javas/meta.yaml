  md: '# Download, Setup, and Test


    To make JavaScript development easy, Chrome provides the developer tools. This
    provides many useful tools for developing applications on the Web. The tool that
    we will focus on is the console. There are two ways to access the Chrome developer
    tools console window: through the Chrome menu or through keyboard shortcuts. Let''s
    use the keyboard shortcuts approach. On Windows and Linux, the keyboard shortcut
    is `Ctrl + Shift + J`, and for Mac, it is `Cmd + Opt + J`. With the provided keyboard
    shortcuts, open the developer tools console window.


    Inside the console window which you just opened, type the word `dhtmlx`. This
    will bring up the developer tools intellisense with all of the available properties
