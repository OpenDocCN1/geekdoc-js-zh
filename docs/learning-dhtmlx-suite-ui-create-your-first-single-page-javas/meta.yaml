    \ 对象 71\n    - 创建弹出窗口 71\n    - 测试弹出窗口 72\n- 应用程序目录结构\n    - 创建 11, 12\n- 应用程序文件\
    \ app.js\n    - 创建 13\n- attachEvent 方法 37\n- attachForm 方法\n    - 用于附加 DHTML\
