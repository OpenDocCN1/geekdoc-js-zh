    The DHTMLX Grid


    The order of steps to create a grid is as follows:


    +   1. Create the grid object

    2. Apply settings

    3. Initialize

    4. Add data


    Now we will go over initializing a grid.


    # Initialization choices


    We can initialize a DHTMLX grid in two ways, similar to the other DHTMLX objects.
    The first way is to attach it to a DOM element and the second way is to attach
    it to an existing DHTMLX layout cell or layout.


    > A grid can be constructed by either passing in a JavaScript object with all
    the settings or built through individual methods.


    # Initialization on a DOM element


    Let''s attach the grid to a DOM element. First we must clear the page and add
    a div element using JavaScript.


    Type and run the following code line in the developer tools console:


    ```

    document.body.innerHTML = "<div id=''myGridCont''></div>";

    ```


    We just cleared all of the body tags content and replaced it with a div tag having
    the id attribute value of myGridCont.


    Now, create a grid object to the div tag, add some settings and initialize it.


    Type and run the following code in the developer tools console:


    ```

    var myGrid = new dhtmlXGridObject("myGridCont");

    myGrid.setImagePath(config.imagePath);

    myGrid.setHeader(["Column1", "Column2", "Column3"]);

    myGrid.init();

    ```


    You should see the page with showing just the grid header with three columns.


    Next, we will create a grid on an existing cell object.'
