    \    callbacks.showPopup();\n},\n```\n\nThis was the last change we needed to\
    \ make in the `callbacks` object for the form. Next, we will add some CSS to the\
    \ `index.html` to make it look a little better.\n\n## Edit the CSS form\n\nRefresh\
    \ the page and click on the **add** button to show the pop-up window and newly\
    \ created form. As you will see in the following screenshot, the form contents\
    \ are crowded along the edges of the pop-up window:\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_100_0.png)"
  mdcn: "\n## 新列（newcolumn）\n\n当表单项类型 `newcolumn` 被添加到表单项列表中时，它会将数组中位于 `newcolumn`\
    \ 项之后的所有项移动到新的一列。此项目唯一可用的属性是 `offset`，用于设置列之间的间距。\n\n如您所见，练习表单中的最后两个按钮位于两列不同的位置。如果我们没有在使用新列项之前将它们放置在\
    \ `block` 项内，那么按钮就会被推到其他表单元素的右侧。`block` 项使我们能够在不影响其他表单项目的情况下包含该列。\n\n## 表单方法\n\
    \n我们刚刚介绍了许多 DHTMLX 表单项目类型及其一些属性。DHTMLX 表单文档中还有更多未涵盖的内容。\n\n现在，我们将探讨一些用于验证和操作表单中值的方法。\n\
    \n## setItemFocus()\n\n`setItemFocus` 方法允许我们将焦点置于所选的表单项上。这在创建表单时非常标准，并能带来更好的用户体验。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nmyForm.setItemFocus(\"input1\");\n```\n\n当弹出窗口处于活动状态时，光标将聚焦在名为\
    \ `input1` 的表单项上。\n\n## validate()\n\n`validate` 方法会运行为每个表单项设置的验证规则。\n\n在控制台中输入并运行以下代码行：\n\
    \n```\nmyForm.validate();\n```\n\n您会注意到必填输入的标签变为红色，如果输入了文本，文本也会变红。如果该字段中没有文本，请输入一些内容并保留。现在，再次运行\
    \ `validate` 方法。它将再次检查该输入，并清除该输入上的验证状态。\n\n## clear()\n\n`clear` 方法重置表单中的值。在输入框中输入一些数据或选择一个日期。然后，在控制台中输入并运行以下代码行：\n\
    \n```\nmyForm.clear();\n```\n\n现在所有数据都被移除了。这也会清除可能存在的任何验证错误。\n\n## enableLiveValidation()\n\
    \n`enableLiveValidation` 在表单项失焦时运行验证方法。\n\n在控制台中输入并运行以下内容：\n\n```\nmyForm.enableLiveValidation(true);\n\
    ```\n\n现在，当您在必填输入框中聚焦并移动到下一个输入框时，它将运行 `validate` 方法。我们也可以通过传入 `false` 来关闭此功能。\n\
    \n## setFormData()\n\n`setFormData` 方法允许我们以编程方式设置表单项的值。此方法接受的参数是一个 JavaScript\
    \ 对象字面量，其键是表单项的名称，值是对应的值。如有必要，这允许我们用一个方法填充整个表单。让我们向名为 `input1` 的表单项添加数据。\n\n在控制台中输入以下代码行并运行：\n\
    \n```\nmyForm.setFormData({ input1: \"Hello!\" });\n```\n\n现在，名为 `input1` 的表单项已填入输入的值。\n\
    \n## getFormData()\n\n`getFormData` 方法从表单中检索值，返回一个 JavaScript 对象字面量。\n\n在控制台中输入以下代码行并运行：\n\
    \n```\nmyForm.getFormData()\n```\n\n返回的对象会在控制台中被记录。每个表单项都在其中。请注意，第一个属性是 DHTMLX\
    \ 为我们未提供名称的输入生成的一个随机名称。\n\n## 应用程序代码\n\n现在，我们已经介绍了创建应用程序表单所需的所有表单方法。接下来，我们将把表单创建方法添加到包含表单初始化、事件、标志和验证的\
    \ `app.js` 文件中。\n\n## app.js\n\n打开 `app.js` 文件，并在末尾添加以下代码：\n\n```\n// Form\nvar\
    \ appForm;\ndhtmlxEvent(window, \"load\", function(){\n    // create form\n  \
    \  appForm = appPopup.attachForm([\n        // settings\n        {\n         \
    \   type: \"settings\", position: \"label-left\",\n            labelWidth: 130,\
    \ inputWidth: 120\n        },\n        // id\n        {\n            type: \"\
    hidden\", name: \"id\"\n        },\n        // firstName\n        {\n        \
    \    type: \"input\", name: \"firstName\",\n            required: true, label:\
    \ \"First Name:\"\n        },\n        // middleInitial\n        {\n         \
    \   type: \"input\", name: \"middleInitial\",\n            label: \"Middle Initial:\"\
    , inputWidth: 50\n        },\n        // lastName\n        {\n            type:\
    \ \"input\", name: \"lastName\",\n            required: true, label: \"Last Name:\"\
    \n        },\n        // dob\n        {\n            type: \"calendar\", enableTime:\
    \ false,\n            dateFormat: \"%n-%j-%Y\", name: \"dob\",\n            required:\
    \ true, label: \"Date of Birth:\",\n            inputWidth: 80\n        },\n \
    \       // email\n        {\n            type: \"input\", name: \"email\", required:\
    \ true,\n            validate: \"ValidEmail\", label: \"Email:\"\n        },\n\
    \        // active\n        {\n            type: \"checkbox\", name: \"active\"\
    ,\n            label: \"Active:\"\n        },\n        // buttons\n        {\n\
    \            type: \"block\",\n            width: 300,\n            list: [\n\
    \                {\n                    type: \"button\", value: \"Save\",\n \
    \                   name: \"save\"\n                },\n                {\n  \
    \                  type: \"newcolumn\"\n                },\n                {\n\
    \                    type: \"button\", value: \"Cancel\", name: \"cancel\"\n \
    \               }\n            ]\n        }\n    ]);\n\n    // enable validation\n\
    \    appForm.enableLiveValidation(true);\n\n    // set event\n    appForm.attachEvent(\"\
    onButtonClick\", function(btnName){\n        // save or cancel\n        if(btnName\
    \ == \"cancel\"){\n            callbacks.hidePopup();\n        }else if(appForm.validate()){\n\
    \            var formData = appForm.getFormData();\n            if(formData.id){\n\
    \                storage.updateUser(formData);\n            }else{\n         \
    \       storage.createUser(formData);\n            }\n            callbacks.hidePopup();\n\
    \        }\n    });\n});\n```\n\n## DHTMLX 表单和日历\n\n我们首先创建了全局变量 `appForm` 来引用我们创建的表单。然后，在页面加载事件处理程序中，我们创建了表单并为其按钮点击事件添加了事件处理。我们还添加了实时验证，以及在点击\
    \ **save** 按钮时进行验证。\n\n在 `onButtonClick` 事件处理程序中，我们确定是取消、编辑还是添加用户。通过检查隐藏的表单字段\
    \ `id` 是否有值，我们知道是编辑还是添加新用户。然后，我们分别使用 `storage` 对象的 `updateUser` 或 `createUser`\
    \ 方法，传入整个表单值对象。最后，如果没有验证错误或点击了 **cancel** 按钮，弹出窗口将被关闭。\n\n## callbacks\n\n现在，我们将在\
    \ `callbacks` 对象的 `editClick`、`showPopup` 和 `hidePopup` 方法中添加一些代码。\n\n## showPopup()\n\
    \n在 `showPopup` 方法中，我们已经添加了显示和设置弹出模态框的方法。现在我们有了一个表单，我们希望在弹出窗口打开时将焦点设置在第一个输入字段上。\n\
    \n编辑 `showPopup` 方法，添加如下所示的新代码：\n\n```\nshowPopup: function(){\n    appPopup.setModal(1);\n\
    \    appPopup.show();\n    appForm.setItemFocus(\"firstName\");\n},\n```\n\n##\
    \ hidePopup()\n\n`hidePopup` 方法已有隐藏弹出窗口的代码。现在，当弹出窗口隐藏时，我们希望清除表单值。\n\n编辑 `hidePopup`\
    \ 方法，添加以下新代码：\n\n```\nhidePopup: function(){\n    appPopup.setModal(0);\n    appPopup.hide();\n\
    \    appForm.clear();\n},\n```\n\n## editClick()\n\n当我们在网格中双击用户行时，会触发 `editClick`。在本章创建网格时，我们附加了\
    \ `onDblClick` 事件，该事件将用户 ID 传递给 `callbacks` 对象的 `editClick` 方法。现在我们将使用它来检索存储的用户信息并填充表单。\n\
    \n我们使用 `storage` 的 `getUser` 方法来检索用户对象，并使用表单的 `setFormData` 方法将这些值填充到表单中。\n\n\
    编辑 `editClick` 方法，添加以下新代码：\n\n```\neditClick: function(userId){\n    // get user\n\
    \    var user = storage.getUser(userId);\n    // load user into popup\n    appForm.setFormData(user);\n\
    \    // show popup\n    callbacks.showPopup();\n},\n```\n\n这是我们为表单在 `callbacks`\
    \ 对象中需要进行的最后一次更改。接下来，我们将向 `index.html` 添加一些 CSS，使其看起来更好一些。\n\n## 编辑表单 CSS\n\n\
    刷新页面，点击 **add** 按钮以显示弹出窗口和新创建的表单。正如您在下面的截图中所看到的，表单内容在弹出窗口的边缘显得很拥挤：\n\n![](img/bcf02c388bf10cd4c2927f8ff604bf76_100_0.png)\n"
