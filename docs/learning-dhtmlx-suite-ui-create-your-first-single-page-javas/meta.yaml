    # # 5

    The DHTMLX Toolbar


    In this chapter, we will learn about the DHTMLX toolbar component and its different
    initializations, events, methods, and settings. Then we will add a toolbar to
    the application, giving it the ability to delete and add a user.


    All changes made in this chapter will occur inside the app.js file.


    # ## The DHTMLX toolbar


    The DHTMLX toolbar is a very handy component for applications or web pages. It
    allows us to quickly and easily create a robust series of buttons, dropdowns,
    and inputs.


    When creating a DHTMLX toolbar, we have the freedom to place it inside a DOM element,
    a DHTMLX layout or a DHTMLX cell. But when attaching toolbars to the DHTMLX layout
    or cell, each are both limited to one. The following screenshots shows the differences
    of attaching a toolbar to a layout object and a cell object.


    This screenshot shows an empty toolbar and what it looks like when one is attached
    to a layout object:


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_55_0.png)'
