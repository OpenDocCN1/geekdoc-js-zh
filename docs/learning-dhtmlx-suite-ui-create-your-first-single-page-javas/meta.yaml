- md: 'Let''s fix this using CSS.


    DHTMLX provides the option of editing the CSS to meet our needs, and we will do
    this now.


    ## index.html


    Open the index.html file and locate the internal CSS styles in the head tag. Edit
    the style tag as shown in the following code snippet:


    ```

    body, html { height: 100%; width: 100%; }

    .dhxform_base { margin: 25px; }

    .dhxform_base .dhxform_base { margin: 20px 15px;}

    ```


    We added styling to the CSS class dhxform_base and nested CSS class dhxform_base.
    DHTMLX adds this class to the outer container of the entire form and each column
    created inside of the form.


    Now, refresh the page to see the newly applied styling. The pop-up window should
    now looks like the following screenshot:


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_101_0.png)


    ## Test the application form


    Now that the form is created and connected to the storage through the `callback`
    methods we can test. First, make sure the `localStorage` is cleared.


    Type and run the following code line in the console:


    ```

    localStorage.clear();

    ```


    Now refresh the page.


    Any users that were once in the grid should now be gone.


    Go through your own testing of all the following actions:


    - Add a user

    - Double-click on a user in the grid and edit

    - Select a user row in the grid and remove a user


    All of these actions will refresh the grid as data is changed. You will also notice
    the validation on the required fields.


    ## Summary


    In this chapter, we covered the DHTMLX''s form, which used a DHTMLX calendar implementation.
    We learned about initiating and attaching a form in a pop-up window and form validations.
    Then, we added the application code that allows us to add and edit users.


    In the next chapter, we will learn about the DHTMLX chart component and create
    a bar chart that will automatically update each time any user data is changed.


    ## 9 The DHTMLX Chart


    In this chapter, we will learn about the DHTMLX chart component and cover the
    different initializations, events, methods, and settings. We will then add a chart
    to the application.


    All changes done in this chapter will occur inside the app.js and index.html files.


    The DHTMLX chart component allows us to create many different types of charts
    with very little effort. DHTMLX provides chart types including area, horizontal
    bar, vertical bar, stacked vertical bar, stacked horizontal bar, donut, line,
    pie, radar, scatter, and spline. It is a very powerful collection of charts.


    For the application we will be focusing on the vertical bar chart and learn how
    to structure data and use its events.


    By the end of this chapter, we will have a great understanding of the chart component
    and add a bar chart to the application to display each user by their age.


    ### The methods and events


    We will begin by initializing a chart, adding data, defining a series, and manipulating
    the chart settings. After we have created a chart to test with we will attach
    one of the available events.


    ### Initialization of the DHTMLX chart


    Same as the other the DHTMLX components we covered, a chart can be attached to
    a DOM element or a DHTMLX layout cell.


    One important thing to know during initialization is that the chart requires a
    JavaScript object literal as an argument or an exception will occur. This JavaScript
    object can contain the settings and series for the chart or be left empty, allowing
    the settings and series to be added later.


    ## dhtmlXChart()


    The DOM initialization approach is achieved by creating a new `dhtmlXChart` object
    and setting the JavaScript object argument `container` property value to the DOM
    element''s ID. This would look like the following code. Do not enter this in the
    console:


    ```

    var myChart = new dhtmlXChart({ container: "myContainerId" });

    ```


    ## addChart()


    The `addChart` method is actually part of the DHTMLX layout cell object and attaches
    a chart directly to the cell of our choosing. Now, we will attach a chart to the
    `appLayout` cell `b`.


    Type and run the following code line in the console:


    ```

    var myChart = appLayout.cells("b").attachChart({});

    ```


    Here, we initialized a chart to a cell and assigned a reference to as the `myChart`
    variable. We will use this chart for the following exercises.


    ## Methods


    Now we will begin the exercises for the chart methods.


    ## refresh()


    The `refresh` method allows newly applied settings to show in the chart. If a
    chart setting is changed or added the `refresh` method must be used or those settings
    will not go into effect.


    It is implemented by the following code:


    ```

    myChart.refresh();

    ```


    ## add()


    The `add` method allows us to add data to a chart. Think of these as `rows` coming
    from a database or local storage. This method takes a JavaScript object literal
    as an argument. Each of the objects added to the chart must have properties of
    the same name to compare or display.


    Let us pretend that we have a social profile site with several persons. We know
    their name, age, and number of views their profile has. We will use this to add
    some data to the chart for viewing.


    Type and run the following code in the console:


    ```

    myChart.add({ name: "Steve", age: 45, profileViews: 83 });

    myChart.add({ name: "John", age: 27, profileViews: 115 });

    myChart.add({ name: "Ashley", age: 34, profileViews: 225 });

    ```


    Data is refreshed automatically to the chart. As soon as this data is added we
    will see a circle like the following screenshot:


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_105_0.png)


    We are seeing this grey circle because DHTMLX chart defaults as a pie chart and
    we did not apply any settings to the chart to tell it which data to use for comparison.


    Next we will define those settings.


    ## define()


    The `define` method allows us to individually change the chart''s settings and
    first data series. It takes two parameters. The first being the name of the property
    we will set and the second value of that property, which could be a string, object,
    Boolean, or integer depending on the property.


    Here are some of the settings:


    - view: (string) sets the type of chart

    - container: (string) used in DOM initialization

    - padding: (object, int) sets the padding of the chart

    - legend: (object) creates a chart legend

    - value: (string) sets the first series value

    - label: (string) sets the first series label

    - gradient: (function, string) sets value gradient

    - x axis: (object) sets the x axis properties

    - y axis: (object) sets the y axis properties


    Please note that these settings can be different per chart type. We are building
    a bar chart.


    ### Define a series


    First we will define a series that will let the chart know which data we want
    to compare.


    The series is broken down into several different settings:


    - value (the value to be compared)

    - label (the label for each value)

    - color (the color for that series)


    When applying the value and label to the chart they use a template syntax, which
    allows for the combining of properties from the compared objects. Each property
    must have the # as a prefix and suffix.


    Now, we will add a new series by adding the `value` setting. Remember, we need
    to refresh the chart after each setting is added.


    Type and run the following code in the console:


    ```

    myChart.define("value", "#profileViews#");

    myChart.refresh();

    ```


    This series we added is comparing the profile views that each of our data object
    received on our pretend social site.


    Adding the value allowed us to see some colored slices, but we still don''t know
    who they belong to. We will fix this with the `label` setting.


    Type and run the following code in the console:


    ```

    myChart.define("label", "#name# (#profileViews#)");

    myChart.refresh();

    ```


    We used the template syntax to show the `name` and `profileViews` in the `label`
    component. Now we know who each data set belongs to.


    There is one issue, though with the display of the chart. Resize your browser
    window until the labels are only partially visible. This can be fixed by defining
    `padding` to the chart.


    Type and run the following code in the console:


    ```

    myChart.define("padding",100);

    myChart.refresh();

    ```'
