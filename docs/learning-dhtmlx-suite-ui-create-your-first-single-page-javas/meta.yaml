    \ code line in the console:\n\n```\nmyForm.setItemFocus(\"input1\");\n```\n\n\
    The cursor will be focused in the form item named `input1` when the pop-up window\
    \ is active.\n\n## validate()\n\nThe `validate` method runs the validation rules\
    \ that were set on each form item.\n\nType and run the following code line in\
    \ the console:\n\n```\nmyForm.validate();\n```\n\nYou will notice that the label\
    \ for the required input is red and so will the text if any is entered. If there\
    \ is no text in that field, enter some and leave it there. Now, run the `validate`\
    \ method again. It will now check it once again and clears the validation on that\
    \ input.\n\n## clear()\n\nThe `clear` method resets the values in the form. Enter\
    \ some data in the input or select a date. Then, type and run the following code\
    \ line in the console:\n\n```\nmyForm.clear();\n```\n\nAll the data is now removed.\
    \ This will also clear any validation errors that may be present.\n\n## enableLiveValidation()\n\
    \nThe `enableLiveValidation` runs the validate method on blur of the form item.\n\
    \nType and run the following in the console:\n\n```\nmyForm.enableLiveValidation(true);\n\
    ```\n\nNow, when you are focused on the required input and move to the next it\
