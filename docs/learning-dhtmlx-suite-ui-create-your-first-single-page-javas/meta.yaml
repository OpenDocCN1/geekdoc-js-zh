    \    dataChanged: function(){\n\n    }\n}\n```\n\nThis object is the glue that\
    \ holds the data in sync across all of the application components. In each of\
    \ the following chapters, we will be making additions to this object.\n\n*Data\
    \ Structures, Storage, and Callbacks*\n\n## Summary\n\nIn this chapter, there\
    \ was a lot covered. We created the `storage` object, which is the data access\
    \ layer for the entire application. Then, we created the `callbacks` object and\
    \ touched briefly on how this will be used.\n\nAll supporting application code\
    \ is in place and we are ready to begin adding the DHTMLX components.\n\nIn the\
