    : callbacks.removeClick(); break;\n            default: break;\n        }\n  \
    \  });\n});\n```"
- md: "## 第6章\n\n# The DHTMLX Grid\n\nIn this chapter, we will learn about the DHTMLX\
    \ grid component covering the different initializations, events, methods, and\
    \ settings. We will then add a grid to the application that will control the user\
    \ data.\n\nAll changes done in this chapter will occur inside the app.js file.\n\
    \nIn this chapter, we will start adding code to the callbacks object and use the\
    \ storage object for the first time.\n\n## The DHTMLX grid\n\nThe DHTMLX grid\
    \ component is one of the more widely used components of the library. It has a\
    \ vast amount of settings and abilities that are so robust we could probably write\
    \ an entire book on them. But since we have an application to build, we will touch\
    \ on some of the main methods and get into utilizing it.\n\nSome of the cool features\
    \ that the grid supports is filtering, spanning rows and columns, multiple headers,\
    \ dynamic scroll loading, paging, inline editing, cookie state, dragging/ordering\
    \ columns, images, multi-selection, and events.\n\nBy the end of this chapter,\
    \ we will have a functional grid where we will control the editing, viewing, adding,\
    \ and removing of users.\n\n## The grid methods and events\n\nWhen creating a\
    \ DHTMLX grid, we first create the object; second we add all the settings and\
    \ then call a method to initialize it. After the grid is initialized data can\
    \ then be added.\n\nThe order of steps to create a grid is as follows:\n\n1. \
    \ Create the grid object\n2.  Apply settings\n3.  Initialize\n4.  Add data\n\n\
    Now we will go over initializing a grid.\n\n### Initialization choices\n\nWe can\
    \ initialize a DHTMLX grid in two ways, similar to the other DHTMLX objects. The\
    \ first way is to attach it to a DOM element and the second way is to attach it\
    \ to an existing DHTMLX layout cell or layout.\n\n> A grid can be constructed\
    \ by either passing in a JavaScript object with all the settings or built through\
    \ individual methods.\n\n### Initialization on a DOM element\n\nLet's attach the\
    \ grid to a DOM element. First we must clear the page and add a div element using\
    \ JavaScript.\n\nType and run the following code line in the developer tools console:\n\
    \n```\ndocument.body.innerHTML = \"<div id='myGridCont'></div>\";\n```\n\nWe just\
    \ cleared all of the body tags content and replaced it with a div tag having the\
    \ id attribute value of myGridCont.\n\nNow, create a grid object to the div tag,\
    \ add some settings and initialize it.\n\nType and run the following code in the\
    \ developer tools console:\n\n```\nvar myGrid = new dhtmlXGridObject(\"myGridCont\"\
    );\nmyGrid.setImagePath(config.imagePath);\nmyGrid.setHeader([\"Column1\", \"\
    Column2\", \"Column3\"]);\nmyGrid.init();\n```\n\nYou should see the page with\
    \ showing just the grid header with three columns.\n\nNext, we will create a grid\
    \ on an existing cell object.\n\n### Initialization on a cell object\n\nRefresh\
    \ the page and add a grid to the `appLayout` cell.\n\nType and run the following\
    \ code in the developer tools console:\n\n```\nvar myGrid = appLayout.cells(\"\
    a\").attachGrid();\nmyGrid.setImagePath(config.imagePath);\nmyGrid.setHeader([\"\
    Column1\", \"Column2\", \"Column3\"]);\nmyGrid.init();\n```\n\nYou will now see\
    \ the grid columns just below the toolbar.\n\n## Grid methods\n\nNow let's go\
    \ over some available grid methods. Then we can add rows and call events on this\
    \ grid.\n\nFor these exercises we will be using the global `appLayout` variable.\n\
    \nRefresh the page.\n\n### attachGrid\n\nWe will begin by creating a grid to a\
    \ cell.\n\nThe `attachGrid` method creates and attaches a grid object to a cell.\
    \ This is the first step in creating a grid.\n\nType and run the following code\
    \ line in the console:\n\n```\nvar myGrid = appLayout.cells(\"a\").attachGrid();\n\
    ```\n\n### setImagePath\n\nThe `setImagePath` method allows the grid to know where\
    \ we have the images placed for referencing in the design. We have the application\
    \ image path set in the `config` object.\n\nType and run the following code line\
    \ in the console:\n\n```\nmyGrid.setImagePath(config.imagePath);\n```\n\n### setHeader\n\
    \nThe `setHeader` method sets the column headers and determines how many headers\
    \ we will have. The argument is a JavaScript array.\n\nType and run the following\
    \ code line in the console:\n\n```\nmyGrid.setHeader([\"Column1\", \"Column2\"\
    , \"Column3\"]);\n```\n\n### setInitWidths\n\nThe `setInitWidths` method will\
    \ set the initial widths of each of the columns. The asterisk mark (*) is used\
    \ to set the width automatically.\n\nType and run the following code line in the\
    \ console:\n\n```\nmyGrid.setInitWidths(\"125,95,*\");\n```\n\n### setColAlign\n\
    \nThe `setColAlign` method allows us to align the column's content position.\n\
    \nType and run the following code line in the console:\n\n```\nmyGrid.setColAlign(\"\
    right,center,left\");\n```\n\n### init\n\nUp until this point, we haven't seen\
    \ much going on. It was all happening behind the scenes. To see these changes\
    \ the grid must be initialized.\n\nType and run the following code line in the\
    \ console:\n\n```\nmyGrid.init();\n```\n\nNow you see the columns that we provided.\n\
    \n### addRow\n\nNow that we have a grid created let's add a couple rows and start\
    \ interacting.\n\nThe `addRow` method adds a row to the grid. The parameters are\
    \ ID and columns.\n\nType and run the following code in the console:\n\n```\n\
    myGrid.addRow(1, [\"test1\", \"test2\", \"test3\"]);\nmyGrid.addRow(2, [\"test1\"\
    , \"test2\", \"test3\"]);\n```\n\nWe just created two rows inside the grid.\n\n\
    ### setColTypes\n\nThe `setColTypes` method sets what types of data a column will\
    \ contain.\n\nThe available type options are:\n\n- ro (readonly)\n- ed (editor)\n\
    - txt (textarea)\n- ch (checkbox)\n- ra (radio button)\n- co (combobox)\n\nCurrently,\
    \ the grid allows for inline editing if you were to double-click on grid cell.\
    \ We do not want this for the application. So, we will set the column types to\
    \ read-only.\n\nType and run the following code in the console:\n\n```\nmyGrid.setColTypes(\"\
    ro,ro,ro\");\n```\n\nNow the cells are no longer editable inside the grid.\n\n\
    ### getSelectedRowId\n\nThe `getSelectedRowId` method returns the ID of the selected\
    \ row. If there is nothing selected it will return null.\n\nType and run the following\
    \ code line in the console:\n\n```\nmyGrid.getSelectedRowId();\n```\n\n### clearSelection\n\
    \nThe `clearSelection` method clears all selections in the grid.\n\nType and run\
    \ the following code line in the console:\n\n```\nmyGrid.clearSelection();\n```\n\
    \nNow any previous selections are cleared.\n\n### clearAll\n\nThe `clearAll` method\
    \ removes all the grid rows. Prior to adding more data to the grid we first must\
    \ clear it. If not we will have duplicated data.\n\nType and run the following\
    \ code line in the console:\n\n```\nmyGrid.clearAll();\n```\n\nNow the grid is\
    \ empty.\n\n### parse\n\nThe `parse` method allows the loading of data to a grid\
    \ in the format of an XML string, CSV string, XML island, XML object, JSON object,\
    \ and JavaScript array. We will use the `parse` method with a JSON object while\
    \ creating a grid for the application.\n\nHere is what the `parse` method syntax\
    \ looks like (do not run this in console):\n\n```\nmyGrid.parse(data, \"json\"\
    );\n```\n\n## Grid events\n\nThe DHTMLX grid component has a vast amount of events.\
    \ You can view them in their entirety in the documentation. We will cover the\
    \ `onRowDblClicked` and `onRowSelect` events.\n\n### onRowDblClicked\n\nThe `onRowDblClicked`\
    \ event is triggered when a grid row is double-clicked. The handler receives the\
    \ argument of the row ID that was double-clicked. Type and run the following code\
    \ in console:\n\n```\nmyGrid.attachEvent(\"onRowDblClicked\", function(rowId){\n\
    \    console.log(rowId);\n});\n```\n\nDouble-click one of the rows and the console\
    \ will log the ID of that row."
  mdcn: "\n## 第6章\n\n# DHTMLX Grid\n\n在本章中，我们将学习 DHTMLX Grid 组件，涵盖不同的初始化方法、事件、方法和设置。然后，我们将在应用程序中添加一个网格，以控制用户数据。\n\
    \n本章的所有更改都将发生在 `app.js` 文件中。\n\n在本章中，我们将开始向 `callbacks` 对象添加代码，并首次使用 `storage`\
    \ 对象。\n\n## DHTMLX Grid\n\nDHTMLX Grid 组件是该库中使用最广泛的组件之一。它拥有大量的设置和功能，功能非常强大，我们可能可以为此写一整本书。但由于我们要构建一个应用程序，我们将介绍一些主要方法并深入探讨其使用。\n\
    \nGrid 支持的一些很酷的功能包括：过滤、行和列合并、多级表头、动态滚动加载、分页、行内编辑、Cookie 状态、拖放/排序列、图片显示、多选以及事件处理。\n\
    \n在本章结束时，我们将拥有一个功能齐全的网格，用于控制用户的编辑、查看、添加和删除操作。\n\n## Grid 方法与事件\n\n创建一个 DHTMLX\
    \ Grid 时，我们首先创建对象；其次添加所有设置，然后调用一个方法来初始化它。网格初始化后，就可以添加数据了。\n\n创建网格的步骤顺序如下：\n\n\
    1.  创建网格对象\n2.  应用设置\n3.  初始化\n4.  添加数据\n\n现在我们将介绍如何初始化网格。\n\n### 初始化选择\n\n我们可以用两种方式初始化\
    \ DHTMLX Grid，与其他 DHTMLX 对象类似。第一种方式是将其附加到 DOM 元素上，第二种方式是将其附加到现有的 DHTMLX Layout\
    \ 单元格或布局上。\n\n> 可以通过传入包含所有设置的 JavaScript 对象，或者通过单独调用方法来构建一个 Grid。\n\n### 在 DOM\
    \ 元素上初始化\n\n让我们将网格附加到一个 DOM 元素上。首先，我们必须清空页面并使用 JavaScript 添加一个 `div` 元素。\n\n在开发者工具控制台中输入并运行以下代码行：\n\
    \n```\ndocument.body.innerHTML = \"<div id='myGridCont'></div>\";\n```\n\n我们刚刚清空了所有\
    \ `<body>` 标签的内容，并用一个 `id` 属性值为 `myGridCont` 的 `div` 标签替换了它。\n\n现在，为这个 `div` 标签创建一个网格对象，添加一些设置并初始化它。\n\
    \n在开发者工具控制台中输入并运行以下代码：\n\n```\nvar myGrid = new dhtmlXGridObject(\"myGridCont\"\
    );\nmyGrid.setImagePath(config.imagePath);\nmyGrid.setHeader([\"Column1\", \"\
    Column2\", \"Column3\"]);\nmyGrid.init();\n```\n\n你应该会看到页面上只显示一个带有三列的网格头部。\n\n\
    接下来，我们将在现有的单元格对象上创建一个网格。\n\n### 在单元格对象上初始化\n\n刷新页面，并将一个网格添加到 `appLayout` 单元格中。\n\
    \n在开发者工具控制台中输入并运行以下代码：\n\n```\nvar myGrid = appLayout.cells(\"a\").attachGrid();\n\
    myGrid.setImagePath(config.imagePath);\nmyGrid.setHeader([\"Column1\", \"Column2\"\
    , \"Column3\"]);\nmyGrid.init();\n```\n\n现在，你会看到网格列就在工具栏下方。\n\n## Grid 方法\n\n\
    现在我们来介绍一些可用的 Grid 方法。然后我们就可以在这个网格中添加行并调用事件。\n\n在这些练习中，我们将使用全局变量 `appLayout`。\n\
    \n刷新页面。\n\n### attachGrid\n\n我们将从在单元格上创建一个网格开始。\n\n`attachGrid` 方法创建一个网格对象并将其附加到单元格上。这是创建网格的第一步。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nvar myGrid = appLayout.cells(\"a\").attachGrid();\n\
    ```\n\n### setImagePath\n\n`setImagePath` 方法允许网格知道我们在设计中引用的图片位置。我们已经在 `config`\
    \ 对象中设置了应用程序的图片路径。\n\n在控制台中输入并运行以下代码行：\n\n```\nmyGrid.setImagePath(config.imagePath);\n\
    ```\n\n### setHeader\n\n`setHeader` 方法设置列标题，并决定我们将有多少个标题。参数是一个 JavaScript 数组。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nmyGrid.setHeader([\"Column1\", \"Column2\", \"Column3\"\
    ]);\n```\n\n### setInitWidths\n\n`setInitWidths` 方法将设置每列的初始宽度。星号（`*`）用于自动设置宽度。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nmyGrid.setInitWidths(\"125,95,*\");\n```\n\n### setColAlign\n\
    \n`setColAlign` 方法允许我们对齐列内容的位置。\n\n在控制台中输入并运行以下代码行：\n\n```\nmyGrid.setColAlign(\"\
    right,center,left\");\n```\n\n### init\n\n到目前为止，我们还没有看到太多变化。这都是在后台发生的。为了看到这些变化，必须初始化网格。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nmyGrid.init();\n```\n\n现在你看到了我们提供的列。\n\n### addRow\n\
    \n现在我们已经创建了一个网格，让我们添加几行并开始交互。\n\n`addRow` 方法向网格中添加一行。参数是 ID 和列数据。\n\n在控制台中输入并运行以下代码：\n\
    \n```\nmyGrid.addRow(1, [\"test1\", \"test2\", \"test3\"]);\nmyGrid.addRow(2,\
    \ [\"test1\", \"test2\", \"test3\"]);\n```\n\n我们刚刚在网格内创建了两行。\n\n### setColTypes\n\
    \n`setColTypes` 方法设置一列将包含的数据类型。\n\n可用的类型选项有：\n\n-   `ro`（只读）\n-   `ed`（编辑器）\n\
    -   `txt`（文本域）\n-   `ch`（复选框）\n-   `ra`（单选按钮）\n-   `co`（组合框）\n\n目前，如果你双击网格单元格，网格允许进行行内编辑。我们不希望应用程序有这个功能。所以，我们将把列类型设置为只读。\n\
    \n在控制台中输入并运行以下代码：\n\n```\nmyGrid.setColTypes(\"ro,ro,ro\");\n```\n\n现在网格内的单元格不再可编辑。\n\
    \n### getSelectedRowId\n\n`getSelectedRowId` 方法返回选中行的 ID。如果没有选中任何内容，它将返回 `null`。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nmyGrid.getSelectedRowId();\n```\n\n### clearSelection\n\
    \n`clearSelection` 方法清除网格中的所有选中项。\n\n在控制台中输入并运行以下代码行：\n\n```\nmyGrid.clearSelection();\n\
    ```\n\n现在之前的任何选中状态都已清除。\n\n### clearAll\n\n`clearAll` 方法移除所有的网格行。在向网格添加更多数据之前，我们必须先清空它。否则我们将得到重复的数据。\n\
    \n在控制台中输入并运行以下代码行：\n\n```\nmyGrid.clearAll();\n```\n\n现在网格是空的。\n\n### parse\n\n\
    `parse` 方法允许以 XML 字符串、CSV 字符串、XML 岛、XML 对象、JSON 对象和 JavaScript 数组的格式将数据加载到网格中。在为应用程序创建网格时，我们将使用带有\
    \ JSON 对象的 `parse` 方法。\n\n以下是 `parse` 方法的语法示例（不要在控制台中运行）：\n\n```\nmyGrid.parse(data,\
    \ \"json\");\n```\n\n## Grid 事件\n\nDHTMLX Grid 组件拥有大量的事件。你可以在文档中查看完整的事件列表。我们将介绍\
    \ `onRowDblClicked` 和 `onRowSelect` 事件。\n\n### onRowDblClicked\n\n当双击网格行时，会触发\
    \ `onRowDblClicked` 事件。事件处理函数接收被双击行的 ID 作为参数。在控制台中输入并运行以下代码：\n\n```\nmyGrid.attachEvent(\"\
    onRowDblClicked\", function(rowId){\n    console.log(rowId);\n});\n```\n\n双击其中一行，控制台将记录该行的\
    \ ID。\n"
