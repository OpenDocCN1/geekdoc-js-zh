  md: '# # setColTypes


    The `setColTypes` method sets what types of data a column will contain.


    The available type options are:


    +   - ro (readonly)

    - ed (editor)

    - txt (textarea)

    - ch (checkbox)

    - ra (radio button)

    - co (combobox)


    Currently, the grid allows for inline editing if you were to double-click on grid
    cell. We do not want this for the application. So, we will set the column types
    to read-only.


    Type and run the following code in the console:


    ```

    myGrid.setColTypes("ro,ro,ro");

    ```


    Now the cells are no longer editable inside the grid.


    # # getSelectedRowId


    The `getSelectedRowId` method returns the ID of the selected row. If there is
    nothing selected it will return null.


    Type and run the following code line in the console:


    ```

    myGrid.getSelectedRowId();

    ```


    # # clearSelection


    The `clearSelection` method clears all selections in the grid.


    Type and run the following code line in the console:


    ```

    myGrid.clearSelection();

    ```


    Now any previous selections are cleared.'
