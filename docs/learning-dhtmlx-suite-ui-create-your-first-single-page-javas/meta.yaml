  md: '# Testing


    In the previous chapter, we added a list of users and lightly tested the application.
    Now that it is all completed, it looks like the following screenshot:


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_118_0.png)


    This is the time to test all of the functionality that was created. When testing,
    make sure you go through all of the points listed as follows:


    +   - The form should have all of the correct validations

    - The toolbar should enable and disable buttons and trigger the popup

    - Double-clicking a row should open the form with user information

    - Updating or adding a user should change the data in the grid and chart

    - There should not be any z-index issues with the popup over the chart


    Next let''s talk about troubleshooting.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# # Troubleshooting


    When developing in JavaScript, syntax errors are extremely common, because errors
    happen at runtime and editors for JavaScript can be extremely limited. But if
    you pay close attention to your developer console in Chrome it will take you straight
    to the error and give a pretty reasonable explanation with the provided exception.


    Some of the most frequent things that happen are:


    +   - Missing a trailing comma between items in an object

    - Missing a parenthesis or bracket when using event handlers

    - Case sensitivity in variables and methods


    They may sound like simple issues and they are. If you are a seasoned developer,
    you already know those nuances. If not, always keep these in mind because it can
    save you a lot of time debugging to check those first. These types of syntax errors
    tend to happen after long hours in front of code.


    The grid component can provide issues when first learning, particularly, the initialization.
    This is because the grid has a separate `init` method that is called after it
    is created and all of the settings are applied. So keep this in mind as well.


    Next, let''s talk about how to take the application to the next level.


    # # More features


    The application we built was a fairly simple application to get us familiar with
    the components. But, if we want to use this in a real world environment, it would
    need some tweaking.


    # # Server side


    HTML5''s localStorage is excellent for storing data on the client side and even
    allowing web applications to work offline. But once this data needs to be shared
    among other web users there needs to be some type of server-side storage for each
    client to share changes to the data.


    There are so many options to choose from. Personally, I would create a web service
    that would write to a server-side database. Because we separated all of our data
    calls into the `storage` object, essentially a **DAL (Data Access Layer)**, all
    that we would need to do is adjust these methods and add some Ajax calls. The
    rest of the application would remain untouched. Well, except for adding some `progressOn`
    and `progressOff` methods.'
  merge: -1
  pgno: 119
- img_proc: true
  md: "# Adding icons\n\nSomething we didn't go over in the earlier chapters is the\
    \ additional icons. This is a really nice feature to add to any application.\n\
    \nAdding a plus image to the **add** button and a red x image to the **remove**\
    \ button in the toolbar would make it look more professional. You can also use\
    \ icons without text to save on toolbar space, and the tooltip feature to provide\
    \ more information on the functionality of that button.\n\nThe default skin that\
    \ we used in our application uses 18 X 18 pixel images, preferably a .png with\
    \ a transparent background.\n\nThe pop-up window could also have an icon in the\
    \ header. This could be set as a small user icon and perhaps change the icon depending\
    \ on if we are adding or editing a user.\n\nCheck out each of the component's\
    \ documentation for their methods on adding images and icons.\n\n# Event tweaks\n\
    \nOne of the particular event tweaks that should be touched on is the event for\
    \ the calendar in the form. If the date input is focused on, we could automatically\
    \ trigger the calendar and not allow free entering of a date by the keyboard.\
    \ But, this is by taste and not totally necessary since there is date validation.\
    \ This one you can decide on.\n\nOne thing that I prefer to do is to apply the\
    \ date value from the calendar when the year is selected. As of right now, to\
    \ change the year for the dob of a user, you would need to select the year and\
    \ day again before the calendar will apply the data change in the form. This can\
    \ be quite annoying and can be fixed.\n\nThe calendar has an `onChange` event\
    \ that triggers any time the value is changed in the calendar component. This\
    \ event returns the value of the current calendar selected value. Using this event,\
    \ you could update the value to the input any time the date is changed, whether\
    \ it is the month, day, or year.\n\nHere is what the code looks like to apply\
    \ it to the application:\n\n```\nvar dobCal = appForm.getCalendar(\"dob\");\n\
    dobCal.attachEvent(\"onChange\", function(date){\n    appForm.setItemValue(\"\
    dob\", date);\n});\n```\n\nThis would go after the form initialization method\
    \ and would work if you added it now."
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Chart ideas


    Another nice addition would be to allow the person using the application to change
    the chart type. There are several different approaches on how this could be accomplished.
    One of them would be to add a toolbar to the cell that has the chart in it. This
    toolbar could have a select button with the different chart types as options.
    When the select button changes, you could change the chart settings to match the
    selected chart type. You could also add icons next to each of the item''s text
    or just have an icon for the option.


    If you really wanted to get fancy, you could leave the chart empty with no data.
    Create an additional button on the toolbar to add users to the chart by choice.
    Therefore, when a user is selected in the grid and the newly created button is
    pressed, it would add the selected user''s data to the chart. This would take
    some tweaking of the current code that retrieves the data. You may also want to
    create a clear button on the chart side to empty the data.


    We could keep going for another 10 pages of where to take this application, but
    that wouldn''t be creative on your part! So, now it''s your turn! Give some thought
    to how this could grow and keep it in your toolbox of code for later referencing
    as you get better with the DHTMLX library!


    # Summary


    In this chapter, we went over the application and some things to be vigilant of
    while developing in JavaScript and with the DHTMLX library. We also discussed
    some cool code additions and looked at a small sample for you to add on your own.
    This concludes programming of the user application with the DHTMLX library. I
    hope you take some of these mentioned ideas and mix them with your own to further
    develop the application.'
  merge: -1
