- md: '## 4 The DHTMLX Layout


    In this chapter, we will learn about the DHTMLX layout component covering the
    different initializations, events, methods, and settings. Then, we will create
    the main layout for the application.


    All changes done in this chapter will occur inside the `app.js` file where we
    will add a creation method inside the page load event.


    ### The DHTMLX Layout


    The DHTMLX layout is a powerful component that gives us the ability to create
    web interfaces. To put it in simple terms, it is a highly flexible container that
    we can attach many different components to. A layout can be used to split the
    page, or specified DOM container, into multiple horizontal and vertical panels
    to handle the placement of UI components. These individual panels are called cells.
    This is similar to dividing a page into containers with div or table elements.
    But unlike div and table elements, the DHTMLX cells can be resized, can grow and
    shrink with the page, and have multiple configurations.


    The layout component is made up of itself, as the parent, and one or more child
    cells. DHTMLX provides predefined patterns when creating a layout. They range
    from dividing the page into columns, rows, or a combination of both. The predefined
    patterns are already available for use with the library code that was installed
    in the install chapter.


    DHTMLX also provides more patterns that can be added via additional JavaScript
    files. The steps to do this are in the documentation for the layout component.
    For the application we are creating we will use the predefined pattern 2U. This
    pattern will divide the page into two columns.


    The following figure shows the available predefined patterns along with their
    associated names:


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_46_0.png)


    When developing an application you may find that one of the provided patterns
    does not fit your needs. DHTMLX does not currently provide a way to create a custom
    layout pattern. Until they do, the quickest way to customize a pattern is by building
    one with multiple layouts. This is done by attaching another layout to one or
    more child cells of a layout.


    Some of the major benefits of the layout component are the built-in methods to
    attach other DHTMLX components. The layout and its cells give developers a means
    to easily create an iframe, HTML string, HTML object, and most of the DHTMLX suite
    components. When a layout is created to an HTML `body` tag all the components
    inside it will follow the resizing of the browser window, providing that the `body`
    tag has the CSS height and width of `100%`.


    Check out the next screenshot of a 2U layout pattern to get an idea of how the
    layout and cells relate to each other:


    ![](img/bcf02c388bf10cd4c2927f8ff604bf76_47_0.png)


    ### The Methods and Events


    The DHTMLX layout is made up predominantly of two object types, one being the
    layout itself and secondly the cells which are its children. Why is this important
    to know? Some of the same methods can be called on either the layout object or
    the cell objects. But there are differences as you will see.


    Now, open up the application in the Chrome browser with the developer tools console
    available. We will begin attaching layouts and learning the different methods
    and events which will help us better understand how the application is being developed.


    ### Initialization


    Initialization of a layout component can be done in two ways: by attaching a new
    layout object to an existing cell, or by attaching it to a DOM element on the
    page.


    We will first attach a layout component to a DOM element and learn how to access
    the cells.


    In your console type and run the following code:


    ```

    new dhtmlXLayoutObject(document.body);

    ```


    You should see a new three cell layout with a header of a, b, and c.


    Let''s clear that by refreshing the page; and then type and run the following
    code in the console:


    ```

    new dhtmlXLayoutObject(document.body, "3E");

    ```


    The same layout pattern was created because the second parameter for the layout
    constructor is the layout pattern. By default, DHTMLX sets the layout pattern
    3E. You can choose from any of the predefined patterns we spoke of earlier.


    Refresh the page once again so we can add a different layout and learn about accessing
    its cells. This time we need to assign a reference of the layout we create to
    a variable.


    Type the following code in the console:


    ```

    var myLayout = new dhtmlXLayoutObject(document.body, "2U");

    ```


    As you can see we now have two cells. One shows "a" and other shows "b". When
    a layout is first created each child cell''s header will have its cell ID as the
    text. This helps for quick identification. The cell''s ID is how we will access
    that cell''s object and its methods. Let''s access one of the cells and attach
    a child layout component and save a reference to it.


    Type and run the following code:


    ```

    var myChildLayout = myLayout.cells("a").attachLayout("3E");

    ```


    Attaching a layout component through this approach only uses one argument. Again
    this will default to the 3E pattern if an argument is not passed. Anytime a layout
    component is created the method used to create it will return the created layout
    object.


    Each of the cells inside any created layout comes with a header bar that can expand
    or collapse until it is either removed or a child layout component is attached.
    Then the header for that cell is no longer visible.


    ### Methods


    Now, we will cover some of the methods available for the layout component and
    the individual cells.


    ### Cell Sizing


    Of course with any design on an HTML page, we want to have control of widths and
    heights.


    Refresh the page and create a layout that we can use to set the height and width.

    Type and run the following code:


    ```

    var myLayout = new dhtmlXLayoutObject(document.body, "3T");

    ```


    ### setHeight


    Set the height of cell "a". Type and run the following code:


    ```

    myLayout.cells("a").setHeight(55);

    ```


    Now cell a has the height set to 55 pixels.


    ### setWidth


    Set the width of cell "b". Type and run the following code:


    ```

    myLayout.cells("b").setWidth(70);

    ```


    Now cell b has the width set to 70 pixels.


    ### fixSize


    You may have noticed when creating a layout that each cell is separated by a divider.
    This divider can be dragged to resize the cells in the page. This feature can
    be disabled by using the `fixSize()` method.


    The `fixSize()` method takes the arguments of the x and y axis as Boolean or truthy
    and falsy values, stating whether or not each axis can be resized.


    Type and run the following code:


    ```

    myLayout.cells("b").fixSize(0,1);

    ```


    Cell b and any cells sharing the x axis divider can no longer be sized vertically.


    Type and run the following code:


    ```

    myLayout.cells("b").fixSize(1,1);

    ```


    Cell b and any cells sharing the y axis divider can no longer be sized horizontally.


    ### Cell Header


    Each cell has a header that we can manipulate by collapsing, changing the text,
    hiding, or showing.


    ### showHeader and hideHeader


    The `showHeader` and `hideHeader` methods show and hide the cell header.

    Type and run the following code:


    ```

    myLayout.cells("c").hideHeader();

    ```


    Then type in the given code and run the following:


    ```

    myLayout.cells("c").showHeader();

    ```


    ### setText


    DHTMLX sets the header text of a cell to the cell ID by default. To change this
    text we use the `setText` method.

    Type and run the following code:


    ```

    myLayout.cells("a").setText("My Top Cell");

    ```


    ### progressOn and progressOff


    When building a JavaScript application with Ajax, it is important to provide an
    indicator during wait periods. This allows the person behind the keyboard to know
    that they are waiting for something to be returned and if necessary block some
    interface features from being used.

    Both the layout object and cell object have the ability to show an indicator.
    The methods to do so are the `progressOn()` and `progressOff()` methods.

    Now we will see what these look like with the layout we created.

    Type and run the following code:


    ```

    myLayout.progressOn();

    ```


    The ability to access any interface functionality inside this layout is now blocked.

    Now, turn off that progress indicator.

    Type and run the following code:


    ```

    myLayout.progressOff();

    ```'
