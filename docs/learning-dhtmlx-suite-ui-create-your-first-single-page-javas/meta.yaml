  md: '**Ed Wildgoose** grew up in the time when a ZX81 was cutting edge and spent
    his formative years slaving away in the finance world, before deciding that the
    way ahead was to start slaving away for even longer hours and less money as his
    own boss. He enjoys learning about the art of IT for its own sake and has played
    with most common (and uncommon) programming languages and tools over the years
    (Did anyone else enjoy using Haskell in the early 90s?). He has developed projects
    on Mac, Windows, and Linux over past years, but most currently favors Linux for
    backend servers and Mac on the desktop.


    He currently owns MailASail (http://mailasail.com), a boutique, which supplies
    services for users with satellite phones and roaming cellular devices. MailASail
    is a leading supplier of satellite hardware and airtime, but specialize in offering
    in-house solutions, which optimize TCP data over the expensive satellite links,
    that is, you can grab your iPhone and read your email from the middle of an ocean,
    desert, or glacier, for a very affordable cost! Their customers range from BBC
    nature documentary creators through to ocean rowers.


    > I would like to thank my wife Sue, and, my children, Katie and Luke, for putting
    up without their father while he spent far too long working.'
