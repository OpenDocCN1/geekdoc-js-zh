  md: "# onClose\n\nThe `onClose` event triggers just before the pop-up window closes.\
    \ This allows us some freedom to manipulate something prior to it actually closing.\
    \ It can also be used to prevent it from closing.\n\nWhen the `onClose` event\
    \ is attached to a pop-up window, we must return a `true` value from the handler\
    \ we provide or it will not close.\n\nType and run the following code in the console:\n\
    \n```\nmyPopup.attachEvent(\"onClose\",function(){\n    console.log(\"close clicked\"\
    );\n});\n```\n\nNow try to close the pop-up window with the close button. The\
    \ event is fired and the text is logged in the console but the popup does not\
    \ close.\n\nType and run the following code in the console:\n\n```\nmyPopup.detachAllEvents();\n\
    myPopup.attachEvent(\"onClose\",function(){\n    console.log(\"close clicked again\"\
    );\n    return true;\n});\n```\n\nWe detached the previously added event, then\
    \ added a new event that returns true allowing the event to complete.\n\nNext\
    \ we will create the pop-up window for the application.\n\n# The application code\n\
    \nThe application code for this chapter will create a pop-up window that will\
    \ open when a grid row is double-clicked or when the when the **add** button on\
    \ the toolbar is pressed. Once the pop-up window is created we do not want to\
    \ recreate it again; so we will only hide and show it. To prevent the pop-up window\
    \ from closing when the close button is pressed we will use the `onClose` event\
    \ we discussed in the previous section."
  merge: -1
