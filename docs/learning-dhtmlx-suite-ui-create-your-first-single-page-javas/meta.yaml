  md: '# # Cell sizing


    Of course with any design on an HTML page, we want to have control of widths and
    heights.


    Refresh the page and create a layout that we can use to set the height and width.

    Type and run the following code:


    ```

    var myLayout = new dhtmlXLayoutObject(document.body, "3T");

    ```


    # # setHeight


    Set the height of cell "a". Type and run the following code:


    ```

    myLayout.cells("a").setHeight(55);

    ```


    Now cell a has the height set to 55 pixels.


    # # setWidth


    Set the width of cell "b". Type and run the following code:


    ```

    myLayout.cells("b").setWidth(70);

    ```


    Now cell b has the width set to 70 pixels.


    # # fixSize


    You may have noticed when creating a layout that each cell is separated by a divider.
    This divider can be dragged to resize the cells in the page. This feature can
    be disabled by using the `fixSize()` method.


    The `fixSize()` method takes the arguments of the x and y axis as Boolean or truthy
    and falsy values, stating whether or not each axis can be resized.


    Type and run the following code:


    ```

    myLayout.cells("b").fixSize(0,1);

    ```


    Cell b and any cells sharing the x axis divider can no longer be sized vertically.


    Type and run the following code:


    ```

    myLayout.cells("b").fixSize(1,1);

    ```


    Cell b and any cells sharing the y axis divider can no longer be sized horizontally.'
