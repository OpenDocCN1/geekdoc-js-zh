  md: '# # 9

    # The DHTMLX Chart


    In this chapter, we will learn about the DHTMLX chart component and cover the
    different initializations, events, methods, and settings. We will then add a chart
    to the application.


    All changes done in this chapter will occur inside the app.js and index.html files.


    The DHTMLX chart component allows us to create many different types of charts
    with very little effort. DHTMLX provides chart types including area, horizontal
    bar, vertical bar, stacked vertical bar, stacked horizontal bar, donut, line,
    pie, radar, scatter, and spline. It is a very powerful collection of charts.


    For the application we will be focusing on the vertical bar chart and learn how
    to structure data and use its events.


    By the end of this chapter, we will have a great understanding of the chart component
    and add a bar chart to the application to display each user by their age.


    # ## The methods and events


    We will begin by initializing a chart, adding data, defining a series, and manipulating
    the chart settings. After we have created a chart to test with we will attach
    one of the available events.


    # ## Initialization of the DHTMLX chart


    Same as the other the DHTMLX components we covered, a chart can be attached to
    a DOM element or a DHTMLX layout cell.


    One important thing to know during initialization is that the chart requires a
    JavaScript object literal as an argument or an exception will occur. This JavaScript
    object can contain the settings and series for the chart or be left empty, allowing
    the settings and series to be added later.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# dhtmlXChart()


    The DOM initialization approach is achieved by creating a new `dhtmlXChart` object
    and setting the JavaScript object argument `container` property value to the DOM
    element''s ID. This would look like the following code. Do not enter this in the
    console:


    ```

    var myChart = new dhtmlXChart({ container: "myContainerId" });

    ```


    # addChart()


    The `addChart` method is actually part of the DHTMLX layout cell object and attaches
    a chart directly to the cell of our choosing. Now, we will attach a chart to the
    `appLayout` cell `b`.


    Type and run the following code line in the console:


    ```

    var myChart = appLayout.cells("b").attachChart({});

    ```


    Here, we initialized a chart to a cell and assigned a reference to as the `myChart`
    variable. We will use this chart for the following exercises.


    # Methods


    Now we will begin the exercises for the chart methods.


    # refresh()


    The `refresh` method allows newly applied settings to show in the chart. If a
    chart setting is changed or added the `refresh` method must be used or those settings
    will not go into effect.


    It is implemented by the following code:


    ```

    myChart.refresh();

    ```


    # add()


    The `add` method allows us to add data to a chart. Think of these as `rows` coming
    from a database or local storage. This method takes a JavaScript object literal
    as an argument. Each of the objects added to the chart must have properties of
    the same name to compare or display.


    Let us pretend that we have a social profile site with several persons. We know
    their name, age, and number of views their profile has. We will use this to add
    some data to the chart for viewing.'
  merge: -1
  pgno: 104
