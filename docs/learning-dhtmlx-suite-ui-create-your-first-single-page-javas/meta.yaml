- img_proc: true
  md: '# define()


    The `define` method allows us to individually change the chart''s settings and
    first data series. It takes two parameters. The first being the name of the property
    we will set and the second value of that property, which could be a string, object,
    Boolean, or integer depending on the property.


    Here are some of the settings:


    +   - view: (string) sets the type of chart

    - container: (string) used in DOM initialization

    - padding: (object, int) sets the padding of the chart

    - legend: (object) creates a chart legend

    - value: (string) sets the first series value

    - label: (string) sets the first series label

    - gradient: (function, string) sets value gradient

    - x axis: (object) sets the x axis properties

    - y axis: (object) sets the y axis properties


    Please note that these settings can be different per chart type. We are building
    a bar chart.


    # Define a series


    First we will define a series that will let the chart know which data we want
    to compare.


    The series is broken down into several different settings:


    +   - value (the value to be compared)

    - label (the label for each value)

    - color (the color for that series)'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'When applying the value and label to the chart they use a template syntax,
    which allows for the combining of properties from the compared objects. Each property
    must have the # as a prefix and suffix.


    Now, we will add a new series by adding the `value` setting. Remember, we need
    to refresh the chart after each setting is added.


    Type and run the following code in the console:


    ```

    myChart.define("value", "#profileViews#");

    myChart.refresh();

    ```


    This series we added is comparing the profile views that each of our data object
    received on our pretend social site.


    Adding the value allowed us to see some colored slices, but we still don''t know
    who they belong to. We will fix this with the `label` setting.


    Type and run the following code in the console:


    ```

    myChart.define("label", "#name# (#profileViews#)");

    myChart.refresh();

    ```


    We used the template syntax to show the `name` and `profileViews` in the `label`
    component. Now we know who each data set belongs to.


    There is one issue, though with the display of the chart. Resize your browser
    window until the labels are only partially visible. This can be fixed by defining
    `padding` to the chart.


    Type and run the following code in the console:


    ```

    myChart.define("padding",100);

    myChart.refresh();

    ```'
