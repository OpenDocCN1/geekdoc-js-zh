  md: '# Valuable JavaScript Strict Equality and Targeted Inequality for the Best
    Outcome


    ![](img/894414db2510c23b727da47fdb152ea2_108_0.png)


    Photo by Markus Winkler on Unsplash


    I have to admit that equality in JavaScript can be confusing. I didn’t fully grasp
    the differences until I took the time to review them. Three equal signs look odd
    to me.

    Let’s clear it up for you too. First off we can review strict equality. Then move
    to strict inequality. Lastly, we can wrap this up with an example and discussion
    of strict vs loose.


    # Strict Equality'
