  md: '# 19


    It Is Time To Spotlight the JavaScript Arrow Function


    ![](img/894414db2510c23b727da47fdb152ea2_104_0.png)


    Photo by [Nick Fewings](https://unsplash.com/) on [Unsplash](https://unsplash.com/)


    Programming requires us to learn as the technology changes. JavaScript is no different.
    It has undergone large changes throughout the years. JavaScript Arrow functions
    are part of a major change that happened in 2015.


    # JavaScript Arrow Function


    These are a concise substitute for [functional](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions).
    They don''t have the bindings for this, super, etc. Arrow functions can''t be
    used as constructors either.'
