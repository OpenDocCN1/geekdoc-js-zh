    \ this example we see them all.\n\n```\n// function expression\nmessage = function()\
    \ {\n  return \"A message from Tom\";\n}\n\n// function declaration\nfunction\
    \ functionDeclaration() {\n  // statements\n};\n\n// arrow function\nmessage =\
    \ () => \"A message from Tom\";\n```"
