  md: 'Here are four examples to paint a picture for you. Take a close look at example
    three. That one might confuse you. These four should help you see how it works.


    ```

    console.log(1 === 1);

    // Example 1: Expected output: true

    ```


    ```

    console.log(''hello'' === ''hello'');

    // Example 2: Expected output: true

