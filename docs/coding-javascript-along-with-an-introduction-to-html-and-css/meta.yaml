    ```\n\nAs you see here, we have the two arguments as variables. The names are\
    \ the same as the function but don’t have to be.\n\n#### Returning data\n\nIt\
    \ is helpful when we return the calculation. If we don’t the function is not as\
    \ useful as it could be. We just need to use the return. We did this in our calculate\
    \ flooring function. Although we need to assign this or print it out.\n\n```javascript\n\
    function calculateFlooring(length, width) {\n  return length * width;\n}\n\nlet\
