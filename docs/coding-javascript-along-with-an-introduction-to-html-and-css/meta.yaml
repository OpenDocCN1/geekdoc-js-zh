    \ 示例 4：预期输出：false\n```\n\n前两个是有道理的。没有什么奇怪的地方。第三个你需要仔细看。第一个是字符串，第二个是数字。因此，JavaScript\
    \ 会声明为 false。\n\n### 严格不等\n\n查看了相等性的示例后，这些就说得通了。就像在幼儿园学习反义词一样，我们看到了一个模式。以下是另外四个代码示例。\n\
    \n```javascript\nconsole.log(1 !== 1);\n// 示例 1：预期输出：false\n```\n\n```javascript\n\
    console.log('hello' !== 'hello');\n// 示例 2：预期输出：false\n```\n\n```javascript\n\
    console.log('1' !== 1);\n// 示例 3：预期输出：true\n```\n\n```javascript\nconsole.log(0\
    \ !== false);\n// 示例 4：预期输出：true\n```\n\n事实胜于雄辩，作为开发者，我们喜欢看代码。这些例子向我们展示了正在发生的事情。当你开始使用严格运算符时，测试你的代码。注意边界情况。你可能会发现一些潜伏的\
    \ bug。\n\n### 严格 vs 宽松\n\n最后，让我们比较一下严格和宽松。只用三个变量，我们就可以探索一些关键区别。\n\n```javascript\n\
