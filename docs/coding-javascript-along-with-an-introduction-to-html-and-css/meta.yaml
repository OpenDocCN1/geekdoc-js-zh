- img_proc: true
  md: "The spread operator in JavaScript is (...) and is used to allow an array to\
    \ be expanded into separate elements.\n\n```\nlet numbers = [1,2,3,4,5];\n```\n\
    \n```\nlet maximum = Math.max(...numbers);\nlet minimum = Math.min(...numbers);\n\
    console.log(maximum); // 5\nconsole.log(minimum); // 1\n```\n\nHere we use it\
    \ along with the Math operators to get the maximum and minimum of the array. This\
    \ is only one handy use of the spread operator.\n\n```\nconst policeSongs = [\"\
    King of Pain\", \"Wrapped Around Your Finger\"];\nconst stingSongs = [\"Fields\
    \ of Gold\", ...policeSongs, \"Desert Rose\"];\nconsole.log(stingSongs); // [\"\
    Fields of Gold\",\"King of Pain\", \"Wrapped Around Your Finger\", \"Desert Rose\"\
    ]\n```\n\nIf you need to mix arrays the spread operator can also do that. This\
    \ can come in handy as you modify and add elements to arrays.\n\n# Rest Operator\n\
    \nThe rest operator allows a function to handle different configurations of parameters.\
    \ It can help set up an array or restructure an object.\n\n```\nfunction total(...num)\
    \ {\n  let tot = 0;\n  for (const n of numbers) {\n    tot += n;\n```"
