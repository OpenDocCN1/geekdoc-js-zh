  md: "Here is an example where we pass a parameter to the arrow function.\n\n```\n\
    const yearUntilRetirement = birthYear => {\n  const age = 2024 - birthYear;\n\
    \  const retirement = 65 - age;\n  return retirement;\n}\n\nconsole.log(yearUntilRetirement(1985));\
    \ // 26\n```\n\nThe argument is the value we pass into the function. In this case,\
    \ it is 1985. Some people use parameters and arguments interchangeably although\
