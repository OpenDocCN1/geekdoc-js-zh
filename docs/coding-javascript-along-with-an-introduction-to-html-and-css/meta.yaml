    The first two make sense. There’s nothing strange there. The third one you need
    to look closely. The first one is a string and the second one is a number. Therefore,
    JavaScript will declare that false.


    # Strict Inequality


    After looking at the examples for equality, these make sense. Like learning opposites
    in Kindergarten we see a pattern. Here are four more examples of code.


    ```

    console.log(1 !== 1);

    // Example 1: Expected output: false

    ```


    ```

    console.log(''hello'' !== ''hello'');

    //Example 2: Expected output: false

    ```'
