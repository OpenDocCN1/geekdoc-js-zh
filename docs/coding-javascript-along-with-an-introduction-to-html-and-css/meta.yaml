- md: '## JavaScript Arrays


    JavaScript Arrays store multiple objects in one collection. They also provide
    some common operations. The collection can contain numerous data types such as
    strings, numbers, objects, or other arrays.


    ### Create


    There are a few ways to create an array in JavaScript.


    ```

    const bread = ["white", "wheat", "sourdough"];

    ```


    This is an array of bread. We set the values as we declare them.


    ```

    const fruits = [];

    fruits.push("banana", "apple", "peach");

    ```


    This array is declared and then we push the fruits into the array.


    ```

    const cars = new Array("Chevy", "Jaguar", "Porsche", "Fiat");

    ```


    The new keyword can be used as in this example.


    ```

    let arrOfManyTypes = [''abc'', 1, 2, 3, true, ''xyz''];

    ```


    An array can also have multiple data types. My previous ones had similar data
    types but this one has strings, numbers, and a boolean.


    ### Modify


    We can modify arrays with built-in methods. The toString() can make it a string
    to print out.


    ```

    const bread = ["white", "wheat", "sourdough"];

    ```


    ```

    console.log(bread.toString()); // white,wheat,sourdough

    ```


    The join method will pull the elements together too similar to toString.


    ```

    const bread = ["white", "wheat", "sourdough"];

    ```


    ```

    console.log(bread.join(''-'')); // white-wheat-sourdough

    ```


    The push method we used before can modify arrays.


    ```

    const fruits = [];

    fruits.push("banana", "apple", "peach");

    ```


    The push method adds the elements at the end of the array. There are many more
    that you can see.


    ### Zero-based


    I don''t want you to miss out on that JavaScript Arrays are zero-based. Where
    some languages start at 1 JavaScript acts like Java in this regard.


    ```

    let tomsArray = [11, 22, 33, 44, 55];

    console.log(tomsArray[0]); // prints 11

    ```


    In this example, if we want to get the value of 33 we need to pass in the value
    2 to the array. This can cause bugs in your code so make sure you understand this.


    Otherwise, getting an element is easy once you get past that fact. Use your square
    brackets and the correct index. Then you will be able to access any of the elements
    in the array.


    So we have whetted your appetite for JavaScript Arrays. You know a little more
    than when you started. We talked about creating and modifying them. Plus we touched
    on how to access them and don''t forget they are zero-based. Happy Coding!


    ## Quick JavaScript Type Conversion and Coercion That Will Make Code Better


    ![](img/894414db2510c23b727da47fdb152ea2_93_0.png)


    Photo by [Austin Distel](https://unsplash.com/@austindistel) on [Unsplash](https://unsplash.com)


    As you work in code you see changes. Some of them require your manual intervention.
    While others the language will handle them for you. Starting with C, C++, then
    [Java](https://www.java.com) I saw these subtleties at work.


    As we work with JavaScript we see similar changes. The two types we want to discuss
    here are Type Conversion and Type Coercion. They have some similarities. Let''s
    review them and how they relate and differ.


    ### Type Conversion


    There can be times when we need to convert a number to a string and vice versa.
    Perhaps you need to process input from the user or another system. Type conversion
    in JavaScript is a manual process.


    ```

    const inputYear = "1992";

    console.log(Number(inputYear), inputYear); // 1992 "1992"

    console.log(String(73), 73); // 73 73

    ```


    ```

    console.log(Number("Tom")); // NaN

    ```


    These are a few examples that we start with a string. Using the Number function
    we can explicitly change it. Likewise, we can use the String function to convert
    the number to a string. Note what happens when we try to convert my first name
    to a number.


    ### Type Coercion


    Have you ever done something and wondered, "Who did that?" That has happened to
    me. It''s like I have an automatic drive that changes things I didn''t realize.


    JavaScript has Type Coercion that operates automatically. We have a few examples
    here to share. The first one takes the number 43 and makes it a string.


    ```

    console.log(''I am '' + 43 + '' years old''); // I am 43 years old

    console.log(2 + 3 + 4 + ''5''); // 95

    console.log(''10'' - ''4'' - ''3'' - 2 + ''5''); // 15

    ```


    Next, we add a few numbers and then a string. Of course, JavaScript says, "I think
    Tom meant that as a number." Then it changes it for me. Finally, we reverse it
    by using subtraction on strings coerced to numbers.


    Type coercion can introduce bugs if you don''t understand it. This [article](https://example.com)
    can help you sort some of that out. Try out some examples to see it in action.
    Type Conversion and Coercion are different but useful. Handle with care.


    ## Actually, JavaScript Has Surprising And Practical Strings


    ![](img/894414db2510c23b727da47fdb152ea2_96_0.png)


    As a coder who writes I use a lot of words. When we want to create words in our
    JavaScript code we can use strings. From mundane text on our screen to personalize
    messages strings can work for us.


    ### String


    When we want to create a [string](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String)
    we can do it just like this.


    ```

    let myFirstString = "My First String";

    ```


    There is a lot to learn about strings.


    ### Create


    As we did before we can create strings in a few different ways. Let''s review
    some of the different ways.


    ```

    let mySecondString = "My Second String";

    let stringSingleQuite = ''Example using single quotes'';

    let backTicksToo = `We can use back ticks too`;

    ```


    Similar to our first example we can use double quotes. Single quotes are legal
    as well as backticks too.


    ### Primitive vs Objects


    JavaScript allows the strings to be a primitive or an object.


    ```

    let primitiveString = "This is a primitive";

    let objectString = new String("This is an object.");

    ```


    The first example is primitive and similar to our previous examples. The second
    is an object. We use the new keyword and the String constructor. If you would
    like to know more check out this [post](post) from Flavio.


    ### functions


    There are a myriad of functions that we can use on strings in JavaScript. We can
    look over a few.


    ### length


    We can get the length of the string with the length function.


    ```

    let sampleText = "A long time ago in a galaxy far far away...";

    let length = sampleText.length;

    ```


    This can be used a lot with loops.


    ### indexOf


    The indexOf can give us the location of a word or letter.


    ```

    let sentence = "A quick brown fox jumped over the lazy dog.";

    let foxIndex = sentence.indexOf("fox");

    ```


    Using the indexOf and the slice function can help you break strings apart.


    ### slice


    If you need to pull out parts of a string the slice function can come in handy.


    ```

    let animals = "Fox, Horse, Cow";

    let farmAnimals = animals.slice(5);

    ```


    We take the last two words of this string and create a new string.


    ### Comparing


    Comparing strings in JavaScript has two types. Strict and loose comparisons that
    are subtly different.


    ```

    let str1 = "IowaBasketball";

    let str2 = "Basketball";


    console.log(str1 === str2); // false

    ```


    This is an example of strict comparison.


    ```

    let num1= 23;

    let num2 = ''23'';


    // Loose Equality

    console.log(num1 == num2); // true

    // Strict Equality

    console.log(num1 === num2); // false

    ```


    Here we compare the two types. Where the loose equality works the strict does
    not. There is also the [localCompare](...) you can consider.


    We have just scratched the surface here. I think we have given you a nice overview
    of JavaScript strings. From creating them to the functions we can use you know
    the lay of the land. For homework spend some time coding strings and filling in
    your understanding.


