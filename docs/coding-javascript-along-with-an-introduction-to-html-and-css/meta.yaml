- md: " Tom Henricksen\n\n## CODING JAVASCRIPT\n\nAlong with an introduction to HTML\
    \ and CSS\n\nTom Henricksen\n\n## Coding JavaScript\n\nAlong with an introduction\
    \ to HTML and CSS\n\nCopyright © 2024 by Tom Henricksen\n\nAll rights reserved.\
    \ No part of this publication may be reproduced, stored or transmitted in any\
    \ form or by any means, electronic, mechanical, photocopying, recording, scanning,\
    \ or otherwise without written permission from the publisher. It is illegal to\
    \ copy this book, post it to a website, or distribute it by any other means without\
    \ permission.\n\nFirst edition\n\nThis book was professionally typeset on Reedsy\n\
    Find out more at [reedsy.com](https://reedsy.com)\n\n## Contents\n\nPreface\n\n\
    ## I. HTML\n\n1. Targeted HTML Basics For Reliable People\n\n2. Important HTML5\
    \ Changes that Scream Out for Use\n\n3. Practical HTML Tables, Divs, And Spans\
    \ Make You Better\n\n## II. CSS\n\n4. The Truth About CSS Will Make You Something\n\
    \n5. Wondrous CSS Box Model Made Instructive\n\n6. How To Make CSS3 Scream Simplified\n\
    \n## III. JAVASCRIPT\n\n7. JavaScript A Useful Tool For Tired Minds\n\n8. [Look\
    \ I found these astounding benefits of JavaScript variables and values](#)\n\n\
    9. [First easy JavaScript function basics that are the most fascinating](#)\n\n\
    10. [Avoid painful mistakes with these Simplistic JavaScript Conditionals](#)\n\
    \n11. [JavaScript has Sizable loops that will explode your mind](#)\n\n12. [Surprisingly\
    \ Improved JavaScript Variable Scope You Need](#)\n\n13. [Exploit JavaScript Closures\
    \ More and Don't Panic](#)\n\n## IV. [ADVANCED JAVASCRIPT](#)\n\n14. [Unparalleled\
    \ JavaScript Objects Make You Thrilled](#)\n\n15. [Easily Pluck Better JavaScript\
    \ Arrays](#)\n\n16. [Quick JavaScript Type Conversion and Coercion That Will Make\
    \ Code Better](#)\n\n17. [Actually, JavaScript Has Surprising And Practical Strings](#)\n\
    \n18. [This Is What JavaScript Numbers Opportunities Make](#)\n\n19. [It Is Time\
    \ To Spotlight the JavaScript Arrow Function](#)\n\n20. [Valuable JavaScript Strict\
    \ Equality and Targeted Inequality for the Best Outcome](#)\n\n21. [The Truth\
    \ About JavaScript Object Notation is Found](#)\n\n22. [The Peril of JavaScript\
    \ spread and Awesome Rest operator](#)\n\n[About the Author](#)\n\n## Preface\n\
    \nAs a developer, I thought I knew enough of HTML and CSS. I was wrong. I had\
    \ to come back to the basics again and again. That is why I put this together.\
    \ Plus I feel like JavaScript should be here too.\n\nFirst, we start with some\
    \ basics of HTML. You may have seen some of this before, but I find a review helpful.\
    \ Then we cover some HTML5 changes. We touch on some of the major changes. Then\
    \ we wrap up HTML with a discussion of tables, divs, and spans. These have confused\
    \ me more than once...\n\nThe second section is devoted to CSS. This helps class\
    \ things up a bit. We cover CSS basics, the box model, and CSS3. Similar to HTML5\
    \ it has some interesting updates.\n\nThe third part focuses on JavaScript basics.\
    \ Covering topics like variables, functions, and conditionals. We also cover loops\
    \ and closures too. In this quick start guide, we just focus on what you need\
    \ to start working.\n\n## I\n\n## HTML\n\nIn part one, we start with the basics\
    \ of HTML. We review the basics of HTML, HTML5, and divs and spans.\n\n## Targeted\
    \ HTML Basics For Reliable People\n\nPhoto by [Jackson Sophat](https://unsplash.com/@jackson_sophat)\
    \ on [Unsplash](https://unsplash.com)\n\nThe web is created with some foundational\
    \ technologies. Every website uses HTML or Hypertext Markup Language. It makes\
    \ the content we consume online.\n\n## HTML\n\nIt gives structure to the pages\
    \ we see. We can add images and links to a website with a series of elements and\
    \ tags. Let's look at a simple example to get started.\n\n```\n<html>\n```\n\n\
    ```\n# Heading\n\nParagraph.\n```\n\nWe start with the DOCTYPE to declare this\
    \ is HTML. Then we have the open tag for HTML. As you look at the bottom you see\
    \ the closing tag for HTML too. The body has similar tags to open and close the\
    \ element.\n\n## Heading\n\nWe have a heading in our previous example. HTML [Headings](Headings)\
    \ can be from `<h1>` to `<h6>`. It starts large and gets smaller as the number\
    \ gets bigger.\n\n```\n# Heading\n```\n\n```\n# Heading\n```\n\n```\n# # Heading\n\
    \n# ## Heading\n\n# ### Heading\n\n# #### Heading\n\n# ##### Heading\n```\n\n\
    If we open this in Chrome this is what you will see.\n\n```\n# Heading\n\n# Heading\n\
    \n# Heading\n\n# Heading\n\n# Heading\n\n# Heading\n```\n\n## Heading Example\n\
    \n## Paragraph\n\nYou can use the HTML paragraphs tag when you have a text block.\
    \ We saw that in our first example. Here is another one.\n\nLorem ipsum dolor\
    \ sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore\
    \ et dolore magna aliqua.\n\nNow these two are nice elements but the reason the\
    \ web is powerful is links. Let's look at those next.\n\n## Link\n\nThe Hyperlink\
    \ or link in HTML is the secret sauce. We can link to the document source or a\
    \ reference.\n\n```\n<a href=\"https://codeiseasy.co\">Code Is Easy</a>\n```\n\
    \nOf course, sometimes we like to see a picture or image on the screen. To do\
    \ this we need the image tag.\n\n## Image\n\nThe image tag helps us add visual\
    \ components along with the text.\n\n```\n<img src=\"tom.jpg\" alt=\"Tom Headshot\"\
    \ width=\"100\" height=\"150\">\n```\n\nI added the width and height but these\
    \ are not required. Although, it can help to keep the sizing correct.\n\n## Lists\n\
    \nHTML gives us two options for lists. Ordered and unordered lists.\n\n## Ordered\
    \ List\n\n```\n<ol>\n  <li>Apples</li>\n  <li>Berries</li>\n  <li>Currants</li>\n\
    </ol>\n```\n\n## Unordered List\n\n```\n<ul>\n  <li>Carrots</li>\n  <li>Celery</li>\n\
    \  <li>Onions</li>\n</ul>\n```\n\nIt looks like this if you open the file in a\
    \ browser.\n\nWe covered some basics here for HTML. There is a lot more to learn.\
    \ Of course, depending on your work this may be all you need. My development work\
    \ has required me to use HTML periodically. Although, I am no expert. Play around\
    \ with these and you will learn it well.\n\n## Important HTML5 Changes that Scream\
    \ Out for Use\n\nPhoto by [Jackson Sophat](https://unsplash.com) on [Unsplash](https://unsplash.com)\n\
    \nHTML is like everything else. There are different versions we can use. [HTML5](https://html5)\
    \ is a current version that has new features. Let's go through some of the changes\
    \ and additions.\n\n## What is different?\n\nWork has been done to remove the\
    \ overlap between HTML, CSS, and JavaScript. Improvements have also been made\
    \ to increase the readability of the code. Cross-browser consistency and responsiveness\
    \ have been enhanced too. Finally, support of multimedia without plugins is another\
    \ major change.\n\n## New Elements\n\nIn HTML5 there are new elements. The section\
    \ tag was added to help organize the document.\n\n```\n<section>\n  <h1>Heading</h1>\n\
    \  <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod\
    \ tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam,\
    \ quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\
    \ Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore\
    \ eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt\
    \ in culpa qui officia deserunt mollit anim id est laborum.</p>\n</section>\n\
    ```\n\nSimilar to this tag we can also use header and footer tags. They are effectively\
    \ organizing large chunks of HTML to make them more readable.\n\n### Form\n\n\
    To enable easier form creation HTML5 has added a few things. Let's show the [datetime-local\
    \ input](datetime-local%20input) form element.\n\n```\n<input type=\"datetime-local\"\
    >\n```\n\nIf we run this in the browser we see this.\n\n## DateTime-Local example\n\
    \nThat is nice compared to what we used to have to do for something like this.\n\
    \n## Graphics\n\nWe can also add SVG or Scalable Vector Graphics in HTML5. Here\
    \ is a simple example.\n\n```\n<svg width=\"100\" height=\"100\">\n  <circle cx=\"\
    50\" cy=\"50\" r=\"40\" stroke=\"blue\" stroke-width=\"4\" fill=\"red\" />\n</svg>\n\
    ```"
  mdcn: "\nTom Henricksen\n\n## 编写 JAVASCRIPT\n\n以及 HTML 和 CSS 入门\n\nTom Henricksen\n\
    \n## 编写 JavaScript\n\n以及 HTML 和 CSS 入门\n\nCopyright © 2024 by Tom Henricksen\n\
    \nAll rights reserved. No part of this publication may be reproduced, stored or\
    \ transmitted in any form or by any means, electronic, mechanical, photocopying,\
    \ recording, scanning, or otherwise without written permission from the publisher.\
    \ It is illegal to copy this book, post it to a website, or distribute it by any\
    \ other means without permission.\n\nFirst edition\n\nThis book was professionally\
    \ typeset on Reedsy\nFind out more at [reedsy.com](https://reedsy.com)\n\n## 目录\n\
    \n前言\n\n## I. HTML\n\n1. 面向可靠人群的 HTML 基础要点\n\n2. 亟待使用的重要 HTML5 变更\n\n3. 实用的 HTML\
    \ 表格、Div 和 Span 让你更出色\n\n## II. CSS\n\n4. 关于 CSS 的真相将让你有所收获\n\n5. 奇妙的 CSS 盒模型讲解\n\
    \n6. 如何让 CSS3 变得简洁明了\n\n## III. JAVASCRIPT\n\n7. JavaScript：疲惫大脑的有用工具\n\n8. [我发现的这些\
    \ JavaScript 变量和值的惊人优势](#)\n\n9. [最迷人的简单 JavaScript 函数基础](#)\n\n10. [用这些简化的 JavaScript\
    \ 条件语句避免痛苦的错误](#)\n\n11. [JavaScript 中有让你大开眼界的强大循环](#)\n\n12. [你需要的令人惊喜的 JavaScript\
    \ 变量作用域改进](#)\n\n13. [更多地利用 JavaScript 闭包，不要惊慌](#)\n\n## IV. [高级 JAVASCRIPT](#)\n\
    \n14. [无与伦比的 JavaScript 对象让你兴奋](#)\n\n15. [轻松选取更优的 JavaScript 数组](#)\n\n16. [快速的\
    \ JavaScript 类型转换和强制转换让代码更优](#)\n\n17. [实际上，JavaScript 拥有令人惊喜且实用的字符串](#)\n\n18.\
    \ [这就是 JavaScript 数字带来的机遇](#)\n\n19. [是时候聚焦 JavaScript 箭头函数了](#)\n\n20. [有价值的\
    \ JavaScript 严格相等和目标不相等以获最佳结果](#)\n\n21. [JavaScript 对象表示法的真相已被发现](#)\n\n22. [JavaScript\
    \ 展开运算符的危险与 Rest 运算符的 awesome](#)\n\n[关于作者](#)\n\n## 前言\n\n作为开发者，我曾以为自己对 HTML\
    \ 和 CSS 已经足够了解。我错了。我不得不一次又一次地回到基础。这就是我将这些内容整理在一起的原因。另外，我觉得 JavaScript 也应该包含在内。\n\
    \n首先，我们从 HTML 的一些基础知识开始。你可能已经见过其中一些内容，但我发现复习一下很有帮助。然后我们将介绍 HTML5 的一些变化。我们会涉及一些主要变化。接着我们用表格、div\
    \ 和 span 的讨论来结束 HTML 部分。这些曾让我不止一次感到困惑……\n\n第二部分专门介绍 CSS。这让页面美观了不少。我们涵盖 CSS 基础、盒模型和\
    \ CSS3。与 HTML5 类似，它也有一些有趣的更新。\n\n第三部分聚焦于 JavaScript 基础。涵盖变量、函数和条件语句等主题。我们也介绍循环和闭包。在这本快速入门指南中，我们只关注你开始工作所需的内容。\n\
    \n## I\n\n## HTML\n\n在第一部分中，我们从 HTML 的基础知识开始。我们复习 HTML 基础、HTML5 以及 div 和 span。\n\
    \n## 面向可靠人群的 HTML 基础要点\n\n图片由 [Jackson Sophat](https://unsplash.com/@jackson_sophat)\
    \ 发布于 [Unsplash](https://unsplash.com)\n\n网络是由一些基础性技术创建的。每个网站都使用 HTML 或超文本标记语言。它构成了我们在网上消费的内容。\n\
    \n## HTML\n\n它为我们看到的页面提供结构。我们可以通过一系列元素和标签为网站添加图像和链接。让我们看一个简单的例子来开始。\n\n```\n<html>\n\
    ```\n\n```\n# 标题\n\n段落。\n```\n\n我们从 DOCTYPE 开始，声明这是 HTML。然后我们有 HTML 的开放标签。看到底部时，你也会看到\
    \ HTML 的闭合标签。body 也有类似的标签来打开和关闭元素。\n\n## 标题\n\n我们在前面的例子中有一个标题。HTML [标题](Headings)\
    \ 可以从 `<h1>` 到 `<h6>`。它从大到小，数字越大字体越小。\n\n```\n# 标题\n```\n\n```\n# 标题\n```\n\n\
    ```\n# # 标题\n\n# ## 标题\n\n# ### 标题\n\n# #### 标题\n\n# ##### 标题\n```\n\n如果我们在 Chrome\
    \ 中打开它，这就是你会看到的。\n\n```\n# 标题\n\n# 标题\n\n# 标题\n\n# 标题\n\n# 标题\n\n# 标题\n```\n\n\
    ## 标题示例\n\n## 段落\n\n当你有一个文本块时，可以使用 HTML 段落标签。我们在第一个例子中看到过。这是另一个例子。\n\nLorem ipsum\
    \ dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt\
    \ ut labore et dolore magna aliqua.\n\n现在这两个是很好的元素，但网络之所以强大，原因在于链接。让我们接下来看看这些。\n\
    \n## 链接\n\nHTML 中的超链接或链接是秘密武器。我们可以链接到文档源或参考资料。\n\n```\n<a href=\"https://codeiseasy.co\"\
    >Code Is Easy</a>\n```\n\n当然，有时我们喜欢看到屏幕上的图片或图像。要做到这一点，我们需要图像标签。\n\n## 图像\n\n图像标签帮助我们在文本之外添加视觉组件。\n\
    \n```\n<img src=\"tom.jpg\" alt=\"Tom Headshot\" width=\"100\" height=\"150\"\
    >\n```\n\n我添加了宽度和高度，但这些不是必需的。不过，这有助于保持尺寸正确。\n\n## 列表\n\nHTML 为我们提供了两种列表选项。有序列表和无序列表。\n\
    \n## 有序列表\n\n```\n<ol>\n  <li>Apples</li>\n  <li>Berries</li>\n  <li>Currants</li>\n\
    </ol>\n```\n\n## 无序列表\n\n```\n<ul>\n  <li>Carrots</li>\n  <li>Celery</li>\n  <li>Onions</li>\n\
    </ul>\n```\n\n如果你在浏览器中打开文件，它看起来是这样的。\n\n我们在这里介绍了一些 HTML 基础。还有很多需要学习的内容。当然，根据你的工作需求，这些可能已经足够了。我的开发工作需要我定期使用\
    \ HTML。虽然，我并非专家。多尝试这些，你会掌握得很好。\n\n## 亟待使用的重要 HTML5 变更\n\n图片由 [Jackson Sophat](https://unsplash.com)\
    \ 发布于 [Unsplash](https://unsplash.com)\n\nHTML 和其他东西一样。有不同的版本可供我们使用。[HTML5](https://html5)\
    \ 是当前版本，具有新特性。让我们来看看一些变化和新增内容。\n\n## 有什么不同？\n\n已经进行了一些工作来消除 HTML、CSS 和 JavaScript\
    \ 之间的重叠。还进行了改进以提高代码的可读性。跨浏览器一致性和响应性也得到了增强。最后，无需插件即可支持多媒体是另一项重大变化。\n\n## 新元素\n\n\
    在 HTML5 中，有一些新元素。添加了 section 标签来帮助组织文档。\n\n```\n<section>\n  <h1>Heading</h1>\n\
    \  <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod\
    \ tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam,\
    \ quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\
    \ Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore\
    \ eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt\
    \ in culpa qui officia deserunt mollit anim id est laborum.</p>\n</section>\n\
    ```\n\n与这个标签类似，我们也可以使用 header 和 footer 标签。它们有效地组织大块 HTML，使其更具可读性。\n\n### 表单\n\n\
    为了更方便地创建表单，HTML5 添加了一些功能。让我们展示 [datetime-local 输入](datetime-local%20input) 表单元素。\n\
    \n```\n<input type=\"datetime-local\">\n```\n\n如果我们在浏览器中运行它，我们会看到这个。\n\n## 本地日期时间示例\n\
    \n这比我们以前必须做的要方便得多。\n\n## 图形\n\n我们还可以在 HTML5 中添加 SVG 或可缩放矢量图形。这是一个简单的例子。\n\n```\n\
    <svg width=\"100\" height=\"100\">\n  <circle cx=\"50\" cy=\"50\" r=\"40\" stroke=\"\
    blue\" stroke-width=\"4\" fill=\"red\" />\n</svg>\n```\n"
