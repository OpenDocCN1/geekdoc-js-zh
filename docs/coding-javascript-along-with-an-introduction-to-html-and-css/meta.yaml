  md: "JSON (JavaScript Object Notation) is a lightweight data-interchange format.\
    \ It is easy for humans to read and write. It is easy for machines to parse and\
    \ generate.\n\nWhere XML is more heavyweight and not quite human-readable JSON\
    \ tries to reverse this. Of course, we can let you decide that. Here is an example.\n\
    \n```\n'{\"developer\":\"Tom\", \"linesOfCode\": 12000, \"repo\":\"accounting\"\
    , \"ide\": null}'\n```\n\nThis object has a few properties. Developer, lines of\
    \ code, repo, and ide. The basic structure is of keys and values. We could do\
    \ the following if we want to access these properties in JavaScript.\n\n```\n\
    let developer = obj.developer;\nlet linesOfCode = obj.linesOfCode;\nlet repository\
    \ = obj.repo;\n```\n\nHere we can access the properties in the object easily with\
    \ JavaScript. We have covered the basics let's compare JSON to XML.\n\n# JSON\
    \ vs XML\n\nThese two types of data can be used in a lot of spaces. If we look\
    \ at some similar examples we can compare them head to head. We can create an\
    \ array of customers in both.\n\n```\n{\"customers\":[\n { \"business\":\"ABC\
    \ Inc.\", \"city\":\"Ducktown\" },\n```"
