- img_proc: true
  md: "Arrow Functions are not original to JavaScript. This change was brought in\
    \ part of This was a major change in the language.\n\nJust as an example of what\
    \ was done before arrow functions, this first example is a function expression,\
    \ unlike the function declaration that is second here.\n\n```\n// function expression\n\
    message = function() {\n    return \"A message from Tom\";\n}\n```\n\n```\n//\
    \ function declaration\nfunction functionDeclaration() {\n    // statements\n\
    };\n```\n\nIn ES6 and beyond we can do the following.\n\n```\nmessage = () =>\
    \ {\n    return \"A message from Tom\";\n}\n```\n\nIf only one statement returns\
    \ a value, you can do this.\n\n```\nmessage = () => \"A message from Tom\";\n\
    ```\n\nWe can remove the brackets and return the statement. That is a short function!\n\
    \n# Pass Parameter"
