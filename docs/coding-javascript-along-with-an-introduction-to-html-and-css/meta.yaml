- md: " ## Exploit JavaScript Closures More and Don't Panic\n\n![](img/894414db2510c23b727da47fdb152ea2_79_0.png)\n\
    \nPhoto by [Cristina Gottardi](https://unsplash.com/@cristinagottardi) on [Unsplash](https://unsplash.com)\n\
    \nHaving dipped into JavaScript occasionally over my development career Closures\
    \ have been something I didn't encounter much. They have some great value.\n\n\
    ## Closures\n\nHow can we define closures? Well, this article defines it like\
    \ this. \"Closure in JavaScript is a form of lexical scoping used to preserve\
    \ variables from the outer scope of a function in the inner scope of a function.\"\
    \n\n```\nfunction outerFunction() {\n    var x = 10;\n\n    function innerFunction()\
    \ {\n        return x;\n    }\n    return innerFunction;\n}\n```\n\n```\nvar inner\
    \ = outerFunction();\nconsole.log(inner());\n```\n\nHere is an example of a closure.\
    \ The outer function outerFunction() creates a variable x and a function innerFunction().\
    \ The inner function innerFunction() returns the value of the variable x. The\
    \ outer function then returns the inner function innerFunction().\n\nNext inner\
    \ function innerFunction() is then assigned to the variable inner. When the variable\
    \ inner is called, it returns the value of the variable x, even though the outer\
    \ function outerFunction() has already returned.\n\nIn a moment we can cover lexical\
    \ scoping. First, let's understand why we need them. Plus some disadvantages too.\n\
    \n## Pros and Cons\n\nClosures can help hide the encapsulation details. Like Java's\
    \ private variables and exotic, this allows us to control access. The downside\
    \ of this is closures take up more memory. These items can not be garbage collected.\
    \ Lastly, it can slow down execution. Deepak Mankotia explores this more in-depth.\n\
    \n## Lexical Scoping\n\nThe term lexical scoping refers to where the variable\
    \ is defined. Along with that where it can be referenced or not.\n\n```\nlet x\
    \ = 10\nlet myFunc = function (){\nlet y = 20;\n    console.log(\"x and y is accessible\
    \ (outer):\", x, y);\n    let insideFunc= function (){\n        let z = 30;\n\
    \        console.log(\"x and y and z is accessible (inner):\", x, y, z);\n   \
    \ }\n    insideFunc();\n    return;\n}\nmyFunc();\nconsole.log(\"only x is accessible\
    \ (global):\", x);\n```\n\nIn this example, insideFunc is defined within the myFunc.\
    \ In this case, myFunc is its parent. That of the parent function lexically binds\
    \ the child function. JavaScript Closures are a form of Lexical Scoping.\n\nJavaScript\
    \ Closures are powerful tools. They have some distinct values. It allows you to\
    \ encapsulate details but, it can slow down your execution time. Consider whether\
    \ the risks and rewards work for your application.\n\nFor more information here\
    \ is a deep dive on\n\n# IV\n\n# Advanced JavaScript\n\nIn this section, we get\
    \ into the deep end of the pool. JavaScript objects and arrays can trip people\
    \ up. So we spend time going over each. We finish talking about the spread and\
    \ rest operator.\n\n## Unparalleled JavaScript Objects Make You Thrilled\n\n![](img/894414db2510c23b727da47fdb152ea2_83_0.png)\n\
    \nPhoto by [Hari Krishnan](https://unsplash.com/@harikrishnan) on [Unsplash](https://unsplash.com)\n\
    \nI used mostly procedural languages in my first few years of software development.\
    \ Mostly [PL/SQL](https://en.wikipedia.org/wiki/PL/SQL) was the language I used.\
    \ Even the object-oriented work I did wasn't harnessing the full strength of the\
    \ language.\n\nJavaScript wasn't originally object-oriented. It has been modified\
    \ to become more powerful. The changes particularly in [ECMAScript 6](https://en.wikipedia.org/wiki/ECMAScript#ES2015)\
    \ were quite large.\n\nToday we use objects in JavaScript all the time. As an\
    \ old Java developer, I see the value that they bring. Although, this can be a\
    \ big change for developers to understand.\n\nWhat are they?\n\nThe JavaScript\
    \ objects represent real things, such as my car from high school. Let's create\
    \ it here with some of the properties.\n\n```\n// Create an object:\nconst car\
    \ = {\n  type:\"Chevrolet\",\n  model:\"Malibu\",\n    year:\"1976\",\n    color:\"\
    red\"\n  };\n```\n\nJavaScript objects are one of the many [data types](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Data_structures)\
    \ allowed in the language. There are a few others as you can see. Although, in\
    \ your development work you will primarily use primitives and objects.\n\n## Objects\
    \ vs Primitive\n\nIn this they go in-depth on this. I just want to point out a\
    \ few key differences. Objects are mutable and primitive types are not. Mutable\
    \ means they can be changed.\n\n```\n// Create an object:\nconst car = {\n  type:\"\
    Chevrolet\",\n  model:\"Malibu\",\n  year:\"1976\",\n  color:\"red\"\n};\n```\n\
    \n```\nlet ball = \"basketball\"; // primitive\n```\n\nAdding to our previous\
    \ example, we have the car object and the ball primitive. The former can be changed\
    \ while the latter cannot be. As an old Java programmer, this is quite familiar.\n\
    \n## Constructor\n\nObjects can be created using a constructor. Continuing with\
    \ the car theme let's create two car objects so you can see what it looks like.\n\
    \n```\n// Constructor function for Car objects\nfunction Car(make, model, year)\
    \ {\n  this.make = make;\n  this.model = model;\n  this.year = year;\n}\n```\n\
    \n```\n// Create two Car objects\nconst myCar = new Car(\"Ford\", \"Pinto\", \"\
    1971\");\nconst yourCar = new Car(\"Dodge\", \"Charger\", \"1977\");\n```\n\n\
    This works similarly to our previous example. We are using the function keyword\
    \ here to designate the constructor. Also, we use the new keyword as well for\
    \ the object creation.\n\n## Properties\n\nWe created two car objects with lots\
    \ of values on them. These are called properties. If we want to print them out\
    \ to the log we can do this.\n\n```\nconsole.log(myCar.make);\nconsole.log(myCar.model);\n\
    ```\n\nThis is one way to access the value. Or you can do it this way as well.\n\
    \n```\nconsole.log(myCar[\"make\"]);\nconsole.log(myCar[\"model\"]);\n```\n\n\
    So you have options to get at the underlying data. In my experience, the former\
    \ is used more than the latter. Your mileage may vary.\n\n## Methods\n\nJavaScript\
    \ objects have some built-in methods. For instance, one is the keys() method.\
    \ This converts the keys to an array.\n\n```\n// Initialize an object\nconst car\
    \ = {\nmake: 'Ford',\n\nmodel: 'Pinto',\nyeeear: '1971'\n};\n```\n\n```\n// Get\
    \ the keys of the object\nconst keys = Object.keys(car);\n```\n\n```\nconsole.log(keys);\n\
    // outputs the following\n[\"make\", \"model\", \"yeeear\"]\n```\n\nThere also\
    \ is a values() method too.\n\n```\n// Initialize an object\nconst game = {\n\
    \    id: 1,\n    date: `23-March-2025`,\n    teams: 'Panthers vs Jayhawks',\n\
    \    location: 'St. Louis'\n};\n```\n\n```\n// Get all values of the object\n\
    const values = Object.values(game);\n```\n\n```\nconsole.log(values);\n// outputs\
    \ the following\n[1, \"23-March-2025\", \"Panthers vs Jayhawks\", \"St. Louis\"\
    ]\n```\n\nThis can be helpful along with a loop to iterate through them. There\
    \ are other methods too. This post reviews more built-in methods.\n\n## This\n\
    \nJavaScript has reserved this as a keyword. It is used to reference the current\
    \ object. Here is what that can look like.\n\n```\n// Create an object:\nconst\
    \ car = {\n  make: \"Dodge\",\n  model: \"Charger\",\n  year: \"2015\",\n  carDetails:\
    \ function() {\n    return this.make + \" \" + this.model + \" \" + this.year;\n\
    \  }\n};\n```\n\nIn this example, we create an object with three properties. When\
    \ we want to display the details we can call the carDetails function. It would\
    \ display \"Dodge Charger 2015\" in this case.\n\nAs a keyword, this cannot be\
    \ used as a variable name. Also, we can't change the value that this refers to.\
    \ This in JavaScript has three contexts: function, class, and global. We have\
    \ shared the function context in these examples. There is more information\n\n\
    JavaScript objects are similar to other language objects. However, there are a\
    \ few differences too. It is important to remember that JavaScript didn't start\
    \ this way. It continues to change and adapt. If you know the basics you can use\
    \ it well.\n\n15\n\n## Easily Pluck Better JavaScript Arrays\n\n![](img/894414db2510c23b727da47fdb152ea2_89_0.png)\n\
    \nPhoto by [Julius Drost](https://unsplash.com/@juliusdrost) on [Unsplash](https://unsplash.com)\n\
    \nMy wife enjoys organizing things. She put them in envelopes by year. JavaScript\
    \ Arrays are similar to envelopes. We can put multiple objects in them.\n\nJavaScript\
    \ Arrays"
  mdcn: "\n ## 充分利用 JavaScript 闭包，无需恐慌\n\n![](img/894414db2510c23b727da47fdb152ea2_79_0.png)\n\
    \n图片由 [Unsplash](https://unsplash.com) 上的 [Cristina Gottardi](https://unsplash.com/@cristinagottardi)\
    \ 提供\n\n在我的开发生涯中，偶尔会接触 JavaScript，而闭包是我并不经常遇到的一项技术。但它们具有极高的价值。\n\n## 闭包 (Closures)\n\
    \n我们如何定义闭包？这篇文章将其定义为：“JavaScript 中的闭包是一种词法作用域形式，用于在函数的内部作用域中保留来自函数外部作用域的变量。”\n\
    \n```\nfunction outerFunction() {\n    var x = 10;\n\n    function innerFunction()\
    \ {\n        return x;\n    }\n    return innerFunction;\n}\n```\n\n```\nvar inner\
    \ = outerFunction();\nconsole.log(inner());\n```\n\n这是一个闭包的示例。外部函数 `outerFunction()`\
    \ 创建了一个变量 `x` 和一个函数 `innerFunction()`。内部函数 `innerFunction()` 返回变量 `x` 的值。随后，外部函数返回内部函数\
    \ `innerFunction()`。\n\n接下来，内部函数 `innerFunction()` 被赋值给变量 `inner`。当调用变量 `inner`\
    \ 时，它会返回变量 `x` 的值，尽管外部函数 `outerFunction()` 已经执行完毕并返回。\n\n稍后我们可以讨论词法作用域。首先，让我们了解为什么需要它们，以及它们的一些缺点。\n\
    \n## 优缺点\n\n闭包可以帮助隐藏封装细节。类似于 Java 的私有变量，这允许我们控制访问权限。其缺点是闭包会占用更多内存。这些项无法被垃圾回收。最后，它可能会降低执行速度。Deepak\
    \ Mankotia 对此进行了更深入的探讨。\n\n## 词法作用域 (Lexical Scoping)\n\n词法作用域是指变量定义的位置，以及它在何处可以被引用或不能被引用。\n\
    \n```\nlet x = 10\nlet myFunc = function (){\nlet y = 20;\n    console.log(\"\
    x and y is accessible (outer):\", x, y);\n    let insideFunc= function (){\n \
    \       let z = 30;\n        console.log(\"x and y and z is accessible (inner):\"\
    , x, y, z);\n    }\n    insideFunc();\n    return;\n}\nmyFunc();\nconsole.log(\"\
    only x is accessible (global):\", x);\n```\n\n在这个例子中，`insideFunc` 定义在 `myFunc`\
    \ 内部。在这种情况下，`myFunc` 是它的父级。父函数在词法上绑定了子函数。JavaScript 闭包就是词法作用域的一种形式。\n\nJavaScript\
    \ 闭包是强大的工具，具有独特的价值。它允许你封装细节，但可能会减慢执行时间。请考虑这些风险与收益是否适用于你的应用程序。\n\n欲了解更多信息，请参阅深度解析：\n\
    \n# IV\n\n# 高级 JavaScript\n\n在本节中，我们将进入深水区。JavaScript 的对象和数组可能会让人困惑，因此我们将花时间详细讲解每一个。最后，我们会讨论展开运算符（spread）和剩余运算符（rest）。\n\
    \n## 无与伦比的 JavaScript 对象令你心潮澎湃\n\n![](img/894414db2510c23b727da47fdb152ea2_83_0.png)\n\
    \n图片由 [Unsplash](https://unsplash.com) 上的 [Hari Krishnan](https://unsplash.com/@harikrishnan)\
    \ 提供\n\n在软件开发的最初几年里，我主要使用过程化语言。我使用最多的语言是 [PL/SQL](https://en.wikipedia.org/wiki/PL/SQL)。即使是我所做的面向对象工作，也没有充分发挥该语言的全部实力。\n\
    \nJavaScript 最初并不是面向对象的。它经过修改变得更加强大。特别是 [ECMAScript 6](https://en.wikipedia.org/wiki/ECMAScript#ES2015)\
    \ 带来的变化非常巨大。\n\n如今，我们在 JavaScript 中随时随地使用对象。作为一名资深的 Java 开发人员，我看到了它们带来的价值。尽管对于一些开发人员来说，这可能是一个巨大的理解转变。\n\
    \n它们是什么？\n\nJavaScript 对象代表现实世界中的事物，例如我高中时代的那辆车。让我们在这里创建它并添加一些属性。\n\n```\n// Create\
    \ an object:\nconst car = {\n  type:\"Chevrolet\",\n  model:\"Malibu\",\n    year:\"\
    1976\",\n    color:\"red\"\n  };\n```\n\nJavaScript 对象是该语言允许的许多[数据类型](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Data_structures)之一。如你所见，还有其他几种。不过，在开发工作中，你主要会使用原始类型和对象。\n\
    \n## 对象 vs 原始类型\n\n在这篇文章中，他们对此进行了深入探讨。我只想指出几个关键区别。对象是*可变的*（mutable），而原始类型则*不可变*。可变意味着它们可以被修改。\n\
    \n```\n// Create an object:\nconst car = {\n  type:\"Chevrolet\",\n  model:\"\
    Malibu\",\n  year:\"1976\",\n  color:\"red\"\n};\n```\n\n```\nlet ball = \"basketball\"\
    ; // primitive\n```\n\n结合之前的示例，我们有一个 `car` 对象和一个 `ball` 原始类型。前者可以被更改，而后者不能。作为一名资深\
    \ Java 程序员，这对我来说非常熟悉。\n\n## 构造函数 (Constructor)\n\n可以使用构造函数创建对象。延续汽车的主题，我们创建两个汽车对象，以便你直观了解其形式。\n\
    \n```\n// Constructor function for Car objects\nfunction Car(make, model, year)\
    \ {\n  this.make = make;\n  this.model = model;\n  this.year = year;\n}\n```\n\
    \n```\n// Create two Car objects\nconst myCar = new Car(\"Ford\", \"Pinto\", \"\
    1971\");\nconst yourCar = new Car(\"Dodge\", \"Charger\", \"1977\");\n```\n\n\
    这与之前的示例类似。我们在这里使用 `function` 关键字来指定构造函数。同时，我们也使用 `new` 关键字来创建对象。\n\n## 属性 (Properties)\n\
    \n我们创建了两个带有许多值的汽车对象。这些值被称为属性。如果我们想将它们打印到日志中，可以这样做：\n\n```\nconsole.log(myCar.make);\n\
    console.log(myCar.model);\n```\n\n这是访问值的一种方式。你也可以用这种方式：\n\n```\nconsole.log(myCar[\"\
    make\"]);\nconsole.log(myCar[\"model\"]);\n```\n\n因此，你有多种选择来获取底层数据。根据我的经验，前者的使用频率高于后者。但具体情况可能因人而异。\n\
    \n## 方法 (Methods)\n\nJavaScript 对象具有一些内置方法。例如，`keys()` 方法可以将键转换为数组。\n\n```\n//\
    \ Initialize an object\nconst car = {\nmake: 'Ford',\n\nmodel: 'Pinto',\nyeeear:\
    \ '1971'\n};\n```\n\n```\n// Get the keys of the object\nconst keys = Object.keys(car);\n\
    ```\n\n```\nconsole.log(keys);\n// outputs the following\n[\"make\", \"model\"\
    , \"yeeear\"]\n```\n\n同样还有一个 `values()` 方法。\n\n```\n// Initialize an object\n\
    const game = {\n    id: 1,\n    date: `23-March-2025`,\n    teams: 'Panthers vs\
    \ Jayhawks',\n    location: 'St. Louis'\n};\n```\n\n```\n// Get all values of\
    \ the object\nconst values = Object.values(game);\n```\n\n```\nconsole.log(values);\n\
    // outputs the following\n[1, \"23-March-2025\", \"Panthers vs Jayhawks\", \"\
    St. Louis\"]\n```\n\n配合循环来遍历这些值会非常有帮助。此外还有其他方法，这篇文章回顾了更多内置方法。\n\n## This\n\nJavaScript\
    \ 将 `this` 预留为关键字。它用于引用当前对象。以下是它的具体形式：\n\n```\n// Create an object:\nconst car\
    \ = {\n  make: \"Dodge\",\n  model: \"Charger\",\n  year: \"2015\",\n  carDetails:\
    \ function() {\n    return this.make + \" \" + this.model + \" \" + this.year;\n\
    \  }\n};\n```\n\n在这个例子中，我们创建了一个具有三个属性的对象。当我们想要显示详情时，可以调用 `carDetails` 函数。在这种情况下，它将显示\
    \ \"Dodge Charger 2015\"。\n\n作为关键字，`this` 不能用作变量名。此外，我们无法更改 `this` 所指向的值。JavaScript\
    \ 中的 `this` 有三种上下文：函数、类和全局。在这些示例中，我们分享的是函数上下文。这里有更多信息。\n\nJavaScript 对象与其他语言的对象类似。不过，也存在一些差异。重要的是要记住，JavaScript\
    \ 最初并非如此，它在不断地改变和适应。只要掌握基础知识，你就能很好地使用它。\n\n15\n\n## 轻松驾驭更好的 JavaScript 数组\n\n\
    ![](img/894414db2510c23b727da47fdb152ea2_89_0.png)\n\n图片由 [Unsplash](https://unsplash.com)\
    \ 上的 [Julius Drost](https://unsplash.com/@juliusdrost) 提供\n\n我的妻子喜欢整理东西，她按年份将东西放入信封中。JavaScript\
    \ 数组与信封类似，我们可以将多个对象放入其中。\n\nJavaScript 数组\n"
