    Photo by [Artur Aldyrkhanov](https://unsplash.com/) on [Unsplash](https://unsplash.com/)\n\
    \nApplications help us make decisions. A basic decision is an if condition. For\
    \ example, if the pizza delivery driver arrives open the door. JavaScript like\
    \ other languages has many conditionals like\n\n### if\n\nAn if statement starts\
    \ with a condition. If it is true the statement following will happen.\n\n```javascript\n\
    if(pizzaArrives) {\n    openTheDoor();\n}\n```\n\nSo if pizzaArrives is true we\
    \ call the function openTheDoor. I added the braces after the if statement. This\
    \ is optional but helps readability. Omitting the braces can cause you to miss\
