    \ 箭头函数是 2015 年发生的一次重大变化的一部分。\n\n### JavaScript 箭头函数\n\n它们是[函数](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions)的一种简洁替代形式。它们没有\
