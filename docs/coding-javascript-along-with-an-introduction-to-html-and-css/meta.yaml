    \n### 什么是 JSON？\n\n根据，他们是这样定义的。\n\nJSON（JavaScript 对象表示法）是一种轻量级的数据交换格式。它易于人类阅读和编写。它易于机器解析和生成。\n\
    \nXML 更加重量级，且不太便于人类阅读，JSON 试图扭转这一点。当然，你可以自己判断。这里有一个示例。\n\n```json\n'{\"developer\"\
