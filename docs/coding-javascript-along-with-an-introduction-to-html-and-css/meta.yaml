    \ out and get the right one.\n\n```javascript\nif(9>5) { alert(\"Greater than\"\
    ); } // greater than\nif(5<8) { alert(\"Less than\"); } // less than\nif(9>=6)\
    \ { alert(\"Greater than equal to\"); } // greater than equal to\nif(4<=6) { alert(\"\
    Less than equal to\"); } // less than equal to\nif(4!=6) { alert(\"Not equal to\"\
    ); } // not equal to\n```\n\nThere are also two logical operators. The Logical\
    \ And(&&) and the Logical Or(||). They are used a lot but don’t be intimidated.\n\
    \n```javascript\nconst value1 = 4;\nconst value2 = -3;\n\nconsole.log(value1 >\
    \ 0 && value2 > 0); // Expected output: false\n\nconsole.log(value1 > 0 || value2\
    \ > 0); // Expected output: true\n```\n\nThe Logical And must have both values\
    \ true to resolve as true. The Logical Or needs one to be true.\n\n## switch\n\
    \nSwitch statements evaluate the expression to determine which statement to execute.\
    \ Then it runs the code until reaching a break statement. Here is an example that\
    \ tells us the price of the shoes you want.\n\n```javascript\nconst shoes = 'Reebok';\n\
    switch (shoes) {\n  case 'Nike':\n    console.log('Nike shoes are $200.');\n \
    \   break;\n  case 'Adidas':\n  case 'Reebok':\n    console.log('Adidas and Reebok\
    \ are $100 a pair.');\n    // Expected output: \"Adidas and Reebok are $100 a\
    \ pair.\"\n    break;\n  default:\n    console.log(`Sorry, we don't carry ${shoes}.`);\n\
    }\n```\n\nThis code should print “Adidas and Reebok are $100 a pair.” to the console.\
    \ Switch statements can be tricky if you don't add the break statement.\n\n```javascript\n\
    const shoes = 'Nike';\nswitch (shoes) {\n  case 'Nike':\n    console.log('Nike\
    \ shoes are $200.');\n  case 'Adidas':\n  case 'Reebok':\n    console.log('Adidas\
    \ and Reebok are $100 a pair.');\n    break;\n  default:\n    console.log(`Sorry,\
    \ we don't carry ${shoes}.`);\n}\n```\n\nIn this example, we removed the break\
    \ from the Nike statement. Do you know what happens here? It will print ‘Nike\
    \ shoes are $200.’ and then ‘Adidas and Reebok are $100 a pair.’ This type of\
    \ bug is common for beginner programmers. Don’t feel bad. You are now part of\
    \ the club!\n\nConditionals are fundamental to JavaScript. Similar to other languages\
    \ it allows us to provide solutions quickly. The if/else and switch are easy to\
    \ use.\n\n## JavaScript has Sizable loops that will explode your mind\n\n![Photo\
    \ of trees in a field](img/894414db2510c23b727da47fdb152ea2_71_0.png)\nPhoto by\
    \ [Kier in Sight Archives](https://unsplash.com/photos/kier-in-sight-archives)\
    \ on [Unsplash](https://unsplash.com)\n\nAs a kid, we planted a windbreak on our\
    \ farm. A line of trees that needed watering a few times a week. Turn on the hose\
    \ water the first tree and count to ten. Move to the second tree and repeat.\n\
    \nSimilar to life our computer programs must repeat things. That’s where loops\
    \ come in handy. For loops are quite common so let’s start there.\n\n### for\n\
    \nIf we have an array of books and we would like to print them out. We could use\
    \ the following loop.\n\n```javascript\nfor (let i = 0; i < books.length; i++)\
    \ {\n    text += books[i] + \" \";\n}\n```\n\nThe for loop has three basic parts.\
    \ Start, Condition, and Step.\n\n### start\n\nThis is the part where we set up\
    \ the loop variable. In our example that is Usually, we initialize to zero. Although,\
    \ you can set it to say 10 and then count down too.\n\n### condition\n\nNext is\
    \ the condition where check to see if we need to run this loop again. Our example\
    \ checks if we still have more books to loop through. If we are done we stop.\n\
    \n### step\n\nThe last part is the step. This tells us what happens after each\
    \ iteration. Our example uses the increment operator(++). This is the normal step\
    \ but we can do other things for special cases.\n\n### while\n\nIf my dog Baxter\
    \ wants to eat I want to create a loop that feeds him while he is hungry. The\
    \ while loop can do this. Here is an example.\n\n```javascript\nlet baxterHungry\
    \ = true;\n\nwhile (baxterHungry) {\n  console.log(feedBaxter);\n\n  checkBaxter();\n\
    }\n```\n\nWe set the variable to true. Then we feed the dog until it becomes false.\
    \ The while loop evaluates the condition we give it. It needs to resolve to be\
    \ true or false.\n\nIf it is true the code inside the loop executes. We evaluate\
    \ the condition again. Once the condition becomes false the loop stops.\n\n###\
    \ do-while\n\nThe for and while loops check the condition then run the code statements.\
    \ The do-while is different in that it runs the code and then checks your condition.\
    \ It is less common but useful in special situations.\n\n```javascript\nlet donutsEaten\
    \ = 0;\ndo {\n  console.log(\"Donuts eaten \" + donutsEaten);\n  donutsEaten++;\n\
    } while (donutsEaten < 5)\nconsole.log(\"I'm full of Donuts!\");\n```\n\nThe do\
    \ while runs until the condition is false—Opposite of the two other types of loops\
    \ we have discussed. The output would look like this.\n\n```\nDonuts eaten 0\n\
    Donuts eaten 1\nDonuts eaten 2\nDonuts eaten 3\nDonuts eaten 4\nI'm full of Donuts!\n\
    ```\n\nWhen you need to loop through code JavaScript has a few options for you.\
    \ Like other programming languages, it has the for, while, and do-while loops.\
    \ Just make sure it fits your needs.\n\n## Surprisingly Improved JavaScript Variable\
    \ Scope You Need\n\n![Photo of a person looking at a screen](img/894414db2510c23b727da47fdb152ea2_75_0.png)\n\
    Photo by [Markus Spiske](https://unsplash.com/@markusspiske) on [Unsplash](https://unsplash.com)\n\
    \nMy wife changes topics quickly. I joke with her that she needs turn signals.\
    \ That way I can keep up with the shifting focus. She is talking about dinner,\
    \ and then we shift to our next vacation.\n\n### Scope\n\nOur code has a similar\
    \ concept with scope. Variables can come in and out of scope quickly. As developers,\
    \ we must keep this concept front and center.\n\nIn they have a few different\
    \ types of scope. We can use them accordingly. If you have done other coding you\
    \ have encountered similar concepts.\n\n### Global\n\nGlobal scope items are visible\
    \ everywhere. In our example, we create a visible variable in the function and\
    \ outside.\n\n```javascript\nlet myGlobalVariable = \"TheBigGlobalVariable\";\n\
    \nfunction logOutGlobalVariable() {\n  console.log(myGlobalVariable);\n}\n\nlogOutGlobalVariable();\n\
    ```\n\nI bet you are wondering, what if I add a variable in the function? This\
    \ leads us to the local scope example.\n\n### Local\n\nLocal variables are visible\
    \ only in the function. Here is an example to try this out.\n\n```javascript\n\
    let myGlobalVariable = \"TheBigGlobalVariable\";\n\nfunction logOutGlobalVariable()\
    \ {\n  console.log(myGlobalVariable);\n  let localVariable = \"TheLocalOne\";\n\
    \  console.log(localVariable);\n}\nlogOutGlobalVariable();\n\nconsole.log(localVariable);\n\
    ```\n\nIf we run this we will get an error on the last line.\n\n```\nconsole.log(localVariable);\n\
    \      ^\nReferenceError: localVariable is not defined\n```\n\nSo you can see\
    \ what happens when you mistakenly place a variable in the wrong spot.\n\n###\
    \ Block\n\nWhere local scope is within the function, [block scope](block scope)\
    \ is within the braces. Sometimes you create braces to identify some code. Let's\
    \ take a look to show you what I mean.\n\n```javascript\nconsole.log(\"here\"\
    );\n{\n  let blockScopeVariable = 0;\n  console.log(blockScopeVariable);\n}\n\
    // we can't reference blockScopeVariable here\nconsole.log(blockScopeVariable);\
    \ // won't work\n```\n\nAs you can see we create a block scope variable within\
    \ the braces. Then outside of that, it won't be able to be referenced.\n\n###\
    \ Gotchas\n\nThe scope can be confusing and lead to some errors. As you get more\
    \ experience with JavaScript, you can spot them early on. For instance, if we\
    \ look at this code snippet:\n\n```javascript\nconst colors = ['red', 'blue',\
    \ 'white'];\n\nfor (let i = 0, var l = colors.length; i < l; i++) {\n  console.log(colors[i]);\
    \ // 'red', 'blue', 'white'\n}\nconsole.log(l); // ???\nconsole.log(i); // ???\n\
    ```\n\nThe variables i and l will get reference errors. They are out of scope\
    \ similar to our previous examples. Dmitri Pavlutin explains this more in-depth.\
    \ He also covers a few more common mistakes we may make in coding.\n\nJavaScript\
    \ scope has a few basic principles you need to remember. Global scope is visible\
    \ everywhere. Local and Block scope are more focused. Overall you should use the\
    \ latter and avoid the former. Keep on coding!"
