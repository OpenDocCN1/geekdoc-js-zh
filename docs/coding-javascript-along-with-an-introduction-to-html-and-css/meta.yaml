    # Preface


    As a developer, I thought I knew enough of HTML and CSS. I was wrong. I had to
    come back to the basics again and again. That is why I put this together. Plus
    I feel like JavaScript should be here too.


    First, we start with some basics of HTML. You may have seen some of this before,
    but I find a review helpful. Then we cover some HTML5 changes. We touch on some
    of the major changes. Then we wrap up HTML with a discussion of tables, divs,
    and spans. These have confused me more than once...


    The second section is devoted to CSS. This helps class things up a bit. We cover
    CSS basics, the box model, and CSS3. Similar to HTML5 it has some interesting
    updates.


    The third part focuses on JavaScript basics. Covering topics like variables, functions,
    and conditionals. We also cover loops and closures too. In this quick start guide,
    we just focus on what you need to start working.'
