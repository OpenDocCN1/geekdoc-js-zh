    Less than\"); } // 小于\nif(9>=6) { alert(\"Greater than equal to\"); } // 大于或等于\n\
    if(4<=6) { alert(\"Less than equal to\"); } // 小于或等于\nif(4!=6) { alert(\"Not equal\
    \ to\"); } // 不等于\n```\n\n此外还有两个逻辑运算符：逻辑与（`&&`）和逻辑或（`||`）。它们被大量使用，但不必被它们吓到。\n\n\
    ```javascript\nconst value1 = 4;\nconst value2 = -3;\n\nconsole.log(value1 > 0\
    \ && value2 > 0); // 预期输出: false\n\nconsole.log(value1 > 0 || value2 > 0); //\
    \ 预期输出: true\n```\n\n逻辑与（Logical And）必须两个值都为 `true` 才会解析为 `true`。而逻辑或（Logical\
    \ Or）只需要其中一个为 `true` 即可。\n\n## switch\n\n`switch` 语句通过评估表达式来决定执行哪一条语句。然后它会运行代码直到遇到\
    \ `break` 语句。这里有一个示例，它可以告诉我们你想要的鞋子的价格。\n\n```javascript\nconst shoes = 'Reebok';\n\
    switch (shoes) {\n  case 'Nike':\n    console.log('Nike shoes are $200.');\n \
    \   break;\n  case 'Adidas':\n  case 'Reebok':\n    console.log('Adidas and Reebok\
    \ are $100 a pair.');\n    // 预期输出: \"Adidas and Reebok are $100 a pair.\"\n \
    \   break;\n  default:\n    console.log(`Sorry, we don't carry ${shoes}.`);\n\
    }\n```\n\n这段代码应该在控制台打印出 “Adidas and Reebok are $100 a pair.”。如果你没有添加 `break` 语句，`switch`\
    \ 语句可能会变得很棘手。\n\n```javascript\nconst shoes = 'Nike';\nswitch (shoes) {\n  case\
    \ 'Nike':\n    console.log('Nike shoes are $200.');\n  case 'Adidas':\n  case\
    \ 'Reebok':\n    console.log('Adidas and Reebok are $100 a pair.');\n    break;\n\
    \  default:\n    console.log(`Sorry, we don't carry ${shoes}.`);\n}\n```\n\n在这个例子中，我们移除了\
    \ `Nike` 语句中的 `break`。你知道这里会发生什么吗？它会打印 ‘Nike shoes are $200.’，然后接着打印 ‘Adidas and\
    \ Reebok are $100 a pair.’。这种类型的 Bug 在初学者程序员中非常常见。不用沮丧，你现在也是这个“俱乐部”的一员了！\n\n条件判断是\
    \ JavaScript 的基础。与其它语言类似，它允许我们快速提供解决方案。`if/else` 和 `switch` 都非常易于使用。\n\n## JavaScript\
    \ 拥有能让你大开眼界的强大循环\n\n![Photo of trees in a field](img/894414db2510c23b727da47fdb152ea2_71_0.png)\n\
    照片由 [Kier in Sight Archives](https://unsplash.com/photos/kier-in-sight-archives)\
    \ 提供，来源于 [Unsplash](https://unsplash.com)\n\n小时候，我们在农场种了一排防风林。那一排树每周需要浇几次水。打开软管，给第一棵树浇水，数到十。然后移到第二棵树，重复此操作。\n\
    \n与生活相似，我们的计算机程序也必须重复某些事情。这就是循环（loops）派上用场的地方。`for` 循环非常常见，所以我们从这里开始。\n\n### for\n\
    \n如果我们有一个书籍数组并且想要把它们打印出来，可以使用以下循环。\n\n```javascript\nfor (let i = 0; i < books.length;\
    \ i++) {\n    text += books[i] + \" \";\n}\n```\n\n`for` 循环由三个基本部分组成：开始（Start）、条件（Condition）和步长（Step）。\n\
    \n### 开始 (start)\n\n这是我们设置循环变量的部分。在我们的例子中，通常将其初始化为零。不过，你也可以将其设置为 10 然后进行递减计数。\n\
    \n### 条件 (condition)\n\n接下来是条件部分，用来检查是否需要再次运行此循环。我们的例子检查是否还有更多书籍需要循环遍历。如果结束了，我们就停止。\n\
    \n### 步长 (step)\n\n最后一部分是步长。它告诉我们每次迭代后会发生什么。我们的例子使用了递增运算符（`++`）。这是常规步长，但在特殊情况下我们可以执行其他操作。\n\
    \n### while\n\n如果我的狗 Baxter 想吃东西，我想创建一个循环，只要它还饿着就一直喂它。`while` 循环可以实现这一点。这是一个例子。\n\
    \n```javascript\nlet baxterHungry = true;\n\nwhile (baxterHungry) {\n  console.log(feedBaxter);\n\
    \n  checkBaxter();\n}\n```\n\n我们将变量设置为 `true`。然后我们一直喂狗，直到变量变为 `false`。`while`\
    \ 循环评估我们给它的条件，该条件必须解析为 `true` 或 `false`。\n\n如果为 `true`，循环内部的代码将被执行。然后我们再次评估条件。一旦条件变为\
    \ `false`，循环停止。\n\n### do-while\n\n`for` 和 `while` 循环是先检查条件，然后运行代码语句。`do-while`\
    \ 不同之处在于它先运行代码，然后再检查条件。它不那么常见，但在特殊情况下非常有用。\n\n```javascript\nlet donutsEaten =\
    \ 0;\ndo {\n  console.log(\"Donuts eaten \" + donutsEaten);\n  donutsEaten++;\n\
    } while (donutsEaten < 5)\nconsole.log(\"I'm full of Donuts!\");\n```\n\n`do while`\
    \ 会一直运行直到条件为 `false` —— 与我们讨论的另外两种循环类型相反。输出结果如下：\n\n```\nDonuts eaten 0\nDonuts\
    \ eaten 1\nDonuts eaten 2\nDonuts eaten 3\nDonuts eaten 4\nI'm full of Donuts!\n\
    ```\n\n当你需要循环执行代码时，JavaScript 为你提供了几种选择。像其他编程语言一样，它拥有 `for`、`while` 和 `do-while`\
    \ 循环。只需确保它符合你的需求即可。\n\n## 你需要的关于 JavaScript 变量作用域的惊人改进\n\n![Photo of a person\
    \ looking at a screen](img/894414db2510c23b727da47fdb152ea2_75_0.png)\n照片由 [Markus\
    \ Spiske](https://unsplash.com/@markusspiske) 提供，来源于 [Unsplash](https://unsplash.com)\n\
    \n我的妻子切换话题很快。我开玩笑说她需要装个转向灯，这样我才能跟上她不断转移的注意力。她可能正在谈论晚餐，然后我们突然转向下一次度假。\n\n### 作用域\
    \ (Scope)\n\n我们的代码中有一个类似的概念，叫做作用域。变量可以快速地进入和退出作用域。作为开发者，我们必须将这个概念放在核心位置。\n\n在\
    \ JavaScript 中，有几种不同类型的作用域。我们可以根据情况使用它们。如果你做过其他编程，你可能遇到过类似的概念。\n\n### 全局作用域 (Global)\n\
    \n全局作用域中的项在任何地方都可见。在我们的例子中，我们在函数内部和外部创建了一个可见变量。\n\n```javascript\nlet myGlobalVariable\
    \ = \"TheBigGlobalVariable\";\n\nfunction logOutGlobalVariable() {\n  console.log(myGlobalVariable);\n\
    }\n\nlogOutGlobalVariable();\n```\n\n我打赌你在想，如果我在函数内部添加一个变量会怎样？这就引出了局部作用域的例子。\n\
    \n### 局部作用域 (Local)\n\n局部变量仅在函数内部可见。这里有一个可以尝试的例子。\n\n```javascript\nlet myGlobalVariable\
    \ = \"TheBigGlobalVariable\";\n\nfunction logOutGlobalVariable() {\n  console.log(myGlobalVariable);\n\
    \  let localVariable = \"TheLocalOne\";\n  console.log(localVariable);\n}\nlogOutGlobalVariable();\n\
    \nconsole.log(localVariable);\n```\n\n如果我们运行这段代码，最后一行会报错。\n\n```\nconsole.log(localVariable);\n\
    \      ^\nReferenceError: localVariable is not defined\n```\n\n因此你可以看到，当你误将变量放在错误的位置时会发生什么。\n\
    \n### 块级作用域 (Block)\n\n如果说局部作用域是在函数之内，那么[块级作用域](block scope)则是在大括号 `{}` 之内。有时你会创建大括号来标识某些代码。让我们来看一个例子来具体说明。\n\
    \n```javascript\nconsole.log(\"here\");\n{\n  let blockScopeVariable = 0;\n  console.log(blockScopeVariable);\n\
    }\n// 我们不能在这里引用 blockScopeVariable\nconsole.log(blockScopeVariable); // 不起作用\n\
    ```\n\n如你所见，我们在大括号内创建了一个块级作用域变量。在大括号之外，它将无法被引用。\n\n### 注意事项 (Gotchas)\n\n作用域可能会令人困惑并导致一些错误。随着你获得更多\
    \ JavaScript 经验，你可以尽早发现它们。例如，如果我们看这段代码片段：\n\n```javascript\nconst colors = ['red',\
    \ 'blue', 'white'];\n\nfor (let i = 0, var l = colors.length; i < l; i++) {\n\
    \  console.log(colors[i]); // 'red', 'blue', 'white'\n}\nconsole.log(l); // ???\n\
    console.log(i); // ???\n```\n\n变量 `i` 和 `l` 将会触发引用错误（ReferenceError）。它们已经超出了作用域，与我们之前的例子类似。Dmitri\
    \ Pavlutin 对此进行了更深入的解释，他还涵盖了一些我们在编程中可能会犯的常见错误。\n\nJavaScript 作用域有几个你需要记住的基本原则：全局作用域处处可见；局部作用域和块级作用域则更为聚焦。总的来说，你应该使用后者并尽量避免前者。继续编程吧！\n"
