    In this case zeros were added to the beginning of the value and the bits on the
    right side fell off the number.


    # Variable Assignment Shortcuts


    Just like in C/C++, PHP has shortcut operators for assignment statements where
    the first operand is the variable and the result is stored in the same variable.
    Take a look at this example:


    ```

    $a = $a + 25;

    $a += 25; // This is the same exact statement as the line above.

    ```


    Take a look at Table 5.6 for a list of the variable assignment shortcuts available
    in PHP.


    | Table 5.6 Variable Assignment Shortcuts |

    | Shortcut | Example | Equivalent |

    | --- | --- | --- |

    | += | $x += $si | $x = $x + $si |

    | -= | $x -= $si | $x = $x - $si |

    | *= | $x *= $si | $x = $x * $si |

    | /= | $x /= $si | $x = $x / $si |

    | %= | $x %= $si | $x = $x % $si |

    | &= | $x &= $si | $x = $x & $si |

    | \|= | $x |= $si | $x = $x | $si |

    | ^= | $x ^= $si | $x = $x ^ $si |

    | .= | $x .= $si | $x = $x . $si |

    | >== | $x >>= $si | $x = $x >> $si |

    | <= | $x <<= $si | $x = $x << $si |

    | ++ | $x++ | $x = $x + 1 |

    | -- | $x-- | $x = $x - 1 |'
