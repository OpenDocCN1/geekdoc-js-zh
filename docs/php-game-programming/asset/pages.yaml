  md: '# Chapter 1 So What Is All This Server Stuff?


    Now that you know the requirements and have the Apache source files, you need
    to extract them from the tarball. To do this, type the following at the command
    prompt:


    ```

    $ gzip -d httpd-2.0.46.tar.gz

    $ tar xf httpd-2.0.46.tar

    ```


    This will create a new directory under your present working directory containing
    the source of the distribution. You will need to cd into that directory before
    compiling the server.

    $ cd httpd-2.0.46


    Now you need to configure the Apache source tree. This is done by using the configure
    script that is in the root directory of the distribution that you just extracted.
    Before you run this script there are several environment variables and flags that
    the configure script can take. The environment variables are listed in Table 1.3
    and always appear before the configure command.


    Depending on the setup of your computer, you will need to define some of these
    environment variables. An example of the configure command might look something
    like this:


    ```

    $ CC="gcc" ./configure --prefix=/sw/pkg/apache

    ```


    For a complete list of the configuration options, run `./configure--help`. After
    configure has run, it will take several minutes to test for the availability of
    features on your machine and to finish building the Makefiles.


    After the configure script has finished running you can build the distribution
    by typing at the command prompt. This will create the installation files. Be patient
    with this process; it usually takes approximately 3 minutes to finish. It could
    be longer depending on the number of modules you selected.


    Table 1.3 Environment Variables

    | Name | Description |

    | CC= | The name of the C compiler. |

    | CPPFLAGS= | Miscellaneous preprocessor options. |

    | CFLAGS= | Debugging and optimizations for the C Compiler. |

    | LDFLAGS= | Options for the linker. |

    | LIBS= | Library location information. |

    | INCLUDES= | Header file directories. The default is httpd. |

    | TARGET= | Name of the executable which will be built. |

    | SHLIB_PATH= | Options which specify shared library paths for the compiler and
    the linker. |'
