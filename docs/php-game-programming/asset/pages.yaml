  md: '# Installing the Windows Extensions


    Now that you have PHP installed you can add extensions to the installation. Table
    2.2 provides a list of the extensions available to Windows.


    Adding an extension is very easy—all you need to do is copy the dll you want and
    edit the php.ini file. First create a directory called extensions in the folder
    where you installed PHP (usually C:\PHP). Now extract the php-4.3.2-Win32.zip
    file that is included on the CD. Go to the directory file extracted and copy all
    of the dlls out of the dll directory and paste them into C:\WINDOWSsystem32 if
    you are on a Windows XP machine; or if you are on a Windows 98 machine, C:\WINDOWSsystem.
    Now back to the folder where the zip file extracted to and copy all the dll of
    the extensions folder and paste them into the extensions folder you created.


    Now that you have the dlls in their proper places, open up your php.ini file.
    It should be located in the C:\WINDOWS DIRECTORY\php.ini. Once you have that file
    open, go to the "Paths and Directories" section and look for extension_dir=".
    We want to set this to C:\PHP\extensions\. Now go to the "Dynamic Extensions"
    section and uncomment the following lines:


    +   1. extension=php_database.dll

    2. extension=php_gd2.dll

    3. extension=php_sockets.dll


    # Note


    > It is important that you put the trailing backslash on C:\PHP\extensions\


    Go ahead and save your php.ini file and exit. Now you have installed the extensions
    and the PHP interpreter. All that''s left is to test the installation to make
    sure it is parsing PHP pages.


    # Testing Your Installation


    PHP should be installed and working on your machine. Go ahead and test it out.
    Open your favorite text editor and type the following:


    ```

    <?php

    phpinfo();

    ?>

    ```'
