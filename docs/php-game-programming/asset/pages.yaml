  md: '# Support—Debugging Applications 333


    Notice that there are no errors on this page. As I mentioned, logic errors can
    be hard to track down something doesn''t work as expected.


    There is actually a fourth category, environmental errors, but you have absolutely
    no control over them. An environmental error is when there is an inherent bug
    in the program you are using. If you run into an untraceable error, chances are
    fairly high that it is an environmental error. However, you can''t just catch
    logic errors as environmental errors. If you believe you have run into an environmental
    error go to the Web site and take a look at the forums and the known bug lists.
    If you find something related to your problem, then there is most likely an easy
    fix for it. Usually the fix comes in the form of an update or a configuration
    setting.


    # PHP and Error Reporting


    PHP is capable of four levels of error reporting. PHP reports fatal errors, parser
    errors, warnings, and notices. You can set your level of error reporting in the
    php.ini file under the headers. Or you may set the level of error reporting on
    the fly for your application. To set the error reporting level on the fly you
    can use the following function:


    ```

    error_reporting(int level);

    ```


    The error_reporting() function takes an integer of the level of reporting you
    would like. Each of the four levels of errors has an integer value.


    +   * 1-Fatal Errors

    * 2-Warnings

    * 4-Parser Errors

    * 8-Notices


    So to figure out the level of error reporting you would like, you simply add the
    values together. This is like the permissions on a UNIX machine. For example,
    if you would like to report only fatal errors and warnings you would do the following:


    ```

    error_reporting(3);

    ```


    See how that works? Take a look at one more. Let''s say you wanted to report only
    notices, warnings, and fatal errors. You would use the following line:


    ```

    error_reporting(11);

    ```


    By the same token, if you supplied 0 as the value for the level then no errors
    would be reported. This is a handy function to use. While you are developing an
    application you can turn on your errors you can debug problems. But when you put
    into production you could simply set the error reporting level to 0 and have no
    fear that a user will see a big nasty error in the middle of a page.'
  merge: -1
  pgno: 349
