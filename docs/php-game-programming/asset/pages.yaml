  md: '# Using Existing Images


    If you want to render the image directly to the browser you must specify a content
    type. You can do this by using the built in PHP header() function. To render a
    .png image you have to specify a content type of image/png. To render a .jpeg
    you have to specify a content type of image/jpg. To render a WBMP you have to
    specify a content type of image/webp.


    ```

    // This renders a PNG to the browser

    header("Content-type: image/png");

    ImagePng($image);

    // This renders a JPEG to the browser

    header("Content-type: image/jpg");

    ImageJpeg($image);

    // This renders a WBMP to the browser

    header("Content-type: image/webp");

    ImageWbmP($image);

    ```


    # Using Existing Images


    Throughout this chapter you have seen how to create images, use colors, draw geometric
    shapes to the canvas, and render to your images. Now you will learn how to use
    existing images to create new images. There are six basic functions that you will
    use. The first two are the basis of using existing images to make new images.


    +   - ImageCreateFromJpeg(string filename)

    - ImageCreateFromPng(string filename)


    Each of these functions returns a resource to an image. You cannot create an image
    from a WBMP, only from .png and jpegs.


    ```

    // Get a resource to an existing image

    $image = ImageCreateFromPng("someimage");

    ```


    After you have opened a file and retrieved a resource you can copy, resize, resample,
    or merge the image with another image with the following functions:


    +   - ImageCopy(resource destinationImage, resource sourceImage, int destinationX,
    int destinationY, int sourceX, int sourceY, int sourceWidth, int sourceHeight)

    - ImageCopyResized(resource destinationImage, resource sourceImage, int destinationX,
    int destinationY, int sourceX, int sourceY, int destinationWidth, int destinationHeight,
    int sourceWidth, int sourceHeight)

    - ImageCopyResampled(resource destinationImage, resource sourceImage, int destinationX,
    int destinationY, int sourceX, int sourceY, int destinationWidth, int destinationHeight,
    int sourceWidth, int sourceHeight)'
  merge: -1
