  md: '# Chapter 8 = GD Graphics Overview


    and value the amount of blue that should be in the color. If you have never used
    RGB (red, green, blue) values before, each element of the color has a range of
    0 to 255; 0 being the lowest level and 255 being the highest level. Let''s say
    you wanted to allocate a color that was completely black. You would write a line
    of code that likes the following:


    ```

    $black = ImageColorAllocate($someImageResource, 0, 0, 0);

    ```


    What essentially means is that you will be able to use the $black as a color in
    the specified image resource. If you were working with two images simultaneously,
    you would not be able to use the variable $black in both images. You can use only
    the color you allocate to a specific image. If this seems a little confusing,
    take a look at the following code example and hopefully it will make things a
    little clearer:


    ```

    <php

    // Create two images

    $image1 = ImageCreate(100, 100);

    $image2 = ImageCreate(100, 200);

    // Allocate the colors to be used

    $black = ImageColorAllocate($image1, 0, 0, 0);

    // This is legal to do

    ImageRectangle($image1, 6, 6, 66, 42, $black);

    // This is illegal to do because black is not allocated to the image

    ImageRectangle($image2, 2, 6, 66, 42, $black);

    ?>

    ```


    # Filling the Image


    The ImageFill() function takes four arguments: an image resource, a starting x
    point, a y point, and the color to fill. ImageFill() does a flood fill of the
    entire image starting at the specified coordinates. Since this function fills
    the entire image there is no need to specify any other coordinates (0, 0). Take
    a look at the following example:


    ```

    <php

    $image = ImageCreate(100, 100);

    $red = ImageColorAllocate($image, 255, 0, 0);

    ImageFill($image, 0, 0, $red);

    ```


    ```

    // Show our Image

    header("Content-type: image/png");

    ImagePng($image);

    ImageDestroy($image);

    ?>

    ```


    Take a look at Figure 8.2 to see the results of using the ImageFill() function.'
