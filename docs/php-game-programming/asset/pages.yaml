  md: '# Graphics and HTML


    When laying out a table, always start in the upper left-hand corner of the image
    and make your way across the top in columns. This is what we call left-to-right
    order. Building a table in this manner will better allow you to see the final
    table layout in code. I have included an image on the CD under the Chapter 3 directory
    called interface.pcx. Go ahead and open the image so you can create a table layout
    with graphics.


    Now you have to take the image and break it into columns. I usually create three
    columns in a table. This seems to give very good flexibility in how the final
    product turns out—not to mention that it fits into our five-panel layout very
    nicely.


    To create the columns and rows you will need to drag grid lines onto your image.
    In Paint Shop this is done simply by dragging the mouse from the ruler to the
    image. Create two vertical grid lines in the image. Start the first grid line
    just to the right of the left-hand bar and work your across. Place your second
