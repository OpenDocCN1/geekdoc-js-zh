    I strongly suggest you give your pages logical names to relieve confusion when
    you edit them later; do not use page names like “Page 1”. Similarly, do not make
    your titles extremely long. A good rule of thumb is, if your title is longer than
    three to five words, then it is too long.


    Let''s go ahead and move on to the nifty gritty of HTML. If you are not clear
    on how all of these tags fit together, don''t worry—I will show an example soon.


    # The HTML Body


    Table 3.2 shows the BODY tag attributes.


    Everything that displays in your HTML page happens inside the `<body></BODY>`
    tags. I say “everything” I mean anything that is visible to the user. That includes
    images, text, tables, links, background colors, text colors, link colors, forms,
    and buttons.


    The majority of what we will be using in our games deal with layouts, forms, images,
    and some text formatting. There will not be much that text formatting because
    the majority- of our games will be images and forms, but you might want to create
    a help section for your game that looks professional, so take a look at the available
    text formatting tags.'
