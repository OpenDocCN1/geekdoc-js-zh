  md: '# Chapter 5 = Operators, Statements, and Functions


    The increment operator ++ and the decrement operator -- can appear before the
    variables, just as they can appear after the variables. The placement of the operator
    can change the order of events. For example, if the ++ is placed before the variable,
    the value is incremented and the value is returned. But if the ++ is placed after
    the variable, then the variable is pre-incremented and then the value is assigned.


    ```

    /* Used by itself, the increment operator has the same effect whether it appears
    before or after the variable */

    $x = 10;

    $x++; // x = 11

    ```


    ```

    $x = 10;

    ++$x; // x = 11

    ```


    ```

    $x = 10;

    $y = $x; // y = 10, and x = 11

    ```


    ```

    $x = 10;

    $y = ++$x; // y = 11, and x = 11

    ```


    > Caution

    This can affect your loops, so make you understand the order of operations occurring
    here.


    Before moving on to statements, I will cover operation precedence. I have mentioned
    it several times before and just want to make sure that you know what it means.


    # Operation Precedence


    Precedence is the order in which operations will occur, just like in the previous
    example where the increment operator was before or after the variable. Precedence
    can change the value of the expected outcome. Every operator in PHP has certain
    precedence; Table 5.7 shows each operator with the highest precedence first.


    # Statements


    What are statements? Statements provide the logic structure of your application.
    Conditional statements and loops give your programs the ability to make decisions
    based on limited rules.'
  merge: -1
  pgno: 102
