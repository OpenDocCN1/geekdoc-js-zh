  md: '# Regular Expressions and Pattern Matching


    Regular expressions are used to provide advanced string matching and manipulation.
    A pattern in a regular expression is nothing more than a set of characters that
    describes the nature of a string. For instance, you could find a literal string
    or validate that the input user was actually an e-mail address. Regular expressions
    have a mini-language of their own. Once you learn it, you can apply it to many
    other languages in addition to PHP. You will use regular expressions sparsely
    in your games. Most of the time it will be to simply validate that the input entered
    is in the form that you expect it, which is very important, isn''t it?


    Examine the following regular expression pattern:


    ```

    ^create

    ```


    The carat (^) this pattern tells the regular expression engine that it should
    only match this pattern on the beginning of strings. So the string "Create a new
    character" would meet the criteria for the match, but "To create a new character"
    would not meet the criteria. Regular expressions also offer you a dollar ($) to
    match strings that end with the pattern.


    If you take the previous example of ^create and turn it into the string created$,
    then it would no longer find a match on "Create a new character" but it would
    find a match on "Your character has been created." And if you combine the carat
    (^) and the dollar ($) together like this:


    ```

    ^create$

    ```


    you can now match on an exact word. So, "To create a new character" would now
    meet the criteria of the pattern. You are not limited to matching on literal characters
    either. You can also match on special characters as a new line or a tab. To do
    this, you would simply use the appropriate escape character, in your string. For
    instance, to match a tab at the beginning of a line you would do this:


    ```

    \t

    ```


    To match on a new line, a carriage return, or a form you would use the respective
    escape characters \n, \r, or \f. For punctuation marks you would also escape the
    characters; for example, a literal period would be \., and a literal backslash
    would be \\.


    So far you know how to match literals only, but you''ll need a way to describe
    the pattern more loosely. You can describe this pattern with character classes.
    Creating a character class is very simple; you simply place the content within
    brackets. For example, if you want to match all vowels you would create a character
    class that looks like this:


    ```

    [AaEeIiOoUu]*

    ```'
