    you are still using PHP 4.2, upgrade!


    I know you are saying., "Cool, but what if I want to do some font effects, like
    embossing? You can do that with ImageTTFText() too. It requires some careful placement
    of colors and text. Take the same example you just did but add a few lines of
    code to it.


    ```

    <php

    $image = ImageCreate(500, 200);

    $white = ImageColorAllocate($image, 255, 255, 255);

    $black = ImageColorAllocate($image, 0, 0, 0);

    $gray = ImageColorAllocate($image, 155, 155, 155);

    ImageFill($image, $white);


    ImageTTFText($image, 36, 0, 21, $black, "matisse_.ttf", "Cool Embossed Text!\");

    ImageTTFText($image, 36, 0, 0, 79, $white, "matisse_.ttf", "Cool Embossed Text!\");

    ImageTTFText($image, 36, 0, 80, $gray, "matisse_.ttf", "Cool Embossed Text!\");


    header("Content-type: image/png");

    ImagePng($image);

    ImageDestroy($image);

    ?>

    ```


    The first step in creating the effect that you see in Figure 8.14 is to render
    the black border around the text. To do this you just add 1 to the (x, y) coordinate.
    Next you want to render the text with white to create a separation between the
    gray and the black. To do this subtract 1 from the (x, y) coordinate. The final
    step is to render the text in gray at the specified (x, y) coordinate.


    The final text to learn is the ImageTTFBBox() function. This function takes four
    arguments. The first is the size of the font, the angle, followed by the True
    Type Font file, and lastly, the text you want to render. ImageTTFBBox() returns
    an array with the bounding box of the text. This is an extremely useful function
    when you need to make sure that the text you are going to render is within the
    image, unless you don''t cutting your text off in mid-sentence.


    The returned array is ordered exactly same as the ImageTTFText() function’s array.
    It starts at the lower left-hand corner of the box and works its way around in
    a counterclockwise fashion.'
