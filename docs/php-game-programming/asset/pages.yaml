- img_proc: true
  md: '# Appendix C ■ Support—Debugging Applications


    rebuilt when the configure.in is updated, so you should make sure to do that manually
    when you configure.in has changed. One symptom of this is finding things like
    ~VARIABLE@ in Makefile after configure or config.status is run.


    +   2. **I''m having problems PHP to work with Apache. If it can''t find httpd.h,
    but it''s right where I said it!**


    You need to tell the configure/setup script the top level of your Apache source
    tree. This means that you want to specify `--with-apache=/path/to/apache` and
    not `--with-apache=/path/to/apache/src`.


    +   3. **While configuring PHP, you may come across an error similar to the following:**


    ```

    checking lex: /../lex: command not found configure: error: cannot find output
    from lex: giving up

    ```


    Be sure to read the installation instructions carefully and note that you need
    both PHP and Bison to compile PHP. Depending on your setup, you will install Bison
    and Flex from either source or a package, such as an RPM.


    +   4. **When I try to start Apache, I get the following message:**


    ```

    fatal: relocation error: file /path/to/libphp4.so: symbol ap_block_alarms: referenced
    not found

    ```


    This usually comes up when you compile the Apache core program as a DSO library
    for shared usage. To reconfigure Apache, making sure to use at least the following
    flags:


    ```

    --enable-shared-max --enable-rule=SHARED_CORE

    ```


    For more information, read the top-level Apache install.


    +   5. **When you configure script says that it can''t find the files or library
    for GD, gdbm, or some other package!**


    You can make the configure script look for header files and libraries in non-standard
    locations by adding additional flags to pass to the C preprocessor and linker,
    as such:


    ```

    CPPFLAGS=-I/path/to/include LDFLAGS=-L/path/to/library ../configure

    ```


    If you''re using a c-variant for your login shell (why?), it would be:


    ```

    env CPPFLAGS=-I/path/to/include LDFLAGS=-L/path/to/library ../configure

    ```


    +   6. **When it is compiling the file language-parser.tab.c, it gives me errors
    that say yyname undeclared.**


    You need to update your version of Bison. You can find the latest version at www.gnu.org/software/bison/bison.html.'
