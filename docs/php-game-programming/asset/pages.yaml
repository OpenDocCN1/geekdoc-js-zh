  md: '# Conclusion


    You have successfully created a fully dynamic PHP game that is a pretty good clone
    of the classic Scorched Earth. There are, however, several things that you can
    do to make this game a whole lot better. The first thing you can do is get the
    dynamic positioning of the tanks more accurate. The second thing you can do is
    add some collision detection to see if the bullet has hit the terrain. The third
    step you could take to make the game better is to dynamically remove chunks of
    terrain hit by the bullet. You could probably figure out something with an arc
    to do this.


    You are getting extremely good at this PHP stuff, and you should be proud of yourself.
    Give yourself a big pat on the back. In the upcoming chapters you will perform
    some odds and ends. For example, in the next chapter you will look at how to use
    sockets in PHP. In Chapter 11 you will start to learn about MMORPG games and begin
    to create your own mini game. Sound like fun? Good, then let''s get to it.'
