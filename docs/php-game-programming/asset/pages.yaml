  md: '# printf() and sprintf()


    Each of these functions produces a formatted string. printf() prints the formatted
    string to the page, whereas sprintf() returns you the formatted string without
    printing it. Take a look at the sprintf() function:


    ```

    string sprintf(string format, mixed [args_]);

    ```


    # Note


    > In PHP, printf() and sprintf() function like in C/C++.


    The format string indicates how each of the arguments should be formatted. There
    are 10 different formatting arguments.


    +   - d Decimal integer

    - b Binary integer

    - o Octal integer

    - x Hexadecimal integer with lowercase letters

    - X Hexadecimal integer with uppercase letters

    - c Character whose ASCII code is the value of the argument

    - f Double

    - e Double using exponential notation

    - s String

    - % A literal percent sign


    The format string uses these arguments to create a string. For example:


    ```

    // The following line gets a string for printing later

    $strFormatted = sprintf("You fired your gun %d times", $numFired);

    ```


    See how that works? You simply create a string, and then put in the appropriate
    argument where you want one of your variables to show up. All arguments start
    with a %. So to put the literal percent sign, your string would look like this:


    ```

    printf("This is 40%%\n");

    ```


    Notice how the percent sign doesn''t take any additional arguments. You can also
    add padding or number formatting to your string. The delimiter to add padding
    is a single quote ('''') and then the specified padding element. For instance,
    to add a string of periods to a line after you would use ''.'' as the padding
    argument. Padding arguments are not required, and by default they are a single
    space. Take a look at the code example below to see how to use the padding argument.


    ```

    printf("%%-80s%%.3ds%%", $title, $number, "<BR>");

    ```'
