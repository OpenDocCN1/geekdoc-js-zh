    and "WDDX" are valid. WDDX is available only if PHP is compiled with WDDX


    session.gc_probability and session.gc_dividend


    +   - session.gc_probability specifies the probability when the garbage collection
    should start. This is calculated by using gc_probability/gc_dividend.


    session.gc_maxlifetime


    +   - session.gc_maxlifetime is the number of seconds at which the session data
    is seen as garbage and cleaned up.


    session.cookie_path


    +   - session.cookie_path is the path for which the cookie is valid.


    session.cookie_domain


    +   - session.cookie_domain is the domain for which the cookie is valid.


