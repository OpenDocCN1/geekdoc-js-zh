  md: '# Arithmetic Operators


    Just like every other programming language, PHP uses the basic mathematical operators
    (see Table 5.1).


    You have probably seen all of before; the only one that might be foreign to you
    is the modulus operator. All the modulus operator calculates the remainder of
    an operation.


    ```

    $x = 7 % 2; // Set $x to 1

    ```


    In the example above, 7 is divided by 2 and the remainder, which in this case
    is 1, is set to the value of the variable $x.


    As you have noticed now, you assign variables with the equals sign. This is called
    the assignment operator. Let''s say you wanted to create a variable with a value
    of negative 1. Here is how you would accomplish this:


    ```

    $x = -1;

    ```


    All fairly straightforward? Now take a look at the expressions used to compare
    values.


    # Comparison Operators


    Comparison operators are used to test a condition. The results of a comparison
    operation will be a Boolean value—i.e., either true or false.


    ```

    $i = 350;

    echo($i == 250);

    ```


    Here a variable, $i, is set to store some number, in this case 350. The value
    is compared to another value, 250. Because the two values are not equal, the example
    prints false to the screen. Take a look at Table 5.2 for a list of all the comparison
    operators available to PHP.


    I would like to stress a word of caution here: when using the equals (==) operator
    be careful to make sure you use two equals


    Table 5.1 Arithmetic Operators

    | Operator | Operation Performed |

    |---|---|n| + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus |


    Table 5.2 Comparison Operators

    | Operator | Operation Performed |

    |---|---|n| == | Equals |

    | != | Not equals |

    | <> | Not equals |

    | < | Less than |

    | > | Greater than |

    | <= | Less than or equal to |

    | >= | Greater than or equal to'
