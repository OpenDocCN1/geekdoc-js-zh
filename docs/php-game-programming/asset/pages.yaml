  md: '# Adding Animation to Your Flash Movie


    # Adding Animation to Your Flash Movie


    Adding animation to your Flash movie really isn''t that difficult. Up to this
    point you have used the add() member function of the SWMovie() class assuming
    that it does not return anything. But as a matter of fact it does return something.
    It returns a SWDisplayItem object. You can use this returned object to manipulate
    the shape that you are adding to Flash movie.


    ```

    // How you have been using the add() function

    $movie->add($shape);

    // The way you will be using the add() function

    $shapeHandle = $movie->add($shape);

    ```


    With this new SWDisplayItem you handle the object using one of two functions.
    The first is the move() function. It takes two arguments. The first argument is
    the x coordinate and the second argument is the y coordinate. The second function
    is the moveTo() function, and it also takes an x coordinate and y coordinate.


    Not only can you move a shape with the move() or moveTo() functions, you can also
    rotate a shape by using the rotate() function. The rotate() function takes a single
    argument specifying the number of degrees you wish to rotate the object.


    Let’s take the square example and draw the square in the upper left-hand corner
    of the Flash piece. Move it to a point and rotate the square by 45 degrees.


    ```

    <php

    $myMovie = new SWMovie();

    $myMovie->setSize(400, 300);

    $myMovie->setRate(30);

    $myMovie->setBackground(200, 200, 200);


    // Create a new shape and set the line style

    $square = new SWFShape();

    $square->setStyle(5, 0, 0, 255);


    // Draw a square

    $square->moveTo(1, 1);

    $square->drawLineTo(61, 1);

    $square->drawLineTo(61, 61);

    $square->drawLineTo(1, 61);

    $square->drawLineTo(1, 1);


    // Now add the shapes to the movie

    $squareHandle = $myMovie->add($square);

    ```'
