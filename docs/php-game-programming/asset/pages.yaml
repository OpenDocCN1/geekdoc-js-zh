    | Feature or Add-On Module | Argument to Configure | Description |

    | --- | --- | --- |

    | Checking for internal redirects | —enable-force-cgi-redirect | This checks to
    see if a given request was an internal redirect with respect to the server. |

    | Configuration file location | —with-config-path=DIR | Specifies the location
    of the configuration file php4.ini. |

    | Directory of executables | —with-exec-dir=DIR | When PHP runs in safe mode the
    executables are chosen only from the directory specified by DIR. |

    | Escaping quotes from data | —enable-magic-quotes | Data put into a database
    that may have quotes in it. Enabling this option escapes these quotes with a backslash.
    |

    | GPC variables | —enable-track-vars | GPC-GET, POST variables from forms are
    sent to the server. If this is enabled the server will track these variables.
    |

    | LDAP support | —with-ldap-DIR | Enables support for Light-Weight Access Protocol.
    |

    | Mcrypt support | —with-mcrypt-DIR | mcrypt encryption support. |

    | Regular expression library | —with-system-regex | Allows PHP to use the underlying
    OS''s regular expression library. |

