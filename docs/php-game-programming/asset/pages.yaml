  md: '# Chapter 4 Say Hello to PHP


    The period is used in regular expressions to represent any non-new-line character.
    So the pattern ^.s$ will match any two characters that end in "s" and begin with
    any non-new-line character.


    The question mark means that the previous character is optional. If you were matching
    doubles in a string your pattern would look like this:


    ```

    ^-[0-9]{0,}\.[0-9]{2}

    ```


    This may be a bit confusing, but it is actually quite simple to explain. The "\?-"
    means looking for a string that begins with an optional minus, followed by zero
    or more digits, "[0-9]{0,}". Now look for an optional period, "\.?", followed
    by zero or more digits, "[0-9]{0,}"


    The star is just like a wild card. It means match anything with zero or more of
    the previous character. You could further simplify the matching doubles pattern
    to:


    ```

    ^-[0-9]*\.[0-9]*

    ```


    Make sense? The star is the exact equivalent to saying {0}, which means zero or
    more of the previous characters, or the same thing as saying {1}. A simple example
    of this would be matching any integer number:


    ```

    ^-[0-9]+

    ```


    This is looking for a string that begins with an optional minus, followed by one
    or more digits. Another very handy function of the plus sign would be to validate
    email addresses, which is something you might want to do often in your Web-based
    applications.


    ```

    ^.+\@\..+

    ```


    This pattern might look complex, but if you break it down you will find that it
    is actually quite simple. First, it is looking for a string that begins with any
    non-white-space character, followed by any non-white-space character. Then it
    is looking for the literal character "@", followed by any non-white-space character.
    Then it looks for the literal character \.". followed by any non-white-space character.


    Now this pattern isn''t perfect, but it is close enough. To match on any non-white-space
    character is a broad scope, but for most purposes you just want to make sure that
    the user entered in a valid e-mail address.


    The final character to take note of regular expressions is the pipe (|). The pipe
    behaves exactly like a logical OR operator. This is extremely useful because you
    can check a string for certain words or characters. For instance:


    ```

    (G|St)jun

    ```'
