- img_proc: true
  md: "# Operators 81\n\nThe first of the three parts of the ternary operator is a\
    \ Boolean condition before the question mark (?). The second of the three parts\
    \ is a statement between the ? and the colon (:), which is executed if the condition\
    \ in front of the ? evaluates to true; and a value after the colon, which is returned\
    \ if the condition evaluates to false.\n\n# Note\n\n> For those of you who are\
    \ familiar with C/C++, the ternary operator in PHP acts exactly like the ternary\
    \ operator in C/C++.\n\nAs mentioned earlier, the ternary operator is a shortcut\
    \ for an if...else statement. Take a look at how the following if...else statement\
    \ is converted to using the ternary operator:\n\n```\nif($kingStatus == 1) {\n\
    \    echo(\"check\");\n} else {\n    echo(\"move = \" . $from . \" * \" . $to);\n\
    }\n```\n\n// Now for the same statement using the ternary operator\n$kingStatus\
    \ === 1 ? echo(\"check\") : echo(\"move = \" . $from . \" * \" . $to)\n\nSee how\
    \ much shorter that is? You get the results from one line of code that you did\
    \ from four lines of code. The ternary operator doesn't do much for readability,\
    \ it is completely up to you as how you would like to use it.\n\nThere is one\
    \ little thing that I would like to mention. As you have noticed in the previous\
    \ chapters and in the previous example, I put a period (.) in between the strings\
    \ in the example. All this does join the strings together. The period, when used\
    \ in between strings, is called the string concatenation operator.\n\n# Note\n\
    \n> Concatenation is just a fancy word for joining, or adding, two objects together.\n\
    \nLet's move on to bitwise operators and then to some variable assignment shortcuts\
    \ that will save you some typing."
  merge: -1
