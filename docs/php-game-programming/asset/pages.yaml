  md: "# Creating Images with Text\n\n![](img/21371e23636acf076ec4949f8b4c40f7_199_0.png)\n\
    \n**Figure 8.14** Creating cool text effects with the ImageTTFText() function.\n\
    \nNow create a function to put in our common.php file that will calculate the\
    \ width and height of the bounding box for the text. Your function will also need\
    \ to take four arguments, but you will want to return two integers. So your function\
    \ will actually need to take six arguments.\n\n```\n<?php\nfunction MyTTFBBox($size,\
    \ $angle, $fontfile, $text, $width, $height)\n{\n    // Get the bounding box\n\
    \    $arrBox = ImageTTFBBox($size, $angle, $fontfile, $text);\n\n    // Now calculate\
    \ the width and height of the box\n    $width = abs($arrBox[6]) - $arrBox[2];\n\
    \    $height = abs($arrBox[7]) - $arrBox[3]);\n}\n\n$myWidth = 0;\n$myHeight =\
    \ 0;\n\nMyTTFBBox(36, 0, \"matisse_.ttf\", \"Cool Embossed Text!\", $myWidth,\
    \ $myHeight);\n\necho(\"The Bounding box is $myWidth pixels by $myHeight pixels.\"\
    );\n?>\n```"
