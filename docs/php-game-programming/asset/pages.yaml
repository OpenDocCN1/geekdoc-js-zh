    | Syntax highlighting | —disable-syntax-hl | Disables the default behavior of
    highlighting PHP syntax. |

    | Warnings | —enable-maintainer-mode | Turns on compiler and dependency warnings.
    |

    | XML support | —with-xml | Enables support for XML. |

    | BC math functionality | —enable-bcmath | Adds support for Bench Calculator math
