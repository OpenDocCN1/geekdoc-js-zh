  md: '# Chapter 7 Playing with Chess and Databases


    For your purposes with this book you will use a non-relational database. Non-relational
    databases use files to store their information. They are called non-relational
    databases because the stored data is not related to any other data. Pretty logical
    name, if you ask me.


    # Non-Relational Databases


    As mentioned, a non-relational database stores its information in files. So how
    does it do this? PHP supports something called DBA. DBA stands for database abstraction,
    and this can handle many different database formats. A non-relational database
    stores its data, it stores in a key/value pair. In other words, each stored entry
    consists of a value with an associated key. These key/value pairs are simple strings,
    not char arrays, so you can also store binary information in these databases.
    You are not limited to the keys that you can choose because the keys are not stipulated
    by the database.


    DBA allows you to create databases; update databases; insert, update, and delete
    new entries; and traverse the entire database. The biggest bonus for you is that
    non-relational databases do not require any additional software. All you have
    to do is enable DBA support in the PHP interpreter by editing the php.ini file.
    This should already be completed; you went through this step when you installed
    the PHP interpreter.


    # Creating and Opening a Database


    PHP provides several functions for DBA. The first function you must know is the
    dba_open() function. This will allow you to create a database, write to a database,
    read a database, or truncate a database.


    ```

    int dba_open(string sPath, string sMode, string sHandler, [int nMode]);

    ```


    The first parameter of the dba_open() function is the path to the database; the
    second parameter is the mode in which you wish to open the database. Possible
    values for this are of the following:


    +   - r Open the database for reading.

    - w Open the database for writing.

    - c Create a new database.

    - n Truncate a database.


    The third parameter is the name of the handler for the type of database you would
    like to use. The third parameter can be any of the following values:


    +   - dbm -Berkley DB-style database (deprecated).

    - ndbm -A new Berkley DB-style database. This is very limited and is as'
