  md: '# How to Use Colors


    How cool is that!? You are quickly becoming a graphic expert in PHP. Again, don''t
    worry about the display code yet; I promise you will get to it later in this chapter.


    # Converting a True-Color Image to a Palette Image


    Converting an image is not as complicated as it sounds. As a matter of fact, this
    is very easy using the ImageTrueColorToPalette() function. ImageTrueColorToPalette()
    takes three arguments, the first of which is the image resource. The second is
    a Boolean value if it is set to true, then dithering will be used; otherwise dithering
    will not be. The third argument is the number of colors that should appear in
    the color palette of the new image.


    You could use this function to convert a .jpeg into an indexed-color image, but
    the decline in quality of the image would be noticeable. The most logical reason
    to use this function would be if you have a .png image that uses only 16 colors,
    but is saved as a true-color image for some odd reason. Take a look at the following
    example:


    ```

    <?php

    // Get the image that needs to be converted

    $image = ImageCreateFromPng(''truecolor.png'');

    // Now convert the image, since it is only using 16 colors you only need to specify
    16 colors

    ImageTrueColorToPalette($image, true, 16);

    // save the image

    ImagePng($image, ''convertedimage.png'');

    ?>

    ```


    See, you converted an existing image from a true-color image to an indexed-color
    image and saved it as a new all in three lines of code. I told you it wasn''t
    as complicated as sounded. Do some experimenting with this function on different
    images to see the effects. Convert a .jpeg photo with dithering, and then do the
    same without dithering to see the dramatic differences.


    # Counting Colors in an Image


    To get the total number of colors in an image, you can use ImageColorsTotal().
    ImageColorsTotal() takes one argument: the image resource for which you want to
    count the number of colors.


    ```

    <?php

    // get an Image

    $image = ImageCreateFromPng(''somegraphic.png'');

    // now count the colors in this Image

    ```'
