  md: '# Chapter 3 I Have Conquered the Server, Let Me at the Code!


    Take a look at the very FIRST element. It is just a drop-down list with three
    values in it. To specify the values in the drop-down list you simply use the OPTION
    tag. The OPTION tag has only two attributes that can be used: VALUE and SELECTED.
    VALUE sets the value for that element, and SELECTED specifies the element that
    is initially selected when the form loads. The text in the OPTION tags is exactly
    what the user will see.


    There isn''t much difference between the FIRST element and the SECOND SELECT element.
