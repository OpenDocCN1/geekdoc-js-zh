- img_proc: true
  md: '# Chapter 9 ■ Creating Battle Tank and Using Dynamic Terrain


    You will also need to determine what game states you will have. A good start is
    assuming that you will need three game states. The three default game states you
    should have are:


    +   - Game Starting


    +   - Game Running


    +   - Game Over


    If you need more game states you can add them later, but for now let''s assume
    those are the only three you will need. This seems like a good start.


    Now you must determine what graphics you will need. Before you get to creating
    dynamic terrain you will create the game with all static images. You will want
    to define an image for your tanks, an image for your terrain, and an image for
    the explosion that will occur when a shot detonates. Just to make sure this is
    clear, you will need to define the following:


    +   - Image for Tank #1


    +   - Image for Tank #2


    +   - Image for the Terrain


    +   - Image for the explosion


    When you create the explosion you will want to create an animated .gif. That way
    you have a pseudo effect of real-time animation. You will learn how to do this
    in the next section of this chapter, "Creating the Graphics."


    Since you will be doing calculations that deal with angle and velocity you will
    need some sort of constant to pull down the bullet. That''s right, dust off all
    old physics books you will need to define gravity. If you need any other constants
    you can add them later like with the game states.


    So what are the objectives of the game? You want to generate a turn-based game
    that takes angle and velocity as the user input. Once you have the angle and velocity
    you calculate where the explosion will occur. If you hit the opponent, you win;
    if the opponent hits you, then you lose. After you have a working version of the
    game you''ll want to go back and add dynamic terrain with all of your newfound
    graphics knowledge. Based on this description you will need six game states. You
    will use the three that you have already determined three more.


    +   - Game Starting


    +   - Game Menu


    +   - Game Init


    +   - Game Play


    +   - Game Win


    +   - Game Over'
