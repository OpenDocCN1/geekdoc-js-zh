  md: "# Chapter 9 = Creating Battle Tank and Using Dynamic Terrain\n\nThe next part\
    \ of the graphic you will be using is the sky background. The sky background is\
    \ called sky.jpg. The sky graphic is simply a gradient-blue background with some\
    \ cool clouds and a sun on it. The clouds are partially opaque to give them the\
    \ parent look.\n\nFor this first version of the game I have created a graphic\
    \ called terrain.jpg that is also included on the CD. Terrain.jpg contains the\
    \ sky background with the pre-drawn ground over the background. That's essentially\
    \ all the graphics that you will work with this first version of the game.\n\n\
    # Creating the Game Logic\n\nHere is where you get down and dirty. This is where\
    \ you take your plan and all your graphics and put them to work; this is where\
    \ you actually code the game. The first step is to decide how you want to lay\
    \ out your screen. Remember, you don't have to do this exactly like I do. For\
    \ this version I will have the game screen at the top of my table and the user\
    \ input at the bottom of my table. This seems like a logical layout to me, but\
    \ you can feel free to play with it however you like.\n\nI am going to take one\
    \ step further and break out my rendering function into three functions: one for\
    \ rendering the terrain, one for rendering the tanks, and one for rendering the\
    \ actual user interface. I will call them RenderTerrain(), RenderTanks(), and\
