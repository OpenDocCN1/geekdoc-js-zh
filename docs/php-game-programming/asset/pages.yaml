  md: '# Table 10.3 Common Protocols


    | Name/Constant | Description |

    |---|---|

    | ICMP | The Internet Control Message Protocol. It is used mostly by gateways
    and hosts to report errors in communication. |

    | UDP | The User Datagram Protocol. As mentioned previously, this is a connectionless,
    unreliable way to transmit data. |

    | TCP | The Transmission Control Protocol. This is the most common and reliable
    of the common protocols. TCP guarantees that its packets arrive to the recipient.
    If there were errors during transmission, TCP re-broadcasts the packets to make
    sure they show up error free. |


    Now that you know the three elements for creating a socket, take a look at the
    socket_create() function that PHP uses to create a socket. The socket_create()
    function takes three parameters: a protocol, a socket type, and a common protocol.
    The socket_create() function returns a resource to the socket if it was created
    successfully, or returns false if the socket was not created successfully.


    ```

    socket_create(int protocol, int socketType, int commonProtocol);

    ```


    Now that you can create a socket, how can you use it? PHP provides several functions
    to handle sockets. A socket; you can bind sockets to an IP, listen for communication
    on a socket, accept a socket; the list just ones you need to create, accept, and
    listen to a socket.


    ```

    <?php

    $commonProtocol = getprotobyname("*tcp");


    $socket = socket_create(AF_INET, SOCK_STREAM, $commonProtocol);


    $socket_bind($socket, ''localhost'', 1337);


    $socket_listen($socket);


    // More socket functionality to come

    ?>

    ```


    The example above is a start to creating your own server. The first line of the
    example, $commonProtocol = getprotobyname("*tcp");

    gets the protocol type that you are going to use by name. In this case you want
    to use the TCP common protocol. If you wanted to use UDP or ICMP you would pass
    "udp"'
