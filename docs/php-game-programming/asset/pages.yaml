  md: '# Chapter 11 ■ Kiddy Cartel—Creating Your Own MMO


    This should start the MySQL command prompt. Once you are in the MySQL command
    prompt you need to connect to a database, so type the following:


    connect kiddycartel


    This will connect you to the Kiddy Cartel database. Now that you are in the database
    you can add the necessary tables to the database. You will need to enter the following
    lines into the command prompt to create the neighborhoods table:


    ```

    CREATE TABLE neighborhoods

    (

    PlayerName CHAR(64) NOT NULL PRIMARY KEY,

    NeighborhoodName CHAR(64) NOT NULL,

    Password CHAR(64) NOT NULL,


    Bullies INT DEFAULT 0,

    PaperBoys INT DEFAULT 0,


    Mowers INT DEFAULT 1,

    LemonadeStands INT DEFAULT 0,

    Bakeries INT DEFAULT 0,


    Money INT DEFAULT 300,

    Lemonade INT DEFAULT 100,

    Cookies INT DEFAULT 50,


    WaterBalloons INT DEFAULT 0,

    PlasticBats INT DEFAULT 0,

    lingShots INT DEFAULT 0,


    LastTurnCredited DATETIME NOT NULL,

    Turns INT DEFAULT 50

    );

    ```


    This will create a 16-column table called neighborhoods. The first column stores
    the player name and is called PlayerName. You specify the data type of the column
    after you define the name of the column. The PRIMARY KEY keywords tell MySQL this
    is a unique column and that is what should be used to identify the records in
    this table.


    # Note


    > The Kiddy Cartel database consists of only one table. This game is for example
    purposes only and not to show you proper relational database design.'
