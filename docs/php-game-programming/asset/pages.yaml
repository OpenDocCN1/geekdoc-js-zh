  md: 'rendered very differently. The Kerning (the space between characters) and the
    leading (the space between lines) is totally different. In fact, the font itself
    might be changed to a different font altogether. Style sheets can mitigate some
    of these problems, but you''ll still run into layout issues. The point is that
    what the browser displays is not a photograph, so if you want your games to work
    on several different browsers you have to be careful about the types of elements
    (text and graphics) you use.


    # # The Web Server


    Now that you have a general understanding of how a client/server relationship
    works you can take a closer look at the heart of the beast: the Web server itself.


    A Web server runs what is called an HTTP daemon. This daemon handles all of the
    requests received on a particular port. The HTTP daemon will listen to two ports—port
    80 and port 443. Port 80 is the general Web port (http://). Port 443 is the standard
    for secure socket (https://). A Web server is also to be stateless. That is to
    say, no connection is maintained between the client and the server. This is extremely
    important to understand. It will make debugging or solving problems much easier,
    and more important, this concept will completely change the way you design your
    games. It won''t be as easy as making a library of functions or a simple engine
    and calling functions. You will need to develop a way to keep state.


    Think about that for a minute. What does that really mean? Well, it means that
    every time a particular event happens in your PHP game—e.g., the user enters coordinates
    and clicks the fire button—the browser will renew the connection to the server,
    resend the request to the server, and the server will then process the page and
    send it back. Now you need to reload all of your variables/states and update the
    page appropriately. Otherwise the whole game would start over, and that would
    be no fun. Don''t get me wrong—there are some client-side scripting languages,
    such as JavaScript, that you can use for clientide event processing. However,
    that is beyond the scope of this book, which focuses on how to make games with
    PHP. So how exactly do you do this?


    # # Sessions and Session Variables


    To keep state you need to utilize session variables. Every time you hit a Web
    site you start a session, and this session is identified by a unique GUID (Globally
    Unique Identifier). A session is defined as the period of time during which a
    user interacts with a Web application. As the programmer, you can store variables
    in this session. This is an extremely useful tool. You don''t have to keep track
    of each individual user and his state; you just have to reference the session.
    I''ll discuss how to reference sessions later on.'
  merge: -1
