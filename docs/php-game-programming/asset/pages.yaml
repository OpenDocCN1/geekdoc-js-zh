  md: "This will match any string that has the words \"Gun\" or \"Stun\" in them.\n\
    \n# Using the Regular Expression Functions\n\nPHP has five functions for handling\
    \ regular expressions. Two of them are used for searching and matching, two are\
    \ used for searching and replacing, and one is used for splitting.\n\nThe most\
    \ basic of the five functions is preg(). It takes two parameters with an optional\
    \ third parameter, and returns true if the pattern is found and false if the pattern\
    \ is not found.\n\n```\nbool ereg(string pattern, string source, array [regs]);\n\
    \nLet's go back to the e-mail validation pattern that was presented earlier to\
    \ see how to use\nthe ereg() function.\n\n$email = \"r@datausa.com\";\n$nResult\
    \ = ereg(\"^.+\\..+\", $email);\nif($nResult) {\n    echo(\"*This is a valid email\
    \ address*\");\n}\nelse {\n    echo(\"*This is an invalid email address*\");\n\
    }\n```\n\nThe optional third argument, array [regs], can store the matching substrings\
    \ of the pattern for later use. This means, for example, when you pass in an e-mail\
    \ address it can take the username, domain name, and top-level domain name and\
    \ store them in the array. Take a look at the following example:\n\n```\n$email\
    \ = \"r@datausa.com\";\n$nResult = ereg(\"^.+\\)\\(.+\", $email, $arrEmail);\n\
    if($nResult) {\n    echo(\"*$arrEmail[0] is a valid email address*\");\n    echo(\"\
    <br>Username:$arrEmail[1]<br>Domain:$arrEmail[2]<br>Top Level:$arrEmail[3]*\"\
    );\n}\nelse {\n    echo(\"*This is an invalid email address*\");\n}\n```"
