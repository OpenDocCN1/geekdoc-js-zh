  md: '# Chapter 3 = I Have Conquered the Server, Let Me at the Code!


    has attributes. To use these attributes tag would look like this: <tag_name attribute="someValue"></tag_name>.
    The only tags in HTML that don''t have you can be set in the tag <HTML></HTML><HEAD>,
    and <TITLE></TITLE>. All tags have one or more attributes that you can apply to
    them.


    Now that you know the basics of an HTML tag, take a look at the different elements
    of an HTML document and how it is structured.


    # The Almighty HTML Document


    An HTML document usually has an extension of .htm or .html; however, since you
    will be coding in PHP in the future you should get in the habit of saving your
    HTML documents with the extension .php. To begin, please refer to Table 3.1, which
    contains the four basic tags that make the beginnings of an HTML document.


    As you may guess, everything that goes into your HTML document will be surrounded
    by the <HTML> tags and anything you want to display will go in between the <BODY>
    tags. The <HTML> tags are important; even though the majority of browsers out
    there can handle a document without the HTML, there is still a chance that your
    page will be misinterpreted. It is safer to include them.


    # Note


    > Every tag starts with <name_of_tag> and ends with </name_of_tag>.


    The head section of your HTML document <HEAD></HEAD> is sort of like a quick reference
    for browsers. It supplies the document title, contains META data, and establishes
    relationships between HTML documents and file directories. For the most part,
    you will need be dealing with all of these in your application. The only tag you
    will really need to worry about is the <TITLE></TITLE> tag. All tag does give
    your page a title and display it in the title bar of the window, like in Figure
    3.1.


    | Tag | Description |

    | :--- | :--- |

    | <HTML>\</HTML\> | Creates a HTML document. |

    | <HEAD></HEAD> | Contains the document title and other information that is not
    displayed on the Web. |

    | <TITLE></TITLE> | Sets the title of the document. |

    | <BODY></BODY> | Contains the visible area of the document. |'
  merge: -1
