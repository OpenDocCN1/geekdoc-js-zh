  md: '# Processing Forms with PHP


    The fifth and final function that uses regular expressions is the split() function
    searches a source string for a pattern and breaks up the source string into an
    array based on matches of the pattern. A great use of the split function is if
    you are reading a comma-separated list in and need to break apart the strings
    so you can work with them.


    ```

    $strSource = "el, d4, e5, e6";

    $arr = split(",", $strSource);

    echo("$arr[0]<br>$arr[1]<br>$arr[2]<br>$arr[3]");

    ```


    The above example splits the source string on the literal character "*" and creates
    an array with each string in its own index. The results look like this:


    +   - el

    d4

    e5

    e6


    Unlike ereg_replace() and eregi_replace, split() has an optional third argument,
    You can specify a limit of how many elements you would like to split. Here is
    the full split function:


    ```

    array split(string pattern, string source, int [limit]);

    ```


