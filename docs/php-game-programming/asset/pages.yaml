  md: '# 216 Chapter 10 PHP and Sockets


    or "icmp" as the parameter to the getprotobname() function. An alternative to
    using the getprotobname() function is specifying either SOL_TCP or SOL_UDP as
    the final argument to the socket_create() function.


    ```

    $socket = socket_create(AF_INET, SOCK_STREAM, SOL_TCP);

    ```


    The second line of code creates the socket and returns the instance of the socket
    resource. After you have the socket resource, you need to bind the socket to a
    certain port and IP address.


    ```

    socket_bind($socket, ''localhost'', 1337);

    ```


    In this case you are binding the socket to your local computer (127.0.0.1) and
    you are binding the socket to port 1337. After everything is created and bound
    you must listen for a connection to come in the socket.


    ```

    socket_listen($socket);

    ```


    These are just four of the functions used in the wonderful world of sockets. Take
    a look at Table 10.4 to see all the functions that sockets use.


    # Table 10.4 Socket Functions


    | Function Name | Returns | Description |

    | --- | --- | --- |

    | socket_accept(resource socket) | resource | After you have created a socket,
    bound, and started listening on that socket, this function will accept incoming
    connections. |

    | socket_bind(resource socket, string address, int port) | bool | This binds the
    socket resource to the address and port specified. socket_bind() will return TRUE
    if it succeeds and FALSE if it fails. |

    | socket_clear_error([resource socket]) | void | This clears the error on the
    specified socket. If socket is not specified then it clears the global socket
    error. |

    | socket_close(resource socket) | void | Closes the created socket. |

    | socket_connect(resource socket, string address, [int port]) | bool | Attempts
    to connect to the socket resource. Returns TRUE if connection succeeded and FALSE
    if connection failed. |

    | socket_create_listen(int port, [int backlog]) | resource | Creates a new AF_INET
    socket that listens on the specified port. Backlog defines the length of the queue
    of pending connections |'
