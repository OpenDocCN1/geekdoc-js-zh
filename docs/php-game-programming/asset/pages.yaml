  md: '# 310 Appendix B = PHP Language Reference


    | Function | Returns | Description |

    | --- | --- | --- |

    | array_slice(array, offset [,length]) | Array | Returns a sub-array from the
    specified array starting at index offset. If the length is specified it will return
    an array starting from index offset with a specified length. |

    | array_slice(input, offset,length,[replacement]) | Array | Will remove a sub-array
    from input and replace it with the array replacement. |

    | array_unshift(array, variables) | Integer | Adds the values to the beginning
    of the array. |

    | array_values(array) | Array | Returns an array containing all the values of
    the array. |

    | array_walk(function, [parameter]) | Bool | Traverses the sliced array, applying
    the logic of a specified function to the elements in the array. |

    | asort(array) | void | Sorts in descending order, returning the key values. |

    | sort(array) | void | Sorts in ascending order, returning the key values. |

    | compact(varnames) | Array | Merges variables into a single array. |

    | count(array) | Integer | Returns the count of elements in the specified array.
    |

    | current(array) | Mixed | Returns the current element in the specified array.
    |

    | each(array) | Array | Returns a four-element of the array that contains the
    key and value of the current element. The key is contained in indices 0 and "key",
    and the value is contained in indices 1 and "value". |

    | end(array) | | Sets the last element of the array to current index and returns
    the value of that last element. |

    | extract(array,[extract_type], [prefix]) | int | This will import variables into
    the symbol table from the specified array. The extract-type parameters tells what
    to do if a collision is detected, and the prefix parameter specifies a prefix
    for the elements to be inserted. |

    | in_array(value, array) | Boolean | Returns true if the value exists anywhere
    in the array, otherwise it returns false. |

    | key(array) | Mixed | Returns the key of the current element in the array. |

    | ksort(array) | Integer | Sorts the array by its key values. |

    | list(variables) | void | Creates an array of the supplied variables. |

    | next(array) | Mixed | Moves the current index pointer to the next index in the
    array. This will fail if you have reached the last index in the array. |

    | pos(array) | Mixed | Returns the current element of the array. |

    | prev(array) | Mixed | Moves the current index pointer to the first index in
    the array. This will fail if you have reached the first index in the array. |

    | range(low, high) | Array | Returns an array of integers between low and high.
    |

    | reset(array) | Mixed | Returns the first element of the array and sets the current
    index to the first available index in the array. |

    | rsort(array) | void | Sorts the array in descending order. |

    | shuffle(array) | void | Sorts the array into a random order. |

    | sizeof(array) | Integer | Returns the number of elements in the supplied array.
    |

    | sort(array) | void | Sorts the array into ascending order. |

    | uasort(array, function) | void | Sorts the array using the logic of the specified
    function. |

    | uksort(array, function) | void | Sorts the array by the key values using the
    logic of the specified function. |

    | usort(array, function) | void | Sorts the array using the logic of the specified
    function.'
