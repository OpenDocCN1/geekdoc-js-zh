  md: '# Chapter 12 ■ Building Your PHP Skills


    movie is just a series of frames, sort of like a cartoon. So to display an animation
    you would flip through different frames.


    To set the frame rate you use the setRate() function. This function takes one
    parameter: an integer that specifies the number of frames per second that will
    be displayed.


    ```

    $myMovie->setRate(30);

    ```


    The above code snippet sets the movie to fly through its frames at 30 frames per
    second. Now that you have specified the dimensions of your movie and the rate
    at which your movie will need you to set a background color.


    To set the background color of your movie, the SWFMovie class contains a member
    function called setBackground(). The setBackground() function takes three arguments,
    integers. The first argument is the red component of the color you use. The second
    is the green component, and the third final argument is the blue component of
    the color you use. Take a look at the following code snippet. It sets the background
    color of your Flash piece to black.


    ```

    $myMovie->setBackground(0, 0, 0);

    ```


    Now that you have created a Flash piece, and I mean basic, you will want some
    way to display it to the screen. It''s a good thing that the SWFMovie class contains
    a member function called output() that writes the output to the browser. To use
