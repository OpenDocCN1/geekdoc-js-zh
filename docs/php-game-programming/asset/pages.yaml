  md: '# Starting the Chess Game


    able that you can loop through render the board, and an array is the most logical
    data structure. To make a move in chess you give the board from a square (e.g.,
    a1) and a to square (e.g., a3). If you are using an array, then you can loop through
    these columns and draw the board on the screen quite easily. Ideally you would
    use boards to represent positions of pieces on the board itself.


    A bit is a 64-byte array that holds a bit. A 1 would be in a square if the square
    is taken and a 0 would be in a square if the square is free. So you can represent
    an entire chess game by using 12 boards. One for the position of all the white
    pawns, white rooks, white bishops, white knights, white king, black pawns, and
    so on. With these bits your validation of moves and calculations of moves will
    be a lot quicker than looping through 64-bit array for the whole board. However,
    PHP does not support 64-bit integers so you cannot use bits unless you have a
    64-bit system.


    This is a very quick overview of chess programming. If you would like in-depth
    information about chess programming, check out other books on the subject. Let’s
    start programming your chess game.


