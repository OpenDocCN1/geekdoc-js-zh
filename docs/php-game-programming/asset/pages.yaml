  md: "# Chapter 8 ■ GD Graphics Overview\n\n![](img/21371e23636acf076ec4949f8b4c40f7_196_0.png)\n\
    \nFigure 8.12 Adding text with the ImageString() function.\n\nA more useful function\
    \ for rendering fonts to your canvas is ImageTTFTText(). The ImageTTFTText() function\
    \ takes eight arguments. The first is the resource to render the image; the second\
    \ argument is the size in which you want to render the text. The third argument\
    \ is the angle at which you want to render the text. This will allow you to render\
    \ the text sideways, diagonally, and even upside down--really is a powerful function.\
    \ The fourth and fifth arguments are the (x, y) coordinate you want the text to\
    \ start at. The sixth argument is the color you want to render the font. The seventh\
    \ argument is the True Type Font you want to use, and the final argument is the\
    \ text you want to render.\n\nThe ImageTTFTText() function returns an array with\
    \ eight elements that represent the four points that make the bounding box of\
    \ the text. Take a look at Table 8.1 to see what indices to which point.\n\n#\
    \ Table 8.1 Bounding Box Coordinates\n\n| Index | Description |\n|---|---|\\|\
    \ 0 | Lower left x position. |\n 1 | Lower left y position. |\n 2 | Lower right\
    \ x position. |\n 3 | Lower right y position. |\n 4 | Upper right x position.\
    \ |\n 5 | Upper right y position. |\n 6 | Upper left x position. |\n 7 | Upper\
    \ left y position. |\n\n> * Star in the lower left corner and work your way counter-clockwise\
    \ around the box.\n\n# Tip\n\nBy default, ImageTTFTText() renders anti-aliased\
    \ text. If you would like the font to be rendered as aliased text you need to\
    \ put a \"-\" (minus) sign in front of the color."
