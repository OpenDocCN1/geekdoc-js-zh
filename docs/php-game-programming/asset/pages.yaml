    # Saving Your Images


    Throughout the examples you have seen the use of ImagePng() and ImageJpeg(). These
    functions are used to save a file and render images to the browser. There is a
    third function called ImageWmp() that renders and saves WBMP files. All of these
    functions take two arguments. The first is required: the resource to the image.
    The second argument is optional; you can specify a filename that you would like
    to save the image data. Just make sure that if you save a file use the proper
    extension. Don''t try to save .png file using the ImageJpeg() function and vice
    versa.


    ```

    // This saves a PNG file

    ImagePng($image, "myimage.png");

    // This saves a JPEG file

    Jpeg($image, "myimage.jpg");

    // This saves a WBMP file

    ImageWmp($image, "myimage.wbmp");

    ```


    ![](img/21371e23636acf076ec4949f8b4c40f7_200_0.png)


    Figure 8.15 The MyTTFBBox() function.'
