    # Creating Dynamic Terrain


    Creating the dynamic terrain is actually quite easy. I have included the background
    as sky.jpg on the CD. You can use this to create your image. Once you have created
    your image just need to set the first two points to 0 and 450. This will put the
    first coordinate at the bottom left of the graphic.


    Once you have placed the first coordinate at the bottom left of the graphic you
    need to start at the next pixel you would like to put your next point on and traverse
    the entire width of the image. While you are traversing the entire width of the
    image you will be generating two points. One is the x portion that should be your
    loop counter, and the other is a randomly generated y coordinate.'
