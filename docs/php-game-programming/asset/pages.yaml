- img_proc: true
  md: "# Chapter 5 = Operators, Statements, and Functions\n\nThe switch statement\
    \ will compare the values of each case with the value of the variable, like if\
    \ you used an if...elseif else statement, but as soon as it finds a match it executes\
    \ that block of code. If the switch statement does not find a match, the default\
    \ case is executed. Notice the breaks at the end of each case. These are very\
    \ important because if you do not use a break, then the code will fall through\
    \ to the next case. All the breaks is to tell the code to stop executing the block\
    \ and continue to the next statement.\n\nIf you are familiar with other languages,\
    \ such as C/C++ or Java, you will be familiar with the switch statement. In fact,\
    \ the syntax is exactly the same. However, PHP's switch statement is much more\
    \ flexible for two major reasons: 1) Each case does not have to be a scalar value—and\
    \ 2) You can use variables in each of your cases. The following example demonstrates\
    \ variables in a case statement:\n\n```\n<?php\nswitch($_SESSION[\"GAME_STATE\"\
    ])\n{\n    case $bInitialized:\n    {\n        echo(\"The program is initialized\"\
    );\n        break;\n    }\n    case $bStarting:\n    {\n        echo(\"Starting\
    \ Game\");\n        break;\n    }\n    case $bRunning:\n    {\n        echo(\"\
    The game is running\");\n        break;\n    }\n    default:\n    {\n        echo(\"\
    Sorry the program is not initialized\");\n    }\n}\n?>\n```\n\n# Note\n\nThe only\
    \ variable types that are not valid in a case statement are arrays and objects."
