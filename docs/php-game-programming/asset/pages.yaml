- img_proc: true
  md: '# Chapter 2 = Waging the Configuration War


    # Note


    You can only configure PHP as an Apache module with the Apache server.


    When PHP is compiled as an Apache module it runs in the same memory space as the
    Apache server. This means two things to you: 1) you get a performance boost when
    interpeting pages, but 2) if you screwed if a page goes hairwire. If one of your
    PHP pages goes hairwire running in the same memory space as the Apache server,
    the Apache server will halt. This means you are dead in the water—no pages will
    be served until it is restarted. However, if you configure PHP as an interpreter
    you avoid the whole issue altogether. The disadvantage is obviously a minor performance
    hit, but it is negligible.


    On the other side of the coin is Microsoft Windows with IIS (Internet Information
    Server) or PWS (Personal Web Server). Distributions of PHP are available from
    IIS3 up to IIS 5; I have included the IIS and Apache installs on the CD provided
    with the book.


    # Building and Installing PHP on UNIX


    If you''re going to install PHP on a Windows platform you can continue on to the
    next section, unless this topic is relevant to you.


    The installation on UNIX-like systems is fairly straightforward. You need to generate
    the make files by running the autoconf script and carry out a make and install.
    I will be covering how to install PHP as a CGI Interpreter for simplicity''s sake.


    Let''s get started. The first step is to uncompress the distribution and extract
    the files.


    ```

    $ gzip -cd php-4.2.3.tar.gz | tar xvf

    ```


    Now you must go to the directory where the distribution was unpacked and run the
    configure script to generate the make files. You can pass other options to tell
    the configure script what modules would like to install.


    ```

    $ ./configure --with-gd=/usr/src/gd/2.0.4 --enable-gd-native-ttf --enable-gd-imgstrttf
    --with-jpeg-dir=/usr --with-png-dir=/usr

    ```


    The --with-gd option is an example of how you can specify at build-time what modules
    you like to install. Some of these extras or add-on modules are detected automatically;
    other add-ons you may need to specify specifically in the configure script. If
    you have any doubt that the module won''t be installed automatically you should
    specify it in the options. Refer to Table 2.1 for a list of the modules and their
    commands.'
  merge: -1
  pgno: 40
