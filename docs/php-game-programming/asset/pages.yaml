  md: '# Note


    ActionScript''s syntax is a lot like JavaScript. It uses a DOM to access its elements—e.g.,
    root.clientinfo.ip.


    ActionScript uses data types to define its variables. It used to be in Flash 4
    you did not to declare the data type of your variable. But since the release of
    Flash 5 you need to specify a data type. There are five basic data types that
    Flash uses:


    +   - Boolean

    - String

    - Number

    - Movie Clip

    - Object


    These data types are used in many languages and should be nothing new to you by.


    So how do you add ActionScript to your dynamic Flash pieces? You use the SWAction()
    class. The constructor for this class takes a single argument. That argument is
    an Action-Script command. For example:


    $action = new SWAction("stop();");


    The easiest way to see how all this works is to see an example, so take a look
    at the following example, in which a text box will display the position of a shape
    on the stage:


    ```

    <?php

    $myMovie = new SWFMovie();

    $myMovie->setSize(400, 300);

    $myMovie->setRate(5);

    $myMovie->setBackground(200, 200, 200);

    ```


    ```

    // Create a new morph object

    $morph = new SWFMorph();

    ```


    ```

    // Create a new shape and set the line style

    $square = new SWFShape();

    $square->setStyle(5, 0, 0, 255);

    ```


    ```

    // Draw the square

    $square->movePenTo(10, 1);

    $square->lineToTo(61, 1);

    $square->lineToTo(61, 61);

    ```'
