    You could have specified any (x, y) coordinate and you would have received the
    exact same results. Don''t worry too much about the display code right now; it
    will be covered later in this chapter.


    # Setting Your Transparent Color


    If you are using an image format that supports transparencies, such as .png, you
    can set the color you want to show as transparency by using the ImageColorTransparent()
    function (Figure 8.3). ImageColorTransparent() takes two arguments: the image
    resource, and the color you want to make transparent. To allocate a color to be
    transparent you still use the ImageColorAllocate() function. To understand this,
    take a look at the code below. In the following example a red circle is drawn
    over a dark background and then the color red is made transparent and the same
    image drawn again.


    ```

    <?php

    $image = ImageCreate(128, 128);

    $black = ImageColorAllocate($image, 0, 0, 0);

    $red = ImageColorAllocate($image, 255, 0, 0);

    // Make the background black

    ImageFill($image, 0, 0, $black);

    // Draw the circle

    ImageFilledArc($image, 64, 64, 110, 0, 360, $red, IMG_ARC_PIE);

    ```


    ```

    // Show our Filled image

    ImagePng($image, "redcircle.png");

    ```


    ```

    // Make the red transparent

    ImageColorTransparent($image, $red);

    ```'
