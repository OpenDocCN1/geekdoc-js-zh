  md: '# Chapter 11 ■ Kiddy Cartel—Creating Your Own MMO


    If you install PHP from the CD, PEAR and its default libraries and manager are
    already installed on your machine if you are running a UNIX platform. If you''re
    running a Windows platform you will need to install the PEAR manager.


    To install the PEAR manager, simply run the go-pear.bat file in the setup directory
    after you have installed PHP. If you do not install PHP from the CD included in
    this book, I suggest you go to http://pear.php.net and view the installation section
    of the documentation to install PEAR.


    # Installing MySQL


    Installing MySQL on Windows is a very simple task. All you need to do is to run
    the setup.exe program that comes with the Windows distribution. Once you have
    installed MySQL you will need to run the WinMySQLAdmin executable to set up your
    my.ini file.


    To install MySQL on Linux, the easiest way is to use an RPM package. For the purpose
    of this book you will only need to use the server and client RPM packages. If
    you would like to install other packages you can download them at www.mysql.com.


    To install the client and server as a standard you should use the following:


    ```

    $ rpm -i MySQL-server-VERSION.1386.rpm MySQL-client-VERSION.1386.rpm

    ```


    Once the package is finished you should find a new directory under /var/lib/ called
    mysql. The MySQL install also adds the proper lines to the /etc/init.d/ file so
    the MySQL server will start on boot.


    # Note


    > If you are upgrading from a previous version of MySQL you will need to stop
    the current running service in order to install the new MySQL.


    Once MySQL is installed you need to be able to grant permission to a user and
    to tables. If you skip this step you will only be able to connect to your databases
    as root. You can add a user later but I recommend that you do this now. On Windows
    you need to type the following at the command prompt:


    ```

    C:\ cd mysql\scripts

    C:\ mysql_install_db

    C:\ mysql\bin

    C:\ mysql_safe --user=mysql &

    ```


    Where --user=mysql you can put any user. For example, --user=mmdb would set up
    a user named cmmdb.'
