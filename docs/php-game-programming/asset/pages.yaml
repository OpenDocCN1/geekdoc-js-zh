  md: '# Creating Images with Text


    # Creating Images with Text


    You have seen how GD can handle drawing geometry on the canvas, but what if you
    have some text that you want to dynamically put into your graphic? GD provides
    you with three main functions for doing that. They are:


    +   - ImageString(resource image, int fontNumber, int x, int y, string text, int
    color)

    - ImageTTFText(resource image, int size, int angle, int x, int y, int color, string
    fontFile, string text)

    - ImageTTFBBox(int size, int angle, string fontFile, string text);


    The ImageString() function is fairly straightforward. It takes six parameters.
    The first is the resource to the image. The second is a font number, from 1 to
    5, that can be rendered by a built-in font to write out your text. The third and
    fourth arguments are the location that you want the text to start at. The fifth
    argument is the text that you displayed. The final argument is the color which
    you want the text to be displayed. This is the simplest of all three functions
    and gives you the least amount of flexibility.


    ```

    <?php

    $image = ImageCreate(320, 200);

    $white = ImageColorAllocate($image, 255, 255, 255);

    $black = ImageColorAllocate($image, 0, 0, 0);

    ImageFill($image, $white);

    ```


    ```

    ImageString($image, 1, 10, 10, "Text In Font 1", $black);

    ImageString($image, 2, 10, 30, "Text In Font 2", $black);

    ImageString($image, 3, 10, 50, "Text In Font 3", $black);

    ImageString($image, 4, 10, 70, "Text In Font 4", $black);

    ImageString($image, 5, 10, 90, "Text In Font 5", $black);

    ```


    ```

    header("Content-type: image/png");

    ImagePng($image);

    ImageDestroy($image);

    ?>

    ```


    The code example above goes through each font size that you can see the results
    of the ImageString() function. Figure 8.12 shows the results of the code. As you
    can see, it''s not a very pretty font.'
