- img_proc: true
  md: '![](img/21371e23636acf076ec4949f8b4c40f7_100_0.png)


    “or” together (0 and 0) the logical expression would be false or false, so the
    result is false. The exclusive or (^) operator acts like the "|” operator but
    will evaluate to true only if one of the bits is set to 1 and the other bit is
    set to 0. So the expression


    +   1 ^ 1

    evaluates to 0, but the expression

    1 ^ 0


    evalates to 1, because the expression can only be true one way.

    “~” (not) operator is very unique because it doesn''t operate on two bits. Instead
    it operates on one bit at a time. Remember the example in Table 5.5 for the “~”
    operator?


    ```

    -11 (1011) = -12 (1000000000001100)

    ```


    This is taking the binary number 1011 (11 in real numbers) and making each bit
    the opposite number and making it negative. It has the same effect as multiplying
    a decimal number by negative one (-1) and subtracting 1. The reason for this is
    because the most significant bit in a 32-bit value tells the number whether or
    not it is negative. The “~” operator won''t be used much, but it is handy to know.


    The final two bitwise operators that PHP supports are the left shift (<<) and
    the right shift (>>) Each of these operators takes two values: the left value
    is the number you want to shift bits on, and the second value is the number bits
    you are going to shift the first value by. For example:


    11 << 2'
