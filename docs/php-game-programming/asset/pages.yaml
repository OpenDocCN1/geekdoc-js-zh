  md: '# Using the File Formats in Your Document


    All hail the image tag. Yes, that''s right, the image tag. It allows you to display
    images on your page. What does it look like? Here is a breakdown of the image
    tag:


    ```

    <img>

    ```


    +   - accessKey – Sets or retrieves the accessibility key.

    - align – Sets the alignment of the image, possible values are absBottom, absMiddle,
    baseline, bottom, left, right, सबको, top.

    - alt – Alternate of the image. This will be displayed if the image is not shown
    or if someone has their browser set to not show images.

    - border – The amount of border, in pixels, that you want around your image.

    - id – Sets the ID of the image.

    - height – Sets the height of the image.

    - name – Sets the name of the image.

    - src – This is the location and source of the image.

    - usemap – Sets the URL to use as a client-side image map.

    - width – Sets the width of the image.


    The real heart of the tag is the src attribute. SRC is the source of the image.
    It can be a relative path or an absolute path. A relative path is relative to
    where you are in your directory structure. If you specify an absolute path it
    doesn''t matter where you are in the directory structure. For instance, a relative
    path would look something like this: <img src="../image.gif" border="0"> where
    an absolute path can look like this: <img src="http://www.somewhere.com/images/image.gif"
    border="0"> or like this: <img src="image.gif" border="0"> You will be using relative
    paths for two reasons: 1) it makes your application more scalable, and 2) it makes
    your application self contained. If you were to use relative paths and the image
    on somewhere.com disappeared, you would now have a broken image. But, if you keep
    everything within your application you won''t have this problem. The only way
    you will get a broken image is if you don''t reference it correctly.


    You should become very familiar with the image tag. You will be using it quite
    often, and knowing how to tweak the attributes of the tag will give you superb
    control over the appearance of the page. Take a look at an example using the image
    tag.


    ```

    <html>

    <head>

    <title>Image Example</title>

    </head>

    <body bgcolor="#ffffff">

    <img src="images/image.gif" border="0" align="right" alt="some image">

    ```'
