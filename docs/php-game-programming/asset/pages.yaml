  md: '# Operators 79


    signs. Otherwise the variable will be assigned to whatever you thought you were
    comparing it to.


    ```

    $i = 25;

    // This will assign 350 to the

    // variable $i and always be true

    if($i = 7)

    echo("It is equal to 7*");); // This will print every single time

    ```


    The assignment in an if statement is perfectly legal in PHP. In the example above,
    instead of checking the value of the variable with 7, it assigned the 7 to the
    variable and evaluated to true, giving results that were totally unexpected. I
    cannot stress the importance of using the proper operators.


    A simple way of solving the problem would be to put the literal value on the left-hand
    side of the operator,


    ```

    $if(350 = $1)

    ```


    This will generate an error because a value cannot be assigned to a literal. However,
    you still have the same issue if you are comparing two variables. If you find
    your code isn''t working like you thought it, make sure you are using the proper
    operator.


    # Logical Operators


    Logical operators are used to combine conditions, multiple expressions can be
    evaluated in a single statement. Take a look at Table 5.3 for a complete list
    of the logical operators.


    | Table 5.3 Logical Operators |

    | Operator | Operation Performed |

    | && | And |

    | || | Or |

    | and | And |

    | or | Or |

    | xor | Exclusive Or |

    | ! | Not |


    Notice that there are two operators for the "and" and the "or" operators. These
    operators give the same result but have different execution orders. The double
    ampersands will execute before the "and," and the double pipes will execute before
    the "or." I recommend picking one or the other and using it consistently. Not
    only will this help the readability of the code, will also help you when trying
    to debug problems that may occur.'
