    ```


    Name – Sets the name of this element.

    Rows – Sets the number of rows in characters for this text area box.

    Cols – Sets the number of columns in characters for this text area box.

    Tabindex – Sets the order in which this element will be selected if the user hits
    the Tab key.


    Wrap – Sets how the text in the element will wrap. Possible values are soft, hard,
    and off. Soft word wrapping means that the text will be displayed with word wrapping
    but submitted without carriage returns. Hard means text is displayed with word
    wrapping and submitted with carriage returns. Off means wrapping is disabled.


    There is one more control that needs to be covered: the SELECT control. This is
    a special control for two reasons: 1) it has its own child controls, called OPTIONS,
    and 2) it can create a drop-down or a list box.


    # Tip


    +   A drop-down list is an element that allows you to select a single item from
    a drop-down box. A list box is an element that allows you to select multiple items
    in a list.


    Take a look at the code example below to see how to use the SELECT control.


    ```

    <SELECT name="dropdown*">

    <OPTION VALUE="1">Element 1</OPTION>

    <OPTION VALUE="2" SELECTED>Element 2</OPTION>

    <OPTION VALUE="3">Element 3</OPTION>

    </SELECT>

    ```


    ```

    <SELECT name="listbox" SIZE="4" MULTIPLE>

    <OPTION VALUE="1">Element 1</OPTION>

    <OPTION VALUE="2">Element 2</OPTION>

    <OPTION VALUE="3">Element 3</OPTION>

    </SELECT>

    ```'
