  md: '# Chapter 3 = I Have Conquered the Server, Let Me at the Code!


    Great, you now understand when to use the different graphic types and how to lay
    out simple or complex tables. The only thing left is getting input into your game.
    This is where forms give your user a way to enter in the information that they
    want.


    # Creating Forms for Input


    Creating a form for input is quite simple. It is just like using every other HTML
    tag. A form essentially consists of three elements: the form itself, the fields
    in the form, and some element to submit the form. Take a look at the attributes
    of the form tag.


    ```

    <form></form>

    ```


    +   - Action - Sets the URL to which the form is posted for processing. Can be
    a relative or absolute path, or a mailto to process the form via email.

    - Enctype - Sets the MIME encoding type of the form. This is usually used when
    uploading files to the server.

    - Method - Sets how the form is going to be retrieved by the processing page.
    Possible values for this are POST (will post the information to the server) and
    GET (will put the name value pairs of the form on the query string).

    - Name - Sets the name of the form.


    # Note


    When you use a form in the examples in this book you will be using the POST value
    for the method. The main reason for this is that when you use the POST method
    you are not limited in the amount of data that can be sent to the HTTP server.
    The GET method limits you to the maximum length of a URL, which is 2048 bytes.
    2048 bytes is not a lot of information; you could fill that with just a few text
    fields.


    To allow your to enter information you must give them a way to get it in that
    information. HTML offers several form controls to allow you to do this.


    ```

    <INPUT>

    ```


    +   - Name - Sets the name of the element.

    - Type - Sets the type of input element. Possible values for this attribute are
    TEXT, BUTTON, CHECKBOX, RADIO, IMAGE, FILE, HIDDEN, RESET, SUBMIT, and PASSWORD.

