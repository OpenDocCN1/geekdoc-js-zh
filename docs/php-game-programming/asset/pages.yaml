  md: "# Updating an Entry in Your Database\n\nSo what is this example doing, exactly?\
    \ First it opens the database using the functions that you created earlier in\
    \ this chapter. Once the database is opened, you need to find the next available\
    \ ID. This ensures that you are inserting your data at the end of the file. To\
    \ do this you need to get the first key in the database, then loop through the\
    \ entire database until you reach the end. If a key is greater than the current\
    \ $nextID then the $nextID is set to the largest key. Once this loop is finished\
    \ you have the largest key in the database, the next available key is obviously\
    \ $nextID + 1. Now you can freely insert your record into the database. Once you\
    \ have called the dba_insert() function you need to check if it is successful.\
    \ But there is all there to\n\n# Updating an Entry in Your Database\n\nUpdating\
    \ records in your database is very similar to inserting records, but instead of\
    \ calling dba_insert() you call dba_replace(). The dba_replace() function also\
    \ takes arguments. Can you guess what they are? That's, the key you want to update,\
    \ the data you are going to update the record, with the database handle.\n\n```\n\
    dba_replace(string key, string data, int database);\n```\n\nNow, once you call\
    \ this function you must call the dba_sync() function or else your data will not\
    \ be saved to the database. This can be a pain in the butt to debug if you miss\
    \ putting in this little function.\n\n```\ndba_sync(int database)\n```\n\nSo,\
    \ to update a record you start exactly like you were inserting a record you need\
    \ to open the database. But this time you do not need to find the next available\
    \ record because you already know what record you want to update. If you don't\
    \ know what record you want to update then you probably shouldn't be updating\
    \ the database.\n\n```\n<?php\nfunction UpdateRecord($id, $value)\n(\n    global\
    \ $dbPath, $dbType;\n    $db = OpenDatabase($dbPath, $dbType);\n    dba_replace($id,\
    \ serialize($value), $db);\n    dba_sync($db);\n    dba_close($db)\n)\n?>\n```"
