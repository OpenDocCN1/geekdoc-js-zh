    # Creating Your Base Actions


    Each action that you can take requires some command to be executed. Since each
    command will need the same base variables you will create a class from which each
    subsequent command can inherit.


    Since each command can have a parent command, you will need a variable to store
    the parent. You will also need a variable to execute the commands. It would make
    sense to make each command execute its own functions instead of having C() class
    execute the command functions. Each command could possibly have sub-commands,
    so you also need the ability to store them. Since you store sub-commands you need
    to keep track of which command you are currently on. If anything goes wrong with
    the command, you will need to roll back anything that you have done. After all,
    you don''t need partial data floating around the game.


    Now that you know what each command needs to do, you can start to plan how you
    will code the class. Way I see it, each command can have four possible states.
    The command could error, it could be waiting for input, it could have more sub-commands
    to process, or it could be processing now. So let''s define some constants.


    ```

    // define some standard return values for commands.

    // Specific commands can return whatever they like.

    // Commands that are executed by Game must return one of these four values.

    define("CMD_ERROR", 1); // an error occurred

    define("CMD_CONTINUED",2); // the command has more steps to execute before it
    finishes

    define("CMD_FINISHED", 3); // the command has finished executing

    define("CMD_NEEDS_INPUT", 4); // the command needs human input before it can continue

    ```


    In the comments you use a reference to a class called CGame(). The CGame() class
    will handle running the game and will be covered later in this chapter.'
