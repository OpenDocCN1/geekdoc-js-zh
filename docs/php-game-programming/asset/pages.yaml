    \ the first statement in this expression evaluates to true, the whole expression\
    \ evaluates to true, and in turn the text is printed to the browser.\n\nThat's\
    \ basically for logical operators. Next you will take a look at the ternary operator.\n\
    \n# Ternary Operator\n\nAll of the logical operators that were just discussed\
    \ are considered to be binary operators, meaning that they perform their logic\
    \ using two operands. The ternary operator is special. It uses three operands\
    \ to perform a single operation. The ternary operator is used for quick-liner\
    \ if statements. You may have seen it before; it looks like this:\n\n```\n$x ==\
    \ 0 ? echo(\"yes\") : echo(\"no\");\n```"
