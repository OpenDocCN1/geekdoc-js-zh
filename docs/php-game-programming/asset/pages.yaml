    principle as the padding in a string. You simply specify how many digits you would
    like to see. If you specify a width for an integer you will see only many characters,
    and if you specify a width for a float it will see how many digits will appear
    after the decimal point. Take a look at the following code sample:


    ```

    $int = 4356;

    $dollars = 20;

    printf("%3d.2f", $someint, $dollars);

    // The output looks like 435 20.00

    ```


    In the example, %3d limits the argument to printing three characters. The %2f
    argument specifies that it is a floating point number, and that it should print
    two more characters after the decimal place.


    If this isn''t enough control over your number formatting, PHP offers you a number
    formatting function called number_format().


    ```

    string number_format(float num, int precision, string dec_point, string thousands_sep)

    ```


    The number_format() function can take up to four arguments and returns a string.
    Look at the following example:


    ```

    $num= 987654321.1234567;

    echo(number_format($num));

    echo(number_format($num, 2));

    echo(number_format($num, 7, chr(44), " * \));

    ```


    The output of the preceding code looks like this:


    ```

    987,654,321

    987,654,321.12

    987 654 321,1234567

    ```


    Now that you have complete control over formatting and the majority of functions
    for string manipulation, I''ll move on to regular expressions.'
