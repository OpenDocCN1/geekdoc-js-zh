    Align – Sets the alignment of the table row. Possible values are center, justify,
    left, and right. By default, it is selected.


    Bgcolor – Sets the background color of the table row. This overrides the bgcolor
    in the tag for the particular row it is specified on.


    Width – Sets the width of the table row.


    Height – Sets the height of the table row.


    Valign – Sets the vertical alignment of the table row. Possible values are middle,
