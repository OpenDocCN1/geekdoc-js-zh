  md: '# Using Existing Images 187


    I will break down each element of the `ImageCopy()` function in this example.
    The first argument is the destination image, which in this case is `$frame`. The
    second argument is the source image, which is `$dragon`. The next argument is
    what pixel you want to put the source image in the destination image. Since the
    frame ends at the coordinate (21, 31), that is where you want to put the source
    image. The next argument is what pixel you want to grab the image at. Since starting
    it at the coordinate (0, 0). The final arguments are the width and height of the
    source image. Since the dragon image fits perfectly inside the frame, you can
    just specify the actual width and height of the image. But what if the dragon
    does fit perfectly within the frame, you can use the same size as the frame?


    If both the images were the same size, you would have to do a little math to get
    the same results as Figure 8.17. You would want to grab the source image from
    the point you were placing the image. In the example above, it would be (0, 0).
    Then you would want to subtract that from the overall width and height of the
    image. In the example above, it would be (456, 431). So the new ImageCopy() line
    would look like this:


    ```

    ImageCopy($frame, $dragon, 21, 31, 0, 0, 456, 431);

    ```


    ![](img/21371e23636acf076ec4949f8b4c40f7_203_0.png)


    **Figure 8.17** Copying an image with the ImageCopy() function.'
