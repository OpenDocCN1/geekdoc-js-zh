  md: '# Drawing Basic Shapes on Your Empty Canvas


    # Note


    The ImageArc() function draws in a clockwise direction.


    The ImageArc() function puts 0 degrees at three o''clock, 90 degrees at six o''clock,
    180 degrees at nine o''clock, and 270 degrees at twelve o''clock. Although documentation
    on www.php.net says that the ImageArc() function draws counter-clockwise, it actually
    draws clockwise.


    Take a look at how you would use the ImageArc() function and the results.


    ```

    <?php

    $image = ImageCreate(320, 200);

    $white = ImageColorAllocate($image, 255, 255, 255);

    $black = ImageColorAllocate($image, 0, 0, 0);

    ImageFill($image, 0, 0, 0);


    ImageArc($image, 50, 30, 90, 90, 220, $black);


    header("Content-type: image/png");

    ImagePng($image);

    ImageDestroy($image);

    ?>

    ```


    ![](img/21371e23636acf076ec4949f8b4c40f7_191_0.png)


    The code example draws an arc that is 90 pixels wide and 90 pixels high, with
    its center point at (50, 30). It starts at the 0 degree mark and ends at the 220
    degree mark. Take a look at Figure 8.9 to see the results of the code.


    Figure 8.9 The ImageArc() function.'
