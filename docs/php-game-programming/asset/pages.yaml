    What is a database? A database provides persistent storage for information. There
    are three types of databases: relational databases, non-relational databases,
    and object oriented databases. In a relational database the data is stored in
    a set of tables and the information is related to each other by some unique identifier.
    Some examples of a relational database system are MySQL, SQL Server, and Oracle.
    Relational databases typically use a language like T-SQL to access the information
    inside a table.


    Object oriented databases use objects to represent data much like if you were
    creating classes and objects to represent your program''s internal data. Object
    oriented databases are fairly new, the algorithms for searching are not as well
    as a relational database, but this type of database gives great promise to the
    object oriented development community. Some of the most popular object oriented
    databases are Versant (www.versant.com), GemStone (www.gemstone.com), and ObjectStore
    (www.odi.com/odolive).


