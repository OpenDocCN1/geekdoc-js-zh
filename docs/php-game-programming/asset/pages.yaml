  md: '# Chapter 12 ■ Building Your PHP Skills


    When Ming draws a curve, it starts at the current position of the pen, which is
    called the source point. It then draws a curve to the anchor point, first passing
    through the control point. Take a look at Figure 12.3 to see a visual representation
    of this.


    The second function used to draw a curve is called drawCurveTo(). Just like the
    drawLineTo() function, it starts at the current pen position and draws its point
    to the anchor point, using the control point to define the severity of the curve.
    The drawCurve() function takes four arguments. The first two arguments are the
    x and y coordinates of the control point. The final two arguments are the x and
    y coordinates of the anchor point.


