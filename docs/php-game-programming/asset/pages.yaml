  md: '# Chapter 12 ■ Building Your PHP Skills


    Let''s break down the above example. First you create your master Flash movie
    and set its properties just like you have been doing. Then you create a new shape,
    in this case a square, and you draw it. Next you do something a little different.
    You add the shape to its own movie sprite or movie clip. This will allow several
    things but most importantly it will allow you to access some predefined properties
    that a movie contains. The next step is important; you must move the sprite to
    the next frame in order to show anything in your master movie.


    After you have created the movie clip that contains the shape you want to access,
    you create a new text box. This will allow you to enter text, although in the
    example you are using it to display text. After the text box is created, you add
    it to its own movie clip. Remember to move the movie clip to the next frame.


    # Caution


    Make sure you move sprites to the next frame. Otherwise you will never see the
    results on the Flash piece that is set to the browser.


    Now you essentially have three movies: the master movie, a movie clip containing
    your shape, and a movie clip containing your text box. To have a complete Flash
    movie you need to combine these into one piece. So you add the shape movie clip
    to your master movie and then you set a name. Setting the name of the movie clip
    will allow you to access it with ActionScript. Now you add the second movie clip
    to the master movie and also set the name of the movie clip.


    Now you have one movie with two movie clips in it. These movie clips and their
    elements can now be accessed and manipulated through ActionScript because you
    set the names of the clips. To access the clips, you start at the root of the
    movie, which is called _root. Then you go down one more level to the movie clip.
    Once, you can manipulate the movie clip, get its properties, or access elements
    that are nested further into the clip.


    Remember that an ActionScript requires an action to trigger it, so you need to
    add a frame to the master movie and then add the script. Once the movie moves
    to the next frame it will execute the script on the frame. In this case, it will
    put the coordinates of the movie clip into the text box.


    Take a look at Figure 12.9 to see the results of the above example.'
