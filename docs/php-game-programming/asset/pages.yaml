  md: "# Graphics and HTML\n\n41\n\nNow that you know almost everything there is to\
    \ know about images, you can concentrate on laying out a framework for your games.\
    \ To do this you must understand how tables work. I cannot stress enough important\
    \ this is for layout and for keeping your game together.\n\n# Tables\n\nBelieve\
    \ it or not, tables are your best friends. You'll use tables to control where\
    \ things end up on your page. You can make tables spread out and take up the whole\
    \ page, no matter how big the browser window is, or you can make the table very\
    \ rigid and occupy only part of the screen. The first step with tables is knowing\
    \ what you can do with them.\n\nAnything you can lay in a grid should be laid\
    \ out in tables. If you have an image that is curvy, lay a grid over it and find\
    \ out where you can slices to create a table. (I'll cover this in more detail).\n\
    \nThere are three basic elements in a table: there is the itself, a table row,\
    \ and a table cell. The tags for these are <table></table><tr></tr> and <td></td>,\
    \ respectively. You might wonder, \"Why is the tag for a table cell <td></td>?\"\
    \ Well, \"td\" stands for table data, so if I talk about the data I am referring\
    \ to the table cell.\n\nTo make a table, start the table tag, start a table row\
    \ tag, start a data tag, end a data tag, end the table row, and end the table\
    \ cell. Like this:\n\n```\n<table border=\"1\">\n<tr>\n  <td>Cell 1</td>\n  <td>Cell\
    \ 2</td>\n  <td>Cell 3</td>\n</tr>\n</table>\n```\n\nMake sense? For each cell\
    \ you need put a <td></td> between the <tr></tr> tags. For each row you need put\
    \ a <tr></tr> tag between the <table></table> tags. Just remember that you can\
    \ have a cell span multiple cells, and you can have a row span multiple rows,\
    \ but you can't have a cell in a lower wider than any row above it.\n\nRemember\
    \ that it is a grid. Take a look at the attributes of the table, table row, and\
    \ table data tags.\n\n```\n<table>\n```\n\n+   - Border – Sets the amount of border\
    \ you want around your table. If the value is 0 then no border will be displayed.\
    \ The default value of border is 0.\n\n+   - Cellspacing – Sets the amount of\
    \ space, in pixels, between the cells. The default value is 2."
