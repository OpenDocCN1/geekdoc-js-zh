  md: '# Creating a PHP Page


    Creating a PHP page is very similar to creating an HTML page, but there are two
    differences. First, your page extension is .php instead of .html and, second,
    you will also have PHP code. To start a block of PHP code you use the following
    delimiters: <?php, ?>, which will end the block of PHP code and. Take a look at
    the following PHP page:


    ```

    <HTML>

    <HEAD>

    <TITLE>First PHP Page</TITLE>

    </HEAD>

    <BODY BGCOLOR="#ffffff">

    <?php

    echo("This text was written out by PHP");

    ?>

    </BODY>

    </HTML>

    ```


    # Note


    > In ASP, the delimiters for code blocks are < % %>. If you like these better,
    you can set up your PHP interpreter to use them instead of the <?php ?> delimiters.


    All this does simply print the text “This text was written out by PHP” into the
    browser. You can also print out HTML tags in the echo statement, like this:


    ```

    echo("<p><b>This text is bolded and written out by PHP</b></p>");

    ```


    This is very important to keep in mind. Why? Well, if you needed some client-side
    code that used variables from the server you could write out the client-side code
    with PHP. I will not cover any of the client-side languages as JavaScript, but
    it is important to keep in mind.


    Another very important note is the ending of a PHP line of code. It ends with
    the semicolon (;). If you don''t have this, your code will not work properly.
    If you haven''t been coding in C/C++ or Java then you need to get into the habit
    of putting semicolons at the end of your code.


    These are the basics of creating a PHP page. Now you can move along to the data
    types available to PHP.'
