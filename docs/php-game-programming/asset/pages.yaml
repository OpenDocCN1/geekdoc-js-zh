    You have an image in memory that is 100 pixels wide and 100 pixels tall. You can
    now operate on this image using various functions provided by GD. Before you get
    into these functions, take a very quick look at the ImageCreateTrueColor() function.


    The ImageCreateTrueColor() function takes a width and height and it returns a
    resource to an image in memory. However, it has one key difference: it creates
    an image with a true-color palette instead of an indexed-color palette. This makes
    this function ideal for creating graphics with lists of different elements in
    them. You would use this function to create .jpeg images. You can also save the
    image as a .png, but it will be saved as a true-color .png file instead of indexed-color
    .png file.


    Now that you know how to create an image resource, you will want to know how to
    edit this resource.


    # How to Use Colors


    Before you can start drawing geometric shapes all over the place, you need the
    ability to select and use color. There are eight basic functions for color, as
    follows:


    +   - ImageColorAllocate(resource image, int red, int green, int blue)

    - ImageColorFill(resource image, int x, int y, int color)

    - ImageColorTransparent(resource image, int color)

    - ImageColorTrueToPalette(resource image, bool dither, int colors)

    - ImageColorsTotal(resource image)

    - ImageColorAt(resource image, int x, int y)

    - ImageColorsForIndex(resource image, int index)

    - ImageColorSet(resource image, int index, int red, int green, int blue)


    Each of these functions takes an image resource as its first argument. Now take
    a more in depth look at each of these functions to see how you will be able to
    use them to manipulate the colors on your canvas.


    # Allocating Colors to an Image


    ImageColorAllocate() takes four arguments: an image resource, a value for the
    amount of red that should be in the color, a value for the amount of green that
    should be in the color,'
