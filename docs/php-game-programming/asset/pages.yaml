- img_proc: true
  md: '# Creating the Graphics


    The game starting state tells the game to start the session then to the menu.
    While you are on the menu you are in the game menu state. Once you click to start
    a new game, that takes you to the game init state. This isn''t a big deal for
    the first version of the game, but it will come in handy when you generating the
    terrain. Once you leave the game init state you enter the game play state. This
    is where you are physically playing the game. If you hit the opponent, you enter
    the game win state, where you can display a "win" graphic. If you get hit by the
    opponent, you enter the game over state where you will put up a graphic telling
    the player that he has lost. Pretty simple, huh? Take a look at Figure 9.1 to
    see a screen shot of the final product should look like when you are all through.


    # Creating the Graphics


