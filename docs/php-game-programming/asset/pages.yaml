    You''ll notice that the first six lines of the code all require other files. These
    other files are other classes that the game uses. Since this is a command, you
    need to require the CCommand.php file so you can inherit from it. The CRenderCmd()
    allows you to pass the execution function as an html file to the renderer. This
    command handles everything that the user sees. The ClockTableCmd() and CUnlockTableCmd()
    locks and unlocks specified table in the Kiddy Carter database. Without these
    there would be a chance that a user could be updating the database at the same
    time that another user is updating the CWifyAccountInfof() looks in the database
    to make sure that the user isn''t creating a duplicate account. If they are, execution
    needs to stop and the user needs to know that the account already exists. The
    last required file is the one that actually creates the default neighborhood for
    the user.


    I am not going to explain each of these classes. There are just too many classes
    in this game to explain in each detail. Please notice that each command is structured
    similarly. Like the CD and take a look at each class. I will explain the CreateAccountCmd()
    class and another class that doesn''t have sub-commands to execute so you can
    see the difference in how to code them.


    All the CreateAccountCmd() classes implement a constructor and the Execute() function.
    The constructor tells the CCommand() class that the CreateAccountCmd() is the
    parent class. Then the class proceeds to set an array of sub-commands. Each of
    these subcommands will have its own logic in the Execute() function.


    The Execute() function uses a do...while loop and a switch statement to determine
    which command should execute. Each case in the switch statement corresponds to
    a sub-command. The sub-command looks like this:


    ```

    $this->m_arraySubCommands[0] = new CRenderCmd($this);

    $this->m_arraySubCommands[1] = new ClockTableCmd($this);

    $this->m_arraySubCommands[2] = new CWifyAccountInfof($this);

    $this->m_arraySubCommands[3] = new CCreateCharacterCmd($this);

    $this->m_arraySubCommands[4] = new CUnlockTableCmd($this);

    $this->m_arraySubCommands[5] = new CRenderCmd($this);

    ```


    So means the first case statement will contain the logic for the CRenderCmd().
    The second case statement will contain the logic for the ClockTableCmd(), and
    so on. Once one command has finished executing, the loop starts and moves on to
    the next command by incrementing the $m_nCurrentCommand variable.'
