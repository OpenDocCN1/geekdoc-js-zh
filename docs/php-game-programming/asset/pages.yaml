  md: '# Chapter 8 = GD Graphics Overview


    The ImageFilledArc() function behaves in the same way as the ImageArc() function.
    It also draws its arc starting from three o''clock and going in a clockwise direction.
    But the ImageFilledArc() function takes an additional argument. The ninth argument,
    after color, is the style in which the arc should be drawn. You can also use a
    bitwise OR to combine styles. Take a look at what the styles are and how they
    affect the arc.


    +   **IMG_ARC_PIE** draws a pie chart-styled arc with solid lines connecting the
    center point to the edges of the arc.

    **IMG_ARC_CHORD** draws a triangle that connects the beginning and end points
    of the arc.

    **IMG_ARC_NOFILL** if this option is used, it behaves like the ImageArc() function.

    **IMG_ARC_EDGGED** connects the end points of the arc to its center.


    Let''s use each of these individually in a code example and take a look at how
    each style affects the outcome of your arc.


    ```

    <?php

    $image1 = ImageCreate(320, 200);

    $image2 = ImageCreate(320, 200);

    $image3 = ImageCreate(320, 200);

    $image4 = ImageCreate(320, 200);


    $white = ImageColorAllocate($image1, 255, 255, 255);

    $white = ImageColorAllocate($image2, 255, 255, 255);

    $white = ImageColorAllocate($image3, 255, 255, 255);

    $white = ImageColorAllocate($image4, 255, 255, 255);

    $black = ImageColorAllocate($image1, 0, 0, 0);

    $black = ImageColorAllocate($image2, 0, 0, 0);

    $black = ImageColorAllocate($image3, 0, 0, 0);

    $black = ImageColorAllocate($image4, 0, 0, 0);


    ImageFilled($image1, $white);

    ImageFilledArc($image1, 50, 30, 90, 90, 0, 220, $black, IMG_ARC_PIE);

    ImagePng($image1, "pie.png");

    ImageDestroy($image1);


    ImageFilled($image2, $white);

    ImageFilledArc($image2, 50, 30, 90, 90, 0, 220, $black, IMG_ARC_CHORD);

    ImagePng($image2, "chord.png");

    ImageDestroy($image2);

    ```'
