  md: '# Support—Debugging Applications


    The error is pointing to the bracket at the end of the code. But this brace should
    be there, right? So there must be an error somewhere before line 7. Sure enough,
    the beginning brace was missed after the start of the loop. One way to fix this
    error is to add the brace. Another perfectly legitimate way to fix this error
    is to remove the ending brace altogether. Remember, a loop doesn''t have to have
    braces if there is only one line to execute.


    # Semantic Errors


    Semantic errors are a bit harder to track down syntax errors. The errors can be
    somewhat vague even though they give line numbers. Take a look at the following
    example:


    ```

    <?php

    socket_create($socket, ''localhost'', ''tcp'');

    ?>

    ```


    This generates the error shown in Figure C.3. This error says the second parameter
    is supposed to be a long but was given. The second parameter is perfectly legitimate.
    It is the third parameter that is incorrect. It should read:


    ```

    socket_create($socket, ''localhost'', SQL_TCP);

    ```


    See I mean when I say that the errors are somewhat vague? These errors are fairly
    easy to track down. Usually when you are at the specified line of code for a moment,
    the fix dawns on. If the fix doesn''t come to you then go to www.php.net and type
    in the function name in the search box. This will bring up the documentation for
    the particular function you can determine where you went wrong.


    ![](img/21371e23636acf076ec4949f8b4c40f7_347_0.png)


    Figure C.3 a semantic error.'
  merge: -1
  pgno: 347
- img_proc: true
  md: "# Logic Errors\n\nOf the three general categories of errors, logic errors are\
    \ the hardest to track down. The reason for this is because the code is syntactically\
    \ correct and runs. The code just doesn't run as expected. The most frustrating\
    \ part of logic errors is the code you wrote looks like it is working, but then\
    \ something occurs later down the line. Take a quick look at the following code\
    \ example and see if you can spot the logic error.\n\n```\n<?php\n$someArray =\
    \ array(\"Knife\", \"Gun\", \"Health\", \"Shield\");\nfor($loop = 0; $loop < count($someArray);\
    \ $loop++) {\n    if($someArray[$loop] == \"Health\") {\n        unset($someArray[$loop]);\n\
    \    }\n    echo(\"$loop = \" . $someArray[$loop].\"<br>\");\n}\n?>\n```\n\nDid\
    \ you spot the error? Take a look at Figure C.4 to see the output of this example\
    \ and if you can figure out what is happening.\n\nNotice how the output stops\
    \ at the third element in the array. Shouldn't the last line say 3 = Shield? The\
    \ error in logic here is that you are iterating through the number of elements\
    \ in the array. Once you hit the \"Health\" element you unset the index in the\
    \ array. This results in the count of the array being decreased by one. When the\
