    .png

    .wbmps. What''s that you? No support for .gifs? That is correct. There used to
    be a GD

    library out there at one time that supported the .gif file format, but since Unisys
    (the com-

    pany that owns the patent on LWZ compression .gifs use) changed their licensing

    agreements, GD has stopped supporting the .gif file format. This could change
    in the next'
