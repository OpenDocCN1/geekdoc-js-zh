  md: '# 204 Chapter 9 ■ Creating Battle Tank and Using Dynamic Terrain


    The GAME_PLAY state is where the whole game takes place. First it takes the user''s
    input. It knows that the user has clicked the Fire button in the command center
    and it retrieves the angle and velocity that the user entered. After that, it
    calculates the explosion that should occur. If the user hit the tank on the other
    end of the field, the game state is switched to GAME_WIN, the screen is updated,
    and the function returns without processing anything.


    However, if the user misses, the computer now goes to shoot. The computer randomly
    calculates a coordinate that is within the playing field and calculates where
    its shot should explode. If the shot hits the target, then the game state is set
    to GAME_OVER, the screen is updated, and the function returns. If neither player
    was killed, the game controls to the user and awaits another angle and velocity
    to be entered. Cool is that!


    To actually calculate the distance the bullet will travel you need to use a little
    physics. First off, the velocity needs to be broken into velocity in the x direction
    and velocity in the y direction. To do this you multiplying by the cosine and
    sine of the angle.


    ```

    $vx = $velocity * cos($angle);

    $vy = $velocity * sin($angle);

    ```


    Next, you calculate the hang time of the projectile. (In this case the projectile
    is the shell that is fired from the cannon.) You do this by multiplying 0.204
    by the y component of the velocity.


    ```

    $time = 0.204 * $vy;

    ```


    Now that you know the time the bullet is in the air you can calculate the maximum
    distance bullet can go. To do this you multiply the x component of the velocity
    by the y total to get the maximum range.


    ```

    $xMax = $vx * $vy;

    ```


    The final coordinate can be calculated by multiplying the y component of the velocity
    by and subtracting half of gravity multiplied times squares.


    ```

    $yMax = $vy * time - 0.5 * GRAVITY * ($time * $time);

    ```


    That''s. how you calculate where the explosion should occur. Now that you have
    an x and y coordinate you need to just check if it is in the same range as the
    playing field. If it is not, you need to put it there. Now you can render the
    explosion using a cascading style x pixels from the left of the browser and y
    pixels from the top of the browser.


    Figure 9.2 shows a shot of the game in action (well, as much action as can be
    portrayed in a still frame).'
