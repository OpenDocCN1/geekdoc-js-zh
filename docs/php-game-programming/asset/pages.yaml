  md: "# Chapter 8 = GD Graphics Overview\n\nyear, because Boutelle (the company that\
    \ makes the GD library) is planning to support .gifs as soon as the patent expires.\
    \ Meanwhile, have no fear because .png support all of the features of a .gif (as\
    \ was discussed in Chapter 3).\n\n# Installing GD\n\nJust in case you missed installing\
    \ the GD library when you were setting up PHP, I'll quickly go over it again.\
    \ I will also show you a little chunk of code that you can use to load the library\
    \ dynamically.\n\nTo install GD on a Linux or UNIX installation you will need\
    \ to recompile PHP with the --with-gd option. You can also compile the GD library\
    \ as a shared object so you can load the GD dynamically whenever you need to.\
    \ To do this you would use the --with-gd=shared option. Then, to load dynamically\
    \ at runtime, you would use the following line of code:\n\n```\ndl('gd.so');\n\
    ```\n\nTo install GD on a Windows platform you will need to copy the php_gd2.dll\
    \ that came with the installation package to the extensions directory specified\
    \ in the php.ini file. You will need to edit the php.ini file and uncomment the\
    \ following line:\n\n```\nextension=php_gd2.dll\n```\n\nThis will enable access\
    \ to the GD library. If you would like to load the extension dynamically with\
    \ your script you may do so with the following line of code:\n\n```\ndl('php_gd2.dll');\n\
    ```\n\n# Caution\n\nIn order to dynamically load an extension, the shared object\
    \ file (UNIX) or the dll file (Windows) must be in the extensions directory specified\
    \ in the php.ini file. If it is not, then the loading of the extension will fail\
    \ and none of the functions will be available to your game.\n\nLet's say you don't\
    \ know if the server you are hosting your files is on a UNIX or Windows server.\
    \ You can create a dynamically loading script that will work on either platform\
    \ very easily. Just take a look at the following code:\n\n```\n<?php\n(!extension_loaded('gd'))\n\
    {\n    if(strtoupper(substr(PHP_OS, 3)) == \"WIN\")\n    {\n        dl('php_gd2.dll');\n\
    \    }\n}\n```"
