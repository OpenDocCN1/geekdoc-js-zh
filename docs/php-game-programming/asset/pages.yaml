  md: "# Appendix C Support—Debugging Applications\n\n# Handling Errors\n\nHandling\
    \ errors in PHP is fairly straightforward. Most of the time a function will return\
    \ 0 if it fails for one reason or another, so to catch this you can always use\
    \ an if statement.\n\n```\n<?php\nif(!someFunction($value)) {\n    echo(\"An error\
    \ has occurred\");\n    return;\n}\n?>\n```\n\nThis allows you to do whatever\
    \ you want when an error occurs. You could just let users know something has gone\
    \ wrong, or even go as far as to take them to a detailed error page that allows\
    \ them to e-mail the administrator with a notification of the error.\n\nHowever,\
    \ there are some functions that will generate an error if they fail. If this is\
    \ the case you can suppress the error by using the at (@) symbol.\n\n```\n<?php\n\
    if(!@mysql_connect($db, $username, $password)) {\n    echo(\"An error has occurred\
    \ while trying to open the database\");\n    return;\n}\\?>\n```\n\nThis will\
    \ suppress the PHP error message but the function will still return 0, letting\
    \ you know that it has failed. Be aware that if you suppress a fatal error no\
    \ message will be displayed but processing of the script will halt halt in its\
    \ tracks. I recommend running your code without the suppression when testing to\
    \ see where errors occur and adding the suppression when you are finished debugging\
    \ your code.\n\nIf you suppress error messages you can always retrieve the full\
    \ error message through the $_php_error_ variable. This variable will always contain\
    \ the last error that occurred in the PHP interpreter.\n\nWhen writing this book\
    \ I ran into an error that occurred when trying to write to a db file that I created\
