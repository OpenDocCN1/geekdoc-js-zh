  md: '# INTRODUCTION


    Over the past few years the World Wide Web has grown tremendously. From its infant
    stages when a Web page was nothing more than text with HTML to dynamic, robust,
    extensible, rich multimedia content. Five years ago you would never have thought
    of playing a game on the Web, but today, with current scripting languages, you
    can do just that. PHP has transformed the Web as we know it. PHP provides quick,
    dynamic, real-time tools to bring to life to Web sites.


    PHP (otherwise known as the hypertext preprocessor) burst onto the scene in 1994
    when Rasmus Lendorf decided to release a package of “Personal Home Page” tools
    to the public. As interest for these tools grew, Rasmus decided to create his
    own scripting engine to parse input from an HTML form. The first version of PHP
    was born; it was called PHP/FI.


    The programming community quickly grew out of PHP/FI, and PHP soon became the
    API as you know it. If you know C/C++ or Java then learning the PHP constructs
    will be extremely easy.


    PHP is a wonderful tool with quick, on-the-fly, compilation. It also offers you
    a ton of libraries to work with to create graphics, Flash pieces, connections
    to databases, and connections to other computers.


    The main focus of this book is to take all of these tools and give you the knowledge
    and power to create turn-based games on the Web.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Why PHP?


    You might ask, why PHP? What is the difference between PHP and another embedded
    scripting language such as ASP? The main difference between these languages is
    obviously syntax. But beyond PHP PHP offers tons of libraries, all for free. The
    interpretation of code is faster than ASP, and connecting to a database requires
    only to two lines of code. The best part of PHP is that it is an object-oriented
    language, which inherently gives you a great deal of flexibility in your games.


    # Who Should Read This Book?


    This book is for anyone who wants to implement any Web-based games. An understanding
    of HTML would be helpful. I have included, a section dedicated to teaching some
    basics of HTML. Knowledge of your operating system will be helpful too. Since
    PHP is a cross-platform language I can cover only in the way of installing PHP.
    If something goes wrong during installation it will help if you know your operating
    system. This book is not for someone with advanced PHP skills.


    # What''s On the CD?


    +   - All the source code in the book

    - The PHP installer for Windows and UNIX

    - PHP libraries

    - Evaluation edition of Jasc Paint Shop Pro 8

    - ST Software''s PHP Integrated Development Environment

    - MySQL 4.0


    # How This Book Is Organized


    I intended this book to be read in sequential order. If you are a beginner and
    this is your first exposure to PHP I suggest that read the book in this manner.
    However, if you already have a knowledge of PHP you can feel free to skip around
    from chapter to chapter.


    This book is broken into four main parts. The first part of this book walks through
    setting up PHP and your Web server. The second part introduces you to PHP itself.
    The third part of this book starts creating your very own PHP Web-based games.
    In the fourth part of this book you take a look at all of the cool stuff PHP can
    do.


    Remember that all of the code that is shown in this book is provided for you on
    the included CD. There are also several applications included on the CD to help
    you develop your PHP games.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Introduction


    +   - Chapter 1—So What Is All This Server Stuff?. This chapter gives you an overview
    of server architecture and how the Web works generally. You will also learn how
    to install an IIS server and an Apache Web server.


    +   - Chapter 2—Waging the Configuration War. After you have installed your Web
    server, this chapter will walk you through the steps of installing the PHP CGI
    Interpreter. This chapter will also show you some of the basics for configuring
    PHP.


    +   - Chapter 3—I Have Conquered the Server, Let Me at the Code! This chapter
    will teach you the basics of HTML. It also includes a brief explanation of how
    images work in the World Wide Web.


    +   - Chapter 4—Say Hello to PHP. This chapter introduces you to the PHP language
    itself. You will learn the basic points of PHP, such as to create a PHP page,
    how to declare variables in PHP, and how to use regular expressions.


    +   - Chapter 5—Operators, Statements, and Functions. In this chapter you will
    learn about arithmetic, logic, and bitwise operators. You will also learn how
    to create logic statements and functions.


    +   - Chapter 6—Arrays! This chapter will teach you how to allocate and use arrays
    in PHP. After you have learned all the finer points of arrays you will create
    your first game.


    +   - Chapter 7—Playing with Chess and Databases. In this chapter you will learn
    about non-relational databases. You will also create a simple chess game that
    uses a non-relational database to keep track of moves.


    +   - Chapter 8—GD Graphics Overview. This chapter introduces Boutell''s GD library.
    You will learn how to create graphics, manipulate graphics, and add dynamic text
    to your graphics.


    +   - Chapter 9—Creating Battle Tank and Using Dynamic Terrain. In this chapter
    you will create a Scorched Earth game remake called Battle Tank. After you have
    created the initial game you will add dynamic terrain.


    +   - Chapter 10—PHP and Sockets. This chapter introduces you to socket programming
    with PHP. It describes how to send and receive data through sockets.


    +   - Chapter 11—Kiddy Cartel—Creating Your Own MMO. Here you will create your
    very own MMO game. In this game you will control your own neighborhood. It''s
    basically like kids mafia.'
  merge: -1
