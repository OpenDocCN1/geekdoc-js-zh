  md: '# CHAPTER 2


    # WAGING THE CONFIGURATION WAR


    +   - The Platforms

    - Building and Installing PHP on UNIX

    - Installation on Windows for IIS/Apache

    - Testing Your Installation


    HP is a very versatile language and comes with a myriad of options. PHP supports
    several hundred APIs and interfaces to other programming tools. So it would be
    worthwhile to configure what you want PHP to do and install the modules you need.


    You will be configuring the PHP interpreter with a few extras, one of which is
    Boutell''s GD library (GD SDK). The GD SDK allows you to generate and manipulate
    images on the fly, which I consider to be very important in the development of
    games. If you want to install other modules, feel free. The majority of the installs
    are very similar.


    Let''s get to it!


    # The Platforms


    Since PHP is not OS dependent we will be installing and configuring PHP for Unix
    and Windows.


    When you talk about UNIX, the Web server of choice is Apache. You can configure
    PHP in two different ways when you install Apache.


    +   - As a CGI Interpreter.

    - As an Apache module.'
  merge: -1
