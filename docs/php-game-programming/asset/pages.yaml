  md: '# Chapter 3 ■ I Have Conquered the Server, Let Me at the Code!


    Cellpadding – Sets the amount of space, in pixels, between the cell’s border and
    its content. The default value is 2.


    Width – Sets the width of the table. It can be either a number, in pixels, or
    a percentage. The percentage is based on how large or small the client window.


    Height – Sets the height of the table. It can also be a number or a percentage,
