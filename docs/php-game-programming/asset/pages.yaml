    echo("* There are " . $totalColors . \* colors in this image*");

    ?>

    ```


    # Caution


    The ImageColorsTotal() function works only with indexed-color images.


    # Retrieving a Color at a Point


    The ImageColorAt() function takes three arguments: the image resource, an x point,
    and a y point. ImageColorAt() will return the index of the color at the specified
    (x, y) pixel. Once you have this index you can use the ImageColorsForIndex() function
    to retrieve the red, green, and blue components of the specific color.


    ```

    <?php

    $image = ImageColorFromJpeg(''someimage.jpg'');

    $colorIndex = ImageColorAt($image, 100, 20);

    $colorArray = ImageColorsForIndex($image, $colorIndex);

    $red = $colorArray[''red''];

    $green = $colorArray[''green''];

    $blue = $colorArray[''blue''];

    ?>

    ```


    ```

    echo("* Red: " . $red . "<br>Green: " . $green . "<br>Blue:" . $blue);

    ?>

    ```


    # Caution


    The ImageColorAt() function works only with true-color images.


    The ImageColorsForIndex() takes two arguments: an image resource and a color index.
    It returns an array with the individual red, green, and blue components in each
    index. Once you have these components you could use the ImageColorAllocate() function
    to allocate a color for an image, or you could use the ImageColorSet() function
    to change a color in an image.


    The ImageColorSet() function takes five arguments. The first is the image resource
    that you want to operate on, the second is the index of the color you want to
    change, the third argument is the red component, the fourth is the green component,
    and the fifth and final argument is the blue component.'
