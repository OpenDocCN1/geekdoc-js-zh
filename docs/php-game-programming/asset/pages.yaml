  md: 'This will take the decimal number 11, which is the binary number 1011, and
    shift it by-two bits to the left. To make this example clearer I''ll extend the
    number 11 to 16-bits.


    ```

    0000000000000011 << 2 = 000000000101100

    ```


    See how it shifted all the bits to the left, by two trailing zeros were added
    to the binary number? Any bits beyond the 32-bit value fell off the left side
    and keep-number a 32-bit value. The right shift operator performs the equivalent
    of the left shift operator but the opposite way.


