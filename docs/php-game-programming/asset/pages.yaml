  md: '# APPENDIX A


    # HTML LANGUAGE REFERENCE


    His chapter is simply your guide to all the HTML functions available to you. Each
    element is listed followed by a description of what the element does, and, if
    there are any, a list of all the attributes the element can use.


    # <!-- and --> Comment


    Denotes a comment in HTML.


    # !DOCTYPE


    Declares the type of content and format of the document.


    # A


    Defines a hypertext link. The HREF or NAME attribute must be specified.


    | Attribute | Description |

    |---|---|

    | ACCESSKEY | Sets the accessibility key for this element |

    | CHARSET | Sets the character set used to encode this element |

    | CLASS | Sets the style sheet this element should use |

    | COORDS | Sets the coordinates for this element |

    | DATFLD | Sets the field of a given source to bind to this element |

    | DATSRC | Sets the source of the data for binding to this element |

    | DIR | Sets the reading direction for this element |

    | HREF | Sets the destination of this element |

    | HFLANG | Sets the language code of the resource pointed to by HREF |

    | ID | Sets the ID of this element |

    | LANG | Sets the language of this element |


    283'
